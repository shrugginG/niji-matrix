name: Deploy Niji Matrix to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: niji-matrix-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r niji-matrix/requirements-dev.txt
          npm ci --prefix niji-matrix-web
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static website
        working-directory: niji-matrix-web
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:pages
      - name: Validate data and scene contracts
        working-directory: niji-matrix-web
        run: |
          mkdir -p public/data
          cp -a dist-pages/data/. public/data/
          npm test
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: niji-matrix-web/dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
