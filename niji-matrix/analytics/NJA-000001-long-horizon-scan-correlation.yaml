schema_version: 2.0.0
type: detection-analytic
id: NJA-000001
strategy_ref: DET-000001
name:
  zh: 长周期多维主动扫描关联分析
  en: Long-Horizon Multidimensional Active-Scan Correlation Analytic
summary:
  zh: 跨越短期阈值和单一来源边界，重构时间稀释或多源协同的探测活动。
  en: Reconstruct temporally diluted or multi-source coordinated probing beyond short thresholds and single-origin boundaries.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 保留单次探测的来源、目标、端口、协议、响应结果、时间和首部特征；分别计算短窗口与长窗口统计，并对互补目标集合、共同工具指纹和重复失败模式进行聚类。短窗口阈值只能作为一项信号，不能作为唯一判定依据。
    en: Retain source, destination, port, protocol, response outcome, time, and header features for individual probes. Compute short- and long-window
      statistics, then cluster complementary target sets, shared tool fingerprints, and recurring failure patterns. Short-window thresholds should
      be one signal, not the sole decision rule.
data_requirements:
- source_type: network-traffic-flow
  name:
    zh: 网络流量流记录
    en: Network traffic flow records
  channel: null
  required_fields: &id001
  - source_ip
  - destination_ip
  - destination_port
  - protocol
  - timestamp
  - response_outcome
  - header_fingerprint
- source_type: network-traffic-content
  name:
    zh: 网络流量内容与协议元数据
    en: Network traffic content and protocol metadata
  channel: null
  required_fields: *id001
- source_type: log-source
  name:
    zh: 边界防火墙、负载均衡器和应用网关日志
    en: Perimeter firewall, load balancer, and application gateway logs
  channel: null
  required_fields: *id001
- source_type: external-sensor
  name:
    zh: 暗网、蜜罐或外部攻击面传感器
    en: Darknet, honeypot, or external attack-surface sensors
  channel: null
  required_fields: *id001
observables:
- zh: 长周期内重复出现的失败连接或低信息量请求
  en: Repeated failed connections or low-information requests over long periods
- zh: 多来源访问互补目标、端口或路径集合
  en: Multiple sources accessing complementary sets of targets, ports, or paths
- zh: 不同来源之间重复的首部字段、探测顺序或工具指纹
  en: Repeated header fields, probe ordering, or tool fingerprints across sources
- zh: 来源到目标的高扇出或目标到来源的高扇入关系
  en: High source-to-target fan-out or target-to-source fan-in relationships
correlation:
  window:
    zh: 根据资产风险和数据留存能力采用多尺度窗口，从分钟、小时扩展至数天或数十天。
    en: Use multiscale windows—from minutes and hours to days or tens of days—according to asset risk and retention capacity.
  dimensions:
  - source
  - target
  - port
  - time
  - tool_fingerprint
false_positives:
- zh: 经授权的漏洞管理和资产发现平台
  en: Authorized vulnerability management and asset discovery platforms
- zh: 搜索引擎、安全研究测量和互联网测绘服务
  en: Search engines, security research measurements, and Internet mapping services
- zh: CDN、健康检查和监控系统
  en: CDN, health-check, and monitoring systems
blind_spots:
- zh: 数据保留时间短于扫描周期
  en: Retention shorter than the scan campaign
- zh: 多安全域日志无法统一时间、资产和来源身份
  en: Logs across security domains cannot align time, assets, and source identities
- zh: 仅采样流量导致弱探测事件丢失
  en: Sampling drops low-volume probe events
tuning_guidance:
  paragraphs:
  - zh: 应维护经授权扫描器、搜索引擎测量、健康检查和监控平台的已知来源与行为基线，但不能仅按来源地址永久放行。阈值应根据资产重要性、正常访问量和数据留存能力分别调整。
    en: Maintain known-source and behavioral baselines for authorized scanners, search-engine measurements, health checks, and monitoring platforms,
      but do not permanently allow activity solely by source address. Tune thresholds separately according to asset criticality, normal traffic
      volume, and retention capacity.
