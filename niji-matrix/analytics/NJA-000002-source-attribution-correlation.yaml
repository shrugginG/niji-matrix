schema_version: 2.0.0
type: detection-analytic
id: NJA-000002
strategy_ref: DET-000002
name:
  zh: 扫描来源归因与协同关系分析
  en: Scan-Origin Attribution and Coordination Analytic
summary:
  zh: 区分真实协同来源、诱饵地址、代理中继和可能的间接扫描来源。
  en: Distinguish real collaborating origins from decoys, spoofed addresses, proxy relays, and indirect scan sources.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 对来源地址之外的稳定特征进行聚类，并结合反向路径、响应完成度和多点观测判断来源是否真实参与。不要把单个 IP 地址直接等同于攻击主体。
    en: Cluster stable features beyond the source address and combine reverse-path evidence, response completion, and multi-vantage observation
      to determine whether an origin actually participated. Do not equate a single IP address directly with an adversary identity.
data_requirements:
- source_type: network-traffic-flow
  name:
    zh: 网络流量流记录与首部字段
    en: Network flow records and header fields
  channel: null
  required_fields: &id001
  - source_ip
  - route
  - ttl
  - autonomous_system
  - response_completion
  - timestamp
- source_type: log-source
  name:
    zh: 路由、反向路径、NAT 和代理日志
    en: Routing, reverse-path, NAT, and proxy logs
  channel: null
  required_fields: *id001
- source_type: external-sensor
  name:
    zh: 多个边界传感器的时间同步记录
    en: Time-synchronized records from multiple perimeter sensors
  channel: null
  required_fields: *id001
observables:
- zh: 多来源探测报文中的共同首部编码或工具指纹
  en: Shared header encodings or tool fingerprints across multiple probe origins
- zh: 只有部分来源能够完成双向交互
  en: Only a subset of origins completing bidirectional interactions
- zh: 来源地址与路由、TTL、自治系统或响应可达性不一致
  en: Source addresses inconsistent with route, TTL, autonomous system, or response reachability
correlation:
  window:
    zh: 从单次探测会话扩展至完整扫描活动周期。
    en: Extend from individual probe sessions to the full scan campaign.
  dimensions:
  - source
  - route
  - response_completion
  - sensor_vantage
false_positives:
- zh: 大型云扫描平台的共享基础设施
  en: Shared infrastructure of large cloud scanning platforms
- zh: NAT 后的合法集中访问
  en: Legitimate concentrated access behind NAT
- zh: 安全厂商使用多个已登记扫描地址
  en: Security vendors using multiple registered scanner addresses
blind_spots:
- zh: 缺少路由或中间设备日志
  en: Missing routing or intermediary-device logs
- zh: 只在单一位置观察单向流量
  en: One-way traffic observed from a single vantage point
tuning_guidance:
  paragraphs:
  - zh: 应结合 NAT、代理、云共享基础设施和已登记安全扫描平台调整归因判断。单一 IP、地理位置或网段相似性不能作为协同或攻击主体身份的充分证据。
    en: Tune attribution decisions with awareness of NAT, proxies, shared cloud infrastructure, and registered security-scanning platforms. A
      single IP address, geographic location, or subnet similarity is not sufficient evidence of coordination or adversary identity.
evidence_refs:
- REF-000003
- REF-000004
- REF-000005
