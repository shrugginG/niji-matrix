schema_version: 2.0.0
type: detection-analytic
id: NJA-000003
strategy_ref: DET-000003
name:
  zh: 探测报文分片规范化与重组分析
  en: Probe Fragment Normalization and Reassembly Analytic
summary:
  zh: 在应用扫描检测前统一重组分片，并识别异常小分片、重叠分片和重组歧义。
  en: Normalize and reassemble fragments before scan analytics, and identify unusually small fragments, overlaps, and reassembly ambiguity.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 在执行端口、协议和连接模式分析前，按照与受保护终端一致的策略规范化并重组分片；对重叠、过小、顺序异常和未完成重组建立独立告警，同时保留原始分片用于取证。
    en: Before port, protocol, and connection-pattern analysis, normalize and reassemble fragments using a policy consistent with protected endpoints.
      Alert separately on overlap, tiny size, abnormal ordering, and incomplete reassembly while retaining original fragments for forensics.
data_requirements:
- source_type: network-traffic-content
  name:
    zh: 全包网络流量内容
    en: Full-packet network traffic content
  channel: null
  required_fields: &id001
  - fragment_id
  - fragment_offset
  - more_fragments
  - fragment_size
  - overlap
  - reassembly_result
  - timestamp
- source_type: log-source
  name:
    zh: 防火墙与 IDS 分片处理日志
    en: Firewall and IDS fragment-processing logs
  channel: null
  required_fields: *id001
- source_type: log-source
  name:
    zh: 端点网络栈或主机防火墙事件
    en: Endpoint network-stack or host-firewall events
  channel: null
  required_fields: *id001
observables:
- zh: 异常小的 IP 分片
  en: Unusually small IP fragments
- zh: 传输层首部跨分片
  en: Transport headers split across fragments
- zh: 重叠、缺失或超时分片
  en: Overlapping, missing, or timed-out fragments
- zh: 传感器与终端重组结果不一致
  en: Reassembly differences between sensor and endpoint
correlation:
  window:
    zh: 至少覆盖网络栈的分片重组超时，并与随后产生的连接响应关联。
    en: Cover at least the network stack's fragment reassembly timeout and correlate fragments with subsequent connection responses.
  dimensions:
  - fragment_set
  - endpoint
  - sensor_vantage
  - time
false_positives:
- zh: 合法路径 MTU 导致的分片
  en: Legitimate fragmentation caused by path MTU
- zh: 隧道、封装和遗留网络设备产生的分片
  en: Fragments produced by tunnels, encapsulation, or legacy devices
blind_spots:
- zh: 仅保存流记录而不保存分片内容
  en: Flow-only retention without fragment content
- zh: 传感器和终端使用不同重组策略
  en: Sensors and endpoints using different reassembly policies
tuning_guidance:
  paragraphs:
  - zh: 应使传感器的分片规范化和重组策略与受保护终端保持一致，并为合法隧道、封装和遗留设备建立例外基线。异常分片告警应与随后产生的协议交互和扫描覆盖关联。
    en: Align sensor normalization and reassembly with protected endpoints and establish exception baselines for legitimate tunnels, encapsulation,
      and legacy devices. Correlate anomalous-fragment alerts with subsequent protocol interaction and scan coverage.
evidence_refs:
- REF-000003
- REF-000008
- REF-000010
