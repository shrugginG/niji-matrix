schema_version: 2.0.0
type: detection-analytic
id: NJA-000004
strategy_ref: DET-000004
name:
  zh: 探测特征与访问意图关联分析
  en: Probe-Feature and Access-Intent Correlation Analytic
summary:
  zh: 识别外观接近正常业务、但跨目标、响应和会话关系体现侦察意图的请求。
  en: Identify requests that resemble normal business traffic locally but reveal reconnaissance intent across targets, responses, and sessions.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 不以常见端口、合法协议名或单次请求外观作为可信依据；验证协议状态、请求—响应语义和客户端行为连续性，并将低信息量请求在多个目标上的重复模式纳入判断。
    en: Do not treat a common port, legitimate protocol name, or single-request appearance as trust evidence. Validate protocol state, request-response
      semantics, and client-behavior continuity, then incorporate repeated low-information requests across targets.
data_requirements:
- source_type: network-traffic-content
  name:
    zh: 网络流量内容与协议解析结果
    en: Network traffic content and protocol parsing results
  channel: null
  required_fields: &id001
  - source_port
  - destination_port
  - protocol
  - payload_length
  - session_state
  - target_id
  - timestamp
- source_type: log-source
  name:
    zh: 应用网关和服务访问日志
    en: Application gateway and service access logs
  channel: null
  required_fields: *id001
- source_type: behavioral-baseline
  name:
    zh: 资产、服务和正常客户端基线
    en: Asset, service, and normal-client baselines
  channel: null
  required_fields: *id001
observables:
- zh: 可信来源端口或常见协议外观与实际会话语义不一致
  en: Trusted source ports or common protocol appearance inconsistent with actual session semantics
- zh: 低信息量请求在多个资产、服务或路径间重复
  en: Low-information requests repeated across assets, services, or paths
- zh: 载荷、大小和交互顺序与真实客户端基线存在稳定偏差
  en: Stable deviations in payload, size, or interaction order from real-client baselines
correlation:
  window:
    zh: 同时使用会话内分析和跨资产、跨时段的访问关系分析。
    en: Combine within-session analysis with cross-asset and cross-period access relationships.
  dimensions:
  - session
  - target
  - protocol_semantics
  - client_baseline
  - time
false_positives:
- zh: 健康检查、兼容性探测和服务监控
  en: Health checks, compatibility probes, and service monitoring
- zh: 使用简化客户端的合法自动化程序
  en: Legitimate automation using simplified clients
blind_spots:
- zh: 加密或采样使应用语义不可见
  en: Encryption or sampling hides application semantics
- zh: 缺少正常客户端和业务流程基线
  en: Missing baselines for normal clients and business workflows
tuning_guidance:
  paragraphs:
  - zh: 应按服务、客户端类型和业务流程维护协议状态与行为基线，并分别处理健康检查、兼容性探测和合法自动化。常见端口或协议名称不能代替完整会话语义验证。
    en: Maintain protocol-state and behavioral baselines by service, client type, and business workflow, and handle health checks, compatibility
      probes, and legitimate automation separately. Common ports or protocol names must not replace validation of complete session semantics.
evidence_refs:
- REF-000003
- REF-000010
