schema_version: 2.0.0
type: detection-analytic
id: NJA-000005
strategy_ref: DET-000031
name:
  zh: 外部侦查获取与后续使用关联分析
  en: External Reconnaissance Acquisition-to-Use Correlation Analytic
summary:
  zh: 关联外部查询、已知主机或身份暴露与后续精确使用事件，并按直接审计和条件推断区分结果强度。
  en: Correlate external queries, known host or identity exposure, and later precise-use events while separating direct-audit findings from conditional inference.
domains: [enterprise]
platforms: []
logic:
  paragraphs:
  - zh: 将获准共享的第三方平台查询审计规范化为查询账户、来源、时间、查询条件和结果类型，并把外部暴露情报规范化为主机或身份属性及其首次和最近可见时间。随后在受害方安全事件中查找仅依赖这些属性即可实现的高度定向接触，例如准确的平台选择、员工冒充、帮助台恢复或针对特定入口的后续活动。存在查询审计并与目标及后续事件一致时产生直接关联结果；只有暴露与后续使用吻合时降低置信度并明确标记为条件推断。
    en: Normalize authorized third-party query audit into querying account, origin, time, query terms, and result type, and normalize external-exposure intelligence into host or identity attributes with first- and last-seen times. Then search victim security events for highly targeted contact that depends on those attributes, such as precise platform selection, employee impersonation, help-desk recovery, or follow-on activity against a specific entry point. Produce a direct-correlation result when query audit aligns with the victim and downstream event; when only exposure and later use align, lower confidence and explicitly label the result conditional inference.
data_requirements:
- source_type: third-party-provider-audit
  name:
    zh: 第三方数据提供方查询审计
    en: Third-party data-provider query audit
  channel: null
  required_fields: [account_id, requester_ip, query_timestamp, query_terms, result_types]
- source_type: external-exposure-intelligence
  name:
    zh: 外部主机与身份暴露情报
    en: External host and identity exposure intelligence
  channel: null
  required_fields: [subject_type, subject_value, source, first_seen, last_seen]
- source_type: security-event
  name:
    zh: 受害方后续安全事件
    en: Victim follow-on security events
  channel: null
  required_fields: [event_type, timestamp, source_indicator, target_indicator, observed_attribute]
observables:
- zh: 第三方平台账户集中查询与目标相关的主机或身份属性
  en: A third-party platform account concentrates queries on victim-related host or identity attributes
- zh: 新确认的外部暴露属性随后被用于高度定向的选择、冒充或恢复活动
  en: Newly confirmed external attributes are later used in highly targeted selection, impersonation, or recovery activity
- zh: 查询结果类型、后续接触目标与所暴露信息之间具有高特异性对应
  en: Query result types, downstream targets, and exposed information have a highly specific correspondence
correlation:
  window:
    zh: 根据提供方审计留存和暴露材料寿命采用数小时至数月的多尺度窗口，并保留暴露首次出现到后续使用的时间顺序。
    en: Use multiscale windows from hours to months according to provider-audit retention and exposed-material lifetime, preserving the sequence from first exposure to downstream use.
  dimensions: [provider_account, requester_origin, victim_entity, exposed_attribute, downstream_event, time]
false_positives:
- zh: 经授权的外部攻击面管理、品牌保护和泄露响应团队
  en: Authorized external attack-surface management, brand-protection, and breach-response teams
- zh: 合法招聘、客户支持、合规调查和安全研究活动
  en: Legitimate recruiting, customer support, compliance investigation, and security research
- zh: 公开且常见属性与后续事件偶然重合
  en: Coincidental overlap between common public attributes and later events
blind_spots:
- zh: 第三方提供方不保留或不共享查询审计
  en: Third-party providers do not retain or share query audit
- zh: 攻击者离线处理已获得的数据且后续活动长期延迟
  en: The adversary processes acquired data offline and substantially delays follow-on activity
- zh: 外部暴露来源、属性和受害方事件缺少可统一的实体标识
  en: External exposure sources, attributes, and victim events lack alignable entity identifiers
tuning_guidance:
  paragraphs:
  - zh: 应优先对高价值资产和身份维护规范实体映射，并为已授权的攻击面管理、招聘、支持和安全研究账户建立有时限的行为基线。不能仅因某属性曾公开就忽略后续精确使用；告警强度应同时考虑属性稀有度、查询审计是否存在、后续行为敏感性和时间接近性。
    en: Maintain canonical entity mappings first for high-value assets and identities, and establish time-bounded behavioral baselines for authorized attack-surface, recruiting, support, and security-research accounts. Do not suppress precise downstream use merely because an attribute was once public; alert strength should combine attribute rarity, availability of query audit, downstream-action sensitivity, and temporal proximity.
evidence_refs: [REF-000025, REF-000026, REF-000031, REF-000032]
