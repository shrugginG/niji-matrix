schema_version: 2.0.0
type: detection-analytic
id: NJA-000006
strategy_ref: DET-000032
name:
  zh: Web 主机画像与选择性响应关联分析
  en: Web Host Profiling and Selective-Response Correlation Analytic
summary:
  zh: 识别客户端属性与远端内容选择的稳定对应，以及未经授权脚本触发的密集属性读取和结构化回传。
  en: Identify stable correspondence between client attributes and remote content selection and dense property access with structured reporting triggered by unauthorized scripts.
domains: [enterprise]
platforms: [Web Browser]
logic:
  paragraphs:
  - zh: 对同一外部资源的请求和响应按客户端元数据、页面版本和时间归组，比较 User-Agent、语言、协商字段或地址属性变化是否稳定导致内容、跳转、状态或下载结果差异。同时从浏览器或受控分析环境记录脚本来源、读取的属性集合、执行顺序和回传目的地，并与内容完整性基线比较。只有远端选择性响应与恶意基础设施或后续投递相关，或未经授权页面变化触发高密度属性读取并立即向异常目的地回传时，才提高风险结果。
    en: Group requests and responses to the same external resource by client metadata, page version, and time, then test whether changes in User-Agent, language, negotiation fields, or address attributes consistently alter content, redirects, status, or download outcomes. In parallel, record script provenance, accessed attribute sets, execution order, and reporting destinations from browser or controlled-analysis telemetry and compare them with content-integrity baselines. Raise risk only when differential remote responses align with malicious infrastructure or follow-on delivery, or when an unauthorized page change triggers dense property access followed immediately by reporting to an anomalous destination.
data_requirements:
- source_type: web-request-response
  name:
    zh: Web 请求与响应遥测
    en: Web request and response telemetry
  channel: null
  required_fields: [timestamp, client_id, destination_host, request_headers, response_status, response_hash, redirect_target]
- source_type: browser-script-telemetry
  name:
    zh: 浏览器脚本与属性访问遥测
    en: Browser script and property-access telemetry
  channel: null
  required_fields: [timestamp, client_id, page_origin, script_origin, script_hash, api_name, attribute_name, network_destination]
- source_type: web-content-integrity
  name:
    zh: Web 内容完整性基线
    en: Web content-integrity baseline
  channel: null
  required_fields: [page_url, script_hash, first_seen, authorization_state]
observables:
- zh: 客户端元数据变化与远端内容、跳转或下载结果形成稳定差异
  en: Client-metadata changes have a stable relationship with remote content, redirects, or download outcomes
- zh: 页面脚本在短时内读取大量软件、图形、语言、插件或系统属性
  en: A page script reads many software, graphics, language, plugin, or system attributes in a short period
- zh: 未经授权或新出现的脚本完成属性读取后立即结构化回传
  en: An unauthorized or newly observed script performs structured reporting immediately after property access
correlation:
  window:
    zh: 会话内关联采用秒至分钟窗口，跨客户端差异比较采用数小时至七天窗口以覆盖选择性响应和页面变更。
    en: Use seconds-to-minutes windows for in-session correlation and hours-to-seven-days windows for cross-client differential comparison covering selective responses and page changes.
  dimensions: [client, destination, page, script, attribute_set, response_variant, time]
false_positives:
- zh: 合法兼容性、反欺诈、无障碍和区域化内容选择
  en: Legitimate compatibility, anti-fraud, accessibility, and regionalized content selection
- zh: 经授权的分析、广告测量和浏览器指纹服务
  en: Authorized analytics, advertising measurement, and browser-fingerprinting services
- zh: 正常发布导致的脚本哈希和属性读取集合变化
  en: Script-hash and property-set changes caused by normal releases
blind_spots:
- zh: 加密流量且端点或浏览器不提供脚本级遥测
  en: Encrypted traffic without endpoint or browser script-level telemetry
- zh: 服务端只消费固有请求字段且不同客户端样本不足
  en: Server-side consumption of inherent request fields when comparative client samples are insufficient
- zh: 供应链脚本已被基线错误标记为授权
  en: A compromised supply-chain script is incorrectly baselined as authorized
tuning_guidance:
  paragraphs:
  - zh: 应按业务页面维护授权脚本来源、属性访问集合和差异化响应用途，并使用受控客户端定期比较高风险外部入口。允许清单必须绑定页面、脚本哈希、用途和有效期，不能仅按域名永久放行；对身份入口、软件下载和高价值 VPN 门户应采用更严格的新增属性与异常回传阈值。
    en: Maintain per-application baselines for authorized script origins, property-access sets, and intended differential responses, and periodically compare high-risk external entry points with controlled clients. Allow rules should bind page, script hash, purpose, and expiration rather than permanently trusting a domain; identity portals, software-download sites, and high-value VPN portals should use stricter thresholds for newly accessed attributes and anomalous reporting.
evidence_refs: [REF-000027, REF-000028, REF-000029, REF-000030]
