schema_version: 2.0.0
type: detection-analytic
id: NJA-000008
strategy_ref: DET-000034
name:
  zh: 目标外网络与开放内容侦查关联分析
  en: Off-Victim Network and Open-Content Reconnaissance Correlation Analytic
summary:
  zh: 规范化外部查询与公开对象，并依据查询审计、属性稀有度和后续使用精度输出直接或条件性关联结果。
  en: Normalize external queries and public objects, then produce direct or conditional correlation results from query audit, attribute rarity, and downstream-use precision.
domains: [enterprise]
platforms: []
logic:
  paragraphs:
  - zh: 将可获授权的第三方传感、RDAP、证书透明度、路由收集、监管资料、搜索和开放内容平台审计规范化为查询账户、来源、时间、条件、对象类型和结果标识，并把域名、地址、前缀、证书名、组织关系、职责和运营属性解析到同一受害实体。随后在受害方安全事件中查找与这些属性高度一致的窄范围探测、精确话术、合作伙伴冒充或入口选择。存在查询审计、受害实体和后续使用三者一致时输出直接关联；缺少查询者记录时只输出条件推断并按属性稀有度、时间接近性和行为敏感性降级。
    en: Normalize authorized audit from third-party sensors, RDAP, certificate transparency, route collection, regulatory data, search, and open-content platforms into querying account, origin, time, terms, object type, and result identifiers, and resolve domains, addresses, prefixes, certificate names, organizational relationships, responsibilities, and operating attributes to the same victim entity. Then search victim security events for narrow probing, precise pretexts, partner impersonation, or entry selection that closely matches those attributes. Produce a direct correlation when query audit, victim entity, and downstream use all align; without a consumer record, produce only conditional inference and reduce confidence according to attribute rarity, temporal proximity, and action sensitivity.
data_requirements:
- source_type: external-provider-query-audit
  name:
    zh: 外部数据与开放内容提供方查询审计
    en: External data and open-content provider query audit
  channel: null
  required_fields: [account_id, requester_origin, query_timestamp, query_terms, object_type, result_ids]
- source_type: public-network-content-object
  name:
    zh: 公共网络与组织内容对象
    en: Public network and organizational content objects
  channel: null
  required_fields: [object_id, object_type, subject_entity, attribute_name, attribute_value, first_seen, last_seen, source]
- source_type: downstream-security-event
  name:
    zh: 受害方后续安全事件
    en: Victim downstream security events
  channel: null
  required_fields: [event_type, timestamp, source_indicator, target_entity, observed_attribute, action_result]
observables:
- zh: 一个外部账户集中查询与同一组织相关的网络对象、关系或运营属性
  en: One external account concentrates queries on network objects, relationships, or operating attributes tied to the same organization
- zh: 公开对象中的稀有属性随后出现在窄范围探测、话术或入口选择中
  en: Rare attributes from public objects later appear in narrow probing, pretexts, or entry selection
- zh: 多种公开来源被解析为一致的目标网络或组织图
  en: Multiple public sources are resolved into a consistent victim network or organizational graph
correlation:
  window:
    zh: 根据提供方留存、网络对象变化和组织资料寿命采用数小时至数月窗口，并保留公开或查询发生在后续使用之前的顺序。
    en: Use windows from hours to months according to provider retention, network-object change, and organizational-data lifetime, preserving the requirement that publication or query precedes downstream use.
  dimensions: [provider_account, requester_origin, victim_entity, object_type, attribute, downstream_event, time]
false_positives:
- zh: 经授权的外部攻击面管理、合规、投资、招聘和供应链尽调
  en: Authorized external attack-surface management, compliance, investment, recruiting, and supply-chain due diligence
- zh: 搜索引擎、安全研究、证书监测和网络运营分析
  en: Search-engine, security-research, certificate-monitoring, and network-operations analysis
- zh: 常见公开属性与后续事件偶然重合
  en: Coincidental overlap between common public attributes and later events
blind_spots:
- zh: 提供方不保留或不共享查询账户和条件
  en: Providers do not retain or share querying accounts and terms
- zh: 攻击者批量离线下载后长期延迟或转移后续活动
  en: The adversary performs bulk offline acquisition and substantially delays or delegates downstream activity
- zh: 公共对象与受害方事件缺少可统一的实体标识
  en: Public objects and victim events lack alignable entity identifiers
tuning_guidance:
  paragraphs:
  - zh: 应优先为高价值域名、前缀、合作伙伴、职责和业务周期维护规范实体与属性稀有度，并为授权研究账户设置有时限的用途基线。不能因为对象公开就忽略其被精确用于后续高风险活动；结果强度必须分别标记提供方直接审计、跨源强推断和仅有内容重合三种证据层级。
    en: Prioritize canonical entity and attribute-rarity mappings for high-value domains, prefixes, partners, responsibilities, and business cycles, and maintain time-bounded purpose baselines for authorized research accounts. Public availability must not suppress precise downstream high-risk use; result strength must separately label provider-direct audit, strong cross-source inference, and content overlap alone.
evidence_refs: [REF-000025, REF-000026, REF-000036, REF-000037, REF-000038, REF-000039, REF-000040, REF-000041, REF-000044, REF-000052]
