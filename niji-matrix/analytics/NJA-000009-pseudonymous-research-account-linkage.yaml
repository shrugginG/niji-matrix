schema_version: 2.0.0
type: detection-analytic
id: NJA-000009
strategy_ref: DET-000035
name:
  zh: 假名研究账户关联与归因分析
  en: Pseudonymous Research-Account Linkage and Attribution Analytic
summary:
  zh: 从账户画像、登录基础设施和目标访问图恢复隔离研究身份与真实操作者或后续活动的联系。
  en: Recover links between a compartmented research identity and its operator or downstream activity from profile, login-infrastructure, and target-access graphs.
domains: [enterprise]
platforms: [Open Content Platform, Social Platform, Code Hosting]
logic:
  paragraphs:
  - zh: 为平台账户构建包含创建时间、画像字段、设备、登录来源、恢复标识、查询主题、目标查看和消息行为的时间图，并在不直接依赖自报姓名的情况下寻找跨账户复用。将集中访问同一组织人员或主题、间歇研究节奏、稀疏但目的明确的画像与后续定向接触、钓鱼或平台滥用连接。只有多个独立维度一致或平台已采取处置时才提高归因置信度；单一虚假字段、新账户或隐私工具使用只能作为弱信号。
    en: Build a temporal graph for platform accounts containing creation time, profile fields, devices, login origins, recovery identifiers, query topics, target views, and messaging behavior, and seek cross-account reuse without relying directly on self-reported names. Connect concentrated access to one organization's people or topics, intermittent research cadence, and sparse but purposeful profiles with later targeted contact, phishing, or platform abuse. Raise attribution confidence only when multiple independent dimensions align or the platform has taken enforcement action; a single false field, new account, or privacy-tool use is only a weak signal.
data_requirements:
- source_type: platform-account-audit
  name:
    zh: 开放内容平台账户与查询审计
    en: Open-content platform account and query audit
  channel: null
  required_fields: [account_id, created_at, profile_fields, device_id, login_origin, recovery_id, action_type, target_entity, query_timestamp]
- source_type: platform-enforcement-event
  name:
    zh: 平台处置与滥用事件
    en: Platform enforcement and abuse events
  channel: null
  required_fields: [account_id, event_time, enforcement_reason, linked_accounts, downstream_indicator]
observables:
- zh: 稀疏或虚构画像间歇集中查看同一组织的人员与主题
  en: Sparse or fictitious profiles intermittently concentrate views on one organization's people and topics
- zh: 多个研究账户复用设备、登录来源、恢复标识或查询序列
  en: Multiple research accounts reuse devices, login origins, recovery identifiers, or query sequences
- zh: 平台研究目标与后续定向联系或钓鱼对象高度重合
  en: Platform research targets strongly overlap later targeted contact or phishing recipients
correlation:
  window:
    zh: 使用三十日至一年窗口覆盖间歇研究、账户休眠和后续使用，并以账号创建、目标查看和滥用事件的时间顺序约束关联。
    en: Use a thirty-day-to-one-year window covering intermittent research, account dormancy, and downstream use, constraining correlation by the sequence of account creation, target views, and abuse events.
  dimensions: [account, device, login_origin, recovery_identity, target_graph, query_pattern, downstream_abuse, time]
false_positives:
- zh: 记者、学者、招聘人员、调查员和威胁研究者使用假名或专用账户
  en: Journalists, academics, recruiters, investigators, and threat researchers using pseudonymous or dedicated accounts
- zh: 隐私敏感用户限制画像字段并通过共享网络登录
  en: Privacy-sensitive users limiting profile fields and logging in through shared networks
- zh: 多人团队共享研究主题但没有共同操作者
  en: Separate team members sharing research topics without a common operator
blind_spots:
- zh: 平台不保留设备、登录、恢复和查看级别审计
  en: The platform does not retain device, login, recovery, and view-level audit
- zh: 攻击者严格隔离设备、来源、恢复属性和后续账户
  en: The adversary strictly separates devices, origins, recovery attributes, and downstream accounts
- zh: 目标访问无需账户且只留下聚合日志
  en: Target access requires no account and leaves only aggregate logs
tuning_guidance:
  paragraphs:
  - zh: 应按平台业务区分允许假名的普通用户、受审查研究角色和禁止欺骗身份的高风险功能，并将目标集中度、基础设施复用和后续滥用作为组合阈值。对合法研究者的白名单应绑定组织、用途、时间和数据范围，不能永久忽略其账户接管或用途漂移风险。
    en: Distinguish ordinary users allowed to use pseudonyms, reviewed research roles, and high-risk functions that prohibit deceptive identity, and use target concentration, infrastructure reuse, and downstream abuse as combined thresholds. Allow rules for legitimate researchers should bind organization, purpose, time, and data scope rather than permanently ignoring account takeover or purpose drift.
evidence_refs: [REF-000050, REF-000051, REF-000052]
