schema_version: 2.0.0
type: detection-analytic
id: NJA-000010
strategy_ref: DET-000036
name:
  zh: 敏感信息请求的情境与承载面验证分析
  en: Context and Hosting-Surface Validation Analytic for Sensitive Information Requests
summary:
  zh: 对照授权关系、正常流程和租户所有权，识别语义可信但要求异常披露或向外部主体提交的数据请求。
  en: Compare authorized relationships, normal workflows, and tenant ownership to identify semantically plausible requests demanding anomalous disclosure or submission to an external party.
domains: [enterprise]
platforms: [Email, Collaboration, Web Browser, Cloud Forms]
logic:
  paragraphs:
  - zh: 从邮件、消息、表单和浏览器事件提取请求者身份、显示名称、发件域、会话或线程、业务理由、紧迫度、所请求信息类别、链接、托管租户、品牌实体和提交目的地，并与组织目录、供应商关系、批准流程和已登记表单所有权对照。若话术与岗位语境高度一致但请求者无相应授权、敏感数据被提交到外部租户、品牌与所有权不一致，或请求绕过既定披露流程，则提高风险；语法正常、使用可信云域名或视觉相似不能降低这些关系异常。
    en: Extract requester identity, display name, sending domain, conversation or thread, business reason, urgency, requested information category, links, hosting tenant, branded entity, and submission destination from email, messaging, forms, and browser events, then compare them with organizational directories, supplier relationships, approved workflows, and registered form ownership. Raise risk when a pretext closely matches role context but lacks requester authorization, sensitive data is submitted to an external tenant, branding and ownership disagree, or the request bypasses established disclosure processes; normal grammar, a trusted cloud domain, or visual similarity must not suppress those relationship anomalies.
data_requirements:
- source_type: communication-event
  name:
    zh: 邮件与协作通信事件
    en: Email and collaboration communication events
  channel: null
  required_fields: [timestamp, sender_id, sender_domain, recipient_id, thread_id, message_text, link_targets, attachment_names]
- source_type: web-form-event
  name:
    zh: Web 页面与表单提交事件
    en: Web page and form-submission events
  channel: null
  required_fields: [timestamp, page_url, hosting_tenant, branded_entity, field_types, submission_destination, referrer]
- source_type: authorization-context
  name:
    zh: 组织关系与敏感披露授权上下文
    en: Organizational relationship and sensitive-disclosure authorization context
  channel: null
  required_fields: [requester_id, relationship_type, authorized_data_types, approved_channel, valid_from, valid_to]
observables:
- zh: 与岗位和业务周期高度一致但无法验证授权关系的敏感请求
  en: A sensitive request closely aligned with role and business timing but lacking a verifiable authorized relationship
- zh: 受害者品牌页面托管在未登记租户并把数据提交给外部主体
  en: A victim-branded page hosted in an unregistered tenant and submitting data to an external party
- zh: 请求绕过正式审批、回拨或已知数据交换渠道
  en: A request bypasses formal approval, callback, or known data-exchange channels
correlation:
  window:
    zh: 在单次会话内使用分钟至小时窗口，并以三十日窗口关联相同请求者、租户、品牌模板和目标角色的重复活动。
    en: Use minute-to-hour windows within a session and a thirty-day window to correlate repeated activity involving the same requester, tenant, brand template, and target role.
  dimensions: [sender, recipient, thread, requester_role, data_type, hosting_tenant, submission_destination, time]
false_positives:
- zh: 新供应商、临时项目和紧急业务流程尚未同步到授权目录
  en: New suppliers, temporary projects, and urgent business workflows not yet synchronized to authorization records
- zh: 合法部门使用外部云表单收集敏感但已批准的信息
  en: Legitimate departments using external cloud forms for approved sensitive-data collection
- zh: 品牌迁移或多租户运营导致所有权记录暂时不一致
  en: Brand migration or multi-tenant operation temporarily creating ownership-record discrepancies
blind_spots:
- zh: 消息内容端到端加密且无端点分类信号
  en: Message content is end-to-end encrypted without endpoint classification signals
- zh: 组织没有维护供应商关系、表单租户和数据披露授权清单
  en: The organization does not maintain supplier, form-tenant, and data-disclosure authorization records
- zh: 披露通过未受管个人设备或语音渠道完成
  en: Disclosure occurs through unmanaged personal devices or voice channels
tuning_guidance:
  paragraphs:
  - zh: 应按数据敏感度和业务角色设置风险权重，为新流程提供短期审批例外，并要求所有允许的外部表单记录租户、所有者、字段和数据去向。白名单必须绑定请求者、关系、信息类别和有效期，不能仅因发件域或托管平台可信而永久放行。
    en: Weight risk by data sensitivity and business role, provide time-bounded approval exceptions for new workflows, and require every allowed external form to record tenant, owner, fields, and data destination. Allow rules must bind requester, relationship, information category, and validity period rather than permanently trusting a sending domain or hosting platform.
evidence_refs: [REF-000024, REF-000042, REF-000043]
