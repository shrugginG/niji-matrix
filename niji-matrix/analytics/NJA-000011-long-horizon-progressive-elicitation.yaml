schema_version: 2.0.0
type: detection-analytic
id: NJA-000011
strategy_ref: DET-000037
name:
  zh: 长周期渐进式信息诱导关联分析
  en: Long-Horizon Progressive Information-Elicitation Correlation Analytic
summary:
  zh: 对会话请求敏感度和关系状态进行时序评分，发现从普通交流逐步升级到关键披露的跨消息模式。
  en: Score conversation request sensitivity and relationship state over time to find cross-message progression from ordinary interaction to critical disclosure.
domains: [enterprise]
platforms: [Email, Collaboration, Social Platform]
logic:
  paragraphs:
  - zh: 将邮件、即时消息和平台会话按参与者、线程、话术主题和跨渠道标识关联，为每轮交互标注请求信息类别、敏感度、紧迫度、关系验证状态和对方响应。检测关系建立或低敏感度交流之后持续出现更具体、更高敏感度请求，特别关注同一身份在渠道迁移后延续话术、绕过正式披露流程或最终获得凭据、验证码、财务和运营信息。只有敏感度上升、关系未验证和流程偏离共同出现时才提高风险。
    en: Correlate email, instant-message, and platform conversations by participants, thread, pretext topic, and cross-channel identifiers, labeling each turn with requested information category, sensitivity, urgency, relationship-verification state, and counterpart response. Detect increasingly specific and sensitive requests following relationship building or low-sensitivity exchange, with particular attention to the same identity continuing a pretext after channel migration, bypassing formal disclosure workflows, or ultimately obtaining credentials, verification codes, financial data, or operational information. Raise risk only when sensitivity escalation, unverified relationship, and process deviation co-occur.
data_requirements:
- source_type: conversation-message
  name:
    zh: 跨渠道会话消息
    en: Cross-channel conversation messages
  channel: null
  required_fields: [timestamp, sender_id, recipient_id, thread_id, channel, message_text, link_targets, response_state]
- source_type: disclosure-policy-context
  name:
    zh: 信息敏感度与披露流程上下文
    en: Information-sensitivity and disclosure-workflow context
  channel: null
  required_fields: [data_type, sensitivity_level, authorized_requester, approved_channel, approval_required]
observables:
- zh: 新关系先进行低敏感度交流，随后逐步索取凭据、验证码、财务或运营细节
  en: A new relationship begins with low-sensitivity exchange and gradually requests credentials, verification codes, financial, or operational detail
- zh: 同一身份跨邮件、即时消息或社交平台延续话术并提高请求敏感度
  en: The same identity continues a pretext across email, messaging, or social platforms while increasing request sensitivity
- zh: 每条消息局部合理但完整会话绕过正式披露流程
  en: Individual messages appear locally reasonable while the complete conversation bypasses formal disclosure workflows
correlation:
  window:
    zh: 使用三十日至六个月窗口覆盖关系培养和渠道迁移，并在消息级保留严格顺序以识别敏感度单调或阶段性上升。
    en: Use a thirty-day-to-six-month window covering relationship cultivation and channel migration while retaining strict message order to identify monotonic or staged sensitivity escalation.
  dimensions: [sender_identity, recipient_identity, thread, pretext_topic, channel, requested_data, sensitivity, time]
false_positives:
- zh: 合法招聘、审计、客户支持、研究访谈和供应商入驻逐步收集资料
  en: Legitimate recruiting, audit, customer support, research interviews, and supplier onboarding that progressively collect information
- zh: 长期项目因阶段变化自然提高请求数据敏感度
  en: Long-running projects whose data requests naturally become more sensitive across phases
- zh: 员工主动将会话迁移到另一批准渠道
  en: Employees intentionally moving a conversation to another approved channel
blind_spots:
- zh: 渠道之间缺少统一身份、线程或话术标识
  en: Channels lack common identity, thread, or pretext identifiers
- zh: 消息内容不可见或留存时间短于关系培养周期
  en: Message content is unavailable or retention is shorter than the relationship-building period
- zh: 关键披露发生在未受管语音或个人设备中
  en: Critical disclosure occurs through unmanaged voice or personal devices
tuning_guidance:
  paragraphs:
  - zh: 应按业务流程定义正常请求阶段、允许的数据敏感度和必需审批，并为招聘、审计与长期合作建立限定参与者和期限的基线。模型不得把消息数量直接作为风险；应提高未验证关系、跨渠道身份不一致、敏感度上升和绕过流程的组合权重。
    en: Define normal request stages, allowed sensitivity, and required approvals by business workflow, and establish participant- and time-bounded baselines for recruiting, audit, and long-term partnerships. The model must not treat message count as risk by itself; it should increase the combined weight of unverified relationships, cross-channel identity inconsistency, sensitivity escalation, and process bypass.
evidence_refs: [REF-000024, REF-000043]
