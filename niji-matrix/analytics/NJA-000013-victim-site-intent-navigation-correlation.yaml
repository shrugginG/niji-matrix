schema_version: 2.0.0
type: detection-analytic
id: NJA-000013
strategy_ref: DET-000039
name:
  zh: 受害者网站访问意图与导航序列关联分析
  en: Victim-Site Access-Intent and Navigation-Sequence Correlation Analytic
summary:
  zh: 从完整会话与公开导航图识别低量主题组合访问、导航工件驱动路径选择及其与后续定向活动的联系。
  en: Use complete sessions and the public navigation graph to identify low-volume thematic access, navigation-artifact-driven path selection, and links to downstream targeting.
domains: [enterprise]
platforms: [Web Server, CDN, WAF]
logic:
  paragraphs:
  - zh: 以客户端、会话和时间重构请求顺序，将每个路径标注为公开链接可达、sitemap 或 robots 已列出、未发布猜测、成功或错误，并提取页面主题、User-Agent、Referer、请求间隔和并发度。对正常访客拟态，识别低量但跨招聘、人员、合作伙伴、技术和运营页面形成高目标价值组合且随后与定向活动吻合的会话；对导航工件替代，识别先读取工件、再只访问少量已列出低流量路径且错误率极低的序列。结果必须与已知爬虫、搜索索引、可访问性测试和正常用户旅程基线比较。
    en: Reconstruct request order by client, session, and time, labeling each path as reachable through public links, listed in sitemap or robots artifacts, unpublished speculation, success, or error, and extract page topic, User-Agent, referrer, inter-request interval, and concurrency. For benign-visitor mimicry, identify low-volume sessions whose combination of recruiting, people, partner, technical, and operating pages has high targeting value and later aligns with targeted activity. For navigation-artifact substitution, identify sequences that read an artifact first and then access only a few listed low-traffic paths with very low error rate. Compare every result with known crawlers, search indexers, accessibility testing, and normal user-journey baselines.
data_requirements:
- source_type: web-access-log
  name:
    zh: 网站、CDN 与 WAF 访问日志
    en: Website, CDN, and WAF access logs
  channel: null
  required_fields: [timestamp, client_id, source_ip, user_agent, referrer, method, path, status_code, response_bytes, session_id]
- source_type: published-navigation-inventory
  name:
    zh: 公开链接与导航工件清单
    en: Public link and navigation-artifact inventory
  channel: null
  required_fields: [path, discovery_source, published_at, removed_at, page_topic, sensitivity_label]
- source_type: downstream-targeting-event
  name:
    zh: 后续定向活动事件
    en: Downstream targeting events
  channel: null
  required_fields: [timestamp, source_indicator, target_entity, referenced_topic, action_type]
observables:
- zh: 低请求量会话组合访问人员、合作伙伴、招聘、技术和运营等高价值主题
  en: A low-volume session combines visits to high-value people, partner, recruiting, technical, and operating topics
- zh: 先读取 sitemap 或 robots 工件，随后仅访问少量其中列出的低流量路径
  en: A sitemap or robots artifact is read before only a few listed low-traffic paths are accessed
- zh: 后续社会工程、入口选择或话术与先前页面主题高度一致
  en: Downstream social engineering, entry selection, or pretext strongly matches earlier page topics
correlation:
  window:
    zh: 使用会话内分钟至小时窗口重构导航顺序，并使用三十日至九十日窗口把页面主题与后续定向活动关联。
    en: Use minute-to-hour windows to reconstruct navigation within a session and thirty-to-ninety-day windows to connect page topics with downstream targeting.
  dimensions: [client, session, source, path, discovery_source, page_topic, user_agent, downstream_event, time]
false_positives:
- zh: 求职者、客户、媒体、投资者、供应商和安全研究者的正常主题访问
  en: Normal thematic visits by job seekers, customers, media, investors, suppliers, and security researchers
- zh: 搜索引擎、站点地图验证、可访问性工具和内容监测服务
  en: Search engines, sitemap validation, accessibility tools, and content-monitoring services
- zh: 用户通过站内搜索或外部链接直接进入低流量页面
  en: Users reaching low-traffic pages through site search or external links
blind_spots:
- zh: CDN 或隐私机制使多个访问者共享不可区分的客户端标识
  en: CDN or privacy mechanisms cause multiple visitors to share indistinguishable client identifiers
- zh: 日志不保留 Referer、会话、完整路径或导航工件版本
  en: Logs do not retain referrer, session, complete path, or navigation-artifact version
- zh: 后续活动来自完全隔离且无法与访问会话关联的基础设施
  en: Downstream activity comes from fully separated infrastructure that cannot be linked to the browsing session
tuning_guidance:
  paragraphs:
  - zh: 应按站点区域维护正常用户旅程、页面主题敏感度、公开导航来源和已授权爬虫，并根据访问量分别设置组合异常阈值。不能仅因请求量低、User-Agent 常见或路径均成功就忽略会话；风险应来自主题组合、导航顺序、来源历史和后续使用的共同证据。
    en: Maintain normal user journeys, page-topic sensitivity, public navigation provenance, and authorized crawlers by site area, and set combination-anomaly thresholds according to traffic volume. Low request count, a common User-Agent, or all-successful paths must not suppress a session by themselves; risk should come from combined evidence across topic sets, navigation order, origin history, and downstream use.
evidence_refs: [REF-000025, REF-000030, REF-000045]
