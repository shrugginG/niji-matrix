schema_version: 2.0.0
type: detection-analytic
id: NJA-000014
strategy_ref: DET-000040
name:
  zh: 威胁情报自查与反馈后谱系关联分析
  en: Threat-Intelligence Self-Query and Post-Feedback Lineage Correlation Analytic
summary:
  zh: 从提供方查询审计和跨时间实体关系识别自身指标自查、候选资源筛选及披露后快速轮换。
  en: Identify self-indicator checking, candidate-resource screening, and rapid post-disclosure rotation from provider query audit and longitudinal entity relationships.
domains: [enterprise]
platforms: [Threat Intelligence Platform, Reputation Service]
logic:
  paragraphs:
  - zh: 将威胁平台账户与查询日志规范化为账户、来源、设备、时间、被查询指标和返回声誉，并将公开报告与厂商标签规范化为发布时间、指标、活动归属和检测语义。对声誉门控，识别同一账户在注册或部署前查询候选域、IP、证书或托管资源，随后只投入未标恶对象并在运行后复查的序列。对暴露触发轮换，识别报告或查询后旧指标在短窗口消失，同时出现与旧实体共享代码、证书、注册、托管、行为或目标关系的新指标。存在平台自查日志时输出直接反馈关联；只有披露与轮换时间关系时标记为强推断而非直接查询事实。
    en: Normalize threat-platform account and query logs into account, origin, device, time, queried indicator, and returned reputation, and normalize public reports and vendor labels into publication time, indicator, activity attribution, and detection meaning. For reputation gating, identify sequences where the same account queries candidate domains, IPs, certificates, or hosting resources before registration or deployment, uses only unflagged objects, and rechecks them after operation begins. For exposure-triggered rotation, detect old indicators disappearing shortly after a report or query while new indicators appear with shared code, certificate, registration, hosting, behavior, or targeting relationships. Produce direct feedback correlation when platform self-query audit exists; when only publication and rotation timing align, label the result strongly inferred rather than a direct query fact.
data_requirements:
- source_type: threat-intel-provider-audit
  name:
    zh: 威胁情报与声誉平台查询审计
    en: Threat-intelligence and reputation-platform query audit
  channel: null
  required_fields: [account_id, requester_origin, device_id, query_timestamp, queried_indicator, indicator_type, reputation_result]
- source_type: threat-disclosure-catalog
  name:
    zh: 威胁报告与指标披露目录
    en: Threat-report and indicator-disclosure catalog
  channel: null
  required_fields: [published_at, source_id, indicator, indicator_type, campaign_label, detection_meaning]
- source_type: malicious-entity-observation
  name:
    zh: 恶意文件与基础设施实体观测
    en: Malicious file and infrastructure entity observations
  channel: null
  required_fields: [timestamp, entity_id, entity_type, observed_indicator, code_lineage, certificate_lineage, registration_lineage, hosting_lineage, behavior_profile, target_set]
observables:
- zh: 平台账户查询自身已部署基础设施、公开归因或相关同业指标
  en: A platform account queries its own deployed infrastructure, public attribution, or indicators of a relevant peer
- zh: 候选资源在注册或部署前被查询，已标恶对象未投入而未标恶对象随后上线
  en: Candidate resources are queried before registration or deployment, flagged objects are not used, and unflagged objects later appear operational
- zh: 披露后短窗口内旧指标消失并出现具有代码、托管、证书或目标谱系的新实体
  en: Old indicators disappear shortly after disclosure while new entities appear with code, hosting, certificate, or targeting lineage
correlation:
  window:
    zh: 使用分钟至七日窗口关联查询、注册、部署和复查，并使用九十日至一年窗口恢复新旧恶意实体的代码、基础设施与目标谱系。
    en: Use minute-to-seven-day windows to correlate query, registration, deployment, and rechecking and ninety-day-to-one-year windows to recover code, infrastructure, and targeting lineage across old and new malicious entities.
  dimensions: [provider_account, requester_origin, queried_indicator, candidate_resource, disclosure, old_entity, new_entity, lineage, time]
false_positives:
- zh: 安全研究者、威胁猎手和厂商分析人员查询恶意指标与归因
  en: Security researchers, threat hunters, and vendor analysts querying malicious indicators and attribution
- zh: 合法资产所有者、品牌保护和基础设施采购团队检查自身或候选资源声誉
  en: Legitimate asset owners, brand-protection teams, and infrastructure procurement teams checking reputation of their own or candidate resources
- zh: 报告发布后防守处置导致旧指标消失，同时无攻击者反馈行为
  en: Defensive remediation removes old indicators after publication without adversary feedback behavior
blind_spots:
- zh: 威胁平台不保留或不共享账户、查询和声誉结果
  en: Threat platforms do not retain or share account, query, and reputation results
- zh: 攻击者使用无账户访问、离线数据库或严格隔离的查询与运营基础设施
  en: The adversary uses accountless access, offline databases, or strictly separated query and operational infrastructure
- zh: 新旧实体没有可观测代码、证书、托管、行为或目标谱系
  en: Old and new entities expose no observable code, certificate, hosting, behavior, or targeting lineage
tuning_guidance:
  paragraphs:
  - zh: 应根据账户角色、被查询对象所有权和授权研究范围建立基线，并分别输出直接平台自查、反馈后轮换强推断和一般谱系相似三种结果。不能仅以披露后指标消失作为恶意反馈证明，也不能因候选资源当时无恶意声誉就降低后续行为风险；谱系权重应按代码、证书、注册、托管、目标与时间的独立一致性调整。
    en: Establish baselines by account role, queried-object ownership, and authorized research scope and output separate results for direct platform self-query, strongly inferred post-feedback rotation, and general lineage similarity. Indicator disappearance after disclosure alone must not prove adversary feedback, and an initially clean candidate reputation must not reduce later behavioral risk; lineage weighting should reflect independent agreement across code, certificate, registration, hosting, targeting, and time.
evidence_refs: [REF-000048, REF-000053, REF-000054, REF-000055]
