schema_version: 2.0.0
type: detection-analytic
id: NJA-000015
strategy_ref: DET-000041
name:
  zh: 公共 AI 侦查服务商关联分析
  en: Public-AI Reconnaissance Provider Correlation Analytic
summary:
  zh: 从提示与工具调用序列识别目标化跨源综合，并依据账户关系、服务商处置和后续使用校准恶意置信度。
  en: Identify targeted cross-source synthesis from prompt and tool-invocation sequences and calibrate malicious confidence through account relationships, provider enforcement, and downstream use.
domains: [enterprise]
platforms: [Public AI Service, AI Search, Public AI API]
logic:
  paragraphs:
  - zh: 将服务商账户、会话、提示、响应、分类器标签和工具调用规范化，并从提示与输出提取目标人员、组织、邮箱、伙伴、技术、产品和攻击面实体。按账户和会话识别围绕同一目标的多轮实体补齐、名单扩展、关系推断、跨源综合和检索请求，区分模型知识直接回答、服务商实时检索以及只返回链接后由用户访问。若目标化综合与已知威胁账户关系、平台策略命中、资产禁用或后续定向活动一致，则提高风险；缺少实际来源访问差异时只确认公共 AI 研究，不强断言完全查询替代。
    en: Normalize provider account, session, prompt, response, classifier label, and tool invocation and extract target people, organizations, email addresses, partners, technologies, products, and attack-surface entities from prompts and outputs. By account and session, identify multi-turn entity completion, list expansion, relationship inference, cross-source synthesis, and retrieval requests around the same target, distinguishing direct answers from model knowledge, live provider retrieval, and links merely returned for later user access. Raise risk when targeted synthesis aligns with known threat-account relationships, policy hits, asset disabling, or downstream targeting; without evidence of changed original-source access, confirm public-AI research but do not overstate complete query substitution.
data_requirements:
- source_type: ai-provider-interaction-audit
  name:
    zh: 公共 AI 账户与交互审计
    en: Public-AI account and interaction audit
  channel: null
  required_fields: [account_id, session_id, timestamp, requester_origin, device_id, prompt_text, response_text, classifier_labels, policy_action]
- source_type: ai-tool-invocation-audit
  name:
    zh: AI 检索与工具调用审计
    en: AI retrieval and tool-invocation audit
  channel: null
  required_fields: [session_id, timestamp, tool_name, query_text, destination, result_ids, invocation_status]
- source_type: downstream-targeting-event
  name:
    zh: 后续定向活动与平台处置事件
    en: Downstream targeting and platform-enforcement events
  channel: null
  required_fields: [timestamp, actor_indicator, target_entity, referenced_attribute, action_type, enforcement_state]
observables:
- zh: 同一账户跨会话补齐特定组织的人员、邮箱、伙伴、技术和攻击面列表
  en: One account completes lists of people, email addresses, partners, technologies, and attack surfaces for a specific organization across sessions
- zh: 提示要求跨来源综合、实体关联或目标优先级，而服务商工具代为访问多个来源
  en: Prompts request cross-source synthesis, entity linking, or target prioritization while provider tools access multiple sources
- zh: AI 输出中的稀有属性随后出现在定向信息诱导、入口选择或其他攻击前活动中
  en: Rare attributes from AI output later appear in targeted elicitation, entry selection, or other pre-compromise activity
correlation:
  window:
    zh: 使用会话内分钟至小时窗口恢复提示与工具调用，并使用三十日至六个月窗口关联账户、目标实体、服务商处置和后续定向活动。
    en: Use minute-to-hour windows within sessions to reconstruct prompts and tool calls and thirty-day-to-six-month windows to correlate accounts, target entities, provider enforcement, and downstream targeting.
  dimensions: [provider_account, session, requester_origin, target_entity, prompt_intent, tool_call, output_attribute, downstream_event, time]
false_positives:
- zh: 合法安全研究、威胁分析、新闻、学术、招聘和商业尽调
  en: Legitimate security research, threat analysis, journalism, academia, recruiting, and business due diligence
- zh: 企业用户使用 AI 汇总公开客户、伙伴或技术资料
  en: Enterprise users using AI to summarize public customer, partner, or technology information
- zh: 防守人员模拟攻击者查询以评估暴露和模型安全
  en: Defenders simulating adversary queries to assess exposure and model safety
blind_spots:
- zh: 服务商不保留提示、响应、分类器或工具调用，或保留期短于目标研究周期
  en: The provider does not retain prompts, responses, classifiers, or tool calls or retention is shorter than the target-research period
- zh: 攻击者使用严格隔离账户、无账户服务或本地私有模型
  en: The adversary uses strictly separated accounts, accountless services, or local private models
- zh: 模型知识直接回答且输出没有可与后续活动关联的稀有属性
  en: Model knowledge answers directly and output contains no rare attribute linkable to downstream activity
tuning_guidance:
  paragraphs:
  - zh: 应按账户用途、组织授权、查询规模、目标敏感度和服务功能建立基线，并区分一般公开研究、目标化综合、服务商检索替代和已确认恶意账户四个结果层级。内容分类不能单独判定恶意，应结合账户关系、工具访问范围、稀有输出复用和平台处置；保留与共享还必须遵守隐私、合同和法律要求。
    en: Establish baselines by account purpose, organizational authorization, query scale, target sensitivity, and service function and separate general public research, targeted synthesis, provider-retrieval substitution, and confirmed malicious account results. Content classification must not determine maliciousness alone and should be combined with account relationships, tool-access scope, reuse of rare output, and platform enforcement; retention and sharing must comply with privacy, contract, and legal requirements.
evidence_refs: [REF-000041, REF-000043, REF-000049, REF-000056]
