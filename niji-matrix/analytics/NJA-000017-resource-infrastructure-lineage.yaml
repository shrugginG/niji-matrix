schema_version: "2.0.0"
type: detection-analytic
id: NJA-000017
strategy_ref: DET-000043
name:
  zh: 取得型行动基础设施来源与生命周期谱系分析
  en: Acquired Operational-Infrastructure Provenance and Lifecycle Lineage Analytic
summary:
  zh: 从提供方控制平面和网络历史恢复共享租户、预用老化资源与预置替换池的取得和启用关系。
  en: Recover acquisition and activation relationships for shared tenants, pre-use aged resources, and prepositioned replacement pools from provider control planes and network history.
domains:
  - enterprise
platforms:
  - Cloud
  - Web Service
  - DNS
  - Network
logic:
  paragraphs:
    - zh: 统一资源、租户、注册者、账单主体、证书、DNS、IP、托管、对象和后续目标标识，并建立从取得、低活动维护、首次启用、替换到退役的时间线。共享服务场景比较同一提供方下租户和对象行为而不按外层域整体定性；老化场景识别长期低 DNS 或服务活动后的突增，并检查域龄之外的启用关系；资源池场景把成组注册、共同证书或命名、配对托管、相似对象和目标顺序连接起来。只有生命周期跃迁与对象级异常或后续恶意用途形成组合时才提高风险。
      en: Normalize resource, tenant, registrant, billing subject, certificate, DNS, IP, hosting, object, and downstream-target identifiers and build a timeline from acquisition and low-activity maintenance through first activation, replacement, and retirement. For shared services, compare tenant and object behavior beneath the same provider instead of classifying the outer domain as a whole; for aging, identify a surge after prolonged low DNS or service activity and inspect activation relationships beyond domain age; for resource pools, connect grouped registrations, shared certificates or naming, paired hosting, similar objects, and target order. Raise risk only when lifecycle transitions combine with object-level anomaly or downstream malicious use.
data_requirements:
  - source_type: infrastructure-control-plane
    name:
      zh: 云、Web、DNS、注册与托管控制平面
      en: Cloud, Web, DNS, registration, and hosting control planes
    channel: null
    required_fields:
      - timestamp
      - resource_id
      - tenant_id
      - registrant_id
      - billing_id
      - action
      - certificate_id
      - object_id
      - configuration_hash
  - source_type: dns-certificate-hosting-history
    name:
      zh: DNS、证书、IP 与托管历史
      en: DNS, certificate, IP, and hosting history
    channel: null
    required_fields:
      - timestamp
      - resource_id
      - domain
      - dns_answer
      - certificate_id
      - ip_address
      - hosting_provider
      - traffic_volume
  - source_type: infrastructure-use-observation
    name:
      zh: 基础设施对象与后续用途观测
      en: Infrastructure object and downstream-use observation
    channel: null
    required_fields:
      - timestamp
      - resource_id
      - tenant_id
      - object_id
      - content_hash
      - response_fingerprint
      - destination
      - outcome
observables:
  - zh: 合法共享服务的新租户或对象在外层域与证书不变的情况下出现异常重定向、托管或目标连接
    en: A new tenant or object under a legitimate shared service shows anomalous redirection, hosting, or target connections while outer domain and certificate remain unchanged
  - zh: 长期低 DNS 或服务活动的资源在启用窗口突然出现显著流量和目标变化
    en: A resource with prolonged low DNS or service activity shows a sudden material change in traffic and targets at activation
  - zh: 多个资源具有共同注册、证书、命名、对象或托管关系，并按相似目标顺序快速替换
    en: Multiple resources share registration, certificate, naming, object, or hosting relationships and rapidly replace one another against similar targets
correlation:
  window:
    zh: 使用九十日至两年窗口恢复注册、休眠、证书与替换历史，并使用分钟至三十日窗口连接首次启用、对象变化、目标访问和单点失效后的切换。
    en: Use a ninety-day-to-two-year window to recover registration, dormancy, certificate, and replacement history and a minute-to-thirty-day window to join first activation, object changes, target access, and switching after point-resource failure.
  dimensions:
    - resource
    - tenant
    - registrant
    - billing_subject
    - certificate
    - dns
    - ip
    - hosting
    - object
    - content
    - target
    - time
false_positives:
  - zh: 合法新服务、营销活动、灾难恢复、弹性扩缩容和预发布资源
    en: Legitimate new services, marketing campaigns, disaster recovery, elastic scaling, and prerelease resources
  - zh: CDN、多租户 SaaS、品牌域名组合、防御性域名注册和跨供应商迁移
    en: CDNs, multi-tenant SaaS, brand-domain portfolios, defensive domain registration, and cross-provider migration
blind_spots:
  - zh: 提供方不共享租户、注册、账单、对象和控制平面事件
    en: Providers do not share tenant, registration, billing, object, and control-plane events
  - zh: 资源严格分舱、首次使用前没有网络活动且替换项不复用任何可见工件
    en: Resources are strictly compartmented, expose no network activity before first use, and replacements reuse no visible artifacts
tuning_guidance:
  paragraphs:
    - zh: 应按服务类别、租户用途、合法发布周期和组织域名组合维护基线，并将共享域解析到具体租户与对象。域龄、供应商信誉或短寿命只能作为一个特征；风险需要来自休眠到活跃的跃迁、跨资源共同谱系、对象级异常和后续目标用途的组合，同时以批准的营销、迁移和灾备计划进行有时限的调优。
      en: Maintain baselines by service class, tenant purpose, legitimate release cycle, and organizational domain portfolio and resolve shared domains to concrete tenants and objects. Domain age, provider reputation, or short lifetime is only one feature; risk should arise from combined dormant-to-active transition, shared cross-resource lineage, object-level anomaly, and downstream target use, with time-bounded tuning for approved marketing, migration, and disaster-recovery plans.
