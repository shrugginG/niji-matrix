schema_version: "2.0.0"
type: detection-analytic
id: NJA-000018
strategy_ref: DET-000044
name:
  zh: 被接管账户历史访问与首次用途关联分析
  en: Taken-Over Account History-Access and First-Use Correlation Analytic
summary:
  zh: 从异常会话后的历史内容访问和账户变化中识别真实关系情境选择，并关联首次对外用途。
  en: Identify genuine relationship-context selection from history access and account changes after anomalous sessions and correlate it with first outward use.
domains:
  - enterprise
platforms:
  - Identity Provider
  - Email
  - Collaboration
  - SaaS
logic:
  paragraphs:
    - zh: 为既有账户建立登录、令牌、设备、恢复属性、规则和设置、邮件或文件访问以及对外操作的有序时间线。先识别与长期基线不一致的会话或认证状态变化，再判断该会话是否集中搜索财务主题、联系人、共享文件或既有线程，并把选中的对象与随后收件人、业务主题或外部操作关联。只有异常会话、目的明确的历史检索、账户完整性变化和后续用途形成组合证据时才提高风险，不能把一次历史搜索或真实域发件本身作为恶意判据。
      en: Build an ordered timeline of sign-ins, tokens, devices, recovery attributes, rules and settings, mail or file access, and outward actions for an existing account. First identify a session or authentication-state change inconsistent with the long-term baseline, then determine whether that session concentrates on financial topics, contacts, shared files, or existing threads, and correlate selected objects with later recipients, business topics, or external actions. Raise risk only when anomalous session context, purpose-directed history access, account-integrity change, and downstream use form combined evidence; neither one history search nor sending from a genuine domain is malicious by itself.
data_requirements:
  - source_type: identity-session
    name:
      zh: 身份、令牌与会话遥测
      en: Identity, token, and session telemetry
    channel: null
    required_fields:
      - timestamp
      - account_id
      - session_id
      - token_id
      - device_id
      - login_origin
      - authentication_method
      - risk_result
  - source_type: account-content-access
    name:
      zh: 邮件、联系人、文件与线程访问审计
      en: Mail, contact, file, and thread access audit
    channel: null
    required_fields:
      - timestamp
      - account_id
      - session_id
      - object_type
      - object_id
      - action
      - business_topic
  - source_type: account-change-and-use
    name:
      zh: 账户完整性变化与对外用途记录
      en: Account-integrity changes and outward-use records
    channel: null
    required_fields:
      - timestamp
      - account_id
      - session_id
      - change_type
      - target_entity
      - action_type
observables:
  - zh: 异常设备或令牌会话后集中访问财务邮件、联系人、附件或既有业务线程
    en: Concentrated access to finance mail, contacts, attachments, or existing business threads after an anomalous device or token session
  - zh: 历史检索与随后选择的收件人、主题、附件或共享资源直接对应
    en: History searches map directly to recipients, topics, attachments, or shared resources selected for later use
  - zh: 同一会话同时出现恢复属性、转发规则、授权应用或其他账户完整性变化
    en: The same session also changes recovery attributes, forwarding rules, authorized applications, or other account-integrity state
correlation:
  window:
    zh: 使用分钟至三十日窗口连接异常会话、历史检索、账户变化和首次对外用途，并使用至少九十日基线判断账户通常的设备、内容访问与业务关系。
    en: Use a minute-to-thirty-day window to join anomalous sessions, history access, account changes, and first outward use, with at least a ninety-day baseline for the account's usual devices, content access, and business relationships.
  dimensions:
    - account
    - session
    - token
    - device
    - content_object
    - relationship
    - business_topic
    - target
    - time
false_positives:
  - zh: 合法账户恢复、设备迁移、电子取证、合规审计和离职交接
    en: Legitimate account recovery, device migration, forensic review, compliance audit, and employee handover
  - zh: 财务结算、客户支持和项目交接导致的集中历史检索
    en: Concentrated historical searches caused by financial closing, customer support, or project handover
blind_spots:
  - zh: 邮箱或 SaaS 不记录对象级读取、搜索条件、会话标识或令牌谱系
    en: Mail or SaaS services do not record object-level reads, search terms, session identifiers, or token lineage
  - zh: 攻击者复用原用户设备和网络位置且不修改任何账户设置
    en: The adversary reuses the original user's device and network location without changing account settings
tuning_guidance:
  paragraphs:
    - zh: 应按账户角色、共享方式、审计任务和业务周期建立历史访问基线，并分别评分会话异常、搜索目的、对象敏感度、完整性变化和首次用途。高权限或财务账户可以提高历史访问权重，但白名单必须限定到已批准会话与时间段，不能永久排除共享邮箱或管理员账户。
      en: Establish history-access baselines by account role, sharing model, audit task, and business cycle, and score session anomaly, search purpose, object sensitivity, integrity changes, and first use separately. Historical access may receive more weight for privileged or finance accounts, but allowlists must be limited to approved sessions and time periods rather than permanently excluding shared mailboxes or administrator accounts.
