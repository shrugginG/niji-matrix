schema_version: 2.0.0
type: detection-analytic
id: NJA-000019
strategy_ref: DET-000045
name:
  zh: 匿迹能力构建与供应谱系分析
  en: Stealth-Capability Build and Supply Lineage Analytic
summary:
  zh: 以多环境执行和静态谱系联合分析能力，不以哈希、签名有效性、工具名称或单一样本作为充分判断。
  en: Analyze capability through multi-environment execution and static lineage; do not treat hashes, signature validity, tool names, or one sample as sufficient verdicts.
domains:
- enterprise
platforms:
- Malware Analysis
- Build System
- Code Signing
- Software Supply
logic:
  paragraphs:
  - zh: 以多环境执行和静态谱系联合分析能力，不以哈希、签名有效性、工具名称或单一样本作为充分判断。 分析先按主体、资源、会话、构建或内容标识规范化事件，再建立准备、变化与首次高风险用途的时间线；只有所列可观测信号在相同关联维度内共同出现并与已知恶意结果或控制平面异常一致时提高风险，正常相似行为必须保留为替代解释。
    en: Analyze capability through multi-environment execution and static lineage; do not treat hashes, signature validity, tool names, or one sample as sufficient verdicts. The analytic
      first normalizes events by subject, resource, session, build, or content identifier and builds a timeline of preparation, change, and first high-risk use. Raise risk only when
      listed observables co-occur within the same dimensions and align with a known malicious outcome or control-plane anomaly, while retaining legitimate lookalikes as alternative explanations.
data_requirements:
- source_type: sample-multienvironment-analysis
  name:
    zh: 样本多环境执行与静态分析
    en: Sample multi-environment execution and static analysis
  channel: null
  required_fields:
  - timestamp
  - sample_hash
  - environment_id
  - behavior_result
  - code_similarity
  - configuration
  - debug_artifact
- source_type: signing-publisher-history
  name:
    zh: 签名、证书与发行者历史
    en: Signing, certificate, and publisher history
  channel: null
  required_fields:
  - timestamp
  - sample_hash
  - certificate_id
  - signature_status
  - publisher
  - revocation_status
- source_type: capability-provider-lineage
  name:
    zh: 能力供应商、构建与客户谱系
    en: Capability provider, build, and customer lineage
  channel: null
  required_fields:
  - timestamp
  - provider_id
  - customer_id
  - build_id
  - delivery_id
  - payment_or_tenant_id
observables:
- zh: 不同环境下激活差异
  en: Activation differences across environments
- zh: 可信签名与恶意行为冲突
  en: Trusted signature conflicting with malicious behavior
- zh: 多行动共享供应商谱系
  en: Provider lineage shared across campaigns
- zh: 稳定代码族伴随变化配置
  en: Stable code family with changing configuration
correlation:
  window:
    zh: 数月至数年，保留样本、证书和供应链历史。
    en: Months to years, retaining sample, certificate, and supply-chain history.
  dimensions:
  - sample
  - code_family
  - configuration
  - build
  - certificate
  - publisher
  - provider
  - customer
  - campaign
  - time
false_positives:
- zh: 合法条件功能与反滥用逻辑
  en: Legitimate conditional features and anti-abuse logic
- zh: 外包开发和共享组件
  en: Outsourced development and shared components
- zh: 合法签名服务与远程管理工具
  en: Legitimate signing services and remote-management tools
blind_spots:
- zh: 仅有单一样本
  en: Only one sample
- zh: 服务商/供应商日志不可得
  en: Unavailable service/provider logs
- zh: 加密配置与服务端门控
  en: Encrypted configuration and server-side gating
- zh: 私有开发环境
  en: Private development environments
tuning_guidance:
  paragraphs:
  - zh: 应按资源所有者、平台类别、业务角色、发布周期和合法条件规则建立基线，并分别评分来源、生命周期、行为差异和后续结果。白名单必须限定到具体主体、用途和有效期，不能永久排除共享服务、长期账户、合法工具或个性化响应；单一信号不足以触发处置。
    en: Maintain baselines by resource owner, platform class, business role, release cycle, and legitimate conditional rule, and score provenance, lifecycle, behavioral difference, and
      downstream outcome separately. Allowlists must be limited to concrete subjects, purposes, and validity periods rather than permanently excluding shared services, long-lived accounts,
      legitimate tools, or personalized responses; one signal is insufficient for enforcement.
