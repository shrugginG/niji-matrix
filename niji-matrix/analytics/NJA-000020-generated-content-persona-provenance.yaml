schema_version: 2.0.0
type: detection-analytic
id: NJA-000020
strategy_ref: DET-000046
name:
  zh: 欺骗内容人物设定与来源关联分析
  en: Deceptive-Content Persona and Provenance Correlation Analytic
summary:
  zh: 联合目标实体、人物属性、跨模态内容、生成基础设施和后续行动；单个流畅文本、AI 痕迹或合成媒体信号不能证明恶意。
  en: Join target entities, persona attributes, cross-modal content, generation infrastructure, and downstream action. Fluent text, AI artifacts, or one synthetic-media signal cannot
    establish maliciousness alone.
domains:
- enterprise
platforms:
- Content Platform
- Public AI Service
- Collaboration
logic:
  paragraphs:
  - zh: 联合目标实体、人物属性、跨模态内容、生成基础设施和后续行动；单个流畅文本、AI 痕迹或合成媒体信号不能证明恶意。 分析先按主体、资源、会话、构建或内容标识规范化事件，再建立准备、变化与首次高风险用途的时间线；只有所列可观测信号在相同关联维度内共同出现并与已知恶意结果或控制平面异常一致时提高风险，正常相似行为必须保留为替代解释。
    en: Join target entities, persona attributes, cross-modal content, generation infrastructure, and downstream action. Fluent text, AI artifacts, or one synthetic-media signal cannot
      establish maliciousness alone. The analytic first normalizes events by subject, resource, session, build, or content identifier and builds a timeline of preparation, change, and
      first high-risk use. Raise risk only when listed observables co-occur within the same dimensions and align with a known malicious outcome or control-plane anomaly, while retaining
      legitimate lookalikes as alternative explanations.
data_requirements:
- source_type: content-production-audit
  name:
    zh: 内容创作、提示与版本审计
    en: Content production, prompt, and version audit
  channel: null
  required_fields:
  - timestamp
  - account_id
  - content_id
  - version_id
  - prompt_or_brief
  - template_id
  - source_assets
- source_type: content-artifact-analysis
  name:
    zh: 文本与媒体工件分析
    en: Text and media artifact analysis
  channel: null
  required_fields:
  - content_id
  - language
  - style_features
  - persona_attributes
  - brand_features
  - media_fingerprint
- source_type: first-content-use
  name:
    zh: 内容首次发送或展示事件
    en: First content sending or display event
  channel: null
  required_fields:
  - timestamp
  - content_id
  - sender_account
  - target_entity
  - channel
  - action_type
observables:
- zh: 多个内容与目标细节高度匹配
  en: Multiple assets closely matching victim details
- zh: 同一人物跨账户复用生成痕迹
  en: One persona reusing generation artifacts across accounts
- zh: 语气/身份一致但来源或关系不可验证
  en: Coherent tone and identity with unverifiable provenance or relationship
- zh: 内容生成后进入高风险接触
  en: High-risk contact after content generation
correlation:
  window:
    zh: 数天至数年，覆盖人物设定培育与下游使用。
    en: Days to years, covering persona cultivation and downstream use.
  dimensions:
  - content
  - version
  - creator_account
  - template
  - persona
  - target
  - media_fingerprint
  - first_use
  - time
false_positives:
- zh: 营销、招聘、翻译和创意内容
  en: Marketing
- zh: 辅助技术与无障碍媒体
  en: recruiting
- zh: 合法人物品牌运营
  en: translation
blind_spots:
- zh: 人工/本地生成无平台日志
  en: Human/local generation without provider logs
- zh: 内容被重写或去元数据
  en: Rewritten or metadata-stripped content
- zh: 跨平台共享受限
  en: Restricted cross-platform sharing
- zh: 缺少下游结果
  en: Missing downstream outcome
tuning_guidance:
  paragraphs:
  - zh: 应按资源所有者、平台类别、业务角色、发布周期和合法条件规则建立基线，并分别评分来源、生命周期、行为差异和后续结果。白名单必须限定到具体主体、用途和有效期，不能永久排除共享服务、长期账户、合法工具或个性化响应；单一信号不足以触发处置。
    en: Maintain baselines by resource owner, platform class, business role, release cycle, and legitimate conditional rule, and score provenance, lifecycle, behavioral difference, and
      downstream outcome separately. Allowlists must be limited to concrete subjects, purposes, and validity periods rather than permanently excluding shared services, long-lived accounts,
      legitimate tools, or personalized responses; one signal is insufficient for enforcement.
