schema_version: 2.0.0
type: detection-analytic
id: NJA-000021
strategy_ref: DET-000047
name:
  zh: 条件门控投放多视角差异分析分析
  en: Multi-Vantage Differential Analysis of Context-Gated Staging Analytic
summary:
  zh: 规范化响应后比较状态码、重定向、脚本、内容哈希和网络取用，并与部署策略及端点结果关联；A/B 测试和个性化必须作为主要误报类别。
  en: Normalize and compare status codes, redirects, scripts, content hashes, and network retrieval, then correlate with deployment policy and endpoint outcomes; A/B testing and personalization
    are primary false-positive classes.
domains:
- enterprise
platforms:
- Web
- Cloud
- Advertising
- Object Storage
logic:
  paragraphs:
  - zh: 规范化响应后比较状态码、重定向、脚本、内容哈希和网络取用，并与部署策略及端点结果关联；A/B 测试和个性化必须作为主要误报类别。 分析先按主体、资源、会话、构建或内容标识规范化事件，再建立准备、变化与首次高风险用途的时间线；只有所列可观测信号在相同关联维度内共同出现并与已知恶意结果或控制平面异常一致时提高风险，正常相似行为必须保留为替代解释。
    en: Normalize and compare status codes, redirects, scripts, content hashes, and network retrieval, then correlate with deployment policy and endpoint outcomes; A/B testing and personalization
      are primary false-positive classes. The analytic first normalizes events by subject, resource, session, build, or content identifier and builds a timeline of preparation, change,
      and first high-risk use. Raise risk only when listed observables co-occur within the same dimensions and align with a known malicious outcome or control-plane anomaly, while retaining
      legitimate lookalikes as alternative explanations.
data_requirements:
- source_type: multivantage-web-observation
  name:
    zh: 多视角 Web 与下载观测
    en: Multi-vantage Web and download observations
  channel: null
  required_fields:
  - timestamp
  - vantage_id
  - source_region
  - device_profile
  - request_url
  - referrer
  - response_status
  - redirect_chain
  - object_hash
- source_type: staging-control-plane
  name:
    zh: 投放服务控制平面与条件规则
    en: Staging-service control plane and conditional rules
  channel: null
  required_fields:
  - tenant_id
  - object_id
  - rule_id
  - condition_fields
  - response_object
  - modified_at
- source_type: downstream-object-use
  name:
    zh: 投放对象后续取用和执行
    en: Downstream staged-object retrieval and execution
  channel: null
  required_fields:
  - timestamp
  - object_hash
  - target_entity
  - retrieval_source
  - execution_result
observables:
- zh: 相同 URL 返回空白/正常/恶意不同内容
  en: One URL returning blank
- zh: 特定地域或设备才出现重定向
  en: benign
- zh: 一次性会话和短暴露窗口
  en: or malicious content
correlation:
  window:
    zh: 单次会话至数周，保留每个视点完整重定向和内容谱系。
    en: One session to weeks, retaining complete redirect and content lineage for every vantage.
  dimensions:
  - url
  - tenant
  - object
  - rule
  - vantage
  - device
  - geography
  - referrer
  - response_variant
  - time
false_positives:
- zh: A/B 测试、区域化和设备适配
  en: A/B testing
- zh: CDN/反滥用策略
  en: localization
- zh: 合法一次性下载和登录会话
  en: and device adaptation
blind_spots:
- zh: 精确目标画像
  en: Precise target profiles
- zh: 极短窗口
  en: Extremely short windows
- zh: 一次性令牌
  en: One-time tokens
- zh: 无法获得提供方策略日志
  en: Unavailable provider policy logs
tuning_guidance:
  paragraphs:
  - zh: 应按资源所有者、平台类别、业务角色、发布周期和合法条件规则建立基线，并分别评分来源、生命周期、行为差异和后续结果。白名单必须限定到具体主体、用途和有效期，不能永久排除共享服务、长期账户、合法工具或个性化响应；单一信号不足以触发处置。
    en: Maintain baselines by resource owner, platform class, business role, release cycle, and legitimate conditional rule, and score provenance, lifecycle, behavioral difference, and
      downstream outcome separately. Allowlists must be limited to concrete subjects, purposes, and validity periods rather than permanently excluding shared services, long-lived accounts,
      legitimate tools, or personalized responses; one signal is insufficient for enforcement.
