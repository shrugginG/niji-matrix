schema_version: 2.0.0
type: detection-analytic
id: NJA-000023
strategy_ref: DET-000049
name:
  zh: 被攻陷基础设施完整性与出口谱系分析
  en: Compromised-Infrastructure Integrity and Egress Lineage Analytic
summary:
  zh: 构建资源—租户—所有者—证书—内容—目标图，比较取得、配置和使用时间线；域名、ASN 或知名供应商本身不得作为充分善恶判据。
  en: Build resource-tenant-owner-certificate-content-target graphs and compare acquisition, configuration, and use timelines. Domain, ASN, or well-known provider alone is not a sufficient
    trust verdict.
domains:
- enterprise
platforms:
- Network
- Web Service
- Cloud
- Network Device
logic:
  paragraphs:
  - zh: 构建资源—租户—所有者—证书—内容—目标图，比较取得、配置和使用时间线；域名、ASN 或知名供应商本身不得作为充分善恶判据。 分析先按主体、资源、会话、构建或内容标识规范化事件，再建立准备、变化与首次高风险用途的时间线；只有所列可观测信号在相同关联维度内共同出现并与已知恶意结果或控制平面异常一致时提高风险，正常相似行为必须保留为替代解释。
    en: Build resource-tenant-owner-certificate-content-target graphs and compare acquisition, configuration, and use timelines. Domain, ASN, or well-known provider alone is not a sufficient
      trust verdict. The analytic first normalizes events by subject, resource, session, build, or content identifier and builds a timeline of preparation, change, and first high-risk
      use. Raise risk only when listed observables co-occur within the same dimensions and align with a known malicious outcome or control-plane anomaly, while retaining legitimate lookalikes
      as alternative explanations.
data_requirements:
- source_type: asset-integrity-audit
  name:
    zh: 资产配置与服务完整性审计
    en: Asset configuration and service-integrity audit
  channel: null
  required_fields:
  - timestamp
  - resource_id
  - owner_id
  - configuration_hash
  - service_state
  - process_or_object
  - change_actor
- source_type: edge-egress-observation
  name:
    zh: 边缘节点与目标侧出口观测
    en: Edge-node and victim-side egress observation
  channel: null
  required_fields:
  - timestamp
  - source_ip
  - device_id
  - network_owner
  - protocol
  - certificate_id
  - destination
  - session_id
observables:
- zh: 共享服务租户突然承载恶意对象
  en: Shared-service tenant suddenly hosting malicious objects
- zh: 正常资产叠加异常代理/托管功能
  en: Normal assets gaining anomalous proxy or hosting function
- zh: 资源取得后快速投放能力
  en: Capability staging soon after resource acquisition
- zh: 所有权与操作者关系不一致
  en: Ownership inconsistent with operator relationships
correlation:
  window:
    zh: 数小时至一年，保留注册、证书、托管和内容历史。
    en: Hours to one year, retaining registration, certificate, hosting, and content history.
  dimensions:
  - resource
  - owner
  - device
  - configuration
  - certificate
  - network_origin
  - target
  - time
false_positives:
- zh: 合法新业务和迁移
  en: Legitimate new business and migration
- zh: CDN/PaaS 多租户变化
  en: CDN/PaaS multi-tenant changes
- zh: 授权代理、远程运维和安全测试
  en: Authorized proxies
blind_spots:
- zh: 提供方日志不可得
  en: Unavailable provider logs
- zh: 快速销毁租户
  en: Rapidly destroyed tenants
- zh: 加密或一次性对象
  en: Encrypted or one-time objects
- zh: 被攻陷所有者缺少基线
  en: Compromised owners lacking baselines
tuning_guidance:
  paragraphs:
  - zh: 应按资源所有者、平台类别、业务角色、发布周期和合法条件规则建立基线，并分别评分来源、生命周期、行为差异和后续结果。白名单必须限定到具体主体、用途和有效期，不能永久排除共享服务、长期账户、合法工具或个性化响应；单一信号不足以触发处置。
    en: Maintain baselines by resource owner, platform class, business role, release cycle, and legitimate conditional rule, and score provenance, lifecycle, behavioral difference, and
      downstream outcome separately. Allowlists must be limited to concrete subjects, purposes, and validity periods rather than permanently excluding shared services, long-lived accounts,
      legitimate tools, or personalized responses; one signal is insufficient for enforcement.
