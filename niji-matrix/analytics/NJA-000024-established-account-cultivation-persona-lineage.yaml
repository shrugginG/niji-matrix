schema_version: 2.0.0
type: detection-analytic
id: NJA-000024
strategy_ref: DET-000050
name:
  zh: 新建行动账户培育与跨平台人物谱系分析
  en: Established Operational-Account Cultivation and Cross-Platform Persona Lineage Analytic
summary:
  zh: 联合注册/培育序列、身份异常和内容访问，要求多个独立信号并区分共享邮箱、合法委派、设备迁移和真实长期用户。
  en: Join registration and cultivation sequences with identity anomalies and content access, require multiple independent signals, and distinguish shared mailboxes, legitimate delegation,
    device migration, and genuine long-term users.
domains:
- enterprise
platforms:
- Identity Provider
- Email
- Social Media
- SaaS
logic:
  paragraphs:
  - zh: 联合注册/培育序列、身份异常和内容访问，要求多个独立信号并区分共享邮箱、合法委派、设备迁移和真实长期用户。 分析先按主体、资源、会话、构建或内容标识规范化事件，再建立准备、变化与首次高风险用途的时间线；只有所列可观测信号在相同关联维度内共同出现并与已知恶意结果或控制平面异常一致时提高风险，正常相似行为必须保留为替代解释。
    en: Join registration and cultivation sequences with identity anomalies and content access, require multiple independent signals, and distinguish shared mailboxes, legitimate delegation,
      device migration, and genuine long-term users. The analytic first normalizes events by subject, resource, session, build, or content identifier and builds a timeline of preparation,
      change, and first high-risk use. Raise risk only when listed observables co-occur within the same dimensions and align with a known malicious outcome or control-plane anomaly,
      while retaining legitimate lookalikes as alternative explanations.
data_requirements:
- source_type: account-registration-lifecycle
  name:
    zh: 账户注册、设备、恢复与登录生命周期
    en: Account registration, device, recovery, and sign-in lifecycle
  channel: null
  required_fields:
  - timestamp
  - account_id
  - platform
  - device_id
  - network_origin
  - recovery_id
  - action
- source_type: profile-relationship-history
  name:
    zh: 画像、关系与内容活动历史
    en: Profile, relationship, and content-activity history
  channel: null
  required_fields:
  - timestamp
  - account_id
  - persona_attribute
  - relationship_id
  - content_id
  - activity_type
- source_type: account-risk-use
  name:
    zh: 账户高风险首次用途与处置
    en: Account high-risk first use and enforcement
  channel: null
  required_fields:
  - timestamp
  - account_id
  - target_entity
  - action_type
  - risk_result
  - enforcement_outcome
observables:
- zh: 长期低风险活动后突然高风险接触
  en: High-risk contact after long low-risk activity
- zh: 接管信号后遍历历史邮件/联系人
  en: Historical mail or contact traversal after takeover signals
- zh: 多账户共享设备或恢复属性
  en: Shared devices or recovery properties across accounts
- zh: 真实域通过认证但行为偏离基线
  en: Real-domain authentication with behavior departing from baseline
correlation:
  window:
    zh: 90 天至数年；接管到首次下游使用另用小时至 30 天窗口。
    en: Ninety days to years, with an hours-to-30-day window from takeover to first downstream use.
  dimensions:
  - account
  - device
  - recovery_identity
  - persona
  - relationship
  - content
  - platform
  - first_high_risk_use
  - time
false_positives:
- zh: 合法新员工与品牌账户
  en: Legitimate new employees and brand accounts
- zh: 销售/招聘长期培育
  en: Long-term sales or recruiting cultivation
- zh: 设备更换、旅行和人员交接
  en: Device replacement
- zh: 法务取证与数据迁移
  en: travel
blind_spots:
- zh: 个人/第三方平台日志不可得
  en: Unavailable personal or third-party platform logs
- zh: 真实设备或委派会话被控制
  en: Controlled real devices or delegated sessions
- zh: 跨平台缺少关联许可
  en: No authority for cross-platform correlation
- zh: 端到端加密
  en: End-to-end encryption
tuning_guidance:
  paragraphs:
  - zh: 应按资源所有者、平台类别、业务角色、发布周期和合法条件规则建立基线，并分别评分来源、生命周期、行为差异和后续结果。白名单必须限定到具体主体、用途和有效期，不能永久排除共享服务、长期账户、合法工具或个性化响应；单一信号不足以触发处置。
    en: Maintain baselines by resource owner, platform class, business role, release cycle, and legitimate conditional rule, and score provenance, lifecycle, behavioral difference, and
      downstream outcome separately. Allowlists must be limited to concrete subjects, purposes, and validity periods rather than permanently excluding shared services, long-lived accounts,
      legitimate tools, or personalized responses; one signal is insufficient for enforcement.
evidence_refs:
