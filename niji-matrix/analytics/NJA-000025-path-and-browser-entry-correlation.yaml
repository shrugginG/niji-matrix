schema_version: 2.0.0
type: detection-analytic
id: NJA-000025
strategy_ref: DET-000051
name:
  zh: 传输路径与浏览器入口多视点关联分析
  en: Transfer-Path and Browser-Entry Multivantage Correlation Analytic
summary:
  zh: 保留完整请求响应、重定向和进程谱系并做授权多视点差分；单一 URL 或域信誉不定性。
  en: Preserve complete request-response, redirect, and process lineage and perform authorized multivantage differentials; one URL or domain reputation is not dispositive.
domains:
- enterprise
platforms:
- Network
- Web
- Browser
- Endpoint
logic:
  paragraphs:
  - zh: 保留完整请求响应、重定向和进程谱系并做授权多视点差分；单一 URL 或域信誉不定性。分析先按配置的关联维度规范化事件，建立入口条件、控制变化、实际进入与首个结果的序列；仅当所列可观测信号在相同关联键内共同出现，并与控制平面异常、完整性变化或已确认入口结果一致时提高风险，正常相似行为必须作为替代解释保留。
    en: Preserve complete request-response, redirect, and process lineage and perform authorized multivantage differentials; one URL or domain reputation is not dispositive. The analytic
      first normalizes events across the configured correlation dimensions and builds a sequence from entry condition through control change, actual entry, and first outcome. Raise risk
      only when listed observables co-occur on the same correlation keys and align with a control-plane anomaly, integrity change, or confirmed entry outcome, while retaining legitimate
      lookalikes as alternative explanations.
data_requirements:
- source_type: multivantage-request-response
  name:
    zh: 多视角请求与响应记录
    en: Multi-vantage request and response records
  channel: null
  required_fields:
  - timestamp
  - vantage_id
  - client_id
  - request_url
  - request_headers
  - response_status
  - response_headers
  - response_hash
- source_type: web-resource-provenance
  name:
    zh: 网页资源与重定向谱系
    en: Web-resource and redirect lineage
  channel: null
  required_fields:
  - timestamp
  - page_url
  - resource_url
  - resource_hash
  - redirect_source
  - redirect_target
  - publisher_or_tenant
- source_type: browser-endpoint-lineage
  name:
    zh: 浏览器与端点结果谱系
    en: Browser and endpoint outcome lineage
  channel: null
  required_fields:
  - timestamp
  - device_id
  - browser_process
  - page_url
  - child_process
  - download_hash
  - network_destination
observables:
- zh: 相同请求跨视点响应不同
  en: One request differing across vantages
- zh: 重复序列号异载荷
  en: Duplicate sequence numbers with different payloads
- zh: 网页资源图局部变化
  en: Local page-resource graph changes
- zh: 浏览后短窗执行
  en: Execution shortly after browsing
correlation:
  window:
    zh: 关联窗口覆盖单请求至数日，并依据入口类型、事件延迟与日志保留期调整。
    en: The correlation window spans one request to days and is adjusted for entry type, event delay, and telemetry retention.
  dimensions:
  - request
  - url
  - origin
  - vantage
  - client
  - redirect
  - object
  - process
  - time
false_positives:
- zh: CDN/Anycast、A/B 测试、合法代理和安全注入
  en: CDN/Anycast, a/B testing, and legitimate proxies and security injection
blind_spots:
- zh: TLS 终止点受控、短时门控、缺少端点遥测
  en: controlled TLS termination, short gating, and missing endpoint telemetry
tuning_guidance:
  paragraphs:
  - zh: 应按资产所有者、业务角色、入口类型、设备群、地理、发布周期与合法个性化条件建立基线，并分别评分来源、行为差异、完整性变化和入口后结果。白名单必须限定到具体主体、用途和有效期，不能永久排除可信平台、长期身份、已签名制品或维护活动；单一信号不足以触发处置。
    en: Maintain baselines by asset owner, business role, entry type, device population, geography, release cycle, and legitimate personalization condition, and score provenance, behavioral
      difference, integrity change, and post-entry outcome separately. Allowlists must be scoped to a concrete subject, purpose, and validity period rather than permanently excluding
      trusted platforms, long-lived identities, signed artifacts, or maintenance activity; one signal is insufficient for enforcement.
