schema_version: 2.0.0
type: detection-analytic
id: NJA-000026
strategy_ref: DET-000052
name:
  zh: 公开应用利用与边界设备入口关联分析
  en: Public-Application Exploit and Edge-Entry Correlation Analytic
summary:
  zh: 将资产版本与请求链、设备外送日志和端点结果关联，不依赖请求频次或单个 IOC。
  en: Join asset version with request chain, exported device logs, and endpoint outcomes without relying on frequency or one IOC.
domains:
- enterprise
platforms:
- Web Server
- Cloud
- Network Device
- Application Server
logic:
  paragraphs:
  - zh: 将资产版本与请求链、设备外送日志和端点结果关联，不依赖请求频次或单个 IOC。分析先按配置的关联维度规范化事件，建立入口条件、控制变化、实际进入与首个结果的序列；仅当所列可观测信号在相同关联键内共同出现，并与控制平面异常、完整性变化或已确认入口结果一致时提高风险，正常相似行为必须作为替代解释保留。
    en: Join asset version with request chain, exported device logs, and endpoint outcomes without relying on frequency or one IOC. The analytic first normalizes events across the configured
      correlation dimensions and builds a sequence from entry condition through control change, actual entry, and first outcome. Raise risk only when listed observables co-occur on the
      same correlation keys and align with a control-plane anomaly, integrity change, or confirmed entry outcome, while retaining legitimate lookalikes as alternative explanations.
data_requirements:
- source_type: application-edge-request
  name:
    zh: 公开应用与边界请求日志
    en: Public-application and edge request logs
  channel: null
  required_fields:
  - timestamp
  - asset_id
  - source
  - request_method
  - request_path
  - request_body_hash
  - response_status
  - session_id
- source_type: asset-version-configuration
  name:
    zh: 资产版本与配置清单
    en: Asset version and configuration inventory
  channel: null
  required_fields:
  - asset_id
  - product
  - version
  - configuration_hash
  - exposure
  - last_patch_time
- source_type: server-device-outcome
  name:
    zh: 服务端与设备结果遥测
    en: Server and device outcome telemetry
  channel: null
  required_fields:
  - timestamp
  - asset_id
  - process
  - file_path
  - file_hash
  - configuration_change
  - network_destination
observables:
- zh: 目标化短请求链
  en: Targeted short request chains
- zh: 利用后子进程/文件/外连
  en: Post-exploit child process/file/egress
- zh: 低日志设备状态变化
  en: State changes on low-log devices
correlation:
  window:
    zh: 关联窗口覆盖数分钟至数日，并依据入口类型、事件延迟与日志保留期调整。
    en: The correlation window spans minutes to days and is adjusted for entry type, event delay, and telemetry retention.
  dimensions:
  - asset
  - version
  - request
  - session
  - process
  - file
  - configuration
  - network_destination
  - time
false_positives:
- zh: 运维扫描、健康检查、合法 API 自动化
  en: administrative scanning, health checks, and legitimate API automation
blind_spots:
- zh: 无日志边界设备、加密请求、利用后清理
  en: unlogged edge devices, encrypted requests, and post-exploit cleanup
tuning_guidance:
  paragraphs:
  - zh: 应按资产所有者、业务角色、入口类型、设备群、地理、发布周期与合法个性化条件建立基线，并分别评分来源、行为差异、完整性变化和入口后结果。白名单必须限定到具体主体、用途和有效期，不能永久排除可信平台、长期身份、已签名制品或维护活动；单一信号不足以触发处置。
    en: Maintain baselines by asset owner, business role, entry type, device population, geography, release cycle, and legitimate personalization condition, and score provenance, behavioral
      difference, integrity change, and post-entry outcome separately. Allowlists must be scoped to a concrete subject, purpose, and validity period rather than permanently excluding
      trusted platforms, long-lived identities, signed artifacts, or maintenance activity; one signal is insufficient for enforcement.
evidence_refs:
- REF-000087
- REF-000101
