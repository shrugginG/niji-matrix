schema_version: 2.0.0
type: detection-analytic
id: NJA-000027
strategy_ref: DET-000053
name:
  zh: 远程服务、有效身份与受信路径入口关联分析
  en: Remote-Service Valid-Identity and Trusted-Path Entry Correlation Analytic
summary:
  zh: 按身份+会话+设备+来源+资源建立序列，成功认证和受信来源都不能单独证明合法。
  en: Build sequences by identity, session, device, origin, and resource; neither successful authentication nor trusted origin alone proves legitimacy.
domains:
- enterprise
platforms:
- Identity Provider
- VPN
- Remote Desktop
- Cloud
- SaaS
- Windows
- Linux
- Kubernetes
logic:
  paragraphs:
  - zh: 按身份+会话+设备+来源+资源规范化事件并建立入口条件、控制变化、实际进入与首个结果的序列；成功认证和受信来源都不能单独证明合法。对持续远程服务访问，按 identity 与 service 建立至少九十日会话生命周期，识别原会话终止、端点驻留处置或凭据轮换之后仍使用旧 token/session 或高度贴合风险情境的重新进入。活动会话重放要求缺少新的主认证/MFA 且 session lineage 连续，情境拟态比较地理、ISP、设备、时间和用户正常范围；两者都需以后继资源访问证明成功，并保留正常相似行为作为替代解释。
    en: Normalize events by identity session device origin and resource and build a sequence from entry condition through control change actual entry and first outcome; neither successful authentication nor trusted origin alone proves legitimacy. For continuing remote-service access build at least a ninety-day lifecycle by identity and service and identify re-entry after original-session termination endpoint-persistence remediation or credential rotation through old token or session state or closely aligned risk context. Live-session replay requires missing fresh primary authentication or MFA with continuous session lineage while context mimicry compares geography ISP device time and the user's normal range. Both require downstream resource access proving success and retain legitimate lookalikes as alternative explanations.
  - zh: 对 NJT-0061 建立 context、session 和 feedback 三个独立评分分支，分别比较 identity 历史、回溯 token/session 与认证、连接 owner/活动/依赖，并要求攻击者控制或后继资源异常。TA0003 再为每个 identity 保存 prior_accepted_use，识别新 access episode、原 session 结束、credential/authenticator epoch、风险或处置事件，最后要求 later accepted authentication/session 与 resource allow。输出区分 identity_exposure、accepted_identity_use、persistence_unresolved 与 persistent_identity_access_confirmed；单字段或不能建立 controller/中断边界时保持未决。
    en: For NJT-0061 build independently scored context session and feedback branches that compare identity history trace token or session to authentication and join owner activity and dependency while requiring adversary control or a downstream resource anomaly. TA0003 additionally retains prior_accepted_use per identity identifies a new access episode original-session termination credential or authenticator epoch risk or response event and finally requires later accepted authentication or session plus resource allow. Outputs distinguish identity_exposure accepted_identity_use persistence_unresolved and persistent_identity_access_confirmed and remain unresolved from one field or without controller and interruption boundaries.
  - zh: TA0004 分支以同一 controller 为键，先固定攻击者较低权限 prestate_identity 与 event-time authorization snapshot，再连接 exact accepted identity/session、result_identity、实际 token/privilege/role 和首个 protected_resource decision。Windows 可按 host+Logon ID 连接 4624→4672→4663 或其他资源事件；云/SaaS 连接 sign-in identity/client/resource、session/token、event-time role/scope 与管理 API/resource audit。只有 prestate 对该 operation expected-deny、result observed-allow 且 authority set 为正差时才形成 elevation_confirmed。
    en: The TA0004 branch keys on the same controller first fixing the adversary's lower-authority prestate_identity and event-time authorization snapshot then joining the exact accepted identity or session result_identity actual token privilege or role and first protected_resource decision. Windows can join 4624 to 4672 to 4663 or another resource event by host and Logon ID. Cloud and SaaS join sign-in identity client and resource session or token event-time role or scope and management API or resource audit. Elevation_confirmed requires expected-deny for the operation under the pre-state observed-allow under the result and a positive authority-set difference.
  - zh: 输出按证据层级而非单一恶意分数升级：identity_anomaly 只表示情境、会话或反馈异常；accepted_identity_use 要求身份/会话和资源均被接受；privileged_session 要求实际结果主体具有敏感权限；authority_unresolved 表示 controller 或任一授权快照缺失；same_authority_use 明确无正差；elevation_confirmed 才代表完整权限链。Initial Access 只需首个立足点，不得因其登录账户高权而自动升级 TA0004。
    en: Output promotes by evidence tier rather than one maliciousness score. Identity_anomaly records only context session or feedback anomaly. Accepted_identity_use requires both identity or session and resource acceptance. Privileged_session requires sensitive authority on the actual result principal. Authority_unresolved marks a missing controller or authorization snapshot and same_authority_use records no positive difference. Only elevation_confirmed represents the complete authority chain. Initial Access needs a first foothold and is not automatically promoted to TA0004 because its account is privileged.
data_requirements:
- source_type: identity-session-authentication
  name:
    zh: 身份、令牌与会话认证事件
    en: Identity, token, and session authentication events
  channel: null
  required_fields:
  - timestamp
  - identity_id
  - session_id
  - token_id
  - authentication_method
  - mfa_result
  - device_id
  - network_origin
- source_type: remote-service-access
  name:
    zh: 远程服务访问与资源事件
    en: Remote-service access and resource events
  channel: null
  required_fields:
  - timestamp
  - service_id
  - identity_id
  - session_id
  - device_id
  - source
  - target_resource
  - action
- source_type: cross-organization-trust
  name:
    zh: 跨组织委托与服务主体审计
    en: Cross-organization delegation and service-principal audit
  channel: null
  required_fields:
