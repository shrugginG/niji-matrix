  - identity_id
  - session_or_token_id
  - event_type
  - access_episode_id
  - credential_or_authenticator_epoch
  - response_or_revocation_action
  - expected_effective_time
  - target_resource
  - authorization_decision
  - result_status
observables:
- zh: 会话跨 IP/设备跳变
  en: Session hopping across IP/device
- zh: 无新 MFA 的资源访问
  en: Resource access without new MFA
- zh: 新设备后立即远程接入
  en: Remote access immediately after device registration
- zh: 服务商对多客户扇出
  en: Provider fan-out across customers
- zh: 原会话或端点驻留处置后仍以旧 token/session 恢复同一远程服务访问
  en: The same remote-service access resumes with old token or session state after original-session or endpoint-persistence remediation
- zh: 新认证的 source/ISP/device/client/time 与身份历史高度贴合，但同一设备或进程此前由另一低权身份控制
  en: Fresh authentication closely matches identity source ISP device client and time history while the same device or process was previously controlled under another lower-authority identity
- zh: 敏感资源请求沿用既有 session/token，附近没有新的主认证或 MFA
  en: Sensitive-resource requests continue an existing session or token without nearby fresh primary authentication or MFA
- zh: 风险、账户禁用、密码重置或撤销事件后，会话仍被不支持或延迟执行的资源接受
  en: A session remains accepted by a resource with unsupported or delayed enforcement after a risk account-disable password-reset or revocation event
- zh: 长期无 interactive/noninteractive 合法活动且 owner 或供应关系失效的身份首次复用
  en: First reuse of an identity with long-absent legitimate interactive and noninteractive activity and an expired owner or supplier relationship
- zh: 高权服务身份从非许可主机或交互式 logon type 认证并访问新 resource/verb
  en: A privileged service identity authenticates from a nonpermitted host or interactive logon type and reaches a novel resource or verb
- zh: 同一 controller 从 prestate identity 切换到更高 result identity，后者完成前者 expected-deny 的资源操作
  en: The same controller switches from a pre-state identity to a higher result identity that completes a resource operation expected denied for the former
- zh: Windows 同一 Logon ID 出现 4624、非预期 4672 与受保护对象 4663，且权限快照相对前态为正差
  en: Windows 4624 unexpected 4672 and protected-object 4663 share a Logon ID and the authorization snapshot has a positive difference from the pre-state
- zh: 先前攻击者访问或端点驻留被处置后，同一身份在新的 access episode 再次通过认证并恢复资源 allow
  en: After prior adversary access or endpoint foothold remediation the same identity authenticates in a new access episode and restores a resource allow
- zh: 资源在风险、密码重置或撤销预期生效后仍接受旧 session/token 并产生操作结果
  en: A resource continues accepting an old session or token and produces an operation after risk password reset or revocation should have taken effect
- zh: 同一低反馈身份在沉默期和明确中断后首次复用，并从非许可主机恢复高价值资源访问
  en: The same low-feedback identity is first reused after silence and a defined interruption and restores high-value resource access from a nonpermitted host
correlation:
  window:
    zh: 热关联覆盖实时至至少九十天；身份生命周期快照和处置记录按本地 credential、休眠与 access-review 周期保留更久，以覆盖低频服务、休眠身份和延迟重入。
    en: Hot correlation spans real time through at least ninety days while identity-lifecycle snapshots and response records are retained through the longer local credential dormancy and access-review cycle to cover low-frequency services dormant identities and delayed re-entry.
  dimensions:
  - identity
  - session
  - token
  - device
  - network_origin
  - resource
  - tenant
  - delegation
  - controller
  - authentication_chain
  - logon_id
  - account_owner
  - service_dependency
  - authorization_snapshot
  - authorization_decision
  - access_episode
  - credential_or_authenticator_epoch
  - response_or_revocation_action
  - time
false_positives:
- zh: 旅行、企业 VPN/VDI、合法 MSP、设备更换
  en: travel, corporate VPN/VDI, legitimate MSPs, and device replacement
- zh: 经批准的管理员身份切换、helpdesk 代管和共享跳板机
  en: approved administrator identity switching helpdesk administration and shared jump hosts
- zh: 计划内 break-glass、灾备演练和长期休假后复工
  en: scheduled break-glass disaster-recovery exercises and return after extended leave
- zh: 季节性 batch job、低频证书轮换与按需服务账户
  en: seasonal batch jobs infrequent certificate rotation and on-demand service identities
- zh: 正常移动客户端 token refresh、离线同步与协作应用长会话
  en: normal mobile-client token refresh offline synchronization and long collaboration-app sessions
- zh: 同一高权管理员在多个资源使用等价权限且无实际权限差
  en: one privileged administrator using equivalent authority across resources without an actual authority difference
- zh: 普通断线或设备更换后的合法重认证、计划内服务重启和 token refresh
  en: legitimate reauthentication after ordinary disconnect or device replacement scheduled service restart and token refresh
- zh: 获批账户恢复、灾备、break-glass、休假后复工和季节性 workload 恢复
  en: approved account recovery disaster recovery break-glass return after leave and seasonal workload resumption
blind_spots:
- zh: 日志不共享、设备绑定缺失、真实设备被控
  en: unshared logs, missing device binding, and controlled real devices
- zh: 身份提供方与资源方不共享稳定 session/token/request ID
  en: identity and resource providers do not share stable session token or request identifiers
- zh: 目录只保留当前角色，无法恢复事件时 group/role/scope
  en: the directory retains only current roles and cannot reconstruct event-time group role or scope
- zh: Windows 审计未启用、SACL 缺失或资源访问不产生 4663
  en: Windows auditing is disabled SACLs are absent or resource access does not produce event 4663
- zh: noninteractive activity、service dependency、owner 或 HR/供应关系数据缺失导致休眠度误判
  en: missing noninteractive activity service dependency owner or HR and supplier data misclassifies dormancy
- zh: token 被真实设备继续使用、资源不支持连续重评或撤销传播延迟
  en: token use continues on a real device the resource lacks continuous reevaluation or revocation propagation is delayed
- zh: 跨租户、SaaS 或本地系统的 allow/deny 结果和 controller lineage 不可见
  en: allow or deny outcomes and controller lineage are unavailable across tenants SaaS or on-premises systems
- zh: 先前 access episode 或处置事件超出保留期，本地/离线认证缺少集中 session ID
  en: the prior access episode or response event falls outside retention and local or offline authentication lacks centralized session IDs
- zh: relying party 不暴露 token/撤销状态，或跨设备/租户无法证明 controller 连续性
  en: the relying party exposes no token or revocation state or controller continuity cannot be established across devices or tenants
tuning_guidance:
  paragraphs:
  - zh: 应按资产所有者、业务角色、入口类型、设备群、地理、发布周期与合法个性化条件建立基线，并分别评分来源、行为差异、完整性变化和入口后结果。白名单必须限定到具体主体、用途和有效期，不能永久排除可信平台、长期身份、已签名制品或维护活动；单一信号不足以触发处置。
    en: Maintain baselines by asset owner, business role, entry type, device population, geography, release cycle, and legitimate personalization condition, and score provenance, behavioral
      difference, integrity change, and post-entry outcome separately. Allowlists must be scoped to a concrete subject, purpose, and validity period rather than permanently excluding
      trusted platforms, long-lived identities, signed artifacts, or maintenance activity; one signal is insufficient for enforcement.
  - zh: T1078 context 分支按 identity 而不是全组织阈值建模 source、ISP/ASN、device、client 和 time，并同时比较身份提供方与资源方所见来源；住宅/移动 ASN、企业 VPN 或受管设备不能永久放行。session 分支按 relying party 保存 token/session issuance、refresh、resource、device/IP、risk/revocation 与 claim challenge，支持矩阵和传播延迟必须进入评分。
    en: Model source ISP or ASN device client and time for the T1078 context branch per identity rather than with organization-wide thresholds and compare origin seen by identity and resource providers. Residential or mobile ASNs enterprise VPN and managed devices cannot receive permanent allow. The session branch retains token or session issuance refresh resource device or IP risk or revocation and claim challenge per relying party and includes support matrix and propagation delay in scoring.
  - zh: feedback 分支的 dormancy threshold 应按用户、服务、季节作业、灾备和供应身份分别设定，同时检查 interactive 与 noninteractive activity、owner、dependency 和 review expiry。权限输出不得用 role rank 简单比较，应对具体 resource/action 计算前态 expected decision 与结果态 observed decision；缺少 controller 或快照时强制保留 authority_unresolved，不以高分代替证据。
    en: Set dormancy thresholds for the feedback branch separately for users services seasonal jobs disaster recovery and supplier identities while checking interactive and noninteractive activity owner dependency and review expiry. Authority output does not compare a simple role rank and instead computes the expected decision for the specific resource and action under the pre-state and the observed decision under the result. A missing controller or snapshot forces authority_unresolved and cannot be replaced by a high score.
  - zh: TA0003 基线按 human、service、guest、workload、灾备和季节身份分别定义 access episode、session 寿命、credential epoch 和资源集合。重复登录只进入候选层；只有先前攻击者控制、中断边界、后续被接受状态与 resource allow 闭合时确认 Persistence。处置后持续监控同一 identity，并逐 relying party 验证旧状态实际被拒绝。
    en: TA0003 baselines access episodes session lifetimes credential epochs and resource sets separately for human service guest workload disaster-recovery and seasonal identities. Repeated sign-in remains candidate-level and Persistence confirms only when prior adversary control interruption boundary later accepted state and resource allow close. Continue monitoring the identity after response and verify actual rejection of old state at every relying party.
