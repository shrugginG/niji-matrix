  - identity_id
  - identity_kind
  - enabled_state
  - owner_id
  - employment_or_supplier_state
  - last_interactive_activity
  - last_noninteractive_activity
  - service_dependency_id
  - permitted_host_or_logon_type
- source_type: event-time-authorization-snapshot
  name:
    zh: 事件时身份、会话与资源授权快照
    en: Event-time identity session and resource authorization snapshots
  channel: null
  required_fields:
  - timestamp
  - controller_id
  - principal_id
  - session_id
  - token_id
  - group_or_role
  - privilege_or_scope
  - resource_id
  - valid_from
  - valid_until
- source_type: endpoint-logon-security-context
