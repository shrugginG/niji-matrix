schema_version: 2.0.0
type: detection-analytic
id: NJA-000028
strategy_ref: DET-000054
name:
  zh: 物理硬件、可移动介质与无线入口关联分析
  en: Physical-Hardware Removable-Media and Wireless Entry Correlation Analytic
summary:
  zh: 按设备/介质/身份/位置连接物理与逻辑事件，单个新设备或 WLAN 登录不告警。
  en: Join physical and logical events by device, media, identity, and location; do not alert on one new device or WLAN sign-in.
domains:
- enterprise
platforms:
- Endpoint
- Network Device
- Wireless
- Physical Security
logic:
  paragraphs:
  - zh: 按设备/介质/身份/位置连接物理与逻辑事件，单个新设备或 WLAN 登录不告警。分析先按配置的关联维度规范化事件，建立入口条件、控制变化、实际进入与首个结果的序列；仅当所列可观测信号在相同关联键内共同出现，并与控制平面异常、完整性变化或已确认入口结果一致时提高风险，正常相似行为必须作为替代解释保留。
    en: Join physical and logical events by device, media, identity, and location; do not alert on one new device or WLAN sign-in. The analytic first normalizes events across the configured
      correlation dimensions and builds a sequence from entry condition through control change, actual entry, and first outcome. Raise risk only when listed observables co-occur on the
      same correlation keys and align with a control-plane anomaly, integrity change, or confirmed entry outcome, while retaining legitimate lookalikes as alternative explanations.
data_requirements:
- source_type: physical-asset-access
  name:
    zh: 物理门禁与资产盘点
    en: Physical-access and asset inventory
  channel: null
  required_fields:
  - timestamp
  - identity_id
  - location
  - asset_id
  - asset_type
  - inspection_result
- source_type: media-device-endpoint
  name:
    zh: 介质、设备与端点事件
    en: Media, device, and endpoint events
  channel: null
  required_fields:
  - timestamp
  - device_id
  - media_id
  - volume_id
  - file_path
  - file_hash
  - process
  - action
- source_type: wired-wireless-access
  name:
    zh: 交换、无线与认证接入日志
    en: Switching, wireless, and access-authentication logs
  channel: null
  required_fields:
  - timestamp
  - device_id
  - mac
  - switch_port
  - ssid
  - access_point
  - identity_id
  - authentication_result
  - signal_strength
observables:
- zh: 未知设备或带外链路
  en: Unknown devices or out-of-band links
- zh: 介质写入后脚本执行
  en: Script execution after media writes
- zh: 双宿主邻居关联目标 SSID
  en: Dual-homed neighbor joining victim SSID
- zh: 无线控制弱于公网
  en: WLAN controls weaker than public entry
correlation:
  window:
    zh: 关联窗口覆盖秒至数月，并依据入口类型、事件延迟与日志保留期调整。
    en: The correlation window spans seconds to months and is adjusted for entry type, event delay, and telemetry retention.
  dimensions:
  - device
  - media
  - identity
  - location
  - switch_port
  - ssid
  - access_point
  - radio
  - process
  - time
false_positives:
- zh: BYOD、维护介质、坞站、旅行和合法邻居
  en: BYOD, maintenance media, docks, travel, and legitimate neighbors
blind_spots:
- zh: 隔离主机无 EDR、MAC 伪造、无源设备、第三方日志不可见
  en: air-gapped hosts without EDR, MAC spoofing, passive devices, and unavailable third-party logs
tuning_guidance:
  paragraphs:
  - zh: 应按资产所有者、业务角色、入口类型、设备群、地理、发布周期与合法个性化条件建立基线，并分别评分来源、行为差异、完整性变化和入口后结果。白名单必须限定到具体主体、用途和有效期，不能永久排除可信平台、长期身份、已签名制品或维护活动；单一信号不足以触发处置。
    en: Maintain baselines by asset owner, business role, entry type, device population, geography, release cycle, and legitimate personalization condition, and score provenance, behavioral
      difference, integrity change, and post-entry outcome separately. Allowlists must be scoped to a concrete subject, purpose, and validity period rather than permanently excluding
      trusted platforms, long-lived identities, signed artifacts, or maintenance activity; one signal is insufficient for enforcement.
