schema_version: 2.0.0
type: detection-analytic
id: NJA-000029
strategy_ref: DET-000055
name:
  zh: 钓鱼会话、托管对象与首次入口跨层关联分析
  en: Phishing Conversation Hosted-Object and First-Entry Correlation Analytic
summary:
  zh: 以身份、线程、对象、设备和会话键连接全链，不按附件/链接/服务媒介分类。
  en: Join the chain by identity, thread, object, device, and session without classifying by attachment, link, or service medium.
domains:
- enterprise
platforms:
- Email
- Collaboration
- Browser
- Endpoint
- Identity Provider
logic:
  paragraphs:
  - zh: 以身份、线程、对象、设备和会话键连接全链，不按附件/链接/服务媒介分类。分析先按配置的关联维度规范化事件，建立入口条件、控制变化、实际进入与首个结果的序列；仅当所列可观测信号在相同关联键内共同出现，并与控制平面异常、完整性变化或已确认入口结果一致时提高风险，正常相似行为必须作为替代解释保留。
    en: Join the chain by identity, thread, object, device, and session without classifying by attachment, link, or service medium. The analytic first normalizes events across the configured
      correlation dimensions and builds a sequence from entry condition through control change, actual entry, and first outcome. Raise risk only when listed observables co-occur on the
      same correlation keys and align with a control-plane anomaly, integrity change, or confirmed entry outcome, while retaining legitimate lookalikes as alternative explanations.
data_requirements:
- source_type: message-conversation-audit
  name:
    zh: 邮件、即时消息与协作会话审计
    en: Mail, messaging, and collaboration conversation audit
  channel: null
  required_fields:
  - timestamp
  - sender_id
  - recipient_id
  - thread_id
  - message_id
  - reply_to
  - object_id
  - url
- source_type: hosted-object-navigation
  name:
    zh: 托管对象与导航链
    en: Hosted-object and navigation chain
  channel: null
  required_fields:
  - timestamp
  - object_id
  - tenant_id
  - url
  - redirect_source
  - redirect_target
  - requester_id
  - response_hash
- source_type: endpoint-identity-outcome
  name:
    zh: 端点与身份入口结果
    en: Endpoint and identity entry outcomes
  channel: null
  required_fields:
  - timestamp
  - device_id
  - process
  - object_id
  - identity_id
  - session_id
  - authentication_method
  - mfa_result
  - remote_assistance_event
observables:
- zh: 真实线程异常投递
  en: Anomalous delivery in real threads
- zh: 无载荷会话后访问转折
  en: Access turn after payload-free conversation
- zh: 收件人条件揭示
  en: Recipient-bound reveal
- zh: AiTM 实时会话
  en: Real-time AiTM session
- zh: 合法平台对象
  en: Legitimate platform objects
correlation:
  window:
    zh: 关联窗口覆盖单消息至数月，并依据入口类型、事件延迟与日志保留期调整。
    en: The correlation window spans one message to months and is adjusted for entry type, event delay, and telemetry retention.
  dimensions:
  - sender
  - recipient
  - thread
  - message
  - object
  - url
  - device
  - identity
  - session
  - time
false_positives:
- zh: 合法业务线程、营销自动化、远程支持、共享文档
  en: legitimate business threads, marketing automation, remote support, and shared documents
blind_spots:
- zh: E2EE/语音、平台日志不可得、一次性门控
  en: E2EE/voice, unavailable platform logs, and one-time gating
tuning_guidance:
  paragraphs:
  - zh: 应按资产所有者、业务角色、入口类型、设备群、地理、发布周期与合法个性化条件建立基线，并分别评分来源、行为差异、完整性变化和入口后结果。白名单必须限定到具体主体、用途和有效期，不能永久排除可信平台、长期身份、已签名制品或维护活动；单一信号不足以触发处置。
    en: Maintain baselines by asset owner, business role, entry type, device population, geography, release cycle, and legitimate personalization condition, and score provenance, behavioral
      difference, integrity change, and post-entry outcome separately. Allowlists must be scoped to a concrete subject, purpose, and validity period rather than permanently excluding
      trusted platforms, long-lived identities, signed artifacts, or maintenance activity; one signal is insufficient for enforcement.
