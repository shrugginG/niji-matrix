schema_version: 2.0.0
type: detection-analytic
id: NJA-000030
strategy_ref: DET-000056
name:
  zh: 供应链构建、交付与安装基数关联分析
  en: Supply-Chain Build Delivery and Installed-Base Correlation Analytic
summary:
  zh: 保留可验证构建和跨供应商依赖图，并在安装基数中比较休眠与激活差异。
  en: Preserve verifiable builds and cross-supplier dependency graphs and compare dormant versus activated behavior across the installed base.
domains:
- enterprise
platforms:
- Source Control
- Build System
- Code Signing
- Software Distribution
- Endpoint
logic:
  paragraphs:
  - zh: 保留可验证构建和跨供应商依赖图，并在安装基数中比较休眠与激活差异。分析先按配置的关联维度规范化事件，建立入口条件、控制变化、实际进入与首个结果的序列；仅当所列可观测信号在相同关联键内共同出现，并与控制平面异常、完整性变化或已确认入口结果一致时提高风险，正常相似行为必须作为替代解释保留。
    en: Preserve verifiable builds and cross-supplier dependency graphs and compare dormant versus activated behavior across the installed base. The analytic first normalizes events
      across the configured correlation dimensions and builds a sequence from entry condition through control change, actual entry, and first outcome. Raise risk only when listed observables
      co-occur on the same correlation keys and align with a control-plane anomaly, integrity change, or confirmed entry outcome, while retaining legitimate lookalikes as alternative
      explanations.
data_requirements:
- source_type: source-build-signing-lineage
  name:
    zh: 源码、构建与签名谱系
    en: Source, build, and signing lineage
  channel: null
  required_fields:
  - timestamp
  - source_revision
  - dependency_id
  - build_id
  - builder_identity
  - artifact_hash
  - signature_id
  - publisher
- source_type: release-installation-base
  name:
    zh: 发布、更新与安装基数遥测
    en: Release, update, and installed-base telemetry
  channel: null
  required_fields:
  - timestamp
  - release_id
  - artifact_hash
  - delivery_channel
  - organization_id
  - device_id
  - installation_result
- source_type: post-installation-behavior
  name:
    zh: 安装后行为与跨组织结果
    en: Post-installation behavior and cross-organization outcomes
  channel: null
  required_fields:
  - timestamp
  - artifact_hash
  - device_id
  - organization_id
  - process
  - network_destination
  - second_stage_hash
  - activation_result
observables:
- zh: 可信签名产物行为异常
  en: Behavior anomaly in trusted signed artifacts
- zh: 上游污染多层扇出
  en: Multi-layer fan-out from upstream compromise
- zh: 广泛安装后少量二阶段
  en: Selective second stage after broad install
correlation:
  window:
    zh: 关联窗口覆盖数周至数年，并依据入口类型、事件延迟与日志保留期调整。
    en: The correlation window spans weeks to years and is adjusted for entry type, event delay, and telemetry retention.
  dimensions:
  - source
  - dependency
  - build
  - artifact
  - signature
  - publisher
  - release
  - installation
  - organization
  - time
false_positives:
- zh: 合法更新、定向功能发布、共享依赖缺陷
  en: legitimate updates, targeted feature rollout, and shared dependency defects
blind_spots:
- zh: 供应商日志不可得、不可复现构建、长休眠
  en: unavailable provider logs, irreproducible builds, and long dormancy
tuning_guidance:
  paragraphs:
  - zh: 应按资产所有者、业务角色、入口类型、设备群、地理、发布周期与合法个性化条件建立基线，并分别评分来源、行为差异、完整性变化和入口后结果。白名单必须限定到具体主体、用途和有效期，不能永久排除可信平台、长期身份、已签名制品或维护活动；单一信号不足以触发处置。
    en: Maintain baselines by asset owner, business role, entry type, device population, geography, release cycle, and legitimate personalization condition, and score provenance, behavioral
      difference, integrity change, and post-entry outcome separately. Allowlists must be scoped to a concrete subject, purpose, and validity period rather than permanently excluding
      trusted platforms, long-lived identities, signed artifacts, or maintenance activity; one signal is insufficient for enforcement.
