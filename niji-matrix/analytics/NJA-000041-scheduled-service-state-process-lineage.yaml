schema_version: 2.0.0
type: detection-analytic
id: NJA-000041
strategy_ref: DET-000063
name:
  zh: 计划与服务状态—进程谱系分析
  en: Scheduled and Service State-to-Process Lineage Analytic
summary:
  zh: 以稳定关联键恢复计划与服务状态—进程谱系中的控制、执行与结果序列。
  en: Recover the control, execution, and outcome sequence for Scheduled and Service State-to-Process Lineage through stable correlation keys.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- Containers
- ESXi
- Network Devices
logic:
  paragraphs:
  - zh: 分析先规范各数据源的时间、主体、目标和请求或进程标识，再建立控制或触发、真实执行和后继结果的有向序列。只有异常主体或情境与执行谱系、完整性变化或网络结果共同出现时才提高风险；任一层缺失时降低置信度而不把单点信号直接定性。
    en: The analytic first normalizes time, principal, target, and request or process identifiers across sources, then builds a directed sequence from control or trigger through actual
      execution to follow-on outcome. Risk rises only when an anomalous principal or context co-occurs with execution lineage, integrity change, or network outcome; a missing layer lowers
      confidence rather than turning a point signal into a conclusion.
  - zh: 对持久系统服务定义，先按稳定 object ID 比较创建前后名称、账户、启动条件、原始指令、解析路径、文件哈希和对象 ACL，再连接管理器重载或启动后的进程与网络结果。若身份保持而目标改变，进入身份替换分支；若普通枚举缺失但高权限原始状态和运行结果仍存在，进入受限枚举分支。只有未经批准的 writer、定义或权限差异与异常结果组合时提高风险。
    en: For a durable system-service definition, compare pre-change and post-change name, account, start condition, raw directive, resolved path, file hash, and object ACL by stable object ID, then join the process and network outcome after manager reload or start. Identity preserved with a changed target enters the substitution branch. Absence from ordinary enumeration while privileged raw state and execution persist enters the restricted-enumeration branch. Risk rises only when an unapproved writer, definition or permission difference, and anomalous outcome combine.
  - zh: TA0004 分支在同一 object/version 上保存 writer 与 pre-state 的授权集合、manager adoption 事件、实际 service account/token/security context、post-state 授权集合和首个此前被拒绝而现已允许的操作。只有 manager 消费攻击者控制版本、post-state 相对 pre-state 有正向权限差且新获准结果归因到该进程时输出 elevation_confirmed；若只证明跨启动恢复则输出 persistence_restored，只见定义或 ACL 差异则输出 definition_anomaly，权限键不全则输出 authority_unresolved。
    en: The TA0004 branch preserves writer and pre-state authorization, manager-adoption event, actual service account, token, or security context, post-state authorization, and the first previously denied but now allowed operation for the same object and version. It emits elevation_confirmed only when the manager consumes the adversary-controlled version, post-state has a positive authority difference from pre-state, and the newly authorized result is attributable to that process. Cross-start restoration alone emits persistence_restored, a definition or ACL difference alone emits definition_anomaly, and missing authority keys emit authority_unresolved.
