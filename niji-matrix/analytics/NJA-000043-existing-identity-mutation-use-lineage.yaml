schema_version: 2.0.0
type: detection-analytic
id: NJA-000043
strategy_ref: DET-000064
name:
  zh: 既有身份变更—新增访问边—使用谱系分析
  en: Existing-Identity Mutation-Added-Access-Edge-Use Lineage Analytic
summary:
  zh: 规范身份变更、审批、状态快照和访问事件，按目标主体与访问边连接未批准的持久状态修改及其首次或异常使用。
  en: Normalize identity changes, approvals, state snapshots, and access events to join unapproved durable-state mutations and their first or
    anomalous use by target principal and access edge.
domains:
- enterprise
platforms:
- Identity Provider
- IaaS
- SaaS
- Office Suite
- Containers
- ESXi
- Windows
- Linux
- macOS
- Network Devices
logic:
  paragraphs:
  - zh: 分析首先把目录、身份提供商、云 IAM、应用授权、邮件委托、端点账户、SSH 授权、容器 RBAC 和虚拟化管理审计规范为“既有主体状态变更”记录。每条记录至少保留时间、租户或设备、变更发起主体、目标主体、操作、对象类别、结果和来源；平台若提供 modified properties、旧值与新值、key
      ID、认证方法 ID、组或角色 ID、委托对象、设备 ID、到期时间、请求 ID或审计事件 ID，则一并保存。以变更前状态快照或最近可信基线确认目标主体已经存在，并区分新增、替换、删除和临时激活；无法证明主体先前存在时转交 T1136 审查。
    en: The analytic first normalizes directory, identity-provider, cloud-IAM, application-permission, mail-delegation, endpoint-account, SSH-authorization,
      container-RBAC, and virtualization-management audit into existing-principal state-mutation records. Every record retains at least time,
      tenant or device, initiating principal, target principal, operation, object class, outcome, and origin. Where available, it also retains
      modified properties, old and new values, key ID, authentication-method ID, group or role ID, delegation object, device ID, expiry, request
      ID, or audit event ID. A pre-change snapshot or the most recent trusted baseline confirms that the target principal already existed and
      distinguishes addition, replacement, deletion, and temporary activation; events without evidence of a pre-existing principal are referred
      for T1136 review.
  - zh: 分析随后按状态键分为三条不可互换的路径。认证路径以 key ID、证书/SSH 指纹或认证方法 ID 连接新增与首次认证；授权图路径保存 role assignment、group membership、delegation 或 policy edge ID，展开嵌套关系并验证资源操作在新增边后才获准；设备信任路径连接
      Register/Add/Join device 活动、device ID、owner、trust type、PRT/令牌认证声明、合规和条件访问结果。若访问侧不暴露精确键，各分支均降为 principal 级，并记录降级原因。
    en: The analytic then separates three non-interchangeable state-key paths. The authentication path joins key ID, certificate or SSH fingerprint,
      or authentication-method ID from addition to first authentication. The authorization-graph path retains role-assignment, group-membership,
      delegation, or policy-edge ID, expands nesting, and verifies that resource action became allowed after the edge. The device-trust path joins
      Register, Add, or Join device activity, device ID, owner, trust type, PRT or token authentication claims, compliance, and Conditional Access
      result. If the access side omits an exact key, every branch falls back to principal-level correlation and records the degradation reason.
  - zh: 然后把成功或失败登录、令牌签发、服务主体认证、SSH 会话、远程访问和资源操作连接到被改变的主体。首选 key ID、证书指纹、认证方法、设备、角色分配、组成员边或委托 ID 的精确匹配；如果登录面只提供主体、状态、IP 和资源，则按租户或设备、主体、变更后时间、首次出现的来源或客户端、目标资源和权限结果进行主体级匹配，并把置信度降一级。访问发生前必须验证状态变更已经成功且仍在有效期内；只存在变更而没有使用时输出“持久访问状态异常”，只有变更与后续使用相连时才输出“账户操纵持久化链”。
    en: The analytic then joins successful or failed sign-ins, token issuance, service-principal authentication, SSH sessions, remote access,
      and resource operations to the changed principal. It prefers exact matching on key ID, certificate fingerprint, authentication method, device,
      role assignment, group-membership edge, or delegation ID. When the sign-in plane exposes only principal, status, IP, and resource, it performs
      principal-level matching by tenant or device, principal, post-change time, first-seen origin or client, target resource, and authorization
      outcome and lowers confidence by one level. It verifies that the mutation succeeded and remained valid before access. A mutation without
      use produces a durable-access-state anomaly; only mutation joined to subsequent use produces an Account Manipulation persistence chain.
  - zh: 风险评分分为来源、状态和使用三组。来源异常包括非常见管理主体、非管理工作站、被接管会话、业务外时点或缺少审批；状态异常包括原路径仍有效的第二凭据或认证方法、异常长寿命、未纳入盘点的角色或委托、过宽权限、休眠主体突然被修改，或旧值无法从基线解释；使用异常包括新增路径很快或在长延迟后首次认证、访问高价值资源、来源或设备与主体历史不符，以及合法所有者活动与攻击者活动并存。至少两个组异常且存在成功变更才提升为高风险；已确认攻击者发起者或精确访问边使用可以提高结论强度。对 TA0004，分析在同一记录中计算 authority delta，保存 initiating principal 的 pre-state 动作与 target principal 的变更前权限或 policy decision，再记录 mutation、传播/token refresh 后的 post-state，并对同一 resource/action 比较 allow/deny 或可达性。认证器路径要求进入更高权威 target，授权图路径要求 changed edge 位于实际 evaluation path，设备路径要求 device claim 将 deny/challenge 改为 allow。只有精确 edge 连接首个 newly-authorized 高敏感结果才输出“账户操纵权限提升链”；pre-state 未知或结果原本已允许时不得确认。
    en: Risk scoring uses provenance, state, and use classes. Provenance anomalies include an uncommon administrator, nonadministrative workstation,
      compromised session, off-business timing, or missing approval. State anomalies include a second credential or authentication method while
      the original remains valid, unusually long lifetime, an uninventoried role or delegation, excessive privilege, sudden mutation of a dormant
      principal, or an old value unexplained by baseline. Use anomalies include authentication by the added path soon after or long after mutation,
      access to a high-value resource, origin or device inconsistent with principal history, and concurrent activity by legitimate owner and adversary.
      High risk requires anomalies in at least two classes and a successful mutation; a confirmed adversary initiator or exact use of the changed
      edge can raise conclusion strength. For TA0004, the same record calculates authority delta, preserving actions available to the initiating principal in pre-state and the target principal's pre-mutation permission or policy decision, then recording post-state after mutation and propagation or token refresh and comparing allow or deny or reachability for the same resource and action. The authenticator path requires entry into a higher-authority target, the authorization path requires the changed edge in the actual evaluation path, and the device path requires a device claim to turn deny or challenge into allow. Only an exact edge joined to the first newly authorized high-sensitivity outcome produces an Account Manipulation privilege-escalation chain; unknown pre-state or an action already allowed cannot confirm it.
