observables:
- zh: 非常见管理主体在没有匹配审批时，为既有主体新增第二认证器、授权图边或设备信任关系。
  en: An uncommon administrator adds a second authenticator, authorization-graph edge, or device-trust relationship to an existing principal without
    matching approval.
- zh: 新增 key、证书或认证方法在原认证器仍有效时首次用于认证，且寿命、来源或类型偏离同类身份基线。
  en: A new key, certificate, or authentication method is first used while the original authenticator remains valid, with lifetime, origin, or
    type outside the peer-identity baseline.
- zh: 角色、组、委托或策略边使主体首次取得高价值资源操作；展开后的有效权限不能由工单、所有者或既有图解释。
  en: A role, group, delegation, or policy edge first enables a high-value resource action, and the resolved effective privilege is unexplained
    by change record, owner, or prior graph.
- zh: 新注册或加入的 device ID 不在资产/MDM 清单，注册时认证强度不足，随后取得 PRT、满足设备条件或访问高价值应用。
  en: A newly registered or joined device ID is absent from asset or MDM inventory, enrollment lacks expected authentication strength, and the
    device later obtains a PRT, satisfies a device condition, or accesses a high-value application.
- zh: 休眠用户或服务主体在状态变更后从新来源恢复使用，或合法所有者与新增认证器/设备出现并发活动。
  en: A dormant user or service principal resumes use from a new origin after mutation, or the legitimate owner and added authenticator or device
    show concurrent activity.
- zh: 发起者、目标主体、状态键和后续认证/授权结果形成控制面到访问面的完整因果链。
  en: Initiator, target principal, state key, and later authentication or authorization result form a complete control-plane-to-access-plane causal
    chain.
- zh: 同一 resource/action 在变更前为 deny、不可达或需要更强认证，变更后由精确 authenticator、authorization edge 或 device claim 变为 allow，并立即出现高敏感结果。
  en: The same resource and action is denied, unreachable, or requires stronger authentication before mutation and becomes allowed through an exact authenticator, authorization edge, or device claim after mutation, followed by a high-sensitivity outcome.
- zh: 目标主体本来高权限但攻击者 source context 与 changed edge 使用无法证明，或 pre-state 已允许同一操作；保留状态异常/持久化输出，不升级为 TA0004。
  en: A privileged target lacks proof connecting adversary source context and changed-edge use, or pre-state already allowed the same action; retain state-anomaly or persistence output without elevating to TA0004.
correlation:
  window:
    zh: 对变更后的立即使用使用前后十五分钟至二十四小时窗口；对延迟持久化从成功变更持续到访问边到期、撤销或最近状态快照，默认最多九十日。精确 key 或授权边匹配可覆盖其完整有效期，只有主体级匹配时默认限制为三十日，并使用至少九十日历史建立管理主体、来源、角色和使用基线。
    en: Use a fifteen-minute-to-twenty-four-hour window for immediate post-change use. For delayed persistence, extend from successful mutation
      until edge expiry, revocation, or the latest state snapshot, ninety days by default. Exact key or entitlement-edge matches may span the
      edge's complete validity, while principal-only matches default to thirty days and use at least ninety days of history for administrator,
      origin, role, and use baselines.
  dimensions:
  - tenant_or_device
  - initiating_principal
  - target_principal
  - access_edge
  - authentication_method
  - session_or_token
  - source
  - device
  - target_resource
  - approval
  - time
  - state_key_type
  - state_key_id
  - authorization_path
  - device_trust
  - authentication_strength
  - conditional_access
  - initiating_principal_pre_authority
  - target_principal_pre_authority
  - target_principal_post_authority
  - authority_delta
  - graph_or_policy_version
  - evaluation_path
  - newly_authorized_outcome
false_positives:
- zh: 批准的密钥轮换、证书续订、账户恢复和 MFA 迁移会在原认证器撤销前短暂形成并行路径。
  en: Approved key rotation, certificate renewal, account recovery, and MFA migration briefly create parallel paths before the old authenticator
    is revoked.
- zh: 入职、岗位变更、代理工作、服务迁移、基础设施即代码和应急值守会合法改变角色、组、委托或策略边。
  en: Onboarding, role change, delegated work, service migration, infrastructure as code, and emergency duty legitimately change role, group,
    delegation, or policy edges.
- zh: 新员工设备、硬件更换、BYOD、自助注册、合规重建和灾难恢复会合法生成新 device ID、PRT 或条件访问变化。
  en: New employee devices, hardware replacement, BYOD, self-service enrollment, compliance rebuild, and disaster recovery legitimately generate
    a new device ID, PRT, or Conditional Access change.
blind_spots:
- zh: 平台不记录 old/new 值、key/方法 ID、证书或 SSH 指纹时，无法证明具体并行认证器被使用，只能作主体级推断。
  en: Platforms omitting old and new values, key or method ID, certificate fingerprint, or SSH fingerprint cannot prove use of a concrete parallel
    authenticator and permit only principal-level inference.
- zh: 嵌套组、委托链、资源策略版本或授权求值路径未展开时，无法证明哪条新增边授权了具体操作。
  en: When nested groups, delegation chains, resource-policy versions, or authorization evaluation paths are not resolved, analysis cannot prove
    which added edge authorized a concrete action.
- zh: 令牌日志缺少 device ID、认证声明或条件访问结果，设备目录历史未保留，或本地设备注册未集中采集时，恶意设备关系可能无法连接到后续访问。
  en: When token logs omit device ID, authentication claims, or Conditional Access result, device-directory history is not retained, or local
    enrollment is not centrally collected, a rogue device relationship may not join to later access.
- zh: 攻击者不修改状态、删除变更历史，或控制审批工作流、资产清单与可信管理来源时，该分析失去关键判据。
  en: The analytic loses critical criteria when the adversary makes no state change, deletes mutation history, or controls approval workflow,
    asset inventory, and trusted management origin.
tuning_guidance:
  paragraphs:
  - zh: 分别为三类状态建立同类基线：认证器按类型、数量、寿命、轮换重叠和首次来源；授权图按边类型、作用域、嵌套深度、owner 和正常资源；设备按注册方式、认证强度、trust type、MDM/资产状态与网络。允许列表必须绑定具体发起者、目标、状态键、工单和有效期，不得永久放行同步服务、全局管理员、常见角色、公司网络或
      BYOD。
    en: Build separate peer baselines for the three state classes. For authenticators, use type, count, lifetime, rotation overlap, and first
      origin. For authorization graph, use edge type, scope, nesting depth, owner, and normal resources. For devices, use enrollment method, authentication
      strength, trust type, MDM or asset state, and network. Allowlists must bind concrete initiator, target, state key, change record, and validity;
      never permanently allow a synchronization service, global administrator, common role, corporate network, or BYOD.
  - zh: 将来源合法性、状态持久性和后续使用分别评分，并在输出中标明 exact-key 或 principal-only。已批准但超出寿命/范围的状态仍需复核；未批准但未使用的状态先隔离与保全证据，不直接归因。用本地轮换、岗位调整、委托、设备更换与自助注册流程回放字段、传播延迟和误报，并保证保留期覆盖最长认证器、授权边和设备关系寿命。
    en: Score provenance legitimacy, state durability, and downstream use separately, labeling output as exact-key or principal-only. Approved
      state exceeding lifetime or scope still requires review; unapproved but unused state should be isolated and preserved without immediate
      attribution. Replay local rotation, role change, delegation, hardware replacement, and self-service enrollment to validate fields, propagation
      delay, and false positives, and retain data through the longest authenticator, authorization edge, and device relationship lifetime.
  - zh: 单独校准 TA0004 输出：对每类状态建立受控 before/after replay，证明同一 resource/action 在 mutation 前被拒绝、变更后因精确 edge 或 claim 允许，并保留 initiating principal 原权限。高权限角色名、目标账户等级或注册成功都不是 authority delta；只有完整图/策略求值与 newly-authorized outcome 才能高置信，principal-only 关联最多为中低置信风险。
    en: Calibrate TA0004 output separately with controlled before-and-after replay for every state class, establishing that the same resource and action was denied before mutation and allowed after it because of the exact edge or claim, while retaining the initiating principal's original authority. A privileged role name, target-account tier, or successful enrollment is not authority delta. Only complete graph or policy evaluation plus a newly authorized outcome can be high confidence, and principal-only correlation remains medium- or low-confidence risk.
