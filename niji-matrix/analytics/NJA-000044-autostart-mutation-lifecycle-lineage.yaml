schema_version: 2.0.0
type: detection-analytic
id: NJA-000044
strategy_ref: DET-000065
name:
  zh: 自启动变更—生命周期—目标执行谱系分析
  en: Autostart Mutation-Lifecycle-Target Execution Lineage Analytic
summary:
  zh: 规范自启动状态、软件归属、启动或登录边界、consumer security context 和执行结果，按设备、用户、描述符与真实目标连接未批准变更、以后激活和权限差。
  en: Normalize autostart state, software ownership, boot or logon boundaries, consumer security context, and execution outcomes to join unapproved mutation, later activation, and authority delta by device, user, descriptor, and actual target.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- Network Devices
logic:
  paragraphs:
  - zh: 分析首先把注册表、启动目录、登录项、XDG desktop 文件、plist、受支持扩展注册和等价网络设备启动配置规范为“生命周期激活映射”。每条状态记录至少保存设备、用户或系统范围、描述符 ID 或规范路径、可见名称、目标与参数、状态和观测时间；每条变更记录补充写入主体、进程、会话、操作、旧值与新值、结果和事件
      ID。文件或目标侧再保存所有者、权限、创建与修改时间、哈希、签名、原始文件名和发布者。无法证明对象由启动或登录消费时保持未分类；服务定义、脚本正文、通用事件订阅和计划任务分别路由相邻对象。
    en: The analytic first normalizes registry, startup directories, login items, XDG desktop files, plists, supported extension registrations,
      and equivalent network-device startup configuration into lifecycle-activation mappings. Every state record retains at least device, user
      or system scope, descriptor ID or canonical path, visible name, target and arguments, state, and observation time. Every mutation record
      adds writer principal, process, session, operation, old and new values, outcome, and event ID. File or target data adds owner, permission,
      creation and modification time, hash, signature, original filename, and publisher. Objects not proven to be consumed at boot or logon remain
      unclassified, while service definitions, script bodies, general event subscriptions, and scheduled tasks are routed to neighboring objects.
  - zh: 对每个新增或改变的映射，分析在随后启动或登录边界内寻找由系统启动组件、用户 shell 或注册宿主读取同一描述符并产生的目标进程或模块。Windows Run/RunOnce 以规范注册表路径、值名和值数据连接写入和后继进程；文件型描述符以路径、目标、参数、哈希和用户连接；无法直接携带描述符
      ID 的进程使用父进程、会话、启动 ID、登录 ID 与边界时间作次级关联。RunOnce 删除、系统允许的启动延迟和多值无序执行都必须纳入状态机；缺少后继执行时只输出未批准自启动状态，不能声称已经恢复持久化。
    en: For every added or changed mapping, the analytic searches the following boot or logon boundary for a system startup component, user shell,
      or registered host consuming the same descriptor and producing the target process or module. Windows Run and RunOnce join mutation to successor
      through normalized registry path, value name, and value data. File-backed descriptors join on path, target, arguments, hash, and user. Processes
      without a direct descriptor ID use parent process, session, boot ID, logon ID, and boundary time as secondary keys. RunOnce deletion, system-permitted
      startup delay, and nondeterministic ordering among multiple values are modeled explicitly. Without successor execution, output only unapproved
      autostart state rather than claiming restored persistence.
  - zh: 最后把描述符、真实目标和软件清单做一致性评分。批准状态要求变更主体、软件包或安装器、发布者、签名、目标目录、名称主题、用户范围和维护窗口共同匹配；更新主题分支检查 EdgeUpdate、MsEdgeMsE 或其他维护式名称是否实际指向对应厂商签名且位于批准安装路径。若名称声称浏览器或更新组件，但目标是
      LocalAppData 中的解释器、非常见脚本、rundll32 加载的无关 DLL、伪装扩展或未知发布者，则标记描述符—目标冲突。风险需要状态变更、生命周期激活和来源或目标异常至少三层中的两层，已知恶意目标可以提高严重度。
    en: 'Finally, the analytic scores consistency among descriptor, actual target, and software inventory. Approved state requires the change
      principal, package or installer, publisher, signature, target directory, name theme, user scope, and maintenance window to agree. The update-themed
      branch checks whether EdgeUpdate, MsEdgeMsE, or another maintenance-style name actually resolves to the corresponding vendor signature and
      approved installation path. A descriptor-target conflict is recorded when a browser or updater name points to an interpreter in LocalAppData,
      an uncommon script, unrelated DLL loaded by rundll32, disguised extension, or unknown publisher. Risk requires evidence from at least two
      of three layers: state mutation, lifecycle activation, and anomalous provenance or target. A known-malicious target can increase severity.'
  - zh: 子项判定采用三套证据键。NJS-0084-001 需要新描述符的维护主题与至少两项软件属性冲突；NJS-0084-002 需要同一描述符在可信快照之间保持身份而 target/arguments 改变，并在后继生命周期执行新值；NJS-0084-003 需要恢复项不在真实前序应用/窗口活动中、队列由异常主体写入或违背用户选择，并由下一
      logon_id 的恢复组件启动。任一子项缺少其专属键时只输出父级。父级结果再分为三档：未批准状态；已由后续生命周期消费的 Persistence；以及 consumer 权威高于 writer/pre-state、且 exact descriptor 链接到首个新获准操作的 TA0004。最后一档缺失任一权限键时必须降级，不能从位置或系统父体推断。
    en: Child classification uses three evidence-key sets. NJS-0084-001 needs a new descriptor whose maintenance theme conflicts with at least
      two software attributes. NJS-0084-002 needs one descriptor to retain identity across trusted snapshots while target or arguments change
      and the new value executes in a later lifecycle. NJS-0084-003 needs a restoration item absent from genuine prior application or window activity,
      written by an anomalous actor or contrary to user choice, and launched by the restoration component in the next logon ID. Missing a child-specific
      key yields parent-only output. Parent outcomes then split into unapproved state, Persistence consumed by a later lifecycle, and TA0004 where
      consumer authority exceeds writer or pre-state and the exact descriptor links to the first newly authorized operation. The last outcome is
      downgraded when any authority key is missing and is never inferred from location or system parent.
data_requirements:
- source_type: autostart-configuration-mutation
  name:
    zh: 自启动注册表、文件和配置变更审计
    en: Autostart registry, file, and configuration mutation audit
  channel: null
  required_fields:
  - timestamp
  - device_id
  - user_or_system_scope
  - descriptor_id_or_path
  - operation
  - old_value
  - new_value
  - writer_principal_id
  - writer_process_id
  - event_id
  - outcome
- source_type: autostart-state-inventory
  name:
    zh: 自启动状态与描述符快照
    en: Autostart state and descriptor snapshots
  channel: null
  required_fields:
  - snapshot_time
  - device_id
  - user_or_system_scope
  - descriptor_id_or_path
  - visible_name
  - target
  - arguments
  - enabled_state
- source_type: boot-logon-lifecycle
  name:
    zh: 启动、重启与用户登录生命周期事件
    en: Boot, reboot, and user-logon lifecycle events
  channel: null
  required_fields:
  - timestamp
  - device_id
  - boot_id
  - logon_id
  - user_id
  - lifecycle_event
  - outcome
- source_type: process-module-file-integrity
  name:
    zh: 进程、模块与目标文件完整性遥测
    en: Process, module, and target-file integrity telemetry
  channel: null
  required_fields:
  - timestamp
  - device_id
  - user_id
  - process_id
  - parent_process_id
  - image_or_module
  - command_line
  - file_path
  - file_hash
  - signature_status
  - publisher
- source_type: approved-software-change-inventory
  name:
    zh: 批准软件、安装包与变更清单
    en: Approved software, package, and change inventory
  channel: null
  required_fields:
  - software_id
  - package_id
  - change_id
  - approved_principal
  - publisher
  - descriptor_name
  - installation_path
  - validity_window
- source_type: session-restoration-state-and-activity
  name:
    zh: 前序会话活动与恢复队列状态
    en: Prior-session Activity and Restoration-Queue State
  channel: null
  required_fields:
  - timestamp
  - device_id
  - user_id
  - session_id
  - application_or_window_id
  - restoration_item_id
  - target
  - writer_process_id
  - user_reopen_choice
  - snapshot_or_event_id
- source_type: lifecycle-consumer-authority-and-outcome
  name:
    zh: 生命周期 consumer 权限上下文与受限操作结果
    en: Lifecycle consumer authority context and restricted-operation outcome
  channel: null
  required_fields:
  - timestamp
  - device_id
  - boot_id
  - logon_id
  - descriptor_id_or_path
  - writer_principal_id
  - writer_effective_authority
  - consumer_process_or_module_id
  - consumer_principal_id
  - consumer_security_context_id
  - consumer_user_groups_roles
  - consumer_integrity_capabilities_or_kernel_domain
  - effective_authority_delta
  - restricted_operation
  - target_resource
  - outcome
observables:
- zh: 非批准进程或用户在启动/登录配置中创建或修改持久描述符，并使状态差异在下一次快照继续存在
  en: An unapproved process or user creates or changes a durable descriptor in boot or logon configuration and the state difference remains in
    the next snapshot
- zh: 同一描述符在后续 boot_id 或 logon_id 内由系统启动组件或用户 shell 激活与新值一致的目标
  en: The same descriptor activates a target matching its new value through a system startup component or user shell in a later boot_id or logon_id
- zh: 更新或浏览器主题名称指向 LocalAppData 解释器、非标准扩展、未知 DLL、异常参数或与软件清单不符的发布者
  en: An update- or browser-themed name resolves to an interpreter in LocalAppData, nonstandard extension, unknown DLL, unusual arguments, or
    a publisher inconsistent with software inventory
- zh: 变更与激活之间跨越创建者进程退出、用户注销或主机重启，而描述符、目标和用户关联键保持一致
  en: Mutation and activation span creator exit, user logoff, or host reboot while descriptor, target, and user correlation keys remain consistent
- zh: RunOnce 条目被执行前删除或启动执行被系统延迟，但前序变更审计和目标结果仍能恢复同一因果链
  en: A RunOnce entry is deleted before execution or startup execution is system-delayed, while prior mutation audit and target outcome still
    recover the same causal chain
- zh: 长期存在的同一描述符保持名称与路径，但目标或参数在无批准升级时改变，并在下次 boot_id/logon_id 执行新值。
  en: The same long-standing descriptor retains name and path but changes target or arguments without an approved upgrade and executes the new
    value in the next boot or logon ID.
- zh: 恢复队列出现前序会话未使用的应用目标、异常写入者或与用户“不要重新打开”选择冲突的项目，并由下一登录恢复组件启动。
  en: A restoration queue contains an application target absent from prior-session use, an anomalous writer, or an item conflicting with a user
    choice not to reopen, followed by launch through the next-logon restoration component.
- zh: 同一 descriptor 的 consumer 以高于 writer/pre-state 的 user、group、role、integrity、capability 或 kernel domain 运行，并首次成功完成旧上下文被拒绝或无权完成的操作
  en: The same descriptor's consumer runs with user, group, role, integrity, capability, or kernel domain above writer or pre-state and first succeeds at an operation denied or unavailable to the old context
correlation:
  window:
    zh: 从首次成功状态变更持续到描述符删除、禁用、回滚或三次相关启动/登录事件，默认最长三十日；在每个 boot_id 或 logon_id 周围使用前十五分钟至后六十分钟窗口，并按系统允许的启动延迟和设备长期离线情况扩展。一次性 RunOnce 需要保留变更事件，即使执行前条目已经删除。
    en: Extend from the first successful state mutation until descriptor deletion, disablement, rollback, or three relevant boot or logon events,
      thirty days by default. Use a window from fifteen minutes before through sixty minutes after each boot_id or logon_id and extend it for
      system-permitted startup delay and long-offline devices. One-time RunOnce analysis retains the mutation event even when the entry is deleted
      before execution.
  dimensions:
  - device
  - user_or_system_scope
  - descriptor
  - writer_principal
  - writer_process
  - target
  - file_hash
  - signature
  - publisher
  - boot
  - logon
  - software_package
  - change
  - time
  - descriptor_old_target
  - descriptor_new_target
  - prior_session
  - restoration_item
  - user_reopen_choice
  - writer_effective_authority
  - consumer_security_context
  - effective_authority_delta
  - restricted_operation
  - target_resource
  - operation_outcome
false_positives:
- zh: 软件安装、更新、卸载和修复会创建、修改或短暂重建 Run、RunOnce、登录项和启动目录对象，并可能从用户可写缓存运行安装阶段。
  en: Software installation, update, removal, and repair create, change, or briefly rebuild Run, RunOnce, login-item, and startup-directory objects
    and may execute an installation stage from a user-writable cache.
- zh: 用户主动配置登录项、恢复上次打开应用、辅助功能或桌面环境自启动会产生非集中审批的合法描述符。
  en: User-configured login items, restoration of previously open applications, accessibility features, and desktop-environment autostarts create
    legitimate descriptors outside centralized approval.
- zh: 企业管理、驱动、身份、安全和远程支持产品会在启动期使用系统宿主、解释器、DLL 或更新主题名称，且版本升级可能改变路径和签名。
  en: Enterprise management, driver, identity, security, and remote-support products use system hosts, interpreters, DLLs, or update-themed names
    at startup, and version upgrades can change paths and signatures.
- zh: 应用崩溃恢复、用户重新打开窗口选择、系统升级和会话迁移会合法重建恢复队列或改变其中目标。
  en: Application crash recovery, user reopen-windows choice, operating-system upgrade, and session migration legitimately rebuild a restoration
    queue or change its targets.
- zh: 管理员或受控部署工具可能以低权限前端提交变更、再由高权限安装 broker 合法消费 descriptor；若审批、包、writer delegation 与目标结果一致，会呈现真实权限差但不是攻击。
  en: An administrator or managed deployment tool can submit a change through a low-authority frontend that a privileged installation broker legitimately consumes. Matching approval, package, writer delegation, and target outcome can produce a real authority difference without attack.
blind_spots:
- zh: 变更审计在写入前未启用、RunOnce 在执行前删除、设备离线或日志轮转时，原写入者与旧值可能无法恢复。
  en: Original writer and old value may be unrecoverable when mutation audit was disabled before write, RunOnce deletes before execution, a device
    remains offline, or logs roll over.
- zh: 内核或早期启动组件在端点传感器启动前运行，或网络设备不提供配置事务与进程谱系时，生命周期执行侧缺失。
  en: The lifecycle-execution side is missing when kernel or early-boot components run before endpoint sensors start or network devices lack configuration
    transactions and process lineage.
- zh: 具有合法签名和批准安装路径的软件或攻击者控制的供应链更新可以使名称、发布者、签名和清单全部一致，绕过描述符一致性分支。
  en: Software with legitimate signature and approved installation path, or an attacker-controlled supply-chain update, can align name, publisher,
    signature, and inventory and evade the descriptor-consistency branch.
- zh: 没有前序会话应用/窗口活动、用户恢复选择或队列历史时，恢复组件启动未知应用无法与合法恢复区分。
  en: Without prior-session application or window activity, user restoration choice, or queue history, an unknown application launched by the
    restoration component cannot be distinguished from legitimate restoration.
- zh: consumer token、integrity/capability、内核域或目标操作授权结果未记录时，无法计算 authority delta；系统父体、root/SYSTEM 标签或成功启动只能证明执行上下文，不能证明攻击者通过该映射获得了新权限。
  en: When consumer token, integrity or capability, kernel domain, or target-operation authorization is absent, authority delta cannot be computed. A system parent, root or SYSTEM label, or successful start proves execution context only, not that the adversary gained new authority through the mapping.
tuning_guidance:
  paragraphs:
  - zh: 先按操作系统版本、资产角色、用户、桌面环境、软件包、发布者、安装路径、描述符类别和维护窗口建立状态清单，并在安装、更新和卸载前后记录期望差异。允许列表必须绑定描述符 ID 或路径、真实目标、参数、签名、发布者、写入主体、包 ID 和有效期；不得永久放行 Run 键、启动文件夹、explorer、launchd、常见更新名称、签名二进制或所有用户级项目。对不能输出
      old/new 值的平台，用连续快照重建差异并标记较低来源置信度。
    en: Build state inventory by operating-system version, asset role, user, desktop environment, package, publisher, installation path, descriptor
      class, and maintenance window, recording expected differences before and after installation, update, and removal. Allowlists must bind descriptor
      ID or path, actual target, arguments, signature, publisher, writer, package ID, and validity. Never permanently allow a Run key, Startup
      folder, explorer, launchd, common updater name, signed binary, or all user-scoped entries. For platforms without old and new values, reconstruct
      differences from successive snapshots and mark lower provenance confidence.
  - zh: 分别输出未批准状态、已观察激活和描述符伪装。只有名称主题可疑时不处置；当名称与发布者、签名、目标路径、解释器或软件清单至少两项冲突，并且同一描述符在生命周期边界实际激活时，才标记 NJS-0084-001。部署前用本地更新器、登录项、RunOnce 安装和重启测试验证事件字段、启动延迟、父进程与清理顺序，并确保调查保留映射和目标证据后再禁用。
    en: Produce separate outcomes for unapproved state, observed activation, and descriptor camouflage. Do not enforce on a suspicious name alone.
      Mark NJS-0084-001 only when the name conflicts with at least two of publisher, signature, target path, interpreter, or software inventory
      and the same descriptor actually activates at a lifecycle boundary. Before deployment, test local updaters, login items, RunOnce installation,
      and reboot to validate event fields, startup delay, parent process, and cleanup order, preserving mapping and target evidence before disablement.
  - zh: 为既有描述符保存不可变基线版本和包所有权，只有同对象 target/arguments 变化且无匹配升级才进入 NJS-0084-002；为恢复队列建立每用户前序活动集合与选择状态，只有队列差异和后继恢复同时存在才进入 NJS-0084-003。对无历史设备保持审计模式，避免把首次清单或正常恢复错误升级。
    en: Retain immutable baseline versions and package ownership for established descriptors, entering NJS-0084-002 only for same-object target
      or argument change without a matching upgrade. Build a per-user prior-activity set and choice state for restoration queues, entering NJS-0084-003
      only when queue difference and successor restoration both exist. Keep devices without history in audit mode to avoid upgrading a first inventory
      or normal restoration incorrectly.
  - zh: TA0004 单独输出必须要求 writer/pre-state 与 consumer 的可比权限快照、正向 delta 和首个新获准结果；系统位置或高权限标签只作为候选筛选。把合法 installer/broker 委托、批准 driver、系统升级与安全产品回归样本加入基线，并分别测试“同权限恢复”“真实权限提升”“高权限但已批准”三类路径，避免把 Persistence 或维护事务误标为提权。
    en: A separate TA0004 output requires comparable writer or pre-state and consumer authority snapshots, a positive delta, and the first newly authorized outcome; system location or privileged label is only candidate filtering. Add legitimate installer or broker delegation, approved drivers, operating-system upgrades, and security-product regression samples to the baseline, and separately test same-authority restoration, genuine elevation, and privileged-but-approved paths so Persistence or maintenance transactions are not mislabeled as escalation.
