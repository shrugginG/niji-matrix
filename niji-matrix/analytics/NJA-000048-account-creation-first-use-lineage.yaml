observables:
- zh: 未批准主体创建新账户并立即授予远程或高权限角色
  en: An unapproved actor creates a new account and immediately grants remote or privileged roles
- zh: 新账户首次从异常来源登录并快速访问敏感资源
  en: A new account first signs in from an anomalous origin and rapidly accesses sensitive resources
- zh: 新账户仅获准访问一个服务或资源集合，并以低频率维持来自未批准来源的持续访问
  en: A new account is limited to one service or resource set and maintains low-frequency continuing access from an unapproved origin
- zh: 云扩展或集中管理操作后，下游工作负载出现时间和用户名匹配的新账户及首次远程认证
  en: After a cloud extension or centralized-management operation, a downstream workload shows a time- and name-matched new account and first
    remote authentication
correlation:
  window:
    zh: 从创建到禁用/删除或首次三十日，首次使用重点二十四小时；使用九十日创建者和角色基线。
    en: Extend from creation to disablement or deletion or the first thirty days, emphasizing first use within twenty-four hours and using ninety
      days of creator and role baseline.
  dimensions:
  - tenant_or_device
  - creator
  - principal
  - role_or_group
  - session_or_token
  - source
  - device
  - resource
  - approval
  - time
  - management_operation
  - target_workload
  - authorization_scope
  - activity_fanout
false_positives:
- zh: 入职、服务账户部署、测试、应急与供应商临时访问
  en: Onboarding, service-account deployment, testing, emergency, and temporary vendor access
- zh: 云 VM 凭据恢复、配置管理、镜像部署和设备编排合法创建本地管理员或服务账户
  en: Cloud VM credential recovery, configuration management, image deployment, and device orchestration legitimately create local administrator
    or service accounts
blind_spots:
- zh: 本地设备无创建审计、共享账户或日志只保留名称时关联受限
  en: Correlation is limited when local devices lack creation audit, accounts are shared, or logs retain only names
- zh: 上游管理日志不返回来宾 SID/UID、来宾代理不记录创建命令或团队不共享日志时，跨控制面关联只能依赖时间与目标
  en: When upstream management logs omit guest SID or UID, guest agents omit creation commands, or teams do not share logs, cross-control-plane
    correlation depends only on time and target
tuning_guidance:
  paragraphs:
  - zh: 按创建接口、管理员、账户类型、角色、时间和业务流程建立基线；允许项绑定具体 principal、审批和到期，不永久放行管理员或自动化。未使用账户与已确认持久化分开输出。
    en: Baseline creation interface, administrator, account type, role, time, and business workflow. Bind allows to a concrete principal, approval,
      and expiry rather than permanently allowing administrators or automation. Output unused account separately from confirmed persistence.
  - zh: 窄范围账户不能因权限少而自动放行，应把允许项绑定 owner、单一用途、资源集合、来源和复核期；低活动窗口至少覆盖三十日。跨控制面操作应为每个批准恢复/部署记录 initiator、operation、workload、预期账户和期限，并将管理操作与来宾事件的字段缺失显式计入置信度。
    en: Do not automatically allow a narrow account because it has little privilege. Bind allowances to owner, single purpose, resource set, origin,
      and review period and retain at least thirty days for low activity. For each approved cross-control-plane recovery or deployment, record
      initiator, operation, workload, expected account, and validity, explicitly reducing confidence when management-to-guest fields are missing.
