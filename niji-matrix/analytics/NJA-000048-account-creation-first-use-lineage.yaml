schema_version: 2.0.0
type: detection-analytic
id: NJA-000048
strategy_ref: DET-000069
name:
  zh: 账户创建—初始权限—首次使用谱系分析
  en: Account Creation-Initial Privilege-First Use Lineage Analytic
summary:
  zh: 规范身份创建、权限、审批与使用日志，按新 principal ID 恢复创建者到首个结果。
  en: Normalize identity creation, privilege, approval, and use logs to recover creator-to-first-outcome lineage by new principal ID.
domains:
- enterprise
platforms:
- Containers
- ESXi
- IaaS
- Identity Provider
- Linux
- Network Devices
- Office Suite
- SaaS
- Windows
- macOS
logic:
  paragraphs:
  - zh: 识别此前不存在的 principal ID，记录创建者、接口、时间、初始认证材料、组/角色、作用域和审批，再连接首次成功/失败登录、token、远程访问和资源操作。若只有名称而无稳定 ID，结合租户/设备、SID/UID、创建时间和目标；创建前已存在则转 T1098。风险由非常见
      creator、无审批、高权限、首次来源异常与快速敏感操作组合决定。
    en: Identify a previously absent principal ID and record creator, interface, time, initial authentication material, group or role, scope,
      and approval, then join first successful or failed sign-in, token, remote access, and resource action. When only a name exists, combine
      tenant or device, SID or UID, creation time, and target; a pre-existing principal is referred to T1098. Risk combines uncommon creator,
      missing approval, high privilege, anomalous first origin, and rapid sensitive action.
  - zh: 窄范围分支计算新账户获准服务、资源、角色数量及三十日事件扇出，与同类专用账户和批准用途比较；少量活动只有在 owner/审批缺失、来源异常或持续入口结果同时存在时提高风险。跨控制面分支从云 activity、扩展部署或编排 operation 开始，按 tenant/subscription、workload、request/operation
      ID、时间和预期用户名连接来宾 SID/UID、账户创建、首次远程认证与结果；没有精确 ID 时降低置信度。
    en: The narrow-scope branch calculates permitted services, resources, roles, and thirty-day event fan-out for the new account and compares
      them with peer dedicated accounts and approved purpose. Sparse activity raises risk only with missing owner or approval, anomalous origin,
      or a continuing-entry outcome. The cross-control-plane branch begins with cloud activity, extension deployment, or orchestration operation
      and joins guest SID or UID, account creation, first remote authentication, and outcome by tenant or subscription, workload, request or operation
      ID, time, and expected username. Confidence falls without exact identifiers.
