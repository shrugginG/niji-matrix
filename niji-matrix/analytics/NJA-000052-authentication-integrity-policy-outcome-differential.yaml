schema_version: 2.0.0
type: detection-analytic
id: NJA-000052
strategy_ref: DET-000073
name:
  zh: 认证组件/信任—策略—异常允许谱系分析
  en: Authentication Component or Trust-Policy-Anomalous-Allow Lineage Analytic
summary:
  zh: 版本化验证器、联合信任与认证策略，分别恢复额外可信证明和窄例外，再以请求与会话键连接异常允许及资源结果。
  en: Version validators, federation trust, and authentication policy; separately recover added trusted proofs and narrow exceptions; and join anomalous allow plus resource outcomes through request and session keys.
domains:
  - enterprise
platforms:
  - Windows
  - Linux
  - macOS
  - Network Devices
  - Identity Provider
  - IaaS
  - SaaS
logic:
  paragraphs:
    - zh: >-
        分析首先建立认证决策面的可信状态。对域控制器、PAM/SSO 主机、VPN 与网络设备保存组件 ID、软件/固件版本、进程或内存映像、文件和页/段 hash、签名、加载模块、启动/重启、更新事务、writer 与结果；对联合身份保存域、issuer、metadata endpoint、signing certificate 指纹、有效期、修改者、来源和批准。把实时状态与同版本黄金映像、离线度量、供应者签名或前一可信快照比较，分别输出未批准组件差异和额外信任证明。
      en: >-
        The analytic first establishes trusted state for the authentication-decision plane. For domain controllers, PAM or SSO hosts, VPNs, and network devices it retains component ID, software or firmware version, process or memory image, file and page or section hashes, signatures, loaded modules, start or restart, update transaction, writer, and outcome. For federation it retains domain, issuer, metadata endpoint, signing-certificate fingerprint, validity, modifier, origin, and approval. It compares current state with a same-version golden image, offline measurement, vendor signature, or prior trusted snapshot and emits separate unapproved-component-difference and added-trust-proof states.
    - zh: >-
        策略路径把 Conditional Access、MFA、风险认证与等价 IAM 变更规范为 policy ID、版本、enabled 状态、include/exclude、主体/组、设备、位置、客户端、认证流、应用/资源、grant/session controls、old/new 值、writer、来源、批准和到期。解析组嵌套、策略组合与优先级，计算变更前后每个候选会话的有效作用域；只显示“策略已启用”而无法取得排除集合时标记可见性降级。未经批准的窄排除、受信位置扩张或控制放宽先输出策略风险状态。
      en: >-
        The policy path normalizes Conditional Access, MFA, risk-authentication, and equivalent IAM changes into policy ID, version, enabled state, include and exclude assignments, principals or groups, device, location, client, authentication flow, application or resource, grant and session controls, old and new values, writer, origin, approval, and expiry. It resolves group nesting, policy combination, and precedence to compute effective scope before and after the change for candidate sessions. If only policy enabled is visible and exclusion sets are unavailable, it records degraded visibility. An unapproved narrow exclusion, trusted-location expansion, or control weakening first produces a policy-risk state.
    - zh: >-
        分析随后规范每个认证请求的时间、系统/租户、主体、客户端、资源、来源、设备、认证方法序列、输入或证明类别、令牌签名/声明、应用或未应用的策略及原因、MFA/风险结果、最终 decision、request/correlation/token/session ID。选择性证明分支使用隔离账户和不具生产能力的 canary 输入比较生产与黄金结果，或寻找同一异常证明跨多个主体成功；策略分支把请求情境代入变更前后策略，确认只有新例外使该请求从拒绝/强认证变为允许或较弱要求。
      en: >-
        The analytic then normalizes each authentication request with time, system or tenant, principal, client, resource, origin, device, authentication-method sequence, input or proof class, token signature or claims, applied or unapplied policies and reasons, MFA or risk result, final decision, and request, correlation, token, or session ID. The selective-proof branch compares production and golden outcomes using an isolated account and canary input with no production capability, or looks for one anomalous proof succeeding across multiple principals. The policy branch evaluates request context against policy before and after the mutation and confirms that only the new exception changed the request from deny or strong authentication to allow or a weaker requirement.
    - zh: >-
        最后把异常允许连接到令牌签发、会话建立和高价值资源操作，并根据证据分级。只有状态差异输出“认证决策面异常”；状态差异与生产独有成功输出“异常允许路径”；再连接后续资源结果且状态在使用时仍有效，才输出“认证路径持久化链”。已确认攻击者 writer、Skeleton Key 类跨主体主密码、异常联合签名者或 UNC3944 式排除可以提高置信度；仅有主体成功、IP 异常或当前策略快照不能越级。
      en: >-
        Finally, the analytic joins anomalous allow to token issuance, session establishment, and high-value resource action and tiers the evidence. State difference alone produces authentication-decision-plane anomaly. State difference plus production-only success produces anomalous allow path. Only a downstream resource outcome while the state remained valid produces an authentication-path persistence chain. A confirmed adversary writer, Skeleton Key-style cross-principal master password, unexpected federation signer, or UNC3944-style exclusion can raise confidence. Principal success, anomalous IP, or current policy snapshot alone cannot be promoted.
data_requirements:
  - source_type: authentication-component-integrity
    name:
      zh: 认证组件、进程、内存与加载完整性
      en: Authentication component, process, memory, and load integrity
    channel: null
    required_fields:
      - timestamp
      - system_id
      - component_id
      - software_or_firmware_version
      - path_or_memory_region
      - file_or_page_hash
      - signature_or_signer
      - loaded_module_id
      - writer_id
      - update_transaction_id
      - boot_or_restart_id
      - outcome
  - source_type: federation-trust-change
    name:
      zh: 联合域、issuer 与签名证书信任变更
      en: Federation domain, issuer, and signing-certificate trust changes
    channel: null
    required_fields:
      - timestamp
      - tenant_id
      - federation_domain
      - issuer
      - metadata_endpoint
      - signing_certificate_fingerprint
      - valid_from
      - valid_until
      - initiating_principal_id
      - source_ip
      - old_value
      - new_value
      - approval_id
      - outcome
  - source_type: authentication-policy-version
