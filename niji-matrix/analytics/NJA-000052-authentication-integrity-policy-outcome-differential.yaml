    channel: null
    required_fields:
      - timestamp
      - tenant_or_system_id
      - policy_id
      - version
      - enabled_state
      - include_assignments
      - exclude_assignments
      - conditions
      - grant_or_session_controls
      - old_value
      - new_value
      - initiating_principal_id
      - source
      - approval_id
      - valid_until
  - source_type: authentication-decision
    name:
      zh: 认证请求、方法、逐策略评估与最终决策
      en: Authentication request, method, per-policy evaluation, and final decision
    channel: null
    required_fields:
      - timestamp
      - system_or_tenant_id
      - principal_id
      - client_id
      - resource_id
      - source
      - device_id
      - authentication_methods
      - input_or_proof_class
      - token_signer_or_claims
      - applied_policy_ids
      - policy_evaluation_results
      - mfa_or_risk_result
