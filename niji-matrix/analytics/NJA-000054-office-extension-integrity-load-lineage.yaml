schema_version: 2.0.0
type: detection-analytic
id: NJA-000054
strategy_ref: DET-000075
name: {zh: Office 启动面—内容—宿主结果分析, en: Office Startup-Surface-Content-Host Outcome Analytic}
summary: {zh: 版本化 Office 扩展面并把 writer 和内容身份连接到 Office 加载、子进程或网络结果。, en: Version Office extension surfaces and join writer and content identity to Office load child process or network outcome.}
domains: [enterprise]
platforms: [Office Suite, Windows]
logic:
  paragraphs:
  - zh: 枚举模板、Startup/XLSTART/trusted location、add-in manifest/binary、Office Test registry 和 Outlook 持久对象，保存 path/object ID、hash、signature、owner、ACL、writer、来源、批准和版本。与上一有效清单比较，标记新对象、内容替换、信任位置变化或无 owner 状态。
    en: Enumerate templates Startup or XLSTART or trusted locations add-in manifests or binaries Office Test Registry and durable Outlook objects and preserve path or object ID hash signature owner ACL writer origin approval and version. Compare with the last valid inventory and mark new objects content substitution trust-location changes or missing owners.
  - zh: 连接 Office application start/load event、加载对象/hash、用户/文档、宏/add-in 身份和后继 child process/module/network。预受信位置只提供上下文，若内容未经批准或 Office 产生异常结果才升高风险；Outlook rule/form 的事件谓词转 DET-000070 交叉分析。
    en: Join Office application start or load event loaded object or hash user or document macro or add-in identity and successor child process module or network. A pretrusted location provides context only and raises risk when content is unapproved or Office produces an anomalous outcome. Outlook rule or form event predicates cross over to DET-000070.
data_requirements:
- {source_type: office-extension-inventory, name: {zh: Office 模板、Add-in 与 Outlook 持久对象, en: Office template add-in and Outlook durable-object inventory}, channel: null, required_fields: [timestamp, device_or_mailbox_id, application, object_id, path_or_config, object_type, content_hash, signature, owner, acl]}
- {source_type: office-extension-change, name: {zh: Office 扩展与 Trust Center 变更, en: Office extension and Trust Center changes}, channel: null, required_fields: [timestamp, device_or_mailbox_id, writer_id, object_id, operation, old_hash_or_state, new_hash_or_state, approval_id, outcome]}
- {source_type: office-load-and-outcome, name: {zh: Office 加载与后继行为, en: Office load and successor behavior}, channel: null, required_fields: [timestamp, device_id, user_id, office_process_id, application, loaded_object_id, loaded_hash, document_or_event_id, child_process_or_module, network_destination]}
observables:
- {zh: 受信/启动位置出现无批准模板或 add-in 并在下次 Office 启动加载, en: An unapproved template or add-in appears in a trusted or startup location and loads at the next Office start}
- {zh: 既有默认模板 hash 或签名改变后 Office 产生异常 child process 或网络连接, en: An established default-template hash or signature changes before Office produces an anomalous child process or network connection}
- {zh: Office Test/Outlook 持久对象由非常见 writer 修改并在用户工作流中执行, en: An Office Test or durable Outlook object is modified by an uncommon writer and executes in a user workflow}
correlation:
  window: {zh: 从扩展变化到删除或首次九十日；Office load 到结果使用十分钟。, en: Span extension change through deletion or the first ninety days and use ten minutes from Office load to outcome.}
  dimensions: [device_or_mailbox, user, application, extension_object, content_hash, trust_location, writer, document_or_event, process, approval, time]
false_positives: [{zh: 企业模板发布、财务/安全 add-in、Outlook 自动化、软件更新与用户批准宏, en: Enterprise template release finance or security add-ins Outlook automation software update and user-approved macros}]
blind_spots: [{zh: Office 不记录具体加载对象、宏在进程内执行无子进程、云 Outlook 配置与端点日志不共享, en: Office omits the loaded object macros execute in process without children or cloud Outlook configuration and endpoint logs are not shared}]
tuning_guidance: {paragraphs: [{zh: 按应用、版本、用户角色、owner、签名、位置和部署包建立清单；允许项绑定 object/hash 与到期，不对白名单 Office 进程或 trusted location 永久放行。Outlook 事件对象与 DET-000070 共享 object/event 关联键。, en: "Baseline application version user role owner signature location and deployment package. Bind allowances to object or hash and expiry rather than permanently allowing Office processes or trusted locations. Share object and event keys for Outlook event objects with DET-000070."}]}
evidence_refs: [REF-000189, REF-000190]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-11', modified: '2026-09-11', contributors: [Niji Matrix Research], reviewers: []}

