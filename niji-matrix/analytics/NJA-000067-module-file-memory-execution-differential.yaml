schema_version: 2.0.0
type: detection-analytic
id: NJA-000067
strategy_ref: DET-000090
name: {zh: 进程模块来源与可执行内存一致性分析, en: Process Module Provenance and Executable-Memory Consistency Analytic}
summary: {zh: 为每个进程比较标准模块清单、文件来源与内存映射，并把异常模块或无映像可执行区域连接到入口线程和后继行为, en: Compare standard module inventory file provenance and memory maps per process and connect anomalous modules or imageless executable regions to entry threads and successor behavior}
domains: [enterprise]
platforms: [Windows, Linux, macOS]
logic:
  paragraphs:
    - {zh: 分析维护 process start、image identity、role 和正常 module set。标准分支对每次 LoadLibrary/dlopen 或 image-load 解析 module path、canonical file、hash/signature、origin、load address、call stack 与 host role，标记用户可写/远程来源、首次组合或行为不符；随后把 module entry/export 与 API、network 和 file outcome 连接。, en: The analytic maintains process start image identity role and normal module sets. For each LoadLibrary dlopen or image load the standard branch resolves module path canonical file hash signature origin load address call stack and host role and marks user-writable or remote origin first-seen combinations or behavioral mismatch before joining module entry or exports to API network and file outcomes.}
    - {zh: 反射分支将 virtual allocation、write/decrypt、protection change、PE/ELF/Mach-O-like headers/sections、import resolution 和 thread/APC/entry 与 loader inventory 比较。可执行 private region 若无 file backing/module record 且产生 module-like imports 或敏感结果则提高风险；JIT、packer、安全产品和浏览器引擎按 signer/process role 基线。跨进程 writer 另标 T1055 共映射。, en: The reflective branch compares virtual allocation write or decrypt protection changes PE ELF or Mach-O-like headers or sections import resolution and thread APC or entry with loader inventory. Executable private regions without file backing or module records that produce module-like imports or sensitive outcomes raise risk while JIT packers security products and browser engines use signer and process-role baselines. Cross-process writers are additionally marked for T1055 co-mapping.}
data_requirements:
  - {source_type: process-lineage, name: {zh: 进程身份与谱系, en: Process identity and lineage}, channel: null, required_fields: [timestamp, device_id, process_id, parent_process_id, image, image_hash, signer, user_id, command_line, process_role]}
  - {source_type: module-image-load, name: {zh: 模块与映像加载, en: Module and image loads}, channel: null, required_fields: [timestamp, device_id, process_id, module_path, module_hash, signer, load_address, loader_method, call_stack]}
  - {source_type: file-provenance, name: {zh: 模块文件来源与完整性, en: Module file provenance and integrity}, channel: null, required_fields: [timestamp, file_path, file_hash, owner, writer_process_id, origin_uri, signature_state, first_seen]}
  - {source_type: virtual-memory-map, name: {zh: 虚拟内存映射与保护变化, en: Virtual-memory maps and protection changes}, channel: null, required_fields: [timestamp, process_id, region_base, region_size, allocation_type, protection_before, protection_after, file_backing, writer_process_id]}
  - {source_type: thread-callstack, name: {zh: 线程入口、APC 与调用栈, en: Thread entries APCs and call stacks}, channel: null, required_fields: [timestamp, process_id, thread_id, start_address, start_module, call_stack, apc_source, entry_region]}
  - {source_type: process-behavior-outcome, name: {zh: 模块后继 API、文件与网络, en: Module successor API file and network outcomes}, channel: null, required_fields: [timestamp, process_id, thread_id, api_name, target_process_id, file_path, network_destination, result]}
observables:
  - {zh: 正常 Host 首次从用户可写或远程路径加载未签名模块，随后线程访问网络或敏感 API, en: A normal host first loads an unsigned module from a user-writable or remote path and the resulting thread accesses network or sensitive APIs}
  - {zh: 进程出现 PE-like private executable region、import resolution 和入口线程，但 module inventory 与 file backing 均无对应对象, en: A process has a PE-like private executable region import resolution and entry thread without a corresponding loader-inventory or file-backed object}
  - {zh: 加密 blob 被解密写入内存后变为 executable，并产生与 host role 不一致的模块化网络/收集行为, en: An encrypted blob is decrypted into memory becomes executable and produces modular network or collection behavior inconsistent with host role}
correlation: {window: {zh: 从模块文件写入或内存分配前十分钟延伸到最后相关线程、API 或网络结果后一小时；长期 host—module 基线保留九十天。, en: Begin ten minutes before module-file write or memory allocation and extend one hour after the final related thread API or network outcome while retaining host-to-module baselines for ninety days.}, dimensions: [device, process, host_image, module_hash_or_region, loader_method, file_origin, signer, thread, writer, network_destination, time]}
false_positives: [{zh: 浏览器、Office、IDE、JIT、插件系统、安全产品和 packer 会动态加载模块或生成 private executable memory, en: Browsers Office IDEs JIT runtimes plugin systems security products and packers dynamically load modules or create private executable memory}, {zh: 软件更新与开发调试会从新路径加载首次模块并产生网络, en: Software updates and development debugging load first-seen modules from new paths and use network}]
blind_spots: [{zh: EDR 不采集 image loads、memory protections 或 thread starts 时无法区分标准与反射分支, en: Standard and reflective branches cannot be distinguished when EDR lacks image-load memory-protection or thread-start telemetry}, {zh: 内核级攻击者、受信安全产品注入或加密内存扫描限制可隐藏 region 与 call stack, en: Kernel-level adversaries trusted security-product injection or encrypted-memory scanning limits may hide regions and call stacks}]
tuning_guidance: {paragraphs: [{zh: 按 process role、publisher、软件版本和批准 plugin set 建立 host—module 基线，allowlist 必须绑定 host+module hash/path+版本而非 signer 单项。JIT/private memory 评分要求 PE-like structure、无 file backing、writer/entry 与结果组合；对缺少 call stack 或 memory data 显式降级。, en: Baseline host-to-module combinations by process role publisher software version and approved plugin set and bind allowlists to host plus module hash or path and version rather than signer alone. Score JIT or private memory only with PE-like structure missing file backing writer or entry and outcomes and explicitly lower confidence for missing call-stack or memory data.}]}
evidence_refs: [REF-000279, REF-000280, REF-000281, REF-000282, REF-000283]
lifecycle: {status: review, version: 1.0.0, created: '2026-09-12', modified: '2026-09-12', contributors: [Niji Matrix Research], reviewers: []}
