schema_version: 2.0.0
type: detection-analytic
id: NJA-000068
strategy_ref: DET-000091
name: {zh: 受信开发工具输入与动态代码结果分析, en: Trusted Developer-Tool Input and Dynamic-Code Outcome Analytic}
summary: {zh: 从 Utility 调用者和 Project 内容追踪到 Task Factory、动态 Assembly、Child/Module 与网络，并用开发角色与批准 Build 谱系调优, en: Trace utility callers and project content through task factories dynamic assemblies children modules and network and tune with developer roles and approved build lineage}
domains: [enterprise]
platforms: [Windows]
logic:
  paragraphs:
    - {zh: 分析识别 MSBuild/ClickOnce/JamPlus 和组织列出的 developer utilities，验证 canonical path、hash/signature、caller、user、host role、command 和 input path/origin/MOTW/digest。解析 project/manifest/response/targets 中的 Import、UsingTask、TaskFactory、Code、Source、AssemblyFile、remote URI 和 command sink；非开发主机、Office/browser/script caller、用户可写或远程输入、响应文件间接参数和未批准 repo 提高风险。, en: The analytic identifies MSBuild ClickOnce JamPlus and organization-listed developer utilities and verifies canonical path hash or signature caller user host role command and input path origin MOTW and digest. It parses Import UsingTask TaskFactory Code Source AssemblyFile remote URIs and command sinks in projects manifests response files and targets. Nondeveloper hosts Office browser or script callers user-writable or remote inputs response-file indirection and unapproved repositories raise risk.}
    - {zh: 输入代理分支连接 utility 到 child process、module load、file output、network 和后继注入；inline 分支关联 compile/task event、dynamic assembly、private executable memory、in-process network/API，允许无 child。高风险要求 input/caller/context 异常与结果异常相交。合法 build 需同时匹配 developer role、approved repository、expected parent/toolchain 和 output path，而不是仅签名。, en: The input-proxy branch joins utility to child processes module loads file output network and downstream injection. The inline branch correlates compilation or task events dynamic assemblies private executable memory and in-process network or APIs and allows no child. High risk requires input caller or context anomaly intersecting outcome anomaly. Legitimate builds must match developer role approved repository expected parent or toolchain and output path rather than signature alone.}
data_requirements:
  - {source_type: utility-process-lineage, name: {zh: Developer Utility 进程与调用者, en: Developer-utility process and caller}, channel: null, required_fields: [timestamp, device_id, process_id, parent_process_id, image, canonical_path, hash, signer, command_line, user_id, host_role]}
  - {source_type: build-input-provenance, name: {zh: Project、Manifest 与输入来源, en: Project manifest and input provenance}, channel: null, required_fields: [timestamp, device_id, process_id, input_path, input_type, input_digest, origin_uri, mark_of_the_web, writer_process_id, repository_id, approval_id]}
  - {source_type: build-input-content, name: {zh: 构建输入结构与 Task 定义, en: Build-input structure and task definitions}, channel: null, required_fields: [input_digest, import_uri, using_task, task_factory, code_language, inline_code_digest, source_path, assembly_file, target_name]}
  - {source_type: build-runtime-event, name: {zh: Build、Compile 与 Task 运行事件, en: Build compile and task runtime events}, channel: null, required_fields: [timestamp, process_id, build_id, project_id, target_name, task_name, task_factory, compiler, assembly_identity, result]}
  - {source_type: utility-child-module-memory, name: {zh: Child、Module 与动态代码内存, en: Child module and dynamic-code memory}, channel: null, required_fields: [timestamp, process_id, child_process_id, child_image, child_command_line, module_path, module_hash, memory_region, protection, file_backing]}
  - {source_type: utility-file-network-outcome, name: {zh: Utility 文件、网络与后继行为, en: Utility file network and successor outcomes}, channel: null, required_fields: [timestamp, process_id, build_id, file_path, file_hash, network_destination, api_action, target_process_id, result]}
observables: [{zh: 非开发主机上的签名 MSBuild 由 Office/script 启动并读取用户目录或远程 XML，随后加载模块、联网或启动攻击工具, en: Signed MSBuild on a nondeveloper host is started by Office or a script reads user-directory or remote XML and then loads modules uses network or starts attack tools}, {zh: Project 含未批准 UsingTask/TaskFactory/Code，Utility 产生动态 Assembly 或无 File-backed 的进程内行为而无正常输出, en: A project contains unapproved UsingTask TaskFactory or Code and the utility produces dynamic assemblies or in-process behavior without file backing or expected outputs}, {zh: Utility 输入来自未批准 Repo/URL 或执行后立刻注入另一进程, en: Utility input originates from an unapproved repository or URL or immediately precedes injection into another process}]
correlation: {window: {zh: 从输入文件写入前一小时延伸到 utility 退出或最后 child/module/network 结果后一小时；开发项目基线保留九十天。, en: Begin one hour before input-file write and extend through one hour after utility exit or final child module or network outcome while retaining developer-project baselines for ninety days.}, dimensions: [device, host_role, user, utility_hash, caller, input_digest, origin, repository, build, task_factory, dynamic_assembly, child_or_module, network_destination, time]}
false_positives: [{zh: IDE、CI agent、本地开发、安装器和合法 ClickOnce 会调用工具、inline tasks、compiler 和网络, en: IDEs CI agents local development installers and legitimate ClickOnce invoke utilities inline tasks compilers and network}, {zh: 新 SDK/项目会首次使用 UsingTask、远程包源或自定义 Build Target, en: New SDKs and projects first use UsingTask remote package sources or custom build targets}]
blind_spots: [{zh: Project 在执行后删除、网络 share 无来源、MSBuild binary log/ETW 和 dynamic-code telemetry 未启用时输入语义丢失, en: Input semantics are lost when projects are deleted after execution network shares lack provenance and MSBuild binary logs or ETW and dynamic-code telemetry are disabled}, {zh: Utility 被重命名或通过 in-process API 调用且进程规则只按文件名识别时会漏检, en: Renamed utilities or in-process API invocation evade logic that identifies tools only by filename}]
tuning_guidance: {paragraphs: [{zh: 按 host developer role、approved repository、utility path/hash、normal caller、SDK 与 project digest 建立基线。非开发终端默认高风险，开发/CI 主机则要求 input origin、project content 和 outcome 三层。App Control 例外绑定具体用户/设备/utility/version/repo，不永久允许 Microsoft publisher；缺字段显式降低置信度。, en: Baseline by host developer role approved repository utility path or hash normal caller SDK and project digest. Nondeveloper endpoints default to higher risk while developer or CI hosts require input origin project content and outcome. Bind App Control exceptions to concrete users devices utilities versions and repositories rather than Microsoft publishers and lower confidence explicitly for missing fields.}]}
evidence_refs: [REF-000284, REF-000285, REF-000286, REF-000287, REF-000288]
lifecycle: {status: review, version: 1.0.0, created: '2026-09-12', modified: '2026-09-12', contributors: [Niji Matrix Research], reviewers: []}
