schema_version: 2.0.0
type: detection-analytic
id: NJA-000069
strategy_ref: DET-000092
name: {zh: 服务请求—定义—Manager 结果事务分析, en: Service Request-Definition-Manager Outcome Transaction Analytic}
summary: {zh: 按服务身份重建已有对象控制和短驻 create-run-delete，并连接远程来源、文件、Manager Child 与网络结果, en: Reconstruct existing-object control and ephemeral create-run-delete by service identity and join remote origins files manager children and network outcomes}
domains: [enterprise]
platforms: [Windows, Linux, macOS]
logic:
  paragraphs:
    - {zh: 为每个 service/unit/label 保存稳定 ID、definition version、target path/hash、type、account、start condition、owner/ACL 与 approved package。已有分支捕获 start/control/restart 并比较本次 target 与历史，寻找无新建事件但 definition/action 异常、service name 与近似 payload 或 manager child 行为不符。, en: Store stable IDs definition versions target paths or hashes types accounts start conditions owner or ACL and approved packages for every service unit or label. The existing branch captures start control or restart and compares current targets with history for no-new-object executions with anomalous definitions or actions near-name payloads or manager-child behavior inconsistent with service identity.}
    - {zh: 短驻分支在十五分钟内连接 SMB/remote admin/RPC/SCM 或本地 actor、file write、service create/install、start、manager child/module/driver、named pipe/network、stop/delete/cleanup。高风险要求控制/definition 异常与 child/result 同 service/device/request；只有 4697、services.exe child 或当前缺失不定性。跨平台将 launchd/systemd audit/journal 映射到相同事务。, en: The ephemeral branch joins SMB remote administration RPC or SCM or local actors file writes service creation or installation start manager children modules or drivers named pipes or network and stop delete or cleanup within fifteen minutes. High risk requires control or definition anomalies and child or outcome sharing service device and request. Event 4697 services.exe children or current absence alone is not dispositive and launchd or systemd audit and journal map to the same transaction.}
data_requirements:
  - {source_type: service-control-audit, name: {zh: 服务控制与生命周期审计, en: Service control and lifecycle audit}, channel: null, required_fields: [timestamp, device_id, service_id, action, actor_id, source_host, request_id, result]}
  - {source_type: service-definition-history, name: {zh: 服务定义、权限与目标历史, en: Service definition permission and target history}, channel: null, required_fields: [timestamp, service_id, name, definition_version, target_path, arguments, target_hash, service_type, account, start_condition, owner, security_descriptor, writer_id]}
  - {source_type: remote-service-transport, name: {zh: 远程 SMB、RPC 与 Named Pipe, en: Remote SMB RPC and named-pipe telemetry}, channel: null, required_fields: [timestamp, source_host, destination_host, actor_id, share_path, rpc_interface, service_id, pipe_name, session_id]}
  - {source_type: service-manager-runtime, name: {zh: Manager 启动、Module 与 Driver 事件, en: Manager start module and driver events}, channel: null, required_fields: [timestamp, device_id, service_id, manager_process_id, service_process_id, module_path, driver_path, run_id, status]}
  - {source_type: process-file-lineage, name: {zh: 服务 Child 与文件谱系, en: Service child and file lineage}, channel: null, required_fields: [timestamp, device_id, service_id, process_id, parent_process_id, image, command_line, file_path, file_hash, writer_process_id, user_id]}
  - {source_type: service-network-outcome, name: {zh: 服务网络与后继结果, en: Service network and successor outcomes}, channel: null, required_fields: [timestamp, device_id, service_id, process_id, network_destination, bytes_out, result, alert_id]}
observables: [{zh: 已有服务无新建事件被非常用主体启动，target/module 与批准版本不同并产生异常 child/network, en: An existing service is started by an unusual principal without creation and its target or module differs from approved versions before anomalous children or network}, {zh: 远程 ADMIN$/RPC 后出现 service create→start→services.exe child→named pipe→delete 短事务, en: Remote ADMIN share or RPC is followed by a short service create start services.exe child named-pipe delete transaction}, {zh: Service 名称/账户保持正常但近似 DLL 或用户路径 payload 与历史不符, en: Service name and account remain normal while a near-name DLL or user-path payload differs from history}]
correlation: {window: {zh: 短驻事务十五分钟；已有服务从 control 前一小时至结果后一小时，并保留 definition 历史九十天。, en: Use fifteen minutes for ephemeral transactions and one hour before control through one hour after outcomes for existing services while retaining definition history for ninety days.}, dimensions: [device, service, request, actor, source_host, definition_version, target_hash, manager_process, child_process, pipe, network_destination, time]}
false_positives: [{zh: 软件安装、补丁、EDR 更新、远程支持和事件响应会创建/启动/删除服务并使用 SYSTEM, en: Software installation patching EDR updates remote support and incident response create start and delete services and use SYSTEM}, {zh: 管理员手工启动已有服务或恢复失败服务会偏离历史时间, en: Administrators manually starting existing services or recovering failed services deviate from historical timing}]
blind_spots: [{zh: Service audit/4697/7045、SCM/launchd/systemd 日志未集中时短事务会消失, en: Short transactions disappear when service audit or 4697 or 7045 and SCM launchd or systemd logs are not centralized}, {zh: Manager child 被 EDR 排除、远程 request ID 未传目标或 driver/service DLL 仅有 kernel/module event 时因果受限, en: Causality is limited when EDR excludes manager children remote request IDs do not reach targets or drivers and service DLLs expose only kernel or module events}]
tuning_guidance: {paragraphs: [{zh: 按 asset role、service ID、批准 definition/package、正常 controller 和 maintenance 建立基线，例外绑定 service+target hash+actor+change ID+期限。不要永久放行 services.exe/svchost/systemd、SYSTEM 或 PsExec 名称；将 existing definition delta 与 ephemeral transaction 分别评分，缺少 delete 不强行映射短驻轴。, en: Baseline by asset role service ID approved definition or package normal controller and maintenance and bind exceptions to service target hash actor change ID and expiry. Never permanently allow services.exe svchost systemd SYSTEM or PsExec names. Score existing definition differences and ephemeral transactions separately and do not force the ephemeral axis when delete is missing.}]}
evidence_refs: [REF-000289, REF-000290, REF-000291, REF-000292]
