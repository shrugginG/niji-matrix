schema_version: 2.0.0
type: detection-analytic
id: NJA-000070
strategy_ref: DET-000093
name: {zh: WMI Client、Provider Host 与执行结果谱系分析, en: WMI Client Provider-Host and Execution-Outcome Lineage Analytic}
summary: {zh: 解析每个 WMI Operation 的原始 Client 与方法，连接 Wmiprvse 实例和本地结果，并按管理情境识别来源遮蔽和特征合形, en: Resolve original clients and methods for each WMI operation join Wmiprvse instances and local outcomes and detect provenance masking and feature conformity against administration context}
domains: [enterprise]
platforms: [Windows]
logic:
  paragraphs:
    - {zh: 从 WMI-Activity/Trace 解析 CorrelationId、GroupOperationId、OperationId、ClientMachine、User、ClientProcessId、namespace、class、method/query、result 和 provider PID；用时间与 PID 生命周期解析 client image/session，并关联 DCOM/WinRM auth/source。先将 ExecMethod、Win32_Process/Create 与具有执行 side effect 的操作分离于 ExecQuery/纯 inventory，避免把 Discovery 当 Execution。, en: Parse CorrelationId GroupOperationId OperationId ClientMachine User ClientProcessId namespace class method or query result and provider PID from WMI-Activity or Trace and resolve client image or session by time and PID lifetime plus DCOM or WinRM authentication and source. Separate ExecMethod Win32_Process Create and operations with execution side effects from ExecQuery or pure inventory so Discovery is not treated as Execution.}
    - {zh: Provider 分支连接 operation 到 Wmiprvse/self-host PID、child process/module/file/service/configuration/network，若原始 client 是 Office、script、remote tool 或异常 host 且 provider 产生 encoded shell/download/destructive result，则高风险。情境分支比较 asset role 的正常 namespace-class-method-principal-cadence，只有看似常见调用与异常结果相交才提高；没有 client/operation 时 wmiprvse child 只作中等信号。, en: The provider branch joins operations to Wmiprvse or self-host PIDs and child process module file service configuration or network outcomes and rates high when original clients are Office scripts remote tools or unusual hosts and providers produce encoded shells downloads or destructive outcomes. The context branch compares normal namespace class method principal and cadence by asset role and raises risk only when common-looking calls intersect anomalous results. Wmiprvse children without clients or operations remain medium signals.}
data_requirements:
  - {source_type: wmi-activity-operation, name: {zh: WMI-Activity 与 Trace Operation, en: WMI-Activity and Trace operations}, channel: Microsoft-Windows-WMI-Activity, required_fields: [timestamp, correlation_id, group_operation_id, operation_id, client_machine, user, client_process_id, namespace, class, method_or_query, provider_process_id, result_code]}
  - {source_type: wmi-client-process, name: {zh: WMI Client 进程与会话, en: WMI client process and session}, channel: null, required_fields: [timestamp, device_id, process_id, process_start_time, image, command_line, parent_process_id, signer, user_id, session_id]}
  - {source_type: remote-wmi-session, name: {zh: 远程 DCOM/WinRM 认证与网络, en: Remote DCOM or WinRM authentication and network}, channel: null, required_fields: [timestamp, source_host, destination_host, user_id, authentication_protocol, source_ip, destination_port, session_id, result]}
  - {source_type: wmi-provider-host, name: {zh: WMI Provider Host 与 Hosting Model, en: WMI provider hosts and hosting models}, channel: null, required_fields: [timestamp, device_id, provider_process_id, provider_name, provider_dll, hosting_model, service_account, namespace, process_start_time]}
  - {source_type: provider-execution-outcome, name: {zh: Provider Child、Module、File 与配置结果, en: Provider child module file and configuration outcomes}, channel: null, required_fields: [timestamp, provider_process_id, operation_id, child_process_id, image, command_line, module_path, file_path, service_or_setting, result]}
  - {source_type: provider-network-impact, name: {zh: Provider 网络与影响信号, en: Provider network and impact signals}, channel: null, required_fields: [timestamp, operation_id, process_id, network_destination, bytes_out, download_uri, encryption_event, deletion_event, alert_id]}
observables: [{zh: Office/script/remote client 的 ExecMethod 经 Wmiprvse 创建 encoded PowerShell、cmd 或下载进程, en: ExecMethod from Office script or remote clients creates encoded PowerShell cmd or downloader processes through Wmiprvse}, {zh: 常见管理账户调用 Win32_Process 或设置方法，但 source host、command 或结果不符合资产角色, en: A common management account calls Win32_Process or setting methods but source host command or outcome conflicts with asset role}, {zh: DCOM/WinRM session 与 provider child 共享 operation/session，但目标端 process tree 不含远程发起者, en: A DCOM or WinRM session and provider child share operation or session while target process lineage omits the remote initiator}]
correlation: {window: {zh: 以 OperationId 为主，从远程认证或 client start 前十五分钟至 provider 最后结果后一小时；无 ID 时仅在五分钟内按 PID 生命周期概率关联。, en: Center OperationId from fifteen minutes before remote authentication or client start through one hour after the final provider outcome and use only five-minute probabilistic PID-lifetime correlation without IDs.}, dimensions: [source_host, destination_device, user, client_process, session, correlation_id, operation_id, namespace, class, method, provider_process, child_or_result, time]}
false_positives: [{zh: SCCM、监控、备份、软件清单、PowerShell 管理和运维工具会高频调用 WMI 并由 Wmiprvse 创建进程, en: SCCM monitoring backup software inventory PowerShell administration and operations tools call WMI frequently and may create processes through Wmiprvse}, {zh: 合法 remote admin、故障修复和资产调查会使用 Win32_Process 或设置方法, en: Legitimate remote administration troubleshooting and asset investigation use Win32_Process or setting methods}]
blind_spots: [{zh: WMI-Activity/Trace 未启用或日志轮转、client 已退出且 PID 重用时原始来源丢失, en: Original provenance is lost when WMI-Activity or Trace is disabled or rotated or clients exit and PIDs are reused}, {zh: Provider self-host、不传 OperationId、跨主机时钟偏差或 EDR 排除 Wmiprvse child 会破坏关联, en: Self-hosted providers missing OperationIds cross-host clock skew or EDR exclusions for Wmiprvse children break correlation}]
tuning_guidance: {paragraphs: [{zh: 按 asset role、approved management server、user、namespace-class-method 和 cadence 建立基线，allowlist 必须绑定 source host+principal+method+target role+期限。对 encoded command、DownloadString、用户路径、Office client 和 remote nonmanagement source 加权；纯 query 只映射 Discovery。没有 OperationId 时明确标记推断并禁止自动高影响处置。, en: Baseline by asset role approved management server user namespace class method and cadence and bind allowlists to source host principal method target role and expiry. Weight encoded commands DownloadString user paths Office clients and remote nonmanagement sources and map pure queries only to Discovery. Mark inference explicitly without OperationIds and prohibit automatic high-impact response.}]}
evidence_refs: [REF-000274, REF-000293, REF-000294, REF-000295, REF-000296]
