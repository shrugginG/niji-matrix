schema_version: 2.0.0
type: detection-analytic
id: NJA-000074
strategy_ref: DET-000096
name:
  zh: 线程有效身份—来源令牌—资源结果关联分析
  en: Thread Effective Identity–Source Token–Resource Outcome Correlation Analytic
summary:
  zh: 比较敏感操作线程的有效模拟令牌与进程主令牌，回溯令牌复制或登录来源，并验证身份差异是否造成未经批准的高权限资源结果。
  en: Compare a sensitive-operation thread's effective impersonation token with the process primary token, trace duplication
    or logon origin, and validate whether the identity difference caused an unapproved privileged resource outcome.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 分析先为每个进程建立由 host_id、process_start_key 与 primary_token_id/AuthenticationId 标识的主身份基线，并保留 PID、image/path/hash/signer、parent
      start key、user/group SID、integrity、session 与启动时间。随后从内核、ETW 或 EDR token telemetry 记录 TID、assignment/removal time、impersonation_token_id、token_type、impersonation_level、effective
      SID/groups/privileges 和 assigning PID/TID。PID 只作显示字段，所有连接使用 start key 与 token ID，避免 PID 复用。
    en: The analytic first builds a primary-identity baseline for every process keyed by host ID, process start key, and primary
      token ID or AuthenticationId, retaining PID, image, path, hash, signer, parent start key, user and group SIDs, integrity,
      session, and start time. Kernel, ETW, or EDR token telemetry then records TID, assignment and removal time, impersonation
      token ID, token type, impersonation level, effective SIDs, groups, and privileges, and assigning PID or TID. PID remains
      display-only and all joins use start key and token ID to avoid PID reuse.
  - zh: 对每个出现文件/注册表/服务控制/进程访问/网络认证或安全配置结果的 TID，选择操作时生效的 token，并与 process primary token 比较 user SID、AuthenticationId、integrity
      和 relevant privileges。若不同，分析回溯五分钟前到三十分钟前的 OpenProcess/OpenProcessToken/DuplicateToken、LogonUser/4624、named-pipe/RPC
      client 或其他 token source；有稳定 token ID 时精确连接，无稳定键时仅按 host、session、identity、handle target 与时间作 degraded inference，并标记 lineage_quality。
    en: For every TID producing a file, registry, service-control, process-access, network-authentication, or security-configuration
      outcome, the analytic selects the token effective at operation time and compares user SID, AuthenticationId, integrity,
      and relevant privileges with the process primary token. On difference, it traces OpenProcess, OpenProcessToken, DuplicateToken,
      LogonUser or 4624, named-pipe or RPC client, or another token source during the preceding five to thirty minutes. Stable
      token ID provides an exact join; otherwise host, session, identity, handle target, and time permit only degraded inference
      labeled with lineage quality.
  - zh: 评分分为来源、承载、权威与结果四组。来源异常包括从罕见/高权限进程取得 token、未经批准的新登录或跨 session token；承载异常包括该服务/二进制从未代表该身份、TID assignment 无对应 client
      transaction 或运行于用户可写映像；权威异常要求 effective identity/integrity 高于 primary context；结果异常要求随后成功访问受保护进程、服务、驱动、凭据、系统文件或安全配置。精确来源+未批准
      carrier+高权限结果输出确认，只有身份差异无结果输出观察项。
    en: Scoring uses provenance, carrier, authority, and outcome groups. Provenance anomalies include a token from a rare
      or privileged process, an unapproved new logon, or a cross-session token. Carrier anomalies include a service or binary
      with no baseline for acting as that identity, a TID assignment without matching client transaction, or a user-writable
      image. Authority anomaly requires effective identity or integrity higher than primary context, and outcome anomaly requires
      successful access to a protected process, service, driver, credential, system file, or security configuration. Exact
      provenance plus unapproved carrier and privileged outcome confirms the result; identity difference without outcome remains
      an observation.
data_requirements:
- source_type: process-primary-token-inventory
  name:
    zh: 进程主令牌与启动身份
    en: Process primary token and start identity
  channel: null
  required_fields:
  - timestamp
  - host_id
  - process_start_key
  - process_id
  - image_path
  - image_hash
  - signer
  - parent_process_start_key
  - primary_token_id
  - primary_authentication_id
  - primary_user_sid
  - primary_group_sids
  - primary_privileges
  - integrity_level
  - logon_session_id
- source_type: thread-impersonation-token-state
  name:
    zh: 线程模拟令牌赋值与撤销
    en: Thread impersonation-token assignment and removal
  channel: null
  required_fields:
  - timestamp
  - host_id
  - process_start_key
  - thread_id
  - action
  - impersonation_token_id
  - token_authentication_id
  - token_type
  - impersonation_level
  - effective_user_sid
  - effective_group_sids
  - effective_privileges
  - assigning_process_start_key
  - result
- source_type: token-provenance-and-logon
  name:
    zh: Token handle 来源与登录会话
    en: Token-handle provenance and logon session
  channel: null
  required_fields:
  - timestamp
  - host_id
  - source_process_start_key
  - target_process_start_key
  - token_id
  - token_authentication_id
  - handle_access
  - api_or_operation
  - logon_id
  - logon_type
  - account_sid
  - authentication_package
