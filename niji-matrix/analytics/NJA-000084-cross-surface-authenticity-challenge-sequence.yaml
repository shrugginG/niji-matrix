schema_version: 2.0.0
type: detection-analytic
id: NJA-000084
strategy_ref: DET-000101
name:
  zh: 跨表面真实性挑战序列
  en: Cross-Surface Authenticity Challenge Sequence
summary:
  zh: 输出同一来源会话中跨身份、状态和运行表面的紧密挑战序列及其响应后结果。
  en: Produce tightly ordered challenge sequences across identity, state, and operational surfaces within one source session
    together with the post-response outcome.
domains:
- enterprise
- ics
platforms: []
logic:
  paragraphs:
  - zh: 按目标和来源会话排序请求，将横幅或身份读取、状态转换、异常错误路径和运行状态查询映射为不同表面。至少两个表面在短窗口内出现，且请求选择依赖前一响应或会话在特定响应后终止时，输出 challenge-sequence；若同一活动簇随后投递载荷或进入利用阶段则标记
      continued，若稳定终止则标记 contracted。仅有普通版本探测时不输出。
    en: Order requests by target and source session and map banner or identity reads, state transitions, unusual error paths,
      and operational-state queries to distinct surfaces. Emit challenge-sequence when at least two surfaces occur in a short
      window and request selection depends on a preceding response or the session ends after a particular response. Mark continued
      when the same activity cluster later delivers a payload or enters exploitation and contracted when it consistently terminates.
      Do not emit for ordinary version probing alone.
data_requirements:
- source_type: network-application-session
  name:
    zh: 网络与应用会话内容
    en: Network and application session content
  channel: null
  required_fields:
  - event.timestamp
  - network.src_ip
  - network.dst_ip
  - network.transport
  - session.id
  - request.method
  - request.fields
  - response.status
  - response.fields
- source_type: deception-deployment-metadata
  name:
    zh: 诱捕节点与部署元数据
    en: Deception node and deployment metadata
  channel: null
  required_fields:
  - target.id
  - service.id
  - deployment.id
  - deployment.version
- source_type: session-outcome
  name:
    zh: 会话与后续阶段结果
    en: Session and follow-on stage outcomes
  channel: null
  required_fields:
  - event.timestamp
  - target.id
  - session.id
  - activity.cluster
  - session.outcome
  - exploit.stage
  - payload.observed
observables:
- zh: 同一会话中的跨表面请求顺序
  en: Cross-surface request ordering within one session
- zh: 特定响应后的稳定退出或继续
  en: Consistent exit or continuation after a particular response
correlation:
  window:
    zh: 覆盖单次会话完整寿命及由同一响应触发的紧邻复连；具体时限按协议会话超时和正常协商基线调整并记录。
    en: Cover the complete lifetime of one session and closely adjacent reconnections triggered by the same response. Set
      and record the concrete limit from protocol session timeout and normal-negotiation baselines.
  dimensions:
  - network.dst_ip
  - session.id
  - target.id
  - service.id
  - deployment.version
  - activity.cluster
  - request.surface
false_positives:
- zh: 合法兼容性测试、资产测量和安全研究
  en: Legitimate compatibility testing, asset measurement, and security research
blind_spots:
- zh: 只保留流量摘要或无法取得响应内容的节点
  en: Nodes retaining only flow summaries or lacking response content
tuning_guidance:
  paragraphs:
  - zh: 为已知监控与研究来源维护用途和时间受限的基线，但保留其跨表面结构用于比较。按具体服务建立常见协商顺序，只对偏离基线且与响应后行为变化相连的序列提高严重度，避免用静态请求列表替代因果关系。
    en: Maintain purpose- and time-bounded baselines for known monitoring and research sources while retaining their cross-surface
      structure for comparison. Build common negotiation order per service and raise severity only for sequences that depart
      from baseline and connect to post-response behavioral change, avoiding static request lists as a substitute for causality.
evidence_refs:
- REF-000015
- REF-000016
- REF-000017
