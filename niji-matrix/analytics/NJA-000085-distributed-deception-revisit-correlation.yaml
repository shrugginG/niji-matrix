schema_version: 2.0.0
type: detection-analytic
id: NJA-000085
strategy_ref: DET-000120
name:
  zh: 诱捕部署纵向复测关联
  en: Longitudinal Deception-Deployment Revisit Correlation
summary:
  zh: 输出同一部署内跨相关节点和变更前后重复的寿命、同步变化与时序比较结构。
  en: Produce repeated lifetime, synchronized-change, and timing-comparison structures across related nodes and before and
    after changes within one deployment.
domains:
- enterprise
- ics
platforms: []
logic:
  paragraphs:
  - zh: 按稳定节点身份、可比服务和部署批次分组，将请求签名、响应时序、内容或状态结果连接到部署变更历史。当同一测量结构在多个相关节点出现，且在至少一次版本、内容、地址或状态变更前后重复时，输出 longitudinal-profile-candidate；输出仅表示可观察结构，不自动归因攻击者的诱捕判真意图。
    en: Group by stable node identity, comparable service, and deployment cohort and join request signatures, response timing,
      content or state outcomes, and deployment-change history. Emit longitudinal-profile-candidate when the same measurement
      structure appears across related nodes and recurs before and after at least one version, content, address, or state change.
      The output represents an observable structure and does not automatically attribute deception-assessment intent.
data_requirements:
- source_type: network-application-session
  name:
    zh: 网络与应用会话记录
    en: Network and application session records
  channel: null
  required_fields:
  - event.timestamp
  - network.src_ip
  - network.dst_ip
  - session.id
  - target.id
  - request.signature
  - response.signature
  - response.latency_ms
- source_type: deception-deployment-metadata
  name:
    zh: 诱捕部署与变更元数据
    en: Deception deployment and change metadata
  channel: null
  required_fields:
  - target.id
  - node.id
  - service.id
  - deployment.id
  - deployment.cohort
  - deployment.version
  - deployment.changed_at
observables:
- zh: 部署变更前后对同一节点或同类节点重复的测量结构
  en: A repeated measurement structure against the same or comparable nodes before and after a deployment change
- zh: 跨相关节点对寿命、同步变化或响应时序的可比较采样
  en: Comparable sampling of lifetime, synchronized change, or response timing across related nodes
correlation:
  window:
    zh: 至少覆盖两个观察时点和一次部署变更；实际保留期按节点寿命、变更周期与正常监控频率设定并记录。
    en: Cover at least two observation points and one deployment change. Set and record actual retention from node lifetime,
      change cadence, and normal monitoring frequency.
  dimensions:
  - target.id
  - node.id
  - service.id
  - deployment.cohort
  - deployment.version
  - request.signature
  - event.timestamp
false_positives:
- zh: 分布式可用性监控、搜索引擎测量、学术互联网扫描和部署验收测试
  en: Distributed availability monitoring, search-engine measurement, academic Internet scanning, and deployment acceptance
    testing
blind_spots:
- zh: 节点身份映射丢失、部署变更不可见、各节点日志不共享或保留期短于变更周期
  en: Lost node-identity mapping, invisible deployment changes, unshared node logs, or retention shorter than the change cycle
tuning_guidance:
  paragraphs:
  - zh: 为合法监控和研究来源维护 owner、用途、目标集合和时间受限基线，但保留它们的变更前后结构用于比较。环境调优应优先节点归并正确性、变更前后复测和目标集合重合，不使用通用的日数或连接次数阈值代替部署上下文。
    en: Maintain owner, purpose, target-set, and time-bounded baselines for legitimate monitoring and research sources while
      retaining their pre- and post-change structures for comparison. Tune primarily for node-resolution correctness, revisits
      around change, and target-set overlap and do not substitute generic day-count or connection-count thresholds for deployment
      context.
evidence_refs:
- REF-000016
