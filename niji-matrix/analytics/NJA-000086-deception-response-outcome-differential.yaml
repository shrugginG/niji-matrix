schema_version: 2.0.0
type: detection-analytic
id: NJA-000086
strategy_ref: DET-000121
name:
  zh: 诱捕响应—结果差分
  en: Deception Response-Outcome Differential
summary:
  zh: 比较受控响应组与同类会话的后续深度，输出真实性反馈后稳定出现的能力保留。
  en: Compare controlled response cohorts and follow-on depth among comparable sessions to produce stable capability withholding
    after authenticity feedback.
domains:
- enterprise
- ics
platforms: []
logic:
  paragraphs:
  - zh: 对同类目标和活动簇建立响应队列，将真实性较高与存在受控矛盾的响应分组，比较后续会话是否进入利用、载荷或控制阶段。只有矛盾组在足够样本中稳定提前终止、可信组继续，且网络错误、权限和目标可用性不能解释差异时，输出 withholding-inferred；证据不足时输出
      outcome-divergence 而不归因动机。
    en: Build response cohorts for comparable targets and activity clusters, separating higher-authenticity responses from
      responses containing controlled contradictions, then compare whether sessions progress to exploitation, payload, or
      control stages. Emit withholding-inferred only when the contradiction cohort consistently terminates early across sufficient
      samples, the credible cohort continues, and network error, privilege, and target availability do not explain the difference.
      Emit outcome-divergence without motive attribution when evidence is insufficient.
data_requirements:
- source_type: deception-response-experiment
  name:
    zh: 诱捕响应变体与对照记录
    en: Deception response variants and control records
  channel: null
  required_fields:
  - event.timestamp
  - experiment.cohort
  - experiment.variant
  - target.id
  - response.signature
  - analyst.intervention
- source_type: session-outcome
  name:
    zh: 会话、网络错误与后续阶段结果
    en: Session, network-error, and follow-on stage outcomes
  channel: null
  required_fields:
  - event.timestamp
  - target.id
  - session.id
  - activity.cluster
  - session.outcome
  - payload.observed
  - exploit.stage
  - control.stage
  - network.error
  - target.available
observables:
- zh: 特定响应组后的载荷缺失和稳定提前终止
  en: Payload absence and consistent early termination after a particular response cohort
- zh: 同类可信目标上的更深攻击阶段
  en: Deeper attack stages on comparable credible targets
correlation:
  window:
    zh: 覆盖受控响应发生后的当前会话和该活动簇正常回访周期；环境必须保存实际回访分布和选定期限，不使用通用默认日数。
    en: Cover the current session after a controlled response and the normal revisit cycle of the activity cluster. Preserve
      the observed revisit distribution and selected limit for the environment rather than using a generic default day count.
  dimensions:
  - experiment.cohort
  - target.id
  - activity.cluster
  - response.signature
  - session.outcome
  - network.error
  - target.available
false_positives:
- zh: 网络不稳定、目标修复、权限不足和攻击者正常目标优先级变化
  en: Network instability, target remediation, insufficient privilege, and ordinary adversary reprioritization
blind_spots:
- zh: 无对照目标、无法确认活动簇或后续载荷在其他观察面出现
  en: No control target, unresolved activity cluster, or follow-on payload appearing on another observation surface
tuning_guidance:
  paragraphs:
  - zh: 只在风险可控的诱捕环境使用响应变体，并保持服务可用性与非实验字段一致。按活动簇和目标类别设置最小样本，不以一次未见载荷升级为推断；记录网络错误和人工处置，以免把防守变化误作攻击者决策。
    en: Use response variants only in risk-controlled deception environments and keep service availability and nonexperimental
      fields consistent. Set minimum sample sizes by activity cluster and target class, never promoting one absent payload
      to an inference. Record network errors and analyst interventions so defensive change is not mistaken for an adversary
      decision.
evidence_refs:
