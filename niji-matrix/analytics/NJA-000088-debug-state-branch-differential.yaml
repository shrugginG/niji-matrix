schema_version: 2.0.0
type: detection-analytic
id: NJA-000088
strategy_ref: DET-000103
name:
  zh: 调试状态分支结果差分
  en: Debug-State Branch Outcome Differential
summary:
  zh: 输出调试状态查询与退出、诱饵、解码、子进程或网络结果差异的可重复关系。
  en: Produce reproducible relationships between debugger-state queries and differences in exit, decoy, decoding, child-process,
    or network outcomes.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 按 sample hash 和 process start key 记录调试状态 API、/proc 追踪字段、PEB 读取、断点、异常检查与检查后分支。对同一样本在调试开启、调试关闭和透明插桩条件下重复运行，比较退出码、进程寿命、解码、子进程、文件与网络结果。只有调试状态后稳定终止或缺失核心结果，而对照运行继续时，输出 debug_state_contraction。
    en: Record debugger-state APIs, /proc tracing fields, PEB reads, breakpoint and exception checks, and post-check branches
      by sample hash and process start key. Re-run one sample under debugging-on, debugging-off, and transparent-instrumentation
      conditions and compare exit code, process lifetime, decoding, child processes, files, and network outcomes. Emit debug_state_contraction
      only when a debugger state is followed by consistent termination or loss of a core outcome while controls continue.
data_requirements:
- source_type: debug-state-telemetry
  name:
    zh: 调试状态与分支遥测
    en: Debugger state and branch telemetry
  channel: null
  required_fields:
  - event.timestamp
  - host.id
  - sample.hash
  - process.start_key
  - thread.id
  - operation
  - debug.state
  - check.result
  - branch.id
- source_type: process-behavior-outcome
  name:
    zh: 进程与外部行为结果
    en: Process and external behavior outcomes
  channel: null
  required_fields:
  - event.timestamp
  - host.id
  - sample.hash
  - process.start_key
  - process.exit_code
  - payload.stage
  - child.start_key
  - file.action
  - network.destination
observables:
- zh: 调试状态读取后稳定提前退出或核心载荷缺失
  en: Consistent early exit or core-payload absence after a debugger-state read
- zh: 未调试或透明插桩对照上出现更深执行、子进程或网络结果
  en: Deeper execution, child-process, or network outcomes in undebugged or transparently instrumented controls
correlation:
  window:
    zh: 覆盖每次样本运行的完整寿命，并把对照保留到样本正常的下一阶段触发上限；实际期限按样本类型和测试协议记录。
    en: Cover the complete lifetime of each sample run and retain controls through the sample's normal next-stage trigger ceiling.
      Record the concrete limit by sample class and test protocol.
  dimensions:
  - host.id
  - sample.hash
  - process.start_key
  - debug.state
  - operation
  - branch.id
  - payload.stage
false_positives:
- zh: 反作弊、数字版权管理、软件保护、崩溃处理和调试测试程序
  en: Anti-cheat, digital-rights management, software protection, crash handling, and debugger test programs
blind_spots:
- zh: 用户态插桩被绕过、内核调试状态不可见、样本非确定或没有未调试对照
  en: Bypassed user-mode instrumentation, invisible kernel-debug state, nondeterministic samples, or no undebugged control
tuning_guidance:
  paragraphs:
  - zh: 按签名、产品、版本和业务用途维护合法保护软件基线，但保留其实际分支差分。严重度应基于检查后行为变化、未知样本、对照重复性和载荷结果，不得仅按函数名、字符串或一次退出触发。
    en: Baseline legitimate protection software by signing, product, version, and business purpose while retaining actual
      branch differential. Base severity on post-check behavior change, unknown sample, control reproducibility, and payload
      outcome, never on a function name, string, or one exit alone.
evidence_refs:
- REF-000386
- REF-000414
- REF-000415
