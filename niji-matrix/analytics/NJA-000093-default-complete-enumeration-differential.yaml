schema_version: 2.0.0
type: detection-analytic
id: NJA-000093
strategy_ref: DET-000108
name:
  zh: 默认—完整枚举差分
  en: Default-to-Complete Enumeration Differential
summary:
  zh: 输出默认列表遗漏但完整状态存在且被消费的工件。
  en: Produce artifacts omitted from default lists but present in complete state and consumed later.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- SaaS
logic:
  paragraphs:
  - zh: 对同一对象域采集默认枚举、包含隐藏与排除项的完整枚举、配置规则和服务器端状态，以稳定对象 ID 求差集。差异对象随后被执行、认证、加载、路由或读取且修改者未获批准时输出 default_view_omission；仅有合法系统隐藏时抑制。
    en: Collect default enumeration, complete enumeration including hidden and excluded items, configuration rules, and server-side
      state for one object domain and compute a difference by stable object ID. Emit default_view_omission when a differing
      object is later executed, authenticated, loaded, routed, or read and the modifier is unapproved. Suppress legitimate
      system hiding alone.
data_requirements:
- source_type: object-enumeration
  name:
    zh: 对象枚举与消费
    en: Object enumeration and consumption
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - object.id
  - object.type
  - view.type
  - hidden.state
  - exclusion.rule
  - modifier.id
  - consumer.id
  - action
observables:
- zh: 完整视图存在而默认视图遗漏的对象被后继消费
  en: An object present in the complete view but omitted from the default view is consumed later
correlation:
  window:
    zh: 默认与完整枚举使用同一对象快照周期；修改延伸到首次后继消费，具体保留上限依据对象域生命周期、规则审计频率和调查 SLA 配置并记录，不设跨产品固定天数。
    en: Use the same object-snapshot cycle for default and complete enumeration. Extend modification through first successor
      consumption and configure and record the concrete retention limit from object-domain lifecycle, rule-audit frequency,
      and investigation SLA rather than impose one fixed number of days across products.
  dimensions:
  - asset.id
  - object.id
  - object.type
  - view.type
  - modifier.id
  - consumer.id
false_positives:
- zh: 系统隐藏对象、归档邮箱规则、辅助功能窗口和批准扫描排除
  en: System-hidden objects, archival mail rules, accessibility windows, and approved scan exclusions
blind_spots:
- zh: 完整枚举接口不可用或对象 ID 在视图间不稳定
  en: Complete-enumeration API unavailable or object IDs unstable across views
tuning_guidance:
  paragraphs:
  - zh: 按对象类型维护批准隐藏与排除，要求 owner 和到期。严重度结合未知修改者、敏感对象、后继消费和视图持续差异，不用单一隐藏标志告警。
    en: Maintain approved hiding and exclusions by object type with owner and expiry. Severity combines unknown modifier,
      sensitive object, successor consumption, and persistent view difference rather than alerting on one hidden flag.
evidence_refs:
