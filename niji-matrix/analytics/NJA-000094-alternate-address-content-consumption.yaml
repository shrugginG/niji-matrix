schema_version: 2.0.0
type: detection-analytic
id: NJA-000094
strategy_ref: DET-000108
name:
  zh: 替代地址内容消费
  en: Alternate-Address Content Consumption
summary:
  zh: 输出默认路径未遍历的属性、分支、命名空间或挂载内容及其读取或执行。
  en: Produce content in attributes, forks, namespaces, or mounts not traversed by the default path and its read or execution.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 枚举文件系统全部数据属性、扩展属性、资源分支、挂载关系和隐藏结构，规范为承载对象、地址类型和内容摘要。未知写入后由进程通过特殊地址读取或执行，且主数据流或规范路径未显示相同内容时输出 alternate_address_consumption。
    en: Enumerate all file-system data attributes, extended attributes, resource forks, mount relationships, and hidden structures
      and normalize carrier object, address type, and content digest. Emit alternate_address_consumption when an unknown write
      is followed by a process reading or executing through the special address while the primary stream or canonical path
      does not show the same content.
data_requirements:
- source_type: filesystem-all-namespaces
  name:
    zh: 文件系统全命名空间与访问
    en: File-system all namespaces and access
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - carrier.id
  - address.type
  - address.name
  - content.hash
  - modifier.id
  - consumer.id
  - action
observables:
- zh: 主路径没有内容但替代属性写入后被加载
  en: The primary path lacks content while an alternate attribute is written and later loaded
correlation:
  window:
    zh: 从替代地址写入覆盖到该内容首次读取、加载或执行；持久内容按承载对象与内容摘要的实际保留生命周期延伸并记录，不使用统一三十或九十日默认值。
    en: Cover alternate-address write through the first read, load, or execution of that content. Extend persistent content
      according to the actual retention lifecycle of carrier object and content digest and record it rather than use uniform
      thirty- or ninety-day defaults.
  dimensions:
  - asset.id
  - carrier.id
  - address.type
  - address.name
  - content.hash
  - modifier.id
  - consumer.id
false_positives:
- zh: 合法元数据、应用资源分支、容器挂载和文件系统管理
  en: Legitimate metadata, application resource forks, container mounts, and file-system administration
blind_spots:
- zh: 采集器只遍历主数据流或备份丢弃替代属性
  en: Collector traverses only the primary stream or backups discard alternate attributes
tuning_guidance:
  paragraphs:
  - zh: 按文件系统和应用角色建立允许的地址类型与命名空间，优先未知可执行内容、用户可写承载体和加载结果。不要全局抑制扩展属性或挂载。
    en: Baseline permitted address types and namespaces by file system and application role and prioritize unknown executable
      content, user-writable carriers, and load outcomes. Do not suppress extended attributes or mounts globally.
evidence_refs:
- REF-000394
- REF-000392
- REF-000282
