schema_version: 2.0.0
type: detection-analytic
id: NJA-000095
strategy_ref: DET-000108
name:
  zh: 创建—运行表示差分
  en: Creation-to-Runtime Representation Differential
summary:
  zh: 输出创建时不可变状态、后续检查表示和实际运行结果之间的差异。
  en: Produce differences among immutable creation-time state, later inspection representation, and actual runtime outcome.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 在对象创建或进程启动时保存参数、源与编译状态摘要、映像和时间，再定期读取可变检查表示并与内存、执行分支和结果比较。表示在运行后变为良性或不完整而真实行为仍使用原恶意状态时输出 representation_runtime_divergence。
    en: At object creation or process start, preserve arguments, source and compiled-state digests, image, and time. Read
      mutable inspection representation later and compare it with memory, executed branch, and outcome. Emit representation_runtime_divergence
      when representation becomes benign or incomplete after launch while real behavior continues to use the original malicious
      state.
data_requirements:
- source_type: immutable-creation-and-runtime-state
  name:
    zh: 不可变创建与运行状态
    en: Immutable creation and runtime state
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - object.id
  - creation.arguments_hash
  - source.hash
  - compiled.hash
  - runtime.hash
  - memory.hash
  - action
  - outcome
observables:
- zh: 启动时参数与后续进程查询结果不同且敏感行为匹配原参数
  en: Launch-time arguments differ from a later process query while sensitive behavior matches the original arguments
- zh: 良性源码与继续执行的恶意编译状态不一致
  en: Benign source differs from malicious compiled state that continues to execute
correlation:
  window:
    zh: 覆盖对象创建、表示读取、运行时消费到终止；创建时摘要按进程遥测和文档调查保留策略保存到该对象最后可归因结果，具体上限由环境记录。
    en: Cover object creation, representation read, runtime consumption, and termination. Retain creation-time digests under
      process-telemetry and document-investigation policy through the object's last attributable outcome and record the concrete
      environment limit.
  dimensions:
  - asset.id
  - object.id
  - creation.arguments_hash
  - source.hash
  - compiled.hash
  - runtime.hash
false_positives:
- zh: 合法自修改运行时、即时编译、热更新和命令行清理
  en: Legitimate self-modifying runtimes, just-in-time compilation, hot updates, and command-line cleanup
blind_spots:
- zh: 未保存创建时状态、内存不可采集或对象身份不稳定
  en: Creation-time state not retained, memory unavailable, or object identity unstable
tuning_guidance:
  paragraphs:
  - zh: 按运行时和应用版本建立允许的表示变化，要求已签名更新和可解释编译链。未知进程、敏感结果和无法解释的创建到运行差分提高严重度。
    en: Baseline permitted representation changes by runtime and application version and require signed updates and explainable
      compilation lineage. Unknown processes, sensitive outcomes, and unexplained creation-to-runtime differences raise severity.
evidence_refs:
- REF-000395
- REF-000392
- REF-000424
