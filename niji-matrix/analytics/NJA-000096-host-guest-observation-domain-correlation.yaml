schema_version: 2.0.0
type: detection-analytic
id: NJA-000096
strategy_ref: DET-000108
name:
  zh: 宿主—来宾观察域关联
  en: Host–Guest Observation-Domain Correlation
summary:
  zh: 输出虚拟实例生命周期、边界网络和缺失来宾遥测之间的关系，并连接实例内恶意结果。
  en: Produce relationships among virtual-instance lifecycle, boundary networking, and absent guest telemetry and join malicious
    outcomes inside the instance.
domains:
- enterprise
platforms:
- Virtualization
logic:
  paragraphs:
  - zh: 关联创建实例的主体、镜像与磁盘、实例 ID、网络接口、边界流量、宿主虚拟化进程和来宾代理状态。未批准实例产生异常网络或资源活动且来宾遥测缺失，或虚拟磁盘检查发现恶意内容时输出 observation_domain_gap；已管理来宾使用内部事件补全链条。
    en: Correlate principal creating the instance, image and disk, instance ID, network interface, boundary traffic, host
      virtualization process, and guest-agent state. Emit observation_domain_gap when an unapproved instance produces anomalous
      network or resource activity while guest telemetry is absent or virtual-disk inspection finds malicious content. Complete
      the chain with internal events for managed guests.
data_requirements:
- source_type: virtualization-lifecycle-and-network
  name:
    zh: 虚拟化生命周期与网络
    en: Virtualization lifecycle and network
  channel: null
  required_fields:
  - event.timestamp
  - host.id
  - principal.id
  - instance.id
  - image.id
  - disk.id
  - network.interface
  - network.destination
  - guest_agent.state
  - action
observables:
- zh: 未批准虚拟实例无来宾代理却产生异常边界流量
  en: An unapproved virtual instance without a guest agent produces anomalous boundary traffic
- zh: 宿主只见虚拟化进程而虚拟磁盘包含可执行恶意工件
  en: The host sees only a virtualization process while the virtual disk contains executable malicious artifacts
correlation:
  window:
    zh: 覆盖实例创建到销毁以及共享资源的最后一次来宾消费；镜像、磁盘和网络映射按虚拟化资产清单与事件响应保留策略保存，具体上限由环境记录。
    en: Cover instance creation through destruction and the last guest consumption of shared resources. Retain image, disk,
      and network mappings according to virtualization inventory and incident-response retention policy and record the concrete
      environment limit.
  dimensions:
  - host.id
  - principal.id
  - instance.id
  - image.id
  - disk.id
  - network.interface
false_positives:
- zh: 批准开发虚拟机、沙箱、测试实验室和个人桌面虚拟化
  en: Approved development virtual machines, sandboxes, test labs, and personal desktop virtualization
blind_spots:
- zh: 桥接网络未映射实例、加密磁盘不可检查或管理面日志缺失
  en: Bridged network not mapped to an instance, encrypted disk unavailable for inspection, or missing management-plane logs
tuning_guidance:
  paragraphs:
  - zh: 建立批准实例、镜像、网络和来宾代理基线，要求无代理实例具有 owner 与到期。异常边界流量、未知镜像和缺失管理记录组合提高严重度。
    en: Baseline approved instances, images, networks, and guest agents and require agentless instances to have an owner and
      expiry. The combination of anomalous boundary traffic, unknown image, and missing management record raises severity.
evidence_refs:
- REF-000396
- REF-000392
- REF-000425
