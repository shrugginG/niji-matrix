schema_version: 2.0.0
type: detection-analytic
id: NJA-000097
strategy_ref: DET-000109
name:
  zh: 证据对象删除—前态—残留谱系
  en: Evidence-Object Deletion–Prior State–Residue Lineage
summary:
  zh: 输出攻击活动后的工件删除、关系清理、时间改写或位置迁移及其独立残留。
  en: Produce artifact deletion, relationship cleanup, time rewriting, or relocation after attack activity together with independent
    residue.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 按对象 ID 保存创建、写入、读取或执行、内容摘要、删除动作、删除主体和后态，并与独立日志、备份、远程副本或未分配空间残留比较。若攻击步骤使用过的关键对象随后被未批准主体删除，且前态或独立残留可证明，则输出 evidence_object_erasure；关系拆除、时间伪造和位置迁移转交各自 Analytic。
    en: By object ID, preserve creation, write, read or execution, content digest, delete action, deleting principal, and later
      state and compare them with independent log, backup, remote replica, or unallocated-space residue. Emit evidence_object_erasure
      when an object used by an attack step is later deleted by an unapproved principal and prior state or independent residue
      proves it. Route relation teardown, temporal falsification, and location migration to their own analytics.
data_requirements:
- source_type: artifact-version-and-change
  name:
    zh: 工件版本与变化
    en: Artifact version and change
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - object.id
  - object.type
  - prior.hash
  - prior.time
  - delete.operation
  - modifier.id
  - current.hash
  - deletion.result
  - approval.id
- source_type: independent-artifact-history
  name:
    zh: 独立工件历史
    en: Independent artifact history
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - object.id
  - replica.id
  - backup.id
  - log.sequence
  - prior.consumer_action
  - recovery.location
observables:
- zh: 攻击步骤后关键工件被删除或关系被清理
  en: A key artifact is deleted or a relationship is cleaned after an attack step
- zh: 当前时间或位置与独立历史不一致且后继活动继续
  en: Current time or location differs from independent history while successor activity continues
correlation:
  window:
    zh: 从对象创建或首次攻击消费覆盖到删除和首次独立恢复；具体上限依据对象保留、备份、邮箱版本或日志序列生命周期配置并记录，不设跨对象固定天数。
    en: Cover object creation or first attack consumption through deletion and first independent recovery. Configure and record
      the concrete upper bound from object retention, backup, mailbox version, or log-sequence lifecycle rather than impose
      a fixed number of days across object classes.
  dimensions:
  - asset.id
  - object.id
  - object.type
  - modifier.id
  - delete.operation
  - activity.id
  - replica.id
false_positives:
- zh: 合法保留策略、卸载、用户清理、备份轮换、隐私删除和应急处置
  en: Legitimate retention policy, uninstall, user cleanup, backup rotation, privacy deletion, and incident response
blind_spots:
- zh: 仅保留当前状态、独立副本同权可写或对象 ID 在迁移后变化
  en: Only current state retained, independent copies writable under the same authority, or object IDs changing after relocation
tuning_guidance:
  paragraphs:
  - zh: 绑定合法清理到 owner、工单、对象范围和保留策略，优先攻击步骤后的选择性变化和独立证据矛盾。不要以文件删除或时间变化单独告警。
    en: Bind legitimate cleanup to owner, work record, object scope, and retention policy and prioritize selective change
      after an attack step and contradictions with independent evidence. Do not alert on file deletion or time change alone.
