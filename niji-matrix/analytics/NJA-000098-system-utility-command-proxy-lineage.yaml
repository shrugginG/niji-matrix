schema_version: 2.0.0
type: detection-analytic
id: NJA-000098
strategy_ref: DET-000110
name:
  zh: 即时实用程序调用代理谱系
  en: Immediate Utility-Invocation Proxy Lineage
summary:
  zh: 输出原始调用者、实用程序输入、配置状态和间接执行或网络结果之间的链条。
  en: Produce the chain among original caller, utility input, configuration state, and indirect execution or network outcome.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 按进程 start key 保存调用者、实用程序映像、完整参数、标准输入摘要、调用文件、子进程和网络连接。解析工具特定代理字段并规范为 command_semantics；若一次性输入使受信实用程序立即启动敏感程序、执行脚本或建立异常网络，则输出 immediate_utility_proxy。配置写入与未来触发转交 NJA-000115。
    en: By process start key, preserve caller, utility image, complete arguments, standard-input digest, invocation file, child
      process, and network connection. Parse utility-specific proxy fields and normalize them as command_semantics. Emit immediate_utility_proxy
      when one-shot input causes a trusted utility to start a sensitive program, execute a script, or establish anomalous networking
      immediately. Route configuration write and future trigger to NJA-000115.
data_requirements:
- source_type: process-command-and-config
  name:
    zh: 进程命令与配置
    en: Process command and configuration
  channel: null
  required_fields:
  - event.timestamp
  - host.id
  - caller.start_key
  - utility.start_key
  - utility.image
  - command_line
  - stdin.hash
  - invocation_file.path
  - command_semantics
  - child.start_key
  - network.destination
  - outcome
observables:
- zh: 受信实用程序解析代理参数后启动被限制命令
  en: A trusted utility starts a restricted command after parsing proxy arguments
- zh: SSH 或类似配置修改后连接触发本地命令或异常网络
  en: SSH or similar configuration modification causes a connection to trigger a local command or anomalous networking
correlation:
  window:
    zh: 覆盖同一请求者、实用程序进程实例与其首个子进程或网络结果；上限由进程生命周期和遥测交付延迟配置并记录，不纳入持久配置等待期。
    en: Cover the same requester, utility process instance, and its first child-process or network outcome. Configure and record
      the upper bound from process lifetime and telemetry delivery delay and exclude durable configuration waiting periods.
  dimensions:
  - host.id
  - caller.start_key
  - utility.start_key
  - utility.image
  - command.hash
  - child.start_key
false_positives:
- zh: 合法管理脚本、软件兼容性处理、自动化运维、WSL 开发和 SSH 管理配置
  en: Legitimate administration scripts, software compatibility handling, operations automation, WSL development, and SSH
    management configuration
blind_spots:
- zh: 命令行截断、配置写入未审计或代理工具在进程内执行而不创建子进程
  en: Truncated command lines, unaudited configuration writes, or proxy utilities executing in-process without a child
tuning_guidance:
  paragraphs:
  - zh: 按工具、签名调用者、参数模式、配置 owner、目标和变更窗口建立组合基线。允许规则必须绑定完整组合，不能只按签名工具名放行；敏感子程序和外连提高严重度。
    en: Baseline combinations of utility, signed caller, argument pattern, configuration owner, target, and change window.
      Allow logic binds the complete combination rather than a signed utility name alone. Sensitive children and egress raise
      severity.
evidence_refs:
