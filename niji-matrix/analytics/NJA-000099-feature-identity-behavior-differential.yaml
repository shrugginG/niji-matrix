schema_version: 2.0.0
type: detection-analytic
id: NJA-000099
strategy_ref: DET-000111
name:
  zh: 受信资源身份—稳定来源差分
  en: Trusted Resource Identity–Stable Provenance Differential
summary:
  zh: 输出资源借用受信名称、位置或发布者外观但稳定对象身份、来源或行为不一致的实例。
  en: Produce instances where a resource borrows a trusted name, location, or publisher appearance but differs in stable object identity, provenance, or behavior.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 对文件、任务、服务、账户或重命名工具建立 visible_resource_identity，并从对象 ID、签名验证、内容摘要、创建者、原始名称、移动或重命名历史和后继行为建立 stable_provenance。可见身份匹配受信参照而稳定来源或敏感结果不匹配时，输出 trusted_resource_identity_mimicry。
    en: Establish visible_resource_identity for a file, task, service, account, or renamed utility and stable_provenance from object identity, signing validation, content digest, creator, original name, move or rename history, and successor behavior. Emit trusted_resource_identity_mimicry when the visible identity matches a trusted reference while stable provenance or a sensitive outcome does not.
data_requirements:
- source_type: artifact-feature-and-provenance
  name:
    zh: 工件特征与来源
    en: Artifact feature and provenance
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - object.id
  - object.type
  - visible.name
  - visible.path
  - visible.type
  - signer
  - content.hash
  - creator.id
  - object.original_name
  - object.change_history
  - behavior.outcome
observables:
- zh: 名称和位置匹配合法对象但签名、哈希或行为不同
  en: Name and location match a legitimate object while signing, hash, or behavior differs
- zh: 任务、服务、账户或工具使用受信角色标签，但创建者与批准变更不一致
  en: A task, service, account, or utility uses a trusted role label while its creator differs from approved change
correlation:
  window:
    zh: 从创建、移动或重命名覆盖到首次敏感使用；具体期限依据对象生命周期、变更审计保留和业务更新周期设定。
    en: Cover creation, move, or rename through first sensitive use. Set the concrete limit from object lifecycle, change-audit retention, and the business update cycle.
  dimensions:
  - asset.id
  - object.id
  - object.type
  - creator.id
  - signer
  - content.hash
  - behavior.outcome
false_positives:
- zh: 合法品牌更新、软件迁移、兼容性重命名、管理任务与隐私客户端
  en: Legitimate branding updates, software migration, compatibility renaming, administrative tasks, and privacy clients
blind_spots:
- zh: 缺少独立来源、签名不验证、创建历史丢失或浏览器特征只能在服务端看到
  en: Missing independent provenance, unvalidated signing, lost creation history, or browser features visible only server-side
tuning_guidance:
  paragraphs:
  - zh: 按发布者、软件版本、对象角色和批准变更建立合法特征组合，不只维护名称白名单。优先多源差异、用户可写位置、未知创建者和敏感后继结果。
    en: Baseline legitimate feature combinations by publisher, software version, object role, and approved change rather than
      maintain name allowlists alone. Prioritize multi-source differences, user-writable locations, unknown creators, and
      sensitive successor outcomes.
evidence_refs:
- REF-000399
- REF-000152
