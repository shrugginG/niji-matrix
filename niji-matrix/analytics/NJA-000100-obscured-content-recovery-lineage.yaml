schema_version: 2.0.0
type: detection-analytic
id: NJA-000100
strategy_ref: DET-000112
name:
  zh: 可逆变换恢复谱系
  en: Reversible-Transform Recovery Lineage
summary:
  zh: 输出编码、加密、压缩、打包或命令变换的逐层输入、恢复输出和后继执行链。
  en: Produce the layered input, recovered output, and successor-execution chain for encoding, encryption, compression,
    packing, or command transformation.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 对文件、脚本、命令和网络内容保存原始摘要、格式、来源与变换参数，递归应用安全解码、解密、解压、解包或命令规范化，并为每层记录输入摘要、变换类型、参数和输出摘要。静态恢复失败时捕获运行时缓冲区；规范内容包含可执行语义并与敏感结果相连时输出
      reversible_semantic_transformation。
    en: Preserve original digest, format, provenance, and transform parameters for files, scripts, commands, and network
      content. Recursively apply safe decoding, decryption, decompression, unpacking, or command normalization and record
      input digest, transform type, parameters, and output digest for each layer. Capture runtime buffers when static
      recovery fails and emit reversible_semantic_transformation when canonical content contains executable semantics
      and connects to a sensitive outcome.
data_requirements:
- source_type: content-and-runtime-recovery
  name:
    zh: 内容与运行时恢复
    en: Content and runtime recovery
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - object.id
  - original.hash
  - format
  - entropy
  - transform.input_hash
  - transform.type
  - transform.parameters_hash
  - transform.output_hash
  - process.start_key
  - successor.action
observables:
- zh: 多层变换后恢复可执行内容并立即运行
  en: Executable content is recovered after multiple transformations and executed immediately
- zh: 编码命令在脚本宿主或管理 broker 下恢复为下载与执行语义
  en: An encoded command recovers download and execution semantics under a script host or management broker
correlation:
  window:
    zh: 以同一对象和恢复链覆盖原始取得、逐层变换到首次敏感使用；具体期限依据沙箱寿命、对象保留和脚本审计窗口设定。
    en: Use one object and recovery lineage from original acquisition through every transform to first sensitive use.
      Set the concrete limit from sandbox lifetime, object retention, and script-audit window.
  dimensions:
  - asset.id
  - object.id
  - original.hash
  - transform.input_hash
  - transform.output_hash
  - transform.type
  - process.start_key
false_positives:
- zh: 合法压缩、加密软件、安装包、数字版权保护、即时编译和协议编码
  en: Legitimate compression, encryption software, installers, digital-rights protection, just-in-time compilation, and
    protocol encoding
blind_spots:
- zh: 缺少密钥、触发条件未满足、资源限制或恶意代码只在真实目标恢复
  en: Missing key, unsatisfied trigger, resource limit, or malicious code recovering only on the real target
tuning_guidance:
  paragraphs:
  - zh: 按发布者、格式、用途和恢复结果建立合法基线，限制递归深度和资源但保留失败层。严重度结合未知来源、可执行恢复内容、内存执行和敏感后继动作，不用熵阈值单独定性。
    en: Baseline legitimate behavior by publisher, format, purpose, and recovery outcome and limit recursion depth and
      resources while preserving failed layers. Severity combines unknown provenance, executable recovered content, memory
      execution, and sensitive successor action rather than entropy alone.
