schema_version: 2.0.0
type: detection-analytic
id: NJA-000101
strategy_ref: DET-000113
name:
  zh: 查询路径返回集合差分
  en: Query-Path Returned-Set Differential
summary:
  zh: 输出共享查询路径遗漏但独立状态证明存在的对象，并连接返回集合、hook 与后继行为。
  en: Produce objects omitted by a shared query path but established by independent state and join returned sets, hooks, and successor behavior.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- Network Devices
logic:
  paragraphs:
  - zh: 对同一进程、文件、端口或连接记录查询入口、调用者、路径 ID、输入选择器和返回集合，并与内核或 hypervisor 对象、原始存储、socket 与旁路网络对齐。独立视图重复证明对象存在，但共享查询结果稳定遗漏该对象，且函数、表项、模块、preload 或控制设备发生未批准变化时，输出 query_path_result_filtering；只有一次快照差异或没有路径完整性证据时降低置信。
    en: Record query entry, caller, path identity, input selector, and returned set for the same process, file, port, or connection and align them with kernel or hypervisor objects, raw storage, sockets, and side-channel networking. Emit query_path_result_filtering when independent views repeatedly establish object existence, the shared query result consistently omits the object, and an unapproved function, table entry, module, preload, or control-device change exists. Lower confidence for a one-snapshot difference or missing path-integrity evidence.
data_requirements:
- source_type: multi-layer-system-state
  name:
    zh: 多层系统状态
    en: Multi-layer system state
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - object.id
  - object.type
  - query.path_id
  - query.caller
  - query.selector_hash
  - query.returned_object_ids
  - independent_view.layer
  - independent_view.present
  - code.hash
  - function_pointer
  - module.id
  - control_device.id
  - network.endpoint
  - action
observables:
- zh: 用户态列表遗漏但内核或网络证明存在的进程或连接
  en: A process or connection omitted from user-space lists but established by kernel or network evidence
- zh: 系统信息函数或表指针被未知模块修改
  en: A system-information function or table pointer is modified by an unknown module
correlation:
  window:
    zh: 在同一对象稳定生命周期内对齐查询与独立视图，并回连模块或 hook 的加载来源；具体期限依据对象寿命、采样间隔和启动来源保留设定。
    en: Align queries and independent views within the stable lifetime of the same object and join module or hook load provenance. Set the concrete limit from object lifetime, sampling interval, and boot-provenance retention.
  dimensions:
  - asset.id
  - object.id
  - object.type
  - query.path_id
  - query.caller
  - module.id
  - code.hash
false_positives:
- zh: 安全软件、兼容性 hook、虚拟化代理、调试器和性能监控
  en: Security software, compatibility hooks, virtualization agents, debuggers, and performance monitoring
blind_spots:
- zh: 所有层共享同一被篡改数据源、可信下层不可访问或固件测量缺失
  en: Every layer shares one tampered source, trusted lower layer is inaccessible, or firmware measurement is absent
tuning_guidance:
  paragraphs:
  - zh: 按签名模块、系统版本和安全产品维护批准 hook 与驱动基线，并使用独立网络和磁盘证据。对象缺失与未知完整性变化、后继行为组合时升级。
    en: Baseline approved hooks and drivers by signed module, system version, and security product and use independent network
      and disk evidence. Escalate on the combination of object omission, unknown integrity change, and successor behavior.
evidence_refs:
- REF-000401
- REF-000433
