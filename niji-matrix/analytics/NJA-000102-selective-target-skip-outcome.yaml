schema_version: 2.0.0
type: detection-analytic
id: NJA-000102
strategy_ref: DET-000114
name:
  zh: 主机内关键对象处理覆盖差分
  en: In-Host Critical-Object Processing-Coverage Differential
summary:
  zh: 输出同一主机内的对象枚举、排除谓词、处理与保留集合以及连续运行后的破坏结果。
  en: Produce object enumeration, exclusion predicate, processed and preserved sets, and destructive outcome after continued operation within one host.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 按资产、进程与样本记录文件、目录、扩展名和组件枚举，恢复嵌入配置、正则、比较分支与操作结果，并计算同一枚举域的处理和保留集合。未知或恶意进程稳定保留启动、应用、网络或通知所需对象，同时加密、擦除或篡改其他目标且保持关键组件运行时，输出 in_host_critical_object_preservation。
    en: Record file, directory, extension, and component enumeration by asset, process, and sample; recover embedded configuration, regular expressions, comparison branches, and operation results; and calculate processed and preserved sets in the same enumeration domain. Emit in_host_critical_object_preservation when an unknown or malicious process consistently preserves objects needed for boot, applications, networking, or notification while encrypting, wiping, or tampering with other targets and keeping critical components operational.
data_requirements:
- source_type: target-enumeration-and-impact
  name:
    zh: 目标枚举与影响
    en: Target enumeration and impact
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - process.start_key
  - sample.hash
  - target.id
  - target.type
  - target.criticality
  - predicate.hash
  - branch.result
  - action
  - outcome
  - system.availability
observables:
- zh: 加密或擦除进程枚举关键目标后稳定跳过特定集合
  en: An encryption or wipe process enumerates critical targets and consistently skips a selected set
- zh: 被保留组件维持启动、网络或通知而其他目标遭破坏
  en: Preserved components maintain boot, networking, or notification while other targets are damaged
correlation:
  window:
    zh: 覆盖一次批量处理进程的完整枚举与修改阶段，并关联紧邻的主机可用性、通知和最终影响；具体期限依据进程寿命、任务队列和影响确认窗口设定。
    en: Cover the complete enumeration and modification phase of one bulk-processing process and join closely adjacent host availability, notification, and final impact. Set the concrete limit from process lifetime, task queue, and impact-confirmation window.
  dimensions:
  - asset.id
  - process.start_key
  - sample.hash
  - predicate.hash
  - target.type
  - target.criticality
  - branch.result
  - action
false_positives:
- zh: 备份和杀毒排除、维护范围、安全保留列表、性能优化和合规策略
  en: Backup and antivirus exclusions, maintenance scope, safety allowlists, performance optimization, and compliance policy
blind_spots:
- zh: 跳过分支不记录、配置加密且未恢复或只观察实际修改目标
  en: Skip branches not recorded, encrypted configuration not recovered, or only modified targets observed
tuning_guidance:
  paragraphs:
  - zh: 为合法排除绑定进程签名、owner、用途、目标范围和变更窗口。优先未知载荷、系统关键目标枚举、稳定谓词和并行破坏结果；不按单个未修改文件告警。
    en: Bind legitimate exclusions to process signing, owner, purpose, target scope, and change window. Prioritize unknown
      payloads, enumeration of system-critical targets, stable predicates, and concurrent destructive outcomes rather than
      one unchanged file.
evidence_refs:
- REF-000402
- REF-000434
