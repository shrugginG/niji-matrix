schema_version: 2.0.0
type: detection-analytic
id: NJA-000103
strategy_ref: DET-000115
name:
  zh: 关系权威请求—用户动作谱系
  en: Relational-Authority Request–User-Action Lineage
summary:
  zh: 输出冒充关系主体或职能权威的请求、用户动作和未授权技术结果之间的链条。
  en: Produce the chain among a request impersonating a relationship principal or functional authority, user action, and unauthorized technical outcome.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 规范聊天、通话、邮件、工单或招聘请求的账户/租户、外部标签、显示身份、线程、组织角色和历史关系，提取请求的高风险动作，并连接用户输入、执行、审批、权限变化、披露或支付结果。声明主体与权威目录或关系历史不一致、请求缺少独立确认且用户动作产生未授权结果时，输出 relational_authority_impersonation；域认证失败本身交由邮件来源 Analytic 处理。
    en: Normalize account or tenant, external labeling, displayed identity, thread, organizational role, and historical relationship for chat, voice, mail, ticket, or recruiting requests; extract the requested high-risk action; and join user entry, execution, approval, authority change, disclosure, or payment outcome. Emit relational_authority_impersonation when the claimed principal conflicts with an authoritative directory or relationship history, the request lacks independent confirmation, and a user action produces an unauthorized outcome. Domain-authentication failure alone is handled by the mail-provenance analytic.
data_requirements:
- source_type: communication-and-user-outcome
  name:
    zh: 通信与用户结果
    en: Communication and user outcome
  channel: null
  required_fields:
  - event.timestamp
  - user.id
  - channel.id
  - sender.id
  - sender.tenant_id
  - sender.external_label
  - display.identity
  - thread.id
  - claimed.role
  - authoritative.role
  - relationship.score
  - confirmation.status
  - requested.action
  - user.action
  - outcome
observables:
- zh: 外部或新租户账户声称内部支持角色，随后用户完成 MFA、远程协助或安装动作
  en: An external or new-tenant account claims an internal support role and the user then completes MFA, remote assistance, or installation
- zh: 新关系或异常线程请求执行、审批、支付或披露且独立确认缺失
  en: A new relationship or anomalous thread requests execution, approval, payment, or disclosure without independent confirmation
correlation:
  window:
    zh: 覆盖一次请求、用户判断、敏感动作与直接后继结果；具体期限依据渠道线程、审批 SLA、认证流程和支付工作流设定。
    en: Cover one request, user judgment, sensitive action, and direct successor outcome. Set the concrete limit from channel thread, approval SLA, authentication flow, and payment workflow.
  dimensions:
  - user.id
  - channel.id
  - sender.id
  - sender.tenant_id
  - thread.id
  - claimed.role
  - requested.action
  - user.action
false_positives:
- zh: 新供应商、组织变更、临时授权、合法服务台和紧急业务请求
  en: New vendors, organizational changes, temporary authorization, legitimate help desk, and emergency business requests
blind_spots:
- zh: 加密外部渠道、通话内容不可得、真实账户被攻陷或用户动作未记录
  en: Encrypted external channels, unavailable call content, compromised real accounts, or unrecorded user actions
tuning_guidance:
  paragraphs:
  - zh: 为高风险动作定义独立回呼与双人审批，按关系历史和域认证调优但不全局信任已知显示名。严重度结合来源差异、请求风险、确认缺失和实际结果。
    en: Define independent callback and dual approval for high-risk actions and tune by relationship history and domain authentication
      without globally trusting known display names. Severity combines provenance difference, request risk, missing confirmation,
      and actual outcome.
evidence_refs:
