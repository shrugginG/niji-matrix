schema_version: 2.0.0
type: detection-analytic
id: NJA-000104
strategy_ref: DET-000116
name:
  zh: 远程模板响应—执行谱系
  en: Remote-Template Response–Execution Lineage
summary:
  zh: 输出原始文档、外部关系、远程响应摘要、模板缓存和后继代码执行之间的链条。
  en: Produce the chain among original document, external relationship, remote response digest, template cache, and successor code execution.
domains:
- enterprise
platforms:
- Windows
- macOS
logic:
  paragraphs:
  - zh: 提取文档关系 ID、URI、类型和原文件摘要，关联打开应用的 DNS/HTTP/SMB 请求、服务器与证书、实际响应摘要、模板缓存、宏/脚本加载、子进程和网络结果。原文件不含最终可执行语义，而未知或不受信响应在运行时提供宏、脚本或模板并产生敏感结果时，输出 remote_template_content_substitution。
    en: Extract document relationship identity, URI, type, and original-file digest and correlate DNS, HTTP, or SMB requests from the opening application, server and certificate identity, actual response digest, template cache, macro or script load, child processes, and network outcomes. Emit remote_template_content_substitution when the original file lacks final executable semantics and an unknown or untrusted runtime response supplies a macro, script, or template that produces a sensitive outcome.
data_requirements:
- source_type: document-relationship-and-runtime
  name:
    zh: 文档关系与运行结果
    en: Document relationship and runtime outcome
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - document.hash
  - relationship.id
  - relationship.uri
  - relationship.type
  - process.start_key
  - network.destination
  - response.hash
  - response.mime_type
  - cache.object_hash
  - code.load_type
  - child.start_key
  - outcome
observables:
- zh: 文档打开后应用访问未知模板并执行取得内容
  en: The application accesses an unknown template after opening a document and executes retrieved content
- zh: 同一文档关系按请求环境返回不同摘要，其中真实型环境取得可执行模板
  en: The same document relationship returns different digests by request environment and a real-like environment receives an executable template
correlation:
  window:
    zh: 覆盖一次文档打开、关系解析、响应/缓存消费和首个后继执行；具体期限依据应用解析、缓存寿命和沙箱运行上限设定。
    en: Cover one document open, relationship resolution, response or cache consumption, and first successor execution. Set the concrete limit from application resolution, cache lifetime, and sandbox execution ceiling.
  dimensions:
  - asset.id
  - document.hash
  - relationship.id
  - relationship.uri
  - process.start_key
  - network.destination
false_positives:
- zh: 企业集中模板、品牌资源、协作插件和合法外部样式
  en: Enterprise centralized templates, branding resources, collaboration plug-ins, and legitimate external styles
blind_spots:
- zh: 文档关系未解析、TLS 内容不可见、缓存来源丢失或认证发生在独立系统
  en: Document relationships not parsed, TLS content unavailable, cache provenance lost, or authentication occurring on a
    separate system
tuning_guidance:
  paragraphs:
  - zh: 按文档签名、发布者、批准模板域和关系类型建立基线。未知外部域、用户可写原文件、应用发起认证和后继代码提高严重度。
    en: Baseline document signing, publisher, approved template domains, and relationship types. Unknown external domains,
      user-writable originals, application-initiated authentication, and successor code raise severity.
evidence_refs:
- REF-000407
- REF-000438
