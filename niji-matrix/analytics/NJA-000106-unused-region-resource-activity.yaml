schema_version: 2.0.0
type: detection-analytic
id: NJA-000106
strategy_ref: DET-000118
name:
  zh: 未使用区域资源活动
  en: Unused-Region Resource Activity
summary:
  zh: 输出历史未使用、未批准或偏离主体常规区域的新资源与后继恶意活动。
  en: Produce new resources and successor malicious activity in a historically unused unapproved or principal-atypical Region.
domains:
- enterprise
platforms:
- IaaS
logic:
  paragraphs:
  - zh: 从全局组织和账户 API 枚举区域、资源创建/调用与主体会话，比较组织批准区域、历史资源、主体常用 endpoint、owner 与区域成本。历史未使用、未批准或偏离该主体常规区域的位置出现新资源或服务调用，并与异常网络、数据访问、计算或账单相连时，输出 region_usage_baseline_displacement；控制缺口是否存在交给覆盖 Analytic。
    en: Enumerate Regions, resource creation or invocation, and principal sessions from global organization and account APIs and compare organizational approved Regions, historical resources, principal-normal endpoints, owners, and regional cost. Emit region_usage_baseline_displacement when a new resource or service call appears in a historically unused, unapproved, or principal-atypical Region and connects to anomalous networking, data access, compute, or billing. The coverage analytic determines whether control gaps exist.
data_requirements:
- source_type: global-cloud-control-plane
  name:
    zh: 全局云控制面
    en: Global cloud control plane
  channel: null
  required_fields:
  - event.timestamp
  - organization.id
  - account.id
  - principal.id
  - region.id
  - resource.id
  - resource.type
  - action
  - logging.enabled
  - security_service.enabled
  - network.destination
  - billing.amount
observables:
- zh: 历史未使用区域突然创建计算或存储资源
  en: Compute or storage resources appear suddenly in a historically unused region
- zh: 新区域资源缺少日志或安全服务并产生异常网络
  en: A new regional resource lacks logging or security services and produces anomalous networking
correlation:
  window:
    zh: 覆盖一个身份会话、首次区域请求、资源创建或调用与直接后继活动，并按业务周期维护长期区域历史；具体期限依据令牌寿命、资源生命周期和账单延迟设定。
    en: Cover one identity session, first Region request, resource creation or invocation, and direct successor activity and maintain long-term regional history by business cycle. Set the concrete limit from token lifetime, resource lifecycle, and billing delay.
  dimensions:
  - organization.id
  - account.id
  - principal.id
  - region.id
  - resource.id
  - resource.type
false_positives:
- zh: 灾备演练、全球扩展、合规迁移、供应商测试和临时容量
  en: Disaster-recovery exercises, global expansion, compliance migration, vendor testing, and temporary capacity
blind_spots:
- zh: 全局 API 不完整、账单延迟、跨账户资源不可见或响应权限缺失
  en: Incomplete global APIs, delayed billing, invisible cross-account resources, or missing responder authority
tuning_guidance:
  paragraphs:
  - zh: 维护批准区域、owner、用途和期限，并强制所有区域统一日志与配置规则。首次区域使用与异常主体和网络组合时升级，不按区域名称永久抑制。
    en: Maintain approved regions, owners, purposes, and expiry and enforce uniform logging and configuration rules across
      all regions. Escalate first regional use combined with anomalous principal and networking and do not suppress permanently
      by region name.
evidence_refs:
- REF-000409
- REF-000442
