schema_version: 2.0.0
type: detection-analytic
id: NJA-000107
strategy_ref: DET-000119
name:
  zh: 系统指纹环境—行为差分
  en: System-Fingerprint Environment–Behavior Differential
summary:
  zh: 通过已核验系统返回、经审阅的比较位置和同样本特征变体，识别条件化早退或部署差分。
  en: Identify conditional exit or deployment differentials through verified system returns, reviewed comparison locations,
    and same-sample feature variants.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 这是需显式部署验证的受控样本实验，字段均为研究数据合同。编排器分配run.id与同样本run.pair_id，保存样本/入口哈希、镜像、参数、工作目录、文档、输入/网络重放、插桩配置和独立主机单调纳秒预算；PID、启动时间、父键及会话组成run内生命周期映射。Frida
      Interceptor只提供已配置函数的参数/原始返回，Stalker只在启用后提供执行块，两者不天然提供比较语义。分析员条件审阅登记另按样本、模块哈希和RVA保存比较指令、数据流证据、操作数来源、选中边的证据定位、作者、版本与校验状态；静态常量、调用输出和动态操作数明确分开。动态操作数只有比较点callout适配器已验证且采集成功时使用，保存配置与证据；无法解释的条件保持unknown并仅输出候选。
    en: This controlled sample experiment requires explicit deployment validation; all fields are research data contracts.
      The orchestrator assigns run.id and same-sample run.pair_id and retains sample/entry hashes, image, arguments, working
      directory, document, input/network replay, instrumentation configuration, and an independent host-monotonic nanosecond
      budget. PID, start time, parent key, and session define per-run process-lifetime maps. Frida Interceptor supplies configured
      arguments/raw returns and enabled Stalker supplies executed blocks; neither inherently supplies comparison semantics.
      A separate analyst condition-review register retains sample and module hashes plus RVA, comparison instructions, dataflow
      evidence, operand origins, selected-edge evidence, author, revision, and validation state. Static constants, call outputs,
      and dynamic operands remain distinct. Use dynamic operands only after validating a comparison-point callout adapter
      and successful capture, retaining configuration and evidence. Unexplained conditions remain unknown and yield candidates
      only.
  - zh: 将样本实际读取的参数/返回与环境登记对齐，不能把清单特征当作已被样本读取。WMI分别保留ExecQuery查询、flags、HRESULT和枚举器，以及Next返回的对象数、状态、属性和值；创建枚举器不等于取得实例，WBEM_S_FALSE可伴随有效对象，TIMEDOUT或截断不证明空集合。Registry、文件等接口仅在其适配器已验证时解码；特征存在、缺失、权限失败、部分结果及未采集分开。
    en: Align actual sample read parameters and returns with environmental registration rather than assuming the sample read
      manifest features. For WMI, retain ExecQuery query, flags, HRESULT, and enumerator separately from Next counts, status,
      properties, and values. Enumerator creation does not establish instances; WBEM_S_FALSE can accompany valid objects,
      while TIMEDOUT or truncation does not establish emptiness. Decode Registry, file, or other returns only through validated
      adapters, separating presence, absence, denial, partial results, and uncaptured data.
  - zh: 对可疑特征构造最小变体。条件审阅登记须把实际返回调用与比较操作数数据流相连，不从出现查询推定其参与分支。可选Stalker显式启用相关线程block事件，保留模块加载映射，再由审阅证据定位选中边；执行块不是天然branch.id。后继可为归因后的文件部署、进程创建或已启用的实际网络结果，任意子进程或连接不自动算核心能力。仅当系统特征进入已校验环境判断并稳定收缩后继，才输出system_fingerprint_analysis_classification。
    en: Construct minimal feature variants. Condition reviews must link actual return calls to comparison-operand dataflow
      rather than assuming that a query participates in branching. Optional Stalker explicitly enables relevant-thread block
      events and retains module-load maps; review evidence then locates the selected edge. Executed blocks are not native
      branch.id values. Successors may be attributed file deployment, process creation, or enabled actual networking, without
      treating arbitrary children or connections as core capability. Emit system_fingerprint_analysis_classification only
      when the feature enters a validated environment judgment and reproducibly contracts successors.
  - zh: 仅比较采集健康、同样本且可复现的对照，一次改变一个可解释条件，保持其他条件和主机预算一致并重复基线/变体。后继标记预先登记工件或调用位置，状态区分observed、not-observed-with-complete-capture、error、timeout、uncaptured及nonreproducible。可选执行块、网络、内存、CPU和动态操作数均携带启用/采集状态，未启用值置空，不把缺失当未发生；内存另定义地址、长度和时点。来宾原始时间保留类型、单位和映射，主机时间不随来宾加速。缺少选中边或条件校验时最多输出候选，除非静态检查链和独立受控后继已足以证明；插桩扰动与重放失败均削弱因果。
    en: Compare only healthy, reproducible same-sample controls, changing one interpretable condition while holding other
      conditions and host budgets constant and repeating baseline and variant. Pre-register successor artifacts or call locations
      and distinguish observed, not-observed-with-complete-capture, error, timeout, uncaptured, and nonreproducible. Optional
      blocks, network, memory, CPU, and dynamic operands carry enablement/capture state; disabled values are null, never absence
      evidence. Memory separately defines addresses, lengths, and timing. Guest clocks retain raw type, unit, and mapping,
      while host time does not follow guest acceleration. Missing selected edges or unvalidated conditions yield candidates
      unless static check chains and independent controlled successors suffice. Instrumentation disturbance and replay failure
      weaken causality.
