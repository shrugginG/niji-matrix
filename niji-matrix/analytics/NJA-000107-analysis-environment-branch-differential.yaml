schema_version: 2.0.0
type: detection-analytic
id: NJA-000107
strategy_ref: DET-000119
name:
  zh: 系统指纹环境—行为差分
  en: System-Fingerprint Environment–Behavior Differential
summary:
  zh: 输出环境检查与沙箱和真实条件下后继行为差异之间的关系。
  en: Produce relationships between environment checks and successor-behavior differences under sandbox and real conditions.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 按样本记录硬件、固件、虚拟设备、驱动、进程、服务、文件和分析产品查询，在裸机、多个 VM 模板及逐项移除工件的环境重执行。特征组合命中后样本退出或保留载荷，而移除该组合或在真实型环境出现核心解码、子进程或网络时，输出 system_fingerprint_analysis_classification。
    en: Record hardware, firmware, virtual-device, driver, process, service, file, and analysis-product queries by sample and rerun on bare metal, several VM templates, and environments with artifacts removed one at a time. Emit system_fingerprint_analysis_classification when the sample exits or withholds a payload after a feature combination matches while removing the combination or using a real-like environment produces core decoding, child processes, or networking.
data_requirements:
- source_type: sandbox-environment-and-outcome
  name:
    zh: 沙箱环境与结果
    en: Sandbox environment and outcome
  channel: null
  required_fields:
  - event.timestamp
  - sample.hash
  - environment.id
  - environment.feature
  - environment.feature_set_hash
  - operation
  - branch.id
  - process.outcome
  - payload.stage
  - network.destination
observables:
- zh: 环境检查后在沙箱退出而在真实型环境释放载荷
  en: The sample exits in a sandbox after checks but releases a payload in a real-like environment
correlation:
  window:
    zh: 覆盖每次样本运行完整寿命，并比较至少两个环境结果。
    en: Cover the complete lifetime of each sample run and compare outcomes from at least two environments.
  dimensions:
  - sample.hash
  - environment.id
  - environment.feature
  - branch.id
  - payload.stage
false_positives:
- zh: 合法许可、硬件适配、性能优化、测试模式和虚拟机兼容性
  en: Legitimate licensing, hardware adaptation, performance optimization, test modes, and virtual-machine compatibility
blind_spots:
- zh: 样本需要真实外部事件、环境仿真不完整或无法重复执行
  en: Sample requires a real external event, environment emulation is incomplete, or re-execution is unavailable
tuning_guidance:
  paragraphs:
  - zh: 逐次只改变少量环境变量，保持网络和时间一致，并以核心行为差分而非查询本身评分。合法兼容性分支按签名与产品基线。
    en: Change only a small number of environment variables per run, keep networking and time consistent, and score core-behavior
      differential rather than the query alone. Baseline legitimate compatibility branches by signing and product.
evidence_refs:
- REF-000410
- REF-000443
- REF-000444
lifecycle:
  status: review
  version: 0.2.0
