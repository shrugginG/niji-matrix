observables:
- zh: 同样本已读取的系统特征、经核验的条件数据流与受控特征变体后早退或部署差分。
  en: Same-sample system-feature reads, verified condition dataflow, and exit or deployment differentials following controlled
    feature variants.
correlation:
  window:
    zh: 覆盖同样本基线和变体的完整预定预算并重复，保留主动结束、超时、采集终止和未能重现状态，不声称观察未知完整寿命。
    en: Cover the full declared budget of same-sample baseline and variant runs and repeat them, retaining exit, timeout,
      capture termination, and reproduction failure rather than claiming an unknown full lifetime.
  dimensions:
  - experiment.id
  - run.pair_id
  - run.id
  - sample.sha256
  - sample.entry_sha256
  - process.key
  - call.module_sha256
  - call.rva
  - environment.feature_set_sha256
false_positives:
- zh: 合法兼容性、许可、反作弊、性能及虚拟化适配会依特征选择路径，仍需后继目的与恶意上下文。
  en: Compatibility, licensing, anti-cheat, performance, and virtualization adaptation select feature-dependent paths and
    require successor purpose and malicious context.
blind_spots:
- zh: 未插桩接口、截断返回、模块映射失败、无法解释的操作数、特征共变、外部依赖不能重放或样本识别插桩，使实验不完整或只能保留候选。
  en: Uninstrumented interfaces, truncated returns, failed module maps, unexplained operands, co-varying features, unreplayable
    dependencies, or detected instrumentation leave incomplete experiments or candidates.
tuning_guidance:
  paragraphs:
  - zh: 先验证查询适配、条件审阅、工件归因和健康，再重复单变量实验。裸机与VM整体对照只作探索，不把全部差异归因单个工件；产品基线解释兼容性，不按签名一概抑制差分。
    en: Validate query adapters, condition reviews, artifact attribution, and health before repeated single-variable experiments.
      Whole bare-metal/VM comparisons are exploratory, without attributing all differences to one artifact. Product baselines
      contextualize compatibility without suppressing every signed differential.
