schema_version: 2.0.0
type: detection-analytic
id: NJA-000112
strategy_ref: DET-000126
name:
  zh: 操作关系前态与拆除主体关联
  en: Operational-Relationship Prior State and Teardown-Principal Correlation
summary:
  zh: 输出曾被攻击活动使用、随后由未批准主体拆除的关系边。
  en: Produce relation edges previously used by attack activity and later torn down by an unapproved principal.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- Network Devices
- SaaS
logic:
  paragraphs:
  - zh: 为共享映射、网络会话、路由或持久化注册生成稳定 relation.id，记录两端主体、建立者、认证、实际数据或执行用途、配置版本和拆除动作。若关系承载可疑传输、横向移动或启动后，被未批准主体拆除且远端或历史仍证明前态，则输出 operational_relationship_teardown。
    en: Generate a stable relation.id for share mappings, network sessions, routes, or persistence registrations and record
      both endpoint subjects, creator, authentication, actual data or execution use, configuration version, and teardown action.
      Emit operational_relationship_teardown when a relationship carries suspicious transfer, lateral movement, or startup,
      is then removed by an unapproved principal, and remote or historical state still proves its prior existence.
data_requirements:
- source_type: operational-relationship-lifecycle
  name:
    zh: 操作关系生命周期
    en: Operational relationship lifecycle
  channel: null
  required_fields:
  - event.timestamp
  - relation.id
  - relation.type
  - source.subject_id
  - target.subject_id
  - creator.id
  - authentication.id
  - use.action
  - teardown.actor_id
  - teardown.operation
  - approval.id
- source_type: remote-or-versioned-relation-state
  name:
    zh: 远端或版本化关系状态
    en: Remote or versioned relation state
  channel: null
  required_fields:
  - event.timestamp
  - relation.id
  - configuration.version
  - remote.endpoint_id
  - remote.session_state
  - prior.use_hash
observables:
- zh: 外传完成后暂存共享立即被攻击者账户断开
  en: A staging share is detached by the adversary account immediately after exfiltration
- zh: 持久化已触发后关系被删除但载荷或新实例继续运行
  en: A persistence relation is deleted after activation while the payload or a new instance continues
correlation:
  window:
    zh: 覆盖关系建立、最后一次可疑使用和拆除；动态会话按服务器与客户端保留语义，持久配置按版本历史保留语义设置并记录具体上限。
    en: Cover relation establishment, last suspicious use, and teardown. Set and record the concrete upper bound from server
      and client retention semantics for dynamic sessions and configuration-version history for durable state.
  dimensions:
  - relation.id
  - relation.type
  - source.subject_id
  - target.subject_id
  - creator.id
  - teardown.actor_id
  - authentication.id
false_positives:
- zh: 正常注销、共享维护、凭据轮换、软件卸载、故障转移和事件响应撤销
  en: Normal logout, share maintenance, credential rotation, software uninstall, failover, and incident-response revocation
blind_spots:
- zh: 只保留当前关系、服务器端日志不可用、客户端与远端无法共享 ID 或动态关系未审计
  en: Only current relations retained, server-side logging unavailable, client and remote sides cannot share identity, or
    dynamic relations are not audited
tuning_guidance:
  paragraphs:
  - zh: 按关系类型、业务主体、维护窗口和正常关闭原因建立生命周期基线。严重度要求先前可疑用途、未批准拆除和远端或历史证据组合，不对每个断开或删除配置告警。
    en: Baseline lifecycle by relation type, business principal, maintenance window, and normal closure reason. Require prior
      suspicious use, unapproved teardown, and remote or historical evidence together for severity rather than alert on every
      disconnect or configuration deletion.
evidence_refs:
- REF-000397
- REF-000426
