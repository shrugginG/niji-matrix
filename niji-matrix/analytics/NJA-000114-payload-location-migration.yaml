schema_version: 2.0.0
type: detection-analytic
id: NJA-000114
strategy_ref: DET-000128
name:
  zh: 内容身份跨位置迁移与消费分析
  en: Content-Identity Cross-Location Migration and Consumption Analytic
summary:
  zh: 输出同一可疑内容从初始路径迁移到新路径并由新消费者使用的谱系。
  en: Produce lineage where the same suspicious content migrates from an initial path into a new path and is used by a new
    consumer.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- Network Devices
logic:
  paragraphs:
  - zh: 按内容摘要或模糊内容身份连接下载/初始创建、复制、移动、重命名、目标写入、旧路径删除、配置引用和新路径首次加载。若可疑内容从临时或告警路径迁入系统、排除或持久化位置并切换消费者，且无批准安装或更新事务，则输出 payload_location_migration。
    en: By content digest or fuzzy content identity, join download or initial creation, copy, move, rename, destination write,
      old-path deletion, configuration reference, and first load from the new path. Emit payload_location_migration when suspicious
      content moves from a temporary or alerted path into a system, excluded, or persistence location and switches consumer
      without an approved install or update transaction.
data_requirements:
- source_type: file-location-lineage
  name:
    zh: 文件位置与内容谱系
    en: File location and content lineage
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - actor.start_key
  - source.path
  - source.file_id
  - source.content_hash
  - operation
  - destination.path
  - destination.file_id
  - destination.content_hash
  - approval.id
- source_type: payload-consumption
  name:
    zh: 载荷配置引用与消费
    en: Payload configuration reference and consumption
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - destination.path
  - destination.content_hash
  - consumer.start_key
  - consumer.action
  - configuration.object_id
  - source.deleted
observables:
- zh: 同一摘要从临时目录复制到系统目录，旧副本删除后新路径被服务加载
  en: The same digest moves from a temporary directory to a system directory and a service loads the new path after old-copy deletion
- zh: 初始告警路径消失而排除目录中出现相同内容及持久化引用
  en: The initially alerted path disappears while the same content and a persistence reference appear in an excluded directory
correlation:
  window:
    zh: 覆盖初始创建、迁移、旧路径清理到新位置首次消费；具体上限依据下载遥测、文件事件和持久化配置版本保留策略记录。
    en: Cover initial creation, migration, old-path cleanup, and first consumption from the new location. Record the concrete
      upper bound from download telemetry, file-event, and persistence-configuration version retention.
  dimensions:
  - asset.id
  - source.file_id
  - source.content_hash
  - destination.file_id
  - destination.content_hash
  - actor.start_key
  - consumer.start_key
false_positives:
- zh: 软件安装与更新、浏览器下载提升、包管理、备份还原、缓存推广和用户移动文件
  en: Software installation and update, browser download promotion, package management, backup restore, cache promotion, and
    user file movement
blind_spots:
- zh: 内容在迁移中重写或重新打包、摘要未采集、跨主机复制缺少共同身份或新位置消费不可见
  en: Content is rewritten or repacked during migration, digests are not collected, cross-host copies lack common identity,
    or consumption from the new location is invisible
tuning_guidance:
  paragraphs:
  - zh: 按签名安装器、包事务、软件分发账户和目标目录建立批准迁移基线。严重度要求可疑来源、内容连续性、新位置消费及旧路径清理组合，不按系统目录写入或文件移动单独告警。
    en: Baseline approved migration by signed installer, package transaction, software-distribution account, and destination
      directory. Require suspicious origin, content continuity, new-location consumption, and old-path cleanup together for
      severity rather than alert on a system-directory write or file move alone.
evidence_refs:
- REF-000397
- REF-000427
