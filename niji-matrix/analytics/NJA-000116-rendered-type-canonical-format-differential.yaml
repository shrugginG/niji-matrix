schema_version: 2.0.0
type: detection-analytic
id: NJA-000116
strategy_ref: DET-000111
name:
  zh: 渲染类型—规范格式差分
  en: Rendered-Type–Canonical-Format Differential
summary:
  zh: 输出用户界面呈现的低风险类型与原始文件名、格式头和实际执行类型不一致的对象。
  en: Produce objects whose low-risk user-interface presentation differs from raw filename, format header, and actual execution type.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 保留文件名原始字节与 Unicode code point，展开完整扩展链、方向与空白控制字符、图标来源、MIME、文件头和归档成员，并记录用户所见渲染与启动结果。当界面呈现为文档、图像或媒体而规范解析为可执行或脚本，且对象随后启动代码时，输出 user_visible_type_spoofing。
    en: Preserve raw filename bytes and Unicode code points; expand the complete extension chain, direction and whitespace controls, icon source, MIME, file header, and archive members; and record user-visible rendering and launch outcome. Emit user_visible_type_spoofing when the interface presents a document, image, or media object while canonical parsing identifies an executable or script and the object subsequently launches code.
data_requirements:
- source_type: file-presentation-and-execution
  name:
    zh: 文件呈现、规范格式与执行结果
    en: File presentation, canonical format, and execution outcome
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - file.id
  - file.name_raw
  - file.name_rendered
  - file.extension_chain
  - file.header_type
  - file.mime_type
  - file.icon_source
  - archive.id
  - process.start_key
  - process.image
observables:
- zh: 渲染名称和图标表示媒体文件，但完整扩展和文件头表示可执行文件
  en: Rendered name and icon indicate media while the full extension and file header indicate an executable
- zh: 文件名含方向、不可见或长空白字符，且用户交互后产生进程
  en: Filename contains direction, invisible, or long whitespace characters and produces a process after user interaction
correlation:
  window:
    zh: 覆盖下载或归档展开、用户查看到首次启动；具体期限依据下载保留、交互审计和邮件沙箱生命周期设定。
    en: Cover download or archive extraction, user viewing, and first launch. Set the concrete limit from download retention, interaction auditing, and mail-sandbox lifecycle.
  dimensions:
  - asset.id
  - file.id
  - archive.id
  - process.start_key
false_positives:
- zh: 合法多扩展数据、开发工件、容器格式、主题图标和跨平台文件名
  en: Legitimate multi-extension data, development artifacts, container formats, themed icons, and cross-platform filenames
blind_spots:
- zh: 只保留渲染名称、归档未展开、文件头未检查或用户启动事件缺失
  en: Only the rendered name is retained, archives are not expanded, headers are not inspected, or user-launch events are missing
tuning_guidance:
  paragraphs:
  - zh: 按文件来源、签名、格式和业务工具建立允许组合，并显示和记录完整扩展及控制字符。严重度依赖呈现—格式差分与实际代码启动，不按双扩展或 Unicode 字符单独定性。
    en: Baseline allowed combinations by file origin, signing, format, and business tool and display and retain complete extensions and control characters. Base severity on presentation-to-format divergence plus actual code launch rather than a double extension or Unicode character alone.
evidence_refs:
- REF-000399
- REF-000430
