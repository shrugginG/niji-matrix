schema_version: 2.0.0
type: detection-analytic
id: NJA-000118
strategy_ref: DET-000111
name:
  zh: 客户端指纹—进程—会话差分
  en: Client-Fingerprint–Process–Session Differential
summary:
  zh: 输出请求声称的浏览器或系统指纹与实际发起进程、GUI 会话和完整协议指纹不一致的实例。
  en: Produce instances where a request's claimed browser or system fingerprint differs from its originating process, GUI session, and complete protocol fingerprint.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 将 HTTP User-Agent、头组合、TLS 指纹、平台与语言属性连接到端点 socket、进程 start key、默认浏览器清单、登录用户与 GUI 会话。非浏览器或后台进程复用已安装浏览器字符串，但 TLS/HTTP 组合、目标、时序或会话状态不一致并产生可疑通信时，输出 client_fingerprint_emulation。
    en: Join HTTP User-Agent, header set, TLS fingerprint, platform, and language attributes to endpoint socket, process start key, default-browser inventory, logged-on user, and GUI session. Emit client_fingerprint_emulation when a non-browser or background process reuses an installed-browser string while TLS and HTTP composition, destination, timing, or session state differs and produces suspicious communication.
data_requirements:
- source_type: endpoint-network-client-lineage
  name:
    zh: 端点网络客户端谱系
    en: Endpoint network-client lineage
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - network.connection_id
  - network.destination
  - process.start_key
  - process.image
  - user.session_id
  - gui.session_active
  - http.user_agent
  - http.header_fingerprint
  - tls.client_fingerprint
  - browser.inventory
observables:
- zh: 后台或非浏览器进程发送与本机默认浏览器完全相同的 User-Agent
  en: A background or non-browser process sends the exact User-Agent of the host's default browser
- zh: User-Agent 声称某浏览器，但 TLS、头顺序或真实用户会话与该浏览器基线冲突
  en: User-Agent claims a browser while TLS, header ordering, or the real user session conflicts with that browser baseline
correlation:
  window:
    zh: 覆盖一次客户端进程和网络会话，并按浏览器版本与端点清单变更保存基线；具体期限依据连接、代理和资产清单保留设定。
    en: Cover one client process and network session and retain baselines across browser-version and endpoint-inventory changes. Set the concrete limit from connection, proxy, and asset-inventory retention.
  dimensions:
  - asset.id
  - network.connection_id
  - process.start_key
  - user.session_id
  - network.destination
  - http.user_agent
false_positives:
- zh: 合法代理、兼容性客户端、隐私浏览器、自动化测试、WebView 与嵌入式浏览组件
  en: Legitimate proxies, compatibility clients, privacy browsers, automated testing, WebViews, and embedded browser components
blind_spots:
- zh: 代理终止 TLS、端点 socket 不可归因、服务端头不可见或 GUI 会话未记录
  en: Proxies terminate TLS, endpoint sockets cannot be attributed, server-side headers are unavailable, or GUI sessions are not recorded
tuning_guidance:
  paragraphs:
  - zh: 按进程角色、浏览器版本、代理路径和嵌入组件建立多字段基线。严重度依赖非预期进程、多层指纹矛盾、异常目标和会话缺失，不按一个 User-Agent 字符串定性。
    en: Build multi-field baselines by process role, browser version, proxy path, and embedded component. Base severity on an unexpected process, cross-layer fingerprint conflicts, anomalous destination, and missing user session rather than one User-Agent string.
evidence_refs:
- REF-000399
- REF-000431
