schema_version: 2.0.0
type: detection-analytic
id: NJA-000119
strategy_ref: DET-000112
name:
  zh: 静态特征—功能语义等价
  en: Static-Feature–Functional-Semantic Equivalence
summary:
  zh: 输出静态结构和统计特征大幅变化但规范化语义、运行 API 与恶意结果保持等价的样本。
  en: Produce samples whose static structure and statistical features change materially while normalized semantics, runtime APIs, and malicious outcomes remain equivalent.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 对样本提取控制流图、基本块、指令类别、导入、符号、节区、长度和统计特征，记录反汇编失败与垃圾区域，并转换为规范化中间表示。跨原始样本、变体、去混淆结果和动态运行比较功能 API、数据流与结果；静态距离大而语义和恶意结果收敛时输出 static_feature_space_distortion。
    en: Extract control-flow graph, basic blocks, instruction classes, imports, symbols, sections, length, and statistical features from a sample; record disassembly failures and junk regions; and convert the sample to a normalized intermediate representation. Compare functional APIs, data flow, and outcomes across original samples, variants, deobfuscated results, and dynamic runs. Emit static_feature_space_distortion when static distance is large while semantics and malicious outcomes converge.
data_requirements:
- source_type: static-semantic-and-dynamic-sample-analysis
  name:
    zh: 静态特征、语义归一与动态样本分析
    en: Static features, semantic normalization, and dynamic sample analysis
  channel: null
  required_fields:
  - sample.hash
  - build.family_id
  - control_flow.graph_hash
  - instruction.class_profile
  - import.set
  - section.profile
  - file.size
  - disassembly.failure
  - normalized_ir.hash
  - runtime.api_sequence
  - behavior.outcome
observables:
- zh: 同一家族样本的字节、控制流和导入差异很大，但规范化语义与运行结果收敛
  en: Samples from one family differ greatly in bytes, control flow, and imports while normalized semantics and runtime outcomes converge
- zh: 去混淆器移除 dispatcher、垃圾块或指令变异后得到可运行的功能等价文件
  en: A deobfuscator removes dispatchers, junk blocks, or instruction mutations and produces a runnable functionally equivalent file
correlation:
  window:
    zh: 覆盖一次静态分析、去混淆与受控运行，并在样本家族保留周期内比较变体；具体期限依据样本库和分析资源设定。
    en: Cover one static-analysis, deobfuscation, and controlled-run cycle and compare variants across the sample-family retention period. Set the concrete limit from sample repository and analysis resources.
  dimensions:
  - sample.hash
  - build.family_id
  - normalized_ir.hash
  - runtime.api_sequence
  - behavior.outcome
false_positives:
- zh: 编译器优化、不同构建配置、发布符号剥离、性能填充和合法软件保护
  en: Compiler optimization, different build configurations, release-symbol stripping, performance padding, and legitimate software protection
blind_spots:
- zh: 自修改代码未展开、输入覆盖不足、反汇编完全失败或只有一个样本
  en: Self-modifying code is not expanded, input coverage is insufficient, disassembly fails completely, or only one sample is available
tuning_guidance:
  paragraphs:
  - zh: 按发布者、构建链和软件家族建立合法差异基线，并组合规范化语义、运行结果与去混淆证据。严重度不依赖一个复杂度或文件大小阈值。
    en: Baseline legitimate variation by publisher, build chain, and software family and combine normalized semantics, runtime outcomes, and deobfuscation evidence. Do not base severity on one complexity or file-size threshold.
evidence_refs:
- REF-000400
- REF-000432
