schema_version: 2.0.0
type: detection-analytic
id: NJA-000120
strategy_ref: DET-000112
name:
  zh: 外层载体—内层载荷谱系
  en: Outer-Carrier–Inner-Payload Lineage
summary:
  zh: 输出良性外层格式、提取步骤、内层内容摘要与后继执行之间的链条。
  en: Produce the chain among a benign outer format, extraction step, inner-content digest, and successor execution.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 保存图像、文档、HTML、SVG、快捷方式或非文件值的原始摘要和结构清单，使用格式专属解析器递归提取流、像素位、元数据、脚本 blob、图标和对象字段，并为每个内层对象记录偏移、摘要与提取器。内层内容恢复可执行语义且被进程或脚本消费并产生敏感结果时，输出 carrier_embedded_payload_concealment。
    en: Preserve original digest and structural inventory for images, documents, HTML, SVG, shortcuts, or non-file values. Recursively extract streams, pixel bits, metadata, script blobs, icons, and object fields with format-specific parsers and record offset, digest, and extractor for each inner object. Emit carrier_embedded_payload_concealment when inner content recovers executable semantics, is consumed by a process or script, and produces a sensitive outcome.
data_requirements:
- source_type: carrier-structure-extraction-and-runtime
  name:
    zh: 载体结构、提取与运行结果
    en: Carrier structure, extraction, and runtime outcome
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - carrier.id
  - carrier.hash
  - carrier.format
  - carrier.structure
  - embedded.offset
  - extracted.hash
  - extractor.process_start_key
  - consumer.process_start_key
  - successor.action
observables:
- zh: 图像或文档解析后产生静态扫描未列出的可执行内层对象
  en: Parsing an image or document produces an executable inner object absent from static inventory
- zh: 脚本或后门读取载体字段并把提取缓冲区作为代码、命令或配置消费
  en: A script or backdoor reads a carrier field and consumes the extracted buffer as code, command, or configuration
correlation:
  window:
    zh: 覆盖载体取得、解析、内层对象创建到首次消费；具体期限依据载体保留、沙箱寿命和对象活动 ID 设定。
    en: Cover carrier acquisition, parsing, inner-object creation, and first consumption. Set the concrete limit from carrier retention, sandbox lifetime, and object activity identities.
  dimensions:
  - asset.id
  - carrier.id
  - carrier.hash
  - extracted.hash
  - extractor.process_start_key
  - consumer.process_start_key
false_positives:
- zh: 合法媒体元数据、文档附件、网页内联资源、软件缓存和配置数据库
  en: Legitimate media metadata, document attachments, inlined web resources, software caches, and configuration databases
blind_spots:
- zh: 专有格式无解析器、内层加密、资源炸弹中止递归或非文件存储未采集
  en: Proprietary format lacks a parser, inner content is encrypted, a resource bomb stops recursion, or non-file storage is not collected
tuning_guidance:
  paragraphs:
  - zh: 按载体格式、发布者、结构和业务用途建立合法内嵌基线，限制解析资源但记录失败层。严重度依赖内层可执行语义、消费进程和恶意结果，不按异常元数据或格式单独定性。
    en: Baseline legitimate embedding by carrier format, publisher, structure, and business purpose, limit parsing resources while retaining failed layers, and base severity on executable inner semantics, consuming process, and malicious outcome rather than anomalous metadata or format alone.
evidence_refs:
- REF-000400
- REF-000431
