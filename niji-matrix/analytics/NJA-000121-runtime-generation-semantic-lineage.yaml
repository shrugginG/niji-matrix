schema_version: 2.0.0
type: detection-analytic
id: NJA-000121
strategy_ref: DET-000112
name:
  zh: 运行时生成—语义结果谱系
  en: Runtime-Generation–Semantic-Outcome Lineage
summary:
  zh: 输出源码、哈希或生成规则到运行时解析、生成内容和后继调用之间的链条。
  en: Produce the chain from source, hashes, or generation rules through runtime resolution, generated content, and successor calls.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 监控脚本宿主与编译器启动、模块导出遍历、哈希比较、动态解析、反射、内存写入和权限变化，并记录生成输入、候选解析、输出摘要或目标地址。静态对象缺少最终调用或代码，而运行时从攻击者控制输入物化可执行语义并产生敏感结果时，输出 runtime_semantic_materialization。
    en: Monitor script-host and compiler starts, module-export traversal, hash comparisons, dynamic resolution, reflection, memory writes, and permission changes and record generation input, resolution candidates, output digest, or target address. Emit runtime_semantic_materialization when the static object lacks final calls or code while runtime activity materializes executable semantics from adversary-controlled input and produces a sensitive outcome.
data_requirements:
- source_type: runtime-code-generation-and-resolution
  name:
    zh: 运行时代码生成与解析
    en: Runtime code generation and resolution
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - process.start_key
  - input.object_hash
  - compiler.image
  - compiler.arguments_hash
  - module.name
  - export.name_hash
  - resolved.address
  - generated.content_hash
  - memory.protection
  - successor.action
observables:
- zh: 进程遍历模块导出并以名称哈希解析静态导入中缺失的 API
  en: A process walks module exports and resolves APIs absent from static imports through name hashes
- zh: 外部取得的源码或模板由脚本宿主启动编译器并立即执行生成对象
  en: A script host starts a compiler for externally obtained source or a template and immediately executes the generated object
correlation:
  window:
    zh: 覆盖一次进程运行中的生成或解析事件和首次使用，并将投递对象连接到生成结果；具体期限依据进程寿命、编译缓存与内存遥测保留设定。
    en: Cover generation or resolution and first use within one process run and join the delivered object to the generated result. Set the concrete limit from process lifetime, compiler cache, and memory-telemetry retention.
  dimensions:
  - asset.id
  - process.start_key
  - input.object_hash
  - module.name
  - export.name_hash
  - generated.content_hash
false_positives:
- zh: 合法 JIT、软件构建、插件发现、反射框架、兼容性动态链接和安全产品插桩
  en: Legitimate JIT, software builds, plug-in discovery, reflection frameworks, compatibility dynamic linking, and security-product instrumentation
blind_spots:
- zh: 解析发生在内核或硬件、短暂代码未采样、编译器遥测缺失或地址无法映射调用
  en: Resolution occurs in kernel or hardware, transient code is not sampled, compiler telemetry is missing, or addresses cannot be mapped to calls
tuning_guidance:
  paragraphs:
  - zh: 按进程角色、签名、构建目录和批准开发工作建立合法生成基线。严重度依赖外部或攻击者控制输入、静态语义缺失、运行时新结果与敏感后继动作，不按动态 API 或编译器使用单独定性。
    en: Baseline legitimate generation by process role, signing, build directory, and approved development work. Base severity on external or adversary-controlled input, absent static semantics, a new runtime result, and a sensitive successor action rather than dynamic APIs or compiler use alone.
evidence_refs:
- REF-000400
- REF-000224
