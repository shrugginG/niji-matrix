schema_version: 2.0.0
type: detection-analytic
id: NJA-000122
strategy_ref: DET-000113
name:
  zh: 查询背衬结构—对象存在性不变量
  en: Query-Backing Structure–Object-Existence Invariant
summary:
  zh: 输出查询背衬链或元数据与独立线程、句柄、原始存储或网络事实不一致的仍活动对象。
  en: Produce active objects whose query-backing list or metadata conflicts with independent thread, handle, raw-storage, or network facts.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- Network Devices
logic:
  paragraphs:
  - zh: 从可信内存、hypervisor 或离线快照解析进程线程、句柄、地址空间、socket、文件系统与 Registry 原始结构，同时解析供正常查询使用的活动链、缓存和值元数据。验证双向链、引用计数、对象归属、值长度与类型不变量；真实功能证据持续存在而查询背衬遗漏对象或报告矛盾属性，且结构写入不能由正常生命周期解释时，输出 query_backing_state_detachment。
    en: Parse process threads, handles, address spaces, sockets, file-system structures, and raw Registry structures from trusted memory, hypervisor, or offline snapshots while also parsing active lists, caches, and value metadata used by normal queries. Validate bidirectional lists, reference counts, object ownership, value length, and type invariants. Emit query_backing_state_detachment when real functional evidence persists while query backing omits the object or reports conflicting attributes and the structure write cannot be explained by normal lifecycle.
data_requirements:
- source_type: trusted-memory-and-raw-state
  name:
    zh: 可信内存、原始存储与查询背衬状态
    en: Trusted memory, raw storage, and query-backing state
  channel: null
  required_fields:
  - event.timestamp
  - asset.id
  - snapshot.id
  - object.id
  - object.type
  - backing_structure.id
  - backing_structure.members
  - backing_structure.invariant_result
  - raw_value.length
  - raw_value.type
  - api_value.length
  - api_value.type
  - thread.id
  - handle.id
  - memory.region
  - network.endpoint
  - structure_writer.id
observables:
- zh: 进程不在活动枚举链中但其线程、句柄和地址空间仍活动
  en: A process is absent from the active enumeration list while its threads, handles, and address space remain active
- zh: Registry API 报告的值长度或类型与原始 hive 结构不一致
  en: Registry API value length or type conflicts with the raw hive structure
correlation:
  window:
    zh: 使用一次稳定或近原子的快照完成结构与对象对齐，并在相邻快照验证差分持续；具体期限依据对象生命周期、快照能力和内存取证保留设定。
    en: Use one stable or near-atomic snapshot for structure-to-object alignment and verify persistence of the differential in adjacent snapshots. Set the concrete limit from object lifetime, snapshot capability, and memory-forensics retention.
  dimensions:
  - asset.id
  - snapshot.id
  - object.id
  - object.type
  - backing_structure.id
  - structure_writer.id
false_positives:
- zh: 正常对象创建或回收竞态、崩溃转储不一致、Registry 事务、文件系统恢复和安全产品影子结构
  en: Normal object creation or reclamation races, inconsistent crash dumps, Registry transactions, file-system recovery, and security-product shadow structures
blind_spots:
- zh: 无可信内存或原始存储视图、符号和类型信息错误、攻击者同时控制 hypervisor 或对象仅短暂脱钩
  en: No trusted memory or raw-storage view, incorrect symbols and type information, adversary control of the hypervisor, or only transient detachment
tuning_guidance:
  paragraphs:
  - zh: 按内核和文件系统版本加载正确符号与类型，要求重复或多事实源差分，并为合法过滤驱动和安全产品维护结构例外。严重度依赖持续功能对象、结构不变量失败、未知写入者和恶意后继行为，不按一个链表断点告警。
    en: Load correct symbols and types by kernel and file-system version, require repeated or multi-source differentials, and maintain structure exceptions for legitimate filter drivers and security products. Base severity on a persistent functional object, failed structural invariant, unknown writer, and malicious successor behavior rather than one list break.
evidence_refs:
- REF-000309
- REF-000401
