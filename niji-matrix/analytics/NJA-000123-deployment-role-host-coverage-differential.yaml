schema_version: 2.0.0
type: detection-analytic
id: NJA-000123
strategy_ref: DET-000114
name:
  zh: 部署范围—角色—整机结果差分
  en: Deployment-Scope–Role–Whole-Host Outcome Differential
summary:
  zh: 输出同一载荷在角色关键主机上退出而在其他同批资产完成破坏的跨主机链条。
  en: Produce a cross-host chain where the same payload exits on role-critical hosts while completing destruction on other peer assets.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 从 GPO、软件部署、远程执行、共享路径或编排记录建立同一任务与载荷摘要的目标资产集合，连接 CMDB/目录角色、主机查询、进程启动、退出码、文件操作和可用性。相同载荷在域控制器或其他角色关键资产上执行角色查询后稳定退出，但在同批普通资产上进入加密、擦除或篡改并产生影响时，输出 role_conditioned_host_preservation。
    en: Build the target-asset set for one task and payload digest from GPO, software deployment, remote execution, shared-path, or orchestration records and join CMDB or directory role, host query, process start, exit code, file operations, and availability. Emit role_conditioned_host_preservation when the same payload consistently exits after a role query on domain controllers or other role-critical assets but enters encryption, wiping, or tampering and produces impact on ordinary peer assets in the same wave.
data_requirements:
- source_type: fleet-deployment-role-and-impact
  name:
    zh: 批量部署、资产角色与跨主机影响
    en: Fleet deployment, asset role, and cross-host impact
  channel: null
  required_fields:
  - event.timestamp
  - deployment.id
  - deployment.source_asset_id
  - asset.id
  - asset.role
  - asset.group
  - payload.hash
  - process.start_key
  - role_query.result
  - process.exit_code
  - destructive_action.count
  - system.availability
  - outcome
observables:
- zh: 同一 GPO 或部署任务在普通成员主机产生破坏，而域控制器上的相同载荷查询角色后退出
  en: One GPO or deployment task produces destruction on ordinary member hosts while the same payload exits after a role query on domain controllers
- zh: 未受影响主机按关键角色聚集，而非按网络不可达、版本或部署组随机分布
  en: Unaffected hosts cluster by critical role rather than network reachability, version, or deployment group
correlation:
  window:
    zh: 覆盖同一部署波次、所有目标主机的启动或失败结果以及首个破坏结果；具体期限依据 GPO/编排传播、离线主机重试和资产日志保留设定。
    en: Cover one deployment wave, launch or failure results for every target host, and the first destructive outcome. Set the concrete limit from GPO or orchestration propagation, offline-host retry, and asset-log retention.
  dimensions:
  - deployment.id
  - deployment.source_asset_id
  - asset.id
  - asset.role
  - asset.group
  - payload.hash
false_positives:
- zh: 分阶段发布、维护窗口、组策略安全筛选、角色兼容性限制、离线或不可达资产和合法高价值资产保护
  en: Staged rollout, maintenance windows, Group Policy security filtering, role compatibility limits, offline or unreachable assets, and legitimate high-value-asset protection
blind_spots:
- zh: 部署目标清单缺失、CMDB 角色陈旧、失败主机无进程日志或载荷在每台主机生成不同摘要
  en: Missing deployment target inventory, stale CMDB roles, no process logs on failed hosts, or per-host payloads with different digests
tuning_guidance:
  paragraphs:
  - zh: 按批准部署 ID、owner、资产组、版本兼容矩阵和维护窗口建立基线，并区分未到达、未启动、启动失败与角色条件退出。严重度依赖同一恶意载荷、重复角色查询、关键角色聚集差分和其他主机的确认破坏，不按单台未受影响资产告警。
    en: Baseline approved deployment identities, owners, asset groups, version-compatibility matrices, and maintenance windows and distinguish not reached, not launched, launch failure, and role-conditioned exit. Base severity on the same malicious payload, repeated role queries, clustering on critical roles, and confirmed destruction on peer hosts rather than one unaffected asset.
evidence_refs:
