schema_version: 2.0.0
type: detection-analytic
id: NJA-000125
strategy_ref: DET-000116
name: {zh: 文档引用—认证—披露结果谱系, en: Document Reference–Authentication–Disclosure Outcome Lineage}
summary: {zh: 输出外部文档关系、应用或用户认证、攻击者目标和后继凭据结果之间的链条。, en: Produce the chain among an external document relationship application or user authentication adversary target and successor credential outcome.}
domains: [enterprise]
platforms: [Windows, macOS]
logic:
  paragraphs:
  - zh: 解析文档关系与 URI，连接文档应用发起的 DNS/SMB/HTTP、认证协议与挑战、目标域/服务器、用户提示与输入、身份日志和后继凭据使用。外部不受信引用在打开时触发自动或交互认证，材料到达未批准目标或随后被用于访问时，输出 reference_induced_authentication；只取得远程代码而无认证结果交给响应—执行 Analytic。
    en: Parse document relationships and URIs and join document-application DNS, SMB, or HTTP, authentication protocol and challenge, target domain or server, user prompt and input, identity logs, and successor credential use. Emit reference_induced_authentication when an untrusted external reference triggers automatic or interactive authentication at open time and material reaches an unapproved target or is used for successor access. Retrieval of remote code without authentication outcome is handled by the response-to-execution analytic.
data_requirements:
- source_type: document-reference-and-authentication
  name: {zh: 文档外部关系与认证结果, en: Document external relationship and authentication outcome}
  channel: null
  required_fields: [event.timestamp, asset.id, user.id, document.hash, relationship.id, relationship.uri, process.start_key, network.destination, authentication.protocol, authentication.target, authentication.result, prompt.id, user.interaction, successor.identity_event]
observables:
- {zh: 文档打开后 Office 向未知外部 SMB/Web 目标认证或显示凭据提示, en: Office authenticates to or displays a credential prompt for an unknown external SMB or web target after document open}
- {zh: 外部模板请求后同一身份出现与请求目标关联的凭据使用, en: Credential use linked to the request target follows an external-template request for the same identity}
correlation:
  window: {zh: 覆盖一次文档关系解析、认证交互和直接后继身份结果；具体期限依据协议挑战、用户提示和身份日志保留设定。, en: Cover one document relationship resolution authentication interaction and direct successor identity outcome. Set the concrete limit from protocol challenge user prompt and identity-log retention.}
  dimensions: [asset.id, user.id, document.hash, relationship.id, process.start_key, network.destination, authentication.target]
false_positives:
- {zh: 合法企业模板认证、内部文件共享、代理登录、文档协作插件和测试凭据, en: Legitimate enterprise-template authentication internal file shares proxy sign-in document collaboration plug-ins and test credentials}
blind_spots:
- {zh: 自动认证不记录、外部个人设备、服务端不可见、认证提示遥测缺失或挑战被中继到另一系统, en: Unlogged automatic authentication external personal devices unavailable server-side visibility missing prompt telemetry or challenges relayed to another system}
tuning_guidance:
  paragraphs:
  - zh: 维护批准模板域、SMB 边界、认证协议和 owner，优先文档应用向互联网认证、相似域提示和后继身份使用。严重度以未批准目标与披露/使用结果为主，不按外部请求单独告警。
    en: Maintain approved template domains, SMB boundaries, authentication protocols, and owners and prioritize office-application authentication to the internet, lookalike-domain prompts, and successor identity use. Base severity on an unapproved target plus disclosure or use outcome rather than an external request alone.
evidence_refs: [REF-000407, REF-000439]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-21', modified: '2026-09-21', contributors: [Niji Matrix Research], reviewers: []}
