schema_version: 2.0.0
type: detection-analytic
id: NJA-000127
strategy_ref: DET-000118
name: {zh: 区域控制覆盖—活动结果差分, en: Region-Control Coverage–Activity Outcome Differential}
summary: {zh: 输出同一组织中控制覆盖较弱区域的主体活动、缺失遥测和恶意结果。, en: Produce principal activity missing telemetry and malicious outcomes in a less-controlled Region of the same organization.}
domains: [enterprise]
platforms: [IaaS]
logic:
  paragraphs:
  - zh: 按组织、账户、区域和服务构建日志、配置规则、威胁检测、网络流、策略与响应权限矩阵，并连接同一主体跨区域 API 和结果。主体从控制完整区域跳向覆盖较弱区域，目标服务缺少预期遥测/策略，且随后产生未授权调用、网络或数据结果时，输出 region_control_coverage_asymmetry。
    en: Build a matrix of logging, configuration rules, threat detection, network flow, policy, and responder authority by organization, account, Region, and service and join cross-Region APIs and outcomes for the same principal. Emit region_control_coverage_asymmetry when a principal moves from a fully controlled Region to a less-covered Region, expected telemetry or policy is absent for the target service, and unauthorized calls, networking, or data outcomes follow.
data_requirements:
- source_type: global-cloud-control-coverage
  name: {zh: 全局云控制覆盖与活动, en: Global cloud control coverage and activity}
  channel: null
  required_fields: [event.timestamp, organization.id, account.id, principal.id, session.id, region.id, service.id, action, logging.enabled, logging.delivery_status, configuration_rule.enabled, threat_detection.enabled, network_flow.enabled, policy.coverage, responder.authorized, outcome]
observables:
- {zh: 同一主体从主区域转向未启用威胁检测或网络流的次区域并继续调用服务, en: The same principal moves from a primary Region to a secondary Region without threat detection or network flow and continues service calls}
- {zh: 全局 API 显示资源活动但预期区域日志和响应权限缺失, en: Global APIs show resource activity while expected regional logs and responder authority are absent}
correlation:
  window: {zh: 覆盖一次跨区域身份会话、控制状态快照和直接服务结果，并持续验证日志交付健康；具体期限依据令牌和日志投递 SLA 设定。, en: Cover one cross-Region identity session control-state snapshot and direct service outcome and continuously verify log-delivery health. Set the concrete limit from token and log-delivery SLAs.}
  dimensions: [organization.id, account.id, principal.id, session.id, region.id, service.id]
false_positives: [{zh: 合法灾备、服务区域可用性差异、分阶段安全上线、合规限制和日志投递故障, en: Legitimate disaster recovery service-region availability differences staged security rollout compliance restrictions and log-delivery failures}]
blind_spots: [{zh: 服务无全局 API、控制状态清单不完整、跨分区隔离、日志健康不可观测或响应权限未集中, en: Services without global APIs incomplete control-state inventory cross-partition isolation unobservable log health or decentralized responder authority}]
tuning_guidance:
  paragraphs:
  - zh: 定义每个服务的最低区域控制基线和允许例外，区分不支持、未启用与交付失败。严重度依赖主体区域跳转、控制缺失和恶意结果，不按单个 disabled 标志定性。
    en: Define minimum regional control baselines and allowed exceptions for every service and distinguish unsupported, disabled, and delivery failure. Base severity on principal Region hopping, missing control, and malicious outcome rather than one disabled flag.
evidence_refs: [REF-000409, REF-000442]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-21', modified: '2026-09-21', contributors: [Niji Matrix Research], reviewers: []}
