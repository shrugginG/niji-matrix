observables:
- zh: 会话内已核验输入被样本读作经审阅的真实性条件，后继标记随受控活动稳定改变。
  en: Verified within-session input is read into a reviewed sample realism condition, with successor markers changing reproducibly
    under controlled activity.
correlation:
  window:
    zh: 覆盖同样本基线和变体的完整预定预算并重复，保留主动结束、超时、采集终止和未能重现状态，不声称观察未知完整寿命。
    en: Cover the full declared budget of same-sample baseline and variant runs and repeat them, retaining exit, timeout,
      capture termination, and reproduction failure rather than claiming an unknown full lifetime.
  dimensions:
  - experiment.id
  - run.pair_id
  - run.id
  - sample.sha256
  - sample.entry_sha256
  - process.key
  - call.module_sha256
  - call.rva
  - environment.feature_set_sha256
false_positives:
- zh: 交互安装、宏、辅助功能或安全确认可在输入后正常继续；活动相关本身不证明分析环境判断。
  en: Interactive installation, macros, accessibility, and security confirmation can legitimately continue after input; activity
    correlation alone does not establish analysis-environment judgment.
blind_spots:
- zh: 插入失败、错误会话/桌面、焦点漂移、安全桌面、动作或条件未核验、物理输入及非确定UI使无结果失去判定力；API未采集不等于未读取。
  en: Failed insertion, wrong session/desktop, focus drift, secure desktops, unverified actions or conditions, physical input,
    and nondeterministic UI invalidate absent-outcome conclusions; uncaptured APIs do not establish absent reads.
tuning_guidance:
  paragraphs:
  - zh: 围绕实际条件构造最小动作对照，仅在条件审阅证明样本比较节奏或位置时测试自然度。分别核验插入、目标动作和样本消费，保持文档、窗口、网络和时间一致，不把未采集键盘内容纳入评分。
    en: Build minimal action controls around actual conditions and test naturalness only when condition review establishes
      cadence/position comparisons. Separately verify insertion, target action, and sample consumption while holding document,
      window, network, and time constant; do not score uncaptured keystroke content.
