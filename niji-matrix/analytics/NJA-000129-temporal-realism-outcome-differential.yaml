schema_version: 2.0.0
type: detection-analytic
id: NJA-000129
strategy_ref: DET-000119
name: {zh: 时间真实性—载荷结果差分, en: Temporal-Realism–Payload Outcome Differential}
summary: {zh: 输出 uptime、多时钟、sleep 或指令耗时校验与原速/一致加速环境下核心结果的差分。, en: Produce differentials between uptime multi-clock sleep or instruction-timing checks and core outcomes under real-time or coherently accelerated environments.}
domains: [enterprise]
platforms: [Windows, Linux, macOS]
logic:
  paragraphs:
  - zh: 记录 uptime、墙钟、单调时钟、时间戳计数器、sleep 参数/返回和计算循环资源，并在短/长 uptime、原速、统一时间加速与不一致 hook 条件下重执行。低 uptime 或时钟不一致后样本退出/保留载荷，而真实或一致加速条件释放核心行为时，输出 temporal_realism_verification。
    en: Record uptime, wall clock, monotonic clock, timestamp counter, sleep arguments and returns, and computation-loop resources and rerun under short and long uptime, real time, coherent time acceleration, and inconsistent hook conditions. Emit temporal_realism_verification when a sample exits or withholds a payload after low uptime or clock inconsistency while real or coherently accelerated conditions release core behavior.
data_requirements:
- source_type: sandbox-clock-and-outcome
  name: {zh: 沙箱时间源、加速与载荷结果, en: Sandbox time sources acceleration and payload outcome}
  channel: null
  required_fields: [event.timestamp, sample.hash, environment.id, system.uptime, clock.wall, clock.monotonic, clock.tsc, sleep.requested, sleep.observed, loop.instructions, cpu.time, acceleration.mode, branch.id, payload.stage, outcome]
observables:
- {zh: 低系统运行时间触发退出，修改 uptime 后出现恶意例程, en: Low system uptime triggers exit and a malicious routine appears after uptime is changed}
- {zh: sleep 被跳过后多时钟差异触发保留载荷, en: Multiclock inconsistency after skipped sleep causes payload withholding}
correlation:
  window: {zh: 覆盖一次完整运行及原速/加速对照，并保留所有时间源的相对差；具体期限依据样本正常上限和资源预算设定。, en: Cover one complete run plus real-time and accelerated controls and retain relative differences among all time sources. Set the concrete limit from normal sample ceiling and resource budget.}
  dimensions: [sample.hash, environment.id, acceleration.mode, branch.id, payload.stage]
false_positives: [{zh: 合法许可、基准测试、性能校准、刚启动系统、低功耗恢复和时间同步故障, en: Legitimate licensing benchmarks performance calibration newly booted systems low-power resume and time-synchronization failures}]
blind_spots: [{zh: 硬件时钟不可控、外部时间源不可访问、样本需超长真实时间或行为非确定, en: Uncontrollable hardware clocks inaccessible external time sources samples requiring extremely long real time or nondeterministic behavior}]
tuning_guidance:
  paragraphs:
  - zh: 同时控制和记录墙钟、单调时钟、TSC、uptime 与 CPU，逐项改变而非只 hook sleep。严重度依赖时间证据、条件分支和恶意结果差分，不使用跨样本固定秒数阈值。
    en: Control and record wall clock, monotonic clock, TSC, uptime, and CPU together and vary them individually rather than hooking sleep alone. Base severity on timing evidence, conditional branch, and malicious-outcome differential rather than one fixed cross-sample threshold.
evidence_refs: [REF-000410, REF-000443, REF-000445]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-21', modified: '2026-09-21', contributors: [Niji Matrix Research], reviewers: []}
