schema_version: 2.0.0
type: detection-analytic
id: NJA-000162
strategy_ref: DET-000153
name:
  zh: 云秘密内容读取资源来源差分
  en: Cloud Secret Content-Read Resource-Origin Differential
summary:
  zh: 发现受信云角色读取其工作负载用途以外的秘密内容，并保留审计缺口与后继使用不明状态。
  en: Find trusted cloud roles reading secret contents outside their workload purpose while preserving audit gaps and unknown later use.
domains:
- enterprise
platforms:
- IaaS
logic:
  paragraphs:
  - zh: 分别从 AWS CloudTrail 的 GetSecretValue/BatchGetSecretValue、Google Secret Manager 的 AccessSecretVersion DATA_READ 和已启用的 Azure Key Vault SecretGet
      诊断事件，规范化账号或项目、调用主体、请求标识、secret 资源、来源、操作、结果与时间。List、Describe、GetSecret 元数据查询只输出 discovery，不算内容返回。先确认每个平台的读取日志已启用并被远程留存；Google Data Access
      缺失或 Azure 诊断未配置时输出 coverage_gap，而不是零读取。
    en: Normalize account or project, principal, request identifier, secret resource, origin, operation, result, and time from AWS CloudTrail
      GetSecretValue or BatchGetSecretValue, Google Secret Manager AccessSecretVersion DATA_READ, and enabled Azure Key Vault SecretGet diagnostics.
      List, Describe, and GetSecret metadata calls are discovery rather than content return. First verify that each platform's read logs are enabled
      and retained outside the workload; disabled Google Data Access or missing Azure diagnostics yields coverage_gap, not zero reads.
  - zh: 把主体映射到受批准工作负载、所需 secret 集合、部署区域与正常来源；在二十四小时窗口找首次敏感条目、跨业务资源扩展或同一身份的异常来源，并与过去三十日按部署阶段的读数对比。一次失败请求输出 attempted_read，成功内容 API 输出 returned_to_principal；只有独立端点输出、外传或后继认证证据才提升为
      retained_or_used。轮换、冷启动与故障切换会造成合法首次读取，不能把全体服务角色或发布窗口永久放行。
    en: Map each principal to an approved workload, required secret set, deployment region, and normal origin. In a twenty-four-hour window, find
      first reads of sensitive items, expansion into unrelated resources, or a changed origin under the same identity, and compare with the prior
      thirty days by deployment phase. A failed request yields attempted_read; a successful content API yields returned_to_principal. Independent
      endpoint output, exfiltration, or later authentication is required for retained_or_used. Rotation, cold starts, and failover can cause legitimate
      first reads, so neither all service roles nor release windows should be permanently allowlisted.
data_requirements:
- source_type: cloud-secret-read-audit
  name:
    zh: 云秘密内容读取审计
    en: Cloud secret content-read audit
  channel: AWS CloudTrail Secrets Manager, Google Secret Manager Data Access, or Azure Key Vault diagnostics
  required_fields:
  - timestamp
  - cloud_account_id
  - principal_id
  - request_id
  - operation
  - secret_id
  - source_ip
  - result
- source_type: workload-secret-inventory
  name:
    zh: 工作负载到秘密允许关系
    en: Workload-to-secret allowed relationship
  channel: null
  required_fields:
  - principal_id
  - workload_id
  - allowed_secret_id
  - expected_origin
  - deployment_region
  - owner_id
- source_type: cloud-audit-configuration
  name:
    zh: 秘密读取审计启用与交付状态
    en: Secret-read audit enablement and delivery status
  channel: null
  required_fields:
  - cloud_account_id
  - service_name
  - data_access_enabled
  - delivery_target
  - last_event_time
observables:
- zh: 受信工作负载角色首次读取业务范围外的秘密内容
  en: A trusted workload role first reads content of a secret outside its business scope
- zh: 同一主体的内容读取来源或 secret 版本集合突然改变
  en: The same principal changes origin or the set of secret versions it reads
- zh: 应开启的 Data Access 日志未交付，形成无法证伪的观察缺口
  en: Expected Data Access events are not delivered, creating an observation gap that cannot be treated as safety
correlation:
  window:
    zh: 以二十四小时关联异常读取，并以三十日按工作负载和部署阶段的基线对照。
    en: Correlate abnormal reads over twenty-four hours against a thirty-day workload and deployment-phase baseline.
  dimensions:
  - cloud_account_id
  - principal_id
  - request_id
  - secret_id
  - source_ip
  - workload_id
  - timestamp
false_positives:
- zh: 批准的密钥轮换、新部署、自动扩容、故障转移与应急访问会改变读取频率或条目集合。
  en: Approved rotation, new deployments, autoscaling, failover, and emergency access can change read frequency or item sets.
blind_spots:
- zh: Google Data Access 或 Azure 诊断未启用时无完整读取事件；共享 NAT、代理和跨账号访问会削弱来源归因，API 日志不显示攻击者是否保存秘密。
  en: Disabled Google Data Access or Azure diagnostics removes complete read records; shared NAT, proxies, and cross-account access weaken origin
    attribution, and API logs do not show whether the adversary retained a secret.
tuning_guidance:
  paragraphs:
  - zh: 为每个工作负载保存最小必需 secret 清单、部署环次、期望来源与有效审批，并按敏感度和首次读取提高权重。批准轮换可降权但保留原始事件，不对白名单角色整体静默；对不产生日志的账号先修复采集覆盖，再判断异常。
    en: Maintain each workload's minimum required secret set, deployment phase, expected origins, and valid approvals, weighting sensitive and
      first-time reads. Approved rotation may lower priority while retaining raw events; never silence all calls by an allowlisted role. Repair
      audit coverage before interpreting an account with no read events.
