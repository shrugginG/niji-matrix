schema_version: 2.0.0
type: detection-analytic
id: NJA-000167
strategy_ref: DET-000156
name:
  zh: Confluence 搜索与附件下载关联
  en: Confluence Search and Attachment Download Correlation
summary:
  zh: 在 Full 审计下连接搜索词、附件 ID 与授权角色，并把页面正文读取留作盲区。
  en: Under Full audit, join terms, attachment ID, and authorized role while retaining page-body reads as a blind spot.
domains:
- enterprise
platforms:
- Confluence Data Center
logic:
  paragraphs:
  - zh: 在 Full 审计已启用时按用户和时间连接 Search performed 的词与随后 Attachment downloaded；若页面正文读取另有可靠访问日志，可扩展连接，但不能把搜索结果本身视为内容读取。对同一用户在非职责空间的敏感附件、罕见搜索词及未批准调查期加权，核查真实下载是否成功。
    en: With Full auditing enabled, join Search performed terms to later Attachment downloaded by actor and time. Extend to
      page-body reads only when reliable access logs exist; never treat a search result alone as content access. Weight sensitive
      attachments in out-of-duty spaces, rare terms, and activity outside approved investigation windows, and verify successful
      downloads.
data_requirements:
- source_type: confluence-datacenter-search-audit
  name:
    zh: Confluence Data Center 搜索审计
    en: Confluence Data Center search audit
  channel: Full audit coverage
  required_fields:
  - timestamp
  - actor
  - event
  - search_terms
- source_type: confluence-datacenter-attachment-audit
  name:
    zh: Confluence Data Center 附件审计
    en: Confluence Data Center attachment audit
  channel: Full audit coverage
  required_fields:
  - timestamp
  - actor
  - event
  - attachment_id
  - space_id
- source_type: repository-authorization-context
  name:
    zh: 信息库授权与业务上下文
    en: Repository authorization and business context
  channel: null
  required_fields:
  - actor
  - space_id
  - assigned_role
  - approved_case
  - sensitivity
observables:
- zh: 同一角色搜索后取得高敏空间附件
  en: The same actor retrieves a high-sensitivity space attachment after searching
- zh: 未授权角色的少量高价值下载偏离职责
  en: A few high-value downloads by an unauthorized role depart from duty
correlation:
  window:
    zh: 查询到附件下载初始取六十分钟，另保留三十天用户与空间基线。
    en: Start with sixty minutes from query to attachment download and retain a thirty-day actor-and-space baseline.
  dimensions:
  - actor
  - space_id
  - attachment_id
  - query_time
  - download_time
false_positives:
- zh: 文档维护、支持、法务审查与获批机密调查也会搜索并下载附件。
  en: Documentation maintainers, support, legal review, and approved sensitive investigations also search and download attachments.
blind_spots:
- zh: Base/Advanced 审计不一定提供这组事件，页面浏览可能没有同等记录。
  en: Base or Advanced audit may not provide the required pair and page views may lack equivalent records.
tuning_guidance:
  paragraphs:
  - zh: 先核验 Full 审计与附件键，再按空间和职责建立例外；只凭搜索词不能判定内容已取得。
    en: Verify Full audit and attachment keys first, then baseline by space and duty; terms alone do not establish acquired
      content.
evidence_refs:
- REF-000564
