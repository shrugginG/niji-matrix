schema_version: 2.0.0
type: detection-analytic
id: NJA-000170
strategy_ref: DET-000159
name:
  zh: 浏览器控制点到同页内容读取关联
  en: Browser Control Point to Co-Viewed Page Read Correlation
summary:
  zh: 将扩展或注入控制变化与用户页面活动及额外内容读取连接。
  en: Join extension or injection control changes to the user's page activity and additional content reads.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 以设备、用户和浏览器配置文件为键，先找扩展新增/版本或权限扩大、未批准调试附着或进程模块变化；再在同一会话 30 分钟内关联敏感站点页面访问以及浏览器到非批准域的内容传输。只有能取得页面源码、请求正文或后续匹配内容时才升级为已收集；仅有扩展权限时输出待核查。
    en: Join device, user, and browser profile. Find extension installs or version/permission growth, unapproved debugger
      attachment, or browser module changes, then correlate sensitive-site page access and browser transfer to an unapproved
      domain within 30 minutes. Escalate to confirmed collection only with page source, request body, or a matching downstream
      content artifact; permission alone yields an investigative lead.
data_requirements:
- source_type: browser-extension-inventory
  name:
    zh: 浏览器扩展与权限清单
    en: Browser extension and permission inventory
  channel: null
  required_fields:
  - device_id
  - browser_name
  - extension_id
  - version
  - permissions
  - install_origin
  - observed_at
- source_type: endpoint-process-and-network
  name:
    zh: 浏览器进程及外联事件
    en: Browser process and egress events
  channel: null
  required_fields:
  - device_id
  - process_guid
  - process_image
  - target_process_guid
  - event_type
  - destination_domain
  - observed_at
- source_type: application-request-log
  name:
    zh: 应用资源请求日志
    en: Application resource request log
  channel: null
  required_fields:
  - account_id
  - session_id
  - resource_path
  - request_method
  - observed_at
observables:
- zh: 未批准扩展取得敏感域权限后发生页面源码或请求读取
  en: An unapproved extension reads page source or requests after gaining sensitive-domain permission
- zh: 浏览器外联或应用请求与用户同页操作时间重叠
  en: Browser egress or app requests overlap the user's page activity
correlation:
  window:
    zh: 围绕浏览器控制变化与敏感页面访问取三十分钟窗口。
    en: Use a thirty-minute window around browser-control change and sensitive-page access.
  dimensions:
  - device_id
  - browser_profile
  - account_id
  - session_id
  - resource_path
false_positives:
- zh: 密码管理器、无障碍插件、合法浏览器开发调试、DLP 扩展和回归测试会访问页面并产生外连；必须核对签名、变更单、主机范围和目标站点权限。
  en: Password managers, accessibility plug-ins, approved browser debugging, DLP extensions, and regression tests can access
    pages and connect outward; check signer, change ticket, fleet scope, and host permissions.
blind_spots:
- zh: 浏览器端 DOM 读取往往没有独立系统事件；无扩展清单、缺少应用 request ID 或加密外传不可检查时，只能给出控制风险线索。
  en: Browser-local DOM reads often lack separate OS events. Without extension inventory, app request IDs, or inspectable
    encrypted egress, this is a control-risk lead only.
tuning_guidance:
  paragraphs:
  - zh: 以受管扩展及开发工具的批准版本、站点范围和维护窗建基线，但不得把所有 debugger 权限或浏览器外连整体放行；高敏站点与异常权限变更优先。
    en: Baseline approved extension and developer-tool versions, host scopes, and maintenance windows, without globally allowing
      all debugger permissions or browser egress; prioritize sensitive sites and new permissions.
evidence_refs:
