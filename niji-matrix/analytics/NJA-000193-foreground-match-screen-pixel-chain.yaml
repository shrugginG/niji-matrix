schema_version: 2.0.0
type: detection-analytic
id: NJA-000193
strategy_ref: DET-000177
name:
  zh: 前台目标命中后截图链验证
  en: Verify Capture Chain After Foreground-Target Match
summary:
  zh: 把经验证的目标窗口状态、成功取像与屏幕像素产物连接。
  en: Join validated target-window state, successful capture, and screen-pixel output.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 在高价值交互终端的试点中验证窗口状态传感器和图形捕获传感器确能报告调用进程、会话、目标窗口、调用结果与时间。以主机、用户、会话及进程谱系关联同一主体的目标状态、捕获成功事件和随后可信识别的图像或加密产物；比较目标出现前后是否只有命中后出现一组有间隔的截图结果。若缺少取像成功或可验证产物，只报告窗口门控疑点而不归为
      T1113 已完成。
    en: Pilot window-state and graphics-capture sensors on high-value interactive endpoints and verify that they report caller
      process, session, target window, call result, and time. Join one actor's target state, successful capture event, and
      subsequently verified image or encrypted artifact by host, user, session, and process lineage; compare before and after
      target appearance for interval-spaced screenshot outcomes only after a match. Without successful acquisition or a verified
      artifact, report a possible window gate rather than completed T1113.
data_requirements:
- source_type: validated-window-state-sensor
  name:
    zh: 经验证的前台窗口状态传感器
    en: Validated foreground-window state sensor
  channel: null
  required_fields:
  - timestamp
  - host_id
  - user_id
  - session_id
  - actor_process_guid
  - target_window_key
  - title_category
  - foreground_state
- source_type: validated-graphics-capture-sensor
  name:
    zh: 经验证的图形取像传感器
    en: Validated graphics-capture sensor
  channel: null
  required_fields:
  - timestamp
  - host_id
  - user_id
  - session_id
  - actor_process_guid
  - target_window_key
  - capture_result
  - pixel_source
- source_type: endpoint-file-and-lineage
  name:
    zh: 终端文件与进程模块谱系
    en: Endpoint file and process-module lineage
  channel: Sysmon Event 1, 7, and 11 or verified EDR equivalent
  required_fields:
  - utc_time
  - computer
  - processguid
  - image
  - image_loaded
  - target_filename
observables:
- zh: 目标窗口命中后同进程出现截图成功与有间隔的产物
  en: The same process has successful capture and interval-spaced output after a target-window match
- zh: 未命中时缺少相应截图结果而驻留模块仍在
  en: The matching capture outcome is absent while the resident module remains before a match
correlation:
  window:
    zh: 试点以目标首次命中前后各十分钟比较，并保留同一会话二十四小时的条件与结果摘要；按业务实际截图节奏校准，不把十秒固定为通用阈值。
    en: Pilot ten minutes on each side of the first target match and retain a twenty-four-hour session summary of conditions
      and outcomes; calibrate to legitimate capture cadence rather than treating ten seconds as a universal threshold.
  dimensions:
  - host_id
  - user_id
  - session_id
  - actor_process_guid
  - target_window_key
  - title_category
  - timestamp
false_positives:
- zh: 远程支持、RPA、无障碍和测试程序可合法地按窗口状态截图
  en: Remote support, RPA, accessibility, and testing tools may legitimately capture by window condition
blind_spots:
- zh: 默认 Sysmon 不记录每次图形取像；传感器不覆盖 GDI、受保护桌面或注入模块时不能确认像素取得
  en: Default Sysmon does not record every graphics capture; lack of GDI, protected-desktop, or injected-module coverage prevents
    proof of pixel acquisition
tuning_guidance:
  paragraphs:
  - zh: 按软件发布者、批准的窗口类别、工单、用户会话和进程模块完整性建立基线，标题只存分类或隐私受控哈希。不要因进程签名或调用 BitBlt 就直接放行或告警；校准探针能否观察所选接口，再把缺少产物的结果降级为调查线索。
    en: Baseline publisher, approved window categories, work order, user session, and process-module integrity, storing only
      a title category or privacy-controlled hash. Do not automatically allow or alert on a signed process or a BitBlt call.
      Validate sensor coverage of the relevant interface and downgrade results without pixel outcomes to investigation leads.
