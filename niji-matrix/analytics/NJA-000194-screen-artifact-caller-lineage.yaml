schema_version: 2.0.0
type: detection-analytic
id: NJA-000194
strategy_ref: DET-000177
name:
  zh: 异常截图产物与调用者谱系关联
  en: Correlate Unusual Screenshot Artifacts With Caller Lineage
summary:
  zh: 用文件和进程证据确认截图产物及其调用者，区分普通业务序列。
  en: Confirm a screen-image artifact and its caller from file and process evidence, distinguishing approved capture sequences.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 在可审计的截图输出目录、临时目录及业务受控收集目录中记录文件创建、写入进程和后续封装事件，并以试点识别出的图像头、图像解码结果或样本族结构确认文件确为屏幕像素产物。将产物序列与进程及模块来源、交互用户和批准的远程支持/会议时段关联；若只有加密文件且没有取像传感器或可确认内容，输出应是可疑图像链而非已完成截图的强结论。
    en: Log file creation, writer process, and later packaging in auditable screenshot, temporary, and controlled collection
      paths, then confirm display-pixel content using an image header, decoded result, or pilot-validated family structure.
      Join the artifact sequence to process and module provenance, interactive user, and approved remote-support or meeting
      periods. If files are encrypted and no capture sensor or content verification exists, output a suspicious artifact chain
      rather than a strong completed-capture conclusion.
data_requirements:
- source_type: endpoint-file-creation
  name:
    zh: 终端文件创建与写入事件
    en: Endpoint file-creation and write events
  channel: Sysmon Event 11 or verified EDR equivalent
  required_fields:
  - utc_time
  - computer
  - processguid
  - image
  - target_filename
- source_type: artifact-classification
  name:
    zh: 经验证的截图产物识别
    en: Validated screenshot-artifact classification
  channel: null
  required_fields:
  - timestamp
  - host_id
  - path
  - artifact_type
  - classification_basis
  - content_verified
- source_type: endpoint-process-lineage
  name:
    zh: 进程与模块谱系
    en: Process and module lineage
  channel: Sysmon Event 1 and 7 or verified EDR equivalent
  required_fields:
  - utc_time
  - computer
  - processguid
  - parentprocessguid
  - image
  - image_loaded
observables:
- zh: 非批准进程形成经图像头或解码确认的屏幕像素产物
  en: An unapproved process writes an artifact confirmed by image header or decode to contain screen pixels
- zh: 连续产物与同一会话和写入进程相连
  en: A sequence of artifacts links to the same session and writer process
correlation:
  window:
    zh: 以同一主机、进程和会话在三十分钟内关联图像创建、临时文件改写与归档，长期定时截屏按二十四小时摘要复核；窗口值仅是试点起点。
    en: Join image creation, temporary-file rewriting, and packaging within thirty minutes by host, process, and session;
      review twenty-four-hour summaries for periodic capture. These windows are pilot starting points.
  dimensions:
  - host_id
  - process_guid
  - parent_process_guid
  - user_id
  - session_id
  - artifact_path
  - timestamp
false_positives:
- zh: 用户主动截图、会议录制、远程协助与质检工具也可能连续写出图像
  en: User screenshots, meeting recording, remote assistance, and quality-assurance tools may also emit image sequences
blind_spots:
- zh: 内存或直接网络输出没有文件事件；未知加密格式若不能验证内容，无法从扩展名证明截图
  en: In-memory or direct-network output has no file event, and an unverified encrypted format cannot prove screenshot content
    from its extension
tuning_guidance:
  paragraphs:
  - zh: 对批准截图工作流维护发布者、路径、会话和业务 owner 清单，对未列出的产物保留抽样解码或样本族验证流程。不要仅按 JPEG 扩展名分类：BLUELIGHT 的报告说明该扩展名也用于非图像数据；对加密文件应以调用遥测或可核验结构提高结论强度。
    en: 'Maintain approved capture-workflow inventories by publisher, path, session, and business owner, and retain sampled
      decoding or family-structure validation for unlisted artifacts. Do not classify solely by a JPEG extension: the BLUELIGHT
      report shows that extension was also used for nonimage data. For encrypted files, use capture telemetry or verifiable
      structure to strengthen the conclusion.'
