schema_version: 2.0.0
type: detection-analytic
id: NJA-000195
strategy_ref: DET-000178
name:
  zh: 非批准摄像头会话后的视觉产物
  en: Visual Output Following an Unapproved Camera Session
summary:
  zh: 将实际摄像头设备会话与调用进程、可信图像或视频产物相连。
  en: Join an actual camera-device session to its caller and a confirmed image or video artifact.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 先以一台受管设备试点证明摄像头传感器实际导出 endpoint_id、process_id、device_id、session_start 与 session_end，且可与进程签名和文件事件对齐。按端点和进程连接摄像头启动前后五分钟的模块或进程来源，以及会话期间至结束后十五分钟创建的图像或视频候选；经文件类型识别或预览确认产物确含摄像头画面，并与批准会议、远程支持和拍照任务比较。只有设备会话时标为可疑访问；有可信画面产物且缺少业务批准才升级为采集候选。不要以
      JPG、MOV 后缀或 ATT&CK 页面列举的 DLL 加载单独推断视频捕获。
    en: First pilot a managed endpoint to prove that a camera sensor exports endpoint_id, process_id, device_id, session_start,
      and session_end and can be joined to process provenance and file events. Join process or module provenance within five
      minutes of camera start and candidate image or video output written during the session or within fifteen minutes afterward.
      Confirm by media-type inspection or preview that output actually contains camera imagery, then compare with approved
      meetings, remote support, and photography tasks. A device session alone is suspicious access; verified visual output
      without business approval raises an acquisition candidate. Neither JPG or MOV extensions nor a DLL named on the ATT&CK
      page independently proves video capture.
data_requirements:
- source_type: camera-device-session
  name:
    zh: 摄像头设备会话
    en: Camera-device session
  channel: validated endpoint camera-session sensor; user privacy UI is not an enterprise event stream
  required_fields:
  - endpoint_id
  - process_id
  - device_id
  - session_start
  - session_end
- source_type: process-and-module-provenance
  name:
    zh: 进程与模块来源
    en: Process and module provenance
  channel: EDR process and module telemetry with signer and parent identity
  required_fields:
  - endpoint_id
  - process_id
  - event_time
  - executable_path
  - signer
  - parent_process_id
- source_type: endpoint-file-and-media-type
  name:
    zh: 端点文件与媒体类型
    en: Endpoint file and media type
  channel: EDR file events plus approved media classifier or controlled review
  required_fields:
  - endpoint_id
  - process_id
  - event_time
  - file_path
  - file_size
  - detected_media_type
observables:
- zh: 非批准进程打开摄像头并形成经内容确认的画面文件
  en: An unapproved process opens the camera and produces content-confirmed imagery
- zh: 摄像头会话时间与媒体文件写入时间闭合
  en: Camera-session time aligns with media-file creation
correlation:
  window:
    zh: 从设备激活前五分钟到会话结束后十五分钟关联，按产品实测时间漂移调整。
    en: Join from five minutes before device activation through fifteen minutes after the session ends, adjusting for measured
      clock drift.
  dimensions:
  - endpoint_id
  - process_id
  - device_id
  - user_id
false_positives:
- zh: 正常会议录制、视频质检、授权远程支持、无障碍工具、证件验证和用户主动拍照可产生同样的设备会话与产物；摄像头测试软件更新也会改变签名或路径。
  en: Ordinary meeting recording, video quality assurance, approved remote support, accessibility, identity verification,
    and user-initiated photography can produce the same sessions and artifacts; camera-test updates may change signer or path.
blind_spots:
- zh: Windows 或 macOS 用户界面权限历史通常不能直接导出逐进程事件；平台和 EDR 若无摄像头会话键，此分析不能运行。视频通话接口取得远端画面可完全绕开新的本地摄像头会话，应交给另一分析；纯内存流或云端产物也可能无本地文件。
  en: Windows and macOS user-facing permission history does not automatically export per-process events; without camera-session
    keys from platform or EDR this analytic cannot run. A call-media interface can acquire a remote participant without a
    new local camera session and needs the other analytic; memory-only streams or cloud output may leave no local file.
tuning_guidance:
  paragraphs:
  - zh: 以应用签名、安装来源、工作任务、设备型号和会话时间建立版本化基线，例外绑定经批准组件与具体业务，而非整个摄像头应用名。试点核验传感器 PID 重用、时间漂移和媒体类型识别的误差；保留首见组件和非会议时段的高优先级线索。
    en: Baseline signed app builds, install origins, job roles, device models, and session times with versioning. Bind exceptions
      to an approved component and task, never the entire camera-app name. Pilot PID reuse, timestamp drift, and media-type
      error rates; preserve first-seen requesters and out-of-meeting activity as higher-priority leads.
