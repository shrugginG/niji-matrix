schema_version: 2.0.0
type: detection-analytic
id: NJA-000196
strategy_ref: DET-000179
name:
  zh: 视频会话接口附着后的周期性画面文件
  en: Periodic Call Frames After Media-Interface Attachment
summary:
  zh: 连接第三方接口授权、视频会话及经内容确认的通话帧结果。
  en: Join third-party interface grant, video-call session, and content-confirmed call-frame output.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 对确实导出第三方媒体接口审计的通话产品，按 user_id、endpoint_id 和 app_session_id 关联 requester_id 的首次附着或授权事件与视频通话起止事件；在通话中及结束后三十分钟寻找由该请求组件写出的帧序列、视频临时文件或经内容识别的画面产物，并对照企业批准的录制集成。接口授权但无取帧产物只算暴露或企图，单张屏幕截图须先排除
      T1113。T9000 的 SkypeControlAPI 名称及路径只用于历史回溯，不作为现代通话产品的统一字段。
    en: For call products that actually export third-party media-interface audit, join requester_id's first attachment or
      grant with video-call start and end using user_id, endpoint_id, and app_session_id. During the call and thirty minutes
      afterward, look for frame sequences, temporary video files, or content-confirmed call imagery written by that requester,
      then compare with approved recording integrations. A grant without frames is exposure or attempt; a single desktop screenshot
      must first be excluded as T1113. T9000's SkypeControlAPI names and paths are historical pivots, not common fields for
      modern clients.
data_requirements:
- source_type: call-media-interface-audit
  name:
    zh: 通话媒体接口授权审计
    en: Call-media interface grant audit
  channel: product-specific interface grant and attachment events validated before deployment
  required_fields:
  - user_id
  - endpoint_id
  - requester_id
  - app_session_id
  - event_time
  - action
  - grant_actor
- source_type: video-call-session
  name:
    zh: 视频通话会话事件
    en: Video-call session events
  channel: product-specific call or meeting audit with modality
  required_fields:
  - user_id
  - endpoint_id
  - app_session_id
  - call_start
  - call_end
  - video_enabled
- source_type: endpoint-visual-artifact
  name:
    zh: 端点视觉媒体产物
    en: Endpoint visual-media artifact
  channel: EDR file telemetry plus frame-content confirmation
  required_fields:
  - endpoint_id
  - process_id
  - event_time
  - file_path
  - file_size
  - detected_media_type
observables:
- zh: 未经批准的请求者在通话附近取得媒体接口权限
  en: An unapproved requester gains media-interface access near a call
- zh: 同一视频会话随后出现周期性通话帧产物
  en: Periodic call-frame artifacts then appear for the same video session
correlation:
  window:
    zh: 从通话开始前十五分钟到结束后三十分钟关联；缺少产品接口日志时不输出确认结论。
    en: Join fifteen minutes before call start through thirty minutes after call end; without product interface audit, do
      not emit a confirmed result.
  dimensions:
  - user_id
  - endpoint_id
  - app_session_id
  - requester_id
false_positives:
- zh: 经批准的录像机器人、会议纪要与视频质检集成、无障碍字幕或远程支持可附着会议并保存视觉片段；会议主持人临时批准组件也需纳入审批审计。
  en: Approved recording bots, meeting-note and video-quality integrations, accessibility captioning, and remote support may
    attach to calls and retain visual excerpts; temporary host approvals require approval-audit context.
blind_spots:
- zh: 不提供接口审计或输出仅在云端的产品无法完成此关联；端点内存取帧可能无文件。通话媒体接口取得的远端画面不必触发本地摄像头指示；授权提示是否具有同样 UI 误导效果必须逐产品验证。
  en: Apps without interface audit or with cloud-only output cannot support the join; memory-only extraction may leave no
    file. A remote participant's call media need not trigger a local camera indicator, and prompt-confusion behavior must
    be verified for each product.
tuning_guidance:
  paragraphs:
  - zh: 先核实当前产品确有请求者、会话与视频模态字段；按租户、业务主持人、请求组件、有效期和录制批准单维护许可，不把所有“会议软件”一次性放行。样本基线应包含合法会中录像与无录像的会议、同一应用的屏幕共享，以及用户主动截图，以校准视频帧内容确认。
    en: First verify requester, session, and video-modality fields on the deployed product. Maintain grants by tenant, business
      owner, requester, expiry, and recording approval, rather than allowlisting all meeting software. Baseline authorized
      recorded and unrecorded calls, screen shares in the same app, and user screenshots to calibrate confirmation of call
      frames.
evidence_refs:
