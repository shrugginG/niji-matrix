schema_version: 2.0.0
type: detection-analytic
id: NJA-000205
strategy_ref: DET-000185
name:
  zh: 低权前态—凭据库成功读取差分
  en: Lower-Authority Pre-State to Successful Credential-Store Read Differential
summary:
  zh: 比较主体事件时权限与正确保护策略，将本应拒绝却成功的凭据文件或数据库读取关联到精确脆弱状态和结果。
  en: Compare event-time subject authority with correct protection policy and join a credential file or database read that should have been denied
    to the exact vulnerable state and result.
domains:
- enterprise
platforms:
- Linux
- Windows
- macOS
logic:
  paragraphs:
  - zh: 为登记的凭据文件、数据库和敏感表保存正确 owner、ACL、允许主体、对象类别与策略版本；按事件时间恢复读取主体的 UID、组、角色、会话和进程谱系，并与实际 ACL、产品版本和补丁快照比较。当不在允许集合且无授权变更的低权主体成功读取、复制或查询目标对象时输出 attempt；若本地复核证明错误保护使同一主体可重复取得对象，输出
      read-capability-confirmed；只有取证或受害方确认取得认证材料时输出 material-recovered。当前 ACL 或当前补丁状态若无法还原事件时状态，只能降低为 exposure 或 unresolved。
    en: For inventoried credential files, databases, and sensitive tables, retain correct owner, ACL, allowed subjects, object class, and policy
      version. Reconstruct the reader's UID, groups, roles, session, and process lineage at event time, then compare them with actual ACL, product
      version, and patch snapshot. Emit attempt when a lower-authority subject outside the allowed set and without an authorization change successfully
      reads, copies, or queries the target object. Emit read-capability-confirmed when local review shows the faulty protection let the same subject
      obtain the object repeatably. Emit material-recovered only when forensics or the victim confirms authentication material. If current ACL
      or patch state cannot reconstruct the event-time state, downgrade to exposure or unresolved.
  - zh: 输出文件、归档或网络传输用于提高优先级而不是证明解密；加密凭据保持 material-recovered-encrypted，直到另有可用秘密证据。支持、备份、升级和取证主体按精确二进制、服务账户、工单、对象范围、目的地和期限降权。规则不能把所有非管理员读取标为恶意，也不能通过生产重放漏洞验证。
    en: Output files, archives, or network transfer raise priority rather than prove decryption. Encrypted credentials remain material-recovered-encrypted
      until separate evidence establishes a usable secret. Support, backup, upgrade, and forensic subjects are down-weighted by exact binary,
      service account, work order, object scope, destination, and expiry. The rule must not label every nonadministrative read malicious or replay
      the exploit in production for validation.
data_requirements:
- source_type: identity-authority-history
  name:
    zh: 主体权限与授权变更历史
    en: Subject Authority and Authorization Change History
  channel: identity and host policy telemetry
  required_fields:
  - event.timestamp
  - device.id
  - principal.id
  - session.id
  - user.uid
  - group.ids
  - role.ids
  - authorization.change_id
  - state.valid_from
  - state.valid_to
- source_type: sensitive-file-database-access
  name:
    zh: 敏感文件与数据库读取审计
    en: Sensitive File and Database Read Audit
  channel: configured OS file audit or database audit
  required_fields:
  - event.timestamp
  - device.id
  - principal.id
  - process.id
  - process.image
  - object.id
  - object.path_or_relation
  - object.sensitivity
  - operation
  - bytes_read
  - result
- source_type: protection-policy-history
  name:
    zh: 对象正确策略与实际 ACL 历史
    en: Correct Object Policy and Actual ACL History
  channel: configuration and integrity management
  required_fields:
  - object.id
  - object.owner
  - policy.version
  - allowed_principal_ids
  - actual.acl
  - state.valid_from
  - state.valid_to
- source_type: vulnerability-state-history
  name:
    zh: 软件版本与补丁历史
    en: Software Version and Patch History
  channel: CMDB and retained vulnerability snapshots
  required_fields:
  - device.id
  - product.name
  - product.version
  - cve.id
  - patch.id
  - state.valid_from
  - state.valid_to
- source_type: output-and-investigation
  name:
    zh: 输出、外传与凭据暴露调查
    en: Output Egress and Credential Exposure Investigation
  channel: EDR network telemetry and incident-response case system
  required_fields:
  - event.timestamp
  - device.id
  - process.id
  - output.object_id
  - destination.id
  - case.id
  - material.type
  - material.recovery_status
  - affected_identity_set_id
observables:
- zh: 事件时低权主体无授权变更，却成功读取正确策略应拒绝的凭据承载对象。
  en: At event time a lower-authority subject without an authorization change successfully reads a credential-bearing object that correct policy
    should deny.
- zh: 实际 ACL 或组件版本与正确策略存在可定位差异，且读取之后出现相关输出、复制或外传。
  en: Actual ACL or component version differs from correct policy in an identifiable way and related output, copy, or egress follows the read.
- zh: 受控调查确认所得为加密或明文认证材料，并保持可用性结论分层。
  en: Controlled investigation confirms encrypted or plaintext authentication material while keeping usability as a separate grade.
correlation:
  window:
    zh: 在敏感读取前后三十分钟关联主体前态、策略差、版本状态和输出；后继解密或身份使用进入独立案件窗。
    en: Join subject pre-state, policy difference, version state, and output within thirty minutes around the sensitive read; later decryption
      or identity use belongs to a separate case window.
  dimensions:
  - device.id
  - principal.id
  - session.id
  - process.id
  - object.id
  - policy.version
  - cve.id
  - case.id
false_positives:
- zh: 备份、支持收集、升级、数据库维护、权限迁移和取证可能由低权入口触发敏感读取，应验证实际服务身份、受控提权、工单、对象集合和输出目的地。
  en: Backup, support collection, upgrade, database maintenance, permission migration, and forensics can initiate sensitive reads from a lower-authority
    entry; verify actual service identity, controlled elevation, work order, object set, and output destination.
blind_spots:
- zh: 未预先启用成功文件读取或数据库审计、缺少事件时 ACL 与组成员历史、应用内部读取不暴露对象标识，以及攻击者已获得高权后篡改本机日志都会削弱差分。
  en: The differential weakens when successful file-read or database audit was not enabled, event-time ACL and group history are missing, application-internal
    reads expose no object identifier, or an adversary gained higher authority and altered local logs.
- zh: 文件或表读取不能证明具体字段被返回，加密材料也不能证明解锁成功；这些结果需要受控调查而非日志内容采集。
  en: A file or table read does not prove which fields were returned, and encrypted material does not prove successful unlock; controlled investigation
    rather than log-content collection is required.
tuning_guidance:
  paragraphs:
  - zh: 按对象而不是目录根维护敏感清单，为每个对象保存允许主体与正确策略。只对精确服务身份加任务 ID 加时间窗加目的地的组合降权，保留新进程、交互式会话、计划外读取和未记录的 ACL 偏差。周期性用非破坏 canary 验证低权主体仍被拒绝，并确认传感器确实记录成功与失败，不在生产运行
      exploit。
    en: Maintain sensitive inventory by object rather than directory root, with allowed subjects and correct policy for each object. Down-weight
      only an exact service identity plus job identifier plus time window plus destination, retaining new processes, interactive sessions, unscheduled
      reads, and undocumented ACL differences. Periodically use a nondestructive canary to verify lower-authority denial and that sensors record
      successes and failures; do not run an exploit in production.
