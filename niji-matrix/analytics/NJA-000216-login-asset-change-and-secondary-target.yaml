schema_version: 2.0.0
type: detection-analytic
id: NJA-000216
strategy_ref: DET-000193
name:
  zh: 登录资产变更与第二提交目标关联
  en: Login-Asset Change and Secondary Submission-Target Correlation
summary:
  zh: 将外部锚定的登录资产差异与认证期间的第二提交目标或服务输出关联。
  en: Join externally anchored login-asset differences to a secondary submission destination or service output during authentication.
domains:
- enterprise
platforms:
- Linux
- Network Devices
- Windows
logic:
  paragraphs:
  - zh: 从外部可信仓库取得 VPN、SSO、Webmail 和管理门户登录脚本、模板与静态资源的版本和哈希，检测非批准写入、部署者或 bundle 差异；在变更后二十四小时内关联登录请求时浏览器到非批准域的第二连接、Web 进程新文件或异常服务外联。只见差异标
      integrity failure；与第二输出同现才标 suspected capture，字段值不得进入日志。
    en: Obtain versions and hashes for VPN, SSO, webmail, and administration-portal login scripts, templates, and static resources
      from an externally trusted repository. Detect unauthorized writes, deployers, or bundle differences, then within twenty-four
      hours join a second browser connection to an unapproved domain during sign-in, a new file from the web process, or anomalous
      service egress. A difference alone is an integrity failure; co-occurrence with a second output is suspected capture,
      and field values must not enter logs.
data_requirements:
- source_type: login-asset-integrity
  name:
    zh: 登录资产版本与完整性
    en: Login asset version and integrity
  channel: external deployment inventory and file integrity monitor
  required_fields:
  - timestamp
  - appliance_id
  - asset_path
  - expected_hash
  - observed_hash
  - deployment_id
  - writer_identity
  - result
- source_type: web-authentication-flow
  name:
    zh: Web 登录事务与网络元数据
    en: Web sign-in transaction and network metadata
  channel: reverse proxy, browser, or appliance network telemetry
  required_fields:
  - timestamp
  - appliance_id
  - client_session_id
  - origin
  - request_path
  - destination_domain
  - process_id
  - bytes_out
observables:
- zh: 登录资产哈希漂移
  en: Login-asset hash drift
- zh: 未批准登录资产写入
  en: Unapproved login-asset write
- zh: 第二表单目的地
  en: Secondary form destination
- zh: 登录后 Web 进程输出
  en: Web-process output after sign-in
correlation:
  window:
    zh: 登录资产变化后观察二十四小时，并在每次登录前后十五分钟关联第二提交目标或服务输出。
    en: Observe twenty-four hours after a login-asset change and join secondary destinations or service output within fifteen
      minutes around each sign-in.
  dimensions:
  - appliance_id
  - asset_path
  - deployment_id
  - client_session_id
  - process_id
  - destination_domain
false_positives:
- zh: 紧急补丁、品牌定制、A/B 测试、CDN 更新和批准的反欺诈脚本会改变登录资产或增加连接；须核对签名制品、变更单、内容安全策略和接收方数据合同。
  en: Emergency patches, branding, A/B tests, CDN updates, and approved antifraud scripts can change login assets or add connections.
    Check signed artifacts, change records, content-security policy, and recipient data contracts.
blind_spots:
- zh: 内置检查器可被同一高权攻击者篡改；运行态改写不改变文件，TLS 或浏览器端脚本可能隐藏提交内容；没有外部黄金基线就无法可靠判定设备自身报告。
  en: A built-in checker can be altered by the same privileged attacker, runtime rewriting changes no file, and TLS or browser-local
    scripts can conceal submission content. Device self-report is unreliable without an external golden baseline.
tuning_guidance:
  paragraphs:
  - zh: 对资产路径、设备版本和批准部署 ID 建严格允许图，外部保存黄金哈希；对变更后首次登录、跨域第二目的地和 Web 进程新输出提高权重，不能把所有厂商目录或 CDN 整体白名单化。
    en: Build a strict allow graph for asset path, appliance version, and approved deployment ID and retain golden hashes
      externally. Prioritize first sign-ins after change, cross-origin secondary destinations, and new web-process output
      without globally allowlisting vendor directories or CDNs.
