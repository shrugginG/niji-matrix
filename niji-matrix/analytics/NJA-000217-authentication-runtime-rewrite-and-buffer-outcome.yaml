schema_version: 2.0.0
type: detection-analytic
id: NJA-000217
strategy_ref: DET-000193
name:
  zh: 认证运行态改写与凭据缓冲结果关联
  en: Authentication Runtime Rewrite and Credential-Buffer Outcome Correlation
summary:
  zh: 将认证进程插桩或代码差异与隐藏缓冲、重复记录和非业务外联关联。
  en: Join authentication-process instrumentation or code differences to hidden buffers, repeated records, and nonbusiness
    egress.
domains:
- enterprise
platforms:
- Linux
- Windows
- macOS
logic:
  paragraphs:
  - zh: 对登记的认证进程建立模块、agent、类转换器、可执行映射和启动参数基线，识别未批准附着、远程线程、库预加载、Java instrumentation 或代码段差异；在六十分钟内关联认证进程或其子进程创建的隐藏临时文件、重复加密小记录或非业务外联。进程访问或模块变化本身只标
      runtime exposure，需输出链才升级。
    en: Baseline modules, agents, class transformers, executable mappings, and launch arguments for registered authentication
      processes. Identify unapproved attachment, remote thread, library preload, Java instrumentation, or code-segment difference,
      then within sixty minutes join hidden temporary files, repeated small encrypted records, or nonbusiness egress from
      the authentication process or child. Process access or module change alone is runtime exposure and requires an output
      chain for elevation.
data_requirements:
- source_type: authentication-process-integrity
  name:
    zh: 认证进程运行态完整性
    en: Authentication process runtime integrity
  channel: EDR module, process-access, memory-map, or application-runtime telemetry
  required_fields:
  - timestamp
  - host_id
  - process_guid
  - process_image
  - signer
  - module_or_agent
  - operation
  - source_process_guid
  - code_hash
- source_type: authentication-process-output
  name:
    zh: 认证进程文件与外联输出
    en: Authentication process file and egress output
  channel: EDR file and network telemetry
  required_fields:
  - timestamp
  - host_id
  - process_guid
  - child_process_guid
  - file_path
  - file_size
  - destination
  - bytes_out
observables:
- zh: 未批准认证进程插桩
  en: Unapproved authentication-process instrumentation
- zh: 认证代码哈希漂移
  en: Authentication-code hash drift
- zh: 隐藏重复缓冲记录
  en: Hidden repeated buffer
- zh: 认证服务新外联
  en: Authentication-service new egress
correlation:
  window:
    zh: 在认证运行态差异前后六十分钟关联同一进程或子进程的隐藏文件、重复记录和新外联。
    en: Join hidden files, repeated records, and new egress from the same authentication process or its child within sixty
      minutes of a runtime difference.
  dimensions:
  - host_id
  - process_guid
  - source_process_guid
  - module_or_agent
  - file_path
  - destination
false_positives:
- zh: APM、热补丁、诊断、性能分析、合法安全 agent 与应用升级会改变认证运行态；应核对签名、维护窗、部署来源和预期输出，而非仅按进程名抑制。
  en: APM, hot patching, diagnostics, profiling, approved security agents, and app upgrades change authentication runtime.
    Check signer, maintenance window, deployment origin, and expected output rather than suppressing by process name.
blind_spots:
- zh: 同进程内存改写可能没有模块加载或外部句柄；Sysmon Event 7 默认关闭，Event 10 高噪声且不证明读到字段；加密临时记录无法仅凭内容确认是凭据。
  en: In-process memory rewriting may have no module load or external handle. Sysmon Event 7 is disabled by default, Event
    10 is noisy and does not prove field reads, and encrypted temporary records cannot be identified as credentials from content
    alone.
tuning_guidance:
  paragraphs:
  - zh: 按精确认证进程版本和批准 agent 建运行态清单，先在实验环境验证可见字段；对无部署记录的 instrumentation、认证时间附近的新隐藏文件和首次目的地提高权重，并把正常 APM 例外限定到版本和期限。
    en: Inventory exact authentication-process versions and approved agents and validate visible fields in a lab. Prioritize
      undocumented instrumentation, new hidden files around authentication, and first destinations, and constrain normal APM
      exceptions by version and expiry.
