schema_version: 2.0.0
type: detection-analytic
id: NJA-000218
strategy_ref: DET-000194
name:
  zh: 本地凭据提示来源与安全上下文差分
  en: Local Credential-Prompt Origin and Security-Context Differential
summary:
  zh: 比较本地认证提示的进程来源和安全上下文，并关联用户提交后的结果链。
  en: Compare the process origin and security context of a local authentication prompt and correlate its post-submission outcome
    chain.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 识别由 PowerShell、AppleScript/osascript、shell、zenity/kdialog、未批准应用或异常父进程产生的凭据样式提示，记录窗口所属进程、签名、session、secure desktop
      或等价安全上下文；在十五分钟内关联同进程文件写入或外联。提示存在只标 impersonation lead，需用户提交后的结果链才标 suspected capture，禁止记录输入值。
    en: Identify credential-like prompts generated by PowerShell, AppleScript or osascript, shell, zenity or kdialog, an unapproved
      app, or an anomalous parent. Record owning process, signer, session, and secure desktop or equivalent security context,
      then within fifteen minutes join same-process file writes or egress. A prompt alone is an impersonation lead; a post-submission
      outcome is required for suspected capture, and input values must not be logged.
data_requirements:
- source_type: endpoint-process-script-window
  name:
    zh: 进程、脚本与窗口来源
    en: Process, script, and window origin
  channel: EDR process/script telemetry and validated window metadata
  required_fields:
  - timestamp
  - host_id
  - user_id
  - session_id
  - process_guid
  - parent_process_guid
  - image_path
  - signer
  - script_interpreter
  - window_security_context
- source_type: endpoint-file-network
  name:
    zh: 提示进程的文件与网络结果
    en: Prompt-process file and network outcomes
  channel: EDR file and network telemetry
  required_fields:
  - timestamp
  - host_id
  - process_guid
  - file_path
  - destination
  - bytes_out
observables:
- zh: 未批准来源的凭据样式提示
  en: Credential-like prompt from an unapproved origin
- zh: 非安全上下文提示
  en: Prompt outside a secure context
- zh: 提示进程结果写入
  en: Prompt-process output
- zh: 提示进程外联
  en: Prompt-process egress
correlation:
  window:
    zh: 在本地凭据样式提示前后十五分钟关联同一会话和进程的提交后文件或网络结果。
    en: Join post-submission file or network outcomes from the same session and process within fifteen minutes around a local
      credential-like prompt.
  dimensions:
  - host_id
  - user_id
  - session_id
  - process_guid
  - parent_process_guid
  - destination
false_positives:
- zh: 安装器、管理员工具、密钥串解锁、远程支持、企业脚本和无障碍流程会合法显示认证提示；须核对工单、签名、预期安全上下文及目标应用。
  en: Installers, administration tools, keychain unlock, remote support, enterprise scripts, and accessibility workflows legitimately
    display authentication prompts. Check ticket, signer, expected security context, and target app.
blind_spots:
- zh: 通用端点日志通常不记录窗口内容或 secure desktop；恶意代码可寄生已批准进程，同进程内存外传可能没有子进程或文件。
  en: General endpoint logs often lack window content or secure-desktop state. Malicious code can inhabit an approved process,
    and in-process memory egress may have no child or file.
tuning_guidance:
  paragraphs:
  - zh: 为会显示凭据提示的精确二进制、父链、脚本哈希和维护时段建到期清单；优先处理后台脚本、无工单提示、非安全桌面和提示后首次外联，不以标题关键词单独阻断。
    en: Maintain an expiring inventory of exact binaries, parent chains, script hashes, and maintenance windows allowed to
      show credential prompts. Prioritize background scripts, unticketed prompts, nonsecure desktop, and first egress after
      a prompt, and do not block on title keywords alone.
evidence_refs:
- REF-000732
- REF-000736
