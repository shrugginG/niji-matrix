schema_version: 2.0.0
type: detection-analytic
id: NJA-000226
strategy_ref: DET-000197
name:
  zh: 认证消费者—事务—秘密第二输出关联
  en: Authentication Consumer-Transaction-Secret Second-Output Correlation
summary:
  zh: 恢复认证组件和允许消费者基线，把真实认证事务与未批准消费者及其敏感第二输出连接并分级。
  en: Reconstruct authentication-component and allowed-consumer baselines, then join real transactions to unapproved consumers
    and their sensitive second outputs with tiered results.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
- Network Devices
- Identity Provider
- IaaS
- SaaS
logic:
  paragraphs:
  - zh: 为每个认证节点建立可信组件图：服务/进程、模块或代理 ID、路径与内存区域、hash/signer、注册或 PAM 栈顺序、加载时间、writer、更新事务、业务 owner、允许接收的秘密类别和批准目的地。把当前状态与同版本黄金映像、签名清单和前一可信快照比较；新增、替换、顺序变化、异常
      signer 或无批准消费者输出 change-only，并保留合法升级与同步配置作为反例。
    en: Build a trusted component graph per authentication node containing service or process, module or agent ID, path and
      memory region, hash or signer, registration or PAM-stack order, load time, writer, update transaction, business owner,
      allowed secret class, and approved destination. Compare current state with a same-version golden image, signer inventory,
      and prior trusted snapshot. New or replaced consumers, order change, unexpected signer, or missing approval emits change-only
      while approved upgrade and synchronization remain counterexamples.
  - zh: 将每次登录、密码设置或变化规范为 transaction ID、节点、主体伪名、事务类型、调用消费者、方法和 decision；在同一进程/线程、事务 ID 或十秒窗口内连接文件创建/追加、敏感对象写入、IPC、socket 和网络会话。只有改变组件被真实事务调用输出
      transaction-traversed；未批准消费者产生新目的地但内容未知输出 suspicious-output；受控 canary、文件格式、受害方调查或轮换范围确认认证材料时输出 material-created；外传或后继身份使用只提高后续层级。
    en: Normalize each sign-in, password set, or password change into transaction ID, node, pseudonymous principal, transaction
      type, invoked consumers, method, and decision. Join file creation or append, sensitive-object write, IPC, socket, and
      network session by process or thread, transaction ID, or a ten-second window. A changed component invoked by a real
      transaction emits transaction-traversed. An unapproved consumer creating a new destination with unknown content emits
      suspicious-output. A controlled canary, file format, victim investigation, or rotation scope confirming authentication
      material emits material-created. Exfiltration or later identity use raises only successor tiers.
  - zh: 对 PTA 等跨平面代理，把云 sign-in/correlation ID、代理 ID、节点 IP、转发时间、本地验证请求和代理输出连接。对 Network Provider、PasswordFilter 或 PAM，优先使用组件加载/注册键、认证服务进程、密码变化或登录事务和输出对象。任何分析不得采集、hash
      或比对真实口令；跨主体同一秘密判断只允许在隔离 canary 环境完成。
    en: For cross-plane agents such as PTA, join cloud sign-in or correlation ID, agent ID, node IP, forward time, local validation
      request, and agent output. For Network Provider, PasswordFilter, or PAM, prefer component load or registration key,
      authentication-service process, password-change or sign-in transaction, and output object. The analytic must never collect,
      hash, or compare real passwords; same-secret testing across principals is permitted only with isolated canaries.
data_requirements:
- source_type: authentication-component-state
  name:
    zh: 认证组件、模块、代理与注册状态
    en: Authentication component, module, agent, and registration state
  channel: null
  required_fields:
  - timestamp
  - node_id
  - service_or_process_id
  - component_or_agent_id
  - path_or_memory_region
  - hash_or_signer
  - registration_or_stack_order
  - load_state
  - writer_id
  - update_transaction_id
  - approval_id
  - owner_id
- source_type: authentication-transaction
  name:
    zh: 登录与密码变化事务
    en: Sign-in and password-change transactions
  channel: null
  required_fields:
  - timestamp
  - node_or_tenant_id
  - transaction_id
  - principal_pseudonym
  - transaction_type
  - invoked_component_ids
  - authentication_methods
  - final_decision
  - process_or_service_id
- source_type: authentication-consumer-output
  name:
    zh: 认证消费者文件、IPC 与网络输出
    en: Authentication-consumer file, IPC, and network output
  channel: null
  required_fields:
  - timestamp
  - node_id
  - process_or_thread_id
  - component_id
  - output_type
  - output_object_or_destination_id
  - bytes_written
  - sensitivity_class
  - transaction_id
  - outcome
- source_type: credential-exposure-investigation
  name:
    zh: 凭据暴露调查与轮换范围
    en: Credential-exposure investigation and rotation scope
  channel: null
  required_fields:
  - investigation_id
  - finding_time
  - affected_node_or_tenant
  - material_class
  - affected_principal_scope
  - evidence_object_ids
  - first_possible_exposure
  - last_possible_exposure
  - rotation_status
observables:
- zh: 未批准或异常 signer 的认证消费者被注册/加载，随后同一消费者在真实认证事务附近创建新敏感文件、IPC 或外连。
  en: An unapproved authentication consumer or one with an unexpected signer is registered or loaded and then creates a new
    sensitive file, IPC, or outbound connection near a real authentication transaction.
- zh: PTA/身份代理注册或映像异常，云登录经该代理转发后本地出现非标准材料输出或经调查确认的口令仓库。
  en: A PTA or identity agent has anomalous registration or image state, and cloud sign-ins forwarded through it are followed
    by nonstandard local material output or an investigation-confirmed password repository.
- zh: Network Provider、PasswordFilter 或 PAM 栈变化与后续管理员登录/密码变化及同一服务进程写盘形成链条。
  en: A Network Provider, PasswordFilter, or PAM-stack change forms lineage with later administrator sign-in or password change
    and a disk write by the same service process.
correlation:
  window:
    zh: 组件变化从前一可信快照持续到可信恢复和期间秘密轮换；事务至第二输出默认十秒，代理跨平面允许五分钟，后继使用覆盖暴露材料完整有效期。
    en: Component change begins at the prior trusted snapshot and continues through trusted recovery and rotation of secrets
      exposed during the interval. Use ten seconds from transaction to second output by default, five minutes for cross-plane
      agents, and the full exposed-material lifetime for successor use.
  dimensions:
  - node_or_tenant
  - component_or_agent
  - component_version
  - registration_key_or_stack
  - writer
  - transaction
  - principal_pseudonym
  - process_or_thread
  - output_object_or_destination
  - approval
  - time
false_positives:
- zh: 批准的密码同步、网络凭据管理、SSO/PTA、PAM 集成和帮助台迁移会注册消费者并处理真实秘密。
  en: Approved password synchronization, network credential management, SSO or PTA, PAM integration, and help-desk migration
    register consumers and handle real secrets.
- zh: 认证软件升级、热补丁、灾难恢复和测试 canary 会产生组件与短时输出差异。
  en: Authentication-software upgrade, hot patch, disaster recovery, and test canaries create component and short-lived output
    differences.
blind_spots:
- zh: 平台不记录调用模块、事务 ID 或输出归属时，只能做进程与时间弱关联。
  en: Platforms omitting invoked modules, transaction IDs, or output attribution permit only weak process and time correlation.
- zh: 纯内存副本、内核下层篡改或同一管理员控制黄金映像和日志出口会掩盖状态与输出。
  en: Memory-only copies, compromise below the kernel, or one administrator controlling golden images and log export can hide
    state and output.
tuning_guidance:
  paragraphs:
  - zh: 白名单必须绑定具体组件 hash/signer、注册键或栈位置、业务 owner、允许的秘密类别、受保护目的地、部署窗口和到期，不得永久放行 LSA、sshd、mpnotify、身份连接器或管理员组。先对 change-only
      与 transaction-traversed 建立资产覆盖，再仅在第二输出和调查证据存在时提高到材料结果；敏感值一律字段级丢弃。
    en: Allowances must bind a concrete component hash or signer, registration key or stack position, business owner, permitted
      secret class, protected destination, deployment window, and expiry rather than permanently allowing LSA, sshd, mpnotify,
      identity connectors, or administrator groups. Establish asset coverage for change-only and transaction-traversed first,
      and raise to material outcome only with second-output and investigation evidence. Drop sensitive values at field level.
