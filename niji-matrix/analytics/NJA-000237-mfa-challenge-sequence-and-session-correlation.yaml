schema_version: 2.0.0
type: detection-analytic
id: NJA-000237
strategy_ref: DET-000202
name:
  zh: 多挑战响应序列与会话升级分析
  en: Multi-Challenge Response Sequence and Session Escalation Analytic
summary:
  zh: 聚合同一用户的独立 challenge、拒绝或超时、批准和后继 session，识别真实请求外观下的重复压力。
  en: Aggregate independent challenges, denials or timeouts, approval, and successor sessions for one user to identify repetition
    pressure under genuine-request appearance.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 对每个 user 建立 challenge 状态机，将主认证或恢复入口、challenge 创建、投递状态、factor、用户 denied/timeout/no-response/fraud/approved、token/session
      签发和首个资源访问连接。默认调查条件为十分钟内至少三笔独立 request/correlation ID，或数量超过该用户—应用三十日基线第 99 百分位；任一 fraud report 立即高优先级。若 denied/timeout
      序列后五分钟内从相同或近邻来源出现 approved 并签发 session，输出 approval_after_pressure；只有重复生成无批准时输出 challenge_pressure_attempt；approval 但无
      session 输出 approved_unissued；资源访问是单独最高结果。阈值必须按应用重试语义校准，不能把通知重投当新挑战。
    en: Build a per-user challenge state machine joining primary authentication or recovery entry, challenge creation, delivery
      state, factor, user denial, timeout, nonresponse, fraud report, or approval, token or session issuance, and first resource
      access. A default investigation condition is at least three independent request or correlation identifiers within ten
      minutes, or volume above the user-application 99th percentile over thirty days. Any fraud report is immediately high
      priority. If a denial or timeout sequence is followed within five minutes by approval and session issuance from the
      same or a neighboring origin, emit approval_after_pressure. Repeated generation without approval emits challenge_pressure_attempt;
      approval without a session emits approved_unissued; resource access is a separate highest outcome. Calibrate thresholds
      by application retry semantics and do not count notification redelivery as a new challenge.
