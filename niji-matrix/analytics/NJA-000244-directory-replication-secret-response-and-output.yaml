schema_version: 2.0.0
type: detection-analytic
id: NJA-000244
strategy_ref: DET-000205
name:
  zh: 未批准 DRS 来源与秘密响应联查
  en: Unapproved DRS Origin and Secret Response Join
summary:
  zh: 把 DRS caller、复制权限、secret-bearing response 和材料输出连接为目录复制导出链。
  en: Join DRS caller, replication rights, secret-bearing response, and material output into a directory-replication export
    chain.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 建立 approved_replication_inventory，包含 forest/domain/site、DC 与同步主机 GUID/host/IP、caller account/SID、DRS rights、naming
      contexts、owner、工单与有效期。对每个 DRSBind/GetNCChanges cycle 记录 source host/IP、account、authentication session、target DC、request
      flags、naming context、target object/attribute class、result、response object/value count 与 bytes；连接 4662/MDI 活动和 caller
      权限前态。来源或账户不在批准关系、请求 secret-bearing scope 且 response 成功时输出 unapproved_secret_replication；若只能看到 DRS 连接或被拒请求，分别输出 drs_connection
      或 replication_denied。五分钟内的输出文件、archive 或 egress 提高 material_preserved 置信度。
    en: Build an approved_replication_inventory containing forest, domain, site, domain-controller and synchronization-host
      GUID, host, IP, caller account or SID, DRS rights, naming contexts, owner, case, and validity. For every DRSBind or
      GetNCChanges cycle, record source host or IP, account, authentication session, target DC, request flags, naming context,
      target object or attribute class, result, response object or value count, and bytes, joining Event 4662 or MDI activity
      and caller-rights prior state. Emit unapproved_secret_replication when origin or account lacks an approved relation,
      the request has secret-bearing scope, and the response succeeds. DRS connectivity or a denied request respectively emits
      drs_connection or replication_denied. An output file, archive, or egress within five minutes raises confidence that
      material was preserved.
data_requirements:
- source_type: drs-rpc-replication
  channel: domain-controller network sensor, ETW/RPC, MDI, or equivalent identity sensor
  required_fields:
  - event.timestamp
  - forest.id
  - domain.id
  - source.host
  - source.guid
  - source.ip
  - caller.account
  - caller.sid
  - authentication.session_id
  - target_dc.host
  - target_dc.guid
  - rpc.interface_uuid
  - drs.method
  - request.flags
  - naming_context
  - target.object_id
  - target.attribute_class
  - response.object_count
  - response.value_count
  - response.bytes
  - result
  name:
    zh: DRS RPC 复制
    en: DRS RPC replication
- source_type: directory-service-access
  channel: Windows Security 4662 or equivalent directory audit
  required_fields:
  - event.timestamp
  - domain.id
  - caller.sid
  - subject.logon_id
  - object.name
  - object.type
  - operation.type
  - properties.guid
  - access.mask
  - result
  name:
    zh: 目录服务访问
    en: Directory-service access
- source_type: replication-authority-state
  channel: directory ACL snapshots and approval inventory
  required_fields:
  - domain.id
  - principal.sid
  - right.name
  - right.guid
  - granted_by
  - grant.timestamp
  - source.host_or_guid
  - allowed.naming_context
  - owner
  - approval.id
  - valid.from
  - valid.to
  name:
    zh: 复制权限状态
    en: Replication-authority state
- source_type: material-output
  channel: endpoint file/process/network telemetry on caller host
  required_fields:
  - event.timestamp
  - source.host
  - process.guid
  - caller.sid
  - output.path
  - output.hash
  - output.size
  - material.class
  - target.account_scope
  - destination
  - bytes.out
  name:
    zh: 材料输出
    en: Material output
observables:
- zh: 非 DC 发起 GetNCChanges
  en: Non-DC GetNCChanges
- zh: 未批准复制账户
  en: Unapproved replication account
- zh: 包含秘密的复制范围
  en: Secret-bearing replication scope
- zh: 成功复制响应
  en: Successful replication response
- zh: 复制权限变化
  en: Replication-rights change
- zh: 认证材料输出
  en: Credential-material output
correlation:
  window:
    zh: 覆盖一个目录复制周期，响应后五分钟关联输出，并保留九十天复制权限历史。
    en: Cover one directory-replication cycle, join output during five minutes after response, and retain ninety days of replication-rights
      history.
  dimensions:
  - forest.id
  - domain.id
  - source.guid
  - source.ip
  - caller.sid
  - authentication.session_id
  - target_dc.guid
  - rpc.interface_uuid
  - naming_context
  - target.object_id
  - subject.logon_id
  - output.hash
false_positives:
- zh: 正常 DC 复制、Entra Connect/身份同步、迁移、灾备、目录评估、密码过滤/同步和获批红队可产生 GetNCChanges。必须核对准确 host/GUID、账户、rights、naming context、对象范围、owner、工单与时段；不要按服务账户名、DC
    子网或 RPC 端口全局放行。
  en: Normal domain-controller replication, Entra Connect or identity synchronization, migration, disaster recovery, directory
    assessment, password filtering or synchronization, and authorized red teaming can invoke GetNCChanges. Check exact host
    or GUID, account, rights, naming context, object scope, owner, case, and time. Never globally allow a service-account
    name, domain-controller subnet, or RPC port.
blind_spots:
- zh: 加密 RPC 可能隐藏方法参数与属性，4662 依赖审计配置，MDI 需要 DC 传感器；获批准 DC 或同步主机失陷会通过来源清单，NAT 与多宿主会混淆 IP。若平台只给 DCSync alert 而无 response fields，能证明可疑行为但不能量化返回账户。输出可能只驻留内存或直接经网络流走。
  en: Encrypted RPC can hide method parameters and attributes, Event 4662 depends on audit configuration, and MDI requires
    domain-controller sensors. Compromise of an approved DC or synchronization host passes origin inventory, while NAT and
    multihoming confuse IP. A DCSync alert without response fields proves suspicious behavior but cannot quantify returned
    accounts. Output can remain only in memory or flow directly over the network.
tuning_guidance:
  paragraphs:
  - zh: 以历史 host GUID 和授权关系为主，IP 仅作辅助；逐账户复核 DS-Replication-Get-Changes、All 与 Filtered Set，监控新增、扩大和首次使用。高优先级包括非 DC 来源、工作站/用户网段、krbtgt
      或管理员目标、全 naming context、异常 response 量及随后 archive/egress。按系统版本用授权测试验证传感器可见 method 和 response 字段。
    en: Center on historical host GUID and approved relationship, using IP only as support. Review DS-Replication-Get-Changes,
      All, and Filtered Set per account and monitor grants, expansion, and first use. High-priority conditions include non-DC
      origin, workstation or user segment, krbtgt or administrator target, full naming context, unusual response volume, and
      subsequent archive or egress. Validate method and response fields through authorized testing for each OS and sensor
      version.
  - zh: 对被拒请求先撤销异常来源连接并审查复制权限；成功 secret response 视为域材料潜在暴露，隔离 caller 与相关 DC、撤销非法 DRS rights、保全网络/目录证据并确定账户范围。若 krbtgt、管理员或广泛
      naming context 被返回，启动域级身份恢复：验证可信 DC 与复制状态，轮换特权、用户、gMSA、trust 和 krbtgt 材料，撤销 session/ticket，并监控旧材料后继使用。不得在攻击者仍有目录写权时只做密码重置。
    en: For denied requests, revoke anomalous origin access and review replication rights. Treat a successful secret response
      as potential domain-material exposure, isolate the caller and related DC, remove illegitimate DRS rights, preserve network
      and directory evidence, and determine account scope. If krbtgt, administrator, or a broad naming context was returned,
      initiate domain-level identity recovery by validating trusted DCs and replication, rotating privileged, user, gMSA,
      trust, and krbtgt material, revoking sessions and tickets, and monitoring use of old material. Do not reset passwords
      alone while the adversary retains directory write authority.
