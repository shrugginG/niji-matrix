observables:
- zh: 同一 refresh/TGT family 从与原签发不同且未获批的设备/客户端请求新 proof，并在敏感资源成功使用。
  en: The same refresh or TGT family requests fresh proof from a device or client different from original issuance and not
    approved, followed by successful use at a sensitive resource.
- zh: 新 service/access token 的签名、issued-at 和 audience 正常，但没有相邻原认证，且兑换来源与 client/workload 基线不符。
  en: A fresh service or access token has valid signature, issue time, and audience but no adjacent original authentication,
    while the redemption origin conflicts with client or workload baseline.
- zh: 绑定键/设备应存在却缺失或变化，或同一材料 family 在多个设备并发兑换并产生不同目标结果。
  en: An expected binding key or device is absent or changes, or one material family is redeemed concurrently across devices
    with different destination outcomes.
correlation:
  window:
    zh: 从上游材料原签发持续到过期/撤销，默认最长九十日；兑换到 proof 返回五分钟，proof 到首次资源使用一小时，并按 Kerberos ticket 或 provider token lifetime 调优。
    en: Follow upstream material from original issuance through expiry or revocation, capped by default at ninety days; use
      five minutes from redemption to proof return and one hour from proof to first resource use, tuned to Kerberos ticket
      or provider token lifetime.
  dimensions:
  - authority
  - principal
  - material_family
  - original_authentication
  - request
  - client_or_workload
  - source_device
  - binding_key
  - audience_or_spn
  - scope
  - issued_proof
  - resource
  - session
  - operation
  - time
false_positives:
- zh: normal silent refresh
  en: normal silent refresh
- zh: mobile device roaming
  en: mobile device roaming
- zh: approved multi device client
  en: approved multi device client
- zh: service account rotation
  en: service account rotation
- zh: kerberos ticket cache and domain controller failover
  en: kerberos ticket cache and domain controller failover
- zh: disaster recovery
  en: disaster recovery
blind_spots:
- zh: provider hides refresh or ticket id
  en: provider hides refresh or ticket id
- zh: no binding telemetry
  en: no binding telemetry
- zh: resource omits proof or request id
  en: resource omits proof or request id
- zh: cross tenant logs unavailable
  en: cross tenant logs unavailable
- zh: long lived offline client
  en: long lived offline client
- zh: attacker operates on original device
  en: attacker operates on original device
tuning_guidance:
  paragraphs:
  - zh: 按 provider/protocol 验证 stable family/request/proof 标识和 silent refresh 正常语义，不把所有无 MFA refresh 判为重放。批准项绑定 client/workload
      owner、device class、audience/scope、来源和期限；对 confidential client、移动漫游、离线同步分别建模。binding 降级只增加一个信号，必须再有非许可来源、并发、异常资源或攻击者控制。不得记录
      raw refresh token、TGT 或 access token。
    en: Validate stable family, request, and proof identifiers and normal silent-refresh semantics per provider and protocol;
      do not classify every refresh without MFA as replay. Bind approval to client or workload owner, device class, audience
      and scope, origin, and expiry, with separate models for confidential clients, mobile roaming, and offline sync. Binding
      downgrade adds only one signal and still needs unauthorized origin, concurrency, anomalous resource, or adversary control.
      Never record a raw refresh token, TGT, or access token.
