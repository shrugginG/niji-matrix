schema_version: 2.0.0
type: detection-analytic
id: NJA-000260
strategy_ref: DET-000212
name:
  zh: 上游材料兑换—新证明—资源使用谱系
  en: Upstream-Material Redemption–Fresh Proof–Resource Use Lineage
summary:
  zh: 将 TGT 或 refresh/sign-in-session material 的当前兑换连接到新目标证明及资源结果，寻找缺少当前原始认证、绑定异常或真实操作者分离。
  en: Join current redemption of a TGT or refresh or sign-in-session material to fresh target proof and resource outcomes,
    looking for missing current original authentication, binding anomalies, or separation of the actual operator.
domains:
- enterprise
platforms:
- Active Directory
- Identity Provider
- IaaS
- SaaS
- Containers
logic:
  paragraphs:
  - zh: 规范 authority 的 proof-redemption transaction：Kerberos 保留 client、principal、TGT/安全 ticket 标识（若可用）、requested SPN、ClientAddress、ticket
      options、encryption、request/result time；OAuth/云身份保留 grant_type、subject、client_id、token family/reference、issuer、requested
      audience/scope、source IP/device、sender-binding key thumbprint、request ID 和结果。把返回的 service/access token 以安全 ID、request/correlation
      ID 或提供方 lineage 连接到目标资源的 first accepted use，再连接会话/API 结果。回溯当前源设备和 identity 的原 interactive/MFA/device authentication、material
      issuance 与批准 client/workload；若上游材料从非许可 client/device/source 兑换、binding 缺失/改变、同一 family 并发跨设备、没有可解释的原认证，且新 proof 到达异常资源，则输出
      suspected_upstream_material_reuse。若只有 token refresh 无攻击者控制或异常结果，保持 normal_or_unresolved；后继成功不能说明材料如何取得。
    en: Normalize proof-redemption transactions at the authority. For Kerberos retain client, principal, TGT or safe ticket
      identifier where available, requested SPN, ClientAddress, ticket options, encryption, request and result time. For OAuth
      or cloud identity retain grant_type, subject, client_id, token family or reference, issuer, requested audience and scope,
      source IP and device, sender-binding key thumbprint, request ID, and result. Join the returned service or access token
      by safe identifier, request or correlation ID, or provider lineage to first accepted use at the target resource and
      then to session or API outcome. Look back to original interactive, MFA, and device authentication, material issuance,
      and approved client or workload for the current source device and identity. Emit suspected_upstream_material_reuse when
      upstream material is redeemed from an unauthorized client, device, or origin; binding is missing or changes; one family
      is concurrently used across devices; no original authentication explains it; and fresh proof reaches an anomalous resource.
      A token refresh without adversary-control or anomalous-result evidence remains normal_or_unresolved, and downstream
      success does not reveal how material was acquired.
