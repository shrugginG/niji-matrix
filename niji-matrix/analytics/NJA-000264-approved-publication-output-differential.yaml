schema_version: 2.0.0
type: detection-analytic
id: NJA-000264
strategy_ref: DET-000215
name:
  zh: 批准发布状态—实际展示差分
  en: Approved Publication State–Observed Display Differential
summary:
  zh: 输出批准 release 与实际人类可见页面、banner 或界面之间的未经授权语义和视觉差。
  en: Emit unauthorized semantic and visual differences between an approved release and the human-visible page, banner,
    or interface.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 为高价值展示面登记 surface、owner、规范源、批准 release 和允许的地域/语言/认证变体。事件触发并至少每五分钟用匹配画像取得实际结果，规范化时间戳、nonce 和批准个性化槽后比较语义文本、DOM/UI
      与视觉 hash。
    en: Register surface, owner, canonical source, approved release, and allowed regional, language, or authenticated
      variants for each high-value display. Retrieve actual output on events and at least every five minutes with
      a matching profile, normalize timestamps, nonces, and approved personalization slots, and compare semantic text,
      DOM or UI, and visual hashes.
  - zh: 未经批准可见差分在前后 24 小时连接文件、CMS、对象、壁纸/banner 和部署控制面变化，输出 source-modified、rendered-only-divergence 或 authorized-variant。源保持批准而输出变化时转交绑定
      Analytic。
    en: Join an unauthorized visible difference to file, CMS, object, wallpaper or banner, and deployment changes
      over the surrounding 24 hours and emit source-modified, rendered-only-divergence, or authorized-variant. If
      the source remains approved while output changes, route to the binding analytic.
data_requirements:
- source_type: display-surface-inventory
  name:
    zh: 展示面与批准发布清单
    en: Display surface and approved-release inventory
  channel: null
  required_fields:
  - surface.id
  - surface.type
  - owner.id
  - canonical.source.id
  - approved.release.id
  - variant.profile
  - criticality
- source_type: publication-change-audit
  name:
    zh: 内容发布变更审计
    en: Publication change audit
  channel: null
  required_fields:
  - event.time
  - surface.id
  - source.id
  - actor.id
  - operation
  - object.id
  - hash.before
  - hash.after
  - release.id
  - approval.id
- source_type: display-output-observation
  name:
    zh: 实际展示输出观察
    en: Observed display output
  channel: null
  required_fields:
  - event.time
  - surface.id
  - viewer.profile
  - vantage.id
  - result.status
  - content.hash
  - semantic.hash
  - visual.hash
  - evidence.id
observables:
- zh: 未经批准的语义或视觉输出与当前 release 不一致
  en: Unauthorized semantic or visual output differs from the current release
- zh: 源站批准状态正常而用户观察持续偏离
  en: The origin remains approved while user-visible output persistently diverges
correlation:
  window:
    zh: 同轮观察五分钟；发布变更与展示结果前后 24 小时，按发布周期调优。
    en: Use five minutes for one observation round and 24 hours around publication change and output, tuned to publication
      cadence.
  dimensions:
  - surface.id
  - viewer.profile
  - vantage.id
  - source.id
  - release.id
  - actor.id
  - event.time
false_positives:
- zh: 批准发布/回滚、维护页、A/B 测试、区域化、CDN 缓存和用户壁纸
  en: Approved release or rollback, maintenance pages, A/B testing, localization, CDN cache, and user wallpaper
blind_spots:
- zh: 交互后出现内容、未覆盖认证页面、动态页面无法规范化、无历史 release 或攻击者同步篡改审批
  en: Content appearing after interaction, uncovered authenticated pages, non-normalizable dynamic pages, absent release
    history, or co-tampered approval
tuning_guidance:
  paragraphs:
  - zh: 为每个 surface 登记允许变体和过期时间，按 DOM 区域、语义和视觉组合比较；批准发布身份不得永久白名单。高风险表面保留不依赖生产 CDN/解析的观察点。
    en: Register allowed variants and expiry per surface and combine DOM-region, semantic, and visual comparison;
      never permanently allow an approved publisher identity. Keep a high-risk vantage independent of production CDN
      and resolution.
