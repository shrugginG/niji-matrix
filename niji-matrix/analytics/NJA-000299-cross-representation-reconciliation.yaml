schema_version: 2.0.0
type: detection-analytic
id: NJA-000299
strategy_ref: DET-000235
name:
  zh: 业务对象跨表示对账分析
  en: Business-Object Cross-Representation Reconciliation Analytic
summary:
  zh: 输出同一业务对象在 DB、消息、文档/UI 和外部回执间的未授权版本或值分歧。
  en: Emit unauthorized version or value divergence for one business object across DB, message, document or UI, and
    external receipt.
domains:
- enterprise
platforms: []
logic:
  paragraphs:
  - zh: 为业务对象生成 stable object ID，记录各表示的 source system、version、event time、producer/transform、content or semantic digest、signature
      和 provenance parent。按 object/version 在五分钟内连接正常转换链，并保留 24 小时处理异步回执。
    en: Generate a stable object ID and record source system, version, event time, producer or transform, content
      or semantic digest, signature, and provenance parent for each representation. Join the expected transformation
      chain by object and version over five minutes and retain 24 hours for asynchronous receipts.
  - zh: 比较 DB row/CDC、消息 payload、render/print/PDF/UI digest、external receipt 和 operator action。只有超出允许转换/rounding/eventual-consistency
      SLA 的分歧、异常 producer 和实际消费结果才输出。
    en: Compare DB row or CDC, message payload, render, print, PDF or UI digest, external receipt, and operator action.
      Emit only divergence beyond allowed transforms, rounding, or eventual-consistency SLA with an anomalous producer
      and actual consumption outcome.
data_requirements:
- source_type: representation-provenance
  name:
    zh: 表示与来源谱系
    en: Representation and provenance lineage
  channel: null
  required_fields:
  - event.time
  - object.id
  - object.version
  - representation.type
  - source.system
  - producer.id
  - transform.id
  - content.digest
  - semantic.digest
  - signature.status
  - parent.version
- source_type: db-message-document-state
  name:
    zh: 数据库、消息与文档状态
    en: Database, message, and document state
  channel: null
  required_fields:
  - object.id
  - object.version
  - db.digest
  - message.id
  - message.digest
  - document.id
  - document.digest
  - ui.digest
  - print.digest
- source_type: receipt-consumer-outcome
  name:
    zh: 外部回执与消费结果
    en: External receipt and consumer outcome
  channel: null
  required_fields:
  - object.id
  - receipt.id
  - receipt.digest
  - received.time
  - consumer.id
  - consumer.action
  - approval.id
  - sla.id
observables:
- zh: 同一 object/version 的表示 digest 超出允许转换规则
  en: Representation digests for one object and version differ beyond allowed transforms
- zh: 异常 transform 与 operator/业务 action 相连
  en: An anomalous transform joins an operator or business action
correlation:
  window:
    zh: 同步表示五分钟，异步回执与 action 二十四小时；版本 lineage 保留至少 90 天。
    en: Use five minutes for synchronous representations, 24 hours for asynchronous receipts and actions, and retain
      version lineage for at least 90 days.
  dimensions:
  - object.id
  - object.version
  - representation.type
  - producer.id
  - transform.id
  - receipt.id
  - event.time
false_positives:
- zh: 合法格式转换、rounding、localization、缓存、重算、报告版本和 eventual consistency
  en: Legitimate transformation, rounding, localization, cache, recomputation, report versions, and eventual consistency
blind_spots:
- zh: 无 stable object ID、非确定 render、外部 receipt 不可得、签名在受陷源生成或版本留存短
  en: No stable object ID, nondeterministic rendering, unavailable external receipt, signatures generated by a compromised
    source, or short version retention
tuning_guidance:
  paragraphs:
  - zh: 为每种表示登记允许 transform、rounding、SLA 和 digest 方法；不要比较 raw bytes 代替语义。分歧先标完整性未知，只有 actor/approval/outcome 闭合才判攻击。
    en: Register allowed transforms, rounding, SLA, and digest method per representation; do not compare raw bytes
      instead of semantics. Mark divergence as integrity unknown first and classify attack only when actor, approval,
      and outcome close.
evidence_refs:
