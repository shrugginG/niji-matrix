correlation:
  window:
    zh: 5145 到 4663 或 SMB 成功响应默认六十秒，读取按三十分钟分组，并保留用户、共享和进程三十天基线。
    en: 5145 to 4663 or SMB response within 60s; reads grouped for 30m; user/share/process baseline 30d
  dimensions:
  - server_id
  - subject_logon_id
  - subject_user_sid
  - source_ip
  - client_id
  - process_unique_id
  - logon_luid
  - share_name
  - normalized_object_path
  - mapping_id
  - job_id
  - time
false_positives:
- zh: 文件服务器备份与恢复、反恶意软件或 DLP/分类扫描、Windows Search 或企业索引、Storage Migration Service/RoboCopy、软件发布、电子发现、合法批量分析和用户复制都会产生成功 ReadData。进程签名、服务账户或夜间时间本身都不能永久放行，必须核对
    owner、具体路径、源主机、目标、任务 ID 和有效窗口。
  en: File-server backup and restore, antimalware or DLP and classification scans, Windows Search or enterprise indexing,
    Storage Migration Service or RoboCopy, software distribution, e-discovery, authorized analytics, and user copying all
    produce successful ReadData. A process signature, service account, or nighttime schedule must never become a permanent
    allow rule; verify owner, exact paths, source host, destination, job ID, and validity window.
blind_spots:
- zh: 5145 事件量高且只表达共享访问检查；4663 需要预先配置对象 SACL，服务器记录的 process 通常不是客户端原始进程。客户端 EDR 可能不记录远端文件读取，SMB 加密会阻止网络解析，NAT/跳板会弱化源映射，映射首次出现时间也可能不可得。成功读取事件仍不证明完整文件已保存或随后外传。
  en: Event 5145 is high volume and expresses only share authorization. Event 4663 requires an object SACL in advance, and
    the server-side process is generally not the original client process. Client EDR may omit remote-file reads, SMB encryption
    prevents network parsing, NAT or jump hosts weaken source mapping, and mapping first-seen time may be unavailable. A successful
    read event still does not prove complete retention or later exfiltration.
tuning_guidance:
  paragraphs:
  - zh: 先在少量高价值共享按敏感路径和主体启用成功读取审计，验证 5145、4663、4624 的 LogonId 与路径规范化，再扩大覆盖。把 5145-only、server-read-confirmed 和 client-process-attributed
      分成不同结论等级；按职责和批准作业建立三十日基线，例外必须绑定 owner、源/目标、路径、进程、身份及到期时间。对复用映射子项不要把“未观察到 net use”当正证据，必须有同一 LUID 的映射状态与成功读取。
    en: Pilot successful-read auditing on a small set of high-value paths and principals, validate LogonId and path normalization
      across 5145, 4663, and 4624, then expand. Keep 5145-only, server-read-confirmed, and client-process-attributed as separate
      conclusion levels. Build a thirty-day duty and approved-job baseline, and bind each exception to owner, source and destination,
      path, process, identity, and expiry. For the mapping-reuse child, absence of net use is not positive evidence; require
      mapping state in the same LUID plus a successful read.
