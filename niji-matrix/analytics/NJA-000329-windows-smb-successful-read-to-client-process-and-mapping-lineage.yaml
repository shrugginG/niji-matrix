schema_version: 2.0.0
type: detection-analytic
id: NJA-000329
strategy_ref: DET-000250
name:
  zh: Windows SMB 成功读取与客户端进程/映射谱系
  en: Windows SMB Successful Read to Client Process and Mapping Lineage
summary:
  zh: 按对象、主体、会话与结果字段实现“Windows SMB 成功读取与客户端进程/映射谱系”。
  en: Implement Windows SMB Successful Read to Client Process and Mapping Lineage with object, principal, session, and outcome
    fields.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: '在重点文件服务器启用 Audit Detailed File Share，并只把 5145 中请求 ReadData、带 SubjectLogonId、IpAddress、ShareName、RelativeTargetName
      和 AccessCheckResult 的事件作为共享权限检查候选；拒绝项用于暴露探测，允许项仍不能证明字节返回。对已配置 ReadData SACL 的敏感对象，在同一服务器按 SubjectLogonId、规范化共享/对象路径和短时间窗寻找
      4663 ReadData；若网络传感器能解析 SMB，再以 status=success 且 response data length 大于零的 READ 响应补强。4663 或成功 READ 可把结论提升为服务器提供内容，但仍不证明攻击者完整保存文件。

      把服务器 SubjectLogonId 接到 4624 Type 3 的用户和源 IP，再解析为稳定客户端资产。客户端侧用进程唯一 ID、用户 SID/LUID、SMB 网络连接和已验证的远端文件读取事件恢复发起进程；映射清单或 GPO/登录脚本清单把盘符规范化到
      UNC，并标记映射是否属于同一登录上下文。按三十分钟读取窗口聚合敏感对象数、路径扇出及服务器读取结果，与身份职责、获批准备份/索引/杀毒/迁移作业和维护窗口比较。只在成功读与未经批准来源闭合时输出 confirmed_share_content_read；只有
      5145 时输出 access_check_only。后续暂存或外联可提高优先级但不是确认读取的必需条件。'
    en: 'Enable Audit Detailed File Share on priority file servers and treat event 5145 requests containing ReadData, SubjectLogonId,
      IpAddress, ShareName, RelativeTargetName, and AccessCheckResult only as share authorization candidates. Denials expose
      probing; allowed checks still do not prove returned bytes. For sensitive objects with a ReadData SACL, find event 4663
      ReadData on the same server by SubjectLogonId, normalized share and object path, and a short window. If a network sensor
      parses SMB, strengthen the result with a READ response having success status and nonzero response data length. Event
      4663 or a successful READ raises the finding to server-provided content but still does not prove the adversary retained
      the complete file.

      Join server SubjectLogonId to type-3 event 4624 for principal and source IP, then resolve a stable client asset. On
      the client, recover the initiating process through process unique ID, user SID or LUID, SMB network connection, and
      a validated remote-file read event. Mapping inventory or Group Policy and logon-script inventory normalizes drive letters
      to UNC and identifies whether the mapping belongs to the same logon context. Aggregate sensitive object count, path
      fan-out, and server read results over thirty minutes and compare them with principal duty, approved backup, indexing,
      antimalware, or migration jobs, and maintenance windows. Emit confirmed_share_content_read only when a successful read
      closes with an unapproved source; emit access_check_only for 5145 alone. Later staging or egress can raise priority
      but is not required to confirm the read.'
