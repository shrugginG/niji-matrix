observables:
- zh: 需人工核实的正常活动。
  en: getblob_success_with_bytes
- zh: 需人工核实的正常活动。
  en: accountkey_sas_or_anonymous_auth
- zh: 需人工核实的正常活动。
  en: missing_requester_object
- zh: 需人工核实的正常活动。
