correlation:
  window:
    zh: 控制或密钥事件到读取默认一小时，读取片段三十分钟，批准作业基线保留三十天。
    en: control or key event to reads 1h; read episode 30m; approved-work baseline 30d
  dimensions:
  - tenant_id
  - subscription_id
  - storage_account_id
  - requester_object_or_app_id
  - authentication_type
  - caller_ip
  - object_key
  - request_or_correlation_id
  - job_id
  - time
false_positives:
- zh: AzCopy 数据迁移、备份/恢复、媒体分发、静态网站、客户 SAS 下载、合法跨租户数据处理和应急取证均可形成相同成功读取；部分旧应用只能使用 Shared Key。
  en: AzCopy migration, backup or restore, media distribution, static websites, customer SAS downloads, legitimate cross-tenant
    processing, and incident-response forensics can produce the same successful reads. Some legacy applications can use only
    Shared Key.
blind_spots:
- zh: Azure Blob 资源日志在 diagnostic setting 创建并路由前不被收集；Activity Log 不能替代数据面。日志把不同 SAS 都归为 SAS，AccountKey/SAS/Anonymous 可能没有实际人身份；ResponseBodySize
    表示服务写出响应字节，不证明攻击者完整保留。
  en: Azure Blob resource logs are not collected until a diagnostic setting routes them, and Activity Log is not a data-plane
    substitute. Logs group different SAS types under SAS, AccountKey, SAS, or Anonymous can lack a human identity, and ResponseBodySize
    shows response bytes written by the service rather than complete adversary retention.
tuning_guidance:
  paragraphs:
  - zh: 用测试 OAuth、AccountKey、user-delegation SAS、service/account SAS、Range GetBlob 和匿名读验证 AuthenticationType、RequesterObjectId
      与响应字段；例外必须绑定精确 storage account、container、source、client/job、有效期和 SAS policy，不按 AzCopy 名称全局放行。
    en: Validate AuthenticationType, RequesterObjectId, and response fields with controlled OAuth, AccountKey, user-delegation
      SAS, service or account SAS, Range GetBlob, and anonymous reads. Bind exceptions to exact storage account, container,
      origin, client or job, lifetime, and SAS policy rather than globally allowing AzCopy.
