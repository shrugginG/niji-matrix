schema_version: 2.0.0
type: detection-analytic
id: NJA-000334
strategy_ref: DET-000253
name:
  zh: Azure Blob 成功读取与共享授权载体谱系
  en: Azure Blob Successful Read and Shared Authorization-Carrier Lineage
summary:
  zh: 按对象、主体、会话与结果字段实现“Azure Blob 成功读取与共享授权载体谱系”。
  en: Implement Azure Blob Successful Read and Shared Authorization-Carrier Lineage with object, principal, session, and outcome
    fields.
domains:
- enterprise
platforms:
- IaaS
logic:
  paragraphs:
  - zh: '对高价值 storage account 的 Blob 服务配置 diagnostic setting，将 StorageRead 资源日志送到独立 Log Analytics/Event Hub。筛选 OperationName=GetBlob
      或等价正文读取，要求 StatusCode 为 200/206、StatusText 表示成功且 ResponseBodySize 大于零；以 AccountName、ObjectKey/Uri、RequestIdHeader/CorrelationId、TimeGenerated、CallerIpAddress
      和 UserAgentHeader 形成 provider_delivered_blob。只见容器列举、GetBlobProperties、失败请求或控制面 listKeys 时分别保持 discovery、metadata、attempt
      或 credential_capability。

      按 AuthenticationType 将 OAuth 与 AccountKey、SAS、Anonymous 分层。OAuth 路径连接 RequesterTenantId/ObjectId/AppId/Upn 与 Entra sign-in、RBAC
      和批准工作负载；AccountKey/SAS/Anonymous 若缺 RequesterObjectId，则连接最近的 Microsoft.Storage/storageAccounts/listkeys/action、SAS/公开访问或
      allowSharedKeyAccess/publicNetworkAccess 变化、来源网络与对象范围。对 Storm-0501 型序列，在一小时内出现 storageAccounts/write 或 listkeys 后从新公网来源以
      AccountKey/SAS 大量读取敏感对象时提高优先级。正常 AzCopy、备份、迁移、恢复和 CDN 流量必须按 owner、job、目的地和时段排除。'
    en: 'Configure a diagnostic setting for the Blob service on high-value storage accounts and route StorageRead resource
      logs to independent Log Analytics or Event Hub. Select OperationName=GetBlob or an equivalent body read and require
      StatusCode 200 or 206, successful StatusText, and ResponseBodySize greater than zero. Build provider_delivered_blob
      from AccountName, ObjectKey or Uri, RequestIdHeader or CorrelationId, TimeGenerated, CallerIpAddress, and UserAgentHeader.
      Container listing, GetBlobProperties, a failed request, or control-plane listKeys remains discovery, metadata, attempt,
      or credential_capability respectively.

      Separate OAuth from AccountKey, SAS, and Anonymous through AuthenticationType. Join OAuth to RequesterTenantId, RequesterObjectId,
      RequesterAppId, RequesterUpn, Entra sign-in, RBAC, and approved workload. When AccountKey, SAS, or Anonymous lacks RequesterObjectId,
      join recent Microsoft.Storage/storageAccounts/listkeys/action, SAS or public-access state, allowSharedKeyAccess or publicNetworkAccess
      changes, source network, and object scope. For a Storm-0501-like chain, raise priority when storageAccounts/write or
      listkeys is followed within one hour by high-volume sensitive-object reads through AccountKey or SAS from a new public
      origin. Exclude normal AzCopy, backup, migration, restore, and CDN traffic by owner, job, destination, and window.'
