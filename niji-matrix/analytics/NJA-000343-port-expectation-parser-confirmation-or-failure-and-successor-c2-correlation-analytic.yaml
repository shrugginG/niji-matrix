  - network_session_id
  - source_ip
  - source_port
  - destination_ip
  - destination_port
  - transport
  - detected_application
  - original_application
  - expected_parser_application
  - application_to_server
  - application_to_client
  - sensor_event_type
  - direction
  - sensor_action
  - signature_id
  - parser_anomaly
  - bytes_to_server
  - bytes_to_client
- source_type: application-aware-firewall
  name:
    zh: 应用感知防火墙策略记录
    en: Application-Aware Firewall Policy Records
  channel: NGFW/App-ID traffic log
  required_fields:
  - receive_time
  - event_time
  - source_ip
  - destination_ip
  - policy_rule
  - principal_id
  - firewall_application
  - source_zone
  - destination_zone
  - firewall_session_id
  - source_port
  - destination_port
  - policy_flags
  - transport
  - policy_action
  - bytes_to_server
  - bytes_to_client
  - session_end_reason
  - policy_rule_id
  - application_changes
  - nonstandard_port_flag
