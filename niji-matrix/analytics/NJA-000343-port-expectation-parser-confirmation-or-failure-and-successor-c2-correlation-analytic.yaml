    en: Expected-Service and Policy Registry
  channel: CMDB, firewall policy, proxy/parser configuration, and custom-service registry
  required_fields:
  - policy_version
  - source_role
  - destination_role
  - destination_identity
  - transport
  - destination_port
  - expected_service
  - allowed_application
  - parser_profile
  - policy_rule_id
  - service_owner
  - approved_purpose
  - valid_from
  - valid_to
observables:
- zh: 内容解析器在环境预期不同服务的端口确认 HTTP SSH 或另一应用
  en: A payload-aware parser confirms HTTP, SSH, or another application on a port expected for a different service
- zh: 443 或 53 的预期 TLS 或 DNS 解析失败而自定义双向会话继续
  en: The expected TLS or DNS parser fails on 443 or 53 while custom bidirectional traffic continues
- zh: 端口规则放行但应用识别或独立解析器报告其他或未知协议
  en: A port rule allows a session while App-ID or an independent parser reports another or unknown application
- zh: 同一端点进程维持错配流并产生命令结果或后继动作
  en: The same endpoint process maintains the mismatched flow and produces a command, result, or follow-on action
correlation:
  window:
    zh: 会话至端点结果默认十五分钟，周期性信标或协议仿真回复扩展至二十四小时；策略版本必须覆盖事件发生时刻。
    en: Join sessions to endpoint outcomes within fifteen minutes by default and recurring beacons or protocol-emulation responses
      within twenty-four hours; the policy version must be valid at event time.
  dimensions:
  - network_session_id
  - firewall_session_id
  - device_id
  - process_start_key
  - source_role
  - destination_identity
  - destination_port
  - expected_service
  - detected_application
  - attempted_analyzer
  - policy_rule_id
  - policy_version
  - c2_outcome_id
  - time
false_positives:
- zh: 已登记自定义服务与厂商管理端口
  en: Registered custom services and vendor management ports
- zh: 开发测试 服务网格 端口共享与迁移例外
  en: Development tests, service meshes, port sharing, and migration exceptions
- zh: STARTTLS 代理 TLS 终止与解析器误判
  en: STARTTLS, proxies, TLS termination, and parser misclassification
blind_spots:
- zh: 加密或未支持的专有协议及负载采样
  en: Encrypted or unsupported proprietary protocols and sampled payloads
- zh: 短流 单向流 DPD 关闭或缺少解析签名
  en: Short or one-way flows, disabled DPD, or missing parser signatures
- zh: NAT 代理遮蔽目标及缺少端点进程遥测
  en: NAT or proxy obscuring the destination and missing endpoint process telemetry
tuning_guidance:
  paragraphs:
  - zh: expected_service 必须来自当地 inventory/policy 与 owner，不用 IANA 单独定性。为合法 custom service 登记 exact source/destination/application/parser/port/purpose/expiry。unknown/failed
      只启动调查，需 C2 outcome 或 validated protocol response 升级。对 443/53 不设全局例外；按 role 与 destination baseline。定期以批准测试流量验证 DPD/App-ID/parser
      coverage 和 field mapping。
    en: expected_service must come from local inventory and policy with an owner, never IANA alone. Register exact source,
      destination, application, parser, port, purpose, and expiry for legitimate custom services. Unknown or failed starts
      investigation only and requires a C2 outcome or validated protocol response for escalation. Do not globally exempt 443
      or 53; baseline by role and destination. Regularly validate DPD, App-ID, parser coverage, and field mappings with approved
      test traffic.
