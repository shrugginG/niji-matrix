  - network_session_id
  - source_ip
  - source_port
  - destination_ip
  - destination_port
  - transport
  - detected_services
  - duration
  - bytes_to_server
  - bytes_to_client
  - connection_state
  - missing_bytes
  - transport_history
  - packets_to_server
  - packets_to_client
- source_type: zeek-analyzer
