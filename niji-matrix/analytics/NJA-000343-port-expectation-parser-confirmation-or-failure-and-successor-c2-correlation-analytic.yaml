schema_version: 2.0.0
type: detection-analytic
id: NJA-000343
strategy_ref: DET-000257
name:
  zh: 端口预期、解析确认/失败与后继 C2 关联分析
  en: Port Expectation Parser Confirmation or Failure and Successor C2 Correlation Analytic
summary:
  zh: 分级输出未登记端口、协议错配、误放行或解析偏移，并仅在后继 C2 成立时确认技术。
  en: Emit unregistered-port, semantic mismatch, mistaken allowance, and parser-displacement states, confirming the technique
    only with successor C2.
domains:
- enterprise
platforms:
- Network
- Windows
- Linux
logic:
  paragraphs:
  - zh: 对每个 session 用 source/destination role、destination identity、transport、port、rule 与时间查找 versioned expected_service；无登记时输出
      unregistered_port 而非 mismatch。actual semantics 优先使用 Zeek confirmed service、Suricata app_proto directional fields、firewall
      Application 或协议仿真 handshake；port number 永不直接赋值 actual。若 actual 与 expected 不同输出 semantic_mismatch。若 firewall action=allow
      且 matched rule/service 只基于 port 或 nonstandard flag/application-default 不匹配，输出 port_policy_allowance；若 expected analyzer
      failure、service null/unknown、directional app mismatch 或 semantic transaction 缺失，输出 parser_displacement。最后连接同 process
      的 command/result/child/file、重复 bidirectional beacon 或可验证 C2 response；只有 mismatch + defensive effect + successor C2 同时成立才输出
      mismatch_c2_confirmed。
    en: For every session, find a versioned expected_service using source and destination role, destination identity, transport,
      port, rule, and time. Emit unregistered_port rather than mismatch where no registration exists. Prefer Zeek confirmed
      service, Suricata app_proto directional fields, firewall Application, or protocol-emulation handshake for actual semantics;
      never assign actual from port number. Emit semantic_mismatch when actual differs from expected. Emit port_policy_allowance
      when firewall action is allow and the matched rule or service is port-only or the nonstandard flag and application-default
      relationship disagrees. Emit parser_displacement when the expected analyzer fails, service is null or unknown, directional
      applications disagree, or semantic transactions are absent. Finally join commands, results, children, or files from
      the same process, a repeated bidirectional beacon, or a validated C2 response. Emit mismatch_c2_confirmed only when
      mismatch, defensive effect, and successor C2 all coexist.
