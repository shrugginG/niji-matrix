schema_version: 2.0.0
type: detection-analytic
id: NJA-000351
strategy_ref: DET-000262
name:
  zh: 受害端 C2 成功与多视角暴露差分析
  en: Victim C2 Success and Multi-Vantage Exposure Differential Analytic
summary:
  zh: 对请求资格与防守来源抑制分别做配对差分，并以受害端 C2 结果和前端规则确认。
  en: Run paired differentials for request qualification and defensive-source suppression, confirming them with victim C2
    outcomes and front rules.
domains:
- enterprise
platforms:
- Network
- Windows
- Linux
logic:
  paragraphs:
  - zh: 第一步从 victim telemetry 建立 candidate endpoint：已确认恶意/未授权 process 在同一 destination 上产生 repeated bidirectional callback，或出现
      task/config/payload、command/result、protocol-emulated C2 response；只凭 reputation/IOC 不设 victim_success。第二步按 endpoint+protocol+15-minute
      bucket 规范化 probe/edge/origin events，建立 response_variant=(connection_result,status,header/body hash,length,redirect,certificate,edge_action,origin_reached,origin_status)。request-qualified
      分支要求同 vantage/time 只改变 request_variant 后，implant-congruent 变体稳定 origin_reached/C2-like response，而 generic/invalid 变体进入
      benign/error surface，至少重复两次或有 provider rule/audit。defender-suppressed 分支要求固定 request_variant/time，defender/scanner class
      被 deny/reset/decoy，而 neutral/victim-aligned class 成功，至少两个 source classes 且有 matched rule/server deny 或两个独立重复。temporal-supporting
      分支在 7–30 天窗口比较 listener/service open state 与 victim/actor activity；因当前 taxonomy defer，它提高 parent confidence 而不自动映射 NJS。最终只有
      victim_success 与 exposure branch 同 endpoint/campaign 且差异不能由 approved policy 解释时输出 selective_c2_exposure_confirmed。
    en: 'First establish a candidate endpoint from victim telemetry: a confirmed malicious or unauthorized process creates
      repeated bidirectional callbacks to one destination, or a task, configuration, payload, command or result, or protocol-emulated
      C2 response appears. Reputation or an IOC alone does not set victim_success. Second, normalize probe, edge, and origin
      events by endpoint, protocol, and 15-minute bucket and construct response_variant from connection result, status, header
      and body hashes, length, redirect, certificate, edge action, origin-reached state, and origin status. The request-qualified
      branch requires a stable origin-reached or C2-like response for an implant-congruent variant and a benign or error surface
      for a generic or invalid variant while vantage and time remain fixed, repeated at least twice or supported by provider
      rule or audit evidence. The defender-suppressed branch holds request variant and time fixed and requires denial, reset,
      or decoy for a defender or scanner class and success for a neutral or victim-aligned class across at least two source
      classes, plus a matched rule or server deny record or two independent repetitions. The temporal-supporting branch compares
      listener and service-open state with victim or actor activity across seven to thirty days. Because its taxonomy is deferred,
      it raises parent confidence without mapping an NJS. Emit selective_c2_exposure_confirmed only when victim_success and
      an exposure branch share endpoint and campaign and approved policy does not explain the difference.'
