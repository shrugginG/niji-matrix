  - response_variant
  - device_id
  - process_start_key
  - network_session_id
  - c2_task_id
  - campaign_cluster
  - time
false_positives:
- zh: 合法反爬 抗滥用 DDoS 扫描拦截与速率限制
  en: Legitimate anti-bot, abuse, DDoS, scan blocking, and rate controls
- zh: 地域合规 mTLS 私有 API 和租户授权门
  en: Geographic controls, mTLS, private APIs, and tenant authorization gates
- zh: CDN 缓存 灰度发布 灾备和批准诱捕平台
  en: CDN caching, staged releases, disaster recovery, and approved deception platforms
blind_spots:
- zh: 无受害端进程链或无法独立证实端点用于 C2
  en: No victim process lineage or independent evidence that the endpoint is C2
- zh: 一次性令牌 加密协议或隐私约束阻止安全复现
  en: One-time tokens, encrypted protocols, or privacy limits preventing safe reproduction
- zh: 服务提供方日志缺失且攻击者识别所有可用探针视点
  en: Provider logs are unavailable and the actor recognizes every available probe vantage
- zh: Anycast GeoDNS 缓存和短时监听造成不可配对观察
  en: Anycast, GeoDNS, caching, and brief listeners prevent matched observations
tuning_guidance:
  paragraphs:
  - zh: 为 approved external services 保存 owner、tenant/resource、purpose、allowed source classes、condition fields、rule ID/version、origin
      set、release window 和 expiry。不要按 CDN/provider/domain 永久 allow，也不要把 security-vendor block 单独定性。先以 victim_success、provider
      rule/audit 或 repeated matched A/B 提升置信；一次只改变一个 request/vantage factor。对 body/cookie/token 先 hash/redact，禁止把活跃 victim
      credential 放入外部 probe。主动测量只在授权、owned、sinkholed、seized 或 provider-coordinated 范围内运行；其余使用被动/多组织 evidence。定期用批准 canary
      验证 request ID、edge action 与 origin route 字段能关联。
    en: For approved external services, retain owner, tenant and resource, purpose, allowed source classes, condition fields,
      rule ID and version, origin set, release window, and expiry. Do not permanently allow a CDN, provider, or domain and
      do not classify a security-vendor block alone. Raise confidence first from victim_success, provider rule or audit, or
      repeated matched A/B observations, changing one request or vantage factor at a time. Hash or redact bodies, cookies,
      and tokens and never place an active victim credential into an external probe. Run active measurement only in authorized,
      owned, sinkholed, seized, or provider-coordinated scope; otherwise use passive and multi-organization evidence. Regularly
      use approved canaries to verify that request ID, edge action, and origin route fields join correctly.
