schema_version: 2.0.0
type: detection-analytic
id: NJA-000360
strategy_ref: DET-000268
name:
  zh: 文件缓存读取到票据凭据输出关联
  en: File-Cache Read to Ticket-Credential Output Correlation
summary:
  zh: 对已识别的FILE/DIR缓存关联实际读取、调用进程与安全检验输出，区分打开缓存与已取得票据。
  en: For identified FILE or DIR caches, join actual reads, caller processes, and safely inspected output to distinguish cache opening from
    acquired tickets.
domains:
- enterprise
platforms:
- Linux
logic:
  paragraphs:
  - zh: 先按主机实际krb5配置、运行态缓存名称和owner建立FILE/DIR缓存清单，不把/tmp/krb5cc固定为唯一位置。对这些路径预配置Linux Audit读取规则，按同一audit事件序列连接SYSCALL、PATH与PROCTITLE，保留success、pid/ppid、auid、uid/euid、exe、name和inode。以进程启动记录消除PID复用，按对象owner与批准服务角色识别越权或不符用途的读取。只读打开或access检查先输出cache_read_candidate，不证明完整内容返回。
    en: Build a FILE or DIR inventory from actual krb5 configuration, runtime cache names, and owners rather than assuming /tmp/krb5cc is
      the only location. Preconfigure Linux Audit read rules for these paths and join SYSCALL, PATH, and PROCTITLE records by audit event
      serial, retaining success, pid or ppid, auid, uid or euid, exe, name, and inode. Use process-start records to disambiguate reused PIDs
      and compare object ownership with approved service roles to detect unauthorized or inconsistent reads. A read-only open or access check
      initially yields cache_read_candidate, without proving full content return.
  - zh: 再关联同进程或明确派生进程的复制文件、外送对象或取证内存，在受限检验环境确认ccache/KRB-CRED结构及principal、realm、服务、寿命与会话密钥存在性，仅保存安全摘要。原对象和输出对应且接收者受攻击者控制时输出confirmed_ticket_acquisition；只含无法用于认证的票据密文时标记ciphertext_only，不能声称已可Pass-the-Ticket。KCM、KEYRING、MEMORY和macOS
      API读取须另部署传感器，本分析不以文件读规则假装覆盖它们。
    en: Then join copied files, transferred objects, or forensic memory from the same process or an explicitly linked child. In a restricted
      inspection environment, validate ccache or KRB-CRED structure, principal, realm, service, lifetime, and session-key presence while
      retaining only safe digests. Matching source and output with an adversary-controlled recipient yields confirmed_ticket_acquisition.
      Label ciphertext_only when the output contains ticket ciphertext insufficient for authentication, without claiming readiness for Pass-the-Ticket.
      KCM, KEYRING, MEMORY, and macOS API reads need separate sensors; file-read rules do not cover them.
data_requirements:
- source_type: linux-file-cache-inventory
  name:
    zh: 实际文件缓存清单
    en: Actual file-cache inventory
  channel: krb5 configuration and approved runtime inventory
  required_fields:
  - host_id
  - cache_backend
  - cache_name
  - path
  - owner_uid
  - device
  - inode
  - valid_from
  - valid_to
- source_type: linux-audit-cache-read
  name:
    zh: Linux 缓存读取审计
    en: Linux cache-read audit
  channel: 'auditd preconfigured file read rules: SYSCALL/PATH/PROCTITLE'
  required_fields:
  - audit_timestamp
  - audit_serial
  - success
  - syscall
  - pid
  - ppid
  - auid
  - uid
  - euid
  - exe
  - name
  - inode
  - proctitle
- source_type: linux-process-start
  name:
    zh: Linux 进程启动身份
    en: Linux process-start identity
  channel: auditd EXECVE/SYSCALL or validated endpoint process sensor
  required_fields:
  - timestamp
  - host_id
  - pid
  - process_start_time
  - ppid
  - exe
  - uid
- source_type: controlled-cache-output-inspection
  name:
    zh: 受限缓存输出检验
    en: Restricted cache-output inspection
  channel: controlled incident/lab artifact inspection
  required_fields:
  - inspection_time
  - host_id
  - process_start_key
  - source_object_id
  - output_artifact_id
  - output_digest
  - cache_format
  - principal
  - realm
  - service
  - ticket_lifetime
  - session_key_present
  - recipient_control
observables:
- zh: 非批准reader成功读取其他UID的FILE/DIR缓存并产生可映射的票据凭据输出。
  en: An unapproved reader successfully reads another UID FILE or DIR cache and produces a mapped ticket-credential output.
- zh: 会话缓存被复制到不符合其owner、生命周期和用途的暂存对象，且内容结构和会话密钥存在性得到确认。
  en: A session cache is copied to a staging object inconsistent with its owner, lifecycle, and purpose, with format and session-key presence
    confirmed.
correlation:
  window:
    zh: 读取到本机输出默认十分钟，到外送默认三十分钟；对象保留原生命周期及配置变更时间，进程按启动时刻而非只按PID关联。
    en: Default ten minutes from read to local output and thirty minutes to transfer; retain object lifecycle and configuration-change times
      and join processes by start time rather than PID alone.
  dimensions:
  - host_id
  - audit_serial
  - uid
  - auid
  - process_start_key
  - cache_name
  - device
  - inode
  - principal
  - realm
  - output_digest
false_positives:
- zh: 合法klist、kinit、SSO消费者、备份、故障排查、迁移与取证可读取或复制缓存；部分授权运维由root执行。
  en: Legitimate klist, kinit, SSO consumers, backup, troubleshooting, migration, and forensics read or copy caches; some authorized operations
    run as root.
blind_spots:
- zh: Audit规则未预配、记录丢失、同进程恶意代码、root/内核控制、离线磁盘和非FILE backend可避开。文件事件不暴露读取字节，单纯success只说明系统调用成功。
  en: Missing prior audit rules, dropped records, malicious code in an approved process, root or kernel control, offline disks, and non-FILE
    backends can evade. File events do not expose bytes read, and success alone only establishes syscall success.
- zh: 压缩或加密暂存、纯内存复制和无法取得输出时只能报告读取风险；已有票据不一定仍有效。
  en: Compressed or encrypted staging, memory-only copying, and unavailable output limit the result to read risk. An existing ticket need
    not remain valid.
tuning_guidance:
  paragraphs:
  - zh: 以真实backend与owner界定审计目标，先在测试主机验证规则能覆盖openat/read并正确拼接PATH。允许例外须绑定reader版本、owner、工单、范围与输出保管，不能永久放行root或所有Kerberos工具。集中平台保留摘要与会话密钥存在性标记，完整票据及密钥留在受限证据环境。
    en: Scope audit targets by actual backend and owner, and first verify on test hosts that rules cover openat or read and join PATH correctly.
      Bind exceptions to reader version, owner, approval, scope, and output custody rather than permanently allowing root or all Kerberos
      tools. Centralize digests and session-key-presence flags while keeping complete tickets and keys in restricted evidence storage.
evidence_refs:
