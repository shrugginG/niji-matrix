schema_version: 2.0.0
type: detection-analytic
id: NJA-000363
strategy_ref: DET-000270
name:
  zh: 仓库秘密版本与取回范围分析
  en: Repository Secret Version and Retrieval-Scope Analytic
summary:
  zh: 将仓库级传输事件提升为需核对具体秘密版本的调查候选。
  en: Turn repository-level transfer events into investigation candidates requiring concrete secret-version reconciliation.
domains:
- enterprise
platforms:
- GitHub Enterprise Cloud
logic:
  paragraphs:
  - zh: 在受控扫描环境解析允许仓库的历史对象，记录 repository_id、commit_oid、blob_oid、path、material_class、record_role、introduced_commit、removed_commit 与证据引用，秘密正文留在受限证据库。将
      git.clone 与 git.fetch 的 actor、repository_id、时间和 hashed_token 连接该暴露清单及批准任务；无版本对象范围的服务事件只输出 repository-exposure-candidate。 hashed_token
      只在实际凭据和传输类型提供时作为增强键，缺失不意味着取得或采集失败。
    en: Parse authorized repository history in a controlled scanner, retaining repository ID, commit and blob OIDs, path, material class,
      record role, introducing and removing commits, and evidence reference; keep secret content in restricted evidence storage. Join clone
      and fetch actor, repository ID, time, and hashed token to the exposure inventory and approved work. A service event lacking transferred-object
      scope yields only repository-exposure-candidate. Use hashed_token only as an enrichment key when the credential and transport provide
      it; its absence establishes neither acquisition nor collection failure.
  - zh: 用调查中保全的客户端仓库对象清单、受控传输清单或实际输出检查具体 blob 是否进入接收者控制；深度 clone、分支范围和 fetch 不一定覆盖全历史。确认取得含秘密的历史 blob 并核对删除提交或复制关系后，才能标注次生副本。没有客户端证据时不臆造文件读取事件，也不因仓库含秘密就声称每次
      clone 都取得它；后续登录只作为独立风险信号。
    en: Use preserved client-repository objects, a controlled transfer manifest, or actual output to determine whether the particular blob
      entered recipient control. Shallow clones, branch selection, and fetches need not cover all history. Only confirmed receipt of a secret-bearing
      historical blob plus a removal commit or copy relationship establishes the child. Without client evidence, do not invent file-read
      events or assert that every clone acquired a secret merely because the repository contains one; subsequent sign-in is an independent
      risk signal.
data_requirements:
- source_type: github-git-transfer-audit
  name:
    zh: GitHub Git 传输审计
    en: GitHub Git Transfer Audit
  channel: GitHub Enterprise Cloud audit streaming or REST audit API include=git; timestamp maps native @timestamp; repository_id uses native
    repository_id or verified repo_id mapping; hashed_token is optional by credential/transport
  required_fields:
  - timestamp
  - action
  - actor
  - repository_id
  - transport_protocol
- source_type: historical-secret-object-inventory
  name:
    zh: 防守方生成的秘密历史对象索引
    en: Defender-Generated Historical Secret Object Index
  channel: Authorized repository scanner output
  required_fields:
  - repository_id
  - commit_oid
  - blob_oid
  - path
  - material_class
  - record_role
  - lineage_evidence_id
  - scan_time
- source_type: investigated-transfer-object-manifest
  name:
    zh: 调查取得的客户端或传输对象清单
    en: Investigated Client or Transfer Object Manifest
  channel: Preserved client repository or controlled transfer evidence; not a native clone-log field
  required_fields:
  - evidence_id
  - recipient_id
  - repository_id
  - observed_time
  - received_blob_oids
  - completeness
- source_type: approved-repository-reader
  name:
    zh: 仓库批准读者与任务
    en: Approved Repository Readers and Jobs
  channel: Repository ownership and CI job inventory
  required_fields:
  - actor
  - repository_id
  - job_id
  - purpose
  - valid_from
  - valid_until
  - allowed_history_scope
observables:
- zh: 含暴露历史对象的仓库被职责外主体 clone 或 fetch
  en: Clone or fetch of a repository with exposed historical objects by an out-of-duty reader
- zh: 接收对象清单实际包含已确认秘密 blob 且可核对次生记录关系
  en: A received-object manifest actually contains a confirmed secret blob with verifiable secondary-record lineage
correlation:
  window:
    zh: 将一次传输前后六十分钟与作业关联，保留至少九十日事件基线；历史对象索引覆盖秘密暴露窗口且记录完整性。
    en: Correlate a transfer with jobs within sixty minutes and retain at least a ninety-day event baseline; history indexing covers the
      exposure window and records completeness.
  dimensions:
  - repository_id
  - actor
  - hashed_token
  - commit_oid
  - blob_oid
  - recipient_id
  - job_id
  - time
false_positives:
- zh: 新开发者全量 clone、镜像、合规扫描和事故保全
  en: New-developer full clones mirroring compliance scans and incident preservation
- zh: 合法构建从浅 clone 改为全量历史或执行签名验证
  en: Legitimate builds changing from shallow clones to complete history or signature verification
blind_spots:
- zh: 服务端 Git 事件没有逐文件读取或传输 blob 清单，缺少客户端证据时不能确证秘密取得
  en: Server Git events lack per-file reads and transferred-blob manifests so acquisition cannot be confirmed without client evidence
- zh: 已外传 clone 的后续离线搜索、公开匿名访问与未覆盖的 web/API 下载
  en: Later offline searches of exfiltrated clones public anonymous access and uncovered web or API downloads
- zh: Git 事件仅短期留存且 streaming 启用前不会补记
  en: Short Git-event retention and no backfill before streaming is enabled
- zh: SSH、匿名或不同凭据类型可能没有可用 token 标识；只依赖 hashed_token 会漏掉这些传输。
  en: SSH, anonymous, or other credential paths may lack a usable token identifier; relying only on hashed_token misses those transfers.
tuning_guidance:
  paragraphs:
  - zh: 提前开启并验证 Git 事件外送，按仓库与作业约束 CI 例外，不把 token 或开发者身份永久全局放行。以含无权限测试字符串的历史提交验证全量与浅 clone、指定分支和增量 fetch 的分级结果，要求缺少对象清单时保持候选。用这些实验调整窗口，确保撤销秘密仍保留暴露记录而不持续制造高危有效性断言。
    en: Enable and validate Git-event export in advance, scoping CI exceptions by repository and job rather than globally allowing tokens
      or developer identities. Use historical commits containing nonprivileged test strings to verify grading for full and shallow clones,
      selected branches, and incremental fetches; absent object manifests must remain candidates. Tune windows with those experiments and
      preserve exposure records after revocation without repeatedly asserting high-risk validity.
