schema_version: 2.0.0
type: detection-analytic
id: NJA-000364
strategy_ref: DET-000271
name:
  zh: Kubernetes 普通配置秘密响应分析
  en: Kubernetes Ordinary-Configuration Secret-Response Analytic
summary:
  zh: 用资源版本暴露清单解释职责外 Pod 或 ConfigMap 读取。
  en: Interpret out-of-duty Pod or ConfigMap reads with a versioned exposure inventory.
domains:
- enterprise
platforms:
- Kubernetes
logic:
  paragraphs:
  - zh: 受控扫描批准的 Pod 与 ConfigMap，标记实际明文认证秘密所在字段及 resourceVersion，排除仅有 secretKeyRef、模板变量、示例和掩码的对象。以 auditID 合并同次 API 请求，选择 get/list 的 ResponseComplete
      与成功 responseStatus，将 user.username、sourceIPs、objectRef 和 requestURI 连接资源清单与工作负载/运维职责。对 list 必须核对实际返回集合，不能只用 namespace 推断所有对象均返回。
    en: Scan authorized Pods and ConfigMaps in a controlled environment, marking actual plaintext authentication-secret fields and resource
      versions while excluding secretKeyRef-only objects, placeholders, examples, and masks. Merge stages by auditID and select successful
      get or list ResponseComplete events. Join user, source IPs, object reference, and request URI to resource inventory and workload or
      administrative duty. For list, reconcile the actual returned set rather than inferring that every object in the namespace was returned.
  - zh: Metadata 级别只能形成 configured-secret-read-candidate；要确认某值返回，需要受保护的 RequestResponse 证据或客户端产物，核对资源版本和含值字段。该内容只能在隔离解析器处理，告警输出对象、字段类别和证据指针，避免普通日志成为新秘密副本。正常
      Secret 资源读取转交受管理保管边界审查，不能为扩大本分析覆盖而自动标作未保护。
    en: Metadata audit yields only configured-secret-read-candidate. Confirming a returned value requires protected RequestResponse evidence
      or client output matching resource version and secret-bearing field. Process content only in an isolated parser and emit object, field
      class, and evidence pointer so ordinary logs do not become new secret copies. Direct Secret-resource reads go to managed-custody boundary
      review rather than being automatically labeled unprotected to expand coverage.
data_requirements:
- source_type: kubernetes-api-audit
  name:
    zh: Kubernetes API 审计
    en: Kubernetes API Audit
  channel: kube-apiserver audit.k8s.io/v1; audit_id=auditID request_received_timestamp=requestReceivedTimestamp source_ips=sourceIPs request_uri=requestURI
    object_ref=objectRef response_status.code=responseStatus.code; cluster_id is collector-assigned source context, not native audit Event
    data
  required_fields:
  - cluster_id
  - audit_id
  - stage
  - request_received_timestamp
  - verb
  - user.username
  - source_ips
  - request_uri
  - object_ref
  - response_status.code
- source_type: ordinary-config-secret-inventory
  name:
    zh: 普通配置秘密版本清单
    en: Ordinary-Configuration Secret Version Inventory
  channel: Authorized configuration scanner output; resource_version maps native metadata.resourceVersion
  required_fields:
  - cluster_id
  - namespace
  - kind
  - name
  - resource_version
  - field_path
  - material_class
  - scan_time
  - owner
  - approved_reader_scope
- source_type: protected-api-response-evidence
  name:
    zh: 受保护响应证据
    en: Protected Response Evidence
  channel: Selective RequestResponse audit or preserved client output in restricted evidence storage
  required_fields:
  - evidence_id
  - audit_id
  - cluster_id
  - returned_object_set
  - resource_versions
  - secret_field_classification
  - completeness
observables:
- zh: 职责外主体成功读取已确认含明文秘密的普通配置对象
  en: Successful out-of-duty reads of ordinary configuration confirmed to contain plaintext secrets
- zh: 完整响应或客户端产物确认具体含值字段进入接收面
  en: Complete responses or client output confirming particular secret-bearing fields entered the recipient surface
correlation:
  window:
    zh: 按 auditID 关联整个事务，前后十五分钟核对工作负载与工单；内容版本必须对应响应时刻。
    en: Join the full transaction by auditID and reconcile workload and work-order context within fifteen minutes; content version must match
      response time.
  dimensions:
  - cluster_id
  - audit_id
  - namespace
  - object_ref.name
  - user.username
  - source_ips
  - resource_version
  - time
false_positives:
- zh: 合法控制器 reconcile、运维排障、灾备导出和秘密修复扫描
  en: Legitimate controller reconciliation troubleshooting recovery export and secret-remediation scans
blind_spots:
- zh: 未配置审计、只留 Metadata、响应被截断或扫描版本与读取时内容不一致
  en: Missing audit Metadata-only retention truncated responses or scan versions inconsistent with read-time content
- zh: Pod 内直接读取环境或日志、Docker API 与非 Kubernetes 接口不在本分析覆盖
  en: Direct in-Pod environment or log reads Docker APIs and other non-Kubernetes interfaces are outside this analytic
tuning_guidance:
  paragraphs:
  - zh: 先用无权限测试秘密分别验证 get、带 selector 的 list、分页和 Metadata/RequestResponse 分级，确认不会把 secretKeyRef 当作值。允许规则绑定控制器身份、namespace、对象类型及工作负载职责，不永久放行所有
      service account。部署前评估正文审计的保密和成本，只把最小必要证据送入隔离库；无正文时保持候选并通过调查补证。
    en: Test get, selector-based list, pagination, and Metadata versus RequestResponse grading with nonprivileged secrets, ensuring secretKeyRef
      is never treated as a value. Bind allow rules to controller, namespace, resource type, and workload duty rather than all service accounts.
      Assess confidentiality and cost before response auditing, send only necessary evidence to isolated storage, and retain candidate status
      when content needs investigation.
