schema_version: 2.0.0
type: detection-analytic
id: NJA-000383
strategy_ref: DET-000279
name:
  zh: 云镜像源范围与收集器事实输出关联
  en: Cloud Mirror Source Scope and Collector Fact-Output Correlation
summary:
  zh: 核对镜像变更、实际接收与解析输出，识别未经批准扩大的内部通信观察范围。
  en: Compare mirror changes, actual receipt, and parsed output to identify unapproved expansion of internal-communication
    visibility.
domains:
- enterprise
platforms:
- IaaS
logic:
  paragraphs:
  - zh: 对 GCP v1.compute.packetMirrorings.insert、patch 和 delete 保存事件时镜像资源版本，恢复 source、filter、collector 和操作者；request body 缺失时从独立资源快照补齐，不能假定审计自带完整旧新状态。将镜像有效区间与收集器接收计数和已批准源范围比较，识别来源从单个实例扩大到未批准实例或子网、目的地更换以及到期后持续接收。
    en: Preserve event-time mirror-resource versions for GCP v1.compute.packetMirrorings.insert, patch, and delete to reconstruct
      source, filter, collector, and actor. Supplement missing request bodies with independent resource snapshots instead
      of assuming audit records contain complete old and new state. Compare validity intervals and collector receipt against
      approved source scope to identify expansion from one instance to unapproved instances or subnets, destination changes,
      and receipt after expiry.
  - zh: 以镜像资源、源实例或接口、收集器和时间连接实际收包，再关联收集器中攻击者生成的地址关系或协议结果。镜像创建只达 capture-requested，收包计数只达 packet-received，分析员对产物解码只达 facts-exposed；确认事实返回仍需可核查的结果产物。删除镜像不能抹去事件时观察范围，跨项目收集器只改变授权风险，不直接证明已取得环境知识。
    en: Join actual packet receipt by mirror resource, source instance or interface, collector, and time, then correlate address-relationship
      or protocol results generated by the adversary at the collector. Mirror creation yields capture-requested, receipt counters
      packet-received, and analyst decoding facts-exposed. Confirming fact return still requires a verifiable result artifact.
      Mirror deletion does not erase event-time observation scope, and a cross-project collector changes authorization risk
      rather than independently proving environmental knowledge.
data_requirements:
- source_type: gcp-mirror-admin-audit
  name:
    zh: GCP 镜像管理审计
    en: GCP mirror administration audit
  channel: Cloud Audit Logs Admin Activity
  required_fields:
  - timestamp
  - project_id
  - principal_email
  - method_name
  - resource_name
  - operation_id
  - status
- source_type: mirror-resource-version
  name:
    zh: 事件时镜像资源版本
    en: Event-time mirror resource version
  channel: independently retained configuration snapshots
  required_fields:
  - timestamp
  - project_id
  - mirror_id
  - source_resources
  - filter
  - collector_target
  - enabled
  - resource_version
- source_type: collector-receipt-and-result
  name:
    zh: 收集器收包与结果证据
    en: Collector receipt and result evidence
  channel: collector counters and restricted forensic store
  required_fields:
  - timestamp
  - collector_id
  - source_resource
  - received_packets
  - artifact_hash
  - record_locator
  - fact_class
  - inference_level
  - result_origin
  - return_evidence_locator
- source_type: mirror-approval-contract
  name:
    zh: 镜像批准数据合同
    en: Mirror approval data contract
  channel: change and asset management
  required_fields:
  - ticket_id
  - owner
  - mirror_id
  - source_scope
  - filter_scope
  - collector_target
  - valid_from
  - valid_to
  - purpose
observables:
- zh: 镜像源范围或目标未获批准地改变，并在有效期内出现对应收集器收包和环境关系输出
  en: An unapproved mirror source or target change is followed by corresponding collector receipt and environmental-relationship
    output during its validity
- zh: 镜像删除或禁用后保留的历史快照显示曾覆盖关键内部通信，现态清单已无法解释该观察机会
  en: Historical snapshots retained after mirror deletion or disabling show coverage of critical internal communications no
    longer explainable from current inventory alone
correlation:
  window:
    zh: 覆盖完整镜像资源有效期，按事件时版本关联删除后七日的收集器产物；缺少稳定 mirror ID 时只在十五分钟内按源、目标和过滤器降级匹配。
    en: Span the full mirror validity and use event-time versions to join collector artifacts for seven days after deletion;
      without a stable mirror ID, use source, destination, and filter only within a fifteen-minute lower-confidence match.
  dimensions:
  - project_id
  - principal_email
  - operation_id
  - mirror_id
  - resource_version
  - source_resource
  - collector_id
  - artifact_hash
  - ticket_id
  - time
false_positives:
- zh: 获批 NDR、迁移验证、容量测量、故障诊断和合规监测
  en: Approved NDR, migration validation, capacity measurement, troubleshooting, and compliance monitoring
blind_spots:
- zh: 提供方内部复制、物理 TAP、合法收集器内部被劫持、快照缺失和无持久产物的实时解析。Admin Activity 不保证记录完整过滤器或资源旧值。
  en: Provider-internal copying, physical taps, compromise within an approved collector, missing snapshots, and real-time
    parsing without retained artifacts. Admin Activity does not guarantee complete filters or old resource values.
tuning_guidance:
  paragraphs:
  - zh: 以源资源和业务数据合同评分范围扩张，不能永久放行安全项目、服务账户或现有 collector。先验证项目审计中的 methodName、身份和资源字段以及独立快照时效；把请求成功与长操作完成区分开。对收集器只上送必要事实类别与溯源键，并保留网络加密仍暴露元数据的事实。
    en: Score scope expansion using source resources and business data contracts rather than permanently allowing security
      projects, service accounts, or existing collectors. Validate audit methodName, principal and resource fields and snapshot
      freshness first, distinguishing accepted requests from completed long-running operations. Export only necessary fact
      classes and provenance keys from collectors, and retain the distinction that network encryption can still expose metadata.
