schema_version: 2.0.0
type: detection-analytic
id: NJA-000407
strategy_ref: DET-000293
name:
  zh: Windows 系统画像请求与批准用途分析
  en: Windows System-Profile Request and Approved-Use Analytic
summary:
  zh: 从诊断命令和完整脚本块识别 OS、硬件与修补属性请求，并依据执行来源和批准任务输出调查项。
  en: Recognize OS, hardware, and patch requests in diagnostic commands and complete script blocks, reporting them against
    execution origin and approved work.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 收集已启用的 Sysmon Event 1，并在启用 Script Block Logging 的 Windows PowerShell 5.1 环境按 script_block_id 和 message_total 重组 Event
      4104。解析 systeminfo 的实际执行而排除 /?，从 wmic os、baseboard、cpu 或 Get-CimInstance/Get-WmiObject 对 Win32_OperatingSystem、Win32_BaseBoard、Win32_Processor、Win32_QuickFixEngineering
      的读取恢复请求对象；排除 Create、Reboot、Set 等改变状态的方法。仅匹配字符串、脚本内容被截断或动态构造未解析时保留待解释状态，不把命令名称当作成功返回。
    en: Collect enabled Sysmon Event 1 and, on Windows PowerShell 5.1 with Script Block Logging, reassemble Event 4104 by
      script_block_id and message_total. Parse actual systeminfo execution excluding /?, and recover request objects from
      wmic os, baseboard, or cpu and Get-CimInstance/Get-WmiObject reads of Win32_OperatingSystem, Win32_BaseBoard, Win32_Processor,
      or Win32_QuickFixEngineering. Exclude state-changing methods such as Create, Reboot, and Set. String-only matches, truncated
      scripts, or unresolved dynamic construction remain uninterpreted candidates, and command names are not successful returns.
  - zh: 按事件时间把原生设备和 User 映射为 host_id 与 principal_id；4104 的 event_process_id 只能在同主机且 process_start_time 至 process_end_time
      区间内映射到 process_guid，缺少终止时间时受最大已验证生存期限制，候选多于一个则保持 process_unresolved。以同一 process_guid、父 GUID 与 logon_guid 在初始十五分钟内组合属性请求，并与台账中的主体、主机、query_scope、允许父进程及有效期核验。明确不匹配且台账对该范围完整时可标记
      outside_approved_profile；身份、台账或父链缺失则为 context_unknown，不能自动作未批准结论。
    en: Resolve native device and User to host_id and principal_id at event time. Map Event 4104 event_process_id to process_guid
      only on the same host within process_start_time and process_end_time, bounded by a validated maximum lifetime when termination
      is missing; multiple candidates remain process_unresolved. Combine attribute requests by process_guid, parent GUID,
      and logon_guid in an initial fifteen-minute window, and check principal, host, query_scope, permitted parent, and validity
      against the register. A definite mismatch with a complete register for that scope can yield outside_approved_profile.
      Missing identity, register, or ancestry yields context_unknown rather than automatic unauthorized status.
  - zh: 输出 query_attempt 并保留请求字段类别、上下文状态和原始事件定位。此分析不消费命令输出、API 返回值、网络事件、文件读取或当前资产库属性，因此不输出已取得的 OS 版本、硬件型号、补丁清单或后继门控结论。进程内
      Win32/.NET getter 和未接入的远程 WMI 查询是明确盲区；签名与常见系统路径不构成豁免。
    en: Emit query_attempt with requested field categories, context state, and raw-event locations. This analytic consumes
      no command output, API returns, network events, file reads, or current inventory attributes and therefore emits no acquired
      OS version, hardware model, patch list, or successor-gating conclusion. In-process Win32/.NET getters and unintegrated
      remote WMI queries are explicit gaps. A signature or common system path does not grant exemption.
data_requirements:
- source_type: windows-sysmon-process-create
  name:
    zh: 已配置的 Sysmon 进程创建
    en: Configured Sysmon process creation
  channel: Microsoft-Windows-Sysmon/Operational Event ID 1
  required_fields:
  - native_host_name
  - event_time
  - process_guid
  - parent_process_guid
  - process_id
  - image
  - command_line
  - native_principal
  - logon_guid
- source_type: windows-powershell-script-block
  name:
    zh: 已启用的 Windows PowerShell 脚本块
    en: Enabled Windows PowerShell script blocks
  channel: Microsoft-Windows-PowerShell/Operational Event ID 4104
  required_fields:
  - native_host_name
  - event_time
  - event_process_id
  - script_block_id
  - message_number
  - message_total
  - script_block_text
- source_type: event-time-device-principal-map
  name:
    zh: 事件时间设备与主体映射
    en: Event-time device and principal map
  channel: Deployment-maintained enrolled-device and directory identity mapping
  required_fields:
  - native_host_name
  - host_id
  - native_principal
  - principal_id
  - valid_from
  - valid_until
- source_type: windows-process-lifetime-map
  name:
    zh: Windows 进程生存期映射
    en: Windows process-lifetime map
  channel: Sysmon Event 1 and Event 5 correlation service
  required_fields:
  - host_id
  - process_id
  - process_guid
  - parent_process_guid
  - native_principal
  - logon_guid
  - process_start_time
  - process_end_time
  - mapping_completeness
- source_type: approved-system-profile-register
  name:
    zh: 批准系统画像作业台账
    en: Approved system-profiling job register
  channel: Deployment-maintained support and inventory approval register
  required_fields:
  - host_id
  - principal_id
  - query_scope
  - allowed_parent_image
  - job_id
  - valid_from
  - valid_until
  - register_completeness
  - policy_version
- source_type: windows-query-collection-health
  name:
    zh: Windows 查询采集健康与规范化合同
    en: Windows query collection health and normalization contract
  channel: Collector enrollment and effective policy records
  required_fields:
  - host_id
  - event_time
  - sysmon_policy_id
  - powershell_policy_id
  - collector_version
  - parser_version
  - collection_gap
  - clock_error_bound
observables:
- zh: systeminfo 或明确的 OS、硬件和有限补丁管理类读取，发起来源与登记任务不符。
  en: systeminfo or explicit OS, hardware, and limited patch-management reads from an origin inconsistent with registered
    work.
- zh: 同一进程谱系在短时间内请求多类主机画像属性，且批准上下文无法确认。
  en: One process lineage requests several host-profile attribute classes in a short period without confirmable approval context.
correlation:
  window:
    zh: 初始十五分钟用于组合请求，进程映射严格受实际生存期限制；台账按事件时刻生效。窗口是部署起点，尚未验证检测性能。
    en: Start with fifteen minutes to combine requests, constrain process mapping to actual lifetimes, and apply approval
      validity at event time. The window is a deployment starting point without validated detection performance.
  dimensions:
  - host_id
  - principal_id
  - process_guid
  - parent_process_guid
  - logon_guid
  - script_block_id
  - query_scope
  - event_time
  - policy_version
false_positives:
- zh: 安装兼容性检查、支持工单、OEM 诊断与资产盘点会请求相同属性，多次查询也可能是排错重试。
  en: Installation compatibility checks, support tickets, OEM diagnostics, and asset inventories request the same attributes,
    and repeated calls can be troubleshooting retries.
blind_spots:
- zh: 脚本日志未启用或不完整、PID 生存期不可解、直接 getter、未接入远程管理及批准身份被盗会降低覆盖；本分析没有返回内容。
  en: Disabled or incomplete script logging, unresolved PID lifetimes, direct getters, unintegrated remote management, and
    stolen approved identities weaken coverage. This analytic has no return content.
tuning_guidance:
  paragraphs:
  - zh: 按支持、安装、部署与普通终端角色维护不同 query_scope 基线，使用到期且可追责的作业允许项。只在台账覆盖完整时把缺少匹配当作范围外，把临时排障保留为可核验例外。核对脚本分片重组、命令转义与 WMIC 是否在目标系统实际可用；不能按
      Microsoft 签名、PowerShell 或 systeminfo 名称整体过滤。
    en: Maintain query_scope baselines separately for support, installation, deployment, and ordinary endpoints, using expiring
      and attributable job allowances. Treat missing approval as outside scope only when the register is complete, and preserve
      temporary troubleshooting as a verifiable exception. Check script-fragment reconstruction, command escaping, and actual
      WMIC availability on the target system. Do not filter wholesale by Microsoft signatures, PowerShell, or the systeminfo
      name.
