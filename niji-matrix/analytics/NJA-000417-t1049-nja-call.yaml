  - timestamp
  - call_id
  - call_start_time
  - call_end_time
  - api_name
  - caller_pid
  - caller_tid
  - process_create_time
  - process_instance_id
  - image
  - callsite_address
  - caller_module
  - caller_memory_type
  - address_family
  - table_class
  - input_buffer_present
  - return_status
  - returned_size_value
  - decode_status
- source_type: optional-custom-tcp-table-result-capture
  name:
    zh: 经授权启用时的可选结果缓冲区采集
    en: Optional result-buffer capture when authorized and enabled
  channel: null
  required_fields:
  - device_id
  - timestamp
  - call_id
  - address_family
  - table_class
  - table_entry_count
  - captured_entry_count
  - capture_truncated
  - rows
  - local_address
