    zh: 仪器化同步采集的进程生存期和地址映射
    en: Process lifetimes and address mappings captured with instrumentation
  channel: null
  required_fields:
  - device_id
  - timestamp
  - process_instance_id
  - caller_pid
  - process_create_time
  - process_end_time
  - image
  - mapping_start
  - mapping_end
  - module_path
  - memory_type
  - mapping_valid_from
  - mapping_valid_until
