  - timestamp
  - collector_version
  - sensor_configuration
  - hooked_api
  - coverage_status
  - capture_enabled
  - dropped_events
  - result_capture_enabled
  - capture_limit
observables:
- zh: 由具体调用位置和进程生存期归属的 TCP 表查询。
  en: TCP-table inquiries attributed through a concrete call site and process lifetime.
- zh: 大小询问、错误、空表、非空返回与截断的不同结果类别。
  en: Distinct result categories for size inquiries, errors, empty tables, nonempty returns, and truncation.
- zh: 实现连接查询的载体代码与批准诊断职责不一致。
  en: Query-implementing carrier code inconsistent with approved diagnostic duties.
correlation:
  window:
    zh: 同一 call_id 的入口到返回；进程与地址映射仅在各自事件时有效期内关联，诊断任务比较先采用十分钟窗口。
    en: Entry through return under one call_id; join process and address mappings only within event-time validity, with an
      initial ten-minute diagnostic-task comparison.
  dimensions:
  - device_id
  - process_instance_id
  - call_id
  - caller_module
  - address_family
  - table_class
  - job_id
false_positives:
- zh: 终端诊断、资产代理、防火墙和安全产品自身的连接表查询。
  en: Connection-table queries by endpoint diagnostics, inventory agents, firewalls, and security products.
- zh: JIT、插件或产品升级改变调用位置和内存映射。
  en: JIT, plugins, or product upgrades changing call sites and memory mappings.
blind_spots:
- zh: 未覆盖进程、替代接口、未注入成功或传感器被篡改时没有可靠调用观测。
  en: Uncovered processes, alternate interfaces, failed instrumentation, or sensor tampering remove reliable invocation observation.
- zh: 未捕获返回内容时不能确认表行；结果截断、错误布局与地址映射失效会限制语义。
  en: Uncaptured returns cannot confirm rows; truncation, wrong layouts, and stale address mappings constrain semantics.
- zh: 此部署设计未完成性能、跨位数、受保护进程和抗规避验证，不应被描述为当前已有全量产品能力。
  en: This deployment design lacks performance, cross-bitness, protected-process, and evasion-resistance validation and is
    not an existing complete product capability.
tuning_guidance:
  paragraphs:
  - zh: 先以受控正常调用验证 IPv4 与 IPv6、不同表类别、大小询问、失败、空表、截断与监听行，确认调用者和 socket 所属 PID 分离。仪器化应保留原函数签名、调用约定和错误行为，并按位数与进程类型评估安全加载；实际部署失败时关闭该分析并报告覆盖缺口。优先保留调用元数据，敏感结果行按最小范围、加密与权限采集，禁止因
      DLL 合法或命令行普通而全局放行。
    en: Validate IPv4 and IPv6, table classes, size inquiries, failure, empty tables, truncation, and listeners using controlled
      benign calls, verifying separation of reader and socket-owner PIDs. Instrumentation must preserve signatures, calling
      conventions, and error behavior and assess safe loading by bitness and process type. Disable the analytic and report
      a coverage gap when deployment fails. Prefer call metadata, minimize and protect sensitive result rows, and do not globally
      allow a legitimate DLL or ordinary command line.
