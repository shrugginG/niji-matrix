observables:
- zh: 实际内联入口与服务枚举或状态请求在同一宿主任务链中正面关联。
  en: An actual inline entry positively links to service enumeration or status requests in one carrier task chain.
- zh: 句柄来源、API状态和已验证返回支持具体服务条目或所选视图的空集，缺页和错误保留部分或未知。
  en: Handle provenance, API status, and validated returns support particular entries or emptiness of the selected view, while
    missing pages and errors remain partial or unknown.
- zh: 宿主名称正常但task代码或查询范围与批准工作不符时保留独立线索。
  en: Task code or inquiry scope outside approved work remains an independent lead despite an ordinary carrier name.
correlation:
  window:
    zh: 用宿主实际生存期、明确任务begin/end与调用/返回嵌套关联；一秒仅可在本地验证后辅助排序，不能替代task或handle因果键。
    en: Join actual carrier lifetimes, explicit task begin/end, and call/return nesting. One second can aid locally validated
      ordering but cannot replace task or handle causal keys.
  dimensions:
  - host_id
  - capture_session
  - process_guid
  - process_id
  - thread_id
  - task_id
  - call_id
  - handle_value
  - handle_generation
  - code_hash
false_positives:
- zh: 合法支持插件、监控代理和安装器在既有宿主中读取服务，产生相同API链。
  en: Legitimate support plugins, monitoring agents, and installers read services inside existing carriers and produce the
    same API chains.
- zh: 缓冲重试、权限过滤与服务状态变化可造成部分或空视图，并非查询者隐藏行为。
  en: Buffer retries, permission filters, and changing service states can yield partial or empty views without concealment
    by the querier.
blind_spots:
- zh: 未插桩宿主、直接或其他接口、已打开句柄和失配模块入口可能使任务、目标或结果不可归属。
  en: Uninstrumented carriers, alternate interfaces, preopened handles, and mismatched module entries can lose task, target,
    or result attribution.
- zh: API hook与内联入口采集可能被绕开或干扰，返回不证明外传，也不保证全库存或有效调用身份已知。
  en: API hooks and inline-entry capture can be bypassed or disturbed. Returns establish neither exfiltration nor whole inventories
    or known effective call identity.
tuning_guidance:
  paragraphs:
  - zh: 部署前在隔离良性宿主验证A/W编码、32/64位结构、句柄重用、尺寸探测、MORE_DATA续页、缺权静默省略、零项与PAUSED等状态，测试采集器自身不覆盖last-error或损害宿主。将实际task哈希与到期时间登记，保留失败和部分返回，禁止只按签名宿主或全局API白名单压制。上述是实施验收条件，本研究没有编译或执行BOF，也无测得覆盖率。
    en: Before deployment, validate A/W encoding, 32/64-bit structures, handle reuse, sizing, MORE_DATA continuation, silent
      permission omissions, zero entries, and states such as PAUSED in an isolated benign carrier. Check that capture neither
      overwrites last-error nor destabilizes the carrier. Register actual task hashes and expiry, preserve failed and partial
      returns, and avoid suppression through signed-carrier or global API allowlists. These are deployment acceptance conditions;
      no BOF was compiled or executed and no coverage rate measured here.
