schema_version: 2.0.0
type: detection-analytic
id: NJA-000425
strategy_ref: DET-000302
name:
  zh: 定制时间读取的类型与结果归属分析
  en: Typed-Result and Attribution Analytic for Instrumented Time Reads
summary:
  zh: 在明确部署的函数观察范围内保留原始时间类型、状态与采集边界，核验结果确被读取而不将正常计时直接判为规避。
  en: Within explicitly deployed function coverage preserve raw temporal types status and capture boundaries to verify acquisition
    without directly classifying ordinary timing as evasion.
domains:
- enterprise
platforms:
- Windows
- Linux
logic:
  paragraphs:
  - zh: 此分析要求单独部署的自定义函数进入/退出采集，可通过验证过的 Frida Interceptor 或等价观察器实现，不假设 EDR 默认提供。只分析部署清单明确验证的 GetSystemTime、GetSystemTimeAsFileTime、GetTickCount、libc
      time 和 clock_gettime；清单记录 OS/用户 ABI、实际解析模块和符号、函数签名、结构布局、进程范围、挂接方式与时间段。进入时保存调用 ID、线程、参数和输出指针，退出时有界读取本次输出；地址不可读、只有进入、异常终止或采集丢失均保持
      unknown，不以空值代表零时刻。采集器在事件发生时登记主机、启动实例和进程创建身份，PID 不能跨寿命单独关联。 raw_errno 对没有此合同的 void/计数函数为空，result_state、位宽、单位和纪元由已验证解码器产生，并非
      API 原生字段。
    en: This analytic requires separately deployed custom function-entry and exit collection through a validated Frida Interceptor
      or equivalent observer, not a default EDR feed. Analyze only deployment-validated GetSystemTime, GetSystemTimeAsFileTime,
      GetTickCount, libc time, and clock_gettime. The manifest records OS/user ABI, actually resolved module and symbol, signature,
      layouts, process scope, hook method, and coverage interval. Retain call ID, thread, arguments, and output pointer on
      entry and bounded output on return. Unreadable pointers, entry-only calls, exceptional termination, and collection loss
      remain unknown rather than zero time. The collector records host boot and process-creation identity at the event, and
      PID alone never joins across lifetimes. raw_errno is null for void or counter functions without that contract; result_state
      width units and epoch are validated decoder metadata rather than native API fields.
  - zh: GetSystemTime 与 GetSystemTimeAsFileTime 返回 void，不构造 BOOL 成功值，也不将随手读取的 LastError 当作状态。前者按目标 ABI 读取完整 SYSTEMTIME 的wYear、wMonth、wDayOfWeek、wDay、wHour、wMinute、wSecond、wMilliseconds
      八个 16 位字段并验证日历范围，UTC 由接口合同给出；后者从输出 FILETIME 的 dwHighDateTime 和 dwLowDateTime 组成无符号 64 位数，单位为自 1601-01-01 UTC 起的 100
      纳秒，不能当作 Unix 秒。返回后的有效缓冲区采集才支持 result-observed，未读到完整结构只保留调用。GetTickCount 的 DWORD 本身是 32 位毫秒读数，零值可以有效，约 49.7 天回绕；不从小值断言新启动设备，也不把一个计数直接转换成
      UTC 日期。
    en: 'GetSystemTime and GetSystemTimeAsFileTime return void: invent no BOOL success value and do not treat an incidental
      LastError read as status. Decode all eight 16-bit SYSTEMTIME fields wYear wMonth wDayOfWeek wDay wHour wMinute wSecond
      and wMilliseconds for the target ABI and validate calendar ranges, deriving UTC from the interface contract. Combine
      output FILETIME dwHighDateTime and dwLowDateTime into an unsigned 64-bit value of 100-nanosecond intervals since 1601-01-01
      UTC rather than Unix seconds. Valid post-return buffer capture supports result-observed; incomplete structures establish
      only a call. GetTickCount directly returns a 32-bit DWORD millisecond reading, with valid zero and approximately 49.7-day
      wrap. A small value proves neither a fresh boot nor a UTC date.'
  - zh: Linux time 读取按用户 ABI 的 time_t 位宽和符号解释，保持 1970-01-01 UTC 纪元秒及原始值；-1 的错误/纪元前表示存在歧义，未确认接口和错误合同不强判有效读数。clock_gettime 只在返回
      0 且完整 timespec 可读时解码 tv_sec 与 tv_nsec，纳秒字段须在 0 到 999999999；返回 -1 时保存当次原始 errno，而非消费残留缓冲区。clock_id 必须保留：CLOCK_REALTIME
      是可调整日历，Linux CLOCK_MONOTONIC 不计系统挂起时长，CLOCK_BOOTTIME 计入挂起，CPU-time clocks 则不是开机时长。libc/vDSO 路径按实际模块和架构验证；只挂 syscall、单一
      libc 符号或一条指令不能声称捕获所有读取，重复挂接亦须用调用链去重。 32 位进程若采用 64 位 time_t，必须验证完整 ABI 返回寄存器或采用等价完整返回采集，不能把指针宽度的单个 Frida retval 当作完整
      64 位值。
    en: 'Decode Linux time using the user ABI''s time_t width and signedness, retaining raw seconds since 1970-01-01 UTC.
      A -1 value can be ambiguous between error and a pre-epoch reading; establish no valid result without the interface and
      error contract. Decode clock_gettime tv_sec and tv_nsec only after return 0 and complete readable timespec, requiring
      nanoseconds from 0 through 999999999. On return -1 retain that call''s raw errno rather than stale buffer contents.
      Preserve clock_id: CLOCK_REALTIME is adjustable calendar time, Linux CLOCK_MONOTONIC excludes suspend, CLOCK_BOOTTIME
      includes it, and CPU-time clocks are not uptime. Validate actual libc/vDSO modules and architecture; syscall-only observation,
      one libc symbol, or one instruction cannot establish complete read coverage. Deduplicate multiple hooks by call chain.
      A 32-bit process using 64-bit time_t requires validated full ABI return-register capture or an equivalent complete result
      path; a single pointer-width Frida retval does not establish the full 64-bit value.'
  - zh: 把类型明确的调用及所取得结果同该进程有效期内的授权登记比较，核对允许接口、clock_id与用途，保留批准、范围不符或登记未知状态。授权登记是策略语境，不证明登记任务实际执行；本合同不输出实际任务归属或任务完成，默认只声明temporal_read_observed及独立的结果状态。频率、低uptime和后继沉默都不证明恶意或门控。用接收时间、线程内顺序与采集序号重建调用，不只依赖返回墙钟，也不相减来源边界不同的计数。QPC与CPU
      cycles不在此分析的解码覆盖内，不自动具有UTC含义；性能计数转换需要同源有效频率。结果不证明已上报或被用于条件分支，控制流或通信消费须另有证据。
    en: Compare typed calls and acquired results with authorization valid for that process, checking allowed interfaces, clock_id,
      and purpose while retaining approval, scope mismatch, or unknown-registration state. Authorization supplies policy context
      rather than proof that a registered task executed; this contract emits neither actual task attribution nor task completion,
      defaulting to temporal_read_observed and an independent result state. Frequency, low uptime, and later silence establish
      neither malice nor gating. Reconstruct calls from receive time, within-thread order, and collection sequence rather
      than returned wall clock alone, without subtracting counters across different source boundaries. QPC and CPU cycles
      are outside this decoder and have no automatic UTC meaning; performance-count conversion needs a valid same-source frequency.
      Results establish neither reporting nor conditional consumption, which requires separate control-flow or communication
      evidence.
