description_zh: >-
  CAIDA 观测并分析了 Sality 僵尸网络在 2011 年 2 月开展的 12 天扫描。活动由约 300 万个不同来源地址协同完成，覆盖整个 IPv4 地址空间并面向 SIP 基础设施。该案例直接证明了主动扫描可以同时利用长周期和大规模来源分布实现隐蔽性。
description_en: >-
  CAIDA observed and analyzed a 12-day scan conducted by the Sality botnet in February 2011. Approximately three million distinct source addresses coordinated coverage of the full IPv4 address space while targeting SIP infrastructure. The case directly demonstrates that Active Scanning can combine long duration with large-scale source distribution for stealth.
