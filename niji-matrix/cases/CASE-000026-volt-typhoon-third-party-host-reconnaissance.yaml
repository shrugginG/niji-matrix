id: CASE-000026
name_zh: Volt Typhoon 使用第三方平台开展目标主机侦查
name_en: Volt Typhoon Third-Party Platform Host Reconnaissance
actor_or_campaign: Volt Typhoon
subject_refs: [NJT-0032, NJS-0032-001]
description_zh: CISA、NSA、FBI 及合作机构记录 Volt Typhoon 在入侵前使用 FOFA、Shodan 和 Censys 查询暴露基础设施，并将这种外部检索置于广泛目标侦查背景中。该活动证明高能力主体会消费第三方已经形成的互联网主机观测，但公开资料没有证明每一次平台查询都具有明确规避检测的意图。
description_en: CISA, NSA, FBI, and partner agencies document Volt Typhoon using FOFA, Shodan, and Censys before compromise to query exposed infrastructure as part of broad victim reconnaissance. The activity demonstrates that a capable actor consumes Internet host observations already produced by third parties, although public reporting does not establish explicit detection-evasion intent for every platform query.
time_range: Before and through February 2024 reporting
target_sectors_zh: [通信、能源、交通、水与污水等美国关键基础设施]
target_sectors_en: [U.S. critical infrastructure including communications, energy, transportation, and water and wastewater]
