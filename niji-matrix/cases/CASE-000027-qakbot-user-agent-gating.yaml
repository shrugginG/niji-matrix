schema_version: 1.0.0
type: case
id: CASE-000027
name_zh: Qakbot 基于 User-Agent 的平台筛选
name_en: Qakbot User-Agent-Based Platform Gating
actor_or_campaign: Qakbot
subject_refs: [NJT-0032, NJS-0032-002]
description_zh: Trellix 观察到 Qakbot 投递基础设施读取请求中的 User-Agent 以判断访问平台，并只向符合条件的环境返回后续内容。该案例直接展示攻击者可以在不增加客户端枚举消息的情况下，从普通 HTTP 请求固有元数据形成主机属性判断并用于选择性响应。
description_en: Trellix observed Qakbot delivery infrastructure reading User-Agent values in requests to determine the visiting platform and returning follow-on content only to qualifying environments. The case directly shows an adversary deriving host attributes from metadata inherent in an ordinary HTTP request and using them for selective response without adding a client-enumeration message.
time_range: 2023 campaign reporting
target_sectors_zh: [恶意软件投递目标]
target_sectors_en: [Malware delivery targets]
evidence_refs: [REF-000028]
confidence: medium
status: review
