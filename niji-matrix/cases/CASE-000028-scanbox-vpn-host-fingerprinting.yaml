schema_version: 1.0.0
type: case
id: CASE-000028
name_zh: 被篡改 VPN 页面中的 Scanbox 主机指纹采集
name_en: Scanbox Host Fingerprinting on Altered VPN Pages
actor_or_campaign: Scanbox deployment on altered VPN servers
subject_refs: [NJT-0032, NJS-0032-003]
description_zh: JPCERT/CC 记录攻击者篡改 VPN 服务器页面并加载 Scanbox 侦查框架，由访问者浏览器收集软件、补丁、Office、Java、插件和驱动器等主机属性。该事件直接证明附加客户端枚举可以嵌入目标主动发起的网页会话，并与页面脚本执行及回传通道共存。
description_en: JPCERT/CC documented adversaries altering VPN server pages to load the Scanbox reconnaissance framework, causing visitor browsers to collect host attributes including software, patches, Office, Java, plugins, and drives. The incident directly demonstrates additional client enumeration embedded in a victim-initiated web session and sharing page-script execution and reporting channels.
time_range: Reported 2015-09-30
target_sectors_zh: [访问被篡改 VPN 门户的目标]
target_sectors_en: [Targets visiting altered VPN portals]
evidence_refs: [REF-000029]
confidence: high
status: review
