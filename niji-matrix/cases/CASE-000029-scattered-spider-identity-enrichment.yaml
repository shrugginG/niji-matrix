schema_version: 1.0.0
type: case
id: CASE-000029
name_zh: Scattered Spider 的域外高价值身份富化
name_en: Scattered Spider Off-Victim High-Value Identity Enrichment
actor_or_campaign: Scattered Spider
subject_refs: [NJT-0033, NJS-0033-001]
description_zh: FBI、CISA 及合作机构说明 Scattered Spider 使用公开信息、商业情报和既有泄露材料识别并刻画高价值员工，随后将这些资料用于面向企业及其 IT 帮助台的社会工程。该案例表明身份筛选和富化可以在受害组织身份系统之外完成，目标通常只在后续定向活动中看到结果。
description_en: FBI, CISA, and partner agencies describe Scattered Spider using public information, commercial intelligence, and prior breach material to identify and profile high-value employees, then applying the material in social engineering against enterprises and their IT help desks. The case shows identity selection and enrichment occurring outside victim identity systems, with the victim generally seeing the result only during targeted follow-on activity.
time_range: Activity reported through November 2023
target_sectors_zh: [大型企业及其合同 IT 帮助台]
target_sectors_en: [Large enterprises and their contracted IT help desks]
evidence_refs: [REF-000031]
confidence: high
status: review
