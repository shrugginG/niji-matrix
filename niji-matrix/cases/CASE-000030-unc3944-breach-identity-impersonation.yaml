schema_version: 1.0.0
type: case
id: CASE-000030
name_zh: UNC3944 使用历史泄露身份材料冒充员工
name_en: UNC3944 Employee Impersonation Using Historical Breach Identity Material
actor_or_campaign: UNC3944
subject_refs: [NJT-0033, NJS-0033-001]
description_zh: Mandiant 的事件响应报告描述 UNC3944 使用历史泄露中的个人信息冒充员工，并利用所得身份背景操纵帮助台流程。该案例把受害域外身份材料与后续高度定向的身份事务联系起来，但不能精确确定攻击者最初检索和富化材料的时间或平台。
description_en: Mandiant incident reporting describes UNC3944 using personal information from historical breaches to impersonate employees and applying that identity context to manipulate help-desk processes. The case links off-victim identity material to highly targeted downstream identity transactions but cannot precisely establish when or on which platform the adversary originally retrieved and enriched the material.
time_range: Reported 2025-07-23
target_sectors_zh: [使用企业帮助台和 VMware vSphere 的组织]
target_sectors_en: [Organizations using enterprise help desks and VMware vSphere]
evidence_refs: [REF-000032]
confidence: high
status: review
