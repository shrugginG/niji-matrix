schema_version: 1.0.0
type: case
id: CASE-000031
name_zh: Azure AD 自助密码重置工作流侦查
name_en: Azure AD Self-Service Password Reset Workflow Reconnaissance
actor_or_campaign: Unnamed adversary in Obsidian incident investigation
subject_refs: [NJT-0033, NJS-0033-002]
description_zh: Obsidian Security 的事件调查记录攻击者先验证 Microsoft 365 账户，再进入 Azure AD 自助密码重置流程检查可用验证方式，而没有在侦查步骤中完成重置。该事件说明语义有效且未完成的身份事务可以泄露账户存在性和恢复配置，并在单条日志中接近普通用户失败流程。
description_en: Obsidian Security incident reporting records an adversary validating Microsoft 365 accounts and then entering Azure AD self-service password reset flows to inspect available verification methods without completing a reset during reconnaissance. The event shows semantically valid but incomplete identity transactions disclosing account existence and recovery configuration while resembling an ordinary failed user flow in an individual record.
time_range: Reported 2023-08-01
target_sectors_zh: [使用 Microsoft 365 与 Azure AD 自助密码重置的组织]
target_sectors_en: [Organizations using Microsoft 365 and Azure AD self-service password reset]
evidence_refs: [REF-000033]
confidence: medium
status: review
