id: CASE-000032
name_zh: Volt Typhoon 的外部目标网络侦查
name_en: Volt Typhoon External Victim-Network Reconnaissance
actor_or_campaign: Volt Typhoon
subject_refs: [NJT-0034, NJS-0034-001]
description_zh: CISA、NSA、FBI 及合作机构记录 Volt Typhoon 在入侵前广泛研究目标组织网络，并使用 FOFA、Shodan 和 Censys 查询暴露基础设施。该事件证明高能力主体会复用第三方互联网测量建立网络画像，但公开资料不足以把每项公共控制面查询或特定匿迹动机归因给该主体。
description_en: CISA, NSA, FBI, and partner agencies document Volt Typhoon extensively researching victim networks before compromise and using FOFA, Shodan, and Censys to query exposed infrastructure. The event establishes that a capable actor reuses third-party Internet measurements to build a network profile, but public reporting is insufficient to attribute every public control-plane query or a particular stealth motive to the actor.
time_range: Before and through February 2024 reporting
target_sectors_zh: [通信、能源、交通、水与污水等美国关键基础设施]
target_sectors_en: [U.S. critical infrastructure including communications, energy, transportation, and water and wastewater]
