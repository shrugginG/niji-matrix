description_zh: OpenAI 报告多个国家关联威胁主体使用外部 AI 服务研究公司、专家和组织，并将公开材料综合为后续行动所需背景。该活动直接证明组织信息查询和综合可以在目标组织控制范围之外进行；公开报告没有披露完整提示、输出或所有后续用途，因此案例只支持域外画像路径。
description_en: OpenAI reports multiple state-affiliated threat actors using an external AI service to research companies, experts, and organizations and synthesize public material into context for later operations. The activity directly demonstrates organizational queries and synthesis outside victim control; because the public report does not disclose complete prompts, outputs, or every downstream use, the case supports only the off-target profiling path.
