schema_version: 1.0.0
type: case
id: CASE-000034
name_zh: 高等教育可信表单信息钓鱼活动
name_en: Higher-Education Trusted-Form Information-Phishing Campaigns
actor_or_campaign: Unnamed threat actors documented by Mandiant
subject_refs: [NJT-0036, NJS-0036-001, NJS-0036-003, NJS-0036-005]
description_zh: Mandiant 记录攻击者利用受信或已受控教育环境托管 Google Forms，复制院校品牌、颜色和紧急业务流程，向学生和教职员工索取登录凭据、金融机构资料及其他敏感信息；部分后续活动使用已攻陷账户继续发送表单。该案例支持情境话术、受信账户和可信托管界面的组合使用，但不证明邮箱痕迹抑制或渐进会话。
description_en: Mandiant documents adversaries using trusted or compromised education environments to host Google Forms, copying institutional branding, colors, and urgent business workflows to request login credentials, financial-institution details, and other sensitive information from students and staff; some follow-on activity used compromised accounts to send additional forms. The case supports combined contextual pretext, trusted-account use, and trusted hosting, but does not establish mailbox trace suppression or progressive conversation.
time_range: Campaigns observed from October 2022 through February 2025 reporting
target_sectors_zh: [美国高等教育机构]
target_sectors_en: [U.S. higher-education institutions]
evidence_refs: [REF-000042]
confidence: high
status: review
