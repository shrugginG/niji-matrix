schema_version: 1.0.0
type: case
id: CASE-000035
name_zh: SEABORGIUM 使用虚假 LinkedIn 画像侦查员工
name_en: SEABORGIUM Employee Reconnaissance Through a False LinkedIn Profile
actor_or_campaign: SEABORGIUM / Star Blizzard
subject_refs: [NJT-0037, NJS-0037-001]
description_zh: Microsoft 与 LinkedIn 观察到 SEABORGIUM 使用虚假 LinkedIn 画像间歇侦查特定组织员工，平台随后终止所识别账户。该事件直接支持通过隔离假名画像执行第三方开放内容研究，并表明查询归属仍可由平台设备、登录、目标图和后续滥用关系恢复。
description_en: Microsoft and LinkedIn observed SEABORGIUM intermittently using a false LinkedIn profile to reconnoiter employees of specific organizations, after which the platform terminated identified accounts. The event directly supports conducting third-party open-content research through a compartmented pseudonymous profile and shows that attribution may still be recovered through provider device, login, target-graph, and downstream-abuse relationships.
time_range: Activity reported 2022-08-15
target_sectors_zh: [英国与欧洲的国防、情报、非政府组织和智库等目标]
target_sectors_en: [Targets including defense, intelligence, NGOs, and think tanks in the United Kingdom and Europe]
evidence_refs: [REF-000050]
confidence: high
status: review
