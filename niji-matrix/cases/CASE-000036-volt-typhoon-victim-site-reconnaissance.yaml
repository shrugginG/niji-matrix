id: CASE-000036
name_zh: Volt Typhoon 的受害者自有网站侦查
name_en: Volt Typhoon Victim-Owned Website Reconnaissance
actor_or_campaign: Volt Typhoon
subject_refs: [NJT-0038]
description_zh: 联合网络安全公告记录 Volt Typhoon 在入侵前开展 Web 搜索并访问受害者自有站点，以了解目标组织、网络和关键人员。该事件证明高能力主体使用受害者公开网站进行目标开发，但来源没有提供足够的请求序列来确认正常访客拟态或导航工件替代中的任一具体子技术。
description_en: A joint cybersecurity advisory documents Volt Typhoon conducting pre-compromise web searches, including victim-owned sites, to learn about target organizations, networks, and key personnel. The event establishes victim-public-site use by a capable actor for target development, but the source does not provide a request sequence sufficient to confirm either benign-visitor mimicry or navigation-artifact substitution.
time_range: Before and through February 2024 reporting
target_sectors_zh: [通信、能源、交通、水与污水等美国关键基础设施]
target_sectors_en: [U.S. critical infrastructure including communications, energy, transportation, and water and wastewater]
