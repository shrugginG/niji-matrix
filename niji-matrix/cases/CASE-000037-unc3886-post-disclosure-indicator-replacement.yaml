type: case
id: CASE-000037
name_zh: UNC3886 在公开披露后快速替换原子指标
name_en: UNC3886 Rapid Atomic-Indicator Replacement After Public Disclosure
actor_or_campaign: UNC3886
subject_refs: [NJT-0039, NJS-0039-001]
description_zh: Mandiant 观察到 UNC3886 有时在相关公开报告发布后不足一周替换其中披露的原子指标，使后续文件或基础设施不再匹配既有精确规则。来源没有直接观察该主体访问具体报告，因此反馈来源为强推断，但披露与替换之间的短时间关系直接支持暴露触发轮换和指标无关检测需求。
description_en: Mandiant observed UNC3886 at times replacing atomic indicators disclosed in relevant public reporting in under a week, causing follow-on files or infrastructure to stop matching existing exact rules. The source did not directly observe the actor accessing a particular report, so the feedback source is strongly inferred, but the short relationship between disclosure and replacement directly supports exposure-triggered rotation and indicator-independent detection.
time_range: Activity reported 2023-06-13
