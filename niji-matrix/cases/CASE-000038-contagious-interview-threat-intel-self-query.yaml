name_zh: Contagious Interview 查询自身基础设施与候选域名声誉
name_en: Contagious Interview Queries of Its Own Infrastructure and Candidate-Domain Reputation
actor_or_campaign: Contagious Interview
subject_refs: [NJT-0039, NJS-0039-001, NJS-0039-002]
description_zh: SentinelOne 与 Validin 通过平台账户和查询日志观察到 Contagious Interview 相关主体搜索自身基础设施、公开归因及候选域名声誉，并在部署前后重复检查资源。报告同时指出反馈后的调整零散且有限，因此该案例直接支持威胁反馈获取和声誉门控，但不能把每次查询都解释为成功规避；对暴露后轮换只提供有限支持。
description_en: SentinelOne and Validin observed Contagious Interview-linked actors through platform account and query logs searching their own infrastructure, public attribution, and candidate-domain reputation and rechecking resources around deployment. The report also describes post-feedback adaptation as sporadic and limited, so the case directly supports threat-feedback acquisition and reputation gating but does not establish successful evasion from every query; support for post-exposure rotation is limited.
time_range: Activity reported 2025-09-04
