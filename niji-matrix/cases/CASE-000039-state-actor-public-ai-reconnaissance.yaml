id: CASE-000039
name_zh: 国家关联威胁主体使用公共 AI 开展目标研究
name_en: State-Affiliated Threat Actors Using Public AI for Target Research
actor_or_campaign: State-affiliated threat actors documented by OpenAI
subject_refs: [NJT-0040, NJS-0040-001]
description_zh: OpenAI 记录多个国家关联威胁主体使用公共 AI 服务研究公司、专家、组织、公开漏洞和技术主题，并终止相关账户。该案例证明目标研究查询集中在服务商侧且可以被平台调查，但公开报告没有披露每项任务的原始来源访问差异，因此对 AI 替代了多少直接或逐源查询保持中等置信度。
description_en: OpenAI documented multiple state-affiliated threat actors using public AI services to research companies, experts, organizations, public vulnerabilities, and technical topics and terminated associated accounts. The case establishes that target-research queries concentrate at the provider and can be investigated by the platform, but the public report does not disclose original-source access differences for every task, so the degree of direct or source-by-source query substitution remains medium confidence.
time_range: Activity reported 2024-02-14
