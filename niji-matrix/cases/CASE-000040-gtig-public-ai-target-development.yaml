type: case
id: CASE-000040
name_zh: GTIG 观察的公共 AI 目标开发活动
name_en: Public-AI Target Development Observed by GTIG
actor_or_campaign: Threat actors documented by Google Threat Intelligence Group
subject_refs: [NJT-0040, NJS-0040-001]
description_zh: GTIG 记录威胁主体使用生成式 AI 综合 OSINT、画像高价值目标、定位联系信息并研究商业伙伴，平台随后禁用相关资产并强化分类器。该案例支持公共 AI 对多来源材料进行目标开发以及服务商具备集中检测视角，但不能把后续社会工程或载荷行为直接归入 AI 查询本身。
description_en: GTIG documented threat actors using generative AI to synthesize OSINT, profile high-value targets, locate contact information, and research business partners, followed by provider asset disabling and classifier strengthening. The case supports public-AI target development over multisource material and a concentrated provider detection vantage, but downstream social engineering or payload behavior cannot be attributed to the AI query itself.
time_range: Activity reported 2026-02-12
