description_zh: Microsoft 与美国司法部记录 Volt Typhoon 使用被攻陷 SOHO 路由器、防火墙和 VPN 设备形成美国本地出口并隐藏真实来源。真实网络归属和节点池轮换降低来源异常，但设备状态与基础设施关系仍支持跨节点恢复。
description_en: Microsoft and the U.S. Department of Justice documented Volt Typhoon using compromised SOHO routers,
  firewalls, and VPN devices as U.S.-based egress to hide true origin. Genuine network attribution and pool rotation
  reduced origin anomaly, while device state and infrastructure relationships still supported cross-node recovery.
