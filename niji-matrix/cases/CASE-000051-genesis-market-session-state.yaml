name_zh: Genesis Market 浏览器状态与设备指纹交易
name_en: Genesis Market Browser-State and Device-Fingerprint Trade
actor_or_campaign: Genesis Market and Operation Cookie Monster
subject_refs:
- NJT-0050
- NJS-0050-002
- NJS-0050-004
- NJT-0184
description_zh: 美国司法部记录 Genesis Market 将从受感染设备取得的账户凭据、浏览器 Cookie 与设备指纹打包出售，使买方能够重建既有认证环境并绕过部分反欺诈控制。该市场把前置感染、状态采集、销售和买方使用分成不同主体与阶段，直接支持活动认证状态交付，并支持经纪化访问谱系分段。
description_en: The U.S. Department of Justice documented Genesis Market packaging account credentials, browser cookies, and
  device fingerprints taken from infected systems so buyers could recreate existing authenticated environments and bypass
  some anti-fraud controls. The marketplace separated preceding infection, state collection, sale, and buyer use across actors
  and stages, directly supporting Live Authentication-State Transfer and supporting Brokered Access-Lineage Segmentation.
time_range: Disrupted on 2023-04-04
