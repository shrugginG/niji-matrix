schema_version: "1.0.0"
type: case
id: CASE-000052
name_zh: Star Blizzard 多注册商与替换基础设施
name_en: Star Blizzard Multi-Registrar and Replacement Infrastructure
actor_or_campaign: Star Blizzard
subject_refs:
  - NJT-0051
  - NJS-0051-003
description_zh: Microsoft 观察到 Star Blizzard 使用多个注册商、成对 VPS、共享重定向服务以及持续变化的域名和短期战术，使单个资源暴露或失效后仍可切换到其他基础设施。该事件直接支持在行动暴露前准备具有替换关系的资源集合；稳定注册、证书、托管和重定向模式仍提供关联机会。
description_en: Microsoft observed Star Blizzard using multiple registrars, paired VPSs, shared redirect services, and changing domains and short-lived tactics so activity could switch to other infrastructure after a point resource was exposed or failed. The event directly supports preparing a set of resources with replacement relationships before operational exposure; stable registration, certificate, hosting, and redirect patterns still provide correlation opportunities.
time_range: Activity observed from 2022 through 2024
target_sectors_zh:
  - 政府、外交、智库与非政府组织
target_sectors_en:
  - Government, diplomacy, think tanks, and nongovernmental organizations
