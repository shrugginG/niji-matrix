schema_version: "1.0.0"
type: case
id: CASE-000053
name_zh: UBoatRAT 的 BITS 状态通知与跨重启执行
name_en: UBoatRAT BITS State Notification and Post-Reboot Execution
actor_or_campaign: UBoatRAT
subject_refs: [NJT-0063, NJS-0063-002]
description_zh: Unit 42 观察到 UBoatRAT 在 2017 年活动中复制自身并创建批处理文件，随后以 bitsadmin 创建作业、添加本地文件、设置 SetNotifyCmdLine 并恢复作业。传输完成后 BITS 启动恶意程序；未显式 Complete 或 Cancel 的作业继续存在，并可在计算机重启后周期性执行。报告将韩国或电子游戏行业相关人员和组织列为推测目标，而非确认归因。
description_en: Unit 42 observed UBoatRAT copy itself and create a batch file during 2017 activity, then use bitsadmin to create a job, add a local file, configure SetNotifyCmdLine, and resume the job. BITS launched the malware after transfer; because the job was not explicitly completed or canceled, it persisted and could execute periodically after reboot. The report treats Korean or video-game-related personnel and organizations as hypothesized rather than confirmed targets.
time_range: Observed variants from May through September 2017; report published 2017-11-28
target_sectors_zh:
  - 韩国相关人员或组织（报告推测）
  - 电子游戏行业相关人员或组织（报告推测）
target_sectors_en:
  - Korea-related personnel or organizations (report hypothesis)
  - Video-game-industry personnel or organizations (report hypothesis)
evidence_refs: [REF-000140]
confidence: high
status: review
