schema_version: "1.0.0"
type: case
id: CASE-000054
name_zh: KEGTAP 的 BITS 错误状态通知执行
name_en: KEGTAP BITS Error-State Notification Execution
actor_or_campaign: Ryuk ransomware operators using KEGTAP
subject_refs: [NJT-0063, NJS-0063-002]
description_zh: Mandiant 在 2020 年针对医院和医疗支持中心的事件响应中，发现一个名为 System update 的 normal-priority BITS 作业尝试访问不存在的本地 URL，从而进入错误状态并通过通知命令启动 KEGTAP。Microsoft-Windows-Bits-Client Operational 事件记录了作业创建、URL、通知程序和重复启动错误，QMGR 数据进一步恢复了作业优先级、状态、命令、文件和用户 SID；该案例同时说明单靠普通启动项或短期进程日志会遗漏持久作业语义。
description_en: During 2020 incident response involving hospitals and medical support centers, Mandiant found a normal-priority BITS job named System update that attempted to reach a nonexistent local URL, entered error state, and launched KEGTAP through its notification command. Microsoft-Windows-Bits-Client Operational events recorded job creation, URL, notification program, and repeated launch errors, while QMGR data recovered priority, state, command, file, and user SID. The case also shows how conventional autorun or short-lived process evidence can miss persistent job semantics.
time_range: Incident activity observed in 2020; report published 2021-03-31
target_sectors_zh:
  - 医院
  - 医疗支持机构
target_sectors_en:
  - Hospitals
  - Medical support organizations
