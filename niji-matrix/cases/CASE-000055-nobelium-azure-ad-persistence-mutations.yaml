id: CASE-000055
name_zh: NOBELIUM 的 Azure AD 长期驻留状态更改
name_en: NOBELIUM Azure AD Long-Term Persistence Mutations
actor_or_campaign: NOBELIUM
subject_refs:
- NJT-0083
- NJS-0083-001
- NJS-0083-002
description_zh: Microsoft Threat Intelligence 在 2021 年面向云与托管服务提供商的调查中观察到，NOBELIUM 修改 Azure AD 以取得长期驻留和敏感信息访问，包括创建用户、同意应用、向用户与应用授予角色，以及创建额外服务主体凭据。额外凭据直接支持并行认证路径，角色授予直接支持授权图增补；公开报告没有为每个受害者给出完整
  old/new 值、边标识和首次使用时间线，因此两个子项均保持中等置信度。
description_en: In its 2021 investigation of activity targeting cloud and managed service providers, Microsoft Threat Intelligence observed NOBELIUM
  modifying Azure AD for long-term persistence and sensitive-information access, including creating users, consenting applications, granting roles
  to users and applications, and creating additional service-principal credentials. Additional credentials directly support the parallel-authentication
  path, while role grants directly support authorization-graph augmentation. The report does not publish complete old and new values, edge identifiers,
  and first-use timelines for each victim, so both child classifications remain medium confidence.
time_range: Activity reported by Microsoft on 2021-10-25
target_sectors_zh:
- 云服务提供商
- 托管服务提供商
- IT 服务组织及其下游客户
target_sectors_en:
- Cloud service providers
- Managed service providers
- IT service organizations and downstream customers
evidence_refs:
