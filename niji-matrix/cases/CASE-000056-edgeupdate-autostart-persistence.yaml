schema_version: "1.0.0"
type: case
id: CASE-000056
name_zh: EdgeUpdate 主题 Run 值与启动快捷方式驻留
name_en: EdgeUpdate-Themed Run-Value and Startup-Shortcut Persistence
actor_or_campaign: Microsoft-observed human-operated intrusion campaign
subject_refs: [NJT-0084, NJS-0084-001]
description_zh: Microsoft Security Research 在 2026 年调查的一组人工操作入侵中观察到，恶意 MSI 通过当前用户 HKCU Run 值或 Startup 文件夹快捷方式建立登录驻留，两种实现均使用 EdgeUpdate 名称，并在用户登录时从 LocalAppData 启动 Node.js loader。报告明确称这些为 update-themed entries，并同时记录 loader 使用非标准扩展、WScript 或 Node.js 等实际执行特征；因此名称主题与真实目标不一致可直接核查，但公开资料没有量化该名称造成的检测下降，子技术归类保持 medium。
description_en: In a set of human-operated intrusions investigated in 2026, Microsoft Security Research observed malicious MSI packages establish per-user logon persistence through either an HKCU Run value or a Startup-folder shortcut. Both implementations used the name EdgeUpdate and launched a Node.js loader from LocalAppData when the user signed in. The report explicitly calls them update-themed entries and separately records actual execution features such as nonstandard extensions, WScript, or Node.js. The name theme can therefore be checked against the real target, but the public source does not quantify detection reduction caused by the name, so child classification remains medium confidence.
time_range: Campaign reported by Microsoft on 2026-09-02
