schema_version: "1.0.0"
type: case
id: CASE-000057
name_zh: BlackByte 入侵中的 MsEdgeMsE Run 项驻留
name_en: MsEdgeMsE Run-Entry Persistence in a BlackByte Intrusion
actor_or_campaign: BlackByte 2.0 ransomware intrusion
subject_refs: [NJT-0084, NJS-0084-001, NJT-0114, NJS-0114-001]
description_zh: Microsoft Incident Response 在 2023 年公布的一次五日入侵中直接观察到，攻击者创建 HKCU CurrentVersion Run 值 MsEdgeMsE，使用户每次登录时通过 rundll32 启动 api-msvc.dll 或实际具有 DLL 行为的 api-system.png。浏览器主题值名与真实载荷、扩展和路径不一致，后者提供可验证残余；报告证明行为与驻留效果，但没有直接说明命名者的主观匿迹理由，因此子技术关联保持 medium。
description_en: In a five-day intrusion published in 2023, Microsoft Incident Response directly observed the adversary create an HKCU CurrentVersion Run value named MsEdgeMsE so rundll32 launched api-msvc.dll or api-system.png, which behaved as a DLL, whenever the user signed in. The browser-themed value name was inconsistent with the real payload, extension, and paths, which provide verifiable residual evidence. The report establishes behavior and persistence effect but does not directly state the namer's subjective evasion rationale, so the child association remains medium confidence.
time_range: Intrusion reported by Microsoft on 2023-07-06
