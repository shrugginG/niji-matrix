schema_version: "1.0.0"
type: case
id: CASE-000058
name_zh: UNC3886 在 localnet 启动脚本中的内联命令
name_en: UNC3886 Inline Command in the localnet Startup Script
actor_or_campaign: UNC3886
subject_refs: [NJT-0085, NJS-0085-001, NJT-0087, NJS-0087-001]
description_zh: Mandiant 在 2022 年调查 FortiManager 与 FortiAnalyzer 入侵时观察到，攻击者向 rootfs.gz 内既有 `/etc/init.d/localnet` 加入一条 `dd` 命令。该脚本在系统启动时运行，命令把 `/bin/smit` 的一个字节恢复为跳过签名验证的状态。报告给出脚本、boot 顺序、目标偏移与文件哈希，直接证明保留合法脚本路径并内联增加攻击者命令；其匿迹收益仍按 medium 推断。
description_en: During a 2022 investigation of compromised FortiManager and FortiAnalyzer appliances, Mandiant observed the adversary add a `dd` command to the existing `/etc/init.d/localnet` inside rootfs.gz. The script ran at system startup and restored one byte in `/bin/smit` to a state that bypassed signature verification. The report supplies the script, boot ordering, target offset, and file hashes, directly establishing preservation of a legitimate script path with an inline adversary command. Its evasion benefit remains a medium-confidence inference.
time_range: Activity investigated in mid-2022; report published 2023-03-15
target_sectors_zh: [国防工业基础, 政府, 技术, 电信]
target_sectors_en: [Defense industrial base, Government, Technology, Telecommunications]
evidence_refs: [REF-000155]
confidence: medium
