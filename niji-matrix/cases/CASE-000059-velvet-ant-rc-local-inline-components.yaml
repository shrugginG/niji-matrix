description_zh: Sygnia 在一项长期入侵调查中观察到，Velvet Ant 把 VELVETSTING 与 VELVETTAP 加入被攻陷 F5 BIG-IP 的既有 `/etc/rc.local`。该脚本属于系统启动流程，所列命令会在每次启动时自动执行。该资料直接证明对现有初始化脚本的内容增补和重启持久化，但没有量化路径身份带来的检测下降，因此子项置信度保持 medium。
description_en: In a prolonged intrusion investigation, Sygnia observed Velvet Ant add VELVETSTING and VELVETTAP to the existing `/etc/rc.local` on a compromised F5 BIG-IP. The script belongs to the system startup process and its listed commands execute automatically whenever the system boots. The source directly establishes content addition to an existing initialization script and reboot persistence but does not quantify detection reduction from retained path identity, so child confidence remains medium.
