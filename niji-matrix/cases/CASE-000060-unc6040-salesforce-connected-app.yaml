schema_version: "1.0.0"
type: case
id: CASE-000060
name_zh: UNC6040 恶意 Salesforce Data Loader 集成
name_en: UNC6040 Malicious Salesforce Data Loader Integration
actor_or_campaign: UNC6040 Salesforce data theft campaign
subject_refs: [NJT-0086, NJS-0086-001]
description_zh: FBI 与 Google 记录 UNC6040 冒充 IT 支持，诱导员工在 Salesforce connected app 页面批准攻击者控制、模仿 Data Loader 的应用。授权赋予其查询和外传数据的能力；FBI 明确指出平台签发 OAuth token 会使活动看似受信集成并绕过 MFA、密码重置和传统登录监控。案例直接支持父行为与拟态变量。
description_en: The FBI and Google record UNC6040 impersonating IT support and inducing employees to approve an actor-controlled application imitating Data Loader on the Salesforce connected-app page. Authorization granted query and exfiltration capability. The FBI explicitly states that platform-issued OAuth tokens make activity appear as a trusted integration and bypass MFA, password resets, and traditional login monitoring. The case directly supports the parent behavior and impersonation variable.
time_range: Activity observed from October 2024 through 2025
target_sectors_zh: [Salesforce 客户组织]
target_sectors_en: [Salesforce customer organizations]
evidence_refs: [REF-000159, REF-000160]
confidence: high
status: review
