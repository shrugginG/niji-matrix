id: CASE-000061
name_zh: Storm-2949 通过 VMAccess 创建来宾管理员账户
name_en: Storm-2949 Guest Administrator Creation through VMAccess
actor_or_campaign: Storm-2949
subject_refs:
- NJT-0088
- NJS-0088-002
description_zh: Microsoft 观察到 Storm-2949 使用具备 Azure RBAC 权限的被攻陷用户部署 VMAccess 扩展，在目标虚拟机内部创建新的本地管理员账户。VMAccess 本用于恢复丢失或错误配置的 VM 凭据，攻击者则利用同一管理路径建立管理员后门。云活动记录扩展部署和管理主体，来宾系统记录本地账户与后续认证，必须跨层恢复完整来源。
description_en: Microsoft observed Storm-2949 use compromised users with Azure RBAC permission to deploy the VMAccess extension and create a new
  local administrator inside a target virtual machine. VMAccess normally recovers lost or misconfigured VM credentials, while the adversary used
  the same management path to establish an administrator backdoor. Cloud activity records extension deployment and management principal, while
  the guest records the local account and later authentication, requiring cross-layer provenance reconstruction.
time_range: Activity reported by Microsoft on 2026-05-18
