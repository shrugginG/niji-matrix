schema_version: 1.0.0
type: case
id: CASE-000062
name_zh: Microsoft 调查中的恶意设备注册
name_en: Rogue Device Registration in Microsoft Investigation
actor_or_campaign: Unnamed phishing operators investigated by Microsoft
subject_refs:
- NJT-0083
- NJS-0083-003
description_zh: Microsoft 365 Defender 研究团队在一条钓鱼攻击链中观察到，攻击者先取得缺少 MFA 保护的账户凭据，再使用该身份把攻击者控制的设备注册到目标 Azure AD 租户；恶意设备成为租户中的受管身份状态，并被用于后续攻击与访问。官方处置明确要求删除恶意设备、撤销活动会话并补强
  MFA，说明仅重置主密码不能清除该持久路径。公开报告没有披露每个受害者的完整 PRT、条件访问判定和首次使用事件，因此具体令牌谱系仍为中等可观测性。
description_en: Microsoft 365 Defender researchers observed a phishing chain in which attackers first obtained credentials for an account lacking
  MFA and then used that identity to register an attacker-controlled device in the victim Azure AD tenant. The rogue device became managed identity
  state in the tenant and supported later attack activity and access. Official remediation explicitly required removal of the rogue device, revocation
  of active sessions, and stronger MFA, showing that a primary-password reset alone did not remove the durable path. The report does not disclose
  a complete PRT, Conditional Access decision, and first-use sequence for every victim, leaving token lineage only moderately observable.
time_range: Activity disclosed by Microsoft on 2022-01-12
target_sectors_zh:
- 使用 Microsoft 365 与 Azure AD 的组织
target_sectors_en:
- Organizations using Microsoft 365 and Azure AD
