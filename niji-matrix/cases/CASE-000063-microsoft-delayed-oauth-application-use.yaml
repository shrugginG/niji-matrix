schema_version: 1.0.0
type: case
id: CASE-000063
name_zh: Microsoft 观察的恶意 OAuth 应用延迟使用
name_en: Delayed Malicious OAuth Application Use Observed by Microsoft
actor_or_campaign: Financially motivated threat actors tracked by Microsoft
subject_refs:
- NJT-0086
- NJS-0086-002
description_zh: Microsoft Threat Intelligence 观察到攻击者在入侵账户后创建或修改并授予高权限 OAuth 应用，使其在最初账户丢失后仍能访问；报告还记录部分应用在创建后数周或数月才被用于资源活动。该事实直接证明授权状态跨长静默期保持并在以后激活，但公开报告没有为所有应用给出完整首次
  token ID 和逐日基线，匿迹效果保持 medium。
description_en: Microsoft Threat Intelligence observed attackers create or modify and grant high privilege to OAuth applications after compromising
  accounts, preserving access after the initial account was lost. The report also records some applications being used for resource activity weeks
  or months after creation. This directly establishes grant state surviving a long silent interval and activating later, but the public report
  does not provide complete first-token IDs and daily baselines for every application, leaving evasion effect at medium confidence.
time_range: Activity disclosed by Microsoft on 2023-12-12
target_sectors_zh:
- 使用 Microsoft Entra 与 OAuth 应用的组织
target_sectors_en:
- Organizations using Microsoft Entra and OAuth applications
evidence_refs:
- REF-000161
confidence: medium
status: review
