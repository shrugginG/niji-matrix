schema_version: 1.0.0
type: case
id: CASE-000064
name_zh: UNC6395 挪用 Salesloft Drift 集成 token
name_en: UNC6395 Co-option of Salesloft Drift Integration Tokens
actor_or_campaign: UNC6395
subject_refs:
- NJT-0086
- NJS-0086-003
- NJT-0178
- NJT-0184
description_zh: Google Threat Intelligence Group 观察到 UNC6395 使用与既有 Salesloft Drift 第三方应用相关的被盗 OAuth token，访问多个客户 Salesforce
  实例；后续调查还发现 Drift Email 集成 token 被用于访问少量 Workspace 邮箱。处置要求撤销或轮换 Drift 相连集成的 token、调查所有连接系统并禁用受影响集成，直接证明既有集成身份可在没有新应用/consent
  的情况下转为攻击者入口。
description_en: Google Threat Intelligence Group observed UNC6395 use compromised OAuth tokens associated with existing Salesloft
  Drift third-party applications to access multiple customer Salesforce instances. Follow-up investigation also found a Drift
  Email integration token used to access a small number of Workspace mailboxes. Response required revoking or rotating tokens
  for Drift-connected integrations, investigating every connected system, and disabling affected integrations, directly establishing
  that an existing integration identity can become an adversary entry without a new application or consent.
time_range: Activity observed from 2025-08-08 through at least 2025-08-18
target_sectors_zh:
- Salesloft Drift 与 Salesforce 客户
- 少量 Google Workspace 集成账户
target_sectors_en:
- Salesloft Drift and Salesforce customers
- A small number of Google Workspace integrated accounts
