schema_version: 1.0.0
type: case
id: CASE-000065
name_zh: UNC3886 替换 TACACS+ 守护进程映像
name_en: UNC3886 Substitution of the TACACS+ Daemon Image
actor_or_campaign: UNC3886
subject_refs:
- NJT-0087
- NJS-0087-002
description_zh: Mandiant 在受侵 TACACS+ 服务器上观察到 UNC3886 将合法 `/usr/bin/tac_plus` 替换为恶意版本，该版本在密码验证函数后增加凭据记录逻辑并把结果写入混淆日志。系统仍从标准路径调用 TACACS+ 守护进程，但执行映像已非可信包内容，直接证明整映像路径身份替换及其完整性差异。
description_en: Mandiant observed UNC3886 replace legitimate `/usr/bin/tac_plus` on a compromised TACACS+ server with a malicious version that
  added credential logging after password verification and wrote results to an obfuscated log. The system continued invoking the TACACS+ daemon
  from its standard path, while the executing image was no longer trusted package content, directly establishing whole-image path-identity substitution
  and its integrity difference.
time_range: Activity reported by Mandiant on 2024-06-18
