schema_version: 1.0.0
type: case
id: CASE-000066
name_zh: Industroyer 与 ThiefQuest 的原始功能接力
name_en: Original-Function Handoff by Industroyer and ThiefQuest
actor_or_campaign: Sandworm Industroyer and ThiefQuest malware
subject_refs:
  - NJT-0087
  - NJS-0087-003
  - NJT-0070
  - NJS-0070-002
description_zh: ESET 报告 Industroyer 的后门化 Notepad 先运行插入的恶意代码，再解密并把控制交给文件末尾保存的原始 Notepad 代码，使应用按预期工作。Malwarebytes 独立观察 ThiefQuest 向可执行文件前置恶意代码，把合法内容复制到隐藏文件后执行，以维持正常外观。两个跨平台实现共同直接证明“恶意前奏—原始功能接力”变量。
description_en: ESET reports that Industroyer's backdoored Notepad runs inserted malicious code first, then decrypts and passes control to original Notepad code stored at the end of the file so the application works as expected. Malwarebytes independently observed ThiefQuest prepend malicious code to executables, copy legitimate content into a hidden file, and execute it to preserve normal appearance. The two cross-platform implementations directly establish the malicious-prelude-to-original-function-handoff variable.
time_range: Industroyer analyzed in 2017; ThiefQuest analyzed in 2020
target_sectors_zh:
  - 乌克兰电力基础设施
  - macOS 用户
target_sectors_en:
  - Ukrainian electric-power infrastructure
  - macOS users
