schema_version: 1.0.0
type: case
id: CASE-000067
name_zh: FIN8 的 WMI 谱系与 PowerShell 标准输入规避
name_en: FIN8 WMI-Lineage and PowerShell Standard-Input Evasion
actor_or_campaign: FIN8
subject_refs: [NJT-0065, NJS-0065-001, NJS-0065-002, NJT-0114, NJS-0114-003]
description_zh: Mandiant 观察到 FIN8 在 2017 年钓鱼文档宏中把 PowerShell 命令保存在环境变量，经标准输入交给 `powershell -`，使 PowerShell 参数只留下一个连字符；同一宏用 WMI 启动 cmd 与 PowerShell，使进程树表现为 `wmiprvse.exe > cmd.exe > powershell.exe` 而非 Word 直接派生。该案例同时直接证明攻击者控制入口谱系和短驻语义载体，且报告明确将设计目标关联到规避命令行参数与父子检测。
description_en: Mandiant observed FIN8 in a 2017 phishing-document macro store a PowerShell command in environment variables and deliver it through standard input to `powershell -`, leaving only a dash in PowerShell arguments. The same macro used WMI to start cmd and PowerShell so lineage appeared as `wmiprvse.exe > cmd.exe > powershell.exe` rather than a direct Word child. The case directly establishes adversary control of both entry lineage and transient semantics, and the report explicitly ties the design to evasion of argument and parent-child detection.
time_range: Early 2017 activity; report published 2017-06-30
target_sectors_zh: [金融与零售机构]
target_sectors_en: [Financial and retail organizations]
evidence_refs: [REF-000196]
confidence: high
status: review
