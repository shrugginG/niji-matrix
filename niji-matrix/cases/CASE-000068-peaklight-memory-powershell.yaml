schema_version: 1.0.0
type: case
id: CASE-000068
name_zh: PEAKLIGHT 的 PowerShell 内存流执行
name_en: PEAKLIGHT PowerShell Memory-Stream Execution
actor_or_campaign: PEAKLIGHT malware distribution activity
subject_refs: [NJT-0065, NJS-0065-002]
description_zh: Mandiant Managed Defense 在受害环境发现异常网络活动并取得相关 LNK、JavaScript 与 PowerShell 链。其分析显示一个变体把 Base64 数据解码后以 AES 解密、GZIP 解压，并从内存流执行产生的 PowerShell 代码；后继 PEAKLIGHT 再下载并运行信息窃取载荷。案例直接证明主要解释语义可在运行时内存形成而不对应独立脚本，同时保留启动参数、CDN 请求、下载文件和后继执行等可关联残余。
description_en: Mandiant Managed Defense found anomalous network activity in a victim environment and acquired the related LNK JavaScript and PowerShell chain. Analysis showed one variation decode Base64 data, decrypt it with AES, decompress it with GZIP, and execute the resulting PowerShell code from a memory stream before PEAKLIGHT downloaded and ran infostealer payloads. The case directly establishes primary interpreter semantics formed in runtime memory without a standalone script while retaining correlatable launch parameters, CDN requests, downloaded files, and successor execution.
time_range: Victim activity investigated in 2024; report published 2024-08-22
target_sectors_zh: [恶意软件即服务受害组织]
target_sectors_en: [Malware-as-a-service victim organizations]
evidence_refs: [REF-000197]
confidence: high
status: review
