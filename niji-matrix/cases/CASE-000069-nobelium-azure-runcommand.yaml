schema_version: 1.0.0
type: case
id: CASE-000069
name_zh: NOBELIUM 借 Azure Run Command 从云转入来宾
name_en: NOBELIUM Cloud-to-Guest Pivot Through Azure Run Command
actor_or_campaign: NOBELIUM
subject_refs: [NJT-0064, NJS-0064-001, NJS-0064-002]
description_zh: Microsoft 在一个已调查事件中观察到 NOBELIUM 将 Azure admin-on-behalf-of 委托权限与 Azure RunCommand 配合，用于访问虚拟机并把控制从云环境转向本地系统。报告的检测把 AzureActivity 中的用户、IP 和 Run Command 操作与 MDE 来宾日志连接，直接证明控制面主体与来宾脚本语义分处不同数据源；同一管理功能又是正常运维能力，需以罕见脚本和可疑登录窗口区分。
description_en: In an investigated incident Microsoft observed NOBELIUM combine Azure admin-on-behalf-of delegated authority with Azure RunCommand to access virtual machines and shift control from cloud to on-premises systems. Its detections join user IP and Run Command operations in AzureActivity with guest MDE logging, directly establishing that control-plane principal and guest script semantics reside in different sources. The same management function is legitimate, requiring rare-script and suspicious-login-window context to discriminate.
time_range: Activity reported 2021-10-25
target_sectors_zh: [云服务提供商, 下游委托管理客户]
target_sectors_en: [Cloud service providers, Downstream delegated-management customers]
evidence_refs: [REF-000110]
confidence: high
status: review
