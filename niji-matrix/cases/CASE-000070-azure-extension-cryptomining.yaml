schema_version: 1.0.0
type: case
id: CASE-000070
name_zh: Azure Custom Script Extension 跨客户挖矿执行
name_en: Cross-Customer Cryptomining Through Azure Custom Script Extension
actor_or_campaign: Unattributed Azure VM Extension abuse activity
subject_refs: [NJT-0064, NJS-0064-002]
description_zh: Microsoft 观察到多个不同国家客户的 Azure VM 使用 Custom Script Extension 从同一公开 GitHub 仓库取得并执行 `hack1.sh` 挖矿脚本。VM Agent 代表 Azure Fabric 管理扩展并以本地高权限执行负载，使恶意动作沿与软件安装和配置相同的常驻代理路径出现；跨客户的共同仓库、短时间集中执行和不符合正常测试/红队用途的内容成为反证。
description_en: Microsoft observed Azure virtual machines across customers in different countries use Custom Script Extension to retrieve and execute the `hack1.sh` mining script from one public GitHub repository. The VM Agent manages extensions for Azure Fabric and executes payloads with high local privilege, making malicious action appear along the same resident-agent path used for installation and configuration. A common repository, clustered timing across customers, and content inconsistent with normal testing or red-team use supplied disconfirming context.
time_range: Activity reported 2021-03-09
target_sectors_zh: [多个国家的 Azure 客户]
target_sectors_en: [Azure customers across multiple countries]
evidence_refs: [REF-000203]
confidence: high
status: review
