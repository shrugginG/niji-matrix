schema_version: 1.0.0
type: case
id: CASE-000071
name_zh: VIRTUALPITA 从 ESXi 向来宾路由命令
name_en: VIRTUALPITA Routing Commands from ESXi into Guests
actor_or_campaign: VIRTUALPITA operator
subject_refs: [NJT-0068]
description_zh: Mandiant 在活跃事件中观察到 ESXi 上的 VIRTUALPITA `/bin/rdt` 启动 shell 和 Python 脚本，把目标 VM、来宾凭据及命令传入 Guest Operations；同一命令随后在 Windows 来宾中显示为合法 `vmtoolsd.exe` 的子进程。主机和来宾各自只保存半条因果链，直接证明 hypervisor-to-guest 管理通道改变远端发起者在端点上的可见来源。
description_en: During active attacker activity Mandiant observed VIRTUALPITA `/bin/rdt` on ESXi start a shell and Python script with target VM guest credentials and command passed into Guest Operations. The same command then appeared in the Windows guest as a child of legitimate `vmtoolsd.exe`. Host and guest each retained only one half of causality, directly establishing the hypervisor-to-guest management channel changing visible remote provenance at the endpoint.
time_range: Activity investigated in 2022; report published 2022-09-28
target_sectors_zh: [运行 VMware ESXi 的战略组织]
target_sectors_en: [Strategic organizations operating VMware ESXi]
evidence_refs: [REF-000208]
confidence: high
status: review
