schema_version: 1.0.0
type: case
id: CASE-000072
name_zh: UNC3886 无来宾认证的 Guest Operations 执行
name_en: UNC3886 Guest Operations Execution Without Guest Authentication
actor_or_campaign: UNC3886
subject_refs: [NJT-0068]
description_zh: Mandiant 调查确认 UNC3886 利用 CVE-2023-20867 修改 ESXi `/bin/vmx` 进程的认证类型，并用 `e.py` 调用 StartProgramInGuest 在 Windows、Linux 与 PhotonOS 来宾执行命令。成功操作不产生 Windows 4624/4634 或 Linux 访问日志，来宾只见 vmtoolsd 派生结果；ESXi/VMware Tools 版本、GuestOps API、`.vmx`/VMCI 标识和管理侧日志仍提供残余。
description_en: Mandiant confirmed UNC3886 exploit CVE-2023-20867 to modify the authentication type in the ESXi `/bin/vmx` process and use `e.py` with StartProgramInGuest to execute commands in Windows Linux and PhotonOS guests. Successful operations generated no Windows 4624 or 4634 or Linux access log while the guest retained only vmtoolsd-descended outcomes. ESXi and VMware Tools version, GuestOps API, `.vmx` or VMCI identifiers, and management-side logs remained residuals.
time_range: Intrusions investigated through 2023; report published 2023-06-13
target_sectors_zh: [国防工业基础, 政府, 技术, 电信]
target_sectors_en: [Defense industrial base, Government, Technology, Telecommunications]
