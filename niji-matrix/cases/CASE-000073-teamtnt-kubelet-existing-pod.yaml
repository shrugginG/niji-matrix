schema_version: 1.0.0
type: case
id: CASE-000073
name_zh: TeamTNT 经错误配置 kubelet 进入既有 Pod
name_en: TeamTNT Entry into an Existing Pod Through a Misconfigured Kubelet
actor_or_campaign: TeamTNT
subject_refs: [NJT-0066, NJS-0066-001]
description_zh: Sysdig 在蜜罐集群中观察到 TeamTNT 利用错误配置的 kubelet 服务进入一个已经运行的 Pod，随后安装所需软件包、下载脚本和多个二进制，并启动后台后门/挖矿相关执行。攻击者没有为初始命令创建新的 workload，运行结果继承原 Pod 的 namespace、镜像和应用身份；kubelet 入口、下载文件、进程与网络仍可恢复链条。
description_en: Sysdig observed TeamTNT abuse a misconfigured kubelet in a honeypot cluster to enter an already running pod, install required packages, download scripts and binaries, and launch background backdoor or mining-related execution. The initial commands created no new workload and inherited the pod's namespace image and application identity, while kubelet entry downloaded files processes and network remained recoverable.
time_range: Campaign observed and reported in 2022
target_sectors_zh: [暴露或错误配置 Kubernetes 集群]
target_sectors_en: [Exposed or misconfigured Kubernetes clusters]
evidence_refs: [REF-000218]
confidence: high
status: review
