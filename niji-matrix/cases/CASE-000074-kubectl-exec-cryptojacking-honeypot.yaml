schema_version: 1.0.0
type: case
id: CASE-000074
name_zh: 挖矿攻击者用 kubectl exec 借用既有容器
name_en: Cryptojacking Attacker Borrowing an Existing Container with kubectl exec
actor_or_campaign: Unattributed external cryptojacking attacker
subject_refs: [NJT-0066, NJS-0066-001]
description_zh: Sysdig 在暴露的 Kubernetes 蜜罐中记录外部攻击者首先执行 `kubectl exec` 进入已运行容器并获得 bash shell，随后开展恶意活动。运行时事件显示 shell 在容器 runtime 父级下且带终端上下文，而 workload 定义本身没有新增容器。案例直接证明 API exec 与容器内进程需要跨层关联，也说明已有应用身份可承载后置命令。
description_en: In an exposed Kubernetes honeypot Sysdig recorded an external attacker first use `kubectl exec` into a running container for a bash shell and then perform malicious activity. Runtime events showed the shell under a container-runtime parent with terminal context while the workload definition gained no new container. The case directly establishes the need to join API exec to in-container processes and shows an existing application identity carrying later commands.
time_range: Honeypot observation published before 2020
target_sectors_zh: [暴露 Kubernetes 与 Docker 管理接口]
target_sectors_en: [Exposed Kubernetes and Docker management interfaces]
evidence_refs: [REF-000219]
confidence: medium
status: review
