schema_version: 1.0.0
type: case
id: CASE-000075
name_zh: TeamTNT 以通用安全镜像后置恶意载荷
name_en: TeamTNT Late Malicious Bootstrap from Generic Safe Images
actor_or_campaign: TeamTNT
subject_refs: [NJT-0067, NJS-0067-001]
description_zh: Sysdig 威胁研究记录 TeamTNT 在 2021 年从预装工具的恶意镜像转向 `alpine`、`ubuntu:18.04` 等通用或“安全”镜像，容器运行后再执行恶意 shell 命令与脚本，以规避初始镜像检测。部署时 image reference 与基础 digest 可以正常，但后续网络取得、shell、文件与进程使运行时内容偏离镜像身份。
description_en: Sysdig threat research reports TeamTNT move in 2021 from preloaded malicious images to generic or safe images such as `alpine` and `ubuntu:18.04`, then execute malicious shell commands and scripts after containers start to evade initial image detection. Image reference and base digest can be normal at deployment while later network retrieval shell file and process behavior diverges from image identity.
time_range: TeamTNT evolution observed through 2021
target_sectors_zh: [Docker, Kubernetes 与云原生环境]
target_sectors_en: [Docker Kubernetes and cloud-native environments]
evidence_refs: [REF-000220]
confidence: high
status: review
