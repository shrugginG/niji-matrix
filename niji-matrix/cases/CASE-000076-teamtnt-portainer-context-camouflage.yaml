schema_version: 1.0.0
type: case
id: CASE-000076
name_zh: TeamTNT 借 Portainer 近似镜像上下文部署容器
name_en: TeamTNT Container Deployment with Portainer-Like Image Context
actor_or_campaign: TeamTNT
subject_refs: [NJT-0067, NJS-0067-002]
description_zh: Aqua Team Nautilus 发现并归因 TeamTNT 控制的 Docker Hub 账户 `portaienr`，其拼写和镜像外观用于伪装合法 Portainer 软件；受害者暴露 Docker API 后，相关镜像被自动部署并运行，携带或下载扫描、逃逸、后门和挖矿工具。熟悉软件引用造成规范层特征伪装，而账户拼写、digest、入口命令、工具清单和 C2 仍是残余。
description_en: Aqua Team Nautilus discovered and attributed to TeamTNT the Docker Hub account `portaienr`, whose spelling and image appearance masqueraded as legitimate Portainer software. After a victim exposed the Docker API, related images were automatically deployed and run with embedded or downloaded scanning escape backdoor and mining tools. The familiar software reference produced specification-level Feature Disguise while account spelling digest entry command tool inventory and command and control remained residuals.
time_range: Campaign investigated around 2020
target_sectors_zh: [暴露 Docker API 与 Portainer 的云主机]
target_sectors_en: [Cloud hosts exposing Docker API and Portainer]
