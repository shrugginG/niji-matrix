schema_version: 1.0.0
type: case
id: CASE-000077
name_zh: Rhadamanthys 以原始 Syscall 绕过 NTDLL Hook
name_en: Rhadamanthys Raw Syscalls Bypassing NTDLL Hooks
actor_or_campaign: Rhadamanthys malware operators
subject_refs: [NJT-0073, NJS-0073-001]
description_zh: Check Point 对 Rhadamanthys v0.5.0 的模块分析发现，恶意软件将 syscall 编号复制到自有 stub，直接调用内核服务而不经过通常会被安全产品 hook 的 NTDLL 导出。该实现直接改变用户态监控路径，但 syscall 从非系统模块发起、调用栈、内存区域及其后续进程/文件结果仍可区分。
description_en: Check Point analysis of Rhadamanthys v0.5.0 modules found the malware copy syscall numbers into private stubs and invoke kernel services without traversing NTDLL exports commonly hooked by security products. The implementation directly changes the user-mode monitoring path while syscall origin outside a system module, call stack, memory region, and later process or file outcomes remain distinguishable.
time_range: Rhadamanthys v0.5.0 analyzed in 2023
target_sectors_zh: [信息窃取恶意软件受害者]
target_sectors_en: [Information-stealer victims]
evidence_refs: [REF-000222]
confidence: high
status: review
