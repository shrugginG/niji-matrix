id: CASE-000078
name_zh: SplatDropper 哈希解析 Windows API
name_en: SplatDropper Hashed Windows API Resolution
actor_or_campaign: Mustang Panda / SplatDropper
subject_refs: [NJT-0073, NJS-0073-002, NJT-0115, NJS-0115-004]
description_zh: Zscaler ThreatLabz 分析 Mustang Panda 的 SplatDropper，确认其以 seed 131313 对 API 名称计算哈希并在运行时解析所需 Windows API，随后解密驱动、创建服务执行 SplatCloak并清理服务与文件。哈希解析使静态导入表不直接暴露调用名称，但解析循环、模块导出访问、服务创建和驱动结果仍能恢复因果。
description_en: Zscaler ThreatLabz analyzed Mustang Panda's SplatDropper and confirmed it hash API names with seed 131313 and resolve required Windows APIs at runtime before decrypting a driver, creating a service to run SplatCloak, and cleaning the service and files. Hash resolution removes clear call names from static imports while the resolution loop, module-export access, service creation, and driver outcome preserve causality.
time_range: SplatDropper first observed in 2025; report published 2025-04-16
target_sectors_zh: [Mustang Panda 定向攻击受害者]
target_sectors_en: [Mustang Panda targeted victims]
