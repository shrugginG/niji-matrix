schema_version: 1.0.0
type: case
id: CASE-000079
name_zh: Microsoft 观察到的 Office DDE 恶意命令执行
name_en: Malicious Office DDE Command Execution Observed by Microsoft
actor_or_campaign: Unattributed late-2017 DDE attack activity
subject_refs: [NJT-0072, NJS-0072-001, NJS-0072-002]
description_zh: Microsoft Windows Defender Security Intelligence 在 2017 年末观察到攻击者把恶意 DDE 字段放入 Office 文档，借应用间消息和共享内存触发命令执行，并在安全情报报告中将其描述为试图保持“under the radar”的实例。文档与用户提示、Office 进程、DDE 会话、后继子进程和功能控制设置仍能重建请求—broker—结果链。
description_en: Microsoft Windows Defender Security Intelligence observed adversaries place malicious DDE fields in Office documents in late 2017 and use cross-application messages and shared memory to trigger command execution, describing the activity as an attempt to remain under the radar. Document and user prompts, Office process, DDE conversation, successor process, and feature-control settings still reconstruct the request-broker-outcome chain.
time_range: Activity observed in late 2017; report published 2018-03
target_sectors_zh: [恶意 Office 邮件附件接收者]
target_sectors_en: [Recipients of malicious Office email attachments]
evidence_refs: [REF-000227, REF-000228]
confidence: high
status: review
