schema_version: 1.0.0
type: case
id: CASE-000080
name_zh: UNC1069 的 DEEPBREATH 借 Finder 操作 TCC
name_en: UNC1069 DEEPBREATH Using Finder to Operate on TCC
actor_or_campaign: UNC1069 / DEEPBREATH
subject_refs: [NJT-0072, NJS-0072-001]
description_zh: Mandiant 在 2025 年 UNC1069 真实入侵中分析 DEEPBREATH，确认其借拥有 Full Disk Access 的 Finder 重命名受保护 TCC 目录、复制和修改数据库，再恢复目录；恶意程序还使用 AppleScript 后台重新启动自身。可见高权限文件操作由受信 Finder 承担，使单点文件归因偏离请求者，但 XPdb 时间/哈希、AppleScript、Finder 操作序列和后继数据访问仍是残余。
description_en: In a real 2025 UNC1069 intrusion Mandiant analyzed DEEPBREATH and confirmed it use Finder with Full Disk Access to rename a protected TCC directory, copy and modify the database, and restore the directory; the malware also used AppleScript to relaunch itself in the background. The trusted Finder performed visible privileged file actions, shifting point attribution from the requester, while XPdb time and hash, AppleScript, Finder operation sequence, and later data access remained residuals.
time_range: UNC1069 activity observed in 2025; report published 2026-02-09
target_sectors_zh: [加密货币与金融科技]
target_sectors_en: [Cryptocurrency and financial technology]
