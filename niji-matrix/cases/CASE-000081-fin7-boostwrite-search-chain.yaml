schema_version: 1.0.0
type: case
id: CASE-000081
name_zh: FIN7 BOOSTWRITE 借签名程序 DLL 搜索链执行
name_en: FIN7 BOOSTWRITE Execution Through a Signed Program DLL Search Chain
actor_or_campaign: FIN7 / BOOSTWRITE
subject_refs: [NJT-0070, NJS-0070-001]
description_zh: Mandiant 在 FIN7 事件响应中记录 BOOSTWRITE 利用合法应用从 `gdi` 到 `gdiplus` 再到本地 `Dwrite.dll` 的依赖加载链，让攻击者 DLL 被受信进程选中执行；相关变体还使用有效 CA 签名和加密载荷。签名 launcher、正常依赖名与进程身份保持不变，但本地 DLL 路径、文件 hash、加载顺序和后继内存行为仍能恢复链条。
description_en: During FIN7 incident response Mandiant documented BOOSTWRITE abusing a legitimate application's dependency chain from `gdi` to `gdiplus` and then local `Dwrite.dll` so an attacker DLL was selected and executed by a trusted process; related variants also used valid CA signing and encrypted payloads. Signed launcher normal dependency names and process identity remained while local DLL path file hash load order and subsequent memory behavior recovered the chain.
time_range: FIN7 activity reported in 2019
target_sectors_zh: [金融与零售行业]
target_sectors_en: [Financial and retail sectors]
evidence_refs: [REF-000236]
confidence: high
status: review
