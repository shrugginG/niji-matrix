schema_version: 1.0.0
type: case
id: CASE-000082
name_zh: Blue Mockingbird 通过 COR_PROFILER 激活矿工 DLL
name_en: Blue Mockingbird Activating a Miner DLL Through COR_PROFILER
actor_or_campaign: Blue Mockingbird
subject_refs: [NJT-0070, NJS-0070-003]
description_zh: Red Canary 在多个组织观察 Blue Mockingbird，在利用 Telerik Web 应用后通过 wmic/注册表设置 `COR_ENABLE_PROFILING`、`COR_PROFILER` 与 profiler CLSID，使后续加载 CLR 的进程激活恶意 XMRig DLL。攻击者不需要赢得 DLL 搜索目录或替换 .NET host；环境/注册表激活状态、CLSID、DLL 路径、CLR 加载和矿工结果形成独立可观察链。
description_en: Red Canary observed Blue Mockingbird across multiple organizations set `COR_ENABLE_PROFILING`, `COR_PROFILER`, and a profiler CLSID through wmic or registry after Telerik exploitation so later CLR-loading processes activated a malicious XMRig DLL. The adversary did not need to win a DLL search directory or replace the .NET host; environment or registry activation state CLSID DLL path CLR load and miner outcome formed a distinct observable chain.
time_range: Blue Mockingbird observed from 2020 through at least 2023
target_sectors_zh: [运行易受攻击 Telerik Web 应用的组织]
target_sectors_en: [Organizations running vulnerable Telerik web applications]
evidence_refs: [REF-000237, REF-000240]
confidence: high
status: review
