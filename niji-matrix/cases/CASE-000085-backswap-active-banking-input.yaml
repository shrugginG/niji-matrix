schema_version: 1.0.0
type: case
id: CASE-000085
name_zh: BackSwap 在活动银行交易会话中注入输入
name_en: BackSwap Input Injection in an Active Banking Session
actor_or_campaign: BackSwap banking-malware operators
subject_refs: [NJT-0071, NJS-0071-002]
description_zh: ESET 分析 BackSwap 发现其监控浏览器窗口消息、URL 与标题，识别受支持银行和转账情境后才模拟快捷键打开开发者控制台、从剪贴板粘贴银行特定 JavaScript 并执行，或直接通过地址栏注入。输入发生在用户正在操作的浏览器会话并继承当前焦点；窗口消息 hook、目标 URL、剪贴板变化、软件注入事件和 JavaScript 结果仍能恢复。
description_en: ESET analysis found BackSwap monitor browser window messages URLs and titles and only after identifying a supported bank and transaction context simulate shortcuts to open developer tools paste bank-specific JavaScript from the clipboard and execute it or inject through the address bar. Input occurred inside the user's active browser session and inherited current focus, while window-message hooks target URL clipboard change software-injected events and JavaScript outcomes remained recoverable.
time_range: BackSwap first observed in 2018
target_sectors_zh: [波兰银行客户]
target_sectors_en: [Polish online-banking customers]
evidence_refs: [REF-000245]
confidence: high
status: review
