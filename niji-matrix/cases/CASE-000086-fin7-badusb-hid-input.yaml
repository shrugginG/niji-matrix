id: CASE-000086
name_zh: FIN7 BadUSB 伪装键盘注入 PowerShell
name_en: FIN7 BadUSB Keyboard Impersonation Injecting PowerShell
actor_or_campaign: FIN7
subject_refs: [NJT-0071, NJS-0071-003]
description_zh: FBI 报告 FIN7 向美国运输、保险和国防相关企业邮寄伪装成普通 USB 的 BadUSB 设备。接入后设备以 HID 键盘被系统信任，注入 Win+R 快捷键并输入 PowerShell 命令，从攻击者服务器下载和执行恶意软件。物理设备/PnP、VID/PID、driver、输入突发与紧邻 PowerShell/网络结果仍可连接，但软件注入进程或注入标志可能不存在。
description_en: The FBI reported FIN7 mail BadUSB devices disguised as ordinary USBs to U.S. transportation insurance and defense-related businesses. Once connected the device was trusted as an HID keyboard and injected Win+R plus PowerShell commands to download and execute malware from an adversary server. Physical device or PnP VID or PID driver input burst and proximate PowerShell or network outcomes remained joinable while a software injector process or injected flag might be absent.
time_range: FIN7 campaigns reported through 2020-2022
target_sectors_zh: [运输, 保险, 国防企业]
target_sectors_en: [Transportation, Insurance, Defense businesses]
evidence_refs: [REF-000246]
confidence: high
status: review
