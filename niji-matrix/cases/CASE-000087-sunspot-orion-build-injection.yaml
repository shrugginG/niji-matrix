schema_version: 1.0.0
type: case
id: CASE-000087
name_zh: SUNSPOT 对 SolarWinds Orion 构建过程的条件化源文件替换
name_en: SUNSPOT Conditional Source Replacement in the SolarWinds Orion Build
actor_or_campaign: StellarParticle / APT29-associated SolarWinds compromise
subject_refs: [NJT-0074, NJS-0074-002]
description_zh: CrowdStrike 在 SolarWinds 构建服务器上分析到 SUNSPOT 持续监视 MsBuild.exe，仅在命令行指向 Orion solution 且源文件哈希匹配时把 InventoryManager.cs 替换为含 SUNBURST 的版本。植入等待构建结束后恢复原文件并删除备份，还用 pragma 抑制编译警告，从而让标准构建产出被修改而工作区中的异常只短暂存在；进程监视、文件临时替换、备份、互斥体和加密日志仍留下恢复链路的证据。
description_en: CrowdStrike analyzed SUNSPOT on a SolarWinds build server continuously watching MsBuild.exe and replacing InventoryManager.cs with a SUNBURST-bearing version only when the command line identified the Orion solution and source hashes matched. The implant waited for the build to finish then restored the original and deleted its backup while pragma directives suppressed compilation warnings allowing a standard build output to change while workspace anomalies existed briefly. Process monitoring temporary replacements backups mutexes and encrypted logs remained evidence for reconstruction.
time_range: 2020-02 through 2020-06
target_sectors_zh: [软件开发与构建基础设施, SolarWinds Orion 客户]
target_sectors_en: [Software development and build infrastructure, SolarWinds Orion customers]
evidence_refs: [REF-000252]
confidence: high
status: review
