schema_version: 1.0.0
type: case
id: CASE-000088
name_zh: XZ 发布 Tarball 中的条件化构建注入
name_en: Conditional Build Injection in XZ Release Tarballs
actor_or_campaign: XZ Utils supply-chain compromise / CVE-2024-3094
subject_refs: [NJT-0074, NJS-0074-002]
description_zh: Red Hat 确认 XZ 5.6.0 和 5.6.1 的发布 tarball 含恶意 M4 宏，而相应 Git 分发缺少该触发器。构建过程在满足条件时从伪装测试文件提取预编译对象并修改 liblzma，使审阅主仓库源代码不能直接复现发布构建的执行与产物；tarball 与 Git 差异、M4 宏、测试文件和最终库函数变化提供了可验证的残余痕迹。
description_en: Red Hat confirmed that XZ 5.6.0 and 5.6.1 release tarballs contained a malicious M4 macro while the corresponding Git distribution lacked the trigger. Under matching build conditions the process extracted a prebuilt object from a disguised test file and modified liblzma so review of the primary repository source did not directly reproduce release-build execution or output. Tarball-to-Git differences the M4 macro test file and resulting library changes remained verifiable traces.
time_range: 2024-02 through 2024-03
target_sectors_zh: [Linux 发行版构建与软件供应链]
target_sectors_en: [Linux distribution builds and software supply chains]
evidence_refs: [REF-000253]
confidence: high
status: review
