schema_version: 1.0.0
type: case
id: CASE-000089
name_zh: Shai-Hulud Discussion 工作流与自托管 Runner 命令执行
name_en: Shai-Hulud Discussion Workflow and Self-Hosted Runner Command Execution
actor_or_campaign: Shai-Hulud npm supply-chain campaign
subject_refs: [NJT-0074, NJS-0074-001]
description_zh: Unit 42 观察到 Shai-Hulud 在已入侵环境创建名为 discussion.yaml 的 GitHub Actions 工作流，并注册感染主机为 SHA1Hulud 自托管 runner。攻击者随后能够通过 GitHub discussion 事件触发任意命令，使恶意执行表现为仓库中的正常 workflow run 和 runner 任务；异常 YAML、runner registration API、discussion 触发与后继进程/网络事件仍可连接这条链。
description_en: Unit 42 observed Shai-Hulud create a GitHub Actions workflow named discussion.yaml in compromised environments and register infected hosts as SHA1Hulud self-hosted runners. Attackers could then trigger arbitrary commands through GitHub discussion events making malicious execution appear as repository workflow runs and runner jobs. The unusual YAML runner-registration API discussion trigger and subsequent process or network events remained linkable evidence.
time_range: 2025-09 through 2025-11
target_sectors_zh: [开源软件维护者, npm 与 GitHub 组织]
target_sectors_en: [Open-source maintainers, npm and GitHub organizations]
evidence_refs: [REF-000255]
confidence: high
status: review
