schema_version: 1.0.0
type: case
id: CASE-000090
name_zh: Guloader 的 Firefox BackgroundUpdate 仿冒任务
name_en: Guloader Firefox BackgroundUpdate-Imitating Task
actor_or_campaign: Guloader-to-ransomware intrusion investigated by Triskele Labs
subject_refs: [NJT-0075, NJS-0075-001]
description_zh: Triskele Labs 在一起从盗版软件开始的入侵中发现，Guloader 创建名称符合 Firefox BackgroundUpdate 惯例的计划任务，但该主机从未安装 Firefox。任务以 regsvr32 执行 AppData 数据并每分钟重复，说明名称和频率可以借用更新任务外观，而资产软件清单、动作程序、路径和历史任务基线仍能揭示不一致。
description_en: Triskele Labs found in an intrusion beginning with pirated software that Guloader created a scheduled task following Firefox BackgroundUpdate naming conventions although Firefox had never been installed on the host. The task used regsvr32 on AppData content and repeated every minute showing how names and cadence can borrow update-task appearance while software inventory action process path and historical task baselines reveal inconsistency.
time_range: '2026-06'
target_sectors_zh: [企业 Windows 终端]
target_sectors_en: [Enterprise Windows endpoints]
evidence_refs: [REF-000262]
confidence: medium
status: review
