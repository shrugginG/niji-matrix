schema_version: 1.0.0
type: case
id: CASE-000091
name_zh: Nitrokod 的十五天延期计划任务链
name_en: Nitrokod Fifteen-Day Deferred Scheduled-Task Chain
actor_or_campaign: Nitrokod cryptomining campaign
subject_refs: [NJT-0075, NJS-0075-002]
description_zh: Check Point 分析的 Nitrokod 链先要求至少四次跨日重启，再创建四个下载、解压、执行和清日志任务。日志被清除后，下一阶段下载在十五天后发生，之后又跨日解压和执行；研究者明确指出这种跨多日和重启的设计会超出常见沙箱运行时间并切断早期安装与矿工执行之间的可见联系。
description_en: The Nitrokod chain analyzed by Check Point first required at least four restarts across separate days before creating four download extraction execution and log-clearing tasks. After logs were cleared the next stage downloaded fifteen days later and extraction and execution continued on later days. Researchers explicitly noted that the multi-day multi-restart design outlasted common sandboxes and separated early installation from miner execution.
time_range: 2019 through 2022
target_sectors_zh: [下载仿冒桌面应用的 Windows 用户]
target_sectors_en: [Windows users downloading impersonated desktop applications]
evidence_refs: [REF-000260]
confidence: high
status: review
