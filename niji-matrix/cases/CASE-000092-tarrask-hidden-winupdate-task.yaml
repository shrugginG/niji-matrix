schema_version: 1.0.0
type: case
id: CASE-000092
name_zh: Tarrask 删除安全描述符隐藏 WinUpdate 任务
name_en: Tarrask WinUpdate Task Hidden by Security-Descriptor Deletion
actor_or_campaign: HAFNIUM / Silk Typhoon Tarrask activity
subject_refs: [NJT-0075, NJS-0075-003, NJT-0111, NJS-0111-001]
description_zh: Microsoft 在 2021 年 8 月至 2022 年 2 月的 HAFNIUM 活动中发现 Tarrask 创建 WinUpdate 任务重连 C2，并通过 token theft 取得 SYSTEM 权限删除 TaskCache Tree 键的 SD 值。任务随即从 schtasks /query 和 Task Scheduler UI 消失，但仍按触发器运行；TaskCache Tasks/Tree、任务 XML、4698 和 Operational 日志构成独立原始状态与运行证据。
description_en: Microsoft found during HAFNIUM activity from August 2021 through February 2022 that Tarrask created a WinUpdate task for C2 reconnection and used token theft to obtain SYSTEM authority and delete the SD value from the TaskCache Tree key. The task disappeared from schtasks query and the Task Scheduler UI but continued to run on its triggers. TaskCache Tasks and Tree state task XML Event 4698 and Operational logs remained independent raw-state and runtime evidence.
time_range: 2021-08 through 2022-02
target_sectors_zh: [电信, 互联网服务, 数据服务]
target_sectors_en: [Telecommunications, Internet service providers, Data services]
evidence_refs: [REF-000259]
confidence: high
status: review
