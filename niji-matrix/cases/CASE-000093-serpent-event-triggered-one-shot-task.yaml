schema_version: 1.0.0
type: case
id: CASE-000093
name_zh: Serpent 的 EventID 777 一次性计划代理
name_en: Serpent EventID 777 One-Shot Scheduled Brokerage
actor_or_campaign: Serpent targeted campaign against French entities
subject_refs: [NJT-0075, NJS-0075-004]
description_zh: Proofpoint 观察到 Serpent 相关载荷包含一条链式命令，先创建由 Application Event ID 777 触发的 ONEVENT 任务，再生成该虚假事件立即执行目标，随后删除任务。目标进程因此成为签名 taskhostsw.exe 的子进程，而后续任务列表不再含该对象；schtasks create/delete、EVENTCREATE、Operational/Security 生命周期事件和任务宿主子进程仍可还原事务。
description_en: Proofpoint observed a Serpent-related payload contain a chained command that created a ONEVENT task triggered by Application Event ID 777 generated the synthetic event to execute the target immediately and then deleted the task. The target therefore became a child of signed taskhostsw.exe while later task inventory lacked the object. Schtasks create and delete EVENTCREATE Operational or Security lifecycle events and the task-host child process could still reconstruct the transaction.
time_range: '2022-03'
target_sectors_zh: [法国建筑, 房地产, 政府机构]
target_sectors_en: [French construction, Real estate, Government]
evidence_refs: [REF-000261]
confidence: high
status: review
