schema_version: 1.0.0
type: case
id: CASE-000094
name_zh: Denonia 面向 AWS Lambda 的恶意执行
name_en: Denonia Malware Targeting AWS Lambda Execution
actor_or_campaign: Denonia limited Lambda-targeting activity
subject_refs: [NJT-0076, NJS-0076-001]
description_zh: Cado Security 分析两份 2022 年初样本，发现其使用 AWS Lambda Go handler 与 lambdacontext 库、依赖 Lambda 环境变量、把 XMRig 配置写入唯一可写的 /tmp 并从内存启动矿工。样本通过 DoH 让 AWS 难以看到域名解析，且短运行、动态实例和实例回收使调查困难。Cado 明确未确定样本如何部署，因此本案例只证明 Lambda 定向执行与运行时特性，不归因函数创建路径。
description_en: Cado Security analyzed two samples from early 2022 using AWS Lambda Go handler and lambdacontext libraries depending on Lambda environment variables writing XMRig configuration to the writable tmp directory and launching the miner from memory. The samples used DoH to reduce DNS visibility and short dynamic instances made investigation difficult. Cado explicitly did not determine how the samples were deployed so the case establishes Lambda-targeted execution and runtime properties without attributing function creation.
time_range: 2022-01 through 2022-02
target_sectors_zh: [AWS Lambda 环境]
target_sectors_en: [AWS Lambda environments]
evidence_refs: [REF-000267]
confidence: medium
status: review
