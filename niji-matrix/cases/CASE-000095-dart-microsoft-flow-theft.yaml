schema_version: 1.0.0
type: case
id: CASE-000095
name_zh: DART 调查中的 Microsoft Flow 自动化窃取
name_en: Microsoft Flow Automated Theft in a DART Investigation
actor_or_campaign: Unnamed cyberespionage actor in DART Case Report 001
subject_refs: [NJT-0076, NJS-0076-002]
description_zh: Microsoft DART 在持续 243 天的真实环境调查中发现，一个攻击者启用了客户已部署但未主动使用、也未针对高价值活动记录日志的 eDiscovery、Compliance Search 和 Microsoft Flow，并用 Flow 自动窃取搜索结果。控制与动作因此表现为租户已有业务服务，而非外部主机进程；flow 定义、连接器、创建主体、搜索和数据传输日志仍是恢复因果所需证据。公开报告没有披露精确 trigger，故只将业务自动化耦合结论设为 medium。
description_en: Microsoft DART found during a 243-day real-environment investigation that an attacker enabled already deployed but unused and insufficiently logged eDiscovery Compliance Search and Microsoft Flow and used Flow to automate theft of search results. Control and actions therefore appeared as existing tenant business services rather than an external host process while flow definitions connectors creator search and data-transfer logs remained necessary for reconstruction. The report does not disclose the exact trigger so the business-automation coupling conclusion remains medium.
time_range: 2019 through 2020
target_sectors_zh: [Microsoft 365 企业租户]
target_sectors_en: [Microsoft 365 enterprise tenant]
evidence_refs: [REF-000268]
confidence: high
status: review
