schema_version: 1.0.0
type: case
id: CASE-000096
name_zh: APT32 入侵 McAfee ePO 后的全系统部署任务
name_en: APT32 All-System Deployment Task Through Compromised McAfee ePO
actor_or_campaign: APT32 / OceanLotus
subject_refs: [NJT-0078, NJS-0078-001, NJS-0078-002]
description_zh: Mandiant 在企业入侵调查中观察到 APT32 控制 McAfee ePO 基础设施，把恶意软件发布为软件部署任务，使所有受管系统经专有 SPIPE 协议从受信 ePO 服务器拉取载荷。终端侧下载和执行因而继承安全管理 agent 与服务器来源，单主机难以看到攻击者控制面会话；ePO operator、deployment task、package、目标范围、agent check-in 和终端进程仍可恢复共同因果。
description_en: Mandiant observed APT32 control McAfee ePO infrastructure during enterprise intrusions and publish malware as a software deployment task that all managed systems pulled from the trusted ePO server over proprietary SPIPE. Endpoint download and execution therefore inherited security-management agent and server provenance while one host lacked the adversary control-plane session. ePO operator deployment task package target scope agent check-in and endpoint process can still reconstruct common causality.
time_range: 2016 through 2017
target_sectors_zh: [在越南有业务的全球企业]
target_sectors_en: [Global corporations with business interests in Vietnam]
evidence_refs: [REF-000273]
confidence: high
status: review
