schema_version: 1.0.0
type: case
id: CASE-000097
name_zh: AvosLocker 使用 PDQ Deploy 跨网络分发
name_en: AvosLocker Network-Wide Distribution Through PDQ Deploy
actor_or_campaign: AvosLocker ransomware campaign
subject_refs: [NJT-0078, NJS-0078-001, NJS-0078-002]
description_zh: Cisco Talos 在 2022 年 2 月至 3 月的一月期事件中观察攻击者使用合法 PDQ Deploy 将 AvosLocker 和多种工具分发到目标网络。大多数工作站和服务器上的 EDR 使调查者能够恢复完整生命周期，说明各端点本地只看到 PDQ/agent 发起的执行，而跨 fleet 的共同 package、job、时间和结果能够揭示单一控制来源。
description_en: Cisco Talos observed attackers use legitimate PDQ Deploy to distribute AvosLocker and multiple tools across a target network during a month-long February to March 2022 incident. EDR on most workstations and servers enabled reconstruction of the lifecycle showing that local endpoints saw PDQ or agent-initiated execution while common package job time and outcome across the fleet exposed a single control origin.
time_range: 2022-02 through 2022-03
target_sectors_zh: [企业工作站与服务器]
target_sectors_en: [Enterprise workstations and servers]
evidence_refs: [REF-000274]
confidence: high
status: review
