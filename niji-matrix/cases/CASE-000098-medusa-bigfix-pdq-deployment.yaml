schema_version: 1.0.0
type: case
id: CASE-000098
name_zh: Medusa 通过 BigFix 与 PDQ Deploy 推送加密载荷
name_en: Medusa Encryption Payload Deployment Through BigFix and PDQ Deploy
actor_or_campaign: Medusa ransomware actors
subject_refs: [NJT-0078, NJS-0078-001, NJS-0078-002]
description_zh: FBI、CISA 与 MS-ISAC 的联合公告记录 Medusa 关联攻击者使用 BigFix 和 PDQ Deploy 等软件部署与管理方案推送加密载荷。被滥用工具是企业正常 fleet 管理能力，能够从单一控制面影响多个受管系统；平台 operator/job、目标 collection、agent 任务回执、载荷 digest 和各终端加密开始时间是将分散结果还原为同一部署操作的关键证据。
description_en: A joint FBI CISA and MS-ISAC advisory documents Medusa-associated actors using software deployment and management solutions including BigFix and PDQ Deploy to push encryption payloads. The abused tools are normal enterprise fleet-management capabilities able to affect many managed systems from one control plane. Platform operator or job target collection agent receipts payload digest and encryption start times on endpoints are key evidence for reconstructing dispersed outcomes as one deployment operation.
time_range: 2023 through 2025
target_sectors_zh: [关键基础设施与企业网络]
target_sectors_en: [Critical infrastructure and enterprise networks]
evidence_refs: [REF-000275]
confidence: high
status: review
