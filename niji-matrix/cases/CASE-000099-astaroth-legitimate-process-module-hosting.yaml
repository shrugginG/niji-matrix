schema_version: 1.0.0
type: case
id: CASE-000099
name_zh: Astaroth 借 ExtExport.exe 加载无文件载荷
name_en: Astaroth Fileless Payload Loading Through ExtExport.exe
actor_or_campaign: Astaroth campaigns targeting Brazil
subject_refs: [NJT-0077, NJS-0077-001, NJT-0111, NJS-0111-002]
description_zh: Microsoft 在 2019 年末至 2020 年初观察 Astaroth 更新攻击链，使用合法 ExtExport.exe 加载 payload，并配合 ADS 与系统工具减少独立恶意文件和进程外观。Microsoft 将该活动明确描述为为逃避安全方案的 living-off-the-land，同时指出 fileless 代码仍留下可检查和可阻断的内存足迹与行为链。案例支持进程身份保持模块承载，但不把 Astaroth 的跨进程 hollowing 等相邻行为并入本子项。
description_en: Microsoft observed updated Astaroth chains from late 2019 into early 2020 use legitimate ExtExport.exe to load payloads and combine alternate data streams and system tools to reduce standalone malicious file and process appearance. Microsoft explicitly described the living-off-the-land activity as intended to evade security while noting that fileless code retained inspectable and blockable memory and behavior chains. The case supports process-identity-preserving module hosting without absorbing adjacent Astaroth process hollowing.
time_range: 2019-12 through 2020-03
target_sectors_zh: [巴西用户与企业]
target_sectors_en: [Users and enterprises in Brazil]
evidence_refs: [REF-000282]
confidence: high
status: review
