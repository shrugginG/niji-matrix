schema_version: 1.0.0
type: case
id: CASE-000100
name_zh: PipeMon 加密 DLL 模块的反射加载
name_en: PipeMon Reflective Loading of Encrypted DLL Modules
actor_or_campaign: Winnti Group PipeMon campaign
subject_refs: [NJT-0077, NJS-0077-002]
description_zh: ESET 在 2020 年针对韩国和台湾游戏公司的 Winnti 活动中发现 PipeMon 模块化后门。每个功能模块是导出 IntelLoader 的 DLL，以无害名称加密存储并通过 reflective loading 载入；部分模块还注入其他进程。案例直接证明模块无需正常 loader/file-backed 路径即可实例化，内存映射、解密、模块导出和注入仍留下检测信号；跨进程部分由 Process Injection 共同负责。
description_en: ESET discovered the modular PipeMon backdoor in 2020 Winnti activity against gaming companies in South Korea and Taiwan. Each function module was a DLL exporting IntelLoader stored encrypted under innocuous names and loaded reflectively and some modules were injected into other processes. The case directly demonstrates module instantiation without normal loader or file-backed paths while memory mapping decryption exports and injection remain detectable and the cross-process part is co-owned by Process Injection.
time_range: '2020-02 through 2020-05'
target_sectors_zh: [韩国与台湾电子游戏企业]
target_sectors_en: [Video-game companies in South Korea and Taiwan]
evidence_refs: [REF-000281]
confidence: high
status: review
