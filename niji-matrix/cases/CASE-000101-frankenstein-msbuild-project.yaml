schema_version: 1.0.0
type: case
id: CASE-000101
name_zh: Frankenstein 使用 MSBuild 执行恶意 XML Project
name_en: Frankenstein Execution of a Malicious XML Project Through MSBuild
actor_or_campaign: Frankenstein campaign
subject_refs: [NJT-0080, NJS-0080-001]
description_zh: Cisco Talos 在 2019 年 Frankenstein 活动中观察到，恶意宏完成版本与沙箱检查后调用签名 MSBuild 执行攻击者创建的 LOCALAPPDATA\Intel\instal.xml。Talos 判断选择 MSBuild 是为了利用 Microsoft 签名工具执行任意代码并绕过应用白名单。项目路径、调用进程、MSBuild 命令、XML 内容、后继内存/网络活动仍可把受信 utility 与恶意输入连接。
description_en: Cisco Talos observed during the 2019 Frankenstein campaign that after version and sandbox checks a malicious macro invoked signed MSBuild to execute actor-created LOCALAPPDATA Intel instal.xml. Talos assessed that MSBuild was selected to execute arbitrary code through a Microsoft-signed utility and bypass application whitelisting. Project path invoking process MSBuild command XML content and subsequent memory or network behavior can still connect the trusted utility to malicious input.
time_range: '2019-01 through 2019-06'
target_sectors_zh: [受定向钓鱼影响的 Windows 组织]
target_sectors_en: [Windows organizations targeted by spearphishing]
evidence_refs: [REF-000285]
confidence: high
status: review
