schema_version: 1.0.0
type: case
id: CASE-000102
name_zh: AkaiRyū 使用 MSBuild 编译执行 FaceXInjector
name_en: Operation AkaiRyū Compilation and Execution of FaceXInjector with MSBuild
actor_or_campaign: MirrorFace Operation AkaiRyū
subject_refs: [NJT-0080, NJS-0080-001, NJS-0080-002]
description_zh: ESET 在 2024 年 6 月至 9 月针对日本和中欧实体的 MirrorFace 活动中观察到，FaceXInjector 的 C# 代码存于 XML 文件，由 MSBuild 编译并执行，随后实施进程注入。该链直接证明 project 输入经受信开发 utility 转换为攻击工具执行，也与 MSBuild inline/task 编译能力一致；公开材料没有明确证明所有生成 assembly 均只驻留内存，因此 artifactless 子项保持 medium。
description_en: ESET observed during MirrorFace Operation AkaiRyū against Japanese and Central European entities from June through September 2024 that C sharp FaceXInjector code stored in XML was compiled and executed by MSBuild before process injection. The chain directly proves project input converted into attack-tool execution through a trusted developer utility and is consistent with MSBuild inline task compilation. Public reporting does not establish that every generated assembly remained only in memory so the artifactless child stays medium.
time_range: 2024-06 through 2024-09
target_sectors_zh: [日本与中欧外交和政策实体]
target_sectors_en: [Japanese and Central European diplomatic and policy entities]
evidence_refs: [REF-000286]
confidence: high
status: review
