schema_version: 1.0.0
type: case
id: CASE-000103
name_zh: Blue Mockingbird 借用既有 wercplsupport 服务
name_en: Blue Mockingbird Borrowing the Existing wercplsupport Service
actor_or_campaign: Blue Mockingbird cryptomining activity
subject_refs: [NJT-0079, NJS-0079-001, NJT-0089, NJS-0089-001]
description_zh: Red Canary 观察 Blue Mockingbird 用 sc config 把已有 wercplsupport 服务改为自动启动并执行/配合恶意 DLL，再启动该服务，同时复制仅多一个字母的 wercplsupporte.dll。攻击者没有引入新的醒目 service identity，而是借已有服务名称和 services.exe/svchost 谱系；service definition diff、sc 调用、DLL path/hash 与矿工结果仍能恢复攻击链。公开记录支持既有身份替换与服务执行，但没有给出修改前主体权限、实际服务 token 和首个新获准操作，因而不能单独证明 TA0004 成功。
description_en: Red Canary observed Blue Mockingbird use sc config to make existing wercplsupport auto-start and execute or support a malicious DLL then start the service while copying wercplsupporte.dll with a near-identical name. The actor avoided a conspicuous new service identity and borrowed established naming and services.exe or svchost lineage while service-definition differences, sc calls, DLL paths or hashes, and mining outcomes retained the chain. The public record supports established-identity substitution and service execution but does not provide pre-change principal authority, the actual service token, and the first newly authorized operation, so it cannot independently prove a TA0004 outcome.
time_range: 2019 through 2020
target_sectors_zh: [遭受 Blue Mockingbird 矿工活动的 Windows 企业]
target_sectors_en: [Windows enterprises affected by Blue Mockingbird mining]
evidence_refs: [REF-000291]
confidence: high
status: review
