schema_version: 1.0.0
type: case
id: CASE-000104
name_zh: 勒索调查中的 PsExec 远程服务代理
name_en: PsExec Remote-Service Brokerage in a Ransomware Investigation
actor_or_campaign: Unnamed post-ransomware actor investigated by Microsoft
subject_refs:
- NJT-0079
- NJS-0079-002
- NJT-0183
description_zh: Microsoft 在一宗勒索后调查中发现攻击者经 SMB 把 Cobalt Strike DLL 复制到远程主机，再通过远程 service creation 执行。报告把 PsExec 类链分为 ADMIN$
  写入 PSEXESVC、RPC 创建本地服务和 named pipe 控制三个阶段，说明远程会话在目标端被转换为服务管理器执行；公开片段未确认每个实例的 delete 时点，因此短驻生命周期结论保持 medium。
description_en: Microsoft found in a post-ransomware investigation that an actor copied Cobalt Strike DLLs to remote hosts
  over SMB and executed them through remote service creation. The report decomposes PsExec-like activity into ADMIN share
  PSEXESVC writes RPC creation of a local service and named-pipe control showing translation of remote sessions into service-manager
  execution. Public detail does not confirm deletion timing for every instance so ephemeral-lifecycle confidence remains medium.
time_range: '2022'
target_sectors_zh:
- 受勒索攻击的 Windows 企业网络
target_sectors_en:
- Windows enterprise networks affected by ransomware
evidence_refs:
- REF-000289
confidence: high
status: review
