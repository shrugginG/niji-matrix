schema_version: 1.0.0
type: case
id: CASE-000105
name_zh: TA551 使用 WMI 打断 Winword 父子谱系
name_en: TA551 Breaking Winword Parent-Child Lineage with WMI
actor_or_campaign: TA551
subject_refs: [NJT-0082, NJS-0082-001]
description_zh: Red Canary 在 TA551 活动中观察攻击者使用 WMI 作为执行中介，专门打断从 winword.exe 到恶意后继进程的直接父子谱系。端点进程因而显示 WMI Provider Host 或相关 provider 服务为来源，而不是初始 Office 文档；WMI client PID、operation、provider PID 与后继进程仍可通过 WMI-Activity 和 EDR 关联。
description_en: Red Canary observed TA551 use WMI as an execution intermediary specifically to break direct parent-child lineage from winword.exe to malicious successor processes. Endpoint processes therefore show WMI Provider Host or related provider services rather than the initial Office document while WMI client PID operation provider PID and successor process remain correlatable through WMI-Activity and EDR.
time_range: 2020 through 2021
target_sectors_zh: [遭受 TA551 恶意文档活动的 Windows 用户]
target_sectors_en: [Windows users targeted by TA551 malicious documents]
evidence_refs: [REF-000296]
confidence: high
status: review
