schema_version: 1.0.0
type: case
id: CASE-000106
name_zh: AvosLocker 通过 WMI Provider Host 执行编码 PowerShell
name_en: AvosLocker Encoded PowerShell Execution Through WMI Provider Host
actor_or_campaign: AvosLocker ransomware campaign C0018
subject_refs: [NJT-0082, NJS-0082-001, NJS-0082-002, NJT-0115, NJS-0115-001]
description_zh: Cisco Talos 在 AvosLocker 入侵中记录攻击者用 WMIC 修改本地和远程管理设置，并让 WMI Provider Host 执行多条采用 DownloadString 的编码 PowerShell。行为同时借用常见管理基础设施和 Wmiprvse 本地来源，但 encoded command、client/operator、ExecMethod/Win32_Process、provider child、下载地址和 ransomware 结果可恢复恶意语义。
description_en: Cisco Talos documented AvosLocker actors using WMIC to modify local and remote administration settings and WMI Provider Host to execute multiple encoded PowerShell DownloadString commands. The behavior borrowed common management infrastructure and local Wmiprvse provenance while encoded commands client or operator ExecMethod or Win32_Process provider children download destinations and ransomware outcomes recover malicious semantics.
time_range: 2022-02 through 2022-03
target_sectors_zh: [受 AvosLocker 影响的 Windows 企业]
target_sectors_en: [Windows enterprises affected by AvosLocker]
evidence_refs: [REF-000274]
confidence: high
status: review
