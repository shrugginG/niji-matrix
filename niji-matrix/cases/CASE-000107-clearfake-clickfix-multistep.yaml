schema_version: 1.0.0
type: case
id: CASE-000107
name_zh: ClearFake/TA571 ClickFix 剪贴板多步执行
name_en: ClearFake and TA571 ClickFix Clipboard Multi-Step Execution
actor_or_campaign: ClearFake and TA571 Clipboard-to-PowerShell campaigns
subject_refs: [NJT-0081, NJS-0081-001, NJS-0081-002]
description_zh: Proofpoint 在 2024 年观察被入侵网站显示虚假浏览器错误。用户点击 How to fix 后，页面把 Base64 PowerShell 复制到剪贴板并改变提示，引导其打开 PowerShell 或 Windows Run、粘贴并确认；命令随后下载执行 MSI 或 VBS。TA571 又用 HTML 附件复用错误提示。浏览器没有直接创建 shell，clipboard 变化、Run/terminal 焦点、粘贴、完整 command、PowerShell 网络和 payload 仍能重建链。
description_en: Proofpoint observed compromised sites in 2024 display fake browser errors. Clicking How to fix copied Base64 PowerShell to the clipboard and changed instructions telling users to open PowerShell or Windows Run paste and confirm before commands downloaded and executed MSI or VBS. TA571 reused similar errors in HTML attachments. The browser did not directly create the shell while clipboard change Run or terminal focus paste full command PowerShell network and payload could reconstruct the chain.
time_range: 2024-03 through 2024-06
target_sectors_zh: [访问被入侵网站或打开恶意 HTML 的 Windows 用户]
target_sectors_en: [Windows users visiting compromised sites or opening malicious HTML]
evidence_refs: [REF-000297]
confidence: high
status: review
