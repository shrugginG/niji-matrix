schema_version: 1.0.0
type: case
id: CASE-000108
name_zh: Contagious Interview 仿冒代码审查任务
name_en: Contagious Interview Impersonated Code-Review Task
actor_or_campaign: DPRK-linked Operation Contagious Interview
subject_refs: [NJT-0081, NJS-0081-001]
description_zh: Fireblocks 因求职者询问其名义下的项目而调查招聘冒充活动，发现攻击者在假面试中要求候选人克隆 GitHub repository，并把 npm install 等标准 setup 命令包装为代码审查任务。开发者以真实工具和日常流程主动执行恶意项目；招聘身份、repository provenance、package scripts、安装进程和后继网络仍是区分链。
description_en: Fireblocks investigated recruiting impersonation after candidates asked about purported projects and found attackers instructing candidates during fake interviews to clone GitHub repositories and run standard setup commands including npm install as code-review tasks. Developers executed malicious projects with genuine tools and routine workflows while recruiter identity repository provenance package scripts install processes and subsequent network remained distinguishing lineage.
time_range: 2025 through 2026
target_sectors_zh: [软件与加密行业求职开发者]
target_sectors_en: [Software and cryptocurrency-sector job-seeking developers]
evidence_refs: [REF-000298]
confidence: high
status: review
