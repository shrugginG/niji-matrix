schema_version: 1.0.0
type: case
id: CASE-000109
name_zh: Raspberry Robin USB 品牌化 LNK 用户触发
name_en: Raspberry Robin User Trigger Through Branded USB LNK Files
actor_or_campaign: Raspberry Robin
subject_refs:
- NJT-0081
- NJS-0081-001
- NJT-0058
- NJS-0058-001
description_zh: Microsoft 记录 Raspberry Robin 通过感染 USB 上的 LNK 依赖用户点击，并观察快捷方式名称从通用名称改为 USB 品牌名，可能增加用户执行概率。点击后 cmd/msiexec 启动驱动器上的恶意内容。USB
  attach、Explorer/UserAssist、LNK origin/target、cmd/msiexec 与网络链仍能区分，但报告对用户为什么点击保持推断，因此案例不强化为精确心理归因。
description_en: Microsoft documents Raspberry Robin relying on users clicking LNK files on infected USB media and observes
  shortcut names changing from generic to USB brand names possibly encouraging execution. The click leads cmd and msiexec
  to launch malicious content from the drive. USB attachment Explorer or UserAssist LNK origin and target cmd or msiexec and
  network lineage remain distinguishing while the report treats why a user clicked as inference and the case does not strengthen
  psychological attribution.
time_range: 2021 through 2022
target_sectors_zh:
- 使用可移动 USB 介质的 Windows 企业用户
target_sectors_en:
- Windows enterprise users handling removable USB media
evidence_refs:
- REF-000105
confidence: high
status: review
