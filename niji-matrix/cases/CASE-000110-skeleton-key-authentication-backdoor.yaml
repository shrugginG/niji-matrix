schema_version: "1.0.0"
type: case
id: CASE-000110
name_zh: Skeleton Key 域认证主密码后门
name_en: Skeleton Key Domain-Authentication Master-Password Backdoor
actor_or_campaign: Unattributed operators deploying Skeleton Key
subject_refs:
  - NJT-0093
  - NJS-0093-001
description_zh: 联合政府指南记录 Skeleton Key 在域控制器内覆盖 NTLM 与 Kerberos 认证过程，为任意域用户增加一个攻击者掌握的主密码，同时保持用户原密码继续有效。该行为在不逐个修改账户秘密的情况下改变验证器结果，使普通用户认证与大多数失败率基线仍可保持正常；其稳定区分证据是域控制器内存或组件完整性差异，以及同一非正常秘密对多个主体产生成功结果。公开材料没有提供每个受害环境的完整输入级日志，因此具体使用次数和来源关联仍需本地遥测补足。
description_en: Joint government guidance records Skeleton Key overriding NTLM and Kerberos authentication on domain controllers to add an attacker-held master password for any domain user while leaving each user's original password valid. The behavior changes validator outcomes without modifying account secrets individually, allowing ordinary authentication and most failure-rate baselines to remain normal. Stable discriminators are domain-controller memory or component-integrity differences and the same nonstandard secret succeeding for multiple principals. Public material does not provide complete input-level logs for every victim, so local telemetry must establish use frequency and origin.
time_range: Activity publicly documented in 2015 and summarized in joint guidance published 2024-09-25
target_sectors_zh:
  - 使用 Active Directory 域认证的组织
target_sectors_en:
  - Organizations using Active Directory domain authentication
evidence_refs:
  - REF-000303
confidence: high
status: review
