id: CASE-000111
name_zh: Solorigate 联合信任证书修改
name_en: Solorigate Federation-Trust Certificate Modification
actor_or_campaign: Solorigate operators
subject_refs:
- NJT-0093
- NJS-0093-001
- NJT-0100
- NJT-0166
- NJS-0166-001
description_zh: Microsoft 在 Solorigate 调查中描述攻击者取得 Azure AD 管理权限后，向既有域联合信任加入攻击者生成的签名证书，使攻击者签发的 SAML 令牌被目标环境视为有效并可绕过 MFA。联合设置变更与以后云资源访问分处控制面和登录面；官方狩猎方法从域联合设置变更恢复发起者、目标域、来源地址和结果，并要求在确认后轮换证书、隔离和修复
  AD FS。该案例证明选择性可信证明可以改变认证结果，也直接支持 NJT-0100 的 trust-state mutation 和跨平面 consumer 语义；但攻击者修改前已取得 Azure AD 管理权限，公开记录没有完整 pre/post 授权集合，不能单凭该案例确认
  TA0004 权限增量，也不意味着所有伪造 SAML 行为都包含信任配置修改。
description_en: Microsoft's Solorigate investigation describes attackers obtaining Azure AD administrative authority and adding an attacker-generated
  signing certificate to an existing domain federation trust, causing attacker-issued SAML tokens to be accepted as valid and able to bypass MFA.
  The federation mutation and later cloud-resource access occur in separate control and sign-in planes. Microsoft's hunting method recovers initiator,
  target domain, source address, and outcome from federation-setting changes, and the response rotates certificates and isolates and remediates
  AD FS. The case proves that a selective trusted proof can change authentication outcome and directly supports NJT-0100 trust-state mutation
  and cross-plane consumer semantics. However, the adversary already had Azure AD administrative authority before the mutation and the public
  record lacks complete before-and-after authorization sets, so the case alone cannot confirm TA0004 authority gain and does not imply that every
  forged-SAML event includes trust-configuration mutation.
time_range: Solorigate activity investigated and disclosed by Microsoft in December 2020
target_sectors_zh:
- 使用 AD FS 或云联合身份的组织
target_sectors_en:
- Organizations using AD FS or cloud-federated identity
