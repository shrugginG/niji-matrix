schema_version: "1.0.0"
type: case
id: CASE-000112
name_zh: UNC3944 MFA 要求与 Conditional Access 排除修改
name_en: UNC3944 MFA-Requirement and Conditional-Access Exclusion Modification
actor_or_campaign: UNC3944
subject_refs:
  - NJT-0093
  - NJS-0093-002
description_zh: GTIG/Mandiant 报告 UNC3944 已知会修改 MFA 使用要求，并要求防守方重点查找受信命名位置变化以及强制 MFA 的 Conditional Access 策略中对被攻陷用户或设备的排除。此类变更可以让总体策略继续处于启用状态，而只有命中指定身份、设备或来源情境的会话获得不同认证结果。报告提供了稳定的活动模式和调查重点，但没有披露每个受害者的完整策略 JSON、发起者和后续资源事件，因此单次归因仍需以本地 old/new 差异、审批缺口和命中结果确认。
description_en: GTIG and Mandiant report that UNC3944 is known to modify MFA requirements and direct defenders to examine changes to trusted named locations and exclusions of compromised users or devices from Conditional Access policies enforcing MFA. Such changes can leave the overall policy enabled while only sessions matching a selected identity, device, or origin context receive a different authentication outcome. The report provides a stable activity pattern and investigation focus but does not disclose complete policy JSON, initiator, and downstream resource events for every victim, so a specific attribution still requires local old and new differences, approval gaps, and matched outcomes.
time_range: UNC3944 activity patterns observed through 2025 and published 2025-05-06
target_sectors_zh:
  - 技术、电信、金融、BPO、游戏、酒店、零售与媒体组织
target_sectors_en:
  - Technology, telecommunications, financial services, BPO, gaming, hospitality, retail, and media organizations
evidence_refs:
