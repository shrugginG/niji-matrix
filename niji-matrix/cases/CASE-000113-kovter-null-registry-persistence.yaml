schema_version: "1.0.0"
type: case
id: CASE-000113
name_zh: Kovter null 字符 Registry 持久化
name_en: Kovter Null-Character Registry Persistence
actor_or_campaign: Kovter operators
subject_refs:
  - NJT-0094
  - NJS-0094-001
description_zh: CrowdStrike 分析 Kovter 在 Registry Run 路径和关联 file-association 状态中保存持久命令与载荷引用，其中 value 名包含 null byte 或不可读字符。Regedit 会报错，reg query 可能把它显示为默认值，而 Autoruns 仍能看到数据，形成同一对象在不同工具中的稳定可见性差。恶意命令由 Windows consumer 在以后启动或文件处理时读取；完整恢复需要装载并清理相应用户 hive，而不是只删除当前进程。该案例同时提供子技术、consumer 链与处置限制的直接证据。
description_en: CrowdStrike analyzed Kovter retaining persistent commands and payload references in Registry Run paths and related file-association state, with a value name containing a null byte or unreadable character. Regedit errors, reg query can display it as a default value, and Autoruns still exposes data, creating a stable visibility difference for the same object across tools. A Windows consumer reads the malicious command on later startup or file handling. Complete recovery requires loading and cleaning the relevant user hives rather than deleting only the current process. The case directly supports the child, consumer chain, and remediation limitations.
time_range: Kovter persistence behavior documented by CrowdStrike in public technical analysis
target_sectors_zh:
  - 运行受影响 Windows 终端的组织与个人
target_sectors_en:
  - Organizations and individuals operating affected Windows endpoints
evidence_refs:
