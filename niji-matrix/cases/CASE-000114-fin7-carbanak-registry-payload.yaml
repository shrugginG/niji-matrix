schema_version: "1.0.0"
type: case
id: CASE-000114
name_zh: FIN7 CARBANAK Registry 载荷消费链
name_en: FIN7 CARBANAK Registry-Payload Consumption Chain
actor_or_campaign: FIN7
subject_refs:
  - NJT-0094
description_zh: Mandiant 在 FIN7 入侵调查中观察到恶意 shim database 在 services.exe 启动时触发第一阶段 loader；loader 定位 Registry 中保存的 shellcode 与 CARBANAK DLL，解压后把执行转移到载荷，并创建包含 CARBANAK 的 svchost 进程。该链将 Registry 状态、启动 consumer 与运行结果直接连接，证明 Registry 驻留对象能够在原写入会话之后恢复恶意功能。来源没有把该路径描述为 null/API 差分，因此本案例只支持父技术，不作为 NJS-0094-001 的证据。
description_en: Mandiant observed in FIN7 intrusion investigations a malicious shim database triggering a first-stage loader when services.exe started. The loader located shellcode and a CARBANAK DLL stored in the Registry, decompressed them, transferred execution to the payload, and created a svchost process containing CARBANAK. This chain directly links Registry state, a startup consumer, and runtime outcome, establishing that Registry-resident objects can restore malicious capability after the original write session. The source does not describe a null or API differential, so the case supports only the parent and not NJS-0094-001.
time_range: FIN7 activity documented by Mandiant in public incident analysis
target_sectors_zh:
  - FIN7 针对的金融与零售环境
target_sectors_en:
  - Financial and retail environments targeted by FIN7
evidence_refs:
  - REF-000311
confidence: high
status: review
