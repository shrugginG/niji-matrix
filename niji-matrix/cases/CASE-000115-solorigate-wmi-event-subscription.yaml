schema_version: "1.0.0"
type: case
id: CASE-000115
name_zh: Solorigate WMI Event Filter 与 Consumer 持久化
name_en: Solorigate WMI Event-Filter and Consumer Persistence
actor_or_campaign: Solorigate operators
subject_refs:
  - NJT-0090
  - NJS-0090-002
description_zh: Microsoft 在 Solorigate 跨域调查中记录攻击者把 WMI event filter 与恶意 logical consumer 绑定，使载荷在重启后由 WMI 基础设施恢复执行；Defender 告警能够同时显示持久注册和计划命令。注册动作与以后 WmiPrvSE/broker 执行分处不同时间和审计面，进程侧仅看受信 WMI 宿主不足以恢复最初注册者。该案例直接支持父级持久事件关系和 Broker 来源分离，但公开报告没有披露完整 WQL 谓词及长期匹配率，因此不作为 NJS-0090-001 的直接案例。
description_en: Microsoft's cross-domain Solorigate investigation records attackers binding a WMI event filter to a malicious logical consumer so WMI infrastructure restored payload execution after reboot, with Defender alerts showing the durable registration and scheduled command together. Registration and later WmiPrvSE or broker execution occupy different times and audit planes, so a process-side view of the trusted WMI host alone cannot recover the original registrant. The case directly supports the parent durable event relationship and broker provenance separation, but the public report does not disclose complete WQL predicates or long-term match rates and therefore is not a direct NJS-0090-001 case.
time_range: Solorigate activity investigated and disclosed by Microsoft in December 2020
target_sectors_zh:
  - 受 Solorigate 影响的 Windows 企业环境
target_sectors_en:
  - Windows enterprise environments affected by Solorigate
evidence_refs:
  - REF-000304
confidence: high
status: review
