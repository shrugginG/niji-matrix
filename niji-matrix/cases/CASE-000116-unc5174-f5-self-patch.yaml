schema_version: "1.0.0"
type: case
id: CASE-000116
name_zh: UNC5174 建立后门账户后自修补 F5 漏洞
name_en: UNC5174 Self-Patching F5 After Establishing Backdoor Accounts
actor_or_campaign: UNC5174
subject_refs: [NJT-0091, NJS-0091-001]
description_zh: Mandiant 在 2023 年 10 月的 F5 BIG-IP 入侵中观察到 UNC5174 利用 CVE-2023-46747、创建 f5support3 等后门管理账户并部署 SNOWLIGHT 等工具，随后运行厂商 mitigation.sh 自修补原漏洞。Mandiant 评估该行为意在阻止无关攻击者再次利用；审计记录保留 exploit、账户创建、命令、来源地址和补丁时序。该案例直接证明替代入口先建立、原面后关闭的顺序，但不能证明所有入侵后补丁都由攻击者执行。
description_en: In an October 2023 F5 BIG-IP intrusion, Mandiant observed UNC5174 exploit CVE-2023-46747, create backdoor administrative accounts such as f5support3, deploy tooling including SNOWLIGHT, and then run the vendor mitigation.sh to self-patch the original vulnerability. Mandiant assessed the action as preventing unrelated actors from exploiting the device later. Audit records preserve exploitation, account creation, command, source address, and patch timing. The case directly establishes alternative entry first and original surface closure later but does not make every post-compromise patch adversary-controlled.
time_range: 2023-10 through 2023-11
target_sectors_zh: [政府、研究、教育、NGO 与使用 F5 BIG-IP 的其他组织]
target_sectors_en: [Government, research, education, NGO, and other organizations using F5 BIG-IP]
evidence_refs: [REF-000314]
confidence: high
status: review
