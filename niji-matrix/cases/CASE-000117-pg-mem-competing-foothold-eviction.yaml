type: case
id: CASE-000117
name_zh: PG_MEM 清除竞争恶意进程与 Cron
name_en: PG_MEM Eviction of Competing Malware Processes and Cron
actor_or_campaign: PG_MEM operators
subject_refs: [NJT-0091, NJS-0091-002]
description_zh: Aqua Nautilus 在暴露 PostgreSQL honeypot 中观察攻击者爆破成功后创建高权限后门角色、剥夺原 postgres 用户 superuser 权限、删除当前用户 cron，并 kill kdevtmpfsi、kinsing、postgres-kernel 等自己历史或竞争进程；同一链又部署 PG_MEM、XMRIG 和新的 cron 持久化。清除对象与存续对象、命令时序和后继 miner 结果直接展示选择性，而不是防守方全面处置。
description_en: Aqua Nautilus observed an adversary in an exposed PostgreSQL honeypot create a privileged backdoor role after successful brute force, strip the original postgres user of superuser authority, remove current-user cron jobs, and kill kdevtmpfsi, kinsing, postgres-kernel, and other historical or competing processes. The same chain deployed PG_MEM, XMRIG, and new cron persistence. Removed and surviving objects, command sequence, and downstream miner outcome directly demonstrate selectivity rather than comprehensive defensive remediation.
time_range: Activity published by Aqua Nautilus on 2024-08-19
target_sectors_zh: [暴露弱口令 PostgreSQL 服务的云与 Linux 环境]
target_sectors_en: [Cloud and Linux environments exposing weakly protected PostgreSQL services]
evidence_refs: [REF-000315]
confidence: high
status: review
