id: CASE-000118
name_zh: NetSky.P 删除 Bagle Run Keys
name_en: NetSky.P Removal of Bagle Run Keys
actor_or_campaign: NetSky.P operators
subject_refs: [NJT-0091, NJS-0091-002]
description_zh: F-Secure 记录 NetSky.P 在复制并传播自身的同时，删除多种 Bagle 变体使用的 Registry Run keys。自身副本与传播路径保留，竞争驻留状态被选择性移除，直接支持竞争立足点清除这一变量。报告年代较早且没有现代 EDR 的终止/删除主体字段，因此可用于证明行为和对象差分，但具体攻击者意图与完整时间线置信度低于 PG_MEM。
description_en: F-Secure records NetSky.P copying and spreading itself while deleting Registry Run keys used by multiple Bagle variants. Its own copy and propagation remain while competing persistence state is selectively removed, directly supporting the competing-foothold-eviction variable. The report is older and lacks modern EDR fields for termination or deletion principal, so it establishes behavior and object difference but provides lower confidence in subjective intent and complete timeline than PG_MEM.
time_range: NetSky.P activity documented by F-Secure in the 2004 worm period
target_sectors_zh: [受 NetSky.P 与 Bagle 传播影响的 Windows 环境]
target_sectors_en: [Windows environments affected by NetSky.P and Bagle propagation]
evidence_refs: [REF-000316]
confidence: medium
status: review
