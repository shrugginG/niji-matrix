schema_version: "1.0.0"
type: case
id: CASE-000119
name_zh: Heartbleed 窃取并重放活动 VPN 会话
name_en: Heartbleed Theft and Replay of Active VPN Sessions
actor_or_campaign: Unattributed operators exploiting Heartbleed against VPN services
subject_refs: [NJT-0055, NJS-0055-001]
description_zh: Mandiant 记录攻击者利用 Heartbleed 从 VPN 设备内存取得活动 SSL VPN token，并从另一来源重放该状态以继承已经完成的认证，绕过新的口令、MFA 与客户端检查。网关把重放视为既有会话延续，但同一 session/token 在来源 IP 或并发使用上的跳变仍能暴露。该案例直接支持会话状态重放及跨来源关联，不表示所有 VPN token 都可跨设备或跨来源复用。
description_en: Mandiant records adversaries exploiting Heartbleed to obtain active SSL VPN tokens from appliance memory and replaying that state from another origin to inherit completed authentication and bypass a new password, MFA, and client check. The gateway treats the replay as continuation of an existing session, while source-IP hopping or concurrent use of the same session or token remains observable. The case directly supports session-state replay and cross-origin correlation without implying that every VPN token is reusable across devices or origins.
time_range: Heartbleed VPN exploitation disclosed by Mandiant after CVE-2014-0160
target_sectors_zh: [使用受影响 SSL VPN 设备的组织]
target_sectors_en: [Organizations using affected SSL VPN appliances]
evidence_refs: [REF-000102]
confidence: high
status: review
