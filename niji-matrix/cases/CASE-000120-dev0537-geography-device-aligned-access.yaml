id: CASE-000120
name_zh: DEV-0537 地理接近 VPN 与设备情境对齐
name_en: DEV-0537 Geography-Proximate VPN and Device-Context Alignment
actor_or_campaign: DEV-0537 / LAPSUS$
subject_refs: [NJT-0055, NJS-0055-002]
description_zh: Microsoft 记录 DEV-0537 选择接近受害者地理位置的 VPN 出口并注册设备以满足条件访问，使登录来源与设备情境更接近目标用户正常访问。该行为可以压低不可能旅行、陌生网络或未注册设备等粗粒度风险信号，但设备注册本身仍属于 T1098，NJS-0055-002 只引用以后远程会话使用该情境的部分。来源未公开每个会话完整风险评分，因此具体效果仍需本地登录与设备日志验证。
description_en: Microsoft records DEV-0537 selecting VPN egress near victim geography and registering devices to satisfy Conditional Access, making sign-in origin and device context closer to normal user access. This can lower coarse impossible-travel, unfamiliar-network, or unregistered-device signals, but device registration itself remains T1098 and NJS-0055-002 cites only later remote sessions using that context. The source does not publish complete risk scores for every session, so specific effect still requires local sign-in and device logs.
time_range: DEV-0537 activity publicly documented by Microsoft on 2022-03-22
