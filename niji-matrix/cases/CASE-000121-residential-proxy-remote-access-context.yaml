id: CASE-000121
name_zh: UNC3944 与疑似俄罗斯活动的本地住宅代理情境
name_en: Local Residential-Proxy Context in UNC3944 and Suspected Russian Activity
actor_or_campaign: UNC3944 and suspected Russian operators
subject_refs: [NJT-0055, NJS-0055-002, NJT-0061, NJS-0061-001]
description_zh: Mandiant 分别记录 UNC3944 使用与受害者本地情境接近的商业住宅代理，以及疑似俄罗斯活动使用目标同国主要 ISP 的住宅或移动代理进行认证。来源、ASN/ISP 与地理位置因而更接近真实用户，降低只依赖 IP 地理与不可能旅行的区分力；代理账户、出口轮换、设备/客户端、时间、token/session 与后继资源仍可揭示异常。两组活动不应合并归因，本案例只合并它们共同证明的风险情境变量。
description_en: Mandiant separately records UNC3944 using commercial residential proxies near victim locality and suspected Russian activity authenticating through residential or mobile proxies on major ISPs in the target country. Origin, ASN or ISP, and geography therefore resemble real users and weaken discrimination based only on IP geography and impossible travel, while proxy accounts, egress rotation, device or client, time, token or session, and downstream resources remain observable. The two activities are not merged for attribution; the case combines only the risk-context variable they independently establish.
time_range: Separate UNC3944 and suspected Russian campaigns documented by Mandiant
