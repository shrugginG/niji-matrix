schema_version: 1.0.0
type: case
id: CASE-000122
name_zh: Glupteba 借用 CompMgmtLauncher 与 fodhelper 提权中介
name_en: Glupteba Borrowing CompMgmtLauncher and fodhelper as Elevation Intermediaries
actor_or_campaign: Glupteba
subject_refs: [NJT-0098, NJS-0098-001]
description_zh: Cybereason 在 2019 年多个客户环境观察到的 Glupteba 变体修改用户可写的 HKCU 类处理器，使其指向恶意可执行文件，再调用 CompMgmtLauncher 或 fodhelper 绕过 UAC。报告展示受信父进程后出现 system-level 子进程；因此案例结论限于攻击者输入经原生受信中介产生高权限结果的谱系分离，不将整个活动的其他 rootkit、挖矿或传播行为归入本子技术。
description_en: Cybereason observed 2019 Glupteba variants across multiple customer environments modifying user-writable HKCU class handlers to point at malicious executables and then invoking CompMgmtLauncher or fodhelper to bypass UAC. The report shows a system-level child after the trusted parent. The case conclusion is therefore limited to lineage separation where adversary input produces a privileged outcome through a native trusted intermediary; other campaign behavior such as rootkit use, mining, or propagation is not attributed to this subtechnique.
time_range: '2019'
target_sectors_zh: [跨行业客户环境]
target_sectors_en: [Cross-sector customer environments]
evidence_refs: [REF-000325]
