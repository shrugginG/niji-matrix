type: case
id: CASE-000123
name_zh: Lotus Blossom 的另一进程令牌与启动权限调整
name_en: Lotus Blossom Another-Process Token and Launch-Privilege Adjustment
actor_or_campaign: Lotus Blossom
subject_refs: [NJT-0099]
description_zh: Cisco Talos 在其归因于 Lotus Blossom 的多阶段活动中观察到一个权限调整工具，该工具取得另一进程的令牌并为启动进程调整权限。案例直接证明真实行动把令牌来源和后继启动上下文跨进程连接；公开报告没有给出 thread token ID、具体令牌类型、权限前后态或资源消费，因此只支持父级行为，不强行归入某一 Niji 子技术。
description_en: Cisco Talos observed an adjust-privilege tool in multistage activity attributed to Lotus Blossom that retrieved another process token and adjusted privilege for the launch process. The case directly establishes a real operation linking token provenance and successor launch context across processes. Because the public report does not expose thread token ID, exact token type, privilege before and after state, or resource consumption, it supports the parent behavior only and is not forced into one Niji child.
time_range: '2025 report; campaigns observed before publication'
