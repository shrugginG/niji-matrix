id: CASE-000124
name_zh: PipeMon 的令牌模拟、PPID 重启与 SeLoadDriverPrivilege 序列
name_en: PipeMon Token Impersonation, PPID Restart, and SeLoadDriverPrivilege Sequence
actor_or_campaign: Winnti Group PipeMon
subject_refs: [NJT-0099, NJS-0099-002, NJS-0099-003]
description_zh: ESET 在韩国与台湾游戏企业入侵中分析 PipeMon installer：程序检查是否已提权，在旧版 Windows 上尝试令牌模拟；`-x:1` 尝试为当前进程启用 SeLoadDriverPrivilege，失败后通过父进程欺骗以 `-x:2` 重启，再次启用该权限以安装载荷。该序列直接支持新进程谱系变化与同一令牌权限位激活可以分别参与提权；它不把 PipeMon 后续 Print Processor、注入和 C2 行为归给这两个子技术。
description_en: ESET analyzed the PipeMon installer in intrusions at gaming companies in South Korea and Taiwan. The program checks elevation and attempts token impersonation on older Windows versions; `-x:1` tries to enable SeLoadDriverPrivilege for the current process and, on failure, restarts through parent-process spoofing as `-x:2` before enabling the privilege again to install the payload. The sequence directly supports new-process lineage change and same-token privilege-bit activation as separate contributors to elevation. Later Print Processor, injection, and command-and-control behavior is not attributed to these children.
time_range: '2019–2020'
target_sectors_zh: [电子游戏开发]
target_sectors_en: [Video game development]
