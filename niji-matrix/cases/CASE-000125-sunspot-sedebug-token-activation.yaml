schema_version: 1.0.0
type: case
id: CASE-000125
name_zh: SUNSPOT 启用令牌 SeDebugPrivilege 后读取进程内存
name_en: SUNSPOT Token SeDebugPrivilege Enablement Before Process-Memory Access
actor_or_campaign: StellarParticle SUNSPOT
subject_refs: [NJT-0099, NJS-0099-003]
description_zh: CrowdStrike 在 SolarWinds 构建服务器调查中记录 SUNSPOT 修改自身进程安全令牌以启用 SeDebugPrivilege，该步骤是读取其他进程内存并继续监控 MsBuild 的前提。进程与身份外观保持不变，权限位变化直接连接后继受保护访问，因而该案例支持休眠令牌权限选择性激活；报告措辞中的“add”不改变 Windows 官方限制，即 AdjustTokenPrivileges 不能增加令牌原本不存在的权限。
description_en: CrowdStrike recorded during its SolarWinds build-server investigation that SUNSPOT modified its own process security token to enable SeDebugPrivilege, a prerequisite for reading other-process memory and continuing MsBuild monitoring. Process and identity appearance remained stable while the privilege-bit transition directly preceded protected access, supporting Dormant-Token Privilege Selective Activation. The report's use of “add” does not override the documented Windows constraint that AdjustTokenPrivileges cannot add a privilege absent from the token.
time_range: '2020–2021 investigation'
target_sectors_zh: [软件供应链, 构建基础设施]
target_sectors_en: [Software supply chain, Build infrastructure]
evidence_refs: [REF-000252, REF-000331]
confidence: high
status: review
