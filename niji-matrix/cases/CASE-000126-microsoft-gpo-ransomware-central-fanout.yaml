schema_version: "1.0.0"
type: case
id: CASE-000126
name_zh: Microsoft 基于 GPO 的勒索软件集中扇出事件
name_en: Microsoft GPO-Based Ransomware Central-Fanout Incident
actor_or_campaign: Unnamed human-operated ransomware actor
subject_refs:
  - NJT-0100
  - NJT-0125
description_zh: Microsoft Defender Security Research Team 描述攻击者在一所大型教育机构创建恶意 GPO，先尝试关闭 Defender 控制，约十分钟后又创建 GPO 配置计划任务；攻击者把三个载荷写入 SYSVOL，设备随后自行拉取并执行。该事件直接显示一次集中 policy write 如何由可信 Group Policy 与设备消费链扇出，并使 writer、控制面对象和 endpoint 结果分离。Defender 的预测性防护阻止了该 GPO 路径，零设备经此路径加密，因此案例不证明权限提升、成功的恶意 consumer result 或用后回退。
description_en: Microsoft Defender Security Research Team describes an adversary at a large educational institution creating malicious GPOs, first attempting to disable Defender controls and about ten minutes later creating another GPO to configure a scheduled task. The adversary placed three payload files in SYSVOL and devices would then pull and execute them. The incident directly shows how one centralized policy write fans out through trusted Group Policy and device-consumption chains, separating writer, control-plane object, and endpoint outcome. Defender predictive shielding blocked the GPO path and zero devices were encrypted through it, so the case does not prove elevation, a successful malicious consumer result, or post-use reversion.
time_range: Incident disclosed by Microsoft on 2026-03-23
target_sectors_zh: [大型教育机构]
target_sectors_en: [Large educational organization]
evidence_refs: [REF-000344]
confidence: high
status: review
