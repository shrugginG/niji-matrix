id: CASE-000127
name_zh: Siloscape 宿主资源别名逃逸
name_en: Siloscape Host-Resource Alias Escape
actor_or_campaign: Siloscape operator
subject_refs: [NJT-0101, NJS-0101-001]
description_zh: Unit 42 在 2021 年分析了已在野运行的 Siloscape。攻击者先在 Windows 容器取得代码执行，恶意程序模仿 CExecSvc.exe 线程取得 SeTcbPrivilege，再创建 global symbolic link，把容器化 X 盘指向宿主 C 盘。随后同一恶意链经该别名搜索宿主 kubectl.exe 与 kubeconfig、写入 Tor 与解压程序，并在宿主节点执行命令。该案例直接证明 container-visible alias 指向 canonical host resource、访问主体与资源归属跨 object namespace 分离以及 host-only outcome；公开材料没有给出组织授权策略的形式化 pre/post set，因此事件级权限差按“容器原本不可访问宿主 C 盘与节点凭据”强推断。
description_en: Unit 42 analyzed Siloscape operating in the wild in 2021. After code execution inside a Windows container, the malware impersonated a CExecSvc.exe thread to obtain SeTcbPrivilege and created a global symbolic link mapping its containerized X drive to host C. The same malicious chain then used the alias to search the host for kubectl.exe and kubeconfig, write Tor and an unzip utility, and execute commands on the node. The case directly establishes a container-visible alias pointing to a canonical host resource, separation between accessing actor and resource ownership across object namespaces, and a host-only outcome. Public reporting does not provide a formal organizational pre-state and post-state authorization set, so the event-level authority difference is strongly inferred from access to host C and node credentials that the container previously lacked.
time_range: Campaign active for more than one year before disclosure on 2021-06-07
target_sectors_zh: [运行 Windows Server 容器的 Kubernetes 环境]
target_sectors_en: [Kubernetes environments running Windows Server containers]
evidence_refs: [REF-000349]
confidence: high
status: review
