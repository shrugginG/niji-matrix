type: case
id: CASE-000128
name_zh: TeamTNT 宿主挂载与运行时 Broker 逃逸路径
name_en: TeamTNT Host-Mount and Runtime-Broker Escape Paths
actor_or_campaign: TeamTNT
subject_refs: [NJT-0101, NJS-0101-001, NJS-0101-002]
description_zh: Aqua Team Nautilus 对 TeamTNT Docker Hub 镜像和实战样本的动态分析发现，AVscan 路径把宿主根目录挂入容器后 chroot，随后改写宿主 cron、账户、SSH 和系统文件；这直接支持 alias→canonical host filesystem→host effect。另一个 docker-escape 工具会探测 Docker TCP 或挂载的 /var/run/docker.sock，并在成功时由 runtime 启动把宿主盘映射到 /hostOS 的 privileged container；该代码与实战镜像关联，直接证明攻击者准备并控制 Broker 请求路径，但报告没有逐受害主机证明每次 socket 分支均成功。因此 alias 成功链为 high，Broker 事件成功保持 medium，正式检测仍须连接具体 request、daemon transaction、新容器与 host-only result。
description_en: Aqua Team Nautilus dynamically analyzed TeamTNT Docker Hub images and in-the-wild samples. Its AVscan path mounted the host root into a container and chrooted before modifying host cron, accounts, SSH, and system files, directly supporting alias to canonical host filesystem to host effect. Another docker-escape tool probed Docker TCP or mounted /var/run/docker.sock and, on success, had the runtime start a privileged container mapping the host drive at /hostOS. The code is tied to images used in attacks and directly establishes adversary preparation and control of a broker-request path, but the report does not prove that every socket branch succeeded on each victim. The alias success chain is high confidence, while event-level broker success remains medium and formal detection still requires a concrete request, daemon transaction, new container, and host-only result.
time_range: Images uploaded and analyzed during 2020
target_sectors_zh: [暴露 Docker API 或运行攻击者容器镜像的云原生宿主]
target_sectors_en: [Cloud-native hosts exposing Docker APIs or running adversary container images]
evidence_refs: [REF-000350]
confidence: high
status: review
