schema_version: 1.0.0
type: case
id: CASE-000129
name_zh: PwnKit 脆弱权限转换研究链
name_en: PwnKit Vulnerable Authority-Transition Research Chain
actor_or_campaign: Qualys Research Team proof of concept
subject_refs: [NJT-0102]
description_zh: Qualys 原始研究从低权限调用者构造 argc=0 的 execve 输入开始，证明 pkexec 因 argv/envp 相邻布局而越界读取和写回 environment，重新引入 SUID 执行前本应被 loader 移除的变量，并在 Ubuntu、Debian、Fedora 与 CentOS 默认安装上获得 full root。该链直接支持 pre-state→exact pkexec flaw→attacker-controlled argument/environment→vulnerable privileged consumer→root result，且结果没有相应正常 polkit approval。它是研究 PoC 而非在野活动，不能证明匿迹意图、无 crash 或全部发行版/非 Linux 可利用性。
description_en: Qualys's original research begins with a low-authority caller constructing an argc-zero execve input and proves that adjacent argv and envp layout makes pkexec read and write out of bounds, reintroducing a variable that the loader should strip before SUID execution and obtaining full root on default Ubuntu, Debian, Fedora, and CentOS installations. The chain directly supports pre-state to exact pkexec flaw to attacker-controlled arguments and environment to vulnerable privileged consumer to root result without a corresponding ordinary polkit approval. It is a research proof of concept rather than field activity and does not establish concealment intent, crash-free behavior, or exploitability across every distribution or non-Linux system.
time_range: Disclosed 2022-01-25 after coordinated research and vendor notification
target_sectors_zh: [运行脆弱 polkit pkexec 的 Linux 主机]
target_sectors_en: [Linux hosts running vulnerable polkit pkexec]
evidence_refs: [REF-000356]
confidence: high
status: review
