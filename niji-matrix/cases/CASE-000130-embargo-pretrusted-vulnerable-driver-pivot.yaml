schema_version: 1.0.0
type: case
id: CASE-000130
name_zh: Embargo 预受信 probmon.sys 驱动权限枢转
name_en: Embargo Pretrusted probmon.sys Driver Authority Pivot
actor_or_campaign: Embargo ransomware operators
subject_refs: [NJT-0102, NJS-0102-001]
description_zh: ESET 在 2024 年 7 月多个事件中分析 Embargo 的 MS4Killer：程序把由已撤销厂商证书签名的旧版 probmon.sys 3.0.0.4 作为 RC4 加密 blob 携带，以 Sysprox.sys 或 Sysmon64.sys 名称写入，启用 SeLoadDriverPrivilege、创建 service/registry 状态并用 FilterLoad 接纳组件，随后经其接口持续终止安全软件进程，为 ransomware 执行清除防护。事件直接连接 attacker-supplied exact vulnerable component、签名/系统驱动外观、load transaction、kernel capability 与安全工具效果，支持来源遮蔽和独立组件策略。证书已撤销，故不能仅由签名推断事件时一定被默认策略允许；具体环境仍要保存 Code Integrity/admission result。
description_en: ESET analyzed Embargo's MS4Killer in multiple July 2024 incidents. The program carried old probmon.sys version 3.0.0.4, signed with a now-revoked vendor certificate, as an RC4-encrypted blob; wrote it as Sysprox.sys or Sysmon64.sys; enabled SeLoadDriverPrivilege; created service and Registry state; admitted the component through FilterLoad; and then used its interface to terminate security-software processes continuously so ransomware could run without protection. The event directly joins an attacker-supplied exact vulnerable component, signed or system-driver appearance, load transaction, kernel capability, and security-tool effect, supporting provenance masking and a distinct component policy. Because the certificate was revoked, signature alone cannot prove default admission by the event-time policy; concrete environments must preserve the Code Integrity or admission result.
time_range: Multiple incidents observed during July 2024
target_sectors_zh: [遭受 Embargo ransomware 入侵的 Windows 环境]
target_sectors_en: [Windows environments compromised by Embargo ransomware]
evidence_refs: [REF-000359, REF-000360, REF-000361]
confidence: high
status: review
