schema_version: 1.0.0
type: case
id: CASE-000131
name_zh: Ursnif TLS Callback 注入调度
name_en: Ursnif TLS Callback Injection Dispatch
actor_or_campaign: Ursnif / Gozi-ISFB campaign cluster
subject_refs: [NJT-0103, NJS-0103-002]
description_zh: Mandiant 从 spam-delivered Ursnif 样本恢复 crafted TLS directory 与 AddressOfCallbacks，观察 malware 向 child process 写入 callback state、unmap 后调用 ResumeThread，并证明真实恶意入口在 PE AddressOfEntryPoint 之前由 TLS callback 运行。该链直接支持 target birth/initialization flow 被替换、名义入口误导 debugger/unpacker 和 callback/entry residual；公开报告没有 source/target token、完整 memory backing 或首个新增授权结果，因此案例不能确认 NJS-0103-001、NJS-0103-003 或 TA0004 elevation。
description_en: Mandiant recovered a crafted TLS directory and AddressOfCallbacks from a spam-delivered Ursnif sample, observed malware write callback state into a child process and call ResumeThread after unmapping, and proved that the true malicious entry ran through the TLS callback before the PE AddressOfEntryPoint. The chain directly supports substitution of target birth or initialization flow, nominal-entrypoint deception, and callback and entry residuals. The public report lacks source and target tokens, complete memory backing, and a first newly authorized result, so the case does not confirm NJS-0103-001, NJS-0103-003, or TA0004 elevation.
time_range: Field sample reported 2017-11-28 from campaigns observed during 2017
target_sectors_zh: [收到 Ursnif 垃圾邮件活动的 Windows 用户]
target_sectors_en: [Windows users targeted by Ursnif spam campaigns]
evidence_refs: [REF-000365]
confidence: high
status: review
