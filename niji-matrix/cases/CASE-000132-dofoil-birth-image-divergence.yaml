schema_version: 1.0.0
type: case
id: CASE-000132
name_zh: Dofoil Explorer 创建期映像替换
name_en: Dofoil Explorer Birth-Time Image Substitution
actor_or_campaign: Dofoil / Smoke Loader campaign
subject_refs: [NJT-0103, NJS-0103-003]
description_zh: Microsoft 在 2018 年 3 月 6 日大规模 Dofoil 活动中检测到 trojan 启动新的合法 `explorer.exe` 实例并以恶意代码替换其内容，hollowed explorer 随后产生下载/挖矿后继行为。它直接证明 creation identity 与 first executed content 分离，以及 path、command line、network 和 behavior signals 能揭示矛盾；报告没有公开完整 source→write→resume 字段或 source/target authority differential，因此案例支持 birth-image 子轴与通用注入，不证明自动提权或全部 transient-image 变体。
description_en: Microsoft detected in the large 6 March 2018 Dofoil campaign a trojan start a new legitimate `explorer.exe` instance and replace its contents with malicious code, after which the hollowed explorer produced download and mining behavior. It directly proves separation of creation identity from first executed content and shows path, command-line, network, and behavior signals can expose the contradiction. The report does not publish the complete source-to-write-to-resume fields or source and target authority differential, so the case supports the birth-image child and generic injection without proving automatic elevation or every transient-image variant.
time_range: Microsoft detected the outbreak on 2018-03-06 and reported it on 2018-03-07
target_sectors_zh: [Dofoil 大规模恶意挖矿活动影响的 Windows 终端]
target_sectors_en: [Windows endpoints affected by the large Dofoil coin-mining campaign]
evidence_refs: [REF-000369]
confidence: high
status: review
