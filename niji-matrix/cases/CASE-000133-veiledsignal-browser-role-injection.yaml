schema_version: 1.0.0
type: case
id: CASE-000133
name_zh: VEILEDSIGNAL 浏览器角色贴合注入
name_en: VEILEDSIGNAL Browser Role-Conforming Injection
actor_or_campaign: UNC4736 / VEILEDSIGNAL in the X_TRADER and 3CX supply-chain investigation
subject_refs: [NJT-0103, NJS-0103-004]
description_zh: Mandiant 事件响应识别 VEILEDSIGNAL 的独立 process-injection module：它枚举并选择首个 Chrome、Firefox 或 Edge 实例，把 C2 communication module 放入浏览器上下文，再以 named pipe 与 backdoor 协作并在需要时重新注入。该链直接支持攻击者可控 target role、浏览器网络行为与 payload 目的贴合以及 source/module/target/pipe 残余。报告没有明说选择 browser 的唯一动机，也没有权限前后态；因此角色贴合由字段事实与 Microsoft/Mandiant 机制证据共同成立，案例自身不证明 TA0004 成功。
description_en: Mandiant incident response identified a dedicated VEILEDSIGNAL process-injection module that enumerated and selected the first Chrome, Firefox, or Edge instance, placed the C2 communication module in browser context, coordinated with the backdoor over a named pipe, and reinjected when necessary. The chain directly supports adversary-controlled target role, conformity between browser networking and payload purpose, and source, module, target, and pipe residuals. The report does not state that role conformity was the sole selection motive or publish authority pre-state and post-state. The child therefore relies on these field facts plus Microsoft and Mandiant mechanism evidence, while the case alone does not prove TA0004 success.
time_range: Upstream X_TRADER compromise investigated and reported in April 2023 during the 3CX response
target_sectors_zh: [X_TRADER 与 3CX 软件供应链受影响组织]
target_sectors_en: [Organizations affected by the X_TRADER and 3CX software supply chains]
evidence_refs: [REF-000108]
confidence: high
status: review
