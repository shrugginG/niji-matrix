name_zh: DueDLLigence 无背衬与角色贴合受控研究
name_en: DueDLLigence Unbacked and Role-Conforming Controlled Study
actor_or_campaign: Mandiant Red Team controlled assessment methodology
subject_refs:
- NJT-0103
- NJS-0103-001
- NJS-0103-004
- NJS-0177-001
description_zh: Mandiant Red Team 将 shellcode injection 与本进程 execution 区分，并在 DueDLLigence 中把 CreateRemoteThread/QueueUserAPC
  设为可切换实现；研究明确举例，把原本异常主体执行的 LSASS 访问迁移到经常执行该访问的 `svchost.exe`，可让 EDR 看到预期 process/action。它直接证明无独立 payload image 的 target-memory
  执行、target role 可控和 observation effect，并给出 process tree、VirtualProtectEx 与 remote-memory residual。该对象是授权红队研究，不代表在野 prevalence，也没有证明跨
  integrity access 或 TA0004 正权限差。
description_en: Mandiant Red Team distinguishes shellcode injection from same-process execution and makes CreateRemoteThread
  or QueueUserAPC selectable in DueDLLigence. The research explicitly illustrates moving LSASS access from an anomalous subject
  into `svchost.exe`, which commonly performs that access, so EDR observes an expected process and action. It directly establishes
  target-memory execution without an independent payload image, controllable target role, observation effect, and process-tree,
  VirtualProtectEx, and remote-memory residuals. This is authorized red-team research, not field prevalence, and does not
  prove cross-integrity access or a TA0004 positive authority difference.
time_range: Controlled methodology published 2019-10-10
