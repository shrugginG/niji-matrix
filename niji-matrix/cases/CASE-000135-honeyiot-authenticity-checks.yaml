id: CASE-000135
name_zh: HoneyIoT 观测到的攻击前真实性检查与行为转折
name_en: Pre-Attack Authenticity Checks and Behavioral Transitions Observed by HoneyIoT
actor_or_campaign: Internet-origin IoT attackers observed by HoneyIoT
subject_refs: [NJT-0104, NJS-0104-001, NJS-0104-003]
description_zh: HoneyIoT 研究观察到攻击者在完整攻击前检查端口、服务和蜜罐指纹。静态横幅或服务行为不一致可导致目标被识别、拉黑或攻击终止；自适应高交互响应通过检查后，系统进一步获得恶意软件上传。该对照证明了真实性判断与后续载荷暴露之间的条件关系，但不证明所有远程探测都具有反诱捕目的。
description_en: HoneyIoT observed attackers checking ports, services, and honeypot fingerprints before full attacks. Static banners or inconsistent service behavior could lead to identification, blacklisting, or termination, while adaptive high-interaction responses that passed the checks were followed by malware uploads. This contrast establishes a conditional relationship between authenticity assessment and payload exposure but does not show that all remote probing has an anti-deception purpose.
time_range: null
target_sectors_zh: [物联网设备]
target_sectors_en: [Internet of Things devices]
