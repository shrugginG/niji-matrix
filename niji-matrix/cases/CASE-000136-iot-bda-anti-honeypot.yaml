name_zh: IoT-BDA 样本中的反蜜罐行为
name_en: Anti-Honeypot Behavior in IoT-BDA Samples
actor_or_campaign: IoT botnet malware corpus
subject_refs: [NJT-0104, NJS-0104-003]
description_zh: IoT-BDA 在七个月内收集并分析 4077 个物联网僵尸网络样本，并报告反蜜罐、反分析、持久化和反取证行为。该样本集说明反诱捕规避并非单一工具或实验假设，但公开材料不足以把全部样本精确归入跨表面挑战或分布式纵向关联。
description_en: IoT-BDA collected and analyzed 4,077 IoT botnet samples over seven months and reported anti-honeypot, anti-analysis, persistence, and anti-forensics behavior. The corpus shows that anti-deception evasion is not limited to one tool or a laboratory hypothesis, but the public material is insufficient to assign every sample precisely to cross-surface challenges or distributed longitudinal correlation.
