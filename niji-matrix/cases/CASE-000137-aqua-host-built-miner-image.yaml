schema_version: 1.0.0
type: case
id: CASE-000137
name_zh: 暴露 Docker API 上的宿主构建挖矿镜像攻击
name_en: Host-Built Mining Image Attack Through an Exposed Docker API
actor_or_campaign: Internet-origin container attacker observed by Aqua Team Nautilus
subject_refs: [NJT-0105]
description_zh: Aqua Team Nautilus 观察到攻击者向配置不当的 Docker API 提交构建请求，从正常 Alpine 基础镜像开始，在 Dockerfile 中通过 WGET 取得恶意脚本，然后使用新的本地镜像创建并运行挖矿容器。攻击没有拉取可预先列入封禁的恶意成品镜像，镜像名称与 ID 在宿主上新生成，直接证明了构建调用、外部内容、本地摘要与后续部署的因果链。
description_en: Aqua Team Nautilus observed an attacker submit a build request to a misconfigured Docker API, start from a
  benign Alpine base image, retrieve a malicious script with WGET in the Dockerfile, and then create and run a mining container
  from the new local image. The attack did not pull a finished malicious image that could be blocklisted in advance, and the
  image name and ID were newly generated on-host, directly establishing the causal chain from build invocation through external
  content and local digest to deployment.
time_range: '2020'
target_sectors_zh: [容器基础设施]
target_sectors_en: [Container infrastructure]
evidence_refs: [REF-000412]
confidence: high
status: review
