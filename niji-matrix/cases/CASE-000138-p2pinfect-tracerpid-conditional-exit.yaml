schema_version: 1.0.0
type: case
id: CASE-000138
name_zh: P2PInfect 读取 TracerPid 后条件退出
name_en: P2PInfect Conditional Exit After Reading TracerPid
actor_or_campaign: P2PInfect MIPS malware variant
subject_refs: [NJT-0106, NJS-0106-001]
description_zh: Cado Security Labs 分析的 P2PInfect MIPS 样本在启动后读取 /proc/self/status 中的 TracerPid 字段。当 strace 追踪存在时，样本以特定非零代码退出，把调试观察状态与后续执行收敛直接连接；该案例支持状态门控子技术，不支持调试输出洪泛。
description_en: The P2PInfect MIPS sample analyzed by Cado Security Labs read TracerPid from /proc/self/status shortly after
  launch. Under strace, it exited with a distinct nonzero code, directly connecting debugger-observation state to contraction
  of successor execution. The case supports the state-gating child and does not support debug-output flooding.
time_range: null
target_sectors_zh: [路由器, 物联网设备, Linux 主机]
target_sectors_en: [Routers, Internet of Things devices, Linux hosts]
evidence_refs: [REF-000415]
confidence: high
status: review
