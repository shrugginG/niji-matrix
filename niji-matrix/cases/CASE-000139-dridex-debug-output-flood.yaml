type: case
id: CASE-000139
name_zh: Dridex 的 OutputDebugStringW 日志洪泛
name_en: Dridex OutputDebugStringW Log Flooding
actor_or_campaign: Dridex loader campaign analyzed by Check Point Research
subject_refs: [NJT-0106, NJS-0106-002]
description_zh: Check Point Research 观察到 Dridex loader 在约两亿次循环中调用 OutputDebugStringW，将大量无意义消息写入调试日志以增加分析难度。该行为不依赖调试状态判断后退出，而是直接消耗调试通道的事件和分析预算，支持独立的观察通道干扰变量。
description_en: Check Point Research observed a Dridex loader call OutputDebugStringW in roughly 200 million loop iterations,
  writing large volumes of meaningless messages into the debug log to increase analysis difficulty. The behavior does not
  depend on exiting after a debugger-state decision; it directly consumes debug-channel event and analyst budgets, supporting
  an independent observation-channel interference variable.
time_range: '2021'
