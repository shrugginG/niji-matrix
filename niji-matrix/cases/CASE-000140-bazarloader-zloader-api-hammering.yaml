id: CASE-000140
name_zh: BazarLoader 与 Zloader 的 API Hammering 耗时伪装
name_en: Work-Consuming API Hammering in BazarLoader and Zloader
actor_or_campaign: BazarLoader and Zloader samples analyzed by Unit 42
subject_refs: [NJT-0107, NJS-0107-002]
description_zh: Unit 42 观察到 BazarLoader 使用随机次数循环访问注册表键，Zloader 则生成超过一百万次文件 I/O API 调用。两者都用低价值工作消耗沙箱时间，把载荷解包或注入推迟到分析窗口之后，而窗口内只呈现与合法软件共享外观的注册表或文件操作。
description_en: Unit 42 observed BazarLoader loop over random Registry-key accesses and Zloader generate more than one million
  file-I/O API calls. Both consumed sandbox time with low-value work, pushing payload unpacking or injection beyond the analysis
  window while showing only Registry or file operations that share appearance with legitimate software inside the window.
