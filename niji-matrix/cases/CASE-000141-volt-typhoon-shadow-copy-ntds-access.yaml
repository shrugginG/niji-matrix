id: CASE-000141
name_zh: Volt Typhoon 通过卷影副本访问 NTDS.dit
name_en: Volt Typhoon NTDS.dit Access Through a Volume Shadow Copy
actor_or_campaign: Volt Typhoon
subject_refs:
- NJT-0108
- NJT-0137
- NJS-0137-003
- NJT-0177
- NJS-0177-002
description_zh: CISA、NSA、FBI 及合作机构观察到 Volt Typhoon 以域管理员账户进入域控制器，运行 vssadmin 创建卷影副本，再通过 WMIC 执行 ntdsutil，从副本复制运行中通常被锁定的 NTDS.dit
  与 SYSTEM 配置单元，随后外传并离线破解。该事件把副本视图、敏感对象与后继凭据用途直接连接；它支持父技术，但不证明所有卷影副本活动均属原始视图绕过。
description_en: CISA, NSA, FBI, and partner agencies observed Volt Typhoon access a domain controller with a domain-administrator
  account, create a volume shadow copy with vssadmin, invoke ntdsutil through WMIC to copy the normally locked NTDS.dit and
  SYSTEM hive from the copy, and then exfiltrate them for offline cracking. The event directly connects a copy view, sensitive
  objects, and successor credential use. It supports the parent technique but does not imply that every shadow-copy operation
  is a raw-view bypass.
time_range: Before and through February 2024 reporting
target_sectors_zh:
- 美国关键基础设施域环境
target_sectors_en:
- Domain environments in U.S. critical infrastructure
