schema_version: 1.0.0
type: case
id: CASE-000142
name_zh: EnvyScout 的 C 盘执行门控
name_en: EnvyScout C-Drive Execution Guardrail
actor_or_campaign: NOBELIUM
subject_refs: [NJT-0109, NJS-0109-001]
description_zh: >-
  Microsoft 在野外样本中观察到 EnvyScout 读取 window.location.pathname，并仅在返回字符的前两位为 C: 时写出内嵌 ISO；条件不满足时不产生该后继载荷。相邻变体还按用户代理只向 Windows 客户端投递 ISO。该案例直接证明可读属性、明文匹配与后继投递差异的门控链，不支持环境派生密码激活。
description_en: >-
  Microsoft observed in-the-wild EnvyScout samples read window.location.pathname and write the embedded ISO only when the first
  two returned characters were C:. When the condition failed, the successor payload was not produced. An adjacent variant
  used user agent to deliver the ISO only to Windows clients. The case directly establishes readable attributes, plaintext
  matching, and differential delivery and does not support environment-derived cryptographic activation.
time_range: '2021'
target_sectors_zh: [外交与政府实体]
target_sectors_en: [Diplomatic and government entities]
evidence_refs: [REF-000420]
confidence: high
status: review
