schema_version: 1.0.0
type: case
id: CASE-000143
name_zh: Gauss 环境派生 RC4 载荷激活
name_en: Gauss Environment-Derived RC4 Payload Activation
actor_or_campaign: Gauss malware operation
subject_refs: [NJT-0109, NJS-0109-002]
description_zh: Kaspersky 在 Gauss 特殊版本中发现 .exsdat、.exrdat 与 .exdat 加密区段。其 RC4 密钥由 %PATH% 与 %PROGRAMFILES% 下目录名组合后进行一万次 MD5 派生；在未知预期环境组合时，研究者无法恢复区段内容。该案例把环境读取、规范化与高成本密钥派生连接到核心内容是否可解密，直接支持密码激活子技术。
description_en: Kaspersky found encrypted .exsdat, .exrdat, and .exdat sections in special Gauss versions. Their RC4 key was
  derived by applying MD5 ten thousand times to a combination of %PATH% and a directory name under %PROGRAMFILES%. Without
  the expected environmental combination, researchers could not recover the section contents. The case connects environment
  reads, normalization, and costly key derivation to whether core content can be decrypted, directly supporting the cryptographic-activation
  child.
time_range: '2011-2012'
target_sectors_zh: [中东地区受感染 Windows 环境]
target_sectors_en: [Compromised Windows environments in the Middle East]
evidence_refs: [REF-000421]
confidence: high
status: review
