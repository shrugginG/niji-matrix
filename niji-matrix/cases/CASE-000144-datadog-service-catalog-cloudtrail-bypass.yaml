schema_version: 1.0.0
type: case
id: CASE-000144
name_zh: AWS Service Catalog Gamma 端点 CloudTrail 绕过
name_en: AWS Service Catalog Gamma-Endpoint CloudTrail Bypass
actor_or_campaign: Datadog Security Labs coordinated disclosure research
subject_refs: [NJT-0110, NJS-0110-001]
description_zh: Datadog 使用有效 IAM 凭据与足够权限向 Service Catalog gamma 端点发起读写操作，观察到资源确实被读取或修改，但对应请求不进入 CloudTrail；AWS 确认并修复。该研究案例直接连接缺陷端点、有效动作、规范审计缺口和修复后对照，但不是在野攻击案例。
description_en: Datadog used valid IAM credentials with sufficient authority to perform read and write actions through a Service
  Catalog gamma endpoint, observed resources actually read or changed, and found no corresponding CloudTrail request. AWS
  confirmed and fixed the issue. The research case directly joins a flawed endpoint, valid action, canonical audit gap, and
  post-fix control, but it is not an in-the-wild adversary case.
time_range: '2023'
target_sectors_zh: [AWS Service Catalog 与 CloudTrail 使用环境]
target_sectors_en: [Environments using AWS Service Catalog and CloudTrail]
evidence_refs: [REF-000422]
confidence: high
status: review
