schema_version: 1.0.0
type: case
id: CASE-000145
name_zh: Velvet Ant NX-OS 上下文逃逸与载荷清理
name_en: Velvet Ant NX-OS Context Escape and Payload Cleanup
actor_or_campaign: Velvet Ant
subject_refs: [NJT-0110, NJS-0110-002, NJT-0112, NJS-0112-001]
description_zh: Sygnia 观察 Velvet Ant 使用有效管理员凭据向 Cisco NX-OS CLI 提交利用 CVE-2024-20399 的编码命令，逃逸到通常不可由客户进入的底层 Linux，部署 VELVETSHELL，并把合法 curl 复制为 ufdm、用 LD_PRELOAD 加载 ufdm.so。确认运行后，攻击者删除 ufdm 与 ufdm.so。该案例分别证明受信管理接口后的未监控执行上下文，以及对已使用载荷对象的选择性擦除。
description_en: Sygnia observed Velvet Ant use valid administrator credentials to submit encoded CVE-2024-20399 exploit commands
  through the Cisco NX-OS CLI, escape into the underlying Linux layer normally inaccessible to customers, deploy VELVETSHELL,
  copy legitimate curl as ufdm, and load ufdm.so through LD_PRELOAD. After confirming execution, the actor deleted ufdm and
  ufdm.so. The case separately establishes an unmonitored execution context behind a trusted management interface and selective
  erasure of already used payload objects.
time_range: '2024'
target_sectors_zh: [采用 Cisco Nexus 交换机的企业网络]
target_sectors_en: [Enterprise networks using Cisco Nexus switches]
evidence_refs: [REF-000423]
confidence: high
status: review
