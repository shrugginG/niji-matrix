schema_version: 1.0.0
type: case
id: CASE-000146
name_zh: MINEBRIDGE 活动中的 VBA Stomping 文档
name_en: VBA-Stomped Document in MINEBRIDGE Campaigns
actor_or_campaign: MINEBRIDGE targeted phishing campaigns
subject_refs: [NJT-0111, NJS-0111-003]
description_zh: Mandiant 在 2020 年定向钓鱼活动中分析到恶意文档以良性或空白 VBA 源码替代实际恶意 p-code，并修改 PROJECT stream 使宏无法从 Office GUI 正常查看。兼容 Office 版本仍执行 p-code、下载并启动 MINEBRIDGE；p-code 反编译、PROJECT stream 异常和网络/主机字符串保留了恢复线索。
description_en: Mandiant analyzed malicious documents in 2020 targeted phishing campaigns that substituted benign or blank
  VBA source for malicious p-code and modified the PROJECT stream so the macro could not be viewed normally in the Office
  GUI. A compatible Office version still executed the p-code and downloaded and launched MINEBRIDGE, while p-code decompilation,
  PROJECT-stream anomalies, and network and host strings remained as recovery evidence.
time_range: '2020-01'
target_sectors_zh: [美国金融服务机构及其他定向组织]
target_sectors_en: [U.S. financial services and other targeted organizations]
evidence_refs: [REF-000424]
confidence: high
status: review
