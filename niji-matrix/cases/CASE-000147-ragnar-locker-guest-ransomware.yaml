schema_version: 1.0.0
type: case
id: CASE-000147
name_zh: Ragnar Locker 来宾虚拟机勒索执行
name_en: Ragnar Locker Ransomware Execution Inside a Guest VM
actor_or_campaign: Ragnar Locker
subject_refs: [NJT-0111, NJS-0111-004]
description_zh: Sophos 观察攻击者通过 GPO 和 MSI 在目标宿主安装旧版 VirtualBox 与含 Ragnar Locker 的 Windows XP 虚拟磁盘，把本地、移动和网络驱动器映射到来宾并以 headless 模式启动。勒索进程 vrun.exe 在来宾内执行，超出宿主端点保护可见范围；宿主侧只把加密访问归给合法 VboxHeadless.exe，但 MSI、VDI、驱动、实例生命周期和共享目录映射仍留痕。
description_en: Sophos observed attackers use GPO and MSI to install an old VirtualBox build and a Windows XP virtual disk
  containing Ragnar Locker, map local, removable, and network drives into the guest, and start it headlessly. Ransomware process
  vrun.exe executed inside the guest beyond host endpoint visibility, while the host attributed encryption access to legitimate
  VboxHeadless.exe. The MSI, VDI, driver, instance lifecycle, and shared-folder mapping remained observable.
time_range: '2020'
target_sectors_zh: [遭受定向 Ragnar Locker 勒索的 Windows 企业环境]
target_sectors_en: [Windows enterprise environments targeted by Ragnar Locker]
evidence_refs: [REF-000425]
confidence: high
status: review
