name_zh: BRONZE UNION 外传后的归档删除与共享拆除
name_en: BRONZE UNION Archive Deletion and Share Teardown After Exfiltration
actor_or_campaign: BRONZE UNION
subject_refs:
- NJT-0112
- NJS-0112-001
- NJS-0112-002
- NJT-0134
description_zh: SecureWorks CTU 观察 BRONZE UNION 把加密 RAR 归档改名并通过网络共享复制到互联网可达的暂存服务器。外传完成后，攻击者用 web shell 删除暂存归档并断开相关网络共享，研究者评估其目的很可能是规避检测。该案例同时支持证据对象擦除与操作关系拆除，但不支持时间元数据伪造。
description_en: SecureWorks CTU observed BRONZE UNION rename encrypted RAR archives and copy them over network shares to an
  internet-facing staging server. After exfiltration, the actor used a web shell to delete the staged archives and detach
  the related shares, likely to avoid detection. The case supports both evidence-object erasure and operational-relationship
  teardown but not temporal-metadata falsification.
time_range: 2016-2017 reporting
