schema_version: 1.0.0
type: case
id: CASE-000149
name_zh: BlackByte 2.0 统一回写加密工件时间
name_en: BlackByte 2.0 Timestamp Falsification of Encrypted Artifacts
actor_or_campaign: BlackByte 2.0 ransomware intrusion
subject_refs: [NJT-0112, NJS-0112-003]
description_zh: Microsoft IR 在五日入侵调查中逆向 BlackByte 2.0，确认其把被加密文件和勒索说明的文件时间设置为 2000-01-01 00:00:00，并同时具备自删除模式。统一异常时间并非真实创建或修改顺序，直接破坏时间线解释；文件系统底层元数据、写入进程与加密阶段仍可作为反证。
description_en: Microsoft IR reverse engineered BlackByte 2.0 during a five-day intrusion and confirmed that it set file times
  on encrypted files and ransom notes to 2000-01-01 00:00:00 while also supporting a self-deletion mode. The uniform anomalous
  time does not represent the true creation or modification order and directly corrupts timeline interpretation, while underlying
  file-system metadata, writer process, and encryption stage remain counterevidence.
time_range: '2023 reporting'
target_sectors_zh: [遭受 BlackByte 2.0 勒索的企业环境]
target_sectors_en: [Enterprise environments affected by BlackByte 2.0]
evidence_refs: [REF-000152]
confidence: high
status: review
