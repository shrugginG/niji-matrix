schema_version: 1.0.0
type: case
id: CASE-000150
name_zh: BISTROMATH 可配置载荷位置迁移
name_en: BISTROMATH Configurable Payload-Location Migration
actor_or_campaign: BISTROMATH malware
subject_refs: [NJT-0112, NJS-0112-004]
description_zh: CISA 对 BISTROMATH 配置结构的分析显示样本可把自身迁移到 Windows、System、Program Files、ProgramData、用户目录、文档、临时目录或自定义子目录。迁移保留恶意内容身份但改变路径与后继消费位置，可切断最初投递路径和当前执行路径之间的直观联系；来源证明能力和目标选择，不证明每个样本都启用迁移。
description_en: CISA analysis of the BISTROMATH configuration structure shows that a sample can relocate itself into Windows,
  System, Program Files, ProgramData, user, Documents, temporary, or custom subdirectories. Relocation preserves malicious
  content identity while changing path and successor-consumption location, breaking the obvious link between initial delivery
  and current execution. The source proves the capability and destination selection, not that every sample enabled relocation.
time_range: '2020 reporting'
target_sectors_zh: [受 BISTROMATH 影响的 Windows 环境]
target_sectors_en: [Windows environments affected by BISTROMATH]
evidence_refs: [REF-000427]
confidence: medium
status: review
