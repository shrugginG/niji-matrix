schema_version: 1.0.0
type: case
id: CASE-000151
name_zh: RedCurl 通过 pcalua.exe 代理恶意执行
name_en: RedCurl Malicious Execution Proxied Through pcalua.exe
actor_or_campaign: RedCurl-associated intrusions
subject_refs: [NJT-0113, NJS-0113-001]
description_zh: Huntress 在三个加拿大组织的入侵中发现计划任务以完整参数调用受信 pcalua.exe，后者启动恶意二进制、批处理和 RPivot Python 脚本，进一步建立代理 C2。该链直接连接任务请求、一次性实用程序输入、pcalua.exe 代理和子进程/网络结果；计划任务属于触发来源，不把本案例升级为持久配置代理。
description_en: Huntress found in intrusions at three Canadian organizations that scheduled tasks invoked trusted pcalua.exe
  with complete arguments, after which it started malicious binaries, batch files, and an RPivot Python script that established
  proxy command and control. The chain directly joins task request, one-shot utility input, pcalua.exe proxying, and child-process
  or network outcome. The scheduled task is the trigger source and does not turn the case into durable utility-configuration
  proxying.
time_range: '2023-2024'
target_sectors_zh: [加拿大多行业组织]
target_sectors_en: [Organizations across multiple sectors in Canada]
evidence_refs: [REF-000428]
confidence: high
status: review
