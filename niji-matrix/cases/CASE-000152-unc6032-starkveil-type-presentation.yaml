schema_version: 1.0.0
type: case
id: CASE-000152
name_zh: UNC6032 将 STARKVEIL 伪装为 MP4 文件
name_en: UNC6032 STARKVEIL Presented as an MP4 File
actor_or_campaign: UNC6032 fake AI-themed website campaign
subject_refs: [NJT-0114, NJS-0114-002]
description_zh: GTIG 调查 UNC6032 假冒 AI 视频生成网站时发现，下载 ZIP 中的 STARKVEIL 可执行文件使用 .mp4 与 .exe 双扩展名，在二者之间插入十三至三十多个 Braille Pattern Blank 字符，把真实扩展名推出用户视野，并配置 MP4 图标。用户看到视频外观，原始 PE 头与实际执行则证明其二进制身份和后继恶意行为。
description_en: During investigation of UNC6032 fake AI video-generator sites, GTIG found the STARKVEIL executable inside a
  downloaded ZIP used .mp4 and .exe double extensions separated by thirteen to more than thirty Braille Pattern Blank characters,
  pushing the real extension out of user view, and used an MP4 icon. The user saw a video appearance, while the raw PE header
  and execution established its binary identity and malicious successor behavior.
time_range: '2024-11 through 2025 reporting'
target_sectors_zh: [受假冒 AI 工具广告影响的企业与个人]
target_sectors_en: [Enterprises and individuals reached by fake AI-tool advertising]
evidence_refs: [REF-000430]
confidence: high
status: review
