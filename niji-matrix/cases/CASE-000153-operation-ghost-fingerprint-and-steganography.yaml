schema_version: 1.0.0
type: case
id: CASE-000153
name_zh: Operation Ghost 的浏览器指纹仿真与图像载荷遮蔽
name_en: Browser-Fingerprint Emulation and Image Payload Concealment in Operation Ghost
actor_or_campaign: APT29 / Operation Ghost
subject_refs: [NJT-0114, NJS-0114-004, NJT-0115, NJS-0115-003]
description_zh: ESET 分析 FatDuke 首先让默认浏览器连接本地 socket 并解析其 User-Agent，失败时从注册表识别默认浏览器并选择对应硬编码字符串，再用该身份与 C2 通信。Operation Ghost 同时使用图像隐写隐藏载荷或命令，接收方从图像数据提取并解密真实内容。前者证明客户端可见指纹与真实进程身份分离，后者证明良性图像载体与内嵌恶意语义分离。
description_en: ESET analyzed FatDuke first causing the default browser to connect to a local socket and parsing its User-Agent,
  or identifying the default browser from Registry state and choosing a matching hard-coded string before C2 communication.
  Operation Ghost also used image steganography to hide payloads or commands that the recipient extracted and decrypted from
  image data. The former establishes separation between visible client fingerprint and real process identity, while the latter
  establishes separation between benign image carrier and embedded malicious semantics.
time_range: '2013-2019'
target_sectors_zh: [欧洲外交部门与欧盟驻华盛顿机构]
target_sectors_en: [European foreign ministries and an EU diplomatic mission in Washington]
evidence_refs: [REF-000431]
confidence: high
status: review
