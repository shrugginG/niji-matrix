schema_version: 1.0.0
type: case
id: CASE-000154
name_zh: POISONPLUG.SHADOW 的 ScatterBrain 特征空间畸变
name_en: ScatterBrain Feature-Space Distortion of POISONPLUG.SHADOW
actor_or_campaign: APT41-associated POISONPLUG.SHADOW operations
subject_refs: [NJT-0115, NJS-0115-002]
description_zh: GTIG 自 2022 年跟踪使用 POISONPLUG.SHADOW 的多项中国关联网络间谍活动，并对样本中的 ScatterBrain 混淆编译器进行完整逆向。该编译器按模式重构控制流图、变异等价指令并保护导入表，使静态框架难以恢复调用与控制结构；Mandiant 的独立去混淆器能产出功能等价二进制，证明改变的是特征空间而非核心语义。
description_en: Since 2022 GTIG has tracked multiple China-nexus cyberespionage operations using POISONPLUG.SHADOW and fully
  reverse engineered the ScatterBrain obfuscating compiler in recovered samples. The compiler restructures control-flow graphs,
  mutates equivalent instructions, and protects imports by mode, frustrating static recovery of calls and control structure.
  Mandiant's independent deobfuscator produces functionally equivalent binaries, establishing that feature space rather than
  core semantics was changed.
time_range: '2022-2025'
target_sectors_zh: [欧洲与亚太地区网络间谍目标]
target_sectors_en: [Cyberespionage targets in Europe and Asia-Pacific]
evidence_refs: [REF-000432]
confidence: high
status: review
