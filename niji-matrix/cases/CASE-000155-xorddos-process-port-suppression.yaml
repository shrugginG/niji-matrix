schema_version: 1.0.0
type: case
id: CASE-000155
name_zh: XorDdos 根套件抑制进程与端口枚举结果
name_en: XorDdos Rootkit Suppression of Process and Port Enumeration
actor_or_campaign: XorDdos Linux botnet activity
subject_refs: [NJT-0116, NJS-0116-001]
description_zh: Microsoft 对 XorDdos 的分析确认，用户态恶意程序通过 /proc/rs_dev 与内核根套件通信，使用 IOCTL 命令把 PID 和端口加入隐藏集合。根套件替换系统调用表处理函数以及 TCP/UDP 序列显示函数，从 /proc 与 /proc/net 的返回内容中移除目标进程和端口；进程和 socket 继续活动，但 ps、netstat 等依赖共享查询路径的工具看不到对应条目。
description_en: Microsoft's XorDdos analysis established the user-mode malware communicating with its kernel rootkit through /proc/rs_dev and using IOCTL commands to add PIDs and ports to hidden sets. The rootkit replaced system-call handlers and TCP or UDP sequence-display functions to remove target processes and ports from /proc and /proc/net results. Processes and sockets remained active while tools such as ps and netstat that depended on the shared query path did not receive the entries.
time_range: XorDdos activity analyzed in 2022
target_sectors_zh: [暴露于互联网的 Linux 服务器、云工作负载与物联网设备]
target_sectors_en: [Internet-exposed Linux servers, cloud workloads, and IoT devices]
evidence_refs: [REF-000433]
confidence: high
status: review
