schema_version: 1.0.0
type: case
id: CASE-000156
name_zh: AVADDON 保留主机关键目录与可恢复文件类型
name_en: AVADDON Preservation of Critical Host Directories and Recoverable File Types
actor_or_campaign: AVADDON ransomware service and affiliates
subject_refs: [NJT-0117, NJS-0117-001]
description_zh: Mandiant 逆向多个 AVADDON 版本，确认勒索软件在同一主机内跳过 Windows、Program Files、ProgramData、Exchange 与 SQL Server 等目录，并排除 DLL、EXE、SYS、INI 和其他扩展名。报告说明这些选择让系统在加密后仍可恢复和运行解密器，同时其他文件继续被加密，形成主机内处理集合与关键保留集合的直接差分。
description_en: Mandiant reverse engineered multiple AVADDON versions and established the ransomware skipping directories including Windows, Program Files, ProgramData, Exchange, and SQL Server on the same host while excluding DLL, EXE, SYS, INI, and other extensions. The report explains that these choices allow the system to recover and run the decryptor after encryption while other files continue to be encrypted, directly establishing a differential between processed and critical preserved sets within one host.
time_range: AVADDON operations from 2020 through 2021; analysis published 2022-01-18
target_sectors_zh: [北美教育、技术、医疗、金融与政府组织]
target_sectors_en: [North American education, technology, healthcare, financial, and government organizations]
evidence_refs: [REF-000434]
confidence: high
status: review
