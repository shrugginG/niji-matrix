schema_version: 1.0.0
type: case
id: CASE-000157
name_zh: LazyWiper 对域控制器的角色条件保留
name_en: LazyWiper Role-Conditioned Preservation of Domain Controllers
actor_or_campaign: December 2025 destructive attacks against Poland's energy and manufacturing sectors
subject_refs: [NJT-0117, NJS-0117-002]
description_zh: CERT Polska 在制造业事件中确认 LazyWiper 包含 safeguard：脚本若判断当前主机为域控制器就终止执行，而攻击者同时从域控制器通过 GPO 向其他域主机分发 wiper。该谓词保留承担身份与集中分发角色的整台主机，而其他主机进入破坏流程，形成以主机角色为键的跨资产覆盖差分。
description_en: CERT Polska established in the manufacturing incident that LazyWiper contains a safeguard terminating the script when the current host is a domain controller, while the attacker simultaneously distributed the wiper from a domain controller to other domain hosts through GPO. The predicate preserves the whole host carrying identity and centralized-distribution roles while other hosts enter the destructive workflow, creating a cross-asset coverage differential keyed by host role.
time_range: '2025-12-29'
target_sectors_zh: [波兰制造业与能源行业组织]
target_sectors_en: [Polish manufacturing and energy-sector organizations]
evidence_refs: [REF-000435]
confidence: high
status: review
