schema_version: 1.0.0
type: case
id: CASE-000158
name_zh: Midnight Blizzard 在 Teams 中冒充技术支持诱导 MFA 动作
name_en: Midnight Blizzard Technical-Support Impersonation Driving an MFA Action in Teams
actor_or_campaign: Midnight Blizzard targeted Microsoft Teams social-engineering campaign
subject_refs: [NJT-0118, NJS-0118-001]
description_zh: Microsoft 记录 Midnight Blizzard 使用先前失陷的小企业 Microsoft 365 租户创建安全主题域与账户，通过外部 Teams 消息冒充技术支持或安全团队，并诱使目标把攻击者认证流显示的代码输入 Microsoft Authenticator。用户执行该动作后，攻击者获得目标身份令牌、访问 Microsoft 365，并在部分事件中尝试注册受管设备。
description_en: Microsoft documented Midnight Blizzard using previously compromised small-business Microsoft 365 tenants to create security-themed domains and accounts, impersonating technical-support or security teams through external Teams messages, and inducing targets to enter the attacker's authentication-flow code into Microsoft Authenticator. After the user performed the action, the actor obtained a token for the target identity, accessed Microsoft 365, and in some events attempted to register a managed device.
time_range: Campaign observed since at least late May 2023
target_sectors_zh: [政府、非政府组织、IT 服务、技术、离散制造与媒体]
target_sectors_en: [Government, NGOs, IT services, technology, discrete manufacturing, and media]
evidence_refs: [REF-000436]
confidence: high
status: review
