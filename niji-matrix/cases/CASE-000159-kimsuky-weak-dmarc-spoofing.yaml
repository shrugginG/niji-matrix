schema_version: 1.0.0
type: case
id: CASE-000159
name_zh: Kimsuky 利用弱 DMARC 伪造专家邮件来源
name_en: Kimsuky Exploitation of Weak DMARC to Spoof Expert Email Provenance
actor_or_campaign: Kimsuky DPRK spearphishing campaigns
subject_refs: [NJT-0118, NJS-0118-002]
description_zh: FBI、美国国务院与 NSA 的联合公告确认 Kimsuky 利用错误配置或弱执行的 DMARC 策略，使恶意邮件看似由合法域邮件交换发出，并冒充与朝鲜政策圈有关的记者、学者或专家。伪造的邮件传输与显示来源用于掩盖社会工程请求，后续目标是取得受害者私有文档、研究与通信。
description_en: A joint FBI, U.S. Department of State, and NSA advisory established Kimsuky exploiting misconfigured or weakly enforced DMARC policy so malicious mail appeared to come from a legitimate domain's mail exchange while posing as journalists, academics, or experts linked to North Korea policy circles. Forged email transport and displayed provenance concealed the social-engineering request, whose successor objective was access to private documents, research, and communications.
time_range: Sustained campaigns described in advisory published 2024-05-02
target_sectors_zh: [政策分析人员、智库、学术界与媒体]
target_sectors_en: [Policy analysts, think tanks, academia, and media]
evidence_refs: [REF-000437]
confidence: high
status: review
