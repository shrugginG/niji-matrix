schema_version: 1.0.0
type: case
id: CASE-000160
name_zh: ACTINIUM 打开时取得远程恶意模板
name_en: ACTINIUM Retrieval of a Malicious Remote Template at Open Time
actor_or_campaign: ACTINIUM / Aqua Blizzard operations against Ukrainian organizations
subject_refs: [NJT-0119, NJS-0119-001]
description_zh: Microsoft 记录 ACTINIUM 在鱼叉式钓鱼附件中写入攻击者控制的远程模板 URL，原始诱饵文档保持合法正文且不含最终恶意宏；用户打开文档时 Office 才取得模板并启动多阶段脚本与载荷。攻击者还可按请求时机决定是否提供模板，使自动化附件扫描无法取得与真实目标相同的内容。
description_en: Microsoft documented ACTINIUM placing an adversary-controlled remote-template URL in spearphishing attachments while the original lure document retained legitimate body content and omitted the final malicious macro. Office retrieved the template only when the user opened the document and then launched multistage scripts and payloads. The actor could also decide whether to supply the template according to request timing, preventing automated attachment scanning from obtaining the same content as the real target.
time_range: Activity observed in the six months before publication on 2022-02-04
target_sectors_zh: [乌克兰政府、军事、非政府组织、司法、执法与非营利组织]
target_sectors_en: [Ukrainian government, military, NGOs, judiciary, law enforcement, and nonprofit organizations]
evidence_refs: [REF-000438]
confidence: high
status: review
