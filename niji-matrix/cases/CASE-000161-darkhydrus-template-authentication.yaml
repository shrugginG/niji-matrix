schema_version: 1.0.0
type: case
id: CASE-000161
name_zh: DarkHydrus 远程模板诱发认证并收集凭据
name_en: DarkHydrus Remote Template Inducing Authentication and Credential Collection
actor_or_campaign: DarkHydrus credential-harvesting campaign
subject_refs:
- NJT-0119
- NJS-0119-002
- NJS-0165-001
description_zh: Unit 42 在 2018 年 6 月确认 DarkHydrus 向中东教育机构投递带 attachedTemplate 的 Word 文档。文档解析 0utl00k[.]net 上的远程模板时弹出认证对话框，用户输入的凭据通过模板 URL 发往 C2；研究人员用
  Phishery 复现实验并在服务端收到测试凭据，证明引用解析、认证与披露结果链。
description_en: Unit 42 established DarkHydrus delivering a Word document with attachedTemplate to a Middle Eastern educational institution in
  June 2018. Resolving the remote template at 0utl00k[.]net displayed an authentication dialog and sent entered credentials to C2 through the
  template URL. Researchers reproduced the behavior with Phishery and received test credentials server-side, proving the chain from reference
  resolution through authentication to disclosure.
time_range: 2018-06-24 with related attempts dating to 2017
target_sectors_zh:
- 中东政府实体与教育机构
target_sectors_en:
- Middle Eastern government entities and educational institutions
