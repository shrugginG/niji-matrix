id: CASE-000162
name_zh: SYNful Knock 特殊 TCP 字段激活路由器植入
name_en: SYNful Knock Activation of a Router Implant through Special TCP Fields
actor_or_campaign: SYNful Knock Cisco IOS implant activity
subject_refs: [NJT-0120, NJS-0120-002]
description_zh: Mandiant 在乌克兰、菲律宾、墨西哥和印度确认至少十四个 SYNful Knock 路由器植入。基础植入位于改写 Cisco IOS 映像并跨重启存续，但后来加载的附加模块易失；基础 matcher 监视发往 80 端口的特制 TCP SYN，验证 sequence 与 acknowledgment 的固定差值和非标准选项，再接收后续命令包。普通扫描和标准认证不暴露模块化 C2，而特殊字段与响应序列可生成网络签名。该边界证明持久的是基础 matcher 与入口，不是每个运行时模块。
description_en: Mandiant confirmed at least fourteen SYNful Knock router implants in Ukraine the Philippines Mexico and India. The base implant resided in a modified Cisco IOS image and survived reboot while later-loaded modules were volatile. The base matcher watched for a crafted TCP SYN to port 80 validated a fixed sequence-to-acknowledgment difference and nonstandard options and then accepted a successor command packet. Ordinary scanning and standard authentication did not expose modular C2 while special fields and response sequence enabled network signatures. The boundary establishes persistence of the base matcher and entry rather than every runtime module.
time_range: Implants confirmed by report published 2015-09-15
target_sectors_zh: [使用 Cisco IOS 路由器的受害网络]
target_sectors_en: [Victim networks using Cisco IOS routers]
