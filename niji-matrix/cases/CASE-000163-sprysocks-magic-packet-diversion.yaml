type: case
id: CASE-000163
name_zh: SprySOCKS 魔数数据包重定向至隐藏后门端口
name_en: SprySOCKS Magic-Pattern Packet Diversion to a Hidden Backdoor Port
actor_or_campaign: FishMonger SprySOCKS Windows activity
subject_refs: [NJT-0120, NJS-0120-002]
description_zh: ESET 确认 SprySOCKS WIN_DRV 使用 RawWNPF 内核驱动注册 WFP 过滤器，检查任意开放 TCP 端口收到的数据是否含特制模式，命中后把流量重定向至随机且从标准网络工具隐藏的后门端口。TCP、UDP 与 WebSocket 还使用不同固定魔数，真实监听端口不会在外部流量中直接暴露。
description_en: ESET established SprySOCKS WIN_DRV using the RawWNPF kernel driver to register WFP filters, inspect whether data received on any open TCP port contains a crafted pattern, and divert matching traffic to a random backdoor port hidden from standard network tools. TCP, UDP, and WebSocket also use different fixed magic values, and the real listening port is not directly exposed in external traffic.
time_range: Samples active between 2023 and 2024; analysis published 2026-06-16
target_sectors_zh: [洪都拉斯、台湾、泰国与巴基斯坦的政府组织]
