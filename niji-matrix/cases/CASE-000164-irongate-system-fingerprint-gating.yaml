type: case
id: CASE-000164
name_zh: IRONGATE 通过 VMware 与 Cuckoo 指纹门控 Dropper
name_en: IRONGATE Dropper Gating through VMware and Cuckoo Fingerprints
actor_or_campaign: IRONGATE proof-of-concept or research samples
subject_refs: [NJT-0122, NJS-0122-001]
description_zh: Mandiant 分析 IRONGATE ICS 样本时确认，部分 dropper 在检测到 VMware 或 Cuckoo Sandbox 环境时不运行，使分析环境无法观察后继载荷。来源明确无法把样本关联到行动或威胁行为者，且样本可能为测试、PoC 或研究活动，因此本案例只证明系统指纹门控行为，不证明在野攻击归因。
description_en: Mandiant's IRONGATE ICS analysis established some droppers refusing to run when VMware or Cuckoo Sandbox was detected, preventing the analysis environment from observing successor payloads. The source explicitly cannot associate the samples with a campaign or actor and states they may be tests, proofs of concept, or research activity. This case therefore establishes only system-fingerprint gating behavior and not an in-the-wild attribution.
time_range: Samples uploaded in 2014 and analyzed in 2015–2016
target_sectors_zh: [工业控制系统模拟环境]
target_sectors_en: [Industrial-control-system simulation environments]
