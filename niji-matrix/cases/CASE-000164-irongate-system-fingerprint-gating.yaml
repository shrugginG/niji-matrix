description_en: Mandiant’s IRONGATE analysis records some droppers withholding scada.exe deployment after VMware or Cuckoo
  matches. Release still requires a specific network-resource path and does not automatically execute the relocated file.
  The source considers testing, PoC, or research possible, with unknown infection route and attribution. Uploads in 2014 and
  discovery in 2015 are sample history, not established operation dates.
