description_zh: Unit 42报告Upatre样本将GetTickCount与0xAFE74（720500毫秒）比较，低值时早退；改变返回uptime后继续恶意例程。这证明报告样本的时间证据、比较与后继链，不证明全部变体或通用有效性。DWORD约49.7天回绕，低值也可能来自真实启动或回绕。报告发表于2015-10-06，操作日期与目标行业未知。
description_en: Unit 42 reports an Upatre sample comparing GetTickCount with 0xAFE74 (720500 milliseconds) and exiting at
  low values, then continuing its malicious routine after changed returned uptime. This establishes the reported sample’s
  timing evidence, comparison, and successor chain, not all variants or universal effectiveness. The DWORD wraps after about
  49.7 days, so low values can reflect real boot or wrap. The report was published on 2015-10-06; operation dates and target
  sectors are unknown.
