type: case
id: CASE-000165
name_zh: Upatre 通过系统运行时间识别并退出短生命周期沙箱
name_en: Upatre Detection and Exit from Short-Lived Sandboxes through System Uptime
actor_or_campaign: Upatre malware campaigns
subject_refs: [NJT-0122, NJS-0122-003]
description_zh: Unit 42 观察 Upatre 调用 GetTickCount 并把结果与约十二分钟阈值比较；系统运行时间更短时样本退出且不执行恶意动作，典型数分钟沙箱因而可能判为良性。WildFire 把返回值改为数小时后，样本继续恶意例程，直接证明时间证据、分支与隐藏结果的因果。
description_en: Unit 42 observed Upatre calling GetTickCount and comparing the result with an approximately twelve-minute threshold. The sample exited without malicious action when system uptime was lower, allowing a typical several-minute sandbox to judge it benign. After WildFire changed the returned value to several hours, the sample continued its malicious routine, directly establishing causality among timing evidence, branch, and hidden outcome.
time_range: Surge observed before report published 2015-10-06
target_sectors_zh: [通过钓鱼邮件感染的 Windows 用户]
target_sectors_en: [Windows users infected through phishing mail]
