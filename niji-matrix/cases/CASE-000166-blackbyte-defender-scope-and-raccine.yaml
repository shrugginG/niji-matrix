id: CASE-000166
name_zh: BlackByte 收缩 Defender 范围并移除 Raccine
name_en: BlackByte Defender Scope Contraction and Raccine Removal
actor_or_campaign: BlackByte Ransomware
subject_refs: [NJT-0123, NJS-0123-001, NJS-0123-002]
description_zh: SpiderLabs 对事件响应样本的解混淆与动态分析显示，BlackByte 把 .JS 与 .EXE 扩展名加入 Microsoft Defender 排除列表，停用受控文件夹访问，并终止、卸载 Raccine 及删除其更新任务。前者使 Defender 仍可运行但选定载荷类别不再受检，后者使一个反勒索工具整体不可用；同一样本因此提供两种不同残余痕迹和防守方法的直接对照。来源只证明所分析样本，不证明所有 BlackByte 版本均采用相同组合。
description_en: SpiderLabs de-obfuscation and dynamic analysis of an incident-response sample found BlackByte adding .JS and .EXE extensions to Microsoft Defender exclusions, disabling controlled-folder access, and terminating and uninstalling Raccine while deleting its update task. The former can leave Defender running while selected payload classes are uninspected; the latter removes an anti-ransomware capability altogether. One sample therefore directly contrasts two variables with different residue and defensive methods. The source establishes the analyzed sample, not every BlackByte version.
