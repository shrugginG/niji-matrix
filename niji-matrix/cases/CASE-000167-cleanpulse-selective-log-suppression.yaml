type: case
id: CASE-000167
name_zh: CLEANPULSE 条件化抑制日志事件
name_en: CLEANPULSE Conditional Log-Event Suppression
actor_or_campaign: UNC2630
subject_refs: [NJT-0123, NJS-0123-003]
description_zh: Mandiant 在受侵 Pulse Secure 设备相关调查中识别 CLEANPULSE，并通过逆向工程确认该工具向 dslogserver 进程写入匹配字符串与跳转逻辑，在条件满足时绕过原日志函数调用。选定活动因此可能在事件持久化前不产生记录，而同一报告把 THINBLOOD 的事后日志清除作为另一行为描述。硬编码地址和缺少验证说明其高度依赖特定受害环境，未公开的完整事件基线也限制了缺失范围的量化。
description_en: Mandiant identified CLEANPULSE during investigations of compromised Pulse Secure appliances and reverse engineered it writing match strings and jump logic into the dslogserver process to bypass an original logging-function call when conditions match. Selected activity may therefore produce no record before durable storage, while the same report describes THINBLOOD post-hoc log clearing as a separate behavior. Hard-coded addresses and absent validation make the utility highly victim-specific, and undisclosed complete event baselines limit quantification of the gap.
