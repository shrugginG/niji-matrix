id: CASE-000168
name_zh: PHASEJAM 伪造 Ivanti 升级进度
name_en: PHASEJAM Forged Ivanti Upgrade Progress
actor_or_campaign: UNC5221
subject_refs: [NJT-0123, NJS-0123-004, NJT-0167, NJS-0167-002]
description_zh: Mandiant 分析 PHASEJAM 后发现，其修改 Ivanti Connect Secure 的 DSUpgrade.pm，拦截合法升级并注入 processUpgradeDisplay()，向管理员显示十三步、带延迟与进度点的逼真 HTML 升级过程，但真实升级并未完成，受侵设备继续处于攻击者控制。案例直接证明操作员反馈与实际版本/恢复结果可以被分离；它同时包含升级阻断，但正式子项由错误成功反馈这一稳定观察变量定义。
description_en: Mandiant analysis found PHASEJAM modifying DSUpgrade.pm on Ivanti Connect Secure, intercepting legitimate upgrades, and injecting processUpgradeDisplay() to show administrators a convincing thirteen-step HTML upgrade with delays and progress dots while no real upgrade completes and the compromised appliance remains under adversary control. The case directly establishes separation of operator feedback from actual version and recovery outcome. It also blocks upgrade, but the formal child is defined by the stable observation variable of false success feedback.
time_range: "2024-2025"
