schema_version: "1.0.0"
type: case
id: CASE-000169
name_zh: Dragonfly 入侵脚本关闭主机防火墙
name_en: Dragonfly Intrusion Script Disabled a Host Firewall
actor_or_campaign: Dragonfly
subject_refs: [NJT-0124, NJS-0124-001]
description_zh: CISA 与 FBI 报告中的 enu.cmd 在关键基础设施相关入侵中创建管理员账户、关闭主机防火墙并全局开放远程桌面入口。该记录直接证明攻击者控制广域防火墙姿态并增加可达路径；报告没有逐会话给出规则命中或先前拒绝结果，因此本案例不能独自证明每条后继 RDP 连接都因该变更成功。
description_en: In the CISA and FBI account of critical-infrastructure intrusions, enu.cmd created an administrator account, disabled the host firewall, and globally opened a Remote Desktop entry. The record directly establishes adversary control of broad firewall posture and increased reachability. It does not provide per-session rule hits or prior deny outcomes, so the case alone cannot prove every later RDP connection succeeded because of this change.
time_range: "2016-2018"
target_sectors_zh: [能源, 关键基础设施]
target_sectors_en: [Energy, Critical infrastructure]
evidence_refs: [REF-000452]
confidence: high
status: review
