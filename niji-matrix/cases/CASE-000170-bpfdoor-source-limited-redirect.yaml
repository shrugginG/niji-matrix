description_zh: Sandfly 对 BPFDoor 样本和可复现实验的分析显示，后门在匹配激活包后选择高位监听端口，添加仅匹配攻击者来源的 iptables 接受与 REDIRECT 规则，使访问表面 SSH/HTTPS
  等常用端口的攻击者连接到 shell，而其他来源继续到达原服务。它直接支持精确选择器与可见目的地/真实接收者错位，但实验明文演示不能代表实战加密协议。
description_en: Sandfly sample analysis and reproducible demonstration found BPFDoor selecting a high listening port
  after a matching activation packet and adding attacker-source-specific iptables accept and REDIRECT rules. The adversary
  can reach a shell through an apparent ordinary SSH or HTTPS port while other origins continue reaching the original
  service. This directly supports a scoped selector and mismatch between visible destination and real receiver, but the
  plaintext demonstration does not represent the operational encrypted protocol.
