schema_version: "1.0.0"
type: case
id: CASE-000171
name_zh: UNC3886 以 TABLEFLIP 穿越 FortiManager ACL
name_en: UNC3886 TABLEFLIP Traversal of FortiManager ACLs
actor_or_campaign: UNC3886
subject_refs: [NJT-0120, NJS-0120-002, NJT-0124, NJS-0124-003]
description_zh: Mandiant 在 UNC3886 的 Fortinet 设备入侵中观察到，FortiManager 被 ACL 限制后，攻击者通过已受侵 FortiGate 返回设备并部署 TABLEFLIP。该工具只对匹配特殊包及来源的流量添加 PREROUTING 重定向，将表面进入设备的连接送至 REPTILE 后门，并使攻击者恢复互联网直连。报告直接描述规则与后门结果，但不证明所有设备或流量都被重定向。
description_en: In UNC3886 compromise of Fortinet systems, Mandiant observed the actor return through a compromised FortiGate after ACLs restricted FortiManager access and deploy TABLEFLIP. It added PREROUTING redirection only for matching command packets and source traffic, sending an apparent device connection to the REPTILE backdoor and restoring direct Internet access. The report directly describes rules and backdoor outcome but does not show every device or flow was redirected.
time_range: "2022-2023"
target_sectors_zh: [政府, 电信, 科技]
target_sectors_en: [Government, Telecommunications, Technology]
evidence_refs: [REF-000155]
