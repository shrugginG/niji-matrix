type: case
id: CASE-000172
name_zh: Peach Sandstorm 在受害租户创建并使用新订阅
name_en: Peach Sandstorm Creation and Use of a New Victim-Tenant Subscription
actor_or_campaign: Peach Sandstorm
subject_refs: [NJT-0126, NJS-0126-002]
description_zh: Microsoft 观察到 Peach Sandstorm 在部分入侵中于受害租户创建新 Azure 订阅，并利用这些订阅与攻击者基础设施通信。该活动直接证明攻击者能够在原租户中新建层级节点并迅速承载后续行动；公开报告没有给出原租户日志是否漏收、治理策略是否未注册或同一订阅中的具体检测盲区，因此案例只支持新节点恶意使用，不支持已证实的失明结果。
description_en: Microsoft observed Peach Sandstorm create new Azure subscriptions in victim tenants during some intrusions and use subscriptions to communicate with actor infrastructure. This directly shows the adversary creating a new hierarchy node in the original tenant and quickly using it for follow-on activity. Public reporting does not show whether original-tenant logs missed events, governance policy was unenrolled, or a specific detection was blind in the same subscription, so the case supports malicious new-node use rather than a proven blind outcome.
time_range: "2023"
