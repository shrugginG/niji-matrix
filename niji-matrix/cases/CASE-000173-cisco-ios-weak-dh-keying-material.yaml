schema_version: "1.0.0"
type: case
id: CASE-000173
name_zh: Cisco IOS 恶意映像弱化 DH 派生密钥材料
name_en: Malicious Cisco IOS Images Weakened DH-Derived Keying Material
actor_or_campaign: Unattributed Cisco IOS intrusions
subject_refs: [NJT-0128]
description_zh: Cisco 取证报告在 2011 与 2012 年发现两起针对 IOS 的恶意映像修改，变更 Diffie–Hellman 交换并弱化派生密钥材料。流量在粗略检查时仍像正常加密，但攻击者的解密成本降低。公开报告没有给出所有受害会话实际被解密的记录，也没有将硬件加速关闭与这两起事件一一对应。
description_en: Cisco forensics reported two malicious IOS image modifications found in 2011 and 2012 that changed Diffie–Hellman exchange and weakened derived keying material. Traffic still looked normally encrypted under casual inspection, while the effort needed to decrypt it fell. The public report does not document actual decryption of every victim session or map hardware-acceleration disablement one-to-one to these two incidents.
time_range: "2011–2012"
target_sectors_zh: [未披露]
target_sectors_en: [Not disclosed]
evidence_refs: [REF-000467, REF-000468]
confidence: high
status: review
