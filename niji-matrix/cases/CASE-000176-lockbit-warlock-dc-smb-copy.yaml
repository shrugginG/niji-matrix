schema_version: "1.0.0"
type: case
id: CASE-000176
name_zh: LOCKBIT.WARLOCK 从域控制器经 SMB 复制批处理文件
name_en: LOCKBIT.WARLOCK Copies a Batch File from a Domain Controller over SMB
actor_or_campaign: LOCKBIT.WARLOCK ransomware intrusion
subject_refs: [NJT-0130]
description_zh: GTIG 报告一例 LOCKBIT.WARLOCK 事件：攻击者在域控制器暂存 NetExec 和勒索运行文件，再用 NetExec 经 SMB 向多台主机复制批处理文件并运行它。复制行为直接支持域控制器作为分发源和多目标到达；报告未证明该文件先由更早立足点传到域控制器，也未把分发源选择解释为匿迹设计。
description_en: GTIG reports a LOCKBIT.WARLOCK intrusion in which the actor staged NetExec and ransomware-run files on a domain controller, then used NetExec to copy a batch file over SMB to numerous hosts and run it. The copy directly supports a domain-controller distribution source and multi-target arrival. The report does not prove an earlier transfer of that file into the controller or describe the source choice as a concealment design.
time_range: "2025"
