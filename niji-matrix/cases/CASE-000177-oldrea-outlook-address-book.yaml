schema_version: 1.0.0
type: case
id: CASE-000177
name_zh: Oldrea 取用 Outlook 地址簿
name_en: Oldrea Outlook Address-Book Collection
actor_or_campaign: Dragonfly / Oldrea
subject_refs:
- NJT-0131
- NJS-0131-001
description_zh: Broadcom/Symantec 记录 Dragonfly 的 Oldrea 后门从已感染计算机的 Outlook 地址簿提取数据，与系统资料一起写入临时加密文件并发往远端。来源未证明它读取特定 OAB 文件、刻意避开目录查询或成功避开防守检测。
description_en: Broadcom/Symantec reports that Dragonfly's Oldrea backdoor extracted Outlook address-book data from infected
  computers, wrote it with other system data to a temporary encrypted file, and sent it remotely. The source does not establish
  a particular OAB-file read, deliberate avoidance of directory queries, or successful evasion of detection.
time_range: 2013–2014
