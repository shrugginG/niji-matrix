description_zh: ESET 分析发现 Grandoreiro 周期监测浏览器前台窗口，只有窗口名称匹配内置银行相关字符串时才开始与 C2 通信，之后至少每秒请求一次。该事实证明后继网络活动由窗口条件控制，但并未量化检测概率或指定具体窗口
  API。
description_en: ESET found that Grandoreiro periodically monitored the foreground browser window and initiated C2 communication
  only when its name matched a built-in bank-related string, thereafter requesting at least once per second. This establishes
  window-conditioned network activity without quantifying detection probability or identifying the exact window API.
