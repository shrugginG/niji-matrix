description_zh: Microsoft 调查记录 Midnight Blizzard 对遗留测试租户账户使用有限次数的口令喷洒，并借分布式住宅代理降低发现和账户阻断概率，最终取得该账户。公开材料未列出逐请求时间、全部来源或候选口令，因此案例只支持低量与来源分散及其被报告的意图，不支持精确节奏阈值。
description_en: Microsoft investigated Midnight Blizzard's limited-attempt password spraying against a legacy test-tenant account and its use
  of distributed residential proxies to reduce discovery and blocking; the actor obtained that account. Published material omits per-request timing,
  the full source set, and candidate passwords, so the case supports reported low volume and source dispersion, not a precise cadence threshold.
