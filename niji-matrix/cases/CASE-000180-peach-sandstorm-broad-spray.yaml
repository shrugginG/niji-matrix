schema_version: 1.0.0
type: case
id: CASE-000180
name_zh: Peach Sandstorm 跨环境口令喷洒
name_en: Peach Sandstorm Multi-Environment Password Spray
actor_or_campaign: Peach Sandstorm
subject_refs:
- NJT-0137
- NJS-0137-002
description_zh: Microsoft 观察到 Peach Sandstorm 在 2023 年 2 月至 7 月尝试对数千个环境进行口令喷洒，并在部分入侵中利用所得合法凭据继续活动。这一事件支持跨账户/环境的验证分布和结果，不提供同一环境内每个来源、请求时刻或明文候选口令。现有
  CASE-000172 记录后续 Azure 订阅创建，不能代替本次喷洒事件。
description_en: Microsoft observed Peach Sandstorm attempt password spraying against thousands of environments from February through July 2023
  and use obtained legitimate credentials in some intrusions. The event supports distribution across accounts and environments and its outcomes,
  but not each source, request time, or plaintext candidate password within one environment. Existing CASE-000172 records later Azure subscription
  creation and does not substitute for this spray event.
time_range: February-July 2023
target_sectors_zh:
- 高价值组织身份环境
target_sectors_en:
- Identity environments of high-value organizations
evidence_refs:
- REF-000461
confidence: high
status: review
