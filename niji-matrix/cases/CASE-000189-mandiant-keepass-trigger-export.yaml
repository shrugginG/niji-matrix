name_zh: Mandiant 红队预置 KeePass 触发器导出
name_en: Mandiant Red-Team KeePass Trigger Export
actor_or_campaign: Mandiant authorized red team
subject_refs:
- NJT-0147
- NJS-0147-001
description_zh: 在一次授权红队演练中，研究者先修改 KeePass 配置以加入事件触发器；目标用户下次打开保管库时，应用输出含全部口令的 CSV，红队从用户漫游配置目录取得该文件，其中包括财务应用口令和 RSA SecurID PIN。案例直接证明一次受信解锁工作流被转用后产生明文导出，不证明所有密码管理器或真实敌手普遍使用该路径。
description_en: In an authorized red-team exercise, researchers modified KeePass configuration to add an event trigger. When the user next opened
  the vault, the app produced a CSV containing its passwords, which the team retrieved from the user's roaming profile; the file included a finance-application
  password and RSA SecurID PIN. The case directly proves one trusted unlock workflow produced plaintext export after repurposing, not that every
  manager or external actor uses the path.
