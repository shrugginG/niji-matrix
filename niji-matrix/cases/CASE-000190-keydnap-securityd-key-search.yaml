id: CASE-000190
name_zh: Keydnap 读取 securityd 内存寻找钥匙串密钥
name_en: Keydnap Search for Keychain Keys in securityd Memory
actor_or_campaign: OSX/Keydnap
subject_refs:
- NJT-0147
- NJS-0147-002
description_zh: ESET 对 2016 年 Keydnap 样本的分析发现，它借用 Keychaindump 风格函数读取旧版 OS X securityd 内存、搜索用户钥匙串解密密钥，并具有向控制端发送钥匙串内容的路径。样本分析证明该运行态路径及外传能力，不提供现代
  macOS 的同等内存布局或每台感染主机的明文恢复记录。
description_en: ESET's 2016 Keydnap sample analysis found Keychaindump-style functions reading legacy OS X securityd memory for a user's keychain
  decryption key and a path to send keychain content to the controller. The sample establishes this runtime path and exfiltration capability,
  not the same memory layout on modern macOS or plaintext recovery on every infected host.
time_range: '2016'
target_sectors_zh:
- 未限定的 macOS 用户环境
target_sectors_en:
- Unspecified macOS user environments
