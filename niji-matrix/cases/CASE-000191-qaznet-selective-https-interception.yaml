description_zh: IMC 研究者在 2019 年测到部分哈萨克斯坦路径和通信站点 SNI 触发 Qaznet 替代证书，自控源站见到中间节点上游握手；测试响应未见改变。案例只支持选择性介入和可解密条件，不证明任何具体用户正文已被保存。
description_en: IMC researchers measured Qaznet substitute certificates for selected Kazakhstan paths and communications-site
  SNIs in 2019 and observed the intermediary's upstream handshake at a controlled origin; test responses showed no change.
  The case supports selective interposition and decryptability conditions, not retention of any particular user's body.
