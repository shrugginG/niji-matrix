description_zh: Microsoft 在多个受损邮箱发现针对 invoice、payment 等词的转发规则，把匹配邮件送往攻击者控制地址，也观察到删除规则。公开报告未给出逐封匹配消息的完整路由日志，故案例只证明规则与持续分流行为，不证明每封消息实际到达。
description_en: Microsoft found forwarding rules for words such as invoice and payment across compromised mailboxes, routing
  matching mail to attacker addresses, and also observed deletion rules. The report does not publish complete per-message
  routing logs, so the case supports the rule and continuing diversion behavior, not arrival of every message.
