description_zh: Unit 42 分析 T9000 经已登录 Skype 接口、在用户批准后同时取得通话音频与视频。临时音频及视频分别位于应用数据的子目录；解密产物直接显示周期性视频通话图像，音频为 WAV，均在会后压缩加密。该事件可支持音频与视频的不同直接对象，但不证明现代通话产品具有相同接口，也不证明无提示权限绕过。
description_en: Unit 42 analyzed T9000 acquiring call audio and video through a signed-in Skype interface after user approval.
  Temporary audio and video occupied separate application-data subdirectories; decrypted output directly showed periodic video-call
  images and WAV audio, followed by post-call compression and encryption. The same event supports distinct audio and video
  objects but does not prove identical interfaces in current call products or promptless permission bypass.
