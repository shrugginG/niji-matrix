type: case
id: CASE-000203
name_zh: Gamaredon 改写原有文档中的宏与模板
name_en: Gamaredon Injects Macros and Templates into Existing Documents
actor_or_campaign: Gamaredon
subject_refs:
- NJT-0148
- NJS-0148-001
description_zh: ESET 分析 Gamaredon 的 CodeBuilder 与 VBScript 模块：它们寻找可访问的 Word/Excel 文档，移动至暂存位置，加入恶意宏或远程模板引用，再放回原路径。报告说明这些文档可在组织内共享并由后来打开者触发；没有逐个公开异机打开和失陷结果，也明确称该组织偏重快速扩散。
description_en: ESET analyzed Gamaredon CodeBuilder and VBScript modules that find reachable Word or Excel documents, move
  them temporarily, insert malicious macros or remote-template references, and return them to their paths. The report explains
  how colleagues can share and later open those documents, but does not publish each cross-host open or compromise outcome
  and explicitly describes an actor focused on rapid spread.
time_range: 2019-2020
