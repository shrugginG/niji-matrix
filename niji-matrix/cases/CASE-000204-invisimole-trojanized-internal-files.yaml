name_zh: InvisiMole 替换组织内部原有软件和文档
name_en: InvisiMole Replaces Existing Organizational Software and Documents
actor_or_campaign: InvisiMole
subject_refs:
- NJT-0148
- NJS-0148-001
description_zh: ESET 白皮书第 5.2 节记录行动者取得组织内部文档和软件安装包，将原件改为携带 InvisiMole 的自解压包，保留名称、图标和元数据，再放回内部使用路径，依赖其他用户分享与执行。该证据支持原有对象身份延续与恶意内容变化；报告未给每台消费者的完整执行遥测。
description_en: ESET's white paper section 5.2 records actors obtaining internal documents and software installers, replacing
  originals with self-extracting packages carrying InvisiMole while preserving names, icons, and metadata, and relying on
  others to share and execute them. This supports continuity of apparent object identity despite changed content, but the
  report does not give complete execution telemetry for every consumer.
time_range: late 2019-2020
