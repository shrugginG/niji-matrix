schema_version: 1.0.0
type: case
id: CASE-000205
name_zh: 共享盘目录替身导致用户点击后本地执行
name_en: Directory Substitute on a Share Leads to Local Execution
actor_or_campaign: Unknown ransomware intrusion investigated by David Routin
subject_refs:
- NJT-0148
- NJS-0148-002
description_zh: 原作者记录一处客户共享盘中真实目录被隐藏，同名并带目录图标的快捷方式替代可见入口。员工点击后仍看到预期目录，同时快捷方式把恶意内容复制到本地并运行；作者还给出受控复现与共享审计建议。此案例支持导航绑定变化与受害者动作，但客户身份、逐台遥测和真实传播规模未公开。
description_en: The investigator reports a customer share where real directories were hidden and same-named shortcuts with
  directory icons replaced visible entries. Users who clicked still saw the expected directory while the shortcut copied malicious
  content locally and ran it; the author also provides a controlled reproduction and share-audit guidance. The account supports
  changed navigation binding and recipient action, but client identity, per-host telemetry, and full spread were not disclosed.
time_range: reported 2017
