description_zh: ESET 对 Win32/USBStealer 样本逆向重建：已受控主机 A 写入可移动介质上的隐藏组件与诱导入口，介质接到隔离主机 B 后，用户或自动运行触发本地组件。隐藏属性、仿冒安全工具与时间属性可改变可见外观。该结论是样本能力及传播模型，不是某次企业事件已公开完整
  A/B 时间线。
description_en: ESET reverse engineered Win32/USBStealer and reconstructed an already controlled host A writing hidden components
  and a lure to removable media, followed by local activation when that medium is connected to isolated host B. Hidden attributes,
  security-tool disguise, and time attributes change visible appearance. The conclusion is a sample capability and propagation
  model, not a complete published A/B timeline from one enterprise incident.
