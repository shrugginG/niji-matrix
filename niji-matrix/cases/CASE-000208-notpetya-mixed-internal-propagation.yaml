description_zh: Microsoft 对 NotPetya 的样本和网络分析显示，传播组合了获取的凭据、系统管理工具与在部分条件下尝试的 SMB 漏洞路径。它证明同一活动中的主机间到达和远程运行可有不同因果入口；没有每个目标的 exploit
  成功证据时，不应把所有横向结果归为 T1210。
description_en: Microsoft sample and network analyses show NotPetya combining acquired credentials, system administration
  tools, and an SMB exploit path attempted under some conditions. This establishes that arrival and remote execution within
  one campaign can have different causal entries. Without exploit-success evidence for each destination, not every lateral
  outcome can be attributed to T1210.
