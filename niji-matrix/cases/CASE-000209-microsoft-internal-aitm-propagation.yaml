schema_version: 1.0.0
type: case
id: CASE-000209
name_zh: 受陷内部身份发信后第二账户失陷
name_en: Compromised Internal Sender Followed by Further Account Compromise
actor_or_campaign: Microsoft-observed AiTM and BEC campaign
subject_refs:
- NJT-0150
description_zh: Microsoft 记录能源部门活动中受陷账户被用于向内外联系人发送超过六百封带新诱导链接的邮件，部分组织内收件者点击后又出现新的账户失陷。该案例支持内部发件主体、消息触达、收件者动作和后继账户结果，不证明每一封邮件都造成失陷，也不把邮件数量当作低可见性。
description_en: Microsoft records compromised accounts in an energy-sector campaign sending more than six hundred messages
  with a new lure link to internal and external contacts; some recipients inside organizations clicked and further accounts
  were compromised. The case supports the internal sending principal, delivery, recipient action, and subsequent account outcome,
  not compromise by every message or low visibility merely because of message volume.
time_range: reported 2026
target_sectors_zh:
- 能源部门
target_sectors_en:
- Energy sector
