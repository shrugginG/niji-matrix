id: CASE-000210
name_zh: 受陷会计邮箱内部诱导与警示回复归档
name_en: Compromised Accounting Mailbox Internal Lure and Warning-Reply Archive
actor_or_campaign: Proofpoint-observed cloud account takeover
subject_refs:
- NJT-0150
- NJS-0111-001
description_zh: Proofpoint 记录攻击者控制会计邮箱后先建立按活动主题自动归档回复的规则，再以同一主题向四十五名同事发恶意附件；高管助理打开后其账户也被攻陷。规则让原邮箱日常 Inbox 不显示警示回复，但服务端规则和归档消息仍可查。案例支持内部钓鱼结果及共现的视图遗漏，不产生一个与
  NJS-0111-001 同义的新子项。
description_en: Proofpoint records an attacker controlling an accounting mailbox, first creating a rule to archive replies
  matching the campaign subject, then sending malicious attachments with that subject to forty-five colleagues. An executive
  assistant opened one and their account was also compromised. The rule removed warning replies from the original user's ordinary
  Inbox while server-side rule and archived messages remained. This supports internal-phishing outcome and co-occurring default-view
  omission, not a new child synonymous with NJS-0111-001.
time_range: reported 2026
