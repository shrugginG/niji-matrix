type: case
id: CASE-000211
name_zh: 受阻 tscon 后成功的 RDS shadow 接管
name_en: Successful RDS Shadow Control After a Blocked tscon Attempt
actor_or_campaign: Unidentified eCrime intrusion investigated by CrowdStrike
subject_refs:
- NJT-0151
- NJS-0151-002
description_zh: CrowdStrike 2020 OverWatch 报告记录攻击者在亚太物流环境枚举 RDP 会话，尝试以 tscon 改接会话但遭 Falcon 阻断；随后更改影子控制策略并用 mstsc 的 shadow/control
  选项成功控制活动会话。只能把后一分支算作成功的控制端重绑定，不能把受阻 tscon 写成成功。
description_en: CrowdStrike's 2020 OverWatch report records an actor in an Asia-Pacific logistics intrusion enumerating RDP
  sessions and attempting tscon reattachment, which Falcon blocked. The actor then changed shadow-control policy and successfully
  controlled an active session with mstsc shadow and control options. Only the latter branch is a successful controller rebind;
  the blocked tscon attempt is not.
time_range: '2020'
