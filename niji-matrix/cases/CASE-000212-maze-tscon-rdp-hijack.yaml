description_zh: Mandiant 对多起 MAZE 入侵的调查综述明确记录攻击者使用 tscon 接管合法 RDP 会话，并用于横向移动与权限提升。报告未给逐个会话 ID、4778/4779 前后态或每次命令的资源结果，因此案例只能支持此行为在现场出现，不能当作具体
  Analytic 字段链的原始遥测。
description_en: Mandiant's synthesis of multiple MAZE investigations directly states that actors used tscon to commandeer
  legitimate RDP sessions for lateral movement and privilege escalation. The report does not provide per-session IDs, before-and-after
  4778 or 4779 state, or resource outcomes for each command. It supports field occurrence of the behavior, not the raw telemetry
  chain of a particular analytic.
