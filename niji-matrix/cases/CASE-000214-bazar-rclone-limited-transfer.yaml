id: CASE-000214
name_zh: Bazar/Conti 从 UNC 共享直接复制到 MEGA
name_en: Bazar/Conti Direct Copy from UNC Share to MEGA
actor_or_campaign: Bazar/Conti intrusion
subject_refs:
- NJT-0154
- NJS-0154-002
- NJT-0216
description_zh: The DFIR Report 在同一 Bazar/Conti 入侵中观察到 Rclone 以 UNC Shares 路径为源直接复制到 MEGA，并记录 SMB 共享连接活动。该事件分别支持共享内容取得与云服务外传；没有中间落点时不能反推数据暂存，且报告未提供逐文件
  4663、映射 LUID 或服务器返回字节。
description_en: The DFIR Report observed Rclone copying directly from a UNC Shares source to MEGA in the same Bazar/Conti
  intrusion and recorded SMB share connection activity. The event separately supports share-content acquisition and cloud-service
  exfiltration. Without an intermediate destination it does not establish staging, and the report provides no per-file 4663,
  mapping LUID, or server-return byte record.
