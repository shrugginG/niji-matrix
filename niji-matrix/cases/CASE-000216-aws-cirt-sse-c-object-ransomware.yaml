schema_version: 1.0.0
type: case
id: CASE-000216
name_zh: AWS CIRT 观察到的 S3 SSE-C 对象重加密活动
name_en: AWS CIRT Observed S3 SSE-C Object Re-encryption
actor_or_campaign: Unattributed actors observed by AWS CIRT
subject_refs:
- NJT-0157
- NJS-0157-002
description_zh: AWS 安全团队报告，攻击者取得客户的有效凭据后，使用带客户提供密钥的 SSE-C CopyObject 对大量已有 S3 对象进行覆写式重加密。公开报告给出恶意操作模式与防御响应，但未披露单一受害者身份、完整时序或逐对象读取验证；本案例只记录其实际观察范围。
description_en: AWS security teams reported actors obtaining valid customer credentials and using SSE-C CopyObject
  with customer-provided keys to overwrite and re-encrypt many existing S3 objects. The public report describes
  the malicious operation pattern and defensive response but does not identify one victim or disclose a full timeline
  or per-object read validation; this case records only that observed scope.
time_range: Reported by 2025-01
target_sectors_zh:
- 使用 Amazon S3 的客户环境；具体行业未披露
target_sectors_en:
- Amazon S3 customer environments; sectors undisclosed
