type: case
id: CASE-000223
name_zh: Grandoreiro 对 Trusteer 二进制写入拒绝 ACL
name_en: Grandoreiro Writing a Denial ACL to a Trusteer Binary
actor_or_campaign: Grandoreiro
subject_refs: [NJT-0161]
description_zh: ESET 对 Grandoreiro 样本的分析记录其两次调用 cacls，为 Everyone 等主体向 Trusteer RapportGH.dll 写入 None/deny 权限，并将该行为置于尝试破坏银行保护软件的自保护链中。该样本证实攻击者选择具体防御消费者及其文件权限边界；公开分析未逐台给出 Trusteer 随后启动失败或防护功能测试结果，因此案例支持恶意权限修改与意图，不单独证明全部环境中的成功失防。
description_en: ESET analysis of Grandoreiro records two cacls invocations that write None or denial permissions for trustees including Everyone to Trusteer RapportGH.dll and places the behavior in a self-protection chain attempting to break banking-protection software. The sample establishes adversary selection of a specific defensive consumer and its file-permission boundary. The public analysis does not provide per-device Trusteer launch failure or protection-canary results, so the case supports malicious permission modification and intent rather than universal completed impairment.
time_range: "2020"
target_sectors_zh: [网上银行用户]
target_sectors_en: [Online banking users]
