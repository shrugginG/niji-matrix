type: case
id: CASE-000224
name_zh: BlackEnergy 3 通过 Registry 降低 Internet Explorer 安全设置
name_en: BlackEnergy 3 Reducing Internet Explorer Security Through the Registry
actor_or_campaign: 2015 Ukraine Electric Power Attack / BlackEnergy 3
subject_refs: [NJT-0162]
description_zh: Booz Allen 对 2015 乌克兰关键基础设施攻击相关 BlackEnergy 3 样本的分析记录安装器修改 Registry 中 Internet ZoneMap、PhishingFilter、Protected Mode 提示等安全值，再由 rundll32 加载 FONTCACHE.DAT 并建立后继 C2。ATT&CK 将该程序实例映射到 T1112。报告直接支持恶意 writer、具体旧新配置意图和消费后的执行链，但没有为每台受害主机提供独立有效设置或浏览器保护 canary，因此不把所有值写入统一升级为已确认的完整控制失效。
description_en: Booz Allen analysis of BlackEnergy 3 samples associated with the 2015 Ukraine critical-infrastructure attack records installer changes to Registry Internet ZoneMap, PhishingFilter, and Protected Mode notification settings, followed by rundll32 loading FONTCACHE.DAT and subsequent C2. ATT&CK maps this procedure to T1112. The report directly supports a malicious writer, concrete security-setting intent, and a post-consumption execution chain, but does not provide independent effective-setting or browser-protection canaries for every victim host, so not every value write is promoted to complete control failure.
time_range: "2015"
target_sectors_zh: [电力与关键基础设施]
target_sectors_en: [Electricity and critical infrastructure]
evidence_refs: [REF-000188, REF-000692]
confidence: medium
status: review
