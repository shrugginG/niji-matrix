id: CASE-000225
name_zh: LAPSUS$ 在受害云内创建 VM 并删除资源
name_en: LAPSUS$ Creation of Victim-Cloud VMs and Resource Deletion
actor_or_campaign: DEV-0537 / LAPSUS$
subject_refs: [NJT-0163, NJS-0163-001, NJS-0163-002]
description_zh: Microsoft 直接观察 DEV-0537 在受害 AWS/Azure 云内创建攻击者控制的虚拟机用于继续攻击，并在数据窃取后删除本地与云系统/资源。前者支持新计算 lineage 被用于后继活动，后者支持生命周期操作造成状态终止；报告未公开每台 VM 的代理注册、来宾日志与备份结果，因此案例不能单独证明完整控制盲区或所有证据永久丢失。
description_en: Microsoft directly observed DEV-0537 creating actor-controlled virtual machines inside victim AWS or Azure clouds for further attacks and deleting on-premises and cloud systems or resources after data theft. The former supports new compute lineage used for follow-on activity and the latter lifecycle termination of state. The report does not publish agent enrollment, guest logs, or backup outcome for each VM, so the case cannot alone establish complete control blindness or permanent loss of all evidence.
