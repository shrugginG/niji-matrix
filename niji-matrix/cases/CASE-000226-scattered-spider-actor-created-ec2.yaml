type: case
id: CASE-000226
name_zh: Scattered Spider 使用受害环境中新建 EC2
name_en: Scattered Spider Use of Actor-Created EC2 in Victim Environments
actor_or_campaign: Scattered Spider
subject_refs: [NJT-0163, NJS-0163-001]
description_zh: CISA/FBI 联合公告记录 Scattered Spider 启用 AWS Systems Manager Inventory 进行发现，随后移动到既有和攻击者新建的 EC2 实例。该案例直接证明受害云内新计算身份与后继活动，但未披露新实例是否缺少 EDR、集中日志或其他治理注册；因此只支持影子计算分支的恶意使用前提，最终控制范围差仍需本地证据。
description_en: A CISA and FBI joint advisory records Scattered Spider enabling AWS Systems Manager Inventory for discovery and then moving to both preexisting and actor-created EC2 instances. The case directly establishes new compute identity and follow-on activity inside a victim cloud but does not disclose whether new instances lacked EDR, centralized logging, or other governance enrollment. It therefore supports malicious use of the shadow-compute branch while final control-scope difference still requires local evidence.
time_range: "2023"
