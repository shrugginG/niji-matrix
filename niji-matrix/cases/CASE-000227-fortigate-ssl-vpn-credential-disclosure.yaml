schema_version: 1.0.0
type: case
id: CASE-000227
name_zh: FortiGate SSL VPN 漏洞凭据资料披露
name_en: FortiGate SSL VPN Vulnerability Credential Disclosure
actor_or_campaign: Unattributed malicious actor
subject_refs:
- NJT-0164
- NJS-0164-001
description_zh: Fortinet 在 2021 年确认攻击者公开了一批与约 87,000 台 FortiGate SSL VPN 设备相关的访问资料；这些设备在攻击者扫描时仍未修补 CVE-2018-13379。联合公告说明该路径遍历漏洞可下载系统文件并获得凭据。公开资料支持服务代理返回和大规模材料结果，却没有逐设备请求、文件访问、账号使用或完整日志谱系。
description_en: Fortinet confirmed in 2021 that a malicious actor disclosed access information associated with about 87,000 FortiGate SSL VPN
  devices that remained unpatched for CVE-2018-13379 when scanned. A joint advisory states that the path-traversal flaw can download system files
  and expose credentials. The reporting supports service-mediated return and material outcome at scale but lacks per-device request, file-access,
  account-use, and complete log lineage.
time_range: CVE-2018-13379 exploitation before September 2021
target_sectors_zh:
- FortiGate SSL VPN deployments
target_sectors_en:
- FortiGate SSL VPN deployments
