schema_version: 1.0.0
type: case
id: CASE-000228
name_zh: UNC3886 利用 vCenter 权限漏洞读取加密凭据
name_en: UNC3886 vCenter Credential Over-Read Through a Permission Flaw
actor_or_campaign: UNC3886
subject_refs:
- NJT-0164
- NJS-0164-002
description_zh: Mandiant 报告 UNC3886 利用 CVE-2022-22948，从 vCenter PostgreSQL 数据库取得加密的 vpxuser 凭据并用于进一步访问。厂商公告将该问题描述为低权用户可访问敏感信息的文件权限错误。该事件支持低权前态、漏洞边界跨越和凭据材料结果；公开资料没有给出完整查询、解密、每次登录和后继使用谱系，因此不把“取得加密凭据”自动扩写成同一事件已完成明文恢复。
description_en: Mandiant reports UNC3886 exploiting CVE-2022-22948 to obtain encrypted vpxuser credentials from the vCenter PostgreSQL database
  for further access. The vendor advisory describes improper file permissions that expose sensitive information to a lower-authority user. The
  incident supports lower-authority pre-state, flaw-mediated boundary crossing, and credential-material outcome. Public reporting lacks the complete
  query, decryption, per-login, and later-use lineage, so obtaining encrypted credentials is not promoted to same-incident plaintext recovery.
time_range: Observed in UNC3886 operations reported in 2024
target_sectors_zh:
- VMware vCenter and ESXi environments
target_sectors_en:
- VMware vCenter and ESXi environments
