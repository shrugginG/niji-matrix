schema_version: 1.0.0
type: case
id: CASE-000230
name_zh: Dark Halo 伪造 Duo 辅助认证状态
name_en: Dark Halo Forgery of Duo Auxiliary Authentication State
actor_or_campaign: Dark Halo / Solorigate operators
subject_refs:
- NJT-0166
- NJS-0166-002
description_zh: Volexity 报告 Dark Halo 在已获用户名和口令完成 OWA 主认证后，利用受侵 Duo 集成密钥计算应用本地接受的 duo-sid 值；Duo 一侧没有对应认证事件，而 OWA 建立会话。案例支持真实主认证与伪造辅状态组合造成步骤缺口。该实现属于旧版集成语义，不能把
  akey 或 duo-sid 字段机械推广到当前 SDK。
description_en: Volexity reports Dark Halo completing OWA primary authentication with a username and password and then using a compromised Duo
  integration secret to compute a locally accepted duo-sid value. Duo had no corresponding authentication event while OWA created a session. The
  case supports a step gap composed from genuine primary authentication and forged auxiliary state. It reflects legacy integration semantics and
  does not make akey or duo-sid universal fields for current SDKs.
time_range: Solorigate investigation reported in 2020
target_sectors_zh:
- Organizations using affected OWA and legacy Duo integration
target_sectors_en:
- Organizations using affected OWA and legacy Duo integration
