id: CASE-000231
name_zh: Cisco IOS 运行内存代码修改事件
name_en: Cisco IOS Runtime-Memory Code Modification Incidents
actor_or_campaign: Unattributed Cisco IOS intrusions
subject_refs: [NJT-0167, NJS-0167-001]
description_zh: Cisco 取证报告 2013 年发现两类针对 Cisco 7600 的恶意样本，攻击者使用调试/排障 CLI 修改运行中 IOS 内存代码，加入数据外送与 NAT 能力，而闪存中的 IOS 二进制不变；修改可从 core dump 和内存分析发现，设备重载后不持续。该事件直接证明运行映像与持久映像分离的取证拓扑。
description_en: Cisco forensics reported two malicious samples found in 2013 on Cisco 7600 devices where adversaries used debugging and troubleshooting CLI commands to modify running IOS memory and add data-exfiltration and NAT capabilities while the IOS binary in flash remained unchanged. Core dumps and memory analysis could reveal the mutation, and it did not persist after reload. The incidents directly establish the forensic topology separating running and persistent images.
time_range: "2013"
