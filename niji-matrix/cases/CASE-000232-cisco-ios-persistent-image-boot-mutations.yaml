schema_version: "1.0.0"
type: case
id: CASE-000232
name_zh: Cisco IOS 闪存与 ROMMON 持久映像修改
name_en: Cisco IOS Flash and ROMMON Persistent Image Modifications
actor_or_campaign: Unattributed Cisco IOS intrusions
subject_refs: [NJT-0167, NJS-0167-002]
description_zh: Cisco 对 2011–2014 年事件的取证记录恶意修改的 IOS 闪存映像以及 ROMMON 持久组件；部分修改跨设备重载和 IOS 升级继续存在，并在启动后向运行 IOS 注入代码。可信新映像重装可以移除某些变体，而 Trust Anchor、secure boot 与签名可阻止特定启动链。该组事件直接支持存储映像被下一次启动消费的持久拓扑。
description_en: Cisco forensics on incidents from 2011 through 2014 records maliciously modified IOS images in flash and a persistent ROMMON component. Some changes survived device reload and IOS upgrade and injected code into running IOS after boot. Reinstalling a trusted current image could remove some variants, while Trust Anchor, secure boot, and signing could prevent particular boot chains. These incidents directly support the topology of a stored image consumed at the next boot.
time_range: "2011–2014"
target_sectors_zh: [未披露]
target_sectors_en: [Not disclosed]
evidence_refs: [REF-000467, REF-000468]
confidence: high
status: review
