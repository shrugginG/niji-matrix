type: case
id: CASE-000233
name_zh: ThreatNeedle 路由 VM 代理跨越企业隔离区
name_en: ThreatNeedle Router-VM Proxy Across an Enterprise Segmentation Boundary
actor_or_campaign: Lazarus / ThreatNeedle
subject_refs: [NJT-0168, NJS-0168-001]
description_zh: Kaspersky 调查中，受害网络被划分为可联网 corporate 区和禁止互通的 restricted 区。攻击者取得管理员使用的 CentOS 路由 VM root 凭据，配置 Apache proxy，随后经该路由托管恶意样本、让受限区 malware 出网并外送数据。案例同时给出边界基线、桥接状态和双侧流量结果，直接支持转发路径改写。
description_en: In Kaspersky's investigation, the victim network was divided into an internet-connected corporate zone and a restricted zone that policy prohibited from exchanging information. The adversary obtained root credentials to a CentOS router VM used by administrators, configured an Apache proxy, then hosted malware through the router and enabled restricted-zone malware to reach outward and exfiltrate data. The case provides the boundary baseline, bridge state, and bilateral traffic outcome and directly supports forwarding-path rewrite.
time_range: "2020"
target_sectors_zh: [国防工业]
target_sectors_en: [Defense industry]
evidence_refs: [REF-000722]
confidence: high
status: review
