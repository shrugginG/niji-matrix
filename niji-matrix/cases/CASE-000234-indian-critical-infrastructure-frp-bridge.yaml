schema_version: "1.0.0"
type: case
id: CASE-000234
name_zh: 印度关键基础设施入侵中的 FRP/VPN 桥接
name_en: FRP and VPN Bridging in Indian Critical-Infrastructure Intrusions
actor_or_campaign: TAG-38 / suspected Chinese state-sponsored activity
subject_refs: [NJT-0168, NJS-0168-002]
description_zh: Recorded Future 报告及 ATT&CK 汇总指出相关入侵使用 FRP 跨越网络边界，并通过可能受侵 MSP 的 VPN 连接直接进入关键基础设施网络。公开信息证明叠加中继/隧道路径及跨域目的，但没有逐连接公开 relay PID、两侧 flow ID 和完整批准路径，因此具体部署仍需本地证据闭合。
description_en: Recorded Future reporting and the ATT&CK summary state that related intrusions used FRP to bridge network boundaries and VPN connectivity through a potentially compromised MSP for direct access to critical-infrastructure networks. Public information establishes an overlay relay or tunnel path and cross-domain purpose but does not publish relay PIDs, bilateral flow IDs, and the complete approved-path model for every connection, so a local deployment still needs evidence closure.
time_range: "2021–2022"
target_sectors_zh: [电力与关键基础设施]
target_sectors_en: [Electricity and critical infrastructure]
evidence_refs: [REF-000721, REF-000724]
confidence: medium
status: review
