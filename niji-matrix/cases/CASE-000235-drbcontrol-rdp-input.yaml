description_zh: Trend Micro 报告 DRBControl 在 RDP 会话中运行键盘记录逻辑，并把用户名、时间、进程、窗口标题和捕获输出写入混淆报告文件。该事件直接支持消费者前输入流被复制到攻击者可读结果；公开资料未提供跨环境告警率，也不能据此推断所有输入均为认证秘密。
description_en: Trend Micro reported DRBControl running keylogging logic in RDP sessions and writing username, time, process,
  window title, and captured output to an obfuscated report file. The event directly supports a pre-consumer input stream
  copied to an attacker-readable result. Public reporting provides no cross-environment alert rate and does not establish
  that every captured input was an authentication secret.
