type: case
id: CASE-000236
name_zh: Ivanti Cutting Edge 登录脚本篡改
name_en: Ivanti Cutting Edge Login-Script Modification
actor_or_campaign: UTA0178 / Cutting Edge
subject_refs:
- NJT-0169
- NJS-0169-002
description_zh: Volexity 在 Ivanti Connect Secure 事件响应中发现真实登录页加载的 lastauthserverused.js 被修改，Login 函数会把用户提交的用户名和口令另送攻击者域。事件支持原消费者身份与正常登录流程保留时出现第二接收路径；受影响会话总数和所有后继使用并未公开。
description_en: Volexity found during Ivanti Connect Secure incident response that lastauthserverused.js loaded by the genuine
  sign-in page had been changed so the Login function also sent submitted usernames and passwords to an attacker domain. The
  event supports a second receiver while the original consumer identity and sign-in flow remained. The total affected sessions
  and all successor uses were not published.
time_range: 2024-01
