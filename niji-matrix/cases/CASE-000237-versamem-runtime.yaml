id: CASE-000237
name_zh: VersaMem 认证服务运行态截获
name_en: VersaMem Authentication-Service Runtime Interception
actor_or_campaign: Volt Typhoon / VersaMem
subject_refs:
- NJT-0169
- NJS-0169-002
description_zh: Black Lotus Labs 报告 VersaMem 使用 Java instrumentation 替换 Versa Director 认证服务的 setUserPassword 方法，取得明文后加密并写入临时文件，同时不修改
  Java 文件。事件直接支持真实消费者运行态内的第二接收路径，也说明仅检查磁盘资产会留下盲区。
description_en: Black Lotus Labs reported VersaMem using Java instrumentation to replace the Versa Director authentication
  service setUserPassword method, obtain plaintext, encrypt it, and write it to a temporary file without changing Java files.
  The event directly supports a second receiver inside genuine-consumer runtime and shows the blind spot of disk-only integrity
  checks.
