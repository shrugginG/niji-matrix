id: CASE-000238
name_zh: APT42 仿冒云登录页面
name_en: APT42 Impersonated Cloud Sign-In Pages
actor_or_campaign: APT42
subject_refs:
- NJT-0169
- NJS-0169-003
description_zh: Mandiant 观察到 APT42 使用仿冒 Google、Microsoft、Yahoo、Google Meet 等服务的登录页面接收受害者输入，部分页面借 Google Sites 等受信托管增强外观并把凭据交给攻击者基础设施。报告证明
  Web 消费者身份伪装与输入结果，但没有证明每名诱饵接收者都提交了秘密。
description_en: Mandiant observed APT42 using sign-in pages impersonating Google, Microsoft, Yahoo, Google Meet, and other
  services to receive victim input. Some pages used trusted hosting such as Google Sites to improve appearance while delivering
  credentials to attacker infrastructure. The report establishes web-consumer impersonation and input results but does not
  show that every lure recipient submitted a secret.
