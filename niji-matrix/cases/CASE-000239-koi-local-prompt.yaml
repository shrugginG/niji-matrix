description_zh: Unit 42 分析的 Koi Stealer 以 AppleScript 风格对话框冒充 Visual Studio 更新，反复要求 root 口令，并把取得的用户名和口令送往 C2。样本证明本地原生外观可以掩盖攻击者控制的接收进程；该结果仅代表所分析的
