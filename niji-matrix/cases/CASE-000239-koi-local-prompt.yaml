description_en: Unit 42 analyzed Koi Stealer using an AppleScript-style dialog that impersonated a Visual Studio update, repeatedly
  requested a root password, and sent the obtained username and password to C2. The sample establishes that native local appearance
  can mask an attacker-controlled receiver. The result is limited to the analyzed macOS sample and activity.
