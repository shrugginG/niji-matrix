type: case
id: CASE-000240
name_zh: BPFDoor 将 Shell 与 MySQL 历史指向空设备
name_en: BPFDoor Shell and MySQL History Redirected to the Null Device
actor_or_campaign: BPFDoor
subject_refs: [NJT-0170, NJS-0170-001]
description_zh: Sandfly 对 BPFDoor 的原始技术分析显示，后门进入交互 shell 前把 HISTFILE 和 MYSQL_HISTFILE 设置为 /dev/null。命令仍由 shell 执行，但 Bash 与 MySQL 客户端预期历史被写往无效 sink，直接支持整段会话历史持久化抑制；该来源没有证明所有独立 audit、TTY 或进程遥测同时消失。
description_en: Sandfly's original technical analysis shows BPFDoor setting HISTFILE and MYSQL_HISTFILE to /dev/null before entering its interactive shell. Commands still execute while expected Bash and MySQL client history is directed to an ineffective sink, directly supporting whole-session history-persistence suppression. The source does not establish loss of every independent audit, TTY, or process record.
