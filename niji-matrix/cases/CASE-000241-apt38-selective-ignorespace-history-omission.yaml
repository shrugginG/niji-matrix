type: case
id: CASE-000241
name_zh: APT38 利用 ignorespace 选择性遗漏命令
name_en: APT38 Selective Command Omission with ignorespace
actor_or_campaign: APT38 / BeagleBoyz
subject_refs: [NJT-0170, NJS-0170-002]
description_zh: CISA、FBI、USCYBERCOM 与美国财政部的联合通告记录 APT38/BeagleBoyz 在启用 HISTCONTROL=ignorespace 的 shell 中为希望隐藏的命令添加前导空格。会话历史可继续保存其他条目，而命中输入 predicate 的命令在加入历史前被省略，直接支持选择性条目遗漏；前导空格本身仍需结合策略状态和独立命令证据解释。
description_en: A joint CISA, FBI, USCYBERCOM, and U.S. Treasury advisory records APT38 or BeagleBoyz prepending spaces to commands it wanted to hide in a shell with HISTCONTROL=ignorespace. The session can continue saving other entries while commands matching the input predicate are omitted before entering history, directly supporting selective entry omission. A leading space alone still requires policy state and independent command evidence for interpretation.
time_range: "2020"
target_sectors_zh: [金融]
target_sectors_en: [Financial services]
