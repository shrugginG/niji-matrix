name_zh: Mandiant PTA Spy 认证口令收集
name_en: Mandiant PTA Spy Authentication Password Collection
actor_or_campaign: PTA Spy / AADInternals
subject_refs:
- NJT-0093
- NJS-0093-003
description_zh: Mandiant 报告攻击者使用 AADInternals，并说明 PTA Spy 可在直通身份验证路径中截获口令尝试、把可恢复明文保存到 PTASpy.csv，恶意 PTA 代理也可收集有效凭据。该材料直接支持受信身份代理在认证继续时增加第二秘密接收者，但不能推断每个披露事件同时使用了所有本地与云代理变体。
description_en: Mandiant reported attacker use of AADInternals and explained that PTA Spy can intercept password attempts
  in the pass-through authentication path, save recoverable plaintext to PTASpy.csv, and use a rogue PTA agent to harvest
  valid credentials. The material directly supports a second secret recipient inside a trusted identity agent while authentication
  continues, but does not establish that every disclosed incident used every on-premises and cloud-agent variant.
