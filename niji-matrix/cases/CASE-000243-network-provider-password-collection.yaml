id: CASE-000243
name_zh: CrowdStrike 恶意 Network Provider 凭据收集
name_en: CrowdStrike Malicious Network Provider Credential Collection
actor_or_campaign: CrowdStrike OverWatch observed intrusions
subject_refs:
- NJT-0093
- NJS-0093-003
description_zh: CrowdStrike OverWatch 报告多起入侵在 Exchange 系统注册恶意 Network Provider DLL，由 mpnotify 在成功主认证后交付用户名和口令，并将其写入磁盘以便外传。聚合报告证明认证事务内秘密旁路输出在野存在，但未披露受害者身份或每次部署的完整逐事务遥测。
description_en: CrowdStrike OverWatch reported multiple intrusions registering malicious Network Provider DLLs on Exchange
  systems, receiving usernames and passwords from mpnotify after successful primary authentication, and writing them to disk
  for exfiltration. The aggregate report establishes in-the-wild in-transaction secret side output but omits victim identities
  and complete transaction telemetry for every deployment.
