schema_version: "1.0.0"
type: case
id: CASE-000244
name_zh: Snatch 通过 SafeBoot 服务在防御缺席窗口加密
name_en: Snatch Encryption Through a SafeBoot Service During a Defensive-Coverage Gap
actor_or_campaign: Snatch ransomware
subject_refs: [NJT-0172, NJS-0172-001]
description_zh: SophosLabs 与 MTR 在目标组织调查中观察到 Snatch 把 SuperBackupMan service 写入 SafeBoot Minimal 允许集，使用 BCDEdit 设置 safeboot minimal 并立即重启。主机进入多数第三方安全软件不运行的 Safe Mode 后，恶意 service 启动并加密文件。该案例闭合 BCD intent、实际 boot、payload enrollment、防御缺席和后继结果，同时保留部分 Sophos 保护主机成功阻断的限制。
description_en: In a targeted-organization investigation, SophosLabs and MTR observed Snatch writing the SuperBackupMan service into the SafeBoot Minimal allowlist, setting safeboot minimal with BCDEdit, and rebooting immediately. After the host entered Safe Mode where most third-party security software did not run, the malicious service started and encrypted files. The case closes BCD intent, actual boot, payload enrollment, defensive absence, and follow-on outcome while preserving the limitation that some Sophos-protected systems successfully blocked payloads.
time_range: "2019"
target_sectors_zh: [企业组织]
target_sectors_en: [Enterprise organizations]
evidence_refs: [REF-000758]
confidence: high
status: review
