type: case
id: CASE-000245
name_zh: Embargo MDeployer 的受限启动载荷存活链
name_en: Embargo MDeployer Restricted-Boot Payload-Survival Chain
actor_or_campaign: Embargo ransomware
subject_refs: [NJT-0172, NJS-0172-001]
description_zh: ESET 在调查的 Embargo 事件中观察到 MDeployer DLL/BAT 变体设置 Safe Mode、删除 WinDefend 的 SafeBoot Network 条目、创建 irnagentd service 并将其加入 SafeBoot Network。重启后 service 再次执行 loader，重命名选定安全产品目录并启动勒索载荷，之后清理 service 和 safeboot 状态返回正常模式。来源明确该功能只见于部分变体/事件。
description_en: In investigated Embargo incidents, ESET observed MDeployer DLL or BAT variants setting Safe Mode, deleting WinDefend's SafeBoot Network entry, creating the irnagentd service, and enrolling it under SafeBoot Network. After reboot the service executed the loader again, renamed selected security-product directories, and launched ransomware before cleaning the service and safeboot state and returning to normal mode. The source explicitly limits this capability to some variants or incidents.
