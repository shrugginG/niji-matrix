schema_version: "1.0.0"
type: case
id: CASE-000246
name_zh: PipeMon 借用被盗代码签名证书
name_en: PipeMon Borrowing a Stolen Code-Signing Certificate
actor_or_campaign: Winnti Group PipeMon
subject_refs: [NJT-0173, NJS-0173-001]
description_zh: ESET 在针对韩国与台湾游戏企业的 PipeMon 入侵中发现 modules、installer 和工具使用同一有效代码签名证书；研究人员判断该证书很可能在 Winnti 对受害游戏公司的早期行动中被盗。恶意对象因此携带合法 signer 特征，但签名者控制、build provenance 和运行行为与证书所有者不一致。来源未逐台披露 consumer allow decision，故案例支持 trust-attestation borrowing，不声称所有应用控制均被绕过。
description_en: In PipeMon intrusions against gaming companies in South Korea and Taiwan, ESET found modules, the installer, and tools using the same valid code-signing certificate, which researchers assessed was likely stolen during an earlier Winnti operation against a victim game company. The malicious objects therefore carried legitimate signer features while signer control, build provenance, and runtime behavior diverged from the certificate owner. The source does not disclose every consumer allow decision, so the case supports trust-attestation borrowing without claiming every application-control system was bypassed.
time_range: "2019–2020"
target_sectors_zh: [电子游戏开发]
target_sectors_en: [Video game development]
evidence_refs: [REF-000281]
confidence: high
status: review
