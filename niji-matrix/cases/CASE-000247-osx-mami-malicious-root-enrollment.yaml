id: CASE-000247
name_zh: OSX/MaMi 恶意根证书注册
name_en: OSX/MaMi Malicious Root-Certificate Enrollment
actor_or_campaign: OSX/MaMi
subject_refs: [NJT-0173, NJS-0173-002]
description_zh: Objective-See 对 OSX/MaMi 样本的逆向显示 setupCert 与 setupDNS 能力，malware 将名为 cloudguard.me 的证书加入 System keychain 的受信 root 并改写 DNS。新增 anchor 使后继由攻击者控制的证书链可在本机获得信任，为无警告中间介入创造条件。案例直接支持 trust-store writer 和 anchor 扩展；是否实际读取特定 HTTPS 内容仍由 AiTM/Collection 证据判定。
description_en: Objective-See reversing of the OSX/MaMi sample found setupCert and setupDNS capabilities, with the malware adding a cloudguard.me certificate as a trusted root in the System keychain and changing DNS. The new anchor allows later attacker-controlled chains to gain local trust and creates conditions for warning-free interposition. The case directly supports a trust-store writer and anchor expansion, while evidence of reading particular HTTPS content remains a question for AiTM and Collection.
