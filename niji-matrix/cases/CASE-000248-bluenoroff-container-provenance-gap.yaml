schema_version: "1.0.0"
type: case
id: CASE-000248
name_zh: BlueNoroff 镜像容器内的 MOTW 来源断裂
name_en: BlueNoroff MOTW Provenance Break Inside Image Containers
actor_or_campaign: BlueNoroff
subject_refs: [NJT-0173, NJS-0173-004]
description_zh: Kaspersky 在 BlueNoroff 活动中观察到攻击者使用来自互联网的 ISO/VHD 镜像承载诱饵文档、恶意脚本和 downloader。外层 delivery 具有外部来源，但挂载后的内部 payload 不继承 Zone.Identifier/MOTW，consumer 因而把它当作本地对象而不进入相同警告/保护路径。案例支持 source—container—child provenance discontinuity；ISO/VHD 格式本身不是 Niji 分类。
description_en: Kaspersky observed BlueNoroff using internet-delivered ISO and VHD images to carry decoy documents, malicious scripts, and a downloader. The outer delivery had external provenance, but payloads inside the mounted image did not inherit Zone.Identifier or MOTW, so consumers treated them as local objects and did not enter the same warning or protection path. The case supports source-to-container-to-child provenance discontinuity, while ISO or VHD format itself is not the Niji category.
time_range: "2022"
target_sectors_zh: [金融与加密货币]
target_sectors_en: [Financial and cryptocurrency]
evidence_refs: [REF-000775]
confidence: high
status: review
