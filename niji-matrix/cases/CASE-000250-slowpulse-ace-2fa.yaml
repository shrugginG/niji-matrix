description_zh: Mandiant 报告 SLOWPULSE Variant 2 在受侵 Pulse Secure 设备的真实 ACE-2FA 函数内把认证材料写入文件后返回正常控制流，证明认证组件中的第二读者。公开材料没有把每个记录值连接到验证接受或后继会话。
description_en: Mandiant reported SLOWPULSE Variant 2 writing authentication material from a genuine ACE-2FA function on compromised
  Pulse Secure appliances and then returning to normal control flow, establishing a second reader inside the authentication
  component. Public reporting does not connect every logged value to verifier acceptance or a later session.
