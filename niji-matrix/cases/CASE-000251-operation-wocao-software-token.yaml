description_zh: Fox-IT 观察到行为者窃取受害者 RSA SecurID software token，并通过逆向研究验证绕过设备导入检查后能够生成有效两因素代码。行为者取得 token 是在野事实，具体生成路径是经验证的最可能实现，因此保持中等置信。
description_en: Fox-IT observed actor theft of a victim RSA SecurID software token and verified through reverse engineering
  that bypassing the device-import check enabled generation of valid two-factor codes. Actor acquisition is a field fact,
  while the exact generation route is a validated most-likely implementation and remains medium confidence.
