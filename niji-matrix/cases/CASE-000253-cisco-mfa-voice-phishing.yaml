description_zh: Cisco 调查确认攻击者持有员工凭据后，结合高量 MFA 推送和多日受信支持幌子的语音钓鱼，取得推送批准和 VPN 访问，随后又注册新 MFA 设备。重复压力、跨信道情境和账户状态后继必须分别记录。
description_en: Cisco confirmed that an actor with compromised employee credentials combined high-volume MFA pushes and multi-day
  voice phishing under trusted-support pretexts, gained push approval and VPN access, and later enrolled new MFA devices.
  Repetition pressure, cross-channel context, and successor account-state change remain separate stages.
