id: CASE-000255
name_zh: UNC3886 在 TACACS+ 服务器部署 LOOKOVER 嗅探器
name_en: UNC3886 Deployment of LOOKOVER on a TACACS+ Server
actor_or_campaign: UNC3886
subject_refs:
- NJT-0176
- NJS-0176-001
description_zh: Mandiant 恢复了伪装路径下的 LOOKOVER，确认其使用 libpcap 过滤 TACACS+ 认证报文、以 TKEY 解混淆并准备把提取结果写入指定文件；core dump 显示程序在加密提取凭据并写盘时崩溃。
  未证明全部捕获材料成功写盘、具体凭据值、成功登录或后继账户使用；不可与同服务器的后门 tac_plus 二进制替换合并为一个案例。
description_en: Mandiant recovered LOOKOVER from a disguised path, confirmed libpcap filtering of TACACS+ authentication packets,
  TKEY-based de-obfuscation, and preparation to write extracted results to a specified file; a core dump showed the program
  crashing while encrypting extracted credentials for disk output. The source does not establish durable output of all captured
  material, specific credential values, successful authentication, or successor account use, and this event must not be merged
  with replacement of the tac_plus binary on the same server.
time_range: activity described by Mandiant in 2024 reporting
target_sectors_zh:
- compromised TACACS+ authentication server
target_sectors_en:
- compromised TACACS+ authentication server
