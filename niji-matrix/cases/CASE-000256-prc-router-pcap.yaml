schema_version: 1.0.0
type: case
id: CASE-000256
name_zh: 国家支持行为者滥用受侵路由器 PCAP 与镜像能力
name_en: State-Sponsored Abuse of Compromised-Router PCAP and Mirroring
actor_or_campaign: PRC state-sponsored actors summarized in AA25-239A
subject_refs:
- NJT-0176
- NJS-0176-002
- NJS-0176-003
description_zh: 联合机构观察到行为者在受侵网络设备上配置原生 PCAP 和 SPAN/RSPAN/ERSPAN，发现 `mycap.pcap`、`tac.pcap` 等产物及协助导出的命令；至少一案的设备配置以可逆
  Type 7 形式保存 TACACS+ 共享秘密。 通告将捕获 TACACS+ 和使用恢复秘密离线解密表述为主要目标或可行结果，没有证明每个 PCAP/镜像都含凭据、具体秘密已被解密或账户已被使用。
description_en: The joint agencies observed actors configuring native PCAP and SPAN, RSPAN, or ERSPAN on compromised
  network devices and identified artifacts such as `mycap.pcap` and `tac.pcap` plus commands used for export. In
  at least one case, the device configuration stored a TACACS+ shared secret in reversible Type 7 form. The advisory
  describes TACACS+ capture and offline decryption with the recovered secret as a primary objective or feasible
  result and does not establish that every PCAP or mirror contained credentials, that a particular secret was decrypted,
  or that an account was used.
time_range: activity since at least 2021, advisory published 2025-08-27
target_sectors_zh:
- enterprise, telecommunications, government, transportation, lodging, and military network infrastructure
target_sectors_en:
