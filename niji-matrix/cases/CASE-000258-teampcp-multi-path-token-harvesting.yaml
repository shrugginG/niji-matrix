schema_version: 1.0.0
type: case
id: CASE-000258
name_zh: TeamPCP 在受信 CI/CD 流程中多路径收获 Token
name_en: TeamPCP Multi-Path Token Harvesting in Trusted CI/CD Workflows
actor_or_campaign: TeamPCP
subject_refs:
- NJT-0178
- NJS-0178-001
- NJS-0178-002
- NJS-0178-003
description_zh: Unit 42 记录 TeamPCP 恶意代码在受侵端点经 IMDS 收集云凭据，直接读取 runner.worker 的 `/proc/<pid>/mem` 提取明文 token，在合法扫描继续并返回正常结果时把材料加密外传，并使用收获的
  npm/GitHub token 扩展供应链攻击。 报告未逐个公开 token 值、所有 object path、每次 issuer response、取得时有效期或全部受害者；不同波次不能拼成每台主机都经历的统一链，第三方的总规模估计也不能当作
  Unit 42 直接观察。
description_en: Unit 42 records TeamPCP malicious code harvesting cloud credentials through IMDS on compromised endpoints,
  reading runner.worker through `/proc/<pid>/mem` to extract plaintext tokens, encrypting and exfiltrating material while
  legitimate scans continued and returned normal results, and using harvested npm and GitHub tokens to extend the supply-chain
  attack. The report does not publish each token value, every object path, every issuer response, acquisition-time validity,
  or every victim. Separate waves cannot be combined into a universal per-host chain, and third-party scale estimates are
  not direct Unit 42 observation.
time_range: late February through March 2026
target_sectors_zh:
- Trivy, Checkmarx KICS, LiteLLM, Telnyx, and downstream CI/CD consumers
target_sectors_en:
- Trivy, Checkmarx KICS, LiteLLM, Telnyx, and downstream CI/CD consumers
