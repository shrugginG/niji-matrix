name_zh: 管理跳板 RDP 转发与 Exchange 攻击隧道
name_en: Administrative Jump-Host RDP Forwarding and Exchange Attack Tunneling
actor_or_campaign: FireEye-observed threat actors and Microsoft-observed Exchange attackers
subject_refs:
- NJT-0183
- NJS-0183-002
description_zh: Mandiant 记录管理跳板 netsh portproxy 转发 RDP；Microsoft 独立记录 Exchange 攻击者以 Plink/SSH 隧道和窃取凭据进行 RDP。共同支持受控中继承载新会话。
  两份报告不是同一行动，未公开一致 PID、双侧 flow、目标 LogonId 和命令；只合并模式，不合并归因或完整遥测。
description_en: Mandiant records RDP forwarded through administrative jump hosts using netsh portproxy; Microsoft independently
  records Exchange attackers using Plink or SSH tunnels and stolen credentials for RDP. Together they support a controlled
  intermediary carrying a fresh session. The reports are not one operation and do not expose common PID, bilateral flows,
  destination LogonId, and command; combine pattern only, not attribution or complete telemetry.
