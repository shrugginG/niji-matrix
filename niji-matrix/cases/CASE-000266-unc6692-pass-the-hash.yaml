description_zh: GTIG 记录 UNC6692 在备份服务器导出 LSASS 内存并离线提取高权用户 hash，随后以 Pass-the-Hash 横向进入域控制器，在目标下载并运行 FTK Imager、挂载存储并收集 NTDS.dit
  与注册表 hive。 来源直接证明材料类别、使用方式和目标结果，但未公开每台主机的 4776、4624、challenge response 或 material fingerprint；这些字段只能作为官方文档支持的检测设计。
description_en: GTIG records UNC6692 exporting LSASS memory from a backup server and extracting elevated-user hashes offline,
  then using Pass-the-Hash to enter domain controllers laterally, download and run FTK Imager, mount storage, and collect
  NTDS.dit and registry hives. The source directly establishes material class, use method, and destination outcome but does
  not publish 4776, 4624, challenge-response, or material-fingerprint records for each host; those fields remain a detection
  design supported by official documentation.
