schema_version: 1.0.0
type: case
id: CASE-000267
name_zh: Prestige 有序停止 MSSQL 服务
name_en: Prestige Orderly Stop of MSSQL Service
actor_or_campaign: Prestige ransomware operators
subject_refs:
- NJT-0185
description_zh: Microsoft 观察到 Prestige 勒索软件在加密前硬编码执行 `net.exe stop MSSQLSERVER`，使数据库服务停止并释放后继数据处理条件。案例证明攻击者使用标准服务控制路径和业务可用性结果；来源把动机归于加密可靠性，未证明维护式伪装是主观目的。
description_en: Microsoft observed Prestige ransomware execute a hard-coded `net.exe stop MSSQLSERVER` before encryption,
  stopping the database service and enabling later data handling. The case establishes attacker use of the standard
  service-control path and business availability loss; the source attributes the action to encryption reliability
  rather than a subjective camouflage motive.
time_range: 2022-10
target_sectors_zh:
- 乌克兰与波兰交通物流组织
target_sectors_en:
- Transportation and logistics organizations in Ukraine and Poland
evidence_refs:
- REF-000865
confidence: high
status: review
