schema_version: 1.0.0
type: case
id: CASE-000269
name_zh: Hushmail DNS 改向篡改页面
name_en: Hushmail DNS Diversion to a Defacement Page
actor_or_campaign: Unattributed domain hijacker
subject_refs:
- NJT-0187
- NJS-0187-001
description_zh: ICANN SSAC 报告攻击者通过注册商支持流程取得 Hushmail 注册账户控制，把 `www.hushmail.com` 的 DNS 记录指向托管篡改主页的服务器。真实 Hush 服务器没有被未授权访问，托管数据未被破坏，证明组织域名下的展示结果可在规范源保持干净时被替换。
description_en: ICANN SSAC reported an actor obtaining control of the Hushmail registration account through a registrar
  support process and redirecting `www.hushmail.com` DNS records to a server hosting a defaced home page. The real
  Hush servers were not accessed without authorization and hosted data was not compromised, establishing replacement
  of displayed output under the organization domain while the canonical origin remained clean.
time_range: '2005-04-24'
