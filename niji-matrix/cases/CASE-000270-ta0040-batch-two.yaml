schema_version: 1.0.0
type: case
id: CASE-000270
name_zh: 活动门控 GPU 挖矿活动
name_en: Activity-Gated GPU Mining Campaign
actor_or_campaign: Unattributed cryptojacking operators reported by Microsoft
subject_refs:
- NJT-0189
- NJS-0189-001
description_zh: Microsoft 报告一条加密劫持链持续读取用户空闲时间和 GPU 负载，在设备活动或 GPU 被游戏、流媒体占用时终止矿工，并在空闲后重新启动。案例直接支持消费时间包络由用户活动反馈控制；不自动推广到所有
  CPU、带宽或服务器工作负载。
description_en: Microsoft reported a cryptojacking chain that continually read user idle time and GPU load, stopped
  the miner when the device was active or the GPU was occupied by gaming or streaming, and restarted it after idle
  returned. The case directly supports control of the consumption envelope by user-activity feedback and does not
  automatically generalize to every CPU, bandwidth, or server workload.
time_range: '2026'
target_sectors_zh:
- 遭投毒搜索与 ScreenConnect 链影响的 Windows 交互端点
target_sectors_en:
- Interactive Windows endpoints affected by the poisoned-search and ScreenConnect chain
evidence_refs:
- REF-000900
confidence: high
status: review
