description_zh: ESET 的 USBStealer 模型让介质在联网 A 与隔离 B 间往返；B 端收集数据后写回介质，再由 A 侧取回。该证据支持跨观察域离线接续，未恢复最终远程上传组件。
description_en: ESET describes USBStealer media shuttling between connected host A and air-gapped host B, collecting
  data on B, writing it back to the medium, and returning it to A. This supports cross-domain offline relay, while
  the final remote-upload component was not recovered.
