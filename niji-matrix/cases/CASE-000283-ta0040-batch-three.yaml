id: CASE-000283
name_zh: Petya 延迟计划重启
name_en: Petya Deferred Scheduled Reboot
actor_or_campaign: Petya/NotPetya malware
subject_refs:
- NJT-0200
- NJS-0200-001
description_zh: Microsoft 分析记录 Petya 创建一次性计划任务，在当前时间后随机 10–60 分钟执行 `shutdown.exe /r /f`。该事实支持 writer、任务定义和后来调度器重启之间的时间/主体分离；传播路径仍由其他
  Case 负责。
description_en: Microsoft analysis records Petya creating a one-time task to execute `shutdown.exe /r /f` at a random
  time 10 to 60 minutes later. This supports temporal and actor separation among writer, task definition, and later
  scheduler reboot; propagation is owned by another Case.
time_range: '2017'
