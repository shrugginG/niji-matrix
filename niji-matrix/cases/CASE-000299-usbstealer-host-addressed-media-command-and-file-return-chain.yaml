description_zh: A 端操作者读取 B 登记的计算机名并写入加密 COMPUTER_NAME.in；介质回到 B 后命令被连续执行，文件或清单被写回介质，再由 A 侧取用。 ESET 逆向证明能力和四步模型，但 A 上另一个操作者组件未恢复，不能声称获得完整受害组织遥测。
description_en: Operators on A obtain B's registered computer name and write encrypted COMPUTER_NAME.in; when the medium
  returns to B, commands execute consecutively, files or listings are written back, and A later retrieves them. ESET
  reverse engineering establishes capability and the four-step model, but the companion operator component on A was not
  recovered and full victim-environment telemetry is unavailable.
