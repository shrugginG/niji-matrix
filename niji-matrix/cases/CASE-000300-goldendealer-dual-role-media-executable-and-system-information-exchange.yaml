name_zh: GoldenDealer 双角色介质执行文件—系统信息交换
name_en: GoldenDealer Dual-Role Media Executable and System-Information Exchange
actor_or_campaign: GoldenJackal 2019 South Asian embassy campaign
subject_refs:
- NJT-0207
- NJS-0207-001
- NJS-0207-002
description_zh: GoldenDealer 根据联网状态运行不同线程，以两枚 BOOTMGR 字节确认介质经过联网与隔离角色，把按用户标识选定的执行文件送入隔离端，并把隔离端系统信息带回联网端发送至 C2。 ESET 未观察负责把一般文件从隔离端复制到
  USB 的未知组件；案例只覆盖 GoldenDealer 已逆向的执行文件和系统信息通道。
description_en: GoldenDealer selects threads by network state, uses two BOOTMGR bytes to confirm visits to connected
  and isolated roles, delivers executables selected by user ID to the isolated side, and returns isolated-host information
  to the connected side for transmission to C2. ESET did not observe the unknown component responsible for copying general
  files from the isolated side to USB; the case is limited to GoldenDealer's reverse-engineered executable and system-information
  channel.
