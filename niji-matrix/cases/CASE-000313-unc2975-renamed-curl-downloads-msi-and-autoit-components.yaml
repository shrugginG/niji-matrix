name_zh: UNC2975 重命名 curl 下载 MSI 与 AutoIt 组件
name_en: UNC2975 Renamed curl Downloads MSI and AutoIt Components
actor_or_campaign: UNC2975 malvertising campaign
subject_refs:
- NJT-0130
description_zh: Mandiant 观察两条投递链复制/重命名系统 curl，并把 MSI 或 AutoIt executable/script 下载到用户临时目录，随后分别由 msiexec 或 AutoIt 执行。该案例提供
  writer、URL、目标路径和后继执行，不证明受害在下载前已完全受控，因此只用于传输/防御链，不单独锚定 post-compromise 边界。
description_en: Mandiant observed two delivery chains copying or renaming system curl and downloading MSI or AutoIt executable
  and script files into a user temporary directory before execution by msiexec or AutoIt. The case provides writer, URL,
  destination path, and successor execution, but does not independently establish that the victim was fully controlled
  before download, so it supports transfer and defense mechanics rather than the post-compromise boundary alone.
