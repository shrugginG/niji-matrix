description_zh: NCSC 记录 SpecCom 在 HTTP 参数和 HTML 注释中传递任务，依次使用 UTF-16、两层 XOR、Base64 和 URL 编码；样本逆向可恢复 `dir C:\` 命令，命令输出通过另一端点回传。
  样本和沙箱证明实现能力，不提供真实组织中每次任务的完整 PCAP、漏报统计或所有版本的一致性。
description_en: NCSC documents SpecCom passing tasking through HTTP parameters and HTML comments using UTF-16, two XOR
  layers, Base64, and URL encoding; reverse engineering recovers a `dir C:\` command and command output returns through
  another endpoint. Sample and sandbox analysis establish implementation capability but provide no complete PCAP for
  every real-organization task, miss statistics, or consistency across all versions.
