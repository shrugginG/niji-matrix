description_zh: Unit 42 逆向发现数据先加密再用自定义 Base64 字母表编码；解码解密后出现 tick 命令，样本执行系统侦察并把结果上传 C2。 单个样本支持自定义实现与结果链，不证明自定义编码普遍优于标准编码或跨产品防御效果。
description_en: Unit 42 reverse engineering finds data encrypted and then represented through a custom Base64 alphabet;
  decoding and decryption recover a tick command, the sample executes system reconnaissance, and results are uploaded
  to C2. One sample supports a custom implementation and outcome chain but does not establish that custom encoding generally
  outperforms standard encoding or has uniform effects across defensive products.
