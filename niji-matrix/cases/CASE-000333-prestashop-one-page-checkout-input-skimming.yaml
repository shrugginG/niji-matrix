schema_version: 1.0.0
type: case
id: CASE-000333
name_zh: PrestaShop 单页结账输入窃取
name_en: PrestaShop One-Page Checkout Input Skimming
actor_or_campaign: Unattributed PrestaShop skimmer
subject_refs:
- NJT-0220
- NJS-0220-002
description_zh: Sucuri 在受侵 PrestaShop 结账中发现恶意代码藏于合法单页结账制品，覆盖支付表单、监视支付字段变化、把数据送到同站路径及服务端处理器，并把取得的卡数据转发到攻击者服务器。该事件不提供受影响用户数、告警率，也不能证明每位访问者都提交了数据。
description_en: Sucuri found a compromised checkout loading malicious code in a legitimate one-page-checkout asset, an overlaid
  payment form, monitoring of payment-field changes, a same-site receiver path and server handler, and forwarding of stolen
  card data to an attacker-controlled server. Specific site, platform, and observed infection. Reporting does not provide
  affected-user count or alert-rate measurement and does not prove every visitor submitted payment data.
