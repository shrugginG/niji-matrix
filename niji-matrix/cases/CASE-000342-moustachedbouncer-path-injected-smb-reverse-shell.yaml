description_zh: ESET 观察目标网络中的植入定时任务每分钟从 SMB share 读取命令、把输出写回 paired file，并取得截图、PowerShell 和代理插件；研究者判断公网 IP 并非攻击者控制的真实服务，SMB
  回复在 ISP/AitM 路径中即时注入。
description_en: ESET observed scheduled tasks on target networks reading commands from SMB shares every minute, writing output
  to paired files, and obtaining screenshot, PowerShell, and proxy plug-ins. Researchers assess that the public IPs were not
  real actor-controlled services and SMB responses were injected on the ISP or AitM path.
