schema_version: 1.0.0
type: case
id: CASE-000346
name_zh: LightNeuron 以 Exchange Transport Agent 建立邮件门控持久化
name_en: LightNeuron Exchange Transport-Agent Mail-Gated Persistence
actor_or_campaign: Turla LightNeuron activity
subject_refs: [NJT-0225, NJS-0225-001]
description_zh: ESET 分析 LightNeuron 被注册为 Microsoft Exchange Transport Agent 并随传输服务加载；其 rules.xml 按发件人、收件人、主题、附件类型和隐写 PDF/JPG 命令容器选择删除、转发、替换或命令执行。正常邮件继续通过服务器管线，攻击者构造的匹配邮件才恢复恶意功能，直接证明持久组件与请求资格化激活。
description_en: ESET analyzed LightNeuron registered as a Microsoft Exchange Transport Agent and loaded with the transport service. Its rules.xml selected deletion forwarding replacement or command execution by sender recipient subject attachment type and steganographic PDF or JPG command containers. Ordinary mail continued through the server pipeline while attacker-crafted matching messages restored malicious functionality directly establishing a durable component and request-qualified activation.
time_range: Activity reported in 2019 after long-term operation
target_sectors_zh: [外交机构, Exchange Server 环境]
target_sectors_en: [Diplomatic organizations, Exchange Server environments]
evidence_refs: [REF-001159]
confidence: high
status: review
