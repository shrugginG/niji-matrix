schema_version: 1.0.0
type: case
id: CASE-000347
name_zh: IISpy 以隐藏请求关系激活持久 IIS Module
name_en: IISpy Hidden-Request Activation of a Persistent IIS Module
actor_or_campaign: IISpy long-term espionage activity
subject_refs: [NJT-0225, NJS-0225-001]
description_zh: ESET 观察 IISpy 以 native IIS module 写入 ApplicationHost.config 并由 w3wp 自动加载。模块只在 Cookie、Host 与 URL 的特定隐藏关系匹配时解密并执行命令，普通访客请求仍由正常模块处理；其响应又伪装为 PNG，并在 OnLogRequest 阶段改写日志字段。该案例直接证明服务器组件的持久加载、请求资格化激活和普通流量下的正常外观。
description_en: ESET observed IISpy installed as a native IIS module in ApplicationHost.config and automatically loaded by w3wp. The module decrypted and executed commands only when a specific hidden relation among Cookie Host and URL matched while ordinary visitor requests continued through benign modules. It disguised responses as PNG data and rewrote log fields during OnLogRequest. The case directly establishes durable component loading request-qualified activation and ordinary appearance under nonmatching traffic.
time_range: Active since at least 2020-07; report published 2021-08-09
target_sectors_zh: [加拿大、美国和荷兰的 IIS 服务器]
target_sectors_en: [IIS servers in Canada the United States and the Netherlands]
evidence_refs: [REF-001160]
confidence: high
status: review
