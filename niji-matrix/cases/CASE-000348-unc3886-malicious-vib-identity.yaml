schema_version: 1.0.0
type: case
id: CASE-000348
name_zh: UNC3886 恶意 VIB 的跨重启接入与 PartnerSupported 身份伪装
name_en: UNC3886 Malicious VIB Reboot Persistence and PartnerSupported Identity Masquerade
actor_or_campaign: UNC3886 VIRTUALPITA and VIRTUALPIE activity
subject_refs: [NJT-0225, NJS-0225-002]
description_zh: Mandiant 在 ESXi 入侵中发现攻击者用恶意 VIB 安装 VIRTUALPITA 与 VIRTUALPIE，并由 VIB payload 创建每次启动执行的任务和后门文件。攻击者把 descriptor acceptance-level 从 community 改为 partner，并以 --force 安装；普通 VIB 列表显示 PartnerSupported，而 signature verify 揭示签名不可用。该中心事实独立于 CASE-000071 的来宾命令来源，直接证明持久服务器组件与信任身份 metadata 差分。
description_en: Mandiant found malicious VIBs installing VIRTUALPITA and VIRTUALPIE on ESXi and using VIB payloads to create startup execution and backdoor files on every boot. The actor changed descriptor acceptance level from community to partner and installed with force. Ordinary VIB inventory displayed PartnerSupported while signature verification exposed unavailable signatures. This central fact is distinct from CASE-000071 guest-command provenance and directly establishes a durable server component and trust-identity metadata differential.
time_range: Activity investigated in 2022; report published 2022-09-28
target_sectors_zh: [运行 VMware ESXi 的战略组织]
target_sectors_en: [Strategic organizations operating VMware ESXi]
evidence_refs: [REF-000208]
confidence: high
status: review
