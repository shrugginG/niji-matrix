schema_version: 1.0.0
type: case
id: CASE-000349
name_zh: VS Code Marketplace 仿冒扩展与四万五千次恶意安装
name_en: VS Code Marketplace Impersonating Extensions and More Than 45K Malicious Installs
actor_or_campaign: Malicious VS Code Marketplace extensions disclosed by Check Point
subject_refs: [NJT-0226, NJS-0226-001]
description_zh: Check Point 在 VS Code Marketplace 发现多项恶意扩展，总安装量超过四万五千；`prettiest java` 以 Java helper 外观和近似命名模仿 Prettier-Java，其他扩展窃取 PII 或建立远程 shell。研究者向 Microsoft 报告后这些扩展被移除。案例直接证明新的精确扩展身份可借相似名称、功能预期和官方市场外观获得安装。
description_en: Check Point found malicious VS Code Marketplace extensions with more than forty-five thousand total installs. Prettiest java presented as a Java helper and used naming similar to Prettier-Java while other extensions stole PII or enabled remote shells. Microsoft removed the extensions after disclosure. The case directly establishes a new exact extension identity gaining installation through a similar name expected function and official-marketplace appearance.
time_range: Report published 2023-05-16
target_sectors_zh: [使用 Visual Studio Code 的开发者和组织]
target_sectors_en: [Developers and organizations using Visual Studio Code]
evidence_refs: [REF-001166]
confidence: high
status: review
