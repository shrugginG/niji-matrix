schema_version: 1.0.0
type: case
id: CASE-000350
name_zh: KREMLIN 带外写入 Secure Preferences 建立扩展状态
name_en: KREMLIN Out-of-Band Secure-Preferences Extension Registration
actor_or_campaign: KREMLIN browser-extension malware
subject_refs: [NJT-0226, NJS-0226-002]
description_zh: Elastic 对 KREMLIN 样本和实验环境的分析显示，恶意程序在浏览器关闭或用户空闲后写入扩展目录与 Secure Preferences，重新生成 HMAC 和 App-Bound hash 并注册扩展；随后 Chrome 启动加载该状态并执行页面读取、请求拦截和注入能力。该中心事实不同于 CASE-000196 的页面内容取得，直接证明绕过普通交互安装链的持久扩展注册。
description_en: Elastic sample and lab analysis showed KREMLIN writing the extension directory and Secure Preferences after browser closure or user idleness regenerating HMAC and App-Bound hashes and registering the extension. A later Chrome start loaded that state and executed page-reading request-interception and injection capability. This central fact differs from CASE-000196 page-content acquisition and directly establishes durable extension registration outside the ordinary interactive installation chain.
time_range: Sample and lab analysis published in 2026
target_sectors_zh: [Chromium 浏览器用户]
target_sectors_en: [Chromium browser users]
evidence_refs: [REF-000578]
confidence: high
status: review
