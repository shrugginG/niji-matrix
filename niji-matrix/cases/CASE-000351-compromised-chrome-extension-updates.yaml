schema_version: 1.0.0
type: case
id: CASE-000351
name_zh: 2024 年多项 Chrome 扩展被注入恶意更新
name_en: 2024 Malicious Updates Injected into Multiple Chrome Extensions
actor_or_campaign: Late-2024 Chrome extension developer-account compromise campaign
subject_refs: [NJT-0226, NJT-0059, NJS-0059-001]
description_zh: 新加坡网络安全局通告记录 Cyberhaven 等多项既有 Chrome 扩展被注入恶意代码，更新后的扩展可窃取认证会话和 Cookie。事件利用既有扩展身份和安装基数把恶意版本送达目标；供应方/发布链污染由 NJT-0059 与 NJS-0059-001 拥有，而目标上被宿主持续加载的扩展状态由 NJT-0226 承接。
description_en: Singapore's Cyber Security Agency advisory recorded malicious code injected into multiple existing Chrome extensions including Cyberhaven with updated extensions capable of stealing authenticated sessions and cookies. The event used established extension identities and installed bases to deliver malicious versions. NJT-0059 and NJS-0059-001 own publisher or release-chain compromise while NJT-0226 carries the host-loaded durable extension state on targets.
time_range: Campaign disclosed in 2024-12
target_sectors_zh: [Chrome 扩展用户与企业环境]
target_sectors_en: [Chrome extension users and enterprise environments]
evidence_refs: [REF-001170]
confidence: high
status: review
