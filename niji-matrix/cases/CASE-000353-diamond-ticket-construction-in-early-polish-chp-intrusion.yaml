schema_version: 1.0.0
type: case
id: CASE-000353
name_zh: 波兰CHP早期入侵中的Diamond票据构造
name_en: Diamond Ticket Construction in Early Polish CHP Intrusion
actor_or_campaign: Unattributed early-2025 activity at the CHP organization described by CERT Polska
subject_refs:
- NJT-0228
- NJS-0228-003
description_zh: CERT Polska在针对大型CHP供热发电设施的早期入侵调查中，依据Windows与EDR证据记录了2025年3至7月的活动，并明确称攻击者使用Rubeus构造Diamond Ticket。报告未披露精确票据字段、相关签名秘密取得链、该票据的服务接受或规避结果；它也说明无法完全确认早期活动与年底破坏活动由同一攻击者实施。
description_en: CERT Polska describes March–July 2025 early intrusion activity at a large CHP organization using Windows and EDR evidence
  and explicitly records Rubeus creation of a Diamond Ticket. The report does not disclose exact ticket fields, the related signing-secret
  acquisition chain, service acceptance of that ticket, or evasion outcomes. It also states that it could not fully confirm one actor across
  the early activity and year-end destructive activity.
time_range: 2025-03/2025-07
