schema_version: 1.0.0
type: case
id: CASE-000354
name_zh: Midnight Blizzard 从外传微软邮件发现并尝试使用秘密
name_en: Midnight Blizzard Finds and Attempts to Use Secrets from Exfiltrated Microsoft Email
actor_or_campaign: Midnight Blizzard
subject_refs:
- NJT-0229
- NJS-0229-001
description_zh: 微软在 2024 年 3 月 8 日披露，Midnight Blizzard 正在使用最初从企业邮件系统外传的信息来取得或尝试取得未授权访问，并尝试使用所发现的不同类型秘密，其中一些曾在客户与微软的邮件中共享。该案只将外传邮件、共享秘密及尝试使用相连；不推断具体秘密格式、查询命令、逐项有效性或每次内部访问的材料来源。
description_en: On March 8, 2024 Microsoft disclosed that Midnight Blizzard was using information initially exfiltrated from corporate email
  to gain or attempt unauthorized access and was attempting to use different secrets it found, some shared between customers and Microsoft
  in email. The case links exfiltrated mail, shared secrets, and attempted use only, without inferring exact formats, queries, per-item validity,
  or the material source for each internal access.
time_range: January–March 2024; findings disclosed 2024-03-08
