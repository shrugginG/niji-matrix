name_zh: Bradley 记录的 macOS 入侵 SSH 公告浏览
name_en: SSH Advertisement Browsing in Bradley's macOS Intrusion Account
actor_or_campaign: Unnamed macOS intrusion described by Jaron Bradley
subject_refs:
- NJT-0234
- NJS-0234-001
description_zh: Bradley 在 2020 年回顾其 2018 年已公开的 macOS 入侵研究，记录攻击者运行 dns-sd -B _ssh._tcp . 查找发布 SSH 服务的系统。该段说明操作依赖服务公告而不是逐端口扫描；未披露完整响应、端点解析结果、所有后继连接或具体检测效果，不能推断整个入侵没有其他扫描。
description_en: In a 2020 retrospective on macOS intrusion research presented publicly in 2018, Bradley records the adversary
  running dns-sd -B _ssh._tcp . to browse systems advertising SSH. The passage describes an advertisement rather than per-port
  scan operation. It omits complete responses, endpoint-resolution results, all successor connections and detector outcomes;
  it does not establish absence of other scans throughout the intrusion.
time_range: Activity presented publicly in 2018; incident dates undisclosed; retrospective published 2020-03-12
