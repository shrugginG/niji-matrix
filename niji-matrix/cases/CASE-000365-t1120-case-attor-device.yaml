description_zh: ESET 对 Device monitor 插件的逆向记录创建窗口、注册 Shell 介质变更并处理 WM_DEVICECHANGE，随后取得接入设备的身份及接口信息，并对 COM 设备进行指纹查询。该事件支持通知后设备事实获取；容量、文件元数据、TrueCrypt
  驱动及音频或截图归各自事实层级，不从插件能力推出每台受害主机的成功或匿迹效果。
description_en: ESET reverse engineered the Device monitor plug-in creating a window, registering Shell media-change notifications,
  handling WM_DEVICECHANGE, and then obtaining attached-device identity and interfaces, including fingerprint queries for
  COM devices. This supports device facts following notification. Capacity, file metadata, TrueCrypt-driver information, audio,
  and screenshots have separate fact boundaries; plug-in capability does not establish per-victim success or stealth effectiveness.
