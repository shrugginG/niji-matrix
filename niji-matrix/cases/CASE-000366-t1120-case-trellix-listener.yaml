id: CASE-000366
name_zh: Monero 集群控制器以通知识别新接入介质
name_en: Monero-Cluster Controller Identifies Arriving Media Through Notifications
actor_or_campaign: Unnamed Monero mining infection cluster analyzed by Trellix
subject_refs:
- NJT-0238
- NJS-0238-001
description_zh: Trellix 对 2025 年末发现的感染集群进行样本分析，记录控制器建立隐藏窗口和设备到达处理，识别新介质后进入独立传播逻辑。作者明确将监听与轮询噪声对照。案例只支持该设计及设备识别链，不证明每次传播成功、操作者身份或检测下降；接口注册和卷广播须按官方合同分别解释。
description_en: Trellix analyzed samples from an infection cluster identified in late 2025 and documented a controller using
  a hidden window and device-arrival handling before separate propagation logic. The author explicitly contrasts listening
  with polling noise. The case supports the design and identification chain rather than per-attempt propagation success, operator
  identity, or reduced detection. Interface registration and volume broadcasts require separate interpretation under official
  contracts.
time_range: Infection cluster identified in late 2025; report published 2026-02-17
