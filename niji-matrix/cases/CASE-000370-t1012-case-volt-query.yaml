description_zh: 联合调查公告 AA24-038A 在 Discovery 段将 reg query 列入 Volt Typhoon 使用的就地取材命令。此案例只保存原生 Registry 查询用于环境发现的现场观察，不把同列的
  reg save、凭据 hive 拷贝、SOHO 来源、存储属性发现或防御设置修改并入中心事实。报告未公开查询路径、返回值、每台主机时间线或执行器对照，不能支持进程内子项、特定视图选择或单次成功取数。 公告的汇总命令列表仅证明这种查询实现被使用，不能确定其每次直接信息目的；专门软件等结果不由本案例重复认定为一般配置结果。
description_en: Joint advisory AA24-038A lists reg query among Volt Typhoon's living-off-the-land commands in Discovery. This
  case retains only the field observation of native Registry querying for environmental discovery. Its central facts exclude
  reg save in the same list, credential-hive copying, SOHO origin, storage-attribute discovery, and defensive-setting modification.
  The report does not publish query paths, values, per-host timelines, or executor comparisons and cannot establish the in-process
  child, a particular view choice, or successful acquisition in one query. The aggregate command list establishes use of the
  query implementation rather than every immediate information objective. Specific software or other specialized results are
  not reclassified by this case as general configuration results.
