description_zh: ESET 对在乌克兰部署的 HermeticWizard 分析记录先使用一组 Windows 函数取得已知本地 IP，再对地址连接确认，并可根据启动参数扩展范围。GetIpNetTable 的已有映射读取支持本地复用阶段，其他枚举
  API 及后继探测另计；报告没有声称整个发现过程无网络或所有旧记录均可达。
description_en: ESET's analysis of HermeticWizard deployed in Ukraine records known local IP gathering through several Windows
  functions, followed by connection checks and optional expansion controlled by launch arguments. Existing-map retrieval through
  GetIpNetTable supports a local reuse stage; other enumeration APIs and later probes are accounted for separately. The report
  does not establish network silence for the entire discovery process or reachability of every old record.
