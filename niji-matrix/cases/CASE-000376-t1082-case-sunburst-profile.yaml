name_zh: SUNBURST 的 OS 版本画像能力
name_en: SUNBURST OS-Version Profiling Capability
actor_or_campaign: SUNBURST / SolarWinds compromise
subject_refs:
- NJT-0244
description_zh: Mandiant 的原始逆向分析说明木马化 Orion 插件的命令3 CollectSystemDescription 包含 OS version 画像。该案例只确认分析样本的系统属性能力；同一命令中的用户名、MAC、IP
  与 DHCP 由各自对象处理，不推断每台受害主机均执行此命令或查询成功规避了检测。
description_en: Mandiant's original reverse engineering describes OS-version profiling in command 3, CollectSystemDescription,
  of the trojanized Orion plugin. The case confirms this system-attribute capability in the analyzed sample only. Username,
  MAC, IP, and DHCP facts in the same command belong to their respective objects, and execution on every victim or successful
  detection evasion is not inferred.
