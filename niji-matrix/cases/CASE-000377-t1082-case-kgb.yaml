description_zh: Group-IB 原始动态分析记录恶意客户端在同次仪器化实验中程序化发起 Win32_OperatingSystem 与 AntiVirusProduct 查询，图10展示查询字符串，图17展示画像消息中报告的
  OS 和安全产品字符串。该中心观察共同支持系统属性与软件存在性画像，不鉴定真实物理 OS，也不证明安全产品运行或启用；主板查询不证明全部字段返回，进程、地理和休眠观察不作为该中心事实。
description_en: Group-IB's original dynamic analysis records a malicious client issuing programmatic Win32_OperatingSystem
  and AntiVirusProduct queries in the same instrumented experiment. Figure 10 shows query strings and Figure 17 shows reported
  OS and security-product strings in a profile message. This central observation supports system-attribute and software-presence
  profiling together, without attesting the actual physical OS or proving a security product running or enabled. The baseboard
  query does not establish return of every field, and process, geographic, and sleep observations are not central facts of
  this case.
