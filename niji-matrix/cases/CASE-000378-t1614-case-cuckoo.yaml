description_zh: Kandji 的 macOS Cuckoo 研究记录样本通过 getenv 读取 LANG、截取区域字符串并比较。报告于 2024 年 4 月发现样本，但没有给这次具体读取提供可独立确认的操作时间，因此本案例不把发现日期写成执行日期。该观察支持语言输入读取实现，既不证明设备物理位置，也不证明此路径的检测率；随后地区条件分支保持执行护栏的独立边界。
description_en: Kandji's macOS Cuckoo analysis records a sample reading LANG through getenv, truncating the regional string
  and comparing it. The sample was discovered in April 2024, but the specific read has no independently established operation
  time, so this case does not turn discovery date into execution date. The observation supports a language-input read implementation
  rather than physical device position or detector performance; the subsequent regional condition retains its separate execution-guardrail
  boundary.
