description_zh: Securelist 对 Crimson Server version A 的原始分析记录控制端以受害 IP 请求定位服务。Team Cymru 随后在 2020 年 12 月至 2021 年 3 月观察特定 C2
  到该服务的连接，并从控制端代码确认新 bot 查询及缓存。案例支持控制端实现及相关网络采用，不补造逐请求返回、设备坐标或地理准确率。
description_en: Securelist's original analysis of Crimson Server version A records controller requests to a location service
  using victim IPs. Team Cymru later observed connections from a particular C2 to the service between December 2020 and March
  2021 and confirmed new-bot lookup and caching in controller code. The case establishes controller implementation and associated
  network use without inventing per-request returns, device coordinates, or geolocation accuracy.
