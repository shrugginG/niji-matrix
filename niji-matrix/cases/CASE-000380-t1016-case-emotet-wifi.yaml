description_zh: Binary Defense 对 worm.exe 的原始样本分析记录其取得无线接口，再使用首个可用接口获取网络列表并保存 SSID、信号和认证相关属性。此例只确认样本实现与已分析行为，不声称所有 bot 都有无线接口、读取了某个实际受害网络或取得了保存的密码。报告中的连接通知用于后继连接猜测反馈，不能作为本例有意以事件替代配置轮询的证据。
description_en: Binary Defense's original worm.exe sample analysis records acquisition of wireless interfaces, use of the
  first available interface to obtain a network list, and storage of SSID, signal, and authentication-related attributes.
  This case establishes the sample implementation and analyzed behavior, not a Wi-Fi adapter on every bot, reads of particular
  victim networks, or acquisition of saved passwords. The reported notifications provide feedback for subsequent connection
  guessing rather than evidence of deliberate event-driven replacement of configuration polling.
