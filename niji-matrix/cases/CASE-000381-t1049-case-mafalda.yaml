description_zh: SentinelLabs 原始研究记录了由 metaMain 承载的 Mafalda 植入体及其命令处理，并在完整报告第 16 页说明命令 63 分别调用 GetAdaptersInfo 取得适配器信息、GetExtendedTcpTable
  取得 TCP 信息、GetIpNetTable 取得 IPv4 与物理地址映射；对应结果以 misc/ifconfig、misc/netstat 和 misc/arp 加时间标签的包发给控制端。此案例统一保存同次综合命令的逆向能力事实，同时区分配置、连接与邻居映射的直接对象，不把传输标签解释为本地落盘。报告未公开逐受害机调用、完整表行或检测器对照，因此不宣称命令在所有部署中已执行，也不量化匿迹收益。
description_en: Original SentinelLabs research describes the Mafalda implant carried by metaMain and its command processing.
  Page 16 of the full report explains command 63 calling GetAdaptersInfo for adapter information, GetExtendedTcpTable for
  TCP information, and GetIpNetTable for IPv4-to-physical-address mappings. Corresponding results are sent to the controller
  as timestamp-labeled misc/ifconfig, misc/netstat, and misc/arp packets. This case unifies reverse-engineered capability
  facts for the same composite command while distinguishing configuration, connection, and neighbor-mapping objects, without
  interpreting transmission labels as local writes. The report publishes no per-victim invocations, complete rows, or detector
  comparison, so execution in every deployment and quantified stealth benefits are not claimed.
