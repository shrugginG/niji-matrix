description_zh: 联合公告 AA24-038A 的附录 A 在印刷页 34 列出 ipconfig 与 netstat -ano，并单独保留误拼的 netstta -ano。此案例统一保存该命令表中的网络配置与连接调查请求事实，各命令仍按直接信息对象分别归属；公告没有证明它们在同一主机或同一次会话连续执行。错误命令不当作成功，未公开的返回状态、表行、精确查询时间和受害行业保持未知，不从这些请求推出非空结果、持续对端可达性、进程内承载或成功规避检测。其他存储、身份、注册表和流量操作不并入本案例。
description_en: Appendix A on printed page 34 of joint advisory AA24-038A lists ipconfig and netstat -ano, separately retaining
  the mistyped netstta -ano. This case unifies network-configuration and connection-inquiry request facts from that command
  table while assigning each command by its direct information object. The advisory does not establish consecutive execution
  on one host or in one session. The typo is not treated as success. Unpublished return status, table rows, exact query times,
  and victim sectors remain unknown, and the requests establish neither nonempty results, continuing peer reachability, in-process
  carriage, nor successful detection evasion. Storage, identity, Registry, and traffic operations remain outside this case.
