description_zh: ESET 原文 info 命令包含当前日期时间，Figure 11 的 getSystemDate 先取得 NSDate 对象，再计算相对于 now 的间隔并构造日期，最终用明确选择 Asia/Shanghai
  的 NSDateFormatter 返回字符串；原文说明随后上报 C2。这里不将相对间隔当 Unix 秒、不推断系统默认时区或物理位置，也不把该格式本身称为匿迹。来源为样本实现，而非逐受害会话的实际返回记录。
description_en: ESET info includes current date-time and Figure 11 getSystemDate obtains an NSDate object computes an interval
  relative to now reconstructs a date and returns a string using NSDateFormatter explicitly set to Asia/Shanghai; the text
  describes reporting to C2. The relative interval is not Unix seconds and establishes neither system default zone nor physical
  location; the format itself is not evasion. This is sample implementation rather than per-victim return evidence.
