description_en: AA24-038A Appendix A logins.ps1 obtains the current DateTime with Get-Date and calls AddDays(-1), consuming
  startDate as the lower bound of subsequent Get-EventLog queries. The case centers on temporal input and explicit consumption
  rather than duplicating later account or log results as temporal outcomes or inferring actual dates returns or victim sectors.
