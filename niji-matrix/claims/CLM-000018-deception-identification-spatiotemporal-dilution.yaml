statement_zh: 若攻击者将针对同一诱捕部署的寿命、同步变化和响应时序比较分布到多个相关节点与多个观察时点，单节点和单窗口可能只保留局部弱信号，而整体真实性画像在攻击者侧形成，因此可能构成时空释痕。
statement_en: If an adversary distributes comparisons of lifetime, synchronized change, and response timing for one deception
  deployment across related nodes and observation points, each node and window may retain only a weak local signal while
  the aggregate authenticity profile forms adversary-side, potentially producing Spatiotemporal Trace Dilution.
