id: CLM-000119
claim_type: mechanism-mapping
statement_zh: 从普通请求字段推断平台或把属性枚举嵌入常见网页脚本，会使恶意主机画像混入兼容性、分析、反欺诈和跟踪活动的高背景流量，降低单事件可区分性。
statement_en: Inferring platforms from ordinary request fields or embedding property enumeration in common web scripts places malicious host profiling within the high-volume background of compatibility, analytics, anti-fraud, and tracking activity, reducing per-event distinguishability.
