statement_zh: 第三方主机观测替代以原始测量主体由攻击者变为数据提供方为稳定变量，使攻击者查询留在提供方而目标侧没有对应的攻击者采集事件，因此构成可独立防守的匿迹子技术。
statement_en: Third-Party Host-Observation Substitution uses a stable change in the original measurement actor from the adversary to a data provider, leaving the adversary's query at the provider and no corresponding adversary collection event at the victim, and therefore forms a separately defensible evasion sub-technique.
