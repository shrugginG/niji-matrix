statement_zh: 环境请求元数据采集以不增加客户端采集消息为稳定变量，仅消费正常请求固有字段并在远端完成画像，使目标侧事件与普通资源访问相同，因此构成独立匿迹子技术。
statement_en: Ambient Request-Metadata Harvesting uses the absence of an added client collection message as its stable variable, consuming only fields inherent in an ordinary request and profiling remotely so the victim-side event remains ordinary resource access, and therefore forms a distinct evasion sub-technique.
