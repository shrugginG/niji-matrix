id: CLM-000126
claim_type: mechanism-mapping
statement_zh: 语义有效的登录、注册、恢复或 MFA 请求可以通过响应差异泄露身份状态，而单条记录表现为普通失败或未完成事务，使恶意属性推断难以从局部事件中区分。
statement_en: Semantically valid login, registration, recovery, or MFA requests can disclose identity state through response differences while individual records appear as ordinary failures or incomplete transactions, making malicious attribute inference difficult to distinguish locally.
subject_refs: [NJT-0033, NJS-0033-002]
