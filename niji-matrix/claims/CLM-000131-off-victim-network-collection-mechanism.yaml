statement_zh: 复用第三方网络测量或查询非受害方注册、透明度与路由基础设施，会把攻击者的主要网络画像活动移出目标业务与应用遥测，使防守方只能从提供方记录、公开暴露和后续使用反推采集。
statement_en: Reusing third-party network measurements or querying non-victim registration, transparency, and routing infrastructure moves primary adversary network profiling outside target business and application telemetry, leaving defenders to infer collection from provider records, public exposure, and downstream use.
