statement_zh: 公共控制面旁路查询以网络事实由注册、证书透明度或路由基础设施例行发布为稳定变量，使查询终止于非受害方服务并避免目标业务端点出现对应请求，因此构成独立匿迹子技术。
statement_en: Public Control-Plane Off-Target Querying uses routine publication of network facts by registration, certificate-transparency, or routing infrastructure as its stable variable, terminating queries at non-victim services and avoiding corresponding requests to victim business endpoints, and therefore forms a distinct evasion sub-technique.
