statement_zh: 通过电子社会工程直接诱导人员披露凭据、验证码、联系人、财务或运营信息是独立侦查行为，其即时结果是数据而非代码执行或访问，因此 T1598 应保留且不得按投递媒介拆分。
statement_en: Directly eliciting credentials, verification codes, contacts, financial data, or operational information through electronic social engineering is a distinct reconnaissance behavior whose immediate result is data rather than code execution or access, so T1598 warrants retention without partitioning by delivery medium.
