statement_zh: 受害者发布导航工件替代以只请求公开链接、sitemap 或 robots 工件已揭示的路径为稳定变量，用少量确定性成功请求替代猜测式高扇出与错误响应，因此构成独立匿迹子技术。
statement_en: Victim-Published Navigation-Artifact Substitution uses requests limited to paths revealed by public links, sitemaps, or robots artifacts as its stable variable, replacing speculative high fan-out and error responses with a few deterministic successful requests and therefore forming a distinct evasion sub-technique.
