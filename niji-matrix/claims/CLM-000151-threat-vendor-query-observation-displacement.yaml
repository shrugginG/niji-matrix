statement_zh: 威胁情报查询通常发生在目标组织视野之外，使受害方无法直接知道攻击者已获知哪些检测与归因信息，而平台账户、查询和导航日志仍为服务商保留集中观察面。
statement_en: Threat-intelligence queries usually occur outside victim visibility, preventing the victim from knowing directly which detection and attribution information the adversary has learned while provider account, query, and navigation logs retain a concentrated service-side vantage.
