statement_zh: 威胁主体确实使用公共 AI 服务研究人员、组织、技术和商业关系，但只有 AI 对公开材料产生实质聚合、推理、转换或生成并替代直接或逐源查询时才改变侦查痕迹，因此 T1682 应以公共 AI 中介范围适配保留。
statement_en: Threat actors do use public AI services to research people, organizations, technologies, and business relationships, but reconnaissance traces change only when AI materially aggregates, infers, transforms, or generates over public material and substitutes for direct or source-by-source queries, so T1682 should be retained with a public-AI mediation adaptation.
