claim_type: mechanism-mapping
statement_zh: 公共 AI 使用模型知识、索引或服务商检索替代攻击者的直接目标访问和逐源查询时，实际消费者痕迹迁移到服务商账户、提示、响应和工具调用上下文，降低受害方直接可见性但保留平台检测机会。
statement_en: When public AI uses model knowledge, indexes, or provider retrieval to substitute for adversary direct victim access and source-by-source queries, actual-consumer traces move into provider account, prompt, response, and tool-invocation context, reducing victim visibility while retaining provider detection opportunities.
