id: CLM-000158
claim_type: technique-boundary
statement_zh: 公共 AI 中介降低受害者侧实际消费者可见性，但服务商可能保留账户、提示、响应、分类器和工具调用记录，且生成式 AI 输出存在虚构与信息完整性限制，因此该技术既不能描述为不可检测，也不能把未经验证输出视为目标事实。
statement_en: Public-AI mediation reduces victim-side visibility of the actual consumer, but providers may retain account, prompt, response, classifier, and tool-invocation records and generative-AI output has confabulation and information-integrity limits, so the technique is neither undetectable nor a basis for treating unverified output as victim fact.
