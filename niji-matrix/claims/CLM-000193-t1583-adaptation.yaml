statement_zh: 攻击者以非攻陷方式取得合法云、Web、域名、服务器和其他基础设施时，可以通过共享信任表面、预用生命周期和替换资源设计改变可见归属与流量背景；将范围限制为具有明确匿迹设计的取得与预置后，T1583 应适配保留。
statement_en: When adversaries obtain legitimate cloud, Web, domain, server, and other infrastructure without compromise, shared trust surfaces, pre-use lifecycle, and replacement-resource design can change visible attribution and traffic background; T1583 should be retained after adaptation to acquisition and prepositioning with an explicit stealth design.
