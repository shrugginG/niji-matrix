statement_en: Keeping infrastructure at low activity after acquisition and delaying malicious activation causes the resource to leave the newly registered window before use while separating registration from activation, weakening reputation judgments based only on age and forming a distinct Spatiotemporal Trace Dilution and Feature Disguise implementation.
