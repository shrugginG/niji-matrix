statement_en: Compromised transfer paths dynamically inject malicious content while origins remain normal. Stealth-oriented actors can change entry traces through the listed stable behavioral
  variables, so the candidate is retained. This supports Content Injection as a distinct parent technique under TA0001 with scope ending at the first foothold.
