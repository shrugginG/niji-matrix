statement_zh: 用户按正常浏览习惯访问网站时，通过可信页面寄生、选择性交付、维护提示或重定向链取得入口。 高隐蔽主体可通过所列稳定行为变量改变入口痕迹，因此适配保留。该结论支持在 TA0001 下以可信浏览触发的隐蔽入侵作为独立父技术，并将范围限制在首个立足点。
statement_en: Gain entry during ordinary browsing through trusted-page parasitism, selective delivery, maintenance prompts, or redirect chains. Stealth-oriented actors can change entry
  traces through the listed stable behavioral variables, so the candidate is retained as adapted. This supports Covert Compromise via Trusted Browsing as a distinct parent technique
  under TA0001 with scope ending at the first foothold.
