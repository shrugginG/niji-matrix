statement_zh: 攻击者可以通过外部 VPN、RDP、VDI 或远程管理服务建立首个被目标接受的会话，并以活动会话状态重放或用户风险情境贴合改变入口痕迹；Heartbleed、DEV-0537 与住宅代理活动直接支持 NJT-0055 在 TA0001 下适配保留。
statement_en: Adversaries can establish a first target-accepted session through external VPN, RDP, VDI, or remote-management services and change entry traces through active-session-state replay or user-risk-context alignment. Heartbleed, DEV-0537, and residential-proxy activity directly support adapted retention of NJT-0055 under TA0001.
