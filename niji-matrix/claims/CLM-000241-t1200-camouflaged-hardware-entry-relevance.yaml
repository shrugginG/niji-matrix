statement_en: Physically introduce active hardware and reduce discovery or chain reconstruction through environmental camouflage or out-of-band backhaul. Stealth-oriented actors can
  change entry traces through the listed stable behavioral variables, so the candidate is retained as adapted. This supports Camouflaged Hardware Entry as a distinct parent technique
  under TA0001 with scope ending at the first foothold.
