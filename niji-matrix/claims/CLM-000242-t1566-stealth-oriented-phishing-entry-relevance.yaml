statement_zh: 主动发送电子社会工程并通过线程、会话节奏、条件揭示、实时认证或可信工作流取得入口。 高隐蔽主体可通过所列稳定行为变量改变入口痕迹，因此保留。该结论支持在 TA0001 下以匿迹型钓鱼入口作为独立父技术，并将范围限制在首个立足点。
statement_en: Actively send electronic social engineering and gain entry through threads, conversation cadence, conditional reveal, real-time authentication, or trusted workflows. Stealth-oriented
  actors can change entry traces through the listed stable behavioral variables, so the candidate is retained. This supports Stealth-Oriented Phishing Entry as a distinct parent technique
  under TA0001 with scope ending at the first foothold.
