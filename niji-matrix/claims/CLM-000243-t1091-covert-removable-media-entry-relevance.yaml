statement_en: Enter isolated or ordinary systems through masqueraded removable-media triggers and low-touch self-replication. Stealth-oriented actors can change entry traces through
  the listed stable behavioral variables, so the candidate is retained. This supports Covert Removable-Media Entry as a distinct parent technique under TA0001 with scope ending at the
  first foothold.
