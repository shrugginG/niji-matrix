statement_zh: 在最终接收前操纵产品或交付链，并借可信发行、传递供应关系或选择性激活取得入口。 高隐蔽主体可通过所列稳定行为变量改变入口痕迹，因此保留。该结论支持在 TA0001 下以受信供应链入口作为独立父技术，并将范围限制在首个立足点。
statement_en: Manipulate products or delivery before final receipt and gain entry through trusted release, transitive supply relationships, or selective activation. Stealth-oriented
  actors can change entry traces through the listed stable behavioral variables, so the candidate is retained. This supports Trusted Supply-Chain Entry as a distinct parent technique
  under TA0001 with scope ending at the first foothold.
