statement_zh: 通过邻近中继或无线控制差异连接目标 Wi-Fi 并取得首个通信/认证立足点。 高隐蔽主体可通过所列稳定行为变量改变入口痕迹，因此保留。该结论支持在 TA0001 下以隐蔽无线入口作为独立父技术，并将范围限制在首个立足点。
statement_en: Connect to victim Wi-Fi through a nearby relay or wireless control differential and gain the first communication or authentication foothold. Stealth-oriented actors can
  change entry traces through the listed stable behavioral variables, so the candidate is retained. This supports Covert Wi-Fi Entry as a distinct parent technique under TA0001 with
  scope ending at the first foothold.
