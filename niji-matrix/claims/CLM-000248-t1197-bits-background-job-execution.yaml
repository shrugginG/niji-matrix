statement_zh: BITS 作业能够把文件传输、持久状态和 transferred 或 error 通知程序组合为由 Windows 服务管理的异步执行链；攻击者可借用后台传输外观、服务宿主与跨窗口状态分离降低单点识别和因果归因，因此 T1197 应在 TA0002 下保留为 NJT-0063。
statement_en: BITS jobs can combine file transfer, persistent state, and a transferred- or error-state notification program into an asynchronous execution chain managed by a Windows service. An adversary can borrow background-transfer appearance, service hosting, and cross-window state separation to reduce point detection and causal attribution, supporting retention of T1197 as NJT-0063 under TA0002.
