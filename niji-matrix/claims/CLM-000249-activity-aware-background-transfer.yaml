statement_zh: 活动感知型后台传输执行以攻击者选择 normal 或 low 等后台优先级、网络成本策略和作业属性，使与状态通知或明确后继执行耦合的传输随空闲带宽推进为稳定变量；它改变网络节奏和作业外观，但公开案例通常没有直接陈述攻击者选择优先级的主观目的，因此保持中等置信度。
statement_en: Activity-Aware Background Transfer Execution uses a stable variable in which the adversary selects a background priority such as normal or low, network-cost policy, and job properties so a transfer coupled to state notification or explicit follow-on execution advances with idle bandwidth. It changes network cadence and job appearance, but public cases rarely state the adversary's subjective reason for selecting priority, so confidence remains medium.
