statement_zh: 受信流水线定义注入以攻击者直接增加或修改版本化 workflow/job 定义、使恶意命令成为调度图内正式步骤为稳定变量；其主要可见变化位于定义历史，执行端仍继承正常自动化身份，因此与间接输入和外部贡献入口具有独立边界与防御差异。
statement_en: Trusted Pipeline-Definition Injection uses direct adversary addition or modification of a versioned workflow or job definition so a malicious command becomes a declared step in the scheduled graph. Its primary change lies in definition history while execution inherits the normal automation identity creating a stable boundary and defense difference from indirect inputs and external-contribution entry.
