statement_zh: 间接构建输入激活以主流水线定义保持不变、攻击者改变其会解析或执行的源文件、宏、测试、action、制品或缓存为稳定变量；防守方必须解析实际输入图而不能只审查 workflow，因此该轴具有独立痕迹与控制面。
statement_en: Indirect Build-Input Activation keeps the primary pipeline definition unchanged while the adversary changes source macros tests actions artifacts or caches that it parses or executes. Defenders must resolve the actual input graph rather than inspect only the workflow giving the axis independent traces and controls.
