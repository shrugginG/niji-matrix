statement_zh: 外部贡献情境门控执行以攻击者控制 fork、PR 内容或事件元数据，但只在目标 workflow 采用具权触发器、危险 checkout 或不可信值到执行 sink 的数据流时激活为稳定变量；其低权输入与高权执行跨主体分离，防御重点不同于已合并的内部定义修改。
statement_en: External-Contribution Context-Gated Execution uses adversary-controlled fork pull-request content or event metadata that activates only when the target workflow has a privileged trigger dangerous checkout or untrusted-value flow to an execution sink. Its low-trust input and high-trust execution are separated across principals producing a defense focus distinct from merged internal definition changes.
