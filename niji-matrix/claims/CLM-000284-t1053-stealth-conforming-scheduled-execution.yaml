statement_zh: 计划任务/作业把攻击者命令登记为由系统调度器在未来时间或事件条件下启动的对象，使创建与执行可跨观察窗口、载荷继承受信调度器父级，并允许名称、状态与生命周期被有意塑造；这些变化影响识别和关联，支持在 TA0002 下保留为匿迹技术。
statement_en: Scheduled Task or Job registers adversary commands for a system scheduler to start under future time or event conditions allowing creation and execution to cross observation windows payloads to inherit trusted scheduler parentage and names state and lifecycle to be deliberately shaped. These changes affect detection and correlation and support retention as a stealth technique under TA0002.
