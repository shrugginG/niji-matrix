statement_zh: 观察窗口外延期激活以攻击者把任务注册与首次关键执行安排在沙箱、triage 或默认 SIEM 关联窗口之外为稳定变量，检测需要长周期保留与按任务身份跨重启关联，独立于短驻 create-run-delete 和持续隐藏对象。
statement_en: Observation-Window-Deferred Activation deliberately places registration and first critical execution outside sandbox triage or default SIEM correlation windows. Detection requires long retention and task-identity correlation across reboots and is distinct from short-lived create-run-delete transactions and persistently hidden objects.
