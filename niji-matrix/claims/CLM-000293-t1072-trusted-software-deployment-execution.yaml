statement_zh: 软件部署工具允许攻击者从企业管理控制面向已有 agent 提交包、脚本或命令并在受管端点执行，局部进程继承受信 agent 与系统账户且一个 job 可跨 fleet 分散结果；这些来源和聚合断点改变防守观察，支持在 TA0002 下保留为匿迹技术。
statement_en: Software Deployment Tools let adversaries submit packages scripts or commands from an enterprise management control plane to existing agents for execution on managed endpoints. Local processes inherit trusted agents and system accounts while one job can disperse outcomes across a fleet. These provenance and aggregation breaks change defender observation and support retention as a stealth technique under TA0002.
