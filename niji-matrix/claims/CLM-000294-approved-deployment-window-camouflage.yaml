statement_zh: 受信管理 Agent 命令代理以中央 operator/job 经已部署 agent 转换为本地 SYSTEM 或管理账户子进程、端点缺少直接攻击者会话为稳定变量，检测必须回连控制面主体、package/script 与 agent receipt；APT32 ePO 和 AvosLocker PDQ 提供直接案例。
statement_en: Trusted Management-Agent Command Brokerage uses a central operator or job converted through an installed agent into a local SYSTEM or management-account child process without a direct adversary session on the endpoint. Detection must reconnect control-plane principal package or script and agent receipt and APT32 ePO and AvosLocker PDQ provide direct cases.
