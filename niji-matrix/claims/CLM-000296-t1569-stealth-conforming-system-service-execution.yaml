statement_zh: 系统服务执行让攻击者通过受信 service manager 启动已有或临时服务，载荷继承管理器/系统账户谱系，且 create/start/delete 可压缩为短事务；这些来源和生命周期变化改变防守观察，支持在 TA0002 下保留为匿迹技术。
statement_en: System Services Execution lets adversaries use trusted service managers to start existing or temporary services so payloads inherit manager and system-account lineage and create start delete can compress into short transactions. These provenance and lifecycle changes affect defender observation and support retention under TA0002.
