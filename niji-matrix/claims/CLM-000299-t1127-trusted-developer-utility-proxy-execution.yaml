statement_zh: 受信开发 utility 可解释攻击者 project、manifest 或 build input 并以 Microsoft 签名身份编译、加载或启动代码，甚至把 inline source 编译为进程内 task assembly；这改变应用控制、父进程和制品可见性，支持在 TA0002 下保留为匿迹技术。
statement_en: Trusted developer utilities can interpret adversary projects manifests or build inputs and compile load or launch code under Microsoft-signed identity and may compile inline source into in-process task assemblies. This changes application-control parent-process and artifact visibility and supports retention as a stealth technique under TA0002.
