statement_zh: WMI 把本地或远程 client 的 namespace/class/method 请求交给 WMI service/provider 并由 Wmiprvse 等主体产生进程或动作，可打断原始父子谱系并与常见管理调用共享特征；这些变化支持在 TA0002 下保留为匿迹技术。
