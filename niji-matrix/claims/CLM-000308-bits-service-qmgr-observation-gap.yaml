statement_zh: BITS 在服务宿主中管理作业，把命令、文件、所有者和状态保存在 QMGR 数据库，并依据 transferred 或 error 状态启动通知程序；只观察创建工具、普通启动项或最终进程会遗漏中间作业语义，因此 NJT-0063 成立 NM-BT 行为透明机理。
statement_en: BITS manages jobs in a service host, stores command, file, owner, and state in the QMGR database, and launches a notification program on transferred or error state. Observation limited to the creating tool, conventional autoruns, or final process misses the intermediate job semantics, supporting NM-BT Behavioral Transparency for NJT-0063.
