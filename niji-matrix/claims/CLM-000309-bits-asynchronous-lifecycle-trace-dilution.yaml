statement_zh: BITS 的异步状态机、网络或登录恢复、重试属性和未完成作业寿命可以把创建、传输、错误或完成通知与实际程序启动分散到不同会话和重启周期，因此 NJT-0063 与 NJS-0063-002 成立 NM-ST 时空释痕机理。
statement_en: The BITS asynchronous state machine, network or logon recovery, retry properties, and unfinalized job lifetime can disperse creation, transfer, error or completion notification, and actual program launch across sessions and reboots, supporting NM-ST Spatiotemporal Trace Dilution for NJT-0063 and NJS-0063-002.
