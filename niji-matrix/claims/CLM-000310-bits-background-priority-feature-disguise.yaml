statement_zh: 攻击者能够选择 BITS 后台优先级和作业属性，使传输随空闲带宽与网络成本推进并共享更新器、同步软件和系统服务的外观；该选择降低恶意作业的单点可区分性，因此支持 NJT-0063 与 NJS-0063-001 的 NM-FD 特征伪装机理。
statement_en: An adversary can select BITS background priority and job properties so transfer advances with idle bandwidth and network cost while sharing the appearance of updaters, synchronization software, and a system service. That choice reduces point distinguishability of the malicious job, supporting NM-FD Feature Disguise for NJT-0063 and NJS-0063-001.
