statement_zh: TA0002 下的 NJT-0063 必须包含由 BITS 作业状态通知或同一作业链明确耦合的程序执行；仅使用 BITS 下载、上传或传输文件而没有执行语义的活动不属于本 Execution 对象，并应与 T1053 调度、T1569 服务启动和 T1059 解释器执行分开。
statement_en: Under TA0002, NJT-0063 requires program execution through BITS job-state notification or execution explicitly coupled to the same job chain. BITS download, upload, or transfer without execution semantics is outside this Execution object and remains distinct from T1053 scheduling, T1569 service launch, and T1059 interpreter execution.
