statement_zh: BITS 执行检测需要按作业 GUID 和所有者关联创建或修改调用、文件与 URL、优先级、通知标志与命令、状态转换、BITS 网络活动和后继进程；bitsadmin 命令行本身只能提供部分覆盖，COM、事件和 QMGR 数据用于补足来源与长周期状态。
statement_en: Detection of BITS execution requires correlation by job GUID and owner across creation or modification invocation, files and URLs, priority, notification flags and command, state transitions, BITS network activity, and successor process. Bitsadmin command line alone provides only partial coverage; COM, event, and QMGR data complete provenance and long-horizon state.
