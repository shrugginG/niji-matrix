id: CLM-000313
claim_type: mitigation
statement_zh: 限制能够创建或修改 BITS 作业的主体、缩短不必要的作业寿命、约束 BITS 网络目的地、审计通知程序并清理未经批准的未完成作业，可以减少攻击者建立后台状态触发执行的机会并缩短因果链保留时间，但不能安全地一律禁用 BITS。
statement_en: Restricting principals that can create or modify BITS jobs, shortening unnecessary job lifetime, constraining BITS network destinations, auditing notification programs, and removing unapproved unfinalized jobs reduces opportunities for background state-triggered execution and shortens causal persistence, but BITS cannot safely be disabled universally.
