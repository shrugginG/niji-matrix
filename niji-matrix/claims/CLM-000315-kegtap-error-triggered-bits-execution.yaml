statement_zh: Mandiant 在医疗相关事件响应中观察到一个名为 System update 的 normal-priority BITS 作业使用不存在的本地 URL 进入错误状态，并通过通知命令启动 KEGTAP；BITS-Client 事件和 QMGR 数据共同恢复了作业、命令、文件、用户与状态关系。
statement_en: During healthcare-related incident response, Mandiant observed a normal-priority BITS job named System update use a nonexistent local URL to enter error state and launch KEGTAP through its notification command. BITS-Client events and QMGR data jointly recovered job, command, file, user, and state relationships.
