statement_zh: 身份控制面记录凭据或授权状态变更，而登录、令牌和资源面记录后续使用；只有连接变更主体、目标主体、被改变的访问边与后续访问，才能恢复完整持久化因果，因此 NJT-0083 与 NJS-0083-001 成立 NM-BT 行为透明机理。
statement_en: The identity control plane records credential or authorization-state mutation while sign-in, token, and resource planes record later use. Complete persistence causality requires joining the changing actor, target principal, changed access edge, and subsequent access, supporting NM-BT Behavioral Transparency for NJT-0083 and NJS-0083-001.
