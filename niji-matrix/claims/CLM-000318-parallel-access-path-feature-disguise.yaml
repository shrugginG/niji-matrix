statement_zh: 向既有身份增补并行凭据或认证方法而不移除原认证器，会让后续恶意与合法使用共享同一账户或服务主体标识；新认证器仍可见，但基于新账户、停用或主凭据替换的粗粒度判据失去区分力，因此成立中等置信度 NM-FD 特征伪装机理。
statement_en: Adding a parallel credential or authentication method to an existing identity without removing the original authenticator causes
  later malicious and legitimate use to share one account or service-principal identifier. The new authenticator remains visible, but coarse criteria
  based on account creation, disablement, or primary-credential replacement lose discrimination, supporting medium-confidence NM-FD Feature Disguise.
