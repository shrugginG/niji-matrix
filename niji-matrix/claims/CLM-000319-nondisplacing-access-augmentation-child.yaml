statement_zh: 并行认证路径增补以“新增可独立建立同一主体的认证器，同时保留原认证器”为稳定变量；它产生认证器状态差异、认证器级首次使用与全认证路径撤销需求，和授权图、设备信任、新身份创建及未修改有效账户使用不同，因此可作为 T1098 的一项 Niji 原生子技术。
statement_en: Parallel Authentication-Path Augmentation uses the stable variable of adding an authenticator that can independently establish the
  same principal while preserving the original authenticator. Its authenticator-state difference, authenticator-level first-use, and all-authenticator
  revocation requirements differ from authorization graph, device trust, new-identity creation, and unmodified valid-account use, supporting a
  Niji-native child of T1098.
