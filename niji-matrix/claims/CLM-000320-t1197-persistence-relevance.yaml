id: CLM-000320
claim_type: technique-relevance
statement_zh: BITS 作业可在 Complete 或 Cancel 前保留非最终状态、重试与通知程序，并已被直接观察用于跨重启或错误状态反复启动恶意程序；这种持久状态能够在原会话或创建者进程结束后恢复执行，因此 NJT-0063 除 TA0002 外也独立适用于 TA0003。
statement_en: A BITS job can retain non-final state, retry, and a notification program until Complete or Cancel and has been directly observed launching malware across reboot or repeatedly from error state. This durable state can restore execution after the original session or creator process ends, making NJT-0063 independently applicable to TA0003 as well as TA0002.
