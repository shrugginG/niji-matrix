statement_zh: 攻击者控制由操作系统在启动或登录时消费的持久配置、注册或描述符，可以让程序在当前进程退出、用户重新登录或主机重启后自动恢复，因此 T1547 在 TA0003 下构成独立的生命周期激活映射对象。
statement_en: Adversary control of durable configuration, registration, or a descriptor consumed by the operating system at boot or logon can automatically restore a program after the current process exits, the user signs in again, or the host reboots, making T1547 a distinct lifecycle-activation mapping object under TA0003.
