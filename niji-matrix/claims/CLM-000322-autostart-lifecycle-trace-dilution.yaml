statement_zh: 持久自启动状态在一个时点被写入，而代码只在后续启动或登录生命周期中被激活；短期进程监控会失去写入来源，单次状态快照又不能证明后续结果，因此 NJT-0084 成立中等置信度 NM-ST 时空释痕机理。
statement_en: Durable autostart state is written at one point while code activates only during a later boot or logon lifecycle. Short process windows lose writer provenance and a single state snapshot cannot establish the later outcome, supporting medium-confidence NM-ST Spatiotemporal Trace Dilution for NJT-0084.
