statement_zh: 自启动配置由启动管理器、用户 shell 或注册系统组件在以后读取并创建进程，进程侧显示正常生命周期父体而原写入者留在较早的配置审计；检测需要连接状态变化、生命周期和后继谱系，因此 NJT-0084 成立中等置信度 NM-BT 行为透明机理。
statement_en: Autostart configuration is later consumed by a startup manager, user shell, or registered system component that creates a process, leaving a normal lifecycle parent in process telemetry while the original writer remains in earlier configuration audit. Detection must join state mutation, lifecycle, and successor lineage, supporting medium-confidence NM-BT Behavioral Transparency for NJT-0084.
