statement_zh: Microsoft 两项现场调查直接记录名为 EdgeUpdate 与 MsEdgeMsE 的启动项连接到恶意载荷；更新或浏览器主题描述符与真实目标、签名和软件清单不一致，但会削弱只信任可见名称或常见目录的分类，因此 NJT-0084 与 NJS-0084-001 成立中等置信度 NM-FD 特征伪装机理。
statement_en: Two Microsoft field investigations directly record autostarts named EdgeUpdate and MsEdgeMsE connected to malicious payloads. The update- or browser-themed descriptor is inconsistent with actual target, signature, and software inventory but weakens classification that trusts visible names or common directories, supporting medium-confidence NM-FD Feature Disguise for NJT-0084 and NJS-0084-001.
