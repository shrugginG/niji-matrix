statement_zh: 更新主题自启动描述符伪装以“可见启动项名称或邻近描述符采用更新或常见软件组件主题，但实际激活目标与该主题不一致”为稳定变量，跨 Run 值与启动文件夹快捷方式成立并要求描述符—目标—签名—软件清单一致性检测，因此可作为 T1547 的一项 Niji 原生子技术。
statement_en: Update-Themed Autostart Descriptor Camouflage uses the stable variable of a visible autostart name or adjacent descriptor adopting an update or common-software-component theme while the actual activation target is inconsistent with that theme. It holds across Run values and Startup-folder shortcuts and requires descriptor-target-signature-software-inventory consistency detection, supporting one Niji-native child of T1547.
