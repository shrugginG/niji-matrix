statement_zh: T1547 检测需要把自启动状态创建或修改、变更前后快照、启动或登录边界、后继进程或模块、真实目标完整性以及批准软件清单按主体、设备、描述符和目标关联；只枚举某一个注册表项或只看启动时进程无法覆盖完整因果。
statement_en: Detection of T1547 requires joining autostart-state creation or modification, before-and-after snapshots, boot or logon boundary, successor process or module, actual-target integrity, and approved software inventory by principal, device, descriptor, and target. Enumerating one registry location or viewing only startup-time processes cannot cover complete causality.
