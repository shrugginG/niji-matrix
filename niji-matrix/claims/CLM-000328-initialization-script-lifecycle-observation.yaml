statement_zh: 初始化脚本在一个时点被修改，却由启动或登录宿主在以后解释并产生子进程；短窗口会失去写入者，进程侧显示生命周期解释器，因此 NJT-0085 成立中等置信度 NM-ST 与 NM-BT。
statement_en: An initialization script is modified at one time but interpreted later by a boot or logon host that creates child processes. Short windows lose the writer and process telemetry shows the lifecycle interpreter, supporting medium-confidence NM-ST and NM-BT for NJT-0085.
