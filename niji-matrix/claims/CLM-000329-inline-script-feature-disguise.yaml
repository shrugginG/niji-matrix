statement_zh: 向既有合法初始化脚本插入攻击者命令会保留脚本路径、调用身份和大部分正常内容，使基于新文件或路径的清单失去区分力，而逐版本内容差异仍可恢复恶意行，因此 NJT-0085 与 NJS-0085-001 成立中等置信度 NM-FD。
statement_en: Inserting adversary commands into an existing legitimate initialization script preserves script path, invocation identity, and most normal content, weakening inventories based on new files or paths while versioned content differences still recover malicious lines. This supports medium-confidence NM-FD for NJT-0085 and NJS-0085-001.
