statement_zh: T1037 检测需要关联脚本逐版本内容与元数据、写入主体、boot 或 logon 边界、解释器命令和子进程；只有路径枚举、一次哈希或启动时进程均无法独立判断内联命令及其执行因果。
statement_en: Detection of T1037 requires correlation of versioned script content and metadata, writer, boot or logon boundary, interpreter command, and child process. Path inventory, one hash, or startup-time processes alone cannot establish inline commands and their execution causality.
