statement_zh: 云应用集成的应用对象、同意、权限和凭据可在原账户密码重置或失去访问后继续签发 token 并访问资源，因此 T1671 在 TA0003 下构成独立的持续集成关系对象。
statement_en: Application object, consent, permission, and credential in a cloud integration can continue issuing tokens and accessing resources after the original account password is reset or access is lost, making T1671 a distinct durable-integration relationship under TA0003.
