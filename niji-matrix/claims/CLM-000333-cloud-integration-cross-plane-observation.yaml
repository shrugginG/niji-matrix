statement_zh: 应用注册、同意、权限与凭据变更位于控制面，后续 app-only token 和资源操作位于身份与数据面且可延迟数月；必须按 app、service principal、consenter、scope 与 token 关联，因此 NJT-0086 成立 NM-BT。
statement_en: Application registration, consent, permission, and credential changes occur in control planes while later app-only token and resource operations occur in identity and data planes and may be delayed for months. Correlation by app, service principal, consenter, scope, and token is required, supporting NM-BT for NJT-0086.
