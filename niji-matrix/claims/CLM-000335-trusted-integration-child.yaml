statement_zh: 受信集成拟态以恶意集成模仿已知合法应用的身份或用途并通过同一正常授权流程取得平台 token 为稳定变量，产生应用身份真实性与资源活动关联需求，因此可作为 T1671 的 Niji 子技术。
statement_en: Trusted-Integration Impersonation uses the stable variable of a malicious integration imitating the identity or purpose of a known legitimate application and obtaining a platform token through the same normal authorization flow. It requires application-identity authenticity and resource-activity correlation, supporting a Niji child of T1671.
