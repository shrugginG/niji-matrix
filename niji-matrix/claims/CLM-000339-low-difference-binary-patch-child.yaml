statement_zh: 低差异原位二进制补丁以保留文件路径、尺寸附近特征和绝大多数代码、只改变实现恶意控制所需局部字节为稳定变量，并要求已知良性逐字节或分段完整性比较，因此可作为 T1554 的 Niji 子技术。
statement_en: Low-Difference In-Place Binary Patching preserves file path, approximate size, and most code while changing only local bytes needed for malicious control. It requires known-good byte or segment integrity comparison, supporting a Niji child of T1554.
