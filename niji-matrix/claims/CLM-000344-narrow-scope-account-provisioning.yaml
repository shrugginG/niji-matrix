id: CLM-000344
claim_type: subtechnique-existence
statement_zh: 攻击者创建只获准访问一个服务、资源集合或窄角色的账户，会减少跨服务活动量和权限异常，同时保留实现持久目的所需入口；这形成与一般新账户不同的范围/事件体量变量，支持 NJS-0088-001。
statement_en: Creating an account authorized only for one service, resource set, or narrow role reduces cross-service activity volume and privilege
  anomalies while preserving the entry needed for persistence. This forms a scope and event-volume variable distinct from general account creation,
  supporting NJS-0088-001.
