statement_zh: 通过云或集中管理控制面在目标工作负载内部创建账户，会把创建者和管理操作留在控制面，把新账户对象、认证与资源活动留在来宾或下游系统；跨面关联缺失时来源断裂，支持 NJS-0088-002。
statement_en: Creating an account inside a target workload through a cloud or centralized management plane leaves creator and management operation
  in the control plane while the new account object, authentication, and resource activity reside in the guest or downstream system. Missing cross-plane
  correlation breaks provenance, supporting NJS-0088-002.
