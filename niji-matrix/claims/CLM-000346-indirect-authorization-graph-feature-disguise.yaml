statement_zh: 向既有主体附加角色、组成员关系、委托或资源策略会改变有效授权，而不必改变该主体的认证方法；后续访问仍携带熟悉身份与正常认证特征，粗粒度登录规则难以区分新增权限来源，因此成立中等置信度 NM-FD 特征伪装机理。
statement_en: Attaching a role, group membership, delegation, or resource policy to an existing principal changes effective authorization without
  requiring a change to its authentication method. Later access retains familiar identity and normal authentication features, weakening coarse
  sign-in rules and supporting medium-confidence NM-FD Feature Disguise.
