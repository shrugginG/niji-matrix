statement_zh: 间接授权图增补以“认证状态不变而有效权限经角色、组、委托或策略边扩大”为稳定变量；它要求解析传递授权并把授权变更连接到资源使用，与凭据首次使用和设备注册具有不同数据、检测与恢复要求，因此可作为 T1098 的独立 Niji 子技术。
statement_en: Indirect Authorization-Graph Augmentation uses the stable variable of unchanged authentication state with effective privilege expanded
  through role, group, delegation, or policy edges. It requires transitive authorization resolution and mutation-to-resource-use correlation distinct
  from credential first use and device registration, supporting an independent Niji child of T1098.
