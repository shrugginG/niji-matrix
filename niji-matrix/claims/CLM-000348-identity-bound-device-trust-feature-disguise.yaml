statement_zh: 攻击者把受控设备注册或加入既有身份后，后续令牌和访问可继承已注册、已加入或满足设备条件的信任特征；ATT&CK 与 Microsoft 均记录其持续访问和绕过 MFA/条件访问的用途，因此成立高置信度 NM-FD 特征伪装机理。
statement_en: After an adversary registers or joins a controlled device under an existing identity, later tokens and access can inherit registered,
  joined, or policy-satisfying device trust features. ATT&CK and Microsoft document its use for continued access and bypass of MFA or Conditional
  Access, supporting high-confidence NM-FD Feature Disguise.
