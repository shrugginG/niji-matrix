statement_zh: 身份绑定设备信任附着以“将攻击者控制的设备身份及其信任状态持久关联到既有主体”为稳定变量；其核心证据是设备注册/加入、设备 ID、PRT 与条件访问结果，且恢复必须删除恶意设备并撤销相关令牌，因而与认证路径和授权图子项独立。
statement_en: Identity-Bound Device-Trust Attachment uses the stable variable of durably associating an adversary-controlled device identity and
  trust state with an existing principal. Its core evidence is registration or join, device ID, PRT, and Conditional Access result, and recovery
  must remove the device and revoke related tokens, making it independent from authentication-path and authorization-graph children.
