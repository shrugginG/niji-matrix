statement_zh: 会话恢复队列把目标写入与下次登录的系统恢复执行分开，后继进程表现为正常的“重新打开应用”生命周期结果；ATT&CK 直接记录恶意队列操纵，Apple 说明正常恢复语义，因此成立中等置信度 NM-BT 行为透明机理。
statement_en: A session-restoration queue separates target mutation from system restoration at the next sign-in, leaving the successor process
  as an ordinary reopen-app lifecycle result. ATT&CK directly documents malicious queue manipulation and Apple establishes normal restoration
  semantics, supporting medium-confidence NM-BT Behavioral Transparency.
