statement_zh: 会话恢复队列注入以“攻击者把目标写入正常关闭/登录恢复状态，并由恢复语义而非普通静态启动项激活”为稳定变量；其检测需要前序会话活动、队列快照与下次登录恢复三者连接，故可作为 T1547 的独立 Niji 子技术。
statement_en: Session-Restoration Queue Injection uses the stable variable of placing an adversary target in normal shutdown or sign-in restoration
  state for activation through restoration semantics rather than an ordinary static startup item. Detection must join prior-session activity,
  queue snapshot, and next-logon restoration, supporting an independent Niji child of T1547.
