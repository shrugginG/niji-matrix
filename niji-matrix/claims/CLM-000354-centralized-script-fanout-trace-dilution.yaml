statement_zh: 攻击者只需改变一份集中网络登录脚本，即可让多个客户端在各自登录时分散执行，减少逐端点写入并把控制面证据留在 GPO/共享存储；ATT&CK 直接说明多系统适用和跨事件检测，支持中等置信度 NM-ST 时空释痕。
statement_en: By changing one centralized network logon script, an adversary can distribute execution across multiple clients at their respective
  logons, reducing per-endpoint writes and leaving control-plane evidence in GPO or shared storage. ATT&CK directly states multi-system applicability
  and cross-event detection, supporting medium-confidence NM-ST Spatiotemporal Trace Dilution.
