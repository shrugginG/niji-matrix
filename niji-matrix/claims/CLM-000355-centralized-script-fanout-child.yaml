statement_zh: 集中初始化脚本扇出以“单一上游脚本状态被多个下游主体在各自生命周期消费”为稳定变量；它要求 GPO/共享文件版本、目标范围与多端 boot/logon 执行连接，且缓解需从中央回滚并验证传播，与单机脚本内联植入不同，因此构成独立 Niji 子项。
statement_en: Centralized Initialization-Script Fan-Out uses the stable variable of one upstream script state consumed by multiple downstream
  principals at their own lifecycle events. It requires correlation among GPO or shared-file version, target scope, and multiple endpoint boot
  or logon executions, with central rollback and propagation verification distinct from single-host inline implantation, supporting an independent
  Niji child.
