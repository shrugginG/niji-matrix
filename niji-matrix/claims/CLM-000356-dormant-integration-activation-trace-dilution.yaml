statement_zh: Microsoft 直接观察恶意 OAuth 应用在创建或授权后延迟数周或数月使用；长静默期把高风险建立事件与首次资源活动分开，并让应用积累“非新建”年龄，支持中等置信度 NM-ST 时空释痕，但不证明所有延迟都是匿迹意图。
statement_en: Microsoft directly observed malicious OAuth applications used weeks or months after creation or consent. The long silent interval
  separates high-risk establishment from first resource activity and gives the application a non-new age, supporting medium-confidence NM-ST Spatiotemporal
  Trace Dilution without proving every delay reflects evasion intent.
