statement_zh: 休眠集成延迟激活以“授权与凭据状态先持久存在，跨过显著静默期后才首次调用资源”为稳定变量；检测必须从建立时点延伸到 last-used/credential-unused 年龄和首次资源活动，缓解需治理休眠高权限应用，故与受信名称拟态独立。
statement_en: Dormant Integration Delayed Activation uses the stable variable of durable grant and credential state existing through a material
  silent interval before first resource invocation. Detection must extend from establishment through last-used or credential-unused age to first
  resource activity, and mitigation must govern dormant privileged apps, making it independent from trusted-name impersonation.
