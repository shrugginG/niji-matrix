statement_zh: UNC6395 使用既有 Salesloft Drift 集成的被盗 OAuth token 时，资源侧继续看到已批准第三方 client/integration 身份而非新恶意应用；合法集成身份替代真实控制者差异，支持高置信度 NM-FD 特征伪装。
statement_en: When UNC6395 used compromised OAuth tokens of existing Salesloft Drift integrations, resource services continued to see an approved
  third-party client or integration identity rather than a new malicious application. Legitimate integration identity substituted for the true-controller
  difference, supporting high-confidence NM-FD Feature Disguise.
