statement_zh: 既有第三方集成控制挪用以“应用对象、client ID 与已批准授权关系保持不变，而集成 token 或供应商控制者转为攻击者使用”为稳定变量；它没有新 consent 事件，需按 token 来源、vendor 事件和跨客户活动检测并执行全连接撤销，构成独立
  Niji 子项。
statement_en: Existing Third-Party Integration Control Co-option uses the stable variable of unchanged application object, client ID, and approved
  grant relationship while integration token or vendor control shifts to adversary use. It has no new consent event, requires token-origin, vendor-event,
  and cross-customer detection plus all-connection revocation, supporting an independent Niji child.
