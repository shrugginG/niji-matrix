statement_zh: 整映像路径身份替换以“既有软件路径/调用关系保留，而原映像不再作为执行主体、被恶意映像整体取代”为稳定变量；检测依赖完整 hash/签名/包基线，恢复需重装可信映像，区别于小差异补丁和显式原始功能接力，构成独立 Niji 子项。
statement_en: Whole-Image Path-Identity Substitution uses the stable variable of preserved software path and invocation while the original image
  no longer executes and is wholly replaced by a malicious image. Detection depends on complete hash, signature, or package baseline and recovery
  reinstalls a trusted image, distinct from small-difference patching and explicit original-function handoff, supporting an independent Niji child.
