statement_zh: 行为保持型二进制包裹以“恶意前奏后显式执行保留的原始代码/副本，以维持用户可见功能”为稳定变量；它需要识别双阶段控制流与隐藏原始副本，并在恢复时清除感染体和副本，区别于完整替换或局部字节补丁，构成独立 Niji 子项。
statement_en: Behavior-Preserving Binary Wrapper Trojanization uses the stable variable of an explicit handoff from malicious prelude to preserved
  original code or copy to maintain user-visible function. It requires detection of two-stage control flow and hidden original copy and recovery
  of both infected body and copy, distinct from whole replacement or local byte patching, supporting an independent Niji child.
