id: CLM-000367
claim_type: technique-relevance
statement_zh: 永久 WMI consumer 由 event filter、consumer 和 binding 组成，可在 WMI 或系统重启后等待匹配事件并执行 action；Solorigate 的恶意 WMI binding 直接证明该关系可恢复持久执行，因此 T1546 在 TA0003 下适配为持久事件触发注册。
statement_en: A permanent WMI consumer consists of an event filter, consumer, and binding and can wait across WMI or system restart for a matching event before executing an action. A malicious Solorigate WMI binding directly establishes that this relationship can restore persistent execution, supporting adaptation of T1546 as Durable Event-Trigger Registration under TA0003.
