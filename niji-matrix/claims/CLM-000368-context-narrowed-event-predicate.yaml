statement_zh: 持久事件 filter 可以使用 WQL 或等价条件把候选事件收窄到 uptime、进程、对象、设备或其他目标情境，只有匹配时才向 consumer 交付并执行 action；Microsoft 结构说明与 Mandiant 条件示例支持 NJS-0090-001。
statement_en: A durable event filter can use WQL or an equivalent condition to narrow candidate events to uptime, process, object, device, or another target context and deliver an event to the consumer for action only on a match. Microsoft's structural documentation and Mandiant's condition example support NJS-0090-001.
