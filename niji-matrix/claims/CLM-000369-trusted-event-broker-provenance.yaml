statement_zh: 永久注册者可以与以后执行 action 的 WMI provider host/Broker 分离，使进程侧显示 Wmiprvse 或其他受信宿主；filter/consumer/binding、CreatorSID、operation/correlation 与后继进程能够恢复来源，支持 NJS-0090-002。
statement_en: A durable registrant can be separated from the WMI provider host or broker that later executes the action, leaving Wmiprvse or another trusted host on the process side. Filter, consumer, and binding state, CreatorSID, operation or correlation, and downstream process can recover provenance, supporting NJS-0090-002.
