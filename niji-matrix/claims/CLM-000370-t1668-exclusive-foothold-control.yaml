statement_zh: UNC5174 在建立后门账户后自修补 F5 漏洞，PG_MEM 与 NetSky.P 在保留自身驻留时清除竞争对象，直接证明攻击者可形成“自身入口存续、其他入口或驻留被排除”的不对称状态，支持 T1668 在 TA0003 下适配保留。
statement_en: UNC5174 self-patched an F5 vulnerability after establishing backdoor accounts, while PG_MEM and NetSky.P removed competing objects while retaining their own residence. These directly establish an asymmetric state of own entry surviving while other entry or persistence is excluded and support adaptation of T1668 under TA0003.
