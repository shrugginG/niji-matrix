statement_zh: 外部远程服务可以在首个立足点之后继续提供独立重入会话；仍有效 session/token 或可复用风险情境能够在原会话、implant 或局部凭据处置后重新建立访问，因此同一 NJT-0055 对象也适用于 TA0003。
statement_en: An external remote service can continue to provide an independent re-entry session after the first foothold. Still-valid session or token state or reusable risk context can reestablish access after the original session, implant, or partial credential response, so the same NJT-0055 object also applies to TA0003.
