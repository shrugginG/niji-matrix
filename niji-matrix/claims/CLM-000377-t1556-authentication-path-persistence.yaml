statement_zh: 修改认证验证器、联合信任或附加策略可以在不改变每个账户主秘密的情况下持续返回攻击者选择的未授权成功；Skeleton Key 与 Solorigate 联合信任修改分别证明了组件级和身份平面级路径，因此该行为在 TA0003 下适配保留。
statement_en: Modifying an authentication validator, federation trust, or additional policy can persistently return adversary-selected unauthorized success without changing every account's primary secret. Skeleton Key and Solorigate federation-trust modification establish component-level and identity-plane paths respectively, supporting adapted retention under TA0003.
