id: CLM-000380
claim_type: technique-relevance
statement_zh: 攻击者可以在 Windows Registry 保存跨原写入会话存在的命令、载荷或配置，并由以后启动的 loader 或应用 consumer 读取以恢复恶意功能；FIN7 CARBANAK 链直接证明该 writer—state—consumer 关系，因此适配保留 Registry 驻留持久状态。
statement_en: An adversary can retain commands, payloads, or configuration in the Windows Registry beyond the original writer session and have a later loader or application consumer read them to restore malicious capability. The FIN7 CARBANAK chain directly establishes this writer-state-consumer relationship, supporting adapted retention of Registry-Resident Persistence State.
