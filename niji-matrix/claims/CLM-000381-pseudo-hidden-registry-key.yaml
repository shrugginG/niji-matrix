statement_zh: embedded null 可利用 kernel counted string 与 Win32 null-terminated string 的差异，使同一 Registry 对象在 native/raw 状态完整存在并被 consumer 使用，却被 Regedit、reg query 或其他标准工具报错、截断或遗漏；Sysinternals 与 Kovter 分析共同支持 NJS-0094-001。
statement_en: An embedded null can exploit the difference between kernel counted strings and Win32 null-terminated strings so one Registry object exists completely and remains consumable in native or raw state but errors, truncates, or disappears in Regedit, reg query, or another standard tool. Sysinternals and Kovter analysis together support NJS-0094-001.
