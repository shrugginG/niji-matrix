statement_zh: 恶意 USB 设备枚举为标准 HID 键盘并从硬件输入栈发送按键，使事件借用物理键盘来源且缺少软件注入进程/标志，符合 NM-FD。
statement_en: A malicious USB device enumerating as a standard HID keyboard and sending keys through the hardware input stack borrows physical-keyboard provenance and can lack a software injector process or flag consistent with NM-FD.
