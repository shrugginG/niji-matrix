statement_zh: 当恶意逻辑以声明 job、构建脚本或被引用 action 的形式由正常 runner 身份执行时，端点父进程与控制面 run 记录仍显得合法，若不把输入变更连接到 runner 结果就会形成 NM-BT 行为透明。
statement_en: When malicious logic executes as a declared job build script or referenced action under a normal runner identity the endpoint parent and control-plane run remain legitimate-looking and create NM-BT Behavioral Transparency unless input changes are joined to runner outcomes.
