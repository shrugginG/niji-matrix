type: claim
id: CLM-000455
claim_type: case-attribution
statement_zh: XZ 5.6.0/5.6.1 的恶意 M4 触发器只出现在发布 tarball，构建时从伪装测试文件提取对象并修改 liblzma，而 Git 分发缺少触发宏，证明主仓库视图与实际构建输入可以分离。
statement_en: The malicious M4 trigger in XZ 5.6.0 and 5.6.1 appeared only in release tarballs and extracted an object from a disguised test file during the build to modify liblzma while the Git distribution lacked the trigger demonstrating separation between the primary repository view and actual build inputs.
