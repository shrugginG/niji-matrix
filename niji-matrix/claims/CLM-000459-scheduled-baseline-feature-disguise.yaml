statement_zh: 攻击者让任务名称、路径、作者、账户、触发时间和频率贴合本机更新或维护任务，可使恶意任务与合法调度对象共享可见特征并形成 NM-FD 特征伪装；资产软件清单与任务动作仍可揭示语义不一致。
statement_en: Aligning task name path author account trigger time and cadence with local update or maintenance tasks makes malicious and legitimate scheduler objects share visible features and creates NM-FD Feature Disguise while asset software inventory and task actions can still expose semantic mismatch.
