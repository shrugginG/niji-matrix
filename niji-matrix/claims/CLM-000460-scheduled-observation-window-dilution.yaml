statement_zh: 将任务注册与首次关键执行分离数小时或数日，可使短时沙箱、事件 triage 和默认关联窗口只观察到链的一端并形成 NM-ST 时空释痕；Nitrokod 的多日计数和 15 天任务链直接证明该变量被用于规避分析。
statement_en: Separating task registration from first critical execution by hours or days leaves short sandboxes event triage and default correlation windows with only one end of the chain and creates NM-ST Spatiotemporal Trace Dilution. Nitrokod's multi-day counting and fifteen-day task chain directly demonstrates use of the variable to evade analysis.
