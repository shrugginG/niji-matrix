statement_zh: 短驻一次性计划代理以任务只在 create→trigger→run→delete 事务中存在、主要匿迹效果来自受信调度器父级与状态扫描缺口为稳定变量，其检测依赖短窗口审计事务而非持久对象基线，因而独立于延期和枚举抑制。
statement_en: Ephemeral One-Shot Scheduled Brokerage uses a task existing only for a create-trigger-run-delete transaction with its primary stealth effect from trusted scheduler parentage and a state-scan gap. Detection depends on short-window audit transactions rather than durable object baselines and is therefore distinct from delay and enumeration suppression.
