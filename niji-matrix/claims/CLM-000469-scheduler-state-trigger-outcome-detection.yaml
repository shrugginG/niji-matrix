statement_zh: 计划执行检测必须按稳定任务身份连接创建/修改、原始定义、标准与高权枚举差分、计划和实际触发时间、执行进程及后继网络，并同时支持长窗口与 create-run-delete 短事务；单独依赖当前任务列表或 schtasks 进程会漏掉延期、隐藏和短驻轴。
statement_en: Scheduled-execution detection must join creation or modification raw definitions standard-to-privileged enumeration differences scheduled and actual trigger times execution processes and successor network activity by stable task identity while supporting both long windows and short create-run-delete transactions. Current task lists or schtasks processes alone miss delay hidden-state and ephemeral axes.
