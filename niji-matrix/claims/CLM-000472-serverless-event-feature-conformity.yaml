statement_zh: 恶意函数或流程由正常邮件、文件、用户、队列或存储事件触发并以现有服务身份执行时，触发与动作共享业务自动化特征并符合 NM-FD 特征伪装；DART 观察到攻击者启用 Microsoft Flow 自动窃取搜索结果，但公开材料未披露完整触发配置。
statement_en: When malicious functions or flows are triggered by normal mail file user queue or storage events and execute under existing service identities trigger and action share business-automation features consistent with NM-FD Feature Disguise. DART observed an attacker enabling Microsoft Flow to automate theft of search results but did not publish the complete trigger configuration.
