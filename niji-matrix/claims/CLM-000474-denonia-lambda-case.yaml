statement_zh: Denonia 样本包含 Lambda handler 和环境专用库、在 /tmp 写配置并从内存运行 XMRig，通过 DoH 隐藏 DNS；它证明面向 Lambda 的恶意执行与短驻调查问题，但 Cado 未确定样本如何进入 Lambda，不能归因具体部署路径。
statement_en: Denonia contained a Lambda handler and environment-specific libraries wrote configuration under tmp ran XMRig from memory and used DoH to hide DNS. It proves Lambda-targeted malicious execution and ephemeral investigative difficulty but Cado did not identify how the samples reached Lambda so no deployment path is attributed.
