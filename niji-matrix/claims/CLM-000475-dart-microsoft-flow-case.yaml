statement_zh: Microsoft DART 在真实入侵中发现攻击者启用客户已有但未主动使用且缺乏高价值日志的 Microsoft Flow，配合 eDiscovery 与 Compliance Search 自动窃取搜索结果，证明 SaaS 自动化能以现有业务系统外观执行恶意动作。
statement_en: Microsoft DART found in a real intrusion that an attacker enabled existing but unused and insufficiently logged Microsoft Flow together with eDiscovery and Compliance Search to automate theft of search results proving SaaS automation can execute malicious actions under existing business-system appearance.
