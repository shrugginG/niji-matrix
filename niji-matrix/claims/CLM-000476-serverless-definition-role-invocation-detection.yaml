statement_zh: 检测无服务器执行必须关联函数/流程创建与代码版本、trigger 或 event source mapping、角色/连接器权限、每次 invocation 以及敏感 API、网络或数据结果；只记录管理事件会因 Invoke 数据事件未启用和 CreateFunction 省略代码/环境字段而留下盲区。
statement_en: Detecting Serverless Execution requires correlating function or flow creation and code version triggers or event-source mappings role or connector permissions each invocation and sensitive API network or data outcomes. Management events alone leave blind spots because Invoke data events may be disabled and CreateFunction omits code and environment fields.
