statement_zh: 限制函数/流程创建、更新、PassRole/actAs 和连接器权限，要求代码来源与版本审批，按最小权限绑定执行角色，约束网络并完整记录 invocation，可降低恶意短驻实例和业务事件耦合自动化的机会与影响。
statement_en: Restricting function or flow creation updates PassRole or actAs and connector permissions requiring approved code provenance and versions binding least-privilege execution roles constraining network and fully logging invocations reduces opportunities and impact for malicious ephemeral instances and business-event-coupled automation.
