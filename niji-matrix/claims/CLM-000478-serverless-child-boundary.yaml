statement_zh: 短驻函数实例子项固定无稳定客户主机和调用后运行态消失的观察差异，事件流耦合子项固定正常业务事件到自动化动作的语义混同；函数由事件触发时可同时映射，但每个子项必须有独立证据，平台或代码包装不构成第三子项。
statement_en: The ephemeral-function child fixes the observation difference from no stable customer host and disappearing post-invocation state while the event-stream child fixes semantic conflation of normal business events and automation actions. An event-triggered function may map to both with independent evidence and provider or code packaging does not form a third child.
