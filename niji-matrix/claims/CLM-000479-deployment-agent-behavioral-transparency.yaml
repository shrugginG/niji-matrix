statement_zh: 攻击者通过 ePO、PDQ、BigFix、SCCM 等控制面提交任务后，端点由已安装的签名 agent 以 SYSTEM 或管理账户启动载荷，局部进程树缺少攻击者会话并形成 NM-BT 行为透明；APT32 和 AvosLocker 案例直接支持。
statement_en: After an adversary submits jobs through ePO PDQ BigFix SCCM or similar control planes installed signed agents start payloads as SYSTEM or management accounts and local process trees lack the adversary session creating NM-BT Behavioral Transparency. APT32 and AvosLocker cases directly support the mechanism.
