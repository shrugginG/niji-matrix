statement_zh: 对部署脚本、包和 fleet scope 实施 author/approver 分离、JIT 最小权限、签名与 digest、分段 canary、agent 到控制面的双向身份和不可变审计，可限制受信 agent 代理和大范围 fan-out；只依赖工具许可清单不能阻止被攻陷控制面。
statement_en: Author and approver separation JIT least privilege signatures and digests segmented canaries mutual agent-to-control-plane identity and immutable audit for deployment scripts packages and fleet scopes constrain trusted-agent brokerage and broad fan-out. Tool allowlists alone cannot stop a compromised control plane.
