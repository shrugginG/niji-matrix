statement_zh: T1072 以企业部署控制面和既有受管 agent 的 job→receipt→execution 链为直接对象；普通远程 shell、新安装仅供单机交互的 RMM、云资源管理 API、CI runner 和本地软件安装分别属于相邻技术，只有形成 fleet 管理执行链才纳入。
statement_en: T1072 directly models the job-to-receipt-to-execution chain from an enterprise deployment control plane through existing managed agents. Ordinary remote shells newly installed single-host interactive RMM cloud resource-management APIs CI runners and local software installation belong to adjacent techniques unless they form a fleet-management execution chain.
