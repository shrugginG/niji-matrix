statement_zh: 当恶意功能以共享模块加载进现有进程且不创建独立可执行进程时，进程级遥测保留 host 名称与父子谱系并形成 NM-BT 行为透明；Astaroth 借合法 ExtExport.exe 加载载荷提供直接案例，但标准 module/file 仍可见。
statement_en: When malicious functionality loads as a shared module inside an existing process without a standalone executable process process-level telemetry preserves host name and lineage and creates NM-BT Behavioral Transparency. Astaroth loading payload through legitimate ExtExport.exe provides a direct case while standard module and file state remain visible.
