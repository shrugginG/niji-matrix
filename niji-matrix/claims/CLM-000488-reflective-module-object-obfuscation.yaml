statement_zh: 自定义或反射映射器可从内存字节自行完成 PE 导入、重定位和入口调用，不写入 DLL 文件也不进入标准 loader/PEB module list，使可执行代码缺少正常 file-backed module 对象并形成 NM-DO 数据对象混淆。
statement_en: Custom or reflective mappers can resolve PE imports relocations and entry calls from memory bytes without writing a DLL or entering standard loader or PEB module lists leaving executable code without a normal file-backed module object and creating NM-DO Data Object Obfuscation.
subject_refs: [NJT-0077, NJS-0077-002, NM-DO]
