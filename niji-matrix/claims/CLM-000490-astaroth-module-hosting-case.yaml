statement_zh: Microsoft 观察 Astaroth 借合法 ExtExport.exe 加载 payload 并以 fileless living-off-the-land 链降低独立恶意进程与文件外观，同时指出内存足迹和行为链仍可检查，直接支持进程身份保持但不证明所有 LoadLibrary 调用的匿迹意图。
statement_en: Microsoft observed Astaroth use legitimate ExtExport.exe to load payload and reduce standalone malicious process and file appearance through a fileless living-off-the-land chain while noting inspectable memory footprints and behavior supporting process identity preservation without making every LoadLibrary call an evasion choice.
