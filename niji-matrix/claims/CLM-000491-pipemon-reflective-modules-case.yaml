statement_zh: ESET 在 Winnti 入侵中发现 PipeMon 的功能模块为导出 IntelLoader 的 DLL，以无害名称加密存储并通过 reflective loading 载入不同进程，证明恶意模块可绕过正常 file-backed loader 表面并留下 private executable memory 与注入痕迹。
statement_en: ESET found during Winnti intrusions that PipeMon function modules were DLLs exporting IntelLoader stored encrypted under innocuous names and reflectively loaded into processes proving modules can bypass normal file-backed loader surfaces while leaving private executable memory and injection traces.
