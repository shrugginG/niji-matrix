statement_zh: 限制可加载模块来源、验证 module 与 host 组合、阻止用户可写或远程路径、启用 DLL/动态代码完整性并对 private executable memory 施加策略，可降低现有进程模块承载和内存反射实例化；签名 host 不能替代 module 级验证。
statement_en: Restricting module sources validating module-to-host combinations blocking user-writable or remote paths enforcing DLL and dynamic-code integrity and applying policy to private executable memory reduces existing-process module hosting and reflective instantiation while signed hosts cannot replace module-level validation.
