statement_zh: 现有进程内模块承载保留标准 loader 注册和 file-backed image，主要观察断点是进程身份不变；内存驻留模块实例化绕开标准 loader/文件对象，主要断点是 executable private memory。两者按 module visibility 而非 DLL/.so/.dylib 或工具划分。
statement_en: Existing-process in-module hosting retains standard loader registration and file-backed images with unchanged process identity as the primary observation break while memory-resident instantiation bypasses standard loader and file objects with executable private memory as the break. They partition module visibility rather than DLL SO dylib or tool.
