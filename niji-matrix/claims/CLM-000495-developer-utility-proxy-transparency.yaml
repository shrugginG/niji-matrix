statement_zh: 签名开发工具解释攻击者 project、manifest 或 build input 并启动/加载代码时，应用控制与进程信誉把 utility 当作允许主体，恶意执行继承其身份并形成 NM-BT 行为透明；Frankenstein 与 AkaiRyū 直接支持 MSBuild 代理。
statement_en: When signed developer utilities interpret adversary projects manifests or build inputs and launch or load code application control and process reputation treat the utility as allowed and malicious execution inherits its identity creating NM-BT Behavioral Transparency. Frankenstein and AkaiRyū directly support MSBuild proxying.
