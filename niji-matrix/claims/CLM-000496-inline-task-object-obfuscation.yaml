type: claim
id: CLM-000496
claim_type: mechanism-mapping
statement_zh: MSBuild RoslynCodeTaskFactory 可把 project 中的 C#/VB Code 编译为内存 task assembly 并在构建中执行，使逻辑缺少独立持久可执行制品并形成 NM-DO 数据对象混淆；该能力有官方文档，但现场攻击是否完全无制品需个案证明。
statement_en: MSBuild RoslynCodeTaskFactory can compile C sharp or Visual Basic Code from a project into an in-memory task assembly and execute it during the build leaving no independent durable executable artifact and creating NM-DO Data Object Obfuscation. Official documentation establishes capability while artifactlessness in field attacks requires case evidence.
subject_refs: [NJT-0080, NJS-0080-002, NM-DO]
evidence_refs: [REF-000284]
evidence_mode: strongly-inferred
confidence: medium
status: review
