id: CLM-000501
claim_type: mitigation
statement_zh: 在非开发系统阻止 MSBuild 等 utility，在开发系统按用户/路径/签名限制输入、启用 App Control Dynamic Code Security、禁止远程或用户可写 project，并保存 project 与运行结果，可降低工具代理和内联代码执行而不依赖 publisher 全局放行。
statement_en: Blocking MSBuild-like utilities on nondeveloper systems and constraining inputs by user path and signature on developer systems enabling App Control Dynamic Code Security forbidding remote or user-writable projects and retaining project and outcome evidence reduces utility proxying and inline execution without global publisher allowance.
