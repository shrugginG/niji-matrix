statement_zh: 受信 utility 输入代理以签名工具消费外部 project/manifest 并产生 child/module/网络结果为变量；无独立制品 utility 内执行以 inline source 编译为内存 task assembly 并在 utility 内运行 为变量。remote source 和 MSBuild/ClickOnce/JamPlus 名称不形成额外子项。
statement_en: Trusted-utility input proxying uses a signed tool consuming an external project or manifest and producing child module or network outcomes while artifactless in-utility execution uses inline source compiled into an in-memory task assembly and run inside the utility. Remote source and MSBuild ClickOnce or JamPlus names do not form additional children.
