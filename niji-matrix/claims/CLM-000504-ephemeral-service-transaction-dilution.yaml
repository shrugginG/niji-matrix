statement_zh: 为一次执行临时创建服务并在运行后删除，可使对象在周期盘点前消失、远程请求与本地 service-manager child 分离，形成 NM-ST 时空释痕；PsExec 三阶段证明远程创建与服务代理，但公开事件未完整证明每次删除，故为 medium。
statement_en: Creating a service temporarily for one execution and deleting it afterward can remove the object before periodic inventory and separate remote request from local service-manager children creating NM-ST Spatiotemporal Trace Dilution. The PsExec stages prove remote creation and service brokerage but public incident detail does not establish deletion every time so confidence is medium.
