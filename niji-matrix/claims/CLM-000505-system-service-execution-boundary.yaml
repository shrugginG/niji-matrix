statement_zh: T1569 在 service manager 响应 start/control/create 后实际启动攻击者动作时成立；持久定义创建/替换与隐藏归 NJT-0089 等 Persistence 对象，服务 DLL 模块与远程 SMB/RPC 可共同映射 T1129 或 Remote Services，但不改变 manager→execution 直接边界。
statement_en: T1569 is established when a service manager actually starts an adversary action after start control or create. Durable definition creation substitution and hiding belong to NJT-0089 and other Persistence objects while service DLL modules and remote SMB or RPC may co-map T1129 or Remote Services without changing the manager-to-execution boundary.
