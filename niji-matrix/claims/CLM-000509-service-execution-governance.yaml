statement_zh: 限制服务 control/create 与远程 SCM 权限、版本化 definition/target、验证 service—binary/module 组合、集中保留生命周期并阻止用户可写载荷，可分别降低已有服务借用与短驻服务代理；受信 manager 不能自动放行 child。
statement_en: Restricting service control and create and remote SCM authority versioning definitions and targets validating service-to-binary or module combinations centrally retaining lifecycle and blocking user-writable payloads reduces existing-service borrowing and ephemeral brokerage while trusted managers cannot automatically allow children.
