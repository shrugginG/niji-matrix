statement_zh: 既有服务情境借用以无新对象的 start/control 与已有 identity 为变量，短驻服务生命周期压缩以 create→start→run→delete 事务和无持久 inventory 为变量；持久 definition substitution 不在 Execution 子项内，平台 manager 名称不成项。
statement_en: Existing-Service Context Borrowing uses start or control with no new object and an established identity as the variable while Ephemeral Service-Lifecycle Compression uses create start run delete transactions and no durable inventory. Durable definition substitution is outside Execution children and platform manager names do not form children.
