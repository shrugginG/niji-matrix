statement_zh: WMI client 的 ExecMethod/Win32_Process 等请求经 WMI service 转换为 Wmiprvse/provider 本地进程或动作，终端父进程和账户不直接显示远程/原始发起者，形成 NM-BT 行为透明；TA551 直接用 WMI 打断 winword 父子谱系。
statement_en: WMI client ExecMethod or Win32_Process requests are translated by the WMI service into local Wmiprvse or provider processes or actions so endpoint parentage and accounts do not directly show the remote or original initiator creating NM-BT Behavioral Transparency. TA551 directly used WMI to break winword parent-child lineage.
