statement_zh: 攻击者使用组织常见 namespace、class、method、管理账户与节奏执行时，恶意 WMI operation 与 inventory/运维调用共享可见特征并形成 NM-FD 特征伪装；现场案例证明 WMI 滥用，但有意贴合日常基线的细节有限，故为 medium。
statement_en: When adversaries use common organizational namespaces classes methods management accounts and cadence malicious WMI operations share visible features with inventory or administration calls and create NM-FD Feature Disguise. Field cases prove WMI abuse but provide limited detail on intentional conformity to routine baselines so confidence is medium.
