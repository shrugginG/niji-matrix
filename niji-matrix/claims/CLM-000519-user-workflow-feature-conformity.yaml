statement_zh: 将恶意动作包装为用户真实工作流程中的文档/USB 文件夹访问、技术面试项目安装、更新或远程支持，可让 user action、应用与命令共享合法任务特征并形成 NM-FD 特征伪装；Raspberry Robin 与 Contagious Interview 直接支持。
statement_en: Framing malicious actions as document or USB folder access technical-interview project installation updates or remote support in genuine user workflows makes user actions applications and commands share legitimate task features and creates NM-FD Feature Disguise. Raspberry Robin and Contagious Interview directly support the mechanism.
