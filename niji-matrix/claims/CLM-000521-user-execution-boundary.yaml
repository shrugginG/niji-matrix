statement_zh: T1204 固定可归因的人类动作到首个恶意执行的因果边；Phishing 负责投递，T1203 负责漏洞，T1059/容器/库/远程工具负责执行实现，zero-click/autorun 不属于用户执行，愿意共谋的 insider 另涉及 Valid Accounts/Trusted Relationship。
statement_en: T1204 fixes the causal edge from an attributable human action to first malicious execution. Phishing owns delivery T1203 exploitation and T1059 container library or remote tools own execution implementation. Zero-click or autorun is not User Execution and willing insiders also involve Valid Accounts or Trusted Relationship.
