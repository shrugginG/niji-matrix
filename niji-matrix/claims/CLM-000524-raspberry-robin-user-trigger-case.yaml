statement_zh: Microsoft 观察 Raspberry Robin 依赖用户点击 USB 上伪装为品牌或文件夹的 LNK，再由 cmd/msiexec 启动恶意链；品牌命名被评估为可能鼓励点击，支持工作流合形但不把未知用户动机强化为事实。
statement_en: Microsoft observed Raspberry Robin rely on users clicking LNK files on USB media masquerading as brands or folders before cmd and msiexec launched the chain and assessed brand naming may encourage execution supporting workflow conformity without overstating unknown user motivation.
subject_refs: [NJT-0081, NJS-0081-001, CASE-000109]
