statement_zh: T1548/NJT-0098 的成立条件是提权控制路径导致更高有效权限；软件漏洞利用、持久身份授权边新增、Windows 令牌操纵及仅使用既有高权限分别属于 T1068、T1098/NJT-0083、T1134 或范围外，不能由控制介质名称并入本对象。
statement_en: T1548 and NJT-0098 require an elevation-control path to cause higher effective privilege. Software exploitation, durable identity-entitlement addition, Windows token manipulation, and mere use of already-effective privilege belong respectively to T1068, T1098 and NJT-0083, T1134, or outside scope and cannot be absorbed by control-medium name.
