statement_zh: 攻击者可有意让原生 broker、受信系统二进制、已批准应用或可模拟身份承接提权请求，使低权限发起与高权限结果由不同可见主体或进程呈现；该谱系与授权来源分离形成跨平台稳定变量，并要求专门的 requester—intermediary—outcome 关联。
statement_en: An adversary can intentionally route an elevation request through a native broker, trusted system binary, approved application, or impersonable identity so the lower-privilege initiation and privileged outcome appear under different visible principals or processes. This separation of lineage and authorization provenance is a stable cross-platform variable requiring dedicated requester-intermediary-outcome correlation.
