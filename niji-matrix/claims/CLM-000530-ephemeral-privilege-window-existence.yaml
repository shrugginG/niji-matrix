statement_zh: 攻击者可把高权限使用限制在 sudo 缓存、JIT 激活或短期身份模拟凭据的有效窗口中，使激活、使用和失效分离，且持久权限快照在窗口前后均可正常；该寿命变量需要区间化检测与逐次审批/作用域验证。
statement_en: An adversary can confine privileged use to the validity window of a sudo cache, JIT activation, or short-lived impersonation credential, separating activation, use, and invalidation while durable entitlement snapshots can look normal before and after the interval. This lifetime variable requires interval-aware detection and per-use approval and scope validation.
