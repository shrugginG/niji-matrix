statement_zh: 将低权限请求者、提权控制或激活事件、授权/审批上下文、中介或临时凭据、产生的高权限进程/会话以及首个敏感操作连接，并分别验证谱系异常与有效期/作用域偏差，可比单独告警配置写入、高完整性进程或角色快照更准确地区分 NJT-0098。
statement_en: Joining the lower-privilege requester, elevation-control or activation event, authorization and approval context, intermediary or temporary credential, resulting privileged process or session, and first sensitive action, then separately testing lineage anomaly and validity or scope deviation, distinguishes NJT-0098 more precisely than isolated alerts on configuration writes, high-integrity processes, or role snapshots.
