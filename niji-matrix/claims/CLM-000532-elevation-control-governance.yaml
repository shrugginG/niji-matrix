type: claim
id: CLM-000532
claim_type: mitigation
statement_zh: 逐操作重新授权、限制可自动或代理提权的中介、保护提权策略与审批状态、缩短并限定临时权限，以及保留请求者到高权限结果的不可变谱系，可以减少 NJT-0098 的可用路径并迫使剩余尝试产生更完整的授权或拒绝记录；这些控制不能抵消已被攻陷的 broker、审批者或遥测链。
statement_en: Per-operation reauthorization, constraint of auto-elevating or brokered intermediaries, integrity protection for elevation policy and approval state, bounded and scoped temporary privilege, and immutable requester-to-privileged-outcome lineage reduce usable NJT-0098 paths and force remaining attempts to create more complete authorization or denial records. These controls cannot compensate for a compromised broker, approver, or telemetry chain.
