statement_zh: NJT-0099 的直接对象是令牌身份/权限状态及其线程或进程绑定；SID-History 等持久目录授权边归 NJT-0083/NJS-0083-002，UAC/sudo 等提权控制事务归 NJT-0098，漏洞、代码注入、既有高权限使用和无权限结果的纯 PPID 断树不由本对象吸收。
statement_en: NJT-0099 directly concerns token identity or privilege state and its thread or process binding. Durable directory authorization edges such as SID-History belong to NJT-0083 and NJS-0083-002, UAC or sudo elevation transactions to NJT-0098, and exploitation, code injection, use of already-effective privilege, or PPID-only tree breaking without a privilege result are not absorbed by this object.
