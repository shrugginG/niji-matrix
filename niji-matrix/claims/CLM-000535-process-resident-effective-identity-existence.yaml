statement_zh: 攻击者可把外来模拟令牌赋给受控线程，使资源访问按线程有效身份执行，而进程映像、PID、祖先和主令牌保持原状；这个载体连续的身份差异需要线程有效令牌到来源令牌/登录及资源结果的专门关联，构成独立 Niji 匿迹变量。
statement_en: An adversary can assign a foreign impersonation token to a controlled thread so resource access uses the thread's effective identity while process image, PID, ancestry, and primary token remain unchanged. This carrier-continuous identity divergence requires a dedicated join from thread effective token to source token or logon and resource outcome, forming a distinct Niji stealth variable.
