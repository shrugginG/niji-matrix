statement_zh: 攻击者可使用外来主令牌或显式选定父进程创建新进程，使实际调用者、Creator Subject、Target Subject、显示父级、令牌来源和高权限结果不再形成连续谱系；该痕迹变化削弱单源父子规则，并要求跨 Security、ETW 和端点进程 GUID 的专门校验。
statement_en: An adversary can create a process with a foreign primary token or explicitly selected parent so actual caller, Creator Subject, Target Subject, displayed parent, token origin, and privileged outcome no longer form continuous lineage. This trace change weakens single-source parent-child rules and requires dedicated validation across Security, ETW, and endpoint process GUID data.
