statement_zh: 攻击者可在用户 SID、登录会话、进程与令牌来源均不变时，选择性启用令牌中已有但禁用的权限并立即执行受保护操作；该权限位前后态与消费关系不能由身份或进程谱系替代，形成独立 Niji 匿迹变量。
statement_en: An adversary can selectively enable an existing but disabled token privilege and immediately perform a protected operation while user SID, logon session, process, and token origin remain unchanged. This privilege-bit before-and-after and consumption relationship cannot be replaced by identity or process lineage and forms a distinct Niji stealth variable.
