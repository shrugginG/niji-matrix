statement_zh: 最小化令牌相关用户权限与高危进程访问、隔离合法模拟 broker、保护令牌句柄，并保留来源令牌—承载体—权限状态—资源结果的不可变谱系，可减少 NJT-0099 可用路径并提高剩余操作的可区分性；这些控制不能抵消内核级令牌篡改或被攻陷的遥测链。
statement_en: Minimizing token-related user rights and high-risk process access, isolating legitimate impersonation brokers, protecting token handles, and retaining immutable source-token-carrier-privilege-state-resource-outcome lineage reduce usable NJT-0099 paths and improve discrimination of remaining activity. These controls cannot compensate for kernel-level token tampering or a compromised telemetry chain.
