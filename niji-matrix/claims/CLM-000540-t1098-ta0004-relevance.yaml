statement_zh: 对既有账户的凭据、权限组或其他访问状态作出攻击者控制的修改，并由该修改授予新增角色、权限或更高权限主体的使用能力，会使 post-state 有效权威高于 pre-state，因此 T1098 在 TA0004 下独立成立并可复用 NJT-0083 的身份状态直接对象。
statement_en: An adversary-controlled modification to credentials, permission groups, or other access state of an existing account that grants use of new roles, permissions, or a higher-privileged principal raises post-state effective authority above pre-state, making T1098 independently valid under TA0004 while reusing NJT-0083's identity-state direct object.
