statement_zh: 认证器、授权边或设备信任的同一变更—使用谱系可分别输出“跨会话持续使用”和“相对 pre-state 的有效权威增量”；后者必须保存 pre/post 权限或策略结果，并把 changed edge 连接到首次新获准高权限操作，因此扩展 DET-000064 与 NJA-000043 比复制一套 TA0004 防御对象更准确。
statement_en: The same mutation-to-use lineage for an authenticator, authorization edge, or device trust can separately produce cross-session continuing use and effective-authority gain relative to pre-state. The latter must preserve before-and-after permission or policy results and join the changed edge to the first newly authorized privileged action, so extending DET-000064 and NJA-000043 is more accurate than duplicating TA0004 defense objects.
