statement_zh: 部分启动或登录自启动映射由高于写入者或先前执行上下文的生命周期 consumer 运行；当攻击者控制的映射使目标取得相对 pre-state 更高的有效权限并完成新获准结果时，T1547 在 TA0004 下独立成立，同时复用 NJT-0084 的激活映射直接对象。
statement_en: Some boot or logon autostart mappings are executed by lifecycle consumers with greater authority than the writer or prior execution context. When an adversary-controlled mapping gives the target higher effective authority than pre-state and produces a newly authorized outcome, T1547 is independently valid under TA0004 while reusing NJT-0084's activation-mapping direct object.
