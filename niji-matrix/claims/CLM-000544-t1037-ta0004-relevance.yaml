statement_zh: 某些启动或登录初始化脚本由高于 writer/pre-state 的生命周期 interpreter 执行；当攻击者控制的脚本内容使结果取得有效权限增量并完成首个新获准操作时，T1037 在 TA0004 下成立并复用 NJT-0085 的脚本内容直接对象，但同权限执行不构成提权。
statement_en: Some boot or logon initialization scripts are executed by a lifecycle interpreter above writer or pre-state authority. When adversary-controlled script content gives the result an effective-authority gain and completes the first newly authorized operation, T1037 is valid under TA0004 and reuses NJT-0085's script-content direct object, while same-authority execution is not elevation.
