statement_zh: T1543 在 TA0004 下只有在较低权限 writer 或 pre-state 能影响攻击者控制的精确服务定义、manager 随后以更高有效权限执行该版本，并由此完成首个新获准操作时才成立；服务由 root/SYSTEM 运行或由管理员创建本身不能证明权限增量。
statement_en: T1543 applies under TA0004 only when a lower-authority writer or pre-state can influence the exact adversary-controlled service definition, the manager later executes that version with greater effective authority, and this causes the first newly authorized operation. A service running as root or SYSTEM or being created by an administrator does not by itself prove authority gain.
