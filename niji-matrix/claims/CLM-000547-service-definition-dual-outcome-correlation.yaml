statement_zh: 同一 service writer—definition version—manager execution 谱系应分别输出服务定义异常、跨生命周期恢复和相对 pre-state 的权限提升；提权输出还必须保存实际 execution account/token、pre/post 授权集合、正向 delta 与首个新获准操作，不能由受信 manager、root/SYSTEM 字符串或枚举缺失替代。
statement_en: The same service writer-to-definition-version-to-manager-execution lineage should emit service-definition anomaly, cross-lifecycle restoration, and authority gain relative to pre-state as separate outcomes. The elevation output must additionally preserve the actual execution account or token, before-and-after authorization sets, a positive difference, and the first newly authorized operation rather than substituting a trusted manager, root or SYSTEM string, or enumeration absence.
