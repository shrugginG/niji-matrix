statement_zh: T1484 在 TA0004 下只有在攻击者控制的精确 policy/trust version 经传播或评估，使明确主体、会话或 token 相对 pre-state 获得正向有效权限差并完成首个新获准操作时才成立；策略变化、GPO applied、trust established、管理员身份或单纯防御削弱不能替代该结果链。
statement_en: T1484 applies under TA0004 only when an exact adversary-controlled policy or trust version is propagated or evaluated, gives an identified principal, session, or token a positive effective-authority difference relative to pre-state, and causes the first newly authorized operation. Policy mutation, an applied GPO, established trust, administrator identity, or defense impairment alone cannot replace this outcome chain.
