statement_zh: 一次集中 policy/trust mutation 可由复制器、policy client 或 trust evaluator 在多个资源上消费，使 writer 与执行/授权结果分处控制面和消费面；只观察 endpoint、受信管理进程或资源侧 effective identity 会丢失来源因果，需用 object/version、scope、consumer evaluation 和结果键重连。
statement_en: One centralized policy or trust mutation can be consumed by replicators, policy clients, or trust evaluators across multiple resources, placing writer and execution or authorization outcomes in separate control and consumption planes. Endpoint-, trusted-management-process-, or resource-side-effective-identity-only observation loses provenance causality and requires object and version, scope, consumer evaluation, and outcome keys for reconstruction.
