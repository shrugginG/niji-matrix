id: CLM-000550
claim_type: subtechnique-existence
statement_zh: 攻击者可临时建立恶意 domain/tenant policy version、完成动作并恢复同一对象的先前当前状态，使异常成为有界版本区间并逃离回退后的 current-state inventory；该轴要求证明 mutation—consumer use—reversion 顺序，不能由两次相似配置变化或正常回滚推定。
statement_en: An adversary can temporarily establish a malicious domain or tenant policy version, act, and restore the prior current state of the same object, turning the anomaly into a bounded version interval that escapes post-reversion current-state inventory. This axis requires proof of mutation, consumer use, and reversion order and cannot be inferred from two similar configuration changes or a normal rollback.
