statement_zh: 检测必须把 writer、完整 old/new policy/trust version、有效 scope、传播/评估、主体或 session/token、pre/post 授权集合及首个新获准操作连接，并把 policy anomaly、consumer adoption、elevation confirmed 与 post-use reversion 分级输出；当前快照正常或 GPO/trust 事件存在均不能越级。
statement_en: Detection must join writer, complete old and new policy or trust version, effective scope, propagation or evaluation, principal or session or token, before-and-after authorization sets, and the first newly authorized operation, with tiered outputs for policy anomaly, consumer adoption, confirmed elevation, and post-use reversion. A normal current snapshot or presence of a GPO or trust event cannot be promoted by itself.
