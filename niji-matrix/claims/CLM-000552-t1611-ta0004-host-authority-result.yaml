statement_zh: T1611 在 TA0004 下只有在 container/guest pre-state 原本不能完成某项宿主操作，经可定位隔离边界 primitive 或 Broker 路径取得宿主上下文/规范资源访问，并完成首个 host-only authorized outcome 时成立；UID 0、privileged、mount、socket、CVE 或宿主凭据字符串不能替代正向权限差。
statement_en: T1611 applies under TA0004 only when a container or guest pre-state could not perform a host operation, a locatable isolation-boundary primitive or broker path obtains host context or canonical-resource access, and the first host-only authorized outcome occurs. UID 0, privileged mode, a mount, socket, CVE, or host-credential string cannot replace a positive authority difference.
