statement_zh: 容器/guest 内 primitive、host boundary event 与宿主进程或资源结果跨 namespace、telemetry domain 和标识体系分布；只观察任一侧不能恢复同一主体的 pre/post context 与权限差，完整检测需要跨边界来源图。
statement_en: An in-container or guest primitive, host-boundary event, and host process or resource outcome are distributed across namespaces, telemetry domains, and identifier systems. Observing either side alone cannot recover one actor's pre-state and post-state contexts and authority difference, so complete detection requires a cross-boundary provenance graph.
