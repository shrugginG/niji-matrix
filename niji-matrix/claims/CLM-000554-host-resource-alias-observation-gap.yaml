statement_zh: 宿主资源命名空间别名投射以 container-visible alias→canonical host resource 映射为稳定键；仍属容器的进程直接访问宿主对象时，只有把 container/cgroup、mount 或 object namespace、path/handle、inode 与规范宿主目标连接，才能避免把同名资源误归为容器对象。
statement_en: Host-Resource Namespace-Alias Projection uses a container-visible-alias-to-canonical-host-resource mapping as its stable key. When a process still attributed to a container directly accesses a host object, defenders need container or cgroup, mount or object namespace, path or handle, inode, and canonical host target joins to avoid misattributing a same-named resource as container-local.
