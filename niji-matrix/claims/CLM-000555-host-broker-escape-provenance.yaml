statement_zh: 宿主 Broker 逃逸来源转换以 original container request/control state→host broker transaction/executor→host-only outcome 为稳定键；runtime socket/API 或 host-consumed callback 让结果侧显示 daemon、helper 或新 workload，单看宿主进程树会遗漏原 container principal。
statement_en: Host-Broker Escape-Provenance Translation uses original-container request or control state to host-broker transaction or executor to host-only outcome as its stable key. A runtime socket or API or host-consumed callback makes the result side show a daemon, helper, or new workload, so host-process-tree-only analysis loses the originating container principal.
