statement_zh: T1611 防御必须先阻断不必要的宿主资源映射、高权限能力和宿主控制通道，再将 workload/container pre-state、boundary primitive 或 request、canonical host resource 或 effective host executor、权限差与首个 host-only result 关联；只告警 privileged、hostPath、socket、syscall 或 CVE 会把风险前提误报为成功逃逸。
statement_en: T1611 defense must first block unnecessary host-resource mappings, high-risk capabilities, and host control channels, then correlate workload or container pre-state, boundary primitive or request, canonical host resource or effective host executor, authority difference, and first host-only result. Alerting only on privileged mode, hostPath, a socket, syscall, or CVE mistakes a risk prerequisite for successful escape.
