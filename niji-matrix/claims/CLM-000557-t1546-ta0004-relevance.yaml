statement_zh: ATT&CK 19.1 将 T1546 映射到 Privilege Escalation，并限定事件动作可由 SYSTEM/service account 等更高权限主体代理；Microsoft 进一步证明 WMI CommandLineEventConsumer 在 local system context 启动进程。因而 NJT-0090 可在 TA0004 下复用，但只有 writer/caller pre-state、被消费对象版本、consumer effective context、正向权限差和首个新获准结果完整时确认提权。
statement_en: ATT&CK 19.1 maps T1546 to Privilege Escalation and qualifies that event actions can be proxied by a higher-authority principal such as SYSTEM or a service account. Microsoft further establishes that WMI CommandLineEventConsumer launches a process in the local-system context. NJT-0090 can therefore be reused under TA0004, but elevation is confirmed only with writer or caller pre-state, the consumed object version, consumer effective context, a positive authority difference, and the first newly authorized result.
