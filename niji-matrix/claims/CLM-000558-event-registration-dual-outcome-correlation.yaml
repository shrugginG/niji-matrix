statement_zh: 同一 registrant—predicate—event—Broker—action 谱系可分别证明跨会话持久恢复与权限提升。TA0004 检测必须将 writer/caller pre-state authorization、exact object/version、实际 consumer token/security context、post-state authorization 和首个 pre-state deny 而 post-state allow 的结果连接；缺少权限集合时保持 authority_unresolved，不得以 SYSTEM/root、受信 Broker 或 action success 补齐。
statement_en: The same registrant-to-predicate-to-event-to-broker-to-action lineage can separately establish cross-session persistence and privilege elevation. TA0004 detection must join writer or caller pre-state authorization, the exact object and version, actual consumer token or security context, post-state authorization, and the first result denied in pre-state but allowed in post-state. Missing authority sets remain authority_unresolved and cannot be filled by SYSTEM or root, a trusted broker, or action success.
