statement_zh: T1068 可适配为 NJT-0102，因为攻击者经 exact vulnerable higher-authority component 或 kernel transition 从已知 pre-state 取得正权限差和首个新增授权结果时，权限结果与正常 grant/approval 事务分离，形成可重建但单点不可见的匿迹对象；CVE、attempt、crash、shell 或 root/SYSTEM 标签均不足。
statement_en: T1068 can be adapted as NJT-0102 because an adversary obtaining a positive authority difference and first newly authorized result from known pre-state through an exact vulnerable higher-authority component or kernel transition separates the authority result from a normal grant or approval transaction, creating a reconstructable but point-invisible evasion object. A CVE, attempt, crash, shell, or root or SYSTEM label is insufficient.
