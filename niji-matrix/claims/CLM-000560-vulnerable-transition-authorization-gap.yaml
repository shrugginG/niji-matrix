id: CLM-000560
claim_type: mechanism-mapping
statement_zh: PwnKit 与 Dirty Pipe 直接表明低权限输入可以经脆弱 SUID consumer 或 kernel state 改变 root 执行/受保护对象而不产生相应正常授权事务；因此只有连接 pre-state、exact vulnerable version、trigger、transition、post-state 和 first privileged effect 才能恢复提权因果。
statement_en: PwnKit and Dirty Pipe directly show low-authority input changing root execution or protected objects through a vulnerable SUID consumer or kernel state without a corresponding normal authorization transaction; only a join across pre-state, exact vulnerable version, trigger, transition, post-state, and first privileged effect can therefore recover elevation causality.
