statement_zh: 将 caller pre-state、exact component/build 与 reachability、trigger/request、fault 或 vulnerable-transition evidence、effective authority 和首个新增授权结果关联，并在预受信组件分支加入 write/discovery、admission policy/version、load/service、interface request 与 kernel effect，可分别输出 exposure、attempt、exploit observed 和 elevation confirmed，避免把漏洞存在或高权限标签当结论。
