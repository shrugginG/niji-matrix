id: CLM-000563
claim_type: mitigation
statement_zh: 版本化资产与可达面、快速修补、按组件启用 exploit mitigations/least privilege，并对预受信脆弱组件实施 exact-version deny/allow、写入与加载阻止、HVCI/等价完整性以及 kernel-compromise 恢复，可减少 NJT-0102 的成功面和来源遮蔽；blocklist 不完整、兼容性和已加载状态必须保留为限制。
statement_en: Versioned asset and reachability inventories, rapid patching, component-specific exploit mitigations and least privilege, plus exact-version deny or allow policy, write and load blocking, HVCI or equivalent integrity, and kernel-compromise recovery for pretrusted vulnerable components reduce NJT-0102 success and provenance masking; incomplete blocklists, compatibility, and already loaded state remain explicit limitations.
