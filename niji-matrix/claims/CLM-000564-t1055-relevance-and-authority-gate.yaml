statement_zh: Enterprise ATT&CK 19.1 将 T1055 映射到 TA0004，并以代码在另一 live process 地址空间执行、借用其 memory/resources 和可能更高权限为父行为；Niji 只有在 source→target mutation/load→dispatch→target-context instruction 完整，且 source pre-state 到 target/post-state 存在正权限差与首个新增授权结果时才确认 TA0004，十二项 ATT&CK 子技术不被导入。
statement_en: Enterprise ATT&CK 19.1 maps T1055 to TA0004 and defines parent behavior as code executing in another live process address space while borrowing its memory, resources, and possibly higher privileges. Niji confirms TA0004 only when source-to-target mutation or load-to-dispatch-to-target-context instruction is complete and source pre-state to target or post-state has a positive authority difference plus first newly authorized result; the twelve ATT&CK children are not imported.
