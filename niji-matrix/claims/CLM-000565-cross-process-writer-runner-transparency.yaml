id: CLM-000565
claim_type: mechanism-mapping
statement_zh: 攻击者在 source 侧取得目标访问并写入、映射或请求加载代码，却让 instruction 与后继结果在另一 target PID/thread 下出现；target 的合法 file/module identity 和 process reputation 替代原 writer，进程单点观察丢失控制来源并形成 NM-BT 行为透明，source-target-memory-dispatch-result 图可反证。
statement_en: An adversary obtains target access and writes, maps, or requests code loading from a source while instructions and follow-on outcomes appear under another target PID or thread. The target's legitimate file or module identity and process reputation replace the original writer, causing point process observation to lose control provenance and create NM-BT Behavioral Transparency; a source-target-memory-dispatch-result graph can disconfirm it.
