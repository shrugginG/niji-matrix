statement_zh: 攻击者能够选择 shellcode、手工映射 image 或被改写的 executable region，使目标进程中实际执行的 payload 没有对应 file backing 或 loader module record；文件扫描、签名与 module inventory 因而缺失载荷，必须用 event-time VAD/backing/content 与 dispatch 关联恢复，支持 NJS-0103-001 的 NM-DO 数据遮蔽。
statement_en: An adversary can select shellcode, a manually mapped image, or a modified executable region so the payload actually executing in the target lacks corresponding file backing or a loader module record. File scanning, signatures, and module inventory therefore omit the payload, requiring event-time VAD, backing, content, and dispatch correlation and supporting NM-DO Data Obscuration for NJS-0103-001.
