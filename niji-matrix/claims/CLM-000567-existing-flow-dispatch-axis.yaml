statement_zh: 攻击者可复用或改写 target 的既有/初始化 thread、APC、TLS callback 或消息 consumer 来触发注入代码，移除 conventional remote-thread start 或使名义 entrypoint 与真实首指令分离；thread context、call stack、callback/message state 成为独立主键，支持 NJS-0103-002 的 NM-BT 行为透明。
statement_en: An adversary can reuse or alter a target's existing or initializing thread, APC, TLS callback, or message consumer to dispatch injected code, removing a conventional remote-thread start or separating the nominal entry point from the true first instruction. Thread context, call stack, and callback or message state become independent keys, supporting NM-BT Behavioral Transparency for NJS-0103-002.
