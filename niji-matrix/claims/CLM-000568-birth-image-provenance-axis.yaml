statement_zh: hollowing 与 transient-image process creation 让 creation callback、path、signature 或 file object 指向合法/已消失内容，而进程首次实际执行的 main image、entry bytes 或 section 已被替换；该可控且可由 birth-time section/file/memory differential 检出的来源差支持 NJS-0103-003 的 NM-FD 特征伪装。
statement_en: Hollowing and transient-image process creation make creation callbacks, path, signature, or file object point to legitimate or disappeared content while the main image, entry bytes, or section actually executed first has been replaced. This controllable provenance difference, detectable through a birth-time section, file, and memory differential, supports NM-FD Feature Disguise for NJS-0103-003.
