statement_zh: 攻击者能够按后继动作选择本来就会执行该资源访问的 target role，例如让 svchost 承担 LSASS 访问或让 browser 承担 C2 网络通信，使 process-name/behavior 规则看到预期主体与动作；该独立 role→payload→action 一致性变量支持 NJS-0103-004 的 NM-FD 特征伪装。
statement_en: An adversary can select a target role that normally performs the downstream resource action, such as svchost for LSASS access or a browser for C2 networking, causing process-name or behavior rules to see an expected subject and action. This independent role-to-payload-to-action conformity variable supports NM-FD Feature Disguise for NJS-0103-004.
