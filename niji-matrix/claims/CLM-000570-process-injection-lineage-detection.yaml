statement_zh: 可靠检测需先把 source/target access、write/map/load、memory protection/backing/content 与 thread/callback/resume 连接为 injection_confirmed，再独立连接 target-context first behavior 与 source-target authority differential；birth-image 和 role-conforming 分支分别要求 process creation file/section/memory 一致性及 role-approved-code-action 一致性，单个 ProcessAccess、RWX、remote thread 或 target behavior 不能替代。
statement_en: Reliable detection first joins source and target access, write, map, or load, memory protection, backing, and content with thread, callback, or resume into injection_confirmed, then independently joins the first target-context behavior and source-target authority differential. Birth-image and role-conforming branches respectively require process-creation file, section, and memory consistency and role, approved-code, and action consistency; one ProcessAccess, RWX region, remote thread, or target behavior cannot substitute.
