id: CLM-000571
claim_type: mitigation
statement_zh: 限制 cross-process access、ptrace/task attach 与高风险 source，按兼容性启用 dynamic-code、code-integrity、protected-process 和 Hardened Runtime 控制，并保留独立 memory/thread/image telemetry，可缩小 T1055 注入面并恢复来源；Yama、Apple entitlement、Microsoft ACG/ASR 等控制均有平台和业务兼容限制，不能声称普遍阻断。
statement_en: Restricting cross-process access, ptrace or task attach, and high-risk sources, enabling dynamic-code, code-integrity, protected-process, and Hardened Runtime controls after compatibility validation, and retaining independent memory, thread, and image telemetry can reduce T1055 injection surface and restore provenance. Yama, Apple entitlement, and Microsoft ACG or ASR controls have platform and business-compatibility limits and cannot be claimed as universal prevention.
