statement_zh: T1053 在 TA0004 下只有在可识别 submitter/pre-state 控制精确 scheduler definition、该版本被准入并触发、动作以实际更高权限 principal/token/capability/ServiceAccount 运行，且完成至少一个 submitter 原本 expected deny、现在 observed allow 的首个资源操作时才确认；任务名、root/SYSTEM、RunLevel、service account 或调度器父进程单独均不足。
statement_en: T1053 under TA0004 is confirmed only when an identifiable submitter or pre-state controls an exact scheduler definition, that version is admitted and triggered, the action runs through an actual higher-authority principal, token, capability, or ServiceAccount, and completes at least one first resource operation expected denied for the submitter and now observed allowed. A task name, root or SYSTEM, RunLevel, service account, or scheduler parent alone is insufficient.
