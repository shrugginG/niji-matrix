statement_zh: 基线合形、观察窗口外延期、状态枚举抑制和短驻一次性代理在权限提升链中分别隐藏定义语义、拉开 submitter 与高权限结果的时间、移除普通对象视图，或以受信 scheduler parent 替代真实提交者；四轴仍需各自证据，而统一的正权限差只作为父级 TA0004 结果门，不产生按账户或平台划分的新子项。
statement_en: In a privilege-elevation chain, baseline conformity hides definition semantics, observation-window deferral separates the submitter from the higher-authority result in time, state-enumeration suppression removes the ordinary object view, and ephemeral one-shot brokerage substitutes a trusted scheduler parent for the true submitter. Each axis still requires its own evidence, while a common positive authority difference is a parent TA0004 result gate and does not create account- or platform-based children.
