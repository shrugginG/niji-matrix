id: CLM-000574
claim_type: detection
statement_zh: 可实施的 T1053/TA0004 防御必须版本化 submitter authority、definition 和 admission，连接 scheduled trigger、actual runtime principal/token/ServiceAccount、first attacker action 与 protected-resource allow/deny，并把同权限执行、权限未决和确认提权分级；最小 scheduler admission、runtime identity 限制、独立枚举与长短窗口生命周期留存共同降低成功与归因缺口。
statement_en: Implementable T1053 and TA0004 defense must version submitter authority, definition, and admission; join scheduled trigger, actual runtime principal, token, or ServiceAccount, first adversary action, and protected-resource allow or deny; and tier same-authority execution, unresolved authority, and confirmed elevation. Least scheduler admission, runtime-identity constraints, independent enumeration, and long- and short-window lifecycle retention jointly reduce success and attribution gaps.
