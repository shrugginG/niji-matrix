statement_zh: T1078 在 TA0004 下只有在同一攻击者从已控制的较低权限前态使用未修改的有效凭据或既有认证会话，系统接受后形成更大的实际授权集合，并完成前态本应拒绝而结果态实际允许的首个受保护资源操作时才成立；成功登录或高权账户标签单独不足。
statement_en: T1078 qualifies under TA0004 only when the same adversary moves from a controlled lower-authority pre-state through an unchanged valid credential or established authenticated session accepted by the system to a larger actual authorization set and completes the first protected-resource operation expected denied for the pre-state but observed allowed for the result; successful logon or a privileged-account label alone is insufficient.
