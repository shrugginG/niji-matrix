statement_zh: 攻击者选择仍有有效权限但长期无合法使用或缺少活跃所有者与交互监控反馈的身份，会减少并发用户冲突、用户报告和常规交互基线信号；该反馈状态可由账户生命周期与所有权控制独立防御，因而构成区别于登录情境和会话续用的稳定匿迹轴。
statement_en: Adversary selection of an identity that retains valid authorization but has no recent legitimate use or weak active-owner and interactive-monitoring feedback reduces concurrent-user conflict user reporting and routine interactive-baseline signals; this feedback state has independent account-lifecycle and ownership defenses and therefore forms a stable stealth axis distinct from sign-in context and session reuse.
