statement_zh: 有效身份提权检测必须把攻击者较低权限前态、被接受的精确身份/会话、实际 resulting principal/token 及事件时授权、首个攻击者资源操作和授权结果连接为连续谱系；Windows 可用同一 Logon ID 连接 4624、4672 与 4663，云环境应连接 sign-in 的 identity/client/resource、session/token 与资源审计，任一单点只能产生较低层结论。
statement_en: Detection of privilege escalation through a valid identity must join the adversary's lower-authority pre-state the exact accepted identity or session actual resulting principal or token and event-time authorization the first adversary resource operation and its authorization result into continuous lineage; Windows can join 4624 4672 and 4663 by Logon ID while cloud environments should join sign-in identity client and resource session or token and resource audit, and any single point supports only a lower-tier conclusion.
