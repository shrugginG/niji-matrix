statement_zh: 攻击者能够在投递高价值载荷前通过远程交互判断目标是否为诱捕或仿真环境，并让判断结果控制后续行为，因此该行为直接降低防守方观察完整攻击链的机会。
statement_en: Adversaries can assess through remote interaction whether a target is a trapping or emulated environment before delivering high-value payloads and can condition follow-on behavior on that assessment, directly reducing defenders' opportunity to observe the complete attack chain.
