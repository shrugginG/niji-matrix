statement_zh: 将多个远程可见表面的响应放入同一差分挑战序列，可以暴露静态横幅、浅层状态机或运行语义之间的不一致，并使防守方必须按会话和目标关联原本类似普通测量的请求。
statement_en: Placing responses from multiple remotely visible surfaces into one differential challenge sequence can expose inconsistencies among static banners, shallow state machines, and operational semantics, requiring defenders to correlate requests that individually resemble ordinary measurement by session and target.
