statement_zh: 现有指纹分类研究表明，若攻击者跨相关节点和部署变化重复比较暴露寿命、同步变化与响应时序，就可能在外部形成诱捕部署真实性画像；但公开证据尚未充分证明真实攻击者普遍使用该操作模式。
statement_en: Existing fingerprint-taxonomy research indicates that repeated comparison of exposure lifetime, synchronized
  change, and response timing across related nodes and deployment changes could form an external authenticity profile of a
  deception deployment, but public evidence does not yet establish widespread real-adversary use of this operating pattern.
