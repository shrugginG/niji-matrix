type: claim
id: CLM-000582
claim_type: technique-relevance
statement_zh: 攻击者可向容器构建 API 提交上下文，在宿主内部从正常基础镜像和外部载荷生成新镜像，从而避免直接拉取已知恶意成品镜像，并把观察链分散到构建请求、构建步骤、本地镜像和部署事件。
statement_en: An adversary can submit context to a container build API and generate a new image on-host from a benign base image and external payload, avoiding direct retrieval of a known malicious finished image and distributing the observation chain across build request, build steps, local image, and deployment events.
subject_refs: [NJT-0105, NM-BT, NM-FD]
evidence_refs: [REF-000383, REF-000384, REF-000412]
evidence_mode: directly-observed
confidence: high
status: review
