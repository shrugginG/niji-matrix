id: CLM-000584
claim_type: technique-relevance
statement_zh: >-
  调试器规避可以通过两条不同因果路径降低观察完整性：调试状态可以门控退出、诱饵或载荷保留，调试消息、异常或线程操作也可直接损坏调试通道的处理预算与完整性；两者均使防守方只观察到不完整或失真的执行路径。
statement_en: >-
  Debugger evasion can reduce observation completeness through two distinct causal paths: debugger state can gate exit, decoy,
  or payload withholding, while debug messages, exceptions, or thread operations can directly degrade debug-channel processing
  budget and integrity. Both cause defenders to observe an incomplete or distorted execution path.
