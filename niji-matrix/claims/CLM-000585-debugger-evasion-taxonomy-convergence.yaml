statement_zh: 公开证据支持两个防御不可互换的调试规避变量：状态条件化行为收敛需要调试开关与后续结果差分，观察通道饱和需要调试消息或异常事件的密度、价值和资源消耗分析。线程隐藏与拒绝附加仍缺少独立结论级来源，保留在父级或 evidence-deferred；API、平台、调试器产品和具体检查字段不形成兄弟边界。
statement_en: Public evidence supports two debugger-evasion variables with non-interchangeable defense. Debug-state-conditioned
  behavior contraction requires debugger-on/off outcome differential, while observation-channel saturation requires density,
  value, and resource-consumption analysis of debug messages or exception events. Thread hiding and attach denial still lack
  independent conclusion-level sources and remain parent-core or evidence-deferred. APIs, platforms, debugger products, and
  individual check fields do not define siblings.
