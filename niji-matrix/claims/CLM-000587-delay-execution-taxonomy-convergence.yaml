statement_zh: 延迟执行的实证支持两个稳定且防御不可互换的痕迹变量：休眠、计时器和绝对时间门控在窗口内产生低事件密度的静默等待，而 ping、循环和 API hammering 产生高密度低价值工作。由调度器保存独立未来触发条件的行为与 T1053 调度技术相邻，不作为第三子项。
statement_en: Evidence for Delay Execution supports two stable trace variables with non-interchangeable defense. Sleep, timers,
  and absolute-time gates produce low-event-density quiescent waiting inside the window, while ping, loops, and API hammering
  produce high-density low-value work. Behavior in which a scheduler preserves an independent future trigger is adjacent
  to T1053 scheduling and does not form a third child here.
