statement_zh: 公开证据支持两个防御不可互换的门控变量：显式目标属性匹配需要恢复比较与匹配/失配后继差分，环境派生密码激活还需要连接环境材料、密钥派生、密文恢复和执行。字段、平台、算法与客户端或服务端位置是实现；通用互斥缺少目标选择和独立匿迹边界，不形成子技术。
statement_en: Public evidence supports two gating variables with non-interchangeable defense. Explicit target-attribute matching
  requires recovery of the comparison and matched-versus-unmatched successor differential, while environment-derived cryptographic
  activation additionally requires joining environmental material, key derivation, ciphertext recovery, and execution. Fields,
  platforms, algorithms, and client- or server-side location are implementations. Generic mutual exclusion lacks target selection
  and an independent stealth boundary and does not form a child.
