statement_zh: 公开证据支持四个恢复方法不可互换的变量：证据对象擦除删除节点，操作关系拆除删除边，时间元数据伪造破坏排序，载荷位置迁移保留内容但切换地址与消费者。文件、邮箱、平台和工具仍是载体，不定义更多兄弟项。
statement_en: Public evidence supports four variables with non-interchangeable recovery methods. Evidence-object erasure removes
  nodes, operational-relationship teardown removes edges, temporal-metadata falsification corrupts ordering, and payload-location
  migration preserves content while switching address and consumer. Files, mail, platforms, and tools remain carriers and
  do not define additional siblings.
