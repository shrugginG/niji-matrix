statement_zh: 公开证据支持两个防御不可互换的实用程序代理变量：一次性输入在同一进程事务内立即代理，持久配置由未来连接或生命周期事件消费。工具、二进制或脚本身份、参数语法和目标命令是实现，不形成更多兄弟项。
statement_en: Public evidence supports two utility-proxy variables with non-interchangeable defense. One-shot input proxies
  immediately within one process transaction, while durable configuration is consumed by a future connection or lifecycle
  event. Utility, binary or script identity, argument syntax, and target command are implementations and do not define more
  siblings.
