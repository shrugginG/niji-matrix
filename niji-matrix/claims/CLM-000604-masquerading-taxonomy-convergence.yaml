statement_zh: 子技术应按被替代的身份判断及其验证事实源划分，而不是按文件、任务、服务、账户或浏览器等载体划分；受信资源、类型呈现、执行谱系和客户端指纹需要不同关联键，构成四项边界。
statement_en: Children should be divided by the identity judgment being substituted and its verification source of truth rather than by file, task, service, account, or browser carrier. Trusted resource, type presentation, execution lineage, and client fingerprint require different correlation keys and form four boundaries.
