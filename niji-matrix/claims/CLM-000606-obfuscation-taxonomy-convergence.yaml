statement_zh: 子技术应按真实语义缺失于可见表示的方式和不可互换的恢复路径划分，而不是按算法、格式或平台划分；可逆变换、静态特征畸变、载体嵌入和运行时物化分别需要变换链、语义相似、内外载体谱系和生成结果关联。
statement_en: Children should be divided by how real semantics are absent from the visible representation and by non-interchangeable recovery paths rather than by algorithm, format, or platform. Reversible transformation, static feature distortion, carrier embedding, and runtime materialization respectively require transform lineage, semantic similarity, outer-to-inner carrier lineage, and generated-outcome correlation.
