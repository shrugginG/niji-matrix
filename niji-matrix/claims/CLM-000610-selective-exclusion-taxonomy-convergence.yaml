statement_zh: 文件、目录、扩展名和组件仍只是主机内选择谓词的目标，但按主机角色终止整个恶意流程会产生跨资产覆盖差分；因此按主机内对象保留与角色条件整机保留划分，而不按目标类型或匹配语法划分。
statement_en: Files, directories, extensions, and components remain targets of an in-host selection predicate, but terminating the whole malicious workflow by host role creates a cross-asset coverage differential. The taxonomy therefore separates in-host object preservation from role-conditioned whole-host preservation rather than target type or matching syntax.
