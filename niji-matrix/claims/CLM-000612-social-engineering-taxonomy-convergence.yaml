statement_zh: 人员或组织的关系权威冒充需要关系历史、职能角色与独立确认，而邮件传输来源伪造需要 SPF、DKIM、DMARC、ARC 和消息追踪；二者事实源与预防控制不可互换，形成两个子技术，但通信介质本身不成项。
statement_en: Relational-authority impersonation of a person or organization requires relationship history, functional role, and independent confirmation, while email-transport provenance forgery requires SPF, DKIM, DMARC, ARC, and message trace. Their sources of truth and preventive controls are non-interchangeable and form two children, while communication medium itself does not.
