statement_zh: 文档格式、模板后缀和协议不构成子技术；远程内容替换与引用诱发认证分别需要响应/执行谱系和认证/披露谱系，主要结果与防御不可互换，因此形成两个 Niji 子技术。
statement_en: Document format, template suffix, and protocol do not define children. Remote-content substitution and reference-induced authentication respectively require response-to-execution lineage and authentication-to-disclosure lineage, with non-interchangeable primary outcomes and defenses, and therefore form two Niji children.
