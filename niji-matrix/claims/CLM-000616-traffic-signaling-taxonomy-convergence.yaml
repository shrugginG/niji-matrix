statement_zh: 协议和端口不构成子技术；需要累计多个有序事件的状态序列与由单包字段或内容触发的过滤匹配分别要求跨包状态机和包内容—过滤器—socket 关联，形成两个防御不可互换的 Niji 子技术。
statement_en: Protocol and port do not define children. A stateful sequence that accumulates several ordered events and a filter match triggered by one packet field or content respectively require a cross-packet state machine and packet-content-to-filter-to-socket correlation, forming two defensively non-interchangeable Niji children.
