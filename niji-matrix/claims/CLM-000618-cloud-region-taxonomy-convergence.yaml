statement_zh: 云厂商、区域名称和服务类型不构成子技术；历史/批准区域使用差分与区域安全控制覆盖差分分别需要主体/资源基线和逐区域控制清单，形成两个可组合但防御不可互换的 Niji 子技术。
statement_en: Cloud provider, Region name, and service type do not define children. Historical or approved Region-use differentials and regional security-control-coverage differentials respectively require principal or resource baselines and Region-by-Region control inventories, forming two composable but defensively non-interchangeable Niji children.
