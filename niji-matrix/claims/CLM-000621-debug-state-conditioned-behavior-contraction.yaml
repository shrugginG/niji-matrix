type: claim
id: CLM-000621
claim_type: subtechnique-existence
statement_zh: 当程序读取调试器存在状态，并在有调试器条件下稳定退出、跳转至诱饵路径或不释放载荷时，攻击者控制的稳定变量是“调试状态对后续行为的门控”，而不是查询 API 或操作系统。
statement_en: When a program reads debugger-presence state and consistently exits, selects a decoy path, or withholds a payload
  when debugging is present, the stable attacker-controlled variable is debugger-state gating of successor behavior rather
  than a query API or operating system.
subject_refs: [NJT-0106, NJS-0106-001]
