statement_zh: 攻击者可用随机注册表、文件 I/O、ping 或其他低价值操作消耗分析时间，在窗口内生成高密度但表面正常的工作痕迹，并把载荷解包或注入延迟到窗口之后；该变量需要工作价值与后续结果分析，与静默等待的防御不可互换。
statement_en: Adversaries can consume analysis time with random Registry, file-I/O, ping, or other low-value operations, producing
  high-density but superficially normal work traces inside the window and delaying payload unpacking or injection until afterward.
  This variable requires work-value and successor-outcome analysis and is not defensively interchangeable with quiescent waiting.
