statement_zh: 当目标环境值进入密钥派生且只有正确环境才能恢复核心内容时，检测必须连接环境材料、派生操作、解密成功与后继执行；这与可直接观察比较分支的门控形成不可互换的防御边界。
statement_en: When target-environment values feed key derivation and only the correct environment can recover core content,
  detection must join environmental material, derivation operations, successful decryption, and successor execution, creating
  a defense boundary that is not interchangeable with directly observable comparison-branch gating.
