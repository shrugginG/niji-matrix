type: claim
id: CLM-000628
claim_type: technique-boundary
statement_zh: 当漏洞让已认证主体从受信管理接口逃逸到其背后的底层执行环境，活动会脱离接口命令模型和常规传感器归因；检测需连接接口输入、边界转换和底层结果，形成独立边界。
statement_en: When a vulnerability lets an authenticated principal escape from a trusted management interface into its underlying
  execution environment, activity leaves the interface command model and ordinary sensor attribution. Detection must join
  interface input, boundary transition, and underlying outcome, forming an independent boundary.
subject_refs: [NJT-0110, NJS-0110-002]
evidence_refs: [REF-000391, REF-000423]
evidence_mode: directly-observed
confidence: high
status: review
