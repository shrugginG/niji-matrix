statement_zh: 断开网络共享、连接历史或持久化关系可在端点对象仍存在时删除活动图中的边，检测需要会话或关系前态、拆除主体和先前用途，形成独立关系恢复边界。
statement_en: Detaching network shares, connection history, or persistence relationships can remove edges from the activity
  graph while endpoint objects still exist. Detection requires prior session or relation state, teardown principal, and prior
  use, forming an independent relation-recovery boundary.
