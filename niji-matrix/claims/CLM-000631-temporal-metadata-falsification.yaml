statement_zh: 攻击者回写创建、访问或修改时间会保留对象和内容但使时间排序不可信，检测必须比较多套时间属性、写入事件和独立序列，因此形成独立于删除的时间解释边界。
statement_en: Adversary rewriting of creation, access, or modification times preserves object and content while making temporal
  ordering untrustworthy. Detection must compare multiple timestamp sets, write events, and independent sequence, forming
  a temporal-interpretation boundary distinct from deletion.
