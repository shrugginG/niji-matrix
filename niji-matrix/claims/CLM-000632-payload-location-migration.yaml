statement_zh: 载荷位置迁移保留内容身份并把后继消费切换到新路径，削弱最初投递与当前执行的路径关联；检测需用内容摘要和消费谱系跨位置连接，形成独立防御边界。
statement_en: Payload-location migration preserves content identity while switching successor consumption to a new path and
  weakening path linkage between initial delivery and current execution. Detection must join locations through content digest
  and consumption lineage, forming an independent defense boundary.
