claim_type: technique-boundary
statement_zh: 一次性参数、标准输入或调用文件使受信实用程序立即启动攻击者命令时，检测围绕同一进程事务恢复请求者、输入和结果，形成即时实用程序调用代理边界。
statement_en: When one-shot arguments, standard input, or an invocation file cause a trusted utility to start an adversary
  command immediately, detection recovers requester, input, and outcome within one process transaction, forming the Immediate
  Utility Invocation Proxying boundary.
