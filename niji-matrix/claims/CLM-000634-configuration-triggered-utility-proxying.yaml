id: CLM-000634
claim_type: technique-boundary
statement_zh: 当持久实用程序配置保存攻击者命令并由后续连接或生命周期事件触发时，检测必须跨越配置写入与未来消费并恢复配置版本，形成与一次调用事务不可互换的边界。
statement_en: When durable utility configuration stores an adversary command and a later connection or lifecycle event triggers
  it, detection must span configuration write and future consumption and recover the configuration version, forming a boundary
  not interchangeable with a one-invocation transaction.
