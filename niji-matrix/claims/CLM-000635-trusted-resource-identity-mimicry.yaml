id: CLM-000635
claim_type: technique-boundary
statement_zh: 当恶意文件、任务、服务、账户或工具借用合法名称、位置、发布者或签名外观时，检测必须恢复稳定对象身份、来源与行为，而不是解析显示类型，形成受信资源身份拟态边界。
statement_en: When a malicious file, task, service, account, or utility borrows a legitimate name, location, publisher, or
  signature appearance, detection must recover stable object identity, provenance, and behavior rather than parse displayed
  type, forming the Trusted Resource Identity Mimicry boundary.
