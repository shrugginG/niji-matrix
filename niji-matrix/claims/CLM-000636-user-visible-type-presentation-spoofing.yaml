statement_zh: 双扩展名、方向控制字符、尾随空白或图标可让用户界面呈现的文件类型与原始头和实际执行类型不一致，检测需比较显示字符串与规范解析结果，形成独立边界。
statement_en: Double extensions, directional controls, trailing whitespace, or icons can make user-interface file type differ
  from raw header and actual execution type. Detection must compare rendered strings with canonical parse results, forming
  an independent boundary.
