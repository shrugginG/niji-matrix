statement_zh: 攻击者借助 WMI、代理进程或等价 broker 改变可见父子关系，使实际请求来源与执行谱系分离；检测需要控制面请求与稳定进程身份，形成执行谱系伪装边界。
statement_en: Adversary use of WMI, proxy processes, or equivalent brokers can change visible parent-child relationships and
  separate real requester from execution lineage. Detection requires control-plane request and stable process identity, forming
  the Execution Lineage Camouflage boundary.
