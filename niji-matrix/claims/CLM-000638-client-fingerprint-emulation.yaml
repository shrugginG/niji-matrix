type: claim
id: CLM-000638
claim_type: technique-boundary
statement_zh: 非浏览器进程可采集并复用目标浏览器的 User-Agent 或其他客户端指纹，使网络请求呈现为用户客户端；检测必须比较网络指纹、进程和真实 GUI 会话，形成独立边界。
statement_en: A non-browser process can collect and reuse the target browser's User-Agent or other client fingerprint so network
  requests appear to originate from a user client. Detection must compare network fingerprint, process, and real GUI session,
  forming an independent boundary.
subject_refs: [NJT-0114, NJS-0114-004]
evidence_refs: [REF-000399, REF-000431]
evidence_mode: directly-observed
confidence: high
status: review
