id: CLM-000641
claim_type: technique-boundary
statement_zh: 把载荷嵌入图像、HTML、SVG、LNK 图标、文档或非文件存储载体，会让外层对象保持良性类型而真实内容需专用提取器恢复，形成载体嵌入遮蔽边界。
statement_en: Embedding a payload in an image, HTML, SVG, LNK icon, document, or non-file storage carrier leaves the outer
  object with a benign type while a specialized extractor is required to recover real content, forming the Carrier-Embedded
  Payload Concealment boundary.
