statement_zh: 投递后编译、哈希 API 解析或运行时生成使静态对象不含完整调用或可执行语义，检测必须关联生成/解析输入、内存结果与后继行为，形成运行时语义物化边界。
statement_en: Compile-after-delivery, hashed API resolution, or runtime generation leaves the static object without complete
  call or executable semantics. Detection must join generation or resolution input, memory result, and successor behavior,
  forming the Runtime Semantic Materialization boundary.
