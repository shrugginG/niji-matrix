id: CLM-000643
claim_type: technique-boundary
statement_zh: 根套件可在共享查询路径返回调用者之前按对象选择器移除进程、文件或网络条目，使真实活动继续而多个依赖该路径的工具共同遗漏；检测需要查询输入、返回集合、下层对象和 hook 来源，形成查询路径结果过滤边界。
statement_en: A rootkit can remove selected process, file, or network entries before a shared query path returns to callers, leaving real activity running while multiple tools dependent on that path omit it. Detection requires query input, returned set, lower-layer object, and hook provenance, forming the Query-Path Result Filtering boundary.
