id: CLM-000644
claim_type: technique-boundary
statement_zh: 根套件可直接修改仅用于枚举或报告的内核对象链、注册表长度或类型等查询背衬状态，使真实资源保持运行但正确未修改的查询代码仍得到脱钩视图；检测需要动态结构完整性和独立对象存在性，形成不同于 hook 过滤的边界。
statement_en: A rootkit can directly modify query-backing state such as kernel object lists or Registry length and type values used only for enumeration or reporting, leaving the real resource running while correct unmodified query code receives a detached view. Detection requires dynamic-structure integrity and independent object existence, forming a boundary distinct from hook filtering.
