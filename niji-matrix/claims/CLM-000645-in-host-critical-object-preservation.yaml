id: CLM-000645
claim_type: technique-boundary
statement_zh: 恶意加密或擦除流程在单一主机内按路径、扩展名或组件语义保留启动、应用与通知所需对象，同时处理其他对象；检测需要同一资产的枚举、谓词和处理覆盖率，形成主机内关键对象保留边界。
statement_en: A malicious encryption or wipe workflow can preserve objects required for boot, applications, and notification within one host by path, extension, or component semantics while processing other objects. Detection requires enumeration, predicate, and processing coverage on the same asset, forming the In-Host Critical-Object Preservation boundary.
