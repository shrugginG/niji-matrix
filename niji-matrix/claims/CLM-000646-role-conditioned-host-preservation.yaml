statement_zh: 破坏载荷可按域控制器等主机角色整体终止或跳过执行，使角色关键资产保留而其他同批资产被处理；检测必须比较部署范围、主机角色、启动结果和破坏覆盖，形成跨资产角色条件保留边界。
statement_en: A destructive payload can terminate or skip execution for an entire host based on a role such as domain controller, preserving role-critical assets while other assets in the same deployment are processed. Detection must compare deployment scope, host role, launch result, and destructive coverage, forming the cross-asset Role-Conditioned Host Preservation boundary.
