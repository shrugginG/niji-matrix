type: claim
id: CLM-000647
claim_type: technique-boundary
statement_zh: 攻击者可在聊天、语音、邮件或服务流程中冒充具有可信关系或职能权威的人员或组织，促使用户完成敏感动作；检测需要关系历史、业务角色、独立确认和用户结果，而非只验证传输协议，形成关系权威冒充边界。
statement_en: An adversary can impersonate a person or organization with a trusted relationship or functional authority in chat, voice, mail, or service workflows and induce a sensitive user action. Detection requires relationship history, business role, independent confirmation, and user outcome rather than transport authentication alone, forming the Relational-Authority Impersonation boundary.
subject_refs: [NJT-0118, NJS-0118-001]
