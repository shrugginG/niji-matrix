type: claim
id: CLM-000648
claim_type: technique-boundary
statement_zh: 攻击者可修改邮件头或利用弱 DMARC 策略，使显示 From 域与实际 MAIL FROM、DKIM 签名域或发送基础设施不一致却仍被投递；检测和缓解依赖 SPF、DKIM、DMARC、ARC 与消息追踪，形成邮件传输来源伪造边界。
statement_en: An adversary can alter mail headers or exploit weak DMARC policy so the displayed From domain differs from the real MAIL FROM, DKIM signing domain, or sending infrastructure while the message is still delivered. Detection and mitigation depend on SPF, DKIM, DMARC, ARC, and message trace, forming the Email-Transport Provenance Forgery boundary.
