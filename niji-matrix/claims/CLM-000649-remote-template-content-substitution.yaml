id: CLM-000649
claim_type: technique-boundary
statement_zh: 文档外部关系可在打开时取得由攻击者按请求提供的宏、脚本或模板内容，使静态文件缺少最终可执行语义；检测必须连接关系、响应摘要、缓存与执行结果，形成远程模板内容替换边界。
statement_en: An external document relationship can retrieve macro, script, or template content supplied by an adversary at open time, leaving the static file without final executable semantics. Detection must join relationship, response digest, cache, and execution outcome, forming the Remote-Template Content Substitution boundary.
