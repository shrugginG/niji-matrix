statement_zh: 文档解析攻击者控制的外部模板或资源时可触发认证对话或自动网络认证，用户凭据或认证材料成为主要结果而无需执行远程代码；检测需要引用、认证目标、交互与披露结果，形成引用诱发认证边界。
statement_en: Resolving an adversary-controlled external template or resource can trigger an authentication dialog or automatic network authentication,
  making user credentials or authentication material the primary outcome without requiring remote code execution. Detection requires reference,
  authentication target, interaction, and disclosure outcome, forming the Reference-Induced Authentication boundary.
