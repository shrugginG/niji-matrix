statement_zh: 隐藏功能可要求来自同一来源的有序端口或数据包事件累计到匹配状态后才修改防火墙、开放监听或连接回操作者；检测需要跨包状态机和顺序关联，形成有状态信号序列激活边界。
statement_en: Hidden functionality can require an ordered set of port or packet events from one source to accumulate
  into a matched state before modifying a firewall, opening a listener, or connecting back to the operator. Detection
  requires a cross-packet state machine and order correlation, forming the Stateful Signal-Sequence Activation boundary.
