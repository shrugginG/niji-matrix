claim_type: technique-boundary
statement_zh: 内核或用户态包过滤器可在任意正常端口收到单个特殊头字段、魔数或载荷模式时重定向流量或激活后门，使真实监听端口保持隐藏；检测需要包内容、过滤器命中与目标 socket 关联，形成内容模式数据包激活边界。
statement_en: A kernel or user-space packet filter can redirect traffic or activate a backdoor when any normal port receives
  one special header field, magic value, or payload pattern, leaving the real listening port hidden. Detection requires
  packet content, filter match, and target-socket correlation, forming the Content-Pattern Packet Activation boundary.
