id: CLM-000653
claim_type: technique-boundary
statement_zh: 攻击者把资源或 API 活动移到历史未使用、未批准或与主体常规区域不同的地域，会使活动脱离区域使用基线；检测需要全局资源、身份、账单和首次区域使用历史，形成区域使用基线外放置边界。
statement_en: Moving resources or API activity into a geography that is historically unused, unapproved, or different from a principal's normal Regions displaces activity from the regional usage baseline. Detection requires global resource, identity, billing, and first-Region-use history, forming the Region-Usage Baseline Displacement boundary.
