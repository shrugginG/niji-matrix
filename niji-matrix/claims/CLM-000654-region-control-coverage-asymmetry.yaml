id: CLM-000654
claim_type: technique-boundary
statement_zh: 攻击者可选择日志、安全服务、网络传感器、策略或响应权限弱于常用区域的地域，即使该区域并非完全未使用；检测需要按区域比较控制部署与活动结果，形成区域控制覆盖不对称边界。
statement_en: An adversary can choose a geography where logging, security services, network sensors, policy, or responder authority is weaker than in common Regions even when the Region is not entirely unused. Detection requires Region-by-Region comparison of control deployment and activity outcome, forming the Region-Control Coverage Asymmetry boundary.
subject_refs: [NJT-0121, NJS-0121-002]
