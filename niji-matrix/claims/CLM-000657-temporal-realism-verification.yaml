id: CLM-000657
claim_type: technique-boundary
statement_zh: 程序可比较系统运行时间、睡眠前后时钟、指令耗时或时间加速一致性来判断分析环境，并在时间不真实时退出或保留载荷；检测需要时钟与执行加速差分，形成时间真实性校验边界。
statement_en: A program can compare system uptime, clocks before and after sleep, instruction timing, or consistency under time acceleration to classify an analysis environment and exit or withhold a payload when time is unrealistic. Detection requires clock and execution-acceleration differentials, forming the Temporal Realism Verification boundary.
