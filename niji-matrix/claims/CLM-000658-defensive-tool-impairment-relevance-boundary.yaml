statement_zh: 当攻击者直接改变安全工具、传感器、日志或响应链并使预期防御能力全部或部分失效时，直接对象是防御工具功能削弱；普通管理介质、自然故障和事后历史擦除不因外观相似而自动属于该对象。
statement_en: When adversary-directed change to a security tool, sensor, logging path, or response chain causes an expected defensive capability to fail wholly or partially, the direct object is Defensive Tool Function Impairment; ordinary administration media, natural failure, and post-hoc history erasure do not enter scope merely because they look similar.
