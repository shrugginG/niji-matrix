statement_zh: 攻击者可以使安全进程、服务、传感器、模块或更新功能整体不可用，使后续活动失去广泛防护与遥测，同时留下组件状态变化和心跳中断这一独立观察边界。
statement_en: An adversary can make a security process, service, sensor, module, or update function wholly unavailable, removing broad protection and telemetry for follow-on activity while leaving component-state changes and heartbeat loss as a distinct observation boundary.
