statement_zh: 攻击者能够在工具仍运行并可能继续报到时，通过排除项、规则、提供程序或目标范围变更仅移除攻击者选择对象的防护，形成与完整停用不同的配置范围差分与误导性健康外观。
statement_en: While a tool remains running and may continue to check in, an adversary can use exclusions, rules, provider changes, or target-scope changes to remove protection only for selected objects, creating a configuration-scope differential and misleading healthy appearance distinct from whole-tool disablement.
