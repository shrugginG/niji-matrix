id: CLM-000661
claim_type: subtechnique-existence
statement_zh: 攻击者可以在事件进入持久独立存储前条件化跳过、重定向或丢弃选定遥测，使独立活动仍存在而安全事件从未形成；这一边界不同于事件已经写入后的删除。
statement_en: An adversary can conditionally skip, redirect, or drop selected telemetry before it reaches durable independent storage so independent activity remains while the security event never forms; this boundary is distinct from deletion after an event has already been stored.
