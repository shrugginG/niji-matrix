statement_zh: 攻击者能够让操作员界面继续显示健康、进度或成功，同时真实服务、版本或功能结果保持受损，从而建立必须依赖独立状态和 canary 结果识别的反馈保真度差分。
statement_en: An adversary can keep an operator interface displaying health, progress, or success while the real service, version, or functional outcome remains impaired, creating a feedback-fidelity differential that requires independent state and canary outcomes to identify.
