type: claim
id: CLM-000664
claim_type: mitigation
statement_zh: 将工具控制权与工作负载权限分离、保护安全配置与排除项、把遥测和健康证据写入不同权的远程存储，并以签名版本和功能测试验证恢复，可缩小可篡改面并缩短未被确认的防御盲区，但不能保证抵御同权管理面或内核完全失陷。
statement_en: Separating tool-control authority from workload privilege, protecting security configuration and exclusions, writing telemetry and health evidence to a differently authorized remote store, and validating recovery with signed versions and functional tests can reduce tamper surface and shorten unconfirmed defensive blind intervals, but cannot guarantee resistance to a co-authorized management plane or complete kernel compromise.
