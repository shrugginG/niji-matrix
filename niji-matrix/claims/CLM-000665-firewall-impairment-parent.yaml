statement_zh: 攻击者直接改变系统防火墙有效策略，使原本应拒绝的网络会话被允许或重定向，并削弱防守方对真实网络入口的控制与判断；只有配置变化而无有效裁决或后继流量时不得宣称成功削弱。
statement_en: An adversary directly changes effective system-firewall policy so a network session expected to be denied is allowed or redirected, weakening defender control and interpretation of the real network entry; a configuration change without effective decision or follow-on flow does not establish successful impairment.
