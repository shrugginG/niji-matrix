statement_zh: 攻击者可增加或放宽仅匹配所需来源、端口、服务或目标的规则，保留其他正常阻断背景并形成局部可达性差分；仅有规则新增而无命中会话时只能证明暴露。
statement_en: An adversary can add or relax a rule matching only a needed source, port, service, or target, preserving other normal denials and creating a local reachability differential; a new rule without a matching session establishes exposure only.
