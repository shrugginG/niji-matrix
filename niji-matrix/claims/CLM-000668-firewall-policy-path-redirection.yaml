id: CLM-000668
claim_type: subtechnique-existence
statement_zh: 攻击者可通过来源限定的防火墙 NAT/REDIRECT 让表面正常的入口流量到达隐藏监听或后门，防守方需把 NAT 前目的地、命中规则、NAT 后目的地与接收进程连接才能恢复真实路径。
statement_en: An adversary can use source-limited firewall NAT or REDIRECT so traffic entering through an apparently ordinary destination reaches a concealed listener or backdoor; defenders must join pre-NAT destination, matched rule, post-NAT destination, and receiving process to recover the real path.
subject_refs: [NJT-0124, NJS-0124-003]
