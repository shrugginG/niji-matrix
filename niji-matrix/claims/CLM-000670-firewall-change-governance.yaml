id: CLM-000670
claim_type: mitigation
statement_zh: 将防火墙管理权限与普通主机及工作负载权限分离、保护签名策略基线、对高风险变更要求精确审批，并从独立路径验证规则有效性与恢复结果，可提高攻击者建立暗门的成本，但不能替代受侵管理面的离线重建。
statement_en: Separating firewall administration from ordinary host and workload authority, protecting signed policy baselines, requiring exact approval for high-risk changes, and validating effective rules and recovery from an independent path can raise the cost of creating a hidden opening but cannot replace offline rebuilding of a compromised management plane.
