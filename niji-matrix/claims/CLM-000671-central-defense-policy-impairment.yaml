statement_zh: 域或租户权威策略可以由攻击者写入后通过受信传播和消费者应用改变多处安全控制，但 TA0112 的成功防御削弱必须由被采用的版本与实际防护结果证实；策略创建或 GPO 刷新不等于损伤。
statement_en: An adversary can write authoritative domain or tenant policy that changes security controls through trusted propagation and consumer application, but completed TA0112 impairment requires the adopted version and real protection outcome; policy creation or GPO refresh alone is not damage.
