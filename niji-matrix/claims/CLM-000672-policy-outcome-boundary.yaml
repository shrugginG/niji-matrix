statement_zh: 同一 T1484 实现若只削弱 Defender、审计或响应而未给攻击主体新增资源权限，应归 TA0112；实际权限正差属于 NJT-0100，认证证明例外属于 NJT-0093，策略触发的载荷执行属于执行对象。
