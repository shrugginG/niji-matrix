statement_zh: 云资源的父节点或组织成员关系决定继承策略和集中观察范围；攻击者控制 ancestry 变化并使同一活动落在较弱 guardrail、日志或检测覆盖下时，直接对象是层级造成的防御覆盖位移而非策略文本改写。
