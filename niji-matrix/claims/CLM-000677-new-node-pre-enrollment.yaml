statement_zh: 攻击者可新建云账户或订阅并在要求的治理注册、日志和检测配置完成前承载资源活动；正式确认需要证明新节点首个活动与实际控制缺口重叠，单纯创建与使用不能证明失明。
statement_en: An adversary can create a cloud account or subscription and use it before required governance enrollment, logging, and detection configuration complete. Formal confirmation requires first activity overlapping a real control gap; creation and use alone do not prove blindness.
