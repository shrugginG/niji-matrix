statement_zh: 限制成员离开与资源移动权限、要求新节点先完成日志和 guardrail 注册再运行工作负载，并在管理账户保留组织外独立成员清单与历史事件，可缩短层级导致的观察缺口，但不能取回离开后从未采集的数据。
statement_en: Restricting membership departure and resource moves, enrolling new nodes in logging and guardrails before workload use, and retaining independent management-account membership inventory and historical events outside the member shorten hierarchy-driven observation gaps but cannot recover data never collected after departure.
