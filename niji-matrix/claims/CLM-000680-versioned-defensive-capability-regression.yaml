statement_zh: 版本回退只有在较旧组件被实际执行或加载且相对批准基线缺少脚本审计、受信启动或其他安全能力时，才构成可确认的防御削弱；版本标签和安装成功消息本身不证明有效状态。
statement_en: A rollback is confirmed defensive impairment only when an older component actually executes or loads and lacks script auditing, trusted boot, or another security capability relative to the approved baseline; a version label or successful installation message does not prove effective state.
