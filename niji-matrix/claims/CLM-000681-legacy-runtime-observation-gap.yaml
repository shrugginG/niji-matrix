statement_zh: 攻击者使脚本在缺少预期脚本块审计的旧运行时执行时，进程与引擎版本仍可见而内容事件缺席；与安装旧运行时不同，实际执行和审计差构成独立可观察变量。
statement_en: When adversary scripts execute in a legacy runtime without expected script-block auditing, process and engine versions remain visible while content events are absent. Actual execution plus audit differential, unlike mere installation, forms an independently observable variable.
