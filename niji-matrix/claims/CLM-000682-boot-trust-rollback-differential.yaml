type: claim
id: CLM-000682
claim_type: subtechnique-existence
statement_zh: 旧启动或虚拟化安全组件被实际加载后，可出现外部更新状态仍正常而 Secure Boot、VBS 或内核保护实际弱化的差异；必须用启动测量和功能结果确认，不能把研究演示推广为所有环境中的在野案例。
statement_en: Loading older boot or virtualization-security components can leave an apparently current update state while Secure Boot, VBS, or kernel protection is effectively weaker. Boot measurements and functional outcomes are required, and a research demonstration cannot be generalized to in-the-wild activity in every environment.
subject_refs: [NJT-0127, NJS-0127-002]
