statement_zh: 网络设备加密削弱应以实际会话的有效保密或完整性下降为结果门槛；加密配置、映像或硬件状态变化只是原因候选，不能单独证明数据保护已经失效。
statement_en: Network-device encryption impairment requires an actual decline in effective confidentiality or integrity of sessions; configuration, image, or hardware state changes are candidate causes and cannot alone prove that data protection failed.
