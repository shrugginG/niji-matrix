statement_zh: 停用专用加密硬件可改变执行路径或性能，但若软件路径仍保持等效算法、密钥材料和会话完整性，就不能仅凭加速器关闭认定本项防御削弱或建立独立 NJS。
statement_en: Disabling dedicated cryptographic hardware can alter execution path or performance, but if software retains equivalent algorithms, keying material, and session integrity, accelerator disablement alone cannot establish this defensive impairment or an independent NJS.
