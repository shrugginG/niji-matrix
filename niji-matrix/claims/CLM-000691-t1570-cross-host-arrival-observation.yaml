id: CLM-000691
claim_type: mechanism-mapping
statement_zh: 经既有内部共享放置的工具在单一目标上可表现为普通网络登录与文件创建；若只有该局部视图，源控制点和多目标共同投递可能被分开解释，而跨主机登录、共享请求和文件摘要可恢复谱系。
statement_en: A tool placed through an existing internal share can appear on one destination as an ordinary network logon and file creation. With only that local view, the original control point and multi-target delivery may be interpreted separately, while cross-host logon, share-request, and file-digest joins can recover lineage.
