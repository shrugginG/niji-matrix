statement_zh: 植入程序内置压缩例程可在不启动独立归档工具的情况下封装数据，因而仅靠归档工具进程名的检测无法覆盖该路径；这并不表示文件或网络痕迹消失。
statement_en: An implant's integrated compression routine can package data without a separate archiver process, so detection
  keyed only to archiver process names misses that path; file and network traces do not thereby disappear.
