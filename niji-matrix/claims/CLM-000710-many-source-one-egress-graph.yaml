id: CLM-000710
claim_type: subtechnique-existence
statement_zh: 多源数据在被控中间点汇聚后由少量节点取走，会把来源主机外联转为内部复制和单点外联；跨主机共享访问、目标写入与出口流量仍可重建多对一图形。
statement_en: When data from many sources converges on a controlled intermediate point and leaves through few nodes, direct
  source egress becomes internal copying plus concentrated egress; cross-host share access, target writes, and outbound flows
  can still reconstruct the many-to-one graph.
