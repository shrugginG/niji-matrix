statement_zh: 当源文件变化率较低且检测依赖短窗批量读取时，增量选择可降低后续单轮读取规模并要求跨轮重建；该匿迹效果是条件推断而非报告实测。
statement_en: When source-file change rates are low and detection depends on short-window bulk reads, incremental selection
  can reduce later per-pass volume and require cross-pass reconstruction; this stealth effect is conditional inference, not
  a measured outcome in the report.
