type: claim
id: CLM-000716
claim_type: mechanism-mapping
statement_zh: 恶意读取已经保存的浏览历史不需要在本次操作中重新访问相同站点，因而网页导航日志可能缺少与本次发现对应的新请求；这不证明攻击者刻意躲避审计，端点读取与传输仍可见。
statement_en: A malicious read of stored browser history need not revisit the same sites during the present operation, so
  navigation logs can lack new requests corresponding to this discovery. This does not prove deliberate audit evasion, and
  endpoint reads or transfer can remain visible.
