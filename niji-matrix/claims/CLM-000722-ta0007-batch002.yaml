statement_zh: 对象列表在获准身份下表现为常规只读作业，并且 AWS、Azure 与 GCP 的对象读取审计均有启用或投递条件；只看写入与下载的分析可能错过发现阶段，但受害租户的具体 ListObjects 日志和攻击者避审意图仍未被证明。
statement_en: Object listing under an entitled identity resembles routine read work, and AWS, Azure, and GCP object-read audit
  has enablement or delivery conditions. Analyses limited to writes and downloads can miss discovery, but the victim’s exact
  ListObjects log and an audit-evasion motive remain unproven.
