id: CLM-000796
claim_type: technique-relevance
statement_zh: 文件或目录权限修改只有在受保护对象的有效 ACL/owner 相对批准基线改变，并使具体防御消费者无法执行、读取、更新或保护该对象时，才构成完成的防御削弱；权限写入命令本身只是原因候选。
statement_en: A file or directory permission change is completed defensive impairment only when effective ACL or ownership of a protected object differs from the approved baseline and prevents a specific defensive consumer from executing, reading, updating, or protecting it. The permission-writing command alone is only a candidate cause.
