id: CLM-000797
claim_type: mechanism-mapping
statement_zh: Grandoreiro 样本向 Trusteer 主二进制写入拒绝 ACL，表明攻击者可借操作系统正常访问裁决阻止防御消费者；来源支持恶意意图和权限状态，不足以声称每台目标的产品均成功停用。
statement_en: A Grandoreiro sample wrote a denial ACL to a main Trusteer binary, showing how an adversary can use ordinary operating-system access decisions against a defensive consumer. The source supports malicious intent and permission state but not successful product shutdown on every target.
