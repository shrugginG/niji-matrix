statement_zh: Registry 防御设置修改只有在可识别 writer 与 old/new value、真实消费者采用该状态，且有效预防、检测、审计或响应能力相对基线下降时才构成完成的防御削弱；写入成功不等于生效。
statement_en: A Registry defensive-setting change becomes completed impairment only when the writer and old and new values are identifiable, the real consumer adopts that state, and effective prevention, detection, audit, or response declines relative to baseline. A successful write is not equivalent to effective change.
