statement_zh: BlackEnergy 3 样本修改 Internet/IE 安全相关 Registry 值，并在后续通过 rundll32 加载组件和通信，使本地受信消费者的正常配置读取承载恶意安全降级；公开报告仍不足以证明每台端点全部控制均失效。
statement_en: BlackEnergy 3 samples changed Internet and Internet Explorer security-related Registry values and subsequently loaded components through rundll32 and communicated, causing ordinary configuration consumption by a trusted local consumer to carry malicious security reduction. Public reporting still does not prove failure of every control on every endpoint.
