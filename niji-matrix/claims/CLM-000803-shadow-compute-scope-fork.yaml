statement_zh: 在受害云内创建或从快照派生新的计算身份，可使后继活动进入与原实例不同的网络、IAM、代理和日志注册范围；LAPSUS$ 与 Scattered Spider 直接证明恶意新实例使用，但具体控制差需本地验证。
statement_en: Creating or snapshot-deriving a new compute identity inside a victim cloud can place follow-on activity in network, IAM, agent, and logging enrollment different from the original instance. LAPSUS$ and Scattered Spider directly establish malicious new-instance use, while the specific control differential requires local validation.
