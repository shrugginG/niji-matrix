statement_zh: 删除、回退或临时存储重置可终止或倒退来宾文件、内存和代理序列，而外部控制面生命周期事件仍存在；只有缺少可恢复备份且该断点覆盖恶意活动窗口时，才确认取证连续性断裂。
statement_en: Deletion, reversion, or ephemeral-storage reset can terminate or rewind guest files, memory, and agent sequence while external control-plane lifecycle events remain. A forensic-continuity break is confirmed only when no recoverable backup covers the malicious activity interval.
