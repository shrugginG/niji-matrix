id: CLM-000821
claim_type: technique-relevance
statement_zh: 网络设备映像修改只有在可信持久/运行映像与设备实际消费代码存在攻击者控制差，并产生安全、观察或恢复能力变化时才构成 TA0112；hash 或版本不同本身不足。
statement_en: A network-device image change becomes TA0112 only when adversary-controlled difference exists between trusted persistent or running image and code actually consumed by the device and changes security, observation, or recovery capability. A hash or version difference alone is insufficient.
