statement_zh: 闪存 IOS、ROMMON 或 appliance 关键组件的持久修改可跨重载被再次消费，需要签名/Trust Anchor、存储映像与启动后状态验证以及可信重装，区别于仅运行内存修改。
statement_en: Persistent modification of flash IOS, ROMMON, or critical appliance components can be consumed again across reload, requiring signing or Trust Anchor, stored-image and post-boot validation, and trusted reinstallation, distinguishing it from running-memory-only mutation.
