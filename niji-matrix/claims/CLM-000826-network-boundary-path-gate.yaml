statement_zh: 网络边界桥接需要批准 path graph 明确禁止域间路径、攻击者建立可归因桥接状态，并观察真实双侧跨域流量；代理、NAT、隧道或防火墙变更本身不足。
statement_en: Network boundary bridging requires an approved path graph that prohibits the inter-domain path, an attributable adversary bridge state, and real bilateral cross-domain traffic. A proxy, NAT, tunnel, or firewall change alone is insufficient.
