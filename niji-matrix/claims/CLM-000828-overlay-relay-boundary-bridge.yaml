statement_zh: FRP/VPN 等独立 relay 可在不改变底层边界路由的情况下用两个会话跨域转发；检测需连接 relay 身份/进程、监听/隧道和两侧 flow，区别于边界设备策略改写。
statement_en: An independent relay such as FRP or VPN can forward across domains with two sessions without changing the underlying boundary route. Detection joins relay identity or process, listener or tunnel, and flows on both sides, distinguishing it from boundary-device policy rewrite.
