statement_zh: 交互命令历史记录前抑制要求存在本应持久化的交互命令、攻击者控制 history 生成或 sink，并证明条目在进入预期历史前缺失；空历史文件、非交互执行或事后删除本身不足。
statement_en: Interactive command-history pre-recording suppression requires an interactive command expected to persist, adversary control of history generation or its sink, and proof that the entry is absent before expected history persistence. An empty history file, noninteractive execution, or post-hoc deletion alone is insufficient.
