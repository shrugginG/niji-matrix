statement_zh: 空设备或未设置的历史路径、零容量历史或 SaveNothing 可在 shell 继续执行命令时阻止整段交互会话进入持久历史；BPFDoor 对 HISTFILE 与 MYSQL_HISTFILE 的设置提供直接攻击者案例。
statement_en: A null or unset history path, zero-capacity history, or SaveNothing can keep an entire interactive session out of durable history while the shell continues executing commands. BPFDoor's HISTFILE and MYSQL_HISTFILE settings provide a direct adversary case.
