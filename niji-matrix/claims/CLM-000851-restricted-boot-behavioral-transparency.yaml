statement_zh: Safe Mode 按合法诊断规则省略大量 driver/service，使防御缺席看似启动策略结果；攻击者在默认传感器不在场的 session 继续行为，形成行为透明，但 BCD、boot inventory 与外部结果仍保留。
statement_en: Safe Mode omits many drivers and services under legitimate diagnostic rules, making defensive absence appear to be a boot-policy result. The adversary continues during a session where default sensors are absent, producing behavioral transparency while BCD, boot inventory, and external outcomes remain.
