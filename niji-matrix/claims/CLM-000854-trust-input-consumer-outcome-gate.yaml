statement_zh: 信任裁决颠覆要求攻击者控制 trust input/state、明确 security consumer 实际评估、相对基线出现 allow/trusted/no-warning 差，并产生恶意对象/连接/内容被接受的结果；签名、证书、配置或 metadata 存在本身不足。
statement_en: Trust-decision subversion requires adversary control of trust input or state, actual evaluation by a named security consumer, an allow, trusted, or no-warning difference from baseline, and acceptance of a malicious object, connection, or content. A signature, certificate, configuration, or metadata state alone is insufficient.
