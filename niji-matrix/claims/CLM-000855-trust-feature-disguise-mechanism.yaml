statement_zh: 对象证明、anchor、verifier state 或 provenance 被攻击者控制后，consumer 可对恶意对象输出与合法对象相同的 valid/trusted/allowed 特征，使粗粒度分类借出可信身份并形成特征伪装。
statement_en: After adversary control of object attestation, an anchor, verifier state, or provenance, a consumer can emit the same valid, trusted, or allowed feature for a malicious object as for a legitimate one, lending trusted identity to coarse classification and producing Feature Disguise.
