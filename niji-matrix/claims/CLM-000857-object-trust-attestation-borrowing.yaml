statement_zh: 恶意对象可携带由被盗/受控密钥生成且被 consumer 验证的 signer/certificate/notarization proof，在 policy 与 anchor 基本不变时借用合法 publisher 特征；PipeMon 提供直接在野证据。
statement_en: A malicious object can carry signer, certificate, or notarization proof created with a stolen or controlled key and verified by a consumer, borrowing legitimate publisher features while policy and anchors remain materially unchanged. PipeMon provides direct in-the-wild evidence.
