statement_zh: 外部 delivery 与内部 child object 的 Zone.Identifier/quarantine provenance 可被移除、抑制或因容器而不继承，使 consumer 把 payload 当本地对象并跳过相同警告/限制；BlueNoroff 提供直接案例。
statement_en: Zone.Identifier or quarantine provenance between an external delivery and an inner child object can be removed, suppressed, or fail to inherit through a container, causing the consumer to treat the payload as local and skip the same warning or restriction. BlueNoroff provides a direct case.
