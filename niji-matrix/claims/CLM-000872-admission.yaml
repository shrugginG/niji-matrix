statement_zh: TA0006 下的 T1040 需要攻击者控制的被动观察面、认证流实际进入该观察面，以及明文或可恢复认证材料结果；抓包能力、Discovery 元数据或不可解密密文不足以完成凭据获取。
statement_en: Under TA0006, T1040 requires an adversary-controlled passive observation surface, an authentication flow actually
  reaching that surface, and plaintext or recoverable authentication material; capture capability, Discovery metadata, or
  undecryptable ciphertext does not complete Credential Access.
