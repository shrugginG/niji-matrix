statement_zh: 正常委派与 T1528 的差异不在 token 是否由正规平台签发，而在 recipient/client/workload 是否由批准 owner 控制并符合 redirect、scope、用途和代码 Provenance；供应商集成被控时还需分别记录关系控制转移和
  token 材料取得。
statement_en: Legitimate delegation differs from T1528 through whether an approved owner controls the recipient, client, or
  workload and whether redirect, scope, purpose, and code provenance match, not through whether a legitimate platform issued
  the token. Compromise of a vendor integration additionally requires separate records for relationship-control transfer and
  token-material acquisition.
