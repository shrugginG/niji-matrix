statement_zh: 未授权破坏硬件消费的非易失固件可使设备不能启动或初始化；必须区别于仍执行恶意代码的 pre-OS 植入和磁盘结构擦除。
statement_en: Unauthorized damage to hardware-consumed nonvolatile firmware can prevent boot or initialization and
  must be distinguished from a pre-OS implant that still executes adversary code and from disk-structure wiping.
