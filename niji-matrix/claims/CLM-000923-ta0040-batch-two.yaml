statement_zh: 固件破坏检测需要连接刷写进程与驱动、固件资源状态、重启、远程证明、外部 POST/心跳失败及离线恢复读回，单个固件更新错误不能确认攻击。
statement_en: Firmware-corruption detection needs to join flashing process and driver, firmware-resource status, reboot,
  remote attestation, external POST or heartbeat failure, and offline recovery readback; one firmware-update error
  cannot confirm attack.
