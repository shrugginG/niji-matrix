statement_zh: Web 服务外传检测必须把提供方与接收命名空间分开，并将端点源数据、服务对象生命周期和工作流投递作为三种不同关联任务；域名或 HTTPS 单点不能实现覆盖。
statement_en: Detection of web-service exfiltration must separate provider from receiver namespace and treat endpoint
  source data, service-object lifecycle, and workflow delivery as three different correlation tasks; a domain or
  HTTPS point signal cannot implement coverage.
