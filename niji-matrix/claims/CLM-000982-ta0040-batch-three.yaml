statement_zh: 连接/阶段超时、最小数据率、输入/算法工作界限、隔离工作池和优雅降级可约束端点 DoS，但过严限制会拒绝慢速合法客户端或复杂业务输入。
statement_en: Connection and stage timeouts, minimum data rates, input or algorithmic work bounds, isolated pools,
  and graceful degradation constrain endpoint DoS, while strict limits can reject slow legitimate clients or complex
  business input.
