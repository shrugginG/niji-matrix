statement_zh: 共享边缘服务按解密后的 Host/:authority 路由时，外层 TLS SNI/证书身份可与真实后端路由权威分离；提供方可用名称、证书、账户和源站一致性阻断该差异。
statement_en: When a shared edge service routes by the decrypted Host or :authority, outer TLS SNI or certificate identity
  can diverge from actual backend routing authority; the provider can reject the differential through name, certificate,
  account, and origin congruence.
