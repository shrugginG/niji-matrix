statement_zh: TINYTYPHON 遍历映射/可见驱动器并上传匹配文档，而 Windows 映射与登录会话认证 ID/LUID 绑定，因此同会话恶意进程可复用用户已有共享语境；来源未测量告警下降。
statement_en: TINYTYPHON traverses mapped or visible drives and uploads matching documents, while Windows binds mappings to
  logon-session authentication IDs or LUIDs, allowing same-session malware to reuse an existing user share context; the sources
  do not measure alert reduction.
