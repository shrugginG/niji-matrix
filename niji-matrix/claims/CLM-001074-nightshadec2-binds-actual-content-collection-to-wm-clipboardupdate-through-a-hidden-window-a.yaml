statement_zh: NightshadeC2 以隐藏窗口和 AddClipboardFormatListener 将实际内容收集绑定到 WM_CLIPBOARDUPDATE，并把结果写入隐藏日志后按命令上传；相较固定轮询，这一变量在空闲期消除重复打开与读取，同时保留
  listener 和变化后结果痕迹。
statement_en: NightshadeC2 binds actual content collection to WM_CLIPBOARDUPDATE through a hidden window and AddClipboardFormatListener,
  writes results to a hidden log, and uploads them by command. Relative to fixed polling, the variable removes repeated opens
  and reads during idle periods while retaining listener and post-change outcome traces.
