statement_zh: Windows、macOS、X11 与 Wayland 提供不同的变化与数据转移对象，平台文档支持访问前提而不自动证明默认集中审计能够记录每次进程内读取，因此防守实现必须验证本地传感器字段。
statement_en: Windows, macOS, X11, and Wayland expose different change and data-transfer objects. Platform documentation supports
