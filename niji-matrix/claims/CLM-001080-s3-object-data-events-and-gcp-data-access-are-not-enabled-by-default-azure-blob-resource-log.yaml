statement_en: S3 object data events and GCP Data Access are not enabled by default, Azure Blob resource logs are not collected
  before diagnostic routing, and GCP public-object access does not enter Cloud Audit Logs. Microsoft 365 Audit Standard is
  enabled by default for most organizations but retains field and aggregation limits.
