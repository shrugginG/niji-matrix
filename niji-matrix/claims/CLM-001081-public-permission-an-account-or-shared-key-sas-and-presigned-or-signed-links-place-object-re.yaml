statement_zh: 公开权限、账户/共享密钥、SAS 与预签名/签名链接把对象读取权放入可转移载体，使服务可成功返回正文而不认证实际持有者的独立身份，留下不同于 identity-bound OAuth 的归因与防御要求。
statement_en: Public permission, an account or shared key, SAS, and presigned or signed links place object-read authority
  in a transferable carrier, allowing the service to return a body without authenticating the actual holder's independent
  identity and creating attribution and defense requirements distinct from identity-bound OAuth.
