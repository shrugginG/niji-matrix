statement_zh: 行为者可从 provider script 已生成的输出等既有网络内来源取得配置，而 RANCID/Cisco 正常功能会保存版本化配置副本；因此当前配置取得可以发生在副本面而没有同时间实时设备请求。
statement_en: Actors can acquire configuration from preexisting network sources such as provider-script output, while normal
  RANCID and Cisco functions preserve versioned configuration copies. Current configuration acquisition can therefore occur
  on a replica plane without a contemporaneous live-device request.
