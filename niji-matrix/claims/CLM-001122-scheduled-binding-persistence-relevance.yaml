statement_zh: 调度器保存的触发—动作绑定能够在创建进程或原始会话结束、跨重启或跨长观察窗口后继续触发攻击者控制的执行；Tarrask 的隐藏任务持续重连 C2，Nitrokod 的任务链跨多次重启和十五天延期继续运行，因此 NJT-0075 除 TA0002 和 TA0004 外也独立适用于 TA0003。
statement_en: A scheduler-held trigger-to-action binding can continue launching adversary-controlled execution after the creating process or original session ends, across reboot, or beyond a long observation window. Tarrask's hidden task continued C2 reconnection and Nitrokod's task chain continued across multiple reboots and a fifteen-day delay, making NJT-0075 independently applicable to TA0003 in addition to TA0002 and TA0004.
