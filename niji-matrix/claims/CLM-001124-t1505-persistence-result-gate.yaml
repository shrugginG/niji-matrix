statement_zh: 服务器组件文件落地、上传或注册只建立持久状态候选；只有该状态随后被服务器加载或调用，并在原始会话结束、服务重启或主机重启后恢复攻击者控制的执行、访问或通信时，才完成 T1505 的 Persistence 结果门。
statement_en: Server-component file placement upload or registration establishes only candidate durable state. T1505 completes its Persistence result gate only when the server later loads or invokes that state and restores adversary-controlled execution access or communication after the original session service restart or host restart.
