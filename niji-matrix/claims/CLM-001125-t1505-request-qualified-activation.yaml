statement_zh: 持久接入的服务器组件可仅在 HTTP、邮件、SQL 或等价事务满足攻击者控制的字段关系、秘密值或参数条件时进入恶意分支，使普通请求维持正常结果并降低短窗口发现概率；请求字段、组件分支与后继结果仍可恢复该差异。
statement_en: A durably integrated server component can enter its malicious branch only when HTTP mail SQL or an equivalent transaction satisfies an adversary-controlled field relation secret value or parameter condition, preserving ordinary outcomes for other requests and reducing short-window discovery while request fields component branches and successor outcomes retain the differential.
