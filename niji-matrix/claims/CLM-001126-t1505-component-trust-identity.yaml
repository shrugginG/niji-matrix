schema_version: 1.0.0
type: claim
id: CLM-001126
claim_type: subtechnique-existence
statement_zh: 恶意服务器组件可以声明熟悉或受信的名称、vendor、version、acceptance level、路径或 descriptor，而其签名、内容、writer 与包来源不一致；依赖声明 metadata 的普通清单会误分类，独立密码学和包事务验证仍可揭示差异。
statement_en: A malicious server component can declare a familiar or trusted name vendor version acceptance level path or descriptor while its signature content writer and package provenance disagree. Ordinary inventory that trusts declared metadata can misclassify the component while independent cryptographic and package-transaction validation retains the differential.
subject_refs: [NJT-0225, NJS-0225-002]
evidence_refs: [REF-000208]
evidence_mode: directly-observed
confidence: medium
status: review
