id: CLM-001128
claim_type: mitigation
statement_zh: 限制服务器扩展写入和注册权限、把批准绑定到组件身份与内容来源、独立验证签名与包事务、保留组件全生命周期并从可信包或映像恢复，可降低未批准服务器组件持久接入及其长期隐藏机会。
statement_en: Restricting server-extension write and registration authority binding approval to component identity and content provenance independently verifying signatures and package transactions retaining the full component lifecycle and restoring from trusted packages or images reduces unauthorized server-component persistence and long-lived hiding opportunities.
