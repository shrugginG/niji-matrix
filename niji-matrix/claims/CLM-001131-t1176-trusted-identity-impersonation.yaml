statement_zh: 新的恶意扩展可以通过相似名称、功能、说明或 publisher 外观借用市场和人工审批信任，同时其精确 registry、publisher 与 extension ID 仍不同；该稳定身份差异支持受信扩展身份仿冒子技术。
statement_en: A new malicious extension can borrow marketplace and human-approval trust through a similar name function description or publisher appearance while its exact registry publisher and extension ID remain different. This stable identity differential supports a Trusted-Extension Identity Impersonation child.
