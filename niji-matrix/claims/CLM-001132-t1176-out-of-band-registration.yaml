statement_zh: 攻击者可以直接写入扩展包与宿主 profile、policy、preference、Registry 或扩展目录并重建完整性字段，使宿主以后加载恶意扩展而没有普通市场/UI 安装和同意链；writer、配置差分、包内容和首次加载仍能恢复因果。
statement_en: An adversary can directly write an extension package and host profile policy preference Registry or extension-directory state and rebuild integrity fields so the host later loads the malicious extension without an ordinary marketplace or UI installation and consent chain while writer configuration differential package content and first load retain causality.
