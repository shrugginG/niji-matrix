statement_zh: 既有扩展身份下的开发者、构建或市场发布链污染与 NJS-0059-001 的可信发行连续性变量相同，应由供应链父项拥有；恶意更新到达目标后形成的扩展持久状态由 T1176 父级承接，不在 T1176 下重复建立同义子项。
statement_en: Developer build or marketplace publication compromise under an established extension identity shares the trusted-release-continuity variable of NJS-0059-001 and is owned by the supply-chain parent. The installed durable extension state after the malicious update reaches a target is carried by T1176 parent scope without a duplicate child.
