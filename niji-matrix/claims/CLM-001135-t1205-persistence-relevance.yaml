statement_zh: 当持久映像、启动项、服务或模块在中断后保存或重新加载网络信号 matcher 与被门控入口，且后续信号实际重新激活访问时，NJT-0120 独立适用于 TA0003；SYNful Knock 基础植入跨重启存续，以及 UNC3886 REPTILE 的启动加载和专用包激活直接支持该结论。
statement_en: NJT-0120 independently applies to TA0003 when a durable image startup item service or module preserves or reloads the network-signal matcher and gated entry after interruption and a later signal actually reactivates access. Survival of the SYNful Knock base implant across reboot and UNC3886 REPTILE startup loading plus specialized-packet activation directly support the conclusion.
