statement_zh: T1078 在 TA0003 下只有在先前攻击者访问之后，同一未修改有效身份或认证会话跨独立访问时段或明确中断仍被接受，并由后续认证、会话续用和资源操作实际恢复或维持攻击者可控访问时才成立；凭据持有、账户启用、单次首次登录或原活动窗口内不中断使用均不足。
statement_en: T1078 qualifies under TA0003 only when after prior adversary access the same unchanged valid identity or authenticated session remains accepted across a separate access episode or defined interruption and later authentication session continuation and resource operation actually restore or maintain adversary-controlled access. Credential possession enabled account state one initial sign-in or uninterrupted use within the original activity window is insufficient.
