statement_zh: 选择已含秘密的普通或次生内容面可使当前取得只留下该面的读取事务，只有监测原秘密权威或凭据导出的防守方可能因此遗漏取得语义；这是有条件的行为透明推断而非已测量规避率。
statement_en: Selecting an ordinary or secondary secret-bearing surface can leave only that surface's read transaction, allowing a defender
  observing only the original authority or credential export to miss acquisition semantics; this is a conditional behavioral-transparency
  inference rather than a measured evasion rate.
