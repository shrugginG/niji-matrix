statement_zh: 本地应用绑定加密改变解密权限边界，设备绑定续期改变后继续用条件；二者不能互换，DBSC 的短期 Cookie 在到期前仍需按应用策略评价，而持续受控的原客户端风险仍在。
statement_en: Local application-bound encryption changes the decryption authority boundary, while device-bound renewal changes later continuation
  conditions; they are not interchangeable. A DBSC short-lived cookie still needs application-specific assessment before expiry, and a persistently
  controlled original client remains a risk.
