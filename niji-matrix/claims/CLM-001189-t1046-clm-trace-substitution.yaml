statement_zh: 将初始服务候选获取从逐监听探测换成公告查询，会把必要观察移到服务类型与实例查询应答；只依赖候选服务连接的扫描检测无法还原这部分调查。该影响依赖传感器范围，不能表述为不接触目标主机或已测量的规避成功。
statement_en: Replacing initial per-listener candidate acquisition with advertisement lookup shifts necessary observation
  to service-type and instance queries and responses; scan detection dependent only on candidate-service connections cannot
  reconstruct that portion of the survey. The effect depends on sensor scope and establishes neither no target-host contact
  nor measured evasion success.
