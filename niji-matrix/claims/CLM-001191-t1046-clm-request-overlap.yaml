statement_zh: 恶意服务浏览可以使用与普通客户端相同的有效查询语义，使一次请求是否合法不足以区分调查意图；实际分类难度仍取决于客户端用途与会话上下文，现有事件没有量化其漏检率。
statement_en: Malicious service browsing can use the same valid query semantics as ordinary clients, so the legitimacy of
  an isolated request cannot distinguish surveying intent; classification still depends on client purpose and session context,
  and the available incident supplies no quantified miss rate.
