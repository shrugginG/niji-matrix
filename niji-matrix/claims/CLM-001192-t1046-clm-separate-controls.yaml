claim_type: mitigation
statement_zh: 主机防火墙可限制来源到监听服务的访问，发现网关可按接口与服务信息过滤跨段查询及公告；两者控制不同路径，网关过滤不阻止同链路发布者直接应答，隐藏公告也不阻止已知端点探测。
statement_en: 'Host firewalls can restrict source access to listeners while discovery gateways filter cross-segment queries
  and advertisements by interface and service information. These control different paths: gateway filters do not prevent same-link
  publisher replies, and suppressing advertisements does not prevent probes of known endpoints.'
