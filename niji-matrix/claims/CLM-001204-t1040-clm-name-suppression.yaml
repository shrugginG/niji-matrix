statement_zh: NIST 明确说明关闭名称查找可服务于隐蔽嗅探，tcpdump 4.99.5 规定可控制的禁止名称转换选项；二者支持以能力证据建立主动名称补全抑制子项，而不证明特定恶意采用或现场规避成功。
statement_en: NIST explicitly links disabled name lookup with stealthy sniffing, and tcpdump 4.99.5 specifies controllable
  suppression of name conversion. Together they support a capability-evidenced Active Name-Enrichment Suppression child without
  establishing particular malicious adoption or field evasion success.
