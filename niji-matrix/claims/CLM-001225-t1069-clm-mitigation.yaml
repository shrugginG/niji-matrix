claim_type: mitigation
statement_zh: 按部署版本限制非必要远程 SAM 调用、收回额外云关系读取权限并验证定向读取审核，可降低组关系暴露和提高问责；这些控制不阻止合法本地令牌读取，也不能通过删除策略交付必需权限来安全消除策略推导路径。
statement_en: Version-aware restrictions on unnecessary remote SAM calls, removal of excess cloud relationship-read permissions,
  and validated targeted read auditing can reduce group-relationship exposure and improve accountability. They do not prevent
  legitimate local-token reads, and policy inference cannot safely be eliminated by removing permissions required for policy
  delivery.
