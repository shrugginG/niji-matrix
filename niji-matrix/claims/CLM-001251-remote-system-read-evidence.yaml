statement_zh: 经配置的 Linux Audit 规则可将相关 SYSCALL 和 PATH 记录关联到文件读访问请求及结果，但成功的可读打开不证明文件内容被消费；主机和进程归属还依赖采集器标识、时间范围与完整记录。
statement_en: Configured Linux Audit rules can join SYSCALL and PATH records for file read-access requests and outcomes, but
  a successful read-capable open does not establish content consumption. Host and process attribution additionally depend
  on collector identity, time scope, and complete records.
