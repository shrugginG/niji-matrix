statement_zh: 限制不必要的私有 SSH 资料读取并使用 HashKnownHosts 可降低直接可见的主机知识暴露；哈希设置不自动转换旧条目，也不能保护其他配置中的同名记录或阻止验证已猜到的候选。
statement_en: Limiting unnecessary reads of private SSH material and using HashKnownHosts can reduce directly visible host-knowledge
  exposure. The setting does not convert existing entries, protect the same names in other configuration, or prevent testing
  guessed candidates.
