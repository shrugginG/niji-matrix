statement_zh: 恶意 systeminfo 与硬件管理查询借用正常诊断的工具身份和只读请求语义，使主机画像用途难以仅由局部外观区分；证据支持 NM-FD 中等置信，不支持检测率或普遍规避结果。
statement_en: Malicious systeminfo and hardware-management queries borrow tool identity and read-request semantics from ordinary
  diagnostics, making profiling purpose difficult to distinguish through local appearance. This supports medium-confidence
  NM-FD without detection-rate or universal-evasion claims.
