statement_zh: EC2 Instance.architecture 是镜像架构，DescribeInstances 受读权限、过滤、分页与最终一致性约束；CloudTrail 请求事件不含完整返回，因此不能据此确认当前客体内核、补丁或实际取得的完整属性。
statement_en: EC2 Instance.architecture is image architecture, while DescribeInstances is constrained by read authority, filtering,
  pagination, and eventual consistency. CloudTrail requests lack complete returns and cannot confirm current guest kernels,
  patches, or complete acquired attributes.
