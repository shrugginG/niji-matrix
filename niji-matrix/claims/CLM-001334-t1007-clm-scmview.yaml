statement_zh: SCM枚举受manager枚举权、类型/状态/组过滤及逐服务状态读取权限制，缺逐服务权限会静默省略；缓冲不足和续页未完成不能当成完整清单或无服务，单服务状态也可能落后实时变化。
statement_en: SCM enumeration is constrained by manager enumeration rights, type/state/group filters, and individual-service
  status authority; missing individual rights silently omit services. Insufficient buffers and incomplete continuation establish
  neither complete lists nor no services, and individual-service state can lag real changes.
