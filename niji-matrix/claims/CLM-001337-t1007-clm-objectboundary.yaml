statement_zh: 服务进程映射不等于普通进程库存，直接driver登记或实例查询归NJT-0180而不因SCM载体重计为普通服务，driver登记不证明已加载。服务所属PID不同于查询者，状态或产品字符串也不证明有效安全保护。
statement_en: Service-to-process mapping differs from ordinary process inventory. Direct driver-registration or instance inquiries
  belong to NJT-0180 rather than being counted again as ordinary services because of SCM carriage, and registration does not
  establish loading. Service-owning PIDs differ from queriers, and states or product strings do not establish effective protection.
