id: CLM-001340
claim_type: mechanism-mapping
statement_zh: 把具体服务读取作为既有宿主的内联任务，可省去每任务独立诊断执行器，条件化绕过只依赖此进程创建入口的观察；SCM请求、宿主与权限约束仍在，因此NM-BT不表示所有传感器漏报。
statement_en: Carrying a particular service read as an inline task in an existing carrier can remove a per-task diagnostic
  executor, conditionally avoiding observation that relies solely on that creation entry. SCM requests, carriers, and authority
  constraints remain, so NM-BT does not imply misses by every sensor.
