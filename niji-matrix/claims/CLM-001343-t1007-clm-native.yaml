statement_zh: 明确部署的任务入口与SCM调用返回插桩可重建具体内联服务查询，前提是任务因果、句柄代次、ABI、原始状态、有效指针、续页和采集健康成立。它不是默认EDR能力，返回也不证明外传或完整库存。
statement_en: Explicit task-entry and SCM call/return instrumentation can reconstruct particular inline service inquiries
  when task causality, handle generations, ABI, raw statuses, valid pointers, continuation, and collection health hold. It
  is not default EDR capability, and returns establish neither exfiltration nor complete inventories.
