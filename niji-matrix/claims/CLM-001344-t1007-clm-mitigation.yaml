claim_type: mitigation
statement_zh: 按职责收敛服务与调度读取、分别治理SCM与任务/cron权限并保全可归属请求，可减少部分库存暴露与名称信任造成的判断缺口；正常本地读取和受控批准代理仍限制收益，预期效果未做实验测量。
statement_en: Duty-based service/schedule read constraints, separate SCM and task/cron authority governance, and attributable
  request retention can reduce some inventory exposure and name-trust gaps. Normal local reads and compromised approved agents
  limit benefits, and expected effects have not been experimentally measured.
