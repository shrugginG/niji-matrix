statement_zh: 经验证的进入退出采集可按 ABI 恢复部分时间 getter 的原始返回和有界输出，但必须处理 void、零值、错误、指针、回绕及覆盖缺口，不假设默认 EDR 结果或从读取推定后继。
statement_en: Validated entry-exit collection can recover selected time getters’ raw returns and bounded output by ABI while
  handling void returns, zero values, errors, pointers, wraparound, and coverage gaps. It assumes neither default EDR results
  nor a successor inferred from a read.
