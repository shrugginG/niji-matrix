name:
  zh: 长周期多维主动扫描关联
  en: Long-Horizon Multidimensional Active-Scan Correlation
summary:
  zh: 跨越短期阈值和单一来源边界，重构时间稀释或多源协同的探测活动。
  en: Reconstruct temporally diluted or multi-source coordinated probing beyond short thresholds and single-origin boundaries.
description:
  paragraphs:
  - zh: 本策略围绕上述检测目标组织适用技术和分析方案。策略对象负责定义检测范围，具体数据要求、分析逻辑、关联窗口、误报、盲区和调优方法由独立检测分析对象 NJA-000001 描述。
    en: This strategy organizes covered techniques and analytics around the detection objective summarized above. The strategy defines detection
      scope, while the separate analytic NJA-000001 specifies data requirements, logic, correlation windows, false positives, blind spots, and
      tuning.
