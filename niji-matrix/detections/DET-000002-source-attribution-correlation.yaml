name:
  zh: 扫描来源归因与协同关系分析
  en: Scan-Origin Attribution and Coordination Analysis
summary:
  zh: 区分真实协同来源、诱饵地址、代理中继和可能的间接扫描来源。
  en: Distinguish real collaborating origins from decoys, spoofed addresses, proxy relays, and indirect scan sources.
description:
  paragraphs:
  - zh: 本策略围绕上述检测目标组织适用技术和分析方案。策略对象负责定义检测范围，具体数据要求、分析逻辑、关联窗口、误报、盲区和调优方法由独立检测分析对象 NJA-000002 描述。
    en: This strategy organizes covered techniques and analytics around the detection objective summarized above. The strategy defines detection
      scope, while the separate analytic NJA-000002 specifies data requirements, logic, correlation windows, false positives, blind spots, and
      tuning.
