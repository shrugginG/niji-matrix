id: DET-000003
name:
  zh: 探测报文分片规范化与重组分析
  en: Probe Fragment Normalization and Reassembly Analysis
summary:
  zh: 在应用扫描检测前统一重组分片，并识别异常小分片、重叠分片和重组歧义。
  en: Normalize and reassemble fragments before scan analytics, and identify unusually small fragments, overlaps, and reassembly ambiguity.
description:
  paragraphs:
  - zh: 本策略围绕上述检测目标组织适用技术和分析方案。策略对象负责定义检测范围，具体数据要求、分析逻辑、关联窗口、误报、盲区和调优方法由独立检测分析对象 NJA-000003 描述。
    en: This strategy organizes covered techniques and analytics around the detection objective summarized above. The strategy defines detection
      scope, while the separate analytic NJA-000003 specifies data requirements, logic, correlation windows, false positives, blind spots, and
      tuning.
