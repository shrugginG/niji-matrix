name:
  zh: 探测特征与访问意图关联
  en: Probe-Feature and Access-Intent Correlation
summary:
  zh: 识别外观接近正常业务、但跨目标、响应和会话关系体现侦察意图的请求。
  en: Identify requests that resemble normal business traffic locally but reveal reconnaissance intent across targets, responses, and sessions.
description:
  paragraphs:
  - zh: 本策略围绕上述检测目标组织适用技术和分析方案。策略对象负责定义检测范围，具体数据要求、分析逻辑、关联窗口、误报、盲区和调优方法由独立检测分析对象 NJA-000004 描述。
    en: This strategy organizes covered techniques and analytics around the detection objective summarized above. The strategy defines detection
      scope, while the separate analytic NJA-000004 specifies data requirements, logic, correlation windows, false positives, blind spots, and
      tuning.
