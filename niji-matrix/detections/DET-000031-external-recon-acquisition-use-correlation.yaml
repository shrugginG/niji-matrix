schema_version: 2.0.0
type: detection-strategy
id: DET-000031
name:
  zh: 外部侦查获取与后续使用关联
  en: External Reconnaissance Acquisition-to-Use Correlation
summary:
  zh: 将第三方主机查询或域外身份暴露与后续高度定向活动关联，以识别受害方本地不可见的前置收集。
  en: Correlate third-party host queries or off-victim identity exposure with highly targeted follow-on activity to identify preceding collection that is not locally visible to the victim.
description:
  paragraphs:
  - zh: 本策略面向主要采集痕迹位于第三方平台、泄露资料或离线分析环境的主机与身份侦查。策略优先使用提供方审计和可信共享直接定位查询者；在缺少这类数据时，只能把已知外部暴露、后续接触对暴露属性的精确使用以及时间接近性组合为条件性判断。NJA-000005 定义跨提供方、暴露情报和受害方后续事件的具体关联方法。
    en: This strategy covers host and identity reconnaissance whose primary collection traces reside in third-party platforms, breached material, or offline analysis. It prioritizes provider audit and trusted sharing to identify consumers directly; when those data are unavailable, it can make only a conditional assessment by combining known external exposure, precise use of exposed attributes in downstream contact, and temporal proximity. NJA-000005 defines the correlation across provider, exposure-intelligence, and victim follow-on events.
