schema_version: 2.0.0
type: detection-strategy
id: DET-000032
name:
  zh: Web 主机画像与选择性响应关联
  en: Web Host Profiling and Selective-Response Correlation
summary:
  zh: 将请求元数据、客户端属性读取、脚本来源、回传和差异化响应关联，以识别嵌入普通 Web 会话的恶意主机画像。
  en: Correlate request metadata, client-property access, script provenance, reporting, and differential responses to identify malicious host profiling embedded in ordinary web sessions.
description:
  paragraphs:
  - zh: 本策略覆盖仅消费请求固有字段的远端画像和执行附加客户端枚举的网页画像。两类行为都处于合法兼容性、分析、反欺诈和跟踪的高背景噪声中，因此策略不把任一 User-Agent 读取或指纹 API 调用单独视为恶意，而由 NJA-000006 将页面完整性、属性集合、回传目的地和选择性内容结果组合判断。
    en: This strategy covers remote profiling that consumes only fields inherent in a request and web profiling that executes additional client enumeration. Both occur amid high background volumes of legitimate compatibility, analytics, anti-fraud, and tracking behavior, so the strategy does not treat any User-Agent read or fingerprint API call as malicious in isolation. NJA-000006 instead combines page integrity, attribute sets, reporting destinations, and selective-content outcomes.
detects_refs: [NJT-0032, NJS-0032-002, NJS-0032-003]
