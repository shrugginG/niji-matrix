schema_version: 2.0.0
type: detection-strategy
id: DET-000033
name:
  zh: 身份工作流差异枚举关联
  en: Identity-Workflow Differential Enumeration Correlation
summary:
  zh: 跨账户、功能、来源和时间关联语义正常但未完成的身份事务，以识别响应差异驱动的身份属性推断。
  en: Correlate semantically normal but incomplete identity transactions across accounts, functions, origins, and time to identify response-difference-driven identity inference.
description:
  paragraphs:
  - zh: 本策略面向登录、注册、恢复、联合身份和 MFA 流程中难以由单条记录区分的属性推断。NJA-000007 比较请求后的响应类别、长度、跳转、可用验证方式、时延和流程完成状态，再将高身份扇出、跨功能重复和共同客户端特征组合起来，避免把普通用户错误或合法批量开户直接判为恶意。
    en: This strategy addresses attribute inference in login, registration, recovery, federation, and MFA flows that is difficult to distinguish from one record. NJA-000007 compares response class, length, redirects, offered verification methods, latency, and flow-completion state, then combines high identity fan-out, repeated use across functions, and shared client features so ordinary user error or legitimate bulk onboarding is not treated as malicious by default.
detects_refs: [NJT-0033, NJS-0033-002]
domains: [enterprise]
analytic_refs: [NJA-000007]
evidence_refs: [REF-000033, REF-000034, REF-000035]
