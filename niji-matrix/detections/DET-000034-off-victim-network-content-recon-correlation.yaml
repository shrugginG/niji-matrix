schema_version: 2.0.0
type: detection-strategy
id: DET-000034
name:
  zh: 目标外网络与开放内容侦查关联
  en: Off-Victim Network and Open-Content Reconnaissance Correlation
summary:
  zh: 将第三方传感、公共控制面和开放内容查询与后续精确目标活动关联，识别目标本地不可见的网络与组织画像。
  en: Correlate third-party sensor, public control-plane, and open-content queries with precise downstream targeting to identify network and organizational profiling invisible in victim-local telemetry.
description:
  paragraphs:
  - zh: 本策略覆盖网络观测复用、公共控制面旁路、目标外组织情报拼接和第三方开放内容搜索。直接检测优先依赖提供方或公共基础设施审计；当查询者记录不可获得时，只能把公开对象、后续活动对稀有网络或组织属性的精确使用和时间顺序组合为条件性判断。NJA-000008 定义跨数据提供方、公开对象和受害方事件的实体关联与置信度分层。
    en: This strategy covers reuse of network observations, public control-plane bypass, off-target organizational synthesis, and third-party open-content search. Direct detection prioritizes provider or public-infrastructure audit; when consumer records are unavailable, assessment is conditional and combines public objects, precise downstream use of rare network or organizational attributes, and event sequence. NJA-000008 defines entity correlation and confidence tiers across data providers, public objects, and victim events.
