schema_version: 2.0.0
type: detection-strategy
id: DET-000035
name:
  zh: 假名研究账户关联与归因
  en: Pseudonymous Research-Account Linkage and Attribution
summary:
  zh: 关联平台画像、设备、登录、恢复属性、目标查看图和后续滥用，识别隔离身份下的定向开放内容研究。
  en: Correlate platform profiles, devices, logins, recovery attributes, target-view graphs, and downstream abuse to identify targeted open-content research under compartmented identities.
description:
  paragraphs:
  - zh: 本策略由开放内容平台侧实施，目标组织通常只能通过共享情报或后续接触获得间接视角。它不把虚假、稀疏或新账户单独判为恶意，而由 NJA-000009 将账户生命周期、基础设施复用、集中研究目标、跨画像关联和后续滥用共同评分，并保持刑事指控与平台直接观测的证据层级差异。
    en: This strategy is implemented at the open-content platform, while the victim organization usually gains only an indirect vantage through shared intelligence or downstream contact. It does not classify a false, sparse, or new account as malicious by itself; NJA-000009 jointly scores account lifecycle, infrastructure reuse, concentrated research targets, cross-profile linkage, and downstream abuse while preserving the evidence distinction between criminal allegations and direct platform observation.
detects_refs: [NJT-0037, NJS-0037-001]
