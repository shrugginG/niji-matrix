schema_version: 2.0.0
type: detection-strategy
id: DET-000036
name:
  zh: 敏感信息请求的情境与承载面验证
  en: Context and Hosting-Surface Validation for Sensitive Information Requests
summary:
  zh: 验证请求者授权、关系、信息敏感度、托管租户和数据去向，识别外观合理的信息诱导。
  en: Validate requester authorization, relationships, information sensitivity, hosting tenant, and data destination to identify plausible-looking information elicitation.
description:
  paragraphs:
  - zh: 本策略覆盖情境一致的身份与话术伪装以及可信界面与托管表面借用。它不依赖拼写错误、关键词或可信域名的单点判断，而由 NJA-000010 将通信身份、业务授权、目标敏感度、表单或页面所有权、提交目的地和后续账户活动组合验证，并把真正受信账户的滥用交给独立审计策略处理。
    en: This strategy covers context-conforming persona and pretext camouflage and trusted interface or hosting-surface borrowing. It does not rely on spelling mistakes, keywords, or a trusted domain as a single decision point. NJA-000010 jointly validates communication identity, business authorization, target sensitivity, form or page ownership, submission destination, and downstream account activity, while genuine trusted-account abuse is handled by a separate audit strategy.
detects_refs: [NJT-0036, NJS-0036-001, NJS-0036-005]
