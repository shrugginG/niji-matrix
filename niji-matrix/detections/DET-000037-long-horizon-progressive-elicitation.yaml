schema_version: 2.0.0
type: detection-strategy
id: DET-000037
name:
  zh: 长周期渐进式信息诱导关联
  en: Long-Horizon Progressive Information-Elicitation Correlation
summary:
  zh: 跨消息与渠道重构关系建立、低敏请求和敏感披露升级，识别单条消息不完整的诱导目的。
  en: Reconstruct relationship building, low-sensitivity requests, and escalation to sensitive disclosure across messages and channels to identify elicitation purpose absent from any one message.
description:
  paragraphs:
  - zh: 本策略针对将完整信息索取分散到多轮会话的行为，要求保存会话身份、请求对象、敏感度和渠道迁移。NJA-000011 按关系建立、信任确认、低敏感度请求、敏感度上升和关键披露构建时间序列，并结合授权关系与正常长期访谈基线，避免单纯把长对话或多次消息判为恶意。
    en: This strategy targets behavior that distributes a complete information request across multiple conversation turns and requires retention of conversation identity, requested objects, sensitivity, and channel transitions. NJA-000011 builds a temporal sequence of relationship building, trust confirmation, low-sensitivity requests, sensitivity escalation, and critical disclosure, combining authorization context and normal long-running interview baselines so conversation length or message count alone is not treated as malicious.
detects_refs: [NJT-0036, NJS-0036-002]
domains: [enterprise]
analytic_refs: [NJA-000011]
evidence_refs: [REF-000024, REF-000043]
