schema_version: 2.0.0
type: detection-strategy
id: DET-000038
name:
  zh: 受信账户诱导与邮箱痕迹完整性关联
  en: Trusted-Account Solicitation and Mailbox-Trace Integrity Correlation
summary:
  zh: 将异常会话、受信线程中的敏感请求、发送后删除以及规则和转发变化关联，恢复账户滥用与缺失痕迹。
  en: Correlate anomalous sessions, sensitive requests in trusted threads, post-send deletion, and rule or forwarding changes to recover account abuse and missing traces.
description:
  paragraphs:
  - zh: 本策略同时观察真实受信账户或既有线程被用于信息诱导，以及消息、规则和元数据随后被抑制的行为，但在结果中区分两类稳定变量。NJA-000012 以不可变身份和邮箱审计为基础，把登录、令牌、收件人、线程、发送、删除、规则、转发和审计缺口按时间关联，避免仅依赖域认证或用户普通邮箱视图。
    en: This strategy observes both use of a genuine trusted account or existing thread for information elicitation and subsequent suppression of messages, rules, or metadata, while separating the two stable variables in its result. NJA-000012 uses immutable identity and mailbox audit to correlate login, token, recipient, thread, send, deletion, rule, forwarding, and audit-gap events over time rather than relying only on domain authentication or a user's ordinary mailbox view.
detects_refs: [NJT-0036, NJS-0036-003, NJS-0036-004]
domains: [enterprise]
analytic_refs: [NJA-000012]
evidence_refs: [REF-000024, REF-000042]
