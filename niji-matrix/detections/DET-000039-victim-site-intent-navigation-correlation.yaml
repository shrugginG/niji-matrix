schema_version: 2.0.0
type: detection-strategy
id: DET-000039
name:
  zh: 受害者网站访问意图与导航序列关联
  en: Victim-Site Access-Intent and Navigation-Sequence Correlation
summary:
  zh: 关联客户端特征、请求节奏、页面主题、导航来源和后续使用，识别拟态正常访客或仅依赖已发布路径的侦查。
  en: Correlate client features, request cadence, page topics, navigation provenance, and downstream use to identify reconnaissance mimicking benign visitors or relying only on published paths.
description:
  paragraphs:
  - zh: 本策略面向直接进入受害者 Web 日志但有意保持正常会话外观或避免猜测式路径信号的侦查。NJA-000013 重构访问者会话、Referer、链接图、sitemap 与 robots 读取、路径状态、主题组合和后续活动，并明确区分合法访客、经授权爬虫、普通索引器以及对公开内容进行恶意目标画像的行为。
    en: This strategy covers reconnaissance that enters victim web logs directly while deliberately maintaining a normal session appearance or avoiding speculative-path signals. NJA-000013 reconstructs visitor sessions, referrers, link graphs, sitemap and robots reads, path status, topic combinations, and downstream activity, explicitly separating legitimate visitors, authorized crawlers, ordinary indexers, and malicious targeting through public content.
detects_refs: [NJT-0038, NJS-0038-001, NJS-0038-002]
