schema_version: 2.0.0
type: detection-strategy
id: DET-000040
name:
  zh: 威胁情报自查与反馈后谱系关联
  en: Threat-Intelligence Self-Query and Post-Feedback Lineage Correlation
summary:
  zh: 关联威胁平台自查、公开披露、候选资源声誉和后续指标变化，识别反馈驱动的轮换与基础设施门控。
  en: Correlate threat-platform self-queries, public disclosures, candidate-resource reputation, and subsequent indicator changes to identify feedback-driven rotation and infrastructure gating.
description:
  paragraphs:
  - zh: 本策略以威胁情报提供方、公开披露和跨时间恶意活动谱系为观察面，区分直接记录的平台自查与仅由披露后变化推断的反馈。NJA-000014 将查询账户、查询指标、声誉结果、报告发布时间、旧指标消失、新实体出现以及代码、证书、托管、行为和目标关系联合起来；正常研究、品牌保护和资产所有者声誉检查必须依据授权与对象归属排除。
    en: This strategy uses threat-intelligence provider, public-disclosure, and longitudinal malicious-activity lineage vantage points and separates directly recorded platform self-checking from feedback inferred only through post-disclosure change. NJA-000014 combines querying account, queried indicator, reputation result, report publication time, disappearance of old indicators, appearance of new entities, and code, certificate, hosting, behavioral, and targeting relationships; normal research, brand protection, and asset-owner reputation checks require exclusion through authorization and object ownership.
detects_refs: [NJT-0039, NJS-0039-001, NJS-0039-002]
