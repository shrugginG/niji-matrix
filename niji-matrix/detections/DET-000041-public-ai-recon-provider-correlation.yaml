schema_version: 2.0.0
type: detection-strategy
id: DET-000041
name:
  zh: 公共 AI 侦查服务商关联
  en: Public-AI Reconnaissance Provider Correlation
summary:
  zh: 关联公共 AI 账户、提示、响应、目标实体、工具调用和后续活动，识别由服务商中介的目标研究与查询替代。
  en: Correlate public-AI accounts, prompts, responses, target entities, tool calls, and downstream activity to identify provider-mediated target research and query substitution.
description:
  paragraphs:
  - zh: 本策略由公共 AI 服务商或获得其可信共享的调查方实施，目标组织通常没有直接观察面。NJA-000015 识别围绕同一人员、组织、技术或伙伴的多轮实体补齐、列表构建、跨源综合和检索工具调用，并把输出与后续定向活动连接；通用研究、教育、新闻、合规和安全使用必须依据账户角色、授权和下游目的排除。
    en: This strategy is implemented by a public-AI provider or investigators receiving its trusted sharing, while victim organizations generally lack a direct vantage. NJA-000015 identifies multi-turn entity completion, list building, cross-source synthesis, and retrieval-tool invocation around the same people, organizations, technologies, or partners and connects output with downstream targeting; general research, education, journalism, compliance, and security use require exclusion through account role, authorization, and downstream purpose.
detects_refs: [NJT-0040, NJS-0040-001]
domains: [enterprise]
analytic_refs: [NJA-000015]
