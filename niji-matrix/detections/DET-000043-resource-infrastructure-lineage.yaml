schema_version: 2.0.0
type: detection-strategy
id: DET-000043
name:
  zh: 取得型行动基础设施的来源与生命周期谱系
  en: Acquired Operational-Infrastructure Provenance and Lifecycle Lineage
summary:
  zh: 关联注册、租户、证书、DNS、托管、休眠与替换关系，识别借用共享信任、预用老化和预置资源池的行动基础设施。
  en: Correlate registration, tenant, certificate, DNS, hosting, dormancy, and replacement relationships to identify operational infrastructure using shared trust, pre-use aging, or
    prepositioned resource pools.
description:
  paragraphs:
  - zh: 本策略覆盖通过非攻陷方式取得且具有明确匿迹设计的行动基础设施。NJA-000017 在资源、租户、注册者、证书、DNS、托管、内容和后续目标之间建立长期谱系，分别识别合法多租户外层下的异常对象、长期低活动后的突然启用，以及跨注册商或供应商预置并依次激活的替换资源；供应商域、ASN 或域龄本身不作为善恶结论。
    en: This strategy covers operational infrastructure obtained without compromise and carrying an explicit stealth design. NJA-000017 builds long-horizon lineage across resources,
      tenants, registrants, certificates, DNS, hosting, content, and downstream targets to distinguish anomalous objects beneath legitimate multi-tenant surfaces, sudden activation after
      prolonged low activity, and replacements prepositioned across registrars or providers and activated in sequence; provider domain, ASN, or domain age alone is not a trust verdict.
