schema_version: "2.0.0"
type: detection-strategy
id: DET-000044
name:
  zh: 被接管行动账户的生命周期与情境完整性
  en: Taken-Over Operational-Account Lifecycle and Context Integrity
summary:
  zh: 关联异常会话、真实历史检索、账户变更与首次对外用途，识别被接管账户的准备活动。
  en: Correlate anomalous sessions, genuine-history access, account changes, and first outward use to identify preparation of taken-over accounts.
description:
  paragraphs:
    - zh: 本策略关注既有账户被接管后、首次对外行动前的准备窗口。NJA-000018 把登录与令牌变化、设备和恢复属性、邮箱或文件历史访问、规则与设置变化以及首次高风险用途组织成连续时间线，以识别攻击者利用真实关系情境准备后续行动的过程，同时将合法账户恢复、审计与日常历史检索作为替代解释进行校准。
      en: This strategy focuses on the preparation window after an existing account is taken over and before its first outward action. NJA-000018 organizes sign-in and token changes, device and recovery attributes, mailbox or file history access, rule and setting changes, and first high-risk use into a continuous timeline to identify preparation that exploits genuine relationship context, while calibrating legitimate account recovery, audit, and routine history access as alternative explanations.
