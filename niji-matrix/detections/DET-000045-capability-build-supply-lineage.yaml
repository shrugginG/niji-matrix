schema_version: 2.0.0
type: detection-strategy
id: DET-000045
name:
  zh: 匿迹能力构建与供应谱系
  en: Stealth-Capability Build and Supply Lineage
summary:
  zh: 从样本、构建、配置、签名、供应商和客户关系恢复自研或外取能力的稳定谱系与门控行为。
  en: Recover stable lineage and gating behavior of developed or externally obtained capability from samples, builds, configuration, signatures, providers, and customer relationships.
description:
  paragraphs:
  - zh: 本策略以从样本、构建、配置、签名、供应商和客户关系恢复自研或外取能力的稳定谱系与门控行为。为目标。NJA-000019 将多源遥测组织为可实施的时间与实体谱系，并要求多个独立信号共同支持结论；资源类别、账户年龄、工具名称、签名、供应商或单次响应本身均不作为善恶判据。
    en: This strategy aims to recover stable lineage and gating behavior of developed or externally obtained capability from samples, builds, configuration, signatures, providers, and
      customer relationships. NJA-000019 organizes multi-source telemetry into implementable temporal and entity lineage and requires multiple independent signals; resource class, account
      age, tool name, signature, provider, or one response is never a trust verdict by itself.
