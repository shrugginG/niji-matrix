id: DET-000046
name:
  zh: 欺骗内容人物设定与来源关联
  en: Deceptive-Content Persona and Provenance Correlation
summary:
  zh: 识别以目标资料约束生成并跨账户维持一致人物、语言和业务情境的欺骗内容资产。
  en: Identify deceptive content assets constrained by victim information and maintaining coherent persona, language, and business context across accounts.
description:
  paragraphs:
  - zh: 本策略以识别以目标资料约束生成并跨账户维持一致人物、语言和业务情境的欺骗内容资产。为目标。NJA-000020 将多源遥测组织为可实施的时间与实体谱系，并要求多个独立信号共同支持结论；资源类别、账户年龄、工具名称、签名、供应商或单次响应本身均不作为善恶判据。
    en: This strategy aims to identify deceptive content assets constrained by victim information and maintaining coherent persona, language, and business context across accounts. NJA-000020
      organizes multi-source telemetry into implementable temporal and entity lineage and requires multiple independent signals; resource class, account age, tool name, signature, provider,
      or one response is never a trust verdict by itself.
