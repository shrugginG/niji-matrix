schema_version: 2.0.0
type: detection-strategy
id: DET-000047
name:
  zh: 条件门控投放多视角差异分析
  en: Multi-Vantage Differential Analysis of Context-Gated Staging
summary:
  zh: 对同一已投放资源使用不同地域、设备、User-Agent、Referer、会话和时间进行授权抓取，识别条件化响应差异。
  en: Fetch the same staged resource from authorized variations in geography, device, user agent, referrer, session, and time to identify conditional response differences.
description:
  paragraphs:
  - zh: 本策略以对同一已投放资源使用不同地域、设备、User-Agent、Referer、会话和时间进行授权抓取，识别条件化响应差异。为目标。NJA-000021 将多源遥测组织为可实施的时间与实体谱系，并要求多个独立信号共同支持结论；资源类别、账户年龄、工具名称、签名、供应商或单次响应本身均不作为善恶判据。
    en: This strategy aims to fetch the same staged resource from authorized variations in geography, device, user agent, referrer, session, and time to identify conditional response
      differences. NJA-000021 organizes multi-source telemetry into implementable temporal and entity lineage and requires multiple independent signals; resource class, account age,
      tool name, signature, provider, or one response is never a trust verdict by itself.
