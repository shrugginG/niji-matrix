schema_version: "2.0.0"
type: detection-strategy
id: DET-000048
name:
  zh: 外部访问暴露、交付谱系与首次使用关联
  en: External Access Exposure, Handoff Lineage, and First-Use Correlation
summary:
  zh: 将经纪或伙伴侧访问暴露与目标侧入口历史、监控覆盖、认证状态和首次异常使用关联，恢复被分段的访问交付链。
  en: Correlate broker- or partner-side access exposure with victim foothold history, monitoring coverage, authentication state, and first anomalous use to recover segmented access handoff chains.
description:
  paragraphs:
    - zh: 本策略检测已经存在的目标访问权被取得并准备为后续资源的过程，而不把地下市场提及或一次异常登录单独视为结论。NJA-000022 将外部访问清单、凭据或会话暴露、资产与入口历史、身份和远程服务事件、端点覆盖快照以及首次使用组织成同一谱系，分别识别监控缺口筛选、卖方与买方分段、长时间休眠和活动认证状态交付。
      en: This strategy detects acquisition and preparation of existing victim access as a later resource without treating one underground-market mention or anomalous sign-in as conclusive. NJA-000022 organizes external access listings, credential or session exposure, asset and foothold history, identity and remote-service events, endpoint coverage snapshots, and first use into one lineage to distinguish monitoring-gap selection, seller-buyer segmentation, long dormancy, and live authentication-state transfer.
