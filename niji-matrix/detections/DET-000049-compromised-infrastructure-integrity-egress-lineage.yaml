schema_version: 2.0.0
type: detection-strategy
id: DET-000049
name:
  zh: 被攻陷基础设施完整性与出口谱系
  en: Compromised-Infrastructure Integrity and Egress Lineage
summary:
  zh: 跨注册、提供方、资产所有者、互联网观测和内容投放记录恢复取得、攻陷与投放基础设施的真实谱系。
  en: Recover true lineage of acquired, compromised, and staging infrastructure across registration, provider, asset-owner, Internet-observation, and content-deployment records.
description:
  paragraphs:
  - zh: 本策略以跨注册、提供方、资产所有者、互联网观测和内容投放记录恢复取得、攻陷与投放基础设施的真实谱系。为目标。NJA-000023 将多源遥测组织为可实施的时间与实体谱系，并要求多个独立信号共同支持结论；资源类别、账户年龄、工具名称、签名、供应商或单次响应本身均不作为善恶判据。
    en: This strategy aims to recover true lineage of acquired, compromised, and staging infrastructure across registration, provider, asset-owner, Internet-observation, and content-deployment
      records. NJA-000023 organizes multi-source telemetry into implementable temporal and entity lineage and requires multiple independent signals; resource class, account age, tool
      name, signature, provider, or one response is never a trust verdict by itself.
