schema_version: 2.0.0
type: detection-strategy
id: DET-000050
name:
  zh: 新建行动账户培育与跨平台人物谱系
  en: Established Operational-Account Cultivation and Cross-Platform Persona Lineage
summary:
  zh: 区分长期培育的新建人物账户与被接管真实账户，并识别其在下游行动前的异常历史访问或关系塑造。
  en: Distinguish long-cultivated fabricated accounts from taken-over real accounts and identify abnormal history access or relationship shaping before downstream action.
description:
  paragraphs:
  - zh: 本策略以区分长期培育的新建人物账户与被接管真实账户，并识别其在下游行动前的异常历史访问或关系塑造。为目标。NJA-000024 将多源遥测组织为可实施的时间与实体谱系，并要求多个独立信号共同支持结论；资源类别、账户年龄、工具名称、签名、供应商或单次响应本身均不作为善恶判据。
    en: This strategy aims to distinguish long-cultivated fabricated accounts from taken-over real accounts and identify abnormal history access or relationship shaping before downstream
      action. NJA-000024 organizes multi-source telemetry into implementable temporal and entity lineage and requires multiple independent signals; resource class, account age, tool
      name, signature, provider, or one response is never a trust verdict by itself.
