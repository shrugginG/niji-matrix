schema_version: 2.0.0
type: detection-strategy
id: DET-000051
name:
  zh: 传输路径与浏览器入口多视点关联
  en: Transfer-Path and Browser-Entry Multivantage Correlation
summary:
  zh: 比较源站、独立出口、代理与端点观察，识别路径注入和正常浏览触发入口。
  en: Compare origin, independent-egress, proxy, and endpoint observations to identify path injection and ordinary-browsing-triggered entry.
description:
  paragraphs:
  - zh: 本策略以比较源站、独立出口、代理与端点观察，识别路径注入和正常浏览触发入口为检测目标。NJA-000025 负责把入口前后的多源事件组织为时间、主体与资源谱系，并要求至少两个独立信号共同支持结论；成功认证、可信来源、合法平台、已签名制品、新设备或单次异常本身都不构成恶意判据。
    en: This strategy seeks to compare origin, independent-egress, proxy, and endpoint observations to identify path injection and ordinary-browsing-triggered entry. NJA-000025 organizes
      multi-source events around entry into temporal, subject, and resource lineage and requires at least two independent signals to support a conclusion; successful authentication,
      trusted provenance, legitimate platform, signed artifact, new device, or one anomaly is not a maliciousness verdict by itself.
