schema_version: 2.0.0
type: detection-strategy
id: DET-000052
name:
  zh: 公开应用利用与边界设备入口关联
  en: Public-Application Exploit and Edge-Entry Correlation
summary:
  zh: 关联稀疏利用请求、错误/响应与服务端进程、文件、配置、会话和外连。
  en: Correlate sparse exploit requests and errors or responses with server processes, files, configuration, sessions, and egress.
description:
  paragraphs:
  - zh: 本策略以关联稀疏利用请求、错误/响应与服务端进程、文件、配置、会话和外连为检测目标。NJA-000026 负责把入口前后的多源事件组织为时间、主体与资源谱系，并要求至少两个独立信号共同支持结论；成功认证、可信来源、合法平台、已签名制品、新设备或单次异常本身都不构成恶意判据。
    en: This strategy seeks to correlate sparse exploit requests and errors or responses with server processes, files, configuration, sessions, and egress. NJA-000026 organizes multi-source
      events around entry into temporal, subject, and resource lineage and requires at least two independent signals to support a conclusion; successful authentication, trusted provenance,
      legitimate platform, signed artifact, new device, or one anomaly is not a maliciousness verdict by itself.
