schema_version: 2.0.0
type: detection-strategy
id: DET-000053
name:
  zh: 远程服务、有效身份与受信路径入口关联
  en: Remote-Service Valid-Identity and Trusted-Path Entry Correlation
summary:
  zh: 联合身份、会话、设备、来源、远程服务和跨组织委托判断成功认证背后的实际操作者。
  en: Join identity, session, device, origin, remote service, and cross-organization delegation to assess the operator behind
    successful authentication.
description:
  paragraphs:
  - zh: 本策略以联合身份、会话、设备、来源、远程服务和跨组织委托判断成功认证背后的实际操作者为检测目标。NJA-000027 负责把入口前后的多源事件组织为时间、主体与资源谱系，并要求至少两个独立信号共同支持结论；成功认证、可信来源、合法平台、已签名制品、新设备或单次异常本身都不构成恶意判据。
    en: This strategy seeks to join identity, session, device, origin, remote service, and cross-organization delegation to
      assess the operator behind successful authentication. NJA-000027 organizes multi-source events around entry into temporal,
      subject, and resource lineage and requires at least two independent signals to support a conclusion; successful authentication,
      trusted provenance, legitimate platform, signed artifact, new device, or one anomaly is not a maliciousness verdict
      by itself.
  - zh: 对 NJT-0055 的 Persistence 用途，策略把首次访问和后续重入按同一 identity、token/session、device、service 与 risk context 串联，识别原植入或会话失效后仍由外部服务恢复的访问。长期正常远程工作是反例，单次成功重入仍需未经批准的会话状态、风险情境或后继结果支持。
    en: For NJT-0055 under Persistence, the strategy links initial access and later re-entry through the same identity, token
      or session, device, service, and risk context to identify access restored through an external service after an implant
      or session fails. Long-term normal remote work is a counterexample, and one successful re-entry still requires support
      from unapproved session state, risk context, or follow-on outcome.
  - zh: 对 NJT-0061，本策略分别处理情境贴合、会话续用和低反馈身份三条不可替代的链，并要求攻击者控制与资源接受。TA0003 再按 identity、session/token、device、resource 和 access episode 连接先前已接受使用、原 session 结束或凭据/风险/处置事件、后续认证或会话续用及实际 resource allow。账户启用、材料已知、重复登录、住宅 IP、无 MFA、休眠阈值或一个资源事件都只形成 identity_exposure、accepted_identity_use 或 persistence_unresolved；完整跨时段链才形成 persistent_identity_access_confirmed。
    en: For NJT-0061 the strategy handles three non-substitutable chains for context alignment session reuse and low-feedback identity and requires adversary-control plus resource-acceptance evidence. TA0003 additionally joins prior accepted use original-session termination or credential risk and response events later authentication or session continuation and an actual resource allow by identity session or token device resource and access episode. Enabled account state known material repeated sign-in residential IP missing MFA dormancy threshold or one resource event supports identity_exposure accepted_identity_use or persistence_unresolved only. A complete cross-episode chain produces persistent_identity_access_confirmed.
  - zh: TA0004 输出还必须加入权限结果门：保存同一攻击者已控较低权限前态，绑定精确 accepted identity/session，解析实际 resulting principal/token 与事件时授权集合，再验证首个攻击者资源操作相对前态为
      expected-deny/observed-allow。策略把 identity_anomaly、accepted_identity_use、privileged_session、authority_unresolved、same_authority_use
      与 elevation_confirmed 分级；admin/root/Global Administrator、Windows 4672 或高权 API 事件任一单点不得直接升级。
    en: TA0004 output additionally applies an authority-result gate. Preserve the lower-authority pre-state controlled by
      the same adversary bind the exact accepted identity or session resolve the actual resulting principal or token and event-time
      authorization set and validate the first adversary resource operation as expected-deny for the pre-state and observed-allow
      for the result. The strategy tiers identity_anomaly accepted_identity_use privileged_session authority_unresolved same_authority_use
      and elevation_confirmed. An admin root or Global Administrator label Windows 4672 or a privileged API event cannot promote
      a result by itself.
