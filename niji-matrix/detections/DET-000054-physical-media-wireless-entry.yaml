schema_version: 2.0.0
type: detection-strategy
id: DET-000054
name:
  zh: 物理硬件、可移动介质与无线入口关联
  en: Physical-Hardware Removable-Media and Wireless Entry Correlation
summary:
  zh: 关联物理资产、USB/卷、交换/WLAN、端点和带外射频信号识别近距离入口。
  en: Correlate physical assets, USB/volumes, switching/WLAN, endpoint, and out-of-band RF signals to identify proximate entry.
description:
  paragraphs:
  - zh: 本策略以关联物理资产、USB/卷、交换/WLAN、端点和带外射频信号识别近距离入口为检测目标。NJA-000028 负责把入口前后的多源事件组织为时间、主体与资源谱系，并要求至少两个独立信号共同支持结论；成功认证、可信来源、合法平台、已签名制品、新设备或单次异常本身都不构成恶意判据。
    en: This strategy seeks to correlate physical assets, USB/volumes, switching/WLAN, endpoint, and out-of-band RF signals to identify proximate entry. NJA-000028 organizes multi-source
      events around entry into temporal, subject, and resource lineage and requires at least two independent signals to support a conclusion; successful authentication, trusted provenance,
      legitimate platform, signed artifact, new device, or one anomaly is not a maliciousness verdict by itself.
