schema_version: 2.0.0
type: detection-strategy
id: DET-000055
name:
  zh: 钓鱼会话、托管对象与首次入口跨层关联
  en: Phishing Conversation Hosted-Object and First-Entry Correlation
summary:
  zh: 从实际消息和会话追踪到点击、进程、远程协助、IdP 认证和首个会话。
  en: Trace actual messages and conversations through clicks, processes, remote assistance, IdP authentication, and first session.
description:
  paragraphs:
  - zh: 本策略以从实际消息和会话追踪到点击、进程、远程协助、IdP 认证和首个会话为检测目标。NJA-000029 负责把入口前后的多源事件组织为时间、主体与资源谱系，并要求至少两个独立信号共同支持结论；成功认证、可信来源、合法平台、已签名制品、新设备或单次异常本身都不构成恶意判据。
    en: This strategy seeks to trace actual messages and conversations through clicks, processes, remote assistance, IdP authentication, and first session. NJA-000029 organizes multi-source
      events around entry into temporal, subject, and resource lineage and requires at least two independent signals to support a conclusion; successful authentication, trusted provenance,
      legitimate platform, signed artifact, new device, or one anomaly is not a maliciousness verdict by itself.
