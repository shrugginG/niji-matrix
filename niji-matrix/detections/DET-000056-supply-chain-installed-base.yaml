schema_version: 2.0.0
type: detection-strategy
id: DET-000056
name:
  zh: 供应链构建、交付与安装基数关联
  en: Supply-Chain Build Delivery and Installed-Base Correlation
summary:
  zh: 连接源码、依赖、构建、签名、发布、安装和选择性后续激活。
  en: Connect source, dependencies, build, signing, release, installation, and selective later activation.
description:
  paragraphs:
  - zh: 本策略以连接源码、依赖、构建、签名、发布、安装和选择性后续激活为检测目标。NJA-000030 负责把入口前后的多源事件组织为时间、主体与资源谱系，并要求至少两个独立信号共同支持结论；成功认证、可信来源、合法平台、已签名制品、新设备或单次异常本身都不构成恶意判据。
    en: This strategy seeks to connect source, dependencies, build, signing, release, installation, and selective later activation. NJA-000030 organizes multi-source events around entry
      into temporal, subject, and resource lineage and requires at least two independent signals to support a conclusion; successful authentication, trusted provenance, legitimate platform,
      signed artifact, new device, or one anomaly is not a maliciousness verdict by itself.
