schema_version: 2.0.0
type: detection-strategy
id: DET-000060
name: {zh: 用户内容—交互—首个执行结果谱系, en: User Content-Interaction-First Execution Outcome Lineage}
summary: {zh: 将内容与身份来源、用户工作流或多步交互、Helper/Interpreter 和首个进程/网络结果连接，检测用户授权的恶意执行, en: Join content and identity provenance user workflow or multi-step interaction helpers or interpreters and first process or network outcome to detect malicious user-authorized execution}
description:
  paragraphs:
    - {zh: 本策略不把用户点击、npm install、PowerShell 或浏览器本身视为恶意，而是恢复最初内容/身份如何促成用户动作和首个恶意结果。NJA-000038 覆盖直接 workflow 链与跨应用多步链：前者用邮件/URL/USB/repository/remote-support provenance 与用户角色解释动作，后者用 clipboard content、window focus、Run/terminal 与 full command 弥补缺失的 browser→shell 父子关系。, en: This strategy does not treat user clicks npm install PowerShell or browsers as malicious by themselves and instead recovers how original content or identity caused a user action and first malicious outcome. NJA-000038 covers direct workflow and cross-application multi-step chains. The first uses mail URL USB repository or remote-support provenance plus user role and the second uses clipboard content window focus Run or terminal and full commands to compensate for missing browser-to-shell parentage.}
    - {zh: 高风险要求不可信或不一致 provenance、可归因 user action 和异常 execution outcome 三层中至少两层共享 user/session/device/content/time，三层齐全时高置信。合法开发、更新、helpdesk、USB 与安全测试保留为替代解释；隐私受限或 content 不可见时降低置信度，不把“用户做了”当作“用户有恶意”。, en: High risk requires at least two of untrusted or inconsistent provenance attributable user action and anomalous execution outcome sharing user session device content and time and all three yields high confidence. Legitimate development updates helpdesk USB and security testing remain alternatives and privacy-limited or unavailable content lowers confidence rather than treating user action as user malice.}
detects_refs: [NJT-0081, NJS-0081-001, NJS-0081-002]
domains: [enterprise]
analytic_refs: [NJA-000038]
evidence_refs: [REF-000105, REF-000133, REF-000297, REF-000298, REF-000103, REF-000031, REF-000301, REF-000302]
