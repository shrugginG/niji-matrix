schema_version: "2.0.0"
type: detection-strategy
id: DET-000061
name: {zh: 原生调用路径—解析—执行结果关联, en: Native Call Path-Resolution-Execution Outcome Correlation}
summary: {zh: 将 syscall 来源和调用栈、运行时 API 解析与内存/线程/进程结果连接，识别用户态观察绕过和静态导入缺失。, en: Join syscall origin and call stack runtime API resolution and memory thread or process outcomes to identify user-mode observation bypass and missing static imports.}
description:
  paragraphs:
  - zh: NJA-000039 为敏感原生操作建立 invocation ID，连接进程/线程、syscall 或 API、完整调用栈、模块/内存映射、OS build、静态导入与运行时导出解析，再观察内存权限、跨进程写入、线程/进程、模块和文件/网络结果。直接/间接 syscall 分支检查真实 caller 到 syscall 指令的来源，动态解析分支检查磁盘声明与实际目标差异。
    en: NJA-000039 creates an invocation ID for sensitive native operations and joins process or thread, syscall or API, complete call stack, module or memory map, OS build, static imports, and runtime export resolution before observing memory protection, cross-process writes, threads or processes, modules, and file or network outcomes. The direct or indirect syscall branch checks true-caller-to-syscall-instruction provenance; the dynamic-resolution branch checks disk declarations against actual targets.
  - zh: 非标准栈、GetProcAddress 或可执行内存都不单独定性。高置信结果要求调用路径/解析差异与敏感结果构成因果序列，并排除 JIT、浏览器、反作弊、安全软件和兼容层基线。缺少调用栈时只输出原生结果异常，不能声称已识别直接 syscall 子项。
    en: A nonstandard stack GetProcAddress or executable memory is never a verdict alone. High confidence requires a call-path or resolution differential causally joined to a sensitive outcome after excluding JIT browser anti-cheat security-software and compatibility-layer baselines. Without call stacks emit only a native-outcome anomaly and do not claim the direct-syscall child.
detects_refs: [NJT-0073, NJS-0073-001, NJS-0073-002]
