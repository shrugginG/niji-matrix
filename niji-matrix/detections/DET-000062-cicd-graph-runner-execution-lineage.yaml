schema_version: 2.0.0
type: detection-strategy
id: DET-000062
name: {zh: 流水线输入—Runner—敏感结果谱系关联, en: Pipeline Input-Runner-Sensitive Outcome Lineage Correlation}
summary: {zh: 从版本化定义或不可信输入沿 workflow、job 和 runner 关联到进程、秘密、网络与制品结果，识别受信构建图中的恶意执行, en: Trace versioned definitions or untrusted inputs through workflows jobs and runners to process secret network and artifact outcomes to identify malicious execution in trusted build graphs}
description:
  paragraphs:
    - zh: 本策略检测的不是“CI 运行”或“workflow 被修改”这类常见事件，而是不可信定义或输入在受信 runner 上形成敏感执行结果的完整因果链。NJA-000040 同时覆盖定义注入、间接构建输入和外部贡献三个入口，把源代码管理、CI 控制面、runner 运行时、凭据/网络和制品来源数据规范到共同 run、commit、artifact 与 principal 维度。
      en: This strategy detects neither CI runs nor workflow edits as common events but the complete causal chain in which an untrusted definition or input produces a sensitive execution outcome on a trusted runner. NJA-000040 covers definition injection indirect build inputs and external contributions and normalizes source control CI control plane runner runtime credential or network and artifact provenance data onto shared run commit artifact and principal dimensions.
    - zh: 风险只有在输入或权限异常与实际 runner 进程、秘密访问、未预期网络、runner 注册或制品差异共同出现时才升高。策略保留合法 workflow 维护、首次依赖下载、release 变化和外部贡献构建作为替代解释，并在输入 digest、跨 workflow 制品谱系或端点遥测缺失时显式降低置信度。
      en: Risk rises only when an input or permission anomaly co-occurs with actual runner process behavior secret access unexpected network runner registration or artifact difference. The strategy preserves legitimate workflow maintenance first-time dependency downloads release changes and external-contribution builds as alternative explanations and explicitly lowers confidence when input digests cross-workflow artifact lineage or endpoint telemetry is absent.
detects_refs: [NJT-0074, NJS-0074-001, NJS-0074-002, NJS-0074-003]
