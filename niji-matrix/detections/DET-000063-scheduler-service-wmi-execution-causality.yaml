schema_version: 2.0.0
type: detection-strategy
id: DET-000063
name:
  zh: 调度器、服务与 WMI 执行因果关联
  en: Scheduler, Service, and WMI Execution-Causality Correlation
summary:
  zh: 把任务或服务状态及 WMI 请求与受信系统宿主产生的真实执行结果连接起来。
  en: Connect task or service state and WMI requests with actual execution
    outcomes produced by trusted system hosts.
description:
  paragraphs:
    - zh: 本策略以跨层因果和执行谱系为检测目标，覆盖所列父技术与子技术。其 Analytic
        分别规范控制或触发事件、真实执行结果和情境基线；只有多个共享关联键的信号共同出现时才提高风险，合法维护、开发、自动化和用户活动必须保留为替代解释。
      en: This strategy targets cross-layer causality and execution lineage across the
        listed parents and children. Its analytics normalize control or trigger
        events, actual execution outcomes, and contextual baselines. Risk
        increases only when multiple signals share correlation keys, while
        legitimate maintenance, development, automation, and user activity
        remain alternative explanations.
    - zh: 对 NJT-0089，NJA-000041
        另行恢复服务定义版本、解析目标、对象权限与标准枚举结果，区分既有服务身份替换和受限枚举。名称或受信父进程只提供上下文，不能覆盖定义差异；标准视图缺少对象时必须与高权限原始状态及实际进程结果比较。
      en: For NJT-0089, NJA-000041 additionally reconstructs service-definition
        version, resolved target, object permissions, and standard enumeration
        results to separate established-service identity substitution from
        restricted enumeration. A name or trusted parent provides context rather
        than overriding definition differences; when an object is absent from a
        standard view, that view must be compared with privileged raw state and
        actual process outcomes.
    - zh: 服务分支必须分别产生 definition_anomaly、persistence_restored、elevation_confirmed 与 authority_unresolved 输出。提权确认要求同一 object/version 的 writer 或 pre-state 授权集合、manager 实际采用记录、service account/token/security context、正向 pre/post authority delta 和首个新获准操作；root/SYSTEM 标签、成功启动、枚举缺失或异常子进程只能构成中间证据。
      en: The service branch must emit definition_anomaly, persistence_restored, elevation_confirmed, and authority_unresolved separately. Elevation confirmation requires writer or pre-state authorization for the same object and version, evidence of actual manager adoption, service account, token, or security context, a positive before-and-after authority difference, and the first newly authorized operation. A root or SYSTEM label, successful start, enumeration absence, or anomalous child process is only intermediate evidence.
