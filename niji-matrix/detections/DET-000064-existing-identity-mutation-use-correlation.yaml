schema_version: 2.0.0
type: detection-strategy
id: DET-000064
name:
  zh: 既有身份状态变更与后续使用关联
  en: Existing-Identity State-Mutation and Subsequent-Use Correlation
summary:
  zh: 分别恢复既有身份的并行认证器、授权图边和设备信任变更，将稳定键与首次认证、有效授权或设备条件访问连接，并区分跨会话持久化链与相对 pre-state 的权限提升链。
  en: Separately reconstruct parallel-authenticator, authorization-graph, and device-trust mutations on an existing identity, join each stable key to first authentication, effective authorization, or device-conditioned access, and distinguish a cross-session persistence chain from authority gain relative to pre-state.
description:
  paragraphs:
  - zh: 本策略检测攻击者把短期管理权限转化为三类持久身份状态，而不是把任何密码重置、角色授予、设备登记或成功登录单独视为恶意。所有分支先确认目标主体在变更前存在，并保存发起者、目标、old/new 值、审批、有效期和状态键。认证分支以 key、证书指纹或认证方法 ID 连接首次认证；授权分支解析角色、组、委托或策略边并连接首次获准资源操作；设备分支以
      device ID、注册/加入活动、PRT 或令牌声明和条件访问结果连接后续访问。
    en: This strategy detects conversion of temporary administrative authority into three classes of durable identity state rather than treating
      any password reset, role grant, device registration, or successful sign-in as malicious. Every branch first confirms that the target principal
      existed before mutation and retains initiator, target, old and new values, approval, validity, and a state key. The authentication branch
      joins key, certificate fingerprint, or authentication-method ID to first authentication. The authorization branch resolves a role, group,
      delegation, or policy edge and joins it to first allowed resource action. The device branch joins device ID, register or join activity,
      PRT or token claims, and Conditional Access result to later access.
  - zh: NJA-000043 分别评估来源合法性、状态持久性和使用结果，并保留“未批准状态异常”与“已关联持久化使用”两个输出。精确键可覆盖状态完整有效期；只有 principal ID 时必须降级并要求新来源、异常资源、资产不匹配、并发活动或审批缺口。轮换、岗位调整、委托工作、设备更换和自助注册作为可验证反例，避免把正常身份生命周期等同于攻击。
    en: NJA-000043 separately evaluates provenance legitimacy, state durability, and use outcome and retains distinct outputs for unapproved state
      anomaly and correlated persistence use. An exact key can span the state's complete validity. Principal-only matching must be downgraded
      and require a new origin, anomalous resource, asset mismatch, concurrent activity, or approval gap. Rotation, role change, delegated work,
      device replacement, and self-service enrollment remain verifiable counterexamples so normal identity lifecycle is not equated with attack.
  - zh: TA0004 使用相同 mutation—use 谱系，但另设“已关联权限提升”输出。该输出要求目标主体 pre-state、变更者自身原权限、changed edge、post-state 有效权限或策略结果以及首个 newly-authorized 高权限操作；认证器分支比较 source context 与目标 identity/application entitlement，授权分支执行图 diff，设备分支比较注册前后的 policy decision。没有正向 authority delta 时，即使状态持久或目标主体高权限，也只能输出状态异常或持久化链。
    en: TA0004 uses the same mutation-to-use lineage with a separate correlated privilege-escalation output. It requires target-principal pre-state, the changer's original authority, changed edge, post-state effective permission or policy result, and first newly authorized privileged action. The authenticator branch compares source context with target identity or application entitlement, the authorization branch performs a graph diff, and the device branch compares policy decisions before and after enrollment. Without a positive authority delta, durable state or a privileged target can produce only a state anomaly or persistence chain.
