schema_version: 2.0.0
type: detection-strategy
id: DET-000065
name:
  zh: 自启动状态与生命周期执行因果关联
  en: Autostart-State and Lifecycle-Execution Causality Correlation
summary:
  zh: 把自启动映射变更、同对象目标替换或会话恢复队列写入，与后续启动/登录执行连接，分别验证名称、描述符连续性和前序会话来源，并区分同权限恢复与 writer-to-consumer 权限提升。
  en: Join autostart mapping mutation, same-object target substitution, or session-restoration queue write to later boot or logon execution; separately validate name, descriptor continuity, and prior-session provenance; and distinguish same-authority restoration from writer-to-consumer privilege escalation.
description:
  paragraphs:
  - zh: 本策略检测攻击者建立或改变由启动或登录生命周期消费的持久激活映射，而不是把任一 Run 值、启动文件夹对象、登录项、plist、扩展注册或启动期进程单独视为恶意。策略从状态变更与前后快照开始，解析描述符名称、触发范围、目标、参数、所有者、写入者、权限、签名、哈希和软件清单归属，再连接下一次相关启动或登录边界内的进程、模块、文件和网络结果。若直接对象是初始化脚本内容、服务定义、一般事件订阅、日历调度或模块搜索劫持，则分别转交
      T1037、T1543、T1546、T1053 或 T1574，避免以遥测位置代替技术边界。
    en: This strategy detects adversary establishment or mutation of a durable activation mapping consumed by boot or logon lifecycle rather than
      treating any Run value, Startup-folder object, login item, plist, extension registration, or startup-time process as malicious by itself.
      It begins with state mutation and before-and-after snapshots, resolves descriptor name, trigger scope, target, arguments, owner, writer,
      permission, signature, hash, and software-inventory ownership, and then joins process, module, file, and network outcomes inside the next
      relevant boot or logon boundary. When the direct object is initialization-script content, a service definition, general event subscription,
      calendar schedule, or module-search hijack, it is referred to T1037, T1543, T1546, T1053, or T1574 respectively so telemetry location does
      not substitute for technique boundaries.
  - zh: NJA-000044 分别处理状态真实性、生命周期因果和描述符一致性。普通软件安装、更新、用户登录项变更、管理员修复和系统升级必须通过审批、软件包、签名、路径与时间窗口验证；未批准变更只有在后续实际激活、目标完整性异常或描述符与目标不一致时才提高为持久化链。更新或浏览器主题名称不能直接判恶，但当名称、发布者、目标路径、解释器、扩展和业务软件清单彼此冲突时，能够支持
      NJS-0084-001。
    en: NJA-000044 evaluates state legitimacy, lifecycle causality, and descriptor consistency separately. Ordinary software installation, update,
      user login-item change, administrator repair, and system upgrade must be validated against approval, package, signature, path, and maintenance
      window. An unapproved mutation becomes a persistence chain only when later activation, target-integrity anomaly, or descriptor-target mismatch
      is present. An update- or browser-themed name is not malicious by itself, but inconsistency among name, publisher, target path, interpreter,
      extension, and business software inventory can support NJS-0084-001.
  - zh: 策略按三项子变量输出分支结论：更新主题分支比较名称与发布者/包/真实目标；既有描述符分支要求同一 descriptor ID 或路径的可信 old/new 目标与参数，并排除批准升级；恢复队列分支把前序应用活动、队列差异、用户恢复选择和下次 logon_id 的恢复进程连接。精确描述符或恢复项缺失时只能保留父级未批准自启动状态，不越级标注子项。
    en: The strategy emits branch-specific conclusions for three child variables. The update-themed branch compares name with publisher, package,
      and actual target. The established-descriptor branch requires trusted old and new target or arguments for the same descriptor ID or path
      and excludes approved upgrades. The restoration-queue branch joins prior application activity, queue difference, user restoration choice,
      and restored process in the next logon ID. Without an exact descriptor or restoration item, output remains a parent-level unapproved autostart
      state rather than overclaiming a child.
  - zh: 对同一谱系另设两个结果门。Persistence 输出要求映射在后续生命周期恢复目标；Privilege Escalation 输出还要求保存 writer 或 pre-state 有效权限、consumer token/security context 与 post-state，并证明正向 authority delta 促成首个此前未获准操作。HKLM、系统父体、LSA/Winlogon/spooler/kernel 标签或高权限路径不能替代这条证明；缺失权限数据时保持 Persistence 或未批准状态。
    en: The same lineage has two separate outcome gates. Persistence requires the mapping to restore its target in a later lifecycle. Privilege Escalation additionally retains writer or pre-state effective authority, consumer token or security context, and post-state and proves that a positive authority delta enabled the first previously unauthorized operation. HKLM, a system parent, LSA, Winlogon, spooler, or kernel labels, and privileged paths cannot substitute for this proof. Missing authority data leaves a Persistence or unapproved-state output.
