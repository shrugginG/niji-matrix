schema_version: 2.0.0
type: detection-strategy
id: DET-000066
name:
  zh: 初始化脚本内容与生命周期执行关联
  en: Initialization-Script Content and Lifecycle-Execution Correlation
summary:
  zh: 把初始化脚本内容差异或中央分配变化，与后续启动/登录解释和子进程连接，并分别输出本地内联与跨主体扇出因果。
  en: Join initialization-script content difference or central assignment change to later boot or logon interpretation and child process, emitting
    separate local-inline and cross-principal fan-out causality.
description:
  paragraphs:
  - zh: 本策略检测攻击者创建或修改被启动/登录初始化流程自动执行的脚本正文或脚本钩子。NJA-000045 对批准基线做语法感知 diff，保留新增、删除和改写命令及其写入主体，再按脚本路径、设备、boot/logon ID、解释器命令、子进程、文件和网络结果连接后续执行。若变化只建立生命周期到目标的描述符而不改变脚本正文，则转交
      NJT-0084；服务定义、调度和其他事件订阅同样保持各自边界。
    en: This strategy detects adversary creation or mutation of script bodies or hooks executed automatically by boot or logon initialization.
      NJA-000045 performs a syntax-aware diff against an approved baseline, retains added, removed, and rewritten commands with their writer,
      and joins later execution by script path, device, boot or logon ID, interpreter command, child process, file, and network outcome. A change
      that only establishes a lifecycle-to-target descriptor without modifying script content is referred to NJT-0084, while service definitions,
      schedules, and other event subscriptions preserve their own boundaries.
  - zh: 对既有脚本内联植入，策略不能因为路径、所有者或大部分内容合法就放行；它检查新增命令的包归属、用途、解释器语义和后继行为，同时把批准运维、映像构建、网络设备配置下发和系统升级保留为替代解释。只有未批准内容变化与以后实际解释或结果相连时才报告持久化链，单独 diff 只报告完整性异常。
    en: For inline implantation in an existing script, the strategy does not allow an item merely because path, owner, or most content is legitimate.
      It evaluates package ownership, purpose, interpreter semantics, and downstream behavior of added commands while preserving approved administration,
      image build, network-device configuration deployment, and system upgrade as alternative explanations. Only an unapproved content change
      joined to later interpretation or outcome becomes a persistence chain; a diff alone remains an integrity anomaly.
  - zh: 集中扇出分支从 GPO/目录或共享脚本版本和目标范围开始，按客户端应用的策略版本、脚本哈希、boot/logon ID 与子进程展开受影响主体；只有中央状态而无客户端结果时输出未确认范围，版本不一致时不得把旧缓存执行归因到新变更。该分支与本地内联的行级 diff 同时存在但不互相替代。
    en: The centralized fan-out branch begins with GPO, directory, or shared-script version and target scope, expanding affected principals through
      client-applied policy version, script hash, boot or logon ID, and child process. Central state without client outcome yields unconfirmed
      scope, and version mismatch must not attribute stale cached execution to a new mutation. This branch coexists with but does not replace
      line-level difference for local inline mutation.
  - zh: TA0004 分支复用同一 mutation—content version—lifecycle execution 谱系，但把“恢复执行”和“权限提升”分开输出。后者要求保留 writer/pre-state 的授权集合、实际 interpreter token/security context、变化行或命令、有效权限 delta 与首个新获准操作；缺一项则只报告脚本异常或 Persistence。集中脚本按客户端 applied version 分成 elevated、same-authority 和 unresolved 集合，不能用全域范围、computer scope、root/SYSTEM 名称或高权限父体替代逐端点证明。
    en: The TA0004 branch reuses the same mutation-to-content-version-to-lifecycle-execution lineage but emits restored execution separately from
      privilege escalation. The latter requires the writer or pre-state authorization set, actual interpreter token or security context, changed
      line or command, effective-authority delta, and first newly authorized operation. If one is missing, output remains a script anomaly or
      Persistence. A central script is partitioned by client-applied version into elevated, same-authority, and unresolved sets; domain-wide scope,
      computer scope, root or SYSTEM label, or privileged parent cannot replace per-endpoint proof.
