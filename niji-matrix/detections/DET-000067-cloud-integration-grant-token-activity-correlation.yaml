schema_version: 2.0.0
type: detection-strategy
id: DET-000067
name:
  zh: 云集成授权—Token—资源活动关联
  en: Cloud-Integration Grant-Token-Resource Activity Correlation
summary:
  zh: 关联云集成的创建/授权、长静默后的首次使用或既有供应商 token 控制转移与资源活动，并区分拟态、延迟和挪用三条持久化链。
  en: Correlate cloud-integration creation or grant, first use after long silence, or control transfer of an existing vendor token with resource
    activity, distinguishing impersonation, delay, and co-option persistence chains.
description:
  paragraphs:
  - zh: 本策略检测攻击者建立、加入或挪用云应用集成以长期访问数据，而不是把任一 OAuth 同意或第三方应用直接视为恶意。NJA-000046 连接 app 与 service principal 身份、publisher、redirect URI、consenter、scope、role、credential、token
      和实际资源行为，并与批准集成清单、所有者和原账户处置状态比较。T1098 只在直接对象是既有身份访问边时负责；集成对象和授权关系保持 T1671 所有权。
    en: This strategy detects adversary establishment, addition, or co-option of cloud application integration for long-term data access rather
      than treating every OAuth consent or third-party application as malicious. NJA-000046 joins app and service-principal identity, publisher,
      redirect URI, consenter, scope, role, credential, token, and actual resource behavior against approved integration inventory, owner, and
      original-account remediation state. T1098 owns cases whose direct object is an existing-identity access edge, while the integration object
      and grant relationship remain under T1671.
  - zh: 受信集成拟态分支验证应用名称、publisher、tenant、client ID、redirect URI、权限和调用行为是否共同符合所声称合法应用；Data Loader 等熟悉名称或平台签发 token 均不提供自动信任。只有未批准配置、身份不一致和后续资源活动组合时确认链，单独同意事件保持待审。
    en: The trusted-integration branch verifies whether application name, publisher, tenant, client ID, redirect URI, permission, and calling
      behavior jointly match the claimed legitimate application. A familiar name such as Data Loader and a platform-issued token provide no automatic
      trust. A chain is confirmed only when unapproved configuration, identity inconsistency, and later resource activity combine; consent alone
      remains pending review.
  - zh: 三项子变量使用不同起点：拟态分支从新应用/consent 的 client、publisher、redirect 与受模仿集成差异开始；延迟分支从创建/凭据/授权到 last-used、credential-unused-since 和首次资源访问跨长窗口；挪用分支通常没有租户内新变更，从既有
      client 的异常 token 来源、供应商事件、跨客户共同活动和全连接撤销开始。缺少专属键时只保留父级集成异常。
    en: The three child variables use different starting points. The impersonation branch begins with differences among a new application or consent
      client, publisher, redirect, and the imitated integration. The delay branch spans creation, credential, or grant through last used, credential
      unused since, and first resource access over a long window. The co-option branch commonly has no new tenant mutation and begins with anomalous
      token origin for an existing client, vendor incident, cross-customer common activity, and all-connection revocation. Without a child-specific
      key, output remains a parent integration anomaly.
