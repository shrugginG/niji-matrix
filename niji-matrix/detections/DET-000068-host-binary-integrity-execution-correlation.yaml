schema_version: 2.0.0
type: detection-strategy
id: DET-000068
name:
  zh: 主机二进制完整性与以后执行关联
  en: Host-Binary Integrity and Later-Execution Correlation
summary:
  zh: 将二进制写入或包差异与后继执行关联，并按小差异补丁、整映像路径替换和恶意前奏—原始功能接力输出不同完整性结论。
  en: Join binary write or package difference to successor execution and emit distinct integrity conclusions for small-difference patch, whole-image
    path replacement, and malicious-prelude-to-original-function handoff.
description:
  paragraphs:
  - zh: 本策略检测受害主机既有软件二进制的攻击者内容变化。NJA-000047 对运行文件与可信包、映像或厂商版本做哈希和分段比较，记录写入者、权限、签名与版本，再连接以后正常调用者、进程/模块和异常结果。加载路径重定向归 T1574，交付前供应链改变归 T1195；只有主机上的二进制内容是直接对象时归
      T1554。
    en: This strategy detects adversary content mutation of an existing software binary on a victim host. NJA-000047 compares the runtime file
      with a trusted package, image, or vendor version by hash and segment, records writer, permission, signature, and version, and joins later
      normal caller, process or module, and anomalous outcome. Load-path redirection belongs to T1574 and pre-delivery supply-chain mutation to
      T1195; T1554 applies only when on-host binary content is direct.
  - zh: 三项子变量按不同证据解析：低差异分支量化 changed_bytes/sections 与控制流影响；整映像分支要求同一路径完整 hash、签名、inode/包版本和安装源失配，且原映像不再执行；行为保持分支识别感染入口、保留原代码/隐藏副本、恶意阶段与原始功能的显式接力。只有路径或功能正常而无内容证据时只输出父级风险。
    en: The three child variables resolve different evidence. The low-difference branch quantifies changed bytes or sections and control-flow
      effect. The whole-image branch requires complete hash, signature, inode or package version, and installation-source mismatch at the same
      path with the original image no longer executing. The behavior-preserving branch identifies infected entry, preserved original code or hidden
      copy, malicious stage, and explicit handoff to original function. Path or normal function without content evidence yields parent risk only.
