schema_version: 2.0.0
type: detection-strategy
id: DET-000069
name:
  zh: 新账户创建与首次使用关联
  en: New-Account Creation and First-Use Correlation
summary:
  zh: 将受害环境内账户创建、初始权限和首次认证/资源活动恢复为可审查生命周期。
  en: Reconstruct account creation, initial privilege, and first authentication or resource activity inside the victim environment as a reviewable
    lifecycle.
description:
  paragraphs:
  - zh: NJA-000048 从账户创建开始，连接 creator、target、credential/role、审批、设备/来源、首次登录与资源结果；只有未批准创建和异常使用组合时确认持久化。T1098 处理既有身份变化，T1585 处理受害环境外账户建立。合法入职、服务部署、临时运维和
      break-glass 作为反例。
    en: NJA-000048 begins with account creation and joins creator, target, credential or role, approval, device or origin, first sign-in, and
      resource outcome. Persistence is confirmed only when unapproved creation combines with anomalous use. T1098 handles existing-identity mutation
      and T1585 accounts established outside the victim environment. Legitimate onboarding, service deployment, temporary administration, and
      break-glass remain counter-explanations.
  - zh: 分析为两项子技术保留不同分支。窄范围分支比较初始授权、资源集合、事件频率和同角色账户扇出；跨控制面分支把云扩展或集中管理 operation 与下游账户创建、首次登录和资源结果连接。两者都要求创建成功与以后使用，避免把未使用账户或合法恢复直接归为恶意。
    en: The analytic preserves separate branches for both children. The narrow-scope branch compares initial authorization, resource set, event
      frequency, and peer-account fan-out. The cross-control-plane branch joins a cloud extension or centralized-management operation to downstream
      account creation, first sign-in, and resource outcome. Both require successful creation and later use, avoiding classification of an unused
      account or legitimate recovery as malicious.
