schema_version: 2.0.0
type: detection-strategy
id: DET-000070
name:
  zh: 事件注册—谓词—Broker—激活谱系关联
  en: Event Registration-Predicate-Broker-Activation Lineage Correlation
summary:
  zh: 将持久注册者、条件表达式、实际匹配事件、受信 Broker 与后继结果恢复为一条可审查因果链，并分别评估谓词选择性和来源分离。
  en: Reconstruct durable registrant, condition expression, actual matching event, trusted broker, and downstream outcome as a reviewable causal chain while separately evaluating predicate selectivity and provenance separation.
description:
  paragraphs:
    - zh: >-
        本策略检测“持久 callback 在以后事件中产生异常 action”，不把任何新规则、低频谓词或 WmiPrvSE 子进程单独视为恶意。NJA-000049 从 callback、subscription、rule 或 hook 的创建/修改与状态快照开始，规范 object/filter/consumer/binding ID、writer/CreatorSID、谓词、action、Broker、owner、批准和到期，再等待首次或高风险激活。
      en: >-
        This strategy detects a durable callback producing an anomalous action on a later event rather than treating any new rule, sparse predicate, or WmiPrvSE child process as malicious alone. NJA-000049 begins with creation or modification and state snapshots of a callback, subscription, rule, or hook, normalizing object or filter or consumer or binding ID, writer or CreatorSID, predicate, action, broker, owner, approval, and expiry before waiting for first or high-risk activation.
    - zh: >-
        谓词分支解析条件字段、计算候选事件与实际匹配比例、目标特异度和首次触发延迟，并用多情境回放验证；Broker 分支比较注册者与执行主体，通过 WMI filter/consumer/binding、operation/correlation、provider host 和后继 ProcessGuid 恢复来源。两个分支都必须连接实际 action、进程/模块或资源结果，静态未触发对象只输出持久风险状态。
      en: >-
        The predicate branch parses condition fields, calculates candidate-event versus actual-match proportion, target specificity, and first-trigger delay, and validates through multi-context replay. The broker branch compares registrant and executing principal and recovers provenance through WMI filter, consumer and binding, operation or correlation, provider host, and downstream ProcessGuid. Both branches must join an actual action, process or module, or resource outcome; a static untriggered object produces only durable risk state.
    - zh: >-
        Microsoft 永久 WMI consumer 和 Sysmon 19/20/21 提供对象结构，WMI provider/tracing 提供 Broker 与 caller 字段，Mandiant 提供窄 uptime 谓词与监控工程，Solorigate 提供恶意持久 binding 案例。合法备份、管理、监控、辅助功能和安装器也会产生相同局部事件，因此白名单必须绑定 object、owner、包、批准谓词与 action，而不能永久信任 Broker 名称。
      en: >-
        Microsoft permanent WMI consumers and Sysmon 19, 20, and 21 provide object structure; WMI provider and tracing documentation provides broker and caller fields; Mandiant provides a narrow uptime predicate and monitoring engineering; and Solorigate provides a malicious durable-binding case. Legitimate backup, administration, monitoring, accessibility, and installers create the same local events, so allowances bind to object, owner, package, approved predicate, and action rather than permanently trusting a broker name.
    - zh: >-
        同一谱系设置两个独立结果门。TA0003 要求注册跨原会话/重启存续并实际恢复 action，输出 persistence_confirmed；TA0004 额外保存 writer/caller pre-state authorization、被消费的 exact object/version、consumer token/security context、post-state set 和首个 pre-state expected deny 而 post-state observed allow 的 operation，输出 elevation_confirmed。缺权限键时输出 authority_unresolved；同一版本两个门都通过才输出 dual_result_confirmed。SYSTEM/root、WmiPrvSE、service account、成功 action 或高权限路径都只能筛选候选，不能代替权限差。
      en: >-
        The same lineage has two independent outcome gates. TA0003 requires registration to survive the original session or reboot and actually restore an action, producing persistence_confirmed. TA0004 additionally preserves writer or caller pre-state authorization, the exact consumed object and version, consumer token or security context, post-state set, and the first operation expected denied in pre-state but observed allowed in post-state, producing elevation_confirmed. Missing authority keys produce authority_unresolved, while dual_result_confirmed requires both gates for the same version. SYSTEM or root, WmiPrvSE, a service account, successful action, or a privileged path only filters candidates and never replaces the authority difference.
