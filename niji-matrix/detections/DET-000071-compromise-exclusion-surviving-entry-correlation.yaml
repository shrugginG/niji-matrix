schema_version: 2.0.0
type: detection-strategy
id: DET-000071
name: {zh: 入侵后排除变更与存续入口关联, en: Post-Compromise Exclusion Change and Surviving-Entry Correlation}
summary:
  zh: 连接初始入侵、替代入口、未批准修补/停用/清除、被排除对象与攻击者继续活动，识别方向明确的不对称排他控制。
  en: Join initial compromise, alternative entry, unapproved patching or disablement or cleanup, excluded objects, and continuing adversary activity to identify directional asymmetric exclusive control.
description:
  paragraphs:
    - zh: NJA-000050 从已知或疑似入侵开始，保留原 exploit/登录、首个后继结果和替代账户、密钥、服务、任务或通道创建，再监控漏洞/服务姿态、账户权限、进程、任务、服务、文件与 Registry 的修补、停用、终止和删除。每个动作保存 actor/session/process、command/API、target、old/new、结果、工单和时间，并与 before/after inventory 比较。
      en: NJA-000050 begins with known or suspected compromise, retaining original exploit or sign-in, first downstream outcome, and creation of an alternative account, key, service, task, or channel before monitoring patching, disablement, termination, and deletion across vulnerability or service posture, account privilege, processes, tasks, services, files, and Registry. Each action retains actor or session or process, command or API, target, old and new state, outcome, change record, and time and compares before and after inventory.
    - zh: 入口面分支要求“利用成功—替代入口建立—原面关闭—替代入口继续使用”；竞争清除分支要求被移除对象有独立恶意证据、清除 actor 属于攻击者链、清除后自身对象与活动继续。只出现正确补丁或恶意进程消失时分别输出异常修复或对象清除，不提升为排他控制。
      en: The ingress-surface branch requires exploitation success, alternative entry establishment, original surface closure, and continuing use of the alternative entry. The competing-eviction branch requires independent malicious evidence for removed objects, a cleanup actor in the adversary chain, and continued own objects and activity after cleanup. A correct patch or disappearing malware alone produces anomalous remediation or object cleanup rather than exclusive control.
    - zh: UNC5174、PG_MEM 与 NetSky.P 提供两分支的直接案例；组织抢修、自动更新、EDR 隔离、管理员停服和事件响应是强反例。检测必须保留方向和存续，不能因工具名、管理员身份或缺少工单自动判恶；同样不能因当前资产已修补或噪声减少而结束调查。
      en: UNC5174, PG_MEM, and NetSky.P provide direct cases for the two branches, while organizational emergency remediation, automatic update, EDR containment, administrator service shutdown, and incident response are strong counterexamples. Detection must preserve direction and survival and cannot make tool name, administrator identity, or missing ticket automatically malicious. It also cannot end investigation because the current asset is patched or noise has declined.
