schema_version: 2.0.0
type: detection-strategy
id: DET-000072
name: {zh: 镜像推送—置备—运行谱系关联, en: Image Push-Provisioning-Runtime Lineage Correlation}
summary: {zh: 连接内部镜像写入、tag-to-digest 变化、置备引用、实例启动和首次异常结果。, en: "Join internal image writes, tag-to-digest changes, provisioning references, instance starts, and first anomalous outcomes."}
description:
  paragraphs:
  - zh: NJA-000051 从 registry push、retag、image register 或 attribute change 开始，解析 digest、manifest、签名、SBOM、actor 和审批，再连接 Deployment/launch template 所解析的 digest、node pull、instance start 与首次行为。可变引用分支比较声明名称和实际 digest；未来置备分支保留修改到首次实例的长窗口。
    en: NJA-000051 begins with registry push, retag, image registration, or attribute change and resolves digest, manifest, signature, SBOM, actor, and approval before joining the digest resolved by a Deployment or launch template to node pull, instance start, and first behavior. The mutable-reference branch compares declared name with actual digest, while the future-provisioning branch preserves a long window from modification to first instance.
  - zh: 新 digest 或后续启动本身不定性。只有未经批准 actor、签名/SBOM 或内容差异与消费该镜像的实例异常共同出现时确认；合法发布、回滚、扩容和灾备保持替代解释。
    en: A new digest or later start is not a verdict by itself. Confirmation requires an unapproved actor, signature or SBOM or content difference, and an anomaly in an instance consuming that image. Legitimate release, rollback, scaling, and disaster recovery remain alternative explanations.
detects_refs: [NJT-0092, NJS-0092-001, NJS-0092-002]
domains: [enterprise]
analytic_refs: [NJA-000051]
evidence_refs: [REF-000185, REF-000186]
