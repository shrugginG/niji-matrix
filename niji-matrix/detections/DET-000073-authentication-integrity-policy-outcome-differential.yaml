schema_version: 2.0.0
type: detection-strategy
id: DET-000073
name:
  zh: 认证完整性—策略—结果差分
  en: Authentication Integrity-Policy-Outcome Differential
summary:
  zh: 分别恢复验证器/联合信任和策略例外的状态变化，再与逐请求认证结果及资源使用连接，识别隐藏在正常认证外观下的持久异常允许路径。
  en: Separately reconstruct validator or federation-trust mutations and policy exceptions, then join them to request-level authentication outcomes and resource use to identify durable anomalous allow paths hidden under normal authentication appearance.
description:
  paragraphs:
    - zh: >-
        本策略检测“认证决策面被改变并在以后产生异常允许”，而不是把任何组件 hash 变化、证书轮换、策略排除或成功登录单独视为恶意。NJA-000052 先把验证器、受保护进程、加载模块和联合信任恢复为可比较版本，保存写入者、签名、证书和批准；组件分支将生产实例与可信实例或离线度量比较，并寻找只有非正常证明能够成功的结果。
      en: >-
        This strategy detects a changed authentication-decision plane that later produces anomalous allow rather than treating any component-hash change, certificate rotation, policy exclusion, or successful sign-in as malicious by itself. NJA-000052 first reconstructs comparable versions of validators, protected processes, loaded modules, and federation trust with writer, signature, certificate, and approval. The component branch compares production with a trusted instance or offline measurement and seeks outcomes in which only a nonstandard proof succeeds.
    - zh: >-
        策略分支保存 Conditional Access、MFA、风险认证及等价策略的完整 old/new 条件、排除和有效作用域，再用登录侧的主体、设备、来源、应用/资源、认证方法、逐策略 applied/not-applied 结果和最终 decision 证明例外确实命中。两个分支最后都连接令牌、会话或资源操作，使“风险状态”“异常允许”和“已使用持久路径”成为不同输出。
      en: >-
        The policy branch preserves complete old and new conditions, exclusions, and effective scope for Conditional Access, MFA, risk authentication, and equivalent policy, then uses sign-in principal, device, origin, application or resource, authentication method, per-policy applied or not-applied result, and final decision to prove an exception actually matched. Both branches finally join token, session, or resource action so risky state, anomalous allow, and used durable path remain distinct outputs.
    - zh: >-
        正常升级、内存热补丁、联合证书轮换、break-glass、服务主体、受信位置、迁移和设备注册 bootstrap 是强反例，必须用 owner、工单、批准、预期寿命和测试结果排除。缺少输入类别、策略历史或结果连接时，本策略降低置信度并保留异常状态，不把当前快照或一次成功认证升级为后门结论。
      en: >-
        Normal upgrades, in-memory hot patches, federation-certificate rotation, break-glass access, service principals, trusted locations, migration, and device-registration bootstrap are strong counterexamples and require owner, change record, approval, intended lifetime, and test result for exclusion. When input class, policy history, or outcome linkage is missing, the strategy lowers confidence and retains anomalous state rather than promoting a current snapshot or one successful authentication to a backdoor conclusion.
