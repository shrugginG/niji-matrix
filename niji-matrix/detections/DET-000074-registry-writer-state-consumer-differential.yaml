schema_version: 2.0.0
type: detection-strategy
id: DET-000074
name:
  zh: 注册表 Writer—状态—Consumer 与 API 差分
  en: Registry Writer-State-Consumer and API Differential
summary:
  zh: 版本化以后会被消费的 Registry 状态，连接写入者与后继结果，并用同快照、等价权限的 Win32/native/raw 差分发现伪隐藏对象。
  en: Version Registry state that will be consumed later, join its writer to downstream outcomes, and use same-snapshot equivalent-privilege Win32 versus native or raw differential to find pseudo-hidden objects.
description:
  paragraphs:
    - zh: >-
        本策略检测“未经批准 Registry 状态在原会话后被 consumer 使用”，而不是把任何 Registry 修改或未知键直接视为 Persistence。NJA-000053 以稳定 key identity 连接对象创建/删除、value set/rename、writer 进程与用户、快照版本、ACL、value hash 和审批，再关联 Registry read 或启动、进程、服务与网络结果。没有以后消费的对象保留为状态异常。
      en: >-
        This strategy detects unapproved Registry state consumed after the original session rather than treating any Registry mutation or unknown key as Persistence. NJA-000053 joins object create or delete, value set or rename, writer process and user, snapshot version, ACL, value hash, and approval by stable key identity, then correlates a Registry read or startup, process, service, and network outcome. An object with no later consumption remains a state anomaly.
    - zh: >-
        对标准工具报错、截断或缺失的对象，分析使用同一冻结 hive 或快照、相同逻辑路径和等价读取权限比较 Win32、native 与 raw hive 视图，保存原始名称长度/字节、query API、visible 状态和 error code。只有 raw/native 对象存在、标准视图稳定不可得且兼容 consumer 成功读取时，才形成 API 差分伪隐藏链；ACL 拒绝、未装载 hive、parser 错误和扫描竞争单独标记。
      en: >-
        For objects that error, truncate, or disappear in standard tools, the analytic compares Win32, native, and raw-hive views against the same frozen hive or snapshot, logical path, and equivalent read privilege while retaining raw-name length and bytes, query API, visibility state, and error code. Only raw or native presence, stable standard-view unavailability, and successful compatible-consumer read form an API-differential pseudo-hidden chain. ACL denial, unloaded hives, parser errors, and scan races are labeled separately.
    - zh: >-
        Sysmon 12/13/14 等事务遥测提供创建、写值与重命名线索，但不保证记录所有读取或完整 null 名称；RootkitRevealer/RegDelNull 类视图提供独立状态证据，Kovter 与 FIN7 案例分别校准伪隐藏和普通 consumer 链。软件安装、组策略、应用升级和用户定制必须由 package、owner、工单与预期版本排除，不能仅按路径白名单永久抑制。
      en: >-
        Transaction telemetry such as Sysmon 12, 13, and 14 provides create, value-set, and rename evidence but does not guarantee every read or a complete null-bearing name. RootkitRevealer or RegDelNull-style views supply independent state evidence, while Kovter and FIN7 calibrate pseudo-hidden and ordinary consumer chains respectively. Software installation, Group Policy, application upgrade, and user customization require package, owner, change record, and intended version as counterexamples and cannot be suppressed permanently by path alone.
