description: {paragraphs: [{zh: NJA-000054 版本化模板、宏、add-in、Office Test 与 Outlook 持久对象，解析 trusted/startup location、签名、owner、writer 和批准，再连接 WINWORD/EXCEL/OUTLOOK load、宏或 add-in 身份、子进程与网络结果。预受信分支要求位置/宿主正常但内容或来源异常；未知静态对象与已执行异常分级。, en: "NJA-000054 versions templates, macros, add-ins, Office Test, and durable Outlook objects and resolves trusted or startup location, signature, owner, writer, and approval before joining WINWORD or EXCEL or OUTLOOK load, macro or add-in identity, child process, and network outcome. The pretrusted branch requires normal location or host with anomalous content or provenance and tiers unknown static objects separately from executed anomalies."}]}
