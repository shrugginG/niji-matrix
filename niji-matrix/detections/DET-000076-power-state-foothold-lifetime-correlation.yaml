id: DET-000076
name: {zh: 电源状态与立足点寿命关联, en: Power-State and Foothold-Lifetime Correlation}
summary: {zh: 连接 power request/setting 变化、预期状态边界、用户活动与恶意进程/会话存续。, en: Join power request or setting changes expected state boundaries user activity and malicious process or session survival.}
description: {paragraphs: [{zh: NJA-000055 记录 power setting、request 创建/关闭、inhibitor、shutdown 工具与锁屏变化，按 caller PID/service、writer、reason、policy 和批准建立生命周期；再比较主机基线预期休眠/重启点，确认无用户活动时依赖进程/会话和网络结果继续。只有异常控制与本会终止的入口存续共同出现才确认。, en: "NJA-000055 records power settings request creation or closure inhibitors shutdown utilities and lock-screen changes and builds a lifecycle by caller PID or service writer reason policy and approval. It then compares expected sleep or reboot points from the host baseline and confirms that dependent processes or sessions and network outcomes continue without user activity. Confirmation requires both anomalous control and survival of an entry that would otherwise terminate."}]}
