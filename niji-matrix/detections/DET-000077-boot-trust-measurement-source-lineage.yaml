schema_version: 2.0.0
type: detection-strategy
id: DET-000077
name: {zh: 启动信任、度量与来源谱系关联, en: Boot Trust Measurement and Source Lineage Correlation}
summary: {zh: 连接 firmware/raw boot 写入、attestation 覆盖、boot pointer、网络 image 和启动后运行身份。, en: Join firmware or raw-boot writes attestation coverage boot pointers network images and post-boot runtime identity.}
description:
  paragraphs:
  - zh: NJA-000056 以 OS 外可信清单为基线，记录 firmware/EFI/MBR/VBR/NVRAM/ROMMON 写入、actor、工具、签名与批准，并在每次启动收集组件 measurements、boot variables、image source/hash 和首个 driver/process。度量边界分支寻找 inventory 对象未被 PCR/attestation 覆盖却发生变化并执行；外部来源分支连接 pointer change、server/transfer、image hash 与 running version。
    en: NJA-000056 starts from an OS-independent trusted inventory and records firmware or EFI or MBR or VBR or NVRAM or ROMMON writes actor tool signature and approval then collects component measurements boot variables image source or hash and first driver or process at each boot. The attestation-boundary branch looks for an inventory object outside PCR or attestation coverage that changes and executes. The external-source branch joins pointer change server or transfer image hash and running version.
  - zh: 单一 host agent 健康、secure boot pass 或合法 netboot 不定性。必须比较 measurement coverage map、vendor/批准版本和 OS 外观察；异常时优先保全固件/启动证据再从独立恢复根处置。
    en: One healthy host agent secure-boot pass or legitimate netboot is not a verdict. Measurement coverage maps vendor or approved versions and out-of-OS observation must be compared. On anomaly preserve firmware and boot evidence before recovery from an independent root.
detects_refs: [NJT-0097, NJS-0097-001, NJS-0097-002]
domains: [enterprise]
analytic_refs: [NJA-000056]
evidence_refs: [REF-000193, REF-000194, REF-000195]
