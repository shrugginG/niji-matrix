schema_version: "2.0.0"
type: detection-strategy
id: DET-000078
name: {zh: 解释器入口—语义—结果谱系关联, en: Interpreter Entry-Semantics-Outcome Lineage Correlation}
summary: {zh: 连接调用身份与完整祖先、命令/运行时内容、stdin 或网络来源、模块与后继结果，识别正常工作流借用和短驻语义执行。, en: Join invoking identity and full ancestry to command or runtime content standard-input or network origin modules and successor outcomes to identify normal-workflow borrowing and transient semantics.}
description:
  paragraphs:
  - zh: NJA-000057 为每次解释器实例建立稳定 execution ID，连接登录/令牌来源、完整祖先、父级、目录、命令参数、stdin/管道来源、脚本块或 runtime audit、模块、网络响应以及子进程/文件结果。工作流分支把当前多维上下文与资产角色基线比较；短驻分支判断文件制品缺失、命令截断或占位与运行时捕获/结果之间是否存在语义差异。
    en: NJA-000057 creates a stable execution ID for every interpreter instance and joins sign-in or token origin, full ancestry, parent, directory, command arguments, standard-input or pipeline source, script block or runtime audit, modules, network response, and child-process or file outcomes. The workflow branch compares multidimensional context with the asset-role baseline. The transient branch evaluates semantic difference between absent file artifacts or truncated or placeholder commands and runtime capture or outcomes.
  - zh: 解释器启动、内联命令或无脚本文件都不单独定性。高置信结果需要入口上下文异常或被操纵、可执行语义/指纹，以及与该语义一致的网络、模块、文件或进程结果；缺少内容时只输出需要补证的谱系异常。合法构建、部署、应急运维和安装器保持替代解释。
    en: Interpreter start, an inline command, or absence of a script file is never a verdict alone. A high-confidence result requires anomalous or manipulated entry context, executable semantics or its fingerprint, and a matching network, module, file, or process outcome. Without content, emit only a lineage anomaly needing evidence. Legitimate builds, deployment, emergency administration, and installers remain alternatives.
detects_refs: [NJT-0065, NJS-0065-001, NJS-0065-002]
