schema_version: "2.0.0"
type: detection-strategy
id: DET-000079
name: {zh: 云命令请求—来宾代理—执行结果谱系, en: Cloud Command Request-Guest Agent-Execution Outcome Lineage}
summary: {zh: 将云身份、命令动作与目标解析连接到来宾代理、脚本指纹和执行结果，并按批准维护上下文识别偏差。, en: Join cloud identity command action and resolved targets to guest agent script fingerprint and execution outcome and identify deviation from approved maintenance context.}
description:
  paragraphs:
  - zh: NJA-000058 从 Activity Log、CloudTrail 或命令服务历史提取租户/账号、主体与角色、源、operation、request/correlation ID、文档/扩展、参数、脚本身份、目标集合和状态，再连接实例 inventory、代理任务、进程、文件、网络和输出。直接 ID 分支做确定性关联；缺少 ID 时以实例、代理、脚本哈希和窄时间窗关联并降低置信度。
    en: NJA-000058 extracts tenant or account, principal and role, source, operation, request or correlation ID, document or extension, parameters, script identity, target set, and status from Activity Log, CloudTrail, or command history, then joins instance inventory, agent task, process, file, network, and output. A direct-ID branch is deterministic; without an ID it joins instance, agent, script hash, and a narrow time window at reduced confidence.
  - zh: 关联后分别评估跨层缺口和维护情境：控制面成功但无对应来宾结果、来宾代理执行但无可归因请求、或认证/输出字段缺失形成完整性异常；主体、文档、仓库、目标、窗口与变更单偏离形成上下文异常。高置信结果要求可执行内容或结果，不把一次罕见 Run Command 直接定性。
    en: After joining, evaluate cross-plane integrity and maintenance context separately. Control success without guest outcome, guest-agent execution without attributable request, or missing identity or output creates an integrity anomaly. Deviation in principal, document, repository, target, window, and change record creates a context anomaly. High confidence requires executable content or outcome and never treats one rare Run Command as a verdict.
detects_refs: [NJT-0064, NJS-0064-001, NJS-0064-002]
