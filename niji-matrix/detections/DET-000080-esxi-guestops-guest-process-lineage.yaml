schema_version: "2.0.0"
type: detection-strategy
id: DET-000080
name: {zh: ESXi GuestOps—来宾进程跨层谱系, en: ESXi GuestOps-Guest Process Cross-Plane Lineage}
summary: {zh: 连接 ESXi/vCenter 主体、Guest Operations、每 VM 日志与来宾 vmtoolsd 后继进程，并检查认证事件缺失与结果偏差。, en: Join ESXi or vCenter principal Guest Operations per-VM logs and guest vmtoolsd descendants and test for missing authentication events and anomalous outcomes.}
description:
  paragraphs:
  - zh: NJA-000059 从 vCenter/ESXi 会话、权限与 API 事件提取主体、源、host、目标 VM、方法、请求/任务键、时间与结果，并连接 `vmware.log` 中 GuestOps、Tools 状态、来宾认证和 `vmtoolsd` 后继进程、文件与网络。StartProgramInGuest 分支要求实际进程结果；ListProcesses/FileTransfer 只作为准备或结果上下文。
    en: NJA-000059 extracts principal, source, host, target VM, method, request or task key, time, and result from vCenter or ESXi sessions privileges and API events, then joins `vmware.log` GuestOps, Tools state, guest authentication, vmtoolsd descendants, files, and network. A StartProgramInGuest branch requires an actual process outcome, while ListProcesses or file transfer supplies preparation or outcome context only.
  - zh: 分析显式区分合法凭据 GuestOps、失败认证、成功但无来宾认证事件的漏洞分支和无对应管理动作的 vmtoolsd 子进程。高置信要求管理动作与异常来宾结果或认证完整性缺口共同出现；备份、支持和自动化按批准主体、工具、VM 集合和窗口降噪，不能永久放行 vmtoolsd。
    en: Analysis explicitly distinguishes credentialed GuestOps, failed authentication, successful exploit branches without a guest authentication event, and vmtoolsd children without a management action. High confidence requires a management action together with an anomalous guest outcome or authentication-integrity gap. Backup support and automation are tuned by approved principal tool VM set and window, never by permanently allowing vmtoolsd.
detects_refs: [NJT-0068]
domains: [enterprise]
analytic_refs: [NJA-000059]
