schema_version: "2.0.0"
type: detection-strategy
id: DET-000081
name: {zh: 容器 Exec 请求—运行时结果谱系, en: Container Exec Request-Runtime Outcome Lineage}
summary: {zh: 将 Kubernetes/kubelet/Docker exec 的主体、目标与会话连接到既有容器中新进程、文件和网络结果，并按调试/自动化基线识别偏差。, en: Join Kubernetes kubelet or Docker exec principal target and session to new processes files and network outcomes in an existing container and identify deviation from debugging or automation baselines.}
description:
  paragraphs:
  - zh: NJA-000060 从 API audit、kubelet 和 Docker events 提取 cluster、主体与 token 来源、verb/subresource、namespace、pod UID、container、request URI、TTY、exec/session ID 和状态，再连接 runtime container ID、process start、command、文件和网络。若没有直接 session ID，则按 pod UID、container ID 与窄时间窗降级关联。
    en: NJA-000060 extracts cluster, principal and token origin, verb or subresource, namespace, pod UID, container, request URI, TTY, exec or session ID, and status from API audit, kubelet, and Docker events, then joins runtime container ID, process start, command, files, and network. Without a direct session ID, it uses a degraded join by pod UID container ID and narrow time window.
  - zh: 先确认“管理 exec 导致 runtime 进程”，再分别比较 workload 声明进程与后置结果、身份/来源/目标与批准调试基线。无内容的成功 exec 只形成待补证线索；高置信需要命令或文件/网络/进程结果。合法 SRE、开发调试和安全响应按工单、时限与目标降噪，不永久放行 service account 或 shell。
    en: First establish management exec causing a runtime process, then compare declared workload processes to later outcomes and identity origin and target to the approved debugging baseline. A successful exec without content is only a lead. High confidence requires a command or file network or process outcome. Legitimate SRE developer debugging and security response are tuned by ticket duration and target, never by permanently allowing a service account or shell.
detects_refs: [NJT-0066, NJS-0066-001, NJS-0066-002]
domains: [enterprise]
analytic_refs: [NJA-000060]
