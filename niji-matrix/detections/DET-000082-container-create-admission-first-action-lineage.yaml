schema_version: "2.0.0"
type: detection-strategy
id: DET-000082
name: {zh: 容器创建—准入—首行为谱系, en: Container Create-Admission-First Action Lineage}
summary: {zh: 将创建主体与完整 workload 规范、admission、实际 image digest、runtime start 和首个进程/网络/文件连接，识别后置载荷与规范伪装。, en: Join creator and complete workload specification admission actual image digest runtime start and first process network or file to identify late payloads and specification camouflage.}
description:
  paragraphs:
  - zh: NJA-000061 从 Kubernetes audit/admission 或 Docker create 提取创建主体、源、manifest、owner、namespace、labels、service account、command/args、securityContext、image reference 和审批，再记录 admission 决策、signature/attestation/SBOM、resolved digest、runtime container ID、create/start、first process、DNS/HTTP、文件与资源结果。
    en: NJA-000061 extracts creator source manifest owner namespace labels service account command or args security context image reference and approval from Kubernetes audit or admission or Docker create, then records admission decision signature attestation or SBOM resolved digest runtime container ID create or start first process DNS or HTTP files and resource outcomes.
  - zh: 后置载荷分支比较 image 声明与启动后新增内容；规范伪装分支比较可见字段与批准 template/commit、仓库 owner 和创建者。高置信要求新容器实际运行并有内容/目的差异。合法发布、Job、debug Pod、系统 DaemonSet 和扩缩容保持替代解释；privileged 等高风险字段作为优先级而非匿迹定性。
    en: The late-payload branch compares image declarations with post-start content. The specification-camouflage branch compares visible fields to an approved template or commit repository owner and creator. High confidence requires the new container to run with a content or purpose difference. Legitimate releases Jobs debug Pods system DaemonSets and scaling remain alternatives; high-risk fields such as privileged mode affect priority rather than proving stealth.
detects_refs: [NJT-0067, NJS-0067-001, NJS-0067-002]
domains: [enterprise]
analytic_refs: [NJA-000061]
evidence_refs: [REF-000186, REF-000211, REF-000213, REF-000214, REF-000215, REF-000216, REF-000220, REF-000221]
