schema_version: "2.0.0"
type: detection-strategy
id: DET-000083
name: {zh: IPC 客户端—Broker—执行结果谱系, en: IPC Client-Broker-Execution Outcome Lineage}
summary: {zh: 将 COM/DDE/XPC/pipe/socket 请求的客户端、endpoint、方法和消息摘要连接到 broker 进程与后继执行，恢复真实来源和短驻语义。, en: Join client endpoint method and message digest of COM DDE XPC pipe or socket requests to broker processes and successor execution to restore true provenance and transient semantics.}
description:
  paragraphs:
  - zh: NJA-000062 规范化本地 IPC 会话，保存 client/server 进程实体、用户/签名/entitlement、endpoint/object/CLSID/service、method/verb、request ID、内容或 hash、时间与 response，再连接 broker 的调用栈、子进程/线程、文件、权限和网络结果。平台字段不同，但统一保持 client—request—broker—outcome 关系。
    en: NJA-000062 normalizes local IPC sessions and retains client and server process identity user signature or entitlement endpoint object CLSID or service method or verb request ID content or hash time and response, then joins broker call stack child process or thread file privilege and network outcomes. Platform fields differ but preserve one client-request-broker-outcome relation.
  - zh: broker 来源分支比较 client 是否获准调用该方法及结果是否符合服务职责；短驻请求分支检查连接/结果存在但内容缺失或只留摘要。高置信结果要求消息驱动执行，不能把所有 pipe/COM/XPC 连接定性。合法 Office 链接、辅助功能、更新、浏览器 native messaging 和系统 RPC 按客户端、方法与结果基线降噪。
    en: The broker-provenance branch tests whether the client is approved for the method and whether outcomes match service role. The transient-request branch tests connections and outcomes whose content is absent or represented only by a digest. High confidence requires message-driven execution and never classifies every pipe COM or XPC connection. Legitimate Office links accessibility updates browser native messaging and system RPC are tuned by client method and outcome baselines.
detects_refs: [NJT-0072, NJS-0072-001, NJS-0072-002]
