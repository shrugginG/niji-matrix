schema_version: "2.0.0"
type: detection-strategy
id: DET-000084
name: {zh: 执行选择状态—加载—结果谱系, en: Execution Selection-State-Load-Outcome Lineage}
summary: {zh: 将搜索路径、内容/目标完整性和 runtime 激活状态变化连接到受信 consumer 的解析、加载与执行结果，识别三类执行流劫持。, en: Join search-path content or target integrity and runtime activation-state changes to trusted-consumer resolution load and execution outcomes to identify three execution-flow hijacks.}
description:
  paragraphs:
  - zh: NJA-000063 从 writer 和前置状态开始，保存目录/PATH/loader 候选、文件/服务/注册目标版本、profiler/AppDomain/callback 配置与权限，再连接具体 launcher/service/runtime 的 resolution、actual path/hash、module/manager load、process/memory/network 结果。每条链均要求 state ID、consumer 与 outcome，避免把暴露或待用文件误认为执行。
    en: NJA-000063 begins with writer and prior state and retains directory PATH or loader candidates, file service or registry target versions, profiler AppDomain or callback configuration and permissions, then joins a concrete launcher service or runtime resolution actual path or hash module or manager load and process memory or network outcome. Every chain requires state ID consumer and outcome so exposure or unused files are not mislabeled as execution.
  - zh: 分析分别输出搜索优先级阴影、既有身份完整性替换和 runtime 激活重定向。合法安装、更新、插件与 profiler 按签名软件包、变更单、writer、路径和预期结果降噪；签名 launcher、稳定路径或 CLR host 不产生自动信任。缺少旧基线时降低完整性分支置信度，缺少加载结果时只报告风险状态。
    en: Analysis separately outputs search-precedence shadowing existing-identity integrity substitution and runtime activation redirection. Legitimate installation update plug-in and profiler activity is tuned by signed package change record writer path and expected outcome. Signed launchers stable paths and CLR hosts confer no automatic trust. Lower integrity-branch confidence without an old baseline and report risk state only without a load outcome.
detects_refs: [NJT-0070, NJS-0070-001, NJS-0070-002, NJS-0070-003]
