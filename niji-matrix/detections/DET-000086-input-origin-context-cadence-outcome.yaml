schema_version: "2.0.0"
type: detection-strategy
id: DET-000086
name: {zh: 输入来源—情境—节奏—执行结果关联, en: Input Origin-Context-Cadence-Execution Outcome Correlation}
summary: {zh: 将软件注入或 HID/PnP 来源、事件时序、活动 session/window 与 Run/shell/PowerShell 等结果连接，区分人类节奏、context 门控和外设冒充。, en: Join software injection or HID and PnP origin event timing active session or window and outcomes such as Run shell or PowerShell to distinguish human cadence context gating and peripheral impersonation.}
description:
  paragraphs:
  - zh: NJA-000036 为输入序列建立 input_sequence_id，记录 SendInput/窗口消息/自动化 client 与注入标志，或 USB/PnP/VID/PID/interface/driver 等硬件来源；计算匿名化 hold/flight-time、突发、随机性和暂停，连接登录/锁屏、active/focused window、URL/transaction context、clipboard 与后继 shortcut、Run/shell/PowerShell、文件和网络。
    en: NJA-000036 creates an input sequence ID and records SendInput window-message or automation client and injected flags or hardware origin such as USB PnP VID PID interface and driver. It calculates anonymized hold or flight times bursts randomness and pauses and joins logon or lock state active or focused window URL or transaction context clipboard and successor shortcuts Run shell or PowerShell files and network.
  - zh: 时间分支使用多维模型而非单一速度阈值并保持 medium；context 分支要求 monitor/query 到条件匹配再到输入；外设分支要求新/未批准 HID 到按键再到执行。高置信结果必须有执行结果，设备连接或 injected flag 不单独定性。辅助设备、KVM、远程支持、自动化测试和用户宏按批准主体/设备/会话降噪。
    en: The timing branch uses multidimensional models rather than one speed threshold and remains medium. The context branch requires monitor or query then condition match then input. The peripheral branch requires a new or unapproved HID then keys then execution. High-confidence output requires an execution outcome and a device connection or injected flag alone is insufficient. Assistive devices KVM remote support automated tests and user macros are tuned by approved principal device and session.
