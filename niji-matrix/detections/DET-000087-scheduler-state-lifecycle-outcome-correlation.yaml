schema_version: 2.0.0
type: detection-strategy
id: DET-000087
name: {zh: 调度对象状态、生命周期与执行结果关联, en: Scheduler Object State Lifecycle and Execution Outcome Correlation}
summary: {zh: 跨长周期与短事务连接任务定义、枚举差分、计划触发、实际运行权限和资源结果，分级识别匿迹化计划执行及确认提权, en: Join task definitions enumeration differences scheduled triggers actual runtime authority and resource outcomes across long horizons and short transactions to tier stealth-conforming scheduled execution and confirmed elevation}
description:
  paragraphs:
    - zh: 本策略以稳定调度对象为中心，而不是把 schtasks、cron、systemctl 或 kubectl 的出现直接视为恶意。NJA-000064 同时维护资产局部定义基线、标准视图与高权原始状态差分、未来触发 watchlist、分钟级 create-run-delete 事务和 scheduler-to-process/Job-to-Pod 结果链，从而覆盖合形、延期、枚举抑制与一次性代理四个子项。
      en: This strategy centers stable scheduler objects rather than treating the appearance of schtasks cron systemctl or kubectl as malicious. NJA-000064 maintains asset-local definition baselines standard-view-to-privileged-raw-state differentials future-trigger watchlists minute-scale create-run-delete transactions and scheduler-to-process or Job-to-Pod outcome chains covering conformity delay enumeration suppression and one-shot brokerage.
    - zh: 只有未经批准的创建者或定义变化与异常动作、视图差分、时间规避或执行结果共享任务身份时才提高风险。合法软件安装、补丁、备份、systemd catch-up、Kubernetes 控制器清理和受控运维必须作为替代解释；某一数据层缺失时降低置信度，并使用其他两层交叉验证而不把单点转成结论。
      en: Risk rises only when an unapproved creator or definition change shares task identity with an anomalous action view differential temporal evasion or execution outcome. Legitimate software installation patching backup systemd catch-up Kubernetes controller cleanup and approved operations remain alternative explanations. Missing one data layer lowers confidence and calls for cross-checking the other two rather than converting a point signal into a conclusion.
    - zh: TA0004 分支在同一 object/version 上追加权限结果门：保存 submitter/pre-state authorization、scheduler admission、实际 runtime principal/token/capability/ServiceAccount、首个攻击者动作和 protected-resource allow/deny。只有 runtime 相对 pre-state 增加可枚举权限，且至少一个操作从 expected deny 变为 observed allow 时确认提权；同权限执行和权限键缺失分别保留为 non-elevating 与 authority-unresolved。任务名、root/SYSTEM、RunLevel、ServiceAccount 或 scheduler parent 只作为关联线索。
      en: The TA0004 branch adds an authority-result gate to the same object and version by retaining submitter or pre-state authorization scheduler admission actual runtime principal token capability or ServiceAccount the first adversary action and protected-resource allow or deny. Elevation is confirmed only when runtime has enumerable authority absent from pre-state and at least one operation moves from expected deny to observed allow. Same-authority execution and missing authority keys remain non-elevating and authority-unresolved respectively. Task names root or SYSTEM RunLevel ServiceAccounts and scheduler parents are correlation clues only.
