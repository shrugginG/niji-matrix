schema_version: 2.0.0
type: detection-strategy
id: DET-000088
name: {zh: 无服务器定义—触发—调用—结果关联, en: Serverless Definition-Trigger-Invocation-Outcome Correlation}
summary: {zh: 连接函数或流程版本、角色、事件源、每次调用和下游资源结果，识别短驻实例与事件耦合恶意自动化, en: Join function or flow versions roles event sources individual invocations and downstream resource outcomes to detect malicious ephemeral and event-coupled automation}
description:
  paragraphs:
    - zh: 本策略从函数或 flow 的创建/更新开始，固定代码或定义版本、owner、execution role/connector 和 trigger，再连接 Invoke/flow run、应用日志以及下游 API、数据、网络和成本结果。NJA-000065 不假设存在客户主机进程，而以 control-plane request、function/flow version、event 和 invocation/run 作为稳定因果键，分别识别短驻实例跨调用异常和正常业务事件后的非基线动作。
      en: This strategy begins with function or flow creation or update fixes code or definition version owner execution role or connector and trigger and joins Invoke or flow runs application logs and downstream API data network and cost outcomes. NJA-000065 does not assume customer host processes and uses control-plane requests function or flow versions events and invocations or runs as stable causal keys to detect cross-invocation anomalies in ephemeral instances and off-baseline actions after normal business events.
    - zh: 风险只有在未经批准的定义/权限变化或 dormant automation 启用与异常 invocation 结果相交时升高。合法发布、自动修复、事件驱动业务、灾难恢复与成本波动作为替代解释。Invoke 数据事件、完整定义或下游 SaaS 审计缺失时明确降低置信度，不把 service identity、短 duration 或事件触发单独视为恶意。
      en: Risk rises only when an unapproved definition or permission change or dormant-automation enablement intersects an anomalous invocation outcome. Legitimate release automated remediation event-driven business disaster recovery and cost variance remain alternative explanations. Missing Invoke data events complete definitions or downstream SaaS audit explicitly lowers confidence and service identity short duration or event triggering alone is not malicious.
detects_refs: [NJT-0076, NJS-0076-001, NJS-0076-002]
domains: [enterprise]
