schema_version: 2.0.0
type: detection-strategy
id: DET-000089
name: {zh: 部署控制面—Agent—Fleet 结果关联, en: Deployment Control-Plane-Agent-Fleet Outcome Correlation}
summary: {zh: 将部署 operator、package/script、目标集合和 operation 连接到 Agent 回执、端点进程与跨 Fleet 影响，识别受信软件部署执行, en: Join deployment operators packages or scripts target collections and operations to agent receipts endpoint processes and fleet-wide impact to detect trusted software-deployment execution}
description:
  paragraphs:
    - zh: 本策略把部署控制面和终端视为同一事务。NJA-000066 先解析 operator/session/role、author/approver、package 或 script digest、目标 query 和 operation，再聚合 agent receipt、下载缓存、SYSTEM 子进程、网络和影响结果。它不因 ePO、PDQ、BigFix、SCCM 或 RMM agent 受信就降低覆盖，也不把任何合法批量运维直接视为攻击。
      en: This strategy treats deployment control plane and endpoints as one transaction. NJA-000066 resolves operator session and role author and approver package or script digest target query and operation and then aggregates agent receipts download caches SYSTEM children network and impact outcomes. It does not reduce coverage because ePO PDQ BigFix SCCM or RMM agents are trusted and does not treat legitimate bulk operations as attacks.
    - zh: 单目标分支侧重 operator→job→agent→process 来源代理，多目标分支按共同 operation/package 和 resolved membership 计算 fleet scope、执行时间分布和影响。高风险需要未批准控制面变化与非基线端点动作共同出现；缺少平台 job ID 时允许以 digest、服务器、时间和相同命令概率聚类，但降低置信度。
      en: The single-target branch emphasizes operator-to-job-to-agent-to-process provenance brokerage while the multi-target branch calculates fleet scope execution-time distribution and impact by common operation or package and resolved membership. High risk requires an unapproved control-plane change and off-baseline endpoint action together. Missing platform job IDs permit probabilistic clustering by digest server time and command at reduced confidence.
    - zh: 为 TA0008 增加来源与目标区分：把 operator 登录源或被控控制点解析为资产，再检查 operation 触达的是其他受管设备且 agent 实际产生攻击者动作。只见跨主机文件缓存或平台 job 创建时不作横向控制结论；将确认的远端动作与发布审批、内容和目标范围一起展示。
      en: For TA0008, distinguish origin from destination by resolving the operator login source or compromised control point to an asset, then testing whether the operation reached other managed devices and their agents produced attacker-controlled actions. A cross-host file cache or created platform job alone is not a lateral-control conclusion. Display confirmed remote actions with release approval, content, and destination scope.
