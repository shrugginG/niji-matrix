name: {zh: 模块文件、Loader 清单与执行内存差分, en: Module File Loader-Inventory and Executable-Memory Differential}
summary: {zh: 关联 Host 进程、模块来源、标准加载、私有可执行内存与线程结果，区分进程内承载和反射模块实例化, en: Correlate host processes module provenance standard loads private executable memory and thread outcomes to distinguish in-process hosting from reflective module instantiation}
description: {paragraphs: [{zh: 本策略不把任意 module load 或 RWX 内存直接视为攻击。NJA-000067 以 process 为中心比较 file-backed module、loader inventory 和 executable memory，标准分支检测非常用 host—module 组合及其行为，反射分支检测 PE-like private memory、protection transition 和 entry/thread 而无对应 image。风险需与异常来源、内容或结果相交。, en: This strategy does not treat every module load or RWX region as malicious. NJA-000067 compares file-backed modules loader inventory and executable memory around each process with a standard branch for unusual host-to-module combinations and behavior and a reflective branch for PE-like private memory protection transitions and entries or threads without images. Risk requires anomalous provenance content or outcome.}]}
