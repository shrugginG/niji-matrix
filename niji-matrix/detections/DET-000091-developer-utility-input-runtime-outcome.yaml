name: {zh: 开发 Utility 输入—运行时结果关联, en: Developer-Utility Input-to-Runtime Outcome Correlation}
summary: {zh: 关联签名开发工具、主机角色、Project/Manifest 内容与编译、内存、Child、Module 和网络结果，识别工具代理, en: Correlate signed developer tools host roles project or manifest content and compilation memory child module and network outcomes to detect utility proxying}
description: {paragraphs: [{zh: 本策略不把 MSBuild 等签名工具本身视为良性证明。NJA-000068 固定 utility identity/caller、host developer role、input origin/digest/content 与 build event，分别检测外部输入代理的 child/module/network 和 inline task 的 dynamic assembly/in-process 结果。合法开发 build 由批准 repository、toolchain、parent 和 output lineage 解释。, en: This strategy does not treat signed tools such as MSBuild as proof of benign behavior. NJA-000068 fixes utility identity and caller host developer role input origin digest and content and build events and separately detects child module or network outcomes from external-input proxying and dynamic assemblies or in-process outcomes from inline tasks. Approved repositories toolchains parents and output lineage explain legitimate developer builds.}]}
