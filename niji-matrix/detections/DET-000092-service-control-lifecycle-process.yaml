schema_version: 2.0.0
type: detection-strategy
id: DET-000092
name: {zh: 服务控制、生命周期与 Manager 进程关联, en: Service Control Lifecycle and Manager-Process Correlation}
summary: {zh: 将本地/远程服务请求、定义历史、create/start/delete 与 Manager Child/Module/Network 连接，检测已有和短驻服务执行, en: Join local or remote service requests definition history create start and delete with manager children modules and network to detect existing and ephemeral service execution}
description: {paragraphs: [{zh: 本策略以 service identity 和 execution transaction 为中心。NJA-000069 对已有服务比较 start/control 前后的 definition 与历史，避免只查新建事件；对短驻服务在分钟级关联 remote request、file write、create、start、child/named pipe 和 delete。只有未经批准的控制或定义与异常 payload/result 相交时提高风险，合法安装、补丁和 incident response 保留为替代解释。, en: This strategy centers service identity and execution transactions. NJA-000069 compares definitions and history around start or control for existing services rather than checking only creation and joins remote requests file writes create start children named pipes and delete within minutes for ephemeral services. Risk rises only when unapproved control or definition intersects anomalous payload or outcome while legitimate installation patching and incident response remain alternatives.}]}
detects_refs: [NJT-0079, NJS-0079-001, NJS-0079-002]
