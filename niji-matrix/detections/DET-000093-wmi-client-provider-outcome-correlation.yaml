id: DET-000093
name: {zh: WMI Client—Operation—Provider 结果关联, en: WMI Client-Operation-Provider Outcome Correlation}
summary: {zh: 将本地/远程 Client、Namespace/Class/Method 和 OperationId 连接到 Wmiprvse Provider、Child/API 与结果，恢复被遮蔽来源, en: Join local or remote clients namespace class method and OperationId to Wmiprvse providers children APIs and outcomes to recover masked provenance}
description: {paragraphs: [{zh: 本策略把 WMI operation 而非 wmiprvse 进程名作为检测对象。NJA-000070 用 WMI-Activity/Trace 的 client machine/user/PID、namespace、method、CorrelationId/OperationId 关联 provider host PID 与后继 child/module/file/network，并按资产角色和管理平台建立方法基线。纯 query、合法 SCCM/monitoring 与 remote admin 保留为替代解释，只有 execution method 和异常结果组合提高风险。, en: This strategy detects WMI operations rather than the Wmiprvse name. NJA-000070 uses WMI-Activity or Trace client machine user and PID namespace method CorrelationId or OperationId to join provider-host PIDs and successor child module file or network behavior and baselines methods by asset role and management platform. Pure queries legitimate SCCM or monitoring and remote administration remain alternatives and only execution methods combined with anomalous outcomes raise risk.}]}
