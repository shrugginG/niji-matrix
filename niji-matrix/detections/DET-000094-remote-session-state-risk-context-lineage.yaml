schema_version: 2.0.0
type: detection-strategy
id: DET-000094
name: {zh: 远程会话状态—风险情境—重入谱系, en: Remote Session-State-Risk-Context-Reentry Lineage}
summary:
  zh: 分别识别既有远程会话状态重放和用户风险情境拟态，并连接 token/session、设备、来源、认证步骤与后继资源结果。
  en: Separately identify established remote-session-state replay and user-risk-context mimicry and join token or session, device, origin, authentication steps, and downstream resource outcomes.
description:
  paragraphs:
    - zh: 本策略检测通过 VPN、RDP、VDI 或远程管理网关建立的异常会话，不把熟悉账户、低 risk score、住宅 IP 或 session resume 单独视为恶意。NJA-000071 将 IdP/网关的 token/session 签发、refresh、认证/MFA/posture 步骤、来源和设备连接到端点与资源结果，并区分首次恶意入口和处置后的持续重入。
      en: This strategy detects anomalous sessions established through VPN, RDP, VDI, or remote-management gateways without making a familiar account, low risk score, residential IP, or session resume malicious by itself. NJA-000071 joins identity-provider or gateway token or session issuance, refresh, authentication, MFA and posture steps, origin, and device to endpoint and resource outcomes and separates first malicious entry from continuing re-entry after response.
    - zh: 状态重放分支寻找同一 token/session 在没有完整新认证时跨来源/设备、并发或注销后使用，并核对有效期、绑定和撤销；风险情境分支把地理、ASN/ISP、proxy、device/client 和时间与用户长期基线比较，同时检查代理/设备来源和会话内行为。两分支可以同时命中，但保持独立置信度和处置动作。
      en: The state-replay branch looks for one token or session used without complete new authentication across origins or devices, concurrently, or after logout and validates lifetime, binding, and revocation. The risk-context branch compares geography, ASN or ISP, proxy, device or client, and time with a long user baseline while checking proxy or device provenance and in-session behavior. Both branches can match together but retain independent confidence and response actions.
    - zh: Heartbleed、Microsoft token、DEV-0537、UNC3944 与同国住宅代理活动提供行为与字段依据。正常 roaming、SSO、浏览器恢复、企业代理、移动运营商、旅行和设备更换是强反例；没有稳定 session/token ID 或 provider risk 细节时降低置信度，不用任意地理阈值填补。
      en: Heartbleed, Microsoft token reporting, DEV-0537, UNC3944, and same-country residential-proxy activity ground behavior and fields. Normal roaming, SSO, browser restore, enterprise proxies, mobile carriers, travel, and device change are strong counterexamples. Missing stable session or token IDs or provider-risk detail lowers confidence and is not filled with arbitrary geography thresholds.
