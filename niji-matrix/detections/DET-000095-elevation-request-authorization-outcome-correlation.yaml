schema_version: 2.0.0
type: detection-strategy
id: DET-000095
name:
  zh: 提权请求—授权上下文—高权限结果关联
  en: Elevation Request–Authorization Context–Privileged Outcome Correlation
summary:
  zh: 恢复低权限请求者经提权控制、中介或临时权限窗口到高权限进程、会话和资源操作的因果链，并分别评估来源谱系与有效期偏差。
  en: Reconstruct the causal chain from a lower-privilege requester through an elevation control, intermediary, or temporary privilege interval to a privileged process, session, and resource action, evaluating provenance lineage and validity deviation separately.
description:
  paragraphs:
  - zh: 本策略不把任何高完整性进程、UID 与 EUID 不同、角色激活、sudo 使用或授权配置写入单独视为恶意。宿主分支保留调用用户与进程、控制或 broker、策略状态、credential/consent 结果、产生的执行身份和首个高权限结果；云分支保留原始主体、eligible/activation 或 impersonation 事务、审批、作用域、短期凭据/会话、开始结束时间与资源操作。两个分支都必须证明从较低权限起点经控制路径产生了更高有效权限。
    en: The strategy does not treat every high-integrity process, UID and EUID difference, role activation, sudo use, or authorization-configuration write as malicious in isolation. The host branch retains the calling user and process, control or broker, policy state, credential or consent result, resulting execution identity, and first privileged outcome. The cloud branch retains the original principal, eligible activation or impersonation transaction, approval, scope, temporary credential or session, start and end times, and resource action. Both branches must establish that a control path produced higher effective privilege from a lower-privilege starting point.
  - zh: NJA-000072 检验 requester—control—intermediary—outcome 谱系是否完整，以及受信中介、父子关系、输入来源或策略状态是否偏离审批与基线。NJA-000073 构造每个临时权限区间，验证激活者、批准者、认证强度、作用域、有效期和区间内资源使用。输出区分未关联的提权结果、未批准或异常的控制路径，以及与敏感结果相连的高置信提权链；日志缺口只降低关联质量，不自动升级为攻击。
    en: NJA-000072 tests whether requester-control-intermediary-outcome lineage is complete and whether the trusted intermediary, parent-child relationship, input origin, or policy state deviates from approval and baseline. NJA-000073 constructs every temporary privilege interval and validates activator, approver, authentication strength, scope, validity, and resource use within the interval. Outputs distinguish an unjoined privileged result, an unapproved or anomalous control path, and a high-confidence elevation chain joined to a sensitive outcome. A logging gap lowers correlation quality rather than automatically escalating to attack.
