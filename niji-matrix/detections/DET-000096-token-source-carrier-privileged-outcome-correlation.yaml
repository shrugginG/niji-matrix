schema_version: 2.0.0
type: detection-strategy
id: DET-000096
name:
  zh: 令牌来源—承载体—谱系—结果关联
  en: Token Origin–Carrier–Lineage–Outcome Correlation
summary:
  zh: 分别恢复外来令牌到线程、新进程创建谱系和同一令牌权限位转折，并把每条链连接到实际敏感结果或观察差异，以区别正常 Windows 令牌服务与攻击者置换。
  en: Separately reconstruct foreign-token assignment to a thread, new-process creation lineage, and same-token privilege-bit
    transitions and join each chain to an actual sensitive outcome or observation difference to distinguish normal Windows
    token services from adversary substitution.
description:
  paragraphs:
  - zh: 本策略不把令牌或进程 API、SYSTEM 进程或父进程差异单独视为恶意。共同目标是证明攻击者取得或改变令牌状态，把它放入线程或新进程承载体，或在同一令牌内启用已有权限，并因此完成原上下文不能完成的操作，或使防守观察与真实来源发生可证明分离。原始权限、目标有效身份、稳定令牌与进程线程键、创建视角和后继结果是定性基础。
    en: The strategy does not treat token or process APIs, a SYSTEM process, or a parent-process difference as malicious in
      isolation. Its common goal is to establish that an adversary acquired or changed token state, placed it in a thread
      or new-process carrier, or enabled an existing privilege and consequently completed an operation unavailable to the
      original context or created a demonstrable separation between defender observation and actual provenance. Original authority,
      target effective identity, stable token and process or thread keys, creation viewpoints, and successor outcome form
      the classification basis.
  - zh: NJA-000074 比较现有进程的主令牌与敏感操作 TID 的有效模拟令牌，再回溯 source process/logon；NJA-000075 保留实际调用者、Creator/Target Subject、显示父体、token
      AuthenticationId 与首个结果的多源语义；NJA-000076 构造同一 token privilege 从 previous 到 new state 的短区间，并验证相匹配的权限消费。三个输出分别使用“线程有效身份置换”“新进程权威谱系解耦”“权限位激活消费”，缺失关键键时只报告上下文不完整。
    en: NJA-000074 compares an existing process's primary token with the effective impersonation token of the TID performing
      a sensitive action and traces it to a source process or logon. NJA-000075 preserves the distinct meanings of actual
      caller, Creator and Target Subject, displayed parent, token AuthenticationId, and first outcome. NJA-000076 constructs
      a short interval from previous to new privilege state in one token and validates matching privilege consumption. The
      three outputs respectively identify thread effective-identity substitution, new-process authority-lineage decoupling,
      and privilege-bit activation and consumption; missing critical keys produce incomplete context only.
  - zh: 高置信权限提升结果要求状态变化和更高权限结果同在；高置信行动隐匿结果可以由攻击者控制的身份或创建谱系分离、至少两个独立观察面和敏感后继活动共同建立。合法服务模拟、以其他身份运行、用户账户控制、任务或服务创建、软件部署、备份、调试和安全产品以审批、角色、二进制、来源身份、目标和时间作为反例，允许规则不得只绑定
      API、进程名、签名、SYSTEM 或父体。
    en: A high-confidence privilege-escalation result requires both a state transition and a higher-authority outcome. A high-confidence
      stealth result can instead be established by adversary-controlled identity or creation-lineage separation, at least
      two independent observation planes, and sensitive successor activity. Legitimate service impersonation, run-as use,
      user account control, task or service creation, software deployment, backup, debugging, and security products use approval,
      role, binary, source identity, target, and time as counterexamples; allow logic cannot bind only an API, process name,
      signing, SYSTEM, or parent.
