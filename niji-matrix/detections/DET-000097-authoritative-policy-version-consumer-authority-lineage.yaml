schema_version: 2.0.0
type: detection-strategy
id: DET-000097
name:
  zh: 权威策略版本—消费方—权限结果谱系
  en: Authoritative Policy Version-Consumer-Authority Lineage
summary:
  zh: 重建域/租户 policy 与 trust 的完整版本及有效区间，将传播或评估连接到明确主体的权限差和首个新获准操作，并识别使用后恢复的正常终态。
  en: Reconstruct complete versions and validity intervals for domain or tenant policy and trust, join propagation or evaluation to an identified principal's authority difference and first newly authorized operation, and identify a normal end state restored after use.
description:
  paragraphs:
  - zh: >-
      本策略检测“攻击者控制的权威 policy/trust version 被 consumer 使用并改变权限”，而不是把任意 GPO、directory、federation change 或高权限 endpoint 进程单独视为提权。NJA-000077 首先按 object ID 规范化完整 old/new 内容、writer、scope、ACL、link、issuer/certificate/claim、审批和 logical version；GPO 分支同时恢复 AD container 与 SYSVOL template，trust 分支恢复目标实际认可的 issuer 和 signer。未批准或语义敏感差异先输出 policy_state_anomaly，不越级推断实际效果。
    en: >-
      This strategy detects consumer use of an adversary-controlled authoritative policy or trust version that changes authority rather than treating any GPO, directory, or federation change or privileged endpoint process as elevation by itself. NJA-000077 first normalizes complete old and new content, writer, scope, ACL, link, issuer, certificate, claim, approval, and logical version by object ID. The GPO branch reconstructs both the AD container and SYSVOL template, while the trust branch reconstructs the issuer and signer actually accepted by the target. An unapproved or semantically sensitive difference first produces policy_state_anomaly without inferring effect.
  - zh: >-
      分析随后连接复制、refresh、evaluation 或 authentication request，证明哪个 consumer 观察了哪个 version，以及该版本怎样改变指定 principal/session/token 的 effective policy。只有 consumer adoption 时输出 consumer_adoption；将同一请求或主体的 pre-state 授权集合与恶意版本下的集合比较，存在正向差并连接首个此前拒绝、之后允许的资源操作时，才输出 elevation_confirmed。策略只关闭防御、推动载荷或由修改前已同权管理员使用时分别保留 Defense Impairment、execution 或 authority_not_increased，不能利用 ATT&CK 战术映射代替事件证明。
    en: >-
      The analytic then joins replication, refresh, evaluation, or authentication requests to establish which consumer observed which version and how that version changed effective policy for a specified principal, session, or token. Consumer use alone produces consumer_adoption. Only comparison of the same request or principal's pre-state authorization set with its set under the malicious version, a positive difference, and the first resource operation denied before but allowed after can produce elevation_confirmed. A policy that only impairs defenses, distributes a payload, or is used by an administrator with equivalent preexisting authority instead retains Defense Impairment, execution, or authority_not_increased; ATT&CK tactic mapping cannot substitute for event proof.
  - zh: >-
      对 NJS-0100-001，策略为同一 object 构造 pre-state、malicious 和 restored version 的区间，并要求 consumer use 与权限结果发生在恶意区间；回退后的 normal snapshot 不关闭检测。若 malicious version 被使用后发生等价反向 commit，则输出 post_use_reversion，并继续枚举该区间签发的 token/session、endpoint 权限和资源变化，直到撤销或回滚完成。批准发布、证书轮换、灾难恢复、自动纠偏、失败部署和并发管理员修改必须用 owner、工单、期望版本、窗口、consumer 验证与残留结果处理作为反例。
    en: >-
      For NJS-0100-001, the strategy constructs pre-state, malicious, and restored-version intervals for the same object and requires consumer use and the authority outcome to occur during the malicious interval. A normal snapshot after reversion does not close detection. When an equivalent inverse commit follows use of the malicious version, it emits post_use_reversion and continues enumerating tokens or sessions issued, endpoint authority created, and resource changes during the interval until revocation or rollback completes. Approved release, certificate rotation, disaster recovery, automatic correction, failed deployment, and concurrent administrator mutation require an owner, change record, intended version, window, consumer validation, and residual-outcome treatment as counterexamples.
detects_refs: [NJT-0100, NJS-0100-001]
