schema_version: 2.0.0
type: detection-strategy
id: DET-000098
name:
  zh: 工作负载边界越界—宿主权限结果谱系
  en: Workload Boundary-Crossing to Host-Authority Lineage
summary:
  zh: 将容器或 guest 的 pre-state、边界动作、规范宿主资源或 Broker 事务、权限差与首个 host-only 结果连接，并分别解析资源别名和来源转换。
  en: Join container or guest pre-state, boundary action, canonical host resource or broker transaction, authority difference, and first host-only result, resolving resource aliases and provenance translation in separate analytics.
description:
  paragraphs:
  - zh: >-
      本策略检测受限 workload/guest 经 isolation boundary 获得新的 host authority，而不是把 privileged、UID 0、hostPath、socket、unshare/mount、CVE、daemon child 或宿主文件字符串单独视为成功。两个 analytic 共享统一入口：恢复 workload identity、node/runtime/VM、pre-state namespace/capability/authorization 与事件时有效的配置，记录 attempted primitive 或 control request，并寻找可验证 host context/resource 与 first host-only result。危险配置先输出 boundary_risk，被拒绝或无结果动作输出 escape_attempt。
    en: >-
      This strategy detects a constrained workload or guest obtaining new host authority across an isolation boundary rather than treating privileged mode, UID 0, hostPath, a socket, unshare or mount, a CVE, daemon child, or host-file string as success. Both analytics share one entry gate: recover workload identity, node, runtime, or VM, pre-state namespaces, capabilities, and authorization plus configuration valid at event time; record an attempted primitive or control request; and find a verifiable host context or resource and first host-only result. Dangerous configuration first produces boundary_risk, while a denied or resultless action produces escape_attempt.
  - zh: >-
      NJA-000078 负责 NJS-0101-001。它版本化 spec 与 runtime mount/object map，把 process cgroup/container ID 与 PID/mount/user namespace、container-visible path/handle、inode/file ID/device/object ID 和 canonical host target 连接。只有原 container process 实际命中宿主对象才输出 alias_crossing_observed；再比较 pre-state policy 与 host operation/result，正向权限差完整才输出 alias_escape_confirmed。路径以 /host 开头或对象名看似敏感不能替代规范解析。
    en: >-
      NJA-000078 owns NJS-0101-001. It versions specification and runtime mount or object maps and joins process cgroup or container ID to PID, mount, or user namespace, container-visible path or handle, inode, file ID, device or object ID, and canonical host target. Only an original container process actually reaching a host object produces alias_crossing_observed. It then compares pre-state policy with host operation and result, producing alias_escape_confirmed only with a complete positive authority difference. A path beginning with /host or an apparently sensitive object name cannot replace canonical resolution.
  - zh: >-
      NJA-000079 负责 NJS-0101-002。它从 UNIX/TCP socket、API/gRPC、peer identity 或 callback old/new 恢复 original caller 与 request/body digest，连接 daemon decision、runtime/helper transaction、新 execution context 与宿主结果。API success 或 container create 只输出 broker_request_only；无法把 request 连接到 transaction 时输出 provenance_gap；新上下文与原 caller 同权时输出 no_authority_gain；只有 Broker 产生更高 host authority 且完成 host-only result 才输出 brokered_escape_confirmed。
    en: >-
      NJA-000079 owns NJS-0101-002. It recovers original caller and request or body digest from a UNIX or TCP socket, API or gRPC, peer identity, or callback old and new values and joins daemon decision, runtime or helper transaction, new execution context, and host result. API success or container creation produces only broker_request_only. Failure to join request to transaction produces provenance_gap. A new context with authority equivalent to the caller produces no_authority_gain. Only higher host authority created by the broker plus a host-only result produces brokered_escape_confirmed.
  - zh: >-
      两个分支最后使用同一结果门：container/guest pre-state authorization set → crossing primitive/request → canonical host resource 或 effective host context → post-state authorization set → positive difference → first operation expected deny before and observed allow after。alias 与 Broker 可在一条链并列，分别输出后再按 transaction/new workload ID 连接。合法 node agent、backup、storage/device plugin、debug/IR、CI builder 与 virtualization administration 必须由精确 caller、digest/spec、resource/method、owner、scope 和窗口解释，不按 daemon/root 信誉永久放行。
    en: >-
      Both branches finish with the same result gate: container or guest pre-state authorization set to crossing primitive or request to canonical host resource or effective host context to post-state authorization set to positive difference to first operation expected denied before and observed allowed after. Alias and broker branches can co-occur and are joined after separate outputs by transaction or new-workload ID. Legitimate node agents, backup, storage or device plugins, debugging or incident response, CI builders, and virtualization administration require exact caller, digest or specification, resource or method, owner, scope, and window rather than permanent trust in a daemon or root label.
detects_refs: [NJT-0101, NJS-0101-001, NJS-0101-002]
