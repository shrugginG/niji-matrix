schema_version: 2.0.0
type: detection-strategy
id: DET-000099
name:
  zh: 脆弱转换—权限结果谱系关联
  en: Vulnerable-Transition-to-Authority-Outcome Lineage Correlation
summary:
  zh: 将低权限 caller、exact vulnerable component/build、触发与异常转换、post-state authority 和首个新增授权结果连接，并为预受信组件保留 admission-to-interface-to-effect 分支。
  en: Join a lower-authority caller, exact vulnerable component or build, trigger and abnormal transition, post-state authority, and first newly authorized result, retaining an admission-to-interface-to-effect branch for pretrusted components.
description:
  paragraphs:
  - zh: >-
      本策略不把 vulnerability scan、CVE 名称、exploit 文件、异常参数、crash/BSOD、root/SYSTEM child、driver load 或 security process termination 单独当作 T1068。NJA-000080 先为 host/workload 和 caller 建立事件时有效的 identity、token/capability、namespace 与 resource authorization pre-state，再解析 exact package/file/module hash、build、patch、exploit mitigations 和 interface reachability。没有 trigger 的脆弱版本输出 vulnerable_exposure；被 policy/mitigation 拒绝或只有 fault 而无受保护结果输出 exploit_attempt。
    en: >-
      This strategy does not treat a vulnerability scan, CVE name, exploit file, abnormal argument, crash or blue screen, root or SYSTEM child, driver load, or security-process termination as T1068 by itself. NJA-000080 first builds event-time identity, token or capability, namespace, and resource-authorization pre-state for the host or workload and caller, then resolves exact package, file, or module hash, build, patch state, exploit mitigations, and interface reachability. A vulnerable version without a trigger produces vulnerable_exposure. Policy- or mitigation-denied activity, or a fault without a protected result, produces exploit_attempt.
  - zh: >-
      父级分支把 process/session/container 与 exec arguments/environment、RPC/API、syscall sequence、device request 或 crafted file 绑定到 victim component instance；再连接 exploit-protection/fault、control-flow/memory/state inconsistency、permission-inconsistent object mutation 或 component-created successor。只有 source→input/request→exact vulnerable instance→transition signal→post-state/effect 完整时输出 exploit_observed；如果 component/version 或 trigger 因果缺失，分别输出 version_unresolved 或 transition_unresolved，不能用“known exploit tool”补齐。
    en: >-
      The parent branch binds a process, session, or container and exec arguments or environment, RPC or API, syscall sequence, device request, or crafted file to a victim-component instance. It then joins exploit protection or fault, control-flow, memory, or state inconsistency, permission-inconsistent object mutation, or a component-created successor. Only a complete source-to-input or request-to-exact-vulnerable-instance-to-transition-signal-to-post-state or effect chain produces exploit_observed. Missing component or version and trigger causality respectively produce version_unresolved or transition_unresolved and cannot be filled by a known-exploit-tool label.
  - zh: >-
      NJS-0102-001 分支在父链前加入 component write/discovery、package source、hash/version/signature/certificate、service/registry/module state、event-time Code Integrity/allow/block policy 与实际 admission result；load 后解析 device/interface、controller handle/request、kernel memory/storage/protected-process effect。只有 exact vulnerable version 因预存 trust 被 accepted 且攻击者 controller 经其接口产生更高权限效果时输出 pretrusted_component_pivot；被 ASR/HVCI/deny 阻断输出 pretrusted_component_attempt，已存在组件的 load 必须从 inventory 与 unusual caller 恢复选择因果。
    en: >-
      The NJS-0102-001 branch prepends component write or discovery, package source, hash, version, signature or certificate, service, Registry, or module state, event-time Code Integrity or allow or block policy, and actual admission result to the parent chain. After load it resolves device or interface, controller handle or request, and kernel-memory, storage, or protected-process effect. Only an exact vulnerable version accepted because of preexisting trust and used through its interface by an adversary controller for a higher-authority effect produces pretrusted_component_pivot. ASR-, HVCI-, or deny-blocked activity produces pretrusted_component_attempt. An already installed component requires inventory and an unusual caller to recover selection causality.
  - zh: >-
      最终 authority gate 对同一 principal/context 或可证明派生的 carrier 比较 pre-state 与 post-state effective permissions，寻找至少一个 pre-state expected deny、post-state observed allow 的 first resource operation。完整时输出 elevation_confirmed；有 exploit_observed 但缺权限快照/结果时输出 authority_unresolved；没有正差输出 no_authority_gain。合法 patch testing、fuzzing、crash、driver/backup/hardware/security maintenance 需由 owner、ticket、approved version/caller/request、scope 和窗口解释。若 kernel effect 可能破坏 host telemetry，输出 telemetry_integrity_at_risk 并要求独立 policy/control-plane 或离线证据。
    en: >-
      The final authority gate compares pre-state and post-state effective permissions for the same principal or context or a provably derived carrier and finds at least one first resource operation expected denied before and observed allowed after. A complete chain produces elevation_confirmed. exploit_observed without authority snapshot or result produces authority_unresolved, while no positive difference produces no_authority_gain. Legitimate patch testing, fuzzing, crashes, and driver, backup, hardware, or security maintenance require owner, ticket, approved version, caller, request, scope, and window. If a kernel effect can damage host telemetry, telemetry_integrity_at_risk requires independent policy, control-plane, or offline evidence.
detects_refs: [NJT-0102, NJS-0102-001]
