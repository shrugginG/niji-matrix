schema_version: 2.0.0
type: detection-strategy
id: DET-000100
name:
  zh: 跨进程写入—调度—权限结果谱系关联
  en: Cross-Process Write-to-Dispatch-to-Authority-Outcome Lineage Correlation
summary:
  zh: 连接 source/target 权限前态、跨进程写入或装载、目标内调度和首个新增授权结果，并以 payload backing、既有流、创建期来源和角色贴合四条分支恢复被借用的执行来源。
  en: Join source and target authority pre-state, cross-process write or load, in-target dispatch, and the first newly authorized result, using payload backing, existing-flow, birth-time provenance, and role-conformity branches to recover borrowed execution provenance.
description:
  paragraphs:
  - zh: >-
      本策略首先建立 exact source/controller 与 target process instance，而不把 ProcessAccess、ptrace attach、可写内存、可疑 DLL、remote thread、RWX region、SYSTEM process 或异常 target behavior 单独当作 T1055。NJA-000082 保存 source 与 target 在事件时的 identity/token/integrity/capability/namespace、process start key、requested/granted rights 和 resource authorization pre-state，再把 handle/attach 与 write/map/load request、payload region/module backing、thread/context/APC/callback/message dispatch 连接。被拒绝的访问或调度输出 injection_attempt，成功写入但没有执行输出 payload_staged；只有 target-context instruction 或其直接 first behavior 可证明时输出 injection_confirmed。
    en: >-
      This strategy first establishes exact source or controller and target process instances and does not treat ProcessAccess, ptrace attachment, writable memory, a suspicious DLL, a remote thread, an RWX region, a SYSTEM process, or anomalous target behavior alone as T1055. NJA-000082 preserves event-time identity, token, integrity, capability, namespace, process start key, requested and granted rights, and resource-authorization pre-state for source and target, then joins handle or attach with write, map, or load request, payload-region or module backing, and thread, context, APC, callback, message, or other dispatch. Rejected access or dispatch produces injection_attempt, a successful write without execution produces payload_staged, and only provable target-context instruction or its direct first behavior produces injection_confirmed.
  - zh: >-
      父级与 NJS-0103-001/002 分支按 exact process-start identity 形成 source→target access→memory/load mutation→dispatch→executing region/call stack→first target behavior 链。无背衬分支验证 region 的 allocation/protection、file/section/module backing、content origin 和 execution；既有流分支验证 target 原有 thread/callback/message object 的 pre-state、source mutation/queue、触发条件与 instruction-pointer/call-stack 转移。新线程与标准 loader 可以确认父级，但不因实现名称成为子技术；缺任一因果边分别保持 target_unresolved、mutation_unresolved、dispatch_unresolved 或 execution_unresolved。
    en: >-
      Parent and NJS-0103-001 or NJS-0103-002 branches form a source-to-target-access-to-memory-or-load-mutation-to-dispatch-to-executing-region-or-call-stack-to-first-target-behavior chain keyed by exact process-start identity. The unbacked branch verifies region allocation and protection, file, section, or module backing, content origin, and execution. The existing-flow branch verifies pre-state of an existing target thread, callback, or message object, source mutation or queue, trigger condition, and instruction-pointer or call-stack transfer. A new thread or standard loader can confirm the parent but does not become a child by implementation name. A missing causal edge leaves target_unresolved, mutation_unresolved, dispatch_unresolved, or execution_unresolved as appropriate.
  - zh: >-
      NJA-000083 处理 NJS-0103-003/004 的跨层矛盾。创建期来源分支绑定 creator、creation flags、initial file object/section/image、suspend/resume、entry bytes 和 first-executed region，要求合法 creation identity 与实际首段执行内容发生可证明的 provenance divergence。角色贴合分支绑定 target enumeration/selection、payload purpose、target documented/observed role、approved modules/code regions、first downstream resource action 和 destination/content，只有正常主体—动作组合由未批准 injected code 产生时成立。deleted file、signed path、browser/svchost 名称或常见网络行为均不能独自越过门禁。
    en: >-
      NJA-000083 handles cross-layer contradictions for NJS-0103-003 and NJS-0103-004. The birth-time provenance branch binds creator, creation flags, initial file object, section, or image, suspend and resume, entry bytes, and first-executed region, requiring provable provenance divergence between the legitimate creation identity and actual initial executed content. The role-conformity branch binds target enumeration or selection, payload purpose, documented or observed target role, approved modules or code regions, first downstream resource action, and destination or content. It qualifies only when an ordinary subject-action pair is produced by unapproved injected code. A deleted file, signed path, browser or svchost name, or common network behavior cannot cross the gate by itself.
  - zh: >-
      TA0004 在 injection_confirmed 后采用独立权限门：把 source pre-state 与 target/post-state effective authority 及 protected-resource decision 比较，要求同一 transaction 中至少一个 source 原本 expected deny、现在 observed allow 的 first newly authorized operation。满足时输出 elevation_confirmed；注入已证但没有正权限差输出 injection_confirmed_non_elevating，有 target 权限标签但缺 pre-state 或 resource result 输出 authority_unresolved。合法 debugger、profiler、assistive technology、EDR、browser sandbox、JIT、hot patch、backup 与 compatibility tooling 必须由 owner、package/hash、source-target relationship、requested rights、purpose、change window 与 expected result 共同解释。疑似 kernel/controller 绕过或 sensor gap 时追加 telemetry_integrity_at_risk，并依赖独立策略、资源与离线证据。
    en: >-
      TA0004 applies a separate authority gate after injection_confirmed. It compares source pre-state with target or post-state effective authority and protected-resource decisions and requires at least one first newly authorized operation in the same transaction that was expected denied for the source and is now observed allowed. A complete chain produces elevation_confirmed. Proven injection without a positive authority difference produces injection_confirmed_non_elevating, while a target privilege label without source pre-state or resource result produces authority_unresolved. Legitimate debuggers, profilers, assistive technology, EDR, browser sandboxes, JIT, hot patching, backup, and compatibility tooling require joint explanation by owner, package or hash, source-target relationship, requested rights, purpose, change window, and expected result. Suspected kernel or controller bypass or sensor gaps add telemetry_integrity_at_risk and require independent policy, resource, or offline evidence.
detects_refs: [NJT-0103, NJS-0103-001, NJS-0103-002, NJS-0103-003, NJS-0103-004]
