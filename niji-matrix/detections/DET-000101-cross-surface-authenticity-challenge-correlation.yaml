schema_version: 2.0.0
type: detection-strategy
id: DET-000101
name:
  zh: 跨表面真实性挑战关联
  en: Cross-Surface Authenticity-Challenge Correlation
summary:
  zh: 在一次判真中关联身份、状态、错误与运行表面的请求响应依赖。
  en: Correlate request-response dependencies across identity, state, error, and operational surfaces within one authenticity
    assessment.
description:
  paragraphs:
  - zh: 本策略检测同一会话或紧邻复连中的跨表面真实性挑战，而不把所有版本、横幅或功能查询视为反诱捕。NJA-000084 按目标与会话恢复请求顺序、响应依赖和跨表面约束，并使用同类正常会话基线抑制兼容性测试与安全研究。
    en: This strategy detects cross-surface authenticity challenges within one session or closely adjacent reconnections rather
      than treating every version, banner, or function query as anti-deception activity. NJA-000084 reconstructs request order,
      response dependency, and cross-surface constraints by target and session and suppresses compatibility testing and security
      research with comparable normal-session baselines.
