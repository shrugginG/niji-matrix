schema_version: 2.0.0
type: detection-strategy
id: DET-000102
name:
  zh: 宿主构建—镜像—部署谱系
  en: Host Build–Image–Deployment Lineage
summary:
  zh: 连接构建调用者、上下文、构建网络、生成镜像摘要和首次容器部署，识别绕过成品镜像拉取监控的宿主内构建。
  en: Join build caller, context, build network, resulting image digest, and first container deployment to identify on-host
    builds that bypass finished-image retrieval monitoring.
description:
  paragraphs:
  - zh: 本策略检测攻击者控制的宿主构建是否从正常基础镜像或受控材料产生新的本地镜像，并由后继容器消费。NJA-000087 以构建 ID、输入材料摘要和输出镜像摘要连接调用者、步骤、外连、新层、证明与首次部署。Aqua 案例中“正常 Alpine—构建期 WGET—新本地镜像—挖矿容器”是直接模型；单个 docker build、公共基础镜像或守护进程网络不单独定性。
    en: This strategy detects whether an adversary-controlled host build produces a new local image from a benign base image
      or controlled materials and has that image consumed by a successor container. NJA-000087 joins caller, steps, egress,
      new layers, attestation, and first deployment by build ID, input-material digest, and output-image digest. The Aqua chain
      from benign Alpine through build-time WGET and a new local image to a mining container is the direct model. One docker
      build, public base image, or daemon network event is not dispositive.
