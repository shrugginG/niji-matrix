schema_version: 2.0.0
type: detection-strategy
id: DET-000103
name:
  zh: 调试状态—行为结果差分
  en: Debug-State–Behavior Outcome Differential
summary:
  zh: 比较调试开启、关闭与透明插桩条件下的后续执行，识别状态门控行为收敛。
  en: Compare successor execution under debugging-on, debugging-off, and transparent-instrumentation conditions to identify
    behavior contraction gated by debugger state.
description:
  paragraphs:
  - zh: 本策略只检测调试状态与后续结果之间的稳定条件关系，不把 IsDebuggerPresent、TracerPid、PEB 标志或某个进程名当作单独恶意指标。NJA-000088 对同一样本的控制流、退出、解码、子进程、文件和网络结果执行受控差分，只有调试状态改变与真实路径缺失可重复连接时才提高置信。
    en: This strategy detects only a stable conditional relationship between debugger state and successor outcome and does
      not treat IsDebuggerPresent, TracerPid, a PEB flag, or one process name as a standalone malicious indicator. NJA-000088
      runs controlled differentials over control flow, exit, decoding, child processes, files, and networking for one sample
      and raises confidence only when debugger-state change reproducibly connects to loss of the true path.
