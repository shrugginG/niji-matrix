schema_version: 2.0.0
type: detection-strategy
id: DET-000104
name:
  zh: 静默等待—后继动作长周期关联
  en: Quiescent Wait–Successor Long-Horizon Correlation
summary:
  zh: 连接低密度等待状态、计时器或时间门控与延迟后首个敏感动作。
  en: Join low-density wait state, timer or time gating, and the first sensitive action after delay.
description:
  paragraphs:
  - zh: 本策略只检测运行实体内的静默等待，不把休眠 API、长寿命进程或具体时长当作恶意指标。NJA-000089 保留进程身份、等待开始与结束、计时器到期和等待后第一个敏感结果，并比较正常与一致加速时间条件。只有等待无业务依赖、移出观察窗口并连接恶意后继动作时才提高置信。
    en: This strategy detects only quiescent waiting within a running entity and does not treat a sleep API, long-lived process,
      or duration as malicious. NJA-000089 preserves process identity, wait start and end, timer due time, and the first sensitive
      result after waiting and compares normal with coherently accelerated time. Confidence rises only when waiting lacks a
      business dependency, moves behavior outside the observation window, and joins to a malicious successor.
