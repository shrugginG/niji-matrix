schema_version: 2.0.0
type: detection-strategy
id: DET-000105
name:
  zh: 原始存储—对象—结果谱系
  en: Raw Storage–Object–Outcome Lineage
summary:
  zh: 将卷或设备级访问映射到敏感文件区间和后继用途，识别绕开文件系统观察的读取或写入。
  en: Map volume- or device-level access to sensitive file extents and successor use to identify reads or writes that
    bypass file-system observation.
description:
  paragraphs:
  - zh: 本策略不把备份、vssadmin 或卷句柄单独视为恶意。NJA-000090 分别采集原始设备访问与副本控制面事件，将块区间或副本路径映射到敏感对象，再连接输出、凭据访问或数据使用；只有未批准主体、敏感对象、活动文件视图绕开和后继结果共同存在时提高置信度。
    en: This strategy does not treat backup, vssadmin, or a volume handle as malicious by itself. NJA-000090 separately
      collects raw-device access and copy-control-plane events, maps block extents or copy paths to sensitive objects,
      and joins output, credential access, or data use. Confidence rises only when an unapproved principal, sensitive
      object, bypass of the live-file view, and a successor outcome coexist.
