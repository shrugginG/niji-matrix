schema_version: 2.0.0
type: detection-strategy
id: DET-000106
name:
  zh: 显式属性比较—激活差分
  en: Explicit Attribute Comparison–Activation Differential
summary:
  zh: 连接可读目标属性、可恢复比较与匹配后的核心动作，并通过匹配和失配差分识别显式门控。
  en: Join a readable target attribute, recoverable comparison, and core action after a match and identify explicit gating
    through matched-versus-unmatched differential.
description:
  paragraphs:
  - zh: 本策略不把环境发现、一个属性读取或互斥对象单独定性。NJA-000091 将属性读取与规范化、常量或规则访问、比较与分支、投递或端点后继结果连接，并在可行时修改一个条件做差分；只有攻击者预期条件与恶意结果形成可重复因果时输出。
    en: This strategy does not classify environment discovery, one attribute read, or a mutex object alone. NJA-000091 joins
      attribute read and normalization, constant or rule access, comparison and branch, and delivery or endpoint successor
      outcome and changes one condition for differential when feasible. It emits only when an adversary-expected condition
      has a repeatable causal relationship with a malicious result.
