schema_version: 2.0.0
type: detection-strategy
id: DET-000108
name:
  zh: 工件视图—状态—消费差分
  en: Artifact View–State–Consumption Differential
summary:
  zh: 比较默认与完整枚举、地址空间、创建与运行表示以及宿主与来宾观察域，并连接后继工件消费。
  en: Compare default and complete enumeration, address spaces, creation and runtime representation, and host and guest observation
    domains and join successor artifact consumption.
description:
  paragraphs:
  - zh: 本策略检测底层工件状态与防守常用视图的差异，而不是把隐藏属性、扩展属性或虚拟实例单独视为恶意。四项 Analytic 分别处理枚举遗漏、替代地址、表示差分和跨域封装，并要求对象被后继恶意行为使用。
    en: This strategy detects differences between underlying artifact state and a defender's common view rather than treating
      a hidden attribute, extended attribute, or virtual instance as malicious alone. Four analytics cover enumeration omission,
      alternate addressing, representation differential, and cross-domain encapsulation and require successor malicious use
      of the object.
