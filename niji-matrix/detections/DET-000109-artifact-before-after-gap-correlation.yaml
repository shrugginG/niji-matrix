schema_version: 2.0.0
type: detection-strategy
id: DET-000109
name:
  zh: 证据对象擦除与独立残留恢复
  en: Evidence-Object Erasure and Independent Residue Recovery
summary:
  zh: 比较工件前后态、修改者和后继行为，识别为缩减攻击痕迹而进行的选择性删除或改写。
  en: Compare artifact before and after state, modifier, and successor behavior to identify selective deletion or rewriting
    intended to contract attack traces.
description:
  paragraphs:
  - zh: 本策略不从对象消失单独推断恶意。NJA-000097 保存对象创建与消费、内容摘要、删除主体、目录或日志序号和独立副本，将删除连接到先前攻击用途；只有未批准删除和可证明前态共同成立时输出。
    en: This strategy does not infer maliciousness from object absence alone. NJA-000097 preserves object creation and consumption,
      content digest, deleting principal, directory or log sequence, and independent copy and joins deletion to prior attack
      use. It emits only when unapproved deletion and provable prior state coexist.
