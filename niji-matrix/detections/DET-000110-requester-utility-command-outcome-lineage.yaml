schema_version: 2.0.0
type: detection-strategy
id: DET-000110
name:
  zh: 即时请求者—实用程序输入—结果谱系
  en: Immediate Requester–Utility Input–Outcome Lineage
summary:
  zh: 连接原始调用者、受信实用程序输入和子进程或网络结果，识别间接命令代理。
  en: Join original caller, trusted-utility input, and child-process or network outcome to identify indirect command proxying.
description:
  paragraphs:
  - zh: 本策略不以系统实用程序出现为告警。NJA-000098 解析一次调用的完整参数、标准输入或调用文件，恢复代理命令语义，并在同一进程事务内连接请求者、实用程序、子进程、文件与网络结果；持久配置链由 DET-000129 负责。
    en: This strategy does not alert on a system utility alone. NJA-000098 parses complete arguments, standard input, or invocation
      files from one call, recovers proxied command semantics, and joins requester, utility, child process, file, and network
      outcome within the same process transaction. DET-000129 owns durable configuration chains.
