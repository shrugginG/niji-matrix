schema_version: 2.0.0
type: detection-strategy
id: DET-000111
name:
  zh: 可见特征—可信来源差分
  en: Visible-Feature–Trusted-Provenance Differential
summary:
  zh: 将名称、位置、类型、谱系与客户端特征和独立来源或实际行为比较，识别身份替代。
  en: Compare name, location, type, lineage, and client features with independent provenance or actual behavior to identify
    identity substitution.
description:
  paragraphs:
  - zh: 本策略不按一个可疑名称告警。Analytic 规范可见特征，解析真实文件类型、签名、对象身份、创建者、实际父体、运行参数和网络行为，并与被借用的合法参照比较；多个来源差异和敏感结果共同提高置信度。
    en: This strategy does not alert on one suspicious name. The analytic normalizes visible features, resolves real file
      type, signature, object identity, creator, actual parent, runtime arguments, and network behavior, and compares them
      with the borrowed legitimate reference. Differences across multiple sources and a sensitive outcome jointly raise confidence.
