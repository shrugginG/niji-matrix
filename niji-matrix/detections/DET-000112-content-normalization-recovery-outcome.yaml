schema_version: 2.0.0
type: detection-strategy
id: DET-000112
name:
  zh: 内容规范化—恢复—结果关联
  en: Content Normalization–Recovery–Outcome Correlation
summary:
  zh: 递归规范化可见内容，关联解包、解码、内存恢复和后继执行，识别内容表示遮蔽。
  en: Recursively normalize visible content and correlate unpacking, decoding, memory recovery, and successor execution
    to identify content-representation obscuration.
description:
  paragraphs:
  - zh: 本策略不以高熵或编码字符串单独定性。Analytic 保存原始表示和来源，递归解码、解压、解析载体与结构，捕获运行时恢复缓冲区和动态解析，并比较恢复内容与后继结果；未知来源和恶意结果提高置信度。
    en: This strategy does not classify high entropy or an encoded string alone. The analytic preserves original representation
      and provenance, recursively decodes, decompresses, and parses carrier and structure, captures runtime recovery
      buffers and dynamic resolution, and compares recovered content with successor outcomes. Unknown provenance and
      malicious results raise confidence.
