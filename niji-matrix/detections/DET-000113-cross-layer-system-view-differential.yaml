schema_version: 2.0.0
type: detection-strategy
id: DET-000113
name:
  zh: 跨层系统视图差分
  en: Cross-Layer System-View Differential
summary:
  zh: 比较上层查询、内核或 hypervisor、磁盘和网络视图，识别被拦截接口隐藏的真实组件。
  en: Compare higher-level query, kernel or hypervisor, disk, and network views to identify real components hidden by intercepted
    interfaces.
description:
  paragraphs:
  - zh: 本策略不按一个 hook 或驱动定性。Analytic 对同一对象域从至少两个独立层采集状态，验证代码与函数指针完整性，并把视图缺失连接到隐藏组件的网络、文件或执行结果。
    en: This strategy does not classify one hook or driver alone. The analytic collects state for the same object domain from
      at least two independent layers, validates code and function-pointer integrity, and joins a view omission to network,
      file, or execution outcomes from the hidden component.
