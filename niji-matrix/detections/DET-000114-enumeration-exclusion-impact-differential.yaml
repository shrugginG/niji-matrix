schema_version: 2.0.0
type: detection-strategy
id: DET-000114
name:
  zh: 枚举—排除—影响差分
  en: Enumeration–Exclusion–Impact Differential
summary:
  zh: 连接目标枚举、攻击者排除谓词、被跳过与处理集合以及整体恶意结果，识别选择性排除。
  en: Join target enumeration, adversary exclusion predicate, skipped and processed sets, and overall malicious outcome to
    identify selective exclusion.
description:
  paragraphs:
  - zh: 本策略不从某些文件未被处理单独推断恶意。Analytic 恢复枚举输入、正则或列表、分支结果和覆盖率，并把保留目标与系统连续性、告警和最终破坏连接；未知载荷与稳定选择谓词提高置信度。
    en: This strategy does not infer maliciousness from some files remaining unprocessed. The analytic recovers enumeration
      input, regular expression or list, branch results, and coverage and joins preserved targets to system continuity, alerting,
      and final impact. An unknown payload and stable selection predicate raise confidence.
