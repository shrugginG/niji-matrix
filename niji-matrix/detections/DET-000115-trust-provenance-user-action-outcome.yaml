schema_version: 2.0.0
type: detection-strategy
id: DET-000115
name:
  zh: 信任来源—用户动作—结果关联
  en: Trust Provenance–User Action–Outcome Correlation
summary:
  zh: 验证通信来源与关系情境，并把可疑请求连接到用户执行、批准、授权或披露结果。
  en: Validate communication provenance and relationship context and join suspicious requests to user execution, approval,
    authorization, or disclosure outcomes.
description:
  paragraphs:
  - zh: 本策略不从一封异常消息单独定性。Analytic 比较域、账户、发送者、显示名、线程与历史关系，识别伪造或异常来源，并关联用户动作与后继技术结果；高风险流程缺少独立确认时提高置信度。
    en: This strategy does not classify one unusual message alone. The analytic compares domain, account, sender, display
      name, thread, and historical relationship, identifies forged or anomalous provenance, and correlates user action with
      successor technical outcome. Missing independent confirmation in a high-risk workflow raises confidence.
