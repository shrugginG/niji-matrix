type: detection-strategy
id: DET-000116
name:
  zh: 文档引用—解析—结果关联
  en: Document Reference–Resolution–Outcome Correlation
summary:
  zh: 连接文档外部关系、应用网络解析、取得内容或认证及后继结果。
  en: Join external document relationships, application network resolution, retrieved content or authentication, and successor outcome.
description:
  paragraphs:
  - zh: 解析文档关系与模板 URI，关联打开文档的进程、DNS/HTTP/SMB、缓存、认证和代码执行。未知外部资源与敏感结果组合时提高置信度，合法企业模板按发布与签名基线抑制。
    en: Parse document relationships and template URIs and correlate the opening process, DNS, HTTP or SMB, cache, authentication, and code execution.
      Unknown external resources combined with sensitive outcomes raise confidence, while legitimate enterprise templates are suppressed through
      publisher and signing baselines.
