schema_version: 2.0.0
type: detection-strategy
id: DET-000117
name:
  zh: 网络信号—激活—会话关联
  en: Network Signal–Activation–Session Correlation
summary:
  zh: 连接预定义信号流量、过滤或防火墙状态变化、隐藏功能激活和后继会话。
  en: Join predefined signal traffic, filter or firewall state change, hidden-function activation, and successor session.
description:
  paragraphs:
  - zh: 本策略不从一个异常包定性。Analytic 在短窗口内匹配稀有包序列或字段，关联 socket filter、防火墙、端口与进程变化以及随后反向或入站会话；稳定重复链提高置信度。
    en: This strategy does not classify one unusual packet. The analytic matches rare packet sequences or fields in a
      short window and correlates socket-filter, firewall, port, and process changes and a subsequent reverse or inbound
      session. A stable repeated chain raises confidence.
  - zh: TA0003 分支把信号链与 boot ID、映像/启动项/module/filter load 和中断后首次信号连接。只有 matcher 与隐藏功能在中断后被保存或重载，并由新信号产生恢复会话时，才输出 persistent_signal_gated_entry_confirmed；只有载体或只有一次激活分别保持 carrier_only 与 signal_activation_only。
    en: The TA0003 branch joins signal lineage with boot identity image startup-item module or filter load and the first post-interruption signal. It emits persistent_signal_gated_entry_confirmed only when matcher and hidden function are preserved or reloaded after interruption and a new signal produces a restored session. A carrier alone or one activation remains carrier_only or signal_activation_only respectively.
