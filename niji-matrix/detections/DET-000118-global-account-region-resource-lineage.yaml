schema_version: 2.0.0
type: detection-strategy
id: DET-000118
name:
  zh: 全局账户—区域—资源谱系
  en: Global Account–Region–Resource Lineage
summary:
  zh: 跨所有区域关联身份、资源创建、日志覆盖、账单和后继活动，识别低覆盖区域放置。
  en: Correlate identity, resource creation, logging coverage, billing, and successor activity across every region to identify
    low-coverage regional placement.
description:
  paragraphs:
  - zh: 本策略从全局控制面枚举所有区域，不依赖常用区域清单。Analytic 比较组织批准区域、日志与安全服务覆盖，关联新资源、创建主体、网络与账单；未批准区域中的恶意结果提高置信度。
    en: This strategy enumerates every region from the global control plane rather than relying on a common-region list. The
      analytic compares approved regions and logging and security-service coverage and joins new resources, creator, networking,
      and billing. A malicious outcome in an unapproved region raises confidence.
