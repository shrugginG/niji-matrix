schema_version: 2.0.0
type: detection-strategy
id: DET-000120
name:
  zh: 纵向诱捕部署画像关联
  en: Longitudinal Deception-Deployment Profiling Correlation
summary:
  zh: 结合部署映射与变更历史，识别跨相关节点重复的寿命、同步变化与时序比较。
  en: Combine deployment mapping and change history to identify repeated lifetime, synchronized-change, and timing comparisons
    across related nodes.
description:
  paragraphs:
  - zh: 本策略针对尚处于 hypothesis 的分布式纵向真实性关联，输出可观察的部署级重访结构而不直接归因攻击者意图。NJA-000085 按稳定节点和部署批次关联变更前后的复测；只有当节点归并、纵向比较和真实性对象都成立时，才将结果标记为子技术候选。
    en: This strategy addresses Distributed Longitudinal Authenticity Correlation as an explicit hypothesis and produces an
      observable deployment-level revisit structure without directly attributing adversary intent. NJA-000085 correlates revisits
      before and after change by stable node and deployment cohort and marks a child candidate only when node resolution,
      longitudinal comparison, and an authenticity object are all established.
