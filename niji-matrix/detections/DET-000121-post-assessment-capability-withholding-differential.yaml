schema_version: 2.0.0
type: detection-strategy
id: DET-000121
name:
  zh: 判真后能力保留结果差分
  en: Post-Assessment Capability-Withholding Outcome Differential
summary:
  zh: 比较受控真实性响应组的后续深度，识别特定反馈后稳定的终止或载荷保留。
  en: Compare follow-on depth across controlled authenticity-response cohorts to identify stable termination or payload withholding
    after particular feedback.
description:
  paragraphs:
  - zh: 本策略检测真实性反馈是否否定高价值能力暴露，不从一次“未见载荷”推断意图。NJA-000086 比较可疑与可信响应组中的利用、载荷和控制阶段，并排除网络故障、权限、目标可用性和人工处置后，才输出条件化能力保留。
    en: This strategy detects whether authenticity feedback negatively gates high-value capability exposure and does not infer
      intent from one absent payload. NJA-000086 compares exploitation, payload, and control stages across suspicious and credible
      response cohorts and emits conditional capability withholding only after excluding network failure, privilege, target
      availability, and analyst intervention.
