schema_version: 2.0.0
type: detection-strategy
id: DET-000122
name:
  zh: 调试观察通道饱和
  en: Debug Observation-Channel Saturation
summary:
  zh: 识别高密度低价值调试或异常事件对通道丢失、存储、延迟与分析预算的影响。
  en: Identify effects of high-density low-value debug or exception events on channel loss, storage, latency, and analyst budget.
description:
  paragraphs:
  - zh: 本策略不以调试输出的存在或一个固定速率阈值定性。NJA-000108 按进程和线程统计调试字符串与异常模板，关联通道队列、丢失、截断、存储、CPU 和噪声期间的外部结果。高密度、低信息增益、核心路径继续与通道资源影响共同成立时，才输出饱和。
    en: This strategy does not classify the presence of debug output or one fixed rate threshold. NJA-000108 profiles debug-string
      and exception templates by process and thread and correlates channel queue, loss, truncation, storage, CPU, and external
      outcomes during noise. Saturation is emitted only when high density, low information gain, continued core execution,
      and channel-resource impact reinforce one another.
