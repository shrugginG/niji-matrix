schema_version: 2.0.0
type: detection-strategy
id: DET-000123
name:
  zh: 耗工作量延迟伪装
  en: Work-Consuming Delay Camouflage
summary:
  zh: 识别高重复、低信息增益、用时主导的 API 或命令工作，并关联窗口后载荷。
  en: Identify highly repetitive, low-information-gain, time-dominant API or command work and correlate the payload after the
    window.
description:
  paragraphs:
  - zh: 本策略不把高 API 数量或循环本身视为恶意。NJA-000109 按进程归一操作模板、读写对象、CPU、I/O、墙钟用时和持久输出，计算低工作输出比，并将循环后的解包、注入、通信或破坏结果回连。模板重复、用时主导、窗口加速差分和恶意后继结果共同成立时才输出。
    en: This strategy does not treat a high API count or loop as malicious by itself. NJA-000109 normalizes operation templates,
      accessed objects, CPU, I/O, wall-clock time, and durable output by process, calculates a low work-output ratio, and joins
      unpacking, injection, communication, or impact after the loop. It emits only when template repetition, dominant elapsed
      time, accelerated-window differential, and malicious successor outcome reinforce one another.
