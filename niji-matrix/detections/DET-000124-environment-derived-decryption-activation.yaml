schema_version: 2.0.0
type: detection-strategy
id: DET-000124
name:
  zh: 环境材料—派生—解密激活谱系
  en: Environmental Material–Derivation–Decryption Activation Lineage
summary:
  zh: 连接目标环境输入、密码派生、特定密文解密与后继执行，识别环境派生密码激活。
  en: Join target-environment input, cryptographic derivation, decryption of specific ciphertext, and successor execution to
    identify environment-derived cryptographic activation.
description:
  paragraphs:
  - zh: 本策略不把环境读取、散列或一般解密单独定性。NJA-000110 将环境材料规范化、KDF 或重复散列、密文对象、解密或完整性结果、明文内存区和后继动作连接，并比较候选环境重放。只有环境材料决定核心内容可恢复性且恢复后出现恶意结果时输出。
    en: This strategy does not classify an environment read, hash, or ordinary decryption alone. NJA-000110 joins environmental-material
      normalization, KDF or repeated hashing, ciphertext identity, decryption or integrity result, plaintext memory region,
      and successor action and compares candidate-environment replays. It emits only when environmental material determines
      recoverability of core content and a malicious outcome follows recovery.
