schema_version: 2.0.0
type: detection-strategy
id: DET-000125
name:
  zh: 受信接口—底层执行上下文跨越
  en: Trusted Interface–Underlying Execution Context Crossing
summary:
  zh: 连接管理接口输入、漏洞边界转换和底层进程、文件或网络结果，识别受信接口上下文逃逸。
  en: Join management-interface input, vulnerability-driven boundary transition, and underlying process, file, or network
    outcome to identify trusted-interface context escape.
description:
  paragraphs:
  - zh: 本策略不把管理员登录或底层 shell 单独定性。NJA-000111 将认证会话和接口 accounting 与设备版本、构造输入、底层进程/文件/套接字及网络连接关联，并验证这些结果无法由接口正常命令模型解释；只有漏洞转换和恶意后继共同成立时输出。
    en: This strategy does not classify an administrator login or underlying shell alone. NJA-000111 correlates authenticated
      sessions and interface accounting with device version, crafted input, underlying process, file, socket, and network
      connection and verifies that the outcome cannot be explained by the interface's normal command model. It emits only
      when a vulnerability-driven transition and malicious successor both hold.
