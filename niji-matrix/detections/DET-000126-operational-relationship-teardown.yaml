type: detection-strategy
id: DET-000126
name:
  zh: 操作关系建立—使用—拆除谱系
  en: Operational Relationship Establishment–Use–Teardown Lineage
summary:
  zh: 连接共享、连接或持久化关系的建立、攻击用途和拆除，识别活动图中的选择性边删除。
  en: Join establishment, attack use, and teardown of share, connection, or persistence relationships to identify selective
    edge removal from the activity graph.
description:
  paragraphs:
  - zh: 本策略不把正常会话关闭或配置删除单独定性。NJA-000112 同时保存关系两端、建立者、使用事件、拆除主体和服务器或远端残留；只有关系服务于可疑动作后被未批准拆除时输出。
    en: This strategy does not classify normal session closure or configuration deletion alone. NJA-000112 preserves both relation
      endpoints, creator, use event, teardown principal, and server-side or remote residue. It emits only when a relationship
      serving suspicious activity is then torn down without approval.
