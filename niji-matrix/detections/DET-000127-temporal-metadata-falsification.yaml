schema_version: 2.0.0
type: detection-strategy
id: DET-000127
name:
  zh: 时间元数据—独立事件序列差分
  en: Temporal Metadata–Independent Event Sequence Differential
summary:
  zh: 比较对象时间属性、修改动作与不可变事件顺序，识别伪造时间线。
  en: Compare object timestamp attributes, modification actions, and immutable event order to identify falsified timelines.
description:
  paragraphs:
  - zh: 本策略不从旧时间或异常时间单独推断攻击。NJA-000113 比较对象的多套时间属性、创建与加载事件、时间写入 API、日志序号和同内容副本，确认当前时间无法解释真实事件顺序后输出。
    en: This strategy does not infer attack from an old or anomalous time alone. NJA-000113 compares multiple timestamp sets,
      create and load events, time-writing APIs, log sequence, and same-content replicas and emits after current time cannot
      explain the real event order.
