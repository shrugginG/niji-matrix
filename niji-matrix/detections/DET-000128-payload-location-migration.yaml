schema_version: 2.0.0
type: detection-strategy
id: DET-000128
name:
  zh: 载荷源位置—目标位置—消费连续性
  en: Payload Source Location–Destination Location–Consumption Continuity
summary:
  zh: 以内容身份连接载荷复制或移动、旧路径清理和新路径消费，识别位置迁移。
  en: Join payload copy or move, old-path cleanup, and new-path consumption by content identity to identify location migration.
description:
  paragraphs:
  - zh: 本策略不把安装或文件移动单独定性。NJA-000114 规范化源与目标内容摘要、文件身份、复制/移动/重命名、旧路径删除和新路径加载或配置引用；只有同一可疑内容切换消费位置且缺少批准安装谱系时输出。
    en: This strategy does not classify installation or file movement alone. NJA-000114 normalizes source and destination content
      digest, file identity, copy, move, rename, old-path deletion, and new-path load or configuration reference. It emits only
      when the same suspicious content switches consumption location without approved installation lineage.
