schema_version: 2.0.0
type: detection-strategy
id: DET-000129
name:
  zh: 工具配置写入—未来触发—代理结果谱系
  en: Utility Configuration Write–Future Trigger–Proxy Outcome Lineage
summary:
  zh: 连接受信工具配置写入、后续读取与连接或生命周期触发的命令结果。
  en: Join trusted-utility configuration write, later read, and command outcome triggered by a connection or lifecycle event.
description:
  paragraphs:
  - zh: 本策略不把 ProxyCommand 或 LocalCommand 字符串单独定性。NJA-000115 保存配置写入者、版本和作用域，并在后来工具运行时解析有效配置、会话和 helper 结果；只有未批准配置实际触发恶意动作时输出。
    en: This strategy does not classify a ProxyCommand or LocalCommand string alone. NJA-000115 preserves configuration writer,
      version, and scope and, during a later utility run, parses effective configuration, session, and helper outcome. It emits
      only when unauthorized configuration actually triggers a malicious action.
