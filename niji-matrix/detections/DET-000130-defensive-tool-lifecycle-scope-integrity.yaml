schema_version: "2.0.0"
type: detection-strategy
id: DET-000130
name:
  zh: 防御工具生命周期与防护范围完整性
  en: Defensive-Tool Lifecycle and Protection-Scope Integrity
summary:
  zh: 关联工具组件状态、集中报到、策略范围和受保护对象结果，识别整体停用与选择性覆盖收缩。
  en: Correlate tool-component state, centralized check-in, policy scope, and protected-object outcomes to identify whole-capability disablement and selective coverage contraction.
description:
  paragraphs:
    - zh: 本策略不以单条进程终止或配置变化直接定案，而是要求恢复“谁改变了哪个防御组件或范围、集中管理面随后看到什么、实际对象是否仍被检查或阻断”的链路。NJA-000130 面向进程、服务、驱动、代理、更新功能与心跳连续性，NJA-000131 面向排除项、规则、提供程序、事件类别和目标范围的版本差分及其首个受影响结果。
      en: This strategy does not treat one process termination or configuration change as a verdict. It reconstructs who changed which defensive component or scope, what the centralized management plane observed afterward, and whether real objects continued to be inspected or blocked. NJA-000130 covers process, service, driver, agent, update-function, and heartbeat continuity; NJA-000131 covers versioned differences in exclusions, rules, providers, event classes, and target scope plus the first affected outcome.
    - zh: 只有攻击者控制证据、能力变化和结果缺口相互闭合时才确认防御削弱。批准的升级、产品迁移、故障修复、兼容性排除和安全响应调优保留为可审计替代解释；管理员身份、工具名或“无告警”均不能单独替代因果链。
      en: Defensive impairment is confirmed only when adversary-control evidence, capability change, and an outcome gap close the same chain. Approved upgrades, product migration, failure repair, compatibility exclusions, and incident-response tuning remain auditable alternative explanations. Administrator identity, product name, and absence of alerts cannot independently replace causality.
