schema_version: "2.0.0"
type: detection-strategy
id: DET-000131
name:
  zh: 遥测完整性与防御健康状态差分
  en: Telemetry Integrity and Defensive Health-State Differential
summary:
  zh: 用独立活动与真实组件结果挑战遥测缺口和工具健康声明，识别入库前抑制与伪造反馈。
  en: Challenge telemetry gaps and tool-health claims with independent activity and real component outcomes to identify pre-storage suppression and forged feedback.
description:
  paragraphs:
    - zh: 本策略把“没有事件”和“界面显示正常”都视为待验证声明。NJA-000132 从独立资产活动建立预期事件，跟踪生成、队列、转发、摄取和持久存储阶段，以识别事件从未入库的选择性或突发缺口；NJA-000133 将 UI、管理 API、进度、版本和成功状态与服务、签名文件、已安装版本及功能性 canary 结果比较。
      en: This strategy treats both no event and a healthy interface as claims requiring verification. NJA-000132 derives expected events from independent asset activity and tracks generation, queueing, forwarding, ingestion, and durable-storage stages to identify selective or abrupt gaps before storage. NJA-000133 compares UI, management API, progress, version, and success state with service state, signed files, installed versions, and functional canary outcomes.
    - zh: 缺少独立活动或真实结果时，策略只能输出完整性未知，不能把缺失数据本身升级为攻击。时间同步、管线维护、缓存延迟、合法策略变化和滚动升级必须显式保留；若同一管理面同时提供健康声明和验证证据，则二者不构成独立确认。
      en: Without independent activity or real outcomes, the strategy can report only integrity unknown and cannot upgrade missing data itself to an attack. Time skew, pipeline maintenance, caching delay, legitimate policy change, and rolling upgrade remain explicit alternatives. A health claim and its validation evidence from the same management authority do not constitute independent confirmation.
detects_refs: [NJT-0123, NJS-0123-003, NJS-0123-004]
