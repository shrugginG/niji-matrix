schema_version: "2.0.0"
type: detection-strategy
id: DET-000132
name: {zh: 防火墙有效策略—可达性差分, en: Effective Firewall Policy–Reachability Differential}
summary: {zh: 把广域姿态与精确规则变化连接到实际放行的会话，确认原应拒绝的路径何时变为可达。, en: Join broad posture and scoped-rule changes to real admitted sessions to establish when a path expected to be denied became reachable.}
description:
  paragraphs:
    - zh: 本策略把防火墙管理命令和审计事件当作候选线索，关键判定是有效策略而不是配置文本。NJA-000134 比较 profile、默认动作和宽范围规则前后态及整体拒绝量，适合广域停用；NJA-000135 展开单条规则的来源、目标、协议、端口和生效寿命，并要求至少一个命中会话与先前拒绝基线形成差分。
      en: This strategy treats firewall commands and audit events as candidate clues while judging effective policy rather than configuration text. NJA-000134 compares profile, default action, broad rule state, and aggregate deny volume for broad disablement. NJA-000135 expands one rule into source, destination, protocol, port, and effective lifetime and requires at least one matching session to differ from a prior deny baseline.
    - zh: 两个分析都需要连接写入主体、资源绑定、批准变更和真实 flow；仅有管理员执行、规则新增或端口开放不构成攻击结论。云安全组、网络设备 ACL 与主机防火墙可以映射到相同观察问题，但采集字段和先后顺序按产品分别实现。
      en: Both analytics join the writer, resource attachment, approved change, and real flow. Administrator execution, a new rule, or an open port alone does not establish an attack. Cloud security groups, network-device ACLs, and host firewalls map to the same observation question, but collection fields and precedence must be implemented per product.
detects_refs: [NJT-0124, NJS-0124-001, NJS-0124-002]
