schema_version: "2.0.0"
type: detection-strategy
id: DET-000133
name: {zh: 防火墙重定向—真实接收者谱系, en: Firewall Redirect–Real Receiver Lineage}
summary: {zh: 连接表面入口、NAT/REDIRECT 规则、重写后目的地与接收进程，识别借常用端口隐藏的后门路径。, en: "Join apparent entry, NAT or REDIRECT rule, rewritten destination, and receiving process to reveal backdoor paths concealed behind common ports."}
description:
  paragraphs:
    - zh: 本策略关注防守方看到的目的地与实际接收者是否被攻击者控制的过滤策略分离，而不是把所有 NAT 当作恶意。NJA-000136 从 PREROUTING 或等效网络策略取得规则版本、来源选择器、转换前后五元组与接收进程，再把命中会话与批准的负载均衡、代理和服务映射对照。只有重定向生效且到达非批准监听者时才提高结论强度。
      en: This strategy asks whether an adversary-controlled filtering policy separates the destination defenders see from the actual receiver rather than treating all NAT as malicious. NJA-000136 joins PREROUTING or equivalent network policy version, source selector, pre- and post-translation five-tuples, and receiving process, then compares the matched session with approved load-balancer, proxy, and service mappings. Confidence rises only when redirection takes effect and reaches an unapproved listener.
detects_refs: [NJT-0124, NJS-0124-003]
domains: [enterprise]
analytic_refs: [NJA-000136]
evidence_refs: [REF-000453, REF-000155]
