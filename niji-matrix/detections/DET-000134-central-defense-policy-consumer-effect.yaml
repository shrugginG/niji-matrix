schema_version: "2.0.0"
type: detection-strategy
id: DET-000134
name: {zh: 集中防御策略版本—消费者效果关联, en: Central Defensive-Policy Version–Consumer Effect Correlation}
summary: {zh: 将域或租户安全策略写入与目标实际采用、篡改保护结果及防御功能变化连接。, en: "Join domain or tenant security-policy writes to target adoption, tamper-protection outcome, and actual defensive-function change."}
description:
  paragraphs:
    - zh: 本策略不把 GPO 创建、目录 5136 或管理 API 成功当作完成的防御削弱，而是追踪同一安全策略版本从 writer、AD/SYSVOL 或租户控制面、link/scope、复制到目标设备或服务的消费，再看该目标的实时保护、审计或响应能力是否实际下降。NJA-000137 分别保留 mutation、adopted_but_blocked 和 effective_impairment 结果，避免把 Microsoft 2026 被阻断的案例误写为成功失防。
      en: This strategy does not treat GPO creation, directory event 5136, or a successful management API call as completed defensive impairment. It tracks the same security-policy version from writer through AD and SYSVOL or tenant control plane, link and scope, replication, and target device or service consumption, then tests whether real-time protection, audit, or response capability actually declines. NJA-000137 preserves separate mutation, adopted_but_blocked, and effective_impairment outcomes so the blocked Microsoft 2026 case is not misreported as successful protection loss.
detects_refs: [NJT-0125]
domains: [enterprise]
analytic_refs: [NJA-000137]
evidence_refs: [REF-000338, REF-000341, REF-000342, REF-000344, REF-000450]
