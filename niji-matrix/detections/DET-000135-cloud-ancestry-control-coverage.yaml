schema_version: "2.0.0"
type: detection-strategy
id: DET-000135
name: {zh: 云层级祖先—防御覆盖差分, en: Cloud Ancestry–Defensive Coverage Differential}
summary: {zh: 将云节点创建或迁离与继承 guardrail、集中日志注册和首个资源活动连接，识别真实覆盖位移。, en: "Join cloud-node creation or departure to inherited guardrails, central-log enrollment, and first resource activity to identify real coverage displacement."}
description:
  paragraphs:
    - zh: 本策略不把 CreateAccount、LeaveOrganization 或移动项目的 API 调用本身视为成功规避。NJA-000138 对同一既有账户或项目比较迁移前后 ancestry、组织 trail、继承策略与活动连续性；NJA-000139 对新节点连接创建、治理注册、集中日志启用和首个工作负载动作。两者必须证明至少一种预期防御控制在行动时缺席，否则仅为层级治理异常。
      en: This strategy does not treat CreateAccount, LeaveOrganization, or project-move APIs alone as completed evasion. NJA-000138 compares ancestry, organization trail, inherited policy, and activity continuity before and after movement for the same existing account or project. NJA-000139 joins new-node creation, governance enrollment, central logging, and first workload action. Each must establish that at least one expected defensive control was absent at action time; otherwise the result is a hierarchy-governance anomaly only.
detects_refs: [NJT-0126, NJS-0126-001, NJS-0126-002]
domains: [enterprise]
analytic_refs: [NJA-000138, NJA-000139]
evidence_refs: [REF-000456, REF-000457, REF-000458, REF-000459, REF-000460, REF-000461]
