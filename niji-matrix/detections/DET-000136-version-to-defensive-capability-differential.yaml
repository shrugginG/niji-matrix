schema_version: "2.0.0"
type: detection-strategy
id: DET-000136
name: {zh: 运行版本—有效防御能力差分, en: Running-Version to Effective-Defense Differential}
summary: {zh: 将实际运行或加载的旧组件版本与批准基线、预期遥测或启动保护结果关联。, en: Join the version actually executed or loaded to an approved baseline and the expected telemetry or boot-protection outcome.}
description:
  paragraphs:
    - zh: 本策略追踪组件真正进入执行或启动链，而不把旧包存在、更新请求或管理界面的“已更新”视为防御损伤。NJA-000140 比较脚本进程的真实引擎版本、审计策略和应当存在的脚本块事件；NJA-000141 比较启动测量、撤销状态、加载组件与 VBS/内核保护功能。两种分析共用“版本—消费—能力”框架，但数据平面和恢复动作不同，结果分别保留 attempted、loaded_without_loss 与 effective_regression。
      en: This strategy follows a component into actual execution or the boot chain rather than treating an old package's presence, an update request, or a console's up-to-date label as defensive damage. NJA-000140 compares the real script-engine version, audit policy, and expected script-block events; NJA-000141 compares boot measurements, revocation state, loaded components, and VBS or kernel-protection function. Both use a version-to-consumption-to-capability frame, but their data planes and recovery differ. Results preserve attempted, loaded_without_loss, and effective_regression separately.
detects_refs: [NJT-0127, NJS-0127-001, NJS-0127-002]
domains: [enterprise]
analytic_refs: [NJA-000140, NJA-000141]
evidence_refs: [REF-000462, REF-000463, REF-000464, REF-000465, REF-000198]
