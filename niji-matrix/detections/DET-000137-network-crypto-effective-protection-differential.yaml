schema_version: "2.0.0"
type: detection-strategy
id: DET-000137
name: {zh: 网络加密状态—有效保护差分, en: Network Crypto State to Effective-Protection Differential}
summary: {zh: 将设备加密配置或运行映像变化与真实会话参数和受控密钥交换结果关联。, en: Join device cryptographic configuration or running-image change to real session parameters and controlled key-exchange results.}
description:
  paragraphs:
    - zh: 本策略以通信保护效果而不是配置命令为目标。NJA-000142 同时读取设备控制面配置、运行映像完整性与会话握手；当表面仍是密文而派生密钥材料可能被修改时，再用受控端点或原厂取证验证密钥交换实现。硬件加速关闭、旧映像加载或吞吐量下降仅输出变更线索，只有算法、密钥材料强度或完整性保护的实际下降才输出 confirmed_weakening。
      en: This strategy targets the communication-protection result rather than a configuration command. NJA-000142 reads device control-plane configuration, running-image integrity, and session handshakes together. When traffic still looks encrypted but derived keying material may have been altered, a controlled endpoint or vendor forensics validates the key-exchange implementation. Hardware-acceleration disablement, an old image load, or throughput decline produces a change lead only; confirmed_weakening requires actual loss in algorithm, keying-material strength, or integrity protection.
detects_refs: [NJT-0128]
domains: [enterprise]
analytic_refs: [NJA-000142]
evidence_refs: [REF-000466, REF-000467, REF-000468]
