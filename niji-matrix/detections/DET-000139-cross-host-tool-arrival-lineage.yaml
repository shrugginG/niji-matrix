schema_version: "2.0.0"
type: detection-strategy
id: DET-000139
name: {zh: 跨主机工具到达谱系关联, en: "Cross-Host Tool Arrival Lineage"}
summary: {zh: 将共享请求、实际文件创建和批准分发范围连接为载荷到达图，识别异常内部投递与多目标扩散。, en: "Join share requests, confirmed file creation, and approved distribution scope into an arrival graph that reveals abnormal internal delivery and multi-target spread."}
description:
  paragraphs:
    - zh: 本策略检测攻击者借正常内部传输关系把工具放到另一主机时，来源角色、目标集合和内容谱系之间出现的差分。NJA-000143 将共享层写入请求与目标文件实际创建分开验证，再把相同内容在多个目标上的到达连接为一次分发；它不把单条 5145 或一个可执行文件名直接判为攻击。
      en: This strategy detects differences among source role, destination set, and content lineage when an adversary uses an ordinary internal transfer relationship to place a tool on another host. NJA-000143 verifies share-level write requests separately from actual destination file creation, then connects arrival of equivalent content across targets into one delivery. Neither one 5145 event nor an executable filename alone establishes attack.
    - zh: 目标是 T1570 独立的文件到达，不以远程会话成功或后来启动进程为必要条件。输出应显示源主机、共享服务器或目标、账户、文件摘要、批准发布记录和缺失遥测；若传输由企业部署 job 管理，则应回到 T1072 的 operator→job→agent 分析链。
      en: The target is T1570 file arrival, without requiring remote-session success or later process launch. Output should expose source host, share server or destination, account, file digest, approved release record, and missing telemetry. If an enterprise deployment job controls the transfer, use T1072's operator-to-job-to-agent analysis instead.
detects_refs: [NJT-0130]
domains: [enterprise]
analytic_refs: [NJA-000143]
evidence_refs: [REF-000472, REF-000473, REF-000474, REF-000475, REF-000377, REF-000379]
