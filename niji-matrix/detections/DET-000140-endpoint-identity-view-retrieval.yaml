schema_version: 2.0.0
type: detection-strategy
id: DET-000140
name:
  zh: 端点既存身份视图异常读取
  en: Anomalous Retrieval of Endpoint-Held Identity Views
summary:
  zh: 把地址簿或既存身份副本的读取同进程、暂存和传输谱系关联，弥补只观察目录查询的盲区。
  en: Correlate reads of address books or existing identity copies with process, staging, and transfer lineage to cover the
    blind spot of directory-query-only monitoring.
description:
  paragraphs:
  - zh: 本策略面向已访问端点上可供再次读取的身份视图。NJA-000145 先以经过配置的对象访问和进程记录识别不符合该用户惯常客户端谱系的身份材料读取，再与短时暂存或外传关联；目录侧“没有查询”只能作为观察面边界，不能单独构成恶意判定。
    en: This strategy concerns identity views already available for rereading on accessed endpoints. NJA-000145 uses configured
      object-access and process telemetry to find reads outside the user’s normal client lineage, then joins short-horizon
      staging or transfer. An absent directory query only defines an observation boundary and cannot by itself establish maliciousness.
