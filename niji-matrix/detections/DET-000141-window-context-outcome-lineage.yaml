schema_version: 2.0.0
type: detection-strategy
id: DET-000141
name:
  zh: 窗口上下文与后继活动谱系关联
  en: Window-Context and Follow-On Activity Lineage
summary:
  zh: 将异常窗口状态读取与匹配情境后出现的网络或收集结果关联，识别窗口条件门控。
  en: Join unexpected window-state reads with network or collection outcomes that emerge after a matching context to identify
    window-conditioned gating.
description:
  paragraphs:
  - zh: 本策略只在能取得经验证的 GUI 读取遥测和交互会话状态时判定窗口门控。NJA-000146 比较同一主体在目标窗口出现前后的后继活动，结合进程来源和批准的辅助功能工作流评估；若只有进程和网络日志，输出只能描述后继活动，不能声称观察到了窗口查询。
    en: The strategy establishes window gating only where verified GUI-read telemetry and interactive-session state are available.
      NJA-000146 compares follow-on activity for the same actor before and after a target window appears, with process provenance
      and approved accessibility workflows as context. Process and network logs alone can describe follow-on activity but
      cannot establish that a window query was observed.
