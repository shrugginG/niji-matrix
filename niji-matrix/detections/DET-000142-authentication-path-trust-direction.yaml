schema_version: 2.0.0
type: detection-strategy
id: DET-000142
name:
  zh: 认证路径信任指向差分
  en: Authentication-Path Trust-Direction Differential
summary:
  zh: 将终端接受的网络权威与批准清单、同网段对照及随后的认证目的地连接，区分路径替换与普通网络变更。
  en: Join the network authority accepted by a client to approved inventory, segment peers, and subsequent authentication destinations to distinguish
    path substitution from routine network change.
description:
  paragraphs:
  - zh: 本策略从终端真正采用的 DHCP、DNS 或邻居指向出发，比较同段未受影响终端及批准变更，再追踪被改变路径上是否发生认证。NJA-000147 保留仅有配置异常、路径异常后有认证、以及认证结果可证实三种层级；短租期或少量主机受影响只是分析优先级，不单独证明攻击者意图。
    en: This strategy starts from DHCP, DNS, or neighbor direction actually accepted by the endpoint, compares unaffected peers and approved changes,
      and follows whether authentication occurs on the altered path. NJA-000147 preserves configuration-only, path-with-authentication, and outcome-confirmed
      levels. A short lease or few affected hosts raises analytic priority but does not alone prove adversary intent.
