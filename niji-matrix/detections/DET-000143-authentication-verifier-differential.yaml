schema_version: 2.0.0
type: detection-strategy
id: DET-000143
name:
  zh: 原始目的地与认证验证者差分
  en: Intended-Destination-to-Authentication-Verifier Differential
summary:
  zh: 将终端原始认证目的地与真正接受证明的 SMB 或 LDAP 服务连接，辨认跨目标中继及保护拒绝。
  en: Join the endpoint's intended authentication destination to the SMB or LDAP service that actually accepted the proof, distinguishing cross-destination
    relay from protection rejection.
description:
  paragraphs:
  - zh: 本策略要求同时保留客户端所请求的资源、首个接收节点、域控 NTLM 线索、目标认证结果及签名或通道绑定裁决。NJA-000148 先查未经批准的受众差和中间来源，再把绑定失败、目标成功与后继访问分列；单侧 8004 或单次拒绝只给异常来源或受阻结果。
    en: This strategy retains the client's requested resource, first receiver, domain-controller NTLM clues, target authentication outcome, and
      signing or channel-binding decision. NJA-000148 first finds an unapproved audience difference and intermediary source, then separates binding
      rejection, target success, and subsequent resource use. One-sided event 8004 or one rejection only supports an anomalous source or blocked
      outcome.
