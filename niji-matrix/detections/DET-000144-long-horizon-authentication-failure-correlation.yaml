schema_version: 2.0.0
type: detection-strategy
id: DET-000144
name:
  zh: 长窗口认证失败关联
  en: Long-Horizon Authentication Failure Correlation
summary:
  zh: 在真实验证器中重建低频与分布式候选验证序列，并区分失败、主秘密匹配、MFA 阻断和资源访问。
  en: Reconstruct low-rate and distributed candidate-testing sequences at the actual verifier, separating failure, primary-secret match, MFA denial,
    and resource access.
description:
  paragraphs:
  - zh: 本策略覆盖在线验证的两种独立观察差：NJA-000149 以稳定身份和长窗口重建被稀释的失败，NJA-000150 以账户、来源和应用构图连接低局部计数的分布式活动。两项都以实际完成密码判断的 IdP 日志为准，不能把前端代理日志的缺口或同口令推断升格为已证实喷洒。
    en: This strategy covers two separate online observation differences. NJA-000149 reconstructs diluted failures by stable principal over a
      long horizon; NJA-000150 links low-local-count distributed activity through an account, source, and application graph. Both use logs from
      the IdP that actually validates the password and do not turn front-end logging gaps or same-password inference into proven spraying.
