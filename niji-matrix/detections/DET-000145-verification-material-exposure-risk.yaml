schema_version: 2.0.0
type: detection-strategy
id: DET-000145
name:
  zh: 验证材料暴露与后继身份风险
  en: Verification-Material Exposure and Subsequent Identity Risk
summary:
  zh: 将可离线验证材料的异常取用与受影响身份的后继认证连接，同时明确外部候选计算不可由目标服务直接观察。
  en: Link abnormal access to material usable for offline verification with later authentication of affected identities, while explicitly recognizing
    that external candidate computation is invisible to the target service.
description:
  paragraphs:
  - zh: 本策略不以服务端没有失败事件证明破解发生。NJA-000151 从域数据库或凭据库存储审计建立材料、账号与导出链，再跟踪暴露后的首次认证和重置状态。结果区分材料暴露、可见计算、疑似后继使用和证实的认证结果；攻击者在不受监控设备上计算时只能报告风险，而不是破解成功。
    en: This strategy does not infer cracking merely from absent server failures. NJA-000151 builds material, account, and export lineage from
      domain-database or credential-store audit and follows first authentication and reset state after exposure. Results distinguish exposed material,
      visible computation, possible later use, and confirmed authentication outcomes. Computation on an unmonitored adversary device can only
      be reported as risk, not successful cracking.
