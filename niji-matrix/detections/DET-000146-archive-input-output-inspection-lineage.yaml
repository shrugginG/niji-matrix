schema_version: 2.0.0
type: detection-strategy
id: DET-000146
name:
  zh: 归档输入—产物—出口与可检查性关联
  en: Archive Input–Output–Egress and Inspectability Correlation
summary:
  zh: 关联敏感源读取、归档产物的可解析状态与后续取用，并识别没有独立工具进程的封装路径。
  en: Join sensitive source reads, archive inspectability, and downstream use, including packaging without a separate utility
    process.
description:
  paragraphs:
  - zh: 策略要求证明已取得数据被转成归档容器或编码流，再区分内容因缺密钥不可检查和转换发生在既有进程内两种观察缺口。NJA-000152 以解析状态、源敏感性及出口对象关联评估受保护归档；NJA-000153 以同一进程的读取、输出和网络行为重建进程内路径。两个分析都不能仅凭文件后缀、缺失工具进程或高熵确认恶意。
    en: The strategy first establishes transformation of acquired data into an archive or encoded stream, then distinguishes
      keyless content inspection from in-process conversion. NJA-000152 joins parse state, source sensitivity, and outbound
      object; NJA-000153 reconstructs the same process's reads, output, and network behavior. Neither confirms malice from
      an extension, missing utility process, or high entropy alone.
