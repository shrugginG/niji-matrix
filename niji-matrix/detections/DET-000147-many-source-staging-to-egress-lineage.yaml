schema_version: 2.0.0
type: detection-strategy
id: DET-000147
name:
  zh: 多源暂存—单点外联谱系重建
  en: Many-Source Staging to Single-Egress Lineage
summary:
  zh: 重建敏感数据从多个来源汇入被控节点再由少数出口取走的路径。
  en: Reconstruct paths in which sensitive data from multiple origins converges on a controlled node and leaves through few
    egress points.
description:
  paragraphs:
  - zh: 策略以来源主机、共享写入、暂存节点文件创建和后继取用为事实链。NJA-000154 将 SMB 权限检查与实际文件创建及 Web 取回分开验证，输出多源入站和单点外联的图形。仅有中央服务器、归档文件或一个外联连接不足以确认异常暂存；应先核对批准的备份、迁移和
      ETL 作业。
    en: The strategy traces source hosts, share writes, creation at the staging node, and later retrieval. NJA-000154 verifies
      SMB access checks separately from actual file creation and web retrieval, then emits a many-source ingress and concentrated-egress
      graph. A central server, archive, or single outbound connection alone is insufficient; approved backup, migration, and
      ETL jobs must be checked first.
