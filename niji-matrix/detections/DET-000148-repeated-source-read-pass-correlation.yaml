schema_version: 2.0.0
type: detection-strategy
id: DET-000148
name:
  zh: 自动收集轮次与敏感源读取关联
  en: Automated Collection Pass and Sensitive-Source Read Correlation
summary:
  zh: 跨轮次关联文件或云对象读取，区分增量选择、正常同步与异常自动获取。
  en: Correlate file or cloud-object reads across passes to distinguish incremental selection, normal synchronization, and
    anomalous automated acquisition.
description:
  paragraphs:
  - zh: 策略针对获取阶段的源读取，不把归档、暂存或外传当作自动收集的定义。NJA-000155 在已启用敏感文件读取审计的 Windows 主机上重建首轮及后续变化文件读取；NJA-000156 在显式开启 S3 对象数据事件的桶上识别重复
      GetObject。云端分析只覆盖父技术的自动获取模式，不把尚无案例支持的云端增量行为升级为正式子项证据。
    en: The strategy targets source reads during acquisition; archiving, staging, and exfiltration do not define automated
      collection. NJA-000155 reconstructs initial and later changed-file reads on Windows hosts with sensitive-file read auditing.
      NJA-000156 finds repeated GetObject calls in S3 buckets with object data events explicitly enabled. The cloud analytic
      covers parent-level automation and does not promote cloud incremental behavior to a formal child without case evidence.
