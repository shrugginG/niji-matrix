schema_version: 2.0.0
type: detection-strategy
id: DET-000149
name:
  zh: 浏览器保留上下文读取谱系
  en: Retained Browser-Context Read Lineage
summary:
  zh: 把异常浏览历史或书签读取与调用进程和后继结果关联，恢复不产生新导航的发现环节。
  en: Join unusual history or bookmark reads with the calling process and later outcomes to recover discovery that creates
    no fresh navigation.
description:
  paragraphs:
  - zh: 本策略面向受管终端的浏览器用户配置读取，而不是网页访问量异常。NJA-000157 先验证目标配置路径的文件读审计，按用户与进程谱系识别非惯常读者，再查看同源的暂存或传输；没有后继结果的异常读仍可作为低优先级发现线索，不能把代理没有新
      URL 当作恶意证据。
    en: This strategy concerns reads of browser user profiles on managed endpoints rather than unusual web-visit volume. NJA-000157
      first validates read auditing on relevant profile paths, identifies unusual readers by user and process lineage, and
      then checks same-lineage staging or transfer. An unusual read without a later outcome can remain a lower-priority discovery
      lead; no fresh proxy URL is not evidence of maliciousness.
