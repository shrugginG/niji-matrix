schema_version: 2.0.0
type: detection-strategy
id: DET-000150
name:
  zh: IaaS 资源图读取与后继操作关联
  en: IaaS Resource-Graph Read and Successor Correlation
summary:
  zh: 跨资源服务重构异常只读盘点，并将其与同一身份的后继高风险操作关联。
  en: Reconstruct unusual read-only inventory across resource services and join it to later high-risk operations by the same
    identity.
description:
  paragraphs:
  - zh: 本策略以已启用的 AWS CloudTrail 管理读事件为主要实现，关注同一身份在 EC2、RDS、S3 桶等资源面形成的查询图。NJA-000158 比对授权 CSPM/IaC 作业与历史主体基线，将首次来源、多服务读取及后续安全组或实例变化合并评分；一次正常的
      Describe 或分页请求不能独自构成恶意判定。
    en: This strategy primarily uses enabled AWS CloudTrail management-read events to examine one identity’s query graph across
      EC2, RDS, and S3 bucket resources. NJA-000158 compares approved CSPM or IaC jobs and historical principal baselines,
      combining a new origin, multi-service reads, and later security-group or instance changes. One ordinary Describe or
      paginated request cannot establish maliciousness alone.
