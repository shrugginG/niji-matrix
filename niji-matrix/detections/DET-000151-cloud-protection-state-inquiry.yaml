schema_version: 2.0.0
type: detection-strategy
id: DET-000151
name:
  zh: 云防护与服务状态异常查询
  en: Anomalous Cloud Protection and Service-State Inquiry
summary:
  zh: 识别非常用主体对安全或日志服务启用状态的系统性读取，并检验后续控制变化。
  en: Identify systematic reads of security or logging service state by an unusual principal and examine later control changes.
description:
  paragraphs:
  - zh: 本策略的可实施分支先限定 AWS GuardDuty：NJA-000159 将 ListDetectors 与 GetDetector 的服务状态查询和正常安全运营的健康检查区别开，再关联同身份后继控制变化。GCP Service
      Usage ListServices 被官方列为不产生日志，不能把 AWS 规则照搬到该接口；缺少经验证的独立网络或代理遥测时，该分支明确是检测盲区。
    en: The implementable branch is initially limited to AWS GuardDuty. NJA-000159 separates ListDetectors and GetDetector
      state inquiries from approved security-operations health checks and joins later control changes by the same identity.
      Google Service Usage ListServices is officially listed as producing no audit log, so the AWS rule cannot be copied to
      it; without verified independent network or proxy telemetry, that branch is an explicit detection blind spot.
