schema_version: 2.0.0
type: detection-strategy
id: DET-000152
name:
  zh: 云存储对象清单读取与后继访问关联
  en: Cloud Object-Listing and Follow-On Access Correlation
summary:
  zh: 按容器、身份与时间关联对象列表请求，并与下载或异常目标选择区分。
  en: Correlate object-list requests by container, identity, and time while distinguishing them from downloads and target
    selection.
description:
  paragraphs:
  - zh: 本策略聚焦已知桶内部的键/前缀列举，不把 ListBuckets 或单纯 GetObject 当成发现。NJA-000160 对 AWS S3 的已启用对象数据事件中可验证的 ListObjects 与 S3 server access
      log 中的桶列表请求分别解析，结合批准备份/索引作业和后继对象读取；普通桶 ListObjectsV2 的 CloudTrail 覆盖必须在部署中实测，不能从当前资源类型表直接推断。
    en: This strategy focuses on keys and prefixes inside a known bucket rather than treating ListBuckets or a lone GetObject
      as discovery. NJA-000160 parses verified ListObjects in enabled S3 object-data events and bucket-list requests in S3
      server access logs separately, joining approved backup or indexing jobs and later object reads. CloudTrail coverage
      for ordinary-bucket ListObjectsV2 requires deployment testing and cannot be inferred directly from the current resource-type
      table.
