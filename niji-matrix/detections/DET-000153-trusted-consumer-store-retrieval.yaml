schema_version: 2.0.0
type: detection-strategy
id: DET-000153
name:
  zh: 受信消费者保管库取用差分
  en: Trusted-Consumer Vault Retrieval Differential
summary:
  zh: 连接受信应用或工作负载的控制权变化、秘密内容返回与异常输出来源。
  en: Join changes to trusted app or workload control with secret-content return and abnormal output origins.
description:
  paragraphs:
  - zh: 本策略追踪保管库允许的消费身份是否被攻击者改变了控制者或用途。NJA-000161 将本机密码管理器配置、插件或可执行文件的未批准改动与后继导出工件、受控内容核验及外联连接；NJA-000162 将云库内容读取 API 与工作负载应取的具体 secret、来源和版本对照。两项都保留“权限或配置准备”“秘密返回”和“后继保留/使用”层级，不能把成功调用直接写成全部链条。
    en: This strategy asks whether an allowed vault consumer changed controller or purpose. NJA-000161 joins unauthorized local manager configuration,
      plugin, or executable changes to later export artifacts, controlled content verification, and egress. NJA-000162 compares cloud content-read
      APIs with the exact secrets, origins, and versions expected for a workload. Both preserve preparation, secret return, and later retention
      or use as separate levels; an API success does not complete the whole chain.
