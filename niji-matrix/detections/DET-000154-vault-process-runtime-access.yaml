schema_version: 2.0.0
type: detection-strategy
id: DET-000154
name:
  zh: 保管进程运行态访问与秘密结果
  en: Vault-Process Runtime Access and Secret Outcome
summary:
  zh: 关联非批准高权进程访问、转储输出与可证实的保管秘密结果。
  en: Correlate unauthorized high-rights process access, dump output, and evidenced vault-secret outcome.
description:
  paragraphs:
  - zh: 本策略只观察处理保管秘密的应用或服务进程，区别于对 LSASS、SAM 或 NTDS 的系统认证材料转储。NJA-000163 先识别异常的高权句柄、调试或任务端口，再寻找同源转储文件、外联或已验证的秘密结果。进程打开是受损机会，转储是材料暴露，只有恢复的密钥或明文以及后继证据才能提高完成度；Keydnap
      的旧版 macOS 路径不能移植为现代系统字段保证。
    en: This strategy observes applications or services that handle vault secrets, separate from LSASS, SAM, or NTDS dumping. NJA-000163 first
      identifies abnormal high-rights handles, debugger access, or task ports and then seeks a same-source dump, egress, or verified secret result.
      A process open is opportunity; a dump is exposure; recovered keys or plaintext and subsequent evidence raise completion confidence. Keydnap's
      legacy macOS path is not a field guarantee for modern systems.
