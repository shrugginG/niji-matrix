schema_version: 2.0.0
type: detection-strategy
id: DET-000155
name:
  zh: 内容路径与受信终止差分
  en: Content-Path and Trusted-Termination Differential
summary:
  zh: 比较端点所见证书、路径与独立源站，分级识别内容流介入及可读终止。
  en: Compare endpoint certificates and paths to an independent origin, grading content-flow intervention and readable termination.
description:
  paragraphs:
  - zh: NJA-000164 在受控探测中比较同域不同出口是否出现选择性证书替换；NJA-000165 再把客户端信任根与源站上游握手连接。策略明确分开路径异常、可解密终止和真实内容取得，不把证书差异单独当作已窃内容；企业检查代理须先按批准清单排除。
    en: NJA-000164 compares a domain across egress paths for selective certificate replacement under controlled probes. NJA-000165
      joins the client's trust root to an origin upstream handshake. The strategy separates path anomaly, decryptable termination,
      and actual content acquisition; a certificate difference alone is not stolen content, and approved enterprise inspection
      is excluded first.
