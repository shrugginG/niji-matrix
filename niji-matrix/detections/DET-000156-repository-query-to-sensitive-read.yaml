schema_version: 2.0.0
type: detection-strategy
id: DET-000156
name:
  zh: 库内查询—敏感内容读取谱系
  en: Repository Query-to-Sensitive-Read Lineage
summary:
  zh: 把库内搜索或谓词与实际敏感对象读取连接，并保留无法闭合的查询为调查线索。
  en: Join repository searches or predicates to actual sensitive-object reads, leaving unclosed queries as leads.
description:
  paragraphs:
  - zh: NJA-000166 在 Microsoft 365 中检查查询与文件访问的身份、站点、对象和时间关系；NJA-000167 在 Confluence Full 审计中检查搜索词与附件下载。两项分析只在审计字段确实可用且成功读取有对象键时给出闭合链。合法
      eDiscovery、分类和内容维护可出现同型行为，短窗小量访问只提高复核优先级。
    en: NJA-000166 tests identity, site, object, and timing links between query and file access in Microsoft 365. NJA-000167
      tests terms and attachment downloads in Confluence Full audit. A closed chain requires actual audit fields and an object
      key for successful reads. Authorized eDiscovery, classification, and content maintenance can look similar; a small short-window
      count only changes review priority.
