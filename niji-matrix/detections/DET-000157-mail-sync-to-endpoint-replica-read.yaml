schema_version: 2.0.0
type: detection-strategy
id: DET-000157
name:
  zh: 邮件同步范围到端点副本读取谱系
  en: Mail Sync Scope to Endpoint Replica Read Lineage
summary:
  zh: 用端点副本读取与既有同步范围还原缺少本次服务器逐封访问的邮件取得。
  en: Use endpoint replica reads and prior sync scope to reconstruct mail acquisition without a current server per-item event.
description:
  paragraphs:
  - zh: NJA-000168 需要已启用的文件读取审计、稳定进程谱系和 MailItemsAccessed 同步上下文。它比较本次端点非预期读取与较早同步范围，并区分正常迁移或 eDiscovery；没有端点读取结果时，服务器缺少 Bind
      只能是观察缺口，不能判定恶意副本阅读。
    en: NJA-000168 requires enabled file-read audit, stable process lineage, and MailItemsAccessed sync context. It compares
      an unexpected current endpoint read with earlier sync scope and excludes migration or eDiscovery. Without an endpoint
      read outcome, an absent server Bind is an observation gap, not a malicious replica-read verdict.
