schema_version: 2.0.0
type: detection-strategy
id: DET-000158
name:
  zh: 邮件条件配置到投递副本谱系
  en: Mail Predicate Configuration to Delivery Copy Lineage
summary:
  zh: 证明条件规则对到达邮件产生了非批准副本，并定位实际接收目的地。
  en: Prove that a conditional rule made unapproved copies of arriving mail and identify the recipient.
description:
  paragraphs:
  - zh: NJA-000169 将规则版本、匹配谓词、消息 ID、转发报告或邮件流结果逐一关联。规则创建、规则启用、单封消息命中和目的地实际收取分别保留为不同结论层级；合规日记、迁移和受管转发应按具体规则与期限排除。
    en: NJA-000169 joins rule version, match predicate, message ID, and forwarding report or message-trace outcome. Rule creation,
      activation, a matching message, and actual destination receipt remain distinct conclusion levels. Compliance journaling,
      migration, and managed forwarding are excluded by specific rule and time-bounded authorization.
