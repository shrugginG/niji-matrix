schema_version: 2.0.0
type: detection-strategy
id: DET-000159
name:
  zh: 浏览器控制点与同页内容读取关联
  en: Browser Control to Co-Viewed Content Read Correlation
summary:
  zh: 将浏览器扩展或 Hook 控制变化接到用户当前页面的额外内容读取。
  en: Join extension or hook changes to extra content reads on the user's current page.
description:
  paragraphs:
  - zh: NJA-000170 连接扩展权限、浏览器进程变化、应用资源请求和额外外联。策略的直接结果是控制点与内容可读链，纯 Cookie 取得、输入按键截取或页面外观改变没有实际读取证据时留给相邻对象。批准扩展、无障碍插件与浏览器调试必须按身份和业务目的校准。
    en: NJA-000170 joins extension permission, browser-process changes, app resource requests, and extra egress. The direct
      result is a control point linked to content access. Cookie theft, keystroke capture, or page appearance change without
      a read belongs to adjacent objects. Approved extensions, accessibility plug-ins, and browser debugging require identity
      and business-purpose calibration.
