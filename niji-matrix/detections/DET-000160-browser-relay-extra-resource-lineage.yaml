schema_version: 2.0.0
type: detection-strategy
id: DET-000160
name:
  zh: 浏览器代理控制与额外站点读取关联
  en: Browser Relay Control to Extra Site Read Lineage
summary:
  zh: 把浏览器进程代理植入与用户未发起的同会话资源读取连接。
  en: Join browser-process proxy implantation to same-session resource reads not initiated by the user.
description:
  paragraphs:
  - zh: NJA-000171 要求浏览器写入或注入、独立控制链路及站点额外请求三者闭合；缺少应用资源结果时只能报代理暴露，不能报内容取得。旧 IE/WinINet 的作者演示提供技术能力，实际现代浏览器部署必须另做验证。合法远程支持和自动化测试应逐任务授权。
    en: NJA-000171 requires browser write or injection, a distinct control link, and extra site requests. Without a resource
      result it reports relay exposure, not acquired content. The author's old IE/WinINet demonstration establishes capability;
      modern browser deployments need separate verification. Legitimate remote support and automation tests require task-specific
      authorization.
