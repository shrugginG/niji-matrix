schema_version: 2.0.0
type: detection-strategy
id: DET-000161
name:
  zh: 会议进程麦克风会话与模块谱系
  en: Meeting-Process Microphone Session and Module Lineage
summary:
  zh: 将正常会议进程中的异常模块、音频设备会话和录音产物连接。
  en: Join anomalous modules, audio-device sessions, and recording output inside an ordinary meeting process.
description:
  paragraphs:
  - zh: NJA-000172 只在端点产品实际提供音频会话与模块事件时执行进程归因差分，随后要求同进程录音产物或对应输出。签名会议客户端并不免检；若只有麦克风指示、没有模块与结果，只能报待查。合法会议录音、转写与客服质检按具体插件和时段区分。
    en: NJA-000172 performs process-attribution differential only when endpoint products actually export audio-session and
      module events, then requires same-process audio output. A signed meeting client is not exempt. With only a microphone
      indicator and no module or result, report an investigation lead. Authorized meetings, transcription, and contact-center
      recording are distinguished by specific plug-in and interval.
