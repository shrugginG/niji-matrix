schema_version: 2.0.0
type: detection-strategy
id: DET-000162
name:
  zh: 通话接口授权与音频产物关联
  en: Call-Interface Grant to Audio-Outcome Correlation
summary:
  zh: 在实际导出接口审计的应用中，把第三方授权、通话和非批准录音产物连接。
  en: Where an app exports interface audit, join third-party grant, call, and unapproved audio output.
description:
  paragraphs:
  - zh: NJA-000173 为 T1123 父级处理 T9000 所示接口路径。它只在产品提供 requester、grant 和会话事件时关联后继音频产物；旧 Skype API 名称不迁移为现代通用字段。接口不同不构成第二个 Niji
      子项，授权提示或正常音频文件也不能单独证明恶意录制。
    en: NJA-000173 covers the T9000-style interface path at the T1123 parent. It joins later audio output only where a product
      supplies requester, grant, and call-session events; old Skype API names are not universal modern fields. Interface type
      does not create a second Niji child, and a grant prompt or ordinary audio file alone does not prove malicious recording.
