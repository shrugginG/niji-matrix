schema_version: 2.0.0
type: detection-strategy
id: DET-000163
name:
  zh: C2 消息语义与服务契约差分
  en: C2 Message Semantics and Service-Contract Differential
summary:
  zh: 关联消息的可见外层、真实解析结果和服务身份，识别被稀释或伪装的控制交换。
  en: Join visible message framing, recovered meaning, and service identity to identify diluted or disguised control
    exchanges.
description:
  paragraphs:
  - zh: 策略以实际 C2 会话而非孤立文件或高熵片段为单位。NJA-000174 保留原始帧和可选字段，验证真实消息长度、载体提取和命令后果；NJA-000175 比对产品出站服务契约、目的地主体、字段依赖和端点行为。两者分别处理内容可检查性与服务角色错认，内容不可见时只报告形态异常。
    en: The strategy uses an actual C2 conversation rather than an isolated file or high-entropy fragment. NJA-000174
      retains frames and optional fields to check true message length, carrier extraction, and command outcome;
      NJA-000175 compares the product's outbound service contract, destination owner, field dependencies, and endpoint
      behavior. They address content inspectability and misidentified service role separately, and report shape
      anomalies only when content is unavailable.
