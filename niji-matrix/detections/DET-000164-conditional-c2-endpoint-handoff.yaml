schema_version: 2.0.0
type: detection-strategy
id: DET-000164
name:
  zh: 备用 C2 端点迁移谱系
  en: Reserve C2 Endpoint Handoff Lineage
summary:
  zh: 连接首选端点失败、同一植入转向新端点和后续控制通信。
  en: Join preferred-endpoint failure, same-implant migration, and continued control communication.
description:
  paragraphs:
  - zh: 本策略要求旧路径失败、新路径被启用以及同一进程继续控制样式通信，不以多个 IP 或域名本身告警。NJA-000176 在端点进程身份上连接拒绝/超时、DNS 解析、后继连接与相似通信节律，再把合法更新器或灾备客户端的批准路径排除。若只有新目的地而缺少旧失败或后继控制，结果保持候选状态。
    en: The strategy requires an old-path failure, activation of a new path, and control-like communication continuing
      from the same process; multiple IPs or domains alone are not an alert. NJA-000176 joins denial or timeout,
      DNS resolution, successor connection, and comparable cadence by endpoint process identity, then checks approved
      updater or disaster-recovery paths. A new destination without old failure or follow-on control remains a candidate.
