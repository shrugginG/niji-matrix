schema_version: 2.0.0
type: detection-strategy
id: DET-000165
name:
  zh: 备用 C2 跨协议观察面切换
  en: Reserve C2 Cross-Protocol Observation Switch
summary:
  zh: 关联 Web 路径失败后同一植入的 DNS 控制序列，弥合代理与解析日志的断点。
  en: Join a failed web path to DNS control by the same implant, closing the gap between proxy and resolver logs.
description:
  paragraphs:
  - zh: 本策略专门处理原 Web 代理视野终止而 DNS 遥测开始承载同一控制活动的情况。NJA-000177 把 HTTP 失败、端点进程、DNS 查询与结果响应接入一个时间序列，并检验编码载荷、重复任务节律和后继结果。只有
      DNS 查询或 HTTP 错误时不确认备用 C2；必须排除受批准的应用发现、CDN 和解析恢复。
    en: This strategy addresses the case where the original web-proxy view ends and DNS telemetry begins to carry
      the same control activity. NJA-000177 joins failed HTTP, endpoint process, DNS queries and responses in one
      timeline, testing payload structure, repeated task cadence, and subsequent results. DNS queries or HTTP errors
      alone do not confirm reserve C2; approved service discovery, CDN, and resolver recovery must be excluded.
