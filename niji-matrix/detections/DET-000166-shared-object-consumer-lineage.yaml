schema_version: 2.0.0
type: detection-strategy
id: DET-000166
name:
  zh: 共享对象改写—异机消费结果关联
  en: Shared-Object Mutation to Cross-Host Consumer Outcome Lineage
summary:
  zh: 跨旧新版本、导航绑定与目标端执行结果识别恶意共享内容消费。
  en: Identify malicious shared-content consumption by joining old and new versions or navigation bindings to destination
    execution outcomes.
description:
  paragraphs:
  - zh: 本策略把共享对象的写入者、旧新版本或导航入口解析关系，与另一内部主机消费后的首次攻击者动作连接为同一事务。NJA-000178 处理原有对象内容或执行语义改变，要求版本差分、真实消费与结果三段；NJA-000179 处理目录入口被替身绑定，要求共享侧隐藏原件/创建替身与消费者点击后命令链相互验证。
    en: This strategy joins the writer of a shared object, its old and new version or navigation-entry resolution, and the
      first attacker action after another internal host consumes it. NJA-000178 handles changed content or execution semantics
      within an established object and requires version difference, real consumption, and outcome. NJA-000179 handles a substituted
      directory entry and requires share-side changes to the original and substitute plus the consumer's post-click command
      chain.
  - zh: 共享文件被写入或读取不自动证明横向成功；预览、同步和正常编辑都需作为替代解释。输出需分别标记污染候选与已确认异机结果，并保留写者、版本、内容摘要、导航目标、消费者设备和进程的联接证据。
    en: A write or read on a share does not automatically prove lateral success; previews, synchronization, and authorized
      editing remain alternative explanations. Output distinguishes a taint candidate from a confirmed cross-host outcome
      and preserves joins among writer, version, digest, navigation target, consumer device, and process.
