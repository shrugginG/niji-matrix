schema_version: 2.0.0
type: detection-strategy
id: DET-000167
name:
  zh: 可移动介质跨主机传播谱系
  en: Removable-Media Cross-Host Propagation Lineage
summary:
  zh: 以同一介质与载荷连接已控 A 的播种、不同 B 的接入和 B 上首次恶意动作。
  en: Join seeding on controlled host A, insertion on distinct host B, and B's first malicious action by the same medium and
    payload.
description:
  paragraphs:
  - zh: 本策略面向 T1091 的 TA0008 结果门。NJA-000180 以介质身份、A 端写入进程与内容摘要、B 端挂载和真实执行构建 A—介质—B 三门链；同时分别比较伪装入口的可见外观与命令目标，以及自动播种的卷枚举和批量写入。它不把一台主机的
      USB 插入或用户点击单独升级为内部横向传播。
    en: This strategy targets T1091's TA0008 outcome gate. NJA-000180 uses medium identity, A-side writer and content digest,
      B-side mount, and actual execution to build a three-gate A-to-media-to-B chain. It also compares a disguised entry's
      appearance with its command target and automatic seeding's volume enumeration and bulk writes. A USB insertion or user
      click on one host alone is not promoted to internal propagation.
  - zh: 输出保留介质序列号可伪造、隔离区日志可能缺失和合法离线更新的限制。TA0001 的首个入口与 TA0008 的后续异机结果可以共用 NJT-0058，但必须给每次映射独立的源主机、介质及目标证据。
    en: Output preserves the limits of spoofable media serials, missing isolated-zone logs, and legitimate offline updates.
      Initial Access and later cross-host results can share NJT-0058, but each mapping requires its own source host, medium,
      and destination evidence.
