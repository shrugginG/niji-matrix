schema_version: 2.0.0
type: detection-strategy
id: DET-000169
name:
  zh: 内部诱导消息—第二主体结果关联
  en: Internal Lure Message to Second-Principal Outcome Correlation
summary:
  zh: 把受陷内部发件、另一员工动作及第二账户失陷连接成有向结果链。
  en: Join a compromised internal sender, another employee's action, and second-account compromise into a directed outcome
    chain.
description:
  paragraphs:
  - zh: 本策略针对内部可信身份被用作横向诱导的因果链。NJA-000182 从已确认受陷的发件身份和会话建立有向收件边，以 NetworkMessageId 连接邮件交付、URL 点击或可靠的附件打开，再以收件者对象 ID 连接调查确认的新异常登录或会话接管。仅发送或点击时分别保留
      sent 与 acted 阶段，不声称已完成横向控制。
    en: This strategy targets the causal chain in which a trusted internal identity becomes a lateral lure. NJA-000182 builds
      directed recipient edges from a confirmed compromised sender and session, joins message delivery to URL clicks or reliably
      established attachment opens by NetworkMessageId, then joins the recipient object ID to investigator-confirmed abnormal
      sign-in or session takeover. Sending or clicking alone remains a sent or acted stage rather than completed lateral control.
  - zh: 按主题归档警示回复可压低原邮箱所有者看到的反馈，但这是现有 NJS-0111-001 的默认视图遗漏变量。本策略仍在消息服务端连接规则变化、回复路由与受害者结果，帮助解释发现延迟；正常内部公告和安全演练须按批准计划排除。
    en: Subject-matched archiving of warning replies can suppress what the original mailbox owner sees, but that is the existing
      NJS-0111-001 default-view omission variable. This strategy still joins server-side rule changes, reply routing, and
      recipient outcomes to explain delayed discovery, while approved announcements and security simulations remain counterexamples.
