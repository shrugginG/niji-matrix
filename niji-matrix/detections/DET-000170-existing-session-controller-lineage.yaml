schema_version: 2.0.0
type: detection-strategy
id: DET-000170
name:
  zh: 既有会话控制者—目标动作谱系
  en: Existing Session Controller to Target Action Lineage
summary:
  zh: 比较旧认证传输或会话的原所有者与新控制者，并联接目标动作。
  en: Compare the original owner of an authenticated transport or session with a new controller and join the target action.
description:
  paragraphs:
  - zh: 本策略以“没有建立新的同等会话，却改变了谁能操纵旧连接”为检测目标。NJA-000183 在已认证 SSH transport 上检测新增 channel 与跳板本地控制套接字或客户端进程接触者的差异；NJA-000184 在既有
      RDS LogonID 上连接 tscon、断开/重连与控制端变化；NJA-000185 对 shadow 并存控制检查策略、请求、原用户状态与后继资源动作。三者各自需要不同遥测，不把 SSH/RDP 协议名称当作 Niji 子项边界。
    en: The detection target is a change in who can operate an old connection without a comparable new session. NJA-000183
      compares new channels on an authenticated SSH transport with processes touching the control socket or client on the
      jump host. NJA-000184 joins tscon, disconnect and reconnect, and controller change for an existing RDS LogonID. NJA-000185
      tests shadow co-control through policy, request, original-user state, and successor resource action. Each needs distinct
      telemetry, and SSH versus RDP protocol names do not define Niji children.
  - zh: 仅没有新认证事件不是劫持证明：授权复用、远程支持或日志缺失也会同形。告警需展示旧连接或会话 ID、新本地操作者、目标动作和批准记录；缺少 SSH 通道埋点或 RDS 控制操作日志时必须降低置信度。
    en: 'An absent new authentication event is not proof of hijacking: authorized reuse, remote support, and missing logs
      can look the same. Alerts should display the old connection or session ID, new local operator, target action, and approval
      record. Without SSH channel instrumentation or RDS control-operation logs, confidence must be lowered.'
