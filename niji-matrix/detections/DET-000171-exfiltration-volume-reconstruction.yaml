schema_version: 2.0.0
type: detection-strategy
id: DET-000171
name:
  zh: 外传单元与长窗总量关联
  en: Exfiltration Unit and Long-Horizon Volume Correlation
summary:
  zh: 连接小上传对象和低峰值发送的累计量，识别局部阈值下仍持续流失的数据。
  en: Join small upload objects and low-peak sends into cumulative loss that persists below local thresholds.
description:
  paragraphs:
  - zh: 策略将外传规模约束分为两种不同计量任务。NJA-000186 在可检查 HTTP 或代理上传中寻找同源同目标的重复小对象，并恢复单次上传阈值遗漏的序列总量；NJA-000187 在已验证活动导出的 IPFIX
      出站字节中重建连续任务的短桶与长窗总量，并借端点进程证据核对主动限速。两者均须把合法备份、迁移、服务强制分片及拥塞原因排除后才提升结论。单连接结束时的 Zeek 汇总不能替代长连接内部的周期速率。
    en: The strategy separates exfiltration volume shaping into two accounting tasks. NJA-000186 reconstructs repeated
      small objects from inspectable HTTP or proxy uploads, recovering a series total missed by a per-upload rule.
      NJA-000187 uses validated active IPFIX exports to compare short buckets with long-run totals for a continuing
      job, then checks endpoint process evidence for intentional throttling. Both need to rule out approved backups,
      migration, service-mandated chunks and congestion before elevating a finding. A Zeek summary at connection
      end cannot substitute for periodic rates inside a long connection.
