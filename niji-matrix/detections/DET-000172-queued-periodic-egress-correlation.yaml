schema_version: 2.0.0
type: detection-strategy
id: DET-000172
name:
  zh: 待发数据与周期出站关联
  en: Queued Data and Periodic Egress Correlation
summary:
  zh: 跨多个释放周期连接外部发送、发起进程和待发区变化，识别未授权的周期外传。
  en: Join outbound sends, initiating processes and pending-area changes across release cycles to identify unauthorized
    periodic exfiltration.
description:
  paragraphs:
  - zh: 策略只处理已取得数据的周期出站，不把 C2 心跳、睡眠或计划任务创建本身当成外传。NJA-000188 在长窗口中寻找同一来源和外部目标的重复有量出站，再用进程身份、批准作业与可得待发文件变化核对释放关系。若只看见周期连接而无内容或来源上下文，输出应保持为待调查线索；较长保留和跨源关联用于恢复
      Sedreco 式收集与外送的时间错位。
    en: The strategy concerns periodic egress of acquired data, not a C2 heartbeat, sleep or task creation by itself.
      NJA-000188 finds recurring outbound sends with meaningful originator bytes for one source and external destination
      over a long window, then checks process identity, approved jobs and available pending-file changes for a release
      relationship. Recurring connections without content or source context remain leads for investigation. Longer
      retention and cross-source joins recover the separation of collection and sending seen in Sedreco.
