schema_version: 2.0.0
type: detection-strategy
id: DET-000173
name:
  zh: 关键文件删除与业务损失关联
  en: Critical-File Deletion and Business-Loss Correlation
summary:
  zh: 把文件删除权限和完成事件连接到关键路径、写入者及业务读取失败，识别数据销毁结果。
  en: Join file-delete access and completion to critical paths, actors, and business-read failures to identify destructive
    outcomes.
description:
  paragraphs:
  - zh: 此策略针对 T1485 父级的端点文件损失，不把每个删除请求视为匿迹。分析先从启用 SACL 的业务目录恢复 4663 与 4660 的对象和句柄链，再按进程、账户、路径及资产基线判断是否出现异常集中损失；应用读取失败提升影响置信度。云生命周期子项由另一套控制面到服务结果策略负责。
    en: This strategy addresses T1485 parent-level endpoint file loss without treating every deletion request as
      stealth. The analytic reconstructs object and handle lineage from 4663 and 4660 on SACL-audited business directories,
      then evaluates unusual concentrated loss by process, account, path, and asset baseline; application-read failure
      raises impact confidence. The cloud lifecycle child uses a separate control-plane-to-service-outcome strategy.
