schema_version: 2.0.0
type: detection-strategy
id: DET-000174
name:
  zh: 生命周期规则到服务删除谱系
  en: Lifecycle Rule to Service Deletion Lineage
summary:
  zh: 在对象损失前发现未授权的破坏性规则扩张，并把后续服务过期事件回连规则写入者。
  en: Detect unauthorized destructive rule expansion before loss and link later service-expiry events to the rule
    writer.
description:
  paragraphs:
  - zh: 此策略直接覆盖委托执行式数据销毁：先在配置写入时比较生命周期规则的删除范围和保留期，发出事前告警；随后利用服务到期事件、对象版本和业务读取结果验证影响。分析必须分别保存控制面身份和数据面服务身份，不能以服务事件缺少攻击者用户名为无异常，也不能在只有规则变更时宣称实际删除。
    en: This strategy directly covers delegated-execution destruction. It compares lifecycle-rule scope and retention
      at configuration write for pre-impact alerting, then verifies impact with service-expiry events, object versions,
      and business-read outcomes. The analytic preserves control-plane actor and data-plane service identity separately;
      a service event without the attacker username is not benign, and a rule change alone does not prove deletion.
