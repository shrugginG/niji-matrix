schema_version: 2.0.0
type: detection-strategy
id: DET-000175
name:
  zh: 低写入量加密的进程与区域内容关联
  en: Process and Regional-Content Correlation for Low-Write Encryption
summary:
  zh: 跨业务文件聚合同一进程的写入，并用前后区域比较发现低 I/O 的加密影响。
  en: Aggregate one process's writes across business files and use regional before-and-after comparison to reveal
    low-I/O encryption impact.
description:
  paragraphs:
  - zh: 此策略覆盖 T1486 的端点路径及文件内稀疏加密。分析以文件和进程事件筛选同一写入者造成的异常业务文件广度，再由独立内容完整性传感器确认被改写区域与保留区域并存、原业务格式不可读。文件事件并不提供区域熵，因此两个数据层的判断和置信度必须分开；云对象服务端重加密由对象数据事件策略负责。
    en: This strategy covers the endpoint path of T1486 and Sparse In-File Encryption. The analytic uses file and
      process events to identify unusual business-file breadth by one writer, then an independent content-integrity
      sensor confirms altered regions alongside preserved regions and failed business parsing. File events do not
      supply regional entropy, so judgments and confidence from the two data layers remain separate. Object data
      events handle service-side cloud re-encryption.
