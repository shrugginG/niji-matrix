schema_version: 2.0.0
type: detection-strategy
id: DET-000176
name:
  zh: S3 客户密钥对象重加密异常关联
  en: S3 Customer-Key Object Re-encryption Anomaly Correlation
summary:
  zh: 发现同一主体以客户密钥异常覆写已有对象，并连接桶配置、版本和合法读取结果。
  en: Detect abnormal same-principal customer-key overwrites of existing objects and join bucket configuration,
    versions, and legitimate reads.
description:
  paragraphs:
  - zh: 此策略直接覆盖客户密钥服务端重加密。分析先核对每桶 SSE-C 阻止状态与可能的解除阻止事件，再在 S3 对象数据事件中寻找带客户密钥参数的 CopyObject 覆写；按主体和对象范围识别异常批量操作，并核查当前版本和组织密钥归属。它不从单一
      SSE-C 请求推断恶意，也不会用主机文件日志替代云数据面。
    en: This strategy directly covers Customer-Key Service-Side Re-encryption. The analytic first checks each bucket's
      SSE-C block state and any event removing it, then finds CopyObject overwrites carrying customer-key parameters
      in S3 object data events. It identifies abnormal batches by principal and object scope and checks current
      versions and organizational key custody. One SSE-C request does not prove malice, and host file logs do not
      replace the cloud data plane.
