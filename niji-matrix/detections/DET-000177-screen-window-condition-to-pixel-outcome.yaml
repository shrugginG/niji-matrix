schema_version: 2.0.0
type: detection-strategy
id: DET-000177
name:
  zh: 窗口条件与屏幕像素结果关联
  en: Correlate Window Conditions With Acquired Screen Pixels
summary:
  zh: 验证目标情境后的实际取像和产物，而非只发现窗口条件或截图工具。
  en: Verify actual capture and output after target context, not only a window condition or screenshot tool.
description:
  paragraphs:
  - zh: NJA-000193 在已验证 GUI/图形传感器的端点上连接目标窗口状态、取像成功和结果间隔；NJA-000194 在可审计输出面以文件内容识别和进程谱系确认屏幕像素产物。策略区分窗口发现、图形调用、产物已证三层；合法远程支持、RPA、会议共享和用户截图按任务与会话排除。
    en: NJA-000193 joins target-window state, successful capture, and result intervals on endpoints with validated GUI and
      graphics sensors. NJA-000194 confirms screen-pixel artifacts through content inspection and process lineage in auditable
      outputs. The strategy separates window discovery, graphics call, and proven artifact, excluding approved remote support,
      RPA, meeting sharing, and user screenshots by task and session.
