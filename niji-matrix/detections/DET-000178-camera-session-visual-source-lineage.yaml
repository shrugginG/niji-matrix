schema_version: 2.0.0
type: detection-strategy
id: DET-000178
name:
  zh: 摄像头会话与画面产物来源关联
  en: Camera-Session to Visual-Artifact Provenance Correlation
summary:
  zh: 以设备会话和实际媒体内容确认未批准摄像头取像。
  en: Confirm unapproved camera acquisition through device sessions and real media content.
description:
  paragraphs:
  - zh: NJA-000195 要求部署环境已验证摄像头设备会话能与进程、模块及文件结果联接。摄像头使用或图片后缀本身只形成调查线索；必须有来源于相机的可信帧产物、缺少业务批准及正常会议或拍照基线差异，才升级为采集候选。通话应用接口取得的远端参与者画面由另一个策略处理。
    en: NJA-000195 requires locally verified joins from camera-device sessions to process, module, and file outcomes. Camera
      use or an image extension alone is an investigation lead. A confirmed camera-derived frame, absent business approval,
      and a difference from normal meetings or photography are needed to raise an acquisition candidate. The other strategy
      covers remote-party imagery obtained through a call-app interface.
