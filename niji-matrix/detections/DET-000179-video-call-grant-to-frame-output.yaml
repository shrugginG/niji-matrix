schema_version: 2.0.0
type: detection-strategy
id: DET-000179
name:
  zh: 视频通话第三方授权与帧产物关联
  en: Video-Call Third-Party Grant to Frame-Output Correlation
summary:
  zh: 证明非批准接口请求者在视频通话中取得帧，而非只有授权提示。
  en: Prove an unapproved interface requester obtained video-call frames rather than only a grant prompt.
description:
  paragraphs:
  - zh: NJA-000196 仅用于实际导出第三方接口与视频模态审计的通话产品，联查请求者授权、会话、临时帧与后继产物。T9000 的旧 Skype 路径支持历史实例，不是现代统一字段；只有授权没有帧结果时保留为暴露或企图。合法录制机器人、质检和会议纪要集成按批准组件与期限排除。
    en: NJA-000196 applies only where a call product exports third-party interface and video-modality audit, joining requester
      grants, session, temporary frames, and later output. T9000’s older Skype path is historical evidence rather than a universal
      modern field. A grant without frames remains exposure or attempt. Approved recording bots, quality assurance, and meeting-note
      integrations are excluded by requester and expiry.
