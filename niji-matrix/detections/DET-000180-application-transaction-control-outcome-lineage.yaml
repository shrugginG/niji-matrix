schema_version: 2.0.0
type: detection-strategy
id: DET-000180
name:
  zh: 应用事务至控制结果谱系
  en: Application Transaction to Control Outcome Lineage
summary:
  zh: 跨解析器或 broker 的事务与端点结果关联，确认真实应用层控制关系。
  en: Join resolver or broker transactions to endpoint outcomes to establish a real application-layer control relationship.
description:
  paragraphs:
  - zh: 策略以可重复的任务、响应与端点后果为确认门槛，不按 DNS、MQTT 或端口名称判恶。NJA-000197 从 DNS 问题和答案追到同进程或子进程动作，NJA-000198 把受管 broker 的发布者、主题、订阅者和设备执行接成双侧路径。只有公共
      broker 连接而无服务端事件时保持候选级判断，不能宣称已归属下令者。
    en: The strategy requires repeatable tasking, response, and endpoint consequence for confirmation rather than
      labeling DNS, MQTT, or port names malicious. NJA-000197 follows a DNS question and answer to same-process
      or child-process action. NJA-000198 joins managed-broker publisher, topic, subscriber, and device execution
      into a bilateral path. A connection to a public broker without service-side events remains a candidate finding
      and cannot identify the issuer.
