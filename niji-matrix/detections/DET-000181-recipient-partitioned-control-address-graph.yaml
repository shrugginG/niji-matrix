type: detection-strategy
id: DET-000181
name:
  zh: 接收者分区控制地址图重建
  en: Recipient-Partitioned Control Address Graph Reconstruction
summary:
  zh: 跨主题恢复注册、收令和回报关系，识别共享频道监控遗漏的植入集合。
  en: Reconstruct registration, task receipt, and results across topics to find implants omitted by shared-channel
    monitoring.
description:
  paragraphs:
  - zh: 策略以逻辑接收地址的分区和跨设备关联为目标。NJA-000199 从受管 broker 的订阅清单和持续投递事件建立每客户端主题图，连接注册标识、任务发布、后继执行和结果回报，并用授权设备目录排除正常每设备主题。仅看到多个私有主题时不判恶；公共
      broker 无全量事件时不能声称已还原整组植入。
    en: The strategy targets partitioning of logical receive addresses and correlation across devices. NJA-000199
      builds a per-client topic graph from a managed broker's subscription inventory and continuous delivery events,
      joining registration identifiers, task publication, successor execution, and result return while excluding
      approved per-device topics. Multiple private topics alone are not malicious; complete implant-set reconstruction
      cannot be claimed without full broker events.
