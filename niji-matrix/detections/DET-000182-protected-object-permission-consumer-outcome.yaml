schema_version: "2.0.0"
type: detection-strategy
id: DET-000182
name: {zh: 受保护对象权限—消费者结果关联, en: Protected-Object Permission to Consumer-Outcome Correlation}
summary: {zh: 将安全工件的权限或所有权变化与有效访问判定和防御消费者功能结果关联。, en: Join permission or ownership changes on a security artifact to effective access decisions and defensive-consumer outcomes.}
description:
  paragraphs:
    - zh: 本策略不把 cacls、icacls、chmod 或权限更改事件本身当作防御削弱。NJA-000200 从受保护对象清单取得对象身份、批准 owner/ACL 和真实消费者身份，连接 writer 会话及旧新权限，计算该消费者的有效执行、读取或更新权，再用启动、文件访问或功能性 canary 证明防御能力是否下降。输出分别保留 mutation_only、consumer_denied 与 effective_impairment，避免把 Grandoreiro 的恶意拒绝 ACL 尝试扩大为未观察到的普遍成功。
      en: This strategy does not treat cacls, icacls, chmod, or a permission-change event alone as defensive impairment. NJA-000200 obtains object identity, approved owner and ACL, and real consumer identity from a protected-object inventory, joins the writer session and old and new permissions, calculates the consumer's effective execute, read, or update access, and then uses launch, file-access, or functional-canary results to prove defensive decline. It preserves mutation_only, consumer_denied, and effective_impairment outcomes separately so Grandoreiro's malicious denial-ACL attempt is not expanded into unobserved universal success.
detects_refs: [NJT-0161]
domains: [enterprise]
analytic_refs: [NJA-000200]
evidence_refs: [REF-000687, REF-000688, REF-000689, REF-000690]
