schema_version: "2.0.0"
type: detection-strategy
id: DET-000183
name: {zh: Registry 防御设置—消费者效果关联, en: Registry Defensive-Setting to Consumer-Effect Correlation}
summary: {zh: 将本地 Registry 防御值写入与实际消费者采用、篡改保护裁决及有效安全能力变化关联。, en: "Join a local Registry defensive-value write to real consumer adoption, tamper-protection decision, and effective security-capability change."}
description:
  paragraphs:
    - zh: 本策略不复用 Registry 持久化的“状态寿命—后继启动”结论，也不把 reg.exe、Sysmon Registry 事件或 4657 单独视为防御削弱。NJA-000201 以稳定 key/value identity 保存 writer、old/new value、SACL/ACL、来源和批准，识别真实浏览器、安全工具或系统消费者何时采用该值，再比较有效设置、篡改保护结果与受控功能验证。分析分别输出 mutation_only、adopted_but_blocked 和 effective_impairment，使 BlackEnergy 的样本链与现代 Defender 的阻断反例都被准确表达。
      en: This strategy does not reuse the Registry-persistence conclusion of state lifetime and later startup, nor treat reg.exe, a Sysmon Registry event, or event 4657 alone as defensive impairment. NJA-000201 retains writer, old and new value, SACL or ACL, source, and approval by stable key and value identity, identifies when a real browser, security tool, or system consumer adopts the value, and then compares effective setting, tamper-protection outcome, and a controlled functional test. The analytic emits mutation_only, adopted_but_blocked, and effective_impairment separately so both the BlackEnergy sample chain and the modern Defender blocking counterexample are represented accurately.
detects_refs: [NJT-0162]
domains: [enterprise]
analytic_refs: [NJA-000201]
