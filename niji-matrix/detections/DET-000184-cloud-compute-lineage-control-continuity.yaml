schema_version: "2.0.0"
type: detection-strategy
id: DET-000184
name: {zh: 云计算 lineage—控制与证据连续性关联, en: Cloud-Compute Lineage to Control and Evidence Continuity}
summary: {zh: 将云计算生命周期、资源派生关系、控制注册及来宾证据前后态连接，确认影子计算或取证断点。, en: "Join cloud-compute lifecycle, resource derivation, control enrollment, and guest-evidence state to confirm shadow compute or a forensic break."}
description:
  paragraphs:
    - zh: 本策略不把 RunInstances、快照或删除 API 单独视为防御削弱。NJA-000202 从快照/映像/卷到新实例建立 lineage，比较网络、IAM、安全代理、集中日志和首个工作负载活动，判断新资源是否在批准控制注册前承载攻击者活动。NJA-000203 对既有 lineage 的删除、回退或临时存储重置，比较恶意活动窗口前后的来宾证据 manifest、备份与外部日志，区分正常恢复、破坏行为和取证连续性断裂。
      en: This strategy does not treat RunInstances, a snapshot, or a deletion API as defensive impairment by itself. NJA-000202 establishes lineage from snapshot, image, or volume to a new instance and compares network, IAM, security-agent, centralized-log enrollment, and first workload activity to determine whether adversary activity ran before approved controls. NJA-000203 examines deletion, reversion, or ephemeral reset of an existing lineage and compares guest-evidence manifests, backups, and external logs around the malicious interval to distinguish normal recovery, destructive behavior, and a forensic-continuity break.
detects_refs: [NJT-0163, NJS-0163-001, NJS-0163-002]
domains: [enterprise]
analytic_refs: [NJA-000202, NJA-000203]
evidence_refs: [REF-000103, REF-000696, REF-000697, REF-000698, REF-000699]
