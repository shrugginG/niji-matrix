schema_version: 2.0.0
type: detection-strategy
id: DET-000186
name:
  zh: 对象解析—出站认证—材料结果谱系
  en: Object Resolution–Outbound Authentication–Material Outcome Lineage
summary:
  zh: 将不受信对象中的网络引用、受信应用解析、出站认证及材料到达分级关联，覆盖文档之外的消息、图标和元数据载体。
  en: Join an untrusted object's network reference, trusted-application resolution, outbound authentication, and graded material arrival across
    messages, icons, metadata, and document carriers.
description:
  paragraphs:
  - zh: 本策略追踪消息、图标、文档或其他对象中的后台资源属性，从对象交付和解析进程连接到受害端对未批准目的地的认证，再区分连接尝试与挑战响应到达。NJA-000206 保留对象 hash、资源 URI、进程谱系、认证目标和接收结果；文档模板子集可同时由既有 NJA-000125
      展开，但不能让文档字段成为一般父级前提。
    en: This strategy follows a background resource property in a message, icon, document, or other object from delivery and resolving process
      to victim authentication toward an unapproved destination, then separates connection attempt from challenge-response arrival. NJA-000206
      retains object hash, resource URI, process lineage, authentication target, and receiver outcome. The document-template subset may also expand
      through existing NJA-000125, but document fields are not a requirement for the general parent.
