schema_version: 2.0.0
type: detection-strategy
id: DET-000187
name:
  zh: 远程服务调用—机器认证回连差分
  en: Remote-Service Invocation–Machine Authentication Callback Differential
summary:
  zh: 连接远程服务方法的调用者与目标主机随后向未经批准位置发出的服务或机器账户认证，并区分触发、材料到达和中继成功。
  en: Join a remote service-method caller to subsequent service or machine-account authentication from the target host to an unapproved location,
    separating trigger, material arrival, and relay success.
description:
  paragraphs:
  - zh: 本策略连接攻击者发起的远程服务方法调用、调用参数中的网络资源、受害服务进程回连和机器或服务主体认证。NJA-000207 对接口、方法、调用者、目标地址、NTLM 事件和接收结果作窄窗口联查，并将合法备份、证书注册和集群回连按完整关系基线排除。单侧服务调用、8004
      或 4624 都不能独自证明认证被胁迫。
    en: This strategy joins an adversary-initiated remote-service method, the network resource supplied in its arguments, the victim service callback,
      and machine or service-principal authentication. NJA-000207 correlates interface, method, caller, destination, NTLM event, and receiver
      outcome in a narrow window and excludes legitimate backup, certificate enrollment, and cluster callbacks through complete relationship baselines.
      A service call, event 8004, or 4624 alone cannot prove coercion.
