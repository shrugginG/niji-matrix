schema_version: 2.0.0
type: detection-strategy
id: DET-000188
name:
  zh: 权威签发与依赖方接受差分
  en: Authority Issuance and Relying-Party Acceptance Differential
summary:
  zh: 将依赖方接受的联合或签名认证材料回连到身份权威的认证、声明和签发事务，并把密钥或信任前置事件作为独立证据层。
  en: Join relying-party acceptance of federated or signed authentication material back to authority-side authentication, claims, and issuance,
    with key or trust precursors retained as a separate evidence tier.
description:
  paragraphs:
  - zh: 本策略比较依赖方接受的 Web 认证材料与身份权威真正执行的认证、签发和 signer 谱系。NJA-000208 查找成功联合登录却缺失对应 IdP 认证或签发事务；NJA-000209 从活动签名密钥访问和联合信任版本追到依赖方接受。两项保留材料构造、接受、会话和资源使用阶段，并把日志未启用或延迟作为
      coverage gap。
    en: This strategy compares web authentication material accepted by a relying party with authentication, issuance, and signer lineage actually
      performed by the identity authority. NJA-000208 finds successful federated sign-ins lacking matching IdP authentication or issuance. NJA-000209
      follows active signing-key access and federation-trust versions to relying-party acceptance. Both preserve construction, acceptance, session,
      and resource-use stages and treat missing or delayed logs as coverage gaps.
