schema_version: 2.0.0
type: detection-strategy
id: DET-000189
name:
  zh: 组合认证步骤完整性差分
  en: Composed Authentication Step-Completeness Differential
summary:
  zh: 对每个最终应用会话核对主认证、MFA/辅验证、state/code 交换和策略例外，识别由伪造辅状态补齐的认证链。
  en: For each final application session, reconcile primary authentication, MFA or auxiliary verification, state or code exchange, and policy
    exceptions to identify chains completed with forged auxiliary state.
description:
  paragraphs:
  - zh: 本策略验证由真实主认证和本地辅状态共同组成的登录是否有完整 MFA 或授权事务。NJA-000210 将应用主认证、外部 MFA、状态或授权码交换与最终会话连接；主认证成功但 MFA 权威无请求、应用却接受可计算辅 Cookie 的序列进入高风险。记住设备、break-glass
      和供应商故障例外必须有 owner、策略和有效期。
    en: This strategy tests whether a login composed from genuine primary authentication and local auxiliary state has a complete MFA or authorization
      transaction. NJA-000210 joins application primary authentication, external MFA, state or authorization-code exchange, and final session.
      A sequence in which primary authentication succeeds, the MFA authority has no request, and the app accepts computable auxiliary state is
      high risk. Remembered-device, break-glass, and provider-outage exceptions need an owner, policy, and validity interval.
