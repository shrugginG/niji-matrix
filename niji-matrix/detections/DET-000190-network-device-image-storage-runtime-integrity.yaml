schema_version: "2.0.0"
type: detection-strategy
id: DET-000190
name: {zh: 网络设备映像存储—运行完整性差分, en: Network-Device Image Storage–Runtime Integrity Differential}
summary: {zh: 比较可信持久映像、实际启动链和运行内存，分别确认即时内存修改与跨重载持久替换。, en: "Compare trusted persistent image, actual boot chain, and running memory to separately confirm immediate memory mutation and cross-reload persistent replacement."}
description:
  paragraphs:
    - zh: 本策略不把版本陈旧、一次固件升级或 checksum 差异自动视为防御削弱。NJA-000211 在同一 boot_id 下比较闪存/只读可信映像与运行内存、模块、函数和 core dump，并连接 debug/CLI writer 与功能性结果，识别闪存正常但内存被补丁的路径。NJA-000212 验证 image repository、flash、ROMMON/boot target、签名/Trust Anchor、启动测量和 post-boot 状态，识别跨重载再次消费的持久修改。
      en: This strategy does not treat an old version, one firmware update, or a checksum difference as defensive impairment automatically. NJA-000211 compares flash or read-only trusted image with running memory, modules, functions, and core dump under the same boot_id and joins debug or CLI writer plus functional outcome to identify a normal flash image with patched memory. NJA-000212 verifies image repository, flash, ROMMON or boot target, signature or Trust Anchor, boot measurement, and post-boot state to identify persistent mutation consumed again across reload.
detects_refs: [NJT-0167, NJS-0167-001, NJS-0167-002]
domains: [enterprise]
analytic_refs: [NJA-000211, NJA-000212]
evidence_refs: [REF-000449, REF-000467, REF-000468, REF-000720]
