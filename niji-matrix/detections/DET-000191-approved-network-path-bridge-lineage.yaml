schema_version: "2.0.0"
type: detection-strategy
id: DET-000191
name: {zh: 批准网络路径—桥接状态—双侧流量谱系, en: Approved Network Path–Bridge State–Bilateral Flow Lineage}
summary: {zh: 将批准域间路径模型与边界设备或 overlay relay 状态及两侧流量连接，证明未批准端到端桥接。, en: "Join an approved inter-domain path model to boundary-device or overlay-relay state and flows on both sides to prove an unapproved end-to-end bridge."}
description:
  paragraphs:
    - zh: 本策略不把 NAT、代理、VPN、FRP 或一条跨网流量单独视为桥接。NJA-000213 对路由器/防火墙/边界 VM 的 route、NAT、ACL、proxy/listener old-new、writer 与策略 decision 进行版本化，再连接原本禁止的 domain pair 的入口/出口流。NJA-000214 对不改变底层 route 的 relay 进程、服务或隧道，连接其两个 socket/session、身份、时间与 payload/byte 对称性。两者都要求批准 path graph 和真实双向结果。
      en: This strategy does not treat NAT, proxy, VPN, FRP, or one cross-network flow as bridging by itself. NJA-000213 versions route, NAT, ACL, proxy or listener old and new state, writer, and policy decision on a router, firewall, or boundary VM and joins it to ingress and egress flows for a prohibited domain pair. NJA-000214 examines a relay process, service, or tunnel that does not change the underlying route and joins its two sockets or sessions, identity, time, and payload or byte symmetry. Both require an approved path graph and a real bilateral outcome.
detects_refs: [NJT-0168, NJS-0168-001, NJS-0168-002]
domains: [enterprise]
analytic_refs: [NJA-000213, NJA-000214]
evidence_refs: [REF-000721, REF-000722, REF-000723, REF-000724]
