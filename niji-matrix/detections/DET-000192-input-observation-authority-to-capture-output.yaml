schema_version: 2.0.0
type: detection-strategy
id: DET-000192
name:
  zh: 输入观察权限到捕获输出关联
  en: Input Observation Authority to Capture Output Correlation
summary:
  zh: 将未批准的全局输入观察、设备读取或事件 Hook 与同进程缓冲和外联连接，区分能力、暴露与实际捕获。
  en: Join unapproved global input observation, device reads, or event hooks to same-process buffers and egress, distinguishing
    capability, exposure, and actual capture.
description:
  paragraphs:
  - zh: 本策略把输入观察入口、批准前态和攻击者可读结果放在同一主机与交互会话中。先识别未批准的全局 Hook、event tap、Input Monitoring 或输入设备访问，再连接同进程或子进程的缓冲写入和外联；只见权限或 API
      调用时保持 exposure，只有结果链成立才提升为 capture。
    en: This strategy places the input-observation entry, approval pre-state, and attacker-readable outcome in the same host
      and interactive session. It first identifies an unapproved global hook, event tap, Input Monitoring grant, or input-device
      access and then joins buffers and egress from the same process or child. Authority or an API call remains exposure until
      an outcome chain supports capture.
  - zh: 实现时不得集中记录真实按键或口令。Windows、Linux 与 macOS 采用各自经验证的权限和设备传感器，共同关联键为 host、user、session、process、目标输入面和时间；输入法、辅助功能、远程支持与密码管理器按精确签名、版本、任务和期限排除。
    en: Implementation must not centrally record actual keystrokes or passwords. Windows, Linux, and macOS use separately
      validated authority and device sensors, with host, user, session, process, target input surface, and time as common
      join keys. Input methods, accessibility tools, remote support, and password managers are excluded by exact signer, version,
      task, and expiry.
