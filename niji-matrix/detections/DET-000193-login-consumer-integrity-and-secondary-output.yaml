type: detection-strategy
id: DET-000193
name:
  zh: 登录消费者完整性与第二输出关联
  en: Login Consumer Integrity and Secondary Output Correlation
summary:
  zh: 同时检查登录资产与认证运行态，并把未批准差异连接到同次提交附近的第二文件或网络输出。
  en: Check both login assets and authentication runtime and join unauthorized differences to a secondary file or network
    output around the same submission.
description:
  paragraphs:
  - zh: 本策略同时覆盖登录消费者的静态资产和运行态，避免把“磁盘文件未变”当作认证进程未被寄生。外部黄金哈希、部署身份和写入记录用于发现脚本或模板差异；模块、agent、instrumentation、代码映射和启动参数用于发现运行态改写，再把差异连接到同次提交附近的第二文件或网络输出。
    en: This strategy covers both static assets and runtime of the login consumer so an unchanged disk file is not treated
      as proof that the authentication process was not inhabited. External golden hashes, deployment identity, and write records
      identify script or template differences. Modules, agents, instrumentation, code mappings, and launch arguments identify
      runtime rewriting, and each difference is joined to a secondary file or network output around the same submission.
  - zh: 单独完整性差异只证明控制面异常，正常 APM、热补丁、反欺诈脚本和升级也可产生相同线索。策略要求以批准部署、维护窗、内容安全策略和输出目的地排除正常变化，并在字段值不入日志的条件下区分 integrity failure、runtime
      exposure 与 suspected capture。
    en: An integrity difference alone establishes a control-plane anomaly, and approved APM, hot patching, antifraud scripts,
      or upgrades can create similar leads. The strategy excludes normal changes through approved deployment, maintenance
      window, content-security policy, and output destination, and grades integrity failure, runtime exposure, and suspected
      capture without placing field values in logs.
