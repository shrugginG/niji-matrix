type: detection-strategy
id: DET-000194
name:
  zh: 输入界面身份与真实接收者差分
  en: Input Interface Identity and True Receiver Differential
summary:
  zh: 对比本地提示或 Web 登录的呈现身份、进程或 origin、提交目标和权威身份事务，识别仿冒接收者。
  en: Compare the presented identity, process or origin, submission target, and authoritative identity transaction for local
    prompts and web sign-ins to identify an impersonated receiver.
description:
  paragraphs:
  - zh: 本策略验证用户所见输入界面是否由预期消费者控制。本地分支比较窗口所属进程、签名、父链和 secure desktop；Web 分支比较品牌、页面 origin、证书、重定向链、表单目标与权威 IdP transaction。提示或页面存在只是仿冒线索，提交后文件或网络结果才支持
      suspected capture。
    en: This strategy verifies whether the input interface seen by the user is controlled by the intended consumer. The local
      branch compares the owning process, signer, parent chain, and secure desktop. The web branch compares brand, page origin,
      certificate, redirect chain, form destination, and authoritative IdP transaction. A prompt or page is an impersonation
      lead, while a post-submission file or network outcome supports suspected capture.
  - zh: 合法安装器、远程支持、SSO 代理、多租户回调、区域域名和测试租户都可形成相似差异。排除必须绑定工单、应用注册、租户所有者、redirect URI 和有效期；未受管浏览器或缺少窗口安全上下文时应明确记录盲区，不能把外观相似直接等同凭据已获。
    en: Legitimate installers, remote support, SSO proxies, multitenant callbacks, regional domains, and test tenants can
      create similar differences. Exclusions bind ticket, app registration, tenant owner, redirect URI, and expiry. Unmanaged
      browsers or missing window security context are explicit blind spots, and visual similarity alone cannot establish credential
      acquisition.
