schema_version: "2.0.0"
type: detection-strategy
id: DET-000195
name: {zh: 交互命令—历史状态—持久条目差分, en: Interactive Command–History State–Durable Entry Differential}
summary: {zh: 将独立交互命令序列与 session 的 history 设置、sink 写入边界和最终条目关联，区分整段不落盘与选择性遗漏。, en: "Join an independent interactive-command sequence to session history settings, sink persistence boundaries, and final entries to distinguish whole-session non-persistence from selective omission."}
description:
  paragraphs:
    - zh: 本策略不把空 history、HISTFILE=/dev/null、SaveNothing、ignorespace 或某条敏感命令单独视为攻击。NJA-000220 为每个交互 session 建立应记录基线，连接 authentication/TTY、独立 command/process 事件、history state old-new、sink canonical path/type、write/close/exit 与最终文件区间；只有全局状态覆盖命令时间窗且正常持久化边界后整段缺失时确认整体抑制。NJA-000221 在 history 仍工作的 session 中，将独立命令序列和最小化输入特征与 predicate 版本、相邻 history 序号逐项比对，只对命中条件的局部缺口确认选择性遗漏。
      en: This strategy does not treat empty history, HISTFILE=/dev/null, SaveNothing, ignorespace, or one sensitive command as an attack by itself. NJA-000220 builds an expected-recording baseline per interactive session and joins authentication and TTY, independent command or process events, history-state old and new, canonical sink path and type, write, close, or exit, and the final file interval. It confirms whole-session suppression only when global state covers the command interval and the entire interval remains absent after the normal persistence boundary. NJA-000221 operates where history still works, comparing an independent command sequence and minimized input features to predicate versions and neighboring history sequence numbers, confirming selective omission only for local gaps matching the condition.
    - zh: 输出分为 confirmed_suppression、suppression_exposure、history_gap 和 benign_failure。高置信要求独立命令证据、版本化平台基线、未批准 state/predicate 与实际 store outcome 四者闭环；缺少任一项时降级。命令内容属于敏感数据，主关联可用 session-scoped hash、leading-space flag、normalized token class 和 sequence，不在普通告警中复制原文。
      en: Outputs separate confirmed_suppression, suppression_exposure, history_gap, and benign_failure. High confidence requires closure across independent command evidence, a versioned platform baseline, unapproved state or predicate, and the actual store outcome. Missing any element lowers confidence. Command content is sensitive data, so primary correlation can use session-scoped hashes, a leading-space flag, normalized token class, and sequence rather than copying plaintext into ordinary alerts.
