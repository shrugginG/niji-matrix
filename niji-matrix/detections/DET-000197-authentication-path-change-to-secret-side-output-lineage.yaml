schema_version: 2.0.0
type: detection-strategy
id: DET-000197
name:
  zh: 认证路径变化—秘密旁路输出谱系
  en: Authentication-Path Change to Secret Side-Output Lineage
summary:
  zh: 将未批准认证消费者变化连接到真实认证事务和第二秘密输出，分级识别认证路径内的凭据取得。
  en: Join an unapproved authentication-consumer change to a real authentication transaction and second secret output, grading
    credential acquisition inside the authentication path.
description:
  paragraphs:
  - zh: 本策略检测“认证路径中的消费者变化直接产生秘密旁路输出”，不把模块注册、认证成功、敏感文件写入或后继登录单独视为完成。分析为每个登录或密码变化事务恢复组件链和允许的秘密接收者，将未批准模块及其文件、IPC 或网络第二输出连接到同一事务，并保留
      change-only、transaction-traversed、suspicious-output 与 material-created 分级。
    en: This strategy detects an authentication-consumer change directly producing a secret side output and does not treat
      module registration, successful authentication, a sensitive-file write, or successor sign-in alone as completion. The
      analytic reconstructs the component chain and allowed secret recipients for each sign-in or password-change transaction,
      joins an unapproved module and its file, IPC, or network output to that transaction, and preserves change-only, transaction-traversed,
      suspicious-output, and material-created tiers.
  - zh: 任何阶段不得记录真实秘密；对象 ID、组件版本、事务、敏感分类、调查确认和轮换范围提供证据。合法同步、凭据管理、PAM 和迁移是强反例，必须用 owner、批准、明确作用域、受保护目的地、寿命和删除或轮换证据排除。策略可恢复化只保留为父级研究边界，不纳入本检测对象。
    en: No stage records actual secrets. Object IDs, component version, transaction, sensitivity classification, investigation
      confirmation, and rotation scope provide evidence. Legitimate synchronization, credential management, PAM, and migration
      are strong counterexamples and require owner, approval, explicit scope, protected destination, lifetime, and deletion
      or rotation evidence. Policy recoverability remains a parent research boundary and is outside this detection object.
