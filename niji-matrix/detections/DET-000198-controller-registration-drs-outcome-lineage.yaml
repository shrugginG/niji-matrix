schema_version: "2.0.0"
type: detection-strategy
id: DET-000198
name: {zh: 控制器注册—DRS 事务—目录结果谱系, en: Controller Registration–DRS Transaction–Directory Outcome Lineage}
summary: {zh: 将批准域控制器清单、注册生命周期、非 DC 复制来源和目录结果关联，证明恶意写入以伪造复制权威被接受。, en: "Join approved domain-controller inventory, registration lifecycle, non-DC replication origin, and directory outcomes to prove that a malicious write was accepted through forged replication authority."}
description:
  paragraphs:
    - zh: 本策略不把 server/nTDSDSA 创建、某个 SPN、DRS 流量或 AD 属性变化单独视为 DCShadow。NJA-000227 从批准 controller inventory 出发，版本化 Configuration partition 中 server/nTDSDSA/computer 对象、GC/DRS SPN、LDAP writer、Kerberos 身份和 create-modify-delete 时间线，区分正常 promotion/demotion 与短生命周期、错误容器或未批准主机注册。NJA-000228 再把非 DC 主机的 DRSUAPI/RPC 与事件 4928/4929、source DRA/originating DSA、合法 DC 接受和目标对象 old-new 连接。
      en: This strategy does not treat creation of a server or nTDSDSA object, one SPN, DRS traffic, or an AD attribute change as DCShadow by itself. NJA-000227 starts from approved controller inventory and versions server, nTDSDSA, and computer objects in the Configuration partition, GC or DRS SPNs, LDAP writer, Kerberos identity, and the create, modify, and delete timeline to distinguish normal promotion or demotion from short-lived, wrong-container, or unapproved-host registration. NJA-000228 then joins DRSUAPI or RPC from a non-DC host to events 4928 or 4929, source DRA or originating DSA, legitimate-DC acceptance, and target-object old and new state.
    - zh: 两项分析输出共享 controller_registration_id 与 replication_cycle_id。仅注册异常输出 rogue_registration_exposure；只有非清单 DRS 请求输出 replication_origin_anomaly；只有当身份、事务、接受和对象结果闭环时输出 confirmed_origin_displacement。产品警报可作为输入但不能替代原始目录/网络证据，正常 promotion 工单、复制拓扑和生命周期必须参与判定。
      en: The analytics share a controller_registration_id and replication_cycle_id. Registration anomaly alone produces rogue_registration_exposure, and a non-inventory DRS request alone produces replication_origin_anomaly. Only closure across identity, transaction, acceptance, and object outcome produces confirmed_origin_displacement. Product alerts can be inputs but cannot replace raw directory or network evidence, and normal promotion tickets, replication topology, and lifecycle must participate in the decision.
