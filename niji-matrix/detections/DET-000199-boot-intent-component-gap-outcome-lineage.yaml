schema_version: "2.0.0"
type: detection-strategy
id: DET-000199
name: {zh: 启动意图—组件缺口—后继结果谱系, en: Boot Intent–Component Gap–Follow-On Outcome Lineage}
summary: {zh: 跨重启连接启动配置、实际模式、防御组件差和后继行为，并对 SafeBoot 载荷注册建立独立消费分支。, en: "Correlate boot configuration, actual mode, defensive-component difference, and follow-on behavior across reboot, with a separate consumption branch for SafeBoot payload enrollment."}
description:
  paragraphs:
    - zh: 本策略不把 bcdedit、safeboot 值、重启、EDR 离线或 SafeBoot Registry 条目单独视为攻击。NJA-000229 建立每类主机 normal/safe expected-component set，将 BCD old-new/actor、shutdown/reboot、boot ID/mode、loaded driver/service、EDR/AV heartbeat、外部网络/登录与窗口内进程/文件/配置结果串成跨重启 transaction；只有实际受限启动造成具体防御差且随后发生恶意结果才确认父项。
      en: This strategy does not treat bcdedit, a safeboot value, reboot, an offline EDR, or a SafeBoot Registry entry as an attack by itself. NJA-000229 builds normal and safe expected-component sets by host class and joins BCD old and new with actor, shutdown or reboot, boot ID and mode, loaded drivers and services, EDR or AV heartbeat, external network or sign-in, and process, file, or configuration outcomes in the window into a cross-reboot transaction. It confirms the parent only when an actual restricted boot creates a specific defensive difference and malicious outcome follows.
    - zh: NJA-000230 对 child 版本化 SafeBoot Minimal/Network/COM/service enrollment，连接 writer、service binary/signature、allowlist key、boot consumption、payload process 与同时缺席的 defense component。输出分为 boot_intent_exposure、legitimate_maintenance、restricted_boot_gap、payload_enrollment_exposure 和 confirmed_restricted_boot_abuse。终端 agent 自身缺席时，外部网络、虚拟化/管理面、启动日志和远程配置快照承担独立证据。
      en: For the child, NJA-000230 versions SafeBoot Minimal, Network, COM, and service enrollment and joins writer, service binary or signature, allowlist key, boot consumption, payload process, and simultaneously absent defense components. Outputs separate boot_intent_exposure, legitimate_maintenance, restricted_boot_gap, payload_enrollment_exposure, and confirmed_restricted_boot_abuse. When the endpoint agent itself is absent, external network, virtualization or management plane, boot logs, and remote configuration snapshots provide independent evidence.
detects_refs: [NJT-0172, NJS-0172-001]
domains: [enterprise]
analytic_refs: [NJA-000229, NJA-000230]
