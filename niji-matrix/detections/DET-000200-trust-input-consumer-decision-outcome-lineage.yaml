schema_version: "2.0.0"
type: detection-strategy
id: DET-000200
name: {zh: 信任输入—消费者裁决—接受结果谱系, en: Trust Input–Consumer Decision–Accepted Outcome Lineage}
summary: {zh: 将攻击者可控的对象证明、锚、验证器或来源状态连接到具体 consumer 的裁决与首个接受结果。, en: "Join adversary-controllable object attestation, anchor, verifier, or provenance state to a named consumer decision and the first accepted outcome."}
description:
  paragraphs:
    - zh: 本策略不把 valid signature、root certificate、Registry/policy 变化、缺失 MOTW/quarantine 或 unsigned execution 单独视为信任控制颠覆。四项 Analytic 共享 trust_input_id、consumer_id/version、baseline/effective policy、decision/result、decision_time 和 first_outcome_id：NJA-000231 验证对象 signer/certificate/notarization 与 key/build/revocation provenance；NJA-000232 版本化 trust anchor 并重建后继 chain consumption；NJA-000233 连接 verifier policy、SIP/provider mapping、实际 module/callback 与裁决；NJA-000234 重建 delivery—container—child 的 provenance constraint 连续性。
      en: This strategy does not treat a valid signature, root certificate, Registry or policy change, missing MOTW or quarantine, or unsigned execution as trust-control subversion by itself. Four analytics share trust_input_id, consumer ID and version, baseline and effective policy, decision and result, decision time, and first outcome ID. NJA-000231 verifies object signer, certificate, or notarization against key, build, and revocation provenance. NJA-000232 versions trust anchors and reconstructs later chain consumption. NJA-000233 joins verifier policy, SIP or provider mappings, actual module or callback, and decision. NJA-000234 reconstructs provenance-constraint continuity from delivery through container to child.
    - zh: 每条分支把仅有输入变化标为 trust_exposure，把 consumer 拒绝标为 blocked_attempt，把缺少历史基线/decision 标为 trust_anomaly，只有攻击者输入、实际评估、baseline-different allow/trusted/no-warning 与恶意接受结果闭环时确认。子项可以共现，例如恶意 root 为已签对象提供 chain、Gatekeeper 同时消费签名和 quarantine；输出必须保留每条 input contribution 而不强制互斥。
      en: Each branch labels an input change alone as trust_exposure, a consumer rejection as blocked_attempt, and missing historical baseline or decision as trust_anomaly. Confirmation requires closure across adversary input, actual evaluation, an allow, trusted, or no-warning decision differing from baseline, and a malicious accepted outcome. Children can coexist, such as a malicious root supplying a chain to a signed object or Gatekeeper consuming both signature and quarantine, and output retains each input contribution rather than forcing exclusivity.
