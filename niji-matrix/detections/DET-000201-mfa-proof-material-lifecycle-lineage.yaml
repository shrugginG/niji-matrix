id: DET-000201
name:
  zh: MFA 证明签发、控制与使用谱系
  en: MFA Proof Issuance, Control, and Use Lineage
summary:
  zh: 把单次证明的签发、投递或第二输出、攻击者读取与消费结果连接，并把认证器生成状态访问、迁移或复制连接到后续跨设备证明使用，同时保留证据层级。
  en: Join issuance, delivery or second output, adversary read, and consumption result for a single proof, and connect authenticator
    generator-state access, migration, or copying to later cross-device proof use while preserving evidence tiers.
description:
  paragraphs:
  - zh: 本策略把 MFA 证明的签发或生成状态、攻击者控制的第二读取面、材料实际到达、验证者消费和后继 session 分层连接。短时证明分支按 challenge/proof ID、有效期、投递接收者、读取主体、消费设备和用户反馈恢复；生成状态分支按
      token container、设备绑定、导入绕过、认证器标识和长期使用恢复。
    en: This strategy joins issuance or generator state, an attacker-controlled second read surface, actual material arrival,
      verifier consumption, and successor session as separate stages. The ephemeral branch uses challenge or proof identifiers,
      validity, delivery recipient, reader, consuming device, and user feedback. The generator branch uses token container,
      device binding, import bypass, authenticator identity, and long-term use.
  - zh: 只看到仿冒页面、提供者控制台权限、文件复制或 MFA 成功分别只能证明入口、暴露或后继结果。分析不记录 OTP、seed 或口令值；使用 proof/message/object ID、HMAC 指纹、材料类别和调查确认。合法帮助台、设备迁移、备份与恢复按批准、owner、旧实例失效和期限排除。
    en: An impersonated page, provider-console authority, file copy, or MFA success alone establishes only an entry, exposure,
      or successor result. Analytics never record OTP, seed, or password values and instead use proof, message, or object
      identifiers, HMAC fingerprints, material class, and investigation confirmation. Approved help desk, device migration,
      backup, and recovery require approval, owner, old-instance invalidation, and expiry.
