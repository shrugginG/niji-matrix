schema_version: 2.0.0
type: detection-strategy
id: DET-000202
name:
  zh: MFA 挑战发起—用户响应—会话结果谱系
  en: MFA Challenge Initiation–User Response–Session Outcome Lineage
summary:
  zh: 将攻击者可疑登录或恢复来源、权威 challenge、用户拒绝/超时/批准、外部解释情境和 token/session 结果分层连接。
  en: Join suspicious sign-in or recovery origin, authoritative challenge, user denial, timeout, or approval, external explanatory
    context, and token or session outcome as graded stages.
description:
  paragraphs:
  - zh: 本策略从攻击者可控登录、无口令或恢复入口开始，区分 challenge 创建、通知投递、用户拒绝/超时/批准、token/session 签发和资源访问。序列分支聚合同一 user/application/source 的独立
      challenge，跨信道分支把通信中的身份与请求动作连接到 IdP transaction 和后继结果。
    en: This strategy starts at an adversary-controllable sign-in, passwordless, or recovery entry and separates challenge
      creation, notification delivery, user denial, timeout or approval, token or session issuance, and resource access. The
      sequence branch aggregates independent challenges for one user, application, and origin. The cross-channel branch joins
      communicator identity and requested action to the IdP transaction and successor outcome.
  - zh: challenge 高频增加痕迹，不作为时空释痕；低频情境同步也不能只靠发送者外部标签定罪。实现需验证独立 transaction 与通知重投语义，并以工单、已知回呼、维护窗、用户发起动作和设备更换排除正常流程。欺诈报告或恶意批准触发限流、阻断、凭据响应和会话撤销。
    en: High challenge volume increases traces and is not treated as spatiotemporal dilution, while low-volume context synchronization
      cannot be convicted from an external sender label alone. Implementations validate independent transactions versus notification
      redelivery and exclude normal workflows through cases, known callbacks, maintenance windows, user initiation, and device
      replacement. Fraud reporting or malicious approval triggers throttling, blocking, credential response, and session revocation.
