type: detection-strategy
id: DET-000203
name:
  zh: 未授权观察面—认证材料结果关联
  en: Unauthorized Observation Surface–Authentication Material Outcome Correlation
summary:
  zh: 把主机包捕获、网络设备原生抓包和镜像复制面的生命周期分别连接到真实认证流及分级材料结果，并用批准关系排除合法监控。
  en: Join host packet capture, native network-device capture, and mirror-plane lifecycle separately to real authentication
    flows and graded material outcomes, using approval relationships to exclude authorized monitoring.
description:
  paragraphs:
  - zh: 本策略分别恢复主机 packet capture、既有转发设备本地抓包和镜像复制面的生命周期，再把每种观察面连接到真实认证 flow、加密终止或恢复秘密以及材料结果。三条 Analytic 保留不同状态键：host/process/interface、device/admin-session/capture-object，以及
      mirror/control-plane/collector。
    en: This strategy reconstructs lifecycle separately for host packet capture, local capture on an existing forwarding device,
      and replicated mirror surfaces, then joins each observation plane to a real authentication flow, encryption termination
      or recovery secret, and material outcome. The three analytics retain distinct state keys for host, process and interface;
      device, administration session and capture object; and mirror, control plane and collector.
  - zh: 输出分为 capture-capability、flow-covered、artifact-created、material-recoverable 和 material-confirmed；命令、socket、mirror resource
      或 PCAP 文件不单独证明凭据取得。合法 NDR、故障排查和合规镜像按 owner、工单、精确 source/filter、collector、时限和数据合同排除，原始正文留在受限证据库。
    en: Outputs are capture-capability, flow-covered, artifact-created, material-recoverable, and material-confirmed. A command,
      socket, mirror resource, or PCAP file alone does not prove credential acquisition. Authorized NDR, troubleshooting,
      and compliance mirrors require owner, case, exact source or filter, collector, expiry, and data contract, with raw payload
      retained in a restricted evidence store.
