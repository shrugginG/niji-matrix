schema_version: 2.0.0
type: detection-strategy
id: DET-000204
name:
  zh: 本地认证状态读取—材料输出谱系
  en: Local Authentication-State Read–Material Output Lineage
summary:
  zh: 将敏感进程、hive、账户数据库、procfs 或 shadow 读取与 reader provenance、输出和材料结果连接，区分能力、访问和完成提取。
  en: Join sensitive process, hive, account-database, procfs, or shadow reads to reader provenance, output, and material outcome,
    separating capability, access, and completed extraction.
description:
  paragraphs:
  - zh: 本策略覆盖 OS 认证运行态和本地/域存储的直接读取、非活动视图以及受信 reader 转用。基础 Analytic 按 host、reader、object/view、依赖与 output 恢复 read-to-material；reader
      Analytic 额外验证代码来源、模块或注入状态和允许 output contract。
    en: This strategy covers direct reads of OS authentication runtime and local or domain stores, inactive views, and trusted-reader
      repurposing. The base analytic reconstructs read-to-material by host, reader, object or view, dependencies, and output.
      The reader analytic additionally verifies code provenance, module or injection state, and permitted output contract.
  - zh: ProcessAccess、ptrace、文件打开、snapshot 和 dump 文件分别只证明能力、读取或产物。输出按 capability_only、object_read、store_copied、material_parsed
      与 material_confirmed 分级，真实秘密不进入集中日志。合法 EDR、备份、诊断和取证必须用签名、版本、工单、target 与输出目的地排除。
    en: ProcessAccess, ptrace, file open, snapshot, and dump file establish capability, read, or artifact only. Outputs are
      graded capability_only, object_read, store_copied, material_parsed, and material_confirmed, and real secrets never enter
      centralized logs. Approved EDR, backup, diagnostics, and forensics require signer, version, case, target, and output-destination
      exclusions.
