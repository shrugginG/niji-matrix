schema_version: 2.0.0
type: detection-strategy
id: DET-000205
name:
  zh: 复制调用来源—秘密响应—材料输出差分
  en: Replication Caller–Secret Response–Material Output Differential
summary:
  zh: 将 DRS 调用者、批准复制关系、secret-bearing response 和后继输出连接，识别合法协议中的未批准材料导出。
  en: Join DRS caller, approved replication relationship, secret-bearing response, and later output to identify unapproved
    material export through a legitimate protocol.
description:
  paragraphs:
  - zh: 本策略重建目录复制 caller/host、权限前态、naming context、GetNCChanges 请求与响应、返回范围和材料输出，把本地数据库读取之外的权威服务导出独立检测。当前 approved DC/synchronizer
      inventory 必须使用事件时版本，避免用事后 OU 或权限状态解释历史请求。
    en: This strategy reconstructs directory-replication caller and host, prior rights, naming context, GetNCChanges request
      and response, returned scope, and material output, detecting authoritative service export separately from local database
      reads. The approved DC and synchronizer inventory must use event-time versions rather than later OU or permission state.
  - zh: RPC/135/445 连接、复制权限存在或单一 MDI 告警不能证明秘密已返回。分析区分 denied_request、rights_exposure、successful_response、secret_bearing_scope
      和 material_output；合法域控复制、目录同步、备份/恢复与批准 promotion 按 host GUID、owner、工单和范围排除。
    en: RPC connectivity, replication rights, or one MDI alert cannot prove that secrets were returned. The analytic distinguishes
      denied_request, rights_exposure, successful_response, secret_bearing_scope, and material_output. Legitimate DC replication,
      directory synchronization, backup or recovery, and approved promotion require host GUID, owner, case, and scope exclusions.
