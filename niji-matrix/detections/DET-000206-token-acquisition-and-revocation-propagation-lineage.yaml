schema_version: 2.0.0
type: detection-strategy
id: DET-000206
name:
  zh: Token 请求/读取—材料取得—撤销传播谱系
  en: Token Request or Read–Material Acquisition–Revocation Propagation Lineage
summary:
  zh: 分别关联签发返回、持久对象读取和易失运行态提取到攻击者控制的 token 材料结果，并在处置后验证 token family、grant 和各 audience 的实际拒绝。
  en: Separately join issuance returns, persisted-object reads, and volatile-runtime extraction to an adversary-controlled
    token-material result, then verify actual denial across token family, grant, and audiences after containment.
description:
  paragraphs:
  - zh: 本策略将三种取得路径保持为独立数据契约。签发返回面以 request/issuer/recipient/response 为主；持久工件以 object version/mount/reader/read outcome/copy
      为主；易失运行态以 job/process/code provenance、memory/environment/IPC 和第二输出为主。第四条分析在处置后验证 token family、grant、client/workload
      和每个 audience 的拒绝。
    en: This strategy keeps three acquisition paths as separate data contracts. Issuance return centers on request, issuer,
      recipient, and response. Persisted artifacts center on object version, mount, reader, read outcome, and copy. Volatile
      runtime centers on job, process, code provenance, memory, environment or IPC, and second output. A fourth analytic verifies
      denial of token family, grant, client or workload, and every audience after containment.
  - zh: location_exposed、read_or_return_succeeded、material_acquired、usable_at_acquisition、presented、accepted 和 resource_access
      分级输出；任何后继成功只能证明 possession，不能说明具体取得路径。分析使用 token reference/family、safe hash 或受限 HMAC 指纹，不把 token 值写入集中日志。
    en: Outputs are graded location_exposed, read_or_return_succeeded, material_acquired, usable_at_acquisition, presented,
      accepted, and resource_access. Successor activity can establish possession but cannot identify the acquisition path.
      Analytics use token reference or family, safe hash, or restricted HMAC fingerprint and never place token values in centralized
      logs.
