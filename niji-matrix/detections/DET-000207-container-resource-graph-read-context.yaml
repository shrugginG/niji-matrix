schema_version: 2.0.0
type: detection-strategy
id: DET-000207
name:
  zh: 容器资源图读取上下文关联
  en: Container Resource-Graph Read Context Correlation
summary:
  zh: 将 Kubernetes 或 Docker 资源列表读取与调用身份、范围和后继容器操作关联。
  en: Join Kubernetes or Docker resource-list reads to caller identity, scope, and later container actions.
description:
  paragraphs:
  - zh: 本策略识别取得 Pod、节点、命名空间、部署、镜像和容器状态的异常读取。NJA-000249 使用 Kubernetes audit 将 list/get/watch 的主体、scope 与后继 exec/create 分开关联；NJA-000250
      只在 Docker 请求或进程通道经验证时分析 `/containers/json`、镜像列表和 inspect，避免把缺失的 daemon access log伪装成完整覆盖。
    en: This strategy identifies abnormal reads of pod, node, namespace, deployment, image, and container state. NJA-000249
      uses Kubernetes audit to join list, get, and watch actor and scope to separately modeled later exec or create actions.
      NJA-000250 analyzes `/containers/json`, image lists, and inspect only where Docker request or process telemetry is validated,
      rather than pretending an absent daemon access log is complete coverage.
