schema_version: 2.0.0
type: detection-strategy
id: DET-000208
name:
  zh: 驱动事实查询与结果语义关联
  en: Driver-Fact Query and Result-Semantics Correlation
summary:
  zh: 识别异常驱动清单查询，并区分工具输出、加载地址和有效结果。
  en: Identify abnormal driver-inventory queries while separating utility output, load addresses, and usable results.
description:
  paragraphs:
  - zh: 本策略将原生工具或注册表读取与 API 级加载地址枚举分开。NJA-000251 检测 driverquery、PnPUtil 与驱动相关注册表读取并按主机角色和维护任务调优；NJA-000252 在经验证的 API 传感器中记录
      EnumDeviceDrivers 的返回状态、结果数、空地址、系统构建和 SeDebugPrivilege，防止把成功调用误解成成功取得驱动事实。
    en: This strategy separates native utility or registry reads from API-level load-address enumeration. NJA-000251 detects
      driverquery, PnPUtil, and driver-related registry reads with host-role and maintenance tuning. NJA-000252 records EnumDeviceDrivers
      return state, result count, null addresses, OS build, and SeDebugPrivilege in a validated API sensor so a successful
      call is not mistaken for successful acquisition of driver facts.
