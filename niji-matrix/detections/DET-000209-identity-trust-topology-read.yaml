id: DET-000209
name:
  zh: 身份信任拓扑读取归属关联
  en: Identity Trust-Topology Read Attribution
summary:
  zh: 识别域、林或租户信任边读取，并与批准的健康、迁移和治理任务比较。
  en: Identify domain, forest, or tenant trust-edge reads and compare them with approved health, migration, and governance
    work.
description:
  paragraphs:
  - zh: 本策略以取得 partner、direction、type、attributes 或 reachability 为目标。NJA-000253 分析 nltest、PowerShell 和 AD 查询；NJA-000254 分析
      Microsoft Graph 跨租户 partner-policy 读取。两者仅把后继认证或横向移动作为独立加权上下文，不用后继结果替代发现行为本身。
    en: The objective is acquisition of trust partner, direction, type, attributes, or reachability. NJA-000253 analyzes nltest,
      PowerShell, and AD queries, while NJA-000254 analyzes Microsoft Graph cross-tenant partner-policy reads. Both use later
      authentication or lateral movement only as independent severity context rather than substituting a successor for the
      discovery behavior.
