schema_version: 2.0.0
type: detection-strategy
id: DET-000210
name:
  zh: 文件系统命名空间发现关联
  en: Filesystem Namespace Discovery Correlation
summary:
  zh: 识别异常路径、文件名和目录层级枚举，并与正文读取和后继处理分开。
  en: Identify abnormal path, filename, and directory-hierarchy enumeration separately from body reads and later processing.
description:
  paragraphs:
  - zh: 本策略只检测命名空间事实。NJA-000255 结合 Windows 进程、PowerShell、本地对象访问与 SMB 共享枚举；NJA-000256 结合 POSIX 进程和经配置的 audit syscall 或目录 watch。两者将后继
      open/read/copy/archive 作为可选上下文，不把名称列表等同于内容收集。
    en: This strategy detects namespace facts only. NJA-000255 combines Windows process, PowerShell, local object access,
      and SMB share enumeration. NJA-000256 combines POSIX process events with configured audit syscall or directory watches.
      Both use later open, read, copy, or archive as optional context without equating a name list with content collection.
