schema_version: 2.0.0
type: detection-strategy
id: DET-000211
name:
  zh: 内部远程服务连接—会话—目标动作谱系
  en: Internal Remote-Service Connection-to-Session-to-Target-Action Lineage
summary:
  zh: 连接内部远程认证、目标会话和首个目标动作，并重建中继前的真实控制端。
  en: Join internal remote authentication, destination session, and first target action while reconstructing the true controller
    before an intermediary.
description:
  paragraphs:
  - zh: 关联已接受的内部远程认证、目标会话和首个目标动作；即使批准管理关系成立也继续检查来源受控证据，并对中继路径重建原始控制端到目标的双连接谱系。
    en: Join accepted internal remote authentication to destination session and first target action, continue checking source
      compromise even when an approved management relationship matches, and reconstruct the two-connection lineage from original
      controller to destination for intermediary paths.
  - zh: DET-000053/NJA-000027 判断身份和入口操作者，DET-000094/NJA-000071 判断外部会话状态重放与风险情境，均没有内部主体—来源角色—目标—服务—动作关系或 relay 双侧会话。DET-000191/NJA-000214
      只在 relay 造成禁止域间桥接时成立，不能覆盖批准跳板被未授权操作者借用。
    en: DET-000053/NJA-000027 assesses identity and entry operator, while DET-000094/NJA-000071 assesses external session-state
      replay and risk context. Neither owns the internal principal-to-source-role-to-destination-to-service-to-action relationship
      or bilateral relay sessions. DET-000191/NJA-000214 applies only to a prohibited inter-domain bridge and cannot cover
      an approved jump path used by an unauthorized controller.
