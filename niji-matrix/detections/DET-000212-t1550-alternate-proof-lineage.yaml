schema_version: 2.0.0
type: detection-strategy
id: DET-000212
name:
  zh: 替代证明验证—新上下文—横向结果谱系
  en: Alternate-Proof Validation–Fresh Context–Lateral Outcome Lineage
summary: &id001
  zh: 将当前替代证明验证或派生请求连接到新的登录/令牌及另一内部资源结果，识别材料有效但实际操作者与原认证主体分离的事务。
  en: Join current alternate-proof validation or derivation to a fresh logon or token and an outcome on another internal resource,
    identifying transactions in which valid material is operated by someone other than the original authenticator.
description:
  paragraphs:
  - *id001
  - zh: DET-000053/NJA-000027 已覆盖资源直接接受 existing session/token 的续用、操作者和资源结果，建议扩展它检测 T1550 父级的 resource-local 分支；本新策略只处理当前
      verifier/KDC/token endpoint 产生 fresh context/proof 的分支。DET-000206 处理材料取得和撤销传播，不能替代使用阶段的 presentation/validation。
    en: DET-000053 and NJA-000027 already cover resource-local continuation of an existing session or token with operator
      and resource outcome and should be extended to detect the T1550 parent resource-local branch. This new strategy covers
      only the branch in which a current verifier, KDC, or token endpoint creates a fresh context or proof. DET-000206 owns
      material acquisition and revocation propagation and cannot substitute for presentation and validation at use time.
