schema_version: 2.0.0
type: detection-strategy
id: DET-000213
name:
  zh: 业务服务控制到可用性结果谱系
  en: Business-Service Control to Availability-Outcome Lineage
summary:
  zh: 连接服务停止调用者、状态转换、审批与独立业务健康，识别看似维护的恶意中断。
  en: Join service-stop caller, state transition, approval, and independent business health to identify malicious
    interruption resembling maintenance.
description:
  paragraphs:
  - zh: 本策略面向业务服务停止，不因一个 stopped 状态单独告警。Analytic 恢复命令或 API 调用进程、主体与会话、SERVICE_STOP 权限、服务状态序列和业务健康结果，并与变更单及服务 owner
      比较。防御工具和恢复服务按各自 owner 处理。
    en: This strategy covers business-service stopping without alerting on a stopped state alone. The analytic recovers
      command or API caller process, principal and session, SERVICE_STOP authority, service-state sequence, and business-health
      outcome and compares change ticket and service owner. Defensive and recovery services retain their own owners.
