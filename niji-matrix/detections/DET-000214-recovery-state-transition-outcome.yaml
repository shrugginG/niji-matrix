schema_version: 2.0.0
type: detection-strategy
id: DET-000214
name:
  zh: 恢复状态转换与结果关联
  en: Recovery-State Transition and Outcome Correlation
summary:
  zh: 连接恢复控制动作、恢复对象/策略结果和受保护资源覆盖，识别直接与延迟恢复抑制。
  en: Join recovery-control action, recovery object or policy outcome, and protected-resource coverage to identify
    direct and deferred recovery inhibition.
description:
  paragraphs:
  - zh: 该策略以恢复职责为确认门槛，使用 Windows 状态差和 AWS Backup 生命周期两套 Analytic。命令/API/策略变化先产生企图或事前风险，只有恢复副本、配置、RPO 或恢复测试结果下降才确认；生产当前数据状态不替代恢复结果。
    en: This strategy uses recovery role as the confirmation gate and separate Windows state-differential and AWS
      Backup lifecycle analytics. Commands, APIs, or policy changes first create an attempt or pre-impact risk; only
      reduced copies, configuration, RPO, or restore-test outcome confirms. Current production-data state does not
      replace a recovery outcome.
