schema_version: 2.0.0
type: detection-strategy
id: DET-000215
name:
  zh: 批准发布状态至实际展示谱系
  en: Approved Publication State to Observed Display Lineage
summary:
  zh: 比较批准发布、名称绑定和实际展示，确认未经授权可见变化并定位内容源或解析控制面。
  en: Compare approved publication, name binding, and actual display to confirm unauthorized visible change and locate
    the content-source or resolution control plane.
description:
  paragraphs:
  - zh: 策略使用发布输出差分与绑定到输出谱系两个 Analytic。第一个确认实际人类可见结果与批准 release 不一致，并定位规范源是否修改；第二个在规范源干净时连接注册/DNS 变化、跨解析器答案、TLS/HTTP
      内容与替代页面。站点攻陷或 DNS 变化没有可见结果时不确认。
    en: The strategy uses publication-output differential and binding-to-output lineage analytics. The first confirms
      human-visible output differs from the approved release and locates whether the canonical source changed. The
      second joins registrar or DNS change, cross-resolver answers, TLS/HTTP content, and substitute page when the
      origin remains clean. Site compromise or DNS change without visible result is not confirmed.
