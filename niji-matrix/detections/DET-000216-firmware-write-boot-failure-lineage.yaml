schema_version: 2.0.0
type: detection-strategy
id: DET-000216
name:
  zh: 固件写入—启动失败—外部证据谱系
  en: Firmware Write–Boot Failure–External Evidence Lineage
summary:
  zh: 连接固件写入前痕迹、重启消费、证明/POST/心跳失败和离线读回，区分恶意破坏与更新故障。
  en: Join pre-corruption firmware-write traces, reboot consumption, attestation or POST or heartbeat failure, and
    offline readback to distinguish malicious corruption from update failure.
description:
  paragraphs:
  - zh: 策略确认固件对象、攻击者控制的写入、实际消费和 no-boot/组件不可用结果，并要求一个不同权观察面。Analytic 把进程/驱动和 ESRT 状态连接到重启后的证明、BMC/串口与心跳，再以恢复读回验证。只有可写性、包暂存或一次启动失败不确认。
    en: The strategy confirms a firmware object, attacker-controlled write, actual consumption, and no-boot or component-unavailability
      outcome and requires a differently authorized observation plane. The analytic joins process, driver, and ESRT
      state to post-reboot attestation, BMC or serial, and heartbeat and verifies with recovery readback. Writeability,
      staged package, or one boot failure alone does not confirm.
