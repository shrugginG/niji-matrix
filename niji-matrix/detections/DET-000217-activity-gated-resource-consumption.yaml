schema_version: 2.0.0
type: detection-strategy
id: DET-000217
name:
  zh: 活动状态—资源消费者负相关
  en: Activity-State to Resource-Consumer Negative Correlation
summary:
  zh: 识别消费者随用户或业务活动上升而暂停、空闲后恢复的闭环资源使用。
  en: Identify a resource consumer that pauses as user or business activity rises and resumes after idle in a closed
    loop.
description:
  paragraphs:
  - zh: 策略覆盖资源劫持父级端点路径与活动门控子项。Analytic 不依赖一次高 CPU 峰值，而连接进程 lineage、GPU/CPU 计数、会话/输入活动、进程启停和网络输出；实际资源 owner 与批准任务决定是否未授权。提供方服务消费由另一策略处理。
    en: This strategy covers the endpoint path of Resource Hijacking and the activity-gated child. The analytic does
      not rely on one high-CPU spike and joins process lineage, GPU or CPU counters, session or input activity, process
      stop and start, and network output. Resource owner and approved job determine authorization. A separate strategy
      covers provider consumption.
