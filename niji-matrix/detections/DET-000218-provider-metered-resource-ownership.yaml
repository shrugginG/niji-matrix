schema_version: 2.0.0
type: detection-strategy
id: DET-000218
name:
  zh: 提供方计量事务与资源所有权关联
  en: Provider-Metered Transaction and Resource-Ownership Correlation
summary:
  zh: 连接云或消息提供方成功交易、调用主体、目标、用量和 owner，发现主机外的未授权资源消耗。
  en: Join successful cloud or messaging-provider transactions, caller, target, usage, and owner to find unauthorized
    consumption outside hosts.
description:
  paragraphs:
  - zh: 策略覆盖父级托管服务路径与提供方代理子项，分别用 Bedrock 和 Twilio Analytic 展示不同真实字段。两者共享确认门槛：提供方成功执行/计量、受害账户承担资源结果、主体/入口无法映射批准用途。成本告警只作延迟支持。
    en: 'This strategy covers the parent managed-service path and provider-brokered child and uses distinct Bedrock
      and Twilio analytics with real fields. Both share the confirmation gate: successful provider execution or metering,
      resource outcome on the victim account, and a principal or entry that cannot map to approved purpose. Cost alerts
      are delayed support only.'
