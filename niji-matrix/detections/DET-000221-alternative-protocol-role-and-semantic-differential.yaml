schema_version: 2.0.0
type: detection-strategy
id: DET-000221
name:
  zh: 替代协议角色、载荷与内容可见性关联
  en: Alternative-Protocol Role Payload and Content-Visibility Correlation
summary:
  zh: 将资产角色、受管协议路径、事务语义、内容可见性和端点数据谱系关联，以识别不同于既有 C2 的外传。
  en: Join asset role, managed protocol path, transaction semantics, content visibility, and endpoint data lineage
    to identify exfiltration distinct from existing C2.
description:
  paragraphs:
  - zh: 本策略用三项分析分工。角色偏离分析确认谁绕过了受管解析器、代理或中继；协议语义分析在 DNS、邮件和 HTTP 等事务内恢复隐藏载荷；不透明传输分析在无法读取内容时把敏感文件访问与 TLS/SSH 元数据、方向字节和接收端连接起来。三项都要求与已知
      C2 关系比较，并保留普通管理、备份、更新、遥测和内容分发解释。
    en: Three analytics divide the work. Role deviation establishes who bypassed a managed resolver, proxy, or relay.
      Protocol semantics reconstructs hidden payload inside DNS, mail, HTTP, or another transaction. Opaque transfer
      joins sensitive-file access to TLS or SSH metadata, directional bytes, and receiver when content is unavailable.
      All three compare against the known C2 relationship and preserve administrative, backup, update, telemetry,
      and content-distribution explanations.
