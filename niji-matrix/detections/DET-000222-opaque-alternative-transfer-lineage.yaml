schema_version: 2.0.0
type: detection-strategy
id: DET-000222
name:
  zh: 替代加密传输的端点—会话谱系
  en: Endpoint-to-Session Lineage for Opaque Alternative Transfer
summary:
  zh: 把敏感源读取与不可检查替代会话及出站字节连接，避免把密文流量本身等同恶意。
  en: Join sensitive source reads to opaque alternative sessions and outbound bytes without treating ciphertext
    alone as malicious.
description:
  paragraphs:
  - zh: 本策略要求端点先出现敏感文件访问或可疑归档读取，再由同一进程或稳定进程谱系建立 SFTP、SSH、TLS 等替代外传会话。NJA-000274 使用握手、目的地、方向字节和进程信息验证关系，并将合法管理、备份与开发传输作为显式反例；没有源侧谱系时只输出加密会话候选。
    en: The strategy requires a sensitive file read or suspicious archive access at the endpoint before the same
      process or stable lineage establishes an alternative SFTP, SSH, TLS, or comparable session. NJA-000274 validates
      the relation through handshake, destination, directional bytes, and process evidence while treating administration,
      backup, and development transfer as explicit counterexamples. Without source-side lineage it emits only an
      opaque-session lead.
