id: DET-000223
name:
  zh: 既有 C2 关系内敏感读取与出站相位关联
  en: Sensitive-Read and Outbound-Phase Correlation Inside an Existing C2 Relationship
summary:
  zh: 在不要求出现新目的地或新连接的条件下，把敏感数据访问与同一进程、控制端及协议关系中的出站增量或控制消息变化连接起来。
  en: Join sensitive-data access to outbound growth or control-message change inside the same process-controller-protocol
    relationship without requiring a new destination or connection.
description:
  paragraphs:
  - zh: 在不要求出现新目的地或新连接的条件下，把敏感数据访问与同一进程、控制端及协议关系中的出站增量或控制消息变化连接起来。 关联分析 NJA-000275、NJA-000276 分别验证目标行为的关键结果，未满足结果门时保留为候选线索。
    en: Join sensitive-data access to outbound growth or control-message change inside the same process-controller-protocol
      relationship without requiring a new destination or connection. Linked analytics NJA-000275, NJA-000276 validate
      the behavior-specific outcomes and retain a lead when the outcome gate is not met.
