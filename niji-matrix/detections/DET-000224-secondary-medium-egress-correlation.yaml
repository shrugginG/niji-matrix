name:
  zh: 替代接口路径—外送结果关联
  en: Alternate-Interface Path–Egress Outcome Correlation
summary:
  zh: 连接接口或近距 peer 生命周期、发起进程、敏感数据访问、方向字节与主要出口覆盖差分，分级识别旁路网络外传。
  en: Join interface or proximity-peer lifecycle, initiating process, sensitive-data access, directional bytes,
    and verified primary-egress differential to grade bypass-network exfiltration.
description:
  paragraphs:
  - zh: 连接接口或近距 peer 生命周期、发起进程、敏感数据访问、方向字节与主要出口覆盖差分，分级识别旁路网络外传。 关联分析 NJA-000277、NJA-000278 分别验证目标行为的关键结果，未满足结果门时保留为候选线索。
    en: Join interface or proximity-peer lifecycle, initiating process, sensitive-data access, directional bytes,
      and verified primary-egress differential to grade bypass-network exfiltration. Linked analytics NJA-000277,
      NJA-000278 validate the behavior-specific outcomes and retain a lead when the outcome gate is not met.
