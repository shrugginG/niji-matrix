schema_version: 2.0.0
type: detection-strategy
id: DET-000225
name:
  zh: 介质写入—断开—保管—接续谱系
  en: Media Write–Disconnect–Custody–Continuation Lineage
summary:
  zh: 将敏感数据访问与介质文件或原始区域写入、设备断开、保管变化及另一系统取用连接起来，不把单次设备插入升级为外传。
  en: Join sensitive-data access to file or raw-region writes on media, device disconnection, custody change, and
    retrieval on another system without promoting a single device insertion to exfiltration.
description:
  paragraphs:
  - zh: 将敏感数据访问与介质文件或原始区域写入、设备断开、保管变化及另一系统取用连接起来，不把单次设备插入升级为外传。 关联分析 NJA-000279、NJA-000280 分别验证目标行为的关键结果，未满足结果门时保留为候选线索。
    en: Join sensitive-data access to file or raw-region writes on media, device disconnection, custody change,
      and retrieval on another system without promoting a single device insertion to exfiltration. Linked analytics
      NJA-000279, NJA-000280 validate the behavior-specific outcomes and retain a lead when the outcome gate is
      not met.
