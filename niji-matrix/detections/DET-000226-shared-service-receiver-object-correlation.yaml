schema_version: 2.0.0
type: detection-strategy
id: DET-000226
name:
  zh: 端点源数据—服务接收者—对象生命周期关联
  en: Endpoint Source Data to Service Receiver and Object Lifecycle Correlation
summary:
  zh: 将端点敏感读取和上传与服务内接收命名空间及对象生命周期连接，识别可信域后的真实外传接收者。
  en: Join endpoint sensitive reads and uploads to service-internal receiver namespaces and object lifecycles to
    identify the real exfiltration receiver behind a trusted domain.
description:
  paragraphs:
  - zh: 本策略用两项分析分工。接收者分析把 provider 与 tenant/account/chat/repo/webhook 分开，要求未批准命名空间与端点敏感源数据同时成立；对象分析跟踪 create/write/visibility/share/read/download/delete，将上传和攻击者读取恢复为同一对象链。服务域、TLS、官方客户端或单次对象事件均不能独立确认外传。
    en: Two analytics divide the work. Receiver analysis separates provider from tenant, account, chat, repository,
      and webhook and requires both an unapproved namespace and sensitive endpoint source data. Object analysis
      follows create, write, visibility, share, read, download, and delete to reconstruct uploader and adversary
      retrieval as one object chain. Service domain, TLS, an official client, or one object event does not independently
      confirm exfiltration.
