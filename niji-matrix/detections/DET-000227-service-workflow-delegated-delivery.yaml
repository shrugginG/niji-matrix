schema_version: 2.0.0
type: detection-strategy
id: DET-000227
name:
  zh: SaaS 工作流配置—敏感触发—外部交付谱系
  en: SaaS Workflow Configuration to Sensitive Trigger and External Delivery Lineage
summary:
  zh: 连接 Webhook/集成的版本化配置、敏感事件范围与服务端外部交付，确认由 SaaS 代理的外传。
  en: Join versioned webhook or integration configuration, sensitive event scope, and service-side external delivery
    to confirm SaaS-mediated exfiltration.
description:
  paragraphs:
  - zh: 本策略要求配置、授权和结果三层证据。分析先判断谁创建或修改工作流、获得哪些 scopes、指向何处，再核对敏感事件或对象触发及 SaaS 到外部端点的 request/delivery。只有配置而无交付保持
      exposure，只有外部请求而无租户配置保持 receiver-side candidate；两者与敏感 scope 同时成立才确认。
    en: This strategy requires configuration, authorization, and outcome evidence. The analytic first determines
      who created or modified the workflow, which scopes it obtained, and where it points, then checks a sensitive
      event or object trigger and the SaaS-to-outside request or delivery. Configuration without delivery remains
      exposure, and an outside request without tenant configuration remains a receiver-side candidate. Confirmation
      requires both plus sensitive scope.
