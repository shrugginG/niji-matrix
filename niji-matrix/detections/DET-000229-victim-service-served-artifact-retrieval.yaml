schema_version: 2.0.0
type: detection-strategy
id: DET-000229
name:
  zh: 受害服务产物—外部取回谱系
  en: Victim-Service Artifact-to-External-Retrieval Lineage
summary:
  zh: 连接可服务目录中的异常产物、创建主体与外部成功响应，确认拉取式外传。
  en: Join an unusual artifact in a served location, its creator, and a successful external response to confirm
    pull-style exfiltration.
description:
  paragraphs:
  - zh: 本策略以文件/对象到 URI 的发布关系为中心，不把一次大响应或 Web 根目录文件单独视为外传。分析需证明敏感产物由未批准进程或账号产生、进入可对外访问路径，并由外部客户端在相关窗口成功取回；部署、合法导出、公开下载和
      CDN 发布须以工单及内容来源排除。
    en: This strategy centers on the publication relationship from file or object to URI and does not treat one
      large response or a web-root file as exfiltration alone. The analytic must establish that a sensitive artifact
      was generated by an unapproved process or account, entered an externally served path, and was successfully
      retrieved by an outside client in the relevant window. Deployment, authorized export, public download, and
      CDN publication require ticket and content-provenance exclusions.
