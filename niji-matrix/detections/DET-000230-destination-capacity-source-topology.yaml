schema_version: 2.0.0
type: detection-strategy
id: DET-000230
name:
  zh: 目的容量与来源拓扑关联
  en: Destination Capacity and Source-Topology Correlation
summary:
  zh: 跨流量域连接目的容量、来源分布和无请求响应，识别低贡献多源或反射网络 DoS。
  en: Join destination capacity, source distribution, and unmatched responses across traffic domains to identify low-contribution
    multi-source or reflected network DoS.
description:
  paragraphs:
  - zh: Strategy 以网络容量与合法通信失败为结果门，分别用聚合来源和无请求反射两个 Analytic。共享 IPFIX 与 IF-MIB 数据，但前者聚合真实来源 fan-in，后者验证 visible responder
      与 victim 请求不匹配；协议字段不可通用替换。
    en: The strategy uses network capacity and legitimate-communication failure as the outcome gate and separate aggregate-source
      and unmatched-reflection analytics. They share IPFIX and IF-MIB, while the former aggregates real-origin fan-in
      and the latter verifies visible responders unmatched to victim requests; protocol fields are not universally
      interchangeable.
