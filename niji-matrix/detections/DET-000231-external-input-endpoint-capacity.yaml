schema_version: 2.0.0
type: detection-strategy
id: DET-000231
name:
  zh: 外部输入到端点容量与可用性
  en: External Input to Endpoint Capacity and Availability
summary:
  zh: 连接入口请求、内部连接/工作/CPU 成本和独立健康，发现低流量状态保持或输入成本放大。
  en: Join ingress requests, internal connection or worker or CPU cost, and independent health to detect low-traffic
    state holding or input-cost amplification.
description:
  paragraphs:
  - zh: Strategy 分开处理未完成状态积累和已完成输入的高内部代价。两者共享 availability 门，但第一个消费连接 progress/age 与池容量，第二个消费 route/input 与 per-request
      work/crash；高流量普通耗尽由父级聚合逻辑覆盖。
    en: The strategy separates incomplete-state accumulation from high internal cost of completed inputs. Both share
      an availability gate, while the first consumes connection progress and age plus pool capacity and the second
      route and input plus per-request work or crash. Ordinary high-volume exhaustion is parent-level context.
