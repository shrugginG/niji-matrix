schema_version: 2.0.0
type: detection-strategy
id: DET-000232
name:
  zh: 生命周期控制权威至可用性结果谱系
  en: Lifecycle Authority to Availability-Outcome Lineage
summary:
  zh: 连接本地请求者、未来任务或外部管理面动作到实际关机/重启和合法访问中断。
  en: Join local requester, future task, or external management-plane action to actual shutdown or reboot and legitimate-access
    interruption.
description:
  paragraphs:
  - zh: Strategy 用三条 Analytic 分离 immediate local、deferred scheduler 和 external hypervisor/cloud 路径。确认门是攻击者控制 lifecycle
      action、实际 boot/power transition 和 availability 结果；reason、命令或 guest heartbeat alone 不确认。
    en: The strategy uses three analytics for immediate local, deferred scheduler, and external hypervisor or cloud
      paths. Confirmation requires attacker-controlled lifecycle action, actual boot or power transition, and availability
      outcome; reason, command, or guest heartbeat alone does not confirm.
