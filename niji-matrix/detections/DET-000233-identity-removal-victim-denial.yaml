schema_version: 2.0.0
type: detection-strategy
id: DET-000233
name:
  zh: 身份状态撤除到合法主体访问失败
  en: Identity-State Removal to Legitimate-Principal Access Failure
summary:
  zh: 连接认证器或授权边的负向变化与合法 owner 登录/资源 deny，确认账户访问移除。
  en: Join negative authenticator or authorization-edge mutations to legitimate-owner sign-in or resource denial to
    confirm Account Access Removal.
description:
  paragraphs:
  - zh: Strategy 使用认证器置换与授权边撤除两个 Analytic。两者共享 existing principal、未经批准 mutation 和 post-state failure 门；前者终态是认证失败，后者是认证成功但资源
      deny，数据与恢复路径不可互换。
    en: The strategy uses authenticator-displacement and authorization-edge eviction analytics. Both share existing
      principal, unapproved mutation, and post-state failure gates; the former ends at authentication failure and
      the latter at successful authentication plus resource denial, with non-interchangeable data and recovery.
