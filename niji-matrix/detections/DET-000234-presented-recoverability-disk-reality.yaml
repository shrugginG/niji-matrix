schema_version: 2.0.0
type: detection-strategy
id: DET-000234
name:
  zh: 呈现可恢复性与磁盘真实状态差分
  en: Presented Recoverability versus Disk Reality
summary:
  zh: 比较勒索/解密呈现、key/ID 保存语义和真实块破坏，发现不可恢复擦除被错误分类。
  en: Compare ransom or decryption presentation, key or ID retention semantics, and actual block destruction to detect
    irreversible wiping misclassified as recoverable.
description:
  paragraphs:
  - zh: Strategy 不因 ransom note alone 判定 wipe。Analytic 连接勒索工件、样本 key/IV/ID 生成与持久化、恢复函数可达性、raw block/metadata 差和安全恢复测试；呈现宣称可恢复而实际无材料/结构毁坏时确认子项。
    en: The strategy never infers wiping from a ransom note alone. The analytic joins ransom artifacts, sample key,
      IV, or ID generation and retention, recovery-function reachability, raw block or metadata differences, and safe
      recovery tests; it confirms when presentation claims recoverability while actual materials are absent or structures
      destroyed.
