schema_version: 2.0.0
type: detection-strategy
id: DET-000235
name:
  zh: 写入者—业务语义—表示—结果谱系
  en: Writer–Business Semantics–Representation–Outcome Lineage
summary:
  zh: 连接业务对象 before/after、writer、语义不变量、跨表示 digest 和下游结果，识别合形操纵与表示分歧。
  en: Join business-object before and after state, writer, semantic invariants, cross-representation digests, and
    downstream outcomes to identify conforming manipulation and representation divergence.
description:
  paragraphs:
  - zh: Strategy 使用累计业务合形和跨表示对账两个 Analytic。第一条从 CDC/DB span 到业务规则与长期关系，第二条从同一 object ID 的 DB/message/document/UI/receipt
      到差异和 action；语法有效或单面一致不确认。
    en: The strategy uses cumulative business-conforming and cross-representation reconciliation analytics. The first
      joins CDC or DB spans to business rules and long-lived relations; the second joins DB, message, document, UI,
      or receipt representations of one object ID to divergence and action. Valid syntax or one-surface consistency
      does not confirm.
