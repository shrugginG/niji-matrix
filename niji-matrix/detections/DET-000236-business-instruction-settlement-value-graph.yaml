schema_version: 2.0.0
type: detection-strategy
id: DET-000236
name:
  zh: 业务指令到结算与后继价值图
  en: Business Instruction to Settlement and Successor Value Graph
summary:
  zh: 连接付款指令、受益人、rail 状态、受害扣账、受益入账和后继价值图，确认金融盗窃及两个匿迹变量。
  en: Join payment instruction, beneficiary, rail state, victim debit, beneficiary credit, and successor value graph
    to confirm Financial Theft and its two stealth variables.
description:
  paragraphs:
  - zh: Strategy 把完成结算作为硬门，使用受益账户替换与价值分散两个 Analytic。第一条重建 instruction/master/confirmation 到 ACSC 与 debit/credit，第二条从首次恶意入账构建
      successor graph；pending/RJCT 或只有指令不确认。
    en: The strategy uses completed settlement as a hard gate and separate beneficiary-substitution and value-dispersion
      analytics. The first reconstructs instruction, master, and confirmation through ACSC and debit or credit. The
      second builds a successor graph from initial malicious credit. Pending or RJCT states or instruction alone do
      not confirm.
