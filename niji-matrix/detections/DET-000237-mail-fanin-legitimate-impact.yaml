id: DET-000237
name:
  zh: 收件人邮件扇入至合法通信影响谱系
  en: Recipient Mail Fan-In to Legitimate-Communication Impact Lineage
summary:
  zh: 连接 recipient fan-in、合法发送者分布、关键消息与读取/业务 action，以及 transport/receive-limit 结果，确认邮件轰炸影响。
  en: Join recipient fan-in, legitimate-sender distribution, consequential messages and read or business action, and
    transport or receive-limit outcomes to confirm Email Bombing impact.
description:
  paragraphs:
  - zh: Strategy 用三项 Analytic 分离 recipient attention、关键消息埋没和 transport/mailbox availability。邮件量先形成候选，只有合法通信处理、SLA、投递/接收限额或业务结果受损才确认；phishing
      内容和后继 vishing 独立。
    en: The strategy separates recipient attention, consequential-message burial, and transport or mailbox availability
      with three analytics. Volume first creates a candidate, and confirmation requires harmed legitimate handling,
      SLA, delivery or receive limits, or business outcome. Phishing content and later vishing remain separate.
