schema_version: 2.0.0
type: detection-strategy
id: DET-000238
name:
  zh: 中介路径双侧会话与路由权威关联
  en: Intermediary-Path Bilateral Session and Routing-Authority Correlation
summary:
  zh: 将端点、受管中介、边界、目标和提供方记录拼接为路径图，分别识别未批准转发、被攻陷出口归属借用、观察链分舱和跨层路由权威差。
  en: Join endpoint, managed-intermediary, boundary, target, and provider records into a path graph that separately identifies
    unauthorized forwarding, compromised-egress provenance borrowing, compartmented observation custody, and cross-layer
    routing-authority divergence.
description:
  paragraphs:
  - zh: 本策略把受管中介的双侧会话、第三方出口完整性与共享边缘路由权威作为三个独立分析分支。NJA-000305 证明一台受管节点同时接收入站腿并建立出站腿；NJA-000306 连接目标最后跳与第三方边缘设备的真实出站；NJA-000307
      在同一边缘请求内比较 DNS、TLS、HTTP 和提供方源站。每个分支都要求转发或路由结果，不能从代理工具名、住宅 IP 或 SNI/Host 差异单独定性。
    en: The strategy separates managed-intermediary bilateral sessions, third-party egress integrity, and shared-edge
      routing authority into three analytic branches. NJA-000305 proves a managed node receives one leg and establishes
      another. NJA-000306 links the victim last hop to real outbound traffic from a third-party edge device. NJA-000307
      compares DNS, TLS, HTTP, and provider origin within one edge request. Each branch requires a forwarding or routing
      outcome; proxy tool names, residential IPs, or an SNI-to-Host difference alone are insufficient.
