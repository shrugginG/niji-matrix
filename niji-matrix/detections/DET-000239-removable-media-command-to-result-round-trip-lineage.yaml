schema_version: 2.0.0
type: detection-strategy
id: DET-000239
name:
  zh: 可移动介质命令—结果往返谱系
  en: Removable-Media Command-to-Result Round-Trip Lineage
summary:
  zh: 以同一介质行程重建控制侧任务写入、受限侧读取/执行、结果写回、控制侧取用和后继外联，区分 C2 闭环与传播、单向外传及正常离线交换。
  en: Reconstruct control-side task write, restricted-side read or execution, result write, control-side consumption,
    and subsequent egress through the same media trips, separating a C2 loop from propagation, one-way exfiltration,
    and normal offline exchange.
description:
  paragraphs:
  - zh: 本策略以同一介质在控制侧与受限侧之间的完整行程为分析单位。NJA-000308 验证任务写入、受限端执行、结果写回与控制侧消费四门；NJA-000309 检查身份信箱、遍历标记和原始区域差分是否使同一介质只在正确主机与角色处理任务。传播、单向外传和批准的离线交换分别保留为不同结果。
    en: 'The strategy uses one complete media trip between control and restricted sides as its analytic unit. NJA-000308
      verifies four gates: task write, restricted-side execution, result write, and control-side consumption. NJA-000309
      checks identity mailboxes, traversal markers, and raw-region changes that make the same medium process tasks only
      on the intended host and role. Propagation, one-way exfiltration, and approved offline exchange remain separate
      outcomes.'
