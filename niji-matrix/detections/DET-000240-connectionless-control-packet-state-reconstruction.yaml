schema_version: 2.0.0
type: detection-strategy
id: DET-000240
name:
  zh: 无连接控制分组状态重建
  en: Connectionless Control Packet State Reconstruction
summary:
  zh: '>- 从 ICMP/UDP 原始分组、双向流与进程套接字重建攻击者自定义会话，把轮询、命令、分片结果和后继执行连接为控制往返。'
  en: '>- Reconstruct attacker-defined sessions from raw ICMP or UDP packets, bidirectional flows, and process sockets,
    linking polls, tasks, fragmented results, and successor execution into a control round trip.'
description:
  paragraphs:
  - zh: 本策略重建无连接承载上的攻击者会话，而不把 ICMP 或 UDP 本身视为恶意。NJA-000310 连接 Echo 请求/回复中的自定义标识、序号、长度与端点动作；NJA-000311 对未解析 UDP 的类型、session
      ID、请求回复进展和进程 socket 作同样验证。只有完整轮询—任务—结果序列或可复核的重复周期才确认控制。
    en: The strategy reconstructs attacker sessions over connectionless carriage without treating ICMP or UDP as malicious.
      NJA-000310 joins custom identifiers, sequence, length, and endpoint action across Echo requests and replies. NJA-000311
      applies equivalent checks to unparsed UDP type, session ID, request-response progression, and process sockets.
      Control is confirmed only by a complete poll-task-result sequence or a reproducible repeated cycle.
