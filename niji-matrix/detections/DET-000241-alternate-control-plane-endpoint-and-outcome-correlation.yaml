schema_version: 2.0.0
type: detection-strategy
id: DET-000241
name:
  zh: 替代控制平面端点与结果关联
  en: Alternate-Control-Plane Endpoint and Outcome Correlation
summary:
  zh: '>- 对 VMCI/vsock 与 AMT SOL 等不进入主机 IP 栈的通道，连接平台配置、会话主体、宿主/来宾身份和命令后结果，识别未授权控制。'
  en: '>- For VMCI or vsock and AMT SOL channels outside the host IP stack, join platform configuration, session principal,
    host or guest identity, and post-command outcomes to identify unauthorized control.'
description:
  paragraphs:
  - zh: 本策略覆盖绕开主机 IP 栈的宿主—来宾与带外管理控制面。NJA-000312 将 VMCI/vsock 的 CID、port、VIB、宿主和来宾进程连接到命令结果；NJA-000313 将 AMT SOL 会话主体、固件审计和本地虚拟串口消费者连接。缺少平台审计时仅能报告观察缺口，不能把无网络流量等同恶意。
    en: The strategy covers host-to-guest and out-of-band management planes outside the host IP stack. NJA-000312 joins
      VMCI or vsock CID, port, VIB, host and guest processes to command outcomes. NJA-000313 joins AMT SOL principals,
      firmware audit, and local virtual-serial consumers. Without platform audit, report an observation gap rather than
      treating absent network flow as malicious.
