schema_version: 2.0.0
type: detection-strategy
id: DET-000242
name:
  zh: 服务控制命名空间—对象生命周期—端点结果关联
  en: Service Control Namespace to Object Lifecycle and Endpoint Outcome Correlation
summary:
  zh: 将端点 API 请求解析到真实 service tenant/account/app/token/resource，并连接任务对象生命周期与命令/载荷执行，识别合法 provider 背后的 C2。
  en: Resolve endpoint API requests to the real service tenant, account, application, token, and resource and join task-object
    lifecycle to command or payload execution, identifying C2 behind a legitimate provider.
description:
  paragraphs:
  - zh: 本策略先把知名服务域解析到真实 tenant、account、app、token 和 resource，再恢复持久对象的任务生命周期。NJA-000314 判断允许 provider 背后的命名空间是否获批并连接端点结果；NJA-000315
      连接对象创建/更新、植入读取、命令执行、结果回写和删除。外部租户无审计时保留 unresolved 状态，不能从服务域名或单个对象读取确认 C2。
    en: The strategy first resolves a known service domain to the real tenant, account, application, token, and resource,
      then reconstructs persistent task-object lifecycle. NJA-000314 tests whether the namespace behind an allowed provider
      is approved and joins endpoint outcomes. NJA-000315 links object creation or update, implant read, command execution,
      result write-back, and deletion. Outside tenants without audit remain unresolved; a service domain or one object
      read cannot confirm C2.
