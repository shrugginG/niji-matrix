schema_version: 2.0.0
type: detection-strategy
id: DET-000243
name:
  zh: 引导材料到操作通道的交接谱系
  en: Bootstrap Material to Operational Channel Handoff Lineage
summary:
  zh: 将第一阶段响应中的地址、选择、配置或载荷，与同一设备/进程谱系上的第二目的地连接和操作结果关联，识别非失败触发的能力阶段转换。
  en: Join addresses, selection, configuration, or payloads from a first-stage response to a second-destination connection
    and operational outcome on the same device or process lineage, identifying capability-stage transitions not triggered
    by failure.
description:
  paragraphs:
  - zh: 本策略识别能力阶段的非失败式通道交接。NJA-000316 从第一阶段响应恢复地址、选择、配置或载荷材料并连接新目的地/进程；NJA-000317 比较长期自动轮询与被选主机的独立交互会话。只有相同设备或进程谱系上出现第二通道和操作结果时才确认阶段转换。
    en: The strategy identifies capability-stage channel handoff not triggered by failure. NJA-000316 recovers address,
      selection, configuration, or payload material from the first-stage response and joins a new destination or process.
      NJA-000317 compares long-running automated polling with a selected host’s independent interactive session. Stage
      transition is confirmed only when a second channel and operational outcome appear on the same device or process
      lineage.
