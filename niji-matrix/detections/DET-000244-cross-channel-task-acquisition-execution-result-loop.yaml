schema_version: 2.0.0
type: detection-strategy
id: DET-000244
name:
  zh: 任务取得—本地执行—结果回传跨通道闭环
  en: Cross-Channel Task Acquisition–Execution–Result Loop
summary:
  zh: 把任务/组件取得、本地脚本或进程结果与另一目的地的结果回传连接成闭环，发现单通道分析缺失的功能分工。
  en: Close the loop among task or component acquisition, local script or process outcomes, and result return to another
    destination, exposing functional roles missed by single-channel analysis.
description:
  paragraphs:
  - zh: 本策略把任务或组件取得、本地执行和不同目的地的结果回传闭合为一个功能分工链。NJA-000318 同时要求任务来源、进程/脚本结果、异目的地回传和可连接的 victim/task 标识。普通企业代理先取作业再上传遥测属于反例，单纯存在两个目的地不确认功能分离。
    en: The strategy closes task or component acquisition, local execution, and return to a different destination into
      one functional-role chain. NJA-000318 requires task source, process or script outcome, cross-destination return,
      and a joinable victim or task identifier. Ordinary enterprise agents fetching jobs and uploading telemetry are
      counterexamples; two destinations alone do not confirm functional separation.
