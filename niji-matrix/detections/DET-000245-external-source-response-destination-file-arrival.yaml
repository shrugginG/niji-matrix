schema_version: 2.0.0
type: detection-strategy
id: DET-000245
name:
  zh: 外部来源响应—目标文件到达谱系
  en: External Source Response to Destination File Arrival Lineage
summary:
  zh: 将外部请求与响应、发起进程、网络文件标识、目标文件创建和批准下载范围连接，确认入站工具/文件实际到达并区分异常 provenance。
  en: Join external requests and responses, initiating process, network file identity, destination file creation, and
    approved-download scope to confirm actual ingress arrival and distinguish abnormal provenance.
description:
  paragraphs:
  - zh: ('本策略是 NJT-0130 的外部入站分支，将外部请求/响应、发起进程、网络文件标识和目标文件创建连接，分别保留 request_only、response_observed、arrival_confirmed 与
      arrival_executed。它与 DET-000139 的内部 SMB 分支并列，二者共享独立文件到达结果门但使用不同原始数据。', 'This strategy is the external-ingress branch
      for NJT-0130. It joins outside request or response, initiating process, network file identity, and destination
      file creation while keeping request_only, response_observed, arrival_confirmed, and arrival_executed distinct.
      It operates alongside the internal SMB branch DET-000139; both share the independent-file-arrival gate but use
      different raw data.')
    en: ('本策略是 NJT-0130 的外部入站分支，将外部请求/响应、发起进程、网络文件标识和目标文件创建连接，分别保留 request_only、response_observed、arrival_confirmed 与
      arrival_executed。它与 DET-000139 的内部 SMB 分支并列，二者共享独立文件到达结果门但使用不同原始数据。', 'This strategy is the external-ingress branch
      for NJT-0130. It joins outside request or response, initiating process, network file identity, and destination
      file creation while keeping request_only, response_observed, arrival_confirmed, and arrival_executed distinct.
      It operates alongside the internal SMB branch DET-000139; both share the independent-file-arrival gate but use
      different raw data.')
