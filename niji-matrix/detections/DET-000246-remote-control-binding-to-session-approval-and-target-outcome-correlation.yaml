schema_version: 2.0.0
type: detection-strategy
id: DET-000246
name:
  zh: 远控绑定—会话批准—目标结果关联
  en: Remote-Control Binding to Session Approval and Target Outcome Correlation
summary:
  zh: 分别重建远控 capability 的 controller 绑定、每次 session 的批准 workflow 和带外设备控制路径，并连接目标动作。
  en: Separately reconstruct controller binding of a remote-control capability, approval workflow of each session, and
    an out-of-band device control path, then join target actions.
description:
  paragraphs:
  - zh: ('本策略分别解析远控产品控制命名空间、实际会话与批准工作流，以及带外硬件观察面。NJA-000320 比较 provider 与 controller namespace 绑定，NJA-000321 把真实会话连接到
      ticket、操作者、目标、时间和权限，NJA-000322 连接 KVM/BMC/USB 资产与主机后果。仅安装工具、签名二进制或一个远程连接不确认恶意。', 'The strategy separately resolves
      remote-control provider-to-controller namespace binding, actual session-to-approved-workflow alignment, and out-of-band
      hardware visibility. NJA-000320 compares provider and controller-namespace binding. NJA-000321 joins real sessions
      to ticket, operator, target, time, and privilege. NJA-000322 joins KVM, BMC, or USB assets to host outcomes. Tool
      installation, a signed binary, or one remote connection alone does not confirm abuse.')
    en: ('本策略分别解析远控产品控制命名空间、实际会话与批准工作流，以及带外硬件观察面。NJA-000320 比较 provider 与 controller namespace 绑定，NJA-000321 把真实会话连接到
      ticket、操作者、目标、时间和权限，NJA-000322 连接 KVM/BMC/USB 资产与主机后果。仅安装工具、签名二进制或一个远程连接不确认恶意。', 'The strategy separately resolves
      remote-control provider-to-controller namespace binding, actual session-to-approved-workflow alignment, and out-of-band
      hardware visibility. NJA-000320 compares provider and controller-namespace binding. NJA-000321 joins real sessions
      to ticket, operator, target, time, and privilege. NJA-000322 joins KVM, BMC, or USB assets to host outcomes. Tool
      installation, a signed binary, or one remote connection alone does not confirm abuse.')
