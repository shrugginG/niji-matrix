schema_version: 2.0.0
type: detection-strategy
id: DET-000247
name:
  zh: 解析应答版本到端点消费关联
  en: Resolver-Answer Version to Endpoint Consumption Correlation
summary:
  zh: 将版本化 DNS 应答、同进程后继连接和基础设施历史连接起来，确认轮换地址或响应计算值实际成为 C2 endpoint。
  en: Join versioned DNS answers, successor connections by the same process, and infrastructure history to confirm that
    a rotated address or response-derived value actually becomes a C2 endpoint.
description:
  paragraphs:
  - zh: ('本策略要求 DNS/解析应答被同一进程实际消费为后继 C2。NJA-000323 把名称、应答池、TTL、进程连接、SNI/证书和控制结果接成时间谱系；NJA-000325 从响应字段恢复合成 IP/port 并验证实际
      socket。普通 CDN、DDNS、SRV/SVCB 和服务发现作为反例。', 'The strategy requires a DNS or resolver answer to be consumed by the
      same process as a later C2 endpoint. NJA-000323 joins name, answer pool, TTL, process connection, SNI or certificate,
      and control outcome over time. NJA-000325 recovers a synthesized IP or port from response fields and verifies the
      actual socket. Ordinary CDNs, DDNS, SRV or SVCB, and service discovery are counterexamples.')
    en: ('本策略要求 DNS/解析应答被同一进程实际消费为后继 C2。NJA-000323 把名称、应答池、TTL、进程连接、SNI/证书和控制结果接成时间谱系；NJA-000325 从响应字段恢复合成 IP/port 并验证实际
      socket。普通 CDN、DDNS、SRV/SVCB 和服务发现作为反例。', 'The strategy requires a DNS or resolver answer to be consumed by the
      same process as a later C2 endpoint. NJA-000323 joins name, answer pool, TTL, process connection, SNI or certificate,
      and control outcome over time. NJA-000325 recovers a synthesized IP or port from response fields and verifies the
      actual socket. Ordinary CDNs, DDNS, SRV or SVCB, and service discovery are counterexamples.')
