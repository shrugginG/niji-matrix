schema_version: 2.0.0
type: detection-strategy
id: DET-000248
name:
  zh: 共享生成候选到成功控制端点关联
  en: Shared-Generation Candidate to Successful Control Endpoint Correlation
summary:
  zh: 从同进程候选 locator 家族、解析/请求结果、注册和证书时间中识别共享生成规则，并要求至少一个候选产生后继 C2 结果。
  en: Identify a shared generation rule from same-process locator families, resolution or request results, and registration
    and certificate timing, requiring at least one candidate to produce a successor C2 outcome.
description:
  paragraphs:
  - zh: 本策略把从植入体或样本恢复的共享种子、词表、时钟与组合规则，连接到查询或 URL 候选族、失败至成功的尝试序列以及实际 C2 端点消费。NJA-000324 要求同一家族的候选关系和成功端点反馈，不以随机域名外观单独推断生成式定位符。
    en: This strategy joins shared seeds, word lists, clocks, and combination rules recovered from an implant or sample to query or URL candidate families, failed-to-successful attempts, and actual C2 endpoint consumption. NJA-000324 requires both a candidate-family relationship and successful endpoint feedback; random-looking domains alone do not establish a generated locator.
