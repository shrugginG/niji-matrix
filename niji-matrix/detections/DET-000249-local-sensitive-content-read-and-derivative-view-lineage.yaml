schema_version: 2.0.0
type: detection-strategy
id: DET-000249
name:
  zh: 本地敏感内容读取与派生视图谱系
  en: Local Sensitive-Content Read and Derivative-View Lineage
summary:
  zh: 区分目录发现、实际内容读取和后继输出，并在规范源与派生本地视图之间恢复读取者、对象和结果关系；合法备份、索引、EDR、打印、迁移与取证必须按批准范围排除。
  en: Distinguish directory discovery, exercised content reads, and successor output while reconstructing reader, object,
    and result relationships across canonical sources and derivative local views; approved backup, indexing, EDR, printing,
    migration, and forensics must be excluded by authorized scope.
description:
  paragraphs:
  - zh: 在数据 owner 指定的敏感本地对象上验证成功 ReadData，并把对象、登录会话和不可变进程实例连接到输出、临时副本或外送结果。目录列举、属性读取、特权分配和读取能力分别保留为较低级状态；备份、打印、索引、EDR、迁移与取证只有在主体、签名、作业、路径和时间全部匹配时才排除。
    en: Validate successful ReadData on owner-designated sensitive local objects and join the object, logon session, and immutable
      process instance to an output, temporary copy, or transfer result. Keep enumeration, attribute reads, privilege assignment,
      and capability as lower states. Exclude backup, printing, indexing, EDR, migration, and forensics only when principal,
      signer, job, path, and time all match.
