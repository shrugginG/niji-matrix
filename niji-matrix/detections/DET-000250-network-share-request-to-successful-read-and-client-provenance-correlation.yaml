schema_version: 2.0.0
type: detection-strategy
id: DET-000250
name:
  zh: 网络共享请求—成功读取—客户端来源关联
  en: Network-Share Request to Successful Read and Client Provenance Correlation
summary:
  zh: 把共享权限检查与服务器实际提供内容分层，并将成功读取连接到客户端进程、登录/映射语境、对象敏感度和批准作业。
  en: Separate share authorization checks from server-provided content, then join successful reads to client process, logon
    or mapping context, object sensitivity, and approved work.
description:
  paragraphs:
  - zh: 把共享服务器的成功 READ 或实际 ReadData 与客户端登录会话、进程、映射来源和后继结果关联。5145 只作权限检查线索；分析必须区分新映射、既有映射、NAS 管理面和合法迁移作业，并在服务器不提供字节结果时降低结论等级。
    en: Join a share server's successful READ or exercised ReadData to client logon session, process, mapping provenance,
      and downstream outcome. Treat 5145 only as an authorization lead. Distinguish new and preexisting mappings, NAS administrative
      paths, and approved migration jobs, and lower confidence when the server does not expose returned-byte results.
