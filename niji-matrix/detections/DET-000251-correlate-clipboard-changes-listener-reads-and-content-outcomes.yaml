schema_version: 2.0.0
type: detection-strategy
id: DET-000251
name:
  zh: 剪贴板变化、监听读取与内容结果关联
  en: Correlate Clipboard Changes, Listener Reads, and Content Outcomes
summary:
  zh: 把未批准 listener/viewer 注册、剪贴板变化后的成功读取与日志或网络结果连接，识别只在用户复制后发生的事件耦合内容采集。
  en: Join unapproved listener or viewer registration, successful reads after clipboard changes, and log or network outcomes
    to identify event-coupled collection that occurs only after user copy activity.
description:
  paragraphs:
  - zh: 在经验证可记录剪贴板监听、变化标识和成功读取的终端上，将 listener 注册、变化后短窗读取和日志、IPC 或网络结果闭合。隐藏窗口或注册只形成暴露线索；必须确认内容结果，且默认不集中采集明文剪贴板。
    en: On endpoints validated to record clipboard listeners, change identifiers, and successful reads, close listener registration,
      short-window post-change reads, and file, IPC, or network outcomes. A hidden window or registration is only exposure;
      require a content outcome and avoid centralized plaintext clipboard capture by default.
