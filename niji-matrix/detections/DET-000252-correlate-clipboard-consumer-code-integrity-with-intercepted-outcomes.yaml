schema_version: 2.0.0
type: detection-strategy
id: DET-000252
name:
  zh: 剪贴板消费者代码完整性与截获结果关联
  en: Correlate Clipboard-Consumer Code Integrity With Intercepted Outcomes
summary:
  zh: 在正常粘贴应用中连接未批准代码介入、被改变的剪贴板读取路径、成功返回与第二内容结果链，识别寄生于合法消费者的采集。
  en: Join unapproved code interposition, an altered clipboard-read path, a successful return, and a second content-outcome
    chain inside normal paste applications to identify collection parasitizing legitimate consumers.
description:
  paragraphs:
  - zh: 把进入正常粘贴消费者的跨进程写入、模块或函数介入，与成功剪贴板返回及攻击者控制的第二内容结果连接。进程注入可提供前置谱系，但只有消费者调用路径和内容结果同时闭合时才确认本子项。
    en: Join cross-process writes, modules, or function interposition inside a normal paste consumer to a successful clipboard
      return and a second attacker-controlled content outcome. Process injection supplies prerequisite lineage, but confirm
      this child only when the consumer call path and content result both close.
