schema_version: 2.0.0
type: detection-strategy
id: DET-000253
name:
  zh: 云对象成功返回与授权消费谱系关联
  en: Cloud Object Successful-Return and Authorization-Consumption Lineage
summary:
  zh: 将发现、能力、成功授权和服务端实际返回内容分层，再把成功对象读取连接到身份/授权载体、客户端来源、对象敏感度、批准同步备份作业及后继结果。
  en: Separate discovery, capability, successful authorization, and provider-returned content, then join successful object
    reads to identity or authorization carrier, client origin, object sensitivity, approved synchronization or backup work,
    and successor outcomes.
description:
  paragraphs:
  - zh: 按平台使用对象正文成功返回字段，把对象键、响应状态或字节、来源地址、客户端和授权载体连接到可识别主体或公开/共享授权路径。列举、HEAD、授权成功和权限存在不替代正文结果；正常同步、备份和数据管道按批准职责与对象范围排除。
    en: Use platform-specific successful object-body return fields to join object key, status or bytes, source, client, and
      authorization carrier to an identifiable principal or public/shared path. Listing, HEAD, authorization success, and
      permission existence do not replace a body result. Exclude normal sync, backup, and data pipelines by approved duty
      and object scope.
