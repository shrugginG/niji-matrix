schema_version: 2.0.0
type: detection-strategy
id: DET-000254
name:
  zh: 配置读取结果与管理任务意图核对
  en: Configuration-Read Outcome and Management-Job Intent Reconciliation
summary:
  zh: 对实时设备读取和既有配置副本读取分别建立“主体—请求—成功返回—配置对象/产物”链，再与已批准管理、备份、合规和恢复任务核对，区分未知来源、受信管理语境滥用及设备审计外副本取得。
  en: Build principal-to-request-to-successful-return-to-configuration-object or artifact chains for live-device and preexisting-copy
    reads, then reconcile them with approved management, backup, compliance, and restore jobs to distinguish unknown sources,
    abuse of trusted management context, and replica acquisition outside device audit.
description:
  paragraphs:
  - zh: 把设备实时配置响应或配置副本成功读取与主体、管理来源、作业 ID、设备范围和批准意图核对。命令执行、登录或仓库访问本身不证明配置取得；NMS、备份、合规、灾备和厂商支持必须以精确作业范围作为正常反例。
    en: Reconcile a live device-configuration response or successful configuration-copy read with principal, management source,
      job ID, device scope, and approved intent. Command execution, login, or repository access alone does not prove acquisition.
      Treat NMS, backup, compliance, disaster recovery, and vendor support as benign only with exact job scope.
