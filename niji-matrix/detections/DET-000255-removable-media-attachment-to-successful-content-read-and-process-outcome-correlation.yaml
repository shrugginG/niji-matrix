schema_version: 2.0.0
type: detection-strategy
id: DET-000255
name:
  zh: 可移动介质接入—成功内容读取—进程结果关联
  en: Removable-Media Attachment to Successful Content Read and Process Outcome Correlation
summary:
  zh: 把设备接入、策略处理和对象枚举与实际文件级读取分层，再把成功读取连接到介质身份、进程、批准作业、历史对象状态和后继输出。
  en: Separate attachment, policy handling, and object enumeration from actual file-level reads, then join successful reads
    to media identity, process, approved work, historical object state, and output.
description:
  paragraphs:
  - zh: 为每次介质接入建立稳定会话与介质身份，把策略允许、对象枚举和实际 ReadData 分级，再把成功读取连接到进程、批准作业及文件、归档或网络结果。mount、拒绝事件、目录浏览和属性读取只形成较低级线索；照片导入、备份、杀毒、取证、恢复与迁移须以签名、介质组、路径、工单和有效期共同排除。
    en: Create a stable attachment session and media identity for each insertion, grade policy allow and enumeration separately
      from exercised ReadData, and join successful reads to process, approved work, and file, archive, or network outcomes.
      Mount, deny, directory browsing, and attribute reads remain lower-level leads. Exclude photo import, backup, antimalware,
      forensics, restore, and migration only by signer, media group, path, ticket, and expiry together.
