schema_version: 2.0.0
type: detection-strategy
id: DET-000256
name:
  zh: 数据入口制品—表单—接收结果谱系
  en: Data-Entry Artifact-Form-Receiver Outcome Lineage
summary:
  zh: 将受信数据入口的批准制品与消费者实际表单图、提交路径和服务器第二输出连接，区分完整性暴露与实际输入取得。
  en: Join approved artifacts for a trusted data-entry surface to the consumer's actual form graph, submission path, and second
    server output, separating integrity exposure from actual input acquisition.
description:
  paragraphs:
  - zh: 本策略以外部保存的发布制品、脚本清单、字段模式和批准接收路径为前态，比较真实浏览器或边缘所接收的脚本、模板、表单字段、action、fetch/XHR 和 CSP/SRI 状态，再连接服务器文件或运行态、同源路由、请求成功、结果字节与非业务外联。只有资产或表单差异时标为
      integrity exposure；出现成功输入提交和攻击者可控接收链时才提升为 suspected capture。
    en: This strategy uses externally retained release artifacts, script inventory, field schema, and approved receiver paths
      as pre-state; compares scripts, templates, form fields, actions, fetch or XHR destinations, and CSP or SRI state as
      received by a real browser or edge; and joins server files or runtime, same-origin routes, request success, outcome
      bytes, and nonbusiness egress. Artifact or form drift alone is integrity exposure. Elevation to suspected capture requires
      a successful input submission and an attacker-controlled receiver chain.
  - zh: 两项 Analytic 分别处理消费者实际渲染图与提交目标，以及同源隐藏接收路径到服务器第二输出。实现不记录真实支付或业务字段，只保存 release、hash、字段模式摘要、form_id、route、目的地、状态和字节。标签管理、A/B
      测试、反欺诈、无障碍、支付处理器和客服组件必须用签名制品、变更单、数据合同和有效期排除。
    en: Two analytics cover the consumer's rendered graph and submission destination, and the path from a hidden same-origin
      receiver to a second server output. Implementation records no actual payment or business field values, retaining only
      release, hash, field-schema digest, form ID, route, destination, status, and bytes. Tag management, A/B testing, fraud
      controls, accessibility, payment processors, and support components require exclusion through signed artifacts, change
      records, data contracts, and expiry.
