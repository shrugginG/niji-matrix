schema_version: 2.0.0
type: detection-strategy
id: DET-000257
name:
  zh: 实际协议语义—端口预期—策略结果差分
  en: Actual Protocol Semantics to Port Expectation and Policy Outcome Differential
summary:
  zh: 比较当地服务预期、真实协议解析和策略结果，并要求同一会话产生后继 C2。
  en: Compare the locally expected service, actual protocol parsing, and policy outcome, requiring a successor C2 result from
    the same session.
description:
  paragraphs:
  - zh: 本策略将端口从标签变为可检验的服务预期。NJA-000343 先用版本化资产和策略登记得到 expected_service，再用 Zeek、Suricata、应用感知防火墙或协议仿真得到 actual_semantics；分别保留误放行和解析错位结果，最终连接端点任务、响应或重复控制通信。未知协议与罕见端口只能生成调查候选。
    en: This strategy treats a port as a testable service expectation rather than a label. NJA-000343 derives expected_service
      from versioned asset and policy records and obtains actual semantics from Zeek, Suricata, an application-aware firewall,
      or protocol emulation. It retains mistaken allowance and parser displacement as separate outcomes and then joins endpoint
      tasking, responses, or repeated control communication. An unknown protocol or rare port alone produces an investigation
      candidate.
