schema_version: 2.0.0
type: detection-strategy
id: DET-000258
name:
  zh: 内外层会话解封装与结果关联
  en: Inner-to-Outer Session Decapsulation and Outcome Correlation
summary:
  zh: 重建内层服务、外层连接和解封装结果之间的映射，识别未经批准的 C2 协议隧道。
  en: Reconstruct mappings among inner services, outer connections, and decapsulation outcomes to identify unapproved C2 protocol
    tunnels.
description:
  paragraphs:
  - zh: NJA-000344 连接隧道进程的内外 socket 和服务结果，NJA-000345 用流 ID 或端点 fan-in 恢复一个外层会话中的多条内层流，NJA-000346 按会话与片序跨外层事务重建单条内层命令流。三条分析都要求内外层关系和后继结果，并以批准的
      VPN、服务网格、开发隧道和运维路径作对照；单个外层长连接不足以报警。
    en: NJA-000344 joins a tunnel process's inner and outer sockets to service outcomes. NJA-000345 recovers several inner
      flows within one outer session using stream IDs or endpoint fan-in. NJA-000346 reconstructs one inner command flow across
      outer transactions by session and fragment order. Each analytic requires an inner-to-outer relationship and successor
      outcome and compares it with approved VPN, service-mesh, development-tunnel, and administration paths. One long outer
      connection is insufficient.
