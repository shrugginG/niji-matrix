schema_version: 2.0.0
type: detection-strategy
id: DET-000259
name:
  zh: 密钥材料—ciphertext—控制明文恢复
  en: Key Material–Ciphertext–Control Plaintext Recovery
summary:
  zh: 连接攻击者附加密码层、密钥生命周期、接收端明文和命令结果。
  en: Join attacker-added cryptography, key lifetime, receiver plaintext, and command outcomes.
description:
  paragraphs:
  - zh: NJA-000347 从样本配置恢复跨会话可复用秘密并对历史密文做经校验的解密；NJA-000348 在授权端点捕获会话或消息范围的握手、密钥句柄与解密结果。两者分别输出可回溯与短时恢复范围，均要求承载协议外的密码层和实际 C2
      命令；熵值或普通 TLS 不触发结论。
    en: NJA-000347 recovers a reusable secret from sample configuration and validates decryption of historical ciphertext,
      while NJA-000348 captures handshake, key-handle, and decryption outcomes for session- or message-scoped secrets on an
      authorized endpoint. They report retrospective and transient recovery scope separately. Both require a cryptographic
      layer beyond the carrier and an actual C2 command; entropy or ordinary TLS is not dispositive.
