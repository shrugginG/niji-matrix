schema_version: 2.0.0
type: detection-strategy
id: DET-000260
name:
  zh: 外层解密—内层封套—端点明文关联
  en: Outer Decryption–Inner Envelope–Endpoint Plaintext Correlation
summary:
  zh: 发现外层 TLS 已解开但内层命令仍需独立密钥恢复的检查边界。
  en: Identify a boundary where outer TLS is decrypted but inner commands still require independent key recovery.
description:
  paragraphs:
  - zh: NJA-000349 分别记录外层 TLS 解密状态和内层封套状态，将解密后的 body、封装密钥、端点 crypto context 与命令结果按消息关联。策略针对把“TLS 可见”误当作“内容可检查”的盲区；合法端到端加密业务必须由应用目录、密钥所有者和授权观察范围排除。
    en: NJA-000349 records outer TLS decryption state separately from inner-envelope state and joins decrypted bodies, wrapped
      keys, endpoint cryptographic context, and command outcomes by message. The strategy addresses the blind spot created
      by assuming that visible TLS content is necessarily inspectable; legitimate end-to-end encrypted business applications
      require exclusion through application inventory, key owner, and authorized observation scope.
