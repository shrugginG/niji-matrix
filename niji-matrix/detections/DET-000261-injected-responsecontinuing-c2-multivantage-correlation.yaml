schema_version: 2.0.0
type: detection-strategy
id: DET-000261
name:
  zh: 注入响应—持续 C2 结果多视点关联
  en: Injected-Response–Continuing-C2 Multivantage Correlation
summary:
  zh: 比较目标、源站和独立视点的响应谱系，并把差异连接到已受控主机的任务与结果循环。
  en: Compare target, origin, and independent-vantage response lineage and join differences to task-and-result cycles on an
    already compromised host.
description:
  paragraphs:
  - zh: NJA-000350 保存同一请求在目标、独立出口和真实源站的内容摘要、路由及接收结果，再关联植入体反复读取命令、写回输出和加载插件的周期。策略把“响应来自受控路径”与“该响应维持 C2”分成两个证据门，避免浏览器入口检测直接冒充持续通信覆盖；竞速伪造回复的
      C2 用途仍需独立事件证据。
    en: NJA-000350 retains content digests, routes, and receipt outcomes for the same request at the target, independent egress,
      and true origin, then joins cycles of implant command reads, output writes, and plug-in loads. The strategy separates
      evidence that a response came from a controlled path from evidence that it sustained C2. Browser-entry detection does
      not itself cover continuing communication, and C2 use of racing forged replies still needs independent incident evidence.
