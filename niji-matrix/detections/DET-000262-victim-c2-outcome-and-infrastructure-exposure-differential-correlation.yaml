schema_version: 2.0.0
type: detection-strategy
id: DET-000262
name:
  zh: 受害端 C2 结果与基础设施暴露差关联
  en: Victim C2 Outcome and Infrastructure Exposure Differential Correlation
summary:
  zh: 以同请求跨观察者和同来源跨请求变体的对照，确认 C2 前端选择性暴露及受害端结果。
  en: Use same-request cross-observer and same-source request-variant comparisons to confirm selective C2-front exposure and
    victim outcomes.
description:
  paragraphs:
  - zh: NJA-000351 把正向请求资格和负向防守来源抑制设为两条实验分支：前者固定来源、逐字段变更请求并关联 edge-to-origin；后者固定请求、变更安全与中性观察来源并审计 deny 规则。两条分支都要求恶意 C2 tenant/origin
      与受害端命令结果，且主动测量仅在授权范围进行；时窗暴露只保留长期监测候选。
    en: NJA-000351 uses two experiment branches. Positive request qualification holds the source constant, varies one request
      field, and joins edge to origin. Negative defender-source suppression holds the request constant, varies security and
      neutral vantages, and audits deny rules. Both branches require a malicious C2 tenant or origin and victim command outcome,
      with active measurement restricted to authorized scope. Temporal exposure remains a long-horizon candidate.
