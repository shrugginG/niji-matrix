type: detection-strategy
id: DET-000263
name:
  zh: 服务器组件状态、加载、请求与结果谱系
  en: Server-Component State Load Request and Outcome Lineage
summary:
  zh: 连接服务器组件清单与控制面变化、后续加载或调用、资格化请求和实际结果，区分持久组件、选择性激活及信任身份仿冒
  en: Join server-component inventory and control-plane changes to later load or invocation qualifying requests and realized outcomes to distinguish durable components selective activation and trust-identity masquerade
description:
  paragraphs:
  - zh: 本策略以服务器组件的稳定身份和版本为中心，而不是把任意 Web 文件、DLL、存储过程或服务器子进程直接视为攻击。NJA-000352 维护组件清单、writer、批准、内容与发布来源，连接服务启动或运行时加载和后继进程、文件、网络与资源结果；只有未经批准的状态被后来消费并产生风险结果时，才从静态完整性风险升级为确认的持久组件活动。
    en: This strategy centers stable identities and versions of server components rather than treating every web file DLL stored procedure or server child process as malicious. NJA-000352 maintains component inventory writer approval content and publisher provenance and joins later service-start or runtime load to successor process file network and resource outcomes. Static integrity risk advances to confirmed durable-component activity only when unapproved state is later consumed and produces a risky result.
  - zh: NJA-000353 独立处理请求资格化轴，把 HTTP、邮件、SQL 或等价事务的选择字段与组件分支、响应差分和后继结果连接，并要求同一组件对非匹配请求保持正常结果。该分工防止静态清单异常吞并请求选择性，也防止一个稀有 Header、邮件规则或过程调用在没有组件和结果谱系时被高置信定性。
    en: NJA-000353 separately handles request qualification by joining selector fields from HTTP mail SQL or equivalent transactions to component branches response differentials and successor outcomes while requiring ordinary results for nonmatching requests handled by the same component. This division keeps static inventory anomalies from absorbing request selectivity and prevents a rare header mail rule or procedure call from becoming a high-confidence conclusion without component and outcome lineage.
