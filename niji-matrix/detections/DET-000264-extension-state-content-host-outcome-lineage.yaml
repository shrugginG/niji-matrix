schema_version: 2.0.0
type: detection-strategy
id: DET-000264
name:
  zh: 扩展状态、内容与宿主结果谱系
  en: Extension State Content and Host Outcome Lineage
summary:
  zh: 连接精确扩展身份、版本内容、安装或配置 writer、宿主加载及后继进程、网络与资源结果，识别扩展身份仿冒和带外注册植入
  en: Join exact extension identity version content installation or configuration writer host load and successor process network and resource outcomes to detect identity impersonation and out-of-band registration implantation
description:
  paragraphs:
  - zh: 本策略以 `(host application, installation scope/profile, registry, publisher ID, extension ID)` 为稳定身份，而不是把显示名、官方市场、签名、宿主进程或宽权限直接视为安全或恶意。NJA-000354 维护身份、版本、内容、权限和更新历史，把市场或发布来源连接到后续 extension host 加载及结果，识别新身份仿冒和既有身份内容变化。
    en: This strategy uses host application installation scope or profile registry publisher ID and extension ID as stable identity rather than treating display name official marketplace signature host process or broad permission as benign or malicious. NJA-000354 maintains identity version content permission and update history and joins marketplace or publisher provenance to later extension-host load and outcomes to identify new-identity impersonation and content change under existing identities.
  - zh: NJA-000355 独立处理 profile、policy、preference、Registry、扩展目录与 CLI 写入，把没有对应批准市场/UI/管理部署事件的状态连接到以后宿主加载。两个 Analytic 共同要求持久状态被后来消费并产生攻击者能力；当前 inventory、一次文件写入或一次浏览器外联只能进入较低层候选。
    en: NJA-000355 separately handles writes to profiles policies preferences Registry extension directories and CLIs and joins state without a corresponding approved marketplace UI or management deployment event to later host load. Both analytics require durable state to be consumed later and produce adversary capability. Current inventory one file write or one browser connection remains a lower-tier candidate.
detects_refs: [NJT-0226, NJS-0226-001, NJS-0226-002]
