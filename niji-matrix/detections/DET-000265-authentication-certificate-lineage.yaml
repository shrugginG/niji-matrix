id: DET-000265
name:
  zh: 签发身份主体与批准意图关联
  en: Enrollment Identity Subject and Approval-Intent Correlation
summary:
  zh: 识别正常签发事务中请求者、目标身份与批准用途的脱节。
  en: Identify differences among requesters, represented identities, and approved purpose within normal issuance.
description:
  paragraphs:
  - zh: 该策略连接真实请求、签发数据库、解析证书与历史授权范围，关注 CA 技术上接受请求却不符合组织批准意图的情形。后继证书认证只增强可用性判断，不代替对请求控制者与授权的核查。
    en: This strategy joins actual requests, issuance databases, parsed certificates, and historical authority to identify enrollment accepted
      technically by a CA but inconsistent with organizational approval. Successor certificate authentication strengthens usability assessment
      without replacing investigation of request control and authorization.
