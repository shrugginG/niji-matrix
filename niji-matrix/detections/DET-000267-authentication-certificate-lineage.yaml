schema_version: 2.0.0
type: detection-strategy
id: DET-000267
name:
  zh: 认证私钥操作与材料结果分级
  en: Authentication Private-Key Operations and Material-Outcome Grading
summary:
  zh: 区分密钥访问线索、可携材料形成、攻击者控制与后继认证。
  en: Separate key-access leads, portable-material creation, adversary control, and successor authentication.
description:
  paragraphs:
  - zh: 该策略直接覆盖既有终端认证私钥的取得，并把 CA 私钥暴露保留为构造能力线索。KSP 成功事件只证明相应操作，材料内容与实际控制必须由输出验证或受控调查补齐，不能由进程名或 PFX 后缀替代。
    en: This strategy directly covers acquisition of existing end-entity authentication keys and retains CA-key exposure as a construction-capability
      lead. A successful KSP event establishes its operation only; output validation or controlled investigation must establish material
      content and actual control rather than a process name or PFX suffix.
