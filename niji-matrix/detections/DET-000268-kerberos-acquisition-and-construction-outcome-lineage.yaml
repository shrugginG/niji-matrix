schema_version: 2.0.0
type: detection-strategy
id: DET-000268
name:
  zh: Kerberos 取材与构造结果谱系
  en: Kerberos Acquisition and Construction Outcome Lineage
summary:
  zh: 把KDC请求、具体缓存读取或构造输入连接到实际材料结果，并将异常线索与完成行为分级。
  en: Connect KDC requests, specific cache reads, or construction inputs to actual material outcomes, distinguishing anomaly leads from completed
    behavior.
description:
  paragraphs:
  - zh: 策略以材料结果为共同目标，分别从请求回复、既存缓存和构造输入进入。请求分析兼顾长期稀疏序列与直接协议输出，缓存分析核对真正读取的对象和输出，构造分析检验票据对象与授权谱系。资源侧登录只作独立后继证据，不能替代取得或修改结果。
    en: The common objective is a material outcome reached through request and reply, an existing cache, or a construction input. Request
      analysis covers long sparse sequences and direct protocol outputs, cache analysis validates actual read objects and outputs, and construction
      analysis tests ticket-object and authorization lineage. Resource logons are independent successor evidence and cannot replace acquisition
      or modification results.
