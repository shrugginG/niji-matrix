name:
  zh: 秘密承载对象读取与职责关联
  en: Secret-Bearing Object Read and Duty Correlation
summary:
  zh: 将实际对象读取连接到秘密承载清单与批准读者职责。
  en: Join exercised object reads to a secret-carrier inventory and approved reader duties.
description:
  paragraphs:
  - zh: 监测已确认秘密承载文件、注册表值所在键和交互历史的实际读取，并区分现行配置与有形成链的次生记录。关联分析解释读取主体、进程和批准职责，输出可疑读取与已验证材料取得两个结果层级。
    en: Monitor exercised reads of confirmed secret-bearing files, registry keys containing secret values, and interactive history, distinguishing
      current configuration from secondary records with creation lineage. The analytic explains reader, process, and approved duty and separates
      suspicious reads from verified material acquisition.
