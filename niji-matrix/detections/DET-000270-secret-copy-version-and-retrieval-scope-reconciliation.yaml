schema_version: 2.0.0
type: detection-strategy
id: DET-000270
name:
  zh: 秘密副本版本与取回范围核对
  en: Secret-Copy Version and Retrieval-Scope Reconciliation
summary:
  zh: 按历史对象和传输范围审查含秘密副本的取回。
  en: Review retrieval of secret-bearing copies using historical objects and transfer scope.
description:
  paragraphs:
  - zh: 用版本化秘密暴露清单解释仓库 clone/fetch，避免只根据仓库名称认定秘密外流。分析将已知含值版本、接收者与获批用途连接，并明确仓库级事件不能提供的对象范围；本策略直接覆盖次生副本，也辅助父级中的普通仓库配置调查。
    en: Interpret clone or fetch activity with a versioned exposure inventory rather than treating a repository name as proof of disclosure.
      The analytic joins known secret-bearing versions, recipient, and approved purpose while identifying object scope absent from repository-level
      events. It directly covers secondary copies and supports investigation of ordinary repository configuration at the parent level.
