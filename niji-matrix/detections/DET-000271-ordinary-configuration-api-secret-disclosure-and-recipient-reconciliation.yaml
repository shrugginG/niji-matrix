schema_version: 2.0.0
type: detection-strategy
id: DET-000271
name:
  zh: 普通配置 API 秘密披露与接收者核对
  en: Ordinary Configuration API Secret Disclosure and Recipient Reconciliation
summary:
  zh: 识别普通配置读取把已确认秘密交给职责外接收者的情况。
  en: Identify ordinary configuration reads exposing confirmed secrets to recipients outside approved duty.
description:
  paragraphs:
  - zh: 策略关注 Pod 与 ConfigMap 等普通配置对象里的实际秘密披露，不把 Secret 资源名或成功 API 请求当作结论。分析将资源版本暴露清单、成功响应与主体职责关联，并保留响应正文不可见时的候选等级。
    en: Focus on actual secret disclosure in ordinary configuration objects such as Pods and ConfigMaps, without treating a Secret resource
      name or successful API call as conclusive. The analytic joins versioned exposure findings, successful responses, and reader duty and
      retains candidate grading when response content is unavailable.
