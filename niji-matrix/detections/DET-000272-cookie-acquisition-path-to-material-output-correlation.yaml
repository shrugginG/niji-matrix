schema_version: 2.0.0
type: detection-strategy
id: DET-000272
name:
  zh: Cookie 取得路径与材料输出关联
  en: Cookie Acquisition Path to Material Output Correlation
summary:
  zh: 将外部读取或可信浏览器控制接到值承载输出，并区分疑似机会与实际材料控制。
  en: Connect external reads or trusted-browser control to value-bearing output and distinguish suspected opportunity from material control.
description:
  paragraphs:
  - zh: 外部读取分析针对文件与进程访问，客户端返回分析针对调试与浏览器内部取值；二者按取得路径分工，不把进程名、读取事件或调试能力当成取得结果。只有独立保存的返回或输出证据把完整材料连到未批准收件者时，才能提升为确认取得。真实代理流在没有内容证据时属于本策略盲区，需要认证路径调查配合。
    en: The external-read analytic covers file and process access, while the client-return analytic covers debugging and browser-internal
      retrieval. They divide acquisition paths without treating a process name, read event, or debugger capability as an acquisition result.
      Only independently retained return or output evidence connecting complete material to an unauthorized recipient supports confirmation.
      Real proxy flows without content evidence remain a blind spot requiring authentication-path investigation.
