type: detection-strategy
id: DET-000273
name:
  zh: 组策略信息读取与任务语境关联
  en: Group Policy Information Read and Task Context Correlation
summary:
  zh: 结合读取主体、策略视图和批准任务识别异常调查，并分别保留查询尝试、目录读取、共享检查与实际文件访问证据。
  en: Identify abnormal surveying through reader identity, policy view, and approved work while preserving query-attempt,
    directory-read, share-check, and exercised-file-access evidence separately.
description:
  paragraphs:
  - zh: 本策略识别组策略信息调查，不以出现策略写入或配置变化为条件。端点分析恢复结果策略请求及可验证输出，目录分析识别 GPO 属性读取，文件分析识别 SYSVOL 模板的共享检查与实际文件访问。三项分析按各自数据前提独立运行，不要求一次调查同时访问本地结果、LDAP
      和 SMB。
    en: This strategy identifies Group Policy information surveying without requiring policy writes or configuration changes.
      The endpoint analytic recovers resultant-policy requests and verifiable output, the directory analytic identifies GPO
      property reads, and the file analytic identifies SYSVOL template share checks and exercised file access. Each runs independently
      with its own data prerequisites; a survey need not access local results, LDAP, and SMB together.
  - zh: 输出同时保留证据等级和正常任务差分。签名工具、成功认证或正常客户端账户不构成恶意结论，也不能成为永久放行理由；批准诊断需要同源设备、身份、目标范围和有效时间相符。只有调用记录时保留调查尝试，观察到属性或文件访问时报告相应读取事实，取得可验证策略结果后才报告该结果，避免把目录配置直接解释为目标已经生效的设置。
    en: Outputs retain both evidence level and the difference from expected work. A signed utility, successful authentication,
      or ordinary client account is neither a malicious verdict nor grounds for permanent allowance. Approved diagnostics
      must match origin device, identity, target scope, and validity interval. Call records establish an attempt, property
      or file events establish their respective access facts, and a verified policy result establishes that result. Directory
      configuration must not be reported as settings already effective on a target.
