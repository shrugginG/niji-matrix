schema_version: 2.0.0
type: detection-strategy
id: DET-000274
name:
  zh: 主机存储查询与操作会话关联
  en: Host Storage Query and Operational-Session Correlation
summary:
  zh: 识别偏离批准作业的存储对象和属性查询，并保持请求、返回结果与后继内容操作的区别。
  en: Identify storage-object and attribute queries outside approved work while separating requests, returned results, and
    later content operations.
description:
  paragraphs:
  - zh: 策略围绕主机存储对象而非工具名称组织检测。Windows 分析恢复命令和脚本中的逻辑磁盘查询意图，Linux 分析恢复设备或容量工具的真实执行参数，ESXi 分析把存储清单命令接回认证会话。三者以批准维护范围和调用来源判断可疑性，默认输出查询尝试；成功返回属性需要独立结果证据，后继原始读取和破坏不得并入发现结论。
    en: The strategy organizes detection around host storage objects rather than utility names. The Windows analytic recovers
      logical-disk query intent from commands and scripts, the Linux analytic recovers device or capacity utility execution
      arguments, and the ESXi analytic joins storage-inventory commands to authentication sessions. Each evaluates approved
      maintenance scope and caller origin, reporting query attempts by default. Returned attributes require independent result
      evidence; later raw reads or destruction remain separate conclusions.
