schema_version: 2.0.0
type: detection-strategy
id: DET-000275
name:
  zh: 日志调查请求与用途关联
  en: Log Investigation Request and Purpose Correlation
summary:
  zh: 将日志来源枚举和记录查询与主体职责及获批调查关联，并分别报告请求、结果与后续行为。
  en: Correlate source enumeration and record queries with principal duties and approved investigations while reporting requests,
    results, and subsequent behavior separately.
description:
  paragraphs:
  - zh: 本策略以读取者和调查对象为中心，判断为何某个主体枚举日志来源、查询认证记录或查看防守变更。Windows 分析区分只列通道、查询与导出命令；AWS 分析审查历史 API 查询及其筛选范围；Azure 分析使用已启用的查询审计核对文本、返回行数与职责。它们不共享结果语义，也不把缺少审批自动视为成功窃取。
    en: This strategy centers the reader and information object to assess why a principal enumerates sources, queries authentication
      history, or reviews defensive changes. The Windows analytic separates channel listings, queries, and export commands;
      the AWS analytic examines history API queries and their selectors; the Azure analytic uses enabled query auditing to
      compare text, returned rows, and duties. Their outcome semantics remain separate, and missing approval is not automatically
      successful theft.
