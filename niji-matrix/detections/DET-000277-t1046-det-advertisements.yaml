schema_version: 2.0.0
type: detection-strategy
id: DET-000277
name:
  zh: 服务公告浏览与候选使用关联
  en: Service-Advertisement Browsing and Candidate Use Correlation
summary:
  zh: 在真实发现域内识别用途异常的服务公告查询，并区分浏览意图、可见公告与已解析端点。
  en: Identify unexpected service-advertisement queries in the actual discovery domain, distinguishing browsing intent, visible
    advertisements, and resolved endpoints.
description:
  paragraphs:
  - zh: 策略观察服务公告平面的主动查询，恢复客户端所查服务类型及可见实例范围，并结合设备职责、会话上下文和可选的后继端点访问判断异常。分析保留组播相关的不确定性，不要求先出现端口扫描，也不把可见公告升级为结果已被某进程消费或服务已实际可达。
    en: The strategy observes active queries on the service-advertisement plane, reconstructs requested service types and
      visible instance scope, and uses device purpose, session context, and optional successor endpoint access to assess anomalies.
      It preserves multicast-association uncertainty, does not require prior port scanning, and does not elevate a visible
      advertisement into proof of process consumption or service reachability.
