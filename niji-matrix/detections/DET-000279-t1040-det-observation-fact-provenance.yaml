schema_version: 2.0.0
type: detection-strategy
id: DET-000279
name:
  zh: 未授权流量观察与环境事实溯源
  en: Unauthorized Traffic Observation and Environmental-Fact Provenance
summary:
  zh: 将主机、设备和镜像观察面的授权与生命周期连接到实际报文和分级环境事实，区分可见事实与攻击者已取得的结果。
  en: Join authorization and lifecycle of host, device, and mirrored observation surfaces to actual packets and graded environmental
    facts, separating exposed facts from results acquired by the adversary.
description:
  paragraphs:
  - zh: 本策略恢复谁在何时通过哪个接口或复制分支观察了哪些流量，再审查观察是否超出获批用途与范围。三项分析分别覆盖 Windows 原生包捕获、网络设备本地抓包和云镜像，使用不同的主机进程、设备会话与资源版本关联键，不能仅凭工具名建立统一告警。
    en: Reconstruct who observed which traffic, when, and through which interface or copy branch, then determine whether observation
      exceeded approved purpose and scope. Three analytics cover Windows native capture, local network-device capture, and
      cloud mirroring with distinct host-process, device-session, and resource-version joins rather than one tool-name alert.
  - zh: 结果必须分为 capture-requested、packet-received、facts-exposed 和 fact-return-confirmed。受限分析员从 PCAP 解出事实只支持 facts-exposed；只有攻击者生成的解析输出、会话返回或等效取证证据才支持事实已返回。缺少结果不能关闭未授权观察面告警，也不能升级为已完成测绘。
    en: Grade results as capture-requested, packet-received, facts-exposed, and fact-return-confirmed. Analyst decoding of
      a PCAP supports facts-exposed only. Adversary-generated parsed output, a returned session result, or equivalent forensic
      evidence is required for fact-return-confirmed. Missing results neither close an unauthorized-observation alert nor
      establish completed mapping.
