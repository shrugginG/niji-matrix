schema_version: 2.0.0
type: detection-strategy
id: DET-000280
name:
  zh: 观察器名称补全设置与事实结果核对
  en: Observer Name-Enrichment Settings and Fact-Result Reconciliation
summary:
  zh: 在真实报文观察关系中核实主动补全抑制设置与批准范围，保留配置证据和事实返回的区别。
  en: Verify active-enrichment suppression settings and approval scope within a real packet-observation relationship while
    separating configured behavior from fact return.
description:
  paragraphs:
  - zh: 本策略将捕获主体的解释设置加入父级的权限和生命周期观察，确认采集器是否主动禁用本可执行的外部补全。它依赖有效选项、输入输出模式和实际观察记录，不从缺少 DNS 推断行为；分析进一步连接数字事实结果与批准任务，但设置存在、结果可见和攻击者已经取得结果仍分级记录。
    en: This strategy adds the collector's interpretation settings to the parent's authority and lifecycle observations to
      establish deliberate disabling of external enrichment. It requires effective options, input and output modes, and actual
      observation, without inferring behavior from absent DNS. The analytic further joins numeric facts and approved work
      while retaining separate grades for configured behavior, exposed results, and adversary-acquired results.
