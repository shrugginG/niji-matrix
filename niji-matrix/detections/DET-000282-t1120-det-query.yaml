schema_version: 2.0.0
type: detection-strategy
id: DET-000282
name:
  zh: 外围设备查询的语义与授权工作核验
  en: Peripheral-Query Semantics and Authorized-Work Verification
summary:
  zh: 识别明确的设备清单请求，并按返回事实、调用者与批准任务区分外围设备测绘。
  en: Identify explicit device-inventory requests and distinguish peripheral mapping through returned-fact semantics, callers,
    and approved tasks.
description:
  paragraphs:
  - zh: 策略覆盖显式 Windows 设备查询和 Linux 设备数据库查询，分别由命令与脚本分析、exec 与参数重建承担。它把设备事实与驱动和容量事实分开，不把查询执行当作结果成功；进程内接口与 GUI 的缺口须单独保留。通知式实现由独立策略关联接收生命周期。
    en: The strategy covers explicit Windows device queries and Linux device-database queries through command and script analysis
      and execution-argument reconstruction respectively. It separates device facts from driver and capacity facts and does
      not equate execution with successful results. In-process and GUI gaps remain explicit. A separate strategy correlates
      notification-based receiving lifetimes.
