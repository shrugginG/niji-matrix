schema_version: 2.0.0
type: detection-strategy
id: DET-000283
name:
  zh: 设备变更接收生命周期与事实取得关联
  en: Device-Change Receiving Lifetimes and Fact-Acquisition Correlation
summary:
  zh: 把设备变更接收者、反馈与结果连接，发现绕过重复盘点计数的持续设备监视。
  en: Join device-change receivers, feedback, and results to identify ongoing device monitoring missed by repeated-inventory
    counts.
description:
  paragraphs:
  - zh: Windows 分析要求经验证的接收与调用追踪，区分注册返回、窗口默认广播和结果；Linux 分析以 exec 审计识别显式 monitor 命令并核对授权。两者关注从等待到设备事实的链，而不是根据单次插拔或缺少轮询判定。6416
      仅用于状态旁证，不充当订阅者归属来源。
    en: The Windows analytic requires validated receiving and call tracing and distinguishes registration returns, default
      window broadcasts, and results. The Linux analytic uses execution audit to identify explicit monitor commands and check
      authorization. Both focus on the chain from waiting to device facts rather than judging from hotplug alone or absent
      polling. Event 6416 is state corroboration rather than subscriber attribution.
