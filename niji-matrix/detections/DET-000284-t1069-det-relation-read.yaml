type: detection-strategy
id: DET-000284
name:
  zh: 组与权限关系读取的主体职责差分
  en: Actor-Duty Differential for Group and Permission Relationship Reads
summary:
  zh: 按读取面恢复组关系调查，将主体、目标关系和批准职责比较，并保留请求、枚举与返回事实的证据区别。
  en: Recover group-relationship surveying on each read plane, compare actor and target relationships with approved duties,
    and preserve the distinction between requests, enumeration, and returned facts.
description:
  paragraphs:
  - zh: 本策略围绕所调查的组和权限关系识别异常读取，不以发生成员变更为前提。Windows 分析处理按用户或按组的本地成员枚举，目录分析处理经配置的组属性读取，Graph 与 AWS IAM 分析处理各自可见的关系接口请求。四项分析分别满足其数据前提即可运行，不能要求一次调查同时具有全部平台日志。
    en: This strategy identifies abnormal reads by the group and permission relationships surveyed without requiring a membership
      change. The Windows analytic handles per-user or per-group local enumeration, the directory analytic handles configured
      group-property auditing, and Graph and AWS IAM analytics handle their respective visible relationship-interface requests.
      Each runs independently when its own data prerequisites are met; one survey need not have logs from every platform.
  - zh: 单个正常接口命中仅形成关系调查候选；优先级来自高价值目标、来源或职责变化及缺少匹配的有效任务。枚举事件与请求成功不提供完整成员图，角色或组名也不证明访问权已生效。端点进程、目录对象与云调用主体应按各自标识边界关联，避免把服务器进程和跨机登录标识混为原始操作者。
    en: A normal-interface match alone produces a relationship-survey candidate; priority comes from valuable targets, changes
      in origin or duty, and missing matching authorized work. Enumeration events and successful requests do not supply a
      complete member graph, while a role or group name does not prove effective access. Join endpoint processes, directory
      objects, and cloud callers within their own identifier boundaries rather than treating server processes or cross-host
      logon identifiers as the original operator.
