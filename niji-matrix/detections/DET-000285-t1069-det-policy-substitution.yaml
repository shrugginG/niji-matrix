schema_version: 2.0.0
type: detection-strategy
id: DET-000285
name:
  zh: 中央组映射读取与策略处理语境差分
  en: Central Group-Mapping Reads and Policy-Processing Context Differential
summary:
  zh: 在策略服务器识别组关系配置的异常读取，恢复只监测成员主机枚举时缺失的关系调查面。
  en: Identify abnormal reads of group-relationship configuration on policy servers to restore the survey surface missing
    from member-host-only enumeration monitoring.
description:
  paragraphs:
  - zh: 本策略直接覆盖策略关系推导替代，观察对象是承载组映射的实际策略文件及其目录关联。通过已验证文件访问审核识别读取，再以同服务器登录、来源和正常策略处理或治理任务解释它；不以目标成员主机必须出现枚举事件为条件，也不以没有该事件便自动确认规避。
    en: This strategy directly covers policy-relationship inference substitution and observes actual policy files carrying
      group mappings plus their directory associations. Validated file auditing identifies reads, which are interpreted through
      same-server logons, origin, and normal policy-processing or governance work. It neither requires enumeration events
      on target member hosts nor treats their absence as automatic proof of evasion.
  - zh: 检测输出分为文件读取事实与需调查的关系采集候选，二者不等同于已恢复完整关系图。中央策略权限调整仍由已有策略读取治理缓解措施负责，成员主机读取与中央读取的差异则需要此专门分析，不能仅扩展一般 GPO 清单检测的主体引用。
    en: Outputs distinguish file-read facts from relationship-collection candidates requiring investigation; neither is equivalent
      to recovery of a complete relationship graph. Existing policy-read governance supplies the relevant mitigation, while
      the difference between member-host and central reads requires this dedicated analytic rather than simply extending the
      subjects of generic GPO-inventory detection.
