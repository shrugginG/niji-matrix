schema_version: 2.0.0
type: detection-strategy
id: DET-000286
name:
  zh: 显式进程调查的请求语义与任务来源核验
  en: Explicit Process-Inquiry Semantics and Work-Origin Verification
summary:
  zh: 解析进程盘点命令及脚本，核对主体职责和目标范围，并把执行尝试与实际结果分开。
  en: Parse process-inventory commands and scripts, check principal duties and target scope, and distinguish attempts from
    actual results.
description:
  paragraphs:
  - zh: 本策略覆盖以可见工具或脚本发起的Windows进程查询。分析保留本地与远端目标、名称/PID过滤及查询所需的属性，再以进程实例、会话与批准工作解释它；不会把tasklist名称、LSASS目标或工具合法签名单独作为恶意定论。驻留WMI查询由另一策略恢复原始客户端。
    en: This strategy covers Windows process inquiries issued through visible utilities or scripts. Its analytic retains local
      or remote targets, name/PID filters, and requested properties, then interprets them using process instances, sessions,
      and approved work. The tasklist name, an LSASS target, or a legitimate utility signature alone is not a malicious verdict.
      A separate strategy restores the original client of resident WMI inquiries.
