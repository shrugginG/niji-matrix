schema_version: 2.0.0
type: detection-strategy
id: DET-000287
name:
  zh: 驻留进程调查的原始客户端与查询生命周期恢复
  en: Original-Client and Query-Lifetime Recovery for Resident Process Surveys
summary:
  zh: 从实际WMI进程查询恢复客户端实例及结果等级，补足按新工具启动识别调查的盲点。
  en: Recover client instances and evidence levels from actual WMI process inquiries to supplement utility-launch-based detection.
description:
  paragraphs:
  - zh: 本策略直接覆盖驻留上下文内联进程调查的WMI实现，并同样能够识别非内联的WMI查询。它以查询内容、客户端与任务承载关系为起点，保留provider和原始客户端的不同身份；策略不需要出现新工具启动，也不把缺少启动记录作为内联证明。
    en: This strategy directly covers the WMI implementation of Resident-Context Inline Process Survey and can also identify
      non-inline WMI inquiries. It starts from query content, client identity, and task carriage, retaining distinct provider
      and original-client identities. It requires no new utility launch and does not use missing launch records to prove inline
      execution.
  - zh: 基础分析使用已验证Trace与进程生命周期输出可归属查询线索，独立结果采集只在部署并校验后提高证据等级。Win32_Process的查询、Create/Terminate方法及普通provider活动分流，避免把运行查询与执行或安全削弱混同。
    en: The base analytic uses validated Trace and process lifetimes to produce attributable inquiry leads. Independent result
      capture raises the evidence level only after deployment and validation. Route Win32_Process queries, Create/Terminate
      methods, and ordinary provider activity separately to avoid merging inquiry with execution or defense impairment.
