schema_version: 2.0.0
type: detection-strategy
id: DET-000288
name:
  zh: Registry 查询意图与读取权限使用关联
  en: Registry Query Intent and Exercised-Read Correlation
summary:
  zh: 识别异常环境性 Registry 查询，并区分命令意图、句柄请求与实际使用的读取权限。
  en: Identify unusual environmental Registry queries while separating command intent, handle requests, and exercised read
    rights.
description:
  paragraphs:
  - zh: 本策略分别观察命令执行与键对象访问。命令分析用于发现 reg query 和明确读取脚本的意图，权限使用分析在已验证的审核覆盖内确认 QueryValue 或 EnumerateSubKeys 权利被使用。两者按进程实例与账户关联，查询结果未知时不填补输出，也不把查询软件、策略或
      secret 的目的混为一般配置探索。
    en: This strategy observes command execution separately from key-object access. Command analysis finds intent in reg query
      and explicit read scripts, while exercised-right analysis confirms QueryValue or EnumerateSubKeys rights within validated
      audit coverage. Correlation uses process instance and identity without filling missing output or confusing software,
      policy, or secret-related purposes with general configuration exploration.
