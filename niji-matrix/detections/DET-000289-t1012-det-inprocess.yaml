schema_version: 2.0.0
type: detection-strategy
id: DET-000289
name:
  zh: 驻留进程 Registry 读取与任务上下文关联
  en: Resident-Process Registry Reads and Task-Context Correlation
summary:
  zh: 通过读取原语与真实进程实例识别异常调查，使检测覆盖不依赖新查询执行器。
  en: Identify unusual investigation through read primitives and true process instances so coverage does not depend on a new
    query executor.
description:
  paragraphs:
  - zh: 本策略直接观察承载进程的 Registry 读取，关联已知寿命、对象范围、批准任务和可用代码来源。经验证的访问审计提供权限使用层，专用跟踪提供操作和结果层；有调用栈时再辅助定位读取模块。输出明确区分异常进程内读取、具体查询结果和
      BOF 或注入归因，不以缺少 reg.exe 作为恶意结论。
    en: This strategy directly observes Registry reads by the carrier and correlates known lifetime, object scope, approved
      work, and available code provenance. Validated access auditing supplies a rights-used layer and dedicated tracing supplies
      operation and result layers, with stacks assisting module attribution when available. Findings distinguish anomalous
      in-process reads, specific query results, and BOF or injection attribution. Missing reg.exe is not a maliciousness criterion
      by itself.
