schema_version: 2.0.0
type: detection-strategy
id: DET-000290
name:
  zh: 远端主机调查命令与会话上下文关联
  en: Remote-Host Survey Commands and Session Context
summary:
  zh: 识别执行上下文异常的主机枚举与本地缓存读取请求，并区分命令意图与实际发现结果。
  en: Identify host-enumeration and local-cache read requests in anomalous execution contexts while separating command intent
    from discovery results.
description:
  paragraphs:
  - zh: 本策略以执行请求而非扫描成功为对象，覆盖系统工具发起的远端系统调查与现有缓存读取。关联进程父链、用户和会话内相邻命令，发现与批准排障或盘点不同的用途。分析不会从命令创建事件推断非空返回、在线主机或成功横移；直接 API 枚举和未记录的脚本内调用保留为覆盖限制。
    en: This strategy detects execution requests rather than successful scanning, covering system-tool requests for remote
      systems and existing cache reads. Process ancestry, users, and neighboring commands within a session distinguish activity
      from approved troubleshooting or inventory. Process creation does not establish nonempty results, live hosts, or successful
      lateral movement; direct API enumeration and unrecorded in-process script calls remain coverage limits.
