schema_version: 2.0.0
type: detection-strategy
id: DET-000291
name:
  zh: 既存主机资料异常读取调查
  en: Investigate Anomalous Reads of Existing Host Material
summary:
  zh: 从已配置的文件读访问审计识别异常进程对远端主机资料的消费请求，补足网络扫描观察缺口。
  en: Use configured file read-access auditing to identify unusual processes requesting remote-host material and complement
    network-scan observation.
description:
  paragraphs:
  - zh: 本策略关注当前系统上的候选知识读取，使用已验证可采集的路径、执行主体和系统调用结果来识别异常消费者。它与命令策略分工：前者观察实际文件访问，后者观察显式命令意图。两者不把成功打开解释为完整读取，也不声称覆盖任意内存缓存 API；需用环境中的正常客户端、备份和排障用途约束解释。
    en: 'This strategy addresses candidate-knowledge access on the current system using verified paths, principals, and syscall
      outcomes to identify unusual consumers. It complements command detection: one observes file access and the other explicit
      command intent. Neither equates successful opening with complete reading or covers arbitrary in-memory cache APIs, and
      interpretation depends on the environment''s normal client, backup, and troubleshooting uses.'
