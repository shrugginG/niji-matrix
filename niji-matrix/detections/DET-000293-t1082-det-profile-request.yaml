schema_version: 2.0.0
type: detection-strategy
id: DET-000293
name:
  zh: 主机画像请求与执行上下文核验
  en: Host-Profile Request and Execution-Context Verification
summary:
  zh: 识别偏离批准用途的系统属性请求，保留请求、调用成功与具体返回之间的证据层级。
  en: Identify system-attribute requests departing from approved use while preserving the distinction between requests, successful
    calls, and particular returns.
description:
  paragraphs:
  - zh: 本策略分别观察 Windows 显式诊断与脚本语义，以及 Linux 经配置审计的 uname 系统调用。前者恢复被请求的 OS、硬件与修补对象，后者在不依赖 uname 进程创建的前提下记录系统调用及返回状态。两条分析均与批准画像任务和事件时间身份核对，输出待调查请求或已观测调用，不将其直接判为恶意或补成完整属性画像。
    en: This strategy separately observes explicit Windows diagnostics and script semantics, and Linux uname syscalls under
      configured audit. One reconstructs requested OS, hardware, and patch objects; the other records syscall and return state
      without depending on creation of a uname process. Both compare approved profiling work and event-time identities, reporting
      investigable requests or observed calls without automatically declaring malice or supplying a complete attribute profile.
  - zh: 覆盖不包括全部 Windows getter、macOS GUI、设备 CLI 或云描述返回。云资源图读取已有独立策略，但它的跨服务目标不能仅因 Describe 名称相同而替代主机属性检测。部署方必须验证每条采集路径及映射，缺采集、未知身份和没有输出都以明确的不确定状态交付调查。
    en: Coverage does not include all Windows getters, macOS GUIs, appliance CLIs, or cloud-description returns. Cloud-resource
      graph reads have an independent strategy, but its cross-service objective cannot substitute for host-attribute detection
      merely because both use Describe operations. Deployers must validate each collection path and mapping, preserving missing
      collection, unknown identity, and absent output as explicit uncertainty for investigation.
