schema_version: 2.0.0
type: detection-strategy
id: DET-000294
name:
  zh: 进程内系统属性请求归属
  en: In-Process System-Attribute Request Attribution
summary:
  zh: 从已启用的 WMI 查询 Trace 恢复原始客户端的系统属性请求，补充独立诊断进程监控。
  en: Recover original-client system-attribute requests from enabled WMI query tracing to complement separate diagnostic-process
    monitoring.
description:
  paragraphs:
  - zh: 策略面向查询客户端而非 provider 的进程外观，把实际 ExecQuery 文本、命名空间与操作标识连接到同机同生存期客户端，再同应用职责和批准画像比较。它不要求本次创建 systeminfo 或 wmic，也不把没有这些进程当作独立证据。返回内容不在分析合同内；策略的结果是已归属的请求及调查理由。
    en: The strategy addresses the query client rather than provider-process appearance, joining actual ExecQuery text, namespace,
      and operation identifiers to a client on the same machine and within its lifetime before checking application duties
      and approved profiling. It requires no systeminfo or wmic launch for the inquiry and does not use their absence as independent
      evidence. Return content is outside the analytic contract; output is an attributed request and investigation rationale.
