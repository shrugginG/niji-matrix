schema_version: 2.0.0
type: detection-strategy
id: DET-000295
name:
  zh: 地域输入与定位结果获取归属
  en: Attribution of Regional-Input and Location-Result Acquisition
summary:
  zh: 把本地地区属性读取与端点定位请求归属到具体进程，并区分尝试、返回和地理结论。
  en: Attribute local regional-property reads and endpoint location requests to processes while distinguishing attempts, returns,
    and geographical conclusions.
description:
  paragraphs:
  - zh: 该策略分别覆盖进程内配置输入与端点直接请求外部位置服务两条路径。函数结果分析提供语言、时区和输入区域读取的语义，外联分析提供请求及位置结果的阶段证据；二者均以进程身份、批准用途和返回状态约束结论。单次普通配置读取只形成调查线索，不能直接认定恶意或真实位置。
    en: This strategy separates in-process configuration inputs from endpoint requests to an external location service. Function-result
      analysis supplies language, time-zone, and input-locale semantics, while egress analysis supplies request and result-stage
      evidence. Both constrain conclusions by process identity, approved use, and return status. A routine property read creates
      an investigation lead, not a direct finding of malice or physical location.
