schema_version: 2.0.0
type: detection-strategy
id: DET-000297
name:
  zh: 网络配置读取与诊断上下文核验
  en: Network-Configuration Read and Diagnostic-Context Verification
summary:
  zh: 识别偏离批准用途的接口、路由与无线配置调查，并区分读取意图与成功结果。
  en: Identify interface, routing, and wireless-configuration surveys departing from approved use while distinguishing read
    intent from successful results.
description:
  paragraphs:
  - zh: 本策略把显式诊断命令和程序内网络配置读取分为两条分析路径。命令路径按参数恢复配置调查意图，并排除路由修改、地址续租和当前 socket 清单；原生路径依靠预部署且验证的入口与返回观测，覆盖实际有证据的 GetAdaptersInfo
      以及另外声明的配置 getter，核验调用者及有限返回。子项由原生读取路径直接覆盖，命令路径只覆盖父级；仅见 getter 的事件仍作为调查线索，不自动确认为驻留匿迹。
    en: This strategy separates explicit diagnostic commands from in-process configuration reads. The command path reconstructs
      intent through arguments while separating routing changes, address renewal, and current socket inventories. The native
      path uses predeployed and validated entry-and-return capture for the evidenced GetAdaptersInfo and other declared getters,
      verifying caller and bounded returns. The native path directly covers the child while the command path covers the parent.
      A getter event alone remains an inquiry lead rather than automatic confirmation of resident evasion.
  - zh: 该策略具体覆盖已声明的 Windows 查询入口。互联网连通性测试、所有设备 CLI、Linux 命名空间读取及无线链路报文不因此获得同等覆盖；DNS 成功也不是最终通信成功。策略输出应保留意图、失败、空结果、部分结果和有效返回的层级，防止调查将诊断命令升级为完整网络画像或凭据泄露。
    en: Coverage is specific to the declared Windows query entries. Internet connectivity tests, all appliance CLIs, Linux
      namespace reads, and wireless frames do not receive equivalent coverage, nor does DNS success establish final communication.
      Preserve the levels of intent, failure, empty results, partial results, and valid returns so investigations do not upgrade
      a diagnostic invocation into a complete network profile or credential disclosure.
