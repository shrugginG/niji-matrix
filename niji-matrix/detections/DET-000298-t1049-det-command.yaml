schema_version: 2.0.0
type: detection-strategy
id: DET-000298
name:
  zh: 连接状态显示请求与执行上下文关联
  en: Correlate Connection-State Display Requests with Execution Context
summary:
  zh: 识别偏离批准诊断工作的显式连接调查请求，保留请求与结果的区别。
  en: Identify explicit connection inquiries diverging from approved diagnostics while separating requests from results.
description:
  paragraphs:
  - zh: 策略以系统工具请求读取连接状态的行为为对象，分别利用 Windows 进程事件和 Linux 执行审计恢复参数、主体与上下文。它按参数语义排除路由、接口统计和帮助命令，并使用具体诊断作业而非工具签名判断批准情况。该策略不恢复未采集的表行，也不覆盖全部进程内接口路径。
    en: The strategy detects system-tool requests for connection state, using Windows process events and Linux execution audit
      to reconstruct arguments, principals, and context. Argument semantics exclude routes, interface statistics, and help,
      while concrete diagnostic jobs rather than utility signatures determine approval. It neither recovers uncaptured table
      rows nor covers all in-process interfaces.
