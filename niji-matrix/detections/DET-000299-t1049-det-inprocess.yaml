schema_version: 2.0.0
type: detection-strategy
id: DET-000299
name:
  zh: 连接表调用与实际查询载体归属
  en: Attribute Connection-Table Calls to Their Actual Query Carrier
summary:
  zh: 在已部署并验证的调用级观测中识别既有载体发起的连接表调查。
  en: Identify connection-table inquiries by executing carriers through deployed and validated call-level observation.
description:
  paragraphs:
  - zh: 本策略补充进程创建观察面，以具体表查询和实现查询的载体代码为对象。关联调用入口、调用位置、进程生存期和批准诊断职责，避免把表内 socket 所属 PID 当作读取者。返回状态与可选结果用于区分大小询问、失败、空表和实际返回；调用仪器化不是假定存在的默认
      EDR 数据源，缺少部署验证时此策略尚不能运行。
    en: This strategy complements process-creation observation by detecting particular table inquiries and the carrier code
      implementing them. Call entry, call site, process lifetime, and approved diagnostic duties identify the reader without
      confusing it with socket-owner PIDs in the table. Return status and optional results distinguish size inquiries, failure,
      empty tables, and actual returns. Instrumentation is not an assumed default EDR source; the strategy is unavailable
      operationally until deployment is validated.
