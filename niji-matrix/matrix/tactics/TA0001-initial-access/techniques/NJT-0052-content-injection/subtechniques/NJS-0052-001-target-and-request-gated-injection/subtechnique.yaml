schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0052-001
parent_ref: NJT-0052
name:
  zh: 目标与请求门控注入
  en: Target-and-Request-Gated Injection
summary:
  zh: 仅对匹配来源、路由、URL、Cookie 或抽样条件的流量注入，使多数视点保持正常。
  en: Inject content only into traffic matching source, route, URL, cookie, or sampling conditions so most vantages remain
    normal.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 目标与请求门控注入是攻击者在受控在线传输路径上读取来源、路由或请求上下文，只对满足预设条件的 DNS、HTTP、SMB 等事务插入或替换响应。直接目的可是在未受控主机上建立首次入口，也可向已受控植入体反复交付任务与插件；门控条件使源站与大多数不匹配用户保持正常。稳定变量是注入选择条件，不是其取值或所用协议。
    en: Target-and-Request-Gated Injection reads source, route, or request context on a controlled online transfer path and
      inserts or replaces DNS, HTTP, SMB, or equivalent responses only for matching transactions. It can establish first access
      on an uncompromised host or repeatedly deliver tasking and plug-ins to an existing implant. The gate keeps the origin
      and most unmatched users normal. The stable variable is the injection selector, not its value or protocol.
  - zh: Citizen Lab 记录 PacketLogic 根据来源 IP 与下载行为选择性注入 HTTP 307；ESET 记录 MoustachedBouncer 仅在目标网络路径注入，且植入后经同一路径反复取得 SMB 命令。两类证据分别支持入口门控与持续
      C2 门控；单个目标访问异常仍不足以证明攻击者掌握传输路径。
    en: Citizen Lab documented PacketLogic selectively injecting HTTP 307 responses by source IP and download behavior. ESET
      documented MoustachedBouncer injecting only on target-network paths and repeatedly supplying SMB commands to installed
      implants through that path. These sources support entry gating and continuing C2 gating respectively. One anomalous
      target visit still does not prove adversary control of the transfer path.
stealth_characteristics:
  paragraphs:
  - zh: 目标与请求门控注入使同一源站对象在匹配目标处包含恶意响应，而非目标、普通研究探针和真实源站仍返回正常内容。短时、单视点采样因此容易复现失败；持续 C2 时，任务文件与输出只在少数受控路由和植入轮询周期中出现。
    en: Target-and-Request-Gated Injection makes the same origin object contain an adversarial response for a matching target
      while other users, ordinary research probes, and the true origin remain normal. Short or single-vantage sampling can
      fail to reproduce the event. During continuing C2, task files and outputs appear only on selected routes and implant
      polling cycles.
  - zh: 匹配请求的目标响应摘要、独立出口与源站应答差、注入设备命中规则、植入体轮询和命令结果仍可观察。扩大来源、路径和时间视角可恢复差异；合法地域化、个性化、企业代理改写和 CDN 缓存必须先做基线，避免把正常差分等同恶意。
    en: The matching target's response digest, differences from independent egress and origin replies, injector match rules,
      implant polling, and command results remain observable. Broadening source, route, and time vantages can recover the
      difference. Legitimate localization, personalization, enterprise-proxy changes, and CDN caching require baselines before
      a difference can be called malicious.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需有攻击者控制路径的证据、稳定选择条件、匹配与不匹配响应差、目标接受内容，以及首次入口或持续控制结果。没有路径注入而只是 C2 前端只向有效 Beacon 请求开放时，归 NJT-0224 的请求资格门；即使两者都按请求分支，也不能混淆中间伪造响应和控制端自身服务暴露。
    en: Inclusion requires evidence of an actor-controlled path, a stable selector, matching and nonmatching response differences,
      target acceptance, and either first-entry or continuing-control outcome. A C2 front that only opens to valid Beacon
      requests without path injection belongs to NJT-0224's request-qualified child. Both can branch by request, but a forged
      in-path response is distinct from controller service exposure.
  - zh: NJS-0052-002 由先到的伪造响应竞争真实源站拥有，NJS-0052-003 由目标路由视图中独有的解析与服务结果拥有；门控可与它们并列但不代表竞速或幻影服务。合法 captive portal、A/B 测试和安全代理只有在可证明被攻击者接管并产生相应结果时才进入本项。
    en: NJS-0052-002 owns a forged response racing the origin, while NJS-0052-003 owns resolution and service results existing
      only in the target routing view. Gating can coexist with either but does not itself establish a race or phantom service.
      A captive portal, A/B test, or security proxy enters scope only with proof of adversary control and the corresponding
      outcome.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 外交机构主机访问普通更新或共享服务时，上游路径仅对其网络注入假更新完成入口；植入建立后按固定共享路径轮询时，同一选择性路径提供命令、截图插件和输出回收。攻击者由此把受害网络作为唯一可见控制视点，而公开源站仍像正常服务。
      en: When a diplomatic host visits an ordinary update or shared service, an upstream path can inject a fake update only
        for that network to establish entry. After implantation, polling a stable share path lets the same selective path
        provide commands, screenshot plug-ins, and output return. The victim network becomes the visible control vantage while
        the public origin remains normal.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须观察目标请求、控制在源站响应前可改写内容的路径设备，并维护来源、路由或请求选择器。持续 C2 还需目标按可预测周期发请求并处理回复；VPN、强认证加密、路由改变、提供方处置或选择器失配会破坏门控。
        en: The actor must observe target requests, control a path device able to alter content before the origin reply, and
          maintain source, route, or request selectors. Continuing C2 also requires a target that requests on a predictable
          cadence and processes replies. VPNs, authenticated encryption, route changes, provider enforcement, or selector
          mismatch can break the gate.
    defender_model:
      paragraphs:
      - zh: 防守方需要目标请求与响应、真实源站收据、不同出口的相同请求、路由和 DNS 视图，以及端点任务/结果。以请求指纹、响应摘要、来源网络、路由、进程与时间配对；没有独立视点时只能判断目标接收异常，不能归因为路径注入。
        en: Defenders need target requests and responses, true-origin receipts, the same request from another egress, route
          and DNS views, and endpoint task and result data. Join request fingerprint, response digest, source network, route,
          process, and time. Without an independent vantage they can identify unusual receipt but cannot attribute it to path
          injection.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 选择性注入把入口或控制痕迹局限于少数目标路径
    en: Selective injection confines entry or control traces to a small set of target paths
  analysis:
    paragraphs:
    - zh: 攻击者只对命中选择器的请求生成伪造响应，正常用户和源站没有对应任务或恶意对象；同一行动痕迹分布在少数目标路径、注入设备和端点结果中。短窗单视点调查只能看到局部，必须重建跨来源和跨轮询周期的响应谱系，因而形成时空释痕。
      en: The actor forges responses only for selected requests, leaving ordinary users and the origin without the matching
        task or malicious object. Traces of one action spread among a small target path set, injector, and endpoint outcomes.
        A short single-vantage investigation sees fragments and must reconstruct response lineage across sources and polling
        cycles, producing Spatiotemporal Trace Dilution.
