research:
  limitations:
    paragraphs:
    - zh: Citizen Lab 的 PacketLogic 案例证明选择性 HTTP 注入但聚焦入口；ESET 的 MoustachedBouncer 案例直接连接路径注入与植入后 SMB 控制。两者未公开完整 ISP 规则和所有目标请求，故门控粒度与漏报率不能泛化。
      en: Citizen Lab's PacketLogic case establishes selective HTTP injection focused on entry, while ESET's MoustachedBouncer
        case directly joins path injection to post-compromise SMB control. Neither publishes complete ISP rules or every target
        request, so gate granularity and miss rates cannot be generalized.
