research:
  limitations:
    paragraphs:
    - zh: Fox-IT 给出可复现技术链与检测残迹，但没有持续命令交换的直接事件记录。当前子项对首次入口行为的置信度高；对持续控制用途仅保留假设，不能用父级一般陈述替代子项级证据。
      en: Fox-IT provides a reproducible technical chain and residual signal but no direct incident of continuing command
        exchange. Confidence is high for first-entry behavior; continuing-control use remains a hypothesis and cannot be inferred
        from the parent's general description.
