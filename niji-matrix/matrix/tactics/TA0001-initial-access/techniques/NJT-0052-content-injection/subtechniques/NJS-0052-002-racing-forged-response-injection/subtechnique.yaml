schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0052-002
parent_ref: NJT-0052
name:
  zh: 竞速式伪造响应注入
  en: Racing Forged-Response Injection
summary:
  zh: 观察请求后伪造有效序列状态响应并与真实源站竞速，不持久修改源站。
  en: Observe a request and race the origin with a forged valid-sequence response without persistently modifying the server.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 竞速式伪造响应注入是攻击者从传输路径旁观察真实客户端请求，构造可被客户端接受的同会话响应，并让它先于真实源站应答到达。直接目标是使接收端处理攻击者内容，而源站不必被修改。稳定变量是先到响应对真实响应的竞争及客户端接受状态；所用网页、工具或载荷名称不构成边界。
    en: Racing Forged-Response Injection observes a real client request from beside the transfer path, constructs a same-session
      response the client can accept, and gets it to the client before the true origin replies. Its direct purpose is having
      the receiver process actor content without changing the origin. The stable variable is the competition between arriving
      responses and client acceptance state, not a webpage, tool, or payload name.
  - zh: Fox-IT 对 QUANTUM INSERT 的技术复现证明旁路选择器、有效序列状态及先到伪造响应如何改变客户端接收内容，并提出相同 TCP 序号异载荷的证据。公开来源足以支持首次入口中的匿迹变量；已植入主机持续通过竞速回复取得任务的事件仍缺直接证据，不能由父级的双战术范围自动推出。
    en: Fox-IT's technical reproduction of QUANTUM INSERT shows how off-path selectors, valid TCP sequence state, and an earlier
      forged response alter client receipt and identifies duplicate sequence numbers with different payloads as evidence.
      Public sources support the evasion variable during first entry. A continuing task loop through racing replies on an
      implanted host still lacks direct incident evidence and cannot be inferred from the parent's dual-tactic scope.
stealth_characteristics:
  paragraphs:
  - zh: 竞速式伪造响应注入让客户端只处理先到的攻击者响应，源站随后仍可能正常回复并保有干净内容。只取客户端最终页面或源站文件都可能漏掉“同一请求得到两个不同有效载荷”的瞬间。竞争成功受路径延迟、序列状态、完整性验证和连接重传影响。
    en: Racing Forged-Response Injection has the client process the actor's earlier response while the origin may later reply
      normally and retain clean content. Collecting only the client's final page or the origin file can miss the moment when
      one request acquired two different payloads. Success depends on path latency, sequence state, integrity checks, and
      retransmission.
  - zh: 重复 TCP 序号与不同载荷、到达顺序、请求指纹、客户端处理结果和真实源站摘要仍是残余。完整抓包或不同视点镜像可恢复竞速；TLS 正确认证或任务签名会削弱伪造，缺少原始序列日志时只能按结果提出候选。
    en: Duplicate TCP sequence numbers with different payloads, arrival order, request fingerprint, client outcome, and true-origin
      digest remain residuals. Full packet capture or mirrors at separate vantages can reconstruct the race. Properly authenticated
      TLS or signed tasking weakens forgery, while missing raw sequence records limits classification to a candidate.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求同一请求、可接受的伪造响应、竞争到达顺序和目标处理结果。路径中直接改写单一响应但没有竞争属于父级或其他子项；按目标条件选择何时注入属于 NJS-0052-001；只在目标路由存在服务则属于 NJS-0052-003。它们可以组合，但竞速证据不能由“页面内容不同”替代。
    en: Inclusion requires one request, an acceptable forged response, competing arrival order, and target processing outcome.
      In-path alteration of a single response without a race remains parent behavior or another child. Selecting which targets
      receive injection belongs to NJS-0052-001, while a service existing only in the target route belongs to NJS-0052-003.
      They can combine, but a different page alone does not prove a race.
  - zh: 已记录的首次入口情形可正式归类；持续控制只有在已受控端经竞速回复取得任务并产生结果时才纳入，目前作为研究假设。合法重传、CDN 多路径、缓存不一致和网络故障可能生成相近包序列，需凭攻击者响应内容和源站对照排除。
    en: Documented first-entry cases qualify. Continuing control requires an already compromised endpoint obtaining tasking
      through a racing reply and producing a result; that remains a research hypothesis. Legitimate retransmission, CDN paths,
      cache inconsistency, and faults can create similar packet sequences and require exclusion through actor response content
      and origin comparison.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在受害者浏览明文网页或请求更新时，从旁路看到请求并抢先回复，引导浏览器或更新进程处理恶意内容，真实站点稍后正常响应。若未来在植入后轮询中观察到同样手法提供命令，它才构成 C2 应用；当前不把该可能性写成现场事实。
      en: When a victim browses a plaintext site or requests an update, an actor observing from the side can reply first and
        make the browser or updater process malicious content while the real site responds later. The same method would count
        for C2 only if observed delivering commands during post-compromise polling; that possibility is not treated as a field
        fact here.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要低延迟地观察请求、构造同会话序列与确认状态，并掌握可使客户端接受的响应格式。强制 HTTPS、端到端签名、路径距离与源站更快响应会降低成功率；伪造包可能暴露异常 TTL、时序或重置。
        en: The actor needs low-latency visibility of requests, valid same-session sequence and acknowledgment state, and
          response formatting acceptable to the client. Mandatory HTTPS, end-to-end signatures, path distance, or a faster
          origin reduces success, while forged packets can expose unusual TTL, timing, or resets.
    defender_model:
      paragraphs:
      - zh: 防守方需保存请求和双向 TCP 序列、不同视点的响应载荷摘要、接收端实际处理对象及真实源站收据。只有 DNS/URL 信誉或最终落地文件时，可怀疑注入但不能证明“竞速”；调查窗口必须覆盖同一请求的两个响应。
        en: Defenders retain the request and bidirectional TCP sequence state, response payload digests from different vantages,
          the object the receiver actually processed, and true-origin receipts. DNS or URL reputation and the final file alone
          can suggest injection but not establish a race; the investigation window must cover both responses to one request.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 真实源站保持正常而客户端先处理路径旁伪造响应
    en: The origin remains normal while the client first processes an off-path forged response
  analysis:
    paragraphs:
    - zh: 攻击者以有效序列状态抢先送达伪造响应，客户端把它并入合法请求处理，源站随后仍呈现干净内容。只看源站或最终业务记录的模型缺失关键替换动作；跨视点抓包和重复序号异载荷关联可恢复竞速，形成有条件的行为透明。
      en: The actor races a forged response with valid sequence state into a legitimate request, and the client processes
        it while the origin later remains clean. A model seeing only origin or final business records misses the substitution.
        Multivantage capture joined by duplicate sequence numbers and differing payloads reconstructs the race, producing
        conditional Behavioral Transparency.
