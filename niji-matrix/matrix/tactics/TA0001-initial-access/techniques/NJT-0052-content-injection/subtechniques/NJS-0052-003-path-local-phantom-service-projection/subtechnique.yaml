research:
  limitations:
    paragraphs:
    - zh: ESET 对目标网络和路径局部 SMB 的分析直接支持持续控制，但部分 ISP 设备归属和所有请求包未公开。合法分视图解析、私有共享、灾备和运营商缓存会产生相近表面，须以攻击者控制证据和源站/路径对照提高置信。
      en: ESET's analysis of target networks and path-local SMB directly supports continuing control, but some ISP-device
        attribution and every request packet are not public. Legitimate split-view resolution, private shares, disaster recovery,
        and carrier caching can resemble the surface; actor-control evidence and origin-to-route comparison strengthen confidence.
