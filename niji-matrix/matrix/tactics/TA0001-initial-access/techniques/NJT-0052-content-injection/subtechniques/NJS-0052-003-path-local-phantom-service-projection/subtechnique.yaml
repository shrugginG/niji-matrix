schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0052-003
parent_ref: NJT-0052
name:
  zh: 路径局部幻影服务投射
  en: Path-Local Phantom Service Projection
summary:
  zh: 在受控路径内合成解析或服务回复，使恶意端点仅在目标路由视图中存在。
  en: Synthesize resolution or service replies in a controlled path so the malicious endpoint exists only in the victim routing
    view.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 路径局部幻影服务投射是攻击者在受控路由中合成解析与服务响应，使某个域名、地址或共享服务只对目标路径显得存在，真实公共源站或其他网络并不提供相同内容。直接目的可为首次诱导安装，也可让已植入主机按稳定路径取得任务、插件并写回结果；变量是目标路由视图中的服务存在性差，而不是
      SMB、DNS 或具体 IP。
    en: Path-Local Phantom Service Projection synthesizes resolution and service replies on a controlled route so a domain,
      address, or share appears to exist only for the target path while the public origin or other networks do not provide
      the same content. It can induce first installation or let an implanted host retrieve tasking and plug-ins and write
      results through a stable path. The variable is service-existence difference in the target routing view, not SMB, DNS,
      or a particular IP.
  - zh: ESET 对 MoustachedBouncer 的研究记录公共 IP 实际不由攻击者控制，却在目标路径被投射为可读写 SMB 共享；恶意组件持续读取命令文件、写输出并形成反向 shell。该链直接连接路径局部服务、持续 C2
      与目标结果。
    en: ESET reports that the public IPs used by MoustachedBouncer were not actually controlled by the actor yet appeared
      as readable and writable SMB shares on target paths. Malicious components repeatedly read command files, wrote output,
      and formed a reverse shell. This chain directly joins path-local service projection, continuing C2, and target outcome.
stealth_characteristics:
  paragraphs:
  - zh: 路径局部幻影服务投射让目标端把本地可达的共享路径当作普通远端服务，而不在目标路由的研究者得到空服务、其他内容或正常解析。服务身份与实际提供者分离，按公共 IP 归属或源站扫描建立的基础设施画像因此可能完全错误。
    en: Path-Local Phantom Service Projection makes a share reachable to the target as if it were an ordinary remote service,
      while a researcher outside that route obtains no service, different content, or normal resolution. Service identity
      separates from the real provider, so infrastructure maps based on public IP ownership or origin scans can be wrong.
  - zh: 残余包括目标解析/路由、SMB/HTTP 请求与注入回复、共享文件时间序列、计划任务、插件加载和命令输出。对比目标与独立出口的相同解析和服务请求，再核对真实 IP 所有者和端点处理结果，可恢复幻影；VPN、split DNS 与合法私有服务需要严格对照。
    en: Residuals include target resolution and route, SMB or HTTP requests and injected replies, share-file timelines, scheduled
      tasks, plug-in loads, and command output. Comparing the same resolution and service requests from target and independent
      egress, then checking true IP ownership and endpoint outcomes, can recover the phantom. VPNs, split DNS, and legitimate
      private services require careful baselines.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求目标路径独有的解析或服务响应、真实源站/其他路径缺失、攻击者控制注入点，以及目标接受内容并形成入口或持续控制。只把真实 C2 origin 藏在代理后面属于 NJT-0206；只在控制端按请求资格分支属于 NJT-0224；普通
      CDN、内网共享和 split DNS 不因视图不同自动恶意。
    en: Inclusion requires a resolution or service response unique to the target path, absence at the true origin or other
      routes, actor control of the injection point, and target acceptance producing entry or continuing control. Hiding a
      real C2 origin behind a proxy belongs to NJT-0206. Branching at the controller by request qualification belongs to NJT-0224.
      Ordinary CDNs, private shares, and split DNS are not malicious merely because views differ.
  - zh: 目标与请求门控注入控制哪些请求获得伪造内容，竞速式注入控制先到响应；本项控制“目标路径是否存在这个服务”。三者可组合，但必须分别证明选择条件、竞速状态或路径局部服务差，不能从一个现象推断全部。
    en: Target-and-request gating controls which requests receive forged content, and racing controls which response arrives
      first. This child controls whether the service exists in the target route. The three can combine, but selectors, race
      state, and path-local service differences need separate proof rather than being inferred from one symptom.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 外交机构植入体访问看似在公共互联网的 SMB 共享，受控 ISP 路径实时生成回复，让它定期取得命令文件并写回输出。操作者不必维持可被全球扫描发现的公开 SMB 服务；路径控制一旦失效，幻影共享与任务回路也会消失。
      en: A diplomatic-organization implant reaches an apparently public Internet SMB share, but a controlled ISP path generates
        replies in real time so it can poll command files and write output. The operator need not maintain a globally scannable
        public SMB service. Loss of path control removes the phantom share and task loop.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须控制目标解析或传输路径中的中间设备，并保持 DNS、地址、共享协议和读写状态一致。目标离开受控网络、启用可信 VPN、协议端到端认证或路径设备被取证会削弱效果；持续 C2 还增加可关联的周期性请求。
        en: The actor must control an intermediary on the target resolution or transfer path and keep DNS, addressing, share
          protocol, and read-write state consistent. Leaving the controlled network, using a trusted VPN, enforcing end-to-end
          protocol authentication, or investigating the path device weakens the effect. Continuing C2 also adds correlatable
          periodic requests.
    defender_model:
      paragraphs:
      - zh: 防守方需同时取得目标路径与另一运营商/可信 VPN 的解析和服务结果、真实地址归属、SMB/HTTP 内容摘要、端点任务文件与命令结果。只有目标本地连接记录可证明访问，不能证明服务由路径注入；跨视点差与真实源站收据是关键。
        en: Defenders need resolution and service outcomes from the target route and another carrier or trusted VPN, true
          address ownership, SMB or HTTP content digests, endpoint task files, and command results. A local connection record
          proves access but not path injection; cross-vantage differences and true-origin receipts are decisive.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 路径生成的服务借用公共地址和熟悉共享外观
    en: A path-generated service borrows a public address and familiar share appearance
  analysis:
    paragraphs:
    - zh: 攻击者在目标路由内合成解析与共享回复，让植入体看到可用公共服务并持续交换命令，而真实地址所有者没有该服务。公共地址和熟悉协议替代了真实提供者特征，使单点基础设施信誉与扫描失真；跨路径比较和端点结果可恢复来源差，形成特征伪装。
      en: The actor synthesizes resolution and share replies within the target route, letting an implant see an available
        public service and exchange commands while the true address owner has no such service. Public addressing and familiar
        protocol appearance substitute for the real provider, defeating single-vantage reputation and scanning. Cross-route
        comparison joined to endpoint results recovers provenance, producing Feature Disguise.
