research:
  limitations:
    paragraphs:
    - zh: REF-000096 是唯一同时给出选择性路径注入和植入后反向 shell/插件交换的直接 C2 来源。ESET 遥测直接支持端点任务、命令/输出文件及目标组织范围，但对具体 ISP/SORM 注入设备和某些公网 IP 的真实控制作出不同置信度评估。正式
        Case 与 Claim 必须把端点观察、路径推断和主体归因分开，不能把整个基础设施链写成同一强度的现场事实。
      en: REF-000096 is the only direct source in this review combining selective path injection with a post-compromise reverse
        shell and plug-in exchange. ESET telemetry directly supports endpoint tasking, command and output files, and targeted
        organizations, while its assessment of the exact ISP or SORM injection device and control of some public IPs has varying
        confidence. Canonical cases and claims must separate endpoint observation, path inference, and actor attribution rather
        than present the whole infrastructure chain at one field-observation strength.
    - zh: 现有 NJT/NJS 正文与 DET/NJA/MIT 大量使用首次入口和浏览器入口假设。复用父级 ID 可避免重复技术，但会触发较大语义版本修订、双战术 decision 一致性、全部子项正文、Claim、Defense 和
        Web 导航复核。尤其 NJS-0052-002 变量虽成立，TA0011 应用仍为 hypothesis；若 schema 无法表达 tactic-specific child evidence，主 Agent 应在父级 taxonomy
        与限制中明确呈现，而非假装三项同等 C2 证据。
      en: Existing NJT and NJS prose and DET, NJA, and MIT assume first entry and browser entry extensively. Reusing the parent
        ID avoids duplication but triggers a substantial semantic-version revision and review of dual-tactic decisions, every
        child field, claims, defenses, and Web navigation. NJS-0052-002 is a valid variable while its TA0011 application remains
        a hypothesis. If the schema cannot express tactic-specific child evidence, the primary agent should expose the difference
        in parent taxonomy and limitations rather than present equal C2 evidence for all three.
    - zh: 多视点内容比较具有隐私、带宽和可重复性成本。CDN/Anycast、区域个性化、安全代理、split DNS、captive portal 和合法 SMB 镜像可产生真实差异；TLS、受控信任根或短门控又可能阻止复现。新 Analytic
        的三门结果和窗口为可实施设计，必须在本地数据上校验字段、保留、源站 receipt 与正常变化，不以单一 URL/hash/序号定性。
      en: Multivantage content comparison has privacy, bandwidth, and reproducibility costs. CDN or Anycast, regional personalization,
        security proxies, split DNS, captive portals, and legitimate SMB mirrors can create real differences, while TLS, a
        controlled trust root, or a short gate can prevent reproduction. The new analytic's three outcome gates and windows
        are an implementable design requiring local validation of fields, retention, origin receipt, and normal variation.
        One URL, hash, or sequence number is not dispositive.
