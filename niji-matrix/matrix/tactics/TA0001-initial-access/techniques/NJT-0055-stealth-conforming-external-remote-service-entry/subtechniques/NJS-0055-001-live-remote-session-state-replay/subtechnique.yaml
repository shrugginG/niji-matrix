research:
  limitations:
    paragraphs:
    - zh: Heartbleed 案例对 SSL VPN 活动 token 和跨 IP 重放为直接证据，Microsoft 对云 token/cookie 与 MFA 状态为直接研究；二者协议与绑定不同，不能假定同一字段或可移植性。子项存在性与机理为
        high，但具体平台必须验证 token 是否真正省略了新认证。
      en: Heartbleed provides direct evidence for an active SSL VPN token and cross-IP replay, while Microsoft provides direct
        research on cloud tokens or cookies and MFA state. Their protocols and bindings differ and do not imply identical
        fields or portability. Child existence and mechanism are high confidence, but a specific platform must show that the
        token actually omitted new authentication.
    - zh: 正常会话恢复也会省略新认证，移动网络、NAT 与 HA gateway 会改变 IP；部分提供方不公开 token ID 或内部绑定。没有异常控制证据、状态关联与后继访问时只能报告会话异常。持续重入还需证明状态跨处置仍有效，首次使用不能自动证明
        Persistence。
      en: Legitimate session resume also omits new authentication, while mobile networks, NAT, and high-availability gateways
        change IP. Some providers do not expose token IDs or internal binding. Without adversary-control evidence, state correlation,
        and downstream access, only a session anomaly can be reported. Continuing re-entry also requires state to remain valid
        across response, and first use does not automatically establish Persistence.
