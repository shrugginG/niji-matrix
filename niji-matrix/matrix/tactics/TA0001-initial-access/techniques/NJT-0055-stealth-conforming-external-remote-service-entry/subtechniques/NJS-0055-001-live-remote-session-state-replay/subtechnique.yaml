schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0055-001
parent_ref: NJT-0055
name:
  zh: 活动远程会话状态重放
  en: Live Remote-Session State Replay
summary:
  zh: 攻击者向远程接入服务重放仍有效的 token、cookie 或 session material，继承已完成认证并省略新的口令、MFA 和设备挑战序列。
  en: Adversaries replay a still-valid token, cookie, or session material to a remote-access service, inherit completed authentication,
    and omit a new password, MFA, and device-challenge sequence.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 活动远程会话状态重放是攻击者向 VPN、VDI、远程管理网关或等价外部服务提交仍在有效期且被服务接受的 token、cookie 或 session material，使网关沿用已经完成的主认证、MFA 或设备判断并建立首次恶意会话或后续重入的匿迹子技术。其直接目标是让访问被解释为既有会话恢复而不是一次新的认证。
    en: Live Remote-Session State Replay is an evasion sub-technique in which an adversary presents a still-valid and service-accepted
      token, cookie, or session material to a VPN, VDI, remote-management gateway, or equivalent external service so the gateway
      reuses completed primary authentication, MFA, or device decisions and establishes an initial malicious session or later
      re-entry. Its direct objective is to have access interpreted as established-session resume rather than new authentication.
  - zh: 区分变量是“认证状态被重放并省略新认证序列”，不是 token 类型、窃取方法或远程服务产品。Heartbleed 可从 VPN 设备内存泄露活动 token，pass-the-cookie 可在另一浏览器使用云会话；这些获取行为属于
      Credential Access，本子项从材料被目标服务再次接受并建立远程会话开始，到会话建立结束。
    en: The distinguishing variable is replay of authentication state that omits a new authentication sequence rather than
      token type, theft method, or remote-service product. Heartbleed can leak an active token from VPN appliance memory,
      while pass-the-cookie can reuse a cloud session in another browser. Those acquisition behaviors belong to Credential
      Access. This child begins when the target service accepts the material again and ends when the remote session is established.
stealth_characteristics:
  paragraphs:
  - zh: 活动远程会话状态重放不会生成完整的口令输入、MFA challenge/approval 和设备 posture 验证序列，网关侧可能只记录 session resume、refresh 或已满足认证的成功结果。只监控失败登录、新
      MFA 或密码喷洒的规则看不到关键入口动作；服务还会以熟悉主体和有效 session 属性呈现访问，使重入与合法断线恢复局部同形。
    en: Live Remote-Session State Replay does not produce a complete password-entry, MFA challenge or approval, and device-posture
      sequence. The gateway can record only session resume, refresh, or a success whose authentication is already satisfied.
      Rules monitoring failed sign-ins, new MFA, or password spraying do not see the critical entry action. The service also
      presents the access under a familiar principal and valid session attributes, making re-entry locally resemble legitimate
      reconnection.
  - zh: 状态仍留下 token/session ID、签发与 refresh 时间、首次/再次使用来源、设备或客户端绑定、并发使用、网关节点、注销/撤销和后继资源活动。Heartbleed 案例中的跨 IP 跳变直接暴露重放，Microsoft
      资料也要求关联异常 token、设备与会话。若 token 与硬件或 TLS 证明强绑定、每次来源变化都要求重认证，或撤销快速传播，匿迹效果显著下降。
    en: State still leaves token or session ID, issuance and refresh time, first and repeated origin, device or client binding,
      concurrent use, gateway node, logout or revocation, and downstream resource activity. Cross-IP hopping directly exposed
      replay in the Heartbleed case, and Microsoft reporting also calls for anomalous token, device, and session correlation.
      Stealth declines materially when a token is strongly bound to hardware or TLS proof, every origin change requires reauthentication,
      or revocation propagates quickly.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入一个目标远程服务再次接受既有认证状态、没有执行原本完整认证步骤并建立攻击者会话的行为。判定需要 session/token 身份或可替代关联、前一签发/使用、再次来源/设备、被省略的认证阶段和会话结果；只持有 token、只刷新合法用户会话或只看到无
      MFA 登录均不足。首次恶意使用和处置后的持续重入都可纳入。
    en: This child includes a target remote service accepting established authentication state again, omitting the otherwise
      complete authentication steps, and creating an adversary session. Classification needs session or token identity or
      a substitute join, prior issuance or use, repeated origin or device, omitted authentication stage, and session outcome.
      Possession of a token, refresh of a legitimate user's session, or a sign-in without MFA alone is insufficient. First
      malicious use and continuing re-entry after response can both qualify.
  - zh: 实时 AiTM 中继新的认证流程归认证中继，复制有效凭据后重新完成口令/MFA 归 Valid Accounts，token 窃取归 Credential Access。正常 SSO、浏览器恢复、VPN roaming、HA gateway
      切换和移动网络 IP 变化是强反例；必须结合并发主体、设备绑定、注销状态、异常资源和攻击者控制证据，而不能把所有 session resume 判为重放。
    en: Real-time AiTM relay of a new authentication flow belongs to authentication relay, completing password or MFA again
      with copied credentials belongs to Valid Accounts, and token theft belongs to Credential Access. Normal SSO, browser
      restore, VPN roaming, high-availability gateway change, and mobile-network IP movement are strong counterexamples. Concurrent
      principal activity, device binding, logout state, anomalous resource, and adversary-control evidence are required rather
      than making every session resume replay.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Heartbleed 场景中，攻击者从 SSL VPN 内存获得活动 token，并从另一 IP 重放以绕过新口令、MFA 与客户端检查。云或浏览器场景中，被盗 cookie/token 在另一浏览器继承已完成 MFA。首次被接受的恶意会话属于入口语境；若同一状态在植入、原会话或某一凭据处置后仍能再次建立远程会话，则同时具有持续访问语境。
      en: In Heartbleed, an adversary obtained an active token from SSL VPN memory and replayed it from another IP to bypass
        a new password, MFA, and client check. In cloud or browser contexts, a stolen cookie or token in another browser inherits
        completed MFA. The first accepted malicious session belongs to the entry context, while still-valid state that establishes
        another remote session after an implant, original session, or one credential is remediated also has a durable-access
        context.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要取得可重放状态并理解目标网关的 token/session 格式、有效期、refresh、单点注销、设备/证书/IP 绑定与并发策略。必须在撤销前使用，或维持 refresh 能力；跨设备或跨来源可能需要复制浏览器存储、客户端证书或设备属性。错误绑定、过期和重复使用检测会终止入口并产生高风险信号。
        en: The adversary needs replayable state and knowledge of the gateway's token or session format, validity, refresh,
          single logout, device, certificate or IP binding, and concurrency policy. It must use state before revocation or
          preserve refresh capability. Cross-device or cross-origin use can require copied browser storage, client certificates,
          or device attributes. Binding failure, expiry, and duplicate-use detection terminate entry and create high-risk
          signals.
      - zh: 短 token 寿命、proof-of-possession、硬件/设备绑定、连续访问评估、来源变化重认证和全局会话撤销提高成本。攻击者若只能窃取密码而没有活动状态，本子项不成立；若处置同时撤销 refresh token、cookie、gateway
          session 和设备信任，Persistence 路径终止。
        en: Short token lifetime, proof of possession, hardware or device binding, continuous access evaluation, reauthentication
          on origin change, and global session revocation raise cost. If the adversary can steal only a password and not active
          state, this child does not hold. If response revokes refresh tokens, cookies, gateway sessions, and device trust
          together, the Persistence path ends.
    defender_model:
      paragraphs:
      - zh: 防守方需要远程网关/IdP 的 session/token ID、签发/refresh/注销/撤销、认证方法、MFA 与 posture 结果、gateway node、来源 IP/port、ASN、device/client
          和会话结果，并连接端点及资源访问。精确 session/token ID 可证明同一状态跨来源或并发使用；缺失时只能按主体、设备、时间与资源降级。
        en: Defenders need session or token ID, issuance, refresh, logout or revocation, authentication method, MFA and posture
          result, gateway node, source IP or port, ASN, device or client, and session outcome from the remote gateway or identity
          provider, joined to endpoint and resource access. An exact session or token ID can prove one state used across origins
          or concurrently. Without it, correlation falls back to principal, device, time, and resource.
      - zh: 保留期至少覆盖最大 session/refresh 寿命和处置后的延迟重入，且必须记录正常 roaming、HA gateway、NAT、企业代理和浏览器恢复。防守方不能记录真实 token 内容到普通日志，应保存 hash/ID
          与绑定状态。若提供方只输出成功登录而没有认证步骤与 session lineage，最多形成重放嫌疑。
        en: Retention should cover maximum session or refresh lifetime and delayed re-entry after response and must model
          normal roaming, high-availability gateways, NAT, enterprise proxies, and browser restore. Defenders should not log
          raw token content in ordinary telemetry and should retain a hash or ID plus binding state. If a provider outputs
          only successful sign-ins without authentication steps and session lineage, replay remains only suspected.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 重放状态让新远程会话缺少完整认证序列
    en: Replayed state leaves a new remote session without a complete authentication sequence
  analysis:
    paragraphs:
    - zh: 攻击者重放仍有效的 session/token/cookie，网关复用已经完成的密码、MFA 或设备决定，只产生 resume/refresh 或已认证成功。关键入口因果落在更早签发和当前重放之间，监控当前密码/MFA 的分析没有观察它，形成行为透明。Heartbleed
        与 Microsoft token 资料直接证明这种状态继承。
      en: The adversary replays a still-valid session, token, or cookie and the gateway reuses completed password, MFA, or
        device decisions, producing only resume, refresh, or authenticated success. The critical entry cause lies between
        earlier issuance and current replay and is absent from analytics monitoring current password or MFA, producing Behavioral
        Transparency. Heartbleed and Microsoft token reporting directly establish this state inheritance.
    - zh: 同一状态的签发/首次使用、跨 IP/设备转换、并发、refresh、注销/撤销和后继结果可以恢复。来源直接支持重放与绕过新认证，机理为 high；但平台若没有稳定 ID 或状态被强绑定，只能降级，不能从“没有 MFA”单独推断。
      en: Issuance and first use of the same state, cross-IP or device transition, concurrency, refresh, logout or revocation,
        and downstream outcome can recover the chain. Sources directly support replay and omission of new authentication,
        giving high mechanism confidence. A platform without a stable ID or with strongly bound state requires downgrade,
        and absence of MFA alone cannot establish replay.
