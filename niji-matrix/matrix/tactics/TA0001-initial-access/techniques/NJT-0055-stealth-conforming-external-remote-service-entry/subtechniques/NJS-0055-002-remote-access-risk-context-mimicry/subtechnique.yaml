schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0055-002
parent_ref: NJT-0055
name: {zh: 远程接入风险情境拟态, en: Remote-Access Risk-Context Mimicry}
summary:
  zh: 攻击者让来源地区、ASN/ISP、住宅网络、设备/客户端和时间贴合被冒用用户的远程接入基线，压低粗粒度风险偏离信号。
  en: "Adversaries align source region, ASN or ISP, residential network, device or client, and time with the impersonated user's remote-access baseline to suppress coarse risk-deviation signals."
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 远程接入风险情境拟态是攻击者有意选择或控制来源地理、ASN/ISP、住宅/移动网络、设备或客户端属性和活动时间，使外部 VPN、RDP、VDI 或远程管理会话更接近被冒用用户历史分布的匿迹子技术。其直接目标是降低不可能旅行、陌生网络、新设备或非工作时段等风险特征，而不是改变认证状态本身。
      en: "Remote-Access Risk-Context Mimicry is an evasion sub-technique in which an adversary deliberately selects or controls source geography, ASN or ISP, residential or mobile network, device or client attributes, and activity time so an external VPN, RDP, VDI, or remote-management session more closely matches the impersonated user's historical distribution. Its direct objective is to reduce impossible-travel, unfamiliar-network, new-device, or off-hours risk features rather than change authentication state itself."
    - zh: 区分变量是攻击者控制的风险情境与用户基线距离，不是代理产品、国家、设备类型或账户类别。DEV-0537 使用靠近目标的 VPN 并注册设备，UNC3944 使用本地住宅代理，疑似俄罗斯活动使用同国主要 ISP 的住宅/移动代理。设备注册属于 T1098，本子项只描述以后远程会话借用该设备情境；凭据使用属于 Valid Accounts。
      en: "The distinguishing variable is distance between adversary-controlled risk context and the user's baseline rather than proxy product, country, device type, or account class. DEV-0537 used VPN egress near targets and registered devices, UNC3944 used local residential proxies, and suspected Russian operators used residential or mobile proxies on major ISPs in the same country. Device registration belongs to T1098 and this child describes only later remote sessions borrowing that device context, while credential use belongs to Valid Accounts."
stealth_characteristics:
  paragraphs:
    - zh: 远程接入风险情境拟态让 IP 地理、ASN/ISP、住宅网络、device/client 和时间落入用户常见范围，使基于不可能旅行、国外来源、数据中心代理、新设备或夜间活动的规则风险下降。攻击者仍以熟悉账户通过标准远程服务登录，单次低风险结果与真实远程办公局部同形，防守方难以从一条网关事件区分操作者。
      en: "Remote-Access Risk-Context Mimicry places IP geography, ASN or ISP, residential network, device or client, and time inside a user's common range, lowering rule risk based on impossible travel, foreign origin, datacenter proxy, new device, or off-hours activity. The adversary still signs in under a familiar account through a standard remote service, and one low-risk result locally resembles real remote work, making the operator difficult to distinguish from one gateway event."
    - zh: 拟态不覆盖全部谱系。商业住宅代理账户/出口轮换、TLS/客户端指纹、设备资产与注册来源、IP 声誉和并发使用、资源访问、用户实际位置、session/token 以及长期命令与数据行为仍可区分。真实用户旅行、移动 ISP、NAT、企业 egress、设备换新和轮班会产生相同局部情境；只有攻击者控制证据、跨层不一致与后继结果结合时，才能提高置信度。
      en: "Mimicry does not cover complete lineage. Commercial residential-proxy account or egress rotation, TLS or client fingerprint, device asset and enrollment origin, IP reputation and concurrent use, resource access, the user's actual location, session or token, and long-term command and data behavior remain discriminating. Real travel, mobile ISPs, NAT, enterprise egress, device replacement, and shift work create the same local context. Confidence rises only when adversary-control evidence, cross-layer inconsistency, and downstream outcome combine."
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入攻击者有意使来源、设备/客户端和时间中的一个或多个维度贴合用户远程接入基线，并通过外部服务建立会话的行为。判定需要明确受控情境、用户历史或同行基线、当前会话距离/命中结果和后继访问；一个本地 IP、住宅 ASN 或低 risk score 单独不足。首次入口和后续重入均可纳入。
      en: "This child includes an adversary deliberately aligning one or more origin, device or client, and time dimensions with a user's remote-access baseline and establishing a session through an external service. Classification requires an identified controlled context, user-history or peer baseline, current-session distance or match outcome, and downstream access. A local IP, residential ASN, or low risk score alone is insufficient. Initial entry and later re-entry can both qualify."
    - zh: 正常远程办公、旅行、移动网络、企业 VPN/代理、托管桌面、设备更换和灾难恢复是强反例；设备注册/信任状态变更归 T1098，token/session 重放归 NJS-0055-001，纯有效凭据使用归 Valid Accounts。攻击者偶然位于同一地区而没有有意控制或基线研究时，不应把地理相近自动解释为拟态。
      en: "Normal remote work, travel, mobile networks, enterprise VPN or proxies, hosted desktops, device replacement, and disaster recovery are strong counterexamples. Device enrollment or trust-state change belongs to T1098, token or session replay to NJS-0055-001, and pure valid-credential use to Valid Accounts. An adversary accidentally in the same region without deliberate control or baseline research should not have geographic proximity automatically interpreted as mimicry."
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: DEV-0537 为目标选择地理接近的 VPN 出口并使用注册设备满足条件访问；UNC3944 与疑似俄罗斯活动分别使用本地或同国主要 ISP 的住宅/移动代理。攻击者可在首次登录或原植入清除后的重入中复用这些条件，使远程网关和 IdP 的粗粒度风险引擎把会话归入用户常见来源与设备范围。
        en: "DEV-0537 selected geographically proximate VPN egress and used registered devices to satisfy Conditional Access, while UNC3944 and suspected Russian activity used local or same-country residential or mobile proxies on major ISPs. An adversary can reuse these conditions for a first sign-in or re-entry after implant removal so coarse risk engines at the remote gateway and identity provider place the session within familiar user origin and device ranges."
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要取得远程服务可接受的身份材料，并研究用户常见地点、ASN/ISP、设备/客户端、工作时间和远程访问习惯。需要采购或控制合适住宅/移动代理、终端或设备状态，保持出口稳定并在用户可能活动的时段登录；越多维贴合，资源、等待和协调成本越高。代理封禁、设备不合规或用户基线改变会使拟态失败。
          en: "The adversary needs identity material accepted by the remote service and research into the user's common locations, ASN or ISP, device or client, work time, and remote-access habits. It must acquire or control a suitable residential or mobile proxy, endpoint, or device state, keep egress stable, and sign in when the user is likely active. Alignment across more dimensions raises resource, waiting, and coordination cost. Proxy blocking, device noncompliance, or a changed user baseline breaks mimicry."
        - zh: 强设备证明、抗钓鱼重新认证、trusted egress 清单、proxy intelligence、token binding、用户确认和会话内持续风险评估会提高成本。攻击者若只使用任意公网 IP 或数据中心 VPN 而没有贴合用户历史，仍可能凭有效凭据成功，但不属于本变量；过度追随用户时间还可能与真实用户产生并发并暴露。
          en: "Strong device attestation, phishing-resistant reauthentication, trusted-egress inventory, proxy intelligence, token binding, user confirmation, and continuous in-session risk evaluation raise cost. An adversary using an arbitrary public IP or datacenter VPN without matching user history can still succeed with valid credentials but does not satisfy this variable. Following the user's timing too closely can also create concurrency with the real user and expose the session."
    defender_model:
      paragraphs:
        - zh: 防守方需要 IdP/网关登录与风险结果、source IP/port、ASN/ISP、proxy/VPN 类型、地理、device/client、认证方法、session/token、时间和资源结果，并从 MDM/资产、端点、企业 egress 与代理情报补充设备所有权和来源。用户基线至少覆盖业务周期，并区分住宅、企业、移动和旅行状态。
          en: "Defenders need identity-provider or gateway sign-in and risk outcomes, source IP or port, ASN or ISP, proxy or VPN type, geography, device or client, authentication method, session or token, time, and resource outcome, enriched with device ownership and origin from MDM or asset, endpoint, enterprise egress, and proxy intelligence. User baselines should cover business cycles and distinguish residential, enterprise, mobile, and travel states."
        - zh: 单次 geolocation 和 ASN 不可靠，移动运营商、CGNAT 与商业住宅代理会共享出口；提供方 risk engine 也可能不公开权重。防守方应把“情境贴合”作为降低单项异常而非良性证明，继续比较设备注册来源、TLS/client、并发主体、资源访问和会话历史。没有长期基线或用户实际位置时只能形成有限推断。
          en: "One geolocation and ASN are unreliable, mobile carriers, CGNAT, and commercial residential proxies share egress, and providers may not expose risk-engine weights. Defenders should treat context alignment as reduced single-feature anomaly rather than proof of benignness and continue comparing device-enrollment origin, TLS or client, principal concurrency, resource access, and session history. Without a long baseline or the user's actual location, inference remains limited."
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 用户常见来源、设备与时间特征包裹恶意远程会话, en: "User-familiar origin, device, and time features wrap a malicious remote session"}
    analysis:
      paragraphs:
        - zh: 攻击者把地理、ASN/ISP、住宅/移动网络、设备/客户端和时间调整到用户常见分布，使会话继续由真实账户和标准网关承载。DEV-0537、UNC3944 和疑似俄罗斯活动直接记录相近选择；依赖国外 IP、数据中心代理、不可能旅行和新设备的粗粒度规则失去区分，恶意会话借用正常远程办公外观形成特征伪装。
          en: "The adversary adjusts geography, ASN or ISP, residential or mobile network, device or client, and time to the user's common distribution while the real account and standard gateway continue carrying the session. DEV-0537, UNC3944, and suspected Russian activity directly document such choices. Coarse rules relying on foreign IPs, datacenter proxies, impossible travel, and new devices lose discrimination, and the malicious session borrows normal remote-work appearance to produce Feature Disguise."
        - zh: 设备注册来源、代理账户/轮换、TLS/client、用户实际位置、并发、资源与长期行为仍能恢复差异。公开来源证明情境选择和降低地理/设备异常，但未逐会话公开风险分数或主观匿迹意图，因此机理为 medium；一个低风险登录没有上述控制证据时不能归类。
          en: "Device-enrollment origin, proxy account or rotation, TLS or client, actual user location, concurrency, resources, and long-term behavior can recover the difference. Public sources establish context selection and reduced geography or device anomalies but do not publish exact risk scores or subjective stealth intent for every session, so mechanism confidence is medium. One low-risk sign-in without such control evidence cannot be classified here."
    evidence_refs: [REF-000103, REF-000111, REF-000112]
    confidence: medium
defense: {detections: {coverage: available, strategy_refs: [DET-000053, DET-000094]}, mitigations: {coverage: available, mitigation_refs: [MIT-000052, MIT-000095]}}
evidence: {claim_refs: [CLM-000207], case_refs: [CASE-000120, CASE-000121], reference_refs: [REF-000103, REF-000111, REF-000112]}
research:
  limitations:
    paragraphs:
      - zh: 三项来源直接支持地理、住宅/移动 ISP 和设备情境的选择，但对象与细节不同。DEV-0537 的设备注册属于 T1098，只能用后续会话情境；UNC3944 与疑似俄罗斯活动是不同归因，CASE-000121 只合并共同变量。不同网关的风险特征和阈值不能机械复制。
        en: "The three sources directly support selection of geography, residential or mobile ISP, and device context but cover different objects and details. DEV-0537 device registration belongs to T1098 and only later session context is used here. UNC3944 and suspected Russian activity have distinct attribution, and CASE-000121 combines only their shared variable. Risk features and thresholds cannot be copied mechanically across gateways."
      - zh: 正常用户同样会使用住宅代理、企业 VPN、移动网络、旅行设备和非典型时间；IP geolocation 与 ASN 只是一种概率信号。没有长期用户基线、设备所有权、代理来源和后继行为时不能证明攻击者有意拟态；持续重入还必须证明这些条件在原处置后被再次使用。
        en: "Legitimate users also use residential proxies, enterprise VPNs, mobile networks, travel devices, and unusual hours, while IP geolocation and ASN are probabilistic signals. Without a long user baseline, device ownership, proxy origin, and downstream behavior, deliberate mimicry cannot be established. Continuing re-entry additionally requires the conditions to be used again after original response."
