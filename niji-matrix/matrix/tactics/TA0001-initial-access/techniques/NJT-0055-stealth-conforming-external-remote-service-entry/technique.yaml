schema_version: 2.0.0
type: technique
id: NJT-0055
name: {zh: 远程服务拟态访问, en: Stealth-Conforming External Remote-Service Access}
summary:
  zh: 攻击者通过外部 VPN、RDP、VDI 或远程管理服务建立首个会话或持续重入，并以既有会话状态重放或用户风险情境对齐降低新认证与来源异常。
  en: "Adversaries establish an initial session or continuing re-entry through an external VPN, RDP, VDI, or remote-management service and reduce new-authentication and origin anomalies through established-session-state replay or user-risk-context alignment."
aliases:
  - External Remote Services
classification:
  tactic_refs: [TA0001, TA0003]
  origin: {kind: attack-adapted, source_attack_id: T1133, source_attack_version: "19.1"}
  decision_ref: DEC-TA0001-T1133
definition_and_concept:
  paragraphs:
    - zh: 远程服务拟态访问是攻击者通过受害组织暴露或授权的 VPN、RDP、VDI、远程管理网关及等价外部服务，建立一个被服务接受的认证会话，并有意控制会话状态或风险情境使入口更接近正常远程访问的技术。其直接对象是“外部服务接受并建立的远程会话”，不是凭据、token、代理、设备或会话内命令本身。
      en: "Stealth-Conforming External Remote-Service Access is a technique in which an adversary establishes an authenticated session accepted by a victim organization's exposed or authorized VPN, RDP, VDI, remote-management gateway, or equivalent external service and deliberately controls session state or risk context so entry more closely resembles normal remote access. Its direct object is the remote session accepted and established by the external service rather than the credential, token, proxy, device, or in-session command by itself."
    - zh: 同一行为可以在 TA0001 建立首个立足点，也可以在 TA0003 作为已保留的重入路径：Persistence 语义从攻击者已经拥有另一立足点、仍保留可再次使用的远程服务材料或情境开始，到新远程会话成功建立为止。Heartbleed 活动 token 重放证明会话状态可绕过新认证，住宅代理与 DEV-0537 证明来源/设备情境可贴合用户。战术阶段不改变这两个痕迹变量，因此复用同一父子对象，但由独立 DEC-TA0003-T1133 记录持续重入准入。
      en: "The same behavior can establish a first foothold under TA0001 or serve as a retained re-entry path under TA0003. Persistence scope begins when an adversary already has another foothold and retains remote-service material or context usable again and ends when a new remote session is successfully established. Heartbleed active-token replay proves session state can omit new authentication, while residential proxies and DEV-0537 establish user-aligned origin or device context. Tactic phase does not change these two trace variables, so one parent and child set is reused, with continuing re-entry admitted independently by DEC-TA0003-T1133."
stealth_characteristics:
  paragraphs:
    - zh: 远程服务拟态访问利用服务本来就接受的状态与上下文。会话状态重放可让网关直接恢复或延续认证，不再出现新的口令、MFA、设备姿态与挑战序列；风险情境拟态则让来源国家/地区、ASN/ISP、住宅网络、设备和活动时间更接近被冒用用户。单条成功 VPN/RDP 登录、低风险评分或熟悉账户因此可能看似正常，防守方难以区分合法恢复、真实用户访问与攻击者重入。
      en: "Stealth-Conforming External Remote-Service Access uses state and context the service already accepts. Session-state replay can have a gateway restore or continue authentication without a new password, MFA, device-posture, and challenge sequence, while risk-context mimicry makes source country or region, ASN or ISP, residential network, device, and activity time resemble the impersonated user. One successful VPN or RDP sign-in, low risk score, or familiar account can therefore look normal and make legitimate recovery, real-user access, and adversary re-entry difficult to distinguish."
    - zh: 远程入口仍留下多层残余证据：token/session ID、签发与首次/再次使用、认证方法和 MFA 状态、设备/客户端标识、源 IP/ASN/ISP、网关、并发或来源跳变、会话建立/注销、端点进程及会话后的资源行为。Heartbleed 案例显示同一活动 VPN 状态跨 IP 使用，Microsoft 说明 token/cookie 会继承 MFA 但仍可通过异常 token、设备和会话撤销调查。正常远程办公、移动网络、企业代理、旅行和灾难恢复是强反例。
      en: "Remote entry still leaves multilayer residual evidence: token or session ID, issuance and first or repeated use, authentication method and MFA state, device or client identifier, source IP, ASN or ISP, gateway, concurrent or origin hopping, session establishment and logout, endpoint process, and post-session resource behavior. The Heartbleed case shows one active VPN state used across IP addresses, while Microsoft explains that tokens or cookies inherit MFA yet remain investigable through anomalous token and device evidence and session revocation. Normal remote work, mobile networks, enterprise proxies, travel, and disaster recovery are strong counterexamples."
scope_boundary_definition:
  paragraphs:
    - zh: 本技术纳入攻击者通过外部远程服务建立首次或后续认证会话，并以仍有效 session/token/cookie 省略新认证序列，或有意控制来源、设备与时间情境降低风险偏离的行为。判定需要服务或网关、主体、session/token、来源/设备、时间和会话结果中的可连接集合；Persistence 还要求证明远程服务材料在原立足点或会话中断后仍可再次使用。产品、协议、账户类型和代理供应商不形成子技术。
      en: "This technique includes adversary establishment of an initial or later authenticated session through an external remote service while using a still-valid session, token, or cookie to omit a new authentication sequence or deliberately controlling origin, device, and time context to reduce risk deviation. Classification requires a joinable set containing service or gateway, principal, session or token, origin or device, time, and session outcome. Persistence additionally requires evidence that remote-service material remained reusable after the original foothold or session was interrupted. Product, protocol, account type, and proxy provider do not form children."
    - zh: 凭据、token 或 cookie 的获取属于 Credential Access 或 Acquire Access；只使用有效身份而没有远程服务/情境变量归 Valid Accounts；利用远程服务漏洞归公开应用入口；实时中继新的认证流程归认证中继；会话内命令、横向移动和 C2 属于各自技术。正常 session resume、SSO、漫游、企业 egress、设备更换和轮班会产生同形信号，必须以授权、设备绑定、并发活动和后继用途排除。
      en: "Acquisition of a credential, token, or cookie belongs to Credential Access or Acquire Access. Use of a valid identity without the remote-service or context variable belongs to Valid Accounts. Exploitation of a remote-service vulnerability belongs to public-application entry, real-time relay of a new authentication flow to authentication relay, and commands, lateral movement, and C2 inside the session to their respective techniques. Normal session resume, SSO, roaming, enterprise egress, device change, and shift work create the same local signals and require authorization, device binding, concurrent activity, and downstream purpose as counterexamples."
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 初始进入时，攻击者可以把窃取的活动 VPN token/cookie 交给网关，或用与目标用户本地地理、住宅 ISP、设备和工作时间相近的条件登录，使首个会话被解释为延续或低风险远程办公。Heartbleed、DEV-0537 和 UNC3944/疑似俄罗斯住宅代理活动分别提供直接实例。
        en: "For initial entry, an adversary can present a stolen active VPN token or cookie to the gateway or sign in from geography, residential ISP, device, and work time close to the target user so the first malicious session is interpreted as continuation or low-risk remote work. Heartbleed, DEV-0537, and UNC3944 or suspected Russian residential-proxy activity provide direct instances."
      - zh: 持续重入时，攻击者在端点 implant、原交互会话或某一工具被清除后，利用仍未失效的远程服务状态、凭据与风险情境重新建立会话。后继资源访问只证明重入结果，不扩张父级边界；若所有 token/session 已撤销、设备绑定更新且入口凭据轮换，本技术的持久路径即终止。
        en: "For continuing re-entry, an adversary uses remote-service state, credentials, and risk context that remain valid after an endpoint implant, original interactive session, or one tool is removed to establish another session. Downstream resource access proves re-entry outcome but does not expand the parent boundary. The persistence path ends when every token and session is revoked, device binding changes, and ingress credentials are rotated."
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 会话重放要求攻击者取得服务仍接受的 token、cookie 或 session material，理解有效期、绑定设备/证书/IP、refresh 规则和注销语义，并在过期或撤销前重放。某些材料只能在同设备或客户端使用，Heartbleed 类内存泄露还依赖脆弱网关；异常并发、跨 IP 跳变或客户端不一致会暴露。
          en: "Session replay requires an adversary to obtain token, cookie, or session material the service still accepts, understand validity, device, certificate or IP binding, refresh rules, and logout semantics, and replay before expiry or revocation. Some material works only on the same device or client, while a Heartbleed-style memory leak depends on a vulnerable gateway. Anomalous concurrency, cross-IP hopping, or client inconsistency exposes the action."
        - zh: 风险情境拟态要求攻击者研究用户常用地区、ASN/ISP、设备/客户端、活动时间和远程服务习惯，并控制合适住宅/移动代理或设备状态。情境越贴近，资源采购、代理稳定性、设备控制和等待成本越高；用户行为变化、强设备证明、抗钓鱼重认证、token binding 和持续风险评估会破坏拟态。攻击者只有密码而不控制这些变量时仍可能登录，但不成立本子项。
          en: "Risk-context mimicry requires research into a user's common region, ASN or ISP, device or client, activity time, and remote-service habits and control of a suitable residential or mobile proxy or device state. Closer alignment raises resource acquisition, proxy stability, device control, and waiting cost. User behavior change, strong device proof, phishing-resistant reauthentication, token binding, and continuous risk evaluation break the mimicry. An adversary with only a password can still sign in but does not satisfy this child."
    defender_model:
      paragraphs:
        - zh: 防守方需要身份提供方/远程网关的 token/session 签发、refresh、challenge、MFA、设备姿态、登录/注销和结果，以及网络侧 source IP/port、ASN/ISP、VPN/proxy、TLS/客户端特征；端点与资源侧需要设备 ID、进程、会话、并发主体活动和后继资源访问。以 tenant/gateway、principal、token/session、device/client 和 request/correlation ID 连接，才能区分新认证、合法恢复与重放。
          en: "Defenders need token or session issuance, refresh, challenge, MFA, device posture, sign-in or logout, and outcome from the identity provider or remote gateway; source IP or port, ASN or ISP, VPN or proxy, and TLS or client features from the network; and device ID, process, session, concurrent principal activity, and downstream resource access from endpoint and resource planes. Tenant or gateway, principal, token or session, device or client, and request or correlation ID are needed to distinguish new authentication, legitimate resume, and replay."
        - zh: 用户风险基线必须覆盖正常住宅/企业 egress、移动运营商、旅行、轮班、设备更换和灾难恢复，且保留时间至少覆盖 token/session 最大寿命和延迟重入。单一 IP 地理、低风险评分或正常 MFA claim 不是最终证据；代理出口共享、NAT 和提供方字段缺失会产生盲区。若服务不暴露稳定 session/token ID，只能按主体、设备、来源与时间降级关联。
          en: "User-risk baselines must cover normal residential or enterprise egress, mobile carriers, travel, shift work, device changes, and disaster recovery, with retention at least as long as maximum token or session lifetime and delayed re-entry. IP geography, a low risk score, or a normal MFA claim alone is not final evidence. Shared proxy egress, NAT, and missing provider fields create blind spots. When a service exposes no stable session or token ID, correlation falls back to principal, device, origin, and time at lower confidence."
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 既有会话状态省略新的认证挑战与来源链, en: "Established session state omits a new authentication challenge and origin chain"}
    analysis:
      paragraphs:
        - zh: 攻击者向远程网关重放仍有效的 token、cookie 或 session material，服务沿用已完成的口令、MFA 或设备判断而不产生完整新认证序列。Heartbleed 案例直接观察活动 SSL VPN token 跨来源重放，Microsoft 也说明被盗 token/cookie 可以继承 MFA。只监控新登录挑战的分析看见正常 session resume 或缺少事件，关键重入因果没有进入观察，形成行为透明。
          en: "The adversary replays a still-valid token, cookie, or session material to a remote gateway, and the service reuses completed password, MFA, or device decisions without producing a complete new authentication sequence. The Heartbleed case directly observes active SSL VPN tokens replayed across origins, and Microsoft explains that stolen tokens or cookies can inherit MFA. An analytic monitoring only new sign-in challenges sees normal session resume or no event, leaving the critical re-entry cause outside observation and producing Behavioral Transparency."
        - zh: session/token ID、签发/refresh、首次与再次来源、设备绑定、并发使用、注销/撤销和后继资源仍可恢复链。行为和观察断点有直接证据，但各网关的绑定与日志不同；父级只在 NJS-0055-001 路径具备该机理，因此置信度为 high，不扩张到所有远程服务登录。
          en: "Session or token ID, issuance or refresh, first and repeated origin, device binding, concurrent use, logout or revocation, and downstream resources can recover the chain. Behavior and observation break have direct evidence, but gateway binding and logging differ. The parent has this mechanism only through NJS-0055-001, supporting high confidence without extending it to every remote-service sign-in."
    evidence_refs: [REF-000102, REF-000070]
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary: {zh: 用户常见来源、设备与时间特征包裹攻击者远程会话, en: "User-familiar origin, device, and time features wrap an adversary remote session"}
    analysis:
      paragraphs:
        - zh: 攻击者从目标附近住宅/移动 ISP、熟悉地区、已注册设备或常用时间登录，使入口事件的国家、ASN、设备和时间特征落入用户历史分布。DEV-0537、UNC3944 和疑似俄罗斯活动直接说明这些选择；基于不可能旅行、陌生网络或新设备的粗粒度分类失去区分，恶意会话借用正常用户远程办公外观，形成特征伪装。
          en: "The adversary signs in through a residential or mobile ISP near the target, a familiar region, a registered device, or a usual time so country, ASN, device, and timing features fall within user history. DEV-0537, UNC3944, and suspected Russian activity directly document these choices. Coarse impossible-travel, unfamiliar-network, or new-device classification loses discrimination, and the malicious session borrows normal remote-work appearance, producing Feature Disguise."
        - zh: 代理账户、出口轮换、TLS/客户端、设备资产/注册来源、session 并发、资源访问和长期行为仍能区分。来源直接支持情境选择与降低地理信号，但具体 risk engine 分数与攻击者意图并非逐会话公开，因此父级机理校准为 medium；NJS-0055-002 的变量存在性仍为 high。
          en: "Proxy account, egress rotation, TLS or client, device asset or enrollment origin, session concurrency, resource access, and long-term behavior remain discriminating. Sources directly support context selection and reduced geography signal, but do not publish exact risk-engine scores and adversary intent for every session, so parent mechanism confidence is medium while existence of the NJS-0055-002 variable remains high."
    evidence_refs: [REF-000103, REF-000111, REF-000112]
    confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 两个 Niji 子技术以不可互换的远程会话变量划分。活动远程会话状态重放改变是否出现新的认证序列，状态键是 token/session、签发/refresh、设备绑定和来源转换；远程接入风险情境拟态改变来源、设备与时间是否偏离用户基线，状态键是 IP/ASN/ISP、地区、device/client 与行为历史。前者可以来自明显异常 IP，后者可以使用完整新认证，因此独立成立并需要不同检测与撤销动作。
        en: "Two Niji children divide noninterchangeable remote-session variables. Live Remote-Session State Replay changes whether a new authentication sequence appears, with token or session, issuance or refresh, device binding, and origin transition as state keys. Remote-Access Risk-Context Mimicry changes whether origin, device, and time deviate from user baseline, with IP, ASN or ISP, region, device or client, and behavior history as state keys. Replay can originate from an obviously anomalous IP, while context mimicry can use a complete new authentication, so they hold independently and require different detection and revocation actions."
      - zh: ATT&CK T1133 在固定基线无子技术，开放搜索还审查凭据类型、服务产品、首次/后续阶段、漏洞利用和实时中继；这些分别是介质、工具、战术语境或邻接技术，不构成匿迹变量。两个变量同时适用于 TA0001 与 TA0003，跨战术复用是因为远程会话痕迹和防御逻辑相同，不是用一个通用入口模板替代独立威胁模型。
        en: "Fixed-baseline ATT&CK T1133 has no children, and open search also reviewed credential type, service product, initial versus later phase, vulnerability exploitation, and real-time relay. These are media, tools, tactic context, or adjacent techniques rather than stealth variables. Both variables apply to TA0001 and TA0003. Cross-tactic reuse follows identical remote-session traces and defensive logic rather than using one generic entry template instead of an independent threat model."
  coverage: established
  subtechnique_refs: [NJS-0055-001, NJS-0055-002]
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000053, DET-000094]
  mitigations:
    coverage: available
    mitigation_refs: [MIT-000052, MIT-000095]
evidence:
  claim_refs: [CLM-000240, CLM-000373, CLM-000206, CLM-000207]
  case_refs: [CASE-000119, CASE-000120, CASE-000121]
  reference_refs: [REF-000088, REF-000102, REF-000103, REF-000111, REF-000112, REF-000070]
research:
  limitations:
    paragraphs:
      - zh: Heartbleed 活动 VPN token 为状态重放提供直接案例，但依赖特定脆弱设备和 token 未绑定属性；Microsoft cloud token 资料支持 cookie/token 与 MFA 状态，不能证明所有 VPN/VDI 协议相同。DEV-0537、UNC3944 与疑似俄罗斯代理资料直接支持情境对齐，但设备注册本身归 T1098，只有以后远程会话使用该状态的部分属于本技术。
        en: "Active VPN tokens from Heartbleed provide a direct replay case but depend on a vulnerable appliance and token binding properties. Microsoft cloud-token reporting supports cookies or tokens and inherited MFA state but cannot make every VPN or VDI protocol identical. DEV-0537, UNC3944, and suspected Russian proxy reporting directly supports context alignment, while device registration itself belongs to T1098 and only later remote sessions using that state belong here."
      - zh: 正常 session resume、SSO、住宅网络、移动运营商、企业代理、旅行和设备更换与两个子项局部同形。风险引擎内部特征、token 绑定和注销传播通常不完全公开；没有稳定 session/token ID 时只能做主体级推断。持续重入还需要证明会话材料跨原处置仍有效，单次低风险登录不能证明 Persistence 或攻击者匿迹意图。
        en: "Normal session resume, SSO, residential networks, mobile carriers, enterprise proxies, travel, and device changes locally resemble both children. Risk-engine internals, token binding, and logout propagation are rarely fully exposed, and missing stable session or token IDs permit only principal-level inference. Continuing re-entry additionally requires session material to remain usable across original response. One low-risk sign-in cannot establish Persistence or adversary stealth intent."
