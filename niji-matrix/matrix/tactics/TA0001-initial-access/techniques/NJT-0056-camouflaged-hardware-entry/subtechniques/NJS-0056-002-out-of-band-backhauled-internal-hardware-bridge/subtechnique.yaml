schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0056-002
parent_ref: NJT-0056
name:
  zh: 带外回传的内网硬件桥
  en: Out-of-Band-Backhauled Internal Hardware Bridge
summary:
  zh: 本地硬件接入内网并通过蜂窝等独立链路接受远程控制。
  en: Connect planted hardware to the internal network and control it through an independent cellular or out-of-band link.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 本地硬件接入内网并通过蜂窝等独立链路接受远程控制。该行为的直接目标是降低首次入口的识别、关联或归因能力；攻击者控制的是促成该入口结果的时点、情境、路径、身份、设备、内容或供应关系。该边界描述可重复的匿迹变量，而不是特定工具、产品、介质或偶然环境。
    en: Connect planted hardware to the internal network and control it through an independent cellular or out-of-band link. Its direct objective is to reduce detection, correlation,
      or attribution of the first entry; the adversary controls the timing, context, path, identity, device, content, or supply relationship that produces this entry result. This boundary
      describes a repeatable stealth variable rather than a particular tool, product, medium, or accidental environment.
stealth_characteristics:
  paragraphs:
  - zh: 带外回传的内网硬件桥由攻击者有意改变可见入口痕迹，具体做法是本地硬件接入内网并通过蜂窝等独立链路接受远程控制。这会导致单一观察面只看到局部正常或弱异常信号，需要跨视角关联；与此同时，与该行为变量一致的跨层残余信号仍是可恢复的残余痕迹，更细粒度遥测、较长保留期或额外观察视角能够限制效果。
    en: Out-of-Band-Backhauled Internal Hardware Bridge deliberately changes which entry traces are exposed by having the adversary act to connect planted hardware to the internal network
      and control it through an independent cellular or out-of-band link. As a result, one vantage sees only locally normal or weak anomalous signals and requires cross-vantage correlation;
      at the same time, cross-layer residual signals consistent with this behavior variable remain recoverable residual traces, and finer telemetry, longer retention, or another vantage
      can constrain the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入攻击者有意本地硬件接入内网并通过蜂窝等独立链路接受远程控制以改变首个入口痕迹的行为。它排除仅按媒介、产品或工具名称进行的分类，也排除立足点建立后的行为；与NJS-0056-001 环境伪装式驻留硬件的边界在于，本项控制上述变量，而每个兄弟项控制父级分类中另一项独立痕迹变量。只有攻击者有意控制该变量并产生对应观察差异时才纳入，合法运维、个人化服务、兼容性行为或普通用户活动造成的相似现象不能单独证明分类。
    en: This child includes adversary-controlled action to connect planted hardware to the internal network and control it through an independent cellular or out-of-band link in order
      to change traces of the first entry. It excludes classifications based only on medium, product, or tool name and excludes all behavior after foothold establishment. It differs
      from NJS-0056-001 Environment-Camouflaged Resident Hardware because this child controls the stated variable while each sibling controls another independent trace variable in the
      parent taxonomy. Inclusion requires deliberate adversary control and the corresponding observation difference; similar effects from legitimate administration, personalized service,
      compatibility behavior, or ordinary user activity do not establish the classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在目标入口相关环境中利用首个入口条件，并采用上述受控变量降低入口事件可区分性的场景。具体入口行为表现为攻击者有意本地硬件接入内网并通过蜂窝等独立链路接受远程控制；与该行为变量一致的跨层残余信号可在入口前后或与后续结果关联后出现，但立足点建立后的执行、持久化、横向移动与通信不属于本子技术。
      en: This child applies when an adversary uses a first-entry condition in the relevant victim-entry environment and applies the stated controlled variable to reduce entry-event
        distinguishability. The concrete entry behavior has the adversary act to connect planted hardware to the internal network and control it through an independent cellular or out-of-band
        link; cross-layer residual signals consistent with this behavior variable may appear around entry or after correlation with later outcomes, but execution, persistence, lateral
        movement, and communication after foothold establishment are outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：对应入口条件可用。实施者还需持续控制用于本地硬件接入内网并通过蜂窝等独立链路接受远程控制的身份、会话、内容、路径、设备、时点或供应关系，并承担资源失效、目标不匹配、物理接近、延迟或第三方处置的约束；缺少这种控制时只能形成正常相似行为。
        en: 'The adversary must satisfy these prerequisites: the relevant entry condition is available. The operator also needs sustained control of the identity, session, content, path,
          device, timing, or supply relationship used to connect planted hardware to the internal network and control it through an independent cellular or out-of-band link and must
          tolerate resource loss, target mismatch, proximity, delay, or third-party enforcement; without that control, only a legitimate lookalike remains.'
    defender_model:
      paragraphs:
      - zh: 防守模型包括直接受害方、入口服务或身份提供方、端点与能够保存跨视角谱系的分析者。直接受害方可能只看到局部正常结果，其他观察者可能看到与该行为变量一致的跨层残余信号；可靠识别需要在授权与保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the entry-service or identity provider, the endpoint, and analysts able to retain cross-vantage lineage. The victim may see
          only a locally normal result while other observers may see cross-layer residual signals consistent with this behavior variable; reliable identification requires authorized
          correlation across those vantages and retention periods with legitimate lookalikes represented in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 借助该受控变量把入口链痕迹分散到多个观察单元
    en: Use the controlled variable to distribute entry-chain traces across observation units
  analysis:
    paragraphs:
    - zh: 攻击者有意实施该子技术的操作原则，即本地硬件接入内网并通过蜂窝等独立链路接受远程控制。这一行为产生所述痕迹变化，并导致单一观察面只看到局部正常或弱异常信号，需要跨视角关联。同一入口链的痕迹被分散到时间、路径、视点、主体或供应层，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
      en: The adversary deliberately applies this child's operating principle by acting to connect planted hardware to the internal network and control it through an independent cellular
        or out-of-band link. This produces the stated trace change and means that one vantage sees only locally normal or weak anomalous signals and requires cross-vantage correlation.
        Traces of one entry chain are distributed across time, paths, vantages, subjects, or supply layers so short windows and point indicators see only fragments; defenders must rebuild
        shared lineage across units, producing a Spatiotemporal Trace Dilution effect.
  evidence_refs:
  - REF-000104
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 借助该受控变量使关键入口动作在单一视角中保持低信号
    en: Use the controlled variable to keep the critical entry action low-signal from one vantage
  analysis:
    paragraphs:
    - zh: 攻击者有意实施该子技术的操作原则，即本地硬件接入内网并通过蜂窝等独立链路接受远程控制。这一行为产生所述痕迹变化，并导致单一观察面只看到局部正常或弱异常信号，需要跨视角关联。关键入口动作在单一观察模型中表现为空白、低信号或正常结果，使原有分析逻辑不触发；扩大观察面或关联前后结果仍可恢复差异，因而形成行为透明效果。
      en: The adversary deliberately applies this child's operating principle by acting to connect planted hardware to the internal network and control it through an independent cellular
        or out-of-band link. This produces the stated trace change and means that one vantage sees only locally normal or weak anomalous signals and requires cross-vantage correlation.
        The critical entry action appears blank, low-signal, or normal under one observation model, preventing existing analytics from firing; broader vantage and correlation with preceding
        and subsequent outcomes can recover the difference, producing a Behavioral Transparency effect.
  evidence_refs:
  - REF-000104
  confidence: high
