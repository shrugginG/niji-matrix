schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0058-001
parent_ref: NJT-0058
name:
  zh: 伪装式介质触发
  en: Masqueraded Media Trigger
summary:
  zh: 将介质上的执行入口伪装成用户预期会打开的目录、文件或正常浏览命令，使目标主机上的恶意触发与普通介质操作相似。
  en: Dress a media execution entry as a directory, file, or normal browsing command that users expect to open, making the
    target-host trigger resemble routine drive use.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 本子技术以目标主机对介质内容的选择动作作为直接对象。攻击者改写快捷方式名称或图标、藏起实际载荷，或让介质菜单的浏览动作指向安装程序，目的是让另一主机在使用介质时执行攻击内容。变量是被选择的入口是否伪装成预期对象，不是 LNK、AUTORUN
      或图标格式本身；这些实现须有真实触发条件。
    en: This child concerns the target host's selection of content on a removable drive. The adversary changes a shortcut
      name or icon, hides the payload, or redirects a drive-browsing menu action to installation so another host executes
      attack content during drive use. The variable is whether the selected entry masquerades as the expected object, not
      the LNK, AUTORUN, or icon format itself; each implementation requires a working trigger condition.
stealth_characteristics:
  paragraphs:
  - zh: 伪装式介质触发把用户可见的文件夹、品牌名或浏览动作与实际执行目标分离。Raspberry Robin 的品牌或目录式 LNK 和 USBStealer 的伪装菜单说明普通浏览可能成为执行入口，仅依赖文件名与用户动作类别的分流会漏看载荷。但
      LNK 目标命令、AUTORUN 内容、隐藏文件、UserAssist 与 cmd/msiexec 进程谱系仍能暴露差异；用户是否被特定命名说服不可从一次点击推定。
    en: Masqueraded Media Trigger separates a visible folder, brand name, or browsing action from the actual execution target.
      Raspberry Robin's brand or folder-like LNK and USBStealer's altered menu show how ordinary browsing may become the execution
      entry, defeating triage based only on file name and action category. The LNK target, AUTORUN content, hidden files,
      UserAssist, and cmd/msiexec process lineage still expose the difference; a click alone cannot prove that a particular
      name persuaded the user.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入能证明同一介质上外观与执行目标不一致、且接收主机实际选择并触发的实例。只有诱饵存在而无接收侧动作，只能证明准备。合法快捷方式、企业安装介质和 USB 安全工具也可能使用品牌名或隐藏文件，须核对签发来源、预期脚本与后继行为。本项改变接收侧识别特征，自动播种方式由兄弟项界定。
    en: Include cases where appearance and execution target on the same medium demonstrably diverge and the receiving host
      actually selects and triggers the entry. A lure merely present proves preparation. Legitimate shortcuts, installation
      media, and USB security tools may carry brand names or hidden files; provenance, expected scripts, and subsequent behavior
      distinguish them. This child changes recipient-side recognition, while its sibling owns automatic seeding.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在维护盘从已受控工作站转运到隔离机的流程中，攻击者把载荷入口包装成文件夹或普通浏览动作，等待操作员接入并打开。用户可能先看到预期目录，而解释器或安装器已从介质启动；调查须连接该点击、真实快捷方式目标与目标端进程。
      en: When a maintenance drive moves from a controlled workstation to an isolated machine, an adversary can package the
        payload entry as a folder or ordinary browsing action and wait for an operator to open it. The user may see the expected
        directory while an interpreter or installer starts from the medium; investigation must join the click, actual shortcut
        target, and destination process.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须能编辑介质目录或入口目标，并估计 B 的用户习惯或自动运行配置。品牌名增加点击可能性只是 Microsoft 的谨慎评估；旧版自动运行或 Shell 菜单技巧依赖具体设置。载荷还须与 B 兼容，介质也须实际转运。
        en: The adversary needs edit control over the drive directory or entry target and an expectation about B's workflow
          or autorun configuration. Microsoft cautiously assesses that a brand name may encourage clicking; legacy autorun
          and Shell menu tricks depend on specific settings. The payload must work on B and the drive must actually be transferred.
    defender_model:
      paragraphs:
      - zh: 只记录 USB 接入与文件名的防守者会看到貌似正常的使用；若解析 LNK/AUTORUN 目标、保留 UserAssist 与进程命令行，并关联介质快照，就能识别显示为目录却启动脚本或安装器的差异。没有介质内容或 B 端进程遥测时，只能形成风险假设，不能给出已执行结论。
        en: A defender recording only USB attachment and file names sees apparently ordinary use. Parsing LNK or AUTORUN targets,
          retaining UserAssist and process command lines, and correlating a drive snapshot can reveal a displayed folder launching
          a script or installer. Without media content or B-side process telemetry, the result is a risk hypothesis rather
          than confirmed execution.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 伪装目录或浏览入口使可见名与执行目标分离
    en: A disguised folder or browsing entry separates visible name from execution target
  analysis:
    paragraphs:
    - zh: 伪装目录或浏览入口使可见名与执行目标分离，粗粒度介质浏览检测误分流，解析链接目标和后继进程可恢复。目标端仍有介质接入、真实链接目标和后继进程可恢复该因果链。
      en: A disguised folder or browsing entry separates visible name from execution target, causing coarse media-browsing
        triage to misclassify; target parsing and successor processes recover the action. Media insertion, actual link target,
        and successor processes remain available to reconstruct the chain.
