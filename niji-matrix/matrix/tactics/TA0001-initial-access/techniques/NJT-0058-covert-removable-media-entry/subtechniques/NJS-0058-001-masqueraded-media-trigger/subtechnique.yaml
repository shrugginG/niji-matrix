research:
  limitations:
    paragraphs:
    - zh: Microsoft 的 Raspberry Robin 案例只直接证明接收侧品牌化 LNK 与用户触发，不能单独证明同一介质曾由该组织内 A 播种。ESET USBStealer 支持 A/B 样本传播模型，不能填补一宗现场的每次介质交接；“可能鼓励点击”也不是实测的用户心理因果。
      en: Microsoft's Raspberry Robin account directly proves branded LNKs and recipient-side user triggering, not that the
        same medium was seeded by host A within that organization. ESET USBStealer supports an A/B sample propagation model
        but cannot fill every media handoff in one field incident. Possible encouragement to click is not a measured psychological
        causal effect.
    - zh: 合法 USB 快捷方式、离线安装器与自动运行配置可能同形。没有原介质内容、LNK 实际目标和 B 的进程谱系时只能记录可疑入口；管理员身份或系统二进制签名都不证明此次触发得到授权。
      en: Legitimate USB shortcuts, offline installers, and autorun settings may look similar. Without original media content,
        actual LNK target, and B process lineage, retain a suspicious-entry conclusion only. Administrator identity or a signed
        system binary does not authorize this trigger.
