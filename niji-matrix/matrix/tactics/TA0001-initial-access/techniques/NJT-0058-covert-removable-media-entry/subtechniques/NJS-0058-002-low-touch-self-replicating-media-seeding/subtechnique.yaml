research:
  limitations:
    paragraphs:
    - zh: Check Point 直接分析 LitterDrifter 的卷枚举、隐藏组件与 LNK 写入，但跨国样本提交不证明同一企业的 A/B 链。Microsoft 对 Raspberry Robin 播种模块与其他主机感染的结论为中等置信。自动播种与跨机时间分离的匿迹效果是条件性观察模型推断，不是所有样本均有的低慢行动者意图。
      en: Check Point directly analyzed LitterDrifter's drive enumeration, hidden component, and LNK writes, but cross-country
        sample submissions do not prove an A/B chain inside one enterprise. Microsoft assigned medium confidence to Raspberry
        Robin seeding and infection of other hosts. The stealth effect of automatic seeding and host-time separation is a
        conditional observation-model inference, not a low-and-slow actor intent shown for every sample.
    - zh: 批量复制和隐藏文件修改也可能在 A 上形成显著峰值；合法离线补丁、盘初始化和备份恢复会产生相似写入。若 B 为完全隔离主机或介质 ID 不稳定，需要实物清单与检查站补证，不能凭 B 上已有文件追溯 A 的具体进程。
      en: Bulk copying and hidden-file changes may create a conspicuous spike on A. Legitimate offline patching, media initialization,
        and backup restore produce similar writes. If B is fully isolated or media IDs are unstable, use physical ledgers
        and inspection checkpoints rather than tracing a process on A merely from a file already present on B.
