type: evasion-subtechnique
id: NJS-0058-002
parent_ref: NJT-0058
name:
  zh: 低触达自复制播种
  en: Low-Touch Self-Replicating Media Seeding
summary:
  zh: 源主机在介质接入时自动枚举并写入攻击内容，使后续转运承载复制而无需操作者逐盘手工投递。
  en: A source host automatically enumerates and writes attack content on attachment, allowing later transport to carry replication
    without manual per-drive placement.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 本子技术把播种动作从操作者逐盘复制改为已受控源主机对新接入介质的自动反应。LitterDrifter 通过 WMI 枚举卷并在子目录生成隐藏组件和诱饵，USBStealer 监听介质接入后写入载荷与自动运行文件；两者都说明接入时自动播种这一独立变量。低触达仅指操作者与每次播种的交互较少，不断言文件系统痕迹更少。
    en: This child replaces manual per-drive placement with an automatic response by a controlled source host to newly attached
      media. LitterDrifter enumerates volumes through WMI and creates hidden components and lures in subdirectories; USBStealer
      watches drive attachment and writes a payload and autorun file. Both support attachment-triggered seeding as a separate
      variable. Low-touch means fewer operator interactions per drive, not fewer filesystem traces.
stealth_characteristics:
  paragraphs:
  - zh: 低触达自复制播种使攻击内容在 A 上先于 B 的使用被写入介质，人工转运把两个端点事件隔开；B 若没有 A 的日志，常只能看到已存在的文件。自动化也利用正常接入机会，而无需攻击者再远程登陆每台目标。但 WMI 枚举、多个子目录的新
      LNK、隐藏脚本及相同散列在多盘出现会留下强烈残余信号，不能把蠕虫广泛传播误称为天然低噪声。
    en: Low-Touch Self-Replicating Media Seeding writes content on A before B's later use, with human transfer separating
      the endpoint events. Without A's logs, B may see only pre-existing files. Automation exploits ordinary attachment opportunities
      without fresh remote login to each target. Yet WMI enumeration, new LNK files across folders, hidden scripts, and repeated
      hashes across drives leave strong signals; broad worm spread is not inherently low noise.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入有接入触发、自动枚举或自动写入证据的介质播种；仅凭介质上发现恶意文件不能证明自动播种，也不能证明后来主机执行。合法批量备份、加密盘初始化、端点代理和离线补丁制作都可自动写入，需以内容、进程来源及批准任务区分。与兄弟项的边界是源侧写入触发和操作者触达程度，而非接收侧诱饵外观。
    en: Include media seeding supported by attachment-triggered enumeration or write evidence. A malicious file on a drive
      alone proves neither automatic seeding nor later execution. Legitimate bulk backup, encrypted-drive initialization,
      endpoint agents, and offline patch preparation may write automatically; content, originating process, and approved jobs
      distinguish them. The sibling boundary is source-side write triggering and operator interaction, not lure appearance
      at the recipient.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制经常接收维护盘的内部工作站，部署播种组件后等待正常轮换盘接入；组件在盘上放置载荷，运维人员再将盘接到隔离 B。该场景适合无法经网络直接到达 B 的环境，但完成横向移动仍以 B 的有效触发为准。
      en: After controlling an internal workstation that receives maintenance drives, the adversary plants a seeder and waits
        for a normal rotating drive. The component places content, and staff later attach the drive to isolated B. This works
        when B is unreachable over the network, but lateral movement is complete only after an effective trigger on B.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要 A 上的代码执行或等效写盘能力、可写介质、对轮转路径的合理判断，以及目标平台可用的触发方式。自动播种减少人工挑盘，却增加误感染、写入量和端点审计机会；若 B 只接受只读签名介质，或 AutoRun 被禁且无人打开诱饵，传播停在准备阶段。
        en: The adversary needs code execution or equivalent drive-write ability on A, writable media, a reasonable expectation
          of the rotation path, and a working trigger on B. Automation reduces manual drive selection but increases accidental
          spread, write volume, and endpoint audit opportunities. If B accepts only signed read-only media, or autorun is
          disabled and no lure is opened, propagation remains preparation.
    defender_model:
      paragraphs:
      - zh: A 端传感器可见介质插入后异常进程枚举卷与连续写入，B 端可见相同介质接入、内容启动和后继动作；转运台账桥接两端。若隔离区不能共享遥测，至少在检查站采集介质目录与散列快照。序列号可被复用或伪造，须结合资产封签、文件集与时间顺序，不能靠单一
          ID 定罪。
        en: A-side sensors can see abnormal drive enumeration and writes after attachment; B-side sensors can see the same
          drive attach, content launch, and successor action; a transfer ledger bridges them. If an isolated zone cannot share
          telemetry, collect drive directory and hash snapshots at a checkpoint. Serials can be reused or spoofed, so combine
          asset seals, file sets, and temporal order rather than relying on one ID.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 接入自动播种使 A 的写入与 B 的执行分处不同时空
    en: Attachment-triggered seeding separates A's write from B's execution across host and time
  analysis:
    paragraphs:
    - zh: 接入自动播种使 A 的写入与 B 的执行分处不同时空，单端短窗失去来源链，介质标识与内容快照可重建。目标端仍有介质接入、真实链接目标和后继进程可恢复该因果链。
      en: Attachment-triggered seeding separates A's write from B's execution across host and time, defeating short single-host
        origin lineage; media identity and content snapshots can reconstruct it. Media insertion, actual link target, and
        successor processes remain available to reconstruct the chain.
  evidence_refs:
