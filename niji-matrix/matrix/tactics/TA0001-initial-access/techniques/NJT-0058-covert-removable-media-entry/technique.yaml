research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定基线支持双战术父映射，ESET 逆向给出具体 A→B 链和 B 上安装，Microsoft 给出其他主机感染的中置信播种判断，Check Point 直接证明自动卷枚举与诱饵写入；这些材料证明行为能力及部分观察差异，但没有共同提供一个受害组织中同一序列号介质的端到端时间线。因此正式
        TA0008 声明必须把跨主机结果门写为分类条件，不把所有 USB 蠕虫感染都当作已证内部横向事件。
      en: The fixed ATT&CK baseline supports the dual-tactic parent mapping. ESET reverse engineering supplies a concrete
        A-to-B chain and B installation, Microsoft a medium-confidence seeder assessment involving other hosts, and Check
        Point direct automatic-drive enumeration and lure writes. They establish capability and some observation effects,
        but do not together provide an end-to-end timeline for one serialized drive inside one victim organization. The formal
        TA0008 claim must state the cross-host outcome as a classification condition rather than count every USB worm infection
        as a proven internal lateral incident.
    - zh: 不同 Windows 版本、AutoRun 策略、用户操作和隔离区遥测会改变触发与可见性；介质身份也可能被复用或伪造。自动播种减少逐盘人工操作，却可能产生成批目录改写，故其低触达效果不能被写成低端点信号。只有在 A/B 两端的介质、内容和进程证据能够重构时，才应提高具体事件置信度。
      en: Windows versions, autorun policy, user action, and isolated-zone telemetry change triggering and visibility; media
        identities can also be reused or spoofed. Automatic seeding reduces manual per-drive action but may create bulk directory
        changes, so low touch must not be written as low endpoint signal. Confidence in a specific incident should rise only
        when media, content, and process evidence from A and B reconstructs the chain.
