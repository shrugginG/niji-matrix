research:
  limitations:
    paragraphs:
    - zh: 公开证据支持本子技术的稳定变量和所列痕迹变化，但不能保证每个目标入口相关环境实例都有相同匿迹意图或效果。按媒介、产品或工具形成的相似外观以及立足点建立后的行为可能产生局部相似信号，且提供方内部数据通常不公开；置信度应随直接入口证据、跨视角复现和正常基线的可得性调整。
      en: Public evidence supports this child's stable variable and stated trace change but does not establish identical stealth intent or effect in every instance of the relevant victim-entry
        environment. Similar appearance caused by medium, product, or tool choice and behavior after foothold establishment can produce locally similar signals, while provider-internal
        data is often unavailable; confidence should vary with direct entry evidence, cross-vantage reproduction, and availability of a legitimate baseline.
