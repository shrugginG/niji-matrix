schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0060-001
parent_ref: NJT-0060
name:
  zh: 受信连接来源借用
  en: Trusted Connection Provenance Borrowing
summary:
  zh: 经伙伴既有 VPN、专线或 provider-customer 连接进入目标。
  en: Enter through a partner existing VPN, private link, or provider-customer connection.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 经伙伴既有 VPN、专线或 provider-customer 连接进入目标。该行为的直接目标是降低首次入口的识别、关联或归因能力；攻击者控制的是促成该入口结果的时点、情境、路径、身份、设备、内容或供应关系。该边界描述可重复的匿迹变量，而不是特定工具、产品、介质或偶然环境。
    en: Enter through a partner existing VPN, private link, or provider-customer connection. Its direct objective is to reduce detection, correlation, or attribution of the first entry;
      the adversary controls the timing, context, path, identity, device, content, or supply relationship that produces this entry result. This boundary describes a repeatable stealth
      variable rather than a particular tool, product, medium, or accidental environment.
stealth_characteristics:
  paragraphs:
  - zh: 受信连接来源借用由攻击者有意改变可见入口痕迹，具体做法是经伙伴既有 VPN、专线或 provider-customer 连接进入目标。这会导致单一观察面只看到局部正常或弱异常信号，需要跨视角关联；与此同时，与该行为变量一致的跨层残余信号仍是可恢复的残余痕迹，更细粒度遥测、较长保留期或额外观察视角能够限制效果。
    en: Trusted Connection Provenance Borrowing deliberately changes which entry traces are exposed by having the adversary act to enter through a partner existing VPN, private link,
      or provider-customer connection. As a result, one vantage sees only locally normal or weak anomalous signals and requires cross-vantage correlation; at the same time, cross-layer
      residual signals consistent with this behavior variable remain recoverable residual traces, and finer telemetry, longer retention, or another vantage can constrain the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入攻击者有意经伙伴既有 VPN、专线或 provider-customer 连接进入目标以改变首个入口痕迹的行为。它排除仅按媒介、产品或工具名称进行的分类，也排除立足点建立后的行为；与NJS-0060-002 跨租户委托管理寄生的边界在于，本项控制上述变量，而每个兄弟项控制父级分类中另一项独立痕迹变量。只有攻击者有意控制该变量并产生对应观察差异时才纳入，合法运维、个人化服务、兼容性行为或普通用户活动造成的相似现象不能单独证明分类。
    en: This child includes adversary-controlled action to enter through a partner existing VPN, private link, or provider-customer connection in order to change traces of the first
      entry. It excludes classifications based only on medium, product, or tool name and excludes all behavior after foothold establishment. It differs from NJS-0060-002 Cross-Tenant
      Delegated Administration Parasitism because this child controls the stated variable while each sibling controls another independent trace variable in the parent taxonomy. Inclusion
      requires deliberate adversary control and the corresponding observation difference; similar effects from legitimate administration, personalized service, compatibility behavior,
      or ordinary user activity do not establish the classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在目标入口相关环境中利用首个入口条件，并采用上述受控变量降低入口事件可区分性的场景。具体入口行为表现为攻击者有意经伙伴既有 VPN、专线或 provider-customer 连接进入目标；与该行为变量一致的跨层残余信号可在入口前后或与后续结果关联后出现，但立足点建立后的执行、持久化、横向移动与通信不属于本子技术。
      en: This child applies when an adversary uses a first-entry condition in the relevant victim-entry environment and applies the stated controlled variable to reduce entry-event
        distinguishability. The concrete entry behavior has the adversary act to enter through a partner existing VPN, private link, or provider-customer connection; cross-layer residual
        signals consistent with this behavior variable may appear around entry or after correlation with later outcomes, but execution, persistence, lateral movement, and communication
        after foothold establishment are outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：对应入口条件可用。实施者还需持续控制用于经伙伴既有 VPN、专线或 provider-customer 连接进入目标的身份、会话、内容、路径、设备、时点或供应关系，并承担资源失效、目标不匹配、物理接近、延迟或第三方处置的约束；缺少这种控制时只能形成正常相似行为。
        en: 'The adversary must satisfy these prerequisites: the relevant entry condition is available. The operator also needs sustained control of the identity, session, content, path,
          device, timing, or supply relationship used to enter through a partner existing VPN, private link, or provider-customer connection and must tolerate resource loss, target mismatch,
          proximity, delay, or third-party enforcement; without that control, only a legitimate lookalike remains.'
    defender_model:
      paragraphs:
      - zh: 防守模型包括直接受害方、入口服务或身份提供方、端点与能够保存跨视角谱系的分析者。直接受害方可能只看到局部正常结果，其他观察者可能看到与该行为变量一致的跨层残余信号；可靠识别需要在授权与保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the entry-service or identity provider, the endpoint, and analysts able to retain cross-vantage lineage. The victim may see
          only a locally normal result while other observers may see cross-layer residual signals consistent with this behavior variable; reliable identification requires authorized
          correlation across those vantages and retention periods with legitimate lookalikes represented in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借助该受控变量使入口外观贴近合法或可信活动
    en: Use the controlled variable to make entry resemble legitimate or trusted activity
  analysis:
    paragraphs:
    - zh: 攻击者有意实施该子技术的操作原则，即经伙伴既有 VPN、专线或 provider-customer 连接进入目标。这一行为产生所述痕迹变化，并导致单一观察面只看到局部正常或弱异常信号，需要跨视角关联。攻击者以合法、可信或常见入口特征替代显著恶意特征，使粗粒度规则难以区分；防守方必须恢复行为、身份与来源谱系，因而形成特征伪装效果。
      en: The adversary deliberately applies this child's operating principle by acting to enter through a partner existing VPN, private link, or provider-customer connection. This produces
        the stated trace change and means that one vantage sees only locally normal or weak anomalous signals and requires cross-vantage correlation. The adversary substitutes legitimate,
        trusted, or common entry features for conspicuous malicious features, weakening coarse rules; defenders must recover behavioral, identity, and provenance lineage, producing a
        Feature Disguise effect.
  evidence_refs:
  - REF-000093
  - REF-000110
  confidence: high
