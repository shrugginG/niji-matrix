research:
  limitations:
    paragraphs:
    - zh: 公开报告直接支持住宅或移动代理会削弱地理和网络来源信号，但不能自动证明设备、客户端和时间也被贴合，或每次使用都出于匿迹目的。正式映射必须限制在实际观察到且由攻击者可控的情境维度。
      en: Public reporting directly supports residential or mobile proxies weakening geographic and network-origin signals,
        but it does not automatically establish alignment of device, client, and timing or an evasion purpose in every use.
        Formal mapping is limited to context dimensions actually observed and controlled by the adversary.
    - zh: 不同身份平台的来源、设备和会话字段以及保留期并不相同，网络地址转换、虚拟桌面、分流隧道和隐私限制也会降低精度。缺少资源侧结果时，情境贴合只能说明登录外观变化，不能单独证明后续权限或影响。
      en: Identity platforms differ in origin, device, and session fields and retention, while network address translation,
        virtual desktops, split tunneling, and privacy constraints also reduce precision. Without resource-side outcomes,
        context alignment establishes a change in sign-in appearance but cannot by itself prove downstream authority or impact.
