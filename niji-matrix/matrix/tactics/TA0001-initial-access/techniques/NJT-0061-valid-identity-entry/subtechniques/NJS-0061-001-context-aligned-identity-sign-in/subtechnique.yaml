schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0061-001
parent_ref: NJT-0061
name:
  zh: 情境贴合的身份登录
  en: Context-Aligned Identity Sign-In
summary:
  zh: 以受害身份历史相符的来源网络、地理、客户端、设备或时间发起新的有效身份认证，降低登录风险特征的可区分性。
  en: Start fresh valid-identity authentication from source network geography client device or time aligned with victim history
    to reduce distinguishability of sign-in risk features.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 情境贴合的身份登录是攻击者持有目标仍会接受的有效凭据，并有意选择或塑造认证请求的来源网络、地理位置、客户端、设备状态和时间，使新的登录链接近该身份的历史情境。稳定变量是新认证事件与身份历史之间的情境相似度，而不是某种代理、产品或单个字段。
    en: Context-Aligned Identity Sign-In occurs when an adversary holds a credential still accepted by the target and deliberately
      selects or shapes the origin network, geography, client, device state, and timing of an authentication request so the
      fresh sign-in chain resembles the identity's history. The stable variable is contextual similarity between the new authentication
      event and identity history, not a particular proxy, product, or field.
  - zh: 本项要求新的主认证、多因素认证、联合身份认证或等价登录链实际发生。直接沿用已经认证的浏览器、Cookie 或令牌而没有新的登录链属于会话续用；凭据如何取得以及身份是否被修改也由相邻技术处理。
    en: This child requires a fresh primary-authentication, multifactor, federation, or equivalent sign-in chain. Direct continuation
      of an already authenticated browser, cookie, or token without a fresh sign-in belongs to session reuse; how the credential
      was obtained and whether the identity was modified belong to adjacent techniques.
stealth_characteristics:
  paragraphs:
  - zh: 情境贴合的身份登录使用与受害者相近的网络、地理位置、设备、客户端或活动时段发起认证，使来源信誉、地理距离、设备新颖度和时间偏差同时降低。完整登录仍然存在，但基于单一异常特征的规则更难把它与旅行、远程办公或设备更换区分开。
    en: Context-Aligned Identity Sign-In authenticates through a network, location, device, client, or activity period similar
      to the victim's, reducing differences in source reputation, geographic distance, device novelty, and timing. The complete
      sign-in still exists, but rules based on a single anomalous feature have more difficulty separating it from travel,
      remote work, or device replacement.
  - zh: 情境通常不是完整复制品。出口轮换、网络与设备证明不一致、身份方和资源方看到的来源差异、非常见认证方法以及后继资源行为仍可能暴露控制者；长期身份基线和跨视角关联会限制匿迹效果。
    en: The context is rarely a perfect replica. Egress rotation, inconsistency between network and device attestation, different
      origins observed by identity and resource providers, uncommon authentication methods, and downstream resource behavior
      can still expose the controller. Long-term identity baselines and cross-vantage correlation constrain the stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要有效凭据、一次被接受的新认证、至少一个被攻击者有意贴合的历史情境维度，以及由此降低的观察差异。住宅地址、正常时段或熟悉设备单独出现都不充分；合法旅行、企业 VPN、虚拟桌面、移动网络和设备迁移是正常反例。
    en: Inclusion requires a valid credential, an accepted fresh authentication, at least one historical context dimension
      deliberately aligned by the adversary, and a resulting reduction in observational difference. A residential address,
      ordinary work time, or familiar device alone is insufficient; legitimate travel, enterprise VPN, virtual desktops, mobile
      networks, and device migration are normal counterexamples.
  - zh: 会话续用和低反馈身份选择分别由两个兄弟子技术处理。代理或远程服务只是传输路径，凭据窃取和认证绕过也属于相邻对象；本项只拥有新登录风险情境的相似度变化。
    en: Session reuse and low-feedback identity selection belong to the two sibling children. Proxies and remote services
      are transport paths, while credential theft and authentication bypass belong to adjacent objects. This child owns only
      the change in risk-context similarity around a fresh sign-in.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可能通过接近受害者所在地的住宅或移动网络登录 SaaS、VPN 或身份平台，复用受控设备的网络与客户端环境，或等待用户常见活动时间再认证。这样可以降低基于托管网络、异常国家、全新设备或非常用时段的局部差异。
      en: An adversary may sign in to SaaS, VPN, or an identity platform through residential or mobile networks near the victim,
        reuse the network and client environment of a controlled device, or wait for the user's usual activity period. This
        reduces local differences based on hosting networks, unusual countries, novel devices, or uncommon times.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要目标仍接受的凭据，并了解或推断该身份常见的地理、网络、设备、客户端和活动时间。住宅代理与真实设备提高贴合度，却带来出口稳定性、设备绑定、证书、端点监控和本地取证风险；多个身份共用同一出口也可能形成新的聚合异常。
        en: The adversary needs a credential still accepted by the target and knowledge or inference of the identity's usual
          geography, network, device, client, and activity time. Residential proxies and real devices improve alignment but
          introduce egress stability, device-binding, certificate, endpoint-monitoring, and local-forensics risks. Reusing
          one egress across identities can also create a new aggregate anomaly.
    defender_model:
      paragraphs:
      - zh: 防守方可能从身份提供方看到主体、认证方法、来源、设备和风险结果，并从资源提供方看到会话、资源、操作和实际来源。长期基线应按身份、角色、设备组、业务时段和已知出口建立；共享终端、远程办公、旅行和应急登录会扩大正常分布。
        en: Defenders may see principal, authentication method, origin, device, and risk outcome at the identity provider
          and session, resource, action, and actual origin at the resource provider. Long-term baselines should be organized
          by identity, role, device group, business schedule, and known egress; shared terminals, remote work, travel, and
          break-glass access widen the legitimate distribution.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 把新登录的风险情境塑造成受害身份的正常历史特征
    en: Shape risk context of a fresh sign-in into normal historical features of the victim identity
  analysis:
    paragraphs:
    - zh: 攻击者选择目标身份常见的网络、位置、设备、客户端和活动时段，再从相似环境发起新的有效认证。痕迹仍显示真实身份和成功登录，但显著的托管网络、远距离、新设备或异常时段特征被削弱；依赖这些粗粒度特征的防守观察因而更难区分恶意操作者，形成特征伪装。
      en: The adversary selects the target identity's familiar network, location, device, client, and activity period and
        then authenticates from a similar environment. Traces still show the real identity and a successful sign-in, but conspicuous
        hosting-network, distance, novel-device, or unusual-time features are weakened. Defender observation that depends
        on those coarse features has greater difficulty distinguishing the malicious operator, producing Feature Disguise.
