research:
  limitations:
    paragraphs:
    - zh: 公开报告直接证明 Cookie 或令牌重放可以继承已经完成的认证状态并支持后继资源访问，但证据主要集中在云身份和邮件入侵场景。不能由此推断所有协议、应用或本地会话都具有相同的导出、绑定和撤销语义。
      en: Public reporting directly shows cookie or token replay inheriting completed authentication state and enabling downstream
        resource access, but the evidence is concentrated in cloud-identity and mail-compromise scenarios. It does not establish
        identical export, binding, and revocation semantics for every protocol, application, or on-premises session.
    - zh: 会话续用说明认证状态被接受，不自动证明会话材料如何取得，也不自动证明权限提升。缺少操作者连续性、实际身份权限或资源结果时，结论应限制在被观察到的会话使用和认证痕迹变化。
      en: Session reuse establishes acceptance of authentication state; it does not automatically establish how the session
        material was obtained or prove privilege escalation. Without controller continuity, actual identity authority, or
        a resource outcome, conclusions remain limited to observed session use and authentication-trace change.
