schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0061-002
parent_ref: NJT-0061
name:
  zh: 既有认证会话续用
  en: Reuse of Established Authenticated Sessions
summary:
  zh: 续用或重放目标仍接受的 Cookie、access/refresh token 或浏览器会话状态，使资源访问继承既有认证而减少新的登录和 MFA 痕迹。
  en: Reuse or replay cookie access or refresh token or browser-session state still accepted by the target so resource access
    inherits prior authentication and reduces fresh sign-in and MFA traces.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有认证会话续用是攻击者控制一个此前已经通过认证、且 relying party 仍接受的 Cookie、access token、refresh token、浏览器 profile 或等价 session state，并用它访问身份对应资源，而不重新提交完整主凭据和
      MFA。稳定变量是“被接受资源请求与新认证链之间的连续性/缺失关系”，不是 token 产品名称、OAuth/SAML 协议或浏览器类型。
    en: Reuse of Established Authenticated Sessions occurs when an adversary controls a cookie access token refresh token
      browser profile or equivalent session state that previously authenticated and remains accepted by the relying party
      and uses it to access identity-bound resources without resubmitting the complete primary credential and MFA. The stable
      variable is continuity or absence between accepted resource requests and a fresh authentication chain rather than token
      product name OAuth or SAML protocol or browser type.
  - zh: 本项包括同一设备继续使用已控会话、把 token/cookie 导出到另一环境后重放，以及 refresh 流程在无交互时续期；必须证明目标实际接受了该状态。窃取或导出会话材料的过程由 Credential Access、web
      session cookie 或端点对象拥有；伪造/修改 token 或进程线程安全上下文归相邻对象。本项只拥有未修改认证状态的接受和使用。
    en: The child includes continuing a controlled session on the same device replaying an exported token or cookie in another
      environment and silent renewal through a refresh flow but requires proof that the target actually accepted the state.
      Theft or export of session material belongs to Credential Access web-session-cookie or endpoint objects while forged
      or modified tokens and process or thread security contexts retain adjacent owners. This child owns only acceptance and
      use of unchanged authenticated state.
stealth_characteristics:
  paragraphs:
  - zh: 既有认证会话续用把新登录通常产生的 credential validation、MFA challenge、risk evaluation、new-session 和通知链压缩为已有 session/token 对资源发出请求。认证层可能没有新的主认证事件，或只看到
      refresh；资源层则沿用合法 user/service principal 和已完成 MFA 的 claim。只在“登录时”检测的控制因此失去关键触发点，攻击访问看起来像同一会话继续工作。
    en: Reuse of Established Authenticated Sessions compresses the credential validation MFA challenge risk evaluation new-session
      state and notifications normally produced by a fresh sign-in into an existing session or token requesting a resource.
      The authentication layer may have no fresh primary-authentication event or only a refresh while the resource layer retains
      a legitimate user or service principal and an MFA-completed claim. Controls that detect only at sign-in lose the critical
      trigger and adversary access resembles continuing work in the same session.
  - zh: 会话状态仍会留下可恢复差异：token/session ID、issued-at/expiry、device binding、client、资源、IP 跳变、refresh 轨迹、claim challenge、撤销与后继 API。Microsoft
      记录 token/cookie 可在另一浏览器重放并继承 MFA 状态，同时 CAE 说明资源方可因关键事件或位置变化拒绝未过期 token，但并非所有客户端和资源都支持且存在传播/网络限制。匿迹效果取决于实际 relying party，而不是抽象地认为“改密码即可结束会话”。
    en: Session state leaves recoverable differences including token or session ID issue and expiry device binding client
      resource IP hops refresh lineage claim challenges revocation and downstream APIs. Microsoft documents token or cookie
      replay in another browser inheriting MFA state while CAE explains that a resource can reject an unexpired token after
      critical events or location changes. Not every client or resource supports this and propagation and network limits remain.
      Stealth effect depends on the actual relying party rather than an abstract assumption that a password change ends every
      session.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求一个可解析的既有认证状态、攻击者控制或重放事实、没有对应的新完整认证链或明确的 silent refresh，以及目标资源的实际接受结果。普通应用自动 refresh、用户多设备会话、共享浏览器、VDI roaming
      和合法 long-lived automation 会产生同类痕迹，必须用 controller、设备、资源、撤销/风险事件与后继行为区分。
    en: Inclusion requires resolvable established authenticated state evidence of adversary control or replay absence of a
      corresponding fresh complete authentication chain or an explicit silent refresh and an actual acceptance result at the
      target resource. Normal application refresh multi-device user sessions shared browsers VDI roaming and legitimate long-lived
      automation produce the same trace class and require controller device resource revocation or risk events and downstream
      behavior for differentiation.
  - zh: 新登录即使使用 token-like credential，只要重新形成主认证/MFA/新 session chain，就不按本项，而按 NJS-0061-001 或父级；选择休眠/无人反馈身份属于 NJS-0061-003，可与本项共映射。token
      伪造、claim 修改、SAML 签名滥用、process token impersonation、凭据导出和 account role mutation 均保留其相邻 owner。
    en: A new sign-in that uses a token-like credential but creates a fresh primary-authentication MFA or new-session chain
      does not qualify here and remains NJS-0061-001 or parent core. Selection of a dormant or low-feedback identity belongs
      to NJS-0061-003 and can co-map. Token forgery claim modification SAML signing abuse process-token impersonation credential
      export and account-role mutation retain their adjacent owners.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 常见场景是 AiTM、浏览器资料窃取或端点控制后，攻击者在另一浏览器或设备中重放已完成 MFA 的 token/cookie，访问邮件、文档、云控制平面或 SaaS API；也可能继续利用受控真实设备中的会话而不导出材料。Microsoft
        的 token tactics 与 AiTM/BEC 报告直接展示认证状态继承和提供方侧异常 token、登录、邮件访问、inbox rule 等残余。
      en: Common scenarios follow AiTM browser-profile theft or endpoint control when the adversary replays an MFA-completed
        token or cookie in another browser or device to reach mail documents cloud control planes or SaaS APIs. The adversary
        can also continue a session on the controlled real device without exporting material. Microsoft token-tactics and
        AiTM or BEC reports directly show inherited authentication state and provider residuals such as anomalous token sign-in
        mail access and inbox rules.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要 session material 或仍登录的设备，并理解 token audience、scope、expiry、refresh、nonce、device binding、IP/CAE 与 relying-party
          支持。导出到新设备可能触发绑定或位置策略；继续在真实设备上操作可保持设备信任，却暴露端点进程和交互痕迹。会话被撤销、账户禁用、风险提高或资源发出 claim challenge 会中断链。
        en: The adversary needs session material or a device that remains signed in and must understand token audience scope
          expiry refresh nonce device binding IP or CAE and relying-party support. Export to a new device can trigger binding
          or location policy while continued use on the real device retains device trust but exposes endpoint process and
          interaction traces. Session revocation account disablement increased risk or a resource claim challenge can terminate
          the chain.
    defender_model:
      paragraphs:
      - zh: 防守方需要同时观察身份认证、令牌签发与刷新、会话清单、设备和来源变化、资源访问以及撤销或重新验证事件。稳定的身份、会话和资源标识有助于识别同一会话跨设备或网络跳变、风险事件后继续使用，以及没有新认证却访问敏感资源的情况。
        en: Defenders need visibility across authentication, token issuance and refresh, session inventory, device and origin
          changes, resource access, and revocation or revalidation events. Stable identity, session, and resource identifiers
          help reveal one session moving across devices or networks, continuing after a risk event, or reaching sensitive
          resources without fresh authentication.
      - zh: 合法移动办公、自动刷新、离线客户端、协作应用和自动化服务会产生长会话，而部分依赖方不暴露会话标识或不会立即执行撤销。观察覆盖和传播延迟必须纳入判断，不能把缺少新登录等同于恶意。
        en: Legitimate mobile work, automatic refresh, offline clients, collaboration applications, and automation services
          create long sessions, while some relying parties do not expose session identifiers or enforce revocation immediately.
          Coverage and propagation delay must be considered, and absence of a fresh sign-in cannot be equated with malicious
          use.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 省略新的主认证与 MFA，使关键身份切换不进入登录观察面
    en: Omit fresh primary authentication and MFA so the critical identity transition stays outside the sign-in vantage
  analysis:
    paragraphs:
    - zh: 攻击者提交仍有效的 session/token，而不是重新提交密码和第二因素。行为设计删除新的 credential validation、MFA challenge、risk evaluation 与 new-session
        链；痕迹变化为资源层直接接受 existing session，认证层只见 refresh 或完全无事件。只依赖 sign-in alert 的防守方因此看不到关键使用，恶意访问在认证视角形成 NM-BT 行为透明；跨 token/session/resource
        lineage 和事件后连续访问评估能恢复关系。
      en: The adversary presents a still-valid session or token instead of resubmitting password and second factor. This design
        removes fresh credential validation MFA challenge risk evaluation and new-session lineage. Traces change to direct
        resource acceptance of an existing session while the authentication layer sees only refresh or nothing. A defender
        relying on sign-in alerts misses the critical use and malicious access becomes NM-BT Behavioral Transparency from
        the authentication vantage. Cross-token session and resource lineage plus post-event continuous access evaluation
        can restore the relation.
  evidence_refs:
  - REF-000070
  - REF-000067
  - REF-000380
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 资源操作继承合法会话身份与已完成认证声明
    en: Resource operations inherit the legitimate session identity and completed-authentication claims
  analysis:
    paragraphs:
    - zh: 被接受的 token/cookie 携带真实主体、scope、MFA 或设备相关声明，资源因而把请求显示为合法用户会话继续，而不是未知工具重新登录。行为设计借用会话的认证信誉；痕迹保留正常 identity 与 allow
        决议但隐藏恶意 controller。资源侧按用户名、MFA claim 或 session age 的粗粒度分类难以区分，产生 NM-FD 特征伪装；设备、IP、token issuance、refresh 和后继动作差分可限制效果。
      en: An accepted token or cookie carries a real principal scope and MFA- or device-related claims so the resource presents
        the request as continuation of a legitimate user session rather than an unknown tool signing in again. The design
        borrows authentication reputation. Traces retain a normal identity and allow decision while hiding the malicious controller.
        Coarse resource classification by username MFA claim or session age loses discrimination and produces NM-FD Feature
        Disguise while device IP token issuance refresh and downstream-action differentials can constrain it.
  evidence_refs:
  - REF-000070
  - REF-000067
  - REF-000376
  - REF-000380
  confidence: high
