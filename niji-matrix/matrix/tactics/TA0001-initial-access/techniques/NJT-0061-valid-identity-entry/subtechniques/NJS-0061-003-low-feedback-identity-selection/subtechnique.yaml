schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0061-003
parent_ref: NJT-0061
name:
  zh: 低反馈身份选择
  en: Low-Feedback Identity Selection
summary:
  zh: 选择仍有有效权限、但长期无合法使用或缺少活跃所有者与交互监控反馈的身份，降低并发冲突、人工否认和常规行为基线信号。
  en: Select an identity that retains valid authorization but lacks recent legitimate use or active-owner and interactive-monitoring
    feedback to reduce concurrent conflict human denial and routine behavioral-baseline signals.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 低反馈身份选择是攻击者在多个可用有效身份中，有意选择仍具访问权、但长期没有合法活动、没有可联系的活跃 owner，或虽由服务使用却缺少交互登录监督的身份。稳定变量不是“休眠账户”或“服务账户”类别本身，而是合法使用历史和 owner/interactive
      feedback 的可观测状态；只有攻击者能识别并利用该状态、且系统仍接受身份时成立。
    en: Low-Feedback Identity Selection occurs when an adversary deliberately chooses among available valid identities one
      that retains access but has a long absence of legitimate activity no reachable active owner or service use without oversight
      of interactive sign-in. The stable variable is observable legitimate-use history and owner or interactive-feedback state
      rather than dormant-account or service-account category itself. It qualifies only when the adversary can identify and
      exploit that state and the system still accepts the identity.
  - zh: 该选择减少的不是所有日志，而是正常主体本可提供的对照与否认信号。活跃员工可能同时在线、拒绝 MFA、报告异常或形成丰富行为基线；休眠用户没有这些即时反馈，无人值守高权服务身份的自动化活动又可能缺少个人责任。攻击者利用反馈空白延迟识别，但首次使用
      after silence、owner 缺失、standing entitlement、交互登录和资源结果仍构成可恢复残余。
    en: The selection does not remove every log and instead reduces comparison and denial signals that a normal principal
      could supply. An active employee may be concurrently online reject MFA report anomalies or create a rich behavior baseline.
      A dormant user provides none of that immediate feedback and unattended privileged service activity can lack personal
      accountability. The adversary uses the feedback gap to delay recognition while first use after silence missing owner
      standing entitlement interactive logon and resource outcomes remain recoverable residuals.
stealth_characteristics:
  paragraphs:
  - zh: 低反馈身份选择在休眠人类身份上留下长时间零活动后的首次登录或资源访问；这本身可能是可检测异常，但没有正常并发会话、用户报告、近期设备/位置基线和持续业务 owner 来快速解释或否认。对无人值守服务身份，恶意请求可能混入自动化资源调用，而没有人类
      MFA、交互节奏和责任人确认。两个实现共享“反馈弱”的观察效果，不因账户类型拆成兄弟项。
    en: Low-Feedback Identity Selection leaves first sign-in or resource access after a long zero-activity period for a dormant
      human identity. That can itself be detectable but lacks normal concurrent sessions user reporting recent device or location
      baseline and an active business owner who can quickly explain or deny it. For an unattended service identity malicious
      requests can blend into automation resource calls without human MFA interactive cadence or accountable confirmation.
      Both implementations share weak feedback and are not split by account type.
  - zh: 匿迹效果有明确反转条件。若组织维护 owner、HR/供应关系、last legitimate use、service dependency、允许的 logon type/host、event-time entitlement
      与 first-use watchlist，长时空白会变成高价值信号；如果 unused account 被禁用、standing privilege 被移除或 service account 只能从固定 workload 认证，攻击者无法继续利用。普通休假、季节性作业、break-glass
      和灾备账户则会造成合法相似行为，需审批和 dependency 证据。
    en: The stealth effect has explicit reversal conditions. When an organization maintains owner HR or supplier relationship
      last legitimate use service dependency permitted logon type or host event-time entitlement and a first-use watchlist
      the long gap becomes a high-value signal. Disabled unused accounts removed standing privilege or service identities
      restricted to fixed workloads terminate the opportunity. Leave seasonal jobs break-glass and disaster-recovery accounts
      create legitimate lookalikes and require approval and dependency evidence.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须证明身份仍可被目标接受并拥有实际授权、攻击者在选择时可知道或利用其低反馈状态、近期合法活动或活跃 owner/交互监控确实缺失，以及该缺失改变了防守观察或响应。单纯“账户很旧”“用户名像 service”“90/180
      天无登录”或 owner 字段为空不能证明恶意选择；阈值需由本地业务周期确定。
    en: Inclusion requires proof that the identity remains accepted and holds actual authorization the adversary could know
      or exploit its low-feedback state recent legitimate activity or active owner and interactive monitoring is genuinely
      absent and the absence changes defender observation or response. An old account service-like username 90- or 180-day
      no-logon threshold or empty owner field alone does not prove malicious selection. Thresholds are defined by local business
      cycles.
  - zh: NJS-0061-001 控制新的登录来源/设备/时间相似度；NJS-0061-002 控制是否沿用既有认证状态；本项控制身份本身的合法活动/反馈状态，可与两者共同映射。按 Default、Domain、Local、Cloud、human、service、guest
      或 workload 划分均被排除；active service identity 如果有强 owner、固定 workload 与资源监控，不因是 service account 自动纳入。
    en: NJS-0061-001 controls source device and time similarity for a fresh sign-in and NJS-0061-002 controls continuation
      of established authentication. This child controls legitimate-activity and feedback state of the identity itself and
      can co-map either sibling. Partitions by Default Domain Local Cloud human service guest or workload are excluded. An
      active service identity with accountable ownership fixed workload and resource monitoring does not qualify merely because
      it is a service account.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 一类场景是离职、长期休眠、旧合作方、灾备或未清理的敏感用户身份仍保留域、云或应用权限。攻击者在账户清理前使用它，因为活跃 owner 不会同步报告异常；首次 after-silence 登录和不再合理的 entitlement
        成为主要线索。Microsoft 明确将休眠敏感身份描述为攻击者通往组织深处的安静路径，并建议移除高权或删除账户。
      en: One scenario involves former-employee long-dormant old-partner disaster-recovery or uncleared sensitive user identities
        retaining domain cloud or application permission. The adversary uses the identity before cleanup because no active
        owner promptly reports the anomaly. First sign-in after silence and entitlement no longer justified become the primary
        clues. Microsoft explicitly describes dormant sensitive identities as a quiet path deep into an organization and recommends
        privilege removal or deletion.
    - zh: 另一类场景是高权服务或自动化身份保留 long-lived credential、允许交互登录或可从非预期主机认证，却没有明确个人 owner 和定期 dependency review。攻击者以该身份访问管理接口或敏感数据，局部日志看起来像服务活动。若
        identity 仍有活跃且稳定 workload，检测应比较 permitted host、resource/verb、cadence 和 deployment 变化，而不是把所有服务调用都视为低反馈。
      en: Another scenario involves a privileged service or automation identity retaining long-lived credentials allowing
        interactive logon or authenticating from unexpected hosts without a named human owner and recurring dependency review.
        The adversary uses it against management interfaces or sensitive data and point logs resemble service activity. If
        the identity still has an active stable workload detection compares permitted host resource or verb cadence and deployment
        change rather than treating every service call as low feedback.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要先发现身份、合法使用间隔、owner/离职/供应关系、服务依赖或监控弱点，并取得仍可认证的凭据或会话。选择休眠身份可能触发 first-use anomaly，选择服务身份可能被 logon restriction、managed
          credential 或 workload binding 拒绝；攻击者必须确认状态仍 enabled、entitlement 仍有效且使用不会立即触发 owner review。
        en: The adversary needs discovery of identity legitimate-use interval owner employment or supplier relationship service
          dependency or monitoring weakness and control of a credential or session that still authenticates. A dormant identity
          can trigger a first-use anomaly and a service identity can be rejected by logon restriction managed credentials
          or workload binding. The adversary must confirm that it remains enabled entitlement remains effective and use does
          not immediately trigger owner review.
    defender_model:
      paragraphs:
      - zh: 防守方可能把目录身份连接到人员或供应关系、责任所有者、最近的交互与非交互活动、服务依赖、允许的主机或登录类型以及资源审计。休眠周期必须按人员、季节任务、灾备和服务身份分别解释；缺少所有者或近期活动会削弱归因，但不能单独证明攻击。
        en: Defenders may join directory identities to employment or supplier relationships, accountable owners, recent interactive
          and noninteractive activity, service dependencies, permitted hosts or logon types, and resource audit. Dormancy
          periods must be interpreted separately for people, seasonal jobs, disaster recovery, and service identities. Missing
          ownership or recent activity weakens attribution but does not by itself prove an attack.
      - zh: 长期清单和活动历史能够把首次长期静默后的使用、服务身份的非常用交互登录以及偏离固定工作负载的资源访问暴露出来。应急账户、季节作业和合法恢复流程会产生相似空白，观察模型需要保留批准和依赖背景。
        en: Long-lived inventory and activity history can expose first use after extended silence, unusual interactive sign-in
          by a service identity, and resource access outside a fixed workload. Break-glass identities, seasonal jobs, and
          legitimate recovery workflows create similar gaps, so the observation model needs approval and dependency context.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 利用所有者和交互监控反馈缺口，使有效身份滥用不进入常规否认与响应视野
    en: Exploit gaps in owner and interactive-monitoring feedback so valid-identity abuse avoids routine denial and response
  analysis:
    paragraphs:
    - zh: 攻击者在多个凭据中选择长期无合法活动或无人承担实时责任的身份，并保持账户外观和权限不变。行为设计让恶意使用发生在没有并发用户会话、MFA 拒绝、helpdesk 报告或 owner 确认的反馈环境；痕迹仍记录 successful
        identity/resource access，却缺少能把它迅速判为非本人操作的外部信号。依赖这些人工或交互反馈的观察因此不触发或延迟，形成 NM-BT 行为透明。
      en: The adversary selects among credentials an identity with a long absence of legitimate activity or no real-time accountable
        owner and leaves account appearance and permission unchanged. This design places malicious use in a feedback environment
        without concurrent user sessions MFA denial helpdesk reporting or owner confirmation. Traces still record successful
        identity and resource access but lack external signals that quickly reject attribution to the legitimate principal.
        Observation dependent on human or interactive feedback fails to trigger or is delayed and produces NM-BT Behavioral
        Transparency.
  evidence_refs:
  - REF-000094
  - REF-000381
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 让资源操作继承休眠敏感身份或自动化服务身份的合法授权外观
    en: Let resource operations inherit the legitimate authorization appearance of a dormant sensitive or automated service
      identity
  analysis:
    paragraphs:
    - zh: 攻击者不创建新身份或改变角色，而是选择一个仍被目录和资源信任的低反馈主体。痕迹因此显示真实 account SID/principal、合法 role 和正确 allow，服务身份的调用还可能处在高量自动化中；点式资源分类看见的是“获准主体执行获准动作”，难以识别
        controller 已改变，形成 NM-FD 特征伪装。身份生命周期和 workload provenance 是恢复真实操作者的必要视角。
      en: The adversary neither creates a new identity nor changes a role and instead selects a low-feedback principal still
        trusted by directory and resource. Traces therefore show a real account SID or principal legitimate role and correct
        allow and service-identity calls can sit inside high-volume automation. Point resource classification sees an entitled
        principal performing an entitled action and struggles to identify controller change producing NM-FD Feature Disguise.
        Identity lifecycle and workload provenance are necessary vantages for recovering the real operator.
  evidence_refs:
  - REF-000381
  confidence: medium
