research:
  limitations:
    paragraphs:
    - zh: 公开指导直接描述休眠敏感身份、陈旧服务账户和缺少交互监督的高权限服务身份风险，并给出专门治理措施，但通常不公开攻击者每次选择身份的过程。因此该子技术能够成立，攻击者选择意图仍保持中等置信度。
      en: Public guidance directly describes the risk of dormant sensitive identities, stale service accounts, and privileged
        service identities lacking interactive oversight and provides specialized governance measures, but it usually does
        not disclose the adversary's selection process in each event. The child is supported while adversary selection intent
        remains medium confidence.
    - zh: 固定天数不是跨组织常数。服务身份可能没有交互登录却持续合法调用，灾备和应急身份也可能设计为长期不用；缺少非交互活动、依赖、所有者和批准数据时，休眠程度会被误判。
      en: A fixed number of days is not a cross-organization constant. A service identity may have no interactive sign-in
        while making continuous legitimate calls, and disaster-recovery or break-glass identities may be designed for long
        disuse. Dormancy will be misclassified without noninteractive activity, dependency, ownership, and approval data.
