research:
  limitations:
    paragraphs:
    - zh: 住宅代理和会话重放报告直接支持情境贴合与会话续用。低反馈身份选择主要由休眠敏感身份、陈旧服务账户和缺少交互监督的治理资料支持；这些资料能够证明观察和防御差异，但通常不能揭示攻击者每次选择身份时的主观意图，因此该子技术保持中等置信度。
      en: Reports on residential proxies and session replay directly support context alignment and session reuse. Low-feedback
        identity selection is supported mainly by guidance on dormant sensitive identities, stale service accounts, and identities
        lacking interactive oversight. Those sources establish observation and defensive differences but usually do not reveal
        the adversary's intent in every identity choice, so that child remains medium confidence.
    - zh: 不同身份平台提供的会话、设备、权限和资源结果字段并不一致，保留期和撤销传播也有差异。缺少跨视角数据时，只能确认来源直接支持的身份使用和局部痕迹变化，不能把高权限标签或成功访问自动解释为权限提升。
      en: Identity platforms expose different session, device, authority, and resource-outcome fields, and retention and revocation
        propagation also vary. When cross-vantage data is missing, conclusions are limited to the identity use and local trace
        changes directly supported by evidence; a privileged label or successful access cannot automatically be interpreted
        as privilege escalation.
    - zh: ATT&CK 直接支持 T1078 的 Persistence 映射，但公开事件通常缺少稳定 controller、完整 session 结束事实和处置前后资源结果。没有本地 identity/session/resource 谱系时，只能确认有效身份使用，不能升级为确认的持续访问。合法自动化、灾备和长期 session 又会产生相似连续性；低反馈身份的主观选择意图仍保持 medium。
      en: ATT&CK directly supports the T1078 Persistence mapping but public incidents usually lack a stable controller complete session-termination facts and before-and-after resource outcomes. Without local identity session and resource lineage valid-identity use can be established but not confirmed continuing access. Legitimate automation disaster recovery and long sessions create similar continuity and intent behind low-feedback identity selection remains medium.
