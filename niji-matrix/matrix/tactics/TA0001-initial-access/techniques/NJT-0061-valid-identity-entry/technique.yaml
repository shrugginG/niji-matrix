schema_version: 2.0.0
type: technique
id: NJT-0061
name:
  zh: 匿迹化有效身份使用
  en: Stealth-Conforming Valid-Identity Use
summary:
  zh: 使用系统仍然接受的真实身份或认证会话，并控制登录情境、会话连续性或身份反馈状态，使恶意访问更接近正常授权活动。
  en: Use an authentic identity or authenticated session still accepted by the system while controlling sign-in context, session
    continuity, or identity-feedback state so malicious access more closely resembles legitimate activity.
aliases:
- 有效身份入口
- Valid-Identity Entry
classification:
  tactic_refs:
  - TA0001
  - TA0003
  - TA0004
  - TA0005
  origin:
    kind: attack-retained
    source_attack_id: T1078
    source_attack_version: '19.1'
  decision_ref: DEC-TA0001-T1078
definition_and_concept:
  paragraphs:
  - zh: 匿迹化有效身份使用是攻击者使用系统仍按正常认证或既有会话语义接受的真实用户、服务、来宾、设备或工作负载身份，并有意控制登录情境、会话连续性或所有者反馈状态。直接对象不是账户名称或凭据格式，而是该身份或会话被接受并以其实际授权访问资源的连续行为。
    en: Stealth-Conforming Valid-Identity Use occurs when an adversary uses a real user, service, guest, device, or workload
      identity that the system still accepts under ordinary authentication or established-session semantics while deliberately
      controlling sign-in context, session continuity, or owner-feedback state. The direct object is not an account name or
      credential format, but the continuous behavior in which the identity or session is accepted and accesses resources under
      its actual authorization.
  - zh: 在初始访问中，该行为用于取得第一个经过认证的立足点；在入侵维持中，同一身份或会话跨独立访问时段或明确中断保持可用，并由后续被接受的使用恢复或维持攻击者资源访问；在权限提升中，攻击者已经控制较低权限位置，并借另一个仍有效的身份获得此前没有的资源权限。三种战术共享相同的身份使用对象，但各自结果门不形成新子技术，成功登录或高权限标签也不能替代结果证据。
    en: For Initial Access the behavior establishes the first authenticated foothold. For Persistence the same identity or session remains usable across a separate access episode or defined interruption and later accepted use restores or maintains adversary resource access. For Privilege Escalation an adversary already controlling a lower-authority position uses another still-valid identity to obtain previously unavailable authority. The three tactics share one identity-use object while their outcome gates do not form new children and successful sign-in or privileged labels do not replace outcome evidence.
stealth_characteristics:
  paragraphs:
  - zh: 匿迹化有效身份使用改变的是访问与身份历史之间的差异。情境贴合使新的登录来源、设备和时间接近既有习惯；会话续用减少新的认证事件；低反馈身份选择削弱活跃所有者、并发会话和日常行为基线提供的否认信号。攻击者因而能够借用真实主体的信誉，而不必伪造身份。
    en: Stealth-Conforming Valid-Identity Use changes the difference between an access event and the identity's established
      history. Context alignment makes a new sign-in resemble familiar origins, devices, and times; session reuse reduces
      fresh authentication events; low-feedback identity selection weakens denial signals from active owners, concurrent sessions,
      and routine behavior. The adversary can therefore borrow a real principal's reputation without forging the identity.
  - zh: 痕迹并未消失。身份提供方、端点和资源服务仍可能保留主体、会话、认证方法、来源、设备、当时权限和资源操作，只是这些事实分散在不同观察面。长期身份历史、会话连续性和资源侧记录越完整，攻击者越难维持这种外观。
    en: The traces do not disappear. Identity providers, endpoints, and resource services may still retain the principal,
      session, authentication method, origin, device, event-time authority, and resource operation, but those facts are distributed
      across different vantages. The more complete the long-term identity history, session continuity, and resource-side record,
      the harder it is for the adversary to preserve the appearance.
  - zh: 在 Persistence 中，分离的多次访问可分别表现为正常登录或既有会话继续，并且不需要新增代码或配置制品；只观察一次登录、单台端点或当前会话的检测容易遗漏控制连续性。账户/认证 epoch、access episode、处置事件和资源 allow 的长周期关联仍能恢复同一攻击者跨时段维持访问的关系。
    en: Under Persistence separate access episodes can each appear as ordinary sign-in or established-session continuation without a new code or configuration artifact. Detection limited to one login endpoint or current session can miss continuity of control. Long-horizon correlation across account or authenticator epochs access episodes response events and resource allows can still recover the same adversary maintaining access across time.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击者有意使用未被本次行为修改、但仍会被目标接受的有效身份或认证会话，并通过情境贴合、会话续用或低反馈身份选择降低访问可区分性的行为。合法管理员、轮班用户、自动化服务、旅行和设备更换可能产生相似现象，不能仅凭异常分数或账户权限归类。
    en: This technique includes deliberate adversary use of a valid identity or authenticated session that remains accepted
      and is not modified by the use itself, when context alignment, session reuse, or low-feedback identity selection reduces
      the distinguishability of access. Legitimate administrators, shift workers, automation services, travel, and device
      replacement can produce similar observations, so an anomaly score or account privilege alone is insufficient.
  - zh: 凭据取得、会话材料窃取、账户或授权状态修改、进程令牌操纵和临时提权事务分别属于其相邻技术；VPN、远程服务或管理接口只是承载访问的路径。只有系统按既有信任语义接受该身份或会话并据此授权资源的部分属于本技术。
    en: Credential acquisition, theft of session material, account or authorization-state modification, process-token manipulation,
      and temporary elevation transactions belong to their adjacent techniques. VPNs, remote services, and management interfaces
      merely carry the access. This technique owns only the system's acceptance of the identity or session under existing
      trust semantics and the resulting resource authorization.
  - zh: TA0003 映射要求先前攻击者访问、后续独立 access episode 或明确中断、同一未修改身份/会话连续性以及实际恢复或维持资源访问形成闭合链。合法员工重登、自动 token refresh、灾备、break-glass、季节任务和设备迁移会产生同类连续性；账户长期有效或重复登录本身不能证明 Persistence。
    en: TA0003 mapping requires a closed chain across prior adversary access a later separate access episode or defined interruption continuity of the same unchanged identity or session and actual restoration or maintenance of resource access. Legitimate employee reauthentication automatic token refresh disaster recovery break-glass seasonal jobs and device migration create equivalent continuity and a long-lived account or repeated login alone does not establish Persistence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可能用窃取的员工、合作方、设备或服务身份访问身份平台、VPN、邮件、SaaS、管理设备或云接口。住宅出口、真实设备或正常工作时段可使新登录更接近历史；仍有效的会话可省略新的多因素认证；无人管理的旧身份则减少及时的所有者反馈。
      en: An adversary may use a stolen employee, partner, device, or service identity against an identity platform, VPN,
        mail service, SaaS application, management appliance, or cloud interface. Residential egress, a real device, or ordinary
        work hours can make a fresh sign-in resemble history; a still-valid session can omit fresh multifactor authentication;
        and an unmanaged old identity can reduce timely owner feedback.
    - zh: 在已经存在立足点的环境中，攻击者还可能使用权限更高的本地、域、云或服务身份访问此前不可达的资源。该场景只有在身份实际有效且带来新的资源权限时才属于权限提升；同权限身份切换仍只是有效身份使用。
      en: After a foothold already exists, the adversary may use a more privileged local, domain, cloud, or service identity
        to reach resources that were previously unavailable. This scenario belongs to Privilege Escalation only when the identity
        is actually effective and adds resource authority; switching to an identity with equivalent authority remains valid-identity
        use without elevation.
    - zh: 为维持访问，攻击者可以在原恶意进程、VPN session 或端点驻留被终止后，从贴合身份历史的网络、设备和时段重新认证；也可以续用仍被依赖方接受的 Cookie、token 或浏览器状态，或周期性使用缺少活跃 owner 的服务/休眠身份。只有后续资源实际接受并形成攻击者可控操作时，才完成 TA0003 结果。
      en: To maintain access an adversary can reauthenticate from a network device and time resembling identity history after the original malicious process VPN session or endpoint foothold is terminated. The actor can instead reuse a cookie token or browser state still accepted by a relying party or periodically use a service or dormant identity without an active owner. TA0003 completes only when a later resource accepts the state and provides adversary-controlled operations.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须控制目标仍接受的凭据或认证会话，并把它对应到正确的租户、域、主机、应用或资源。情境贴合需要了解受害者常见位置、设备和活动时间；会话续用受有效期、撤销和设备绑定限制；低反馈选择需要了解身份的使用历史、所有者和自动化用途。更精确的模仿通常需要更稳定的基础设施和更长的侦察。
        en: The adversary must control a credential or authenticated session still accepted by the target and map it to the
          correct tenant, domain, host, application, or resource. Context alignment requires knowledge of familiar victim
          locations, devices, and activity times; session reuse is constrained by expiry, revocation, and device binding;
          and low-feedback selection requires knowledge of identity-use history, ownership, and automation purpose. More precise
          imitation usually demands more stable infrastructure and longer reconnaissance.
      - zh: 长期维持还要求攻击者在首次进入后保存 credential、session state、受控设备或必要情境，并理解密码/认证器轮换、风险策略、token expiry、撤销传播和 relying-party 执行差异。处置越完整，重新使用同一状态越可能失败或产生新的认证和资源差分。
        en: Long-term maintenance additionally requires preservation of credentials session state a controlled device or necessary context after first entry and knowledge of password or authenticator rotation risk policy token expiry revocation propagation and relying-party enforcement differences. More complete response makes reuse of the same state more likely to fail or produce fresh authentication and resource differentials.
    defender_model:
      paragraphs:
      - zh: 防守方的观察面分布在身份提供方、目录治理、端点、远程服务和资源提供方。可见信息可能包括稳定身份与会话标识、认证方法、来源与设备、条件访问结果、当时有效权限、资源操作、账户所有者和最近合法活动，但任何单一日志通常都不完整。
        en: Defender visibility is distributed across identity providers, directory governance, endpoints, remote services,
          and resource providers. Available information may include stable identity and session identifiers, authentication
          method, origin and device, conditional-access outcome, event-time authority, resource operations, account owner,
          and recent legitimate activity, but no single log is usually complete.
      - zh: 共享出口、合法多设备使用、高频服务账户、应急账户和有限保留期会削弱判断。能够跨身份、会话和资源视角长期关联，并维护所有者、设备和服务依赖基线的防守方，更容易区分合法访问与身份被他人控制。
        en: Shared egress, legitimate multi-device use, high-volume service identities, break-glass accounts, and limited
          retention weaken judgment. Defenders able to correlate identity, session, and resource vantages over time and maintain
          ownership, device, and service-dependency baselines are better able to distinguish legitimate access from control
          by another actor.
      - zh: Persistence 观察必须跨首次访问、原 session 结束、凭据/风险/处置变化和后续资源结果，并用稳定 identity、session/token、device、resource 与 access-episode 键关联。资源方不暴露 token ID、本地离线认证、撤销传播延迟和历史日志过期会使连续性未决；一次成功登录只能证明身份被接受。
        en: Persistence observation must span first access original-session termination credential risk or response changes and later resource outcomes using stable identity session or token device resource and access-episode keys. Relying parties that omit token IDs local offline authentication revocation delay and expired history keep continuity unresolved and one successful sign-in proves only identity acceptance.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实身份与贴合情境把攻击流量重塑为合法主体的可见特征
    en: Authentic identity and aligned context reshape adversary traffic into the visible features of a legitimate principal
  analysis:
    paragraphs:
    - zh: 攻击者选择系统仍认可的身份，并使新的登录来源、设备、客户端或时间接近该身份的正常历史。痕迹继续显示真实账户和成功认证，但常见的来源信誉、地理和设备差异减弱；依赖这些粗粒度特征的防守观察因而更难区分恶意操作者，形成特征伪装。
      en: The adversary selects an identity the system still recognizes and makes a fresh sign-in resemble the identity's
        normal history in origin, device, client, or timing. Traces still show a real account and successful authentication,
        but common differences in source reputation, geography, and device novelty are reduced. Defender observation that
        relies on those coarse features therefore has greater difficulty distinguishing the malicious operator, producing
        Feature Disguise.
  evidence_refs:
  - REF-000094
  - REF-000111
  - REF-000112
  - REF-000376
  - REF-000382
  confidence: high
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 既有会话与低反馈身份让关键认证或人工否认信号落在常规观察之外
    en: Established sessions and low-feedback identities place critical authentication or human-denial signals outside routine
      observation
  analysis:
    paragraphs:
    - zh: 会话续用省略新的主认证链，使资源请求直接继承既有会话的身份和信誉；低反馈身份选择则减少活跃所有者、并发使用和人工报告带来的反证。两种行为都让恶意访问在局部观察面表现为正常延续，同时仍留下会话、身份生命周期和资源使用痕迹，可通过跨视角关联恢复。
      en: Session reuse omits a fresh primary-authentication chain and lets resource requests inherit the identity and reputation
        of an established session. Low-feedback identity selection instead reduces counter-signals from active owners, concurrent
        use, and human reporting. Both make malicious access appear as ordinary continuation within a local vantage while
        leaving session, identity-lifecycle, and resource-use traces that cross-vantage correlation can recover.
  evidence_refs:
  - REF-000070
  - REF-000067
  - REF-000380
  - REF-000381
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 三个子技术分别按登录情境、认证会话连续性和身份反馈状态划分。情境贴合要求新的认证链及其风险情境接近历史；会话续用要求资源访问沿用既有认证状态；低反馈身份选择要求所选身份缺少近期合法活动或活跃所有者反馈。三者可以组合，但改变的痕迹和防守观察不同。
      en: The three children are partitioned by sign-in context, authenticated-session continuity, and identity-feedback state.
        Context alignment requires a fresh authentication chain whose risk context resembles history; session reuse requires
        resource access through established authentication state; and low-feedback identity selection requires an identity
        lacking recent legitimate activity or active owner feedback. They can combine, but they change different traces and
        defender observations.
    - zh: 账户类型、平台、协议、凭据种类、权限高低和目标资源不构成子技术边界。它们只有在实现上述稳定变量时才影响分类。
      en: Account type, platform, protocol, credential kind, privilege level, and target resource do not form child boundaries.
        They affect classification only when they implement one of the stable variables above.
  coverage: established
  subtechnique_refs:
