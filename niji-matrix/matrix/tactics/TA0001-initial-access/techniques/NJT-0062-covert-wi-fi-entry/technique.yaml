schema_version: 2.0.0
type: technique
id: NJT-0062
name:
  zh: 隐蔽无线入口
  en: Covert Wi-Fi Entry
summary:
  zh: 通过邻近中继或无线控制差异连接目标 Wi-Fi 并取得首个通信/认证立足点。
  en: Connect to victim Wi-Fi through a nearby relay or wireless control differential and gain the first communication or authentication foothold.
aliases: []
classification:
  tactic_refs:
  - TA0001
  origin:
    kind: attack-retained
    source_attack_id: T1669
    source_attack_version: '19.1'
  decision_ref: DEC-TA0001-T1669
definition_and_concept:
  paragraphs:
  - zh: 通过邻近中继或无线控制差异连接目标 Wi-Fi 并取得首个通信/认证立足点。隐蔽无线入口以目标无线网络的认证与关联面以及近距离无线入口为直接行为对象，目标是在初始入侵阶段取得第一个可执行、可认证或可通信立足点。该概念描述入口行为及其受控匿迹变量，不以工具、产品、媒介或 ATT&CK 子技术名称划界。
    en: Connect to victim Wi-Fi through a nearby relay or wireless control differential and gain the first communication or authentication foothold. Covert Wi-Fi Entry treats the authentication
      and association surface of victim wireless networks and proximate wireless entry as its direct behavioral object and seeks the first executable, authenticated, or communicating
      foothold during Initial Access. The concept describes the entry behavior and its controlled stealth variables rather than a tool, product, medium, or ATT&CK child name.
stealth_characteristics:
  paragraphs:
  - zh: 隐蔽无线入口通过子技术改变入口痕迹的外观、位置、密度或跨层关联，使受害方难以从单一事件区分攻击与正常访问。匿迹并不消除证据，入口前后跨层身份、网络、内容、设备或供应链痕迹仍会残留在受害方、服务提供方、身份平面、端点或供应方；拥有更长保留期和跨视角关联能力的防守方可以限制这种效果。
    en: 'Covert Wi-Fi Entry changes the appearance, location, density, or cross-layer linkage of entry traces through its children, making one event difficult to distinguish from normal
      access. Stealth does not erase evidence: cross-layer identity, network, content, device, or supply-chain traces around entry remain at the victim, service provider, identity plane,
      endpoint, or supplier, and defenders with longer retention and cross-vantage correlation can constrain the effect.'
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击者有意利用目标无线网络的认证与关联面以及近距离无线入口并改变首个入口痕迹的行为，截止于立足点建立。它排除后续执行、持久化、提权、横向移动与命令控制，也不按 ATT&CK 子技术、产品或介质直接拆分；相邻边界是物理植入设备属于硬件入口，公网远程服务会话属于远程服务入口。合法运维、个人化服务、兼容性行为或偶发故障只有在攻击者控制了稳定变量并产生对应观察差异时才可纳入。
    en: This technique includes adversary-controlled use of the authentication and association surface of victim wireless networks and proximate wireless entry that changes traces of
      the first entry and ends when the foothold is established. It excludes downstream execution, persistence, privilege escalation, lateral movement, and command and control and is
      not partitioned directly by ATT&CK children, product, or medium; its neighboring boundary is that physically planted devices belong to hardware entry, while public remote-service
      sessions belong to remote-service entry. Legitimate administration, personalized service, compatibility behavior, or accidental failure qualifies only when an adversary controls
      a stable variable and produces the corresponding observation difference.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者在企业互联网、身份、端点、物理或供应生态中，借助目标无线网络的认证与关联面以及近距离无线入口接近首个目标立足点并希望入口在建立前后保持低可区分性的场景。应用触发是首个入口条件已经可用且攻击者开始利用该条件；后续行动只能作为入口结果的证据，不能扩张本技术边界。
      en: This technique applies when an adversary uses the authentication and association surface of victim wireless networks and proximate wireless entry in enterprise Internet, identity,
        endpoint, physical, or supply ecosystems to approach the first victim foothold while keeping the entry difficult to distinguish before and immediately after establishment. The
        trigger is availability and use of the first-entry condition; downstream action may evidence the entry outcome but cannot expand this technique boundary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：对应入口面、身份、信任路径或载体可被攻击者利用。实施者还需控制目标无线网络的认证与关联面以及近距离无线入口的关键条件、时点或上下文，并能够承受选择性交付、跨视角协调、长期等待、物理接近或供应关系维护中至少一项成本；失去控制、目标不匹配或提供方处置会削弱匿迹效果。
        en: 'The adversary must satisfy these prerequisites: the corresponding entry surface, identity, trust path, or carrier is exploitable. The operator must also control key conditions,
          timing, or context of the authentication and association surface of victim wireless networks and proximate wireless entry and bear at least one cost involving selective delivery,
          cross-vantage coordination, delay, physical proximity, or supply-relationship maintenance; loss of control, target mismatch, or provider enforcement weakens the stealth effect.'
    defender_model:
      paragraphs:
      - zh: 防守方可能观察到入口前后跨层身份、网络、内容、设备或供应链痕迹，但受害方、服务提供方、身份系统、端点、物理设施与供应商掌握的字段和保留期不同。可靠判断需要在授权范围内连接入口前后事件、验证真实主体与来源，并为合法相似行为建立基线；缺少任一关键视角时只能形成受限推断。
        en: Defenders may observe cross-layer identity, network, content, device, or supply-chain traces around entry, but victims, service providers, identity systems, endpoints, physical
          facilities, and suppliers hold different fields and retention periods. Reliable judgment requires authorized linkage of pre-entry and post-entry events, validation of the actual
          subject and provenance, and baselines for legitimate lookalikes; missing a critical vantage limits the inference.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 可信或常见入口特征替代显著恶意特征并削弱粗粒度区分
    en: Trusted or common entry features replace conspicuous malicious features and weaken coarse discrimination
  analysis:
    paragraphs:
    - zh: 隐蔽无线入口的已证实子技术通过有意控制入口条件，使原本可以集中关联的入口前后跨层身份、网络、内容、设备或供应链痕迹发生位置、密度、外观或可见性变化。攻击者以合法、可信或常见入口特征替代显著恶意特征，使粗粒度规则难以区分；防守方必须恢复行为、身份与来源谱系，因而形成特征伪装效果。
      en: Supported children of Covert Wi-Fi Entry intentionally control entry conditions so that otherwise correlatable traces such as cross-layer identity, network, content, device,
        or supply-chain traces around entry change location, density, appearance, or visibility. The adversary substitutes legitimate, trusted, or common entry features for conspicuous
        malicious features, weakening coarse rules; defenders must recover behavioral, identity, and provenance lineage, producing a Feature Disguise effect.
  evidence_refs:
  - REF-000113
  - REF-000114
  - REF-000095
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 入口链痕迹跨时间路径视点主体或供应层分散并提高重构成本
    en: Entry-chain traces disperse across time paths vantages subjects or supply layers and raise reconstruction cost
  analysis:
    paragraphs:
    - zh: 隐蔽无线入口的已证实子技术通过有意控制入口条件，使原本可以集中关联的入口前后跨层身份、网络、内容、设备或供应链痕迹发生位置、密度、外观或可见性变化。同一入口链的痕迹被分散到时间、路径、视点、主体或供应层，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
      en: Supported children of Covert Wi-Fi Entry intentionally control entry conditions so that otherwise correlatable traces such as cross-layer identity, network, content, device,
        or supply-chain traces around entry change location, density, appearance, or visibility. Traces of one entry chain are distributed across time, paths, vantages, subjects, or
        supply layers so short windows and point indicators see only fragments; defenders must rebuild shared lineage across units, producing a Spatiotemporal Trace Dilution effect.
  evidence_refs:
  - REF-000113
  - REF-000114
  - REF-000095
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 关键入口动作在单一观察面中呈现为正常低信号或观测空白
    en: Critical entry actions appear normal low-signal or absent within one observation vantage
  analysis:
    paragraphs:
    - zh: 隐蔽无线入口的已证实子技术通过有意控制入口条件，使原本可以集中关联的入口前后跨层身份、网络、内容、设备或供应链痕迹发生位置、密度、外观或可见性变化。关键入口动作在单一观察模型中表现为空白、低信号或正常结果，使原有分析逻辑不触发；扩大观察面或关联前后结果仍可恢复差异，因而形成行为透明效果。
      en: Supported children of Covert Wi-Fi Entry intentionally control entry conditions so that otherwise correlatable traces such as cross-layer identity, network, content, device,
        or supply-chain traces around entry change location, density, appearance, or visibility. The critical entry action appears blank, low-signal, or normal under one observation
        model, preventing existing analytics from firing; broader vantage and correlation with preceding and subsequent outcomes can recover the difference, producing a Behavioral Transparency
        effect.
  evidence_refs:
  - REF-000113
  - REF-000114
  - REF-000095
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立以下 Niji 原生匿迹子技术：相邻双宿主无线中继、无线控制差异入口。它们分别以控制目标附近第三方双宿主主机，再远程驱动其无线适配器连接目标 SSID；选择认证控制弱于公网远程服务的目标 Wi-Fi 建立入口为稳定划分变量，每项都会形成独立的痕迹变化、防守观察影响和防御需求；这些变量可以组合，但不能彼此替代。分类不继承 ATT&CK
        子技术，也不按工具、产品、账户类型、介质、目标类型或数据字段拆分。
      en: 'This technique defines the following Niji-native evasion sub-techniques: Compromised-Neighbor Wireless Relay, Wireless Control-Differential Ingress. They use these stable
        partition variables respectively: control a nearby third-party dual-homed host and remotely drive its wireless adapter to join the victim SSID; choose victim Wi-Fi whose authentication
        controls are weaker than public remote services. Each produces a distinct trace change, defender-observation effect, and defensive requirement; the variables may combine but
        do not substitute for one another. The taxonomy does not inherit ATT&CK children or partition by tool, product, account type, medium, target type, or data field.'
  coverage: established
  subtechnique_refs:
