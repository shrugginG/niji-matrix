rationale_zh: 固定基线明确 WMI 通过本地/远程 provider 执行命令。Microsoft 文档证明 Wmiprvse hosting 与 client/operation tracing，TA551 直接证明攻击者用 WMI 打断 Winword 父子谱系，AvosLocker 又证明 encoded PowerShell 与管理操作共存。父级保留，并按 provider 来源翻译 high 与日常管理情境合形 medium 划分。
rationale_en: The fixed baseline defines command execution through local or remote WMI providers. Microsoft documents Wmiprvse hosting and client or operation tracing TA551 directly proves WMI used to break Winword lineage and AvosLocker shows encoded PowerShell alongside management operations. The parent is retained with high-confidence provider provenance translation and medium-confidence routine-administration conformity children.
scope_notes_zh: 正式范围只纳入 WMI method/query side effect 实际执行命令、payload 或破坏动作；纯查询归 Discovery，永久订阅归 WMI Event Subscription，DCOM/WinRM 是来源维度。wmic.exe 已弃用不改变 PowerShell/COM/API 的 WMI 对象。
scope_notes_en: Formal scope includes only WMI methods or query side effects that actually execute commands payloads or destructive actions. Pure queries belong to Discovery permanent subscriptions to WMI Event Subscription and DCOM or WinRM is a provenance dimension. Deprecation of wmic.exe does not change WMI through PowerShell COM or APIs.
