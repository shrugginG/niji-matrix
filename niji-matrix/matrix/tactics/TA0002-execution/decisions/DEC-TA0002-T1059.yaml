candidate: {source_type: attack, source_attack_id: T1059, source_attack_version: '19.1', name_en: Command and Scripting Interpreter, name_zh: 命令与脚本解释器}
decision: adapt
rationale_zh: 固定基线确认解释器把攻击者控制的命令或脚本转化为执行。重新研究进一步直接观察到 FIN8 控制 WMI 父级与 stdin，使合法 PowerShell 的入口谱系和可见参数偏离真实因果；PEAKLIGHT 则把解密、解压与执行放入内存流。两类行为分别形成 NM-FD 与 NM-BT 的可证伪因果链，且官方 Script Block、AMSI、Python audit 与 execve 文档给出残余和反证条件，因此维持 adapt 并提升为 high。
rationale_en: The fixed baseline establishes interpreters converting adversary-controlled commands or scripts into execution. Re-research directly observes FIN8 control WMI parentage and standard input so legitimate PowerShell entry lineage and visible arguments differ from true causality, while PEAKLIGHT places decryption decompression and execution in a memory stream. The behaviors form falsifiable NM-FD and NM-BT causal chains, and official Script Block AMSI Python audit and execve documentation supplies residual and disconfirming conditions. The adapt decision is retained at high confidence.
scope_notes_zh: 正式范围要求解释器入口、攻击者控制语义和执行结果。13 个 ATT&CK 子项仅作为语言/平台覆盖先验，不导入 Niji 分类；既有两个子项分别固定入口谱系借用和短驻语义载体。纯编码/混淆、Native API、管理面命令通道和只传输未执行脚本均排除或交由相邻技术。
scope_notes_en: Formal scope requires an interpreter entry adversary-controlled semantics and an execution outcome. The thirteen ATT&CK children are language and platform coverage priors and are not imported. The two Niji children fix entry-lineage borrowing and transient semantic carriage. Pure encoding or obfuscation Native API management-plane command channels and transferred but unexecuted scripts are excluded or assigned to adjacent techniques.
