  name_en: BITS Jobs
  name_zh: BITS 作业
decision: retain
rationale_zh: 固定 ATT&CK 19.1 基线记录了攻击者滥用 BITS 作业下载、执行和长期保留程序的行为。Microsoft 文档进一步确认应用能够创建持久异步作业、选择后台优先级、配置重试与通知，并在作业进入 transferred 或 error 状态时由 BITS 以调用者用户上下文启动指定程序；UBoatRAT 和 Mandiant 的 KEGTAP 调查分别直接观察到跨重启通知执行和错误状态触发执行。该行为以 BITS 作业为稳定直接对象，并产生服务宿主、QMGR 状态、网络传输和后继进程之间的观察断点，因此保留 T1197，同时把没有执行语义的普通文件传输排除在 TA0002 正式范围之外。
rationale_en: The fixed ATT&CK 19.1 baseline records adversary abuse of BITS jobs for download, execution, and long-lived program activation. Microsoft documentation further establishes that applications can create persistent asynchronous jobs, select background priority, configure retry and notification, and have BITS launch a specified program in the calling user's context when a job enters transferred or error state. The UBoatRAT and Mandiant KEGTAP investigations directly observe post-reboot notification execution and error-state-triggered execution. The BITS job is therefore a stable direct object that creates observation breaks among service hosting, QMGR state, network transfer, and successor process, supporting retention of T1197 while excluding ordinary file transfer without execution semantics from the TA0002 formal scope.
scope_notes_zh: 正式范围纳入攻击者创建或修改 BITS 作业、配置与执行链耦合的文件队列、优先级、重试、通知标志与通知程序，并由作业状态触发或明确衔接攻击者代码运行。仅下载或上传文件而没有执行语义的活动不属于本 Execution 对象；通用未来调度归 T1053，服务管理器直接启动归 T1569，解释器解析执行归 T1059。任何 ATT&CK 子技术均未导入，两个 Niji 子项分别以后台优先级与流量外观、状态通知与跨窗口寿命为分类变量。
scope_notes_en: Formal scope includes adversary creation or modification of a BITS job, configuration of a file queue, priority, retry, notification flags, and notification program coupled to the execution chain, and adversary code started by job state or explicitly linked follow-on action. Download or upload without execution semantics is outside this Execution object; general future scheduling belongs to T1053, direct service-manager launch to T1569, and interpreter parsing and execution to T1059. No ATT&CK sub-technique is imported. The two Niji children respectively use background priority and traffic appearance, and state notification and cross-window lifetime, as classification variables.
