decision: adapt
rationale_zh: 固定基线锚定 IPC 驱动本地执行。Microsoft DDE 与 UNC1069 DEEPBREATH/Finder 直接证明受信 broker 来源替代，DDE/pipe/XPC 官方边界证明短驻消息的实时观察需求；支持两个 high-confidence 变量和 adapt。
rationale_en: The fixed baseline anchors local execution driven by IPC. Microsoft DDE and UNC1069 DEEPBREATH or Finder directly establish trusted-broker provenance substitution while official DDE pipe and XPC boundaries establish real-time observation needs for transient messages supporting two high-confidence variables and adaptation.
scope_notes_zh: 只纳入 IPC 请求直接导致接收进程执行的本地主机段；纯数据/同步、stdout 传输和无消息驱动的注入排除，远程 IPC 的跨主机段交由相邻远程服务。COM/DDE/XPC 不导入为 Niji 子项。
scope_notes_en: Scope includes the local-host segment where an IPC request directly causes receiver execution. Pure data or synchronization stdout transport and injection without message-driven execution are excluded and cross-host remote IPC belongs to adjacent remote services. COM DDE and XPC are not imported as Niji children.
