rationale_zh: 固定基线三项子技术覆盖 launchctl、Windows SCM 和 systemctl 服务执行。Blue Mockingbird 直接证明修改/启动已有服务可避免新对象并借 manager 身份，Microsoft PsExec 事件证明远程请求经临时服务转为本地执行。父级保留，Niji taxonomy 按已有对象与短驻事务两个观察变量划分，不继承平台子项。
rationale_en: Three fixed-baseline children cover launchctl Windows SCM and systemctl service execution. Blue Mockingbird directly proves modifying and starting an existing service can avoid a new object and borrow manager identity while Microsoft's PsExec incident proves remote requests translated through temporary services into local execution. The parent is retained and Niji taxonomy partitions existing-object and ephemeral-transaction observation variables without inheriting platform children.
scope_notes_zh: T1569 以 service manager 实际启动攻击者程序、DLL 或命令为成立点。持久 service definition 创建、替换和隐藏归 NJT-0089，跨进程 module 和远程 transport 可共映射相邻技术。平台 manager、service type 与持久性目标不形成 Niji 子项。
scope_notes_en: T1569 is established when service managers actually start adversary programs DLLs or commands. Durable service-definition creation substitution and hiding belong to NJT-0089 while cross-process modules and remote transport may co-map adjacent techniques. Platform manager service type and persistence objective do not form Niji children.
