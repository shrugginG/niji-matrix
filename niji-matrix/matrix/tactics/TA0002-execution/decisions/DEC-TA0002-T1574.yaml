rationale_zh: 固定基线锚定操作系统、loader、服务和 runtime 执行选择劫持。FIN7/PRIVATELOG/2013 侧加载、Industroyer/ThiefQuest、Blue Mockingbird 与 AppDomainManager 活动分别直接证明搜索阴影、稳定身份完整性替换和 runtime 激活重定向，支持 high-confidence adapt。
rationale_en: The fixed baseline anchors hijacking of execution selection in operating systems loaders services and runtimes. FIN7 PRIVATELOG and a 2013 side-load Industroyer or ThiefQuest Blue Mockingbird and AppDomainManager activity directly establish search shadowing stable-identity integrity substitution and runtime activation redirection supporting high-confidence adaptation.
scope_notes_zh: 范围要求前置选择/激活状态被攻击者修改、受信 consumer 实际消费并产生执行结果。12 个 ATT&CK 子项只进入规划覆盖表，收敛为三个 Niji 变量；平台、文件格式、权限来源和功能目的不导入。
scope_notes_en: Scope requires adversary modification of prior selection or activation state actual consumption by a trusted consumer and an execution outcome. Twelve ATT&CK children remain in the planning coverage table and converge to three Niji variables without importing platform file format permission origin or function purpose.
