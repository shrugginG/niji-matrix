candidate: {source_type: attack, source_attack_id: T1609, source_attack_version: '19.1', name_en: Container Administration Command, name_zh: 容器管理命令}
decision: adapt
rationale_zh: 固定基线锚定经容器管理服务进入已运行容器执行。TeamTNT 和外部蜜罐直接证明 workload 不变而 runtime 增加恶意进程；Kubernetes audit、授权、AKS 狩猎和 Docker exec events 给出跨层残余，支持 high-confidence adapt。
rationale_en: The fixed baseline anchors execution in running containers through administration services. TeamTNT and an external honeypot directly establish an unchanged workload gaining malicious runtime processes while Kubernetes audit authorization AKS hunting and Docker exec events supply cross-plane residuals supporting high-confidence adaptation.
scope_notes_zh: 只纳入 exec/attach 类管理请求在既有容器产生执行；新部署归 T1610，应用 RCE 不经管理接口则排除。两个子项按 workload 不变和自动化身份上下文划分，后者因现场意图不足保持 medium。
scope_notes_en: Scope includes exec or attach-like management requests producing execution in an existing container. New deployments belong to T1610 and application RCE without a management interface is excluded. Children partition unchanged workload and automation-identity context with the latter remaining medium for insufficient field intent.
