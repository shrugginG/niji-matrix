decision: adapt
rationale_zh: 固定基线锚定创建容器并执行。TeamTNT 安全基础镜像后置载荷和 Aqua Portainer 近似镜像部署分别直接证明 image—runtime 分离与规范特征伪装，官方 admission/image/runtime 控制给出残余，支持 high-confidence adapt。
rationale_en: The fixed baseline anchors creation and execution of containers. TeamTNT safe-base-image late payloads and Aqua Portainer-like image deployment directly establish image-to-runtime separation and specification feature camouflage while official admission image and runtime controls supply residuals supporting high-confidence adaptation.
scope_notes_zh: 要求新容器被创建、启动并产生攻击者执行；既有容器 exec 归 T1609，内部镜像持久篡改归 NJT-0092。编排对象、平台、privileged 字段和 payload 类型不形成子项。
scope_notes_en: Scope requires a new container created started and producing adversary execution. Existing-container exec belongs to T1609 and durable internal-image tampering to NJT-0092. Orchestration object platform privileged fields and payload type do not form children.
