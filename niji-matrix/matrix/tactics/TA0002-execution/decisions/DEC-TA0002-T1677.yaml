candidate: {source_type: attack, source_attack_id: T1677, source_attack_version: '19.1', name_en: Poisoned Pipeline Execution, name_zh: 投毒流水线执行}
decision: retain
rationale_zh: 固定基线直接定义对流水线配置、被引用输入或公开贡献触发路径的投毒。SUNSPOT、XZ 与 Shai-Hulud 分别证明构建时源替换、仅发布输入触发和恶意 workflow 可在正常构建或自动化身份下执行；GitHub 官方研究又证明不可信 PR 数据能够跨 workflow 权限边界到达 runner 执行 sink。因此该父行为具备独立于供应链交付结果的 runner 侧执行对象和可验证匿迹因果，保留为 Execution 技术。
rationale_en: The fixed baseline directly defines poisoning of pipeline configuration referenced inputs or public-contribution trigger paths. SUNSPOT XZ and Shai-Hulud respectively demonstrate build-time source substitution release-only input activation and malicious workflows executing under normal build or automation identities while GitHub research shows untrusted pull-request data crossing workflow privilege boundaries to runner execution sinks. The parent therefore has a runner-side execution object and verifiable stealth causality distinct from downstream supply-chain delivery and is retained under Execution.
scope_notes_zh: 正式范围从攻击者可控的 workflow、构建输入或外部贡献进入 CI/CD 调度开始，以 runner 解释命令、脚本、测试或 action 为执行成立点。只修改下游制品而未在 runner 执行攻击者逻辑、仅窃取仓库凭据、普通开发脚本运行和利用软件部署平台在终端执行命令均不属于本对象。三个 Niji 子项按定义、间接输入与外部贡献三种因果入口划分，不继承 ATT&CK 子技术。
scope_notes_en: Formal scope begins when an adversary-controlled workflow build input or external contribution enters CI/CD scheduling and reaches execution when a runner interprets a command script test or action. Artifact-only modification without adversary logic executing on the runner repository credential theft alone ordinary developer script execution and endpoint command execution through software-deployment platforms are excluded. Three Niji children partition definition indirect-input and external-contribution causal entry and do not inherit ATT&CK sub-techniques.
