schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0063-001
parent_ref: NJT-0063
name:
  zh: 活动感知型后台传输执行
  en: Activity-Aware Background Transfer Execution
summary:
  zh: 攻击者选择 BITS 后台优先级、网络成本策略和更新式作业属性，使与执行链耦合的传输随空闲带宽推进并降低其与正常后台活动的可区分性。
  en: The adversary selects BITS background priority, network-cost policy, and update-like job properties so transfer coupled to an execution chain advances with idle bandwidth and becomes less distinguishable from normal background activity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 活动感知型后台传输执行是 BITS 后台作业执行的一种实现。攻击者不是直接以自建下载器持续占用带宽，而是为具有执行语义的 BITS 作业选择 normal、low 或其他后台优先级，并根据网络成本、代理和重试条件配置作业，使服务在前台网络负载下降或条件重新满足时推进传输；完成或错误状态随后通过通知程序或同一可证明的作业链启动攻击者代码。其直接目标是在取得载荷和触发执行的同时减少对用户前台活动的干扰，并让网络与作业外观接近更新或同步操作。
      en: Activity-Aware Background Transfer Execution is an implementation of BITS Background-Job Execution. Instead of continuously consuming bandwidth through a custom downloader, the adversary selects normal, low, or another background priority for a BITS job with execution semantics and configures network-cost, proxy, and retry conditions so the service advances transfer when foreground network load falls or conditions become available again. Transferred or error state then starts adversary code through a notification program or the same demonstrable job chain. The direct objective is to acquire a payload and trigger execution with less disruption to foreground activity while making network and job appearance resemble update or synchronization operations.
    - zh: 本子技术固定的变量是攻击者对“后台传输方式”的选择，而不是 BITS 自动感知带宽这一平台事实本身。作业必须同时具备执行关联，且优先级、成本策略、名称或时间选择应对防守观察产生可说明的影响。使用 bitsadmin、PowerShell 或 COM，只是设置同一变量的不同接口；Windows Update 默认使用 BITS、网络自然拥塞或管理员未修改默认 normal 优先级，都不能单独证明本子技术。
      en: The fixed variable is the adversary's selection of a background transfer mode, not the platform fact that BITS automatically senses bandwidth. The job must also have an execution relationship, and priority, cost policy, name, or timing selection must have a defensible effect on defender observation. Bitsadmin, PowerShell, and COM are different interfaces for setting the same variable. Windows Update's ordinary BITS use, natural congestion, or an administrator leaving the default normal priority unchanged does not independently establish this child.
stealth_characteristics:
  paragraphs:
    - zh: 活动感知型后台传输执行使恶意文件传输由 BITS 服务宿主发起，并随空闲带宽、前台网络活动和网络成本改变速率。若作业同时使用常见优先级、预配置代理和类似更新任务的显示名称，端点与网络侧看到的服务身份、低干扰节奏、队列状态和元数据都会接近合法更新器或同步程序；只依据传输速率、签名服务进程或作业名称的规则难以准确区分恶意作业。
      en: Activity-Aware Background Transfer Execution causes malicious file transfer to originate from the BITS service host and vary with idle bandwidth, foreground network activity, and network cost. If the job also uses a common priority, preconfigured proxy, and update-like display name, service identity, low-disruption cadence, queue state, and metadata observed at endpoint and network layers resemble a legitimate updater or synchronization program. Rules based only on transfer rate, a signed service process, or job name cannot classify the malicious job accurately.
    - zh: 残余线索并未消失。作业 GUID 与所有者、创建进程或 COM 客户端、优先级、URL、目标路径、通知程序、状态转换和后继代码行为仍可能偏离同类合法作业。防守方拥有按应用和用户建立的 BITS 基线，并把服务网络与作业定义及执行结果关联时，后台节奏提供的伪装会明显减弱；如果攻击者只是接受默认优先级且没有证据表明其有意利用正常外观，分类置信度应下降。
      en: Residual evidence remains. Job GUID and owner, creating process or COM client, priority, URL, destination path, notification program, state transition, and follow-on code behavior may still deviate from comparable legitimate jobs. When defenders maintain BITS baselines by application and user and join service network activity to job definition and execution outcome, disguise from background cadence weakens materially. If the adversary merely accepts a default priority and evidence does not establish deliberate use of normal appearance, classification confidence should be reduced.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入攻击者为具有执行语义的 BITS 作业选择后台优先级或成本相关属性，并使文件传输随可用带宽或允许时段推进的行为。纳入判定还需要同一作业存在 transferred 或 error 通知程序，或有明确证据把该传输与随后攻击者代码运行连接起来；优先级、代理、网络策略、显示名称和传输时间至少有一项应体现攻击者控制并改变防守观察。
      en: This child includes adversary selection of background priority or cost-related properties for a BITS job with execution semantics so file transfer advances with available bandwidth or an allowed period. Inclusion also requires a transferred- or error-state notification program in the same job or clear evidence linking the transfer to subsequent adversary code execution. At least one of priority, proxy, network policy, display name, or transfer timing must reflect adversary control and change defender observation.
    - zh: 本子技术排除没有执行结果的普通 BITS 下载或上传，排除只对自建下载器限速、由网络拥塞自然造成的低速，以及更新器、软件分发或同步程序按照既定策略运行的合法作业。它也不覆盖以跨会话等待、错误重试或重启后通知为主变量的长驻作业延迟激活；两项可以组合，但判定时必须分别证明后台外观选择和长期状态触发。
      en: This child excludes ordinary BITS download or upload without an execution outcome, throttling applied only to a custom downloader, low rate caused naturally by congestion, and legitimate updater, software-distribution, or synchronization jobs following established policy. It also excludes Long-Lived Job Deferred Activation when cross-session waiting, error retry, or post-reboot notification is the primary variable. The children may be combined, but background-appearance selection and long-lived state triggering must be established separately.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者在已经控制 Windows 用户会话或管理通道、需要取得并执行下一阶段载荷，但不希望自建下载器产生持续高带宽、独立网络进程或明显前台影响时使用本子技术。目标环境通常存在 Windows Update、终端管理或同步软件产生的大量正常 BITS 活动，攻击者可以让作业在业务时段以后台优先级缓慢推进，或等待成本和连接条件允许后完成，再由同一作业链推动代码运行。
        en: An adversary uses this child after controlling a Windows user session or management channel and needing to acquire and execute a next-stage payload without a custom downloader producing sustained high bandwidth, a distinct network process, or visible foreground impact. The target environment commonly has substantial legitimate BITS activity from Windows Update, endpoint management, or synchronization software. The adversary can let the job progress at background priority during business activity or wait for cost and connectivity conditions to permit completion before the same job chain advances code execution.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要拥有创建或修改所属用户 BITS 作业的权限，能够设置文件映射、后台优先级、代理或成本策略、通知配置和显示名称，并能容忍下载完成时间由前台流量、网络可用性和队列中更高优先级作业决定。若攻击者不能观察作业状态或保证通知程序仍可访问，低干扰传输可能以可靠性和行动时效为代价。
          en: The adversary needs permission to create or modify a BITS job owned by the relevant user and must be able to set file mappings, background priority, proxy or cost policy, notification configuration, and display name. The adversary must tolerate completion timing determined by foreground traffic, network availability, and higher-priority queued jobs. Without visibility into job state or assurance that the notification program remains accessible, low-disruption transfer trades reliability and operational timeliness for stealth.
    defender_model:
      paragraphs:
        - zh: 防守方需要取得 BITS 作业优先级、所有者、创建与修改时间、远端 URL、本地路径、代理和通知属性，并把这些字段与服务宿主网络连接及后继进程关联。检测模型应按用户、应用、资产角色、维护窗口、常见域名和目标目录建立同类作业基线，而不是把 normal 或 low 优先级本身视为恶意。缺少创建来源或通知结果时，只能确认后台传输，不能确认本子技术的有意伪装与执行耦合。
          en: The defender needs BITS job priority, owner, creation and modification times, remote URL, local path, proxy, and notification properties and must join those fields to service-host network connections and successor processes. Detection should baseline peer jobs by user, application, asset role, maintenance window, common domain, and destination directory rather than treating normal or low priority as malicious. Without creator provenance or notification outcome, the defender can establish only background transfer, not deliberate disguise and execution coupling required for this child.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 后台优先级与更新式属性模仿合法传输
      en: Background priority and update-like properties imitate legitimate transfer
    analysis:
      paragraphs:
        - zh: 攻击者通过选择后台优先级、常见代理与成本策略、更新式名称和业务相容时段，让恶意作业与合法 BITS 客户端共享服务进程、带宽调节方式、队列状态和管理元数据。传感器能够看到传输，却难以凭单一可见特征把它与 Windows Update、软件分发或同步作业区分，因而形成特征伪装。Microsoft 对 sLoad 的研究还表明，不检查 BITS 这种非常规协议的防线可能直接遗漏恶意活动。
          en: By selecting background priority, common proxy and cost policy, an update-like name, and business-compatible timing, the adversary makes the malicious job share service process, bandwidth adaptation, queue state, and management metadata with legitimate BITS clients. Sensors can see the transfer but cannot distinguish it from Windows Update, software distribution, or synchronization jobs using one visible feature, producing Feature Disguise. Microsoft's sLoad research further shows that defenses that do not inspect the unconventional BITS protocol may miss adversary activity entirely.
        - zh: Mandiant 观测到的恶意作业使用 normal 优先级和 System update 名称，证明恶意作业可以具有正常元数据外观；但该案例没有直接说明攻击者为何选择 normal，因此对主观伪装意图仍属推断。所有者 SID、创建主体、非常见 URL、用户缓存或系统目录中的目标文件、通知程序和恶意后继行为提供反证，必须联合使用。
          en: Mandiant's observed malicious job used normal priority and the name System update, demonstrating that a malicious job can present normal-looking metadata. The case does not directly state why the adversary chose normal priority, so subjective disguise intent remains inferred. Owner SID, creating principal, off-baseline URL, destination files in user cache or system directories, notification program, and malicious follow-on behavior provide counterevidence that must be evaluated together.
    evidence_refs: [REF-000135, REF-000139, REF-000141]
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 空闲带宽调节把传输分散到变化的时间窗口
      en: Idle-bandwidth adaptation disperses transfer across changing time windows
    analysis:
      paragraphs:
        - zh: 后台优先级使 BITS 随前台网络使用、连接状态和成本策略增加或降低速率；较高优先级作业还会抢占较低优先级作业。攻击者接受这种调度后，原本集中的载荷取得可能分散到多个较弱的网络片段，使短窗口流量阈值和只覆盖创建时刻的调查难以恢复完整传输—执行链，形成时空释痕。
          en: Background priority causes BITS to raise or lower transfer rate with foreground network use, connectivity, and cost policy, while higher-priority jobs preempt lower-priority work. When the adversary accepts this scheduling, otherwise concentrated payload acquisition may be distributed into several weaker network fragments. Short-window traffic thresholds and investigations limited to job creation then struggle to recover the complete transfer-execution chain, producing Spatiotemporal Trace Dilution.
        - zh: 这种时间分散受到明确限制：当客户端没有其他网络应用时，BITS 可能使用大部分可用带宽；在高网络使用期间也仍会传输少量数据，且 BITS 无法观察客户端以外链路的拥塞。因而不能预设所有后台作业都低速或隐蔽，必须以实际流量、优先级和队列竞争验证效果。
          en: This temporal distribution has explicit limits. When no other client network application is active, BITS may consume most available bandwidth; it still transfers a small amount during high use and cannot observe congestion beyond the client. Defenders therefore cannot assume every background job is low-rate or stealthy and must validate the effect using actual traffic, priority, and queue competition.
    evidence_refs: [REF-000135]
    confidence: high
