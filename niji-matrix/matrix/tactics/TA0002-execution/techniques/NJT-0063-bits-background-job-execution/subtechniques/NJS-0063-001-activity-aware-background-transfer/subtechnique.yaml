research:
  limitations:
    paragraphs:
      - zh: Microsoft 文档直接证明应用能够设置作业优先级，后台优先级按空闲带宽和网络成本推进；Microsoft sLoad 研究直接证明未检查 BITS 的防线会遗漏恶意通信和传输，Mandiant 也直接观察到 normal-priority、更新式命名的恶意通知作业。三者共同支持行为能力、观察差异和真实恶意使用，但没有来源直接陈述攻击者为了伪装而选择特定优先级，因此本子技术的意图结论保持 medium。
        en: Microsoft documentation directly establishes application control of job priority and background transfer according to idle bandwidth and network cost. Microsoft's sLoad research directly establishes that defenses not inspecting BITS can miss malicious communication and transfer, while Mandiant directly observed a normal-priority malicious notification job with update-like naming. Together they support capability, defender-observation difference, and malicious use, but no source directly states that an adversary selected a specific priority for disguise; the intent conclusion therefore remains medium confidence.
      - zh: 本子技术无法仅凭网络速率或 BITS 服务身份验证，且其效果高度依赖目标环境是否存在足够的合法 BITS 基线。若未来案例只能证明攻击者使用默认配置而不能证明其利用后台外观，应把该实现降为父技术普通实例；若获得明确的优先级选择、成本策略或时间适配证据，则可以提高置信度。
        en: This child cannot be established from network rate or BITS service identity alone, and its effect depends heavily on the target having a substantial legitimate BITS baseline. If future cases show only default configuration without deliberate use of background appearance, the implementation should be treated as an ordinary parent instance. Explicit evidence of priority selection, cost policy, or timing adaptation would support higher confidence.
