research:
  limitations:
    paragraphs:
      - zh: Microsoft 文档直接规定通知状态、CreateProcessAsUser 用户上下文、失败重试、Complete 或 Cancel 语义和默认作业寿命；UBoatRAT 与 KEGTAP 调查又直接观察到跨重启或错误触发执行，因此该子技术具有高置信度。案例主要证明成功传输通知和刻意错误通知两种实现，不能推断所有长期 BITS 作业都用于恶意重复执行。
        en: Microsoft documentation directly specifies notification states, CreateProcessAsUser user context, failure retry, Complete or Cancel semantics, and default job lifetime. The UBoatRAT and KEGTAP investigations directly observe post-reboot or error-triggered execution, supporting high confidence in this child. The cases principally establish successful-transfer notification and deliberately error-triggered notification; they do not imply that every long-lived BITS job performs malicious repeated execution.
      - zh: 正常更新、管理员恢复和不稳定网络会产生长期或错误作业，某些应用还会合法注册通知程序。判定必须证明攻击者控制程序、参数、URL 或作业终结行为，并观察恶意执行结果。服务账户不能使用命令行回调、管理员 TakeOwnership 会移除通知、策略可能提前取消作业，这些条件都会限制适用性；未来 Windows 版本改变 QMGR 或事件格式时必须重新验证检测字段。
        en: Legitimate updates, administrator recovery, and unstable networks create long-lived or errored jobs, and some applications legitimately register notification programs. Classification must establish adversary control of program, arguments, URL, or job finalization behavior and observe a malicious execution outcome. Service accounts cannot use command-line callbacks, administrator TakeOwnership removes notification, and policy may cancel the job early, all limiting applicability. Detection fields must be revalidated when future Windows versions change QMGR or event formats.
