research:
  limitations:
    paragraphs:
    - zh: 证据层级并不均衡。Microsoft 接口与生命周期文档直接证明作业优先级、异步状态、通知程序、用户上下文、重试和默认寿命；UBoatRAT 与 KEGTAP 案例直接证明状态通知和跨窗口执行，因此长驻作业延迟激活为 high。活动感知型后台传输执行由可配置优先级、空闲带宽行为、sLoad
        对未检查 BITS 防线的规避效果以及 Mandiant 的 normal-priority 恶意作业共同支持，但案例没有直接陈述攻击者选择优先级的主观目的，所以该子项和 NM-FD 只保持 medium。
      en: Evidence strength is uneven. Microsoft interface and lifecycle documentation directly establishes job priority,
        asynchronous state, notification programs, user context, retry, and default lifetime. The UBoatRAT and KEGTAP cases
        directly establish state notification and cross-window execution, so Long-Lived Job Deferred Activation is high confidence.
        Activity-Aware Background Transfer Execution is jointly supported by configurable priority, idle-bandwidth behavior,
        sLoad's evasion of defenses that do not inspect BITS, and Mandiant's normal-priority malicious job, but the cases
        do not directly state the adversary's subjective reason for selecting priority. That child and NM-FD therefore remain
        medium confidence.
    - zh: BITS 被 Windows Update、软件分发、同步程序和管理员广泛合法使用，服务宿主网络、normal 优先级、长期作业或通知配置都不能单独证明恶意。不同 Windows 版本的 QMGR 格式、Operational
        事件字段和日志保留也会改变可见性；Mandiant 指出手工数据库分析难以规模化，删除记录虽可恢复却会被覆盖。未来评审应优先寻找明确记录恶意优先级选择的案例，并验证所声明字段在目标 Windows 版本和采集产品中真实可得。
      en: Windows Update, software distribution, synchronization software, and administrators use BITS legitimately, so service-host
        network traffic, normal priority, long-lived jobs, or notification configuration alone does not establish maliciousness.
        QMGR format, Operational event fields, and retention vary across Windows versions and change visibility; Mandiant
        notes that manual database analysis does not scale and recoverable deleted records can be overwritten. Future review
        should prioritize cases that explicitly document malicious priority selection and verify that claimed fields are actually
        available in the target Windows version and collection product.
