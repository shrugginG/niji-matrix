schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0064-001
parent_ref: NJT-0064
name: {zh: 管理面—来宾痕迹分离执行, en: Control-Plane-to-Guest Trace-Separated Execution}
summary: {zh: 攻击者让远端云主体与来宾执行结果分别落在控制面和端点日志，使任一单一观察域都缺少完整请求—结果因果。, en: Adversaries place remote cloud principal and guest execution outcome in control-plane and endpoint logs respectively so either single observation domain lacks complete request-to-outcome causality.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 管理面—来宾痕迹分离执行固定“跨层证据位置”变量：经授权云请求由平台转交常驻代理，远端主体、角色和请求只在控制面完整可见，代理派生的命令、脚本和结果只在来宾侧完整可见。直接对象不是日志缺失本身，而是攻击者选择该通道后，请求者与结果被系统设计分离。
    en: Control-Plane-to-Guest Trace-Separated Execution fixes a cross-plane evidence-location variable. An authorized cloud request is handed to a resident agent; remote principal role and request are complete only in control plane, while agent-descended command script and outcome are complete only in the guest. The object is not missing logs by itself but the designed separation of requester and outcome after the adversary chooses this channel.
  - zh: 控制面和来宾都可能保留丰富记录，仍可满足本子技术；判定取决于单一常规视角无法独立恢复因果，而非要求绝对无日志。若同一事件原生携带不可伪造主体、完整脚本和结果并被统一采集，则该变量的匿迹收益被显著削弱。
    en: Both planes may retain rich records and the child can still apply; the criterion is that one ordinary vantage cannot independently recover causality, not absolute absence of logs. When one event natively carries an unforgeable principal, complete script, and outcome into unified collection, the stealth benefit is materially reduced.
stealth_characteristics:
  paragraphs:
  - zh: 管理面—来宾痕迹分离执行使云团队看到合法 API 成功，端点团队看到 VM Agent、SSM Agent 或等价服务派生进程，却都缺少对方身份和语义。NOBELIUM 检测专门关联 AzureActivity 与 MDE，说明实际产品视角需要跨源补链。request/correlation ID、实例 ID、代理时间、脚本哈希和结果是残余；输出截断、可选日志或跨租户字段不一致会扩大断点。
    en: Control-Plane-to-Guest Trace-Separated Execution leaves cloud teams with a legitimate API success and endpoint teams with a VM Agent, SSM Agent, or equivalent descendant, each lacking the other's identity or semantics. NOBELIUM detection explicitly joins AzureActivity and MDE, demonstrating a real cross-source requirement. Request or correlation ID, instance ID, agent time, script hash, and outcome are residuals; truncated output, optional logging, or inconsistent cross-tenant fields widen the break.
scope_boundary_definition:
  paragraphs:
  - zh: 必须存在云命令服务、具体目标实例、来宾代理结果，以及控制面和来宾证据无法由单一默认视角连接的事实。只因组织团队不沟通但事件本身已有完整关联字段，不足以证明强匿迹；只创建未执行命令也不成立。维护上下文是否正常不影响本项，若独立效果来自基线相似则归 NJS-0064-002。
    en: Scope requires a cloud command service, concrete target instance, guest-agent outcome, and evidence that control and guest records are not connected by one default vantage. Organizational silos alone are insufficient when events already carry complete correlation, and an unexecuted command does not qualify. Whether maintenance context looks normal does not affect this child; an independent effect from baseline similarity belongs to NJS-0064-002.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 适用于云安全团队集中处理 Activity Log/CloudTrail，而 EDR 团队只观察来宾进程，或命令服务输出截断、代理日志本地保存、跨租户委托使主体字段需要转换的环境。攻击者利用通道执行发现、账户、载荷或配置命令。, en: This applies where cloud teams handle Activity Log or CloudTrail while EDR teams observe only guest processes where command output is truncated agent logs remain local or delegated cross-tenant identity needs translation. The adversary uses the channel for discovery account payload or configuration commands.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 攻击者需拥有命令动作权限和可用代理，并可选择缺少统一关联的账号、区域或目标；稳定 request ID、强制转发代理日志和脚本哈希会缩小断点。, en: The adversary needs command-action authority and a usable agent and can choose accounts regions or targets lacking unified correlation. Stable request IDs mandatory agent-log forwarding and script hashes narrow the break.}]}
    defender_model: {paragraphs: [{zh: 防守方需规范化租户/账号、主体、角色、实例和时间，把请求 ID 或脚本哈希传递到端点；缺少直接 ID 时允许实例—代理—窄时间窗关联但降低置信度，并保留失败与未执行状态。, en: Defenders normalize tenant or account principal role instance and time and propagate request ID or script hash to the endpoint. Without a direct ID use instance-agent-time joins at reduced confidence and retain failed and unexecuted states.}]}
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 请求者与执行语义落在彼此分离的有效监控面, en: Requester and execution semantics fall into separated effective monitoring planes}
  analysis: {paragraphs: [{zh: 平台设计使控制面保留远端授权语义、来宾保留本地结果，单点可见记录却不能理解完整行为，符合行为透明。NOBELIUM 现场关联和 Azure/AWS 官方字段直接支持 high；统一 request—instance—agent—outcome 谱系可反证或削弱。, en: Platform design leaves remote authorization semantics in control plane and local outcome in the guest so point records are visible without complete behavioral understanding consistent with Behavioral Transparency. NOBELIUM field correlation and official Azure or AWS fields support high confidence; unified request-instance-agent-outcome lineage can disconfirm or weaken it.}]}
  evidence_refs: [REF-000110, REF-000204, REF-000205, REF-000206]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000079]}, mitigations: {coverage: available, mitigation_refs: [MIT-000079]}}
evidence: {claim_refs: [CLM-000252, CLM-000395, CLM-000399], case_refs: [CASE-000069], reference_refs: [REF-000110, REF-000204, REF-000205, REF-000206]}
research:
  limitations: {paragraphs: [{zh: Azure 案例直接证明跨源需求，AWS 只以官方等价结构推广。不同服务可能把输出、脚本或请求 ID 写入不同位置；本子项不声称每个平台默认都存在同等缺口，部署前需受控命令验证实际字段和保留。, en: The Azure incident directly establishes cross-source requirements while AWS is generalized only through official equivalent structure. Services place output script and request IDs differently; this child does not claim an equal default gap on every platform and requires controlled-command validation of local fields and retention.}]}
