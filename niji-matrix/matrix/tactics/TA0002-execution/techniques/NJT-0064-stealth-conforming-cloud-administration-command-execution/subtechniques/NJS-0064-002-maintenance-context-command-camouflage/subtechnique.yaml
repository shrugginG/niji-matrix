schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0064-002
parent_ref: NJT-0064
name: {zh: 维护情境命令伪装, en: Maintenance-Context Command Camouflage}
summary: {zh: 攻击者让云命令的主体、动作、脚本来源、时段与目标集合接近批准诊断、配置或部署任务，使管理服务和代理外观失去区分力。, en: Adversaries align cloud-command principal action script origin time and target set with approved diagnostics configuration or deployment so management-service and agent appearance loses discrimination.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 维护情境命令伪装固定“管理上下文相似度”变量：攻击者不只调用合法命令服务，还主动选择与真实补丁、诊断、安装或应急任务相近的主体、文档/扩展、脚本仓库、时间、标签目标和命令形态，使恶意动作进入批准基线。直接执行仍由代理完成，独立匿迹效果来自恶意与合法管理事件共享分类特征。
    en: Maintenance-Context Command Camouflage fixes a management-context-similarity variable. Beyond calling a legitimate service, the adversary chooses principal, document or extension, script repository, time, tag-selected targets, and command shape resembling real patching diagnostics installation or emergency tasks so malicious action enters the approved baseline. The agent still executes directly; the independent stealth effect comes from shared classification features.
  - zh: 单纯使用 Run Command 或 VM Agent 不足以成立；必须证明攻击者控制至少一个上下文变量并与本地允许模式形成有意义重合。跨层日志是否关联不影响本项，因此即使 NJS-0064-001 已被统一遥测修复，内容与审批相似仍可能继续造成伪装。
    en: Merely using Run Command or a VM Agent is insufficient. Evidence must show adversary control of at least one contextual variable and meaningful overlap with a local allowed pattern. Cross-plane log correlation does not determine this child, so content and approval similarity can continue to camouflage after NJS-0064-001 is repaired by unified telemetry.
stealth_characteristics:
  paragraphs:
  - zh: 维护情境命令伪装把恶意执行放入高容量且高权限的管理基线。Azure LoLBins 调查中，Custom Script Extension 本用于软件安装和配置，却被用于从公共仓库取得挖矿脚本；跨客户相同仓库和短时集中活动才把它与合法扩展区分。残余包括审批、调用频率、目标标签解析、脚本/文档版本、仓库信誉、输出和后继行为。
    en: Maintenance-Context Command Camouflage places malicious execution in a high-volume high-privilege management baseline. In the Azure LoLBins investigation Custom Script Extension normally used for installation and configuration retrieved a mining script; a common repository across customers and clustered timing distinguished it. Residuals include approval invocation frequency resolved target tags script or document version repository reputation output and successor behavior.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明上下文重合是攻击者选择且会削弱组织现有分类。由罕见个人在异常区域向生产全集群下发随机脚本通常是父技术但不是本子项；由批准自动化身份使用被篡改脚本也可满足。若只有控制面与来宾分离而上下文明显异常，则只归 NJS-0064-001。
    en: Evidence must show context overlap selected by the adversary and capable of weakening local classification. A rare person dispatching a random script from an anomalous region to all production assets is usually the parent but not this child; an approved automation identity using a tampered script can qualify. When only control and guest evidence are separated but context is clearly abnormal, classify only NJS-0064-001.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者取得长期服务主体、委托管理员或运维账户后，复用常见 SSM Document、Azure 扩展、脚本仓库、资源标签和维护窗口，向与真实任务相似的实例集合执行载荷或配置命令。, en: After obtaining a durable service principal delegated administrator or operations account an adversary reuses common SSM Documents Azure extensions script repositories resource tags and maintenance windows to execute payload or configuration commands against an instance set resembling a real task.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 攻击者需了解审批、资产标签、命令文档、脚本版本和时序，并控制相应身份或内容供应点。每次审批、不可变版本、JIT 权限和独立结果验证会提高复制成本。, en: The adversary needs knowledge of approvals asset tags command documents script versions and timing and control of a corresponding identity or content source. Per-run approval immutable versions JIT authority and independent outcome verification raise the cost.}]}
    defender_model: {paragraphs: [{zh: 防守方需维护主体—文档—脚本哈希—目标—窗口—变更单联合基线，并检查实际解析目标和后继结果；只允许服务名、代理或仓库域名会被借用。, en: Defenders maintain a joint principal-document-script-hash-target-window-change-record baseline and inspect resolved targets and outcomes; allowing only service name agent or repository domain is borrowable.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 恶意管理任务共享批准维护的可见特征, en: A malicious management task shares visible features of approved maintenance}
  analysis: {paragraphs: [{zh: 攻击者复制管理事件的主体、服务、文档、时段或目标特征，使单点分类把恶意与合法任务放入同组，形成特征伪装。Azure 跨客户挖矿提供直接实例，NOBELIUM 提供委托身份实例；脚本内容、审批、目标和结果差异仍可反证。, en: The adversary reproduces principal service document timing or target features of management events so point classification groups malicious and legitimate tasks together producing Feature Disguise. Cross-customer Azure mining supplies a direct instance and NOBELIUM supplies delegated identity; script content approval target and outcome differences remain disconfirming.}]}
  evidence_refs: [REF-000110, REF-000203, REF-000207]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000079]}, mitigations: {coverage: available, mitigation_refs: [MIT-000079]}}
evidence: {claim_refs: [CLM-000253, CLM-000396, CLM-000400], case_refs: [CASE-000069, CASE-000070], reference_refs: [REF-000110, REF-000203, REF-000207]}
research:
  limitations: {paragraphs: [{zh: 两个案例均来自 Azure，且公开资料不能证明攻击者总是有意匹配全部维护维度；high 依赖直接双用途执行和报告的异常差分，不表示任何服务主体调用均为伪装。合法紧急响应也可缺少变更单，需保留事后确认路径。, en: Both incidents come from Azure and public reporting cannot show adversaries always match every maintenance dimension. High confidence rests on directly observed dual-use execution and reported anomaly differentials and does not make every service-principal invocation camouflage. Legitimate emergency response may lack a change record and needs a post-hoc confirmation path.}]}
