schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0067-002
parent_ref: NJT-0067
name: {zh: 工作负载规范情境伪装, en: Workload-Specification Context Camouflage}
summary: {zh: 攻击者让 image reference、workload 名称、namespace、labels、service account 或资源外观接近批准应用，使规范审查难以区分真实目的。, en: Adversaries align image reference workload name namespace labels service account or resource appearance with approved applications so specification review struggles to distinguish purpose.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 工作负载规范情境伪装固定“可见部署元数据与真实目的不一致”变量：攻击者在新容器规范中选择与合法软件、团队和环境相似的 image reference、名称、namespace、labels/annotations、owner、service account 或资源配置，使控制面分类把恶意 workload 归入熟悉应用。直接结果仍是新容器执行，独立匿迹效果来自规范特征借用。
    en: Workload-Specification Context Camouflage fixes mismatch between visible deployment metadata and true purpose. In a new container specification the adversary chooses image reference name namespace labels or annotations owner service account or resource profile resembling legitimate software teams and environments so control-plane classification groups a malicious workload with a familiar application. The direct outcome remains new-container execution while the independent stealth effect comes from borrowed specification features.
  - zh: 不要求所有字段都复制，至少一个本地用于信任/降噪的分类字段被攻击者有意借用且会改变判断。若只有批准基础镜像但恶意内容在启动后才取得，归 NJS-0067-001；两者可以共存。privileged 或 hostPath 等明显高风险字段通常削弱伪装而非定义本项。
    en: Not every field must be copied. At least one local classification field used for trust or suppression must be deliberately borrowed and change judgment. If only an approved base image is used and malicious content arrives after start, classification belongs to NJS-0067-001; both can coexist. Overt high-risk fields such as privileged or hostPath usually weaken camouflage rather than define it.
stealth_characteristics:
  paragraphs:
  - zh: 工作负载规范情境伪装利用 GitOps、SOC 和 admission 常按 image/name/namespace/label/identity 判断所有权与风险。Aqua 直接发现 TeamTNT 使用 `portaienr` 近似 Portainer 的账户与镜像外观，并经暴露 Docker API 部署运行；熟悉引用降低初始怀疑，而细微拼写、仓库 owner、digest、entrypoint、嵌入工具和 C2 暴露真实目的。
    en: Workload-Specification Context Camouflage exploits GitOps SOC and admission reliance on image name namespace label or identity for ownership and risk. Aqua directly found TeamTNT use `portaienr` as a Portainer-like account and image appearance and deploy it through an exposed Docker API. Familiar reference reduced initial suspicion while spelling repository owner digest entrypoint embedded tools and command and control exposed true purpose.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明攻击者控制规范字段、该字段与本地批准上下文相似并会影响防守分类，同时新容器实际执行。名称碰巧常见或运行在 default namespace 不足；应比较创建主体、仓库 owner、digest、模板来源、owner reference、service account、资源和首行为。只篡改内部 image tag 而规范不变的长期复现归 NJT-0092。
    en: Evidence must show adversary control of a specification field similarity to local approved context effect on defender classification and actual new-container execution. A coincidentally common name or default namespace is insufficient. Compare creator repository owner digest template origin owner reference service account resources and first action. Durable recurrence from tampering with an internal image tag while specification remains unchanged belongs to NJT-0092.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者掌握集群/daemon create、Docker API 或部署流水线后，复制系统组件、监控代理、应用 sidecar 或 Portainer 等常见软件的可见规范，在高噪声 namespace 或发布窗口创建新 workload，再执行矿工、后门或扫描器。, en: After controlling cluster or daemon create Docker API or a deployment pipeline an adversary copies visible specification of a system component monitoring agent application sidecar or familiar software such as Portainer creates a workload in a noisy namespace or release window and runs a miner backdoor or scanner.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要了解命名、仓库、labels、service accounts、owner 和资源基线，并能创建对象。不可变模板、GitOps 签名、仓库身份验证、准入差分和首行为监控增加成本；复制太多字段可能触发冲突或策略失败。, en: Requires knowledge of naming repositories labels service accounts owners and resource baselines plus create authority. Immutable templates signed GitOps repository identity validation admission diff and first-action monitoring raise cost. Copying too many fields can cause conflicts or policy failures.}]}
    defender_model: {paragraphs: [{zh: 需按批准 template/commit、创建主体与 digest 验证完整规范，检查近似名称和跨 namespace/owner 异常，并把首个 runtime 行为反馈到部署判断；不能仅凭 label 或常见镜像域名降噪。, en: Defenders validate the complete specification against approved template or commit creator and digest inspect lookalike names and cross-namespace or owner anomalies and feed first runtime behavior back into deployment judgment. Labels or a familiar image domain alone must not suppress.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 恶意部署借用批准应用的规范分类特征, en: A malicious deployment borrows specification-classification features of an approved application}
  analysis: {paragraphs: [{zh: 相似 image reference、名称和上下文字段使恶意与合法 workload 在规范视角共享特征，形成特征伪装。`portaienr` 现场归因直接证明 image/software 外观借用，支持 high；创建者、owner、digest、entrypoint、工具和首行为仍可反证。对其他字段的推广需本地基线验证。, en: Similar image reference name and context fields make malicious and legitimate workloads share features in specification view producing Feature Disguise. Field attribution of `portaienr` directly establishes image or software appearance borrowing supporting high confidence; creator owner digest entrypoint tools and first behavior remain disconfirming. Extension to other fields requires local baseline validation.}]}
  evidence_refs: [REF-000221]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000082]}, mitigations: {coverage: available, mitigation_refs: [MIT-000082]}}
evidence: {claim_refs: [CLM-000262, CLM-000413, CLM-000417], case_refs: [CASE-000076], reference_refs: [REF-000221]}
research:
  limitations: {paragraphs: [{zh: 直接案例最强地支持 image reference 与软件名称相似；namespace、labels、service account 和资源配置属于同一可见规范变量的分析推广，不能宣称均被该案例观察。组织若不把这些字段用于信任，攻击者复制它们也不产生本子项匿迹效果。, en: Direct evidence most strongly supports image-reference and software-name similarity. Namespace labels service account and resource profile are analytic extensions of the same visible-specification variable and were not all observed in the case. If an organization does not use a field for trust copying it does not create this child's stealth effect.}]}
