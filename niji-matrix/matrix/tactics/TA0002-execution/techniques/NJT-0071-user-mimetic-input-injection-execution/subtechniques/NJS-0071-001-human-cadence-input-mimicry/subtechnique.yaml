schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0071-001
parent_ref: NJT-0071
name: {zh: 人类节奏输入拟态, en: Human-Cadence Input Mimicry}
summary: {zh: 攻击者控制合成输入的间隔、速度和随机变化以接近人类节奏，削弱依赖机器高速或固定规则性的检测。, en: Adversaries control synthetic-input intervals speed and random variation toward human cadence weakening detection based on machine speed or fixed regularity.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 人类节奏输入拟态固定“输入事件时间分布”变量。攻击者在软件注入或 HID 脚本中插入 delay、jitter、停顿和不规则间隔，使按键/点击不再以极高且恒定速率出现，并可匹配用户或人群的 hold/flight-time 范围。直接目标仍是由合成输入触发 Execution，独立匿迹效果是速度/规则性分类器难以区分机器来源。
    en: Human-Cadence Input Mimicry fixes the time distribution of input events. The adversary inserts delays jitter pauses and irregular intervals into software injection or HID scripts so keys or clicks no longer arrive at a very high constant rate and can approach user or population hold or flight times. The direct objective remains Execution from synthetic input while the independent stealth effect is reduced discrimination by speed or regularity classifiers.
  - zh: 普通脚本因系统负载变慢不属于本项，必须有攻击者可控时序和改变检测的意图/对抗模型。当前证据证明随机化/减速能力与阈值弱点，但未直接观察野外攻击者使用人类 cadence，因此维持 medium；若未来无更强证据应合并父级。
    en: A script slowed by system load does not qualify and requires adversary-controlled timing plus intent or an adversarial model changing detection. Current evidence establishes randomization or slowdown capability and threshold weakness but not a field adversary using human cadence, so confidence remains medium and the child should merge into the parent if stronger evidence does not emerge.
stealth_characteristics:
  paragraphs:
  - zh: 人类节奏输入拟态减少“数毫秒连续按键”和固定周期等 BadUSB/automation 高信号，使 timing-only 检测更接近正常用户分布。QUACK 明确建模攻击者完全控制 timing、减速与随机延迟，并指出简单启发式可被规避；UKIP 说明攻击者若减速可能更易被用户看见，形成速度—可见性权衡。设备/API 来源、注入标志、活动 session、序列语义和后继 shell/network 仍是残余。
    en: Human-Cadence Input Mimicry removes high-signal millisecond key bursts and fixed periodicity of BadUSB or automation and moves timing-only detection toward normal-user distributions. QUACK explicitly models full attacker control of timing slowdown and random delays and simple heuristics being evadable. UKIP notes slowdown may make activity more visible to the user, creating a speed-to-visibility tradeoff. Device or API origin injected flags active session sequence semantics and successor shell or network remain residuals.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明合成输入、可控的非机器化时间策略、目标应用接受事件并产生 Execution，以及 timing 变化会削弱实际检测。仅慢速键入、用户打字、远程网络延迟或少量事件不足。按软件/HID 来源不拆分；若核心差异是 HID 设备身份归 NJS-0071-003，若核心差异是等待活动窗口归 NJS-0071-002。
    en: Evidence must show synthetic input a controllable nonmachine timing strategy acceptance by the target application and Execution plus timing that weakens actual detection. Slow typing user input remote latency or a few events alone is insufficient. Software versus HID origin does not partition this child. Device identity belongs to NJS-0071-003 and waiting for an active window to NJS-0071-002.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者预期端点/USB 防护按固定字符数窗口和最大速度拦截时，在 Rubber Ducky/BadUSB 或 GUI automation 中随机化每键延迟、加入较长停顿，再输入较短高价值命令；适用于攻击者能容忍更长执行和用户可能观察屏幕的场景。, en: When endpoint or USB protection blocks fixed character windows and maximum speed the adversary randomizes per-key delays and inserts longer pauses in Rubber Ducky BadUSB or GUI automation before typing a short high-value command. This suits adversaries tolerating longer execution and possible user screen observation.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要完全控制事件时间并有足够稳定窗口，了解阈值或采样人类分布；减速增加用户干扰、焦点变化和会话锁定风险。多维 timing 模型、来源信号和结果关联会限制。, en: Requires full event-timing control a sufficiently stable window and knowledge of thresholds or sampled human distributions. Slowdown increases user interference focus change and session lock risks. Multidimensional timing models origin signals and outcome correlation constrain it.}]}
    defender_model: {paragraphs: [{zh: 防守方只保存匿名化 hold/flight-time、窗口统计和 session，不需完整按键正文，并结合 API/HID 来源、注入标志、新设备和后继进程。固定速度阈值是被建模的薄弱防守；多样化生成训练和上下文关联提高稳健性。, en: Defenders retain anonymized hold or flight time window statistics and session without full key content and combine API or HID origin injected flags new devices and successor processes. Fixed speed thresholds are the modeled weak defense; diverse generation training and context joins improve robustness.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 合成输入复制人类按键时间分布特征, en: Synthetic input copies human keystroke timing-distribution features}
  analysis: {paragraphs: [{zh: 减速与随机化使机器事件共享人类 timing 特征，削弱简单分类并形成特征伪装。QUACK/UKIP 证明变量可控和防守差异但无野外意图，故 medium；来源、context、语义和结果联合可反证。, en: Slowdown and randomization make machine events share human timing features weakening simple classification and producing Feature Disguise. QUACK and UKIP establish controllability and defensive difference but not field intent so confidence is medium. Origin context semantics and outcomes together disconfirm it.}]}
  evidence_refs: [REF-000247, REF-000248, REF-000250]
  confidence: medium
defense: {detections: {coverage: available, strategy_refs: [DET-000086]}, mitigations: {coverage: available, mitigation_refs: [MIT-000087]}}
evidence: {claim_refs: [CLM-000271, CLM-000444], case_refs: [], reference_refs: [REF-000247, REF-000248, REF-000250]}
research:
  limitations: {paragraphs: [{zh: 本项没有合格野外 Case，formal/medium 依据是对抗研究直接证明攻击者 timing 控制及简单阈值规避。若后续评审要求现场意图或研究无法复现，应转 deferred/合并；当前不得将慢速事件本身作为攻击证据。, en: This child has no qualifying field case and formal or medium status rests on adversarial research directly establishing timing control and simple-threshold evasion. If later review requires field intent or results cannot reproduce it should become deferred or merge. Slow events themselves are not attack evidence.}]}
