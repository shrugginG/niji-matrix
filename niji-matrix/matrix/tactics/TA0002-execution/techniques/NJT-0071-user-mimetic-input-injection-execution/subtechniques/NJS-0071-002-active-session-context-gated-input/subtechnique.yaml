schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0071-002
parent_ref: NJT-0071
name: {zh: 活动会话情境门控输入, en: Active-Session Context-Gated Input}
summary: {zh: 攻击者等到目标窗口、URL、交易步骤与真实用户会话处于活动/焦点状态后才注入输入，使动作继承当前交互因果。, en: Adversaries wait until a target window URL transaction step and real user session are active or focused before injecting input so actions inherit current interaction causality.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 活动会话情境门控输入固定“注入激活条件是实时用户/应用上下文”变量。攻击者持续观察 window message、active/focused window、URL/title、DOM/transaction step、登录/解锁或 user idle 状态，只在目标界面和真实会话满足时向地址栏、控制台、按钮或输入框发送快捷键、paste、点击和确认。直接目标是让恶意动作出现在合法交互序列内。
    en: Active-Session Context-Gated Input fixes real-time user or application context as the injection condition. The adversary monitors window messages active or focused window URL or title DOM or transaction step logon or unlock and user-idle state and only when target UI and a real session match sends shortcuts paste clicks and confirmation to an address bar console button or field. Its direct objective is malicious action inside a legitimate interaction sequence.
  - zh: 任意向后台窗口发送输入不满足本项；必须有监控—条件—注入关系。输入速度可以机器化，来源可以软件或 HID，因此与 cadence/外设子项独立。若用户本人按攻击者文字指示输入但工具未合成事件，归用户执行。
    en: Arbitrary input to a background window does not qualify and needs a monitor-condition-injection relation. Input can be machine-speed and software or HID originated, independent from cadence or peripheral children. If the user personally follows attacker text without synthesized events, classification belongs to User Execution.
stealth_characteristics:
  paragraphs:
  - zh: 活动会话情境门控输入使恶意按键与真实登录、焦点窗口、银行交易和用户浏览时序重合，应用日志只见当前用户执行界面动作。BackSwap 先从窗口消息/URL 识别银行页面，再打开开发者控制台、粘贴和执行银行特定 JavaScript，直接证明变量。监控 hook、active window 查询、clipboard、LLKHF_INJECTED、输入/焦点序列和后继 DOM/network 仍是残余；无活动用户或受保护 desktop 会限制。
    en: Active-Session Context-Gated Input aligns malicious keys with real logon focus banking transaction and browsing timing so application logs show the current user performing UI actions. BackSwap first identified banking pages from window messages or URLs and then opened developer tools pasted and executed bank-specific JavaScript, directly establishing the variable. Monitoring hooks active-window queries clipboard LLKHF_INJECTED input or focus sequences and later DOM or network remain residuals. No active user or a protected desktop constrains it.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明攻击者检测特定会话/window/URL/交易/焦点并在条件满足后生成输入和执行结果。注入恰好发生在用户登录时不足，正常自动填充/辅助功能/远程支持也会 context-aware；需 injector、条件和结果。活动 context 是变量，按浏览器/银行/GUI 不拆分。
    en: Evidence must show adversary detection of a specific session window URL transaction or focus followed by generated input and execution outcome. Injection coincidentally during logon is insufficient. Autofill assistive technology and remote support are also context-aware and require injector condition and outcome. Active context is the variable and browser bank or GUI does not partition it.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 已驻留木马或远程工具在用户登录后监控浏览器/业务应用，当目标 URL、付款表单、管理员 console 或 focused window 出现时，短暂注入快捷键与命令并恢复界面，减少后台失败和用户察觉。, en: Resident malware or remote tools monitor browsers or business applications after logon and when a target URL payment form administrator console or focused window appears briefly inject shortcuts and commands and restore the UI reducing background failures and user suspicion.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要目标 desktop/session 权限、可靠窗口/URL/DOM 状态、键盘 layout 与焦点控制，并避免用户同时输入。UIPI、secure desktop、锁屏、浏览器限制、剪贴板保护和随机 UI 会限制；上下文等待增加驻留时间。, en: Requires target desktop or session authority reliable window URL or DOM state keyboard layout and focus control and avoidance of simultaneous user input. UIPI secure desktop lock screen browser restrictions clipboard protection and UI variation constrain it while waiting increases dwell time.}]}
    defender_model: {paragraphs: [{zh: 需关联 injector、window/query hook、active session/focus、clipboard 与输入事件和应用/进程结果；仅看登录用户或应用动作会误归因。应保存 context ID 与事件摘要，不需记录敏感业务全文。, en: Defenders join injector window or query hooks active session or focus clipboard input events and application or process outcomes. Logged-in user or application action alone misattributes provenance. Preserve context IDs and event digests without sensitive business text.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 合成输入借用真实活动会话和焦点应用上下文, en: Synthetic input borrows a real active-session and focused-application context}
  analysis: {paragraphs: [{zh: 条件门控让恶意动作共享用户当前 session/window/transaction 特征，单点应用日志难区分并形成特征伪装。BackSwap 直接支持 high；monitor—context—input—outcome 链可反证。, en: Context gating makes malicious actions share the user's current session window and transaction features weakening point application logs and producing Feature Disguise. BackSwap directly supports high confidence; monitor-context-input-outcome lineage disconfirms it.}]}
  evidence_refs: [REF-000245, REF-000249]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000086]}, mitigations: {coverage: available, mitigation_refs: [MIT-000087]}}
evidence: {claim_refs: [CLM-000272, CLM-000445, CLM-000449], case_refs: [CASE-000085], reference_refs: [REF-000245, REF-000249, REF-000251]}
research:
  limitations: {paragraphs: [{zh: 直接案例为 BackSwap 银行浏览器活动，其他 GUI/session 只按等价 context-gated input 因果推广。合法自动化和辅助功能也等待焦点，必须证明攻击者控制 injector 与恶意结果；输入发生在活动会话不等于用户发起。, en: The direct case is BackSwap banking-browser activity and other GUI or session contexts generalize only through equivalent context-gated-input causality. Legitimate automation and assistive technology also wait for focus and require adversary-controlled injector and malicious outcome. Input in an active session does not mean user initiation.}]}
