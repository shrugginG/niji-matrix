schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0071-003
parent_ref: NJT-0071
name: {zh: 外设来源用户输入冒充, en: Peripheral-Origin User-Input Impersonation}
summary: {zh: 攻击者让恶意 USB/HID 设备枚举为标准键盘或鼠标并从硬件输入栈注入事件，使 OS 将其视为外设用户输入。, en: Adversaries make a malicious USB or HID device enumerate as a standard keyboard or mouse and inject events through the hardware input stack so the OS treats them as peripheral user input.}
aliases: [BadUSB Keystroke Injection, Malicious HID]
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 外设来源用户输入冒充固定“输入事件从设备/HID 栈出现而非软件 injector API”变量。攻击者修改 USB 固件或使用 Rubber Ducky/BadUSB/伪装线缆等设备，使其向主机声明通用键盘/鼠标接口并发送预编程或远程触发的按键、点击和快捷键；OS 加载标准 HID driver 后把事件送给当前用户 session，进而启动 Run、shell、PowerShell 或应用动作。
    en: Peripheral-Origin User-Input Impersonation fixes input events appearing from the device or HID stack rather than a software injector API. An adversary modifies USB firmware or uses Rubber Ducky BadUSB disguised cables or equivalent devices that declare a generic keyboard or mouse interface and send preprogrammed or remotely triggered keys clicks and shortcuts. After the OS loads a standard HID driver events reach the current user session and launch Run shell PowerShell or application actions.
  - zh: “外设来源”不等于所有恶意 USB：仅存储载荷、网卡或固件攻击但不注入输入归其他技术。标准键盘被真实用户操作不属于本项；设备必须由攻击者自动生成输入。节奏和活动 context 可作为附加子项，但硬件来源是独立防守边界。
    en: Peripheral origin does not mean every malicious USB. Storage payload network adapter or firmware attacks without input injection belong elsewhere. A standard keyboard operated by the user is outside this child and the device must automatically generate input under adversary control. Cadence and active context can be additional children but hardware origin is an independent defensive boundary.
stealth_characteristics:
  paragraphs:
  - zh: 外设来源用户输入冒充借用 OS 对键盘/鼠标即用户意图的默认信任，通常没有 SendInput 调用、软件 injector 进程或 LLKHF_INJECTED 标志。FIN7 邮寄的 BadUSB 设备枚举为键盘并注入 Win+R/PowerShell 下载执行，直接证明来源替代。PnP/USB connect、VID/PID/serial/interface、driver load、首次设备、无用户在场、按键突发及紧邻 shell/network 仍是残余；USB Restricted Mode、设备 allowlist 和锁屏会限制。
    en: Peripheral-Origin User-Input Impersonation borrows the OS default trust that keyboard or mouse input expresses user intent and can lack a SendInput call software injector process or LLKHF_INJECTED flag. FIN7 mailed BadUSB devices that enumerated as keyboards and injected Win+R and PowerShell for download and execution, directly establishing provenance substitution. PnP or USB connect VID PID serial or interface driver load first-seen device absent user burst and proximate shell or network remain residuals. USB Restricted Mode device allowlists and lock screen constrain it.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明设备新建/呈现 HID 输入接口、攻击者自动事件进入 session 并产生 Execution；仅 USB 插入、未知 VID/PID、键盘输入或 PowerShell 不足。合法新键盘、KVM、条码枪、辅助设备和宏键盘同形，需设备批准、用户在场与行为结果。按品牌/接口速度/payload 不拆分。
    en: Evidence must show a device creating or presenting an HID input interface attacker-automated events entering a session and an Execution outcome. USB insertion unknown VID or PID keyboard input or PowerShell alone is insufficient. Legitimate new keyboards KVMs barcode scanners assistive devices and macro keyboards share the shape and require device approval user presence and behavior outcome. Brand interface speed and payload do not partition the child.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者通过邮寄诱饵、供应链、现场接入或伪装线缆把 HID 接入解锁主机，自动打开 Run/terminal，输入短 PowerShell/shell 下载命令并确认；可在数秒内取得初始 Execution 而传统 AV 看不到单独 USB 存储文件。, en: Through mailed lures supply chain onsite access or disguised cables an adversary attaches an HID to an unlocked host automatically opens Run or terminal types a short PowerShell or shell download command and confirms it. Initial Execution can occur in seconds without a separate USB storage file for traditional antivirus.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要设备到达并接入可用/解锁主机、兼容 HID 固件、键盘 layout 与可靠时序；焦点、用户输入、锁屏、UAC/UIPI、网络与设备策略可中断。伪装/邮寄还需社会工程或物理渠道。, en: Requires delivery and attachment to an available or unlocked host compatible HID firmware keyboard layout and reliable timing. Focus user input lock screen UAC or UIPI network and device policy can interrupt it. Disguise or mailing also needs social engineering or physical access.}]}
    defender_model: {paragraphs: [{zh: 需关联 USB/PnP/driver/interface、设备首次/批准、锁屏与用户在场、输入 timing、Run/shell/PowerShell 与网络/文件。软件注入标志缺失不能视为真实用户；应区分存储和 HID interfaces，并保留设备序列或可用硬件身份。, en: Defenders join USB PnP driver or interface first-seen or approved device lock and user presence input timing Run shell or PowerShell network and file. Absence of software-injection flags must not imply real user. Distinguish storage and HID interfaces and retain device serial or available hardware identity.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 恶意设备借用标准 HID 与物理键盘来源特征, en: A malicious device borrows standard-HID and physical-keyboard provenance features}
  analysis: {paragraphs: [{zh: 设备以普通键盘接口进入受信输入栈，恶意事件与真实外设共享 driver/interface 来源，形成特征伪装。FIN7 FBI 案例直接支持 high；PnP/device—input—process—network 链可反证。, en: The device enters the trusted input stack through an ordinary keyboard interface so malicious events share driver or interface provenance with real peripherals producing Feature Disguise. The FBI FIN7 case directly supports high confidence; PnP or device-input-process-network lineage disconfirms it.}]}
  evidence_refs: [REF-000246, REF-000250, REF-000251]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000086]}, mitigations: {coverage: available, mitigation_refs: [MIT-000087]}}
evidence: {claim_refs: [CLM-000273, CLM-000446, CLM-000450], case_refs: [CASE-000086], reference_refs: [REF-000246, REF-000247, REF-000250, REF-000251]}
research:
  limitations: {paragraphs: [{zh: 直接现场来源为 FBI FIN7 BadUSB 公告；其他 HID 形态按相同设备—输入因果推广。设备身份可能伪造，企业也有合法宏键盘和 KVM；high 表示外设冒充变量明确，单个新键盘不能归因。缺失注入标志只支持来源假设，仍需设备与结果链。, en: The direct field source is the FBI FIN7 BadUSB advisory and other HID forms generalize through the same device-to-input causality. Device identities can be spoofed and enterprises use legitimate macro keyboards and KVMs. High confidence establishes the peripheral-impersonation variable while a new keyboard alone cannot attribute maliciousness. Missing injected flags supports only an origin hypothesis and still requires device and outcome lineage.}]}
