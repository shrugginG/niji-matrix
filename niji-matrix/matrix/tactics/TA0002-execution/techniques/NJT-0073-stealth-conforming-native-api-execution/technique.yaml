  claim_refs: [CLM-000277, CLM-000278, CLM-000279, CLM-000418, CLM-000419, CLM-000420, CLM-000421, CLM-000422, CLM-000423]
  case_refs: [CASE-000077, CASE-000078]
  reference_refs: [REF-000125, REF-000222, REF-000223, REF-000224, REF-000225, REF-000226]
research:
  limitations:
    paragraphs:
    - zh: 直接 syscall 和动态解析的强现场/样本证据集中于 Windows；Linux/macOS 只在父级按等价调用路径概念覆盖，不能假定相同导入表、hook 或 ETW 字段。Rhadamanthys 与 SplatDropper 证明变量，Lumma 与 Elastic 支持检测，但本技术不能仅凭非标准栈或 GetProcAddress 归因；JIT、安全软件和兼容层会产生良性异常。若传感器只能看到结果无调用栈，子项区分置信度应降低。
      en: Strong field and sample evidence for direct syscalls and dynamic resolution concentrates on Windows. Linux and macOS remain covered at the parent only through equivalent call-path concepts without assuming identical imports hooks or ETW fields. Rhadamanthys and SplatDropper establish the variables while Lumma and Elastic support detection, but nonstandard stacks or GetProcAddress alone cannot attribute maliciousness. JIT security software and compatibility layers produce benign anomalies. Without call stacks, outcome-only sensors should lower child-level confidence.
