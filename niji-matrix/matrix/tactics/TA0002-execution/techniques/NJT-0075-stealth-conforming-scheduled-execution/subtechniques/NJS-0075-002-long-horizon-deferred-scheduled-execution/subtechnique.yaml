research:
  limitations:
    paragraphs:
    - zh: Nitrokod 明确把多日延期用于沙箱规避，但这是单一恶意生态案例；许多企业任务合法按月运行或在离线后补跑。跨平台官方文档证明调度语义但不证明攻击意图，因此部署时必须同时要求未经批准的定义/创建者和异常执行结果，且按照本地保留窗口定义“观察窗口外”。
      en: Nitrokod explicitly used multi-day delay for sandbox evasion but represents one malware ecosystem and many enterprise
        tasks legitimately run monthly or catch up after downtime. Cross-platform documentation establishes scheduler semantics
        rather than adversary intent so deployments must also require unapproved definition or creator and anomalous execution
        outcome and define outside the observation window relative to local retention.
