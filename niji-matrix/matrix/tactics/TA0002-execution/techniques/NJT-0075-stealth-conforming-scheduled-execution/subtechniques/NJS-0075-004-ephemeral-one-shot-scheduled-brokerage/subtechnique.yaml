research:
  limitations:
    paragraphs:
    - zh: 直接规避案例是 Windows Serpent；Kubernetes Job TTL 和安装器 run-once 证明短生命周期是正常平台能力而非攻击意图。跨平台映射必须证明攻击者选择调度器父级和快速删除以改变观察，而不能只根据对象已被控制器清理。缺少创建/删除审计时，进程异常可以提示调查但不足以确认本轴。
      en: The direct evasion case is Windows Serpent while Kubernetes Job TTL and installer run-once behavior show that short
        lifetime is a normal platform capability rather than adversary intent. Cross-platform mapping must establish attacker
        selection of scheduler parentage and rapid deletion to change observation rather than infer from controller cleanup.
        Without create and delete audit anomalous processes can prompt investigation but do not confirm the axis.
