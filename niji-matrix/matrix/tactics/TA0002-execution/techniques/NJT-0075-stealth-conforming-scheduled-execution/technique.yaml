research:
  limitations:
    paragraphs:
    - zh: 四项直接案例集中于 Windows，跨平台扩展依据 systemd 和 Kubernetes 的官方对象与生命周期语义，而不是同等强度的 Linux/Kubernetes 攻击者匿迹案例。因此父级跨平台成立，但具体子项在非
        Windows 环境的置信度应随本地证据和遥测下降；不能把合法 RandomizedDelay、Job TTL 或权限隔离误当成攻击者选择。
      en: Four direct cases concentrate on Windows. Cross-platform extension relies on official systemd and Kubernetes object
        and lifecycle semantics rather than equally strong Linux or Kubernetes adversary-stealth cases. The parent is cross-platform
        but confidence in a child on non-Windows systems should decrease with local evidence and telemetry. Legitimate RandomizedDelay
        Job TTL or permission isolation must not be treated as adversary choice.
    - zh: 任务名称、延迟、枚举缺失或短生命周期任一单独信号都有大量正常原因。系统升级会替换任务，离线主机会补跑，权限隔离会让低权主体看不到对象，Kubernetes 控制器会自动清理历史 Job。正式结论必须连接未经批准的 writer/定义变化、调度器执行和异常结果；未来若新的调度后端无法稳定区分枚举抑制与正常权限视图，应降低或合并该映射。
      en: Task name delay enumeration absence and short lifetime each have many benign causes. Updates replace tasks offline
        hosts catch up access separation hides objects from low-privilege users and Kubernetes controllers clean historical
        Jobs automatically. Formal conclusions must join an unapproved writer or definition change scheduler execution and
        anomalous outcome. If a new scheduler cannot stably distinguish enumeration suppression from normal permission views
        the mapping should be lowered or merged.
    - zh: 现有直接匿迹案例集中于 Windows，且并非都证明入侵维持结果。Nitrokod 与 Tarrask 直接支持跨重启、长延期或持续 C2 恢复；Guloader 证明重复合形任务，但公开摘要不足以确认创建者或原始会话已经结束；Serpent 只直接证明即时一次性代理。systemd 与 Kubernetes 官方资料证明调度和生命周期能力，不证明攻击者匿迹意图。因此非 Windows 映射以及 NJS-0075-004 的 TA0003 使用必须另有跨中断后继执行或访问恢复证据，否则只能保留为执行结论。
      en: The direct stealth cases are concentrated on Windows and do not all establish a Persistence outcome. Nitrokod and
        Tarrask directly support execution across reboot long delay or continuing C2 recovery. Guloader establishes a recurring
        conforming task but the public summary does not establish that the creator or original session had ended and Serpent
        directly establishes only immediate one-shot brokerage. Official systemd and Kubernetes material establishes scheduling
        and lifecycle capability rather than adversary stealth intent. Non-Windows mappings and TA0003 use of NJS-0075-004
        therefore require separate evidence of successor execution or access restoration after an interruption or remain Execution
        conclusions.
