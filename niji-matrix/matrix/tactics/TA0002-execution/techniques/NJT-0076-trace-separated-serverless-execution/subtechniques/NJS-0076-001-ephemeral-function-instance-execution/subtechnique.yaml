research:
  limitations:
    paragraphs:
      - zh: Denonia 是样本分析而非完整云事件响应，作者未发现部署路径，并指出样本也可在普通 Amazon Linux 环境继续运行。因此它支持 Lambda 定向设计、短驻观察和 DoH 行为，不支持认定某个真实 AWS 账户被哪种身份创建函数。任何案例映射都必须另有控制面 invocation 或租户证据。
        en: Denonia is sample analysis rather than a complete cloud incident response and the authors did not identify deployment while noting that the binary could continue on ordinary Amazon Linux. It supports Lambda-targeted design ephemeral observation and DoH behavior but not attribution of function creation in a real AWS account. Any case mapping requires separate control-plane invocation or tenant evidence.
