schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0076-002
parent_ref: NJT-0076
name: {zh: 良性事件流耦合执行, en: Benign Event-Stream-Coupled Execution}
summary: {zh: 攻击者让恶意函数或流程只随正常邮件、文件、用户、队列或存储事件激活，使业务触发和服务身份掩盖动作意图, en: Adversaries activate malicious functions or flows only with normal mail file user queue or storage events so business triggers and service identities obscure action intent}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 良性事件流耦合执行是攻击者把恶意函数、flow 或 SaaS 自动化动作绑定到租户日常产生的事件源，使邮件接收、文件打开或共享、用户创建、对象写入、队列消息或业务查询到达时由平台自动执行。直接目标是以现有 workflow/connector/execution role 完成数据窃取、凭据或权限操作，而不需要攻击者在每次动作前手工 Invoke。稳定变量是正常事件与恶意动作的因果耦合，不是某个 connector 或事件类型。
      en: Benign Event-Stream-Coupled Execution binds malicious functions flows or SaaS automation actions to routine tenant event sources so platform execution follows mail receipt file open or share user creation object writes queue messages or business searches. Its objective is data theft credential or permission action through existing workflows connectors or execution roles without manual invocation before every action. The stable variable is causal coupling of normal events and malicious actions rather than connector or event type.
stealth_characteristics:
  paragraphs:
    - zh: 良性事件流耦合执行让触发记录看起来是普通业务活动，动作主体又是已知 function role、service principal 或 connector。攻击者可以启用租户已有但未使用的 flow，减少新外部进程和交互式会话；DART 案例中 Microsoft Flow 与 eDiscovery/Compliance Search 自动化窃取即利用了未主动监控的既有服务。精确 trigger 未披露，因此匿迹因果保持 medium。
      en: Benign Event-Stream-Coupled Execution makes triggers look like routine business activity while action principals are known function roles service principals or connectors. Attackers may enable an existing but unused flow reducing new external processes and interactive sessions. In the DART case Microsoft Flow automated theft through eDiscovery and Compliance Search using existing insufficiently monitored services. The exact trigger was not disclosed so stealth causality remains medium.
    - zh: flow/function 版本、启用时间、owner、connector consent、trigger 条件、event/invocation ID、执行动作、资源对象和数据传输仍可关联。正常事件的高频会增加基线成本，但突然启用 dormant flow、新 connector、匿名共享、转发、跨租户目的地或不符合 owner 角色的 API 序列会揭示异常。只观察事件源而不解析自动化定义会丢失动作语义。
      en: Flow or function versions enablement time owners connector consent trigger conditions event or invocation IDs executed actions resource objects and data transfer remain correlatable. High-frequency normal events increase baseline cost but newly enabled dormant flows new connectors anonymous sharing forwarding cross-tenant destinations or API sequences inconsistent with owner role expose anomalies. Observing event sources without parsing automation definitions loses action semantics.
scope_boundary_definition:
  paragraphs:
    - zh: 本轴要求正常业务或云事件自动触发攻击者控制的服务端代码/动作。攻击者手工 Invoke、只修改 flow 但未运行、合法 DLP/自动化和客户端宏不属于本轴。事件触发的短驻函数若主要观察差异是无主机取证可同时映射 NJS-0076-001；若仅由 CI、容器或终端计划任务触发，则分别归流水线、容器或 T1053 对象。
      en: The axis requires a normal business or cloud event to trigger adversary-controlled server-side code or action automatically. Manual adversary Invoke flow edits without execution legitimate DLP or automation and client macros are excluded. Event-triggered short-lived functions may also map to NJS-0076-001 when missing host forensics is material while CI container or endpoint scheduler triggers belong to pipeline container or T1053 objects.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者在入侵办公套件账户、flow owner、cloud developer 或 service account 后，建立或启用对邮件、文件、用户和资源变化的自动动作。它适合持续转发、创建共享链接、复制搜索结果、增加凭据或对新对象执行后门动作，并借业务事件节奏决定运行频率。
        en: After compromising office-suite accounts flow owners cloud developers or service accounts adversaries create or enable automated actions on mail file user and resource changes. It supports persistent forwarding anonymous sharing copying search results adding credentials or backdooring new objects and lets business-event cadence determine run frequency.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需有权创建或修改 flow/function、授权 connector 或绑定 event source，并理解事件 schema 与目标 API。选择已有 dormant flow 可降低新对象差异，但可能受 owner、DLP 和环境审批限制；过宽 trigger 会产生大量失败、成本和噪声，过窄则降低目标覆盖。
          en: The adversary needs authority to create or modify flows or functions authorize connectors or bind event sources and understand event schemas and target APIs. Reusing dormant flows reduces new-object differences but is constrained by ownership DLP and environment approvals. Broad triggers create failures cost and noise while narrow triggers reduce coverage.
    defender_model:
      paragraphs:
        - zh: 防守方需要 flow/function inventory 与版本、owner/consent、trigger/event-source mapping、run history、connector/API audit 和数据结果。不同 SaaS 往往用不同 request ID 且保留期不一致；如果只采集身份登录和最终资源变化，无法确定是哪条自动化把正常事件转换为恶意动作。
          en: Defenders need flow or function inventories and versions owner and consent trigger or event-source mappings run history connector or API audit and data outcomes. SaaS products use different request IDs and retention. Identity sign-ins plus final resource changes alone cannot identify which automation converted a normal event into malicious action.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 恶意动作共享正常业务事件和服务连接器特征, en: Malicious actions share normal business-event and service-connector features}
    analysis:
      paragraphs:
        - zh: 攻击者让恶意自动化在普通事件到达时以现有服务身份运行，使单个 trigger 和 API 记录与合法流程相同，形成特征伪装。DART 证明 Microsoft Flow 可被攻击者用于自动窃取，但未提供完整 trigger，因此映射保持 medium。解析 flow 版本、owner、connector 与结果语义可以恢复差异。
          en: The adversary has malicious automation run under an existing service identity when ordinary events arrive making individual trigger and API records resemble legitimate flows and creating Feature Disguise. DART proves attacker use of Microsoft Flow for automated theft but does not provide the full trigger so mapping remains medium. Parsing flow versions owners connectors and outcome semantics recovers differences.
    evidence_refs: [REF-000268]
    confidence: medium
defense:
  detections: {coverage: available, strategy_refs: [DET-000088]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000089]}
