  reference_refs: [REF-000128, REF-000268, REF-000269, REF-000270, REF-000271, REF-000272]
research:
  limitations:
    paragraphs:
      - zh: DART 案例证明 Microsoft Flow 恶意自动化和监控缺口，但未披露 trigger、flow action、connector 或具体日志，因此不能把所有正常事件驱动的 Flow 视为同一案例模式。ATT&CK 页面列出的自动凭据/分享场景还包括研究示例而非全部现场活动。新映射必须证明事件到动作的实际因果，无法取得 run history 时保持 hypothesis 或 defer。
        en: The DART case proves malicious Microsoft Flow automation and monitoring gaps but does not publish the trigger flow actions connector or exact logs so not every normal event-driven flow can be treated as the same case pattern. ATT&CK's automated credential or sharing scenarios also include research examples rather than complete field activity. New mappings must establish actual event-to-action causality and remain hypothesis or deferred without run history.
