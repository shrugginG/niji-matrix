schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0077-002
parent_ref: NJT-0077
name: {zh: 内存驻留模块实例化, en: Memory-Resident Module Instantiation}
summary: {zh: 攻击者用自定义或反射映射器从内存字节创建可执行模块，绕过磁盘文件、标准 loader 注册和 module list, en: Adversaries use custom or reflective mappers to create executable modules from memory bytes bypassing disk files standard loader registration and module lists}
aliases: [Reflective Module Loading]
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 内存驻留模块实例化是自定义/反射 loader 从内存数据分配区域、复制模块节、处理 relocation/import、设置 protection 并调用入口，使模块代码执行却没有正常 file-backed image 或 loader module object。变量是模块表示而非是否跨进程；写入另一进程时同时属于 Process Injection。, en: Memory-Resident Module Instantiation uses a custom or reflective loader to allocate memory copy module sections process relocations and imports set protections and call entries so module code executes without a normal file-backed image or loader module object. The variable is module representation rather than cross-process status and writing into another process also belongs to Process Injection.}]}
stealth_characteristics: {paragraphs: [{zh: 内存驻留模块实例化绕过磁盘扫描、LoadLibrary hooks 和 PEB/module inventory，使进程内出现 executable private memory 而无对应 image。PipeMon 与 DOUBLEPULSAR 分析直接支持。allocation→write/decrypt→protect→thread/entry、PE headers、import resolution 和 network 仍残留，内存 telemetry 缺失时最难发现。, en: Memory-Resident Module Instantiation bypasses disk scanning LoadLibrary hooks and PEB or module inventory leaving executable private memory without a corresponding image. PipeMon and DOUBLEPULSAR directly support it. Allocation write or decrypt protection thread or entry PE headers import resolution and network remain while missing memory telemetry creates the strongest blind spot.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入实际自定义映射并执行的 module image；普通 shellcode、.NET reflection、standard LoadLibrary 和仅解密未执行分别按对象处理。跨进程注入可共映射，不能因“内存中有 DLL 字节”自动确认。, en: Include only module images actually custom-mapped and executed. Ordinary shellcode .NET reflection standard LoadLibrary and decrypted but unexecuted bytes follow their own objects. Cross-process injection may co-map and DLL-like bytes in memory alone do not confirm this child.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者从加密磁盘 blob、网络 stage 或现有 loader 内存取得模块，用于按需插件、C2 与注入，同时减少可扫描文件和标准 module event。, en: Adversaries obtain modules from encrypted disk blobs network stages or loader memory for on-demand plugins C2 and injection while reducing scannable files and standard module events.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 攻击者需实现兼容 PE/ELF/Mach-O 的 mapper、import、relocation 与入口，并处理内存保护和线程；复杂实现会产生结构、异常调用与稳定代码指纹。, en: The adversary must implement format-compatible mapping imports relocations and entry execution and manage memory protection and threads while complexity leaves structures anomalous calls and stable code fingerprints.}]}
    defender_model: {paragraphs: [{zh: 防守方需要 virtual memory map、file backing、protection transitions、thread start、call stack 和 memory scanning，并比较 loader inventory；仅有 EDR process/file 事件无法确认。, en: Defenders need virtual-memory maps file backing protection transitions thread starts call stacks and memory scanning compared with loader inventory and process or file events alone cannot confirm it.}]}
stealth_mechanisms: [{mechanism_ref: NM-DO, role: primary, summary: {zh: 可执行 Module 内存没有对应标准文件和 Loader 对象, en: Executable module memory lacks corresponding standard file and loader objects}, analysis: {paragraphs: [{zh: reflective mapper 自行构造 module，使标准 module list 与磁盘对象缺失，形成数据对象混淆。PipeMon、Microsoft 与 DOUBLEPULSAR 直接支持；private executable region 与 loader-like 操作仍可形成差分。, en: Reflective mappers construct modules themselves so standard module lists and disk objects are absent creating Data Object Obfuscation. PipeMon Microsoft and DOUBLEPULSAR directly support it while private executable regions and loader-like operations still create differentials.}]}, evidence_refs: [REF-000280, REF-000281, REF-000283], confidence: high}]
defense: {detections: {coverage: available, strategy_refs: [DET-000090]}, mitigations: {coverage: available, mitigation_refs: [MIT-000091]}}
evidence: {claim_refs: [CLM-000292, CLM-000488, CLM-000491, CLM-000492, CLM-000493, CLM-000494], case_refs: [CASE-000100], reference_refs: [REF-000129, REF-000280, REF-000281, REF-000283]}
research: {limitations: {paragraphs: [{zh: PipeMon 同时包含跨进程注入，必须把 reflective module 表示与注入目标分开；合法 JIT、packer 和安全产品也会创建 executable private memory，需 PE-like layout、import 与行为组合，不能以 RWX 单点定性。, en: PipeMon also includes cross-process injection so reflective module representation must be separated from the injection target. Legitimate JIT packers and security products create executable private memory and require PE-like layout imports and behavior rather than an RWX point signal.}]}}
