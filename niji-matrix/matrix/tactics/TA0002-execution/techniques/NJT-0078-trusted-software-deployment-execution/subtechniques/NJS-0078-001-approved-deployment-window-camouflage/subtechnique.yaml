  case_refs: [CASE-000096, CASE-000097, CASE-000098]
  reference_refs: [REF-000130, REF-000273, REF-000274, REF-000275, REF-000276, REF-000278]
research:
  limitations:
    paragraphs:
      - zh: 案例直接证明 ePO、PDQ 和 BigFix/PDQ 被滥用，但公开材料没有统一披露 agent process、job identifier 或 operator session。子项 high 表示来源代理事实强，不表示任一管理 agent 子进程都恶意。合法事件响应也会用同一功能部署工具；没有控制面异常或 payload/结果差异时只能保持低置信调查。
        en: Cases directly prove abuse of ePO PDQ and BigFix or PDQ but do not publish uniform agent processes job identifiers or operator sessions. High confidence applies to provenance brokerage rather than making every management-agent child malicious. Legitimate incident response uses the same features and absent control-plane anomaly or payload or outcome difference the event remains a low-confidence investigation.
