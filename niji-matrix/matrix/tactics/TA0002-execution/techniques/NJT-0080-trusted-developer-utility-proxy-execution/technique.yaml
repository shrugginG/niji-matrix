research:
  limitations:
    paragraphs:
    - zh: 现场案例集中 MSBuild，ClickOnce/JamPlus 只通过固定基线提供产品覆盖；不能将 MSBuild 特有 inline task 推广为所有开发 utility。AkaiRyū 明确编译/执行 XML 中
        C#，但未证明 task assembly 全程无磁盘制品，故第二子项 medium。开发主机正常行为密集，强制阻止必须基于角色和业务需求。
      en: Field cases concentrate on MSBuild while ClickOnce and JamPlus have product coverage only through the fixed baseline
        and MSBuild-specific inline tasks cannot be generalized to every utility. AkaiRyū clearly compiles and executes C
        sharp from XML but does not prove task assemblies remained diskless throughout so the second child is medium. Developer
        hosts have dense normal activity and blocking requires role and business context.
