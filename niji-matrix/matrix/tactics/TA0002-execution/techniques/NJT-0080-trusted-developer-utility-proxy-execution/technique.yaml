schema_version: 2.0.0
type: technique
id: NJT-0080
name:
  zh: 受信开发实用程序代理执行
  en: Trusted Developer-Utility Proxy Execution
summary:
  zh: 攻击者让签名开发工具解释恶意 project、manifest 或内联任务，使应用控制允许的 Utility 代理启动、加载或进程内执行代码
  en: Adversaries have signed developer tools interpret malicious projects manifests or inline tasks so application-control-allowed
    utilities proxy code launch loading or in-process execution
aliases: []
classification:
  tactic_refs:
  - TA0002
  - TA0005
  origin:
    kind: attack-retained
    source_attack_id: T1127
    source_attack_version: '19.1'
  decision_ref: DEC-TA0002-T1127
definition_and_concept:
  paragraphs:
  - zh: 受信开发实用程序代理执行是攻击者向签名编译、构建、部署或调试 utility 提供 project、manifest、targets、response 或其他构建输入，使 utility 按设计编译、加载、启动或进程内执行攻击者代码。直接目标是借受信
      publisher、常见开发路径和工具权限穿过应用控制，并把恶意结果归因于 MSBuild、ClickOnce、JamPlus 或等价开发程序，而不是直接运行未知 executable。
    en: Trusted Developer-Utility Proxy Execution supplies signed compilation build deployment or debugging utilities with
      adversary projects manifests targets response files or other build inputs causing the utility by design to compile load
      launch or execute attacker code in process. Its objective is to cross application control through trusted publishers
      common developer paths and utility privileges and attribute outcomes to MSBuild ClickOnce JamPlus or equivalent tools
      rather than direct unknown executables.
  - zh: 技术固定“受信 utility 解释不可信输入”这一代理边界，不等同于普通编译或所有 LOLBin。utility 在 CI runner 中执行时可与 T1677 共映射；生成工具随后注入、加载模块或调用 shell 时分别共映射相邻技术。ATT&CK
      的三个子项按产品划分，Niji 不继承这些名称，而按输入代理与 in-utility object visibility 分区。
    en: The technique fixes the proxy boundary where a trusted utility interprets untrusted input rather than ordinary compilation
      or all living-off-the-land binaries. Utility execution on CI runners may co-map T1677 and downstream injection module
      loading or shell calls co-map adjacent techniques. ATT&CK's three children partition products and Niji does not inherit
      those labels but partitions input proxying and in-utility object visibility.
stealth_characteristics:
  paragraphs:
  - zh: 受信 utility 的文件签名、安装路径和父进程经常被应用控制允许，攻击者 project 输入可以使用普通 XML/manifest/build 文件外观。Frankenstein 用 MSBuild 执行 instal.xml，AkaiRyū
      用 MSBuild 编译执行 XML 中的 FaceXInjector，直接证明 process reputation 与 input semantics 可分离。内联 task 还能在 utility 内生成内存 assembly，减少独立
      payload 文件和可疑 child。
    en: Trusted utilities have signatures installation paths and parent processes commonly allowed by application control
      while adversary project inputs use ordinary XML manifest or build-file appearances. Frankenstein used MSBuild to execute
      instal.xml and AkaiRyū compiled and executed FaceXInjector from XML directly proving separation of process reputation
      and input semantics. Inline tasks may also generate in-memory assemblies inside the utility reducing standalone payload
      files and suspicious children.
  - zh: utility path/hash/signature、调用者、命令行、project 来源/path/digest、UsingTask/TaskFactory/Code、import/remote reference、module
      load、dynamic code、child process、file write 和 network 仍可观察。工作站或非开发服务器运行 MSBuild、来自用户目录/远程 share 的 project、inline Code
      和首次网络目的地会削弱伪装；开发主机的合法噪声要求按 role、repo 与 build lineage 建立基线。
    en: Utility path hash signature caller command line project origin path and digest UsingTask TaskFactory Code imports
      or remote references module loads dynamic code child processes file writes and network remain observable. MSBuild on
      workstations or nondeveloper servers projects from user directories or remote shares inline Code and first-seen network
      destinations weaken disguise while legitimate developer-host noise requires role repository and build-lineage baselines.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术要求受信开发 utility 实际解释攻击者输入并执行代码。普通合法构建、仅存在恶意 project 未运行、独立 compiler 输出稍后由其他进程启动不自动成立。MSBuild/ClickOnce/JamPlus 是实现而非子项；后继
      process injection、module load、shell 或网络下载分别保留其技术边界。签名 utility 自身被替换则属于完整性/劫持问题。
    en: The technique requires a trusted developer utility to interpret adversary input and execute code. Ordinary legitimate
      builds unexecuted malicious projects or compiler output launched later by another process do not automatically qualify.
      MSBuild ClickOnce and JamPlus are implementations rather than children and downstream process injection module loading
      shell or network download retains its technique boundaries. Replacement of the signed utility itself is an integrity
      or hijacking issue.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在应用白名单环境、存在 .NET/Visual Studio Build Tools 或 ClickOnce/JamPlus 的主机上，用钓鱼、远程模板、下载或已有 foothold 放置 project/manifest，再调用
        utility 执行 loader、injector 或 backdoor。非开发工作站上的 utility 更异常，开发/构建主机则提供大量合法基线可供混入。
      en: In application-allowlisted environments or hosts with .NET Visual Studio Build Tools ClickOnce or JamPlus adversaries
        place projects or manifests through phishing remote templates downloads or existing footholds and invoke utilities
        to execute loaders injectors or backdoors. Utility use is more anomalous on nondeveloper workstations while developer
        or build hosts provide large benign baselines.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需知道可用 utility 版本、输入 schema、task factory 和应用控制策略，并取得写入输入和启动工具的权限。inline 代码需兼容 compiler/runtime；错误 project 会产生
          build error 和日志。WDAC block rules、缺少 utility、受控 project 路径和 dynamic code security 会限制可行性。
        en: The adversary needs knowledge of available utility versions input schemas task factories and application-control
          policy plus authority to write inputs and start tools. Inline code must match compiler and runtime and malformed
          projects create build errors and logs. WDAC block rules absent utilities controlled project paths and dynamic-code
          security constrain feasibility.
    defender_model:
      paragraphs:
      - zh: 防守方假定有 process lineage、code integrity、utility command、file origin/MOTW、project content/digest、MSBuild binary log
          或等价 build event、module/dynamic-code、child/file/network telemetry。开发角色与批准 repository 是必要基线；如果 project 内容在执行前即删除或日志未启用，只能从调用者、memory
          与结果回溯。
        en: Defenders are assumed to have process lineage code integrity utility commands file origin or MOTW project content
          and digest MSBuild binary logs or equivalent build events module or dynamic-code child file and network telemetry.
          Developer role and approved repositories are necessary baselines and deleted project content or disabled logs force
          reconstruction from caller memory and outcomes.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 签名开发 Utility 成为恶意执行的可见主体
    en: Signed developer utilities become the visible principals for malicious execution
  analysis:
    paragraphs:
    - zh: utility 按自身合法设计解析 project 并编译/启动代码，应用控制只看到允许 publisher 和路径，恶意行为继承其信誉形成行为透明。Frankenstein 与 AkaiRyū 直接支持；project provenance、host
        role 和后继结果仍可恢复意图。
      en: Utilities parse projects and compile or start code through legitimate design so application control sees allowed
        publishers and paths and malicious behavior inherits reputation creating Behavioral Transparency. Frankenstein and
        AkaiRyū directly support this while project provenance host role and outcomes recover intent.
  evidence_refs:
  - REF-000285
  - REF-000286
  - REF-000288
  confidence: high
- mechanism_ref: NM-DO
  role: secondary
  summary:
    zh: 内联源代码编译为进程内 Task Assembly 而无独立制品
    en: Inline source compiles into in-process task assemblies without standalone artifacts
  analysis:
    paragraphs:
    - zh: RoslynCodeTaskFactory 可将 UsingTask/Code 编译为内存 assembly 并在 build 中执行，使独立 payload object 缺失，形成数据对象混淆。Microsoft 能力文档明确，但
        field case 未证明全过程 artifactless，故 medium；project 内容、dynamic code 与 memory/network 仍残留。
      en: RoslynCodeTaskFactory compiles UsingTask and Code into in-memory assemblies executed during the build so a standalone
        payload object is absent creating Data Object Obfuscation. Microsoft capability is explicit but field cases do not
        prove complete artifactlessness so confidence is medium and project content dynamic code memory and network remain.
  evidence_refs:
  - REF-000284
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 子项按 utility 代理后恶意代码的可观察表示划分。受信 utility 输入代理执行要求外部 project/manifest/build input 与 utility 结果链；无独立制品 utility 内执行要求
        inline source 编译为内存 task assembly 并在进程内运行。三个 ATT&CK 产品、输入远程/本地和语言不成项；后继注入与模块加载归相邻对象。
      en: Children partition observable representation of malicious code after utility proxying. Trusted-utility input proxy
        execution requires an external project manifest or build input and utility outcome chain while artifactless in-utility
        execution requires inline source compiled to an in-memory task assembly and run in process. Three ATT&CK products
        remote or local input and language do not form children and downstream injection or module loading belongs to adjacent
        objects.
  coverage: established
  subtechnique_refs:
  - NJS-0080-001
  - NJS-0080-002
