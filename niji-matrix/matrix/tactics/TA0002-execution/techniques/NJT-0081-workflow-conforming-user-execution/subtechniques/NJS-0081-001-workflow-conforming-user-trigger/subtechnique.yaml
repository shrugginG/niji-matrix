schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0081-001
parent_ref: NJT-0081
name: {zh: 工作流合形用户触发, en: Workflow-Conforming User Trigger}
summary: {zh: 攻击者把恶意点击、安装、运行或批准包装为用户真实文档、开发、更新或支持任务，使人和工具身份都显得合法, en: Adversaries frame malicious clicks installs runs or approvals as genuine document development update or support tasks so both human and tool identities appear legitimate}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 工作流合形用户触发是攻击者使导致执行的动作与目标用户正常职责、内容来源和工具用法一致，例如打开 USB“文件夹”、克隆面试项目运行 npm install、安装更新或远程支持工具。直接目标是让用户主动越过安全提示/执行边界；稳定变量是 task-context conformity，不是 link/file/image/library 媒介。, en: Workflow-Conforming User Trigger makes execution-causing actions consistent with target duties content sources and tool use such as opening a USB folder cloning interview projects and running npm install or installing updates or remote-support tools. Its objective is to have users cross prompts or execution boundaries voluntarily and the stable variable is task-context conformity rather than link file image or library carrier.}]}
stealth_characteristics: {paragraphs: [{zh: 工作流合形用户触发由真实 user/session、合法 Explorer/IDE/package manager/browser 和正常命令产生，单点 process/identity 看似授权。Contagious Interview 与 Raspberry Robin 直接支持。Recruiter/support identity、repository/USB/file provenance、MOTW、package script、LNK target 和 first network/process 仍可揭示，且同一动作对不同角色的合形度不同。, en: Workflow-Conforming User Trigger uses real users and sessions legitimate Explorer IDE package managers or browsers and normal commands so point process or identity appears authorized. Contagious Interview and Raspberry Robin directly support it. Recruiter or support identity repository USB or file provenance MOTW package scripts LNK targets and first network or process remain revealing and conformity differs by role.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入攻击者有意借用户真实 workflow 外观促成实际执行的行为。普通误点击、合法开发 setup、零点击/autorun 和愿意 insider 主要权限行为排除或归相邻对象；若只有媒介伪装而无 task-context 证据，映射父级。, en: Include intentional adversary use of genuine workflow appearance to cause actual execution. Ordinary mistakes legitimate developer setup zero-click or autorun and willing-insider authority behavior are excluded or adjacent and carrier disguise without task-context evidence maps only to the parent.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者在招聘面试、USB 文件浏览、软件/会议更新、helpdesk、文档/链接和容器/库安装场景构造可信任务，执行 stealer、loader、RMM 或恶意 package。, en: Adversaries construct plausible tasks in recruiting interviews USB browsing software or meeting updates helpdesk documents or links and container or library installation to execute stealers loaders RMM or malicious packages.}]}
  threat_model: {attacker_model: {paragraphs: [{zh: 需要角色/语言/工具和身份上下文知识，维持可信交互和可运行内容；目标培训、身份验证、MOTW 与应用控制限制成功率。, en: Role language tool and identity context knowledge plus credible interaction and runnable content are required while training identity verification MOTW and application control limit success.}]}, defender_model: {paragraphs: [{zh: 需要 content/recruiter/support/repository provenance、user action、tool process 与 first outcome，按 user role/asset 建基线；只见真实用户无法判断原因。, en: Defenders need content recruiter or support repository provenance user actions tool processes and first outcomes baselined by user role and asset because a real user alone does not explain intent.}]}}
stealth_mechanisms: [{mechanism_ref: NM-FD, role: primary, summary: {zh: 恶意动作共享用户正常任务与工具特征, en: Malicious actions share features of normal user tasks and tools}, analysis: {paragraphs: [{zh: 攻击者让请求、工具和命令符合用户预期，真实身份与合法软件共同形成特征伪装。Contagious Interview/Raspberry Robin 支持；provenance、MOTW、input content 和 first outcome 可破坏。, en: The adversary aligns requests tools and commands with expectations so real identities and legitimate software create Feature Disguise. Contagious Interview and Raspberry Robin support it while provenance MOTW input content and first outcomes break it.}]}, evidence_refs: [REF-000105, REF-000298, REF-000103, REF-000031], confidence: high}]
defense: {detections: {coverage: available, strategy_refs: [DET-000060]}, mitigations: {coverage: available, mitigation_refs: [MIT-000059]}}
evidence: {claim_refs: [CLM-000303, CLM-000519, CLM-000522, CLM-000523, CLM-000524, CLM-000525, CLM-000526], case_refs: [CASE-000107, CASE-000108, CASE-000109], reference_refs: [REF-000105, REF-000133, REF-000297, REF-000298, REF-000103, REF-000031, REF-000301]}
research: {limitations: {paragraphs: [{zh: 工作流合形涉及人类判断，来源只能证明 lure/action 设计和执行，不能精确证明每位用户为何相信。Raspberry Robin 品牌命名是 Microsoft 的可能性判断；检测不能以用户点击本身定罪。, en: Workflow conformity involves human judgment and sources prove lure and action design plus execution but not exactly why every user believed it. Raspberry Robin brand naming is Microsoft's possibility assessment and user clicks alone cannot establish maliciousness.}]}}
