schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0081-002
parent_ref: NJT-0081
name: {zh: 多步交互因果分离, en: Multi-Step Interaction Causality Separation}
summary: {zh: 攻击者把一次执行拆成网页或邮件提示、剪贴板、Run/Terminal、粘贴和确认，使自动父子谱系被人工步骤切断, en: Adversaries split one execution across web or email prompts clipboard Run or Terminal paste and confirmation so human steps break automatic parent-child lineage}
aliases: [ClickFix]
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 多步交互因果分离是攻击者要求用户在多个应用和界面依次执行动作，最终把命令送入 interpreter/runtime。ClearFake 的点击复制、打开 PowerShell/Run、粘贴和执行是典型。稳定变量是 human-mediated cross-application causal break，不是命令是否 Base64 或 copy/paste 媒介本身。, en: Multi-Step Interaction Causality Separation requires users to perform ordered actions across applications and interfaces before delivering commands to an interpreter or runtime. ClearFake click-to-copy opening PowerShell or Run paste and execute is typical. The stable variable is a human-mediated cross-application causal break rather than Base64 or copy-and-paste alone.}]}
stealth_characteristics: {paragraphs: [{zh: 多步交互因果分离让浏览器不直接 spawn shell，clipboard 与 Run/terminal 在不同进程和时间出现，每步都可能是常见用户操作。Proofpoint 直接支持 high。页面/clipboard 内容指纹、window focus、input sequence、Run history、full command、PowerShell 网络与 payload 仍可重建；隐私和无共同 ID 是主要限制。, en: Multi-Step Interaction Causality Separation prevents browsers directly spawning shells and places clipboard and Run or terminal activity in different processes and times where each step may be common. Proofpoint directly supports high confidence. Page or clipboard content fingerprints window focus input sequences Run history full commands PowerShell network and payload can reconstruct it while privacy and absent shared IDs are major limits.}]}
scope_boundary_definition: {paragraphs: [{zh: 纳入至少两个人工跨应用步骤实际促成恶意执行并造成自动谱系缺口的情况。单击直接下载/执行、脚本自动复制运行、用户只复制未执行排除；如果主要效果是任务可信而非步骤分离，可归兄弟项。, en: Include at least two human cross-application steps causing malicious execution and an automatic-lineage gap. One-click direct download or execution automated copy and run and copied but unexecuted content are excluded. Behavior whose primary effect is task credibility rather than step separation belongs to the sibling.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 假 CAPTCHA、浏览器错误、文档修复和 helpdesk 指令让用户在浏览器/邮件后打开 Run/PowerShell/Terminal，粘贴命令并执行 loader；也可扩展到多步 cloud/IDE 指令。, en: Fake CAPTCHAs browser errors document fixes and helpdesk instructions have users open Run PowerShell or Terminal after browser or mail paste commands and execute loaders and may extend to multi-step cloud or IDE instructions.}]}
  threat_model: {attacker_model: {paragraphs: [{zh: 需要控制页面/指令/clipboard 内容并维持用户按顺序操作；步骤多降低成功率，安全提示、clipboard 防护和 shell policy 可阻断。, en: Control of pages instructions and clipboard content plus user compliance in order is required while more steps reduce success and prompts clipboard protection and shell policy interrupt.}]}, defender_model: {paragraphs: [{zh: 需要跨 browser/mail、clipboard/window、Run/terminal、process/network 按 user/session/content/time 关联，并最小化隐私采集；无 clipboard 只能用命令/result 近似。, en: Defenders need cross-browser or mail clipboard or window Run or terminal process and network correlation by user session content and time with minimized privacy collection and without clipboard must approximate through commands and outcomes.}]}}
stealth_mechanisms: [{mechanism_ref: NM-ST, role: primary, summary: {zh: 人工跨应用步骤分散内容与执行谱系, en: Human cross-application steps disperse content and execution lineage}, analysis: {paragraphs: [{zh: 页面、clipboard、Run/terminal 和 payload 分处不同主体与时间，自动 parent-child 断裂形成时空释痕。Proofpoint 直接支持；content hash/focus/full command/result 可恢复。, en: Pages clipboard Run or terminal and payload occupy different principals and times breaking automatic parentage and creating Spatiotemporal Trace Dilution. Proofpoint directly supports it while content hashes focus full commands and outcomes recover causality.}]}, evidence_refs: [REF-000297, REF-000302], confidence: high}]
defense: {detections: {coverage: available, strategy_refs: [DET-000060]}, mitigations: {coverage: available, mitigation_refs: [MIT-000059]}}
evidence: {claim_refs: [CLM-000304, CLM-000520, CLM-000522, CLM-000525, CLM-000526], case_refs: [CASE-000107], reference_refs: [REF-000133, REF-000297, REF-000301, REF-000302]}
research: {limitations: {paragraphs: [{zh: 直接证据集中 Windows ClickFix，macOS/Linux 终端可存在相同链但需本地案例。Clipboard/keystroke 采集涉及隐私且用户可编辑命令，缺数据时应基于 full command 与结果降低置信度而非假定步骤。, en: Direct evidence concentrates on Windows ClickFix and equivalent macOS or Linux terminal chains require local cases. Clipboard or keystroke collection raises privacy and users may edit commands so missing data requires lower-confidence full-command and outcome analysis rather than assumed steps.}]}}
lifecycle: {status: review, version: 2.0.0, created: '2026-09-10', modified: '2026-09-12', contributors: [Niji Matrix Research], reviewers: []}
