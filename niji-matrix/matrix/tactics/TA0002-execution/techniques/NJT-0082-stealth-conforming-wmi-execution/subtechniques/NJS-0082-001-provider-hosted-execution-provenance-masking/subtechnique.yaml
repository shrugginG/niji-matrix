schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0082-001
parent_ref: NJT-0082
name: {zh: Provider 宿主执行来源遮蔽, en: Provider-Hosted Execution-Provenance Masking}
summary: {zh: 攻击者让 WMI Service/Provider 把原始本地或远程 Client 请求转换为 Wmiprvse 托管进程或动作，打断直接父子谱系, en: Adversaries have WMI services or providers translate original local or remote client requests into Wmiprvse-hosted processes or actions breaking direct parent-child lineage}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: Provider 宿主执行来源遮蔽是 WMI client 调用 execution-capable method 后，由 WMI service 在 Wmiprvse 或 self-hosted provider 中执行并创建本地结果，使 visible parent/account 指向 provider 而非原始 Office、script、operator 或远程主机。稳定变量是 client→provider→outcome 来源翻译，不以 DCOM/WinRM 或 client 工具划分。, en: Provider-Hosted Execution-Provenance Masking follows a WMI client calling an execution-capable method and WMI service executing through Wmiprvse or a self-hosted provider to create a local outcome whose visible parent or account points to the provider rather than original Office script operator or remote host. The stable variable is client-to-provider-to-outcome provenance translation rather than DCOM WinRM or client tool.}]}
stealth_characteristics: {paragraphs: [{zh: Provider 宿主执行来源遮蔽让 endpoint process tree 从 Wmiprvse 开始，TA551 直接用 WMI 打断 winword lineage，AvosLocker 也由 WMI Provider Host 执行 encoded PowerShell。WMI-Activity 的 client machine/user/PID、namespace/method、OperationId、provider PID 与 child 仍可恢复；只看父进程或 wmiprvse reputation 会漏检。, en: Provider-Hosted Execution-Provenance Masking makes endpoint process trees begin at Wmiprvse. TA551 directly used WMI to break Winword lineage and AvosLocker had WMI Provider Host execute encoded PowerShell. WMI-Activity client machine user and PID namespace method OperationId provider PID and child can still recover the chain while parent-only or Wmiprvse-reputation logic misses it.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入 WMI provider 实际产生恶意执行且来源翻译有观察意义的情况。纯 query、permanent subscription 和非 WMI remote shell 排除；后继 PowerShell/service 可共映射。仅有 wmiprvse child 而无 client/method 或恶意结果不足以确认。, en: Include WMI providers actually producing malicious execution where provenance translation matters. Pure queries permanent subscriptions and non-WMI remote shells are excluded and downstream PowerShell or services may co-map. A Wmiprvse child without client or method or malicious outcome is insufficient.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者经 Office/loader、本地脚本、Impacket 或远程管理调用 Win32_Process/ExecMethod，借 provider 启动 shell、PowerShell、loader 或破坏动作。, en: Adversaries call Win32_Process or ExecMethod from Office or loaders local scripts Impacket or remote management and have providers start shells PowerShell loaders or destructive actions.}]}
  threat_model: {attacker_model: {paragraphs: [{zh: 需要 WMI namespace/method 权限、认证与网络可达性，并能提供合法 method 参数；远程 WMI 受 DCOM/WinRM、UAC 与防火墙限制。, en: WMI namespace and method authority authentication and network reachability plus valid method parameters are required and remote WMI is constrained by DCOM or WinRM UAC and firewalls.}]}, defender_model: {paragraphs: [{zh: 需要 WMI trace 与 endpoint process 的共同 OperationId/PID/时间，保留 client image、remote identity 和 provider child；日志关闭或 PID 重用时置信度下降。, en: Defenders need WMI trace and endpoint processes joined by OperationId PID and time retaining client images remote identities and provider children while disabled logs or PID reuse lower confidence.}]}}
stealth_mechanisms: [{mechanism_ref: NM-BT, role: primary, summary: {zh: Provider Host 替代原始 Client 成为本地父进程, en: Provider hosts replace original clients as local parent processes}, analysis: {paragraphs: [{zh: WMI 将 client operation 转换为 provider-local execution，endpoint 只见 Wmiprvse/系统身份，形成行为透明。TA551 直接证明意图；OperationId/client fields 可破坏。, en: WMI translates client operations into provider-local execution so endpoints see Wmiprvse or system identity creating Behavioral Transparency. TA551 directly proves intent and operation or client fields break it.}]}, evidence_refs: [REF-000293, REF-000294, REF-000296], confidence: high}]
defense: {detections: {coverage: available, strategy_refs: [DET-000093]}, mitigations: {coverage: available, mitigation_refs: [MIT-000094]}}
evidence: {claim_refs: [CLM-000306, CLM-000511, CLM-000514, CLM-000515, CLM-000516, CLM-000517, CLM-000518], case_refs: [CASE-000105, CASE-000106], reference_refs: [REF-000134, REF-000274, REF-000293, REF-000294, REF-000295, REF-000296]}
research: {limitations: {paragraphs: [{zh: TA551 报告直接说明谱系打断但未公开完整 WMI operation 字段；部署检测必须用 Microsoft tracing 语义补足，不把所有 Wmiprvse child 视为同一活动。, en: TA551 directly states lineage breaking but does not publish complete WMI operation fields and deployments must combine Microsoft tracing semantics without treating every Wmiprvse child as the same activity.}]}}
