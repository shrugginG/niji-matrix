schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0082-002
parent_ref: NJT-0082
name: {zh: 日常管理情境合形, en: Routine-Administration Context Conformity}
summary: {zh: 攻击者使用组织常见 WMI Namespace、Class、Method、管理主体和节奏，使恶意 Operation 与 Inventory 或运维活动共享特征, en: Adversaries use organizationally common WMI namespaces classes methods management principals and cadence so malicious operations share features with inventory or administration}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 日常管理情境合形是攻击者在执行 WMI 恶意 method 时选择与目标 SCCM、监控、脚本和运维相似的 namespace、class、method、账户、source 与频率，使 operation 单点看似合理。稳定变量是资产局部管理基线相似性，不是 WMI 本来就是管理技术，也不包含纯 inventory query。, en: Routine-Administration Context Conformity selects namespaces classes methods accounts sources and cadence similar to target SCCM monitoring scripts and operations when executing malicious WMI methods so individual operations appear plausible. The stable variable is asset-local management baseline similarity rather than WMI being administrative by design and pure inventory queries are excluded.}]}
stealth_characteristics: {paragraphs: [{zh: 日常管理情境合形使 WMI operation、provider identity 和网络端口与合法管理相同，若只按 WMIC/PowerShell/Wmiprvse 稀有度规则难以区分。AvosLocker 在本地/远程设置操作旁由 provider 执行 encoded PowerShell，显示管理与恶意结果可共存；但来源未证明刻意 cadence/namespace 模仿，故 medium。完整命令、actor、method 与结果仍可揭示。, en: Routine-Administration Context Conformity makes WMI operations provider identities and network ports match legitimate management and defeats rarity rules on WMIC PowerShell or Wmiprvse alone. AvosLocker combined local or remote setting operations with provider-hosted encoded PowerShell showing management and malicious outcomes can coexist but sources do not prove deliberate cadence or namespace mimicry so confidence is medium. Full commands actors methods and outcomes remain revealing.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入 actual execution method 与本地 WMI 基线有意贴合并改变区分的行为；合法 SCCM/monitoring、纯 query 和仅 provider 托管来源分别排除或归兄弟项。若无资产基线与恶意结果，只能映射父级。, en: Include actual execution methods deliberately conforming to local WMI baselines and changing differentiation. Legitimate SCCM or monitoring pure queries and provider-hosted provenance alone are excluded or assigned to the sibling. Without asset baselines and malicious outcomes map only the parent.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者在企业大量使用 WMI inventory/修复时，用相同管理账户、Win32_Process 或常见 namespace 执行 encoded script、下载或设置修改，借背景流量降低单点异常。, en: Where enterprises use WMI heavily for inventory or remediation adversaries use the same management accounts Win32_Process or common namespaces for encoded scripts downloads or setting changes and reduce point anomalies in background traffic.}]}
  threat_model: {attacker_model: {paragraphs: [{zh: 需要了解常见管理主体、class/method 与节奏并拥有对应权限；误用异常 namespace、账户或参数会暴露。, en: Knowledge of common management principals classes methods and cadence plus matching authority is required while unusual namespaces accounts or parameters expose activity.}]}, defender_model: {paragraphs: [{zh: 需要按设备角色/管理平台建立 namespace-method-principal-cadence 和结果基线，而非全局白名单；没有完整 command 或 client identity 时降低置信度。, en: Defenders need device-role and management-platform baselines for namespace method principal cadence and outcomes rather than global allowlists and lower confidence without full commands or client identity.}]}}
stealth_mechanisms: [{mechanism_ref: NM-FD, role: primary, summary: {zh: 恶意 WMI 方法共享合法管理调用的可见特征, en: Malicious WMI methods share visible features of legitimate administration calls}, analysis: {paragraphs: [{zh: 攻击者选择常见 WMI 语义与主体，使规则将 operation 与运维混同，形成特征伪装。AvosLocker 支持共存但意图证据有限故 medium；encoded command、scope 与结果基线可破坏。, en: The adversary selects common WMI semantics and principals causing rules to conflate operations with administration and creating Feature Disguise. AvosLocker supports coexistence but intent evidence is limited so confidence is medium while encoded commands scope and outcome baselines break it.}]}, evidence_refs: [REF-000274, REF-000295], confidence: medium}]
defense: {detections: {coverage: available, strategy_refs: [DET-000093]}, mitigations: {coverage: available, mitigation_refs: [MIT-000094]}}
evidence: {claim_refs: [CLM-000307, CLM-000512, CLM-000515, CLM-000516, CLM-000517, CLM-000518], case_refs: [CASE-000106], reference_refs: [REF-000134, REF-000274, REF-000293, REF-000294, REF-000295]}
research: {limitations: {paragraphs: [{zh: 现场证据证明管理调用与恶意 provider child 共存，却未证明攻击者依据具体企业基线调整 namespace、method 或节奏；因此 medium，未来若只有 WMI 工具使用而无合形变量应合并回父级。, en: Field evidence proves management calls and malicious provider children coexist but not that adversaries tuned namespaces methods or cadence to a specific enterprise baseline so confidence is medium and future tool-only cases without conformity should collapse to the parent.}]}}
