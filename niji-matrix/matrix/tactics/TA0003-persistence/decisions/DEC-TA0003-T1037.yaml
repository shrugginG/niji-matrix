candidate:
  source_type: attack
  source_attack_id: T1037
  source_attack_version: '19.1'
  name_en: Boot or Logon Initialization Scripts
  name_zh: 启动或登录初始化脚本
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 明确将 T1037 映射到 Persistence，并定义为利用启动或登录初始化时自动执行的脚本建立持久化。Mandiant 直接观察到 UNC3886 向 Fortinet 既有 `/etc/init.d/localnet`
  加入启动命令，Sygnia 直接观察到 Velvet Ant 把两个组件加入 F5 `/etc/rc.local`；这些脚本在系统启动时执行。该行为以脚本正文、命令序列或脚本钩子为直接持久化对象，与 NJT-0084 的生命周期目标描述符不同，因此保留并独立建模。
rationale_en: ATT&CK Enterprise 19.1 explicitly maps T1037 to Persistence and defines it as establishing persistence through scripts executed
  automatically during boot or logon initialization. Mandiant directly observed UNC3886 add a startup command to the existing Fortinet `/etc/init.d/localnet`,
  while Sygnia directly observed Velvet Ant add two components to F5 `/etc/rc.local`; those scripts execute during system startup. Script body,
  command sequence, or script hook is the direct persistence object, distinct from the lifecycle target descriptor in NJT-0084, so the candidate
  is retained and modeled independently.
scope_notes_zh: 正式范围固定启动/登录生命周期解释的脚本正文或脚本钩子。五项固定 ATT&CK 子技术作为广度先验：Windows 登录脚本、Login Hook、RC Scripts 与 Startup Items 保留为实现层；Network Logon Script
  的多系统作用支持“集中初始化脚本扇出”，与“既有初始化脚本内联植入”形成两项不同内容身份与写入—执行拓扑的 Niji 子项。平台、脚本名和登录类型未被导入。
scope_notes_en: 'Formal scope fixes script body or script hook interpreted by boot or logon lifecycle. The five fixed ATT&CK children serve as
  a breadth prior: Windows logon scripts, Login Hook, RC Scripts, and Startup Items remain implementation detail, while Network Logon Script multi-system
  scope supports Centralized Initialization-Script Fan-Out alongside Existing Initialization-Script Inline Implantation as two Niji children with
  different content identity and mutation-to-execution topology. Platform, script name, and logon type are not imported.'
