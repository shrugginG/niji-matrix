  name_en: Scheduled Task/Job
  name_zh: 计划任务/作业
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 明确将 T1053 映射到 Persistence，并说明调度器保存的任务可在系统启动或计划时点执行恶意代码。Tarrask 的隐藏 WinUpdate 任务从普通管理视图消失后仍按触发器重连 C2，Nitrokod 的任务链则跨多次重启和十五天延迟继续后续下载与执行，直接证明触发—动作绑定能够脱离创建进程、原始会话或短观察窗口继续恢复攻击者控制的执行。因此 T1053 在 TA0003 下保留。该行为与 TA0002、TA0004 下的 NJT-0075 共享同一调度对象、四项 Niji 匿迹变量和防御链，正式对象采用扩展复用而不是创建 Persistence 副本。
rationale_en: Enterprise ATT&CK 19.1 explicitly maps T1053 to Persistence and describes scheduler-held tasks that execute malicious code at system startup or a scheduled time. Tarrask's hidden WinUpdate task continued C2 reconnection after disappearing from ordinary management views, while Nitrokod's task chain crossed multiple reboots and a fifteen-day delay before later download and execution. These observations directly establish that a trigger-to-action binding can outlive the creating process, original session, or short observation window and restore adversary-controlled execution. T1053 is retained under TA0003 by extending NJT-0075 because the direct scheduler object, four Niji stealth variables, and defense chain are unchanged from its TA0002 and TA0004 mappings.
scope_notes_zh: Persistence 结论要求精确计划绑定在创建进程、原始会话或其他明确中断后仍可使用，并由后续触发实际恢复或维持攻击者控制的执行或访问。仅创建任务、从未被消费的任务，以及完全发生在原始活动窗口内的即时 create→run→delete，只能证明配置异常或 Execution，不能单独证明 TA0003。由通用调度器保存的启动、登录或事件触发任务仍归 NJT-0075；不以调度对象为核心的启动/登录描述符归 NJT-0084，无 timer 的持久服务定义归 NJT-0089，调度器之外的持久事件订阅归 NJT-0090，以 workflow 或其输入为因果执行入口的流水线作业归 NJT-0074。五项 ATT&CK 子技术只提供实现广度，不导入为 Niji 子项；跨会话持续、重启后恢复和周期回连是 TA0003 结果门，不构成第五个 NJS。
scope_notes_en: Persistence requires the exact scheduled binding to remain usable after the creating process, original session, or another defined interruption and for a later trigger to restore or maintain adversary-controlled execution or access. Task creation alone, a task never consumed, or an immediate create-to-run-to-delete transaction completed wholly inside the initiating activity establishes only configuration anomaly or Execution, not TA0003. A startup, logon, or event trigger stored by a general scheduler remains NJT-0075; a non-scheduler boot or logon descriptor belongs to NJT-0084, a durable service definition without a timer to NJT-0089, a durable event subscription outside the scheduler to NJT-0090, and a pipeline job whose causal entry is a workflow or its input to NJT-0074. The five ATT&CK children provide implementation breadth only and are not imported. Cross-session continuity, post-reboot restoration, and periodic reconnection are TA0003 outcome gates rather than a fifth NJS.
