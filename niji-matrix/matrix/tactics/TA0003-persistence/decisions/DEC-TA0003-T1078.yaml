  name_en: Valid Accounts
  name_zh: 有效账户
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 明确将 T1078 映射到 Persistence，并说明被攻陷凭据可持续访问远程系统和外部服务。NJT-0061 已把直接对象定义为目标仍接受的真实身份或认证会话，并按登录情境、会话连续性和身份反馈状态形成三个稳定匿迹变量；TA0003 不改变该对象或 taxonomy。因此 T1078 独立 retain 并扩展复用 NJT-0061。Persistence 结果门要求同一身份/会话在先前攻击者访问后跨独立时段或明确中断仍可用，并由后续认证或会话续用实际恢复或维持资源访问；该门不形成第四个 NJS。
rationale_en: ATT&CK Enterprise 19.1 explicitly maps T1078 to Persistence and states that compromised credentials can provide persistent access to remote systems and external services. NJT-0061 already defines the direct object as a real identity or authenticated session still accepted by the target and partitions three stable stealth variables around sign-in context session continuity and identity-feedback state. TA0003 changes neither object nor taxonomy. T1078 is independently retained by extending and reusing NJT-0061. Its Persistence result gate requires the same identity or session to remain usable after prior adversary access across a separate episode or defined interruption and later authentication or session continuation to restore or maintain resource access. The gate does not create a fourth NJS.
scope_notes_zh: 凭据持有、账户仍启用、一次成功登录、原活动窗口内不中断使用、认证失败或高权标签均不足。凭据/会话材料取得归 Credential Access；账户、认证器、角色、组或授权修改归 NJT-0083；新建身份归 NJT-0088；进程 token 操纵归 NJT-0099；远程服务只是载体。四项 ATT&CK 账户类型只提供实现广度；合法重登、自动 refresh、灾备、break-glass、季节任务与设备迁移是强反例。
scope_notes_en: Credential possession enabled account state one successful sign-in uninterrupted use within the original episode authentication failure or a privileged label is insufficient. Credential or session-material acquisition belongs to Credential Access account authenticator role group or authorization mutation to NJT-0083 identity creation to NJT-0088 process-token manipulation to NJT-0099 and remote service is only a transport. Four ATT&CK account classes provide implementation breadth only. Legitimate reauthentication automatic refresh disaster recovery break-glass seasonal jobs and device migration are strong counterexamples.
