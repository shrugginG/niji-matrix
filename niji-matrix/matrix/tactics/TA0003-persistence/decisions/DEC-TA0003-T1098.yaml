  name_en: Account Manipulation
  name_zh: 账户操纵
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 明确把 T1098 映射到 Persistence，并将其直接行为界定为修改既有账户的凭据、权限组或其他访问状态，以保存或提升对受害系统的访问。Microsoft 对 NOBELIUM 的现场观察进一步证明，攻击者会修改
  Azure AD，新增服务主体凭据并向用户或应用授予角色，以取得长期驻留与敏感信息访问。该对象的持久化载体是跨会话继续生效的既有身份认证或授权状态，而不是一次登录结果、取得的秘密或新建账户，因此保留父语义并以身份访问状态为 Niji 概念锚。
rationale_en: ATT&CK Enterprise 19.1 explicitly maps T1098 to Persistence and defines its direct behavior as modifying credentials, permission
  groups, or other access state of an existing account to preserve or elevate access to victim systems. Microsoft's field observations of NOBELIUM
  further establish Azure AD mutation, added service-principal credentials, and roles granted to users or applications for long-term persistence
  and sensitive-information access. The persistence carrier is authentication or authorization state attached to an existing identity and effective
  across sessions, rather than one sign-in result, an acquired secret, or a newly created account. The parent semantics are therefore retained
  with identity access state as the Niji conceptual anchor.
scope_notes_zh: 正式范围纳入攻击者对既有主体的认证器、授权图边或设备信任进行持久变更。七项固定 ATT&CK 子技术只作为广度先验：云凭据与 SSH key 收敛为并行认证路径，邮件委托、云/容器角色及本地/域组收敛为间接授权图，设备注册因独立 device ID、PRT/令牌与条件访问语义形成设备信任子项。T1136
  负责新身份，T1078 负责未修改状态的有效账户使用，T1556 负责全局认证过程；没有继承 ATT&CK 子技术。
scope_notes_en: 'Formal scope covers durable mutation of an existing principal through an authenticator, authorization-graph edge, or device trust.
  The seven fixed ATT&CK children serve only as a breadth prior: cloud credentials and SSH keys converge on a parallel authentication path; mail
  delegation, cloud or container roles, and local or domain groups converge on an indirect authorization graph; device registration forms a device-trust
  child because it has independent device ID, PRT or token, and Conditional Access semantics. T1136 covers new identities, T1078 unmodified valid-account
  use, and T1556 global authentication-process change. No ATT&CK child is inherited.'
