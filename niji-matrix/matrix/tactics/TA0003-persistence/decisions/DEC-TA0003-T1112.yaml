  source_attack_id: T1112
  source_attack_version: "19.1"
  name_en: Modify Registry
  name_zh: 修改注册表
decision: adapt
rationale_zh: ATT&CK 19.1 锚定攻击者修改 Registry 以隐藏配置并支持持久化；Mandiant 对 FIN7 的调查直接证明 Registry 内容被以后 loader 消费并产生恶意进程。Niji 将范围收窄到 writer—Registry state—consumer—result 的跨会话谱系，避免把任何 Registry 修改都提升为独立 Persistence 技术。
rationale_en: ATT&CK 19.1 anchors adversary Registry modification to hide configuration and support persistence, while Mandiant's FIN7 investigation directly establishes Registry content consumed later by a loader to produce a malicious process. Niji narrows scope to cross-session writer-to-Registry-state-to-consumer-to-result lineage and avoids promoting every Registry mutation to an independent Persistence technique.
scope_notes_zh: ATT&CK T1112 无子技术，开放 taxonomy 搜索覆盖名称、内容、来源、ACL、WOW64/virtualization、事务和 API 可见性。只有 embedded-null/counted-string 路径同时满足稳定攻击者控制、等价权限跨视图差、直接案例和独立恢复动作，正式化为 NJS-0094-001；编码内容、上层自启动/服务/Office/认证语义和普通 ACL 差分别归邻接对象或父级。
scope_notes_en: ATT&CK T1112 has no children, and open taxonomy search covered naming, content, origin, ACL, WOW64 or virtualization, transactions, and API visibility. Only the embedded-null or counted-string path satisfies stable adversary control, equivalent-privilege cross-view difference, direct case evidence, and independent recovery action and is formalized as NJS-0094-001. Encoded content, upper-layer autostart, service, Office or authentication semantics, and ordinary ACL differences remain adjacent objects or parent behavior.
