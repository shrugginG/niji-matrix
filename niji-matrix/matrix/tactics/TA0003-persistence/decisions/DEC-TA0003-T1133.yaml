candidate: {source_type: attack, source_attack_id: T1133, source_attack_version: "19.1", name_en: External Remote Services, name_zh: 外部远程服务}
decision: adapt
rationale_zh: ATT&CK 19.1 明确把外部远程服务映射到 Persistence；Heartbleed 与 Microsoft token 资料证明仍有效会话状态可在原认证之后重新建立访问，住宅代理和 DEV-0537 资料证明风险情境可以被重复控制。持续重入与首次入口使用相同的远程会话对象和两个痕迹变量，因此扩展复用 NJT-0055 而不创建重复技术。
rationale_en: ATT&CK 19.1 explicitly maps External Remote Services to Persistence. Heartbleed and Microsoft token reporting establishes still-valid session state reestablishing access after original authentication, while residential-proxy and DEV-0537 reporting establishes reusable control of risk context. Continuing re-entry uses the same remote-session object and two trace variables as initial entry, so NJT-0055 is extended and reused rather than duplicated.
scope_notes_zh: TA0003 从攻击者已有另一立足点且保留可再次使用的远程服务状态或情境开始，到新会话建立结束；会话内执行、横向移动和通信排除。ATT&CK 无子项，开放搜索保留活动远程会话状态重放与远程接入风险情境拟态；设备注册本身归 T1098，状态获取归 Credential Access。
scope_notes_en: TA0003 begins when an adversary already has another foothold and retains remote-service state or context usable again and ends when a new session is established. In-session execution, lateral movement, and communication are excluded. ATT&CK has no children, and open search retains Live Remote-Session State Replay and Remote-Access Risk-Context Mimicry. Device registration itself belongs to T1098 and state acquisition to Credential Access.
