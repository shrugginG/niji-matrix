  name_en: Create Account
  name_zh: 创建账户
decision: retain
rationale_zh: ATT&CK 19.1 直接记录在受害环境创建账户以提供不依赖原会话或远程工具的次级凭据访问；该新身份对象区别于 T1098 既有身份状态变化，故 retain。
rationale_en: ATT&CK 19.1 directly records creation of an account inside the victim environment to provide secondary credentialed access independent
  of the original session or remote tool. This new identity object differs from T1098 mutation of existing identity and is retained.
scope_notes_zh: 纳入受害环境中新身份创建及以后使用；受害环境外账户归 T1585，既有身份变化归 T1098。三项 ATT&CK 子技术仅作为广度先验，不按本地/域/云导入；Niji taxonomy 建立窄范围低活动账户配置和跨控制面账户投放两项变量，命名合形与延迟首次使用继续
  defer。
scope_notes_en: Include new identity creation and later use inside the victim environment; accounts outside the victim environment belong to T1585
  and existing-identity mutation to T1098. The three ATT&CK children are used only as a breadth prior and are not imported as local, domain, or
  cloud partitions. The Niji taxonomy establishes narrow-scope low-activity provisioning and cross-control-plane provisioning, while naming conformity
  and delayed first use remain deferred.
