  name_en: Software Extensions
  name_zh: 软件扩展
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1176 定义为滥用浏览器、IDE 等软件扩展建立持续访问。攻击者控制的是宿主认可且可跨会话存续的扩展包、精确身份和安装、注册、启用或更新状态；Check Point 的恶意 VS Code Marketplace 扩展与 Elastic 的 KREMLIN 配置植入分别直接证明市场身份仿冒和带外注册状态可在以后宿主活动中加载恶意代码。因此 T1176 在 TA0003 下 retain。Browser/IDE 两项 ATT&CK 子项仅提供实现广度，正式 Niji taxonomy 按受信扩展身份仿冒与带外扩展注册状态植入重构，不继承产品分类。
rationale_en: ATT&CK Enterprise 19.1 defines T1176 as abuse of browser IDE and similar software extensions for persistent access. The attacker controls a host-recognized extension package exact identity and installation registration enablement or update state that can survive across sessions. Check Point malicious VS Code Marketplace extensions and Elastic KREMLIN configuration implantation directly establish marketplace identity impersonation and out-of-band registration state loading malicious code during later host activity. T1176 is therefore retained under TA0003. Browser and IDE ATT&CK children provide implementation breadth only and the formal Niji taxonomy is reconstructed around trusted-extension identity impersonation and out-of-band extension registration-state implantation.
scope_notes_zh: 必须证明扩展包与宿主认可的持久状态跨中断存在，并由以后宿主启动、工作区打开、浏览或用户活动实际恢复执行、访问或通信；一次插件运行、临时 `--load-extension` 或未被宿主消费的包不足。服务器扩展归 T1505/NJT-0225，Office 专属启动面归 NJT-0095，SaaS/OAuth 集成归 NJT-0086，目标收到前的供应链污染归 NJT-0059，通用模块执行归 NJT-0077，独立事件谓词归 NJT-0090，正常远控功能滥用归 NJT-0212。合法企业部署、开发者侧载、自动更新和无障碍/安全扩展是强反例。
scope_notes_en: The extension package and host-recognized durable state must survive an interruption and later host start workspace open browsing or user activity must actually restore execution access or communication. One plug-in run temporary load-extension or an unconsumed package is insufficient. Server extensions belong to T1505 or NJT-0225 Office-specific startup surfaces to NJT-0095 SaaS or OAuth integrations to NJT-0086 supply-chain compromise before target receipt to NJT-0059 generic module execution to NJT-0077 independent event predicates to NJT-0090 and abuse of ordinary remote-control functions to NJT-0212. Legitimate enterprise deployment developer side-loading automatic updates and accessibility or security extensions are strong counterexamples.
