  name_en: BITS Jobs
  name_zh: BITS 作业
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 明确把 T1197 映射到 Persistence，并说明 BITS 的长驻作业、可延长寿命以及 transferred 或 error 通知能够在系统重启后调用程序。Microsoft 文档证明作业在 Complete 或 Cancel 前保持非最终状态、默认 inactivity timeout 为九十日且错误状态可重试，SetNotifyCmdLine 能在 transferred 或 error 状态以用户上下文启动程序；UBoatRAT 与 KEGTAP/SINGLEMALT 资料又直接观察到跨重启与错误重试持久执行。因此 T1197 在 TA0003 下保留。该行为与 TA0002 NJT-0063 共享同一作业 GUID、文件队列、状态和通知配置，正式对象采用跨战术扩展复用而不是分配重复 NJT。
rationale_en: ATT&CK Enterprise 19.1 explicitly maps T1197 to Persistence and describes long-lived, extendable BITS jobs and transferred- or error-state notification invoking programs after reboot. Microsoft documentation establishes that a job remains non-final until Complete or Cancel, has a default ninety-day inactivity timeout, can retry errors, and can use SetNotifyCmdLine to launch a program in user context on transferred or error state. UBoatRAT and KEGTAP/SINGLEMALT reporting directly observes persistent execution across reboot and through error retry. T1197 is therefore retained under TA0003. The behavior shares the same job GUID, file queue, state, and notification configuration as NJT-0063 under TA0002, so the canonical object is extended across tactics rather than duplicated.
scope_notes_zh: Persistence 范围要求攻击者有意保留 BITS 的非最终作业、通知或重试状态，使未来执行能够跨当前会话、登录或主机重启继续或恢复。仅下载或上传而无执行或恢复语义的 BITS 作业不纳入；一次性完成并立即最终化、没有后续可用状态的 BITS 执行只属于 TA0002。通用日历或事件调度归 T1053，服务管理器直接启动归 T1569。两个既有 Niji 子项继续按后台传输外观和长驻状态激活划分，不导入 ATT&CK 子技术或另建 TA0003 副本。
scope_notes_en: Persistence scope requires adversary intent to preserve non-final BITS job, notification, or retry state so future execution continues or can be restored across the current session, logon, or host reboot. BITS download or upload without execution or recovery semantics is excluded. One-shot BITS execution that completes and immediately finalizes without continuing usable state belongs only to TA0002. General calendar or event scheduling belongs to T1053 and direct service-manager launch to T1569. The two existing Niji children remain partitioned by background-transfer appearance and long-lived state activation; no ATT&CK sub-technique or TA0003 duplicate is imported.
