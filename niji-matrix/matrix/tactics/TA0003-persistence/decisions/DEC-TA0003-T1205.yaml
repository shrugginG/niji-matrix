decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 将 T1205 映射到 Persistence、Stealth 和 Command and Control。既有 NJT-0120 已把 Port Knocking 与 Socket Filters 重构为攻击者控制的网络信号、匹配状态、隐藏→可用转变和后继功能，因此 TA0003 不创建副本。Persistence 的独立结果门是 matcher 与被门控功能在重启、原始会话结束、配置变化或其他明确中断后仍然存在或可恢复，并由后续信号实际重新暴露入口、启动后门或恢复访问。SYNful Knock 与 UNC3886 REPTILE 直接支持该链，故独立 adapt 并扩展复用 NJT-0120。
rationale_en: ATT&CK Enterprise 19.1 maps T1205 to Persistence Stealth and Command and Control. Existing NJT-0120 already reconstructs Port Knocking and Socket Filters around an adversary-controlled network signal match state hidden-to-available transition and successor function so TA0003 does not create a duplicate. Its independent Persistence result gate requires the matcher and gated function to remain present or recoverable after reboot original-session termination configuration change or another defined interruption followed by a later signal that re-exposes an entry starts the backdoor or restores access. SYNful Knock and UNC3886 REPTILE directly support this chain so the candidate is independently adapted by extending and reusing NJT-0120.
scope_notes_zh: 必须同时证明持久载体跨中断保存/重载 matcher 和隐藏功能，以及中断后的新信号实际恢复访问。一次魔术包、端口序列、过滤器、短暂监听、同一活动窗口会话、Wake-on-LAN、一次本地任务或只有启动/映像/服务载体均不足。普通认证或 C2 握手进入公开服务，不属于本对象。载体由其相邻持久技术拥有，T1205 只拥有 signal match→hidden function activation 关系；两项 ATT&CK 子技术只作 breadth prior。
scope_notes_en: Qualification requires both a durable carrier preserving or reloading the matcher and hidden function across interruption and a new post-interruption signal actually restoring access. A magic packet port sequence filter brief listener same-window session Wake-on-LAN one local task or boot image or service carrier alone is insufficient. Ordinary authentication or C2 handshakes enter exposed services and are outside scope. Adjacent persistence techniques own the carrier while T1205 owns only the signal-match-to-hidden-function-activation relation. Two ATT&CK children are breadth prior only.
