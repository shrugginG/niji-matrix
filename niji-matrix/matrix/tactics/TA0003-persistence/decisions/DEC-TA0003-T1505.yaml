  name_en: Server Software Component
  name_zh: 服务器软件组件
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1505 定义为滥用服务器软件的合法扩展能力，把脚本、过程、程序集、module 或安装包接入服务器运行路径以建立持久访问。LightNeuron、IISpy 与 UNC3886 恶意 VIB 事件分别直接证明注册状态可跨原始会话存在，并在以后邮件、HTTP 请求或主机启动中恢复命令与访问。因此该父行为与 Persistence 直接一致，应 retain。六项 ATT&CK 子技术只提供数据库、邮件、Web、远程桌面与虚拟化实现广度；正式 Niji taxonomy 经覆盖表和第二轮搜索收敛为请求资格化激活与组件信任身份仿冒，不继承实现名称。
rationale_en: ATT&CK Enterprise 19.1 defines T1505 as abuse of legitimate extensibility in server software to integrate scripts procedures assemblies modules or installation packages into server runtime paths for persistent access. LightNeuron IISpy and UNC3886 malicious-VIB incidents directly establish registered state surviving the original session and restoring commands or access during later mail HTTP requests or host starts. The parent behavior therefore directly serves Persistence and is retained. Six ATT&CK children provide database mail web remote-desktop and virtualization implementation breadth only. The formal Niji taxonomy converges through a coverage table and second pass on request-qualified activation and component trust-identity masquerade without inheriting implementation names.
scope_notes_zh: 仅利用服务器漏洞、上传文件或执行一次命令不足；必须证明攻击者控制的组件被接入可持久加载或调用的服务器扩展、请求、启动或管理路径，并由以后请求、事件或启动实际恢复执行、访问或控制。修改现有服务器二进制内容归 NJT-0087，通用服务定义归 NJT-0089，独立事件订阅归 NJT-0090，模块加载方式归 NJT-0077，端口或隐藏会话状态信令归 NJT-0120，客户端/IDE/浏览器扩展归 T1176。正常第三方模块、数据库维护过程、邮件过滤器与虚拟化驱动是强反例。
scope_notes_en: Server exploitation file upload or one command is insufficient. An attacker-controlled component must be integrated into a durable server extension request startup or management path and a later request event or start must actually restore execution access or control. Mutation of an existing server binary belongs to NJT-0087 generic service definitions to NJT-0089 independent event subscriptions to NJT-0090 module loading method to NJT-0077 port or hidden-session signaling to NJT-0120 and client IDE or browser extensions to T1176. Legitimate third-party modules database maintenance procedures mail filters and virtualization drivers are strong counterexamples.
