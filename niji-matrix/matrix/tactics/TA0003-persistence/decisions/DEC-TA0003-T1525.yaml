rationale_zh: ATT&CK 19.1 直接记录内部容器或云镜像植入可通过以后置备维持访问；Niji 适配为镜像身份、内容和部署实例之间的可验证谱系。
rationale_en: ATT&CK 19.1 directly records that implanted internal container or cloud images can preserve access through later provisioning. Niji adapts the object to verifiable lineage among image identity, content, and deployed instances.
scope_notes_zh: 无 ATT&CK 子项；开放搜索形成可变镜像引用替换和未来置备镜像激活，微小层 grafting 因稳定边界不足 defer。外部供应链植入与单次上传排除。
scope_notes_en: ATT&CK has no children. Open search produced Mutable Image-Reference Substitution and Future-Provisioning Image Activation; minimal layer grafting is deferred for lack of a stable boundary. External supply-chain implantation and one-time upload are excluded.
