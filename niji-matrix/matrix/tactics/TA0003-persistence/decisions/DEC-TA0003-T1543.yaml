  name_en: Create or Modify System Process
  name_zh: 创建或修改系统进程
decision: adapt
rationale_zh: ATT&CK 19.1 直接记录服务管理器定义可重复执行攻击载荷。为避免与一次进程或服务执行混同，Niji 将对象适配为跨生命周期存在的系统服务定义及其定义—执行谱系。
rationale_en: ATT&CK 19.1 directly records that service-manager definitions can repeatedly execute adversary payloads. To avoid conflating this with one process or service execution, Niji adapts the object to a system-service definition that persists across lifecycles and its definition-to-execution lineage.
scope_notes_zh: 五项 ATT&CK 子技术只作实现广度先验。正式子项按既有服务身份替换与受限枚举服务注册划分；分布式服务扇出因缺少独立匿迹证据暂缓。
scope_notes_en: The five ATT&CK children are implementation breadth context only. Formal children separate established-service identity substitution from enumeration-restricted service registration; distributed service fanout is deferred for lack of independent stealth evidence.
