decision: adapt
rationale_zh: ATT&CK 19.1 锚定跨平台事件触发实现；Microsoft 永久 WMI consumer 结构和 Solorigate 恶意 binding 直接证明持久注册可以跨重启等待事件并恢复执行。Niji 将范围固定为可证明的注册者—谓词—事件—Broker—action 关系，避免把一次性事件处理或加载劫持混入。
rationale_en: ATT&CK 19.1 anchors cross-platform event-triggered implementations, while Microsoft's permanent WMI consumer structure and a malicious Solorigate binding directly establish durable registration waiting across restart for an event and restoring execution. Niji fixes scope on a demonstrable registrant-predicate-event-broker-action relationship and excludes one-time event handling and load hijacking.
scope_notes_zh: 十八项固定 ATT&CK 子项完成逐簇覆盖和第二轮 taxonomy，收敛为上下文收窄谓词与受信 Broker 来源分离两个稳定观察变量；注册到激活的时间分离属于父级，库/COM/IFEO/shim 解析归 T1574，纯时间触发归 T1053，Office 扩展状态归 NJT-0095。
scope_notes_en: >-
  The eighteen fixed ATT&CK children received clustered coverage and a second taxonomy pass, converging into two stable observation variables: context-narrowed predicates and trusted-broker provenance separation. Registration-to-activation time separation is parent core, library, COM, IFEO, or shim resolution belongs to T1574, pure time triggers to T1053, and Office extension state to NJT-0095.
