candidate:
  source_type: attack
  source_attack_id: T1547
  source_attack_version: '19.1'
  name_en: Boot or Logon Autostart Execution
  name_zh: 启动或登录自启动执行
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1547 明确映射到 Persistence，并定义为配置系统设置，使程序在系统启动或账户登录时自动执行。Microsoft Run/RunOnce 文档直接证明持久配置到登录执行的系统行为，Sysinternals
  Autoruns 证明自启动状态广泛分布并与大量合法软件共存，Microsoft 两项现场调查又直接观察到攻击者创建 Run 值或启动文件夹快捷方式，在后续登录时恢复恶意载荷。该行为的直接持久化对象是由启动或登录生命周期消费的激活映射，而不是某个平台、注册表项、文件格式或工具，因此保留父语义并重建
  Niji 原生匿迹分类。
rationale_en: ATT&CK Enterprise 19.1 explicitly maps T1547 to Persistence and defines it as configuring system settings so a program executes
  automatically during system boot or account logon. Microsoft Run and RunOnce documentation directly establishes system behavior from durable
  configuration to logon execution, Sysinternals Autoruns establishes that autostart state is widely distributed and coexists with large amounts
  of legitimate software, and two Microsoft field investigations directly observe adversaries creating Run values or Startup-folder shortcuts
  that restore malicious payloads at later logon. The direct persistence object is an activation mapping consumed by boot or logon lifecycle rather
  than a platform, registry location, file format, or tool. The parent semantics are retained and a Niji-native evasion taxonomy is derived independently.
scope_notes_zh: 正式范围纳入由启动/登录消费的持久激活映射。十四项固定 ATT&CK 子技术只作为复杂广度先验：平台位置与组件类型留在父级实现层；快捷方式修改支持“既有描述符目标替换”，重新打开应用支持“会话恢复队列注入”，两者与既有“更新主题描述符伪装”形成三项独立
  Niji 变量。初始化脚本、服务、其他事件订阅、调度和模块加载劫持仍归相邻父项；没有继承 ATT&CK 子技术。
scope_notes_en: Formal scope covers a durable activation mapping consumed at boot or logon. The fourteen fixed ATT&CK children serve only as a
  complex breadth prior. Platform locations and component types remain parent implementation detail; Shortcut Modification supports Established
  Autostart Descriptor Target Substitution and Re-opened Applications supports Session-Restoration Queue Injection, forming three independent
  Niji variables with Update-Themed Descriptor Camouflage. Initialization scripts, services, other event subscriptions, scheduling, and module-load
  hijacking remain neighboring parents. No ATT&CK child is inherited.
