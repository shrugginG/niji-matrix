  source_attack_version: '19.1'
  name_en: Compromise Host Software Binary
  name_zh: 破坏主机软件二进制文件
decision: retain
rationale_zh: ATT&CK 19.1 直接定义替换、感染或原位补丁主机既有软件二进制以持久访问；Mandiant 的 UNC3886 调查提供 `/bin/smit` 单字节差异、已知良性比较和启动恢复。直接对象是受害主机二进制内容，不是加载路径或供应链，故 retain。
rationale_en: ATT&CK 19.1 directly defines replacement, infection, or in-place patching of existing host software binaries for persistent access.
  Mandiant's UNC3886 investigation provides a one-byte `/bin/smit` difference, known-good comparison, and boot restoration. The direct object
  is victim-host binary content rather than load path or supply chain, so the candidate is retained.
scope_notes_zh: 正式范围固定主机上既有软件二进制内容被攻击者改变并由正常调用持续执行。ATT&CK T1554 无子技术，开放检索按内容差异和运行时接力形成三项 Niji 变量：低差异原位补丁、整映像路径身份替换、行为保持型二进制包裹；显式原始功能接力优先，其他按局部
  delta 与整映像区分。平台/格式不分类，BOLDMOVE watchdog 因缺少独立匿迹机理证据 defer。
scope_notes_en: 'Formal scope fixes adversary change to content of an existing host software binary followed by continuing normal invocation.
  ATT&CK T1554 has no children. Open search forms three Niji variables by content difference and runtime handoff: low-difference in-place patching,
  whole-image path-identity substitution, and behavior-preserving binary wrapper. Explicit original-function handoff takes precedence; otherwise
  local delta and whole image distinguish the first two. Platform and format do not classify, and BOLDMOVE watchdog remains deferred for lack
  of an independent evasion mechanism.'
