  name_en: Modify Authentication Process
  name_zh: 修改认证过程
decision: adapt
rationale_zh: ATT&CK 19.1 锚定认证组件、联合身份和策略修改；Skeleton Key 与 Solorigate 分别直接证明验证器覆盖和联合信任变更能够在普通密码轮换之外保留异常认证，UNC3944 资料又证明攻击者会修改 MFA 要求与 Conditional Access 排除。Niji 因而把范围固定为“改变未来认证 decision 的持久路径”，不把纯凭据窃取、账户状态变更或只使用有效凭据混入。
rationale_en: ATT&CK 19.1 anchors authentication-component, federation, and policy modification. Skeleton Key and Solorigate directly establish validator override and federation-trust change that preserve anomalous authentication beyond ordinary password rotation, while UNC3944 reporting establishes adversary modification of MFA requirements and Conditional Access exclusions. Niji therefore fixes scope on a durable path that changes future authentication decisions and excludes pure credential theft, account-state mutation, and use of already valid credentials.
scope_notes_zh: 九项固定 ATT&CK 子项完成覆盖表与第二轮 taxonomy，收敛为“额外接受攻击者证明”的选择性后门秘密和“总体策略仍启用但作用域改变”的范围化策略例外。密码过滤、输入捕获和可逆存储若只获得秘密归 Credential Access；账户级认证器与设备注册归 T1098；只伪造令牌而不改变验证或信任配置不自动归入本技术。
scope_notes_en: The nine fixed ATT&CK children received a coverage table and second taxonomy pass, converging into selective backdoor-secret acceptance of an added adversary proof and a scoped policy exception in which the overall policy remains enabled but effective scope changes. Password filtering, input capture, and reversible storage belong to Credential Access when they only obtain secrets; account-level authenticators and device registration belong to T1098; and token forgery without validator or trust-configuration change does not automatically enter this technique.
