candidate: {source_type: attack, source_attack_id: T1668, source_attack_version: "19.1", name_en: Exclusive Control, name_zh: 独占控制}
decision: adapt
rationale_zh: ATT&CK 19.1 锚定攻击者在入侵后阻止其他主体进入或维持；UNC5174 自修补、PG_MEM 和 NetSky.P 竞争清除直接证明不对称状态。Niji 将范围固定为攻击者控制的排除动作与自身独立入口继续存在，避免把普通 patch/kill、资源收益或 Defense Impairment 混入。
rationale_en: ATT&CK 19.1 anchors adversary exclusion of other principals after compromise, while UNC5174 self-patching and PG_MEM and NetSky.P competitor removal directly establish asymmetric state. Niji fixes scope on an adversary-controlled exclusion action plus survival of its independent entry and excludes ordinary patch or kill activity, resource profit, and Defense Impairment.
scope_notes_zh: ATT&CK 无子项，开放搜索收敛为入侵后入口面关闭与竞争立足点清除；前者要求 exploit—替代入口—姿态变更—继续访问，后者要求清除 actor—before/after 集合—自身存续。防守访问阻断归 Defense Impairment，纯资源独占归 Resource Hijacking/Impact，自身版本替换不自动构成排他。
scope_notes_en: ATT&CK has no children, and open search converged into Post-Compromise Ingress-Surface Closure and Competing-Foothold Eviction. The first requires exploit-to-alternative-entry-to-posture-change-to-continuing-access lineage; the second requires cleanup actor, before and after sets, and own survival. Defender-access denial belongs to Defense Impairment, pure resource monopolization to Resource Hijacking or Impact, and replacement of the operator's own version does not automatically form exclusive control.
