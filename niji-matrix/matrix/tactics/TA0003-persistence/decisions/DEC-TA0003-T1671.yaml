candidate:
  source_type: attack
  source_attack_id: T1671
  source_attack_version: '19.1'
  name_en: Cloud Application Integration
  name_zh: 云应用程序集成
decision: retain
rationale_zh: ATT&CK 19.1 记录攻击者通过创建、加入或挪用 OAuth 云应用集成维持访问，甚至在原同意账户失效后继续访问。Microsoft 现场资料直接观察恶意 OAuth 应用长期存在并延迟数周或数月使用；FBI 与 Google 又直接观察 UNC6040
  诱导员工授权攻击者控制、模仿 Data Loader 的 connected app。应用对象、同意、权限、凭据与 token 构成独立持久关系，因此保留。
rationale_en: ATT&CK 19.1 records adversaries maintaining access by creating, adding, or co-opting OAuth cloud application integrations, including
  continued access after the original consenting account is lost. Microsoft field reporting directly observes malicious OAuth apps persisting
  and being used after weeks or months. The FBI and Google directly observe UNC6040 inducing employees to authorize an actor-controlled connected
  app imitating Data Loader. Application object, consent, permission, credential, and token form a distinct durable relationship, so the candidate
  is retained.
scope_notes_zh: 正式范围以具有持续授权、应用/client 身份和后继 token/资源访问的云集成为对象。ATT&CK T1671 无子技术，开放检索仍形成三项 Niji 变量：攻击者新建应用模仿合法集成、授权应用跨长静默期后首次使用、既有第三方集成身份/consent
  不变但 token 或控制者转为攻击者。产品、scope 和协议不构成分类；T1098 身份边与单次 token replay 排除。
scope_notes_en: 'Formal scope uses a cloud integration with durable grant, application or client identity, and downstream token or resource access
  as its object. ATT&CK T1671 has no children, yet open search produced three Niji variables: an adversary-created application imitating a legitimate
  integration, an authorized application first used after long silence, and an existing third-party integration whose identity and consent stay
  unchanged while token or controller shifts to the adversary. Product, scope, and protocol do not define classes; T1098 identity edges and one-time
  token replay are excluded.'
