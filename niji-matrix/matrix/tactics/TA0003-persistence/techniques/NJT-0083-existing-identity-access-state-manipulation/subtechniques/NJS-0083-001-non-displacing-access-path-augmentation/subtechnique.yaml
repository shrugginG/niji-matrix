schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0083-001
parent_ref: NJT-0083
name:
  zh: 并行认证路径增补
  en: Parallel Authentication-Path Augmentation
summary:
  zh: 攻击者向既有身份新增可独立证明主体的凭据或认证方法，同时保留原认证路径与合法所有者活动，使持续访问继续呈现同一熟悉主体的外观。
  en: Adversaries add a credential or authentication method that can independently establish an existing principal while preserving
    the original authentication path and legitimate-owner activity, making continuing access retain the appearance of the
    same familiar principal.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 并行认证路径增补是攻击者在既有身份上增加一份能够独立完成主体认证的持久材料或方法，同时不撤销原有主要认证路径。新增对象可以是第二密码、应用或服务主体密钥、证书、SSH authorized key、MFA 方法或等价认证器；分类变量不是介质，而是“新增认证器与原认证器并存，任一条都能建立同一主体”。其直接目标是在合法所有者继续使用原路径时，为攻击者保留可单独调用的入口。
    en: Parallel Authentication-Path Augmentation is the addition of durable material or a method that can independently authenticate
      an existing identity without revoking its primary authentication path. The added object can be a second password, application
      or service-principal key, certificate, SSH authorized key, MFA method, or equivalent authenticator. The variable is
      not the medium but coexistence of a new and original authenticator, either able to establish the same principal. Its
      direct objective is to leave an independently invokable entry while the legitimate owner continues using the original
      path.
  - zh: 该子项只处理认证成立之前的身份入口，不包含认证完成后才生效的角色、组、委托或策略边，也不包含设备身份及设备条件信任。它要求新增路径在原会话之外仍可用，并能够与原路径分别撤销或使用；密码或证书原位替换、仅延长同一凭据，以及偷取但不写入状态的秘密仍属于父级或前置行为。
    en: This child concerns identity entry before authentication succeeds. It excludes roles, groups, delegations, or policy
      edges that act only after authentication and excludes device identity and device-condition trust. The added path must
      remain usable beyond the original session and be independently revocable or exercisable from the original path. In-place
      password or certificate replacement, extension of the same credential, and theft of a secret without state mutation
      remain parent behavior or a preceding technique.
stealth_characteristics:
  paragraphs:
  - zh: 并行认证路径增补通过并行认证路径保留账户名称、年龄、原认证方式与合法所有者活动；攻击者以后使用第二认证器时，令牌和资源事件仍归属于同一熟悉 principal ID。基于“新账户”“主密码已重置”或“原用户已恢复”的处置因此可能误以为入口已清除，主体级行为基线也可能同时吸收两名操作者。
    en: Parallel Authentication-Path Augmentation works because a parallel authentication path preserves account name, age,
      original authentication method, and legitimate-owner activity. When the adversary later uses the second authenticator,
      token and resource events still belong to the same familiar principal ID. Response based on a new account, primary-password
      reset, or owner recovery can therefore incorrectly assume the entry is gone, while one principal-level baseline may
      absorb activity from two controllers.
  - zh: 新增认证器不会不可见：变更审计或状态快照可显示 key、证书、方法或 authorized_keys 的新增，发起者、寿命、审批、首次认证方法和并发会话可恢复谱系。合法轮换、MFA 迁移、账户恢复与双 key 高可用会短暂形成同形并存，只有攻击者控制、异常寿命或后续使用才能把它与受控重叠区分。
    en: The added authenticator is not invisible. Change audit or state snapshots can show a new key, certificate, method,
      or authorized_keys entry, while initiator, lifetime, approval, first authentication method, and concurrent sessions
      can recover lineage. Legitimate rotation, MFA migration, account recovery, and dual-key high availability create temporary
      coexistence of the same shape. Adversary control, anomalous lifetime, or downstream use is required to distinguish it
      from controlled overlap.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入向变更前已经存在的主体新增可独立完成认证的密码、key、证书、SSH 授权、MFA 方法或等价认证器，并在变更后保留至少一条原认证路径。判定需要证明是新增而非替换、原路径仍有效或合法所有者仍可认证、新认证器由攻击者控制且在
      Persistence 时间范围内继续有效。
    en: Scope includes adding a password, key, certificate, SSH authorization, MFA method, or equivalent authenticator able
      to independently authenticate a principal that existed before the mutation while retaining at least one original authentication
      path. Classification requires proof of addition rather than replacement, continued validity of an original path or legitimate-owner
      authentication, adversary control of the new authenticator, and durability across a Persistence-relevant interval.
  - zh: 角色、组、邮箱或应用委托及资源策略归 NJS-0083-002；受控设备注册与设备信任归 NJS-0083-003；新建身份归 T1136，不修改状态的已有凭据使用归 T1078。合法轮换和迁移只有在重叠超过批准期限、所有者未知或新增认证器由攻击者保留使用时才进入本子项。
    en: Roles, groups, mailbox or application delegations, and resource policies belong to NJS-0083-002. Controlled-device
      registration and device trust belong to NJS-0083-003. A new identity belongs to T1136, and use of existing credentials
      without mutation belongs to T1078. Legitimate rotation or migration enters this child only when overlap exceeds approved
      lifetime, ownership is unknown, or the adversary retains and uses the new authenticator.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制具有认证状态写权限的管理会话后，可为仍在使用的用户、应用或服务主体增加第二 key、证书、MFA 方法或 SSH 授权，等待传播后从另一来源完成认证。即使当前令牌被撤销或主密码被重置，独立认证器仍可能签发新令牌或建立远程会话；后续邮件、云或主机活动不是分类依据。
      en: After controlling a management session with authentication-state write authority, an adversary can add a second
        key, certificate, MFA method, or SSH authorization to an active user, application, or service principal and authenticate
        from another origin after propagation. Even if the current token is revoked or the primary password reset, the independent
        authenticator may issue a new token or establish a remote session. Later mail, cloud, or host activity does not define
        the child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够新增而非只能替换认证器的权限、读取或推断现有认证状态的能力，以及对新增秘密、私钥或方法的持续控制。单 key 强制、所有者在场确认、抗钓鱼认证、短寿命、旧路径自动撤销和认证器级审批会限制变量；新增失败或陌生方法通知会暴露行动。
        en: The adversary needs authority to add rather than only replace an authenticator, the ability to read or infer current
          authentication state, and continuing control of the new secret, private key, or method. Single-key enforcement,
          owner-present confirmation, phishing-resistant authentication, short lifetime, automatic old-path revocation, and
          authenticator-level approval constrain the variable. Failed addition or unfamiliar-method notification can expose
          the operation.
    defender_model:
      paragraphs:
      - zh: 防守方需要能够区分认证器新增、替换与删除的变更审计或状态快照，并尽量在登录/令牌记录中取得 key ID、证书指纹、认证方法或 SSH key 指纹。精确键可证明新增路径被使用；只有 principal ID、IP 和资源时必须以首次来源、并发活动与审批差异作较弱关联。
        en: The defender needs change audit or state snapshots that distinguish authenticator addition, replacement, and deletion
          and, where possible, key ID, certificate fingerprint, authentication method, or SSH-key fingerprint in sign-in or
          token records. An exact key can prove use of the added path. With only principal ID, IP, and resource, analysis
          must rely on weaker correlation through first-seen origin, concurrent activity, and approval mismatch.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 保留原认证器使恶意和合法控制者共享同一身份实体特征
    en: Preserving the original authenticator makes malicious and legitimate controllers share identity features
  analysis:
    paragraphs:
    - zh: 攻击者在同一主体上增加独立认证器，却不删除原凭据或合法会话。后续活动仍携带相同账户、服务主体、域、年龄与业务关系，新认证器因此借用既有身份特征，削弱依赖新账户、主凭据替换或账户停用的分类，形成特征伪装。状态快照中的新增 key、异常寿命和并发认证仍提供区分信号。
      en: The adversary adds an independent authenticator to one principal without deleting original credentials or legitimate
        sessions. Later activity retains the same account, service principal, domain, age, and business relationships, allowing
        the new authenticator to borrow established identity features and weaken classification based on a new account, primary-credential
        replacement, or disablement, producing Feature Disguise. A new key in state snapshots, anomalous lifetime, and concurrent
        authentication remain discriminating signals.
    - zh: ATT&CK 直接记录向已有应用和服务主体增加凭据，Microsoft 直接观察到 NOBELIUM 创建额外服务主体凭据；官方指南要求根据正常流程、凭据类型和寿命监控新增。来源证明行为与持久目的，但没有为每个实例证明保留原路径是主观伪装选择，因此保持
        medium。
      en: ATT&CK directly documents credentials added to existing applications and service principals, and Microsoft directly
        observed NOBELIUM creating additional service-principal credentials. Official guidance evaluates additions against
        normal workflow, credential type, and lifetime. The sources establish behavior and persistence purpose but do not
        prove for every instance that retaining the old path was a subjective disguise choice, so confidence remains medium.
  evidence_refs:
  - REF-000144
  - REF-000110
  - REF-000145
  - REF-000146
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 新增认证器的变更和首次使用需要跨身份控制面恢复
    en: Mutation and first use of the added authenticator require cross-identity-plane reconstruction
  analysis:
    paragraphs:
    - zh: 认证器新增首先出现在目录、IdP、应用或本地授权配置，持久效果则在稍后的认证或令牌签发中出现。登录事件可能不携带具体 key 或方法 ID；只看变更无法知道是否使用，只看登录又会归到熟悉主体。缺少认证器级或长窗口主体关联时，该因果关系形成行为透明。
      en: Authenticator addition first appears in directory, IdP, application, or local-authorization state, while the persistence
        effect appears in later authentication or token issuance. A sign-in may omit the concrete key or method ID. Mutation
        alone cannot show use, and sign-in alone is attributed to the familiar principal. Without authenticator-level or long-window
        principal correlation, the causal relationship produces Behavioral Transparency.
    - zh: Microsoft 的 NOBELIUM 查询把休眠服务主体凭据更新与后续登录连接，应用和特权账户指南分别提供变更与认证字段，支持该链条但不能保证所有平台都可精确匹配。发起者、modified properties、key
        ID、寿命与首次使用仍可恢复关系，因此为 medium。
      en: Microsoft's NOBELIUM query joins dormant-service-principal credential update to later sign-in, and application and
        privileged-account guidance supplies mutation and authentication fields. This supports the chain without guaranteeing
        exact matching on every platform. Initiator, modified properties, key ID, lifetime, and first use can reconstruct
        the relationship, supporting medium confidence.
  evidence_refs:
  - REF-000110
  - REF-000145
  - REF-000146
  - REF-000147
  confidence: medium
