research:
  limitations:
    paragraphs:
    - zh: 直接案例集中在 Entra 应用与服务主体额外凭据，ATT&CK 扩展到云凭据和 SSH key；共同变量允许跨平台分类，但不证明所有系统具有相同认证器 ID、日志保留或匿迹效果。每个新实例仍需证明认证器新增、原路径有效、攻击者控制和后续使用。
      en: Direct cases center on additional Entra application and service-principal credentials, while ATT&CK extends behavior
        to cloud credentials and SSH keys. The shared variable permits cross-platform classification but does not establish
        identical authenticator IDs, retention, or evasion effect in every system. Each new instance still requires proof
        of addition, original-path validity, adversary control, and downstream use.
    - zh: 服务主体登录、SSH 或旧身份系统可能只记录 principal ID，无法证明具体新增 key 被使用。此时检测只能形成主体级强推断；合法轮换和恢复所需的短期并存也限制归因。不能取得 old/new 值、精确认证器或批准窗口时，应降低事件置信度。
      en: Service-principal sign-in, SSH, or legacy identity systems may record only principal ID and cannot prove use of
        a concrete added key. Detection then remains principal-level strong inference, while brief coexistence required for
        legitimate rotation or recovery limits attribution. Event confidence must fall when old and new values, an exact authenticator,
        or the approved overlap window are unavailable.
