schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0083-002
parent_ref: NJT-0083
name:
  zh: 间接授权图增补
  en: Indirect Authorization-Graph Augmentation
summary:
  zh: 攻击者向既有主体增加角色、组、委托或策略边，在不改变认证方法的情况下扩大有效权限，使后续访问继续呈现正常登录与熟悉身份。
  en: Adversaries add role, group, delegation, or policy edges to an existing principal, expanding effective privilege without
    changing authentication and leaving later access with normal sign-in and familiar-identity features.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 间接授权图增补是攻击者在既有用户、服务主体或等价身份与角色、组、应用、邮箱、容器集群或资源策略之间新增一条持久授权边，使主体通过直接或传递关系取得原来没有的访问。分类变量是“认证状态保持不变而有效授权图改变”：攻击者仍以原密码、密钥或会话完成认证，但授权决策沿新增边产生更大资源范围或管理能力。
    en: 'Indirect Authorization-Graph Augmentation is the addition of a durable authorization edge between an existing user,
      service principal, or equivalent identity and a role, group, application, mailbox, container cluster, or resource policy,
      giving the principal new access through direct or transitive relationships. The classification variable is unchanged
      authentication state with a changed effective-authorization graph: the adversary authenticates with the original password,
      key, or session, while authorization follows the new edge to produce broader resources or administrative capability.'
  - zh: 本子项不按云角色、邮件委托、容器角色或本地域组分裂，因为这些对象共享“身份到权限的图边”及传递解析需求。它也不同于并行认证路径：新增边不能单独证明身份，而是在身份已经认证后改变允许的操作；不同于新建账户，因为目标主体及其历史活动在变更前已存在。
    en: 'The child does not split by cloud role, mail delegation, container role, or local group because these objects share
      an identity-to-privilege graph edge and a requirement for transitive resolution. It also differs from a parallel authentication
      path: the new edge cannot establish identity by itself and instead changes permitted action after authentication. It
      differs from account creation because the target principal and its activity history predate the mutation.'
stealth_characteristics:
  paragraphs:
  - zh: 间接授权图增补通过增补授权边不会必然改变登录方法、设备、账户名称或认证风险。后续资源事件仍显示一个已存在且成功正常认证的主体，局部系统可能只看到“允许”结果，而看不到权限来自哪个嵌套组、委托、角色绑定或资源策略。依赖新凭据、失败登录或显式管理员角色名称的规则会遗漏从间接边导出的能力。
    en: Indirect Authorization-Graph Augmentation works because adding an authorization edge need not change sign-in method,
      device, account name, or authentication risk. Later resource events still show an established principal that authenticated
      normally, while a local system may expose only an allowed result without the nested group, delegation, role binding,
      or resource policy that supplied privilege. Rules dependent on a new credential, failed sign-in, or an explicit administrator-role
      name miss capability derived through an indirect edge.
  - zh: 授权变更本身不会消失：发起者、目标主体、边类型、作用域、旧值与新值、审批和到期仍可见；周期快照可发现无日志的状态差异。防守方还可在访问时展开有效权限图，把新增边连接到首次高价值操作。岗位调整、入职、代理工作和自动化部署会形成相同图变化，因此必须用所有者、工单、预期作用域与使用结果排除合法解释。
    en: 'The authorization mutation does not disappear: initiator, target principal, edge type, scope, old and new values,
      approval, and expiry remain observable, and periodic snapshots can expose unlogged state differences. Defenders can
      also resolve the effective graph at access time and join the new edge to a first high-value action. Role change, onboarding,
      delegated work, and automated deployment produce the same graph shape, requiring owner, change record, expected scope,
      and use outcome to exclude legitimate explanations.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对既有主体新增或恢复角色分配、组成员关系、应用或邮箱委托、容器集群角色绑定、资源策略主体项及等价持久授权边，并使该边在原会话之外继续影响访问。判定需要证明主体预先存在、授权边为新增或恢复、有效权限因直接或传递解析发生变化，以及攻击者能够调用或维持该结果。
    en: Scope includes adding or restoring a role assignment, group membership, application or mailbox delegation, container-cluster
      role binding, resource-policy principal entry, or equivalent durable authorization edge for an existing principal when
      the edge continues to affect access beyond the original session. Classification requires proof that the principal pre-existed,
      the edge was added or restored, effective privilege changed through direct or transitive resolution, and the adversary
      could invoke or preserve the result.
  - zh: 新增密码、key 或认证方法归 NJS-0083-001；注册受控设备并依赖设备信任归 NJS-0083-003；仅在当前会话内的 JIT 激活、资源自身的普通 ACL 使用或不改变状态的有效账户访问不纳入。合法角色变更若具有匹配审批、最小作用域、预期期限和所有者确认，不因权限扩大自动成为匿迹行为。
    en: A new password, key, or authentication method belongs to NJS-0083-001. Registration of a controlled device that relies
      on device trust belongs to NJS-0083-003. JIT activation valid only in the current session, ordinary use of an existing
      resource ACL, or valid-account access without state change is excluded. A legitimate role change with matching approval,
      minimum scope, expected lifetime, and owner confirmation does not become evasion merely because privilege increases.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制能够写入 IAM、目录、邮件、SaaS、容器或资源策略的管理会话后，可把一个日常用户或服务主体加入嵌套高权限组、授予应用角色或邮箱委托，或在资源策略中加入该主体。待授权传播后，攻击者仍用原认证方式访问敏感资源；若主要调查只关注账户登录异常，持久授权边可能在会话撤销后继续提供入口。
      en: After controlling a management session able to write IAM, directory, mail, SaaS, container, or resource policy state,
        an adversary can place an ordinary user or service principal in a nested privileged group, grant an application role
        or mailbox delegation, or add the principal to a resource policy. After propagation, the adversary uses the original
        authentication method to reach sensitive resources. If investigation focuses only on sign-in anomalies, the durable
        authorization edge may remain available after session revocation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要写入至少一类授权边的权限，并理解继承、嵌套、deny/allow 优先级、令牌刷新和作用域传播；还需保留可认证为目标主体的路径。职责分离、按目标限定的 JIT、禁止自授予、所有者审批、短到期和持续有效权限分析会提高成本。错误作用域、显著高权限角色或批量变更可能立即触发审计。
        en: The adversary needs authority to write at least one authorization-edge class, knowledge of inheritance, nesting,
          deny or allow precedence, token refresh, and scope propagation, and a continuing way to authenticate as the target
          principal. Separation of duties, target-bounded JIT, prevention of self-grant, owner approval, short expiry, and
          continuous effective-access analysis raise cost. Incorrect scope, a conspicuous high-privilege role, or bulk mutation
          can trigger immediate review.
    defender_model:
      paragraphs:
      - zh: 防守方需要授权变更审计与周期图快照，能够规范发起者、目标主体、边 ID、资源作用域、父子组、委托链、旧值/新值和审批；访问侧还需主体、令牌、目标资源、动作与授权结果。若只采集最终组名、不展开嵌套关系或资源服务不记录实际授权路径，就只能证明变更与访问相邻，不能精确归因哪条边授权了操作。
        en: The defender needs authorization-change audit and periodic graph snapshots normalized around initiator, target
          principal, edge ID, resource scope, parent and child groups, delegation chain, old and new values, and approval.
          The access side also needs principal, token, target resource, action, and authorization result. If collection records
          only a final group name, omits nested resolution, or a resource service does not expose the actual authorization
          path, analysis can establish adjacency between mutation and access but cannot precisely attribute which edge authorized
          the action.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 新授权能力继承既有主体的正常认证与身份外观
    en: New authorization capability inherits the established principal's normal authentication and identity appearance
  analysis:
    paragraphs:
    - zh: 攻击者不引入新的登录主体或认证材料，而是在既有身份图中加入权限边。资源调用因此保留熟悉 principal ID、原认证方法和既有账户年龄，新增能力只在完整解析授权图时显现。基于新账户、新凭据或显式管理员身份的粗粒度特征被既有主体外观替代，形成特征伪装；新增边、异常发起者与超范围结果仍是残余差异。
      en: The adversary introduces neither a new sign-in principal nor authentication material, instead adding a privilege
        edge to an established identity graph. Resource calls retain a familiar principal ID, original authentication method,
        and account age, while new capability appears only when the full authorization graph is resolved. Established-principal
        appearance substitutes for coarse features based on new accounts, credentials, or explicit administrator identities,
        producing Feature Disguise. The added edge, unusual initiator, and out-of-scope result remain residual differences.
    - zh: ATT&CK 与现场报告直接记录向既有云账户附加角色或策略，Microsoft 对 NOBELIUM 的调查直接观察到向用户和应用授予角色；安全运营指南要求同时监控角色变更与登录/资源情境。这些来源证明行为和持久用途，但不同系统是否因间接边而漏检仍依赖本地解析能力，因此机理为
        medium。
      en: ATT&CK documentation describes roles or policies attached to existing cloud accounts, and Microsoft's
        NOBELIUM investigation directly observed roles granted to users and applications. Security-operations guidance calls
        for role-change monitoring together with sign-in or resource context. These sources establish the behavior and persistence
        purpose, while whether an indirect edge defeats detection depends on local graph resolution, so the mechanism is medium
        confidence.
