research:
  limitations:
    paragraphs:
    - zh: 直接案例集中在 Azure AD 角色与应用授权，ATT&CK 则提供跨云角色和策略的行为范围；邮件、容器、本地组与资源策略进入本子项依赖共同的授权图变量，不能据此宣称所有平台具有相同审计字段或规避效果。每个新实例仍需证明授权边、有效权限变化与持续使用。
      en: Direct case evidence centers on Azure AD roles and application grants, while ATT&CK broadens behavior to cloud roles
        and policies. Mail, container, local-group, and resource-policy implementations enter through the common authorization-graph
        variable, not a claim that every platform has identical audit fields or evasion effect. Each new instance still requires
        proof of the edge, effective privilege change, and continuing use.
    - zh: 许多服务只记录最终 allow/deny，不保留求值时使用的嵌套组、委托链或策略版本；长寿命令牌也可能使授权变更与访问生效时间错位。无法精确解析时，应把检测结论降为主体级强推断，并保留岗位变更、自动化与紧急授权等替代解释。
      en: Many services record only final allow or deny and omit the nested group, delegation chain, or policy version used
        during evaluation. Long-lived tokens can also separate mutation time from authorization effect. Without exact resolution,
        detection should degrade to principal-level strong inference and preserve role change, automation, and emergency authorization
        as alternatives.
