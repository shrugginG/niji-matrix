research:
  limitations:
    paragraphs:
    - zh: 直接案例与运营字段来自 Microsoft Azure AD/Entra 生态，足以证明设备身份绑定变量，但不自动证明其他 IdP、MDM 或证书注册产品产生同样令牌语义。其他实现进入本子项前必须证明持久设备关系参与后续信任决策，并提供独立于普通凭据的撤销需求。
      en: Direct case and operational fields come from the Microsoft Azure AD or Entra ecosystem. They establish the device-identity
        binding variable but do not automatically show identical token semantics in every IdP, MDM, or certificate-enrollment
        product. Another implementation requires proof that a durable device relationship participates in later trust decisions
        and has revocation needs independent of ordinary credentials.
    - zh: 公开案例没有公开每个受害者的 device ID、PRT、条件访问结论和资源访问完整链，因而精确事件级因果仍需本地遥测验证。合法 BYOD 与自助注册可能高度相似；缺少资产、审批和认证强度时，应降低具体事件置信度，而不是降低已证实分类变量本身。
      en: The public case does not expose a complete device ID, PRT, Conditional Access result, and resource-access chain
        for every victim, so exact event-level causality requires local telemetry. Legitimate BYOD and self-service enrollment
        can be highly similar. Missing asset, approval, and authentication-strength data should lower confidence in an event,
        not in the evidenced classification variable itself.
