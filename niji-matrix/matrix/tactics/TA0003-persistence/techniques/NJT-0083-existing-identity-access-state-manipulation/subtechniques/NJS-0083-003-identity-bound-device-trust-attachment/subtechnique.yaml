schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0083-003
parent_ref: NJT-0083
name:
  zh: 身份绑定设备信任附着
  en: Identity-Bound Device-Trust Attachment
summary:
  zh: 攻击者把受控设备注册或加入既有身份的信任域，使后续令牌与访问携带已注册、已加入或满足设备条件的特征，并形成独立于主密码的持续路径。
  en: Adversaries register or join a controlled device into an existing identity's trust domain so later tokens and access
    carry registered, joined, or policy-satisfying device features and preserve a path independent of the primary password.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 身份绑定设备信任附着是攻击者使用已经控制的身份，把攻击者控制的终端注册、加入或等价绑定到组织的身份与设备管理体系，使平台为该终端建立持久 device ID、所有者/注册者关系、信任类型或合规关联。直接目标不是增加一个普通密码或角色，而是让后续认证、PRT、令牌或条件访问把该终端视为已知设备，从而在当前会话结束后继续取得访问。
    en: Identity-Bound Device-Trust Attachment occurs when an adversary uses an already controlled identity to register, join,
      or equivalently bind an attacker-controlled endpoint to an organization's identity and device-management system, causing
      the platform to create durable device ID, owner or registrant relationship, trust type, or compliance association. The
      direct objective is not to add an ordinary password or role, but to make later authentication, Primary Refresh Token,
      token, or Conditional Access processing treat the endpoint as a known device and preserve access after the current session
      ends.
  - zh: 分类变量是“既有主体与受控设备身份之间新增持久信任关系”。设备型号、操作系统、MDM 产品和注册协议只是实现；只有设备关系能够影响认证或策略判定并为攻击者保留后续入口时才纳入。若设备仅被发现于清单但不参与信任决策，或攻击者只盗用一台已注册设备而不改变状态，则不属于本子项。
    en: The classification variable is a new durable trust relationship between an existing principal and a controlled device
      identity. Device model, operating system, MDM product, and enrollment protocol are implementations. The relationship
      qualifies only when it affects authentication or policy decisions and preserves a later entry for the adversary. A device
      merely discovered in inventory without participating in trust, or theft and use of an already registered device without
      state change, is outside this child.
stealth_characteristics:
  paragraphs:
  - zh: 身份绑定设备信任附着通过注册后，攻击者设备可以在令牌和访问事件中呈现租户已知的 device ID、加入状态或设备条件结果。原本可区分的非受管终端由组织信任属性替代，依赖“未知设备”“未注册设备”或每次 MFA 挑战的规则会降低区分力。ATT&CK
      明确把此行为映射到 Persistence 与 Defense Evasion，并说明其可绕过基于 MFA 或条件访问的控制。
    en: Identity-Bound Device-Trust Attachment works because after registration, the adversary device can present a tenant-known
      device ID, join state, or device-condition result in token and access events. Organization trust attributes replace
      the previously distinguishing unmanaged-endpoint features, weakening rules based on unknown devices, unregistered devices,
      or a fresh MFA challenge on every access. ATT&CK explicitly maps the behavior to Persistence and Defense Evasion and
      states that it can bypass controls based on MFA or Conditional Access.
  - zh: 设备对象与注册动作仍留下稳定痕迹，包括注册/加入活动、发起主体、device ID、所有者、信任类型、认证强度、PRT 或令牌、合规状态、首次登录来源和条件访问结果。合法新设备部署、硬件更换、自助注册和灾难恢复会产生同形记录；异常必须结合审批、资产清单、管理证书、网络来源以及注册后用途判断。
    en: The device object and enrollment action still leave durable evidence including register or join activity, initiating
      principal, device ID, owner, trust type, authentication strength, PRT or token, compliance state, first sign-in origin,
      and Conditional Access result. Legitimate deployment, hardware replacement, self-service enrollment, and disaster recovery
      create similar records. Anomaly assessment therefore needs approval, asset inventory, management certificate, network
      origin, and post-registration use.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者将自有或受控设备注册、加入、重新启用或转移到既有身份/租户的设备信任域，并使设备状态可用于后续认证、令牌签发或访问策略。判定需要证明目标身份预先存在、设备关系由攻击者或受控会话建立、关系在当前会话之外持续，以及后续访问能够使用或受益于该设备信任。
    en: Scope includes adversary registration, join, re-enablement, or transfer of an owned or controlled device into an existing
      identity or tenant's device-trust domain when device state can affect later authentication, token issuance, or access
      policy. Classification requires proof that the target identity pre-existed, the relationship was established by the
      adversary or a controlled session, it persisted beyond the current session, and later access could exercise or benefit
      from device trust.
  - zh: 新增密码、证书密钥或认证方法归 NJS-0083-001；仅新增角色、组或委托归 NJS-0083-002；盗取 PRT、会话或设备证书但不改变注册状态属于凭据/会话取得与使用。管理员批准的新员工设备、合规重注册和硬件更换是合法反例，不能仅因一次设备注册即归因恶意。
    en: A new password, certificate key, or authentication method belongs to NJS-0083-001. A role, group, or delegation edge
      alone belongs to NJS-0083-002. Theft of a PRT, session, or device certificate without registration-state mutation belongs
      to credential or session acquisition and use. Administrator-approved employee enrollment, compliance re-enrollment,
      and hardware replacement are legitimate alternatives; one device registration cannot establish maliciousness by itself.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得尚未强制 MFA 或仍允许自助设备注册的账户后，可从自有终端发起注册或加入，获得租户设备对象与相关令牌，再访问邮件、云应用或其他受设备条件保护的资源。即使防守方随后重置账户密码，恶意设备对象、活动会话或设备相关令牌仍需分别删除与撤销；Microsoft
        调查明确提出了这种全路径处置要求。
      en: After compromising an account that lacks enforced MFA or still permits self-service device enrollment, an adversary
        can initiate registration or join from a controlled endpoint, obtain a tenant device object and related token, and
        then reach mail, cloud applications, or other resources protected by device conditions. Even if defenders later reset
        the account password, the rogue device object, active sessions, and device-related tokens require separate removal
        or revocation; Microsoft's investigation explicitly prescribes this all-path response.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可完成设备注册/加入的既有身份会话、自有设备与密钥控制、满足或绕过注册时认证的能力，以及对租户设备策略和后续入口的理解。注册配额、强制抗钓鱼 MFA、管理员审批、硬件证明、MDM 合规、仅受管网络注册和短期令牌会提高成本。重复失败注册、异常平台或注册后立即访问高价值资源可能暴露行动。
        en: The adversary needs an existing identity session able to register or join a device, control of an endpoint and
          its keys, the ability to satisfy or evade enrollment-time authentication, and knowledge of tenant device policy
          and the later entry. Enrollment quotas, phishing-resistant MFA, administrator approval, hardware attestation, MDM
          compliance, managed-network-only enrollment, and short-lived tokens raise cost. Repeated failed registration, an
          unusual platform, or immediate high-value access after enrollment can expose the operation.
    defender_model:
      paragraphs:
      - zh: 防守方需要设备注册/加入审计、设备目录与历史快照、认证强度、PRT/令牌、登录、条件访问、MDM 合规和资产清单，并按 tenant、user、device ID、session/token ID、IP 与时间关联。若令牌日志不暴露
          device ID 或认证声明、设备对象可被重建而历史不保留，分析只能证明主体附近出现新设备，不能证明具体访问使用了该信任。
        en: The defender needs device register or join audit, device directory and historical snapshots, authentication strength,
          PRT or token, sign-in, Conditional Access, MDM compliance, and asset inventory joined by tenant, user, device ID,
          session or token ID, IP, and time. If token logs omit device ID or authentication claims, or device objects can
          be recreated without retained history, analysis can only show a new device near the principal rather than prove
          that a particular access exercised that trust.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 注册关系让受控终端继承组织设备信任特征
    en: The registration relationship lets a controlled endpoint inherit organization device-trust features
  analysis:
    paragraphs:
    - zh: 攻击者把终端加入身份与设备控制面后，后续请求可以携带已注册或已加入的 device ID、PRT 强认证声明或满足设备条件的结果。防守判据看到的不再是陌生非受管终端，而是具备组织赋予信任属性的设备；攻击者借信任特征替代真实所有权与管理来源差异，形成特征伪装。注册发起者、资产不匹配和首次用途仍能揭示该替代。
      en: Once the adversary places an endpoint in the identity and device control plane, later requests can carry a registered
        or joined device ID, PRT strong-authentication claim, or a device-condition result. Defensive criteria no longer see
        an unknown unmanaged endpoint but a device with organization-issued trust attributes. The adversary substitutes trust
        features for differences in true ownership and management provenance, producing Feature Disguise. Enrollment initiator,
        asset mismatch, and first use can still reveal the substitution.
    - zh: ATT&CK 直接说明攻击者注册设备可用于持续访问并绕过 MFA 或条件访问；Microsoft 设备安全运营指南解释设备身份、PRT 与监控字段，事件报告又直接观察恶意注册并要求删除设备。行为、规避用途和恢复差异均有同级来源，因此本机理及子项为
        high；但不能把所有已注册设备活动视为恶意。
      en: ATT&CK directly states that adversary device registration can maintain access and bypass MFA or Conditional Access.
        Microsoft's device security-operations guidance explains device identity, PRT, and monitoring fields, while its incident
        report directly observes rogue registration and requires device removal. Peer-level sources cover behavior, evasion
        purpose, and recovery difference, supporting high confidence for the mechanism and child without treating all registered-device
        activity as malicious.
