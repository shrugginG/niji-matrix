schema_version: 2.0.0
type: technique
id: NJT-0083
name:
  zh: 既有身份访问状态操纵
  en: Existing-Identity Access-State Manipulation
summary:
  zh: 攻击者更改既有身份的持久认证、授权或设备信任状态，使立足点跨会话继续或恢复使用；三类状态通过不同键影响后续访问，并共同利用控制面变更与使用事件之间的观察断点。
  en: Adversaries change durable authentication, authorization, or device-trust state of an existing identity so a foothold
    continues or can be restored across sessions. The three state classes affect later access through different keys while
    exploiting observation breaks between control-plane mutation and use.
aliases:
- Account Manipulation
classification:
  tactic_refs:
  - TA0003
  - TA0004
  origin:
    kind: attack-retained
    source_attack_id: T1098
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1098
definition_and_concept:
  paragraphs:
  - zh: 既有身份访问状态操纵是攻击者更改已经存在的用户、服务主体、设备主体或等价账户所关联的持久认证与授权状态，使攻击者在当前会话结束、主要凭据变化或局部处置后仍能继续或恢复访问的技术。可被改变的对象包括密码与密钥、认证方法、设备信任、组和角色成员关系、应用或邮件委托以及其他能够跨会话授予访问的身份图边。其直接目标是把暂时掌握的写权限转化为后续可再次调用的身份入口，从而服务于
      Persistence。
    en: Existing-Identity Access-State Manipulation is a technique in which an adversary changes durable authentication and
      authorization state associated with an already existing user, service principal, device principal, or equivalent account
      so access remains or can be restored after the current session ends, the primary credential changes, or partial remediation
      occurs. Mutable objects include passwords and keys, authentication methods, device trust, group and role memberships,
      application or mail delegation, and other identity-graph edges that grant access across sessions. Its direct objective
      is to convert temporary write authority into an identity entry that can be invoked later, serving Persistence.
  - zh: 本技术的概念锚是“既有身份上的可持续访问状态变更”，不是执行变更的命令、管理门户、API、平台或凭据介质。一次变更可以同时带来权限提升，但只有能够继续生效并保存或恢复访问的部分属于 TA0003；后续登录、令牌签发和资源操作证明状态被使用，却不扩张父对象边界。账户名称和正常所有者活动可以完全不变，决定归类的是攻击者是否控制了身份状态及其持久效果。
    en: The conceptual anchor is a durable access-state mutation on an existing identity, not the command, administrative
      portal, API, platform, or credential medium used to make it. A mutation can also elevate privilege, but only the part
      that continues to take effect and preserves or restores access belongs under TA0003. Later sign-in, token issuance,
      and resource operations evidence use of the state without expanding the parent boundary. Account name and legitimate-owner
      activity may remain unchanged; classification turns on adversary control of identity state and its durable effect.
  - zh: 同一状态变化既可让访问跨会话持续，也可能扩大主体的有效权限。前者服务于持久化；后者只有在新增认证路径、授权边或设备信任确实带来此前没有的资源访问时，才同时服务于权限提升。
    en: The same state change can preserve access across sessions or expand a principal’s effective authority. The former
      serves Persistence; the latter also serves Privilege Escalation only when the added authentication path, authorization
      edge, or device trust actually enables resource access that was previously unavailable.
stealth_characteristics:
  paragraphs:
  - zh: 既有身份访问状态操纵的核心匿迹矛盾是，攻击者必须在身份系统中留下足以让未来认证或授权成功的持久变更，却希望防守方只把它看作常规管理，并把后续访问看作熟悉主体的正常活动。变更出现在目录、IAM、应用授权、端点配置或本地文件中，实际使用则出现在登录、令牌、远程服务或资源审计中；两侧可能采用不同事件、主体键、时间粒度和保留期。只审计管理员操作或只分析成功登录都无法证明哪次变更建立了哪条持续入口。
    en: The central stealth tension in Existing-Identity Access-State Manipulation is that an adversary must leave a durable
      mutation sufficient for future authentication or authorization while hoping defenders interpret it as routine administration
      and later access as normal activity by a familiar principal. The mutation appears in directory, IAM, application-permission,
      endpoint-configuration, or local-file data, whereas use appears in sign-in, token, remote-service, or resource audit.
      The two sides can use different events, principal keys, time granularity, and retention. Auditing only administrative
      operations or analyzing only successful sign-ins cannot establish which mutation created which continuing entry.
  - zh: 非替换式变更还可以让主要凭据、原角色和合法所有者活动继续存在，使账户名称、年龄、业务关系、服务主体声誉和常见资源用途保持不变。恶意与合法操作者共享同一实体特征，粗粒度“新账户”“密码已重置”或“账户已恢复”判据因此不足。匿迹并不消除痕迹：变更发起者、modified
      properties、旧值与新值、key 或角色标识、到期时间、审批差异、首次使用来源和并发会话仍能恢复身份状态谱系；不可变审计和长期状态快照会显著限制效果。
    en: 'A non-displacing mutation can leave the primary credential, original roles, and legitimate-owner activity intact,
      preserving account name, age, business relationships, service-principal reputation, and common resource use. Malicious
      and legitimate controllers then share entity features, making coarse criteria such as new account, password reset, or
      account recovered insufficient. Stealth does not erase evidence: initiator, modified properties, old and new values,
      key or role identifiers, expiry, approval mismatch, first-use origin, and concurrent sessions can recover identity-state
      lineage. Immutable audit and long-lived state snapshots materially constrain the effect.'
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击者对既有主体的密码、密钥、认证方法、设备信任、组、角色、应用权限、邮箱委托、SSH 授权或等价持久访问边进行新增、替换、延长、恢复或删除，并使该变更在原会话之外继续保存或恢复访问。判定至少需要证明目标身份在变更前已经存在、攻击者或被其控制的主体发起了状态变化，以及变化具有后续可用性；工具名称、云与本地平台、账户类型和凭据格式只影响实现，不构成
      Niji 子技术。
    en: This technique includes adversary addition, replacement, extension, restoration, or removal of a password, key, authentication
      method, device trust, group, role, application permission, mailbox delegation, SSH authorization, or equivalent durable
      access edge on an existing principal when the mutation preserves or restores access beyond the original session. Classification
      requires evidence that the target identity existed before the mutation, that the adversary or a controlled principal
      initiated the state change, and that the change remained usable later. Tool name, cloud versus local platform, account
      type, and credential format shape implementation but do not form Niji children.
  - zh: 新建用户或服务身份归 T1136；只用已有密码、令牌或会话而不改变状态归 T1078；取得秘密、转储凭据或钓鱼认证材料属于前置行为。改变 AD FS、PAM 模块或其他全局认证过程而对任意主体生效归 T1556；一次 JIT 激活或仅在当前会话有效的权限不属于
      Persistence 下的本技术；新建或操纵独立云应用集成并依靠其许可维持访问时，应与 T1671 按“既有身份状态边”对“集成对象与工作流”划界。合法轮换、恢复、入职、岗位变更、设备迁移和服务高可用都会产生相似变更，必须保留为替代解释。
    en: Creation of a new user or service identity belongs to T1136; use of an existing password, token, or session without
      state mutation belongs to T1078; secret acquisition, credential dumping, and phishing authentication material are preceding
      behaviors. Changes to AD FS, PAM modules, or another global authentication process that affect arbitrary principals
      belong to T1556. One JIT activation or privilege valid only for the current session is outside this Persistence object.
      Creation or manipulation of an independent cloud application integration whose grant sustains access is separated from
      T1671 by existing-identity state edge versus integration object and workflow. Legitimate rotation, recovery, onboarding,
      role change, device migration, and service high availability produce similar mutations and remain alternative explanations.
  - zh: 恢复同等权限的访问只属于持久化。若攻击者在变更前已经能够完成相同操作，或新增状态尚未被认证、授权或资源决策实际采用，就不能把账户具有高权限标签当作权限提升。
    en: Restoring access at equivalent authority belongs only to Persistence. If the adversary could already perform the same
      operation before the change, or the new state has not actually been consumed by authentication, authorization, or a
      resource decision, a privileged account label does not establish Privilege Escalation.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者通常在已取得可管理身份、目录、应用、主机或资源授权的会话后使用本技术，把可能被注销、过期或发现的当前访问转换为更持久的入口。场景包括在既有服务主体上增加密钥，在用户上增加认证方法或受信设备，把既有主体加入可远程访问或高权限的组与角色，建立邮箱或应用委托，或改变本地授权文件。触发点是攻击者能够写入目标状态；后继目的可以是再次登录、签发令牌、访问邮件、管理资源或恢复其他驻留组件。
      en: An adversary typically uses this technique after obtaining a session able to administer identities, directories,
        applications, hosts, or resource authorization, converting current access that may be revoked, expire, or be discovered
        into a more durable entry. Scenarios include adding a key to an established service principal, adding an authentication
        method or trusted device to a user, placing an existing principal in a remote-access or privileged group or role,
        establishing mail or application delegation, or changing local authorization files. The trigger is the ability to
        write target state; follow-on purposes include signing in again, issuing tokens, accessing mail, administering resources,
        or restoring another resident component.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制具备相应写权限的账户、会话、主机进程或管理接口，并知道目标主体、访问边语义、权限继承、令牌或认证传播延迟以及变更后如何调用新路径。非替换式增补还要求平台允许同一主体同时拥有多个凭据、认证方法、成员关系或委托。强认证、隔离管理站、JIT
          权限、双人审批、key 数量与寿命限制、目录保护和不可变日志会增加成本；错误修改可能锁定账户、触发高风险告警或中断业务，从而暴露行动。
        en: The adversary needs control of an account, session, host process, or administrative interface with the relevant
          write authority and knowledge of the target principal, access-edge semantics, privilege inheritance, token or authentication
          propagation delay, and how to invoke the new path. Non-displacing augmentation additionally requires a platform
          that permits multiple credentials, authentication methods, memberships, or delegations on one principal. Strong
          authentication, isolated administration, JIT authority, two-person approval, key-count and lifetime limits, directory
          protection, and immutable logging raise cost. An incorrect mutation can lock the account, trigger a high-risk alert,
          or interrupt business and expose the operation.
    defender_model:
      paragraphs:
      - zh: 防守方模型假定能够取得身份或目录变更审计、周期状态快照、审批工作流、登录与令牌、设备、远程服务和资源访问数据，并把时间、租户或设备、变更发起者、目标主体和访问边标识规范到共同关联空间。能够记录 old/new 值、key
          或认证方法 ID、角色与委托边和请求 ID 的平台可以证明具体路径；只记录主体、IP、状态和资源的平台只能形成主体级推断。日志必须保留到凭据或授权到期与撤销，短窗口会遗漏延迟使用。
        en: The defender model assumes access to identity or directory change audit, periodic state snapshots, approval workflow,
          sign-in and token, device, remote-service, and resource-access data, with time, tenant or device, initiator, target
          principal, and access-edge identifiers normalized into a common correlation space. Platforms recording old and new
          values, key or authentication-method IDs, role and delegation edges, and request IDs can prove a specific path.
          Platforms recording only principal, IP, status, and resource permit only principal-level inference. Logs must remain
          available through credential or entitlement expiry and revocation; short windows miss delayed use.
      - zh: 防守方不能把任何高权限变更等同于恶意。密钥轮换、MFA 迁移、账户恢复、入职、岗位调整、同步目录、自动化部署和应急访问都可能形成相同局部事件，因而需要业务所有者、变更单、正常管理来源、预期寿命和后续用途作为反例。若攻击者控制批准工作流或可信管理主机，或本地授权状态没有集中采集，观察模型会留下关键盲区。
        en: Defenders cannot equate every privileged mutation with maliciousness. Key rotation, MFA migration, account recovery,
          onboarding, role adjustment, directory synchronization, automated deployment, and emergency access can produce the
          same local event, so business owner, change record, expected administrative origin, intended lifetime, and downstream
          use are necessary counter-explanations. Critical blind spots remain when the adversary controls the approval workflow
          or trusted administrative host or when local authorization state is not collected centrally.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 身份变更与后续使用分布在不同控制面和时间点
    en: Identity mutation and later use are distributed across control planes and time
  analysis:
    paragraphs:
    - zh: 攻击者先在身份控制面写入凭据或授权状态，随后由同一目标主体取得令牌、建立会话或访问资源。前一阶段的审计回答变更发起者和状态差异，后一阶段的事件通常只显示通过认证的主体与操作结果；Microsoft 还指出应用和服务主体更新可能产生两条记录，服务主体登录又按主体、状态、IP
        和资源聚合。若系统没有保存访问边标识并执行跨源关联，单条管理事件和单条成功访问都可能落在既有规则允许范围内，关键的“该变更造成该未来访问”关系无法被理解，形成行为透明。
      en: The adversary first writes credential or authorization state in the identity control plane, after which the target
        principal obtains a token, creates a session, or accesses a resource. Audit in the first phase identifies initiator
        and state difference, while the later event commonly shows only the authenticated principal and operation outcome.
        Microsoft also notes that application and service-principal updates can produce two records and that service-principal
        sign-ins are aggregated by principal, status, IP, and resource. Without retaining access-edge identifiers and correlating
        sources, an individual administrative event and successful access may both fall within existing allow logic, leaving
        the critical relationship that this mutation caused this future access outside analytic understanding and producing
        Behavioral Transparency.
    - zh: NOBELIUM 资料中的 hunting query 明确把休眠服务主体的凭据更新与后续登录连接，官方安全运营指南也要求关联身份状态变化和登录情境，这为观察断点提供强推断支持。残余线索包括发起主体、modified properties、key
        或角色 ID、请求 ID、变更时间、状态快照和首次使用；若平台不暴露具体 key，分析必须降级为主体级关联。因此本机理保持 medium，而不是把任何分散日志都宣称为已证实规避。
      en: The NOBELIUM material explicitly supplies a hunting query joining credential updates on a dormant service principal
        to later sign-in, while official security-operations guidance calls for correlation of identity-state change and sign-in
        context, strongly supporting the observation break by inference. Residual evidence includes initiator, modified properties,
        key or role ID, request ID, mutation time, state snapshots, and first use. When a platform does not expose a specific
        key, analysis must fall back to principal-level correlation. The mechanism therefore remains medium confidence rather
        than treating every dispersed log as demonstrated evasion.
  evidence_refs:
  - REF-000110
  - REF-000145
  - REF-000146
  - REF-000147
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 并行访问边使恶意与合法使用共享既有身份外观
    en: A parallel access edge makes malicious and legitimate use share an established identity appearance
  analysis:
    paragraphs:
    - zh: 非替换式增补把攻击者凭据、认证方法、角色或委托附着到既有主体，同时保留原凭据、账户名称、历史权限和合法所有者活动。后续登录和资源事件仍以熟悉的用户或服务主体为主语，恶意控制者不会产生一个可由“新账户”直接区分的实体，也可能在主密码重置后继续使用另一条路径。攻击者由此用既有身份特征替代新建或替换状态的显著差异，使依赖账户新旧、停用或单一主凭据的粗粒度分类失去区分力，形成特征伪装。
      en: Non-displacing augmentation attaches an adversary credential, authentication method, role, or delegation to an established
        principal while retaining original credentials, account name, historical permissions, and legitimate-owner activity.
        Later sign-in and resource events still name the familiar user or service principal, so the malicious controller does
        not create an entity directly distinguishable as a new account and may continue through another path after the primary
        password is reset. The adversary substitutes established identity features for conspicuous new or replacement state,
        weakening coarse classification based on account novelty, disablement, or one primary credential and producing Feature
        Disguise.
    - zh: ATT&CK 直接记录向已有应用和服务主体增加凭据，Microsoft 直接观察到 NOBELIUM 创建额外服务主体凭据并授予用户或应用角色；官方监控指南要求根据正常业务流程、凭据类型、寿命和角色范围识别异常。来源证明行为和持久目的，但没有逐事件说明攻击者主观选择“保留原路径”是为了伪装，因而机理保持
        medium。新增边、并发使用、异常寿命和审批缺口仍可区分恶意状态。
      en: ATT&CK directly records credentials added to existing applications and service principals, while Microsoft directly
        observed NOBELIUM creating additional service-principal credentials and granting roles to users or applications. Official
        monitoring guidance evaluates anomalies against normal workflow, credential type, lifetime, and role scope. The sources
        establish behavior and persistence purpose but do not state for every event that retaining the original path was subjectively
        chosen for disguise, so the mechanism remains medium. The added edge, concurrent use, abnormal lifetime, and approval
        gap remain discriminating evidence.
  evidence_refs:
  - REF-000144
  - REF-000110
  - REF-000145
  - REF-000146
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立三项 Niji 原生匿迹子技术。并行认证路径增补以可独立建立主体的第二认证器为变量；间接授权图增补以认证不变而角色、组、委托或策略边改变有效权限为变量；身份绑定设备信任附着以受控设备身份及信任状态关联到既有主体为变量。三者分别要求认证器
        ID、授权边/传递图和 device ID/令牌声明，具有不可互换的检测连接与恢复动作。
      en: This technique defines three Niji-native evasion children. Parallel Authentication-Path Augmentation varies an independent
        second authenticator. Indirect Authorization-Graph Augmentation keeps authentication unchanged while a role, group,
        delegation, or policy edge changes effective privilege. Identity-Bound Device-Trust Attachment associates a controlled
        device identity and trust state with an existing principal. They respectively require authenticator ID, authorization
        edge or transitive graph, and device ID or token claims, producing non-interchangeable detection joins and recovery
        actions.
