research:
  limitations:
    paragraphs:
    - zh: 证据强度在三类子项间不同。NOBELIUM 资料和安全运营指南对认证器及授权边提供直接行为证据，但对保留熟悉身份外观的攻击者意图主要为强推断，故 NJS-0083-001 与 NJS-0083-002 及其机理为 medium。ATT&CK
        和 Microsoft 同时直接记录恶意设备注册、持续/规避用途与独立清除要求，NJS-0083-003 可为 high；具体事件仍必须排除合法注册。
      en: Evidence strength differs among the three children. NOBELIUM reporting and security-operations guidance directly
        establish authenticator and authorization-edge behavior, while attacker intent to preserve familiar identity appearance
        is mostly strongly inferred, leaving NJS-0083-001 and NJS-0083-002 and their mechanisms at medium. ATT&CK and Microsoft
        directly document rogue device registration, persistence or evasion purpose, and independent removal requirements,
        supporting high confidence for NJS-0083-003; an individual event must still exclude legitimate enrollment.
    - zh: 证据最集中于 Entra 与云身份。ATT&CK 扩展了父行为的端点、目录、容器、网络设备和 SaaS 范围，但这些系统在 old/new 值、认证器 ID、嵌套授权路径、device ID、令牌声明和保留期上差异很大。跨平台边界来自稳定变量而非效果保证；缺少精确键时检测必须降为主体级关联，未来案例应提供状态差异、原路径、后续使用和防守可见性。
      en: Evidence remains concentrated in Entra and cloud identity. ATT&CK broadens parent behavior across endpoints, directories,
        containers, network devices, and SaaS, but these systems differ in old and new values, authenticator ID, nested authorization
        path, device ID, token claims, and retention. Cross-platform scope follows stable variables rather than guaranteed
        effect. Detection must fall back to principal-level correlation without exact keys, and future cases should expose
        state difference, original path, downstream use, and defender visibility.
