schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0084-001
parent_ref: NJT-0084
name:
  zh: 更新主题自启动描述符伪装
  en: Update-Themed Autostart Descriptor Camouflage
summary:
  zh: 攻击者让启动项的可见名称或邻近描述符呈现更新、浏览器或常见软件组件主题，同时把真实目标指向不一致的恶意载荷，以降低粗粒度清单的区分力。
  en: Adversaries give an autostart's visible name or adjacent descriptor an updater, browser, or common-software-component
    theme while pointing the actual target to an inconsistent malicious payload, weakening coarse inventory discrimination.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 更新主题自启动描述符伪装是攻击者创建或修改启动/登录激活映射时，为其可见名称、描述符或邻近路径选择更新、浏览器、安全工具或常见软件组件主题，但让真实目标、参数、发布者、签名、路径或执行方式与该主题不一致的匿迹子技术。父级映射仍负责在后续生命周期自动运行代码；本子项固定的是防守方首先看到的语义标签与真实执行对象之间的有意差异。
    en: Update-Themed Autostart Descriptor Camouflage is an evasion sub-technique in which an adversary creates or changes
      a boot or logon activation mapping and gives its visible name, descriptor, or adjacent path an updater, browser, security-tool,
      or common-software-component theme while actual target, arguments, publisher, signature, path, or execution mode is
      inconsistent with that theme. The parent mapping still causes automatic execution at a later lifecycle event. This child
      fixes the deliberate difference between the semantic label a defender first sees and the actual execution object.
  - zh: 名称只是受控匿迹变量，不是技术对象本身。EdgeUpdate、MsEdgeMsE 或类似字符串只有在与恶意或未批准目标形成可证明映射时才属于本子项；同名合法更新器、厂商正常命名和业务自定义名称均不纳入。Run 值、启动文件夹快捷方式、plist
      或其他载体可以实现相同变量，但不会据此拆分子技术。
    en: The name is a controlled evasion variable rather than the technique object itself. EdgeUpdate, MsEdgeMsE, or a similar
      string enters this child only when demonstrably mapped to a malicious or unapproved target. A legitimate updater with
      the same name, ordinary vendor naming, and business-defined labels are excluded. A Run value, Startup-folder shortcut,
      plist, or another carrier can implement the same variable without creating separate children.
stealth_characteristics:
  paragraphs:
  - zh: 更新主题自启动描述符伪装让恶意映射在启动清单中借用维护活动的熟悉语义。Microsoft 观察到 EdgeUpdate 同时用于 HKCU Run 值和 Startup 文件夹快捷方式，并在用户登录时启动 LocalAppData
      中的 Node.js loader；另一入侵使用 MsEdgeMsE Run 值通过 rundll32 加载与浏览器主题无关的 DLL 或伪装 PNG。若防守方按名称、常见启动位置或系统宿主快速分流，这些映射可能与更新器或浏览器组件一起获得较低优先级。
    en: Update-Themed Autostart Descriptor Camouflage borrows the familiar meaning of maintenance activity inside an autostart
      inventory. Microsoft observed EdgeUpdate used for both an HKCU Run value and Startup-folder shortcut that launched a
      Node.js loader from LocalAppData at user sign-in. A separate intrusion used a MsEdgeMsE Run value to make rundll32 load
      a DLL or disguised PNG unrelated to the browser theme. If defenders triage by name, common startup location, or system
      host, these mappings may receive the same low priority as updater or browser components.
  - zh: 匿迹只存在于描述符层，真实目标并未消失。名称与发布者、原始文件名、签名、包 ID、安装路径、解释器、扩展、参数和网络行为之间的不一致是主要残余线索；写入事件、状态快照和后续登录执行又能证明映射因果。合法更新器也可能从用户缓存调用解释器或临时制品，因此名称冲突必须与至少两个独立目标或来源差异共同使用，公开案例没有量化其检测收益，置信度保持
      medium。
    en: Evasion exists at the descriptor layer and does not remove the actual target. Inconsistency among name, publisher,
      original filename, signature, package ID, installation path, interpreter, extension, arguments, and network behavior
      is the main residual signal. Mutation events, state snapshots, and later logon execution establish mapping causality.
      Legitimate updaters can also call interpreters or temporary artifacts from user caches, so a naming conflict must be
      combined with at least two independent target or provenance differences. Public cases do not quantify detection benefit,
      and confidence remains medium.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入攻击者控制的启动或登录映射，其可见名称、描述符文本或邻近路径采用可识别的更新、浏览器、安全或常见软件主题，而解析后的目标或执行行为与该主题不一致。判定要求同时证明父级持久映射、主题选择、真实目标和至少一项来源或完整性冲突；泛称
      system、update 或随机名称本身不足。名称可以是新建或修改，顶层对象是否既有不是本子项变量。
    en: This child includes an adversary-controlled boot or logon mapping whose visible name, descriptor text, or adjacent
      path adopts a recognizable updater, browser, security, or common-software theme while the resolved target or execution
      behavior is inconsistent with that theme. Classification requires proof of the parent durable mapping, the chosen theme,
      actual target, and at least one provenance or integrity conflict. A generic system, update, or random name alone is
      insufficient. The name can be new or modified; whether the top-level object already existed is not this child's variable.
  - zh: 与主题完全一致且由批准软件包创建的合法更新项排除；只伪装文件名或进程名而没有启动映射的行为归相应伪装或执行对象；合法程序启动后发生 DLL 旁加载时，描述符伪装属于本子项，加载劫持仍归 T1574。按注册表、快捷方式、平台、用户范围或具体产品拆分均被禁止。原计划的“既有自启动对象挪用”因证据不能稳定证明保留对象身份与数量而保持
      defer。
    en: Legitimate updater entries consistent with their theme and created by an approved package are excluded. File-name
      or process-name disguise without an autostart mapping belongs to the relevant masquerading or execution object. When
      a legitimate program starts and then side-loads a DLL, descriptor camouflage belongs here while load hijacking remains
      under T1574. Partition by registry, shortcut, platform, user scope, or product is prohibited. The initially considered
      Existing Autostart Object Co-option remains deferred because evidence does not consistently establish preservation of
      object identity and count.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者通常在已知目标主机安装软件、企业命名习惯和可写用户级启动位置后使用本子项，把 Run 值或启动快捷方式命名为浏览器更新、系统修复或安全组件，再指向用户目录中的 loader、解释器、脚本或恶意模块。它适合需要跨登录恢复、又希望新的启动项在管理员快速清单或自动规则中看似普通维护的场景。后继网络、脚本或模块行为可以暴露载荷，但不改变描述符变量。
      en: An adversary typically uses this child after learning installed software, enterprise naming practice, and writable
        user-scoped startup locations on the target. A Run value or startup shortcut is named as a browser updater, system
        repair, or security component while pointing to a loader, interpreter, script, or malicious module in a user directory.
        The child fits persistence across logon when the new autostart is intended to look like routine maintenance in rapid
        administrative inventory or automated rules. Later network, script, or module behavior can expose the payload without
        changing the descriptor variable.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要父级自启动写权限，并能够控制可见名称、路径或描述符和真实目标；高质量伪装还需要了解本机软件、发布者、安装路径、版本与更新节奏。若防守方验证签名、原始文件名、包 ID、目标目录与变更来源，攻击者必须取得签名、侵入批准软件链或复制更多一致属性。名称碰撞、真实更新器覆盖状态、用户看到陌生启动项或目标启动失败都会限制效果。
        en: The adversary needs parent autostart write authority and control of the visible name, path or descriptor, and
          actual target. High-quality disguise additionally requires knowledge of local software, publisher, installation
          path, version, and update cadence. When defenders validate signature, original filename, package ID, target directory,
          and mutation provenance, the adversary must obtain a signature, compromise an approved software chain, or reproduce
          more consistent attributes. Name collision, state overwritten by a real updater, user discovery of an unfamiliar
          startup item, or target activation failure constrains effectiveness.
    defender_model:
      paragraphs:
      - zh: 防守方模型假定自启动枚举不仅显示名称，还能解析真实目标、参数、用户范围、来源位置和 enabled 状态，并与文件哈希、签名发布者、原始文件名、安装软件、包事务和写入进程连接。登录时进程与模块数据验证描述符实际激活了什么；基线按设备角色和软件版本更新。若清单只保留名称、所有更新项被白名单、用户缓存不采集或供应链本身被控，描述符一致性判断会失效。
        en: The defender model assumes autostart inventory exposes not only name but resolved target, arguments, user scope,
          source location, and enabled state and joins these with file hash, signing publisher, original filename, installed
          software, package transaction, and writer process. Process and module data at logon verify what the descriptor actually
          activated, while baselines track device role and software version. Descriptor consistency fails when inventory retains
          only names, all updater items are allowlisted, user caches are uncollected, or the software supply chain itself
          is controlled.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 维护式可见名称替代恶意目标特征并削弱快速分类
    en: A maintenance-style visible name substitutes for malicious target features and weakens rapid classification
  analysis:
    paragraphs:
    - zh: 攻击者把 EdgeUpdate、MsEdgeMsE 或等价维护主题写入可见描述符，而实际命令从用户目录启动 Node.js、WScript、rundll32 加载的恶意 DLL 或伪装扩展。防守方若在第一层只读取名称和位置，就会用浏览器或更新器类别解释该对象，恶意映射与正常软件共享可见特征，形成特征伪装。Microsoft
        两项独立调查直接记录名称、载体、登录触发和真实目标，行为链得到同级支持。
      en: The adversary writes EdgeUpdate, MsEdgeMsE, or an equivalent maintenance theme into the visible descriptor while
        the actual command launches Node.js, WScript, a malicious DLL through rundll32, or a disguised extension from a user
        directory. If first-tier review reads only name and location, it interprets the object as a browser or updater, causing
        malicious mapping and normal software to share visible features and producing Feature Disguise. Two independent Microsoft
        investigations directly record name, carrier, logon trigger, and actual target, providing evidence at the level of
        the behavior chain.
    - zh: 公开资料没有直接量化攻击者因该名称少触发多少检测，也不能证明所有更新主题项都由同一主观理由选择，因此 confidence 为 medium。真实目标、参数、原始文件名、签名、发布者、包 ID、路径和后继行为仍保留；名称与至少两个这些属性冲突时，防守方可以反转伪装。
      en: Public reporting does not quantify how many detections the name avoided or prove that every update-themed entry
        was selected for the same subjective reason, so confidence is medium. Actual target, arguments, original filename,
        signature, publisher, package ID, path, and downstream behavior remain. Defenders can reverse the disguise when the
        name conflicts with at least two of those attributes.
  evidence_refs:
  - REF-000151
  - REF-000152
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 主题描述符在写入后等待下一次登录再激活真实目标
    en: The themed descriptor waits after mutation and activates its actual target at the next logon
  analysis:
    paragraphs:
    - zh: 两个案例都把可见描述符持久保存于用户登录路径，当前安装或入侵进程结束后由后续登录触发真实目标。行为把主题名称写入和恶意进程出现置于不同窗口，若短期调查只覆盖其中一侧，名称与目标的冲突无法建立。Run/RunOnce 官方行为和案例直接支持登录激活，但匿迹收益仍是强推断，所以该子级
        NM-ST 保持 medium。
      en: Both cases persist the visible descriptor in a user-logon path so a later sign-in triggers the actual target after
        the current installer or intrusion process ends. The behavior places thematic-name mutation and malicious-process
        appearance in different windows; a short investigation covering only one side cannot establish the name-to-target
        conflict. Official Run and RunOnce behavior and the cases directly support logon activation, while the evasion benefit
        remains strongly inferred, leaving child-level NM-ST at medium confidence.
  evidence_refs:
  - REF-000149
  - REF-000151
  - REF-000152
  confidence: medium
