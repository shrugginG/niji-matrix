research:
  limitations:
    paragraphs:
    - zh: 当前子技术由两个 Windows 现场案例支持，分别覆盖 Run 值与启动文件夹快捷方式，但没有 Linux、macOS 或网络设备的同级主题—目标不一致案例。分类变量理论上不依赖载体，正式范围仍只主张有证据的描述符行为，不把跨平台可能性写成已观察事实。后续扩展必须同时提供可见主题、真实目标、生命周期激活和防守观察差异。
      en: Two Windows field cases support the child across a Run value and Startup-folder shortcut, but no evidence at the
        same level currently covers a theme-to-target mismatch on Linux, macOS, or network devices. The variable is theoretically
        carrier-independent, yet formal scope claims only evidenced descriptor behavior rather than presenting cross-platform
        possibility as observed fact. Future extension must provide visible theme, actual target, lifecycle activation, and
        defender-observation difference together.
    - zh: 更新与浏览器名称是常见合法模式，用户级更新器也可能从 LocalAppData 运行解释器或临时制品；名称、路径或签名单项都不能证明恶意。两个报告直接证明恶意映射与驻留结果，却没有实验性测量命名对检测率的影响，因此机理和子项保持
        medium。若未来检测依赖目标一致性而不再受名称影响，匿迹效果需要重新校准。
      en: Updater and browser names are common legitimate patterns, and user-scoped updaters can run interpreters or temporary
        artifacts from LocalAppData. No one of name, path, or signature proves maliciousness. The reports directly establish
        malicious mappings and persistence outcomes but do not experimentally measure the effect of naming on detection rates,
        so mechanism and child remain medium. If future detection relies on target consistency and no longer trusts names,
        the evasion effect requires recalibration.
