research:
  limitations:
    paragraphs:
    - zh: 直接来源最清楚地证明快捷方式目标修改；注册项、plist 或其他描述符只有在能够证明同一对象连续性和目标语义变化时才能类推，不能把任何现有条目修改都纳入。公开程序实例通常没有完整企业允许列表和告警结果，因此匿迹收益保持 medium。
      en: Direct evidence most clearly establishes shortcut-target modification. Registry, plist, or other descriptors generalize
        only when the same object continuity and changed target semantics are proven; not every modification to an existing
        item qualifies. Public procedures usually omit complete enterprise allowlists and alert outcomes, so evasion benefit
        remains medium.
    - zh: 文件系统时间、对象 ID 和包管理器可能在更新中重建描述符，使“同一对象”判断依赖本地数据模型。无法取得可信基线时，只能将异常目标归入父级，不能声称完成了本子项的身份连续性证明。
      en: Filesystem time, object ID, and package managers can recreate a descriptor during upgrade, making same-object judgment
        dependent on local data models. Without a trusted baseline, an anomalous target remains parent-level and cannot claim
        proven identity continuity for this child.
