schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0084-002
parent_ref: NJT-0084
name:
  zh: 既有自启动描述符目标替换
  en: Established Autostart Descriptor Target Substitution
summary:
  zh: 攻击者保留既有启动项的名称、位置与对象身份，只改变目标或参数，使粗粒度清单继续呈现熟悉条目而生命周期执行已被重定向。
  en: Adversaries preserve an established startup item's name, location, and object identity while changing its target or
    arguments, leaving a familiar entry in coarse inventory although lifecycle execution has been redirected.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有自启动描述符目标替换是攻击者修改已经存在且会被启动或登录生命周期消费的快捷方式、注册项、登录项或等价描述符，只替换其真实目标、参数或目标解析链，同时保留描述符路径、可见名称和至少部分历史属性。分类变量是“描述符身份连续而执行含义改变”，不是快捷方式格式或操作系统；其直接目标是借用已知启动项的清单身份恢复攻击者代码。
    en: Established Autostart Descriptor Target Substitution is the modification of a pre-existing shortcut, registration,
      login item, or equivalent descriptor consumed at boot or logon, replacing its actual target, arguments, or target-resolution
      chain while preserving descriptor path, visible name, and part of its history. The variable is continuous descriptor
      identity with changed execution meaning rather than shortcut format or operating system. Its direct objective is to
      use a known startup item's inventory identity to restore adversary code.
  - zh: 与新建更新主题条目不同，本子项要求变更前存在同一稳定描述符，并能证明 old/new 目标或参数发生变化；攻击者也可以保留合法目标并在参数中增加恶意前置动作，但必须改变生命周期执行结果。仅替换目标文件内容而不改变描述符属于二进制破坏或文件替换，不进入本子项。
    en: Unlike creation of a new update-themed entry, this child requires the same stable descriptor before mutation and evidence
      of changed old and new target or arguments. The adversary may retain the legitimate target while adding malicious pre-execution
      through arguments, but lifecycle execution outcome must change. Replacing only the target file contents without changing
      the descriptor belongs to binary compromise or file replacement and is outside this child.
stealth_characteristics:
  paragraphs:
  - zh: 既有自启动描述符目标替换保留资产清单中常被当作身份的路径、名称、创建历史和用户熟悉度；若检测只比较条目是否新增、名称是否允许或位置是否常见，变化后的目标可以继续继承旧条目的信誉。ATT&CK 对快捷方式修改的记录直接证明既有描述符目标会被改变，粗粒度对象存在性检查因此不足。
    en: Established Autostart Descriptor Target Substitution preserves the path, name, creation history, and user familiarity
      commonly treated as identity in asset inventory. If detection checks only whether an item is new, its name is allowed,
      or its location is common, the changed target continues inheriting the old item's reputation. ATT&CK's record of shortcut
      modification directly establishes that an existing descriptor target can be changed, making coarse object-existence
      checks insufficient.
  - zh: old/new 目标、参数、解析后的最终路径、描述符哈希与权限、写入进程、软件包所有权和下次生命周期的进程/模块谱系仍能揭示替换。合法软件升级、路径迁移、修复安装和管理员重定向也会修改既有描述符，因而必须用签名包清单、变更单与预期版本排除；“既有”不是安全结论。
    en: Old and new target, arguments, resolved final path, descriptor hash and permission, writer process, package ownership,
      and process or module lineage at the next lifecycle can reveal substitution. Legitimate upgrade, path migration, repair
      installation, and administrator redirection also modify established descriptors, so signed-package inventory, change
      record, and expected version must exclude them. Established does not mean safe.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入变更前已存在并由启动/登录消费的稳定描述符，其目标、参数或目标解析链被攻击者修改且在后续生命周期执行。判定需要可信前序快照或审计证明对象连续性、目标语义变化、攻击者控制和后继激活；仅同名新建条目属于 NJS-0084-001
      或父级，不满足本子项的对象连续性。
    en: Scope includes a stable descriptor that existed before mutation and was consumed at boot or logon when its target,
      arguments, or target-resolution chain is adversary-modified and executes in a later lifecycle. Classification requires
      a trusted prior snapshot or audit establishing object continuity, changed target semantics, adversary control, and successor
      activation. A newly created same-name entry belongs to NJS-0084-001 or parent scope and lacks the object continuity
      required here.
  - zh: 目标文件本身被整体替换归相邻的软件二进制篡改对象；搜索路径、导入或 DLL 加载顺序劫持归执行流劫持对象；只修改用户点击但不属于启动或登录消费的普通快捷方式不属于本父技术。合法升级若目标与签名包、版本、发布者和工单一致，是必要反例。
    en: Whole replacement of the target file belongs to adjacent software-binary tampering, while search-path, import, or
      DLL load-order hijacking belongs to execution-flow hijacking. Modification of an ordinary shortcut clicked by a user
      but not consumed at boot or logon is outside this parent technique. A legitimate upgrade whose target matches signed
      package, version, publisher, and change record is a required counterexample.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得用户启动目录、企业登录项或等价配置的写权限后，可选择一个允许列表中已有且长期存在的描述符，保留显示名称与位置，改写目标到攻击者 loader 或加入恶意参数。下次登录时系统或用户 shell 仍从熟悉条目发起进程；若团队只告警新增项，变更可能作为软件维护被忽略。
      en: After gaining write access to a user startup directory, enterprise login item, or equivalent configuration, an adversary
        can select a long-standing descriptor already on an allowlist, preserve display name and location, and redirect the
        target to an adversary loader or add malicious arguments. At the next logon, the system or user shell still starts
        from a familiar entry. A team alerting only on new items may dismiss the change as software maintenance.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要写入既有描述符而不破坏其可解析性，掌握原目标、参数引用、权限、签名或软件包更新习惯，并保持恶意目标到下一生命周期可用。只读/受保护描述符、包管理器修复、基线自动回滚、目标签名与描述符完整性绑定会限制效果；语法错误或启动失败会暴露修改。
        en: The adversary needs authority to write an established descriptor without breaking resolution, knowledge of original
          target, argument references, permission, signature, or package-update practice, and availability of the malicious
          target through the next lifecycle. Read-only or protected descriptors, package-manager repair, automatic baseline
          rollback, and binding target signature to descriptor integrity constrain the behavior. Syntax error or startup failure
          can expose the mutation.
    defender_model:
      paragraphs:
      - zh: 防守方需要保留同一 descriptor ID/路径的可信 old/new 快照、目标解析结果、写入者、文件完整性、软件包归属和生命周期进程谱系。若只保存当前清单而没有历史目标，无法区分合法既有项与已被改写项；若解析停留在环境变量或中间脚本，也可能漏掉最终目标。
        en: The defender needs trusted old and new snapshots for one descriptor ID or path, resolved target, writer, file
          integrity, package ownership, and lifecycle process lineage. A current-only inventory cannot distinguish a legitimate
          established item from a rewritten one. Resolution that stops at an environment variable or intermediate script can
          also miss the final target.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 保留描述符身份使恶意目标继承既有启动项信誉
    en: Preserved descriptor identity lets a malicious target inherit established startup-item reputation
  analysis:
    paragraphs:
    - zh: 攻击者维持名称、位置与对象连续性，只改变决定真实执行的目标或参数。允许列表和粗粒度清单看到熟悉描述符，恶意执行借用其历史与软件语义，形成特征伪装。精确 old/new 差异、最终目标、写入者和包归属仍能区分；因此本机理不是“完全无变化”，而是把变化压缩到常被忽略的字段。
      en: The adversary preserves name, location, and object continuity while changing only target or arguments that determine
        actual execution. Allowlists and coarse inventory see a familiar descriptor, allowing malicious execution to borrow
        its history and software meaning and produce Feature Disguise. Exact old and new difference, final target, writer,
        and package ownership still discriminate. The mechanism is not absence of change but concentration of change in commonly
        ignored fields.
    - zh: ATT&CK 固定子项直接记录修改快捷方式以执行攻击者代码，Sysinternals Autoruns 说明自启动审查必须同时查看条目与映像。来源直接支持行为与字段差异，攻击者借用信誉的主观目的及实际漏检收益为强推断，故保持
        medium。
      en: ATT&CK documentation directly describes shortcut modification to execute adversary code, and Sysinternals Autoruns
        establishes that autostart review must examine both entry and image. Sources directly support behavior and field difference,
        while the subjective purpose and detection benefit of borrowed reputation are strongly inferred, so confidence remains
        medium.
