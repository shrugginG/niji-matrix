research:
  limitations:
    paragraphs:
    - zh: 当前直接恶意行为与架构证据均集中在 macOS。分类变量允许其他具有持久会话恢复集合的平台进入，但不能把普通登录项、最近文件列表或浏览器标签恢复自动外推为执行级持久化。每个新实现必须证明队列写入和后继代码激活。
      en: Direct malicious behavior and architecture evidence are concentrated on macOS. The variable permits another platform
        with a persistent session-restoration set, but ordinary login items, recent-file lists, or browser-tab restoration
        cannot be generalized automatically into execution persistence. Each new implementation must prove queue mutation
        and successor code activation.
    - zh: ATT&CK 页面与用户文档没有公开完整主机事件序列，无法证明每次攻击都避开传统登录项监控；用户的正常恢复选择又高度相似。因此正式结论只主张独立状态与检测连接，不主张普遍成功或仅凭系统父体即可归因。
      en: The ATT&CK page and user documentation do not publish a complete host-event sequence proving every attack bypassed
        traditional login-item monitoring, while normal user restoration is highly similar. The formal conclusion claims independent
        state and detection joins, not universal success or attribution from a system parent alone.
