research:
  limitations:
    paragraphs:
    - zh: 三项子项均有同级行为来源，但效果置信度保持校准。Microsoft 现场案例直接记录更新主题条目；ATT&CK 直接记录快捷方式目标修改和重新打开应用状态；Sysinternals 与 Apple 分别提供清单和正常恢复语义。公开材料没有为每项提供完整企业告警结果，故三项及机理均为
        medium，不把平台位置或正常恢复自动判为恶意。
      en: Each child has peer-level behavior sources with calibrated effect confidence. Microsoft field cases directly document
        update-themed entries; ATT&CK directly documents shortcut-target modification and re-opened-application state; Sysinternals
        and Apple provide inventory and normal-restoration semantics respectively. Public material does not provide complete
        enterprise alert outcomes for every item, so all three children and mechanisms remain medium and neither platform
        location nor normal restoration is automatically malicious.
    - zh: 父级跨平台范围由 ATT&CK 支持，而新增两个变量的直接证据分别集中于快捷方式修改和 macOS 恢复状态。其他注册项、plist 或恢复实现只有在证明相同对象连续性或状态—恢复因果时才能纳入；没有可信 old/new 基线或前序会话活动时应退回父级，不能用数量目标扩大结论。
      en: ATT&CK supports cross-platform parent scope, while direct evidence for the two new variables centers on shortcut
        modification and macOS restoration state. Other registry, plist, or restoration implementations qualify only when
        they prove the same object continuity or state-to-restoration causality. Without trusted old and new baseline or prior-session
        activity, classification falls back to parent scope rather than expanding conclusions to meet a numeric target.
