schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0085-001
parent_ref: NJT-0085
name:
  zh: 既有初始化脚本内联植入
  en: Existing Initialization-Script Inline Implantation
summary:
  zh: 攻击者保留被正常启动/登录流程调用的脚本路径与大部分合法内容，只内联增加恶意命令，使粗粒度路径和新文件清单难以发现变化。
  en: Adversaries preserve the script path and most legitimate content invoked by normal boot or logon flow while adding malicious
    commands inline, making coarse path and new-file inventory less able to reveal the change.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有初始化脚本内联植入是攻击者在正常启动或登录流程已经调用的脚本中插入、拼接或局部改写命令，同时保留原路径、调用关系和大部分合法语句的匿迹子技术。新增命令可恢复载荷、启动代理、修改校验或改变配置，但其功能不定义子项；直接目标是在不创建独立脚本对象的情况下，让恶意行为随合法初始化脚本继续执行。
    en: Existing Initialization-Script Inline Implantation is an evasion sub-technique in which an adversary inserts, appends,
      or locally rewrites commands inside a script already invoked by normal boot or logon flow while preserving original
      path, invocation relationship, and most legitimate statements. The added command can restore a payload, launch an agent,
      alter verification, or change configuration, but its function does not define the child. The direct objective is to
      make malicious behavior continue with a legitimate initialization script without creating a separate script object.
  - zh: “内联”要求前后版本具有可识别的共同脚本身份和主体内容，恶意部分只占局部差异。整个文件被替换、全新脚本被注册或只有外部目标描述符变化时分别属于父级、NJT-0084 或其他相邻对象。脚本名、平台与语言不构成变量。
    en: Inline requires recognizable shared script identity and principal content across versions, with malicious material
      occupying a local difference. Whole-file replacement, registration of a new script, or change only to an external target
      descriptor belongs to parent scope, NJT-0084, or another neighboring object respectively. Script name, platform, and
      language are not the variable.
stealth_characteristics:
  paragraphs:
  - zh: 既有初始化脚本内联植入保留合法脚本的规范路径、所有者、权限、启动顺序和多数管理命令，使目录枚举仍显示熟悉对象，启动进程仍由正常解释器与高权限生命周期宿主产生。新文件检测没有独立对象可见，路径白名单和只比较文件存在性的控制也会把恶意行与合法正文一并信任。
    en: Existing Initialization-Script Inline Implantation preserves the legitimate script's canonical path, owner, permission,
      startup order, and most administrative commands. Directory inventory still shows a familiar object, while startup processes
      still originate from the normal interpreter and privileged lifecycle host. New-file detection sees no independent object,
      and path allowlists or controls comparing only file presence trust malicious lines together with legitimate body.
  - zh: 内容并未消失。old/new 版本、逐行或语法化 diff、写入主体、命令语义、引用目标、哈希、解释器参数和子进程可以定位插入；UNC3886 案例甚至提供命令、偏移和目标哈希。合法升级、管理员修复和配置下发也会产生局部差异，因此需要批准来源和以后执行结果。缺少旧版本时只能确认异常脚本，不能确认内联变量。
    en: Content has not disappeared. Old and new versions, line or syntax-aware diff, writer, command semantics, referenced
      target, hash, interpreter arguments, and child processes locate insertion; the UNC3886 case even supplies command, offset,
      and target hashes. Legitimate upgrade, administrator repair, and configuration deployment also create local differences,
      requiring approved provenance and later execution outcome. Without a prior version, analysis can confirm an anomalous
      script but not the inline variable.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对已存在且仍被正常启动或登录流程调用的初始化脚本所做的局部攻击者修改，要求路径和大部分合法内容保持、至少一个恶意命令新增或改写，并在以后生命周期被解释或影响结果。对压缩 rootfs、固件归档或集中域脚本的修改也可纳入，只要前后脚本身份和内容差异可证明。
    en: Scope includes local adversary mutation of an existing initialization script still invoked by normal boot or logon
      flow, requiring preserved path and most legitimate content, at least one malicious command added or rewritten, and later
      lifecycle interpretation or effect. Mutation inside compressed rootfs, firmware archive, or centralized domain script
      can qualify when script identity and content difference across versions are demonstrable.
  - zh: 新建脚本、整文件替换、只改变脚本路径描述符、服务单元、计划任务和其他事件订阅不属于本子项；脚本混淆或下游二进制修补可并行记录。按 rc.local、localnet、PowerShell、shell、ESXi、Windows 或网络设备拆分均被禁止。合法局部修复没有攻击者控制与持续访问目的时排除。
    en: A new script, whole-file replacement, descriptor-only script-path change, service unit, scheduled task, and other
      event subscription are outside this child. Script obfuscation or downstream binary patching can be recorded in parallel.
      Partitions by rc.local, localnet, PowerShell, shell, ESXi, Windows, or network device are prohibited. Legitimate local
      repair without adversary control and continuing-access purpose is excluded.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在已经获得高权限文件、配置归档或设备启动配置写权限、但新增启动对象可能被清单发现时使用本子项。其选择一个稳定且必要的合法脚本，在不会破坏正常启动的位置加入少量命令，等待重启或登录恢复组件。网络与安全设备、虚拟化管理节点和长期运行服务器尤其适合，因为启动脚本变更少但重启间隔长，要求防守方长期保留版本。
      en: An adversary uses the child after gaining privileged write access to a file, configuration archive, or device startup-config
        when a new startup object may be found by inventory. The operator selects a stable necessary legitimate script, adds
        a small command at a location that will not break normal boot, and waits for reboot or logon to restore a component.
        Network and security appliances, virtualization management nodes, and long-running servers are especially relevant
        because script changes are rare but reboot intervals are long, demanding long version retention.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须取得既有脚本或其持久归档的写权限，理解脚本语法、执行顺序、有效权限和设备启动行为，并保持合法语句不受破坏。若文件受签名、不可变属性、只读映像、配置提交、双人审批或启动完整性校验保护，攻击者需要同时绕过这些控制。错误插入可能导致启动失败、校验告警或异常子进程。
        en: The adversary must obtain write authority over the existing script or durable archive, understand syntax, execution
          order, effective privilege, and device startup behavior, and preserve legitimate statements. If the file is protected
          by signing, immutability, read-only image, configuration commit, two-person approval, or boot integrity verification,
          the adversary must also bypass those controls. An incorrect insertion can cause boot failure, integrity alert, or
          anomalous child process.
    defender_model:
      paragraphs:
      - zh: 防守方需要至少两个脚本版本及可信批准源，能够将格式变化与命令语义分开，并保留写入事务、boot/logon ID、解释器、子进程和引用目标。只看当前文件路径、所有者或哈希不能说明合法行与恶意行的关系；只看运行时又会把来源归给正常解释器。固件归档未导出、设备无
          EDR 或配置管理被控时，关键视角缺失。
        en: The defender needs at least two script versions and a trusted approved source, can separate formatting changes
          from command semantics, and retains mutation transaction, boot or logon ID, interpreter, child process, and referenced
          target. Current path, owner, or hash alone cannot explain the relationship between legitimate and malicious lines,
          while runtime alone attributes provenance to the normal interpreter. Firmware archives not exported, appliances
          without EDR, or compromised configuration management remove critical views.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 恶意行借用既有脚本路径和多数合法正文的身份
    en: Malicious lines borrow the identity of an existing script path and mostly legitimate body
  analysis:
    paragraphs:
    - zh: 攻击者只在合法初始化脚本中增加局部命令，路径、所有者、权限、调用者和大多数正文保持正常。恶意内容与合法管理语句共享同一对象特征，使新文件检测、路径白名单和只验证对象存在性的规则失去区分力，形成特征伪装。UNC3886、Velvet
        Ant 与 APT29 资料直接支持既有脚本被增补或劫持，内容版本仍能反转这种效果。
      en: The adversary adds only local commands inside a legitimate initialization script while path, owner, permission,
        caller, and most body remain normal. Malicious content shares object features with legitimate administrative statements,
        weakening new-file detection, path allowlists, and rules validating only object presence and producing Feature Disguise.
        UNC3886, Velvet Ant, and APT29 material directly support existing scripts being extended or hijacked, while content
        versions can reverse the effect.
    - zh: 来源没有量化路径身份带来的检测下降，合法管理员也会内联维护命令，因此 confidence 为 medium。更高置信度要求未批准 diff、异常写入者、后续解释执行和恶意结果共同成立。
      en: Sources do not quantify detection reduction from retained path identity, and legitimate administrators also insert
        maintenance commands, so confidence is medium. Higher confidence requires unapproved diff, anomalous writer, later
        interpretation, and malicious outcome together.
  evidence_refs:
  - REF-000154
  - REF-000155
  - REF-000156
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 正常初始化解释器执行内联命令并掩盖较早写入者
    en: A normal initialization interpreter executes inline commands and masks the earlier writer
  analysis:
    paragraphs:
    - zh: 启动或登录宿主在以后读取整个脚本，进程侧只显示正常解释器和脚本路径；攻击者写入者留在更早的文件或配置事件。没有版本到执行的关联，局部恶意行作为子进程原因落在分析理解之外，形成行为透明。DET0112 的内容修改—脚本执行关联提供同级依据，置信度
        medium。
      en: A boot or logon host later reads the whole script, leaving only the normal interpreter and script path in process
        telemetry while the adversary writer remains in earlier file or configuration events. Without version-to-execution
        correlation, a local malicious line as the cause of child behavior falls outside analytic understanding and produces
        Behavioral Transparency. DET0112 mutation-to-script-execution correlation supports the conclusion at medium confidence.
  evidence_refs:
  - REF-000154
  - REF-000157
  confidence: medium
