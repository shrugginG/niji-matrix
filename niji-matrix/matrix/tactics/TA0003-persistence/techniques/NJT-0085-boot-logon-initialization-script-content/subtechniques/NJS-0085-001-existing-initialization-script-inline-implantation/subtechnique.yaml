research:
  limitations:
    paragraphs:
    - zh: 两项直接案例来自 Fortinet 与 F5 设备，APT29 的合法启动脚本劫持由 ATT&CK 汇总，未取得当前可访问的原报告正文。它们共同支持跨产品内联变量，但不证明 Windows 域脚本或 macOS 钩子具有相同匿迹效果。新增平台实例需要前后版本和真实生命周期执行证据。
      en: Two direct cases concern Fortinet and F5 appliances, while ATT&CK aggregates APT29 hijacking of legitimate startup
        scripts and the original report is not currently accessible at its old URL. They jointly support an inline variable
        across products but do not establish identical evasion effect for Windows domain scripts or macOS hooks. New platform
        instances require before-and-after versions and actual lifecycle-execution evidence.
    - zh: 脚本内容可能由包或配置管理生成，逐行差异不等于攻击者植入；没有旧版本时也无法证明“内联”而非新建或替换。公开资料直接证明增加命令与启动执行，匿迹效果为强推断，因此子项与机理保持 medium。若未来只能恢复当前恶意脚本，应保留父级归类而不强贴子项。
      en: Package or configuration management can generate script content, so a line difference is not automatically an adversary
        implant. Without a prior version, inline cannot be distinguished from creation or replacement. Public sources directly
        establish added commands and startup execution, while evasion effect is strongly inferred, leaving child and mechanisms
        at medium. If future evidence recovers only a current malicious script, parent classification should remain without
        forcing the child.
