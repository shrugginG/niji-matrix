research:
  limitations:
    paragraphs:
    - zh: 当前直接架构与恶意范围证据集中于 Windows Active Directory/GPO；其他中央设备管理或目录实现只有在证明一份脚本状态被多个下游生命周期消费时才能纳入。不能把任何软件分发或远程脚本自动外推为本子项。
      en: Direct architecture and adversary-scope evidence centers on Windows Active Directory and Group Policy. Another centralized
        device-management or directory implementation qualifies only when one script state is proven to be consumed by multiple
        downstream lifecycle events. Ordinary software distribution or remote scripts cannot be generalized automatically
        into this child.
    - zh: ATT&CK 页面说明了潜在的多系统范围，但没有给出一个公开攻击案例的完整组策略版本、所有受影响客户端与检测结果，因此子技术和时空释痕机理保持中等置信度。只有中央修改而没有下游执行时，不能仅凭目标范围宣称实际扇出。
      en: The ATT&CK page describes potential multi-system scope but does not provide one public incident with a complete
        Group Policy version, every affected client, and detection outcome, so the child and Spatiotemporal Trace Dilution
        mechanism remain medium confidence. A central mutation without downstream execution does not establish actual fan-out
        merely from its target scope.
