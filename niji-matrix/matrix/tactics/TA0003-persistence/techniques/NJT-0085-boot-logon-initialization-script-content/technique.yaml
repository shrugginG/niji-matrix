research:
  limitations:
    paragraphs:
    - zh: 内联子项有两个网络设备现场案例，扇出子项有 ATT&CK 多系统行为和 Microsoft GPO 架构证据；两者行为来源同级，但公开资料没有完整量化实际漏检收益，均保持 medium。合法初始化脚本与集中 GPO 具有相同结构，必须分别以内容基线、批准范围和后继执行排除。
      en: The inline child has two network-appliance field cases, while the fan-out child has ATT&CK multi-system behavior
        and Microsoft GPO architecture evidence. Both have peer-level behavioral sources, but public material does not fully
        quantify detection loss, so both remain medium. Legitimate initialization scripts and central GPOs have the same structure
        and must be excluded through content baseline, approved scope, and successor execution.
    - zh: 直接案例仍集中于 Unix-like 设备内联与 Windows 域扇出。其他平台只有在证明相同稳定变量时才能纳入；仅按脚本名、语言、平台或 ATT&CK 子项不能扩大 Niji 分类。中央配置没有下游执行或本地路径没有可信内容历史时只保留父级异常。
      en: Direct cases remain concentrated in Unix-like appliance inline mutation and Windows domain fan-out. Other platforms
        qualify only when the same stable variable is proven; script name, language, platform, or ATT&CK child alone cannot
        expand Niji classification. Central configuration without downstream execution or a local path without trusted content
        history remains a parent-level anomaly.
