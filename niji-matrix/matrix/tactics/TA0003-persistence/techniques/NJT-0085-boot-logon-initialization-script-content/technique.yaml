schema_version: 2.0.0
type: technique
id: NJT-0085
name:
  zh: 启动或登录初始化脚本内容
  en: Boot-or-Logon Initialization-Script Content
summary:
  zh: 攻击者创建或改变由启动/登录流程解释的持久脚本内容以恢复代码，并可把恶意命令内联到既有合法脚本中，降低新对象可见性和写入者关联。
  en: Adversaries create or change durable script content interpreted by boot or logon flow to restore code and can place
    malicious commands inline in an existing legitimate script, reducing new-object visibility and writer attribution.
aliases:
- Boot or Logon Initialization Scripts
classification:
  tactic_refs:
  - TA0003
  - TA0004
  origin:
    kind: attack-retained
    source_attack_id: T1037
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1037
definition_and_concept:
  paragraphs:
  - zh: 启动或登录初始化脚本内容是攻击者创建、修改或扩展一个由操作系统、域登录流程或设备启动流程自动解释的持久脚本正文、命令序列或脚本钩子，使攻击者命令在以后启动、重启或登录时运行的技术。其直接目标是在当前进程或会话结束后，借正常初始化解释器恢复下载、启动、修补、配置或控制行为，从而维持立足点。
    en: Boot-or-Logon Initialization-Script Content is a technique in which an adversary creates, changes, or extends a durable
      script body, command sequence, or script hook interpreted automatically by an operating system, domain logon flow, or
      device startup process so adversary commands run at a later boot, reboot, or logon. Its direct objective is to use a
      normal initialization interpreter to restore download, launch, patch, configuration, or control behavior after the current
      process or session ends, maintaining the foothold.
  - zh: 概念锚是“被生命周期解释的脚本内容”，而不是脚本语言、文件名、平台、注册表载体或解释器。脚本路径与触发映射可以早已存在，只有命令正文被攻击者改变；也可以创建全新脚本，但必须证明正常启动/登录流程实际消费它。仅配置某描述符指向不变目标属于
      NJT-0084，解释器随后运行脚本不另建 T1059 子项。
    en: The conceptual anchor is script content interpreted by lifecycle rather than script language, filename, platform,
      registry carrier, or interpreter. Script path and trigger mapping can already exist while only command body is changed,
      or a new script can be created, but the normal boot or logon flow must demonstrably consume it. Configuring only a descriptor
      to an unchanged target belongs to NJT-0084, while the interpreter's later execution does not create a T1059-based child.
  - zh: 初始化脚本内容既可在启动或登录时恢复攻击者代码，也可能由权限高于内容写入者的解释器执行。后一种情况只有在变化内容实际带来此前没有的资源权限时，才同时服务于权限提升。
    en: Initialization-script content can restore adversary code at boot or logon or be executed by an interpreter with greater
      authority than the content writer. The latter also serves Privilege Escalation only when the changed content actually
      produces resource authority that was previously unavailable.
stealth_characteristics:
  paragraphs:
  - zh: 脚本修改与实际执行跨时间和来源分离。写入可能来自远程管理、配置接口、短驻进程或被攻陷管理员，后续进程却以 init、登录宿主、域策略或脚本解释器为父体；没有文件/注册表变更、内容版本、boot/logon ID 和子进程的共同关联，防守方只能看到较早的文本差异或较晚的正常解释器活动。启动早于端点传感器时，执行侧可见性还会进一步下降。
    en: Script mutation and actual execution are separated across time and provenance. The write can originate from remote
      management, a configuration interface, short-lived process, or compromised administrator, while the later process has
      init, logon host, domain policy, or script interpreter as parent. Without joint correlation of file or registry mutation,
      content version, boot or logon ID, and child process, defenders see only an earlier text difference or later normal
      interpreter activity. Visibility falls further when startup precedes the endpoint sensor.
  - zh: 内联植入保留既有合法脚本的路径、权限、所有者、调用身份和大部分正常语句，只增加少量下载、修补或启动命令；基于新文件或已知路径的清单可能不产生新对象。匿迹不会消除内容差异，逐版本全文、语法化 diff、写入者、异常命令、目标哈希、解释器参数和后继文件/网络行为仍可恢复。系统升级、运维修复与配置下发也会修改相同脚本，限制单一
      diff 的判定力。
    en: Inline implantation preserves an existing legitimate script's path, permission, owner, invocation identity, and most
      normal statements while adding only a small download, patch, or launch command. Inventories based on new files or known
      paths may see no new object. Evasion does not remove content differences. Complete version history, syntax-aware diff,
      writer, unusual command, target hash, interpreter arguments, and downstream file or network behavior remain recoverable.
      System upgrades, administrative repair, and configuration deployment modify the same scripts legitimately, limiting
      the verdict value of one diff.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制的初始化脚本创建、内联增加、命令替换、钩子变更或持久配置归档修改，只要脚本由启动或登录流程自动解释并在当前会话之外恢复行为。判定要求脚本内容或指向脚本的专用钩子发生可归因变化，并证明以后生命周期消费；本地、网络、域、ESXi、Linux、Windows、macOS
      和网络设备是环境，不是子项。
    en: Scope includes adversary-controlled initialization-script creation, inline addition, command replacement, hook mutation,
      or durable configuration-archive change when boot or logon flow interprets the script automatically and restores behavior
      beyond the current session. Classification requires an attributable change to script content or a script-specific hook
      and proof of later lifecycle consumption. Local, network, domain, ESXi, Linux, Windows, macOS, and network-device contexts
      are environments rather than children.
  - zh: 只修改通用自启动描述符而不改变脚本正文归 NJT-0084；创建服务或守护进程定义归 T1543；使用 cron、任务或时间表归 T1053；由其他文件、网络或应用事件触发归 T1546。脚本的混淆、解释器代理执行、下载或二进制修补可作为并行技术记录，但不改变本对象边界。正常升级、映像构建、故障修复、登录管理和设备配置变更只有在攻击者控制内容并产生对应观察影响时才纳入。
    en: A general autostart descriptor change without script-body mutation belongs to NJT-0084. Creation of a service or daemon
      definition belongs to T1543, cron or timetable state to T1053, and triggering by another file, network, or application
      event to T1546. Script obfuscation, interpreter proxy execution, download, or binary patching can be recorded in parallel
      without changing this boundary. Normal upgrades, image builds, repair, logon administration, and device-configuration
      changes enter scope only when an adversary controls content and produces the corresponding observation effect.
  - zh: 系统路径、集中分发或 root/SYSTEM 解释器并不自动表示权限提升。攻击者必须能够从较低权限状态影响被消费的精确脚本内容，并由更高权限解释器完成其原本不能执行的操作；同一用户权限下的登录脚本仍只表示持久化。
    en: A system path, centralized distribution, or a root or SYSTEM interpreter does not automatically establish Privilege
      Escalation. The adversary must be able to influence the exact consumed script content from a lower-authority state and
      have a higher-authority interpreter complete an operation it could not previously perform. A logon script running under
      the same user authority remains Persistence only.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在取得脚本文件、域策略、配置归档、注册表脚本值或网络设备 startup-config 的写权限后，将恢复后门、修补校验、启动代理或下载载荷的命令写入自动解释的脚本，并等待下次启动或登录。既有脚本内联适合无法安全新增明显启动对象、希望保留管理流程和路径外观的场景；全新脚本仍属于父级，但不具备子项的身份共享变量。
      en: After gaining write access to a script file, domain policy, configuration archive, registry script value, or network-device
        startup-config, an adversary writes commands that restore a backdoor, patch verification, start an agent, or download
        a payload and waits for the next boot or logon. Inline use of an existing script fits environments where creating
        an obvious startup object is unsafe and the operator wants to preserve administrative flow and path appearance. A
        new script remains parent scope but lacks the child's shared-identity variable.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要脚本或其持久载体的写权限，理解语法、执行顺序、有效用户、环境变量、只读或压缩文件系统和启动时依赖，并确保插入命令不会使设备或登录流程失败。内联植入还要求识别可保留的合法语句与安全插入位置。签名脚本、受保护分区、配置提交审计、最小管理员权限、映像校验和回滚会限制操作；语法错误或异常子进程会暴露行动。
        en: The adversary needs write authority over the script or durable carrier, understands syntax, execution order, effective
          user, environment variables, read-only or compressed filesystems, and boot-time dependencies, and must avoid breaking
          device or logon flow. Inline implantation additionally requires identifying legitimate statements to preserve and
          a safe insertion point. Signed scripts, protected partitions, configuration-commit audit, least administrator privilege,
          image verification, and rollback constrain the operation. Syntax failure or an unusual child process exposes it.
    defender_model:
      paragraphs:
      - zh: 防守方需要保存脚本全文或可验证版本、哈希、所有者、权限、包来源和写入事务，对内容做语法感知 diff，并连接 boot/logon ID、解释器、命令、有效用户、子进程、目标文件与网络结果。只有路径和单次哈希不能说明哪一行改变，也无法处理执行前已被覆盖的版本；只有进程又会失去写入者。批准升级、包安装、管理员修复和配置管理必须作为可验证反例。
        en: The defender needs complete script text or a verifiable version, hash, owner, permission, package source, and
          mutation transaction, performs syntax-aware content diff, and joins boot or logon ID, interpreter, command, effective
          user, child process, target file, and network outcome. Path and one hash cannot show which line changed or handle
          a version overwritten before execution, while process alone loses the writer. Approved upgrade, package installation,
          administrative repair, and configuration management remain verifiable counter-explanations.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 脚本修改等待后续启动或登录才执行
    en: Script mutation waits for a later boot or logon to execute
  analysis:
    paragraphs:
    - zh: 攻击者先把命令写入持久脚本，创建者随后退出，解释和子进程只在以后启动或登录出现。修改、静置与执行分散到不同会话和重启周期，短窗口审计无法把它们恢复为一条链，形成时空释痕。ATT&CK DET0112 明确要求连接内容变化与后续执行，现场案例直接证明脚本在启动时消费；实际匿迹收益为强推断，保持
        medium。
      en: The adversary first writes commands into a durable script and the creator exits, while interpretation and child
        processes appear only at a later boot or logon. Mutation, dormancy, and execution spread across sessions and reboot
        cycles so short audit windows cannot recover one chain, producing Spatiotemporal Trace Dilution. ATT&CK DET0112 explicitly
        joins content changes to later execution and field cases directly establish startup consumption. Actual evasion benefit
        is strongly inferred and remains medium.
  evidence_refs:
  - REF-000154
  - REF-000157
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 生命周期解释器来源替代较早的脚本写入者
    en: Lifecycle-interpreter provenance replaces the earlier script writer
  analysis:
    paragraphs:
    - zh: init、登录宿主或设备启动流程以自身身份读取脚本并产生目标行为，进程与命令侧显示正常解释器和高权限上下文，而原写入主体只在更早的文件、注册表或配置事务中出现。只观察当前父子进程会遗漏内容由谁改变，关键因果落在既有分析理解之外，形成行为透明；版本化内容和写入审计仍可恢复，因此
        medium。
      en: Init, logon host, or device startup flow reads the script under its own identity and produces target behavior, so
        process and command telemetry shows a normal interpreter and privileged context while the original writer appears
        only in earlier file, registry, or configuration transactions. Current parent-child observation misses who changed
        content, leaving critical causality outside analytic understanding and producing Behavioral Transparency. Versioned
        content and write audit can recover the chain, leaving confidence at medium.
  evidence_refs:
  - REF-000154
  - REF-000157
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 内联命令与合法脚本共享路径、权限和多数正常内容
    en: Inline commands share path, permission, and most normal content with a legitimate script
  analysis:
    paragraphs:
    - zh: UNC3886 和 Velvet Ant 把命令或组件加入既有启动脚本，ATT&CK 还记录 APT29 劫持合法应用启动脚本。行为保留脚本路径、所有者和多数合法语句，使新文件清单与路径信誉规则缺少明显差异，恶意行借用合法脚本身份形成特征伪装。逐行
        diff、命令语义和子进程仍可区分；来源未量化检测收益，所以保持 medium。
      en: UNC3886 and Velvet Ant added commands or components to existing startup scripts, and ATT&CK records APT29 hijacking
        legitimate application startup scripts. The behavior preserves script path, owner, and most legitimate statements,
        leaving no obvious new-file difference for path-reputation rules and allowing malicious lines to borrow legitimate
        script identity, producing Feature Disguise. Line-level diff, command semantics, and child process remain discriminating.
        Sources do not quantify detection benefit, so confidence remains medium.
  evidence_refs:
  - REF-000154
  - REF-000155
  - REF-000156
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立两项 Niji 原生子技术。既有初始化脚本内联植入以保留脚本路径和大部分合法正文、只加入局部命令为变量；集中初始化脚本扇出以一份上游脚本状态被多个下游主体在各自生命周期消费为变量。前者要求逐版本内容 diff 与行级恢复，后者要求中央版本/目标范围到多端登录执行的扇出图与中央回滚验证。
      en: This technique defines two Niji-native children. Existing Initialization-Script Inline Implantation preserves script
        path and mostly legitimate body while adding local commands. Centralized Initialization-Script Fan-Out has one upstream
        script state consumed by multiple downstream principals at their own lifecycle events. The former needs versioned
        content difference and line-level recovery; the latter needs a fan-out graph from central version and target scope
        to multiple endpoint logon executions plus central rollback verification.
  coverage: established
  subtechnique_refs:
  - NJS-0085-001
  - NJS-0085-002
