schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0086-001
parent_ref: NJT-0086
name:
  zh: 受信集成拟态
  en: Trusted-Integration Impersonation
summary:
  zh: 恶意应用模仿已知合法集成的名称或用途并经正常授权流程取得平台 token，使资源活动看似来自受信连接器。
  en: A malicious app imitates a known legitimate integration's name or purpose and obtains platform tokens through normal authorization flow,
    making resource activity appear to originate from a trusted connector.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信集成拟态是攻击者控制的云应用或 connected app 模仿组织熟悉的合法集成名称、用途或授权步骤，并由受害租户正常签发 OAuth token 的匿迹子技术。其直接目标不是伪造 token，而是让恶意应用以平台认可的身份和用户熟悉的业务语境取得持续权限。
    en: Trusted-Integration Impersonation is an evasion sub-technique in which an attacker-controlled cloud or connected app imitates a legitimate
      integration name, purpose, or authorization steps familiar to an organization and receives OAuth tokens normally issued by the victim tenant.
      Its direct objective is not token forgery but durable permission under a platform-recognized identity and familiar business context.
  - zh: Data Loader 是证据中的实现，不是分类边界。只有名称或用途相似且 client ID、publisher、tenant、redirect URI、scope 或真实行为与所声称应用不一致时才成立；完全新颖且不拟态的恶意应用属于父级。
    en: Data Loader is an evidenced implementation rather than the taxonomy boundary. The child requires a similar name or purpose combined with
      inconsistency in client ID, publisher, tenant, redirect URI, scope, or actual behavior. A wholly novel malicious app without impersonation
      stays at parent scope.
stealth_characteristics:
  paragraphs:
  - zh: 受信集成拟态把恶意应用置于正常 connected-app 页面、consent 流程和平台 token 之内，用户与防守方首先看到熟悉应用主题和成功授权，而不是异常密码登录。FBI 明确说明 UNC6040 的活动因此可看似受信集成并绕过 MFA、密码重置和登录监控。
    en: Trusted-Integration Impersonation places a malicious app inside a normal connected-app page, consent flow, and platform token. Users and
      defenders first see a familiar application theme and successful authorization rather than an anomalous password sign-in. The FBI explicitly
      states that UNC6040 activity can therefore appear as a trusted integration and bypass MFA, password resets, and sign-in monitoring.
  - zh: 平台并未隐藏真实应用身份。client ID、publisher verification、home tenant、redirect URI、请求 scope、consenter、token audience 和资源调用仍可与合法应用基线比较；Google 与 FBI
      的调查正通过 actor-controlled version 与 Data Loader 的差异识别。若 SaaS 不暴露这些字段，只能依赖资源行为，置信度下降。
    en: The platform does not hide actual application identity. Client ID, publisher verification, home tenant, redirect URI, requested scope,
      consenter, token audience, and resource calls remain comparable with the legitimate-app baseline. Google and FBI investigations identify
      the actor-controlled version as distinct from Data Loader. When SaaS omits those fields, analysis depends on resource behavior and confidence
      falls.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入恶意应用对已知合法集成身份或用途的有意模仿、正常 consent/token 流程及持续资源访问。要求至少一个主题相似点和两个可验证身份或行为冲突；仅名称相同、合法 fork、测试应用或迁移版本不够。
    en: Include deliberate imitation of a known legitimate integration identity or purpose, normal consent or token flow, and durable resource
      access. Require at least one thematic similarity and two verifiable identity or behavior conflicts. A shared name, legitimate fork, test
      app, or migration version is insufficient.
  - zh: 不拟态的新恶意应用归父级；既有应用 credential/role 变化若直接对象是身份边归 T1098；诱导用户 consent 是前置行为，数据外传是后继效果。不得按 Salesforce、Microsoft、Google、scope 或 app 类型拆分。
    en: A new malicious app without impersonation belongs to the parent. Existing-app credential or role mutation whose direct object is an identity
      edge belongs to T1098. User-consent inducement is preceding behavior and exfiltration is a downstream effect. No partition by Salesforce,
      Microsoft, Google, scope, or app type is permitted.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在可以诱导或控制具备 consent 权限的用户时，注册一个模仿常用导入、同步、备份或协作工具的应用，引导其完成标准 connected-app 授权，再用 token 长期查询或导出资源。该变量适合用户熟悉远程 IT 支持和第三方集成、且防守只关注账户登录的环境。
      en: When an adversary can induce or control a user with consent authority, the operator registers an app imitating a common import, synchronization,
        backup, or collaboration tool, guides standard connected-app authorization, and then uses tokens to query or export resources over time.
        The variable fits environments where users expect remote IT support and third-party integrations and defense focuses on account sign-ins.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 需要可注册应用、控制其 client/redirect URI 和凭据、获得足够 consent，并了解合法集成的名称与用途。publisher 验证、固定 client ID、管理员审批、scope 最小化和异常资源行为会限制拟态；错误身份字段或过宽调用会暴露。
        en: Requires ability to register an app, control client or redirect URI and credential, obtain sufficient consent, and know the legitimate
          integration's name and purpose. Publisher verification, pinned client ID, administrator approval, least scope, and anomalous-resource
          controls constrain impersonation. Incorrect identity fields or excessive calls expose it.
    defender_model:
      paragraphs:
      - zh: 防守方需保存批准合法应用的不可变身份，而不是名称列表，并连接 consent 与 token/API。缺少 client ID、publisher、tenant 或资源日志时，平台签发 token 只证明授权成功，不证明操作者合法。
        en: The defender needs immutable identities of approved legitimate apps rather than a name list and joins consent to token and API use.
          Without client ID, publisher, tenant, or resource logs, a platform-issued token proves successful authorization but not legitimate operator.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 合法应用主题与平台 token 替代恶意集成的显著特征
    en: A legitimate-app theme and platform token replace conspicuous malicious-integration features
  analysis:
    paragraphs:
    - zh: 攻击者控制的 Data Loader 版本经过正常授权并取得 Salesforce token，名称、流程和 token 均接近合法集成，粗粒度规则难以区分，形成特征伪装。FBI 对受信外观和控制绕过有直接表述，Google 独立支持活动，confidence high。真实
        client ID、publisher、tenant、redirect URI 与行为仍残留。
      en: An actor-controlled Data Loader version passes normal authorization and obtains Salesforce tokens, making name, flow, and token resemble
        a legitimate integration and weakening coarse classification, which produces Feature Disguise. The FBI directly states trusted appearance
        and control bypass and Google independently supports the activity, leaving confidence high. Actual client ID, publisher, tenant, redirect
        URI, and behavior remain.
  evidence_refs:
  - REF-000159
  - REF-000160
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: consent 与以后平台 token 资源活动需要跨平面恢复
    en: Consent and later platform-token resource activity require cross-plane reconstruction
  analysis:
    paragraphs:
    - zh: 用户完成 consent 后，应用以后独立取得 token 并访问资源，原用户登录监控不再覆盖真实调用者；只有连接 grant、app、token 与 resource 才能恢复因果，形成行为透明。DET0539 与 FBI 支持，confidence high。
      en: After user consent, the app independently obtains tokens and accesses resources later, so original-user sign-in monitoring no longer
        covers the actual caller. Only joining grant, app, token, and resource recovers causality, producing Behavioral Transparency. DET0539
        and the FBI support this at high confidence.
  evidence_refs:
  - REF-000159
  - REF-000162
  confidence: high
