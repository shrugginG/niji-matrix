research:
  limitations:
    paragraphs:
    - zh: 直接证据来自 Salesforce connected apps，Microsoft OAuth 调查支持更广应用持久化，但不证明每个 SaaS 都暴露相同身份字段。跨平台名称只表示可适用变量，不表示观察强度相同。
      en: Direct evidence comes from Salesforce connected apps. Microsoft OAuth investigations support broader application persistence but do
        not establish identical identity fields across SaaS. Cross-platform naming expresses an applicable variable rather than equal observation
        strength.
    - zh: 合法供应商迁移、测试实例和同名内部应用会产生相似冲突，真实批准应用被攻陷时又可能无身份差异。必须以两个以上身份/行为冲突和资源活动确认；否则降为 hypothesis 或父级异常。
      en: Legitimate vendor migration, test instances, and same-named internal apps create similar conflicts, while a compromised approved app
        may have no identity difference. Confirmation requires at least two identity or behavior conflicts plus resource activity; otherwise downgrade
        to hypothesis or parent-level anomaly.
