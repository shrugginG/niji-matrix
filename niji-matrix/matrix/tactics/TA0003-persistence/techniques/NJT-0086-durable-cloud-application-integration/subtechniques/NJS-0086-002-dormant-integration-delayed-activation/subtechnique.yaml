schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0086-002
parent_ref: NJT-0086
name:
  zh: 休眠集成延迟激活
  en: Dormant Integration Delayed Activation
summary:
  zh: 攻击者让已获授权且具备凭据的云应用跨过数周或数月静默期后才首次访问资源，使建立事件与使用分离并积累非新建外观。
  en: Adversaries leave an authorized and credentialed cloud application silent for weeks or months before first resource access, separating establishment
    from use and accumulating a non-new appearance.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 休眠集成延迟激活是攻击者先建立或修改具备持续授权和可用凭据的云应用集成，但在一个显著静默期内不调用目标资源，之后才使用应用身份取得 token 或执行 API 操作。分类变量是“持久授权状态与首次资源使用之间的攻击者控制等待”，不是 OAuth token 的普通寿命；其直接目标是让高风险建立事件离开短期告警窗口，并使应用年龄不再表现为刚创建。
    en: Dormant Integration Delayed Activation occurs when an adversary first establishes or modifies a cloud application integration with durable
      grant and usable credentials, avoids invoking target resources through a material silent interval, and only later uses application identity
      to obtain tokens or perform API operations. The variable is adversary-controlled waiting between durable grant state and first resource
      use rather than ordinary OAuth token lifetime. Its direct objective is to move a high-risk establishment event outside short alert windows
      and make application age no longer appear newly created.
  - zh: 进入本子项必须同时证明建立/授权状态、可用凭据、静默间隔和以后首次或恢复使用；一个从未使用的休眠应用只是风险状态，正常低频业务集成也不是攻击。延迟阈值由本地应用类型和基线决定，Microsoft 的数周或数月观察提供行为锚而非统一硬阈值。
    en: Classification requires establishment or grant state, usable credential, a silent interval, and later first or resumed use together. A
      dormant application never used is only risk state, and a legitimately low-frequency business integration is not an attack. The delay threshold
      follows local application type and baseline; Microsoft's observation of weeks or months anchors behavior rather than imposing one universal
      threshold.
stealth_characteristics:
  paragraphs:
  - zh: 休眠集成延迟激活把创建、凭据添加和 consent 留在较早控制面窗口，把 token 与资源调用推迟到防守方可能不再关联的时间。应用在此期间积累年龄，依赖“新应用立即高权限活动”或短回溯的规则失去区分力；资源侧只看到已存在应用的正常协议访问。Microsoft 直接观察到恶意应用在数周或数月后才被使用。
    en: Dormant Integration Delayed Activation leaves creation, credential addition, and consent in an earlier control-plane window while postponing
      token and resource calls until defenders may no longer correlate them. The application accumulates age during the interval, weakening rules
      for immediate high-privilege activity by a new app or short lookback, while the resource side sees normal-protocol access by an existing
      application. Microsoft directly observed malicious applications used weeks or months later.
  - zh: app/service principal ID、创建和 consent 时间、credential key ID、last-used、credential-unused-since、首次 token 来源、资源扇出和权限仍能恢复长窗口链。季节性自动化、灾备、季度报表和停用项目可能合法长时间静默，必须用
      owner、用途、计划、审批和调用周期区分；“老应用”不等于可信。
    en: Application or service-principal ID, creation and consent time, credential key ID, last used, credential unused since, first token origin,
      resource fan-out, and permissions can recover the long-window chain. Seasonal automation, disaster recovery, quarterly reporting, and paused
      projects can remain legitimately silent, requiring owner, purpose, schedule, approval, and invocation cadence for distinction. Old application
      does not mean trusted.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制的云应用集成在完成创建、凭据或授权后保持显著静默，并在以后首次或恢复访问资源。判定需要同一 app/client/service principal、建立状态仍有效和延迟后的成功使用；只有 token 缓存导致几小时正常间隔、应用定期按计划运行或没有后续使用时不纳入。
    en: Scope includes an adversary-controlled cloud application integration remaining materially silent after creation, credential, or grant
      completion and later first or resumed resource access. Classification needs the same app, client, or service principal, still-valid establishment
      state, and successful delayed use. A normal hours-long token-cache interval, scheduled periodic application, or no downstream use is excluded.
  - zh: 模仿受信应用名称或用途归 NJS-0086-001；挪用既有第三方集成控制归 NJS-0086-003；仅使用被盗一次性 access token 且不依赖持续集成状态属于 token 使用。阈值必须由同类应用基线产生，不能把任意超过固定天数的应用归因恶意。
    en: Imitation of a trusted application name or purpose belongs to NJS-0086-001. Co-option of existing third-party integration control belongs
      to NJS-0086-003. Use of one stolen access token without durable integration state belongs to token use. Thresholds must come from peer-application
      baselines rather than attributing every application older than a fixed number of days.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者利用被攻陷管理员创建 OAuth 应用、添加凭据并授予 Graph 或资源权限后，可以不立即调用 API，而在原账户被修复、相关事件滚出短期队列后再签发 token，用于邮件、虚拟机、垃圾邮件或其他资源操作。若凭据和 consent 未随账户处置撤销，静默集成仍可恢复入口。
      en: After using a compromised administrator to create an OAuth application, add credentials, and grant Graph or resource permissions, an
        adversary can avoid immediate API calls and issue tokens only after the original account is remediated or establishment events leave short
        queues, then operate on mail, virtual machines, spam, or other resources. If credentials and consent are not revoked with account response,
        the silent integration can restore entry.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制应用凭据与持久授权、理解凭据到期和 consent 撤销，并能等待而不失去目标价值。自动禁用未使用高权限应用、短凭据寿命、周期 owner 复核和首次使用审批会压缩静默窗口；首次从异常来源访问高价值资源会暴露行动。
        en: The adversary needs control of application credentials and durable grants, knowledge of expiry and consent revocation, and the ability
          to wait without losing target value. Automatic disablement of unused privileged apps, short credential lifetime, periodic owner review,
          and first-use approval shrink the silent window. First access to high-value resources from an anomalous origin can expose the operation.
    defender_model:
      paragraphs:
      - zh: 防守方需要长期保留应用创建/修改、凭据、consent、权限、token 和资源活动，并计算 last-used 与 credential-unused-since；同类应用的计划和 owner 是必要反例。若控制面日志短于静默期或应用资源日志不携带 client/service
          principal ID，只能看到孤立旧应用活动。
        en: The defender needs long retention for application create or modify, credential, consent, permission, token, and resource activity
          and must compute last used and credential unused since. Peer schedules and owner are necessary counterexamples. When control-plane logs
          are shorter than the silent interval or resource logs omit client or service-principal ID, only isolated activity by an old app remains
          visible.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 长静默期把集成建立与首次资源活动分离
    en: A long silent interval separates integration establishment from first resource activity
  analysis:
    paragraphs:
    - zh: 攻击者先完成高风险、低频的创建/授权，再把使用推迟到另一个观察窗口；两个阶段由同一 app ID 连接，但短保留和新应用阈值会丢失因果。痕迹没有消失，而是沿时间轴展开并要求持久状态与 first-use 关联，形成 NM-ST。Microsoft 对数周或数月延迟的直接观察支持行为，匿迹目的与普遍效果为强推断，故为
        medium。
      en: The adversary first completes high-risk, low-frequency creation or grant and defers use to another observation window. One app ID connects
        the phases, but short retention and new-app thresholds lose causality. Evidence does not disappear; it spreads over time and requires
        durable-state-to-first-use correlation, producing NM-ST. Microsoft's direct observation of weeks- or months-delayed use supports behavior,
        while evasion purpose and general effect are strongly inferred, so confidence is medium.
  evidence_refs:
