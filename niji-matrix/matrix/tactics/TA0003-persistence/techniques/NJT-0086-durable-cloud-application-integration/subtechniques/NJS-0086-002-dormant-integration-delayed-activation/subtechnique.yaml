research:
  limitations:
    paragraphs:
    - zh: Microsoft 报告直接给出恶意应用数周或数月延迟使用，但没有公开每个应用的完整逐日 token 序列、同类基线和告警状态，因而不能量化等待对检测的净收益。正式分类要求实际后继使用，不把静默本身视为攻击。
      en: Microsoft's report directly gives malicious application use delayed by weeks or months but does not publish complete daily token sequences,
        peer baselines, and alert states for every application, so net detection benefit from waiting cannot be quantified. Formal classification
        requires actual downstream use and does not treat silence itself as attack.
    - zh: 当前证据集中于 Microsoft Entra/OAuth；其他云集成只有在具备可持续授权、可识别首次使用和显著静默间隔时才能纳入。日志保留不足时应降级或 defer，不能以应用年龄替代因果。
      en: Evidence centers on Microsoft Entra and OAuth. Another cloud integration qualifies only with durable grant, identifiable first use,
        and a material silent interval. Insufficient retention requires downgrade or deferral rather than substituting application age for causality.
