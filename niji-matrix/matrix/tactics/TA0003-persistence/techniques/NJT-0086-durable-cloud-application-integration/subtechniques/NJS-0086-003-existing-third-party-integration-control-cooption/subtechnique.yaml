schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0086-003
parent_ref: NJT-0086
name:
  zh: 既有第三方集成控制挪用
  en: Existing Third-Party Integration Control Co-option
summary:
  zh: 攻击者取得已批准第三方集成的 token 或供应商侧控制，在不创建新应用或 consent 的情况下以既有 client 身份访问相连租户与资源。
  en: Adversaries obtain tokens or vendor-side control of an approved third-party integration and access connected tenants and resources under
    its existing client identity without a new application or consent.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有第三方集成控制挪用是攻击者取得一个已在目标组织授权的 SaaS 连接器、第三方应用或供应商集成的 OAuth token、密钥或控制面能力，使既有应用对象与授权关系继续存在，但真实操作者转为攻击者。分类变量是“集成身份和 consent 连续、控制者变化”，不是单次
      token 字符串；其直接目标是使用受信 client/integration 身份维持对一个或多个连接资源的访问。
    en: Existing Third-Party Integration Control Co-option occurs when an adversary obtains OAuth tokens, keys, or control-plane capability of
      a SaaS connector, third-party application, or vendor integration already authorized by the target organization, leaving the application
      object and grant relationship in place while the true operator changes. The variable is continuous integration identity and consent with
      changed controller rather than one token string. Its direct objective is continuing access to one or more connected resources under a trusted
      client or integration identity.
  - zh: 与受信集成拟态不同，本子项没有攻击者新建的仿冒应用；与 T1098 新增既有主体凭据也不同，其入口来自第三方集成的既有跨系统关系。只有偷取一次 access token 且 token 到期后不能继续、没有集成级撤销或跨连接影响时，应归 token theft/replay
      而非本子项。
    en: Unlike Trusted-Integration Impersonation, this child has no adversary-created lookalike application. Unlike T1098 addition of a credential
      to an existing principal, its entry comes from an existing cross-system relationship of a third-party integration. Theft of one access token
      that cannot continue after expiry and has no integration-level revocation or cross-connection effect belongs to token theft or replay rather
      than this child.
stealth_characteristics:
  paragraphs:
  - zh: 既有第三方集成控制挪用使目标资源继续看到已批准的 client ID、应用名称、scope 与 consent 历史，且通常没有本租户新应用创建、凭据添加或授权事件。攻击者流量借用供应商集成的既有信誉和正常 API 形状，基于新 client、新 consent 或普通用户
      MFA 的规则缺少触发点。UNC6395 对 Salesloft Drift token 的使用直接证明该行为。
    en: Existing Third-Party Integration Control Co-option leaves target resources seeing an approved client ID, application name, scope, and
      consent history, commonly without a new application creation, credential addition, or grant event in the tenant. Adversary traffic borrows
      the vendor integration's established reputation and normal API shape, leaving rules for a new client, new consent, or ordinary user MFA
      without a trigger. UNC6395's use of Salesloft Drift tokens directly establishes the behavior.
  - zh: token 标识或 hash、签发/刷新来源、供应商事件、IP/ASN、user agent、资源查询模式、多个客户同时异常、应用 last-used 和撤销响应仍能揭示控制转移。合法供应商基础设施也可能更换来源、批量导出或跨租户操作，因而必须结合 vendor 通知、业务用途、正常数据量和客户群基线；已批准集成不是永久允许列表。
    en: Token identifier or hash, issuance or refresh origin, vendor event, IP or ASN, user agent, resource-query pattern, simultaneous anomalies
      across customers, application last used, and revocation response can reveal control transfer. Legitimate vendor infrastructure may change
      origin, export in bulk, or operate across tenants, requiring vendor notification, business purpose, normal data volume, and customer-cohort
      baseline. An approved integration is not a permanent allowlist.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者挪用已获目标租户授权的第三方集成凭据或控制能力，并通过同一应用/client 身份在一个或多个连接系统持续访问。判定需要证明集成与 consent 在攻击前已存在、token/控制转为攻击者使用、资源访问来自该既有关系，以及响应需要集成级或全连接撤销而非仅重置一个用户密码。
    en: Scope includes adversary co-option of credential or control capability of a third-party integration already authorized by the target tenant,
      followed by continuing access to one or more connected systems through the same application or client identity. Classification requires
      proof that integration and consent predated the attack, token or control shifted to adversary use, resource access came from that existing
      relationship, and response required integration-level or all-connection revocation rather than only one user-password reset.
  - zh: 新建或仿冒 connected app 归 NJS-0086-001；创建后等待再用归 NJS-0086-002；仅修改既有用户/服务主体的认证或角色边归 T1098。供应商合法运维、计划导出和 token 轮换是反例；没有真实后继访问时只记录凭据暴露风险。
    en: A new or lookalike connected app belongs to NJS-0086-001. Waiting after creation before use belongs to NJS-0086-002. Mutation only of
      authentication or role edges on an existing user or service principal belongs to T1098. Legitimate vendor maintenance, scheduled export,
      and token rotation are counterexamples. Credential exposure without actual downstream access remains risk state only.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者侵入拥有大量客户连接的 SaaS 供应商或取得其 OAuth token 存储后，可使用相同第三方应用身份查询多个客户 Salesforce、邮件或其他资源。目标租户可能没有新的管理变更，常规账户密码重置也不影响集成 token；处置必须从供应商和每个连接系统同时撤销、轮换并调查。
      en: After compromising a SaaS vendor with many customer connections or obtaining its OAuth token store, an adversary can query multiple
        customer Salesforce, mail, or other resources under the same third-party application identity. A target tenant may have no new administrative
        mutation, and ordinary user-password reset does not affect the integration token. Response must revoke, rotate, and investigate simultaneously
        at the vendor and every connected system.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要取得有效集成 token、刷新能力或供应商控制面，并理解 client scope、API 与客户映射。短 token 寿命、每客户独立密钥、来源绑定、连续访问评估、供应商强认证和异常查询限制会增加成本；跨客户高并发、秘密搜索或查询删除可能暴露行动。
        en: The adversary needs a valid integration token, refresh capability, or vendor control plane and knowledge of client scope, API, and
          customer mapping. Short token lifetime, per-customer independent keys, origin binding, continuous access evaluation, strong vendor authentication,
          and anomalous-query limits raise cost. Cross-customer concurrency, secret searching, or query deletion can expose the operation.
    defender_model:
      paragraphs:
      - zh: 防守方需要目标租户 API 日志、client/integration ID、token/会话标识、来源、scope 和资源行为，并接收供应商侧认证、token 存储与事件通知；跨客户分析可发现共同 client 的同步异常。若供应商不共享事件、资源日志只显示应用名或
          token 无可关联 ID，控制转移难以与合法集成区分。
        en: The defender needs target-tenant API logs, client or integration ID, token or session identifier, origin, scope, and resource behavior
          plus vendor-side authentication, token-store, and incident notifications. Cross-customer analytics can detect synchronous anomaly by
          a common client. If the vendor does not share events, resource logs show only application name, or tokens lack correlatable IDs, control
          transfer is difficult to distinguish from legitimate integration.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 既有供应商 client 身份替代真实攻击者控制来源
    en: An established vendor client identity substitutes for the true adversary control source
  analysis:
    paragraphs:
    - zh: 资源服务授权和记录的是已批准第三方 client，而不是控制 token 的真实操作者。攻击者不创建新应用或授权关系，后续 API 调用继承集成名称、scope 与历史，借合法特征替代控制者差异，形成 NM-FD。Google 的 UNC6395 调查直接连接被盗
        Drift token、既有集成和跨客户资源访问，且响应需要禁用集成，支持 high。
      en: A resource service authorizes and records the approved third-party client rather than the true operator controlling its token. The adversary
        creates no new application or grant, and later API calls inherit integration name, scope, and history, substituting legitimate features
        for controller difference and producing NM-FD. Google's UNC6395 investigation directly joins compromised Drift tokens, existing integrations,
        and cross-customer resource access, with response requiring integration disablement, supporting high confidence.
    - zh: 该机理不意味着平台日志消失。来源、token、资源序列、跨客户共同性和 vendor 事件仍可区分恶意；high 只针对已证实变量与案例，不允许把任何第三方集成异常自动归因攻击者。
      en: The mechanism does not imply absent platform logs. Origin, token, resource sequence, cross-customer commonality, and vendor events still
        distinguish malicious use. High confidence applies to the evidenced variable and case and does not permit automatic attribution of any
        third-party integration anomaly.
