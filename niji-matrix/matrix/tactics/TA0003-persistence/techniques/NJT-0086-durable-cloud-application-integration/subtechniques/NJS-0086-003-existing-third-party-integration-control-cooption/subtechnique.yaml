research:
  limitations:
    paragraphs:
    - zh: 当前直接案例集中于 Salesloft Drift 与 Salesforce/Workspace，足以证明既有第三方集成控制挪用，但不自动覆盖所有 SaaS 供应链事件。其他案例必须证明预先存在的集成身份、攻击者 token/控制和后继资源访问，并与单次 token
        replay 划界。
      en: Direct evidence centers on Salesloft Drift with Salesforce and Workspace. It establishes co-option of existing third-party integration
        control but does not automatically cover every SaaS supply-chain event. Other cases must prove pre-existing integration identity, adversary
        token or control, and downstream resource access and separate the behavior from one-time token replay.
    - zh: 公开报告没有提供每个客户的完整 token 标识、刷新过程和基线，跨客户关联实现取决于供应商合作。分类变量及案例为 high，但在缺少 vendor 证据的单租户告警中应降低事件置信度。
      en: Public reporting omits complete token identifiers, refresh paths, and baselines for every customer, and cross-customer correlation depends
        on vendor cooperation. The variable and case are high confidence, but a single-tenant alert without vendor evidence warrants lower event
        confidence.
