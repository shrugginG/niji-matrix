research:
  limitations:
    paragraphs:
    - zh: 三项变量的证据强度不同。UNC6040/FBI 对仿冒 Data Loader 与受信 token 外观给出直接说明，NJS-0086-001 为 high；Microsoft 直接观察延迟数周/月使用但匿迹收益为推断，NJS-0086-002
        为 medium；Google 直接连接被盗 Drift token、既有集成、跨客户访问与集成级处置，NJS-0086-003 为 high。事件归因仍需合法业务反例。
      en: Evidence strength differs among the three variables. UNC6040 and FBI directly describe Data Loader impersonation
        and trusted-token appearance, supporting high confidence for NJS-0086-001. Microsoft directly observed use delayed
        for weeks or months while evasion benefit remains inferred, leaving NJS-0086-002 medium. Google directly joins compromised
        Drift tokens, existing integrations, cross-customer access, and integration-level response, supporting high confidence
        for NJS-0086-003. Event attribution still requires legitimate business alternatives.
    - zh: 证据集中在 Entra、Salesforce 和 Salesloft Drift。其他云集成只有在证明相同 app/client 键、持续授权、后继资源使用与对应撤销边界时才能纳入；无法区分集成状态与单次 token、缺少长保留或
        vendor 事件时应降级/defer，不能为增加数量外推。
      en: Evidence centers on Entra, Salesforce, and Salesloft Drift. Another cloud integration qualifies only when the same
        app or client key, durable grant, downstream resource use, and matching revocation boundary are proven. Inability
        to separate integration state from one token, short retention, or missing vendor events requires downgrade or deferral
        rather than extrapolation to increase count.
