schema_version: 2.0.0
type: technique
id: NJT-0086
name:
  zh: 持久云应用集成
  en: Durable Cloud Application Integration
summary:
  zh: 攻击者建立、延迟启用或挪用持续授权的云应用集成，在原账户处置后仍以应用 token 访问资源，并通过受信 client 外观、长静默期或既有供应商关系降低识别。
  en: Adversaries establish, delay activation of, or co-opt a durably authorized cloud application integration to access resources
    with application tokens after original-account remediation, reducing detection through trusted-client appearance, long
    silence, or an existing vendor relationship.
aliases:
- Cloud Application Integration
classification:
  tactic_refs:
  - TA0003
  origin:
    kind: attack-retained
    source_attack_id: T1671
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1671
definition_and_concept:
  paragraphs:
  - zh: 持久云应用集成是攻击者创建、加入或挪用 SaaS 租户中的应用、service principal、connected app、连接器或等价集成，并通过同意、权限、角色与应用凭据建立可持续 token 访问的技术。其直接目标是把一次用户或管理员控制转换为独立应用身份，使原账户密码重置、会话撤销或禁用后仍能读取、修改或自动处理资源。
    en: Durable Cloud Application Integration is a technique in which an adversary creates, adds, or co-opts an application,
      service principal, connected app, connector, or equivalent integration in a SaaS tenant and establishes continuing token
      access through consent, permission, role, and application credential. Its direct objective is to convert temporary user
      or administrator control into an independent application identity that can read, change, or automate resources after
      original-account password reset, session revocation, or disablement.
  - zh: 概念锚是“应用对象与持续授权组成的集成关系”，不是 OAuth 标准、单个 scope、产品名称或某次 API 调用。应用创建、同意、凭据和以后资源使用共同证明对象；只改变既有主体的凭据或角色归 T1098，只发生一次 token
      使用而没有持久 grant 不纳入。
    en: The conceptual anchor is the integration relationship composed of application object and durable grant rather than
      OAuth itself, one scope, product name, or one API call. Application creation, consent, credential, and later resource
      use jointly establish the object. Mutation only to credentials or roles of an existing identity belongs to T1098, while
      one token use without a durable grant is excluded.
stealth_characteristics:
  paragraphs:
  - zh: 应用注册、同意、权限、owner 和凭据变化位于云控制面，后续 app-only token 与邮件、文件、CRM 或管理 API 活动位于身份和数据面，并可能延迟数周或数月。若日志不能按 app/client ID、service
      principal、consenter、grant、credential、token 与 resource 连接，防守方会分别看到一次普通集成变更和来自平台认可应用身份的正常 API 调用。
    en: Application registration, consent, permission, owner, and credential changes occur in cloud control planes, while
      later app-only tokens and mail, file, CRM, or management API activity occur in identity and data planes and can be delayed
      by weeks or months. Without correlation by app or client ID, service principal, consenter, grant, credential, token,
      and resource, defenders see a routine integration change and normal API calls from a platform-recognized application
      identity separately.
  - zh: 恶意集成还可模仿 Data Loader 等已知合法应用的名称或用途，并使用 SaaS 正常签发的 OAuth token；FBI 明确指出这会让活动看似来自受信集成并绕过 MFA、密码重置和普通登录监控。残余线索包括 client
      ID、publisher、tenant、redirect URI、scope、consenter、资源扇出和行为差异，显示名与平台 token 均不能单独证明合法。
    en: A malicious integration can also imitate the name or purpose of a known legitimate application such as Data Loader
      and use OAuth tokens normally issued by the SaaS platform. The FBI explicitly states that this makes activity appear
      to originate from a trusted integration and bypass MFA, password reset, and ordinary login monitoring. Client ID, publisher,
      tenant, redirect URI, scope, consenter, resource fan-out, and behavioral differences remain; neither display name nor
      platform token proves legitimacy.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制且可在原会话之外持续的应用注册/加入/挪用、同意、权限或角色 grant、应用凭据及其 token 资源访问。判定要求存在可解析应用对象和持续授权，并证明攻击者控制或使用；Office Suite、Salesforce、Google
      Workspace 和其他 SaaS 只是环境。
    en: Scope includes adversary-controlled and cross-session application registration, addition or co-option, consent, permission
      or role grant, application credential, and its token-based resource access. Classification requires a resolvable application
      object and durable grant plus evidence of adversary control or use. Office suites, Salesforce, Google Workspace, and
      other SaaS are environments only.
  - zh: 既有用户或服务主体自身凭据/成员关系变化归 T1098；因事件自动触发代码归 T1546；只窃取或重放现有 token、一次授权调用、无后续权限的应用注册和纯数据外传均不构成本对象。合法集成上线、迁移、备份和审计必须作为反例，不能从宽
      scope 或新应用直接推断恶意。
    en: Credential or membership mutation of an existing user or service principal belongs to T1098, while code automatically
      triggered by an event belongs to T1546. Theft or replay of an existing token, one authorized call, app registration
      without later permission, and pure exfiltration do not by themselves establish this object. Legitimate integration onboarding,
      migration, backup, and audit are counter-explanations; broad scope or a new app cannot directly prove maliciousness.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在取得可创建应用或获得用户/管理员同意的权限后，注册恶意应用、加入合法应用、挪用既有连接器或诱导员工批准 connected app，再添加凭据并延迟调用 API。该技术适合希望在最初账户处置后继续读取邮件、文件或 CRM、发送内容、自动外传或维持管理能力的场景。
      en: After gaining authority to create an app or obtain user or administrator consent, an adversary registers a malicious
        app, adds a legitimate app, co-opts a connector, or induces an employee to approve a connected app, then adds credentials
        and delays API use. The technique fits continued mail, file, or CRM access, sending, automated exfiltration, or administrative
        capability after the initial account is remediated.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 需要应用注册或同意能力、可控 app credential/token、目标 API 与 scope 知识，并承受 publisher 验证、管理员审批、条件访问、token 寿命和异常应用监控。拟态还需知道合法 client
          identity 与业务用途；错误 redirect URI、过宽权限或异常扇出会暴露。
        en: Requires application registration or consent capability, a controlled app credential or token, and knowledge of
          target API and scope, while facing publisher verification, administrator approval, conditional access, token lifetime,
          and anomalous-app monitoring. Impersonation also requires knowledge of legitimate client identity and business purpose.
          Incorrect redirect URI, excessive permission, or unusual fan-out exposes the operation.
    defender_model:
      paragraphs:
      - zh: 防守方需要应用与 service principal 审计、consent/grant、credential、token、资源活动、批准清单和原账户处置状态，并按稳定 app/client ID 而非名称关联到 grant
          到期或撤销。SaaS 不提供 token 或对象级活动、跨租户日志不共享、真实批准应用被控时会形成盲区。
        en: The defender needs application and service-principal audit, consent or grant, credential, token, resource activity,
          approved inventory, and original-account remediation state correlated by stable app or client ID rather than name
          until grant expiry or revocation. Blind spots arise when SaaS omits token or object-level activity, cross-tenant
          logs are not shared, or a genuinely approved app is compromised.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 集成授权与延迟资源活动分布在控制、身份和数据平面
    en: Integration grant and delayed resource activity span control, identity, and data planes
  analysis:
    paragraphs:
    - zh: 攻击者先配置应用、consent、scope、role 与 credential，随后由独立应用身份取得 token 并调用资源，甚至在原账户处置后继续。配置与使用使用不同日志和标识且可间隔数月，单一登录或同意监控无法恢复因果，形成行为透明。Microsoft
        与 DET0539 直接支持跨平面关联，confidence high。
      en: The adversary first configures app, consent, scope, role, and credential, then obtains tokens and calls resources
        under an independent application identity, continuing after original-account remediation. Configuration and use employ
        different logs and identifiers and may be months apart, so one sign-in or consent monitor cannot recover causality,
        producing Behavioral Transparency. Microsoft and DET0539 directly support cross-plane correlation, leaving confidence
        high.
  evidence_refs:
  - REF-000145
  - REF-000161
  - REF-000162
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 合法应用拟态与平台 token 使恶意活动呈现受信集成外观
    en: Legitimate-app mimicry and platform tokens make malicious activity appear as a trusted integration
  analysis:
    paragraphs:
    - zh: UNC6040 诱导授权攻击者控制的 Data Loader 版本，随后使用 Salesforce 签发 token；FBI 明确说明活动看似来自受信集成并绕过常规身份控制。恶意实体共享合法应用名称、流程和 token 外观，形成特征伪装。client
        ID、publisher、tenant、redirect URI、scope 和行为仍可区分，证据直接且 confidence high。
      en: UNC6040 induced authorization of an actor-controlled Data Loader version and then used Salesforce-issued tokens.
        The FBI explicitly states that activity appears to come from a trusted integration and bypasses ordinary identity
        controls. The malicious entity shares legitimate application name, flow, and token appearance, producing Feature Disguise.
        Client ID, publisher, tenant, redirect URI, scope, and behavior remain discriminators. Evidence is direct and confidence
        high.
  evidence_refs:
  - REF-000159
  - REF-000160
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立三项 Niji 原生子技术。受信集成拟态以攻击者新建应用模仿合法 client 身份/用途为变量；休眠集成延迟激活以持久授权跨显著静默期后才首次使用为变量；既有第三方集成控制挪用以应用/client/consent
        连续而供应商 token 或控制者转为攻击者为变量。三者分别需要名称与 publisher/redirect 一致性、长窗口 first-use 和 vendor/token/跨客户关联。
      en: This technique defines three Niji-native children. Trusted-Integration Impersonation varies an adversary-created
        application imitating legitimate client identity or purpose. Dormant Integration Delayed Activation varies durable
        grant first used after a material silent interval. Existing Third-Party Integration Control Co-option varies continuous
        application, client, and consent identity while vendor token or controller shifts to the adversary. They respectively
        require name-to-publisher or redirect coherence, long-window first use, and vendor, token, or cross-customer correlation.
    - zh: 产品、授权范围和 OAuth 协议类型不构成子技术边界；应用专用的最小授权范围本身也没有足够证据证明独立匿迹效果。既有身份的角色或凭据边属于相邻身份访问状态操纵，单次 token 重放属于会话状态使用，而不进入本分类。
      en: Product, authorization scope, and OAuth protocol type do not define children, and an application-specific minimum
        scope alone lacks sufficient evidence of an independent stealth effect. Role or credential edges on an existing identity
        belong to adjacent identity access-state manipulation, while one-time token replay is session-state use and remains
        outside this taxonomy.
  coverage: established
  subtechnique_refs:
