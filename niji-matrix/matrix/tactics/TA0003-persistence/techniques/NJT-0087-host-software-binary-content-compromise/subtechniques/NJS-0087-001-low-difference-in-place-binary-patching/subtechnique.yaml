schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0087-001
parent_ref: NJT-0087
name: {zh: 低差异原位二进制补丁, en: Low-Difference In-Place Binary Patching}
summary:
  zh: 攻击者在同一路径二进制中只改变实现恶意控制所需的少量字节、指令或段，保留近似尺寸和绝大多数代码，使粗粒度软件清单仍显示熟悉对象。
  en: Adversaries change only the small set of bytes, instructions, or sections needed for malicious control in a binary at the same path, preserving approximate size and most code so coarse software inventory still shows a familiar object.
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 低差异原位二进制补丁是攻击者在主机已经部署的可执行文件或库内，只修改改变目标验证、认证、控制或执行语义所需的局部字节、指令、函数或段，同时保留原路径、文件布局和绝大多数原始内容的匿迹子技术。其直接目标是在不替换整个映像身份的情况下，让以后正常调用执行被改变的逻辑。
      en: Low-Difference In-Place Binary Patching is an evasion sub-technique in which an adversary changes only local bytes, instructions, functions, or sections needed to alter target validation, authentication, control, or execution semantics inside an already deployed executable or library while preserving path, file layout, and most original content. Its direct objective is to have later normal invocation execute changed logic without replacing the whole image identity.
    - zh: 区分变量是相对于可信同版本映像的 delta 规模与位置，不是文件大小绝对值、补丁工具或平台。UNC3886 将 `/bin/smit` 只改变一个字节，提供直接极端实例；局部补丁可以落在入口点、条件跳转或验证函数，但必须证明大部分内容保持且变化足以造成恶意结果。整映像替换归 NJS-0087-002，显式恶意前奏后调用原程序归 NJS-0087-003。
      en: The distinguishing variable is delta scale and location relative to a trusted same-version image rather than absolute file size, patching tool, or platform. UNC3886 changed only one byte in `/bin/smit`, providing a direct extreme instance. A local patch can affect an entry point, conditional branch, or validation function, but most content must remain and the difference must be shown to cause a malicious outcome. Whole-image replacement belongs to NJS-0087-002 and an explicit malicious prelude followed by the original program to NJS-0087-003.
stealth_characteristics:
  paragraphs:
    - zh: 低差异原位二进制补丁保留路径、名称、权限、调用者、近似尺寸、绝大多数代码和业务功能，只在少量控制流或数据上产生差异。文件 inventory、父进程白名单、软件版本标签和仅采样部分区段的检查可能继续接受它；正常用户或服务调用看到原功能，而攻击者选择的输入或路径触发改变语义。
      en: Low-Difference In-Place Binary Patching preserves path, name, permission, caller, approximate size, most code, and business function and changes only a small control-flow or data region. File inventory, parent-process allowlists, software-version labels, and checks sampling only some sections can continue accepting it. Normal user or service invocation sees original function while an adversary-selected input or path triggers changed semantics.
    - zh: 补丁仍改变 whole-file hash、受影响段/页/函数、签名或 package verification，并可能留下 writer、时间、权限、内存页和异常执行结果。可信同版本 byte/segment/function 比较能直接定位 delta；合法 hotpatch、厂商安全修复和内存 instrumentation 也会产生小变化。没有版本匹配和控制流/结果证明时，“小差异”不能自动等于恶意。
      en: The patch still changes the whole-file hash, affected section, page, or function, signature or package verification and can leave writer, time, permission, memory-page, and anomalous-execution outcomes. Trusted same-version byte, section, or function comparison can locate the delta directly. Legitimate hotpatches, vendor security fixes, and memory instrumentation also make small changes. Without a version match and control-flow or outcome proof, a small difference is not automatically malicious.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入同一路径既有二进制的局部持久内容变化以及以后调用，要求可信同版本基线、可量化/定位 delta、攻击者控制或未批准 writer 和由该变化产生的恶意语义。delta 可以很小但不以固定字节或百分比阈值定义；平台、格式、函数用途和补丁工具不分类。
      en: This child includes local durable content change to an existing binary at the same path plus later invocation and requires a trusted same-version baseline, a measurable or locatable delta, adversary-controlled or unapproved writer, and malicious semantics caused by the change. The delta can be small but is not defined by a fixed byte or percentage threshold. Platform, format, function purpose, and patching tool do not classify.
    - zh: 整个映像或大部分包被替换时归 NJS-0087-002；恶意 wrapper 明确调用原副本时归 NJS-0087-003；内存临时 patch 若不能跨下一次调用/重启保留则不属于本 Persistence 子项；加载路径重定向归 T1574。合法 hotpatch、厂商补丁、调试断点和 instrumentation 必须以签名、工单、包事务与预期函数差异排除。
      en: Replacement of a whole image or most package belongs to NJS-0087-002, a malicious wrapper explicitly invoking an original copy to NJS-0087-003, and a temporary memory patch that does not survive another invocation or restart is outside this Persistence child. Load-path redirection belongs to T1574. Legitimate hotpatches, vendor updates, debugging breakpoints, and instrumentation require signature, change record, package transaction, and expected function difference as counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者取得高价值 appliance、认证/管理工具或常用系统二进制的写入能力后，定位一个决定验证或控制结果的关键条件，做单字节/短指令/局部段修改，并等待管理员、服务或系统例行调用。UNC3886 的 `/bin/smit` 单字节变化展示极小 delta；类似方法可改变认证分支、访问检查或命令处理而保持大多数功能。
        en: After obtaining write capability over a high-value appliance, authentication or administration tool, or common system binary, an adversary locates a critical condition determining validation or control outcome, makes a one-byte, short-instruction, or local-section change, and waits for an administrator, service, or system to invoke it routinely. UNC3886's one-byte `/bin/smit` change demonstrates an extremely small delta. Similar methods can alter an authentication branch, access check, or command handling while preserving most function.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要目标文件或运行映像写权限、与版本/架构匹配的逆向能力、对指令集、ABI、签名与控制流的理解，并能预测局部变化不会破坏程序。需要在受限环境验证正常路径与攻击者路径，控制写入时点和权限；错误 offset、校验和、重定位或并发更新会造成崩溃、不可启动或明显完整性告警。
          en: The adversary needs write authority over the target file or runtime image, reverse-engineering capability matched to version and architecture, knowledge of instruction set, ABI, signing, and control flow, and confidence that a local change will not break the program. It must test normal and adversary paths in a constrained environment and control write time and permission. A wrong offset, checksum, relocation, or concurrent update causes crash, boot failure, or conspicuous integrity alert.
        - zh: 攻击者还需让补丁跨预期调用或重启存在，或者阻止合法更新覆盖。签名执行、只读系统分区、package verification、same-version hash/segment attestation、JIT 写权和自动恢复提高成本。若只能在当前进程短暂修改内存且无法影响以后调用，本子项不成立。
          en: The adversary also needs the patch to survive expected invocation or reboot or to prevent a legitimate update from overwriting it. Signed execution, read-only system partitions, package verification, same-version hash or section attestation, JIT write authority, and automatic recovery raise cost. If only the current process memory can be changed briefly with no effect on later invocation, the child does not hold.
    defender_model:
      paragraphs:
        - zh: 防守方需要与设备、版本、架构和包构建匹配的可信二进制，whole-file、段/页/函数 hash 或 byte diff、签名/package status、writer 进程/主体、写入/权限/时间和以后加载/执行结果。只比较文件名、路径、尺寸或版本字符串会遗漏；只有内容差也不能证明哪一分支产生恶意行为。
          en: Defenders need a trusted binary matching device, version, architecture, and package build; whole-file, section, page, or function hash or byte diff; signature or package status; writer process or principal; write, permission, and time; and later load or execution outcome. Filename, path, size, or version-string comparison alone misses the patch, while content difference alone cannot establish which branch caused malicious behavior.
        - zh: appliance 文件不可导出、供应者不发布同版本基线、符号被剥离、patch 只在内存存在或日志短于首次调用会形成盲区。合法 hotpatch 和 instrumentation 可通过批准、签名、package transaction、目标函数与预期寿命排除；无法解释 delta 语义时保持完整性异常或 hypothesis，不夸大为确认子项。
          en: Nonexportable appliance files, no same-version vendor baseline, stripped symbols, memory-only patches, and logs expiring before first invocation create blind spots. Legitimate hotpatches and instrumentation can be excluded through approval, signature, package transaction, target function, and intended lifetime. When delta semantics cannot be explained, retain an integrity anomaly or hypothesis rather than overstating a confirmed child.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 极小内容 delta 保留合法软件绝大多数可见特征, en: A tiny content delta preserves most visible features of legitimate software}
    analysis:
      paragraphs:
        - zh: 攻击者只改变控制恶意语义所需的少量字节或局部段，路径、名称、调用者、尺寸和大多数代码仍与合法软件一致。粗粒度 inventory 与路径/父进程允许逻辑缺少受影响函数差异，恶意版本借用原软件绝大多数特征，形成特征伪装。UNC3886 单字节实例直接证明该行为。
          en: The adversary changes only the few bytes or local section needed for malicious semantics while path, name, caller, size, and most code remain identical to legitimate software. Coarse inventory and path or parent-process allow logic lack the affected-function difference, allowing the malicious version to borrow most original-software features and produce Feature Disguise. The UNC3886 one-byte instance directly establishes the behavior.
        - zh: 同版本 byte/segment/function diff、签名、writer 和运行结果仍能区分。来源直接证明单字节变化，但没有证明所有局部补丁的攻击者都以保持近似外观为主观目的，故机理保持 medium；缺少同版本基线或无法验证控制流时降为 hypothesis。
          en: Same-version byte, section, or function differential, signature, writer, and runtime outcome remain discriminating. The source directly establishes a one-byte change but does not prove that every local patch is subjectively chosen to preserve similar appearance, so mechanism confidence remains medium. Missing same-version baseline or unvalidated control flow lowers it to hypothesis.
    evidence_refs: [REF-000155, REF-000163, REF-000164]
    confidence: medium
defense: {detections: {coverage: available, strategy_refs: [DET-000068]}, mitigations: {coverage: available, mitigation_refs: [MIT-000067]}}
evidence: {claim_refs: [CLM-000338, CLM-000339, CLM-000340], case_refs: [CASE-000058], reference_refs: [REF-000155, REF-000163, REF-000164]}
research:
  limitations:
    paragraphs:
      - zh: 当前直接实例是类 Unix 安全 appliance 上 `/bin/smit` 的单字节变化，支持极小 delta、熟悉路径和后继语义，但不能代表所有平台、文件格式或补丁持久方式。父级其他案例涉及整映像替换或 wrapper，不能用来提高本子项置信度。
        en: The direct instance is a one-byte change to `/bin/smit` on a Unix-like security appliance and supports a tiny delta, familiar path, and downstream semantics, but cannot represent every platform, file format, or patch-persistence method. Other parent cases involve whole-image replacement or wrappers and cannot raise this child's confidence.
      - zh: 合法安全 hotpatch、厂商修复、调试断点和 observability instrumentation 是强反例；没有 package transaction、同版本基线与运行结果时只证明二进制不同。delta 大小没有通用阈值，研究者必须说明为何变化局部、为何大部分身份保留以及哪一结果由它产生。
        en: Legitimate security hotpatches, vendor fixes, debugging breakpoints, and observability instrumentation are strong counterexamples. Without a package transaction, same-version baseline, and runtime outcome, only binary difference is established. Delta size has no universal threshold; researchers must explain why the change is local, why most identity remains, and which outcome it causes.
