schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0087-002
parent_ref: NJT-0087
name:
  zh: 整映像路径身份替换
  en: Whole-Image Path-Identity Substitution
summary:
  zh: 攻击者用恶意映像整体替换既有软件二进制，同时保留标准路径、名称和正常调用关系，使粗粒度软件清单继续指向熟悉对象。
  en: Adversaries wholly replace an existing software binary with a malicious image while preserving its standard path, name, and normal invocation,
    leaving coarse software inventory pointing to a familiar object.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 整映像路径身份替换是攻击者移除、覆盖或调换既有软件二进制的原执行映像，在同一规范路径放置攻击者构建的恶意映像，使服务、用户或其他程序继续按原名称调用。分类变量是“调用身份连续而可信映像整体失效”，不是 ELF、PE、守护进程或操作系统；其直接目标是借合法安装位置和调用关系反复执行恶意内容。
    en: Whole-Image Path-Identity Substitution occurs when an adversary removes, overwrites, or exchanges the original executing image of existing
      software and places an attacker-built malicious image at the same canonical path so services, users, or programs continue invoking the original
      name. The variable is continuous invocation identity with complete loss of the trusted image rather than ELF, PE, daemon, or operating system.
      Its direct objective is repeated malicious execution through a legitimate installation location and call relationship.
  - zh: 本子项要求原映像不再作为执行主体，完整 hash、签名或包内容与可信版本显著不同；恶意版本可以复现部分合法功能，但不以保存/调用原始代码副本为分类条件。只有少量字节或段被原位修改归 NJS-0087-001；明确先运行恶意前奏再执行保留原始代码/副本归 NJS-0087-003。
    en: This child requires that the original image no longer executes and that complete hash, signature, or package content differs materially
      from the trusted version. The malicious build may emulate legitimate function but does not preserve or invoke original code as its defining
      condition. A small in-place byte or segment patch belongs to NJS-0087-001. Explicit malicious prelude followed by preserved original code
      or copy belongs to NJS-0087-003.
stealth_characteristics:
  paragraphs:
  - zh: 整映像路径身份替换保留路径、程序名、服务配置、调用者和用户习惯，资源或进程侧仍显示熟悉软件身份。若防守只检查文件是否存在、路径是否允许或服务配置是否改变，恶意映像会继承合法对象信誉。Mandiant 直接观察 `/usr/bin/tac_plus` 被恶意版本替换，而标准
      TACACS+ 路径与调用关系保留。
    en: Whole-Image Path-Identity Substitution preserves path, program name, service configuration, caller, and user habit, so resource or process
      data still displays familiar software identity. If defenders check only file existence, allowed path, or changed service configuration,
      the malicious image inherits legitimate-object reputation. Mandiant directly observed `/usr/bin/tac_plus` replaced by a malicious version
      while the standard TACACS+ path and invocation remained.
  - zh: 完整文件 hash、签名、包数据库校验、inode/时间、写入者、安装源和后继行为仍能揭示替换。合法升级、回滚、紧急热修复和厂商自更新同样整体更换映像，必须用签名包事务、版本、维护窗口和发布者排除；路径连续不是安全证明。
    en: Complete file hash, signature, package-database verification, inode or time, writer, installation source, and downstream behavior still
      reveal substitution. Legitimate upgrade, rollback, emergency hotfix, and vendor self-update also replace whole images, requiring signed
      package transaction, version, maintenance window, and publisher as exclusions. Path continuity is not proof of safety.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者将既有主机软件的可信执行映像整体替换为恶意构建，同时保留同一规范路径或调用身份，并在以后正常调用中执行。判定需要可信基线、整体内容或签名差异、攻击者写入/来源和后继执行；在安装前已被污染的软件供应链属于上游供应链对象，而非本地替换。
    en: Scope includes adversary replacement of a trusted executing image of existing host software with a malicious build while preserving canonical
      path or invocation identity and later executing through normal invocation. Classification needs a trusted baseline, whole-content or signature
      difference, adversary writer or provenance, and successor execution. Software contaminated before installation belongs to an upstream supply-chain
      object rather than local substitution.
  - zh: 局部补丁归 NJS-0087-001；显式执行原始副本/代码归 NJS-0087-003；只替换服务 ImagePath 或启动描述符而目标文件未被破坏归 T1543/NJT-0084；仅在内存中 patch 正在运行进程不属于本磁盘二进制对象。合法包升级是必要反例。
    en: Local patching belongs to NJS-0087-001; explicit execution of original copy or code belongs to NJS-0087-003. Changing only a service ImagePath
      or startup descriptor without compromising its target file belongs to T1543 or NJT-0084. Memory-only patching of a running process is outside
      this on-disk binary object. Legitimate package upgrade is a required counterexample.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得系统软件目录或网络设备文件系统写权限后，可备份或删除原二进制并把恶意构建放到原路径。服务重启、用户调用或设备启动随后加载恶意映像，而配置和运维手册仍引用熟悉名称。该路径适用于希望避免新增服务/路径并利用常规调用频率的攻击者。
      en: After gaining write authority over a system-software directory or network-device filesystem, an adversary can back up or remove the
        original binary and place a malicious build at its path. Service restart, user invocation, or device boot then loads the malicious image
        while configuration and operating documentation still reference a familiar name. The path suits an adversary avoiding a new service or
        path and leveraging normal invocation frequency.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要高价值路径写权限、兼容架构与依赖的恶意构建，并保持足够合法功能避免立即故障。只读分区、包数据库验证、代码签名、Secure Boot/测量启动、原子更新和文件完整性会提高成本；ABI 错误或服务失败会暴露替换。
        en: The adversary needs write authority over a high-value path, a malicious build compatible with architecture and dependencies, and enough
          legitimate function to avoid immediate failure. Read-only partitions, package-database verification, code signing, Secure or measured
          boot, atomic update, and file integrity raise cost. ABI mismatch or service failure can expose substitution.
    defender_model:
      paragraphs:
      - zh: 防守方需要厂商/包级可信 hash、签名与版本、文件写入和安装事务、服务/用户调用以及后继行为。只有路径和进程名的资产清单无法检测；只有 hash 差异但不知道批准升级也无法归因。设备固件或不可变映像需要离线厂商比较。
        en: The defender needs vendor or package trusted hash, signature, and version, file write and installation transaction, service or user
          invocation, and downstream behavior. Asset inventory with only path and process name cannot detect it, while a hash difference without
          approved-upgrade context cannot attribute it. Device firmware or immutable images require offline vendor comparison.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 标准路径和调用身份替代恶意映像内容差异
    en: Standard path and invocation identity substitute for malicious image-content difference
  analysis:
    paragraphs:
    - zh: 攻击者保留软件在系统中的可见身份，却替换决定执行的完整映像。进程名、父调用和配置继续与历史一致，恶意内容借用路径信誉形成 NM-FD；完整 hash、签名和包来源仍是残余。UNC3886 案例直接证明替换、路径与恶意功能，支持 high。
      en: The adversary preserves software's visible system identity while replacing the complete image determining execution. Process name, caller,
        and configuration remain historically consistent, allowing malicious content to borrow path reputation and produce NM-FD; full hash, signature,
        and package provenance remain residual. The UNC3886 case directly establishes replacement, path, and malicious function, supporting high
        confidence.
  evidence_refs:
  - REF-000163
  - REF-000179
  confidence: high
