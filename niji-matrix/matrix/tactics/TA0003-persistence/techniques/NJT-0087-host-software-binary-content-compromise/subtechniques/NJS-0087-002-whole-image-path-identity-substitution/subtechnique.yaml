research:
  limitations:
    paragraphs:
    - zh: 直接案例来自 TACACS+ 和 ATT&CK 汇总的其他软件；跨平台变量由完整映像替换与路径连续定义，但不能假定所有恶意版本完全丢弃原功能。若只能证明函数级 patch 而不能证明整映像替换，应归 NJS-0087-001 或保持父级。
      en: Direct evidence comes from TACACS+ and other software summarized by ATT&CK. The cross-platform variable is complete image replacement
        with path continuity, but it does not assume every malicious version discards all legitimate function. When evidence establishes only
        a function-level patch rather than whole-image replacement, classification belongs to NJS-0087-001 or remains parent-level.
    - zh: Mandiant 提供路径、函数和恶意版本事实，但公开报告不含原/恶意二进制的所有包元数据；high 针对行为变量，不表示任一 hash 差异都能高置信归因。批准升级和供应商回滚必须保留。
      en: Mandiant provides path, function, and malicious-version facts but not every package metadata field for the original and malicious binaries.
        High confidence applies to the behavior variable, not attribution of any hash difference. Approved upgrade and vendor rollback remain
        required alternatives.
