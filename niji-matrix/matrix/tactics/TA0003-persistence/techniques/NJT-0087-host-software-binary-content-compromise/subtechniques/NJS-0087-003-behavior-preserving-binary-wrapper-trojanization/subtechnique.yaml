schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0087-003
parent_ref: NJT-0087
name:
  zh: 行为保持型二进制包裹
  en: Behavior-Preserving Binary Wrapper Trojanization
summary:
  zh: 攻击者让感染二进制先执行恶意前奏，再显式交给保留的原始代码或隐藏副本，使用户可见功能继续正常并掩盖感染。
  en: Adversaries make an infected binary execute a malicious prelude and then explicitly hand off to preserved original code or a hidden copy,
    keeping user-visible function normal and masking infection.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 行为保持型二进制包裹是攻击者把恶意执行阶段附着于既有程序，同时保存原程序代码或完整副本，并在恶意阶段之后解密、复制、加载或跳转到原始功能。分类变量是“恶意前奏—原始功能接力”，不是文件格式或感染方式；其直接目标是在每次正常调用中执行恶意逻辑，同时让用户和上层软件得到预期结果。
    en: Behavior-Preserving Binary Wrapper Trojanization attaches a malicious execution stage to existing software while retaining original program
      code or a complete copy and decrypting, copying, loading, or transferring control to the original function after the malicious stage. The
      variable is malicious-prelude-to-original-function handoff rather than file format or infection method. Its direct objective is malicious
      execution on every normal invocation while returning expected results to users and upstream software.
  - zh: 该子项要求能够证明显式保留和调用原始功能，而非恶意版本仅自行模仿接口。少量字节 patch 但没有可识别原始代码接力归 NJS-0087-001；整映像替换且原映像不再执行归 NJS-0087-002。若既有文件被感染同时明确保存原内容并接力，本子项优先，以运行时双阶段为稳定边界。
    en: This child requires proof of explicit preservation and invocation of original function rather than a malicious build merely emulating
      an interface. A small byte patch without identifiable original-code handoff belongs to NJS-0087-001. Whole-image replacement where the original
      image no longer executes belongs to NJS-0087-002. When an existing file is infected and original content is explicitly saved and invoked,
      this child takes precedence because the two-stage runtime is the stable boundary.
stealth_characteristics:
  paragraphs:
  - zh: 行为保持型二进制包裹让程序在恶意阶段后继续打开正常界面、处理请求或返回预期结果，降低用户报障、功能监控和仅验证进程是否“能运行”的检测信号。Industroyer 的 Notepad 继续按预期工作，ThiefQuest 则执行隐藏的合法副本以维持正常外观；两个来源直接说明行为保持结果。
    en: Behavior-Preserving Binary Wrapper Trojanization lets a program continue opening its normal interface, processing requests, or returning
      expected results after the malicious stage, reducing user reports, functional-monitoring failures, and checks that only verify the process
      can run. Industroyer's Notepad continued working as expected, while ThiefQuest executed a hidden legitimate copy to maintain normal appearance;
      both sources directly state the preserved-behavior result.
  - zh: 文件 hash/签名、入口点、节布局、附加数据、隐藏副本、进程/文件双阶段、恶意网络活动和加载内存仍能揭示感染。合法包装器、更新器、调试/安全插桩和兼容层也会先运行代理再调用原程序，必须用 publisher、包清单、已批准注入和目标关系排除；正常功能不是完整性证明。
    en: File hash or signature, entry point, section layout, appended data, hidden copy, process or file two-stage sequence, malicious network
      activity, and loaded memory still reveal infection. Legitimate wrappers, updaters, debugging or security instrumentation, and compatibility
      layers can also run a proxy before the original program, requiring publisher, package inventory, approved injection, and target relationship
      as exclusions. Normal function is not proof of integrity.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入既有软件二进制被修改或包裹，使恶意逻辑先执行并显式把控制交给同文件保存的原始代码、解密内容或隐藏原始副本，且该序列可在以后正常调用重复。判定需要可信原程序身份、感染后双阶段证据、攻击者控制和后继执行；只启动一个无关诱饵应用而感染体不属于该软件对象，不纳入。
    en: Scope includes existing software binary modification or wrapping that executes malicious logic first and explicitly hands control to original
      code stored in the file, decrypted content, or a hidden original copy, repeatable during later normal invocation. Classification requires
      trusted original-program identity, post-infection two-stage evidence, adversary control, and successor execution. Launching an unrelated
      decoy application when the infected body is not the same software object is excluded.
  - zh: 局部语义 patch 归 NJS-0087-001，原始映像不再执行的整体替换归 NJS-0087-002；仅 DLL side-loading、进程注入或内存 hook 不改变主机软件二进制时归相邻对象。合法打包、兼容 shim 和厂商启动器必须有签名与包关系。
    en: Local semantic patching belongs to NJS-0087-001, and whole replacement with no original image execution belongs to NJS-0087-002. DLL side-loading,
      process injection, or memory hooking that does not change the host software binary belongs to neighboring objects. Legitimate packaging,
      compatibility shims, and vendor launchers require signature and package relationships.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得用户应用或系统工具写权限后，可以在入口前置恶意代码并把原始正文追加到同一文件，或将原程序复制到隐藏路径由感染体调用。用户随后启动熟悉应用时先触发后门、收集或下载逻辑，再看到正常程序，因而较少产生功能异常线索。
      en: After gaining write authority over a user application or system utility, an adversary can prepend malicious code and append original
        content to the same file, or copy the original program to a hidden path invoked by the infected body. When the user launches a familiar
        application, backdoor, collection, or download logic runs first and the normal program appears afterward, reducing functional anomaly
        clues.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要解析目标格式、保持原程序依赖与参数/返回行为、构造可靠接力并隐藏原始副本或附加内容。强代码签名、包完整性、只读路径、内存/入口点检查和子进程/文件访问监控会增加成本；接力崩溃、界面异常或性能变化会暴露感染。
        en: The adversary needs to parse the target format, preserve original dependencies and argument or return behavior, build a reliable handoff,
          and hide original copy or appended content. Strong code signing, package integrity, read-only paths, memory or entry-point inspection,
          and child-process or file-access monitoring raise cost. Handoff crash, interface anomaly, or performance change can expose infection.
    defender_model:
      paragraphs:
      - zh: 防守方除 hash、签名和包基线外，还需入口点/节结构、运行时控制流、感染体访问隐藏副本、第二映像加载/执行、网络与文件结果。只做功能健康检查会被正常接力满足；只删除隐藏副本可能使感染体崩溃但不恢复可信二进制，必须同时重装并验证。
        en: Beyond hash, signature, and package baseline, the defender needs entry-point or section structure, runtime control flow, infected-body
          access to a hidden copy, second-image load or execution, and network or file outcomes. Functional health checks alone are satisfied
          by normal handoff. Deleting only the hidden copy may crash the infected body without restoring trust, so both reinstall and verification
          are required.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 原始功能接力使感染程序继续呈现正常用户行为
    en: Original-function handoff preserves normal user behavior of the infected program
  analysis:
    paragraphs:
    - zh: 攻击者在调用链前端插入恶意阶段，却把最终可见结果交给真实原程序。功能健康、界面与常见调用因此继续匹配合法软件，原始行为特征替代感染异常，形成 NM-FD。ESET 明确说明后门化 Notepad 仍按预期工作，Malwarebytes 说明 ThiefQuest
        运行合法隐藏副本以使其看似正常，支持 high。
      en: The adversary inserts a malicious stage at the front of the invocation chain but delegates final visible result to the real original
        program. Functional health, interface, and common calls continue matching legitimate software, substituting original behavior for infection
        anomaly and producing NM-FD. ESET explicitly states that backdoored Notepad worked as expected, and Malwarebytes states that ThiefQuest
        ran a legitimate hidden copy to appear normal, supporting high confidence.
