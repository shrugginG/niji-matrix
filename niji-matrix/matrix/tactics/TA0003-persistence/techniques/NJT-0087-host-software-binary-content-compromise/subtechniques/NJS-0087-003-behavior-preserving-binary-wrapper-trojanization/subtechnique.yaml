research:
  limitations:
    paragraphs:
    - zh: 两个直接案例跨 Windows 与 macOS，并以不同保存方式证明原始功能接力，但不能覆盖所有二进制感染；仅因应用仍可运行不足以归类，必须解析保留原代码/副本及恶意前奏。运行时细节不可得时退回父级或其他子项。
      en: Two direct cases span Windows and macOS and prove original-function handoff through different preservation methods, but do not cover
        every binary infection. Continued application function alone is insufficient; preserved original code or copy and malicious prelude must
        be resolved. Without runtime detail, classification falls back to parent or another child.
    - zh: 来源直接说明正常外观，支持 high 变量结论；具体企业检测效果仍受签名、行为监控和用户交互影响。合法 wrapper 与 shim 是强反例，缺少包关系时事件归因需降低置信度。
      en: Sources directly state normal appearance, supporting high confidence in the variable. Concrete enterprise detection effect still depends
        on signing, behavior monitoring, and user interaction. Legitimate wrappers and shims are strong alternatives, and event attribution without
        package relationship requires lower confidence.
