schema_version: 2.0.0
type: technique
id: NJT-0087
name: {zh: 主机软件二进制内容破坏, en: Host Software Binary Content Compromise}
summary:
  zh: 攻击者以局部补丁、整映像替换或行为保持型包裹破坏既有主机软件，使恶意逻辑随正常调用持久恢复并借用合法路径、程序身份或原始功能。
  en: Adversaries compromise existing host software through local patching, whole-image replacement, or a behavior-preserving wrapper so malicious logic returns during normal invocation and borrows legitimate path, program identity, or original function.
aliases: [Compromise Host Software Binary]
classification:
  tactic_refs: [TA0003]
  origin: {kind: attack-retained, source_attack_id: T1554, source_attack_version: "19.1"}
  decision_ref: DEC-TA0003-T1554
definition_and_concept:
  paragraphs:
    - zh: 主机软件二进制内容破坏是攻击者改变受害主机上已经部署的可执行文件、库或支持二进制内容，使以后由用户、服务、管理器或系统正常调用时执行攻击者功能的技术。其直接目标是把持久入口嵌入既有软件对象和调用生命周期，不依赖一个独立启动名称；文件写入只是建立状态，后续真实调用才证明持久能力被恢复。
      en: Host Software Binary Content Compromise is a technique in which an adversary changes the content of an executable, library, or supporting binary already deployed on a victim host so attacker functionality runs when a user, service, manager, or system invokes it normally later. Its direct objective is to embed a persistent entry in an existing software object and invocation lifecycle without a separate startup identity. The file write establishes state, while a later real invocation proves persistent capability was restored.
    - zh: 概念锚是同一主机软件对象的内容和运行语义发生攻击者控制变化，而不是文件格式、平台、路径或调用者。局部字节/段补丁、整映像替换以及恶意前奏后把控制交回原程序都可纳入；只改变搜索或加载路径归 T1574，厂商交付前感染归 T1195，只改变 service/autostart 描述符归 NJT-0089/NJT-0084，无法跨调用保留的内存临时补丁不属于本 Persistence 对象。
      en: The conceptual anchor is adversary-controlled change to the content and runtime semantics of the same on-host software object rather than file format, platform, path, or caller. A local byte or section patch, whole-image replacement, and a malicious prelude handing control back to the original program can qualify. Search or load-path change belongs to T1574, infection before vendor delivery to T1195, service or autostart descriptor-only change to NJT-0089 or NJT-0084, and a memory-only temporary patch that cannot survive another invocation is outside this Persistence object.
stealth_characteristics:
  paragraphs:
    - zh: 主机软件二进制内容破坏保留熟悉路径、名称、调用者、服务账户和业务角色，使恶意逻辑在正常程序或库内部执行。低差异补丁进一步保留尺寸和绝大多数代码；整映像替换保留路径身份；行为保持包裹还让原功能继续。只按文件名、父进程、启动时间或“应用仍正常工作”允许的控制难以区分恶意版本。
      en: Host Software Binary Content Compromise preserves a familiar path, name, caller, service account, and business role and executes malicious logic inside a normal program or library. A low-difference patch additionally preserves size and most code, whole-image replacement preserves path identity, and a behavior-preserving wrapper keeps original function. Controls allowing by filename, parent process, start time, or application still works cannot distinguish the malicious version.
    - zh: 内容变化仍留下 package/image hash、签名、段/页/函数差异、writer、权限与时间、更新事务、加载和后继进程/网络结果。可信同版本包或已验证映像可以恢复差异，但合法更新、hotpatch、厂商 wrapper、调试/可观测性 agent 也会改变内容或执行前奏。没有匹配版本、写入来源和异常结果时只能报告完整性偏差；只在运行内存发生且重启即失的变化需要另行处理。
      en: Content change still leaves package or image hash, signature, section, page or function difference, writer, permission and time, update transaction, load, and downstream process or network outcome. A trusted same-version package or validated image can recover the difference, but legitimate updates, hotpatches, vendor wrappers, and debugging or observability agents also change content or add a prelude. Without matching version, write origin, and anomalous outcome, only an integrity difference can be reported. Changes occurring only in runtime memory and disappearing at reboot require separate treatment.
scope_boundary_definition:
  paragraphs:
    - zh: 本技术纳入攻击者对主机现有二进制内容的持久变化以及以后调用，要求可比较的可信版本、攻击者控制或未经批准的 writer、内容/运行语义差和异常结果。文件格式、程序用途、平台、写入工具和恶意功能类型不构成 Niji 子技术；子项只按 delta 规模、路径身份替换和原始功能接力等稳定观察变量划分。
      en: This technique includes durable adversary change to existing on-host binary content plus later invocation and requires a comparable trusted version, adversary-controlled or unapproved writer, content or runtime-semantic difference, and anomalous outcome. File format, program purpose, platform, writer tool, and malicious-function type do not form Niji children. Children divide only by stable observation variables such as delta scale, path-identity substitution, and original-function handoff.
    - zh: 加载路径/依赖重定向、脚本/配置变化、service/autostart 定义、供应链交付和正常更新分别排除或并列记录。只有 hash 差异而无攻击者/结果时保持完整性异常；同一路径完整替换但无法确定旧映像状态时回退父级；显式调用原程序/副本证据不足时不能选择行为保持包裹。三项子项有优先规则，不能为数量选最接近者。
      en: Load-path or dependency redirection, script or configuration change, service or autostart definition, supply-chain delivery, and normal update are excluded or recorded in parallel. A hash difference with no adversary or outcome remains an integrity anomaly. A whole replacement at one path with unknown prior-image state falls back to the parent, and behavior-preserving wrapper cannot be selected without evidence of explicit original-program or copy invocation. The three children have precedence rules and are not nearest choices for count.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者在取得软件路径、更新机制、包数据库或高权限运行进程的修改能力后，选择以后会被用户、系统、服务或管理员例行调用的二进制。其可以对验证函数做极小补丁、以恶意映像替换同路径文件，或用恶意前奏包裹后再调用原程序，使重启、登录、管理或服务恢复时重新获得访问、收集凭据或改变控制结果。
        en: After obtaining modification capability over a software path, update mechanism, package database, or privileged running process, an adversary selects a binary that a user, system, service, or administrator will invoke routinely. It can make a tiny patch to a validation function, replace the file at the same path with a malicious image, or wrap a malicious prelude around an invocation of the original program so reboot, sign-in, administration, or service recovery restores access, collects credentials, or changes a control outcome.
      - zh: 高价值场景包括安全设备和认证/管理工具、网络服务、常用桌面应用及无法部署完整 EDR 的 appliance。UNC3886、恶意 tac_plus、Industroyer Notepad 替换和 ThiefQuest 分别提供不同变量实例。调用本身可能完全正常，因此必须把修改时点、目标版本和运行结果连接，不能从一个受信路径进程直接推断。
        en: High-value contexts include security appliances and authentication or administration tools, network services, common desktop applications, and appliances without complete EDR. UNC3886, a malicious tac_plus replacement, Industroyer Notepad substitution, and ThiefQuest provide instances of different variables. Invocation itself can be fully normal, so mutation time, target version, and runtime outcome must be joined rather than inferred from a process at a trusted path.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要对目标文件、包、更新路径或运行内存的写入能力，掌握二进制格式、签名/加载、ABI、控制流和调用语义，并能够产生与目标版本/架构兼容的改变。低差异补丁需要定位关键函数并控制字节级变化；整映像替换需要保持依赖、权限和启动行为；wrapper 需要在恶意前奏后可靠交回原功能。任何崩溃、签名失败或业务异常都会暴露。
          en: The adversary needs write capability over the target file, package, update path, or runtime memory; knowledge of binary format, signing and loading, ABI, control flow, and invocation semantics; and a change compatible with target version and architecture. Low-difference patching requires locating a critical function and controlling byte-level change, whole-image replacement must preserve dependencies, permissions, and startup behavior, and a wrapper must reliably return to original function after the malicious prelude. A crash, signature failure, or business anomaly exposes the operation.
        - zh: 攻击者还需维持内容跨重启或更新，或部署 watchdog/versionlock 重新建立；签名强制、只读/不可变映像、包验证、受控更新、JIT 写权限和应用控制提高成本。合法软件更新会覆盖补丁，EDR/包管理可能保留 writer 和 transaction，且同版本黄金包使微小 delta 易发现。无法保持程序稳定或选择错误版本时，持久入口可能自毁。
          en: The adversary also needs content to survive reboot or update or a watchdog or version lock to restore it. Signing enforcement, read-only or immutable images, package validation, controlled updates, JIT write authority, and application control raise cost. Legitimate updates can overwrite a patch, EDR or package management can retain writer and transaction evidence, and a same-version golden package makes a small delta easy to find. Failure to preserve program stability or select the correct version can destroy the persistence path.
    defender_model:
      paragraphs:
        - zh: 防守方需要软件包/映像 inventory、版本与平台匹配的可信文件、签名/证书、whole-file 与段/页/函数 hash、包/更新事务、writer 进程/主体、权限/时间和加载事件；运行侧需要调用者、目标映像、模块、子进程、网络、认证或业务结果。用设备、路径/inode、版本/hash、writer 和启动/会话 ID 连接修改与以后调用。
          en: Defenders need package or image inventory, a trusted file matching version and platform, signature or certificate, whole-file and section, page or function hashes, package or update transaction, writer process or principal, permission and time, and load events. Runtime visibility needs caller, target image, modules, child process, network, authentication, or business outcome. Device, path or inode, version or hash, writer, and launch or session ID join mutation to later invocation.
        - zh: appliance 无法导出文件、包数据库不完整、供应者不提供同版本基线、内存修改没有落盘和日志短于首次调用都会形成盲区。合法 hotpatch、A/B 更新、调试 agent 和厂商 wrapper 是强反例；防守方应先确定批准版本和 transaction，再按 delta 规模与控制流判断，不能把任何签名失败或 hash 差直接归因。
          en: Nonexportable appliances, incomplete package databases, no same-version vendor baseline, memory changes without disk state, and logs expiring before first invocation create blind spots. Legitimate hotpatches, A or B updates, debugging agents, and vendor wrappers are strong counterexamples. Defenders should establish approved version and transaction before evaluating delta scale and control flow and cannot attribute every signature failure or hash difference directly.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 恶意逻辑继承合法软件路径、身份与调用情境, en: "Malicious logic inherits legitimate software path, identity, and invocation context"}
    analysis:
      paragraphs:
        - zh: 攻击者把恶意控制嵌入或替换到既有软件对象，正常 caller 继续启动同一路径、名称、账户与业务角色；局部补丁保留多数代码，wrapper 还保留原功能。恶意与合法版本共享粗粒度可见特征，使基于路径、父进程或“程序可用”的分类难以区分，形成特征伪装。UNC3886 与多个直接案例支持这种身份继承。
          en: The adversary embeds or substitutes malicious control into an existing software object, and a normal caller continues launching the same path, name, account, and business role. A local patch preserves most code, and a wrapper also preserves original function. Malicious and legitimate versions share coarse visible features, weakening classification based on path, parent process, or program availability and producing Feature Disguise. UNC3886 and multiple direct cases support this identity inheritance.
        - zh: 可信同版本内容、签名、段/函数差、writer 与运行结果仍可破坏伪装。来源直接证明行为与外观，但攻击者匿迹意图不是每个案例都明确，因此父级保持 medium；整映像与行为保持子项的直接案例可分别提高。
          en: Trusted same-version content, signature, section or function difference, writer, and runtime outcome can break the disguise. Sources directly establish behavior and appearance, but adversary stealth intent is not explicit in every case, so the parent remains medium while direct whole-image and behavior-preserving child cases can raise confidence separately.
    evidence_refs: [REF-000155, REF-000163, REF-000179, REF-000180, REF-000181]
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 正常调用与较早二进制写入分置于不同时间和证据面, en: "Normal invocation and earlier binary writing occupy different times and evidence planes"}
    analysis:
      paragraphs:
        - zh: 文件/包内容在早期被修改，真正恶意结果在以后正常调用才出现；运行时进程树主要显示合法 caller 与受信路径，早期 writer 已离开当前窗口。只观察执行或只扫描当前文件无法回答哪次变更造成哪次结果，关键来源落在单点分析之外形成行为透明。DET0336 明确要求把异常修改、hash/签名变化与以后执行连接。
          en: File or package content is changed earlier, while the malicious outcome appears only on a later normal invocation. The runtime process tree primarily shows a legitimate caller and trusted path, and the early writer is outside the current window. Execution-only observation or current-file-only scanning cannot establish which mutation caused which outcome, leaving critical provenance outside point analysis and producing Behavioral Transparency. DET0336 explicitly calls for anomalous modification and hash or signature change to be joined to later execution.
        - zh: 稳定 path/inode、版本/hash、writer、update transaction 和启动/会话结果可以恢复。跨平台日志字段差异大，in-process 恶意逻辑可能没有子进程，故父级机理为 medium；缺少 writer 时只能从内容和结果间接推断。
          en: Stable path or inode, version or hash, writer, update transaction, and launch or session outcome can recover the chain. Cross-platform log fields differ and in-process malicious logic can create no child process, so parent confidence is medium. Without a writer, only indirect content-to-outcome inference remains.
    evidence_refs: [REF-000163, REF-000164]
    confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 本技术建立三项 Niji 原生子技术。低差异原位二进制补丁以同一路径和绝大多数内容保留、局部字节/段改变为变量；整映像路径身份替换以调用路径连续而可信原映像不再执行为变量；行为保持型二进制包裹以恶意前奏后显式调用保留原始代码或副本为变量。三者分别要求细粒度 delta、完整包/签名差异和运行时双阶段接力。
        en: This technique defines three Niji-native children. Low-Difference In-Place Binary Patching preserves path and most content while changing local bytes or sections. Whole-Image Path-Identity Substitution preserves invocation path while the trusted original image no longer executes. Behavior-Preserving Binary Wrapper Trojanization explicitly invokes preserved original code or a copy after a malicious prelude. They respectively require fine-grained delta, complete package or signature difference, and runtime two-stage handoff.
      - zh: ATT&CK T1554 无子技术，开放检索按内容差异规模与原始功能接力建立互斥优先级。证明显式原始接力优先归第三项；否则小局部补丁归第一项、整体映像替换归第二项。BOLDMOVE watchdog 支持跨升级恢复但缺少独立匿迹机理证据，保持 defer。不能因无法证明 delta 或接力而选择最接近子项。
        en: ATT&CK T1554 has no children. Open search establishes mutually exclusive precedence from content-difference scale and original-function handoff. Proven explicit original handoff takes the third child; otherwise a small local patch takes the first and whole-image replacement the second. A BOLDMOVE watchdog supports recovery across updates but lacks independent stealth-mechanism evidence and remains deferred. An object cannot be assigned to the closest child when delta or handoff is unproven.
  coverage: established
  subtechnique_refs: [NJS-0087-001, NJS-0087-002, NJS-0087-003]
defense: {detections: {coverage: available, strategy_refs: [DET-000068]}, mitigations: {coverage: available, mitigation_refs: [MIT-000067]}}
evidence:
  claim_refs: [CLM-000337, CLM-000338, CLM-000339, CLM-000340, CLM-000360, CLM-000361, CLM-000362, CLM-000363]
  case_refs: [CASE-000058, CASE-000065, CASE-000066]
  reference_refs: [REF-000155, REF-000163, REF-000164, REF-000179, REF-000180, REF-000181]
research:
  limitations:
    paragraphs:
      - zh: 三项变量证据不同。UNC3886 单字节 `/bin/smit` 支持低差异补丁为 medium；恶意 tac_plus 整映像路径替换为 high；Industroyer 与 ThiefQuest 直接说明恶意前奏后原功能继续，行为保持包裹为 high。案例不能互相替代，具体对象仍需批准更新、合法 wrapper、package transaction 与版本基线反例。
        en: Evidence differs across variables. The UNC3886 one-byte change to `/bin/smit` supports low-difference patching at medium confidence, a malicious tac_plus whole-image path replacement supports high, and Industroyer and ThiefQuest directly describe original function continuing after a malicious prelude and support a high-confidence behavior-preserving wrapper. Cases are not interchangeable and each object still needs approved update, legitimate wrapper, package transaction, and version-baseline counterexamples.
      - zh: 直接案例集中于 Fortinet/TACACS+、Windows Notepad 和 macOS 用户应用；跨平台边界来自内容/接力变量，不保证相同签名、包数据库、函数符号或执行遥测。无法确认 delta 规模、可信原映像状态或显式接力时必须回退父级；没有以后调用只能证明内容 compromise 风险，不能证明 Persistence 已恢复。
        en: Direct cases center on Fortinet or TACACS+, Windows Notepad, and macOS user applications. Cross-platform boundaries follow content and handoff variables and do not guarantee identical signing, package database, function symbols, or execution telemetry. Inability to establish delta scale, trusted original-image state, or explicit handoff requires parent fallback. Without later invocation, only content-compromise risk is established rather than restored Persistence.
