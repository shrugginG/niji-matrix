research:
  limitations:
    paragraphs:
    - zh: 权威来源直接提出特定服务范围可能降低发现，但没有公开案例同时给出攻击者授权意图、完整同类基线和长期低活动序列。因此本子技术及其时空释痕机理保持中等置信度，不能把任何低权限或少活动新账户归入本类。更强结论需要同时证明范围由攻击者选择、足以维持入口、活动量确实下降且防守覆盖受到影响。
      en: An authoritative source directly states that service-specific scope may reduce detection, but no public case currently
        provides adversary scoping intent, a complete peer baseline, and a long-term low-activity sequence together. The child
        and its Spatiotemporal Trace Dilution mechanism therefore remain medium confidence, and no low-privilege or infrequently
        used new account qualifies automatically. A stronger conclusion requires evidence that the scope was adversary-selected,
        sufficient to preserve access, actually reduced activity, and affected defensive coverage.
