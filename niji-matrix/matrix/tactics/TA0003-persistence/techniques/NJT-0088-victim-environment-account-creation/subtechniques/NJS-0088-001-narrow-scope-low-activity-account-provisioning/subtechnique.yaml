schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0088-001
parent_ref: NJT-0088
name:
  zh: 窄范围低活动账户配置
  en: Narrow-Scope Low-Activity Account Provisioning
summary:
  zh: 攻击者为新账户只授予维持目标入口所需的单一服务、资源集合或窄角色权限，以减少跨服务活动和显著权限异常。
  en: Adversaries grant a new account only the single service, resource set, or narrow role needed to preserve a target entry,
    reducing cross-service activity and conspicuous privilege anomalies.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 窄范围低活动账户配置是攻击者创建新身份时，主动把授权限制在完成持久访问所需的一个服务、资源集合、设备或窄角色内，而不授予广泛管理或跨服务权限的匿迹子技术。直接目标是在保留可重复认证入口的同时，减少该主体必须产生的资源调用、权限检查和管理活动，使其生命周期更接近低活动服务或专用业务账户。
    en: Narrow-Scope Low-Activity Account Provisioning is an evasion sub-technique in which an adversary deliberately limits
      a new identity to one service, resource set, device, or narrow role needed for persistent access rather than granting
      broad administrative or cross-service privilege. Its direct objective is to preserve a repeatable authenticating entry
      while reducing required resource calls, authorization checks, and administrative activity so the lifecycle resembles
      a low-activity service or dedicated business account.
  - zh: 分类变量是授权范围和由此产生的活动表面积，不是本地、域或云账户类型。账户可以拥有高价值但对象限定的权限，也可以仅支持一种远程服务；只有攻击者有意保持最小可用范围并实际以低活动方式使用时才进入本子项。普通最小权限部署属于合法反例。
    en: The classification variable is authorization scope and resulting activity surface rather than local, domain, or cloud
      account type. The account may hold high-value but object-bounded privilege or support only one remote service. It enters
      this child only when the adversary deliberately keeps the minimum usable scope and actually operates with low activity.
      Ordinary least-privilege deployment is a legitimate counterexample.
stealth_characteristics:
  paragraphs:
  - zh: 窄范围低活动账户配置减少新主体跨应用、跨资源和跨权限层级留下的事件数量。固定 ATT&CK 父页面明确指出，只访问特定服务的云账户可以降低被发现概率；相同因果也适用于只允许一种管理入口或一个资源集合的新身份。依赖广泛枚举、权限跃迁或多服务扇出的检测会失去信号，而该账户仍能在需要时恢复访问。
    en: Narrow-Scope Low-Activity Account Provisioning reduces events a new principal leaves across applications, resources,
      and privilege tiers. The fixed ATT&CK parent page explicitly states that a cloud account limited to specific services
      can reduce the chance of detection; the same causal variable applies to a new identity limited to one management entry
      or resource set. Detection depending on broad enumeration, privilege escalation, or multi-service fan-out loses signal
      while the account remains available to restore access.
  - zh: 账户创建本身、稳定 principal ID、初始授权、owner 缺失、首次来源和稀疏但持续的访问仍然可见。低活动既可能是攻击者策略，也可能来自合法服务账户、测试账户或偶发使用，因此必须比较同角色主体的授权范围、调用频率、来源与审批；单凭事件少不能推断恶意。
    en: Account creation, stable principal ID, initial authorization, missing owner, first origin, and sparse but continuing
      access remain visible. Low activity can reflect adversary strategy or a legitimate service, test, or infrequently used
      account, so defenders must compare authorization scope, call frequency, origin, and approval among peer roles. Few events
      alone cannot establish maliciousness.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入新账户被有意限制为单服务、单设备、单资源集合或窄角色，并在该范围内保存后续认证能力的行为。判定要求证明目标身份为新建、授权范围明显受控、该范围足以完成持续访问，并观察到与宽权限账户不同的低扇出使用模式。
    en: Scope includes a new account deliberately limited to one service, device, resource set, or narrow role while retaining
      later authentication within that boundary. Classification requires proof that the identity is new, its authorization
      scope is intentionally bounded, the scope is sufficient for continuing access, and use shows lower fan-out than a broadly
      privileged account.
  - zh: 本地、域、云、SaaS 和容器只是实现环境；仅因账户权限低或尚未使用不纳入。创建后再新增并行权限属于 T1098，完全休眠但无后续使用只保持父级状态异常。合法专用服务账户必须具有可验证 owner、用途、部署来源与到期或复核记录。
    en: Local, domain, cloud, SaaS, and container are implementation environments. An account is not included merely because
      privilege is low or it has not yet been used. Parallel privilege added after creation belongs to T1098, while a wholly
      dormant account without later use remains only a parent-level state anomaly. A legitimate dedicated service account
      needs a verifiable owner, purpose, deployment source, and expiry or review record.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者已经能够创建身份，但希望避免新管理员或多服务账户触发高风险规则时，可建立只访问目标 VPN、单个 SaaS、特定 VM、邮箱或管理 API 的账户，长时间维持少量周期性活动。该子项适合攻击者明确知道后续入口和最小授权需求的环境；需要临时扩大权限时会产生额外
        T1098 痕迹。
      en: When an adversary can create identities but wants to avoid high-risk rules for a new administrator or multi-service
        account, the operator can establish an account limited to a target VPN, one SaaS service, a specific VM, mailbox,
        or management API and maintain sparse periodic activity. The child fits environments where the adversary knows the
        later entry and minimum authorization required. Temporary privilege expansion produces additional T1098 traces.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要创建账户并精确授予范围的权限、对目标资源和认证入口的知识，以及容忍较低操作灵活性。资源移动、权限复核、服务退役或强制 owner/到期会使入口失效；一旦跨服务扩张，低活动特性也会迅速消失。
        en: The adversary needs account-creation and precise scoping authority, knowledge of the target resource and authentication
          entry, and tolerance for reduced operational flexibility. Resource movement, access review, service retirement,
          or enforced owner and expiry can invalidate the entry. Cross-service expansion quickly removes the low-activity
          characteristic.
    defender_model:
      paragraphs:
      - zh: 防守方需要账户创建与初始授权、资源级访问、peer-role 基线、owner/审批和长期使用频率，而不能只依赖高权限或扇出阈值。分析窗口必须覆盖稀疏使用；不记录对象级资源或服务账户缺少所有者时，低活动与合法专用身份难以区分。
        en: The defender needs account creation and initial authorization, object-level resource access, peer-role baselines,
          owner or approval, and long-term use frequency rather than only high-privilege or fan-out thresholds. The window
          must cover sparse use. When object-level resources are unlogged or service accounts lack owners, low activity is
          difficult to distinguish from a legitimate dedicated identity.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将账户活动限制在窄资源范围和较少事件中
    en: Limit account activity to a narrow resource scope and fewer events
  analysis:
    paragraphs:
    - zh: 攻击者通过最小化新账户的授权范围，使认证和资源操作只出现在一个服务或对象集合，减少跨系统可关联事件和局部异常强度。完整持久访问没有消失，而是收缩到较少传感器和更长观察期才能辨认的稀疏轨迹，形成时空释痕。ATT&CK 直接说明特定服务范围可降低发现概率，但跨平台效果仍需推断，因此置信度为
        medium。
      en: By minimizing the new account's authorization scope, the adversary confines authentication and resource operations
        to one service or object set, reducing cross-system correlatable events and local anomaly strength. Persistent access
        does not disappear but contracts into a sparse trace requiring fewer sensors and a longer observation period, producing
        Spatiotemporal Trace Dilution. ATT&CK directly states that service-specific scope can reduce detection, while cross-platform
        effect remains inferred, so confidence is medium.
  evidence_refs:
  - REF-000165
  confidence: medium
