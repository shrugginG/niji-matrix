research:
  limitations:
    paragraphs:
    - zh: 当前直接案例来自 Azure VMAccess，足以证明云到来宾账户投放，但不能自动外推所有编排和设备管理产品。Microsoft 公开材料没有给出每个内部关联字段，因此 operation ID 到本地 SID 的精确连接属于实现要求而非已证实普遍能力。其他平台进入本子项前必须证明相同控制边界、落地账户和后续使用。
      en: The direct case concerns Azure VMAccess and establishes cloud-to-guest account provisioning without automatically generalizing to every
        orchestration and device-management product. Microsoft's public material does not expose every internal correlation field, so exact operation-ID-to-local-SID
        linkage is an implementation requirement rather than a universally demonstrated capability. Other platforms require proof of the same
        control boundary, materialized account, and later use before entering this child.
