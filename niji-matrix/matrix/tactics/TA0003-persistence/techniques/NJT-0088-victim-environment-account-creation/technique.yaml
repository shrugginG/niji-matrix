research:
  limitations:
    paragraphs:
    - zh: 窄范围低活动账户的结论目前主要依赖权威资料对特定服务账户降低发现概率的说明，公开案例尚未给出从创建、授权到长期低活动使用的完整现场序列。因此该行为与时空释痕机理保持中等置信度，不能从本地、域或云等管理平台直接推导。
      en: The conclusion for narrow-scope low-activity accounts currently relies mainly on authoritative descriptions that
        service-specific accounts may reduce detection, while public cases do not provide a complete sequence from creation
        and authorization through long-term low-activity use. The behavior and its Spatiotemporal Trace Dilution mechanism
        therefore remain medium confidence and cannot be inferred directly from local, domain, or cloud administration platforms.
    - zh: 跨控制面账户投放由 Storm-2949 的 VMAccess 案例直接支持，但公开材料未给出 operation ID 到来宾 SID 的所有内部字段，也不能代表所有编排产品。合法恢复、自动化配置、专用服务账户和临时访问会产生相似状态；缺少审批差异或异常使用时，只能确认新账户状态而不能归因。账户名称合形和延迟首次使用目前证据不足，不能作为独立结论。
      en: Cross-control-plane provisioning is directly supported by the Storm-2949 VMAccess case, but public material does
        not expose every internal operation-ID-to-guest-SID field and cannot represent all orchestration products. Legitimate
        recovery, automated configuration, dedicated service accounts, and temporary access create similar state. Without
        approval mismatch or anomalous use, only new-account state rather than attribution can be established. Account-name
        conformity and delayed first use currently lack enough evidence for independent conclusions.
