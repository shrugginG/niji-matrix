schema_version: 2.0.0
type: technique
id: NJT-0088
name:
  zh: 受害环境账户创建
  en: Victim-Environment Account Creation
summary:
  zh: 攻击者在受害环境创建新身份，并通过窄授权降低活动表面积或跨管理控制面投放账户，使次级入口更难与创建来源关联。
  en: Adversaries create a new identity in the victim environment and reduce secondary-entry attribution by narrowing its
    activity surface or provisioning it across a management control plane.
aliases:
- Create Account
classification:
  tactic_refs:
  - TA0003
  origin:
    kind: attack-retained
    source_attack_id: T1136
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1136
definition_and_concept:
  paragraphs:
  - zh: 受害环境账户创建是攻击者在已经进入的主机、域、云租户、SaaS、容器平台或网络设备中建立此前不存在、能够独立认证或获得授权的新身份主体，使其在原入侵会话、远程工具或被盗凭据失效后继续访问的技术。直接目标是增加一个由目标环境认可的次级身份入口。
    en: Victim-Environment Account Creation establishes a previously absent identity principal inside a compromised host,
      domain, cloud tenant, SaaS, container platform, or network device that can authenticate or receive authorization independently,
      preserving access after the original intrusion session, remote tool, or stolen credential is lost. The direct objective
      is a secondary identity entry recognized by the target environment.
  - zh: 概念锚是“新身份对象及其创建到首次使用生命周期”，不是创建命令、平台或账户类型。创建后授予权限和使用属于同一因果链；只修改既有主体归 T1098，受害环境外预先建立资源归 T1585。
    en: The conceptual anchor is a new identity object and its creation-to-first-use lifecycle rather than creation command,
      platform, or account type. Initial privilege and use belong to the same causal chain. Mutation of an existing principal
      belongs to T1098 and pre-established resources outside the victim environment to T1585.
stealth_characteristics:
  paragraphs:
  - zh: 创建事件由管理员、API、系统工具或被控会话产生，后续登录与资源操作却以新主体自身为来源；若身份控制面与认证/资源面不共享 creator、principal ID、role 和时间，防守方只看到一个成功的有效身份。服务范围受限的新账户还可能产生较少活动，但活动少不自动证明攻击者匿迹意图。
    en: Creation originates from an administrator, API, system tool, or compromised session, while later sign-in and resource
      action show the new principal itself. If identity control and authentication or resource planes do not share creator,
      principal ID, role, and time, defenders see only a successful valid identity. A service-scoped account can generate
      little activity, but low activity does not itself establish adversary evasion intent.
  - zh: 新身份不会无痕存在。创建时间、creator、SID/UID/object ID、初始凭据、owner、角色、来源、首次使用和创建资源可连接完整生命周期。合法入职、服务部署、应急和测试账户是强反例，短日志保留与无创建审计设备会限制判断。
    en: A new identity cannot exist without trace. Creation time, creator, SID, UID or object ID, initial credential, owner,
      role, origin, first use, and created resources connect the lifecycle. Legitimate onboarding, service deployment, emergency,
      and test accounts are strong counter-explanations, while short retention and devices without creation audit limit judgment.
  - zh: 两项已证实变量改变不同痕迹。窄范围配置减少跨服务和跨资源事件，使新账户停留在较少传感器与较低扇出中；跨控制面投放则把云或集中管理操作与来宾账户、登录和资源活动分开。前者仍留下初始授权和稀疏使用，后者仍留下管理 request、目标工作负载和来宾
      principal，扩大观察面可恢复两者。
    en: The two supported variables change different traces. Narrow scoping reduces cross-service and cross-resource events,
      keeping the new account within fewer sensors and lower fan-out. Cross-control-plane provisioning separates a cloud or
      centralized management operation from guest account, sign-in, and resource activity. The former leaves initial authorization
      and sparse use, while the latter leaves a management request, target workload, and guest principal; broader observation
      can recover both.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入受害环境中此前不存在的用户、服务、设备或等价身份创建、初始授权及以后访问，要求稳定 principal ID 或可证明新建状态。平台、位置、命名和创建工具不构成子技术。
    en: Include creation, initial authorization, and later access of a previously absent user, service, device, or equivalent
      identity in the victim environment, requiring a stable principal ID or demonstrable new state. Platform, location, naming,
      and creation tool do not form children.
  - zh: 既有身份凭据/角色变化归 T1098，外部账户建立归 T1585，只使用已有有效账户归 T1078。没有后续使用的未知账户是状态异常，不自动证明持久化；合法生命周期必须用 owner、审批和期限解释。
    en: Existing-identity credential or role change belongs to T1098, external account establishment to T1585, and use of
      an existing valid account to T1078. An unknown account without later use is a state anomaly rather than proven persistence.
      Legitimate lifecycle requires owner, approval, and expiry explanation.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得账户创建权限后建立本地、域、云或应用身份，赋予足以远程登录或访问目标服务的权限，并在原入口被处置后使用。新身份可服务于管理、自动化或数据访问，但用途不形成子项。
      en: After gaining account-creation authority, an adversary establishes a local, domain, cloud, or application identity,
        grants enough privilege for remote sign-in or target-service access, and uses it after the original entry is remediated.
        The identity may support administration, automation, or data access, but purpose does not form children.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 需要创建接口与初始 credential/role 权限，并能控制新秘密；审批、强认证、命名策略、最小权限、到期和 first-use 检查限制效果。
        en: Requires account-creation interface and initial credential or role authority plus control of the new secret. Approval,
          strong authentication, naming policy, least privilege, expiry, and first-use checks constrain effectiveness.
      - zh: 采用窄范围变量时，攻击者必须预先知道最小可用资源与入口并接受较低灵活性；采用跨控制面变量时，还需拥有上游管理权限、可用来宾代理或配置功能和以后访问下游系统的路径。
        en: For narrow scoping, the adversary must know the minimum usable resource and entry in advance and accept reduced
          flexibility. For cross-control-plane provisioning, the adversary additionally needs upstream management authority,
          a usable guest agent or configuration function, and a later path into the downstream system.
    defender_model:
      paragraphs:
      - zh: 需要创建/权限审计、稳定 ID、审批、登录/token、设备来源与资源行为，保留至少到禁用或首次三十日。只记录名称或共享账户会削弱关联。
        en: Requires creation and privilege audit, stable ID, approval, sign-in or token, device origin, and resource behavior
          retained until disablement or at least the first thirty days. Name-only logs and shared accounts weaken correlation.
      - zh: 防守方必须同时保留授权范围和活动体量基线，并在云/管理与来宾/端点之间传播 workload、operation、principal 和时间关联键。只监控高权限账户会漏掉窄范围身份，只监控来宾账户会漏掉上游创建者。
        en: Defenders must retain authorization-scope and activity-volume baselines and propagate workload, operation, principal,
          and time keys between cloud or management and guest or endpoint planes. Monitoring only privileged accounts misses
          narrow identities, while monitoring only guest accounts loses the upstream creator.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 创建者与以后新身份活动分布在身份控制和使用平面
    en: Creator and later new-identity activity are split across identity-control and use planes
  analysis:
    paragraphs:
    - zh: 攻击者通过管理面创建主体，随后以该主体认证；登录事件不再显示原创建会话，若不连接 creator、principal、role 与 first use，关键来源落在观察之外，形成行为透明。DET0583 支持这种关联，匿迹效果为
        medium 强推断。
      en: The adversary creates a principal through an administrative plane and later authenticates as that principal. Sign-in
        no longer shows the original creation session. Without joining creator, principal, role, and first use, critical provenance
        falls outside observation, producing Behavioral Transparency. DET0583 supports the correlation and the evasion effect
        is a medium-confidence strong inference.
  evidence_refs:
  - REF-000165
  - REF-000166
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 窄授权把账户活动收缩到较少资源和事件
    en: Narrow authorization contracts account activity into fewer resources and events
  analysis:
    paragraphs:
    - zh: 攻击者只给新身份保留目标入口所需的单服务或窄资源权限，使身份不必产生跨应用枚举、广泛权限使用和多资源扇出。活动被压缩到更少传感器与更长时间内的稀疏序列，降低局部信号强度并形成时空释痕。ATT&CK 直接说明特定服务范围可降低发现概率；正常专用账户是强反例，因此保持
        medium。
      en: The adversary gives the new identity only the single-service or narrow-resource permission needed for the target
        entry, avoiding cross-application enumeration, broad privilege use, and multi-resource fan-out. Activity contracts
        into a sparse sequence across fewer sensors and a longer horizon, reducing local signal strength and producing Spatiotemporal
        Trace Dilution. ATT&CK directly states that service-specific scope can reduce detection; legitimate dedicated accounts
        are a strong counterexample, so confidence remains medium.
  evidence_refs:
  - REF-000165
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立两项 Niji 原生子技术。窄范围低活动账户配置固定攻击者在创建时限制授权范围和后续事件表面积；跨控制面账户投放固定创建操作发生在上游管理面、账户对象与使用出现在下游系统的观察边界。前者改变“能访问多少以及留下多少活动”，后者改变“创建证据位于哪里”，可以组合但不能互相替代。
      en: This technique establishes two Niji-native children. Narrow-Scope Low-Activity Account Provisioning fixes adversary
        restriction of authorization scope and later event surface at creation. Cross-Control-Plane Account Provisioning fixes
        the observation boundary in which creation occurs in an upstream management plane while the account object and use
        appear downstream. The former changes how much can be accessed and how much activity remains; the latter changes where
        creation evidence resides. They can combine but do not substitute for one another.
    - zh: 固定基线的本地账户、域账户和云账户三项 ATT&CK 子技术只作为广度先验并按管理范围聚类，没有被导入。合法命名和延迟首次使用因缺少同级行为—痕迹—防守影响证据继续 defer；平台、账户类型、创建工具和权限高低本身均不形成兄弟项。
      en: The fixed-baseline ATT&CK children for local, domain, and cloud accounts were used only as a breadth prior and clustered
        by administrative scope; none was imported. Naming conformity and delayed first use remain deferred for lack of peer-level
        behavior-trace-defender evidence. Platform, account type, creation tool, and privilege level alone do not form siblings.
  coverage: established
  subtechnique_refs:
  - NJS-0088-001
  - NJS-0088-002
