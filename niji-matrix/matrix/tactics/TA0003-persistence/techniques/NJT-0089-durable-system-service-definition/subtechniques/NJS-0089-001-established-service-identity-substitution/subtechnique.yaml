schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0089-001
parent_ref: NJT-0089
name:
  zh: 既有服务身份替换
  en: Established-Service Identity Substitution
summary:
  zh: 攻击者保留既有服务名称、管理器、账户和生命周期，只替换执行路径、指令或解析目标，使恶意运行继续呈现正常服务身份。
  en: Adversaries preserve an established service name, manager, account, and lifecycle while substituting its execution path,
    directive, or resolved target so malicious execution retains a normal service identity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有服务身份替换是攻击者修改已经被服务管理器和运维基线认可的 service/unit/plist/daemon 定义，使 ImagePath、Program、Exec 指令、drop-in、符号链接或等价解析目标指向攻击者内容，而服务名称、manager、账户与生命周期位置继续存在的匿迹子技术。其直接目标是在不创建一个显眼新服务身份的情况下改变以后由管理器执行的真实语义。
    en: Established-Service Identity Substitution is an evasion sub-technique in which an adversary changes a service, unit,
      plist, or daemon definition already recognized by the service manager and operations baseline so ImagePath, Program,
      an Exec directive, drop-in, symbolic link, or equivalent resolved target points to adversary content while service name,
      manager, account, and lifecycle position remain. Its direct objective is to change the semantics later executed by the
      manager without creating a conspicuous new service identity.
  - zh: 区分变量是同一服务 object ID/身份与解析后目标之间的差异，不是 Windows、systemd、launchd 或容器平台。修改目标文件内容归 NJT-0087，改变模块搜索归 T1574，一次启动现有服务归 T1569，创建全新服务保留在
      NJT-0089 父级。必须证明服务在变更前已存在，并且目标语义而非仅显示名发生改变。
    en: The distinguishing variable is a difference between one service object ID or identity and its resolved target rather
      than Windows, systemd, launchd, or container platform. Changing target-file content belongs to NJT-0087, changing module
      search to T1574, starting an existing service once to T1569, and creating a wholly new service remains NJT-0089 parent
      behavior. The service must be shown to predate the mutation and target semantics, not merely display name, must change.
stealth_characteristics:
  paragraphs:
  - zh: 既有服务身份替换让启动继续由 SCM、systemd、launchd 或等价 manager 发起，日志保留原 service name、账户、启动类型、恢复策略和受信父进程；基于名称、manager、父进程或固定启动时点的允许规则可能继续接受。攻击者只让
      definition/resolved target 与历史版本不同，恶意进程借用成熟服务的信誉和业务位置。
    en: Established-Service Identity Substitution keeps startup under SCM, systemd, launchd, or an equivalent manager and
      retains original service name, account, start type, recovery policy, and trusted parent process. Allow rules based on
      name, manager, parent, or expected start time can continue accepting it. Only the definition or resolved target differs
      from history, allowing a malicious process to borrow the reputation and business position of an established service.
  - zh: 定义版本、writer、old/new ImagePath/Exec、符号链接解析、目标 hash/signature、包/工单、manager transaction、后继 ProcessGuid 与网络结果仍能恢复替换。软件升级、路径迁移、故障修复、蓝绿切换和合法
      drop-in 会产生同形变化；没有前一可信定义、批准来源和异常结果时只能报告 service integrity difference。
    en: Definition version, writer, old and new ImagePath or Exec, symbolic-link resolution, target hash or signature, package
      or change record, manager transaction, downstream ProcessGuid, and network outcome can recover the substitution. Software
      upgrade, path migration, failure repair, blue-green change, and legitimate drop-ins create the same shape. Without a
      prior trusted definition, approved origin, and anomalous outcome, only a service-integrity difference can be reported.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入对既有服务定义或其直接解析目标的攻击者控制修改，要求稳定服务 identity、变更前状态、old/new 目标、未经批准 writer 和以后 manager 执行结果。保留名称但创建一个全新 object 不属于本子项；只重命名载荷、只改变目标二进制内容或只加载劫持分别归
      masquerading、NJT-0087 或 T1574。
    en: This child includes adversary-controlled change to an established service definition or its directly resolved target
      and requires stable service identity, pre-change state, old and new target, an unapproved writer, and later manager
      execution outcome. A wholly new object with a familiar name is outside this child. Payload renaming alone, target-binary
      content change alone, and load hijacking belong respectively to masquerading, NJT-0087, or T1574.
  - zh: 合法 installer/update、管理员路径迁移、灾备恢复和故障修复必须有 package、owner、工单、预期 target 和有效窗口；服务显示名相似、父进程受信或启动正常均不能单独证明身份替换。路径变化没有后继执行时只证明定义差，不能证明
      Persistence 已恢复。
    en: Legitimate installers or updates, administrator path migration, disaster recovery, and failure repair require package,
      owner, change record, intended target, and validity window. A similar display name, trusted parent, or normal start
      alone cannot establish identity substitution. A path change without later execution proves a definition difference but
      not restored Persistence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得 service manager 或定义文件/Registry 权限后，选择长期存在且很少人工检查的更新、代理、驱动或业务后台服务，修改 ImagePath/Exec/drop-in/链接，使下一次启动、重载、失败恢复或节点调和执行载荷。现有服务
        ID 和运行账户保持，使会话结束和重启后仍能恢复。
      en: After obtaining service-manager or definition-file or Registry authority, an adversary selects a long-lived updater,
        agent, driver, or business background service with little manual review and changes ImagePath, Exec, a drop-in, or
        link so the payload runs on next start, reload, failure recovery, or node reconciliation. Existing service ID and
        runtime account remain, allowing recovery after session end and reboot.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要修改既有定义、Registry、unit/plist 或解析目标的权限，知道 manager 加载/缓存、账户、依赖、恢复和重启语义，并控制兼容载荷。必须保持服务健康或模拟预期结果；错误路径、权限、依赖或参数会导致启动失败、业务中断和显著告警。
        en: The adversary needs authority to change an established definition, Registry, unit or plist, or resolved target;
          knowledge of manager load or cache, account, dependency, recovery, and restart semantics; and a compatible payload.
          It must preserve service health or emulate expected outcomes. A wrong path, permission, dependency, or argument
          causes start failure, business disruption, and conspicuous alerts.
      - zh: 受控更新、签名/包验证、声明式配置、JIT service-write 权限、definition diff 和 target integrity 提高成本。若 manager 每次从只读/签名源重建定义或目标变化必须双人批准，攻击者难以长期维持；升级还可能覆盖替换并使入口失效。
        en: Controlled updates, signature or package validation, declarative configuration, JIT service-write authority, definition
          differential, and target integrity raise cost. If the manager rebuilds definitions from a read-only or signed source
          or target changes require two-person approval, persistence is difficult to maintain. An upgrade can also overwrite
          the substitution and end the entry.
    defender_model:
      paragraphs:
      - zh: 防守方需要 service object ID、名称、manager、账户、start/recovery、definition old/new、writer、包/工单、解析后绝对路径、hash/signature、manager
          transaction 与后继进程/网络。应跨重启保存版本并比较，而不能只查询当前 running service 或显示名。
        en: Defenders need service object ID, name, manager, account, start or recovery settings, definition old and new state,
          writer, package or change record, resolved absolute path, hash or signature, manager transaction, and downstream
          process or network. Versions should be retained and compared across reboot rather than querying only current running
          services or display names.
      - zh: 只看进程会丢失早期 writer，只看 service list 会接受借用身份，只看定义又不能证明实际执行。旧平台可能没有 stable ID 或 manager transaction，容器/节点调和会频繁重写定义；需要用
          package owner、声明式 source 和结果校准，缺失精确键时降低置信度。
        en: Process-only monitoring loses the early writer, service-list-only monitoring accepts borrowed identity, and definition-only
          monitoring cannot prove execution. Legacy platforms may lack stable IDs or manager transactions, while container
          or node reconciliation frequently rewrites definitions. Package owner, declarative source, and outcome calibrate
          the result, and missing exact keys lowers confidence.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 既有服务身份与受信 manager 包裹被替换目标
    en: Established service identity and trusted manager wrap a substituted target
  analysis:
    paragraphs:
    - zh: 攻击者保留 service ID、名称、账户、启动条件和 manager，只改变 ImagePath/Exec/解析目标。运行日志继续携带正常服务和受信父进程特征，依赖这些特征的分类无法区分真正目标，恶意实体借用既有身份形成特征伪装。ATT&CK
        与服务执行案例/审计资料直接支持定义—进程连接。
      en: The adversary preserves service ID, name, account, start conditions, and manager and changes only ImagePath, Exec,
        or the resolved target. Runtime logs retain normal service and trusted-parent features, preventing classifications
        relying on them from distinguishing the real target and producing Feature Disguise through established identity. ATT&CK
        plus service-execution case and audit material directly supports the definition-to-process join.
    - zh: old/new definition、resolved target、target hash/signature、writer 与结果仍可恢复。行为直接证据较强，但攻击者保留身份是否专为匿迹并非每个实例都明确，故跨平台机理校准为
        medium，而不是原 blanket high。
      en: Old and new definition, resolved target, target hash or signature, writer, and outcome can recover the difference.
        Behavioral evidence is strong, but not every instance explicitly establishes that the adversary preserved identity
        for stealth, so the cross-platform mechanism is calibrated to medium rather than the prior blanket high.
