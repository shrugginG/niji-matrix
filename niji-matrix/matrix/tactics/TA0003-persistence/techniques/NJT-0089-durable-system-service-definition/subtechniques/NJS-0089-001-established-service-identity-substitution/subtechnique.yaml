research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接记录修改既有 service/ImagePath，Microsoft 与 Red Canary 来源提供 service install/执行和检测字段，但公开材料不为每个 systemd/launchd/container
        实例给出相同 object ID 与目标 diff。跨平台边界来自服务身份—解析目标变量，字段必须按 manager 映射。
      en: ATT&CK directly records modification of established services and ImagePath, while Microsoft and Red Canary sources
        provide service-installation, execution, and detection fields. Public material does not provide identical object IDs
        and target differences for every systemd, launchd, or container instance. The cross-platform boundary follows the
        service-identity-to-resolved-target variable and fields require manager-specific mapping.
    - zh: 合法升级、路径迁移、A/B 部署和故障修复与本子项同形；没有 prior definition、writer、批准与执行结果时只报告完整性差。若实际恶意变化在目标二进制内部而 definition 未变，应回到 NJT-0087，不能为符合服务名称而保留本分类。
      en: Legitimate upgrades, path migration, A or B deployment, and failure repair have the same shape. Without a prior
        definition, writer, approval, and execution outcome, report only an integrity difference. If the malicious change
        is inside the target binary while the definition remains unchanged, return to NJT-0087 rather than retaining this
        classification because of a service name.
