research:
  limitations:
    paragraphs:
    - zh: 直接公开证据集中于 Windows service SDDL，尚无独立案例完整公开 ACL old/new、普通/高权限枚举和后继执行链，因此机理为 medium 且 case_refs 保持空。其他平台不能仅因 namespace/RBAC
        不同就继承该结论，必须证明攻击者主动修改。
      en: Direct public evidence centers on Windows service SDDL, and no independent case currently exposes complete ACL old
        and new state, ordinary and privileged enumeration, and downstream execution lineage. Mechanism confidence is therefore
        medium and case references remain empty. Another platform cannot inherit the conclusion merely because namespace or
        RBAC differs and needs adversary-controlled change.
    - zh: 合法最小权限、托管服务隔离、多租户边界与 EDR token 配置会产生相似视图差；在线查询时间差还可能遇到 service 创建/删除竞争。缺少同一 object、等价任务、ACL writer 和执行结果时只能报告可见性异常，不能确认子项。
      en: Legitimate least privilege, managed-service isolation, multitenant boundaries, and EDR token configuration create
        similar view differences, while live query timing can race service creation or removal. Without the same object, equivalent
        task, ACL writer, and execution outcome, only a visibility anomaly can be reported rather than a confirmed child.
