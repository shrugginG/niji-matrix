research:
  limitations:
    paragraphs:
    - zh: ATT&CK 父页与 Windows 服务材料直接证明既有目标修改、名称伪装和通过 SDDL 限制标准枚举；跨平台实现只在具有相同身份保留或视图差分时纳入。服务名称相似、受信父进程或枚举缺失均不能单独证明攻击意图，必须连接
        writer、定义差异、权限和执行结果。
      en: The ATT&CK parent and Windows-service material directly establish existing-target modification, name disguise, and
        SDDL-based restriction of standard enumeration. Cross-platform implementations qualify only when they show the same
        identity preservation or view differential. A similar service name, trusted parent, or missing enumeration cannot
        alone establish adversary intent; writer, definition difference, permissions, and execution outcome must be joined.
    - zh: 容器 DaemonSet、restart policy 与节点选择说明持久服务可跨节点传播，但公开来源没有证明攻击者为降低局部检测而选择扇出，也没有给出稳定区别于合法编排的阈值，因此未正式化为子项。服务内部不产生子进程、内存载荷或日志保留短会降低防守关联能力。
      en: Container DaemonSets, restart policies, and node selection show that durable services can propagate across nodes,
        but public sources do not establish adversary selection of fanout to reduce local detection or a stable threshold
        separating it from legitimate orchestration, so no child is formalized. Services without child processes, memory-resident
        payloads, and short log retention reduce defensive correlation.
