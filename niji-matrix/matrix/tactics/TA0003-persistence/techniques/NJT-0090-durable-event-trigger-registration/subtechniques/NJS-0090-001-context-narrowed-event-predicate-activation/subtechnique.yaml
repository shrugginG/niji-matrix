research:
  limitations:
    paragraphs:
    - zh: Microsoft 官方材料直接证明永久 consumer、WQL filter 与只有匹配事件才触发的结构，Mandiant 红队工程直接展示 uptime 条件和监控字段；它们支持稳定变量，但不提供独立真实攻击者的完整谓词—长期匹配率—匿迹意图链。因此子项存在性为
        high，匿迹机理保持 medium，案例字段为空而不是把 Solorigate 未公开的谓词越级引用。
      en: Microsoft documentation directly establishes permanent consumers, WQL filters, and trigger-only-on-match structure,
        while Mandiant red-team engineering demonstrates an uptime condition and monitoring fields. They support the stable
        variable but do not provide an independent real-adversary chain containing complete predicate, long-term match rate,
        and stealth intent. Child existence is high confidence and the stealth mechanism remains medium, while case references
        stay empty rather than overextending Solorigate's undisclosed predicate.
    - zh: 事件匹配率受业务周期、设备离线、数据缺失和环境变化影响；加密或脚本谓词可能无法静态解析。没有候选事件全集时不能把“仅触发一次”量化为窄条件，没有 action 结果时只能确认休眠注册。合法监控和应急自动化同样使用极低频条件，必须保留
        owner、批准与预期事件集合。
      en: Event match rate depends on business cycles, offline devices, missing data, and environmental change, while encrypted
        or scripted predicates may resist static parsing. Without the candidate-event population, one trigger cannot be quantified
        as a narrow condition, and without action outcome only a dormant registration is established. Legitimate monitoring
        and emergency automation also use extremely sparse conditions and require owner, approval, and expected event set.
