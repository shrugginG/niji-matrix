schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0090-002
parent_ref: NJT-0090
name:
  zh: 受信事件 Broker 来源遮蔽
  en: Trusted Event-Broker Provenance Masking
summary:
  zh: 攻击者让持久注册在以后由 WMI 或其他受信 Broker 执行动作，使进程侧只显示正常宿主并把原始注册者留在早期控制面。
  en: Adversaries have a durable registration execute later through WMI or another trusted broker so the process side shows
    only a normal host and leaves the original registrant in an earlier control plane.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信事件 Broker 来源遮蔽是攻击者把可执行 action 注册到 WMI provider、规则引擎、应用、解释器/设备管理器或等价回调宿主，使以后匹配事件由该 Broker 的正常进程和权限上下文执行，而原始写入者不出现在当时进程谱系中的匿迹子技术。其直接目标是把“谁建立持久关系”与“谁看似发起动作”分置于不同时间和审计面。
    en: Trusted Event-Broker Provenance Masking is an evasion sub-technique in which an adversary registers an executable
      action with a WMI provider, rule engine, application, interpreter or device manager, or equivalent callback host so
      a later matching event executes through the broker's normal process and privilege context while the original writer
      is absent from the contemporary process lineage. Its direct objective is to place who established the durable relationship
      and who appears to initiate the action in different times and audit planes.
  - zh: 区分变量是持久注册者与执行主体分离，而不是 Broker 名称或受信父进程本身。Microsoft 说明 WMI provider 可以加载在 Wmiprvse.exe，并且 permanent filter 通过 binding
      找到 consumer；Solorigate 说明恶意 filter/consumer 能在重启后恢复执行。其他 Broker 只有能够保存等价 object ID、writer、condition、action 和 callback
      关系时才纳入，不能把任意 shell/Office 子进程机械归类。
    en: The distinguishing variable is separation between the durable registrant and executing principal rather than broker
      name or trusted parent process by itself. Microsoft explains that a WMI provider can load in Wmiprvse.exe and that a
      permanent filter reaches its consumer through a binding, while Solorigate shows a malicious filter and consumer restoring
      execution after reboot. Other brokers qualify only when they retain an equivalent object ID, writer, condition, action,
      and callback relationship. Any shell or Office child process cannot be classified mechanically.
stealth_characteristics:
  paragraphs:
  - zh: 受信事件 Broker 来源遮蔽让后继进程树以 WmiPrvSE、应用、解释器、规则服务或设备管理器为父级，并可能继承常见服务账户、完整性级别、签名和启动路径。只基于父进程、账户或宿主信誉的规则会把恶意 action 解释为正常回调；数日前创建注册的管理会话不在进程侧窗口中，来源链被时间和主体边界共同切断。
    en: Trusted Event-Broker Provenance Masking gives the downstream process tree WmiPrvSE, an application, interpreter, rule
      service, or device manager as parent and can inherit a common service account, integrity level, signature, and launch
      path. Rules based only on parent process, account, or host reputation interpret the malicious action as a normal callback.
      The administrative session that created registration days earlier is absent from the process-side window, breaking provenance
      across time and principal boundaries.
  - zh: 注册对象和 Broker 事务仍能恢复真实来源。WMI filter/consumer/binding 事件、CreatorSID、namespace、Query、CommandLineTemplate、object ID、WMI
      Activity 的 Correlation/Operation/ClientProcessId、provider host 以及后继 ProcessGuid 可以连接；没有 callback ID 时也可用事件、目标和窄时间窗降级。合法
      SCCM、监控、备份和应用插件同样由受信 Broker 执行，必须以 owner、批准包和允许 action 排除。
    en: Registration objects and broker transactions can still recover true provenance. WMI filter, consumer, and binding
      events, CreatorSID, namespace, Query, CommandLineTemplate, object ID, WMI Activity Correlation, Operation, and ClientProcessId,
      provider host, and downstream ProcessGuid can be joined. Without callback ID, event, target, and a narrow time window
      provide a lower-confidence fallback. Legitimate SCCM, monitoring, backup, and application plug-ins also execute through
      trusted brokers and require owner, approved package, and allowed action as counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入一个跨原会话存在的 callback，其注册者与以后执行 Broker 明确不同，action 借用 Broker 进程、服务身份或权限上下文，并能从注册对象连接到后继结果。必须同时识别 writer/CreatorSID、binding、Broker/provider
      和 action；仅看 WmiPrvSE 或受信应用产生子进程不能成立。平台、Broker 产品与 action 类型不形成子项。
    en: This child includes a callback surviving the original session whose registrant differs from the later executing broker
      and whose action borrows the broker process, service identity, or privilege context, with registration linked to downstream
      outcome. Writer or CreatorSID, binding, broker or provider, and action must all be identified. A child process from
      WmiPrvSE or a trusted application alone is insufficient. Platform, broker product, and action type do not form children.
  - zh: 攻击者进程直接轮询并执行没有 Broker 来源分离；WMI 一次性 ExecMethod 属于 T1047/NJT-0082 执行语义，只有永久 event subscription 进入本对象；库、COM、IFEO 或 shim
      解析劫持归 T1574；正常 Broker 子进程和安装器回调需要未批准持久注册证据。上下文是否窄由 NJS-0090-001 独立判断，宽谓词也可产生本来源遮蔽。
    en: Direct polling and execution by an adversary process has no broker provenance separation. A one-time WMI ExecMethod
      belongs to T1047 or NJT-0082 execution semantics, while only a permanent event subscription enters this object. Library,
      COM, IFEO, or shim resolution hijacking belongs to T1574. Normal broker children and installer callbacks require evidence
      of an unapproved durable registration. Predicate narrowness is evaluated independently under NJS-0090-001, and a broad
      predicate can still produce this provenance masking.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者创建 WMI filter、consumer 与 binding 或等价应用规则后退出；系统重启或数日后事件匹配时，WmiPrvSE/provider host、应用、解释器或规则服务启动命令、脚本或模块。Solorigate
        场景中，恶意 WMI binding 使 Defender 能把持久注册与计划命令联系起来，但普通进程树在执行时仍主要显示 WMI Broker。
      en: An adversary creates a WMI filter, consumer, and binding or an equivalent application rule and exits. After reboot
        or days later when an event matches, WmiPrvSE or a provider host, application, interpreter, or rule service starts
        a command, script, or module. In Solorigate, a malicious WMI binding allowed Defender to relate durable registration
        to a scheduled command, while the ordinary process tree at execution time still primarily showed the WMI broker.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要持久注册或规则写权限、对 Broker 对象模型和重启行为的理解，并能让 action 在宿主接口、服务身份、完整性级别和工作目录中正确运行。需要选择不会因异常参数、明显子进程或高频错误而暴露的 action，并在原会话结束后验证
          binding 仍有效。错误 consumer、权限不匹配或 Broker 崩溃会暴露或中断路径。
        en: The adversary needs durable registration or rule-write authority, knowledge of the broker object model and restart
          behavior, and an action that runs correctly under host interfaces, service identity, integrity level, and working
          directory. The action should avoid conspicuous arguments, child processes, or repeated errors and the binding must
          remain valid after the original session ends. A bad consumer, privilege mismatch, or broker crash exposes or interrupts
          the path.
      - zh: namespace ACL、JIT 注册权、consumer/action allowlist、签名规则、CreatorSID 与 object-ID 审计、Sysmon 19/20/21 和 WMI Activity
          tracing 会提高成本。攻击者若只能调用一次 Broker 方法而不能保存回调，本子技术不成立；若防守方传播 callback ID 并取消 Broker 永久信誉豁免，来源遮蔽效果显著下降。
        en: Namespace ACLs, JIT registration rights, consumer or action allowlists, signing rules, CreatorSID and object-ID
          audit, Sysmon 19, 20, and 21, and WMI Activity tracing raise cost. If the adversary can invoke only one broker method
          and cannot preserve a callback, this child does not hold. Provenance masking falls materially when defenders propagate
          callback ID and remove permanent reputation exemptions for brokers.
    defender_model:
      paragraphs:
      - zh: 防守方需要持久注册的 object/filter/consumer/binding ID、namespace、writer/CreatorSID、Query、action、创建/修改和 owner；Broker 侧需要
          provider host PID/ProcessGuid、service identity、callback/operation/correlation ID、ClientMachine/User/ClientProcessId
          与结果。执行侧需要子进程、模块、脚本、命令、资源或网络结果，以相同 object/callback 或校准的时间/目标连接。
        en: Defenders need object, filter, consumer, and binding IDs, namespace, writer or CreatorSID, Query, action, creation
          or modification, and owner for durable registration. The broker side needs provider-host PID or ProcessGuid, service
          identity, callback, operation or correlation ID, ClientMachine, User, ClientProcessId, and outcome. The execution
          side needs child process, module, script, command, resource, or network outcome joined through the same object or
          callback or a calibrated time and target fallback.
      - zh: 如果平台只记录父进程而没有 WMI/规则操作日志，来源只能按时间弱推断；in-process consumer 还可能不产生子进程。注册日志必须保留到首次触发和对象删除，否则早期 writer 丢失。合法管理和监控会频繁使用
          WMI/provider host，防守方必须基于批准 namespace、consumer 类、包、owner 与 action 建立基线，而不是封禁 WmiPrvSE。
        en: If a platform records only parent process and lacks WMI or rule-operation logs, provenance can only be weakly
          inferred by time. An in-process consumer may also create no child process. Registration logs must remain through
          first trigger and object removal or the early writer is lost. Legitimate management and monitoring use WMI and provider
          hosts heavily, so defenders need baselines of approved namespace, consumer class, package, owner, and action rather
          than blocking WmiPrvSE.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 执行侧只观察受信 Broker 而不见持久注册者
    en: The execution side observes a trusted broker but not the durable registrant
  analysis:
    paragraphs:
    - zh: 早期 writer 建立 filter、consumer 和 binding，之后由 WMI 或其他 Broker 在事件到达时执行 action。注册控制与执行结果位于不同日志、进程和时间，单点进程检测只看到 WmiPrvSE
        或正常应用作为父级，无法回答谁创建了持久关系。关键来源未进入执行侧规则的观察范围，形成行为透明。
      en: An early writer establishes a filter, consumer, and binding, after which WMI or another broker executes the action
        when an event arrives. Registration control and execution outcome occupy different logs, processes, and times. Point
        process detection sees only WmiPrvSE or a normal application as parent and cannot answer who created the durable relationship.
        Critical provenance remains outside execution-side rule observation, producing Behavioral Transparency.
    - zh: Microsoft provider-host 与 operation tracing 文档、永久 consumer 结构、Sysmon WMI 对象事件和 Solorigate 案例共同支持完整链。CreatorSID、object/binding、operation/correlation、provider
        host 和 ProcessGuid 可以恢复；没有精确 ID 时降低置信度。WMI 实例为 high，其他 Broker 的跨平台统一只有同等来源分离才成立，因此本子项整体机理校准为 medium。
      en: Microsoft provider-host and operation-tracing documentation, permanent-consumer structure, Sysmon WMI-object events,
        and the Solorigate case jointly support the complete chain. CreatorSID, object or binding, operation or correlation,
        provider host, and ProcessGuid can recover it, while missing exact IDs lowers confidence. A WMI instance has high
        support, but cross-platform unification across other brokers holds only with equivalent provenance separation, so
        the child mechanism overall is calibrated to medium.
