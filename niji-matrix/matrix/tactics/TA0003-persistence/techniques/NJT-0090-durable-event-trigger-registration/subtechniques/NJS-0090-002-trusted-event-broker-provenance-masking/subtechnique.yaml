research:
  limitations:
    paragraphs:
    - zh: Solorigate 直接证明恶意 WMI filter-consumer-binding 可在重启后恢复执行，Microsoft 直接说明 permanent consumer/binding 与 Wmiprvse provider
        hosting；这些材料支持 WMI 来源分离。相邻 T1047 的 TA551/AvosLocker 一次性 WMI 案例没有持久注册，未被越级复用。其他应用与规则 Broker 必须独立证明相同的注册者—执行主体分离。
      en: Solorigate directly establishes a malicious WMI filter-consumer-binding restoring execution after reboot, while
        Microsoft directly documents permanent consumers and bindings plus Wmiprvse provider hosting. These support WMI provenance
        separation. Adjacent T1047 one-time WMI cases involving TA551 and AvosLocker lack durable registration and are not
        overextended here. Other application and rule brokers require independent proof of the same registrant-to-executing-principal
        separation.
    - zh: WMI Activity、Sysmon 与 EDR 不一定共享 callback/object ID，provider 可以 in-process 执行且不产生子进程；日志保留短于首次触发时 writer 会丢失。合法 SCCM、备份、监控和安全工具也由
        WmiPrvSE 运行，正常父进程不能单独支持恶意结论。只有注册差异、来源连接和异常 action 结果同时存在时保持高置信。
      en: WMI Activity, Sysmon, and EDR do not always share a callback or object ID, a provider can execute in process without
        a child process, and writer evidence is lost when retention is shorter than first trigger. Legitimate SCCM, backup,
        monitoring, and security tools also run through WmiPrvSE, so a normal parent process alone cannot support a malicious
        conclusion. High confidence requires registration difference, provenance linkage, and anomalous action outcome together.
