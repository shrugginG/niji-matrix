research:
  limitations:
    paragraphs:
    - zh: Microsoft 与 Mandiant 直接支持 WMI filter、consumer、binding、WQL 谓词和跨重启持久性；Solorigate 直接支持恶意 WMI binding 与恢复执行，但没有公开完整谓词和长期匹配率。因此
        Broker 来源分离在 WMI 上证据较强，谓词收窄的匿迹意图为 medium。其他 ATT&CK 实现只有出现同等状态键和观察效果时才能外推，不能从平台名称机械归类。
      en: Microsoft and Mandiant directly support WMI filters, consumers, bindings, WQL predicates, and persistence across
        restart, while Solorigate directly supports a malicious WMI binding and restored execution but does not publish complete
        predicates and long-term match rates. Broker provenance separation has stronger WMI evidence, whereas stealth intent
        for predicate narrowing remains medium. Other ATT&CK implementations generalize only when they expose equivalent state
        keys and observation effects and cannot be classified mechanically by platform name.
    - zh: 注册对象可能只存在于快照而缺少创建日志，in-process action 可能没有子进程，平台也可能不传播 callback ID；条件表达式可能包含敏感业务数据或不可解析代码。没有事件流无法计算匹配率，没有注册历史无法恢复
        writer，没有后继结果只能确认持久风险状态。合法监控与自动化会使用窄谓词和受信 Broker，必须以 owner、包、批准和预期匹配集合排除。
      en: A registration object can appear only in a snapshot with no creation log, an in-process action can create no child
        process, and a platform may not propagate callback ID. A condition can contain sensitive business data or opaque code.
        Without an event stream, match rate cannot be calculated; without registration history, writer cannot be recovered;
        without downstream outcome, only durable risk state is established. Legitimate monitoring and automation use narrow
        predicates and trusted brokers and require owner, package, approval, and expected match set as counterexamples.
