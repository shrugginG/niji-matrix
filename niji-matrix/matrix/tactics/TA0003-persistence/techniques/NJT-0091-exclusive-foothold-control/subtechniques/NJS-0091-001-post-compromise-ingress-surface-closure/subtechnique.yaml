schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0091-001
parent_ref: NJT-0091
name: {zh: 入侵后入口面关闭, en: Post-Compromise Ingress-Surface Closure}
summary:
  zh: 攻击者在建立独立替代入口后修补漏洞、停用暴露服务或撤销竞争访问，使原入侵面看似已修复并减少重复利用信号。
  en: "After establishing an independent alternative entry, adversaries patch a vulnerability, disable an exposed service, or revoke competing access so the original ingress surface appears remediated and repeated-exploitation signals decline."
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 入侵后入口面关闭是攻击者先利用漏洞、服务或账户路径进入目标并建立不依赖该路径的后门账户、密钥、web shell、服务或隧道，然后主动修补漏洞、关闭服务或撤销其他主体使用原路径能力的匿迹子技术。其直接目标是阻止后来操作者复用同一入口，同时保留自身控制。
      en: "Post-Compromise Ingress-Surface Closure is an evasion sub-technique in which an adversary first enters through a vulnerability, service, or account path and establishes a backdoor account, key, web shell, service, or tunnel independent of that path, then patches the vulnerability, closes the service, or revokes other principals' ability to use the original path. Its direct objective is to prevent later operators from reusing the same entry while preserving its own control."
    - zh: 区分变量是暴露面从可利用变为不可利用，而攻击者替代入口继续存在的有向顺序，不是 patch 或 service stop 命令。UNC5174 在创建 F5 后门账户和部署工具后运行厂商 mitigation.sh，直接证明该顺序。若补丁同时清除全部攻击访问，或者无法证明变更前已被利用和变更后仍可访问，则不属于本子项。
      en: "The distinguishing variable is a directed sequence in which exposure changes from exploitable to unavailable while the adversary's alternative entry survives, not a patch or service-stop command. UNC5174 running the vendor mitigation.sh after creating F5 backdoor accounts and deploying tools directly establishes the sequence. If the patch removes all adversary access or exploitation before and continuing access after cannot be shown, the child does not hold."
stealth_characteristics:
  paragraphs:
    - zh: 入侵后入口面关闭让后续扫描和资产姿态显示补丁已应用、管理端口关闭或弱账户已降权，围绕原入口的 exploit、探测和告警随之停止。防守方若从当前姿态推断历史，可能把“现在不可利用”误认为“从未被利用”或“已完全处置”，而攻击者通过另一账户、服务或隧道以更低频率继续。
      en: "Post-Compromise Ingress-Surface Closure makes later scans and asset posture show a patch applied, management port closed, or weak account deprivileged, ending exploitation, probing, and alerts around the original entry. A defender inferring history from current posture can mistake currently unexploitable for never exploited or fully remediated while the adversary continues at lower frequency through another account, service, or tunnel."
    - zh: 原利用与变更并未消失。漏洞利用/REST 审计、后门账户或工具创建、mitigation/service/account writer、命令/API、old/new 姿态、批准和后续替代入口认证可以恢复。合法应急修补与自动更新产生相同当前状态，只有利用先于变更、writer 属于攻击者控制、变更没有移除替代入口且以后仍有访问时，选择性才成立。
      en: "Original exploitation and change do not disappear. Exploit or REST audit, backdoor-account or tool creation, mitigation or service or account writer, command or API, old and new posture, approval, and later authentication through the alternative entry can recover the sequence. Legitimate emergency patching and automatic update produce the same current state. Selectivity holds only when exploitation precedes change, the writer is adversary-controlled, the change leaves the alternative entry, and later access continues."
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入“原面被利用—独立入口建立—原面关闭—自身访问继续”的可证明链，入口面可以是漏洞、服务或可供其他主体使用的账户权限。必须保存至少一个前置利用/访问证据、替代入口对象、姿态变更 actor 和后继访问结果。平台、漏洞编号、服务名和修补工具不形成分类。
      en: "This child includes a demonstrable original-surface-exploited, independent-entry-established, original-surface-closed, own-access-continues chain. The surface can be a vulnerability, service, or account authority available to another principal. At least one preceding exploitation or access record, alternative-entry object, posture-change actor, and later-access outcome are required. Platform, vulnerability identifier, service name, and patch tool do not form categories."
    - zh: 组织抢修、自动更新、管理员停服和凭据轮换若没有攻击者 writer 或存续入口则排除；关闭安全产品、日志或管理员通道归 Defense Impairment；只修改漏洞但不保留访问不属于 Persistence。攻击者删除自己使用的一次性 exploit 文件是清理行为，只有真正阻止其他主体使用入口面才进入本子项。
      en: "Organizational emergency patching, automatic updates, administrator service shutdown, and credential rotation are excluded without an adversary writer or surviving entry. Closing a security product, logging, or administrator channel belongs to Defense Impairment. Changing a vulnerability without preserving access is outside Persistence. Deleting a one-time exploit file is cleanup behavior and enters this child only when another principal is actually prevented from using the ingress surface."
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: UNC5174 利用 F5 BIG-IP CVE-2023-46747 后创建后门账户并部署 SNOWLIGHT/隧道工具，随后运行厂商 mitigation.sh，限制无关攻击者再次利用原漏洞。类似操作者也可在建立 web shell 或密钥后关闭暴露管理服务，使互联网扫描显示风险消失而替代入口继续。
        en: "After exploiting F5 BIG-IP CVE-2023-46747, UNC5174 created backdoor accounts and deployed SNOWLIGHT or tunneling tools, then ran the vendor mitigation.sh to limit exploitation of the original vulnerability by unrelated actors. A similar operator can close an exposed management service after establishing a web shell or key so internet scans report the risk gone while an alternative entry continues."
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要原入口利用成功、建立独立替代入口的权限与验证能力，以及对厂商补丁、服务配置或账户权限的控制。必须理解补丁是否会重启设备、覆盖植入、撤销会话或改变网络路径，并在关闭后从独立渠道确认访问。错误顺序或错误对象会自我驱逐或造成停机并暴露。
          en: "The adversary needs successful original exploitation, authority and validation capability to establish an independent alternative entry, and control over vendor patching, service configuration, or account privilege. It must understand whether the patch restarts the device, overwrites an implant, revokes sessions, or changes network paths and confirm access through an independent channel afterward. A wrong order or target causes self-eviction or outage and exposure."
        - zh: 签名更新、双人变更批准、不可变利用日志、外部姿态历史和 out-of-band 后门账户盘点提高成本。若设备只能整体重建、补丁会验证完整系统映像，或防守方在修补同时轮换全部账户/密钥和检查 web shell，攻击者难以保留不对称状态。
          en: "Signed updates, two-person change approval, immutable exploit logs, external posture history, and out-of-band backdoor-account inventory raise cost. If the device must be rebuilt as a whole, the patch validates a complete system image, or defenders patch while rotating every account or key and checking web shells, the adversary cannot easily preserve asymmetry."
    defender_model:
      paragraphs:
        - zh: 防守方需要漏洞扫描历史、WAF/设备/REST 利用日志、账户/密钥/web shell/服务创建、补丁或停服命令、执行用户与来源、old/new 姿态、工单和后续认证/网络结果，并按资产与时间排序。仅有当前补丁版本或当前端口状态无法回答何时、由谁、在何种入侵状态下关闭。
          en: "Defenders need vulnerability-scan history, WAF, device, or REST exploitation logs, account, key, web shell, or service creation, patch or service-stop commands, executing user and origin, old and new posture, change record, and later authentication or network outcome ordered by asset and time. Current patch version or port state cannot answer when, by whom, and under which compromise state closure occurred."
        - zh: 合法应急修复可能跳过正常工单，攻击者也可能使用真实管理员；因此缺少工单和管理员身份不能单独判定。防守方应验证补丁前是否存在未经授权入口、补丁后是否仍有不在恢复计划中的账户/服务/会话，并用独立管理面确认执行者。日志保留短于漏洞披露到修补间隔会留下盲区。
          en: "Legitimate emergency remediation can bypass ordinary change records, and adversaries can use real administrators, so a missing ticket and administrator identity alone are insufficient. Defenders should determine whether an unauthorized entry existed before patching and whether accounts, services, or sessions outside the recovery plan remain after it, verifying the actor through an independent management plane. Retention shorter than the disclosure-to-patch interval creates a blind spot."
stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary: {zh: 关闭原入口减少重复利用与暴露面告警, en: Closing the original entry reduces repeated exploitation and exposure alerts}
    analysis:
      paragraphs:
        - zh: 攻击者先建立替代入口，再使原漏洞、服务或账户路径不可复用，竞争扫描、exploit 和姿态告警随后停止。自身访问转移到另一通道并稀疏继续，短期围绕原入口的信号密度下降，形成时空释痕。UNC5174 的账户创建—工具部署—mitigation.sh 顺序及 Mandiant 对限制无关攻击者的评估直接支持该因果。
          en: "The adversary establishes an alternative entry and then makes the original vulnerability, service, or account path unavailable for reuse, ending competing scans, exploits, and posture alerts. Its own access moves to another channel and continues sparsely, reducing short-term signal density around the original entry and producing Spatiotemporal Trace Dilution. UNC5174's account-creation-to-tool-deployment-to-mitigation.sh sequence and Mandiant's assessment of limiting unrelated actors directly support the causality."
        - zh: 当前无漏洞状态仍可由合法防守产生，必须连接攻击者 writer 与存续入口。案例直接证明行为与限制竞争者目的，机理可为 high；但跨其他平台的噪声降低程度取决于扫描、攻击者密度和日志保留，具体事件若只有补丁没有后继访问则降级。
          en: "A currently nonvulnerable state can still result from legitimate defense and must be joined to an adversary writer and surviving entry. The case directly establishes behavior and competitor-limiting purpose, supporting high mechanism confidence, but noise reduction across other platforms depends on scanning, actor density, and retention. A specific event with a patch but no later access is downgraded."
    evidence_refs: [REF-000184, REF-000314]
    confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000071]}, mitigations: {coverage: available, mitigation_refs: [MIT-000071]}}
evidence: {claim_refs: [CLM-000371], case_refs: [CASE-000116], reference_refs: [REF-000184, REF-000314]}
research:
  limitations:
    paragraphs:
      - zh: UNC5174 是直接且高质量案例，但对象为 F5 BIG-IP，替代入口包括后门账户和工具；其他设备可能由 web shell、证书、密钥或内存植入承担，字段不可机械复制。Mandiant 的“限制无关攻击者”是分析判断，不能证明操作者每个补丁动作都同样以匿迹为目标。
        en: "UNC5174 is a direct high-quality case, but its object is F5 BIG-IP and alternative entry includes backdoor accounts and tooling. Other devices may use web shells, certificates, keys, or memory implants, and fields cannot be copied mechanically. Mandiant's assessment of limiting unrelated actors does not prove that every patch action by an operator has the same stealth purpose."
      - zh: 没有补丁前利用证据、替代入口创建或补丁后继续使用时，只能确认异常修补。合法紧急修复也可能由被攻陷管理员账户发起，反向归因需要独立终端、网络和工单证据；系统重建可能删除历史。缺失任何方向性关键点时应降级而不是填补推断。
        en: "Without pre-patch exploitation, alternative-entry creation, or post-patch continuing use, only anomalous remediation is established. Legitimate emergency remediation can also originate from a compromised administrator account, requiring independent endpoint, network, and change evidence for attribution, while reimage can erase history. Missing directional evidence requires downgrade rather than filling the gap by inference."
