research:
  limitations:
    paragraphs:
      - zh: PG_MEM 是直接 honeypot 观察并包含后门用户、清除命令、新 cron 与 miner，证据完整；NetSky.P 直接说明自身传播和 Bagle Run keys 删除，但年代较早、缺少终止 actor 与现代遥测。二者支持同一集合差变量，却不能互相复制对象字段、平台或置信度。
        en: "PG_MEM is a direct honeypot observation containing a backdoor user, cleanup commands, new cron, and miner and provides a complete chain. NetSky.P directly documents self-propagation and Bagle Run-key removal but is older and lacks termination actor and modern telemetry. Both support the same set-difference variable but cannot copy object fields, platform, or confidence from one another."
      - zh: 恶意软件清除本身不能区分攻击者与防守者；没有清除 actor、before inventory 和自身入口存续时只能报告对象消失。多个操作者使用相同 miner 或 bot、攻击者清理自己旧版本、容器自动重建和 EDR 自动隔离都会混淆方向，必须降级而不是用名称推断竞争关系。
        en: "Malware removal alone cannot distinguish adversary from defender. Without cleanup actor, before inventory, and surviving own entry, only object disappearance can be reported. Shared miners or bots, adversary cleanup of its own old version, automatic container replacement, and EDR isolation all obscure direction and require downgrade rather than inferring competition from a name."
