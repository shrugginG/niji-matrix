schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0091-002
parent_ref: NJT-0091
name: {zh: 竞争立足点清除, en: Competing-Foothold Eviction}
summary:
  zh: 攻击者终止或删除其他恶意进程、任务、服务、账户或持久对象，同时保留自己的入口与驻留，降低多主体冲突和并发信号。
  en: "Adversaries terminate or remove other malicious processes, tasks, services, accounts, or persistence objects while preserving their own entry and residence, reducing multi-actor conflict and concurrent signals."
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 竞争立足点清除是攻击者识别同一主机或环境中不属于自己的恶意进程、cron/task、service、account、key 或植入并将其终止、删除、降权或失效，同时有选择地保留自己的等价入口和后继行为的匿迹子技术。其直接目标是防止其他操作者争用资源、改变系统或清除自身驻留，并使环境只剩较少攻击主体。
      en: "Competing-Foothold Eviction is an evasion sub-technique in which an adversary identifies malicious processes, cron or tasks, services, accounts, keys, or implants on the same host or environment that do not belong to it and terminates, deletes, deprivileges, or invalidates them while selectively preserving equivalent entries and downstream behavior under its own control. Its direct objective is to prevent other operators from contending for resources, changing the system, or removing its persistence and to leave fewer adversary principals in the environment."
    - zh: 区分变量是竞争对象消失与自身对象存续的集合差，不是 kill、rm、Registry delete 或 cron 清空命令。PG_MEM 创建后门用户和新 cron/miner 的同时删除旧 cron 并 kill Kinsing 等竞争进程；NetSky.P 保留自身复制传播同时删除 Bagle Run keys。只清理自己旧版本、只释放 CPU 或只停止防守进程不满足兄弟边界。
      en: "The distinguishing variable is the set difference between disappearing competing objects and surviving own objects rather than a kill, rm, Registry delete, or cron-clear command. PG_MEM created a backdoor user and new cron or miner while deleting old cron and killing competitors such as Kinsing, while NetSky.P retained its own copying and propagation while deleting Bagle Run keys. Cleaning only an old self-version, freeing only CPU, or stopping only a defensive process does not satisfy the sibling boundary."
stealth_characteristics:
  paragraphs:
    - zh: 竞争立足点清除减少并发恶意进程、重复外联、资源峰值、任务/服务冲突和相互覆盖的持久化告警，使剩余攻击者更接近单一低频活动。当前快照可能只显示一个 miner、cron 或账户，防守方若没有清除前历史会把较少对象误认为入侵范围较小，失去“谁清除了谁”的方向和多个操作者曾共存的证据。
      en: "Competing-Foothold Eviction reduces concurrent malicious processes, duplicate egress, resource peaks, task or service conflicts, and overlapping persistence alerts, leaving the surviving operator closer to one low-frequency activity pattern. A current snapshot can show only one miner, cron, or account. Without pre-cleanup history, defenders can mistake fewer objects for smaller compromise scope and lose the direction of who removed whom and evidence that multiple operators coexisted."
    - zh: 终止与删除仍产生可观察痕迹：执行进程/会话、命令或 API、目标 PID/object、old/new account/cron/service/Registry 集合、退出码和文件/日志删除；存续侧留下 watchdog、后门用户、新 cron、miner、传播或后续 C2。合法 EDR 与事件响应也会清除恶意对象，因此必须证明清除 actor 位于攻击者链、选择性保留自身对象且后继行为继续。
      en: "Termination and deletion still produce observable evidence: executing process or session, command or API, target PID or object, old and new account, cron, service, or Registry sets, exit status, and file or log removal. The surviving side leaves a watchdog, backdoor user, new cron, miner, propagation, or later C2. Legitimate EDR and incident response also remove malicious objects, so the cleanup actor must belong to an adversary chain, selectively preserve its own objects, and continue downstream activity."
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入攻击者控制且以竞争访问/驻留为目标的选择性终止、删除或降权，并要求自身入口或等价驻留在清除后继续存在或使用。判定至少需要清除前对象清单、删除/终止 actor 和结果、清除后存续集合及后继行为。对象可跨进程、任务、服务、账户、Registry 或文件，但对象类型不形成分类。
      en: "This child includes adversary-controlled selective termination, deletion, or deprivileging targeting competing access or persistence and requires the operator's own entry or equivalent persistence to remain or be used after cleanup. Classification needs at least a pre-cleanup object inventory, deletion or termination actor and outcome, post-cleanup surviving set, and downstream behavior. Objects can span processes, tasks, services, accounts, Registry, or files, but object type does not form categories."
    - zh: 按政策移除全部未授权对象的事件响应和反恶意软件清理排除；只 kill 安全代理归 Defense Impairment；只杀竞争 miner 以提高收益但没有自身持久入口证据时归资源劫持结果。攻击者升级时删除自己旧进程可属于部署生命周期，除非同时识别并排除其他主体。多个操作者共享同一恶意软件时，名称相同不能证明竞争关系。
      en: "Incident response and antimalware cleanup removing all unauthorized objects by policy are excluded. Killing only a security agent belongs to Defense Impairment. Killing a competing miner only to increase profit without evidence of the operator's own persistent entry is a Resource Hijacking outcome. Deleting an old self-process during upgrade can be deployment lifecycle unless another principal is also identified and excluded. When multiple operators share the same malware, a common name does not prove competition."
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: PG_MEM 操作者在 PostgreSQL 中创建 superuser 后门角色、剥夺原 postgres 用户权限、删除当前用户 cron，并终止 kdevtmpfsi、kinsing、postgres-kernel 等进程，随后部署自己的 PG_MEM、XMRIG 与 cron。NetSky.P 在复制传播时删除 Bagle 变体 Run keys。两类场景都需要清除和存续集合同时观察。
        en: "PG_MEM operators created a PostgreSQL superuser backdoor role, stripped the original postgres user, removed current-user cron, and terminated kdevtmpfsi, Kinsing, postgres-kernel, and other processes before deploying their own PG_MEM, XMRIG, and cron. NetSky.P deleted Bagle-variant Run keys while copying and propagating itself. Both contexts require removed and surviving sets to be observed together."
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要枚举进程、任务、服务、账户、文件或 Registry 的能力和终止/删除/降权权限，能够以名称、hash、命令行、端口、矿池、账户或已知 IOC 区分自己和竞争对象。竞争者随机命名、隐藏、高权限、watchdog 或反清除会提高失败成本；错误匹配会杀死自身组件或关键业务进程并暴露。
          en: "The adversary needs discovery across processes, tasks, services, accounts, files, or Registry plus termination, deletion, or deprivileging authority and must distinguish own and competing objects through name, hash, command line, port, mining pool, account, or known IOC. Competitor randomization, hiding, higher privilege, watchdogs, or counter-cleanup raises failure cost, while a bad match kills the operator's own component or a critical business process and exposes the action."
        - zh: 选择性清除还要求攻击者保持自己的后门账户、cron/service/watchdog 或 C2，并在清除后验证它仍运行。EDR 自保护、不可变进程/任务快照、终止与删除审计、最小权限和隔离恢复提高成本。多个主体使用相同工具或容器短生命周期会使攻击者也难以正确归属对象。
          en: "Selective cleanup also requires preserving the operator's backdoor account, cron, service, watchdog, or C2 and verifying it still runs afterward. EDR self-protection, immutable process or task snapshots, termination and deletion audit, least privilege, and isolated recovery raise cost. Multiple principals using the same tool or short-lived containers also make object ownership difficult for the adversary."
    defender_model:
      paragraphs:
        - zh: 防守方需要清除前后的进程、任务、服务、账户、文件与 Registry 快照，终止/删除进程或会话、命令/API、目标 object/PID、结果和时间，以及清除后仍存 watchdog、cron、账户、C2 和资源活动。PG_MEM 类链还需要数据库审计、shell 子进程、cron 与 miner telemetry，NetSky 类链需要文件与 Run key 变化。
          en: "Defenders need before and after process, task, service, account, file, and Registry snapshots; terminating or deleting process or session, command or API, target object or PID, outcome, and time; and surviving watchdog, cron, account, C2, and resource activity. A PG_MEM-style chain also needs database audit, shell child process, cron, and miner telemetry, while a NetSky-style chain needs file and Run-key change."
        - zh: 只有清除后快照会丢失方向，只有 kill 事件会把 EDR 与攻击者混在一起。防守方应使用 process ancestry、session、数据库 caller、签名、工单和已批准处置计划验证 actor，并在对象短生命周期前远程保留事件。多个攻击者共享工具、事件丢失或系统重装时归因显著下降，但仍可保留选择性差分。
          en: "A post-cleanup-only snapshot loses direction, while kill events alone mix EDR and adversary action. Defenders should use process ancestry, session, database caller, signature, change record, and approved response plan to validate the actor and retain events remotely before short-lived objects disappear. Attribution falls when multiple adversaries share tools, events are lost, or systems are reimaged, although the selective differential can still be retained."
stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary: {zh: 清除竞争驻留降低并发恶意活动密度, en: Evicting competing persistence lowers concurrent malicious-activity density}
    analysis:
      paragraphs:
        - zh: 攻击者终止竞争进程、删除旧任务/Run key 或剥夺其他账户，同时保留自己的后门用户、cron、miner、watchdog 或传播。多主体外联、资源冲突和持久化事件随之减少，剩余攻击者活动分散在更少事件和更长时间，形成时空释痕。PG_MEM 和 NetSky.P 直接证明清除与自身存续共存。
          en: "The adversary terminates competing processes, deletes old tasks or Run keys, or deprivileges other accounts while retaining its own backdoor user, cron, miner, watchdog, or propagation. Multi-actor egress, resource conflict, and persistence events decline, distributing the surviving adversary across fewer events and longer time and producing Spatiotemporal Trace Dilution. PG_MEM and NetSky.P directly establish cleanup coexisting with own survival."
        - zh: 清除前后 inventory、actor、目标对象与后继活动可以恢复方向。PG_MEM 来源明确提到自身历史与竞争者，但主要收益也包括挖矿优化；NetSky.P 旧报告没有完整意图。因此行为与选择性为 high，匿迹动机为综合推断，本机理校准为 medium；具体攻击者链和低噪声目的有额外证据时可提高。
          en: "Before and after inventory, actor, target object, and downstream activity can recover direction. PG_MEM reporting explicitly mentions historical self and competitors, but profit optimization is also a motive, while the older NetSky.P report lacks complete intent. Behavior and selectivity are high confidence but stealth motive is synthesized, so mechanism confidence is calibrated to medium and can rise with additional evidence of an adversary chain and low-noise purpose."
    evidence_refs: [REF-000184, REF-000315, REF-000316]
    confidence: medium
defense: {detections: {coverage: available, strategy_refs: [DET-000071]}, mitigations: {coverage: available, mitigation_refs: [MIT-000071]}}
