schema_version: 2.0.0
type: technique
id: NJT-0091
name: {zh: 排他立足点控制, en: Exclusive Foothold Control}
summary:
  zh: 攻击者在保留自身替代入口时关闭已利用入口面或清除竞争驻留，以减少多主体噪声并降低被其他操作者驱逐的风险。
  en: "Adversaries preserve their own alternative entry while closing an exploited ingress surface or evicting competing persistence to reduce multi-actor noise and the risk of removal by other operators."
aliases: [Exclusive Control]
classification:
  tactic_refs: [TA0003]
  origin: {kind: attack-adapted, source_attack_id: T1668, source_attack_version: "19.1"}
  decision_ref: DEC-TA0003-T1668
definition_and_concept:
  paragraphs:
    - zh: 排他立足点控制是攻击者成功入侵后，先保存一个由自己掌握且不依赖原入口或竞争对象的持续访问路径，再选择性修补漏洞、停用暴露服务、剥夺其他主体权限，或终止和删除其他恶意进程、任务、服务与持久化状态的技术。其直接目标是阻止后来操作者沿相同路径进入或争夺资源，同时让自身入口继续工作并减少多主体活动产生的冲突。
      en: "Exclusive Foothold Control is a technique in which an adversary, after compromise, first preserves a continuing access path under its control that does not depend on the original entry or competing objects, then selectively patches a vulnerability, disables an exposed service, strips another principal's authority, or terminates and deletes other malicious processes, tasks, services, and persistence state. Its direct objective is to prevent later operators from entering through the same path or contending for resources while its own entry continues and conflict from multiple actors declines."
    - zh: 概念锚是“自身入口存续、其他入口或驻留被选择性排除”的不对称 before/after 状态，不是 patch、service stop、kill 或清理工具本身。UNC5174 在创建 F5 后门账户后运行厂商 mitigation.sh，PG_MEM 在保留后门用户、miner 与 cron 时清除竞争进程，分别直接展示两类路径。正常事件响应会对全部未授权对象对称收缩风险；没有存续入口证据时，只能记录异常修补或清除，不能归为本技术。
      en: "The conceptual anchor is an asymmetric before and after state in which the operator's own entry survives while other entry or persistence is selectively excluded, not the patch, service stop, kill, or cleanup tool itself. UNC5174 running the vendor mitigation.sh after creating F5 backdoor accounts and PG_MEM removing competing processes while retaining a backdoor user, miner, and cron directly demonstrate the two paths. Normal incident response symmetrically reduces every unauthorized object. Without evidence of a surviving entry, only anomalous patching or cleanup can be recorded, not this technique."
stealth_characteristics:
  paragraphs:
    - zh: 排他立足点控制改变的是环境中恶意信号的数量、并发性和方向。原漏洞看似已修复、暴露服务停止、竞争账户降权或其他恶意软件消失后，重复扫描、并发外联、资源争用、相互覆盖的任务和多主体告警下降；防守方若只观察当前暴露面和当前进程集合，可能把更稳定的主机误认为处置已经完成，而攻击者从另一账户、服务、cron、植入或通道继续低频访问。
      en: "Exclusive Foothold Control changes the count, concurrency, and direction of malicious signals in the environment. After the original vulnerability appears patched, an exposed service stops, a competing account loses privilege, or other malware disappears, repeated scanning, concurrent egress, resource contention, overlapping tasks, and multi-actor alerts decline. A defender observing only current exposure and process inventory can mistake the more stable host for completed remediation while the adversary continues sparse access through another account, service, cron, implant, or channel."
    - zh: 选择性仍留下可恢复差分：原利用日志、替代入口创建、patch/service/account/process writer、被删除对象的历史快照、终止/删除结果、仍存持久对象和后续认证/网络活动。UNC5174 审计提供 exploit—账户—mitigation 顺序，PG_MEM 提供旧 cron/竞争进程清除与新 cron/miner 并存。合法应急修补、EDR 隔离和管理员清除产生相似动作，必须使用批准、处置主体、覆盖范围和自身入口存续区分。
      en: "Selectivity still leaves recoverable differences: original exploitation logs, alternative-entry creation, patch or service or account or process writer, historical snapshots of removed objects, termination or deletion outcome, surviving persistence, and later authentication or network activity. UNC5174 audit provides an exploit-to-account-to-mitigation sequence, while PG_MEM provides old cron and competitor removal alongside new cron and miner survival. Legitimate emergency patching, EDR containment, and administrator cleanup create similar actions and require approval, remediation principal, coverage scope, and surviving own entry for separation."
scope_boundary_definition:
  paragraphs:
    - zh: 本技术只纳入攻击者控制的入口关闭或驻留清除，且必须同时证明被排除对象可供另一主体进入或维持、自身独立入口在变更后继续存在或使用，以及动作位于攻击者控制窗口。入口面关闭按漏洞、服务或账户暴露状态建立利用—变更—替代入口时间线；竞争立足点清除按进程、服务、任务、账户或持久对象建立删除差分与存续集合。平台、命令和攻击者类型不形成子项。
      en: "This technique includes adversary-controlled ingress closure or persistence removal only when the excluded object could support another principal's entry or foothold, the operator's independent entry continues to exist or be used after the change, and the action occurs during adversary control. Ingress-surface closure builds an exploitation-to-change-to-alternative-entry timeline for vulnerability, service, or account exposure. Competing-foothold eviction builds removal differentials and a surviving set across processes, services, tasks, accounts, or persistence objects. Platform, command, and actor type do not form children."
    - zh: 组织补丁、自动更新、事件响应、反恶意软件清除、合规服务退役和账户复核是强反例。主要阻断安全产品、管理员、恢复或日志的行为归 Defense Impairment；只为释放 CPU、提高挖矿收益或破坏业务而 kill 进程属于资源劫持或 Impact，除非同时证明目标是竞争入口且自身入口存续。攻击者清除自己旧版本但没有排除其他主体时可属于部署维护，不自动构成排他控制。
      en: "Organizational patching, automatic updates, incident response, antimalware cleanup, compliant service retirement, and account review are strong counterexamples. Behavior primarily blocking security products, administrators, recovery, or logging belongs to Defense Impairment. Killing a process only to free CPU, increase mining profit, or disrupt business belongs to Resource Hijacking or Impact unless the target is shown to be a competing entry and the operator's own entry survives. An adversary replacing its own old version without excluding another principal can be deployment maintenance and does not automatically form exclusive control."
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 初始访问代理攻陷互联网设备后，可先创建后门管理账户、密钥、web shell 或隧道，再应用原漏洞的厂商缓解脚本或关闭入口服务，使后续扫描显示资产已经修复。UNC5174 在 F5 BIG-IP 上的顺序属于该场景：利用和账户创建先发生，自修补后发生，替代账户与工具使访问不再依赖原漏洞。
        en: "After compromising an internet appliance, an initial-access broker can first create a backdoor administrator account, key, web shell, or tunnel and then apply the vendor mitigation for the original vulnerability or close the ingress service, causing later scans to report the asset remediated. UNC5174 on F5 BIG-IP demonstrates this sequence: exploitation and account creation occurred first, self-patching followed, and alternative accounts and tooling removed dependence on the original vulnerability."
      - zh: 僵尸网络、蠕虫和资源劫持操作者可枚举已存在的恶意进程、cron、Run key、账户或服务，删除竞争对象后保留自己的 watchdog、miner、cron 或传播路径。PG_MEM 与 NetSky.P 分别展示现代 Linux/PostgreSQL 与旧 Windows 蠕虫场景。后继挖矿或传播证明存续，但只有选择性对象差分才能证明排他而非普通清理。
        en: "Botnet, worm, and resource-hijacking operators can enumerate existing malicious processes, cron, Run keys, accounts, or services, delete competing objects, and retain their own watchdog, miner, cron, or propagation path. PG_MEM and NetSky.P demonstrate modern Linux or PostgreSQL and older Windows worm contexts respectively. Downstream mining or propagation establishes survival, but only a selective object differential establishes exclusion rather than ordinary cleanup."
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要识别原入口、替代入口和竞争驻留之间的依赖，具有补丁、服务、账户、任务、文件或进程管理权限，并能在排除动作后验证自身仍可访问。入口关闭还需要兼容的厂商补丁/配置知识和维护窗口；竞争清除需要进程/对象发现、签名或名称匹配，并避免把自己的组件误判为目标。错误会自我驱逐、破坏业务或触发高风险变更告警。
          en: "The adversary needs to identify dependencies among original entry, alternative entry, and competing persistence; hold patch, service, account, task, file, or process-management authority; and verify continued access after exclusion. Ingress closure additionally requires compatible vendor patch or configuration knowledge and a maintenance window. Competitor removal requires process or object discovery and signature or name matching without misclassifying the operator's own components. Errors cause self-eviction, business disruption, or high-risk change alerts."
        - zh: 攻击者还需容忍前后状态被长期保留和跨工具关联。不可变利用日志、变更审批、EDR 终止/删除事件、周期漏洞/进程/服务/任务/账户快照、隔离恢复与 out-of-band 访问验证会提高成本。若没有独立替代入口，修补或清除会同时终止自身；若竞争对象不可见或具有反清除逻辑，排他结果可能失败。
          en: "The adversary must also tolerate long-lived before and after state and cross-tool correlation. Immutable exploitation logs, change approval, EDR termination or deletion events, periodic vulnerability, process, service, task, and account snapshots, isolated recovery, and out-of-band access validation raise cost. Without an independent alternative entry, patching or cleanup also terminates the operator's access. If competing objects are hidden or implement counter-cleanup, exclusive outcome can fail."
    defender_model:
      paragraphs:
        - zh: 防守方需要把原利用/登录、替代入口创建、漏洞或服务姿态变化、账户权限、进程/任务/服务/文件终止与删除，以及变更后仍存认证/网络/资源活动规范到同一资产和时间线。每个变更保存 actor、process/session、command/API、target、old/new、结果、批准和工单；周期快照保留被删除与存续集合，不能只保留当前“已修补”或“无竞争进程”的状态。
          en: "Defenders need to normalize original exploitation or sign-in, alternative-entry creation, vulnerability or service posture change, account privilege, process, task, service or file termination and deletion, and surviving authentication, network, or resource activity onto one asset and timeline. Each change retains actor, process or session, command or API, target, old and new state, outcome, approval, and change record. Periodic snapshots retain removed and surviving sets rather than only the current patched or no-competitor state."
        - zh: 防守方必须用授权处置计划和独立渠道确认修复主体。只看到当前漏洞不存在不能证明此前未被利用，只看到恶意进程被杀也不能判断攻击者还是 EDR 执行。日志留存短于入侵到自修补间隔、资产重装丢失历史、多个攻击者共享工具或处置人员使用相同命令都会降低归因；只有方向、选择性和存续入口共同成立时才确认。
          en: "Defenders must verify remediation principal through an authorized response plan and independent channel. A currently absent vulnerability does not show it was never exploited, and a killed malicious process does not identify whether an adversary or EDR acted. Retention shorter than the exploit-to-self-patch interval, history lost during reimage, multiple actors sharing tools, or responders using the same commands lowers attribution. Confirmation requires direction, selectivity, and a surviving entry together."
stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 选择性排除竞争入口和活动降低多主体信号密度
      en: "Selective exclusion of competing entries and activity lowers multi-actor signal density"
    analysis:
      paragraphs:
        - zh: 攻击者先保存自己的替代入口，再关闭原可利用面或删除竞争驻留，使重复利用、并发恶意进程、重复外联、资源冲突和相互覆盖的持久化事件减少。自身访问没有消失，却在更少事件和更长时间中继续，环境的局部恶意信号密度下降，形成时空释痕。UNC5174、PG_MEM 和 NetSky.P 直接证明排除动作与自身状态共存。
          en: "The adversary first preserves its alternative entry and then closes the original exploitable surface or removes competing persistence, reducing repeated exploitation, concurrent malicious processes, duplicate egress, resource conflict, and overlapping persistence events. Its own access does not disappear but continues in fewer events over a longer period, lowering local malicious-signal density and producing Spatiotemporal Trace Dilution. UNC5174, PG_MEM, and NetSky.P directly establish exclusion actions coexisting with the operator's own state."
        - zh: before/after 快照、变更 actor、被删除对象、仍存入口和后续使用可以恢复不对称。来源直接支持行为和 ATT&CK 所述噪声降低，但只有 UNC5174 对限制后续无关攻击者给出分析，PG_MEM/NetSky 的匿迹目的与收益目的可能并存。因此父级机理从原来的 blanket high 校准为 medium，具体已证明选择性的案例可以提高。
          en: "Before and after snapshots, change actor, removed objects, surviving entry, and later use can recover the asymmetry. Sources directly support the behavior and ATT&CK's stated noise reduction, but only UNC5174 analysis explicitly addresses limiting later unrelated actors, while stealth and profit motives can coexist for PG_MEM and NetSky. The parent mechanism is therefore calibrated from blanket high to medium, with specific cases of proven selectivity able to raise it."
    evidence_refs: [REF-000184, REF-000314, REF-000315, REF-000316]
    confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 两项 Niji 子技术按被排除对象和防守数据分开。入侵后入口面关闭改变漏洞、服务或账户暴露状态，需要利用—替代入口—姿态变更—继续访问谱系；竞争立足点清除改变恶意进程、任务、服务、账户或持久对象集合，需要终止/删除 actor、before/after inventory 和存续入口。二者可以连续发生，但一个针对未来入口面，一个针对已经存在的竞争驻留。
        en: "Two Niji children separate by excluded object and defensive data. Post-Compromise Ingress-Surface Closure changes vulnerability, service, or account exposure and requires exploitation-to-alternative-entry-to-posture-change-to-continuing-access lineage. Competing-Foothold Eviction changes malicious process, task, service, account, or persistence sets and requires termination or deletion actor, before and after inventory, and surviving entry. They can occur in sequence, but one targets a future ingress surface and the other existing competing persistence."
      - zh: ATT&CK T1668 无子项，开放搜索还审查防守访问阻断、纯资源独占和自身版本清理。防守访问阻断主要归 Defense Impairment；纯 CPU/收益提升归 Resource Hijacking/Impact；只替换自己旧组件而未排除其他主体是部署维护。只有“攻击者控制排除且自身入口存续”共同成立时才返回父级，未为数量正式化额外轴。
        en: "ATT&CK T1668 has no children, so open search also reviewed defender-access denial, pure resource monopolization, and cleanup of the operator's own version. Defender-access denial primarily belongs to Defense Impairment, pure CPU or profit increase to Resource Hijacking or Impact, and replacing only the operator's old component without excluding another principal is deployment maintenance. An axis returns to parent scope only when adversary-controlled exclusion and own-entry survival both hold, and no extra axis was formalized for count."
  coverage: established
  subtechnique_refs: [NJS-0091-001, NJS-0091-002]
