research:
  limitations:
    paragraphs:
      - zh: UNC5174 提供最完整的利用、后门账户和自修补顺序，并由 Mandiant 评估限制无关攻击者；PG_MEM 提供后门用户、竞争进程/cron 清除和自身 cron/miner 存续；NetSky.P 只提供自身传播与 Bagle Run keys 删除，年代较早且缺少现代 actor telemetry。三个案例均支持分类，但来源粒度不同，不能把所有 patch、kill 或 Registry 删除提升为同等置信。
        en: "UNC5174 provides the most complete exploitation, backdoor-account, and self-patch sequence plus Mandiant's assessment of limiting unrelated actors. PG_MEM provides a backdoor user, competitor process or cron removal, and survival of its own cron and miner. NetSky.P provides only self-propagation and deletion of Bagle Run keys and is older with no modern actor telemetry. All three support the taxonomy at different granularity and do not make every patch, kill, or Registry deletion equally confident."
      - zh: 公开报告常遗漏攻击者完整替代入口或清除前对象全集；多个恶意主体可能共享 miner、账户或脚本，导致“谁清除了谁”不确定。正常事件响应使用相同工具并可能先保留取证通道，因此命令名称和缺少工单不能单独区分。没有存续入口、排除方向和攻击者控制窗口时，结论必须降为异常变更、资源清理或 Defense Impairment。
        en: "Public reporting often omits the operator's complete alternative entry or the full pre-cleanup object set, and multiple malicious actors can share miners, accounts, or scripts, making direction uncertain. Normal incident response uses the same tools and may preserve a forensic channel first, so command name and a missing ticket do not separate behavior by themselves. Without a surviving entry, exclusion direction, and adversary-control window, the conclusion must fall back to anomalous change, resource cleanup, or Defense Impairment."
