research:
  limitations:
    paragraphs:
    - zh: Kubernetes 文档直接证明 tag 可移动而 digest 唯一，ATT&CK 直接支持内部镜像植入；它们支持稳定变量，但不证明每次 tag 更新为恶意。没有未经批准 actor、内容/签名差异和至少一个实例解析结果时，只能报告供应链或发布异常。
      en: Kubernetes documentation directly establishes mutable tags and unique digests, while ATT&CK directly supports internal-image implantation.
        They support the stable variable but do not make every tag update malicious. Without an unapproved actor, content or signature difference,
        and at least one instance-resolution outcome, only a supply-chain or release anomaly can be reported.
    - zh: 缓存、镜像拉取策略、多架构 manifest 和 registry replication 会使当前 tag、节点 digest 与启动时间暂时不一致；合法 rollback 也会恢复旧 digest。调查必须使用事件时间和实际 resolved digest，不能从字符串相同或不同单独归因。
      en: Caching, image pull policy, multiarchitecture manifests, and registry replication can temporarily separate current tag, node digest,
        and start time, while legitimate rollback restores an older digest. Investigation must use event time and actual resolved digest and cannot
        attribute from string equality or inequality alone.
