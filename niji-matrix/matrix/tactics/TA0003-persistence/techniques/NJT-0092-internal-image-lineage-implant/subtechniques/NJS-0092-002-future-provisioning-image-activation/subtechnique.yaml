research:
  limitations:
    paragraphs:
    - zh: ATT&CK 和现有检测材料支持 image push 与以后 deployment/instance start 的关联，但公开案例没有为所有 VM、容器和灾备系统提供相同字段。跨环境统一只基于 image identity—content—instance 谱系，不能假定统一窗口或签名系统。
      en: ATT&CK and existing detection material support correlation of image push with later deployment or instance start, but public cases do
        not provide identical fields across every VM, container, and recovery system. Cross-environment unification follows only image identity-content-instance
        lineage and cannot assume one window or signing system.
    - zh: 扩缩容、恢复和滚动更新天然产生跨时间/资产启动；必须证明镜像先被未经批准修改且新实例继承异常结果。未被消费的镜像保持风险状态，合法发布或灾备演练必须用 actor、工单、签名与预期 first action 排除。
      en: Scaling, recovery, and rolling update naturally create cross-time and cross-asset starts. Prior unapproved image modification and anomaly
        inherited by a new instance must be shown. An unconsumed image remains a risk state, while legitimate release or recovery exercise requires
        actor, change record, signature, and expected first action as counterexamples.
