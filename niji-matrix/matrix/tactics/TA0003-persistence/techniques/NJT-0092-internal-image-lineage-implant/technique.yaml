research:
  limitations:
    paragraphs:
    - zh: ATT&CK 与 DET0334 直接支持内部镜像植入、registry push 和以后部署/实例启动；Kubernetes 直接支持 tag 与 digest 语义。跨 VM 和容器的统一限于相同 image identity-content-instance
        谱系，不假定所有平台都有相同字段。合法发布同样改变 digest 并在未来启动，必须结合 push actor、审批、签名/SBOM 差异和异常运行结果。
      en: ATT&CK and DET0334 directly support internal-image implantation, registry push, and later deployment or instance
        start, while Kubernetes directly supports tag and digest semantics. Unification across VM and container images is
        limited to equivalent image identity-content-instance lineage and does not assume identical fields. Legitimate releases
        also change digests and start later, requiring push actor, approval, signature or SBOM difference, and anomalous runtime
        outcome.
