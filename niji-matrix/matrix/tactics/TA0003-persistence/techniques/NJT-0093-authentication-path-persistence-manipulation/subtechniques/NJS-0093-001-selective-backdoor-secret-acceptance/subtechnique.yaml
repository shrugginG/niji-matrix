schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0093-001
parent_ref: NJT-0093
name:
  zh: 选择性后门秘密接受
  en: Selective Backdoor-Secret Acceptance
summary:
  zh: 攻击者使验证器或信任路径额外接受一个主密码、签名密钥或等价证明，同时把普通输入交回原路径，使异常允许隐藏在正常认证结果中。
  en: Adversaries make a validator or trust path additionally accept a master password, signing key, or equivalent proof while returning ordinary input to the original path so anomalous allow decisions hide among normal authentication outcomes.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: >-
        选择性后门秘密接受是攻击者改变认证验证器或信任路径，使一个由攻击者掌握的主密码、签名私钥或等价证明额外获得成功，而正常密码、正常签名者和其他输入继续使用原验证逻辑的匿迹子技术。其直接目标是建立不依赖受害者主秘密的重复入口，同时避免逐账户修改和大范围认证故障。
      en: >-
        Selective Backdoor-Secret Acceptance is an evasion sub-technique in which an adversary changes an authentication validator or trust path so an attacker-held master password, signing private key, or equivalent proof additionally succeeds while normal passwords, ordinary signers, and other input continue through original validation. Its direct objective is a repeatable entry independent of victim primary secrets without per-account mutations or broad authentication failure.
    - zh: >-
        区分变量是“额外可信证明”而不是实现介质。Skeleton Key 在域验证中接受同一主密码，Solorigate 联合信任接受由攻击者证书签发的令牌；两者都保留原认证路径，但状态键分别是验证器版本/内存和信任证书。硬编码密码、补丁函数、加载插件与联合证书可属于同一变量，前提是它们对选定证明改变最终 decision。
      en: >-
        The distinguishing variable is an added trusted proof rather than implementation medium. Skeleton Key accepts one master password in domain validation, while a Solorigate federation trust accepts tokens signed by an attacker certificate. Both preserve the original authentication path, although their state keys are validator version or memory and trust certificate respectively. A hardcoded password, patched function, loaded plug-in, or federation certificate can belong to this variable only when it changes the final decision for selected proof.
stealth_characteristics:
  paragraphs:
    - zh: >-
        选择性后门秘密接受只改变极小证明集合的结果。合法用户继续使用原密码或联合身份，错误秘密仍然失败，服务健康检查与总体成功/失败率可以保持原状；没有攻击者秘密或签名能力的沙箱也无法触发路径。防守方因而难以从普通登录样本判断生产验证器是否包含额外允许分支，异常成功还可能看似由熟悉主体发起。
      en: >-
        Selective Backdoor-Secret Acceptance changes outcomes for only a very small proof set. Legitimate users continue with original passwords or federation, wrong secrets still fail, and service health plus aggregate success and failure rates can remain stable. A sandbox lacking the attacker secret or signing capability cannot trigger the path. Defenders therefore cannot infer from ordinary sign-in samples whether the production validator contains an added allow branch, and anomalous success can appear under a familiar principal.
    - zh: >-
        选择性不消除组件与信任痕迹。受保护进程或内存页变化、模块路径与签名、函数差异、域联合设置、证书指纹、变更发起者、异常令牌声明、request/correlation ID 和资源结果均可区分路径。重启可能清除纯内存 Skeleton Key，而证书轮换或信任恢复会终止联合路径；完整性度量、独立证书盘点和受控差分输入会显著限制匿迹。
      en: >-
        Selectivity does not remove component and trust evidence. Protected-process or memory-page change, module path and signature, function difference, domain-federation setting, certificate fingerprint, mutation initiator, anomalous token claim, request or correlation ID, and resource outcome can distinguish the path. A restart can remove a purely in-memory Skeleton Key, while certificate rotation or trust restoration terminates a federation path. Integrity measurement, independent certificate inventory, and controlled differential input materially constrain stealth.
scope_boundary_definition:
  paragraphs:
    - zh: >-
        本子技术纳入一个非正常证明在被改变的验证器或信任关系中成功、而对照验证器或原配置应拒绝的行为。必须识别额外证明类别，定位使其可信的组件、内存、模块或证书差异，并证明正常输入仍由原路径处理。平台、认证协议、密码或密钥格式和补丁工具不形成兄弟分类。
      en: >-
        This child includes a nonstandard proof succeeding in a changed validator or trust relationship when a control validator or original configuration should reject it. Classification must identify the added proof class, locate the component, memory, module, or certificate difference that makes it trusted, and show that ordinary input still follows the original path. Platform, authentication protocol, password or key format, and patching tool do not form sibling categories.
    - zh: >-
        只截取用户输入、不改变最终 decision 的恶意 PAM 或 SSH 修改属于 Credential Access；替换某一账户密码或增加账户认证器属于 T1098；只窃取合法签名证书而不改变验证器或信任配置属于令牌伪造与有效身份使用。全面关闭 MFA 或按作用域设置例外属于父级或 NJS-0093-002。合法兼容插件和计划内证书轮换必须由批准、版本、所有者和预期旧路径撤销证明。
      en: >-
        A malicious PAM or SSH change that captures user input without changing the final decision belongs to Credential Access. Replacing one account password or adding an account authenticator belongs to T1098. Stealing a legitimate signing certificate without changing a validator or trust configuration belongs to token forgery and valid-identity use. Broad MFA disablement or a scoped exception remains parent behavior or NJS-0093-002. Legitimate compatibility plug-ins and planned certificate rotation require approval, version, owner, and evidence that the intended old path was retired.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: >-
          攻击者在已经取得域控制器、VPN/网络设备、本地 PAM/SSO 服务或联合身份管理权限后，将主密码比较分支写入验证进程，加载恶意认证模块，或把攻击者证书加入目标租户的联合信任。以后即使受害者轮换用户密码、注销原会话或重置单个账户，攻击者仍可用主密码或自签令牌重新认证，并访问依赖同一验证器或信任的远程与云资源。
        en: >-
          After obtaining authority over a domain controller, VPN or network device, local PAM or SSO service, or federation administration, an adversary writes a master-password comparison branch into validation, loads a malicious authentication module, or adds an attacker certificate to victim federation trust. Even after user-password rotation, original-session revocation, or one-account reset, the adversary can authenticate again with the master password or a self-issued token and access remote or cloud resources relying on the same validator or trust.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: >-
            攻击者需要能够修改认证进程、受保护文件、内存或联合信任，并理解调用顺序、协议、签名和失败处理，以确保非攻击者输入仍返回正确结果。组件实现还要求匹配版本和架构、避免进程崩溃并在重启或升级后重新建立；联合实现要求生成和保护私钥、构造目标接受的令牌声明并维持证书信任。错误补丁、重复证书、异常广泛成功或普通用户故障会暴露路径。
          en: >-
            The adversary needs authority to modify an authentication process, protected file, memory, or federation trust and knowledge of call order, protocol, signing, and failure handling so non-adversary input continues to return correct results. A component implementation also requires matching version and architecture, avoiding process failure, and reestablishing after restart or upgrade. A federation implementation requires generating and protecting a private key, constructing claims the target accepts, and maintaining certificate trust. A bad patch, duplicate certificate, unusually broad success, or ordinary-user failure exposes the path.
        - zh: >-
            操作者必须能够安全验证后门而不留下大量异常请求，并承受高价值身份基础设施的变更风险。受保护进程、LSA 插件签名、只读或度量启动、隔离更新、双人联合配置批准、硬件保护签名密钥和独立信任清单会提高成本。若攻击者只有账户权限而没有验证或信任写权限，本子技术不成立。
          en: >-
            The operator must test the backdoor without leaving many anomalous requests and tolerate the risk of changing high-value identity infrastructure. Protected processes, LSA plug-in signing, read-only or measured boot, isolated updates, two-person federation approval, hardware-protected signing keys, and an independent trust inventory raise cost. If the adversary has only account authority and no validator or trust write authority, this child does not hold.
    defender_model:
      paragraphs:
        - zh: >-
            防守方需要可信同版本认证组件或独立内存度量、加载模块与签名、更新来源和重启历史；联合环境还需要域信任版本、证书指纹、添加者、来源地址和批准。请求侧至少要保留主体、输入或证明类别、认证方法、request/correlation ID、令牌签名/声明、最终 decision 与资源结果。组件或证书差异只能先形成风险状态，与生产独有异常成功连接后才证明路径被使用。
          en: >-
            Defenders need a trusted same-version authentication component or independent memory measurement, loaded modules and signatures, update provenance, and restart history. Federation environments additionally need domain-trust versions, certificate fingerprints, add actor, source address, and approval. The request side should retain at least principal, input or proof class, authentication method, request or correlation ID, token signature or claims, final decision, and resource outcome. A component or certificate difference first establishes risky state and proves path use only when joined to a production-only anomalous success.
        - zh: >-
            防守观察不能假定日志包含真实密码或私钥；差分测试应使用隔离账户和不可用于生产的 canary 输入，并比较正确、错误与 canary 结果。没有输入类别时，可以用同一异常证明跨多个主体成功、令牌签名者异常或组件完整性变化提高置信度，但不能从一次熟悉账户成功直接反推主密码。若攻击者控制黄金映像、签名者和联合审计，必须依赖离线采集或独立身份平面。
          en: >-
            The defender model must not assume logs contain real passwords or private keys. Differential testing should use isolated accounts and canary input unusable in production and compare correct, incorrect, and canary outcomes. Without input class, the same anomalous proof succeeding across principals, an unexpected token signer, or component-integrity change can raise confidence, but one familiar-account success cannot establish a master password. If the adversary controls golden images, signing, and federation audit, offline acquisition or an independent identity plane is required.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 攻击者证明分支不出现在普通认证样本中
      en: The adversary-proof branch does not appear in ordinary authentication samples
    analysis:
      paragraphs:
        - zh: >-
            攻击者将一个额外成功条件嵌入验证器或信任集合，只有主密码、攻击者签名或等价证明进入该分支；正确用户输入和普通错误输入均沿用原决策。Skeleton Key 的正常用户密码继续工作，Solorigate 的正常联合身份也无需改变，短时健康检查因此没有执行关键路径。行为存在于生产认证面，却未进入默认测试和聚合统计的理解范围，形成行为透明。
          en: >-
            The adversary embeds an added success condition in a validator or trust set, and only a master password, attacker signature, or equivalent proof enters that branch; correct user input and ordinary wrong input retain their original decisions. Normal user passwords continue to work under Skeleton Key and ordinary federated identity need not change under Solorigate, so short health checks do not exercise the critical path. The behavior exists in production authentication but remains outside the understanding of default tests and aggregate statistics, producing Behavioral Transparency.
        - zh: >-
            独立完整性和信任差分仍能恢复该分支：域控制器内存、模块或函数不同，联合配置出现攻击者证书，异常证明随后产生被接受的请求和资源访问。政府与 Microsoft 来源直接证明两种实例，但无法证明每个平台的攻击者都为躲避检测而保留正常 pass-through，故机理置信度保持 medium；只有差异没有异常结果时也不能宣称后门已使用。
          en: >-
            Independent integrity and trust differentials can still recover the branch: domain-controller memory, modules, or functions differ; federation configuration contains an attacker certificate; and the anomalous proof later produces an accepted request and resource access. Government and Microsoft sources directly establish both instances, but do not prove that every platform adversary preserved normal pass-through specifically to evade detection, so mechanism confidence remains medium. A difference without an anomalous outcome also cannot establish backdoor use.
    evidence_refs:
      - REF-000187
      - REF-000303
      - REF-000304
    confidence: medium
