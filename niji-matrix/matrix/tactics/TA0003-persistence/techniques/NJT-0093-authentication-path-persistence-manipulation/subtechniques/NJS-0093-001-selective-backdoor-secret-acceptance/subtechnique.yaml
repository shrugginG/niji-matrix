research:
  limitations:
    paragraphs:
      - zh: >-
          Skeleton Key 对主密码、原密码共存和域验证覆盖提供直接证据；Solorigate 对攻击者证书加入联合信任、伪造令牌接受和 MFA 绕过提供直接证据。二者证明相同选择性证明变量，但持久性不同：纯内存补丁可能在重启后消失，联合证书则持续到信任恢复或证书轮换。不能把任一案例的实现、寿命或遥测字段外推到所有 PAM、VPN 和身份提供商。
        en: >-
          Skeleton Key provides direct evidence for coexistence of master and original passwords and an override of domain validation. Solorigate provides direct evidence for an attacker certificate added to federation trust, acceptance of forged tokens, and MFA bypass. Both establish the same selective-proof variable but have different persistence: a purely in-memory patch can disappear on restart, whereas a federation certificate persists until trust restoration or certificate rotation. Neither case's implementation, lifetime, or telemetry fields can be generalized to every PAM, VPN, and identity provider.
      - zh: >-
          未知后门秘密不能穷举，认证日志通常也不应记录秘密本身。没有可信组件、内存或证书基线时，异常成功可能由合法恢复、联合迁移或日志聚合造成；只有攻击者控制证据、状态差异和结果连接同时存在时才能保持高置信。缺少结果连接时应降为完整性或信任异常，不能仅凭 hash 变化归入本子技术。
        en: >-
          Unknown backdoor secrets cannot be exhausted and authentication logs generally should not record secrets themselves. Without a trusted component, memory, or certificate baseline, anomalous success can result from legitimate recovery, federation migration, or log aggregation. High confidence requires adversary-control evidence, state difference, and outcome linkage together. Without the outcome join, the finding must remain an integrity or trust anomaly rather than being assigned to this child from a hash difference alone.
