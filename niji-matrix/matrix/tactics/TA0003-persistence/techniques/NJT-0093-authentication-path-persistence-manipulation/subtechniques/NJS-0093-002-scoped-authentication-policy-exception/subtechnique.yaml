schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0093-002
parent_ref: NJT-0093
name:
  zh: 范围化认证策略例外
  en: Scoped Authentication-Policy Exception
summary:
  zh: 攻击者在总体认证策略仍启用时修改条件或排除集合，使选定主体、设备、来源或资源持续绕过原认证要求。
  en: Adversaries modify conditions or exclusion sets while overall authentication policy remains enabled so selected principals, devices, origins, or resources continue to bypass the original requirement.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: >-
        范围化认证策略例外是攻击者改变 MFA、Conditional Access、风险认证或等价 IAM 决策策略的条件与排除集合，使特定主体、组、设备、受信位置、客户端、认证流或资源不再满足原来的强认证或拒绝要求，而大多数请求仍受总体策略保护的匿迹子技术。其直接目标是为攻击者未来会话保存一个窄而稳定的策略绕过面。
      en: >-
        Scoped Authentication-Policy Exception is an evasion sub-technique in which an adversary changes conditions or exclusion sets in MFA, Conditional Access, risk-based authentication, or equivalent IAM decision policy so a selected principal, group, device, trusted location, client, authentication flow, or resource no longer receives the original strong-authentication or deny requirement while most requests remain protected by the overall policy. Its direct objective is a narrow durable policy-bypass surface for future adversary sessions.
    - zh: >-
        区分变量是“策略作用域差分”，不是云产品或例外字段名。Microsoft 文档表明 include/exclude、设备、应用和其他条件共同决定是否应用策略；GTIG/Mandiant 则记录 UNC3944 修改 MFA 要求，并要求重点审查受信命名位置和对被攻陷用户或设备的排除。无论介质是 JSON 策略、管理门户还是 API，只要总体控制仍存在而攻击者选择的 scope 获得不同 decision，就属于该变量。
      en: >-
        The distinguishing variable is policy-scope differential rather than cloud product or exception-field name. Microsoft documentation shows that include and exclude assignments, device, application, and other conditions determine whether policy applies, while GTIG and Mandiant report UNC3944 modifying MFA requirements and direct attention to trusted named locations and exclusions for compromised users or devices. Whether stored as JSON policy, portal state, or API object, the variable holds when the overall control remains present but an adversary-selected scope receives a different decision.
stealth_characteristics:
  paragraphs:
    - zh: >-
        范围化认证策略例外让绝大多数用户、设备和应用继续通过 MFA 或风险评估，策略列表和仪表板也继续显示控制已启用；只有命中特定排除或信任条件的请求得到不同结果。总体 MFA 覆盖率和随机测试因而可能正常，攻击者会话又可以使用熟悉主体与标准登录端点，使粗粒度审查难以区分一个窄例外是否具有恶意目的。
      en: >-
        Scoped Authentication-Policy Exception leaves MFA or risk evaluation active for most users, devices, and applications, and policy lists or dashboards continue to report the control enabled; only requests matching a selected exclusion or trust condition receive a different result. Aggregate MFA coverage and random tests can therefore look normal, while adversary sessions can use a familiar principal and standard sign-in endpoint, making it difficult for coarse review to distinguish a malicious narrow exception.
    - zh: >-
        策略差异与命中痕迹仍然存在。变更审计可保存 policy ID、旧/新 JSON、modified properties、writer、来源、审批和到期；登录面可以保存主体、设备、客户端、资源、认证方法序列、应用或未应用的策略、结果及 request/correlation ID。合法 break-glass、服务主体、迁移、设备注册 bootstrap 和受信网络也会使用例外，只有缺少批准、作用域偏离业务基线且出现实际异常命中时，才能把匿迹结论提高。
      en: >-
        Policy differences and match evidence remain. Change audit can retain policy ID, old and new JSON, modified properties, writer, origin, approval, and expiry. The sign-in plane can retain principal, device, client, resource, authentication-method sequence, applied or unapplied policy, result, and request or correlation ID. Legitimate break-glass, service principals, migration, device-registration bootstrap, and trusted networks also use exceptions. Stealth confidence can rise only when approval is absent, scope departs from business baseline, and an anomalous match actually occurs.
scope_boundary_definition:
  paragraphs:
    - zh: >-
        本子技术纳入攻击者新增、扩大或延长明确策略例外，并使至少一次未来请求因命中该作用域而获得原策略本应拒绝或加强验证的结果。判定需要可比较的策略版本、攻击者控制或未批准 writer、可解析的条件/排除差异，以及请求级策略评估。主体、设备、来源、应用和认证流是可组合作用域，不各自形成子技术。
      en: >-
        This child includes adversary addition, expansion, or extension of an explicit policy exception when at least one future request receives an outcome that the original policy should have denied or strengthened because it matched that scope. Classification requires comparable policy versions, an adversary-controlled or unapproved writer, a resolvable condition or exclusion difference, and request-level policy evaluation. Principal, device, origin, application, and authentication flow are composable scopes rather than separate children.
    - zh: >-
        完全关闭认证服务或总体 MFA 可以属于 NJT-0093 父级，但不是本子项的“总体仍启用”变量；修改单一账户注册的认证方法或受信设备属于 T1098；偷取会话令牌后绕过重新认证而没有策略变化属于凭据/令牌使用。合法紧急账户和 bootstrap 例外必须有明确 owner、理由、有限寿命、持续监控与事后复核；产品默认排除若没有攻击者变更不属于本子项。
      en: >-
        Fully disabling authentication service or overall MFA can remain NJT-0093 parent behavior but does not satisfy this child's overall-still-enabled variable. Changing one account's registered authentication method or trusted device belongs to T1098. Using a stolen session token to avoid reauthentication without policy change belongs to credential or token use. Legitimate emergency-account and bootstrap exceptions require a named owner, rationale, bounded lifetime, continuous monitoring, and post-use review. A product default exclusion without adversary mutation is outside this child.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: >-
          攻击者在取得身份策略管理员、云全局管理员或等价 API 权限后，把被攻陷用户或设备加入强制 MFA 策略排除，创建覆盖其出口的受信命名位置，或限制策略使攻击者使用的应用、资源或认证流不再命中。以后攻击者从该情境登录时仍可获得访问，而组织在其他用户上继续看到 MFA 提示和策略成功，从而在密码轮换或局部处置后保留入口。
        en: >-
          After obtaining identity-policy administrator, cloud global administrator, or equivalent API authority, an adversary excludes a compromised user or device from an MFA-enforcing policy, creates a trusted named location covering adversary egress, or narrows policy so the application, resource, or authentication flow used by the adversary no longer matches. Later sign-in from that context still receives access while the organization continues to see MFA prompts and successful policy enforcement for other users, preserving an entry after password rotation or partial response.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: >-
            攻击者需要写入认证策略、受信位置或相关条件对象的权限，并理解多策略合并、include/exclude 优先级、嵌套组、设备状态、客户端和资源匹配，以及已签发令牌何时重新评估。为了保持低噪声，例外必须足够窄而且稳定覆盖其未来会话；过宽排除、策略冲突、锁定用户或审批通知会暴露变更。攻击者还需控制或预测来源、设备或主体属性。
          en: >-
            The adversary needs authority to write authentication policy, trusted locations, or related condition objects and knowledge of multipolicy combination, include and exclude precedence, nested groups, device state, client and resource matching, and when issued tokens are reevaluated. To remain low-noise, the exception must be narrow yet stable enough to cover future sessions. A broad exclusion, policy conflict, user lockout, or approval notification exposes the change. The adversary must also control or predict origin, device, or principal attributes.
        - zh: >-
            隔离管理站、抗钓鱼 MFA、按目标和时间限定的 JIT 角色、双人审批、自动配置导出、变更 webhook 和不可变日志会提高成本。若平台不允许细粒度排除，或者每次例外命中都会触发独立告警，攻击者难以在总体健康外观下长期使用该路径。
          en: >-
            Isolated administration, phishing-resistant MFA, target- and time-bounded JIT roles, two-person approval, automatic configuration export, change webhooks, and immutable logs raise cost. If the platform does not permit fine-grained exclusions or every exception match produces an independent alert, the adversary cannot easily use the path for long under a healthy overall appearance.
    defender_model:
      paragraphs:
        - zh: >-
            防守方需要对每个策略、受信位置和关联组保存稳定 ID、版本、enabled 状态、完整 old/new 条件和排除、writer、来源、审批与到期，并解析嵌套关系得到有效作用域。登录面需要主体、设备、来源、客户端、应用/资源、认证方法、Authentication Details、逐策略 applied/not-applied 结果、最终 decision、request/correlation ID 和后续资源操作，才能证明某次例外改变了结果。
          en: >-
            Defenders need stable ID, version, enabled state, complete old and new conditions and exclusions, writer, origin, approval, and expiry for every policy, trusted location, and related group, plus resolution of nested relationships into effective scope. The sign-in plane needs principal, device, origin, client, application or resource, authentication method, Authentication Details, per-policy applied or not-applied result, final decision, request or correlation ID, and downstream resource action to prove that an exception changed an outcome.
        - zh: >-
            观察窗口应从策略变更前可信快照持续到例外删除、主体/设备退出作用域以及相关令牌和会话失效。Microsoft 说明 Conditional Access 审计默认仅保留有限时间，登录字段还可能因聚合暂时不完整；短保留或只导出当前策略会丢失恶意版本。防守方必须把合法 break-glass、服务主体和 bootstrap 作为可验证反例，而不是把所有排除视为恶意。
          en: >-
            The observation window should run from a trusted pre-change snapshot through exception removal, departure of the principal or device from scope, and expiry of related tokens and sessions. Microsoft documents limited default Conditional Access audit retention and sign-in fields that can be temporarily incomplete during aggregation. Short retention or current-state-only export loses the malicious version. Defenders must treat legitimate break-glass, service principals, and bootstrap scenarios as verifiable counterexamples rather than making every exclusion malicious.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 已启用总体策略外观包裹窄范围绕过
      en: An enabled overall policy appearance wraps a narrow scoped bypass
    analysis:
      paragraphs:
        - zh: >-
            攻击者保留强制 MFA 或风险策略的主体、名称和 enabled 状态，只改变条件或排除集合。大多数会话仍显示策略应用并完成 MFA，只有攻击者控制的主体、设备或来源得到 not-applied、单因素或等价放宽结果。恶意例外由此借用健康策略的可见特征，使只审查开关和总体覆盖率的分类无法区分，形成特征伪装。
          en: >-
            The adversary preserves the identity, name, and enabled state of an MFA-enforcing or risk policy and changes only conditions or exclusions. Most sessions still show policy application and complete MFA, while only an adversary-controlled principal, device, or origin receives not-applied, single-factor, or equivalently weakened results. The malicious exception therefore borrows the visible features of healthy policy, defeating classification based only on the switch and aggregate coverage and producing Feature Disguise.
        - zh: >-
            UNC3944 报告直接指出应查找被攻陷用户或设备排除及受信命名位置变化；Microsoft 的策略变更与登录文档提供 old/new JSON、逐策略结果和关联标识，允许恢复例外—命中—资源结果。行为和观测链有直接支持，但某一具体例外是否以匿迹为目的仍需结合未经批准 writer、异常作用域和实际使用判断，因此机理保持 medium。
          en: >-
            UNC3944 reporting directly calls for exclusions of compromised users or devices and trusted named-location changes to be examined. Microsoft policy-change and sign-in documentation supplies old and new JSON, per-policy results, and correlation identifiers that can reconstruct exception, match, and resource outcome. The behavior and observation chain are directly supported, but whether a specific exception was intended for stealth still requires an unapproved writer, anomalous scope, and actual use, so mechanism confidence remains medium.
    evidence_refs:
      - REF-000187
      - REF-000305
      - REF-000306
      - REF-000307
    confidence: medium
