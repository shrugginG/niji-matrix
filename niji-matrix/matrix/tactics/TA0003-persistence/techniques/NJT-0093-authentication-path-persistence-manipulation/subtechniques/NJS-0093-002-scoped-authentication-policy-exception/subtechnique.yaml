research:
  limitations:
    paragraphs:
      - zh: >-
          GTIG/Mandiant 直接记录 UNC3944 修改 MFA 要求，并将受信位置和对被攻陷用户/设备的 Conditional Access 排除列为调查重点；该来源证明行为模式，但没有公开每个受害者的完整策略版本、变更者和命中会话。因此子技术存在性为 high，具体事件若只有一个当前例外而无历史和使用连接，只能是策略风险状态。
        en: >-
          GTIG and Mandiant directly report UNC3944 modifying MFA requirements and identify trusted locations and Conditional Access exclusions for compromised users or devices as investigation priorities. The source establishes the behavior pattern but does not publish complete policy versions, writers, and matched sessions for every victim. Child existence is therefore high confidence, while a specific event with only one current exception and no history or use linkage remains a policy-risk state.
      - zh: >-
          合法紧急账户、服务主体、外部合作、设备注册 bootstrap、迁移和网络故障恢复都可能需要窄例外。不同身份提供商对 condition precedence、not-applied reason 和令牌重新评估的记录粒度不同；Microsoft 字段不能原样外推到其他平台。缺少 old/new、审批或逐请求结果时不得把“总体策略启用但一次无 MFA 登录”自动归入本子技术。
        en: >-
          Legitimate emergency accounts, service principals, external collaboration, device-registration bootstrap, migration, and network recovery can all require narrow exceptions. Identity providers differ in condition precedence, not-applied reason, and token-reevaluation visibility, so Microsoft fields cannot be copied unchanged to every platform. Without old and new state, approval, or request-level outcome, an enabled overall policy plus one sign-in without MFA cannot automatically be assigned to this child.
