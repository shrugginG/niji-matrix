research:
  limitations:
    paragraphs:
    - zh: Mandiant 与 CrowdStrike 提供在野方法和结果证据，但没有公开每个受害者的完整模块 hash、所有收集主体或逐事务文件关联。Microsoft 与 Linux-PAM 文档证明合法数据流能力，不证明恶意使用。不同认证系统对模块归因和秘密输出的可见性差异很大；没有结果调查时，组件差异只能形成风险状态。
      en: Mandiant and CrowdStrike provide in-the-wild method and result evidence but do not publish every victim's complete
        module hashes, all collected principals, or transaction-level file joins. Microsoft and Linux-PAM documentation establishes
        legitimate data-flow capability rather than malicious use. Authentication systems differ greatly in module attribution
        and secret-output visibility; without outcome investigation, a component difference remains a risk state.
