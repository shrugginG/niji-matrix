schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0093-003
parent_ref: NJT-0093
name:
  zh: 认证事务内秘密旁路复制
  en: In-Transaction Secret Side Copy
summary:
  zh: 攻击者把未经批准的秘密消费者嵌入受信认证链，使正常登录或密码变化在维持原结果时额外复制明文或等价认证材料。
  en: Adversaries embed an unapproved secret consumer in a trusted authentication chain so ordinary sign-in or password change
    additionally copies plaintext or equivalent authentication material while preserving the original result.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 认证事务内秘密旁路复制是攻击者注册、替换或植入一个由受信认证服务调用的过滤器、Provider、PAM、PTA 代理或等价消费者，使登录、密码设置或密码变化事务把明文、认证令牌或足以复现秘密的材料额外交给攻击者控制的输出，而原验证、同步和用户提示继续完成的匿迹子技术。直接目标是从真实认证流取得材料，不是用植入本身建立异常允许。
    en: In-Transaction Secret Side Copy registers, replaces, or implants a filter, provider, PAM, PTA agent, or equivalent
      consumer invoked by a trusted authentication service so sign-in, password-set, or password-change transactions additionally
      deliver plaintext, an authentication token, or material sufficient to reproduce the secret to an adversary-controlled
      output while original validation, synchronization, and user feedback continue. Its direct objective is material acquisition
      from real authentication flow, not anomalous allow created by the implant itself.
  - zh: 区分变量是事务的秘密接收者集合出现第二条未经批准的边，不是实现平台或输出介质。PasswordFilter 收到新明文密码、NPLogonNotify 收到成功登录使用的认证信息、PAM 模块读取缓存 token、PTA 代理处理云登录口令都可以承载同一变量。文件暂存、内存队列和直接网络发送只是输出实现，除非未来证据证明它们产生稳定且不同的防守观察边界。
    en: The distinguishing variable is a second unapproved edge in the transaction's set of secret recipients, not implementation
      platform or output medium. PasswordFilter receiving a new plaintext password, NPLogonNotify receiving authentication
      information used for successful sign-in, a PAM module reading a cached token, and a PTA agent processing a cloud sign-in
      password can carry the same variable. File staging, memory queue, and direct network transmission are output implementations
      unless future evidence establishes stable and distinct defender-observation boundaries.
stealth_characteristics:
  paragraphs:
  - zh: 认证事务内秘密旁路复制让受害者看到预期登录或密码变化结果，身份平台也可以记录普通成功、失败或同步；恶意消费者沿合法调用链运行，进程主语仍是 LSA、Winlogon/mpnotify、sshd/PAM 或身份连接器。防守方若只按进程名、成功率或传统凭据转储
      API 检测，第二接收者不会出现在决策日志中，且高价值秘密可随正常管理员登录低频到达。
    en: In-Transaction Secret Side Copy gives the victim the expected sign-in or password-change result, and the identity
      platform can record an ordinary success, failure, or synchronization. The malicious consumer runs in the legitimate
      call chain, leaving LSA, Winlogon or mpnotify, sshd or PAM, or an identity connector as the process subject. Detection
      based only on process name, success rate, or traditional credential-dumping APIs omits the second recipient from decision
      logs, and high-value secrets can arrive sparsely with normal administrator sign-ins.
  - zh: 旁路仍留下注册项、加载模块、hash/signer、服务/PAM 栈顺序、writer、进程映像与内存差异，以及认证事务附近的新文件、敏感对象写入、IPC 或网络连接。合法密码同步和凭据管理器也会接收材料，因此非批准输出、异常目的地、所有者/工单缺口和调查确认必须参与判定。真实秘密不得进入分析平台，使用对象标识与敏感分类即可证明输出。
    en: The side path still leaves registration state, loaded module, hash or signer, service or PAM stack order, writer,
      process-image or memory differences, and a new file, sensitive-object write, IPC, or network connection near an authentication
      transaction. Legitimate password synchronization and credential managers also receive material, so unapproved output,
      anomalous destination, owner or change-record gap, and investigation confirmation must participate in classification.
      Real secret values must never enter the analytic platform; object identifiers and sensitivity classification can establish
      output.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求识别受信认证链中的攻击者控制变化、一个真实登录/密码变化事务命中该变化，以及额外秘密输出或经调查确认的收集结果。只注册模块但尚无事务为 implant_present；只有事务没有第二输出为 traversed_no_material；只有文件或网络写入但不知道是否承载认证材料为
      suspicious_output。材料确认不要求记录秘密值，可以依靠受害方调查、受控 canary、文件格式或轮换范围。
    en: Inclusion requires an adversary-controlled change in a trusted authentication chain, a real sign-in or password-change
      transaction traversing the change, and an added secret output or investigation-confirmed collection result. Registration
      without a transaction is implant_present; a transaction without a second output is traversed_no_material; a file or
      network write whose authentication-material content is unknown is suspicious_output. Confirmation does not require recording
      the secret value and can rely on victim investigation, controlled canary, file format, or rotation scope.
  - zh: 用户输入在到达受信认证消费者前被网页、键盘、GUI 或任意 API hook 截获归 T1056；从既存保管库或内存存储读取秘密归 T1555/T1003；仅让错误秘密通过归 NJS-0093-001。合法 password sync、Network
      Provider、PAM、SSO 与远程支持必须有明确业务消费者、受保护目的地、最小权限、保留期和删除证据。相同植入同时旁路验证时可以并列，但一条文件写入不能证明异常允许，一次成功登录也不能证明秘密复制。
    en: Web, keyboard, GUI, or arbitrary API interception before input reaches a trusted authentication consumer belongs to
      T1056. Reading an existing vault or memory store belongs to T1555 or T1003, and merely allowing a wrong secret belongs
      to NJS-0093-001. Legitimate password synchronization, Network Provider, PAM, SSO, and remote support require an identified
      business consumer, protected destination, least privilege, retention, and deletion evidence. One implant can be co-mapped
      when it also bypasses validation, but a file write cannot prove anomalous allow and a successful sign-in cannot prove
      secret copying.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可以在 Exchange 或高登录量服务器注册恶意 Network Provider，把后续成功登录的用户名和口令写盘；也可以控制 PTA/AAD Connect 服务器或注册恶意代理，截取发送给本地验证的云登录口令。密码过滤器更偏向密码设置和变化事务，PAM
        植入可覆盖使用相应服务栈的交互登录。攻击者通常选择能看到管理员或大量主体的认证节点，并在收集后离线转移或复用材料。
      en: An adversary can register a malicious Network Provider on Exchange or another high-logon server and write usernames
        and passwords from later successful sign-ins to disk, or control a PTA or AAD Connect server or register a rogue agent
        to intercept cloud sign-in passwords sent for local validation. Password filters emphasize password-set and password-change
        transactions, while PAM implants cover interactive services using that stack. Adversaries usually choose authentication
        nodes seeing administrators or many principals and later remove or reuse the collected material.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要改变认证组件注册、服务配置、受保护文件/内存或身份代理，并理解何时可取得秘密及如何不阻塞事务。收集价值取决于后续真实认证量和目标主体；错误路径、模块签名不匹配、服务崩溃、显著明文文件和持续网络连接都会增大暴露。只拥有普通账户或只有一次已提交输入而无认证路径写权不满足本子项。
        en: The adversary needs authority to change authentication-component registration, service configuration, protected
          file or memory, or identity agent, plus knowledge of when a secret is available and how to avoid blocking the transaction.
          Collection value depends on later real authentication volume and target principals. A bad path, module-signature
          mismatch, service crash, conspicuous plaintext file, or persistent network connection raises exposure. An ordinary
          account or one submitted input without authentication-path write authority does not satisfy this child.
    defender_model:
      paragraphs:
      - zh: 防守方需要组件和配置基线、加载遥测、writer/审批、认证或密码变化事务，以及同一进程/线程/事务附近的文件、IPC 和网络输出。精确事务键不可用时可以按主机、服务、主体伪名和短窗口关联，但必须降低置信度。受控 canary
          只能在隔离账户使用且不得具备生产访问；真实秘密内容不得写入日志。主机自报完整性若被同一高权攻击者控制，需要离线度量或独立构建来源。
        en: Defenders need component and configuration baselines, load telemetry, writer and approval, authentication or password-change
          transactions, and file, IPC, and network outputs near the same process, thread, or transaction. When exact transaction
          keys are unavailable, host, service, pseudonymous principal, and a short window can be used at lower confidence.
          Controlled canaries must use isolated accounts without production access, and real secret content must never be
          logged. Host-reported integrity controlled by the same privileged adversary requires offline measurement or independent
          build provenance.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 第二秘密接收者不改变正常认证 decision
    en: A second secret recipient does not change the normal authentication decision
  analysis:
    paragraphs:
    - zh: 系统按正常顺序把凭据交给已登记消费者并返回预期结果，攻击者仅在其中加入第二输出。登录和密码变化数据描述主体、方法与 decision，却不描述每个模块如何处理秘密；旁路副本因此超出默认决策分析。Mandiant PTA Spy
        和 CrowdStrike Network Provider 事件直接证明记录口令且认证链继续运行，Microsoft API 文档证明回调可合法收到明文或认证信息。独立组件与输出谱系能够恢复差异。
      en: The system delivers credentials to registered consumers in normal order and returns the expected result while the
        adversary adds only a second output. Sign-in and password-change data describe principal, method, and decision but
        not how every module handles the secret, leaving the side copy outside default decision analytics. Mandiant PTA Spy
        and CrowdStrike Network Provider reporting directly establish password recording while the authentication chain continues,
        and Microsoft API documentation establishes that callbacks legitimately receive plaintext or authentication information.
        Independent component and output lineage can recover the difference.
