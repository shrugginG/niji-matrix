research:
  limitations:
    paragraphs:
    - zh: 旁路复制证据最强，Mandiant 与 CrowdStrike 提供在野收集结果，Microsoft/Linux 文档解释合法调用语义；但跨平台输出字段和模块归因不统一。可恢复化主要由 ATT&CK 与 Microsoft
        产品语义支持，没有完整公开事件链，因此必须保留 medium 并坚持 exposure、material-created 和 recovered 分层。
      en: 'Side-copy evidence is strongest: Mandiant and CrowdStrike provide in-the-wild collection results while Microsoft
        and Linux documentation explains legitimate callback semantics, although output fields and module attribution are
        not uniform across platforms. Recoverability relies mainly on ATT&CK and Microsoft product semantics without a complete
        public incident chain, so medium confidence and separation of exposure, material-created, and recovered must remain.'
    - zh: 认证系统通常不应记录秘密值，部分平台也不暴露调用模块、逐事务 ID 或材料形态。正式分析只能使用元数据、隔离 canary、调查确认和轮换范围；若攻击者控制构建、策略、目录与日志出口，单一视角不足。NJT-0093 改名与多战术扩展会影响既有
        Bundle 和 Web 导航，主 Agent 必须在正式写入后执行全局引用、页面和双语回归。
      en: Authentication systems generally must not log secret values, and some platforms omit invoked module, transaction
        ID, or material form. Formal analytics must use metadata, isolated canaries, investigation confirmation, and rotation
        scope. One view is insufficient when the adversary controls build, policy, directory, and log export. Renaming and
        multi-tactic extension of NJT-0093 affect existing bundles and Web navigation, so the primary agent must run global
        reference, page, and bilingual regression after canonical writes.
