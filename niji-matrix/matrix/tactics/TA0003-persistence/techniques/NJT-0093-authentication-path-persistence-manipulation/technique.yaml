schema_version: 2.0.0
type: technique
id: NJT-0093
name:
  zh: 认证路径结果与秘密操纵
  en: Authentication-Path Outcome and Secret Manipulation
summary:
  zh: 攻击者修改认证验证器、受信消费者、联合链或策略，使选定证明持续获得异常允许，或使经过认证路径的秘密被额外复制、以可恢复形式保存，同时让普通认证外观保持正常。
  en: Adversaries modify an authentication validator, trusted consumer, federation chain, or policy so selected proof continues
    to receive anomalous allow or secrets traversing the path are additionally copied or stored recoverably while ordinary
    authentication appearance remains normal.
aliases:
- Modify Authentication Process
- Authentication-Path Persistence Manipulation
classification:
  tactic_refs:
  - TA0003
  - TA0006
  - TA0112
  origin:
    kind: attack-adapted
    source_attack_id: T1556
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1556
definition_and_concept:
  paragraphs:
  - zh: 认证路径结果与秘密操纵是攻击者改变从认证输入、凭据变化或身份声明进入系统，到秘密收集、存储、验证及最终允许/拒绝之间的组件、加载模块、回调、联合代理、信任或附加策略，使以后认证产生攻击者选择的异常结果或凭据材料结果的技术。在 Persistence
      下，直接目标是建立可反复调用的异常允许入口；在 Credential Access 下，直接目标是让秘密在正常验证过程中被额外复制，或让后续凭据以攻击者可恢复的保护状态生成。
    en: Authentication-Path Outcome and Secret Manipulation changes a component, loaded module, callback, federation agent,
      trust, or additional policy between authentication input, credential change, or identity assertion and secret collection,
      storage, validation, and final allow or deny so later authentication produces an adversary-selected decision or credential-material
      result. Under Persistence, the direct objective is a repeatable anomalous allow entry. Under Credential Access, it is
      an added copy of a secret during ordinary validation or creation of later credentials in a protection state the adversary
      can recover.
  - zh: 概念锚是“认证路径的受信处理语义被持久改变”，不是 DLL、PAM、网络设备、云租户或密码介质。相同恶意 PTA 模块可以同时记录口令并授权错误口令，前者属于 TA0006 新子项，后者属于 NJS-0093-001，两项只有各自结果得到证明时才并列。只截获界面输入而未改变受信认证消费者归
      T1056；只增加账户认证器归 T1098/NJT-0083；只构造令牌或票据归 T1606/T1558；只降低安全控制而没有秘密或异常允许结果归 TA0112。
    en: The conceptual anchor is a durable change to trusted authentication-path processing semantics, not a DLL, PAM, network
      device, cloud tenant, or password medium. One malicious PTA module can both record passwords and authorize wrong passwords;
      the former belongs to a new TA0006 child and the latter to NJS-0093-001, and they are co-mapped only when each outcome
      is evidenced. Intercepting interface input without changing a trusted authentication consumer belongs to T1056, adding
      an account authenticator to T1098 and NJT-0083, constructing tokens or tickets to T1606 or T1558, and reducing a security
      control without a secret or anomalous-allow result to TA0112.
stealth_characteristics:
  paragraphs:
  - zh: 认证路径结果与秘密操纵借用合法认证事务、受信服务身份和正常成功或失败结果。旁路复制可以让原验证结果、用户提示和会话完全不变，仅由已被系统授权接触秘密的过滤器、提供者、PAM 或 PTA 代理把材料写入第二目的地；可恢复化可以让密码变化和后续登录继续成功，只在策略保护和目录材料形态上出现差异。只监控失败率、LSASS
      转储、键盘钩子、保管库 API 或新账户的防守方可能看不到秘密是在认证内部被复制或在未来变化时变得可恢复。
    en: Authentication-Path Outcome and Secret Manipulation borrows legitimate authentication transactions, trusted service
      identities, and normal success or failure outcomes. A side copy can leave validation result, user feedback, and session
      unchanged while a filter, provider, PAM, or PTA agent already authorized to handle the secret writes it to a second
      destination. Recoverability can leave password change and later sign-in successful while changing only protection policy
      and directory material form. Defenders watching failure rates, LSASS dumping, keyboard hooks, vault APIs, or new accounts
      may miss that a secret was copied inside authentication or made recoverable on a later change.
  - zh: 匿迹仍有残余。组件与配置 old/new、模块 hash 与 signer、加载顺序、注册 writer、认证事务 ID、密码变化时间、策略有效作用域、秘密输出文件或网络连接、敏感目录属性的存在与读取、以及后继轮换或使用可以恢复谱系。合法密码同步、凭据管理器、兼容性
      PAM、CHAP/Digest、灾难恢复和受控代理也会接触或保存秘密；缺少攻击者控制、非批准第二目的地或材料结果时，只能报告认证路径风险状态，不能断言凭据已取得。
    en: Residue remains in component and configuration old and new values, module hash and signer, load order, registration
      writer, authentication transaction ID, password-change time, effective policy scope, secret-output file or network connection,
      presence and reads of sensitive directory attributes, and later rotation or use. Legitimate password synchronization,
      credential managers, compatibility PAM, CHAP or Digest, disaster recovery, and controlled agents also handle or store
      secrets. Without adversary control, an unapproved second destination, or a material result, defenders can report authentication-path
      risk state but cannot assert credential acquisition.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击者持久修改认证组件、回调、提供者、联合代理、信任或保护策略，并使该差异直接产生异常允许或凭据材料结果。Credential Access 分支至少要求定位改变对象和未经批准的 writer，证明一次真实认证或密码变化命中改变后的路径，并连接秘密旁路输出、可恢复材料生成、受控恢复能力或经调查确认的暴露。模块存在、策略启用或认证成功分别只是状态、条件或后继结果。
    en: This technique includes durable adversary modification of an authentication component, callback, provider, federation
      agent, trust, or protection policy when the difference directly produces anomalous allow or a credential-material result.
      The Credential Access branch requires at minimum the changed object and unapproved writer, a real authentication or
      password change that traversed the changed path, and a joined secret side output, recoverable-material creation, controlled
      recovery capability, or investigation-confirmed exposure. Module presence, policy enablement, and authentication success
      alone are state, condition, and successor outcome respectively.
  - zh: T1056 以用户或进程正在提交的输入事件为直接对象；本技术以受信认证消费者、回调或保护语义被持久修改为直接对象。恶意网页、键盘钩子或任意 Credential API hook 即使取得同样口令，也不因材料相同进入本项；若攻击者同时注册恶意认证模块并在其中读取已提交秘密，可并列记录两项，但不得用一个结果填补另一项的组件或输入证据。T1555/NJT-0147
      负责从受管理保管库取用既存秘密，本项只负责改变认证路径而创造第二输出或未来可恢复状态。
    en: T1056 directly concerns an input event being submitted by a user or process; this technique directly concerns durable
      modification of a trusted authentication consumer, callback, or protection semantics. A malicious webpage, keylogger,
      or arbitrary Credential API hook does not enter this object merely because it obtains the same password. If an adversary
      also registers a malicious authentication module and reads a submitted secret inside it, both may be recorded, but one
      result cannot fill the other's component or input evidence. T1555 and NJT-0147 own retrieval of existing secrets from
      managed stores; this object owns only an authentication-path change that creates a second output or future recoverable
      state.
  - zh: 账户级密码、MFA 方法、密钥或设备信任增补属于 T1098/NJT-0083；联合或 Web 材料的新构造属于 T1606，Kerberos 票据的窃取或伪造属于 T1558。中心策略或认证防御被削弱但尚未产生凭据材料时归 TA0112；可逆策略变化与后续材料生成可在结果分别证明时与
      TA0112 并列。合法升级、同步、兼容性和恢复必须具有 owner、批准、最小作用域、预期寿命、受保护输出和回滚记录。
    en: Account-level password, MFA method, key, or device-trust augmentation belongs to T1098 and NJT-0083. New federation
      or web-material construction belongs to T1606, and Kerberos ticket theft or forgery to T1558. Central policy or authentication-defense
      weakening without credential material belongs to TA0112; a reversible-policy change and later material creation can
      be co-mapped when each outcome is independently shown. Legitimate upgrade, synchronization, compatibility, and recovery
      require an owner, approval, minimum scope, intended lifetime, protected output, and rollback record.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在取得域控制器、身份连接器、VPN/网络设备、本地认证服务或策略管理权限后，可以注册接收明文口令变化的过滤器或网络提供者，在 PAM 或 PTA 链中加入额外消费者，或把秘密保护策略改为可逆。其后不需要主动诱导大量失败；管理员、服务或高价值用户的正常登录和密码变化即可把材料交给恶意路径。Mandiant
        的 PTA Spy 分析和 CrowdStrike 的 Network Provider 入侵均直接展示认证正常进行时的口令收集。
      en: After gaining authority over a domain controller, identity connector, VPN or network device, local authentication
        service, or policy plane, an adversary can register a filter or network provider that receives plaintext password
        changes, add another consumer to PAM or PTA, or make secret-protection policy reversible. The adversary need not generate
        many failures afterward; ordinary sign-ins and password changes by administrators, services, or high-value users deliver
        material to the malicious path. Mandiant's PTA Spy analysis and CrowdStrike's Network Provider intrusions directly
        demonstrate password collection while authentication proceeds normally.
    - zh: 可恢复化适合能够改变域或账户密码策略、但无法立即取得现有明文的操作者。策略生效后只有新设或变化的凭据进入较弱形态，攻击者需要等待目标轮换、恢复或创建，再读取所需目录与 LSA 材料并恢复秘密。该时间链必须分级记录；只启用策略是暴露，密码变化后出现可恢复材料才是材料结果，实际解密与使用是更高证据阶段。
      en: 'Recoverability suits an operator able to change domain or account password policy but unable to obtain current
        plaintext immediately. Only credentials created or changed after the policy becomes effective enter the weaker form,
        so the adversary waits for rotation, recovery, or account creation, then reads the needed directory and LSA material
        and recovers the secret. This timeline must be tiered: policy enablement is exposure, creation of recoverable material
        after a password change is a material result, and actual decryption and use are stronger later stages.'
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 旁路复制要求攻击者具有注册、替换或加载认证模块/提供者/代理的管理员权限，理解调用顺序、秘密对象寿命、进程保护和失败处理，并能选择不会破坏正常认证的第二输出。为了获得有价值材料，植入还必须留存到目标实际登录或更改密码；签名限制、受保护进程、只读系统面、独立构建、最小化认证插件和隔离身份连接器会提高成本。错误模块、阻塞回调、明文文件权限过宽或异常出站连接会暴露行动。
        en: Side-copy behavior requires administrative authority to register, replace, or load an authentication module, provider,
          or agent; knowledge of call order, secret-object lifetime, process protection, and failure handling; and a second
          output that does not disrupt ordinary authentication. The implant must remain until a valuable principal signs in
          or changes a password. Signing restrictions, protected processes, read-only system surfaces, independent builds,
          minimized authentication plug-ins, and isolated identity connectors raise cost. A faulty module, blocking callback,
          broadly readable plaintext file, or anomalous outbound connection exposes the operation.
      - zh: 未来可恢复化要求策略写权、对生效与继承作用域的理解、等待凭据变化的时间容忍度，以及随后读取目录秘密与恢复材料的能力。单纯打开开关不会改变既有密码；攻击者还需让新值写入并取得足够恢复组件。强制禁用可逆存储、细粒度策略审计、密码变化后的保护状态验证、目录属性访问限制和立即轮换受影响凭据会破坏链条。
        en: Future recoverability requires policy-write authority, understanding of effective and inherited scope, patience
          for a later credential change, and the ability to read directory secrets and recovery material afterward. Merely
          enabling a switch does not change existing passwords; the adversary must also cause or await a new value and obtain
          sufficient recovery components. Enforced prohibition of reversible storage, fine-grained policy audit, protection-state
          verification after password changes, restricted directory-attribute access, and immediate rotation of affected credentials
          break the chain.
    defender_model:
      paragraphs:
      - zh: 防守方需要独立保存认证组件和配置版本、注册与加载来源、signer/hash、writer 和批准，并把它们与认证或密码变化事务、调用组件链、结果、进程/线程、文件/网络输出和后继使用连接。不得采集真实秘密值；可使用事务
          ID、主体伪名、模块 ID、输出对象 ID、字节量、敏感分类和调查确认。只有组件差异与真实事务及非批准输出三者连接时，才能从植入风险提高为旁路复制。
        en: Defenders need independent versions of authentication components and configuration, registration and load provenance,
          signer or hash, writer, and approval, joined to authentication or password-change transaction, invoked component
          chain, outcome, process or thread, file or network output, and later use. Real secret values must not be collected;
          transaction ID, pseudonymous principal, module ID, output-object ID, byte count, sensitivity classification, and
          investigation confirmation are sufficient. Only a component difference joined to a real transaction and an unapproved
          output can elevate implant risk to side copy.
      - zh: 对保护策略，防守方需要 old/new、有效作用域、优先级、writer、审批和生效时间，以及每次密码设置/变化、受影响主体、材料形态指示、敏感属性读取、复制调用和轮换结果。观察窗口从最后可信策略开始，持续到弱化状态撤销且期间所有受影响凭据重新安全设置。只保留当前策略、没有密码变化键或让同一管理员控制策略、目录和日志出口都会削弱结论。
        en: For protection policy, defenders need old and new state, effective scope, precedence, writer, approval, and effective
          time, plus every password set or change, affected principal, material-form indicator, sensitive-attribute read,
          replication call, and rotation outcome. The observation window begins with the last trusted policy and continues
          until the weak state is removed and every affected credential is safely reset. Current-state-only retention, absence
          of password-change keys, or allowing one administrator to control policy, directory, and log export weakens the
          conclusion.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 受信认证事务完成时秘密副本落在正常结果日志之外
    en: Secret copies created by trusted authentication transactions fall outside normal outcome logs
  analysis:
    paragraphs:
    - zh: 攻击者把秘密消费者嵌入已被系统授权处理口令的过滤器、Provider、PAM 或 PTA 代理，认证请求仍由熟悉服务完成并返回预期结果；额外文件写入、内存复制或网络输出不属于标准登录 decision。Mandiant 记录
        PTA Spy 截获并保存每次口令尝试，CrowdStrike 观察恶意 Network Provider 把用户名和口令写盘，而常见凭据检测重点仍是 LSASS/SAM 转储。关键获取行为因而没有进入只解释登录结果或传统转储的默认逻辑，形成行为透明。
      en: The adversary embeds a secret consumer in a filter, provider, PAM, or PTA agent already authorized to process passwords.
        A familiar service completes the authentication request and returns its expected outcome, while an added file write,
        memory copy, or network output is absent from standard sign-in decisions. Mandiant documented PTA Spy intercepting
        and storing each password attempt, and CrowdStrike observed malicious Network Providers writing usernames and passwords
        to disk while common credential detection focused on LSASS or SAM dumping. The decisive acquisition behavior therefore
        falls outside logic that interprets only login outcomes or traditional dumping, producing Behavioral Transparency.
  confidence: high
  evidence_refs:
  - REF-000741
  - REF-000742
  - REF-000743
  - REF-000744
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 正常认证与合法兼容策略外观包裹秘密保护差异
    en: Normal authentication and legitimate compatibility policy appearance wrap secret-protection differences
  analysis:
    paragraphs:
    - zh: 恶意认证消费者使用受信服务、正常回调和已登记模块身份，可与密码同步、网络凭据管理或合法 PAM 共享特征；可逆存储又可表现为一个有效且为旧协议保留的策略。用户密码变化和登录均可成功，粗粒度审查难以仅凭服务名称、策略存在或成功结果区分恶意秘密路径。模块签名/来源、批准目的、输出保护、策略
        old/new、受影响主体和材料读取仍能恢复差异，因此伪装并非无痕。
      en: A malicious authentication consumer uses a trusted service, normal callback, and registered-module identity and
        can share features with password synchronization, network credential management, or legitimate PAM. Reversible storage
        can also appear as a valid policy retained for a legacy protocol. Password changes and sign-ins can succeed, so coarse
        review cannot distinguish the malicious secret path from service name, policy presence, or success alone. Module signature
        and provenance, approved purpose, output protection, policy old and new state, affected principal, and material reads
        can still recover the difference, so the disguise is not trace-free.
  confidence: medium
  evidence_refs:
  - REF-000743
  - REF-000744
  - REF-000746
  - REF-000747
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 扩展后的父级形成三项正式 Niji 子技术。既有“选择性后门秘密接受”改变选定证明的最终 decision，“范围化认证策略例外”改变选定情境的策略 decision；新增“认证事务内秘密旁路复制”保持原 decision
        却增加未经批准的秘密接收者。三项分别要求输入—结果差分、策略作用域—结果差分和事务—第二输出谱系，检测与恢复动作不可互换。
      en: The extended parent has three formal Niji children. Existing Selective Backdoor-Secret Acceptance changes the final
        decision for selected proof, Scoped Authentication-Policy Exception changes the policy decision for selected context,
        and new In-Transaction Secret Side Copy preserves the original decision while adding an unapproved secret recipient.
        The three require input-to-outcome differential, policy-scope-to-outcome differential, and transaction-to-second-output
        lineage respectively, with non-interchangeable detection and recovery.
    - zh: DLL、PAM、PTA、Network Provider、网络设备、云或本地环境是实现载体，不构成兄弟边界。密码过滤器、Provider、PAM 与混合身份代理只有在旁路秘密结果可证时进入 NJS-0093-003；模块同时记录口令并异常允许时可并列现有子项，但必须分别证明输出和
        decision。策略诱导的未来秘密可恢复化因缺少同一在野事件的策略变化、密码变化、材料生成与恢复完整链，本轮暂缓；输入界面捕获、令牌/票据构造、账户认证器增补和纯防御削弱继续由相邻技术拥有。
      en: DLL, PAM, PTA, Network Provider, network device, cloud, and on-premises environment are implementation carriers
        rather than sibling boundaries. Password filters, providers, PAM, and hybrid-identity agents enter NJS-0093-003 only
        when a side secret result is evidenced. A module that both records a password and anomalously allows access can map
        to an existing child only with separate proof of output and decision. Policy-Induced Future-Secret Recoverability
        is deferred because no single in-the-wild chain establishes policy change, password change, material creation, and
        recovery. Interface input capture, token or ticket construction, account-authenticator augmentation, and defense impairment
        remain with adjacent techniques.
  coverage: established
  subtechnique_refs:
  - NJS-0093-001
  - NJS-0093-002
  - NJS-0093-003
