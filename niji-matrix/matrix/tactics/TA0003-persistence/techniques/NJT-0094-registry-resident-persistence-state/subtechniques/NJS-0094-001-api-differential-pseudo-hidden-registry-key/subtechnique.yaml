schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0094-001
parent_ref: NJT-0094
name:
  zh: API 差分伪隐藏注册表键
  en: API-Differential Pseudo-Hidden Registry Key
summary:
  zh: 攻击者利用 kernel 带长度名称与 Win32 null 结尾字符串语义差，创建 raw/native 状态存在并可消费、但标准工具遗漏或误呈现的持久 Registry 对象。
  en: Adversaries exploit kernel counted-name versus Win32 null-terminated-string semantics to create a persistent Registry object that exists and remains consumable in raw or native state but is omitted or misrepresented by standard tools.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: >-
        API 差分伪隐藏注册表键是攻击者用 native 接口或能够传入带长度对象名的代码创建包含嵌入式 null 的 Registry key/value，使 kernel 与 raw hive 保存完整对象，兼容 consumer 仍能读取，而 Regedit、reg query 或依赖常用 Win32 wrapper 的盘点无法正常打开、显示或删除的匿迹子技术。其直接目标是在不删除持久状态的情况下，使默认观察把对象当作缺失、截断或普通默认值。
      en: >-
        API-Differential Pseudo-Hidden Registry Key is an evasion sub-technique in which an adversary uses a native interface or code able to pass a counted object name to create a Registry key or value containing an embedded null. The kernel and raw hive retain the complete object and a compatible consumer can still read it, while Regedit, reg query, or inventory relying on common Win32 wrappers cannot correctly open, display, or delete it. Its direct objective is to make default observation treat persistent state as absent, truncated, or an ordinary default value without deleting it.
    - zh: >-
        子技术边界来自同一对象的“等价权限视图差”，不是“隐藏”这一形容词。Sysinternals 解释 kernel 使用 counted string 而 Windows API 使用 null-terminated string；CrowdStrike 观察 Kovter 值名在 Regedit、reg query 与 Autoruns 中表现不同。null 所在路径、hive、值类型、载荷和创建工具只是实现细节，稳定变量是完整 native 名称及内容与标准视图结果不一致。
      en: >-
        The child boundary comes from an equivalent-privilege view difference for the same object rather than the adjective hidden. Sysinternals explains that the kernel uses a counted string while the Windows API uses a null-terminated string, and CrowdStrike observed a Kovter value name represented differently by Regedit, reg query, and Autoruns. The null location, hive, value type, payload, and creation tool are implementation details; the stable variable is inconsistency between the complete native name and content and the standard-view result.
stealth_characteristics:
  paragraphs:
    - zh: >-
        API 差分伪隐藏注册表键使标准查询出现错误、名称在 null 处截断、value 被当作默认项或对象完全遗漏；自动化若把“查询成功返回的集合”视为全集，目标状态就不会进入比较与告警。Kovter 能让后继 Run/file-association consumer 继续得到命令，而调查者在常用工具中看到不可读或不同结果，因此状态可用性与防守可见性被有意分离。
      en: >-
        API-Differential Pseudo-Hidden Registry Key makes a standard query error, truncate the name at the null, represent a value as default, or omit the object entirely. If automation treats successful-query output as the complete set, target state never enters comparison or alerting. Kovter can leave a later Run or file-association consumer able to obtain its command while investigators receive an unreadable or different result in common tools, intentionally separating state usability from defender visibility.
    - zh: >-
        对象仍然留下 raw hive cell、事务/写入事件、原始名称长度和字节、ACL、last-write、native enumeration、专用工具输出、consumer read 及后继进程。RootkitRevealer 类 API/raw 差分和 RegDelNull 类专用枚举可以恢复；但在线扫描中的正常值变化、不同权限、未装载用户 hive 或 parser 版本错误会产生伪差异。只有同一快照、等价权限和 consumer 连接才能保持高置信。
      en: >-
        The object still leaves a raw hive cell, transaction or write event, raw name length and bytes, ACL, last-write time, native enumeration, specialized-tool output, consumer read, and downstream process. RootkitRevealer-style API versus raw differential and RegDelNull-style specialized enumeration can recover it. Normal value change during a live scan, different privileges, an unloaded user hive, or a parser-version error can create false discrepancies. High confidence requires the same snapshot, equivalent privilege, and consumer linkage.
scope_boundary_definition:
  paragraphs:
    - zh: >-
        本子技术纳入同一 Registry key/value 在 kernel/native 或 raw hive 中完整存在并可被以后 consumer 使用，却在相同时间与等价权限的标准 Win32 视图中稳定报错、截断或不可得的行为。判定需要原始名称证据、至少两个视图的可比较结果、攻击者控制写入和跨原会话的消费；仅有特殊字符或不可打印内容而无视图差不足。
      en: >-
        This child includes one Registry key or value that fully exists and remains usable by a later consumer in kernel, native, or raw-hive state but consistently errors, truncates, or is unavailable in a standard Win32 view at the same time and equivalent privilege. Classification requires raw-name evidence, comparable results from at least two views, adversary-controlled writing, and consumption beyond the original session. A special character or unprintable content without a view difference is insufficient.
    - zh: >-
        ACL 拒绝、Registry virtualization、WOW64 32/64 位视图、损坏 hive、传感器故障和查询工具 bug 都可能导致缺失，但没有相同 null/counted-string 因果时不属于本子项。随机名称或冷僻路径是一般拟态/发现难度，编码 payload 归内容遮蔽；普通 Run 键属于父技术与 NJT-0084 的并列语义。合法 RegHide 测试也必须作为强反例。
      en: >-
        ACL denial, Registry virtualization, WOW64 32- and 64-bit views, hive corruption, sensor failure, and query-tool bugs can all cause absence but are outside this child without the same null or counted-string causality. A random name or obscure path is generic discovery difficulty, an encoded payload belongs to content obscuration, and an ordinary Run key carries parallel parent and NJT-0084 semantics. Legitimate RegHide testing is also a strong counterexample.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: >-
          攻击者在取得用户或系统 hive 写权限后，用 native 调用创建含 null 的 key/value，把启动命令、file-association handler、脚本或载荷引用放入其中，并配置兼容 consumer 在以后登录、启动或文件处理时读取。Kovter 场景中，常规 Registry 工具不能正确呈现 value 名与数据，但 Autoruns 或装载的用户 hive 可恢复关联，说明攻击者利用的是调查视图差而不是状态不存在。
        en: >-
          After obtaining write authority over a user or system hive, an adversary uses a native call to create a null-bearing key or value, stores a startup command, file-association handler, script, or payload reference, and configures a compatible consumer to read it at later sign-in, startup, or file handling. In Kovter, routine Registry tools cannot correctly represent the value name and data, while Autoruns or a loaded user hive can recover the relationship, showing exploitation of an investigation-view difference rather than absence of state.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: >-
            攻击者需要足以创建目标 key/value 的权限、native Registry 或对象管理器编程能力、对名称长度和编码语义的准确控制，以及能够以后定位完整对象名的 consumer。还必须验证 consumer 不会像调查工具一样在 null 处截断，并保持用户 hive、Run/file-association 或其他触发状态存续。错误字节、API 包装层或系统更新可能让对象不可访问并暴露失败。
          en: >-
            The adversary needs permission to create the target key or value, native Registry or object-manager programming capability, precise control of name length and encoding semantics, and a consumer able to locate the complete object name later. The adversary must verify that the consumer does not truncate at the null as an investigation tool does and keep the user hive, Run or file-association, or other trigger state available. A wrong byte, API wrapper, or system update can make the object inaccessible and expose the failure.
        - zh: >-
            攻击者的成本随跨视图采集而增加。Sysmon/ETW 类写入事件可能在对象创建时记录 writer 和目标，raw hive 或专用工具可离线发现；为了维持隐蔽，攻击者还要避免触发查询错误告警、应用故障或专用 rootkit 扫描。若只能改变 ACL 而不能制造等价权限 API 差，本子技术不成立。
          en: >-
            Adversary cost rises under cross-view collection. Sysmon or ETW-like write events can record writer and target when the object is created, while raw-hive or specialized tools can find it offline. To maintain stealth, the adversary must also avoid query-error alerts, application failure, and specialized rootkit scanning. If the adversary can change only ACLs and cannot create an equivalent-privilege API differential, this child does not hold.
    defender_model:
      paragraphs:
        - zh: >-
            防守方需要同时保留 Registry 写入事件、原始 hive 或 native 枚举和标准 Win32 查询结果。每条视图记录应包含采集时间、设备/hive、逻辑 key identity、原始路径长度与字节、query API、读取主体、visible 状态、error code、ACL 和值 hash；writer 侧保留进程、用户、operation 与结果，consumer 侧保留读取或启动/进程结果。
          en: >-
            Defenders need Registry write events, raw-hive or native enumeration, and standard Win32 query results together. Each view record should include acquisition time, device and hive, logical key identity, raw path length and bytes, query API, reading principal, visibility state, error code, ACL, and value hash. The writer side retains process, user, operation, and result, while the consumer side retains a read or startup or process outcome.
        - zh: >-
            API 与 raw 视图必须来自同一快照或冻结点并使用等价权限，否则状态竞争和 ACL 会制造假差异。查询错误不能静默跳过，应作为独立信号并触发专用枚举；删除前需要装载所有相关用户 hive、保全事务并确认 consumer 依赖。缺少读取遥测时可以用启动项、file association 和后继进程替代，但只能形成间接连接。
          en: >-
            API and raw views must derive from the same snapshot or freeze point and use equivalent privilege, or state races and ACLs create false differences. Query errors must not be silently skipped and should trigger specialized enumeration. Before removal, defenders need to load every relevant user hive, preserve transactions, and identify consumer dependencies. When read telemetry is absent, startup entries, file associations, and downstream processes can substitute but provide only indirect linkage.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 标准查询遗漏仍被 consumer 使用的 native Registry 状态
      en: Standard queries omit native Registry state that a consumer still uses
    analysis:
      paragraphs:
        - zh: >-
            攻击者把 null 置入带长度对象名，kernel 和兼容 consumer 按完整长度处理，Win32 wrapper 却在 null 处终止或报错。默认盘点没有返回真实 key/value，后续规则也就无法比较内容、owner 与批准；实际 consumer 仍从 hive 取得命令或载荷，关键行为落在有效观察范围之外，形成行为透明。
          en: >-
            The adversary places a null in a counted object name. The kernel and compatible consumer process the full length, while a Win32 wrapper terminates at the null or errors. Default inventory does not return the real key or value, so downstream rules cannot compare content, owner, and approval. The actual consumer still retrieves a command or payload from the hive, leaving critical behavior outside effective observation and producing Behavioral Transparency.
        - zh: >-
            Sysinternals 的字符串语义说明与 RegHide/RegDelNull、CrowdStrike 对 Kovter 的跨工具结果共同提供直接支持。raw hive/native 枚举、原始名称字节、写入事务和 consumer 结果可以恢复完整链；在线差分的状态竞争和专用工具版本限制仍需控制。由于行为、观察断点与实际恶意消费均有直接证据，本子项机理为 high，但每个新样本仍需验证同一因果。
          en: >-
            Sysinternals' string-semantic explanation and RegHide or RegDelNull plus CrowdStrike's cross-tool Kovter results provide direct support. Raw-hive or native enumeration, raw name bytes, write transactions, and consumer outcomes can recover the complete chain, while live-differential state races and specialized-tool version limits still require control. Because behavior, observation break, and actual malicious consumption all have direct evidence, child mechanism confidence is high, but every new sample still requires validation of the same causality.
    evidence_refs:
      - REF-000188
      - REF-000308
      - REF-000309
      - REF-000310
    confidence: high
