research:
  limitations:
    paragraphs:
      - zh: >-
          Sysinternals 直接解释 embedded-null key 的 API/kernel 差，并提供 RegHide 示例与 RegDelNull 清除；CrowdStrike 直接观察 Kovter 的 null/unreadable value、跨工具不同呈现和 Registry 持久链。这些来源支持本变量为 high，但不证明所有不可读、默认值或查询错误都由 null 引起。每个事件仍需原始名称和跨视图复现。
        en: >-
          Sysinternals directly explains the API versus kernel difference for embedded-null keys and provides the RegHide example and RegDelNull removal, while CrowdStrike directly observes a Kovter null or unreadable value, different tool representations, and Registry persistence lineage. These sources support high confidence in the variable but do not make every unreadable value, default value, or query error null-caused. Each event still needs a raw name and reproduced cross-view difference.
      - zh: >-
          Windows、Registry 工具和 raw parser 版本会改变可见性与清除行为；在线扫描期间值变化会制造 RootkitRevealer 型竞争差异，用户 hive 未装载会制造不完整结果，删除带 null 的 key 还可能破坏关联应用。没有等价权限、同一快照与 consumer 结果时应降为 view anomaly；没有持续消费时不属于 Persistence。
        en: >-
          Windows, Registry-tool, and raw-parser versions can change visibility and removal behavior. Values changing during live scans can create RootkitRevealer-style race discrepancies, unloaded user hives create incomplete results, and deleting a null-bearing key can break an associated application. Without equivalent privilege, the same snapshot, and a consumer outcome, the finding should be downgraded to view anomaly. Without continuing consumption, it does not belong to Persistence.
