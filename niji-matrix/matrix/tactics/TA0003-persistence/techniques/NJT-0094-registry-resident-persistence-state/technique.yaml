research:
  limitations:
    paragraphs:
      - zh: >-
          证据层级必须区分。FIN7 直接证明 Registry payload 被启动 loader 消费并形成进程结果，但没有 null/API 差分，只支持父级；Kovter 和 Sysinternals 直接支持 null/unreadable 名称、跨工具差异和专用清除，支持子项。ATT&CK 汇总还包含大量只证明 Registry 修改的过程，不自动证明状态跨会话消费或攻击者利用视图差匿迹。
        en: >-
          Evidence levels must remain separate. FIN7 directly establishes a Registry payload consumed by a startup loader to produce a process outcome but contains no null or API differential and supports only the parent. Kovter and Sysinternals directly support null or unreadable names, cross-tool differences, and specialized removal and support the child. ATT&CK also aggregates many procedures proving only Registry modification and does not automatically establish cross-session consumption or adversary use of a view differential for stealth.
      - zh: >-
          kernel、Win32 工具、Sysmon 和 raw parser 的行为随 Windows 与工具版本变化；并非所有 consumer 都能重新打开含 null 对象。在线两次扫描会受到值变化竞争，离线 hive 采集与专用清除又可能影响业务或遗漏未装载用户 hive。具体事件必须验证同一快照、等价权限、原始名称和 consumer 结果；未知键或查询错误本身只能维持异常结论。
        en: >-
          Kernel, Win32 tool, Sysmon, and raw-parser behavior changes across Windows and tool versions, and not every consumer can reopen a null-bearing object. Two live serial scans are exposed to value-change races, while offline hive acquisition and specialized removal can affect business or miss unloaded user hives. A specific event must validate the same snapshot, equivalent privilege, raw name, and consumer outcome. An unknown key or query error alone remains only an anomaly.
