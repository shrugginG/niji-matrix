schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0095-001
parent_ref: NJT-0095
name:
  zh: 预受信 Office 启动面寄生
  en: Pretrusted Office Startup-Surface Parasitism
summary:
  zh: 攻击者把模板、add-in 或 hook 植入 Office 已自动加载或绕过部分保护的启动/信任面。
  en: Adversaries implant a template add-in or hook on an Office startup or trust surface already loaded automatically or bypassing some protections.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 预受信 Office 启动面寄生是攻击者把恶意模板、macro、add-in manifest/binary 或启动 hook 放入 Office startup/trusted location、默认模板或已批准扩展位置，使 Office 自动加载并赋予正常宿主上下文的匿迹子技术。直接目标是借用既有信任决策恢复代码。
    en: Pretrusted Office Startup-Surface Parasitism places a malicious template, macro, add-in manifest or binary, or startup hook in an Office
      startup or trusted location, default template, or approved extension location so Office loads it automatically under normal host context.
      Its direct objective is to borrow an established trust decision to restore code.
stealth_characteristics:
  paragraphs:
  - zh: 预受信 Office 启动面寄生使内容从用户/管理员熟悉位置进入 WINWORD、EXCEL 或 OUTLOOK，且 trusted location 可能跳过 Protected View、Application Guard、File Block 与提示。扩展文件/manifest/hash、位置
      ACL、writer、Office load 和子进程仍可观察；位置本身不能证明合法。
    en: Pretrusted Office Startup-Surface Parasitism brings content from a user or administrator-familiar location into WINWORD, EXCEL, or OUTLOOK,
      and a trusted location may skip Protected View, Application Guard, File Block, and prompts. Extension file or manifest hash, location ACL,
      writer, Office load, and child process remain observable; location does not prove legitimacy.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制内容实际位于 Office 自动加载/信任面且以后由 Office 消费。一般用户打开外部文档、仅新增 trusted location 而无恶意内容、Outlook 事件谓词或 DLL 搜索劫持分别排除或归邻接技术。
    en: Include adversary-controlled content actually placed on an Office automatic-load or trust surface and later consumed by Office. Ordinary
      opening of an external document, adding a trusted location without malicious content, an Outlook event predicate, or DLL search hijacking
      is excluded or belongs to an adjacent technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得用户或系统 Office startup/trusted location、模板、add-in manifest、Office Test hook 或等价扩展面的写权限后，放入恶意内容并等待用户正常启动 Word、Excel、Outlook 或加载相关模板。宿主从已认可位置自动消费扩展，恶意逻辑在正常
        Office 进程和业务会话中恢复。
      en: After obtaining write authority over a user or system Office startup or trusted location, template, add-in manifest, Office Test hook,
        or equivalent extension surface, an adversary places malicious content and waits for the user to start Word, Excel, or Outlook or load
        the related template normally. The host automatically consumes the extension from a recognized location and restores malicious logic inside
        a normal Office process and business session.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要写入扩展文件/manifest/Registry 或邮箱配置的权限，知道 Office 版本、bitness、Trust Center/宏策略、加载顺序和用户实际启动习惯，并保持 add-in/模板格式兼容。要借用预受信面，内容必须落入确实绕过或弱化提示的批准位置；错误扩展会触发禁用、修复模式、签名或加载错误。
        en: The adversary needs write authority over extension files, manifests, Registry, or mailbox configuration; knowledge of Office version,
          bitness, Trust Center or macro policy, load order, and actual user startup habits; and a compatible add-in or template format. To borrow
          a pretrusted surface, content must occupy a location that actually bypasses or weakens prompts. A bad extension triggers disablement,
          repair mode, signature, or load errors.
      - zh: 受控 trusted locations、签名/发布者要求、禁用遗留扩展、最小用户写权、ASR 和 add-in governance 提高成本。攻击者还要避免破坏原模板/业务 add-in，承受 Office 更新或安全策略覆盖状态，并等待用户启动；使用一次性文档诱导而无持久扩展不属于本子项。
        en: Controlled trusted locations, signer or publisher requirements, removal of legacy extensions, least user write authority, ASR, and
          add-in governance raise cost. The adversary must avoid breaking the original template or business add-in, tolerate Office update or
          security policy overwriting state, and wait for user startup. A one-time lured document with no durable extension is outside this child.
    defender_model:
      paragraphs:
      - zh: 防守方需要按用户/设备版本化 Office template/startup/trusted location、add-in/manifest、Office Test/Registry 与 Outlook 扩展 inventory，保存 owner、writer、hash/signature、来源、批准和
          Trust Center/策略状态；执行侧连接 Office load、模块/宏/add-in 身份、子进程、脚本和网络结果。
        en: Defenders need versioned Office template, startup or trusted location, add-in or manifest, Office Test or Registry, and Outlook-extension
          inventory by user and device with owner, writer, hash or signature, origin, approval, and Trust Center or policy state. The execution
          side joins Office load, module, macro or add-in identity, child process, script, and network outcome.
      - zh: Office 父进程和 trusted location 不能永久白名单；合法财务 add-in、企业模板、自动化和更新会产生相同加载。没有 writer/版本和实际 load-result 时只能报告未知扩展。部分 in-process 宏或 add-in
          不创建子进程，邮箱/用户配置和离线设备也会让 inventory 不完整。
        en: Office parent processes and trusted locations cannot be permanently allowlisted. Legitimate financial add-ins, enterprise templates,
          automation, and updates produce the same load. Without writer or version and actual load outcome, only an unknown extension can be reported.
          Some in-process macros or add-ins create no child process, and mailbox or user configuration plus offline devices can make inventory
          incomplete.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: Office 既有信任与宿主外观掩护恶意扩展
    en: Established Office trust and host appearance disguise a malicious extension
  analysis:
    paragraphs:
    - zh: Office 按既有规则从受信面加载内容，父进程、位置和用户工作流保持正常，恶意扩展借用合法特征形成特征伪装；内容完整性和来源仍可识别。
      en: Office loads content from a trusted surface under established rules, keeping parent process location and user workflow normal so the
        malicious extension borrows legitimate features and produces Feature Disguise; content integrity and provenance remain distinguishing
        evidence.
