research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接支持六类 Office 持久扩展，Microsoft 直接说明 trusted locations 绕过多项保护；并非所有模板、add-in、form、rule 或 homepage 都位于预受信面，因此只有实际借用已认可位置/身份者进入本子项，其余保留父级或邻接事件技术。
      en: ATT&CK directly supports six Office persistence extension classes and Microsoft directly states that trusted locations bypass multiple
        protections. Not every template, add-in, form, rule, or homepage occupies a pretrusted surface, so only an object actually borrowing a
        recognized location or identity enters this child; others remain parent behavior or an adjacent event technique.
    - zh: 合法企业扩展与模板高度常见，签名也可能来自被攻陷发布流程。具体结论需要 owner、批准、内容/manifest 差、writer 和 Office consumer 结果；只有路径或 Office 子进程不能证明寄生。不同 Office 版本与云/本地配置的可见性不能机械外推。
      en: Legitimate enterprise extensions and templates are common and a signature can come from a compromised release process. A specific conclusion
        needs owner, approval, content or manifest difference, writer, and Office consumer outcome. A path or Office child process alone cannot
        establish parasitism, and visibility across Office versions and cloud or local configuration cannot be generalized mechanically.
