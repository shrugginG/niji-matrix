schema_version: 2.0.0
type: technique
id: NJT-0095
name:
  zh: Office 启动扩展持久化
  en: Office Startup-Extension Persistence
summary:
  zh: 攻击者植入 Office/Outlook 自动加载的扩展状态，并可借用预受信启动面在正常 Office 宿主中执行。
  en: Adversaries implant extension state automatically loaded by Office or Outlook and can borrow a pretrusted startup surface
    to execute inside a normal Office host.
aliases:
- Office Application Startup
classification:
  tactic_refs:
  - TA0003
  origin:
    kind: attack-adapted
    source_attack_id: T1137
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1137
definition_and_concept:
  paragraphs:
  - zh: Office 启动扩展持久化是攻击者创建或修改 Microsoft Office/Outlook 会在应用启动、文档/模板加载或持久应用事件中读取的模板宏、add-in、Office Test hook、form、rule、homepage
      或等价扩展状态，使用户以后正常打开 Office 或处理事件时恢复攻击者代码。直接目标是把持久执行嵌入高频业务应用的扩展生命周期。
    en: Office Startup-Extension Persistence creates or modifies template macros, add-ins, Office Test hooks, forms, rules,
      home pages, or equivalent extension state that Microsoft Office or Outlook reads at application start, document or template
      load, or a durable application event so later normal Office use restores adversary code. Its direct objective is to
      embed persistent execution in the extension lifecycle of a common business application.
  - zh: 概念锚是 Office 认可的持久扩展配置/内容及其到宿主执行的谱系，而不是 Registry、文件类型或某个 Office 产品。通用事件谓词归 NJT-0090，库/COM 加载重定向归 T1574；只有 Office 扩展对象的存续和自动消费属于本技术。
    en: The conceptual anchor is Office-recognized durable extension configuration or content and its lineage to host execution
      rather than Registry, file type, or a particular Office product. General event predicates belong to NJT-0090 and library
      or COM load redirection to T1574. Only survival and automatic consumption of an Office extension object belong here.
stealth_characteristics:
  paragraphs:
  - zh: Office 本来会从模板、startup/trusted location、add-in manifest、Outlook 配置和 Registry hook 加载扩展；攻击者可使恶意内容在 WINWORD/EXCEL/OUTLOOK
      等正常父进程、用户会话和文档工作流中运行。若内容位于预受信位置，可能绕过 Protected View、File Block、Application Guard 或宏提示，基于父进程和位置的粗粒度检测难以区分。
    en: Office normally loads extensions from templates, startup or trusted locations, add-in manifests, Outlook configuration,
      and Registry hooks. An adversary can have malicious content run inside normal WINWORD, EXCEL, or OUTLOOK parents, user
      sessions, and document workflows. Content in a pretrusted location may bypass Protected View, File Block, Application
      Guard, or macro prompts, defeating coarse detection based on parent process and location.
  - zh: 扩展 inventory、文件/manifest/hash、签名、Trust Center/策略状态、writer、Office load event、宏/add-in 身份、子进程和网络结果仍可观察。合法模板、财务 add-in、Outlook
      自动化和企业 trusted locations 很常见；无 owner/批准或内容差异时不能定性。
    en: Extension inventory, file or manifest hash, signature, Trust Center or policy state, writer, Office load event, macro
      or add-in identity, child process, and network outcome remain observable. Legitimate templates, finance add-ins, Outlook
      automation, and enterprise trusted locations are common. No conclusion is justified without a missing owner or approval
      or content difference.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制的 Office 持久扩展状态在以后应用启动或 Office 事件中被自动加载并产生执行。要求可定位扩展对象、writer、Office consumer 和结果。应用、扩展类型、Registry/文件介质和触发事件名不形成子项。
    en: Scope includes adversary-controlled durable Office extension state automatically loaded during a later application
      start or Office event and producing execution. The extension object, writer, Office consumer, and outcome must be identifiable.
      Application, extension type, Registry or file medium, and event name do not form children.
  - zh: 由一般事件规则决定何时执行的变量归 NJS-0090-001/002；由 DLL/COM 搜索或解析替换驱动的变量归 T1574；文档首次诱导打开归 User Execution/Phishing。合法扩展必须有 owner、签名/来源、批准位置和版本。
    en: Variables centered on a general event rule belong to NJS-0090-001 or 002, variables driven by DLL or COM search or
      resolution substitution to T1574, and first-time induced document opening to User Execution or Phishing. Legitimate
      extensions require owner, signature or origin, approved location, and version.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者替换 Normal/VbaProject 模板、写入 XLSTART/Word Startup、注册 add-in/Office Test 或配置 Outlook 持久对象，等待用户启动 Office、打开模板或接收匹配事件后执行，并在重启间保留。
      en: An adversary replaces a Normal or VbaProject template, writes to XLSTART or Word Startup, registers an add-in or
        Office Test hook, or configures a durable Outlook object and waits for Office startup, template open, or a matching
        event to execute across restarts.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 需要写入用户或系统 Office 扩展面、构造兼容内容并预测应用使用；受控策略、签名要求、禁用旧功能和 ASR 会限制。
        en: The adversary needs write access to user or system Office extension surfaces, compatible content, and predictable
          application use. Managed policy, signing requirements, disabled legacy features, and ASR constrain the effect.
    defender_model:
      paragraphs:
      - zh: 需要跨文件/Registry/邮箱配置汇聚扩展版本、Trust Center、writer、load 和后继进程，而不能永久信任 Office 父进程或 trusted location。
        en: The defender needs extension versions, Trust Center state, writer, load, and successor process across files Registry
          and mailbox configuration and cannot permanently trust an Office parent or trusted location.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 预受信启动面与 Office 宿主包裹恶意扩展内容
    en: A pretrusted startup surface and Office host wrap malicious extension content
  analysis:
    paragraphs:
    - zh: 攻击者把内容放入 Office 已认可的 startup/trusted location、template 或 add-in 面，执行继续由正常 Office 进程和用户工作流承载。恶意扩展借用受信位置与宿主特征，形成特征伪装；内容
        hash、writer 和 load-result 关联仍可区分。
      en: The adversary places content on an Office-recognized startup or trusted location template or add-in surface so execution
        remains carried by a normal Office process and user workflow. The malicious extension borrows trusted location and
        host features and produces Feature Disguise; content hash writer and load-outcome linkage can still distinguish it.
  evidence_refs:
  - REF-000189
  - REF-000190
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子项“预受信 Office 启动面寄生”固定攻击者把恶意内容放入 Office 已经自动加载或绕过部分保护的信任/启动面，检测需扩展内容完整性与 Trust Center/位置来源关联。模板、Office Test 和
        add-in 的格式差异不改变变量。
      en: The formal child Pretrusted Office Startup-Surface Parasitism fixes adversary placement of malicious content on
        an Office trust or startup surface already loaded automatically or bypassing some protections and requires extension-content
        integrity joined with Trust Center or location provenance. Format differences among templates, Office Test, and add-ins
        do not change the variable.
    - zh: Outlook 表单、主页和规则的事件选择性与执行代理来源属于相邻的事件触发执行，DLL 或 COM 加载路径属于执行流劫持。签名加载项身份替换目前缺少与既有子技术同等强度的证据，不能独立成项；Office 版本、扩展格式和产品组件也不构成边界。
      en: Event selectivity and execution-broker provenance for Outlook forms, home pages, and rules belong to adjacent event-triggered
        execution, while DLL or COM loading paths belong to execution-flow hijacking. Signed add-in identity substitution
        currently lacks evidence as strong as the established child and is not independent. Office version, extension format,
        and product component do not define boundaries.
  coverage: established
  subtechnique_refs:
  - NJS-0095-001
