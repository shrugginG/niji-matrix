research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接支持六种 Office 持久扩展与正常 Office 宿主执行，Microsoft 直接说明 trusted locations 绕过多项保护。所有实例并非都位于 trusted location，故子项只覆盖实际借用预受信面者；合法企业扩展要求完整
        owner/签名/批准基线。
      en: ATT&CK directly supports six Office persistence extensions and execution through normal Office hosts, while Microsoft
        directly states that trusted locations bypass several protections. Not every instance uses a trusted location, so
        the child covers only actual borrowing of a pretrusted surface. Legitimate enterprise extensions require complete
        owner signature and approval baselines.
