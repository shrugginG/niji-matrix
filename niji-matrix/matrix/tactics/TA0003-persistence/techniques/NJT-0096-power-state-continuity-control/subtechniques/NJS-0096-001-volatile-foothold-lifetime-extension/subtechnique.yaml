schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0096-001
parent_ref: NJT-0096
name:
  zh: 易失性立足点寿命延长
  en: Volatile Foothold Lifetime Extension
summary:
  zh: 攻击者让主机保持运行以延长本会因休眠、锁定、关机或重启终止的进程、内存或会话入口。
  en: Adversaries keep a host running to extend a process memory or session entry that would terminate on sleep lock shutdown or reboot.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 易失性立足点寿命延长是攻击者修改 power timeout/policy、保持 system-required request 或破坏 state-transition 工具，使当前恶意进程、内存 implant、token/session 或远控通道越过预期空闲/重启边界的匿迹子技术。直接目标是以持续运行代替新增启动制品。
    en: Volatile Foothold Lifetime Extension changes power timeout or policy maintains a system-required request or disrupts state-transition
      utilities so a current malicious process memory implant token or session or remote-control channel crosses an expected idle or reboot boundary.
      Its direct objective is to substitute continued runtime for a new startup artifact.
stealth_characteristics:
  paragraphs:
  - zh: 易失性立足点寿命延长不会出现在服务、任务、自启动或账户清单中；主机只是持续 S0/未锁定，恶意进程沿用原 PID/session。异常 power request、setting diff、uptime、无用户输入和持续网络活动仍可观察，长时间运行还会增加能耗信号。
    en: Volatile Foothold Lifetime Extension does not appear in service task autostart or account inventories. The host simply remains in S0 or
      unlocked and the malicious process keeps its original PID or session. Anomalous power requests setting differences uptime absent user input
      and continuing network activity remain observable and long runtime increases energy signals.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入可以证明状态转换本会终止入口、攻击者阻止转换且入口随后继续的序列。普通服务器 always-on、媒体/备份请求、用户取消睡眠或仅延长显示 timeout 不自动纳入；新增传统持久化可并行但不是本轴。
    en: Include a sequence proving that the state transition would have ended the entry the adversary prevented it and the entry then continued.
      Ordinary always-on servers media or backup requests user-cancelled sleep or only a longer display timeout do not automatically qualify.
      Conventional persistence can coexist but is not this axis.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 不能跨重启的内存 implant、远控会话、下载器或 miner 在用户离开或维护窗口前创建 PowerRequestSystemRequired、systemd-inhibit、pmset assertion 或修改 sleep/lock/hibernate 策略，使主机越过原本会终止进程/会话的空闲和电源边界。操作者以后返回时复用原
        PID、session、token 或内存状态，而没有新增服务、任务或自启动对象。
      en: A memory implant, remote-control session, downloader, or miner that cannot survive reboot creates a PowerRequestSystemRequired, systemd-inhibit,
        pmset assertion, or changes sleep, lock, or hibernate policy before a user leaves or a maintenance window, carrying the host across an
        idle or power boundary that would otherwise terminate the process or session. The operator returns to the same PID, session, token, or
        memory state without adding a service, task, or autostart object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要修改电源/锁定策略或创建可持续 power request/assertion 的权限，知道目标正常睡眠、锁定、休眠、重启和维护节奏，并确认当前立足点确实依赖运行状态。请求必须由仍存进程维持或策略持续生效；进程退出、强制重启、集中策略刷新或电源故障会终止路径。
        en: The adversary needs authority to change power or lock policy or create a durable power request or assertion, knowledge of the target's
          normal sleep, lock, hibernate, reboot, and maintenance cadence, and confirmation that the current foothold actually depends on running
          state. A surviving process must maintain the request or policy must remain effective. Process exit, forced reboot, centralized policy
          refresh, or power failure ends the path.
      - zh: 保持运行越久，异常 uptime、无用户活动、能耗、power request owner 和持续网络越明显；删除 shutdown 工具或过宽策略还会造成业务故障。强制维护重启、集中 power baseline、请求寿命限制和高价值主机的状态转换审计会提高成本。
        en: The longer the host remains running, the more visible anomalous uptime, absent user activity, energy use, power-request owner, and
          continuing network become. Removing shutdown tools or broad policy can also break operations. Forced maintenance reboot, centralized
          power baselines, request-lifetime limits, and state-transition audit on high-value hosts raise cost.
    defender_model:
      paragraphs:
      - zh: 防守方需要事件式 power request/assertion create/update/release、policy old/new、writer process/user、sleep/lock/hibernate/reboot attempts and
          outcomes、uptime、用户输入、维护计划、依赖 PID/session/token 和后继网络/资源活动。一次 `/requests` 快照不能说明请求何时创建或是否跨预期边界。
        en: Defenders need event-based power-request or assertion create, update and release, policy old and new state, writer process or user,
          sleep, lock, hibernate, or reboot attempts and outcomes, uptime, user input, maintenance plan, dependent PID or session or token, and
          downstream network or resource activity. One `/requests` snapshot cannot establish when a request was created or whether it crossed
          an expected boundary.
      - zh: 检测应先建立设备角色和工作负载基线，计算预期状态转换却未发生的窗口，并连接相同进程/会话在边界后继续。服务器、备份、媒体、会议、工业控制和合法维护是强反例；always-on 角色没有预期转换时，本子项不可判定。日志短于电源周期或 agent 随睡眠停止会形成盲区。
        en: Detection should first baseline device role and workload, calculate an expected state-transition window that did not occur, and join
          the same process or session continuing beyond the boundary. Servers, backup, media, conferencing, industrial control, and legitimate
          maintenance are strong counterexamples. When an always-on role has no expected transition, this child cannot be established. Logs shorter
          than a power cycle or agents stopping during sleep create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 电源状态连续性替代可枚举持久化制品
    en: Power-state continuity substitutes for enumerable persistence artifacts
  analysis:
    paragraphs:
    - zh: 易失入口通过不终止而延寿，传统持久化数据源没有新对象，关键行为落在 power-management 观察外形成行为透明；状态/request 与存续进程关联可恢复。
      en: The volatile entry gains lifetime by not terminating so traditional persistence data sources receive no new object and critical behavior
        falls outside power-management observation producing Behavioral Transparency; joining state or request to the surviving process recovers
        it.
  evidence_refs:
  - REF-000191
  - REF-000192
  confidence: medium
