research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接说明恶意软件抑制电源状态以延长活动，Microsoft 直接定义 PowerSetRequest 及请求类型；它们支持状态抑制与进程存续，但“因此少创建了哪些传统制品”通常不可直接观察，匿迹机理保持 medium。
      en: ATT&CK directly describes malware inhibiting power state to extend activity and Microsoft directly defines PowerSetRequest and request
        types. They support state inhibition and process survival, but which traditional artifacts were avoided is rarely directly observable,
        so mechanism confidence remains medium.
    - zh: 合法 always-on、备份/媒体、维护和工业工作负载会产生相同请求；现代待机和平台实现对请求的尊重程度不同。必须证明状态转换本会终止该具体入口、攻击者控制抑制且入口越过边界继续，任何一项缺失都只构成电源异常或可用性影响。
      en: Legitimate always-on, backup or media, maintenance, and industrial workloads create the same requests, while modern standby and platform
        implementations differ in honoring them. The state transition must be shown to terminate the specific entry, the adversary must control
        inhibition, and the entry must continue past the boundary. Missing any part leaves only a power anomaly or availability effect.
