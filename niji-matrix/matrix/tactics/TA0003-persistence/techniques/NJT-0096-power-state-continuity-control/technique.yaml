schema_version: 2.0.0
type: technique
id: NJT-0096
name: {zh: 电源状态连续性控制, en: Power-State Continuity Control}
summary: {zh: 攻击者抑制会终止恶意活动的休眠、锁定、关机或重启，以延长易失性立足点并减少新增持久制品。, en: Adversaries inhibit sleep lock shutdown or reboot that would terminate malicious activity to extend a volatile foothold and reduce additional persistent artifacts.}
aliases: [Power Settings]
classification:
  tactic_refs: [TA0003]
  origin: {kind: attack-adapted, source_attack_id: T1653, source_attack_version: '19.1'}
  decision_ref: DEC-TA0003-T1653
definition_and_concept:
  paragraphs:
  - zh: 电源状态连续性控制是攻击者修改系统睡眠、休眠、锁屏、磁盘、关机或重启策略，创建/滥用 power request，或破坏状态转换工具，使感染主机和当前恶意进程、内存状态或认证会话持续活动的技术。直接目标是避免一个会终止攻击能力的生命周期边界，而不是重新安装载荷。
    en: Power-State Continuity Control changes system sleep, hibernate, lock-screen, disk, shutdown, or reboot policy; creates or abuses a power request; or disrupts state-transition utilities so an infected host and current malicious process, memory state, or authenticated session continue running. Its direct objective is to avoid a lifecycle boundary that would terminate adversary capability rather than reinstalling the payload.
  - zh: 概念锚是“状态转换若发生会终止立足点，攻击者因此抑制转换”的因果。普通性能设置、用户便利、DoS 或能源消耗排除；由时间条件唤醒并执行归 T1053；通过重启加载固件/bootkit 归 T1542。
    en: The conceptual anchor is causality in which the state transition would terminate the foothold and the adversary therefore inhibits it. Ordinary performance settings, user convenience, denial of service, or energy consumption are excluded. Time-based wake and execution belongs to T1053, while firmware or bootkit loading through reboot belongs to T1542.
stealth_characteristics:
  paragraphs:
  - zh: 延长 S0/运行状态可让只驻留内存、进程或会话的入口跨过原本的用户空闲周期，不需要创建服务、任务、启动项或新账户；传统持久化盘点因此可能看不到制品。主机可能呈现正常“未休眠”外观，但 uptime、active power request、timeout/policy diff、删除的 shutdown 工具、用户活动缺失与持续进程仍是残余信号。
    en: Extending the running state can carry a memory-only, process, or session entry across an otherwise idle-user period without creating a service, task, startup object, or new account, leaving conventional persistence inventory without an artifact. The host may simply appear not to have slept, but uptime, active power requests, timeout or policy differences, deleted shutdown utilities, absent user activity, and continuing processes remain residual signals.
  - zh: 合法媒体、备份、会议、工业控制、服务器工作负载和维护会要求长时间运行；策略变化或 power request 单独不能证明匿迹。需要证明目标进程依赖该状态、变更来源异常，并在预期休眠/重启点之后继续产生访问结果。
    en: Legitimate media, backup, conferencing, industrial control, server workloads, and maintenance require long runtimes. A policy change or power request alone does not establish evasion. The target process must depend on the state, the change origin must be anomalous, and access outcomes must continue past an expected sleep or reboot boundary.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制的电源/锁定/关机状态变化及其延长现有感染进程、会话或内存入口的结果，要求状态变更、依赖对象和跨边界存续可关联。平台与 power utility 不形成子项。
    en: Scope includes adversary-controlled power, lock, shutdown, or reboot state change and its extension of an existing infected process, session, or memory entry, requiring correlatable state change, dependent object, and survival across the boundary. Platform and power utility do not form children.
  - zh: 修改 power setting 但没有持久访问结果、让系统崩溃或不可用、正常管理员策略、计划唤醒和重启安装其他持久化分别排除或归邻接技术。删除关机文件只有在实际防止状态转换并保留入口时纳入。
    en: Power-setting change without persistent-access outcome, crashing or denying availability, ordinary administrator policy, scheduled wake, and reboot installation of another persistence mechanism are excluded or adjacent. Deleting shutdown files qualifies only when it actually prevents transition and preserves entry.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 不能跨重启的下载器、远控会话、内存 implant 或挖矿进程通过 powercfg、systemd-inhibit、pmset、PowerSetRequest、延长 lock timeout 或删除 reboot/shutdown 工具保持主机运行，等待操作者以后返回。, en: "A downloader remote-control session memory implant or mining process unable to survive reboot uses powercfg systemd-inhibit pmset PowerSetRequest longer lock timeout or removed reboot or shutdown utilities to keep the host running until the operator returns."}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要修改策略或建立 power request 的权限，并知道主机正常状态节奏；越久保持运行，异常 uptime、能耗和无用户活动越明显。, en: "The adversary needs authority to change policy or create a power request and knowledge of the host's normal state cadence. Longer runtime makes anomalous uptime energy use and absent user activity more visible."}]}
    defender_model: {paragraphs: [{zh: 需要 power setting/request 生命周期、uptime、睡眠/锁定事件、用户活动、进程/会话和变更批准；一次快照无法判断请求持续时间。, en: "The defender needs power-setting or request lifecycle uptime sleep or lock events user activity process or session and change approval. One snapshot cannot establish request duration."}]}
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 维持易失入口避免生成传统持久化对象, en: Preserving a volatile entry avoids conventional persistence objects}
  analysis: {paragraphs: [{zh: 攻击者阻止会终止当前进程/会话的状态转换，使原有易失入口继续存在，而无需写服务、任务、自启动或新账户。关键持久因果落在电源管理而非传统盘点范围，形成行为透明；power request、policy diff 与跨预期边界进程可恢复。, en: "The adversary prevents the state transition that would terminate the current process or session so the volatile entry continues without writing a service task autostart object or account. Critical persistence causality moves into power management outside conventional inventory and produces Behavioral Transparency; power request policy diff and process survival across an expected boundary can recover it."}]}
  evidence_refs: [REF-000191, REF-000192]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子项“易失性立足点寿命延长”固定电源状态抑制替代新增落盘持久化这一变量，检测需要 power-state 与依赖进程/会话的跨边界因果。普通长期运行只是父级相似状态，不满足依赖和攻击者控制门禁。
      en: The formal child Volatile Foothold Lifetime Extension fixes power-state inhibition as a substitute for additional on-disk persistence and requires cross-boundary causality between power state and dependent process or session. Ordinary long runtime is only a parent lookalike and fails dependency and adversary-control gates.
    - zh: ATT&CK 无子项，开放搜索还审查取证抑制重启与 wake timer；前者只在单一设备案例有直接证据而 defer，后者按时间变量归调度。纯可用性结果不进入 taxonomy。
      en: ATT&CK has no children. Open search also reviewed evidence-suppressing reboot and wake timers. The former has direct evidence in only one device case and is deferred, while the latter belongs to scheduling by its time variable. Pure availability outcomes do not enter the taxonomy.
  coverage: established
  subtechnique_refs: [NJS-0096-001]
defense: {detections: {coverage: available, strategy_refs: [DET-000076]}, mitigations: {coverage: available, mitigation_refs: [MIT-000076]}}
evidence: {claim_refs: [CLM-000384, CLM-000385], case_refs: [], reference_refs: [REF-000191, REF-000192]}
research: {limitations: {paragraphs: [{zh: ATT&CK 直接说明电源状态抑制延长恶意活动并明确部分 malware 不能跨重启；“减少落盘持久化”是中等置信综合，需要环境证明本来会终止的入口与状态变更。合法 always-on 系统不可用同一基线，且现代待机可能限制 power request 时长。, en: "ATT&CK directly states that power-state inhibition extends malicious activity and that some malware cannot survive reboot. Reduced on-disk persistence is a medium-confidence synthesis requiring environmental proof that the entry would terminate and that state changed. Legitimate always-on systems need different baselines and modern standby can limit power-request duration."}]}}
