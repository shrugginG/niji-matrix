research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接支持 below-OS 防守盲区和组件固件逃避完整性，NIST SP 800-193 提供保护—检测—恢复原则；这些来源不保证任何具体平台测量全部组件。子项边界取决于实际 attestation coverage，而不是固件类别名称。
      en: ATT&CK directly supports below-operating-system defensive blind spots and component firmware evading integrity, while NIST SP 800-193
        provides protect, detect, and recover principles. These sources do not guarantee that any platform measures every component. The child
        boundary depends on actual attestation coverage rather than firmware-category name.
    - zh: firmware readback、measurement log 和恢复能力高度依赖硬件/vendor，合法更新、换件和旧 unsigned boot 会产生差异。没有写入 actor、未测量边界和重启后结果时只能报告 firmware integrity risk；只造成
        brick/不可用归 Impact。
      en: Firmware readback, measurement logs, and recovery capability depend heavily on hardware and vendor, while legitimate updates, replacement
        parts, and legacy unsigned boot create differences. Without a write actor, unmeasured boundary, and post-reboot outcome, only firmware-integrity
        risk can be reported. Behavior causing only a brick or outage belongs to Impact.
