research:
  limitations:
    paragraphs:
    - zh: ATT&CK T1542.005 直接支持网络设备通过 TFTP 等标准功能加载恶意 image，父级与 NIST 支持 OS 前恢复；公开材料不能保证所有外部启动协议、签名与日志相同。子项变量是 source pointer 与 actual image，而不是
        TFTP 产品或协议。
      en: ATT&CK T1542.005 directly supports network devices loading a malicious image through standard functions such as TFTP, while the parent
        and NIST support pre-operating-system recovery. Public material cannot guarantee identical protocols, signing, and logs for every external
        boot. The child variable is source pointer and actual image rather than TFTP product or protocol.
    - zh: 合法灾备、PXE 装机、网络设备升级和 lab boot 会产生相同配置/流量；必须有未经批准 writer/server/image 差和重启后结果。无服务器日志或设备只自报 running image 时归因降低；只修改 boot pointer 但没有实际或可证明未来消费只能是风险状态。
      en: Legitimate recovery, PXE provisioning, network-device upgrade, and lab boot create the same configuration and traffic. An unapproved
        writer, server or image difference, and post-reboot outcome are required. Attribution falls without server logs or when the device only
        self-reports the running image. A changed boot pointer with no actual or demonstrable future consumption remains a risk state.
