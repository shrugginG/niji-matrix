research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接支持 below-OS 主机防御盲区、组件固件逃避完整性和 TFTP 标准功能加载恶意 image；NIST 提供保护—检测—恢复模型。实际 measurement coverage、firmware readback
        和远程日志能力高度依赖硬件/vendor，无法用统一字段保证。合法 netboot 与更新必须靠批准、签名和 running image 比对排除。
      en: ATT&CK directly supports the below-OS host-defense blind spot component firmware evading integrity checks and malicious
        images loaded through standard TFTP functionality while NIST supplies a protect-detect-recover model. Actual measurement
        coverage firmware readback and remote logging depend strongly on hardware and vendor and cannot be guaranteed by one
        field set. Legitimate netboot and updates require approval signature and running-image comparison.
