schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0225-001
parent_ref: NJT-0225
name:
  zh: 请求资格化的选择性组件激活
  en: Request-Qualified Selective Component Activation
summary:
  zh: 攻击者让持久服务器组件只对满足隐藏字段关系、秘密值或事务条件的少量输入执行恶意分支，使普通流量保持正常结果
  en: Adversaries make a durable server component execute its malicious branch only for a small input set satisfying hidden field relations secret values or transaction conditions while ordinary traffic retains normal outcomes
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 请求资格化的选择性组件激活把恶意功能置于已持久接入的服务器组件内，但仅在 HTTP、邮件、SQL 或等价输入满足攻击者定义的字段关系、秘密值、附件条件、过程名或参数时执行；其他输入继续由正常组件或同一组件的正常分支处理。直接目标是让服务器长期保留能力，却只在操作者请求时暴露恶意结果。
    en: Request-Qualified Selective Component Activation places malicious functionality in a durably integrated server component but executes it only when HTTP mail SQL or equivalent input satisfies an adversary-defined field relation secret value attachment condition procedure name or argument. Other input continues through benign components or an ordinary branch of the same component. Its direct objective is long-lived server capability exposed only on operator request.
stealth_characteristics:
  paragraphs:
  - zh: 请求资格化的选择性组件激活把异常结果从全部服务器流量缩减为极少匹配集合。LightNeuron 按邮件字段和附件规则选择动作，IISpy 只在 Cookie、Host 与 URL 的隐藏关系匹配时执行；健康检查、普通访问和短流量回放因此看到正常服务。恶意调用又继续使用 HTTP、邮件或 SQL 的合法协议外观，粗粒度网络规则难以区分。
    en: Request-Qualified Selective Component Activation reduces anomalous outcomes from all server traffic to a very small matching set. LightNeuron selects actions through mail fields and attachment rules and IISpy executes only when a hidden Cookie Host and URL relation matches. Health checks ordinary access and short traffic replay therefore see normal service. Malicious invocation also retains legitimate HTTP mail or SQL protocol appearance weakening coarse network rules.
  - zh: selector 字段、匹配率、request/message/transaction ID、组件处理分支、响应差分和后继进程、文件、网络或资源结果仍留痕。服务器端字段审计、匹配—非匹配对照和长期请求基线越完整，匿迹越弱；TLS、邮件加密、日志改写和 request ID 丢失会扩大盲区。
    en: Selector fields match rate request message or transaction ID component processing branch response differential and successor process file network or resource outcomes remain. Server-side field audit matching-to-nonmatching comparison and long-term request baselines reduce stealth while TLS mail encryption log rewriting and missing request IDs expand blind spots.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须证明一个已持久注册的服务器组件、攻击者控制的选择谓词、可比较的非匹配正常行为和匹配后的恶意结果。自然低频业务、队列拥塞、合法路由、管理 API、健康检查或反垃圾规则不会仅因稀有而进入；没有组件状态的异常请求也不足。
    en: Inclusion requires a durably registered server component an adversary-controlled selector comparable normal nonmatching behavior and a malicious post-match outcome. Naturally rare business queue congestion legitimate routing administrative APIs health checks and antispam rules do not enter merely from rarity and an anomalous request without component state is insufficient.
  - zh: 独立持久事件订阅归 NJT-0090，端口、防火墙或隐藏 socket 状态由网络信号改变归 NJT-0120，日历调度归 NJT-0075。已安装组件内部对请求字段进行选择留在本子项；响应编码、加密、日志删除和命令执行结果可与相邻对象共映射。
    en: Independent durable event subscriptions belong to NJT-0090 network-signal changes to port firewall or hidden-socket state to NJT-0120 and calendar scheduling to NJT-0075. Selection on request fields inside an installed component remains here while response encoding encryption log removal and command execution outcomes may co-map adjacent objects.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者把选择器嵌入 Exchange Transport Agent、IIS module、Web Shell、数据库过程或等价服务器组件，等待特制邮件、HTTP 请求或 SQL 调用恢复命令、文件、代理或数据访问。正常客户、监控和服务器重启继续成功，组件因而可以长期驻留而很少展示恶意分支。
      en: An adversary embeds a selector in an Exchange Transport Agent IIS module web shell database procedure or equivalent server component and waits for crafted mail HTTP requests or SQL calls to restore command file proxy or data access. Ordinary clients monitoring and server restart continue successfully so the component can remain resident while rarely exposing its malicious branch.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要持久组件写入或注册权限，并能设计稳定、低碰撞且可在协议规范化后保留的 selector。必须了解代理、邮件网关、数据库驱动和业务流量如何重写字段；过于简单会被签名发现，过于复杂则容易因中间件、升级或编码变化失效。
        en: The adversary needs durable component write or registration authority and must design a stable low-collision selector that survives protocol normalization. The actor must understand how proxies mail gateways database drivers and business traffic rewrite fields. A simple selector is signature-prone while a complex one can fail through middleware upgrade or encoding changes.
    defender_model:
      paragraphs:
      - zh: 防守方需要在服务器侧看到请求字段和组件处理阶段，并把 request ID 传播到进程、文件、网络或资源结果；还需要非匹配流量作为对照和足够长的窗口估计 selector 稀有度。只有边界流量或当前文件清单的环境难以确认本轴，独立代理和主机 telemetry 可补偿日志改写。
        en: Defenders need server-side request fields and component processing stages with request IDs propagated to process file network or resource outcomes. They also need nonmatching controls and a sufficiently long window to estimate selector rarity. Environments with edge traffic or current file inventory only have difficulty confirming the axis and independent proxy plus host telemetry can compensate for log rewriting.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 选择谓词把恶意组件结果稀释到极少匹配请求和分散时间点
    en: A selection predicate dilutes malicious component outcomes into rare matching requests and dispersed times
  analysis:
    paragraphs:
    - zh: 攻击者让同一持久组件只在精确字段关系或秘密值匹配时执行恶意分支，绝大多数请求和健康检查保持正常。组件安装、匹配请求和后继结果可跨不同观察窗口出现，短回放难以触发并连接完整链，形成时空释痕。长期保留 selector tuple、组件版本与结果关联可重新聚合信号。
      en: The adversary makes one durable component execute its malicious branch only for an exact field relation or secret value while most requests and health checks remain normal. Component installation matching request and successor outcome can appear in different observation windows and short replay is unlikely to trigger or join the full chain creating Spatiotemporal Trace Dilution. Long-lived selector-tuple component-version and outcome correlation reaggregates the signal.
  evidence_refs: [REF-001159, REF-001160]
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 控制字段嵌入正常 HTTP、邮件或 SQL 事务外观
    en: Control fields are embedded in ordinary HTTP mail or SQL transaction appearance
  analysis:
    paragraphs:
    - zh: 控制请求继续使用服务器既有协议、端口和事务结构，只在 Header、Cookie、附件、过程名或参数关系中携带 selector。粗粒度网络和服务监控看到合法业务类别，恶意输入借正常协议特征形成伪装；字段语义、响应差分和结果仍可揭示它。
      en: Control requests retain established server protocol port and transaction structure and carry selectors only in header cookie attachment procedure-name or argument relations. Coarse network and service monitoring sees legitimate business categories and malicious input borrows ordinary protocol features for disguise while field semantics response differential and outcome remain revealing.
  evidence_refs: [REF-001159, REF-001160, REF-001161]
  confidence: medium
defense:
  detections: {coverage: available, strategy_refs: [DET-000263]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000232]}
evidence:
  claim_refs: [CLM-001124, CLM-001125, CLM-001127, CLM-001128]
  case_refs: [CASE-000346, CASE-000347]
  reference_refs: [REF-001159, REF-001160, REF-001161, REF-001162, REF-001163]
research:
  limitations:
    paragraphs:
    - zh: LightNeuron 与 IISpy 提供直接高置信 selector 证据，但跨 SQL、其他邮件服务器和设备管理面推广仍取决于本地字段与请求—结果谱系。TLS、邮件加密、数据库审计关闭和日志反取证会隐藏 selector；没有匹配/非匹配对照时，只能确认组件异常而不能确认本子项。
      en: LightNeuron and IISpy provide direct high-confidence selector evidence but generalization to SQL other mail servers and device-management planes depends on local fields and request-to-outcome lineage. TLS mail encryption disabled database audit and anti-forensic logging can hide selectors. Without matching and nonmatching controls only component anomaly rather than this child can be confirmed.
    - zh: 健康检查、管理员 API、监控探针、集成测试、反垃圾和数据库自动化也可能使用稀有参数或产生服务器子进程。选择器稀有度不能单独归因，必须连接未经批准的持久组件版本和恶意结果；攻击者主观规避意图在部分事件中仍为强推断。
      en: Health checks administrative APIs monitoring probes integration tests antispam and database automation also use rare parameters or create server child processes. Selector rarity cannot attribute on its own and must join an unapproved durable component version and malicious outcome. Adversary evasion intent remains strongly inferred in some events.
