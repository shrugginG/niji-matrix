schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0225-002
parent_ref: NJT-0225
name:
  zh: 服务器组件信任身份仿冒
  en: Server-Component Trust-Identity Masquerade
summary:
  zh: 攻击者让未批准服务器组件声明熟悉或受信的名称、vendor、version、路径或 acceptance，使普通清单与真实内容和来源不一致
  en: Adversaries make an unapproved server component declare a familiar or trusted name vendor version path or acceptance so ordinary inventory disagrees with real content and provenance
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 服务器组件信任身份仿冒是攻击者让新增或未经批准的服务器组件携带暗示合法、既有或受信发布来源的名称、路径、vendor、version、acceptance level 或 descriptor 属性，而真实内容、签名、writer 和安装来源不相符。直接目标是让常规清单和人工审阅先接受声明身份，使持久组件获得更长未发现寿命。
    en: Server-Component Trust-Identity Masquerade assigns a new or unapproved server component a name path vendor version acceptance level or descriptor suggesting an established legitimate or trusted publisher while real content signature writer and installation provenance disagree. Its direct objective is to make ordinary inventory and human review initially accept the declared identity and give a durable component a longer undetected lifetime.
stealth_characteristics:
  paragraphs:
  - zh: 服务器组件信任身份仿冒改变的是清单身份与可验证来源之间的对应。UNC3886 恶意 VIB 把 descriptor acceptance-level 从 community 改为 partner，使列表显示 PartnerSupported；仅信任声明 metadata 的防守方会把未签名包误作已批准组件。熟悉名称、合法目录或 server role 可以进一步强化外观。
    en: Server-Component Trust-Identity Masquerade changes the correspondence between inventory identity and verifiable provenance. UNC3886 malicious VIBs changed descriptor acceptance level from community to partner causing inventory to display PartnerSupported. Defenders trusting declared metadata can misread an unsigned package as approved and familiar names legitimate directories or server roles can reinforce the appearance.
  - zh: descriptor—signature 差分、无批准 package transaction、异常 writer、content digest 与 publisher 不匹配、签名验证失败、first seen 和首次加载仍留痕。独立 cryptographic verification、不可变包仓库与 owner 审批能破坏伪装；遗留和社区组件也会产生异常签名，必须保留反例。
    en: Descriptor-to-signature differentials absent approval package transactions anomalous writers content-digest and publisher mismatch signature failure first seen and first load remain. Independent cryptographic verification immutable package repositories and owner approval break disguise while legacy and community components also create signature anomalies and remain counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对象必须是服务器组件注册或包身份，且攻击者控制至少一个被防守方当作信任线索的声明字段，并存在与真实内容、签名、writer 或包来源的可验证不一致。仅文件名相似、使用合法目录或一个签名警告不足；普通升级、迁移和已批准社区组件排除。
    en: Inclusion requires a server-component registration or package identity with attacker control over at least one declared field defenders treat as a trust cue and a verifiable disagreement with real content signature writer or package provenance. Filename similarity a legitimate directory or one signature warning is insufficient and ordinary upgrades migrations and approved community components are excluded.
  - zh: 修改既有服务器二进制内容归 NJT-0087；通用 masquerading 文件外观可以共映射但不替代本项；供应链发布身份在目标收到前被篡改归 NJT-0059。本项只拥有服务器组件清单或包层的信任身份差分和后续持久加载结果。
    en: Mutation of an existing server binary belongs to NJT-0087 generic masquerading appearance may co-map but does not replace this child and publisher identity compromised before target receipt belongs to NJT-0059. This child owns only the trust-identity differential in server-component inventory or packages and the later durable load result.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在拥有服务器扩展安装权限后，把恶意包命名为熟悉驱动、过滤器、代理或更新组件，修改 descriptor 的 vendor、version 或 acceptance，并利用普通清单展示该声明值。组件随后在重启或服务加载时恢复后门；验证者若只看名称或 list 输出，会错过真实签名与来源差异。
      en: After gaining server-extension installation authority an adversary names a malicious package as a familiar driver filter agent or update component changes descriptor vendor version or acceptance and relies on ordinary inventory displaying the declaration. The component later restores a backdoor on reboot or service load and reviewers looking only at names or list output miss real signature and provenance differentials.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要组件打包/注册知识和足够权限改变声明 metadata 或强制安装，并了解常规 inventory 与独立验证读取哪些字段。若平台强制可信签名、不可变仓库和 package transaction，攻击者还需失陷发布或管理根；错误 metadata 会导致拒绝、服务失败或高信号验证差分。
        en: The adversary needs component packaging or registration knowledge and sufficient authority to change declared metadata or force installation and must know which fields ordinary inventory and independent verification consume. Enforced trusted signatures immutable repositories and package transactions require compromise of publisher or management roots and incorrect metadata can cause rejection service failure or a high-signal verification differential.
    defender_model:
      paragraphs:
      - zh: 防守方需要同时取得声明 descriptor、普通 inventory、cryptographic signature result、package digest、repository、writer、批准和服务器加载结果。只有 list 输出或当前文件路径时无法确认；独立只读采集与受保护包仓库降低共同失陷风险。
        en: Defenders need declared descriptor ordinary inventory cryptographic signature result package digest repository writer approval and server-load outcome together. List output or current file path alone cannot confirm the child and independent read-only collection plus protected package repositories reduce common-cause compromise.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 声明组件身份借用受信发布与批准属性
    en: Declared component identity borrows trusted publisher and approval attributes
  analysis:
    paragraphs:
    - zh: 攻击者修改名称、vendor、version、acceptance、路径或 descriptor，使普通清单输出与批准组件共享可见特征，而恶意内容、空签名或未经批准的 writer 被隐藏在独立验证面。防守方先按声明身份归类，未批准包由此获得特征伪装。比较 descriptor、signature、package、writer 和结果能反转判断。
      en: The adversary changes name vendor version acceptance path or descriptor so ordinary inventory shares visible features with approved components while malicious content empty signatures or unapproved writers remain on independent verification surfaces. Defenders classify first by declared identity giving the unapproved package Feature Disguise. Comparison across descriptor signature package writer and outcome reverses the judgment.
  evidence_refs: [REF-000208]
  confidence: medium
