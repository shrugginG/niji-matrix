research:
  limitations:
    paragraphs:
    - zh: 直接结论级证据集中于 ESXi VIB：声明 PartnerSupported、空签名和独立 signature verification 差分均被 Mandiant 验证。其他服务器组件常有 name、vendor 与 version 字段，但不能自动证明相同验证缺口；跨产品推广保持 medium，并要求本地声明—验证—加载链。
      en: Direct conclusion-level evidence concentrates on ESXi VIBs where declared PartnerSupported empty signatures and independent signature-verification differentials were validated by Mandiant. Other server components often expose name vendor and version fields but do not automatically share the same verification gap. Cross-product generalization remains medium and requires a local declaration-to-verification-to-load chain.
    - zh: 遗留包、社区组件、离线升级、迁移和签名基础设施变化会合法造成缺失或不一致。一个签名警告、熟悉名称或异常路径不能单独证明攻击者控制；必须结合未批准 writer、包事务、真实内容和后续加载结果。
      en: Legacy packages community components offline upgrades migrations and signature-infrastructure changes legitimately create missing or inconsistent evidence. A signature warning familiar name or anomalous path does not independently prove adversary control and must combine unapproved writer package transaction real content and later load outcome.
