schema_version: 2.0.0
type: technique
id: NJT-0225
name:
  zh: 服务器软件组件持久接入
  en: Durable Server-Software Component Integration
summary:
  zh: 攻击者把代码、过程、模块或安装包接入服务器扩展与请求路径，使以后请求、事件或启动恢复能力，并借服务器运行时或组件身份降低可区分性
  en: Adversaries integrate code procedures modules or packages into server extension and request paths so later requests events or starts restore capability while server runtime or component identity reduces distinguishability
aliases: [Server Software Component]
classification:
  tactic_refs: [TA0003]
  origin:
    kind: attack-retained
    source_attack_id: T1505
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1505
definition_and_concept:
  paragraphs:
  - zh: 服务器软件组件持久接入是攻击者把代码、脚本、过程、程序集、模块或安装包注册到服务器软件的扩展、请求处理、启动或管理路径，使原始会话结束、服务重启或主机重启后，服务器仍能在以后请求、事件或启动中加载或调用攻击者功能。其直接目标是把一次写入或管理权限转化为由高可用服务器持续承载的执行、访问或通信能力。
    en: Durable Server-Software Component Integration registers code scripts procedures assemblies modules or installation packages into a server application's extension request-processing startup or management path so the server can load or invoke adversary functionality during later requests events or starts after the original session service restart or host restart. Its direct objective is to turn one write or administrative opportunity into execution access or communication continuously carried by a highly available server.
  - zh: 概念锚是组件身份与版本、持久注册或调用绑定、服务器消费该状态以及后继结果之间的关系，而不是数据库、邮件、Web、远程桌面、虚拟化产品或文件格式。文件落地、上传或注册只建立候选状态；后来服务器实际消费同一状态并恢复攻击者控制结果，才完成 Persistence。
    en: The conceptual anchor is the relation among component identity and version durable registration or invocation binding server consumption of that state and successor outcome rather than a database mail web remote-desktop virtualization product or file format. File placement upload or registration establishes candidate state only. Persistence completes when the server later consumes the same state and restores an adversary-controlled result.
stealth_characteristics:
  paragraphs:
  - zh: 服务器软件组件持久接入继承服务器已有进程、账户、端口、协议、请求流和运维清单，组件安装又可能与首次恶意调用相隔很久。服务器进程、签名 host、熟悉组件名称或声明 vendor 因而不能单独证明合法；选择性组件只让极少攻击者请求产生异常，身份仿冒组件则让普通清单显示熟悉或批准属性。
    en: Durable Server-Software Component Integration inherits an established server process account port protocol request stream and administrative inventory while component installation may precede first malicious invocation by a long interval. A server process signed host familiar component name or declared vendor therefore does not independently establish legitimacy. Selective components produce anomalies only for a small attacker request set and identity-masquerading components present familiar or approved attributes in ordinary inventory.
  - zh: 痕迹不会消失。注册对象、配置版本、组件文件或数据库对象、hash、signature、publisher、writer、包事务、加载事件、请求或事务 ID、响应差分和后继进程、文件、网络与资源结果仍可观察。版本化清单、独立签名与包验证、长期控制面保留和请求—结果关联越完整，匿迹效果越弱。
    en: Traces remain. Registration objects configuration versions component files or database objects hashes signatures publishers writers package transactions load events request or transaction IDs response differentials and successor process file network and resource outcomes remain observable. More complete versioned inventory independent signature and package verification long-lived control-plane retention and request-to-outcome correlation reduce the stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对象必须同时具有攻击者控制的服务器组件状态、可持久加载或调用的绑定，以及以后实际恢复的结果。服务器漏洞利用、仅上传但不可再次访问的文件、一次性命令或没有后继消费的未知组件不满足本技术。正常第三方 module、数据库维护过程、邮件过滤器、安全组件与虚拟化驱动会产生同类状态，只有 writer、owner、批准、内容来源、加载和结果共同支持恶意时才纳入。
    en: Inclusion requires attacker-controlled server-component state a durable load or invocation binding and a later realized restoration outcome. Server exploitation an uploaded but unreachable file a one-time command or an unknown component without later consumption does not satisfy the technique. Legitimate third-party modules database maintenance procedures mail filters security components and virtualization drivers create equivalent state and enter scope only when writer owner approval content provenance load and outcome jointly support maliciousness.
  - zh: 修改现有服务器二进制内容归 NJT-0087；通用服务定义归 NJT-0089；独立 predicate—event—action 注册归 NJT-0090；模块如何装入进程归 NJT-0077；端口、防火墙或隐藏 socket 的网络信号激活归 NJT-0120；客户端、浏览器、IDE 与普通桌面软件扩展归 T1176。相邻对象可与本技术共映射，但不能替代组件持久注册和结果门。
    en: Mutation of existing server-binary content belongs to NJT-0087 generic service definitions to NJT-0089 independent predicate-to-event-to-action registration to NJT-0090 module loading into a process to NJT-0077 network-signal activation of ports firewall or hidden sockets to NJT-0120 and client browser IDE or ordinary desktop extensions to T1176. Adjacent objects may co-map but do not replace component durable registration and outcome gates.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得 Web 根目录、数据库 sysadmin、Exchange 或 IIS 管理、服务器扩展目录或 ESXi 管理权限后，把组件接入高可用服务器。以后通过特制 HTTP、邮件或 SQL 请求、服务启动、主机重启或管理事件恢复命令执行、数据访问、代理或后门能力，同时尽量保持正常业务请求和服务健康。
      en: After obtaining web-root database sysadmin Exchange or IIS administration server-extension-directory or ESXi administrative authority an adversary integrates a component into a highly available server. A crafted HTTP mail or SQL request service start host reboot or management event later restores command execution data access proxy or backdoor capability while ordinary business requests and service health remain largely intact.
    - zh: LightNeuron 把邮件过滤管线变成命令入口，IISpy 把 IIS 请求事件变成长期被动后门，恶意 VIB 把包描述、启动文件与 ESXi 重启语义结合。三者的服务器类型不同，但都保存组件状态、以后由宿主消费并恢复结果；这正是父级共同对象。
      en: LightNeuron turns the mail-transport pipeline into a command entry IISpy turns IIS request events into a long-lived passive backdoor and malicious VIBs combine package descriptors startup files and ESXi reboot semantics. Their server types differ but all preserve component state later consumed by the host to restore an outcome which is the common parent object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要写入或注册扩展的权限，理解服务器 ABI、配置层级、请求管线、权限上下文、更新行为和重启语义，并维持组件兼容性。选择性激活还要求掌握可稳定重现且不会与正常业务大量碰撞的字段；身份仿冒要求理解普通 inventory、声明 metadata、密码学验证和批准事务之间的差异。
        en: The adversary needs authority to write or register extensions knowledge of server ABI configuration hierarchy request pipeline privilege context update behavior and restart semantics and the ability to preserve compatibility. Selective activation also requires a reproducible selector that rarely collides with ordinary business traffic while identity masquerade requires understanding differences among ordinary inventory declared metadata cryptographic verification and approval transactions.
      - zh: 服务器更新、集群漂移修复、签名策略、配置锁和 service account 限制会使组件被覆盖、拒绝或失去权限。为了长期运行，攻击者必须接受升级兼容成本和可能的健康检查失败；越复杂的选择器与伪装越可能产生版本、日志或结果差异。
        en: Server updates cluster drift remediation signature policy configuration locks and service-account constraints can overwrite reject or deprive the component of authority. Long-lived operation requires absorbing upgrade-compatibility cost and possible health-check failures. More complex selectors and disguise are more likely to create version log or outcome differentials.
    defender_model:
      paragraphs:
      - zh: 防守方需要版本化服务器组件清单和控制面审计，保存 component ID、类型、作用域、路径或过程、hash、signature、publisher、writer、批准和旧/新状态；运行侧要连接服务器启动或 process/module load、请求或事务字段、组件调用与结果。日志保留必须覆盖安装到首次激活和至少一次重启。
        en: Defenders need versioned server-component inventory and control-plane audit retaining component ID type scope path or procedure hash signature publisher writer approval and old or new state. Runtime visibility joins server start or process and module load request or transaction fields component invocation and outcome. Retention must span installation through first activation and at least one reboot.
      - zh: 加密请求、邮件和数据库字段、完全进程内执行、设备缺少 EDR、管理身份或审计根失陷以及控制面日志短保留是主要盲区。任何单一组件文件、服务器子进程或稀有请求都应保持候选级，只有跨状态、加载、请求和结果视角闭合时才确认。
        en: Encrypted requests mail and database fields fully in-process execution appliances without EDR compromised management identities or audit roots and short control-plane retention are principal blind spots. A component file server child process or rare request remains candidate-level until state load request and outcome vantages close the chain.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 持久组件把恶意功能包裹在受信服务器运行时和正常请求处理内
    en: Durable components wrap malicious functionality inside trusted server runtime and ordinary request processing
  analysis:
    paragraphs:
    - zh: 攻击者把组件注册到既有服务器，使以后代码由 Exchange、w3wp、数据库或虚拟化服务在正常生命周期中加载，进程、账户、端口和协议继续显示受信宿主。创建者与后来结果又可能跨会话或重启分离，局部观察因此只看到普通服务器活动，形成行为透明。组件版本、writer、请求 ID 和结果谱系仍能恢复真实因果。
      en: The adversary registers a component into an existing server so Exchange w3wp a database or a virtualization service loads later code during its ordinary lifecycle while process account port and protocol continue to show a trusted host. The creator and later result may also separate across sessions or reboot so local observation sees ordinary server activity producing Behavioral Transparency. Component version writer request ID and outcome lineage can still recover true causality.
  evidence_refs: [REF-001159, REF-001160, REF-001162, REF-001163, REF-001164]
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 组件身份和服务外观与合法扩展或已批准包共享可见特征
    en: Component identity and service appearance share visible features with legitimate extensions or approved packages
  analysis:
    paragraphs:
    - zh: 组件可以使用熟悉名称、路径、vendor、version、acceptance 或描述符，并让恶意行为只通过正常服务器请求流呈现。依赖名称、目录、声明 metadata 或签名 host 的清单会把未批准状态解释为正常组件，形成特征伪装。独立 signature/package 验证、内容摘要、writer 和业务结果会破坏这种外观。
      en: A component can use a familiar name path vendor version acceptance or descriptor and expose malicious behavior only through ordinary server request flows. Inventory relying on names directories declared metadata or signed hosts interprets unapproved state as a normal component creating Feature Disguise. Independent signature or package verification content digest writer and business outcome break the appearance.
  evidence_refs: [REF-000208, REF-001159, REF-001160]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两个子技术分别固定激活选择集合和组件信任身份。请求资格化轴要求同一持久组件仅对攻击者定义的少量输入进入恶意分支，改变请求—结果可见性；身份仿冒轴要求声明名称、vendor、version、路径、acceptance 或 descriptor 与内容、签名和安装来源不一致，改变清单信任判断。两者需要不同数据和控制，可以组合但不能合并。
      en: Two children fix activation-selection set and component trust identity. Request qualification requires one durable component to enter a malicious branch only for a small adversary-defined input set changing request-to-outcome visibility. Identity masquerade requires declared name vendor version path acceptance or descriptor to disagree with content signature and installation provenance changing inventory trust judgment. They need different data and controls and can combine without collapsing.
    - zh: SQL、Transport Agent、Web Shell、IIS、Terminal Services DLL 与 VIB 是实现；服务器产品、组件格式、作用域和平台不构成兄弟边界。受信运行时共驻、二进制替换、独立事件订阅、服务定义、网络信号和内存模块由相邻技术拥有；控制面安装—运行面分离保留为父级共同生命周期。
      en: SQL Transport Agents web shells IIS Terminal Services DLLs and VIBs are implementations. Server product component format scope and platform do not form sibling boundaries. Trusted-runtime co-residence binary replacement independent event subscriptions service definitions network signaling and memory modules have adjacent owners while control-plane installation to runtime separation remains the parent lifecycle.
  coverage: established
  subtechnique_refs: [NJS-0225-001, NJS-0225-002]
defense:
  detections: {coverage: available, strategy_refs: [DET-000263]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000232]}
evidence:
  claim_refs: [CLM-001123, CLM-001124, CLM-001125, CLM-001126, CLM-001127, CLM-001128]
  case_refs: [CASE-000346, CASE-000347, CASE-000348]
  reference_refs: [REF-000625, REF-000208, REF-001159, REF-001160, REF-001161, REF-001162, REF-001163, REF-001164, REF-001165]
research:
  limitations:
    paragraphs:
    - zh: 公开直接证据集中于 Exchange、IIS、Web Shell、SQL Server 和 ESXi，不能假定所有服务器产品导出相同字段。组件存在、异常 metadata 或受信服务器进程产生子进程均不能单独证明攻击；必须结合未经批准的状态、以后加载或调用和风险结果。字段缺失时应降低置信度而不是用产品名称补齐。
      en: Direct public evidence concentrates on Exchange IIS web shells SQL Server and ESXi and does not imply uniform telemetry across server products. Component presence anomalous metadata or a child process from a trusted server process cannot alone prove adversary activity. Unapproved state later load or invocation and risky outcome must combine. Missing fields lower confidence rather than being filled by product name.
    - zh: 信任身份仿冒的最直接证据来自恶意 VIB；跨其他服务器组件推广保持 medium，并允许未来按新的独立证据拆分。合法遗留包、迁移、CommunitySupported 组件和更新会产生签名或版本差分。请求资格化也可能与健康检查、管理 API、反垃圾和监控重叠，必须保留非匹配对照与后继结果。
      en: The most direct evidence for trust-identity masquerade comes from malicious VIBs. Generalization to other server components remains medium and open to future split with independent evidence. Legitimate legacy packages migration CommunitySupported components and updates create signature or version differentials. Request qualification can overlap health checks administrative APIs antispam and monitoring and therefore requires nonmatching controls and successor outcomes.
