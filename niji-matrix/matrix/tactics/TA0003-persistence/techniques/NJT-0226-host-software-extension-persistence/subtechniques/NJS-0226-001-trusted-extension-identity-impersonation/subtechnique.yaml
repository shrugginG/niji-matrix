  reference_refs: [REF-001166, REF-001169, REF-000581]
research:
  limitations:
    paragraphs:
    - zh: Check Point 提供多个直接恶意 VS Code Marketplace 扩展和命名仿冒实例，但公开资料没有为每个下载证明实际受害结果。市场排名、安装量和显示相似性会随时间变化；正式映射必须验证 exact identity、恶意内容或结果以及信任差异，不能仅靠名称近似。
      en: Check Point provides multiple directly malicious VS Code Marketplace extensions and naming-impersonation examples but public reporting does not establish a victim outcome for every download. Marketplace ranking install counts and visible similarity change over time. Formal mapping requires exact identity malicious content or outcome and a trust differential rather than name resemblance alone.
    - zh: 浏览器、IDE 与其他扩展市场的 publisher、签名和审核模型不同，不能把 VS Code 案例自动外推为所有宿主。合法 fork、迁移与内部镜像可产生相似 identity；缺少 publisher ownership 和包内容时应降低置信度。
      en: Publisher signature and review models differ across browsers IDEs and other extension marketplaces and the VS Code case cannot automatically generalize to every host. Legitimate forks migrations and internal mirrors create similar identities and missing publisher ownership or package content requires lower confidence.
