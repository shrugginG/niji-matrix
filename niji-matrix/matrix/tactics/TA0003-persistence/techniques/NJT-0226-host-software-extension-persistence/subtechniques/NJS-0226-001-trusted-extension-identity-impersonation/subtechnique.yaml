schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0226-001
parent_ref: NJT-0226
name:
  zh: 受信扩展身份仿冒
  en: Trusted-Extension Identity Impersonation
summary:
  zh: 攻击者以相似名称、功能、说明或 publisher 外观建立新的恶意扩展身份，使市场搜索、推荐和人工审批把它接近预期合法扩展
  en: Adversaries create a new malicious extension identity with a similar name function description or publisher appearance so marketplace search recommendation and human approval treat it like an expected legitimate extension
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 受信扩展身份仿冒是攻击者建立一个新的精确扩展 identity，却让显示名、功能、说明、图标、publisher 名称或市场外观接近目标预期的合法扩展，使用户、管理员或自动推荐更可能安装并保留它。稳定变量是可见展示身份与精确 `(registry, publisher ID, extension ID)` 身份元组之间的攻击者控制相似，而不是扩展来自某个市场或拥有较高安装量本身。
    en: Trusted-Extension Identity Impersonation creates a new exact extension identity while making display name function description icon publisher name or marketplace appearance resemble a legitimate extension expected by the target so users administrators or automated recommendation are more likely to install and retain it. The stable variable is attacker-controlled similarity between visible identity and the exact registry publisher-ID extension-ID tuple rather than marketplace origin or high installation count alone.
stealth_characteristics:
  paragraphs:
  - zh: 受信扩展身份仿冒让恶意扩展在搜索结果、安装提示和当前清单中共享熟悉名称、功能类别、publisher 外观与官方市场信誉。Check Point 发现 `prettiest java` 借 Prettier-Java 的预期吸引安装，其他恶意扩展累计超过四万五千次安装；显示外观和流行度因此可能强化错误信任。
    en: Trusted-Extension Identity Impersonation lets a malicious extension share familiar names function categories publisher appearance and official-marketplace reputation in search results installation prompts and current inventory. Check Point found prettiest java borrowing expectations around Prettier-Java while malicious extensions accumulated more than forty-five thousand installs showing visible appearance and popularity can reinforce misplaced trust.
  - zh: 精确 registry、publisher ID、extension ID、publisher ownership、域验证、package hash、年龄、版本历史、真实仓库关系、权限和后继行为仍留痕。identity tuple 和内容级审批越严格，仿冒越弱；合法 fork、迁移、重命名和内部扩展是强反例。
    en: Exact registry publisher ID extension ID publisher ownership domain verification package hash age version history real repository relation permissions and successor behavior remain observable. Stronger identity-tuple and content-level approval reduces impersonation while legitimate forks migrations renaming and internal extensions are strong counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须存在新的精确扩展 identity、与一个预期合法扩展的可见相似性、攻击者控制或恶意内容，以及由该相似性促成的安装或信任差异。仅名称相似、同类功能、低年龄或低安装量不足；合法 fork、publisher 迁移、内部同名工具和品牌更名排除。
    en: Inclusion requires a new exact extension identity visible similarity to an expected legitimate extension adversary control or malicious content and an installation or trust differential aided by that similarity. Name similarity same-category function low age or low install count alone is insufficient. Legitimate forks publisher migration internal same-name tools and brand renaming are excluded.
  - zh: 已有同一 identity 下的恶意更新归 NJS-0059-001 的发行连续性；直接配置写入且没有依赖展示身份归 NJS-0226-002；目标页面/工作区条件化归 NJS-0090-001；远控与数据结果归相邻技术。本项只拥有新 identity 借用市场和人工信任的差异。
    en: Malicious updates under the same identity belong to NJS-0059-001 release continuity direct configuration writes without reliance on displayed identity to NJS-0226-002 target page or workspace gating to NJS-0090-001 and remote-control or data outcomes to adjacent techniques. This child owns only a new identity borrowing marketplace and human trust.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在公共市场发布仿冒代码格式化器、语言工具、主题、AI 助手或安全扩展，等待开发者或用户主动安装；也可以在企业审批流中用熟悉 publisher/功能外观请求允许。扩展一旦安装，其状态跨会话存在并由后续 IDE 或浏览器活动加载恶意能力。
      en: An adversary publishes an impersonating formatter language tool theme AI assistant or security extension in a public marketplace and waits for developers or users to install it or requests enterprise approval through familiar publisher and function appearance. Once installed extension state survives sessions and later IDE or browser activity loads malicious capability.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要创建可发布或可侧载的新扩展 identity，模仿目标生态的命名、功能、说明和视觉线索，并保持包兼容。市场审核、verified publisher、域验证、私有 registry、精确 allowlist 和人工代码复核会提高成本；相似度过低不能借信任，过高又可能触发 typosquat 或品牌检测。
        en: The adversary needs a new publishable or side-loadable extension identity imitation of naming function description and visual cues in the target ecosystem and a compatible package. Marketplace review verified publishers domain validation private registries exact allowlists and human code review increase cost. Low similarity fails to borrow trust while excessive similarity can trigger typosquat or brand detection.
    defender_model:
      paragraphs:
      - zh: 防守方需要访问精确 identity、publisher ownership、market registry、版本和包历史、真实代码仓库、批准 owner、安装来源以及 host-load 结果。只看到显示名、rating 或“来自 Marketplace”无法判断；新项目没有历史也不是恶意的充分条件。
        en: Defenders need exact identity publisher ownership marketplace registry version and package history real code repository approval owner installation origin and host-load outcome. Display name rating or Marketplace origin alone cannot decide and absence of history for a new project is not sufficient for maliciousness.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 新恶意 identity 借用合法扩展的名称、功能和市场信誉
    en: A new malicious identity borrows the name function and marketplace reputation of a legitimate extension
  analysis:
    paragraphs:
    - zh: 攻击者让新扩展的显示信息与预期合法对象相似，安装界面和清单继续呈现官方市场、常见功能和普通宿主特征。防守方若按显示名、安装量或市场来源归类，会把恶意 identity 映射到合法概念，形成特征伪装；精确 tuple、publisher ownership、包内容和结果可恢复差异。
      en: The adversary makes a new extension's displayed information resemble an expected legitimate object while installation UI and inventory continue to show an official marketplace common function and ordinary host. Defenders classifying by display name install count or marketplace origin map the malicious identity to a legitimate concept producing Feature Disguise. Exact tuples publisher ownership package content and outcomes recover the difference.
  evidence_refs: [REF-001166]
  confidence: high
defense:
  detections: {coverage: available, strategy_refs: [DET-000264]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000233]}
evidence:
  claim_refs: [CLM-001129, CLM-001130, CLM-001131, CLM-001134]
