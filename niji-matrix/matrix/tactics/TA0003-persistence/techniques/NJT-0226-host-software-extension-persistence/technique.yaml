research:
  limitations:
    paragraphs:
    - zh: 直接证据集中于 Chromium 与 VS Code 生态，marketplace、signature、permission prompt、automatic update、remote extension host 和 enterprise policy 在产品间差异明显。新的宿主只有在能够证明相同持久状态、加载结果、痕迹差异和防御接口时才能外推；扩展存在、宽权限、官方签名或一次异常外联不能单独证明恶意。
      en: Direct evidence centers on Chromium and VS Code ecosystems. Marketplaces signatures permission prompts automatic updates remote extension hosts and enterprise policies differ materially across products. Another host can be generalized only when equivalent durable state load outcome trace differential and defense interfaces are established. Extension presence broad permission official signature or one anomalous connection does not independently prove maliciousness.
    - zh: 既有 identity 的恶意更新有强证据，但其稳定匿迹变量由 NJS-0059-001 的供应链发行连续性拥有；当前没有独立本地替换证据支持复制。目标活动选择性由 NJS-0090-001 拥有。除非以后来源证明一个不依赖相邻 owner 的扩展专属变量，否则这些轴保留父级或相邻映射。
      en: Malicious updates under an established identity have strong evidence but the stable stealth variable is owned by NJS-0059-001 supply-chain release continuity and current evidence does not support a duplicate local-replacement child. Target-activity selectivity is owned by NJS-0090-001. These axes remain at the parent level or mapped to adjacent objects unless later sources establish an extension-specific variable independent of those owners.
