schema_version: 2.0.0
type: technique
id: NJT-0226
name:
  zh: 宿主软件扩展持久化
  en: Host-Software Extension Persistence
summary:
  zh: 攻击者安装、启用或控制宿主以后加载的持久扩展状态，使代码跨会话恢复，并借市场信誉、扩展身份或正常宿主上下文降低可区分性
  en: Adversaries install enable or control durable extension state loaded by a host later restoring code across sessions while marketplace reputation extension identity or normal host context reduces distinguishability
aliases: [Software Extensions]
classification:
  tactic_refs: [TA0003]
  origin:
    kind: attack-retained
    source_attack_id: T1176
    source_attack_version: '19.1'
  decision_ref: DEC-TA0003-T1176
definition_and_concept:
  paragraphs:
  - zh: 宿主软件扩展持久化是攻击者建立或改变扩展包及宿主认可的安装、注册、启用或更新状态，使浏览器、IDE 或类似应用在以后启动、打开工作区、浏览页面或处理用户动作时加载攻击者控制代码的技术。其直接目标是把一次安装、已有本地权限或发布权限转化为跨原始会话的执行、通信或资源访问能力。
    en: Host-Software Extension Persistence establishes or changes an extension package and host-recognized installation registration enablement or update state so a browser IDE or similar application loads adversary-controlled code during a later application start workspace opening browsing or user activity. Its direct objective is to convert one installation existing local authority or publishing authority into execution communication or resource access that survives the original session.
  - zh: 概念锚是 extension identity、版本或内容、安装范围、权限或更新来源、启用状态与后续宿主加载结果之间的持久关系，而不是浏览器、IDE、插件格式或某个 API。只有扩展状态跨中断存续并在以后恢复实际攻击者能力时，才完成 Persistence。
    en: The conceptual anchor is the durable relationship among extension identity version or content installation scope permissions or update source enabled state and later host-load outcome rather than a browser IDE plug-in format or individual API. Persistence completes only when extension state survives an interruption and later restores actual adversary capability.
stealth_characteristics:
  paragraphs:
  - zh: 宿主软件扩展持久化可以由官方市场签发、呈现熟悉功能、保留扩展 UI 身份，或在正常 browser/IDE extension host 中运行。防守方若只信任市场来源、显示名、当前 extension ID、签名或宿主进程，恶意状态会与正常安装、更新和用户工作流共享主要可见特征。带外注册还可能没有普通交互安装和同意事件。
    en: Host-Software Extension Persistence can be distributed through an official marketplace present familiar functionality retain an extension UI identity or run inside an ordinary browser or IDE extension host. Defenders trusting marketplace origin display name current extension ID signature or host process alone see malicious state sharing the main visible features of normal installation update and user workflow. Out-of-band registration may also omit ordinary interactive installation and consent events.
  - zh: 安装或配置 writer、profile/policy/Registry 变化、精确 registry/publisher/extension ID、版本、package hash、signature、permissions、update URL、安装范围、host load、extension host、child process、network 和资源结果仍留痕。版本固定、精确 identity 基线、配置审计和结果关联越完整，匿迹越弱。
    en: Installation or configuration writer profile policy or Registry changes exact registry publisher and extension ID version package hash signature permissions update URL installation scope host load extension host child processes network and resource outcomes remain observable. Version pinning exact identity baselines configuration auditing and outcome correlation constrain the stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者安装、启用、侧载、替换或控制可跨会话存在的扩展包及其宿主注册状态，并证明以后宿主活动消费该状态且恢复执行、访问或通信。新扩展、已有扩展内容变化和宿主配置面植入都可进入父级；宿主或介质名称不形成子项。一次插件执行、临时加载或未被宿主消费的包排除。
    en: Scope includes adversary installation enablement side-loading replacement or control of a cross-session extension package and host registration state with evidence that later host activity consumes that state and restores execution access or communication. New extensions existing-extension content changes and host-configuration implantation can enter the parent while host or medium names do not define children. One plug-in execution temporary load or unconsumed package is excluded.
  - zh: 服务器请求或启动路径组件归 NJT-0225；Office 专属扩展面归 NJT-0095；SaaS/OAuth 授权归 NJT-0086；最终用户接收前的供应链污染归 NJT-0059；通用模块加载执行归 NJT-0077；独立持久事件谓词归 NJT-0090；普通远控和 tunnel 功能滥用归 NJT-0212。合法企业部署、开发者 VSIX/CLI、自动更新、profile 漫游和无障碍/安全扩展必须作为反例。
    en: Server request or startup-path components belong to NJT-0225 Office-specific extension surfaces to NJT-0095 SaaS or OAuth grants to NJT-0086 supply-chain manipulation before end-user receipt to NJT-0059 generic module-load execution to NJT-0077 independent durable event predicates to NJT-0090 and ordinary remote-control or tunnel abuse to NJT-0212. Legitimate enterprise deployment developer VSIX or CLI automatic updates profile roaming and accessibility or security extensions remain counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可以诱导用户从官方市场采用仿冒扩展，利用已有本地权限直接写入扩展目录和宿主配置，或在扩展成为正常工作流一部分后等待浏览器启动、工作区打开或用户访问目标资源。后续结果可以是代码执行、页面或项目访问、凭据取得、远控或 C2，但这些结果各自保留相邻技术归属。
      en: An adversary can induce adoption of an impersonating extension from an official marketplace use existing local authority to write an extension directory and host configuration or wait after the extension becomes part of normal workflow for browser start workspace open or user access to a target resource. Downstream outcomes can include code execution page or project access credential acquisition remote control or C2 while each result retains adjacent-technique ownership.
    - zh: Check Point 发现 Marketplace 中以相似名称和功能吸引安装的恶意 VS Code 扩展；KREMLIN 则在浏览器关闭或用户空闲后写入扩展目录和 Secure Preferences，重建完整性字段并由以后 Chrome 启动加载。两种入口分别体现身份仿冒和带外状态植入，但共享同一持久扩展父对象。
      en: Check Point found malicious VS Code Marketplace extensions attracting installs through similar names and functions while KREMLIN wrote extension directories and Secure Preferences after browser closure or user idleness rebuilt integrity fields and was loaded by a later Chrome start. The entry paths respectively demonstrate identity impersonation and out-of-band state implantation while sharing one durable-extension parent object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要用户采用、目标端配置写权限、企业策略权限、publisher/update 控制权或等价入口之一，并能构造与宿主版本、扩展格式和运行位置兼容的包。身份仿冒需要理解目标预期功能和可信命名；带外植入需要理解配置格式、完整性字段和宿主关闭或重载条件。
        en: The adversary needs at least one of user adoption target-side configuration write authority enterprise-policy authority publisher or update control or an equivalent path plus a package compatible with host version extension format and runtime location. Identity impersonation requires knowledge of expected functionality and trusted naming while out-of-band implantation requires knowledge of configuration formats integrity fields and host shutdown or reload conditions.
      - zh: 签名验证、精确 allowlist、publisher 复核、版本固定、最小权限、私有市场和受保护更新身份会增加成本。宿主或扩展 API 变化、强制更新和配置完整性修复可能使组件失效；更深的权限与外联也产生更明显差分。
        en: Signature verification exact allowlists publisher review version pinning least privilege private marketplaces and protected update identities increase cost. Host or extension API changes forced updates and configuration-integrity repair can break the component while deeper permissions and egress create stronger differentials.
    defender_model:
      paragraphs:
      - zh: 防守方需要把扩展清单与版本历史、marketplace/publisher metadata、policy 和配置写入、package hash/signature、permissions 与 update URL、宿主加载和后继进程/网络连接起来，并覆盖全部用户 profile、本地与远程 extension host。浏览器 inventory 只覆盖部分产品和端点，IDE 与其他宿主仍需文件、CLI 和进程 telemetry。
        en: Defenders need to join extension inventory and version history with marketplace and publisher metadata policy and configuration writes package hashes and signatures permissions and update URLs host load and successor process or network activity across every user profile and local or remote extension host. Browser inventory covers only some products and endpoints and IDEs or other hosts still need file CLI and process telemetry.
      - zh: 市场不提供 upload identity、远程 host 日志缺失、宿主不暴露 extension-to-action 归因、profile 漫游和 runtime 下载代码会造成盲区。只有当前扩展列表或浏览器外联时，结论必须降级；跨版本和跨宿主的 writer—state—load—outcome 链才可确认。
        en: Marketplaces without upload identity remote hosts without returned logs hosts lacking extension-to-action attribution profile roaming and runtime-downloaded code create blind spots. Conclusions remain lower-tier with current extension lists or browser egress only and confirmation requires writer-to-state-to-load-to-outcome lineage across versions and hosts.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 市场信誉、扩展身份和正常宿主上下文包裹恶意持久状态
    en: Marketplace reputation extension identity and normal host context wrap malicious durable state
  analysis:
    paragraphs:
    - zh: 攻击者采用相似名称、功能或 publisher 外观，并让扩展来自官方市场或由宿主认可后加载；安装与运行痕迹因此共享正常 market UI、extension identity、signature 和 host process 特征。粗粒度来源和进程规则难以区分，形成特征伪装。精确 identity、版本内容、publisher ownership、writer 和结果仍可揭示它。
      en: The adversary uses a similar name function or publisher appearance and has the extension originate from an official marketplace or load after host recognition. Installation and runtime traces therefore share ordinary marketplace UI extension identity signature and host-process features. Coarse provenance and process rules struggle to distinguish it creating Feature Disguise while exact identity version content publisher ownership writer and outcome remain revealing.
  evidence_refs: [REF-001166, REF-001167, REF-001169]
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 配置面植入和后续扩展运行分处不同观察面与时间
    en: Configuration-plane implantation and later extension runtime occupy different observation surfaces and times
  analysis:
    paragraphs:
    - zh: 攻击者从 profile、policy、CLI 或扩展目录建立状态，普通市场或 UI 安装事件可能缺失；以后代码由浏览器或 IDE extension host 在正常活动中运行，局部进程视角只看到受信宿主。writer、注册状态、首次加载和结果需要跨面连接，否则形成行为透明。KREMLIN 的 Secure Preferences 写入和后来 Chrome 加载直接展示该断点。
      en: The adversary establishes state through profiles policies CLIs or extension directories and ordinary marketplace or UI installation events may be absent. Later code runs inside a browser or IDE extension host during normal activity leaving a local process view of a trusted host. Writer registration state first load and outcome need cross-plane correlation or produce Behavioral Transparency. KREMLIN Secure Preferences writes and later Chrome load directly demonstrate the break.
  evidence_refs: [REF-000578, REF-000580, REF-001169]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两个子技术分别固定可见扩展身份和注册状态创建路径。受信扩展身份仿冒要求一个新的精确 identity 以相似名称、功能或 publisher 外观借市场与人工信任；带外注册状态植入要求 package 与 profile/policy/preference/Registry 或目录状态绕过普通交互安装链而由以后宿主加载。它们需要 identity/version 历史与 writer/configuration 审计两类不同防御。
      en: Two children fix visible extension identity and registration-state creation path. Trusted-extension identity impersonation requires a new exact identity to borrow marketplace and human trust through similar name function or publisher appearance. Out-of-band registration-state implantation requires package and profile policy preference Registry or directory state to bypass ordinary interactive installation and load later. They need different defenses for identity and version history versus writer and configuration audit.
    - zh: Browser/IDE 是实现，产品、文件格式、权限名称和目标站点不形成兄弟边界。既有 identity 的恶意更新由 NJS-0059-001 拥有发行连续性，宿主条件谓词由 NJS-0090-001 拥有，普通远控与模块执行返回相邻对象；这些可共映射但不重复建立子项。
      en: Browser and IDE are implementations and product file format permission name or target site do not form sibling boundaries. Malicious updates under an existing identity have release continuity owned by NJS-0059-001 host predicates by NJS-0090-001 and ordinary remote control or module execution by adjacent objects. They may co-map without duplicate children.
  coverage: established
  subtechnique_refs: [NJS-0226-001, NJS-0226-002]
defense:
  detections: {coverage: available, strategy_refs: [DET-000264]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000233]}
