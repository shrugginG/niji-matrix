tactic_ref: TA0004
candidate:
  source_type: attack
  source_attack_id: T1037
  source_attack_version: '19.1'
  name_en: Boot or Logon Initialization Scripts
  name_zh: 启动或登录初始化脚本
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1037 映射到 Privilege Escalation，并明确说明某些启动或登录初始化脚本以更高权限运行而可能使攻击者提权。该行为在 TA0004 下独立成立，但只有攻击者控制的脚本内容或专用 hook 可被低于结果的 writer/pre-state 影响，随后由更高权限生命周期 interpreter 消费并完成首个新获准操作时才满足本战术；同用户登录脚本、必须 root 写且以 root 执行的 RC 脚本或仅有高权限父进程均不足。直接对象仍是 NJT-0085 的生命周期脚本内容，因此跨战术扩展复用而不创建重复 NJT。
rationale_en: ATT&CK Enterprise 19.1 maps T1037 to Privilege Escalation and states that some boot or logon initialization scripts run with higher privileges and may let an adversary elevate. The behavior is independently valid under TA0004, but the tactic applies only when adversary-controlled script content or a script-specific hook is influenceable by a writer or pre-state below the result, is later consumed by a higher-authority lifecycle interpreter, and completes the first newly authorized operation. A same-user logon script, an RC script that requires root to write and runs as root, or a privileged parent process alone is insufficient. The direct object remains NJT-0085's lifecycle script content, so it is extended and reused across tactics rather than duplicated.
scope_notes_zh: TA0004 归类要求保留 writer/pre-state 权限、脚本路径与内容版本、boot/logon ID、实际 interpreter token/security context、有效权限 delta 和首个新获准结果。五项 ATT&CK 子技术不导入。既有脚本内联植入与集中初始化脚本扇出继续按内容身份和传播拓扑复用，但前者必须证明被执行的变化行跨越权限边界，后者必须逐客户端计算权限差；中央范围、root/SYSTEM 名称、系统路径、启动阶段或多端执行不能单独证明提权。外部 autostart descriptor、服务、调度、其他事件触发、签名绕过和权限修改仍归相邻 owner。
scope_notes_en: TA0004 classification requires writer or pre-state authority, script path and content version, boot or logon ID, actual interpreter token or security context, effective-authority delta, and the first newly authorized result. The five ATT&CK children are not imported. Existing-script inline implantation and centralized initialization-script fan-out remain reused under content-identity and propagation-topology keys, but the former must prove that the executed changed line crossed an authority boundary and the latter must calculate authority difference per client. Central scope, root or SYSTEM label, system path, boot phase, or multi-endpoint execution cannot alone prove elevation. External autostart descriptors, services, schedules, other triggers, signing bypass, and permission modification remain with neighboring owners.
