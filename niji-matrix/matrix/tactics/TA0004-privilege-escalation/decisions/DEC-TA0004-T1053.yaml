  name_en: Scheduled Task/Job
  name_zh: 计划任务/作业
decision: retain
rationale_zh: Enterprise ATT&CK 19.1 把 T1053 同时映射到 Execution、Persistence 和 Privilege Escalation，并说明调度器可以在指定且可能更高权限的账户上下文运行任务。TA0004 在不复制对象的前提下复用 NJT-0075；成立必须连接 submitter/pre-state authority、精确任务定义版本、准入和触发、实际 runtime principal/token/capability/ServiceAccount、攻击者控制动作、正权限差与首个新增授权资源结果。既有四个 Niji 子项分别控制特征合形、观察窗口距离、枚举差分和短驻代理，权限结果作为每条链共同的父级门禁，不按平台或账户另建子项。
rationale_en: Enterprise ATT&CK 19.1 maps T1053 to Execution Persistence and Privilege Escalation and states that schedulers can run tasks in a specified and potentially higher-authority account context. TA0004 reuses NJT-0075 without duplicating the object. Qualification must join submitter or pre-state authority, an exact task-definition version, admission and trigger, the actual runtime principal, token, capability, or ServiceAccount, an adversary-controlled action, a positive authority difference, and the first newly authorized resource result. The four existing Niji children separately control feature conformity, observation-window distance, enumeration differential, and ephemeral brokerage. Authority outcome is their common parent gate rather than a new platform- or account-based child.
scope_notes_zh: 任务创建、root/SYSTEM 或 ServiceAccount 字符串、RunLevel、受信 scheduler parent、成功返回码或高权资源事件任一单独信号均不足。普通 user crontab、user timer、default ServiceAccount 以及已具同等权限管理员创建的高权任务可能没有正权限差；远程提交所用凭据、解释器/代理载荷、服务定义、工作流和纯日志清理由相邻对象拥有。公开 Guloader、Nitrokod、Tarrask 与 Serpent 案例证明四类匿迹变量，但缺少事件时 source/runtime 授权快照和首个 expected-deny/observed-allow 结果，不能自动作为 TA0004 个案结论。
scope_notes_en: A task creation event, a root or SYSTEM or ServiceAccount string, RunLevel, a trusted scheduler parent, a success code, or a privileged-resource event is individually insufficient. An ordinary user crontab, user timer, default ServiceAccount, or privileged task created by an administrator already holding equal authority may have no positive authority difference. Credentials used for remote submission, interpreter or proxy payloads, service definitions, workflows, and generic log removal have adjacent owners. Public Guloader Nitrokod Tarrask and Serpent cases prove the four stealth variables but lack event-time source and runtime authorization snapshots and a first expected-deny to observed-allow result, so they do not automatically establish TA0004 cases.
