schema_version: 1.0.0
type: technique-decision
id: DEC-TA0004-T1055
tactic_ref: TA0004
candidate:
  source_type: attack
  source_attack_id: T1055
  source_attack_version: '19.1'
  name_en: Process Injection
  name_zh: 进程注入
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 将 T1055 的父行为定义为在另一 live process 地址空间执行任意代码，以借用其 memory/resources、合法进程外观和可能更高的权限。Niji 适配为“跨进程执行上下文嵌入”，要求 identifiable source/control、exact target instance、跨进程 write/map/load request、execution dispatch 和 target-context malicious instruction；在 TA0004 下还必须证明 source pre-state 到 target/post-state 的正权限差和首个新增授权结果。十二项 ATT&CK 子项仅作为研究宽度，最终以 backing、dispatch、birth-image provenance 和 target-role conformity 四个 Niji-native 变量重建 taxonomy。
rationale_en: Enterprise ATT&CK 19.1 defines T1055 parent behavior as arbitrary code executing in another live process address space to borrow its memory and resources, legitimate-process appearance, and possibly higher authority. Niji adapts it as Cross-Process Execution-Context Embedding and requires an identifiable source or control, exact target instance, cross-process write, map, or load request, execution dispatch, and malicious instruction in target context. Under TA0004 it additionally requires a positive authority difference from source pre-state to target or post-state and the first newly authorized result. The twelve ATT&CK children are breadth context only; taxonomy is rebuilt around four Niji-native variables for backing, dispatch, birth-image provenance, and target-role conformity.
scope_notes_zh: ProcessAccess/ptrace/task handle、remote allocation/write/protect、DLL path、remote thread/APC/callback、RWX/private memory 或目标进程后继网络/文件行为均不足以单独确认。只有同进程反射加载归 NJT-0077；恶意请求由未被修改的 IPC Broker 正常执行归 NJT-0072；loader 候选解析被操纵归 NJT-0070；漏洞造成跨权限写入归 NJT-0102；token 被替换归 NJT-0099；direct syscall 规避 API hook 归 T1106。若 target authority 不高于 source 或没有新增授权结果，可记录通用 injection_confirmed，但不形成本 TA0004 结论。
scope_notes_en: ProcessAccess, ptrace, or task handles; remote allocation, write, or protection change; a DLL path; remote thread, APC, or callback; RWX or private memory; or target-process network or file behavior is insufficient alone. Reflective loading only within the same process belongs to NJT-0077. A malicious request normally executed by an unmodified IPC broker belongs to NJT-0072. Manipulated loader-candidate resolution belongs to NJT-0070. A vulnerability enabling the cross-authority write belongs to NJT-0102, token replacement to NJT-0099, and a direct syscall bypassing API hooks to T1106. If target authority does not exceed the source or no newly authorized result occurs, generic injection_confirmed can be recorded but not this TA0004 conclusion.
gap_statement_zh: >-
  ATT&CK 罗列 DLL、PE、thread、APC、TLS、ptrace、procfs、window、hollowing、doppelgänging、vDSO 和 ListPlanting 实现，却没有把跨实现可复用的四种防守对象设为 taxonomy：event-time memory backing 差异、既有执行流 dispatch 差异、process-birth file/image provenance 差异，以及按后继行为选择 role-conforming target 的基线差异。Niji 同时把 TA0004 权限结果与注入事实分级，避免由高权限目标名称倒推提权。
gap_statement_en: >-
  ATT&CK enumerates DLL, PE, thread, APC, TLS, ptrace, procfs, window, hollowing, doppelganging, vDSO, and ListPlanting implementations without making four cross-implementation defense objects the taxonomy: event-time memory-backing difference, existing-flow dispatch difference, process-birth file and image provenance difference, and baseline difference from selecting a role-conforming target for downstream behavior. Niji also tiers the TA0004 authority result separately from injection fact, preventing inference of elevation from a privileged target name.
