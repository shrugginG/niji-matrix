  review_notes_zh: 十二项固定子技术已完成逐项覆盖和第二轮 taxonomy；四个正式 NJS 均为 Niji-native observation variable，不导入 ATT&CK 名称。公开案例不具完整权限快照，TA0004 成功严格依赖本地 authority differential。尚无人工领域批准，保持 review。
  review_notes_en: All twelve fixed children have itemized coverage and a second taxonomy pass. The four formal NJS objects are Niji-native observation variables and do not import ATT&CK names. Public cases lack complete authority snapshots, so TA0004 success strictly depends on a local authority differential. Human domain approval has not occurred and status remains review.
