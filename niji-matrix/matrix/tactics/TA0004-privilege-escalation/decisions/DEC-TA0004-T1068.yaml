candidate:
  source_type: attack
  source_attack_id: T1068
  source_attack_version: '19.1'
  name_en: Exploitation for Privilege Escalation
  name_zh: 权限提升漏洞利用
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 将 T1068 映射到 Privilege Escalation，并要求软件缺陷把 lower-privileged process 转换到更高访问。Niji 适配为“脆弱权限转换利用”，把成功链限定为 caller/context pre-state、exact vulnerable component/version 与 reachability、attacker-controlled trigger/interface、vulnerable transition、post-state effective authority、正权限差和首个新增授权结果。固定 ATT&CK 没有子项；开放搜索只建立“预受信脆弱组件权限枢转”一个 Niji-native 子项，它按 admission trust 与来源变化划界，不按 driver、平台、CVE 或漏洞类型拆分。
rationale_en: Enterprise ATT&CK 19.1 maps T1068 to Privilege Escalation and requires a software flaw to move a lower-privileged process into higher access. Niji adapts it as Vulnerable Authority-Transition Exploitation and limits the success chain to caller or context pre-state, exact vulnerable component and version plus reachability, attacker-controlled trigger or interface, vulnerable transition, post-state effective authority, positive authority difference, and first newly authorized result. Fixed ATT&CK has no children. Open search creates only one Niji-native child, Pretrusted Vulnerable-Component Authority Pivot, bounded by admission trust and provenance change rather than driver, platform, CVE, or vulnerability type.
scope_notes_zh: CVE/脆弱版本存在、exploit 文件、request、exception/crash/BSOD、shell 或 root/SYSTEM/kernel 标签只是 exposure、attempt 或中间证据。正常 UAC/sudo/PIM/polkit 授权路径的操纵归 NJT-0098；token 本身变化归 NJT-0099；无漏洞的跨进程写入归 T1055；隔离边界 crossing 与 host-only result 归 NJT-0101；post-exploit 持久化与清理各归其直接对象，可与本技术并列但不能替代 vulnerable-transition 证明。
scope_notes_en: A CVE or vulnerable version, exploit file, request, exception, crash or blue screen, shell, or root, SYSTEM, or kernel label is only exposure, attempt, or intermediate evidence. Manipulation of a normal UAC, sudo, PIM, or polkit authorization path belongs to NJT-0098; token mutation itself to NJT-0099; cross-process writes without a vulnerability to T1055; isolation-boundary crossing and host-only result to NJT-0101; and post-exploit persistence or cleanup to their direct objects. These can co-occur but cannot replace proof of the vulnerable transition.
gap_statement_zh: ATT&CK 描述漏洞利用与 BYOVD 实现，但没有把“正常授权事务缺失下的 pre-state—脆弱转换—首个新增权限结果”设为父级证明链，也没有将攻击者选择因签名/publisher/allow policy/系统角色被接纳的 exact 脆弱组件建模为独立来源变量并要求 admission-to-interface-to-kernel-effect 防御。
gap_statement_en: ATT&CK describes exploitation and the BYOVD implementation but does not make pre-state to vulnerable transition to first newly authorized result without an ordinary authorization transaction the parent proof chain, nor model adversary selection of an exact vulnerable component admitted by signature, publisher, allow policy, or system role as an independent provenance variable requiring admission-to-interface-to-kernel-effect defense.
