  review_notes_zh: 四项固定 ATT&CK 子技术已逐项覆盖，开放搜索和第二轮复核完成；保留两个既有 Niji 子项并新增一个低反馈身份选择子项。具体 TA0004 结论严格依赖本地正权限差与资源授权结果；尚无人工领域批准。
  review_notes_en: All four fixed ATT&CK children have itemized coverage and open search plus a second review are complete. Two existing Niji children are retained and one low-feedback identity-selection child is added. Concrete TA0004 conclusions strictly require a local positive authority difference and resource-authorization result; human domain approval has not occurred.
