  name_en: Valid Accounts
  name_zh: 有效账户
decision: retain
rationale_zh: Enterprise ATT&CK 19.1 将 T1078 映射到 Privilege Escalation，并说明现有有效账户可能提供受限系统或网络区域的更高权限。TA0004 复用并扩展 NJT-0061，不复制父技术；成立必须从攻击者已控制的较低权限前态连接未修改的精确有效凭据或会话、被接受的认证/续用、实际 resulting principal/session/token 与事件时授权集合、正权限差、首个攻击者资源操作和 expected-deny/observed-allow 结果。现有两个 Niji 子项分别控制新登录情境与认证会话续用；开放搜索新增以合法使用历史和所有者反馈为变量的低反馈身份选择，不按四种 ATT&CK 账户类型拆分。
rationale_en: Enterprise ATT&CK 19.1 maps T1078 to Privilege Escalation and states that an existing valid account may provide higher access to restricted systems or network areas. TA0004 reuses and extends NJT-0061 without duplicating the parent. Qualification must join an adversary-controlled lower-authority pre-state to the exact unchanged valid credential or session accepted authentication or continuation actual resulting principal session or token and event-time authorization set a positive authority difference the first adversary resource operation and an expected-deny to observed-allow result. Two existing Niji children control new-sign-in context and authenticated-session reuse while open search adds low-feedback identity selection based on legitimate-use history and owner feedback rather than partitioning the four ATT&CK account types.
scope_notes_zh: 从未认证状态取得第一个立足点只构成 Initial Access；凭据持有、成功登录、admin/root/Global Administrator 标签、4672 敏感权限、异常来源或高权 API 事件任一单独不足。同权限身份切换没有正权限差；账户、认证器、角色或授权变更属于 NJT-0083，进程/线程 token 操纵属于 NJT-0099，凭据或 Cookie 获取、远程服务与横向移动保留相邻 owner。Storm-0501 支持混合身份权限路径但缺完整事件级前态和首个授权差，因此不升级为本地 confirmed elevation case。
scope_notes_en: Gaining a first foothold from an unauthenticated state establishes Initial Access only. Credential possession successful logon an admin root or Global Administrator label event 4672 anomalous origin or a privileged API event is individually insufficient. Same-authority identity switching has no positive difference. Account authenticator role or authorization mutation belongs to NJT-0083 process or thread token manipulation to NJT-0099 and credential or cookie acquisition remote services and lateral movement retain adjacent owners. Storm-0501 supports a hybrid identity-authority path but lacks a complete event-level pre-state and first authorization difference and is not promoted to a local confirmed-elevation case.
