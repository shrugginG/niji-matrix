candidate:
  source_type: attack
  source_attack_id: T1098
  source_attack_version: '19.1'
  name_en: Account Manipulation
  name_zh: 账户操纵
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1098 明确映射到 Privilege Escalation，并说明对既有账户的凭据、权限组或其他访问状态作出修改，可在新增角色、权限或更高权限 Valid Account 时提升访问。该行为需要攻击者先有足够变更权限，但变更后的主体能够获得相对 pre-state 更高的有效权威，因而在 TA0004 下独立成立。其直接对象仍是既有身份的认证器、授权边或设备信任状态，与 TA0003 的 NJT-0083 相同；本决议通过跨战术扩展复用 NJT-0083，而不创建重复 NJT。
rationale_en: ATT&CK Enterprise 19.1 explicitly maps T1098 to Privilege Escalation and states that modifying credentials, permission groups, or other access state of an existing account can elevate access when the change grants roles, permissions, or a higher-privileged Valid Account. The adversary needs sufficient mutation authority first, but the changed principal can obtain greater effective authority than its pre-state, making the behavior independently valid under TA0004. Its direct object remains authenticator, authorization-edge, or device-trust state on an existing identity, identical to TA0003 NJT-0083. This decision extends and reuses NJT-0083 across tactics rather than creating a duplicate NJT.
scope_notes_zh: TA0004 归类要求同时证明目标主体在变更前已存在、攻击者控制的状态变更成功、pre/post 有效权限或策略结果出现正向 delta，并由新增认证器、授权边或设备信任促成首次高权限操作。仅保持同等权限的后续访问只承担 TA0003；新身份归 T1136，未修改状态的账户使用归 T1078，全局认证或租户策略归 T1556/T1484，运行时 token 置换归 NJT-0099，临时提权控制事务归 NJT-0098。七项 ATT&CK 子技术不导入；既有三个 Niji 子技术按认证器、授权图和设备信任复用。
scope_notes_en: TA0004 classification requires proof that the target principal pre-existed, an adversary-controlled state mutation succeeded, effective permission or policy result increased from pre-state to post-state, and the added authenticator, authorization edge, or device trust enabled a first privileged operation. Later access with equivalent authority serves only TA0003. New identities belong to T1136, unmodified-account use to T1078, global authentication or tenant policy to T1556 or T1484, runtime token substitution to NJT-0099, and temporary elevation-control transactions to NJT-0098. No ATT&CK child is imported; the three existing Niji children are reused by authenticator, authorization graph, and device trust.
