candidate:
  source_type: attack
  source_attack_id: T1134
  source_attack_version: '19.1'
  name_en: Access Token Manipulation
  name_zh: 访问令牌操纵
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 与 Windows 官方安全模型直接证明，攻击者可以通过复制、创建、赋值或改变访问令牌，让线程或进程获得不同或更高安全上下文，故该父技术与 TA0004 直接相关。Niji 将其适配为“访问令牌安全上下文置换”，以令牌身份/权限状态及其承载体为直接对象，并从五项 ATT&CK 实现和开放搜索中收敛出进程驻留有效身份、新进程权威谱系、休眠权限激活三个可控且防御不可互换的匿迹变量；不导入 ATT&CK 子技术。
rationale_en: Enterprise ATT&CK 19.1 and the official Windows security model directly establish that adversaries can duplicate, create, assign, or modify access tokens so threads or processes obtain a different or higher security context, making the parent technique directly relevant to TA0004. Niji adapts it as Access-Token Security-Context Substitution with token identity or privilege state and carrier as the direct object. The five ATT&CK implementations and an open search converge on three controllable stealth variables with non-interchangeable defenses—process-resident effective identity, new-process authority lineage, and dormant privilege activation. No ATT&CK sub-technique is imported.
scope_notes_zh: SID-History 等目录持久授权边归 NJT-0083/NJS-0083-002；UAC/sudo 等提权控制路径归 NJT-0098；漏洞利用、代码注入、既有高权限使用和无高权限结果的纯 PPID 断树分别归相邻技术或范围外。令牌来源、主/模拟类型和模拟级别保留为父级取证字段，不机械拆为子技术。
scope_notes_en: Durable directory authorization edges such as SID-History belong to NJT-0083 and NJS-0083-002; elevation-control paths such as UAC or sudo belong to NJT-0098. Exploitation, code injection, use of already-effective privilege, and PPID-only tree breaking without a privileged outcome belong to adjacent techniques or outside scope. Token source, primary or impersonation type, and impersonation level remain parent forensic fields rather than mechanical children.
gap_statement_zh: ATT&CK 以令牌 API/实现类别组织五项子技术，但没有把“进程不变而线程有效身份变化”“新进程权威与创建谱系分离”“身份不变而已有权限位激活”作为三个痕迹、观察和防御均不同的 Niji 匿迹变量。
gap_statement_en: ATT&CK organizes five children by token API or implementation class but does not express process-stable thread effective-identity change, separation of new-process authority from creation lineage, and activation of existing privilege bits without identity change as three Niji stealth variables with different traces, observations, and defenses.
