  review_notes_en: All five ATT&CK children are covered individually or by cluster and an open second search is complete. The three formal NJS count follows stealth-variable gates rather than an ATT&CK quota. Ownership of SID-History by existing NJS-0083-002 is recorded. Human domain approval has not occurred, so the decision remains in review.
