type: technique-decision
id: DEC-TA0004-T1484
tactic_ref: TA0004
candidate:
  source_type: attack
  source_attack_id: T1484
  source_attack_version: '19.1'
  name_en: Domain or Tenant Policy Modification
  name_zh: 域或租户策略修改
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 将 T1484 明确映射到 Privilege Escalation，并以 GPO 与域/租户 trust/federation modification 表达可被集中传播和评估的行为。Niji 将其适配为“集中策略与信任状态篡改”，把直接对象限定为权威 policy/trust object 的版本、有效作用域和 consumer 结果，以 strict writer—version—evaluation—authority-delta gate 排除只有防御削弱或既有管理员行为的事件。开放搜索只收敛出“用后策略状态回退”一个 Niji-native 匿迹子项；两项 ATT&CK 子技术均未导入。
rationale_en: Enterprise ATT&CK 19.1 explicitly maps T1484 to Privilege Escalation and expresses GPO and domain or tenant trust or federation modification as behavior that is centrally propagated and evaluated. Niji adapts it as Central Policy and Trust-State Mutation, limiting the direct object to the authoritative policy or trust object version, effective scope, and consumer outcome, with a strict writer-to-version-to-evaluation-to-authority-difference gate that excludes defense-only impairment and ordinary action by an already privileged administrator. Open search converges on one Niji-native evasion child, Post-Use Policy-State Reversion, and imports neither ATT&CK child.
scope_notes_zh: GPO 与 trust 是实现而不是 Niji 子项。额外认证证明或窄认证排除归 NJT-0093/NJS-0093-001/002，长期主体授权边归 NJT-0083，策略触发的计划任务、服务或载荷执行归各自 owner。策略只关闭安全控制而没有正向权限差时属于 Defense Impairment；GPO applied、trust established 或高权限 token 字符串不证明提权。
scope_notes_en: GPO and trust are implementations rather than Niji children. Added authentication proofs or narrow authentication exclusions belong to NJT-0093 and NJS-0093-001 or 002, durable principal-authorization edges to NJT-0083, and policy-triggered scheduled tasks, services, or payload execution to their respective owners. A policy that only disables security controls without a positive authority difference belongs to Defense Impairment, and an applied GPO, established trust, or privileged-token string does not prove elevation.
gap_statement_zh: ATT&CK 以 GPO 与 trust 两项实现组织 T1484，并提到攻击者可临时修改后回退，但没有把“同一权威对象的恶意版本只在有界使用区间存在”建模为独立匿迹变量，也没有给出 current-state snapshot、版本历史、consumer 与残留 token/结果之间的专门防御差异。
gap_statement_en: ATT&CK organizes T1484 around GPO and trust implementations and notes that adversaries may temporarily modify and revert policy, but it does not model a malicious version of the same authoritative object existing only for a bounded use interval as a distinct evasion variable or define the specialized defense difference among current-state snapshots, version history, consumers, and residual tokens or outcomes.
