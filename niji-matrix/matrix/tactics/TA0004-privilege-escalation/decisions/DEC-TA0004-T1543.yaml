  name_en: Create or Modify System Process
  name_zh: 创建或修改系统进程
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1543 映射到 Privilege Escalation，并明确说明服务可由 administrator 创建而以 root/SYSTEM 执行。该父技术在 TA0004 下独立成立，但只有较低权限 writer 或 pre-state 能影响攻击者控制的精确 service definition，manager 随后以更高有效权限执行该版本并产生首个新获准操作时才确认提权；root/SYSTEM 标签、服务创建、管理员操作或高权限父进程均不足。直接对象仍是 NJT-0089 的持久 service definition，因此跨战术扩展复用而不创建重复 NJT。
rationale_en: ATT&CK Enterprise 19.1 maps T1543 to Privilege Escalation and states that a service can be created with administrator authority and execute as root or SYSTEM. The parent is independently valid under TA0004, but elevation is confirmed only when a lower-authority writer or pre-state can influence the exact adversary-controlled service definition, the manager later executes that version with greater effective authority, and it produces the first newly authorized operation. A root or SYSTEM label, service creation, administrator action, or privileged parent process is insufficient. The direct object remains NJT-0089's durable service definition, so it is extended and reused across tactics rather than duplicated.
scope_notes_zh: TA0004 归类要求保存 writer/pre-state 权限、service object ID、定义 old/new 与版本、manager transaction、实际 execution account/token/security context、pre/post 授权集合、正向 delta 和首个新获准结果。五项 ATT&CK 子技术只作实现广度先验；既有服务身份替换与受限枚举继续复用两个 Niji 子项，但前者必须证明被替换版本跨权限边界，后者必须证明不可见对象实际产生权限结果。一次服务执行归 T1569，瞬时 create—start—delete 归 NJT-0079，目标正文/加载劫持、权限修改和容器逃逸归相邻 owner。
scope_notes_en: TA0004 classification requires writer or pre-state authority, service object ID, old and new definition plus version, manager transaction, actual execution account, token, or security context, before-and-after authorization sets, a positive difference, and the first newly authorized result. The five ATT&CK children are implementation breadth only. Established-service identity substitution and restricted enumeration reuse the two Niji children, but the former must show that the substituted version crossed an authority boundary and the latter must show that the invisible object produced an authority result. One-time service execution belongs to T1569, transient create-start-delete to NJT-0079, and target-content or loading hijack, permission modification, and container escape to neighboring owners.
