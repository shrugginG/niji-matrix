  name_en: Event Triggered Execution
  name_zh: 事件触发执行
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1546 映射到 Privilege Escalation，并说明事件 action 可由 SYSTEM 或 service account 等更高权限主体代理。Microsoft 的 permanent-subscription 安全模型、provider hosting 与 CommandLineEventConsumer local-system execution 直接支持 writer、Broker 和 effective context 的区分。直接对象仍是 NJT-0090 的 registrant—predicate—event—Broker—action 关系，故跨战术扩展复用。只有 writer/caller pre-state、被消费 exact object/version、consumer context、正向权限差和首个新获准结果完整时确认 TA0004；注册存在、root/SYSTEM、受信父进程或 action success 均不足。
rationale_en: ATT&CK Enterprise 19.1 maps T1546 to Privilege Escalation and states that an event action can be proxied by a higher-authority principal such as SYSTEM or a service account. Microsoft's permanent-subscription security model, provider hosting, and CommandLineEventConsumer local-system execution directly support separation of writer, broker, and effective context. The direct object remains NJT-0090's registrant-to-predicate-to-event-to-broker-to-action relationship and is extended and reused across tactics. TA0004 is confirmed only with writer or caller pre-state, the exact consumed object and version, consumer context, a positive authority difference, and the first newly authorized result. Registration presence, root or SYSTEM, a trusted parent, or action success is insufficient.
scope_notes_zh: 固定十八项 ATT&CK 子技术逐项覆盖并执行第二轮 taxonomy，保留两个既有 Niji 子项且新增零项。谓词轴改变 candidate/match set 与触发密度，Broker 轴改变 visible initiator 与来源；权限距离是父级 TA0004 结果门而非第三个匿迹轴。loader/debugger/shim/COM/import resolution 归 NJT-0070，脚本正文、启动描述符、服务和 scheduler 归相邻 owner；使用后回退保持 hypothesis。CASE-000115 缺 writer pre-state、consumer token 与首个新获准结果，不扩展为提权案例。
scope_notes_en: All eighteen fixed ATT&CK children received explicit coverage and a second taxonomy pass, retaining the two existing Niji children with no new child. The predicate axis changes candidate or matching set and activation density, while the broker axis changes visible initiator and provenance. Authority distance is the parent TA0004 outcome gate rather than a third evasion axis. Loader, debugger, shim, COM, and import resolution belong to NJT-0070, while script content, boot descriptors, services, and schedulers have adjacent owners. Post-use reversion remains a hypothesis. CASE-000115 lacks writer pre-state, consumer token, and first newly authorized result and is not extended into an elevation case.
