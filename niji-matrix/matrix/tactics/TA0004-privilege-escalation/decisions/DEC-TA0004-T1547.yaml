id: DEC-TA0004-T1547
tactic_ref: TA0004
candidate:
  source_type: attack
  source_attack_id: T1547
  source_attack_version: '19.1'
  name_en: Boot or Logon Autostart Execution
  name_zh: 启动或登录自启动执行
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1547 明确映射到 Privilege Escalation，并说明部分启动或登录自启动程序以更高权限运行，攻击者可以借此提升权限。该行为在 TA0004 下独立成立，但只有在攻击者控制的持久映射由生命周期 consumer 激活后，使目标执行上下文相对 writer 或 pre-state 获得有效权限增量时才属于本战术；同权限的用户级恢复只承担 Persistence。直接对象仍是 NJT-0084 的持久激活映射，因此本决议跨战术扩展复用 NJT-0084，而不创建重复技术。
rationale_en: ATT&CK Enterprise 19.1 explicitly maps T1547 to Privilege Escalation and states that some boot or logon autostart programs run with higher privileges that an adversary can leverage. The behavior is independently valid under TA0004, but it belongs to this tactic only when an adversary-controlled durable mapping is activated by a lifecycle consumer and gives the target execution context greater effective authority than the writer or pre-state. Same-authority user-context restoration serves Persistence only. The direct object remains NJT-0084's durable activation mapping, so this decision extends and reuses NJT-0084 across tactics instead of creating a duplicate.
scope_notes_zh: TA0004 归类要求保留 writer 或 pre-state 权限、descriptor/target、boot 或 logon 边界、consumer 进程或模块及其 token/security context、权限 delta 和首个新获准高权限结果。高权限目录、HKLM、系统父进程、LSA/Winlogon/spooler 或 kernel 名称本身都不能证明提权。十四项 ATT&CK 子技术不导入；更新主题描述符、既有描述符目标替换和会话恢复队列三个 Niji 子项继续按各自 stable key 复用，并共同受同一 TA0004 结果门约束。初始化脚本、服务、调度、其他事件触发和加载劫持仍归相邻 owner。
scope_notes_en: TA0004 classification must retain writer or pre-state authority, descriptor and target, boot or logon boundary, consumer process or module and its token or security context, authority delta, and the first newly authorized privileged outcome. A privileged directory, HKLM, system parent, LSA, Winlogon, spooler, or kernel label does not itself prove elevation. The fourteen ATT&CK children are not imported. Update-themed descriptor camouflage, established-descriptor target substitution, and session-restoration queue injection are reused under their own stable keys and share the same TA0004 outcome gate. Initialization scripts, services, scheduling, other event triggers, and load hijacking remain with neighboring owners.
