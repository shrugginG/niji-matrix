id: DEC-TA0004-T1548
tactic_ref: TA0004
candidate:
  source_type: attack
  source_attack_id: T1548
  source_attack_version: '19.1'
  name_en: Abuse Elevation Control Mechanism
  name_zh: 滥用权限提升控制机制
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 直接证明该父技术通过规避或滥用原生提权控制获得更高权限，与 TA0004 直接相关。Niji 将它适配为“权限提升控制路径滥用”，把直接对象限定为从较低权限请求经授权控制到更高有效权限的因果路径，并从六项实现维度收敛出“受信中介谱系”和“短寿命权限窗口”两个攻击者可控、改变痕迹与防御的匿迹变量。此适配不导入 ATT&CK 子技术。
rationale_en: >-
  Enterprise ATT&CK 19.1 directly establishes that the parent technique obtains higher privilege by circumventing or abusing native elevation controls, making it directly relevant to TA0004. Niji adapts it as Elevation-Control Path Abuse, limiting the direct object to the causal path from a lower-privilege request through authorization control to higher effective privilege. Six implementation dimensions converge on two adversary-controlled stealth variables with trace and defense effects: trusted-intermediary lineage and temporary privilege lifetime. The adaptation imports no ATT&CK sub-technique.
scope_notes_zh: 软件漏洞提权归 T1068；Windows 访问令牌本身的操纵归 T1134；新增持久角色、组、凭据或委派边归 T1098/NJT-0083；仅使用既有高权限账户或执行普通管理员操作不成立。setuid/setgid 保留为父级执行身份转换实现，提示缺失归控制路径结果，均不机械拆为 Niji 子技术。
scope_notes_en: Software-exploit elevation belongs to T1068, manipulation of a Windows access token itself to T1134, addition of durable roles, groups, credentials, or delegation edges to T1098 and NJT-0083, and mere use of an already-privileged account or ordinary administrative action is insufficient. Setuid and setgid remain parent-core execution-identity implementations and prompt absence a control-path outcome; neither is mechanically split into a Niji child.
gap_statement_zh: ATT&CK 以六项操作系统与云实现组织 T1548，但没有跨实现区分“受信中介改变可见来源谱系”和“短寿命权限改变可见时间窗口”这两类匿迹变量及其防御差异。
gap_statement_en: ATT&CK organizes T1548 as six operating-system and cloud implementations but does not distinguish the cross-implementation stealth variables and defense differences of trusted intermediaries changing visible provenance lineage and short-lived privilege changing the visible time interval.
original_attack_subtechniques_imported: false
resulting_technique_ref: NJT-0098
