candidate:
  source_type: attack
  source_attack_id: T1611
  source_attack_version: '19.1'
  name_en: Escape to Host
  name_zh: 逃逸到主机
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 将 T1611 明确映射到 Privilege Escalation，涵盖容器/虚拟化环境越过隔离边界访问底层宿主。Niji 适配为“隔离工作负载至宿主权限逃逸”，把直接对象固定为 container/guest pre-state 经边界 primitive 或宿主 Broker 转换到 canonical host resource/effective host context，并要求正向权限差与首个 host-only outcome。固定 ATT&CK 没有子项；开放搜索收敛出“宿主资源命名空间别名投射”和“宿主 Broker 逃逸来源转换”两个 Niji-native 匿迹变量，未按平台、CVE、能力或工具导入分类。
rationale_en: Enterprise ATT&CK 19.1 explicitly maps T1611 to Privilege Escalation and covers crossing from a container or virtualized environment into the underlying host. Niji adapts it as Isolated-Workload-to-Host Authority Escape and fixes the direct object as transition from container or guest pre-state through a boundary primitive or host broker into a canonical host resource or effective host context, requiring a positive authority difference and first host-only outcome. Fixed ATT&CK has no children. Open search converges on two Niji-native evasion variables, Host-Resource Namespace-Alias Projection and Host-Broker Escape-Provenance Translation, without importing classifications by platform, CVE, capability, or tool.
scope_notes_zh: 容器内 UID 0、privileged/hostPID/hostNetwork、mount/socket、CVE exploit 或 host credential discovery 只是能力、前提或中间迹象。漏洞利用本身归相邻 T1068；新容器部署执行归 NJT-0067；服务/调和定义与镜像复现归 NJT-0089/NJT-0092。只有能够标明 pre-state、越界、宿主上下文/资源、正权限差和首个宿主专属结果的链才属于本对象。
scope_notes_en: Container UID 0, privileged mode, hostPID or hostNetwork, a mount or socket, CVE exploitation, or host-credential discovery is only a capability, prerequisite, or intermediate indicator. Exploitation itself is adjacent T1068, new-container deployment execution belongs to NJT-0067, and service or reconciliation definitions and image recurrence belong to NJT-0089 and NJT-0092. This object requires a chain identifying pre-state, crossing, host context or resource, positive authority difference, and first host-only result.
gap_statement_zh: ATT&CK 用 escape primitive 和平台实现组织 T1611，但没有把“容器进程经 namespace alias 直接访问宿主规范资源”与“原容器请求由宿主 Broker 转换为 daemon/helper/new-workload 结果”建模为互斥痕迹拓扑，也未给出两者分别需要的 canonical-resource 与 request-to-broker 关联。
gap_statement_en: ATT&CK organizes T1611 by escape primitives and platform implementations but does not model a container process directly accessing a canonical host resource through a namespace alias versus an original container request translated by a host broker into a daemon, helper, or new-workload result as distinct trace topologies, nor define their respective canonical-resource and request-to-broker joins.
