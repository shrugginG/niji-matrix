research:
  limitations:
    paragraphs:
    - zh: Glupteba 直接观察支持 Windows 受信父进程实现，Microsoft、Apple 与 Google 官方文档支持其他平台的中介与字段结构；跨平台“攻击者有意借用信誉”仍是强推断，不能把所有合法 broker、TCC-approved
        app 或 service-account impersonation 自动归为匿迹。缺少原始 caller 的日志既可能是平台设计，也可能是采集失败。
      en: Direct Glupteba observation supports the Windows trusted-parent implementation, while Microsoft, Apple, and Google
        documentation supports intermediary and field structures on other platforms. Deliberate cross-platform borrowing of
        reputation remains a strong inference, so not every legitimate broker, TCC-approved application, or service-account
        impersonation can be labeled stealth. Missing original-caller data can reflect platform design or collection failure.
    - zh: 中介谱系与短寿命窗口可在同一云 impersonation 事件中共现；本项只主张可见 executor 与 original requester 分离及其图谱防御差异，不把 token duration 作为成立条件。若未来平台强制不可变端到端双身份事务且检测普遍使用该链，本项的实际匿迹收益应下调，但
        taxonomy 边界仍可保留用于评估控制完整性。
      en: Intermediary lineage and temporary lifetime can coexist in one cloud impersonation event. This child claims only
        separation of visible executor from original requester and its graph-defense difference and does not require token
        duration. If platforms later enforce immutable end-to-end dual-identity transactions that detection universally consumes,
        practical stealth benefit should be downgraded, while the taxonomy boundary can remain useful for control-integrity
        assessment.
