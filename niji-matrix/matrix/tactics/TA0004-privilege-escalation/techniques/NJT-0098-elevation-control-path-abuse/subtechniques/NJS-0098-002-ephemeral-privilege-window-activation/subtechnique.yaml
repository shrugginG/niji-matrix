research:
  limitations:
    paragraphs:
    - zh: 官方资料能够证明 sudo 缓存、云端即时权限和服务身份模拟具有明确寿命，并会改变状态快照与关联需求；公开活动报告较少直接说明攻击者为匿迹而选择短窗口。因此该变量和观察效果具有较强支持，但具体事件中的主观意图需要单独取证。
      en: Official material establishes that sudo caches, cloud just-in-time authority, and service-identity impersonation
        have bounded lifetimes and change state snapshots and correlation requirements. Public activity reporting less often
        states that an adversary chose a short window for evasion. The variable and its observation effect are well supported,
        but intent in a particular event requires separate evidence.
    - zh: 缓存、令牌和角色激活的结束语义并不统一；界面显示失效、批准期结束、令牌过期和实际授权停止可能发生在不同时间，时钟或采集延迟也会制造窗口外使用的假象。结论必须依据本地平台的实际有效期和资源行为，而不是采用统一时长。
      en: Cache, token, and role-activation end semantics are not uniform. Interface deactivation, approved-end time, token
        expiry, and actual authorization loss can occur at different times, and clock or ingestion delay can create the appearance
        of use outside the window. Conclusions must use the local platform's effective lifetime and resource behavior rather
        than a universal duration.
