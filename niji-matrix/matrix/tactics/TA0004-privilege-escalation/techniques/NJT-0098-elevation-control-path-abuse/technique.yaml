subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两个子技术按受信中介谱系和权限存在时间划分。受信提权中介谱系借用改变资源操作所呈现的可见执行者，使原始请求者与高权限结果分离；短寿命权限窗口激活改变权限状态的持续时间，使授权、使用和失效分散在有限区间。
      en: The two children are partitioned by trusted-intermediary lineage and authority lifetime. Trusted Elevation Intermediary
        Lineage Borrowing changes the visible executor associated with a resource operation, separating the original requester
        from the privileged result. Ephemeral Privilege-Window Activation changes how long the authority state exists, distributing
        authorization, use, and expiry across a bounded interval.
    - zh: 平台、授权提示、权限位、受保护数据类别和云服务名称只是实现属性。两个变量可以共同出现，但一个需要恢复请求者到中介再到结果的谱系，另一个需要恢复激活到失效的时间区间，因此保持独立边界。
      en: Platforms, authorization prompts, privilege bits, protected-data classes, and cloud-service names are implementation
        properties. The two variables can coexist, but one requires reconstruction from requester through intermediary to
        outcome and the other reconstruction of an activation-to-expiry interval, so their boundaries remain distinct.
  coverage: established
  subtechnique_refs:
  - NJS-0098-001
  - NJS-0098-002
