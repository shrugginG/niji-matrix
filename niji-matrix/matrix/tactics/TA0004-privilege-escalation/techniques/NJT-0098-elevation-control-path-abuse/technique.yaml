research:
  limitations:
    paragraphs:
    - zh: 平台文档和现场案例能够证明受信中介、临时授权状态以及相应的观察差异，但不能证明每次正常授权、sudo 缓存、已批准应用或云临时访问都由匿迹目的驱动。受信中介的现场证据较强；短寿命窗口更多依赖实现语义和观察效果，具体攻击意图需要事件证据补充。
      en: Platform documentation and field cases establish trusted intermediaries, temporary authority state, and their observation
        differences, but they do not show that every normal authorization, sudo cache, approved application, or temporary
        cloud access is chosen for evasion. Field evidence is stronger for trusted intermediaries; ephemeral windows rely
        more on implementation semantics and observation effects, so event-specific evidence is needed to establish adversary
        intent.
    - zh: 日志支持因平台、版本和配置而异。授权事务、真实与有效身份、缓存时间、应用归因链、角色激活、委派关系和令牌失效可能只在部分环境可见；部分新保护功能仍处于预览或有限部署状态。缺少稳定关联键时，结论必须限制在能够直接观察的控制路径或时间窗口。
      en: Logging support varies by platform, version, and configuration. Authorization transactions, real and effective identity,
        cache timing, application attribution chains, role activation, delegation, and token expiry may be visible only in
        some environments, while newer protection features can remain in preview or limited deployment. Without stable correlation
        keys, conclusions remain limited to the control path or time window directly observed.
