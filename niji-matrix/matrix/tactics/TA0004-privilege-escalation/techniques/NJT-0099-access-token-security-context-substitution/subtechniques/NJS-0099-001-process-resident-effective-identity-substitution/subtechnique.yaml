research:
  limitations:
    paragraphs:
    - zh: Microsoft 文档直接证明进程主令牌、线程模拟令牌与 SetThreadToken 状态，但不会把合法 API 语义定性为攻击。ATT&CK 证明攻击者可把复制或新建令牌用于现有进程/线程；公开 Lotus Blossom
        报告只说明取得另一进程令牌并调整启动权限，没有发布完整 TID/token sequence。因此子技术存在性为高置信，单个活动归因仍必须观察线程有效身份与高权限消费，CASE-000123 只挂父级。
      en: Microsoft documentation directly establishes process primary token, thread impersonation token, and SetThreadToken
        state without classifying legitimate API semantics as attack. ATT&CK establishes adversary use of duplicated or created
        tokens on existing processes or threads. Public Lotus Blossom reporting states that another process token was retrieved
        and launch privilege adjusted but does not publish a full TID and token sequence. Child existence is therefore high
        confidence, while attribution of an event still requires thread effective identity and privileged consumption; CASE-000123
        remains attached to the parent only.
    - zh: 多数通用进程日志不记录 TID 的 effective token，部分 EDR 只在进程创建时记录用户；远程认证又可能采用网络凭据而非本地模拟级别。身份差异、句柄访问和敏感操作在缺少稳定 token ID 时只能按短窗口推断，PID
        复用与异步线程池会产生错误连接。未来案例需要公开 assignment/removal、AuthenticationId、TID 和具体资源结果，才能验证不同服务模型下的实际匿迹强度。
      en: Most generic process logs do not record TID effective token and some EDR products record user only at process creation,
        while remote authentication can use network credentials rather than local impersonation level. Without stable token
        ID, identity difference, handle access, and sensitive operation can be joined only by a short inference window, creating
        errors under PID reuse and asynchronous thread pools. Future cases should expose assignment and removal, AuthenticationId,
        TID, and concrete resource outcome to validate practical stealth across service models.
