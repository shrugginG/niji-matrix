research:
  limitations:
    paragraphs:
    - zh: Microsoft 文档直接证明令牌化进程创建、显式父体选择和相关审计字段，但不会揭示攻击者意图。DarkGate 将父进程欺骗与隐藏监控视图联系起来，却未证明权限增加；PipeMon 则把该行为记录在持续的权限提升序列中。因此可见谱系分离的匿迹结论可以由
        DarkGate 支持，而权限提升结论仍需要更高权限结果。
      en: Microsoft documentation directly establishes token-based process creation, explicit parent selection, and relevant
        audit fields but does not reveal adversary intent. DarkGate links parent-process spoofing to hiding from monitoring
        views without proving authority gain, while PipeMon records the behavior within a continuing privilege-escalation
        sequence. DarkGate can therefore support the stealth conclusion from visible lineage separation, while a privilege-escalation
        conclusion still requires a higher-authority outcome.
    - zh: 不同事件源对创建者、父体和目标主体的语义并不相同，公开案例也很少同时提供来源令牌、实际调用者、显示父体和后继结果。缺失独立视角时只能确认谱系不完整，不能断言攻击者控制；正常用户账户控制、服务代理和安全沙箱仍是重要反例。
      en: Event sources differ in the semantics of creator, parent, and target subject, and public cases rarely expose source
        token, actual caller, displayed parent, and successor outcome together. With no independent viewpoint, only incomplete
        lineage can be established rather than adversary control. Normal user account control, service brokers, and security
        sandboxes remain important counterexamples.
