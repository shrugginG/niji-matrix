research:
  limitations:
    paragraphs:
    - zh: Microsoft 文档直接说明权限调整的前提、变化前状态以及不能增加不存在权限的边界；现场报告分别观察到调试和驱动加载权限被启用并用于后继动作。这些来源没有证明攻击者总会在使用后恢复状态，或总会选择最小权限集合，因此本子技术只主张已存在权限的选择性激活及其观察差异。
      en: Microsoft documentation directly establishes privilege-adjustment prerequisites, previous state, and the boundary
        that absent privileges cannot be added. Field reports separately observe debugging and driver-loading privileges enabled
        for downstream actions. The sources do not show that adversaries always restore state after use or always select a
        minimum privilege set, so this child claims only selective activation of an existing privilege and its observation
        difference.
    - zh: 权限存在、启用和被操作实际消费是三项不同事实。部分安全日志只记录登录时授予的 special privileges，不显示 disabled/enabled 状态；成功 API 返回也可能伴随 ERROR_NOT_ALL_ASSIGNED，某些受保护进程/驱动策略仍会阻止结果。高置信检测必须观察前后态和匹配结果；缺少任一项时应降低结论，而不能从权限名称推断已提权。
      en: Privilege presence, enablement, and actual consumption by an operation are three different facts. Some security
        logs record special privileges assigned at logon without disabled or enabled state; a successful API return can still
        accompany ERROR_NOT_ALL_ASSIGNED, and protected-process or driver policy can prevent the outcome. High-confidence
        detection requires before and after state plus a matching result. Missing any element lowers the conclusion rather
        than inferring elevation from privilege name.
