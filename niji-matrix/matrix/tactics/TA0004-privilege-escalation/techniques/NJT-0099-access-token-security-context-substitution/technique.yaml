research:
  limitations:
    paragraphs:
    - zh: Windows 提供稳定令牌模型，但不同传感器并不一致暴露线程有效令牌、token ID、AuthenticationId、实际调用者、显示父级和权限前态。Microsoft 文档证明能力和字段语义，案例分别证明真实活动及部分观察影响；除
        DarkGate 明确以监控规避为目的外，攻击者选择这些路径以匿迹的结论主要是结合行为、痕迹变化和防御依赖的强推断，不能把每次合法 token API 调用定性为攻击。
      en: Windows provides a stable token model, but sensors do not consistently expose thread effective token, token ID,
        AuthenticationId, actual caller, displayed parent, and privilege prior state. Microsoft documentation establishes
        capability and field semantics, while cases separately establish real activity and some observation effects. Except
        for DarkGate's explicit monitoring-evasion purpose, deliberate selection for stealth is mainly a strong inference
        from behavior, trace change, and defensive dependence and cannot label every legitimate token API call an attack.
    - zh: 对进程驻留式有效身份替换，公开 Lotus Blossom 材料没有完整 thread token 序列；其正式边界主要由 Windows 线程模拟模型和 ATT&CK 行为共同支持，实际事件必须观察有效令牌与资源消费。对新进程权威谱系解耦，DarkGate
        证明观察影响但不证明 权限提升，PipeMon 才提供提权序列；因此规则必须要求更高上下文结果，不能把所有 PPID mismatch 归入本技术。
      en: For process-resident effective-identity substitution, public Lotus Blossom material lacks a complete thread-token
        sequence; the formal boundary rests primarily on the Windows impersonation model plus ATT&CK behavior, and an event
        must observe effective token and resource consumption. For new-process authority-lineage decoupling, DarkGate establishes
        observation impact but not Privilege Escalation, while PipeMon supplies the elevation sequence. Rules must therefore
        require a higher-context outcome rather than assign every PPID mismatch to this technique.
    - zh: 休眠权限激活的现场证据集中在少数 Windows 权限，不能外推到所有权限、版本和驱动保护配置。SID-History 直接改变目录中的持久授权状态，因此由既有身份访问状态操纵负责；延迟使用和仅启用最小权限集合目前缺少足够证据，本技术不对这些行为作独立分类。
      en: Field evidence for dormant-privilege activation is concentrated in a small set of Windows privileges and cannot
        be generalized to every privilege, version, or driver-protection configuration. SID-History directly changes durable
        authorization state in the directory and therefore belongs to Existing-Identity Access-State Manipulation. Delayed
        use and activation of only a minimum privilege set lack sufficient evidence and are not classified independently here.
