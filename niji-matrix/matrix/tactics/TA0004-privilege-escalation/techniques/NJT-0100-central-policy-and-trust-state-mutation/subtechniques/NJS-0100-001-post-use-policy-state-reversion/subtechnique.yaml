research:
  limitations:
    paragraphs:
    - zh: ATT&CK 说明攻击者可能临时修改策略、执行恶意动作后再恢复，平台文档也证明旧值、新值、发起者和信任消费字段可能可用。但公开来源尚未提供一条同时包含完整恶意中间版本、已确认消费者、权限增加、资源使用和恢复的独立活动案例，因此攻击者的匿迹目的、跨实现普遍性和事件级成功仍包含较强推断，置信度保持中等。
      en: ATT&CK states that an adversary can temporarily change policy, perform malicious actions, and restore the prior
        state, while platform documentation shows that prior and new values, actor, and trust-consumption fields can be available.
        Public sources have not yet provided one independent activity case containing a complete malicious intermediate version,
        confirmed consumer, authority increase, resource use, and restoration together. Adversary stealth intent, cross-implementation
        generality, and event-level success therefore still require substantial inference and remain medium confidence.
    - zh: 正常回滚、自动修复、证书轮换、复制冲突和失败部署可以产生相同时间形状，两个方向相反且时间接近的变更并不能证明“用后”。目录与策略文件的双重状态、云审计保留期和消费者遥测还可能使中间版本不完整；缺少版本历史或消费记录时，只能确认当前状态，不能推断先前的恶意使用。
      en: Normal rollback, automated repair, certificate rotation, replication conflict, and failed deployment can produce
        the same timing pattern. Two nearby changes in opposite directions do not prove post-use reversion. Dual directory
        and policy-file state, cloud-audit retention, and consumer telemetry can also leave an incomplete intermediate version.
        Without version history or consumption records, only current state can be established and prior malicious use cannot
        be inferred.
