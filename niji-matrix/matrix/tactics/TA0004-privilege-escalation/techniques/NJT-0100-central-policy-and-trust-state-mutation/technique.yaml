research:
  limitations:
    paragraphs:
    - zh: ATT&CK 与平台文档直接支持集中策略或信任变更、传播、消费以及临时修改和恢复，但公开材料很少在同一事件中同时给出攻击者意图、完整恶意版本、消费者、权限变化和恢复。跨实现的匿迹机理因此包含推断，不能把每次短期管理变更都描述为匿迹。
      en: ATT&CK and platform documentation directly support centralized policy or trust change, propagation, consumption,
        and temporary modification and restoration, but public material rarely provides adversary intent, a complete malicious
        version, consumer use, authority change, and restoration in one event. Cross-implementation stealth mechanisms therefore
        include inference and do not justify describing every short-lived administrative change as evasion.
    - zh: Solorigate 资料直接证明攻击者向联合信任加入证书并改变令牌接受，但公开信息没有完整展示新增权限；另一案例证明集中组策略扇出，却被阻止且主要服务于防御破坏和载荷分发。两者都不能单独证明用后状态回退，因此该子技术仍需逐事件的版本历史和消费证据。
      en: Solorigate reporting directly establishes addition of an adversary certificate to federation trust and changed token
        acceptance, but public information does not fully establish added authority. Another case establishes centralized
        Group Policy fan-out but was blocked and primarily served defense impairment and payload distribution. Neither independently
        proves post-use state reversion, so the child still requires event-specific version history and consumption evidence.
    - zh: 不同平台的可观察性并不等价。目录审计可能依赖额外配置，策略的目录与文件组件可能存在复制延迟或版本不一致，身份平台也可能只暴露当前联合状态、有限旧值或较短保留期。若资源侧不记录采用的策略或信任版本，就难以把控制面变化与实际授权结果连接。
      en: Observability is not equivalent across platforms. Directory audit can depend on additional configuration, directory
        and file components of policy can have replication delay or version mismatch, and identity platforms can expose only
        current federation state, limited prior values, or short retention. If resource-side records omit the applied policy
        or trust version, linking control-plane change to actual authorization outcome becomes difficult.
