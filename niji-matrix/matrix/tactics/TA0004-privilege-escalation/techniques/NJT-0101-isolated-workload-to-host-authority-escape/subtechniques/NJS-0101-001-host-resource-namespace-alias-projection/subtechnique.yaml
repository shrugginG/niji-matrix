research:
  limitations:
    paragraphs:
    - zh: Linux hostPath/device 与 Windows global symbolic link 有官方语义、实战案例和实验检测研究共同支撑，能够高置信定义 stable key 与防御差异；但 file event
        中 canonical identity 的可得性随 kernel、audit/eBPF sensor、overlay driver、Windows ETW/EDR 与 runtime 变化。缺少 inode/file ID 或历史
        mount state 时，只能以 path/hash/node 做概率连接，不能把所有同名访问判为宿主对象。
      en: Linux hostPath or device behavior and Windows global symbolic links have joint support from official semantics,
        activity cases, and experimental detection research, allowing high-confidence definition of the stable key and defense
        difference. Availability of canonical identity in file events varies by kernel, audit or eBPF sensor, overlay driver,
        Windows ETW or EDR, and runtime. Without inode or file ID or historical mount state, only probabilistic joins through
        path, hash, and node are possible, and same-named accesses cannot all be classified as host objects.
    - zh: 合法 observability、backup、storage、device 和 incident-response workloads 广泛使用 host mappings，单个危险路径会有高误报。Siloscape 强力证明
        Windows alias，TeamTNT 强力证明 Linux host-root mapping，但 VM shared folder、registry/named object、GPU/device 与 leaked descriptor
        的跨实现推广仍需各自验证 canonical mapping 与攻击者控制。若结果由 daemon 而非原 process 执行，应同时或改用 NJS-0101-002，避免把所有间接宿主结果归入本项。
      en: Legitimate observability, backup, storage, device, and incident-response workloads widely use host mappings, so
        a dangerous path alone creates high false positives. Siloscape strongly establishes a Windows alias and TeamTNT a
        Linux host-root mapping, but cross-implementation generalization to VM shared folders, registry or named objects,
        GPUs or devices, and leaked descriptors requires validation of canonical mapping and adversary control. When a daemon
        rather than the original process executes the result, NJS-0101-002 applies additionally or instead, avoiding absorption
        of every indirect host outcome into this child.
