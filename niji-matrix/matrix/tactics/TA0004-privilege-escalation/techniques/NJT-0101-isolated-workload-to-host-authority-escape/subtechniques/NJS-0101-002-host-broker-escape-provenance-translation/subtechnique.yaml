research:
  limitations:
    paragraphs:
    - zh: Docker 官方文档直接证明 rootful daemon、control socket/API 与宿主 root 效果之间的权限语义；PACED 直接复现 runtime/helper 的跨 namespace 来源链；TeamTNT
        实战镜像直接包含 Docker TCP/UNIX socket escape 分支与 privileged child-container 参数。这些足以高置信定义来源转换和检测键，但 Aqua 对 socket 分支使用 attempts/if
        successful 描述，没有逐 victim 发布完整 request→daemon→host result，因此本项在 CASE-000128 的事件成功为 medium，不能把工具存在当成已逃逸。
      en: Docker documentation directly establishes authority semantics among a rootful daemon, its control socket or API,
        and host-root effects. PACED directly reproduces cross-namespace provenance through runtime or helpers. TeamTNT images
        used in attacks directly contain Docker TCP or UNIX-socket escape branches and privileged-child-container parameters.
        This supports high-confidence definition of provenance translation and detection keys, but Aqua describes socket branches
        as attempts or conditional on success and does not publish a complete request-to-daemon-to-host-result chain for each
        victim. Event success for this child in CASE-000128 therefore remains medium, and tool presence is not successful
        escape.
    - zh: Docker 和 containerd 证据不能自动覆盖所有 kubelet、CRI、Windows 服务、ESXi 或云控制面实现。推广时必须验证 Broker 的实际权限高于原工作负载，并保留从调用者和请求到宿主事务的关系；某些
        UNIX 套接字缺少逐请求审计，网关可能只保存远端主体，回调也可能没有事务标识，因此来源恢复能力随平台显著变化。
      en: Evidence from Docker and containerd does not automatically cover every kubelet, CRI, Windows service, ESXi, or cloud-control
        implementation. Extension requires proof that the broker has greater effective authority than the original workload
        and preservation of the relationship from caller and request to host transaction. Some UNIX sockets lack per-request
        audit, gateways may retain only the remote principal, and callbacks may lack transaction identifiers, so provenance
        recovery varies substantially by platform.
