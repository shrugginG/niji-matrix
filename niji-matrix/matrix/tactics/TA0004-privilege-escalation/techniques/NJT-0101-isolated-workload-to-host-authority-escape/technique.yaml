research:
  limitations:
    paragraphs:
    - zh: 公开资料能够支持隔离边界跨越、两种痕迹拓扑和相应防御键，但很少同时公开工作负载原始权限、越界后的宿主权限以及逐资源授权结果。案例中的权限增加通常依据隔离保证和实际宿主文件或命令结果推断，因此具体事件仍需本地证据确认跨越和宿主效果。
      en: Public material supports isolation-boundary crossing, the two trace topologies, and their defensive keys, but rarely
        publishes original workload authority, post-crossing host authority, and per-resource authorization outcomes together.
        Authority gain in cases is usually inferred from isolation guarantees and actual host-file or command results, so
        event-specific crossing and host effect still require local evidence.
    - zh: 证据最强地覆盖 Linux containers/Docker/Kubernetes 与 Windows server containers。ATT&CK 把 ESXi 纳入 T1611，但当前材料不足以断言每种 hypervisor
        escape 都具有 alias 或 Broker 匿迹轴；未满足相应 stable key 时只使用父级。Linux Audit、eBPF、runtime 和 EDR 对 container ID、namespace、inode
        与 request 的字段可得性因版本和产品而异；短命 workload、加密 API、rootless runtime 和远程 control plane 还会改变采集点。检测必须显式记录 coverage gap，不能把遥测缺失解释为未逃逸。
      en: Evidence is strongest for Linux containers with Docker or Kubernetes and Windows server containers. ATT&CK includes
        ESXi in T1611, but current material does not justify claiming every hypervisor escape has alias or broker evasion.
        Parent scope applies when the corresponding stable key is absent. Availability of container ID, namespace, inode,
        and request fields in Linux Audit, eBPF, runtime, and EDR varies by version and product, while short-lived workloads,
        encrypted APIs, rootless runtimes, and remote control planes change collection points. Detection must expose coverage
        gaps and must not interpret missing telemetry as no escape.
