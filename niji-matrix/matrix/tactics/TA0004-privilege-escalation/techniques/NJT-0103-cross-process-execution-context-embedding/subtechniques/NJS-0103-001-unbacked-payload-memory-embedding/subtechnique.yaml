research:
  limitations:
    paragraphs:
    - zh: 结论材料集中在 Windows shellcode/manual mapping；Linux/macOS 只有在 executed region 与 backing 差、source mutation 和 dispatch
        都可证时才能归入。RWX/private memory prevalence 会随 JIT、browser 和 security tooling 变化，不能用固定阈值跨组织外推。
      en: Conclusion material concentrates on Windows shellcode and manual mapping. Linux or macOS qualifies only when executed-region
        backing difference, source mutation, and dispatch are all proved. RWX and private-memory prevalence varies with JIT,
        browsers, and security tooling and fixed thresholds do not transfer across organizations.
    - zh: DueDLLigence 是授权研究，不是 prevalence 证据；Microsoft 也强调合法 API/内存用途。若 sensor 只采 event metadata 不采 content，最多确认 backing_anomaly
        或 injection_probable；不能凭 region type 宣称 payload 或权限结果。
      en: DueDLLigence is authorized research rather than prevalence evidence, and Microsoft also emphasizes legitimate API
        and memory uses. A sensor collecting event metadata without content can establish at most backing_anomaly or injection_probable
        and cannot claim payload or authority result from region type.
