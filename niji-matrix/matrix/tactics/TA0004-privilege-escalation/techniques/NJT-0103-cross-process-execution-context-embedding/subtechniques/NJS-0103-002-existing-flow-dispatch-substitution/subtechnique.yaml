research:
  limitations:
    paragraphs:
    - zh: 最高强度现场证据是 Windows Ursnif TLS callback；APC/thread hijack 由 Microsoft 技术与受控研究支持。vDSO、ListPlanting 和其他 message/callback
        实现只有在同一 control key 与 trace chain 被本地证明时收敛，不能由 ATT&CK 名称自动纳入。
      en: The strongest field evidence is the Windows Ursnif TLS callback, while APC and thread hijacking rely on Microsoft
        technical and controlled research. vDSO, ListPlanting, and other message or callback implementations converge only
        when the same control key and trace chain are locally proved and never from an ATT&CK name alone.
    - zh: 完整的异步回调队列、寄存器时间线或首段指令遥测很少默认采集，调用栈采样也可能发生在载荷返回之后。缺少这些字段时只能看到可疑的线程或回调状态；没有创建远程线程并不能反向证明攻击者一定复用了既有执行流。
      en: Complete asynchronous-callback queues, register timelines, or first-instruction telemetry are rarely collected by
        default, and stack sampling can occur after the payload returns. Without those fields only suspicious thread or callback
        state may be visible. Absence of remote-thread creation does not prove that the adversary reused an existing execution
        flow.
