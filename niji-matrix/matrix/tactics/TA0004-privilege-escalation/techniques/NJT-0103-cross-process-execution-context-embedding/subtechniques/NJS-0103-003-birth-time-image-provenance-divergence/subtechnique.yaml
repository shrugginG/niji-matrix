research:
  limitations:
    paragraphs:
    - zh: Dofoil 证明 hollowing field use；doppelgänging/herpaderping/ghosting 主要由平台研究说明。它们共享的来源差有结论支持，但不能从一个变体推断另一个变体的 API、成功率或
        detection coverage。非 Windows 等价过程必须重新证明 birth file/image/first-instruction 三层。
      en: Dofoil establishes field use of hollowing, while doppelganging, herpaderping, and ghosting rely mainly on platform
        research. Their shared provenance difference has conclusion support, but one variant cannot establish another's APIs,
        success rate, or detection coverage. A non-Windows equivalent must re-prove birth file, image, and first-instruction
        layers.
    - zh: EDR 和安全回调的时序属于实现细节，并会随操作系统和产品版本变化。Sysmon Event 25 是有用信号但不能覆盖全部实现，事件缺失也不能证明没有篡改。若只有事后内存与文件不一致，却没有来源进程或创建事务，映像来源只能保持不确定。
      en: EDR and security-callback timing is an implementation detail that changes with operating-system and product versions.
        Sysmon Event 25 is useful but does not cover every implementation, and absence of the event does not prove that tampering
        did not occur. When only a later memory-to-file mismatch is available without a source process or creation transaction,
        image provenance remains uncertain.
