research:
  limitations:
    paragraphs:
    - zh: Mandiant 红队来源明确证明 detection rationale 和可控性，但不是未授权 prevalence；VEILEDSIGNAL 证明 browser/C2 field selection，却没有声明 role
        conformity 是唯一动机。高置信来自机制与字段案例联合，不能推广为所有 browser 或 svchost 注入。
      en: Mandiant red-team reporting explicitly establishes detection rationale and controllability but not unauthorized
        prevalence. VEILEDSIGNAL proves field browser and C2 selection without stating role conformity as the sole motive.
        High confidence comes from combining mechanism and field case and cannot generalize to every browser or svchost injection.
    - zh: 如果组织没有按角色、版本和配置保存批准模块与目的地基线，常见进程执行常见动作时就很难验证角色贴合。目标选择逻辑通常只存在于恶意代码内存中并可能丢失；只有单一目标而缺少载荷目的与角色的独立证据时，不能确认攻击者有意选择了贴合角色的上下文。
      en: If an organization does not retain approved modules and destinations by role, version, and profile, it becomes difficult
        to validate role conformity when a common process performs a common action. Target-selection logic often exists only
        in malware memory and can be lost. A single observed target without independent evidence of payload purpose and role
        does not establish deliberate selection of a role-conforming context.
