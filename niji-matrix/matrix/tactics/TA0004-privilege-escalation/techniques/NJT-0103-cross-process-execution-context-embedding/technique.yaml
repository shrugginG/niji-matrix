research:
  limitations:
    paragraphs:
    - zh: 四个观察变量的直接案例和技术材料主要来自 Windows。Linux 的跨进程访问控制和 macOS 运行时保护能够证明平台边界，但没有为每个子技术提供同等强度的现场案例；跨平台映射必须重新证明相同的痕迹属性，而不能复制 Windows
        事件字段。
      en: Direct cases and technical material for the four observation variables are concentrated on Windows. Cross-process
        access control on Linux and runtime protections on macOS establish platform boundaries but do not provide equally
        strong field cases for every child. Cross-platform mapping must re-establish the same trace property rather than copy
        Windows event fields.
    - zh: 公开报告可以证明进程注入和相应观察变量，但通常没有完整提供源与目标的权限状态或由嵌入代码完成的新资源访问。因此这些案例不能单独证明权限提升，具体事件仍需要本地权限和资源结果。
      en: Public reporting can establish process injection and the corresponding observation variables but usually does not
        provide complete source and target authority state or new resource access completed by embedded code. Those cases
        therefore do not independently prove privilege escalation; event-specific authority and resource outcomes still require
        local evidence.
    - zh: 内存、线程和映像遥测成本较高、持续时间短，也可能被高权限代码干扰。载荷可以在采样间隔内执行并恢复，受保护进程可能阻止读取，完整内存转储还包含敏感数据；采集范围、保留和访问需要兼顾覆盖与隐私。
      en: Memory, thread, and image telemetry is costly, short-lived, and can be disrupted by privileged code. A payload can
        execute and restore state between samples, protected processes can prevent inspection, and full memory dumps contain
        sensitive data. Collection scope, retention, and access therefore need to balance coverage and privacy.
