  name_en: Deception Environment Identification and Evasion
  name_zh: 诱捕环境识别与规避
decision: add
rationale_zh: 公开实证研究表明，恶意主体会在投递载荷或开展深度攻击前检查端口、服务、设备身份、协议行为及蜜罐指纹；一旦判定目标为诱捕环境，可能中止攻击、拉黑地址或只暴露低价值行为。此过程直接决定防守方能否观察到完整攻击链，并可通过网络与服务一致性、交互深度、运行语义、时空关联及识别后的条件化抑制形成稳定、可区分的匿迹子技术。现有分类主要覆盖一般侦察或恶意代码进入执行环境后的沙箱检查，未将远程诱捕环境识别及其后续行为收敛作为独立父技术组织，因此新增本技术。
rationale_en: Empirical research shows that malicious actors check ports, services, device identity, protocol behavior, and
  honeypot fingerprints before delivering payloads or conducting deeper attacks. Once a target is assessed as deceptive, they
  may terminate the attack, blacklist the address, or expose only low-value behavior. This process directly controls whether
  defenders can observe the complete attack chain and supports stable, distinguishable evasion sub-techniques based on cross-layer
  consistency, interaction depth, operational semantics, spatiotemporal correlation, and post-identification behavioral suppression.
  Existing classifications mainly cover general reconnaissance or sandbox checks after code enters an execution environment,
  so remote deception-environment identification and the resulting behavioral contraction are added as an independent technique.
scope_notes_zh: 本技术只纳入以判断目标是否为诱捕、仿真或欺骗环境为直接目的的远程交互，以及该判断触发的后续行为调整。普通资产发现、正常攻击失败、取得执行后在主机内部检查虚拟化痕迹均不纳入。
scope_notes_en: Include only remote interactions directly intended to determine whether a target is a trapping, emulated,
  or deceptive environment, plus subsequent behavior changes triggered by that assessment. Exclude ordinary asset discovery,
  natural attack failure, and post-execution inspection of virtualization artifacts inside a host.
gap_statement_zh: 缺少对远程诱捕环境识别、判真和识别后行为抑制的统一技术层级。
gap_statement_en: No unified technique level covers remote deception-environment identification, authenticity assessment,
  and post-identification behavioral suppression.
