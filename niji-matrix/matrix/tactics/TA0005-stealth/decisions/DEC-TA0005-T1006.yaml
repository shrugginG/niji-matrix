candidate:
  source_type: attack
  source_attack_id: T1006
  source_attack_version: '19.1'
  name_en: Direct Volume Access
  name_zh: 直接卷访问
decision: adapt
rationale_zh: 直接卷访问将读取或写入从文件系统逻辑路径转移到原始存储视图，使文件级访问控制、锁和监控不能完整观察操作，具备明确边界跨越因果。Niji 适配为“原始存储视图访问”，强调原始设备操作到敏感对象结果的谱系。
rationale_en: Direct volume access moves reads or writes from the logical file-system path to a raw storage view, preventing
  file-level access control, locks, and monitoring from observing the operation completely and creating clear boundary-traversal
  causality. Niji adapts the candidate as Raw Storage-View Access and emphasizes lineage from raw-device operation to sensitive-object
  outcome.
scope_notes_zh: 普通文件访问、获批备份、正常影子副本管理和只创建副本而未绕开文件视图的行为排除。
scope_notes_en: Ordinary file access, approved backup, normal shadow-copy administration, and copy creation that does not
  bypass the file view are excluded.
gap_statement_zh: 需要新的父技术；开放搜索未发现防御变量独立且证据充分的正式子技术，维持零子技术并记录候选处置。
gap_statement_en: A new parent technique is required. Open-ended research found no evidence-supported candidate with an independent
  defense variable, so the technique remains childless with candidate dispositions recorded.
