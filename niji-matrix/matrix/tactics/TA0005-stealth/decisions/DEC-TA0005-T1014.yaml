  name_en: Rootkit
  name_zh: 根套件
decision: adapt
rationale_zh: T1014 通过拦截或修改系统信息接口，让上层观察获得省略或伪造视图，直接改变防守可见性。Niji 适配为“系统信息视图拦截”，以真实下层状态与查询结果差异为直接对象。
rationale_en: T1014 intercepts or modifies system-information interfaces so higher-level observation receives an omitted or
  falsified view and directly changes defender visibility. Niji adapts it as System-Information View Interception with the
  difference between real lower-layer state and query results as the direct object.
scope_notes_zh: 要求拦截或修改观察接口并隐藏实际组件；普通驱动、API hook、系统监控和仅持久化固件排除或归相邻对象。
scope_notes_en: Requires interception or modification of an observation interface that hides a real component. Ordinary drivers,
  API hooks, system monitoring, and firmware persistence alone are excluded or adjacent.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 过度合并；本批按错误视图形成点新增查询路径结果过滤与查询背衬状态脱钩，驻留层级和隐藏对象类型仍不成项。
gap_statement_en: The parent existed but the former zero-child taxonomy over-merged distinct behavior. This batch adds query-path result filtering and query-backing state detachment by false-view formation point, while residence level and hidden-object type still do not form children.
