candidate:
  source_type: attack
  source_attack_id: T1027
  source_attack_version: '19.1'
  name_en: Obfuscated Files or Information
  name_zh: 混淆文件或信息
decision: adapt
rationale_zh: T1027 改变代码、命令和数据的防守可读表示，并把真实内容推迟到恢复或运行时，直接降低发现与分析能力。Niji 适配为“内容表示遮蔽”，不逐项导入十八项 ATT&CK 子技术，而按不可互换的恢复路径收敛为四个 Niji 子技术。
rationale_en: T1027 changes defender-readable representation of code, commands, and data and delays real content until recovery
  or runtime, directly reducing discovery and analysis. Niji adapts it as Content-Representation Obscuration and does not import
  the eighteen ATT&CK children one for one, instead converging them into four Niji children by non-interchangeable recovery path.
scope_notes_zh: 必须存在攻击者控制的表示变换和可恢复真实内容；普通压缩、编码传输、数字版权保护和合法构建优化排除。
scope_notes_en: There must be an adversary-controlled representation transformation and recoverable real content. Ordinary
  compression, encoded transport, digital-rights protection, and legitimate build optimization are excluded.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 过度合并；本批新增可逆语义变换、静态特征空间畸变、载体嵌入载荷与运行时语义物化四个恢复边界。
gap_statement_en: The parent existed but the former zero-child taxonomy over-merged distinct behavior. This batch adds four recovery boundaries for reversible semantic transformation, static feature-space distortion, carrier-embedded payloads, and runtime semantic materialization.
