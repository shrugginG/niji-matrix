  source_attack_id: T1036
  source_attack_version: '19.1'
  name_en: Masquerading
  name_zh: 伪装
decision: adapt
rationale_zh: T1036 操纵工件可见特征，使恶意对象借用合法身份、类型、位置或谱系外观，直接降低可区分性。Niji 适配为“可见特征身份替代”，不逐项导入十二项 ATT&CK 子技术，而按身份判断与验证事实源收敛为四个 Niji 子技术。
rationale_en: T1036 manipulates visible artifact features so a malicious object borrows the appearance of legitimate identity,
  type, location, or lineage and directly reduces distinguishability. Niji adapts it as Visible-Feature Identity Substitution
  and does not import the twelve ATT&CK children one for one, instead converging them into four Niji children by identity judgment and verification source of truth.
scope_notes_zh: 必须证明可见特征由攻击者控制且误导身份或用途判断；普通命名、品牌定制和合法兼容性外观排除。
scope_notes_en: Visible features must be adversary-controlled and mislead identity or purpose judgment. Ordinary naming, branding,
  and legitimate compatibility appearance are excluded.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 过度合并；本批新增受信资源身份、用户可见类型呈现、执行谱系和客户端指纹四个防御不可互换边界。
gap_statement_en: The parent existed but the former zero-child taxonomy over-merged distinct behavior. This batch adds four non-interchangeable defensive boundaries for trusted-resource identity, user-visible type presentation, execution lineage, and client fingerprint.
