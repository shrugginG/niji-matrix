  name_en: Process Injection
  name_zh: 进程注入
decision: adapt
rationale_zh: 进程注入让攻击者代码在另一进程上下文执行，借用目标的映像、角色、资源和遥测来源，直接降低执行来源的识别与归因。NJT-0103 与四个 Niji 子技术已完整表达跨进程嵌入、内存 backing、dispatch、出生映像来源和角色合形变量，应跨战术复用。
rationale_en: Process injection executes adversary code in another process context and borrows the target image, role, resources,
  and telemetry provenance, directly reducing recognition and attribution of execution origin. NJT-0103 and its four Niji
  children already express cross-process embedding, memory backing, dispatch, birth-image provenance, and role-conformity
  variables and should be reused across tactics.
scope_notes_zh: TA0005 不要求权限提升，但要求目标上下文实际执行攻击者指令并改变观察或归因；只有写入、句柄、RWX 内存或高权限目标名称不足以确认。
scope_notes_en: TA0005 does not require elevation but does require actual adversary instruction execution in the target context
  and an observation or attribution effect. A write, handle, RWX memory, or privileged target name alone is insufficient.
gap_statement_zh: 无新对象缺口，仅缺 TA0005 显式映射。
gap_statement_en: No new-object gap exists; only an explicit TA0005 mapping is missing.
