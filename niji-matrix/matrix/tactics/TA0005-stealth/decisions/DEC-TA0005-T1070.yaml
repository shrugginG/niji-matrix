  name_en: Indicator Removal
  name_zh: 指示物移除
decision: adapt
rationale_zh: T1070 选择性缩减异常痕迹并保留正常外观，直接降低攻击链重建与归因能力。Niji 适配为“选择性痕迹收敛”，以工件前态、攻击者变化和剩余正常外观为直接对象，不导入八项 ATT&CK 子技术。
rationale_en: T1070 selectively contracts anomalous traces while preserving a normal appearance and directly reduces attack-chain
  reconstruction and attribution. Niji adapts it as Selective Trace Contraction with artifact prior state, adversary change,
  and remaining normal appearance as the direct object and imports none of the eight ATT&CK children.
scope_notes_zh: 只有以缩减恶意痕迹为目的的删除、修改、时间改写、位置迁移或关系清理纳入；正常清理、保留策略和软件卸载排除。
scope_notes_en: Only deletion, modification, time rewriting, relocation, or relationship cleanup intended to contract malicious
  traces is included; normal cleanup, retention policy, and software uninstall are excluded.
gap_statement_zh: 需要新的父技术；结论级证据支持证据对象擦除、操作关系拆除、时间元数据伪造和载荷位置迁移四项 Niji 原生子技术。
gap_statement_en: A new parent technique is required. Conclusion-level evidence supports Evidence-Object Erasure, Operational-Relationship
  Teardown, Temporal-Metadata Falsification, and Payload-Location Migration as four Niji-native children.
