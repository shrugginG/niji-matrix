  name_en: Valid Accounts
  name_zh: 有效账户
decision: retain
rationale_zh: 有效账户和会话让恶意活动使用真实身份、正常认证与历史情境，减少恶意软件和异常主体特征。NJT-0061 与三个 Niji 子技术已完整表达登录情境合形、会话复用和低反馈身份选择，应跨战术复用。
rationale_en: Valid accounts and sessions let malicious activity use real identity, normal authentication, and historical
  context and reduce malware and anomalous-subject features. NJT-0061 and its three Niji children already express sign-in
  context conformity, session reuse, and low-feedback identity selection and should be reused across tactics.
scope_notes_zh: TA0005 不要求首次入口或权限提升，但要求未授权使用与合法身份外观造成实际观察差异；凭据获取和账户修改归相邻对象。
scope_notes_en: TA0005 does not require first entry or elevation but does require unauthorized use and legitimate identity
  appearance to create an actual observation difference. Credential acquisition and account mutation belong to adjacent objects.
gap_statement_zh: 无新对象缺口，仅增加 TA0005 映射。
gap_statement_en: No new-object gap exists; only a TA0005 mapping is added.
