  name_en: Trusted Developer Utilities Proxy Execution
  name_zh: 受信开发工具代理执行
decision: retain
rationale_zh: 受信开发工具解释攻击者项目、manifest 或构建输入并代理执行，借用签名工具来源并可能在工具内无独立工件运行，直接降低识别。NJT-0080 与两个 Niji 子技术已完整拥有这些变量，应跨战术复用。
rationale_en: Trusted developer utilities interpret adversary project, manifest, or build input and proxy execution, borrowing
  signed-tool provenance and sometimes running in-process without an independent artifact, directly reducing detection. NJT-0080
  and its two Niji children already own these variables and should be reused across tactics.
scope_notes_zh: 必须由开发工具解释攻击者控制输入并产生执行；通用系统二进制、脚本与实用程序代理归 NJT-0113。
scope_notes_en: A developer utility must interpret adversary-controlled input and produce execution. General system-binary,
  script, and utility proxying belongs to NJT-0113.
gap_statement_zh: 无新对象缺口，仅增加 TA0005 映射。
gap_statement_en: No new-object gap exists; only a TA0005 mapping is added.
