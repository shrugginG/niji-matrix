candidate:
  source_type: attack
  source_attack_id: T1134
  source_attack_version: '19.1'
  name_en: Access Token Manipulation
  name_zh: 访问令牌操纵
decision: adapt
rationale_zh: T1134 可使线程有效身份、新进程令牌权威或显示父级与真实调用来源分离，从而让操作呈现在熟悉的进程、身份或创建谱系下，直接降低识别、关联和归因可靠性。既有 NJT-0099 已完整拥有相同直接对象和三个稳定 Niji
  变量，重新创建对象会造成重复；但其原有权限提升范围要求更高权限结果，需扩展为跨战术对象，使未提权但确实改变防守观察的实例承担 TA0005 语义。
rationale_en: T1134 can separate thread-effective identity, new-process token authority, or displayed parent from the actual
  call origin, causing activity to appear under a familiar process, identity, or creation lineage and directly reducing recognition,
  correlation, and attribution reliability. Existing NJT-0099 already owns the same direct object and three stable Niji variables,
  so a new object would duplicate it. Its original Privilege Escalation scope requires a higher-authority outcome and must
  be extended as a cross-tactic object so non-elevating instances that materially change defender observation can carry TA0005
  semantics.
scope_notes_zh: TA0005 不要求更高权限结果，但要求攻击者有意控制令牌或谱系变化，并产生实际观察、关联或归因影响。合法服务模拟、获批 runas、正常 UAC 谱系、偶然父子差异和没有观察影响的普通进程创建排除。持久账户授权边、代码注入和一般有效账户使用归相邻对象。
scope_notes_en: TA0005 does not require a higher-authority outcome, but it requires adversary-controlled token or lineage
  change with an actual observation, correlation, or attribution effect. Legitimate service impersonation, approved run-as
  use, normal UAC lineage, incidental parent-child differences, and ordinary process creation without an observation effect
  are excluded. Durable account authorization edges, code injection, and ordinary valid-account use belong to adjacent objects.
gap_statement_zh: 现有 NJT-0099 已覆盖行为本体，但缺少无提权结果时以观察和归因差异成立的 TA0005 跨战术范围。
gap_statement_en: Existing NJT-0099 covers the behavior itself but lacks a TA0005 cross-tactic scope in which observation
  and attribution differences establish the technique without an elevation outcome.
