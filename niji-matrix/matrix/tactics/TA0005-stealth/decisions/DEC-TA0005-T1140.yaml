  name_en: Deobfuscate or Decode Files or Information
  name_zh: 反混淆或解码文件或信息
decision: exclude
rationale_zh: 解码、解密、解压或重组的直接效果是把已有内容恢复为可用形式，本身不降低可观察性，反而常产生明文、内存和文件痕迹。匿迹因果属于上游的混淆、加密、分片或包装设计；T1140 仅是消费这些设计以便执行的转换步骤，因此不建立独立
  Niji Technique。
rationale_en: The direct effect of decoding, decrypting, decompressing, or reassembling is to restore existing content to
  usable form. It does not itself reduce observability and often creates plaintext, memory, or file traces. Stealth causality
  belongs to the upstream obfuscation, encryption, fragmentation, or packing design, while T1140 is only the transformation
  step that consumes those designs for execution, so no independent Niji Technique is created.
scope_notes_zh: 解码动作可作为上游混淆技术的场景或检测信号，但不独立承担 taxonomy、机理或防御对象。
scope_notes_en: Decoding may be a scenario or detection signal for an upstream obfuscation technique but does not independently
  own taxonomy, mechanisms, or defense objects.
gap_statement_zh: 无独立缺口；由上游混淆对象承担。
gap_statement_en: No independent gap; ownership belongs to the upstream obfuscation object.
