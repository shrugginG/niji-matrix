  name_en: BITS Jobs
  name_zh: BITS 作业
decision: retain
rationale_zh: BITS 作业将创建者、后台传输、持久作业状态和通知程序执行分散到不同主体与时间窗口，并可借用正常更新和同步外观，直接降低识别与关联概率。既有 NJT-0063、两个 Niji 子技术及其防御对象已完整表达这些 Stealth
  属性，应跨战术复用而非重新创建。
rationale_en: BITS jobs distribute creator activity, background transfer, persistent job state, and notification-program execution
  across subjects and time windows and can borrow the appearance of normal update and synchronization, directly reducing recognition
  and correlation. Existing NJT-0063, its two Niji children, and its defense objects already express these Stealth properties
  and should be reused across tactics rather than recreated.
scope_notes_zh: 只有具备执行语义并有意改变防守观察的 BITS 作业纳入；单纯传输、C2、外传和合法更新排除。
scope_notes_en: Only BITS jobs with execution semantics and deliberate defender-observation impact are included; transfer-only,
  command-and-control, exfiltration, and legitimate update use are excluded.
gap_statement_zh: 无需新增技术；现有 NJT-0063 缺少 TA0005 显式分类映射。
gap_statement_en: No new technique is needed; existing NJT-0063 lacks an explicit TA0005 classification mapping.
