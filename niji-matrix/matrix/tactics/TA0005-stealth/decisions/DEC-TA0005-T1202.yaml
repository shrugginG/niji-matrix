  name_en: Indirect Command Execution
  name_zh: 间接命令执行
decision: adapt
rationale_zh: T1202 通过受信系统实用程序建立间接命令路径，使可见发起者与真实命令来源分离并绕过解释器限制，具备明确行动隐匿因果。Niji 适配为“系统实用程序命令代理”。
rationale_en: T1202 creates an indirect command path through a trusted system utility, separates the visible initiator from
  the real command source, and bypasses interpreter restrictions, creating clear Stealth causality. Niji adapts it as System-Utility
  Command Proxying.
scope_notes_zh: 要求实用程序实际代理命令或程序结果；普通工具使用、直接解释器执行和开发工具专用输入代理排除。
scope_notes_en: The utility must actually proxy a command or program outcome. Ordinary utility use, direct interpreter execution,
  and developer-tool-specific input proxying are excluded.
gap_statement_zh: 需要新的父技术；结论级证据支持即时实用程序调用代理与配置触发实用程序代理两个 Niji 原生子技术，工具差异本身不构成子技术。
gap_statement_en: A new parent technique is required. Conclusion-level evidence supports Immediate Utility Invocation Proxying
  and Configuration-Triggered Utility Proxying as two Niji-native children, while utility differences alone do not define children.
