  source_attack_id: T1205
  source_attack_version: '19.1'
  name_en: Traffic Signaling
  name_zh: 流量信令
decision: adapt
rationale_zh: T1205 让端口或隐藏功能仅在网络信令匹配后出现，使普通扫描看到关闭状态并减少持续监听特征。Niji 适配为“网络信号门控功能暴露”。
rationale_en: T1205 exposes a port or hidden function only after a network signal matches, causing ordinary scanning to see
  a closed state and reducing continuous-listener features. Niji adapts it as Network-Signal-Gated Function Exposure.
scope_notes_zh: 必须存在信令匹配和后继隐藏功能激活；普通认证、协议握手、健康检查和持续开放服务排除。
scope_notes_en: Requires signal matching and successor activation of hidden functionality. Ordinary authentication, protocol
  handshakes, health checks, and continuously open services are excluded.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 未区分 matcher 状态模型；本批新增有状态信号序列与内容模式数据包激活，协议与过滤产品仍不成项。
gap_statement_en: The parent existed but the former zero-child taxonomy did not distinguish matcher state models. This batch adds stateful signal-sequence and content-pattern packet activation, while protocol and filter product still do not form children.
