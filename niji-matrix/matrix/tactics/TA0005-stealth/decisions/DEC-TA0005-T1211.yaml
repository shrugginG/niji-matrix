  source_attack_version: '19.1'
  name_en: Exploitation for Stealth
  name_zh: 匿迹漏洞利用
decision: adapt
rationale_zh: 漏洞利用可把执行移到日志、监控或信任边界之外，产生遥测缺失或错误归因，而不要求更高权限结果。该直接结果与 NJT-0102 的权威提升不同，故适配为“脆弱观察边界利用”。
rationale_en: Exploitation can move execution outside logging, monitoring, or trust boundaries and produce missing telemetry
  or misattribution without requiring a higher-authority outcome. This direct result differs from the authority gain owned
  by NJT-0102, so the candidate is adapted as Vulnerable Observation-Boundary Exploitation.
scope_notes_zh: 必须证明漏洞利用与观察差异相连；普通代码执行漏洞、单纯提权和直接关闭或篡改防御分别归相邻对象。
scope_notes_en: Exploitation must be connected to an observation difference. Ordinary code-execution exploitation, privilege
  escalation alone, and direct disabling or tampering with defenses belong to adjacent objects.
gap_statement_zh: 现有矩阵没有以漏洞驱动的观察边界跨越为直接对象的技术；结论级证据支持审计生成漏洞绕过与受信接口上下文逃逸两个 Niji 原生子技术。
gap_statement_en: The matrix lacks a technique whose direct object is vulnerability-driven crossing of an observation boundary.
  Conclusion-level evidence supports Audit-Generation Vulnerability Bypass and Trusted-Interface Context Escape as two Niji-native
  children.
