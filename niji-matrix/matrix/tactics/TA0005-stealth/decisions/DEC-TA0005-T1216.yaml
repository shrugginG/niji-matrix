rationale_zh: T1216 使用签名或默认系统脚本代理恶意输入，与 NJT-0113 的请求者—代理资产—命令—结果链一致。脚本是载体，不建立重复 NJT。
rationale_en: T1216 uses signed or default system scripts to proxy malicious input and matches the requester-to-proxy-asset-to-command-to-outcome
  chain of NJT-0113. A script is a carrier and no duplicate NJT is created.
scope_notes_zh: 必须由系统脚本实际触发恶意文件或命令；普通脚本管理和直接解释器执行排除。
scope_notes_en: The system script must actually trigger a malicious file or command. Ordinary script administration and direct
  interpreter execution are excluded.
