  name_en: System Binary Proxy Execution
  name_zh: 系统二进制代理执行
decision: adapt
rationale_zh: T1218 与 NJT-0113 共享受信系统执行资产代理恶意输入的直接对象。系统二进制只是载体，应扩展既有父技术而非创建重复对象。
rationale_en: T1218 shares with NJT-0113 the direct object of a trusted system execution asset proxying malicious input. A
  system binary is a carrier and the existing parent should be extended rather than duplicated.
scope_notes_zh: 要求受信二进制实际代理恶意内容或命令结果；直接执行、模块加载和开发工具专用代理归相邻对象。
scope_notes_en: A trusted binary must actually proxy a malicious content or command outcome. Direct execution, module loading,
  and developer-tool-specific proxying belong to adjacent objects.
gap_statement_zh: 无新对象缺口，扩展 NJT-0113。
gap_statement_en: No new-object gap exists; extend NJT-0113.
