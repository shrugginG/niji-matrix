candidate:
  source_type: attack
  source_attack_id: T1221
  source_attack_version: '19.1'
  name_en: Template Injection
  name_zh: 模板注入
decision: adapt
rationale_zh: T1221 将真实恶意内容或认证触发移到文档外部引用，使静态文档检查与打开时结果分离，具备明确观察边界因果。Niji 适配为“外部模板内容间接化”。
rationale_en: T1221 moves real malicious content or an authentication trigger into an external document reference, separating
  static document inspection from open-time outcome and creating clear observation-boundary causality. Niji adapts it as External-Template
  Content Indirection.
scope_notes_zh: 要求攻击者控制模板或外部引用并产生代码、载荷或认证结果；合法企业模板和普通外部资源排除。
scope_notes_en: Requires adversary control of the template or external reference and a code, payload, or authentication outcome.
  Legitimate enterprise templates and ordinary external resources are excluded.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 合并了响应/执行与认证/披露两个结果；本批新增远程模板内容替换和引用诱发认证，格式与协议仍不成项。
gap_statement_en: The parent existed but the former zero-child taxonomy merged response-to-execution and authentication-to-disclosure outcomes. This batch adds remote-template content substitution and reference-induced authentication, while format and protocol still do not form children.
