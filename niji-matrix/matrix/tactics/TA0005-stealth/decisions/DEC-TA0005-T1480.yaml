candidate:
  source_type: attack
  source_attack_id: T1480
  source_attack_version: '19.1'
  name_en: Execution Guardrails
  name_zh: 执行护栏
decision: adapt
rationale_zh: 执行护栏让核心能力只在预期目标条件成立时暴露，使非目标和分析环境观察到退出、低价值路径或不可用密文，直接降低能力暴露。Niji 适配为“目标条件化激活门控”，并按显式属性比较与环境派生密码恢复两种不可互换的防御变量建立原生子技术，不直接导入 ATT&CK 子技术。
rationale_en: Execution guardrails expose core capability only when an expected target condition holds, causing non-target
  and analysis environments to observe exit, a low-value path, or unusable ciphertext and directly reducing capability exposure.
  Niji adapts the candidate as Target-Conditioned Activation Gating and establishes Niji-native children for the non-interchangeable
  defense variables of explicit attribute comparison and environment-derived cryptographic recovery rather than directly
  importing ATT&CK children.
scope_notes_zh: 普通兼容性检查、许可校验、单实例控制和业务功能开关排除；必须证明条件由攻击者用于限制恶意行为暴露。
scope_notes_en: Ordinary compatibility checks, license validation, single-instance control, and business feature flags are
  excluded; the condition must be shown to restrict exposure of malicious behavior.
gap_statement_zh: 需要新的父技术；结论级证据支持“显式目标属性匹配门控”和“环境派生密码激活”两个 Niji 原生子技术。通用互斥、字段、平台和算法不单独成子技术。
gap_statement_en: A new parent technique is required. Conclusion-level evidence supports Explicit Target-Attribute Match
  Gating and Environment-Derived Cryptographic Activation as two Niji-native children. Generic mutual exclusion, fields,
  platforms, and algorithms do not independently form children.
original_attack_subtechniques_imported: false
