  name_en: Virtualization or Sandbox Evasion
  name_zh: 虚拟化或沙箱规避
decision: adapt
rationale_zh: T1497 在本地执行环境内检查虚拟化、用户活动或时间证据，并据此隐藏或终止核心功能，直接改变动态分析可见路径。Niji 适配为“本地分析环境条件化规避”。
rationale_en: T1497 checks virtualization, user-activity, or timing evidence inside the local execution environment and consequently
  hides or terminates core functionality, directly changing the path visible to dynamic analysis. Niji adapts it as Local
  Analysis-Environment Conditioned Evasion.
scope_notes_zh: 要求本地环境检查与后继行为差异相连；远程诱捕识别、调试器专用检查和普通环境发现归相邻对象。
scope_notes_en: Requires local-environment checks to connect to a successor behavior difference. Remote deception identification,
  debugger-specific checks, and ordinary environment discovery belong to adjacent objects.
gap_statement_zh: 既有NJT-0122及三个原生子项继续复用；本批独立复核准入、分类和防御后扩展TA0007归属，不复制父子。系统工件、活动充分性和时间判别边界保留，普通发现与纯延迟仍属相邻范围。
gap_statement_en: Reuse existing NJT-0122 and its three native children. This batch independently reviews admission, taxonomy,
  and defenses before extending TA0007 without duplicate objects. Preserve system-artifact, activity-sufficiency, and temporal-judgment
  boundaries while retaining ordinary discovery and pure delay in neighboring scopes.
