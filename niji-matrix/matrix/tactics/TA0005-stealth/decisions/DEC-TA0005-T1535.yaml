candidate:
  source_type: attack
  source_attack_id: T1535
  source_attack_version: '19.1'
  name_en: Unused or Unsupported Cloud Regions
  name_zh: 未使用或不受支持的云区域
decision: adapt
rationale_zh: T1535 把恶意云资源放到组织基线与监控覆盖不足的区域，直接跨越控制面观察边界。Niji 适配为“低覆盖云区域工作负载放置”。
rationale_en: T1535 places malicious cloud resources in a region outside organizational baseline and monitoring coverage and
  directly crosses a control-plane observation boundary. Niji adapts it as Low-Coverage Cloud-Region Workload Placement.
scope_notes_zh: 要求区域选择有意利用覆盖缺口并产生恶意资源或活动；合法灾备、多区域服务和临时测试排除。
scope_notes_en: Region selection must deliberately exploit a coverage gap and produce a malicious resource or activity. Legitimate
  disaster recovery, multiregion service, and temporary testing are excluded.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 合并了使用基线与控制覆盖差分；本批新增区域使用基线外放置和区域控制覆盖不对称，厂商与服务类型仍不成项。
gap_statement_en: The parent existed but the former zero-child taxonomy merged usage-baseline and control-coverage differentials. This batch adds Region-usage baseline displacement and Region-control coverage asymmetry, while provider and service type still do not form children.
