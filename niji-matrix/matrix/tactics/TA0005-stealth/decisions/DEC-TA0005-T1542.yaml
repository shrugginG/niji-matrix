  name_en: Pre-OS Boot
  name_zh: 操作系统前启动
decision: adapt
rationale_zh: OS 前代码、固件和外部启动来源位于主机操作系统传感器与度量边界以下，可使活动在普通端点观察之外执行。NJT-0097 与两个 Niji 子技术已完整拥有启动信任和来源谱系，应扩展 TA0005 范围而非重建。
rationale_en: Pre-OS code, firmware, and external boot sources sit below host operating-system sensors and measurement boundaries
  and can execute activity outside ordinary endpoint observation. NJT-0097 and its two Niji children already own boot trust
  and source lineage and should be extended for TA0005 rather than recreated.
scope_notes_zh: TA0005 需要证明 OS 观察差异；TA0003 另要求启动后恢复访问。仅固件漏洞、合法旧式启动和不可用破坏排除。
scope_notes_en: TA0005 requires an operating-system observation difference, while TA0003 additionally requires restored post-boot
  access. Firmware vulnerability alone, legitimate legacy boot, and destructive unavailability are excluded.
gap_statement_zh: 无新对象缺口，仅扩展跨战术范围。
gap_statement_en: No new-object gap exists; only cross-tactic scope is extended.
