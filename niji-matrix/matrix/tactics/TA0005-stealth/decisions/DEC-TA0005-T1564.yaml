  name_en: Hide Artifacts
  name_zh: 隐藏工件
decision: adapt
rationale_zh: T1564 的父行为直接改变工件在枚举、地址、表示和观察域中的呈现，具有明确行动隐匿因果。Niji 适配为“工件可见性重塑”，将十四项实现收敛为四个防御不可互换的观察变量，不导入 ATT&CK 子技术。
rationale_en: T1564 directly changes how artifacts are presented in enumeration, addressing, representation, and observation
  domains and has clear Stealth causality. Niji adapts it as Artifact Visibility Reshaping and converges fourteen implementations
  into four defender-observation variables with non-interchangeable defenses without importing ATT&CK children.
scope_notes_zh: 工件必须保留攻击者所需状态但降低常用观察可见性；删除工件、加密内容、关闭传感器和普通权限拒绝归相邻对象。
scope_notes_en: The artifact must preserve state needed by the adversary while reducing visibility in common observation.
  Artifact deletion, content encryption, sensor disabling, and ordinary permission denial belong to adjacent objects.
gap_statement_zh: 需要新的父技术和四项 Niji-native 子技术。
gap_statement_en: A new parent technique and four Niji-native children are required.
