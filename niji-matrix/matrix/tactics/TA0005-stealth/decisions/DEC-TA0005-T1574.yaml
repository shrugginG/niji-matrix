  name_en: Hijack Execution Flow
  name_zh: 劫持执行流
decision: adapt
rationale_zh: 执行流劫持让攻击者内容借用受信启动器、稳定路径或正常运行时激活来源，直接降低执行来源的可区分性。NJT-0070 与三个 Niji 子技术已完整表达相同变量，应扩展 TA0005 映射而非重建。
rationale_en: Hijack Execution Flow lets attacker content borrow trusted launcher, stable-path, or normal-runtime activation
  provenance and directly reduces distinguishability of execution origin. NJT-0070 and its three Niji children already express
  the same variables and should be extended with a TA0005 mapping rather than recreated.
scope_notes_zh: 要求攻击者修改前置选择或激活状态并由受信 consumer 实际消费；单纯可写暴露、模块加载或代码注入排除。
scope_notes_en: Requires adversary modification of prior selection or activation state and actual consumption by a trusted
  consumer; writable exposure alone, ordinary module loading, and code injection are excluded.
gap_statement_zh: 无新对象缺口，仅缺 TA0005 显式映射。
gap_statement_en: No new-object gap exists; only an explicit TA0005 mapping is missing.
