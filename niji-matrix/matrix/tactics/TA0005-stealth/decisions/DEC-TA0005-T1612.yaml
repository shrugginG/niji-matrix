candidate:
  source_type: attack
  source_attack_id: T1612
  source_attack_version: '19.1'
  name_en: Build Image on Host
  name_zh: 在主机上构建映像
decision: adapt
rationale_zh: 宿主内构建把恶意内容从可监控的成品镜像拉取转移到构建上下文、构建步骤和本地生成镜像之间，并可借用正常基础镜像信誉，具有明确 Stealth 因果。Niji 将其适配为“宿主内镜像构建”，强调构建请求到本地镜像再到部署的完整谱系，而非
  Docker 产品或某条指令。
rationale_en: On-host building moves malicious content from observable retrieval of a finished malicious image into build
  context, build steps, and a locally generated image and can borrow the reputation of a benign base image, creating clear
  Stealth causality. Niji adapts the candidate as Host-Local Image Construction and emphasizes the complete lineage from build
  request through local image to deployment rather than a Docker product or individual instruction.
scope_notes_zh: 镜像拉取、一般部署、合法开发构建和注册表污染排除；必须观察攻击者控制的宿主构建与后继恶意镜像使用。
scope_notes_en: Image pulling, ordinary deployment, legitimate development builds, and registry poisoning are excluded; adversary-controlled
  on-host building and subsequent malicious image use must be observed.
gap_statement_zh: 现有矩阵没有以宿主构建谱系替代成品恶意镜像拉取为直接对象的技术。
gap_statement_en: The current matrix lacks a technique whose direct object is host-build lineage replacing retrieval of a
  finished malicious image.
