  name_en: Reflective Code Loading
  name_zh: 反射式代码加载
decision: adapt
rationale_zh: T1620 在同一进程内自行映射载荷，缺少正常文件、image-load 和 loader module 对象，直接降低模块发现与归因。NJT-0077 的 NJS-0077-002 已完整拥有该变量，应复用父技术与子技术。
rationale_en: T1620 self-maps a payload inside one process without normal file, image-load, and loader-module objects, directly
  reducing module discovery and attribution. NJT-0077 and NJS-0077-002 already own this variable completely and should be
  reused.
scope_notes_zh: 同一进程自定义映射归本对象；跨进程写入与调度归进程注入，标准 loader 模块归兄弟项。
scope_notes_en: Custom mapping within one process belongs here; cross-process writes and dispatch belong to process injection,
  and standard-loader modules to the sibling.
gap_statement_zh: 无新对象缺口，仅增加 TA0005 映射。
gap_statement_en: No new-object gap exists; only a TA0005 mapping is added.
