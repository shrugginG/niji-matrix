  name_en: Debugger Evasion
  name_zh: 调试器规避
decision: retain
rationale_zh: 调试器检测和干扰直接控制分析环境能够观察的代码路径、状态与输出，具备明确行动隐匿因果，故保留父行为。
rationale_en: Debugger detection and interference directly control the code paths, state, and output visible to an analysis
  environment, creating clear Stealth causality, so the parent behavior is retained.
scope_notes_zh: 只有以发现或规避调试观察为目的的检查、行为门控和调试通道干扰纳入；普通错误处理、性能计时和合法反篡改排除。
scope_notes_en: Only checks, behavior gating, and debug-channel interference intended to discover or avoid debugger observation
  are included; ordinary error handling, performance timing, and legitimate anti-tamper use are excluded.
gap_statement_zh: 需要新的父技术；结论级证据支持调试状态条件化行为收敛与调试观察通道饱和两项 Niji 子技术。
gap_statement_en: A new parent technique is required; conclusion-level evidence supports Debug-State-Conditioned Behavior
  Contraction and Debug Observation-Channel Saturation as two Niji children.
