  name_en: Delay Execution
  name_zh: 延迟执行
decision: retain
rationale_zh: 攻击者控制后继动作时间可越过自动分析、告警关联和人工观察窗口，并让活动更接近正常等待或后台节奏，直接服务行动隐匿，故保留。
rationale_en: Adversary control of successor-action timing can outlast automated analysis, alert correlation, and analyst
  observation windows and make activity resemble normal waiting or background cadence, directly serving Stealth, so the parent
  is retained.
scope_notes_zh: 只有为改变观察或规避分析而设计的延迟纳入；业务等待、同步、退避、速率限制和保障前序命令完成的正常延迟排除。
scope_notes_en: Only delay designed to change observation or evade analysis is included; ordinary business waiting, synchronization,
  backoff, rate limiting, and delay used to ensure prior command completion are excluded.
gap_statement_zh: 需要新的父技术；实证支持静默等待状态延迟与耗工作量延迟伪装两项 Niji 子技术。
gap_statement_en: A new parent technique is required; evidence supports Quiescent Wait-State Delay and Work-Consuming Delay
  Camouflage as two Niji children.
