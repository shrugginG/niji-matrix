  source_attack_id: T1679
  source_attack_version: '19.1'
  name_en: Selective Exclusion
  name_zh: 选择性排除
decision: adapt
rationale_zh: T1679 通过有意跳过关键文件、目录、类型或系统组件维持可用性并降低立即告警，使破坏活动更像可控变化并得以完成。Niji 适配为“运行连续性选择性排除”。
rationale_en: T1679 deliberately skips critical files, directories, types, or system components to preserve usability and
  reduce immediate alerting, making destructive activity appear more controlled and allowing it to complete. Niji adapts it
  as Operational-Continuity Selective Exclusion.
scope_notes_zh: 必须证明排除谓词由攻击者控制且服务于隐藏或持续恶意结果；正常备份排除、维护范围和安全工具排除配置不属于本技术。
scope_notes_en: The exclusion predicate must be adversary-controlled and serve a concealed or continuing malicious outcome.
  Normal backup exclusions, maintenance scope, and security-tool exclusion configuration are outside this technique.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 未区分覆盖单位；本批新增主机内关键对象保留与角色条件整机保留，目标类型与匹配语法仍不成项。
gap_statement_en: The parent existed but the former zero-child taxonomy did not distinguish coverage units. This batch adds in-host critical-object preservation and role-conditioned whole-host preservation, while target type and matching syntax still do not form children.
