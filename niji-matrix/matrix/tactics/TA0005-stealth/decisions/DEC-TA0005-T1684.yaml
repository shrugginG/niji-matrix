candidate:
  source_type: attack
  source_attack_id: T1684
  source_attack_version: '19.1'
  name_en: Social Engineering
  name_zh: 社会工程
decision: adapt
rationale_zh: T1684 让用户在可信来源外观下代为执行、批准或披露，将恶意因果嵌入正常通信和人工决策并减少技术指标。Niji 适配为“人际信任动作代理”。
rationale_en: T1684 has users execute, approve, or disclose under the appearance of trusted provenance, embedding malicious
  causality in normal communication and human decision-making and reducing technical indicators. Niji adapts it as Human-Trust
  Action Brokerage.
scope_notes_zh: 必须存在攻击者控制的信任来源呈现和由此触发的用户动作；一般宣传、合法委托、无后继结果的谎言和纯技术漏洞排除。
scope_notes_en: Requires adversary-controlled presentation of trusted provenance and a resulting user action. Ordinary persuasion,
  legitimate delegation, lies without a successor outcome, and purely technical exploitation are excluded.
gap_statement_zh: 父技术已存在但原零子技术 taxonomy 合并了不可互换事实源；本批新增关系权威冒充与邮件传输来源伪造，通信介质与请求动作仍不成项。
gap_statement_en: The parent existed but the former zero-child taxonomy merged non-interchangeable sources of truth. This batch adds relational-authority impersonation and email-transport provenance forgery, while communication medium and requested action still do not form children.
