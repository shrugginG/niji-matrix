research:
  limitations:
    paragraphs:
    - zh: HoneyIoT 直接支持攻击者在完整攻击前检查端口、服务与蜜罐指纹，Honeyd 与智能电网研究支持跨层一致性的判真价值；但公开材料对每个请求如何依赖前一响应的记录有限，因此子技术存在性与特征伪装均保持中等置信。
      en: HoneyIoT directly supports adversary checks of ports, services, and honeypot fingerprints before a full attack, while
        Honeyd and smart-grid research support the assessment value of cross-layer consistency. Public material records less
        detail about how each request depends on the preceding response, so child existence and Feature Disguise remain medium
        confidence.
    - zh: 两个不同请求类型的共现不能证明本子技术。缺少跨表面约束、响应依赖或判真目的时，结论应收窄为一般测量或扫描，不得由浅层请求推断能力保留。
      en: Co-occurrence of two request types does not establish the child. Without a cross-surface constraint, response dependency,
        or authenticity-assessment purpose, the conclusion must narrow to ordinary measurement or scanning and must not infer
        capability withholding from shallow requests.
