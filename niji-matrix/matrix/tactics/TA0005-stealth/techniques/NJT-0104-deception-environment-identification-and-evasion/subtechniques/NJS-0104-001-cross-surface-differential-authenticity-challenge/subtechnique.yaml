schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0104-001
name:
  zh: 跨表面差分真实性挑战
  en: Cross-Surface Differential Authenticity Challenge
summary:
  zh: 攻击者在一次判真过程中组合多个相互约束的远程表面，使单个请求保持常见协商或测量外观，而在攻击者侧比较响应一致性。
  en: Adversaries combine mutually constraining remote surfaces within one authenticity assessment so each request retains
    the appearance of common negotiation or measurement while response consistency is compared adversary-side.
aliases: []
parent_ref: NJT-0104
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨表面差分真实性挑战是攻击者在同一判真过程中选择能够相互约束的远程请求，比较网络身份、协议状态、错误处理和运行数据是否共同符合真实环境的匿迹子技术。其直接目标是用多个低风险交互恢复环境真实性，而不在单个请求中暴露反诱捕意图或高价值能力。
    en: Cross-Surface Differential Authenticity Challenge is an evasion sub-technique in which an adversary selects remotely
      issued requests whose results constrain one another within one assessment and compares whether network identity, protocol
      state, error handling, and operational data jointly match a genuine environment. Its immediate objective is to recover
      environmental authenticity through several low-risk interactions without exposing anti-deception intent or high-value
      capability in any one request.
  - zh: 本子技术的稳定变量是会话内挑战组合及响应间约束，不是协议、设备、字段或工具。判断后是否终止或保留载荷属于 NJS-0104-003；跨部署与时间的重复比较属于 NJS-0104-002。
    en: The stable variable is the within-session challenge combination and the constraints among responses, not a protocol,
      device, field, or tool. Terminating or withholding a payload after the result belongs to NJS-0104-003, while repeated
      comparison across deployment and time belongs to NJS-0104-002.
stealth_characteristics:
  paragraphs:
  - zh: 跨表面差分真实性挑战把判真逻辑分散到常见协商、状态查询和低风险业务动作中；单个请求的方法、负载与时序仍可接近正常客户端或测量流量。防守方因此难以从孤立事件区分功能使用与反诱捕判真，必须恢复请求顺序、响应依赖和跨表面约束。
    en: Cross-Surface Differential Authenticity Challenge distributes assessment logic across common negotiation, state
      queries, and low-risk operational actions, allowing the method, payload, and timing of each request to remain close to
      normal-client or measurement traffic. Defenders cannot reliably distinguish functional use from anti-deception assessment
      in an isolated event and must recover request order, response dependency, and cross-surface constraints.
  - zh: 残余痕迹包括同一会话内紧密交替的身份、状态与运行请求，罕见错误路径，以及前一响应对后一请求选择的稳定影响。高交互且跨表面自洽的诱捕节点、完整请求响应保留和同类会话基线会显著限制匿迹效果。
    en: Residual traces include tightly interleaved identity, state, and operational requests within one session, uncommon
      error paths, and a stable influence of one response on the next request choice. A high-interaction node that remains
      coherent across surfaces, complete request-response retention, and comparable-session baselines materially limit the
      stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入同一判真过程中对两个或更多相互约束表面的比较，以及为验证状态、语义或运行完整性而组织的低风险交互。判定至少需要跨表面约束、请求顺序或响应依赖之一，不能仅凭两类请求共现。
    en: Scope includes comparison of two or more mutually constraining surfaces within one assessment and low-risk interactions
      organized to test state, semantic, or operational completeness. Classification requires at least a cross-surface constraint,
      request sequence, or response dependency and cannot rest on the coexistence of two request types alone.
  - zh: 单一横幅、版本或功能查询，普通漏洞扫描，合法兼容性测试和安全研究排除。与 NJS-0104-002 的边界是本子技术以一次判真中的响应约束为直接对象，而不是跨部署时间比较；与 NJS-0104-003 的边界是本子技术只定义判真交互，不把后续能力保留作为自身成立条件。
    en: A single banner, version, or function query, ordinary vulnerability scanning, legitimate compatibility testing, and
      security research are excluded. Unlike NJS-0104-002, this child directly concerns response constraints within one assessment
      rather than comparison across deployment time. Unlike NJS-0104-003, it defines the assessment interaction and does not
      treat follow-on capability withholding as its own existence condition.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在互联网暴露的物联网、工业控制或企业服务上，攻击者可先读取身份与横幅，再触发多步状态转换、边界错误或低风险运行动作，并比较返回内容是否与设备身份和会话历史自洽，以决定是否进入更高价值阶段。
      en: Against Internet-facing IoT, industrial-control, or enterprise services, an adversary may read identity and banner
        information, trigger multistep state transitions, boundary errors, or a low-risk operational action, and compare whether
        the result remains coherent with device identity and session history before deciding whether to enter a higher-value
        stage.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制请求顺序和参数，能观察完整响应，并知道真实实现中不同表面应满足的约束。深度交互会增加时间、暴露和误判成本，错误领域基线也可能把真实目标当作诱捕环境。
        en: The adversary controls request order and parameters, observes complete responses, and knows the constraints that
          a genuine implementation should satisfy across surfaces. Deeper interaction increases time, exposure, and false-assessment
          cost, and an inaccurate domain baseline may classify a genuine target as deception.
    defender_model:
      paragraphs:
      - zh: 防守方观察请求、响应、状态转换、会话键、部署版本和后续阶段，并按目标与会话连接不同协议或应用日志。只保留流量摘要、响应内容缺失、跨服务会话无法归并或没有同类正常会话基线时形成盲区。
        en: The defender observes requests, responses, state transitions, session keys, deployment versions, and follow-on stages
          and joins logs from different protocols or applications by target and session. Flow summaries alone, missing response
          content, inability to join cross-service sessions, or absence of comparable normal-session baselines creates blind
          spots.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 分散在常见请求中的判真逻辑缺少单事件显著特征
    en: Assessment logic distributed across common requests lacks a conspicuous single-event feature
  analysis:
    paragraphs:
    - zh: 攻击者用常见协商、查询和低风险动作承载跨表面响应比较，使痕迹从一个明显的反诱捕测试变为多个局部正常事件；防守方只有关联请求顺序、响应依赖和后续选择才能恢复其意图，因此形成特征伪装。
      en: The adversary carries cross-surface response comparison in common negotiation, queries, and low-risk actions, changing
        the trace from one conspicuous anti-deception test into several locally normal events. Defenders recover intent only
        by correlating request order, response dependencies, and follow-on selection, producing Feature Disguise.
  evidence_refs:
  - REF-000015
  - REF-000017
  confidence: medium
