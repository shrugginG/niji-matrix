schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0104-002
name:
  zh: 分布式纵向真实性关联
  en: Distributed Longitudinal Authenticity Correlation
summary:
  zh: 攻击者在相关诱捕节点和部署变化之间重复比较寿命、同步变化与响应时序，以在外部形成部署级真实性画像。
  en: Adversaries repeatedly compare lifetime, synchronized change, and response timing across related deception nodes and
    deployment changes to form an external deployment-level authenticity profile.
aliases: []
parent_ref: NJT-0104
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 分布式纵向真实性关联是攻击者对同一诱捕部署的相关节点进行多次真实性观测，并在外部比较暴露寿命、同步变化、状态重置和响应时序的匿迹子技术。其直接目标是识别单个会话无法呈现的统一编排、静态寿命或不自然同步特征。
    en: Distributed Longitudinal Authenticity Correlation is an evasion sub-technique in which an adversary makes repeated
      authenticity observations of related nodes in one deception deployment and externally compares exposure lifetime, synchronized
      change, state reset, and response timing. Its immediate objective is to identify common orchestration, static lifetime,
      or unnatural synchronization that no single session reveals.
  - zh: 稳定变量是跨相关节点和部署变化的纵向比较。多个来源、低频率和长间隔可以是实现方式，但不是本子技术的必要边界；若直接对象只是降低扫描局部密度，应归入 NJT-0001 下的时间或真实来源分布变量。
    en: The stable variable is longitudinal comparison across related nodes and deployment changes. Multiple origins, low frequency,
      and long intervals may implement the behavior but do not define it. Activity whose direct object is only reducing local
      scan density belongs to the timing or real-source-distribution variables under NJT-0001.
stealth_characteristics:
  paragraphs:
  - zh: 分布式纵向真实性关联把完整部署画像保留在攻击者侧，而每个节点与观察窗口只保留对寿命、延迟或状态的局部采样。防守方若不知道节点所属部署批次及变更历史，就难以判断这些请求是独立测量还是同一真实性画像的组成部分。
    en: Distributed Longitudinal Authenticity Correlation keeps the complete deployment profile adversary-side while each
      node and observation window retains only a local sample of lifetime, latency, or state. Without knowledge of deployment
      cohorts and change history, defenders cannot readily determine whether requests are independent measurements or parts
      of one authenticity profile.
  - zh: 残余痕迹包括相关节点上重复的测量结构、部署变更前后的复测、相似请求顺序和长期目标集合重合。共享节点身份映射、部署版本和足以覆盖变更周期的保留会限制其效果；频繁变化来源也不会自动证明共同主体。
    en: Residual traces include repeated measurement structures across related nodes, revisits before and after deployment
      changes, similar request ordering, and long-term target-set overlap. Shared node-identity mapping, deployment versions,
      and retention spanning change cycles limit the effect, while frequently changing origins do not by themselves establish
      a common actor.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对同一诱捕部署的多个相关节点或多个部署时点进行重复观测，并比较寿命、同步变化、重置或时序结果的行为。判定必须有关联部署对象和纵向比较目的，不能仅凭低频请求或多来源访问。
    en: Scope includes repeated observation of related nodes or deployment points in one deception deployment and comparison
      of lifetime, synchronized change, reset, or timing outcomes. Classification requires a correlated deployment object and
      a longitudinal-comparison purpose and cannot rest on low-rate requests or multiple origins alone.
  - zh: 合法可用性监控、性能排障、搜索引擎测量和学术扫描是正常反例。与 NJS-0104-001 的边界是本子技术比较跨节点与部署时间的变化，而不是一次会话内的响应约束；与 NJS-0104-003 的边界是本子技术定义判真画像的形成，不定义判断后的能力保留。仅为分散扫描痕迹而改变时间或真实来源归 NJT-0001。
    en: Legitimate availability monitoring, performance troubleshooting, search-engine measurement, and academic scanning
      are normal counterexamples. Unlike NJS-0104-001, this child compares change across nodes and deployment time rather than
      response constraints within one session. Unlike NJS-0104-003, it defines formation of an authenticity profile rather
      than capability withholding after the result. Changes to time or real origins made only to disperse scan traces belong
      to NJT-0001.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可在载荷投递前重复访问一组可能相关的诱捕地址，记录端口与内容寿命、部署变更前后的响应、同步重置和延迟，再判断这些节点是否由同一编排系统批量生成。
      en: Before payload delivery, an adversary may revisit a set of possibly related deception addresses, record port and
        content lifetime, responses before and after deployment changes, synchronized reset, and latency, and infer whether
        one orchestration system mass-produced the nodes.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要多次可达性、长期记录、目标归并和部署变化比较能力，并能容忍判断延迟。地址频繁变化、无法稳定重访、错误节点归并和较短行动周期会削弱画像。
        en: The adversary needs repeated reachability, long-term records, target resolution, and comparison across deployment
          changes and can tolerate delayed conclusions. Frequent address changes, inability to revisit, incorrect node resolution,
          and a short operational horizon weaken the profile.
    defender_model:
      paragraphs:
      - zh: 防守方需要跨节点共享流量与部署元数据，保留覆盖至少一次部署变更的数据，并在地址轮换后保留稳定节点映射。节点日志孤立、部署版本不可见、保留期短于变更周期和目标映射丢失是主要盲区。
        en: The defender shares traffic and deployment metadata across nodes, retains data across at least one deployment change,
          and preserves stable node mapping after address rotation. Isolated node logs, invisible deployment versions, retention
          shorter than the change cycle, and lost target mapping are major blind spots.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 部署画像跨节点与观察时点累积而局部只留弱信号
    en: A deployment profile accumulates across nodes and observation points while each local view retains a weak signal
  analysis:
    paragraphs:
    - zh: 攻击者将寿命、同步变化与响应时序比较分布到相关节点和多个时点，使痕迹从一个完整部署画像变为每个节点和窗口内的局部采样；防守方缺少部署映射与纵向保留时无法恢复共同目的，因此可能形成时空释痕。
      en: The adversary distributes comparison of lifetime, synchronized change, and response timing across related nodes
        and observation points, changing the trace from one complete deployment profile into local samples in each node and
        window. Without deployment mapping and longitudinal retention, defenders cannot recover the common purpose, potentially
        producing Spatiotemporal Trace Dilution.
  evidence_refs:
  - REF-000016
  confidence: hypothesis
