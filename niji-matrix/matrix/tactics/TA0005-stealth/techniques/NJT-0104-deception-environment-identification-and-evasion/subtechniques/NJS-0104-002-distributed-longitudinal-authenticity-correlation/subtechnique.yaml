research:
  limitations:
    paragraphs:
    - zh: REF-000016 证明时间、结构、运行与信息物理不一致可暴露蜜罐，但没有提供足够真实攻击案例证明攻击者会按本子技术组织跨节点纵向比较。因此该子技术和 NM-ST 均明确保持 hypothesis，不能从普通低频扫描升级归因。
      en: REF-000016 establishes that temporal, structural, operational, and cyber-physical inconsistencies can expose honeypots
        but does not provide enough real-adversary cases showing longitudinal comparison organized across nodes as defined
        here. The child and NM-ST therefore remain explicit hypotheses and cannot be attributed from ordinary low-rate scanning.
    - zh: 未观察到至少一次部署变更前后的复测、稳定节点归并与结果比较时，只能记录分散测量，不得确认诱捕部署真实性画像。新的结论级攻击者证据是将其从假设提升为中等或高置信的必要条件。
      en: Without revisits before and after at least one deployment change, stable node resolution, and outcome comparison, only
        dispersed measurement can be recorded and no deployment-authenticity profile may be asserted. New conclusion-level
        adversary evidence is required before confidence can rise from hypothesis to medium or high.
