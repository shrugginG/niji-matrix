schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0104-003
name:
  zh: 识别后条件化能力保留
  en: Post-Assessment Conditional Capability Withholding
summary:
  zh: 攻击者在真实性判断显示目标可疑时终止流程或拒绝投递关键载荷，使高价值能力不进入该观察点。
  en: Adversaries terminate a workflow or refuse to deliver a critical payload when authenticity assessment marks a target
    as suspicious, keeping high-value capability out of that observation point.
aliases:
- Honeypot Blacklisting
parent_ref: NJT-0104
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 识别后条件化能力保留是攻击者把诱捕环境判断作为高价值能力暴露的否定门控，在目标可信度不足时终止会话、拒绝上传或不进入利用、载荷与控制阶段的匿迹子技术。其直接目标是牺牲当前目标机会，换取关键载荷、利用链、控制逻辑和基础设施的不暴露。
    en: Post-Assessment Conditional Capability Withholding is an evasion sub-technique in which an adversary uses a deception-environment
      assessment as a negative gate on high-value capability exposure and terminates the session, refuses upload, or does not
      enter exploitation, payload, or control stages when target confidence is insufficient. Its immediate objective is to
      sacrifice the current target opportunity in exchange for keeping a critical payload, exploit chain, control logic, or
      infrastructure unexposed.
  - zh: 稳定变量是特定真实性反馈与高价值阶段未进入之间的可重复否定关系。父技术还可包含判断后继续或重新评估的情形；本子技术只分类终止、拒绝投递或有证据的关键能力不暴露，不以一般延迟、伪装或基础设施切换扩张边界。
    en: The stable variable is a repeatable negative relationship between particular authenticity feedback and non-entry into
      a high-value stage. The parent can also include continuation or reassessment after a result; this child classifies only
      termination, refusal to deliver, or evidenced non-exposure of critical capability and does not broaden itself through
      general delay, disguise, or infrastructure switching.
stealth_characteristics:
  paragraphs:
  - zh: 识别后条件化能力保留把本可连续出现的判真、利用、载荷与控制痕迹截断为浅层会话和稳定终止点。防守方因而难以知道未进入的能力，也难以从一次退出区分反诱捕决策、自然失败与目标优先级调整。
    en: Post-Assessment Conditional Capability Withholding truncates traces that might otherwise progress from assessment
      through exploitation, payload, and control into a shallow session and a stable termination point. Defenders cannot directly
      know the capability that never entered the target and cannot distinguish one exit among anti-deception choice, natural
      failure, and ordinary reprioritization.
  - zh: 残余痕迹包括特定响应后重复出现的终止，同类可信目标上的更深阶段，以及长期回避。受控响应组、完整会话结果、稳定活动簇和网络错误排除会限制匿迹效果；没有对照时，未见载荷不构成证据。
    en: Residual traces include termination recurring after a particular response, deeper stages on comparable credible targets,
      and long-term avoidance. Controlled response cohorts, complete session outcomes, stable activity clusters, and exclusion
      of network errors limit the stealth effect; without a control, an absent payload is not evidence.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入能与特定真实性反馈建立可重复条件关系的会话终止、载荷拒绝上传、利用阶段不进入或关键功能不释放。判定需要特定响应后的稳定终止，或可疑与可信响应组之间的后续深度差异。
    en: Scope includes session termination, refused payload upload, non-entry into exploitation, or non-release of critical
      functionality that forms a repeatable conditional relationship with particular authenticity feedback. Classification
      requires stable termination after a response or a follow-on-depth difference between suspicious and credible response
      cohorts.
  - zh: 网络故障、权限不足、程序崩溃、目标修复、一般休眠、普通优先级调整、仅延迟返回或仅切换基础设施排除。与 NJS-0104-001 和 NJS-0104-002 的边界是本子技术不定义如何收集或关联真实性证据，只定义该证据如何否定高价值能力暴露。没有判真证据时不得从“未见载荷”单独推断。
    en: Network failure, insufficient privilege, process crash, target remediation, general dormancy, ordinary reprioritization,
      delayed return alone, and infrastructure switching alone are excluded. Unlike NJS-0104-001 and NJS-0104-002, this child
      does not define how authenticity evidence is collected or correlated; it defines how that evidence negatively gates
      high-value exposure. An absent payload alone must not establish the child without assessment evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在载荷投递或利用之前，自动化投递器可以检查横幅、服务状态或蜜罐指纹；当响应显示静态、矛盾或仿真不足时，流程拉黑地址、终止会话或拒绝上传恶意载荷，而对同类可信目标继续进入深层阶段。
      en: Before payload delivery or exploitation, an automated delivery system may inspect banners, service state, or honeypot
        fingerprints. When responses appear static, contradictory, or insufficiently realistic, the workflow blacklists the
        address, terminates the session, or refuses malware upload while comparable credible targets continue into deeper stages.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击流程需要以目标可信度为条件的否定分支，并能拒绝投递、终止会话或放弃目标。该选择会牺牲潜在机会；目标稀缺、判真错误或时间压力较高时，攻击者可能仍继续并暴露能力。
        en: The attack workflow has a negative branch conditioned on target confidence and can refuse delivery, terminate the
          session, or abandon the target. This choice sacrifices a potential opportunity; scarce targets, assessment error,
          or time pressure may cause the adversary to continue and expose capability despite suspicion.
    defender_model:
      paragraphs:
      - zh: 防守方需要可比较的诱捕节点或受控响应组、完整会话结果、网络错误与目标可用性记录，以及足以覆盖攻击者回访周期的保留。单节点、无对照、活动簇无法归并和未知网络错误是主要盲区。
        en: The defender needs comparable deception nodes or controlled response cohorts, complete session outcomes, network-error
          and target-availability records, and retention spanning the adversary's revisit cycle. A single node, no control,
          unresolved activity clusters, and unknown network errors are the main blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 真实性判断在关键能力进入观察点前否定后续阶段
    en: Authenticity assessment negatively gates the follow-on stage before critical capability enters the observation point
  analysis:
    paragraphs:
    - zh: 攻击者把特定真实性反馈连接到终止或拒绝投递分支，使痕迹从本可延伸到利用、载荷与控制的完整链缩减为前置判真和浅层会话；防守方无法观察未进入的能力，从而形成行为透明。
      en: The adversary connects particular authenticity feedback to a termination or refusal-to-deliver branch, contracting
        a trace that might have progressed through exploitation, payload, and control into preliminary assessment and a shallow
        session. Defenders cannot observe the capability that never entered the target, producing Behavioral Transparency.
  evidence_refs:
  - REF-000015
  - REF-000018
  confidence: medium
