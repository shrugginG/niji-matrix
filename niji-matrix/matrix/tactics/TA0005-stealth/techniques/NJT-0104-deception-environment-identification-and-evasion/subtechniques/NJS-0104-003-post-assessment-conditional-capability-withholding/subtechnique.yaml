research:
  limitations:
    paragraphs:
    - zh: HoneyIoT 直接展示了响应真实性、拉黑或终止与恶意软件上传之间的对照，IoT-BDA 证明反蜜罐行为并非单一工具现象；但这些证据主要来自自动化物联网活动，不支持将人控行动、一般延迟、伪装或基础设施切换无条件纳入。
      en: HoneyIoT directly contrasts response authenticity, blacklisting or termination, and malware upload, while IoT-BDA
        shows that anti-honeypot behavior is not limited to one tool. The evidence is concentrated in automated IoT activity
        and does not support unconditional inclusion of human-operated intrusion, general delay, disguise, or infrastructure
        switching.
    - zh: 即使可以证明判真请求，一次中止仍可能由故障、权限、不兼容或优先级解释。只有可重复决策点、受控响应组、同类目标结果差异和网络错误排除同时加强时，才能把置信度提升到中等以上。
      en: Even when authenticity requests are established, one termination may still be explained by failure, privilege,
        incompatibility, or priority. Confidence rises above medium only when repeatable decision points, controlled response
        cohorts, outcome differences among comparable targets, and exclusion of network errors reinforce one another.
