research:
  limitations:
    paragraphs:
    - zh: 公开实证主要集中于物联网和智能电网蜜罐，能够证明远程判真、部分指纹矛盾及识别后的行为转折，但不足以把相同特征无条件推广到所有企业应用、工业协议或人工操作者。公开材料也尚未充分证明真实攻击者会跨相关节点和部署变更组织纵向画像，因此 NJS-0104-002 及 NM-ST 保持 hypothesis。
      en: Public empirical evidence is concentrated on IoT and smart-grid honeypots and establishes remote authenticity testing,
        some fingerprint inconsistencies, and behavioral transitions after identification, but it does not justify unconditional
        generalization to every enterprise application, industrial protocol, or human operator. Public material also does
        not yet establish that real adversaries organize longitudinal profiles across related nodes and deployment changes,
        so NJS-0104-002 and NM-ST remain hypotheses.
    - zh: 未观察到载荷是隐变量，可能由故障、权限、不兼容、优先级或目标修复造成。只有对照会话、重复响应差异、跨节点回访和攻击簇一致性增强时，才能提高“诱捕判断触发能力保留”的置信度；缺少这些条件时应缩小到可观察的真实性挑战，不推断完整后续意图。
      en: An unobserved payload is a latent variable and may result from failure, privilege, incompatibility, prioritization,
        or target remediation. Confidence that a deception assessment triggered capability withholding rises only with control
        sessions, repeated response differences, cross-node revisits, and consistency within an activity cluster. Without
        those conditions, conclusions should be narrowed to the observable authenticity challenge rather than inferred follow-on
        intent.
