schema_version: 2.0.0
type: technique
id: NJT-0104
name:
  zh: 诱捕环境识别与规避
  en: Deception-Environment Identification and Evasion
summary:
  zh: 攻击者通过远程交互判断目标是否为诱捕或仿真环境，并依据判断收敛后续行为，以减少关键能力、基础设施和身份被观察的机会。
  en: Adversaries use remote interaction to assess whether a target is a trapping or emulated environment and contract follow-on
    behavior according to that assessment, reducing opportunities to observe critical capabilities, infrastructure, and identity.
aliases:
- Honeypot Fingerprinting
- Anti-Honeypot
classification:
  tactic_refs:
  - TA0005
  - TA0043
  origin:
    kind: niji-added
    source_attack_id: null
    source_attack_version: null
  decision_ref: DEC-TA0005-NIJI-0001
definition_and_concept:
  paragraphs:
  - zh: 诱捕环境识别与规避是攻击者在暴露高价值能力之前，通过目标外部的网络或应用交互检验环境真实性，并使检验结果控制后续活动的行为。其直接对象是目标呈现的身份、交互深度、运行连续性、部署关系和时间特征，直接目的是判断该观察点是否值得继续投递载荷、利用链或控制逻辑。
    en: Deception-Environment Identification and Evasion is the adversary behavior of testing environmental authenticity through
      network or application interaction from outside a target before exposing high-value capabilities, then allowing the
      result to control subsequent activity. Its direct objects are the identity, interaction depth, operational continuity,
      deployment relationships, and temporal characteristics presented by the target, and its immediate purpose is to decide
      whether that observation point warrants further payload, exploit-chain, or control-logic exposure.
  - zh: >-
      本技术要求远程交互被组织为诱捕环境真实性判断，并服务于高价值能力暴露前的决策。正式归类至少需要两类证据之一：可重复的跨表面或跨部署判真结构，或真实性反馈对后续能力暴露的可观察影响。只有单个指纹请求、一般侦察意图或无法与真实性判断连接的退出时不成立；设备类别、协议名称、工具和单个响应字段只是实现条件。
    en: >-
      The technique requires remote interaction to be organized as a deception-environment authenticity assessment serving
      a decision before high-value capability exposure. Formal classification requires at least one of two evidence classes:
      a repeatable cross-surface or cross-deployment assessment structure, or an observable effect of authenticity feedback
      on follow-on capability exposure. One fingerprint request, a general reconnaissance purpose, or an exit that cannot
      be connected to authenticity assessment is insufficient. Device class, protocol name, tool, and individual response
      field are implementation conditions.
stealth_characteristics:
  paragraphs:
  - zh: 诱捕环境识别与规避把本来可能连续出现的验证、利用、载荷和控制活动改变为低价值挑战、稀疏复测以及条件化的提前终止。防守方因此更难判断浅层请求是普通测量还是能力暴露前的判真，也更难把某次退出与特定响应建立因果关系；关键载荷未进入诱捕节点时，攻击链完整性和归因材料随之下降。
    en: Deception-Environment Identification and Evasion transforms what might otherwise be a continuous sequence of validation,
      exploitation, payload delivery, and control into low-value challenges, sparse revisits, and conditional early termination.
      Defenders consequently have more difficulty distinguishing ordinary measurement from pre-exposure authenticity testing
      and linking an exit causally to a particular response. When a critical payload never enters the deception node, attack-chain
      completeness and attribution material also decline.
  - zh: 该行为仍会留下请求顺序、异常状态转换、跨表面比较、来源复测、响应后的交互深度变化和目标回访差异。匿迹效果受攻击者比较基线、目标可远程观察特征以及防守方跨节点保留和关联能力限制；能够控制响应差异并比较同类会话的防守方，可能恢复判断点及其后续影响。
    en: The behavior still leaves request order, unusual state transitions, cross-surface comparison, repeated visits from
      origins, changes in interaction depth after responses, and differences in target revisit behavior. Its stealth effect
      is limited by the adversary's comparison baseline, remotely observable target features, and the defender's cross-node
      retention and correlation capability. Defenders that can vary responses in a controlled manner and compare comparable
      sessions may recover the decision point and its follow-on effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入范围包括为判断目标真实性而比较多个远程表面的响应、跨来源或长周期重建部署与时间画像，以及在目标显得可疑时保留载荷或降低活动深度。判定需要看到真实性检验目的，或看到环境反馈与后续行为之间可重复的条件关系；单个指纹请求或一次未投递载荷不足以成立。
    en: Scope includes comparing responses across remotely visible surfaces to assess authenticity, reconstructing deployment
      and temporal profiles across origins or long periods, and withholding payloads or reducing activity depth when a target
      appears suspicious. Attribution requires evidence of an authenticity-testing purpose or a repeatable conditional relationship
      between environmental feedback and follow-on behavior; one fingerprint request or one absent payload is insufficient.
  - zh: 普通资产、端口、服务或漏洞发现归相应侦察行为；恶意代码进入主机后检查虚拟机、沙箱进程、文件或硬件痕迹属于本地分析环境规避。网络故障、权限不足、目标修复、兼容性错误、合法性能测量和安全研究可以产生相似现象，若没有真实性判断与条件化行为变化则排除。防守方识别攻击者或一般反侦察也不属于本技术。
    en: Ordinary asset, port, service, or vulnerability discovery belongs to the relevant reconnaissance behavior, while malware
      checking virtual-machine, sandbox-process, file, or hardware artifacts after entering a host belongs to local analysis-environment
      evasion. Network failure, insufficient privilege, target remediation, compatibility errors, legitimate performance measurement,
      and security research can produce similar effects and are excluded without an authenticity assessment and conditional
      behavioral change. Defensive identification of an adversary and general counter-reconnaissance are also outside scope.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在互联网暴露的物联网、工业控制、企业服务或动态诱捕节点上，攻击者可先比较横幅、协议状态、错误处理和运行数据是否自洽，再决定是否进入利用或载荷阶段。另一类活动从多个来源间歇访问相关地址，比较暴露寿命、同步变化和响应时间；人工或自动化流程都可在判断异常后终止、降级或迁移到其他目标。
      en: Against Internet-facing IoT, industrial-control, enterprise-service, or dynamically deployed deception nodes, an
        adversary may first compare banners, protocol state, error handling, and operational data for coherence before entering
        exploitation or payload stages. Another operation may revisit related addresses intermittently from multiple origins
        to compare exposure lifetime, synchronized change, and response timing. Human-operated or automated workflows can
        terminate, degrade, or move to another target after detecting an anomaly.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够一次或多次远程访问目标、选择请求和观察反馈，并掌握真实设备、服务、协议或业务环境的比较基线。跨时空关联还需要多个来源、足够时间和稳定记录；条件化能力保留需要攻击流程支持分支，并允许暂缓载荷、切换基础设施或放弃目标。错误基线、严格时间约束和无法重复访问会降低可靠性。
        en: The adversary can reach the target remotely one or more times, select requests, observe feedback, and possesses
          a comparison baseline for a genuine device, service, protocol, or operational environment. Cross-time and cross-origin
          correlation additionally requires multiple origins, sufficient time, and stable recordkeeping. Conditional capability
          withholding requires a branching workflow that can delay a payload, switch infrastructure, or abandon a target.
          An inaccurate baseline, strict timing constraints, and inability to revisit reduce reliability.
    defender_model:
      paragraphs:
      - zh: 防守方可观察网络流、会话、应用请求与响应、协议状态、部署版本、诱捕节点身份及后续载荷结果，并可按目标、来源簇、请求序列和时间关联。主要盲区来自只保留连接计数、不保存响应或终止原因、各诱捕节点相互隔离、回访期短以及无法知道未发生的载荷。正常扫描与合法测试共享大量可见特征，因此需要同类会话基线和受控响应差异，不能依赖单一签名。
        en: The defender can observe network flows, sessions, application requests and responses, protocol state, deployment
          version, deception-node identity, and follow-on payload outcomes and can correlate them by target, source cluster,
          request sequence, and time. Major blind spots arise when only connection counts are retained, responses or termination
          reasons are absent, deception nodes are isolated, revisit retention is short, or an unobserved payload cannot be
          known. Ordinary scanning and legitimate testing share many visible features, so comparable-session baselines and
          controlled response variation are needed rather than a single signature.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 真实性判断把关键能力保留在诱捕观察范围之外
    en: Authenticity assessment keeps critical capability outside deception observation
  analysis:
    paragraphs:
    - zh: 攻击者先用低价值交互验证真实性，并让结果决定是否继续；可疑响应使载荷、利用链或控制逻辑不再进入目标，防守记录因而从完整攻击过程缩减为前置挑战和退出痕迹，使能力识别与归因更困难。
      en: The adversary first validates authenticity with low-value interaction and lets the result determine continuation.
        A suspicious response prevents the payload, exploit chain, or control logic from entering the target, reducing the
        defensive record from a complete attack process to preliminary challenges and exit traces and making capability identification
        and attribution harder.
  evidence_refs:
  - REF-000015
  - REF-000018
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 判真请求保持一般扫描或正常客户端外观
    en: Authenticity requests retain an ordinary-scan or normal-client appearance
  analysis:
    paragraphs:
    - zh: 攻击者把真实性挑战限制在常见协商、状态查询或低风险请求中，使单个事件与合法测量共享外观；只有把请求选择、响应差异和后续行为放在一起，防守方才能区分其反诱捕目的，因此短窗口分类更易失真。
      en: The adversary confines authenticity challenges to common negotiation, state queries, or low-risk requests so individual
        events share the appearance of legitimate measurement. Defenders can distinguish the anti-deception purpose only by
        combining request selection, response differences, and follow-on behavior, making short-window classification less
        reliable.
  evidence_refs:
  - REF-000015
  - REF-000017
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 部署级纵向比较把完整真实性画像留在攻击者侧
    en: Deployment-level longitudinal comparison keeps the complete authenticity profile adversary-side
  analysis:
    paragraphs:
    - zh: 若攻击者把寿命、同步变化和响应时序比较分布到同一诱捕部署的相关节点与多个观察时点，痕迹就从一个完整部署画像变为每个节点和窗口内的局部采样；防守方缺少节点映射、部署版本与纵向保留时难以恢复共同判真目的。
      en: If an adversary distributes comparisons of lifetime, synchronized change, and response timing across related nodes
        and observation points in one deception deployment, the trace changes from one complete deployment profile into local
        samples in each node and window. Without node mapping, deployment versions, and longitudinal retention, defenders
        struggle to recover the common authenticity-assessment purpose.
  evidence_refs:
  - REF-000016
  confidence: hypothesis
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子技术分别控制一次判真中的响应约束、跨节点与部署变化的纵向画像，以及真实性反馈对高价值能力暴露的否定门控。NJS-0104-001 只定义会话内跨表面挑战，不借用后续载荷保留证明自身成立；NJS-0104-002 只定义部署级纵向比较，多来源或低频率仅是可选实现，并因缺少真实攻击者结论级证据保持 hypothesis；NJS-0104-003 只分类终止、拒绝投递或有证据的关键能力不暴露。
      en: The formal children separately control response constraints within one assessment, a longitudinal profile across
        nodes and deployment changes, and negative gating of high-value capability exposure by authenticity feedback. NJS-0104-001
        defines only the within-session cross-surface challenge and does not borrow later payload withholding to establish
        itself. NJS-0104-002 defines only deployment-level longitudinal comparison; multiple origins and low frequency are
        optional implementations, and the child remains a hypothesis because conclusion-level real-adversary evidence is
        lacking. NJS-0104-003 classifies only termination, refusal to deliver, or evidenced non-exposure of critical capability.
    - zh: 三个变量可在一次活动中组合，但检测依次需要会话内请求响应关联、带部署映射的纵向保留和受控响应结果对照，因此防御边界不可互换。网络层、协议层、运行数据、设备类型、产品、工具和单个字段不形成子技术；只为降低扫描密度而改变时间或真实来源归 NJT-0001。
      en: The three variables can combine in one operation, but detection respectively requires within-session request-response
        correlation, longitudinal retention with deployment mapping, and controlled response-outcome comparison, so their
        defensive boundaries are not interchangeable. Network layer, protocol layer, operational data, device class, product,
        tool, and one field do not form children. Changes to time or real origins made only to lower scan density belong to
        NJT-0001.
  coverage: established
  subtechnique_refs:
  - NJS-0104-001
  - NJS-0104-002
  - NJS-0104-003
