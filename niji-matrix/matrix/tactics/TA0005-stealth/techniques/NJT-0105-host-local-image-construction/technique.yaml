research:
  limitations:
    paragraphs:
    - zh: Aqua 在野案例直接证明攻击者使用正常 Alpine 基础镜像、构建期外部下载和宿主新摘要绕过成品镜像情报，Docker 文档证明接口、证明与材料记录能力。实证仍主要围绕 Docker/BuildKit，不能无条件推广到所有镜像构建器。没有稳定事件流时，很难区分攻击者构建与开发者实验构建，必须依赖主体、构建材料、输出摘要和后继部署。
      en: The Aqua in-the-wild case directly establishes use of a benign Alpine base image, build-time external retrieval,
        and a new host-local digest to bypass finished-image intelligence, while Docker documentation establishes API, attestation,
        and material-recording capability. Evidence remains concentrated on Docker and BuildKit and cannot be generalized
        unconditionally to every image builder. Without stable event streams, adversary builds are difficult to distinguish
        from developer experiments and require principal, build materials, output digest, and successor deployment.
    - zh: 正常基础镜像只证明部分输入可信，不保证新层安全；反之，新本地镜像也不自动恶意。Aqua 案例直接证明这种不当信任传递，因此特征伪装提升为高置信；若能验证构建证明、材料、逐层内容和首次部署，观察差异会显著缩小。
      en: A benign base image establishes trust in only part of the input and does not make new layers safe; conversely, a
        new local image is not automatically malicious. The Aqua case directly demonstrates this unwarranted trust transfer,
        raising Feature Disguise to high confidence. Verified build attestations, materials, layer content, and first deployment
        materially reduce the observation gap.
