research:
  limitations:
    paragraphs:
    - zh: P2PInfect 直接证明 Linux TracerPid 分支，Microsoft 文档证明 Windows 状态查询语义；跨平台存在性为高置信，但具体状态字段不能跨平台类推。
      en: P2PInfect directly establishes a Linux TracerPid branch and Microsoft documentation establishes Windows state-query
        semantics. Cross-platform existence is high confidence, but individual state fields cannot be generalized across platforms.
    - zh: 合法反篡改、反作弊和 DRM 可以使用相同查询。缺少调试开关与后续结果差分时，只能确认状态查询，不得确认恶意行为收敛。
      en: Legitimate anti-tamper, anti-cheat, and DRM can use the same queries. Without debugger-on/off successor-outcome
        differential, only a state query can be established and malicious behavior contraction must not be asserted.
