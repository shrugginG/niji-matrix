research:
  limitations:
    paragraphs:
    - zh: Dridex 案例直接支持 OutputDebugStringW 洪泛和日志淹没，但不自动支持所有异常或线程操作都属于通道饱和。子技术的高置信限于可观察的高密度低价值事件对通道资源与有效信号的影响。
      en: The Dridex case directly supports OutputDebugStringW flooding and log overwhelming, but it does not automatically
        show that every exception or thread operation is channel saturation. High confidence is limited to observable effects
        of high-density low-value events on channel resources and meaningful signal.
    - zh: 事件数量本身不证明恶意；开发诊断、压力测试与崩溃风暴可以产生相似密度。只有重复低价值模板、核心路径在噪声期间继续、通道丢失或预算影响等条件同时成立时才应归因。
      en: Event volume alone does not prove maliciousness; developer diagnostics, stress tests, and crash storms can create
        similar density. Attribution requires repeated low-value templates, continued core execution during noise, and channel-loss
        or budget effects to reinforce one another.
