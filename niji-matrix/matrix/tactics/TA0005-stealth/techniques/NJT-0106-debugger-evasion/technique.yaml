schema_version: 2.0.0
type: technique
id: NJT-0106
name:
  zh: 调试器规避
  en: Debugger Evasion
summary:
  zh: 攻击者检查或干扰调试环境，并依据结果隐藏核心功能、退出或改变执行，使分析人员只能观察受限路径。
  en: Adversaries inspect or interfere with a debugging environment and hide core functions, exit, or alter execution according
    to the result, limiting analysts to a restricted path.
aliases:
- T1622
classification:
  tactic_refs:
  - TA0005
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1622
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1622
definition_and_concept:
  paragraphs:
  - zh: 调试器规避是攻击者让程序识别调试观察状态或主动削弱调试通道，并使判断结果控制后续执行的行为。直接目的在于阻止分析人员获得程序在未受观察条件下的真实代码路径、状态转换和输出，而不是一般环境发现或普通错误处理。
    en: Debugger Evasion is adversary behavior that makes a program identify debugging observation or actively weaken the
      debug channel and uses the result to control subsequent execution. Its immediate purpose is to prevent analysts from
      obtaining the true code path, state transition, and output that would occur without observation, rather than perform
      general environment discovery or ordinary error handling.
  - zh: 检查可以读取调试标志、进程信息、追踪状态、断点或异常处理差异，干扰可以隐藏线程、拒绝附加或产生大量无意义调试输出。这些 API、操作系统和工具只是实现；技术成立要求它们与规避调试观察的目的及后续行为差异相连。
    en: Checks may read debug flags, process information, tracing state, breakpoints, or exception-handling differences, while
      interference may hide threads, deny attachment, or produce large volumes of meaningless debug output. APIs, operating
      systems, and tools are implementations; the technique requires a connection to the purpose of avoiding debugger observation
      and a resulting behavioral difference.
stealth_characteristics:
  paragraphs:
  - zh: 调试器规避使同一程序在被观察与未被观察时呈现不同路径，防守方可能只看到退出、诱饵逻辑、异常循环或缺失的后续载荷，从而难以恢复真实功能。调试输出洪泛和异常噪声还会稀释有意义事件，增加分析成本。
    en: Debugger Evasion causes the same program to present different paths under observed and unobserved conditions. Defenders
      may see only exit, decoy logic, exception loops, or an absent follow-on payload and struggle to recover true functionality.
      Debug-output flooding and exception noise can further dilute meaningful events and increase analysis cost.
  - zh: 残余痕迹包括调试状态查询、追踪文件读取、异常模式、拒绝附加、线程隐藏操作、密集调试字符串以及检查后的稳定分支。透明插桩、多个观察层和受控调试状态差分能够恢复因果；若程序在两种条件下行为一致，匿迹效果不成立。
    en: Residual traces include debug-state queries, tracing-file reads, exception patterns, denied attachment, thread-hiding
      operations, dense debug strings, and stable branching after checks. Transparent instrumentation, multiple observation
      layers, and controlled debug-state differential can recover causality. If behavior is identical in both conditions,
      the stealth effect is not established.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入以识别调试器、隐藏执行线程、阻止附加、操纵异常或淹没调试通道为目的，并实际改变分析可见性的行为。单次 API 调用不足以定性；必须结合调用上下文、后续分支或重复差分。
    en: Scope includes behavior intended to identify a debugger, hide an execution thread, prevent attachment, manipulate
      exceptions, or flood the debug channel and that actually changes analysis visibility. One API call is insufficient;
      call context, successor branching, or repeated differential behavior is required.
  - zh: 合法软件保护、反作弊、数字版权管理、崩溃处理、性能分析和普通异常控制可能产生相似行为。虚拟机或沙箱环境检查归相邻分析环境规避，普通进程与安全工具发现归环境发现；API、平台和调试器产品不构成子技术。
    en: Legitimate software protection, anti-cheat, digital-rights management, crash handling, profiling, and ordinary exception
      control may produce similar behavior. Virtual-machine or sandbox checks belong to adjacent analysis-environment evasion,
      while ordinary process and security-tool discovery belongs to environment discovery. API, platform, and debugger product
      do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 恶意载荷可以在入口函数或释放下一阶段前检查调试标志、TracerPID、断点、异常传递或执行时间；发现观察后退出、执行诱饵或保留核心载荷。另一类程序隐藏特定线程或持续输出调试字符串，以降低动态分析的完整性。
      en: A malicious payload may check debug flags, TracerPID, breakpoints, exception delivery, or execution time at entry
        or before releasing a next stage, then exit, run a decoy, or withhold the core payload after detecting observation.
        Another program may hide a particular thread or emit debug strings continuously to reduce dynamic-analysis completeness.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能在程序中实现调试状态查询或干扰逻辑，并知道目标平台的调试语义。其限制是检查本身可被拦截或伪造，过多异常和输出会形成强特征，且多视角插桩可能让其错误判断环境。
        en: The adversary can implement debugger-state queries or interference logic and understands target-platform debugging
          semantics. Checks can be intercepted or spoofed, excessive exceptions and output can become strong features, and
          multi-view instrumentation may cause the program to misjudge the environment.
    defender_model:
      paragraphs:
      - zh: 防守方可观察 API、系统调用、文件读取、异常、线程信息、调试输出和进程终止，并能在调试开启与关闭条件间比较。只依赖单一用户态调试器、无法看到内核线程状态或没有未调试对照时形成主要盲区；合法保护软件需要签名、用途和版本基线。
        en: Defenders can observe APIs, system calls, file reads, exceptions, thread information, debug output, and process
          termination and compare debugging-on and debugging-off conditions. Reliance on one user-mode debugger, lack of kernel
          thread-state visibility, or absence of an undebugged control creates major blind spots. Legitimate protection software
          requires signing, purpose, and version baselines.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 调试状态把核心行为门控在分析观察之外
    en: Debug state gates core behavior outside analysis observation
  analysis:
    paragraphs:
    - zh: 攻击者在核心路径前读取或制造调试状态，并在观察存在时退出或隐藏功能；痕迹从完整恶意执行缩减为检查和替代分支，防守方无法直接观察被保留的代码路径，形成行为透明。
      en: The adversary reads or constructs debug state before the core path and exits or hides functionality when observation
        is present. Traces contract from complete malicious execution to checks and an alternate branch, preventing direct
        observation of the withheld path and producing Behavioral Transparency.
  evidence_refs:
  - REF-000386
  - REF-000414
  - REF-000415
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 异常与调试输出噪声稀释有意义分析信号
    en: Exception and debug-output noise dilute meaningful analysis signals
  analysis:
    paragraphs:
    - zh: 攻击者用异常控制或大量调试消息填充分析通道，使真正的状态转折夹在重复噪声中；防守方必须处理更多事件才能区分有效路径，短时或资源受限分析更容易失去重点，形成特征伪装与信号稀释。
      en: The adversary fills the analysis channel with exception control or large volumes of debug messages so meaningful
        state transitions are embedded in repetitive noise. Defenders must process more events to distinguish the effective
        path, and short or resource-limited analysis more readily loses focus, creating feature disguise and signal dilution.
  evidence_refs:
  - REF-000386
  - REF-000416
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子技术按攻击者改变调试观察的直接变量划分。NJS-0106-001 以“调试状态是否否定真实后续行为”为边界，需要调试开启与关闭条件下的结果差分；NJS-0106-002 以“大量无意义调试或异常事件占用观察通道预算”为边界，需要事件价值、密度、丢失与资源消耗分析。两者可以组合，但痕迹拓扑与防御不可互换。
      en: The formal children are partitioned by the direct variable through which the adversary changes debugger observation.
        NJS-0106-001 asks whether debugger state negatively gates true successor behavior and requires outcome differential
        between debugging-on and debugging-off conditions. NJS-0106-002 asks whether large volumes of meaningless debug or
        exception events consume observation-channel budget and requires analysis of event value, density, loss, and resource
        consumption. The children can combine, but their trace topologies and defenses are not interchangeable.
    - zh: IsDebuggerPresent、TracerPid、PEB 标志、断点和时序检查是 NJS-0106-001 的实现而不各自成为子技术；OutputDebugString 和异常循环是 NJS-0106-002 的实现。线程隐藏和拒绝附加当前缺少独立结论级来源，只作为父级实现保留并延后子技术判断；平台、API、调试器产品与字段不形成兄弟边界。
      en: IsDebuggerPresent, TracerPid, PEB flags, breakpoints, and timing checks implement NJS-0106-001 rather than forming
        separate children, while OutputDebugString and exception loops implement NJS-0106-002. Thread hiding and attach denial
        currently lack independent conclusion-level sources, remain parent implementations, and have their child decision
        deferred. Platforms, APIs, debugger products, and fields do not define siblings.
  coverage: established
  subtechnique_refs:
  - NJS-0106-001
  - NJS-0106-002
