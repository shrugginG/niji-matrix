research:
  limitations:
    paragraphs:
    - zh: ATT&CK 程序例子支持休眠与日期门控，Microsoft 支持计时器语义，但当前未新建独立在野案例，因此子项保持中等置信。
      en: ATT&CK procedure examples support sleep and date gates and Microsoft supports timer semantics, but no independent
        in-the-wild case was added here, so the child remains medium confidence.
    - zh: 等待时长和休眠 API 不能证明恶意意图。缺少前态、业务依赖分析和后继敏感动作时，只能确认一次等待，不得确认匿迹延迟。
      en: Wait duration and a sleep API do not prove malicious intent. Without prior state, business-dependency analysis, and
        a sensitive successor action, only a wait can be established and stealth delay must not be asserted.
