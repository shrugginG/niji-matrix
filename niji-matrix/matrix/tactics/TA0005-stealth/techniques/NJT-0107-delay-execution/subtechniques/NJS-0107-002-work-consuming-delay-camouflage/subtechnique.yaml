  reference_refs:
  - REF-000387
  - REF-000417
research:
  limitations:
    paragraphs:
    - zh: Unit 42 直接支持 BazarLoader 与 Zloader 的注册表和文件 I/O API hammering，因此子项存在性与两项机理为高置信；它不自动支持所有高密度 API 活动。
      en: Unit 42 directly supports Registry and file-I/O API hammering in BazarLoader and Zloader, giving child existence and
        both mechanisms high confidence. It does not automatically support all high-density API activity.
    - zh: 索引、扫描、备份、数据迁移和性能测试可以产生相似高密度工作。缺少低工作输出比、时间加速差分和后继恶意载荷时，不得归因为延迟伪装。
      en: Indexing, scanning, backup, data migration, and performance testing can create similar high-density work. Without
        a low work-output ratio, time-acceleration differential, and malicious successor payload, delay camouflage must not
        be attributed.
