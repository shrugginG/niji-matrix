schema_version: 2.0.0
type: technique
id: NJT-0107
name:
  zh: 延迟执行
  en: Delay Execution
summary:
  zh: 攻击者有意推迟后继动作，使恶意行为越过分析或关联窗口，并分散到更接近正常等待节奏的时间位置。
  en: Adversaries deliberately postpone a successor action so malicious behavior outlasts analysis or correlation windows
    and is distributed into timing that more closely resembles normal waiting.
aliases:
- T1678
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-retained
    source_attack_id: T1678
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1678
definition_and_concept:
  paragraphs:
  - zh: 延迟执行是攻击者有意在程序启动、阶段完成或触发条件与后继恶意动作之间插入时间，使动作不在原本可预期的观察窗口内发生。延迟可以依赖相对休眠、绝对日期、系统调度、重复命令、等待条件或消耗计算的循环，直接目的是改变执行时点而非完成业务同步。
    en: Delay Execution is the deliberate insertion of time between program start, stage completion, or a triggering condition
      and a malicious successor action so the action occurs outside the originally expected observation window. Delay may
      rely on relative sleep, absolute date, system scheduling, repeated commands, condition waiting, or computation-consuming
      loops. Its immediate purpose is to change execution time rather than complete business synchronization.
  - zh: 技术以“前态—攻击者控制的等待—后继动作”关系为概念锚。sleep、ping、API、循环和调度器是实现；没有后继恶意动作、等待由正常依赖决定，或延迟只为保证前序命令完成时，不属于本技术。
    en: The conceptual anchor is the relationship from prior state through adversary-controlled waiting to successor action.
      Sleep, ping, APIs, loops, and schedulers are implementations. The technique does not apply without a malicious successor
      action, when waiting is dictated by a normal dependency, or when delay only ensures completion of a prior command.
stealth_characteristics:
  paragraphs:
  - zh: 延迟执行把创建、解码或初始活动与后继载荷、通信或破坏行为拉开，使自动分析在动作出现前终止，短窗口关联也只看到前半段或后半段。随机或长期等待还会降低固定周期特征，让行为混入正常空闲和后台节奏。
    en: Delay Execution separates creation, decoding, or initial activity from follow-on payload, communication, or destructive
      behavior so automated analysis can terminate before the action appears and short-window correlation sees only the first
      or second half. Random or long waiting also weakens fixed periodic features and blends behavior into normal idle and
      background cadence.
  - zh: 残余痕迹包括等待 API、计时器、时钟读取、重复系统调用、无业务作用的循环、计划对象和等待后的首个敏感动作。长保留期、进程或持久对象身份以及虚拟时间差分可以恢复关系；若防守窗口覆盖完整等待，匿迹收益下降。
    en: Residual traces include wait APIs, timers, clock reads, repeated system calls, loops without business effect, scheduled
      objects, and the first sensitive action after waiting. Long retention, process or persistent-object identity, and virtual-time
      differential can restore the relationship. If the defensive window spans the complete wait, the stealth benefit falls.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入为越过分析、检测或人工观察窗口而控制相对或绝对执行时间，以及用无必要计算或系统命令消耗时间的行为。判定需要将等待与后继恶意动作连接，并证明延迟不由正常工作流要求。
    en: Scope includes control of relative or absolute execution time to outlast analysis, detection, or human observation
      and the use of unnecessary computation or system commands to consume time. Classification requires joining the wait
      to a malicious successor action and establishing that normal workflow did not require the delay.
  - zh: 合法退避、速率限制、锁等待、用户等待、批处理窗口、维护计划、同步和网络重试是反例。由计划任务保存独立未来触发条件的执行还可属于调度技术，但只有时间位移本身服务匿迹时才在此标注。等待方法、平台和时长不构成子技术。
    en: Legitimate backoff, rate limiting, lock waiting, user waiting, batch windows, maintenance schedules, synchronization,
      and network retry are counterexamples. Execution whose independent future trigger is retained by a scheduler may also
      belong to a scheduling technique, but this technique applies only when temporal displacement itself serves stealth.
      Waiting method, platform, and duration do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 投递器可在释放下一阶段前休眠十五分钟以越过沙箱，植入体可等待数周后的随机日期再开始通信，脚本也可用 ping、循环或大量 API 调用消耗分析时间。后继动作可能是载荷执行、发现、通信或破坏，但延迟只描述其时间门控。
      en: A loader may sleep for fifteen minutes before releasing a next stage to outlast a sandbox, an implant may wait for
        a random date weeks later before communicating, and a script may consume analysis time through ping, loops, or many
        API calls. The successor action may be payload execution, discovery, communication, or impact, while the delay describes
        only its temporal gating.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能维持进程、脚本或持久对象直到指定时点，并预测目标分析和监控窗口。长等待增加主机重启、进程终止、环境变化和失去机会的风险；忙等待和 API hammering 消耗资源并容易形成强特征。
        en: The adversary can preserve a process, script, or persistent object until the chosen time and estimates target
          analysis and monitoring windows. Long waiting increases risk from reboot, termination, environmental change, and
          lost opportunity, while busy waiting and API hammering consume resources and readily form strong features.
    defender_model:
      paragraphs:
      - zh: 防守方可观察进程寿命、等待和计时器调用、时钟读取、重复命令、CPU 与系统调用序列、计划对象及后继动作，并用稳定进程或对象 ID 长期关联。短沙箱时限、进程终止后不保留状态、休眠被自动快进却未同步所有时钟，以及缺少计划对象遥测是主要盲区。
        en: Defenders can observe process lifetime, wait and timer calls, clock reads, repeated commands, CPU and system-call
          sequences, scheduled objects, and successor actions and correlate them over time with stable process or object IDs.
          Short sandbox limits, discarded state after process termination, sleep acceleration without synchronized clocks,
          and missing scheduled-object telemetry are major blind spots.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 攻击者控制的等待把因果链拆出短期观察窗口
    en: Adversary-controlled waiting moves the causal chain outside short observation windows
  analysis:
    paragraphs:
    - zh: 攻击者在前态与恶意后继动作间插入等待，使两个事件落入不同分析或告警窗口；痕迹的时间密度下降，短期系统无法重建共同因果，自动分析还可能在后继动作前结束，形成时空释痕。
      en: The adversary inserts waiting between prior state and malicious successor action so the events land in different
        analysis or alert windows. Trace density falls, short-horizon systems cannot reconstruct shared causality, and automated
        analysis may end before the successor action, producing Spatiotemporal Trace Dilution.
  evidence_refs:
  - REF-000387
  - REF-000417
  - REF-000418
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 等待与后台节奏使活动接近正常空闲外观
    en: Waiting and background cadence make activity resemble normal idleness
  analysis:
    paragraphs:
    - zh: 攻击者使用常见等待调用、系统命令或随机间隔，使单个事件与正常退避、同步和后台任务共享外观；缺少前态与后继动作关联时，防守方难以区分恶意时间控制和合法等待，形成特征伪装。
      en: The adversary uses common wait calls, system commands, or randomized intervals so individual events share the appearance
        of normal backoff, synchronization, and background work. Without joining prior state and successor action, defenders
        struggle to distinguish malicious time control from legitimate waiting, producing Feature Disguise.
  evidence_refs:
  - REF-000387
  - REF-000417
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子技术按观察窗口内的痕迹密度与计算意义划分。NJS-0107-001 在休眠、计时器或绝对时间门控中保持低事件密度的静默等待，需要稳定进程身份、计时器状态和时间加速差分；NJS-0107-002 使用 ping、循环、注册表或文件 I/O 等高密度低价值工作消耗时间，需要工作价值、重复性、资源消耗与后继结果关联。
      en: The formal children are partitioned by trace density and computational meaning inside the observation window. NJS-0107-001
        maintains a low-event-density quiescent wait through sleep, timers, or absolute-time gating and requires stable process
        identity, timer state, and time-acceleration differential. NJS-0107-002 consumes time with high-density low-value work
        such as ping, loops, Registry, or file I/O and requires analysis of work value, repetition, resource consumption, and
        successor outcome.
    - zh: 休眠 API、计时器类型、具体时长和操作系统不构成 NJS-0107-001 内部兄弟；ping、注册表、文件 API 与循环结构不构成 NJS-0107-002 内部兄弟。由调度器保存独立未来触发状态的行为与 T1053 调度技术相邻，本分类只在同一运行实体内的时间位移为直接对象。
      en: Sleep API, timer type, duration, and operating system do not form siblings inside NJS-0107-001, while ping, Registry,
        file API, and loop structure do not form siblings inside NJS-0107-002. Behavior in which a scheduler preserves independent
        future trigger state is adjacent to T1053 scheduling; this taxonomy directly concerns temporal displacement within
        the same running entity.
  coverage: established
  subtechnique_refs:
  - NJS-0107-001
  - NJS-0107-002
