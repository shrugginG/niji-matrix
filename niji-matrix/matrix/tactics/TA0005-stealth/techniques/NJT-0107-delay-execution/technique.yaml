research:
  limitations:
    paragraphs:
    - zh: ATT&CK 父页与 Microsoft 计时器文档支持静默等待语义，但公开资料缺少一个与 Unit 42 API hammering 相当的独立在野静默等待案例，因此 NJS-0107-001 保持中等置信。具体等待时长的恶意意图不能从数值本身推断，必须连接前态、无业务依赖等待和后继敏感动作。
      en: The ATT&CK parent and Microsoft timer documentation support quiescent-wait semantics, but public material lacks an
        independent in-the-wild quiescent-wait case comparable to Unit 42's API-hammering evidence, so NJS-0107-001 remains
        medium confidence. Malicious intent for a specific duration cannot be inferred from its value and requires prior state,
        waiting without business dependency, and a sensitive successor action.
    - zh: Unit 42 直接分析 BazarLoader 和 Zloader 通过注册表与文件 I/O API 大量低价值工作延迟载荷解包与注入，因此 NJS-0107-002 为高置信。但高密度 API 序列可能来自索引、扫描、备份或测试；只有操作对业务输出贡献低、用时主导且后继出现恶意载荷时，才应归因。
      en: Unit 42 directly analyzes BazarLoader and Zloader delaying payload unpacking and injection through large volumes of
        low-value Registry and file-I/O API work, giving NJS-0107-002 high confidence. High-density API sequences may also
        come from indexing, scanning, backup, or testing; attribution requires low contribution to business output, dominant
        time consumption, and a malicious successor payload.
