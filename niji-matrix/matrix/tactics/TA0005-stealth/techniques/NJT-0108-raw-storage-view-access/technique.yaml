schema_version: 2.0.0
type: technique
id: NJT-0108
name:
  zh: 原始存储视图访问
  en: Raw Storage-View Access
summary:
  zh: 攻击者绕过文件系统逻辑路径直接读取或写入卷与设备结构，使文件级控制和监控难以观察真实对象操作。
  en: Adversaries bypass the logical file-system path and read or write volume and device structures directly, making file-level
    controls and monitoring less able to observe the real object operation.
aliases:
- Direct Volume Access
- T1006
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1006
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1006
definition_and_concept:
  paragraphs:
  - zh: 原始存储视图访问是攻击者打开逻辑卷、块设备或设备存储接口并自行解释存储结构，或者取得从底层卷状态派生、可绕过活动文件锁的副本视图，以访问逻辑文件路径下受保护、锁定或被监控内容的行为。直接目的是跨过活动文件 API、锁或文件系统观察层，而不是一般读取文件或正常创建备份。
    en: Raw Storage-View Access is adversary behavior that opens a logical volume, block device, or device-storage interface
      and independently interprets storage structures, or obtains a copy view derived from underlying volume state that bypasses
      live file locks, to access content protected, locked, or monitored under a logical file path. Its immediate purpose
      is to cross the live file API, lock, or file-system observation layer rather than perform ordinary file reading or normal
      backup creation.
  - zh: 原始卷句柄、块设备路径、影子副本、备份语义、网络设备命令和具体工具只是实现。技术成立需要低层或副本视图、敏感文件或结构结果、以及相对正常活动文件视图的实际绕开三者形成可证明关系。
    en: Raw-volume handles, block-device paths, shadow copies, backup semantics, network-device commands, and individual tools
      are implementations. The technique requires a demonstrable relationship among a low-level or copy view, a sensitive
      file or structure outcome, and an actual bypass relative to the normal live-file view.
stealth_characteristics:
  paragraphs:
  - zh: 该技术把文件读取或写入痕迹从路径、文件句柄和过滤驱动视图转移到卷句柄、扇区偏移和存储命令。只监控文件打开、锁冲突或路径访问的防守方会缺少真实目标对象，难以把原始 I/O 与敏感文件内容关联。
    en: The technique moves file read or write traces from path, file handle, and filter-driver views to volume handles, sector
      offsets, and storage commands. Defenders monitoring only file opens, lock conflicts, or path access lack the real target
      object and struggle to associate raw I/O with sensitive file content.
  - zh: 残余痕迹包括设备或卷句柄、特权、偏移和长度模式、文件系统元数据解析、影子副本命令、输出文件和后继凭据或数据使用。内核块 I/O、卷到文件区间映射和结果关联可以恢复因果；存储加密和最小权限会限制效果。
    en: Residual traces include device or volume handles, privilege, offset and length patterns, file-system metadata parsing,
      shadow-copy commands, output files, and successor credential or data use. Kernel block I/O, volume-to-file extent mapping,
      and outcome correlation can restore causality. Storage encryption and least privilege limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入未经授权的原始卷或设备访问，以及为了绕开文件锁、访问控制或文件级监控而使用副本或备份视图读取敏感内容。判定需要将原始操作映射到目标内容和后继用途。
    en: Scope includes unauthorized raw-volume or device access and use of copy or backup views to read sensitive content
      in order to bypass file locks, access control, or file-level monitoring. Classification requires mapping the raw operation
      to target content and successor use.
  - zh: 正常备份、取证采集、磁盘修复、卷管理和获批影子副本操作是反例。只创建副本但随后仍通过正常文件路径访问、普通文件读取以及与内容无关的格式化不属于本技术。工具、设备类型、目标文件和备份产品不构成子技术。
    en: Normal backup, forensic acquisition, disk repair, volume management, and approved shadow-copy operations are counterexamples.
      Creating a copy followed by normal file-path access, ordinary file reads, and formatting unrelated to content are outside
      this technique. Tool, device type, target file, and backup product do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 具有管理或备份权限的攻击者可打开系统卷，解析文件系统记录并复制锁定的目录数据库；也可创建卷影副本后从副本读取敏感文件，或在网络设备上通过底层存储命令绕过通常文件管理接口。
      en: An adversary with administrative or backup authority may open a system volume, parse file-system records, and copy
        a locked directory database; create a shadow copy and read sensitive files from the copy; or use low-level storage
        commands on a network device to bypass the normal file-management interface.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要打开原始存储或创建备份视图的权限，并理解目标文件系统、偏移或快照结构。磁盘加密、受保护进程、设备访问控制和错误解析可能阻止或破坏读取；大量原始 I/O 也可能暴露。
        en: The adversary needs authority to open raw storage or create a backup view and understands the target file system,
          offsets, or snapshot structure. Disk encryption, protected processes, device access control, and incorrect parsing
          may prevent or corrupt reads, and large raw I/O may become conspicuous.
    defender_model:
      paragraphs:
      - zh: 防守方可观察设备和卷句柄、特权使用、块 I/O、快照管理、进程、输出文件和后继敏感用途，并能把卷区间映射到文件。只收集文件级审计、块层缺少进程归因或合法备份量大时形成盲区。
        en: Defenders can observe device and volume handles, privilege use, block I/O, snapshot administration, processes,
          output files, and sensitive successor use and can map volume extents to files. File-level audit alone, block telemetry
          without process attribution, and high legitimate backup volume create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 原始存储路径跨越文件系统观察边界
    en: The raw storage path crosses the file-system observation boundary
  analysis:
    paragraphs:
    - zh: 攻击者用卷或设备视图替代文件 API，痕迹从目标路径访问变为块偏移和存储操作；文件级传感器看不到对象语义，敏感内容跨越观察边界后在输出或内存中出现，降低检测与归因。
      en: The adversary substitutes a volume or device view for the file API, changing traces from target-path access to block
        offsets and storage operations. File-level sensors lose object semantics, and sensitive content appears in output
        or memory only after crossing the observation boundary, reducing detection and attribution.
  evidence_refs:
  - REF-000025
  - REF-000389
  - REF-000419
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前不建立正式子技术。开放搜索覆盖了直接 DASD 句柄、块设备、卷影副本、备份语义、网络设备存储命令和未分配空间读取；其中前五类均需要同一“替代存储视图—敏感对象映射—后继结果”检测链，未分配空间读取若无绕过活动文件视图的目的则属于取证或数据收集邻域。平台、工具、介质、目标文件和读取或写入方向均未形成防御不可互换的兄弟边界。
      en: No formal child is established. Open-ended research covered direct DASD handles, block devices, volume shadow copies,
        backup semantics, network-device storage commands, and reads of unallocated space. The first five require the same
        alternative-storage-view-to-sensitive-object-mapping-to-successor-outcome detection chain; unallocated-space reads
        without bypass of a live-file view belong to forensic or collection neighborhoods. Platform, tool, medium, target
        file, and read-versus-write direction do not create siblings with non-interchangeable defenses.
  coverage: none-justified
  subtechnique_refs: []
