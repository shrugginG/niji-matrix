research:
  limitations:
    paragraphs:
    - zh: Microsoft 文档直接证明 Windows 可取得 DASD 卷或磁盘句柄，CISA 案例直接证明攻击者用卷影副本读取运行中锁定的 NTDS.dit；但公开证据没有统一展示所有平台的块层字段。父行为为高置信；从副本读取是否绕过某一具体文件传感器仍须验证，不能仅凭 vssadmin 或备份命令归类。
      en: Microsoft documentation directly establishes Windows DASD volume or disk handles, and the CISA case directly establishes
        adversary use of a volume shadow copy to read the live-locked NTDS.dit. Public evidence does not expose uniform block-layer
        fields across platforms, however. The parent behavior is high confidence; whether a copy read bypasses a particular
        file sensor must still be verified and cannot be inferred from vssadmin or a backup command alone.
