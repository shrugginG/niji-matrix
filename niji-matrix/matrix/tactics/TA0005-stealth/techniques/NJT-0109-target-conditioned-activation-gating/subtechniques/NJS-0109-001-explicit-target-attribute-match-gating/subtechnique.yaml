schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0109-001
name:
  zh: 显式目标属性匹配门控
  en: Explicit Target-Attribute Match Gating
summary:
  zh: 攻击者读取可恢复的目标属性，并以明文、散列或规则比较结果控制核心恶意分支是否继续。
  en: Adversaries read a recoverable target attribute and use a plaintext, hash, or rule comparison to decide whether the
    core malicious branch continues.
aliases: []
parent_ref: NJT-0109
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 显式目标属性匹配门控是攻击者读取路径、域、主机名、参数、地域、用户代理、文件、共享资源或其他可观察属性，将其与预期值或规则直接比较，并只在匹配时释放、投递或执行核心恶意能力的匿迹子技术。比较值可以被散列或混淆，但运行时仍存在可恢复的“属性—比较—分支”关系。
    en: Explicit Target-Attribute Match Gating is an evasion sub-technique in which an adversary reads a path, domain, hostname,
      parameter, geolocation, user agent, file, share, or another observable attribute, directly compares it with an expected
      value or rule, and releases, delivers, or executes core malicious capability only on a match. The comparison value may
      be hashed or obfuscated, but a recoverable attribute-to-comparison-to-branch relationship remains at runtime.
  - zh: 稳定变量是可读属性对后继分支的直接控制。属性类型、比较运算、散列函数、客户端或服务端执行位置是实现；环境值参与密钥派生且不产生可独立恢复的显式比较分支时属于 NJS-0109-002。
    en: The stable variable is direct control of a successor branch by a readable attribute. Attribute type, comparison operator,
      hash function, and client- or server-side location are implementations. When environmental values participate in key
      derivation without a separately recoverable explicit comparison branch, the behavior belongs to NJS-0109-002.
stealth_characteristics:
  paragraphs:
  - zh: 显式目标属性匹配门控使失配环境只观察到退出、诱饵、重定向或载荷缺失，核心能力从样本动态行为和投递记录中消失。攻击者可降低非目标暴露并让研究者误判样本不完整、损坏或仅具侦查功能。
    en: Explicit Target-Attribute Match Gating causes a mismatched environment to observe only exit, decoy behavior, redirection,
      or payload absence, removing core capability from sample behavior and delivery records. The adversary can reduce off-target
      exposure and cause researchers to mistake the sample for incomplete, broken, or reconnaissance-only code.
  - zh: 残余痕迹包括属性读取、规范化、常量或规则访问、比较结果与后继差异。条件恢复、单变量环境修改、服务端决策日志和匹配与失配运行对照可恢复因果；属性普遍存在或条件泄露时效果降低。
    en: Residual traces include attribute reads, normalization, constant or rule access, comparison result, and differential
      successors. Condition recovery, one-variable environment modification, server-side decision logs, and matched-versus-unmatched
      runs can restore causality. The effect falls when the attribute is ubiquitous or the condition is disclosed.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入可读目标属性与核心恶意后继之间可重复的直接条件关系。必须证明匹配产生载荷、解码、通信、持久化或其他核心动作，而失配产生不同结果；仅有环境枚举、一个字符串或一次退出不足以成立。
    en: Scope includes a repeatable direct conditional relationship between a readable target attribute and a core malicious
      successor. Evidence must show that a match produces payload, decoding, communication, persistence, or another core action
      while mismatch produces a different outcome. Environment enumeration, one string, or one exit alone is insufficient.
  - zh: 通用互斥与单实例控制、合法兼容性和许可检查排除。检查已知分析环境值并在匹配时退出归 NJT-0122；等待目标时间到达但不比较目标归 NJT-0107；环境值派生解密密钥归 NJS-0109-002。
    en: Generic mutex and single-instance control and legitimate compatibility or licensing checks are excluded. Checking
      a known analysis-environment value and exiting on a match belongs to NJT-0122. Waiting for time to pass without target
      matching belongs to NJT-0107. Deriving a decryption key from environmental values belongs to NJS-0109-002.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: >-
        投递器可按路径、用户代理或地域决定是否写出下一阶段，植入可按域、主机名、文件或参数决定是否通信或执行影响。EnvyScout 仅在 pathname 前缀为 C: 时写出 ISO，提供了直接案例。
      en: >-
        A delivery component may use path, user agent, or geolocation to decide whether to write the next stage, while an implant
        may use domain, hostname, file, or parameter to decide whether to communicate or execute impact. EnvyScout writing
        its ISO only when pathname begins with C: provides a direct case.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要预先知道稳定目标属性并把条件嵌入客户端或服务器决策。目标属性漂移会导致误拒绝；比较值与规则一旦被恢复，防守方可构造匹配环境并暴露能力。
        en: The adversary needs prior knowledge of a stable target attribute and embeds the condition in a client or server
          decision. Target-attribute drift can cause false rejection. Once comparison values and rules are recovered, defenders
          can construct a matching environment and expose the capability.
    defender_model:
      paragraphs:
      - zh: 防守方可观察属性读取、配置和常量访问、比较或分支、投递结果及后继动作，并按样本、进程或投递会话做单变量差分。服务端条件不可见、只有一次目标运行或属性被端到端散列时形成盲区。
        en: Defenders can observe attribute reads, configuration and constant access, comparison or branching, delivery results,
          and successor actions and perform one-variable differential by sample, process, or delivery session. Blind spots
          arise when a server-side condition is invisible, only one target run exists, or the attribute is hashed end to end.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 显式条件在非匹配环境进入观察前否定核心分支
    en: An explicit condition denies the core branch before it enters observation in a mismatched environment
  analysis:
    paragraphs:
    - zh: 攻击者把可读目标属性与预期值比较，失配时终止或保留载荷，使观察痕迹从完整核心动作缩减为属性读取、比较和低价值结果；真实能力仅越过匹配边界后出现，形成行为透明。
      en: The adversary compares a readable target attribute with an expected value and exits or withholds the payload on
        mismatch, contracting observed traces from the complete core action to attribute reads, comparison, and a low-value
        result. True capability appears only after the matching boundary is crossed, producing Behavioral Transparency.
  evidence_refs:
  - REF-000390
  - REF-000420
  confidence: high
defense:
  detections:
    coverage: available
    strategy_refs:
    - DET-000106
  mitigations:
    coverage: not-applicable
    mitigation_refs: []
    rationale:
      paragraphs:
      - zh: 条件比较本身广泛存在于正常软件，且门控可能减少非目标影响；直接禁止该机制不可行。防守应阻止更早的未授权执行，并检测条件到恶意后继结果的因果链。
        en: Conditional comparison is ubiquitous in legitimate software and gating may reduce off-target harm, so prohibiting
          the mechanism directly is infeasible. Defenders should prevent earlier unauthorized execution and detect the causal
          chain from condition to malicious successor outcome.
evidence:
  claim_refs:
  - CLM-000625
  case_refs:
  - CASE-000142
  reference_refs:
  - REF-000390
  - REF-000420
research:
  limitations:
    paragraphs:
    - zh: EnvyScout 直接证明路径与用户代理门控，但不代表所有属性或服务端决策均可在端点恢复。缺少匹配与失配结果对照时，只能确认属性检查，不能确认恶意能力门控。
      en: EnvyScout directly establishes path and user-agent gating but does not imply that every attribute or server-side
        decision is recoverable at the endpoint. Without matched and unmatched outcome comparison, only an attribute check
        can be established, not malicious capability gating.
