schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0109-002
name:
  zh: 环境派生密码激活
  en: Environment-Derived Cryptographic Activation
summary:
  zh: 攻击者从预期目标环境值派生密码材料，使核心内容只有在正确环境才能解密和执行。
  en: Adversaries derive cryptographic material from expected target-environment values so core content decrypts and executes
    only in the correct environment.
aliases: []
parent_ref: NJT-0109
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 环境派生密码激活是攻击者读取一个或多个目标环境值，按特定规范化与密钥派生过程生成解密材料，并让核心载荷、配置或功能只有在解密成功时出现的匿迹子技术。预期值不必作为可比较常量存在于样本中，错误环境通常只产生不可用明文、完整性失败或无后继执行。
    en: Environment-Derived Cryptographic Activation is an evasion sub-technique in which an adversary reads one or more target-environment
      values, generates decryption material through specified normalization and key derivation, and exposes a core payload,
      configuration, or function only when decryption succeeds. The expected value need not exist as a comparable constant
      in the sample; a wrong environment usually produces unusable plaintext, integrity failure, or no successor execution.
  - zh: 稳定变量是环境材料进入密码派生并决定核心内容可恢复性。环境字段、散列或 KDF、轮数、密码算法和内容格式是实现；若运行时存在可独立恢复的属性比较并直接跳转，则归 NJS-0109-001。
    en: The stable variable is environmental material entering cryptographic derivation and determining recoverability of
      core content. Environment field, hash or KDF, iteration count, cipher, and content format are implementations. A separately
      recoverable runtime attribute comparison that directly branches belongs to NJS-0109-001.
stealth_characteristics:
  paragraphs:
  - zh: 环境派生密码激活使未匹配环境不仅不执行核心能力，还可能无法确认密文内容、正确密钥或预期属性，静态和动态分析都缺少明文锚点。攻击者因此把能力披露与目标环境知识绑定，增加样本共享、自动沙箱和众包逆向的成本。
    en: Environment-Derived Cryptographic Activation causes a mismatched environment not only to fail to execute core capability
      but also to remain unable to confirm ciphertext content, the correct key, or the expected attribute, depriving static
      and dynamic analysis of a plaintext anchor. The adversary thus binds capability disclosure to target-environment knowledge
      and increases the cost of sample sharing, automated sandboxing, and crowdsourced reverse engineering.
  - zh: 残余痕迹包括环境值读取与规范化、重复散列或 KDF、密文区段访问、解密完整性结果、内存明文和后继执行。捕获派生输入、内存快照、函数级密码遥测和环境候选重放可恢复因果；若密钥或正确环境泄露，效果迅速降低。
    en: Residual traces include environment-value reads and normalization, repeated hashing or KDF use, ciphertext-section
      access, decryption integrity results, plaintext in memory, and successor execution. Capturing derivation inputs, memory
      snapshots, function-level cryptographic telemetry, and replaying candidate environments can restore causality. The effect
      falls rapidly if the key or correct environment is disclosed.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入目标环境值直接参与解密密钥或等价密码材料派生，且解密成功决定核心恶意内容是否可用的实例。必须连接输入材料、派生、特定密文、结果和后继执行；一般加密、配置保护或一次散列不足以成立。
    en: Scope includes instances where target-environment values directly participate in deriving a decryption key or equivalent
      cryptographic material and decryption success determines whether core malicious content is usable. Evidence must connect
      input material, derivation, specific ciphertext, result, and successor execution. General encryption, configuration
      protection, or one hash alone is insufficient.
  - zh: 带硬编码密钥的普通解密属于混淆或解码邻域；可恢复条件比较直接跳转归 NJS-0109-001；合法设备绑定、DRM、密钥封装和企业秘密管理是正常反例。
    en: Ordinary decryption with a hard-coded key belongs to obfuscation or decoding neighborhoods. A recoverable conditional
      comparison that directly branches belongs to NJS-0109-001. Legitimate device binding, DRM, key wrapping, and enterprise
      secret management are normal counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 载荷可组合 PATH、目录名、域、网络共享、设备标识或时间值，经重复散列或 KDF 生成密钥并解密嵌入区段。Gauss 从 PATH 与 PROGRAMFILES 目录名组合派生 RC4 密钥、保护特殊载荷区段，提供了直接案例。
      en: A payload may combine PATH, a directory name, domain, network share, device identity, or time value, pass it through
        repeated hashing or a KDF, and decrypt an embedded section. Gauss deriving an RC4 key from a combination of PATH and
        a PROGRAMFILES directory name to protect special payload sections provides a direct case.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要预先掌握稳定环境值、正确实现规范化与派生并容忍目标变化导致解密失败。越强的环境绑定越能保护能力，但也越容易因路径、软件或配置漂移而阻断行动。
        en: The adversary needs prior knowledge of stable environmental values, correct normalization and derivation, and tolerance
          for decryption failure after target changes. Stronger environment binding better protects capability but more readily
          blocks the operation when path, software, or configuration drifts.
    defender_model:
      paragraphs:
      - zh: 防守方可观察环境读取、密码调用、密文访问、内存写入、完整性检查和后继执行，并在隔离环境捕获派生参数或重放候选值。用户态密码被内联、自定义实现、服务端持有部分材料或正确环境不可复制时形成盲区。
        en: Defenders can observe environment reads, cryptographic calls, ciphertext access, memory writes, integrity checks,
          and successor execution and can capture derivation parameters or replay candidate values in isolation. Blind spots
          arise when user-mode cryptography is inlined or custom, the server holds part of the material, or the correct environment
          cannot be reproduced.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 环境派生密钥使核心内容在非匹配观察环境保持不可见
    en: An environment-derived key keeps core content invisible in nonmatching observation environments
  analysis:
    paragraphs:
    - zh: 攻击者用目标环境值派生解密材料，使错误环境无法产生核心明文或后继执行；观察痕迹被缩减为环境读取、派生与失败结果，真实能力保留在密码边界之后，形成行为透明。
      en: The adversary derives decryption material from target-environment values so a wrong environment cannot produce core
        plaintext or successor execution. Observed traces contract to environment reads, derivation, and failure while true
        capability remains behind the cryptographic boundary, producing Behavioral Transparency.
  evidence_refs:
  - REF-000390
  - REF-000421
  confidence: high
defense:
  detections:
    coverage: available
    strategy_refs:
    - DET-000124
  mitigations:
    coverage: not-applicable
    mitigation_refs: []
    rationale:
      paragraphs:
      - zh: 环境绑定密码机制本身也用于合法保护，且可能减少非目标受害；直接禁止不可行。防守应阻止更早执行，并检测环境材料到恶意解密和后继结果的完整链。
        en: Environment-bound cryptography is also used for legitimate protection and may reduce off-target harm, so direct
          prohibition is infeasible. Defenders should prevent earlier execution and detect the complete chain from environmental
          material through malicious decryption to successor outcome.
evidence:
  claim_refs:
  - CLM-000626
  case_refs:
  - CASE-000143
  reference_refs:
  - REF-000390
  - REF-000421
research:
  limitations:
    paragraphs:
    - zh: Gauss 直接证明一种 Windows 环境组合、重复 MD5 与 RC4 区段，但未知明文使其后继功能无法由公开资料确认。子技术存在与防御边界为高置信，Gauss 特定区段的最终目的仍为未知。
      en: Gauss directly establishes one Windows environment combination, repeated MD5, and RC4-protected sections, but unknown
        plaintext prevents public confirmation of their successor function. The child's existence and defense boundary are
        high confidence; the ultimate purpose of the specific Gauss sections remains unknown.
