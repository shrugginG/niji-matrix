research:
  limitations:
    paragraphs:
    - zh: Microsoft 的 EnvyScout 报告直接展示属性匹配后的投递差异，Kaspersky 的 Gauss 报告直接展示环境派生密钥与不可恢复区段；两类子技术均为高置信。服务端门控可能不向端点暴露决策，密码门控在缺少正确环境时可能无法验证成功分支；因此分析必须保留“未观察到激活”与“已证明条件失配”之间的状态差异。
      en: Microsoft's EnvyScout reporting directly exposes delivery differential after attribute matching, and Kaspersky's
        Gauss reporting directly exposes an environment-derived key and unrecoverable sections, making both children high
        confidence. Server-side gating may hide the decision from the endpoint, and cryptographic gating may leave the success
        branch unverifiable without the correct environment. Analytics must therefore preserve the state difference between
        activation not observed and condition mismatch established.
