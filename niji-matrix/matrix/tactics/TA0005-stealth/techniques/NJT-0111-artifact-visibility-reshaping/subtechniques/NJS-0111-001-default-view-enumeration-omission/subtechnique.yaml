research:
  limitations:
    paragraphs:
    - zh: Tarrask 直接证明计划任务从 schtasks 与 GUI 默认视图消失但仍按触发器运行，隐藏文件资料补充一般属性语义；账户、窗口、邮件和扫描排除仍随产品变化。归类需要验证底层对象存在和后继消费，不能从一个隐藏标志直接外推。
      en: Tarrask directly establishes a scheduled task disappearing from schtasks and the GUI default view while still running
        on its trigger, and hidden-file documentation supplies general attribute semantics. Accounts, windows, mail, and scan
        exclusions still vary by product. Classification requires underlying-object existence and successor consumption and
        cannot be inferred from one hidden flag alone.
