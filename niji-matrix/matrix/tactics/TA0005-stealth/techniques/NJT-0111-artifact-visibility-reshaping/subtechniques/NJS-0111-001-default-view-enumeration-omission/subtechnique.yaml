schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0111-001
name:
  zh: 默认视图枚举遗漏
  en: Default-View Enumeration Omission
summary:
  zh: 攻击者让工件保留在底层状态中，却不被常用列表、用户界面或默认扫描范围返回。
  en: Adversaries preserve an artifact in underlying state while preventing common lists, user interfaces, or default scan
    scope from returning it.
aliases: []
parent_ref: NJT-0111
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 默认视图枚举遗漏的稳定变量是底层对象存在且可被攻击者使用，但常用枚举或用户默认视图基于隐藏属性、过滤、规则或排除范围不返回它。直接目的在于利用“未列出即不存在”的观察假设，而不是改变内容地址或运行时表示。
    en: Default-View Enumeration Omission has the stable variable that an underlying object exists and remains usable by the
      adversary while common enumeration or the user's default view does not return it because of hidden attributes, filtering,
      rules, or exclusion scope. Its immediate purpose is to exploit the assumption that unlisted means nonexistent rather
      than change content addressing or runtime representation.
stealth_characteristics:
  paragraphs:
  - zh: 默认视图枚举遗漏让文件、账户、窗口、消息或排除路径从常见列表消失，但对象 ID、元数据、直接访问、服务器端记录和后继使用仍然存在。全量枚举或不同接口比较可以恢复可见性。
    en: Default-View Enumeration Omission removes a file, account, window, message, or excluded path from a common list while
      object ID, metadata, direct access, server-side record, and successor use remain. Full enumeration or comparison across
      interfaces can restore visibility.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制隐藏属性、列表过滤、邮箱规则或扫描排除，使底层对象不出现在默认视图。对象删除、普通权限拒绝和合法系统隐藏排除；内容位于替代地址空间归兄弟项。
    en: Scope includes adversary control of hidden attributes, list filtering, mailbox rules, or scan exclusions so an underlying
      object does not appear in the default view. Object deletion, ordinary permission denial, and legitimate system hiding
      are excluded. Content in an alternate address space belongs to a sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可设置隐藏文件或账户、隐藏窗口、创建邮件规则转移消息，或把文件置于默认扫描排除路径；对象仍由进程、认证、邮箱或加载器使用。
      en: An adversary may mark a file or account hidden, conceal a window, create a mail rule that moves messages, or place
        a file in a default scan-exclusion path while a process, authentication system, mailbox, or loader still uses the
        object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要修改相应属性、规则或位置，并知道防守方依赖的默认枚举。全视图审计和配置完整性会降低效果，异常隐藏对象数量也可能暴露。
        en: The adversary can modify the relevant attribute, rule, or location and knows the defender's default enumeration.
          Full-view audit and configuration integrity reduce the effect, and an anomalous number of hidden objects may expose
          it.
    defender_model:
      paragraphs:
      - zh: 防守方可比较默认与完整枚举、客户端与服务器视图、排除配置和对象消费。只依赖 GUI 或普通列表命令是主要盲区；合法隐藏对象需要角色基线。
        en: Defenders can compare default and complete enumeration, client and server views, exclusion configuration, and
          object consumption. Reliance on a GUI or ordinary listing command is the main blind spot, and legitimate hidden
          objects require role baselines.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 底层对象跨越默认枚举边界继续存在
    en: The underlying object continues to exist across the default-enumeration boundary
  analysis:
    paragraphs:
    - zh: 攻击者修改默认枚举规则而不删除对象，痕迹从可见列表项变为底层元数据和后继消费；防守方在常用边界看不到对象，形成行为透明。
      en: The adversary changes default enumeration without deleting the object, moving traces from a visible list entry to
        underlying metadata and successor consumption. The defender cannot see the object at the common boundary, producing
        Behavioral Transparency.
