research:
  limitations:
    paragraphs:
    - zh: Astaroth 直接证明攻击链把内容放入 ADS 并由合法加载路径消费，NTFS 属性资料提供地址语义；其他文件系统和挂载实现仍需验证默认遍历差异。并非所有扩展属性或分支都可执行，子技术只要求内容被后继恶意行为实际消费。
      en: Astaroth directly establishes attack-chain content placed in an ADS and consumed through a legitimate loading path,
        while NTFS attribute documentation supplies address semantics. Other file-system and mount implementations still require
        verification of default-traversal difference. Not every extended attribute or fork is executable; the child requires
        actual successor malicious consumption.
