schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0111-002
name:
  zh: 替代地址空间内容放置
  en: Alternate-Address Content Placement
summary:
  zh: 攻击者把内容放入默认路径遍历不到的属性、分支、命名空间或挂载视图，同时保持其可寻址和可消费。
  en: Adversaries place content in an attribute, fork, namespace, or mount view not traversed by the default path while keeping
    it addressable and consumable.
aliases: []
parent_ref: NJT-0111
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 替代地址空间内容放置的稳定变量是同一存储对象或底层设备提供多个地址或视图，攻击者把内容置于默认文件路径与普通枚举未遍历的位置。直接目的在于保留内容可读或可执行性，同时让路径级检查只看到承载对象或另一视图。
    en: Alternate-Address Content Placement has the stable variable that one storage object or underlying device provides
      multiple addresses or views and the adversary places content where the default file path and ordinary enumeration do
      not traverse. Its immediate purpose is to preserve readability or executability while path-level inspection sees only
      the carrier object or another view.
stealth_characteristics:
  paragraphs:
  - zh: 替代地址空间内容放置：默认目录和文件大小可能不显示替代内容，但属性表、分支、命名空间、挂载关系、底层块和后继打开操作仍留痕。原始结构遍历与地址规范化可以恢复内容。
    en: 'Alternate-Address Content Placement: Default directories and file size may not display alternate content, but attribute
      tables, forks, namespaces, mount relationships, underlying blocks, and successor open operations remain. Raw-structure
      traversal and address normalization can recover the content.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入替代数据流、扩展属性、资源分支、隐藏文件系统和挂载别名等多地址放置。普通隐藏标志归默认视图遗漏，内容加密归数据遮蔽，合法元数据和容器挂载是反例。
    en: Scope includes alternate data streams, extended attributes, resource forks, hidden file systems, and mount aliases
      as multi-address placement. Ordinary hidden flags belong to default-view omission, encrypted content to data obscuration,
      and legitimate metadata and container mounts are counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可把载荷写入 NTFS 替代数据流、macOS 资源分支、Linux 扩展属性或被挂载视图遮蔽的路径，再由了解完整地址的加载器读取。
      en: An adversary may write a payload to an NTFS alternate data stream, macOS resource fork, Linux extended attribute,
        or path obscured by a mount view and have a loader that knows the complete address read it.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要写入替代命名空间和后续读取能力，并知道工具忽略的视图。复制、归档或文件系统转换可能丢失隐藏内容，完整结构扫描会暴露。
        en: The adversary needs write access to the alternate namespace and subsequent read capability and knows which views
          tools omit. Copy, archive, or file-system conversion may lose hidden content, while complete structure scanning
          exposes it.
    defender_model:
      paragraphs:
      - zh: 防守方能枚举全部属性、分支和挂载，解析底层结构并关联加载操作。只扫描主数据流或规范路径、备份不保留替代属性时形成盲区。
        en: Defenders can enumerate all attributes, forks, and mounts, parse underlying structures, and correlate loader access.
          Scanning only the primary stream or canonical path and backups that omit alternate attributes create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 内容跨越默认路径地址边界
    en: Content crosses the default path-address boundary
  analysis:
    paragraphs:
    - zh: 攻击者把内容写入另一个地址空间，痕迹从普通路径内容变为承载对象元数据和特殊打开操作；默认检查边界无法到达真实内容，形成行为透明。
      en: The adversary writes content into another address space, changing traces from ordinary path content to carrier metadata
        and a special open operation. The default inspection boundary cannot reach the real content, producing Behavioral
        Transparency.
