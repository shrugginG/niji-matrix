research:
  limitations:
    paragraphs:
    - zh: MINEBRIDGE 活动直接证明良性或空白 VBA 源码与恶意 p-code 分离，但成功执行依赖 Office 版本；进程参数欺骗提供另一种运行时表示证据。推广到其他格式时必须证明检查接口与执行引擎读取不同状态，不能把所有自修改代码归入本类。
      en: MINEBRIDGE activity directly establishes benign or blank VBA source diverging from malicious p-code, although successful
        execution depends on Office version, and process-argument spoofing provides another runtime-representation instance.
        Generalization to other formats requires proof that the inspection interface and execution engine read different state;
        not all self-modifying code belongs here.
