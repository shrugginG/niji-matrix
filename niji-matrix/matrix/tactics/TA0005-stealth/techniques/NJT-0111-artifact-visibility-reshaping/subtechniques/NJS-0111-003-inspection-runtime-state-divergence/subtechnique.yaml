schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0111-003
name:
  zh: 检查表示—运行状态分离
  en: Inspection-Representation and Runtime-State Divergence
summary:
  zh: 攻击者让常用检查接口看到的源码、参数或对象表示与实际运行时状态不同。
  en: Adversaries make source, arguments, or object representation seen by common inspection interfaces differ from actual
    runtime state.
aliases: []
parent_ref: NJT-0111
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 检查表示—运行状态分离的稳定变量是同一执行对象在创建时、静态存储或常用查询接口中的表示，与处理器或运行时实际消费的内容不同。直接目的在于让分析工具读取良性或不完整表示，同时恶意状态继续执行。
    en: Inspection-Representation and Runtime-State Divergence has the stable variable that one execution object is represented
      differently at creation time, in static storage, or through a common query interface than the content actually consumed
      by the processor or runtime. Its immediate purpose is to make analysis tools read a benign or incomplete representation
      while malicious state continues to execute.
stealth_characteristics:
  paragraphs:
  - zh: 检查表示—运行状态分离：静态源码或延迟命令行查询可以显得正常，而启动时参数、编译缓存或进程内存保留真实执行状态。创建事件、内存、运行结果和表示修改仍留痕；不可变启动记录与运行时比较可恢复差异。
    en: 'Inspection-Representation and Runtime-State Divergence: Static source or delayed command-line queries can appear
      benign while launch-time arguments, compiled cache, or process memory retain true execution state. Creation events,
      memory, runtime outcome, and representation modification remain observable. Immutable launch records and runtime comparison
      can recover the difference.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入静态或查询表示被攻击者修改，而实际执行内容保持不同的行为。普通代码生成、合法宏编译、命令行更新和单纯进程改名排除；替代地址空间归兄弟项。
    en: Scope includes adversary modification of static or queried representation while actual executed content remains different.
      Ordinary code generation, legitimate macro compilation, command-line update, and process renaming alone are excluded.
      Alternate address space belongs to a sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可用良性文本覆盖 VBA 源码而保留已编译执行状态，或在进程创建后覆盖内存中的命令行参数，使后续工具显示的参数与启动时真实值不同。
      en: An adversary may overwrite VBA source with benign text while preserving compiled execution state or overwrite in-memory
        command-line arguments after process creation so later tools display values different from those used at launch.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要修改表示层而不破坏运行状态，并知道检查工具读取的时间点和接口。创建时不可变遥测、内存取证和内容重新编译会降低效果。
        en: The adversary can modify the representation layer without breaking runtime state and knows when and through which
          interface inspection tools read it. Immutable creation telemetry, memory forensics, and content recompilation reduce
          the effect.
    defender_model:
      paragraphs:
      - zh: 防守方能保留创建时参数与哈希、静态源、编译状态、进程内存和运行结果，并按对象身份比较。只在事件后读取可变用户态内存或只检查源码是主要盲区。
        en: Defenders retain launch-time arguments and hashes, static source, compiled state, process memory, and runtime
          outcomes and compare them by object identity. Reading mutable user-space memory only after the event or inspecting
          source alone creates the main blind spot.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 良性检查表示替代真实运行状态
    en: A benign inspection representation substitutes for real runtime state
  analysis:
    paragraphs:
    - zh: 攻击者在检查接口读取前替换表示，痕迹从一致对象变为创建时、静态和运行时多个版本；防守方若只信任良性版本会误分类，形成特征伪装。
      en: The adversary replaces representation before an inspection interface reads it, changing traces from one consistent
        object into creation-time, static, and runtime versions. A defender trusting only the benign version misclassifies
        the object, producing Feature Disguise.
  evidence_refs:
  - REF-000395
  - REF-000392
  - REF-000424
  confidence: high
