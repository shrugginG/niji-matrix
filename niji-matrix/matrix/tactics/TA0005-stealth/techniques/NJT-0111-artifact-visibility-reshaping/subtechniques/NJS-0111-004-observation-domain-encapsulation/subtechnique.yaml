research:
  limitations:
    paragraphs:
    - zh: Ragnar Locker 直接证明来宾内勒索进程超出宿主安全软件可见范围，同时 VDI、VirtualBox 驱动、共享目录和 VboxHeadless.exe 保留边界痕迹。具体宿主可见性仍取决于虚拟化产品和网络模式；若已有来宾代理或管理面内容扫描，匿迹强度可能很低。
      en: Ragnar Locker directly establishes a guest ransomware process outside host security visibility while the VDI, VirtualBox
        driver, shared folders, and VboxHeadless.exe retain boundary traces. Exact host visibility still depends on virtualization
        product and network mode, and stealth strength may be low when a guest agent or management-plane content scan is present.
