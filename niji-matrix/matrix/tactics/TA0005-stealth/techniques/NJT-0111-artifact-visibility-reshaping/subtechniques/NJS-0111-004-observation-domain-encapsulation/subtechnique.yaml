schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0111-004
name:
  zh: 观察域封装
  en: Observation-Domain Encapsulation
summary:
  zh: 攻击者在宿主传感器无法进入的虚拟实例或隔离来宾中运行活动，仅在边界留下生命周期和网络痕迹。
  en: Adversaries run activity inside a virtual instance or isolated guest inaccessible to host sensors, leaving only lifecycle
    and network traces at the boundary.
aliases: []
parent_ref: NJT-0111
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 观察域封装的稳定变量是攻击者把工件和活动置于一个与宿主观察代理分离的执行域，宿主只能看见虚拟化或隔离边界而不能枚举内部状态。直接目的在于利用传感器覆盖边界，而不是一般使用虚拟化。
    en: Observation-Domain Encapsulation has the stable variable that the adversary places artifacts and activity in an execution
      domain separated from the host observation agent so the host sees only the virtualization or isolation boundary and
      cannot enumerate internal state. Its immediate purpose is to exploit sensor-coverage boundaries rather than use virtualization
      generally.
stealth_characteristics:
  paragraphs:
  - zh: 观察域封装：宿主可能只看到虚拟实例创建、资源使用和边界网络，来宾内文件、进程和命令不进入宿主端点遥测。管理面、来宾代理、镜像和虚拟磁盘以及桥接网络仍提供残余观察。
    en: 'Observation-Domain Encapsulation: The host may see only virtual-instance creation, resource use, and boundary networking
      while files, processes, and commands inside the guest do not enter host endpoint telemetry. Management plane, guest
      agent, image and virtual disk, and bridged networking still provide residual observation.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意使用缺少来宾传感器或跨域关联的虚拟实例隐藏内部工件。获批虚拟化、沙箱、容器隔离和没有观察差异的来宾活动是反例；容器本身不自动属于本类。
    en: Scope includes deliberate adversary use of a virtual instance lacking guest sensors or cross-domain correlation to
      hide internal artifacts. Approved virtualization, sandboxes, container isolation, and guest activity without an observation
      difference are counterexamples. A container does not automatically qualify.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在已控制主机启动虚拟机或其他隔离实例，在其中运行工具与通信；宿主安全产品不能进入来宾，只把流量和资源归给虚拟化进程或不同地址。
      en: An adversary starts a virtual machine or another isolated instance on a controlled host and runs tooling and communication
        inside it. Host security products cannot enter the guest and attribute traffic and resources only to the virtualization
        process or a different address.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要创建或运行虚拟实例和向其中放置内容的能力，并承担镜像、磁盘、网络与资源痕迹。管理面限制、来宾代理和虚拟磁盘检查会降低效果。
        en: The adversary can create or run a virtual instance and place content inside it and accepts image, disk, network,
          and resource traces. Management-plane controls, guest agents, and virtual-disk inspection reduce the effect.
    defender_model:
      paragraphs:
      - zh: 防守方可观察虚拟化生命周期、镜像、磁盘、管理 API、来宾遥测和网络边界，并用实例 ID 关联。只部署宿主代理、桥接地址不映射或来宾不可管理时形成盲区。
        en: Defenders can observe virtualization lifecycle, images, disks, management APIs, guest telemetry, and network boundaries
          and correlate them by instance ID. Host-only agents, unmapped bridged addresses, or unmanaged guests create blind
          spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 来宾执行域跨越宿主传感器边界
    en: A guest execution domain crosses the host-sensor boundary
  analysis:
    paragraphs:
    - zh: 攻击者把活动放入来宾域，痕迹从内部文件与进程变为实例生命周期和边界流量；宿主传感器无法观察内部因果，形成行为透明。
      en: The adversary places activity in a guest domain, changing traces from internal files and processes to instance lifecycle
        and boundary traffic. Host sensors cannot observe internal causality, producing Behavioral Transparency.
