research:
  limitations:
    paragraphs:
    - zh: Tarrask、Astaroth、MINEBRIDGE 和 Ragnar Locker 分别为四个观察变量提供结论级实例，但不覆盖同一变量下所有平台。父行为和四类观察拓扑为高置信；Email Hiding Rules、File/Path Exclusions、扩展属性和其他虚拟化实现仍需在具体产品上验证默认与完整视图、地址可达性、表示差分或宿主—来宾传感器边界。
      en: Tarrask, Astaroth, MINEBRIDGE, and Ragnar Locker provide conclusion-level instances for the four observation variables,
        but they do not cover every platform implementation within each variable. The parent behavior and four observation
        topologies are high confidence. Email Hiding Rules, File or Path Exclusions, extended attributes, and other virtualization
        implementations still require product-specific verification of default versus complete view, address reachability,
        representation differential, or host-to-guest sensor boundary.
