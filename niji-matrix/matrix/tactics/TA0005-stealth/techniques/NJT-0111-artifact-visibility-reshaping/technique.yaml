schema_version: 2.0.0
type: technique
id: NJT-0111
name:
  zh: 工件可见性重塑
  en: Artifact Visibility Reshaping
summary:
  zh: 攻击者保留操作所需工件状态，同时改变其在默认枚举、内容地址、检查表示或传感器观察域中的呈现。
  en: Adversaries preserve artifact state required for operation while changing its presentation in default enumeration, content
    addressing, inspection representation, or sensor observation domains.
aliases:
- Hide Artifacts
- T1564
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1564
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1564
definition_and_concept:
  paragraphs:
  - zh: 工件可见性重塑是攻击者在不删除操作所需状态的前提下，改变文件、账户、消息、参数、代码、运行环境或其他工件被常用观察接口发现和解释的方式。直接目的在于让工件继续可被攻击者寻址、加载或使用，却不出现在防守方默认视图或呈现为不同内容。
    en: Artifact Visibility Reshaping is adversary behavior that changes how files, accounts, messages, arguments, code, runtime
      environments, or other artifacts are discovered and interpreted through common observation interfaces without deleting
      state required for operation. Its immediate purpose is to keep an artifact addressable, loadable, or usable by the adversary
      while omitting it from a defender's default view or presenting different content.
  - zh: 本技术以底层真实状态与防守可见表示之间的差异为概念锚。隐藏标志、替代属性、挂载、运行时覆盖和虚拟化是实现；删除、加密、禁用传感器或仅依赖普通权限拒绝不属于本技术。
    en: The conceptual anchor is divergence between underlying real state and defender-visible representation. Hidden flags,
      alternate attributes, mounts, runtime overwrite, and virtualization are implementations. Deletion, encryption, sensor
      disabling, and reliance only on ordinary permission denial are outside this technique.
stealth_characteristics:
  paragraphs:
  - zh: 工件仍存在并产生加载、访问、执行或通信结果，但常用列表、路径、源码、命令行或宿主传感器不能完整显示它。防守方因此可能把缺失当作不存在，把良性表示当作真实状态，或无法把边界事件归因到隐藏观察域。
    en: The artifact still exists and produces loading, access, execution, or communication outcomes, but common lists, paths,
      source views, command lines, or host sensors do not display it completely. Defenders may treat absence as nonexistence,
      a benign representation as real state, or fail to attribute boundary events to a hidden observation domain.
  - zh: 残余痕迹包括底层对象元数据、替代命名空间、不可变启动记录、表示差分、虚拟化生命周期、边界网络和后继消费。全视图枚举、原始结构遍历、创建时与运行时比较以及来宾或管理面遥测可以恢复可见性。
    en: Residual traces include underlying object metadata, alternate namespaces, immutable launch records, representation
      differentials, virtualization lifecycle, boundary networking, and successor consumption. Full-view enumeration, raw-structure
      traversal, creation-time versus runtime comparison, and guest or management-plane telemetry can restore visibility.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制的可见性差异，且工件仍可被加载、执行、读取、路由或用于维持活动。判定要求底层状态、默认观察差异和后继用途三者可连接，而不能从隐藏属性或虚拟实例存在本身推断恶意。
    en: Scope includes adversary-controlled visibility differences where the artifact remains loadable, executable, readable,
      routable, or useful for maintaining activity. Classification requires a join among underlying state, default-observation
      difference, and successor use rather than inference from a hidden attribute or virtual instance alone.
  - zh: 工件删除归指示物移除，加密或编码归数据遮蔽，直接关闭监控归防御损伤，普通访问控制和合法隐私功能为正常反例。工具、平台、介质、字段和目标类型不构成子技术边界。
    en: Artifact deletion belongs to indicator removal, encryption or encoding to data obscuration, and direct monitoring
      shutdown to defense impairment. Ordinary access control and legitimate privacy features are normal counterexamples.
      Tool, platform, medium, field, and target type do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可让文件、账户或邮件不出现在默认列表，把内容放入替代属性或挂载视图，让静态源码或显示参数与运行内容不同，或在宿主传感器无法进入的虚拟实例内执行。工件随后仍由加载器、用户态程序、邮件规则或虚拟化运行时消费。
      en: An adversary may omit files, accounts, or mail from default lists; place content in an alternate attribute or mount
        view; make static source or displayed arguments differ from runtime content; or execute inside a virtual instance
        inaccessible to host sensors. A loader, user-mode program, mail rule, or virtualization runtime still consumes the
        artifact later.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要创建或修改相应元数据、地址空间、运行表示或虚拟化边界的权限，并知道防守方依赖的默认视图。底层完整性检查、全视图枚举、不可变创建记录和跨域传感器会降低效果；过度隐藏也可能形成异常。
        en: The adversary needs authority to create or modify relevant metadata, address space, runtime representation, or
          virtualization boundary and understands the defender's default view. Underlying integrity checks, full-view enumeration,
          immutable creation records, and cross-domain sensors reduce the effect. Excessive hiding may itself become anomalous.
    defender_model:
      paragraphs:
      - zh: 防守方可取得逻辑与原始对象视图、创建时和运行时状态、用户界面与服务器端记录、宿主与来宾或管理面遥测，并按稳定对象 ID 关联。只使用默认 GUI、普通命令、单一 API 或宿主传感器是主要盲区；合法系统隐藏、应用封装和虚拟化需要角色基线。
        en: Defenders can obtain logical and raw object views, creation-time and runtime state, user-interface and server-side
          records, and host plus guest or management-plane telemetry and correlate them by stable object ID. Reliance on a
          default GUI, ordinary command, one API, or host sensor is the main blind spot. Legitimate system hiding, application
          encapsulation, and virtualization require role baselines.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 工件真实状态跨越默认观察边界
    en: Artifact real state crosses the default observation boundary
  analysis:
    paragraphs:
    - zh: 攻击者保留底层工件，却让常用接口省略、重定向或展示不同状态；痕迹从统一对象视图分裂为隐藏状态和后继结果，防守方在默认边界看不到完整对象，形成行为透明。
      en: The adversary preserves the underlying artifact while causing common interfaces to omit, redirect, or display different
        state. Traces split from one object view into hidden state and successor outcome, and defenders cannot see the complete
        object at the default boundary, producing Behavioral Transparency.
  evidence_refs:
  - REF-000392
  - REF-000393
  - REF-000394
  - REF-000395
  - REF-000396
  - REF-000259
  - REF-000282
  - REF-000424
  - REF-000425
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 良性或空白表示替代真实运行工件
    en: A benign or empty representation substitutes for the real runtime artifact
  analysis:
    paragraphs:
    - zh: 在表示分离和默认视图遗漏中，攻击者让检查工具获得良性名称、源码、参数或空白列表，同时真实内容仍被消费；分类依赖可见表示时会降低优先级，形成特征伪装。
      en: In representation divergence and default-view omission, the adversary gives inspection tools a benign name, source,
        argument, or empty list while real content remains in use. Classification that relies on the visible representation
        lowers priority and produces Feature Disguise.
  evidence_refs:
  - REF-000393
  - REF-000395
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子技术按底层状态与防守视图之间的稳定关系划分。默认视图遗漏保留对象但使常用枚举不返回；替代地址空间把内容放在默认路径未遍历的命名空间；检查表示—运行状态分离让同一对象的静态或延迟表示与实际执行不同；观察域封装把活动置于宿主传感器不能进入的来宾域。四者分别需要全视图枚举、底层结构遍历、时间点差分和跨域遥测。
      en: Formal children are divided by stable relationships between underlying state and defender view. Default-View Enumeration
        Omission preserves an object while common enumeration does not return it. Alternate-Address Content Placement stores
        content in a namespace not traversed by the default path. Inspection-Representation and Runtime-State Divergence makes
        static or delayed representation of one object differ from actual execution. Observation-Domain Encapsulation places
        activity in a guest domain inaccessible to host sensors. They respectively require full-view enumeration, underlying-structure
        traversal, time-point differential, and cross-domain telemetry.
    - zh: 文件、账户、邮件、属性、挂载、Office、进程参数和虚拟化产品只是这些变量的载体，不构成边界。忽略进程中断主要改变控制和存活而非工件表示，归相邻行为。
      en: Files, accounts, mail, attributes, mounts, Office, process arguments, and virtualization products are carriers of
        these variables and do not define boundaries. Ignoring process interrupts primarily changes control and survival rather
        than artifact representation and belongs to adjacent behavior.
  coverage: established
