schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0112-001
name:
  zh: 证据对象擦除
  en: Evidence-Object Erasure
summary:
  zh: 攻击者选择性删除日志、脚本、载荷、邮件或暂存内容等可重建攻击链的证据节点。
  en: Adversaries selectively delete evidence nodes such as logs, scripts, payloads, mail, or staged content that reconstruct
    the attack chain.
aliases: []
parent_ref: NJT-0112
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 证据对象擦除是攻击者在使用一个工件后删除其内容或对象记录，使该节点不能再从当前状态连接到先前动作。直接目的在于消除可检查证据，而不是隐藏仍存在的对象、断开对象之间的关系、改写时间或把同一载荷迁移到新位置。
    en: Evidence-Object Erasure is an evasion sub-technique in which an adversary deletes content or an object record after
      use so that node can no longer be joined from current state to prior action. Its immediate purpose is to remove inspectable
      evidence rather than hide an existing object, detach relationships among objects, rewrite time, or move the same payload
      to a new location.
stealth_characteristics:
  paragraphs:
  - zh: 证据对象擦除使事件、文件或暂存内容从当前视图消失，缩短可重建序列并剥夺内容检查与哈希匹配。删除者、删除事件、目录与日志序号缺口、未分配空间、远程副本、备份和先前消费仍残留；攻击者无法访问独立副本时效果受限。
    en: Evidence-Object Erasure removes events, files, or staged content from current view, shortens the reconstructable sequence,
      and denies content inspection and hash matching. Deleter, delete event, directory and log-sequence gap, unallocated space,
      remote replica, backup, and prior consumption remain. The effect is limited when the adversary cannot reach independent
      copies.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入为隐藏攻击而删除日志条目、命令历史、投递文件、暂存归档、恶意脚本、邮件或载荷对象。正常保留、隐私删除、卸载和事件响应清理是反例；对象仍存在但不被默认列出归 NJT-0111，删除关系边归 NJS-0112-002。
    en: Scope includes deletion of log entries, command history, delivered files, staged archives, malicious scripts, mail,
      or payload objects to hide an attack. Normal retention, privacy deletion, uninstall, and incident-response cleanup are
      counterexamples. An object that still exists but is omitted from default view belongs to NJT-0111, and deletion of relation
      edges belongs to NJS-0112-002.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可在载荷加载、凭据提取或数据外传后立即删除工具、脚本和暂存文件，也可清除局部日志或邮箱内容，使调查者失去从结果回溯到来源的节点。
      en: An adversary may immediately delete tools, scripts, and staged files after payload loading, credential extraction,
        or exfiltration or clear local logs or mailbox content so investigators lose nodes needed to trace an outcome back
        to its origin.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要删除目标对象的权限，知道哪些节点最可能被调查，并在后继功能不再依赖对象后选择时机。追加写日志、远程复制、对象锁、文件恢复与正在使用的句柄会限制完全擦除。
        en: The adversary needs authority to delete the target object, knows which nodes are most likely to be investigated,
          and chooses a time after successor functionality no longer depends on the object. Append-only logging, remote replication,
          object lock, file recovery, and open handles limit complete erasure.
    defender_model:
      paragraphs:
      - zh: 防守方可观察创建、消费与删除事件、目录和日志序号、远程副本、备份、内容摘要及删除主体，并按稳定对象 ID 关联。只保留当前状态、删除与修改事件未审计或副本同权可写时形成盲区。
        en: Defenders can observe create, consume, and delete events, directory and log sequence, remote replicas, backups,
          content digests, and deleting principal and correlate them by stable object ID. Blind spots arise when only current
          state is retained, delete and modify events are not audited, or replicas are writable under the same authority.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 证据节点被从可重建因果链中移除
    en: Evidence nodes are removed from the reconstructable causal chain
  analysis:
    paragraphs:
    - zh: 攻击者在工件完成用途后删除节点，痕迹从包含内容与身份的连续链收缩为删除事件和缺口；防守方无法直接检查被移除对象或连接相邻阶段，形成行为透明。
      en: The adversary deletes a node after its purpose is complete, contracting traces from a continuous chain with content
        and identity into a delete event and gap. Defenders cannot directly inspect the removed object or join adjacent stages,
        producing Behavioral Transparency.
  evidence_refs:
  - REF-000397
  - REF-000423
  - REF-000426
  confidence: high
