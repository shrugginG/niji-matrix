research:
  limitations:
    paragraphs:
    - zh: 两个案例直接证明文件与暂存归档删除，但日志、邮箱和其他对象的恢复字段随平台变化。对象缺失只有在前态、删除主体或独立副本存在时才支持本子技术；无法排除正常生命周期时应降低置信度。
      en: Two cases directly establish deletion of files and staged archives, but recovery fields for logs, mail, and other
        objects vary by platform. Object absence supports the child only when prior state, deleting principal, or an independent
        copy exists; confidence must fall when a normal lifecycle cannot be excluded.
