schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0112-002
name:
  zh: 操作关系拆除
  en: Operational-Relationship Teardown
summary:
  zh: 攻击者删除共享、连接、持久化或其他操作关系，使活动图失去连接边而相关对象可能仍存在。
  en: Adversaries remove share, connection, persistence, or other operational relationships so the activity graph loses edges
    while related objects may remain.
aliases: []
parent_ref: NJT-0112
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 操作关系拆除是攻击者在完成使用后断开对象之间的共享映射、网络会话、路由配置、持久化注册或账户关系，使防守方无法从当前关系图识别此前路径。直接对象是边而不是节点内容；相关主机、文件或账户可以继续存在。
    en: Operational-Relationship Teardown is an evasion sub-technique in which an adversary detaches share mappings, network
      sessions, routing configuration, persistence registrations, or account relationships after use so defenders cannot
      recover the prior path from the current relation graph. Its direct object is an edge rather than node content, and the
      related hosts, files, or accounts may continue to exist.
stealth_characteristics:
  paragraphs:
  - zh: 操作关系拆除让外传路径、横向连接或启动关系从当前配置消失，剩余对象看似互不相关。会话建立与拆除事件、服务器端连接、认证日志、配置版本、远端端点和先前消费仍可重建边；只查看当前映射会遗漏。
    en: Operational-Relationship Teardown removes exfiltration paths, lateral connections, or startup relationships from current
      configuration and leaves remaining objects appearing unrelated. Session establishment and teardown events, server-side
      connection state, authentication logs, configuration versions, remote endpoints, and prior consumption can reconstruct
      the edge. Current mapping alone misses it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入为隐藏活动而断开网络共享、清理连接历史或配置、删除已使用持久化关系以及移除攻击账户关系。删除相关文件或日志节点归 NJS-0112-001；合法会话结束、卸载与事件响应撤销是反例。
    en: Scope includes detaching network shares, clearing connection history or configuration, deleting used persistence relationships,
      and removing attack-account relations to hide activity. Deleting related file or log nodes belongs to NJS-0112-001.
      Normal session end, uninstall, and incident-response revocation are counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可在完成暂存和外传后断开 SMB 共享，在横向移动后删除连接历史，或在持久化已触发、新实例接管或撤离前移除计划任务、服务、Run 键和临时账户关系。
      en: An adversary may detach an SMB share after staging and exfiltration, clear connection history after lateral movement,
        or remove scheduled-task, service, Run-key, or temporary-account relationships after persistence triggers, a new instance
        takes over, or withdrawal begins.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要管理会话或关系对象的权限，知道何时拆除不会中断目标动作，并理解客户端与服务器两侧状态。远端审计、不可变配置版本和主动会话监控会保留关系证据。
        en: The adversary needs authority to manage session or relation objects, knows when teardown will not interrupt the
          objective, and understands state on both client and server sides. Remote auditing, immutable configuration versions,
          and active session monitoring retain relationship evidence.
    defender_model:
      paragraphs:
      - zh: 防守方可观察关系创建、使用和拆除、认证、客户端与服务器会话、配置前后态及相关对象消费，并以关系 ID 或两端主体关联。只保留当前映射、单侧日志或动态关系没有稳定 ID 时形成盲区。
        en: Defenders can observe relation creation, use, and teardown, authentication, client and server sessions, configuration
          before and after state, and related object consumption and correlate by relation ID or both endpoint subjects. Blind
          spots arise when only current mappings or one-sided logs are retained or dynamic relations lack stable identity.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 操作关系边被从攻击图中选择性拆除
    en: Operational relation edges are selectively removed from the attack graph
  analysis:
    paragraphs:
    - zh: 攻击者在关系完成用途后删除边，痕迹从可连接的主体—路径—结果变为分散节点与拆除事件；防守方无法仅凭当前状态重建传输或触发关系，形成行为透明。
      en: The adversary removes an edge after its use, changing traces from joinable subject-path-outcome into separated nodes
        and a teardown event. Current state alone cannot reconstruct the transfer or trigger relationship, producing Behavioral
        Transparency.
