research:
  limitations:
    paragraphs:
    - zh: BRONZE UNION 直接证明外传后断开网络共享；持久化和网络历史等其他关系类型仍需平台特定证据。正常会话结束与恶意拆除同形，必须连接先前攻击用途和未批准拆除主体。
      en: BRONZE UNION directly establishes network-share detachment after exfiltration, while other relation types such as
        persistence and network history still require platform-specific evidence. Normal session termination has the same
        shape as malicious teardown and must be joined to prior attack use and an unapproved teardown principal.
