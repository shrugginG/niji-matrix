schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0112-003
name:
  zh: 时间元数据伪造
  en: Temporal-Metadata Falsification
summary:
  zh: 攻击者改写工件创建、访问或修改时间，使对象仍存在但时间线和新旧判断不可信。
  en: Adversaries rewrite artifact creation, access, or modification times so the object remains while timelines and age judgments
    become untrustworthy.
aliases: []
parent_ref: NJT-0112
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 时间元数据伪造是攻击者把文件、注册表或其他工件的时间属性设置为旧值、统一值、随机值或邻近合法对象的值，使元数据不再表达真实创建与修改顺序。直接目的在于破坏调查时间线和基于新近程度的检测，而不删除对象或改变其内容身份。
    en: Temporal-Metadata Falsification is an evasion sub-technique in which an adversary sets file, registry, or other artifact
      times to an old, uniform, random, or neighboring legitimate value so metadata no longer represents the true creation
      and modification order. Its immediate purpose is to corrupt investigative timelines and recency-based detection without
      deleting the object or changing its content identity.
stealth_characteristics:
  paragraphs:
  - zh: 时间元数据伪造让新载荷看似旧文件、批量变化看似历史状态，或使不同阶段顺序颠倒。时间写入 API、文件系统多套时间属性、日志序号、USN/审计记录、父目录与同内容副本仍可反证；攻击者只能改写一部分时间源时效果受限。
    en: Temporal-Metadata Falsification makes a new payload appear old, bulk changes appear historical, or stages appear out
      of order. Time-writing APIs, multiple file-system timestamp sets, log sequence, USN or audit records, parent directory,
      and same-content replicas remain counterevidence. The effect is limited when the adversary can rewrite only some time
      sources.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入为隐藏攻击而改写创建、访问、修改、变更或注册表时间的行为。合法恢复、归档、复制、时钟校正和构建产物时间是反例；仅修改 PE 编译时间而不影响防守观察需另行证明。位置迁移导致的自然时间变化归 NJS-0112-004。
    en: Scope includes rewriting creation, access, modification, change, or registry times to hide an attack. Legitimate restore,
      archive, copy, clock correction, and build-artifact times are counterexamples. Modification of a PE compile time alone
      requires separate proof of defensive effect. Natural time changes caused by relocation belong to NJS-0112-004.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可让 web shell 与同目录系统文件时间一致，把新工具回写到旧年份，或在加密与清理后把大批工件设置为统一时间，降低按最近变更搜索和时间线调查的效果。
      en: An adversary may align a web shell's times with neighboring system files, backdate a new tool to an old year, or
        set many artifacts to one time after encryption or cleanup, reducing recent-change hunting and timeline investigation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要修改时间属性的权限，知道目标文件系统与防守方使用的时间源，并选择可信参照。不可变创建事件、内核日志、双时间属性与远程副本会暴露矛盾；极端或统一时间也可能形成异常。
        en: The adversary needs authority to modify time attributes, understands the target file system and defender time sources,
          and selects a plausible reference. Immutable creation events, kernel logs, dual timestamp attributes, and remote
          replicas expose contradictions, while extreme or uniform times may themselves be anomalous.
    defender_model:
      paragraphs:
      - zh: 防守方可采集时间修改者与 API、文件系统全部时间属性、创建和加载事件、日志序号、内容摘要及独立副本，并以对象 ID 比较。只读取用户态显示时间、没有创建事件或文件系统不保留独立时间时形成盲区。
        en: Defenders can collect timestamp modifier and API, all file-system time attributes, create and load events, log
          sequence, content digest, and independent replicas and compare them by object ID. Blind spots arise when only user-visible
          time is read, create events are absent, or the file system retains no independent time source.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 伪造时间让新工件呈现为旧状态
    en: Falsified time makes a new artifact appear historical
  analysis:
    paragraphs:
    - zh: 攻击者改写时间属性而保留对象与内容，痕迹从真实事件顺序变为可信外观的旧时间或统一时间；防守方若以时间作为年龄与优先级特征会误分类，形成特征伪装。
      en: The adversary rewrites time attributes while preserving object and content, changing traces from the true event order
        into plausibly old or uniform time. Defenders using time as an age and priority feature misclassify the artifact, producing
        Feature Disguise.
  evidence_refs:
  - REF-000397
  - REF-000152
  confidence: high
