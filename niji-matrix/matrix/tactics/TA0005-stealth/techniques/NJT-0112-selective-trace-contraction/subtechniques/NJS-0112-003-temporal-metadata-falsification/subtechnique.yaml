research:
  limitations:
    paragraphs:
    - zh: BlackByte 2.0 直接证明统一回写时间，但该值明显异常，不代表更精细的双时间属性伪造。跨文件系统字段与恢复方法不同；若仅有当前时间而没有独立事件顺序，只能确认异常而不能确认攻击者改写。
      en: BlackByte 2.0 directly establishes uniform timestamp rewriting, but its value is conspicuous and does not represent
        more precise dual-timestamp falsification. Fields and recovery methods differ across file systems. With only current
        time and no independent event sequence, anomaly can be established but adversary rewriting cannot.
