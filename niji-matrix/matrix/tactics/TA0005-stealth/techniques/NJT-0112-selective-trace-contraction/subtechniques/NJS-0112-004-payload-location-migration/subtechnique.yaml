research:
  limitations:
    paragraphs:
    - zh: BISTROMATH 直接证明迁移选项和目标目录，但公开分析没有证明每个配置都执行该选项，因此案例与子技术置信度为 medium。确认实际实例需要源—目标内容连续性和新位置后继消费，只有配置能力不足以定性一次攻击。
      en: BISTROMATH directly establishes the relocation option and destination directories, but public analysis does not prove
        every configuration executed it, so the case and child remain medium confidence. A real instance requires source-to-destination
        content continuity and successor consumption from the new location; configuration capability alone does not classify
        one attack.
