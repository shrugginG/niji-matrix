schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0112-004
name:
  zh: 载荷位置迁移
  en: Payload-Location Migration
summary:
  zh: 攻击者把同一恶意内容复制或移动到新路径并从新位置继续使用，以削弱最初投递与当前执行的路径关联。
  en: Adversaries copy or move the same malicious content to a new path and continue using it there to weaken linkage between
    initial delivery and current execution.
aliases: []
parent_ref: NJT-0112
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 载荷位置迁移是攻击者保留恶意内容身份，却把承载文件复制、移动或重命名到新的目录、分区或设备位置，并让后继执行或持久化切换到新地址。直接目的在于切断原始下载、告警或暂存路径与当前消费位置的直观关系，而不是仅按合法名称伪装或删除载荷。
    en: Payload-Location Migration is an evasion sub-technique in which an adversary preserves malicious content identity while
      copying, moving, or renaming the carrier into a new directory, partition, or device location and switches successor execution
      or persistence to the new address. Its immediate purpose is to break the obvious relationship between original download,
      alert, or staging path and current consumption rather than merely masquerade by name or delete the payload.
stealth_characteristics:
  paragraphs:
  - zh: 载荷位置迁移让最初高风险路径失去当前对象，后继进程从系统或排除目录加载同一内容，基于单路径的调查和封禁因此断链。复制/移动事件、内容摘要、文件 ID、写入者、旧路径删除、新路径首次消费和持久化目标仍可恢复谱系。
    en: Payload-Location Migration leaves the original high-risk path without the current object while a successor loads the
      same content from a system or excluded directory, breaking path-based investigation and blocking. Copy or move events,
      content digest, file identity, writer, old-path deletion, first consumption at the new path, and persistence target can
      recover lineage.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入同一载荷内容跨路径复制、移动或重命名并从新位置继续使用的实例。普通安装、更新、缓存、备份与合法临时文件提升是反例；仅改名以匹配合法资源但没有来源—目标连续性归伪装，只有旧文件删除归 NJS-0112-001。
    en: Scope includes the same payload content copied, moved, or renamed across paths and then consumed from the new location.
      Normal installation, update, cache, backup, and legitimate temporary-file promotion are counterexamples. Renaming only
      to match a legitimate resource without source-to-target continuity belongs to masquerading, and deletion of only the
      old file belongs to NJS-0112-001.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 初始下载器可把载荷从浏览器或临时目录迁移到 ProgramData、System、排除路径或持久化目录，删除旧副本后由服务、Run 键、任务或加载器消费新位置。
      en: An initial downloader may migrate a payload from a browser or temporary directory into ProgramData, System, an excluded
        path, or a persistence directory, delete the old copy, and have a service, Run key, task, or loader consume the new
        location.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要读写源与目标位置、保持内容和接口兼容，并更新后继消费者。目标 ACL、应用控制、内容摘要追踪和创建/移动审计会限制迁移；错误路径或依赖可能使载荷失效。
        en: The adversary needs read and write access to source and destination, preserves content and interface compatibility,
          and updates the successor consumer. Destination ACLs, application control, content-digest tracking, and create or
          move auditing constrain migration, while incorrect paths or dependencies may break the payload.
    defender_model:
      paragraphs:
      - zh: 防守方可观察下载与初始创建、复制/移动/重命名、源和目标摘要、文件 ID、旧路径删除、新路径加载和配置引用，并跨主机或卷规范化内容身份。摘要不可用、跨文件系统身份变化或中间路径日志缺失时形成盲区。
        en: Defenders can observe download and initial creation, copy, move, rename, source and destination digests, file identity,
          old-path deletion, new-path load, and configuration reference and normalize content identity across hosts or volumes.
          Blind spots arise when digests are unavailable, identity changes across file systems, or intermediate-path logging
          is missing.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 内容身份跨位置延续而路径谱系被切断
    en: Content identity persists across location while path lineage is severed
  analysis:
    paragraphs:
    - zh: 攻击者把同一载荷迁移并切换消费者，痕迹从原始投递到执行的连续路径变为源路径消失和新路径孤立出现；防守方若按路径关联就无法连接两端，形成行为透明。
      en: The adversary migrates the same payload and switches its consumer, changing traces from a continuous delivery-to-execution
        path into a vanished source path and isolated new path. Path-based correlation cannot join the endpoints, producing
        Behavioral Transparency.
  evidence_refs:
  - REF-000397
  - REF-000427
  confidence: medium
