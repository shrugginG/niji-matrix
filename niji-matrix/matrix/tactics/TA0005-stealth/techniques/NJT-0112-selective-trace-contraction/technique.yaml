research:
  limitations:
    paragraphs:
    - zh: Velvet Ant 与 BRONZE UNION 直接证明对象擦除，BRONZE UNION 直接证明关系拆除，BlackByte 2.0 直接证明时间伪造，BISTROMATH 直接证明可配置迁移能力但不是每个样本的已执行结果。前三个子技术为高置信；位置迁移为中等置信。具体残留仍取决于文件系统、服务、日志和备份实现，当前状态缺失不能单独证明攻击者清理。
      en: Velvet Ant and BRONZE UNION directly establish object erasure, BRONZE UNION directly establishes relation teardown,
        BlackByte 2.0 directly establishes temporal falsification, and BISTROMATH directly establishes configurable relocation
        capability but not executed relocation in every sample. The first three children are high confidence and payload-location
        migration is medium confidence. Exact residue still depends on file-system, service, logging, and backup implementation,
        and missing current state alone does not prove adversary cleanup.
