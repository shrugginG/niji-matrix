schema_version: 2.0.0
type: technique
id: NJT-0112
name:
  zh: 选择性痕迹收敛
  en: Selective Trace Contraction
summary:
  zh: 攻击者删除或修改最易暴露活动的工件，同时保留足够正常状态，使攻击链更难重建并让环境接近原有基线。
  en: Adversaries delete or modify artifacts most likely to expose activity while retaining enough normal state to make the
    attack chain harder to reconstruct and the environment closer to its prior baseline.
aliases:
- Indicator Removal
- T1070
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1070
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1070
definition_and_concept:
  paragraphs:
  - zh: 选择性痕迹收敛是攻击者在活动期间或之后删除、修改、重写时间或迁移与自身行为相关的工件，使防守方可用证据减少，同时保留足以维持系统正常外观的其他状态。直接目的在于缩短可重建因果链，而不是一般数据删除或系统维护。
    en: Selective Trace Contraction is adversary deletion, modification, time rewriting, or relocation of artifacts related
      to its activity during or after an operation so defenders retain less evidence while other state remains sufficient
      for a normal-looking system. Its immediate purpose is to shorten reconstructable causality rather than perform general
      data deletion or maintenance.
  - zh: 工件可以是历史记录、文件、连接、邮箱数据、持久化状态、时间元数据或恶意软件位置。目标类型和工具是实现；概念锚是攻击者动作、工件前态、选择性变化、剩余状态与后继正常外观。
    en: Artifacts may be histories, files, connections, mailbox data, persistence state, time metadata, or malware location.
      Target type and tool are implementations. The conceptual anchor is adversary action, artifact prior state, selective
      change, remaining state, and successor normal appearance.
stealth_characteristics:
  paragraphs:
  - zh: 该技术使攻击活动留下的异常密度降低，事件序列出现缺口，时间顺序或位置关系变得不可信。防守方可能把剩余状态解释为未发生攻击、自然清理或更早的合法对象，并失去跨阶段关联与归因材料。
    en: The technique lowers the density of anomalies left by adversary activity, creates gaps in event sequences, and makes
      temporal order or location relationships unreliable. Defenders may interpret the remaining state as no attack, natural
      cleanup, or an older legitimate object and lose cross-stage correlation and attribution material.
  - zh: 删除与修改动作、审计缺口、存储残留、日志前后序号、文件系统元数据、备份、复制和后继引用仍可观察。不可变集中日志、版本历史和前后态快照能够恢复差异；攻击者无法访问独立副本时效果受限。
    en: Deletion and modification actions, audit gaps, storage residue, log sequence numbers, file-system metadata, backups,
      replicas, and successor references remain observable. Immutable centralized logs, version history, and before-and-after
      snapshots can recover the difference. The effect is limited when the adversary cannot reach independent copies.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入以隐藏攻击为目的的工件删除、历史清理、连接与持久化关系移除、时间戳改写和恶意软件迁移。判定需要攻击者控制、与先前活动的关系及观察影响，不能只凭对象消失或时间变化。
    en: Scope includes artifact deletion, history clearing, connection and persistence relationship removal, timestamp rewriting,
      and malware relocation intended to conceal an attack. Classification requires adversary control, relationship to prior
      activity, and observation effect rather than object disappearance or time change alone.
  - zh: 正常保留策略、用户清理、软件卸载、备份轮换、隐私请求和合法迁移是反例。直接隐藏现存工件归工件可见性重塑，关闭日志归防御损伤，加密内容归数据遮蔽。目标对象、平台和清理工具不构成子技术。
    en: Normal retention policy, user cleanup, software uninstall, backup rotation, privacy requests, and legitimate migration
      are counterexamples. Hiding an existing artifact belongs to Artifact Visibility Reshaping, disabling logging to Defense
      Impairment, and encrypting content to Data Obscuration. Target object, platform, and cleanup tool do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可清除命令历史、删除投递文件、移除共享连接、修改文件时间、清理邮箱与持久化工件，或把恶意软件复制到新位置后删除旧副本。动作可以在单步后立即发生，也可作为撤离或降低异常度的收尾。
      en: An adversary may clear command history, delete delivered files, remove share connections, modify file time, clean
        mailbox and persistence artifacts, or copy malware to a new location and delete the old copy. Actions may occur immediately
        after one step or as closing activity for withdrawal or anomaly reduction.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要修改目标工件及其元数据或关系的权限，并知道哪些证据最可能被防守方使用。集中不可变日志、远程副本、版本历史和严格审计会阻止完全清理；过度删除还可能形成明显缺口。
        en: The adversary needs authority to modify target artifacts and their metadata or relationships and knows which evidence
          defenders are most likely to use. Central immutable logs, remote replicas, version history, and strict audit prevent
          complete cleanup. Excessive deletion may create an obvious gap.
    defender_model:
      paragraphs:
      - zh: 防守方可观察修改者、删除和重命名、日志序号、元数据前后态、远程复制、备份与后继引用，并按稳定对象和活动 ID 关联。只保留当前状态、日志与被攻陷主机同权写入或没有长期历史时形成盲区。
        en: Defenders can observe modifier, delete and rename events, log sequence numbers, metadata before and after state,
          remote replication, backup, and successor references and correlate them by stable object and activity ID. Blind
          spots arise when only current state is retained, logs are writable under the compromised host's authority, or long-term
          history is absent.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 关键工件从可重建攻击链中被选择性移除
    en: Key artifacts are selectively removed from the reconstructable attack chain
  analysis:
    paragraphs:
    - zh: 攻击者改变或删除连接前后阶段的工件，痕迹从连续链缩减为彼此孤立的事件；防守方无法跨越缺失边界关联来源、动作与结果，形成行为透明。
      en: The adversary changes or removes artifacts connecting stages, contracting traces from a continuous chain into isolated
        events. Defenders cannot cross the missing boundary to join origin, action, and outcome, producing Behavioral Transparency.
  evidence_refs:
  - REF-000397
  - REF-000152
  - REF-000423
  - REF-000426
  - REF-000427
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 剩余状态被塑造成正常清理或旧对象外观
    en: Remaining state is shaped to resemble normal cleanup or an older object
  analysis:
    paragraphs:
    - zh: 攻击者保留正常背景并改写时间或位置，使剩余工件更接近合法基线；防守方依赖当前外观时会降低优先级，形成特征伪装。
      en: The adversary preserves normal background and rewrites time or location so the remaining artifact more closely matches
        a legitimate baseline. Defenders relying on current appearance lower priority, producing Feature Disguise.
  evidence_refs:
  - REF-000397
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子技术按攻击者改变攻击图的对象类型和恢复方法划分。NJS-0112-001“证据对象擦除”删除日志、文件、邮件或暂存内容等节点，恢复依赖独立副本和删除事件；NJS-0112-002“操作关系拆除”删除共享、连接或持久化边，恢复依赖关系前态与会话；NJS-0112-003“时间元数据伪造”保留节点和边但破坏时间排序，恢复依赖多套时间属性和独立事件序列；NJS-0112-004“载荷位置迁移”保留内容身份却切换地址与消费路径，恢复依赖内容摘要和跨位置谱系。
      en: Formal children are divided by the kind of attack-graph element changed and the recovery method. NJS-0112-001 Evidence-Object
        Erasure removes nodes such as logs, files, mail, or staged content and requires independent copies and delete events.
        NJS-0112-002 Operational-Relationship Teardown removes share, connection, or persistence edges and requires prior relation
        and session state. NJS-0112-003 Temporal-Metadata Falsification preserves nodes and edges but corrupts temporal ordering
        and requires multiple timestamp sets and an independent event sequence. NJS-0112-004 Payload-Location Migration preserves
        content identity while switching address and consumption path and requires content digest and cross-location lineage.
    - zh: 文件、邮箱、连接、注册表、平台和清理工具是载体，不定义兄弟项。同一操作可同时删除对象和关系，例如外传后删除归档并断开共享，此时可并行归类两个子技术；删除旧副本只是迁移的一部分时，迁移子项还要求新位置继续消费。
      en: File, mail, connection, registry, platform, and cleanup tool are carriers and do not define siblings. One operation
        may remove both object and relation, such as deleting an archive and detaching its share after exfiltration, and may
        be classified to both children. When old-copy deletion is merely part of relocation, the migration child additionally
        requires continued consumption from the new location.
  coverage: established
  subtechnique_refs:
  - NJS-0112-001
  - NJS-0112-002
  - NJS-0112-003
  - NJS-0112-004
