research:
  limitations:
    paragraphs:
    - zh: RedCurl 直接证明 pcalua.exe 代理恶意二进制、批处理和 Python 脚本，但不代表所有实用程序或参数形式。合法兼容性和自动化可能生成相同父子关系，必须恢复输入语义和后继恶意结果。
      en: RedCurl directly establishes pcalua.exe proxying malicious binaries, batch files, and Python scripts but does not
        generalize to every utility or argument form. Legitimate compatibility and automation may generate the same parent-child
        shape, requiring recovered input semantics and a malicious successor outcome.
