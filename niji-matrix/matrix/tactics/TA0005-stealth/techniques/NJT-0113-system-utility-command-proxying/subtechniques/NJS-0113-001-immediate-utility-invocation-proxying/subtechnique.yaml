schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0113-001
name:
  zh: 即时实用程序调用代理
  en: Immediate Utility Invocation Proxying
summary:
  zh: 攻击者在一次调用中向受信实用程序提供参数、标准输入或调用文件，使其立即代理恶意命令。
  en: Adversaries provide arguments, standard input, or an invocation file to a trusted utility in one call so it immediately
    proxies a malicious command.
aliases: []
parent_ref: NJT-0113
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 即时实用程序调用代理是攻击者在启动受信系统实用程序时通过命令参数、标准输入、环境或一次性调用文件提供恶意语义，实用程序在同一进程事务内解释并启动子进程、脚本或网络动作。直接目的在于不从受限制解释器或恶意文件类型直接进入执行。
    en: Immediate Utility Invocation Proxying is an evasion sub-technique in which an adversary supplies malicious semantics
      through command arguments, standard input, environment, or a one-shot invocation file when launching a trusted system
      utility, and the utility interprets them and starts a child process, script, or network action within the same process
      transaction. Its immediate purpose is to avoid entering execution directly through a restricted interpreter or malicious
      file type.
  - zh: 稳定变量是一次调用输入与即时结果的因果。工具名、参数语法、子进程类型和调用者是实现；若命令保存在配置中并由未来事件触发，则属于 NJS-0113-002。
    en: The stable variable is causality from one invocation input to an immediate outcome. Utility name, argument syntax,
      child type, and caller are implementations. A command stored in configuration and triggered by a future event belongs
      to NJS-0113-002.
stealth_characteristics:
  paragraphs:
  - zh: 即时实用程序调用代理让进程树首先呈现签名或默认安装工具，被限制解释器可能不出现或仅作为后继，网络和文件动作归因给代理。原始调用者、完整输入、工具特定解析、子进程和网络仍在同一事务内残留，语义解析与稳定进程键会限制效果。
    en: Immediate Utility Invocation Proxying makes the process tree begin with a signed or default-installed tool while the
      restricted interpreter may not appear or appears only as a successor, and network and file actions are attributed to
      the proxy. Original caller, complete input, utility-specific parsing, child process, and network remain in the same transaction,
      so semantic parsing and stable process keys limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入一次性调用受信实用程序并由其实际产生任意命令、程序、脚本或网络结果的行为。普通工具使用、直接解释器执行、只有参数但结果失败和开发工具专用输入代理排除；持久配置触发归兄弟项。
    en: Scope includes one-shot invocation of a trusted utility that actually produces an arbitrary command, program, script,
      or network outcome. Ordinary utility use, direct interpreter execution, arguments with failed outcome, and developer-tool-specific
      input proxying are excluded. Durable configuration triggering belongs to the sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可让 pcalua、forfiles、WSL 或 ScriptRunner 解释参数并启动恶意文件、批处理、PowerShell 或代理脚本，以绕开针对 cmd、脚本扩展名或未知二进制的直接控制。
      en: An adversary may have pcalua, forfiles, WSL, or ScriptRunner interpret arguments and start a malicious file, batch,
        PowerShell, or proxy script to bypass direct controls on cmd, script extensions, or unknown binaries.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要启动受信实用程序并构造兼容输入，知道其代理能力和目标控制缺口。参数限制、应用控制、完整命令记录和工具版本差异会降低可靠性；错误输入可能只产生正常错误。
        en: The adversary needs to launch the trusted utility, construct compatible input, and understand its proxy capability
          and target control gap. Argument restrictions, application control, complete command recording, and utility-version
          differences reduce reliability, while incorrect input may yield only a normal error.
    defender_model:
      paragraphs:
      - zh: 防守方可观察调用者、实用程序进程、完整参数/标准输入/调用文件、子进程、网络和结果，并在同一进程事务关联。命令行截断、标准输入不可见或工具进程内执行不创建子进程时形成盲区。
        en: Defenders can observe caller, utility process, complete arguments, standard input or invocation file, child process,
          network, and outcome and correlate them within one process transaction. Blind spots arise when command lines truncate,
          standard input is invisible, or the utility executes in-process without a child.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 受信实用程序边界把请求者与即时命令结果分离
    en: The trusted-utility boundary separates requester from immediate command outcome
  analysis:
    paragraphs:
    - zh: 攻击者把恶意语义交给受信工具解释，痕迹从直接命令链变为请求者、代理输入和结果三部分；防守方只观察工具身份时无法恢复真实控制来源，形成行为透明。
      en: The adversary gives malicious semantics to a trusted utility for interpretation, changing traces from a direct command
        chain into requester, proxy input, and outcome. A defender observing only utility identity cannot recover the true
        control source, producing Behavioral Transparency.
  evidence_refs:
  - REF-000398
  - REF-000428
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 系统实用程序身份为一次性恶意输入提供良性外观
    en: System-utility identity gives one-shot malicious input a benign appearance
  analysis:
    paragraphs:
    - zh: 代理工具通常签名且业务常见，攻击者让命令和网络继承其进程与信誉特征；只按签名或工具名降权会把恶意结果误分类，形成特征伪装。
      en: The proxy utility is commonly signed and operationally familiar, and the adversary has commands and networking inherit
        its process and reputation features. Lowering priority by signature or utility name alone misclassifies the malicious
        outcome and produces Feature Disguise.
  evidence_refs:
  - REF-000398
  - REF-000428
  confidence: high
