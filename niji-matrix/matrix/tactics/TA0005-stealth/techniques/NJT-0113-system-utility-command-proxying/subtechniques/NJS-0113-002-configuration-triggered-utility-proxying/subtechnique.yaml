research:
  limitations:
    paragraphs:
    - zh: Elastic 文档直接证明配置/选项语义和生产检测字段，但没有给出特定在野入侵，因此子技术与机理为 medium。正式归类一次事件必须证明攻击者写入的持久配置被后续工具读取并产生恶意结果，单个 ProxyCommand 字符串不足以确认。
      en: Elastic documentation directly establishes configuration and option semantics and production detection fields but
        provides no specific in-the-wild intrusion, so the child and mechanism remain medium confidence. Classification of
        an event requires proof that adversary-written durable configuration was read by a later utility and produced a malicious
        outcome; one ProxyCommand string is insufficient.
