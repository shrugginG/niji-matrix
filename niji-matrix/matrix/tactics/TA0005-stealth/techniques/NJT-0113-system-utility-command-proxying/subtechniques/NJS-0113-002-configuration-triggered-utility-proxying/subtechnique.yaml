schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0113-002
name:
  zh: 配置触发实用程序代理
  en: Configuration-Triggered Utility Proxying
summary:
  zh: 攻击者把命令保存到受信实用程序配置中，使未来连接或生命周期事件通过该工具代理执行。
  en: Adversaries store a command in trusted-utility configuration so a future connection or lifecycle event proxies execution
    through that utility.
aliases: []
parent_ref: NJT-0113
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 配置触发实用程序代理是攻击者修改 SSH 等受信系统工具的持久配置，把 LocalCommand、ProxyCommand 或等价命令保存为状态，并让未来连接、启动或其他生命周期事件由工具读取配置后执行。直接目的在于把命令来源与执行时刻分离，并借用正常工具配置消费路径。
    en: Configuration-Triggered Utility Proxying is an evasion sub-technique in which an adversary modifies durable configuration
      of a trusted system tool such as SSH, stores a LocalCommand, ProxyCommand, or equivalent command as state, and has a future
      connection, startup, or other lifecycle event execute it after the tool reads configuration. Its immediate purpose is
      to separate command origin from execution time and borrow the normal configuration-consumption path.
  - zh: 稳定变量是持久配置版本与未来代理结果的因果。工具、选项名称、配置路径和触发事件是实现；命令只通过当前命令行 '-o' 传入并立即执行时属于 NJS-0113-001。
    en: The stable variable is causality between a durable configuration version and a future proxied outcome. Utility, option
      name, configuration path, and trigger event are implementations. A command supplied only through the current command
      line with '-o' and executed immediately belongs to NJS-0113-001.
stealth_characteristics:
  paragraphs:
  - zh: 配置触发实用程序代理让执行时只出现正常 ssh.exe 或其他工具与连接，原始写入者可能早已退出，短进程窗口无法恢复控制来源。配置写入、版本历史、读取事件、连接会话、helper 子进程和网络仍可连接；配置完整性与长生命周期谱系会限制效果。
    en: Configuration-Triggered Utility Proxying leaves only ordinary ssh.exe or another utility and a connection at execution
      time, while the original writer may have exited long before, so a short process window cannot recover the control source.
      Configuration write, version history, read event, connection session, helper child, and network remain joinable, and
      configuration integrity and long-lifecycle lineage limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入持久工具配置保存攻击者命令并由后来工具事件实际消费的行为。合法堡垒机、部署 wrapper、用户 SSH 配置和仅存在可疑配置但从未触发是反例或未决；当前调用参数立即代理归兄弟项，通用事件注册归 NJT-0090。
    en: Scope includes durable utility configuration storing an adversary command that a later tool event actually consumes.
      Legitimate bastion, deployment wrappers, user SSH configuration, and suspicious configuration never triggered are counterexamples
      or indeterminate. Immediate proxying by current invocation arguments belongs to the sibling, while generic event registration
      belongs to NJT-0090.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可修改用户或系统 ssh_config，设置 ProxyCommand 在连接前启动本地 shell/helper，或设置 PermitLocalCommand 与 LocalCommand 在连接成功后运行命令，使正常 SSH 使用成为触发器。
      en: An adversary may modify user or system ssh_config to set ProxyCommand that starts a local shell or helper before connection,
        or set PermitLocalCommand and LocalCommand to run a command after connection, turning ordinary SSH use into the trigger.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要写入有效配置作用域、理解选项优先级和触发语义，并等待目标用户或自动化运行工具。配置 ACL、集中版本、禁用 LocalCommand 和固定堡垒策略会限制成功；错误配置可能阻断正常连接并暴露。
        en: The adversary needs write access to an effective configuration scope, understands option precedence and trigger
          semantics, and waits for a target user or automation to run the tool. Configuration ACLs, centralized versions,
          disabled LocalCommand, and fixed bastion policy constrain success, while incorrect configuration may break normal
          connections and expose the change.
    defender_model:
      paragraphs:
      - zh: 防守方可观察配置写入者与版本、工具读取的有效配置、连接会话、进程谱系、命令和网络，并跨越写入到首次触发。配置路径未审计、用户 home 不受管理或工具在进程内执行 helper 时形成盲区。
        en: Defenders can observe configuration writer and version, effective configuration read by the utility, connection
          session, process lineage, command, and network and span write through first trigger. Blind spots arise when configuration
          paths are not audited, user homes are unmanaged, or the utility executes a helper in-process.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 持久配置把原始写入者与未来代理结果分离
    en: Durable configuration separates original writer from future proxied outcome
  analysis:
    paragraphs:
    - zh: 攻击者把命令语义保存为工具状态并等待正常事件消费，痕迹从直接调用链分裂为早期配置写入和后来的受信工具结果；短窗口防守方无法连接两者，形成行为透明。
      en: The adversary stores command semantics as utility state and waits for a normal event to consume it, splitting traces
        from a direct call chain into an earlier configuration write and later trusted-utility outcome. Short-window defense
        cannot join them, producing Behavioral Transparency.
  evidence_refs:
  - REF-000398
  - REF-000429
  confidence: medium
