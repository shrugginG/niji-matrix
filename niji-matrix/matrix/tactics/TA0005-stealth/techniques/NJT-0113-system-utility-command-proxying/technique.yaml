research:
  limitations:
    paragraphs:
    - zh: Huntress 在野案例直接证明 pcalua.exe 即时代理，置信度高；Elastic 生产检测文档直接证明 ProxyCommand 与 LocalCommand 的配置或选项触发语义及不同恢复字段，但不是特定入侵归因，因此第二子技术为中等置信。Windows 之外的等价工具、进程内代理和截断命令行仍需平台特定证据。
      en: Huntress in-the-wild cases directly establish immediate pcalua.exe proxying at high confidence. Elastic production
        detection documentation directly establishes ProxyCommand and LocalCommand configuration- or option-triggered semantics
        and different recovery fields but is not attribution to a specific intrusion, so the second child remains medium confidence.
        Equivalent tools outside Windows, in-process proxying, and truncated command lines still require platform-specific
        evidence.
