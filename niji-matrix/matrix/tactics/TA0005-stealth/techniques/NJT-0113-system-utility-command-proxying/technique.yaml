schema_version: 2.0.0
type: technique
id: NJT-0113
name:
  zh: 受信系统执行资产代理
  en: Trusted System Execution-Asset Proxying
summary:
  zh: 攻击者让受信系统二进制、脚本或实用程序代理恶意命令与内容，使真实请求来源与可见执行入口分离并借用签名或默认安装信任。
  en: Adversaries have trusted system binaries, scripts, or utilities proxy malicious commands and content, separating the
    real request source from the visible execution entry and borrowing signing or default-installation trust.
aliases:
- Indirect Command Execution
- T1202
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1202
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1202
definition_and_concept:
  paragraphs:
  - zh: 受信系统执行资产代理是攻击者向具有合法执行功能的系统二进制、签名脚本或实用程序提供恶意输入，使该资产替代受限制入口加载、解释或启动命令、程序或内容。直接目的在于改变可见执行入口与控制来源，并借用系统信任。
    en: Trusted System Execution-Asset Proxying is adversary provision of malicious input to a system binary, signed script,
      or utility with legitimate execution functionality so the asset loads, interprets, or starts a command, program, or
      content in place of a restricted entry. Its immediate purpose is to change visible execution entry and control origin
      and borrow system trust.
  - zh: 概念锚是攻击者请求、受信代理资产、被解释或传递的恶意语义以及后继结果。系统二进制、脚本、间接命令实用程序和具体工具是载体；只有真实代理结果形成时成立。开发或构建工具的专用输入代理仍由相邻对象负责。
    en: The conceptual anchor is adversary request, trusted proxy asset, interpreted or forwarded malicious semantics, and
      successor outcome. System binaries, scripts, indirect-command utilities, and individual tools are carriers. The technique
      applies only when a real proxied outcome occurs. Developer- or build-tool-specific input proxying remains owned by the
      adjacent object.
stealth_characteristics:
  paragraphs:
  - zh: 可见进程树和应用控制可能只看到获批实用程序，而被限制的解释器、脚本扩展或直接命令入口不出现。网络连接或子进程被归给代理工具，防守方若不解析输入和配置就难以恢复真实意图。
    en: The visible process tree and application control may show only an approved utility while the restricted interpreter,
      script extension, or direct command entry does not appear. Network connections or children are attributed to the proxy
      tool, and defenders cannot recover true intent without parsing input and configuration.
  - zh: 残余痕迹包括原始调用者、完整命令行、配置修改、文件访问、代理到子进程关系、网络和结果。稳定进程键与语义解析可以恢复因果；严格实用程序参数控制会限制效果。
    en: Residual traces include original caller, complete command line, configuration modification, file access, proxy-to-child
      relationship, network, and outcome. Stable process keys and semantic parsing can restore causality, while strict utility-argument
      controls limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者滥用系统实用程序的合法代理能力执行任意命令、程序或网络动作，并因此绕开直接解释器或文件类型控制。判定要求请求者、代理、命令语义和结果可连接。
    en: Scope includes adversary abuse of legitimate proxy capability in a system utility to execute an arbitrary command,
      program, or network action and thereby bypass direct interpreter or file-type control. Classification requires joining
      requester, proxy, command semantics, and outcome.
  - zh: 普通实用程序使用、直接命令执行、仅加载模块、用户正常 SSH 配置和受信开发工具专用代理是反例或相邻行为。工具名、参数形式和目标程序不构成子技术。
    en: Ordinary utility use, direct command execution, module loading alone, normal user SSH configuration, and trusted-developer-tool-specific
      proxying are counterexamples or adjacent behavior. Utility name, argument form, and target program do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可让 forfiles 或兼容性工具启动程序，通过 WSL 或 ScriptRunner 执行命令，或修改 SSH LocalCommand 与 ProxyCommand 配置，让受信 ssh.exe 在连接时触发本地动作。
      en: An adversary may have forfiles or a compatibility utility start a program, execute commands through WSL or ScriptRunner,
        or modify SSH LocalCommand and ProxyCommand configuration so trusted ssh.exe triggers local action when connecting.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要启动实用程序或修改其配置，并理解参数与代理语义。应用控制、参数限制、配置 ACL 和完整输入记录会降低可靠性；错误输入可能只产生合法工具错误。
        en: The adversary can start the utility or modify its configuration and understands argument and proxy semantics.
          Application control, argument restrictions, configuration ACLs, and complete input recording reduce reliability.
          Incorrect input may only produce a legitimate tool error.
    defender_model:
      paragraphs:
      - zh: 防守方能观察调用者、代理进程、命令行与配置、文件访问、子进程、网络和结果。只允许签名工具、不保存命令或无法连接远程与本地动作时形成盲区；合法管理需要工具、参数和目标组合基线。
        en: Defenders can observe caller, proxy process, command line and configuration, file access, child process, network,
          and outcome. Blind spots arise when signed tools are allowed broadly, commands are not retained, or remote and local
          actions cannot be joined. Legitimate administration requires a baseline of tool, argument, and target combinations.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 受信实用程序边界分离请求者与命令结果
    en: The trusted-utility boundary separates requester from command outcome
  analysis:
    paragraphs:
    - zh: 攻击者把命令语义交给受信实用程序，痕迹从直接解释器链变为请求者、代理和后继结果三个位置；防守方只观察代理时失去真实控制来源，形成行为透明。
      en: The adversary gives command semantics to a trusted utility, changing traces from a direct interpreter chain into
        requester, proxy, and successor outcome. A defender observing only the proxy loses the real control source, producing
        Behavioral Transparency.
  evidence_refs:
  - REF-000398
  - REF-000428
  - REF-000429
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 系统实用程序身份为间接命令提供良性外观
    en: System-utility identity gives the indirect command a benign appearance
  analysis:
    paragraphs:
    - zh: 代理工具通常签名且业务常见，攻击者让子命令和网络继承其进程与信誉特征；基于签名或工具名的规则会降权，形成特征伪装。
      en: Proxy utilities are commonly signed and operationally familiar, and the adversary has child commands and networking
        inherit their process and reputation features. Rules based on signing or utility name lower priority, producing Feature
        Disguise.
  evidence_refs:
  - REF-000398
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 建立两个 Niji 原生子技术。NJS-0113-001“即时实用程序调用代理”由同一次进程调用中的参数、标准输入或调用文件立即控制代理结果，检测使用单一进程事务恢复请求者—输入—代理—结果。NJS-0113-002“配置触发实用程序代理”把命令保存在 SSH 等持久配置中，由未来连接或生命周期事件消费，检测必须跨越配置写入与后续触发并恢复配置版本。
      en: Two Niji-native children are established. NJS-0113-001 Immediate Utility Invocation Proxying uses arguments, standard
        input, or an invocation file within one process call to control the proxied outcome immediately, so detection reconstructs
        requester-input-proxy-outcome in one process transaction. NJS-0113-002 Configuration-Triggered Utility Proxying stores
        commands in durable configuration such as SSH and has a later connection or lifecycle event consume them, requiring
        detection across configuration write and future trigger with configuration-version recovery.
    - zh: forfiles、pcalua、WSL、ScriptRunner、ssh.exe、二进制或脚本身份和目标命令都是两项变量的实现，不构成兄弟边界。开发与构建工具专用输入代理仍归 NJT-0080；系统二进制加载或协议处理但不代理任意命令的行为归各自相邻对象。
      en: Forfiles, pcalua, WSL, ScriptRunner, ssh.exe, binary or script identity, and target command are implementations of
        the two variables and do not define siblings. Developer- and build-tool-specific input proxying remains NJT-0080.
        System-binary loading or protocol handling that does not proxy an arbitrary command belongs to its adjacent object.
  coverage: established
  subtechnique_refs:
  - NJS-0113-001
  - NJS-0113-002
