research:
  limitations:
    paragraphs:
    - zh: BlackByte 案例直接证明浏览器主题 Run 值与真实载荷不一致，但报告没有直接陈述命名者主观动机，因此案例本身为 medium；大量软件也使用通用更新、服务和管理员名称，必须验证来源与后继行为。
      en: The BlackByte case directly establishes a browser-themed Run value differing from the real payload, but the report
        does not directly state the namer's subjective intent, so the case itself remains medium. Much legitimate software
        also uses generic update, service, and administrator names, requiring provenance and successor behavior.
