schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0114-001
name:
  zh: 受信资源身份拟态
  en: Trusted Resource Identity Mimicry
summary:
  zh: 攻击者让恶意资源借用合法文件、任务、服务、账户或工具的名称、位置、发布者或签名外观。
  en: Adversaries have a malicious resource borrow the name, location, publisher, or signing appearance of a legitimate file,
    task, service, account, or utility.
aliases: []
parent_ref: NJT-0114
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信资源身份拟态是攻击者让恶意文件、任务、服务、账户或重命名工具在名称、路径、发布者、签名元数据或角色标签上匹配合法参照，同时真实内容、创建者或行为不同。直接目的在于让基于资源身份的信任和允许逻辑错误继承到攻击者对象。
    en: Trusted Resource Identity Mimicry is an evasion sub-technique in which an adversary makes a malicious file, task, service,
      account, or renamed utility match a legitimate reference in name, path, publisher, signing metadata, or role label while
      real content, creator, or behavior differs. Its immediate purpose is to have resource-identity trust and allow logic
      incorrectly inherited by the adversary object.
  - zh: 稳定变量是可见资源身份与稳定对象来源之间的差异。资源种类、名称字符串、路径和签名格式是实现；用户界面显示为错误文件类型属于 NJS-0114-002。
    en: The stable variable is divergence between visible resource identity and stable object provenance. Resource class, name
      string, path, and signing format are implementations. A user interface displaying the wrong file type belongs to NJS-0114-002.
stealth_characteristics:
  paragraphs:
  - zh: 受信资源身份拟态让恶意对象落入合法浏览器、更新、系统服务、管理员账户或运维工具基线，名称和路径规则因此降权。内容摘要、签名验证结果、对象 ID、创建与重命名历史、真实发布者和后继行为仍可恢复身份；严格来源验证会限制效果。
    en: Trusted Resource Identity Mimicry places a malicious object inside baselines for legitimate browsers, updates, system
      services, administrator accounts, or operational tools, causing name and path rules to lower priority. Content digest,
      signing-validation result, object identity, create and rename history, real publisher, and successor behavior still recover
      identity, and strict provenance validation limits the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意匹配合法资源身份且真实来源或行为不同的文件、任务、服务、账户、工具与位置。合法品牌更新、兼容性重命名和获批账户是反例；仅路径迁移归 NJS-0112-004，类型显示欺骗归兄弟项。
    en: Scope includes files, tasks, services, accounts, utilities, and locations deliberately matched to a legitimate resource
      identity while real provenance or behavior differs. Legitimate branding updates, compatibility renaming, and approved
      accounts are counterexamples. Location migration alone belongs to NJS-0112-004, and type-presentation spoofing belongs
      to the sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可创建类似更新组件的 Run 值和文件名，把恶意工具改名为系统实用程序，将任务、服务或账户命名为环境中常见对象，或使用无效/滥用签名元数据借用发布者外观。
      en: An adversary may create Run values and filenames resembling update components, rename a malicious tool as a system
        utility, name tasks, services, or accounts after common environmental objects, or use invalid or abused signing metadata
        to borrow publisher appearance.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要知道目标命名和路径基线并能创建、移动或重命名对象；借用签名外观还需可控元数据或证书。对象身份、内容验证、应用控制和变更审批会提高成本，错误细节可能反而暴露。
        en: The adversary needs knowledge of target naming and path baselines and authority to create, move, or rename objects.
          Borrowing signing appearance additionally requires controllable metadata or a certificate. Object identity, content
          validation, application control, and change approval increase cost, while incorrect details may expose the object.
    defender_model:
      paragraphs:
      - zh: 防守方可观察原始与当前名称、路径、文件 ID、签名链、内容摘要、发布者、创建者、重命名与移动历史和行为结果。只维护名称白名单或不验证签名状态时形成盲区；合法软件升级需要版本与工单基线。
        en: Defenders can observe original and current name, path, file identity, signing chain, content digest, publisher,
          creator, rename and move history, and behavioral outcome. Blind spots arise with name-only allowlists or unvalidated
          signing state, while legitimate upgrades require version and work-record baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 恶意资源借用受信对象的可见身份
    en: A malicious resource borrows the visible identity of a trusted object
  analysis:
    paragraphs:
    - zh: 攻击者匹配名称、位置或发布者外观，痕迹中的资源标签与真实内容和来源分离；防守方按标签归类时把恶意对象映射到良性基线，形成特征伪装。
      en: The adversary matches name, location, or publisher appearance, separating resource labels in traces from real content
        and provenance. Label-based classification maps the malicious object into a benign baseline, producing Feature Disguise.
  evidence_refs:
  - REF-000399
  - REF-000152
  confidence: high
