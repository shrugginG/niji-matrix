research:
  limitations:
    paragraphs:
    - zh: UNC6032 直接证明双扩展、Unicode 空白和 MP4 图标共同误导用户；RLO、尾随空白和其他客户端仍需验证各自渲染。规范类型差异必须连接用户执行或策略降权，不能把所有双扩展文件视为恶意。
      en: UNC6032 directly establishes double extensions, Unicode blanks, and an MP4 icon jointly misleading users. RLO, trailing
        whitespace, and other clients still require their own rendering verification. Canonical type divergence must connect
        to user execution or policy downgrading; not every double-extension file is malicious.
