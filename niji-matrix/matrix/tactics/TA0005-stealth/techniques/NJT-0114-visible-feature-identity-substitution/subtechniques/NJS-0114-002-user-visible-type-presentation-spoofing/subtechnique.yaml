schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0114-002
name:
  zh: 用户可见类型呈现欺骗
  en: User-Visible Type Presentation Spoofing
summary:
  zh: 攻击者操纵扩展名、字符方向、空白或图标，使用户界面显示的对象类型不同于原始格式与执行类型。
  en: Adversaries manipulate extensions, character direction, whitespace, or icons so the object type displayed in a user
    interface differs from raw format and execution type.
aliases: []
parent_ref: NJT-0114
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 用户可见类型呈现欺骗是攻击者利用扩展名隐藏、双扩展、Unicode 方向或空白字符、图标和显示截断，让文件管理器、邮件客户端或网页把可执行对象呈现为文档、图像或媒体。直接目的在于影响用户与类型规则对“打开什么”的判断。
    en: User-Visible Type Presentation Spoofing is an evasion sub-technique in which an adversary abuses extension hiding,
      double extensions, Unicode direction or whitespace characters, icons, and display truncation so a file manager, mail
      client, or webpage presents an executable object as a document, image, or media file. Its immediate purpose is to alter
      user and type-rule judgment of what is being opened.
  - zh: 稳定变量是渲染类型与规范解析类型的差异。具体扩展、字符和图标是实现；名称与路径借用合法资源但类型没有差异时属于 NJS-0114-001。
    en: The stable variable is a difference between rendered type and canonically parsed type. Particular extension, character,
      and icon are implementations. Borrowing a legitimate resource name or path without type divergence belongs to NJS-0114-001.
stealth_characteristics:
  paragraphs:
  - zh: 用户可见类型呈现欺骗把真实可执行扩展推离视野或用媒体图标覆盖，使用户交互和粗粒度邮件规则把高风险对象降权。完整 Unicode 字符串、所有扩展、文件头、MIME、归档清单和执行结果仍可反证；始终显示完整扩展会限制效果。
    en: User-Visible Type Presentation Spoofing pushes the real executable extension out of view or covers it with a media icon,
      causing user interaction and coarse mail rules to lower the risk of the object. Full Unicode string, every extension,
      file header, MIME, archive inventory, and execution outcome remain counterevidence, and always displaying complete extensions
      limits the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入显示为低风险类型而规范解析为可执行、脚本或其他高风险类型且该差异用于诱导执行的对象。合法多扩展数据、开发工件、容器格式和普通图标主题是反例；多格式载荷隐藏内部内容归 NJT-0115。
    en: Scope includes objects displayed as a low-risk type but canonically parsed as executable, script, or another high-risk
      type where the difference is used to induce execution. Legitimate multi-extension data, development artifacts, container
      formats, and ordinary icon themes are counterexamples. Multi-format payloads hiding internal content belong to NJT-0115.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 恶意广告或钓鱼归档可交付带 .mp4 与 .exe 双扩展、长空白或 RLO 字符的二进制并赋予媒体图标，使目标认为自己打开视频、PDF 或图像。
      en: Malvertising or phishing archives may deliver a binary with .mp4 and .exe double extensions, long whitespace, or
        RLO characters and assign a media icon so the target believes they are opening a video, PDF, or image.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制文件名与图标并预测目标界面的渲染、扩展隐藏和截断行为。显示完整扩展、内容检查、下载信誉和用户培训会降低成功；不同语言与客户端可能改变呈现。
        en: The adversary needs control of filename and icon and predicts target-interface rendering, extension hiding, and
          truncation. Full-extension display, content inspection, download reputation, and user training reduce success, while
          language and client differences may change presentation.
    defender_model:
      paragraphs:
      - zh: 防守方可取得原始文件名字节、Unicode code point、完整扩展链、文件头、MIME、图标来源、下载容器和启动结果。只保留渲染后名称或不展开归档时形成盲区。
        en: Defenders can obtain raw filename bytes, Unicode code points, complete extension chain, file header, MIME, icon
          source, download container, and launch outcome. Blind spots arise when only the rendered name is retained or archives
          are not expanded.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 低风险显示类型替代真实执行类型
    en: A low-risk displayed type substitutes for the real execution type
  analysis:
    paragraphs:
    - zh: 攻击者操纵渲染字符串和图标，痕迹中的用户可见类型与规范文件类型分离；用户或规则按显示类型判断时误映射到良性内容，形成特征伪装。
      en: The adversary manipulates rendered strings and icons, separating user-visible type in traces from canonical file
        type. Users or rules judging the displayed type map the object to benign content, producing Feature Disguise.
  evidence_refs:
  - REF-000399
  - REF-000430
  confidence: high
