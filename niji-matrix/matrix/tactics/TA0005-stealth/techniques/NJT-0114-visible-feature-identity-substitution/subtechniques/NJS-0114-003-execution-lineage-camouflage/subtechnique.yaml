schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0114-003
name:
  zh: 执行谱系伪装
  en: Execution Lineage Camouflage
summary:
  zh: 攻击者借助 WMI 或代理 broker 让可见父进程不同于真实请求来源，使执行看似来自正常系统主体。
  en: Adversaries use WMI or a proxy broker so the visible parent differs from the real requester and execution appears to
    originate from a normal system subject.
aliases: []
parent_ref: NJT-0114
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 执行谱系伪装是攻击者通过 WMI、远程服务、调度 broker 或其他系统代理启动命令，使内核可见父体是 wmiprvse、services、任务宿主或等价正常进程，而实际控制请求来自更早的文档、脚本、远程会话或攻击工具。直接目的在于替换执行来源推断，而不是把代码嵌入目标进程。
    en: Execution Lineage Camouflage is an evasion sub-technique in which an adversary launches a command through WMI, a remote
      service, scheduler broker, or another system proxy so the kernel-visible parent is wmiprvse, services, a task host, or
      an equivalent normal process while the real control request came from an earlier document, script, remote session, or
      attack tool. Its immediate purpose is to substitute execution-origin inference rather than embed code into the target process.
stealth_characteristics:
  paragraphs:
  - zh: 执行谱系伪装使简单父子规则看到常见系统父体并丢失用户或文档来源，跨阶段关联和归因因此困难。WMI/任务/服务控制面请求、客户端身份、稳定进程 start key、命令语义和结果仍可恢复真实谱系；完整 broker 遥测会限制效果。
    en: Execution Lineage Camouflage causes simple parent-child rules to see a common system parent and lose the user or document
      origin, complicating cross-stage correlation and attribution. WMI, task, or service control-plane request, client identity,
      stable process start key, command semantics, and outcome can still recover the real lineage, and complete broker telemetry
      limits the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意借助系统 broker 改变可见父子树并由代理实际启动恶意结果的行为。普通远程管理、服务控制和任务执行是反例；跨进程写入或线程调度归 NJT-0103，进程参数覆盖归 NJS-0111-003。
    en: Scope includes deliberate adversary use of a system broker to change the visible process tree where the broker actually
      starts a malicious outcome. Ordinary remote administration, service control, and task execution are counterexamples.
      Cross-process writing or thread dispatch belongs to NJT-0103, and process-argument overwriting belongs to NJS-0111-003.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 钓鱼宏可通过 WMI 创建进程，使 Word 不再是 PowerShell 的直接父体；远程操作者也可让服务或计划任务 broker 启动工具，使进程树只呈现常见系统宿主。
      en: A phishing macro may create a process through WMI so Word is no longer the direct parent of PowerShell, or a remote
        operator may have a service or scheduled-task broker launch tooling so the process tree shows only a common system host.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问代理接口并构造可执行请求，理解目标检测依赖的父子规则。控制面审计、客户端日志和稳定活动 ID 会保留来源；错误权限或 broker 限制可能阻止执行。
        en: The adversary needs access to the proxy interface, can construct an executable request, and understands the target's
          reliance on parent-child rules. Control-plane auditing, client logs, and stable activity identities retain origin,
          while incorrect authority or broker restrictions may prevent execution.
    defender_model:
      paragraphs:
      - zh: 防守方可观察 broker 客户端、请求 ID、命令、认证会话、provider 或服务端事件、创建进程和后继结果，并跨控制面与进程面关联。只采集进程树或 broker 日志未启用时形成盲区。
        en: Defenders can observe broker client, request identity, command, authentication session, provider or service-side
          events, created process, and successor outcome and correlate control plane with process plane. Blind spots arise
          when only process trees are collected or broker logging is disabled.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 正常 broker 父体替代真实执行请求来源
    en: A normal broker parent substitutes for the real execution requester
  analysis:
    paragraphs:
    - zh: 攻击者经系统 broker 发起执行，痕迹中的直接父体变为受信进程而真实请求者留在另一控制面；基于父进程身份的分类把结果映射到正常管理活动，形成特征伪装。
      en: The adversary initiates execution through a system broker, making the direct parent in traces a trusted process while
        the real requester remains in another control plane. Parent-identity classification maps the outcome to normal administration,
        producing Feature Disguise.
  evidence_refs:
  - REF-000399
  - REF-000196
  confidence: high
