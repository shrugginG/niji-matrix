research:
  limitations:
    paragraphs:
    - zh: FIN8 直接证明 WMI 改变 Word 到 PowerShell 的可见父子关系并服务于规避，但其他 broker 的请求与进程字段不同。合法管理大量使用 WMI、服务和任务，必须恢复真实请求者和恶意命令结果。
      en: FIN8 directly establishes WMI changing the visible Word-to-PowerShell relationship for evasion, but request and process
        fields differ across other brokers. Legitimate administration widely uses WMI, services, and tasks, requiring recovery
        of the real requester and malicious command outcome.
