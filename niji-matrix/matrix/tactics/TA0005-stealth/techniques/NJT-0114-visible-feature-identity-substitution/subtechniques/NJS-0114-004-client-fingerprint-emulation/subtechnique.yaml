schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0114-004
name:
  zh: 客户端指纹仿真
  en: Client Fingerprint Emulation
summary:
  zh: 攻击者让非浏览器或自动化进程复用真实用户客户端的 User-Agent、平台或系统属性，使网络流量呈现为正常会话。
  en: Adversaries have a non-browser or automated process reuse a real user client's User-Agent, platform, or system attributes
    so network traffic appears to be a normal session.
aliases: []
parent_ref: NJT-0114
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 客户端指纹仿真是攻击者采集目标浏览器或系统的 User-Agent、语言、平台、时区、分辨率或其他客户端特征，并在恶意 HTTP 或应用请求中复现，使接收方把自动化或后门通信判断为真实用户客户端。直接目的在于替换网络来源的客户端身份推断。
    en: Client Fingerprint Emulation is an evasion sub-technique in which an adversary collects the target browser or system's
      User-Agent, language, platform, time zone, resolution, or other client features and reproduces them in malicious HTTP
      or application requests so the receiver judges automation or backdoor communication as a real user client. Its immediate
      purpose is to substitute client-identity inference for network origin.
stealth_characteristics:
  paragraphs:
  - zh: 客户端指纹仿真让后门请求匹配受害者已安装浏览器与平台基线，基于 User-Agent 或单一指纹的网络规则会降权。发起进程、GUI 会话、完整 TLS/HTTP 指纹、请求头一致性、目标与时序仍可揭示差异；多层指纹和进程关联会限制效果。
    en: Client Fingerprint Emulation makes backdoor requests match the victim's installed browser and platform baseline, causing
      network rules based on User-Agent or one fingerprint to lower priority. Originating process, GUI session, full TLS and
      HTTP fingerprint, header consistency, destination, and timing still expose differences, and multi-layer fingerprint
      and process correlation limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入非预期客户端有意复用或构造用户客户端特征以影响网络身份判断的行为。合法隐私浏览器、代理重写、兼容性 User-Agent 与测试自动化是反例；按指纹决定是否投递载荷属于 NJT-0109 条件门控。
    en: Scope includes an unexpected client deliberately reusing or constructing user-client features to influence network
      identity judgment. Legitimate privacy browsers, proxy rewriting, compatibility User-Agents, and test automation are
      counterexamples. Using a fingerprint to decide whether to deliver a payload belongs to NJT-0109 conditional gating.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 后门可让默认浏览器连接本地 socket 以读取真实 User-Agent，或从注册表识别默认浏览器后选择匹配字符串，再用于 C2 请求以贴合受害者正常浏览流量。
      en: A backdoor may have the default browser connect to a local socket to read its real User-Agent, or identify the default
        browser from Registry state and select a matching string before using it for C2 requests that resemble the victim's
        normal browsing traffic.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要读取目标客户端特征并控制请求头或协议栈，且知道防守基线使用哪些字段。浏览器升级、代理规范化、多层 TLS 指纹和真实会话状态会使静态仿真漂移或矛盾。
        en: The adversary needs to read target-client features, control request headers or protocol stack, and know which fields
          the defensive baseline uses. Browser upgrades, proxy normalization, multi-layer TLS fingerprints, and real session
          state cause static emulation to drift or conflict.
    defender_model:
      paragraphs:
      - zh: 防守方可连接网络请求到进程与用户会话，比较 User-Agent、TLS、HTTP 头、平台、目标和浏览器清单，并建立每个进程角色的客户端基线。加密代理隐藏进程映射或服务端日志不可用时形成盲区。
        en: Defenders can join network requests to process and user session, compare User-Agent, TLS, HTTP headers, platform,
          destination, and browser inventory, and baseline clients by process role. Blind spots arise when encrypted proxies
          hide process mapping or server-side logs are unavailable.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实浏览器指纹替代后门客户端身份
    en: A real browser fingerprint substitutes for the backdoor client identity
  analysis:
    paragraphs:
    - zh: 攻击者把目标浏览器或系统特征复制到恶意请求，痕迹中的客户端标签与实际发起进程分离；网络分类按指纹映射到正常浏览器，形成特征伪装。
      en: The adversary copies target browser or system features into a malicious request, separating the client label in traces
        from the actual originating process. Network classification maps the fingerprint to a normal browser, producing Feature
        Disguise.
  evidence_refs:
  - REF-000399
  - REF-000431
  confidence: high
