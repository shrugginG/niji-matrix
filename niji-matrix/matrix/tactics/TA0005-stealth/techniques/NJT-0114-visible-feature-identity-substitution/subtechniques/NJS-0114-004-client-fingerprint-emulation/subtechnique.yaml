research:
  limitations:
    paragraphs:
    - zh: FatDuke 直接证明 User-Agent 采集与仿真，但语言、时区、分辨率和完整浏览器指纹仍主要由父技术与研究语义支持。User-Agent 相同不能单独证明恶意，必须连接非浏览器进程和不一致的完整会话。
      en: FatDuke directly establishes User-Agent collection and emulation, while language, time zone, resolution, and full
        browser fingerprints remain supported mainly by parent and research semantics. A matching User-Agent alone cannot
        prove malice and must connect to a non-browser process and inconsistent full session.
