  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子技术按被替代的身份判断及验证事实源划分。NJS-0114-001“受信资源身份拟态”借用名称、位置、账户、服务或签名外观，验证依赖稳定对象身份和来源；NJS-0114-002“用户可见类型呈现欺骗”让界面中的扩展名、方向、空白或图标与原始类型不同，验证依赖规范字符串和文件头；NJS-0114-003“执行谱系伪装”改变可见父子关系，验证依赖控制面请求与稳定进程身份；NJS-0114-004“客户端指纹仿真”让非客户端进程复用浏览器或系统指纹，验证依赖网络指纹、发起进程和真实用户会话。
      en: Formal children are divided by the identity judgment being substituted and the source of truth used for verification.
        NJS-0114-001 Trusted Resource Identity Mimicry borrows a name, location, account, service, or signing appearance and
        requires stable object identity and provenance. NJS-0114-002 User-Visible Type Presentation Spoofing makes extensions,
        direction, whitespace, or icons in the interface differ from raw type and requires canonical string and file-header
        parsing. NJS-0114-003 Execution Lineage Camouflage changes visible parent-child relationships and requires control-plane
        requests and stable process identity. NJS-0114-004 Client Fingerprint Emulation has a non-client process reuse browser
        or system fingerprints and requires network fingerprint, originating process, and real user session.
    - zh: 文件、任务、服务、账户、工具和浏览器只是载体。T1036.011 的进程参数覆盖已由 NJS-0111-003“检查表示—运行状态分离”承担，因为其核心是同一对象的查询表示与启动状态差分，不在本父重复建项。
      en: Files, tasks, services, accounts, utilities, and browsers are carriers. T1036.011 process-argument overwriting is
        owned by NJS-0111-003 Inspection-Representation and Runtime-State Divergence because its core is a difference between
        queried representation and launch state of one object and is not duplicated here.
