research:
  limitations:
    paragraphs:
    - zh: BlackByte、UNC6032、FIN8 和 Operation Ghost 分别为四项变量提供直接实例，因此父行为与子技术边界为高置信。具体签名、渲染规则、进程 broker 和客户端指纹随平台变化；显示差异必须实际影响判断且与恶意结果相连，名称相似、双扩展、代理父体或 User-Agent 字符串本身均不足以定性。
      en: BlackByte, UNC6032, FIN8, and Operation Ghost provide direct instances of the four variables, so the parent behavior
        and child boundaries are high confidence. Specific signing, rendering rules, process brokers, and client fingerprints
        vary by platform. A displayed difference must affect judgment and connect to a malicious outcome; name similarity,
        a double extension, a proxy parent, or a User-Agent string alone is insufficient.
