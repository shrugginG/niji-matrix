schema_version: 2.0.0
type: technique
id: NJT-0114
name:
  zh: 可见特征身份替代
  en: Visible-Feature Identity Substitution
summary:
  zh: 攻击者操纵对象的名称、位置、类型、谱系或客户端特征，使恶意行为借用合法或良性身份外观。
  en: Adversaries manipulate an object's name, location, type, lineage, or client features so malicious behavior borrows a
    legitimate or benign identity appearance.
aliases:
- Masquerading
- T1036
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1036
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1036
definition_and_concept:
  paragraphs:
  - zh: 可见特征身份替代是攻击者修改恶意或被滥用对象向用户与安全工具呈现的名称、路径、扩展名、图标、签名外观、父子关系、账户名或客户端指纹，使观察者把它判断为另一合法身份、类型或用途。直接目的在于替换身份推断，而不是隐藏对象是否存在。
    en: Visible-Feature Identity Substitution is adversary modification of the name, path, extension, icon, signature appearance,
      parent-child relationship, account name, or client fingerprint presented by a malicious or abused object to users and
      security tools so observers judge it as another legitimate identity, type, or purpose. Its immediate purpose is to substitute
      identity inference rather than hide whether the object exists.
  - zh: 特征载体与对象类型是实现；概念锚是攻击者控制的可见特征、被借用的合法参照、真实来源或行为结果以及二者差分。名称相似本身不足以成立。
    en: Feature carrier and object type are implementations. The conceptual anchor is an adversary-controlled visible feature,
      the borrowed legitimate reference, actual provenance or behavior outcome, and the difference between them. Name similarity
      alone is insufficient.
stealth_characteristics:
  paragraphs:
  - zh: 伪装保留对象和行为，却使文件、任务、服务、账户、进程或网络请求获得熟悉外观。依赖名称、位置、显示类型、父进程或用户代理的规则可能降权，用户也可能以错误程序或文档类型处理对象。
    en: Masquerading preserves the object and behavior while giving a file, task, service, account, process, or network request
      a familiar appearance. Rules relying on name, location, displayed type, parent process, or user agent may lower priority,
      and users may handle the object as the wrong program or document type.
  - zh: 残余痕迹包括真实文件头、签名验证、对象 ID、创建者、路径历史、实际调用者、内存参数、网络行为和后继结果。可见特征与独立来源或行为基线比较可恢复身份；严格验证而非外观信任会降低效果。
    en: Residual traces include real file header, signature validation, object ID, creator, path history, actual caller, memory
      arguments, network behavior, and successor outcome. Comparing visible features with independent provenance or behavior
      baselines restores identity. Strict validation rather than appearance trust reduces the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意让对象特征匹配或近似另一合法对象、类型、关系或客户端，并使该特征影响用户或工具判断的行为。判定要求真实来源或行为与显示特征不一致。
    en: Scope includes deliberate matching or approximation of another legitimate object, type, relationship, or client by
      an adversary where the feature affects user or tool judgment. Classification requires actual provenance or behavior
      to differ from the displayed feature.
  - zh: 合法品牌、软件迁移、兼容性重命名、获批任务与服务、隐私用户代理和普通父子树差异是反例。对象从列表消失归工件可见性重塑，内容编码归数据遮蔽。载体、平台和特征字段不构成子技术。
    en: Legitimate branding, software migration, compatibility renaming, approved tasks and services, privacy user agents,
      and ordinary parent-child differences are counterexamples. Objects disappearing from a list belong to Artifact Visibility
      Reshaping, and encoded content to Data Obscuration. Carrier, platform, and feature field do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可把恶意文件放在可信路径并使用相似名称或图标，给任务、服务或账户使用常见名称，操纵显示扩展名与类型，让进程树或参数显得属于合法父体，或伪造浏览器与系统指纹混入正常网络活动。
      en: An adversary may place a malicious file in a trusted path with a similar name or icon, give a task, service, or
        account a common name, manipulate displayed extension and type, make process lineage or arguments appear to belong
        to a legitimate parent, or spoof browser and system fingerprints to blend into normal network activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能控制至少一个可见特征并了解目标基线与信任规则。强签名验证、对象身份、不可变创建记录和行为分析会降低效果；过度相似或错误格式可能反而触发检测。
        en: The adversary controls at least one visible feature and understands target baselines and trust rules. Strong signature
          validation, object identity, immutable creation records, and behavior analysis reduce the effect. Excessive similarity
          or malformed formatting may instead trigger detection.
    defender_model:
      paragraphs:
      - zh: 防守方可取得显示和原始类型、签名、哈希、对象 ID、创建与重命名历史、真实父体、内存参数、账户来源和网络行为。只使用人类可见字符串、单一路径或用户代理时形成盲区；合法命名变化需要发布者与变更记录基线。
        en: Defenders can obtain displayed and raw type, signature, hash, object ID, creation and rename history, actual parent,
          memory arguments, account provenance, and network behavior. Reliance on human-visible strings, one path, or user
          agent creates blind spots. Legitimate naming changes require publisher and change-record baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 恶意对象用合法可见特征替代真实身份
    en: A malicious object substitutes legitimate visible features for its real identity
  analysis:
    paragraphs:
    - zh: 攻击者控制名称、位置、类型或谱系等特征，痕迹中的可见身份与真实来源或行为分离；防守方基于表面特征分类时把恶意对象映射到良性基线，形成特征伪装。
      en: The adversary controls features such as name, location, type, or lineage, separating visible identity in traces
        from real provenance or behavior. Classification based on surface features maps the malicious object to a benign baseline,
        producing Feature Disguise.
