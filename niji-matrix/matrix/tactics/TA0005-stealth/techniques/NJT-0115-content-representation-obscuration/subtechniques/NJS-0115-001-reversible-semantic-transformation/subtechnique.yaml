schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0115-001
name:
  zh: 可逆语义变换
  en: Reversible Semantic Transformation
summary:
  zh: 攻击者通过编码、加密、压缩、打包或命令变换隐藏代码与数据语义，并在使用前按可记录的变换链恢复。
  en: Adversaries hide code and data semantics through encoding, encryption, compression, packing, or command transformation and restore them through a recordable transform chain before use.
aliases: []
parent_ref: NJT-0115
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 可逆语义变换是攻击者对代码、命令、配置或载荷应用编码、加密、压缩、打包或等价文本变换，使静态内容不直接表达原始语义，但目标上的解码、解密、解压、解包或规范化步骤可以恢复。直接目的在于把可解释语义推迟到恢复边界之后。
    en: Reversible Semantic Transformation is an evasion sub-technique in which an adversary applies encoding, encryption, compression, packing, or equivalent textual transformation to code, commands, configuration, or payloads so static content does not directly express original semantics but decoding, decryption, decompression, unpacking, or normalization on the target can restore it. Its immediate purpose is to defer interpretable semantics until after the recovery boundary.
  - zh: 稳定变量是可重放的表示变换链。具体算法、密钥长度、打包器和命令语言是实现；保持功能但不以逐层逆变换恢复的控制流或指令变异属于 NJS-0115-002。
    en: The stable variable is a replayable representation-transform chain. Particular algorithms, key lengths, packers, and command languages are implementations. Control-flow or instruction mutation that preserves function without layered inverse transformation belongs to NJS-0115-002.
stealth_characteristics:
  paragraphs:
  - zh: 可逆语义变换让静态扫描只看到编码字符串、密文、压缩流、打包 stub 或转义命令，原始关键字、导入和配置在恢复前缺失。变换例程、参数、输入输出摘要、解码缓冲区和后继执行仍会留痕；逐层规范化与运行时捕获可恢复语义。
    en: Reversible Semantic Transformation leaves static scanning with encoded strings, ciphertext, compressed streams, packing stubs, or escaped commands while original keywords, imports, and configuration are absent before recovery. Transform routines, parameters, input and output digests, decoded buffers, and successor execution remain observable, and layered normalization plus runtime capture can recover semantics.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意施加可逆变换并在目标或分析链中恢复真实语义的内容。合法协议编码、备份压缩、企业加密、安装包和 DRM 是反例；纯粹增加垃圾结构归 NJS-0115-002，把载荷藏入良性外层格式归 NJS-0115-003。
    en: Scope includes content deliberately subjected to a reversible transformation by an adversary and restored to real semantics on the target or in the analysis chain. Legitimate protocol encoding, backup compression, enterprise encryption, installers, and DRM are counterexamples. Merely adding junk structure belongs to NJS-0115-002, while hiding a payload in a benign outer format belongs to NJS-0115-003.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可对 PowerShell 命令做 Base64 或字符串拼接，对配置和二阶段载荷加密或压缩，并使用自解包 stub 在内存中恢复后执行。AvosLocker 案例中的编码 PowerShell 在 WMI Provider Host 下恢复并下载后续内容。
      en: An adversary may apply Base64 or string composition to PowerShell commands, encrypt or compress configuration and second-stage payloads, and use a self-unpacking stub to restore and execute them in memory. In the AvosLocker case, encoded PowerShell was recovered under WMI Provider Host and downloaded successor content.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能控制变换与恢复逻辑，并向目标提供密钥、参数或 stub。多层变换增加大小、资源和崩溃风险，密钥与恢复步骤也会成为稳定观察点；网关递归规范化和应用控制会降低收益。
        en: The adversary controls the transformation and recovery logic and supplies the target with keys, parameters, or a stub. Multiple layers increase size, resource, and crash risk, while keys and recovery steps become stable observation points. Gateway recursive normalization and application control reduce benefit.
    defender_model:
      paragraphs:
      - zh: 防守方可保留原始对象、识别变换类型、记录每层输入输出摘要并在隔离环境捕获解码缓冲区与后继进程。缺少密钥、递归资源受限、命令日志被截断或恢复受环境门控时形成盲区。
        en: Defenders can preserve the original object, identify transform types, record input and output digests for every layer, and capture decoded buffers and successor processes in isolation. Missing keys, constrained recursion resources, truncated command logs, or environmentally gated recovery create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 可逆表示替代可直接解释的代码或数据
    en: A reversible representation substitutes for directly interpretable code or data
  analysis:
    paragraphs:
    - zh: 攻击者让痕迹保存变换后表示而非原始语义，防守方必须重放逆变换才能理解内容；恢复边界之前的可读性下降，形成数据遮蔽。
      en: The adversary causes traces to retain transformed representation rather than original semantics, requiring defenders to replay inverse transformations to interpret content. Reduced readability before the recovery boundary produces Data Obscuration.
