research:
  limitations:
    paragraphs:
    - zh: AvosLocker 直接证明编码命令在运行时恢复恶意语义，但编码、加密、压缩和打包的恢复接口各异。高熵、Base64、压缩段或解码 API 单独均不足以定性，必须形成变换输入、恢复输出和恶意结果链。
      en: AvosLocker directly establishes an encoded command recovering malicious semantics at runtime, but recovery interfaces differ across encoding, encryption, compression, and packing. High entropy, Base64, compressed sections, or a decoding API alone are insufficient; a chain from transformed input through recovered output to malicious outcome is required.
