schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0115-002
name:
  zh: 静态特征空间畸变
  en: Static Feature-Space Distortion
summary:
  zh: 攻击者保持程序核心功能，同时改变控制流、指令、长度、符号或统计特征，使静态签名和结构分析失效。
  en: Adversaries preserve core program function while changing control flow, instructions, length, symbols, or statistical features so static signatures and structural analysis fail.
aliases: []
parent_ref: NJT-0115
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 静态特征空间畸变是攻击者通过控制流重构、等价指令替换、多态生成、填充、垃圾代码、符号剥离或导入保护改变二进制与脚本的静态特征分布，同时保留核心功能语义。直接目的在于让签名、反汇编、相似性和机器学习特征偏离未变换样本。
    en: Static Feature-Space Distortion is an evasion sub-technique in which an adversary changes the static feature distribution of a binary or script through control-flow restructuring, equivalent-instruction substitution, polymorphic generation, padding, junk code, symbol stripping, or import protection while preserving core functional semantics. Its immediate purpose is to make signatures, disassembly, similarity, and machine-learning features diverge from the untransformed sample.
  - zh: 稳定变量是功能等价但静态表示与特征空间显著不同。具体编译器、垃圾指令和填充方式是实现；需要逐层解码恢复明文的表示属于 NJS-0115-001，调用只在运行时生成属于 NJS-0115-004。
    en: The stable variable is functional equivalence despite materially different static representation and feature space. Particular compilers, junk instructions, and padding methods are implementations. A representation requiring layered decoding to recover plaintext belongs to NJS-0115-001, while calls generated only at runtime belong to NJS-0115-004.
stealth_characteristics:
  paragraphs:
  - zh: 静态特征空间畸变破坏基本块边界、导入表、字符串密度、文件长度和样本间相似性，使签名与自动反编译难以收敛。运行行为、规范化中间表示、功能 API 序列、去混淆后二进制和后继结果仍可恢复等价性；动态与语义比较会限制效果。
    en: Static Feature-Space Distortion disrupts basic-block boundaries, import tables, string density, file length, and cross-sample similarity, preventing signatures and automated decompilation from converging. Runtime behavior, normalized intermediate representation, functional API sequence, deobfuscated binary, and successor outcome can still recover equivalence, and dynamic and semantic comparison limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意改变静态特征或分析结构、保持核心功能且用于规避识别的程序。编译器优化、发布构建、调试符号移除、性能填充和合法软件保护是反例；单纯加密或压缩归 NJS-0115-001，真实载荷位于另一个载体归 NJS-0115-003。
    en: Scope includes programs whose static features or analysis structure are deliberately changed by an adversary while core function is preserved to evade recognition. Compiler optimization, release builds, debug-symbol removal, performance padding, and legitimate software protection are counterexamples. Encryption or compression alone belongs to NJS-0115-001, while a real payload located in another carrier belongs to NJS-0115-003.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 混淆编译器可把控制流图拆分为 dispatcher 与碎片块，按样本替换等价指令、插入不可达或低价值代码，并隐藏导入。ScatterBrain 对 POISONPLUG.SHADOW 的变换使静态框架难以恢复结构，而专用去混淆器仍能产出功能等价文件。
      en: An obfuscating compiler may split a control-flow graph into a dispatcher and fragments, substitute equivalent instructions per sample, insert unreachable or low-value code, and hide imports. ScatterBrain transformed POISONPLUG.SHADOW so static frameworks struggled to recover structure while a purpose-built deobfuscator still produced a functionally equivalent file.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能在构建链或投递前运行混淆器，并接受体积、性能、兼容性和故障风险。模式复用、编译器缺陷与稳定运行行为会形成可检测特征；语义归一和多样本聚类会降低收益。
        en: The adversary can run an obfuscator in the build chain or before delivery and accepts size, performance, compatibility, and failure risk. Reused modes, compiler defects, and stable runtime behavior create detectable features, while semantic normalization and multi-sample clustering reduce benefit.
    defender_model:
      paragraphs:
      - zh: 防守方可取得完整样本、反汇编失败模式、控制流与导入结构、运行 API 序列、内存映像和多个变体，并使用规范化中间表示或专用去混淆器。只有单一样本、资源受限或自修改代码未展开时形成盲区。
        en: Defenders can obtain complete samples, disassembly-failure patterns, control-flow and import structure, runtime API sequences, memory images, and multiple variants and use normalized intermediate representations or purpose-built deobfuscators. Blind spots arise with one sample only, constrained resources, or unexpanded self-modifying code.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 功能保持但静态识别特征被重塑
    en: Function is preserved while static recognition features are reshaped
  analysis:
    paragraphs:
    - zh: 攻击者让等价程序在结构、字节和统计空间中远离已知样本，防守分类器因表面特征变化而无法匹配真实功能，形成特征伪装。
      en: The adversary moves an equivalent program away from known samples in structural, byte, and statistical space. Defensive classifiers fail to match the real function because surface features changed, producing Feature Disguise.
