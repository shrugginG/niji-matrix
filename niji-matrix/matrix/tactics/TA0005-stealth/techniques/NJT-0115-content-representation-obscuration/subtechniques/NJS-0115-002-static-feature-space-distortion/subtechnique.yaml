research:
  limitations:
    paragraphs:
    - zh: ScatterBrain 直接证明控制流、指令和导入特征改变而功能可恢复，但功能等价判断依赖分析深度和输入覆盖。复杂代码或发布优化并非当然恶意，需连接已知混淆变换、去混淆结果或恶意运行行为。
      en: ScatterBrain directly establishes changes to control flow, instructions, and import features while function remains recoverable, but functional-equivalence judgment depends on analysis depth and input coverage. Complex code or release optimization is not inherently malicious and must connect to a known obfuscating transformation, deobfuscated result, or malicious runtime behavior.
