research:
  limitations:
    paragraphs:
    - zh: Operation Ghost 直接证明图像载体中的载荷与命令提取，但 HTML、SVG、LNK 和非文件载体具有不同解析器与容量约束。发现异常数据或载体本身不足以定性，必须恢复内层语义并连接提取程序和恶意结果。
      en: Operation Ghost directly establishes extraction of payloads and commands from image carriers, but HTML, SVG, LNK, and non-file carriers have different parsers and capacity constraints. Anomalous data or the carrier alone is insufficient; inner semantics must be recovered and connected to the extractor and malicious outcome.
