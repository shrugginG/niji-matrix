schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0115-003
name:
  zh: 载体嵌入载荷遮蔽
  en: Carrier-Embedded Payload Concealment
summary:
  zh: 攻击者把代码或数据嵌入图像、文档、HTML、SVG、快捷方式元数据或非文件存储，使外层对象保持良性外观。
  en: Adversaries embed code or data in images, documents, HTML, SVG, shortcut metadata, or non-file storage so the outer object retains a benign appearance.
aliases: []
parent_ref: NJT-0115
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 载体嵌入载荷遮蔽是攻击者把真实脚本、命令、二进制或配置放入另一外层格式、对象字段或非文件存储，并依靠专用提取、解析或走私步骤恢复。直接目的在于让扫描和分类只处理图像、文档、网页、图标或数据项的良性外层语义。
    en: Carrier-Embedded Payload Concealment is an evasion sub-technique in which an adversary places a real script, command, binary, or configuration inside another outer format, object field, or non-file storage and relies on a specialized extraction, parsing, or smuggling step for recovery. Its immediate purpose is to have scanning and classification process only the benign outer semantics of an image, document, webpage, icon, or data item.
  - zh: 稳定变量是外层载体与内层载荷之间的语义和摘要谱系。图像、HTML、SVG、LNK、文档和注册表只是实现；文件名或图标让同一对象显示为错误类型属于 NJS-0114-002，而不是本项。
    en: The stable variable is semantic and digest lineage between an outer carrier and inner payload. Image, HTML, SVG, LNK, document, and Registry are implementations. A filename or icon causing the same object to display as the wrong type belongs to NJS-0114-002 rather than this child.
stealth_characteristics:
  paragraphs:
  - zh: 载体嵌入载荷遮蔽使网关和分析人员看到合法 MIME、文件头或存储类型，而恶意语义只存在于像素位、脚本 blob、SVG 元素、图标字节、文档字段或非文件值中。提取器调用、内外摘要、偏移、解析结果、内存缓冲区和后继执行仍可恢复因果；递归提取会限制效果。
    en: Carrier-Embedded Payload Concealment causes gateways and analysts to see a legitimate MIME, file header, or storage type while malicious semantics exist only in pixel bits, script blobs, SVG elements, icon bytes, document fields, or non-file values. Extractor calls, outer and inner digests, offsets, parse results, memory buffers, and successor execution can still recover causality, and recursive extraction limits the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入外层对象保持一种可独立解释的载体类型、内层载荷需专用提取步骤且用于恶意结果的行为。合法媒体元数据、网页资源内联、文档附件、配置存储和软件缓存是反例；纯编码或压缩但无独立外层载体归 NJS-0115-001，纯地址空间隐藏归 NJT-0111。
    en: Scope includes behavior where an outer object retains an independently interpretable carrier type, an inner payload requires a specialized extraction step, and the payload serves a malicious outcome. Legitimate media metadata, inlined web resources, document attachments, configuration storage, and software caches are counterexamples. Encoding or compression without an independent outer carrier belongs to NJS-0115-001, while address-space hiding alone belongs to NJT-0111.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 后门可从图像像素或附加数据提取加密载荷，网页可用 HTML 或 SVG 组装下载对象，快捷方式可在图标或字段中携带数据，脚本也可从注册表等非文件载体读取后恢复。Operation Ghost 直接使用图像隐写传递载荷或命令。
      en: A backdoor may extract an encrypted payload from image pixels or appended data, a webpage may assemble a download object through HTML or SVG, a shortcut may carry data in an icon or field, and a script may read and restore content from a non-file carrier such as Registry. Operation Ghost directly used image steganography to transport payloads or commands.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能控制外层载体、嵌入位置和目标提取器，并接受容量、格式校验和解析兼容性限制。内容重编码、元数据清理、专用解析器和应用控制可能破坏载荷或暴露提取链。
        en: The adversary controls the outer carrier, embedding location, and target extractor and accepts capacity, format-validation, and parser-compatibility limits. Content transcoding, metadata stripping, specialized parsers, and application control may destroy the payload or expose the extraction chain.
    defender_model:
      paragraphs:
      - zh: 防守方可保留原始载体，递归解析结构与元数据，记录内外对象摘要、偏移、提取程序、内存缓冲区和后继执行。加密内层、专有格式、资源炸弹或非文件存储未采集时形成盲区。
        en: Defenders can preserve the original carrier, recursively parse structure and metadata, and record outer and inner object digests, offsets, extractor process, memory buffers, and successor execution. Encrypted inner content, proprietary formats, resource bombs, or uncollected non-file storage create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 真实载荷语义被隔离在良性外层载体内部
    en: Real payload semantics are isolated inside a benign outer carrier
  analysis:
    paragraphs:
    - zh: 攻击者让默认检查只读取外层对象语义，真实内容需另一解析路径才出现；恢复前的痕迹无法直接表达载荷，形成数据遮蔽。
      en: The adversary causes default inspection to read only outer-object semantics while real content appears through another parsing path. Traces before recovery do not directly express the payload, producing Data Obscuration.
  evidence_refs:
  - REF-000400
  - REF-000431
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 良性载体类型替代内层恶意内容的分类
    en: A benign carrier type substitutes for classification of inner malicious content
  analysis:
    paragraphs:
    - zh: 图像、文档或网页外观使规则把对象映射到良性类型，即使内部存在可执行语义，形成特征伪装。
      en: Image, document, or webpage appearance causes rules to map the object to a benign type despite executable semantics inside, producing Feature Disguise.
  evidence_refs:
  - REF-000400
  - REF-000431
  confidence: high
