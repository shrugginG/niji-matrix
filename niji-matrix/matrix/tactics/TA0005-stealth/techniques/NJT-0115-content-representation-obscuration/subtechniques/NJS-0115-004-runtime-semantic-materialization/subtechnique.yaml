schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0115-004
name:
  zh: 运行时语义物化
  en: Runtime Semantic Materialization
summary:
  zh: 攻击者让完整 API 调用、可执行代码或命令只在投递后编译、动态解析或运行生成时出现。
  en: Adversaries cause complete API calls, executable code, or commands to appear only through post-delivery compilation, dynamic resolution, or runtime generation.
aliases: []
parent_ref: NJT-0115
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 运行时语义物化是攻击者让静态对象只保存源码、哈希、模板、生成规则或不完整片段，并在目标上通过编译、动态 API 解析、反射、代码生成或等价步骤才产生完整调用与可执行语义。直接目的在于使投递物缺少可供静态检查的最终程序表示。
    en: Runtime Semantic Materialization is an evasion sub-technique in which an adversary leaves only source, hashes, templates, generation rules, or incomplete fragments in the static object and produces complete calls and executable semantics on the target through compilation, dynamic API resolution, reflection, code generation, or an equivalent step. Its immediate purpose is to keep the delivered object from containing the final program representation needed by static inspection.
  - zh: 稳定变量是最终语义由运行时生成或解析事件新建，而非通过已存在载荷的简单逆变换恢复。具体编译器、哈希算法和反射 API 是实现；解密已存在的完整载荷归 NJS-0115-001。
    en: The stable variable is that final semantics are newly created by a runtime generation or resolution event rather than restored through a simple inverse transformation of an existing payload. Particular compilers, hash algorithms, and reflection APIs are implementations. Decrypting an already complete payload belongs to NJS-0115-001.
stealth_characteristics:
  paragraphs:
  - zh: 运行时语义物化让静态导入表、调用名称和最终机器码缺失，规则只能看到哈希常量、源片段、编译参数或解析循环。生成输入、解析候选、输出摘要、可执行内存、编译器子进程和后继调用仍会留痕；内存与运行时谱系可以恢复真实语义。
    en: Runtime Semantic Materialization leaves static import tables, call names, and final machine code absent, exposing only hash constants, source fragments, compilation parameters, or resolution loops. Generation input, resolution candidates, output digest, executable memory, compiler child process, and successor calls remain observable, and memory and runtime lineage can recover real semantics.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意让最终调用或代码直到目标运行时才生成或解析并用于恶意结果的行为。合法 JIT、插件发现、反射框架、软件构建和兼容性动态链接是反例；正常 loader 依赖归 NJT-0077，运行时仅解密完整字节归 NJS-0115-001。
    en: Scope includes behavior where an adversary deliberately delays generation or resolution of final calls or code until target runtime and uses the result for a malicious outcome. Legitimate JIT, plug-in discovery, reflection frameworks, software builds, and compatibility dynamic linking are counterexamples. Normal loader dependency use belongs to NJT-0077, while runtime decryption of already complete bytes belongs to NJS-0115-001.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 脚本可在投递后调用编译器生成二进制，载荷可遍历模块导出并把 API 名称哈希与常量比较，或从模板和环境值拼装并执行代码。SplatDropper 使用固定 seed 哈希解析 Windows API 后解密驱动、创建服务并执行后续载荷。
      en: A script may invoke a compiler after delivery to create a binary, a payload may walk module exports and compare API-name hashes with constants, or code may be assembled from templates and environmental values before execution. SplatDropper used a fixed-seed hash to resolve Windows APIs before decrypting a driver, creating a service, and executing the successor payload.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能在目标上访问编译、解析或生成能力并控制输入。环境缺少工具、接口变更、受限执行和应用控制可能阻断物化；生成循环、编译器使用和新可执行内存也会暴露行为。
        en: The adversary can access compilation, resolution, or generation capability on the target and controls its input. Missing tools, interface changes, constrained execution, and application control may prevent materialization, while generation loops, compiler use, and new executable memory expose behavior.
    defender_model:
      paragraphs:
      - zh: 防守方可监控编译器与脚本宿主、模块导出遍历、哈希比较、动态解析 API、内存权限变化、生成内容摘要和后继调用。内核级自修改、遥测采样或最终代码仅短暂存在时形成盲区。
        en: Defenders can monitor compilers and script hosts, module-export traversal, hash comparisons, dynamic-resolution APIs, memory-permission changes, generated-content digests, and successor calls. Kernel-level self-modification, telemetry sampling, or final code existing only briefly creates blind spots.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 静态对象不包含运行时才生成的完整语义
    en: The static object omits complete semantics generated only at runtime
  analysis:
    paragraphs:
    - zh: 攻击者把真实调用或代码推迟到生成和解析事件，使投递痕迹只包含构造材料而非最终语义；运行前的可读性与可识别性下降，形成数据遮蔽。
      en: The adversary defers real calls or code to generation and resolution events, leaving delivery traces with construction material rather than final semantics. Reduced pre-runtime readability and recognizability produces Data Obscuration.
  evidence_refs:
  - REF-000400
  - REF-000224
  confidence: high
