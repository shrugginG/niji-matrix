research:
  limitations:
    paragraphs:
    - zh: SplatDropper 直接证明哈希 API 解析使静态导入缺少调用名称，但投递后编译和其他代码生成路径仍需各自遥测验证。动态 API、编译器或可执行内存本身均有大量合法用途，必须连接攻击者控制输入、生成结果和恶意后继行为。
      en: SplatDropper directly establishes API hashing removing call names from static imports, while compile-after-delivery and other code-generation paths still require path-specific telemetry validation. Dynamic APIs, compilers, and executable memory all have substantial legitimate use and must connect adversary-controlled input, generated result, and malicious successor behavior.
