schema_version: 2.0.0
type: technique
id: NJT-0115
name:
  zh: 内容表示遮蔽
  en: Content-Representation Obscuration
summary:
  zh: 攻击者把真实代码、命令或数据转换为防守工具难以直接解释的表示，并在恢复或运行时才产生真实内容。
  en: Adversaries transform real code, commands, or data into a representation difficult for defensive tools to interpret
    directly and produce the real content only at recovery or runtime.
aliases:
- Obfuscated Files or Information
- T1027
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1027
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1027
definition_and_concept:
  paragraphs:
  - zh: 内容表示遮蔽是攻击者通过编码、加密、压缩、打包、结构变异、填充、嵌入或运行时解析，使静态或传输中的表示不直接暴露原始代码、命令或数据语义的行为。直接目的在于降低防守工具在内容恢复前的识别与解释能力。
    en: Content-Representation Obscuration is adversary use of encoding, encryption, compression, packing, structural mutation,
      padding, embedding, or runtime resolution so static or in-transit representation does not directly expose original code,
      command, or data semantics. Its immediate purpose is to reduce defensive recognition and interpretation before content
      recovery.
  - zh: 算法、格式、载体和工具是实现；概念锚是原始内容、攻击者变换、防守可见表示、恢复步骤与真实运行结果。反混淆或解码是消费变换的后继动作，不是本技术的独立子项。
    en: Algorithm, format, carrier, and tool are implementations. The conceptual anchor is original content, adversary transformation,
      defender-visible representation, recovery step, and real runtime outcome. Deobfuscation or decoding is a successor action
      consuming the transformation rather than an independent child.
stealth_characteristics:
  paragraphs:
  - zh: 遮蔽会改变签名、字符串、结构、文件类型或传输内容，使规则在恢复前缺少稳定特征，分析人员需要额外计算或执行才能理解。多态与垃圾结构还增加样本差异和分析成本。
    en: Obscuration changes signatures, strings, structure, file type, or transmitted content so rules lack stable features
      before recovery and analysts need additional computation or execution to understand it. Polymorphism and junk structure
      also increase sample diversity and analysis cost.
  - zh: 变换例程、熵与结构异常、解码缓冲区、内存中真实代码、恢复工具和后继执行仍留痕。递归规范化、受控解包、内存与运行时检查可以恢复内容；无法获得密钥或触发条件时形成盲区。
    en: Transformation routines, entropy and structural anomalies, decoded buffers, real code in memory, recovery tools, and
      successor execution remain observable. Recursive normalization, controlled unpacking, and memory and runtime inspection
      can recover content. Missing keys or trigger conditions create blind spots.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意改变表示以阻碍发现或分析，并且真实内容可在后续恢复、解析或执行的行为。判定需要变换与真实结果关系，不能只凭高熵、压缩或编码文本。
    en: Scope includes deliberate adversary transformation of representation to impede discovery or analysis where real content
      can later be recovered, parsed, or executed. Classification requires a relationship between transformation and real
      outcome rather than high entropy, compression, or encoded text alone.
  - zh: 合法压缩、加密、协议编码、数字版权管理、最小化构建和隐私保护是反例。内容从默认地址空间隐藏归工件可见性重塑，解码动作本身排除。算法、格式、平台和载体不构成子技术。
    en: Legitimate compression, encryption, protocol encoding, digital-rights management, optimized builds, and privacy protection
      are counterexamples. Content hidden from a default address space belongs to Artifact Visibility Reshaping, and the decoding
      action itself is excluded. Algorithm, format, platform, and carrier do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可编码脚本与命令、打包可执行文件、加密配置与载荷、插入垃圾代码、在 HTML 或 SVG 等载体内嵌入内容，或在运行时动态解析 API 和解密内存代码。
      en: An adversary may encode scripts and commands, pack executables, encrypt configuration and payloads, insert junk
        code, embed content in carriers such as HTML or SVG, or resolve APIs dynamically and decrypt in-memory code at runtime.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者能选择变换并在目标上提供恢复逻辑、密钥或运行环境。复杂变换增加大小、资源、崩溃和兼容性风险；防守规范化与动态分析会降低收益。
        en: The adversary can select a transformation and provide recovery logic, key, or runtime environment on the target.
          Complex transformations increase size, resource, crash, and compatibility risk, while defensive normalization and
          dynamic analysis reduce benefit.
    defender_model:
      paragraphs:
      - zh: 防守方可观察文件与传输内容、格式、熵、结构、解码 API、内存写入、动态解析和后继执行，并执行递归解包。只依赖静态签名、资源受限或无法触发恢复时形成盲区；合法加密需要来源与用途基线。
        en: Defenders can observe file and transport content, format, entropy, structure, decoding APIs, memory writes, dynamic
          resolution, and successor execution and can perform recursive unpacking. Static signatures alone, resource limits,
          or inability to trigger recovery create blind spots. Legitimate encryption requires provenance and purpose baselines.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 防守可见表示不直接揭示真实内容语义
    en: Defender-visible representation does not directly reveal real content semantics
  analysis:
    paragraphs:
    - zh: 攻击者对真实内容应用可逆或运行时变换，痕迹从可解释代码与数据变为编码、加密或变异表示；防守方在恢复边界前无法读取语义，形成数据遮蔽。
      en: The adversary applies a reversible or runtime transformation to real content, changing traces from interpretable
        code and data into encoded, encrypted, or mutated representation. Defenders cannot read semantics before the recovery
        boundary, producing Data Obscuration.
  evidence_refs:
  - REF-000400
  - REF-000274
  - REF-000432
  - REF-000431
  - REF-000224
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 载体与结构让恶意内容呈现为不同或良性类型
    en: Carrier and structure make malicious content appear as another or benign type
  analysis:
    paragraphs:
    - zh: 嵌入、走私和格式操纵让真实内容借用文档、图像或正常数据结构外观；基于表面类型的规则会误分类，形成特征伪装。
      en: Embedding, smuggling, and format manipulation let real content borrow the appearance of a document, image, or normal
        data structure. Rules based on surface type misclassify it, producing Feature Disguise.
  evidence_refs:
  - REF-000400
  - REF-000431
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子技术按真实语义缺失于可见表示的方式及其恢复路径划分。NJS-0115-001“可逆语义变换”需要逐层解码、解密、解压、解包或命令规范化；NJS-0115-002“静态特征空间畸变”保持功能而改变控制流、指令、长度、符号或统计特征，需要语义归一与功能相似性；NJS-0115-003“载体嵌入载荷遮蔽”把内容置入良性外层格式或非文件载体，需要专用提取器与内外摘要谱系；NJS-0115-004“运行时语义物化”让完整调用或代码只在编译、解析或生成时出现，需要连接生成输入、内存结果和执行。
      en: Formal children are divided by how real semantics are absent from the visible representation and by the recovery path. NJS-0115-001 Reversible Semantic Transformation requires layered decoding, decryption, decompression, unpacking, or command normalization. NJS-0115-002 Static Feature-Space Distortion preserves function while changing control flow, instructions, length, symbols, or statistical features and requires semantic normalization and functional similarity. NJS-0115-003 Carrier-Embedded Payload Concealment places content in a benign outer format or non-file carrier and requires a specialized extractor plus outer-to-inner digest lineage. NJS-0115-004 Runtime Semantic Materialization makes complete calls or code appear only during compilation, resolution, or generation and requires joining generation input, memory result, and execution.
    - zh: 编码算法、加密算法、打包器、文件格式和平台只是实现，不再按 ATT&CK 每种实现一对一建项。纯粹把对象移出默认地址空间归 NJT-0111；恢复、解码或编译动作只有在攻击者用其制造“静态表示缺失真实语义”的结果时才归本技术。
      en: Encoding algorithm, encryption algorithm, packer, file format, and platform are implementations and do not receive one-to-one children for each ATT&CK implementation. Merely moving an object outside a default address space belongs to NJT-0111. Recovery, decoding, or compilation belongs here only when the adversary uses it to create a static representation that lacks the real semantics.
  coverage: established
  subtechnique_refs:
  - NJS-0115-001
  - NJS-0115-002
  - NJS-0115-003
  - NJS-0115-004
