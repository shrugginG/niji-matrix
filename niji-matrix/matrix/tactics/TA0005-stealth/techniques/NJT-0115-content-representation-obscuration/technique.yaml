research:
  limitations:
    paragraphs:
    - zh: AvosLocker、ScatterBrain、Operation Ghost 与 SplatDropper 分别为四种恢复路径提供直接案例，因此父行为与四分法为高置信。具体密钥、格式、提取器、语义相似度和运行触发随样本变化；高熵、代码复杂、存在载体或动态 API 本身均不足以定性，必须恢复真实语义并连接恶意结果。
      en: AvosLocker, ScatterBrain, Operation Ghost, and SplatDropper provide direct instances of the four recovery paths, so the parent behavior and four-way taxonomy are high confidence. Keys, formats, extractors, semantic similarity, and runtime triggers vary by sample. High entropy, code complexity, the presence of a carrier, or dynamic APIs alone are insufficient; classification requires recovery of real semantics and connection to a malicious outcome.
