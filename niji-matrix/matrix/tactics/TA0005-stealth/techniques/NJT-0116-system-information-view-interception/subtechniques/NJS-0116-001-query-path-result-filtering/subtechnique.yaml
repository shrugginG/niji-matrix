research:
  limitations:
    paragraphs:
    - zh: XorDdos 直接证明 PID 与端口过滤以及控制设备，但不同操作系统、对象类型和工具可能使用不共享的查询路径。一个对象只在单次快照中缺失可能是竞态、权限或缓存，不足以证明根套件；高置信度需要重复差分、路径完整性变化和持续后继行为。
      en: XorDdos directly establishes PID and port filtering plus a control device, but operating systems, object classes, and tools may use query paths that are not shared. An object missing from one snapshot can result from race, authority, or cache and does not establish a rootkit. High confidence requires repeated differentials, query-path integrity change, and persistent successor behavior.
