research:
  limitations:
    paragraphs:
    - zh: RootkitRevealer 直接展示 API 与原始 hive 的缺失、长度和类型差分，并记录进程可从活动链隐藏；公开材料并不对所有操作系统提供稳定对象结构或现场归因案例。该边界为高置信，但具体不变量与内存字段必须按平台版本验证，不能把一次链表异常自动定性为恶意。
      en: RootkitRevealer directly demonstrates missing-entry, length, and type differentials between APIs and raw hives and documents processes being hidden from active lists. Public material does not provide stable object structures or attributed field cases for every operating system. The boundary is high confidence, but concrete invariants and memory fields require platform-version validation, and one list anomaly cannot be classified as malicious automatically.
