research:
  limitations:
    paragraphs:
    - zh: XorDdos 直接证明查询路径过滤，RootkitRevealer 与根套件研究直接证明 API/raw 差分、类型或长度错报及查询背衬状态脱钩，因此父行为与二分边界为高置信。不同平台的对象 ID、内核结构与最低可信层并不一致；一次快照差分也可能由正常并发创建删除产生，必须使用稳定对象、重复采样、完整性变化和后继行为共同定性。
      en: XorDdos directly establishes query-path filtering, while RootkitRevealer and rootkit research directly establish API-to-raw differentials, type or length misreporting, and detachment of query-backing state, giving high confidence to the parent behavior and two-way boundary. Object identities, kernel structures, and lowest trusted layers differ by platform. A one-snapshot differential can also arise from normal concurrent creation or deletion, so classification requires stable objects, repeated sampling, integrity changes, and successor behavior together.
