research:
  limitations:
    paragraphs:
    - zh: AVADDON 直接证明主机内目录和扩展名保留，但公开分析对每个排除项的主观目的并不都作说明。父技术和案例把关键对象保留与运行/恢复连接到足够高置信；映射单个谓词时仍需证明它服务于连续性或匿迹，而不是开发残留、权限失败或普通性能范围。
      en: AVADDON directly establishes in-host directory and extension preservation, but public analysis does not state the subjective purpose of every exclusion. The parent source and case connect critical-object preservation to operation or recovery with high confidence. Mapping one predicate still requires proof that it serves continuity or stealth rather than development residue, authority failure, or ordinary performance scope.
