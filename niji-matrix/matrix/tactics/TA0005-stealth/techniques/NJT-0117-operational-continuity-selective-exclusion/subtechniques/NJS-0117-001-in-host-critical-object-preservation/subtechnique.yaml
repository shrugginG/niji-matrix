schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0117-001
name:
  zh: 主机内关键对象保留
  en: In-Host Critical-Object Preservation
summary:
  zh: 攻击者在一台主机的破坏或篡改流程中跳过维持启动、应用、网络或通知所需的对象，同时继续处理其他目标。
  en: Adversaries skip objects needed for boot, applications, networking, or notification inside one host's destructive or tampering workflow while continuing to process other targets.
aliases: []
parent_ref: NJT-0117
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 主机内关键对象保留是攻击者在单一资产上枚举可加密、擦除或篡改的文件、目录、服务和配置后，通过路径、扩展名、名称、组件语义或等价谓词保留其中一部分，使操作系统、业务组件、勒索通知或解密流程仍能工作。直接目的在于让恶意影响继续并完成，而不会因过早破坏关键对象导致崩溃、失败或强告警。
    en: In-Host Critical-Object Preservation is an evasion sub-technique in which an adversary enumerates files, directories, services, and configuration eligible for encryption, wiping, or tampering on one asset and preserves a subset through path, extension, name, component semantics, or an equivalent predicate so the operating system, business component, ransom notification, or decryptor workflow remains functional. Its immediate purpose is to let malicious impact continue and complete without an early crash, failure, or strong alert caused by destroying critical objects too soon.
  - zh: 稳定变量是同一资产和同一枚举域中的处理集合与关键保留集合差分。具体文件类型、正则和产品是实现；若谓词按主机角色让整台资产退出恶意流程，则属于 NJS-0117-002。
    en: The stable variable is the differential between processed and critical preserved sets within the same asset and enumeration domain. Particular file types, regular expressions, and products are implementations. If the predicate removes an entire asset from the malicious workflow according to host role, the behavior belongs to NJS-0117-002.
stealth_characteristics:
  paragraphs:
  - zh: 主机内关键对象保留让系统仍能启动、显示勒索通知、维持网络或运行关键服务，用户和监控不会在破坏开始时立即看到全面故障。破坏痕迹因此可能呈现为部分文件异常或应用局部失效，而恶意进程继续枚举和处理高价值数据；简单的“主机仍在线”健康信号会低估事件范围。
    en: In-Host Critical-Object Preservation leaves the system able to boot, display a ransom notice, maintain networking, or run critical services, so users and monitoring do not immediately observe total failure when destruction begins. Damage can appear as partial file anomalies or localized application failure while the malicious process continues enumerating and processing high-value data. Simple host-is-online health signals therefore understate incident scope.
  - zh: 枚举顺序、嵌入配置或正则、比较分支、未处理对象、处理覆盖率、关键组件可用性和最终加密或擦除结果仍可观察。恢复谓词并比较同类对象覆盖，可以揭示保留不是权限错误或随机失败；应用控制、批量修改阻断和独立恢复状态会限制效果。
    en: Enumeration order, embedded configuration or regular expressions, comparison branches, unprocessed objects, processing coverage, critical-component availability, and final encryption or wipe outcomes remain observable. Recovering the predicate and comparing coverage among peer objects reveals that preservation is not an authority error or random failure. Application control, bulk-modification blocking, and independent recovery state constrain the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入已激活恶意流程在一台主机内部有意跳过本可处理的关键对象、继续处理其他对象，并以系统连续性或恶意工作流完成为结果的行为。判定需要载荷或进程身份、枚举域、攻击者谓词、处理与保留集合以及后继影响，不以一个未修改文件单独成立。
    en: Scope includes an activated malicious workflow deliberately skipping critical objects it could process within one host, continuing to process other objects, and producing system continuity or malicious-workflow completion. Classification requires payload or process identity, enumeration domain, adversary predicate, processed and preserved sets, and successor impact; one unchanged file is insufficient.
  - zh: 合法备份、杀毒与部署排除，安全保留清单，访问失败，已打开文件，性能范围和恢复测试是反例。按域控制器等角色跳过整台主机归兄弟项；按语言、地理或环境决定载荷是否整体启动归 NJT-0109；停止安全服务归防御削弱而非本项。
    en: Legitimate backup, antivirus, and deployment exclusions, safety preservation lists, access failures, open files, performance scope, and recovery tests are counterexamples. Skipping a whole host according to a role such as domain controller belongs to the sibling. Deciding whether a payload activates at all by language, geography, or environment belongs to NJT-0109. Stopping security services belongs to Defense Impairment rather than this child.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 勒索软件可跳过 Windows、Program Files、Exchange、SQL Server、启动目录以及 DLL、SYS、EXE 等文件，使主机和解密器保持可用，同时加密文档、数据库与备份。AVADDON 直接展示固定目录、关键字和扩展名排除，并把部分扩展保留与受害者恢复能力连接起来。
      en: Ransomware may skip Windows, Program Files, Exchange, SQL Server, boot directories, and file types such as DLL, SYS, and EXE so the host and decryptor remain usable while documents, databases, and backups are encrypted. AVADDON directly demonstrates fixed directory, keyword, and extension exclusions and connects preservation of some extensions to victim recovery capability.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要枚举可处理对象，理解操作系统和目标应用依赖，构造兼容不同版本与语言的谓词，并在影响最大化与连续性之间权衡。过宽排除降低勒索或破坏价值，过窄排除导致主机崩溃、通知失败或载荷中断；路径变化、挂载点和专用应用会降低规则可靠性。
        en: The adversary needs to enumerate processable objects, understand operating-system and target-application dependencies, construct predicates compatible with versions and locales, and balance impact against continuity. Overbroad exclusion reduces extortion or destructive value, while narrow exclusion causes host crash, notification failure, or payload interruption. Path changes, mount points, and specialized applications reduce rule reliability.
    defender_model:
      paragraphs:
      - zh: 防守方可采集进程和样本、文件/目录枚举、配置与字符串、比较分支、文件操作结果、对象关键性、主机健康和最终影响，并按同一资产计算覆盖率。只记录成功修改、缺少未处理目标或样本配置加密时难以恢复谓词；正常企业工具需要签名、owner、范围与变更窗口基线。
        en: Defenders can collect process and sample identity, file or directory enumeration, configuration and strings, comparison branches, file-operation results, object criticality, host health, and final impact and calculate coverage on the same asset. Predicate recovery is difficult when only successful modifications are recorded, unprocessed targets are missing, or sample configuration is encrypted. Legitimate enterprise tools require signing, owner, scope, and change-window baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 保留关键对象使破坏主机继续呈现可运行外观
    en: Preserved critical objects keep a damaged host presenting an operational appearance
  analysis:
    paragraphs:
    - zh: 攻击者在同一处理链中保留会导致立即崩溃、通知缺失或强告警的对象，痕迹因而同时包含大范围恶意修改和仍然正常的关键组件。防守方若依赖主机在线、服务存活或界面可用等表面特征，可能把破坏视为局部故障，形成特征伪装；对象级覆盖差分与恶意结果可恢复真实范围。
      en: The adversary preserves objects whose destruction would cause immediate crash, missing notification, or a strong alert within the same processing chain, leaving traces that combine broad malicious modification with still-normal critical components. Defenders relying on host-online, service-alive, or interface-available surface features can interpret destruction as a localized fault, producing Feature Disguise. Object-level coverage differentials and malicious outcomes recover the real scope.
