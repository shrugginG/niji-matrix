schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0117-002
name:
  zh: 角色条件整机保留
  en: Role-Conditioned Host Preservation
summary:
  zh: 攻击者按域控制器或其他关键资产角色让整台主机退出破坏流程，使集中身份、分发或恢复功能在其他资产受影响时继续存在。
  en: Adversaries remove a whole host from a destructive workflow according to a domain-controller or other critical asset role so centralized identity, distribution, or recovery functions remain while peer assets are affected.
aliases: []
parent_ref: NJT-0117
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 角色条件整机保留是攻击者在已向一组资产部署加密、擦除或篡改流程后，查询 hostname、域角色、服务角色或等价资产属性，并让满足保留条件的整台主机终止或跳过恶意处理。直接目的在于保留集中身份、策略分发、管理、通知或恢复所需角色，使攻击者仍能控制或完成其他资产上的恶意目标。
    en: Role-Conditioned Host Preservation is an evasion sub-technique in which an adversary, after deploying an encryption, wipe, or tampering workflow to a set of assets, queries hostname, domain role, service role, or an equivalent asset attribute and terminates or skips malicious processing for the whole host when a preservation condition matches. Its immediate purpose is to preserve a role needed for centralized identity, policy distribution, management, notification, or recovery so the adversary can still control or complete malicious objectives on other assets.
  - zh: 稳定变量是同一部署或同一破坏活动中“主机角色决定整机是否被处理”的跨资产差分。具体域控制器、数据库、HMI 或备份服务器是角色实例；仅跳过主机内部某些文件或目录属于 NJS-0117-001。
    en: The stable variable is a cross-asset differential within one deployment or destructive operation where host role decides whether the whole host is processed. Domain controllers, databases, HMIs, and backup servers are role instances. Skipping only selected files or directories within a host belongs to NJS-0117-001.
stealth_characteristics:
  paragraphs:
  - zh: 角色条件整机保留使高价值或集中基础设施在同批其他主机遭破坏时保持在线，企业可能继续认证、分发策略或接收通知，因而不立即呈现全域故障。攻击者还可继续利用被保留角色下发任务或保持控制；单主机检测只看到载荷启动后快速退出，可能把它解释为失败或不兼容。
    en: Role-Conditioned Host Preservation leaves high-value or centralized infrastructure online while peer hosts in the same operation are damaged, allowing the enterprise to continue authenticating, distributing policy, or receiving notification instead of immediately presenting a domain-wide failure. The adversary can also continue using the preserved role to dispatch tasks or retain control. A single-host detector sees only a payload launch followed by rapid exit and may interpret it as failure or incompatibility.
  - zh: 部署任务、载荷摘要、角色查询、退出分支、域资产清单、同批主机的启动结果和破坏覆盖仍能形成证据。跨资产比较可揭示相同载荷只在特定角色上退出；阻止集中扇出、保护角色清单并隔离破坏载荷会限制效果。
    en: Deployment tasks, payload digest, role queries, exit branches, domain asset inventory, launch outcomes, and destructive coverage across peer hosts remain evidentiary. Cross-asset comparison reveals the same payload exiting only on selected roles. Preventing centralized fan-out, protecting role inventory, and isolating destructive payloads constrain the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入相同恶意载荷或工作流覆盖多个资产、攻击者控制的角色谓词决定整台主机不进入处理链、其他同批资产确实受到恶意影响的行为。判定需要部署范围、角色事实、启动或退出结果和跨资产后继影响，不能从一台未受影响主机推断。
    en: Scope includes the same malicious payload or workflow covering multiple assets, an adversary-controlled role predicate keeping a whole host out of the processing chain, and actual malicious impact on other peer assets. Classification requires deployment scope, role facts, launch or exit outcome, and cross-asset successor impact and cannot be inferred from one unaffected host.
  - zh: 分阶段发布、维护窗口、兼容性失败、离线资产、网络不可达、分组策略范围和合法高价值资产保护是反例。按语言、地理或沙箱特征决定载荷是否在目标环境启动归 NJT-0109；主机内部对象排除归兄弟项；攻击者主动停止安全工具归防御削弱。
    en: Staged rollout, maintenance windows, compatibility failure, offline assets, network unreachability, Group Policy scope, and legitimate high-value-asset protection are counterexamples. Deciding whether a payload activates in a target environment according to language, geography, or sandbox features belongs to NJT-0109. In-host object exclusion belongs to the sibling, and adversary disabling of security tools belongs to Defense Impairment.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可从域控制器或部署服务器向大量主机推送 wiper，但在载荷中查询 DomainRole 或 hostname，并在域控制器、策略源或管理节点上提前退出，以保留继续分发与认证能力。LazyWiper 在域控制器上触发 safeguard 终止，而同一事件使用域控制器经 GPO 向其他主机分发脚本，直接证明这种角色差分。
      en: An adversary may push a wiper from a domain controller or deployment server to many hosts but query DomainRole or hostname in the payload and exit early on domain controllers, policy sources, or management nodes to preserve distribution and authentication. LazyWiper triggered a safeguard and terminated on a domain controller while the same incident used a domain controller to distribute the script to other hosts through GPO, directly establishing the role differential.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要掌握资产角色和相互依赖，能可靠查询角色并确保部署覆盖足以让其他主机继续受影响。角色误判会保留过多资产或破坏集中控制，动态故障转移和多域架构也会改变关键性；在所有保留主机上出现相同查询与退出序列会暴露选择逻辑。
        en: The adversary needs knowledge of asset roles and dependencies, reliable role queries, and deployment coverage sufficient to affect peer hosts. Role misclassification preserves too many assets or destroys centralized control, while dynamic failover and multi-domain architecture change criticality. Repeated query-and-exit sequences on every preserved host expose the selection logic.
    defender_model:
      paragraphs:
      - zh: 防守方可把 GPO、软件部署、远程执行或共享路径记录连接到资产清单、域角色、同一载荷启动、退出码、文件操作和可用性结果。若只有单机 EDR、CMDB 角色陈旧或失败主机没有执行记录，跨资产差分会丢失；合法分组部署需 owner、范围和时间基线。
        en: Defenders can join GPO, software-deployment, remote-execution, or shared-path records to asset inventory, domain role, same-payload launches, exit codes, file operations, and availability outcomes. The cross-asset differential is lost with endpoint-only EDR, stale CMDB roles, or missing execution records on failed hosts. Legitimate grouped deployment requires owner, scope, and timing baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 关键角色主机保持正常使跨资产破坏看似不完整或局部
    en: Critical-role hosts remain normal so cross-asset destruction appears incomplete or localized
  analysis:
    paragraphs:
    - zh: 攻击者让角色关键资产在同批破坏中整体退出处理链，组织仍能看到正常的身份、管理或分发服务，而其他主机逐步受损。局部健康与角色服务存活掩盖了攻击者控制的覆盖差分，形成特征伪装；部署范围、同一载荷和角色条件的跨资产关联可恢复真实选择。
      en: The adversary removes role-critical assets from the processing chain during the same destructive wave, leaving normal identity, management, or distribution services visible while other hosts are progressively damaged. Local health and surviving role services conceal the adversary-controlled coverage differential, producing Feature Disguise. Cross-asset correlation of deployment scope, identical payload, and role condition recovers the real selection.
