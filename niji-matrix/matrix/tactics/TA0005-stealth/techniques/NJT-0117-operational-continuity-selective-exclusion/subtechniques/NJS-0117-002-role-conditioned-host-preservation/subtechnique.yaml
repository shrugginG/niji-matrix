research:
  limitations:
    paragraphs:
    - zh: LazyWiper 提供域控制器角色条件退出的直接案例，但公开证据尚不足以把数据库、HMI、备份或其他角色全部视为常见攻击变量。正式边界以“角色决定整机结果”为准，具体角色只在有部署范围和同批差分证据时映射；单纯未感染或执行失败不属于本项。
      en: LazyWiper provides a direct case of role-conditioned exit on domain controllers, but public evidence is insufficient to treat database, HMI, backup, or every other role as a common attacker variable. The formal boundary is role deciding the whole-host outcome. A particular role maps only with deployment scope and peer-differential evidence; simple noninfection or execution failure does not qualify.
