schema_version: 2.0.0
type: technique
id: NJT-0117
name:
  zh: 运行连续性选择性排除
  en: Operational-Continuity Selective Exclusion
summary:
  zh: 攻击者有意跳过关键目标，使恶意破坏或篡改期间系统保持足够可用并减少立即告警。
  en: Adversaries deliberately skip critical targets so a system remains sufficiently usable during malicious destruction
    or tampering and immediate alerting is reduced.
aliases:
- Selective Exclusion
- T1679
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1679
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1679
definition_and_concept:
  paragraphs:
  - zh: 运行连续性选择性排除是攻击者在枚举潜在破坏或篡改目标后，用名称、路径、扩展名、组件或主机角色谓词有意跳过一部分目标，以避免系统立即失稳、暴露或阻断恶意目标。直接目的不是普通范围限定，而是在继续恶意影响的同时保留足够运行连续性。
    en: Operational-Continuity Selective Exclusion is adversary enumeration of potential destruction or tampering targets
      followed by deliberate skipping of some targets through name, path, extension, component, or host-role predicates to
      avoid immediate instability, exposure, or interruption of malicious goals. Its immediate purpose is not ordinary scoping
      but preservation of sufficient operational continuity while malicious impact continues.
  - zh: 选择字段和目标类型是实现；概念锚是枚举、攻击者排除谓词、跳过决策、被处理与保留目标差分以及整体恶意结果。
    en: Selection field and target type are implementations. The conceptual anchor is enumeration, adversary exclusion predicate,
      skip decision, differential between processed and preserved targets, and overall malicious outcome.
stealth_characteristics:
  paragraphs:
  - zh: 排除关键系统文件、服务目录或特定主机可以维持启动、界面、网络和勒索通知，避免用户或工具在恶意过程早期因崩溃或不可用发现异常。剩余正常组件使破坏显得更局部或延迟显现。
    en: Excluding critical system files, service directories, or selected hosts can preserve boot, interface, networking,
      and ransom notification and avoid early discovery through crash or unavailability. Remaining normal components make
      destruction appear more localized or emerge later.
  - zh: 文件与组件枚举、排除列表或正则、跳过分支、被处理和未处理目标集合、系统可用性以及最终破坏范围仍留痕。对同类目标覆盖差分和二进制配置分析可恢复谓词。
    en: File and component enumeration, exclusion lists or regular expressions, skip branches, processed and unprocessed target
      sets, system availability, and final impact scope remain observable. Coverage differential among peer targets and binary-configuration
      analysis can recover the predicate.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入恶意载荷为降低发现、保持运行或确保恶意流程完成而有意不处理某些本可处理目标的行为。判定要求攻击者谓词、跳过结果和恶意整体操作相连。
    en: Scope includes a malicious payload deliberately not processing targets it could otherwise process in order to reduce
      discovery, preserve operation, or ensure malicious workflow completion. Classification requires a join among adversary
      predicate, skipped result, and overall malicious operation.
  - zh: 正常备份与杀毒排除、应用范围配置、安全保留列表、性能优化和无法访问目标是反例。执行护栏决定是否整体激活，选择性排除决定已激活恶意流程内部哪些目标被保留。目标类型、扩展名和产品不构成子技术。
    en: Normal backup and antivirus exclusions, application scope configuration, safety allowlists, performance optimization,
      and inaccessible targets are counterexamples. Execution guardrails decide whether the whole behavior activates, while
      selective exclusion decides which targets an active malicious workflow preserves. Target type, extension, and product
      do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 勒索软件可跳过 DLL、EXE、启动目录和安全工具路径以维持系统与通知，擦除器可保留特定主机角色，窃取或篡改工具也可跳过会立即触发故障的组件。
      en: Ransomware may skip DLLs, executables, boot directories, and security-tool paths to preserve the system and notification,
        a wiper may preserve selected host roles, and theft or tampering tools may skip components whose modification would
        immediately cause failure.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要枚举目标并实现可靠排除谓词，理解哪些组件对运行和告警关键。过宽排除会降低影响，过窄会造成崩溃或暴露；动态路径和系统差异会降低可靠性。
        en: The adversary enumerates targets, implements a reliable exclusion predicate, and understands components critical
          to operation and alerting. Overbroad exclusion reduces impact, while narrow exclusion causes crash or exposure.
          Dynamic paths and system differences reduce reliability.
    defender_model:
      paragraphs:
      - zh: 防守方可观察枚举、正则或列表读取、分支、文件或注册表处理结果以及主机可用性，并比较同类目标覆盖率。缺少未处理目标日志、只关注实际修改或无法恢复配置时形成盲区；合法排除需要用途和 owner 基线。
        en: Defenders can observe enumeration, regular expression or list reads, branches, file or registry processing results,
          and host usability and compare coverage among peer targets. Missing logs for skipped targets, focus only on actual
          modification, or unrecovered configuration creates blind spots. Legitimate exclusions require purpose and owner
          baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 保留关键正常组件维持低异常运行外观
    en: Preserving critical normal components maintains a low-anomaly operating appearance
  analysis:
    paragraphs:
    - zh: 攻击者在恶意处理链中跳过会导致立即崩溃或强告警的目标，痕迹显示部分正常服务与文件仍工作；防守方在破坏完成前可能把活动视为局部变化，形成特征伪装。
      en: The adversary skips targets that would cause immediate crash or strong alert during a malicious processing chain,
        leaving some normal services and files operating. Defenders may interpret activity as localized change before destruction
        completes, producing Feature Disguise.
  evidence_refs:
  - REF-000402
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 子技术按排除决策的覆盖单位划分。NJS-0117-001“主机内关键对象保留”在一个资产内部对路径、扩展名、目录或组件应用谓词，需要比较同一枚举域中的处理与保留集合；NJS-0117-002“角色条件整机保留”按域控制器等资产角色让整个恶意流程终止或跳过，需要比较部署范围、角色清单、启动结果和跨主机破坏覆盖。
      en: Children are divided by the coverage unit of the exclusion decision. NJS-0117-001 In-Host Critical-Object Preservation applies a predicate to paths, extensions, directories, or components within one asset and requires comparison of processed and preserved sets in the same enumeration domain. NJS-0117-002 Role-Conditioned Host Preservation terminates or skips the whole malicious workflow according to an asset role such as domain controller and requires comparison of deployment scope, role inventory, launch outcome, and destructive coverage across hosts.
    - zh: 文件、目录、扩展名、产品和正则语法只是主机内谓词实现；域控制器、数据库或 HMI 名称只有在决定整机处理结果时才属于第二项。执行护栏决定恶意载荷是否在环境中整体激活，角色条件保留则发生在已部署破坏流程对同批资产的差异处理中。
      en: File, directory, extension, product, and regular-expression syntax are implementations of the in-host predicate. Domain-controller, database, or HMI labels belong to the second child only when they decide the whole-host outcome. Execution guardrails decide whether a malicious payload activates in an environment at all, whereas role-conditioned preservation occurs when an already deployed destructive workflow treats peer assets differently.
  coverage: established
  subtechnique_refs:
  - NJS-0117-001
  - NJS-0117-002
