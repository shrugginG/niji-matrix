research:
  limitations:
    paragraphs:
    - zh: AVADDON 直接证明同一主机内的目录和扩展名保留，LazyWiper 直接证明域控制器角色导致整机终止，因此两个覆盖单位和相应防御视角为高置信。攻击者为何选择某一保留集合仍可能从后继连续性推断；合法备份、安全保留、部署范围与测试护栏会产生相似差分，必须恢复恶意载荷、谓词、同批处理结果和最终影响。
      en: AVADDON directly establishes directory and extension preservation within one host, while LazyWiper directly establishes whole-host termination for the domain-controller role, giving high confidence to the two coverage units and their defensive vantages. Why the adversary selected a particular preserved set can still be inferred from successor continuity. Legitimate backup, safety preservation, deployment scope, and test guardrails create similar differentials, requiring recovery of the malicious payload, predicate, peer processing outcomes, and final impact.
