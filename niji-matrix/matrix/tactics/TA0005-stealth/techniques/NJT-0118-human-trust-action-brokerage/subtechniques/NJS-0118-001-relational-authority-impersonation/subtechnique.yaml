research:
  limitations:
    paragraphs:
    - zh: Midnight Blizzard 直接证明支持身份冒充、用户 MFA 动作和后继账户访问，但不同通信渠道对内容、身份和用户交互的保留差异很大。组织无法仅从紧急措辞或外部账户定性恶意；需要关系不一致、确认缺失与实际敏感结果。真实关系主体账户失陷时，身份差分可能只能从设备、线程语义和后继行为恢复。
      en: Midnight Blizzard directly establishes support-identity impersonation, a user's MFA action, and successor account access, but communication channels differ greatly in retention of content, identity, and user interaction. An organization cannot classify malice from urgent language or an external account alone; relationship inconsistency, missing confirmation, and an actual sensitive outcome are needed. When the real relationship principal's account is compromised, the identity differential may be recoverable only from device, thread semantics, and successor behavior.
