schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0118-001
name:
  zh: 关系权威冒充
  en: Relational-Authority Impersonation
summary:
  zh: 攻击者冒充与目标存在可信关系或职能权威的人员或组织，使用户把敏感执行、批准、授权或披露当作正常请求完成。
  en: Adversaries impersonate a person or organization with a trusted relationship or functional authority so users perform sensitive execution, approval, authorization, or disclosure as a normal request.
aliases: []
parent_ref: NJT-0118
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 关系权威冒充是攻击者在聊天、语音、邮件、工单、招聘或其他业务流程中，声称自己是目标认识、依赖或应服从的人员或组织，例如技术支持、高管、同事、供应商或招聘人员，并借这一关系或职能权威让用户代为执行敏感动作。直接目的在于把攻击者意图转换为用户主动且表面合法的操作。
    en: Relational-Authority Impersonation is an evasion sub-technique in which an adversary claims in chat, voice, mail, ticketing, recruiting, or another business workflow to be a person or organization the target knows, depends on, or is expected to obey, such as technical support, an executive, colleague, vendor, or recruiter, and uses that relationship or functional authority to have the user perform a sensitive action. Its immediate purpose is to convert adversary intent into a user-initiated and apparently legitimate operation.
  - zh: 稳定变量是显示或声明身份与真实关系主体之间的差异，以及该差异驱动的用户判断。通信介质、职位和请求动作是实现；只修改邮件传输头或利用域认证缺口而不依赖关系权威时属于 NJS-0118-002，两项可组合。
    en: The stable variable is the difference between displayed or claimed identity and the real relationship principal and the user judgment driven by that difference. Communication medium, job title, and requested action are implementations. Altering only email transport headers or exploiting domain-authentication gaps without relying on relational authority belongs to NJS-0118-002, and both children can combine.
stealth_characteristics:
  paragraphs:
  - zh: 关系权威冒充使高风险动作来自真实用户、正常客户端和受批准工作流。技术支持身份可让 MFA 代码输入或远程协助看起来像故障处理，高管或供应商身份可让支付和权限审批看起来像业务任务；执行边界只记录用户点击、输入、批准或运行，真实控制者停留在另一通信与关系观察面。
    en: Relational-Authority Impersonation makes high-risk actions originate from a real user, normal client, and approved workflow. A technical-support identity can make MFA-code entry or remote assistance look like troubleshooting, while an executive or vendor identity can make payment and authority approval look like a business task. The execution boundary records only the user clicking, entering, approving, or running, while the real controller remains on another communication and relationship vantage.
  - zh: 外部来源标签、账户或租户历史、组织目录、关系图、线程连续性、语言与流程异常、独立回呼、用户报告以及后继认证和资源结果仍可观察。真实账户或已失陷供应商租户会提高仿真度，却仍可能在关系角色、设备、时间和请求风险上产生差异；强制独立确认会限制效果。
    en: External-source labels, account or tenant history, organizational directories, relationship graphs, thread continuity, language and process anomalies, independent callback, user reports, and successor authentication and resource outcomes remain observable. A real account or compromised vendor tenant increases fidelity but can still differ in relationship role, device, timing, and request risk. Mandatory independent confirmation constrains the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意声明或塑造一个不真实的可信关系/权威身份，由此影响用户判断，并产生执行、批准、授权、支付或披露等未授权结果的行为。判定需要关系呈现、用户动作与后继结果之间的因果，而不是只看到一条欺骗消息。
    en: Scope includes deliberate adversary presentation or construction of a false trusted relationship or authority identity that influences user judgment and produces an unauthorized result such as execution, approval, authorization, payment, or disclosure. Classification requires causality among relationship presentation, user action, and successor outcome rather than one deceptive message alone.
  - zh: 合法委托、组织角色变更、普通服务台请求、营销、无用户动作的谎言和一般用户错误是反例。被攻陷真实账户可同时属于 NJT-0061，但只有其被用于冒充关系主体并驱动用户动作时属于本项；纯钓鱼投递、邮件头伪造和技术漏洞分别保留相邻边界。
    en: Legitimate delegation, organizational-role changes, ordinary help-desk requests, marketing, lies without user action, and general user error are counterexamples. A compromised real account can also belong to NJT-0061, but belongs here only when used to impersonate a relationship principal and drive a user action. Pure phishing delivery, mail-header forgery, and technical exploitation retain adjacent boundaries.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可冒充 IT 支持请求用户输入 MFA 代码、启动远程协助或安装补丁，冒充供应商要求修改付款账户，冒充高管要求紧急授权，或冒充招聘人员诱导下载载荷。Midnight Blizzard 使用已失陷租户和安全主题域名在 Teams 中冒充支持团队，用户输入代码后攻击者获得令牌并访问 Microsoft 365。
      en: An adversary may impersonate IT support and request an MFA code, remote assistance, or patch installation; impersonate a vendor and request payment-account changes; impersonate an executive and request urgent authorization; or impersonate a recruiter and induce payload download. Midnight Blizzard used compromised tenants and security-themed domains to impersonate support teams in Teams, and after a user entered a code the actor obtained a token and accessed Microsoft 365.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要了解组织关系、职能边界、语言、正在发生的业务或支持流程，并控制足以呈现身份的账户、租户、电话号码或渠道。取得真实账户或合作方租户提高可信度但增加准备成本；外部标签、错误流程细节、独立回呼和用户拒绝会暴露，重复尝试也会形成关系图异常。
        en: The adversary needs knowledge of organizational relationships, functional authority, language, and active business or support workflows and control of an account, tenant, phone number, or channel sufficient to present the identity. Obtaining a real account or partner tenant improves credibility but raises preparation cost. External labels, incorrect process details, independent callback, and user refusal expose the attempt, and repeated attempts form relationship-graph anomalies.
    defender_model:
      paragraphs:
      - zh: 防守方可取得通信账户与租户历史、外部/内部标签、组织与供应商目录、工单和线程、请求内容、用户交互、认证或审批结果以及独立确认记录。加密或外部渠道、缺少内容保留、真实合作方账户失陷和紧急流程会形成盲区；正常新关系需要 owner 与业务背景。
        en: Defenders can obtain communication-account and tenant history, external or internal labels, organization and vendor directories, tickets and threads, request content, user interaction, authentication or approval outcomes, and independent-confirmation records. Encrypted or external channels, missing content retention, compromised real partner accounts, and emergency workflows create blind spots. Legitimate new relationships require owner and business context.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 用户合法动作跨越冒充者与技术结果之间的观察边界
    en: A legitimate user action crosses the observation boundary between impersonator and technical outcome
  analysis:
    paragraphs:
    - zh: 攻击者用关系或职能权威让用户执行动作，技术痕迹从攻击者直接操作变为真实用户在正常客户端中的事件。防守方在认证、执行或审批边界只看到用户主体，真实控制来源停留在聊天、通话或业务情境中，形成行为透明；跨通信—用户—结果关联可以恢复因果。
      en: The adversary uses relational or functional authority to have a user perform an action, changing technical traces from direct adversary operation into an event by a real user in a normal client. At authentication, execution, or approval boundaries defenders see only the user principal, while the real control origin remains in chat, voice, or business context, producing Behavioral Transparency. Cross-communication-to-user-to-outcome correlation can restore causality.
  evidence_refs:
  - REF-000404
  - REF-000436
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 可信关系或职能身份外观替代攻击者真实身份
    en: Trusted relational or functional identity appearance substitutes for the adversary's real identity
  analysis:
    paragraphs:
    - zh: 攻击者复制支持团队、高管、同事或供应商的名称、域名主题、角色和沟通方式，使请求匹配组织熟悉的关系特征。用户与自动化工具据此降低怀疑，把冒充者映射为受信主体，形成特征伪装；账户历史、真实目录与独立确认仍可揭示差异。
      en: The adversary copies the name, domain theme, role, and communication style of support teams, executives, colleagues, or vendors so the request matches familiar organizational relationship features. Users and automated tools lower suspicion and map the impersonator to a trusted principal, producing Feature Disguise. Account history, authoritative directories, and independent confirmation can still reveal the difference.
  evidence_refs:
  - REF-000404
  - REF-000436
  confidence: high
