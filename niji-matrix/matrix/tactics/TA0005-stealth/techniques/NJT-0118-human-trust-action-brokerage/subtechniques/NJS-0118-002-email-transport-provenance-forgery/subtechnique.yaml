research:
  limitations:
    paragraphs:
    - zh: Kimsuky 联合公告直接证明弱 DMARC 与伪造合法域来源的活动，但邮件认证失败并不自动证明恶意，转发、邮件列表和合法代理发送都会破坏对齐。正式定性需要保留原始头、策略配置、已知发送关系和社会工程或用户结果；正文冒充而传输来源真实时不属于本项。
      en: The joint Kimsuky advisory directly establishes weak DMARC and forged legitimate-domain provenance, but email-authentication failure does not automatically establish malice because forwarding, mailing lists, and legitimate delegated sending can break alignment. Formal classification requires raw headers, policy configuration, known sending relationships, and a social-engineering or user outcome. Body-content impersonation with authentic transport provenance does not belong to this child.
