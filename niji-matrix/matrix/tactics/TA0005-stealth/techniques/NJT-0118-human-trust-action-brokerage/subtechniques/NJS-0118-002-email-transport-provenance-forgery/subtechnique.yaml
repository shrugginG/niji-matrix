schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0118-002
name:
  zh: 邮件传输来源伪造
  en: Email-Transport Provenance Forgery
summary:
  zh: 攻击者修改邮件头或利用弱域认证策略，使显示发送者与实际发送域、签名域或基础设施不一致却仍进入收件箱。
  en: Adversaries alter email headers or exploit weak domain-authentication policy so the displayed sender differs from the real sending domain, signing domain, or infrastructure while the message still reaches the inbox.
aliases: []
parent_ref: NJT-0118
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 邮件传输来源伪造是攻击者构造或修改 RFC 邮件头、envelope sender、显示 From、Reply-To 或相关传输身份，或利用缺失/弱执行的 SPF、DKIM 与 DMARC 策略，使收件人界面显示的人员或组织域与实际发送基础设施和认证责任不一致。直接目的在于让伪造请求借用合法邮件来源的可信外观并获得投递。
    en: Email-Transport Provenance Forgery is an evasion sub-technique in which an adversary constructs or alters RFC mail headers, envelope sender, displayed From, Reply-To, or related transport identities or exploits missing or weakly enforced SPF, DKIM, and DMARC policy so the person or organizational domain displayed to the recipient differs from the real sending infrastructure and authenticated responsibility. Its immediate purpose is to let a forged request borrow the trusted appearance of a legitimate mail source and be delivered.
  - zh: 稳定变量是显示来源与传输/域认证事实源之间的差分。邮件正文、主题和冒充角色是上层内容；若邮件来自真实或攻击者账户而主要依赖人员关系或职能权威说服用户，则属于 NJS-0118-001。相似域注册不等于头部伪造，通常还涉及资源开发与关系冒充。
    en: The stable variable is a differential between displayed provenance and transport or domain-authentication sources of truth. Message body, subject, and impersonated role are higher-layer content. If mail comes from a real or adversary account and primarily persuades through personal relationship or functional authority, it belongs to NJS-0118-001. Registration of a lookalike domain is not the same as header forgery and usually also involves resource development and relationship impersonation.
stealth_characteristics:
  paragraphs:
  - zh: 邮件传输来源伪造让客户端显眼位置显示合法组织域或人员地址，而 MAIL FROM、DKIM d=、Return-Path、连接 IP 或认证结果指向另一来源。SPF 单独只验证 envelope sender，DKIM 单独也不要求签名域与 From 对齐；DMARC 缺失、p=none 或投递方未执行时，认证失败消息仍可能到达收件箱并被用户当作内部或可信邮件。
    en: Email-Transport Provenance Forgery places a legitimate organizational domain or person address in prominent client display while MAIL FROM, DKIM d=, Return-Path, connecting IP, or authentication results point elsewhere. SPF alone validates only the envelope sender, and DKIM alone need not align its signing domain with From. When DMARC is absent, set to p=none, or not enforced by the receiver, a message with authentication failure can still reach the inbox and be treated by a user as internal or trusted mail.
  - zh: 完整消息头、SMTP 会话、消息追踪、SPF/DKIM/DMARC/ARC 结果、域对齐、发送基础设施历史和 Reply-To 仍保留来源差分。转发、邮件列表、营销平台和网关改写会造成合法失败，要求保留 ARC 与合作方配置背景；强制 reject/quarantine 和显式外部标记会限制效果。
    en: Complete headers, SMTP sessions, message trace, SPF, DKIM, DMARC, and ARC results, domain alignment, sending-infrastructure history, and Reply-To preserve provenance differentials. Forwarding, mailing lists, marketing platforms, and gateway rewriting create legitimate failures and require ARC and partner-configuration context. Enforced reject or quarantine and explicit external labeling constrain the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制邮件传输或头字段，使显示 From 身份与实际发送或认证域不一致，并借弱策略获得投递、随后连接社会工程请求或用户结果的行为。判定需要原始消息、认证结果与投递动作，不能只凭显示名称相似或用户收到邮件。
    en: Scope includes adversary control of mail transport or headers that makes displayed From identity differ from the actual sending or authenticated domain, gains delivery through weak policy, and connects to a social-engineering request or user outcome. Classification requires the raw message, authentication results, and delivery action; a similar display name or mere receipt of mail is insufficient.
  - zh: 合法代理发送、邮件列表、转发、CRM/营销服务、共享域和配置错误是反例。相似域、被攻陷真实邮箱和仅在正文中冒充人员分别属于资源开发、NJT-0061 或兄弟项，除非同时存在显示来源与传输认证事实的差分。
    en: Legitimate delegated sending, mailing lists, forwarding, CRM or marketing services, shared domains, and configuration errors are counterexamples. Lookalike domains, compromised real mailboxes, and person impersonation only in body content respectively belong to resource development, NJT-0061, or the sibling unless a displayed-provenance-to-transport-authentication differential also exists.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可把 From 设置为目标认识的专家或组织域，从自有基础设施发送，并利用目标域缺少 DMARC、p=none 或接收方宽松策略进入收件箱，再请求回复、打开链接或披露信息。Kimsuky 被联合公告确认利用弱 DMARC，使邮件看似来自合法域邮件交换并冒充记者、学者与政策专家开展情报收集。
      en: An adversary may set From to an expert or organizational domain known to the target, send from attacker infrastructure, and exploit absent DMARC, p=none, or permissive receiver policy to reach the inbox before requesting a reply, link opening, or disclosure. A joint advisory established Kimsuky exploiting weak DMARC so mail appeared to come from a legitimate domain's mail exchange while impersonating journalists, academics, and policy experts for intelligence collection.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可发送 SMTP 邮件并控制相关头字段，了解目标域与接收方的认证、转发和过滤策略，并选择能够通过或被宽松处理的组合。强 DMARC reject、对齐 DKIM、受信 ARC 链和信誉过滤会提高成本；错误头组合、异常 Reply-To、连接 IP 与批量模式会暴露来源。
        en: The adversary needs SMTP sending capability and control of relevant headers, knowledge of sender-domain and receiver authentication, forwarding, and filtering policy, and a combination that passes or is handled permissively. Strong DMARC reject, aligned DKIM, trusted ARC chains, and reputation filtering raise cost. Incorrect header combinations, anomalous Reply-To, connecting IP, and bulk patterns expose provenance.
    defender_model:
      paragraphs:
      - zh: 防守方可取得原始消息和 SMTP trace、MAIL FROM、From、Reply-To、DKIM d=、SPF/DKIM/DMARC/ARC 结果、连接基础设施、策略动作与用户交互，并维护合法代理发送和合作方清单。网关若丢弃原始头、转发破坏认证或只记录最终投递会形成盲区；域所有者还需汇总 DMARC 报告观察外部伪造。
        en: Defenders can obtain raw messages and SMTP traces, MAIL FROM, From, Reply-To, DKIM d=, SPF, DKIM, DMARC, and ARC results, connecting infrastructure, policy action, and user interaction and maintain inventories of legitimate delegated senders and partners. Blind spots arise when gateways discard original headers, forwarding breaks authentication, or only final delivery is logged. Domain owners also need aggregate DMARC reports to observe external spoofing.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 显示发送者外观替代真实邮件传输与认证来源
    en: Displayed sender appearance substitutes for real mail transport and authenticated provenance
  analysis:
    paragraphs:
    - zh: 攻击者让客户端显示合法 From 身份，同时由另一基础设施和认证域发送，痕迹中的显眼特征与真实来源分离。用户或只看显示字段的工具把邮件映射为受信来源，形成特征伪装；原始传输头、域对齐和策略结果可以恢复真实来源。
      en: The adversary causes the client to display a legitimate From identity while sending through different infrastructure and authentication domains, separating the prominent trace feature from real provenance. Users or tools that inspect only displayed fields map the message to a trusted source, producing Feature Disguise. Raw transport headers, domain alignment, and policy results can recover the real source.
