research:
  limitations:
    paragraphs:
    - zh: Midnight Blizzard 直接证明跨租户技术支持冒充到用户 MFA 动作和账户访问的链，Kimsuky 联合公告直接证明弱 DMARC 下的邮件来源伪造，因此两个事实源边界为高置信。沟通意图和用户判断无法只从技术日志确定；关系冒充需要内容、角色和独立确认背景，邮件来源伪造需要完整消息头和认证结果，两者都必须连接实际用户动作或未授权结果。
      en: Midnight Blizzard directly establishes a chain from cross-tenant technical-support impersonation through a user's MFA action to account access, while the joint Kimsuky advisory directly establishes email-provenance forgery under weak DMARC, giving high confidence to the two source-of-truth boundaries. Communication intent and user judgment cannot be determined from technical logs alone. Relationship impersonation needs content, role, and independent-confirmation context, while email-provenance forgery needs complete headers and authentication results; both must connect to an actual user action or unauthorized outcome.
