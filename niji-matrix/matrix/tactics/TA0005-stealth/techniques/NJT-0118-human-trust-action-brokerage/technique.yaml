schema_version: 2.0.0
type: technique
id: NJT-0118
name:
  zh: 人际信任动作代理
  en: Human-Trust Action Brokerage
summary:
  zh: 攻击者以可信人员或组织来源影响用户代为执行、批准或披露，把恶意因果嵌入正常通信与人工决策。
  en: Adversaries present a trusted person or organization to influence users to execute, approve, or disclose on their behalf,
    embedding malicious causality in normal communication and human decision-making.
aliases:
- Social Engineering
- T1684
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1684
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1684
definition_and_concept:
  paragraphs:
  - zh: 人际信任动作代理是攻击者伪造、借用或塑造可信人员、组织或通信来源，使目标用户把攻击者意图作为正常请求处理，并代为完成执行、批准、访问授权或信息披露。直接目的在于以用户合法动作替代明显恶意技术动作。
    en: Human-Trust Action Brokerage is adversary forgery, borrowing, or construction of a trusted person, organization, or
      communication source so a target user treats adversary intent as a normal request and performs execution, approval,
      access authorization, or information disclosure. Its immediate purpose is to substitute legitimate user action for an
      overt malicious technical action.
  - zh: 身份冒充、邮件头、显示名称、电话、聊天和其他介质是实现；概念锚是攻击者控制的信任呈现、用户判断、用户动作与后继恶意结果。
    en: Impersonation, mail headers, display names, telephone, chat, and other media are implementations. The conceptual anchor
      is adversary-controlled trust presentation, user judgment, user action, and malicious successor outcome.
stealth_characteristics:
  paragraphs:
  - zh: 用户动作可能来自正常客户端、账户与批准流程，恶意载荷或配置变化也可表现为用户主动操作。防守方若只看技术执行主体，会把因果归给用户而遗漏伪造来源，技术指标和自动化告警随之减少。
    en: User actions may originate from normal clients, accounts, and approval workflows, and malicious payload or configuration
      change can appear user-initiated. Defenders looking only at the technical actor attribute causality to the user and
      miss forged provenance, reducing technical indicators and automated alerts.
  - zh: 通信来源验证、会话历史、账户与域认证、内容相似性、用户动作、异常审批和后继结果仍可观察。独立回呼与多渠道确认可以破坏信任替代；被攻陷真实账户会增加归因难度。
    en: Communication provenance validation, conversation history, account and domain authentication, content similarity,
      user action, anomalous approval, and successor outcome remain observable. Independent callback and multichannel confirmation
      can break trust substitution, while a compromised real account increases attribution difficulty.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者以伪造或借用可信来源诱导用户执行、批准、授权或披露，并产生未授权结果的行为。判定要求来源呈现、用户动作和结果形成因果。
    en: Scope includes adversary use of forged or borrowed trusted provenance to induce user execution, approval, authorization,
      or disclosure with an unauthorized result. Classification requires causality among provenance presentation, user action,
      and outcome.
  - zh: 合法委托、市场营销、无后继结果的谎言、普通用户错误和纯技术漏洞排除。钓鱼、初始访问或凭据访问可以与本技术共现，但直接目的不同。介质、职位和目标动作不构成子技术。
    en: Legitimate delegation, marketing, lies without a successor outcome, ordinary user error, and purely technical exploitation
      are excluded. Phishing, initial access, or credential access can coexist but have different direct purposes. Medium,
      job role, and target action do not define children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可冒充高管、同事、供应商或服务台，请求用户运行命令、批准 OAuth、修改支付信息或披露秘密；也可伪造邮件发送者字段，使请求在正常收件箱与线程中显得可信。
      en: An adversary may impersonate an executive, colleague, vendor, or help desk and ask a user to run a command, approve
        OAuth, change payment information, or disclose a secret, or forge email-sender fields so the request appears trusted
        in a normal inbox and thread.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者了解组织关系、业务语言与渠道，并能控制或伪造来源。其限制是目标可独立确认、身份认证可能失败、语言与流程错误会暴露，真实账户取得成本更高。
        en: The adversary understands organizational relationships, business language, and channels and can control or forge
          provenance. Targets can confirm independently, identity authentication may fail, language and process errors expose
          the attempt, and obtaining a real account is more costly.
    defender_model:
      paragraphs:
      - zh: 防守方能观察域与账户认证、会话历史、关系图、内容、审批、用户动作和后继结果，并建立高风险流程确认规则。端到端加密、外部渠道、被攻陷真实账户和缺少业务上下文形成盲区。
        en: Defenders can observe domain and account authentication, conversation history, relationship graphs, content, approvals,
          user actions, and successor outcomes and establish confirmation for high-risk workflows. End-to-end encryption,
          external channels, compromised real accounts, and missing business context create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 用户合法动作跨越攻击者与技术结果之间的观察边界
    en: A legitimate user action crosses the observation boundary between adversary and technical outcome
  analysis:
    paragraphs:
    - zh: 攻击者通过可信请求让用户执行动作，痕迹从攻击者直接操作变为通信和用户主体的正常事件；防守方在执行边界只看到用户，真实控制来源落在另一观察面，形成行为透明。
      en: The adversary uses a trusted request to have a user perform an action, changing traces from direct adversary operation
        into normal communication and user-subject events. At the execution boundary defenders see only the user, while real
        control origin lies on another observation plane, producing Behavioral Transparency.
  evidence_refs:
  - REF-000404
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 可信人员或组织外观替代攻击者真实身份
    en: Trusted person or organization appearance substitutes for adversary identity
  analysis:
    paragraphs:
    - zh: 攻击者复制名称、关系、线程与发送者外观，使请求匹配合法通信特征；用户与工具据此降低怀疑，形成特征伪装。
      en: The adversary copies name, relationship, thread, and sender appearance so the request matches legitimate communication
        features. Users and tools lower suspicion, producing Feature Disguise.
  evidence_refs:
  - REF-000404
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 子技术按被伪造的信任事实源划分。NJS-0118-001“关系权威冒充”让攻击者在聊天、语音、邮件或服务流程中声称自己是具有既有关系或职能权威的人员/组织，验证依赖关系历史、组织角色和独立回呼；NJS-0118-002“邮件传输来源伪造”修改头字段或利用弱 DMARC，让显示 From 与真实 MAIL FROM、DKIM 域或发送基础设施不一致，验证依赖邮件认证和消息追踪。
      en: Children are divided by the source of trust being forged. NJS-0118-001 Relational-Authority Impersonation has the adversary claim to be a person or organization with an established relationship or functional authority in chat, voice, mail, or service workflows and requires relationship history, organizational role, and independent callback. NJS-0118-002 Email-Transport Provenance Forgery alters headers or exploits weak DMARC so displayed From differs from the real MAIL FROM, DKIM domain, or sending infrastructure and requires mail authentication and message trace.
    - zh: 邮件、电话、聊天和面对面介质本身不构成子技术；关系权威冒充可以通过任一介质发生，邮件来源伪造则因具有独立的协议事实源与可预防控制而成立。两项可以组合，但被攻陷的真实账户通常属于第一项和 NJT-0061，而没有传输来源伪造时不属于第二项。
      en: Email, telephone, chat, and face-to-face media do not define children. Relational-authority impersonation can occur through any medium, while email-provenance forgery qualifies because it has independent protocol sources of truth and preventive controls. Both can combine, but a compromised real account generally belongs to the first child and NJT-0061 and does not belong to the second without transport-provenance forgery.
