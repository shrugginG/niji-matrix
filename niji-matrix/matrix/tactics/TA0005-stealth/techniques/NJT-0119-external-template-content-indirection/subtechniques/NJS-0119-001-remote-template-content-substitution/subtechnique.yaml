schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0119-001
name: {zh: 远程模板内容替换, en: Remote-Template Content Substitution}
summary: {zh: 攻击者让静态文档在打开时取得按请求提供的远程模板、宏或脚本，使入口扫描对象缺少最终可执行语义。, en: Adversaries have a static document retrieve a remotely supplied template macro or script at open time so the ingress-scanned object lacks final executable semantics.}
aliases: []
parent_ref: NJT-0119
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 远程模板内容替换是攻击者在文档关系中指定外部模板或资源，由攻击者服务器在打开、预览或刷新时返回宏、脚本、模板正文或后继加载逻辑。直接目的在于让最终可执行内容不进入原始附件，并允许服务器按请求来源和时间替换、延迟或拒绝内容。稳定变量是原文件关系与运行时响应内容的分离，而不是文档格式或协议。
    en: Remote-Template Content Substitution is an evasion sub-technique in which an adversary places an external template or resource in a document relationship and has an adversary server return a macro, script, template body, or successor loading logic when the document is opened, previewed, or refreshed. Its immediate purpose is to keep final executable content out of the original attachment and allow the server to replace, delay, or withhold content according to request origin and time. The stable variable is separation between the original-file relationship and runtime response content rather than document format or protocol.
stealth_characteristics:
  paragraphs:
  - zh: 远程模板内容替换让静态文档只呈现合法诱饵、关系 ID 与 URI，附件扫描无法分析尚未返回的宏。攻击者可向邮件沙箱返回空白内容、向真实用户返回恶意模板，进一步制造分析结果差异。关系 URI、服务器身份、响应摘要、缓存、宏加载、子进程和网络仍可恢复链条；禁止外部模板或归档响应会限制效果。
    en: Remote-Template Content Substitution leaves a static document with only a legitimate lure, relationship identity, and URI, preventing attachment scanning from analyzing a macro that has not yet been returned. The adversary can return blank content to a mail sandbox and a malicious template to a real user, further differentiating analysis outcomes. Relationship URI, server identity, response digest, cache, macro load, child processes, and networking can recover the chain, while blocking external templates or archiving responses constrains the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入外部关系取得攻击者控制的内容、内容包含或导致可执行语义、并与打开文档后的恶意结果相连的行为。合法企业模板、品牌样式、普通图片、失效链接和未消费响应是反例。主要结果仅为认证或凭据披露归 NJS-0119-002；文档内部嵌入载荷归 NJT-0115。
    en: Scope includes an external relationship retrieving adversary-controlled content that contains or leads to executable semantics and connects to a malicious result after document opening. Legitimate enterprise templates, branding styles, ordinary images, broken links, and unconsumed responses are counterexamples. Authentication or credential disclosure as the primary outcome belongs to NJS-0119-002, while payloads embedded inside the document belong to NJT-0115.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 钓鱼文档可引用攻击者域上的 .dot 模板，用户打开时取得宏并启动多阶段脚本；ACTINIUM 使用远程模板让恶意代码仅在需要时加载，并能避免自动系统取得相同组件。
      en: A phishing document can reference a .dot template on an adversary domain and retrieve a macro at open time to start multistage scripts. ACTINIUM used remote templates so malicious code loaded only when needed and automated systems could be denied the same component.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需构造有效关系、控制可达服务器、返回应用兼容模板，并维持域、TLS、MIME 与缓存语义；受保护视图、宏策略、网络阻断和服务器下线会失败，条件响应也留下基础设施与请求日志。
        en: The adversary needs a valid relationship, a reachable controlled server, an application-compatible template response, and correct domain, TLS, MIME, and cache semantics. Protected view, macro policy, network blocking, and server takedown cause failure, while conditional responses leave infrastructure and request logs.
    defender_model:
      paragraphs:
      - zh: 防守方可解析关系、记录文档应用网络、服务器与证书、响应和缓存摘要、宏/脚本加载、子进程与后继流量，并以文档摘要和关系 ID 关联。TLS 不可见、条件响应或缓存丢失时形成盲区；批准模板需签名与版本基线。
        en: Defenders can parse relationships, record document-application networking, server and certificate identity, response and cache digests, macro or script loads, child processes, and successor traffic and correlate by document digest and relationship identity. TLS opacity, conditional responses, or lost cache create blind spots. Approved templates require signing and version baselines.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 运行时远程响应跨越静态附件检查边界, en: Runtime remote response crosses the static attachment inspection boundary}
  analysis:
    paragraphs:
    - zh: 攻击者让原文件只保存指针，真实宏或脚本直到打开时才从另一观察面出现，痕迹分裂为良性附件和远程执行结果。静态扫描无法跨越解析边界，形成行为透明；响应归档和运行谱系可以恢复因果。
      en: The adversary leaves only a pointer in the original file and makes the real macro or script appear from another vantage only at open time, splitting traces into a benign attachment and remote execution outcome. Static scanning cannot cross the resolution boundary, producing Behavioral Transparency. Response archiving and runtime lineage restore causality.
  evidence_refs: [REF-000407, REF-000438]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000116]}, mitigations: {coverage: available, mitigation_refs: [MIT-000117]}}
evidence: {claim_refs: [CLM-000649], case_refs: [CASE-000160], reference_refs: [REF-000407, REF-000438]}
research:
  limitations:
    paragraphs:
    - zh: ACTINIUM 直接证明远程宏按打开时机加载，但不同应用对模板、缓存和宏执行不同。若没有捕获实际响应，只能证明文档访问外部关系，不能推断返回内容恶意；条件服务器也可能在复现时返回不同结果。
      en: ACTINIUM directly establishes remote macro loading at open time, but applications differ in template, cache, and macro execution. Without the actual response, evidence proves only external relationship access and cannot establish malicious returned content. A conditional server can also return a different result during reproduction.
