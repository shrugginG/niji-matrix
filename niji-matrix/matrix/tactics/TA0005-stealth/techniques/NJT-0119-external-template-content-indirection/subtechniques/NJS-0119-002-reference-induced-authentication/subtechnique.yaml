schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0119-002
name: {zh: 引用诱发认证, en: Reference-Induced Authentication}
summary: {zh: 攻击者让文档解析外部模板或资源时触发应用或用户认证，以凭据或认证材料披露作为主要结果。, en: Adversaries have document resolution of an external template or resource trigger application or user authentication with credential or authentication-material disclosure as the primary outcome.}
aliases: []
parent_ref: NJT-0119
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 引用诱发认证是攻击者把文档模板或资源指向外部 SMB、Web 或等价服务，使文档应用自动尝试集成认证或向用户显示认证提示，并由攻击者端接收凭据、挑战响应或其他认证材料。直接目的在于借文档解析触发身份交换，不要求远端返回或执行恶意代码；稳定变量是引用—认证目标—认证/披露结果链。
    en: Reference-Induced Authentication is an evasion sub-technique in which an adversary points a document template or resource to an external SMB, web, or equivalent service so the document application attempts integrated authentication automatically or displays an authentication prompt to the user and the adversary side receives credentials, challenge responses, or other authentication material. Its immediate purpose is to trigger an identity exchange through document resolution and does not require remote malicious code to return or execute. The stable variable is the reference-to-authentication-target-to-authentication-or-disclosure chain.
stealth_characteristics:
  paragraphs:
  - zh: 引用诱发认证让静态文件和运行进程都可能缺少恶意载荷，只留下看似普通的外部 URI。认证可被归因于 Office 或用户正常资源访问，凭据结果出现在身份/服务器观察面而非附件扫描面。关系、DNS/SMB/HTTP、提示、用户输入、认证目标与结果仍可观察；阻止办公应用外部认证和使用抗中继认证会限制效果。
    en: Reference-Induced Authentication can leave both the static file and running process without a malicious payload, exposing only an ordinary-looking external URI. Authentication can be attributed to normal Office or user resource access, while credential outcome appears on an identity or server vantage rather than the attachment-scanning vantage. Relationships, DNS, SMB or HTTP, prompts, user input, authentication target, and outcome remain observable. Blocking external authentication from office applications and using relay-resistant authentication constrain the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制外部关系、文档解析直接触发认证尝试或提示、且认证材料到达攻击者目标或产生未授权身份结果的行为。普通登录链接、用户主动浏览网站、合法企业模板认证和没有认证结果的连接失败是反例。返回宏或脚本并执行归兄弟项；通过图片/LNK 等非模板对象强制认证归相邻技术。
    en: Scope includes an adversary-controlled external relationship whose document resolution directly triggers an authentication attempt or prompt and whose authentication material reaches an adversary target or produces an unauthorized identity outcome. Ordinary login links, user-initiated web browsing, legitimate enterprise-template authentication, and connection failures without authentication outcome are counterexamples. Returning and executing a macro or script belongs to the sibling, while forced authentication through images, LNKs, or other non-template objects belongs to adjacent techniques.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可用 Phishery 注入远程 attachedTemplate，Office 解析时显示连接攻击者域的凭据对话框，用户输入后服务端收集凭据。DarkHydrus 在中东目标中使用该链，Unit 42 复现并验证了服务端结果。
      en: An adversary can use Phishery to inject a remote attachedTemplate. Office displays a credential dialog for the adversary domain during resolution and the server collects credentials after user entry. DarkHydrus used this chain against Middle Eastern targets, and Unit 42 reproduced and verified the server-side outcome.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制外部服务、构造能触发目标应用认证的关系并使域名/提示足够可信。现代凭据保护、NTLM 禁用、外部 SMB 阻断、抗钓鱼认证和用户拒绝会失败；提示、DNS 和服务器证书会留下线索。
        en: The adversary needs control of an external service, a relationship that triggers target-application authentication, and a sufficiently credible domain or prompt. Modern credential protection, disabled NTLM, blocked external SMB, phishing-resistant authentication, and user refusal cause failure. Prompts, DNS, and server certificates leave clues.
    defender_model:
      paragraphs:
      - zh: 防守方可连接文档关系、应用网络、认证协议、目标域、用户交互、身份日志和凭据后继使用。认证系统与端点日志分离、外部个人设备或仅记录成功登录时形成盲区；合法模板认证需明确 owner 与目标。
        en: Defenders can join document relationships, application networking, authentication protocol, target domain, user interaction, identity logs, and successor credential use. Separate identity and endpoint logs, external personal devices, or retention of successful sign-ins only create blind spots. Legitimate template authentication requires explicit owner and target.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 文档解析边界把认证结果移出附件观察面, en: The document-resolution boundary moves authentication outcome outside the attachment vantage}
  analysis:
    paragraphs:
    - zh: 攻击者让文档应用代表用户访问外部引用，技术痕迹从明显凭据采集器变为正常文档网络和认证事件，附件观察面看不到最终披露，形成行为透明。跨文档—网络—身份关联可恢复控制来源。
      en: The adversary has the document application access an external reference on the user's behalf, changing traces from an overt credential collector into normal document networking and authentication events. The attachment vantage misses the final disclosure, producing Behavioral Transparency. Cross-document-to-network-to-identity correlation restores the control origin.
  evidence_refs: [REF-000407, REF-000439]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000116]}, mitigations: {coverage: available, mitigation_refs: [MIT-000117]}}
evidence: {claim_refs: [CLM-000650], case_refs: [CASE-000161], reference_refs: [REF-000407, REF-000439]}
research:
  limitations:
    paragraphs:
    - zh: DarkHydrus 与 Phishery 复现直接证明交互式凭据输入，其他应用可能自动发送挑战响应或完全阻断认证。没有服务端或身份日志时，只能确认外部连接和提示，不能证明认证材料泄露；用户输入也可能是测试值。
      en: DarkHydrus and the Phishery reproduction directly establish interactive credential entry, while other applications may send challenge responses automatically or block authentication entirely. Without server-side or identity logs, evidence establishes only an external connection and prompt, not disclosure of authentication material. User-entered values can also be test data.
