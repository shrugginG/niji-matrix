research:
  limitations:
    paragraphs:
    - zh: ACTINIUM 直接证明按打开时机取得远程恶意宏，DarkHydrus 与 Phishery 复现实验直接证明模板引用诱发认证并收集凭据，因此父行为与两个结果边界均为高置信。应用和版本对关系解析、缓存、宏、自动认证与提示处理不同；若无法保存原始关系、实际响应或认证结果，只能确认外部访问，不能越级推断代码或凭据结果。
      en: ACTINIUM directly establishes retrieval of a malicious remote macro at open time, while DarkHydrus and the Phishery reproduction directly establish template-reference-induced authentication and credential collection, giving high confidence to the parent behavior and both outcome boundaries. Applications and versions differ in relationship parsing, caching, macros, automatic authentication, and prompts. Without the original relationship, actual response, or authentication outcome, evidence establishes only external access and cannot be escalated to a code or credential conclusion.
