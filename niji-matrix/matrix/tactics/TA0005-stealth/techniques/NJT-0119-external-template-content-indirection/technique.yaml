schema_version: 2.0.0
type: technique
id: NJT-0119
name:
  zh: 外部模板内容间接化
  en: External-Template Content Indirection
summary:
  zh: 攻击者让文档在打开时解析外部模板或资源，使恶意内容与认证触发不出现在静态文档本体。
  en: Adversaries have a document resolve an external template or resource when opened so malicious content and authentication
    triggers are absent from the static document body.
aliases:
- Template Injection
- T1221
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1221
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1221
definition_and_concept:
  paragraphs:
  - zh: 外部模板内容间接化是攻击者创建或修改文档包中的模板、资源或关系引用，使应用在打开、预览或刷新文档时访问攻击者控制位置。解析可能取得包含宏、脚本或展示内容的远程模板，也可能仅触发 SMB、HTTP 或其他认证交互。直接目的在于把决定性恶意语义或认证结果移出静态文件边界，使入口扫描看到的对象与运行时实际消费对象不同。
    en: External-Template Content Indirection is adversary creation or modification of template, resource, or relationship references in a document package so the application accesses an adversary-controlled location when the document is opened, previewed, or refreshed. Resolution may retrieve a remote template containing macros, scripts, or display content, or it may only trigger SMB, HTTP, or another authentication interaction. Its immediate purpose is to move decisive malicious semantics or authentication outcomes outside the static file boundary so the object seen by ingress scanning differs from the object actually consumed at runtime.
  - zh: 稳定概念不是 Office、OOXML、模板后缀或协议，而是原始文档中的外部关系、运行时解析、远端响应或认证动作以及后继结果组成的间接链。远程内容保存在文档内部时归 NJT-0115 的载体嵌入，单纯网络下载归传输技术；只有文档解析语义自动或受用户打开触发外部关系时属于本技术。
    en: The stable concept is not Office, OOXML, a template suffix, or protocol but an indirect chain from an external relationship in the original document through runtime resolution to a remote response or authentication action and successor outcome. Remote content stored inside the document belongs to NJT-0115 carrier embedding, and an ordinary network download belongs to transfer techniques. This technique applies only when document-resolution semantics automatically or through user opening trigger the external relationship.
stealth_characteristics:
  paragraphs:
  - zh: 外部模板内容间接化让静态文档只保留语法正常的关系 ID、URI 和诱饵正文。远程内容替换可由攻击者按请求时间、来源或自动化特征选择响应，使沙箱得到空白或良性模板而真实用户取得宏；引用诱发认证则可能不返回恶意代码，却让文档应用或用户向外部位置发送认证材料。只扫描正文和嵌入对象的工具会遗漏后半链条。
    en: External-Template Content Indirection leaves only syntactically ordinary relationship identifiers, URIs, and lure body in the static document. With remote-content substitution, the adversary can choose a response according to request time, source, or automation features so a sandbox receives a blank or benign template while the real user receives a macro. With reference-induced authentication, no malicious code need return, yet the document application or user sends authentication material to an external location. Tools that scan only body and embedded objects miss the latter half of the chain.
  - zh: 原始关系、DNS/HTTP/SMB 请求、TLS 或服务器身份、响应摘要、缓存模板、认证提示或挑战、用户输入、子进程和后继资源访问仍可观察。入口关系解析、文档应用网络限制、外部认证阻断和响应内容归档会限制匿迹；批准模板域被攻陷时，简单域允许清单不足。
    en: Original relationships, DNS, HTTP, or SMB requests, TLS or server identity, response digests, cached templates, authentication prompts or challenges, user input, child processes, and successor resource access remain observable. Ingress relationship parsing, document-application network restriction, external-authentication blocking, and response-content archiving constrain stealth. A simple domain allowlist is insufficient when an approved template domain is compromised.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制文档外部关系或其解析目标，并在打开、预览或刷新时产生远程可执行内容、用户/应用认证或未授权后继结果的行为。判定需要原始文档关系、解析请求、远端身份或响应以及结果形成可验证谱系；只有未知 URL、外部请求或模板缓存并不足够。
    en: Scope includes adversary control of an external document relationship or its resolution target that produces remotely supplied executable content, user or application authentication, or an unauthorized successor outcome during open, preview, or refresh. Classification requires verifiable lineage among the original relationship, resolution request, remote identity or response, and outcome. An unknown URL, external request, or template cache alone is insufficient.
  - zh: 合法集中模板、品牌样式、协作插件、普通图片、受批准远程资源、失效链接和无需认证的内容分发是反例。返回代码或模板内容归 NJS-0119-001，主要结果为认证或凭据披露归 NJS-0119-002；文档内嵌载荷归 NJT-0115，文档外观欺骗归 NJT-0114，用户被诱导主动执行另与用户动作技术共映射。
    en: Legitimate centralized templates, branding styles, collaboration plug-ins, ordinary images, approved remote resources, broken links, and unauthenticated content delivery are counterexamples. Returned code or template content belongs to NJS-0119-001, while authentication or credential disclosure as the primary outcome belongs to NJS-0119-002. Embedded document payloads belong to NJT-0115, document-appearance deception to NJT-0114, and induced user execution can co-map to a user-action technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 鱼叉式钓鱼附件可包含指向攻击者服务器的 attachedTemplate，用户打开后服务器按条件返回带宏的模板并启动多阶段载荷；同类关系也可指向外部 SMB 或仿冒 Web 服务，在文档应用解析时弹出认证对话框或发送集成认证。攻击者借此绕过附件静态扫描、按目标控制投递，或直接收集凭据。
      en: A spearphishing attachment may contain an attachedTemplate pointing to an adversary server, which conditionally returns a macro-bearing template when the user opens it and starts a multistage payload. The same relationship can point to external SMB or a deceptive web service and prompt for credentials or send integrated authentication when the document application resolves it. The adversary thereby bypasses static attachment scanning, controls delivery by target, or collects credentials directly.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要生成或修改有效文档关系，控制可从目标网络到达的外部资源，并预测应用的协议、缓存、宏与认证语义。内容替换还需按请求提供兼容模板，认证路径需诱使客户端或用户向外部目标认证；错误关系、证书、MIME 或模板格式会暴露或中断链条。网络出口、受保护视图和模板信任策略会提高成本。
        en: The adversary needs to create or modify a valid document relationship, control an external resource reachable from the target network, and predict application protocol, cache, macro, and authentication semantics. Content substitution also requires a compatible template response by request, while the authentication path must induce the client or user to authenticate to the external target. Incorrect relationships, certificates, MIME, or template formats expose or break the chain. Network egress, protected view, and template-trust policy raise the cost.
    defender_model:
      paragraphs:
      - zh: 防守方可解析 OOXML/OLE 关系与 URI，观察应用 DNS/HTTP/SMB、服务器与证书、响应摘要、缓存来源、认证挑战与用户输入、子进程和资源访问，并用文档摘要和关系 ID 连接。TLS 内容不可见、模板按来源条件化返回、缓存覆盖原响应、认证发生在独立身份系统或邮件沙箱不允许网络时会形成盲区；合法企业模板需要签名、owner 与发布基线。
        en: Defenders can parse OOXML or OLE relationships and URIs, observe application DNS, HTTP, or SMB, server and certificate identity, response digest, cache provenance, authentication challenge and user input, child processes, and resource access, and join them with document digest and relationship identity. Blind spots arise when TLS content is unavailable, templates return conditionally by source, cache overwrites the original response, authentication occurs in a separate identity system, or a mail sandbox denies networking. Legitimate enterprise templates require signing, owner, and release baselines.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 外部引用跨越静态文档检查边界
    en: An external reference crosses the static-document inspection boundary
  analysis:
    paragraphs:
    - zh: 攻击者把真实内容放在外部位置，痕迹从完整恶意文件分裂为正常文档引用与打开时网络结果；静态扫描看不到后半链条，形成行为透明。
      en: The adversary places real content externally, splitting traces from a complete malicious file into a normal document
        reference and an open-time network outcome. Static scanning misses the latter half of the chain, producing Behavioral
        Transparency.
  evidence_refs:
  - REF-000407
  - REF-000438
  - REF-000439
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 子技术按外部解析产生的主要结果与事实源划分。NJS-0119-001“远程模板内容替换”取得攻击者控制的宏、脚本或模板内容，需要关系、响应摘要、缓存与代码执行谱系；NJS-0119-002“引用诱发认证”主要触发应用或用户认证并导致凭据/认证材料披露，需要引用、认证目标、交互与身份结果关联，即使没有远程代码也成立。
      en: Children are divided by the primary outcome and source of truth produced by external resolution. NJS-0119-001 Remote-Template Content Substitution retrieves adversary-controlled macro, script, or template content and requires relationship, response digest, cache, and code-execution lineage. NJS-0119-002 Reference-Induced Authentication primarily triggers application or user authentication and causes disclosure of credentials or authentication material, requiring reference, authentication target, interaction, and identity outcome even when no remote code executes.
    - zh: 文档格式、模板后缀、HTTP/SMB 协议和目标行业只是实现，不构成子项。一次关系可同时先认证再返回内容而共映射两项；分类以主要结果和可实施防御为准，而不是按载体拆分。
      en: Document format, template suffix, HTTP or SMB protocol, and target industry are implementations and do not form children. One relationship can authenticate first and then return content and therefore co-map to both children. Classification follows the primary outcome and implementable defense rather than carrier.
