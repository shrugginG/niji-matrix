schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0120-001
name:
  zh: 有状态信号序列激活
  en: Stateful Signal-Sequence Activation
summary:
  zh: 攻击者要求同一来源按顺序发送多个端口或数据包事件，只有累计状态完成后才开放隐藏功能。
  en: Adversaries require one source to send several ordered port or packet events and expose hidden functionality only
    after accumulated state completes.
aliases: []
parent_ref: NJT-0120
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 有状态信号序列激活是攻击者让植入、守护进程或防火墙按来源保存匹配进度，依次接收预定义端口、标志或数据包事件，并在完整顺序、方向与时间条件满足后开放端口、启动进程或发起反向连接。直接目的在于把真实服务暴露限制给知道顺序的操作者；稳定变量是跨多个事件的有序状态机，而不是端口号或协议。
    en: Stateful Signal-Sequence Activation is an evasion sub-technique in which an adversary has an implant, daemon,
      or firewall retain match progress by source, receive predefined ports, flags, or packet events in order, and open
      a port, start a process, or initiate a reverse connection only after the full order, direction, and timing conditions
      are satisfied. Its immediate purpose is to restrict real service exposure to an operator who knows the sequence.
      The stable variable is an ordered state machine across multiple events rather than port number or protocol.
stealth_characteristics:
  paragraphs:
  - zh: 有状态信号序列激活让每个单独事件看起来像失败连接、扫描噪声或被丢弃包，普通端口扫描不会完成正确顺序。完整序列、按来源状态、超时、随后 ACL/防火墙变化、监听或回连仍可观察；全流量长窗口状态机和重放会限制效果，但 NAT
      与丢包可破坏来源和顺序。
    en: Stateful Signal-Sequence Activation makes each individual event resemble a failed connection, scan noise, or
      dropped packet, and ordinary port scanning does not complete the correct order. The full sequence, source-scoped
      state, timeout, successor ACL or firewall change, listener, or callback remain observable. Long-window full-traffic
      state machines and replay constrain the effect, while NAT and packet loss can break source and ordering.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入至少两个按顺序或状态关系关联的网络事件、攻击者控制的匹配器以及后继隐藏功能状态变化。合法 knockd 管理、健康检查、扫描、分布式网络测量和普通多包握手是反例。单包头字段、魔数或载荷即可触发时归 NJS-0120-002；持续开放服务认证不属于本技术。
    en: Scope includes at least two network events related by order or state, an adversary-controlled matcher, and a
      successor hidden-function state change. Legitimate knockd administration, health checks, scanning, distributed
      network measurement, and ordinary multipacket handshakes are counterexamples. When one packet header field, magic
      value, or payload suffices, the behavior belongs to NJS-0120-002. Authentication to a continuously exposed service
      is outside this technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 后门可要求同一 IP 依次触碰若干关闭端口，完成后临时添加防火墙规则或让目标主动回连；序列可包含方向、标志与超时，失败后重置。ATT&CK 记录 cd00r 等实现按可配置端口顺序开放通信。
      en: A backdoor can require one IP to touch several closed ports in order and then temporarily add a firewall rule
        or have the target connect back. The sequence can include direction, flags, and timeouts and reset on failure.
        ATT&CK documents implementations such as cd00r opening communication after a configurable port order.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需安装被动监听与状态存储，知道序列和时间窗口，并从不会被 NAT/中间件破坏的路径发包。乱序、丢包、共享出口和重放防护会降低可靠性；序列固定后可被旁路捕获和重放。
        en: The adversary needs passive listening and state storage, knowledge of sequence and timing window, and a packet
          path not disrupted by NAT or middleboxes. Reordering, loss, shared egress, and replay protection reduce reliability.
          Once fixed, the sequence can be captured and replayed side-channel.
    defender_model:
      paragraphs:
      - zh: 防守方需保留关闭端口和丢弃包，按来源/目标重建顺序，并关联规则、监听、进程和会话。只保留成功连接、NAT 丢失来源或采样遗漏序列时形成盲区；合法端口敲击需 owner 与规则基线。
        en: Defenders need closed-port and dropped-packet retention, source-to-target sequence reconstruction, and correlation
          with rules, listeners, processes, and sessions. Retaining successful connections only, losing source through
          NAT, or sampling away sequence elements creates blind spots. Legitimate port knocking needs owner and rule
          baselines.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 多事件匹配状态把隐藏功能隔离在普通扫描之外
    en: A multi-event match state isolates hidden functionality from ordinary scanning
  analysis:
    paragraphs:
    - zh: 攻击者把激活条件分散到多个看似无结果的包，单个观察点无法识别完整意图，且非匹配扫描始终看到关闭状态。真实功能只在状态机完成后短暂出现，形成行为透明；跨包状态与主机变化关联可恢复链条。
      en: The adversary distributes the activation condition across several apparently fruitless packets, preventing
        one observation from revealing full intent and leaving nonmatching scans with a closed state. Real functionality
        appears only briefly after the state machine completes, producing Behavioral Transparency. Cross-packet state
        and host-change correlation restore the chain.
  evidence_refs:
  - REF-000408
  confidence: high
