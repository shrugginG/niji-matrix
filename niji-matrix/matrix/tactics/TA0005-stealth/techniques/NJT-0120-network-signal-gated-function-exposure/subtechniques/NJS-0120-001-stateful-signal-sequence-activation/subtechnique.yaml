research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接支持端口敲击序列，但公开案例常不披露完整顺序与窗口。没有后继网络或主机状态变化时，端口序列也可能是合法管理或扫描；高置信定性必须连接匹配状态与隐藏功能。
      en: ATT&CK directly supports port-knock sequences, but public cases often omit the complete order and window. Without
        a successor network or host-state change, a port sequence can also be legitimate administration or scanning.
        High-confidence classification must connect matched state to hidden functionality.
