research:
  limitations:
    paragraphs:
    - zh: 两个案例直接证明特殊 TCP 字段和 magic value 过滤，但复杂握手可能在初始单包匹配后继续交换挑战。子技术只拥有从隐藏到激活的初始匹配；后继认证不改变边界。没有过滤器或激活结果时，异常包不足以定性。
      en: The two cases directly establish special TCP fields and magic-value filtering, but a complex handshake can
        exchange challenges after the initial one-packet match. This child owns only the initial hidden-to-active match,
        and successor authentication does not change the boundary. Without a filter or activation outcome, an anomalous
        packet is insufficient.
