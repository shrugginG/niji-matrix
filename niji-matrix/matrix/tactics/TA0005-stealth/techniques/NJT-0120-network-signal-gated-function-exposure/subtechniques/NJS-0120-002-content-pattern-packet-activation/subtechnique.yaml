schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0120-002
name:
  zh: 内容模式数据包激活
  en: Content-Pattern Packet Activation
summary:
  zh: 攻击者让包过滤器以单个特殊头字段、魔数或载荷模式触发流量重定向或隐藏功能，而真实端口保持不可见。
  en: Adversaries have a packet filter use one special header field magic value or payload pattern to trigger traffic
    diversion or hidden functionality while the real port remains invisible.
aliases: []
parent_ref: NJT-0120
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 内容模式数据包激活是攻击者让用户态抓包器、raw socket、内核 WFP/BPF 过滤器或设备植入检查单个数据包的头字段、序列关系、魔数或载荷模式，命中后把流量转向隐藏 socket、执行命令或建立控制通道。直接目的在于借任意正常端口承载信号而不暴露真实监听；稳定变量是一个数据包的内容/字段匹配，不是协议或过滤产品。
    en: Content-Pattern Packet Activation is an evasion sub-technique in which an adversary has a user-space sniffer,
      raw socket, kernel WFP or BPF filter, or device implant inspect one packet's header fields, sequence relationship,
      magic value, or payload pattern and divert traffic to a hidden socket, execute a command, or establish a control
      channel on a match. Its immediate purpose is to carry the signal through any ordinary port without exposing the
      real listener. The stable variable is content or field matching in one packet rather than protocol or filter product.
stealth_characteristics:
  paragraphs:
  - zh: 内容模式数据包激活使外部流量看似发往正常开放端口，标准端口与进程映射不显示后门真实 socket。非匹配包继续走正常服务或被丢弃，降低持续监听特征。特殊字段、魔数、异常响应、过滤对象、重定向目标和后继命令仍可观察；完整包解析与过滤器清单会限制效果。
    en: Content-Pattern Packet Activation makes external traffic appear destined for an ordinary open port while standard
      port-to-process mapping omits the real backdoor socket. Nonmatching packets continue to the normal service or are
      dropped, reducing continuous-listener features. Special fields, magic values, anomalous responses, filter objects,
      diversion targets, and successor commands remain observable. Full-packet parsing and filter inventory constrain
      the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入单个包的字段或内容足以使隐藏功能从不可用转为可用，并能连接过滤器命中、目标 socket/进程与后继会话的行为。普通应用协议、漏洞利用包、IDS 签名、负载均衡和持续开放服务是反例。必须累计多包顺序才匹配时归 NJS-0120-001；仅隐藏现有端口而无信号激活归
      NJT-0116。
    en: Scope includes behavior where one packet's field or content is sufficient to transition hidden functionality
      from unavailable to available and can be joined to filter match, target socket or process, and successor session.
      Ordinary application protocols, exploit packets, IDS signatures, load balancing, and continuously open services
      are counterexamples. Matching that requires an accumulated multipacket order belongs to NJS-0120-001, while merely
      hiding an existing port without signal activation belongs to NJT-0116.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 路由器植入可监视 TCP SYN 的序列/确认号和选项，匹配后接受命令；内核驱动可检查任意开放端口上的固定 magic value 并把流量重定向至隐藏随机端口。SYNful Knock 与 SprySOCKS 分别直接证明两类实现。
      en: A router implant can watch TCP SYN sequence and acknowledgment values and options and accept commands after
        a match. A kernel driver can inspect a fixed magic value on any open port and divert traffic to a hidden random
        port. SYNful Knock and SprySOCKS directly establish the two implementations.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需在服务前路径看到包内容、保持解析与内核版本兼容并知道魔数/字段，且让操作者准确构造数据包。加密、分片、规范化和中间件可能改变内容；固定模式泄露后易被重放和签名检测。
        en: The adversary needs visibility into packet content before service handling, parser and kernel-version compatibility,
          knowledge of the magic pattern or field, and an operator able to craft packets accurately. Encryption, fragmentation,
          normalization, and middleboxes can alter content. Once leaked, a fixed pattern is easy to replay and sign.
    defender_model:
      paragraphs:
      - zh: 防守方可保留包头与载荷摘要、响应字段、WFP/BPF/socket filter、重定向元数据、真实监听和进程，以及后继会话。TLS 与硬件卸载、边界丢弃、内核过滤器未清点或只保存流记录时形成盲区。
        en: Defenders can retain packet headers and payload digests, response fields, WFP, BPF, or socket filters, diversion
          metadata, real listeners and processes, and successor sessions. TLS and hardware offload, edge dropping, uninventoried
          kernel filters, or flow-only retention create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 单包内容匹配把真实 socket 隔离在正常端口流量之后
    en: One-packet content matching isolates the real socket behind ordinary-port traffic
  analysis:
    paragraphs:
    - zh: 攻击者在正常服务之前匹配隐藏信号并重定向流量，外部与标准主机视图只看到合法端口，真实后门功能跨过滤边界才出现，形成行为透明。包内容、过滤器和目标 socket 关联可以恢复隐藏路径。
      en: The adversary matches a hidden signal before normal service handling and diverts traffic, leaving external
        and standard host views with only a legitimate port. Real backdoor functionality appears only across the filter
        boundary, producing Behavioral Transparency. Correlating packet content, filter, and target socket restores the
        hidden path.
