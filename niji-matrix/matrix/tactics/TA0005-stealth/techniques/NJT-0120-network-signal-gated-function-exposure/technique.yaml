research:
  limitations:
    paragraphs:
    - zh: ATT&CK 直接支持端口序列与 socket filter，SYNful Knock 和 SprySOCKS 进一步直接证明特殊 TCP 字段与内核内容过滤激活，因此父行为和二分边界为高置信。有状态序列的具体窗口依赖实现，单包内容在加密或中间件规范化后可能不可见；归因必须连续连接信号、主机状态转变和后继会话，不能从稀有包或未知过滤器单独推断。
      en: ATT&CK directly supports port sequences and socket filters, while SYNful Knock and SprySOCKS directly establish
        special TCP fields and kernel content-filter activation, giving high confidence to the parent behavior and two-way
        boundary. Concrete windows for stateful sequences depend on implementation, and single-packet content can become
        invisible after encryption or middlebox normalization. Attribution must continuously join signal, host-state
        transition, and successor session and cannot be inferred from a rare packet or unknown filter alone.
    - zh: 公开 Persistence 证据对内容模式入口最强：SYNful Knock 明确跨重启，REPTILE 明确具有启动加载与专用包激活。有状态序列的 cd00r 资料只直接证明顺序打开 root shell，没有证明 matcher 跨重启存续；因此 NJS-0120-001 的 TA0003 使用必须另证持久载体、重载和后继恢复，不能由 Port Knocking 名称自动推断。
      en: Public Persistence evidence is strongest for content-pattern entry. SYNful Knock explicitly survives reboot and REPTILE has explicit startup loading plus specialized-packet activation. Existing cd00r material directly establishes an ordered sequence opening a root shell but not survival of its matcher across reboot. TA0003 use of NJS-0120-001 therefore requires separate durable-carrier reload and successor-restoration evidence and cannot be inferred from the Port Knocking label.
