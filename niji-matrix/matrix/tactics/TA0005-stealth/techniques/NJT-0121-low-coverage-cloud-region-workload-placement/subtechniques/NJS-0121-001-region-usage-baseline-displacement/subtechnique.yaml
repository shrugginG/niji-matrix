schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0121-001
name: {zh: 区域使用基线外放置, en: Region-Usage Baseline Displacement}
summary: {zh: 攻击者在组织历史未使用、未经批准或与主体常规地域不同的区域创建或调用资源，使活动脱离区域使用基线。, en: Adversaries create or invoke resources in a Region that is historically unused unapproved or different from a principal's normal geography so activity leaves the regional usage baseline.}
aliases: []
parent_ref: NJT-0121
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 区域使用基线外放置是攻击者用有效云主体在组织历史为空、未获批准或该主体从未使用的地域创建、启动或调用云资源。直接目的在于让真实 API 与资源落到资产、owner、成本和行为基线之外；稳定变量是主体/组织历史与请求区域的差分，而不是云厂商、区域名或资源类型。
    en: Region-Usage Baseline Displacement is an evasion sub-technique in which an adversary uses a valid cloud principal to create, start, or invoke a cloud resource in a geography that is historically empty for the organization, unapproved, or never used by that principal. Its immediate purpose is to place real APIs and resources outside asset, owner, cost, and behavior baselines. The stable variable is the differential between principal or organizational history and requested Region rather than provider, Region name, or resource type.
stealth_characteristics:
  paragraphs:
  - zh: 区域使用基线外放置使按常用区域查询的资产清单、告警和威胁狩猎遗漏资源，首次费用可能延迟出现。资源仍保留 IAM 主体、请求 endpoint、region 字段、全局 API、账单和跨区域网络痕迹；全区域资产与 first-use 检测会限制效果，即使区域安全控制本身完整。
    en: Region-Usage Baseline Displacement causes asset inventories, alerts, and threat hunts scoped to common Regions to omit resources, while first charges can appear late. The resource still retains IAM principal, requested endpoint, Region field, global API, billing, and cross-Region network traces. All-Region assets and first-use detection constrain the effect even when regional security controls themselves are complete.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入区域与主体/组织历史或批准清单不一致、攻击者在该处产生资源或服务活动且连接恶意结果的行为。合法灾备、首次上线、全球扩展、容量突发和有 owner 的临时测试是反例。区域已有正常使用但安全服务较弱归 NJS-0121-002；仅从异常地理登录而不产生区域资源结果归身份异常。
    en: Scope includes a Region inconsistent with principal or organizational history or the approved list where the adversary produces resource or service activity connected to a malicious outcome. Legitimate disaster recovery, first rollout, global expansion, burst capacity, and owner-bound temporary testing are counterexamples. A Region with normal use but weaker security services belongs to NJS-0121-002. An anomalous geographic sign-in without a regional-resource outcome remains an identity anomaly.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 失陷角色可在历史空白区域创建 GPU 实例挖矿、存储桶暂存、函数或网络基础设施，或把同一会话从常用区域转向次区域调用托管服务。全局控制面和成本记录仍能连接主体与首次区域使用。
      en: A compromised role can create GPU instances for mining, staging buckets, functions, or networking infrastructure in a historically empty Region or move one session from a common Region to a secondary Region to invoke a managed service. Global control-plane and cost records can still connect the principal to first Region use.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需跨区域权限、配额和 endpoint 访问，并知道或探测批准区域。SCP、region deny、数据驻留和服务不可用会阻断；DescribeRegions、失败调用与首次资源会留下信号。
        en: The adversary needs cross-Region authority, quota, and endpoint access and knowledge or probing of approved Regions. SCPs, Region deny, data residency, and unavailable services block the path. DescribeRegions, failed calls, and first resources leave signals.
    defender_model:
      paragraphs:
      - zh: 防守方可从组织与账户 API、IAM 会话、区域字段、全局资产、账单、DNS/endpoint 和网络取得视图，并维护按主体、业务和服务的区域历史。跨账户不可见、账单延迟或只查询常用区域时形成盲区；批准新区域需要 owner 与到期。
        en: Defenders can use organization and account APIs, IAM sessions, Region fields, global assets, billing, DNS or endpoints, and networking and maintain regional history by principal, business, and service. Cross-account invisibility, billing delay, or common-Region-only queries create blind spots. New approved Regions require owner and expiry.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 首次或未批准区域把资源移出组织常用观察范围, en: First-use or unapproved Regions move resources outside common organizational observation}
  analysis:
    paragraphs:
    - zh: 攻击者把工作负载放到防守流程未纳入日常查询的区域，痕迹从常用区域清单转移到被忽略的全局 API 和账单。局部监控看不到资源，形成行为透明；全局资产与首次使用关联可恢复活动。
      en: The adversary places a workload in a Region omitted from routine defensive queries, moving traces from common-Region inventories to ignored global APIs and billing. Local monitoring misses the resource, producing Behavioral Transparency. Global assets and first-use correlation recover activity.
  evidence_refs: [REF-000409, REF-000442]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000118]}, mitigations: {coverage: available, mitigation_refs: [MIT-000119]}}
evidence: {claim_refs: [CLM-000653], case_refs: [], reference_refs: [REF-000409, REF-000442]}
research:
  limitations:
    paragraphs:
    - zh: ATT&CK 与 AWS 场景直接支持区域跳转和历史差分，但 AWS 材料是调查范式而非独立归因事件。本项需用组织自身历史证明“首次/未批准”，不能把一个少见区域自动视为恶意；新业务上线会改变基线。
      en: ATT&CK and the AWS scenario directly support Region hopping and historical differentials, but the AWS material is an investigation pattern rather than an independently attributed incident. This child requires the organization's own history to establish first or unapproved use and cannot treat one rare Region as malicious automatically. New business rollout changes the baseline.
