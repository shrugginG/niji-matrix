schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0121-002
name: {zh: 区域控制覆盖不对称, en: Region-Control Coverage Asymmetry}
summary: {zh: 攻击者选择日志、安全服务、策略、网络传感器或响应权限弱于常用地域的区域，即使该区域已有合法资源。, en: Adversaries select a Region with weaker logging security services policy network sensors or responder authority than common geographies even when legitimate resources already exist there.}
aliases: []
parent_ref: NJT-0121
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 区域控制覆盖不对称是攻击者把云资源或服务调用放到安全控制部署弱于其他区域的地域，例如 trail、配置审计、威胁检测、网络流量、策略或隔离权限未启用/不支持。直接目的在于让同类活动在次区域产生更少检测与响应痕迹；稳定变量是区域间控制能力差分，而不是区域是否完全未使用。
    en: Region-Control Coverage Asymmetry is an evasion sub-technique in which an adversary places cloud resources or service calls in a geography where security-control deployment is weaker than in other Regions, such as absent or unsupported trails, configuration audit, threat detection, network flow, policy, or isolation authority. Its immediate purpose is to make equivalent activity produce fewer detection and response traces in the secondary Region. The stable variable is a control-capability differential across Regions rather than whether the Region is entirely unused.
stealth_characteristics:
  paragraphs:
  - zh: 区域控制覆盖不对称让真实 API 可能存在于全局日志，却缺少区域网络、配置或威胁检测上下文，响应团队也可能无法枚举和隔离。区域控制清单、日志健康、服务 enablement、策略差异和同一主体跨区域结果仍可观察；全区域统一控制会消除收益。
    en: Region-Control Coverage Asymmetry can leave real APIs in global logs while omitting regional network, configuration, or threat-detection context, and responders may be unable to enumerate or isolate. Regional control inventories, log health, service enablement, policy differences, and cross-Region outcomes for the same principal remain observable. Uniform controls across every Region remove the benefit.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者选择控制覆盖较弱区域、在该处产生恶意资源或调用、且相较批准基线确实缺少检测或响应能力的行为。仅区域服务功能差异、成本优化或合法限制不是本项。首次/未批准区域但控制完整归 NJS-0121-001；攻击者主动关闭安全服务另归防御削弱。
    en: Scope includes adversary selection of a Region with weaker control coverage, malicious resources or calls there, and an actual detection or response capability missing relative to the approved baseline. Service-feature differences, cost optimization, or legitimate restrictions alone do not qualify. A first-use or unapproved Region with complete controls belongs to NJS-0121-001. Active disabling of security services belongs to Defense Impairment.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 同一云角色可从主区域转到未启用威胁检测或响应权限不足的次区域，调用 AI、计算或存储服务；AWS 调查示例要求比较 us-east-1 与 us-east-2 的监控和访问控制，并把不一致视为活动漏检原因。
      en: The same cloud role can move from a primary Region to a secondary Region lacking threat detection or responder authority and invoke AI, compute, or storage services. The AWS investigation example requires comparison of monitoring and access controls between us-east-1 and us-east-2 and treats inconsistency as a reason activity can slip past detection.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需知道或探测各区域安全服务和策略状态并有权限调用目标服务。统一 landing zone、自动 enablement 和全局 deny 会限制；探测控制状态、失败调用和区域跳转会留下可关联事件。
        en: The adversary needs knowledge or probing of security-service and policy state by Region and authority to invoke the target service. Uniform landing zones, automatic enablement, and global deny constrain the path. Control-state probes, failed calls, and Region hops leave correlatable events.
    defender_model:
      paragraphs:
      - zh: 防守方可维护逐区域日志、配置、检测服务、网络与响应权限矩阵，并连接主体、服务和结果。服务支持差异、跨分区控制面和区域响应权限缺失会形成盲区；全局告警必须验证实际区域数据是否到达。
        en: Defenders can maintain a Region-by-Region matrix of logging, configuration, detection services, networking, and responder authority and join it to principal, service, and outcome. Service-support differences, cross-partition control planes, and missing regional responder authority create blind spots. Global alerts must verify that regional data actually arrives.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 区域控制缺口把活动结果隔离在统一检测与响应之外, en: Regional control gaps isolate activity outcomes from unified detection and response}
  analysis:
    paragraphs:
    - zh: 攻击者选择控制较弱地域，使同类 API 缺少网络、配置或威胁检测痕迹，响应链也无法到达。活动跨越区域控制边界后在中央观察中不完整，形成行为透明；控制覆盖矩阵和日志健康可揭示缺口。
      en: The adversary selects a less-controlled geography so equivalent APIs lack network, configuration, or threat-detection traces and the response chain cannot reach them. Activity crossing the regional control boundary is incomplete in central observation, producing Behavioral Transparency. A control-coverage matrix and log-health checks reveal the gap.
  evidence_refs: [REF-000409, REF-000442]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000118]}, mitigations: {coverage: available, mitigation_refs: [MIT-000119]}}
evidence: {claim_refs: [CLM-000654], case_refs: [], reference_refs: [REF-000409, REF-000442]}
research:
  limitations:
    paragraphs:
    - zh: AWS 与 ATT&CK 直接支持区域控制不一致，但不同 provider 和服务的“全局”日志含义不同。缺少某项控制不证明攻击者有意选择该区域，必须连接区域跳转、主体活动与恶意结果；合法区域限制也可能造成不对称。
      en: AWS and ATT&CK directly support regional control inconsistency, but the meaning of global logging differs across providers and services. A missing control does not prove deliberate Region selection and must connect to Region hopping, principal activity, and malicious outcome. Legitimate regional restrictions can also create asymmetry.
