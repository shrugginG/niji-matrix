schema_version: 2.0.0
type: technique
id: NJT-0121
name:
  zh: 低覆盖云区域工作负载放置
  en: Low-Coverage Cloud-Region Workload Placement
summary:
  zh: 攻击者在组织未使用或监控不足的云区域创建资源，使活动落在基线、告警和响应覆盖之外。
  en: Adversaries create resources in a cloud region unused or poorly monitored by the organization so activity falls outside
    baseline, alerting, and response coverage.
aliases:
- Unused or Unsupported Cloud Regions
- T1535
classification:
  tactic_refs:
  - TA0005
  origin:
    kind: attack-adapted
    source_attack_id: T1535
    source_attack_version: '19.1'
  decision_ref: DEC-TA0005-T1535
definition_and_concept:
  paragraphs:
  - zh: 低覆盖云区域工作负载放置是攻击者使用已取得的云身份，在组织历史未使用、未经批准或日志、安全服务、网络传感器与响应权限弱于常用区域的地域创建或调用计算、存储、网络、AI 或其他云资源。直接目的在于把恶意活动移出组织已有的区域使用基线或控制覆盖，而不是一般多区域部署。
    en: Low-Coverage Cloud-Region Workload Placement is adversary use of an acquired cloud identity to create or invoke compute, storage, networking, AI, or another cloud resource in a geography that the organization has not historically used, has not approved, or covers with weaker logging, security services, network sensors, or responder authority than common Regions. Its immediate purpose is to move malicious activity outside the organization's established regional usage baseline or control coverage rather than deploy a multiregion service generally.
  - zh: 概念锚是同一组织/账户中的主体、区域选择、资源或 API 活动、区域历史与控制状态以及后继结果。区域名称、云厂商和服务类型只是实现；一个区域可以“首次使用但控制完整”，也可以“已有少量合法资源但安全控制较弱”，两种观察差异需要分开处理。
    en: The conceptual anchor is a principal within one organization or account, Region selection, resource or API activity, regional history and control state, and successor outcome. Region name, cloud provider, and service type are implementations. One Region can be first-use but fully controlled, while another has some legitimate resources yet weaker security controls; the two observation differentials require separate treatment.
stealth_characteristics:
  paragraphs:
  - zh: 低覆盖云区域工作负载放置保留真实、经认证的云 API 与资源对象，却利用防守查询和告警通常只关注批准区域的习惯。首次区域使用使资源脱离正常地理分布、owner 与成本基线；区域控制覆盖不对称则让相同 API 在次区域缺少 GuardDuty/Defender、配置规则、VPC 流量、集中响应或等价安全能力，即使该区域并非完全空白。
    en: Low-Coverage Cloud-Region Workload Placement retains real, authenticated cloud APIs and resource objects while exploiting defensive queries and alerts that normally focus on approved Regions. First Region use removes a resource from normal geographic distribution, owner, and cost baselines. Region-control asymmetry leaves the same API without GuardDuty or Defender, configuration rules, VPC flow, centralized response, or equivalent security capability in a secondary Region even when that Region is not entirely empty.
  - zh: 组织级控制面、跨区域审计、全局资产清单、计费、IAM 会话、服务 endpoint、跨区域网络和服务调用结果仍可观察。区域允许策略、全区域 trail 与配置、安全服务自动启用和统一响应权限会限制效果；全局 API 不覆盖某些区域服务或账单延迟时仍存在盲区。
    en: Organization-level control planes, cross-Region audit, global asset inventory, billing, IAM sessions, service endpoints, cross-Region networking, and service-call outcomes remain observable. Region-allow policies, all-Region trails and configuration, automatic security-service enablement, and unified responder authority constrain the effect. Blind spots remain when global APIs omit some regional services or billing is delayed.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意选择与主体历史、组织批准或安全覆盖不一致的区域，并在那里创建、启动或调用恶意资源/服务产生后继活动的行为。判定需要主体与会话、请求区域、资源、区域基线或控制缺口以及结果形成链条，不能只凭区域稀有或一个新实例定性。
    en: Scope includes deliberate adversary selection of a Region inconsistent with principal history, organizational approval, or security coverage and creation, start, or invocation of a malicious resource or service there with successor activity. Classification requires a chain among principal and session, requested Region, resource, regional baseline or control gap, and outcome. Region rarity or one new instance alone is insufficient.
  - zh: 合法灾备、故障转移、全球扩展、合规迁移、供应商测试、容量突发与新服务上线是反例。历史/批准区域差分归 NJS-0121-001，安全能力与响应覆盖差分归 NJS-0121-002；凭据如何获得、资源本身的恶意用途和跨账户迁移另由相邻技术处理。
    en: Legitimate disaster recovery, failover, global expansion, compliance migration, vendor testing, burst capacity, and new-service rollout are counterexamples. A historical or approved Region differential belongs to NJS-0121-001, while a security-capability or responder-coverage differential belongs to NJS-0121-002. How credentials were obtained, the resource's malicious function itself, and cross-account movement belong to adjacent techniques.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得云角色后可枚举区域与服务，在历史空白地域创建 GPU 实例挖矿、存储桶暂存数据、网络或函数建立基础设施；也可把同一会话从常用区域移向次区域，调用在该处监控或访问控制更弱的托管服务。AWS CloudTrail 调查示例把从 us-east-1 到 us-east-2 的 Bedrock 活动识别为有意区域跳转，并要求比较两地控制。
      en: After acquiring a cloud role, an adversary can enumerate Regions and services and create GPU instances for mining, buckets for staging, networking, or functions in a historically empty geography. The same session can also move from a common Region to a secondary Region and invoke a managed service with weaker monitoring or access controls there. An AWS CloudTrail investigation identifies Bedrock activity moving from us-east-1 to us-east-2 as intentional Region hopping and requires comparison of controls between the two.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可跨区域创建或调用目标服务的权限、有效配额与 endpoint 访问，并了解或试探组织的批准区域和安全服务部署。区域枚举、失败策略调用和 first-use API 会留下侦察信号；SCP/组织策略、服务可用性、数据驻留与配额限制可能阻断。若所有区域统一记录和响应，选择次区域不再带来隐匿收益。
        en: The adversary needs authority to create or invoke the target service across Regions, available quota, endpoint access, and knowledge or probing of organizational approved Regions and security-service deployment. Region enumeration, failed policy calls, and first-use APIs leave reconnaissance signals. SCP or organization policy, service availability, data residency, and quota limits can block the behavior. If every Region is logged and responded to uniformly, selecting a secondary Region no longer provides a stealth benefit.
    defender_model:
      paragraphs:
      - zh: 防守方可观察组织与账户级 IAM 会话、请求 endpoint/region、全局和区域 API、资源清单、账单、配置规则、安全服务、网络流与响应权限，并维护按主体、业务、服务和时间的区域基线。只查询常用区域、trail 未覆盖新区域、安全服务需逐区启用、跨账户资产不可见或响应团队缺少该区域权限时形成盲区；合法全球业务需 owner、用途和到期记录。
        en: Defenders can observe organization- and account-level IAM sessions, requested endpoints and Regions, global and regional APIs, resource inventory, billing, configuration rules, security services, network flow, and responder authority and maintain regional baselines by principal, business, service, and time. Blind spots arise when queries cover common Regions only, trails omit a new Region, security services require per-Region enablement, cross-account assets are invisible, or responders lack regional authority. Legitimate global business requires owner, purpose, and expiry records.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 区域边界把资源置于组织监控覆盖之外
    en: The region boundary places resources outside organizational monitoring coverage
  analysis:
    paragraphs:
    - zh: 攻击者把资源放到低覆盖区域，痕迹从常用区域资产与网络视图转移到全局 API、账单和遗漏的区域日志；防守方无法在既有观察边界关联活动，形成行为透明。
      en: The adversary places resources in a low-coverage region, moving traces from common-region asset and network views
        to global APIs, billing, and missing regional logs. Defenders cannot correlate activity within the existing observation
        boundary, producing Behavioral Transparency.
  evidence_refs:
  - REF-000409
  - REF-000442
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 子技术按攻击者利用的区域差分划分。NJS-0121-001“区域使用基线外放置”选择历史未使用、未批准或与主体常规地域不同的区域，需要全局资产、主体历史、首次使用与账单基线；NJS-0121-002“区域控制覆盖不对称”选择日志、安全服务、网络传感器、策略或响应权限较弱的区域，需要逐区域控制清单与活动结果比较，即使该区域已有合法资源也成立。
      en: Children are divided by the regional differential exploited by the adversary. NJS-0121-001 Region-Usage Baseline Displacement selects a Region that is historically unused, unapproved, or different from the principal's normal geography and requires global assets, principal history, first use, and billing baselines. NJS-0121-002 Region-Control Coverage Asymmetry selects a Region with weaker logging, security services, network sensors, policy, or responder authority and requires Region-by-Region control inventory and activity-outcome comparison even when the Region already has legitimate resources.
    - zh: 云厂商、region 名称、计算/存储/AI 服务和资源类型只是实现。两项常组合但不可互换：允许新区域可以消除使用稀有性，却不保证安全覆盖；统一安全服务可以缩小控制差异，却不使未批准区域的首次资源变为正常。
      en: Cloud provider, Region name, compute, storage, or AI service, and resource type are implementations. The two children often combine but are non-interchangeable. Approving a new Region removes usage rarity but does not guarantee security coverage, while uniform security services reduce control asymmetry but do not make first resources in an unapproved Region normal.
