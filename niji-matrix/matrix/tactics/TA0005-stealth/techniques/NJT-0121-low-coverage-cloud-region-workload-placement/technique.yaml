research:
  limitations:
    paragraphs:
    - zh: ATT&CK 明确区分未使用区域与不支持高级检测服务的区域，AWS 调查指南进一步把区域跳转、主体历史和控制不一致连接到后继服务滥用，因此父行为和二分边界为高置信。AWS 场景是事件响应教学与调查范式，不作为独立在野 Case；不同云的全局/区域 API、分区、服务可用性和账单时延仍需逐平台验证，必须证明区域选择与恶意结果而非普通全球运营相连。
      en: ATT&CK explicitly distinguishes unused Regions from Regions lacking advanced detection services, and the AWS investigation guide further joins Region hopping, principal history, and control inconsistency to successor service misuse, giving high confidence to the parent behavior and two-way boundary. The AWS scenario is an incident-response teaching and investigation pattern and is not recorded as an independent field Case. Global and regional APIs, partitions, service availability, and billing delay still require provider-specific validation, and Region selection must connect to malicious outcome rather than ordinary global operations.
