schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0122-001
name: {zh: 系统指纹分析环境判别, en: System-Fingerprint Analysis Classification}
summary: {zh: 攻击者用虚拟硬件、驱动、进程、文件或分析产品工件判断本地环境，并在疑似沙箱时隐藏核心行为。, en: Adversaries use virtual hardware drivers processes files or analysis-product artifacts to classify the local environment and hide core behavior when a sandbox is suspected.}
aliases: []
parent_ref: NJT-0122
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 系统指纹分析环境判别是攻击者采集硬件型号、虚拟设备、固件、驱动、MAC/OUI、进程、服务、文件、Registry 或已知分析产品工件，形成是否为 VM/沙箱的本地分类，并用结果控制退出、诱饵或载荷释放。直接目的在于让具有可识别系统指纹的分析环境看不到核心路径；稳定变量是系统特征组合而非某个 VM 产品或 API。
    en: System-Fingerprint Analysis Classification is an evasion sub-technique in which an adversary collects hardware models, virtual devices, firmware, drivers, MAC or OUI, processes, services, files, Registry, or known analysis-product artifacts, classifies the local host as a VM or sandbox, and uses the result to control exit, decoy, or payload release. Its immediate purpose is to prevent an analysis environment with recognizable system fingerprints from seeing the core path. The stable variable is a combination of system features rather than one VM product or API.
stealth_characteristics:
  paragraphs:
  - zh: 系统指纹分析环境判别使样本在标准化 VM 镜像、固定工具集或分析服务进程存在时提前退出，而在真实或仿真充分的环境继续。查询序列、特征组合、分支和环境间载荷差分仍可观察；多样化模板、裸机对照与逐变量修改会限制效果。真实企业虚拟化会产生大量相似信号。
    en: System-Fingerprint Analysis Classification causes a sample to exit early in standardized VM images, fixed toolsets, or the presence of analysis-service processes while continuing in real or sufficiently emulated environments. Query sequences, feature combinations, branches, and cross-environment payload differentials remain observable. Diverse templates, bare-metal controls, and one-variable changes constrain the effect. Real enterprise virtualization produces many similar signals.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入本地系统工件被用于分析环境判断且实际改变后继核心行为的情形。合法许可、硬件兼容、性能优化、虚拟化支持和普通系统发现是反例。用户交互充分性归 NJS-0122-002，时钟与运行时间归 NJS-0122-003；调试器专用检查归 NJT-0106。
    en: Scope includes local system artifacts used to judge an analysis environment where the judgment actually changes core successor behavior. Legitimate licensing, hardware compatibility, performance optimization, virtualization support, and ordinary system discovery are counterexamples. User-interaction sufficiency belongs to NJS-0122-002, clocks and uptime to NJS-0122-003, and debugger-specific checks to NJT-0106.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Dropper 可检查 VMware 设备、Cuckoo 文件或进程、CPU/内存规模和安全工具，只在未命中时释放下一阶段。IRONGATE 的部分 dropper 在 VMware 或 Cuckoo 环境中不运行，直接说明指纹到结果的分支。
      en: A dropper can check VMware devices, Cuckoo files or processes, CPU or memory scale, and security tools and release its next stage only when no match exists. Some IRONGATE droppers did not run in VMware or Cuckoo environments, directly establishing a fingerprint-to-outcome branch.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需了解沙箱模板并组合低误判工件；产品更新、企业 VM 和不同硬件会使列表漂移，过宽判断损失真实目标。多项查询和硬编码哈希也形成可检测指纹。
        en: The adversary needs knowledge of sandbox templates and a low-false-assessment artifact combination. Product updates, enterprise VMs, and different hardware cause drift, and overbroad classification loses real targets. Multiple queries and hard-coded hashes also form detectable fingerprints.
    defender_model:
      paragraphs:
      - zh: 防守方可记录系统查询、被访问工件、环境配置、分支和载荷阶段，并在裸机、不同 VM 与移除特征的环境重执行。仅一个固定模板、查询未插桩或样本使用目标专属特征时形成盲区。
        en: Defenders can record system queries, accessed artifacts, environment configuration, branches, and payload stages and rerun across bare metal, different VMs, and feature-removed environments. One fixed template, uninstrumented queries, or target-specific features create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 系统指纹判断把核心路径门控在可识别沙箱之外, en: System-fingerprint judgment gates the core path outside recognizable sandboxes}
  analysis:
    paragraphs:
    - zh: 攻击者用系统工件把环境映射为分析类并走退出分支，沙箱痕迹只剩查询与诱饵而缺少真实载荷。核心行为跨条件边界不可见，形成行为透明；特征变体实验可恢复因果。
      en: The adversary maps the environment to an analysis class through system artifacts and takes an exit branch, leaving the sandbox with queries and decoys but no real payload. Core behavior is invisible across the condition boundary, producing Behavioral Transparency. Feature-variant experiments restore causality.
  evidence_refs: [REF-000410, REF-000443, REF-000444]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000119]}, mitigations: {coverage: available, mitigation_refs: [MIT-000120]}}
evidence: {claim_refs: [CLM-000655], case_refs: [CASE-000164], reference_refs: [REF-000410, REF-000443, REF-000444]}
research:
  limitations:
    paragraphs:
    - zh: IRONGATE 直接证明 VMware/Cuckoo 门控但可能是测试或 PoC，不能作为在野归因；真实企业 VM 和分析环境特征重叠。必须观察分支后结果差分，不能从一个 VM 查询推断恶意。
      en: IRONGATE directly establishes VMware or Cuckoo gating but may be a test or proof of concept and cannot support field attribution. Real enterprise VMs and analysis environments overlap in features. A post-branch outcome differential is required, and one VM query cannot establish malice.
