research:
  limitations:
    paragraphs:
    - zh: Upatre支持报告样本的比较、早退与修改后继续，不证明所有版本、准确率或通用阈值。DWORD回绕可使长寿命系统出现小值，真实启动也会如此。REF-000443的timer/RDTSC等待例子只证明延迟，不证明多时钟比较后判定时间造假。实验还需排除插桩、外部响应和预算差异，本研究未运行恶意样本。
      en: Upatre establishes comparison, exit, and changed-return continuation for the reported sample, not every version,
        accuracy, or universal threshold. DWORD wrap can produce small values on long-running systems, as can real boot. REF-000443
        timer/RDTSC waits establish delay, not a multiclock comparison judging fabricated time. Experiments must exclude instrumentation,
        external-response, and budget differences. No malware was executed in this research.
