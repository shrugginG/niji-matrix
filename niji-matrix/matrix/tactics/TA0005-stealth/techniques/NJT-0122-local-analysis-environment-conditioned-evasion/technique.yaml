research:
  limitations:
    paragraphs:
    - zh: ATT&CK 和 Unit 42 分别支持三类检查与不同沙箱对策，IRONGATE 与 Upatre 直接证明系统指纹和时间证据控制退出，因此父行为与三分边界为高置信。IRONGATE 可能是测试/PoC 且无法归因，只证明行为；人类活动项主要由 WildFire 多家族观察与实验支持，具体活动意图需在样本级确认。所有映射都必须观察检查后的核心结果差分，不能从 VM API、鼠标读取或 sleep 单独推断。
      en: ATT&CK and Unit 42 support the three check classes and their different sandbox countermeasures, while IRONGATE and Upatre directly establish system-fingerprint and timing evidence controlling exit, giving high confidence to the parent behavior and three-way boundary. IRONGATE may be a test or proof of concept and cannot be attributed, so it establishes behavior only. The human-activity child is supported mainly by WildFire observations across malware families and experiments, and concrete intent requires sample-level confirmation. Every mapping must observe a core-outcome differential after the check and cannot be inferred from a VM API, mouse read, or sleep alone.
