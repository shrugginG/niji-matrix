schema_version: 1.1.0
type: technique-decision
id: DEC-TA0006-T1003
tactic_ref: TA0006
candidate:
  source_type: attack
  source_attack_id: T1003
  source_attack_version: '19.1'
  name_en: OS Credential Dumping
  name_zh: 操作系统凭据转储
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1003 明确属于 Credential Access，并覆盖从操作系统缓存、内存、目录数据库和账户结构中取得口令、散列、密钥或等价认证材料，因此父候选应保留。但固定父项的八个子技术主要按
  Windows 组件、Linux 路径、目录服务方法和存储位置划分，混合了材料位置、读取协议、活动或离线状态以及后继破解；这些名称不能直接复制成 Niji 子项。建议适配为操作系统认证材料提取：攻击者跨越操作系统认证权威、受保护存储或目录复制权限，实际读出并保存可用于验证、票据构造或后继认证的材料。能力、权限、对象打开、材料复制、解锁或恢复和后继使用必须分层。
  第一轮逐项覆盖八个 ATT&CK 子项后，第二轮丢弃 LSASS、SAM、NTDS、LSA、DCSync、proc 和 shadow 等名称，从读取主体、活动状态、存储视图、控制面、审计归属与输出重新聚类。正式建议三项跨实现变量：攻击者把读取迁入本来就可接近认证材料的可信进程或角色，改变
  reader provenance；攻击者使用快照、备份或原始派生视图取出非活动认证存储，改变活动对象审计；攻击者借合法目录复制协议让域控制器导出秘密，改变文件或进程读取为复制事务。普通高权进程直接读活动存储是父级核心，运行态对静态位置本身只是材料状态，不单独成为
  NJS。
rationale_en: 'ATT&CK Enterprise 19.1 places T1003 in Credential Access and covers obtaining passwords, hashes, keys, or equivalent
  authentication material from operating-system caches, memory, directory databases, and account structures, so the parent
  candidate should be retained. Its eight fixed children are primarily divided by Windows component, Linux path, directory-service
  method, and storage location, mixing material location, read protocol, live or offline state, and later cracking. Those
  names cannot be copied into Niji children. Adapt the parent as Operating-System Authentication-Material Extraction: the
  adversary crosses operating-system authentication authority, protected storage, or directory-replication rights and actually
  reads and preserves material usable for verification, ticket construction, or later authentication. Capability, authority,
  object open, material copy, unlock or recovery, and later use remain separate stages. After the first pass covered all eight
  ATT&CK children, the second discarded names such as LSASS, SAM, NTDS, LSA, DCSync, proc, and shadow and reclustered by reader,
  live state, storage view, control plane, audit ownership, and output. Three cross-implementation variables remain formal
  candidates. The adversary can move reading into a trusted process or role already expected near authentication material,
  changing reader provenance; use a snapshot, backup, or raw-derived view to remove an inactive authentication store, changing
  live-object audit; or use legitimate directory replication so a domain controller exports secrets, replacing file or process
  reads with a replication transaction. Direct high-authority reading of a live store remains parent core, and runtime versus
  static location alone is material state rather than an NJS boundary.'
scope_notes_zh: 固定八项 ATT&CK 子技术仅用于广度覆盖，第二轮按 reader、非活动视图和目录复制导出重聚类。
scope_notes_en: The eight fixed ATT&CK children provide breadth coverage only; a second pass reclusters by reader, inactive
  view, and directory-replication export.
gap_statement_zh: TA0006 需要表达 OS 认证材料实际输出及观察面变化，不能按平台、文件或组件名称复制子项。
gap_statement_en: TA0006 requires actual OS authentication-material output and observation-plane differences without copying
  platform, file, or component labels into children.
