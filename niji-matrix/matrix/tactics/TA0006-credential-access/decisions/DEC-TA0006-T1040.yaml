decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1040 同时映射 Credential Access 与 Discovery，并把被动接口捕获、SPAN、云流量镜像和网络设备原生抓包放在同一父行为内。TA0006
  应保留“不改变通信原定目的地而观察在途数据”这一行为锚点，但把正式范围收紧为已经取得明文秘密、挑战应答、可恢复的认证交换或等价认证材料的捕获。仅看到地址、服务、版本、VLAN 或一般通信内容属于 Discovery 或 Collection
  结果；只启动抓包而未证明认证流进入观察面，则是暴露或尝试，不能宣称凭据获取完成。 直接事件证据支持这一收窄。Mandiant 在 UNC3886 入侵的 TACACS+ 服务器上恢复并分析了 LOOKOVER：该 libpcap 嗅探器筛选认证报文、使用服务器共享秘密解混淆并准备写出提取结果；但样本在写盘前发生崩溃，因此它直接证明部署、材料处理逻辑和端点观察位置，不能证明全部凭据被持久保存或使用。2025
  年 CISA 等机构联合通告直接记录国家支持行为者在受侵路由器上收集原生 PCAP，并观察到 SPAN/RSPAN/ERSPAN 镜像及指向认证流量的抓包文件；通告对具体 TACACS+ 凭据解密和后继使用仍使用推断措辞。准入置信度据此为
  medium，而不是把工具能力或镜像配置自动提升为成功凭据获取。
rationale_en: ATT&CK Enterprise 19.1 maps T1040 to both Credential Access and Discovery and places passive interface capture,
  SPAN, cloud traffic mirroring, and native network-device capture under the same parent behavior. For TA0006, preserve the
  anchor of observing data in transit without changing its intended destination, but narrow formal scope to captures that
  acquire plaintext secrets, challenge responses, recoverable authentication exchanges, or equivalent authentication material.
  Addresses, services, versions, VLANs, and general communications content are Discovery or Collection outcomes. Starting
  a capture without showing that authentication traffic entered the observation surface establishes exposure or attempt, not
  completed credential acquisition. Direct incident evidence supports this narrowing. On a TACACS+ server compromised by UNC3886,
  Mandiant recovered and analyzed LOOKOVER, a libpcap sniffer that selected authentication packets, used the server's shared
  secret to de-obfuscate them, and prepared extracted results for output. The sample crashed before completing its disk write,
  so the evidence directly establishes deployment, material-processing logic, and an endpoint observation position, but not
  durable collection or use of every credential. A 2025 joint advisory led by CISA directly documents state-sponsored actors
  collecting native PCAPs on compromised routers and observed SPAN, RSPAN, or ERSPAN mirroring and authentication-focused
  capture files. The advisory remains inferential about decryption of particular TACACS+ credentials and successor use. Admission
  is therefore medium confidence rather than treating tool capability or mirror configuration as successful credential acquisition.
scope_notes_zh: 正式范围要求原目的地不变、认证流覆盖和可恢复材料结果；三项 NJS 按端点、既有转发路径和复制观察面划分。
scope_notes_en: Formal scope requires unchanged intended destination, authentication-flow coverage, and a recoverable-material
  outcome. The three NJS divide endpoint, existing transit path, and replicated observation plane.
gap_statement_zh: TA0006 需要表达被动观察位置和凭据材料结果，不能用路径介入、Discovery 元数据或抓包能力替代。
gap_statement_en: TA0006 requires passive observation position plus credential-material outcome without substituting path
  intervention, Discovery metadata, or capture capability.
