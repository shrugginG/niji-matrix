candidate:
  source_type: attack
  source_attack_id: T1056
  source_attack_version: '19.1'
  name_en: Input Capture
  name_zh: 输入捕获
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1056 同时面向 Collection 与 Credential Access，父级把透明截获和欺骗用户输入放在同一行为中。TA0006 应保留“攻击者实际取得用户正在提交的认证输入”这一直接目标，但把正式范围收窄到可证明的口令、验证码或同类认证秘密，并要求存在攻击者可控的输入信任路径、捕获位置或消费者身份差异。只安装
  Hook、取得输入权限、显示提示框或修改登录页而未证明输入内容进入攻击者可读缓冲区，不达到完成点。 建议 adapt，而非照搬四个 ATT&CK 子项，因为键盘、GUI、Web 和 API 只是输入介质或实现位置。逐项覆盖与第二轮原生轴审查收敛出三项跨实现分类：消费者解析前输入流旁路、真实消费者内提交镜像和仿冒消费者诱导取密。窗口或页面条件门控已经由
  NJS-0132-001 拥有；缓存、加密或分批发送是取得后的输出处理；它们都不在本父级重复建子项。
rationale_en: 'ATT&CK Enterprise 19.1 T1056 spans Collection and Credential Access and groups transparent interception with
  deceptive elicitation. The TA0006 object should preserve the direct objective of actually obtaining authentication input
  as the user submits it, while narrowing formal scope to passwords, verification codes, or comparable authentication secrets
  and requiring a supported attacker-controlled difference in input trust path, capture position, or consumer identity. Installing
  a hook, gaining input permission, showing a prompt, or changing a login page without proof that input content reached an
  attacker-readable buffer does not reach completion. Adaptation is recommended rather than copying the four ATT&CK children
  because keyboard, GUI, web, and API labels describe media or implementation positions. Item-by-item coverage and a second
  native-axis review converge on three cross-implementation classes: pre-consumer input-stream bypass, genuine-consumer submission
  shadowing, and impersonated-consumer credential elicitation. Window or page gating is already owned by NJS-0132-001, while
  buffering, encryption, or batched transmission is post-capture output handling; none is duplicated as a child here.'
scope_notes_zh: 正式范围要求认证输入实际进入攻击者可读结果；三项 NJS 按消费者前位置、真实消费者内部第二接收者和仿冒消费者身份划分，ATT&CK 子技术只作覆盖参考。
scope_notes_en: Formal scope requires authentication input to reach an attacker-readable result. The three NJS divide pre-consumer
  position, a second receiver inside the genuine consumer, and impersonated-consumer identity; ATT&CK children provide coverage
  context only.
gap_statement_zh: TA0006 需要表达认证输入被复制时的稳定信任路径与防守观察差，不能由页面内容读取、存储凭据、认证过程改变或后继令牌窃取替代。
gap_statement_en: TA0006 requires stable trust-path and defender-observation differences for copied authentication input and
  cannot substitute page-content reads, stored credentials, authentication-process changes, or successor token theft.
