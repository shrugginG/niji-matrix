  name_en: Brute Force
  name_zh: 暴力破解
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 将 T1110 置于 Credential Access，涵盖对在线认证服务或已取得的验证材料反复测试候选口令。该直接行为值得保留，但“暴力破解”本身不说明匿迹变量；Niji 父技术应改写为攻击者在未知秘密的验证过程中控制请求时间、验证分布或验证位置，使失败证据被稀释、分散或从服务端视野移出。准入并不把所有失败登录判为恶意，也不把获得哈希或取得有效账户本身判为本技术。
  准入强度由固定基线父页、Microsoft 对低频分布式尝试的事件观察、NIST 对在线与离线验证差异的规范性分析共同支撑。三条 Niji 轴并不等同于 ATT&CK 的猜测、破解、喷洒、填充四个名称；同一候选来源可进入多个轴，而同一轴可以跨多种候选来源。最终子项边界与数量仍须由主
  Agent 在与 T1557 及已有有效账户技术交叉审查后裁决。
rationale_en: ATT&CK Enterprise 19.1 places T1110 in Credential Access and covers repeated testing of candidate passwords against an online authentication
  service or already acquired verification material. The direct behavior merits inclusion, but the term brute force alone does not identify a
  stealth variable. The Niji parent should be adapted to attacker control of request timing, verification distribution, or verifier location so
  that failure evidence is diluted, dispersed, or removed from the service's view. Admission does not classify every failed sign-in as malicious,
  nor does it classify hash acquisition or later use of a valid account as this technique. The admission is supported by the fixed-baseline parent
  page, Microsoft's observed low-rate distributed attempts, and NIST's analysis of online versus offline verification. The three Niji axes do
  not correspond to ATT&CK's four guessing, cracking, spraying, and stuffing labels; one candidate source can participate in several axes, and
  one axis can span several candidate sources. The primary agent must still settle child boundaries and count after cross-review with T1557 and
  existing valid-account techniques.
scope_notes_zh: 只收录未知秘密的反复候选验证及可证实的时间、来源/主体拓扑或验证器位置差。材料取得归 T1003 等对象，单次使用已知有效秘密归有效账户使用，T1557 的通信路径介入独立。离线分析不把没有服务端失败等同破解成功。三个原生子项均以痕迹与防守观察差建立。
scope_notes_en: Scope requires repeated validation of an unknown secret with a defensible time, source/principal-topology, or verifier-location
  difference. Material acquisition belongs to T1003 and related objects, a single use of a known valid secret to valid-account use, and T1557
  communication-path intervention remains separate. Offline analysis does not equate absent server failures with successful cracking. Three native
  children use trace and defender-observation differences.
gap_statement_zh: TA0006 需要按凭据获取直接对象表达此候选的稳定匿迹变量及防守观察差，不能由其他战术的结果对象代替。
gap_statement_en: TA0006 needs a direct credential-acquisition object for this candidate's stable stealth variables and defender-observation differences
  rather than substituting another tactic's outcome object.
