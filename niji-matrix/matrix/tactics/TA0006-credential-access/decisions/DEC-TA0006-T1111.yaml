candidate:
  source_type: attack
  source_attack_id: T1111
  source_attack_version: '19.1'
  name_en: Multi-Factor Authentication Interception
  name_zh: 截获多因素认证
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1111 属于 Credential Access，覆盖一次性验证码、软件令牌状态、认证服务内记录和智能卡代理等行为，但也把“截获材料”“通过受控端调用绑定认证器”和“诱导用户批准攻击者请求”等不同结果并置。TA0006
  应保留攻击者取得 MFA 证明或持续证明生成能力这一直接目标，同时要求证明材料实际进入攻击者控制面且在到达时仍可能被验证者接受。只发现钓鱼页、读取权限、令牌文件、远程控制能力或 MFA 请求，不等于取得可用证明。 建议 adapt，因为固定父行为值得保留，但
  Niji 范围必须区分能力、材料到达、可重放或可生成、验证者接受和后继登录。零个 ATT&CK 子项只表示没有既有实现分区，不免除原生轴搜索。研究收敛出两项有结论级证据且防御观察不同的子项：短时单次证明截获，以及认证证明生成状态复制。智能卡驻留代理只有高质量样本能力分析，缺少同一在野事件中未导出秘密、实际调用绑定认证器并取得被接受证明的完整链，故保持
  evidence-deferred，不为数量正式化。
rationale_en: 'ATT&CK Enterprise 19.1 T1111 belongs to Credential Access and spans one-time codes, software-token state, logging
  inside authentication services, and smart-card proxying, but it also places intercepted material, invocation of a bound
  authenticator through a controlled endpoint, and user approval of an attacker request beside one another. The TA0006 object
  should preserve the direct objective of obtaining an MFA proof or durable proof-generation capability while requiring evidence
  that material actually entered adversary control and could still be accepted by the verifier at arrival. A phishing page,
  read permission, token file, remote-control capability, or MFA request alone does not establish a usable proof. Adaptation
  is appropriate because the fixed parent behavior should remain, while Niji scope must distinguish capability, material arrival,
  replay or generation capability, verifier acceptance, and later sign-in. Zero ATT&CK children means only that no implementation
  partition exists; it does not remove the native-axis search obligation. Research converges on two children with conclusion-level
  evidence and distinct defensive observation: ephemeral single-proof capture and authentication proof-generator state replication.
  Resident smart-card proxying has high-quality malware capability analysis but lacks a complete same-incident field chain
  from non-exported secret through actual bound-authenticator invocation to an accepted proof, so it remains evidence-deferred
  rather than being formalized to fill a count.'
scope_notes_zh: 正式范围、证据阶段、原生分类和相邻对象见 BATCH-TA0006-006 中央裁决；ATT&CK 实现只作覆盖参考。
scope_notes_en: BATCH-TA0006-006 central adjudication defines formal scope, evidence stages, native taxonomy, and adjacent
  ownership; ATT&CK implementations provide coverage context only.
gap_statement_zh: TA0006 需要表达该 MFA 行为的稳定材料或 challenge 控制变量及防守观察差，不能由输入、社工或后继使用对象替代。
gap_statement_en: TA0006 requires stable MFA-material or challenge-control variables and defender-observation differences
  without substituting input, social-engineering, or successor-use objects.
