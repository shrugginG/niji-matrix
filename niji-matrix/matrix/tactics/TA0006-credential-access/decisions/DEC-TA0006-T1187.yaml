type: technique-decision
id: DEC-TA0006-T1187
tactic_ref: TA0006
candidate:
  source_type: attack
  source_attack_id: T1187
  source_attack_version: '19.1'
  name_en: Forced Authentication
  name_zh: 强制认证
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1187 明确属于 Credential Access，并覆盖让用户终端或服务器向攻击者可观察位置发出认证材料的行为，因此父候选应保留；但固定页把文档、快捷方式、图标、SMB、WebDAV 与 EFSRPC
  等诱因、载体和协议并列，还把材料捕获、离线破解与中继放在同一叙述中，这些实现名不能直接成为 Niji 子技术。建议把正式父范围改写为“攻击者控制触发条件，使受害主体或设备向其可观察目标实际发出挑战响应或等价认证材料”，并把诱因存在、连接尝试、材料到达、后继中继或破解分为独立证据阶段。
  固定基线没有 ATT&CK 子项，开放搜索仍发现两个稳定且可跨产品出现的 Niji 变量。其一把恶意网络引用藏在会被应用、桌面或消息客户端后台解析的对象中，由当前用户上下文自动发起认证；其二通过可远程调用的服务控制面，让系统服务或机器身份向指定位置认证。两者在触发主体、账户语义、前后痕迹、检测连接键和缓解强制点上均不同。用户是否点击、使用
  SMB 还是 HTTP、载体是文档还是图片、以及监听器产品都只是属性；后续中继归 NJT-0136/NJS-0136-002，离线候选验证归 NJT-0137/NJS-0137-003。
rationale_en: ATT&CK Enterprise 19.1 places T1187 in Credential Access and covers causing a user endpoint or server to send authentication material
  to an adversary-observable location, so the parent candidate should be retained. The fixed page, however, mixes documents, shortcuts, icons,
  SMB, WebDAV, and EFSRPC as triggers, carriers, and protocols, then discusses capture, offline cracking, and relay in one narrative. Those implementation
  labels cannot become Niji children. The formal parent should be adapted to an adversary-controlled trigger that causes a victim principal or
  device to actually emit a challenge response or equivalent authentication material to an observable target, while trigger presence, connection
  attempt, material arrival, relay, and cracking remain separate evidentiary stages. Although the fixed baseline has no ATT&CK children, an open
  search found two stable cross-product Niji variables. One hides a network reference in an object that an application, shell, or messaging client
  resolves in the background, causing authentication under the current user context. The other invokes a remotely reachable service control plane
  so a system service or machine identity authenticates to a chosen location. They differ in initiating principal, account semantics, before-and-after
  traces, detection join keys, and mitigation enforcement points. User click state, SMB versus HTTP, document versus image carrier, and listener
  product remain attributes. Subsequent relay belongs to NJT-0136/NJS-0136-002, and offline candidate verification belongs to NJT-0137/NJS-0137-003.
scope_notes_zh: 正式范围、相邻对象和证据门槛见本批准入与 taxonomy 裁决；ATT&CK 子技术仅作实现广度，所有 NJS 均为 Niji 原生观察变量。
scope_notes_en: The batch admission and taxonomy review defines formal scope, adjacent ownership, and evidence gates. ATT&CK children provide
  implementation breadth only; every NJS is a Niji-native observation variable.
gap_statement_zh: TA0006 需要表达该凭据获取行为的稳定匿迹变量与防守观察差，不能由相邻执行、路径、材料盗取或身份使用对象替代。
gap_statement_en: TA0006 requires stable stealth variables and defender-observation differences for this credential-acquisition behavior rather
  than substituting adjacent execution, path, material theft, or identity-use objects.
