candidate:
  source_type: attack
  source_attack_id: T1212
  source_attack_version: '19.1'
  name_en: Exploitation for Credential Access
  name_zh: 利用漏洞获取凭据
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1212 把软件漏洞用于收集凭据、绕过认证、伪造票据、重放认证材料或在云身份系统中产生令牌等行为放在同一父项。Credential Access 中有必要保留“漏洞是取得凭据结果的直接机制”这一行为，但原范围会与
  T1558 票据伪造、T1606 Web 凭据伪造、T1550 认证材料重放、T1556 认证过程修改和普通认证绕过重叠。建议适配为脆弱凭据读取边界利用：攻击者控制的输入必须到达事件时确切脆弱的组件或保护状态，并直接产生此前不可用的凭据、认证材料或可独立验证的读取能力。 固定父项没有
  ATT&CK 子技术，仍完成了开放 Niji 分类搜索。建议的两项子技术不按产品、CVE、漏洞类别或材料类型划分，而按敏感存储侧实际执行读取的主体划分：受害服务代理凭据返回中，服务进程替远端攻击者读取并通过既有响应返回材料；低权上下文越界凭据库读取中，攻击者控制的非管理员身份或进程直接读取原本受保护的文件或数据库。两者分别要求请求—服务读取—响应关联与调用者权限前态—存储读取—结果关联，具有稳定痕迹差和独立防御价值。
rationale_en: 'ATT&CK Enterprise 19.1 T1212 groups software exploitation used to collect credentials with authentication bypass, ticket forgery,
  replay of authentication material, and token creation in cloud identity systems. Credential Access still needs the behavior in which a vulnerability
  is the direct mechanism producing a credential result, but the original scope overlaps T1558 ticket forgery, T1606 web-credential forgery, T1550
  authentication-material replay, T1556 authentication-process modification, and generic authentication bypass. Adapt the candidate as Vulnerable
  Credential-Read Boundary Exploitation: attacker-controlled input must reach an exact component or protection state that was vulnerable at the
  event time and directly produce credentials, authentication material, or an independently verified read capability that was unavailable beforehand.
  The fixed parent has no ATT&CK sub-techniques, but the open Niji taxonomy search was still completed. The two proposed children are not divided
  by product, CVE, vulnerability class, or material type. They are divided by the subject that performs the read at the sensitive store. In Victim-Service-Mediated
  Credential Return, a service process reads for the remote adversary and returns material through its existing response. In Low-Authority Context
  Credential-Store Over-Read, an attacker-controlled nonadministrative identity or process directly reads a file or database that should be protected.
  The former requires request-to-service-read-to-response correlation; the latter requires caller authority pre-state-to-store-read-to-result
  correlation. Their traces and defensive value are materially different.'
scope_notes_zh: 正式范围、相邻对象和证据门槛见本批准入与 taxonomy 裁决；ATT&CK 子技术仅作实现广度，所有 NJS 均为 Niji 原生观察变量。
scope_notes_en: The batch admission and taxonomy review defines formal scope, adjacent ownership, and evidence gates. ATT&CK children provide
  implementation breadth only; every NJS is a Niji-native observation variable.
gap_statement_zh: TA0006 需要表达该凭据获取行为的稳定匿迹变量与防守观察差，不能由相邻执行、路径、材料盗取或身份使用对象替代。
gap_statement_en: TA0006 requires stable stealth variables and defender-observation differences for this credential-acquisition behavior rather
  than substituting adjacent execution, path, material theft, or identity-use objects.
