id: DEC-TA0006-T1528
tactic_ref: TA0006
candidate:
  source_type: attack
  source_attack_id: T1528
  source_attack_version: '19.1'
  name_en: Steal Application Access Token
  name_zh: 窃取应用访问令牌
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1528 以应用访问令牌被窃为父行为，覆盖容器服务账户令牌、CI/CD/API 令牌、云资源附加身份经元数据服务返回的短期令牌、恶意 OAuth 应用取得的访问令牌和刷新令牌。TA0006
  应保留“既有或由正规权威返回的应用令牌实际进入攻击者控制面”这一核心，并明确令牌发现、同意或签发、缓存存在、读取尝试、材料返回、材料有效性、后继使用与资源访问是不可互换的证据阶段。 直接事件与平台材料支持这一收敛。Unit 42 记录 TeamPCP
  从受侵 CI/CD 端点的 IMDS 收集云凭据、直接读取 runner.worker 进程内存提取明文 token，并把收获材料外传；同一报告和 Kubernetes/GitHub 官方说明支持文件、投影卷、环境与运行内存中的不同暴露面。GTIG
  则确认 UNC6395 使用已受损的 Drift OAuth token 访问 Salesforce 与少量 Workspace 邮箱，证明材料已在攻击者控制下并触发撤销，但未公开 token 最初如何离开供应商控制面。因此父级可准入，三个取得路径的直接证据强度并不完全相同，整体置信度保持
  medium。
rationale_en: ATT&CK Enterprise 19.1 anchors T1528 in theft of application access tokens and covers container service-account
  tokens, CI/CD and API tokens, short-lived tokens returned through metadata services for attached cloud identities, access
  tokens issued to malicious OAuth applications, and refresh tokens. Under TA0006, preserve the core result that an existing
  application token or one returned by a legitimate authority actually enters adversary control, while treating discovery,
  consent or issuance, cache presence, read attempt, material return, material usability, follow-on use, and resource access
  as non-interchangeable evidence stages. Direct incident and platform evidence support this convergence. Unit 42 documents
  TeamPCP harvesting cloud credentials through IMDS on compromised CI/CD endpoints, reading runner.worker process memory directly
  to extract plaintext tokens, and exfiltrating collected material. The same report plus Kubernetes and GitHub documentation
  support distinct exposure surfaces in files, projected volumes, environment, and volatile memory. GTIG confirms UNC6395
  use of compromised Drift OAuth tokens against Salesforce and a small number of Workspace mailboxes, establishing adversary
  control and triggering revocation, but not disclosing how the tokens first left vendor control. The parent is admissible,
  while direct evidence strength differs among the three acquisition paths, keeping overall confidence at medium.
scope_notes_zh: 完成点为完整 access/refresh material 进入攻击者控制面；三项 NJS 按签发返回、持久工件和易失运行态划分。
scope_notes_en: Completion requires complete access or refresh material to enter an adversary-controlled recipient; the three
  NJS divide issuance return, persisted artifact, and volatile runtime.
gap_statement_zh: TA0006 需要表达 token 取得路径和材料结果，不能用授权、路径发现或后继资源使用替代。
gap_statement_en: TA0006 requires token acquisition path and material outcome without substituting authorization, path discovery,
  or successor resource use.
