  name_zh: 窃取 Web 会话 Cookie
  name_en: Steal Web Session Cookie
decision: adapt
rationale_zh: 保留取得既有 Web 会话 Cookie 的凭据访问目的，将规范完成点改写为完整会话材料实际进入攻击者控制面，并把读取机会、解密、材料控制、有效性及后继呈现分开。Cookie 的自动附带、站点与存储分区、网页脚本权限及浏览器解密服务形成应用令牌取得之外的具体防御面；以原可信客户端返回材料改变读取归因的变量，有官方观察和作者实验支持。
rationale_en: Preserve the credential-access purpose of obtaining an existing web session cookie, while defining completion as complete session
  material actually entering adversary control and separating access opportunity, decryption, material control, usability, and later presentation.
  Automatic attachment, site and storage partitions, web-script permissions, and browser decryption services provide concrete defenses beyond
  application-token acquisition. Official observations and author experiments support a variable in which the original trusted client returns
  material and changes read attribution.
scope_notes_zh: 仅纳入具有 Web Cookie 会话语义的既有完整材料。浏览器控制、文件打开、加密键取得、认证成功或异常访问均不能单独证明取得。建立一个可信客户端代取子项；持久工件、外进程内存和真实传递流作为父级路径，不按其位置机械复制 NJT-0178
  三分。
scope_notes_en: Include existing complete material with web-cookie session semantics. Browser control, file opening, key acquisition, authentication
  success, or anomalous access alone does not prove acquisition. Establish one trusted-client retrieval child; persisted artifacts, foreign-process
  memory reads, and actual transmission remain parent paths without mechanically repeating NJT-0178's three-way location taxonomy.
