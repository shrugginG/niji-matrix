candidate:
  source_type: attack
  source_attack_id: T1552
  source_attack_version: '19.1'
  name_zh: 未加保护的凭据
  name_en: Unsecured Credentials
decision: adapt
rationale_zh: 以未保护的认证秘密取得保留该候选，强调攻击者实际读取或恢复处于不适当可读面上的秘密，而不是把任何配置、API、保管库或下载行为一律称为凭据窃取。公开研究、微软对 GPP 的原始分析及邮件入侵披露分别支持散落秘密、公开常量可逆保护和协作副本路径；其匿迹价值在于读取可能发生于凭据专用审计之外。准入不要求秘密已被接受或仍然有效，也不把低权限、正常
  API 或旧副本本身当作恶意意图证据。
rationale_en: Adapt the candidate as Unprotected Authentication Secret Acquisition, requiring actual reading or recovery of secrets exposed
  through an inappropriate readable surface rather than labeling every configuration, API, vault, or download as credential theft. Original
  research, Microsoft's original GPP analysis, and its email-intrusion disclosure support loose secrets, protection reversible with a public
  constant, and collaboration copies respectively. The stealth value is retrieval outside credential-specific audit. Admission does not require
  acceptance or continuing validity, and low privilege, ordinary APIs, or old copies alone do not establish malicious intent.
scope_notes_zh: 材料角色和取得路径分别举证。直接取用受管理保管库归 NJT-0147，OS 认证库提取归 NJT-0177；未保护工件中取得应用令牌、认证证书私钥或 Cookie 时，可分别与 NJT-0178、NJT-0227 或 T1539 并列，但须证明对应材料。Kerberos
  票据取得或构造及候选离线验证另行处理。八个 ATT&CK 子项只作广度对照；拟建立一项以次生记录角色为变量的 Niji 子项。
scope_notes_en: Evidence material role and acquisition path separately. Direct managed-store retrieval belongs to NJT-0147 and OS authentication-store
  extraction to NJT-0177. Acquisition of application tokens, authentication-certificate private keys, or cookies from an unprotected artifact
  can coexist with NJT-0178, NJT-0227, or T1539 only with evidence of the corresponding material. Kerberos-ticket acquisition or construction
  and offline candidate verification remain separate. The eight ATT&CK children are breadth context only; one Niji child based on the secondary-record
  role is proposed.
