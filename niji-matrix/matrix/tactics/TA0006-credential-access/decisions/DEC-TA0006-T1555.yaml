candidate:
  source_type: attack
  source_attack_id: T1555
  source_attack_version: '19.1'
  name_en: Credentials from Password Stores
  name_zh: 从密码存储获取凭据
decision: adapt
rationale_zh: T1555 的直接目标是越过受管理保管库边界取得可用秘密，但 ATT&CK 父项按操作系统、浏览器、管理器和云服务聚合实现，不能据产品标签推断匿迹。固定六项子项经覆盖表和第二轮搜索后，只有借受信消费身份返回秘密以及在解锁运行态绕过逐项 API 两条变量具备独立痕迹和防御差。Mandiant
  的明文导出实验与 Keydnap 的旧版内存分析分别支持其成立；密文副本外传未在同一事件证明解锁，因此 adapt 收窄正式分类并暂缓该轴。
rationale_en: T1555 directly seeks usable secrets across a managed-store boundary, but the ATT&CK parent groups implementations by operating system,
  browser, manager, and cloud service, which cannot establish stealth by product label. After six-item coverage and a second search, only secret
  return through a trusted consumer and bypass of per-item APIs through unlocked runtime have distinct traces and defenses. A Mandiant plaintext-export
  exercise and legacy Keydnap memory analysis respectively support those variables. Ciphertext-copy exfiltration lacks same-incident unlock proof,
  so the parent is adapted and that axis deferred.
scope_notes_zh: 完成结果要求受管理秘密返回及攻击者控制变量，区分发现、读取、密文复制、保存和后继使用。T1552 未保护秘密、T1003 系统认证材料、NJS-0137-003 离线候选验证、T1056 输入截获、T1528 应用令牌和 NJT-0108 存储视图路径各归其直接对象；可并记有独立证据的结果，不复制平台子项。
scope_notes_en: Completed retrieval requires supported secret return and an attacker-controlled observation variable, separating discovery, reads,
  ciphertext copy, retention, and later use. Loose secrets in T1552, OS authentication material in T1003, offline candidate validation in NJS-0137-003,
  input capture in T1056, application tokens in T1528, and storage-view access in NJT-0108 retain their direct objects. Independently evidenced
  results may co-occur without importing platform children.
gap_statement_zh: TA0006 需要表达保管库受信消费者与解锁运行态各自特有的秘密返回和防守观察差，不能由一般凭据转储或密码猜测对象代替。
gap_statement_en: TA0006 needs separate representation of secret return and defender-observation differences through trusted vault consumers and
  unlocked runtime, which generic credential dumping or guessing does not replace.
