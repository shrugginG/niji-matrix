tactic_ref: TA0006
candidate:
  source_type: attack
  source_attack_id: T1556
  source_attack_version: '19.1'
  name_en: Modify Authentication Process
  name_zh: 修改认证过程
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 将认证机制和流程的恶意修改同时映射到 Credential Access、Persistence 与 Defense Impairment，并明确其组件负责收集、存储和验证凭据。TA0006
  因而应保留“修改认证路径后直接取得认证秘密或使其形成可恢复暴露状态”的行为；但现有 NJT-0093 已拥有同一父行为及其持久异常允许结果，另建同义父技术会按战术重复计数。建议适配准入并复用 NJT-0093，增加 TA0006 战术引用，将父级名称与正文扩展为同时覆盖认证结果和秘密处理的改变。
  Credential Access 的完成门槛不是存在恶意模块、策略开关或失败开放路径，而是认证组件、回调、提供者、联合代理或保护策略的攻击者控制变化与凭据材料结果之间形成因果连接。认证事务内旁路复制需要证明受信认证路径把明文或等价秘密额外交给恶意消费者；未来秘密可恢复化需要证明弱化策略已生效、后续凭据变化产生可恢复材料，并至少有材料存在或恢复能力证据。选择性异常允许与范围化策略例外若只改变后续
  decision，继续由 NJS-0093-001/-002 所有；单纯防御功能下降由 TA0112 所有。
rationale_en: ATT&CK Enterprise 19.1 maps malicious modification of authentication mechanisms and processes to Credential
  Access, Persistence, and Defense Impairment and states that those components gather, store, and validate credentials. TA0006
  should therefore retain behavior in which modifying the authentication path directly obtains authentication secrets or causes
  them to enter a recoverable exposed state. NJT-0093 already owns the same parent behavior and its durable anomalous-allow
  outcome, so a synonymous parent would duplicate the behavior by tactic. Admit the candidate as adapted, reuse NJT-0093,
  add TA0006 to its tactic references, and extend the parent name and prose to cover changes to authentication outcomes and
  secret handling together. Credential Access is complete only when an adversary-controlled change to an authentication component,
  callback, provider, federation agent, or protection policy is causally joined to a credential-material result, rather than
  from the mere presence of a malicious module, policy switch, or fail-open path. An in-transaction side copy requires evidence
  that a trusted authentication path additionally delivered plaintext or equivalent secret to a malicious consumer. Future-secret
  recoverability requires an effective weakened policy, a later credential change that produced recoverable material, and
  evidence of material existence or recovery capability. Selective anomalous allow and scoped policy exceptions that only
  change later decisions remain owned by NJS-0093-001 and NJS-0093-002; defense-function decline alone remains owned by TA0112.
scope_notes_zh: 复用并扩展 NJT-0093；既有 NJS-0093-001/002 保持认证结果边界，新增 NJS-0093-003 表达受信认证事务内的第二秘密接收者。未来秘密可恢复化因在野完整链不足暂缓。
scope_notes_en: Reuse and extend NJT-0093. Existing NJS-0093-001 and NJS-0093-002 retain their authentication-outcome boundaries,
  while NJS-0093-003 represents a second secret recipient inside a trusted authentication transaction. Future-secret recoverability
  is deferred for lack of a complete in-the-wild chain.
gap_statement_zh: TA0006 需要表达修改认证路径后直接产生秘密材料的稳定变量，不能复制父技术，也不能用异常允许或防御下降代替秘密输出结果。
gap_statement_en: TA0006 requires a stable variable for secret material directly produced after authentication-path modification
  without duplicating the parent or substituting anomalous allow or defense decline for a secret-output result.
