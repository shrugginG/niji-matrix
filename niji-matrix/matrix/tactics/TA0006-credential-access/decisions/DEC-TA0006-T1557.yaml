decision: adapt
rationale_zh: 固定 ATT&CK Enterprise 19.1 的 T1557 横跨凭据获取与一般收集，且可仅为嗅探、传输篡改或拒绝服务建立中间位置。TA0006 的正式对象应保留其“攻击者介入通信信任路径”这一父行为，但限于有意将认证材料、认证交换或可复用会话置于攻击者可接触路径，并存在实际获取或可证实获取机会的情形。只看到伪造网络响应或链路异常而没有认证关联时，应记录为路径介入调查线索，不能宣称已取得凭据。
  准入采用 adapt，因为这一范围收窄保持 ATT&CK 父行为与战术关系，又使匿迹变量可围绕谁被重定向以及认证被送往何处来定义。无线、ARP、DHCP 和名称解析只是可承载这些变量的实现面；Web 钓鱼实时 IdP 代理已经由 TA0001 的 NJS-0057-004 覆盖首次入口，不应机械复制。正式写入前，主
  Agent 应再核对 T1040、T1528、T1539 与 TA0112 结果类对象的边界及共享对象的最新状态。
rationale_en: Fixed ATT&CK Enterprise 19.1 T1557 spans credential access and general collection and may establish an intermediary position only
  for sniffing, transmitted-data manipulation, or denial of service. The TA0006 object should preserve deliberate intervention in a communication
  trust path, while limiting its scope to routing authentication material, an authentication exchange, or a reusable session through an adversary-accessible
  position with actual acquisition or a demonstrable acquisition opportunity. A forged network reply or path anomaly without an authentication
  link is a path-intervention lead, not proof that credentials were obtained. Adapt is appropriate because this narrower scope preserves the ATT&CK
  parent behavior and tactic relation while allowing stealth variables to be defined by who is redirected and where authentication is delivered.
  Wireless, ARP, DHCP, and name resolution are implementation surfaces for those variables. Real-time IdP proxying in a web phishing lure already
  belongs to NJS-0057-004 for first entry and must not be copied mechanically. Before canonical writing, the primary agent should recheck the
  boundaries with T1040, T1528, T1539, TA0112 outcome objects, and the current shared library.
scope_notes_zh: 只收录凭据承载路径或认证证明目标指向被有意介入的分支。被动嗅探归 T1040，已取得令牌或 Cookie 归 T1528/T1539，钓鱼首次入口的实时 IdP 代理已归 NJS-0057-004；未触及认证材料或结果的普通转发不属于本项。两个 NJS
  按选择性路径与跨目标证明受众差建立，均非 ATT&CK 子项移植。
scope_notes_en: Only intentional intervention in a credential-bearing path or authentication-proof destination is included. Passive sniffing belongs
  to T1040, obtained tokens or cookies to T1528/T1539, and real-time IdP proxying as phishing first entry already to NJS-0057-004. Ordinary forwarding
  without authentication material or outcome is outside scope. Two NJS children use selective path and cross-destination proof audience rather
  than ATT&CK child inheritance.
gap_statement_zh: TA0006 需要按凭据获取直接对象表达此候选的稳定匿迹变量及防守观察差，不能由其他战术的结果对象代替。
gap_statement_en: TA0006 needs a direct credential-acquisition object for this candidate's stable stealth variables and defender-observation differences
  rather than substituting another tactic's outcome object.
