  name_zh: 窃取或伪造 Kerberos 票据
  name_en: Steal or Forge Kerberos Tickets
decision: adapt
rationale_zh: '保留Kerberos票据窃取与伪造的凭据访问核心，并将父级明确适配为票据材料取得与构造。固定五项实现跨越可用票据、协议离线测试密文与构造结果，若不显式分级会把取得回复写成口令恢复，或把材料后继使用写成取得证明。


  三项原生匿迹子技术分别改变时间密度、端点缓存落点与构造模板来源，具有不同残余痕迹和防御要求。它们来自原始实现与实验，不继承ATT&CK五名称；缓存窃取和普通从零构造仍有父级覆盖，不能因此宣称每次取得都具备匿迹设计。'
rationale_en: 'Retain the credential-access core of Kerberos ticket theft and forgery while explicitly adapting the parent to ticket-material
  acquisition and construction. The five fixed-baseline implementations span usable tickets, protocol ciphertext for offline testing, and
  constructed outputs. Without explicit tiering, receipt can be mistaken for password recovery and later use for acquisition evidence.


  Three native children separately change temporal density, endpoint cache destination, and construction-template origin, with different
  residual traces and defensive requirements. They derive from original implementations and experiments rather than the five ATT&CK labels.
  Cache theft and ordinary construction from scratch remain parent-core, without claiming that every acquisition intentionally implements
  stealth.'
scope_notes_zh: 父级完成需材料或构造结果；只发现、配置、权限和后继接受不足。相邻路径与材料结果按独立证据并列。
scope_notes_en: Parent completion requires material or construction outcomes. Discovery, configuration, authority, and later acceptance alone
  are insufficient. Adjacent paths and material outcomes may coexist through independent evidence.
