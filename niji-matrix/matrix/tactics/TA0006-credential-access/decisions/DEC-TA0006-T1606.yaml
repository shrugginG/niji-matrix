id: DEC-TA0006-T1606
tactic_ref: TA0006
candidate:
  source_type: attack
  source_attack_id: T1606
  source_attack_version: '19.1'
  name_en: Forge Web Credentials
  name_zh: 伪造 Web 凭据
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1606 把攻击者新建可用于 Web 或互联网服务的 Cookie、SAML 令牌及其他认证材料置于 Credential Access，且明确与窃取既有 Cookie 或访问令牌区分。这一直接目标应当保留；但父页同时把盗用签名秘密自行构造材料、让服务器依据
  HMAC 预认证值换发 Cookie，以及调用 AWS AssumeRole 或 GetFederationToken 取得平台正式签发的临时凭据并列。后者具有可验证调用者、请求和响应，是授权接口被滥用，而不是攻击者在签发权威之外伪造材料。建议将 Niji 范围收敛为：攻击者自行构造新的认证声明、会话证明或认证链辅状态，并使依赖方在没有对应正常签发或验证链的情况下接受它。
  两个 ATT&CK 子项仅提供 Cookie 与 SAML 两种实现广度。开放搜索比较了签名权来源、材料构造位置、完整凭据与辅状态、身份与权限声明、Audience/Recipient/InResponseTo/时间约束、依赖方验证来源及签发和使用两侧残余日志。研究收敛出两项跨媒介
  Niji 子技术：一项按“完整可信证明是否在权威签发链外铸造”划分，另一项按“组合认证链是否用伪造辅状态补齐”划分。声明和值约束是两项内部均可能出现的验证维度；现有公开事件没有证明攻击者把某一声明或寿命字段作为独立且稳定的匿迹变量，因此不为它另设子项。
rationale_en: 'ATT&CK Enterprise 19.1 places newly generated cookies, SAML tokens, and other material usable against web or Internet services
  under Credential Access and distinguishes them from stolen existing cookies or access tokens. That direct objective should remain. The parent,
  however, groups several different semantics: constructing material with a stolen signing secret, presenting an HMAC preauthentication value
  that causes a server to issue a cookie, and calling AWS AssumeRole or GetFederationToken to receive platform-issued temporary credentials. The
  last path has an authoritative caller, request, and response and is abuse of an issuance API rather than adversary construction outside the
  issuer. Adapt the Niji scope to adversary-created authentication assertions, session proofs, or auxiliary authentication-chain state that a
  relying party accepts without the corresponding normal issuance or verification chain. The two ATT&CK children provide implementation breadth
  for cookies and SAML only. The open search compared signing authority, construction location, complete credentials versus auxiliary state, identity
  and privilege claims, audience, recipient, request and time bindings, verification source, and residual issuance and use logs. It converged
  on two cross-medium Niji children: complete trusted proof minted outside the authoritative issuance chain, and forged auxiliary state used to
  complete a composed authentication chain. Claims and constraint fields are verification dimensions that can occur inside either child. Public
  incident evidence does not establish a single claim or lifetime field as an independent stable stealth variable, so no additional child is created
  for those fields.'
scope_notes_zh: 正式范围、相邻对象和证据门槛见本批准入与 taxonomy 裁决；ATT&CK 子技术仅作实现广度，所有 NJS 均为 Niji 原生观察变量。
scope_notes_en: The batch admission and taxonomy review defines formal scope, adjacent ownership, and evidence gates. ATT&CK children provide
  implementation breadth only; every NJS is a Niji-native observation variable.
gap_statement_zh: TA0006 需要表达该凭据获取行为的稳定匿迹变量与防守观察差，不能由相邻执行、路径、材料盗取或身份使用对象替代。
gap_statement_en: TA0006 requires stable stealth variables and defender-observation differences for this credential-acquisition behavior rather
  than substituting adjacent execution, path, material theft, or identity-use objects.
