candidate:
  source_type: attack
  source_attack_id: T1621
  source_attack_version: '19.1'
  name_en: Multi-Factor Authentication Request Generation
  name_zh: 发起多因素认证请求
decision: adapt
rationale_zh: ATT&CK Enterprise 19.1 的 T1621 明确属于 Credential Access，并以攻击者触发发送给受害用户的 MFA 请求来推进账户访问，因此父候选应保留。固定页把有效口令登录、无口令认证、SSPR、推送、短信、电话、持续轰炸与用户最终批准混在同一行为描述中；这些前提、传输介质和结果不能直接成为
  Niji 子项。建议适配为攻击者驱动的 MFA 挑战生成：攻击者控制一笔认证或恢复事务，使权威身份系统为受害者登记的因素创建并投递挑战。挑战已生成是直接技术结果；用户拒绝、超时、报告欺诈、批准、令牌或会话签发及资源访问必须分层记录。 固定基线没有
  ATT&CK 子项，开放搜索仍检查了请求次数、时间分布、传输方式、身份提供商、认证设备、用户动作、登录来源、请求显示情境和外部沟通。建议的两项 Niji 子技术不按推送、电话、云厂商或设备划分：一项利用由真实身份系统签发的重复挑战制造决策压力，使每个局部事件保持合法外观；另一项把支持、安保或其他可信叙事放在独立通信信道，并与攻击者认证事务同步，使少量挑战看起来有合理来由。前者依赖序列检测与限流，后者依赖跨信道来源、事务情境与独立确认，具有不可互换的观察和防御要求。
rationale_en: 'ATT&CK Enterprise 19.1 places T1621 in Credential Access and centers it on adversary-triggered MFA requests
  delivered to a victim user to advance account access, so the parent candidate should be retained. The fixed page combines
  valid-password sign-in, passwordless authentication, SSPR, push, SMS, calls, continuous bombing, and eventual user approval
  in one description. These prerequisites, transports, and outcomes cannot become Niji children. Adapt the object as Adversary-Driven
  Multi-Factor Authentication Challenge Generation: the adversary controls an authentication or recovery transaction that
  causes the authoritative identity system to create and deliver a challenge to a factor registered for the victim. Challenge
  generation is the direct technique result; denial, timeout, fraud report, approval, token or session issuance, and resource
  access remain graded evidence stages. Although the fixed baseline has no ATT&CK children, the open search examined request
  count, temporal distribution, transport, identity provider, authenticator device, user action, sign-in origin, displayed
  request context, and external communication. The two proposed Niji children are not split by push, phone, cloud vendor,
  or device. One applies repeated challenges issued by the genuine identity system to create decision pressure while each
  local event retains legitimate appearance. The other synchronizes a support, security, or comparable trusted narrative in
  a separate communication channel with the adversary''s authentication transaction so a small number of challenges appears
  to have a reason. The former needs sequence detection and throttling; the latter needs cross-channel provenance, transaction
  context, and independent confirmation, creating non-interchangeable observation and defensive requirements.'
scope_notes_zh: 正式范围、证据阶段、原生分类和相邻对象见 BATCH-TA0006-006 中央裁决；ATT&CK 实现只作覆盖参考。
scope_notes_en: BATCH-TA0006-006 central adjudication defines formal scope, evidence stages, native taxonomy, and adjacent
  ownership; ATT&CK implementations provide coverage context only.
gap_statement_zh: TA0006 需要表达该 MFA 行为的稳定材料或 challenge 控制变量及防守观察差，不能由输入、社工或后继使用对象替代。
gap_statement_en: TA0006 requires stable MFA-material or challenge-control variables and defender-observation differences
  without substituting input, social-engineering, or successor-use objects.
