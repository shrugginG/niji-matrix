  source_attack_id: T1649
  source_attack_version: '19.1'
  name_zh: 窃取或伪造认证证书
  name_en: Steal or Forge Authentication Certificates
decision: adapt
rationale_zh: 固定父行为符合凭据获取，原始技术研究和真实事件支持认证证书与私钥控制的取得。适配明确公开证书、私钥控制、可信签发、服务外构造、认证接受与资源访问的独立证据责任，并以控制者和签发生命周期的关系建立原生分类，避免按产品、容器或工具照搬。可信签发子项有真实事件，服务外构造主要由实现与实验支持，机理置信度保持
  medium。
rationale_en: The fixed parent fits Credential Access, with original research and incidents supporting acquisition of authentication certificates
  and private-key control. Adaptation separates evidence for public certificates, key control, trusted issuance, off-service construction,
  acceptance, and resource access. Native taxonomy follows controller and issuance-lifecycle relationships rather than products, containers,
  or tools. Trusted enrollment has incident support, while off-service construction relies chiefly on implementation and experiments, keeping
  mechanism confidence medium.
scope_notes_zh: 既有终端私钥取得留父级核心，两项子技术分别保留正常签发与绕开正常签发的观察差异；不可导出密钥调用暂缓。
scope_notes_en: Existing end-entity key acquisition remains parent core; two children distinguish retaining versus bypassing normal issuance
  observation. Non-exportable-key invocation is deferred.
gap_statement_zh: 需要独立表达认证证书材料控制与来源关系，不能用公开证书、私钥读取事件或后继登录替代取得和构造证据。
gap_statement_en: Authentication-certificate control and provenance require independent representation rather than substituting public certificates,
  key-read events, or successor sign-ins for acquisition and construction evidence.
