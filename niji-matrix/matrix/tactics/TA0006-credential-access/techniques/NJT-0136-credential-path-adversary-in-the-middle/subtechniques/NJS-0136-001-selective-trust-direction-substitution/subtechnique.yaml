schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0136-001
parent_ref: NJT-0136
name:
  zh: 选择性信任指向替换
  en: Selective Trust-Direction Substitution
summary:
  zh: 只对选定终端或服务提供短驻留的恶意网络指向，使凭据流改道而多数网络状态保持正常。
  en: Give selected endpoints or services short-lived malicious path directions, diverting authentication traffic while most network state remains
    ordinary.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 选择性信任指向替换是攻击者按受害主机、查询名称、服务或有限时段回应网络路径请求，令目标的认证流抵达攻击者位置，同时让未选中的请求继续得到正常处理。它控制的是伪造指向的适用集合与驻留时间，而不是 DNS、DHCP、ARP 或无线中的某个协议名称。仅有过滤功能而无与认证流的关联，不足以证明本子项已在事件中实施。
    en: Selective Trust-Direction Substitution means answering path requests only for chosen victims, queried names, services, or a bounded period,
      so their authentication traffic reaches the actor while other requests keep their normal handling. The variable is the set and residence
      time of forged directions, not a particular DNS, DHCP, ARP, or wireless protocol. A filter capability without an authentication-flow link
      does not establish this child in an incident.
stealth_characteristics:
  paragraphs:
  - zh: 选择性信任指向替换使路径异常在主机和名称维度上呈稀疏分布。攻击者可只伪答目标需要的 WPAD 或内部资源名，并以较短租期和 TTL 让配置在停止后恢复；用全网平均、长驻留网关变化或持续大量应答作阈值的规则更易漏掉。仍可在被选中的主机上观察到短暂 DNS/DHCP 差异、非授权响应者和到攻击者节点的认证连接，所以应通过逐设备历史与多平面关联检验匿迹假说。
    en: Selective Trust-Direction Substitution makes path anomalies sparse by host and name. The actor can answer only a WPAD or internal-resource
      name needed by the target and use short leases and TTLs so configuration reverts after the attack stops. Rules based on network-wide averages,
      lasting gateway changes, or many continuous replies may miss this pattern. A selected host can still reveal brief DNS or DHCP divergence,
      an unauthorized responder, and an authentication connection to the actor node, so per-device history and cross-plane correlation are needed
      to test the stealth hypothesis.
scope_boundary_definition:
  paragraphs:
  - zh: 本项要求有意限定受害集合或时间范围且该限定改变了防守观察；广泛持续投毒属于父级一般行为。若攻击者把一份认证挑战转给不同真实服务，应另看跨目标认证证明中继；两者并用可双标。合法的按客户端分流 DNS、短租期 DHCP、无线漫游或故障切换可产生局部差异，须核对授权配置、控制者和实际认证流。
    en: This child requires deliberate victim or time scoping that changes defender observation. Broad continuous poisoning remains a general
      behavior of the parent. Forwarding an authentication challenge to a different real service is assessed separately as cross-destination proof
      relay, and both may be present. Legitimate client-specific DNS, short DHCP leases, wireless roaming, and failover can create local differences,
      so authorization, controller identity, and the actual authentication flow must be checked.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在企业 IPv6 未被充分监控而 Windows 终端仍接受 DHCPv6 配置的网络中，攻击者可只选择高价值主机和特定名称，诱导其请求代理或内部服务并向攻击者位置认证。相同变量原则也可出现在按查询过滤的名称解析伪答或仅短时启用的网关映射，但具体实现必须另有事件证据。
      en: In an enterprise where IPv6 is poorly monitored and Windows endpoints still accept DHCPv6 configuration, an actor can select high-value
        hosts and particular names, steering a proxy or internal-service request and its authentication toward the actor. The same variable could
        apply to query-filtered name replies or briefly enabled gateway mappings, but each concrete implementation needs its own incident evidence.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需处于能接收目标路径请求并送出可被接受的竞争回答的位置，掌握目标主机或服务命名规律，并维持足够时间接到认证流。过窄的目标条件会错失流量；过短的租期会造成重认证或配置摆动，且交换机、端点和 DNS 历史可能完整记录改道。
        en: The actor must receive the target's path requests and deliver a competing answer the endpoint accepts, know or infer host and service
          naming, and hold the diversion long enough for authentication. An overly narrow selector may miss traffic; an overly short lease may
          cause reauthentication or configuration churn, and switch, endpoint, and DNS histories may record the diversion.
    defender_model:
      paragraphs:
      - zh: 防守方需要保存每台终端的 DHCPv6 提供者、DNS 服务器与答案、邻居或无线连接变化及随后认证目的地，而不能只汇总某 VLAN 的异常响应总量。授权服务器清单和网络变更记录提供正常基线；当端点不受管或只收集防火墙汇总流时，短期单主机重定向可能不可见。
        en: The defender must retain DHCPv6 providers, DNS servers and answers, neighbor or wireless changes, and subsequent authentication destinations
          per endpoint rather than only total anomalous replies per VLAN. Authorized-server inventory and change records provide the normal baseline.
          A short, single-host diversion may remain unseen for unmanaged endpoints or when only aggregate firewall flows are collected.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将伪造指向局限于少数请求和短时配置
    en: Confine forged direction to a few requests and brief configuration
  analysis:
    paragraphs:
    - zh: 主机和名称过滤令大多数网络请求没有变化，而目标终端的认证流被改道；短租期使差异只在有限观察窗口内出现。单一交换机或全网统计只见少量可疑事件，必须把目标终端的控制平面变更与后继认证连接串联才可重建。这是空间和时间上的痕迹稀释；具体规避效果仍需真实部署测量，不可由工具文档直接推成高置信结论。
      en: Host and name filters leave most network requests unchanged while diverting a target's authentication flow, and short leases confine
        the difference to a limited observation window. A single switch or network-wide statistic sees only a few suspect events; reconstructing
        the operation requires joining that endpoint's control-plane change to its later authentication connection. This is spatial and temporal
        trace dilution. Actual evasion effectiveness needs deployment measurement and cannot be elevated to high confidence from tool documentation
        alone.
