research:
  limitations:
    paragraphs:
    - zh: mitm6 原作者文档和代码证明可按主机、名称、短 TTL 控制伪答，尚未证明真实攻击活动使用该组合降低了多少告警。ARP 与无线能否以同一方式形成稳定选择性轴，需要独立实例；现阶段只按变量定义，不把所有协议实例视为已证。认证流仍须实证连接到中间位置。
      en: The mitm6 author's documentation and code establish host, name, and short-TTL control, but not how much any real intrusion reduced alerts
        with that combination. Whether ARP and wireless implementations realize the same stable selective axis needs separate cases; the variable
        is defined without claiming every protocol instance is proven. The authentication flow still has to be linked empirically to the intermediary.
