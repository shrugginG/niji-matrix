research:
  limitations:
    paragraphs:
    - zh: 现有证据直接支持 Windows/NTLM 面向 SMB 或 LDAP 的中继及相应保护条件；它不能证明所有凭据协议可跨目标中继，也不能仅凭目标成功日志证明一次特定事件的前置路径被操纵。若没有客户端原始目的地、目标服务来源和协议保护状态三者的证据，应把“跨目标”降为假说。
      en: Current evidence directly supports Windows and NTLM relays into SMB or LDAP and the relevant protection conditions. It does not establish
        that every credential protocol permits cross-destination relay, nor does a target success log alone prove path manipulation in a particular
        incident. Without the client's intended destination, the target service's observed source, and protocol-protection state, the cross-destination
        conclusion should remain a hypothesis.
