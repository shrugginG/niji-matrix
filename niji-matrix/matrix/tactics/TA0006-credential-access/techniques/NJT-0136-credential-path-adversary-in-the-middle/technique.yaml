research:
  limitations:
    paragraphs:
    - zh: MITRE 对攻击者居中的父级描述覆盖多种路径介入；Microsoft 2022 事件证明 Web 代理曾取得口令与 Cookie，却不能作为局域网定向伪答或跨目标 NTLM 中继的实地案例。mitm6 原作者材料证明定向与短驻留能力，没有测量真实环境的告警降幅。路径异常、目标认证成功和保护拒绝属于不同证据层，不能由其中一项自动推出另外两项。
      en: MITRE's parent description spans several forms of intermediary positioning. Microsoft's 2022 incident shows a web proxy obtaining passwords
        and cookies, but is not a field case of targeted LAN replies or cross-destination NTLM relay. The mitm6 author's material documents targeting
        and short residence without measuring alert reduction in a real environment. Path anomaly, target authentication success, and protection
        rejection are separate evidence levels; none automatically proves the others.
    - zh: 检测依赖网络控制面、终端与目标服务的联合留存。不同 Windows 版本的 NTLM/LDAP 字段与无线控制器记录并不一致；五分钟和十五分钟窗口是需要按时钟偏差、协议交互和网络延迟校准的实施起点。若部署无法取得终端原始目的地或目标认证结果，只能报告异常路径或来源，不能确证跨目标中继；选择性路径的匿迹效果也应保持假设级。
      en: Detection depends on joint retention across network control plane, endpoint, and target service. NTLM and LDAP fields vary by Windows
        version, as do wireless-controller records. Five- and fifteen-minute windows are starting points that require calibration for clock skew,
        protocol interaction, and network delay. Without the endpoint's intended destination or target authentication outcome, a deployment can
        report an anomalous path or source but cannot confirm cross-destination relay; the stealth effect of selective path control remains a
        hypothesis.
