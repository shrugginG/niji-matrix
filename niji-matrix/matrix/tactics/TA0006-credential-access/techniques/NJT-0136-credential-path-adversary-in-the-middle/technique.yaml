schema_version: 2.0.0
type: technique
id: NJT-0136
name:
  zh: 凭据路径中间介入
  en: Credential-Path Adversary-in-the-Middle
summary:
  zh: 攻击者改变认证通信的受信指向或中继目标，在尽量保持正常连接外观的同时接触凭据材料或认证交换。
  en: An adversary changes the trusted direction or relay destination of authentication traffic to reach credential material or an authentication
    exchange while preserving a plausible connection appearance.
aliases:
- Adversary-in-the-Middle
- T1557
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1557
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1557
definition_and_concept:
  paragraphs:
  - zh: 凭据路径中间介入指攻击者在终端与其预期服务之间插入自己可控制的解析响应、邻居或网关映射、接入点或代理路径，使认证相关流量先到达攻击者位置，或使受害者对一个目标发起的挑战应答被转送至另一个真实服务。直接目的是取得明文秘密、挑战应答、令牌或 Cookie，或利用被中继的证明获得认证能力；是否真的取得哪一类材料，必须由该会话与后继结果单独证明。
    en: Credential-path adversary-in-the-middle is deliberate placement of an adversary-controlled resolution answer, neighbor or gateway mapping,
      access point, or proxy between an endpoint and its intended service, so authentication traffic first reaches the adversary, or a challenge
      response intended for one destination is forwarded to another real service. Its immediate objective is plaintext secrets, challenge responses,
      tokens, cookies, or authentication capability through a relayed proof. The material actually acquired in a case must be established from
      that exchange and its outcome.
  - zh: 这个概念的核心是信任指向发生变化：用户、终端或服务仍依据看似正常的名称、地址、无线标识或成功登录结果行动，但这些外观与真实路径不一致。中间位置本身不等于凭据获取；只有凭据承载流进入攻击者可接触路径，并且认证材料或交换结果可被截取、转用或直接观察，才满足本战术下的范围。
    en: The defining change is in the trust direction. A user, endpoint, or service can still act on an apparently ordinary name, address, wireless
      identity, or successful sign-in result even though that appearance no longer matches the actual path. An intermediary position alone is
      insufficient for Credential Access. Authentication-bearing traffic must traverse an adversary-accessible position, with material or the
      exchange outcome exposed to capture, relay, or direct observation.
stealth_characteristics:
  paragraphs:
  - zh: 攻击者可以选择只回答特定终端或名称的解析与配置请求，使多数主机继续使用正常路径，削弱按全网高频伪造响应或持续网关漂移告警的可见信号。另一方面，若中间位置把真实认证继续转发给合法服务，受害者可能得到预期页面或资源，服务端则记录一次表面合法的认证；两端单独看都可能低估路径中多出的参与者。这两种变化分别作用于控制平面事件的空间分布和认证结果的外观，不能合并为一个子项。
    en: The adversary can answer resolution or configuration requests only for selected hosts or names, leaving most clients on their normal paths
      and reducing the signal available to detectors based on network-wide forged replies or persistent gateway drift. If the intermediary continues
      a real authentication exchange with a legitimate service, the victim may receive the expected page or resource and the service may log an
      apparently valid authentication. Each endpoint can miss the additional participant when viewed alone. These changes affect the spatial distribution
      of control-plane events and the appearance of authentication outcomes respectively, so they are separate candidate variables.
  - zh: 残余痕迹并未消失。选择性介入仍留下同一请求的竞争回答、授权 DHCP/DNS 或无线清单与实际响应者不一致、短寿命配置变化，以及受害者到中间节点的连接。认证中继仍留下原始目的地与目标服务之间的来源差、异常 NTLM/LDAP/SMB 绑定或签名结果，以及身份会话在设备与网络来源之间的不连续。要主张匿迹有效，须证明攻击者控制这些变量以及局部视角确实遗漏了关系；工具支持过滤不等于真实入侵已因此避开检测。
    en: Residual traces remain, including competing answers to the same request, responder mismatches against authorized DHCP, DNS, or wireless
      inventories, short-lived configuration changes, and a client connection to the intermediary. Authentication relay can leave a divergence
      between the client's intended destination and the server's observed source, abnormal NTLM, LDAP, or SMB binding and signing outcomes, and
      identity-session discontinuities across devices or network origins. A stealth-effect claim requires evidence that the actor controlled these
      variables and that a local view missed the relationship. A tool's filtering feature alone does not show that an intrusion evaded detection.
scope_boundary_definition:
  paragraphs:
  - zh: 本对象纳入以取得认证材料或认证能力为目的的主动路径指向替换及认证交换中继，包括局域网名称与地址层欺骗、恶意网络配置、伪接入点和应用层代理，只要认证流与中间位置有可验证的关系。T1040 拥有不改变路径或服务指向的被动流量嗅探；若同一事件在中间路径建立后又抓包，可分别标记路径介入与嗅探，但不能把抓包本身说成
      T1557。T1528 与 T1539 分别描述已取得应用令牌或 Cookie 的具体结果，可与本对象并列但不替代路径证据。
    en: This object includes active replacement of a trusted path direction and relay of an authentication exchange for credential material or
      capability, whether implemented through local name or address spoofing, malicious network configuration, a counterfeit access point, or
      an application proxy, provided the authentication flow can be linked to the intermediary. T1040 owns passive sniffing that does not change
      path or service direction. Packet capture after path establishment may justify both labels, but packet capture itself is not T1557. T1528
      and T1539 describe particular acquired token or cookie outcomes; they may coexist with this object without substituting for path evidence.
  - zh: 只有恶意 DNS/ARP/DHCP 或无线接入、流量可见性、服务降级、断线及拒绝服务而没有凭据承载交换的证据时，暂不判作 TA0006 凭据获取。T1689、T1600 等 TA0112 对象若描述的是保护机制被削弱或被绕过的结果，仍需与本对象的“凭据路径如何被介入”区分。正常企业代理、获授权红队、合法无线漫游和有审计记录的网络迁移可产生类似痕迹，须以授权关系、配置所有者、流量目的与认证结果排除。
    en: Rogue DNS, ARP, DHCP, or wireless behavior, traffic visibility, downgrade, outage, or denial of service without evidence of an authentication-bearing
      exchange does not yet establish TA0006 Credential Access. TA0112 objects such as T1689 and T1600 may describe a protection degradation or
      bypass outcome and remain distinct from how this object intervenes in the credential path. Authorized enterprise proxies, sanctioned tests,
      legitimate wireless roaming, and audited network migrations can produce similar traces and require exclusion through authorization, configuration
      ownership, traffic purpose, and authentication outcome.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 企业终端在名称解析失败、DHCP 更新、首次连接无线网络或访问受信内部资源时，会从周边网络接受对路径的指示；位于同一广播域、可控制相邻网络设备或能诱导访问代理入口的攻击者可能介入这些时刻。示例包括只对少数主机提供恶意 DNS/WPAD 指向并接收自动认证，以及把受害主机发出的
        NTLM 证明中继到另一内部服务。Web 钓鱼链中的代理也属于 T1557 的宽泛行为背景，但其首次入口伪装已经另有正式子项，若在 TA0006 记录应侧重经验证的凭据路径或结果。
      en: Enterprise endpoints accept path instructions from their surroundings when resolving a name, renewing DHCP, joining a wireless network,
        or reaching a trusted internal resource. An actor on the same broadcast domain, controlling an adjacent network device, or able to draw
        a user to a proxy entry can intervene at those moments. Examples include giving malicious DNS or WPAD directions only to a few hosts and
        receiving automatic authentication, or relaying a victim's NTLM proof to a different internal service. Proxying in a web phishing chain
        is part of T1557's broad behavior, but first-entry disguise already has a formal child elsewhere; TA0006 analysis should focus on verified
        credential path or outcome.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要对认证路径中的一个信任指向拥有控制权，例如可发送被终端接受的解析或配置回答、部署使目标选择的无线接入点、控制网关或诱导访问反向代理。选择性替换还需要知道或推断目标主机名、服务名和响应时机；跨目标中继还需要可触发或接收认证、到达目标服务，并依赖目标协议未强制足以绑定服务身份、消息完整性或
          TLS 通道的保护。攻击者不能仅凭监听权限完成本对象，也不能保证所有被引流的会话暴露可复用凭据。
        en: The actor needs control over a trust direction in the authentication path, such as an accepted resolution or configuration response,
          an access point the target selects, a gateway, or a reverse proxy that the victim visits. Selective replacement additionally requires
          knowledge or inference of host names, service names, and response timing. Cross-destination relay requires a way to solicit or receive
          authentication, reach the target service, and a target protocol that does not enforce adequate binding to service identity, message
          integrity, or the TLS channel. Listen-only access is insufficient, and redirecting traffic does not guarantee that reusable credentials
          are exposed.
    defender_model:
      paragraphs:
      - zh: 防守方可在交换机、无线控制器、DHCP/DNS 服务、端点网络配置、身份提供方及目标服务取得不同片段。网络管理员能确认哪个端口、BSSID、DHCP 服务器或 DNS 回答曾宣称权威，却未必看到加密后的认证内容；身份团队能看到成功登录、源 IP、设备、会话和签名或绑定错误，却未必知道受害终端原本访问的目的地。实施检测时需以设备、时间、事务、名称、网络连接及认证事件建立跨平面关联，并说明未覆盖个人设备、外部
          Wi-Fi、加密 DNS 或缺少交换机遥测的盲区。
        en: Defenders hold different fragments in switch and wireless-controller logs, DHCP and DNS services, endpoint network configuration,
          identity providers, and target services. Network operators can establish which port, BSSID, DHCP server, or DNS answer claimed authority
          but may not see encrypted authentication content. Identity teams can see successful sign-ins, source IP, device, session, and signing
          or binding failures but may not know the destination the client intended. Detection needs cross-plane joins on device, time, transaction,
          name, connection, and authentication events, with explicit blind spots for personal devices, external Wi-Fi, encrypted DNS, and absent
          switch telemetry.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 伪装受信路径或延续真实认证结果
    en: Mimic a trusted path or continue a real authentication outcome
  analysis:
    paragraphs:
    - zh: 攻击者把自己控制的网络回答、接入标识或代理置于受信目的地之前，使终端仍沿熟悉的名称、SSID 或登录过程行动，或者把挑战应答转给真实服务以产生成功认证。可见特征因此更接近正常连接和正常登录，而真正改变的是响应者、实际路径或认证来源。单看服务成功日志和用户体验容易误判；把原始请求、实际回答者、目的地和目标服务认证拼接后仍可识别不一致。
      en: The actor puts an adversary-controlled network answer, access identity, or proxy ahead of the trusted destination. The endpoint continues
        under a familiar name, SSID, or login flow, or the challenge response is sent to a real service that records successful authentication.
        Visible features resemble an ordinary connection and sign-in while the responder, actual path, or authentication source changes. A service
        success log or user experience alone can mislead; joining the initial request, actual responder, destination, and target-service authentication
        can expose the mismatch.
  confidence: medium
  evidence_refs:
  - REF-000488
  - REF-000489
  - REF-000067
  - REF-000490
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 将伪造路径回答限定在少数主机和服务
    en: Limit forged path answers to selected hosts and services
  analysis:
    paragraphs:
    - zh: 可按主机和名称过滤的恶意 DHCPv6/DNS 回答让攻击者只改变与目标认证有关的少数路径，其他终端仍使用正常解析。短租期与短 DNS TTL 进一步缩短配置差异持续时间，降低全网快照碰到异常的机会；但该效果是由一手工具设计与检测逻辑推导，尚无独立入侵测量证明其告警下降幅度。保留逐设备历史、竞争回答和认证结果可恢复这些稀疏痕迹。
      en: Host- and name-filtered malicious DHCPv6 and DNS answers let the actor alter only a few paths relevant to a target authentication while
        other clients continue to resolve normally. Short leases and DNS TTLs also shorten configuration divergence and can reduce the chance
        that a network-wide snapshot catches it. That observation effect is inferred from the first-party tool design and detection logic; no
        independent intrusion measurement establishes a reduction in alert rate. Per-device history, competing answers, and authentication outcomes
        can recover the sparse traces.
  confidence: hypothesis
  evidence_refs:
  - REF-000489
  - REF-000491
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术以两条稳定的匿迹变量建立子技术。选择性信任指向替换控制哪些终端和名称收到伪造回答、差异持续多久，因而需要逐终端的控制面历史；跨目标认证证明中继控制受害端所想访问的服务与实际验证证明的服务是否一致，因而需要原始请求到目标结果的三方关联。两项可共现，但受控变量、残余痕迹和阻断手段不同。
      en: This technique establishes two children from stable stealth variables. Selective trust-direction substitution controls which endpoints
        and names receive forged answers and how long the divergence persists, requiring per-endpoint control-plane history. Cross-destination
        authentication-proof relay controls whether the service the victim intended matches the service that verifies the proof, requiring a three-party
        join from original request to target outcome. The two may co-occur but differ in control, residue, and prevention.
    - zh: 协议或媒介只说明实现位置。ARP、DHCP、DNS 和无线接入本身不决定子项；现有 NJS-0057-004 已覆盖钓鱼入口的实时 IdP 中继，本项不再以同名变量重复建模。选择性路径的降低告警效果尚缺真实测量，因此该子项的机理保持假设级置信度。
      en: Protocol and medium only locate an implementation. ARP, DHCP, DNS, and wireless access do not themselves define children; existing NJS-0057-004
        already covers real-time IdP relay as a phishing entry and is not duplicated here. The alert-reduction effect of selective path control
        lacks field measurement, so that child's mechanism remains at hypothesis confidence.
  coverage: established
  subtechnique_refs:
  - NJS-0136-001
  - NJS-0136-002
