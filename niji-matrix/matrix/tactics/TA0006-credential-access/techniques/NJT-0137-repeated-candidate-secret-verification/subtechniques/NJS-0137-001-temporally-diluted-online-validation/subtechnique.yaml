research:
  limitations:
    paragraphs:
    - zh: 公开事件给出低尝试数和规避意图，但未公布每次请求的完整间隔、所有候选或各产品告警阈值；跨环境窗口须本地测定。仅凭两次相隔较远的失败无法可靠归因，长保留期也会增加正常噪声和隐私成本。
      en: Public cases describe few attempts and evasion intent but do not publish every interval, all candidates, or each product's alert threshold;
        windows require local calibration. Two widely spaced failures alone do not establish attribution, and long retention raises benign noise
        and privacy cost.
