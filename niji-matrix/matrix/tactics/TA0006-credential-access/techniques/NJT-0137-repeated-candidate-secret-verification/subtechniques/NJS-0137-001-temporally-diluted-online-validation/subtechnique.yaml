schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0137-001
parent_ref: NJT-0137
name:
  zh: 时间展延式在线验证
  en: Temporally Diluted Online Validation
summary:
  zh: 攻击者拉开在线候选验证的时间间隔，使失败分散到常见检测短窗口之外。
  en: The adversary spaces online candidate validation so failures fall outside common short detection windows.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 时间展延式在线验证是攻击者有意延长对未知秘密的在线验证序列，在数小时至数周内把本可密集提交的候选逐步送入认证入口。它仍依赖目标服务逐次判断，并不因每个窗口只出现少量失败就脱离反复验证的父行为。该划分针对节奏，而不限定候选来自字典、泄露组合还是环境推断。
    en: Temporally Diluted Online Validation intentionally stretches testing of an unknown secret over hours to weeks, sending candidates gradually
      to an authentication endpoint instead of in a burst. It still relies on the target service to judge each trial and remains repeated validation
      even when each short window has few failures. The partition concerns pacing, regardless of whether candidates come from a dictionary, leaked
      pairs, or environmental inference.
stealth_characteristics:
  paragraphs:
  - zh: 时间展延式在线验证改变的是单位时间的失败密度和事件之间的距离。短窗口的单账户阈值可能不触发，而每个失败、挑战与后来可能的成功仍在认证日志中；只有保留足够久、能按稳定主体或认证上下文关联的防守方才能还原序列。正常用户多日输错也可能呈低频模式，恶意判断需要跨事件一致性和排除授权测试。
    en: Temporally Diluted Online Validation changes failure density per unit time and the distance between events. A short per-account threshold
      may not fire, while every failure, challenge, and possible later success still exists in authentication logs. Reconstruction requires sufficient
      retention and stable principal or authentication-context joins. Ordinary users can also make occasional mistakes over days, so malicious
      classification needs event consistency and exclusion of authorized testing.
scope_boundary_definition:
  paragraphs:
  - zh: 归入本项必须看到攻击者有意控制在线尝试间隔，使检测窗口或锁定计数受到影响；自然低频、单次误输及仅改变来源而不改变节奏不属于本项。若同一行动同时使用多 IP 与多账户，可并列标注分布式子项，但本项的证据应独立证明时间展延；离线测试没有服务端请求节奏，属于另一观察面。
    en: Inclusion requires evidence that the adversary intentionally controlled spacing of online attempts to affect detection windows or lockout
      counts. Naturally infrequent mistakes, one-time mistyping, and source changes without pacing changes do not establish this child. A campaign
      may also use multiple IPs and accounts, but temporal evidence must independently support this child; offline testing has no server request
      cadence and belongs to another observation model.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 适用于外部 IdP、VPN 或远程服务允许长期接触认证入口且短期锁定与告警较敏感的情形。攻击者可在已有账户列表上每日或更稀疏地测试少量候选，再据反馈调整；其后续目标是确认可用秘密或进入账户，成功并非本项成立的前提。
      en: This child applies when an external IdP, VPN, or remote service remains reachable over time and short-period lockout or alerting is
        salient. An adversary can test a few candidates per day or less often against a known account set and adapt to feedback. The later aim
        is to confirm a usable secret or enter an account; success is not required to establish the behavior.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要持续可达性、维护目标身份与候选状态的能力，并容忍长时间等待及账户密码变更造成的失效。此项无需多来源基础设施；同一来源也可实现时间展延，但如果平台累计限速跨长窗口有效，其收益下降。
        en: The adversary needs sustained reachability, state for target identities and candidates, and tolerance for long delays and password
          changes that invalidate guesses. Multiple egress points are unnecessary; one source can be paced, but the advantage declines if the
          platform enforces cumulative limits over long windows.
    defender_model:
      paragraphs:
      - zh: 防守方需要实际验证器的失败与挑战日志、稳定主体 ID、事件时间及保留期足够长的关联能力。若联合 IdP 仅将成功上报前端，前端日志会低估失败；跨天关联系统还必须处理正常输错、密码过期和批准测试的基线。
        en: Defenders need failure and challenge logs from the actual verifier, stable principal IDs, event time, and retention long enough for
          correlation. If a federated IdP reports only successes to the front end, front-end logs undercount failures. Multi-day correlation must
          baseline ordinary mistakes, expired passwords, and approved testing.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 拉长验证间隔降低局部失败峰值
    en: Stretch validation intervals to reduce local failure peaks
  analysis:
    paragraphs:
    - zh: 攻击者把连续候选测试拉开到短窗规则之外，单次请求的失败痕迹不消失，但相邻失败更难被局部计数规则合并。只有跨长窗口重建同一账户或认证上下文的序列，才能恢复原本被稀释的攻击形状；Microsoft 对低尝试数用于逃避发现的观察支撑此因果链。
      en: The adversary spaces consecutive candidates beyond short-window rules. Individual failures remain, but adjacent failures are less likely
        to be joined by local counters. Reconstructing a sequence over a long window for the same account or authentication context restores the
        diluted pattern; Microsoft's observed use of few attempts to avoid discovery supports the causal chain.
  confidence: medium
  evidence_refs:
