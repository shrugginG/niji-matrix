research:
  limitations:
    paragraphs:
    - zh: 普通登录日志通常没有候选口令明文，因而只能识别多主体多来源的协调形态，不能直接证明相同口令在各账户间复用。代理池、跨租户和客户端字段可被伪造或缺失，分析必须给出覆盖边界并对普通 NAT 或安全测试降权。
      en: Ordinary sign-in logs usually lack candidate plaintext, so analysis identifies coordinated multi-principal and multi-source patterns
        rather than proving password reuse across accounts. Proxy pools, cross-tenant boundaries, and spoofable or missing client fields limit
        inference; analysis must state coverage and down-weight ordinary NAT and authorized testing.
