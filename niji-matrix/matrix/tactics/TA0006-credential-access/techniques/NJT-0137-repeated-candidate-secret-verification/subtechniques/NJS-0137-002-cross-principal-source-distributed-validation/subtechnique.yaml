schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0137-002
parent_ref: NJT-0137
name:
  zh: 跨主体与来源分布验证
  en: Cross-Principal and Source Distributed Validation
summary:
  zh: 攻击者把在线候选测试分布到多账户和多出口，削弱单账户与单来源视图中的异常集中度。
  en: The adversary spreads online candidate testing over accounts and egress points, weakening anomalies in per-account and per-source views.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨主体与来源分布验证是攻击者有计划地把未知秘密的在线测试分派给多个目标身份、多个可控来源，或两者的组合，使每个局部观察点只承受少量尝试。它按验证事件的空间组织方式划界，候选可以为同一个口令、多个不同口令或泄露组合，因此不等同于 ATT&CK 的喷洒或填充名称。
    en: Cross-Principal and Source Distributed Validation deliberately assigns online tests of unknown secrets to multiple target principals,
      controllable sources, or both, so each local vantage sees few attempts. It is defined by the spatial organization of verification events.
      Candidates may be one password, several passwords, or leaked combinations, so the child is not a translation of ATT&CK spraying or stuffing
      labels.
stealth_characteristics:
  paragraphs:
  - zh: 跨主体与来源分布验证把原本聚集于一个账户或 IP 的失败拆散到多对主体来源关系。单账户锁定和单 IP 速率阈值可能分别保持低计数，但全局身份提供者仍可观察到相似时间、应用、客户端或基础设施属性。住宅代理会增加源归因难度，却不会抹去每次认证事件；正常共享 NAT、企业代理和旅行用户也会制造相似聚合形态。
    en: Cross-Principal and Source Distributed Validation breaks failures that would cluster at one account or IP into many principal-source pairs.
      Per-account lockout and per-IP rate limits may each see low counts, while a global identity provider can still observe similarities in time,
      application, client, or infrastructure. Residential proxies complicate source attribution but do not erase each authentication event. Shared
      NAT, enterprise proxies, and travelling users can create related aggregate shapes.
scope_boundary_definition:
  paragraphs:
  - zh: 本项需要可证明的多主体或多来源编排及其降低局部异常的效果；单个管理员从跳板机登录多个合法账户、同一用户漫游多个网络、单纯代理切换后的已知口令使用都不足以纳入。仅拉长一个账户的尝试间隔属于时间子项；在无服务器交互的离线环境分配计算任务不改变服务端观察面，属于验证器脱离子项或无独立匿迹意义。
    en: The child requires evidence of coordinated distribution over principals or sources and its effect on local anomaly concentration. A legitimate
      administrator signing into several accounts from a jump host, a user roaming networks, or proxy switching while using an already known password
      does not suffice. Merely spacing one account's tests belongs to the temporal child. Dividing offline compute without server interaction
      does not alter the service's view and belongs to verifier-detached testing or has no separate stealth significance.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在云租户或面向互联网的认证入口拥有大量可枚举账户、而每账户锁定和每 IP 防护同时存在时，攻击者可能交叉安排账户与出口以维持低局部失败数。Microsoft 对 Midnight Blizzard 的调查记录了少量目标账户与分布式住宅代理的组合；Peach Sandstorm
        来源记录大规模租户认证尝试，但不自动证明其每个请求都经跨来源编排。
      en: At cloud tenants or internet-facing authentication endpoints with an enumerable account pool and both per-account and per-IP controls,
        an adversary may coordinate accounts and egress points to keep local failures low. Microsoft's Midnight Blizzard investigation documents
        a limited target set combined with distributed residential proxies. The Peach Sandstorm source documents attempts across many environments
        but does not automatically prove source coordination for every request.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需维护身份集合、候选与出口池，并有办法避免多个工作节点重复尝试或过早触发锁定。来源池可来自租用代理、受控设备或其他出口，但本项不要求把代理本身误写为凭据获取结果。账户覆盖越广，误触高风险身份或触发全局风控的可能性也越高。
        en: The adversary must maintain a principal set, candidates, and an egress pool, coordinating workers to avoid duplicate trials or premature
          lockout. Egress may be rented proxies, controlled devices, or other paths, but the proxy itself is not a credential-access outcome.
          Broader account coverage also raises the chance of touching protected identities or triggering global risk controls.
    defender_model:
      paragraphs:
      - zh: 防守方应能从实际验证器获取跨应用的主体、来源、结果、时间及客户端元数据，并在至少租户范围内去重和关联。若只能看单应用或单租户，跨边界活动的总体规模可能被低估；若不同身份提供者未统一主体或结果语义，关联会混入大量正常代理流量。
        en: Defenders need principal, source, outcome, time, and client metadata from the actual verifiers, deduplicated and joined across applications
          at least within a tenant. Single-application or single-tenant visibility may undercount activity across boundaries. Without consistent
          principal and outcome semantics across IdPs, correlation can mix in substantial legitimate proxy traffic.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将失败摊薄到多个主体来源对
    en: Spread failures across principal-source pairs
  analysis:
    paragraphs:
    - zh: 攻击者把候选请求交替分配到多个账户和出口，局部计数规则看到的失败密度下降；真正的痕迹仍是跨这些节点的认证结果图。只有把主体、来源、应用与时间共同聚合，才能恢复原行动的覆盖面。Microsoft 的住宅代理案例和 OWASP 对分布式凭据尝试的防御分析共同支撑这种观察差异。
      en: The adversary alternates candidate requests among accounts and egress points, reducing failure density visible to local counters. The
        residual trace is an authentication-result graph across those nodes. Joining principals, sources, applications, and time is needed to
        recover the operation's coverage. Microsoft's residential-proxy case and OWASP's analysis of distributed credential attempts support this
        observation difference.
