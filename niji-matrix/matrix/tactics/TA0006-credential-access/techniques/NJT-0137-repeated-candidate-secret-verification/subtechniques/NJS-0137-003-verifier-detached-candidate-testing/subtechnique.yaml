schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0137-003
parent_ref: NJT-0137
name:
  zh: 验证器脱离式候选测试
  en: Verifier-Detached Candidate Testing
summary:
  zh: 攻击者用已获验证材料在服务端之外测试候选，使各次失败不进入目标服务认证日志。
  en: The adversary tests candidates against acquired verification material outside the service, leaving no target-service failure for each trial.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 验证器脱离式候选测试是攻击者先取得可核对的密码哈希或挑战材料，再在不向目标认证服务逐次请求的情况下计算候选与材料是否匹配。它是一种验证位置迁移：同样是未知秘密的反复候选测试，但验证环节从受害方服务端移到攻击者掌握的计算面。它不按哈希算法、提取工具、材料来源或破解软件命名。
    en: 'Verifier-Detached Candidate Testing begins after the adversary obtains comparable password hashes or challenge material and computes
      candidate matches without submitting each trial to the target authentication service. It is a migration of validation location: repeated
      testing of an unknown secret moves from the victim''s service to attacker-controlled compute. The child is not named or partitioned by hash
      algorithm, extraction tool, material source, or cracking software.'
stealth_characteristics:
  paragraphs:
  - zh: 验证器脱离式候选测试消除了目标服务端与每次候选失败对应的事件及在线锁定计数，因此在线失败关联规则无法测量真实尝试规模。材料读取、复制、外传和后继认证仍可能留下高价值痕迹；若破解发生在受监控终端，还可有进程与计算资源证据。成功破解是否发生不能由“无失败登录”单独判定。
    en: Verifier-Detached Candidate Testing removes the target service event and lockout counter corresponding to each failed candidate, so online-failure
      correlation cannot measure the actual trial volume. Material access, copying, exfiltration, and later authentication can still leave strong
      evidence; a monitored cracking host may show process and compute traces. Lack of failed sign-ins alone cannot establish that a password
      was recovered.
scope_boundary_definition:
  paragraphs:
  - zh: 归入本项必须有候选与已获验证材料本地比较的证据或充分支持的链条。仅窃取哈希、传输哈希、直接以哈希认证、仅猜测可能破解以及合法密码审计均不自动归入；后者还须核对授权。若攻击者把少量已推测出的候选重新提交在线服务验证，该在线阶段应按其自己的节奏或分布判断，而不能算成离线失败日志。
    en: Inclusion requires evidence of local comparison of candidates with acquired verification material or a sufficiently supported chain. Merely
      stealing or moving hashes, authenticating directly with a hash, speculating that cracking occurred, or performing authorized password audits
      does not automatically qualify; audit authorization must be checked. If a few recovered candidates are later submitted online, that online
      stage is assessed separately by its own pacing or distribution, not counted as offline failure logging.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在域数据库、被动捕获的挑战应答或外泄应用数据库已落入攻击者手中后，攻击者可能将材料移出受害方服务，离线筛选可用秘密，再用其进入目标环境。CISA 关于 Volt Typhoon 的公告把 NTDS.dit 与 SYSTEM 的复制、外传及离线破解串成一个报告链；复制环节仍归材料获取，候选计算才属于本项。
      en: After a domain database, captured challenge-response material, or a leaked application database reaches the adversary, the material
        may be moved away from the victim service for offline candidate testing before any use of a recovered secret. CISA's Volt Typhoon advisory
        links copying NTDS.dit and SYSTEM, exfiltration, and offline cracking in one reported chain. Copying remains material acquisition; candidate
        computation is this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可比对材料、正确的算法或格式知识、候选生成能力和计算时间。强工作因子、唯一盐、长而不可预测的口令会压低成功率；攻击者不必控制目标认证服务，但若要利用恢复的秘密，仍可能面对 MFA、条件访问或口令变更。
        en: The adversary needs comparable material, correct algorithm or format knowledge, candidate generation, and compute time. Strong work
          factors, unique salts, and long unpredictable passwords reduce yield. Control of the target authentication service is unnecessary, but
          later use of a recovered secret may still face MFA, conditional access, or password rotation.
    defender_model:
      paragraphs:
      - zh: 受害方服务端可监控凭据库、域数据库或捕获材料的访问与传输，并能观察后续认证；它不能从自己的失败日志直接看见外部离线计算。若攻击者在受害环境内运行破解程序，终端进程、文件和资源遥测可补充观察，但这不是本项在所有案例中的前提。
        en: The victim can monitor access and transfer of credential stores, domain databases, or captured material and observe later authentication,
          but its own failure logs cannot show external offline computation. If cracking runs inside the victim environment, endpoint process,
          file, and resource telemetry can add visibility, but that is not assumed in every case.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 候选失败退出受害方验证器视野
    en: Remove candidate failures from the victim verifier's view
  analysis:
    paragraphs:
    - zh: 攻击者把验证函数和已获材料放在其控制的计算面执行，原服务端不处理各次猜测，因此既不生成失败事件，也不能以在线锁定限制尝试。该变化产生明确的观察盲区，却没有抹去材料获取及最终使用的事件；NIST 的在线与离线区别和 CISA 报告的离线破解链条提供基础。
      en: The adversary executes a validation function over acquired material on controlled compute. The original service processes none of the
        guesses, so it generates no corresponding failures and cannot enforce online lockout against them. This creates a specific observation
        gap without erasing acquisition or eventual-use events. NIST's online/offline distinction and CISA's reported offline-cracking chain provide
        the basis.
