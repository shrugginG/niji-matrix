research:
  limitations:
    paragraphs:
    - zh: 外部离线计算可能完全不在受害方传感器内；防守检测只能定位材料暴露和后继风险，不能估算真实候选次数或仅凭哈希被盗宣称口令已还原。不同哈希方案的抗离线能力差别很大，生产环境的有效暴露范围应逐库评估。
      en: External offline compute may be wholly outside victim sensors. Detection can identify material exposure and subsequent risk but cannot
        count actual candidates or claim recovery from hash theft alone. Offline resistance varies substantially by hashing scheme, so effective
        exposure must be assessed per store.
