research:
  limitations:
    paragraphs:
    - zh: MITRE 对本行为的描述同时覆盖在线与离线候选验证，但不直接证明本技术三个匿迹变量的效果。Microsoft 案例支持低次数、住宅代理和广域账户尝试的具体事实，却未公开所有请求级数据或明文候选口令。NIST 与 OWASP 支持机制和防御设计，不等于证明个案成功规避了某项控制。CISA
        记录离线破解用途，但不能推出恢复秘密的数量、时间或由此产生的登录。
      en: MITRE describes both online and offline candidate validation but does not directly establish the effects of the three stealth variables
        here. Microsoft cases support specific facts about few attempts, residential proxies, and broad account targeting, yet do not publish
        every request or plaintext candidate. NIST and OWASP support mechanisms and defense design, not proof that an incident evaded a particular
        control. CISA reports offline-cracking purpose but not the number or timing of recovered secrets or logins caused by it.
    - zh: 联合身份、代理入口和短保留日志可能使低频失败无法跨服务连接；普通用户输错与批准测试也可造成类似局部计数。在线 Analytic 需要明确记录实际验证器与认证阶段，离线 Analytic 则需验证材料—账号映射并把无法看见的计算保持为盲区。若这些条件缺失，不能用成功登录倒推特定猜测过程。
      en: Federated identity, proxy entry, and short retention can prevent low-rate failures from being joined across services; user mistakes
        and authorized tests can resemble the same local counts. Online analytics must identify the actual verifier and authentication stage,
        while offline analytics need validated material-to-account mapping and must retain external computation as a blind spot. When those conditions
        are absent, a successful sign-in cannot be used to reconstruct a specific guessing process.
