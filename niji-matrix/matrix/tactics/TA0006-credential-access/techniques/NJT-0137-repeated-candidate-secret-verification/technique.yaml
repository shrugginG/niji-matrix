schema_version: 2.0.0
type: technique
id: NJT-0137
name:
  zh: 候选秘密反复验证
  en: Repeated Candidate-Secret Verification
summary:
  zh: 攻击者反复验证未知秘密，并通过控制验证节奏、分布或位置降低异常认证轨迹的集中度与可见性。
  en: Adversaries repeatedly validate unknown secrets and control verification timing, distribution, or location to reduce the concentration and
    visibility of suspicious authentication traces.
aliases:
- Brute Force
- T1110
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1110
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1110
definition_and_concept:
  paragraphs:
  - zh: 候选秘密反复验证是指攻击者尚不知道可用秘密时，对多个候选口令或凭据组合进行迭代测试，以找出能通过验证的秘密或访问能力。在线实现把请求交给目标认证服务，离线实现则在先前取得哈希或其他可比对材料后由攻击者自行计算与比较。候选来源可以是字典、泄露的组合、环境推断或其他输入；来源类别本身不决定
      Niji 分类。
    en: Repeated candidate-secret verification is iterative testing of passwords or credential combinations while the adversary does not yet know
      a usable secret, seeking a secret or access capability that passes verification. Online attempts submit requests to the target authentication
      service. Offline attempts compare candidates against previously obtained hashes or other verification material under adversary control.
      Candidate input may come from dictionaries, leaked pairs, environmental inference, or other sources; the input category does not define
      the Niji taxonomy.
  - zh: 在 Credential Access 中，本技术的直接成果是秘密被验证，或者至少缩小未知秘密空间；凭据资料的取得、认证路径操纵、会话创建及后续资源访问另有自己的行为边界。匿迹分析针对验证活动怎样进入防守方观察，而不把成功登录或“少量失败”本身当成匿迹证明。
    en: Within Credential Access, the direct result is validation of a secret or at least reduction of the unknown-secret space. Acquisition of
      credential material, manipulation of the authentication path, session creation, and later resource access have separate behavioral boundaries.
      Stealth analysis concerns how validation enters the defender's observation, not an assumption that success or a small failure count by itself
      proves evasion.
stealth_characteristics:
  paragraphs:
  - zh: 在线验证通常在认证服务留下主体、时间、来源、应用、结果以及可能的挑战或锁定状态。攻击者若拉长尝试间隔、把尝试摊到多个账户和来源，单账户、单来源和短窗口的失败峰值会减弱，防守方必须跨更长时间和更多身份连接弱信号。Microsoft 对 Midnight Blizzard
      的调查直接记录其低尝试数与住宅代理分布用于降低发现和阻断概率，但该案例不能证明所有低频尝试都具有同样目的。
    en: Online validation normally leaves principal, time, source, application, result, and sometimes challenge or lockout state at the authentication
      service. By spacing attempts or distributing them across accounts and sources, an adversary reduces peaks in per-account, per-source, and
      short-window failure counts, forcing defenders to connect weak signals over longer periods and more identities. Microsoft's Midnight Blizzard
      investigation directly records low attempt counts and residential proxy distribution used to reduce discovery and blocking, but that case
      does not show the same intent behind every low-rate attempt.
  - zh: 离线验证的关键变化是候选失败不再交给目标服务处理，因此目标服务没有与候选次数一一对应的失败事件。防守方仍可能看到验证材料的获取、外传、终端计算工具或随后使用所得秘密；这些残余痕迹属于不同观察面，不能从服务器缺乏失败日志推出“完全不可见”。强哈希存储、已暴露材料的控制和获得秘密后的额外认证因素改变这一收益。
    en: In offline validation, candidate failures are no longer processed by the target service, so that service has no failure event for each
      candidate tested. Defenders may still observe acquisition or exfiltration of verification material, cracking activity on a monitored endpoint,
      or later use of a recovered secret. Those residual traces occupy different observation surfaces, and missing server failures do not mean
      complete invisibility. Strong hash storage, control of exposed material, and additional authentication factors change the benefit.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入范围要求存在针对未知秘密的重复候选验证，并有可论证的节奏、分布或验证位置变化。用户偶发输错、批准的安全测试、批量密码重置与正常账户恢复可产生相似日志，应结合授权、目标、请求序列和结果排除。单次使用已知有效口令属于有效账户使用；仅收集用户名、密码策略或泄露清单属于前期身份侦查或凭据材料获取。
    en: Inclusion requires repeated candidate validation of an unknown secret and a defensible change in timing, distribution, or verifier location.
      Ordinary mistyping, authorized security tests, bulk password resets, and account recovery can resemble parts of the logs; authorization,
      targets, request sequence, and outcomes must be checked. One-time use of an already known valid password belongs to valid-account use. Merely
      collecting usernames, password policies, or leaked lists belongs to prior identity reconnaissance or credential-material acquisition.
  - zh: T1557 控制凭据承载通信的信任路径，T1110 控制对未知秘密的候选验证；通过中间人得到握手或哈希可以成为离线验证的前提，但路径介入和后续候选测试是两个可分事件。取得哈希本身不等于已破解，哈希的直接重放也不是候选秘密验证。在线失败之后的成功事件需要区分首因验证、MFA
      阻断和真正获得资源访问。
    en: T1557 controls the trust path carrying credential exchanges, whereas T1110 controls candidate validation of an unknown secret. An intercepted
      handshake or hash may become a prerequisite for offline testing, but path intervention and subsequent candidate testing are separable events.
      Hash acquisition alone does not prove cracking, and direct replay of a hash is not candidate-secret verification. A success after online
      failures requires distinguishing a matched primary secret, an MFA block, and actual resource access.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在外部身份提供者、VPN、远程服务或受害环境内的认证入口，攻击者可能已有账户清单，尝试以长期低量验证避开短窗锁定，也可能用多来源和多主体摊薄单点异常。目标若已有被盗哈希、口令数据库或挑战应答材料，攻击者还可在自己控制的计算面离线测试候选，随后才决定是否尝试登录。三个场景分别改变时间密度、关联拓扑和验证事件的存放位置。
      en: At an external identity provider, VPN, remote service, or internal authentication entry, an adversary with an account list may run low-volume
        tests over a long period to avoid short-window controls or spread tests over sources and principals to reduce local anomalies. If the
        adversary already holds stolen hashes, a password database, or challenge-response material, candidates can instead be tested on adversary-controlled
        compute before any login is attempted. The scenarios change temporal density, correlation topology, and the location where verification
        events exist.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 在线攻击者至少需要可达的认证入口、候选秘密与目标身份；时间展延需要较长操作窗口，跨来源分布还需要代理或其他可控来源以及对账户清单的维护。攻击者可能利用错误、挑战或成功响应调整后续尝试，但未必能看到明文服务端判定。离线模型还要求先取得可验证材料、知道其格式并有足够计算资源；复杂度、盐和工作因子决定可行性。这里不预设攻击者已拥有有效账户、MFA
          因子或改变认证策略的权限。
        en: An online adversary needs a reachable authentication endpoint, candidate secrets, and target identities. Temporal spreading requires
          a longer operating period; source distribution also requires controllable egress and maintained account lists. The adversary may adapt
          to error, challenge, or success responses but may not see the service's internal decision. Offline testing additionally requires prior
          access to comparable verification material, knowledge of its format, and sufficient compute; algorithm cost, salt, and work factor determine
          feasibility. The model does not assume a valid account, MFA factor, or authority to change authentication policy.
    defender_model:
      paragraphs:
      - zh: 对在线入口，防守方至少能取得统一的认证结果流，并把主体 ID、事件时间、来源地址、应用、认证阶段和请求标识规范化；联合或混合身份环境需要从实际完成验证的 IdP 与前端服务共同收集，否则缺失失败事件。日志保留期和跨租户可见性限制决定低频分布活动是否可被重建。防守方通常不记录明文候选口令，因此不能仅靠普通登录日志判断多个请求使用同一口令。
        en: For online entry points, the defender is assumed to collect a normalized stream of authentication outcomes with principal ID, event
          time, source address, application, authentication stage, and request identifier. Federated or hybrid identity requires logs from the
          IdP that actually performs verification as well as the front end, or failures may be missing. Retention and cross-tenant visibility
          determine whether low-rate distributed activity can be reconstructed. Ordinary sign-in logs generally do not expose candidate passwords,
          so they cannot by themselves prove that requests used the same password.
      - zh: 对离线验证，目标认证服务只能观察材料被访问或导出以及可能的后续成功认证；只有在攻击者计算设备也受监控时，才可能直接观察破解进程和计算行为。由源系统缺乏失败事件只能推断验证可能发生在视野外，不能单独证明已还原秘密；材料泄露范围和后续认证结果需要独立证据。
        en: For offline validation, the target service can observe access or export of verification material and perhaps later successful authentication.
          Direct observation of cracking processes and compute is possible only if the adversary's compute host is monitored. Missing failure
          events at the source service supports at most the possibility of testing outside its view; it does not prove that a secret was recovered.
          Exposure scope and later authentication outcomes require independent evidence.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 跨时间与来源稀释验证失败
    en: Dilute validation failures across time and sources
  analysis:
    paragraphs:
    - zh: 攻击者将原本集中提交的在线候选分配到较长时间、多个主体或多处出口，使认证失败被拆成局部低计数事件。按单账户、单 IP 或短窗口触发的规则更难把这些请求连接为一次行动，尽管各验证器仍保留单次请求结果。Microsoft 对 Midnight Blizzard 的调查直接支持低尝试数与住宅代理的组合；其它平台是否产生同样效果仍取决于其日志覆盖和关联规则。
      en: The adversary distributes otherwise concentrated online candidates across longer time, multiple principals, or several egress points,
        splitting failures into locally low-count events. Rules keyed only to one account, IP, or short window are less likely to connect them
        as one operation, although each verifier can still retain individual outcomes. Microsoft's Midnight Blizzard investigation directly supports
        the combination of few attempts and residential proxies; equivalent effects elsewhere depend on logging coverage and correlation design.
  confidence: high
  evidence_refs:
  - REF-000497
  - REF-000498
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 离线验证脱离服务端失败遥测
    en: Move offline validation outside server failure telemetry
  analysis:
    paragraphs:
    - zh: 攻击者在取得可比对的哈希或挑战材料后，在服务端之外计算候选并核对结果。因为每次尝试没有提交给原验证器，服务端的失败计数与锁定策略既看不到这些尝试，也不能限制其速率；防守机会转移到材料保护、取用链和后继凭据使用。NIST 对在线限速与离线攻击的区别支持这一机制，但它不保证材料一定能被破解，也不证明攻击者计算主机不可见。
      en: After obtaining comparable hashes or challenge material, the adversary computes and checks candidates outside the service. Because each
        trial is not submitted to the original verifier, its failure count and lockout policy neither see nor rate-limit those trials. Defensive
        opportunity shifts to material protection, access lineage, and subsequent secret use. NIST's distinction between online throttling and
        offline attack supports the mechanism, but it does not guarantee recovery of a secret or invisibility on the attacker's compute host.
  confidence: high
  evidence_refs:
  - REF-000499
  - REF-000025
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术按候选判断如何进入防守视野划分三项子技术。时间展延改变同一可关联在线序列的密度，跨主体与来源分布改变验证事件的账号—来源拓扑，验证器脱离则改变候选判断发生的控制域，使目标服务不再产生逐次失败。前两项可同时成立，但分别要求长窗单身份重建与跨身份图关联；第三项需要材料取用和后继使用链，而非在线登录阈值。
      en: The three children partition how candidate judgments enter the defender's view. Temporal dilution changes density within one linkable
        online sequence; cross-principal and source distribution changes the account-to-source topology of verifier events; detached verification
        changes the control domain where candidates are judged, removing per-trial failures from the target service. The first two can co-occur
        but need different long-horizon principal and cross-identity graph joins. The third needs material-access and later-use lineage instead
        of online login thresholds.
    - zh: 字典猜测、泄露凭据对、密码喷洒和离线破解是候选输入或行为情境，不是直接移植的 Niji 子项名称。同一泄露凭据对可以按时间展延或来源分布提交，已获哈希的离线比较也不等于先前转储材料的行为。离线分析只能报告暴露和可能的后继风险，除非直接看到可信计算端活动，不能以零失败日志断言破解成功。
      en: Dictionary guesses, leaked credential pairs, password spraying, and offline cracking describe candidate input or behavior context rather
        than imported Niji child names. One leaked pair can be submitted with temporal or source distribution, and offline comparison of acquired
        hashes is distinct from the earlier dumping action. Offline analysis reports exposure and possible later risk; absent trusted visibility
        into the compute host, zero server failures cannot prove cracking succeeded.
  coverage: established
  subtechnique_refs:
