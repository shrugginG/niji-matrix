research:
  limitations:
    paragraphs:
    - zh: 原始 KeePass 实验有明确明文导出，但不能证明所有保管库允许同类配置触发器；云库分支有 API 与审计可行性，缺少本批可直接归因的恶意小范围读取案例。受信调用的正常高频会降低身份字段的判别力，必须本地建立消费者到 secret 的用途基线。
      en: The original KeePass experiment proves plaintext export in that product but not equivalent triggers in every vault. Cloud documentation
        establishes API and audit feasibility, while this batch lacks a directly attributed malicious narrow-read case. Frequent legitimate trusted
        calls weaken principal-only discrimination, requiring a local consumer-to-secret purpose baseline.
