research:
  limitations:
    paragraphs:
    - zh: Keydnap 证据聚焦旧版 macOS 的 securityd，不能推断新系统仍保留相同密钥布局。Sysmon ProcessAccess 表示打开进程，不表示成功读取可用秘密；合法诊断与响应也可访问密码管理器进程。检测必须按目标进程和权限收窄，秘密返回需另由转储内容或后继结果证实。
      en: Keydnap evidence concerns legacy macOS securityd and does not establish the same key layout in modern releases. Sysmon ProcessAccess
        means a process was opened, not that a usable secret was read. Authorized diagnostics and response can also access password-manager processes.
        Detection must narrow by target process and rights, while secret return needs separate dump-content or successor evidence.
