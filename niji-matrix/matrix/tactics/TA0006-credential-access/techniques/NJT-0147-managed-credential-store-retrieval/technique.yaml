research:
  limitations:
    paragraphs:
    - zh: 来源支持不同结论层级：Apple、AWS、Google、Azure 和保管库厂商文档证明调用与控制语义；Mandiant 红队实验直接证明一次 KeePass 用户解锁后的明文导出；Keydnap 样本证明旧版 securityd 内存查钥匙的路径。UNC1069
        与 UNC2465 主要证明受保护副本外传，不能把不同事件和产品的解锁能力拼成一条已观察到的完整取密链。云 API 成功也不证明攻击者保存或使用了值。
      en: Sources support different conclusion levels. Apple, AWS, Google, Azure, and vault-vendor documentation establish call and control semantics.
        A Mandiant red-team exercise directly establishes one KeePass plaintext export after user unlock. A Keydnap sample establishes a legacy
        securityd key-search path. UNC1069 and UNC2465 mainly establish protected-copy exfiltration; unlock capabilities from other incidents
        or products cannot be spliced into one observed retrieval chain. Cloud API success does not prove attacker retention or use.
    - zh: 端点逐项审计、Google Data Access 启用状态、Azure 诊断和自托管导出日志均随部署变化；没有这些记录时不能把零日志当作零取用。合法备份、同步、轮换、迁移和故障处置可与恶意活动同形，判断依赖有期限的审批、消费者到秘密的用途基线及输出目的。只有进程访问而没有恢复的密钥或明文时，应保留可疑访问而非确认秘密泄露。
      en: Endpoint per-item audit, Google Data Access enablement, Azure diagnostics, and self-hosted export logs vary by deployment; absent logs
        cannot be treated as absent reads. Legitimate backup, sync, rotation, migration, and recovery can resemble adversarial activity, so judgment
        depends on time-bounded approval, consumer-to-secret purpose baselines, and output destination. Process access without a recovered key
        or plaintext remains suspicious access rather than confirmed secret loss.
