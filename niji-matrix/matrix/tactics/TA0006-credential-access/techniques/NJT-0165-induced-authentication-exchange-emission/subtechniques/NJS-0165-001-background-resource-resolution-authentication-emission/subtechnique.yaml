research:
  limitations:
    paragraphs:
    - zh: Microsoft 的 CVE-2023-23397 资料直接证明特定 Outlook 版本、属性和 SMB 路径，不能无条件推广到每种对象消费者；DarkHydrus 证明的是文档提示与测试凭据而非静默 Net-NTLMv2。ATT&CK 列举的其他载体需要逐事件确认材料确实到达。若只能看到外部
        URI、进程外连或 WebDAV 回退，应保持尝试或暴露结论，不把它升级为捕获成功。
      en: Microsoft's CVE-2023-23397 evidence directly establishes particular Outlook versions, properties, and an SMB path and cannot be generalized
        to every object consumer. DarkHydrus establishes a document prompt and test credentials rather than silent Net-NTLMv2. Other carriers
        listed by ATT&CK require event-specific proof that material arrived. If evidence is limited to an external URI, process connection, or
        WebDAV fallback, retain an attempt or exposure conclusion rather than upgrading it to successful capture.
