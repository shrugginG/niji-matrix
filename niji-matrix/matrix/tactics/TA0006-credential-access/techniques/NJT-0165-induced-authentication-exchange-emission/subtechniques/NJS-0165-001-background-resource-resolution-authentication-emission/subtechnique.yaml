schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0165-001
parent_ref: NJT-0165
name:
  zh: 后台资源解析认证引出
  en: Background-Resource Resolution Authentication Emission
summary:
  zh: 攻击者把网络目标写入会被应用或桌面组件后台解析的对象，使当前用户上下文在没有明确登录动作时发出认证材料。
  en: An adversary places a network target in an object resolved by an application or shell component, causing the current user context to emit
    authentication material without an explicit sign-in action.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 后台资源解析认证引出是攻击者控制一个会被邮件客户端、办公应用、桌面外壳或其他资源消费者自动读取的网络位置，使组件在预览、提醒、图标渲染、打开或枚举时调用当前用户的集成认证。稳定变量是“资源解析代表用户发起认证”，不是文档、图片、快捷方式、UNC 或 SMB 的名称。结果必须是挑战响应或等价材料到达攻击者可观察服务；只有属性存在或连接失败时仍属未决触发。
    en: Background-Resource Resolution Authentication Emission places an adversary-controlled network location in data automatically consumed
      by a mail client, office application, shell, or other resource resolver, causing integrated authentication under the current user during
      preview, reminder processing, icon rendering, open, or enumeration. The stable variable is resource resolution initiating authentication
      on the user's behalf, not the names document, image, shortcut, UNC, or SMB. A challenge response or equivalent material must reach an adversary-observable
      service; a property or failed connection alone remains an unresolved trigger.
stealth_characteristics:
  paragraphs:
  - zh: 后台资源解析认证引出使本子项把认证藏在用户认为是读取内容或系统后台处理的动作中，可没有登录页面、输入框或明显子进程。受信应用的网络连接和当前用户身份与合法模板、共享图标或内网资源相似，简单的“可疑进程读取凭据”规则不适用。残余痕迹包括原对象的外部地址、Mark-of-the-Web
      或投递来源、资源解析进程、目的 IP/端口、NTLM 目标和失败/成功结果；Microsoft 强调 SMBClient 失败事件只证明尝试，因此检测必须标注结果层级。
    en: Background-Resource Resolution Authentication Emission means that this child embeds authentication in an action the user perceives as
      content access or background processing, potentially without a sign-in page, input field, or conspicuous child process. A trusted application's
      connection under the current user can resemble a legitimate template, shared icon, or intranet resource, so rules for a suspicious process
      reading credentials do not apply. Residual traces include the external address in the source object, Mark-of-the-Web or delivery origin,
      resolver process, destination IP and port, NTLM target, and failed or successful outcome. Microsoft stresses that failed SMBClient events
      establish only an attempt, so detection must label outcome stage.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对象属性或元数据由受害应用解析，并因此向攻击者可观察位置实际发出认证材料的行为；用户点击可以存在但不是分类轴。文档 attachedTemplate 场景的引用入口由 NJS-0119-002 解释，本子项只在认证交换到达也已证实时与其并列。普通网页登录、仿冒表单、用户主动输入密码和实时反向代理归钓鱼或首次入口；攻击者通过
      DNS/ARP/WPAD 改变原本合法资源的路径归 NJT-0136。载体或协议变化不得单独建立兄弟项。
    en: Scope includes object properties or metadata resolved by a victim application that consequently emit authentication material to an adversary-observable
      location; a click may occur but is not the classification axis. NJS-0119-002 owns the external-reference entry for an attachedTemplate event,
      while this child can coexist only when arrival of the authentication exchange is also established. Ordinary web sign-in, counterfeit forms,
      user-entered passwords, and real-time reverse proxies belong to phishing or first entry. DNS, ARP, or WPAD changes to the path of an otherwise
      legitimate resource belong to NJT-0136. Carrier or protocol variation cannot create another sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Microsoft 在真实调查中确认 CVE-2023-23397 恶意 Outlook 消息用指向攻击者 SMB 共享的提醒声音属性触发 Net-NTLMv2 外发，用户无需打开消息，属性还可设定未来提醒时间。ATT&CK 固定页另记录快捷或外壳对象在图标渲染时加载外部资源的行为；这些实现共同支持后台解析轴。DarkHydrus
        的远程模板提示并收到测试凭据说明文档引用的交互分支可产生同类结果，但该事件的载体检测继续复用文档专用对象。
      en: Microsoft confirmed in incident investigation that a malicious Outlook message using a reminder-sound property pointing to an adversary
        SMB share triggered Net-NTLMv2 emission without the user opening the message, and the property could schedule a later reminder. The fixed
        ATT&CK page also records shortcut or shell objects loading external resources during icon rendering. These implementations jointly support
        the background-resolution axis. DarkHydrus's remote template prompt and receipt of test credentials shows an interactive document-reference
        branch can produce the same outcome, while its carrier detection remains in the document-specific objects.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要把资源地址送入目标客户端会自动或半自动解析的字段，控制能提出认证挑战的服务，并使网络出口和认证策略允许交换。成功取决于应用版本、受信区域、协议回退、当前登录主体以及终端是否连到监听端；用户身份和收件身份可能不同。补丁、外部 SMB 阻断、应用网络隔离、NTLM
          限制和只对批准域启用集成认证会阻断或降级本路径。
        en: The adversary needs to place a resource address in a field that the target client resolves automatically or with incidental interaction,
          control a service able to issue an authentication challenge, and encounter egress and authentication policy that permits the exchange.
          Success depends on application version, trust zone, protocol fallback, current signed-in principal, and connectivity to the listener;
          the authenticated principal can differ from the message recipient. Patching, external SMB blocking, application network isolation, NTLM
          restriction, and limiting integrated authentication to approved domains block or reduce this path.
    defender_model:
      paragraphs:
      - zh: 防守方需要保留原始消息或对象的属性及哈希、投递与解析时间、处理进程、DNS/网络目的地、SMBClient/NTLM 事件和可用的接收端结果。仅有邮件网关或端点任一侧时难以证明完整链；网络连接由系统服务代发时，进程到对象的关系也可能丢失。检测应先输出“恶意引用”“出站认证尝试”“材料到达”和“后继使用”等分级结果，再由证据提升置信度。
        en: Defenders need the original message or object properties and hash, delivery and resolution times, consuming process, DNS and network
          destination, SMBClient or NTLM events, and any available receiver result. A mail gateway or endpoint view alone may not prove the chain,
          and process-to-object lineage can be lost when a system service makes the connection. Detection should emit graded states such as malicious
          reference, outbound authentication attempt, material arrival, and successor use, then raise confidence as evidence accumulates.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 正常资源读取外观遮蔽认证材料外发
    en: Ordinary resource-resolution appearance masks authentication-material emission
  analysis:
    paragraphs:
    - zh: 恶意地址进入原本用于提醒、图标、模板或媒体的字段，受信消费者随后调用系统网络与认证功能。终端看到熟悉应用和正常资源访问语义，真正恶意特征在对象来源、地址权威和认证目的地。CVE-2023-23397 的无交互触发与 DarkHydrus 的模板实验分别证明静默和提示式分支；合法企业模板和内部共享说明为何单靠进程或协议不能定性。
      en: A malicious address occupies a field ordinarily used for reminders, icons, templates, or media, after which a trusted consumer invokes
        system networking and authentication. The endpoint sees a familiar app and ordinary resource-access semantics, while the malicious feature
        lies in object provenance, address authority, and authentication destination. CVE-2023-23397 and the DarkHydrus template experiment establish
        no-interaction and prompted branches respectively. Legitimate enterprise templates and internal shares show why process or protocol alone
        cannot decide intent.
