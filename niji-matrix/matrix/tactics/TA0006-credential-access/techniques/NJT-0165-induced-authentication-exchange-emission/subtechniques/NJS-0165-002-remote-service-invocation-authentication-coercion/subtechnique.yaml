research:
  limitations:
    paragraphs:
    - zh: PetitPotam 是公开 PoC，Microsoft KB 说明潜在攻击与 AD CS 中继缓解，但本批未找到可独立核验的在野案例同时公开原始 RPC 调用、监听端挑战响应和最终目标结果。接口可调用性随补丁、服务状态与权限变化，不能把端口开放或 EfsRpcOpenFileRaw
        错误码等同材料已捕获。正式案例置信度应由监听端证据和受害端关联共同决定。
      en: PetitPotam is a public proof of concept, and Microsoft's KB describes potential attack and AD CS relay mitigation, but this batch found
        no independently verifiable in-the-wild case publishing the original RPC call, listener-side challenge response, and final target outcome
        together. Interface reachability changes with patches, service state, and authorization, so an open port or EfsRpcOpenFileRaw error code
        cannot be equated with captured material. Formal case confidence should depend on both listener evidence and victim-side correlation.
