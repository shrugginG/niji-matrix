research:
  limitations:
    paragraphs:
    - zh: 证据层级不对称。Microsoft 的 CVE-2023-23397 调查提供在野利用、材料泄露、无交互触发和检测局限，DarkHydrus 提供文档提示与服务端测试凭据；服务胁迫主要由官方协议、原始 PoC 和厂商缓解支撑，缺少本批可独立核验的完整在野链。不能把不同来源的调用、捕获和中继拼成一个已观察事件，正式对象应把服务分支案例置信度低于其能力置信度。
      en: Evidence levels are asymmetric. Microsoft's CVE-2023-23397 investigation provides observed exploitation, material leakage, no-interaction
        triggering, and detection limits, while DarkHydrus provides a document prompt and server-side test credentials. Service coercion rests
        mainly on an official protocol, original proof of concept, and vendor mitigation and lacks a fully verifiable in-the-wild chain in this
        batch. Calls, capture, and relay from different sources cannot be spliced into one observed event; the formal object should keep service-branch
        case confidence below capability confidence.
    - zh: 端点对象属性、RPC 方法参数、8004、Sysmon Event 3 和监听端结果在多数环境不会同时存在，实际 Analytic 必须先验证采集与字段保留。合法单点登录、模板、共享、备份、打印、监控和证书注册与恶意链高度同形；精度依赖目的地和调用关系清单。若只能证明触发或连接尝试，应保留
        exposure/attempt，不得宣称凭据材料已经获取。
      en: Endpoint object properties, RPC method parameters, event 8004, Sysmon Event 3, and listener outcomes rarely coexist by default, so deployment
        must validate collection and field retention first. Legitimate single sign-on, templates, shares, backup, printing, monitoring, and certificate
        enrollment strongly resemble the malicious chain, making destination and call-relationship inventories essential. If evidence establishes
        only a trigger or connection attempt, retain exposure or attempt status rather than claiming credential material was acquired.
