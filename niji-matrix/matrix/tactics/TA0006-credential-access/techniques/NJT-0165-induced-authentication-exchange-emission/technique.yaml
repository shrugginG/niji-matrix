schema_version: 2.0.0
type: technique
id: NJT-0165
name:
  zh: 诱发认证交换外发
  en: Induced Authentication-Exchange Emission
summary:
  zh: 攻击者操纵资源解析或远程服务调用，使受害用户或设备在看似正常的应用与系统流程中向攻击者可观察目标发出认证交换。
  en: An adversary manipulates resource resolution or a remote service invocation so a victim user or device emits an authentication exchange
    to an adversary-observable target through an apparently ordinary application or system flow.
aliases:
- Forced Authentication
- T1187
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1187
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1187
definition_and_concept:
  paragraphs:
  - zh: 诱发认证交换外发是攻击者布置一个由受害端自动解析的网络引用，或调用一个会代表受害设备访问网络资源的服务操作，使受害用户、服务或机器账户向攻击者可观察位置产生认证挑战应答、协商消息或等价材料。其直接目的不是让受害者完成一次自己选择的登录，而是把已有身份上下文转化为攻击者可取得的认证证明。实现可以经过文件共享、Web
      资源或远程管理协议，但协议和载体只决定传输与传感器，不决定技术身份。
    en: Induced Authentication-Exchange Emission occurs when an adversary plants a network reference that a victim endpoint resolves automatically,
      or invokes a service operation that accesses a network resource on behalf of the victim device, causing a user, service, or machine account
      to produce a challenge response, negotiation message, or equivalent material at an adversary-observable location. The immediate purpose
      is to turn an existing identity context into an authentication proof available to the adversary, rather than to complete a login chosen
      by the victim. File sharing, web resources, and remote-management protocols change transport and sensors, not technique identity.
  - zh: 证据链必须依次区分诱因被投递或远程调用被接受、目标设备实际发起连接、认证协议产生材料、攻击者端或中继节点确实观察到材料，以及材料被破解或被其他服务接受。Microsoft 对 CVE-2023-23397 的调查直接证明恶意消息属性可在无用户交互时触发 Net-NTLMv2
      材料泄露，并明确指出失败的 SMBClient/WebDAV 痕迹只能证明外连尝试；EFSRPC 规范和 PetitPotam 实验则证明合法远程服务方法可被用来促使服务器向指定监听位置认证。任何阶段缺失都应降低结论，不可从 UNC 字符串或失败连接直接推断凭据已获。
    en: Evidence must separately establish delivery of a lure or acceptance of a remote invocation, an actual victim connection, production of
      authentication material, observation of that material at an adversary endpoint or relay, and later cracking or acceptance by another service.
      Microsoft's CVE-2023-23397 investigation directly establishes a malicious message property causing Net-NTLMv2 leakage without user interaction
      and explicitly warns that failed SMBClient or WebDAV artifacts prove only a connection attempt. The EFSRPC specification and PetitPotam
      experiment establish that a legitimate remote service method can be used to make a server authenticate to a chosen listener. Missing stages
      require lower confidence; a UNC string or failed connection cannot alone establish credential acquisition.
stealth_characteristics:
  paragraphs:
  - zh: 诱发认证通常借用应用读取远程资源、桌面渲染图标、消息提醒处理或系统服务访问网络对象等正常功能，终端侧因此可能只看到受信进程或系统服务发起一次普通网络连接，认证材料则在远端被观察。Microsoft 说明 CVE-2023-23397 不需要用户打开消息，且传统端点取证痕迹很少；这使“用户没有登录动作”不能排除认证交换。异常辨识需要恢复谁控制了目标地址、哪个对象或调用触发连接、认证使用了哪个主体，以及远端是否收到挑战响应。
    en: Induced authentication commonly reuses ordinary functions such as application retrieval of a remote resource, shell icon rendering, reminder
      processing, or a system service accessing a network object. The endpoint may therefore show only a trusted process or system service making
      an ordinary connection while the material is observed remotely. Microsoft states that CVE-2023-23397 requires no message interaction and
      leaves few traditional endpoint forensic artifacts, so the absence of an explicit sign-in action does not exclude an authentication exchange.
      Discrimination requires reconstructing who controlled the destination, which object or invocation triggered the connection, which principal
      authenticated, and whether the remote side received a response.
  - zh: 攻击者还可把投递与认证触发分离，或把入站远程调用、受害机外连与后继中继分散到不同主机和时间。Outlook 恶意提醒属性可设置为未来触发；服务胁迫则由攻击者先连入 RPC 接口，再由服务进程以机器或服务身份连接另一目标。局部日志会分别呈现邮件或对象、合法服务调用和正常账户认证，只有跨对象哈希、消息属性、进程、RPC
      接口、账户、目的地与窄时间窗关联后才形成完整链。延迟和分面不会抹除证据，但会削弱只看用户点击或单一服务器登录的规则。
    en: The adversary may separate delivery from authentication in time, or distribute an inbound remote invocation, victim egress, and later
      relay across different hosts. A malicious Outlook reminder property can be scheduled for a later time; service coercion begins with an inbound
      RPC call and continues when a service process connects elsewhere using a machine or service identity. Local logs separately resemble a message
      or object, a legitimate service call, and an ordinary account authentication. The complete chain emerges only through object hash, message
      property, process, RPC interface, account, destination, and narrow-window correlation. Delay and split observation do not erase evidence,
      but weaken rules limited to user clicks or one server's login log.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求攻击者对触发对象、远程调用或认证目的地至少具有一项可证明的控制，并且受害主体实际产生认证材料到达攻击者可观察目标。合法内网单点登录、企业文件共享、备份、打印、证书注册和获批远程管理可产生相同协议交换；必须以对象来源、调用授权、目标清单、账户用途和结果排除。只有诱因、可利用接口、漏洞存在、DNS/SMB
      连接尝试或 WebDAV 回退而没有材料到达证据时，只能记录暴露或未决状态。
    en: Inclusion requires evidence that the adversary controlled at least one of the triggering object, remote invocation, or authentication
      destination, and that the victim principal actually produced authentication material that reached an adversary-observable target. Legitimate
      intranet single sign-on, enterprise shares, backup, printing, certificate enrollment, and authorized remote administration can produce the
      same protocol exchanges and require exclusion through object provenance, call authorization, destination inventory, account purpose, and
      outcome. A lure, reachable interface, vulnerability, DNS or SMB connection attempt, or WebDAV fallback without evidence of material arrival
      supports exposure or unresolved status only.
  - zh: NJT-0119/NJS-0119-002 解释文档外部引用如何把静态对象与运行时认证结果分离；文档模板既证明引用变量又证明认证材料到达时，可与本技术并列，文档或图片名称本身不得成为本技术子项。首次入口中的仿冒登录页和实时身份提供方代理归钓鱼及相应入口技术；NJT-0136
      需要攻击者改变既有认证路径或把证明转给另一目标，本技术只解释为何受害端主动产生证明。捕获后的离线比较归 NJS-0137-003；密码成功破解、证明在目标服务被接受、Cookie 或令牌取得以及账户实际使用都必须另证。
    en: NJT-0119/NJS-0119-002 explains how a document external reference separates a static object from a runtime authentication outcome. A template
      event can carry both labels when it proves the reference variable and material arrival, but document or image labels cannot become children
      here. A counterfeit sign-in page or real-time identity-provider proxy at first entry belongs to phishing and its entry techniques. NJT-0136
      requires alteration of an existing authentication path or forwarding a proof to another destination; this technique explains why the victim
      emitted the proof. Offline comparison after capture belongs to NJS-0137-003. Successful cracking, acceptance at a target service, cookie
      or token acquisition, and actual account use each require separate evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在终端场景中，攻击者可投递含外部资源地址的消息、日历项、快捷对象或其他会被客户端后台解析的元数据，使应用或桌面组件以当前用户上下文访问监听端；CVE-2023-23397 证明提醒属性甚至可在用户不打开消息时触发。文档 attachedTemplate 弹出认证提示并把测试凭据发给服务端的
        DarkHydrus/Phishery 事件属于文档专用重叠子集。载体换成图标、媒体或其他属性不改变“后台解析代替显式登录动作”的变量。
      en: In endpoint scenarios, an adversary can deliver a message, calendar item, shortcut-like object, or other metadata containing an external
        resource address that a client resolves in the background, causing an application or shell component to contact a listener under the current
        user context. CVE-2023-23397 proves that a reminder property can trigger without the user opening the message. The DarkHydrus and Phishery
        event in which an attachedTemplate produced an authentication prompt and sent test credentials to the server is a document-specific overlapping
        subset. Replacing the carrier with an icon, media reference, or another property does not change the variable of background resolution
        substituting for an explicit sign-in action.
    - zh: 在服务器场景中，拥有网络可达性及所需调用权限的攻击者可向 EFSRPC 或同类远程服务方法提供自己控制的资源位置，促使目标服务以机器或服务身份出站认证。PetitPotam 原始 PoC 与 Microsoft KB5005413 支持这种能力和 NTLM 中继风险；但公开资料不能证明每次调用都成功捕获材料，也不能把实验自动升级为在野攻击。若攻击者随后将证明中继到
        AD CS、SMB 或 LDAP，后半段按目标服务的受众绑定与结果另行建模。
      en: In server scenarios, an adversary with network reachability and the required call authority can provide an adversary-controlled resource
        location to EFSRPC or a comparable remote service method, causing the target service to authenticate outbound under a machine or service
        identity. The original PetitPotam proof of concept and Microsoft KB5005413 support the capability and NTLM relay risk, but public evidence
        does not show that every invocation captures material and a laboratory capability is not an in-the-wild case. If the adversary later relays
        the proof to AD CS, SMB, or LDAP, that successor stage is modeled separately through target-service audience binding and outcome.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 后台解析分支要求攻击者能把一个指向可观察服务的资源地址写入目标会接收并解析的对象，还需受害应用、网络策略和认证区域允许自动或提示式认证。服务胁迫分支要求可访问相应远程接口、满足其调用认证或访问条件，并能让服务解释攻击者指定的网络名称。两者都需要控制监听位置并完成协议挑战；外发
          SMB 阻断、NTLM 限制、受信区域边界、RPC 接口收窄、服务停用、签名和通道绑定会降低可用性。
        en: The background-resolution branch requires the adversary to write an observable-service address into an object the target will receive
          and resolve, while the victim application, network policy, and authentication zone must permit automatic or prompted authentication.
          The service-coercion branch requires access to the remote interface, satisfaction of its call authentication or access conditions, and
          the ability to make the service interpret an attacker-selected network name. Both require control of a listener and completion of a
          protocol challenge. Outbound SMB blocking, NTLM restriction, trusted-zone boundaries, narrower RPC exposure, service disablement, signing,
          and channel binding reduce feasibility.
      - zh: 攻击者不因收到一次连接就必然获得可复用口令。Net-NTLMv2 是绑定具体挑战的响应，后续可否离线求得口令取决于口令强度和计算资源，可否中继取决于目标协议、签名、EPA 或通道绑定。机器账户材料和用户材料的后继价值也不同；正式案例必须保留主体类型、挑战与响应是否完成、监听或目标结果，而不能把所有“哈希”统称为可直接重放的密码哈希。
        en: One connection does not necessarily yield a reusable password. Net-NTLMv2 is a response bound to a particular challenge; offline recovery
          depends on password strength and compute, while relay depends on target protocol, signing, EPA, or channel binding. Machine-account
          and user material also have different successor value. Formal cases must retain principal type, whether challenge and response completed,
          and listener or target outcome rather than calling every “hash” a directly replayable password hash.
    defender_model:
      paragraphs:
      - zh: 防守方假定可以从邮件或文件入口、端点进程与网络、Windows NTLM 审计、目标服务认证和 RPC/服务遥测中取得至少两个观察面。Sysmon Event 3 可按 ProcessGuid 连接进程与目的地址但默认关闭；Windows 事件 8004 可补充访问服务器线索；4624
          在接收目标提供网络登录、账户和来源，但字段完整性依协议而变。分析必须明确哪个事件只证明连接、哪个证明挑战响应到达、哪个证明目标服务成功，并对未启用日志、加密 RPC、个人设备和攻击者监听端不可见列出盲区。
        en: The defender is assumed to obtain at least two observation planes from message or file ingress, endpoint process and network telemetry,
          Windows NTLM audit, target-service authentication, and RPC or service telemetry. Sysmon Event 3 links processes to destinations through
          ProcessGuid but is disabled by default. Windows event 8004 can add accessed-server clues, and 4624 supplies network-logon, account,
          and origin data on the receiving target, although fields vary by protocol. Analysis must state which event proves only a connection,
          which establishes response arrival, and which establishes target-service success, with blind spots for disabled logs, encrypted RPC,
          personal devices, and an invisible adversary listener.
      - zh: 防守基线应描述哪些应用和服务可使用集成认证、允许的目的地、正常账户类型、远程调用者和业务窗口。只对白名单进程放行会漏掉受信进程中的恶意属性；只按外部 445 告警会漏掉内部监听、Web 认证或服务胁迫；只看域控认证又无法恢复最初诱因。有效检测需要把触发来源、受害端外连与认证结果放在同一因果图中，同时对企业模板、内部共享、备份、打印和证书注册保留有期限的精确例外。
        en: The defender baseline should describe which applications and services may use integrated authentication, allowed destinations, expected
          principal types, remote callers, and business windows. Allowlisting a process misses malicious properties interpreted by a trusted application;
          alerting only on external port 445 misses internal listeners, web authentication, or service coercion; domain-controller authentication
          alone cannot recover the initial trigger. Effective detection joins trigger provenance, victim egress, and authentication outcome in
          one causal graph while keeping time-bounded precise exceptions for enterprise templates, internal shares, backup, printing, and certificate
          enrollment.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 受信应用与服务外观掩盖被诱发的认证
    en: Trusted application and service appearance masks induced authentication
  analysis:
    paragraphs:
    - zh: 攻击者不必部署一个明显的凭据读取进程，而是让 Outlook、桌面外壳或系统服务按原有功能访问网络资源并调用系统认证栈。进程名、签名、账户和协议都可与合法内网访问相同，恶意差异藏在对象属性、远程调用来源与未经批准的目的地。CVE-2023-23397 的无交互 Outlook
        触发和 PetitPotam 的服务调用直接证明行为可以由受信组件完成；这种特征伪装不会消除外连和认证痕迹，要求防守方比较上下文而不是把进程身份当作合法意图。
      en: The adversary need not deploy an obvious credential-reading process. Outlook, a shell component, or a system service accesses a network
        resource through its ordinary function and invokes the system authentication stack. Process name, signature, account, and protocol can
        match legitimate intranet access, while the malicious difference lies in an object property, remote caller, or unapproved destination.
        The no-interaction Outlook trigger in CVE-2023-23397 and service invocation in PetitPotam directly establish execution by trusted components.
        This feature disguise does not remove connection and authentication traces; defenders must compare context rather than equating process
        identity with legitimate intent.
  confidence: high
  evidence_refs:
  - REF-000705
  - REF-000707
  - REF-000709
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 投递调用与认证结果跨时间和观察面分离
    en: Delivery or invocation is separated from authentication across time and observation planes
  analysis:
    paragraphs:
    - zh: 恶意属性可先进入邮箱并在未来提醒时触发，远程服务胁迫则把入站调用、目标服务外连和攻击者端挑战响应分布到不同节点。单个短窗口分别看到邮件、RPC 或网络登录，难以直接重建同一操作；Microsoft 对未来提醒属性和有限传统取证痕迹的说明直接支持时间分离，EFSRPC
        调用链支持控制面与外连面的空间分离。尚无跨环境量化告警下降研究，因此该机理对行为和重建负担为中等置信，不能宣称所有载体都具有延迟效果。
      en: A malicious property can enter a mailbox and trigger at a later reminder time, while remote service coercion distributes the inbound
        call, victim-service egress, and attacker-side challenge response across nodes. A short local window sees a message, RPC call, or network
        logon separately and may fail to reconstruct one operation. Microsoft's description of future reminder properties and scarce traditional
        artifacts directly supports temporal separation; the EFSRPC call chain supports control-plane-to-egress spatial separation. No cross-environment
        study quantifies alert reduction, so the behavior and reconstruction burden receive medium confidence and cannot be generalized as delay
        for every carrier.
  confidence: medium
  evidence_refs:
  - REF-000705
  - REF-000706
  - REF-000707
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式两项子技术按谁触发认证及防守方需要恢复的起点划分。后台资源解析认证引出从用户可见对象或应用后台解析开始，由受信应用在当前用户上下文发出认证；远程服务调用认证胁迫从攻击者对受害服务方法的入站调用开始，由机器或服务主体回连。两项都可产生挑战响应，却具有不同的对象谱系、调用者、主体和正常业务基线。
      en: The two children are separated by what triggers authentication and the starting point defenders must recover. Background-resource resolution
        begins with a user-visible object or application background resolution and emits authentication under the current user. Remote-service
        invocation begins with an adversary call to a victim service method and produces a machine or service-principal callback. Both may expose
        challenge responses but differ in object lineage, caller, principal, and business baseline.
    - zh: 文档、图标、日历、UNC、SMB/WebDAV、RPC 和 EFSRPC 是载体或协议，不成为兄弟项。文档模板子集可与 NJT-0119 并列；改变路径或把证明中继给另一目标归 NJT-0136，捕获后离线猜测归 NJT-0137。只有挑战响应或等价认证材料实际到达攻击者可观察面时，才达到凭据获取结果。
      en: Documents, icons, calendar items, UNC, SMB or WebDAV, RPC, and EFSRPC are carriers or protocols rather than sibling definitions. The
        document-template subset can co-occur with NJT-0119. Path alteration or relaying proof to another target belongs to NJT-0136, and offline
        guessing after capture belongs to NJT-0137. Credential acquisition requires the challenge response or equivalent authentication material
        to reach an attacker-observable surface.
  coverage: established
  subtechnique_refs:
  - NJS-0165-001
  - NJS-0165-002
