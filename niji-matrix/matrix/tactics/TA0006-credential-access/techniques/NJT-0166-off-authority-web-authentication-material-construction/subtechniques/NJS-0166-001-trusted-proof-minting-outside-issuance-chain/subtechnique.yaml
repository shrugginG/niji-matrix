research:
  limitations:
    paragraphs:
    - zh: Solorigate 公开资料确认两条取得签名能力的路径和攻击者创建令牌，但未公开每个受害者的完整断言字段、签发日志缺口或资源操作序列。Mandiant 2026 结果是受控评估而非外部攻击事件，Zimbra 是能力文档。它们共同支持机制和可检测差分，不能用于估计在野频率、默认日志覆盖或所有
        IdP 的字段可用性。
      en: Public Solorigate reporting confirms two paths to signing capability and attacker-created tokens but does not publish complete assertion
        fields, issuance-log gaps, and resource-action sequences for each victim. Mandiant's 2026 result is a controlled assessment rather than
        an external attack, and Zimbra is capability documentation. Together they support the mechanism and detectable differential, but they
        cannot estimate prevalence, default logging coverage, or field availability across every IdP.
