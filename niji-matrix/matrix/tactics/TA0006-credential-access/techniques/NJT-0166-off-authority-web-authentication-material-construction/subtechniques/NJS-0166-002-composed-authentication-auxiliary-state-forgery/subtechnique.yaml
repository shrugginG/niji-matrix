research:
  limitations:
    paragraphs:
    - zh: 公开直接事件集中在 Dark Halo 对旧式 Duo—OWA 集成的利用；当前 Duo Web SDK 使用每会话 state 和服务器端授权码交换，不应把旧 akey/duo-sid 细节当作现代产品字段。其他应用若用不同 Cookie、回调或服务器状态，需要重新证明绑定语义和日志字段，不能只替换产品名称。
      en: Direct public incident evidence centers on Dark Halo's abuse of a legacy Duo and OWA integration. The current Duo Web SDK uses per-session
        state and server-side authorization-code exchange, so old akey and duo-sid details are not modern product fields. Applications using different
        cookies, callbacks, or server state need fresh evidence of binding semantics and log fields rather than product-name substitution.
