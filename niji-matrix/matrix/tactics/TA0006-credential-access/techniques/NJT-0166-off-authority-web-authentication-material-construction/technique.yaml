research:
  limitations:
    paragraphs:
    - zh: 证据层级跨协议且不均衡。Microsoft 的 Solorigate 调查提供在野签名能力取得、攻击者创建 SAML 和云访问链；Volexity 提供同一事件中主认证、Duo 零事件、Cookie 与集成秘密；Mandiant 2026 是受控签发密钥恢复与接受实验；OASIS、Zimbra、Duo
        和 AWS 是协议或产品语义。不得把受控实验和能力文档升级为在野频率，也不得把不同来源阶段拼成同一受害者完整链。
      en: Evidence strength differs across protocols. Microsoft Solorigate reporting provides an in-the-wild chain from acquisition of signing
        capability to attacker-created SAML and cloud access. Volexity provides primary authentication, no Duo event, a cookie, and an integration
        secret in one incident. Mandiant 2026 is a controlled key-recovery and acceptance assessment. OASIS, Zimbra, Duo, and AWS provide protocol
        or product semantics. Controlled experiments and capability documentation do not establish field prevalence, and stages from different
        sources cannot be spliced into one victim's complete chain.
    - zh: 日志缺口检测高度依赖本地配置。AD FS 审计可能未启用，SaaS 不一定导出 assertion 或 signer，合法 IdP 发起 SSO 和续期也可能缺主认证；旧应用则可能只记录最终 allow。正式 Analytic 应先报告 coverage_state，再按精确
        ID、弱关联和资源结果分级。轮换 signer、共享秘密与全局会话可能造成业务中断，必须在保全证据后按厂商程序执行并验证旧材料在所有依赖方失效。
      en: Gap detection depends heavily on local configuration. AD FS audit may be disabled, SaaS services may omit assertion or signer data,
        legitimate IdP-initiated SSO and renewal may lack fresh authentication, and legacy applications may record only final allow. A formal
        analytic should report coverage_state first and tier exact identifiers, weak joins, and resource outcomes. Rotating signers, shared secrets,
        and all sessions can disrupt business and must follow vendor procedures after evidence preservation, with old material tested for denial
        at every relying party.
