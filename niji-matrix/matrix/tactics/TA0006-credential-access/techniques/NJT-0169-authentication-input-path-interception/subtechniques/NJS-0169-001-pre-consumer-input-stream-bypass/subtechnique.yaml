schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0169-001
parent_ref: NJT-0169
name:
  zh: 消费者前输入流旁路
  en: Pre-Consumer Input-Stream Bypass
summary:
  zh: 攻击者在输入进入预期应用或验证者之前复制事件或字符，使真实消费者继续正常处理而应用审计缺少副本记录。
  en: The adversary copies events or characters before input reaches the intended app or verifier, allowing the genuine consumer
    to continue normally without an application record of the copy.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 消费者前输入流旁路是在认证输入尚未被目标应用、浏览器字段或验证函数解释时，攻击者从操作系统事件链、输入设备、事件 tap、全局 Hook、输入法或等价会话面复制字符或操作序列。直接目标是取得能够重建认证秘密的输入，同时让原事件继续交给真实消费者。键盘、鼠标、粘贴和平台
      API 是载体；只有实际输入内容或可还原结果被复制才成立。
    en: Pre-Consumer Input-Stream Bypass copies characters or action sequences from an operating-system event chain, input
      device, event tap, global hook, input method, or equivalent session surface before authentication input is interpreted
      by the target app, browser field, or verification function. Its direct objective is input that can reconstruct an authentication
      secret while the original event continues to the genuine consumer. Keyboard, mouse, paste, and platform APIs are carriers;
      the child requires copied content or a reconstructable result.
stealth_characteristics:
  paragraphs:
  - zh: 消费者前输入流旁路使真实应用、页面和身份服务无需被修改，认证记录也不必包含读取者。短窗只检查登录页完整性或异常认证结果时，副本可能落在观察范围之外。残余痕迹包括新输入监控授权、非批准进程访问 /dev/input、低层 Hook
      或事件 tap、字符缓冲文件以及观察进程的网络连接；合法输入法、辅助功能与远程支持会产生强反例。
    en: Pre-Consumer Input-Stream Bypass can leave the genuine app, page, and identity service unchanged, and authentication
      records need not identify the observer. A short window limited to login-page integrity or anomalous authentication outcomes
      may miss the copy. Residual traces include new input-monitoring authority, an unapproved process accessing /dev/input,
      a low-level hook or event tap, character-buffer files, and network connections from the observing process. Legitimate
      input methods, accessibility, and remote support are strong counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须证明观察点先于预期消费者并有认证内容结果。安装 Hook、轮询按键状态、取得 TCC 权限或读取设备句柄但没有字符、字段或可验证缓冲结果时，仅是能力。屏幕 OCR 归 T1113，读取剪贴板中长期保存的秘密可能归 T1552；只有粘贴作为当前认证输入且复制与提交事件可关联时才纳入。窗口条件若决定何时开始观察，由
      NJS-0132-001 记录该门控，不在这里形成兄弟项。
    en: Inclusion requires an observation point before the intended consumer and an authentication-content result. Hook installation,
      key-state polling, TCC authority, or an input-device handle without characters, fields, or a verifiable buffer is capability
      only. Screen OCR belongs to T1113, and reading a secret long resident on the clipboard may belong to T1552; paste is
      included only when it is current authentication input and the copy can be joined to submission. If window state decides
      when observation begins, NJS-0132-001 records that gate and it does not form a sibling here.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在登录用户的终端驻留，等待用户向 VPN、密码管理器、管理员工具或云门户输入秘密，并由低层键盘 Hook、macOS event tap 或 Linux 输入设备读取复制内容。DRBControl 在 RDP 会话运行键盘记录线程并把窗口和进程上下文写入混淆文件，说明输入事件、上下文和输出可以在真实应用之外形成独立采集链。
      en: An adversary resident on a logged-in endpoint waits for a user to enter a secret into a VPN, password manager, administrative
        tool, or cloud portal, then copies it through a low-level keyboard hook, macOS event tap, or Linux input-device read.
        DRBControl ran a keylogging thread in RDP sessions and wrote window and process context to an obfuscated file, showing
        that input events, context, and output can form a separate acquisition chain outside the genuine app.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问目标交互会话或全局输入面，并能够把事件转换为正确布局下的字符、识别认证上下文并保存结果。输入权限、会话隔离、secure desktop、驱动保护、应用沙箱和用户未输入秘密都会限制结果；长时间观察增加驻留与输出痕迹。
        en: The attacker needs access to the target interactive session or global input surface and must translate events
          into characters under the correct layout, identify authentication context, and preserve the result. Input permissions,
          session isolation, secure desktop, driver protection, app sandboxing, and the user's failure to enter a secret constrain
          results; prolonged observation increases dwell and output traces.
    defender_model:
      paragraphs:
      - zh: 防守方需要经过实测的 API、设备或权限遥测和进程输出数据。Windows 的常规 Sysmon 不能直接证明 SetWindowsHookEx 调用；macOS TCC 只说明授权；Linux auditd 需预置 /dev/input
          规则。只有把输入面访问与同进程缓冲或外联关联，才能从暴露升级为捕获结论。
        en: The defender needs pilot-validated API, device, or permission telemetry plus process-output data. Routine Sysmon
          does not directly establish SetWindowsHookEx calls, macOS TCC establishes authority only, and Linux auditd needs
          preconfigured /dev/input rules. Only a join between input-surface access and a same-process buffer or egress can
          elevate exposure to a capture conclusion.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 输入副本形成在真实消费者之外并避开其审计语义
    en: The input copy forms outside the genuine consumer and its audit semantics
  analysis:
    paragraphs:
    - zh: 攻击者把观察点放在事件进入消费者之前，真实应用仍接收相同输入并生成相同认证事务，但无法从自身日志解释另一个进程已经复制内容。关键行为从应用审计移到端点输入权限、API 或设备面；若这些面未采集，捕获不进入常规观察。Microsoft
        与 Apple 文档证明观察能力和授权边界，DRBControl 证明独立键盘记录输出；资料未量化告警降低。
      en: The adversary places observation before the event reaches the consumer. The genuine app receives the same input
        and creates the same authentication transaction, but its logs cannot explain that another process copied content.
        The critical behavior moves from application audit to endpoint input authority, API, or device surfaces; without those
        sensors, capture remains outside routine observation. Microsoft and Apple document observation capability and authority
        boundaries, while DRBControl establishes separate keylogging output; the sources do not quantify alert reduction.
