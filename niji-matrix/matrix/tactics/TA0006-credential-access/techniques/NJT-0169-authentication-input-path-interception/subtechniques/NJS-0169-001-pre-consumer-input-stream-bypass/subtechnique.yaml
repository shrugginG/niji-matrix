research:
  limitations:
    paragraphs:
    - zh: 公开案例通常证明键盘记录能力、文件或输出，不公开真实秘密内容和每次成功率。Hook、事件 tap 与设备读取在平台上可由合法软件使用，API 调用也可能没有默认日志。正式结论必须按部署验证传感器，并避免为了检测而集中记录用户输入。
      en: Public cases commonly establish keylogging capability, files, or output without disclosing actual secrets or per-attempt
        success. Hooks, event taps, and device reads have legitimate uses, and API calls may lack default logs. Formal conclusions
        must validate sensors in the deployment and avoid centrally recording user input for detection.
