schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0169-002
parent_ref: NJT-0169
name:
  zh: 真实消费者内提交镜像
  en: Genuine-Consumer Submission Shadowing
summary:
  zh: 攻击代码寄生真实登录组件，在正常提交继续的同时复制认证字段，使正确来源与反馈掩盖额外接收者。
  en: Malicious code inhabits a genuine login component and copies authentication fields while normal submission continues,
    allowing the correct origin and feedback to mask an extra receiver.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 真实消费者内提交镜像是攻击者修改、注入或动态改写用户本来就应信任的登录页、浏览器组件、VPN 门户或认证服务，使输入字段在沿原路径提交的同时被复制到第二缓冲区或目的地。稳定变量是“真实消费者身份未变但内部出现额外接收路径”，不是
      Web、JavaScript、API Hook 或产品名称。只有实际字段或明文进入第二结果才成立。
    en: Genuine-Consumer Submission Shadowing modifies, injects into, or dynamically rewrites a login page, browser component,
      VPN portal, or authentication service the user is already supposed to trust, copying fields to a second buffer or destination
      while submission follows the original path. The stable variable is an unchanged genuine-consumer identity with an added
      internal receiver, not web, JavaScript, API hooking, or a product name. The child requires actual fields or plaintext
      entering the second result.
stealth_characteristics:
  paragraphs:
  - zh: 真实消费者内提交镜像保留正确域名、证书、品牌、用户动作和常见成功反馈，服务端也可能记录正常认证，因此基于仿冒域名或失败登录的规则可能完全不触发。残余差异存在于登录资源哈希和部署来源、异常模块或 instrumentation、认证进程内存变化、第二网络目的地和凭据缓冲文件。Lumen
      的 VersaMem 以内存方式改写方法且不修改 Java 文件，说明只做磁盘完整性检查仍可能失去关键路径。
    en: Genuine-Consumer Submission Shadowing preserves the correct domain, certificate, brand, user action, and common success
      feedback, while the server may record a normal authentication, so rules based on lookalike domains or failed sign-ins
      can remain silent. Residual differences lie in login-resource hashes and deployment provenance, anomalous modules or
      instrumentation, authentication-process memory changes, a second network destination, and credential-buffer files. Lumen's
      VersaMem rewrote a method in memory without changing Java files, showing that disk-only integrity checks can miss the
      critical path.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要真实登录消费者、未经批准的内部改动、实际认证输入副本和第二输出链。读取用户已登录后查看的页面内容归 NJT-0145；修改认证判定、增加万能口令或持久接受条件归 T1556；窃取结果 Cookie 或令牌归 T1539/T1528。正常
      APM、反欺诈、DLP、密码管理器和批准的页面分析也可在消费者内观察字段或请求，必须核对数据最小化、部署签名、批准目的和输出接收方。
    en: Inclusion requires a genuine login consumer, an unauthorized internal change, an actual authentication-input copy,
      and a second output chain. Reading page content viewed after sign-in belongs to NJT-0145; changing the authentication
      decision, adding a master password, or creating a durable acceptance condition belongs to T1556; stealing the resulting
      cookie or token belongs to T1539 or T1528. Approved APM, antifraud, DLP, password managers, and page analytics can also
      observe fields or requests inside a consumer, requiring checks of data minimization, deployment signature, approved
      purpose, and output recipient.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Volexity 观察到攻击者修改 Ivanti Connect Secure 真实登录页加载的 JavaScript，使 Login 函数把用户名和口令另送攻击者域；Lumen 分析的 VersaMem 动态改写 Versa
        认证服务的 setUserPassword 方法，截获明文、加密后写入临时文件。这两项分别展示客户端登录资产与服务端运行态，但共同变量是原消费者内部形成第二接收路径。
      en: Volexity observed an attacker modify JavaScript loaded by a genuine Ivanti Connect Secure login page so the Login
        function sent usernames and passwords to an attacker domain. Lumen analyzed VersaMem dynamically rewriting the Versa
        authentication service's setUserPassword method, intercepting plaintext, encrypting it, and writing a temporary file.
        These show client login assets and server runtime respectively, but share the internal second receiver within the
        original consumer.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要登录资产写权限、Web 根或部署链控制、认证进程附着或字节码 instrumentation，并理解字段、方法和正常流程，避免破坏登录。只取得设备管理权但不能进入消费者代码或输出字段不足；更新、重启、外部完整性检查、只读系统分区和受限服务外联会缩短驻留或暴露第二路径。
        en: The attacker needs login-asset write authority, web-root or deployment-chain control, authentication-process attachment
          or bytecode instrumentation, and enough knowledge of fields, methods, and normal flow to avoid breaking sign-in.
          Appliance administration without consumer-code or field-output access is insufficient. Updates, restarts, external
          integrity checks, read-only system partitions, and constrained service egress can shorten residence or expose the
          second path.
    defender_model:
      paragraphs:
      - zh: 防守方需要来自可信构建或厂商镜像的登录资产清单、部署身份与哈希，以及认证进程模块、内存改写、临时文件和外联数据。内置完整性检查若可被同一设备管理员修改，不能成为唯一权威；只见一次正常登录也不能排除副本。应在外部控制面保存基线并把资产或运行态差异连接到同次提交的第二输出。
        en: The defender needs a login-asset inventory, deployment identity, and hashes from a trusted build or vendor image,
          plus authentication-process module, memory modification, temporary-file, and egress data. An integrity checker alterable
          by the same appliance administrator cannot be the sole authority, and one normal sign-in does not exclude a copy.
          Baselines should be retained in an external control plane and asset or runtime differences joined to a second output
          around the same submission.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 恶意接收路径寄生真实登录消费者身份
    en: A malicious receiver inhabits the genuine login consumer identity
  analysis:
    paragraphs:
    - zh: 攻击者不替换用户选择的站点或程序，而是在真实消费者内部增加复制逻辑。用户、浏览器和身份服务继续看到预期来源与结果，恶意实体借用原组件的品牌、证书、进程和网络位置而难以与正常提交区分。Volexity 的登录脚本改动与 Lumen
        的内存方法改写直接支持两种实现；它们留下不同完整性痕迹，因此检测必须同时覆盖静态资产和运行态。
      en: The adversary does not replace the site or program selected by the user, but adds copy logic inside the genuine
        consumer. The user, browser, and identity service continue to see the expected origin and result, while the malicious
        entity borrows the component's brand, certificate, process, and network location. Volexity's login-script change and
        Lumen's in-memory method rewrite directly support two implementations; they leave different integrity traces, so detection
        must cover both static assets and runtime.
