research:
  limitations:
    paragraphs:
    - zh: Ivanti 与 Versa 证据来自特定设备和实现，不能推断所有门户都有同一目录、方法或传感器。正常登录成功不能证明输入未被复制，资产差异也不能单独证明字段已外流。正式案例应保留恶意改动、输入结果和第二输出之间的同事件链。
      en: Ivanti and Versa evidence concerns specific appliances and implementations and cannot establish the same directories,
        methods, or sensors for every portal. A successful normal sign-in does not prove input was not copied, while an asset
        difference alone does not prove fields left. A formal case should preserve a same-event chain among malicious change,
        input result, and second output.
