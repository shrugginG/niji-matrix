research:
  limitations:
    paragraphs:
    - zh: 公开报告通常展示页面、对话框、域名和样本输出，不提供完整用户群基线或误报率。合法 IdP 重定向、云托管应用和脚本化管理提示具有相似外观；没有提交结果时不能从诱饵存在推断秘密已获。抗钓鱼认证降低可重放秘密价值，但不能阻止端点恶意代码读取其他输入。
      en: Public reports commonly show pages, dialogs, domains, and sample output without a complete user-population baseline
        or false-positive rate. Legitimate IdP redirects, cloud-hosted apps, and scripted administration prompts can look
        similar. A lure does not establish secret acquisition without a submission result. Phishing-resistant authentication
        reduces reusable-secret value but does not stop endpoint malware from reading other input.
