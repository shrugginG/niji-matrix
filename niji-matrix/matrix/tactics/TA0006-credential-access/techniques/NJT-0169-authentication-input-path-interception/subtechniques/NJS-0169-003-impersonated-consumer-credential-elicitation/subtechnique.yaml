schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0169-003
parent_ref: NJT-0169
name:
  zh: 仿冒消费者诱导取密
  en: Impersonated-Consumer Credential Elicitation
summary:
  zh: 攻击者用仿冒系统提示或登录来源接收用户主动输入，使品牌和界面相似性掩盖接收者身份差异。
  en: The adversary receives user-entered secrets through an impersonated system prompt or login origin, allowing brand and
    interface similarity to mask receiver identity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 仿冒消费者诱导取密是攻击者呈现看似属于操作系统、安装器、浏览器、身份提供方或业务服务的输入界面，并把用户提交的认证秘密交给攻击者控制的进程、页面或服务。直接目标是通过接收者身份伪装让用户主动产生输入。原生对话框、HTML、云托管和
      TLS 都只是外观材料；稳定边界是展示身份与真实控制者不一致并有实际内容结果。
    en: Impersonated-Consumer Credential Elicitation presents an input interface that appears to belong to an operating system,
      installer, browser, identity provider, or business service while delivering the submitted authentication secret to an
      attacker-controlled process, page, or service. Its direct objective is user-generated input under disguised receiver
      identity. A native dialog, HTML, cloud hosting, and TLS are appearance materials only; the stable boundary is a mismatch
      between presented identity and true controller with an actual content result.
stealth_characteristics:
  paragraphs:
  - zh: 仿冒消费者诱导取密让恶意页面或提示继承熟悉品牌、图标、措辞和工作流，有时使用合法云托管或原生脚本接口，降低用户和仅看外观的审查者区分能力。残余差异包括非标准父进程、缺少 secure desktop、未批准脚本解释器、异常域名或重定向链、证书主体、表单目标和身份提供方没有对应认证事务。页面漂亮、使用
      HTTPS 或用户输入正确口令均不证明接收者合法。
    en: Impersonated-Consumer Credential Elicitation gives a malicious page or prompt familiar branding, icons, wording, and
      workflow, sometimes through legitimate cloud hosting or native scripting interfaces, reducing discrimination by the
      user or a reviewer focused on appearance. Residual differences include a nonstandard parent process, absence of secure
      desktop, an unapproved script interpreter, anomalous domain or redirect chain, certificate subject, form destination,
      and no corresponding identity-provider transaction. A polished page, HTTPS, or a correct password does not establish
      a legitimate receiver.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要仿冒身份、用户实际输入、攻击者控制的接收结果和 Credential Access 目的。只发送钓鱼链接、显示品牌页面或弹出空提示而没有提交结果仍属前置行为。真实企业 SSO 重定向、管理员授权框、软件安装、远程支持、密码管理器自动填充和安全意识演练可能相似；需检查来源、工单、应用签名、表单目标和身份事务。实时代理若还改变认证通信路径可并列
      NJT-0136，但本项仍需输入被攻击者接收。
    en: Inclusion requires an impersonated identity, actual user input, an attacker-controlled receiving result, and a Credential
      Access purpose. Sending a phishing link, displaying branded content, or showing an empty prompt without a submission
      result remains precursor behavior. Genuine enterprise SSO redirects, administrator authorization dialogs, software installation,
      remote support, password-manager autofill, and awareness exercises can look similar; origin, ticket, app signature,
      form target, and identity transaction must be checked. A real-time proxy that also changes the authentication communication
      path may additionally qualify for NJT-0136, but this child still requires attacker receipt of input.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Mandiant 观察到 APT42 以假 Google、Microsoft、Yahoo 和 Google Meet 页面收集输入，部分页面借 Google Sites 增强可信外观并把凭据送往攻击者域。Unit 42 分析的
        Koi Stealer 使用 AppleScript 风格对话框冒充 Visual Studio 更新，反复要求 root 口令并把取得的用户名和口令送往 C2。两者跨 Web 和本地 GUI，共同变量是消费者身份伪装。
      en: Mandiant observed APT42 collect input with fake Google, Microsoft, Yahoo, and Google Meet pages, including pages
        hosted on Google Sites to improve credibility while sending credentials to attacker infrastructure. Unit 42 analyzed
        Koi Stealer using an AppleScript-style dialog impersonating a Visual Studio update, repeatedly requesting a root password
        and sending the obtained username and password to C2. These span web and local GUI but share consumer-identity impersonation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要把界面呈现给目标、复现足够可信的品牌与工作流并控制提交接收端。本地分支需要执行脚本或应用并处理输入；Web 分支需要域名、托管、重定向或受信平台内容。密码管理器不在错误 origin 自动填充、WebAuthn
          验证者绑定、secure desktop、浏览器告警和用户独立核验会降低成功率。
        en: The attacker must present the interface to the target, reproduce sufficiently credible branding and workflow,
          and control the submission receiver. The local branch needs script or app execution and input handling; the web
          branch needs a domain, hosting, redirect, or content on a trusted platform. Password managers refusing autofill
          on the wrong origin, WebAuthn verifier binding, secure desktop, browser warnings, and independent user verification
          reduce success.
    defender_model:
      paragraphs:
      - zh: 防守方可关联进程与脚本、窗口安全上下文、浏览器导航、DNS 和证书、表单提交元数据以及 IdP 事务，但不应记录字段值。受管浏览器外、端到端加密且没有端点传感器、合法云托管多租户和新建业务域会削弱归因。检测结论应说明是仿冒入口、疑似提交还是已证实攻击者接收。
        en: The defender can join process and script lineage, window security context, browser navigation, DNS and certificate
          data, form-submission metadata, and IdP transactions without recording field values. Unmanaged browsers, end-to-end
          encryption without endpoint sensors, legitimate multitenant cloud hosting, and newly created business domains weaken
          attribution. Detection output should distinguish an impersonated entry, suspected submission, and confirmed attacker
          receipt.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 品牌与原生界面特征伪装攻击者控制的输入接收者
    en: Brand and native-interface features disguise an attacker-controlled input receiver
  analysis:
    paragraphs:
    - zh: 攻击者复制用户用于判断接收者的视觉与工作流特征，却把提交绑定到另一个进程或 origin。防守方能够看到提示或页面，但若未验证进程谱系、secure desktop、origin 和 IdP 对应事务，难以把相似外观准确归为恶意。APT42
        与 Koi Stealer 分别直接证明 Web 与本地界面的仿冒及输入结果；它们不证明所有用户都会受骗。
      en: The adversary copies visual and workflow features the user uses to identify a receiver while binding submission
        to another process or origin. The prompt or page remains visible, but without process lineage, secure-desktop, origin,
        and corresponding IdP-transaction checks, defenders can struggle to classify the similar appearance as malicious.
        APT42 and Koi Stealer directly establish web and local interface impersonation plus input results; they do not show
        every user will be deceived.
  confidence: high
  evidence_refs:
