research:
  limitations:
    paragraphs:
    - zh: 证据层级不同：平台文档证明输入观察能力与权限，DRBControl 证明独立键盘记录输出，Ivanti 与 Versa 证明真实消费者内第二接收路径，APT42 与 Koi Stealer 证明仿冒消费者及输入结果。不能把不同操作系统、设备和活动阶段拼成一条通用入侵链，也不能从捕获能力反推某个受害者已输入正确秘密或后继登录成功。
      en: Evidence levels differ. Platform documentation establishes input-observation capability and authority, DRBControl
        establishes independent keylogging output, Ivanti and Versa establish a second receiver inside a genuine consumer,
        and APT42 and Koi Stealer establish impersonated consumers and input results. Different operating systems, appliances,
        and campaign stages cannot be spliced into one universal intrusion chain, and capture capability cannot prove that
        a victim entered a correct secret or that later sign-in succeeded.
    - zh: 端点输入 API、窗口安全上下文、浏览器表单目标、设备运行态和 IdP transaction_id 的可用性随传感器与隐私政策变化。正式 Analytic 必须先在目标版本实测字段，并只保留权限、来源、时序与结果元数据；大规模记录按键或表单内容既不必要，也会制造新的敏感数据风险。合法无障碍、输入法、远程支持、自动填充、测试和监控代理须按精确身份与任务排除。
      en: Availability of endpoint input APIs, window security context, browser form targets, appliance runtime data, and
        IdP transaction_id varies by sensor and privacy policy. A formal analytic must pilot fields on target versions and
        retain only authority, provenance, timing, and outcome metadata. Pervasive recording of keys or form contents is unnecessary
        and creates new sensitive-data risk. Accessibility, input methods, remote support, autofill, testing, and monitoring
        agents require exclusion by exact identity and task.
