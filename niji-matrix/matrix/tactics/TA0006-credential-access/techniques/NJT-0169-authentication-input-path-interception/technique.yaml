schema_version: 2.0.0
type: technique
id: NJT-0169
name:
  zh: 认证输入路径截获
  en: Authentication-Input Path Interception
summary:
  zh: 攻击者在认证输入被提交时复制其内容，并通过绕到消费者之前、寄生真实消费者或仿冒接收者改变防守方能够关联的取密痕迹。
  en: Adversaries copy authentication input as it is submitted and change defender-visible acquisition traces by observing
    before the intended consumer, parasitizing the genuine consumer, or impersonating the receiver.
aliases:
- Input Capture
- T1056
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1056
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1056
definition_and_concept:
  paragraphs:
  - zh: 认证输入路径截获是攻击者在用户或受控进程输入口令、验证码或其他认证秘密的过程中，使内容在到达预期验证者之前或同时进入攻击者可读位置。直接目的在于取得用户此刻提供的秘密，而不是读取已经保存在保管库中的条目，也不是在提交完成后偷取
      Cookie 或访问令牌。输入可以经键盘事件、粘贴、图形提示、浏览器表单或认证函数传递；这些介质改变实现和传感器，不改变父技术身份。
    en: Authentication-Input Path Interception occurs when an adversary causes a password, verification code, or other authentication
      secret being entered by a user or controlled process to reach an attacker-readable location before or while it reaches
      the intended verifier. The immediate objective is the secret being supplied at that moment, rather than an item already
      stored in a vault or a cookie or access token stolen after submission. Input may travel through key events, paste, a
      graphical prompt, a browser form, or an authentication function; these media change implementation and sensors, not
      the parent identity.
  - zh: 证据必须区分输入观察权限或组件改动、实际内容复制、攻击者保留或外传、以及后继身份使用。Microsoft 文档说明低层键盘 Hook 在事件进入线程输入队列之前被调用，但这一能力本身不证明恶意进程保存了字符；Volexity 和
      Lumen 的事件分析则分别把真实登录页 JavaScript、认证方法 Hook 与凭据输出相连。正式判断至少需要内容进入恶意缓冲区、文件、请求或等价结果的证据，后继登录仍单独证明。
    en: Evidence must distinguish input-observation authority or component change, actual content copying, attacker retention
      or egress, and later identity use. Microsoft documents that a low-level keyboard hook is called before an event enters
      a thread input queue, but that capability alone does not prove a malicious process saved characters. Volexity and Lumen
      incident analyses respectively connect genuine login-page JavaScript and an authentication-method hook to credential
      output. A formal conclusion requires evidence that content entered a malicious buffer, file, request, or equivalent
      result; later sign-in remains a separate proposition.
stealth_characteristics:
  paragraphs:
  - zh: 当截获点位于预期消费者之前，真实应用和身份服务仍只看到正常输入与正常认证结果，输入副本不会自动出现在应用审计中；关键痕迹转移到全局 Hook、输入设备读取、Input Monitoring 权限、缓冲文件或发起进程外联。若攻击代码位于真实登录组件内部，用户仍可看到正确域名、界面和反馈，而服务端请求也可能保持正常主体外观，异常缩小为登录资产差异、运行态改写和第二输出目的地。
    en: When interception sits before the intended consumer, the genuine app and identity service still see ordinary input
      and an ordinary authentication result, while the copied input does not automatically appear in application audit. Evidence
      moves to global hooks, input-device reads, Input Monitoring authority, buffers, or egress from the observing process.
      When malicious code resides inside a genuine login component, the user can retain the correct domain, interface, and
      feedback and the server request can retain a normal principal appearance, narrowing the anomaly to login-asset differences,
      runtime modification, and a second output destination.
  - zh: 仿冒消费者则保留预期品牌、对话框或云托管外观，却把输入实际交给攻击者控制的进程或来源。防守方若只看截图、窗口标题或 TLS 存在，可能把外观当作身份；仍可观察的差异包括进程谱系、secure desktop 状态、页面 origin、证书和域名、表单提交目标及身份提供方是否出现对应事务。三条路径均不会让行为不可见，其收益取决于端点、浏览器、服务和身份日志能否以同一用户、会话、进程和时间连接。
    en: An impersonated consumer preserves expected branding, dialog, or cloud-hosted appearance while delivering input to
      an attacker-controlled process or origin. A defender relying on a screenshot, window title, or the presence of TLS can
      mistake appearance for identity. Residual differences include process lineage, secure-desktop state, page origin, certificate
      and domain, form-submission destination, and whether the identity provider recorded a corresponding transaction. None
      of the three paths is invisible; the advantage depends on whether endpoint, browser, service, and identity records can
      be joined by user, session, process, and time.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求同时存在认证输入、攻击者驱动的截获路径、实际内容结果和可说明匿迹收益的观察差。合法无障碍、输入法、远程支持、密码管理器自动填充、软件测试、DLP 或遥测代理可能取得相似权限或读取相同界面；必须核对批准身份、签名、版本、会话、目标应用、工单和结果去向。只看到
      SetWindowsHookEx、/dev/input 打开、TCC 授权、脚本提示或登录页变更是调查线索，不能单独断言秘密已获。
    en: Inclusion requires authentication input, an attacker-driven interception path, an actual content result, and an observation
      difference that explains stealth value. Accessibility, input methods, remote support, password-manager autofill, testing,
      DLP, and telemetry agents can hold similar authority or read the same interface. Assessment must check approved identity,
      signature, version, session, target app, ticket, and result destination. SetWindowsHookEx use, a /dev/input open, TCC
      authority, a scripted prompt, or a login-page change is an investigative lead and cannot alone establish secret acquisition.
  - zh: 屏幕像素归 T1113/NJT-0158，浏览器已经显示或返回的页面内容归 NJT-0145，麦克风或通话音频归 T1123，摄像头和视频帧归 T1125。受管理保管库中已存秘密归 NJT-0147/T1555，散落文件或配置中的秘密归
      T1552；提交后形成的应用令牌和 Web 会话 Cookie 分别归 T1528 和 T1539。若 Hook 改变认证决定或持久接受条件而非只复制输入，T1556 拥有该改变；同一事件可在各直接对象都有独立证据时并列标记。
    en: Display pixels belong to T1113/NJT-0158, page content already rendered or returned in a browser belongs to NJT-0145,
      microphone or call audio belongs to T1123, and camera or video frames belong to T1125. Existing secrets in managed stores
      belong to NJT-0147/T1555 and loose secrets in files or configuration to T1552. Application tokens and web session cookies
      created after submission belong to T1528 and T1539 respectively. If a hook changes the authentication decision or durable
      acceptance condition rather than merely copying input, T1556 owns that change; an event may carry both labels only with
      evidence for each direct object.
  - zh: 恶意中间路径若改变终端与服务之间的信任指向，NJT-0136/T1557 可描述路径介入；本技术只在用户输入内容又被实际捕获时成立。诱饵邮件、恶意链接和页面投递属于相邻的初始访问行为，不能代替表单内容已交给攻击者的证据。输入被捕获后再压缩、加密、暂存或分批外传属于各自后继动作，不按文件格式、平台、产品或输入字段类别拆分子项。
    en: When a malicious intermediary changes trust direction between endpoint and service, NJT-0136/T1557 can describe the
      path intervention; this technique applies only when user input content is also actually captured. Lure email, malicious
      links, and page delivery are adjacent initial-access behavior and do not substitute for proof that form content reached
      the attacker. Compression, encryption, staging, or batched egress after capture is successor behavior and does not create
      children by file format, platform, product, or input-field category.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在已控工作站上，攻击者可用低层 Hook、事件 tap、输入设备读取或辅助功能权限复制用户向真实应用提供的认证输入；在 VPN、SSO 或管理设备上，攻击者可修改真实登录脚本或在认证服务运行态插入处理逻辑，使原登录继续而把输入另送到文件或远端。另一分支通过伪装成系统授权框、软件更新、Google
        或 Microsoft 登录页的界面诱导输入，并在显示错误、跳转到真实内容或继续原流程前保存秘密。
      en: On a compromised workstation, an adversary can use a low-level hook, event tap, input-device read, or accessibility
        authority to copy authentication input supplied to a genuine app. On a VPN, SSO, or management appliance, the adversary
        can change a genuine login script or insert runtime logic into the authentication service so the original sign-in
        continues while input is sent to a file or remote destination. Another branch elicits input through an interface impersonating
        an operating-system authorization dialog, software update, or Google or Microsoft sign-in page, then saves the secret
        before showing an error, redirecting to real content, or continuing the expected flow.
    - zh: Credential Access 场景的后继目的包括登录邮件与云租户、进入 VPN、提升管理设备访问或绕过恢复流程，但本对象在秘密进入攻击者可读结果时完成。实际成功认证、会话建立和资源访问需要身份提供方、目标服务或受害环境的独立记录，不能从捕获能力反推。
      en: Credential Access successors include signing into mail or cloud tenants, entering a VPN, gaining management-appliance
        access, or abusing recovery flows, but this object completes when the secret reaches an attacker-readable result.
        Successful authentication, session creation, and resource access require independent identity-provider, target-service,
        or victim-environment records and cannot be inferred from capture capability.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要在目标交互会话中运行代码、读取系统输入面、修改或寄生真实认证消费者，或控制一个能令用户信任的仿冒界面。消费者前路径要求足够的桌面、设备、TCC/辅助功能或驱动权限；真实消费者内路径要求登录资产写权限、进程注入、Java
          instrumentation 或等价运行态控制；仿冒路径要求可信投递、品牌知识及接收输入的来源。攻击者还需把字符或字段与用户、窗口或会话关联，并承担用户未输入、布局差异和二次确认带来的失败。
        en: The adversary needs at least code in the target interactive session, access to a system input surface, authority
          to modify or inhabit a genuine authentication consumer, or control of an impersonated interface the user may trust.
          The pre-consumer path needs sufficient desktop, device, TCC or accessibility, or driver authority. The genuine-consumer
          path needs login-asset write access, process injection, Java instrumentation, or equivalent runtime control. The
          impersonation path needs credible delivery, brand knowledge, and an origin that receives input. The actor must also
          associate characters or fields with a user, window, or session and tolerate failure from absent input, layout differences,
          and independent confirmation.
      - zh: 强制代码签名、受保护进程、secure desktop、只读或签名登录资产、受限服务外联、最小化 Input Monitoring 与设备权限、以及验证者绑定的抗钓鱼认证都会限制相应分支。获得管理员权限并不自动保证能读所有安全桌面、硬件认证器或受隔离应用的输入，恶意提示也不能保证用户提交正确秘密。
        en: Enforced code signing, protected processes, secure desktop, read-only or signed login assets, constrained service
          egress, minimized Input Monitoring and device authority, and verifier-bound phishing-resistant authentication constrain
          the respective branches. Administrator authority does not automatically provide access to every secure desktop,
          hardware authenticator, or isolated app input, and a malicious prompt does not guarantee that the user supplies
          a correct secret.
    defender_model:
      paragraphs:
      - zh: 防守方假定可集中一部分端点进程与模块、输入权限或设备访问、文件完整性、浏览器来源与网络、Web 部署、认证服务和身份提供方日志，并维护获批辅助功能、输入法、远程支持、密码管理器、测试工具和登录资产清单。Windows 默认日志不记录每次键盘
          Hook 调用，Sysmon Event 7 需显式启用且只证明模块加载；macOS Input Monitoring 表示权限而非捕获结果；Linux auditd 只能在已配置规则时看到设备打开或系统调用。
        en: The defender is assumed to centralize some endpoint process and module data, input authority or device access,
          file integrity, browser origin and network data, web deployment records, authentication-service logs, and identity-provider
          transactions, with inventories of approved accessibility, input methods, remote support, password managers, test
          tools, and login assets. Default Windows logs do not record every keyboard-hook call, Sysmon Event 7 must be enabled
          and proves only a module load, macOS Input Monitoring represents authority rather than a capture result, and Linux
          auditd sees device opens or syscalls only when relevant rules are configured.
      - zh: 检测必须把截获入口与输出结果连接，而不采集或集中保存真实口令。可行关联键包括设备、用户、登录会话、进程 GUID、浏览器 profile、页面 origin、认证事务、登录资产版本、目标服务和时间。若端点只保留进程创建而没有
          API/设备/权限遥测，认证设备没有外部完整性基线，或用户位于未受管浏览器，防守方只能报告风险入口，不能证明输入已被复制。
        en: Detection must connect the interception entry to an output result without collecting or centrally retaining actual
          passwords. Useful join keys include device, user, logon session, process GUID, browser profile, page origin, authentication
          transaction, login-asset version, target service, and time. If an endpoint retains only process creation without
          API, device, or permission telemetry, an appliance lacks an external integrity baseline, or the user operates an
          unmanaged browser, the defender can report an exposure path but cannot prove that input was copied.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 截获点离开预期消费者审计面使输入副本不进入常规认证记录
    en: Interception outside intended-consumer audit keeps the input copy out of routine authentication records
  analysis:
    paragraphs:
    - zh: 攻击者在输入事件到达应用前读取事件流，或在登录消费者内部增加不受原审计理解的第二输出，使真实验证者仍处理一次普通提交。行为设计把“秘密被复制”与“认证请求被处理”分置在不同观察面；应用或身份日志因此只能证明正常事务，无法单独看到副本。Microsoft、Apple
        与 ATT&CK 检测材料支持输入面能力和传感器差异，Volexity 与 Lumen 则证明登录资产或运行态可产生额外输出；它们没有给出普遍检出率，故父级置信度为 medium。
      en: The adversary reads the event stream before it reaches the app or adds a second output inside the login consumer
        that the original audit model does not understand, while the genuine verifier handles an ordinary submission. This
        design separates the copied secret from the processed authentication request across observation surfaces, so application
        or identity logs alone establish only the normal transaction. Microsoft, Apple, and ATT&CK detection material support
        input-surface capability and sensor differences, while Volexity and Lumen establish extra output from login assets
        or runtime. None provides a general detection-rate estimate, so parent confidence is medium.
  confidence: medium
  evidence_refs:
  - REF-000726
  - REF-000727
  - REF-000729
  - REF-000730
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 真实或仿冒消费者外观掩盖输入接收者的控制归属
    en: Genuine or impersonated consumer appearance masks who controls the input receiver
  analysis:
    paragraphs:
    - zh: 攻击代码可以寄生真实登录页或认证方法，使正确域名与正常反馈继续存在，也可以复制品牌、原生对话框和云托管页面，使攻击者控制的来源看起来像预期消费者。可见实体没有消失，而是其品牌、进程或路径特征与真实控制者不一致，降低仅按界面外观和成功反馈判断的区分力。Volexity、Lumen、Mandiant
        与 Unit 42 分别提供真实消费者和仿冒消费者案例，但不同事件不能拼成一条统一攻击链。
      en: Malicious code can inhabit a genuine login page or authentication method so the correct domain and normal feedback
        remain, or copy branding, a native dialog, and cloud-hosted page so an attacker-controlled origin resembles the intended
        consumer. The visible entity remains, but its brand, process, or path features no longer match the true controller,
        weakening decisions based only on appearance and successful feedback. Volexity, Lumen, Mandiant, and Unit 42 provide
        genuine-consumer and impersonated-consumer cases, but separate incidents cannot be spliced into one attack chain.
  confidence: high
  evidence_refs:
  - REF-000729
  - REF-000730
  - REF-000731
  - REF-000732
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本分类只按输入信任路径和真正接收者的控制位置划分。消费者前输入流旁路在预期应用解析前形成副本；真实消费者内提交镜像保留真正应用或 origin，却在内部增加第二接收路径；仿冒消费者诱导取密则保留外观并改变进程、origin
        或提交归属。三项分别要求输入权限与设备遥测、静态和运行态完整性、以及界面身份与 IdP 事务差分。
      en: The taxonomy is divided only by input trust path and control location of the true receiver. Pre-Consumer Input-Stream
        Bypass forms a copy before the intended app parses input. Genuine-Consumer Submission Shadowing retains the genuine
        app or origin but adds an internal second receiver. Impersonated-Consumer Credential Elicitation retains appearance
        while changing process, origin, or submission ownership. The three require input-authority and device telemetry, static
        and runtime integrity, and interface-identity to IdP-transaction differential respectively.
    - zh: 键盘、GUI、Web、API、操作系统和产品是实现介质，不构成子项。窗口或页面条件门控由 NJS-0132-001 拥有；捕获后缓存、加密、暂存和分批外传属于后继处理。ATT&CK 的四项子技术已逐项核对覆盖，但没有直接复制或机械合并为
        NJS。
      en: Keyboard, GUI, web, API, operating system, and product are implementation media and do not define children. Window
        or page context gating is owned by NJS-0132-001, while buffering, encryption, staging, and batched egress after capture
        are successor handling. All four ATT&CK children were checked for coverage without being copied or mechanically merged
        into NJS objects.
  coverage: established
  subtechnique_refs:
  - NJS-0169-001
  - NJS-0169-002
  - NJS-0169-003
