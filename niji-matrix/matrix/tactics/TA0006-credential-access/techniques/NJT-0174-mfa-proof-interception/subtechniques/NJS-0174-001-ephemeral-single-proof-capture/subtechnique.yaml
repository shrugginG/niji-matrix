schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0174-001
parent_ref: NJT-0174
name:
  zh: 短时单次证明截获
  en: Ephemeral Single-Proof Capture
summary:
  zh: 攻击者取得一个仍在有效期且尚可被接受的 MFA 输出，在一次使用或过期前把它用于对应挑战，而不控制长期生成状态。
  en: The adversary obtains one still-valid and acceptable MFA output and uses it for the corresponding challenge before one-time
    consumption or expiry without controlling long-term generator state.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 短时单次证明截获是攻击者取得一个由真实验证者签发或真实认证器生成、尚未过期且尚未被先行消费的 MFA 输出，并获得在对应账户和请求上下文中提交它的机会。对象由“单个证明及其短寿命”界定，可经仿冒输入面、消息服务控制台、邮件访问、端点观察或认证组件第二输出实现；媒介不形成兄弟边界。
    en: Ephemeral Single-Proof Capture occurs when an adversary obtains one MFA output issued by the genuine verifier or generated
      by a genuine authenticator while it remains unexpired and unconsumed, gaining an opportunity to submit it for the corresponding
      account and request context. The object is defined by one proof and its short lifetime and may be implemented through
      an impersonated input surface, messaging-service console, mailbox access, endpoint observation, or a second output from
      an authentication component. The medium does not define siblings.
  - zh: 本子项在材料实际到达且当时可能被接受时完成；后继验证成功和 session 建立仍是更高证据层。提供者界面中“可查看”但没有 actor 访问，只是 exposure；actor 搜索对应消息证明材料到达控制面；验证者成功测试证明接受；资源动作再归有效账户使用。不得把这些阶段压成一个二元结论。
    en: This child completes when material actually arrives and could be accepted at that time; later verifier success and
      session creation remain higher evidence tiers. A provider interface in which a message was merely viewable establishes
      exposure, an actor search for the corresponding message establishes arrival to the control plane, a successful verifier
      test establishes acceptance, and resource activity then belongs to valid-identity use. These stages must not be collapsed
      into a binary conclusion.
stealth_characteristics:
  paragraphs:
  - zh: 短时单次证明截获让攻击者提交真实 challenge 对应的正确输出，IdP 可只记录一次常见 MFA 方法成功；短信、邮件或认证消费者中的第二读者不在该记录中。若攻击者先消费，合法用户可能只看到重复或失败，也可能在未尝试登录时收到通知。残余差异存在于签发与消费来源、provider
      console 查询、表单或组件第二输出、重复使用拒绝、设备与 session 不连续及用户否认。
    en: Ephemeral Single-Proof Capture lets the adversary submit the correct output for a genuine challenge, so the IdP may
      record only one successful use of a common MFA method. A second reader in SMS, email, or an authentication consumer
      is absent from that record. If the adversary consumes first, the legitimate user may see only a duplicate or failure,
      or may receive a notification without attempting sign-in. Residual differences lie in issuance-versus-consumption origin,
      provider-console queries, a form or component second output, duplicate-use rejection, device and session discontinuity,
      and user denial.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须证明具体 MFA 输出、攻击者控制的读取或接收、材料到达时间及其有效状态。假登录页存在、SMS 投递、邮箱登录、控制台访问或认证组件改动没有对应证明结果时不成立。用户在仿冒页面输入 OTP 可同时归 NJS-0169-003，真实认证组件额外记录
      token 可同时归 NJS-0093-003；本子项只拥有“可用的一次性 MFA 证明结果”。
    en: Inclusion requires a specific MFA output, adversary-controlled read or receipt, material-arrival time, and validity
      state. A fake login page, SMS delivery, mailbox sign-in, console access, or authentication-component change without
      the corresponding proof result is insufficient. A user entering an OTP into an impersonated page may also qualify for
      NJS-0169-003, and a genuine authentication component recording a token may also qualify for NJS-0093-003. This child
      owns only the usable one-time MFA-proof result.
  - zh: 攻击者发起 push 且用户批准由 T1621 负责，因为没有证明被截获；AiTM 或反向代理只转送挑战和响应由 NJT-0136 负责，只有攻击者还取得可独立提交的一次证明时才并列。验证码验证后返回的 Cookie 或 token
      归 T1539/T1528，成功账户进入归 NJT-0061。正常共享电话、批准的帮助台查看、测试挑战和用户设备迁移需以审批和所有者确认排除。
    en: T1621 owns an adversary-triggered push that the user approves because no proof was intercepted. NJT-0136 owns an AiTM
      or reverse proxy that only forwards challenge and response; this child coexists only if the adversary also obtains a
      single proof it can submit. Cookies or tokens returned after code verification belong to T1539/T1528, and successful
      account entry belongs to NJT-0061. Normal shared phones, approved help-desk viewing, test challenges, and user-device
      migration require exclusion through approval and owner confirmation.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Scatter Swine 使用已盗主口令触发短信挑战，再从被攻陷的 Twilio 控制台搜索对应 OTP；Okta 证明五分钟有效期、38 个定向号码查询及一个成功测试，并明确区分偶然可见号码和没有使用证据的消息。另一场景中，SLOWPULSE
        在真实 Pulse Secure ACE-2FA 认证函数内把用户名与密码写盘后返回正常控制流，形成事务内第二输出。
      en: Scatter Swine used stolen primary passwords to trigger SMS challenges and searched the compromised Twilio console
        for corresponding OTPs. Okta establishes a five-minute lifetime, searches for 38 targeted numbers, and one successful
        test, while explicitly separating incidentally visible numbers and messages without evidence of use. In another scenario,
        SLOWPULSE wrote username and password from the genuine Pulse Secure ACE-2FA function to disk and returned to normal
        control flow, creating an in-transaction second output.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要主因素或触发挑战的其他条件、能读取证明的控制点、账户与 challenge 对应关系以及低于有效期的操作延迟。一次使用、短 TTL、number matching、交易上下文、设备或通道绑定、速率与风险策略限制成功；误触发错误账户或由合法用户先消费会使材料失效。
        en: The adversary needs a primary factor or other condition that triggers a challenge, a control point that reads
          the proof, a mapping between account and challenge, and operational latency below the validity period. One-time
          use, short TTL, number matching, transaction context, device or channel binding, rate controls, and risk policy
          constrain success. Triggering the wrong account or legitimate consumption first invalidates the material.
    defender_model:
      paragraphs:
      - zh: 防守方需要 IdP challenge/sign-in、投递提供者或邮箱访问、仿冒页面或认证组件检测、设备/session 和用户反馈。理想关联使用 challenge/request/correlation ID；缺失时按
          user、method、destination hash、签发与消费时间、source IP、device 和 session 做弱关联。内容隐私要求只保存 message/proof ID 与敏感分类，不保存 OTP 值。
        en: The defender needs IdP challenge and sign-in data, delivery-provider or mailbox access, impersonated-page or authentication-component
          detection, device or session context, and user feedback. Ideal correlation uses a challenge, request, or correlation
          ID. When absent, weaker joins use user, method, destination hash, issue and consumption time, source IP, device,
          and session. Content privacy requires retaining only message or proof IDs and sensitivity class, never the OTP value.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: MFA 决策记录证明有效却不记录短时输出的第二控制者
    en: MFA decision records proof validity without the second controller of its short-lived output
  analysis:
    paragraphs:
    - zh: 攻击者从投递、输入或认证组件观察面取得证明，再向真实验证者提交；IdP 的成功记录说明代码有效，却没有说明谁从提供者控制台读取、谁收到了仿冒表单或哪个模块产生第二文件。材料控制变化落在决策日志之外，需要跨服务恢复。Okta
        和 Mandiant 分别提供 provider console 与认证组件第二输出证据，均支持该因果链。
      en: The adversary obtains proof on a delivery, input, or authentication-component surface and submits it to the genuine
        verifier. IdP success establishes code validity but not who read a provider console, who received an impersonated
        form, or which module created a second file. The controller change remains outside decision logs and requires cross-service
        reconstruction. Okta and Mandiant provide provider-console and authentication-component second-output evidence respectively,
        supporting this causal chain.
