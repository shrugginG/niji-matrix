research:
  limitations:
    paragraphs:
    - zh: SLOWPULSE 明确证明认证函数记录材料，但公开报告没有逐项披露哪些 ACE 值仍有效或之后被使用。Okta 证明定向搜索和一次成功测试，也说明多数偶然可见消息没有使用迹象。APT42 来源中克隆站点捕获 MFA token
        的一次尝试失败，另一 SMS token 捕获仅为 likely，不能用来提高所有 Web 案例的置信度。
      en: SLOWPULSE clearly establishes material logging inside an authentication function, but the public report does not
        enumerate which ACE values remained valid or were later used. Okta establishes targeted searches and one successful
        test while showing that most incidentally visible messages lacked use evidence. In the APT42 source, one cloned-site
        MFA-token capture attempt failed and a different SMS-token capture is only assessed as likely, so it cannot raise
        confidence for all web cases.
