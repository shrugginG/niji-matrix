schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0174-002
parent_ref: NJT-0174
name:
  zh: 认证证明生成状态复制
  en: Authentication Proof-Generator State Replication
summary:
  zh: 攻击者复制软件认证器的 seed 或等价状态并绕过导入限制，使其能在另一控制面持续生成未来 MFA 证明。
  en: The adversary copies a software authenticator's seed or equivalent state and bypasses import restrictions, enabling
    continued generation of future MFA proofs from another control plane.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 认证证明生成状态复制是攻击者取得软件 OTP 认证器的长期 secret、seed、token container 或等价派生状态，并在攻击者控制的另一进程或设备上恢复生成能力。直接结果不是一个验证码，而是能按时间或计数器持续输出目标验证者接受格式的证明。软件产品、移动端或桌面端不是分类基础；生成状态的持久性与跨挑战能力才是稳定变量。
    en: Authentication Proof-Generator State Replication occurs when an adversary obtains the long-term secret, seed, token
      container, or equivalent derivation state of a software OTP authenticator and restores generation on another adversary-controlled
      process or device. The direct result is not one code but sustained ability to output proofs in the format accepted by
      the target verifier under time or counter rules. Software product, mobile versus desktop, and platform do not define
      the child; persistence of generator state across challenges is the stable variable.
  - zh: 文件或数据库复制仅证明暴露，必须进一步证明容器包含生成状态且能导入、解密或绕过绑定后生成有效 token。Fox-IT 在 Operation Wocao 中观察到 actor 窃取受害者 software token，并通过逆向验证补丁设备检查即可生成有效两因素代码；报告把
      actor 的真实取得和研究者确定的最可能实现分开，因此正式置信度保持 medium。
    en: A file or database copy establishes exposure only. Evidence must further show that the container holds generator state
      and can be imported, decrypted, or used after binding bypass to produce a valid token. In Operation Wocao, Fox-IT observed
      actor theft of a victim software token and verified through reverse engineering that patching the device check produced
      valid two-factor codes. The report separates real actor acquisition from the researchers' most likely implementation
      path, so formal confidence remains medium.
stealth_characteristics:
  paragraphs:
  - zh: 认证证明生成状态复制消除了对每次消息投递或用户输入的依赖。复制端生成的 OTP 与原认证器共享 seed 和算法，验证者通常只判断代码、时间或计数器，不知道输出由哪台设备计算。若登录来源又接近用户基线，成功 MFA 在局部视图中与正常软件令牌相同；残余痕迹集中在
      token 容器读取、异常导入或补丁、同一 authenticator 的设备不一致、计数器竞争和暴露后持续使用。
    en: Authentication Proof-Generator State Replication removes dependence on each message delivery or user input. OTPs generated
      by the copy share the original seed and algorithm, while the verifier typically evaluates code, time, or counter without
      knowing which device computed it. If sign-in origin also resembles the user's baseline, a successful MFA step appears
      identical to ordinary software-token use locally. Residual traces concentrate in token-container reads, anomalous import
      or patching, device inconsistency for one authenticator, counter competition, and continued use after exposure.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须证明生成状态被攻击者取得，并有有效代码生成、可验证导入或同等结论级结果。只复制加密 token 文件、浏览配置、列出认证器或观察进程不成立。从保管库读取 seed 的路径可同时归 T1555/NJT-0147，本子项只拥有由该材料恢复的未来
      MFA 证明生成能力。直接伪造 SAML、Cookie 或其他 Web 凭据归 T1606，生成后的账户使用归 NJT-0061。
    en: Inclusion requires adversary acquisition of generator state plus valid code generation, verified import, or an equivalent
      conclusion-level result. Merely copying an encrypted token file, browsing configuration, listing authenticators, or
      observing a process is insufficient. Retrieval of a seed from a managed store may also qualify for T1555/NJT-0147; this
      child owns only the restored ability to generate future MFA proofs. Direct forging of SAML, cookies, or other web credentials
      belongs to T1606, and account use after generation belongs to NJT-0061.
  - zh: 合法设备迁移、受控备份、灾难恢复与同步认证器可能复制状态，但应伴随用户或管理员确认、受保护迁移、旧实例失效、审计和已登记新设备。若攻击者只向账户新增自己的认证器，状态变化归 T1098；本子项要求原生成状态被复制或恢复，而不是一次新绑定。
    en: Legitimate device migration, managed backup, disaster recovery, and syncable authenticators may copy state but should
      include user or administrator confirmation, protected migration, invalidation of the old instance, audit, and a registered
      new device. If the adversary merely adds its own authenticator to the account, the state change belongs to T1098. This
      child requires copying or restoration of the original generator state rather than a new binding.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在受害者终端运行的软件 SecurID、TOTP 或同类认证器保存生成所需 seed 与配置。攻击者控制终端后复制 token container，破解、解密或绕过设备导入检查，在另一系统生成未来代码并配合已获主口令使用。Operation
        Wocao 直接观察 actor 窃取 RSA software token，研究证明该版本设备检查与实际 seed 派生分离。
      en: Software SecurID, TOTP, or comparable authenticators on a victim endpoint retain seed and configuration required
        for generation. After controlling the endpoint, an adversary copies the token container and cracks, decrypts, or bypasses
        device import checks to generate future codes on another system for use with an acquired primary password. Operation
        Wocao directly observed actor theft of an RSA software token, and research established that the version's device check
        was separate from actual seed derivation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要读取认证器存储、取得解密或导入能力、保持时间或计数器同步并知道目标账户和验证者。硬件不可导出 secret、硬件支持的密钥存储、应用完整性、设备证明、用户验证和迁移时旧实例失效会限制复制。错误补丁或不同 token
          版本可能只产生无效代码并暴露操作。
        en: The adversary needs read access to authenticator storage, decryption or import capability, time or counter synchronization,
          and knowledge of the target account and verifier. Hardware non-exportable secrets, hardware-backed key storage,
          app integrity, device attestation, user verification, and invalidation of old instances during migration constrain
          replication. A wrong patch or different token version may produce only invalid codes and expose the operation.
    defender_model:
      paragraphs:
      - zh: 防守方需要端点 token container 访问与进程、认证器绑定和迁移审计、设备或 app instance 标识、IdP 认证方法详情及后继登录来源。许多 OTP 验证者不记录生成设备，且代码值不能采集；因此只有在平台暴露
          authenticator/device binding 或端点证据时才能高置信关联，否则需依赖暴露调查、重绑定历史和来源不连续。
        en: The defender needs endpoint token-container access and process data, authenticator binding and migration audit,
          device or app-instance identifiers, IdP authentication-method details, and later sign-in origin. Many OTP verifiers
          do not record the generating device and code values must not be collected. High-confidence correlation therefore
          requires platform authenticator or device-binding fields or endpoint evidence; otherwise it relies on exposure investigation,
          rebinding history, and origin discontinuity.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 复制 seed 生成的合法算法输出延续原认证器外观
    en: Legitimate algorithm output from a copied seed preserves the original authenticator appearance
  analysis:
    paragraphs:
    - zh: 复制端使用与原软件认证器相同的长期状态和算法，输出通过真实验证者的时间或计数器检查。证明本身没有伪造格式特征，异常只存在于 seed 来源、设备和进程谱系，依赖代码正确性的规则难以区分。Fox-IT 直接证明补丁导入检查后被窃
        token 能生成有效代码，但没有逐次验证者接受记录，故机理置信度为 medium。
      en: The copied instance uses the same long-term state and algorithm as the original software authenticator, producing
        output that passes the genuine verifier's time or counter checks. The proof has no malformed feature; the anomaly
        lies in seed provenance, device, and process lineage, so rules based on code correctness struggle to distinguish it.
        Fox-IT directly shows a stolen token producing valid codes after its import check was patched but does not provide
        per-use verifier acceptance records, keeping mechanism confidence at medium.
