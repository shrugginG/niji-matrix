research:
  limitations:
    paragraphs:
    - zh: Operation Wocao 证明 actor 在真实环境窃取 software token，Fox-IT 实验又证明有效代码生成，但报告明确称生成路径是研究者判断的“最可能”方法，未把每个后继 VPN 登录连接到特定复制实例。其他认证器的存储、设备绑定和同步设计可能完全不同，不能从
        RSA 案例泛化。
      en: Operation Wocao establishes actor theft of a software token in a real environment, and Fox-IT experimentation establishes
        valid code generation, but the report explicitly calls the generation path the researchers' most likely method and
        does not connect each later VPN sign-in to a particular copied instance. Storage, device binding, and synchronization
        can differ completely in other authenticators, so the RSA case cannot be generalized.
