research:
  limitations:
    paragraphs:
    - zh: 公开来源对结果层级的支持不一致。Okta 能把可见消息、定向搜索和一次成功测试分开；Mandiant 证明 ACE-2FA 事务内写盘但没有逐 token 后继使用；Fox-IT 证明真实 token 窃取及实验生成，却把
        actor 的具体生成方法标为最可能；SANS 只支持 Sykipot 样本能力。正式对象必须保留这些差别，不能把能力、实验与在野成功拼成同一链。
      en: Public sources support different outcome tiers. Okta separates visible messages, targeted searches, and one successful
        test. Mandiant establishes disk output inside an ACE-2FA transaction without per-token successor use. Fox-IT establishes
        real token theft and experimental generation but labels the actor's exact generation method most likely. SANS supports
        Sykipot sample capability only. Formal objects must preserve these differences and cannot splice capability, experiment,
        and field success into one chain.
    - zh: IdP、短信/邮件提供者、认证器应用和端点之间通常没有共享 challenge ID；隐私要求也禁止采集 OTP 或 seed 内容。Analytic 的时间窗、authenticator ID、device binding
        与 provider operation 字段必须逐部署验证。若只能看到 MFA 成功而没有材料来源，最多报告身份风险；若只能看到文件或消息暴露而无法证明可用性，应停留在 exposure。
      en: IdPs, SMS or email providers, authenticator apps, and endpoints often lack a shared challenge ID, and privacy requirements
        prohibit collecting OTP or seed contents. Analytic windows, authenticator ID, device binding, and provider-operation
        fields require deployment-specific validation. MFA success without material provenance supports identity risk at most,
        while file or message exposure without usability remains exposure.
