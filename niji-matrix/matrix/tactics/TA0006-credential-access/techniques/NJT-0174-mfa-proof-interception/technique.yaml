schema_version: 2.0.0
type: technique
id: NJT-0174
name:
  zh: 多因素认证证明截获
  en: Multi-Factor Authentication Proof Interception
summary:
  zh: 攻击者取得仍在有效期内的单次 MFA 证明或复制能够持续生成证明的认证器状态，使后续认证呈现为正常第二因素结果而隐藏材料控制者的变化。
  en: Adversaries obtain a still-valid single MFA proof or copy authenticator state capable of generating future proofs, allowing
    later authentication to present a normal second-factor result while hiding the change in material controller.
aliases:
- Multi-Factor Authentication Interception
- T1111
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1111
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1111
definition_and_concept:
  paragraphs:
  - zh: 多因素认证证明截获是攻击者使验证者可接受的第二因素输出或其生成状态进入攻击者控制面。单次证明可以是短时验证码、一次性口令或等价手工认证输出；生成状态可以是软件令牌 seed、令牌容器或足以复现未来证明的材料。直接目的在于取得满足
      MFA 验证步骤的能力，而不是只取得主口令、触发一次请求或偷到认证完成后的 Cookie 与会话令牌。
    en: Multi-Factor Authentication Proof Interception occurs when an adversary gains control of a verifier-acceptable second-factor
      output or the state that generates such outputs. A single proof may be a short-lived verification code, one-time password,
      or comparable manually transferable authenticator output. Generator state may be a software-token seed, token container,
      or material sufficient to reproduce future proofs. The immediate objective is capability to satisfy an MFA verification
      step, rather than merely obtaining a primary password, triggering a request, or stealing a cookie or session token after
      authentication.
  - zh: 证据按五级保存：捕获或读取能力、材料实际到达攻击者、材料在目标与时间上下文中可用、验证者接受、以及认证后身份或会话使用。Okta 对 Scatter Swine 的调查能够把 Twilio 控制台搜索、五分钟 OTP 有效期和一次成功测试分开；Fox-IT
      则区分 actor 窃取软件令牌、研究者确定最可能路径、补丁后生成有效 token 与后继 VPN 账户使用。任何较低级证据都不得自动升级成下一层。
    en: 'Evidence is preserved in five tiers: capture or read capability, actual material arrival to the adversary, usability
      for the target and time context, verifier acceptance, and post-authentication identity or session use. Okta''s Scatter
      Swine investigation separates Twilio-console searches, a five-minute OTP lifetime, and one successful test. Fox-IT separately
      distinguishes actor theft of a software token, researchers'' assessment of the most likely path, valid token generation
      after a patch, and later VPN-account use. No lower tier automatically establishes the next.'
stealth_characteristics:
  paragraphs:
  - zh: 一次性证明由真实验证者签发或真实认证器生成，攻击者若在到期前先消费，身份平台可只看到正确格式、正确账户和一次成功 MFA；材料副本位于消息服务、仿冒输入面或被植入认证组件的事实不一定进入 IdP 决策日志。防守方需要把签发、投递、消息或组件访问、提交来源和消费结果连接，才能看到证明从预期持有者转向另一控制者。
    en: A one-time proof is issued by the genuine verifier or generated by a genuine authenticator. If the adversary consumes
      it first before expiry, the identity platform may see only correct format, the correct account, and a successful MFA
      step. The copy in a messaging service, impersonated input surface, or implanted authentication component need not appear
      in the IdP decision log. Defenders must join issuance, delivery, message or component access, submission origin, and
      consumption result to observe that control moved away from the intended holder.
  - zh: 生成状态复制把短时截获转成较长的证明生成能力。后续代码由相同 seed 与算法生成，验证者可得到与原软件令牌相同的数学结果，而没有每次投递或钓鱼事件；异常转移到 seed 容器读取、导出或导入、设备绑定绕过、同一认证器在不一致设备情境中的使用和暴露后的持续成功。可见结果仍是合法算法输出，材料来源和设备谱系才是区分点。
    en: Generator-state replication turns a short interception opportunity into longer-lived proof generation. Later codes
      come from the same seed and algorithm, so the verifier can receive the same mathematical result as from the original
      software token without a new delivery or phishing event each time. Anomalies move to seed-container read, export or
      import, device-binding bypass, use of one authenticator across inconsistent device contexts, and continuing success
      after exposure. The visible result remains a legitimate algorithm output; material provenance and device lineage carry
      the distinction.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求识别 MFA 对象、攻击者控制的取得路径、实际材料或生成状态结果，以及到达时的有效性或经验证的生成能力。只看到 SMS、邮件或认证器应用，只有消息服务控制台权限、仿冒页面、Hook、软件令牌文件名或智能卡 API，不足以证明材料到达。过期代码、已被先行消费的
      OTP 或无法导入也无法生成有效证明的容器，只支持暴露或失败状态。
    en: Inclusion requires an MFA object, an attacker-controlled acquisition path, an actual material or generator-state result,
      and either validity at arrival or demonstrated generation capability. Merely observing SMS, email, an authenticator
      app, messaging-console authority, an impersonated page, a hook, a software-token filename, or a smart-card API does
      not prove material arrival. An expired code, an OTP already consumed first, or a container that cannot be imported or
      generate a valid proof supports exposure or failure only.
  - zh: NJT-0169/T1056 负责用户输入如何在键盘、仿冒界面或真实消费者中被复制；NJS-0093-003 负责受信认证事务怎样产生第二秘密输出。只有复制结果是仍可满足 MFA 的证明时，本技术才与它们并列。NJT-0165/T1187
      负责受害主体为何主动发出认证交换，NJT-0136/T1557 负责信任路径改变或跨目标证明中继；它们不能替代证明材料到达攻击者的证据。
    en: NJT-0169/T1056 owns how user input is copied through a keyboard, impersonated interface, or genuine consumer. NJS-0093-003
      owns how a trusted authentication transaction creates a second secret output. This technique coexists with them only
      when the copied result is a proof still capable of satisfying MFA. NJT-0165/T1187 owns why a victim principal emits
      an authentication exchange, and NJT-0136/T1557 owns trust-path alteration or cross-destination proof relay. Neither
      substitutes for evidence that proof material reached the adversary.
  - zh: T1621 负责攻击者生成 MFA 请求以及疲劳、误导或简单批准形成的认证结果；用户批准了攻击者自己的 push 请求并不表示攻击者截获了证明。认证方法新增、替换电话或绑定新设备的状态变化归 T1098 等身份状态操纵，本技术只在该变化又使证明实际到达时并列。验证者已接受证明后的账户进入与资源操作归
      NJT-0061/Valid Accounts，Cookie、应用 token 或会话状态归 T1539/T1528 或相应会话对象。
    en: T1621 owns adversary generation of MFA requests and authentication outcomes caused by fatigue, deception, or simple
      approval. A user approving the adversary's own push does not mean the adversary intercepted a proof. Adding an authentication
      method, replacing a phone number, or binding a new device belongs to identity-state manipulation such as T1098; this
      technique coexists only when that change also causes actual proof delivery. Account entry and resource operations after
      verifier acceptance belong to NJT-0061/Valid Accounts, while cookies, application tokens, or session state belong to
      T1539/T1528 or the corresponding session object.
  - zh: 正常 MFA 流程会产生签发、投递、恢复、设备迁移、备用因子、共享设备和远程智能卡记录。判定必须核对用户意图、已登记认证器、变更审批、设备与 session、证明寿命、提交来源和结果。管理员为用户合法重绑令牌、灾难恢复导入和受管
      VDI 智能卡重定向都是强反例，不因跨设备或控制台访问自动归类。
    en: Normal MFA produces issuance, delivery, recovery, device migration, backup-factor, shared-device, and remote-smart-card
      records. Assessment must check user intent, registered authenticator, change approval, device and session, proof lifetime,
      submission origin, and result. Legitimate administrator rebinding, disaster-recovery import, and managed VDI smart-card
      redirection are strong counterexamples and are not classified automatically from cross-device or console access.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在取得主口令后触发一次短信或邮件 MFA，借已攻陷消息服务控制台、被植入的 VPN 认证组件或仿冒验证者读取尚未到期的证明，并在用户或系统先消费前提交。Scatter Swine 事件显示攻击者搜索被触发挑战对应的 OTP，并对一个账户成功测试；SLOWPULSE
        则把 ACE-2FA 流中的用户名和密码写入文件，同时正常控制流继续。
      en: After obtaining a primary password, an adversary may trigger an SMS or email MFA challenge and read the still-valid
        proof through a compromised messaging-service console, an implanted VPN authentication component, or an impostor verifier,
        then submit it before the user or system consumes it first. The Scatter Swine incident shows searches for OTPs corresponding
        to triggered challenges and one successful account test. SLOWPULSE wrote usernames and passwords from the ACE-2FA
        flow to a file while normal control flow continued.
    - zh: 在软件令牌场景中，攻击者可从已控终端窃取 token seed 或容器，在另一系统绕过导入绑定后生成后续验证码。Operation Wocao 的受害环境中发现 actor 窃取 RSA SecurID software token；Fox-IT
        的逆向实验确认补丁一个设备检查即可用该 token 生成有效两因素代码，但没有公开逐次后继登录与具体生成代码的对应关系。
      en: In a software-token scenario, an adversary may steal a token seed or container from a controlled endpoint and generate
        later codes on another system after bypassing import binding. Operation Wocao found the actor stealing an RSA SecurID
        software token in a victim environment. Fox-IT reverse engineering confirmed that patching one device check allowed
        the token to generate valid two-factor codes, but the report does not publish a per-code linkage to later sign-ins.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 单次证明截获要求攻击者先触发或预测正确挑战，控制证明经过的页面、认证组件、终端或服务提供者，并在短有效期和一次使用约束内把材料关联到正确账户、租户与请求。生成状态复制要求读取 seed 或令牌容器、理解格式与算法，并突破设备绑定、加密或导入限制。错误请求、时钟漂移、先行消费、number
          matching、来源绑定和验证者绑定都会降低可用性。
        en: Ephemeral proof capture requires the adversary to trigger or predict the correct challenge, control a page, authentication
          component, endpoint, or service provider traversed by the proof, and map material to the right account, tenant,
          and request within a short lifetime and one-use constraint. Generator-state replication requires reading a seed
          or token container, understanding its format and algorithm, and defeating device binding, encryption, or import
          restrictions. A wrong request, clock drift, prior consumption, number matching, origin binding, and verifier binding
          reduce usability.
      - zh: 本技术不假定攻击者已经登录。即使材料到达，攻击者仍可能缺少主因素、目标应用、请求上下文或允许来源；验证者也可能因风险策略、设备要求或重复使用拒绝证明。后继会话建立必须单独记录，生成状态复制也不能从“文件被复制”直接推断成功
          token。
        en: This technique does not assume the adversary has already signed in. Even after material arrival, the actor may
          lack the primary factor, target app, request context, or permitted origin, and the verifier may reject the proof
          because of risk policy, device requirements, or duplicate use. Later session creation must be recorded separately,
          and generator-state replication cannot be inferred directly from a copied file.
    defender_model:
      paragraphs:
      - zh: 防守方可能分别拥有 IdP challenge 与 sign-in、短信或邮件提供者、认证器生命周期、端点文件与进程、认证设备完整性、帮助台和资源访问记录。可用字段包括 user、tenant、challenge/request/correlation
          ID、认证方法与 authenticator ID、签发与到期时间、destination hash、provider console actor、source IP、device/session、result 及后继 session。真实
          OTP 或 seed 不得进入分析平台。
        en: Defenders may separately hold IdP challenge and sign-in data, SMS or email provider data, authenticator lifecycle,
          endpoint file and process telemetry, authentication-appliance integrity, help-desk, and resource-access records.
          Useful fields include user, tenant, challenge, request or correlation ID, authentication method and authenticator
          ID, issue and expiry time, destination hash, provider-console actor, source IP, device or session, result, and successor
          session. Actual OTPs and seeds must never enter the analytic platform.
      - zh: 不同平台通常缺少跨服务 challenge ID，短信运营商可能不给逐消息访问日志，OTP 验证者也未必暴露 seed 或 authenticator instance。缺少稳定关联时，只能按账户、方法、短时间窗和来源做较弱判断。共享家庭电话、合法设备迁移、漫游、VDI、恢复和帮助台操作会制造同形信号，必须保留
          owner、审批与用户确认。
        en: Platforms often lack a challenge ID that crosses services, SMS carriers may not provide per-message access logs,
          and an OTP verifier may not expose a seed or authenticator instance. Without stable linkage, only weaker joins by
          account, method, short time window, and origin are possible. Shared family phones, legitimate device migration,
          roaming, VDI, recovery, and help-desk actions create equivalent signals and require owner, approval, and user confirmation.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 证明材料控制者变化不进入验证者的常规 MFA 决策记录
    en: Change in proof-material controller remains outside routine MFA decision records
  analysis:
    paragraphs:
    - zh: 验证者通常记录方法、请求和成功或失败，却不记录短信控制台谁查看了消息、认证组件是否生成第二输出或 seed 容器是否被复制。攻击者在这些外部观察面取得证明后，提交仍沿正常验证流程，关键控制变化因而落在默认决策分析之外。Scatter
        Swine 的提供者日志关联和 SLOWPULSE 的第二输出直接证明这种视角分离；跨服务字段不足会限制恢复能力。
      en: A verifier normally records method, request, and success or failure but not who viewed a message in an SMS console,
        whether an authentication component created a second output, or whether a seed container was copied. After the adversary
        acquires proof on those external surfaces, submission follows the normal verification flow, leaving the critical controller
        change outside default decision analytics. Scatter Swine provider-log correlation and SLOWPULSE's second output directly
        establish this separation of vantages; missing cross-service fields limit reconstruction.
  confidence: high
  evidence_refs:
  - REF-000779
  - REF-000777
  - REF-000307
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 真实认证器生成的有效证明掩盖提交者与原持有者不一致
    en: Valid proof from a genuine authenticator masks mismatch between submitter and original holder
  analysis:
    paragraphs:
    - zh: 被截获 OTP 或复制 seed 生成的代码仍满足真实验证者的格式、算法、时间或计数器规则，局部日志呈现为正常第二因素。恶意性不在证明外观，而在生成状态或短时输出的控制者已变化。NIST 说明 OTP 的 seed、nonce、一次接受和有效期语义，Fox-IT
        证明被窃软件 token 在绕过导入检查后生成有效代码；来源没有量化这种外观降低了多少告警。
      en: An intercepted OTP or code generated from a copied seed still satisfies the genuine verifier's format, algorithm,
        time, or counter rules, so a local log presents an ordinary second factor. Malice lies not in proof appearance but
        in changed control of generator state or a short-lived output. NIST defines OTP seed, nonce, one-time acceptance,
        and validity semantics, while Fox-IT shows a stolen software token generating valid codes after an import check was
        bypassed. The sources do not quantify how much this appearance reduces alerts.
  confidence: medium
  evidence_refs:
  - REF-000499
  - REF-000778
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本分类按攻击者控制的证明状态寿命划分。短时单次证明截获只取得一个受有效期和一次接受约束的具体输出；认证证明生成状态复制取得 seed/container 等可跨多个挑战持续派生证明的状态。两者分别要求签发—第二读者—消费关联和容器—导入—跨设备使用关联。
      en: The taxonomy divides by lifetime of proof state under adversary control. Ephemeral Single-Proof Capture obtains
        one output constrained by validity and one-time acceptance. Authentication Proof-Generator State Replication obtains
        seed or container state that derives proofs across challenges. They require issuance-to-second-reader-to-consumption
        and container-to-import-to-cross-device-use lineage respectively.
    - zh: 短信、邮件、网页、软件 token、移动端和桌面端是介质或实现。驻留绑定认证器代理因缺少在野实际调用、证明接受和后继结果完整链而暂缓；新增认证器而非复制原状态归 T1098/NJT-0083。
      en: SMS, mail, web, software token, mobile, and desktop are media or implementations. Resident bound-authenticator proxying
        is deferred for lack of a field chain from actual invocation through proof acceptance and successor outcome. Adding
        a new authenticator rather than copying original state belongs to T1098 and NJT-0083.
  coverage: established
  subtechnique_refs:
  - NJS-0174-001
  - NJS-0174-002
