research:
  limitations:
    paragraphs:
    - zh: Uber、Cisco 与 NCSC 公告公开了重复请求、用户批准和访问结果，但没有发布可逐事件复核的完整 challenge ID、推送送达回执或全部失败次数。身份提供商也可能把通知重投与新事务记录为相似事件。正式实现应以本地日志验证“多笔独立挑战”，并把经验阈值作为调优起点，而不是把任意两次重试自动定性为攻击。
      en: Uber, Cisco, and NCSC reporting discloses repeated requests, user approval, and access outcomes but does not publish
        complete per-event challenge identifiers, delivery receipts, or every failed attempt. Identity providers can also
        record notification redelivery similarly to a new transaction. Formal implementation should verify multiple independent
        challenges in local logs and treat empirical thresholds as tuning starts rather than automatically classifying any
        two retries as an attack.
