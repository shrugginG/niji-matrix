schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0175-001
parent_ref: NJT-0175
name:
  zh: 受信挑战重复压力
  en: Trusted-Challenge Repetition Pressure
summary:
  zh: 攻击者连续生成真实 MFA 挑战，以拒绝、超时和未响应的累积压力提高用户最终批准其中一次的机会。
  en: An adversary repeatedly generates genuine MFA challenges so accumulated denial, timeout, and nonresponse pressure increases
    the chance that a user eventually approves one.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信挑战重复压力是攻击者反复启动针对同一身份的认证或恢复事务，使权威身份系统连续生成 challenge，以打断、困惑或疲劳用户并促使其批准。稳定变量是攻击者操纵的请求节奏与用户决策负担，不是推送、短信、电话、应用或厂商。子项在多个
      challenge 已由身份系统生成时成立；用户是否最终接受决定结果等级，不决定行为是否发生。
    en: Trusted-Challenge Repetition Pressure repeatedly starts authentication or recovery transactions for one identity,
      causing the authoritative identity system to generate challenges that interrupt, confuse, or fatigue the user and encourage
      approval. The stable variable is adversary-controlled request cadence and user decision burden, not push, SMS, calls,
      application, or vendor. The child exists when the identity system has generated multiple challenges. Eventual acceptance
      determines outcome level rather than whether the behavior occurred.
stealth_characteristics:
  paragraphs:
  - zh: 受信挑战重复压力让单个 challenge 的 issuer、应用与账户都保持真实，因而局部分类可能视为普通重试；恶意性质只在跨 transaction 聚合后出现。请求集中并不会减少痕迹，反而产生高频序列，所以本子项的匿迹特性严格限于“每个事件借用权威外观”，不把轰炸误写成时空释痕。可观察差异包括每用户和应用的挑战率、拒绝/超时链、来源与登记设备位置差、没有对应用户发起活动及最后一次批准后的
      session。
    en: Trusted-Challenge Repetition Pressure keeps the issuer, application, and account of each challenge genuine, so local
      classification can treat it as an ordinary retry. Malice appears only after aggregation across transactions. Concentrated
      requests increase traces rather than dilute them, so the stealth property is strictly that each event borrows authoritative
      appearance; bombing is not mislabeled as Spatiotemporal Trace Dilution. Observable differences include per-user and
      per-application challenge rate, denial or timeout chain, divergence between origin and registered-device location, absence
      of matching user initiation, and a session after the final approval.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求同一目标身份收到多笔由攻击者事务生成的权威 challenge，并有节奏控制或连续尝试证据。一次用户误批、普通验证码重发、推送服务重复投递、客户端重连循环和身份提供商故障不自动属于本项；必须比较 transaction
      ID、来源、应用和用户意图。密码猜测归 T1110，但正确口令之后反复触发 MFA 可同时满足两项的不同阶段。用户批准、token 签发和资源访问作为后继结果另行记录。
    en: Inclusion requires multiple authoritative challenges for one target identity generated by adversary transactions,
      with evidence of cadence control or repeated attempts. One accidental approval, ordinary code resend, duplicate push
      delivery, client reconnect loop, and IdP outage do not automatically qualify and require comparison of transaction ID,
      origin, application, and user intent. Password guessing belongs to T1110, while repeated MFA generation after a correct
      password can satisfy both objects at different stages. User approval, token issuance, and resource access remain successor
      outcomes.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Uber 2022 年披露攻击者反复尝试登录承包商账户，每次产生双因素批准请求，用户起初阻止，后来接受一次并让攻击者成功登录。NCSC 记录 SVR 反复推送 MFA 请求直到受害者接受；Cisco 同时观察高量请求和多日语音钓鱼。前两份资料直接支持重复节奏，Cisco
        说明重复压力可与兄弟项的外部情境并用，但不能把三个事件拼成一个统一攻击链。
      en: Uber disclosed in 2022 that an adversary repeatedly attempted a contractor account, producing a two-factor approval
        request each time; the user initially blocked access, later accepted one, and enabled successful sign-in. The NCSC
        records the SVR repeatedly pushing MFA requests until a victim accepts, while Cisco observed high-volume requests
        together with voice phishing over several days. The first two directly support repetition cadence, and Cisco shows
        repetition can coexist with the sibling's external context, but the three incidents cannot be spliced into one chain.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要持续触发 challenge、知道目标身份，并在请求速率、账户锁定、风险评分、challenge 生命周期和用户上报之间维持操作。正确主口令会提高进入 MFA 阶段的稳定性，但 SSPR 或无口令入口可能改变前提。限流、连续拒绝后的临时阻断、欺诈报告、风险
          Conditional Access 和抗钓鱼认证会减少机会；请求过密也可能迅速引发用户或 SOC 注意。
        en: The adversary needs sustained challenge generation, target identity knowledge, and operational continuity across
          request-rate controls, account lockout, risk scoring, challenge lifetime, and user reporting. A correct primary
          password makes reaching the MFA stage more reliable, while SSPR or passwordless entry can change prerequisites.
          Rate limiting, temporary blocks after repeated denial, fraud reporting, risk-based Conditional Access, and phishing-resistant
          authentication reduce opportunity, while excessive density can quickly attract user or SOC attention.
    defender_model:
      paragraphs:
      - zh: 防守方需要按 user、application、source、device、request/correlation ID 和 challenge result 聚合，而不是只看最终 sign-in。应区分 IdP 创建的独立挑战与同一
          challenge 的通知重投，记录 denied、timeout、no-response、fraud 和 approved；对批准后 token/session 使用建立后继关联。若平台只保留最终成功或把多个步骤折叠为一条登录记录，重复压力会被低估。
        en: Defenders need aggregation by user, application, source, device, request or correlation identifier, and challenge
          result rather than final sign-in alone. They must distinguish independent IdP-created challenges from redelivery
          of one challenge, retain denied, timeout, no-response, fraud, and approved states, and join token or session use
          after approval. A platform retaining only final success or folding several steps into one sign-in record undercounts
          repetition pressure.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 每次重复均保留权威 challenge 的真实身份外观
    en: Every repetition preserves the genuine identity appearance of an authoritative challenge
  analysis:
    paragraphs:
    - zh: 攻击者不伪造通知，而是让真实 IdP 为真实用户生成请求。每个事件单独看都有正常 issuer、factor 和应用字段，只有跨事务的节奏、来源与用户意图显示恶意。Uber、NCSC 与 Cisco 直接支持重复真实请求到批准或访问的链；高频本身容易检测，因此机理收益依赖防守方是否只判断单个事件而不聚合序列。
      en: The adversary does not forge a notification and instead makes the genuine IdP generate a request for the real user.
        Each event separately has normal issuer, factor, and application fields, while cadence, origin, and user intent across
        transactions reveal malice. Uber, NCSC, and Cisco directly support chains from repeated genuine requests to approval
        or access. High frequency is readily detectable, so the mechanism benefits only when defenders classify isolated events
        without sequence aggregation.
