schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0175-002
parent_ref: NJT-0175
name:
  zh: 跨信道请求情境同步
  en: Cross-Channel Request-Context Synchronization
summary:
  zh: 攻击者在独立通信或服务流程中提供可信叙事，并与其 MFA 事务同步，使用户把少量恶意 challenge 解释为预期动作。
  en: An adversary supplies a trusted narrative through a separate communication or service workflow and synchronizes it with
    an MFA transaction so the user interprets a small number of malicious challenges as expected action.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨信道请求情境同步是攻击者在聊天、语音、邮件、服务台或等价关系信道中冒充可信人员或职能权威，并把叙事时间、目标应用和用户动作与攻击者发起的 MFA challenge 对齐，使用户把该 challenge 视为支持、修复、安保验证或其他合理流程。稳定变量是外部情境替代真实事务发起者解释权，不是通信产品、云厂商、号码或设备。请求生成与情境同步必须分别有证据；只有社工而没有
      MFA challenge 归相邻技术。
    en: Cross-Channel Request-Context Synchronization impersonates a trusted person or functional authority through chat,
      voice, mail, help desk, or an equivalent relationship channel and aligns narrative timing, target application, and requested
      user action with an adversary-initiated MFA challenge. The user then interprets the challenge as support, remediation,
      security verification, or another plausible workflow. The stable variable is external context replacing the true transaction
      initiator's explanation, not communication product, cloud vendor, phone number, or device. Request generation and context
      synchronization each need evidence; social engineering without an MFA challenge belongs to adjacent techniques.
stealth_characteristics:
  paragraphs:
  - zh: 跨信道请求情境同步可以只生成一次或少量请求，避开依赖高频轰炸的阈值。通信系统看到一个支持或安保对话，IdP 看到一次真实 challenge、用户批准和正常 token，单侧均可能缺少恶意特征。异常位于发送者与权威目录不一致、外部或新关系、缺少独立确认、登录来源与用户设备不一致，以及通信请求动作与
      IdP 事务在窄窗内对齐。真实支持账户被攻陷时，来源差分会进一步缩小。
    en: Cross-Channel Request-Context Synchronization can generate only one or a few requests and avoid thresholds dependent
      on high-volume bombing. A communication system sees a support or security conversation, while the IdP sees a genuine
      challenge, user approval, and ordinary token; either side alone can lack a malicious feature. The anomaly lies in sender
      divergence from an authoritative directory, an external or new relationship, missing independent confirmation, mismatch
      between sign-in origin and user device, and alignment of the communication request with the IdP transaction in a narrow
      window. Compromise of a real support account further narrows provenance differences.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求攻击者控制外部叙事、发起对应 MFA challenge，并使用户收到或处理两者；用户批准与 token 结果用于提高置信度但不是请求生成的必要条件。纯粹 MFA 轰炸无外部叙事归兄弟项；普通帮助台身份冒充无 MFA challenge
      归 NJT-0118；用户把代码输入仿冒页面且被攻击者读取时另归 NJT-0169 或 T1111；帮助台合法指导 MFA 重注册、设备更换和恢复必须由工单、已知联系人、批准与身份事务解释。
    en: Inclusion requires adversary control of the external narrative, initiation of a corresponding MFA challenge, and victim
      receipt or handling of both. User approval and token outcome increase confidence but are not required to establish request
      generation. Pure MFA bombing without an external narrative belongs to the sibling. Help-desk impersonation without an
      MFA challenge belongs to NJT-0118. If a user enters a code into an impersonated page and the adversary reads it, NJT-0169
      or T1111 applies separately. Legitimate help-desk guidance for MFA reregistration, device replacement, and recovery
      requires a ticket, known contact, approval, and identity-transaction explanation.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Cisco 调查确认攻击者在取得员工口令后，以多个受信支持组织为幌子进行多日语音钓鱼，试图让用户接受攻击者发起的 MFA 推送，并最终成功取得 VPN 访问。Microsoft 记录 Midnight Blizzard 使用失陷小企业租户和安全主题域名在
        Teams 中冒充技术支持，要求目标把攻击者认证流显示的数字输入 Authenticator；用户完成后攻击者获得 token 并访问 Microsoft 365。两案跨不同信道和界面，却共享外部叙事与权威 challenge
        同步的变量。
      en: Cisco confirmed that after acquiring an employee password, the adversary conducted voice phishing over several days
        under the guise of several trusted support organizations, attempted to make the user accept adversary-initiated MFA
        pushes, and ultimately gained VPN access. Microsoft records Midnight Blizzard using compromised small-business tenants
        and security-themed domains to impersonate technical support in Teams and ask targets to enter the number displayed
        by the adversary's authentication flow into Authenticator. After completion, the adversary obtained a token and accessed
        Microsoft 365. The incidents span different channels and interfaces while sharing synchronization of external narrative
        with an authoritative challenge.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能发起目标 MFA 事务、在 challenge 有效期内联系用户，并掌握足以构造可信角色、应用和故障叙事的组织知识。控制真实合作方、支持账户或已失陷租户会增强可信度；只用同形域名或陌生号码仍可能被外部标记暴露。数字匹配会迫使攻击者实时同步具体数字，但不会阻止已建立沟通的攻击者告诉用户输入该值。独立回呼、抗钓鱼认证和禁止支持人员索要
          MFA 动作会削弱此路径。
        en: The adversary must initiate the target MFA transaction, contact the user within challenge lifetime, and know enough
          organizational context to construct a credible role, application, and failure narrative. Control of a real partner,
          support account, or compromised tenant improves credibility, while a lookalike domain or unfamiliar number can be
          exposed by external labeling. Number matching forces real-time synchronization of a specific number but does not
          prevent an established communicator from telling the user to enter it. Independent callback, phishing-resistant
          authentication, and a policy that support personnel never request MFA action weaken this path.
    defender_model:
      paragraphs:
      - zh: 防守方需将发送者/呼叫者身份、租户、外部标签、thread 或 case、声明角色、请求动作和确认状态，与 IdP 的 user、application、source、device、request/correlation
          ID、challenge 结果和 token/session 连接。通信与身份平台通常没有共同 ID，建议在合法支持流程中生成不可复用的工单引用并让 IdP 或支持工具记录其安全摘要。个人通信不可见时，只能依赖用户报告、异常
          challenge 情境和后继 sign-in，归因强度应降低。
        en: Defenders need to join sender or caller identity, tenant, external label, thread or case, claimed role, requested
          action, and confirmation status to IdP user, application, source, device, request or correlation identifier, challenge
          outcome, and token or session. Communication and identity platforms rarely share an identifier. Legitimate support
          workflows should generate a nonreusable case reference and let the IdP or support tool retain its safe digest. When
          personal communication is invisible, defenders rely on user reporting, anomalous challenge context, and successor
          sign-in and must lower attribution strength.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 信任叙事与认证结果跨信道分离使单侧事件难以重建
    en: Separation of trust narrative and authentication outcome across channels impedes one-sided reconstruction
  analysis:
    paragraphs:
    - zh: 攻击者在通信面建立支持或安保理由，在身份面生成 challenge 并取得用户动作。发送者关系和声明角色不进入普通 IdP 记录，request ID 与 token 也不进入通话或聊天日志；短窗口或单平台分析因此只能看到半条链。Cisco
        与 Midnight Blizzard 直接证明这种分布，现有关系权威请求关联能够解释通信侧身份与用户动作，新专用分析仍需加入 challenge 与 token 阶段。
      en: The adversary establishes a support or security reason in the communication plane and generates a challenge plus
        user action in the identity plane. Sender relationship and claimed role do not enter ordinary IdP logs, while request
        ID and token do not enter call or chat records. A short-window or single-platform analysis therefore sees half the
        chain. Cisco and Midnight Blizzard directly establish this distribution. Existing relational-authority request correlation explains the communication-side identity and user action, while the specialized analysis must add challenge and token stages.
  confidence: high
  evidence_refs:
  - REF-000784
  - REF-000436
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 可信职能叙事为真实 challenge 借用预期业务外观
    en: A trusted functional narrative lends expected business appearance to a genuine challenge
  analysis:
    paragraphs:
    - zh: 攻击者把真实 MFA challenge 解释为服务台、安保或恢复流程的一部分，使用户用熟悉的组织角色和工作情境判断请求，而不是核对真正的登录发起者。Cisco 的可信支持幌子和 Midnight Blizzard 的安全主题租户直接支持这一特征替代；外部标签、权威目录、已知回呼号码、工单和应用/位置情境仍可揭示不一致。
      en: The adversary explains a genuine MFA challenge as part of help-desk, security, or recovery work, causing the user
        to judge the request through a familiar organizational role and business context rather than verify the true sign-in
        initiator. Cisco's trusted-support pretexts and Midnight Blizzard's security-themed tenants directly support the feature
        substitution. External labels, authoritative directories, known callback numbers, cases, and application or location
        context can still expose mismatch.
  confidence: high
  evidence_refs:
  - REF-000784
  - REF-000436
