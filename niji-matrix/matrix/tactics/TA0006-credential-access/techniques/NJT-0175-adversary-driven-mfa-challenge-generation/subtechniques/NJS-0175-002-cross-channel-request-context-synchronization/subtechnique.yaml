research:
  limitations:
    paragraphs:
    - zh: Cisco 和 Microsoft 提供完整的叙事、用户动作和访问或 token 结果，但没有公开通话或 Teams 事件与 IdP challenge 的原始共同键；正式检测只能按用户、时间和应用近似关联。真实支持账户或租户被攻陷时，来源异常也可能消失。数字匹配及额外情境提高验证成本却不是确定性阻断，需与抗钓鱼认证、独立确认和自动风险响应组合。
      en: Cisco and Microsoft provide complete narrative, user-action, and access or token outcomes but do not publish a raw
        common identifier between call or Teams events and IdP challenges. Formal detection can only approximate joins by
        user, time, and application. Compromise of a genuine support account or tenant can also remove provenance anomalies.
        Number matching and additional context increase verification cost but are not deterministic blocks and require phishing-resistant
        authentication, independent confirmation, and automated risk response.
