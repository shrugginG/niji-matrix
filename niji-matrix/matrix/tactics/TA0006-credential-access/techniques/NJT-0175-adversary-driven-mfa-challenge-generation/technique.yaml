research:
  limitations:
    paragraphs:
    - zh: 一手证据公开粒度不一致。Uber 提供重复请求到成功登录的公司披露；Cisco 提供口令、请求、语音社工、批准、VPN 和认证器新增的事件链；Microsoft 提供数字匹配式跨信道社工到 token 的链；NCSC 提供
        SVR campaign-level 结论。它们足以支持父行为和两个变量，却都没有发布可拼接的原始 challenge、移动送达、通信和 token 全量数据。不同事件不得组合成一笔“完整观测”，具体案例的阶段置信度应随原始日志调整。
      en: Primary evidence has uneven public granularity. Uber provides a company disclosure from repeated requests through
        successful login. Cisco supplies an incident chain across password, requests, voice social engineering, approval,
        VPN, and authenticator addition. Microsoft supplies a number-matching cross-channel chain through token issuance.
        NCSC provides a campaign-level SVR conclusion. Together they support parent behavior and both variables, but none
        publishes complete raw challenge, mobile delivery, communication, and token data that can be joined. Separate incidents
        cannot be combined into one complete observation, and stage confidence in a specific case should follow its original
        logs.
    - zh: IdP、MFA 供应商、VPN 与 SaaS 对 request、challenge、送达、响应和 session 的字段与保留不同；某些日志是延迟聚合，某些只记录最终 allow/deny。跨信道通信经常位于个人设备，无法集中采集。检测在缺少共同
        ID 时只能强推断，必须明确 unknown 阶段；恢复也需验证第三方应用 session 是否真正撤销，不能只相信 IdP 控制台显示。
      en: IdPs, MFA providers, VPNs, and SaaS platforms differ in request, challenge, delivery, response, session fields,
        and retention. Some logs are delayed aggregates and some record only final allow or deny. Cross-channel communication
        often occurs on personal devices and cannot be centrally collected. Detection without a common identifier is strong
        inference and must preserve unknown stages. Recovery must verify that third-party application sessions were actually
        revoked rather than trusting the IdP console alone.
