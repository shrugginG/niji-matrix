schema_version: 2.0.0
type: technique
id: NJT-0175
name:
  zh: 攻击者驱动的多因素认证挑战生成
  en: Adversary-Driven Multi-Factor Authentication Challenge Generation
summary:
  zh: 攻击者控制登录、无口令或恢复事务，使权威身份系统向受害者的已登记因素生成挑战，并利用真实请求外观、重复压力或跨信道情境提高被批准的机会。
  en: An adversary controls a sign-in, passwordless, or recovery transaction so the authoritative identity system generates
    a challenge for the victim's registered factor, using genuine-request appearance, repetition pressure, or cross-channel
    context to increase the chance of approval.
aliases:
- Multi-Factor Authentication Request Generation
- T1621
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1621
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1621
definition_and_concept:
  paragraphs:
  - zh: 攻击者驱动的多因素认证挑战生成是攻击者向身份提供商、应用登录入口、无口令认证或账户恢复流程发起一笔针对受害身份的事务，使系统创建并尝试投递需要该身份登记因素响应的 MFA 挑战。请求可要求确认、数字匹配、输入验证码、接听电话或执行等价动作，但传输和界面不改变父对象。直接目的在于把攻击者的认证事务带到用户决策点，使缺少第二因素的攻击者有机会得到权威系统认可的响应。
    en: Adversary-Driven Multi-Factor Authentication Challenge Generation occurs when an adversary initiates a transaction
      against a victim identity through an identity provider, application sign-in, passwordless authentication, or account
      recovery flow, causing the system to create and attempt delivery of an MFA challenge that requires a registered factor
      to respond. The request may ask for confirmation, number matching, code entry, a phone response, or an equivalent action,
      but transport and interface do not change the parent object. The direct purpose is to bring the adversary's transaction
      to a user decision point, giving an actor without the second factor an opportunity to obtain an authoritative response.
  - zh: 证据链应区分六个阶段：攻击者是否掌握或绕过了主认证前提，身份系统是否创建挑战，挑战是否实际到达登记因素，用户如何响应，身份系统是否接受响应并签发令牌或会话，以及该会话是否访问资源。Uber 的公司披露直接记录重复登录、每次产生双因素批准请求、用户最终接受和攻击者成功登录；Microsoft
      的 Midnight Blizzard 调查记录攻击者生成数字、用户在 Authenticator 输入、随后签发令牌。相比之下，只看到异常登录来源、移动通知截图或用户口述，不能自动证明权威挑战、批准和会话三者均已发生。
    en: 'Evidence should separate six stages: whether the adversary possessed or bypassed a primary-authentication prerequisite,
      whether the identity system created a challenge, whether it reached a registered factor, how the user responded, whether
      the identity system accepted the response and issued a token or session, and whether that session accessed resources.
      Uber''s company disclosure directly records repeated sign-ins, a two-factor approval request on each attempt, eventual
      user acceptance, and successful adversary login. Microsoft''s Midnight Blizzard investigation records an adversary-generated
      number, user entry in Authenticator, and subsequent token issuance. An anomalous sign-in origin, mobile-notification
      screenshot, or user recollection alone cannot establish that authoritative challenge, approval, and session all occurred.'
stealth_characteristics:
  paragraphs:
  - zh: 本行为使用组织自己的身份系统、登记因素和正常通知或验证界面。单次事件中的 issuer、品牌、TLS、应用名称、用户身份和挑战格式都可以完全真实；恶意差异位于谁启动了底层事务、来源设备和网络、请求节奏以及用户是否预期该挑战。只按通知真伪或身份提供商域名分类的防守方会把攻击者发起的真实挑战与合法登录混同。真实通道外观不会消除身份日志，request/correlation
      ID、来源、设备、应用、认证步骤和结果仍可恢复因果。
    en: The behavior uses the organization's own identity system, registered factor, and normal notification or verification
      interface. Issuer, branding, TLS, application name, user identity, and challenge format can all be genuine in an individual
      event. The malicious difference lies in who initiated the underlying transaction, source device and network, request
      cadence, and whether the user expected the challenge. A defender classifying only notification authenticity or identity-provider
      domain can conflate an adversary-initiated genuine challenge with a legitimate sign-in. Genuine-channel appearance does
      not remove identity logs; request or correlation identifiers, origin, device, application, authentication step, and
      outcome can recover causality.
  - zh: 重复压力与跨信道情境产生不同痕迹。重复压力留下同一用户短窗内多个 challenge、拒绝、超时或未响应，最终可能出现一次批准；序列本身通常高可见，匿迹收益仅在每个请求都带有真实 issuer 外观，不能声称轰炸降低事件量。跨信道情境可用一次或少量请求配合电话、聊天或服务台叙事，把发起者线索留在通信系统，把
      challenge 和 token 留在身份系统，两侧各自看似普通。Cisco 与 Microsoft 的事件证明这种分面，防守方需按用户、时间、声明角色、应用与认证事务连接。
    en: Repetition pressure and cross-channel context leave different traces. Repetition produces multiple challenges, denials,
      timeouts, or nonresponses for one user in a short window and may end with one approval. The sequence is usually conspicuous;
      its stealth benefit is limited to every request carrying a genuine issuer appearance, and bombing must not be described
      as reducing event volume. Cross-channel context can pair one or a few requests with a call, chat, or help-desk narrative,
      leaving initiator clues in communication systems and challenge or token evidence in identity systems, where each side
      can look ordinary. Cisco and Microsoft incidents establish this split, requiring joins by user, time, claimed role,
      application, and authentication transaction.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求攻击者控制目标身份的认证或恢复事务，并有权威身份系统生成面向其已登记因素的 MFA 挑战证据。攻击者可以使用已得口令、无口令入口、SSPR 或其他允许生成挑战的前置路径；前提不决定分类。用户拒绝或超时仍可证明请求生成，但不能证明
      MFA 已绕过。只有用户批准而缺少发起事务、应用、来源或 token 对应关系时，应保留为异常批准，不可直接归因攻击者；合法 VPN 重连、应用重新认证、设备迁移、用户主动恢复和服务台协助是必要反例。
    en: Inclusion requires adversary control of an authentication or recovery transaction for the target identity and evidence
      that the authoritative identity system generated an MFA challenge for a registered factor. The adversary may use an
      acquired password, passwordless entry, SSPR, or another prerequisite path that permits challenge generation; the prerequisite
      does not define classification. User denial or timeout can establish request generation but not MFA bypass. An approval
      without corresponding initiating transaction, application, source, or token should remain an anomalous approval rather
      than automatic adversary attribution. Legitimate VPN reconnect, application reauthentication, device migration, user-initiated
      recovery, and help-desk assistance are necessary counterexamples.
  - zh: T1111 处理攻击者截获或取得 MFA 证明、验证码或响应；本技术让权威系统把挑战送到真实登记因素并等待用户动作，不要求攻击者读取第二因素内容。NJT-0165/T1187 促使受害端向攻击者可观察监听目标外发认证交换，而本技术由权威身份系统向受害因素投递挑战。NJT-0169/T1056
      在秘密或代码输入路径中复制内容；如果用户把 MFA 代码输入攻击者控制页面，可与本技术并列，但挑战生成不能代替输入已被捕获的证据。批准后的有效账户登录、token 或 session 使用属于后继身份使用；添加攻击者认证器、电话或设备属于
      T1098/NJT-0083；修改验证流程或策略属于 T1556/NJT-0093；没有 MFA 事务的普通帮助台社工归 NJT-0118 或相应初始访问对象。
    en: T1111 covers interception or acquisition of an MFA proof, code, or response. This technique makes the authoritative
      system send a challenge to the genuine registered factor and wait for user action without requiring the adversary to
      read second-factor content. NJT-0165/T1187 causes a victim endpoint to emit an authentication exchange toward an adversary-observable
      listener, whereas this technique has the authoritative identity system deliver a challenge to the victim factor. NJT-0169/T1056
      copies a secret or code along the input path; if a user enters an MFA code into an adversary-controlled page, both may
      apply, but challenge generation cannot substitute for proof of captured input. Valid-account login, token, or session
      use after approval is a successor identity-use event. Adding an adversary authenticator, phone, or device belongs to
      T1098/NJT-0083; changing verification flow or policy belongs to T1556/NJT-0093; ordinary help-desk social engineering
      without an MFA transaction belongs to NJT-0118 or the relevant initial-access object.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在重复压力场景中，攻击者以已得主口令或其他可触发入口反复尝试登录，使真实身份系统连续向同一用户发出请求。Uber 披露承包商最初多次阻止这些请求，后来接受一次，攻击者成功登录；NCSC 记录 SVR 反复推送直至受害者接受。此场景的前半段可在无成功会话时成立，后半段需要
        challenge 结果、token 或 sign-in 成功独立证明。
      en: In repetition-pressure scenarios, an adversary repeatedly attempts sign-in with an acquired primary password or
        another challenge-capable entry point, causing the genuine identity system to send requests to the same user. Uber
        disclosed that a contractor initially blocked the requests, later accepted one, and the adversary signed in successfully.
        The NCSC reports the SVR repeatedly pushing requests until a victim accepts. The first stage exists without a successful
        session, while the latter requires independent challenge outcome, token, or sign-in-success evidence.
    - zh: 在跨信道情境场景中，攻击者先发起一笔会显示数字或批准提示的认证事务，再通过电话、聊天或服务台身份解释为何用户应完成它。Cisco 记录攻击者以多个可信支持组织为幌子持续语音钓鱼并最终得到推送批准；Midnight Blizzard
        使用失陷租户中的外部 Teams 身份冒充支持，指导目标输入攻击者事务显示的数字并获得 token。通信介质不是子项，稳定变量是事务解释权由身份系统之外的攻击者信道提供。
      en: In cross-channel-context scenarios, the adversary starts an authentication transaction that displays a number or
        approval prompt, then explains through a call, chat, or help-desk identity why the user should complete it. Cisco
        records repeated voice phishing under several trusted-support pretexts that ultimately obtained push approval. Midnight
        Blizzard used an external Teams identity from a compromised tenant to impersonate support, instructed the target to
        enter the number shown by the adversary transaction, and received a token. The communication medium does not define
        the child; the stable variable is that the transaction's explanation comes from an adversary-controlled channel outside
        the identity system.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要目标身份标识和一个可使身份系统进入 MFA 阶段的路径。某些流程要求正确主口令，另一些无口令或 SSPR 流程可能只要求账户信息和可用入口；正式案例必须记录具体前提。重复压力要求持续发起事务且未被限流、风险策略或用户欺诈报告封锁；跨信道情境要求能联系用户、构造可信角色或关系并同步
          challenge 的有效期、应用和数字。攻击者不能保证通知送达、用户响应、响应被接受或最终 session 可用。
        en: The adversary needs at least a target identity and a path that brings the identity system to an MFA stage. Some
          flows require a correct primary password, while passwordless or SSPR flows can require only account information
          and an available entry point; formal cases must record the actual prerequisite. Repetition pressure requires continued
          transaction initiation without rate limiting, risk policy, or a user fraud report blocking it. Cross-channel context
          requires user contact, a credible role or relationship, and synchronization with challenge lifetime, application,
          and number. The adversary cannot guarantee delivery, user response, acceptance, or a usable final session.
      - zh: 数字匹配和应用或地理情境会增加用户核对信息，但 Midnight Blizzard 案例说明攻击者可直接告诉用户输入其事务数字；因此这些控制降低偶然盲批，不替代抗钓鱼认证、独立确认和风险阻断。攻击者若已经控制服务台、真实通信账户或用户设备，外部标签和关系历史也可能失效。已获
          token 的生命周期、设备绑定和资源权限决定后继价值，不应从一次批准反推所有应用均已失守。
        en: Number matching and application or geographic context give the user more information, but the Midnight Blizzard
          case shows an adversary can instruct the user to enter the adversary transaction's number. These controls reduce
          accidental blind approval but do not replace phishing-resistant authentication, independent confirmation, or risk
          blocking. External labels and relationship history can also fail when the adversary controls the help desk, a genuine
          communication account, or the user's device. Token lifetime, device binding, and resource entitlement determine
          successor value, so one approval cannot imply every application was compromised.
    defender_model:
      paragraphs:
      - zh: 防守方假定能取得身份提供商的 primary-auth、challenge、认证步骤、结果、应用、来源、设备、Conditional Access 与 token 或 session 数据，并以 request、correlation、transaction
          或 root-session ID 连接。Microsoft 登录详情可给认证方法序列和结果，但聚合字段可能延迟或暂时不完整；Duo 日志可提供应用、用户、factor、result、reason、来源与 txid。用户设备是否真正显示通知常缺少独立回执，因此“generated”“delivered”“responded”必须按平台能力分开。
        en: The defender is assumed to obtain identity-provider primary-authentication, challenge, authentication-step, result,
          application, origin, device, Conditional Access, and token or session data and join them through request, correlation,
          transaction, or root-session identifiers. Microsoft sign-in details can expose authentication-method sequence and
          outcome, while aggregated fields can be delayed or temporarily incomplete. Duo logs can provide application, user,
          factor, result, reason, origin, and transaction identifier. Independent proof that a user device displayed a notification
          is often unavailable, so generated, delivered, and responded states must remain platform-specific.
      - zh: 跨信道场景还要求通信、服务台或通话元数据，包括发送者、租户或号码、外部标记、声明角色、thread/case ID、请求动作和独立确认状态。个人电话、加密聊天和未受管设备可能完全不可见；即使通信可见，也通常没有与 IdP
          challenge 共用的事务 ID，只能按用户、时间、应用和动作做概率关联。检测与响应不得采集 OTP、完整 token 或其他可复用秘密，应保存安全摘要和结果状态。
        en: Cross-channel scenarios also require communication, help-desk, or call metadata including sender, tenant or number,
          external label, claimed role, thread or case ID, requested action, and independent-confirmation state. Personal
          phones, encrypted chats, and unmanaged devices may be completely invisible. Even visible communications usually
          lack a transaction identifier shared with the IdP challenge and allow only probabilistic joins by user, time, application,
          and action. Detection and response must not collect OTPs, full tokens, or other reusable secrets and should retain
          safe digests and outcome state instead.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 权威身份系统的真实挑战外观掩盖恶意发起者
    en: Genuine challenge appearance from the authoritative identity system masks the malicious initiator
  analysis:
    paragraphs:
    - zh: 攻击者通过正常登录、无口令或恢复入口使真实 IdP 和已登记认证器生成 challenge。用户与单点传感器看到熟悉品牌、应用和账户，以及密码学上真实的请求；被替换的是事务发起者和目的，而不是界面真伪。Uber、Cisco
        和 Microsoft 事件直接证明真实 MFA 请求可由攻击者发起并最终获批。request/correlation ID、源 IP、设备、应用、用户预期和后继 session 仍能破坏伪装，故机理不等于请求不可见。
      en: The adversary uses a normal sign-in, passwordless, or recovery entry so the genuine IdP and registered authenticator
        generate the challenge. The user and a local sensor see familiar branding, application, account, and a cryptographically
        genuine request; transaction initiator and purpose change while interface authenticity does not. Uber, Cisco, and
        Microsoft incidents directly establish genuine MFA requests initiated by an adversary and eventually approved. Request
        or correlation ID, source IP, device, application, user expectation, and successor session can still break the disguise,
        so the mechanism does not make requests invisible.
  confidence: high
  evidence_refs:
  - REF-000783
  - REF-000784
  - REF-000436
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 外部信任叙事与 MFA 事务分布在不同信道和审计面
    en: External trust narrative and MFA transaction are distributed across separate channels and audit planes
  analysis:
    paragraphs:
    - zh: 跨信道攻击把冒充支持或安保的叙事放在聊天、语音或服务流程，把 challenge、批准和 token 放在身份系统。任何单一审计面只看到一次看似普通的沟通或一次真实认证动作；只有把发送者关系、声明角色、用户、时间、应用和 IdP
        事务连接后才能还原因果。Cisco 和 Midnight Blizzard 提供直接事件证据，但个人通信经常不可采集，公开资料也没有量化普遍告警下降幅度，因此保持 medium。
      en: Cross-channel attacks place the support or security impersonation narrative in chat, voice, or a service workflow,
        while challenge, approval, and token remain in the identity system. Any one audit plane sees an apparently ordinary
        communication or genuine authentication action. Causality emerges only after joining sender relationship, claimed
        role, user, time, application, and IdP transaction. Cisco and Midnight Blizzard provide direct incident evidence,
        but personal communication is often unavailable and public evidence does not quantify general alert reduction, so
        confidence remains medium.
  confidence: medium
  evidence_refs:
  - REF-000784
  - REF-000436
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本分类按攻击者控制 challenge 被用户解释和响应的方式划分。受信挑战重复压力把异常放在多笔真实 challenge 的跨事务节奏；跨信道请求情境同步用身份系统之外的支持或安保叙事解释一笔或少量真实 challenge。两者需要不同的时间窗、通信数据和恢复动作。
      en: The taxonomy divides by how adversary-controlled challenges are interpreted and answered. Trusted-Challenge Repetition
        Pressure places the anomaly in cadence across genuine challenge transactions. Cross-Channel Request-Context Synchronization
        explains one or a few genuine challenges through support or security narrative outside the identity system. They require
        different windows, communication data, and recovery.
    - zh: 推送、电话、短信、Teams、云厂商和设备不是兄弟边界。低频时机、跨应用分布和通知重投缺少独立稳定证据，不建子项；帮助台冒充但没有 IdP challenge 归 NJT-0118。 高频 challenge 会增加可见痕迹，不构成时空释痕变量。
      en: Push, phone, SMS, Teams, cloud vendor, and device do not define siblings. Low-volume timing, cross-application distribution,
        and notification redelivery lack independent stable evidence and do not form children. Help-desk impersonation without
        an IdP challenge belongs to NJT-0118. High challenge volume increases visible traces and does not constitute a spatiotemporal-dilution
        variable.
  coverage: established
  subtechnique_refs:
  - NJS-0175-001
  - NJS-0175-002
