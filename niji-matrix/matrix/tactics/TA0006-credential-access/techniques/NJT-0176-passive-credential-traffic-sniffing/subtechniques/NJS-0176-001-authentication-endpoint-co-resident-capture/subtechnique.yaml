research:
  limitations:
    paragraphs:
    - zh: Mandiant 证明 LOOKOVER 已部署并配置处理真实 TACACS+ 报文，但报告指出其在加密提取凭据并写盘时崩溃，且没有证明后继账户使用。端点捕获与认证程序内直接秘密记录在实现上可能接近，必须依据数据是否来自网络报文观察而非函数参数或应用内对象进行边界判断。
      en: Mandiant establishes that LOOKOVER was deployed and configured to process real TACACS+ packets, but reports a crash
        while encrypting extracted credentials for disk output and does not establish successor account use. Endpoint packet
        capture and direct secret logging inside an authentication program can look similar in implementation, so the boundary
        must turn on whether data came from packet observation rather than function arguments or application objects.
