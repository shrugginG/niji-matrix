research:
  limitations:
    paragraphs:
    - zh: 联合通告直接证明原生 PCAP 收集和文件命名，且在至少一案中发现可逆保存的 TACACS+ 共享秘密；但“主要目标”和“可离线解密”仍是分析判断，不能写成行为者已成功解密并使用某个管理员口令。设备厂商对抓包对象、AAA 字段和运行状态保留差异很大。
      en: The joint advisory directly establishes native PCAP collection and file naming and reports a reversibly stored TACACS+
        shared secret in at least one case. Its statements about the primary objective and possible offline decryption remain
        analytic assessments and cannot be rewritten as proven decryption and use of a particular administrator password.
        Capture objects, AAA fields, and runtime-state retention vary substantially across vendors.
