research:
  limitations:
    paragraphs:
    - zh: 联合通告汇总多个国家支持行为者和环境，公开文本没有把每个 SPAN/RSPAN/ERSPAN 会话逐一连接到某个被成功恢复的凭据；Google 文档只证明镜像与审计字段可实施，不证明攻击事件。正式案例应区分观察到镜像、收集器接收和材料确认三个阶段。
      en: The joint advisory aggregates multiple state-sponsored actors and environments and does not connect every SPAN,
        RSPAN, or ERSPAN session to a specifically recovered credential. Google documentation establishes mirror and audit
        capabilities, not an attack incident. Formal cases must distinguish observed mirroring, collector receipt, and material
        confirmation as separate stages.
