research:
  limitations:
    paragraphs:
    - zh: 证据层级不对称。CISA 联合通告对路由器抓包、文件名、命令和镜像行为具有直接观察，但对具体 TACACS+ 材料的成功解密多为“主要目标”“可实现”或“可能包含”的分析；Mandiant 对 LOOKOVER 的代码与运行残留分析很强，却记录了写出阶段崩溃。APT33
        来源证明 SniffPass 被行为者采用并以窃取口令为设计目标，但缺少具体观察位置、会话与后继使用。正式对象必须保留 deployment、capture、material-present、recoverable 和 used
        五个证据阶段，不能用工具功能补齐缺失阶段。
      en: Evidence levels are asymmetric. The joint CISA advisory directly observes router capture, filenames, commands, and
        mirroring, but frames successful decryption of particular TACACS+ material as a primary objective, feasibility, or
        possible content. Mandiant provides strong code and runtime-residue analysis of LOOKOVER but records a crash during
        output. The APT33 source establishes actor adoption of SniffPass and its password-theft purpose but lacks a specific
        observation position, session, and successor use. Formal content must preserve deployment, capture, material-present,
        recoverable, and used as five separate evidence stages rather than filling gaps from tool capability.
    - zh: 检测字段跨平台差异明显。Linux packet(7) 证明 CAP_NET_RAW、AF_PACKET、interface index 与 promiscuous membership 的能力，不保证系统默认审计这些字段；Windows
        Pktmon 证明原生捕获、ETL 与 pcapng 产物，不保证每次 API 调用可归因；网络设备和云平台也可能缺少完整 request body。Analytic 部署前必须用良性抓包实验验证字段，并在不能取得 artifact
        或材料评估时把结论降为观察面风险。
      en: Detection fields differ substantially across platforms. Linux packet(7) establishes CAP_NET_RAW, AF_PACKET, interface
        index, and promiscuous membership capability but not default auditing of those fields. Windows Pktmon establishes
        native capture plus ETL and pcapng artifacts but not attribution for every API call. Network devices and cloud platforms
        may also omit complete request bodies. Before deployment, benign capture tests must validate fields, and findings
        without artifact or material assessment must remain observation-surface risk.
    - zh: 凭据检测本身会扩大敏感数据处理面。为了证明材料结果而广泛解码或集中完整 PCAP，会重新制造本技术所利用的风险；受限取证、最少字段、短保留、去标识化与访问审计是分析前提。隐私限制可能使组织只能高置信检测未授权抓包而不能自动确认具体秘密，此时不得用推断替代证据。
      en: Credential detection itself can enlarge the sensitive-data surface. Broad decoding or centralization of full PCAP
        to prove material outcome recreates the risk this technique exploits. Restricted forensics, minimum fields, short
        retention, de-identification, and access audit are analytic prerequisites. Privacy constraints may let an organization
        detect unauthorized capture with high confidence without automatically confirming a specific secret; inference must
        not replace evidence in that case.
