research:
  limitations:
    paragraphs:
    - zh: 现有直接观察效应主要来自 DueDLLigence 授权研究，不能推断所有攻击者都会注入角色贴合 reader。合法 EDR 和诊断组件可能产生相同注入、ProcessAccess 或 dump 痕迹；反之，签名被盗或内核执行可能不留下用户态残余。正式案例必须同时证明
        reader 控制、认证目标和材料结果。
      en: Direct observation-effect evidence is concentrated in the authorized DueDLLigence study and cannot establish that
        every adversary injects a role-conforming reader. Legitimate EDR and diagnostics can produce similar injection, ProcessAccess,
        or dump traces, while stolen signing or kernel execution may omit user-mode residuals. A formal case must establish
        reader control, authentication target, and material result together.
