schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0177-001
parent_ref: NJT-0177
name:
  zh: 可信凭据读取上下文转用
  en: Trusted Credential-Reader Context Repurposing
summary:
  zh: 攻击者把认证材料读取代码或导出动作置于正常会接近目标的受信进程、服务或工具中，使 reader 身份看起来符合角色。
  en: An adversary places authentication-material read code or export behavior inside a trusted process, service, or tool
    normally expected near the target, making reader identity appear role-conforming.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 可信凭据读取上下文转用是攻击者把读取认证进程、账户存储或安全配置的代码注入、加载或驱动到一个正常职责中已接近该对象的进程、服务、签名工具或备份组件，使敏感 read 以该受信 reader 的身份发生。稳定变量是 reader
      provenance 与真实控制者分离，不是 Mimikatz、svchost、comsvcs、dump 工具或操作系统名称。只有材料输出已经证实时完成本子项；注入或 ProcessAccess 本身仍是前置。
    en: Trusted Credential-Reader Context Repurposing injects, loads, or drives code that reads an authentication process,
      account store, or security configuration inside a process, service, signed tool, or backup component whose normal role
      already approaches that object. The sensitive read then occurs under the trusted reader's identity. The stable variable
      is separation of reader provenance from actual controller, not Mimikatz, svchost, comsvcs, a dump tool, or operating-system
      name. The child completes only when material output is established; injection or ProcessAccess alone remains preparation.
stealth_characteristics:
  paragraphs:
  - zh: 可信凭据读取上下文转用保留受信 image、签名、服务账户或预期 target-access 组合，削弱按“未知进程访问 LSASS/安全存储”分类的规则。Mandiant 明确举例把 Mimikatz shellcode 放入常访问
      LSASS 的 svchost，使 EDR 看到预期主体与动作。残余差异包括 remote thread/APC、可执行私有内存、异常模块或 call trace、父进程、加载时间、access rights、dump 文件和网络输出；受信
      reader 不是免审计白名单。
    en: Trusted Credential-Reader Context Repurposing preserves a trusted image, signature, service account, or expected target-access
      combination, weakening rules that classify an unknown process accessing LSASS or a security store. Mandiant explicitly
      illustrates placing Mimikatz shellcode in svchost, which commonly accesses LSASS, so the EDR sees an expected subject
      and action. Residual differences include a remote thread or APC, executable private memory, anomalous module or call
      trace, parent process, load time, access rights, dump file, and network output. A trusted reader is not an audit exemption.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求 attacker-controlled code 或操作进入受信 reader、该 reader 实际读取 OS 认证材料，并产生材料输出。合法 EDR、AV、SSP、备份、崩溃诊断与管理员转储按代码签名、配置、工单、目标、输出目的和时段排除。一般进程注入由
      NJT-0103 等相邻对象解释执行上下文，本子项只在认证材料结果独立证明时并列。若攻击者直接以自己进程读取或仅使用高权限，不满足 reader 转用变量但仍可属于父技术。
    en: Inclusion requires attacker-controlled code or operation inside a trusted reader, an actual read of operating-system
      authentication material by that reader, and material output. Legitimate EDR, antimalware, SSP, backup, crash diagnostics,
      and administrative dumps require exclusion by code signature, configuration, case, target, output destination, and time.
      Adjacent objects such as NJT-0103 explain general process-injection execution context; this child coexists only when
      the authentication-material result is independently established. A direct read from the adversary's own process or use
      of privilege alone does not satisfy reader repurposing, though it can remain parent behavior.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可把 LSASS 解析代码注入角色贴合的系统进程、利用受信诊断或转储组件生成认证进程副本，或控制获批准备份/安全代理导出 OS 账户材料。实现跨运行态与存储对象，但共同点是防守日志首先归因给熟悉 reader。DueDLLigence
        是直接受控证据；其他工具或场景需要逐案证明 reader 被控制和材料输出。
      en: An adversary can inject LSASS parsing code into a role-conforming system process, use a trusted diagnostic or dump
        component to create an authentication-process copy, or control an approved backup or security agent to export operating-system
        account material. Implementations span runtime and stored objects, but defenders initially attribute them to a familiar
        reader. DueDLLigence is direct controlled evidence; other tools or scenarios need event-specific proof of reader control
        and material output.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制目标 reader 的代码、调用或配置，并仍具备读取目标所需完整性级别、句柄权、ptrace/capability 或备份权限。PPL、Credential Guard、代码完整性、受保护服务、模块允许清单和输出限制会阻断部分路径；错误注入可能崩溃关键认证服务。签名工具能打开对象也不保证能解析或导出材料。
        en: The adversary needs control of the target reader's code, invocation, or configuration and still requires the integrity
          level, handle rights, ptrace capability, or backup authority needed to read the target. PPL, Credential Guard, code
          integrity, protected services, module allowlists, and output restrictions block some paths, while faulty injection
          can crash a critical authentication service. A signed tool's ability to open an object does not guarantee material
          parsing or export.
    defender_model:
      paragraphs:
      - zh: 防守方需要把 reader image/signature、启动与父链、模块和内存区、注入事件、target process/object、access mask/call trace、用户和 logon ID、输出文件及外联连接。只对
          image 建白名单会直接遗漏变量；只见注入而无材料输出只能报告上下文风险。内核注入、同进程扩展、签名组件被替换和传感器自保护失效会形成盲区。
        en: Defenders need joins across reader image and signature, start and ancestry, module and memory region, injection
          event, target process or object, access mask or call trace, user and logon ID, output file, and egress. Image allowlisting
          alone directly misses the variable. Injection without material output supports context risk only. Kernel injection,
          in-process extensions, replacement of a signed component, and sensor self-protection failure create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 角色贴合 reader 身份掩盖攻击者控制的敏感读取
    en: Role-conforming reader identity masks attacker-controlled sensitive access
  analysis:
    paragraphs:
    - zh: 攻击者选择一个本来会接近目标的 reader 承载提取逻辑，让进程与动作的局部组合符合防守基线。真正改变的是 reader 内代码来源与输出，而不是 target read 的表面。REF-000367 和 CASE-000134
        直接证明这一控制变量及反制残余；来源是授权红队研究，故子项存在性高，但在野普遍性不外推。
      en: The adversary selects a reader already expected near the target to carry extraction logic, keeping the local process-and-action
        combination inside defender baselines. What changes is code provenance and output inside the reader rather than the
        visible target read. REF-000367 and CASE-000134 directly establish the controlled variable and counter-signals. The
        source is authorized red-team research, so child existence is high confidence without extrapolating field prevalence.
  confidence: high
  evidence_refs:
  - REF-000367
  - REF-000366
