schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0177-002
parent_ref: NJT-0177
name:
  zh: 非活动认证存储视图提取
  en: Inactive Authentication-Store View Extraction
summary:
  zh: 攻击者从快照、备份、原始卷派生或其他非活动视图复制 OS 认证存储，使读取离开活动对象锁与文件审计。
  en: An adversary copies an operating-system authentication store from a snapshot, backup, raw-derived, or other inactive
    view, moving reads outside live-object locks and file audit.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 非活动认证存储视图提取是攻击者创建或取得一个从底层存储状态派生、与活动认证数据库或 hive 分离的快照、备份、原始卷映射或等价副本，再从中复制 OS 认证材料及必要解锁依赖。稳定变量是读取视图与活动对象审计分离，不是卷影副本、NTDS、SAM、备份产品或命令名称。只有副本中可识别认证存储和必要依赖已经输出时完成；只创建
      snapshot 或复制不可用密文是暴露前态。
    en: Inactive Authentication-Store View Extraction creates or obtains a snapshot, backup, raw-volume mapping, or equivalent
      copy derived from underlying storage state and separated from a live authentication database or hive, then copies operating-system
      authentication material and required unlock dependencies from it. The stable variable is separation of the read view
      from live-object audit, not volume shadow copy, NTDS, SAM, backup product, or command name. The child completes when
      an identifiable authentication store and necessary dependencies are output. Creating a snapshot or copying unusable
      ciphertext is exposure preparation only.
stealth_characteristics:
  paragraphs:
  - zh: 非活动认证存储视图提取使活动文件或数据库过滤器看不到同等读取，原对象可继续被认证服务锁定并正常工作。异常转移到 vss/backup/volume 控制面、副本路径、备份权限和暂存；只监控活动 NTDS、SAM 或 hive 文件打开的规则会缺失目标语义。NJT-0108
      已证明相同介质层观察边界，本子项增加 OS 认证材料、依赖配对与结果门槛，不重新发明原始存储技术。
    en: Inactive Authentication-Store View Extraction can leave live-file or database filters without an equivalent read while
      the original object remains locked and operational under its authentication service. The anomaly moves to the volume-shadow,
      backup, or volume control plane, copy path, backup authority, and staging. Rules watching only live NTDS, SAM, or hive
      opens lose target semantics. NJT-0108 already establishes the same medium-level observation boundary. This child adds
      the operating-system authentication material, dependency pairing, and outcome gate rather than reinventing raw storage
      behavior.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求替代存储视图、OS 认证对象映射、材料复制结果三者相连。合法备份、灾备、取证、DC system-state 维护和获批 snapshot 是反例。若攻击者用原始卷或副本绕开活动路径，同时标记 NJT-0108；如果随后离线猜测口令，NJS-0137-003
      单独成立。普通复制活动文件、未包含系统验证材料的内存镜像、或只外传不可解锁数据库不满足完成结果。
    en: Inclusion requires a join among alternative storage view, operating-system authentication-object mapping, and material-copy
      result. Legitimate backup, disaster recovery, forensics, domain-controller system-state maintenance, and approved snapshots
      are counterexamples. Raw-volume or copy-view bypass also receives NJT-0108, while later offline password guessing separately
      satisfies NJS-0137-003. Ordinary copying of a live file, a memory image without system verification material, or exfiltration
      of an unlockable database does not establish the completed result.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Volt Typhoon 使用域管理员进入 DC，以 vssadmin 创建卷影副本，再通过 WMIC 和 ntdsutil 从副本复制活动中通常锁定的 NTDS.dit 与 SYSTEM，随后外传并用于离线破解。相同变量可出现于备份、system-state、副本卷或
        raw image，只要活动对象读取被替代且认证材料结果已证明。数据库名称不是分类边界。
      en: Volt Typhoon used a domain administrator account on a domain controller, created a volume shadow copy with vssadmin,
        and then used WMIC and ntdsutil to copy the normally live-locked NTDS.dit and SYSTEM from the copy before exfiltration
        for offline cracking. The same variable can occur through backup, system-state, copied volume, or raw image when live-object
        reading is replaced and an authentication-material result is established. Database name is not the boundary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要 snapshot、backup、restore 或 raw-volume 权限、足够磁盘空间和文件系统知识，并知道恢复材料所需数据库、SYSTEM/SECURITY hive、boot key 或等价依赖。磁盘加密、独立备份凭据、不可变副本、备份网络隔离和最小权限会限制路径。取得副本不保证格式完整、密钥齐备或可以恢复所有账户。
        en: The adversary needs snapshot, backup, restore, or raw-volume authority, sufficient storage, file-system knowledge,
          and awareness of databases, SYSTEM or SECURITY hives, boot keys, or equivalent dependencies needed to recover material.
          Disk encryption, separate backup credentials, immutable copies, backup-network isolation, and least privilege constrain
          the path. Obtaining a copy does not guarantee complete format, required keys, or recovery of every account.
    defender_model:
      paragraphs:
      - zh: 防守方需要副本创建者、源卷、copy ID、暴露路径、读取进程、备份权限、对象映射、输出 hash/size、归档、外传及账户范围。活动文件 SACL 可能无事件，因而必须保留存储控制面和块到对象映射。合法备份量大、云快照跨账户复制、脱机介质和外部破解是盲区；若只有
          snapshot 命令或 NTDS 文件名，应报告候选链而非确认材料已恢复。
        en: Defenders need copy creator, source volume, copy identifier, exposed path, reading process, backup authority,
          object mapping, output hash and size, archive, exfiltration, and account scope. A live-file SACL can have no event,
          making storage-control-plane and block-to-object mapping necessary. High-volume legitimate backup, cross-account
          cloud snapshots, offline media, and external cracking create blind spots. A snapshot command or NTDS filename alone
          supports a candidate chain rather than confirmed recovery.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 非活动视图把认证存储读取移出活动对象审计
    en: An inactive view moves authentication-store reading outside live-object audit
  analysis:
    paragraphs:
    - zh: 攻击者先取得底层派生副本，再从副本读取受保护数据库和解锁依赖，原活动对象不出现同等 read 或锁冲突。痕迹转为存储控制面、副本路径与输出。联合机构公告、Volt Typhoon 案例、替代视图声明和原始卷到敏感对象映射分析直接支持此链及映射要求；后继破解仍另归 NJS-0137-003。
      en: The adversary first obtains an underlying derived copy and then reads the protected database and unlock dependencies
        from it, leaving the live object without an equivalent read or lock conflict. Traces become storage-control-plane,
        copy-path, and output activity. The joint advisory, Volt Typhoon case, alternative-view claim, and raw-volume-to-sensitive-object
        mapping directly support the chain and mapping requirement. Later cracking remains NJS-0137-003.
  confidence: high
  evidence_refs:
