research:
  limitations:
    paragraphs:
    - zh: Volt Typhoon 案例直接证明 NTDS.dit 与 SYSTEM 从卷影副本复制、外传和离线破解目的，但不公开逐账户恢复率或由恢复秘密造成的特定登录。原始卷到敏感对象分析所需的块和副本字段并非所有平台默认具备。正式结论应把
        store_exposed、dependencies_present、material_parsed 和 secret_recovered 分级，不能从副本文件自动跳到域全面失守。
      en: The Volt Typhoon case directly establishes NTDS.dit and SYSTEM copying from a shadow view, exfiltration, and offline-cracking
        intent but does not publish per-account recovery yield or a specific sign-in caused by a recovered secret. The block
        and copy fields required for raw-volume-to-sensitive-object analysis are not available by default on every platform.
        Formal conclusions should grade store_exposed, dependencies_present, material_parsed, and secret_recovered rather
        than jump from a copied file to complete domain compromise.
