research:
  limitations:
    paragraphs:
    - zh: DCSync 直接证据主要来自研究实验和官方产品警报语义，本批未找到公开在野事件同时给出 caller、GetNCChanges secret response、输出文件和后继身份使用。批准同步器与域控的合法响应可高度相似，属性级内容也常因加密不可见。正式案例必须保留
        caller/host、权限前态、response 结果和材料范围，不能从 135/445/RPC 流量或单一 MDI 告警自动断言全域散列已提取。
      en: Direct DCSync evidence is concentrated in research experimentation and official product-alert semantics. This batch
        found no public field incident simultaneously publishing caller, GetNCChanges secret response, output file, and later
        identity use. Legitimate responses to approved synchronizers and domain controllers can look highly similar, and attribute
        content is often hidden by encryption. A formal case must retain caller or host, prior rights, response result, and
        material scope rather than infer extraction of every domain hash from RPC traffic or one MDI alert.
