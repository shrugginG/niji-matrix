research:
  limitations:
    paragraphs:
    - zh: 证据层级不均。Volt Typhoon 公告提供在野副本—对象—外传—离线目的链；DueDLLigence 提供受控 reader 观察实验；DCSync 由协议规范、直接实验和官方检测语义支持，但缺少公开现场完整链；Linux
        proc 与 shadow 主要为接口和格式文档。不能把跨来源阶段拼成一个事件，也不能从工具能力推断实际材料范围。父行为置信度高，DCSync 现场案例置信度低于能力置信度。
      en: Evidence levels differ. The Volt Typhoon advisory provides a field copy-to-object-to-exfiltration-to-offline-purpose
        chain. DueDLLigence provides a controlled reader-observation study. DCSync has protocol, direct experimental, and
        official detection support but lacks a complete public field chain. Linux proc and shadow evidence primarily documents
        interface and format. Stages from different sources cannot be spliced into one event, and tool capability cannot establish
        actual material scope. Parent behavior confidence is high, while DCSync field-case confidence remains below capability
        confidence.
    - zh: 端点、Linux audit、块/副本、DRS 和内容解析字段不会在多数环境同时存在。原始凭据材料本身不应进入集中日志，内容确认需要隔离取证和安全摘要。合法安全、备份、域复制与恢复活动同形，准确性依赖版本化 reader、copy、replicator
        与审批清单。材料外流后不可召回，恢复必须验证轮换传播、旧 session/ticket 拒绝及攻击者写权已清除。
      en: Endpoint, Linux audit, block or copy, DRS, and content-parsing fields rarely coexist by default. Raw credential
        material should never enter centralized logs; content confirmation needs isolated forensics and safe digests. Legitimate
        security, backup, domain replication, and recovery look similar, making versioned reader, copy, replicator, and approval
        inventories essential. Exfiltrated material cannot be recalled, and recovery must verify rotation propagation, rejection
        of old sessions or tickets, and removal of adversary write authority.
