research:
  limitations:
    paragraphs:
    - zh: Unit 42 直接描述从 IMDS 收集云凭据，但没有为每个云提供方逐一公布 request、response 和 token 值；Azure 文档只证明成功请求会返回 access_token。恶意 consent 的父范围由
        ATT&CK 锚定，缺少本批单一一手事件对 app 注册、用户 consent、token response 与攻击者接收四步全部公开取证。
      en: Unit 42 directly describes cloud-credential harvesting from IMDS but does not publish per-provider requests, responses,
        and token values. Azure documentation only establishes that a successful request returns an access_token. ATT&CK anchors
        malicious consent in parent scope, while this batch lacks one first-party incident exposing all four steps of application
        registration, user consent, token response, and adversary receipt.
