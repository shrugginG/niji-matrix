schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0178-002
parent_ref: NJT-0178
name:
  zh: 持久令牌工件读取
  en: Persisted Token-Artifact Retrieval
summary:
  zh: 攻击者从文件、Secret、投影卷、仓库或持久 cache 读取已存在的应用 token，并把完整材料复制到受控进程或产物。
  en: An adversary reads an existing application token from a file, Secret, projected volume, repository, or durable cache
    and copies complete material into a controlled process or artifact.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 持久令牌工件读取要求 token 在攻击者动作前已经作为可寻址对象存在，并由未获批准的 reader 成功返回完整值。对象可以由平台自动投影、应用缓存、CI/CD 生成或人员保存；分类依据是持久对象读取，不是 Kubernetes、GitHub、某个
      path、JWT 或厂商。
    en: Persisted Token-Artifact Retrieval requires the token to exist as an addressable object before the adversary action
      and an unauthorized reader to successfully receive the complete value. The object may be projected by a platform, cached
      by an application, generated by CI/CD, or saved by a person. The boundary is persisted-object retrieval, not Kubernetes,
      GitHub, a path, JWT, or vendor.
stealth_characteristics:
  paragraphs:
  - zh: 持久令牌工件读取通过token 文件常被合法 SDK、容器或构建步骤周期读取，恶意 reader 可寄生同一 workload、路径和账户，使目录存在和普通 open/read 缺少判定力。残余差异包括非预期 process/container、跨
      namespace 或 job 的 mount、批量扫描、异常 read frequency、复制到归档以及 owner/purpose 不符。没有 object-level read audit 时，防守方可能只看到后继 API
      使用。
    en: Persisted Token-Artifact Retrieval Token files are routinely read by legitimate SDKs, containers, or build steps.
      A malicious reader can inhabit the same workload, path, and account, leaving directory presence and an ordinary open
      or read inconclusive. Residual differences include an unexpected process or container, cross-namespace or cross-job
      mount, broad scanning, unusual read frequency, copying into an archive, and owner or purpose mismatch. Without object-level
      read audit, defenders may see only later API use.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求完整 token 值从持久对象返回给攻击者控制 reader；只列出路径、Secret 名称、token 类型、JWT claims 或 read denied 不成立。受管理保管库解锁/返回可与 NJT-0147 并列，普通散落配置可与
      T1552 并列；本项只声明返回材料是应用 token。Cookie 数据库归 T1539，除非对象中的值具有独立 API access token 语义。
    en: Inclusion requires the complete token value to return from a persisted object to an adversary-controlled reader. Listing
      a path, Secret name, token type, JWT claims, or denied read is insufficient. Unlock and return from a managed vault
      may coexist with NJT-0147, and loose configuration with T1552; this child asserts only that the returned material is
      an application token. A cookie database belongs to T1539 unless the stored value independently functions as an API access
      token.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Kubernetes 默认可把 service account token 投影到 Pod 文件系统，任何挂载该卷的 container 都可访问；CI/CD 还可能把 token 写入脚本、工作区、缓存或仓库 Secret。受侵
        workload 或恶意依赖扫描这些对象并把匹配材料加入归档，即形成本项；是否随后调用 API 不影响取得完成点。
      en: Kubernetes may project a service-account token into a Pod filesystem and any container mounting that volume can
        access it. CI/CD may also place tokens in scripts, workspaces, caches, or repository Secrets. A compromised workload
        or malicious dependency that scans those objects and adds matching material to an archive instantiates this child
        regardless of later API calls.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要目标文件/Secret/仓库对象的读权限、共享 mount、宿主或容器逃逸能力，或以合法 consumer 身份运行代码。它还需识别 token 格式或用途并复制完整值。只读文件模式、namespace/runner
          隔离、automount 关闭、短期投影 token 和细粒度 Secret RBAC 会缩小机会。
        en: The adversary needs read authority to the target file, Secret, or repository object, a shared mount, host or container
          escape, or code execution as a legitimate consumer. It must recognize token form or purpose and copy the complete
          value. Read-only modes do not prevent reading, while namespace and runner isolation, disabled automount, short-lived
          projected tokens, and fine-grained Secret RBAC reduce opportunity.
    defender_model:
      paragraphs:
      - zh: 防守方维护 token artifact inventory，记录 owner、expected reader、path/object ID、mount、audience/scope、TTL 与 rotation，并把
          open/read/get 与 process/container/job、bytes returned、artifact hash 及第二输出关联。内容确认在本地受限 scanner 生成 token class 和 HMAC
          fingerprint，不把值写入审计。
        en: Defenders maintain a token-artifact inventory with owner, expected reader, path or object ID, mount, audience
          or scope, TTL, and rotation, joining open, read, or get to process, container or job, bytes returned, artifact hash,
          and a second output. Restricted local scanning emits token class and an HMAC fingerprint without writing the value
          into audit.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 在合法 workload 的普通对象读取中取得 token 而不触发新的身份事务
    en: Acquire a token through ordinary object reads in a legitimate workload without creating a new identity transaction
  analysis:
    paragraphs:
    - zh: 攻击代码读取平台本来就投影或应用本来就缓存的对象，不需要向 IdP 发出新请求，资源服务也尚未见到使用。identity 日志因此没有对应异常，关键 trace 只在 object reader、mount 和复制产物。Kubernetes
        官方文档证明 token 对容器可读及生命周期，Unit 42/GitHub 证明受侵 runner 可收获并外传这些材料；具体 read audit 可用性随平台变化。
      en: Malicious code reads an object the platform already projects or the application already caches, without a new identity-provider
        request, while the resource server has not yet seen use. Identity logs therefore lack a corresponding anomaly, and
        decisive traces remain in object reader, mount, and copied artifact. Kubernetes documentation establishes container-readable
        token placement and lifetime, while Unit 42 and GitHub show compromised runners harvesting and exfiltrating such material.
        Availability of detailed read audit varies by platform.
