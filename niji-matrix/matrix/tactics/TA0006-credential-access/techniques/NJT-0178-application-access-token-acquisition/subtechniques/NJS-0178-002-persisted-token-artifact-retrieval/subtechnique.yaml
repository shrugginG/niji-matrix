research:
  limitations:
    paragraphs:
    - zh: Kubernetes 文档证明默认投影、TokenRequest、有效期和 invalidation 语义，不是攻击案例。Unit 42 报告把云 token、Kubernetes secrets、配置与其他秘密共同描述，未逐个公开每个
        token 的原路径、完整值或有效期。对象读取与最终外传之间缺少稳定 ID 时只能保留中等置信关联。
      en: Kubernetes documentation establishes default projection, TokenRequest, lifetime, and invalidation semantics rather
        than an attack case. Unit 42 reports cloud tokens, Kubernetes secrets, configuration, and other secrets together without
        publishing every token's original path, full value, or validity. Correlation remains medium confidence when object
        read and final exfiltration lack a stable shared identifier.
