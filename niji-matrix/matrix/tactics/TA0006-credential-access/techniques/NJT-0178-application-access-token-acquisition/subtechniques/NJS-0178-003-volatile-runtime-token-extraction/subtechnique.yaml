research:
  limitations:
    paragraphs:
    - zh: TeamPCP 是对 CI runner 的强直接事件，但不能自动推广为所有 SaaS、移动应用或 token broker 的 memory 语义。GitHub 官方材料证明受侵 runner 的 secrets 可被收获，但不提供通用
        process-memory 审计字段；同进程恶意代码可能没有跨进程 memory-read 事件，需依赖 workflow provenance 与第二输出。
      en: TeamPCP is strong direct evidence for CI runners but cannot automatically generalize memory semantics to every SaaS
        client, mobile application, or token broker. GitHub documentation establishes that compromised-runner secrets can
        be harvested but does not provide universal process-memory audit fields. Malicious code in the same process may generate
        no cross-process memory-read event, requiring workflow provenance and second-output evidence.
