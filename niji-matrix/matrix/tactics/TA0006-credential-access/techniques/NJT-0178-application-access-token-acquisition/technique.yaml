research:
  limitations:
    paragraphs:
    - zh: 公开来源最强的是 TeamPCP 的 CI/CD 多路径取得和 UNC6395 的 token 已受损/被使用结果，两者证据问题不同。前者公开 IMDS、memory、部分 file/secret 行为但没有逐 token
        完整清单；后者确认 token control 和撤销，却不披露最初取得位置。不能把后者资源查询反推为特定 cache 或 memory theft，也不能把前者不同波次和目标拼成每台受害主机的一条完整链。
      en: Public evidence is strongest for TeamPCP's multi-path CI/CD acquisition and UNC6395's compromised-and-used token
        result, but they answer different questions. The former exposes IMDS, memory, and some file or secret behavior without
        a complete per-token inventory. The latter confirms token control and revocation without disclosing initial material
        location. Its resource queries cannot be reverse-inferred as a specific cache or memory theft, and TeamPCP's waves
        and targets cannot be spliced into one chain for every victim host.
    - zh: 许多 issuer、SaaS 和 runtime 不记录可安全关联的 token ID；opaque token 不能解码，JWT jti 也不一定存在或唯一。通用日志禁止保存 raw token，HMAC fingerprint
        又要求在受限本地边界生成。字段缺失时，防守方可能分别证明未授权 read、异常 issuance 或后继 use，却无法证明它们属于同一 token 实例；结论应显式降级。
      en: Many issuers, SaaS providers, and runtimes do not expose a safely joinable token ID. Opaque tokens cannot be decoded,
        and JWT jti may be missing or nonunique. General logs must not retain raw tokens, while HMAC fingerprints must be
        generated within a restricted local boundary. With missing fields, defenders may separately establish an unauthorized
        read, anomalous issuance, or successor use without proving they refer to one token instance, and conclusions must
        explicitly downgrade.
    - zh: 撤销语义随 access/refresh token、Cookie、workload credential、Kubernetes TokenRequest 和第三方集成而异。Microsoft 说明 refresh revoke
        后 access token 可持续到期，Kubernetes bound token 依 Pod 删除失效，供应商集成还需跨客户和各 connected system 处理。固定窗口只能是实施起点；正式 Analytic 必须按
        provider SLA、最大 TTL、cache 和 audience 能力校准，并避免用真实被盗 token 做破坏性测试。
      en: Revocation semantics differ across access and refresh tokens, cookies, workload credentials, Kubernetes TokenRequest,
        and third-party integrations. Microsoft notes that access tokens may remain valid until expiry after refresh revocation.
        Kubernetes bound tokens expire with Pod deletion, and vendor integrations require action across customers and connected
        systems. Fixed windows are implementation starting points only. Formal analytics must calibrate provider SLA, maximum
        TTL, cache, and audience capability and avoid destructive testing with real stolen tokens.
