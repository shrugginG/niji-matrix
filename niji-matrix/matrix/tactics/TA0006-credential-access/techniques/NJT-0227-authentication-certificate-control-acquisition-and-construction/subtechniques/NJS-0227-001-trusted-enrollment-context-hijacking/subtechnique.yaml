research:
  limitations:
    paragraphs:
    - zh: 真实事件支持弱模板或中继导致证书取得，并以 PKINIT 支持可用私钥证明，但未公开全部私钥字节、输出容器或代理调用细节。不同签发实现不能仅凭最终认证成功互相替代；案例未证明整个行动无告警或该变量在各产品中有相同规避效果。
      en: Incidents support acquisition through weak templates or relay and usable key proof through PKINIT without disclosing all key bytes,
        output containers, or delegation details. Final authentication cannot substitute one issuance path for another, and the cases establish
        neither an alert-free chain nor equal evasion across products.
    - zh: 可实施分析主要针对 AD CS，依赖请求历史、授权快照与可解析证书。集中注册与来源代理会产生正常身份差，强映射补丁也改变历史方法的可用性；其他 PKI 若不提供等价请求与批准链，不应直接照搬数据假设。
      en: Implementable analysis principally targets AD CS and depends on request history, authority snapshots, and parsed certificates.
        Centralized enrollment and origin proxies create benign identity differences, and strong-mapping patches change historical feasibility.
        Other PKIs without equivalent request and approval lineage require revised data assumptions.
