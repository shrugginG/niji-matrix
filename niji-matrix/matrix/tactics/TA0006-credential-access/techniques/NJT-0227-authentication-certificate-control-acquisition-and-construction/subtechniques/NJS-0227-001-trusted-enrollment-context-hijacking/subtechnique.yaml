schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0227-001
parent_ref: NJT-0227
name:
  zh: 受信签发上下文挟持
  en: Trusted Enrollment-Context Hijacking
summary:
  zh: 借用被签发服务接受的身份或代表权限取得认证证书，使正常签发记录不足以识别实际控制者及批准用途。
  en: Obtain authentication certificates through accepted identities or delegated authority, making normal issuance records insufficient
    to establish the actual controller and approved purpose.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信签发上下文挟持通过攻击者控制的请求路径、被借用身份或越过批准范围的代表权限，让 CA 正常返回可用于目标主体认证的证书。服务可依自身配置正确签名并记录，却未可靠绑定实际控制者、被表示身份与组织授权意图。取得结果还须对应攻击者可控制的私钥证明能力，而非仅有公开证书副本。
    en: Trusted Enrollment-Context Hijacking uses an adversary-controlled request path, borrowed identity, or delegated authority outside
      approval to make a CA return a certificate usable for a target subject. The service may correctly sign and record under its configuration
      while failing to bind the real controller, represented identity, and organizational intent. Acquisition also requires corresponding
      key-proof capability under adversary control rather than only a public certificate copy.
  - zh: 不同实现可以改变请求主体、代理人群或所声称身份，但都保留真实的权威签发事务。模板滥用、认证中继和越界代理注册因此是同一稳定变量的实现参考；具体工具、产品和模板名称不决定子技术身份。
    en: Implementations can change request identity, delegated population, or claimed subject while retaining a genuine authority transaction.
      Template abuse, authentication relay, and out-of-scope delegation are implementations of this variable; tools, products, and template
      names do not define the child.
stealth_characteristics:
  paragraphs:
  - zh: 受信签发上下文挟持保留真实签发者、有效证书和成功记录，使只检查证书链或签发结果的观察与正常注册相容。真正的区别转移到来源路径、代表关系、主体声明、模板范围与批准记录，需要跨面解释，而非把成功事件当成安全结论。
    en: Trusted Enrollment-Context Hijacking retains a real issuer, valid certificate, and success record, making chain or issuance-result
      checks compatible with ordinary enrollment. Discriminating evidence moves to ingress provenance, delegation, subject claims, template
      scope, and approval records and requires cross-plane interpretation rather than treating success as a benign verdict.
  - zh: 请求身份、网络来源、返回材料和后继认证仍可能留下关联证据。公开事件包含检测、自动阻断与隔离，支持实际滥用而不证明攻击者完全避开监测；强化主体映射和受众绑定也可能在材料返回前阻止某些实现。
    en: Request identity, network origin, returned material, and successor authentication can remain correlatable. Public incidents include
      detection, disruption, and isolation, supporting actual abuse without establishing complete evasion. Stronger subject mapping and audience
      binding can also stop some implementations before material return.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入须连接被滥用上下文、真实请求、已返回认证证书和相应私钥控制能力。弱模板、代理权限、一次中继连接或成功 HTTP 响应仅是线索。正常自动注册、集中部署、批准 Enrollment Agent 和灾备也可有请求者与主体不同的现象，应以获准人群、模板、来源、输出保管与批准期限排除。
    en: Inclusion connects an abused context, actual request, returned authentication certificate, and corresponding key control. A weak
      template, delegation right, relay connection, or successful HTTP response is only a lead. Autoenrollment, deployment, approved Enrollment
      Agents, and recovery can also differ in requester and subject and require checks of allowed populations, templates, origins, custody,
      and approval periods.
  - zh: 材料在权威服务之外新构造时归兄弟项；只改变模板、目录映射或认证组件而尚未产生材料结果，属于前置状态变化。取得后提交证书和使用被接受身份是独立阶段，不能由后继资源访问反推某种请求路径。
    en: New material constructed outside the authority belongs to the sibling. Template, directory-mapping, or authentication-component changes
      without material outcomes remain antecedent state changes. Certificate presentation and use of accepted identity are separate stages,
      and resource access cannot backfill a particular enrollment path.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 已控低权身份可能接触过宽注册模板，被迫或被截获的认证上下文可能被转向签发端点，受信代理也可能为越界主体代办。三类情形的共同点是权威服务实际签发，而真实请求控制与批准目的偏离；这不同于单纯观察模板权限或拥有管理员账户。
      en: A compromised low-privilege identity may reach an overly broad template, coerced or intercepted authentication may be redirected
        to an enrollment endpoint, or a trusted agent may enroll an out-of-scope subject. Each requires actual authority issuance with request
        control departing from approval, unlike merely observing template permissions or possessing an administrator account.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需具有可接受的请求身份、代理能力或中继条件，以及提交与取得结果的路径，并控制返回证书对应私钥或可用证明能力。身份来源、用途、审批、代理范围、EPA 和当前强映射限制可利用组合。攻击者不因知道证书 SAN 或拿到公钥证书就自动具有认证能力。
        en: The adversary needs an accepted requesting identity, delegation, or relay condition; a submission and retrieval path; and control
          of the returned certificate key or usable proof capability. Identity sources, usage, approval, agent scope, EPA, and current strong
          mapping constrain combinations. Knowing a SAN or obtaining the public certificate does not automatically grant authentication capability.
    defender_model:
      paragraphs:
      - zh: 防守方需分别保留请求者、被表示主体、代理授权、真实接入来源和批准目的，通过 CA 实例和 Request ID 连接请求、数据库与证书。旧事件可能缺少模板、SAN 或指纹，代理与 NAT 也影响来源解释。后继成功认证增强可用性证据，却不能代替对请求上下文被挟持的调查。
        en: Defenders need requester, represented subject, delegation, real ingress origin, and approval purpose separately, joining requests,
          databases, and certificates by CA instance and request ID. Older events can omit templates, SANs, or fingerprints, while proxies
          and NAT complicate origin interpretation. Later success strengthens usability evidence without replacing investigation of hijacked
          enrollment context.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 正常签发身份保留合法注册外观
    en: Normal issuer identities retain legitimate enrollment appearance
  analysis:
    paragraphs:
    - zh: 攻击者让服务按其可接受身份与权限产生真实证书，熟悉请求者和签发成功因此遮住真实控制与批准范围的偏离。差异仍存在于接入来源、代表关系和主体绑定中。正常服务语义与实际入侵共同支持此观察影响，而合法代理的相同表象要求结合业务批准解释。
      en: The adversary makes the service issue genuine certificates under an acceptable identity and authority, so a familiar requester
        and issuance success conceal differences in actual control and approved scope. Differences remain in ingress origin, delegation,
        and subject binding. Normal-service semantics and incidents support this observation effect, while identical appearances from legitimate
        agents require business-approval context.
