schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0227-002
parent_ref: NJT-0227
name:
  zh: 脱离签发链的认证证书构造
  en: Off-Issuance-Chain Authentication-Certificate Construction
summary:
  zh: 在权威服务之外用受信签名能力构造认证证书，使材料生成不进入正常请求与签发记录链。
  en: Use trusted signing capability outside the authority service to construct authentication certificates whose generation bypasses normal
    request and issuance records.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 脱离签发链的认证证书构造利用已受信签发者的私钥或等价签名能力，不调用该服务正常请求与审批流程而形成新的主体认证证书。技术身份是新材料在权威服务之外产生，而非证书格式、签名算法或程序名称；只有窃取已有终端证书不是新证书构造。
    en: Off-Issuance-Chain Authentication-Certificate Construction uses a trusted issuer's key or equivalent signing capability to form a
      new subject certificate without the service's normal request and approval flow. Its identity is off-authority generation rather than
      certificate format, algorithm, or program name. Theft of an existing end-entity certificate is not construction of a new one.
  - zh: 拥有 CA 私钥只是条件，形成的材料能否用于认证还取决于目标的链、用途、主体映射、有效期与撤销验证。独立构造证据与实际接受需要分开保留；没有正常签发记录的登录不能独自说明证书来自哪里。
    en: Possession of a CA key is a prerequisite, while authentication usability depends on chain, purpose, subject mapping, validity, and
      revocation checks. Independent construction evidence and actual acceptance must be retained separately; a sign-in without a located
      issuance record does not by itself establish provenance.
stealth_characteristics:
  paragraphs:
  - zh: 脱离签发链的认证证书构造保留可能被依赖方认可的签名，却把关键生成行为放在正常 CA 请求接收、策略判断与数据库记录之外。只监控签发端的规则因此看不到这次构造，认证端则可能仍产生带证书标识的请求。
    en: Off-Issuance-Chain Authentication-Certificate Construction retains a potentially accepted signature while moving generation outside
      normal CA reception, policy checks, and database recording. Issuer-only rules therefore miss that construction, while authentication
      can still record a certificate-bearing request.
  - zh: 关键残余差异是证书接受与完整历史签发库存之间的连续性，而非最近是否有一条签发事件。签发者身份、序列号、指纹、源主机与密钥暴露可支持调查；库存迁移、保留和采集不完整会产生同样缺失，必须保留这一限制。
    en: The critical residual difference is continuity between certificate acceptance and complete historical issuance rather than whether
      a recent issuance event exists. Issuer identity, serial, fingerprint, source host, and key exposure can support investigation, while
      migration, retention, and collection gaps can create the same absence and must remain explicit limitations.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求有新证书形成和受信签名来源的证据；只有密钥访问或缺少签发对应项的认证仍为线索。合法离线 CA 经批准签发、受控恢复、外部签发者与迁移前历史不能因本机无记录而归类。该项不要求删除任何原始日志，构造从未经过正常服务即可产生观察差。
    en: 'Inclusion requires evidence of a newly formed certificate and trusted signing provenance; key access or authentication without a
      located issuance counterpart remains a lead. Approved offline-CA issuance, recovery, external authorities, and pre-migration history
      are not included merely because local records are absent. Log deletion is unnecessary: bypassing the normal service itself creates
      the observation difference.'
  - zh: 正常 CA 服务内的恶意注册属于兄弟项；终端私钥取得属于父级核心；Web 断言签名、账户公钥登记和根信任变更各有相邻对象。CA 私钥暴露本身并不证明此项，也不预设所有硬件保护密钥均可被复制或远程调用。
    en: Malicious enrollment inside the normal CA belongs to the sibling; end-entity key acquisition is parent core; web-assertion signing,
      account-public-key registration, and root-trust changes are neighboring behaviors. CA-key exposure alone does not establish this child,
      which assumes neither copyability nor remote invocation of every hardware-protected key.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 高信任签发能力失守后，攻击者可能离开原 CA 主机，在自己控制的环境中形成新的主体证书。构造与使用可跨越较长时间，失守后的权威服务可能仍正常运行；原始实现支持这一能力，本研究没有独立验证使用该精确子项的真实恶意事件。
      en: After trusted signing capability is compromised, an adversary may form new subject certificates away from the original CA. Construction
        and use can be separated substantially while the authority continues operating normally. Original implementation supports the capability,
        but this research has not independently verified a malicious incident demonstrating this exact child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需掌握目标信任的签名能力，并形成满足目标身份绑定和验证条件的证书及相应私钥证明。公开 CA 证书不足，历史工具演示也不能保证当前强映射下成功。硬件保护可以阻止密钥复制；若另有签名接口滥用，需对其授权和输出独立举证。
        en: The adversary needs signing capability trusted by the target and a certificate and key proof satisfying its identity binding
          and validation. A public CA certificate is insufficient, and historical demonstrations do not guarantee current strong-mapping
          success. Hardware can prevent copying; any separate signing-interface abuse requires independent authority and output evidence.
    defender_model:
      paragraphs:
      - zh: 防守方需持久保存独立签发库存与签发者密钥身份，理解退休、迁移、外部或离线 CA 及数据库清理范围。4768 可提供部分 PKINIT 证书标识，其他依赖方可能没有等价字段。同名签发者不能直接合并，序列号和指纹算法必须与原始证书一致。
        en: Defenders need durable independent issuance inventory and issuer-key identity with known retirement, migration, external or offline
          authorities, and database-pruning scope. Event 4768 provides identifiers for some PKINIT use; other relying parties may lack equivalents.
          Same-named issuers must not be merged blindly, and serial representations and fingerprint algorithms must match raw certificates.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 新证书生成不进入正常签发观察面
    en: New certificate generation bypasses normal issuance observation
  analysis:
    paragraphs:
    - zh: 服务外签名不调用正常请求与数据库发布，因此签发端的成功、拒绝和审批监控没有相应事务。接受端若仍信任该签名，其证书请求与完整库存间的缺口成为残余观察。原始实现直接支持记录差异；检测仍须先排除库存不全，不能把缺日志本身强化为已经伪造。
      en: Off-service signing invokes no normal request or database publication, leaving issuer-side success, denial, and approval monitoring
        without a transaction. If acceptance still trusts the signature, the difference against complete inventory becomes residual evidence.
        Original implementation directly supports the record difference, but analysis must exclude incomplete inventory before treating absence
        as construction.
  evidence_refs:
  - REF-001172
  - REF-001173
  - REF-000854
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 受信签名延续证书的合法验证外观
    en: Trusted signatures preserve ordinary certificate-validation appearance
  analysis:
    paragraphs:
    - zh: 新材料借用仍被目标认可的签发密钥，使局部签名验证与正常证书相似。区别在真实签发授权和材料谱系，而不在简单的密码学有效/无效二分。当前强映射、用途和撤销可以拒绝构造材料，因此合法签名外观不是无条件的认证成功。
      en: New material borrows an issuer key still recognized by the target, resembling ordinary certificates under local signature checks.
        Differences concern issuance authority and provenance rather than a simple valid-or-invalid cryptographic split. Current mapping,
        usage, and revocation can reject the material, so legitimate signature appearance does not imply unconditional authentication success.
  evidence_refs:
  - REF-001172
  - REF-001180
  confidence: medium
