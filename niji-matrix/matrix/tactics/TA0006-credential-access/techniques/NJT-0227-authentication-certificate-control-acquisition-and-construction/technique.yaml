schema_version: 2.0.0
type: technique
id: NJT-0227
name:
  zh: 认证证书控制取得与构造
  en: Authentication-Certificate Control Acquisition and Construction
summary:
  zh: 攻击者取得认证证书对应的私钥控制，或通过受信签发与签名能力获得可冒充主体的证书，改变材料来源与认证证据的关联。
  en: Adversaries acquire control of authentication-certificate private keys or obtain impersonating certificates through trusted enrollment
    or signing capability, changing the link between provenance and authentication evidence.
aliases: []
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1649
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1649
definition_and_concept:
  paragraphs:
  - zh: 认证证书控制取得与构造是攻击者获得可代表用户、设备或服务完成证书认证的材料与控制能力，或构造可能被既有信任关系接受的认证证书。直接目标包括既有终端证书的相应私钥和受信签发上下文返回的证书结果；受信签名能力还可用于服务外构造新的主体证书。证书载有公钥和身份声明，通常可公开分发；身份冒充依赖相应私钥控制、被接受的身份绑定和依赖方验证条件。
    en: Authentication-Certificate Control Acquisition and Construction obtains the material and control needed to authenticate as a user,
      device, or service, or constructs certificates potentially accepted under existing trust. Immediate targets include private keys for
      existing end-entity certificates and results returned through trusted enrollment contexts. Trusted signing capability can also construct
      new subject certificates outside the service. Certificates contain public keys and identity statements and are ordinarily public; impersonation
      depends on corresponding private-key control, accepted identity binding, and relying-party verification.
  - zh: 材料发现、私钥控制、签发或构造、私钥证明、认证接受和资源访问是独立阶段。发现证书文件不证明秘密取得，密钥读取事件不证明导出，签发成功不证明攻击者持有私钥，成功 PKINIT 也不解释材料来源。只有 CA 私钥暴露而没有新主体证书形成时，尚不足以证明服务外构造；将这些阶段分开才能避免把前置能力和后继结果拼成未观察到的完整链。
    en: Material discovery, private-key control, issuance or construction, proof of possession, authentication acceptance, and resource access
      are separate stages. Finding a certificate does not establish secret acquisition, a key read does not prove export, issuance does not
      establish adversary key possession, and successful PKINIT does not explain provenance. CA-key exposure without a new subject certificate
      is insufficient to establish off-service construction. Separating these stages prevents assembling prerequisites and successor results
      into an unobserved complete chain.
stealth_characteristics:
  paragraphs:
  - zh: 认证证书控制取得与构造的核心矛盾是，依赖方可正确验证签名和密钥证明，却仍无法仅从这一结果识别实际操作者或组织批准意图。既有证书私钥被借用时保留原身份外观；被挟持的注册上下文仍可留下正常批准与签发记录；服务外签名则使依赖方可能接受的新材料缺少对应权威事务。
    en: The central tension in Authentication-Certificate Control Acquisition and Construction is that correct signature and key-proof verification
      need not identify the actual operator or organizational approval. Borrowing an existing certificate key preserves its original identity
      appearance. Hijacked enrollment can retain ordinary approval and issuance records, while off-service signing can create potentially
      accepted material without an authority transaction.
  - zh: 密钥访问、请求来源、模板与授权状态、证书指纹、主体映射和认证结果仍是残余痕迹。只观察签名有效、签发成功或登录成功的局部规则难以恢复材料来源，需要跨保管、签发和接受面理解。原始技术研究支持这种观察差异，真实事件支持签发滥用，但两者都不能证明通用规避率或所有平台上的无告警效果。
    en: Residual traces include key access, request origin, template and authority state, fingerprints, subject mappings, and authentication
      outcomes. Local rules observing only valid signatures, successful issuance, or successful sign-ins have difficulty recovering provenance
      and require custody, issuance, and acceptance context. Original research supports this observation difference and incidents support
      enrollment abuse, but neither establishes universal evasion rates or alert-free operation across platforms.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入既有认证证书私钥控制的取得、通过不符合组织批准意图的受信上下文取得认证证书，以及使用受信签名能力构造认证证书。证据应支持认证用途、对应私钥控制或可用构造结果；仅有公开证书、弱模板、管理员权限、导出调用或一次成功登录不足以证明取得。合法备份、迁移、自动注册、代理代办和恢复会产生相似痕迹，需核对所有者、请求控制、目标身份、批准范围和输出保管。
    en: Include acquisition of private-key control for existing authentication certificates, acquisition through trusted enrollment inconsistent
      with organizational approval, and construction using trusted signing capability. Evidence must support authentication purpose and corresponding
      key control or a usable construction result. A public certificate, weak template, administrative privilege, export invocation, or successful
      sign-in alone is insufficient. Legitimate backup, migration, autoenrollment, delegation, and recovery require checks of ownership,
      request control, subject, approved scope, and output custody.
  - zh: 受管理保管库取用、OS 认证秘密提取和未保护文件中的秘密暴露各有相邻对象；存储路径结果与认证证书材料结果可以分别举证。应用令牌取得、Web 或联合断言构造、认证组件修改、账户认证器增补和有效身份使用不由证书格式统一接管。KDC 在正常 PKINIT 中签发
      TGT 不等于 Kerberos 票据伪造。
    en: Managed-store retrieval, OS authentication-secret extraction, and unprotected-file exposure are neighboring behaviors; storage-path
      and certificate-material outcomes can be independently supported. Application-token acquisition, web or federation assertion construction,
      authentication-component changes, account-authenticator additions, and valid-identity use do not transfer ownership merely because
      certificates are involved. Normal KDC issuance of a TGT during PKINIT is not Kerberos ticket forgery.
  - zh: 仅用于 C2 加密、服务器 TLS、内容签名或根信任安装的证书行为不属于本项。借用公开 CA 证书但未掌握签名私钥不能构造可信身份材料；仅调用已有不可导出密钥完成一次认证也不能自动证明独立的凭据取得路径。
    en: Certificate behavior solely for C2 encryption, server TLS, content signing, or root installation is outside scope. Borrowing a public
      CA certificate without its signing key does not enable trusted identity construction, and invoking an existing non-exportable key for
      an authentication does not automatically establish an independent acquisition path.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者已控制用户或服务上下文后可能寻找认证密钥权限，利用过宽模板或被中继身份获取新证书，或在签发者失守后离开原 CA 主机继续构造身份材料。用户、设备、服务和工作负载只是认证主体。证书在口令变化后可能仍有效，使取得结果能服务于后继身份冒充，但是否持续访问必须另证。
      en: After compromising a user or service context, an adversary may examine authentication-key permissions, obtain certificates through
        broad templates or relayed identities, or continue constructing identity material away from a compromised CA. Users, devices, services,
        and workloads are subjects rather than partitions. Certificates can remain valid after password changes and support successor impersonation,
        while continued access requires separate evidence.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需访问现有私钥、控制有用的注册身份或代理权限，或获得被目标认可的签名能力；知道证书内容不足。用户解锁、服务 ACL、DPAPI、硬件隔离和操作授权限制私钥访问，模板用途、审批、EPA 与主体强映射限制签发。
        en: The adversary needs access to an existing private key, useful enrollment identity or delegation, or signing capability recognized
          by the target; certificate contents alone are insufficient. Unlock state, service ACLs, DPAPI, hardware isolation, and operation
          authority constrain key access, while usage, approval, EPA, and strong mapping constrain issuance.
      - zh: 服务外构造还须满足目标实际执行的链、用途、主体、期限和撤销验证。软件不可导出标志不等同硬件保证，硬件防复制也不代表已获准调用者不会滥用；本对象不预设已证明任意远程硬件调用或任意主体成功。
        en: Off-service construction must also satisfy actual chain, usage, subject, validity, and revocation checks. Software non-exportability
          is not hardware assurance, and copy-resistant hardware does not prevent all misuse by an authorized caller. The technique assumes
          neither proven arbitrary remote hardware invocation nor arbitrary-subject success.
    defender_model:
      paragraphs:
      - zh: 防守方需要分开观察密钥保管、签发服务、目录授权、认证接受和资源使用。CA 请求事件提供事务线索，模板、SAN、EKU、指纹与完整身份绑定往往需要 CA 数据库及证书解析。认证侧可保留证书标识和结果，但这些字段并非所有认证路径都具有。
        en: Defenders need separate visibility into key custody, enrollment services, directory authority, authentication acceptance, and
          resource use. CA request events provide transaction leads, while templates, SANs, EKUs, fingerprints, and complete identity binding
          often require database and certificate enrichment. Authentication can preserve certificate identifiers and outcomes, but not every
          path exposes them.
      - zh: KSP 日志受 Provider、调用路径与审计配置约束，无法覆盖全部原始文件复制、离线快照、第三方硬件或远程签名。历史签发清单、批准范围和采集完整性必须足够长久且独立保留，否则看不到签发对应项只说明观察不足。
        en: KSP logs depend on providers, access paths, and audit configuration and cannot cover all raw copies, offline snapshots, third-party
          hardware, or remote signing. Historical issuance, approval scope, and collection completeness need durable independent retention;
          otherwise an absent issuance counterpart establishes only insufficient observation.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 受信身份与签名借用正常认证凭据外观
    en: Trusted identities and signatures borrow ordinary credential appearance
  analysis:
    paragraphs:
    - zh: 攻击者沿受信注册路径取得材料或借用已有签名信任，使证书满足局部格式和密码学验证。传感器看到正常身份或有效签名时，真实操作者与批准用途的差异落在请求来源、代理范围和主体绑定中。事件与原始实现支持这种合法特征借用，不能据此量化通用检测收益。
      en: Adversaries acquire material through trusted enrollment or borrow existing signing trust so certificates satisfy local formatting
        and cryptographic checks. When sensors see familiar identities or valid signatures, differences in actual operator and approved purpose
        reside in request origin, delegation scope, and subject binding. Incidents and original implementations support borrowing these legitimate
        features without quantifying a universal detection benefit.
  evidence_refs:
  - REF-001174
  - REF-001172
  - REF-001173
  - REF-001180
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 服务外构造省略正常权威签发事务
    en: Off-service construction omits normal authority issuance transactions
  analysis:
    paragraphs:
    - zh: 受信签名能力可在权威服务之外生成新证书，不经历正常请求接收、策略判断与数据库发布。仅监控签发端的规则因此看不到这次构造，而接受端仍可能记录证书认证。该差异由原始实现与正常服务语义共同支持；缺日志仍需排除采集、迁移和保留问题。
      en: Trusted signing capability can generate new certificates outside the authority without normal reception, policy evaluation, and
        database publication. Issuer-only rules consequently cannot observe that construction even though acceptance-side authentication
        may remain visible. Original implementation and normal-service semantics support the difference, while absent logs still require
        ruling out collection, migration, and retention problems.
  evidence_refs:
  - REF-001172
  - REF-001173
  - REF-000854
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 受信签发上下文挟持改变实际控制者与请求身份、代理范围及批准意图的关系，仍保留正常签发事务；脱离签发链的认证证书构造改变新材料是否经过权威服务，产生签发到接受的记录断裂。前者需要来源与授权判断，后者需要完整历史签发库存及独立构造证据。
      en: Trusted Enrollment-Context Hijacking changes the relationship among actual controller, request identity, delegation scope, and
        approval intent while retaining normal issuance. Off-Issuance-Chain Authentication-Certificate Construction changes whether new material
        passes through the authority, disrupting issuance-to-acceptance continuity. The former needs origin and authorization context; the
        latter needs complete historical inventory and independent construction evidence.
    - zh: 既有终端私钥取得属于父级核心，并不按文件、内存、容器格式或保管产品再分项。两项子技术不宣称穷尽所有实现；若事件分别具有受信签发与服务外构造证据，可以按阶段并列。不可导出调用、有效期调整和提交频率不能仅凭可行性成为额外分类。
      en: Existing end-entity key acquisition remains parent core rather than being split by files, memory, containers, or vault products.
        The children do not claim exhaustive implementation coverage, and an event with separate evidence of enrollment and off-service construction
        can carry both by stage. Non-exportable invocation, validity adjustments, and request cadence do not form additional partitions from
        feasibility alone.
  coverage: established
