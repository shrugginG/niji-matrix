research:
  limitations:
    paragraphs:
    - zh: 可信签发滥用有真实事件支持，服务外构造主要由原始实现与实验支持，不可导出密钥调用只有平台能力证据。事件中的 PKINIT 支持可用私钥证明能力，却不公开私钥字节或导出方式；真实报告也明确存在检测与阻断，不能当作无告警效果证明。
      en: Trusted enrollment abuse has incident support, off-service construction relies mainly on original implementations and experiments,
        and non-exportable invocation has only platform-capability support. Incident PKINIT supports usable private-key proof without disclosing
        key bytes or export methods; reported detection and disruption prevent treating it as evidence of alert-free operation.
    - zh: 可实施防御在本研究中主要覆盖 Windows AD CS/PKINIT，并不自动推广到其他 PKI、云工作负载或客户端实现。强映射、Provider、事件版本、硬件与撤销策略会改变成功和观察条件；窗口和允许名单应通过本地演练校准，暂无公开统一检测率或阈值。
      en: Implementable defense in this research principally covers Windows AD CS and PKINIT and does not automatically generalize to other
        PKIs, cloud workloads, or clients. Strong mapping, providers, event versions, hardware, and revocation change success and visibility
        conditions. Correlation windows and exceptions require local exercises; no public universal detection rate or threshold is established.
