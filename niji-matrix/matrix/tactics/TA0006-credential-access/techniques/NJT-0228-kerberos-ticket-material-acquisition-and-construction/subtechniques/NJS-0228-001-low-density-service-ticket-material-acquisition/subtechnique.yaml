schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0228-001
parent_ref: NJT-0228
name:
  zh: 低密度服务票据取材
  en: Low-Density Service-Ticket Material Acquisition
summary:
  zh: 有意延长和扰动服务票据请求间隔，使取材序列在短时间窗内不形成明显峰值。
  en: Deliberately extend and vary service-ticket request intervals so acquisition does not form a prominent short-window spike.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 低密度服务票据取材是在实际取得服务票据协议密文的过程中，由攻击者控制请求间隔和节奏，把原本可集中完成的请求分散到更长周期。其直接目的仍是取得材料供离线测试或后继使用，匿迹变量是同一取材活动的时间密度。
    en: Low-Density Service-Ticket Material Acquisition deliberately controls request intervals and cadence while actually acquiring service-ticket
      protocol ciphertext, spreading requests that could otherwise be concentrated across a longer horizon. Its immediate purpose remains
      material acquisition for offline testing or later use; the evasion variable is the temporal density of the same acquisition activity.
  - zh: 延迟与抖动是可实现的节奏控制，指定单个SPN本身只说明目标选择。必须有取材结果以及有意调整节奏的实施证据或足够序列证据，不能把任何低量服务访问都解释为本项。
    en: Delay and jitter implement cadence control, while specifying one SPN merely describes target selection. Inclusion requires acquisition
      results and implementation or sufficient sequence evidence of deliberate cadence adjustment. Low-volume service access alone does not
      establish this child.
stealth_characteristics:
  paragraphs:
  - zh: 低密度服务票据取材把请求计数从单一短窗口分散出去，降低突发量和固定周期的可区分性。只按五分钟账户请求数告警的规则可能保留每个事件却无法聚合完整取材序列。
    en: Low-Density Service-Ticket Material Acquisition disperses request counts beyond one short window and reduces the distinguishability
      of bursts or fixed cadence. A rule limited to five-minute per-account counts may retain every event but fail to aggregate the acquisition
      sequence.
  - zh: 域控仍可观察目标服务、账户、来源和回复结果。延长保留并按首次服务关系、目标敏感性和端点输出关联，可弥补峰值信号的损失；极少目标或较长间隔也会限制防守方复原意图的把握。
    en: The DC still observes service targets, account, origin, and response status. Longer retention and correlation of first-seen service
      relationships, target sensitivity, and endpoint output can compensate for the lost peak signal. Very few targets or long intervals
      also limit confidence in reconstructing intent.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入有意延迟或扰动且已取得材料的服务票据请求；排除仅有枚举、统计、失败请求和普通单目标取材。缓存是否被写入不决定本项，与本地缓存旁路取材可分别成立。
    en: Include deliberately delayed or varied service-ticket requests that yielded material. Exclude enumeration, statistics, failed requests,
      and ordinary single-target acquisition alone. Cache population does not determine this child, which can coexist with Local-Cache-Bypassing
      Material Acquisition.
  - zh: 任务调度、用户零散访问、重试退避、链路迟延、批处理和负载均衡都可能形成稀疏序列，须结合进程控制、调度参数、目标与输出判断；不能只靠低速推断恶意。它不改变构造票据的内容，不属于签发模板承袭构造。
    en: Scheduling, sporadic user access, retry backoff, network latency, batch work, and load balancing can all produce sparse sequences.
      Assess process control, scheduling parameters, targets, and outputs rather than inferring malice from low rate. This child does not
      modify constructed ticket content and differs from Issuance-Template-Inheriting Construction.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 适用于攻击者能够持续访问KDC、愿意延长取材时间且担心域控侧短时突发检测的域内活动；它可以与直接协议处理或正常API取材组合。
      en: This applies when an adversary can maintain KDC reachability, tolerates a longer acquisition period, and expects short-burst detection
        at the DC. It can combine with direct protocol handling or ordinary API acquisition.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需能控制请求发送节奏并接收成功回复，有足够会话寿命或续期能力完成计划。抖动不赋予身份权限，也不保证取得的密文可以在现实成本内破解。
        en: The adversary must control request timing and receive successful replies, with enough session lifetime or renewal capability
          to finish the plan. Jitter confers no identity authority and does not guarantee that acquired ciphertext can be cracked at practical
          cost.
    defender_model:
      paragraphs:
      - zh: 防守观察模型以集中KDC事件和历史服务关系为主；短窗口计数容易丢失聚集度，长窗口仍可累计目标覆盖。IP变化、NAT和多DC采集差异会影响同一序列归并。
        en: The observation model centers on centralized KDC events and historical service relationships. Short-window counts lose clustering
          while long windows preserve cumulative target coverage. IP changes, NAT, and collection differences among DCs affect sequence joins.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将真实票据请求摊入较长时间以削弱局部峰值
    en: Spread genuine ticket requests over time to weaken local peaks
  analysis:
    paragraphs:
    - zh: 攻击者把请求发生时刻作为可控变量，将仍由真实 KDC 返回材料的同一取材序列铺入更长时间。请求中的主体和服务没有被隐藏，但短窗口看到的计数下降，防守方需要跨窗口恢复目标关系。该效果来自明确的节奏控制及限定规则模型；只有稀疏访问而无实施或材料证据时，不能反推本子项。
      en: The adversary controls request timing and spreads one acquisition sequence across a longer horizon while a genuine KDC still returns
        material. Principal and service identities remain visible, but each short window contains fewer events, requiring cross-window reconstruction
        of target relationships. This effect rests on deliberate cadence control and a bounded rule model; sparse access without implementation
        or material evidence does not establish the child.
