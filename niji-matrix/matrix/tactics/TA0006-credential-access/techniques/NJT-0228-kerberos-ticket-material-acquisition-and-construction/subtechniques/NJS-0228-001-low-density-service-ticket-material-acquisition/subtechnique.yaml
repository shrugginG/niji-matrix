research:
  limitations:
    paragraphs:
    - zh: 原始实现证明延迟与抖动可被选择，短窗口峰值减弱是对检测逻辑的明确推断，没有公开统一的最优间隔或规避率。正常稀疏访问与恶意序列重叠，正式应用应把候选告警与确认取材区分。
      en: The original implementation establishes selectable delay and jitter. Reduced short-window peaks are an explicit inference about
        detection logic, without a public universal optimum interval or evasion rate. Legitimate sparse access overlaps with malicious sequences,
        so operational use must distinguish candidate alerts from confirmed acquisition.
