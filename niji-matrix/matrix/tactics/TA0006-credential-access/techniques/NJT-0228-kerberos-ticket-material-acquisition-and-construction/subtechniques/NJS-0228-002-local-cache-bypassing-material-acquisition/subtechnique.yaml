research:
  limitations:
    paragraphs:
    - zh: 支持性实验针对2019年Windows与相应实现，不能推定所有操作系统的缓存语义相同。未观察到缓存增长可能源于传感器、backend、会话切换或清理；没有直接回复与输出关联时只能保留候选。
      en: The supporting experiment concerns Windows and implementations in 2019; cache semantics cannot be generalized across all operating
        systems. Missing cache growth may result from sensors, backend choice, session changes, or cleanup. Without correlation of direct
        replies and output, the result remains a candidate.
