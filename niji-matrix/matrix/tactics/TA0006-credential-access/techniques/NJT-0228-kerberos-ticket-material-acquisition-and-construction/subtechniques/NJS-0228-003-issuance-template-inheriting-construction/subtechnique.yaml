schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0228-003
parent_ref: NJT-0228
name:
  zh: 签发模板承袭构造
  en: Issuance-Template-Inheriting Construction
summary:
  zh: 取得真实签发票据后修改所需身份或授权内容，保留自然签发特征以降低伪造外观。
  en: Modify required identity or authorization content in a genuinely issued ticket while retaining natural issuance features to reduce
    signs of forgery.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 签发模板承袭构造以真实签发的Kerberos票据作为构造基础，使用已控制密钥解密，改变所需身份或授权内容，重新计算适用签名并加密输出。攻击者取得的是未经该次正规授权的新材料，同时保留模板中不需改变的时限、格式或其他自然字段。
    en: Issuance-Template-Inheriting Construction uses a genuinely issued Kerberos ticket as the construction basis, decrypts it with controlled
      keys, changes required identity or authorization content, and recalculates applicable signatures before encrypting the output. The
      adversary obtains new material lacking the corresponding legitimate authorization while preserving unmodified template lifetime, format,
      or other natural fields.
  - zh: 原始Diamond Ticket实验提供此变量的具体实现，分类不以Diamond名称为条件。完整重放原票据没有构造结果；使用证书、密码或已有秘密向KDC正常请求一个未修改TGT也没有本项所需的离权威修改。
    en: The original Diamond Ticket experiment implements this variable, but classification does not depend on the Diamond label. Replaying
      an unchanged ticket creates no construction result. Using a certificate, password, or existing secret to request an unmodified TGT
      from the KDC also lacks the required off-authority modification.
stealth_characteristics:
  paragraphs:
  - zh: 签发模板承袭构造把真实签发的外观带入未经授权的材料，减少从零构造时常见的固定时限或字段偏差。先行真实AS请求也使仅检查是否存在某次签发的规则更难区分修改后的票据。
    en: Issuance-Template-Inheriting Construction carries genuine issuance features into unauthorized material, reducing fixed lifetime or
      field errors associated with construction from scratch. A real preceding AS request also makes a rule checking only for some prior
      issuance less able to distinguish the modified ticket.
  - zh: 被修改的票据密文字节及哈希一般会改变，身份或授权内容仍可能与原请求、目录状态或权限历史不一致。原始实验并未令构造进程、密钥控制和后继使用不可见；完整标识与授权一致性观察可以保留判别力。
    en: Modified ticket ciphertext bytes and hashes generally change, and identity or authorization content can disagree with the original
      request, directory state, or permission history. The original experiment did not make the construction process, key control, or subsequent
      use invisible. Complete identifiers and authorization-consistency observations can preserve discrimination.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入已证明真实票据输入与离权威修改输出之间联系的构造；从零构造、只手工选择正常字段、普通票据续期或原样重放均不满足本项。是否绕过本机缓存和请求节奏都不是本项判定变量。
    en: Include construction with a proven link between a genuinely issued ticket input and an off-authority modified output. Construction
      from scratch, manually selecting normal-looking fields alone, normal renewal, and unchanged replay do not meet this child. Local-cache
      bypass and request cadence do not determine this variable.
  - zh: 合法KDC签发、授权委派、票据续期、管理员故障排查和研究实验均可包含读取与编码票据，不能只凭解析或重新序列化认定伪造。须证明攻击者控制的语义改变及所需密钥；服务接受只是后继证据，不能代替构造谱系。
    en: Legitimate KDC issuance, authorized delegation, renewal, administrator troubleshooting, and research can involve reading and encoding
      tickets. Parsing or reserialization alone does not establish forgery. Adversary-controlled semantic changes and required key capability
      must be established. Service acceptance is subsequent evidence and cannot replace construction lineage.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 适用于攻击者已控制相应签名与加密密钥，但希望减少固定模板异常的环境。其可从低权限真实身份取得模板后修改授权内容；这种高前提行为通常发生在域秘密已暴露之后，而非通过单次普通低权请求自动获得伪造能力。
      en: This applies when an adversary already controls applicable signing and encryption keys and seeks to reduce fixed-template anomalies.
        A genuine lower-privilege identity can supply a template before authorization content is modified. Such demanding prerequisites normally
        follow domain-secret exposure; an ordinary low-privilege request does not itself grant forgery capability.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制可用真实票据、对应解密与签名密钥以及目标realm和身份信息。修改必须满足部署版本的PAC签名、授权和跨域规则，持有服务账户密钥不等于掌握所有验证所需秘密。
        en: The adversary needs a usable genuine ticket, applicable decryption and signing keys, and target realm and identity information.
          Modifications must satisfy deployed PAC signature, authorization, and cross-realm rules. Possession of a service-account key does
          not imply control of every secret required for validation.
    defender_model:
      paragraphs:
      - zh: 防守方可能看见真实签发记录和后继票据请求，但标准4768/4769不会暴露整个PAC。新版本安全票据哈希有助于检查确切对象连续性，授权差异则需经批准的票据检验、目录历史和目标会话证据；没有这些数据时只可判断谱系风险。
        en: Defenders may see genuine issuance and later requests, but standard 4768 and 4769 do not expose the entire PAC. Newer safe ticket
          hashes can test exact-object continuity, while authorization differences require approved ticket inspection, directory history,
          and target-session evidence. Without them, the result is a lineage risk rather than confirmed modification.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 沿用真实票据字段与先行签发外观
    en: Inherit genuine ticket fields and preceding issuance appearance
  analysis:
    paragraphs:
    - zh: 攻击者以真实签发对象为输入，只改变需要的身份或授权语义，其余环境化字段可随原模板保留。因此，正常时限和一条先行签发记录不再能区分修改输出与未经修改的票据。密文字节、摘要和授权一致性仍可能揭示差异；必须连接真实输入、语义改变与输出，才能把这种特征承袭归给当前构造。
      en: The adversary starts from a genuinely issued object, changes the required identity or authorization semantics, and can retain other
        environment-conforming fields. A normal lifetime and a preceding issuance record therefore no longer distinguish modified output
        from an unchanged ticket. Ciphertext, digests, and authorization consistency can still reveal differences; genuine input, semantic
        changes, and output must be linked before attributing feature inheritance to the construction.
