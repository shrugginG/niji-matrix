research:
  limitations:
    paragraphs:
    - zh: 原始实验支持构造、正常字段承袭及局部检测弱化，当前平台更新会改变接受条件。公开事件只说明Diamond构造，未给出模板字段或规避成效；因此子项成立性与实际事件匿迹效果必须分开校准。
      en: The original experiment supports construction, inheritance of normal fields, and weakened local detection. Current platform updates
        alter acceptance conditions. The public incident establishes Diamond construction without template fields or evasion outcomes, so
        existence of the child and real-incident stealth effectiveness require separate calibration.
