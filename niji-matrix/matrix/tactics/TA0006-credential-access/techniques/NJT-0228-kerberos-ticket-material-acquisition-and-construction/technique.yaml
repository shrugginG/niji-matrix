research:
  limitations:
    paragraphs:
    - zh: 平台规范支持协议和字段语义，原始工具与实验支持实现能力及局部痕迹变化，事件报告仅支持其明确记录的行为。这三种证据不能相互替代。延迟取材尚缺公开的对照告警率，2019年缓存旁路实验需在当前客户端复验，2022年模板实验也不是对所有当前 PAC 与跨域策略的承诺。
      en: Platform specifications support protocol and field semantics, original tooling and experiments support implementation capability
        and local trace changes, and incident reports support only the behaviors explicitly recorded. These evidence types are not interchangeable.
        Delayed acquisition lacks public comparative alert rates, the 2019 cache-bypass experiment needs replication on current clients,
        and the 2022 template experiment makes no promise for every current PAC or cross-realm policy.
    - zh: CERT Polska 在 CHP 早期活动中记录了 Diamond Ticket 构造，但未公开精确票据字段、密钥取得链、服务接受证据或该构造的规避结果，也未完全确认早期与十二月活动属于同一攻击者。材料分类应保留完整票据凭据、仅有票据密文和离线测试密文的区别；后继使用不能倒推出缺失的取得方式。
      en: CERT Polska records Diamond Ticket construction during early CHP activity without publishing exact ticket fields, a key-acquisition
        chain, service acceptance, or evasion outcomes for that construction. It does not fully confirm the same actor across early and December
        activity. Material classification must retain the distinction among complete ticket credentials, ticket ciphertext alone, and ciphertext
        for offline testing. Subsequent use cannot reconstruct an unobserved acquisition path.
