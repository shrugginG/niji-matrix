schema_version: 2.0.0
type: technique
id: NJT-0228
name:
  zh: Kerberos 票据材料取得与构造
  en: Kerberos Ticket-Material Acquisition and Construction
summary:
  zh: 取得既有 Kerberos 票据、票据协议可离线测试密文或构造新票据，并改变请求密度、缓存路径或签发外观以降低材料取得和伪造的可识别性。
  en: Acquire existing Kerberos tickets or protocol ciphertext for offline testing, or construct new tickets, while changing request density,
    cache paths, or issuance appearance to reduce recognition of acquisition and forgery.
aliases: []
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1558
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1558
definition_and_concept:
  paragraphs:
  - zh: Kerberos 票据材料取得与构造是攻击者实际取得既有票据及其使用所需关联材料、取得可检验未知秘密的 Kerberos 协议密文，或者利用已控制的签名与加密能力构造未经相应正规签发的新票据的凭据访问行为。材料可以来自会话缓存、认证组件、协议回复或捕获流量；完成条件是材料进入攻击者控制，而不是只发现一个
      SPN、缓存位置、读取权限或可利用配置。
    en: Kerberos Ticket-Material Acquisition and Construction is credential access in which an adversary actually obtains existing tickets
      and the associated material needed to use them, obtains Kerberos protocol ciphertext that permits testing unknown secrets, or uses
      controlled signing and encryption capability to construct a ticket without the corresponding legitimate issuance. Material may come
      from session caches, authentication components, protocol replies, or captured traffic. Completion requires adversary control of material,
      rather than discovery of an SPN, cache path, read permission, or exploitable configuration.
  - zh: 可离线测试的密文与可直接呈现的凭据须分别标识。服务票据的加密部分可以作为服务账户秘密的测试材料；无预认证 AS 回复中可测试的是客户端密钥保护的回复加密部分，而其中 TGT 仍由 krbtgt 等服务密钥保护。取得这种回复不表示已得到口令或能使用 TGT。对未知候选的计算验证属于
      NJT-0137，票据提交与兑换属于 NJT-0184，服务按票据接受身份并授权资源属于 NJT-0061。
    en: Ciphertext for offline testing and credentials ready for presentation must be labeled separately. A service ticket encrypted part
      can support testing a service-account secret. In an AS reply without preauthentication, the testable object is the reply encrypted
      part protected by the client key; its TGT remains protected by a service key such as krbtgt. Receiving that reply establishes neither
      password recovery nor usable TGT control. Computing tests of unknown candidates belongs to NJT-0137, ticket presentation and redemption
      to NJT-0184, and service acceptance and resource authorization to NJT-0061.
stealth_characteristics:
  paragraphs:
  - zh: Kerberos 票据材料取得与构造借用组织本来就允许的缓存、签发和票据语法。单次成功回复或正确签名票据不携带攻击者意图；有意拉长服务票据请求间隔会削弱短时突发规则，直接处理回复可减少本机缓存增长，承袭真实签发票据再修改则可保留自然时限等外观。三种变化分别改变时间密度、端点留痕位置与构造材料的可见特征。
    en: Kerberos Ticket-Material Acquisition and Construction borrows caches, issuance, and ticket syntax already permitted by the organization.
      One successful reply or correctly signed ticket does not convey adversary intent. Deliberately spacing service-ticket requests weakens
      short-window burst rules, processing replies directly can reduce local-cache growth, and modifying an issued ticket can preserve natural
      lifetime features. These changes separately affect temporal density, endpoint trace location, and visible construction features.
  - zh: 匿迹效果依赖防守观察面。协议取材仍留下 KDC 请求和成功或失败记录；绕过本机票据缓存不等于绕过域控。离线构造可以不产生对应签发事务，但密钥取得、构造输出和后继验证仍可能留痕；模板承袭反而有真实先行签发。完整票据哈希、长期身份与服务关系以及端点材料输出能够提高区分能力，但缺失短时
      4768 不能证明伪造。
    en: Stealth depends on the defensive vantage point. Protocol acquisition still leaves KDC requests and success or failure records; bypassing
      a local ticket cache does not bypass the domain controller. Offline construction may lack corresponding issuance, while key acquisition,
      construction output, and subsequent validation can remain observable. Template inheritance instead includes genuine prior issuance.
      Complete ticket hashes, long-term identity-to-service relationships, and endpoint material outputs can improve discrimination, but
      a missing recent 4768 event does not prove forgery.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入实际复制的 TGT 或服务票据、可验证关联会话密钥的缓存材料、成功返回的 Kerberos 离线测试密文，以及有格式与密钥语义支撑的新票据或票据修改结果。发现 ccache 文件、执行 klist、请求失败、仅有 krbtgt 暴露或一次 Kerberos
      登录都不足以证明本项完成。正常 SSO、kinit、委派、缓存续期、备份、故障排查和获批安全评估须以身份所有者、进程、请求目标、工单、输出保管与寿命区分。
    en: Include actually copied TGTs or service tickets, cache material with verifiable associated session keys, successfully returned Kerberos
      ciphertext for offline testing, and new or modified ticket outputs supported by format and key semantics. Discovering a ccache file,
      running klist, a failed request, krbtgt exposure alone, or one Kerberos logon does not complete this object. Distinguish normal SSO,
      kinit, delegation, cache renewal, backup, troubleshooting, and authorized assessment using identity ownership, process, requested targets,
      approval, output custody, and lifetime.
  - zh: NJT-0177 拥有 OS 认证权威读取路径，NJT-0147 拥有保管库取用边界，T1552 拥有普通文件等未保护秘密路径；取得的对象确为 Kerberos 材料时，路径与材料可分别举证，但文件扩展名不决定归属。NJT-0169 截获输入，NJT-0093
      改变认证过程，NJT-0178 取得应用令牌，NJT-0166 构造 Web 认证材料，NJT-0227 取得或构造认证证书。KDC 正常 PKINIT 签发 TGT 不属于票据伪造；只有之后独立证明的票据复制或离权威修改才进入本项。
    en: NJT-0177 owns reads of OS authentication authorities, NJT-0147 managed-vault retrieval, and T1552 unprotected-secret paths such as
      ordinary files. When the actual object is Kerberos material, path and material outcomes may be independently evidenced; file extension
      does not determine ownership. NJT-0169 intercepts input, NJT-0093 changes authentication processes, NJT-0178 acquires application tokens,
      NJT-0166 constructs web authentication material, and NJT-0227 acquires or constructs authentication certificates. Normal KDC issuance
      of a TGT through PKINIT is not ticket forgery. Only separately proven subsequent ticket copying or off-authority modification enters
      this object.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得域内会话后，可对可到达 KDC 的服务目标收集密文，或从受侵工作站及 Linux/macOS 票据缓存复制现存材料；无预认证配置允许在不先证明目标用户秘密时取得特定 AS 回复。控制 krbtgt、服务或相应其他密钥后，可在构造位置生成或修改票据，为后继冒用与权限扩张准备材料。构造或取得完成不以实际横向访问为前提。
      en: After obtaining a domain session, an adversary can collect ciphertext for services reachable through a KDC or copy existing material
        from compromised workstations and Linux or macOS caches. A no-preauthentication configuration can expose a particular AS reply before
        the requester proves the target user secret. Control of krbtgt, service, or other applicable keys permits ticket generation or modification
        at a construction location for later impersonation or privilege expansion. Actual lateral access is not a prerequisite for completing
        construction or acquisition.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须具备与路径相符的读取或请求能力，而非默认域管理员。服务票据取材通常需要有效 TGT 或可得到响应的协议条件；无预认证取材依赖目标设置；缓存窃取依赖对应用户、进程、文件或缓存服务权限。伪造须掌握对应密钥及身份、realm、SPN、授权数据和签名格式知识；服务密钥不保证能通过当前全部
          PAC 检查。时间稀释还需容忍更长取材周期。
        en: The adversary needs read or request capability appropriate to the path, rather than assumed domain-admin access. Service-ticket
          acquisition normally requires a valid TGT or other protocol conditions that yield a response. AS acquisition without preauthentication
          depends on target configuration. Cache theft depends on user, process, file, or cache-service authority. Forgery requires applicable
          keys and knowledge of identity, realm, SPN, authorization data, and signature formats; a service key does not guarantee success
          against all current PAC checks. Temporal dilution also requires tolerating a longer collection period.
    defender_model:
      paragraphs:
      - zh: 防守方可集中接收各 DC 的 4768/4769、维护身份与服务账户配置快照，并结合端点进程、网络、对象读取和安全摘要化材料输出。Linux 文件审计须提前配置，KCM、KEYRING 和 macOS API 缓存需要各自传感器；Windows 票据缓存快照并非
          KDC 日志字段。更新后的部分 DC 可给出票据哈希，但旧版、缺失事件、跨域签发与采集延迟会破坏连续谱系，且普通事件不提供明文 PAC、全部组或完整票据。
        en: Defenders may centralize 4768 and 4769 from every DC, maintain identity and service-account configuration snapshots, and combine
          endpoint process, network, object-read, and safely digested material-output evidence. Linux file audit needs prior configuration;
          KCM, KEYRING, and macOS API caches require their own sensors. Windows cache snapshots are not KDC log fields. Some updated DCs
          expose ticket hashes, while older versions, missing events, cross-realm issuance, and collection delay disrupt lineage. Ordinary
          events do not expose plaintext PACs, all groups, or entire tickets.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 把取材或构造放在本机缓存指标和正规签发事务之外
    en: Place acquisition or construction outside local cache indicators and ordinary issuance transactions
  analysis:
    paragraphs:
    - zh: 攻击者直接处理协议回复而不把每个目标票据写入本机登录缓存，或离线构造不经对应签发事务的新票据，令只检查缓存增长或签发请求的传感器缺少关键动作。前者仍有域控请求，后者仍可有密钥与输出痕迹；可证明的是观察面分离，而非全面不可见。
      en: Direct processing of protocol replies avoids adding each target ticket to the local logon cache, while offline construction produces
        new tickets outside the corresponding issuance transaction. Sensors limited to cache growth or issuance requests then miss the critical
        operation. The first path still has DC requests, and the second can expose key and output traces. The supported effect is separation
        of observation planes, not universal invisibility.
  evidence_refs:
  - REF-001185
  - REF-001184
  - REF-000625
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 承袭真实签发外观以降低构造材料的异常可区分性
    en: Inherit genuine issuance features to reduce the distinguishability of constructed material
  analysis:
    paragraphs:
    - zh: 先取得真实票据再只改变所需身份或授权内容，可保留符合环境的时限等签发特征，并产生一次真实先行请求。与固定值从零构造相比，局部字段和简单签发存在性规则较难区分；完整票据标识、授权一致性和构造端证据仍可能揭示变化。
      en: Obtaining a genuine ticket before changing only required identity or authorization content can preserve environment-conforming
        lifetime features and creates a real prior request. Local fields and simple issuance-existence rules become less discriminating than
        for construction from fixed defaults. Complete ticket identifiers, authorization consistency, and construction-end evidence can still
        reveal modification.
  evidence_refs:
  - REF-001184
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 延长取材间隔以削弱短窗口服务票据请求聚集
    en: Extend acquisition intervals to weaken short-window service-ticket request clustering
  analysis:
    paragraphs:
    - zh: 有意在服务票据请求间增加延迟和抖动，把同一取材序列铺开，使按单账户短窗口数量判定的规则更难看到突发。每次成功回复仍留在域控；长期服务关系和材料输出能保留信号，因此这只是对限定规则的因果推断，尚无通用规避率。
      en: Deliberate delay and jitter spread a service-ticket acquisition sequence so account-based short-window count rules see less of
        a burst. Every successful reply remains visible at the DC. Long-horizon service relationships and material output preserve signals,
        so the effect is a causal inference for bounded rules without a universal measured evasion rate.
  evidence_refs:
  - REF-001183
  - REF-000855
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 子项分别以服务票据取材的时间密度、原始回复是否进入本机常规缓存，以及构造结果是否承袭真实签发模板为变量。前两项可组合，第三项用于票据构造；它们不按工具、操作系统、票据名称或 Golden、Silver 等业界标签分组。普通缓存复制和一般离线构造保留在父级，不能只因其对象不同增设匿迹分类。
      en: Children use the temporal density of service-ticket acquisition, whether raw replies enter the ordinary local cache, and whether
        construction inherits a genuinely issued template as independent variables. The first two may combine; the third applies to construction.
        They do not partition by tool, operating system, ticket name, or industry labels such as Golden or Silver. Ordinary cache copying
        and general offline construction remain within the parent scope rather than becoming evasion classes merely because their objects
        differ.
  coverage: established
  subtechnique_refs:
  - NJS-0228-001
  - NJS-0228-002
  - NJS-0228-003
