schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0229-001
parent_ref: NJT-0229
name:
  zh: 次生副本秘密取回
  en: Secondary-Copy Secret Retrieval
summary:
  zh: 选择由先前操作、沟通或复制形成的秘密记录取得材料，使当前读取脱离原秘密供给面的事务。
  en: Retrieve secrets from records produced by earlier operations, communication, or copying, separating the current read from the original
    secret-supply transaction.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 次生副本秘密取回以攻击者选择记录角色为变量：从历史、沟通或复制产物中取得已存在的认证秘密，而不是访问当前承担秘密供给职责的运行配置或保管库。须能证明记录形成于某次先前交互或复制，例如历史条目的命令来源、邮件中的共享关系、父提交与删除提交的对应差异，或原对象与备份版本的内容映射。
    en: Secondary-Copy Secret Retrieval uses the selected record role as its variable. It obtains an existing authentication secret from
      history, communication, or copy output rather than the operational configuration or vault currently serving secrets. Evidence must
      link the record to an earlier interaction or copy, such as a history entry's command origin, a sharing relationship in email, a parent-to-removal
      commit difference, or content mapping between an original and a backup version.
  - zh: 当前读取可以在原操作结束、现行文件被修正或共享会话结束后发生；取得不要求原秘密服务再提供一次响应。副本中的值仍须实际进入攻击者控制，且有效性独立判断。一个文件由软件生成、位于 Git 或名为 backup 并不够，因为所有运行配置也有生成过程，不能因此把父技术所有秘密都改称副本。
    en: 'The current read can occur after the original operation, correction of the current file, or end of a sharing session, without a
      new response from the original secret service. The copied value must still enter adversary control and its validity is assessed separately.
      Software generation, Git storage, or a backup filename alone is insufficient: all operational configurations have origins, so those
      properties cannot turn every parent secret into a secondary copy.'
stealth_characteristics:
  paragraphs:
  - zh: 次生副本秘密取回把可见取得从原秘密供给面移至记录保管面。当前可见的是 history 文件读取、邮件或消息内容返回、旧 commit 或备份对象取回，原凭据服务可能没有对应新事务。防守方如果按现行配置与保管库日志判断秘密是否外流，就可能遗漏这个来源；需要沿记录身份和形成链解释读取。
    en: Secondary-Copy Secret Retrieval moves visible acquisition from the original secret-supply surface to the record custodian. Current
      evidence consists of history-file reads, returned mail or message content, or retrieval of an old commit or backup object; the credential
      service may have no corresponding new transaction. Defenders judging exposure only from current configuration and vault logs can miss
      this source and need record identity and creation lineage to interpret the read.
  - zh: 版本、消息、命令和对象痕迹仍然存在。原文件删除并不撤回 clone、fork 或历史引用，秘密撤销则可以降低其后继使用价值；两者控制对象不同。平台能力与微软邮件事件支持这种路径，但并未证明攻击者在该事件中选择旧版本、压低频率或绕过某一具体告警，所以不附加时空释痕或特征伪装机理。
    en: Version, message, command, and object evidence remains. Deleting the original does not retract clones, forks, or historical references,
      whereas revocation can reduce the secret's subsequent value; the controls act on different objects. Platform capabilities and Microsoft's
      email incident support this path but do not establish old-version selection, rate reduction, or bypass of a specific alert in that
      incident. Spatiotemporal dilution and feature disguise are therefore not added.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须同时具备秘密内容、可判定的次生记录角色和当前取得结果。真实命令历史保留先前传入的口令、共享邮件包含先前发送的秘密，以及能够映射到已修改原件的旧版本，都是可审查实例。原对象不可访问不是必要条件；决定因素是攻击者实际选择并取得了次生记录，而不是从没有观察到原对象读取反推使用副本。
    en: Inclusion requires secret content, an identifiable secondary-record role, and a current acquisition outcome. Genuine history retaining
      a previously supplied password, shared mail containing a previously sent secret, and an old version mapped to a modified original are
      reviewable examples. The original need not be inaccessible. The decisive fact is actual selection and acquisition of the secondary
      record, not an inference from absent original-read evidence.
  - zh: 当前应用唯一读取的配置、无法核对复制来源的旧文件、正常回看自己的历史和获批备份恢复不自动属于本子项。直接读取 SAM 或 NTDS 副本依旧归 NJT-0177 的不活动视图，不因有副本角色就迁入本对象；受管理保管库备份若仍维持独立解锁边界，应先审查 NJT-0147。协作导出的令牌、Cookie
      和证书私钥还必须分别证明材料类型。
    en: The configuration currently used as an application's sole supply, an old file without verifiable copy provenance, normal personal-history
      review, and approved restore work do not automatically qualify. SAM or NTDS copies remain NJT-0177 inactive-store views rather than
      moving here because they are copies. Vault backups retaining an independent unlock boundary first require NJT-0147 review. Tokens,
      cookies, and certificate keys in collaboration exports additionally require evidence of their material types.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 运维人员在终端参数中输入口令后，历史机制可留下持久记录；攻击者读取该记录时不必截获原输入。同样，修正仓库当前分支仍可能留下历史引用与外部 clone，攻击者可以取回相应历史对象。二者共同改变来源角色，但其路径审计分别依赖主机读取与版本对象清单。
      en: A password supplied as a terminal argument may persist in history, allowing later retrieval without intercepting the original input.
        Correcting a repository's current branch can likewise leave historical references and external clones from which the corresponding
        object can be retrieved. Both change source role, while their path evidence depends respectively on host reads and version-object
        inventories.
    - zh: 在协作记录场景中，被侵账户能够访问包含先前共享秘密的邮件或消息。微软 2024 年披露直接支持外传邮件中的秘密被发现并尝试使用；是否为某种应用令牌、是否来自 Slack 及每项秘密是否有效均未披露，不能补写为已观察结论。
      en: In collaboration-record scenarios, a compromised account can access mail or messages containing previously shared secrets. Microsoft's
        2024 disclosure directly supports finding and attempting to use secrets in exfiltrated email. It does not identify particular application-token
        types, Slack use, or the validity of every secret, so those conclusions remain unobserved.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可读历史、版本或协作记录，能够定位具体秘密并控制读取结果；可能使用普通账户或已经外传的本地记录。选择旧版本需要相关引用仍可达，选择历史条目需要记录未被过滤，选择共享消息需要访问范围覆盖其内容。攻击者不必控制原保管库，但也不能凭不控制它就假定副本中保存了完整、现行或未绑定秘密。
        en: The adversary needs readable history, version, or collaboration records, a way to locate concrete secrets, and control of the
          read result, potentially through an ordinary account or already exfiltrated local records. Old-version selection needs reachable
          references, history selection needs retained unfiltered entries, and shared-message selection needs content access. Control of
          the original vault is unnecessary, but its absence does not establish that a copy contains complete, current, or unbound secrets.
    defender_model:
      paragraphs:
      - zh: 防守方能把记录类型、产生事务、对象版本和内容分类映射到当前读事件时，可区分本子项与普通配置读取。仓库只有 clone 日志时，仍需检查取回范围是否覆盖特定 commit，不能把仓库名称当作秘密返回证据。共享邮件和命令历史可能不保留原始密钥权威标识，离线
          clone 的后续搜索更可能完全不进入组织日志。
        en: Defenders can distinguish this child from ordinary configuration reads when record type, creating transaction, object version,
          and classification map to the current read. A repository clone log still requires checking whether the transfer covered a particular
          commit; its name is not proof that the secret was returned. Mail and history may lack an original authority identifier, while later
          searches of an offline clone may never enter organizational logs.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 从可核对的次生记录取得秘密使原供给面不产生对应新事务
    en: Retrieve secrets from verifiable secondary records without a new original-supply transaction
  analysis:
    paragraphs:
    - zh: 攻击者选择一个已经由交互或复制形成的记录，当前秘密读取因此只经过记录保管面。若原保管库是唯一被监测的取得渠道，邮件、历史或版本读取没有被映射为凭据取得，关键行为便落出有效观察。微软披露证明了共享邮件秘密路径，GitHub 和 PSReadLine 说明记录保留条件；条件性防守缺口是基于这些语义的推断，不是个案无告警事实。
      en: Selecting a record already created by an interaction or copy routes the current secret read only through the record custodian.
        If the original vault is the sole monitored acquisition channel and mail, history, or version reads are not mapped to credential
        acquisition, the activity falls outside effective observation. Microsoft establishes the shared-mail secret path, and GitHub and
        PSReadLine establish record-retention conditions. The conditional defensive gap is inferred from those semantics rather than an incident-specific
        absence of alerts.
