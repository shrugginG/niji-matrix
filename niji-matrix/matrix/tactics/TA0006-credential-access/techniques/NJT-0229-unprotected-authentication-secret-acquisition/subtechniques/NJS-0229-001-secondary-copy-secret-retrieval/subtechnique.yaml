research:
  limitations:
    paragraphs:
    - zh: 微软邮件事件证明共享记录中秘密被发现与尝试使用，没有给出每个值、准确查询或逐项有效性，也不能代表所有版本与历史路径。平台文档证明副本可持续存在，不能单独证明攻击者有意用它规避审计。子技术以来源角色及条件性观察差异成立，中等置信度不外推实测规避效果。
      en: Microsoft's email incident establishes discovery and attempted use of secrets in shared records, without individual values, exact
        queries, or per-secret validity, and does not represent every version or history path. Platform documents establish persistence of
        copies without independently proving deliberate audit evasion. The child rests on source role and conditional observation differences,
        with medium confidence and no extrapolated measured evasion.
    - zh: 将没有复制谱系的散落文件留在父级是必要约束。优先通过记录格式、版本差异、共享元数据或备份清单审查来源；若只能确认老日期或文件名，子项不成立。秘密已撤销降低后继风险但不改变复制事实，只有候选文本而没有完整秘密则仍不能认定取得。
      en: Keeping loose files without copy lineage at the parent is a necessary constraint. Review provenance through record format, version
        differences, sharing metadata, or backup catalogs; age or filename alone does not establish the child. Revocation lowers downstream
        risk without undoing copying, whereas candidate text without the complete secret remains insufficient for acquisition.
