research:
  limitations:
    paragraphs:
    - zh: 原始平台材料主要证明可读面、保护条件和日志语义；它们不证明所有读者都是攻击者。NDSS 研究的秘密检测与验证不能转化为全部样本可登录的保证，微软邮件披露也没有列出逐项材料与搜索路径。对普通配置或接口没有结论级恶意使用证据的变体，父行为与条件性机理可成立，具体案例保持空缺。
      en: Original platform sources primarily establish readable surfaces, protection conditions, and log semantics, not malicious intent
        of every reader. NDSS secret detection and validation does not guarantee that every sample enables sign-in, and Microsoft's email
        disclosure does not enumerate individual materials or search paths. Variants without conclusion-level evidence of malicious use can
        support parent behavior and a conditional mechanism while leaving specific cases absent.
    - zh: 次生记录角色必须由记录格式、共享关系、版本差异或可核对复制链支持；日期、备份后缀和未见保管库事件都不是充分证据。缺少来源链时保留父级，不以未知旧文件扩大子项。具体分析覆盖 Windows 对象审计、GitHub Git 传输和 Kubernetes 普通配置响应，不能自动推广到全部
        Linux 文件、邮件平台或元数据接口；采集粒度、允许范围与关联窗口须按部署验证，当前没有统一实测准确率。
      en: Secondary-record role requires support from record format, sharing relationships, version differences, or a verifiable copy chain;
        age, a backup suffix, and absent vault events are insufficient. Keep unknown-provenance files at parent level rather than expanding
        the child. Concrete analytics cover Windows object audit, GitHub Git transfers, and Kubernetes ordinary-configuration responses,
        without automatically covering all Linux files, mail platforms, or metadata interfaces. Collection granularity, approval scope, and
        correlation windows need deployment validation; no universal measured accuracy is established.
