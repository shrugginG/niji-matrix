schema_version: 2.0.0
type: technique
id: NJT-0229
name:
  zh: 未保护的认证秘密取得
  en: Unprotected Authentication Secret Acquisition
summary:
  zh: 从不适当可读的工件、次生记录或披露接口取得认证秘密，使取得行为可能落在凭据专用保管与审计之外。
  en: Acquire authentication secrets from inappropriately readable artifacts, secondary records, or disclosure interfaces, potentially placing
    retrieval outside credential-specific custody and audit.
aliases: []
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1552
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1552
definition_and_concept:
  paragraphs:
  - zh: 未保护的认证秘密取得是攻击者从普通内容面取得口令、认证私钥或等价秘密的行为；该内容面把秘密以明文、可直接解码形式或不具有效秘密隔离的可逆形式暴露给不符合组织批准用途的读取者。它包括配置中的口令、交互历史中的参数、协作消息中的共享秘密，以及实际返回这些值的配置接口。这里的未保护是秘密与读者边界失配，不要求对象对全世界公开；需要普通文件权限或一个有效账户仍可能存在这种失配。
    en: Unprotected Authentication Secret Acquisition obtains passwords, authentication private keys, or equivalent secrets from an ordinary
      content surface that exposes them in plaintext, directly decodable form, or a reversible form without effective secret isolation to
      a reader inconsistent with organizational purpose. Examples include passwords in configuration, arguments retained in interactive history,
      secrets shared in collaboration messages, and configuration interfaces actually returning such values. Unprotected means a mismatch
      between secret sensitivity and the reader boundary, not universal public access; ordinary file permissions or an authenticated account
      can coexist with that mismatch.
  - zh: 完成点是具体秘密值或秘密材料进入攻击者可读、可保留的控制面。路径枚举、文件扩展名、配置下载成功和关键词命中只证明候选承载面；掩码、示例值或只有公钥的证书不证明秘密取得。秘密取得、受口令保护私钥的解锁、身份接受和资源访问分别判断，已过期或撤销材料也不能凭一次后继失败抹去已经发生的复制。
    en: Completion requires a concrete secret value or secret material to enter an adversary-readable or retainable control surface. Path
      enumeration, extensions, successful configuration downloads, and keyword matches identify possible carriers only; masks, examples,
      and public-key-only certificates do not establish secret acquisition. Acquisition, unlocking a passphrase-protected private key, identity
      acceptance, and resource access are separate judgments. Expiry or revocation and a subsequent failure do not undo an observed copy.
stealth_characteristics:
  paragraphs:
  - zh: 未保护的认证秘密取得可以只留下文件或注册表读取、仓库取回、消息检索和配置响应，而不产生口令导出、保管库解锁或认证失败事件。攻击者主动选择一个已经含秘密的普通内容面，减少与秘密权威服务交互的需求；原保管面没有新事件并不意味着整个组织没有读取痕迹。微软 GPP
      文档直接说明认证用户可读取含可恢复口令的 SYSVOL 文件，平台文档则说明历史和副本会保留敏感内容。
    en: Retrieval may leave only file or registry reads, repository transfers, message searches, and configuration responses without password
      export, vault unlock, or authentication-failure events. Selecting an ordinary surface that already contains a secret reduces the need
      to interact with its authority. No new event at the original custodian does not imply no read evidence elsewhere. Microsoft's GPP documentation
      directly establishes authenticated access to recoverable SYSVOL passwords, while platform documentation establishes sensitive content
      retained in history and copies.
  - zh: 匿迹结论依赖观察条件。未配置对象访问审计的主机、只监测秘密服务的 SOC 或只保留仓库级事件的服务可能无法识别具体秘密流出；已部署读审计、源版本清单和受控内容检查时，这些读取仍可暴露。普通业务表象只是需要解释的背景，不能从一次合法工具调用直接推断特征伪装；本对象也不声称低频、无告警或无法检测。
    en: The stealth conclusion depends on observation conditions. A host without object-read audit, a SOC monitoring only secret services,
      or a service retaining repository-level events may fail to identify the concrete disclosure. Read audit, source-version inventories,
      and controlled content inspection can expose it. Ordinary business appearance is context requiring explanation, not sufficient proof
      of feature disguise from one legitimate tool invocation. This object makes no claim of low rate, alert-free execution, or undetectability.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入普通配置、默认口令值、交互与协作记录、可读秘密清单及确实越过预期接收者边界的内容披露。GPP 使用公开固定 AES 密钥的可逆保护不构成独立秘密保管边界；有口令的私钥文件被复制时仅登记加密工件取得，解锁前不称为明文私钥取得或可用密钥控制。正常备份、排障、构建与获批秘密扫描会产生相似读取，需验证读者职责、数据分类、作业范围和实际接收者。
    en: Include ordinary configuration, default-password values, interactive or collaborative records, readable secret manifests, and content
      disclosure demonstrably crossing the intended recipient boundary. GPP encryption with a public fixed AES key is not an independent
      secret-custody boundary. Copying a passphrase-protected key is graded only as encrypted-artifact acquisition; before unlocking, it
      is not plaintext-key acquisition or usable key control. Legitimate backup, troubleshooting, builds, and approved secret scanning produce
      similar reads and require checks of reader duty, classification, job scope, and actual recipient.
  - zh: NJT-0147 拥有受管理保管库或解锁边界读取，NJT-0177 拥有 SAM、NTDS、LSA 等 OS 认证材料提取；即使底层都是文件或注册表也不改归本对象。正常 Secrets Manager GetSecretValue 与受授权的 Kubernetes
      Secret 读取不是本对象的充分证据；其保管边界应先按 NJT-0147 审查。相反，从导出的普通清单、明文 Pod 配置或日志副本中取回已暴露值，可以独立证明本读取路径。
    en: NJT-0147 owns managed-custody or unlock-boundary retrieval, and NJT-0177 owns extraction of OS authentication material such as SAM,
      NTDS, or LSA secrets, even when implemented as files or registry data. Ordinary Secrets Manager GetSecretValue and authorized Kubernetes
      Secret reads are insufficient evidence here and first require review under NJT-0147. Retrieval from an exported ordinary manifest,
      plaintext Pod configuration, or log copy can independently establish this path.
  - zh: 应用令牌、认证证书私钥、Web Cookie 与 Kerberos 票据有各自材料语义，分别对照 NJT-0178、NJT-0227、T1539 和 T1558。同一证据可以支持秘密暴露路径和特定材料取得，但只有文件名或后继登录不能支持双重标注。输入截获归
      NJT-0169，候选反复离线验证归 NJT-0137，材料呈现与身份接受分别属于 T1550 和 NJT-0061；元数据返回正常工作负载凭据不自动说明任何未保护边界已经被跨越。
    en: Application tokens, authentication-certificate keys, Web cookies, and Kerberos tickets have distinct material semantics reviewed
      under NJT-0178, NJT-0227, T1539, and T1558. The same evidence can establish an exposure path and material acquisition, but filenames
      or later sign-ins cannot support both. Input interception belongs to NJT-0169, repeated offline candidate verification to NJT-0137,
      and material presentation and identity acceptance to T1550 and NJT-0061. Normal delivery of workload credentials by metadata does not
      itself establish an unprotected boundary crossing.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在开发、部署和管理环境中，口令可能留在运行配置、自动登录值或旧 GPP XML。攻击者已有普通用户、服务或共享读取能力时，可以在不请求认证服务导出的情况下读取秘密。认证用途和内容须由配置结构、受限证据检查或密钥解析确认，不能因目录常见而省略材料判断。
      en: Development, deployment, and administration environments may retain passwords in active configuration, autologon values, or legacy
        GPP XML. An adversary with ordinary user, service, or share access can read them without asking an authentication service to export
        secrets. Configuration structure, restricted evidence inspection, or key parsing must establish authentication purpose and content;
        a familiar directory is insufficient.
    - zh: 历史与协作环境还可形成不同于运行配置的次生取得路径。微软在 2024 年披露攻击者从外传邮件中发现不同秘密并尝试使用，其中一部分曾由客户与微软通过邮件共享。该事件支持协作记录中的秘密再取得，不说明每一种秘密的格式、有效性、具体搜索命令或原保管库状态。
      en: History and collaboration can create secondary acquisition paths distinct from active configuration. Microsoft's 2024 disclosure
        describes an actor finding and attempting to use different secrets in exfiltrated email, some previously shared between customers
        and Microsoft. It supports recovery from collaboration records without identifying every secret's format, validity, search command,
        or original vault state.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能读取至少一个具体承载面，或控制能把含秘密响应交给自己的请求。所需权限由该承载面的 ACL、共享范围、应用 scope 或接口访问约束决定，既不统一要求管理员，也不假定匿名可达。攻击者可选择读取现行配置、历史记录或旧版本，但不能只凭这种选择假定已取得有效身份；不含完整值的响应、受独立口令保护的密钥和接收者绑定都会限制结果。
        en: The adversary needs read access to a concrete carrier or control of a request returning secret-bearing content to a controlled
          recipient. Its ACL, sharing scope, application scope, or interface policy determines required authority; neither administrator
          access nor anonymous reachability is assumed. The adversary can choose current configuration, history, or an earlier version, but
          that choice alone does not establish a usable identity. Incomplete responses, independent key passphrases, and recipient binding
          limit results.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有对象审计、进程与登录事件、仓库和 Kubernetes API 日志，以及受限的秘密暴露扫描结果。Windows 4663 在相应 SACL 和审计策略生效时可记录实际使用的读取权、对象和进程；Sysmon 注册表修改事件不提供等价读取覆盖。仓库
          clone 事件不枚举秘密文件，Kubernetes Metadata 级别不含响应正文，因此都需要承载面清单与结果分级。
        en: Defenders may have object audit, process and logon events, repository and Kubernetes API logs, and restricted exposure-scanner
          findings. With the required SACL and audit policy, Windows 4663 records exercised read rights, objects, and processes; Sysmon registry-modification
          events do not provide equivalent read coverage. Repository clone events do not enumerate secret files, and Kubernetes Metadata
          audit omits response bodies, requiring carrier inventories and graded outcomes.
      - zh: 关键盲区是原秘密保管面与普通内容面不共享对象身份、版本和读者关系，或读取发生于无传感器的本地副本。授权作业和攻击者可能使用相同身份，因此观察模型还要保留批准范围、接收进程和数据去向。若日志只证明访问或对象下载，防守方应保留候选状态，不把未见后继使用解释成没有暴露。
        en: A critical gap occurs when the original custodian and ordinary content surface do not share object identity, version, and reader
          relationships, or reading occurs in an uninstrumented local copy. Approved work and adversary activity can use the same identity,
          so visibility also needs approved scope, recipient process, and destination. If logs establish only access or an object download,
          retain a candidate outcome; absence of later use does not establish absence of exposure.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 选择已含秘密的普通读取面使取得可能落在凭据专用审计之外
    en: Select an ordinary secret-bearing read surface outside credential-specific audit
  analysis:
    paragraphs:
    - zh: 攻击者直接读取可恢复口令或秘密副本，使本应被秘密服务审计描述的取得变为一般内容读取。痕迹转移到对象、版本、消息或工作负载接口；若防守方只看解锁、导出或认证失败，就缺少识别此次秘密取得的事件语义。GPP、历史文件和协作邮件证据支持这些读取面存在；由其推导的条件性审计缺口为中等置信度，不等于来源测量了规避率。
      en: Reading a recoverable password or secret copy turns acquisition that secret-service audit might describe into a general content
        read. Evidence moves to an object, version, message, or workload interface. A defender observing only unlocks, exports, or authentication
        failures lacks the semantics to identify this acquisition. GPP, history-file, and collaboration-email evidence establishes those
        surfaces; the conditional audit gap inferred from them has medium confidence and is not a measured evasion rate.
  evidence_refs:
  - REF-001192
  - REF-001195
  - REF-001194
  - REF-000379
  - REF-000211
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术以取得对象的记录角色划分一项次生副本秘密取回：秘密必须存在于能够证明由先前操作、沟通或复制链形成的记录，而不是当前作为正式秘密供给面的唯一运行配置。交互历史、明确转发或共享的消息、已移除秘密的历史版本与可核对原对象的备份可以提供这种证据。记录位于何种产品或文件格式中不决定子技术身份。
      en: One child, Secondary-Copy Secret Retrieval, is partitioned by the acquired object's record role. The secret must reside in a record
        demonstrably produced by an earlier operation, communication, or copy chain, rather than merely in the current operational configuration
        acting as the secret-supply surface. Interactive history, demonstrably forwarded or shared messages, an earlier version whose secret
        was removed, and backups linked to an original object can establish this role. Product and file format do not determine child identity.
    - zh: 现行明文配置、公开常量可逆保护和缺少读取审计仍由父级描述；权限低或业务名称正常并不构成另一匿迹变量。自动交付接口只有证明不当接收者获得秘密时才属于本对象，应用令牌返回还需与相应材料技术分别举证。承载面的差异决定数据来源与控制措施，不因差异数量多就要求更多子项。
      en: Current plaintext configuration, protection reversible with a public constant, and missing read audit remain within the parent
        scope. Low privilege or a familiar business name is not another stealth variable. Automatic delivery belongs here only when an inappropriate
        recipient receives secrets, with application-token returns additionally requiring independent material evidence. Carrier differences
        determine telemetry and controls without requiring more children merely because there are many carriers.
  coverage: established
  subtechnique_refs:
