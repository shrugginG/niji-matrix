schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0230-001
parent_ref: NJT-0230
name:
  zh: 可信客户端会话 Cookie 代取
  en: Trusted-Client Session Cookie Retrieval
summary:
  zh: 攻击者使持有会话的原可信客户端通过其 Cookie 服务返回完整值，将外部提取转为客户端内部读取和受控返回。
  en: An adversary makes the original trusted session client return complete values through its cookie facilities, converting external extraction
    into client-internal reads and controlled returns.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 可信客户端会话 Cookie 代取是攻击者控制浏览器内代码、具备适当权限的扩展或调试调用，使原本合法持有 Cookie 的客户端负责读取并返回完整值。关键变量是材料处理由有权访问正常会话的原客户端执行，攻击者控制调用或接收面；不是浏览器产品、某条调试命令或文件所在位置。
    en: Trusted-Client Session Cookie Retrieval controls in-browser code, an appropriately permitted extension, or debugger calls so the
      client legitimately holding cookies reads and returns complete values. The defining variable is execution of material handling by the
      original client authorized for the normal session, with the adversary controlling the request or recipient, rather than a browser product,
      particular debugger command, or file location.
  - zh: 这一路径可以让浏览器照常解密或从活动 Cookie 服务取值，攻击者不必先在独立进程实现每一层解密。客户端须实际返回值，且接收者须受控；只开启调试端口、取得扩展 cookies 权限、注入成功或列出 Cookie 名称都只是前提。使用伪装程序单独解密密钥，或外进程直接读取浏览器内存，不因目标是浏览器而成为代取。
    en: The browser may perform its normal decryption or read active cookie services, avoiding an independent decryptor implementing every
      layer first. The client must actually return values to a controlled recipient. A debugger port, extension cookies permission, successful
      injection, or cookie-name inventory is only a prerequisite. A disguised standalone key decryptor or foreign-process memory read is
      not trusted-client retrieval merely because it targets a browser.
stealth_characteristics:
  paragraphs:
  - zh: 可信客户端会话 Cookie 代取把关键材料读取保留在正常浏览器进程中，外部观察可能只看到调试、扩展通信或一个本地控制连接。若规则只警戒其他进程读 Cookie 数据库或调用解密函数，就可能漏掉由浏览器自身完成的读取；客户端签名、正常文件访问和已有登录不能替接收者授权背书。
    en: Trusted-Client Session Cookie Retrieval keeps the critical material read within a normal browser process, while external visibility
      may show only debugging, extension communication, or a local control connection. Rules focused on another process reading the cookie
      database or calling a decryptor may miss browser-performed reads; client signatures, normal file access, and an existing login do not
      authorize the recipient.
  - zh: 代取仍留下控制面痕迹，且版本条件十分重要。Google 限制 Chrome 136 起通过开关调试默认数据目录，因此带新目录的普通启动不等于能读取旧会话。作者在活动进程启用调试的实验说明另一路径能力，却需要额外进程控制，不能据此声称所有新版、所有配置可直接提取。额外访问、端口、进程访问和输出都是剩余观察点。
    en: Retrieval still leaves control-plane residue, with important version conditions. Google's Chrome 136 change restricts switch-based
      debugging of the default data directory, so ordinary startup with a new directory does not imply access to old sessions. An author's
      experiment enabling debugging inside a live process demonstrates another capability requiring additional process control, not direct
      extraction on every new version or configuration. Extra access, ports, process access, and output remain observable.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需同时证明原客户端处理既有会话材料、攻击者控制调用或收件者，以及完整 Cookie 值实际返回。扩展 Cookie API 与浏览器调试接口是实现实例，可共享这个边界；网页 document.cookie 仅在其确实读取可访问的会话值时纳入，不推定可读
      HttpOnly。外部内存扫描、直接数据库解密和取得但未使用的 ABE 键只在父级或相邻取用技术中评价。
    en: Inclusion requires the original client handling established session material, adversary control of a request or recipient, and actual
      return of complete cookie values. Extension-cookie APIs and browser debugger interfaces are implementations sharing this boundary;
      document.cookie applies only when it actually reads an accessible session value, without presuming HttpOnly visibility. External memory
      scanning, direct database decryption, and an acquired but unused ABE key are assessed at parent level or under adjacent retrieval techniques.
  - zh: 与 NJT-0145 的区别是取得对象和完成结果：驱动浏览器访问页面、读邮件或借设备身份请求资源没有把 Cookie 返回时，属于会话内内容介入而不是本子项。NJT-0147 的授权或解锁边界被越过可独立并列，但客户端 API 的存在本身不证明保管库越界。批准的开发调试、用户导出和具备相同权限的企业扩展是正常反例，须按发布来源、版本、具体配置和目的核对。
    en: 'The distinction from NJT-0145 is the acquired object and completion result: driving page access, reading mail, or requesting resources
      under the device identity without returning cookies is browser-session content interposition rather than this child. A separately evidenced
      crossing of NJT-0147''s authorization or unlock boundary can coexist, but a client API''s presence does not itself prove a vault crossing.
      Approved debugging, user exports, and enterprise extensions with identical permissions are normal counterexamples requiring provenance,
      version, configuration, and purpose checks.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在受管 Windows 工作站上，攻击者有终端执行或已侵入扩展的能力，但独立进程读取密文受应用绑定阻碍时，可能转向浏览器已有取值功能。目标用户需有相应会话，且调用能触达实际保存它的配置；全新测试配置或空 Cookie 存储没有目标材料。返回后是否转移到其他机器使用，仍是独立阶段。
      en: On a managed Windows workstation, an actor with endpoint execution or a compromised extension may turn to existing browser retrieval
        facilities when application binding obstructs independent ciphertext reads. The user needs the relevant session and the call must
        reach the profile holding it; a fresh test profile or empty cookie store has no target material. Subsequent transfer for use on another
        machine remains a separate stage.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要被允许的扩展与目标 host 权限、可访问的调试端点，或足以改变活动浏览器执行的能力，并须控制材料接收者。应用绑定加密、默认配置的调试限制和普通账户的进程写权限约束会提高前提；不假设单凭网络接近或任何已签名进程即可获取。
        en: The actor needs an extension with permitted target-host access, a reachable debugger endpoint, or authority sufficient to alter
          live browser execution, plus control over the material recipient. Application-bound encryption, default-profile debugger restrictions,
          and limits on ordinary-account process writes raise prerequisites; network proximity or any signed process alone is not assumed
          sufficient.
    defender_model:
      paragraphs:
      - zh: 防守方可见浏览器进程启动参数、版本和配置路径、扩展清单以及部分跨进程或网络事件，但通常没有默认生成的每次 Cookie API 返回审计。只有调试连接与注入迹象时，可证明未批准控制或高风险机会；需要取证返回、受控测试记录或可验证输出才可确认材料控制。服务端同设备会话连续性不填补这个端点证据缺口。
        en: The defender can observe browser startup arguments, version and profile path, extension inventory, and some cross-process or
          network events, but normally lacks a default audit of every cookie-API return. Debugger connections and injection indications establish
          unauthorized control or high-risk opportunity; forensic returns, controlled-test records, or verifiable output are needed to confirm
          material control. Server-side same-device continuity does not fill this endpoint evidence gap.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 内部取值避开外部读取规则
    en: Internal retrieval bypasses external-reader rules
  analysis:
    paragraphs:
    - zh: 攻击者选择由原客户端取值，再把返回交给自己，而不是以另一程序直接读取受保护 Cookie 工件。数据库和正常解密操作可能仍归属于浏览器，防守方若没有控制调用及输出的可见性，就无法从文件访问主体推断非法收件者。匿迹收益来自检测观察面的偏移；调试或进程控制事件存在时仍可发现前提，材料本身的取得必须另证。
      en: The actor selects retrieval by the original client and takes its return instead of having another program directly read protected
        cookie artifacts. Database access and ordinary decryption may remain attributed to the browser; without request-control and output
        visibility, a defender cannot infer an unauthorized recipient from the file-reader identity. The stealth benefit is a shift in the
        detection vantage point. Debugger or process-control events can still reveal prerequisites, while material acquisition requires separate
        evidence.
