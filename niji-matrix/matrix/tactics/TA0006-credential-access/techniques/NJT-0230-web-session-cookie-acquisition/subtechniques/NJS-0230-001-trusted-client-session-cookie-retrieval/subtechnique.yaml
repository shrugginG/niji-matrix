research:
  limitations:
    paragraphs:
    - zh: Google 官方只报告此类攻击增加，未公布逐事件工件和检测率；活动进程实验是作者能力演示，不是受害者案例。因此子项存在与受限观察差有证据，普遍降低告警率或对全部版本有效没有证据。未附加恶意案例以填补这个缺口。
      en: Google reports growth in this attack category without per-incident artifacts or detection rates; the live-process experiment is
        an author's capability demonstration rather than a victim case. Evidence therefore supports existence and a scoped visibility difference,
        not generally reduced alert rates or effectiveness on every version. No malicious case is added to fill that gap.
    - zh: 能在原浏览器上持续操作的攻击者可能无需导出 Cookie 就取得页面内容；那种行为由 NJT-0145 单独建模。可用的 API 返回捕获取决于测试和调查部署，常规端点日志仍只形成疑似链。对原始值的验证须在受限证据环境进行，告警仅保留匹配结论和受控指纹。
      en: An actor persistently operating the original browser may obtain page content without exporting cookies; NJT-0145 models that behavior
        separately. API-return capture depends on test and investigation deployment, while routine endpoint logs may yield only a suspected
        chain. Raw-value verification belongs in a restricted evidence environment; alerts retain only the match conclusion and controlled
        fingerprint.
