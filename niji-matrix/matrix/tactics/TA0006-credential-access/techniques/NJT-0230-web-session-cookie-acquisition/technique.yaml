research:
  limitations:
    paragraphs:
    - zh: 微软调查证明特定活动中的 Cookie 截获和后继使用，不能泛化为所有站点的 MFA 绕过。CookieMiner 是样本行为分析，代码中的复制与上传意图不证明每一受害者上都取得了有效值，更不证明交易所资金被取走。位置与路径的归类也不提供检测准确率或攻击者主观匿迹意图。
      en: 'Microsoft''s investigation establishes interception and subsequent use in a specific campaign, not universal MFA bypass. CookieMiner
        is sample-behavior analysis: copy-and-upload code does not establish valid-value acquisition on every victim, much less exchange-fund
        withdrawal. Location and path classification also provides neither detection accuracy nor evidence of subjective stealth intent.'
    - zh: 设备与发送者约束主要限制后继使用或续期，不保证值无法读取。可信终端持续受控、兼容性回退和既有短期 Cookie 的剩余寿命会改变剩余风险。关联窗口与值指纹设计是工程设计，尚未在目标组织验证；在缺少实际返回工件时应保持疑似取得结论。
      en: Device and sender constraints principally limit later use or renewal rather than guaranteeing unreadable values. Continued control
        of a trusted endpoint, compatibility fallback, and remaining short-lived-cookie validity change residual risk. Correlation windows
        and value fingerprints are engineering designs not yet validated in the target organization; without an actual return artifact, the
        conclusion should remain suspected acquisition.
