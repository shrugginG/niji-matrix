schema_version: 2.0.0
type: technique
id: NJT-0230
name:
  zh: Web 会话 Cookie 取得
  en: Web Session Cookie Acquisition
summary:
  zh: 攻击者取得既有 Web 会话 Cookie，并通过选择读取路径或借可信客户端返回材料，使获取事件与认证及后继资源使用分离。
  en: An adversary obtains existing web session cookies and selects the read path or uses a trusted client's material return to separate
    acquisition from authentication and later resource use.
aliases: []
classification:
  tactic_refs:
  - TA0006
  origin:
    kind: attack-adapted
    source_attack_id: T1539
    source_attack_version: '19.1'
  decision_ref: DEC-TA0006-T1539
definition_and_concept:
  paragraphs:
  - zh: Web 会话 Cookie 取得是攻击者读取或复制一个已由 Web 应用或认证服务形成、用于延续认证状态的 Cookie 值，使完整材料进入其可读、可保存或可传递的进程、文件、扩展或基础设施。直接目的在于掌握现成会话证明，而不是猜出口令或要求签发者再完成一次认证。材料可以来自客户端持久工件、浏览器或其他客户端的运行态，以及实际承载
      Cookie 的请求或响应；位置本身不构成匿迹子项。
    en: Web Session Cookie Acquisition reads or copies a cookie value already established by a web application or authentication service
      to continue authentication, placing complete material in a process, file, extension, or infrastructure the adversary can read, retain,
      or forward. The immediate purpose is control of an existing session proof rather than guessing a password or asking the issuer to complete
      another authentication. Material may come from persisted client artifacts, browser or other client runtime, or an actual cookie-bearing
      request or response; location alone does not define an evasion child.
  - zh: 取得以材料控制为完成点，允许所获 Cookie 已过期、撤销或受设备约束。打开数据库不等于读取值，复制密文不等于恢复解密后的材料，拿到解密键也不证明目标 Cookie 已被恢复。可读值或完整可呈现材料、控制接收者和取得时间构成材料结果；有效期、服务端状态及呈现约束独立决定后续可用性。网页脚本看不到
      HttpOnly 值，不排除其他路径取得材料。
    en: Completion is control of material, including cookies that are expired, revoked, or device-constrained. Opening a database is not
      reading a value, copying ciphertext is not recovering decrypted material, and obtaining a decryption key does not establish recovery
      of the target cookie. Readable values or complete presentable material, a controlled recipient, and acquisition time establish the
      material outcome; lifetime, server state, and presentation constraints independently determine later usability. A web script's inability
      to see HttpOnly values does not exclude acquisition through another path.
stealth_characteristics:
  paragraphs:
  - zh: Web 会话 Cookie 取得可发生在没有新登录的终端读取中，也可随真实认证事务发生。仅保留 IdP 成功与失败登录、MFA 挑战和资源访问的防守方，通常无法据此还原哪个本地进程或传递接收者复制了值。攻击者选择被正常客户端解密后返回的路径，还会把外部解密程序的行为移入浏览器控制面，削弱只查非浏览器数据库读取的规则。
    en: Web Session Cookie Acquisition can occur in endpoint reads without a new sign-in or alongside a genuine authentication transaction.
      A defender retaining only identity-provider successes, failures, MFA challenges, and resource access generally cannot reconstruct which
      local process or transmission recipient copied the value. Selecting a return after the normal client decrypts material also moves behavior
      from an external decryptor into browser control, weakening rules that look only for database reads by non-browser processes.
  - zh: 这些差异不使 Cookie 窃取天然隐蔽。工件读取、跨进程访问、扩展权限变化、调试连接和材料输出仍可观察；应用绑定加密还可能迫使攻击者增加提权或进程内活动。Cookie 的普通网页外观主要影响后继使用的判断，本技术不以“没有再次 MFA”证明取得阶段已经匿迹，也不假定每个取得的值都能在另一个设备上使用。
    en: These differences do not make cookie theft inherently covert. Artifact reads, cross-process access, extension-permission changes,
      debugger connections, and material output remain observable; application-bound encryption may force elevation or in-process activity.
      A cookie's ordinary web appearance mainly affects interpretation of later use. This technique neither treats absence of another MFA
      prompt as evidence of acquisition-stage stealth nor assumes every acquired value works on another device.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需有 Cookie 会话语义、实际值取得及攻击者控制接收者。Cookie 清单、名称、域、过期时间、受掩码日志、解密失败、进程句柄或仅有提取能力均不达到确认层级。CookieMiner 的复制上传代码支持持久工件的取走能力；微软 AiTM 调查支持真实认证流中的
      Cookie 截获。前者不自动证明账户接管成功，后者也不证明所有 MFA、设备或应用策略均可绕过。
    en: Inclusion requires cookie-session semantics, actual value acquisition, and an adversary-controlled recipient. Inventory, names, domains,
      expiry times, masked logs, failed decryption, a process handle, or extraction capability alone do not reach confirmation. CookieMiner's
      copy-and-upload code supports persisted-artifact acquisition capability; Microsoft's AiTM investigation supports cookie interception
      in a genuine authentication flow. The former does not automatically prove account takeover, and the latter does not establish bypass
      of every MFA, device, or application policy.
  - zh: NJT-0178 拥有面向 API 或资源服务器的应用访问与刷新令牌；本技术拥有依 Cookie 语义维持的 Web 会话。同一值具有双重用途时，须分别证明实际投递和依赖方用途。NJT-0147 拥有跨保管库授权或解锁边界的取用路径，证据同时证明该路径与 Cookie
      返回时可以并列；不能仅因 Cookie 被加密或存在内存中就认定它是保管库。NJT-0169 拥有认证输入的截获，NJT-0136 拥有认证通信路径中介；只有各自另有结果证据时，输入、路径与 Cookie 取得才同时成立。
    en: NJT-0178 owns application access and refresh tokens for APIs or resource servers; this technique owns web sessions maintained with
      cookie semantics. A dual-use value requires separate evidence of actual delivery and relying-party purpose. NJT-0147 owns retrieval
      across a vault authorization or unlock boundary and may coexist when evidence establishes both that path and cookie return; encryption
      or memory residence alone does not make a cookie a vault object. NJT-0169 owns authentication-input interception and NJT-0136 authentication-path
      interposition. Input, path, and cookie acquisition coexist only when each has its own result evidence.
  - zh: NJT-0166 拥有离权威新构造材料，T1550 的对应对象拥有已取得材料的呈现，NJT-0061 拥有有效会话被接受后的身份使用。NJT-0145 拥有借浏览器读取页面或代理请求；即使攻击者控制原浏览器并能访问已登录站点，若 Cookie 没有返回其控制面，也不构成本技术。用户导出、批准的开发调试、浏览器迁移、备份与测试均可生成同类读取，须核对批准主体、配置、目标会话与输出用途，而非按浏览器名称排除。
    en: NJT-0166 owns off-authority construction of new material, the corresponding T1550 object owns presentation of acquired material,
      and NJT-0061 owns identity use after acceptance of a valid session. NJT-0145 owns browser-assisted page reading or proxy requests;
      control of the original browser and access to signed-in sites do not establish this technique unless cookie material is returned to
      adversary control. User exports, approved debugging, browser migration, backup, and tests can create similar reads and require review
      of authorization, configuration, target session, and output purpose rather than exclusion by browser name.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在已控制的交互终端发现目标用户仍保持企业邮件、管理门户或其他高价值 Web 会话时，可从现有状态取得材料，供后续独立客户端或控制端选择使用。尚无终端立足点时，攻击者也可能把真实认证事务引至其代理并复制返回 Cookie；在该场景中，初始钓鱼、通信中介与材料取得是不同环节，不能由一项结果补证全部链。
      en: On a compromised interactive endpoint, an adversary may find an established enterprise-mail, administration-portal, or other valuable
        web session and obtain material for possible later use by a separate client or controller. Without an endpoint foothold, the actor
        may instead route a real authentication transaction through a controlled proxy and copy returned cookies. Initial phishing, path
        interposition, and material acquisition are separate stages in that scenario and cannot all be inferred from one outcome.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须能读取含值的工件或运行态、使客户端向受控接收者返回值，或接触实际 Cookie 传递内容；还需识别会话用途和适用域，不能把任意跟踪 Cookie 当作认证证明。所需权限随存储保护、浏览器版本、隔离边界、扩展授权及 TLS 终结位置变化，同用户执行权限并不保证能解开应用绑定密文。
        en: The actor needs access to a value-bearing artifact or runtime, the ability to make a client return values to a controlled recipient,
          or access to actual cookie-transmission content. The actor also needs to identify session purpose and applicable domain rather
          than treating any tracking cookie as authentication proof. Required privilege varies with storage protection, browser version,
          isolation, extension authorization, and TLS termination; same-user execution does not guarantee decryption of application-bound
          ciphertext.
      - zh: 本模型不预设管理员、签名键或设备绑定私钥已被取得。攻击者可能只掌握失效副本，或受限于用户尚未登录、非默认调试配置以及 Cookie 轮换。能操纵浏览器发请求但不能读取完整值时，仍有后继会话控制风险，但不满足这里的材料完成点。
        en: This model does not assume administrator privilege, a signing key, or a device-binding private key. An actor may obtain only
          an obsolete copy or be constrained by absent user login, non-default debugging configuration, and cookie rotation. Browser request
          control without a complete readable value still presents session-control risk but does not meet the material-completion criterion
          here.
    defender_model:
      paragraphs:
      - zh: 防守方可持有受管端点的进程谱系、目标化文件访问与进程访问事件、浏览器版本和扩展配置，并在事件调查中取得受限保存的返回或输出工件。Windows 4663 依赖审计策略和对象 SACL，Sysmon 的文件创建事件不提供普通文件读取语义；进程访问事件也不直接记录被读内存内容。缺失这些观察面时，只有访问机会或风险，不能直接输出“Cookie
          已取得”。
        en: A defender may retain managed-endpoint process lineage, targeted file and process access, browser versions and extension configuration,
          plus restricted response or output artifacts during incident investigation. Windows 4663 depends on audit policy and object SACLs;
          Sysmon file creation does not provide ordinary file-read semantics, and process-access events do not record the memory content
          read. Without these observation planes, evidence establishes opportunity or risk rather than a direct finding that cookies were
          acquired.
      - zh: 应用与 IdP 通常可见认证、会话标识和资源请求，而看不到本地解密后的副本。真实传递流中的 Cookie 内容需要受授权的终结点或调查工件，普通加密流元数据不足。关联应以设备、登录会话、进程开始时间与稳定进程键、浏览器配置及受控值指纹为基础，并明确保留期；原始
          Cookie 不应扩散到一般告警日志。
        en: Applications and identity providers typically observe authentication, session identifiers, and resource requests but not local
          decrypted copies. Cookie content in a real transmission needs an authorized termination point or investigation artifact; encrypted-flow
          metadata is insufficient. Correlation should use device, logon session, process start and stable process key, browser configuration,
          and a controlled value fingerprint with explicit retention. Raw cookies should not be spread into ordinary alert logs.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 取得动作与认证观察面分离
    en: Acquisition separates from authentication visibility
  analysis:
    paragraphs:
    - zh: 攻击者取得既有客户端状态或在真实流中另存返回值，而不是以一个新登录动作直接请求账户入口。其结果是材料副本产生在端点或中介接收面，IdP 登录和应用访问日志未必有相应的“复制”事件。若防守方只关联认证与资源结果，关键取得动作就处于盲区；加入读取、控制接收者及输出证据可缩小该盲区。这是观察条件下的行为透明，未声称所有提取路径都没有端点痕迹。
      en: The actor obtains existing client state or saves a return from a genuine flow rather than directly requesting account entry with
        a new sign-in. The material copy consequently arises at an endpoint or intermediary recipient, without a corresponding copy event
        necessarily appearing in identity-provider or application logs. A defender correlating only authentication and resource outcomes
        misses the acquisition stage; read, recipient-control, and output evidence narrow the gap. This is Behavioral Transparency under
        specified visibility conditions, not a claim that every extraction path lacks endpoint residue.
  evidence_refs:
  - REF-000067
  - REF-001078
  - REF-001207
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术按“由原可信客户端执行 Cookie 读取并向攻击者返回值”这一控制变量建立子项。它改变实际处理受保护材料的主体和输出边界，使防御重点从外部文件或解密程序转为浏览器控制、API 返回与收件者。工件、内存和网络是比较路径，不是自动子项；不按浏览器、系统、Cookie
        格式、扩展或工具名称划分。
      en: The taxonomy distinguishes the control variable in which the original trusted client reads cookies and returns values to the adversary.
        It changes the actor handling protected material and the output boundary, shifting defense from an external file reader or decryptor
        toward browser control, API return, and recipient. Artifacts, memory, and networks are comparison paths rather than automatic children;
        browser, system, cookie format, extension, and tool names do not define partitions.
    - zh: 外进程读取易失态与读取持久副本确有不同传感器需求，但当前材料没有证明二者仅因位置就形成独立匿迹策略，故保留父核心覆盖。真实认证流旁拷贝具有明确材料结果，但路径控制变量由 NJT-0136 及钓鱼入口对象拥有；仅以取得时点重建子项会重复既有分类。材料有效性、HttpOnly
        与设备绑定横跨所有路径，属于约束和结果分级。
      en: Foreign-process runtime reads and persisted-copy reads need different sensors, but the evidence does not establish a separate stealth
        strategy from location alone, so both remain parent core. Side copying in a genuine authentication flow has a clear material result,
        while path control belongs to NJT-0136 and phishing-entry objects; creating a child from acquisition timing alone would duplicate
        that taxonomy. Usability, HttpOnly, and device binding cut across paths as constraints and outcome grades.
  coverage: established
  subtechnique_refs:
  - NJS-0230-001
