rationale_zh: '保留系统服务发现，因为固定19.1同时纳入服务库存和计划任务、cron库存，直接目的都是从已有运行管理登记中取得环境事实。Elastic对GOSAR的原始分析独立记录Win32_Service查询与schtasks查询能力，并把start/stop列为另一个命令；官方管理接口也将读取和变更权限分开。这足以支持父行为与边界，不能把每个被启动的命令都视为成功获得清单。


  一个原生子项按查询任务承载位置成立：固定TrustedSec集成入口明确把具体服务查询交给既有Beacon内执行，源码连接服务API与返回格式，官方BOF文档解释省去每任务执行器的观察差。此处依据是可复核工具能力和条件化因果推断，未找到同层级野外采用或实测检测率；原生工具与常规维护的外观相似另作为父级次要机理。'
rationale_en: 'Retain System Service Discovery because the fixed 19.1 scope includes service inventories together with scheduled-task
  and cron inventories, whose immediate purpose is to obtain environment facts from existing execution-management registrations.
  Elastic''s original GOSAR analysis independently records Win32_Service and schtasks inquiry capabilities while listing start/stop
  as a separate command. Official management interfaces likewise distinguish read and mutation authority. This supports the
  parent behavior and boundary without treating every launched command as a successfully acquired inventory.


  One native child is supported by inquiry-task carriage. Pinned TrustedSec integration explicitly executes the particular
  service inquiry inside an existing Beacon, implementation code connects service APIs with output formatting, and official
  BOF documentation explains the observation difference from per-task executors. This rests on inspectable tool capability
  and conditional causal inference, without equivalent field-adoption or measured-detection evidence. Similarity to ordinary
  maintenance utilities is a separate secondary parent mechanism.'
scope_notes_zh: 包含服务注册、状态和可读配置以及Windows任务、Linux/macOS cron库存；不把服务启动、停止、修改、删除或任务执行、持久化建设置为读取。直接调查driver注册或实例归既有NJT-0180；SCM载体不改变直接对象，type=all按实际条目与消费目的分开，driver登记也不证明已加载。tasklist
  /svc的服务映射与普通进程列表分开。子项只证明具体服务查询，不自动覆盖scheduler读取或WMI客户端方式。
scope_notes_en: Include service registration, status, readable configuration, Windows task inventory, and Linux/macOS cron
  inventory. Do not turn service start, stop, modification, deletion, task execution, or persistence construction into reads.
  Direct inquiries into driver registrations or instances belong to existing NJT-0180. SCM carriage does not change the direct
  object; separate type=all by actual entries and consumption purpose, without treating driver registration as loaded state.
  Separate tasklist /svc service mappings from ordinary process lists. The child establishes a particular service inquiry
  and does not automatically cover scheduler reads or WMI client carriage.
