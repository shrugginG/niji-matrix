  name_en: Application Window Discovery
  name_zh: 应用窗口发现
decision: retain
rationale_zh: T1010 直接读取开放窗口、标题与前台状态，ESET 对 Grandoreiro 的分析证明银行相关窗口匹配控制后继 C2 启动，Attor 分析证明标题也可参与定向截图选择。该父行为有明确 Discovery 价值，并可产生有条件的后继痕迹变化，故保留父语义；匿迹收益只按已观察条件链与明确推断表达，不声称窗口
  API 天然不可见。
rationale_en: T1010 directly reads open windows, titles, and foreground state. ESET’s Grandoreiro analysis establishes that
  a bank-related window match controls later C2 initiation, and its Attor analysis shows title participation in targeted capture.
  The parent therefore has clear Discovery value and can yield conditional follow-on trace changes, justifying retention of
  its semantics. Stealth benefit is limited to the observed condition chain and marked inference, not a claim that GUI APIs
  are inherently invisible.
scope_notes_zh: 正式 Niji 子项按窗口上下文是否控制后继活动显现划分，不按窗口类型、标题内容或 API 名称拆分。进程清单、安装软件、沙箱判断及后继截图/C2 分别保留其他技术的直接行为归属。
scope_notes_en: The formal Niji child is divided by whether window context controls manifestation of later activity, not by
  window type, title content, or API name. Process inventories, installed software, sandbox judgments, and later capture or
  C2 retain the direct-behavior ownership of their other techniques.
