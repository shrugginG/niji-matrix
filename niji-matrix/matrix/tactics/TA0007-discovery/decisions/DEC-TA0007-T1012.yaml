  name_en: Query Registry
  name_zh: 注册表查询
decision: adapt
rationale_zh: 保留固定 Enterprise 19.1 T1012 的注册表信息读取行为，并将正式范围收敛为一般环境配置探索及尚未确定专门信息结果的查询尝试。原基线也用软件等具体信息举例；这些结果在 Niji 中按直接目的由各自发现技术承担，不能因同样使用
  Registry 再建立一个父级结果。联合公告证明 reg query 的实际使用，ESET 另证明一般键、值和数据枚举能力，官方文档界定读取与结果语义，因此采用 adapt 明确分流而不否定原行为。
rationale_en: Preserve Registry information reads from fixed Enterprise 19.1 T1012 while converging formal scope on general
  environmental-configuration exploration and query attempts whose specialized information result remains unresolved. The
  baseline also illustrates specific information such as software; Niji assigns those results to their direct-purpose discovery
  owners rather than creating a second parent result merely because Registry access is used. The joint advisory establishes
  actual reg query use, ESET independently establishes general key, value, and data enumeration, and official documentation
  defines read and result semantics. Adapt makes this routing explicit without rejecting the original behavior.
scope_notes_zh: 纳入查找键、枚举子键或值、读取配置数据以了解环境。密码及组策略、账户与组关系、存储属性、运行进程和已安装软件的专门调查优先归各自对象；读取只是这些对象的实现细节时不另造 Registry 案例。注册表写入、访问恢复所需持久状态及
  consumer 结果、有效防御设置削弱、secret 或凭据 hive 提取分别分属修改、NJT-0094、NJT-0162 或凭据访问，不能由 reg query、reg save 或同一路径互相替代。
scope_notes_en: Include locating keys, enumerating subkeys or values, and reading configuration data to understand the environment.
  Dedicated investigations of password or Group Policy, account and group relationships, storage attributes, running processes,
  and installed software belong first to their respective information objects. Do not add a Registry case when reading is
  only their implementation detail. Registry mutation, durable state and consumer results needed to restore access, effective
  weakening of defensive settings, and secret or credential-hive extraction belong respectively to modification, NJT-0094,
  NJT-0162, or credential access. These meanings cannot substitute for one another merely because they use reg query, reg
  save, or the same path.
