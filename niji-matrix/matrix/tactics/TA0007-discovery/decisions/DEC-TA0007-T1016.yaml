rationale_zh: '保留 T1016 的直接信息对象，即已访问系统的接口、IP 与 MAC 配置、路由、接入条件、连接能力及无线网络配置。AA24-038A 的观测命令表明确包含 ipconfig，ESET 恢复的 LunarWeb
  命令包包含网络配置侦察，Binary Defense 的原始样本分析记录了对无线接口和可用网络的枚举。上述行为支持环境测绘父级；Microsoft 对 Volt Typhoon 的调查另提供有意借用就地取材外观维持隐蔽的动机证据，支持中等置信度的特征伪装解释。


  Metador 原始报告另把明确 GetAdaptersInfo 查询、既有内存植入体命令分发和结果 packet 回传连接起来，为驻留内联网络配置调查提供独立的能力层证据。该新证据使承载轴达到正式子项建议门槛；仍不把实现能力当成每次现场成功取数。'
rationale_en: 'Retain T1016''s direct information object of interfaces, IP and MAC configuration, routes, access conditions,
  connectivity, and wireless configuration on accessed systems. The observed-command table in AA24-038A explicitly includes
  ipconfig, ESET''s recovered LunarWeb command package includes network-configuration reconnaissance, and Binary Defense''s
  original sample analysis records wireless-interface and available-network enumeration. These behaviors support the Discovery
  parent. Microsoft''s Volt Typhoon investigation separately supplies evidence of an intent to maintain stealth through living-off-the-land
  appearance, supporting a medium-confidence Feature Disguise interpretation.


  The original Metador report additionally connects a specific GetAdaptersInfo query, existing in-memory implant command dispatch,
  and return of a result packet, providing independent capability-level evidence for Resident Inline Network-Configuration
  Survey. This evidence meets the proposal gate for the carrier axis without treating implementation capability as successful
  acquisition on every field execution.'
scope_notes_zh: 网络配置事实不等于已发现远端主机、远端服务、当前连接或无线密码，连通性检查仅支持所测对象、协议与时刻。固定 ATT&CK 子项只作覆盖参考；唯一建议子项按有正面实现证据的任务承载变量划分。Metador 同一命令的适配器、TCP
  与邻居表结果按直接对象分流，共用能力案例而不重复虚构现场事件。
scope_notes_en: Configuration facts do not establish remote hosts, remote services, current connections, or wireless passwords,
  and connectivity checks support only the tested object, protocol, and time. Fixed ATT&CK children are coverage references
  only. The sole proposed child follows a task-carriage variable with positive implementation evidence. Adapter, TCP, and
  neighbor results from the same Metador command are separated by direct object while sharing one capability case rather than
  fabricated field events.
