  name_zh: 远程系统发现
  name_en: Remote System Discovery
decision: retain
rationale_zh: 保留 T1018 的直接信息对象，即在已访问环境取得其他系统的名称、地址或逻辑标识。其范围既包括主动确认，也包括读取既存的远端系统记录。Kinsing 原始分析记录了从本地配置和历史记录提取候选且未发现额外主动扫描；HermeticWizard
  原始分析把读取已知 IP 与后续连接验证分开。它们使不依赖新鲜存活探测的发现路径具有具体恶意采用证据，也使只看网络扫描的观察模型存在可解释缺口，因而无需把父技术重写为其他信息对象。
rationale_en: 'Retain T1018''s direct information object: names, addresses, or logical identifiers of other systems within
  an accessed environment. This encompasses active confirmation and reading preexisting remote-system records. The original
  Kinsing analysis records candidate extraction from local configuration and history without identified additional active
  scanning. The original HermeticWizard analysis separates gathering known IP addresses from subsequent connection validation.
  These provide concrete evidence of adversarial discovery without fresh liveness probes and explain a gap in scan-only observation,
  without rewriting the parent around a different information object.'
scope_notes_zh: 记录、当前可达性、监听服务和横向访问是不同结论。保留父项不表示每次运行 ping、读取 ARP 表或查询目录都具有匿迹目的；正文仅将经证据支持的痕迹变化映射为机理。读取本机地址配置和连接状态仍分别属于 T1016
  与 T1049；从这些材料提取远端系统标识才是这里讨论的直接成果。
scope_notes_en: A record, current reachability, listening services, and lateral access are different conclusions. Retention
  does not mean every ping, ARP-table read, or directory query has stealth intent; only supported trace changes receive mechanism
  mappings. Local address configuration and connection state remain T1016 and T1049 respectively. Extracted identifiers of
  other systems are the direct result considered here.
