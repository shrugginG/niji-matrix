    quality, bundle, and bilingual Web gates pass; retain review pending human domain approval.
rationale_zh: '固定19.1基线以特定系统的当前、主要或常用用户及活动状态为直接信息目标，足以与取得账户总体清单区分。联合公告明确记录Volt Typhoon使用whoami，ESET恢复的LunarWeb命令包包含用户信息调查，支持本行为在入侵后的实际相关性。保留父语义，不把“用户”重新定义成恶意进程的真实人类操作者，也不把凭据获取或分析环境门控并入身份读取。


  原生分类独立收敛为一项驻留上下文内联身份查询。其能力证据是固定源码中的身份读取、明确的内联任务入口与官方的每任务创建和注入足迹对照，而不是API名称或缺少创建日志。其他身份来源、轮询、过滤和用户活动分支已经检查，尚不足以形成额外稳定子项；具体查询的恶意采用和规避收益不从工具能力反推。'
rationale_en: 'The fixed 19.1 baseline directly concerns current, primary, or frequent users and activity context of a particular
  system, distinguishable from an account inventory. The joint advisory explicitly records Volt Typhoon using whoami, and
  ESET recovered a LunarWeb command package containing user-information inquiries, establishing post-compromise relevance.
  Retain the parent semantics without redefining a user as the actual human controlling a malicious process or folding credential
  acquisition and analysis-environment gating into identity reads.


  The independent native taxonomy converges on one child, Resident-Context Inline Identity Inquiry. Capability evidence joins
  identity-reading code, an explicit inline task entry, and the official comparison with per-task creation and injection footprints,
  rather than an API name or missing creation logs. Other identity sources, polling, filtering, and activity-dependent branches
  were examined without establishing additional stable children. Tool capability does not retrospectively establish malicious
  adoption or evasion benefit for a particular inquiry.'
scope_notes_zh: 有效令牌主体、进程真实UID、登录会话用户、进程环境自报和文件或进程owner保留各自来源与时点。账户或组集合、凭据、运行进程存在性与分析条件化后继动作分别交给相邻对象；同一复合命令可依据实际消费字段共同映射。平台范围保留Windows、Linux、macOS与网络设备，当前检测实现只承诺明确声明的Windows观察面。
scope_notes_en: Preserve provenance and time separately for effective-token principals, process real UIDs, logon-session users,
  process-environment assertions, and file or process ownership. Account or group sets, credentials, running-process existence,
  and analysis-conditioned successor actions retain their adjacent owners; a composite command can co-map according to consumed
  fields. Parent scope retains Windows, Linux, macOS, and network devices, while current detection implementations claim only
  their explicitly declared Windows observation surfaces.
