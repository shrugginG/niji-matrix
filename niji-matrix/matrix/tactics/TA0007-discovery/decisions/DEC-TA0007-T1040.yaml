decision: adapt
rationale_zh: 保留 T1040 在环境测绘中的被动观察核心，将正式对象限定为从实际可见的既有报文取得主机、地址、通信关系或服务线索。该对象的区别在于信息从未向目标发起测绘请求的观察面返回，目标侧成功认证和请求日志不必增加测绘事务。ATT&CK
  Enterprise 19.1 工作簿与 NIST 的被动发现说明支持父级相关性，操作系统和设备文档支持可实施观察面，但没有公开量化本对象的告警下降幅度。 建议单独建对象，而非给 NJT-0176 增加战术标签。NJT-0176 及其三个子项明确要求认证材料结果，并将纯主机、端口、服务和拓扑信息导向
  Discovery；其材料评估、凭据恢复和轮换门禁应保持原义。本对象则要求说明事实来自哪个报文或解析结果，不要求得到任何凭据。相同抓包若独立证明两种结果可同时标注，不能以其中一种结果代替另一种。
rationale_en: Preserve T1040's passive-observation core within Discovery and bound the formal object to host, address, communication-relationship,
  or service clues derived from packets actually visible at an observation point. Its distinction is that information returns
  through an observation surface without directing a discovery request to the target, so target authentication and request
  logs need not contain an additional mapping transaction. The ATT&CK Enterprise 19.1 workbook and NIST's treatment of passive
  discovery support parent relevance, while operating-system and device documentation establish implementable observation
  surfaces. Public evidence does not quantify alert reduction for this object. Create a separately bounded object rather than
  adding a tactic tag to NJT-0176. NJT-0176 and its three children explicitly require an authentication-material outcome and
  route host, port, service, and topology information to Discovery; their material-assessment, recovery, and rotation gates
  should retain their meanings. This object instead requires provenance for facts in packets or parsed results and does not
  require credentials. A capture can carry both labels when each outcome is independently supported, but one outcome cannot
  substitute for the other.
scope_notes_zh: 主动修改名称、网关、路由或代理以改变服务指向的行为由 NJT-0136 承接，诱使受害者新产生认证交换由 NJT-0165 承接；后续独立的被动观察结果可另行记录。认证材料获取归 NJT-0176，普通正文获取归相关
  Collection 对象。单一事件中的地址事实、可恢复凭据、正文和后续账户使用必须分别举证。合法诊断、NDR、事件响应和容量分析使用同样采集能力，需按主体、用途、源范围、输出目的地、期限及批准记录区分。
scope_notes_en: Active changes to names, gateways, routes, or proxies that replace service direction belong to NJT-0136, and
  inducing a victim to emit a new authentication exchange belongs to NJT-0165; a separately supported passive-observation
  result can also be recorded. Authentication-material acquisition belongs to NJT-0176, and ordinary content acquisition to
  the applicable Collection object. Address facts, recoverable credentials, content, and later account use in the same event
  each require their own evidence. Authorized diagnostics, NDR, incident response, and capacity analysis use the same acquisition
  capabilities and require distinction by principal, purpose, source scope, destination, duration, and approval.
