  name_en: Network Service Discovery
  name_zh: 网络服务发现
decision: retain
rationale_zh: 保留 T1046 的父级语义：攻击者在已经访问的网络、主机或工作负载环境内取得远端可用服务的候选、地址与协议信息，为后继访问选择目标。固定基线同时纳入端口或协议探测与 Bonjour 服务浏览，因此正式范围不能缩成端口扫描。Jaron
  Bradley 的一手 macOS 入侵记录直接提供攻击者使用服务公告查询的例子，Unit 42 的 Hildegard 调查独立提供受侵容器发起内部 kubelet 搜索的例子。 这不是仅因 ATT&CK 编号或战术不同而新增重复父项。NJT-0001
  明确以取得内部访问前的主动侦察为边界，并排除入侵后的内部网络发现。当前候选的前提是既有内部立足点，其信息对象是远端服务候选，防守方需要连接端点或工作负载身份、东西向流与服务公告观察。它也不等同于 NJT-0179 的 Pod 与容器运行资源、NJT-0139
  的云资源关系或 NJT-0140 的云服务启用与防护状态。
rationale_en: 'Retain T1046''s parent meaning: an adversary in an accessed network, host, or workload environment obtains
  candidate remote services, endpoints, and protocol information to select later access targets. The fixed baseline includes
  both port or protocol probing and Bonjour browsing, so the formal scope cannot collapse to port scanning. Jaron Bradley''s
  firsthand macOS intrusion account directly establishes adversarial service-advertisement queries, while Unit 42''s Hildegard
  investigation independently establishes internal kubelet searches from a compromised container. This does not add a duplicate
  parent merely because the ATT&CK ID or tactic differs. NJT-0001 explicitly concerns active reconnaissance before internal
  access and excludes post-compromise internal-network discovery. This candidate assumes an existing internal foothold, seeks
  remote-service candidates, and requires defenders to join endpoint or workload identity, east-west flows, and service-advertisement
  observations. It also differs from NJT-0179''s running Pod and container resources, NJT-0139''s cloud-resource relationships,
  and NJT-0140''s cloud-service enablement or protective state.'
scope_notes_zh: 取得内部访问前的外部主动探测归 NJT-0001；只确认远端主机存在不等同于服务发现。共享资源名称及列表归网络共享发现，实际文件读取归收集；被动捕获既有流量归网络嗅探。云资源拓扑、提供方服务启用状态和容器运行资源分别保留已有父项；读取本机
  Windows 服务清单本身也不证明远端网络监听服务。后继认证、执行、漏洞利用和捕获内容另行评价，不能用后继成功倒填本次发现的完整结果。
scope_notes_en: Pre-access external probing belongs to NJT-0001, while merely identifying a remote host does not establish
  service discovery. Shared-resource names and inventories belong to Network Share Discovery, actual file reads to collection,
  and passive capture of existing traffic to Network Sniffing. Cloud-resource topology, provider-service enablement, and running
  container resources retain their existing parents. A local Windows-service inventory alone also does not establish remote
  network listeners. Evaluate later authentication, execution, exploitation, and captured content separately rather than backfilling
  a complete discovery result from later success.
