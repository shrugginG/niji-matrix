rationale_zh: 保留 T1049 在已访问系统或获准管理入口读取现存网络端点和会话关系的直接信息对象。联合 Volt Typhoon 公告附录记录 netstat -ano，SentinelLabs 对 Mafalda 命令 63
  的原始分析记录进程内 GetExtendedTcpTable 查询及对应结果传输。这些证据支持普通诊断外观与独立工具任务边界两种观察问题，足以保留父项并研究一项原生子技术；不需要把接口配置、远端主机清单或云资源图改名纳入。
rationale_en: Retain T1049's direct information object of existing network-endpoint and session relationships read through
  an accessed system or authorized management entry. The joint Volt Typhoon advisory records netstat -ano in its appendix,
  and SentinelLabs' original analysis of Mafalda command 63 records an in-process GetExtendedTcpTable query and corresponding
  result transmission. These sources support two observation problems, ordinary diagnostic appearance and the separate utility-task
  boundary, sufficient to retain the parent and propose one native child without relabeling interface configuration, remote-host
  inventories, or cloud-resource graphs.
scope_notes_zh: 查询请求、成功返回、非空连接表、ESTABLISHED 状态、实际业务数据交付和对端当前存活是不同结论。连接表包含监听和过渡状态，历史会话记录也可能过期；本候选保留这些状态差异。进程内子项要求本次连接调查由既有执行载体中的查询代码承载，不能从静态导入、未见
  netstat 事件或普通程序最终调用 API 推断成立。
scope_notes_en: A query request, successful return, nonempty table, ESTABLISHED state, application-data delivery, and current
  peer liveness are different conclusions. Tables contain listeners and transitional states, and historical sessions may be
  stale; this candidate preserves those distinctions. The in-process child requires a particular connection inquiry to be
  carried by query code inside an executing carrier, and cannot be inferred from static imports, missing netstat events, or
  the fact that ordinary programs eventually call APIs.
