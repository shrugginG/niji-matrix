  name_en: Process Discovery
  name_zh: 进程发现
decision: retain
rationale_zh: 保留T1057以运行进程事实为直接信息对象的发现语义。固定基线覆盖命令、系统接口、procfs、ESXi与网络设备，独立一手事件确认恶意采用；无需把注入、终止或安全规避后果写进父定义。正式原生子项来自额外能力与设计证据，并不由ATT&CK无子项或工具名称决定。
rationale_en: Retain T1057’s discovery semantics with running-process facts as its immediate information object. The fixed
  baseline covers commands, system interfaces, procfs, ESXi, and network devices, while independent primary incidents establish
  adversarial use. Injection, termination, and security-evasion consequences need not enter the parent definition. The native
  child derives from additional capability and design evidence rather than ATT&CK’s empty child inventory or tool names.
scope_notes_zh: 纳入直接询问或读取运行进程存在性与属性的行为，包括本机或获授权远程视图中的进程清单、特定进程定位以及对返回实例的详情查询。解释结果时保留目标主机、会话或命名空间、查询时间、字段权限与结果完整性；快照反映采集时刻而不是永久状态，PID和同名映像都不能独立充当跨生命周期身份。
  仅查安装软件、窗口标题或焦点、驱动包及加载驱动分别归相邻发现技术；进程清单可能提供它们的线索，但不能取代相应事实。打开句柄或具备QUERY、VM_READ、TERMINATE权限不证明读取详情、提取凭据、注入或终止已经发生。根据进程名判断分析环境并停用载荷、破坏安全进程或执行凭据转储，需要分别证明环境条件化规避、安全削弱、影响或凭据访问动作。
  驻留查询的子项只描述本次进程调查的任务承载选择，不承接建立驻留体、反射加载、跨进程嵌入或非标准API过渡本身的结论。合法监控、EDR、桌面管理、任务管理器和应用健康检查可以进行同形查询；过滤返回行、减少显示列或选用熟悉工具也不能单独证明匿迹设计。
scope_notes_en: Include direct inquiries or reads about process existence and properties, including local or authorized remote
  inventories, locating a particular process, and detail queries on returned instances. Preserve host, session or namespace,
  query time, field permissions, and result completeness. A snapshot represents its acquisition time rather than permanent
  state, and neither a PID nor a repeated image name independently identifies an instance across lifetimes. Installed-software
  queries, window titles or focus, driver packages, and loaded drivers belong to neighboring discovery techniques. A process
  list can provide leads without establishing those facts. Opening a handle or holding QUERY, VM_READ, or TERMINATE rights
  does not establish detailed reads, credential extraction, injection, or termination. Process-based analysis-environment
  decisions, security-process impairment, and credential dumping each require evidence of the respective conditioned-evasion,
  defense-impairment, impact, or credential-access action. The resident-query child concerns how the particular process-survey
  task is carried, not establishment of the resident agent, reflective loading, cross-process embedding, or nonstandard API
  transitions themselves. Legitimate monitoring, EDR, desktop management, task managers, and application health checks make
  similar inquiries. Filtering returned rows, displaying fewer columns, or selecting a familiar tool does not independently
  establish an evasion design.
