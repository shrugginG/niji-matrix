  name_en: Permission Groups Discovery
  name_zh: 权限组发现
decision: retain
rationale_zh: 保留固定 Enterprise 19.1 父级语义：取得组、成员与权限关系，帮助识别有价值身份和后续访问路径。ESET 直接记录 ComRAT 操作者运行本地和域组调查命令；Microsoft 与 AWS 官方接口分别证明这些关系的读取能力及限制。已有账户发现取得标识集合，信任拓扑发现取得身份权威之间的信任边，均不能完整承担组成员关系这一直接信息目标。
  匿迹成立性与恶意行为事实分开。受陷主体借用正常组查询接口，使单次读取与治理或支持工作同形，构成中等置信的特征伪装推断；明确设计为降低目标主机接触的策略关系推导替代另有作者能力资料，建立一个原生子项。该资料不证明 ComRAT 使用此子项，也不证明已测得告警下降。
rationale_en: Retain the fixed Enterprise 19.1 parent meaning of obtaining groups, memberships, and permission relationships
  to identify valuable principals and possible subsequent access paths. ESET directly records ComRAT operators running local
  and domain group survey commands, while Microsoft and AWS document relationship-reading capabilities and their limits. Account
  Discovery obtains identity sets and Trust-Topology Discovery obtains trust edges between identity authorities; neither fully
  owns group membership as the immediate information objective. Keep stealth validity separate from observed malicious behavior.
  A compromised principal reuses ordinary group-reading interfaces, making individual reads resemble governance or support
  work and supporting a medium-confidence Feature Disguise inference. Author documentation separately supports Policy-Relationship
  Inference Substitution designed to reduce contact with target hosts, warranting one native child. That capability evidence
  neither establishes ComRAT use of the child nor demonstrates a measured reduction in alerts.
scope_notes_zh: 纳入以取得组对象、组成员、嵌套边、角色分配及其权限配置为直接目标的命令、API、目录或可读配置调查。NJT-0131 账户发现取得身份标识清单，本项取得身份之间或身份与权限结构之间的关系；NJT-0181 信任拓扑发现负责域、林或租户权威之间的信任边。为了回答组成员问题而解释组策略映射属于本项的替代路径，一般策略对象、设置和应用结果调查仍由
  NJT-0231 组策略发现负责，同一操作若确有多个独立信息产物可分别标记。 添加或删除成员、修改角色或 ACL、取得凭据、变更令牌，以及实际使用关系实施访问是不同直接行为，不能由读取自动推断。只有当前用户名称而无组关系时由系统用户发现负责。LDAP
  tokenGroups 是需要目录请求的计算属性，并非本地访问令牌缓存；成员关系缺失也可能来自主组表示、分页、读取权、隐藏成员或视图时效。支持排障、权限审查和应用组同步会产生正常同形读取，判断必须依靠主体职责、批准范围及独立攻击上下文。
scope_notes_en: Include command, API, directory, or readable-configuration surveys whose immediate objective is group objects,
  memberships, nested edges, role assignments, or their permission configuration. NJT-0131 Account Discovery obtains identity
  lists; this technique obtains relationships among identities or between identities and permission structure. NJT-0181 Trust-Topology
  Discovery owns trust edges between domain, forest, or tenant authorities. Interpreting policy mappings to answer a membership
  question is this technique's substitute path; general policy-object, setting, and applied-result surveys remain NJT-0231
  Group Policy Discovery. An operation with several independently established information products can receive separate classifications.
  Adding or removing members, changing roles or ACLs, obtaining credentials, altering tokens, and actually using a relationship
  for access are different direct behaviors and cannot be inferred from a read. A current username without group relationships
  belongs to System Owner/User Discovery. LDAP tokenGroups is a computed attribute requiring a directory request, rather than
  a local access-token cache. Missing membership can reflect primary-group representation, paging, read rights, hidden members,
  or view freshness. Support troubleshooting, access review, and application group synchronization produce legitimate equivalent
  reads; classification requires actor duties, approved scope, and independent attack context.
