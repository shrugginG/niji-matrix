rationale_zh: 保留 T1082 在已访问环境取得操作系统、体系结构、硬件、构建与修补属性的直接信息对象。联合 Volt Typhoon 公告直接记录 systeminfo 与 wmic baseboard list full，Mandiant
  对 SUNBURST 的原始逆向则记录 CollectSystemDescription 取得 OS version。这些行为为环境测绘提供系统事实，同时借用正常诊断和兼容性检查所需的读取功能，支持保留父级而无需改写为分析环境判断或后继执行门控。
rationale_en: Retain T1082's direct information object of operating-system, architecture, hardware, build, and patch attributes
  within an accessed environment. The joint Volt Typhoon advisory directly records systeminfo and wmic baseboard list full,
  while Mandiant's original SUNBURST analysis records OS-version acquisition by CollectSystemDescription. These behaviors
  supply system facts for discovery while borrowing read functionality needed for diagnostics and compatibility checks, supporting
  parent retention without rewriting it as analysis-environment classification or successor-execution gating.
scope_notes_zh: 属性记录、当前实际硬件、完整补丁状态和攻击者依据属性采取的后继行为是不同结论。系统信息工具可能一次返回存储、接口、用户与位置线索，必须按实际直接对象分流。保留父项不意味着每次只读查询都具有匿迹目的，也不意味着任何
  API 调用自动形成正式子项。
scope_notes_en: An attribute record, current physical hardware, complete patch state, and successor behavior based on attributes
  are different conclusions. A system-information tool may return storage, interface, user, and location clues together, requiring
  separation by the actual direct object. Retention neither gives every read a stealth purpose nor makes an API call an automatic
  formal child.
