  name_en: File and Directory Discovery
  name_zh: 文件与目录发现
decision: retain
rationale_zh: T1083 取得主机或网络文件系统中的路径、名称、层级、存在性和列表属性，是后继读取、收集、执行或影响之前的独立 Discovery 行为。CISA 事件资料和 Mimic 样本分析直接支持恶意枚举及索引工具用于目标选择；现有证据不足以证明索引、窄谓词或节奏本身构成独立
  NJS。
rationale_en: T1083 obtains paths, names, hierarchy, existence, and listing attributes in host or network filesystems, forming
  an independent Discovery act before later read, collection, execution, or impact. CISA reporting and Mimic sample analysis
  directly support adversarial enumeration and indexed tooling for target selection, while current evidence does not establish
  indexing, narrow predicates, or cadence as independent NJS variables.
scope_notes_zh: 浏览记录解析归 NJT-0138，云对象键归 NJT-0141，正文读取、凭据取得、打包和外传另记。索引化查询、窄谓词、时间稀释和来源分散保持 deferred，正式 NJS 为 0。
scope_notes_en: Browser-context parsing belongs to NJT-0138, cloud object keys to NJT-0141, and body reads, credential acquisition,
  packaging, and exfiltration remain separate. Indexed queries, narrow predicates, temporal dilution, and origin dispersion
  remain deferred; no NJS is formalized.
