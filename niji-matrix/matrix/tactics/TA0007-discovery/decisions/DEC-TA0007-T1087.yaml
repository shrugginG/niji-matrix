  name_en: Account Discovery
  name_zh: 账户发现
decision: adapt
rationale_zh: Niji 保留 T1087 在已进入环境中识别既有账户的直接目的，但将正式论证聚焦于攻击者选择既存身份视图后，本次取名单从权威查询面转移到端点观察面的变化。Oldrea 取用 Outlook 地址簿是直接事实，OAB
  可本地保存是产品事实；二者共同支持中等置信的观察面推断，但没有证明 Oldrea 刻意规避目录审计，因此准入为有明确限制的 adapt。
rationale_en: Niji keeps T1087’s direct purpose of identifying existing accounts in an accessed environment, while focusing
  the formal stealth analysis on how selecting a preexisting identity view shifts the current retrieval from authoritative
  queries to endpoint observation. Oldrea’s address-book use and the availability of locally stored OABs are direct facts;
  together they support a medium-confidence observation-surface inference, not proof that Oldrea deliberately evaded directory
  audit. This warrants a bounded adapt decision.
scope_notes_zh: 账户类型、平台与查询工具不构成 Niji 子项。只正式建立既存身份视图复用；在线小量查询和常规客户端借道缺结论级证据暂缓。与 T1033、T1069、T1136、T1078 及取得访问前的 NJT-0033 按直接信息对象和行为结果划界。
scope_notes_en: Account type, platform, and query tool are not Niji child boundaries. Only reuse of a preexisting identity
  view is formalized; small online queries and ordinary-client borrowing are deferred for lack of conclusion-level evidence.
  T1033, T1069, T1136, T1078, and pre-access NJT-0033 are separated by direct information object and behavioral result.
