  name_en: Peripheral Device Discovery
  name_zh: 外围设备发现
decision: retain
rationale_zh: 固定 Enterprise 19.1 的 T1120 以识别计算机连接的外围设备及组件为直接目的。ESET 对 Attor 的逆向直接记录接入后设备指纹获取；官方接口也区分已安装记录、当前在场设备与启用接口，因此保留父级语义并明确结果层级。常规盘点外观的辨识困难和通知驱动设计均有独立来源，不依靠
  ATT&CK 父页面推导子技术。
rationale_en: T1120 in fixed Enterprise 19.1 concerns identifying peripherals and components connected to a computer. ESET's
  reverse engineering of Attor directly documents device fingerprinting after arrival, while official interfaces distinguish
  installed records, presently available devices, and enabled interfaces. Retain the parent semantics with explicit result
  levels. Ambiguity from ordinary inventory appearance and notification-driven design have independent sources rather than
  being inferred from the ATT&CK parent page.
scope_notes_zh: 设备身份、类别、连接及可用状态归本候选；驱动包和加载信息归 NJT-0180，容量、卷和挂载事实归 NJT-0232，文件清单与音视频内容读取归各自对象。同一调用可能取得多个事实，应按返回事实分别归属。没有设备结果时只记查询尝试；设备存在也不证明摄像、录音、文件取数或传播完成。
scope_notes_en: Device identity, class, connection, and availability belong here; driver packages and load state belong to
  NJT-0180, capacity, volumes, and mounts to NJT-0232, and file listings or audiovisual content reads to their respective
  objects. One call may produce several facts requiring separate attribution. Without device results record an attempted query
  only. Device presence does not establish completed camera use, recording, file acquisition, or propagation.
