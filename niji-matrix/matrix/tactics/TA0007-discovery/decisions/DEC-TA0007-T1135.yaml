  name_en: Network Share Discovery
  name_zh: 网络共享发现
decision: retain
rationale_zh: 保留 T1135 的父级语义：在已访问环境中查询本机对外共享配置或远端服务器共享资源，寻找后继浏览、收集和横向行动的候选入口。其直接信息对象是共享名称、类型、注释和按查询级别提供的配置；网络服务可达性、既有映射盘存在、共享内路径列表及文件正文分别具有不同边界。原生共享管理功能既供合法运维使用，也出现在恶意侦察命令包中，因此能够在明确的观察条件下解释特征相似性；现有证据不证明所有枚举天然隐蔽或实际降低告警。
rationale_en: Retain the T1135 parent semantics of querying local sharing configuration or a remote server's shared resources
  inside an accessed environment to select later browsing, collection, or lateral activity. Its direct information object
  is share identity, type, comment, and configuration permitted by the requested information level. Service reachability,
  existing mapped-drive presence, paths inside a known share, and file content have separate boundaries. Native share-management
  facilities serve legitimate administration and appear in adversarial reconnaissance packages, supporting a conditional explanation
  of feature similarity. Evidence does not establish that every enumeration is inherently covert or reduces alerts.
scope_notes_zh: 新父项应与 NJT-0182 和 NJT-0216 分开；不扩展 NJS-0216-001。共享清单返回不证明调用者可打开其中的共享，ACL 或安全描述符返回也不等于对完整路径实际执行过有效访问验证。不得把目录级
  Access-Based Enumeration 的效果转移到服务器共享清单；本交接不作该声明。
scope_notes_en: Keep the proposed parent separate from NJT-0182 and NJT-0216, and do not extend NJS-0216-001. A returned inventory
  does not establish that the caller can open the listed shares; returned ACLs or security descriptors are not an exercised
  effective-access check against a complete path. Do not transfer directory-level Access-Based Enumeration effects to the
  server share inventory; this handoff makes no such claim.
