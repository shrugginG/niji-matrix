  source_attack_id: T1201
  source_attack_version: '19.1'
  name_en: Password Policy Discovery
  name_zh: 密码策略发现
decision: retain
rationale_zh: 密码策略参数本身提供攻击规划信息：攻击者可调查长度、复杂性、历史、有效期及锁定约束，而不必先尝试口令、修改策略或取得秘密。ESET 的 ComRAT 调查记录真实操作者执行 net accounts 与 net accounts
  /domain；官方接口则分别明确域默认值、按用户的有效密码设置对象、本地账号期限及 AWS IAM 用户规则。保留 T1201 的信息目标和环境测绘目的，不把后续猜解纳入本技术。
rationale_en: Password-policy parameters supply planning information in their own right. An adversary can investigate length,
  complexity, history, age, and lockout constraints without first guessing a password, modifying policy, or obtaining a secret.
  ESET's ComRAT investigation records operators executing net accounts and net accounts /domain. Official interfaces separately
  establish domain defaults, a user's resultant password-settings object, local account aging, and AWS IAM-user rules. Retain
  T1201's information objective and Discovery purpose while keeping subsequent guessing outside this technique.
scope_notes_zh: 依据所请求和返回的直接信息对象判定边界。GPO 链接、委派和通用应用结果归 NJT-0231；明确取得密码约束的请求归本技术。同一调查链可以覆盖两者，但不能用一条命令重复证明不同结果。配置、查询尝试、成功状态和实际返回值分层记录，默认域策略也不能代替特定用户的有效细粒度策略。
scope_notes_en: Boundaries follow the information directly requested and returned. GPO links, delegation, and general application
  results belong to NJT-0231; requests specifically obtaining password constraints belong here. One investigation can cover
  both, but one command cannot independently prove different results. Record configuration, query attempt, success status,
  and returned values separately, and do not substitute a domain default for a particular user's effective fine-grained policy.
