  name_en: Browser Information Discovery
  name_zh: 浏览器信息发现
decision: adapt
rationale_zh: 浏览器历史和书签是已访问主机上的独立环境信息对象。CISA 联合通告记录恶意书签枚举，Volexity 的 3CX 样本分析直接证明浏览历史标题与 URL 被提取。Niji 将父级收紧为保留浏览上下文的读取，读取既存记录可把本次发现从新网页导航观察面移到端点配置访问面；这是中等置信的架构推断，不声称已证实的规避动机。
rationale_en: Browser history and bookmarks are a distinct environment-information object on an accessed host. A CISA joint
  advisory records adversarial bookmark enumeration, and Volexity directly documents 3CX sample extraction of history titles
  and URLs. Niji narrows the parent to retained browsing context. Reading existing records can shift present discovery from
  fresh navigation to endpoint-profile access, a medium-confidence architectural inference rather than proven evasion motive.
scope_notes_zh: 账户清单归 NJT-0131，当前窗口归 NJT-0132，凭据、Cookie、令牌及正文获取按各自直接对象另记。同步副本、时间筛选与分批重读缺独立恶意和防守差异证据，正式子项暂缓。
scope_notes_en: Account lists belong to NJT-0131 and current windows to NJT-0132; credentials, cookies, tokens, and body retrieval
  follow their own direct objects. Synchronized copies, time filtering, and batched rereads lack independent adversarial and
  defensive-difference evidence, so children are deferred.
