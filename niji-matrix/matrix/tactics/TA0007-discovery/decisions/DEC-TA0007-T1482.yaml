  name_en: Identity Trust-Topology Discovery
  name_zh: 身份信任拓扑发现
decision: adapt
rationale_zh: T1482 的稳定对象是域、林或租户身份边界间的 trust partner、方向、类型、属性与可达关系。CISA 直接记录行为者使用 nltest 查询 trusted domains，Microsoft 接口文档证明这些边可被普通域身份或获准租户读取。Niji
  将父级适配为身份信任拓扑，域/林行为为高置信，租户 partner policy 只保持能力支持的中等置信。
rationale_en: T1482’s stable object is the trust partner, direction, type, attributes, and reachability among domain, forest,
  or tenant identity boundaries. CISA directly records actors using nltest to query trusted domains, and Microsoft interface
  documentation establishes that these edges can be read by an authenticated domain identity or entitled tenant principal.
  Niji adapts the parent to identity trust topology, with high confidence for domain or forest behavior and capability-supported
  medium confidence for tenant partner policy.
scope_notes_zh: 账户、组、GPO 和主机查询另归其直接对象；信任修改、票据滥用、远程认证和横向移动是后继。缓存、限域、多源拼接和属性投影均缺同案痕迹对照，正式 NJS 为 0。
scope_notes_en: Account, group, GPO, and host queries follow their direct objects; trust modification, ticket abuse, remote
  authentication, and lateral movement are later acts. Cache, scoped, distributed, and attribute-projection axes lack same-case
  trace comparison; no NJS is formalized.
