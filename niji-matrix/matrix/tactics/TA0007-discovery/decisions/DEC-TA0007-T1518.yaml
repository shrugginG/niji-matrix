rationale_zh: '保留 T1518 对软件存在性、版本和配置的直接调查范围，包括安全软件与备份软件。ESET 的 LunarWeb 分析记录安装程序及安全产品调查，Mandiant 的 FIN12 报告另记录对安全和备份软件的收集；这些是恶意采用父行为的独立一手依据。合法软件资产管理使用相同库存接口，故查询目的和授权语境是区分恶意调查的必要条件，不能因为工具正常就排除本候选。


  本次不把任一软件发现实现自动判为匿迹。正式机理仅讨论借用资产盘点接口所形成的可见行为相似性，置信度保持中等；没有公开检测率对照。父项保留软件事实而不重写为分析环境判断、执行护栏或防御削弱，也不导入 ATT&CK 的产品类别子项。'
rationale_en: 'Retain T1518''s direct survey of software presence, versions, and configuration, including security and backup
  software. ESET''s LunarWeb analysis records installed-program and security-product inquiries, while Mandiant''s FIN12 report
  independently records collection of security and backup software. These are independent primary observations of malicious
  use of the parent behavior. Legitimate software asset management uses the same inventory interfaces, making purpose and
  authorization context necessary to distinguish malicious surveying; an ordinary utility does not justify excluding the candidate.


  No software-discovery implementation is automatically treated as evasive. The proposed mechanism concerns visible similarity
  produced by borrowing inventory interfaces and remains medium-confidence without a published detection-rate comparison.
  The parent preserves software facts rather than becoming analysis-environment classification, execution guardrails, or defense
  impairment, and imports no ATT&CK product-category children.'
scope_notes_zh: 安装登记、产品版本、运行实例、防护健康和配置有效性是不同事实。一次查询、一个已打开键或一个命令成功退出都不证明软件正在运行或防护已经关闭。对软件清单的定向 Registry 读取归本信息对象；通用 Registry
  探索由 NJT-0241 负责，同一读取不重复陈述为两个独立成果。
scope_notes_en: Installation registration, product version, running instances, protection health, and effective configuration
  are different facts. A request, an opened key, or a successful process exit does not establish running software or disabled
  protection. A Registry read specifically directed at inventory belongs to this information object; general Registry exploration
  belongs to NJT-0241, without restating one read as two independent outcomes.
