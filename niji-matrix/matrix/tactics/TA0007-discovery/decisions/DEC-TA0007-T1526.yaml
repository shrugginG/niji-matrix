  name_en: Cloud Service Discovery
  name_zh: 云服务发现
decision: adapt
rationale_zh: T1526 的直接问题是服务能力、启用状态及安全与日志覆盖，而非某个 VM 或桶的存在。微软 Storm-0501 调查证明攻击者理解 Azure 防护状态后尝试移除保护。Google 官方又明确 ListServices
  不产生日志，AWS GuardDuty 可进入 CloudTrail，说明读取观察面由方法决定；但实案未指出攻击者选用无审计路径。Niji 因此收紧父级，机理以假设置信度显式保留该证据界线。
rationale_en: T1526 directly asks which service capabilities, enablement states, and security or logging coverage exist, not
  whether a particular VM or bucket exists. Microsoft documents Storm-0501 understanding Azure protections before attempts
  to remove them. Google explicitly lists ListServices as unlogged while AWS GuardDuty can enter CloudTrail, showing method-dependent
  observation. The incident does not identify an unlogged method chosen by the actor. Niji therefore narrows the parent and
  keeps this evidence boundary explicit with hypothesis-level mechanism confidence.
scope_notes_zh: 具体 IaaS 资源归 T1580，桶内对象键归 T1619，控制台界面归 T1538 路径语境。既存状态快照、按防护状态门控后继行为和跨范围分散仍缺同案行为及不同防御依据，不分配 NJS。
scope_notes_en: Concrete IaaS resources belong to T1580, in-bucket keys to T1619, and dashboards to T1538 path context. Stored
  status snapshots, protection-state-gated successor behavior, and cross-scope dispersion lack same-case behavior and distinct
  defense evidence, so no NJS is allocated.
