candidate:
  source_type: attack
  source_attack_id: T1538
  source_attack_version: '19.1'
  name_en: Cloud Service Dashboard
  name_zh: 云服务控制台
decision: exclude
rationale_zh: 固定版 T1538 确实描述攻击者经 GUI 获取云环境信息，但当前差别主要是访问界面，不是独立信息对象。控制台能呈现 T1580 的资源图、T1526 的服务状态或 T1619 的对象键；AWS 官方记录控制台登录及部分服务请求，GCP
  读审计还受配置限制。尚无事件级对照证明 GUI 相对同一信息的 API 读取具备稳定匿迹变量、残余痕迹和专属防御，因此排除以避免按界面重复正式技术。
rationale_en: The fixed T1538 genuinely describes adversarial GUI reading of cloud environments, but its present distinction
  is chiefly an access interface rather than an independent information object. Dashboards can present T1580 resource graphs,
  T1526 service state, or T1619 object keys. AWS documents console sign-in and some service-request logs, while GCP read audit
  depends on configuration. No event-level comparison establishes a stable GUI-specific stealth variable, residue, and dedicated
  defense for the same information, so exclusion avoids duplicating formal techniques by interface.
scope_notes_zh: GUI 浏览保留为获准父技术的路径上下文。排除不表示控制台恶意使用不存在，也不表示所有页面请求都有云审计；若未来有同案页面、后端调用和审计差异证据，可重新审查 adapt，而非先制造 GUI 子项。
scope_notes_en: GUI browsing remains path context for admitted parents. Exclusion neither denies malicious console use nor
  claims every page request has cloud audit. Same-case page, backend-call, and audit-difference evidence could justify revisiting
  adaptation instead of preemptively creating a GUI child.
gap_statement_zh: 若新证据证明某一控制台视图在相同信息目标下具有独立可重复的匿迹因果与专属防御，再重新评估正式准入。
gap_statement_en: Reassess formal admission if new evidence establishes repeatable GUI-specific stealth causality and dedicated
  defense for the same information objective.
