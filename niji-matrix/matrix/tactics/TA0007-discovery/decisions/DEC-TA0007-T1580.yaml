  name_en: Cloud Infrastructure Discovery
  name_zh: 云基础设施发现
decision: retain
rationale_zh: T1580 以已存在的 IaaS 资源实体及关系图为直接对象。Expel 的 CloudTrail 应急调查证明被盗 IAM 键实际列举 S3 桶、EC2 实例和 RDS 数据库，并有后继安全组及实例动作。合法盘点与恶意测绘共用只读接口，可使孤立事件的意图难辨，但不证明跨键稀释或实测漏报。父级语义可保留，子项证据仍不足。
rationale_en: T1580 directly concerns existing IaaS resource entities and their graph. Expel’s CloudTrail response establishes
  stolen IAM keys actually listing S3 buckets, EC2 instances, and RDS databases before security-group and instance actions.
  Authorized inventory and malicious mapping share read-only interfaces, making isolated intent hard to classify without proving
  cross-key dilution or measured misses. The parent semantics are retained while child evidence remains insufficient.
scope_notes_zh: 服务能力启用状态归 T1526，桶内对象键归 T1619，GUI 只作路径上下文。Config/Explorer/state 转读、条件过滤、跨区域或跨键拼接和分页尚无独立攻击案例，不能复制为 NJS。
scope_notes_en: Service capability state belongs to T1526, in-bucket keys to T1619, and GUI viewing is path context. Config
  or Explorer or state retrieval, scoped filters, cross-Region or cross-key assembly, and paging lack independent adversarial
  cases and are not imported as NJS.
