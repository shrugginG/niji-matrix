  name_en: Container and Resource Discovery
  name_zh: 容器与资源发现
decision: retain
rationale_zh: T1613 以容器环境中的集群、节点、命名空间、Pod、部署、镜像和容器状态资源图为直接对象。Unit 42 对 Hildegard 的调查直接记录攻击者寻找内部 kubelet 并通过节点 API 发现运行容器，证明父行为具有独立
  Discovery 价值。合法控制器与恶意读取共用 list/get 接口，构成中等置信的可区分性问题，但没有证据支持按 API、scope 或平台建立 NJS。
rationale_en: T1613 directly concerns the resource graph of clusters, nodes, namespaces, pods, deployments, images, and container
  state. Unit 42 directly records Hildegard finding internal kubelets and using a node API to discover running containers,
  establishing independent Discovery value. Legitimate controllers and adversarial readers share list and get interfaces,
  creating a medium-confidence distinguishability problem without evidence for API-, scope-, or platform-based NJS partitions.
scope_notes_zh: 具体 IaaS 资源归 NJT-0139，容器 exec 和 create/deploy 分别归 T1609/T1610。节点局部视图、selector/namespace、分页/watch 和来源分散均保持 deferred，正式
  NJS 为 0。
scope_notes_en: Concrete IaaS resources belong to NJT-0139, while container exec and create or deploy belong to T1609 and
  T1610. Node-local views, selector or namespace scope, paging or watch, and origin dispersion remain deferred; no NJS is
  formalized.
