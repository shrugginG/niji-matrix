    bilingual Web gates pass; keep review pending human domain approval.
rationale_zh: 保留被访问系统的地理位置推断这一直接信息对象。地方语言、输入区域和时区配置可成为间接输入，外部 GeoIP 服务或云实例区域则提供另一类位置线索；这些来源的含义和精度不能互换。恶意样本的本地环境读取以及 CrimsonRAT
  控制端的受害 IP 定位均有一手研究支持，后者还展示了使位置查询落在企业端点观察范围之外的稳定实现变量。因此保留父技术，无需把执行条件判断或反沙箱行为并入定义。
rationale_en: Retain geographical inference about an accessed system as the direct information object. Language, input-locale,
  and time-zone configuration can provide indirect inputs, while external GeoIP services and cloud instance regions provide
  different location clues whose meaning and precision are not interchangeable. First-party research documents local environment
  reading by malicious samples and victim-IP lookup by the CrimsonRAT controller. The latter also establishes a stable implementation
  variable that places the location lookup outside enterprise endpoint visibility. The parent can therefore be retained without
  absorbing execution conditions or sandbox evasion into its definition.
scope_notes_zh: 准入只表示这些获取行为在有地域推断语境时属于本父项，不把每次读取语言或时区视为已经确定位置。入侵前网站按访问 IP 筛选访客保持侦察或投递语境；获得访问后的控制端对 bot 地址定位则仍是本次发现。取得输入后按地域执行或退出由
  NJT-0109 负责，分析环境识别与调试器规避分别由 NJT-0122 和 NJT-0106 负责。
scope_notes_en: Admission places these acquisitions in the parent when their context supports geographical inference; it does
  not treat every language or time-zone read as a location determination. Website visitor selection before compromise remains
  reconnaissance or delivery, whereas a controller locating the address of an already accessed bot remains Discovery. Subsequent
  geographical execution or exit conditions belong to NJT-0109, while analysis-environment classification and debugger evasion
  belong to NJT-0122 and NJT-0106 respectively.
