candidate:
  source_type: attack
  source_attack_id: T1615
  source_attack_version: '19.1'
  name_en: Group Policy Discovery
  name_zh: 组策略发现
decision: retain
rationale_zh: 建议保留组策略信息取得这一父级语义。固定版本清单把 T1615 定位为 Windows 环境测绘，直接结果是已配置或实际应用的策略、作用域和相关设置；Microsoft 的管理与协议文档给出可实现的读取路径，ESET
  则直接观察到 Turla 操作者执行 gpresult /z 和 /v。攻击者借用合法诊断与策略读取接口会降低单个事件的目的可区分性，但资料没有给出漏报率或证明每次策略读取都为规避监控而设计，因此匿迹判断为中等置信度。
rationale_en: Retain acquisition of Group Policy information as the parent behavior. The fixed inventory places T1615 in Windows
  Discovery, with configured or applied policy, application scope, and related settings as its direct results. Microsoft administration
  and protocol documentation establishes implementable read paths, while ESET directly observed Turla operators running gpresult
  /z and /v. Reusing legitimate diagnostic and policy-reading interfaces reduces the ability to distinguish intent from one
  event, but the sources neither measure missed detections nor establish that every policy read was designed to evade monitoring,
  so the stealth conclusion has medium confidence.
scope_notes_zh: 本建议不将父级改写为策略篡改、权限提升或秘密取得。研究暂不提交正式子技术；本地结果复用、查询范围和时间选择等轴保留为 deferred。没有 ATT&CK 子项并不表示没有开展原生分类研究。
scope_notes_en: This recommendation does not rewrite the parent as policy mutation, privilege escalation, or secret acquisition.
  No formal child is proposed; local-result reuse, query scope, and timing remain deferred axes. The absence of ATT&CK children
  does not mean native taxonomy research was omitted.
gap_statement_zh: 本地结果与缓存、范围收窄及时间或来源选择缺少有意控制与同案痕迹对照，原生子技术分类暂缓；未来按结论级证据重审。
gap_statement_en: Local results and caches, scope narrowing, and timing or origin selection lack deliberate-control evidence
  and same-case trace comparisons; native taxonomy remains deferred for conclusion-level reassessment.
