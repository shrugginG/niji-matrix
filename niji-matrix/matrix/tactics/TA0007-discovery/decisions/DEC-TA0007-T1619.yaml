  name_en: Cloud Storage Object Discovery
  name_zh: 云存储对象发现
decision: retain
rationale_zh: T1619 直接取得已知云存储容器内的对象键、前缀和清单元数据，区别于找桶和下载正文。Unit 42 记录攻击者使用存储浏览工具与对象访问，并在单独受控试验观察到 GUI 浏览触发 ListObjects；受害租户没有对象数据日志，不能把实验日志冒充在野事件。获准只读列表可与正常备份和索引同形，因此保留父行为而不强制建立证据不足的子项。
rationale_en: T1619 directly obtains keys, prefixes, and inventory metadata inside a known cloud container, distinct from
  finding buckets or downloading bodies. Unit 42 records attacker storage-browsing tools and object access, while a separate
  controlled experiment observed GUI navigation triggering ListObjects. The victim lacked object-data logs, so experiment
  events are not in-the-wild logs. Authorized list reads can resemble ordinary backup and indexing, justifying the parent
  without forcing unsupported children.
scope_notes_zh: 容器存在性归 T1580，服务能力归 T1526，GUI 仅作访问路径；后续正文读取另属 Collection。prefix 分段、预存 Inventory 转读和多身份时间稀释目前缺同案恶意对照，维持 deferred。
scope_notes_en: Container existence belongs to T1580, service capability to T1526, and GUI is only a path; later body reads
  belong to Collection. Prefix scoping, stored-Inventory retrieval, and multi-identity timing lack same-case adversarial comparisons
  and remain deferred.
