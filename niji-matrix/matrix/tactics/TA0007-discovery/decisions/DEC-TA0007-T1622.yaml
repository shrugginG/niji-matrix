rationale_zh: T1622 对调试状态和调试观察通道的读取既产生 TA0007 的环境事实，也在同一事务中驱动 TA0005 的退出、诱饵、载荷保留或通道饱和。既有 NJT-0106 和两项原生 NJS 已完整表达直接对象、痕迹差与专用防御，因此
  TA0007 应独立 retain 并跨战术复用，而不是创建同义技术。
rationale_en: T1622 reads debugger state and the debug observation channel, producing an environmental fact for TA0007 and,
  in the same transaction, driving TA0005 exit, decoy behavior, payload withholding, or channel saturation. Existing NJT-0106
  and its two native children already express the direct object, trace differences, and dedicated defenses, so TA0007 independently
  retains and reuses the package rather than creating a synonym.
scope_notes_zh: 扩展 NJT-0106 tactic_refs 加入 TA0007，复用 NJS-0106-001/-002、DET-000103/122、NJA-000088/108 和 MIT-000105。线程隐藏与拒绝附加继续
  deferred；新增 NJS 和共享对象均为 0。
scope_notes_en: Extend NJT-0106 tactic_refs with TA0007 and reuse NJS-0106-001/-002, DET-000103/122, NJA-000088/108, and MIT-000105.
  Thread hiding and attach denial remain deferred; no new NJS or shared object is created.
