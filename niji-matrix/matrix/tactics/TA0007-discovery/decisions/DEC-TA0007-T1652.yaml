  name_en: Device Driver Discovery
  name_zh: 设备驱动程序发现
decision: adapt
rationale_zh: 恶意案例证明攻击者会查询驱动相关注册表、运行 driverquery 或检查特定活动驱动。Niji 保留驱动事实这一信息对象，并有意区分驱动包、安装状态、加载/活动状态、加载地址和设备能力；Microsoft 文档显示工具和
  API 输出语义并不等价，因此父级需要适配而非按工具拆分。
rationale_en: Adversarial examples establish registry-based driver queries, driverquery use, and checks for particular active
  drivers. Niji retains driver facts as the information object while separating package, installation, loaded or active state,
  load address, and device capability. Microsoft documentation shows utility and API outputs are not semantically equivalent,
  requiring parent adaptation rather than tool-based children.
scope_notes_zh: 软件、服务、进程和安全产品发现按直接结果另记；T1497、BYOVD、漏洞利用和驱动加载是条件或后继行为。接口、权限/版本、目的与厂商轴均不满足 NJS 门禁，正式 NJS 为 0。
scope_notes_en: Software, service, process, and security-product discovery follow their direct results. T1497, BYOVD, exploitation,
  and driver loading are conditional or later acts. Interface, privilege or version, purpose, and vendor axes do not pass
  NJS gates; no NJS is formalized.
