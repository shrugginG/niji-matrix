  name_en: Log Enumeration
  name_zh: 日志枚举
decision: retain
rationale_zh: 保留以日志来源和记录为信息对象的环境测绘父行为。固定基线 T1654 同时覆盖日志来源调查、记录查询与从记录理解环境，不能收缩为 Windows 事件导出，也不能扩大为所有日志篡改。WithSecure 直接记录攻击者使用
  wevtutil 过滤导出 RDP 事件，ESET 记录 Turla 为了解样本是否被检测而定期外传安全日志，Permiso 记录 GUI-vil 读取 CloudTrail 以观察驱逐行动。它们支持恶意日志调查及其对正常诊断外观的借用；并未测量查询的漏报率，因此机理维持中等置信度。
rationale_en: Retain the discovery parent whose information objects are log sources and records. Fixed-baseline T1654 covers
  investigation of sources, record queries, and learning about the environment from records; it must neither collapse into
  Windows event export nor expand into every form of log tampering. WithSecure directly records filtered RDP-event export
  through wevtutil, ESET reports Turla regularly exfiltrating security logs to assess sample detection, and Permiso records
  GUI-vil reading CloudTrail to observe eviction activity. These support malicious log investigation and its reuse of ordinary
  diagnostic appearances without measuring query detection failures, so the mechanism remains medium confidence.
scope_notes_zh: 将日志名、来源配置、查询请求、返回记录、导出工件与后续行动分别分级。建议一个父技术、零个正式子技术，分类状态 deferred。已独立调查查询范围缩减、既有记录替代新探测、集中日志观察面与反馈驱动调整，证据尚不足以把这些候选稳定地写成
  NJS。
scope_notes_en: Grade log names, source configuration, query requests, returned records, export artifacts, and subsequent
  actions separately. Propose one parent and no formal child, with taxonomy deferred. Query-scope reduction, existing records
  replacing fresh probes, centralized observation surfaces, and feedback-driven adaptation were independently examined; their
  evidence does not yet support stable formal NJS boundaries.
