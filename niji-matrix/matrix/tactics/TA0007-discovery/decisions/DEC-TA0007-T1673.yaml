rationale_zh: 固定19.1的T1673直接对象是攻击者取得host或hypervisor访问后可见的受管虚拟机清单，而不是当前guest是否处于沙箱。CrowdStrike原始调查记录VIKING SPIDER在ESXi主机列出运行VM，随后把World
  ID用于电源操作；Trend Micro的Play样本研究也记录注册清单进入逐VM后继操作。两者支持保留VM发现行为及Discovery目的，后继停止或加密不是发现完成条件。父级行为证据强于匿迹效果证据，机理映射为中等置信推断。
rationale_en: Fixed-19.1 T1673 directly concerns the managed-VM inventory visible after host or hypervisor access, rather
  than whether the current guest is a sandbox. CrowdStrike records VIKING SPIDER listing running VMs on ESXi and then using
  World IDs in power operations. Trend Micro's Play sample analysis also records registered-inventory enumeration feeding
  per-VM successor operations. These support retaining VM discovery and its Discovery purpose without making stopping or encryption
  part of discovery completion. Evidence for the behavior is stronger than evidence for stealth effectiveness, and the mechanism
  mapping remains a medium-confidence inference.
scope_notes_zh: 保留父级语义，同时澄清基线文字的running不使所有列举命令具有同一视图。esxcli vm process list仅列运行VM，vim-cmd vmsvc/getallvms列注册VM，vCenter属性读取受对象权限、过滤和分页约束。纳入这些视图实际取得的VM身份、配置定位及明确返回的关联事实；云账户资源图、当前系统属性、虚拟磁盘内容读取和分析环境条件分支保留邻接边界。
scope_notes_en: Preserve the parent while clarifying that the baseline's word running does not give every listed command the
  same view. esxcli vm process list lists running VMs, vim-cmd vmsvc/getallvms lists registered VMs, and vCenter property
  reads are constrained by object access, filters, and pagination. Include VM identities, configuration locations, and explicitly
  returned related facts actually acquired through these views. Cloud-account resource graphs, current-system attributes,
  virtual-disk content reads, and analysis-environment conditional branches retain adjacent boundaries.
