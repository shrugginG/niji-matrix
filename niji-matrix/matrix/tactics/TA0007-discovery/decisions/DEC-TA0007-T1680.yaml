  name_en: Local Storage Discovery
  name_zh: 本地存储发现
decision: adapt
rationale_zh: 保留发现驱动器、磁盘、分区、卷及其容量、空闲空间、文件系统和标识属性的父行为，但将正式对象收敛到目标主机可见的存储状态。Microsoft 对 Volt Typhoon 的一手调查确认驱动器名称、容量、空闲空间和文件系统类型的发现；官方接口文档给出结果语义。存储盘点与维护具有相同接口外观，足以建立中等置信度的特征伪装机理，但不能据此宣称实测漏报或攻击者选择了某种独立匿迹子项。
  固定基线还包括 IaaS 提供方卷清单和 ESXi 的虚拟磁盘路径示例；前者已经由 NJT-0139 的卷、快照和资源关系范围覆盖，后者在只取得路径时属于 NJT-0182。使用 adapt 明确这些分流，避免为同一个资源盘点或文件列表建立重复父项。已映射网络驱动器可以作为主机逻辑驱动器事实纳入，但不据此声称发现了远端可用共享。
rationale_en: Preserve the parent behavior of discovering drives, disks, partitions, volumes, and their capacity, free space,
  filesystem, and identity attributes, while converging the formal object on storage state visible to a target host. Microsoft's
  firsthand Volt Typhoon investigation establishes discovery of drive names, capacity, free space, and filesystem types, while
  official interfaces define the result semantics. Shared interfaces with inventory and maintenance support a medium-confidence
  feature-disguise mechanism, without establishing measured misses or attacker selection of an independent stealth child.
  The pinned baseline also includes provider-side IaaS volume inventories and ESXi virtual-disk path examples. The former
  already falls within NJT-0139's volumes, snapshots, and resource relationships, while path-only results belong to NJT-0182.
  Adapt makes these resolutions explicit and avoids duplicate parents for resource inventory or file listings. An already
  mapped network drive may be included as a host logical-drive fact without claiming enumeration of remotely available shares.
scope_notes_zh: 取得文件和目录名称或 .vmdk 路径归 NJT-0182，枚举远端可用共享归网络共享发现；只看到一个已映射盘符不满足后者。AWS、GCP 和 Azure 提供方的卷资源清单由 NJT-0139 处理，取得或复制存储正文属于后继收集，绕过文件视图的原始内容读取需满足
  NJT-0108。打开句柄本身不证明取得正文；格式化、加密和关键扇区写入另行判断影响结果。容量监控、安装检查、备份、磁盘修复和事件响应都是正常反例，不能只凭工具或字段判断恶意。
scope_notes_en: File and directory names or .vmdk paths belong to NJT-0182, and enumeration of remotely available shares belongs
  to Network Share Discovery; an existing mapped drive alone does not establish the latter. Provider-side AWS, GCP, and Azure
  volume inventories are handled by NJT-0139. Acquiring or copying storage content is later collection, while raw-content
  reads bypassing the file view must meet NJT-0108. A handle alone does not establish acquired content; formatting, encryption,
  and critical-sector writes need separate impact assessment. Capacity monitoring, installation checks, backup, repair, and
  incident response remain counterexamples, so tools or fields alone do not establish malice.
