schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0131-001
parent_ref: NJT-0131
name:
  zh: 既存身份视图复用
  en: Reuse of a Preexisting Identity View
summary:
  zh: 从已可读取的身份副本取名单，使本次获取不必生成新的权威目录查询。
  en: Read an already accessible identity copy so the current retrieval need not produce a new authoritative directory query.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既存身份视图复用是攻击者在取得端点或邮箱访问后，从先前已保存的地址簿或身份列表恢复多个账户标识，而不为这些名字立即请求权威服务。直接目的仍是确认可用身份，子技术的独立性来自数据视图在本次操作之前就已存在。
    en: Reuse of a Preexisting Identity View occurs when an attacker with endpoint or mailbox access recovers multiple account
      identifiers from an address book or identity list saved earlier rather than immediately asking the authoritative service
      for those names. The direct purpose remains identification of accounts; the child’s distinction is that the view existed
      before the current operation.
  - zh: Outlook、OAB 和邮件地址只是可能载体。分类要求说明读取的是已有副本以及它如何改变本次账户发现的观察位置，不把所有读取联系人、单个当前用户名或新触发的全量下载纳入同一行为。
    en: Outlook, OAB, and email addresses are possible carriers. Classification requires an existing copy and an explanation
      of how it shifts observation of the current account discovery; it does not include every contact read, one current username,
      or a newly triggered full download as the same act.
stealth_characteristics:
  paragraphs:
  - zh: 既存身份视图复用使本次身份读取可以不出现在目录搜索或云列表 API 的即时事件流中，短窗口内的权威查询量因此不能代表攻击者已经得到的名单。防守方若只看权威侧会丢失端点再次消费身份资料这一环，尤其在缓存早已同步时。
    en: Reuse of a Preexisting Identity View can leave the present identity read outside fresh directory-search or cloud-listing
      event streams, so short-window authoritative query counts cannot represent the list already obtained. Authority-only
      monitoring misses the endpoint’s reuse of identity material, especially where a cache synchronized earlier.
  - zh: 仍可见的痕迹包括先前同步、异常客户端或文件读取、临时资料暂存与网络传输。缓存可能陈旧或被地址簿策略裁剪；Oldrea 的地址簿取用是行为证据，不能据此断定具体 OAB 文件或已证实的规避意图。
    en: Residual traces include earlier sync, unusual client or file reads, temporary staging, and network transfer. A cache
      may be stale or scoped by address-book policy. Oldrea’s address-book use is behavior evidence, not proof of a particular
      OAB file or established evasion intent.
scope_boundary_definition:
  paragraphs:
  - zh: 只纳入攻击者选择读取事先已存在、其当前可访问的多账户身份视图，并能说明相较于即时权威查询少了哪一侧事件、增加或保留了哪一侧痕迹。刚请求下载完整地址簿会产生新的在线下载痕迹，须按实际时间线分开描述。
    en: Include only an attacker’s selection of a preexisting, currently accessible multi-account identity view where the
      missing authority-side event and remaining endpoint-side traces can be explained relative to a fresh query. A newly
      requested full address-book download produces a new online trace and must be described separately in the actual timeline.
  - zh: 普通 Outlook 浏览、获准的通讯录导出、备份和索引是相似的合法活动。只确认当前登录用户归 T1033，组成员关系归 T1069；从已知身份登录或新增账户分别归 T1078 和 T1136。
    en: Ordinary Outlook browsing, approved contact export, backup, and indexing are similar legitimate activity. Identifying
      only the current logged-in user belongs to T1033 and group membership belongs to T1069; logging in with a known identity
      and creating an account belong to T1078 and T1136 respectively.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制使用缓存地址簿的工作站或能够访问邮箱会话时，可在进一步钓鱼或横向行动前先从该用户已可见的名单筛选身份。该路径适合接受资料不够新鲜的阶段，不适合需要权威目录最新状态或全租户覆盖的任务。
      en: An attacker controlling a workstation with a cached address book or an accessible mailbox session can select identities
        already visible to that user before phishing or lateral action. This path suits stages that can tolerate stale data,
        not tasks needing the authoritative directory’s latest state or tenant-wide coverage.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须能读取副本或操纵有权访问副本的应用，不预设域管理员权限。其可控选择是使用已存视图而非本次在线枚举，并承担视图受权限裁剪、同步滞后及端点异常读取留下痕迹的代价。
        en: The attacker must be able to read the copy or manipulate an application authorized to access it, without presumed
          domain administration. The controlled choice is using the stored view instead of a fresh online enumeration, at
          the cost of scoped, stale data and potentially visible abnormal endpoint reads.
    defender_model:
      paragraphs:
      - zh: 防守方若同时保留端点对象访问、进程父子关系、邮件客户端同步及网络传输，可以区分正常缓存维护与异常消费。仅有目录或云 API 日志时，无法从“本次无查询”判断身份副本是否被读取；缺少 SACL 或应用内事件时，端点侧也可能只剩后续暂存线索。
        en: With endpoint object access, process parentage, mail-client sync, and network transfer, defenders can distinguish
          ordinary cache maintenance from abnormal consumption. Directory or cloud API logs alone cannot tell whether a copy
          was read when there is no fresh query. Without SACLs or in-app events, endpoint evidence may be limited to later
          staging.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 端点既存名单读取不产生本次权威枚举请求
    en: Reading an existing endpoint list produces no fresh authoritative enumeration request
  analysis:
    paragraphs:
    - zh: 已保存的身份视图承担本次取名单的数据来源，因此无需为同一批名称生成新的目录搜索。防守观察从权威查询流转移到端点文件、客户端行为和后继传输；只在权威侧计数的规则可能漏掉取得名单这一事实。Oldrea 证实地址簿利用，OAB 文档证实离线副本可用，但具体事件的避审计动机和文件路径仍未被证实。
      en: An already stored identity view supplies the present list, so a new directory search for the same names is unnecessary.
        Defender observation shifts from authoritative query streams to endpoint files, client behavior, and later transfer;
        rules counting only authority-side queries can miss acquisition. Oldrea establishes address-book use and OAB documentation
        establishes available offline copies, but motive and file path in the incident remain unproven.
  evidence_refs:
  - REF-000480
  - REF-000481
  - REF-000379
  confidence: medium
