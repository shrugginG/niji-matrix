research:
  limitations:
    paragraphs:
    - zh: 公开案例未提供同一终端的 OAB 文件事件与目录查询时间线，故“已存视图导致本次权威侧缺席”是可复核的架构推断，不是案例中已证实的规避成功。未来需从端点取证、目录日志和恶意代码决策路径同时证明该变量。
      en: The public case lacks same-endpoint OAB file events and a directory-query timeline. The absence of a fresh authority
        event due to a stored view is therefore an architecture-based inference, not demonstrated evasion success in that
        incident. Future work needs endpoint forensics, directory logs, and the malware’s decision path together.
    - zh: 合法缓存重建和客户端同步有相同或更多本地痕迹，OAB 视图还会随策略、租户和同步时间变化。未覆盖应用内部读取的环境不应把没有 4663 解释成未发生发现。
      en: Legitimate cache rebuilds and client sync can leave similar or greater local traces, while OAB views vary with policy,
        tenant, and sync time. Environments lacking in-app coverage must not treat absent 4663 as proof that discovery did
        not happen.
