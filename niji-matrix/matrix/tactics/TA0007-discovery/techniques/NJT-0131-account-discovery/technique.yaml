schema_version: 2.0.0
type: technique
id: NJT-0131
name:
  zh: 账户发现
  en: Account Discovery
summary:
  zh: 从已访问环境取得既有账户标识，并通过选择既存身份视图改变本次取名单的观察面。
  en: Obtain existing account identifiers inside an accessed environment while selecting preexisting identity views to shift
    the observation surface of the current retrieval.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-adapted
    source_attack_id: T1087
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1087
definition_and_concept:
  paragraphs:
  - zh: 账户发现是攻击者在已进入的主机、目录、邮件或云身份空间确认哪些账户标识存在的行为。直接产物是用户名、地址或可用于后续筛选的账户集合；攻击者可以据此安排接触、口令尝试或进一步权限调查。
    en: Account Discovery is the adversary’s identification of existing account identifiers within an accessed host, directory,
      mail environment, or cloud identity space. Its direct product is a set of usernames, addresses, or accounts usable for
      later selection, password attempts, or privilege investigation.
  - zh: 本项由“取得既有身份集合”定义，而不由 Outlook、LDAP、云 API 或账户类别定义。Niji 关注攻击者如何选择这份名单的取得路径及其防守观察后果；创建账户、使用凭据和读取组授权关系是另外的直接行为。
    en: The defining act is acquiring an existing identity set, not using Outlook, LDAP, a cloud API, or any account category.
      Niji examines the chosen retrieval path and its effect on defender observation; account creation, credential use, and
      reading group authorization relationships are different direct acts.
stealth_characteristics:
  paragraphs:
  - zh: 账户发现的关键匿迹差异在于同一批身份可以来自权威服务的即时查询，也可以来自端点已保存的视图。攻击者若选择后者，本次取名单可能不在目录或云列表 API 中出现；只依赖权威查询量的防守方会低估已经取得的身份范围。
    en: The key stealth difference is that the same identities may come from a fresh authoritative query or from a view already
      stored on an endpoint. If the adversary chooses the latter, the present retrieval may not appear in directory or cloud
      listing APIs, so a defender counting only authoritative queries can underestimate the identities already obtained.
  - zh: 这不是无痕读取。地址簿的历史同步、端点文件或应用访问、恶意进程、临时暂存及外传都可能保留证据；是否能关联这些痕迹取决于客户端基线、对象访问审计和留存。Oldrea 案例证明地址簿被攻击者取用，离线观察面差异则是产品架构支持的推断，不应表述成已证实的规避动机。
    en: This is not traceless access. Earlier address-book sync, endpoint file or application reads, malicious processes,
      temporary staging, and transfer can leave evidence; correlation depends on client baselines, object-access auditing,
      and retention. Oldrea establishes adversarial use of an address book, while the offline observation difference is an
      inference supported by product architecture, not proven evasion intent.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入在受害环境访问后获取多个既有账户标识，且攻击者主动选择的读取位置或路径产生可说明的权威侧与端点侧观察差。在线目录或云列表查询仍属父级账户发现，但不能仅因使用合法 API、低请求量或普通客户端就自动认定其具备独立匿迹子项。
    en: Include acquisition of multiple existing identifiers after access to the victim environment when an attacker-chosen
      reading location or path yields an explainable difference between authority-side and endpoint-side observation. Online
      directory or cloud listing remains parent Account Discovery, but a legitimate API, low request volume, or ordinary client
      alone does not establish a separate evasion child.
  - zh: 只查某台系统当前用户由 T1033 主持，组成员和授权拓扑由 T1069 主持；新增身份属 T1136，使用已知凭据属 T1078，进入环境之前的目标人员情报属 NJT-0033。合法邮件同步、帮助台查询、目录迁移及安全审计会出现相似读取，必须结合主体、授权范围和后继结果判别。
    en: T1033 owns a system’s current user, T1069 owns group membership and authorization topology, T1136 owns new identities,
      T1078 owns use of known credentials, and NJT-0033 owns target-person identity intelligence before access. Legitimate
      mail sync, help-desk queries, directory migrations, and security audits can look similar and require actor, approved
      scope, and follow-on context.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在获得低权限主机或邮箱会话后，攻击者可能先从该用户已可见的名单挑选其他身份，再进行社会工程、口令攻击或权限路径调查。已有地址簿提供不必为本次取名单重新请求权威服务的候选集合，但其时效和覆盖受最后一次同步及视图策略限制。
      en: After gaining a low-privilege host or mailbox session, an adversary may select other identities from lists already
        visible to that user before social engineering, password attacks, or privilege-path investigation. An existing address
        book offers candidates without a fresh authority request for this retrieval, but its freshness and coverage depend
        on prior sync and view policy.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问身份空间或其可读副本。复用既存视图还需要受控端点、邮箱会话或能读取缓存的进程，并接受名单可能陈旧、被用户视图裁剪；目前资料不支持默认假定目录管理员权限或大规模协同来源。
        en: The adversary needs access to an identity space or a readable copy. Reusing a preexisting view additionally requires
          a controlled endpoint, mailbox session, or process able to read the cache, while accepting stale or user-scoped
          results. Current evidence does not justify assuming directory administration or coordinated large-scale origins.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有目录查询、云身份活动、端点进程与文件访问及出站网络记录，但这些通道的启用条件各不相同。只保留权威查询时，端点再次读取已同步名单不在该观察面内；配置对象 SACL、保留进程谱系并与暂存传输关联，才可能恢复本次取名单的路径。
        en: A defender may have directory queries, cloud-identity activity, endpoint process and file access, and outbound
          network records, but each channel has distinct enablement conditions. Authority-only monitoring misses a reread
          of a synchronized endpoint list. Configured object SACLs, process lineage, and joins to staging or transfer may
          recover the present retrieval path.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 复用已存身份视图使本次取名单离开即时权威查询面
    en: Reuse a stored identity view so the current retrieval leaves the fresh authoritative-query surface
  analysis:
    paragraphs:
    - zh: 攻击者选择读取在端点或应用中已经可用的名单，而不为相同名字立即发起新的权威枚举。于是目录侧缺少本次取名单所对应的批量查询，依赖该侧告警的防守方可能看不到身份获取本身；端点访问、先前同步、暂存和传输仍是残余线索。这一观察面变化可由
        OAB 架构解释，Oldrea 证明地址簿取用，但该案例没有证明其读取 OAB 文件或明确为避审计而选择此路径。
      en: The attacker selects a list already available on an endpoint or in an application instead of immediately issuing
        a new authoritative enumeration for the same names. The directory side therefore lacks a bulk query corresponding
        to this retrieval, and a defender relying on that alert surface may miss the acquisition; endpoint reads, earlier
        sync, staging, and transfer remain residual clues. OAB architecture explains this observation shift and Oldrea establishes
        address-book use, but the case does not prove an OAB-file read or an explicit audit-evasion motive.
  evidence_refs:
  - REF-000480
  - REF-000481
  - REF-000379
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术目前只建立“既存身份视图复用”一项 Niji 原生子技术，变量是本次取名单是否读取已可访问的身份副本，以及相应痕迹从权威查询面转移到端点访问面。它可以跨邮件、目录导出或其他已同步视图出现，但每个实例都须核查副本确已存在。
      en: The current Niji taxonomy establishes one child, Reuse of a Preexisting Identity View. Its variable is whether the
        present retrieval reads an already accessible identity copy, shifting the pertinent trace from an authoritative query
        surface to endpoint access. It can span mail, directory exports, or other synchronized views, but each instance requires
        an actually existing copy.
    - zh: ATT&CK 的本地、域、邮件和云子项只提示实现广度，不成为兄弟分类。跨时段小量查询与借用常规客户端仍可能改变痕迹，但现有事件资料不足以证明其独立的匿迹意图和防御差异，保留在研究层。
      en: ATT&CK local, domain, email, and cloud children indicate implementation breadth rather than sibling boundaries.
        Small queries dispersed over time and use of an ordinary client may change traces, but current incident evidence does
        not establish independent stealth intent and defensive differences, so they remain research hypotheses.
  coverage: established
  subtechnique_refs:
  - NJS-0131-001
