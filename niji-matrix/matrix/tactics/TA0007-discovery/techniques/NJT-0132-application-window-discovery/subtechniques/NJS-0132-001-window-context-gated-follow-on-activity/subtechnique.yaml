schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0132-001
parent_ref: NJT-0132
name:
  zh: 窗口上下文门控后继活动
  en: Window-Context-Gated Follow-On Activity
summary:
  zh: 用窗口名称或焦点条件决定通信或收集何时出现，缩短非目标情境中的后继痕迹。
  en: Use a window-name or focus condition to decide when communication or collection appears, reducing follow-on traces outside
    the target context.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 窗口上下文门控后继活动是在攻击者读取窗口状态后，让标题或前台条件控制后继通信、截图等行为是否开始的匿迹子技术。它仍以应用窗口发现取得条件信息，但其区别变量是有条件的行为显现，而不是单纯枚举窗口清单。
    en: Window-Context-Gated Follow-On Activity is an evasion sub-technique in which an adversary reads window state and lets
      a title or foreground condition decide whether later communication or capture begins. Application-window discovery supplies
      the condition, but the defining variable is conditional manifestation of later behavior rather than a plain window inventory.
  - zh: Grandoreiro 的浏览器前台名称谓词是明确案例；Attor 的进程名或窗口标题双谓词只在标题确实参与选择时提供旁证。后继通信和收集仍由相应技术描述，本子项只负责发现状态如何改变它们出现的时机。
    en: Grandoreiro’s foreground-browser name predicate is the clear case. Attor’s mixed process-name or window-title predicate
      supports this child only where the title actually participates in selection. Communication and collection remain described
      by their respective techniques; this child owns how discovered window state changes their timing.
stealth_characteristics:
  paragraphs:
  - zh: 窗口上下文门控后继活动使非目标窗口期间缺少原本可能持续出现的 C2 或收集事件，防守方在这些时段只可能看到驻留进程与不易从默认日志辨认的窗口读取。若目标窗口稍后出现，短时后继链才显现，跨较长等待期的因果连接更依赖会话与进程留存。
    en: Window-Context-Gated Follow-On Activity omits C2 or collection events that might otherwise appear continuously while
      the target window is absent. In that period, defenders may see only a resident process and window reads that default
      logs do not identify well. If a target window later appears, the follow-on chain emerges in a shorter interval, making
      correlation across the wait depend on session and process retention.
  - zh: 该效果并不遮蔽命中后的网络或截图，也不保证恶意进程不被其他规则发现。窗口条件必须确实控制结果；合法自动化同样可能等到窗口出现再执行操作，传感器缺失时不能从结果时间单独证实恶意谓词。
    en: The effect does not hide post-match network or capture events and does not prevent other rules from finding the malicious
      process. The window condition must actually control the result. Legitimate automation can also wait for a window, and
      outcome timing alone cannot establish a malicious predicate when sensor evidence is absent.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入可证实的窗口状态读取与条件性后继结果：同一主体在窗口谓词不满足时不执行所述后继动作，命中后才开始。标题、焦点与窗口所属进程可共同形成条件，但只按进程名选择而没有窗口输入的行为不归此子项。
    en: 'Include a demonstrable window-state read and conditional follow-on result: the same actor withholds the described
      later action while the window predicate is false and starts it when the predicate matches. Title, focus, and owning
      process may jointly form the condition, but process-name-only selection without a window input is outside this child.'
  - zh: 一般窗口清单、持续截图、只按浏览器 URL 观察以及为判断沙箱而检查用户活动不自动归入。后继截图属收集，C2 属命令控制，分析环境判断属 T1497；屏幕阅读器、RPA 和远程支持的等待窗口行为需要业务 owner 与批准动作反证。
    en: A general window list, continuous screenshots, URL-only browser observation, and user-activity checks for sandbox
      judgment do not automatically qualify. Follow-on capture belongs to Collection, C2 to Command and Control, and analysis-environment
      judgment to T1497. Screen-reader, RPA, and remote-support window waits require business owner and approved-action context
      as counterevidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 银行木马可在受控工作站等待用户打开目标浏览器窗口，命中银行相关名称后再启动密集通信与人工操作；间谍组件也可仅在选定应用开放时截图。该设计使恶意结果与真实用户操作相邻，但如果用户不进入目标情境，攻击者可能长期得不到所需反馈。
      en: A banking trojan can wait on a controlled workstation until the user opens a target browser window, then start intensive
        communication and operator action after a bank-related name matches. Espionage components can likewise capture only
        selected applications. This places malicious outcomes near real user activity, but the adversary may get no desired
        feedback if the user never enters the target context.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可访问目标交互会话的驻留代码，能够读取窗口标题或焦点并定义稳定的匹配条件；还需让后继功能受此条件控制。等待窗口出现会推迟目标行动，过窄或变化的标题会漏掉机会，跨进程注入则增加实现和归因复杂度。
        en: The adversary needs resident code able to access the interactive session, read title or focus, define a stable
          match condition, and gate a later capability. Waiting delays action, narrow or changing titles can miss opportunities,
          and process injection adds implementation and attribution complexity.
    defender_model:
      paragraphs:
      - zh: 防守方若同时持有经验证的 GUI 调用/窗口时间线、进程谱系以及网络或截图结果，可比较命中前后并验证同一主体的条件链。仅有 Sysmon 1/3/10 时，看不到普通窗口查询与谓词本身；但命中后的频繁连接、文件或截图结果仍可能显著。
        en: With validated GUI-call and window timelines, process lineage, and network or capture outcomes, defenders can
          compare pre- and post-match activity and test the condition chain for one actor. Sysmon 1/3/10 alone does not expose
          ordinary window reads or the predicate itself, although frequent post-match connections, files, or capture outcomes
          may remain conspicuous.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 窗口条件未满足时抑制后继事件，延迟其进入常规告警视野
    en: Withhold follow-on events until a window condition matches, delaying their entry into ordinary alerting
  analysis:
    paragraphs:
    - zh: 攻击者在进程内反复读取前台或标题状态，把后继功能的启动绑定到匹配结果。条件未满足时，Grandoreiro 不发出所述 C2 请求，因此只依赖网络结果的检测在等待期没有这段后继活动可关联；标准进程记录也不揭示内部窗口谓词。目标窗口出现后，通信重新变得可见且可能频繁，故匿迹只作用于未命中时段与完整链条的重构成本。
      en: The adversary repeatedly reads foreground or title state in-process and binds activation of a later capability to
        the match. While false, Grandoreiro emits none of the described C2 requests, so result-only network detection has
        no such follow-on activity to join during the wait; ordinary process records also do not reveal the internal window
        predicate. After a target window appears, communication becomes visible and can be frequent, so stealth is limited
        to the unmatched period and the cost of reconstructing the whole chain.
