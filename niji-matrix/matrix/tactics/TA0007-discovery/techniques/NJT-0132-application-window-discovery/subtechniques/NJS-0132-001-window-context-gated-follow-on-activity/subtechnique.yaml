research:
  limitations:
    paragraphs:
    - zh: Grandoreiro 资料证实银行相关窗口条件控制 C2 启动，但未披露具体调用序列或所有版本的相同实现。Attor 同时按进程名或窗口标题选择截图，不能把该案例简化为纯窗口标题门控；两者均无可外推的检测率估计。
      en: Grandoreiro establishes bank-related window control of C2 initiation but does not disclose the exact call sequence
        or guarantee identical implementation across every version. Attor selects capture by process name or window title,
        so it is not a pure title-gating case. Neither supplies a generalizable detection-rate estimate.
    - zh: 检测依赖能把窗口状态归于调用进程的额外传感器，其字段和性能必须在本地试点验证。动态标题、受保护桌面、合法辅助功能与进程注入均会削弱归因；只看到“某窗口出现后有网络连接”不足以判定子项。
      en: Detection depends on an additional sensor that attributes window state to the caller, with fields and performance
        validated locally. Dynamic titles, protected desktops, legitimate accessibility, and process injection weaken attribution;
        a network connection after some window appears is insufficient to classify the child.
