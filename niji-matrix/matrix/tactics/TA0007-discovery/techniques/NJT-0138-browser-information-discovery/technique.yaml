schema_version: 2.0.0
type: technique
id: NJT-0138
name:
  zh: 浏览器信息发现
  en: Browser Information Discovery
summary:
  zh: 读取已保留的浏览历史、书签和配置以恢复用户曾使用的站点及环境入口，使本次发现不必生成相应新导航。
  en: Read retained history, bookmarks, and configuration to recover sites and environment entry points previously used by
    the user without necessarily creating corresponding new navigation.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-adapted
    source_attack_id: T1217
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1217
definition_and_concept:
  paragraphs:
  - zh: 浏览器信息发现是攻击者在取得主机或用户配置访问后，读取浏览器先前保存的书签、访问历史标题与 URL、偏好或扩展设置，从中辨认用户曾接触的内部入口、外部服务和工作路径。直接目标是建立后续行动可用的浏览上下文，而不是在本次操作中访问那些站点。
    en: Browser Information Discovery occurs when an adversary with host or user-profile access reads previously saved bookmarks,
      history titles and URLs, preferences, or extension settings to identify internal entry points, external services, and
      work paths used by the user. Its immediate goal is a browsing-context map for later action, not visiting those sites
      during the present operation.
  - zh: 浏览器是记录的载体，不是子技术划分依据。固定 ATT&CK 父行为还可能包含账户和凭据线索；本 Niji 范围有意聚焦保留的站点与使用脉络，真正取得账户清单、密码、Cookie 或会话令牌时按各自直接信息对象另记。
    en: The browser carries the records rather than defining child partitions. The fixed ATT&CK parent can also contain account
      and credential clues; this Niji scope focuses on retained sites and usage context. Actual acquisition of an account
      list, password, cookie, or session token is recorded under its own direct information object.
stealth_characteristics:
  paragraphs:
  - zh: 已存历史让攻击者知道用户曾去过哪些站点，却无需为了本次发现重新向这些站点发请求。只从代理或当前浏览器导航流重构环境测绘的防守方可能看不到这个端点读取环节；这一观察差由 ICONICSTEALER 实际历史提取和浏览器配置架构共同支持，不能升级为该样本已被证实有避审计动机。
    en: Stored history can tell the adversary which sites a user visited without new requests to those sites for the present
      discovery. A defender reconstructing discovery only from proxy or current navigation records may miss the endpoint read.
      ICONICSTEALER’s observed history extraction and browser-profile architecture support that observation difference, not
      a proven audit-evasion motive for the sample.
  - zh: 浏览器配置读取本身仍可能留下进程、对象访问、临时输出与外联痕迹。历史可能来自很早之前、被策略删除或漫游到另一设备，因此当前日志与取得内容的时间并不一致；只有配置目标文件的读审计并结合客户端基线，才能把普通恢复或同步与异常读取区分。
    en: Browser-profile reads can still leave process, object-access, temporary-output, and outbound traces. History may be
      old, deleted by policy, or roamed to another device, so current logs need not align with the time of the visited content.
      Targeted read auditing and client baselines are needed to separate ordinary restoration or sync from abnormal consumption.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入恶意主体为识别入口或工作模式而消费已保留的站点、访问顺序和浏览器配置。书签、历史、偏好可来自不同文件或数据库，但只有直接所得信息及其观察变化决定归属；恶意程序同时收集多类数据时可以对各直接行为分别标注。
    en: Include adversarial consumption of retained sites, visit sequence, and browser configuration to identify entry points
      or work patterns. Bookmarks, history, and preferences may reside in different files or databases, but the information
      obtained and its observation change determine scope. A program collecting several kinds of data can receive separate
      labels for each direct act.
  - zh: NJT-0131 主持账户标识集合，NJT-0132 主持当前窗口与焦点；密码、Cookie 和令牌提取属于凭据访问，正文下载、打包与外传属于后继收集或外传。正常配置迁移、索引、备份、用户恢复和事件响应也会读这些文件，不能仅凭路径或
      4663 事件认定恶意。
    en: NJT-0131 owns sets of account identifiers and NJT-0132 owns current windows and focus. Password, cookie, and token
      extraction belongs to Credential Access, while body download, packaging, and exfiltration are later acts. Normal profile
      migration, indexing, backup, user recovery, and incident response also read these files, so a path or a 4663 event alone
      does not establish maliciousness.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在受控交互工作站或可读的用户配置目录上，攻击者可先从书签和历史找出内部仪表板、金融站点或日常服务，再选择值得接触的下一目标。Volexity 观察到 3CX 供应链样本读取多种浏览器的历史并交给上游组件；CISA 联合通告记录书签枚举，但后者是多事件综合，不应伪装为一条完整单案时间线。
      en: On a controlled workstation or readable user profile, an adversary can inspect bookmarks and history for internal
        dashboards, financial sites, or daily services before selecting a next target. Volexity observed a 3CX supply-chain
        sample reading history from several browsers and passing it upstream. A CISA joint advisory reports bookmark enumeration,
        but it combines incidents and is not one complete case timeline.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要用户级文件访问、可读的配置副本，或能代表用户读取浏览器记录的执行路径。SQLite 文件状态、配置权限与实际浏览器部署会约束读取方法；若要从云或另一端点取同步副本，还须另证该副本、会话与同步范围，不能默认赋予攻击者浏览器云账户。
        en: The adversary needs user-level file access, a readable profile copy, or an execution path able to read browser
          records for the user. SQLite file state, profile permissions, and actual browser deployment constrain the method.
          Reading a synchronized copy from the cloud or another endpoint additionally requires proof of that copy, session,
          and sync scope; browser-cloud account control is not assumed.
    defender_model:
      paragraphs:
      - zh: 防守方可能保留网页代理、进程、文件对象与网络结果，但各层记录不同时间和位置。代理只看真正发出的导航；在 Windows 上需对目标配置路径启用读对象审计并验证 4663，才能把当前文件读取与进程和后继结果关联。默认 Sysmon
          文件创建事件不等于读事件，未覆盖应用内读取时仍有盲区。
        en: The defender may retain web-proxy, process, file-object, and network outcomes, each covering a different time
          and place. Proxy data sees actual navigation. On Windows, target-path read auditing and verified 4663 are needed
          to join the present file read to process and later outcomes. A default Sysmon file-create event is not a read event,
          and in-browser access remains a blind spot where uninstrumented.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 复用已存浏览记录使本次发现离开新网页导航观察面
    en: Reuse stored browsing records so the current discovery leaves the fresh web-navigation surface
  analysis:
    paragraphs:
    - zh: 攻击者选择读取历史与书签，在不重新接触相关站点的情况下恢复入口清单。于是本次发现的主要痕迹落在端点配置读取而非相同站点的新 HTTP 请求；只靠网页访问量或新域名记录的防守分析可能低估其已知入口。进程、配置读和资料发送仍可被其他通道观察，Volexity
        的样本说明实际读取，厂商文档说明保留机制，但没有案例证明攻击者专为逃避导航审计而这样做。
      en: The adversary reads history and bookmarks to recover entry points without contacting the corresponding sites again.
        The present discovery therefore leaves its main trace in endpoint profile access rather than fresh HTTP requests to
        those sites; defense based only on visit volume or new domains can underestimate the entry points learned. Process,
        profile read, and transfer remain observable elsewhere. Volexity establishes an actual read and vendor documentation
        the retention mechanism, but no case proves the actor chose it specifically to evade navigation audit.
  evidence_refs:
  - REF-000518
  - REF-000519
  - REF-000379
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前没有证据同时支持独立恶意使用、稳定痕迹差和不同防御方法的浏览器信息子项。本地已存记录读取是父级核心，不另复制为子项；同步副本、历史时间谓词、分批重读和浏览器内扩展路径已分别检索，但案例未把这些变量与实际规避效果连起来。
      en: No browser-information child currently has evidence for independent adversarial use, a stable trace difference,
        and a distinct defense method together. Reading locally retained records belongs to the parent behavior rather than
        warranting a duplicate child. Synchronized copies, history-time predicates, batched rereads, and in-browser extension
        paths were each searched, but incidents do not connect these variables to an actual evasion effect.
    - zh: 未来若取得同案同步副本访问、时间筛选代码或跨时段读取序列，再按可控变量和防守观察差重新裁定。浏览器品牌、记录字段和本地数据库格式本身不能形成兄弟边界，因此当前 coverage 为 deferred。
      en: Same-incident synchronized-copy access, time-selection code, or repeated-read timelines could support a future decision
        based on controlled variable and defender observation. Browser brands, record fields, and local database formats do
        not themselves create sibling boundaries, so coverage is deferred.
  coverage: deferred
  subtechnique_refs: []
