schema_version: 2.0.0
type: technique
id: NJT-0180
name:
  zh: 设备驱动程序发现
  en: Device Driver Discovery
summary:
  zh: 枚举本机驱动名称、包、版本、安装或加载状态与设备能力，并借用日常诊断和资产清单外观降低单事件可区分性。
  en: Enumerate local driver names, packages, versions, installation or load state, and device capabilities while resembling
    routine diagnostics and asset inventory.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-adapted
    source_attack_id: T1652
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1652
definition_and_concept:
  paragraphs:
  - zh: 设备驱动程序发现是攻击者查询本机驱动及相关元数据，以取得名称、版本、驱动包、安装状态、加载或活动状态、加载地址和设备能力的行为。这些事实可用于理解主机功能、防护组件、虚拟化线索或潜在后继机会。
    en: Device Driver Discovery queries local drivers and related metadata to obtain names, versions, packages, installation
      state, loaded or active state, load addresses, and device capabilities. These facts can reveal host function, defensive
      components, virtualization clues, or later opportunities.
  - zh: 系统工具、API 和驱动相关注册表只是取得路径。父技术区分“查询发生”“接口报告成功”和“取得有效事实”；安装、加载、利用或修改驱动是独立后继行为。
    en: System utilities, APIs, and driver-related registry locations are retrieval paths. The parent separates occurrence
      of a query, interface-reported success, and acquisition of a usable fact. Driver installation, loading, exploitation,
      or modification is a separate later act.
stealth_characteristics:
  paragraphs:
  - zh: 驱动枚举常使用与资产管理、兼容性检查、打印支持和故障排查相同的原生工具或接口。已签名进程和只读查询仍会留下命令行、注册表或 API 痕迹，但单事件难表达操作者是维护系统还是寻找安全产品、虚拟化驱动或易受攻击版本。
    en: Driver enumeration often uses the same native tools or interfaces as asset management, compatibility checks, print
      support, and troubleshooting. Signed processes and read-only queries still leave command-line, registry, or API traces,
      but one event poorly expresses whether the actor is maintaining the system or seeking a security product, virtualization
      driver, or vulnerable version.
  - zh: 结果语义本身还可能误导防守方。PnPUtil 显示驱动包而非当前加载状态，driverquery 输出可能不可靠；Windows 11 24H2 起 EnumDeviceDrivers 无 SeDebugPrivilege 时可以返回成功但地址全
      NULL。缺少 OS build、权限和权威资产基线时，防守方可能把失败或不完整结果解释成真实环境状态。
    en: Result semantics can also mislead defenders. PnPUtil shows driver packages rather than current load state and driverquery
      can be unreliable. Starting with Windows 11 24H2, EnumDeviceDrivers can report success while returning all-NULL addresses
      without SeDebugPrivilege. Without OS build, privilege, and an authoritative asset baseline, incomplete or failed results
      can be mistaken for real environment state.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入驱动名称、包、版本、存在性、安装/加载状态、地址或能力的查询。普通应用、服务和进程清单分别归其发现技术；只有当驱动明确映射到安全产品时才可另记 Security Software Discovery。
    en: Include queries for driver names, packages, versions, presence, installation or load state, addresses, or capabilities.
      Ordinary applications, services, and processes belong to their own discovery techniques. Security Software Discovery
      is additionally supported only where a driver is explicitly resolved to a protection product.
  - zh: 以驱动线索判断沙箱并改变行为时可另记 T1497；获取、投放、安装或使用易受攻击驱动及实际触发漏洞属于 BYOVD、驱动加载或漏洞利用。合法资产清单、驱动部署、打印支持、取证、安全代理和诊断是强反例。
    en: T1497 can also apply where a driver clue is used to judge a sandbox and change behavior. Acquiring, dropping, installing,
      or using a vulnerable driver and triggering a vulnerability belong to BYOVD, driver loading, or exploitation. Asset
      inventory, driver deployment, print support, forensics, security agents, and diagnostics are strong counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者进入 Windows 主机后，可运行 driverquery、PnPUtil、读取驱动注册表或调用 EnumDeviceDrivers，以确认打印能力、安全组件、已加载模块或可能的后继利用对象。CISA 直接记录 Medusa
        在受害网络执行 driverquery，但未披露它取得的具体驱动结果。
      en: After entering a Windows host, an adversary can run driverquery or PnPUtil, read driver registry state, or call
        EnumDeviceDrivers to check print capability, security components, loaded modules, or potential later targets. CISA
        directly records Medusa executing driverquery in victim networks but does not disclose the specific returned drivers.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要执行工具、读取相应注册表或调用 API 的本机权限。能否取得有效加载地址还受 Windows build 与 SeDebugPrivilege 约束；发现某驱动并不赋予加载、修改或利用能力。
        en: The adversary needs local authority to execute utilities, read relevant registry state, or call APIs. Usable load
          addresses also depend on Windows build and SeDebugPrivilege. Discovering a driver does not grant capability to load,
          modify, or exploit it.
    defender_model:
      paragraphs:
      - zh: 防守方可关联进程/命令行、注册表读取、经验证 API telemetry 和按主机角色维护的驱动包/安装/加载基线。基础日志通常看不到用户态 API 输出；工具输出未采集、进程注入和被盗管理代理会造成盲区。
        en: Defenders can join process and command line, registry reads, validated API telemetry, and package, installation,
          and load baselines by host role. Basic logs usually do not expose user-mode API output, while uncollected utility
          output, process injection, and stolen management agents create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 驱动查询外观接近日常资产与兼容性检查
    en: Driver queries resemble routine asset and compatibility checks
  analysis:
    paragraphs:
    - zh: 攻击者借用 driverquery、PnPUtil 或正常系统 API 查询驱动，留下与资产、兼容性和故障排查相同的进程或接口外观。防守方仅凭签名工具或一次只读调用难以判断目的；将调用者流行度、父进程、查询结果语义和后继行为与权威驱动基线结合后，可区分性提高。Medusa
        证明恶意枚举，Microsoft 文档证明结果差异，但没有实测漏报，故置信度为 medium。
      en: The adversary uses driverquery, PnPUtil, or normal system APIs, leaving process or interface appearance shared with
        asset, compatibility, and troubleshooting work. A signed utility or one read call poorly reveals purpose. Caller prevalence,
        parent, result semantics, later behavior, and an authoritative driver baseline improve distinction. Medusa establishes
        malicious enumeration and Microsoft documents result differences without measuring misses, so confidence is medium.
  evidence_refs:
  - REF-000824
  - REF-000825
  - REF-000826
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 驱动包/安装/加载/能力状态、接口、权限和发现目的均已审查。状态语义需要保留在父级结果中，但当前恶意案例不足以证明这些状态拥有稳定、独立的痕迹拓扑和不同防御；接口和厂商则可替换并会无限扩张。
      en: Package, installation, load or capability state, interface, privilege, and purpose were reviewed. State semantics
        belong in parent results, but current incidents do not establish stable independent trace topologies and distinct
        defenses for those states. Interfaces and vendors are replaceable and would expand without bound.
    - zh: 基于驱动结果的沙箱判断、BYOVD 或漏洞选择由相邻技术和后继结果界定。当前没有轴满足正式 NJS 门禁，coverage 为 deferred，子项为空。
      en: Sandbox judgment, BYOVD, or exploit selection based on driver results is bounded by adjacent techniques and later
        outcomes. No axis passes formal NJS gates, so coverage is deferred and the child set is empty.
  coverage: deferred
  subtechnique_refs: []
