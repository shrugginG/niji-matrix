schema_version: 2.0.0
type: technique
id: NJT-0182
name:
  zh: 文件与目录发现
  en: File and Directory Discovery
summary:
  zh: 取得主机或网络文件系统的路径、名称、层级与列表属性，并借用普通浏览、索引和运维枚举外观降低单事件可区分性。
  en: Obtain paths, names, hierarchy, and listing attributes from host or network filesystems while resembling ordinary browsing,
    indexing, and operational enumeration.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1083
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1083
definition_and_concept:
  paragraphs:
  - zh: 文件与目录发现是攻击者取得主机或网络文件系统中的路径、文件和目录名称、层级、存在性以及列表属性，以选择后继读取、收集、执行或影响目标的行为。直接结果是命名空间事实而不是文件正文。
    en: File and Directory Discovery obtains paths, file and directory names, hierarchy, existence, and listing attributes
      from a host or network filesystem so the adversary can select later read, collection, execution, or impact targets.
      The direct result is a namespace fact rather than file content.
  - zh: 结果可以来自目录列表、递归搜索、路径存在性或属性查询、已知共享内浏览，或对保存路径和名称的索引视图进行实际查询。命令、GUI、远控浏览、脚本和原生 API 只是实现；执行过搜索工具不能替代实际结果语义。
    en: Results can come from directory listings, recursive search, path existence or attribute queries, browsing inside a
      known share, or an actual query of an indexed view storing paths and names. Commands, GUIs, remote browsing, scripts,
      and native APIs are implementations; executing a search tool does not substitute for result semantics.
stealth_characteristics:
  paragraphs:
  - zh: 文件命名空间读取与用户浏览、索引、备份、杀毒、构建和运维使用同样的 list、directory entry 或搜索功能。攻击者使用 dir、find、Everything 或原生接口时，单个签名工具或目录访问事件难表达是正常使用还是目标筛选。
    en: Filesystem namespace reads use the same list, directory-entry, or search facilities as user browsing, indexing, backup,
      antivirus, builds, and operations. When an adversary uses dir, find, Everything, or native interfaces, one signed utility
      or directory-access event poorly expresses whether the activity is ordinary use or target selection.
  - zh: 进程、命令行、对象访问、SMB share 和经配置 POSIX audit 仍能提供主体与范围。索引化查询可能把观察面从逐目录读取转到索引服务或 catalog，但 Mimic 案例只证明恶意使用 Everything，不证明攻击者为规避目录审计选择索引或实际减少事件。
    en: Process, command line, object access, SMB share, and configured POSIX audit can still provide actor and scope. Indexed
      queries may shift observation from per-directory reads to an index service or catalog, but the Mimic case establishes
      malicious Everything use rather than deliberate selection to evade directory audit or measured event reduction.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入路径、名称、层级、存在性和列表属性的取得。找到浏览器数据库路径可记 T1083，解析其 URL/历史归 NJT-0138；挂载或 SMB 文件系统路径属于 T1083，而对象服务内 key/prefix 归 NJT-0141。
    en: Include acquisition of paths, names, hierarchy, existence, and listing attributes. Finding a browser database path
      can be T1083, while parsing its URLs or history belongs to NJT-0138. Mounted or SMB filesystem paths are T1083, whereas
      keys or prefixes in an object service belong to NJT-0141.
  - zh: 打开正文、复制、批量收集、暂存、压缩和外传是后继行为；名称搜索不证明凭据已取得。隐藏属性可作为列表结果，但创建或设置隐藏对象是另一行为。用户浏览、备份、索引、杀毒、开发工具和取证是强反例。
    en: Opening bodies, copying, bulk collection, staging, archiving, and exfiltration are later acts, and a name search does
      not establish credential acquisition. Hidden attributes can be listing results, while creating or setting hidden objects
      is separate. User browsing, backup, indexing, antivirus, developer tools, and forensics are strong counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者进入端点或已知网络共享后，可先搜索文档、配置、密钥线索、备份或工具路径，再决定读取、加密或执行哪些对象。CISA 通告记录恶意文件/目录枚举，TrendAI 记录 Mimic 使用 Everything 能力定位后继加密目标；列表本身不证明正文已读。
      en: After entering an endpoint or known network share, an adversary can search documents, configurations, key clues,
        backups, or tool paths before choosing what to read, encrypt, or execute. CISA reports adversarial file and directory
        enumeration, and TrendAI records Mimic using Everything to locate later encryption targets. Listing alone does not
        establish a body read.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能浏览目标命名空间的本地、共享或受控进程权限；可见范围受 ACL、share、mount namespace、reparse point、索引时效和当前工作目录限制。查询谓词、根路径和节奏可控，但当前没有证据证明这些参数形成独立匿迹子项。
        en: The adversary needs local, share, or controlled-process authority to browse the target namespace. ACLs, shares,
          mount namespaces, reparse points, index freshness, and working directory constrain visibility. Query predicates,
          roots, and cadence are controllable, but current evidence does not establish those parameters as independent stealth
          children.
    defender_model:
      paragraphs:
      - zh: 防守方可结合进程/脚本、Windows 4663/5145 或经配置 Linux audit，按主体、根路径和范围重构枚举。SACL/audit rule 必须预先启用，返回名称集合通常不在日志中；GUI、索引服务、代理共享和高事件量会造成盲区。
        en: Defenders can combine process or script, Windows 4663 or 5145, and configured Linux audit to reconstruct enumeration
          by actor, root, and scope. SACLs or audit rules must be enabled in advance, returned names are generally absent
          from logs, and GUIs, index services, proxied shares, and event volume create blind spots.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 命名空间枚举外观接近普通浏览、索引和运维工作
    en: Namespace enumeration resembles ordinary browsing, indexing, and operations
  analysis:
    paragraphs:
    - zh: 攻击者使用原生目录工具、文件浏览器或索引查询取得路径列表，其接口与普通用户、备份、杀毒和开发流程相同。单次 ls、dir、Get-ChildItem 或 Everything 查询缺乏恶意目的；只有将异常主体、根路径、范围、时间和后继访问与批准作业比较，才能恢复可区分性。CISA
        和 Mimic 证明恶意使用，没有漏报测量，故置信度为 medium。
      en: The adversary uses native directory tools, file browsers, or index queries whose interfaces are shared with users,
        backup, antivirus, and development workflows. One ls, dir, Get-ChildItem, or Everything query lacks malicious purpose.
        Distinction requires comparing abnormal actor, root, scope, time, and later access with approved work. CISA and Mimic
        establish malicious use without miss-rate measurement, so confidence is medium.
  evidence_refs:
  - REF-000835
  - REF-000836
  - REF-000837
  - REF-000838
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 索引化命名空间查询、窄谓词与目标范围、时间稀释及多来源分散已分别审查。索引轴最可能改变逐目录与 catalog 的观察面，但缺同案直接遍历对照、实际 query telemetry 和攻击者规避选择；窄谓词与节奏也是正常交互或备份行为。
      en: Indexed namespace queries, narrow predicates and target scope, temporal dilution, and multi-origin dispersion were
        reviewed separately. Indexing is most likely to shift observation from per-directory reads to a catalog, but lacks
        same-case direct-traversal comparison, actual query telemetry, and adversarial evasion choice. Narrow predicates and
        cadence are also ordinary interactive or backup behavior.
    - zh: CLI/GUI/API、平台、路径类型、文件类别和隐藏属性都属于实现或结果类别，不形成兄弟项。没有轴通过结论级门禁，coverage 为 deferred，正式子项为空。
      en: CLI, GUI, API, platform, path type, file class, and hidden attribute are implementations or result classes rather
        than sibling children. No axis passes conclusion-level gates, so coverage is deferred and the formal child set is
        empty.
  coverage: deferred
  subtechnique_refs: []
