schema_version: 2.0.0
type: technique
id: NJT-0231
name:
  zh: 组策略发现
  en: Group Policy Discovery
summary:
  zh: 取得 Windows 组策略的配置、应用范围或实际生效结果，并借用合法策略读取与故障诊断接口降低发现行为的目的可区分性。
  en: Obtain Windows Group Policy configuration, application scope, or applied results while reusing legitimate policy-reading
    and diagnostic interfaces that make discovery intent harder to distinguish.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1615
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1615
definition_and_concept:
  paragraphs:
  - zh: 组策略发现是攻击者取得组策略对象及其链接、作用范围、权限、设置或实际应用结果，以理解域和端点安全配置并选择后续行动的环境测绘行为。直接目标是策略信息，而不是更改策略、触发载荷或取得认证秘密；发现的结果可以支持识别可操纵对象、评估安全措施及判断某个用户或计算机实际受到哪些配置约束。
    en: Group Policy Discovery is the acquisition of Group Policy objects and their links, application scope, permissions,
      settings, or applied results to understand domain and endpoint security configuration and select subsequent actions.
      Its direct objective is policy information rather than changing policy, triggering a payload, or obtaining authentication
      secrets. Results can support identification of manipulable objects, assessment of security measures, and understanding
      of configuration constraints actually affecting a user or computer.
  - zh: 域 GPO 的目录容器与 SYSVOL 模板承载不同组成部分；读取目录属性可取得对象及应用线索，读取策略文件可取得设置内容，而结果策略集提供某个目标实际应用后的视图。几者不能自动互相替代，已配置、可读和已应用也不是同一事实。命令、管理控制台、脚本及原生
      API 是信息取得方式，不独立决定匿迹分类。
    en: A domain GPO's directory container and SYSVOL template hold different components. Directory attributes expose objects
      and application clues, policy files expose setting content, and the Resultant Set of Policy supplies a view after application
      to a particular target. These views are not automatically interchangeable, and configured, readable, and applied are
      different facts. Commands, management consoles, scripts, and native APIs are acquisition methods rather than independent
      stealth categories.
stealth_characteristics:
  paragraphs:
  - zh: 组策略发现与日常故障诊断、合规核查及正常策略处理共享接口。攻击者执行 gpresult 或读取 GPO 时，单次事件可能仅表现为受信工具的报表请求、目录读取或 SYSVOL 访问；相同主体本来就可能具有相应读取权，因而工具签名、成功认证与授权成功都不能解释其真实目的。匿迹收益来自这种外观和语义上的重叠，而不是策略读取必然没有痕迹。
    en: Group Policy Discovery shares interfaces with routine troubleshooting, compliance checking, and normal policy processing.
      An adversary's gpresult execution or GPO read can appear in one event as a trusted utility's reporting request, directory
      read, or SYSVOL access. The principal may already possess the relevant read rights, so a tool signature, successful
      authentication, or granted authorization does not explain its purpose. The stealth advantage comes from this overlap
      in appearance and meaning rather than an inherent absence of traces.
  - zh: 进程谱系、命令参数、经配置的目录或文件访问审计、共享访问检查以及策略处理上下文仍可保留主体和目标线索。读取面之间存在观察差异：目录读取不证明取得模板内容，5145 访问检查不证明返回了字节，已有的本地结果也不代表域中所有 GPO
      的当前状态。只有预先验证传感器与审计配置，并把请求主体、源设备、策略标识和批准任务连接起来，才能评估这些重叠对识别的实际影响。
    en: 'Process lineage, command arguments, configured directory or file auditing, share authorization checks, and policy-processing
      context can still retain actor and target clues. Read planes have different observation semantics: a directory read
      does not establish retrieval of template content, a 5145 access check does not establish returned bytes, and an existing
      local result does not represent the current state of every domain GPO. Assessing the actual effect of the overlap requires
      validated sensors and audit configuration plus joins across requester, source device, policy identifier, and approved
      work.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入以理解组策略为直接目的的 GPO 标识、属性、链接、权限、策略文件和本地或远端结果策略集读取。已识别为策略对象的标识与关系本身就是策略信息，不要求每次取得完整模板内容；仅列普通文件或路径而没有识别策略对象、属性或应用关系时，归入
      NJT-0182 文件与目录发现。一般账户、组和信任枚举仍由各自技术负责，文件或注册表查询应按取得的信息语义判断，而不是按命令名称归类。
    en: Include reads of GPO identities, properties, links, permissions, policy files, and local or remote resultant-policy
      data whose direct purpose is understanding Group Policy. Identities and relationships already recognized as policy objects
      are policy information without requiring complete template retrieval every time. A generic file or path listing without
      policy-object identity, attributes, or application relationships belongs to NJT-0182 File and Directory Discovery. General
      account, group, and trust enumeration retains its own owner; classify file or registry queries by the information acquired
      rather than the command name.
  - zh: 修改 GPO、链接或 SYSVOL 内容属于策略变更边界，可能由 NJT-0100 集中策略与信任状态篡改或 NJT-0125 集中防御策略削弱负责；发现有写权并不证明已经修改。读取首选项文件中的认证秘密属于 NJT-0229
      未保护的认证秘密取得，不能因同处 SYSVOL 就归入本技术；策略触发的执行和持久控制同样是后续行为。获批支持、审计、策略建模和正常客户端刷新是强反例，必须有攻击上下文或异常任务关联，不能将普通策略读取直接认定为恶意匿迹。
    en: Changing a GPO, link, or SYSVOL content crosses into policy mutation and can belong to NJT-0100 Central Policy and
      Trust-State Mutation or NJT-0125 Central Defensive-Policy Impairment; discovering write authority does not establish
      that a change occurred. Acquiring authentication secrets from preference files belongs to NJT-0229 Unprotected Authentication
      Secret Acquisition and does not become this technique merely because SYSVOL is involved. Policy-triggered execution
      and persistent control are also subsequent behaviors. Approved support, auditing, modeling, and normal client refresh
      are strong counterexamples, so attack context or abnormal task linkage is required before treating an ordinary policy
      read as malicious evasion.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在 Windows 主机或域身份已失陷后，操作者可查询当前用户或计算机的结果策略，或进一步读取可达的域策略对象，判断安全设置和管理作用域如何影响下一步活动。ESET 记录的 ComRAT 调查展示了 gpresult 与其他主机、网络和目录调查命令共同出现；它支持入侵后使用该父行为，但未公开完整策略输出、每个命令的成功状态或基于结果选择的具体攻击路径。
      en: After a Windows host or domain identity is compromised, an operator can query resultant policy for the current user
        or computer or inspect reachable domain policy objects to understand how security settings and management scope affect
        the next action. ESET's ComRAT investigation shows gpresult among other host, network, and directory survey commands.
        It supports post-compromise use of the parent behavior but does not publish complete policy output, the success of
        every command, or the exact attack path selected from the results.
    - zh: 域策略清单与某台端点的实际生效结果适用于不同问题。前者可揭示可读对象和配置关系，后者可核实本机已应用的约束；安全筛选、继承、客户端扩展及结果时效会造成差异。攻击者必须接受读取权限制和视图不完整的代价，不能仅凭看到一个 GPO
        就断言它已作用于某个目标。
      en: A domain policy inventory and the applied result on one endpoint answer different questions. The former reveals
        readable objects and configuration relationships, while the latter checks constraints applied locally; security filtering,
        inheritance, client-side extensions, and result freshness can produce differences. The adversary must accept read-right
        limitations and incomplete views and cannot infer application to a target merely from seeing a GPO.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者具有可执行本地诊断或读取可达策略信息的受陷进程、用户或计算机上下文。域级 LDAP 或 SYSVOL 路径需要可达域控制器及相应认证与读取权，远端结果策略查询还受目标管理权限、防火墙和远程访问授权限制；这些条件并不等价于域管理员权限。攻击者可选择查询对象、范围和输出方式，但不能假定任意用户都能读取所有策略或其他用户的完整结果。
        en: The adversary has a compromised process, user, or computer context capable of running local diagnostics or reading
          reachable policy information. Domain LDAP or SYSVOL paths require connectivity to a domain controller and the relevant
          authentication and read rights; remote resultant-policy queries also depend on target administration rights, firewall
          reachability, and remote-access delegation. These prerequisites do not imply domain-administrator authority. The
          adversary can choose objects, scope, and output, but arbitrary access to every policy or another user's complete
          results must not be assumed.
      - zh: 本父级的匿迹判断假设防守方难以从正常策略读取中区分攻击者的调查目的，而不假设攻击者能关闭审计或控制 Group Policy 服务。若要进一步声称复用本地缓存、只读目录属性或特定时间选择减少了域侧痕迹，必须取得对应执行路径、缓存状态和传感器对照；目前资料不满足这些更窄的结论。
        en: The parent's stealth conclusion assumes defenders have difficulty distinguishing adversarial survey intent within
          normal policy reads; it does not assume the adversary can disable auditing or control the Group Policy service.
          A narrower claim that local-cache reuse, directory-only reads, or particular timing reduces domain-side traces requires
          the corresponding execution path, cache state, and sensor comparison, which the current material does not provide.
    defender_model:
      paragraphs:
      - zh: 防守方可具备客户端进程与脚本记录，以及域控制器侧按对象配置的读取审计。4662 依赖匹配的目录 SACL 和审计策略，记录对象、权限与主体但不保证包含完整 LDAP 谓词或返回值；5145 记录共享权限检查，文件 ReadData
          的 4663 需要预设 SACL。服务器侧进程通常不能代表原始客户端进程，登录标识也只能在同一服务器的事件范围内连接。
        en: Defenders can have client process and script records plus object-scoped read auditing on domain controllers. Event
          4662 depends on a matching directory SACL and audit policy and records object, rights, and principal without guaranteeing
          the full LDAP predicate or returned values. Event 5145 records share authorization, while file ReadData event 4663
          requires a preconfigured SACL. A server-side process generally does not identify the original client process, and
          logon identifiers must be joined within the same server's event context.
      - zh: 有效观察还需要 GPO GUID、目录对象与 SYSVOL 路径的映射，以及用户、计算机、管理源和批准诊断任务的基线。本地结果查询可只留下端点侧信息，遗漏域侧事件不能反推未查询；相反，正常策略处理产生的 LDAP 与共享读取也不能证明操作者主动调查。审计容量、加密流量、代理来源、保留期和客户端进程遥测缺失会限制跨面关联。
        en: Useful visibility also requires mappings across GPO GUIDs, directory objects, and SYSVOL paths plus baselines
          for users, computers, administration sources, and approved diagnostic jobs. A local result query may leave endpoint-side
          information alone, so missing domain-side events do not establish that no query occurred; conversely, normal policy-processing
          LDAP and share reads do not establish an operator's active survey. Audit capacity, encrypted traffic, proxied origins,
          retention, and missing client process telemetry limit joins across planes.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用合法策略诊断和读取接口使恶意调查难与正常管理区分
    en: Reuse legitimate policy diagnostics and read interfaces so adversarial surveying resembles ordinary administration
  analysis:
    paragraphs:
    - zh: 攻击者以 gpresult 等正常策略诊断工具或已有权读取的策略接口获得配置事实，使痕迹呈现为合法报表、目录或共享读取。Microsoft 文档证明这些接口服务于正常管理，ESET 则直接记录恶意操作者使用同一诊断命令；两者共同支持外观重叠会降低单事件目的可区分性的推断。该机理不依赖隐藏进程、删除日志或伪造策略结果，进程来源、请求范围和任务授权的完整关联仍能恢复识别能力。
      en: The adversary obtains configuration facts through normal policy diagnostics such as gpresult or policy interfaces
        already readable by its principal, giving the traces the appearance of legitimate reporting, directory, or share reads.
        Microsoft documents legitimate administration through these interfaces, and ESET directly records adversarial operators
        using the same diagnostic command. Together they support the inference that appearance overlap reduces intent distinguishability
        from one event. The mechanism requires neither process concealment, log deletion, nor forged results; complete joins
        across process origin, requested scope, and task authorization can restore distinction.
  confidence: medium
  evidence_refs:
  - REF-001211
  - REF-001213
  - REF-001049
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 已分别审查既有本地结果或缓存复用、目录与文件读取面选择、窄对象或属性范围、时间与客户端来源，以及控制台输出替代持久报表等变量。本地结果与缓存可能改变信息取得位置，但能力文档和 gpresult 案例尚未证明攻击者有意用它替代域侧查询或减少了哪些事件；缓存处理也可能联系域控制器，不能预设完全离线。其他轴缺乏同案痕迹与防御差异对照。
      en: The review separately examined existing local results or caches, directory versus file read planes, narrow object
        or attribute scope, timing and client origin, and console output instead of persistent reports. Local results and
        caches could change acquisition location, but capability documentation and the gpresult case do not establish deliberate
        substitution for domain queries or reductions in particular events. Cache processing can still contact a domain controller,
        so wholly offline operation must not be assumed. The other axes lack same-case trace and defensive comparisons.
    - zh: 不按 LDAP、SMB、CLI、GUI、产品、策略文件名或目标用户类别机械划分子项。没有候选轴通过有意控制、稳定边界、痕迹变化和结论级证据门禁，因此建议 taxonomy coverage 为 deferred，正式子项为空；后续若取得可验证对照，可重新评估，而不改变父技术准入。
      en: Do not mechanically create children from LDAP, SMB, CLI, GUI, products, policy filenames, or target-user classes.
        No candidate axis passes the gates for intentional control, stable boundary, trace change, and conclusion-level evidence,
        so taxonomy coverage should be deferred with an empty formal child set. Verifiable comparisons can reopen a candidate
        later without changing parent admission.
  coverage: deferred
  subtechnique_refs: []
