schema_version: 2.0.0
type: technique
id: NJT-0232
name:
  zh: 本地存储发现
  en: Local Storage Discovery
summary:
  zh: 取得目标主机可见的驱动器、磁盘和卷及其存储属性，读取请求可呈现为正常存储盘点与容量维护。
  en: Acquire drives, disks, volumes, and storage attributes visible to a target host through requests that can resemble ordinary
    inventory and capacity maintenance.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-adapted
    source_attack_id: T1680
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1680
definition_and_concept:
  paragraphs:
  - zh: 本地存储发现是攻击者在已访问环境中取得目标主机可见的驱动器、磁盘、分区、卷或挂载文件系统，以及容量、空闲空间、文件系统类型、卷标、标识和对应关系等存储事实的行为。这些信息帮助确定可用存储范围、后继文件查找根、数据暂存空间或影响目标；直接结果是存储对象和属性，而不是文件正文。
    en: Local Storage Discovery obtains drives, disks, partitions, volumes, or mounted filesystems visible to a target host,
      together with storage facts such as capacity, free space, filesystem type, label, identity, and relationships. These
      facts help identify available storage, roots for later file searches, staging capacity, or impact targets. The direct
      result is a storage object and its attributes rather than file content.
  - zh: 本地说明存储事实相对于目标主机的可见性，并不要求查询进程与被查询主机相同。原生命令、管理类、GUI 和进程内 API 都可提供结果；已有网络映射可以出现在逻辑驱动器列表中。主机名、盘符字符串或工具启动本身不足以证明查询返回了有效存储对象，云提供方的资源卷清单也不能替代客体操作系统的挂载和容量事实。
    en: Local describes visibility relative to the target host and does not require the querying process to run on that same
      host. Native commands, management classes, GUIs, and in-process APIs can provide results, and existing network mappings
      may appear in a logical-drive list. A hostname, drive-letter string, or tool launch alone does not prove a valid storage
      result, and a provider's provisioned-volume inventory does not substitute for guest operating-system mount or capacity
      facts.
stealth_characteristics:
  paragraphs:
  - zh: 本地存储发现借用文件管理器、安装器、容量监控、备份和故障处理已经需要的只读接口。相同的容量查询或逻辑磁盘枚举既可服务正常运维，也可用于恶意目标选择，单个受信工具名称或一次成功查询很难说明操作者意图。Volt Typhoon 的调查支持这类原生环境测绘实际发生，但没有给出存储查询专属的检测率。
    en: Local Storage Discovery borrows read interfaces already needed by file managers, installers, capacity monitoring,
      backup, and troubleshooting. The same capacity query or logical-disk enumeration can support operations or adversarial
      targeting, so a trusted tool name or one successful query says little about the controller's intent. Volt Typhoon reporting
      establishes adversarial native-environment mapping but provides no storage-query-specific detection rate.
  - zh: 命令参数、脚本内容、调用主体、会话、目标主机和后继访问仍然可以留下痕迹。进程内调用不一定产生独立子进程，主机进程日志也通常不保存返回的卷属性；这限制了只看进程创建的观察面，却不自动证明攻击者为绕过监控选择了该路径。配额、挂载命名空间、映射会话和访问权还可能让不同主体看到不同容量或驱动器集合。
    en: Arguments, script content, principal, session, target host, and later accesses can remain observable. In-process calls
      need not create a separate child process, and host process logs generally do not contain returned volume attributes.
      This limits process-creation visibility without proving deliberate attacker selection to evade monitoring. Quotas, mount
      namespaces, mapping sessions, and access rights can also give different principals different capacity values or drive
      sets.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入针对具体主机存储对象的身份、存在性、类型、容量、空闲空间、卷和文件系统状态查询，包括已映射驱动器的主机视图、云客体内存储状态以及 ESXi 设备和文件系统清单。磁盘、分区、卷和挂载点必须按实际结果区分；Get-PSDrive
      的非文件系统 provider 或指向普通目录的临时驱动器不得直接当作磁盘。只见启动或句柄时只能记录请求阶段，返回属性后才可确认相应事实。
    en: Include identity, existence, type, capacity, free-space, volume, and filesystem-state queries for a specific host's
      storage objects, including its existing mapped-drive view, cloud guest storage state, and ESXi device or filesystem
      inventories. Distinguish disks, partitions, volumes, and mount points according to actual results. Non-filesystem Get-PSDrive
      providers and temporary drives rooted at ordinary directories are not automatically disks. A launch or handle establishes
      only a request stage; returned attributes are required to confirm the corresponding facts.
  - zh: 取得文件和目录名称或 .vmdk 路径归 NJT-0182，枚举远端可用共享归网络共享发现；只看到一个已映射盘符不满足后者。AWS、GCP 和 Azure 提供方的卷资源清单由 NJT-0139 处理，取得或复制存储正文属于后继收集，绕过文件视图的原始内容读取需满足
      NJT-0108。打开句柄本身不证明取得正文；格式化、加密和关键扇区写入另行判断影响结果。容量监控、安装检查、备份、磁盘修复和事件响应都是正常反例，不能只凭工具或字段判断恶意。
    en: File and directory names or .vmdk paths belong to NJT-0182, and enumeration of remotely available shares belongs to
      Network Share Discovery; an existing mapped drive alone does not establish the latter. Provider-side AWS, GCP, and Azure
      volume inventories are handled by NJT-0139. Acquiring or copying storage content is later collection, while raw-content
      reads bypassing the file view must meet NJT-0108. A handle alone does not establish acquired content; formatting, encryption,
      and critical-sector writes need separate impact assessment. Capacity monitoring, installation checks, backup, repair,
      and incident response remain counterexamples, so tools or fields alone do not establish malice.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 取得端点会话或主机管理通道后，攻击者可在搜索文件之前确认哪些卷存在、哪里已挂载以及可供暂存的空间。勒索或破坏准备中，这些事实可以帮助选择存储目标，但不能从一次盘点反推加密或破坏已经发生。Microsoft 观察的 Volt
        Typhoon 存储属性发现提供真实恶意使用锚点，平台文档则仅证明 Windows、Linux、macOS 和 ESXi 查询能力。
      en: After obtaining an endpoint session or host-management channel, an adversary may identify existing volumes, mounts,
        and staging capacity before searching for files. During ransomware or destructive preparation these facts can guide
        storage targeting, without making one inventory evidence of completed encryption or destruction. Microsoft's observed
        Volt Typhoon storage-attribute discovery anchors real adversarial use; platform documentation establishes query capability
        on Windows, Linux, macOS, and ESXi only.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要能执行查询的进程、会话或远程管理权限，并能够读取或取得其结果。不默认需要管理员：部分卷和容量事实可向普通调用者开放，另一些设备标识、低层探测或 ESXi 管理信息受额外授权限制。可见范围还依赖用户映射、配额、容器或挂载命名空间及接口失败状态，不能假设一次查询覆盖整机所有物理存储。
        en: 'The attacker needs a process, session, or remote-management authority able to issue a query and obtain its results.
          Administrator access is not assumed: some volume or capacity facts are available to ordinary callers, while device
          identities, low-level probing, or ESXi management information may require additional authorization. User mappings,
          quotas, container or mount namespaces, and interface failures also constrain visibility, so one query cannot be
          assumed to cover all physical storage.'
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有端点进程和命令行、按策略开启的 PowerShell 脚本块、Linux exec 审计及 ESXi shell 与认证日志，并能与批准盘点、备份和维修作业关联。这些来源主要证明调用者和请求语义，不能普遍给出返回容量或盘符集合；原生进程内
          API、GUI 和未接入的远程管理路径形成覆盖差异。只有确实取得查询输出或经验证的调用结果记录时，才可把尝试提升为成功的存储事实取得。
        en: The defender may have endpoint process and command-line events, policy-enabled PowerShell script blocks, Linux
          execution audit, and ESXi shell and authentication logs, correlated with approved inventory, backup, and repair
          jobs. These sources primarily establish the caller and request semantics rather than universally providing returned
          capacities or drive sets. In-process APIs, GUIs, and unintegrated remote-management paths produce coverage differences.
          Promote an attempt to successful acquisition of storage facts only when query output or validated result telemetry
          actually exists.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 存储目标选择使用与正常盘点和容量维护相同的只读接口
    en: Storage targeting uses the same read interfaces as ordinary inventory and capacity maintenance
  analysis:
    paragraphs:
    - zh: 攻击者以现有身份调用逻辑磁盘、容量或设备清单接口，产生与合法盘点相同的工具、方法和只读请求外观。防守方若依赖工具签名、写入告警或单次命令，就难以从这一外观判断所得存储信息是用于维护还是后继取数和破坏。把查询主体、会话、资产职责和批准作业接合后，区别才能增强。Microsoft
        的实案与接口文档支持恶意使用和正常功能重叠，缺少存储查询的规避指令与漏报对照，因此机理保持 medium。
      en: An adversary uses an existing identity to invoke logical-disk, capacity, or device-inventory interfaces, producing
        the same tool, method, and read-request appearance as legitimate inventory. A defender relying on signatures, write
        alerts, or one command cannot readily determine whether the storage facts support maintenance or later theft and destruction.
        Joining principal, session, asset role, and approved work improves distinction. Microsoft's case and interface documentation
        support adversarial use and functional overlap, but provide neither storage-query evasion instructions nor missed-detection
        comparisons, so the mechanism remains medium-confidence.
  confidence: medium
  evidence_refs:
  - REF-000073
  - REF-001217
  - REF-001219
  - REF-000994
  - REF-001224
subtechnique_taxonomy:
  coverage: deferred
  subtechnique_refs: []
  narrative:
    paragraphs:
    - zh: 已独立检查进程内查询、既存存储视图复用、窄范围查询、时间稀释和跨主体查询五种匿迹轴。前两者可能改变独立进程或设备探测的可观察位置，但现有文档主要证明接口与缓存能力，尚未提供攻击者有意选择以及同案痕迹对照；窄范围、低频和多主体也可来自普通容量监控和分权运维。
      en: 'Five stealth axes were examined independently: in-process queries, reuse of existing storage views, narrowly scoped
        queries, temporal dilution, and querying across principals. The first two may change where separate execution or device
        probing is visible, but current documentation mainly establishes interface and cache capabilities without attacker
        selection and same-case trace comparisons. Narrow scope, low frequency, and multiple principals also arise in ordinary
        capacity monitoring and delegated operations.'
    - zh: Windows、Linux、macOS、ESXi、API、命令行、盘符、物理盘、网络映射和卷字段都不是独立匿迹变量。提供方资源盘点和原始内容读取有现存相邻对象。当前正式子项为空并保留 deferred，今后只有稳定变量、相对痕迹差异和不同防御需求同时得到支持才提升。
      en: Windows, Linux, macOS, ESXi, APIs, command lines, drive letters, physical disks, network mappings, and volume fields
        are not independently stealth variables. Provider resource inventory and raw-content reading have existing neighboring
        objects. The formal child set remains empty with deferred coverage; promotion requires support for a stable variable,
        relative trace differences, and a distinct defense need together.
