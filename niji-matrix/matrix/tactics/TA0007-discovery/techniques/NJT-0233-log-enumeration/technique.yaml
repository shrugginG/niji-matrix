schema_version: 2.0.0
type: technique
id: NJT-0233
name:
  zh: 日志枚举
  en: Log Enumeration
summary:
  zh: 调查系统或服务日志的来源与记录以理解身份、主机和防守活动，并借用正常诊断及审计读取路径降低调查目的的可区分性。
  en: Investigate system or service log sources and records to understand identities, hosts, and defensive activity while
    reusing normal diagnostic and audit-reading paths that make the investigation's purpose harder to distinguish.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1654
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1654
definition_and_concept:
  paragraphs:
  - zh: 日志枚举是攻击者在已取得访问的环境中识别可用日志来源、查询其记录或取得日志内容，以了解身份活动、系统关系、服务运行和防守行动的环境测绘行为。日志保存的是其他活动留下的历史或持续记录；攻击者可从这些记录提取网络与身份线索，或判断自身活动在安全产品中留下了什么反馈。直接成果是来源清单或从记录得到的环境知识，不是删除记录、关闭记录功能或取得认证秘密。
    en: Log Enumeration is discovery in an accessed environment through identification of available log sources, queries of
      their records, or acquisition of log content to understand identity activity, system relationships, service operation,
      and defensive actions. Logs preserve historical or ongoing records of other activity. An adversary can extract network
      and identity clues or learn what feedback its own activity produced in security products. The direct result is a source
      inventory or environmental knowledge from records rather than record deletion, disabled logging, or acquired authentication
      secrets.
  - zh: 来源枚举与内容调查回答不同问题。列出通道只证明来源名称可得，发起查询只证明调查尝试，返回记录才支持具体环境事实；导出命令和新建文件也不自动证明文件含有匹配事件或已经被操作者读到。Windows 事件工具、系统日志读取器、云历史
      API 与集中检索界面是不同实现，分类依据应是实际调查对象与结果，不能依工具名称或文件扩展名决定。
    en: Source enumeration and content investigation answer different questions. Listing channels establishes available names,
      a submitted query establishes an attempt, and returned records support concrete environmental facts. An export command
      and a newly created file do not automatically establish matching events inside the file or operator access to them.
      Windows event utilities, system-log readers, cloud history APIs, and centralized search interfaces are implementations;
      classification follows the actual information object and result rather than a utility name or filename extension.
stealth_characteristics:
  paragraphs:
  - zh: 日志枚举可以把恶意调查表现为获准读取历史记录、故障排查或安全审计。wevtutil 的查询和导出同时服务于合法诊断；攻击者借用这些现成路径时，单次进程创建或查询成功通常不能说明为何要查看该通道、用户或时间段。改变的是调查请求的可见外观与正常工作之间的重叠，而不是日志读取必然不产生痕迹。
    en: Log Enumeration can present adversarial investigation as authorized historical access, troubleshooting, or security
      auditing. The query and export operations in wevtutil also serve legitimate diagnostics. When adversaries reuse these
      paths, one process-creation event or successful query usually does not explain why a particular channel, user, or interval
      was inspected. The affected property is overlap between the request's visible appearance and legitimate work rather
      than any inherent absence of read traces.
  - zh: 残余证据可能包括进程谱系与完整参数、检索主体、查询文本、时间范围、返回行数和导出工件。它们分布在端点、日志平台与身份面，含义也不同；例如集中检索的成功状态不必然含有原始记录，聚合查询的一行结果可能概括许多事件。读取安全日志以了解检测或响应只证明取得反馈的目的，不能据此断言已成功绕过告警或有意选择了无审计路径。
    en: Residual evidence can include process lineage and arguments, the querying principal, query text, time range, returned-row
      count, and export artifacts. These reside across endpoint, logging-platform, and identity planes with different meanings.
      A successful centralized query need not return raw records, and one aggregate result can summarize many events. Reading
      security logs to understand detection or response establishes a feedback purpose without establishing successful alert
      evasion or deliberate selection of an unaudited path.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入可用日志来源、通道与相关元数据的调查，以及为理解环境而查询或取得系统、应用、安全和服务日志记录。读取既有事件可能揭示账户、远程系统或服务线索，但只有来源名或路径列表时不得声称取得记录内容；一般目录列表仍需与 NJT-0182
      文件与目录发现区分。只调查日志功能是否启用和保护状态、并未调查来源或记录时，应与 NJT-0140 云服务发现等配置发现对象对照。
    en: Include investigation of available log sources, channels, and related metadata together with queries or acquisition
      of system, application, security, and service records for environmental understanding. Existing events may reveal accounts,
      remote systems, or service clues, but names or paths alone do not establish content recovery; general directory listings
      remain distinct from NJT-0182 File and Directory Discovery. An inquiry limited to whether logging is enabled or to protection
      state, without investigating sources or records, should be compared with configuration-discovery objects such as NJT-0140
      Cloud Service Discovery.
  - zh: 清除、删改和抑制日志属于痕迹收缩或防御削弱；仅因同一个 wevtutil 同时支持 clear-log 与 query-events，不能合并这些行为。日志中的口令、令牌或认证秘密被实际提取时需另外判断凭据访问，日志被打包和传输还涉及收集与外传边界。正常响应、支持、合规核查和容量分析会产生相同读取，必须结合主体职责、获批任务及入侵上下文；日志敏感或工具受信都不足以单独决定恶意性质。
    en: Clearing, altering, deleting, or suppressing logs belongs to trace contraction or defense impairment. The fact that
      wevtutil supports both clear-log and query-events does not merge those behaviors. Actual extraction of passwords, tokens,
      or authentication secrets requires a separate credential-access assessment, and packaging or transfer of logs also crosses
      collection or exfiltration boundaries. Incident response, support, compliance reviews, and capacity analysis generate
      similar reads, requiring principal duties, approved work, and intrusion context. Neither log sensitivity nor a trusted
      utility alone establishes malicious intent.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得主机或日志平台读取权后，可回顾认证和远程访问记录，筛选潜在账户或主机并理解先前活动。WithSecure 的 No Pineapple 调查记录针对 RDP 通道及事件 1149 的 wevtutil 导出命令；这证明具备明确对象和过滤条件的调查尝试，公开材料没有给出完整导出内容、匹配事件数量或每条记录的最终利用。
      en: After acquiring host or logging-platform read access, an adversary can review authentication and remote-access records
        to identify accounts or hosts and understand earlier activity. WithSecure's No Pineapple investigation records a wevtutil
        export directed at an RDP channel and event 1149. This establishes an investigation attempt with a specific target
        and filter; the public material does not provide complete exported contents, matching-event counts, or the eventual
        use of each record.
    - zh: 在持续控制或驱逐期间，安全记录还可能成为攻击者的反馈源。ESET 记录 Turla 定期外传安全相关日志以了解样本是否已被检测；Permiso 记录 GUI-vil 观察 CloudTrail 中的驱逐变更并据此调整持久控制。前者没有公开逐次查询与后续决策配对，后者没有把每项持久控制变化归因于某条返回事件，因此两者用于父级场景，而不直接建立反馈匿迹子项。
      en: During continued access or eviction, security records can also become an adversary feedback source. ESET reports
        Turla regularly exfiltrating security-related logs to assess sample detection, while Permiso reports GUI-vil watching
        eviction changes in CloudTrail and adapting persistence. The former does not publish paired queries and subsequent
        decisions, and the latter does not attribute each persistence change to one returned event. Both therefore support
        parent-level scenarios without directly establishing a feedback evasion child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者控制能够读取至少一个日志来源的进程或身份，能够运行查询或下载已授权内容。来源权限、日志保留与记录范围决定其可得事实，不能假设普通用户能读取所有安全事件、跨租户平台或全部历史。远程查询还需要可达端点和对应授权；已获准的云或安全平台身份也只提供其权限和上下文允许的视图。
        en: The adversary controls a process or identity capable of reading at least one source and can execute queries or
          retrieve authorized content. Source permissions, retention, and recorded scope determine available facts; access
          to every security event, tenant, or historical interval is not assumed for an ordinary user. Remote queries also
          require reachable endpoints and authorization, while an authorized cloud or security-platform identity supplies
          only the view permitted by its rights and context.
      - zh: 攻击者可选择通道、条件、时间范围和输出方式，并可在权限允许时反复读取新记录。这些控制不等于关闭审计、控制日志服务或保证记录真实完整。云事件历史受区域、事件类别、分页与保留期约束；错误、空结果和截断都可能使推断失真。声称反馈驱动的下一步规避，还需证明结果确实被取得及其与行动选择的联系。
        en: The adversary can choose channels, predicates, intervals, and output methods and can repeatedly read new records
          where authorized. These controls do not imply disabled auditing, control of the logging service, or complete and
          authentic records. Cloud history is constrained by Region, event class, pagination, and retention, while errors,
          empty results, and truncation can distort inference. A claim of feedback-driven subsequent evasion additionally
          needs evidence of acquired results and their link to action selection.
    defender_model:
      paragraphs:
      - zh: 防守方可具备启用命令行字段的 Windows 进程审计、按版本配置的 PowerShell 内容日志，以及日志平台的查询审计。4688 记录进程创建而不是查询结果，已采集脚本也不能自动证明返回内容；编译程序内部的事件 API
          调用需要额外验证的观测，基础进程日志不保证覆盖。导出文件的创建事件仅提供工件存在性，实际记录需要解析或由可信结果遥测确认。
        en: Defenders may have Windows process auditing with command-line capture, version-specific PowerShell content logging,
          and query auditing on the logging platform. Event 4688 records process creation rather than query results, and captured
          script content does not automatically establish returned content. Event APIs called inside compiled programs require
          additional validated visibility that ordinary process logging does not guarantee. Export-file creation establishes
          an artifact's existence; actual records require parsing or trusted result telemetry.
      - zh: 集中观察还可保留查询身份、目标、文本、时间范围与返回计数，但必须验证具体入口。Azure LAQueryLogs 需要预先启用诊断审计，用户上下文、服务间调用与各门户入口的覆盖存在限制；CloudTrail 读取事件需保留对应管理读事件，并区分查询自身与其筛选的历史事件。跨面关联需要稳定身份、目标资源和时间键，登录会话和进程
          ID 不能在不同主机间直接等同。
        en: Centralized visibility may preserve query identity, target, text, interval, and result counts, but the particular
          entry path requires validation. Azure LAQueryLogs requires diagnostic auditing in advance and has limits across
          user contexts, service-to-service calls, and portal entry paths. CloudTrail read events require retention of the
          relevant management reads and separation of the lookup operation from the historical events it selects. Cross-plane
          joins need stable identities, target resources, and time keys; logon sessions and process IDs are not directly interchangeable
          between hosts.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用正常日志诊断和审计读取外观掩盖环境调查目的
    en: Reuse ordinary log diagnostics and audit-reading appearances to obscure environmental investigation intent
  analysis:
    paragraphs:
    - zh: 攻击者使用本来用于查询与导出事件的系统诊断路径，令调查请求保留合法读取的工具、操作和授权外观。Microsoft 说明这些操作的正常用途，WithSecure 则直接记录攻击者以相同工具过滤 RDP 记录；其重叠使单次进程或读请求难以区分例行诊断和敌对调查。该因果判断是对可见语义重叠的推断，未测量检测失败。命令条件、操作者职责、父进程和获批任务仍能提供区分，删除日志或后续持久控制不属于此机理的前提。
      en: The adversary uses system diagnostic paths intended for event queries and export, preserving the utility, operation,
        and authorization appearance of legitimate reads. Microsoft documents these normal operations, and WithSecure directly
        records an adversary filtering RDP records through the same utility. The overlap makes one process event or read request
        difficult to distinguish as routine diagnostics or hostile investigation. This is an inference from visible semantic
        overlap rather than a measured detection failure. Predicates, operator duties, process ancestry, and approved work
        can still distinguish intent; log deletion and subsequent persistence are not prerequisites of this mechanism.
  confidence: medium
  evidence_refs:
  - REF-001226
  - REF-001230
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本轮未建立正式子技术。查询条件、日志类型、操作系统和工具名称可改变实现或调查内容，但尚未证明其分别构成稳定且有意的匿迹变量。对既有记录的间接调查、查询范围缩减、集中检索与反馈驱动选择分别开展了检索；公开证据没有同时给出独立边界、读取侧痕迹变化及相应防守差异。
      en: No formal child is established in this round. Query predicates, log types, operating systems, and utility names
        alter implementation or survey content without yet establishing independently stable and intentional stealth variables.
        Existing-record indirect investigation, query-scope reduction, centralized search, and feedback-driven selection were
        searched separately. The public evidence does not jointly establish independent boundaries, acquisition-side trace
        changes, and corresponding defensive differences.
    - zh: 日志反馈的恶意用途已有记录，仍不能仅以用途命名子技术。需要把读取内容、反馈时点、下一步行为与防守观察对照连接，区分资料原有的不可见性和攻击者主动造成的变化。现有证据尚不足以完成这种独立划分，因此分类暂缓；后续结果级资料可以重新开启候选轴。
      en: Adversarial log feedback is documented, but purpose alone does not define a child. Acquired contents, feedback timing,
        subsequent behavior, and comparative defender observations must be connected to distinguish preexisting visibility
        limits from adversary-induced changes. Current evidence does not complete that independent partition, so taxonomy
        remains deferred and further result-level evidence can reopen candidate axes.
