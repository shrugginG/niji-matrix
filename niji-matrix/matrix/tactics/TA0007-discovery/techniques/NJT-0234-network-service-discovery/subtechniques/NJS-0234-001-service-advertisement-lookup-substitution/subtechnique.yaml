schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0234-001
name:
  zh: 服务公告查询替代
  en: Service-Advertisement Lookup Substitution
summary:
  zh: 查询发布者维护的服务公告取得候选实例及可解析端点，替代初始逐监听探测并把发现痕迹移到公告查询平面。
  en: Query publisher-maintained service advertisements for candidate instances and resolvable endpoints, substituting for
    initial per-listener probes and moving discovery traces to advertisement queries.
aliases: []
parent_ref: NJT-0234
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 服务公告查询替代是攻击者为了解远端服务，先查询服务发布者已经维护的公告记录，以取得实例名单或进一步解析端点，而不以逐个监听端口探测作为取得这些初始事实的方式。其直接目标是利用现有发现基础设施缩小下一步候选范围，改变信息取得所经过的观察平面。
    en: Service-Advertisement Lookup Substitution is an adversary's use of advertisement records already maintained by service
      publishers to obtain instance lists or resolve endpoints, instead of probing each listener to acquire those initial
      facts. It uses existing discovery infrastructure to narrow next-step candidates and changes the observation surface
      through which information is acquired.
  - zh: DNS-SD 为一个有技术文档和恶意使用记录支持的实现：按服务类型查询 PTR 可发现实例，SRV 及地址记录可进一步提供主机和端口。该过程不能仅凭请求发出就认定结果已返回；得到实例也不等于已解析完整端点，更不等于监听、认证或漏洞验证成功。本分类依据被替代的逐监听探测与新的查询平面，不依据命令、服务类型或实现厂商。
    en: 'DNS-SD is an implementation supported by technical documentation and adversarial-use reporting: service-type PTR
      queries discover instances, while SRV and address records can provide hosts and ports. Sending a query does not establish
      returned results, an instance does not establish complete endpoint resolution, and neither establishes successful listener,
      authentication, or vulnerability validation. The boundary is the substituted per-listener probing and replacement query
      surface, not the command, service type, or vendor.'
stealth_characteristics:
  paragraphs:
  - zh: 服务公告查询替代使服务测绘的初始痕迹表现为公告浏览，而不是候选服务端口上的成组连接。只观察后者的扫描检测不能从缺席的监听探测还原实例浏览；查询本身又与正常客户端使用相同的发现协议，使单次请求的意图难以判断。发布者应答、服务类型和实例关系仍存在，具备公告观察与用途基线的防守方可以恢复这段调查。
    en: Service-Advertisement Lookup Substitution makes initial service surveying appear as advertisement browsing rather
      than grouped connections to candidate service ports. Scan detection limited to the latter cannot reconstruct instance
      browsing from listener probes that did not occur. Queries also share discovery protocols with legitimate clients, making
      the intent of an isolated request difficult to classify. Publisher responses, service types, and instance relationships
      remain available to defenders with advertisement visibility and purpose baselines.
  - zh: 这项变化不要求公告服务器与目标主机分离。mDNS 可以由目标主机回答，普通客户端还可能共享同一个解析守护进程；网络上可见的主机和守护进程不能直接代表操作者。缓存、应答抑制、链路边界与不公布服务限制可恢复的事实，而后继连接可能再次暴露完整目标集合。报告没有比较实际检测器，因此匿迹效果为有条件的中等置信推断。
    en: The change does not require the advertisement server to be separate from target hosts. Target hosts may answer mDNS,
      and ordinary clients may share a resolver daemon. A visible host or daemon therefore does not directly identify the
      operator. Caching, response suppression, link boundaries, and unadvertised services limit reconstructable facts, while
      subsequent connections can expose the full candidate set again. No reported detector comparison exists, so the stealth
      effect is a conditional medium-confidence inference.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入主动查询既有服务公告，且取得服务候选所依赖的是公告记录而非逐监听探测的情形。DNS-SD 实例浏览和后续 SRV 解析可以构成连续过程，但不能要求每次浏览都已经执行解析。正常打印、共享、媒体发现与管理浏览是必须保留的反例；恶意判断需要会话来源、用途偏离或后继访问证据，不把服务类型稀有当作充分条件。
    en: Include active querying of existing service advertisements where service candidates come from those records rather
      than per-listener probes. DNS-SD instance browsing and subsequent SRV resolution can form one process without requiring
      every browse operation to include resolution. Ordinary printing, sharing, media discovery, and administrative browsing
      are counterexamples. Malicious classification needs session provenance, purpose deviation, or successor access rather
      than service-type rarity alone.
  - zh: 被动监听网络中已存在的公告或其他流量归网络嗅探；只从旧文件读取服务清单尚不自动属于本子项。外部第三方测绘、云资源目录和容器资源列表保留各自信息对象边界。攻击者可以在公告查询后再扫描目标，此时只将取公告的部分归本子项，不声称整个行动没有扫描。DNS
      查询仍可能直接到达目标主机，也不能称为完全离目标发现。
    en: Passive reception of existing advertisements or other traffic belongs to Network Sniffing. Reading a stored inventory
      file does not automatically enter this child. External third-party mapping, cloud-resource catalogs, and container-resource
      lists retain their information-object boundaries. An adversary can scan after browsing; only the advertisement-acquisition
      component belongs here, without claiming the whole operation was scan-free. DNS queries may still reach target hosts
      directly and are not wholly off-target discovery.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在已经访问的办公链路或服务发现域内，可能想找到提供远程访问或其他后继能力的服务，且环境中已有服务主动注册。Bradley 记录的入侵使用 macOS 原生命令寻找 SSH 公告候选；这个例子支持入侵后的选择性实例浏览，不证明服务已经实际可连或该路径具有所有环境通用的匿迹收益。
      en: Within an accessed office link or service-discovery domain, an adversary may seek services offering remote access
        or other next-step capabilities where services already register themselves. Bradley's intrusion account records use
        of a native macOS command to browse advertised SSH candidates. This supports selective post-compromise instance browsing,
        not proven listener reachability or universal stealth benefits.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能在相应浏览域发出服务查询并读到返回结果，知道或枚举服务类型，并承受未注册、缓存过期与范围不完整的限制。普通 mDNS 浏览不默认要求原始套接字、管理员或远端登录权限。若公告经跨段网关传播，能得到哪些实例取决于实际过滤策略，不能假定服务名已知就能触达服务端点。
        en: The adversary must issue queries and read results in the relevant browsing domain, know or enumerate service types,
          and tolerate unregistered services, stale caches, and incomplete coverage. Ordinary mDNS browsing does not inherently
          require raw sockets, administrator privilege, or remote login. For advertisements crossing a discovery gateway,
          returned instances depend on filtering policy. Knowing a service name does not imply endpoint reachability.
    defender_model:
      paragraphs:
      - zh: 防守方需要与浏览者同链路或覆盖实际发现网关的查询应答观察，能够保留服务类型、实例、记录类型、响应数据与 TTL，并按时间映射客户端设备和 VLAN。只有递归 DNS 或出口日志不能保证看到本地 mDNS。若要归因到命令或应用，还需独立客户端执行或解析请求遥测；看到
          mDNSResponder 出网不能直接指认它是恶意请求发起者。
        en: Defenders need query-response observation on the browser's link or actual discovery gateway, retaining service
          types, instances, record types, response data, and TTLs, with time-aware client-device and VLAN mapping. Recursive
          DNS or egress logging alone does not guarantee local mDNS visibility. Command or application attribution additionally
          needs independent client execution or resolver-request telemetry; network activity by mDNSResponder does not identify
          the malicious requester.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 通过公告查询取得候选而不先留下服务监听侧的探测序列
    en: Acquire candidates through advertisement queries without first leaving a probe sequence at service listeners
  analysis:
    paragraphs:
    - zh: 攻击者把候选获取任务交给现有服务公告系统，产生按服务类型的查询与发布者应答，替代了同一阶段逐监听连接的需求。以监听连接或失败扇出为唯一输入的规则因此缺少可用于识别该段测绘的事件；需要公告查询应答与客户端用途来补全。响应主机仍可见，后续验证仍可能产生连接，故收益严格限于缺少公告观察的防守模型。案例证明该方式被恶意使用，规范证明其交互路径，具体动机及检测效果仍为推断。
      en: The adversary delegates candidate acquisition to existing service-advertisement infrastructure, generating service-type
        queries and publisher responses in place of that stage's per-listener connections. Rules using listener connections
        or failure fan-out alone consequently lack events identifying that part of the survey. Advertisement queries and responses
        plus client purpose are needed to recover it. Responding hosts remain visible and later validation can still connect,
        so the benefit is limited to defensive models lacking advertisement visibility. The case establishes malicious use
        and specifications establish the interaction path; motive and detector effect remain inferred.
  confidence: medium
  evidence_refs:
  - REF-001239
  - REF-001240
  - REF-001241
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 借用正常客户端同样使用的服务浏览语义增加意图区分难度
    en: Borrow ordinary client service-browsing semantics to make intent harder to classify
  analysis:
    paragraphs:
    - zh: 服务类型查询与返回实例是正常发现协议的预期行为，攻击者借用它们而不需要构造带恶意载荷的请求。查询内容与获准客户端可能相同，使单次语法正确和来源在内网这两项事实不足以区分恶意用途。异常登录上下文、客户端职责与实际后继访问能增强区分，但不能只按服务浏览命令或服务类型判恶。本文没有量化这种分类难度，置信度保持中等。
      en: Service-type queries and returned instances are expected discovery-protocol behavior. The adversary borrows them
        without needing a malicious request payload. Queries can match those of authorized clients, so valid syntax and an
        internal source do not distinguish malicious purpose. Unusual login context, client role, and subsequent access improve
        classification, while a browse command or service type alone does not establish malice. The classification difficulty
        is unmeasured and remains medium-confidence.
  confidence: medium
  evidence_refs:
  - REF-001239
  - REF-001240
  - REF-001241
