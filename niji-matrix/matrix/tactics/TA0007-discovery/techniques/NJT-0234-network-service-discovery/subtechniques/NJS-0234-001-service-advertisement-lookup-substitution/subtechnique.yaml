research:
  limitations:
    paragraphs:
    - zh: 唯一直接的公告替代恶意使用案例是 Bradley 公开的 macOS 入侵叙述，它未披露具体受害者、完整应答或每个后继端点。可以确认攻击者发起服务浏览及所查类型，但不能证明浏览返回完整清单、所有实例真实可连、整个入侵没有扫描或作者实际测试了扫描检测失效。其他公告系统要进入同一子项，仍需证明相同替代关系和观察差异。
      en: The direct malicious advertisement-substitution case is Bradley's public macOS intrusion account, which omits the
        victim, complete responses, and every successor endpoint. It establishes adversarial browsing and the requested type,
        not a complete returned inventory, reachable instances, an entirely scan-free intrusion, or tested failure of scan
        detection. Other advertisement systems need evidence of the same substitution and observation difference before entering
        this child.
    - zh: 本地组播、缓存与共享响应机制使查询和应答无法像普通单播 DNS 那样简单一一匹配；同链路看到应答也不证明某进程已消费结果。检测部署必须保存不确定关联并区分观察到公告与确认取得实例，不能用无响应日志反推缓存命中。尚无本地网络实验验证精确归因与误报率。
      en: Local multicast, caching, and shared responses prevent simple one-to-one matching as in ordinary unicast DNS. Seeing
        a response on the link does not prove a particular process consumed it. Detection must retain uncertain association
        and distinguish observed advertisements from confirmed acquisition, without inferring cache hits from missing response
        logs. Precise attribution and false-positive rates have not been validated in a local-network experiment.
