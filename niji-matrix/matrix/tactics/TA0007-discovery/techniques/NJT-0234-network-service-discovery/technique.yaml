schema_version: 2.0.0
type: technique
id: NJT-0234
name:
  zh: 网络服务发现
  en: Network Service Discovery
summary:
  zh: 在已访问环境中探测或查询远端服务候选与端点信息，并可借用日常服务浏览和运维盘点的外观降低调查意图的可区分性。
  en: Probe or query remote-service candidates and endpoints in an accessed environment, potentially borrowing routine service-browsing
    and inventory behavior to make surveying intent less distinguishable.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1046
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1046
definition_and_concept:
  paragraphs:
  - zh: 网络服务发现是攻击者在已经取得访问的环境中，了解其他主机、网络设备或工作负载提供哪些可用网络服务的行为。直接成果可以是待验证的服务实例、主机与端口组合、得到响应的协议或可确认的产品版本；攻击者据此筛选横向访问、进一步查询或漏洞验证的目标。端口探测和协议交互可以取得这些事实，读取服务自行发布的公告同样可以提供服务候选。
    en: Network Service Discovery is an adversary's investigation of network services offered by other hosts, network devices,
      or workloads in an environment already accessed. Its direct result may be an unverified service instance, a host-and-port
      combination, an observed protocol response, or a confirmed product version. These facts support selection of targets
      for lateral access, further queries, or vulnerability validation. Port probes and protocol exchanges can acquire these
      facts, while service-published advertisements can also supply candidates.
  - zh: 这里的服务事实具有证据层级。公告实例说明某种服务被发布，解析记录可给出候选端点，连接响应说明当时的路径或监听可达，完整协议交换才可能识别实际服务；这些结果均不自动证明存在可利用漏洞。扫描器、系统自带命令和管理接口只是实施方式，目标是远端服务知识，而不是执行某个工具或证明某个端口号存在。
    en: Service facts have different evidentiary levels. An advertised instance establishes publication, resolution records
      can supply a candidate endpoint, a connection response supports contemporaneous path or listener reachability, and a
      sufficiently complete protocol exchange may identify the actual service. None automatically establishes an exploitable
      vulnerability. Scanners, built-in commands, and management interfaces are implementations; the object is knowledge about
      remote services rather than running a tool or finding a particular port number.
stealth_characteristics:
  paragraphs:
  - zh: 网络服务发现可以借用与管理员盘点或客户端服务浏览相同的请求和程序。尤其是先查询已公布的服务信息时，调查发生在公告查询与应答平面，不需要先逐个连接候选服务的监听端口；只统计失败连接、横向目标数量或扫描程序名的防守逻辑可能看不到完整的服务测绘。并非所有服务发现都具有这种效果，密集扫描仍可能产生非常清楚的东西向异常。
    en: Network Service Discovery can borrow the requests and programs used by administrators or ordinary service-browsing
      clients. When published service information is queried first, surveying occurs in advertisement queries and responses
      without first connecting to each candidate service listener. Detection limited to failed connections, lateral destination
      counts, or scanner names can therefore miss the service-mapping activity. This does not apply to every discovery operation;
      dense scanning may produce conspicuous east-west anomalies.
  - zh: 查询名、服务类型、公告实例、响应者、目标地址、连接结果以及发起主机仍会留下痕迹。mDNS 响应者可能就是服务所在主机，所以公告查询不是完全不接触目标主机；共享解析守护进程又可能使线上来源进程与实际请求应用不同。保留同链路查询应答、把批准工作负载用途与后继连接关联，能够缩小这种观察和区分缺口。现有案例没有提供检测漏失率或明确规避指令，因此不把较少监听探测等同于已经成功隐身。
    en: Query names, service types, advertised instances, responders, destinations, connection outcomes, and initiating devices
      remain observable. An mDNS responder may be the service host itself, so advertisement queries do not eliminate all target-host
      contact. A shared resolver daemon can also separate the process emitting network traffic from the requesting application.
      Same-link query-response retention, workload-purpose baselines, and successor connections can narrow these observation
      and classification gaps. The cases provide neither detection miss rates nor explicit evasion instructions, so fewer
      listener probes are not equated with demonstrated invisibility.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入在已访问环境内，为取得远端服务候选、端点或协议事实而进行的连接探测、协议识别、服务公告浏览，以及有证据表明返回同类服务事实的查询。TCP SYN、连接建立、服务标识和漏洞验证分别记录，不把成功连接推断成完整服务清单，也不从端口号推断产品版本或漏洞。合法资产盘点、设备配置、故障诊断、健康检查和安全评估会出现相同请求，必须结合访问来源、批准范围与后继行为判断。
    en: Include connection probes, protocol identification, service-advertisement browsing, and queries demonstrably returning
      equivalent service facts within an accessed environment. Record TCP SYN observations, established connections, service
      identification, and vulnerability validation separately. A successful connection is not a complete service inventory,
      and a port number does not establish a product version or vulnerability. Legitimate inventory, device configuration,
      troubleshooting, health checks, and security assessment can generate the same requests; evaluate access provenance,
      approved scope, and later behavior.
  - zh: 取得内部访问前的外部主动探测归 NJT-0001；只确认远端主机存在不等同于服务发现。共享资源名称及列表归网络共享发现，实际文件读取归收集；被动捕获既有流量归网络嗅探。云资源拓扑、提供方服务启用状态和容器运行资源分别保留已有父项；读取本机
      Windows 服务清单本身也不证明远端网络监听服务。后继认证、执行、漏洞利用和捕获内容另行评价，不能用后继成功倒填本次发现的完整结果。
    en: Pre-access external probing belongs to NJT-0001, while merely identifying a remote host does not establish service
      discovery. Shared-resource names and inventories belong to Network Share Discovery, actual file reads to collection,
      and passive capture of existing traffic to Network Sniffing. Cloud-resource topology, provider-service enablement, and
      running container resources retain their existing parents. A local Windows-service inventory alone also does not establish
      remote network listeners. Evaluate later authentication, execution, exploitation, and captured content separately rather
      than backfilling a complete discovery result from later success.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 取得普通终端、容器或接入网络的立足点后，攻击者可能先寻找 SSH、远程管理、数据库或 kubelet 等下一步入口。Bradley 的 macOS 事件记录使用服务公告寻找 SSH 候选，Hildegard 则从受侵容器寻找内部
        kubelet，再读取容器资源并尝试执行。这两种案例说明信息取得路径可以不同；它们并不证明所有发现均采用低速、分布式或公告替代。
      en: After gaining a foothold on an endpoint, in a container, or on an attached network, an adversary may seek next-step
        entry points such as SSH, remote management, databases, or kubelets. Bradley's macOS incident records advertisement-based
        searches for SSH candidates; Hildegard searched for internal kubelets from a compromised container before reading
        container resources and attempting execution. The cases establish different acquisition paths, not that every discovery
        operation is slow, distributed, or advertisement-based.
    - zh: 混合云与分段环境还可能使同一立足点看到不同范围的服务：直连探测受路由和防火墙约束，公告可见性受本地链路、解析域和服务发现网关策略约束。攻击者可用已公布候选减少初始盲探，但过期公告、被过滤的类型和无法触达的端点会降低结果质量，后续验证仍会增加痕迹。
      en: In hybrid or segmented environments, the same foothold may see different service scopes. Direct probes depend on
        routing and firewalls, while advertisement visibility depends on the local link, browsing domain, and discovery-gateway
        policy. Published candidates can reduce blind initial probing, but stale records, filtered service types, and unreachable
        endpoints reduce result quality, while later validation produces additional traces.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够在已访问环境发起连接或服务查询，并接收相关响应。普通连接与服务公告浏览不默认要求管理员权限；原始报文构造、专用接口或受限管理视图可能另需权限。可见范围不超过实际可达路径、公告域和查询授权，且具备命令执行能力不等于可以列出整个企业的服务。
        en: The adversary needs the ability to initiate connections or service queries and receive responses from an accessed
          environment. Ordinary connections and advertisement browsing do not inherently require administrative privilege,
          although raw-packet construction, special interfaces, or protected management views may. Visibility is limited by
          reachable paths, advertisement domains, and query authorization. Command execution does not imply an enterprise-wide
          service inventory.
      - zh: 使用公告替代监听探测时，攻击者至少需要理解所查服务类型与浏览域，并能够读取实例结果；取得可连接端点还需解析或其他证据。它可以接受候选不完整与暂时过期的成本，但不能假定每个远端服务都主动注册，也不能由一个浏览命令推断其读到所有响应或故意绕过了某项检测。
        en: Substituting advertisement lookup for listener probes requires at least knowledge of the relevant service type
          and browsing domain and the ability to read instance results. A connectable endpoint additionally requires resolution
          or other evidence. The adversary may tolerate incomplete or temporarily stale candidates but cannot assume every
          remote service registers or that one browse command proves consumption of every response or intentional bypass of
          a particular detector.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有东西向连接记录、主机进程与连接事件、服务公告数据、服务端日志和批准盘点台账。连接记录能分辨尝试与部分会话状态，却不能单凭端口识别服务；服务公告数据能说明发布内容与查询范围，却不能证明监听可达。Sysmon
          Event 3 默认未开启，启用后也不记录完整协议结果，不能被当作网络探测成败的唯一证据。
        en: Defenders may have east-west connections, endpoint process and network events, service-advertisement data, server
          logs, and approved inventory records. Connection telemetry distinguishes attempts and some session states but cannot
          identify a service from its port alone. Advertisement data establishes published content and query scope but not
          listener reachability. Sysmon Event 3 is disabled by default and does not provide complete protocol outcomes when
          enabled, so it cannot be the sole evidence of probe success or failure.
      - zh: 本机链路内的 mDNS 可能不经过互联网出口、递归 DNS 或跨段防火墙。观察点必须覆盖相应 VLAN 或实际网关，保留 IPv4、IPv6、查询及应答，并区分响应守护进程、查询主机与实际请求应用。只有连接日志而没有本地公告内容时，对公告型服务测绘存在明确盲区；日志缺席不能证明没有查询，更不能证明攻击者取得了什么服务结果。
        en: Local-link mDNS may bypass Internet egress, recursive DNS, and inter-segment firewalls. Observation must cover
          the relevant VLAN or actual gateway, retain IPv4 and IPv6 queries and responses, and distinguish responder daemons,
          querying devices, and requesting applications. Connection logs without local advertisement content leave an explicit
          blind spot for advertisement-based surveying. Missing logs prove neither absence of querying nor acquisition of
          a particular service result.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用日常服务浏览和运维盘点请求降低单次服务调查的可区分性
    en: Borrow ordinary service-browsing and inventory requests to reduce the distinguishability of individual service surveys
  analysis:
    paragraphs:
    - zh: 攻击者使用合法客户端也会采用的服务浏览接口，或运行本为管理员设计的网络盘点程序，生成语义有效的查询与连接。痕迹由恶意目的驱动，但单个程序名、服务类型或成功请求仍可与获准盘点相同，使只依赖恶意工具标识或逐事件合法性的防守判断难以区分调查。跨目标范围、会话来源和后继访问增强判定力；合法接口不等于隐形，也不使高密度扫描失去可检测性。恶意使用有直接事件证据，防守分类效果属于有条件推断，置信度为中等。
      en: An adversary uses service-browsing interfaces available to legitimate clients or network-inventory programs designed
        for administrators, producing semantically valid queries and connections. Malicious purpose drives the activity, but
        an individual program name, service type, or successful request can match authorized inventory. Detection relying
        on malicious-tool indicators or per-event legitimacy therefore has limited classification power. Cross-target scope,
        session provenance, and subsequent access improve discrimination. Legitimate interfaces are not invisible and do not
        make dense scanning undetectable. Adversarial use is directly documented; the conditional classification effect is
        an inference with medium confidence.
  confidence: medium
  evidence_refs:
  - REF-001239
  - REF-001240
  - REF-001245
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 以服务公告查询替代逐监听探测使测绘离开仅观察连接扫描的检测面
    en: Move initial service surveying from listener probes to advertisement queries outside connection-only scan rules
  analysis:
    paragraphs:
    - zh: 攻击者先读取服务发布者维护的实例信息，必要时解析其端点，而不是为取得初始候选逐个尝试目标监听端口。由此产生公告查询与应答，所替代的监听连接序列可以尚未发生。只基于服务端口连接扇出或失败次数的检测因缺少其预期事件而不能还原该段调查，但同链路公告传感器仍能观察查询和返回信息。响应者可以位于目标主机，后继验证也可继续探测，所以这里是观察平面的移动，不是目标完全未接触或所有痕迹消失。攻击者采用该路径与协议痕迹差异分别有一手事件和官方规范支持；具体规避意图与漏检率未被测量。
      en: The adversary first reads instance information maintained by service publishers and resolves endpoints when needed,
        rather than trying each target listener to obtain initial candidates. Advertisement queries and responses result while
        the substituted listener-connection sequence may not yet occur. Detection based only on service-port fan-out or failures
        lacks its expected events and cannot reconstruct that part of the survey, although same-link advertisement sensors
        can still observe queries and returned information. Responders may reside on target hosts and later validation may
        still probe listeners. This moves the observation surface rather than eliminating all target contact or traces. Firsthand
        reporting establishes adversarial use and official specifications establish the trace difference; particular evasion
        intent and miss rates are unmeasured.
  confidence: medium
  evidence_refs:
  - REF-001239
  - REF-001240
  - REF-001241
  - REF-001242
subtechnique_taxonomy:
  coverage: established
  narrative:
    paragraphs:
    - zh: 本项提出服务公告查询替代这一原生子技术，变量是取得初始服务事实时，选择发布者维护的公告查询平面代替逐个服务监听探测。它改变调查请求落到什么接口、服务监听侧留下什么序列，以及防守方需要何处的查询应答证据；不是按 Bonjour、SSH、端口号或命令名称划分。
      en: The proposed native child is Service-Advertisement Lookup Substitution. Its variable is choosing publisher-maintained
        advertisement queries instead of per-service listener probes to acquire initial service facts. It changes the interface
        receiving the survey, the sequence left at service listeners, and the query-response evidence defenders need. It is
        not partitioned by Bonjour, SSH, port, or command name.
    - zh: 时间稀释、跨来源分工、代理归因、分片及报文外观均经过比较，但不能把 NJT-0001 的五个子项在内部阶段机械重建。被动流量学习归网络嗅探；旧服务清单复用和管理系统代查仍缺同案查询与独立防守差异证据，保持待研究。公告型子项的实例结果与监听验证必须分开，分类不声称其余路径都没有匿迹空间。
      en: Temporal dilution, work allocation across sources, proxy attribution, fragmentation, and packet appearance were
        examined without mechanically recreating NJT-0001's five children for an internal phase. Passive traffic learning
        belongs to Network Sniffing. Stored-service inventory reuse and management-system lookup remain deferred for lack
        of same-case querying and independent defensive evidence. Advertisement instance results and listener validation remain
        separate, and this taxonomy does not claim other paths lack stealth potential.
  subtechnique_refs:
  - NJS-0234-001
