research:
  limitations:
    paragraphs:
    - zh: 本子项由权威评估指南与工具能力规范支持，没有合格恶意现场案例、实际解析事务对照或测绘结果返回测量。NIST 的评估语境不能被改写为特定攻击者已经采用；固定 tcpdump 版本的选项也不能直接推广到所有采集器。后续证据应分别证明有效设置、实际观察、结果与相对解析行为。
      en: This child is supported by an authoritative assessment guide and tool capability specification without a qualifying
        malicious field case, measured resolution comparison, or mapping-result return. NIST's assessment context must not
        be rewritten as adoption by a particular adversary, and one pinned tcpdump version cannot establish every collector's
        option semantics. Further evidence must separately establish effective settings, actual observation, results, and
        relative resolution behavior.
    - zh: 保存原始包、离线打印、解析器缓存、静态名称和命名过滤器会使相同参数产生不同网络行为。批准采集器本来就常用数字输出；禁止该选项或强制开启 DNS 不构成可靠缓解。现有检测设计还需在目标版本验证参数解析、日志字段和结果关联，不能以
        DNS 缺席计算成功匿迹。
      en: Raw saving, offline printing, resolver caches, static names, and named filters can give the same arguments different
        network effects. Approved collectors commonly use numeric output, and banning the option or forcing DNS is not a reliable
        mitigation. The analytic design still needs target-version validation of argument parsing, fields, and result joins;
        absent DNS cannot quantify successful stealth.
