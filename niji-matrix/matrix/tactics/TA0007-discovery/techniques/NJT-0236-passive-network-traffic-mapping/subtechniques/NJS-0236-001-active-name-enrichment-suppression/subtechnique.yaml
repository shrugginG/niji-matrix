schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0236-001
name:
  zh: 主动名称补全抑制
  en: Active Name-Enrichment Suppression
summary:
  zh: 在被动报文观察和解释中主动禁用外部名称补全，保留包中可得事实，并减少观察器为所见地址派生的解析事务。
  en: Deliberately disable external name enrichment while observing and interpreting packets, preserving packet-derived facts
    while reducing resolution transactions generated by the observer for encountered addresses.
aliases: []
parent_ref: NJT-0236
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 主动名称补全抑制是攻击者在已建立的被动报文观察关系中，关闭解释所见地址时本可发起的外部名称解析，以数字端点和报文本身携带的信息继续形成环境事实的行为。稳定变量是观察器是否主动补全名称，不是是否具有网卡权限、是否使用镜像，或结果文件是否采用某个格式。它控制的是采集与解释过程中另行产生的查询，而不改变已被观察的原始业务通信。
    en: Active Name-Enrichment Suppression deliberately disables external resolution that could otherwise occur when interpreting
      addresses within an established passive packet-observation relationship. Numeric endpoints and information already carried
      by packets remain available for environmental mapping. The stable variable is active name enrichment by the observer,
      rather than capture authority, mirroring, or an output format. It controls supplementary queries generated during acquisition
      and interpretation without changing the original business communications being observed.
  - zh: NIST 明确把关闭域名查找与隐蔽嗅探联系起来。tcpdump 4.99.5 的 -n 提供禁止地址和端口名称转换的具体控制，而 -N 仅缩短主机域名的打印形式；端口名称转换可能只查本地表，不能把每次转换都当作 DNS。该实现支持可有意选择的能力，但不证明某个攻击者实际使用或因此逃过告警。数值显示本身也不足以证明主动解析曾被抑制。
    en: NIST explicitly connects disabling domain-name lookup with stealthy sniffing. The pinned tcpdump 4.99.5 manual provides
      concrete control through -n, which disables address and port-name conversion, while -N only shortens printed host-domain
      qualification. Port-name conversion can use a local table and must not be equated with DNS. This establishes an intentionally
      selectable capability without proving adoption or alert evasion by a particular adversary. Numeric presentation alone
      likewise does not establish suppressed active resolution.
stealth_characteristics:
  paragraphs:
  - zh: 主动名称补全抑制可移除观察器因解释许多所见地址而发起的外部解析边，使只看 DNS 或反向查询的防守方难以将旁听主体同其关注端点连接。原始报文、数字地址、端口、时序和通信关系仍可保留，报文内已经携带的名称也不会消失。变化发生在辅助解释步骤，因而不同于父级仅仅避免逐台主动探测的被动观察关系。
    en: Active Name-Enrichment Suppression can remove external resolution edges generated as the observer interprets encountered
      addresses, weakening DNS-only reconstruction of the listener and its endpoints of interest. Packets, numeric addresses,
      ports, timing, and communication relationships can remain, as can names already carried within packets. The change concerns
      auxiliary interpretation and differs from the parent's passive-observation relationship that avoids querying each target.
  - zh: 只有默认解释路径确会访问外部解析时，关闭补全才会减少相应网络事务。缓存、hosts 静态映射和原本不解析的实现可能使两种配置均不产生查询；命名过滤器的预先解析、其他进程和后台 DNS 也可能继续存在。捕获进程、有效选项、权限、接口、结果和去向仍是可观察痕迹，不能把该能力描述为整机零
      DNS 或天然不可检测。
    en: Network transactions decrease only where the ordinary interpretation path would actually consult external resolution.
      Caches, static hosts mappings, and implementations that never enrich names can leave both configurations query-free.
      Upfront resolution of named filters, other processes, and background DNS can also persist. Capture processes, effective
      options, authority, interfaces, results, and destinations remain observable; the capability does not mean zero DNS from
      the host or inherent undetectability.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要同时说明真实捕获或独立观察关系、具有主动补全语义的解释阶段，以及关闭该阶段的设置或等效实现。tcpdump 仅写原始报文而不解析打印时，即使带 -n 也不能据此证明抑制了原本会执行的补全。单独查看已有文件、显示数字、使用
      -N 缩短域名、解析失败或缺少 DNS 事件均不单独成立；离线处理只有在已独立证明其属于本次观察与测绘链时才可评价。
    en: Inclusion requires an established capture or independent observation relationship, an interpretation stage capable
      of active enrichment, and a setting or equivalent implementation disabling that stage. With tcpdump saving raw packets
      without parsed printing, -n alone does not establish suppression of enrichment that would otherwise run. A standalone
      file read, numeric display, -N domain shortening, failed resolution, or missing DNS events is insufficient. Offline
      processing is assessed only when independently linked to the qualifying observation and mapping chain.
  - zh: 主动询问服务公告属于网络服务发现，其正常响应不因被接收就成为旁听；报文中其他客户端已经产生的 DNS 或服务名称仍可作为被动事实。正常诊断常为性能、可复现性或避免解析干扰而禁用名称补全，所以该设置不是恶意判据。是否属于敌对活动需要独立的主体控制、批准范围或入侵上下文，不能从一个选项反推意图。
    en: Active service-advertisement queries belong to Network Service Discovery, and receiving their normal replies does
      not create a listening relationship. DNS or service names already emitted by other clients can remain passive facts.
      Authorized diagnostics commonly disable enrichment for performance, reproducibility, or to avoid resolution interference,
      so the setting is not a maliciousness verdict. Hostile activity requires independent principal-control, authorization-scope,
      or intrusion evidence rather than intent inferred from one option.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在已有流量观察位置上，操作者可以先按数字地址和实际通信关系整理候选，再决定是否在其他位置进一步查询名称。该选择适合不希望采集器因解释所见地址额外接触解析设施、且能够接受名称信息不完整的环境。现有证据直接支持这种可实施设计与匿迹用途，尚不支持某个受害网络中已完成的恶意使用案例。
      en: At an existing traffic-observation position, an operator can first organize candidates through numeric addresses
        and actual communication relationships and decide separately whether to enrich names elsewhere. This suits situations
        where the collector should not make supplementary contacts with resolution infrastructure and incomplete names are
        acceptable. Current evidence supports the implementable design and stealth purpose, rather than a completed malicious-use
        case in a particular victim network.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要有权且实际能够接收相关报文，能够控制解释程序的有效补全设置，并取得至少相应的数字事实。普通进程启动或抓包权限不能替代真实流量可见性；仅有 -n 也不能证明程序进入了解析阶段。关闭补全通常牺牲通过外部反向解析取得的名称，但不会自动删除报文内名称，也不保证后续另一进程不会再次解析。
        en: The adversary needs both authority and actual visibility for relevant packets, control of the interpreter's effective
          enrichment settings, and access to at least the corresponding numeric facts. Process creation or capture authority
          does not establish traffic visibility, and -n does not establish entry into parsed interpretation. Suppression generally
          sacrifices externally resolved names without deleting packet-carried names or preventing later resolution by another
          process.
    defender_model:
      paragraphs:
      - zh: 防守方需要把捕获会话同实际工具版本、完整且区分大小写的参数、有效解析设置、输入输出模式和有限的结果溯源连接。普通执行审计提供参数，不默认记录运行配置、包正文或结果；自定义采集器需要单独验证。按进程归属的解析遥测可作一致性检查，但不能以没有
          DNS 来代替这些正面证据，也不能把抓包文件里的 DNS 流量当作采集器主动发出的查询。
        en: Defenders must connect capture sessions with the actual tool version, complete case-sensitive arguments, effective
          enrichment settings, input and output mode, and bounded result provenance. Ordinary execution auditing supplies
          arguments rather than runtime configuration, packet contents, or results, and custom collectors require separate
          validation. Process-attributed resolution can corroborate consistency, but absent DNS cannot replace positive evidence,
          and DNS packets inside a capture are not necessarily queries generated by the collector.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 抑制观察器派生名称查询以减少解析日志中的测绘关联边
    en: Suppress observer-generated name queries to remove mapping edges from resolution logs
  analysis:
    paragraphs:
    - zh: 攻击者关闭解释已捕获地址时的主动名称补全，在本会调用外部解析的路径上减少采集器自身发出的查询。只依据这些解析事务推断调查主体和关注端点的规则因此失去关联输入，需要补充采集器配置、捕获范围和结果证据。NIST 的明确匿迹说明与固定版本选项规范共同支持这一有条件因果关系；未证明现场采用、每地址减少一条查询或具体漏报比例，故保持中等置信度。
      en: Disabling active enrichment reduces collector-generated queries on interpretation paths that would otherwise consult
        external resolution. Rules inferring the survey actor and endpoints of interest from those transactions lose an input
        and need collector configuration, capture scope, and result evidence. NIST's explicit stealth rationale and the pinned
        option specification jointly support this conditional causal chain. Field adoption, one fewer query per address, and
        particular miss rates remain unproven, so confidence is medium.
  confidence: medium
  evidence_refs:
