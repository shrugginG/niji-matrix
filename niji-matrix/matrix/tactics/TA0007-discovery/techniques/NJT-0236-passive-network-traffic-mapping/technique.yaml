schema_version: 2.0.0
type: technique
id: NJT-0236
name:
  zh: 网络流量被动测绘
  en: Passive Network-Traffic Mapping
summary:
  zh: 攻击者从已能观察的网络报文提取主机、通信关系和服务线索，以减少向目标主动查询产生的痕迹；事实范围受观察位置、流量出现时间和可解释字段限制。
  en: An adversary extracts host, communication-relationship, and service clues from network packets already visible to it,
    reducing traces from active target queries; knowledge remains limited by vantage point, traffic timing, and interpretable
    fields.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-adapted
    source_attack_id: T1040
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1040
definition_and_concept:
  paragraphs:
  - zh: 网络流量被动测绘是攻击者在受控主机、既有转发节点或流量副本上观察已经发生的通信，将可见报文中的地址、名称、协议和会话关系转换为环境知识。直接目标是了解哪些主体在通信、通信方向和可能的服务角色，为选择后续查询、横向路径或目标提供依据；不以产生新的目标响应作为测绘的必要条件。
    en: Passive Network-Traffic Mapping observes communications already occurring at an adversary-controlled host, existing
      forwarding node, or traffic copy and converts visible packet addresses, names, protocols, and session relationships
      into environmental knowledge. Its immediate purpose is to learn which entities communicate, in which direction, and
      with which possible service roles to inform subsequent queries, lateral paths, or target selection. Creating a new target
      response is not a necessary part of the mapping.
  - zh: 该概念由信息取得关系和结果定义，不由抓包工具、接口、PCAP 扩展名或云厂商定义。包捕获权限、开始命令和镜像配置只说明具备或请求观察能力；有效会话、实际接收报文和已解释的环境事实是不同证据阶段。端口号只能直接证明某次报文所带端口，不能单独证明服务实现、软件版本、可访问性或漏洞；这些结论必须保留协议证据和推断等级。
    en: The concept is defined by the acquisition relationship and information outcome rather than a capture tool, interface,
      PCAP extension, or cloud provider. Capture authority, a start command, and a mirror configuration establish capability
      or a request to observe. An active session, actual packet receipt, and interpreted environmental facts are separate
      evidentiary stages. A port number directly establishes only the port in that packet; service implementation, software
      version, accessibility, or vulnerability conclusions require protocol evidence and an explicit inference level.
stealth_characteristics:
  paragraphs:
  - zh: 网络流量被动测绘可使测绘读取发生在目标请求日志之外：原会话的源、目的和业务结果可以保持不变，而攻击者在另一个进程、设备缓冲或收集器中得到信息。只按新连接、端口扫描和目标侧查询频率监测的防守方可能无法识别这一读取动作，主要残余转为捕获主体、接口与过滤条件、镜像复制边、缓冲或解析产物及其去向。
    en: Passive Network-Traffic Mapping can place the discovery read outside target request logs. Original session endpoints
      and business results can remain unchanged while information reaches another process, device buffer, or collector. Monitoring
      based only on new connections, port scans, or target query frequency can miss that read. Principal residue instead appears
      in the capture principal, interface and filter, mirror copy edge, buffer or parsed artifact, and its destination.
  - zh: 原生诊断和监测能力的使用还会使采集动作与故障诊断、资产测量和安全监控相似，工具名与抓包格式因而难以区分意图。观察并不等于零网络活动：名称补全、远程管理、镜像传输或产物导出均可能产生独立连接。端到端加密限制正文解释，但地址、时序和部分头部等环境线索仍可能可见；静默主机、不可见交换端口和未覆盖时段也限制知识完整度。
    en: 'Native diagnostic and monitoring functions can make acquisition resemble troubleshooting, asset measurement, and
      security monitoring, so tool names and capture formats poorly distinguish intent. Observation does not imply zero network
      activity: name enrichment, remote administration, mirror transport, and artifact export can generate separate connections.
      End-to-end encryption limits payload interpretation while addresses, timing, and some headers can remain visible. Quiet
      hosts, unseen switch ports, and uncovered periods also limit knowledge completeness.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入从原端点、原有路径或不改变原交付的复制分支读取既有报文，并由这些报文取得环境事实的行为。普通网卡并不天然看见交换网络的全部流量，混杂模式也不能穿透未送达该端口的流量。主动服务探测和协议查询由 T1046 对应对象或 NJT-0001
      等主动交互对象承接；从日志、配置存储或云资产 API 读取历史记录不因内容涉及网络就成为报文嗅探。
    en: Include reading existing packets at an original endpoint, original path, or copy branch that does not change original
      delivery and deriving environmental facts from those packets. An ordinary network interface does not inherently see
      all switched-network traffic, and promiscuous mode cannot expose traffic never delivered to that port. Active service
      probes and protocol queries belong to the T1046 object or active-interaction objects such as NJT-0001. Reading historical
      logs, configuration stores, or cloud inventory APIs is not packet sniffing merely because the information concerns a
      network.
  - zh: 主动修改名称、网关、路由或代理以改变服务指向的行为由 NJT-0136 承接，诱使受害者新产生认证交换由 NJT-0165 承接；后续独立的被动观察结果可另行记录。认证材料获取归 NJT-0176，普通正文获取归相关 Collection
      对象。单一事件中的地址事实、可恢复凭据、正文和后续账户使用必须分别举证。合法诊断、NDR、事件响应和容量分析使用同样采集能力，需按主体、用途、源范围、输出目的地、期限及批准记录区分。
    en: Active changes to names, gateways, routes, or proxies that replace service direction belong to NJT-0136, and inducing
      a victim to emit a new authentication exchange belongs to NJT-0165; a separately supported passive-observation result
      can also be recorded. Authentication-material acquisition belongs to NJT-0176, and ordinary content acquisition to the
      applicable Collection object. Address facts, recoverable credentials, content, and later account use in the same event
      each require their own evidence. Authorized diagnostics, NDR, incident response, and capacity analysis use the same
      acquisition capabilities and require distinction by principal, purpose, source scope, destination, duration, and approval.
  - zh: 主动查询已发布的服务公告并读取自己的正常响应，属于主动发现关系，由 T1046 对应对象承接；不能只因信息经过网络返回就称为嗅探。只有另行建立的包捕获或观察关系，从预先存在或其他客户端产生的公告流量取得环境事实，才属于本对象；同一事务的查询响应和独立旁听证据必须分开。
    en: Actively querying published service advertisements and reading the normal response to one's own query is an active
      discovery relationship covered by the T1046 object, not sniffing merely because information returns over a network.
      This object requires a separately established packet-capture or observation relationship deriving facts from preexisting
      advertisements or traffic generated by other clients. Query-response evidence and independent listening evidence must
      remain separate even within one transaction.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在取得内部观察位置后，攻击者可等待普通业务或广播、组播通信出现，整理实际交谈的地址和名称，并在无需逐台主动询问的条件下选择后续调查目标。适用于允许较长观察时间且目标会产生可见流量的环境；只看到客户端连接某端口仍不足以证明服务可从攻击者位置访问。
      en: After obtaining an internal vantage point, the adversary can wait for business or broadcast and multicast traffic,
        organize addresses and names actually communicating, and select further investigation targets without actively querying
        every host. This suits environments that permit longer observation and where relevant targets produce visible traffic.
        Seeing a client contact a port still does not establish that the service is reachable from the adversary's position.
    - zh: 既有网络设备或合法监控收集器失陷时，攻击者可能利用这些位置已经拥有的流量可见性，按接口和时间提取通信关系。Talos 对 VPNFilter 插件的逆向分析证明原始套接字嗅探与 Modbus 流量识别能力存在；该资料用于说明实现能力，不证明某受害网络的资产清单已返回，也不把工业目标另立为子技术。
      en: When an existing network device or authorized monitoring collector is compromised, an adversary may use visibility
        already held there to derive communication relationships by interface and time. Talos's reverse engineering of a VPNFilter
        plugin establishes raw-socket sniffing and Modbus traffic-recognition capability. This supports implementation feasibility,
        not a claim that an asset inventory was returned from a particular victim, and does not make industrial targets a
        separate child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须控制一个实际可接收目标报文的观察位置，并具备该位置要求的权限，例如 Linux CAP_NET_RAW、管理员抓包权限、网络设备特权命令或云镜像创建权限。权限与可见性不能互相替代；要跨未覆盖网段观察，必须另行取得转发、镜像或物理接入条件，不能假定一次混杂模式设置即可覆盖全部内部网络。
        en: The adversary must control a vantage point that actually receives relevant packets and possess the authority required
          there, such as Linux CAP_NET_RAW, administrative capture rights, privileged network-device commands, or cloud mirror-creation
          permissions. Authority and visibility do not substitute for one another. Observing uncovered segments requires separately
          established forwarding, mirroring, or physical-access conditions rather than assuming one promiscuous-mode setting
          covers the entire internal network.
      - zh: 攻击者还需能解释所见协议或元数据，并容忍等待目标通信；对加密正文的解释另需终止位置或解密条件。即使没有完整 PCAP，实时解析也可能产出事实，因此保存文件不是必要前提。静默目标、丢包、采样、封装、NAT 和过期地址映射会降低知识质量，后续验证可能需要另一个主动技术。
        en: The adversary also needs to interpret observed protocols or metadata and tolerate waiting for target communications;
          encrypted payload interpretation separately requires termination access or decryption conditions. Real-time parsing
          can produce facts without a complete PCAP, so file retention is not necessary. Quiet targets, loss, sampling, encapsulation,
          NAT, and stale address mappings reduce knowledge quality, and subsequent validation may require a separate active
          technique.
    defender_model:
      paragraphs:
      - zh: 防守方假定可以取得至少一种观察面生命周期证据，并以资产角色和合法诊断任务建立授权关系。端点可提供进程与抓包输出，设备可提供命令记账和运行缓冲状态，镜像控制面可提供资源变更及收集器记录。目标服务日志通常不记录谁旁听了报文；采集器接收计数只证明接收，环境事实确认还依赖受限的解析或取证证据。
        en: The defender is assumed to obtain at least one observation-surface lifecycle source and maintain authorization
          relationships using asset roles and legitimate diagnostic tasks. Endpoints can provide process and capture output,
          devices command accounting and buffer state, and mirror control planes resource changes and collector records. Target
          service logs normally do not identify packet listeners. Collector receipt counters establish receipt only; confirmed
          environmental facts additionally require restricted parsing or forensic evidence.
      - zh: 防守方应保存事件时资源版本、接口或组件映射和有限的结果溯源，而非将完整报文正文广泛汇入 SIEM。确认记录可包含产物 hash、帧号或记录号、所见事实类别、观察时间、解析器和推断等级。设备未启用审计、合法收集器被劫持、内存内解析以及物理接收器可能超出该观察模型；无法取得结果时应保留较低阶段的异常而不推断已取得环境知识。
        en: Retain event-time resource versions, interface or component mappings, and bounded result provenance rather than
          broadly centralizing full packet payloads in a SIEM. Confirmation can record artifact hash, frame or record number,
          fact class, observation time, parser, and inference level. Unaudited devices, hijacked authorized collectors, memory-only
          parsing, and physical receivers may fall outside this model. When results are unavailable, retain the lower-stage
          anomaly without asserting acquired environmental knowledge.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 从既有流量取得环境线索使读取动作落在目标查询日志之外
    en: Derive environmental clues from existing traffic outside target query logs
  analysis:
    paragraphs:
    - zh: 攻击者选择可接收既有报文的观察位置而不必向目标发起新的发现请求，原会话仍可正常完成。测绘痕迹因而从目标查询事件移向捕获进程、设备缓冲和复制控制面，依赖扫描频率或目标请求日志的监测难以直接看到旁听读取。NIST 对被动发现的说明和包捕获接口支持这一因果关系；匿迹效果只相对于缺少观察面遥测的防守模型成立，不能据此宣称抓包天然不可检测。
      en: The adversary chooses a position receiving existing packets without needing to send a new discovery request, and
        original sessions can complete normally. Mapping residue moves from target query events into capture processes, device
        buffers, and copy control planes. Monitoring based on scan frequency or target request logs cannot directly see the
        listening read. NIST's passive-discovery treatment and packet-capture interfaces support this chain, whose stealth
        effect is conditional on missing observation-surface coverage rather than inherent undetectability.
  confidence: medium
  evidence_refs:
  - REF-001258
  - REF-000796
  - REF-000794
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 借用合法流量诊断外观增加未授权测绘与正常监控的区分成本
    en: Borrow legitimate traffic-diagnostic features to complicate distinction from authorized monitoring
  analysis:
    paragraphs:
    - zh: 使用原生抓包和镜像能力时，采集命令、过滤器、资源类型和输出格式与合法诊断相同，恶意与正常差异主要体现在主体授权、观察范围和结果处置。防守方即使发现采集也不能仅凭工具名判断目的，需要连接工单、业务所有者和输出去向。官方实现文档支持外观重叠，联合通告证明原生抓包能力确被攻击者滥用，但通告的凭据案例不证明本对象的环境结果，且没有测量这种相似性带来的检测下降。
      en: Native capture and mirroring use commands, filters, resource types, and output formats also used by authorized diagnostics.
        The main malicious distinctions concern principal authorization, observed scope, and result handling. Even visible
        acquisition requires approval, business-owner, and destination context to interpret purpose. Implementation documentation
        establishes the feature overlap, and the joint advisory establishes adversary abuse of native capture. Its credential-focused
        cases do not establish this object's environmental outcomes, and no measurement quantifies a resulting detection reduction.
  confidence: medium
  evidence_refs:
  - REF-000794
  - REF-000797
  - REF-000795
  - REF-000792
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前建立主动名称补全抑制子项，变量是解释所见报文时是否关闭本可发起的外部名称补全。NIST 的明确匿迹说明与固定 tcpdump 版本规范提供能力层级的因果支持；它不同于父级捕获位置与权限，要求额外保留有效解释设置、输入输出模式和捕获关联事实。该子项保持中等置信度，没有被改写成恶意现场采用案例。
      en: The current child is Active Name-Enrichment Suppression, whose variable is disabling external name enrichment that
        could otherwise occur while interpreting observed packets. NIST's explicit stealth rationale and a pinned tcpdump
        specification provide capability-level causal support. This differs from parent capture position and authority and
        adds effective interpretation settings, input/output mode, and capture-linked fact requirements. Confidence remains
        medium without rewriting capability evidence as malicious field adoption.
    - zh: 观察位置与复制拓扑、过滤与截短、短时或环形缓冲以及实时解析等其他轴保留待研究，不能改名复制 NJT-0176 的凭据结果子项。被动观察属于父级核心，主动路径介入和新诱发认证归相邻对象。数值显示、DNS 缺席、-N 或纯写包不单独成立新子项；未来需要按具体采集器和结果验证补全抑制的实际效果。
      en: Other axes, including observation position and replication, filtering and truncation, short or ring buffers, and
        real-time parsing, remain research candidates rather than renamed NJT-0176 credential-result children. Passive observation
        defines the parent behavior; active path intervention and induced authentication belong to neighbors. Numeric display,
        absent DNS, -N, and raw-save-only mode do not individually establish the new child. Actual suppression effects require
        collector- and result-specific validation.
  coverage: established
  subtechnique_refs:
  - NJS-0236-001
