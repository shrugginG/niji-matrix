schema_version: 2.0.0
type: technique
id: NJT-0237
name:
  zh: 密码策略发现
  en: Password Policy Discovery
summary:
  zh: 调查密码构造、期限或锁定约束，以调整后续行动，并借用日常账号管理与自助读取接口降低调查目的的可区分性。
  en: Investigate password construction, aging, or lockout constraints to inform subsequent actions while borrowing routine
    account-management and self-service reads that make the survey's purpose harder to distinguish.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1201
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1201
definition_and_concept:
  paragraphs:
  - zh: 密码策略发现是攻击者取得账号或组织用于约束口令选择、更新、有效期和失败锁定的规则信息，以理解认证环境并规划后续行动的环境测绘行为。直接目标是规则及其作用范围，而不是口令值、认证令牌或一次登录是否能够成功。查询可以针对本机、域、具体用户或云账号，所得信息可帮助判断后续操作的成本与约束，但规则公开本身并不等于认证已经受到绕过。
    en: Password Policy Discovery is the acquisition of rules governing password selection, change, lifetime, and failure
      lockout for accounts or organizations, allowing an adversary to understand the authentication environment and plan subsequent
      actions. The immediate objective is the rules and their scope rather than password values, authentication tokens, or
      whether a sign-in succeeds. Queries can concern a host, domain, particular user, or cloud account. The information informs
      operational cost and constraints, but visibility of a rule does not establish an authentication bypass.
  - zh: 规则视图必须连同来源解释。域默认策略与某个用户的有效密码设置对象可能不同；本地账号期限输出不包含外部目录施加的所有约束，配置文件中的强度参数也可能被服务所用模块参数覆盖。一次成功的规则读取只证明所返回的视图，不能推断所有账号都受同一规则约束，也不能从未返回的字段断言不存在相应保护。
    en: Interpret a rule view together with its source. A domain default can differ from a user's resultant password-settings
      object. Local account-aging output omits constraints imposed by external directories, and strength parameters in a configuration
      file can be overridden by module arguments used by a service. A successful read establishes only the returned view;
      it does not show that every account shares the rule or that protection is absent when a field was not returned.
stealth_characteristics:
  paragraphs:
  - zh: 密码策略发现与账号过期排查、密码更新提示、合规评估及帮助台工作共享可读参数和接口。攻击者使用已有读取身份或日常系统组件时，事件外观可能与正常查询相同，且无需伴随策略写入或认证失败。匿迹收益主要表现为单次可见读取难以说明真实目的；可执行文件签名、读取授权或成功状态都不能独立区分自助服务和对抗性规划。
    en: Password Policy Discovery shares readable parameters and interfaces with account-expiry troubleshooting, password-change
      guidance, compliance reviews, and help-desk work. An adversary using an existing read identity or ordinary system component
      can produce events resembling legitimate queries without policy writes or failed authentication. Its principal stealth
      benefit is ambiguity of purpose in an individual visible read. An executable signature, read entitlement, or successful
      status cannot independently distinguish self-service from adversarial planning.
  - zh: 进程与脚本记录通常暴露调用而非返回规则，云审计也可能不保存只读响应。防守方因而可能知道发生过调查，却无法仅凭这些记录还原攻击者得到哪些限制。网络连接、调用方法、主体、目标与任务来源仍可能存在；缺少返回值或某种前序事件不表示无痕，更不能把传感器未配置直接解释为攻击者实施了独立匿迹技术。
    en: Process and script records generally expose invocations rather than returned rules, and cloud auditing can omit read-only
      responses. Defenders may therefore know that a survey occurred without reconstructing the constraints learned from those
      records alone. Connections, methods, identities, targets, and work origins can remain visible. Missing return values
      or a particular preceding event do not make the activity traceless, and unconfigured telemetry does not itself establish
      a distinct attacker-selected evasion technique.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入明确读取或尝试读取密码长度、复杂性、历史、期限、变更要求及账号失败锁定约束的行为，并保留目标账号、域、服务和策略视图。只读命令、管理 API 或配置文件读取均可实现该信息目标；帮助输出、无对应读取语义的进程启动和仅有登录事件不能证明规则已经被取得。正常用户查询自身期限、支持人员排查和审计作业是主要反例，恶意判断需要任务与行为语境。
    en: Include reads and attempted reads of password length, complexity, history, aging, change requirements, and account
      failure-lockout constraints, retaining the target account, domain, service, and policy view. Read-only commands, management
      APIs, and configuration-file reads can all serve this objective. Help output, process launch without corresponding read
      semantics, and logon events alone do not establish acquisition. Users checking their own expiry, support troubleshooting,
      and audit jobs are major benign counterparts, so malicious classification requires work and behavioral context.
  - zh: 通用 GPO 对象、链接与应用范围调查归组策略发现；发现账号或组成员关系属于其相应信息对象。提交候选口令、验证秘密、读取密码散列、导出认证数据库及更改密码规则不归本技术，尽管它们可能出现在相邻阶段。读取配置文件中的公开规则不能自动扩展为该文件中秘密的窃取；AWS
      IAM 用户的账号密码策略也不能代表根用户、联邦身份或整个组织的所有认证控制。
    en: General investigation of GPO objects, links, and application scope belongs to Group Policy Discovery, while account
      or group-membership investigation follows those information objects. Submitting candidate passwords, validating secrets,
      reading password hashes, exporting authentication databases, and changing password rules are outside this technique
      even when adjacent in a sequence. Reading public rules in a configuration file does not automatically establish theft
      of secrets from that file. An AWS account's IAM-user password policy does not represent root-user, federated-identity,
      or organization-wide authentication controls.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 获得端点会话或目录访问后，攻击者可能先理解本地与域密码限制，再决定是否继续针对账号、凭据或横向访问开展行动。在账号存在有效细粒度策略的环境中，仅了解域默认值可能不足以支持特定目标决策，调查因此可能继续指向用户的实际策略对象。此阶段的观察是调查意图和操作范围，不应因之后出现认证活动而反向认定每次规则查询都已导致口令试探。
      en: After obtaining an endpoint session or directory access, an adversary can inspect local and domain password constraints
        before deciding whether to pursue accounts, credentials, or lateral access. Where fine-grained policies apply, a domain
        default may not answer a target-specific question, so surveying can continue to the user's resultant policy object.
        Observations at this stage concern survey intent and scope; later authentication activity must not retroactively turn
        every policy read into demonstrated password probing.
    - zh: 在云环境中，已取得的 IAM 身份可以通过允许的接口询问账号规则；同一调用也会由密码更新界面和账号管理自动化发起。本地 Linux 的期限查询与 PAM 规则读取适用于理解所访问主机的认证设置，但必须核对用户来源及实际服务栈，避免将主机文件当作中央身份提供方的最终规则。
      en: In a cloud environment, an acquired IAM identity can query account rules through an allowed interface, while password-change
        interfaces and account-management automation make the same call. Linux aging queries and PAM-rule reads help understand
        the accessed host's authentication configuration, but account origin and the actual service stack must be checked
        rather than treating host files as authoritative rules for a central identity provider.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能访问相应读取面并获得有用反馈，例如端点代码执行、具备目录读取权限的会话或拥有相应 IAM 操作权限的身份。并非所有读取都要求管理员，权限也不能跨平台照搬；访问拒绝、目标错误和不存在的自定义云策略都会限制返回结果。攻击者可以选择查询目标和接口，但没有证据时不能额外假定其控制传感器、拥有所有用户的有效策略或知道准确锁定计数。
        en: The adversary needs access to the relevant read surface and useful feedback, such as endpoint execution, a directory-readable
          session, or an identity permitted to perform the IAM operation. Not every read requires administration, and rights
          cannot be generalized across platforms. Denied access, incorrect targets, and absent custom cloud policies constrain
          results. The adversary can select targets and interfaces, but control of sensors, knowledge of every user's resultant
          policy, or precise lockout counters must not be assumed without evidence.
    defender_model:
      paragraphs:
      - zh: 防守方可能保留启用命令行的进程创建、受配置控制的 PowerShell 脚本块、预先部署的 Linux 审计、云 API 事件及可解析的 SAMR 网络请求。各观察面能证明的事实不同，进程启动、RPC 调用、服务器拒绝和取得有效规则应分开表达；日志字段必须用实际传感器样本验证。批准任务、账号管理角色、源设备与目标范围提供正常基线，不能只按工具名或管理员身份长期放行。
        en: Defenders may retain process creation with command lines, configured PowerShell script blocks, predeployed Linux
          auditing, cloud API events, and decodable SAMR requests. These surfaces establish different facts, so process launch,
          RPC invocation, server denial, and acquisition of valid rules must be expressed separately, with fields verified
          against actual sensor samples. Approved work, account-management roles, origin devices, and target scope supply
          benign context; tool names or administrator identities must not receive permanent blanket allowances.
      - zh: 本地 API 调用、自定义读取程序、加密管理流量、日志丢失和未采集的输出限制完整性。目录默认值与目标有效值需要额外来源才能关联，云只读事件不能自动恢复响应内容。该观察模型支持识别异常调查及其范围，不默认具备对所有原生查询的完整审计，也不保证从一条事件识别攻击者动机。
        en: Local APIs, custom readers, encrypted management traffic, lost records, and uncollected output limit completeness.
          Relating directory defaults to target-effective values needs additional evidence, and cloud read-only events do
          not automatically reconstruct response contents. This observation model supports identification of abnormal surveying
          and scope without assuming complete auditing of every native query or intent attribution from one event.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用账号管理与自助读取的相同请求外观，增加对抗性调查与正常规则核查的区分难度
    en: Borrow account-management and self-service request features so hostile surveying is harder to distinguish from legitimate
      rule checks
  analysis:
    paragraphs:
    - zh: 攻击者通过正常规则读取功能取得规划信息，产生的命令、操作名或文件访问可与用户查阅自身期限、管理人员核对域规则及云密码更新流程重叠。可见请求因此缺少单独表明攻击目的的特征，依赖签名工具、授权成功或调用名称的分类会把两种活动混在一起。将请求与源设备、目标策略视图和实际任务连接，仍可恢复异常上下文；该结论是由真实调查行为和合法接口用途共同支持的可区分性推断，并非量化的规避效果。
      en: The adversary obtains planning information through ordinary rule-reading functions, producing commands, operation
        names, or file accesses that overlap users checking their own expiry, administrators verifying domain rules, and cloud
        password-change workflows. Visible requests therefore lack features that independently establish hostile purpose,
        and classification based on signed tools, authorization success, or operation names conflates the activities. Joining
        requests with origin devices, target policy views, and actual work can still recover abnormal context. This is an
        inference about distinguishability supported by observed surveying and legitimate interface uses, not a measured evasion
        result.
  evidence_refs:
  - REF-001049
  - REF-001261
  - REF-001267
  - REF-001265
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前按攻击者主动改变查询可归属性、操作链可见性、时间分布和读取来源的可能性检查分类。平台、命令、云产品、密码字段以及默认值与有效值都是实现或信息范围，不能单凭这些差异划分匿迹子技术。当前没有足够证据把某个候选变量确认为有意采用且防守观察有别的稳定子项，保留分类开放以等待更明确的实现和观察对比。
      en: Taxonomy currently examines possible attacker-selected changes to query attribution, operation-chain visibility,
        timing, and read provenance. Platforms, commands, cloud products, password fields, and default versus effective values
        describe implementation or information scope rather than sufficient evasion boundaries. Evidence does not yet establish
        a candidate variable as a stable, intentionally selected child with distinct defensive observation. Keep the taxonomy
        open for clearer implementation and observation comparisons.
  coverage: deferred
  subtechnique_refs: []
