research:
  limitations:
    paragraphs:
    - zh: Trellix 与 ESET 支持具体反馈式设备发现设计，但没有公布同一样本的轮询版本、全部返回数据或检测差分。Trellix 的主动轮询对照是作者的技术解释，不能直接等同于已测规避；Attor 监听后的主动设备访问也不能描述成全程被动。接口类过滤与卷事件必须按官方结构分别校验。
      en: Trellix and ESET support specific feedback-based discovery designs but provide neither a polling version of the
        same sample, complete returned data, nor detection differentials. Trellix's polling comparison is the author's technical
        interpretation rather than measured evasion. Attor's active device access after listening cannot be described as wholly
        passive. Interface-class filters and volume events require separate validation against official structures.
    - zh: 合法应用普遍使用通知，单个订阅或隐藏窗口无法证明恶意。Windows 专用追踪须先验证字段与覆盖；默认进程日志可能完全看不到接收，Linux 命令路径分析也会漏掉进程内实现。缺少事件期间无法区分无变化、丢失遥测和未运行；因此分析保留不确定状态并依赖正面接收与结果证据。
      en: Legitimate applications widely use notifications, so a subscription or hidden window alone does not establish maliciousness.
        Windows tracing requires prior field and coverage validation; default process logs may miss reception completely,
        and Linux command-path analysis misses in-process implementations. During event absence, unchanged devices, lost telemetry,
        and inactive listeners cannot be distinguished. Analytics therefore retain uncertainty and require positive receiving
        and result evidence.
