schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0238-001
name:
  zh: 通知驱动外围设备发现
  en: Notification-Driven Peripheral Discovery
summary:
  zh: 有意通过设备变更通知取得增量设备事实，代替持续重复的设备快照，并将查询痕迹集中到变更附近。
  en: Deliberately obtain incremental device facts through device-change notifications instead of continuously repeating snapshots,
    concentrating query traces around changes.
aliases: []
parent_ref: NJT-0238
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 通知驱动外围设备发现是攻击者建立或利用设备变更反馈关系，等待连接、可用或移除变化，再从反馈本身或必要的补充查询取得设备事实的行为。稳定变量是发现由变更反馈触发，而不是持续定时重建清单。注册回调、窗口接收和 netlink 监听是实现途径；某些默认广播无需额外注册，不能把一个
      API 名称设为分类前提。
    en: Notification-Driven Peripheral Discovery establishes or uses device-change feedback, waits for connection, availability,
      or removal changes, and derives device facts from feedback or necessary supplementary queries. The stable variable is
      a change-feedback trigger rather than continuous timed inventory reconstruction. Callback registration, window reception,
      and netlink listening are implementations. Some default broadcasts require no additional registration, so one API name
      cannot be a classification prerequisite.
  - zh: 该选择与发现结果的后继使用分开。收到到达通知可以给出接口或设备类型线索，后续打开设备、读取具体属性及取得内容仍有各自结果。Trellix 的逆向直接讨论通知监听替代轮询的噪声差异；Attor 的反馈后设备指纹提供独立实施证据，但不能由其监听架构单独推断规避动机或测量效果。
    en: This selection is separate from later use of discovery results. An arrival message can reveal an interface or device-type
      clue, while later device opening, property reads, and content acquisition have separate outcomes. Trellix's reverse
      engineering directly discusses the noise difference from notification listening instead of polling. Attor's feedback-driven
      device fingerprinting independently establishes implementation, but its listener architecture alone does not establish
      an evasion motive or measured effectiveness.
stealth_characteristics:
  paragraphs:
  - zh: 通知驱动外围设备发现把长期监视的可见活动压缩为接收关系和零散变更处理。设备状态不变时缺少重复枚举峰值，使按命令执行次数或短时 API 计数识别盘点的防守方容易遗漏持续关注。接入后仍可能出现属性请求和结果写入，订阅上下文、接收进程及其存活时间也是正面证据，不能用“没有查询”反推该实现。
    en: Notification-Driven Peripheral Discovery compresses visible ongoing monitoring into a receiving relationship and sparse
      change handling. Without state changes, repeated enumeration peaks are absent, weakening discovery based on command
      counts or short-term API counts. Property queries and result writes may still follow arrival, while receiving context,
      process identity, and lifetime remain positive evidence. Absence of queries cannot establish this implementation.
  - zh: 匿迹收益取决于原本会持续轮询的对照和实际变更频率；持续热插拔或集中补查会使处理并不稀疏。启动快照可以补足已经在场设备，随后通知也可能重复报告同一接口。合法后台设备服务具有相同节奏，因此需要把变更来源、事实取得和授权任务连接，而不是把长驻监听器本身当作告警结论。
    en: The stealth benefit depends on a baseline that would otherwise keep polling and on actual change frequency; continuous
      hotplug or concentrated follow-up queries can make handling dense. A startup snapshot may cover already-present devices,
      and later notification may report the same interface again. Legitimate background device services have similar timing,
      requiring linkage among the change source, fact acquisition, and authorized work rather than treating a resident listener
      alone as a verdict.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要证明接收设备变更的执行上下文和以该反馈取得设备事实的链，并有设计、配置或行为证据说明以此替代持续快照。只调用注册函数而失败、只有 API 导入、只有系统 6416、普通窗口被动收到广播或偶发低频查询均不足。进程注册成功、收到反馈和返回设备事实应分别记录，不能互相代替。
    en: Inclusion requires an execution context receiving device changes, a chain from that feedback to device facts, and
      design, configuration, or behavioral evidence that this replaces continuous snapshots. A failed registration call, API
      imports alone, system 6416 alone, incidental broadcast delivery, or infrequent queries is insufficient. Successful registration,
      feedback reception, and returned device facts require separate records rather than substitution for one another.
  - zh: 设备插入后实际复制载荷属于传播，读取文件内容属于采集，伪造设备身份属于另一个行为。它们可与本子项形成链，不能用后继动作替代发现证明。Windows 接口到达通知与卷广播应按各自结构解释；Linux 内核 uevent 和规则处理后事件也可能重复或由测试重放，不能把每条事件当作新物理插入。
    en: Copying a payload after insertion is propagation, reading file contents is collection, and falsifying device identity
      is another behavior. These may form a chain with this child but cannot replace discovery evidence. Windows interface-arrival
      notifications and volume broadcasts require their respective structures. Linux kernel uevents and post-rule events may
      duplicate or be test replays, so each event cannot be treated as a new physical insertion.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 该设计适合可长期保留执行上下文、目标设备间歇接入且允许等待的驻留活动。在安静阶段只等待变化，接入后再取得相关设备事实，可支持后续目标选择。它不适合要求立即得到全机完整清单的任务，除非另有启动快照；现有 Windows 恶意样本证明可实施性，Linux
        官方能力不等于已发现相同恶意活动。
      en: The design suits residence with a long-lived execution context, intermittently attached targets, and tolerance for
        waiting. Waiting during quiet periods and obtaining facts after arrival can support later target selection. It does
        not immediately provide a complete host inventory without an additional startup snapshot. Existing Windows malware
        establishes implementability; Linux's documented capability does not establish an equivalent observed campaign.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须能保留接收消息或回调的进程、服务或监听套接字，正确设置感兴趣的设备范围，并解释反馈。发现基本标识不默认要求打开设备内容权限，但补充查询可能失败。挂起、重启、消息队列处理缺陷、过滤错误或丢失反馈都会使视图不完整；攻击者不能控制正常使用者何时接入目标设备。
        en: The adversary must retain a process, service, or listening socket receiving messages or callbacks, select the
          relevant device scope, and interpret feedback. Basic identification does not universally require content-access
          authority, although supplementary queries may fail. Suspension, restart, queue-handling defects, incorrect filters,
          and lost feedback can leave incomplete views. The adversary does not control when an ordinary user attaches a target
          device.
    defender_model:
      paragraphs:
      - zh: 防守模型针对只有进程和短窗口查询计数的常规观察，并考虑专用追踪增强后的差异。经验证的调用追踪可保留接收上下文、返回状态、通知结构及后继属性结果；Linux 命令审计能识别显式 monitor 启动但看不到所有进程内 libudev
          监听。设备识别日志提供变更时刻，通常不指出哪个应用收到了广播，因此它只能作旁证。
        en: The defender model begins with ordinary process telemetry and short-window query counts and considers added dedicated
          tracing. Validated call tracing can retain receiving contexts, return status, notification structures, and subsequent
          property results. Linux command auditing can identify explicit monitor execution but not every in-process libudev
          listener. Recognition logs provide change timing and usually do not identify which application received a broadcast,
          so they are corroboration only.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 用变更反馈替代重复快照使监视痕迹跨接收生命周期稀疏分布
    en: Replace repeated snapshots with change feedback so monitoring traces are sparse across the receiving lifetime
  analysis:
    paragraphs:
    - zh: 攻击者选择先保留反馈关系再等待实际变更，使没有设备变化的时间段不再重复生成设备清单请求。短窗口计数因而只看到最初建立和后来处理的片段，恢复持续设备监视需要跨越接收生命周期关联。Trellix 对轮询噪声的明确对比和官方消息合同支撑这一有意可选设计；没有公开控制实验，不能声称所有传感器失效或所有监听都是为了匿迹，故置信度保持中等。
      en: The adversary first retains a feedback relationship and waits for actual changes, avoiding repeated device inventories
        during unchanged periods. Short-window counts consequently see fragments at initial establishment and later handling,
        while reconstructing continued monitoring requires correlation across the receiving lifetime. Trellix's explicit polling-noise
        comparison and official message contracts support this intentionally selectable design. Without controlled experiments,
        the claim is neither universal sensor failure nor stealth intent for every listener, so confidence is medium.
