schema_version: 2.0.0
type: technique
id: NJT-0238
name:
  zh: 外围设备发现
  en: Peripheral Device Discovery
summary:
  zh: 识别主机连接或已识别的外围设备及其状态，借用正常设备管理外观，或以通知驱动反馈降低持续盘点痕迹。
  en: Identify peripherals connected to or recognized by a host and their states, borrowing ordinary device-management appearance
    or using notification-driven feedback to reduce continuous inventory traces.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1120
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1120
definition_and_concept:
  paragraphs:
  - zh: 外围设备发现是攻击者在取得主机执行或查询能力后，获取外围设备身份、类别、接口以及连接或可用状态，以理解终端用途和后续行动条件的行为。键盘、摄像头、读卡器、调制解调器及可移动设备都是可能对象，但设备类别和总线名称不决定匿迹分类。发现可以来自一次设备清单、状态查询，也可以来自已建立的设备变更通知关系。
    en: Peripheral Device Discovery obtains peripheral identity, class, interface, and connection or availability state after
      an adversary gains host execution or query capability. It informs terminal function and conditions for later activity.
      Keyboards, cameras, card readers, modems, and removable devices are possible subjects, but classes and bus names do
      not define stealth taxonomy. Discovery can use a device snapshot, a state query, or an established device-change notification
      relationship.
  - zh: 需要区分发起请求、收到通知、接口返回成功与取得可用设备事实。已安装的设备记录可能对应已拔除设备；启用接口说明操作系统提供了某种访问路径，仍不保证调用者有权打开设备或取得内容。Windows PnP 管理器掌握在场状态，直接读取历史注册表项不能代替该判断。这种结果分层避免把普通清单误解为实际使用设备的能力。
    en: Distinguish issuing a request, receiving a notification, an interface reporting success, and obtaining a usable device
      fact. An installed record may describe a disconnected device. An enabled interface indicates an operating-system access
      path but does not guarantee that the caller can open it or obtain content. The Windows PnP manager maintains presence
      state; historical registry entries cannot replace that determination. These result levels prevent an inventory from
      being mistaken for actual device-use capability.
stealth_characteristics:
  paragraphs:
  - zh: 外围设备发现使用的接口也服务于兼容性检查、打印和会议配置、资产管理以及插拔处理。攻击者借用这些正常功能时，签名工具名、设备类查询或一次只读请求难以表明设备事实的后续用途。进程、参数、主体、查询范围和结果仍可观察；是否属于敌对活动需要结合批准任务、调用来源和入侵上下文判断。
    en: Peripheral Device Discovery uses interfaces also needed for compatibility checks, printer and conferencing setup,
      asset management, and hotplug handling. When adversaries borrow these functions, a signed utility name, a device-class
      query, or one read request poorly reveals the later purpose of the device facts. Processes, arguments, principals, query
      scope, and results can remain observable. Hostile use requires approved-work comparison, caller provenance, and intrusion
      context.
  - zh: 有意把反复枚举改为等待设备变更反馈，可以使安静阶段主要保留接收上下文与存活进程，把补充查询集中到实际变更附近。这样会削弱依赖重复执行或短窗口查询量的分析，但接收关系、消息处理、后续设备访问及输出仍可作为关联点；默认广播不要求每次都能观察到显式注册。高频插拔、重放事件和启动时快照会增加活动量，通知驱动也不意味着痕迹消失。
    en: Deliberately replacing repeated enumeration with device-change feedback can leave mainly a receiving context and resident
      process during quiet periods, concentrating supplementary queries around actual changes. This weakens analytics relying
      on repeated execution or short-window query counts, while reception, message handling, later access, and output remain
      correlation points. Default broadcasts do not require an observable explicit registration each time. Frequent hotplug
      changes, replayed events, and startup snapshots can increase activity; notification-driven operation does not remove
      traces.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入以外围设备事实为直接结果的枚举、状态查询及设备变更反馈解释，包括从返回的设备实例标识、描述或接口信息识别设备。对可移动存储，同一次操作中的设备身份和连接事实可归本技术，卷容量和文件系统事实归本地存储发现，实际文件枚举和内容复制另行判断。仅列出驱动包而没有设备事实属于设备驱动程序发现。
    en: Include enumeration, status queries, and interpretation of device-change feedback whose direct result is a peripheral
      fact, including identification from returned device-instance IDs, descriptions, or interface information. For removable
      storage, device identity and connection facts from one operation can belong here, while volume capacity and filesystem
      facts belong to Local Storage Discovery and actual file enumeration or copying requires separate assessment. A driver-package
      listing without device facts belongs to Device Driver Discovery.
  - zh: 排除单纯安装或禁用设备、输入注入、摄像或录音、介质传播及文件取数。进程、窗口或一般硬件配置清单也不因可能间接涉及外设就自动归入。合法支持工具、会议软件、辅助设备管理与取证工作有相同外观；设备热插拔或系统重建自身产生的通知不是攻击者发起的查询。缺少进程启动、缺少
      6416 或只有历史设备记录，都不能单独证明隐藏发现或当前连接。
    en: Exclude device installation or disablement alone, input injection, camera or audio recording, removable-media propagation,
      and file acquisition. Process, window, or general hardware-configuration inventories do not automatically belong here
      merely because they might indirectly concern peripherals. Support tools, conferencing software, accessibility-device
      management, and forensics have similar appearances. Notifications from hotplug or system reconstruction are not adversary-issued
      queries. Absent process creation, absent 6416, or historical records alone establish neither hidden discovery nor current
      connection.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可在终端驻留期间识别工作站是否提供会议设备、认证外设或临时接入介质，再选择后续模块和目标。ESET 的 Attor 分析证明接入后设备指纹行为，Trellix 的恶意挖矿集群分析证明到达通知参与传播目标识别；两者都不能据此推断每台受害主机上后继动作成功。正常环境的通知接口说明如何持续获得变更，跨平台范围不等于各平台都有同等实案证据。
      en: During endpoint residence an adversary can identify conferencing equipment, authentication peripherals, or temporarily
        attached media before selecting later modules and targets. ESET's Attor analysis establishes post-arrival device fingerprinting,
        and Trellix's mining-cluster analysis establishes arrival notifications in propagation-target identification. Neither
        establishes successful follow-on actions on every victim. Ordinary notification interfaces explain continued change
        discovery, while cross-platform scope does not imply equally strong incident evidence on every platform.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能提交具有外围设备查询语义的请求，或保有能够解释设备变更反馈的应用、服务或会话；实际取得事实是需要另行确认的结果。普通用户可访问的设备元数据和需要额外设备访问权限的操作不同，不能统一假设管理员权限。通知驱动实现还需要保持处理上下文存活、正确解释通知类型，并接受未发生变更时没有新增事实；设备打开或内容读取可能仍被访问控制拒绝。
        en: The adversary needs to submit requests with peripheral-query semantics or retain an application, service, or session
          that can interpret device-change feedback. Acquiring facts is a separately confirmed outcome. Ordinary-user metadata
          access differs from operations requiring additional device authority, so administrator access is not universally
          assumed. Notification-driven implementations need a live handling context, correct notification interpretation,
          and tolerance for no new facts while no change occurs. Device opening or content reading may remain denied.
    defender_model:
      paragraphs:
      - zh: 防守方可能有端点进程和命令行、按策略开启的脚本块与 Linux exec 审计，以及已启用的 PnP 设备识别记录。前者主要给出请求语义，后者主要给出设备状态事件；6416 的主体通常是 SYSTEM，不能用来归属任意设备查询进程。需要验证的专用调用追踪才能提供进程内订阅、消息处理和返回事实。缺少该追踪时，不能把默认
          EDR 或插拔日志描述成完整查询审计。
        en: Defenders may have endpoint process and command-line records, policy-enabled script-block and Linux execution
          audit, and enabled PnP recognition records. Execution sources mainly describe request semantics; device events mainly
          describe state. The 6416 principal is commonly SYSTEM and cannot attribute arbitrary device queries. Dedicated,
          validated call tracing is needed for in-process subscriptions, message handling, and returned facts. Without it,
          default EDR or hotplug logs cannot be described as complete query auditing.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用正常设备盘点与插拔处理的接口外观
    en: Borrow the interface appearance of ordinary device inventory and hotplug handling
  analysis:
    paragraphs:
    - zh: 攻击者使用设备管理功能取得外围设备事实，留下与合法支持、资产管理和应用配置相同的查询外观。接口本身可见时，单靠工具签名或设备类名称仍难以区分维护与敌对目标选择；将调用者、批准工作和具体返回事实相接才能加强判断。恶意软件逆向与官方功能合同支持这种正常与恶意功能重叠，但未量化漏报，故对此机理保持中等置信度。
      en: An adversary uses device-management functions to obtain peripheral facts, leaving query appearances shared with
        support, asset management, and application setup. Even when the interface is visible, signatures or device-class names
        poorly distinguish maintenance from hostile target selection. Joining caller, approved work, and actual returned facts
        improves judgment. Malware reverse engineering and official interface contracts support this legitimate-malicious
        overlap without measuring missed detection, so the mechanism is medium-confidence.
  evidence_refs:
  - REF-000583
  - REF-001272
  - REF-001273
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 将持续枚举改为变更触发反馈以降低安静阶段的查询密度
    en: Replace continuous enumeration with change-triggered feedback to lower query density during quiet periods
  analysis:
    paragraphs:
    - zh: 通知驱动设计把发现触发条件从重复定时查询转为外部设备状态变化。没有变化时不必重复形成清单请求，关联点则分散在先前接收关系和稍后的变更处理之间；只统计短时枚举次数的分析难以恢复持续监视。Trellix 直接对比了监听和轮询的
        I/O 噪声，官方合同证明反馈可实施；没有同配置检测实验，且变更后的查询可集中暴露，因此仅形成中等置信度的条件性结论。
      en: Notification-driven design changes the discovery trigger from repeated timed requests to external device-state changes.
        Quiet periods need no repeated inventory requests, while correlation points span an earlier receiving relationship
        and later change handling. Short-window enumeration counts can therefore fail to reconstruct ongoing monitoring. Trellix
        directly contrasts listening and polling I/O noise, and official contracts establish implementability. There is no
        matched detection experiment, and post-change queries may be conspicuous, so this remains a conditional medium-confidence
        conclusion.
  evidence_refs:
  - REF-001282
  - REF-001274
  - REF-001275
  - REF-001277
  confidence: medium
subtechnique_taxonomy:
  coverage: established
  narrative:
    paragraphs:
    - zh: 本技术按发现反馈的触发关系建立通知驱动外围设备发现：有意用设备变更反馈代替持续快照，使安静阶段不形成重复盘点请求，防守需要关联接收上下文与后续处理。该变量不以工具、操作系统、总线或设备类别划分；初始快照可以与订阅并存，也不改变主要增量反馈的边界。
      en: 'The taxonomy distinguishes Notification-Driven Peripheral Discovery by its feedback trigger: deliberate use of
        device-change feedback instead of continuous snapshots removes repeated inventory requests during quiet periods and
        requires defenders to join the receiving context with later handling. The variable is independent of tools, operating
        systems, buses, and device classes. A startup snapshot may coexist with subscription without changing the principal
        incremental-feedback boundary.'
    - zh: 窄设备类查询、历史记录读取和进程内 API 都可能改变观测位置，但本次没有把它们各自提升为子项。选择设备类只说明目标，历史记录存在新鲜度限制，进程内接口并非自动的匿迹选择；后续需要独立的可控差异和防御价值。通知驱动也不能涵盖采集内容、传播或在场状态伪造。
      en: Narrow-class queries, historical-record reads, and in-process APIs can affect observation locations, but are not
        separately promoted here. Device-class selection alone describes a target, historical records have freshness limits,
        and an in-process interface is not automatically an evasion choice. Further promotion requires independent controlled
        differences and defense value. Notification-driven discovery does not encompass content collection, propagation, or
        falsification of presence state.
  subtechnique_refs:
  - NJS-0238-001
