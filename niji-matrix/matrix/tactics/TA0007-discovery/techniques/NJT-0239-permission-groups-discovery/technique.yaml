schema_version: 2.0.0
type: technique
id: NJT-0239
name:
  zh: 权限组发现
  en: Permission Groups Discovery
summary:
  zh: 取得组、成员与权限配置关系以理解已访问环境的授权结构，并通过正常读取接口或替代信息路径改变调查的可区分性与观察位置。
  en: Obtain groups, memberships, and permission-configuration relationships to understand authorization structure in an accessed
    environment while changing survey distinguishability and observation location through ordinary read interfaces or substitute
    information paths.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1069
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1069
definition_and_concept:
  paragraphs:
  - zh: 权限组发现是攻击者在已访问的主机、目录、云租户或资源空间中，取得组对象、主体与组的成员关系，以及组或角色关联权限配置的环境测绘行为。直接产物可以是一个高价值组的成员、某身份所属的组、嵌套关系或权限配置线索，帮助选择需要进一步核实的身份和访问路径；查询尝试与确已返回关系事实应分别记录。
    en: Permission Groups Discovery is the acquisition of group objects, principal-to-group membership relationships, and
      permission configuration associated with groups or roles in an accessed host, directory, cloud tenant, or resource space.
      Its direct product can be the members of a valuable group, one principal's memberships, nested relationships, or permission-configuration
      clues that guide further identity and access-path investigation. A query attempt and confirmed returned relationships
      must be recorded separately.
  - zh: 本技术由所回答的关系问题定义，而不是由本地、域或云等部署位置、组名或命令定义。直接成员、递归展开、令牌中已有的组 SID、策略规定的成员和已应用状态是不同视图。可见一个成员边或角色分配，不等于已证明某个动作能够通过当前资源的完整授权判断；资源策略、拒绝条件、令牌状态和作用域还可能改变实际结果。
    en: The defining feature is the relationship question being answered, rather than local, domain, or cloud placement, a
      group name, or a command. Direct membership, recursive expansion, group SIDs already in a token, membership prescribed
      by policy, and applied state are different views. Seeing a membership edge or role assignment does not prove that an
      action passes a resource's complete current authorization decision; resource policy, denials, token state, and scope
      can change the actual outcome.
stealth_characteristics:
  paragraphs:
  - zh: 权限组发现可以借用管理员、应用和普通用户本来使用的组读取能力。恶意操作者执行正常组命令或用合法授权的 API 读取关系时，签名工具、成功认证和读取成功都不足以区分其调查目的。ESET 记录的 ComRAT 组命令支持这种接口重叠，但不能单凭命令存在断言所有成员已返回或特定审计被规避。
    en: Permission Groups Discovery can reuse group-reading capabilities already used by administrators, applications, and
      ordinary users. When an adversarial operator runs normal group commands or reads relationships through a legitimately
      authorized API, a signed utility, successful authentication, and a successful read cannot distinguish the survey's purpose.
      ComRAT group commands reported by ESET support this interface overlap without establishing that every member was returned
      or that a particular audit was evaded.
  - zh: 信息路径还决定痕迹出现在哪里。逐目标查询本地组可留下目标侧枚举事件，而从中央策略推导组配置关系会将关键读取转移到目录和策略文件所在服务器；只看目标主机的监测因此可能缺少本次调查。替代路径仍有文件、目录、登录和采集进程痕迹，且推导牺牲了本地变更、策略筛选与生效时效的准确性，并非无痕或等价快照。
    en: Information paths also determine trace location. Querying local groups on individual targets can leave target-side
      enumeration events, whereas deriving configured group relationships from central policy shifts the important reads to
      directory and policy-file servers. Monitoring only target hosts can therefore miss the present survey. The substitute
      path still leaves file, directory, logon, and collector-process traces and sacrifices accuracy concerning local changes,
      policy filtering, and application freshness; it is neither traceless nor an equivalent snapshot.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入以取得组对象、组成员、嵌套边、角色分配及其权限配置为直接目标的命令、API、目录或可读配置调查。NJT-0131 账户发现取得身份标识清单，本项取得身份之间或身份与权限结构之间的关系；NJT-0181 信任拓扑发现负责域、林或租户权威之间的信任边。为了回答组成员问题而解释组策略映射属于本项的替代路径，一般策略对象、设置和应用结果调查仍由
      NJT-0231 组策略发现负责，同一操作若确有多个独立信息产物可分别标记。
    en: Include command, API, directory, or readable-configuration surveys whose immediate objective is group objects, memberships,
      nested edges, role assignments, or their permission configuration. NJT-0131 Account Discovery obtains identity lists;
      this technique obtains relationships among identities or between identities and permission structure. NJT-0181 Trust-Topology
      Discovery owns trust edges between domain, forest, or tenant authorities. Interpreting policy mappings to answer a membership
      question is this technique's substitute path; general policy-object, setting, and applied-result surveys remain NJT-0231
      Group Policy Discovery. An operation with several independently established information products can receive separate
      classifications.
  - zh: 添加或删除成员、修改角色或 ACL、取得凭据、变更令牌，以及实际使用关系实施访问是不同直接行为，不能由读取自动推断。只有当前用户名称而无组关系时由系统用户发现负责。LDAP tokenGroups 是需要目录请求的计算属性，并非本地访问令牌缓存；成员关系缺失也可能来自主组表示、分页、读取权、隐藏成员或视图时效。支持排障、权限审查和应用组同步会产生正常同形读取，判断必须依靠主体职责、批准范围及独立攻击上下文。
    en: Adding or removing members, changing roles or ACLs, obtaining credentials, altering tokens, and actually using a relationship
      for access are different direct behaviors and cannot be inferred from a read. A current username without group relationships
      belongs to System Owner/User Discovery. LDAP tokenGroups is a computed attribute requiring a directory request, rather
      than a local access-token cache. Missing membership can reflect primary-group representation, paging, read rights, hidden
      members, or view freshness. Support troubleshooting, access review, and application group synchronization produce legitimate
      equivalent reads; classification requires actor duties, approved scope, and independent attack context.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 获得本地执行、域身份或云会话后，操作者可能先调查管理员、备份运维或特定资源关联组，选择后续凭据目标并核查可能的访问路径。ESET 的 ComRAT 调查列出本地和域组命令，提供父行为的实际活动证据；总体受害机构不能直接绑定到每条命令。报告未给逐命令完整返回，也未给组关系直接导致后继成功访问的逐步记录。
      en: After obtaining local execution, a domain identity, or a cloud session, an operator can survey administrative, backup-operation,
        or resource-related groups to select credential targets and investigate potential access paths. ESET lists local and
        domain group commands in its ComRAT investigation, providing evidence of the parent behavior in actual activity; aggregate
        victim institutions cannot be assigned to each command. The report lacks per-command complete outputs or a stepwise
        demonstration that a relationship caused successful later access.
    - zh: 若目标主机直接查询受限或容易形成逐机调查痕迹，且中央策略确实管理本地组，操作者可接受不完整关系而改从策略映射推导候选目标。云环境则常通过组成员或角色配置读取回答同类关系问题，但不同 API 的权限、分页和审计条件分别约束可得信息，不能把跨产品的同一名称视作相同权限语义。
      en: When direct target-host queries are constrained or would create a host-by-host survey footprint and central policy
        manages local groups, an operator can accept incomplete relationships and derive candidate targets from policy mappings.
        Cloud environments commonly answer analogous relationship questions through membership or role-configuration reads,
        but each API's permissions, paging, and auditing constrain the available information. Identical names across products
        do not establish identical authorization semantics.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者已具有可执行查询的进程、用户或云应用上下文，能够触达所用身份服务或读取已有本地视图。远程 SAM、LDAP、Graph 与 AWS IAM 均受各自认证、访问控制、网络和版本限制；本地组读取也不保证能远程读取任意主机。攻击者可选择对象、关系展开范围和读取路径，但不假定能更改审计、伪造目录结果或读取所有隐藏成员。
        en: The adversary already has a process, user, or cloud-application context capable of querying an identity service
          or reading an existing local view. Remote SAM, LDAP, Graph, and AWS IAM are subject to their own authentication,
          access control, network, and version limits; a local group read does not guarantee remote access to every host.
          The adversary can choose objects, relationship expansion, and reading path without assumed ability to change auditing,
          forge directory results, or read every hidden member.
      - zh: 策略替代要求能够读取相关目录对象与策略文件，并理解其组标识和应用线索，代价是接受配置关系与现场成员可能不一致。现有令牌仅描述其安全上下文的一部分组状态，不能自动提供整个环境的组图；更换令牌或提升权限不属于本技术所假设的读取能力。
        en: Policy substitution requires readable directory objects and policy files plus understanding of their group identifiers
          and application clues, at the cost of possible disagreement between configuration and actual membership. An existing
          token describes group state for its own security context rather than automatically providing an environment-wide
          group graph. Replacing a token or elevating privileges is outside the reading capability assumed here.
    defender_model:
      paragraphs:
      - zh: Windows 防守方可在启用适用审核策略后观察 4798 的按用户本地组枚举和 4799 的按本地组成员枚举，并以同机调用进程和登录标识关联；这些事件不覆盖任意 LDAP 或云查询。域目录属性访问可依赖匹配 SACL
          的 4662，提供对象、主体和所用权限而不保证完整谓词或返回成员；4728、4732、4756 等成员添加事件是变更证据，不能充当全量读取审计。
        en: Windows defenders can observe per-user local-group enumeration in 4798 and per-local-group member enumeration
          in 4799 after enabling the applicable audit policies, with same-host caller-process and logon identifiers for correlation.
          Those events do not cover arbitrary LDAP or cloud queries. Domain property access can use SACL-matched 4662 records
          that expose object, principal, and exercised rights without guaranteeing the full predicate or returned membership.
          Member-addition events such as 4728, 4732, and 4756 describe changes and do not constitute complete read auditing.
      - zh: 已配置的 Graph activity 或 CloudTrail 可记录请求主体、应用或会话、目标接口和结果状态，无法据此重建所有返回关系。有效调查还需主体职责与批准作业、目录对象及属性 GUID 映射、策略文件和对应
          GPO 的历史清单；用于关联的登录标识只在所属主机和会话生存期内有意义。读取审计未启用、日志保留不足、客户端缺少进程遥测及代理来源都会降低关系调查的可归属程度。
        en: Configured Graph activity or CloudTrail can record requester identity, application or session, target interface,
          and response status without reconstructing every returned relationship. Investigation also needs actor duties and
          approved jobs, directory-object and attribute-GUID mappings, and historical inventories linking policy files to
          GPOs. Logon identifiers are meaningful only within their host and session lifetime. Missing read auditing, inadequate
          retention, absent client process telemetry, and proxied origins reduce attribution of relationship surveying.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用正常组与权限读取接口使关系调查难与合法运维区分
    en: Reuse ordinary group and permission read interfaces so relationship surveying resembles authorized administration
  analysis:
    paragraphs:
    - zh: 恶意操作者调用与正常用户和治理工具相同的组读取接口，生成标准命令、身份与请求特征。官方文档证明接口的正常用途，ComRAT 资料证明攻击者使用相同组调查命令；二者共同支持单事件缺少目的区分力的推断。匿迹收益来自借用正常外观，残余调用进程、关系对象、来源与任务语境仍可使防守方恢复识别，不能把“可读”解释为“已被允许从事攻击”。
      en: An adversarial operator calls group-reading interfaces shared with normal users and governance tools, producing
        standard command, identity, and request features. Official documentation establishes legitimate interface purposes
        and ComRAT reporting establishes adversarial use of the same group survey commands; together they support an inference
        that a single event poorly distinguishes intent. The stealth benefit comes from borrowing normal appearance. Residual
        caller, relationship object, origin, and work context still permit discrimination, and readability does not mean authorization
        to conduct an attack.
  evidence_refs:
  - REF-001049
  - REF-001284
  - REF-001289
  - REF-001292
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 用中央策略关系推导替代逐主机组查询使仅目标主机观察缺少调查痕迹
    en: Substitute central policy mappings for per-host group queries so target-host-only observation lacks the survey traces
  analysis:
    paragraphs:
    - zh: 作者记录的替代模式为取得本地管理关系而读取中央策略，省去该采集步骤对每台成员主机的直接查询。于是防守方若只在成员主机寻找本地组枚举，便不能看到这一关系推导过程，必须把观察扩展到中央目录、SYSVOL 与采集端。该可解释的观察面偏移支持中等置信的行为透明；它不表示域控制器上的访问消失，也不把同一工具的其他采集模式视为同样安静。
      en: The author-documented substitute mode reads central policy to obtain local-administration relationships and omits
        direct queries to individual member hosts for that collection step. A defender looking only for local-group enumeration
        on member hosts cannot see this relationship inference and must extend observation to the central directory, SYSVOL,
        and collector. This explainable observation-plane shift supports medium-confidence Behavioral Transparency. It does
        not remove domain-controller access or make the tool's other collection modes equally quiet.
  evidence_refs:
  - REF-001283
  - REF-001213
  - REF-001286
  - REF-001295
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立“策略关系推导替代”一项原生子技术，以关系调查的信息取得路径为变量：攻击者有意读取中央声明的组映射并推导目标关系，替代对每个目标现场组状态的直接枚举。该边界要求明确替代关系及相应主机侧与中央侧痕迹差异，不因读取了某种文件或使用某种产品便自动成立。
      en: This technique establishes one native child, Policy-Relationship Inference Substitution, defined by the information-acquisition
        path for relationship surveying. The adversary deliberately reads centrally declared group mappings and infers target
        relationships instead of directly enumerating each target's current group state. The boundary requires explicit substitution
        and the resulting target-host versus central-server trace difference; reading a particular file or using a particular
        product is insufficient.
    - zh: 本地、域、云、管理员组、直接或递归成员及工具名称均不作为兄弟分类。令牌已有成员读取、属性或查询范围缩小，以及分时调用已分别核查；它们可能影响视图或负载，但现有材料不足以证明另一项独立、有意且可防御区分的匿迹实现。保留这些研究限制，避免将身份名单副本复用直接换名为组关系子项。
      en: Local, domain, cloud, administrator-group labels, direct or recursive membership, and tool names are not sibling
        classes. Reads of membership already in a token, narrower properties or query scope, and temporally spaced calls were
        reviewed separately. They can affect views or load, but current material does not establish another independent, intentional
        stealth implementation with a useful defensive distinction. Retaining these research limits avoids simply renaming
        identity-list-copy reuse as a relationship child.
  coverage: established
  subtechnique_refs:
  - NJS-0239-001
