research:
  limitations:
    paragraphs:
    - zh: ComRAT 的组命令是实际恶意父行为证据，未公开完整输出、每次查询权限或对具体后继访问的因果链。策略替代有作者明确的匿迹能力说明及接口路径对照，但没有本轮可验证的恶意现场采用案例和测量结果；因此该子项及观察面推论保持中等置信，不能借用
        ComRAT 的归因或总体规避动机提高其等级。
      en: ComRAT group commands are evidence of actual malicious parent behavior without published complete outputs, per-query
        rights, or a causal chain to particular subsequent access. Policy substitution has an explicit author-described stealth
        capability and interface-path comparison, but this review has no verified malicious field-use case or measurements.
        The child and observation-plane inference therefore remain medium-confidence and must not inherit ComRAT attribution
        or general evasion intent to increase their strength.
    - zh: 组配置、嵌套结果、动态成员、令牌组状态与资源授权有不同时间和执行边界；任何单一视图都可能遗漏关系或错误暗示已生效。检测窗口和基线是工程建议，尚未在实际 Windows 域、Graph 租户或 AWS 账户验证。审计文档只说明配置后可得的事件语义，不能证明部署已收齐全部读取，缺少事件也不能证明已发生路径替代。
      en: Group configuration, nested results, dynamic membership, token group state, and resource authorization have different
        temporal and execution boundaries; a single view can omit relationships or wrongly suggest applied state. Analytic
        windows and baselines are engineering proposals not validated in a live Windows domain, Graph tenant, or AWS account.
        Audit documentation describes event semantics when configured rather than complete deployed read coverage, and missing
        events do not establish path substitution.
