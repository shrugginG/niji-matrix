research:
  limitations:
    paragraphs:
    - zh: 本项的成立性是可复核的能力与设计意图结论，尚无本次所选现场案例直接确认其恶意采用，也没有对创建事件检测与客户端查询检测的定量比较。工具作者将演示放入独立COFFLoader，只有已核验的Aggressor入口支持驻留集成；不能把演示截图当成内联恶意活动。
      en: Existence is a reproducible capability and design-intent conclusion. The selected incidents do not directly confirm
        malicious adoption, and no quantitative comparison between creation-event and client-query detection is available.
        The author’s demonstrations use standalone COFFLoader; resident integration is supported by the verified Aggressor
        entry. Demonstration screenshots are not inline malicious activity.
    - zh: 当前专用分析验证对象是WMI实现，不能自动覆盖所有进程内API、直接系统调用或其他操作系统。内联工作与合法代理任务相似，仍需原始客户端、职责、批准任务及实际结果语义；确认完整进程集尤其受快照时点、权限与生命周期竞态限制。
      en: The dedicated analytic addresses the WMI implementation rather than every in-process API, direct syscall, or operating
        system. Inline work resembles legitimate agent tasks and still requires original-client identity, duties, approved
        work, and actual result semantics. Establishing a complete process set is particularly limited by snapshot time, permissions,
        and lifecycle races.
