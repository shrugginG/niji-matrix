schema_version: 2.0.0
type: technique
id: NJT-0240
name:
  zh: 进程发现
  en: Process Discovery
summary:
  zh: 调查当前运行的进程及其可得身份和状态，理解主机运行角色并为后继行动选择目标，同时可能借用管理工具或驻留上下文降低查询的独立可辨识度。
  en: Survey running processes and available identity and state to understand host roles and select follow-on targets, potentially
    borrowing administrative tools or resident contexts to reduce the inquiry’s separate visibility.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1057
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1057
definition_and_concept:
  paragraphs:
  - zh: 进程发现是攻击者取得主机或管理接口访问后，查询当前运行实例的存在性、名称、PID、父关系、映像位置、所属主体或其他可得运行状态的环境测绘行为。直接目标是理解此时实际活动的软件与进程关系，选择进一步调查、访问或操作的对象；某个程序已经安装并不说明它正在运行，读取进程名也不证明已经取得该进程的内存、令牌或秘密。
    en: Process Discovery is environmental mapping in which an adversary with host or management-interface access queries
      the existence, name, PID, parent relationship, image location, ownership, or other available state of running instances.
      Its immediate goal is to understand active software and process relationships and select objects for further investigation,
      access, or action. Installation does not establish execution, and a process name does not establish acquisition of memory,
      tokens, or secrets.
  - zh: 同一行为可通过命令、脚本、WMI、系统API、procfs或设备管理命令实现，分类依据始终是运行进程事实。证据应区分提出查询、获得快照或枚举器、遍历返回条目与消费具体属性；即使查询在同一进程中执行，也必须证明它确实针对进程信息，而不能只从模块已执行或API已解析推断发现已经完成。
    en: Commands, scripts, WMI, system APIs, procfs, and device-management commands can implement the behavior, but running-process
      facts remain the classification anchor. Evidence must separate a request, a snapshot or enumerator, returned entries,
      and consumed properties. Even an inquiry performed inside one process must demonstrably concern process information;
      module execution or API resolution alone does not establish completed discovery.
stealth_characteristics:
  paragraphs:
  - zh: 进程发现大量借用诊断、资产管理和故障处理所需的只读接口。tasklist和Get-Process的正常外观可以使恶意调查与值班排障相似；合法签名、系统路径和一次成功启动不能说明操作者的调查目的。残留的查询参数、父进程、登录上下文、远程来源及异常目标选择，仍可把这种相似外观放回实际工作语境。
    en: Process Discovery often borrows read interfaces needed for diagnostics, inventory, and troubleshooting. The ordinary
      appearance of tasklist and Get-Process can make adversarial surveying resemble support work. A legitimate signature,
      system path, or successful launch does not explain the operator’s purpose. Query arguments, parent processes, logon
      context, remote origin, and unusual targeting remain available to place that appearance in a work context.
  - zh: 攻击者还可以把一次进程查询交给已驻留的受控执行体，省去为该任务另起工具或牺牲进程的明确边界，使只数进程创建的观察面缺少本次调查的独立入口。这种变化不等于进程或查询不可见：WMI的客户端请求、provider活动、枚举结果、宿主资源和代码来源仍可能留下证据。其收益取决于防守方是否把这些观察与正确的进程实例关联，而不是取决于系统是否默认记录某个接口。
    en: An adversary can also assign an inquiry to an already resident controlled execution context, removing the separate
      utility or sacrificial-process boundary that a process-creation-only observer would associate with the task. This does
      not make the process or inquiry invisible. WMI client requests, provider activity, enumeration results, host resource
      use, and code origin can still leave evidence. The benefit depends on whether defenders join those observations to the
      right process instance, rather than on whether an interface is logged by default.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入直接询问或读取运行进程存在性与属性的行为，包括本机或获授权远程视图中的进程清单、特定进程定位以及对返回实例的详情查询。解释结果时保留目标主机、会话或命名空间、查询时间、字段权限与结果完整性；快照反映采集时刻而不是永久状态，PID和同名映像都不能独立充当跨生命周期身份。
    en: Include direct inquiries or reads about process existence and properties, including local or authorized remote inventories,
      locating a particular process, and detail queries on returned instances. Preserve host, session or namespace, query
      time, field permissions, and result completeness. A snapshot represents its acquisition time rather than permanent state,
      and neither a PID nor a repeated image name independently identifies an instance across lifetimes.
  - zh: 仅查安装软件、窗口标题或焦点、驱动包及加载驱动分别归相邻发现技术；进程清单可能提供它们的线索，但不能取代相应事实。打开句柄或具备QUERY、VM_READ、TERMINATE权限不证明读取详情、提取凭据、注入或终止已经发生。根据进程名判断分析环境并停用载荷、破坏安全进程或执行凭据转储，需要分别证明环境条件化规避、安全削弱、影响或凭据访问动作。
    en: Installed-software queries, window titles or focus, driver packages, and loaded drivers belong to neighboring discovery
      techniques. A process list can provide leads without establishing those facts. Opening a handle or holding QUERY, VM_READ,
      or TERMINATE rights does not establish detailed reads, credential extraction, injection, or termination. Process-based
      analysis-environment decisions, security-process impairment, and credential dumping each require evidence of the respective
      conditioned-evasion, defense-impairment, impact, or credential-access action.
  - zh: 驻留查询的子项只描述本次进程调查的任务承载选择，不承接建立驻留体、反射加载、跨进程嵌入或非标准API过渡本身的结论。合法监控、EDR、桌面管理、任务管理器和应用健康检查可以进行同形查询；过滤返回行、减少显示列或选用熟悉工具也不能单独证明匿迹设计。
    en: The resident-query child concerns how the particular process-survey task is carried, not establishment of the resident
      agent, reflective loading, cross-process embedding, or nonstandard API transitions themselves. Legitimate monitoring,
      EDR, desktop management, task managers, and application health checks make similar inquiries. Filtering returned rows,
      displaying fewer columns, or selecting a familiar tool does not independently establish an evasion design.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在初始立足后，操作者可调查服务器运行角色和交互式应用，寻找值得深入分析的服务、用户活动或后继目标。Microsoft记录Volt Typhoon调查运行进程，WithSecure在No Pineapple调查中记录tasklist与Get-Process
        Lsass；这些记录支持恶意进程调查，不公开证明每次输出值、最终目标选择或查询导致的逃逸。
      en: After gaining a foothold, operators can survey server roles and interactive applications to identify services, user
        activity, or follow-on targets worth investigating. Microsoft reports running-process discovery by Volt Typhoon, while
        WithSecure records tasklist and Get-Process Lsass in No Pineapple. These observations establish adversarial process
        surveying without public proof of each returned value, final target selection, or query-induced evasion.
    - zh: 自动化植入体可在一次操作前取得进程事实，也可在运行期间刷新视图以判断组件是否存在。持续监视与一次快照在时间意义上不同，但高频维护不自然等于匿迹；当前证据只支持把有明确承载对照的驻留内联调查正式化，不能把所有轮询、通知或条件触发都转成子项。
      en: Automated agents may obtain process facts before an action or refresh their view to check component presence during
        operation. Continuous monitoring and a single snapshot have different temporal meanings, but frequent maintenance
        is not inherently evasive. Present evidence supports formalizing resident inline surveying with an explicit carrier
        comparison, not turning all polling, notifications, or conditional triggers into children.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够执行查询代码、命令或管理请求，并观察可用返回。普通用户通常可得到部分进程存在性，详细路径、模块、所属主体或其他用户进程的信息受接口、完整性、权限和平台配置约束；查询失败、缺字段与空结果不能被假定为系统不存在该进程。远程调查另需可达接口及相应身份。
        en: The adversary needs the ability to execute inquiry code, commands, or management requests and inspect available
          returns. An ordinary user may obtain some existence information, while detailed paths, modules, ownership, or other
          users’ processes depend on interface, integrity, permissions, and configuration. Failure, missing fields, and empty
          results do not establish process absence. Remote surveying additionally requires a reachable interface and suitable
          identity.
      - zh: 实施驻留内联调查还需要控制既有进程中的任务调度或扩展执行能力，并承担查询阻塞、崩溃和权限继承的限制。它不赋予新的读取授权，也不要求已攻陷WMI provider；攻击者只可消费该上下文与目标接口实际允许的视图。
        en: Resident inline surveying additionally requires task dispatch or extension execution within an existing process
          and carries blocking, crash, and inherited-permission constraints. It grants no new read authority and does not
          require compromise of the WMI provider. The adversary can consume only the view allowed to that context by the target
          interface.
    defender_model:
      paragraphs:
      - zh: 防守方可持有含命令行的进程创建记录、Windows PowerShell 5.1脚本块内容和经配置的WMI Trace。前两者揭示工具或脚本语义，WMI Trace可揭示原始客户端、命名空间和查询文本；它们不自动提供结果行。Sysmon进程访问事件只描述打开其他进程，不覆盖全部进程枚举接口，不能当作进程清单输出。
        en: Defenders may hold process-creation records with command lines, Windows PowerShell 5.1 script-block content, and
          configured WMI Trace. The first two expose utility or script semantics, while WMI Trace can expose the original
          client, namespace, and query text. They do not automatically provide result rows. Sysmon process-access events describe
          opening another process rather than every enumeration interface and cannot stand in for process-list output.
      - zh: 观察必须保留客户端所在主机、事件时间与进程生命周期；PID重用、provider复用、远端客户端及缺失创建记录会削弱归属。若没有验证过的结果采集，防守方只能说明提出了什么调查，不能说明攻击者已取得全部进程。Linux、macOS、ESXi和网络设备的接口仍在父范围内，本次可实施检测主要落实于Windows，不能宣称同等遥测覆盖。
        en: Observation must retain client host, event time, and process lifetime. PID reuse, provider reuse, remote clients,
          and missing creation records weaken attribution. Without validated result capture, defenders can state what was
          requested rather than that the adversary acquired every process. Linux, macOS, ESXi, and network-device interfaces
          remain in parent scope, but implementable analytics in this delivery primarily cover Windows and do not establish
          equivalent telemetry elsewhere.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用正常进程盘点工具和管理查询外观，使恶意调查与诊断工作相似
    en: Borrow ordinary process-inventory tools and management-query appearance to resemble diagnostics
  analysis:
    paragraphs:
    - zh: 攻击者选择与合法排障重叠的系统工具和只读查询路径，使局部可见特征仍是常见管理程序与进程信息请求。Microsoft对就地取材活动的调查以及WithSecure记录的进程命令支持这种行为外观；从外观到辨识困难的因果判断保持中等置信度，因为缺少针对进程查询的告警对照。其作用是增加目的判断所需语境，不消除参数、身份或结果工件。
      en: Selecting system utilities and read-query paths shared with legitimate troubleshooting leaves local features resembling
        familiar management programs and process-information requests. Microsoft’s living-off-the-land investigation and WithSecure’s
        process commands support this appearance. The causal conclusion about distinguishing intent remains medium-confidence
        because process-query alert comparisons are unavailable. The effect is to require more context about purpose, without
        removing arguments, identity, or result artifacts.
  evidence_refs:
  - REF-000073
  - REF-001230
  - REF-001296
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 将进程调查留在既有驻留执行上下文，避开按每任务新进程识别查询的观察假设
    en: Keep the inquiry in an existing resident context to bypass per-task process-creation identification
  analysis:
    paragraphs:
    - zh: 官方BOF设计明确把每任务fork&run的创建与注入足迹作为对照，TrustedSec的固定集成入口又把具体进程查询送入beacon_inline_execute；因而这里的变化是调查任务不再拥有单独工具进程的创建边界。仅依靠新tasklist或PowerShell启动识别调查的逻辑会缺少这一输入，需改从客户端查询与宿主实例恢复行为。WMI服务、provider、代码及实际对象返回仍是可见面，这一能力链不证明现场漏检或所有驻留API均匿迹。
      en: The official BOF design explicitly contrasts per-task fork-and-run creation and injection footprints, and TrustedSec’s
        pinned integration sends a concrete process inquiry through beacon_inline_execute. The changed trace is the absence
        of a separate utility-process creation boundary for that task. Logic identifying inquiries solely through new tasklist
        or PowerShell launches loses that input and must recover activity from client queries and the host instance. WMI services,
        providers, code, and returned objects remain observation surfaces. This capability chain establishes neither field-level
        missed detection nor stealth for every resident API call.
  evidence_refs:
  - REF-001303
  - REF-001305
  - REF-001309
  - REF-000366
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前建立驻留上下文内联进程调查一项子技术，以本次查询是否借已有受控执行体完成、相对于另起每任务执行器的生命周期差分为变量。它必须包含实际进程查询语义和驻留承载的正面证据，不能从缺少进程创建日志、进程已运行很久或某个API名称自动成立；系统provider可能另有进程，不能据此否认客户端内联执行。
      en: The current taxonomy establishes Resident-Context Inline Process Survey using the lifecycle difference between carrying
        a particular inquiry in an existing controlled context and creating a per-task executor. It requires positive evidence
        of process-query semantics and resident carriage, not inference from missing creation logs, a long-running process,
        or an API name. A system provider may use another process without negating client-side inline execution.
    - zh: 按工具、操作系统、PID/路径/命令行字段、快照API或输出格式划分都没有独立匿迹边界。另行检查的通知式等待、低频刷新与选择性过滤尚缺本次行为的意图和观察对照；进程隐匿、运行态嵌入、安全削弱和沙箱判断则由相邻技术负责。能力证据允许本项保持中等置信度，实际恶意事件只支持父行为。
      en: Tool names, operating systems, PID/path/command-line fields, snapshot APIs, and output formats do not define independent
        evasion boundaries. Notification-based waiting, low-frequency refresh, and selective filtering lack intent and observation
        comparisons for this behavior in the reviewed evidence. Process hiding, runtime embedding, defense impairment, and
        sandbox decisions belong to neighboring techniques. Capability evidence supports medium confidence for this child,
        while the malicious incidents support only the parent behavior.
