research:
  limitations:
    paragraphs:
    - zh: 此次没有取得同时公开具体 Registry 任务、同一驻留进程原语和完整进程事件对照的恶意现场案例，所以子项不引用父级的 Volt Typhoon 案例。官方能力合同足以证明可选择的稳定变量与相应痕迹差，不能证明现场使用比例或对某款传感器的绕过效果。合法插件也能产生同进程读取，部署时必须保留目的、对象和代码来源的判断。
      en: This research found no malicious field case publishing a specific Registry task, its primitive in the same resident
        process, and a complete process-event comparison. The child therefore does not inherit the parent's Volt Typhoon case.
        The official capability contract establishes a selectable stable variable and corresponding trace difference rather
        than field prevalence or bypass of a particular sensor. Legitimate plugins can also read within one process, requiring
        evaluation of purpose, object, and code provenance.
