research:
  limitations:
    paragraphs:
    - zh: 现场报告公开了工具使用和调查背景，未公开逐查询路径、返回值或检测对照；InvisiMole 命令表只证明逆向确认的能力。进程内子项依赖明确的开发者合同和 Registry 查询能力，保持中等置信度，不等同于现场采用率或实测匿迹效果。判断个案时仍须证明该读取用于环境知识，并排除读取自身载荷配置、合法初始化和相邻的信息对象。
      en: Field reporting provides utility use and investigative context without per-query paths, returned values, or detection
        comparisons. InvisiMole's command table establishes a reverse-engineered capability. The in-process child relies on
        an explicit developer contract and Registry-query capability, with medium confidence rather than an asserted field
        prevalence or measured evasion effect. A case still requires proof of environmental purpose and exclusion of payload-configuration
        consumption, legitimate initialization, and adjacent information objects.
    - zh: 查询视图、权限、虚拟化与副本时点会改变结果；4663 不保存返回内容，4656 不证明实际使用权限。本文的防御是可实施设计，尚未在本研究工作区对 Windows 版本、SACL 与专用跟踪进行实测。缺失事件只能形成覆盖不明，不能作为攻击未发生或已隐身的证明；任何上线阈值和保留窗口仍需本地验证。
      en: Query view, rights, virtualization, and snapshot time can change results. Event 4663 does not preserve returned
        content, and 4656 does not establish exercised rights. The defenses are implementable designs without Windows-version,
        SACL, or dedicated-tracing experiments in this research workspace. Missing events leave coverage uncertain rather
        than proving absence or successful concealment. Deployment thresholds and retention windows require local validation.
