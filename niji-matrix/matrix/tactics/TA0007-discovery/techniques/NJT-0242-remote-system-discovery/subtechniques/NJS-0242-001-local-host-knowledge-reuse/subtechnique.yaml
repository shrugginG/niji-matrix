research:
  limitations:
    paragraphs:
    - zh: Kinsing 资料是对特定脚本和受控运行的分析，其未发现额外主动扫描不能推广为所有变种均无扫描。HermeticWizard 的多个 API 中仅有已核实的表读取路径用于说明本地复用；DNSGetCacheDataTable
        缺少这里可依赖的稳定公开接口合同，其他枚举函数也可能联网，因此不据整个 API 清单作零网络结论。
      en: Kinsing reporting analyzes a particular script and controlled execution; absence of identified additional scanning
        does not establish scan-free behavior in every variant. Only verified table-retrieval paths in HermeticWizard's API
        set illustrate local reuse. DNSGetCacheDataTable lacks a stable public contract relied on here, and other enumeration
        functions can contact the network, so the full API list does not support a network-free conclusion.
    - zh: 官方文档支持读取与主动刷新在操作语义上的差异，未提供对目标检测系统的漏检实验。过期、无效和哈希记录限制候选可用性，本机高权限攻击者又可读取用户私有资料或削弱审计。未来需要带实际返回结果与前后网络捕获的实验，才能提高特定接口路径和量化匿迹效果的置信度。
      en: Official documentation establishes operational differences between reading and active refresh, not miss-rate experiments
        against a target detector. Stale, invalid, and hashed records limit candidate usefulness, while locally privileged
        adversaries can read private material or weaken auditing. Experiments retaining actual results and before-and-after
        network captures are needed to increase confidence in particular interface paths and quantified stealth effects.
