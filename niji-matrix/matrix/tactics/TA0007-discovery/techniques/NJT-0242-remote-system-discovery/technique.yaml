schema_version: 2.0.0
type: technique
id: NJT-0242
name:
  zh: 远程系统发现
  en: Remote System Discovery
summary:
  zh: 在已访问环境取得其他系统的标识或存在迹象，并可复用既存主机知识，减少为形成初始候选而新增的网络探测。
  en: Obtain identifiers or indications of other systems in an accessed environment, potentially reusing existing host knowledge
    to reduce new network probing for initial candidates.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1018
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1018
definition_and_concept:
  paragraphs:
  - zh: 远程系统发现是攻击者在已经获得访问的环境内，取得其他计算机、网络设备或系统的主机名、网络地址或其他逻辑标识，以形成后续调查与横向访问候选的行为。主动请求的应答、目录中登记的计算机对象，以及本机已经保存的远端主机记录，都可能提供这种知识。直接成果可以只是一个待核实名称或地址，而非已证明在线的目标。
    en: Remote System Discovery obtains hostnames, network addresses, or other logical identifiers of other computers, network
      devices, or systems within an environment already accessed, forming candidates for later investigation and lateral access.
      Active-request responses, registered directory computer objects, and locally stored remote-host records can all provide
      this knowledge. The immediate result may be an unverified name or address rather than a demonstrated live target.
  - zh: 本技术按所取得的系统事实界定，既不以运行某个命令为完成条件，也不以某种协议或文件格式为边界。同一操作可能同时返回本机配置、连接对端和远端候选；只有相应结果获得证据时，才能分别归入对应发现行为。将候选地址传给服务探测、认证或远程执行属于后续动作，不能反过来证明初始枚举取得完整、准确的系统清单。
    en: The technique is defined by the system facts acquired, not completion of a particular command or use of a protocol
      or file format. One operation can expose local configuration, connection peers, and remote candidates; corresponding
      evidence is needed before assigning each discovery behavior. Passing a candidate address into service probing, authentication,
      or remote execution is a later action and cannot retrospectively establish that initial enumeration produced a complete,
      accurate system inventory.
stealth_characteristics:
  paragraphs:
  - zh: 远程系统发现的可见性取决于攻击者从哪里取得初始主机知识。逐目标确认会增加网络请求，而读取现有本地记录可以先形成候选而不为这些候选新发存活或服务探测。只统计 ICMP 扫描、连接扇出或失败端口的防守逻辑因此可能漏掉候选形成阶段；记录中的系统未被验证，是这种痕迹减少所付出的信息质量代价。
    en: Visibility depends on where the adversary acquires initial host knowledge. Per-target confirmation adds network requests,
      whereas existing local records can yield candidates before fresh liveness or service probes are sent for them. Detection
      limited to ICMP scans, connection fan-out, or failed ports can therefore miss candidate formation. Unverified system
      records are the information-quality cost of that trace reduction.
  - zh: 本地读取仍可能留下进程、命令行、文件访问、脚本或已部署 API 传感器记录，后续名称解析与目标验证也会增加痕迹。缓存命中的 DNS 查询仍可产生 Sysmon Event 22；读取表与调用解析刷新接口也必须区分。大量主动扫描并不会因为使用系统命令就自动隐蔽，现有案例也未量化此路径的检测漏失率，匿迹效果只在明确的防守观察条件下成立。
    en: Local reads can still leave process, command-line, file-access, script, or deployed API-sensor records; later name
      resolution and target validation add traces. DNS queries answered from cache can still generate Sysmon Event 22, and
      table retrieval must be distinguished from resolution or refresh calls. Broad active scanning does not become inconspicuous
      merely by using system commands. The cases do not quantify detection miss rates, so stealth effects are conditional
      on the stated observation model.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入在已访问环境为取得其他系统标识而进行的目标确认、计算机目录查询，以及从已有本地映射、缓存或配置提取远端系统候选。目录对象证明登记事实；ARP 或邻居表记录保存的地址映射与状态；名称缓存和主机文件提供名称与记录数据。它们均不单独证明实时可达、服务开放、凭证有效或横移成功。管理员排障、资产盘点和日常客户端维护同样会读取这些材料，恶意解释需要访问来源、用途与后继行为支持。
    en: Include target confirmation, computer-directory queries, and extraction of remote-system candidates from existing
      local mappings, caches, or configuration within an accessed environment. A directory object establishes registration;
      ARP or neighbor tables contain recorded mappings and states; name caches and host files supply names and record data.
      None alone establishes current reachability, open services, valid credentials, or successful lateral movement. Administrators,
      inventory tools, and ordinary clients read the same materials, so a malicious interpretation requires access provenance,
      purpose, and subsequent behavior.
  - zh: 直接目标为远端服务端点或协议事实时归 NJT-0234，为共享名称和清单时归 NJT-0235，捕获既有报文时归 NJT-0236，枚举日志时归 NJT-0233。本机地址配置和本机连接状态分别保留 T1016、T1049 边界；云提供方资源与容器资源清单仍归
      NJT-0139、NJT-0179。读取已存记录不等于网络嗅探，取得内部访问前的外部探测也不属于本项。
    en: Remote service endpoints or protocol facts belong to NJT-0234, share names and inventories to NJT-0235, capture of
      existing packets to NJT-0236, and log enumeration to NJT-0233. Local address configuration and local connection state
      retain the T1016 and T1049 boundaries. Cloud-provider and container-resource inventories remain NJT-0139 and NJT-0179.
      Reading stored records is not packet sniffing, and pre-access external probing is outside this technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得终端、管理节点、容器或网络设备访问后，可能需要寻找下一台可调查系统，而尚不知道地址范围或不愿先做广泛探测。已有远端主机记录可以提供有限的初始候选；目录或管理视图则可能提供授权范围内的登记系统。结果可用于选择后续确认、服务调查或横向访问目标，但并不替代那些动作的独立证据。
      en: After accessing an endpoint, management node, container, or network device, an adversary may need another system
        to investigate without knowing the address range or first conducting broad probing. Existing remote-host records can
        provide limited initial candidates; directory or management views may expose registered systems within authorized
        scope. Results can guide later confirmation, service investigation, or lateral targeting but do not replace separate
        evidence for those actions.
    - zh: Kinsing 分析中的脚本从 SSH 配置、历史和已知主机资料取得候选后再尝试 SSH。HermeticWizard 则收集已知 IP 后连接验证，并可另外扩展探测范围。这些例子展示候选形成与目标接触可以分阶段发生；不能把整个活动描述成无网络，也不能从后续传播尝试推断每条旧记录都有效。
      en: In the Kinsing analysis, a script obtained candidates from SSH configuration, history, and known-host material before
        attempting SSH. HermeticWizard gathered known IP addresses before connection validation and could additionally expand
        probing scope. These examples separate candidate formation from target contact; they do not make the whole operation
        network-silent or establish that every stored record remained valid.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要在已访问环境读取有关其他系统的信息，或发起查询并接收响应。普通用户可读的本地资料不当然要求管理员权限，但其他用户的配置、受限目录、设备管理视图和专用接口可能另有权限要求。记录内容由先前通信、管理员配置和保存期限约束，不能仅凭一次本地命令假定企业范围的可见性。
        en: The adversary needs access to information about other systems or the ability to query and receive responses within
          the accessed environment. Ordinary user-readable material does not inherently require administration, while other
          users' configuration, restricted directories, device views, and special interfaces may. Contents depend on prior
          communication, administrative configuration, and retention; a local command does not imply enterprise-wide visibility.
      - zh: 复用既存知识要求攻击者识别哪些字段确实指向远端系统，并容忍过期、别名、空表和不可读资料。若再做解析、刷新或连接确认，其请求必须独立计算；操作系统后台维护也可能同时产生网络流量。攻击者无须控制这些后台事件，且不能据读取 API
          的存在假定其取到了非空结果。
        en: Reusing existing knowledge requires recognizing fields that actually identify remote systems and tolerating stale
          records, aliases, empty tables, and inaccessible material. Resolution, refresh, or connection confirmation must
          be accounted for separately; operating-system maintenance can also create concurrent traffic. The adversary need
          not control those background events, and an available read API does not establish a nonempty result.
    defender_model:
      paragraphs:
      - zh: 防守方可能具有进程与会话来源、目标连接和网络应答、目录查询、文件访问及资产台账。进程命令说明请求意图，网络应答支持特定时点的接触结果，目录或缓存内容支持所保存事实，三者不能互换。只保存跨段流量或扫描告警时，本地候选提取缺少对应网络事件，主机侧记录因而成为必要补充。
        en: Defenders may have process and session provenance, destination connections and responses, directory queries, file
          access, and asset records. Commands indicate requested behavior, responses support contemporaneous contact, and
          directory or cache contents establish stored facts; these are not interchangeable. Cross-segment traffic or scan
          alerts alone lack corresponding network events for local candidate extraction, making endpoint evidence a necessary
          complement.
      - zh: Sysmon 进程创建事件不包含 API 返回表，Event 3 默认关闭且仅覆盖其声明的 TCP/UDP 连接；Event 22 的缓存 DNS 事件也不是任意缓存枚举审计。文件读取审计需要实际规则与成功采集，仍通常不保存读取内容。没有命令输出、返回值或其他独立结果证据时，应报告发现尝试或资料访问，保留取得了哪些系统候选的未知状态。
        en: Sysmon process creation does not include API result tables; Event 3 is disabled by default and covers its documented
          TCP/UDP connections. Cached DNS events in Event 22 are not arbitrary cache-enumeration auditing. File-read auditing
          needs actual rules and successful collection and generally does not retain read contents. Without command output,
          return values, or independent result evidence, report a discovery attempt or material access and preserve uncertainty
          about acquired candidates.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 从本地既存主机知识形成候选使初始发现离开仅观察新增网络探测的检测面
    en: Form initial candidates from existing local host knowledge outside detection limited to fresh network probes
  analysis:
    paragraphs:
    - zh: 攻击者选择读取已经保存的主机标识，代替为取得初始候选先逐目标询问。GetIpNetTable 获取已有 IPv4 映射表，官方将其与发 ARP 的操作分开；Kinsing 的原始分析记录了本地资料提取且未发现用于识别额外目标的主动扫描。这使候选提取表现为本机资料访问，而不是扫描规则预期的目标扇出。效果来源于观察面的差异，并不表示端点无法记录读取、旧记录真实可靠或后续目标不被接触。文档支持痕迹差，事件研究支持恶意采用，对具体漏检效果仍为有条件推断。
      en: The adversary reads already stored host identifiers instead of first asking each target for initial candidates.
        GetIpNetTable retrieves an existing IPv4 mapping table, distinguished in official documentation from operations sending
        ARP. Original Kinsing reporting records local-material extraction without identified active scanning to discover additional
        targets. Candidate extraction therefore appears as local access rather than the target fan-out expected by scan rules.
        The effect is an observation-surface difference, not inability to record reads, reliability of old records, or absence
        of later target contact. Documentation supports the trace distinction and incident analysis supports adversarial use;
        detector impact remains a conditional inference.
  evidence_refs:
