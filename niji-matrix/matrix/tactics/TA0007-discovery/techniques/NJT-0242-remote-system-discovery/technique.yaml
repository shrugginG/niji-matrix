  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术以本地既存主机知识复用划分一项匿迹子技术。其稳定变量是在形成初始远端系统候选时，选择读取当前系统已经持有的记录，而不是先为这些候选新增目标确认。分类对应观察位置从目标交互转向本地读取的变化；地址映射、名称缓存和连接配置是可能载体，不分别构成子项。
      en: This technique defines Local Host-Knowledge Reuse as one evasion sub-technique. Its stable variable is reading records
        already held by the current system to form initial remote-system candidates instead of first adding target confirmation.
        The partition corresponds to observation moving from target interaction to local access; address mappings, name caches,
        and connection configuration are possible carriers rather than separate children.
    - zh: 主动确认、目录中的计算机查询与其他有证据支持的系统标识获取仍属于父技术范围。目标数量、查询工具和驻留载体本身不足以建立独立匿迹分类；时间或来源分散需要自己的行为控制与观察差异证据。后续验证可以与本地复用组合，不能由此把整个活动称为无网络，也不能将被动报文、服务公告、日志或资源清单所拥有的相邻对象合并进本分类。
      en: Active confirmation, directory computer queries, and other evidenced acquisition of system identifiers remain within
        the parent. Target counts, query tools, and resident carriers alone do not establish independent evasion classes;
        timing or source distribution needs its own control and observation evidence. Later validation can coexist with local
        reuse without making the entire operation network-silent or absorbing adjacent packet, service-advertisement, log,
        or resource-inventory objects.
