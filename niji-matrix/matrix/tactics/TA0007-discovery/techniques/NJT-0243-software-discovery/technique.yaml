schema_version: 2.0.0
type: technique
id: NJT-0243
name:
  zh: 软件发现
  en: Software Discovery
summary:
  zh: 调查已访问环境的软件存在性、版本与配置，并可借用资产盘点外观或在既有客户端内直接查询，降低调查目的与任务入口的可识别性。
  en: Survey software presence, versions, and configuration in an accessed environment, potentially borrowing inventory appearance
    or querying directly within an existing client to reduce recognition of the inquiry's purpose and task entry point.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1518
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1518
definition_and_concept:
  paragraphs:
  - zh: 软件发现是攻击者在取得主机或相应管理接口访问后，询问或读取已安装、已登记或可用软件及其版本、产品身份和可得配置的环境测绘行为。直接成果是关于软件部署的事实或待验证线索，供其选择后继调查、兼容实现或攻击路径；取得这些线索不赋予安装、卸载、停用或利用软件的能力。
    en: Software Discovery is environmental mapping in which an adversary with host or relevant management-interface access
      queries or reads installed, registered, or available software, including versions, product identities, and accessible
      configuration. Its direct result is a deployment fact or a lead requiring validation, used to select later inquiries,
      compatible implementations, or attack paths. Obtaining a lead grants no capability to install, uninstall, disable, or
      exploit software.
  - zh: Windows 的卸载登记、MSI 库存和安全产品提供方视图都是可能的取得路径，但各自报告不同覆盖范围。安装登记不等同于当前执行，版本字符串不证明组件完整或可利用，安全产品名称不证明实时保护正在生效。分类依据是实际调查的软件信息对象，而非某个命令、产品名称、文件扩展名或后继攻击目的。
    en: Windows uninstall registration, MSI inventory, and security-product provider views are possible acquisition paths
      with different coverage. Registration does not establish current execution, a version string does not establish component
      integrity or exploitability, and a security-product name does not establish effective real-time protection. Classification
      follows the software information actually surveyed rather than a command, product name, extension, or later attack objective.
stealth_characteristics:
  paragraphs:
  - zh: 软件发现使用补丁核查、兼容性评估和支持工作也需要的软件清单接口。恶意操作者借用相同工具、软件类和请求字段时，单个正常工具事件难以解释其未经授权的调查目的；工具签名与系统路径不能代替工作授权。参数中的实际信息范围、原始主体和对应任务仍可用于区分。
    en: Software Discovery uses inventory interfaces also needed for patch checks, compatibility assessment, and support.
      When adversarial operators borrow the same tools, software classes, and fields, one ordinary-utility event poorly expresses
      an unauthorized inquiry's purpose. Signatures and system paths do not replace work authorization. Actual information
      scope in arguments, the original principal, and the corresponding work remain distinguishing context.
  - zh: 软件清单还可直接由已经执行的客户端代码取得，使一次调查不另形成 wmic 或其他清单工具的启动事件。KGB RAT 的原始动态研究为这种承载方式提供具体软件查询证据：被省去的是独立查询任务入口，而非原始恶意进程本身。WMI 查询内容、客户端身份、提供方活动和结果处理仍可能被仪器化或经配置的
      Trace 观察；提供方可以位于另外的进程。
    en: Inventory can also be acquired directly by already executing client code, without a new launch event for wmic or another
      inventory utility for that inquiry. KGB RAT's original dynamic study supplies software-query evidence for this carriage.
      What is removed is a separate query-task entry point, not the original malicious process. WMI content, client identity,
      provider activity, and result handling remain observable through instrumentation or configured tracing, and a provider
      can reside in another process.
  - zh: 以上特性不意味着所有软件查询都低噪或无副作用。Win32_Product 即使带筛选也可能触发 MSI 产品枚举及一致性修复，卸载登记又可能遗漏其他用户、其他视图或便携程序。查询内容少、目标是安全产品或未见独立工具事件，都不能单独证明匿迹；需要正面客户端与请求证据，并按接口保留结果与副作用的限制。
    en: These properties do not make every inquiry quiet or side-effect-free. Win32_Product can enumerate MSI products and
      trigger consistency repair despite predicates, while uninstall registration can omit other users, views, or portable
      applications. Small requests, security-product targeting, and absence of a separate utility event do not independently
      establish evasion. Positive client/request evidence is needed, with interface-specific limits on results and side effects
      retained.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入直接获取软件部署、产品身份、版本和可得配置的清单或定向查询，包括软件资产登记、安全产品与备份产品的相关信息。判断返回值时保留系统、用户或租户范围、接口、时间、权限与结果完整性；历史登记和失败请求均不能升级为当前有效安装。健康接口的汇总状态也不能替代每个产品的工作状态。
    en: Include inventory and targeted inquiries that directly acquire deployment, product identity, version, or available
      configuration, including software registration and security- or backup-product information. Interpret returns with their
      system, user or tenant scope, interface, time, permissions, and completeness; historical registration and failed requests
      do not establish a current effective installation. Aggregate health from a health interface does not substitute for
      each product's operating state.
  - zh: 只查询运行实例归 NJT-0240 进程发现，驱动包或加载驱动归 NJT-0180，服务注册和服务状态归系统服务发现。只有把这些线索明确解析为软件产品事实时，才具有本技术的信息成果。单纯读取目录或 Registry 任意键不能自动证明软件清单；针对卸载登记的读取以软件信息对象为准，与
      NJT-0241 的通用 Registry 探索区分。
    en: Running-instance inquiries belong to NJT-0240 Process Discovery, driver packages or loaded drivers to NJT-0180, and
      service registration or state to System Service Discovery. They yield this technique's information only when explicitly
      resolved into software-product facts. An arbitrary directory or Registry read does not establish an inventory. Reads
      aimed at uninstall registration follow the software information object and remain distinct from NJT-0241's general Registry
      exploration.
  - zh: 根据软件线索认定分析环境并改变载荷行为归 NJT-0122，调试器专门判断归 NJT-0106，目标条件匹配或环境密钥派生归 NJT-0109。停止安全组件、修改排除项、删除备份或利用已发现版本均须另证相应后继动作。正常部署代理、取证、安全巡检和支持脚本是强反例，产品类别和常见工具本身不构成匿迹子技术。
    en: Software-based analysis-environment classification followed by changed payload behavior belongs to NJT-0122, dedicated
      debugger checks to NJT-0106, and target-condition matching or environmental key derivation to NJT-0109. Stopping security
      components, changing exclusions, deleting backups, or exploiting a discovered version each requires evidence of the
      corresponding later action. Deployment agents, forensics, security checks, and support scripts are strong benign counterexamples;
      product categories and common utilities do not constitute evasion children.
  - zh: 进程内软件清单查询按本次软件调查相对独立工具任务的承载位置划分。仅静态导入 WMI 类、解析 API、存在 WmiPrvse 或没有 wmic 启动不满足其准入；普通程序最终调用系统接口也不足以自动归类。软件查询、运行进程查询、硬件画像和后继环境门控即使由同一客户端连续执行，仍按各自直接信息对象与实际动作分别界定。
    en: In-Process Software-Inventory Query is partitioned by where this software inquiry is carried relative to a separate
      utility task. Static WMI-class imports, API resolution, the presence of WmiPrvse, and absent wmic launches are insufficient,
      as is the fact that ordinary programs ultimately call system interfaces. Software inquiries, running-process inquiries,
      hardware profiling, and later environment gating retain their own information-object and action boundaries even when
      one client performs them consecutively.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在获得服务器或用户终端的初始访问后，操作者可了解业务组件、远程管理软件及安全产品，再决定是否进行更深入的版本核验或选择其他行动。LunarWeb 研究中的软件与安全产品调查说明此类事实能进入恶意主机画像，但来源未公开每条返回记录，也未证明某次后继操作由哪一产品结果决定。
      en: After initial access to a server or user endpoint, an operator may identify business components, remote-management
        software, and security products before choosing deeper version validation or another action. Software and security-product
        inquiries in the LunarWeb research show such facts entering adversarial host profiling, but the report does not disclose
        each returned record or establish which product result determined a later action.
    - zh: 在勒索活动的横向调查阶段，安全和备份软件的清单可能帮助操作者理解保护与恢复条件。FIN12 使用的 Get-DataInfo.ps1 被记录收集这两类软件并归档结果；它支持父级软件发现，不能据此推断已获得备份管理权限、成功停用防护或使用某种独立的匿迹查询模式。
      en: During lateral surveying in ransomware operations, security and backup inventories may help operators understand
        protection and recovery conditions. FIN12's Get-DataInfo.ps1 is documented collecting both categories and archiving
        the results. This supports the parent behavior without establishing backup-management authority, successful defense
        disablement, or a distinct evasive inquiry mode.
    - zh: 自动化恶意客户端还可在初始注册前自行形成软件画像，以减少为此项调查另起清单工具的步骤。KGB RAT 的仪器化执行记录支持进程内安全产品请求与画像字符串的关联，但没有证明后继载荷按某个产品结果改变行为；其对系统属性的同时调查不转作软件版本、运行或防护状态证据。
      en: An automated malicious client can assemble a software profile before registration without launching another inventory
        utility for that task. KGB RAT's instrumented execution links an in-process security-product request with a reported
        profile string, without establishing that a later payload changes behavior in response to a particular product. Simultaneous
        system-attribute inquiries do not establish software versions, execution, or protection state.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要执行查询命令或代码、读取相应登记或连接获准的管理接口，并能消费实际返回。普通账户通常可读部分本地软件元数据，但远程 WMI、其他用户的配置和受保护产品状态受身份、命名空间、版本和部署方式约束。没有权限、提供方缺失或空返回应保持未知，不推断无安全产品。
        en: The adversary needs to execute inquiry commands or code, read relevant registration, or connect to an authorized
          management interface, and consume actual returns. Ordinary accounts can often read some local software metadata,
          but remote WMI, another user's configuration, and protected product state depend on identity, namespace, version,
          and deployment. Denied access, a missing provider, or an empty return remains unknown rather than proving no security
          product exists.
      - zh: 借用资产盘点外观还要求操作者能选择工具、脚本或执行身份；这不要求攻陷库存提供方，也不让系统工具自动获得新的权限。操作者必须承担结果陈旧、产品名称不唯一和查询触发修复等限制，不能假设同一查询能完整覆盖客户端、服务器、云与其他操作系统。
        en: Borrowing an inventory appearance additionally requires control over a tool, script, or execution identity, without
          requiring compromise of the inventory provider or granting a system utility new privileges. The operator faces stale
          results, nonunique product names, and query-triggered repair, and cannot assume identical coverage across clients,
          servers, cloud environments, and other operating systems.
      - zh: 对进程内实现，攻击者还须控制能构造请求并处理返回的客户端代码。该能力可以存在于刚开始执行的恶意程序中，不依赖长期驻留、受信宿主或注入；它不会改变命名空间权限和提供方可用性。选择不另起查询执行器可以省去对应工具边界，但仍需处理枚举、空集、超时和调用线程异常。
        en: An in-process implementation additionally requires control of client code that constructs requests and handles
          returns. This can exist in newly executing malware without long residence, a trusted host, or injection, and it
          changes neither namespace rights nor provider availability. Avoiding a separate query executor removes that utility
          boundary but still requires handling enumeration, empty sets, timeouts, and calling-thread faults.
    defender_model:
      paragraphs:
      - zh: 防守方可拥有带完整参数的进程创建、已启用的脚本块内容、经过本地验证的 WMI Trace 和独立的软件资产资料。前两者显示工具或脚本意图，Trace 可显示查询对象及原始客户端；这些通常不包含实际产品清单。Sysmon
          的 Registry 修改和 WMI 持久订阅事件不能代替任意 Registry 读取或 WQL 查询结果。
        en: Defenders may have process creation with full arguments, enabled script-block content, locally validated WMI Trace,
          and independent software-asset records. The first two expose tool or script intent, while Trace can expose the queried
          object and original client; they ordinarily do not contain actual product inventories. Sysmon Registry-change and
          persistent-WMI-subscription events do not substitute for arbitrary Registry reads or WQL query results.
      - zh: 可靠归属依赖客户端主机、查询时点与进程生命周期，不能把 WmiPrvse 的 PID 当成发起者，或把远端客户端 PID 关联到本机进程。资产登记只描述某个时点和视图，批准台账也必须另行维护；别名、缺失创建事件和被盗运维身份都会降低解释力。只有另经验证的结果采集才能证明具体名称、版本或状态被返回。
        en: Reliable attribution depends on the client host, inquiry time, and process lifetime; WmiPrvse's PID is not the
          initiating client, and a remote client's PID cannot be joined to a local process. Asset records describe a particular
          time and view, and work authorization requires a separately maintained register. Aliases, missing creation events,
          and stolen administrative identities weaken interpretation. Concrete returned names, versions, or states require
          independently validated result capture.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 在既有客户端内承载软件查询而省去独立清单工具的观察入口
    en: Carry software inquiries inside an existing client to remove the separate-inventory-utility observation entry
  analysis:
    paragraphs:
    - zh: 攻击者把实际软件清单请求放入正在执行的客户端代码，使这次调查没有一个可由独立工具创建规则直接定位的查询进程。KGB RAT 的动态记录给出软件类、程序化调用和该工具边界未产生的具体对照，因此因果链指向查询任务入口的省去，而非笼统地把正常
        API 当成匿迹。只看新工具启动的观察面可能无法恢复本次软件画像；实际请求和客户端仍存在，部署经验证的 WMI Trace 与同机生命周期关联后可恢复其归属。
      en: The adversary places an actual inventory request in executing client code, leaving this inquiry without a separate
        query process that a utility-creation rule can directly locate. KGB RAT's dynamic record supplies the software class,
        programmatic invocation, and specific contrast with an absent utility boundary. The causal chain therefore concerns
        removal of the query-task entry rather than treating normal APIs generally as evasive. A new-utility-only view can
        miss this profiling task, while requests and clients remain and can be attributed using validated WMI tracing and
        same-host lifetimes.
  evidence_refs:
  - REF-001356
  - REF-001306
  - REF-001309
  - REF-000230
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 借用软件资产管理的查询接口和工具外观降低恶意盘点的可区分性
    en: Borrow software-asset inquiry interfaces and utility appearance to reduce the distinguishability of malicious inventory
  analysis:
    paragraphs:
    - zh: 操作者以正常管理工具或脚本请求软件登记、安装产品和安全软件信息，保留与资产清查相同的可见程序及查询形状；这种设计不消除请求，而是让单个合法工具事件难以表达未经授权的软件画像意图。恶意采用由 LunarWeb 和 FIN12
        研究支持，合法查询形状由 Microsoft 库存文档支持；把查询范围、原始主体与批准任务结合才能改善区分。来源没有证明每次查询均出于匿迹动机或测量漏报，因此本机理只对借用该外观的实施成立，置信度为中等。
      en: The operator requests registration, installed-product, and security-software information through ordinary administrative
        tools or scripts, retaining the visible programs and inquiry shape of asset inventory. This design leaves requests
        present but makes one legitimate-utility event poorly express an unauthorized profiling purpose. LunarWeb and FIN12
        establish malicious use, while Microsoft inventory documentation establishes legitimate query shapes; joining scope,
        original principal, and approved work improves distinction. The sources neither establish a stealth motive for every
        inquiry nor measure missed detections, so the mechanism applies only to implementations borrowing that appearance
        and remains medium-confidence.
  evidence_refs:
  - REF-000639
  - REF-001340
  - REF-001336
  confidence: medium
subtechnique_taxonomy:
  coverage: established
  subtechnique_refs:
  - NJS-0243-001
  narrative:
    paragraphs:
    - zh: 本技术建立进程内软件清单查询一项匿迹子技术，稳定变量是本次软件调查由已执行的客户端直接承载，还是另起独立的清单工具任务。其观察差在于是否形成可直接标记调查的新工具入口；该划分不按安全、备份或其他产品类别，也不按某个 API
        名称、合法签名或客户端运行时长成立。
      en: This technique establishes In-Process Software-Inventory Query. Its stable variable is direct carriage of this inventory
        task by an executing client versus launching a separate utility task. The observation difference concerns creation
        of a new utility entry that directly marks the inquiry. The partition is not based on security, backup, or other product
        categories, an API name, a legitimate signature, or client age.
    - zh: 软件登记、版本和健康状态仍是父级信息语义，不能直接变为匿迹子项。既存结果复用、低频与事件触发的取得方式仍缺少软件特定的正面痕迹对照，保持研究暂缓。查询结果引起的分析环境判断、执行护栏和防御修改由相邻技术承担；组合使用不把这些后继动作并入本次清单查询。
      en: Registration, versions, and health remain parent information semantics rather than evasion children. Reuse of prior
        results, sparse acquisition, and event-triggered inquiry still lack software-specific positive trace contrasts and
        remain deferred research. Analysis-environment judgments, execution guardrails, and defense changes based on results
        belong to adjacent techniques and are not absorbed into this inventory task when combined.
