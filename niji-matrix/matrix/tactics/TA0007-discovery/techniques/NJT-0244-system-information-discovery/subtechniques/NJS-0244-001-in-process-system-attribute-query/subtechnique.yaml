schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0244-001
name:
  zh: 进程内系统属性查询
  en: In-Process System-Attribute Query
summary:
  zh: 由既有查询客户端直接发起本次系统属性读取，省去独立诊断工具的创建边界，并把观察重点转向实际查询语义与客户端谱系。
  en: Issue a particular system-attribute read directly from an existing query client, removing a separate diagnostic-tool
    creation boundary and shifting observation to query semantics and client lineage.
aliases: []
parent_ref: NJT-0244
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 进程内系统属性查询是攻击者把具体 OS、构建、体系结构或硬件属性请求放入已执行的查询客户端，通过程序化接口取得或处理结果，而不为这次调查另起 systeminfo、wmic 等诊断工具的实现。稳定变量是本次查询相对独立执行器的承载位置，不是某个
      API、类名或属性字段。
    en: In-Process System-Attribute Query places a particular OS, build, architecture, or hardware request in an already executing
      query client and obtains or handles its results through a programmatic interface instead of launching a separate diagnostic
      utility such as systeminfo or wmic for that inquiry. The stable variable is the inquiry's carrier position relative
      to a separate executor, rather than an API, class name, or property field.
  - zh: 这里的进程内只约束查询客户端。WMI 请求仍可跨 COM/RPC 到服务与 provider，provider 可以在既有或新建 WmiPrvSE 中运行；本项不声称所有计算与返回都在客户端内部。Group-IB 对 KGB RAT
      的仪器化沙箱记录了恶意进程发起 Win32_OperatingSystem 查询并在画像消息中报告 OS 字符串，提供了超出“存在接口”或“未见新进程”的正面能力链。
    en: In-process constrains the query client only. A WMI request can still cross COM/RPC into services and providers, which
      may run in an existing or new WmiPrvSE. The child does not place all computation and returns inside the client. Group-IB's
      instrumented KGB RAT detonation records the malicious process issuing Win32_OperatingSystem queries and reporting an
      OS string in a profile message, providing a positive capability chain beyond interface availability or absent creation
      events.
stealth_characteristics:
  paragraphs:
  - zh: 进程内系统属性查询省去一次主机画像作为独立诊断工具进程出现的边界。只根据新启动 systeminfo 或 wmic 识别系统调查的规则因此缺少预期事件，但原始客户端本身仍可见，也可能暴露异常映像、代码和网络关系；该变化不使恶意进程获得合法身份。
    en: In-Process System-Attribute Query removes the boundary where one host-profile inquiry appears as a separate diagnostic-tool
      process. Rules identifying system surveys through newly launched systeminfo or wmic consequently lose their expected
      event. The original client remains visible and may expose anomalous images, code, and network relationships; the change
      does not give a malicious process a legitimate identity.
  - zh: 查询语义、客户端身份和 WMI operation 仍是正面痕迹。Group-IB 正是通过仪器化观察到这些读取，说明本项只针对依赖独立进程创建的特定观察模型成立。官方 Trace 可在已启用且验证版本的条件下连接客户端与请求，但命名空间授权、provider
      加载或错误日志均不能单独给出成功读取的字段；返回对象与画像字符串也不等于真实物理硬件鉴定。
    en: Query semantics, client identity, and WMI operations remain positive traces. Group-IB observed the reads through instrumentation,
      demonstrating that the child applies to a particular separate-process-creation observation model. Enabled and version-validated
      official tracing can connect clients with requests, but namespace authorization, provider loading, and error logs individually
      cannot identify successfully read fields. Returned objects or profile strings also do not attest physical hardware.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须有本次系统属性查询与既有客户端的正面关联，并明确该客户端未为此次调查另起诊断执行器。实际返回按证据分级：查询提出与枚举器建立可记录为请求，取得具体对象或消息中的属性才支持相应结果。单纯静态导入、WmiPrvSE 存在、程序长期运行或没有
      systeminfo 事件均不足以纳入。
    en: 'Inclusion requires a positive association between a particular system-attribute inquiry and an existing client, with
      evidence that the client does not launch a separate diagnostic executor for that inquiry. Grade returns separately:
      a submitted query or created enumerator establishes a request, while particular objects or message attributes support
      the corresponding result. Static imports, the presence of WmiPrvSE, a long-lived program, or absent systeminfo events
      are insufficient.'
  - zh: 原始客户端可以是恶意程序、受控插件或代理，不要求冒用受信管理软件。代码注入、反射加载、WMI 执行方法与分析环境门控各有独立对象，不能仅由本项推出。相同进程同时读取进程、软件、用户或接口信息时仍按直接信息对象分流；合法安装器、监控和应用兼容性库的相似读取是正常反例。
    en: The original client may be malware, a controlled plugin, or an agent and need not impersonate trusted management software.
      Injection, reflective loading, WMI execution methods, and analysis-environment gating have independent objects and cannot
      be inferred from this child. Process, software, user, or interface reads by the same process retain their own direct-object
      boundaries. Similar reads by installers, monitors, and compatibility libraries remain normal counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者已有可执行客户端、需要在初始注册或后继组件选择前形成主机画像时，可选择在客户端内部直接读取系统属性。KGB RAT 的证据来自原始作者仪器化沙箱中的查询与画像回传，不能扩写为野外每个安装均这样运行，也不能把其产品宣传中的“FUD”当作验证结论。使用
        WMI 的具体实现说明一种承载路径，不把其他接口自动提升为已观测恶意实现。
      en: An adversary with an executable client can directly read attributes inside that client when building a host profile
        before initial registration or later component selection. KGB RAT evidence comes from the original authors' instrumented
        detonation queries and profile reporting, not every field installation. Its marketing term FUD is not a verified conclusion.
        The WMI implementation establishes one carrier path without making other interfaces observed malicious implementations
        automatically.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制能够构造查询和接收结果的客户端代码及其执行身份。WMI 路径受命名空间 DACL、调用 token、provider 与远程连接规则约束；允许查询并不赋予执行方法或 provider 注册权限。进程内承载可减少诊断工具启动，却需处理枚举、超时、空结果和错误，查询线程阻塞或异常也可能损害客户端稳定性。
        en: The adversary must control client code and its execution identity sufficiently to construct queries and receive
          results. A WMI path is constrained by namespace DACLs, caller tokens, providers, and remote-connection rules. Query
          authority does not confer execution-method or provider-registration authority. In-process carriage can reduce diagnostic-tool
          launches but must handle enumeration, timeouts, empty results, and errors; blocked threads or exceptions can also
          harm client stability.
    defender_model:
      paragraphs:
      - zh: 目标观察模型能够看到进程创建，但主要靠独立诊断程序来标记系统画像任务。补充已配置 WMI Trace、事件时间客户端生存期和批准查询职责后，可以把 OS 或硬件请求归属到原始进程；不能把 provider PID 或其父进程当作客户端。具体属性值还需要另外的结果观测，本批分析只消费请求语义。
        en: The target observation model sees process creation but labels system-profiling tasks chiefly through separate
          diagnostics. Configured WMI tracing, event-time client lifetimes, and approved-query duties can attribute OS or
          hardware requests to the original process. A provider PID or its parent is not the client. Particular attribute
          values require separate result observation; this delivery's analytic consumes request semantics only.
      - zh: 只留 5858 错误、只见 5857 provider 加载、Trace 开始太晚、客户端 PID 重用或跨机映射不明会使归属退化。调用内容观测更完整时，本项相对创建事件规则的优势收缩。采集健康与覆盖版本必须显式保留，不能从缺少查询事件反推没有进程内读取。
        en: Error-only 5858 records, provider-load-only 5857 events, late tracing, reused client PIDs, and unresolved cross-host
          mappings degrade attribution. Better invocation-content visibility reduces the advantage over creation-event rules.
          Collection health and covered versions must be retained explicitly, and missing query events do not establish absence
          of in-process reads.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 把查询承载在既有客户端中绕过独立诊断进程这一观察入口
    en: Carry the inquiry in an existing client to avoid the separate-diagnostic-process observation entry
  analysis:
    paragraphs:
    - zh: 攻击者把系统属性读取直接作为客户端代码的一部分执行，使本次查询不再对应一个新诊断工具进程。Group-IB 的样本执行记录将具体 WMI 请求与进程内承载连接，并给出仅进程创建检测的观察差；官方查询与 Trace 合同说明该变化保留管理请求和客户端痕迹。因而可成立的是特定观察入口被省去，而不是
        WMI 服务无痕、程序完全隐形或所有检测产品漏报。该因果链由一个仪器化样本族支撑，保持中等置信。
      en: The adversary executes the system-attribute read as part of client code so the inquiry no longer corresponds to
        a newly created diagnostic utility. Group-IB's sample execution connects particular WMI requests with in-process carriage
        and describes the difference for creation-only detection. Official query and tracing contracts show that management
        requests and client traces remain. The supported effect is removal of one observation entry, not a traceless WMI service,
        an invisible program, or misses by all detectors. One instrumented sample family supports the causal chain, which
        remains medium-confidence.
