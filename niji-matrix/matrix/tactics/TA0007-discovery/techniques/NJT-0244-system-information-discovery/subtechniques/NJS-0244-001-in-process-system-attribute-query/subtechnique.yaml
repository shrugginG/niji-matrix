research:
  limitations:
    paragraphs:
    - zh: 子项的恶意实现证据来自 Group-IB 对 KGB RAT 的仪器化沙箱，未提供野外查询发生率、独立工具对照测试或检测率。图示 OS 字符串证明样本报告了属性，不能保证字段正确、主板读取成功或实际硬件为某个型号；报告对 AV、进程、地域和休眠的其他观察不转作本子项结果。
      en: Adversarial implementation evidence comes from Group-IB's instrumented KGB RAT detonation, without field-query frequency,
        controlled utility comparisons, or detection rates. The pictured OS string shows that the sample reported an attribute,
        not that it was accurate, baseboard reading succeeded, or physical hardware had a particular model. The report's AV,
        process, geographic, and sleep observations are not assigned as this child's results.
    - zh: 当前可实施分析仅覆盖已验证 WMI Trace 的请求路径，不覆盖所有 Win32、.NET 或其他平台 getter。Trace、命名空间审核和进程创建均不能单独证明完整属性返回，结果仪器化不是默认 EDR 能力。未来跨版本客户端与结果观测、正常应用基线和实际对照实验会改变其覆盖与置信度。
      en: The implementable analytic currently covers request paths under validated WMI tracing, not all Win32, .NET, or other-platform
        getters. Tracing, namespace auditing, and process creation individually cannot establish complete attribute returns,
        and result instrumentation is not default EDR capability. Cross-version client/result observations, normal-application
        baselines, and real controlled comparisons could change coverage and confidence.
