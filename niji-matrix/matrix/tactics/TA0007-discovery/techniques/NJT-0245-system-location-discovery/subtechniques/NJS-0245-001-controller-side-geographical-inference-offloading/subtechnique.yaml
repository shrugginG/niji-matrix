schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0245-001
name:
  zh: 控制端地理推断卸载
  en: Controller-Side Geographical Inference Offloading
summary:
  zh: 在 bot 已建立访问后，由控制端对其已见地址执行地理定位，使定位请求与结果位于企业端点观察面之外。
  en: After bot access exists, perform geolocation on its observed address at the controller, placing the lookup request and
    result outside the enterprise endpoint observation plane.
aliases: []
parent_ref: NJT-0245
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 控制端地理推断卸载是把被访问系统的位置推断计算放到攻击者控制端，并以 bot 回连时已见的地址或已取得的地域输入形成位置知识。受害系统仍参与建立访问或提供原始输入，但关键的地址到地域查询及结果解释不在该端点执行。Crimson
      Server version A 对 bot 的远端 IP 请求外部定位服务，提供了这一行为边界的具体实现。
    en: Controller-Side Geographical Inference Offloading places location-inference computation for an accessed system at
      the adversary's controller, using the address observed during a bot callback or previously acquired regional inputs.
      The victim still participates in access or supplies raw input, but the address-to-region lookup and interpretation do
      not run on that endpoint. Crimson Server version A provides a concrete implementation by submitting a bot's remote IP
      to an external location service.
  - zh: 划分变量是推断所处的观察位置，不是定位服务、报文格式或地区字段。端点直接向外部 GeoIP 服务请求属于父级常规路径；只有证明控制端代表已被访问系统执行推断，才纳入本子项。一个可疑回连、控制端访问定位网站或企业端没有定位流量，单独均不能证明该阶段成立。
    en: The variable is the observation position of inference, not the service, message format, or geographical field. An
      endpoint directly querying an external GeoIP service remains a parent-level path. This child requires evidence that
      a controller performs inference for an already accessed system. A suspicious callback, a controller visit to a location
      site, or absence of enterprise-side location traffic alone establishes no such stage.
stealth_characteristics:
  paragraphs:
  - zh: 控制端地理推断卸载使受害企业的端点日志与出口记录不再包含定位计算的完整语义链。防守方可能看到 bot 连接，却看不到控制端随后向服务提交哪个受害地址以及得到什么地区结果。仅阻断端点访问已知定位域名或检索地区命令无法覆盖这个观察位置差异。
    en: Controller-Side Geographical Inference Offloading removes the complete semantic chain of location computation from
      victim-enterprise endpoint and egress records. Defenders may see a bot connection without seeing which victim address
      the controller later submits to a service or which regional result it receives. Blocking endpoint access to known location
      domains or searching for regional commands does not cover that observation-position difference.
  - zh: 控制端仍留下可调查的请求、结果或缓存；外部流量研究也可能建立时序关系。只有将这些远端证据与 bot 输入绑定，才可把该知识获取从普通 C2 通信中区分。现有资料证明实现和采用，但未证明有意规避的设计动机或检测效果，因此匿迹解释保持中等置信，不宣称无网络或无法检测。
    en: The controller still leaves investigable requests, results, or cache entries, and external traffic research may establish
      timing relationships. Only linking remote evidence to bot inputs distinguishes this knowledge acquisition from ordinary
      C2 communication. Available sources establish implementation and use but not evasive design intent or detection effectiveness,
      so the stealth interpretation remains medium-confidence and claims neither network silence nor undetectability.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入 bot 会话形成后由控制端或其定位组件对该 bot 输入执行的地域推断。控制端复用其保存结果可属于同一实现，但必须保存输入、结果生成时间和适用关系；普通缓存优化本身不另立子项。入侵前根据网页访问者地址地域投放不满足本子项的已获访问条件。
    en: The scope includes regional inference performed by a controller or its location component on a bot's input after the
      bot session exists. Reuse of a saved controller result can belong to the same implementation but requires preservation
      of the input, result-generation time, and applicability. Routine caching does not define another child. Pre-compromise
      geographical website delivery does not satisfy the access prerequisite.
  - zh: 显示国家标签不证明设备物理位置，也不证明其后的载荷门控。共享公网地址、代理和重分配使多个设备可能对应同一输入；缺少有效时间或会话映射时只能得出地址级结果，不能回填唯一终端或用户。分析环境识别与地域执行条件保持相邻技术归属。
    en: A displayed country label proves neither physical device position nor subsequent payload gating. Shared public addresses,
      proxies, and reassignment can associate multiple devices with one input. Without a valid-time or session mapping, the
      conclusion remains address-level and cannot be assigned to a unique endpoint or user. Analysis-environment classification
      and geographical execution conditions remain adjacent techniques.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 远程控制面板可在新 bot 注册时定位已见源地址，把地区信息加入目标列表，后续再由操作者决定任务。控制端具备位置查询和存储能力是前提；受害主机不必自己运行定位命令，也不必有浏览器位置服务授权。已见地址可为代理出口，因此该场景取得的仍是地址相关地域知识。
      en: A remote-control panel can locate the observed source address during new-bot registration and add geographical information
        to its target list before an operator decides later tasking. A controller capable of lookup and storage is required.
        The victim need not run a location command or hold browser location-service authorization. The observed address may
        be a proxy exit, so the knowledge remains geography associated with an address.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者控制 bot 接收端并能从会话取得对端地址，或已取得与该系统相关的输入，再向位置服务请求结果。它可选择在控制端解析和缓存，但不能由此保证服务可达、输入未被代理改变或数据仍新鲜。取得位置结果之后的任务选择不是本子项的必要步骤。
        en: The adversary controls the bot receiver and can obtain the peer address from its session or already possesses
          an input associated with the system, then requests a location result. It can choose controller-side parsing and
          caching but cannot thereby guarantee service reachability, an input unaffected by proxying, or fresh data. Task
          selection after the result is not a necessary part of this child.
    defender_model:
      paragraphs:
      - zh: 直接检测要求合法可见的控制端或受控样本接收器记录 bot 会话输入，并有对应 HTTP 请求、解析结果或缓存证据。只有企业端通信记录时不能补造远端事件。外部流量可建立连接和时间线，但在看不到请求正文或结果时须标为请求候选；时间相关不能替代地址匹配，NAT
          和动态地址须保留多重映射。
        en: Direct detection requires a lawfully visible controller or controlled-sample receiver recording bot-session input,
          together with corresponding HTTP requests, parsed results, or cache evidence. Enterprise communication records alone
          cannot supply missing remote events. External flow visibility can establish connections and timing but remains a
          request candidate without payload or result visibility. Timing correlation cannot replace address matching, and
          NAT or dynamic addresses require preservation of multiple mappings.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 在控制端执行地域查询使关键获取阶段位于企业端点直接观察范围之外
    en: Execute the regional lookup at the controller beyond direct enterprise endpoint observation
  analysis:
    paragraphs:
    - zh: 控制端利用已建立 bot 会话的地址发起定位，受害端只留下该会话的本地痕迹；查询和结果存在于另一观察域。端点侧定位服务规则因此不能重构该阶段，需要远端记录或受控重放恢复因果链。该效果直接来自观察覆盖缺口，故采用行为透明；不因端点和控制端分属两个节点就推导时空释痕。
      en: The controller initiates location lookup using the established bot session's address, leaving the victim with local
        traces of that session while lookup and result exist in another observation domain. Endpoint location-service rules
        cannot reconstruct this stage without remote records or controlled replay. The effect follows from a coverage gap
        and maps to Behavioral Transparency; two separate nodes alone do not establish Spatiotemporal Trace Dilution.
