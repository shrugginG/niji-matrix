schema_version: 2.0.0
type: technique
id: NJT-0245
name:
  zh: 系统位置发现
  en: System Location Discovery
summary:
  zh: 在取得系统访问后收集或推导地理位置线索，并可把定位计算移至控制端，使关键查询不进入企业端点的直接观察范围。
  en: Collect or derive geographical clues after accessing a system, potentially moving location computation to the controller
    so that the key lookup lies outside direct enterprise endpoint visibility.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1614
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1614
definition_and_concept:
  paragraphs:
  - zh: 系统位置发现是攻击者在已经获得访问的环境中，取得地理相关输入或位置结果，以推断被访问系统所在地域的行为。输入可以是用户界面语言、输入区域或时区设置，也可以是已见公网地址、实例区域以及在权限允许时由位置服务返回的数据。完成条件是有证据表明攻击者取得了相应输入或结果，而不是进程名称、命令行或
      API 调用中出现了某个位置词语。
    en: System Location Discovery acquires geographical inputs or location results in an environment already accessed to infer
      the region of the accessed system. Inputs can include UI language, input locale, and time-zone settings, an observed
      public address, an instance region, or permission-dependent position-service data. Completion requires evidence that
      the corresponding input or result was acquired; a location-related word in a process name, command line, or API call
      does not establish it.
  - zh: 地域推断存在不同的证据层级。语言标识描述显示偏好，键盘列表描述输入区域，时区描述本地时间转换，GeoIP 结果关联一个网络地址，云实例区域描述承载环境。它们均不能单独证明设备或使用者的物理位置。位置服务返回的坐标也须结合时间、误差和缓存状态解释。父项保存这些知识获取路径的共同目的，将随后针对地域的行为选择与获取阶段分开。
    en: Geographical inference has distinct evidential levels. A language identifier describes display preference, a keyboard
      list describes input locales, a time zone describes local-time conversion, a GeoIP result concerns a network address,
      and an instance region describes hosting. None alone proves the physical position of a device or user. Position-service
      coordinates also require interpretation of time, uncertainty, and cache state. The parent captures the shared acquisition
      purpose while separating later geographical behavior selection from acquisition.
stealth_characteristics:
  paragraphs:
  - zh: 本项的观察困难首先来自推断过程所处的位置。攻击者可在原进程中取得已有环境设置，也可由控制端对 bot 回连时已见的公网地址查询外部定位服务。前者不要求额外启动地区查询工具，后者使企业侧网络记录只包含 bot 通信而不包含控制端的
      GeoIP 请求。仅监视端点命令或端点到定位域名的访问，会分别缺失这些路径中的关键阶段。
    en: The observation problem depends first on where inference occurs. An adversary can read existing environment settings
      within its process or have its controller query an external location service using the public address already observed
      when a bot calls back. The former need not launch an additional location utility; the latter leaves enterprise network
      records containing bot communication but not the controller's GeoIP request. Monitoring endpoint commands or endpoint
      visits to location domains alone misses different key stages of these paths.
  - zh: 这些差异并不使行为不可观察。经部署验证的函数结果采集可以还原本地输入；合法获得的控制端、服务端或受控模拟记录可以还原远端查询。CrimsonRAT 的控制端查询和缓存有直接行为证据，但研究没有测量其检测率，也没有证明作者为了降低检测而选择该架构。本技术的匿迹机理因此是相对于指定观察面的中等置信推断，不能把所有只读配置访问或所有远端计算自动称为匿迹。
    en: These differences do not make the behavior unobservable. Validated function-result collection can recover local inputs,
      while lawfully available controller, service, or controlled-simulation records can recover the remote lookup. Controller-side
      lookup and caching in CrimsonRAT are directly documented, but the research does not measure detection rates or establish
      that the architecture was chosen to evade detection. The stealth mechanism is therefore a medium-confidence inference
      relative to a specified observation plane; neither every configuration read nor every remote computation automatically
      qualifies.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入范围是获得访问后，为推断该系统地域而取得本地区域输入、地址定位结果或实例承载区域的过程，包括攻击者控制端在 bot 会话形成后执行的定位。API 返回大小、查询发出、DNS 解析、HTTPS 建连和 HTTP 成功状态都不等同于取得有效位置结果。须区分输入取得、请求完成、服务返回、结果解析及其后推断，并保留错误、空值和未观测阶段。
    en: The scope includes acquisition of local regional inputs, address-location results, or instance hosting region after
      access for inferring that system's geography, including controller lookup after a bot session exists. An API size return,
      submitted query, DNS resolution, HTTPS connection, or successful HTTP status is not acquisition of a valid location
      result. Input acquisition, request completion, service return, parsing, and later inference must be distinguished, preserving
      errors, empty values, and unobserved stages.
  - zh: 普通国际化显示、安装程序语言选择和运维时区诊断只有相同表面信号，不能仅据此归入恶意发现。一般操作系统或硬件属性属于 T1082，本机网络配置属于 T1016，专门读取位置输入时不再复制 NJT-0241 的注册表载体分类。入侵前地域投放、反沙箱、调试器探测以及取得地区信息后才发生的载荷门控各有相邻归属，不能作为本项新增子技术。
    en: Routine internationalized display, installer language selection, and time-zone troubleshooting can produce similar
      surface signals and cannot alone establish malicious discovery. General OS or hardware attributes belong to T1082 and
      local network configuration to T1016; dedicated acquisition of location inputs does not replicate NJT-0241's Registry-carrier
      taxonomy. Pre-compromise geographical delivery, sandbox evasion, debugger checking, and payload gating after geographical
      knowledge is acquired have adjacent ownership and are not new children here.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 终端植入可在注册、初始调查或接收后续任务之前取得地区线索；远程控制面板也可在新的 bot 回连时对其已见公网地址定位。对实例的调查还可读取承载区域，以服务于攻击者对环境分布的理解。这些场景只建立位置知识获取，不能从它们推出受害行业、真实国籍、实际物理位置或后继行动已经发生。
      en: An endpoint implant can obtain regional clues during registration, initial investigation, or before later tasking.
        A remote-control panel can also locate the public address it observes when a new bot calls back. Instance investigation
        can read a hosting region to understand the environment's distribution. These scenarios establish geographical knowledge
        acquisition, not victim sector, nationality, actual physical position, or completion of subsequent actions.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者已经能够在系统执行代码、读取所需配置，或接收受控 bot 的通信。取得用户区域设置通常不要求获得位置服务权限，但返回内容受当前用户、系统默认值、继承环境和会话影响。调用位置服务则须满足具体浏览器、操作系统或应用权限；本研究不假设可以绕过用户同意，也不把语言
          API 视为坐标接口。
        en: The adversary can execute code and read the relevant configuration on the system or receive communication from
          a controlled bot. Acquiring user regional settings generally does not require location-service permission, but results
          depend on the user, defaults, inherited environment, and session. Position-service access must satisfy the relevant
          browser, OS, or application permissions. This research assumes no consent bypass and does not treat a language API
          as a coordinate interface.
      - zh: 在控制端定位路径中，攻击者控制查询的执行点和地址输入，能够接收服务结果或复用保存结果，但未必控制受害设备的出口、代理和地址分配。地址变化、服务限速、数据库更新和缓存过期会改变可用性与推断可靠性；攻击者取得一个地区标签并不等于取得可验证的物理坐标。
        en: In the controller path, the adversary controls the query execution point and address input and can receive service
          results or reuse saved results, but need not control the victim's egress, proxying, or address assignment. Address
          changes, service throttling, database updates, and stale cache entries affect availability and reliability. Acquiring
          a region label is not acquiring verified physical coordinates.
    defender_model:
      paragraphs:
      - zh: 企业防守方可具备进程创建、命令行、已启用的进程网络与 DNS 遥测，但这些记录通常不包含 getenv 或地区 API 的返回内容。Sysmon Event 1 证明进程上下文，Event 3 和 22 分别证明连接或查询阶段；它们既不证明读取到地区配置，也不证明服务返回。结果级判断要求另行部署并验证采集、解析和进程寿命映射。
        en: Enterprise defenders may have process creation, command lines, enabled process-network events, and DNS telemetry,
          but these typically do not include getenv or regional-API return values. Sysmon Event 1 establishes process context,
          while Events 3 and 22 establish connection and query stages. They establish neither regional configuration acquisition
          nor service return. Result-level conclusions require separately deployed and validated collection, parsing, and
          process-lifetime mapping.
      - zh: 控制端卸载超出了仅在受害企业采集的正常覆盖。只有在合法取得控制端工件、服务端记录、外部网络可见性或受控模拟时，才能直接关联 bot 地址与定位请求；缺少这些证据时只保留相关入侵或通信线索。共享 NAT、代理出口和地址重分配还要求带有效时间的映射，无法唯一归属时必须保留未知或集合身份。
        en: Controller offloading exceeds ordinary coverage collected solely within the victim enterprise. Direct linkage
          between bot address and location request requires lawfully acquired controller artifacts, service records, external
          network visibility, or a controlled simulation. Without it, only related intrusion or communication leads remain.
          Shared NAT, proxy egress, and address reassignment require time-bounded mappings, and ambiguous attribution must
          remain unknown or set-valued.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 将地域输入读取或地址定位置于常规端点命令与网络规则不能完整观察的执行位置
    en: Place regional-input reading or address lookup where routine endpoint command and network rules lack complete visibility
  analysis:
    paragraphs:
    - zh: 在进程内取得继承环境或由控制端解释已见 bot 地址，会改变关键语义事件的观察位置。前者可能没有独立地区查询进程，后者在受害端点没有对应的 GeoIP 服务请求。只依赖这两类表面事件的检测因而无法恢复完整的位置知识获取链，必须增加经验证的函数结果或远端侧证据。这里降低的是指定观察面的完整性，不是全网流量或全部主机事件数量。
      en: Reading inherited environment within a process or interpreting an observed bot address at its controller changes
        where the key semantic event can be observed. The former may produce no separate regional-query process; the latter
        produces no corresponding GeoIP-service request at the victim endpoint. Detection relying on these surface events
        cannot recover the complete knowledge-acquisition chain without validated function results or remote-side evidence.
        The effect concerns completeness of a specified observation plane, not total network traffic or all host events.
    - zh: Cuckoo 的 getenv(LANG) 与 CrimsonRAT 的控制端查询分别提供具体读取实现和恶意采用依据；其检测影响来自这些操作位置与事件合同的对照推断。查询仍可能被函数结果采集或控制端证据记录，来源并未测量目标检测器的漏报率或证明特定规避动机。地域输入怎样控制后继执行保持独立边界，不能用后继分支替代本次获取阶段的痕迹证据。
      en: Cuckoo's getenv(LANG) and CrimsonRAT's controller lookup provide concrete read implementations and evidence of malicious
        use. Detection implications are inferred by comparing those operation positions with event contracts. Function-result
        collection or controller evidence can still record the lookup, and the sources measure neither detector misses nor
        a particular evasion motive. How regional inputs control later execution remains a separate boundary and cannot replace
        trace evidence for this acquisition stage.
  evidence_refs:
  - REF-001357
  - REF-001358
  - REF-001359
  - REF-000230
  confidence: medium
subtechnique_taxonomy:
  coverage: established
  subtechnique_refs:
  - NJS-0245-001
  narrative:
    paragraphs:
    - zh: 当前子分类采用定位计算所处的观察位置这一变量，建立控制端地理推断卸载。它要求位置推断在受害端点之外执行，并能把输入绑定到已被访问的 bot；仅使用一个外部网站或缓存结果不自动构成卸载。端点本地读取、端点主动访问 GeoIP
        服务与位置服务能力仍由父项覆盖。
      en: The current taxonomy uses the observation position of location computation and establishes Controller-Side Geographical
        Inference Offloading. It requires inference outside the victim endpoint and linkage of the input to an already accessed
        bot; use of an external website or a cached result alone does not establish offloading. Local endpoint reads, endpoint-initiated
        GeoIP access, and position-service capabilities remain covered by the parent.
    - zh: 不按国家、语言、时区、接口、厂商或平台建立子项。现有材料支持控制端位置变化及专门证据合同，却不足以把缓存寿命、低速查询、既存坐标复用或地理结果融合分别确认为稳定匿迹分类。后继按地域控制载荷也不进入本分类，避免把知识获取和执行条件重复建模。
      en: Countries, languages, time zones, interfaces, vendors, and platforms do not define children. Available material
        supports the controller-location difference and a dedicated evidence contract, but does not establish cache lifetime,
        slow querying, existing-coordinate reuse, or fusion of geographical results as separate stable stealth classes. Subsequent
        geographically conditioned payload behavior is also excluded to avoid modeling acquisition and execution conditions
        twice.
