schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0248-001
name:
  zh: 驻留上下文内联身份查询
  en: Resident-Context Inline Identity Inquiry
summary:
  zh: 在既有受控执行体中直接完成身份读取与输出，省去为本次检查另起工具的任务边界，并保留身份来源的独立解释。
  en: Read and output identity inside an existing controlled executor, removing a separate utility-task boundary while retaining
    independent interpretation of identity sources.
aliases: []
parent_ref: NJT-0248
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 驻留上下文内联身份查询是攻击者把当前身份检查直接交给已经运行的受控进程，在其任务入口执行身份读取并回送结果的匿迹子技术。稳定变量是本次调查的承载方式：相对于启动whoami等工具或新建每任务执行器，身份任务借用既有生命周期完成。建立驻留体与把代码植入宿主是前置或相邻行为，本项只解释这次查询的执行选择。
    en: 'Resident-Context Inline Identity Inquiry dispatches a current-identity check directly to an already running controlled
      process, reads identity at its task entry, and returns the result. The stable variable is carriage of this inquiry:
      compared with launching a utility such as whoami or creating a per-task executor, the identity task uses an existing
      lifetime. Establishing residency and placing code into a host are prerequisite or adjacent actions; this child concerns
      the execution choice for this inquiry.'
  - zh: 固定TrustedSec入口把whoami指向beacon_inline_execute，具体代码打开当前进程令牌取得TokenUser，并另取调用线程的NameSamCompatible名称。它证明具体身份功能确在该承载链中，而不是把框架能内联的通用说明套给所有发现动作。组与权限输出仍可共同映射其他信息目标，本子项不扩大为令牌窃取或权限提升。
    en: The pinned TrustedSec entry directs whoami to beacon_inline_execute. Its implementation opens the current process
      token for TokenUser and separately obtains the calling thread's NameSamCompatible name. This places concrete identity
      functionality in the carrier chain rather than applying generic framework capability to every discovery action. Group
      and privilege outputs can co-map to other information objectives without expanding this child into token theft or privilege
      escalation.
stealth_characteristics:
  paragraphs:
  - zh: 驻留上下文内联身份查询改变的是本次调查的独立生命周期痕迹。只依赖whoami、cmd或PowerShell启动的防守方不再有该工具事件作为查询入口，而已有进程的名称与创建时账户不能揭示刚执行的身份任务。固定集成明确省去cmd.exe，官方文档给出每任务创建与注入的对照，足以支撑能力级观察差。
    en: Resident-Context Inline Identity Inquiry changes the inquiry's separate lifecycle trace. A defender relying on whoami,
      cmd, or PowerShell launches lacks that utility event as an inquiry entry, while the existing process name and creation-time
      account do not reveal the identity task just executed. Pinned integration explicitly omits cmd.exe and official documentation
      supplies the per-task creation and injection comparison, supporting a capability-level observation difference.
  - zh: 查询并未消失。调用线程、进程令牌句柄、身份缓冲区、任务代码位置和回传仍可观察；某些名称解析可触达域服务。实现还可能把模拟客户名称与宿主进程TokenUser打印在同一行，防守方若强行合并会得到错误归属。效果因此取决于观察是否深入任务和身份来源，而不取决于是否拥有某个泛称为API遥测的产品。
    en: The inquiry does not disappear. Calling thread, process-token handles, identity buffers, task code location, and returned
      output remain observable, and some name resolution can reach domain services. The implementation can also print an impersonated
      client's name beside the host process TokenUser; forcibly merging them produces incorrect attribution. Effectiveness
      therefore depends on task and identity-source observation rather than possession of a product generically described
      as API telemetry.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入已有受控执行体正面承载本次身份读取、并有对应工具或每任务执行器足迹对照的设计。只有API解析、普通应用调用GetUserName、长期进程中出现一个令牌句柄、命令工具缺失或传感器漏采均不足成立；也不规定必须是BOF或特定厂商框架。
    en: Include designs with positive carriage of this identity read by an existing controlled executor and a comparison with
      utility or per-task-executor traces. API resolution, a normal application's GetUserName call, a token handle in a long-lived
      process, absent utilities, and sensor loss are insufficient. Neither BOFs nor a particular framework is required by
      the boundary.
  - zh: 进程清单内联任务由NJT-0240负责，本项须实际消费身份；仅枚举账户或组集合仍归相邻父项。线程模拟本身不在此定义内，访问已有令牌获取用户信息也不代表复制或盗取令牌。正常代理、认证组件、授权检查与运维插件可在既有进程内执行相同读取，需要验证任务代码来源与工作授权。
    en: NJT-0240 owns inline process-list tasks, while this child requires identity consumption. Account or group-set enumeration
      remains adjacent. Thread impersonation itself is outside this definition, and querying a user from an existing token
      does not mean copying or stealing the token. Normal agents, authentication components, authorization checks, and support
      plugins can make identical reads inside existing processes, requiring task-code provenance and work authorization.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在已有代理接收操作者任务后，可用短时身份检查确认本次执行所处账户，再决定是否继续调查其他资源。固定whoami BOF提供这种能力的可核验实现，但没有对应的野外恶意任务记录；其独立名称与SID输出仍需逐来源解释，不能自动证明权限切换成功。
      en: After an existing agent receives an operator task, a short identity check can establish the account context before
        further resource inquiries. The pinned whoami BOF provides a verifiable implementation without a corresponding malicious
        field-task record. Its separately sourced name and SID still require interpretation and do not automatically demonstrate
        a successful authority transition.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要已有受控执行体的任务分派与内联代码能力、可用身份查询接口和输出通路。固定实现要求打开自身进程令牌并分配返回缓冲区；线程名称还受模拟和名称格式可用性影响，BOF未在名称缓冲区不足时自动扩容重试。单线程阻塞或异常会损失代理，因而它适合短任务而非无限会话监视。
        en: The adversary needs task dispatch and inline-code execution in an existing controlled executor, available identity
          interfaces, and an output path. The pinned implementation must open its process token and allocate return buffers.
          Thread names additionally depend on impersonation and name-format availability, and its name buffer does not automatically
          grow and retry on insufficiency. Single-thread blocking or failure can lose the agent, favoring short checks rather
          than indefinite session monitoring.
    defender_model:
      paragraphs:
      - zh: 防守观察需要把任务入口、代码来源、进程出生实例、调用线程和令牌句柄来源连成证据链，才能从已有宿主中恢复身份查询。默认进程事件只能说明宿主存在，脚本日志只覆盖经过相应引擎的路径；声明全部原生API都被EDR捕获不在假设内。
        en: Observation needs a chain linking task entry, code provenance, process birth instance, calling thread, and token-handle
          origin to recover the inquiry inside its existing host. Default process events establish only host existence, while
          script logs cover only the respective engine paths. Capture of every native API by EDR is not assumed.
      - zh: 经验证的插桩可以记录成功与失败调用并区分进程TokenUser和线程名称，但遗漏的打开、复制或关闭句柄事件会使来源未知。采集器健康、架构、代码页、任务入口覆盖及数据截断均影响可解释性；即使身份值完整，也不能从账户标识归因真实操作人员。
        en: Validated instrumentation can record successes and failures and distinguish process TokenUser from a thread name.
          Missing handle opens, copies, or closes make origin unknown. Collector health, architecture, code page, task-entry
          coverage, and truncation affect interpretability. Even a complete identity value cannot attribute the actual person
          operating the account.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 将明确身份任务留在既有执行实例内削弱每任务工具创建观察
    en: Keep an explicit identity task inside an existing instance to weaken per-task utility-creation observation
  analysis:
    paragraphs:
    - zh: SA.cna中的whoami别名明确内联调用，任务代码的TokenUser查询、线程名称读取与printoutput证明行为并非仅加载一个无关模块。与官方每任务fork&run足迹相比，观察变化是没有单独的命令工具或每任务执行器入口，因此按工具创建识别身份调查的逻辑缺失一个关键输入。正面的任务与调用插桩能恢复这一行为，而单纯缺少日志不能反向证明它发生；来源支持设计能力，不支持量化实战规避。
      en: The SA.cna whoami alias explicitly invokes inline execution, while its TokenUser query, thread-name read, and print
        output demonstrate actual identity functionality rather than merely loading an unrelated module. Compared with the
        documented per-task fork-and-run footprint, the changed observation is loss of a separate utility or task-executor
        entry, removing an input from utility-creation-based identification. Positive task and call instrumentation can recover
        the behavior, whereas absent logs cannot establish it retrospectively. Sources support design capability rather than
        quantified operational evasion.
