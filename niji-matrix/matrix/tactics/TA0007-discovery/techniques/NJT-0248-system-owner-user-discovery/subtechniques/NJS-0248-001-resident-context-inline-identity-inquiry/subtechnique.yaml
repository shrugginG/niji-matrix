research:
  limitations:
    paragraphs:
    - zh: 结论来自固定源代码与官方架构文档，未编译、执行或测量BOF，也未发现证明同一身份任务采用本承载的恶意案例。普通程序也会同进程读取自身身份，因此任务来源的恶意语境必须另证。失去工具启动输入不等于全部端点传感器不可见。
      en: The conclusion comes from pinned source and official architecture documentation without compiling, executing, or
        measuring the BOF, and no malicious case establishes this carriage for the same identity task. Ordinary applications
        also read their identities in-process, so malicious task context requires independent proof. Loss of a utility-launch
        input does not imply invisibility to every endpoint sensor.
    - zh: 固定源码用GetCurrentProcess令牌得到SID，再用GetUserNameExA得到名称，没有证明二者在模拟情形一致。错误路径、名称缓冲区不足与输出截断可让一部分事实缺失；只有完成独立句柄与返回验证的采集才能提升结果层置信度，不应把框架输出标题当作权威身份绑定。
      en: The pinned source obtains a SID from the GetCurrentProcess token and a name through GetUserNameExA without establishing
        agreement under impersonation. Error paths, insufficient name buffers, and truncated output can omit facts. Only independently
        validated handle and return capture improves result-level confidence; a framework's output heading is not an authoritative
        identity binding.
