research:
  limitations:
    paragraphs:
    - zh: 子项证据是固定开源实现与官方执行模型，没有编译、加载、恶意软件执行或宿主采集实验。源码设计的读取、格式化与回传链不证明某次执行已经成功；枚举缓冲处理和状态文字表还可能限制健壮性。不存在可据此归因的野外案例、查询频率或检测率。
      en: Evidence consists of pinned open implementation and an official execution model, without compilation, loading, malware
        execution, or carrier-capture experiments. Designed read, formatting, and reporting chains do not establish a successful
        invocation, and enumeration-buffer handling and the status-text table can limit robustness. No field case, inquiry
        frequency, or detection rate can be attributed from this evidence.
    - zh: 防御需要所选宿主的明确入口和SCM采集合同，不能把默认EDR或缺少新进程替代这些输入。继承或早先打开句柄、未覆盖接口、跨线程任务和源代码变更都可能降低归属；未来真实使用、完整状态与分页测试和跨传感器对照将改变边界与置信度。
      en: Defense requires explicit entry and SCM-capture contracts for selected carriers rather than default EDR or absent
        process creation. Inherited or preopened handles, uncovered interfaces, cross-thread tasks, and source changes can
        degrade attribution. Actual use, full-state and pagination tests, and cross-sensor comparisons could change boundaries
        and confidence.
