research:
  limitations:
    paragraphs:
    - zh: 恶意软件证据来自GOSAR原始样本能力表，没有逐主机查询、返回值和发生日期，不能把出版日期当作读取时间。内联子项来自固定开源工具与官方执行模型，未编译或执行，也没有野外采用、完整分页或PAUSED状态输出实测。macOS属于固定父范围，但本批实现和检测论证主要为Windows及Linux/Cronie，不能推广为所有launchd或平台调度器覆盖。
      en: Malware evidence comes from the original GOSAR capability table rather than per-host inquiries, returns, or execution
        dates; publication is not inquiry time. The inline child rests on pinned open tools and an official model without
        compilation, execution, field adoption, or testing of full continuation or PAUSED output. MacOS remains within fixed
        parent scope, but implementation/detection reasoning chiefly covers Windows and Linux/Cronie rather than all launchd
        or platform schedulers.
    - zh: 两种机理均是特定观察模型下的条件化推断，没有测得检测率。权限、过滤和状态变化限制取得的视图，注册或服务PID不证明当前执行与有效保护。命令与WMI分析只消费请求，原生结果分析需要显式额外插桩；批准、身份、句柄或健康缺失时保持未知。未来实际调用链、正常工作基线、跨版本ABI和返回采集对照将改变覆盖与置信度。
      en: Both mechanisms are conditional inferences under particular observation models, without measured detection rates.
        Authority, filters, and state changes constrain acquired views; registrations or service PIDs do not establish current
        execution or effective protection. Command/WMI analytics consume requests only, while native-result analysis needs
        explicit additional instrumentation. Missing approval, identity, handles, or health remains unknown. Actual call chains,
        normal-work baselines, cross-version ABIs, and result-capture comparisons could change coverage and confidence.
