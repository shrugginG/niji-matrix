schema_version: 2.0.0
type: technique
id: NJT-0250
name:
  zh: 系统时间发现
  en: System Time Discovery
summary:
  zh: 读取已访问环境中的系统日期、时间、时区或运行时长，为后继行动取得时间事实，并可借用原生诊断和管理脚本的可见外观降低调查意图的可区分性。
  en: Read system date, time, time-zone settings, or uptime in an accessed environment to inform later actions, potentially
    borrowing visible native diagnostics and administrative scripts to reduce the distinguishability of inquiry purpose.
aliases: []
classification:
  tactic_refs:
  - TA0007
  origin:
    kind: attack-retained
    source_attack_id: T1124
    source_attack_version: '19.1'
  decision_ref: DEC-TA0007-T1124
definition_and_concept:
  paragraphs:
  - zh: 系统时间发现是攻击者在获得执行或相应管理访问后，取得本地或远端系统的日期时间、时区配置、运行时长或有明确定义的时间源读数的环境测绘行为。其直接成果是某个系统或查询来源在特定时点报告的时间事实，供后续行动对齐或选择操作条件；不以修改时钟、使线程等待或登记调度任务为完成条件。
    en: System Time Discovery acquires local or remote system date-time, time-zone configuration, uptime, or a defined time-source
      reading after execution or relevant management access. Its direct result is a temporal fact reported by a particular
      system or queried source at a particular point, useful for aligning later actions or selecting operating conditions.
      Completion does not require clock modification, thread waiting, or task registration.
  - zh: 读数含义由接口和来源共同决定。GetSystemTime 取得 UTC 日历字段，GetTickCount 返回有位宽限制的开机后毫秒计数；Linux 的 CLOCK_REALTIME 与 CLOCK_MONOTONIC 也不共享可互换的时间语义。性能计数或
      CPU 周期只有在明确用于取得环境时间事实且接口定义、频率和测量边界明确时才提供时间证据，不能直接当作日历或设备年龄。工具、数据格式和平台是取得路径，不是技术定义。
    en: Interface and source jointly determine a reading's meaning. GetSystemTime returns UTC calendar fields, whereas GetTickCount
      returns a width-limited millisecond count since startup; Linux CLOCK_REALTIME and CLOCK_MONOTONIC likewise have different
      semantics. Performance counts or CPU cycles provide this technique’s timing evidence only when explicitly consumed for
      an environmental temporal fact with defined interfaces, frequencies, and measurement boundaries, and cannot directly
      become calendar time or device age. Utilities, formats, and platforms are acquisition paths rather than the definition.
stealth_characteristics:
  paragraphs:
  - zh: 系统时间发现的部分实施选择已有时间诊断和管理脚本表面。联合公告记录 Volt Typhoon 的 net time /dom 请求，以及 logins.ps1 将 Get-Date 当前读数用于回溯一天的登录报告边界；这些接口与正常支持、日期处理或登录审计具有相同的局部命令和表达式外观。仅按系统工具或常见管理脚本形状分类的观察者难以区分未经授权的调查。完整内容、发起者、参数和真实工作授权仍可恢复差异，不能仅由正常
      API 存在认定伪装。
    en: Some implementations select existing temporal diagnostics and administrative-script surfaces. The joint advisory records
      Volt Typhoon net time /dom requests and logins.ps1 consuming a current Get-Date reading as a one-day login-report boundary.
      Those interfaces share local command and expression appearance with ordinary support, date processing, or login auditing.
      An observer classifying only system utilities or common administrative-script shapes has difficulty distinguishing unauthorized
      inquiry. Full content, initiator, parameters, and real work authorization retain distinguishing evidence; an ordinary
      API alone does not establish disguise.
  - zh: 残余痕迹因路径不同而改变。外部时间工具可留下命令行，已启用的脚本审计可留下表达式，远端查询可能留下目标和会话；原进程内读取通常不产生独立查询进程。Linux 的 libc 还可能经 vDSO 完成读数，使仅观察系统调用的记录缺失该次读取。这些是具体覆盖限制，不能把无进程或无
      syscall 事件当成没有调查，也不能倒推出攻击者专门设计了规避。
    en: 'Residue varies with the path. External utilities can leave command lines, enabled script auditing can retain expressions,
      and remote inquiries may leave targets and sessions; in-process reads generally do not create a separate query process.
      Linux libc may also obtain readings through the vDSO, leaving a syscall-only observer without that read. These are specific
      coverage limits: absence of a process or syscall event proves neither absence of inquiry nor deliberate evasion design.'
  - zh: 上报值可以经过格式化，观察到的文本不一定保留原始设置。DazzleSpy 将取得的日期时间转换为 Asia/Shanghai 后上报，证明显示约定由程序选择，而非受害设备必处于该时区。远端时间还受来源准确性、往返时延、缓存和采集顺序影响。缺少返回采集时只确认请求，不能由命令启动、成功退出或网络响应推定具体时间已被取得。
    en: Reported values may be formatted, so observed text need not preserve original settings. DazzleSpy converts acquired
      date-time to Asia/Shanghai for reporting, showing a program-selected display convention rather than proving that the
      victim uses that zone. Remote time additionally depends on source accuracy, round-trip latency, caching, and acquisition
      order. Without result capture, confirm only a request rather than inferring a particular acquired time from process
      start, successful exit, or network response.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对当前或远端日期时间、时区配置及开机后运行时长的直接读取，以及为解释这些读数而取得的时间源信息。明确区分命令发出、API 返回、结果解析及后继使用；旧日志中的时间戳不自动代表当前时钟，格式化任意给定日期也不代表读取当前日期。读取的系统、接口、用户或会话、原始类型与采集时间共同限定成果。
    en: Include direct reads of current or remote date-time, time-zone configuration, and uptime, together with time-source
      information needed to interpret them. Distinguish command submission, API return, parsing, and later use. Historical
      log timestamps do not automatically describe the current clock, and formatting a supplied date does not establish current-date
      acquisition. The system, interface, user or session, raw type, and acquisition time jointly bound the result.
  - zh: 时区可作为位置推断的输入，但只有明确以地域为目标时才形成 NJT-0245 的位置知识链；显示格式、偏移和地区名称均不能证明物理位置。普通系统属性属于系统信息发现，文件时间属性属于相应文件事实，运行时长与计数不等同于虚拟机清单。合法时间同步、性能基准、应用超时和支持排障是重要反例，单次调用或调用频率不能独立确定恶意。
    en: A time zone can supply geographical inference, but NJT-0245's location-knowledge chain requires that geographical
      purpose; display formats, offsets, and regional names do not prove physical location. General system attributes belong
      to System Information Discovery, file-time attributes to the relevant file facts, and uptime or counts are not VM inventory.
      Legitimate synchronization, benchmarking, application timeouts, and support troubleshooting are important counterexamples;
      one call or its frequency cannot independently establish maliciousness.
  - zh: 单纯读取不属于 NJT-0122-003 的时间真实性校验；后者还要求分析环境判断和可证的后继差分。纯等待或消耗观察时间归 NJT-0107，正向目标条件护栏归 NJT-0109，专门调试器判断归 NJT-0106。设置时钟、重同步、改写文件时间或建立定时执行须另证对应动作；同一条
      time 或 date 命令可兼有读取与修改语义，不能只按名称分类。
    en: Reading alone is not NJT-0122-003 Temporal Realism Verification, which additionally requires an analysis-environment
      decision and an evidenced successor differential. Mere waiting or consumption of observation time belongs to NJT-0107,
      positive target-condition guardrails to NJT-0109, and dedicated debugger judgment to NJT-0106. Setting clocks, resynchronizing,
      changing file timestamps, or scheduling execution requires evidence of the corresponding action. A time or date command
      can combine read and modification semantics, so its name is insufficient.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 植入在初始化或主机画像任务中可取得当前日期时间，再同其他环境事实一起准备后继通信或操作。NerbianRAT 的 Linux 初始化和 DazzleSpy 的 info 能力展示了这种取得路径，但公开研究没有给出每个受害会话的实际读数，也不证明某次后继行动由哪一个读数决定。样本实现与现场逐次取得须分开记录。
      en: An implant can obtain current date-time during initialization or host profiling before preparing later communication
        or operations with other environment facts. Linux NerbianRAT initialization and DazzleSpy's info capability illustrate
        this path, but public reporting does not disclose actual readings for each victim session or establish which reading
        determined a later action. Sample implementation and per-session field acquisition remain distinct.
    - zh: 已有管理访问的操作者还可检查远端系统或时间服务，了解其报告的时钟、来源或偏移；网络设备与 ESXi 的管理命令也具有固定基线纳入的时间读取面。调查结果可服务于后续操作对齐，但不保证来源可信、终端已同步或跨主机读数可直接比较。接口权限、查询开销和平台版本限制了可得信息。
      en: An operator with management access may examine a remote system or time service for its reported clock, source, or
        offset; network-device and ESXi management commands also expose time-reading surfaces within the fixed baseline. Results
        can support later alignment without guaranteeing a trusted source, synchronized endpoint, or directly comparable cross-host
        readings. Permissions, query cost, and platform version constrain available information.
    - zh: 管理会话中的时间读取还可成为另一个调查任务的明确输入。联合公告的 logins.ps1 使用 Get-Date 并回退一天，为后续登录事件读取设定时间范围；这里的直接时间事实输入、后续账号或日志读取和活动整体隐蔽性是不同结论。该脚本内容证明程序会怎样取得并消费时间，不公开每次实际读数或查询结果，也不证明它被放行的具体检测器。
      en: A temporal read within a management session can be an explicit input to another inquiry. The joint advisory logins.ps1
        uses Get-Date and subtracts one day to bound later login-event reads. The temporal input, subsequent account or log
        reading, and campaign-wide stealth are separate conclusions. Script content establishes the acquisition-and-consumption
        implementation without disclosing each actual reading, query result, or particular detector that allowed it.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够执行读取代码、调用命令或使用相应管理会话，并能够消费实际结果。基础本地时钟通常可由普通应用取得，管理工具和远端诊断则受接口及身份限制；本模型不假设时间读取自动获得改时权限，也不假设可篡改提供方、hypervisor
          或采集端。返回错误、类型不明或来源不可信均会降低读数的操作价值。
        en: The adversary must execute read code, invoke a command, or use the relevant management session and consume an
          actual result. Basic local clocks are generally available to ordinary applications, whereas management tools and
          remote diagnostics depend on interface and identity. This model grants no clock-setting authority merely from reading
          and assumes no ability to alter providers, hypervisors, or collectors. Errors, unknown types, and untrusted sources
          reduce operational value.
      - zh: 借用正常接口外观要求攻击者选择执行入口、表达式或查询目标，却不要求所有读取都经过解释器。原生代码可绕过命令层的可见性，使用不同平台也必须接受计时精度、休眠语义、位宽回绕和源偏差。跨主机测量需要带不确定性的采样边界，不能把应用格式化的日期字符串或原始
          CPU 周期作为统一的可靠时间轴。
        en: Borrowing ordinary interface appearance requires control of an entry point, expression, or query target, without
          requiring every read to use an interpreter. Native code can bypass command-level visibility, but implementations
          still face resolution, suspend semantics, counter-width wrap, and source error. Cross-host measurements require
          uncertainty-bounded sampling, and formatted date strings or raw CPU cycles cannot provide a universal reliable timeline.
    defender_model:
      paragraphs:
      - zh: 防守方可以拥有进程创建与结束、已启用的脚本内容及部分管理会话审计；这些主要保存调用者和请求，通常不保存任意时间 API 的输出。Linux execve 审计不等于每次 libc 或 vDSO 时间读取审计，Sysmon
          也不提供通用时间 getter 返回。结果级调查需要另行部署按 ABI 解码的定制采集，并维护覆盖和丢失状态。
        en: Defenders may have process creation and termination, enabled script content, and some management-session auditing,
          which primarily preserve callers and requests rather than arbitrary time-API output. Linux execve auditing is not
          an audit of every libc or vDSO read, and Sysmon supplies no generic time-getter returns. Result-level investigation
          needs separately deployed ABI-aware collection with coverage and loss state.
      - zh: 归属应连接主机、启动实例、进程生命周期、用户上下文和实际来源；仅以 PID 或用户显示名关联会混淆复用与远端执行。批准排障台账可以解释正常请求，但必须绑定具体主体、脚本或入口、目标和有效期。用于关联的采集时间与程序读取到的时间是两条不同的轴，主机时钟不可信时还须保留采集序号、单调采样或偏差界限，缺少这些信息时保持未决。
        en: Attribution should connect host, boot instance, process lifetime, user context, and actual source; PID or display-name-only
          joins confuse reuse and remote execution. Approved troubleshooting records can explain requests only when bound
          to specific principals, scripts or entries, targets, and validity. Collector event time and the program's returned
          time are different axes. With an untrusted host clock, retain sequence numbers, monotonic sampling, or skew bounds,
          leaving conclusions unresolved where those are absent.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用原生时间诊断和管理脚本外观使恶意读取接近日常支持任务
    en: Borrow native temporal diagnostics and administrative-script appearance so malicious reads resemble routine support
  analysis:
    paragraphs:
    - zh: 可控变量是选择现成时间诊断命令或正常管理式脚本作为取得表面，而不是时间函数的存在。联合公告列出 net time /dom，并公开 logins.ps1 中将 Get-Date 减去一天作为登录历史范围的表达式；官方文档则给出正常远端时间显示和当前日期处理用途。相对于观察者能够识别其专门用途的独立调查程序，这种选择保留原生工具或日常管理表达式的局部特征，使只依赖工具身份或脚本外观的分类难以表达未经授权的时间取得目的。原始参数、完整脚本、调用者和批准任务仍可用于核验。
      en: The controlled variable is selection of an existing temporal diagnostic or administrative-style script as the acquisition
        surface rather than existence of a time function. The joint advisory lists net time /dom and publishes the logins.ps1
        expression subtracting one day from Get-Date for login history, while official documentation establishes legitimate
        remote-time display and current-date processing. Relative to a dedicated inquiry program whose purpose is recognizable
        to an observer, this selection retains local native-tool or administrative-expression features. Utility-identity or
        script-appearance-only classification can consequently fail to distinguish unauthorized time acquisition. Raw parameters,
        the full script, the caller, and approved work remain available for validation.
    - zh: 这一对照限定了观察模型，没有执行替代程序的实验或测量检测率，也未证明每条观察命令的选择动机。原生 getter 同时被正常和恶意程序调用并不单独构成此设计；NerbianRAT 只证明初始化采集，DazzleSpy 的 Asia/Shanghai
        仅证明上报显示选择。机理因此保持中等置信的条件性推断，不扩展为所有本地或远端时间读取的必然属性。
      en: This contrast specifies an observation model without an alternative-program experiment, measured detection rates,
        or established selection motive for every observed command. Native getters used by both benign and malicious programs
        do not alone constitute the design. NerbianRAT establishes initialization acquisition, while DazzleSpy Asia/Shanghai
        establishes a reporting display choice. The mechanism therefore remains a medium-confidence conditional inference
        rather than an inherent property of all local or remote time reads.
  evidence_refs:
  - REF-000025
  - REF-001420
  - REF-001422
  - REF-001418
  confidence: medium
subtechnique_taxonomy:
  coverage: none-justified
  subtechnique_refs: []
  narrative:
    paragraphs:
    - zh: 当前不设立原生子技术。wall clock、时区、运行时长、单调计数和性能计数的区别决定返回值解释与采集方法，却不独立代表稳定的匿迹变量；本地、远端、命令与进程内接口也不能仅按位置或实现名称形成子项。现有样本证明具体时间采集，但不足以把常规计时路径的可见性差异认定为独立的有意匿迹设计。
      en: No native child is established. Wall clock, time zone, uptime, monotonic counts, and performance counts determine
        interpretation and collection methods rather than independently defining stable evasion variables. Local, remote,
        command, and in-process paths likewise cannot become children merely by location or implementation name. Samples establish
        specific acquisition but do not independently establish routine timing-path visibility differences as intentional
        evasion designs.
    - zh: 缓存复用、低频或事件触发读取尚无可隔离的时间采集证据支持其独立防御价值；时区转换是呈现语义而非隐藏输入的证据。依据时间证据判断分析环境、延迟执行或门控后继的变化已有相邻归属，不在本项重新命名。新增分类需要证明攻击者控制了哪一采集变量、相对于什么基线改变痕迹，以及防守方因何必须采用不同观察方法。
      en: Reuse of cached values and sparse or event-triggered reads lack isolated time-acquisition evidence establishing
        independent defensive value. Time-zone conversion describes presentation rather than proving hidden input. Analysis-environment
        decisions, delays, and successor gates already have adjacent ownership and are not renamed here. A new class would
        need to establish the controlled acquisition variable, the trace contrast against a defined baseline, and the reason
        defenders require a different observation method.
