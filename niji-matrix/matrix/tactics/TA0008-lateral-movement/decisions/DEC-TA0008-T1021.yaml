  source_attack_id: T1021
  source_attack_version: '19.1'
  name_en: Remote Services
  name_zh: 远程服务
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 将 T1021 作为横向移动父项，并以 RDP、SMB/管理共享、DCOM、SSH、VNC、WinRM、云服务和云虚拟机直连八个子项展示实现宽度。Microsoft
  和 Mandiant 的现场研究直接记录攻击者使用这些原生服务在已受害网络内连接其他主机。保留“以已可用身份或权限建立新远程服务连接并取得另一目标的可控交互”这一核心；Niji 不继承协议子项，而把范围收窄到正常认证和授权路径接受的新连接、目标会话或动作结果，以及有证据支持的匿迹变量，故建议
  adapt。


  T1210/NJT-0149 由漏洞触发目标控制，T1563/NJT-0151 接管他人已有传输或会话，T1078/NJT-0061 只拥有身份及认证状态，T1072/NJT-0078 拥有部署平台 job 到 agent 的受管执行链，T1570/NJT-0130
  以文件到达为结果。云控制面、容器和 ESXi Guest Operations 命令执行分别由 NJT-0064、NJT-0066 和 NJT-0068 承担。T1021 只在另一系统或资源接受新远程连接并产生可验证交互时完成；协议可达、认证尝试、凭据存在或文件出现均不是替代证据。'
rationale_en: 'Fixed ATT&CK Enterprise 19.1 defines T1021 as a Lateral Movement parent and uses eight children covering RDP,
  SMB or administrative shares, DCOM, SSH, VNC, WinRM, cloud services, and direct cloud-VM connections as implementation breadth.
  Microsoft and Mandiant field research directly records adversaries using native services to reach other systems inside compromised
  networks. Preserve the core of creating a fresh remote-service connection with already usable identity or authority and
  obtaining controllable interaction on another target. Niji does not inherit protocol children and narrows scope to a fresh
  connection accepted through ordinary authentication and authorization, a target session or action outcome, and evidence-supported
  stealth variables; adapt is recommended.


  T1210/NJT-0149 gains target control through a vulnerability, T1563/NJT-0151 takes over another principal''s existing transport
  or session, T1078/NJT-0061 owns identity and authentication state, T1072/NJT-0078 owns the managed job-to-agent execution
  chain, and T1570/NJT-0130 ends at file arrival. Cloud control-plane, container, and ESXi Guest Operations command execution
  belong to NJT-0064, NJT-0066, and NJT-0068. T1021 completes only when another system or resource accepts a fresh remote
  connection and yields verifiable interaction. Reachability, an authentication attempt, credential possession, or file presence
  is not substitute evidence.'
scope_notes_zh: 要求已可用主体或权限通过正常认证/授权路径建立新的内部远程连接，并连接目标会话或动作。协议、端口、厂商及 ATT&CK 子项不构成 NJS；漏洞利用、旧会话接管、部署 job、云命令和文件到达分别由相邻对象承担。
scope_notes_en: Require an already usable principal or authority to create a fresh internal remote connection through ordinary
  authentication and authorization and join it to a destination session or action. Protocol, port, vendor, and ATT&CK child
  do not define NJS; exploitation, takeover of an old session, deployment jobs, cloud commands, and file arrival remain adjacent.
