tactic_ref: TA0008
candidate: {source_type: attack, source_attack_id: T1072, source_attack_version: "19.1", name_en: Software Deployment Tools, name_zh: 软件部署工具}
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 同时将 T1072 映射至执行和横向移动。APT32 的 ePO、AvosLocker 的 PDQ Deploy 与 Medusa 的 BigFix/PDQ 案例证明攻击者可从一个被控管理面让其他受管主机接收恶意任务并行动。TA0008 的结果门是另一主机实际产生攻击者可控动作；它与 TA0002 NJT-0078 的 job→agent→首次执行是同一事务，故保留本战术的独立准入决策，并跨战术复用既有 NJT、两项原生 NJS 及其专用防御，不复制对象。
rationale_en: Enterprise ATT&CK 19.1 maps T1072 to both Execution and Lateral Movement. APT32 ePO, AvosLocker PDQ Deploy, and Medusa BigFix or PDQ incidents show that an adversary can cause other managed hosts to accept and carry out malicious jobs from one controlled management plane. The TA0008 outcome gate is attacker-controlled action on another host. That outcome is the same job-to-agent-to-first-execution transaction already represented by TA0002 NJT-0078, so this tactic retains an independent admission decision and reuses the existing NJT, its two native NJS, and its targeted defenses across tactics without duplicating them.
scope_notes_zh: 必须能把恶意部署任务、与原控制点不同的受管目标及目标 agent 的实际动作连接起来。只登录管理台、创建未下发任务、同机执行或仅复制文件不足以成立 TA0008；单纯工具到达归 T1570 的独立研究范围。产品名称、包格式和 agent 平台不形成新 Niji 子项。
scope_notes_en: A malicious deployment job must be linked to a managed target distinct from the originating control point and to an actual action by its agent. Console login, an undispatched job, same-host execution, or file copy alone does not establish TA0008; independent file arrival belongs to the T1570 research scope. Product names, package formats, and agent platforms do not create new Niji children.
