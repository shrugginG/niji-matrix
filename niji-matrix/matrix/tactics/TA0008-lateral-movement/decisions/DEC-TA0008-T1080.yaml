candidate:
  source_type: attack
  source_attack_id: T1080
  source_attack_version: '19.1'
  name_en: Taint Shared Content
  name_zh: 污染共享内容
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 将 T1080 定义为向共享盘或内部代码仓库中的内容加入恶意程序、脚本或利用代码，使另一系统的使用者打开后可能运行攻击者代码。ESET 对 Gamaredon 既有文档宏/模板注入和
  InvisiMole 对原有文件的木马化替换提供直接行为证据，DirSharePivot 给出目录入口替身的技术实证，因此保留共享内容到内部消费者这一父行为。Niji 需要把准入收紧为攻击者控制共享对象的内容或导航语义，并能说明另一内部消费者的读取/打开如何通向执行或可控状态；单纯把文件放到共享盘、正常协作修改、以及没有消费者证据的存储异常不能被称为已完成横向移动。


  共享对象原有路径、文件名或用户预期工作流可使一次恶意改写看起来像日常协作，且写入与目标执行落在不同主机和时间。这个观察差异是从事件机制和日志语义得出的条件性推断，不等于所有公开案例都陈述了匿迹意图。尤其 ESET 明言 Gamaredon
  的行动重快速扩散而不重低调，故该案例只证明注入、还原文件位置与潜在后续打开，不能用来证明行动者意在隐蔽。父级建议 adapt 而非 retain，是为了把 ATT&CK 的一般载荷投放与 Niji 的可控匿迹变量、消费者结果门明确分开。'
rationale_en: 'ATT&CK Enterprise 19.1 defines T1080 as adding malicious programs, scripts, or exploit code to content in shared
  drives or internal code repositories so a user on another system may run attacker code when opening it. ESET directly documents
  Gamaredon''s injection into existing documents and InvisiMole''s trojanized replacement of original files, while DirSharePivot
  technically demonstrates a substitute directory entry. These sources support the shared-content-to-internal-consumer parent
  behavior. Niji should narrow admission to adversary control of shared-object content or navigation semantics with a defensible
  path from another internal consumer''s read or open to execution or controllable state. Merely placing a file on a share,
  ordinary collaborative editing, or storage anomalies without a consumer cannot be called completed lateral movement.


  Existing paths, filenames, and expected user workflows can make a malicious change resemble routine collaboration, while
  the write and destination execution occur on different hosts and at different times. This observation effect is a conditional
  inference from event mechanics and audit semantics, not a claim that every reported actor intended concealment. ESET explicitly
  says Gamaredon prioritized rapid spread over staying under the radar, so its case proves injection, restoration to the original
  document location, and a possible later open, not stealth intent. Adapt is preferable to retain because the general ATT&CK
  payload-placement scope must be separated from Niji''s controlled stealth variable and consumer-outcome gate.'
scope_notes_zh: 只在受控共享对象或导航绑定发生恶意变化、另一内部消费者实际触发并出现可控结果时成立；单纯投递归 T1570，内部主动消息归 T1534。Office、LNK 或代码仓库是媒介而非 NJS。
scope_notes_en: Require a malicious change to a controlled shared object or navigation binding, actual triggering by another
  internal consumer, and a controllable outcome. Mere delivery belongs to T1570 and proactively sent internal messages to
  T1534. Office, LNK, and code repositories are media rather than NJS.
