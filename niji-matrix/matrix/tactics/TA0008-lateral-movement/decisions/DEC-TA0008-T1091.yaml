candidate:
  source_type: attack
  source_attack_id: T1091
  source_attack_version: '19.1'
  name_en: Replication Through Removable Media
  name_zh: 通过可移动介质复制
decision: retain
rationale_zh: ATT&CK Enterprise 19.1 将 T1091 同时归于初始访问和横向移动，其共同父行为是使恶意内容随可移动介质到达另一主机并在该主机触发。ESET 对 USBStealer 的逆向重构明确展示已受控
  A 主机将内容放入介质、隔离 B 主机随后安装的链条；Microsoft 对 Raspberry Robin 的研究也明确指出播种的 LNK 会感染其他主机。因此保留 T1091 的父行为，并在本战术复用 NJT-0058；但既有技术以“首个立足点”为终点，必须改为可同时容纳首次进入和后续内部主机控制的中性边界。
rationale_en: Enterprise ATT&CK 19.1 maps T1091 to both Initial Access and Lateral Movement. The shared parent behavior is
  carriage of malicious content on removable media to another host and its triggering there. ESET's reverse engineering of
  USBStealer reconstructs a controlled host A seeding media and an isolated host B subsequently installing the payload; Microsoft
  also states that Raspberry Robin LNK files seeded onto drives infect other hosts. Retain the T1091 parent behavior and reuse
  NJT-0058 in this tactic. Its current first-foothold endpoint must be rewritten as a neutral boundary covering both first
  entry and subsequent control of an internal host.
scope_notes_zh: 复用 NJT-0058 时，TA0008 须有已控内部 A 播种同一可移动介质、不同内部 B 接入并实际产生攻击者动作；只有 A 写入、B 挂载或首次从外部带入介质不够。两项 NJS 按伪装入口与自动播种变量沿用，不导入
  ATT&CK 子项。
scope_notes_en: When reusing NJT-0058, TA0008 requires controlled internal A to seed the same removable medium, distinct internal
  B to insert it, and an actual attacker action on B. A write, B mount, or first delivery from outside alone is insufficient.
  The two NJS remain partitioned by disguised entry and automatic seeding, not ATT&CK children.
