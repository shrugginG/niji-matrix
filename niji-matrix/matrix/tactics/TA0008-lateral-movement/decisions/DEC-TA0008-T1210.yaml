  source_attack_version: '19.1'
  name_en: Exploitation of Remote Services
  name_zh: 利用远程服务
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 的 T1210 将已进入网络后的远程服务漏洞利用列入横向移动，父项没有子项。ESET 一手白皮书记录 InvisiMole 使用 BlueKeep 与 EternalBlue
  在内网部署载荷，并在某目标网络看到 DoublePulsar、SMB 会话后数秒执行 loader，但未取得 EternalBlue 利用代码；Microsoft 对 NotPetya 的网络与样本分析将凭据、PsExec/WMIC 和 SMB
  漏洞后备路径分开；CISA 的授权医疗行业演练则直接记录 EternalBlue 利用后在另一台服务器取得本地 SYSTEM shell。这些来源足以保留漏洞触发跨主机受控结果的父行为，但 Niji 需要把尝试、可利用状态、目标上的实际受控结果与匿迹观察差异分级，因此建议
  adapt。


  匿迹特性是有条件的观察差异：当防守方仅按合法远程登录或管理调用串联横向活动时，未认证或未经过常规授权流程的漏洞触发可能使源主机、目标服务状态及目标后继进程之间缺少预期的用户会话边；目标服务仍可留下异常请求、故障、利用阻断和后继进程。Microsoft
  的 MS17-010 公告确认有关 SMBv1 请求在多数情形可由未认证攻击者发送，而 4624 文档说明该事件只描述成功登录且字段依协议变化。把两者连接为检测盲区是经来源支持的分析推论，不是各事件均已实测“无登录记录”，也不证明每次利用出于主动匿迹目的。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 T1210 parent places post-entry exploitation of a remote service under Lateral
  Movement and has no child techniques. ESET''s primary white paper records InvisiMole using BlueKeep and EternalBlue to deploy
  payloads internally and finding DoublePulsar and an SMB session followed seconds later by a loader in one target network,
  while explicitly lacking the EternalBlue exploit code. Microsoft''s NotPetya network and sample analyses distinguish credential
  use, PsExec or WMIC, and a fallback SMB exploit route. CISA''s authorized healthcare assessment directly records an EternalBlue
  exploit yielding a local SYSTEM shell on another server. These sources support the parent behavior of crossing to a controlled
  target through a vulnerable service, while Niji must separate attempts, exposure, an actual controlled target outcome, and
  a conditional stealth observation difference; adapt is recommended.


  The stealth property is conditional on the defender''s observation model. A defender that reconstructs lateral movement
  only from valid remote logons or management operations may miss the link among an originating host, a vulnerable target
  service, and a target successor process when an exploit triggers without ordinary authorization; anomalous requests, faults,
  blocks, and successor activity can remain. Microsoft''s MS17-010 bulletin says that in most circumstances an unauthenticated
  actor can submit relevant SMBv1 requests, while its 4624 documentation defines the event as a successful logon and notes
  protocol-dependent fields. Connecting these facts into a possible detection gap is an evidence-based inference, not an observed
  claim that every attack leaves no logon record or that every exploit was chosen to hide.'
scope_notes_zh: 须有内网来源对另一系统的服务漏洞触发及可证目标受控结果；开放端口、脆弱版本、扫描、利用尝试或服务崩溃分别只是条件或线索。与 T1021 新会话、T1563 既有会话接管及 T1570 文件到达分开。
scope_notes_en: Require an internal source, exploitation of a remote service on another system, and a verifiable controlled
  target outcome. An open port, vulnerable version, scan, exploit attempt, or crash is only a prerequisite or signal. Distinguish
  T1021 new sessions, T1563 takeover of existing sessions, and T1570 file arrival.
