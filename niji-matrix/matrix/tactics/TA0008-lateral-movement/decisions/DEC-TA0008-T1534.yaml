id: DEC-TA0008-T1534
tactic_ref: TA0008
candidate:
  source_type: attack
  source_attack_id: T1534
  source_attack_version: '19.1'
  name_en: Internal Spearphishing
  name_zh: 内部定向钓鱼
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 将 T1534 列为横向移动父项，描述攻击者在已有受害账户或系统后借内部身份向其他用户实施定向诱导。Microsoft 2026 年调查和 Proofpoint
  2026 年现场案例均给出内部发件、收件者动作及后续其他账户失陷的链条，因此保留该行为核心；Niji 范围收窄到已有立足点向另一内部主体传播的匿迹路径，并把消息投递、收件者动作、第二主体失陷分别标注，故建议 adapt。


  两个事件都直接支持真实内部发件身份改变收件者看到的来源特征，但不证明所有内部消息都具有匿迹意图，也不证明异常发送后必然横向成功。Proofpoint 案例进一步直接支持按活动主题设置邮箱规则，使告警或质疑回复从原用户收件箱消失；该行为具有可控的防守观察差异，但稳定变量与既有
  NJS-0111-001 重合，建议在本项只作父级共现机理。Microsoft 案例只证明攻击者利用近期会话选择收件人，不证明其向既有线程注入消息，不能据此复制 TA0001 的线程寄生子项。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 baseline lists T1534 under Lateral Movement and describes targeted inducement
  of other users through an internal identity after an account or system is already compromised. Microsoft and Proofpoint''s
  2026 investigations each document internal sending, recipient action, and subsequent compromise of another account. Preserve
  that behavioral core, but adapt the Niji scope to stealth in propagation from an existing foothold to another internal principal,
  recording message delivery, recipient action, and second-principal compromise as separate gates.


  Both cases directly support a genuine internal sender identity changing the provenance features visible to recipients, but
  neither proves that every internal message has a stealth purpose or that anomalous sending inevitably succeeds. Proofpoint
  additionally documents a campaign-subject mailbox rule that hid warning or questioning replies from the legitimate sender''s
  inbox, a controllable observation differential already covered by NJS-0111-001, recommended here only as a co-occurring
  parent mechanism. Microsoft''s case shows selection of recipients from recent conversations, not injection into those threads;
  it cannot justify copying the Initial Access thread-parasitic child.'
scope_notes_zh: 须有受陷内部发件主体、对另一内部主体的行动诱导、收件者动作及第二账户或主机结果；只发信为尝试。共享对象污染归 T1080，原始外部钓鱼归 TA0001。按主题归档反馈的稳定变量已由 NJS-0111-001 拥有，不重复建子项。
scope_notes_en: Require a compromised internal sender, action-bearing lure to another internal principal, recipient action,
  and a second account or host outcome; sending alone is an attempt. Shared-object taint belongs to T1080 and original external
  phishing to TA0001. Subject-matched feedback archiving is already owned by NJS-0111-001 and is not duplicated as a child.
