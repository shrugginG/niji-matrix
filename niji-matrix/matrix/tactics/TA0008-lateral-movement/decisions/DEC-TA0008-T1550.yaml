candidate:
  source_type: attack
  source_attack_id: T1550
  source_attack_version: '19.1'
  name_en: Use Alternate Authentication Material
  name_zh: 使用替代认证材料
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 的 T1550 以攻击者使用系统先前生成并仍可接受的 hash、ticket、application token 或 Web session cookie 代替原始秘密和常规交互因素，从而认证到另一内部系统或资源。UNC6692
  在取得高权账户 hash 后以 Pass-the-Hash 横向进入域控制器，Microsoft 和 GTIG 分别记录已完成 MFA 的 Cookie/token 重放及 UNC6395 使用被盗 OAuth token 访问客户资源，证明父行为跨本地与云环境实际存在。因此候选应准入，但
  Niji 需把范围改写为材料呈现、验证及其横向结果，不能把材料取得、伪造、认证流程修改或一般身份接受合并成一个不可审计事件。


  父级完成链分为“已存在材料进入攻击者控制”“材料被提交给权威、验证器或依赖方”“目标接受并形成新的安全上下文或续用既有状态”“另一内部系统、租户或资源出现攻击者结果”。T1550 拥有第二阶段及其材料特定验证关系，并以接受和横向结果作为完成门；NJT-0178/T1528
  和 T1539 拥有取得，NJT-0166/T1606 与 T1558 拥有构造或伪造，T1556 拥有验证过程修改，NJT-0061 拥有身份/会话被接受后的通用使用，NJT-0151 拥有同一既有会话控制者变化。各阶段可以共现，但后一阶段不能替代前一阶段证据。'
rationale_en: 'ATT&CK Enterprise 19.1 anchors T1550 in an adversary using a previously generated and still acceptable hash,
  ticket, application token, or web session cookie in place of the original secret and ordinary interactive factors to authenticate
  to another internal system or resource. UNC6692 used Pass-the-Hash to enter domain controllers laterally after obtaining
  elevated-account hashes; Microsoft documents replay of MFA-completed cookies and tokens; and GTIG observed UNC6395 using
  compromised OAuth tokens against customer resources. These events establish the behavior across on-premises and cloud environments.
  The candidate should be admitted, but Niji should adapt it into a material-presentation, validation, and lateral-result
  object rather than combining acquisition, forgery, authentication-process modification, and general identity acceptance
  into one unauditable event.


  The parent chain separates existing material entering adversary control, presentation to an authority, verifier, or relying
  party, acceptance that creates a fresh security context or continues established state, and an adversary result on another
  internal system, tenant, or resource. T1550 owns the second stage and its material-specific verification relationship, with
  acceptance and a lateral result as completion gates. NJT-0178 or T1528 and T1539 own acquisition; NJT-0166 or T1606 and
  T1558 own construction or forgery; T1556 owns modification of the verification process; NJT-0061 owns general identity or
  session use after acceptance; and NJT-0151 owns a changed controller of the same existing session. These stages can coexist,
  but evidence of a later stage cannot substitute for an earlier one.'
scope_notes_zh: 以已生成材料的呈现、既有规则下的接受和另一内部资源结果为父级；仅当前验证器产生新上下文或新证明形成原生子项，既有 Cookie/token 会话续用归相邻对象。
scope_notes_en: The parent owns presentation of generated material, acceptance under existing rules, and an outcome on another
  internal resource. Only current-verifier creation of fresh context or proof forms a native child; established cookie or
  token session continuation remains adjacent.
