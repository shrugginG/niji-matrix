candidate:
  source_type: attack
  source_attack_id: T1563
  source_attack_version: '19.1'
  name_en: Remote Service Session Hijacking
  name_zh: 远程服务会话劫持
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 的 T1563 以控制他人预先建立的远程服务会话推动横向移动。Linux 内核 Yama 文档明确确认进程附着可造成 SSH 会话劫持，OpenSSH 规范可证明既有认证传输能够再承载会话通道，Microsoft
  tscon 文档确认有权限的主体可将既有远程桌面会话连接到另一会话。因此保留父行为，但将 Niji 准入改写为攻击者实际控制先前由别人建立的认证传输、交互会话或其附着关系，并在另一内部系统或信任主体产生可验证的控制。仅找到可访问代理、会话
  ID 或悬置桌面是前提，不是横向成功。


  Adapt 的必要性是 ATT&CK SSH 叙述将代理套接字误用也置于同一子页；代理为新 SSH 连接签名与接管已认证 SSH 传输不同。Matrix.org 2019 年事件中，陷阱利用转发代理将攻击者公钥植入其他主机，这直接证明凭据代理滥用及后续新连接能力，却没有证明攻击者附着到原用户已经打开的
  PTY 或沿原 SSH TCP 连接新增通道。Mandiant 对 UNC3886 的“SSH connection hijacking”也指向拦截新来的 SSH 流以窃取凭据，不可据名称移入本技术。严格的连接/附着证据门使 T1563 与
  T1021、T1550 和本地权限提升保持清楚边界。'
rationale_en: 'T1563 in the fixed ATT&CK Enterprise 19.1 baseline concerns taking control of another principal''s preexisting
  remote-service session to move laterally. Linux Yama documentation explicitly recognizes SSH session hijacking through process
  attachment; OpenSSH specifications show that an established authenticated transport can carry another session channel; and
  Microsoft''s tscon documentation confirms that an authorized principal can connect an existing remote desktop session to
  a different session. The parent behavior is retained, but Niji admission should require actual adversary control of a transport,
  interactive session, or attachment previously established by someone else, followed by verifiable control of another internal
  system or trust principal. Discovering an accessible agent, a session ID, or a disconnected desktop alone is a prerequisite,
  not a lateral result.


  Adapt is necessary because ATT&CK''s SSH discussion also includes agent-socket misuse; asking an agent to sign for a new
  SSH connection differs from taking over an already authenticated transport. In the 2019 Matrix.org incident, a trap abused
  a forwarded agent to install the attacker''s public key on other hosts. That directly supports credential-agent misuse and
  later new-connection capability, but does not show attachment to the user''s existing PTY or a new channel on the original
  SSH TCP connection. Mandiant''s description of UNC3886 "SSH connection hijacking" likewise concerns diverting incoming new
  SSH traffic to collect credentials and cannot be included on the strength of its label. A strict connection and attachment
  evidence gate keeps T1563 distinct from T1021, T1550, and local privilege escalation.'
scope_notes_zh: 须指出既有认证传输或交互会话、非原所有者的附着动作与目标结果；复用 agent 凭据后新建连接属于 T1550 或 T1021。T1563.001/.002 仅作实现宽度；NJS 依通道增附或控制端重绑定划分。
scope_notes_en: Identify an existing authenticated transport or interactive session, attachment by a controller other than
  its original owner, and a target outcome. Creating a new connection with reused agent credentials belongs to T1550 or T1021.
  T1563.001 and .002 are implementation breadth only; NJS separate channel addition from controller rebinding.
