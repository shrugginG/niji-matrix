candidate: {source_type: attack, source_attack_id: T1570, source_attack_version: "19.1", name_en: Lateral Tool Transfer, name_zh: 横向工具传输}
decision: adapt
rationale_zh: 固定基线 T1570 和 Mandiant 事件证明已受害环境中的工具可经 SMB 从一台主机到达另一台主机，且这一到达事件能与会话建立及后来运行分开确认。Niji 只纳入攻击者有意选择内部来源、共享关系或分发范围，使局部文件到达更像正常管理复制或使共同来源更难被单点观察恢复的实例；这种匿迹效果是有条件的防守观察推断，案例没有直接记录隐蔽目的，故保持中等置信度。普通授权复制不因使用 SMB 就准入。
rationale_en: Fixed-baseline T1570 and Mandiant incidents establish that a tool can arrive from one host to another over SMB within a compromised environment, and that arrival can be verified separately from session establishment and later execution. Niji admits only instances where the adversary deliberately chooses an internal source, share relationship, or distribution scope that makes local arrival resemble normal administrative copying or makes common provenance harder to recover from a single-host view. This stealth effect is a conditional defender-observation inference rather than an intent directly reported in the cases, so confidence remains medium. Authorized copying does not qualify merely because it uses SMB.
scope_notes_zh: 正式对象以已受害环境内载荷跨主机实际到达、攻击者可控路径和可论证的痕迹变化为门槛。企业部署 job→agent→首次执行归 T1072 复用对象；远程服务会话归 T1021；外部首次下载、共享枚举和随后执行不能代替到达证据。中继、同步与分时子项证据不足而延期，不导入 ATT&CK 子项。
scope_notes_en: The formal object requires actual cross-host arrival inside a compromised environment, an attacker-controlled route, and a defensible trace change. Enterprise deployment job-to-agent-to-first-execution belongs to the reused T1072 object, remote-service sessions to T1021, and external first download, share enumeration, or later execution cannot substitute for arrival evidence. Relay, synchronization, and timing child hypotheses remain deferred for insufficient evidence; no ATT&CK child is imported.
