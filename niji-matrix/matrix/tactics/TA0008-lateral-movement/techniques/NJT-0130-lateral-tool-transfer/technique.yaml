schema_version: 2.0.0
type: technique
id: NJT-0130
name:
  zh: 工具或文件传输到达
  en: Tool or File Transfer Arrival
summary:
  zh: 攻击者使工具或操作文件从外部来源或另一受害主机实际到达已受控目标，并可能借常见传输客户端、来源或路径降低到达来源的可区分性。
  en: An adversary causes a tool or operational file to actually arrive on an already controlled destination from an
    outside source or another victim host, potentially reducing delivery-provenance distinctiveness through a familiar
    transfer client, source, or path.
aliases:
- Ingress Tool Transfer
- Lateral Tool Transfer
- T1105
- T1570
classification:
  tactic_refs:
  - TA0008
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1570
    source_attack_version: '19.1'
  decision_ref: DEC-TA0008-T1570
definition_and_concept:
  paragraphs:
  - zh: 工具或文件传输到达是攻击者在已取得目标控制之后，使扫描器、脚本、模块、载荷、配置或其他操作文件从另一系统实际写入该目标的行为。来源可以是攻击者外部基础设施、既有 C2、合法服务资源或受害环境内另一主机。技术完成点是目标上独立文件对象的可验证创建或修改，必须能指认来源关系、目标设备和内容、大小、摘要或其他等价谱系；网络请求、传输命令、远程会话和后继执行都不能单独替代到达。
    en: Tool or File Transfer Arrival occurs after the adversary controls a destination and causes a scanner, script,
      module, payload, configuration, or other operational file to be written there from another system. The source may
      be outside attacker infrastructure, an existing C2 relationship, a legitimate service resource, or another host
      inside the victim environment. Completion is verifiable creation or modification of an independent file object
      on the destination, with an identifiable source relationship, destination device, and content, size, digest, or
      equivalent lineage. A network request, transfer command, remote session, or later execution does not independently
      substitute for arrival.
  - zh: 在 Niji 中，文件到达是行为锚点，匿迹结论还要求攻击者选择的客户端、来源、通道或落点改变防守方对投递来源或授权性的判断。内部分支可让目标只见熟悉共享和内部源；外部分支可经 BITS、curl、certutil、浏览器、同步客户端、包管理器或既有控制会话产生普通下载/缓存写入外观。工具与协议是实现，不形成子项；若来源和写入均明显异常，仍可记录父行为，但不能夸大匿迹效果。
    en: Within Niji, file arrival anchors the behavior, while a stealth conclusion additionally requires an attacker-chosen
      client, source, channel, or destination placement to change defender judgment of delivery provenance or authorization.
      The internal branch can leave a destination seeing a familiar share and internal source. The external branch can
      create ordinary download or cache-write appearance through BITS, curl, certutil, a browser, a sync client, a package
      manager, or an existing control session. Tools and protocols are implementations and do not define children. If
      source and write are conspicuously anomalous, the parent behavior still applies but its stealth effect must not
      be overstated.
stealth_characteristics:
  paragraphs:
  - zh: 共同的匿迹属性是目标侧文件创建可继承传输主体的正常角色，而不直接显示最初操作者。内部复制呈现为管理员/共享写入；外部下载可由签名系统工具、后台传输服务、常见浏览器或获准更新路径写入临时、缓存或应用目录。单点若只按 writer
      签名、内部地址、知名域或正常下载目录判断，可能将恶意到达解释为运维或软件获取。该效果需要实际角色与环境基线验证，不能由工具签名或端口自动推出。
    en: The shared stealth property is that destination file creation can inherit the ordinary role of a transfer principal
      without directly exposing the original operator. Internal copying looks like administration or share writing. External
      retrieval may be written by a signed system utility, background-transfer service, common browser, or approved update
      path into temporary, cache, or application directories. A local view using only writer signature, internal address,
      known domain, or normal download directory can interpret malicious arrival as operations or software acquisition.
      This effect requires real role and environmental baseline validation and cannot be inferred from tool signature
      or port alone.
  - zh: 到达仍留下可连接的残迹。外部分支可从端点 network event、代理/HTTP response、Zeek uid/fuid、FileOriginUrl/IP/Referrer、initiating process、文件大小与摘要恢复；内部分支保留共享请求、登录、路径、摘要和源—目标关系。后继执行、模块加载或安全产品命中提高优先级但不证明先前未观测传输。TLS、内存直送、内容分块、缓存/同步代写和缺失摘要会降低谱系置信。
    en: Arrival still leaves joinable residue. The external branch can be reconstructed from endpoint network events,
      proxy or HTTP responses, Zeek uid and fuid, FileOriginUrl, IP, and Referrer, initiating process, file size, and
      digest. The internal branch retains share requests, logons, paths, digests, and source-to-destination relationships.
      Later execution, module load, or security-product detection raises priority but does not prove an earlier unobserved
      transfer. TLS, direct memory streaming, content chunking, cache or sync delegated writes, and missing digests lower
      lineage confidence.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入外部来源到已受控目标和受害环境内跨主机的独立文件实际到达；同一 NJT 用 source_boundary 标记 ingress_external 或 lateral_internal，并分别调用防御分支。一次 Web
      下载只要目标文件到达得到确认即可满足父项，它不需要持续 C2，也不能单独证明 T1071 应用会话。只有 GET、curl/wget/certutil 命令、代理响应或远端文件存在而没有目标创建证据时保持 attempted_transfer，不完成本技术。直接把网络字节流送入解释器且没有独立文件对象也在本范围外。
    en: Scope includes actual independent-file arrival from an outside source onto an already controlled destination
      and cross-host arrival inside a victim environment. The same NJT records source_boundary as ingress_external or
      lateral_internal and invokes separate defense branches. A one-time Web download qualifies when destination file
      arrival is confirmed; it does not require sustained C2 and does not independently establish a T1071 application
      session. A GET, curl, wget, or certutil command, proxy response, or remote file existence without destination creation
      remains attempted_transfer and does not complete the technique. Streaming network bytes directly into an interpreter
      without an independent file object is also outside this scope.
  - zh: T1071 负责真实应用协议事务维持控制，T1105 只负责其中某个工具/文件物化到目标；二者可并列。T1102 负责合法外部服务的 account/object 参与控制，若从该 object 下载文件并落地可与本项并列。T1132
      负责 C2 数据可逆表示，编码文件的到达和随后解码是两个相邻事实，不按编码算法建本项子技术。T1104 负责通道按阶段/功能分工，每个阶段组件的到达可记录 T1105，但多个组件或先后下载不能自动证明多阶段通道。
    en: T1071 owns real application-protocol transactions that sustain control, while T1105 owns materialization of a
      particular tool or file on the destination; both may coexist. T1102 owns an account or object of a legitimate outside
      service participating in control, and a file downloaded from that object may co-classify here when it lands. T1132
      owns reversible C2 data representation; arrival of an encoded file and later decoding are adjacent facts and do
      not create children by encoding algorithm. T1104 owns channels divided by stage or function. Arrival of each stage
      component can receive T1105, but several components or sequential downloads do not automatically prove multi-stage
      channels.
  - zh: T1072/NJT-0078 由企业部署 job→agent→首次执行事务定义；文件只到达 agent cache 而未执行时由本项承担，到达并被受管 agent 执行时可并列。初次钓鱼附件、供应链包或 drive-by
      文件若发生在取得控制之前，应由初始访问/用户执行/供应链对象判断，不能因为文件存在就倒推 T1105。文件编码、伪装名称、隐藏路径和下载后执行各有相邻技术，均不改变到达结果门。
    en: T1072 and NJT-0078 are defined by an enterprise deployment job-to-agent-to-first-execution transaction. A file
      only arriving in an agent cache belongs here; arrival followed by managed-agent execution may co-classify. An initial
      phishing attachment, supply-chain package, or drive-by file before control is established is judged under Initial
      Access, User Execution, or Supply Chain objects and cannot be backfilled as T1105 merely because the file exists.
      Encoding, a disguised name, hidden placement, and post-download execution have adjacent techniques and do not change
      the arrival outcome gate.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 已受控主机需要新增载荷时，攻击者可用现有 C2 指令调用 curl、certutil、PowerShell 或 BITS，从外部 Web/C2 下载工具。sLoad 创建 BITS job 下载编码文件、复制并以
        certutil 解码为 PE；BazaCall 通过重命名 certutil 下载 BazaLoader；Mandiant 观察两条 UNC2975 投递链用重命名 curl 把 MSI 或 AutoIt 组件写入临时目录并执行。这些案例直接支持外部响应、目标文件和后继动作。
      en: When an already controlled host needs another payload, an actor may use existing C2 tasking to invoke curl,
        certutil, PowerShell, or BITS and retrieve a tool from outside Web or C2 infrastructure. sLoad creates BITS jobs
        to download an encoded file, copies it, and decodes it into a PE with certutil. BazaCall uses renamed certutil
        to download BazaLoader. Mandiant observed two UNC2975 delivery chains using renamed curl to write MSI or AutoIt
        components into a temporary directory and execute them. These cases directly support external response, destination
        file, and successor action.
    - zh: 已取得内部源后，攻击者也可把同一类工具复制到其他主机。SAFEPAY 经 SMB 在多目标暂存 NETSCAN，LOCKBIT.WARLOCK 从域控制器向多主机复制批处理文件。内部与外部分支都以目标到达为完成点，但前者需共享/登录/跨主机证据，后者需远端请求/响应/写入进程证据。一个行动可先从外部把工具送入首台主机，再横向复制；若内容谱系可连，应记录同一父级的两个
        source_boundary 实例。
      en: After obtaining an internal source, an actor can copy the same kinds of tools to other hosts. SAFEPAY staged
        NETSCAN on multiple destinations over SMB, and LOCKBIT.WARLOCK copied a batch file from a domain controller to
        many hosts. Both internal and external branches complete at destination arrival, but the former needs share,
        logon, and cross-host evidence while the latter needs remote request, response, and writer-process evidence.
        One operation may first bring a tool from outside to one host and later copy it laterally. Where content lineage
        joins, record two source_boundary instances under the same parent.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要已控制目标或可使其发起/接受传输的会话，拥有可达源和写入权限，并理解代理、DNS、认证、路径、空间、内容过滤与终端安全限制。外部入站可借已安装客户端或 C2 writer，内部传输需可写共享/文件服务。使用
          BITS、curl、同步或包管理降低新工具需求，却产生 job、命令行、URL、缓存和文件元数据；改变摘要、分块或延迟写入增加维护成本且仍需最终物化对象。
        en: The actor needs an already controlled destination or a session able to initiate or accept transfer, a reachable
          source, and write authority, plus knowledge of proxy, DNS, authentication, path, space, content-filtering,
          and endpoint-security constraints. External ingress can use an installed client or C2 writer; internal transfer
          needs a writable share or file service. BITS, curl, sync, or package management reduces new tooling but creates
          jobs, command lines, URLs, cache, and file metadata. Digest changes, chunking, or delayed writes add operational
          cost and still require a final materialized object.
    defender_model:
      paragraphs:
      - zh: 外部分支假定至少有端点 network/file telemetry，理想情况下还有代理/HTTP 请求响应和网络文件标识；内部分支使用共享/登录/目标文件事件。稳定字段包括 device、process start、user、remote
          URL/IP、HTTP uid/fuid、response bytes、FileOriginUrl/IP/Referrer、path、size、digest、source boundary 和 approval。分析必须先证明到达，再评价来源、writer、目录、内容和批准范围；request_only、response_observed
          与 arrival_confirmed 分级输出。
        en: The external branch assumes at least endpoint network and file telemetry, ideally with proxy or HTTP request-response
          and network-file identifiers. The internal branch uses share, logon, and destination-file events. Stable fields
          include device, process start, user, remote URL or IP, HTTP uid and fuid, response bytes, FileOriginUrl, IP,
          and Referrer, path, size, digest, source boundary, and approval. Analysis proves arrival first and then evaluates
          source, writer, directory, content, and approved scope, emitting request_only, response_observed, and arrival_confirmed
          separately.
      - zh: TLS 不解密、端点不采 FileOrigin、直接 socket writer、后台服务与调用进程分离、缓存/同步代写、文件快速删除、摘要缺失和跨传感器时钟偏差都会断开关联。合法浏览器下载、软件更新、包安装、备份还原、应急响应和管理员取证会产生同形序列；正向清单必须同时限定主体、进程、来源、内容/签名、目标路径和时间，不能永久放行
          curl、BITS、浏览器或知名 CDN。
        en: Opaque TLS, absent endpoint file-origin data, direct socket writers, separation between background service
          and caller, cache or sync delegated writes, rapid deletion, missing digests, and sensor clock skew break correlation.
          Legitimate browser downloads, software updates, package installs, backup restore, emergency response, and administrator
          forensics create the same shape. Positive allowlists must jointly constrain principal, process, source, content
          or signature, destination path, and time rather than permanently allow curl, BITS, browsers, or a known CDN.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 常见传输客户端来源或路径替代恶意文件到达的显著来源特征
    en: A familiar transfer client source or path substitutes for conspicuous provenance of malicious file arrival
  analysis:
    paragraphs:
    - zh: 攻击者让正常共享、签名下载工具、后台传输服务、浏览器或获准服务路径写入恶意文件，目标侧痕迹先显示熟悉 source/writer/path，而非最初操作者。单点规则若把该外观当成授权，会降低恶意到达的可区分性，形成特征伪装。sLoad
        BITS、BazaCall certutil、UNC2975 curl 和 NJT-0130 内部 SMB 案例证明这些写入链存在；来源没有量化所有环境的规避率，故父级置信度 medium。网络响应—writer—file—approval
        关联可恢复差异。
      en: The actor has an ordinary share, signed downloader, background-transfer service, browser, or allowed service
        path write the malicious file, leaving a familiar source, writer, or path at the destination rather than the
        original operator. A local rule that treats this appearance as authorization reduces distinguishability of malicious
        arrival and creates Feature Disguise. sLoad BITS, BazaCall certutil, UNC2975 curl, and NJT-0130 internal SMB
        cases establish these write chains. Sources do not measure evasion rates across all environments, so parent confidence
        is medium. Network-response-to-writer-to-file-to-approval correlation restores the difference.
  evidence_refs:
  - REF-000139
  - REF-000084
  - REF-001055
  - REF-000473
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式父级按目标侧独立文件到达统一内部横向与外部/C2 入站语境。当前来源未证明中继源间接化、同步客户端代写、刻意低速分批或协议选择具备稳定且独立的匿迹变量；这些假设保留研究状态。
      en: The formal parent unifies internal lateral and outside or C2 ingress contexts through independent file arrival
        at the destination. Current sources do not establish relay-source indirection, sync-client delegated writes,
        deliberately paced batches, or protocol choice as stable independent stealth variables; these remain research
        hypotheses.
    - zh: 工具、文件类型、协议、平台、外部/内部来源和后继执行不构成 NJS。来源拓扑改由内部 SMB 与外部请求—响应两个防御分支处理；缺少实际文件创建/修改时不完成父级。
      en: Tool, file type, protocol, platform, outside or inside origin, and successor execution do not define NJS children.
        Source topology is handled by separate internal-SMB and external request-response defense branches. Without actual
        file creation or modification, the parent is incomplete.
  coverage: deferred
  subtechnique_refs: []
