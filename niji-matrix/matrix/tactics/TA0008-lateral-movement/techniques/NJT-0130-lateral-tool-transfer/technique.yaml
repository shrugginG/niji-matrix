research:
  limitations:
    paragraphs:
    - zh: 三个外部案例证明不同 writer 的文件到达链，但操作阶段不完全相同。sLoad 是已运行 downloader 的后续载荷，最直接支持 post-compromise T1105；BazaCall 和 UNC2975
        下载处于交付/执行链较早位置，主要支持响应—文件—后继事件和受信 writer 的防御模型，不能单独证明每个下载前已建立控制。NJT-0130 内部案例则不支持外部字段。正式父级应组合而不混淆这些结论层级。
      en: The three external cases establish file-arrival chains with different writers but occur at different operational
        phases. sLoad is a later payload fetched by an already running downloader and most directly supports post-compromise
        T1105. BazaCall and UNC2975 downloads occur earlier in delivery or execution chains and mainly support response-to-file-to-successor
        telemetry and the trusted-writer defense model; they do not independently prove established control before every
        download. NJT-0130 internal cases do not support external fields. The formal parent should combine rather than
        conflate these conclusion levels.
    - zh: DeviceFileEvents 的 FileOrigin 与摘要、Zeek 的 fuid/extraction 以及 DeviceNetworkEvents 的 process/URL 均取决于部署；SHA256
        常为空，TLS 会使 http.log 不可用，后台服务可能把 caller 与 writer 分离，文件也可能在记录前删除。五分钟与二十四小时是工程起点，没有来源提供通用灵敏度、误报率或阈值。缺少目标创建时只能保持
        attempted/partial，不得因 malicious URL 或执行告警升级为 confirmed arrival。
      en: DeviceFileEvents FileOrigin and hashes, Zeek fuid and extraction, and DeviceNetworkEvents process and URL depend
        on deployment. SHA256 is often absent, TLS can remove http.log visibility, background services can separate caller
        from writer, and files may be deleted before recording. Five minutes and twenty-four hours are engineering starting
        points with no universal sensitivity, false-positive rate, or threshold supplied by sources. Without destination
        creation, conclusions remain attempted or partial and must not become confirmed arrival because of a malicious
        URL or execution alert.
    - zh: 跨战术复用要求主 Agent 重写 NJT-0130 的名称、definition、scope、scenario、defender model、taxonomy narrative、evidence 和 limitations，并新增
        TA0011 decision；只把 tactic_ref 加进去而保留“initial download excluded”的旧正文会自相矛盾。现有 DET/MIT 保持内部语义，新对象覆盖外部，不得互相夸大覆盖。
      en: Cross-tactic reuse requires the primary agent to revise NJT-0130 name, definition, scope, scenarios, defender
        model, taxonomy narrative, evidence, and limitations and add an independent TA0011 decision. Adding a tactic_ref
        while leaving old text that excludes initial external download would be contradictory. Existing DET and MIT retain
        internal semantics and new objects cover external ingress without overstating each other's coverage.
