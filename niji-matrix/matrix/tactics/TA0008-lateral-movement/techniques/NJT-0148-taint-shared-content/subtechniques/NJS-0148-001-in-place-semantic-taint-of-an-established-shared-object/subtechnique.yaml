research:
  limitations:
    paragraphs:
    - zh: Gamaredon 的现有文档注入是直接观察，但 ESET 说该组织似乎几乎不努力低调。其案例可证明内容改写、原位置恢复和传播机会，不能证明攻击者为降低可见度而选该路径，亦没有每个接收者的目标端完整结果。InvisiMole
        的原件替换与名称、图标、元数据保留有强证据，但报告首先把替换放在已受害计算机，并没有逐一证明每个原件原本处于网络共享；正式 Case 必须分别保存这些限制。
      en: Gamaredon's insertion into existing documents is directly observed, but ESET says the group appeared to make almost
        no effort to stay under the radar. Its case supports content alteration, return to original locations, and propagation
        opportunity, not an attacker motive to reduce visibility or a complete destination outcome for each recipient. InvisiMole's
        replacement and preservation of names, icons, and metadata are strongly documented, but the report initially locates
        replacement on a compromised computer and does not show that every original had already resided on a network share.
        Formal Cases must preserve these distinct limits.
    - zh: 效果强弱取决于消费者执行策略和防守对象版本能力。宏阻断、文件签名、受控软件仓库或只读共享可以直接阻断；没有精确消费者版本 ID 时，改写与后继进程的时间相邻只是相关性，不是因果证明。可控变量稳定，但跨文档、软件和 SaaS
        的日志不统一，不得声称单一解析器或七天窗口普适。
      en: Effect strength depends on consumer execution policy and defender version capability. Macro blocking, file signing,
        controlled software repositories, or read-only shares can interrupt the chain. Without an exact consumer version ID,
        temporal proximity between change and successor process is correlation, not proof of causation. The controlled variable
        is stable, but document, software, and SaaS telemetry differs; no single parser or seven-day window is universally
        sufficient.
