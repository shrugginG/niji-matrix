schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0148-001
parent_ref: NJT-0148
name:
  zh: 既有共享对象语义原位污染
  en: In-Place Semantic Taint of an Established Shared Object
summary:
  zh: 攻击者保留内部消费者原本选择的共享对象身份，却改写其活动内容或执行语义，使下一次正常打开成为异机运行机会。
  en: An adversary preserves the shared object's identity already selected by internal consumers while changing active content
    or execution semantics so the next ordinary open becomes an opportunity to run code on another host.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有共享对象语义原位污染是攻击者在团队共享盘、映射网络驱动器或其他既有内部共享关系中，修改一个已有且被用户或自动消费者重复选择的对象，使其在原有名称、路径或业务角色下携带新的恶意执行语义。攻击者的直接目标是让另一台内部主机在照常读取文档、调用软件或处理共享工件时运行其代码；写入完成只是准备阶段，异机消费者实际取得恶意版本并触发才构成横向结果。
    en: In-Place Semantic Taint of an Established Shared Object changes an object that users or automated consumers already
      select repeatedly through a team share, mapped network drive, or another established internal sharing relation. The
      object carries new malicious execution semantics under its familiar name, path, or business role. The adversary's direct
      objective is to run its code when another internal host ordinarily reads a document, invokes software, or processes
      a shared artifact. The completed write is preparation; lateral outcome requires a separate consumer to obtain and trigger
      the malicious version.
  - zh: 分类变量是“消费者仍选同一业务对象，但对象内部语义已变”，不是恶意内容是宏、远程模板、脚本、安装器还是二进制。Gamaredon 的宏/模板注入证明在既有 Word/Excel 文档内部改变运行语义；InvisiMole 的文件替换证明名称、图标和元数据可保留而文件已换为木马化版本，但其报告不能单独证明每个被替换对象都位于先前共享盘。两者合在一起支持这个可跨格式复现的变量，具体事件仍按各自来源的共享位置与消费者证据审定。
    en: The classification variable is that a consumer still selects the same business object while its internal semantics
      have changed, not whether the malicious content is a macro, remote template, script, installer, or binary. Gamaredon's
      macro and template injection establishes changed execution semantics inside existing Word and Excel documents. InvisiMole's
      file replacement establishes that names, icons, and metadata can persist after trojanization, but its report alone does
      not prove every replaced object had already resided on a shared drive. Together they support a repeatable cross-format
      variable, while each event still needs its own evidence of shared location and consumer action.
stealth_characteristics:
  paragraphs:
  - zh: 既有共享对象语义原位污染让路径、熟悉标题和获取方式保持连续，恶意差异落在文件版本、嵌入宏、模板引用、可执行节、摘要或签名。只监视新文件投递、陌生下载来源或目标端“用户打开了熟悉文档”的规则，难以区分恶意版本和合法共同编辑；写入者和消费者往往在不同主机和时刻，使单点进程树缺少改写来源。这是由行为与审计语义推导出的条件性观察效应，不能从
      Gamaredon 案例直接推出匿迹动机。
    en: In-Place Semantic Taint of an Established Shared Object keeps path, familiar title, and acquisition method continuous,
      while the malicious difference resides in version, embedded macro, template reference, executable section, digest, or
      signature. Rules that watch only new-file delivery, unfamiliar download origins, or a destination user opening a familiar
      document can fail to distinguish a malicious version from legitimate coauthoring. Writer and consumer commonly occupy
      different hosts and times, leaving the change origin absent from a local process tree. This is a conditional observation
      effect inferred from behavior and audit semantics; Gamaredon's case cannot establish a stealth motive.
  - zh: 痕迹仍可恢复：对象旧/新版本、真实写入主体、内容结构差异、另一设备读取的精确版本，以及 Office 或安装器后继进程和网络连接。合法作者确会加入宏、改变模板或发布新版软件，因此版本差本身不是攻击证据；只有未批准写入、异常活动内容、异机消费与执行结果连接起来时，才可从完整性偏差推进至横向结果。应用控制阻断后，消费者可能只留下尝试或隔离记录。
    en: 'Residual evidence remains recoverable: before-and-after object versions, actual writer, structural content delta,
      exact version read on another device, and Office or installer successor process and network activity. Legitimate authors
      also add macros, change templates, or release software, so a version difference alone is not proof of attack. An unapproved
      writer, abnormal active content, cross-host consumption, and execution outcome must connect before an integrity deviation
      becomes a lateral outcome. If application control blocks execution, the consumer may leave only an attempt or quarantine
      record.'
scope_boundary_definition:
  paragraphs:
  - zh: 本项纳入已有共享对象在同一消费者选择身份下被攻击者嵌入、改写或替换，且至少存在另一个内部消费者取得该恶意版本的证据。对象可以是文档或可执行软件，替换可改变底层 inode 或版本 ID；必须保留的是用户选择和业务语义上的“原对象”，而非所有字节或物理文件
      ID。无授权编辑、原版本与新版本的可比较差异、恶意活动语义及消费者结果是判断主线。
    en: This child includes adversary insertion, alteration, or replacement of an established shared object under the same
      consumer-facing selection identity, with evidence that another internal consumer obtained the malicious version. The
      object may be a document or executable application; replacement may change inode or version ID. What persists is the
      user's selected business object, not every byte or physical file identifier. Unauthorized editing, comparable old and
      new versions, malicious active semantics, and consumer outcome are the judgment chain.
  - zh: 全新文件只是放在共享盘且没有取代既有选择，不自动入此项；只把文件传到另一主机是 T1570，内部消息引导收件人执行是 T1534，受管平台发布则需检查 T1072 的 job/agent 链。若改动的是同名目录入口的目标绑定而原文档或目录内容本身未被恶意改写，归导航目标替身。正常版本升级、共同编辑、签名的批准软件更新和模板迁移是主要反例；本项也不能替代无异机消费者的
      NJT-0087 本机持久二进制破坏。
    en: A new file merely placed on a share without replacing an established selection does not automatically fit. File arrival
      on another host belongs to T1570, an internal message inducing a recipient belongs to T1534, and managed-platform release
      requires checking T1072's job and agent chain. If the changed relation is a same-named directory entry's target while
      the original document or directory content is not maliciously altered, use Navigation-Entry Target Substitution. Approved
      version upgrades, normal coauthoring, signed software releases, and template migrations are key alternatives. This child
      also cannot replace NJT-0087's local persistent binary compromise where no separate internal consumer exists.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制能写映射共享盘的主机后，在下一个业务周期前遍历已存在的 Word/Excel 文档并插入宏或远程模板；同事稍后从原路径打开文件，可能在各自上下文里触发下载器。ESET 确认 Gamaredon 工具遍历可达驱动器、移动文档到
        AppData 改写并放回原位，且分析者认为文档在同事间常被共享。该来源证明改写和潜在传播路径，不给每个同事的成功执行清单，也明确不应承载匿迹动机归因。
      en: After controlling a host able to write mapped shares, an adversary could traverse existing Word and Excel documents
        before the next business cycle and insert macros or remote templates. Colleagues later opening them from the original
        paths may trigger a downloader in their own contexts. ESET confirms Gamaredon tools traversed reachable drives, moved
        documents to AppData for alteration, and returned them, while observing that such documents are routinely shared among
        colleagues. This source proves the change and propagation opportunity, not a list of successful executions by every
        colleague, and it explicitly cannot carry a stealth-motive attribution.
    - zh: 攻击者也可把组织常用安装程序或文档替换为保留名称、图标和元数据的木马化版本，使用户在维护或阅读任务中照常取得它。ESET 对 InvisiMole 记录了近三十种木马化应用、一个文档及中央服务器上安装程序可能广泛传播的风险；但报告首先说原文件在已受害计算机上被替换，故只有确认该对象随后被其他内部主机共享和执行时，才能把具体事件定为本项的横向结果。
      en: An adversary may also replace a familiar organizational installer or document with a trojanized version preserving
        name, icon, and metadata so users obtain it during maintenance or reading. ESET reports nearly thirty trojanized InvisiMole
        applications, one document, and the risk that an installer on a central server spreads widely. Its direct account
        first places replacement on an already compromised computer, however, so a specific event reaches this lateral child
        only when another internal host is shown to share and execute that object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要对既有共享对象有写权限或控制同步/发布身份，知道哪些对象被另一内部人或自动消费者反复使用，且能制作在目标 Office 或安装环境中生效的活动内容。宏注入要保持文档可打开并满足宏策略；安装器替换要尽量保留正常程序功能、界面和依赖，否则用户或版本校验会察觉。攻击者还需要等待独立消费者打开，无法单凭文件写入强迫他人执行。
        en: The adversary needs write authority over an established shared object or control of a sync or publishing identity,
          knowledge of which objects another internal person or automated consumer repeatedly uses, and active content compatible
          with the target Office or installation environment. Macro insertion must leave the document openable and pass macro
          policy; installer replacement must preserve ordinary function, interface, and dependencies as far as possible or
          users and version checks may notice. The adversary must then wait for an independent consumer and cannot force execution
          merely by writing a file.
      - zh: 宏策略、签名、文件锁、只读发布区、受控版本、异步恶意软件扫描和用户权限限制这种机会。大量文件同时注入会产生突出的写入分布；恶意代码若在隔离预览或应用控制处被阻断，则不会获得目标控制。Gamaredon 工具还修改本机 Office
          宏安全设置，但来源未证明它能同步改掉每一个将来消费者的设置，因此不能假定跨主机宏执行必然成功。
        en: Macro policy, signatures, file locks, read-only release areas, controlled versions, asynchronous malware scanning,
          and user privileges constrain this opportunity. Injection into many files at once creates a conspicuous write distribution.
          If isolated preview or application control blocks the code, destination control is not obtained. Gamaredon tools
          also altered Office macro security on the compromised system, but the source does not show they changed every future
          consumer's settings, so cross-host macro execution cannot be assumed.
    defender_model:
      paragraphs:
      - zh: 防守方至少在重点共享区保存对象前后版本、摘要、修改主体、路径和时间，Windows 文件服务器可用配置了 SACL 的 4663 看实际使用的写权限，SharePoint/OneDrive 可用 FileModified
          与版本历史看云端改动。还需把映射驱动器或同步本地路径解析到共享对象 ID，才可能知道另一设备实际读取的是哪个版本。云 FileAccessed 和文件服务器 5145 只提供读取或访问检查线索，预览、预取及权限检查不等于用户有意打开或代码执行。
        en: Defenders need before-and-after versions, digests, modifier, path, and time for priority shared areas. A Windows
          file server can expose rights actually used through 4663 with an appropriate SACL, while SharePoint or OneDrive
          can expose cloud changes through FileModified and version history. Drive mappings or synced local paths must resolve
          to the shared object ID to tell which version another device actually read. Cloud FileAccessed and file-server 5145
          provide read or access-check leads only; preview, prefetch, and permission checks do not equal deliberate user opening
          or code execution.
      - zh: 目标端 Office、安装器或解释器的进程树、模块加载及网络结果可验证活动内容是否生效；批准发布者、变更单、签名和同版本可信原件用于排除正常协作。缺少被污染前版本、文档加密、仅见云下载而无端点进程、同步时版本 ID 丢失或日志短于打开延迟时，只能报告污染或已读级别。即使异常后继进程存在，也需证明它消费了该对象版本而非同时间段其他输入。
        en: The destination Office, installer, or interpreter process tree, module loads, and network outcomes can test whether
          active content took effect. Approved publisher, change record, signature, and a trusted same-version original distinguish
          normal collaboration. Without a pre-taint version, with encrypted documents, with cloud download but no endpoint
          process, when sync loses version identity, or when logs expire before the delayed open, the finding stays at taint
          or read level. Even an anomalous successor process must be tied to the consumed object version rather than a different
          input at the same time.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 原共享对象身份下承载已改写的执行语义
    en: Changed execution semantics under an established shared-object identity
  analysis:
    paragraphs:
    - zh: 攻击者选择已有协作对象而非创建陌生文件，在原路径或名称下放入恶意活动内容，用户仍以熟悉业务动作取得它。实体外观延续而内容版本和运行语义改变，使按路径、文件名、发送来源或用户工作流作粗粒度分类的防守更难区分恶意版本；保留原功能的木马化文件会进一步降低用户侧异常。Gamaredon
        证明已有文档被注入，InvisiMole 证明外观保留，但两者不能互相补成一个已观察到的“每个共享对象都成功横向执行”案例。历史版本、结构差分、签名和目标后继行为仍可拆穿该伪装。
      en: The adversary chooses an established collaborative object instead of creating an unfamiliar file and inserts malicious
        active content under its original path or name, so the user obtains it through a familiar business action. Visible
        identity persists while content version and runtime semantics change, weakening coarse classification by path, filename,
        source, or user workflow; a trojanized file preserving ordinary function further reduces user-visible anomalies. Gamaredon
        establishes injection into existing documents and InvisiMole establishes appearance retention, but they cannot be
        combined into one observed case in which every shared object executes successfully on another host. Historic versions,
        structural differences, signatures, and destination successor behavior can expose the disguise.
  evidence_refs:
  - REF-000590
  - REF-000591
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 写入与异机打开分置于不同日志和时间
    en: Write and cross-host open occupy different logs and times
  analysis:
    paragraphs:
    - zh: 原共享对象在源端被改写时，未来消费者尚无异常进程；另一设备按计划打开时，端点首先只见正常 Office 或安装器入口。若防守按单机或短窗口收集，异常 writer 与后来的首次执行互不关联，关键因果从常规视野中消失。这个效果需要具体日志保留与关联缺口才成立，不能说共享存储本身不可见；对象版本、写入账户、消费者设备、进程或网络结果都可能恢复链条。
      en: When the original shared object changes at the source, the future consumer has no anomalous process yet. When another
        device opens it on schedule, the endpoint initially shows an ordinary Office or installer entry. If defense collects
        by one device or a short window, the abnormal writer and later first execution may never join, leaving critical causality
        outside routine observation. The effect depends on a concrete retention or correlation gap and does not make shared
        storage inherently invisible. Object version, writer account, consumer device, process, and network result may restore
        the chain.
  evidence_refs:
  - REF-000590
  - REF-000591
  - REF-000379
  - REF-000561
  confidence: medium
