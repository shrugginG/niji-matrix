research:
  limitations:
    paragraphs:
    - zh: DirSharePivot 文章前段报告真实客户取证，包含多台工作站受害、隐藏原目录、同名入口、用户点击后本地复制执行及真实目录继续打开；这是第二子项的一手现场支持。报告未公开各设备日志、样本谱系、精确时间戳或攻击者最初获得共享写权的步骤，不能据此量化覆盖率、比较所有目标的
        4624 情况或证明每次点击都感染。作者后段的红队代码是复现和改良，不属于客户现场载荷。
      en: The first part of the DirSharePivot article reports real customer forensics with multiple infected workstations,
        hidden original directories, same-named entries, local copy and execution after user clicks, and continuation into
        the real directory. It is first-hand field support for the second child. The report does not publish each device's
        logs, sample lineage, exact timestamps, or initial acquisition of share-write authority, so it cannot quantify coverage,
        compare 4624 presence across every target, or prove every click infected a host. The later red-team code is reproduction
        and improvement, not the customer payload.
    - zh: ATT&CK 把 RedCurl 的修改 LNK 列为 T1080 过程实例，然而可访问的 Group-IB 报告落地页没有技术细节。本子项不能借该页面填补 DirSharePivot 缺失的现场日志。DFS 和受管目录迁移可能给出相同的目录外观，且安全策略可能阻断恶意目标；只有入口目标、原目录状态、异机消费者及执行结果四段连通，才能从仿冒风险推进到已证横向移动。
      en: ATT&CK lists RedCurl's modified LNK files under T1080, but the accessible Group-IB report landing page has no technical
        detail. This child cannot use that page to fill gaps in DirSharePivot's field logs. DFS and managed directory migration
        can produce the same folder appearance, and security policy may block the malicious target. Entry target, original-directory
        state, separate internal consumer, and execution outcome must connect before masquerade risk becomes established lateral
        movement.
