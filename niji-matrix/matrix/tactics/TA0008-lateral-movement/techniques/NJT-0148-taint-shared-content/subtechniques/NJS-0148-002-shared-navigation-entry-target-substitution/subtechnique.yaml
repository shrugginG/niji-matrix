schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0148-002
parent_ref: NJT-0148
name:
  zh: 共享导航入口目标替身
  en: Shared Navigation-Entry Target Substitution
summary:
  zh: 攻击者用与原共享目录同名同外观的导航入口替代用户选择目标，使异机用户点击时先运行载荷、随后仍看到原目录。
  en: An adversary substitutes a navigation entry with the same name and appearance as an original shared directory so a user
    on another host runs a payload on click before still seeing the real directory.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 共享导航入口目标替身是攻击者改变内部共享目录的“用户所见入口→实际解析目标”关系，让另一个内部主体按惯常路径选择看似正常的目录或文件时，首先触发攻击者命令，再进入其原本想看的内容。攻击者的直接目标是通过受害者自己的导航动作在其主机上执行代码；同名、图标和最终呈现的真实目录为该替身维持业务可信度，但不能替代目标端执行证据。
    en: Shared Navigation-Entry Target Substitution changes the relation between a user-visible entry in an internal share
      and the target actually resolved by that entry. Another internal principal follows a familiar path to what looks like
      a normal directory or file, triggers attacker commands first, and then reaches the content originally sought. The adversary's
      direct objective is execution on the consumer's host through that user's navigation action. The same name, icon, and
      eventual presentation of the real directory preserve business credibility but cannot substitute for evidence of destination
      execution.
  - zh: 这个概念的稳定变量是入口目标绑定而不是 LNK 格式。DirSharePivot 原作者在客户网络取证中发现真实目录被隐藏、同名目录图标的快捷入口出现、点击后恶意载荷复制并在用户本地执行，同时 Explorer 打开真实目录；作者随后公开了受控复现代码。前半是他报告的现场链，后半是技术复现，不应把复现脚本参数当作客户样本，也不需假设
      RedCurl 的过程完全相同。
    en: The stable variable is entry-to-target binding, not the LNK format. In customer-network forensics, the DirSharePivot
      author found real directories hidden, same-named folder-icon shortcuts in their place, and a click that copied and executed
      a payload locally before Explorer opened the real directory; the author later published controlled reproduction code.
      The first account is his reported incident chain and the latter a technical reproduction. The reproduction's script
      parameters must not be attributed to the customer sample, nor must RedCurl be assumed to follow the identical procedure.
stealth_characteristics:
  paragraphs:
  - zh: 共享导航入口目标替身保留用户看到的目录名、目录图标和点击后的正常内容，却把首次解析路径改成带命令的入口。恶意与正常导航的视觉特征相似，用户可以如原作者所访谈的员工那样认为入口合法；网络分段和仅依赖显式横向登录/扫描的告警，也可能因执行由每个用户自身在本地发起而错过跨主机传播。这里的匿迹效果有取证现场和作者的防守分析支持，但不代表所有部署都没有认证日志。
    en: Shared Navigation-Entry Target Substitution retains the directory name, folder icon, and expected content after a
      click while changing first resolution to an entry containing commands. Malicious and normal navigation look alike, and
      employees interviewed by the author considered the entries legitimate. Segmentation and alerts relying only on explicit
      lateral logons or scans can also miss propagation because each user starts execution locally. The observation effect
      is supported by the forensic account and the author's defense analysis, but it does not mean every deployment lacks
      authentication logs.
  - zh: 残余痕迹与正文污染不同：原目录的隐藏属性、同名新入口、入口目标与参数、文件服务器的写入身份、点击者主机上 Explorer 到解释器/载荷的进程顺序，以及被复制的本地载荷。合法 DFS、目录迁移和受管快捷方式可能产生同名入口或保留正常导航，因此不能凭
      LNK 存在定恶意；需证明入口目标带非批准命令以及另一设备实际运行。
    en: 'Residual traces differ from document taint: the original directory''s hidden attribute, a same-named new entry, its
      target and arguments, the share writer, Explorer-to-interpreter or payload process order on the clicking host, and a
      locally copied payload. Legitimate DFS, directory migrations, and managed shortcuts may produce same-named entries or
      preserve navigation, so LNK presence alone is not malicious. The entry must resolve to an unapproved command and a separate
      device must actually run it.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者对已有共享目录或同等导航对象的选择入口进行目标替换，要求入口原本服务于正常内部消费，另一内部设备选择了替身，且有恶意目标解析与执行证据。隐藏原目录、仿冒图标、利用快捷方式是该变量的常见组合，但每个辅助动作都不是 NJS
      本身。若只有目录变隐藏而无人经替身消费，最多证明规避/篡改；若仅把脚本放到共享目录而用户没有选择原业务入口，则不满足导航替身。
    en: Scope includes adversary replacement of the selected entry for an established shared directory or equivalent navigation
      object. The entry must have served ordinary internal consumption, another internal device must select the substitute,
      and malicious target resolution and execution need evidence. Hiding the original directory, copying an icon, and using
      a shortcut are common components, but none alone defines this NJS. A hidden directory with no substitute consumer proves
      at most concealment or tampering. A script merely placed on a share without taking over the original business entry
      does not qualify.
  - zh: 与兄弟项的互斥边界在于原内容可以保持完整，恶意变化发生于“入口指向哪里”；若共享文档或安装器本身嵌入恶意代码，归既有共享对象语义污染。T1036 的名称仿冒和 T1564 的隐藏属性只解释辅助特征，T1547 的自启动要求持久启动入口而本项由另一用户点击驱动，T1534
      需要内部消息诱导而这里可没有消息。正常 DFS 链接、迁移快捷方式和管理员导航脚本是必须核对的反例。
    en: The sibling boundary is that original content may remain intact while the malicious change occurs in where the entry
      points. If a shared document or installer itself gains malicious code, use In-Place Semantic Taint. T1036 name masquerading
      and T1564 hidden attributes explain supporting features only; T1547 requires a persistent startup entry whereas this
      child is driven by another user's click; T1534 requires an internal inducement message that may be absent here. Legitimate
      DFS links, migration shortcuts, and administrator navigation scripts must be considered.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在一个频繁访问的企业网络共享中，攻击者或恶意软件将真实目录置为隐藏并放入同名、同目录图标的可点击入口。用户按日常路径点击时，先发生用户本机载荷复制和执行，再正常打开真实目录；被害者可继续工作，其他可访问该共享的用户也会遇到同一入口。DirSharePivot
        原作者称其在勒索软件客户网络取证中发现这一模式，多台工作站被感染，员工认为链接合法；文章没有公布逐台日志或所有感染节点的完整时间序列。
      en: In a frequently accessed enterprise network share, an adversary or malware hides real directories and installs clickable
        entries with the same names and folder icons. When a user follows the everyday path, a payload is copied and executed
        locally before the real directory opens; that user can continue working while other people with access to the share
        encounter the same entry. The DirSharePivot author reports finding this pattern in customer-network forensics after
        a ransomware infection, with multiple infected workstations and employees judging the links legitimate. The article
        does not publish per-device logs or a full timeline for every infected node.
    - zh: 作者随后给红队编写了受控脚本，可对指定共享目录建立同类入口，并把其原始发现中较吵的 cmd 窗口和落盘载荷改成更安静的实现。后半说明入口绑定变量可被有意操纵，不能反过来声称客户现场样本使用了 mshta、内存载荷或红队函数参数。ATT&CK
        另列 RedCurl 修改网络盘 LNK，但可访问 Group-IB 落地页没有链路细节，本附录不用它证明该子项现场过程。
      en: The author later wrote a controlled red-team script that creates similar entries for a selected share directory
        and changes the noisier cmd window and disk payload of the initial finding to a quieter implementation. This later
        section establishes that entry binding can be intentionally controlled, but does not show that the customer sample
        used mshta, an in-memory payload, or the red-team function's parameters. ATT&CK separately lists RedCurl modifying
        LNK files on network drives, but the accessible Group-IB landing page has no chain detail and is not used here to
        establish this child's field procedure.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要写入用户常访问的共享目录、改变原目录属性或位置、创建可被 Explorer 解释的入口，并掌握用户如何找到该目录。若要维持业务外观，还需保留原目录并在恶意命令后把用户带回真实内容；若入口目标无法解析、图标异常或真实目录不可达，用户可能提前发现。源端不必逐台掌握目标主机远程登录，但最终执行仍受每个消费者的用户权限和应用控制约束。
        en: The adversary needs write access to a frequently used shared directory, ability to change the original directory's
          attribute or position and create an Explorer-resolvable entry, and knowledge of how users find the directory. Preserving
          business appearance also requires keeping the real directory and returning users to it after the malicious command.
          A broken target, anomalous icon, or inaccessible real folder may expose the change. The source need not hold remote
          logon rights to every destination, but execution still depends on each consumer's privileges and application control.
      - zh: 扩散速度依赖用户访问量而非攻击者能直接指定的时刻。DirSharePivot 客户案例在分段网络中发生，但不能由此推断所有网络分段都失效；其后作者提出的无窗口或内存执行改良，也不能自动赋给原始攻击者。写入审计、目录内容基线、LNK
          目标解析和消费者端命令行采集越完善，替身越难持续。
        en: Propagation speed depends on user traffic rather than an attacker-controlled open time. The DirSharePivot customer
          incident occurred in a segmented network, but that does not imply all segmentation fails. The author's later quiet-window
          or memory-execution improvement cannot automatically be attributed to the original attacker. Stronger write audit,
          directory baselines, entry-target parsing, and consumer command-line collection make substitution harder to maintain.
    defender_model:
      paragraphs:
      - zh: 防守方需在高访问量共享上保存目录列表、隐藏属性、入口类型、链接目标/参数、创建者与变更时间，并把文件服务器的共享访问与终端 Explorer/解释器/载荷进程连接。Windows 5145 可补充请求源 IP、共享与相对目标，配置了
          SACL 的 4663 可提供对象实际使用的写权限；它们单独不能证明用户点击。消费者端可观察本地复制、进程启动及后续传播，但必须将其与被点击的共享入口而非同一时间的其他文件关联。
        en: Defenders need directory listings, hidden attributes, entry type, link target and arguments, writer, and change
          time for busy shares, joined to file-server access and endpoint Explorer, interpreter, and payload processes. Windows
          5145 adds requested source IP, share, and relative target; 4663 with a suitable SACL can show object write rights
          actually used. Neither alone proves a user click. The consumer endpoint can expose local copying, process launch,
          and subsequent spread, but these must be tied to the clicked shared entry rather than another file active at the
          same time.
      - zh: 如果终端只报告本地载荷而没有共享入口来源，或者共享服务器只记读权限检查而不保留入口版本，跨端因果会断开。作者报告客户现场未见常规 4624 Type 3 横向认证痕迹，说明仅依靠这类告警的盲区；然而正常用户访问文件服务器仍可能产生其他认证或文件访问证据。合法
          DFS、目录迁移和组织脚本会造成类似入口，防守方需用批准变更、签名目标、用户角色和执行结果判别。
        en: If endpoints report only a local payload without its shared-entry source, or the share server records only read
          access checks without entry versions, cross-host causality breaks. The author reports no ordinary 4624 type-3 lateral-authentication
          trace in the customer incident, illustrating a blind spot for alerts relying on that signal alone. Normal user access
          to a file server may still produce other authentication or file-access evidence. Legitimate DFS, directory migration,
          and organizational scripts create similar entries, so approved change, signed target, user role, and runtime outcome
          matter.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 同名目录外观遮蔽入口目标的恶意替换
    en: Same-named folder appearance masks malicious entry-target substitution
  analysis:
    paragraphs:
    - zh: 攻击者隐藏真实共享目录并在原位置放入同名、目录图标的入口，把用户首次点击解析为先运行载荷再打开原目录。名称、图标和最终内容延续，使入口在用户眼里近似正常目录，员工访谈称其看作合法；不同的目标参数、隐藏属性及点击后的本地进程是残余差异。DirSharePivot
        一手取证直接支撑这种外观与运行语义的分离，后续复现说明该变量可控。高置信仅指该实例的入口伪装机制，不表示所有同名快捷入口均恶意。
      en: The adversary hides real shared directories and places same-named, folder-icon entries where users expect them,
        resolving the first click to a payload before opening the original directory. Name, icon, and eventual content persist,
        so the entry resembles an ordinary folder to users, and interviewed employees considered it legitimate. Different
        target arguments, hidden attributes, and local processes after a click remain visible differences. DirSharePivot's
        first-hand forensics directly supports this separation of appearance and runtime semantics, while later reproduction
        demonstrates attacker control of the variable. High confidence applies to the instance's entry-disguise mechanism,
        not to every same-named shortcut.
  evidence_refs:
  - REF-000592
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 用户本地执行避开以远程认证和扫描为核心的横向视图
    en: User-local execution evades lateral views centered on remote logons and scans
  analysis:
    paragraphs:
    - zh: 恶意入口驻留在共享盘，执行却由另一主机用户自己点击发起；每个消费者的进程发生在本地，攻击源没有直接向所有目标发起显式远程服务登录或扫描。DirSharePivot 作者在客户网络未见其预期的 4624 Type 3 横向痕迹，并指出仅依赖网络流和认证事件的
        SIEM 可能失明。这个盲区只针对以这些信号为核心的检测模型；共享写入、链接目标和消费者端进程仍能被采集，不能表述为完全无日志。
      en: The malicious entry resides on a share, but execution starts when another host's user clicks it; each consumer process
        launches locally and the source need not initiate an explicit remote-service logon or scan to every target. The DirSharePivot
        author found no expected 4624 type-3 lateral traces in the customer network and noted that SIEM rules relying only
        on network flows and authentication can miss the method. This blind spot applies to that signal-centered defense model
        only. Share writes, link targets, and consumer processes remain collectible, so the action is not log-free.
  evidence_refs:
  - REF-000592
  - REF-000474
  - REF-000379
  confidence: medium
