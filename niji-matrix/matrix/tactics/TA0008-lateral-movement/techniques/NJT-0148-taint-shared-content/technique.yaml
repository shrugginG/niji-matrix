schema_version: 2.0.0
type: technique
id: NJT-0148
name:
  zh: 污染共享内容
  en: Taint Shared Content
summary:
  zh: 攻击者改写内部共享内容或其导航入口，使另一内部消费者沿熟悉路径打开恶意对象；写入与目标执行被正常共享工作流分隔。
  en: An adversary changes internal shared content or its navigation entry so another internal consumer opens a malicious
    object through a familiar path, with writing and destination execution separated by routine sharing workflow.
aliases:
- T1080
classification:
  tactic_refs:
  - TA0008
  origin:
    kind: attack-adapted
    source_attack_id: T1080
    source_attack_version: '19.1'
  decision_ref: DEC-TA0008-T1080
definition_and_concept:
  paragraphs:
  - zh: 污染共享内容是攻击者在已进入受害环境后，改变多人或多主机共用的文件、软件、文档、仓库内容或导航入口，使另一内部用户或自动消费者在原有共享工作流中读取、打开或调用攻击者控制的内容，进而在其主机上运行代码或产生可控结果。其直接目的不是把文件搬到另一主机，而是把既有共享对象变成跨主机执行的触发面；攻击者的写入与消费者的动作必须可分别识别。
    en: Taint Shared Content occurs after an adversary enters an environment and changes a file, application, document, repository
      item, or navigation entry used by multiple people or hosts. Another internal user or automated consumer then reads,
      opens, or invokes attacker-controlled content through the established sharing workflow, leading to code execution or
      a controllable outcome on that consumer's host. Its direct purpose is to turn an existing shared object into a cross-host
      trigger, rather than simply move a file to another host. The adversary's write and the consumer's action must be identifiable
      separately.
  - zh: 此概念以共享对象的信任和消费关系为锚，不以 SMB、SharePoint、宏、LNK、软件安装包或代码仓库等载体分割。恶意代码可被嵌入原文件、替换原对象，也可通过仿冒导航入口改变用户实际打开的目标；只有说明被改变的对象如何沿共享路径交给另一内部主体，才能从文件污染风险上升为
      TA0008 横向结果。消费者若只是下载或预览而没有后续执行/控制证据，应保留为待证链段。
    en: The concept is anchored in the trust and consumption relationship of the shared object, not in SMB, SharePoint, macros,
      LNK files, installers, or code repositories as media. Attacker code may be grafted into an original file, replace it,
      or be reached through a substituted navigation entry. The changed object must be shown to reach another internal principal
      through a shared path before file-taint risk becomes a TA0008 lateral outcome. Download or preview without later execution
      or control remains an unproven chain segment.
stealth_characteristics:
  paragraphs:
  - zh: 污染共享内容借用已知对象、常用路径和同事间真实协作，让被害者的打开动作仍符合岗位任务。既有对象原位改写主要把差异藏在版本、嵌入活动内容或哈希里；导航替身则把差异移到入口类型、目标参数或隐藏的原目录，表面仍可呈现熟悉名称和预期内容。防守方若只看共享写入量，或只看目标端由
      Office、Explorer/安装程序启动的进程，容易丢失“谁何时把对象改成恶意版本”的跨主机因果。
    en: Tainted shared content borrows a known object, familiar path, and real colleague-to-colleague workflow so the consumer's
      open action can still fit the job. In-place modification puts the difference into version history, embedded active content,
      or hash; a navigation substitute moves it into entry type, target arguments, or a hidden original directory while preserving
      a familiar name and expected content. A defender looking only at share-write volume or only at an Office, Explorer,
      or installer process on the destination can miss who changed the object into the malicious version and when.
  - zh: 残余痕迹包括写入主体与源地址、对象 ID/路径、版本或摘要变化、活动内容与链接目标、消费者身份/设备、首次异常子进程或网络结果。共享文件被真实业务用户频繁编辑时，内容差异本身不说明恶意；有版本库、写入审计、消费者端进程谱系与批准变更记录的环境，可以重建因果。若宏阻断、应用控制或安全预览阻止执行，污染仍是风险事件，但不能宣称目标已被控制。
    en: Residual traces include writer principal and source address, object ID or path, version or digest change, active content
      and link target, consumer identity and device, and first anomalous child process or network result. A content difference
      alone is not malicious where legitimate users frequently edit shared files. Version history, write audit, consumer process
      lineage, and approved-change records can reconstruct causality. If macro blocking, application control, or safe preview
      prevents execution, taint remains a risk event but destination control is not established.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入条件是原已被内部主体共同访问或预期访问的对象/入口被攻击者实质改写，且另一内部消费者沿该共享关系读取或触发恶意语义；将写入、消费者动作与异常结果分级记录。合法共同编辑、受控发布、恶意文件仅被放置但无人消费、或单机软件被篡改却未进入跨主机共享关系，均不能直接满足
      T1080 横向结果。对象摘要不匹配只说明完整性偏差，仍要排除批准更新、同步冲突、模板改动和安全扫描造成的正常变化。
    en: Scope requires substantive adversary change to an object or entry already accessed or expected to be accessed by internal
      principals, followed by another internal consumer reading or triggering its malicious semantics. The write, consumer
      action, and anomalous outcome should be recorded as distinct evidence grades. Authorized coauthoring, approved release,
      a malicious file merely staged but never consumed, or tampering with software on one host outside a cross-host sharing
      relation cannot establish a T1080 lateral result. A mismatched digest establishes an integrity deviation only until
      approved updates, synchronization conflict, template maintenance, and security scanning are ruled out.
  - zh: T1534 的主导对象是来自已受害内部身份的定向消息及收件人动作；若同一行动先用消息引人打开被污染共享文件，可分别记录诱导与文件污染，不能把邮件附件直接算作共享存储污染。T1570 只需证明文件到达另一主机，不包含原共享对象被改写和消费者触发；T1072
      则以受管 job、包、agent 与首次执行为主导链。对共享盘中的二进制改写可与 NJT-0087 的本机持久二进制破坏并存，但此处的关键是另一内部消费者。T1036/T1564 式伪装或隐藏是辅助动作，不能单独代替共享消费链。
    en: T1534 centers on a targeted message from a compromised internal identity and its recipient's action. An operation
      that uses a message to draw someone to a tainted shared file may record both inducement and file taint, but an email
      attachment alone is not shared-storage taint. T1570 proves only arrival on another host, without modification of an
      established shared object and consumer trigger; T1072 centers on the managed job, package, agent, and first-execution
      chain. A modified binary on a share may coexist with NJT-0087's local persistent binary compromise, but another internal
      consumer is decisive here. T1036 or T1564 disguise or hiding are supporting acts, not substitutes for the shared-consumption
      chain.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制一台可写团队共享盘、映射驱动器或共用软件目录的内部终端，在同事下次打开常用文档、目录或安装包前把原对象改成含有恶意活动内容的版本。Gamaredon 的模块在可达驱动器上寻找 Word/Excel 文档，插入宏或远程模板后放回原位置；InvisiMole
        把组织原有安装程序和文档替换为同名、同图标和相似元数据的木马化文件。这些实例说明“正常取得共享对象”如何成为另一个主机的触发机会，但单份公开报告未必记录每一台最终消费者的完整执行谱系。
      en: An adversary controls an internal endpoint with write access to a team share, mapped drive, or common software directory
        and alters an original document, navigation entry, or installer before colleagues next open it. Gamaredon's module
        searches reachable drives for Word and Excel documents, inserts macros or remote templates, and returns them to their
        original locations. InvisiMole replaces an organization's existing installers and documents with trojanized versions
        preserving names, icons, and similar metadata. These examples show how normal acquisition of a shared object creates
        a trigger opportunity on another host, although a public report does not necessarily record every final consumer's
        complete execution lineage.
    - zh: 在频繁访问的网络目录中，攻击者也可隐藏真实目录，放置同名外观的导航替身，使用户按惯常方式进入目录时先触发恶意命令，随后仍见到预期目录。DirSharePivot 原作者据客户网络取证记录了隐藏原目录、同名入口、用户点击后本地执行及继续打开真实目录，并另给受控复现；该现场报告没有逐机日志。RedCurl
        的共享盘 LNK 修改仅由 ATT&CK 过程条目记载，可访问的 Group-IB 落地页不能提供本子项的现场细节。
      en: In a frequently used network directory, an adversary may hide the real directory and place a same-looking navigation
        substitute so a user following the usual path first triggers malicious commands and then sees the expected directory.
        The DirSharePivot author reports customer-network forensics documenting hidden original directories, same-named entries,
        local execution after user clicks, and continued opening of the real directory, then provides a controlled reproduction;
        the field account lacks per-device logs. ATT&CK records RedCurl's modified LNK files on network drives, but the accessible
        Group-IB landing page cannot supply this child's field details.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须拥有对被广泛使用的共享对象或父目录的写入能力，了解消费者实际选择的文件/入口、应用对宏或链接的处理、安全策略及打开周期。原位改写需要保持文档/安装程序可用并能在其他用户上下文运行；导航替身需要控制名称、图标、入口目标及真实内容的后续呈现。只知道共享盘位置或能上传任意文件而无法影响既有消费者选择，不能构成这里的匿迹变量。
        en: The adversary needs write authority over a widely used shared object or parent directory and knowledge of what
          consumers actually select, how their application handles active content or links, applicable security policy, and
          open cadence. In-place taint must keep the document or installer usable and execute in another user's context; navigation
          substitution requires control of name, icon, target, and later presentation of the real content. Knowing a share
          location or being able to upload an arbitrary file without influencing established consumer selection does not establish
          this stealth variable.
      - zh: 攻击者也受文件锁、版本审计、签名与宏限制、SharePoint 异步恶意内容扫描、只读共享和用户权限限制。将同一修改推向大量共享文档会增加写入异常并可能破坏协作；消费者不开启活动内容、使用隔离预览或无权运行后继命令时，尝试只停留在污染阶段。来源没有证明攻击者能可靠控制每次打开时间或每台消费者的安全状态。
        en: File locks, version audit, signing and macro restrictions, asynchronous malware scanning in SharePoint, read-only
          shares, and user privileges constrain the adversary. Applying the same change to many shared documents increases
          write anomalies and may disrupt collaboration. If consumers do not enable active content, use isolated preview,
          or cannot run a successor command, the attempt stops at taint. The sources do not establish reliable attacker control
          over each open time or each consumer's security state.
    defender_model:
      paragraphs:
      - zh: 假定防守方在高价值共享上取得文件服务器 4663 实际写入、5145 访问检查、版本/摘要和权限变更，或在云共享中取得 FileModified、FileAccessed、文件版本与编辑者；消费者端还需主机/用户、对象打开、进程及网络结果。通过对象
          ID 或规范化路径、版本、写入身份与消费者设备连接两端。共享服务的 FileAccessed 或 5145 只表示读/权限检查，不能自动等于真实执行；微软说明预览和预取也可能产生访问记录。
        en: Assume defenders collect actual file-server writes through 4663, access checks through 5145, version or digest
          and permission changes on priority shares, or FileModified, FileAccessed, version, and editor data in cloud sharing.
          Consumer endpoints also need host and user identity, object open, process, and network outcomes. Object ID or normalized
          path, version, writer, and consumer device join both sides. Share-service FileAccessed or 5145 indicates a read
          or access check, not necessarily execution; Microsoft documents that previews and prefetch can also produce access
          records.
      - zh: 缺少被污染前版本、共享与终端日志时钟不齐、映射驱动器的本地路径无法还原到 UNC、云同步使真正打开设备脱离 Web 审计、以及加密或无宏分析能力，都会切断因果。防守方仍可对高价值目录做定期完整性比较、解析导航入口及活动内容，并以异常子进程/网络结果验证消费者阶段；合法协作或批准发布必须以作者、工单、签名及版本基线区别。
        en: Missing pre-taint versions, unsynchronized share and endpoint clocks, inability to map local drive letters to
          UNC paths, cloud sync that separates the opening device from web audit, and encrypted content or absent macro analysis
          all break causality. Defenders can still compare integrity for high-value paths, parse navigation entries and active
          content, and verify the consumer stage through anomalous child processes or network outcomes. Author, change record,
          signature, and version baseline distinguish legitimate collaboration or approved release.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 共享对象保留熟悉名称与业务用途而改变内部语义
    en: Familiar shared-object identity carries changed internal semantics
  analysis:
    paragraphs:
    - zh: 攻击者在原共享路径内改写被信任的对象或以同名入口替代它，使消费者仍看到熟悉的名称、图标、文件内容或工作目录。变化从显眼的新投递移到版本、嵌入代码、链接目标与隐藏原对象；只按路径、文件名或“用户按正常流程打开”判断的防守会把恶意触发与合法协作混同。InvisiMole
        对名称、图标和元数据的保留及 DirSharePivot 的仿冒入口直接证明这一设计，Gamaredon 证明原文档内容注入而非其隐蔽动机。可信版本差、入口类型/目标解析与执行结果仍可揭示差异。
      en: The adversary changes a trusted object at its original shared path or substitutes a same-named entry so consumers
        still see a familiar name, icon, document, or working directory. The difference shifts from an obvious new delivery
        to a version, embedded code, link target, or hidden original object. Defenses based only on path, filename, or the
        fact that a user followed a normal workflow may conflate the malicious trigger with collaboration. InvisiMole's preservation
        of names, icons, and metadata and DirSharePivot's substitute entry directly establish this design; Gamaredon establishes
        document injection but not a concealment motive. Trusted-version differences, parsed entry type or target, and execution
        results remain observable.
  evidence_refs:
  - REF-000589
  - REF-000591
  - REF-000592
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 共享写入与异机消费者执行相隔离而削弱单点因果
    en: Shared writes and execution on another host separate local causal views
  analysis:
    paragraphs:
    - zh: 内容被写入共享盘时，目标主机尚未启动恶意代码；另一个用户以后正常打开时，目标端主要呈现其自身 Office、Explorer 或安装程序活动。单看写入日志无法知道哪台终端成为消费者，单看目标进程又可能看不到较早的异常 writer。写入身份、对象版本、消费者设备及首次异常进程/网络关联可以恢复链条。此机理是由已记录的传播流程和审计字段推导出的观察差异，不是
        ESET 对 Gamaredon 匿迹意图的判断。
      en: When content is written to a share, the destination host has not yet launched attacker code. When another user later
        opens it normally, the destination mainly shows its own Office, Explorer, or installer activity. A write log alone
        cannot identify the eventual consumer, while destination process telemetry may omit the earlier abnormal writer. Writer
        identity, object version, consumer device, and first anomalous process or network event can restore the chain. This
        mechanism is an observation inference from documented propagation flow and audit fields, not ESET's judgment that
        Gamaredon sought stealth.
  evidence_refs:
  - REF-000590
  - REF-000591
  - REF-000379
  - REF-000561
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 原生子项按被攻击者改写的共享对象关系划分。既有共享对象语义原位污染保持原路径或文件身份，却改变其宏、模板、脚本或可执行内容，防守需连接旧新版本与异机消费；共享导航入口目标替身保持用户看到的目录入口与后来正常内容，却把首次点击绑定到额外命令，防守需连接隐藏原目录、替身目标与目标端命令。二者可同现，但一个改内容，一个改入口绑定，痕迹与分析数据不同。
      en: Native children partition the shared-object relationship changed by the attacker. In-Place Semantic Taint keeps
        the original path or file identity while changing macro, template, script, or executable content, requiring old-to-new
        version and cross-host consumption joins. Shared Navigation-Entry Target Substitution keeps the folder entry and later
        expected content visible while binding the first click to another command, requiring joins among hidden original directory,
        substitute target, and destination command. They can coexist, but one changes content and the other entry binding,
        producing different traces and analytics.
    - zh: Office、安装包、仓库、快捷方式和 SMB 是实现媒介而非分类依据；打开后的正常体验跨两个子项，不另拆一项。低频等待和仓库专用轴没有独立意图、消费结果与防御差异证据，留在研究层。两项子技术均不继承 ATT&CK 子技术，完成门仍是另一内部消费者的真实可控结果。
      en: Office files, installers, repositories, shortcuts, and SMB are implementation media rather than partition keys.
        A normal experience after opening can span both children and is not a third axis. Low-frequency waiting and repository-specific
        hypotheses lack separate evidence of intent, consumer outcome, and defense difference and remain in research. Neither
        child inherits an ATT&CK sub-technique, and both still require a real controllable result at another internal consumer.
