research:
  limitations:
    paragraphs:
    - zh: ESET Gamaredon 研究证明文档注入和原位置恢复，但其作者明确表示该组织似乎不努力低调，因此不能把该事件包装为已观察到的匿迹动机。InvisiMole 研究直接证明外观保留的木马化替换与被动传播设计，却未逐一公开每台消费者的版本和进程；DirSharePivot
        作者报告真实客户网络的目录替身与点击执行，也另给受控复现代码；现场叙述未附逐机日志和完整样本谱系。RedCurl 的窄行为仅来自 ATT&CK 过程条目，原始 Group-IB 可访问页面只给摘要，不参与第二子项的现场证明。
      en: ESET demonstrates Gamaredon document injection and restoration to original locations, but explicitly says the group
        appeared not to try to stay under the radar, so this incident cannot be framed as observed stealth intent. InvisiMole
        research directly shows appearance-preserving trojanized replacement and passive-spread design without publishing
        every consumer's version and process. The DirSharePivot author reports a real customer-network directory substitution
        and click-to-execution chain and separately supplies controlled reproduction code; the field account does not publish
        per-device logs or complete sample lineage. RedCurl's narrow behavior comes only from ATT&CK's procedure account,
        while accessible original Group-IB pages provide a summary and do not establish the second child's field evidence.
    - zh: 版本差异、共享访问和目标执行在不同日志与时钟下发生。5145 仅检查共享访问，云 FileAccessed 可能由预览或预取触发；没有实际写入、对象版本、另一内部消费者和后继执行四类证据时，只能逐级报告污染可能、已读取或已执行，不能跳级宣称横向成功。合法共同编辑、软件发布、目录迁移、宏业务和安全扫描均会产生部分相似信号，检测与缓解应保留审批与环境基线。
      en: Version changes, share access, and target execution occur across different logs and clocks. Event 5145 only checks
        share access, while cloud FileAccessed may result from preview or prefetch. Without actual write, object version,
        another internal consumer, and successor execution evidence, report taint risk, confirmed read, or execution at their
        respective levels rather than leap to successful lateral movement. Legitimate coauthoring, software release, directory
        migration, required macros, and security scanning all produce partial lookalikes, so detection and mitigation need
        approval context and local baselines.
