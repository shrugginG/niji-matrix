schema_version: 2.0.0
type: technique
id: NJT-0150
name:
  zh: 内部定向钓鱼
  en: Internal Spearphishing
summary:
  zh: 攻击者从既有受害内部身份发出定向诱导，借真实内部关系降低消息可疑性，并推动另一内部主体执行、认证或交出控制权。
  en: An adversary sends targeted inducement from an already compromised internal identity, using genuine internal relationships
    to lower message suspicion and prompt another internal principal to execute, authenticate, or surrender control.
aliases:
- T1534
classification:
  tactic_refs:
  - TA0008
  origin:
    kind: attack-adapted
    source_attack_id: T1534
    source_attack_version: '19.1'
  decision_ref: DEC-TA0008-T1534
definition_and_concept:
  paragraphs:
  - zh: 内部定向钓鱼的起点是已经被攻击者控制的组织内账户、设备或协作会话。攻击者以该来源向另一组织内用户发送带行动要求的消息，诱导其打开恶意对象、访问认证页面或执行其他可使攻击者获得第二主体权限的动作。父行为以跨主体信任转移为直接对象，邮件、聊天和文档通知只是承载方式，消息发出本身仅证明尝试，收件者行为与新账户或主机的受控结果需另证。
    en: Internal spearphishing starts from an organizational account, device, or collaboration session already under adversary
      control. The actor uses that source to send another organizational user a request to open a malicious object, visit
      an authentication page, or take another action that can yield control of a second principal. The direct object is a
      trust transfer across principals. Email, chat, and document notifications are carriers; sending proves an attempt, while
      recipient action and control of a new account or host require separate evidence.
  - zh: 该技术的匿迹概念是把恶意行动要求放进组织已有身份与关系产生的正常通信表面，同时保留可能被跨平面重建的发送、内容、点击、认证和端点痕迹。Microsoft 事件证实内部点击者随后被认定账户失陷，Proofpoint 事件证实受控邮箱发送的附件被另一员工打开后第二账户失陷；这两个结果比单纯的活动宣传或外发统计更适合建立横向结果门。
    en: Its stealth concept places a malicious request inside the ordinary communication surface supplied by existing organizational
      identities and relationships, while sending, content, click, authentication, and endpoint traces remain reconstructable
      across planes. Microsoft identified compromised accounts among internal clickers, and Proofpoint documented a second
      account compromised after an employee opened an attachment from a controlled mailbox. These outcomes support a lateral
      result gate more strongly than campaign publicity or delivery counts alone.
stealth_characteristics:
  paragraphs:
  - zh: 与来自组织外部的陌生发件者相比，真实受害内部账户可呈现正常组织地址、历史联系人和熟悉签名；攻击者改变的是消息来源与关系上下文，而不是使内容不可见。针对仅用外部来源、发件域信誉或单条消息内容判定的防守视角，恶意要求容易与普通协作混合。发送者异常登录、收件者点击、后续独立账号异常和消息对象仍形成残余痕迹。
    en: Compared with an unfamiliar external sender, a genuinely compromised internal account presents an organizational address,
      existing contacts, and sometimes a familiar signature. The adversary changes provenance and relationship context rather
      than making content invisible. A defender relying only on external-origin rules, domain reputation, or one message's
      content may blend the malicious request into ordinary collaboration. Sender sign-in anomalies, recipient clicks, subsequent
      anomalies on a separate account, and message objects remain as residual traces.
  - zh: 若攻击者还控制原发件邮箱的收件规则，可把与本次诱导主题相符的质疑、退信或警告移动、删除或标为已读，使原用户较晚发现被冒用。这一可共现变量改变的是反馈在原用户视角的位置，不等于抹除传输记录或收件者端证据；Proofpoint 的同主题归档规则与
      Microsoft 的删除并标已读规则提供独立事例，但后者没有给出规则条件与横向目标的一一对应。
    en: If the adversary also controls inbox rules on the sender mailbox, questioning replies, bounces, or warnings matching
      the campaign can be moved, deleted, or marked read, delaying the legitimate owner's awareness. This co-occurring variable
      changes where feedback appears to the owner; it does not erase transport or recipient-side evidence. Proofpoint's subject-matched
      archive rule and Microsoft's delete-and-mark-read rule are independent examples, although the latter does not establish
      a one-to-one rule condition for the lateral target.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入条件是先有同一组织内的既有受害来源，后有攻击者控制的定向消息到达另一内部主体，并存在可核查的诱导目的。将收件者打开、点击、认证、运行以及第二主体失陷分为不同证据层级；只凭“内部域名”或发送量不能断言攻击成功。合法同事共享文档、补丁通知、远程协助和批量内部通信必须由授权业务上下文排除。
    en: Inclusion requires an earlier compromised source inside the same organization, an adversary-controlled targeted message
      to another internal principal, and a reviewable inducement objective. Opening, clicking, authenticating, executing,
      and second-principal compromise are distinct evidence levels. An internal domain or high sending volume alone cannot
      prove success. Authorized colleague sharing, patch notices, support requests, and bulk internal communication require
      business-context exclusion.
  - zh: T1080 的直接对象是已经共享内容本身被污染、消费者随后读取或触发；本项的直接对象是被攻陷发件身份和主动消息触达。T1566/NJT-0057 截止于组织的首个入口；本项从既有立足点向第二主体延伸。仅交付文件而没有收件者被诱导属于
      T1570；取得第二账户后的令牌使用、远程服务连接或执行可与本项共现，但不能代替其消息和收件者证据。伪造组织显示名而无已受害内部来源时，不满足本项起点。
    en: T1080 directly concerns tainted shared content later read or triggered by a consumer; this subject directly concerns
      an abused sender identity and an actively delivered message. T1566/NJT-0057 ends at the first organizational foothold;
      this subject begins with that foothold and extends to a second principal. File arrival without induced recipient action
      belongs to T1570. Token use, remote-service access, or execution after second-account compromise may co-occur but do
      not replace message and recipient evidence. A spoofed organizational display name without an already compromised internal
      source fails this starting condition.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者进入一名员工邮箱后，读取近期往来并向内部联系人发送看似常规的文档共享请求；另一员工点击链接并完成被中间人操纵的认证，攻击者随后获得该员工账户。另一场景中，攻击者从会计人员邮箱向多名同事发送附件，并在原邮箱预置按该消息主题归档回复的规则；管理层助理打开附件后账户也被控制。场景中的真实内发件关系与第二主体结果分别由
        Microsoft 和 Proofpoint 事件支持，具体云服务或附件格式不定义技术边界。
      en: After entering an employee mailbox, an actor can inspect recent correspondence and send internal contacts a routine-looking
        document-sharing request; another employee clicks and completes an adversary-mediated authentication flow, after which
        the actor controls that employee's account. In a second setting, an actor sends an attachment from an accounting user's
        mailbox to colleagues while prepositioning a rule that archives replies matching the campaign subject; an executive
        assistant opens the attachment and also loses account control. Microsoft's and Proofpoint's incidents respectively
        support the real internal-sender relationship and second-principal outcomes; the cloud service and attachment format
        do not define this technique.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少能以受害内部身份发送消息，通常需要控制邮箱令牌、会话、终端邮件客户端或协作账户，并掌握目标、联系人或业务语境。若实施反馈压制，还须有修改该邮箱规则的权限及足以选择规则条件的活动计划。攻击者不能假定所有收件人都会行动，也不能仅凭被攻陷发送身份自动获得第二账户；认证防护、收件者复核与账号处置可中断链条。
        en: The actor must at least be able to send as a compromised internal identity, usually through a mailbox token, session,
          endpoint mail client, or collaboration account, and know the target, contacts, or business context. Feedback suppression
          additionally requires permission to modify that mailbox's rules and a campaign plan specific enough to select rule
          conditions. The actor cannot assume every recipient will act or that control of a sending identity automatically
          grants a second account; authentication controls, recipient verification, and account containment can break the
          chain.
    defender_model:
      paragraphs:
      - zh: 收件者通常只见内部联系人和消息表面；原发件账户所有人可能因规则压制而看不到质疑回复。邮件或协作平台可见发送与交付记录，身份系统可见原发件者与收件者的登录变化，浏览器、Safe Links 或端点可见点击、附件打开与后继行为。防守方需要按消息
          ID、账户对象 ID、收件者与时间连接这些视角；若缺少平台审计、点击遥测或身份关联，只能判定较低层级的尝试，不能确认第二主体失陷。
        en: Recipients commonly see only the internal contact and message surface; the legitimate sender owner may miss questioning
          replies when rules suppress them. A mail or collaboration platform can record sending and delivery, the identity
          plane can record sign-in changes for sender and recipient, and browser, Safe Links, or endpoint telemetry can record
          clicks, attachment opening, and subsequent behavior. The defender must join these views by message ID, account object
          ID, recipient, and time. Without platform audit, click telemetry, or identity correlation, the finding remains an
          attempt-level conclusion and cannot confirm compromise of the second principal.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实内部发件身份与既有关系掩盖异常诱导来源
    en: Genuine internal sender identity and existing relationships mask the anomalous request source
  analysis:
    paragraphs:
    - zh: 攻击者利用已被控制的真实组织账户向其内部联系人发送诱导，消息因此带有与业务通信一致的发件身份和关系特征。外部来源或仿冒域筛查会失去区分力，收件者也可能凭熟悉身份信任行动要求；跨邮箱审计、异常登录和第二主体后继行为仍可揭示来源与结果不匹配。两个独立现场报告都记录了此因果链，但具体欺骗成功率未公开。
      en: By sending inducement from a genuinely controlled organizational account to its internal contacts, the actor gives
        the message sender and relationship features consistent with business communication. External-origin or lookalike-domain
        filters lose discrimination, and recipients may trust the request because of the familiar identity. Cross-mailbox
        audit, anomalous sign-in, and subsequent behavior by the second principal can still expose a provenance-to-outcome
        mismatch. Two independent incident reports document this chain, but neither publishes a general deception success
        rate.
  evidence_refs:
  - REF-000606
  - REF-000607
  - REF-000608
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 活动相关回复从原发件者收件箱移走而削弱本地告警
    en: Campaign replies are removed from the original sender inbox weakening local warning
  analysis:
    paragraphs:
    - zh: 攻击者在受控发件邮箱为诱导主题设置移动或删除规则，使同事的质疑和安全提醒虽被服务器接收，却不再出现在原用户通常查看的收件箱。原用户或只盯收件箱状态的防守方看到的反馈被压低；邮件传输与规则变更审计仍保留可恢复的差分。Proofpoint
        直接把主题规则、45 名内部收件者和第二账户失陷连接起来，Microsoft 则独立报告了删除并标已读规则及后续内部钓鱼。
      en: The actor installs a move or delete rule for the campaign subject in the controlled sender mailbox. Colleagues'
        questions and security warnings may reach the service but no longer appear in the inbox normally checked by the owner.
        The owner's or an inbox-only defender's feedback is reduced, while transport and rule-change audits retain a recoverable
        difference. Proofpoint directly connects a subject rule, 45 internal recipients, and compromise of a second account;
        Microsoft independently reports a delete-and-mark-read rule followed by internal phishing.
  evidence_refs:
  - REF-000608
  - REF-000607
  - REF-000572
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 固定基线没有 ATT&CK 子项，但研究仍检查真实内部发件身份、活动回复路由、既有线程利用、协作包装和媒介。真实内部身份是父级行为的必要条件；按活动主题隐藏回复的观察差异已由 NJS-0111-001 默认视图枚举遗漏覆盖；近期线程选人并不等于向既有线程注入；平台和附件格式不形成稳定匿迹变量。因此本项目前建议无独立
        Niji 子技术，后续须以新的可控变量、痕迹变化、观察差异和独立防御证据重开分类。
      en: Although the fixed baseline has no ATT&CK children, the research tested genuine internal sender identity, campaign-reply
        routing, existing-thread use, collaboration wrappers, and media. A genuine internal identity is necessary parent behavior.
        Hiding replies by campaign subject is already covered by NJS-0111-001 Default-View Enumeration Omission. Selecting
        recipients from recent threads does not prove injection into an existing thread, and platform or attachment format
        is not a stable stealth variable. Recommend no independent Niji child at present; reopen taxonomy only with evidence
        of a new controllable variable, trace change, observation difference, and independent defense.
  coverage: deferred
  subtechnique_refs: []
