research:
  limitations:
    paragraphs:
    - zh: 公开事件提供两个独立的内部来源到第二主体失陷链，但未公开所有原始邮件、点击、认证和规则命中记录。Microsoft 的近期线程仅用于选择收件者，Proofpoint 的其他线程劫持例子属于跨组织供应商欺诈；不能据此声称本项已证实既有内部线程寄生。ESET
        的 Gamaredon 证据只支持发送行为，并有明确的低调意图反证。
      en: Public incidents give two independent internal-source-to-second-principal compromise chains but do not release complete
        raw mail, click, authentication, or rule-hit records. Microsoft's recent threads selected recipients only, and Proofpoint's
        other thread-hijacking example concerns cross-organization vendor fraud; neither establishes parasitic delivery into
        an existing internal thread here. ESET's Gamaredon evidence supports sending behavior only and expressly cautions
        against inferring a stealth focus.
    - zh: 建议的邮件分析依赖 Defender for Office 365、Safe Links、身份和邮箱审计；未采集这些数据时可用其他平台等价字段实现，但不能声称当前规则覆盖未审计的端到端加密聊天。收件者行动与新账户异常需要调查确认因果，邮件到达、规则存在或同一时间窗口的登录异常都不是独立的成功证明。
      en: The proposed mail analytics depend on Defender for Office 365, Safe Links, identity, and mailbox audit. Equivalent
        fields on other platforms can implement the logic, but the current rule cannot claim coverage of unaudited end-to-end
        encrypted chat. Recipient action and a new-account anomaly need investigative causal confirmation; delivery, rule
        existence, or a sign-in anomaly in the same time window is not independent proof of success.
