research:
  limitations:
    paragraphs:
    - zh: OpenSSH 规范直接证明同一已认证传输内可开新逻辑通道，USENIX 研究展示经运行中客户端增附通道的可行性；现无可核验的野外攻击 Case，故不能把该实现写成普遍或已证的行动者行为。SSH agent 转发签名用于建立新连接属于相邻认证材料边界，不能充当原连接的劫持证据。
      en: OpenSSH specifications establish new logical channels within one authenticated transport, and USENIX research demonstrates
        channel addition through a running client. No verifiable field intrusion Case is available, so the implementation
        cannot be described as prevalent or observed actor behavior. Forwarded SSH-agent signing used to establish a new connection
        belongs to an adjacent authentication-material boundary rather than proving takeover of the original transport.
    - zh: 通道归因依赖服务器实际提供连接与通道标识，以及跳板的 ControlPath 或 ptrace 访问日志；多数普通 sshd 审计不能直接输出完整链。正常 ControlMaster 自动化也会复用连接，缺少本地控制者差异和目标后继结果时应只记低置信调查线索。
      en: Channel attribution depends on real connection and channel identifiers from the server and ControlPath or ptrace
        access logs on the jump host; ordinary sshd audit may not expose the full chain. Legitimate ControlMaster automation
        also reuses transports, so without a local controller difference and destination outcome retain only a low-confidence
        lead.
