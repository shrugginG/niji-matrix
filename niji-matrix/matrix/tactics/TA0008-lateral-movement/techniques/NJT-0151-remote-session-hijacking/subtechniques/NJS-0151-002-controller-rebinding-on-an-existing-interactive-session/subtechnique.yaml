schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0151-002
parent_ref: NJT-0151
name:
  zh: 既有交互会话的控制端重绑定
  en: Controller Rebinding on an Existing Interactive Session
summary:
  zh: 攻击者将他人未结束的交互会话接到新客户端，后续动作沿原用户桌面和登录上下文进行。
  en: An adversary attaches another principal's unended interactive session to a new client, allowing later actions in the
    original user's desktop and logon context.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有交互会话的控制端重绑定是攻击者使已由其他内部主体创建的远程交互桌面由新端独占或并行控制，从而利用原会话的用户环境与资源权利。tscon 可迁移连接并留下重连/断开证据，RDS shadow 则可在原客户端继续在线时增加控制者；两者改变的是交互会话的控制端集合，不以
      RDP 子技术名或某个二进制划界。
    en: Controller Rebinding on an Existing Interactive Session allows an adversary to take exclusive or parallel control
      of an interactive desktop created by another internal principal, using its user environment and resource rights. tscon
      can move the attachment and leave reconnect or disconnect evidence, while RDS shadow can add a controller with the original
      client still present. Both change the controller set of the same interactive session rather than following an ATT&CK
      protocol child or one executable.
stealth_characteristics:
  paragraphs:
  - zh: 既有交互会话的控制端重绑定保留原用户桌面及进程，单看账户或新目标登录可能看不到控制者变化。独占迁移的差异是相同 LogonID/会话名下的客户端地址转换和 4778/4779；并行影子控制的差异是远程控制请求、授权/同意策略和新控制进程，而原客户端可能不变。两者均需把发起者与原用户及后续资源动作相连；正常重连或获批远程支持是反例。
    en: Controller Rebinding on an Existing Interactive Session preserves the original desktop and processes, so the account
      or new-logon view may miss the controller change. Exclusive transfer can change client address under the same LogonID
      or session name with 4778 and 4779 traces. Parallel shadow control instead produces remote-control request, permission
      or consent-policy, and controller-process traces while the original client may remain unchanged. Both need initiator-to-owner
      and downstream action joins; routine reconnection and approved remote support are counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入未授权者独占迁移或并行控制另一主体原有交互会话，并在目标上产生可证动作的事件。断开状态、会话枚举、用户自己重新连接及获批远程协助不足以成立；取得 SYSTEM 只是可能前提。同机权限提升、另建独立桌面或盗用认证材料后新建连接各有不同直接对象，不能凭高权限或相同账户名称代替会话控制端变化。
    en: Scope requires unauthorized exclusive transfer or parallel control of another principal's existing interactive session
      with a verifiable destination action. Disconnection, session enumeration, the owner's own reconnection, and approved
      remote support are insufficient; SYSTEM access is only a possible prerequisite. Same-host privilege gain, a separately
      created desktop, and a new connection using stolen authentication material have different direct objects and cannot
      substitute for evidence of controller change.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 会话主机保留另一管理员的断开或活动桌面，攻击者控制本机服务或另一会话并获得连接或影子控制权限。tscon 路径可迁移原桌面并断开旧端；shadow 路径可与旧端并存，若策略关闭同意提示则用户不一定获知，具体结果须以会话操作确认。
      en: A session host retains another administrator's disconnected or active desktop while the adversary controls a service
        or another session with connect or shadow-control rights. A tscon path can move the desktop and disconnect the previous
        client; a shadow path can coexist with that client and, where consent is disabled, may not alert the user. The result
        needs confirmation from the session operation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须识别未终结的目标会话及有效管理路径。迁移需要 Connect/Full Control 或所有者口令；影子控制需要 Remote Control/Full Control 权限，是否提示取决于 RDS 策略。会话注销、权限限制、用户同意要求或资源重新认证可阻断或暴露控制。
        en: The adversary must identify an unended session and a working management path. Exclusive transfer needs Connect
          or Full Control rights or the owner's password; shadow control needs Remote Control or Full Control rights, and
          prompting depends on RDS policy. Logoff, restricted rights, user-consent requirements, or resource reauthentication
          can block or reveal control.
    defender_model:
      paragraphs:
      - zh: 防守方对迁移路径关联原 4624 Type 10、4778/4779、4688 与客户端资产；对影子路径另采集 shadow/control 请求、同意策略及 mstsc/等效进程，并验证会话控制结果。原用户身份与审批工单可解释合法支持；不能假定
          shadow 总有 4778/4779，也不能只看二进制名称。
        en: For exclusive transfer, the defender joins original 4624 type-10, 4778 or 4779, 4688, and client asset. For shadow
          control, collect shadow or control requests, consent policy, and mstsc or equivalent process activity and verify
          the session-control result. Original-owner identity and support tickets explain legitimate help; shadowing must
          not be assumed to emit 4778 or 4779, and an image name alone is not decisive.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 原用户桌面掩盖控制端变化
    en: Let the original desktop mask a changed controller
  analysis:
    paragraphs:
    - zh: 控制端迁移或并存使新操作者使用原桌面与用户上下文，后续资源访问可保留原账户身份，降低陌生登录筛查敏感度。迁移留下断开/重连，影子控制留下控制请求、策略与进程；异常后继动作仍可揭露。免提示只在相应权限/策略下成立。
      en: Exclusive transfer or parallel shadowing gives a new operator control in the original desktop and user context,
        preserving account identity for later resource access and weakening unfamiliar-logon screening. Transfer leaves disconnect
        or reconnect traces; shadowing leaves control request, policy, and process traces. Abnormal downstream actions can
        reveal either. Promptless behavior requires the corresponding rights and policy.
