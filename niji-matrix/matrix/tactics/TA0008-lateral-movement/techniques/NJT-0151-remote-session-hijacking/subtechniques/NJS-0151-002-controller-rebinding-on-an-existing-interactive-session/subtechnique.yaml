research:
  limitations:
    paragraphs:
    - zh: Mandiant 汇总的 MAZE 现场直接记录 tscon 接管合法 RDP 会话，但没有逐个会话 ID 或事件序列。CrowdStrike 现场中 tscon 分支受阻，后来 RDS shadow 分支成功；两者不能合成一次成功的
        tscon→shadow 接管过程，也不证明每次接管都没有用户提示。
      en: Mandiant's MAZE field synthesis directly records tscon takeover of legitimate RDP sessions but lacks per-session
        IDs and event sequences. In CrowdStrike's incident the tscon branch was blocked and a later RDS shadow branch succeeded;
        they cannot be collapsed into one successful tscon-to-shadow takeover or used to claim every takeover lacked user
        notice.
    - zh: 4778/4779 与 4688 是否记录旧新客户端、命令行和同意状态取决于本地策略及传感器。帮助台支持、断线重连和合法共同控制可能同形；必须把原所有者、控制端变化、批准记录与目标结果连接后再归因，不能只用同一账户仍登录来判安全或恶意。
      en: Whether 4778, 4779, and 4688 preserve old and new clients, command lines, and consent state depends on local policy
        and sensors. Help-desk support, network reconnection, and legitimate co-control can look similar. Attribution requires
        joining original owner, controller change, approval, and target outcome rather than treating an account still logged
        on as either safe or malicious.
