research:
  limitations:
    paragraphs:
    - zh: 现有 SSH 证据为 OpenSSH 原始规范、内核权限文档和 iSSHD/SSH-Jack 技术研究，足以说明旧认证传输增通道的技术可行性与可观察点，但未找到公开的逐会话野外入侵证据。因此本轮不建立 SSH 成功 CASE，也不把
        Matrix.org 代理转发或 UNC3886 新 SSH 流重定向叙述代入。ControlMaster 新建的是同一传输内的新逻辑通道，不是原 PTY 的键盘接管；若主评审要求字段级野外案例，应延期这个子项。
      en: The SSH evidence consists of primary OpenSSH specifications, kernel access-control documentation, and iSSHD or SSH-Jack
        technical research. It establishes feasibility and observable points for adding a channel to an old authenticated
        transport, but no published per-session field intrusion chain was found. No successful SSH case should be created,
        and neither Matrix.org agent forwarding nor UNC3886 redirection of new incoming SSH traffic may be substituted. ControlMaster
        opens a new logical channel on the same transport rather than taking the keyboard of the original PTY. If primary
        review requires field incident evidence, defer this child.
    - zh: RDS 的规范文档说明连接/远程控制所需权限、命令能力和事件字段，不证明任何特定攻击。Korznikov 提供受控演示，Mandiant 在 MAZE 响应综述中报告成功 tscon 劫持，CrowdStrike 报告则明确区分被阻断的
        tscon 尝试与成功的 shadow 接管；后者还给出该事件未提示用户的具体策略条件。两份野外来源均未公开完整 4778/4779、原/新控制端和每个目标结果的日志链，所以 Analytic 的关联模式是可实施的防守设计，不是事件原文。
      en: RDS specifications establish required rights, command capabilities, and event fields, not an attack in any particular
        environment. Korznikov provides a controlled demonstration. Mandiant's MAZE response synthesis reports successful
        tscon hijacking, while CrowdStrike expressly separates a blocked tscon attempt from successful shadow control under
        a no-consent policy in that event. Neither field source publishes a complete 4778 or 4779, old and new controller,
        and per-result log chain, so analytic correlation is an implementable defender design rather than a quotation of case
        telemetry.
