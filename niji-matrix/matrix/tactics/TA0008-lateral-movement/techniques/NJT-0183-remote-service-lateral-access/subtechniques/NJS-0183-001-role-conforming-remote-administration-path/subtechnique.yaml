schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0183-001
parent_ref: NJT-0183
name:
  zh: 角色贴合的远程管理路径
  en: Role-Conforming Remote Administration Path
summary:
  zh: 攻击者让新远程连接的主体、来源资产角色、目标角色、服务和时段贴合既有管理关系，使未授权会话呈现为日常运维。
  en: An adversary aligns principal, source-asset role, destination role, service, and time of a fresh remote connection with
    an existing management relationship so the unauthorized session resembles routine operations.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 角色贴合的远程管理路径是攻击者在新建内部远程服务连接时，有意选择有权主体、承担管理或支持职能的来源资产、相应目标角色、日常启用的服务和常见时段，使完整连接落入批准或长期观察到的管理关系。稳定变量是当前连接与管理关系图之间的距离，而不是
      RDP、SSH、SMB、WinRM、账户类型或跳板产品。
    en: Role-Conforming Remote Administration Path occurs when an adversary creating a fresh internal remote-service connection
      deliberately selects an entitled principal, a source asset with a management or support role, a corresponding destination
      role, a routinely enabled service, and a familiar time so the complete connection falls within an approved or historically
      observed management relationship. The stable variable is distance between the current connection and the management
      relationship graph, not RDP, SSH, SMB, WinRM, account type, or jump-host product.
  - zh: 直接目的不是隐藏认证事件，而是让真实认证和服务会话具有日常运维解释。身份如何取得属于 Credential Access 或 NJT-0061；本项只有在连接被接受、目标产生可控动作，并且管理关系贴合降低会话局部可区分性时完成。若只有合法管理员按工单操作，或攻击者从非管理终端连接从未访问的目标，则不满足该变量。
    en: The immediate purpose is not to erase authentication but to give a real authentication and service session a routine
      operational explanation. Identity acquisition belongs to Credential Access or NJT-0061. This child completes only when
      the connection is accepted, a controlled target action occurs, and management-relationship conformity reduces local
      session distinctiveness. An authorized administrator acting under a ticket or an adversary connecting from a nonmanagement
      endpoint to a never-used destination does not satisfy the variable.
stealth_characteristics:
  paragraphs:
  - zh: 角色贴合的远程管理路径让主体、源角色、目标角色、服务和时段同时处于允许范围，目标侧只见成功认证、常见登录类型和正常管理流向。依赖异常协议、非管理员来源、陌生目标或非工作时段的规则失去区分力；真实管理员同样产生这些事件，使单点告警置信度下降。
    en: Role-Conforming Remote Administration Path places principal, source role, destination role, service, and time inside
      allowed ranges, leaving the destination with successful authentication, a familiar logon type, and an ordinary management
      direction. Rules relying on an unusual protocol, nonadministrator source, unfamiliar destination, or off-hours activity
      lose discrimination. Real administrators produce the same events, lowering point-alert confidence.
  - zh: 贴合不会使目标动作自动正常。来源端先前受控事件、同一主体并发、超出工单的目标集合、会话内命令或进程、访问量、权限变化和后继连接仍可揭示控制者。关系图过宽、共享管理员账户、资产角色陈旧或缺少目标动作遥测会增强匿迹；按主体和角色保存长期基线且不永久白名单，会限制效果。
    en: Conformity does not make target actions benign. Prior source compromise, principal concurrency, destinations beyond
      a ticket, commands or processes inside the session, access volume, authority change, and successor connections can expose
      the controller. Overbroad relationship graphs, shared administrator accounts, stale roles, or missing target-action
      telemetry strengthen the effect. Long baselines by principal and role, without permanent allowlisting, constrain it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求攻击者可控的新连接至少贴合主体、来源角色、目标角色、服务和时段中的多个关系维度，且有本地基线或批准图证明这些维度通常被接受。一个管理员账户、管理子网或原生协议单独不足；合法帮助台、备份、部署、应急响应和轮班以 owner、工单、目标范围和动作排除。偶然从管理主机发起但没有关系选择或观察差异时，只保留父级。
    en: Inclusion requires an adversary-controlled fresh connection to align across multiple relationship dimensions among
      principal, source role, destination role, service, and time, with a local baseline or approved graph showing those dimensions
      are normally accepted. An administrator account, management subnet, or native protocol alone is insufficient. Legitimate
      helpdesk, backup, deployment, incident response, and shift work are excluded through owner, ticket, destination scope,
      and action. If an actor merely happens to originate from a management host without relationship selection or observation
      difference, retain only the parent.
  - zh: NJS-0061-001 和 NJS-0055-002 改变身份登录的来源网络、地理、设备、客户端和时间风险；本项改变内部远程服务的来源资产角色—目标角色—服务—动作关系。NJT-0078 的批准部署窗口包含正式 job/agent
      事务，不是一般管理连接。经中继改变目标所见来源属于兄弟子项；共现时分别举证。
    en: NJS-0061-001 and NJS-0055-002 change identity-sign-in risk involving origin network, geography, device, client, and
      time. This child changes the internal remote-service relationship among source-asset role, destination role, service,
      and action. NJT-0078 approved deployment windows contain a formal job and agent transaction rather than an ordinary
      management connection. Changing target-visible origin through an intermediary belongs to the sibling and requires separate
      evidence when co-occurring.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得运维人员或服务主体后，从该主体日常使用的管理服务器向其负责目标建立 RDP、SSH 或 WinRM 连接，并在会话内执行超出工单的发现或控制。Microsoft 指出原生管理技术因合法用途和正常遥测提供掩护；Mandiant
        OT 红队使用环境已有 RDP、SMB 和远程执行服务时，判断其可融入后台流量。
      en: After acquiring an operator or service principal, an adversary can connect from the management server normally used
        by that principal to assigned destinations over RDP, SSH, or WinRM and perform discovery or control beyond the ticket.
        Microsoft notes that native management technologies provide cover through legitimate use and expected telemetry. Mandiant's
        OT red team assessed that RDP, SMB, and remote-execution services already present in the environment could blend with
        background traffic.
    - zh: Microsoft 另一勒索调查记录域管理员在设备间使用 RDP；DART 仍从首次连接多个服务器和异常来源发现活动。该事件说明变量边界：只要关系或动作有一维偏离，原生服务不会自动提供匿迹。
      en: 'Another Microsoft ransomware investigation records domain administrators using RDP between devices. DART still
        detected first-time connections to multiple servers and abnormal origins. The incident illustrates the variable''s
        boundary: a native service provides no automatic stealth when one relationship or action dimension diverges.'
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要有效身份、可用内部来源、目标服务权限和管理拓扑知识。它可从文档、登录历史、远程管理配置或已控主机观察主体通常管理哪些目标、使用何种服务和时段。共享管理服务器和长期高权账户降低成本；PAM/JIT、专用管理工作站、逐目标
          ACL 和工单绑定提高成本。
        en: The adversary needs valid identity, a usable internal source, destination-service authority, and management-topology
          knowledge. Documentation, logon history, remote-management configuration, or a compromised host can reveal which
          destinations a principal manages, which service it uses, and when. Shared management servers and long-lived privileged
          accounts lower cost; PAM or JIT, dedicated administrative workstations, per-destination ACLs, and ticket binding
          raise it.
      - zh: 攻击者必须保持表面贴合同时完成恶意动作。扩大目标、使用罕见工具、改变安全配置、产生大规模文件或命令扇出会破坏贴合；只登录无动作又不能完成横向目标。真实管理员并发会造成冲突和暴露。
        en: The adversary must complete malicious action while preserving surface conformity. Expanding destinations, using
          rare tools, changing security configuration, or producing broad file or command fan-out breaks conformity, while
          logon without action does not complete the lateral objective. Concurrent real administrator use creates conflict
          and exposure.
    defender_model:
      paragraphs:
      - zh: 防守方维护主体—来源角色—目标角色—服务—时段—允许动作关系，并取得连接接受、session/logon ID 和目标动作。模型按主体与业务角色区分交互、网络和服务登录，基线覆盖轮班、月结和维护周期，并连接来源端风险。批准关系只能降低路径异常分，不能屏蔽会话内动作。
        en: Defenders maintain a principal-to-source-role-to-destination-role-to-service-to-time-to-allowed-action relationship
          and receive accepted-connection, session or logon ID, and target-action evidence. The model separates interactive,
          network, and service logons by principal and role, spans shift, month-end, and maintenance cycles, and joins source
          risk. An approved relationship only lowers path anomaly and cannot suppress in-session action.
      - zh: 共享账户、DHCP/NAT、资产角色缺失和未记录应急运维会误报；没有稳定 session ID 时只能按主机、主体和受限时窗近似。工单是有期限替代解释，关闭后仍需确认实际目标和动作。
        en: Shared accounts, DHCP or NAT, missing asset roles, and undocumented emergency operations create false positives.
          Without a stable session ID, correlation is approximate by host, principal, and constrained window. A ticket is
          an expiring alternative explanation, and actual destinations and actions still require review after closure.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 既有管理关系使恶意远程会话局部同形于正常运维
    en: An existing management relationship makes a malicious remote session locally resemble normal operations
  analysis:
    paragraphs:
    - zh: 攻击者让真实身份从常用管理来源连接其通常负责的目标和服务，成功认证、登录类型与网络方向因此与正常运维相同。基于单一协议、管理员账户或允许网段的检测失去区分，形成特征伪装。Microsoft 的现场建模与 Mandiant 环境内红队直接支持混合效应；来源受控、关系图和目标动作仍可恢复差异，故为
        medium。
      en: The adversary makes a real identity connect from its usual management source to a destination and service it normally
        administers, causing authentication, logon type, and network direction to match ordinary operations. Detection based
        on one protocol, administrator account, or allowed subnet loses discrimination, producing Feature Disguise. Microsoft's
        field modeling and Mandiant's in-environment red team directly support blending. Source compromise, the relationship
        graph, and target actions restore differences, so confidence is medium.
