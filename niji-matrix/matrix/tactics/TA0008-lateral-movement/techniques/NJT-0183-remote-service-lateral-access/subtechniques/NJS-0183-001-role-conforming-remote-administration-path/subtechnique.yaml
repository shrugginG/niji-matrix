research:
  limitations:
    paragraphs:
    - zh: Mandiant OT 证据是授权红队，Microsoft 的混合结论是跨事件观察，没有公开逐会话告警概率。公开材料集中于 Windows 与 RDP/SMB/WMI/WinRM；推广到 SSH、VNC 等服务时须重建本地关系和目标动作字段。
      en: Mandiant's OT evidence is an authorized red team and Microsoft's blending conclusion is cross-incident observation
        without per-session alert probabilities. Public material concentrates on Windows and RDP, SMB, WMI, and WinRM; SSH,
        VNC, and other services require rebuilt local relationships and target-action fields.
    - zh: 基线相符不能证明攻击者研究并选择该路径；还需来源受控或攻击链证据及未授权目标结果。管理员跳板、共享账户和应急操作可能完全同形，缺 owner 和工单时只保持候选级。
      en: A baseline match does not prove adversary study or path selection. Source compromise or attack-chain evidence plus
        unauthorized target result is still required. Administrator jump hosts, shared accounts, and emergency operations
        can be isomorphic, so conclusions remain candidate-level without owner and ticket evidence.
