research:
  limitations:
    paragraphs:
    - zh: 强事件证据集中在 Windows RDP、Plink/SSH 和 netsh portproxy。OpenSSH ProxyJump 只证明新连接经跳板和 TCP 转发的语义，不证明恶意使用；推广到 VNC、WinRM 或云堡垒需重新验证来源、认证边和
        relay 遥测。
      en: Strong incident evidence concentrates on Windows RDP, Plink or SSH, and netsh portproxy. OpenSSH ProxyJump establishes
        fresh connection and TCP-forwarding semantics but not malicious use. VNC, WinRM, or cloud bastions require renewed
        origin, authentication-edge, and relay-telemetry validation.
    - zh: 多跳本身不是恶意，组织可能强制经过堡垒机。没有原始控制端、未授权 relay 使用和目标动作，不得从 localhost 或跳板来源反推攻击者；若同时跨越禁止域，应与 NJS-0168-002 分别记录。
      en: Multihop access is not malicious and may be mandatory. Without original controller, unauthorized relay use, and
        target action, localhost or jump-host origin cannot imply an adversary. If prohibited domains are also crossed, record
        NJS-0168-002 separately.
