schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0183-002
parent_ref: NJT-0183
name:
  zh: 中继来源远程会话间接化
  en: Intermediary-Origin Remote Session Indirection
summary:
  zh: 攻击者通过受控跳板、转发器或代理新建目标远程会话，使目标只看到中继来源并把原始控制谱系拆到两条连接。
  en: An adversary creates a fresh destination remote session through a controlled jump host, forwarder, or proxy so the target
    sees only the intermediary origin and the original control lineage is divided across two connections.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 中继来源远程会话间接化是攻击者在原始控制端与内部目标之间控制中继节点或转发状态，让原始入口连接在中继终止，再由中继向目标服务建立一条新的、目标会接受的认证连接。稳定变量是原始控制端与目标所记录来源之间的间接层数和可连接性，而不是
      Plink、netsh、ProxyJump、RDP 或 SSH 名称。
    en: Intermediary-Origin Remote Session Indirection occurs when an adversary controls a relay node or forwarding state
      between original controller and internal destination, terminates the ingress connection at the relay, and creates from
      it a fresh authenticated connection accepted by the destination service. The stable variable is the number and joinability
      of intermediary layers between original controller and target-recorded origin, not Plink, netsh, ProxyJump, RDP, or
      SSH.
  - zh: 本子项拥有目标远程会话的来源间接化。建立隧道、端口转发或网络桥可按 T1090、NJT-0168 或其他网络对象另记；没有目标接受的新远程服务连接及可控结果，本子项不完成。沿他人既有认证传输增加通道属于 NJS-0151-001，ProxyJump
      或转发端口上另行认证的新连接按本项处理。
    en: This child owns origin indirection of the destination remote session. Tunnel, port-forward, or network-bridge establishment
      can be recorded separately under T1090, NJT-0168, or another network object. Without a fresh destination-accepted remote-service
      connection and controlled result, this child does not complete. Adding a channel to another principal's existing authenticated
      transport belongs to NJS-0151-001, while ProxyJump or a separately authenticated fresh connection over a forwarded port
      follows this child.
stealth_characteristics:
  paragraphs:
  - zh: 中继来源远程会话间接化让目标服务把 RemoteIP、来源主机或等价字段归给跳板、代理或 localhost，原始控制端只出现在中继入口。目标单独看会话时，中继可能是批准管理源，原始端点的风险和位置被遮蔽；防守方需跨主机、接口或提供方连接两条会话。
    en: Intermediary-Origin Remote Session Indirection causes the destination service to attribute RemoteIP, source host,
      or equivalent fields to a jump host, proxy, or localhost, while the original controller appears only on relay ingress.
      Viewed only from the destination, the intermediary may be an approved management source and the original endpoint's
      risk and location are hidden. Defenders must join two sessions across hosts, interfaces, or providers.
  - zh: 中继不会消除证据。relay binary、服务、命令与配置，portproxy 注册表，监听 socket，入口/出口 flow，账户、目标 session ID 和会话内动作仍可关联；工具改名不改变双侧流量。合法堡垒机、远程支持和灾备通道同形，只有证明未授权控制者、中继和目标动作才成立。
    en: The intermediary does not erase evidence. Relay binary, service, command and configuration, portproxy registry state,
      listener, ingress and egress flows, account, destination session ID, and in-session actions remain joinable; renaming
      does not change bilateral traffic. Legitimate bastions, remote support, and recovery paths are isomorphic, so classification
      requires an unauthorized controller, relay, and target action.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求识别原始控制端、中继实例、由中继发起且目标接受的新连接以及目标可控结果，并证明目标所见来源不同于原始控制端。只发现隧道进程、监听端口、目标来自跳板的登录或两条近时独立流量均不充分。批准跳板须按 owner、原始来源、允许目标、服务、用途和期限核验。
    en: Inclusion requires identifying original controller, relay instance, a fresh destination-accepted connection originating
      from the relay, and controlled target result, while proving target-visible origin differs from the controller. A tunnel
      process, listener, destination logon from a jump host, or two close independent flows is insufficient. Approved jump
      hosts require owner, original source, allowed destination, service, purpose, and expiry validation.
  - zh: 中继若连接批准图禁止的安全域，可并记 NJS-0168-002；若路径本来允许但操作者未授权，只需本子项。复用他人既有认证传输归 NJS-0151-001；使用窃取 token/票据另行认证归对应 T1550 并可共现。公网首次入口归
      NJT-0055，本项起于既有内部立足点。
    en: If the relay connects security domains prohibited by the approved graph, NJS-0168-002 may coexist. If the path is
      allowed but controller unauthorized, only this child is needed. Reusing another principal's existing transport belongs
      to NJS-0151-001; fresh authentication with a stolen token or ticket belongs to the corresponding T1550 object and may
      coexist. A first public-network entry belongs to NJT-0055; this child begins from an internal foothold.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 威胁主体控制管理跳板后，可用 netsh portproxy 在任意监听端口接收先前受害系统连接，再转发到分段目标的 RDP。Mandiant 记录此类行为并指出可能出现 loopback 来源；目标 RDP 会话仍以攻击者凭据新建，区别于接管已有管理员会话。
      en: After controlling an administrative jump host, a threat actor can use netsh portproxy to accept a connection from
        a previously compromised system on an arbitrary listener and forward it to a segmented target's RDP service. Mandiant
        records this behavior and notes possible loopback origin. The destination RDP session remains freshly created with
        adversary-held credentials, unlike takeover of an existing administrator session.
    - zh: Microsoft 在 Exchange 攻击中观察攻击者用 Plink/SSH 建立加密转发并以窃取凭据通过 RDP 访问其他主机，认为该组合减少部署后门的需要。事件支持中继与目标会话共现，但未公开入口 flow、relay
        PID、目标 LogonId 和命令的完整连接，置信度保持中等。
      en: Microsoft observed Exchange attackers building encrypted forwarding through Plink or SSH and using stolen credentials
        to reach other hosts over RDP, assessing that the combination reduced the need for backdoors. The incident supports
        relay and target-session co-occurrence but does not expose a complete join among ingress flow, relay PID, destination
        LogonId, and command, keeping confidence medium.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制可到达原始来源和目标的中继，能创建监听、转发或代理状态，并有目标服务接受的身份材料。它须维持中继进程、两侧路径和凭据，知道跳板允许目标。应用控制、禁止配置写入、额外设备证明或任一侧隔离会失败。
        en: The adversary needs control of an intermediary reachable from origin and destination, authority to create listener,
          forwarding, or proxy state, and identity material accepted by the destination. It must maintain the relay process,
          both paths, and credentials and know allowed destinations. Application control, denied configuration writes, additional
          device proof, or isolation of either side breaks the path.
      - zh: 中继隐藏原始来源但增加可关联节点和状态。高容量交互、长期双向字节比例、异常监听、portproxy 变更、非批准 peer、跳板非典型进程或同一账户从多个中继出现会提高可见度，形成匿名性与额外痕迹的权衡。
        en: Intermediation hides original origin but adds a joinable node and state. High-volume interaction, long-lived bilateral
          byte ratios, unusual listeners, portproxy changes, unapproved peers, atypical jump-host processes, or one account
          from several relays raises visibility, creating a tradeoff between anonymity and additional artifacts.
    defender_model:
      paragraphs:
      - zh: 防守方维护批准 jump/relay 清单及原始来源—中继—目标路径，采集进程/服务、hash、命令、listener、portproxy/隧道、主体、双侧 socket/flow 和目标认证。按 relay instance、时间、端口、字节比例和协议指纹配对入口与出口，再连接目标
          session/logon ID 和动作。
        en: Defenders maintain approved jump or relay inventory and origin-to-relay-to-destination paths and collect process
          or service, hash, command, listener, portproxy or tunnel, principal, bilateral sockets or flows, and destination
          authentication. They pair ingress and egress by relay instance, time, ports, byte ratio, and protocol fingerprint,
          then join destination session or logon ID and action.
      - zh: 加密无需解密，但缺进程/socket 归因时只能靠时序和容量。共用堡垒、NAT、第三方 MSP 和动态端口降低唯一性；目标记录 localhost 时尤其需要 relay 证据。无双侧日志或原始来源保留不足时，只能报告
          relay exposure 或 origin unresolved。
        en: Encryption need not be broken, but without process or socket attribution only timing and volume remain. Shared
          bastions, NAT, third-party MSPs, and dynamic ports reduce uniqueness; localhost origin especially requires relay
          evidence. Without bilateral logs or sufficient origin retention, only relay exposure or unresolved origin can be
          reported.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 两条远程连接把原始控制端与目标所见来源分散到不同节点
    en: Two remote connections distribute original controller and destination-visible origin across different nodes
  analysis:
    paragraphs:
    - zh: 攻击者让原始连接在中继结束，并从中继建立目标接受的新连接，使控制端、转发状态和目标动作分别出现在不同观察面。目标只见跳板或 localhost，单点调查难以还原完整链，形成时空释痕。Mandiant 与 Microsoft
        直接支持跳板、转发和 RDP 共现；公开日志未完整提供全部配对字段，故为 medium。relay 配置、双侧 flow、目标 session 和动作仍能恢复谱系。
      en: The adversary terminates the original connection at an intermediary and creates a fresh destination-accepted connection,
        placing controller, forwarding state, and target action on different vantages. The destination sees only jump host
        or localhost, making a point investigation unable to reconstruct the full chain and producing Spatiotemporal Trace
        Dilution. Mandiant and Microsoft directly support co-occurring jump host, forwarding, and RDP. Public logs omit complete
        pairing fields, so confidence is medium. Relay configuration, bilateral flows, destination session, and action restore
        lineage.
