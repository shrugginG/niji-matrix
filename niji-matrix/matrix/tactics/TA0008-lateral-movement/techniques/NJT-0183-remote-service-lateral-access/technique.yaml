schema_version: 2.0.0
type: technique
id: NJT-0183
name:
  zh: 远程服务横向访问
  en: Remote-Service Lateral Access
summary:
  zh: 攻击者以已可用身份或权限在另一内部系统建立新的远程服务连接，并通过贴合管理路径或中继来源间接化降低会话与恶意目标动作的可区分性。
  en: An adversary uses already available identity or authority to create a fresh remote-service connection to another internal
    system and reduces the distinguishability of the session and malicious target action through management-path conformity
    or intermediary-origin indirection.
aliases:
- Remote Services
- T1021
classification:
  tactic_refs:
  - TA0008
  origin:
    kind: attack-adapted
    source_attack_id: T1021
    source_attack_version: '19.1'
  decision_ref: DEC-TA0008-T1021
definition_and_concept:
  paragraphs:
  - zh: 远程服务横向访问是攻击者已控制组织内主体或工作负载后，以目标服务会接受的账户、密钥、票据或等价授权建立新的远程连接、登录或调用，并在另一主机、虚拟机或内部资源上取得交互、命令或可控操作结果。直接目标是跨越系统边界并获得另一目标的操作能力；服务端必须实际接受连接，目标端必须出现会话或动作结果。端口开放、握手、认证失败、凭据持有和远程文件到达分别只是暴露、尝试、前提或相邻结果。
    en: Remote-Service Lateral Access occurs after an adversary controls a principal or workload inside an organization and
      uses an account, key, ticket, or equivalent authority accepted by the destination service to create a fresh remote connection,
      logon, or invocation and obtain interaction, command capability, or another controlled operation on a different host,
      VM, or internal resource. The immediate objective is to cross a system boundary and gain operative capability on another
      target. The service must accept the connection, and a target session or action result must exist. An open port, handshake,
      failed authentication, credential possession, and remote file arrival are respectively exposure, attempt, prerequisite,
      or adjacent outcome.
  - zh: RDP、SMB、DCOM、SSH、VNC、WinRM 及云连接只是实现表面。Niji 固定“新建、正常认证和授权、另一目标、可验证结果”四要素，并进一步要求攻击者有意控制管理关系贴合度或连接来源间接化。交互桌面、命令通道、共享访问和远程对象调用可产生不同日志，但不会据此形成协议子技术；后继执行、文件传输、账户修改或影响按各自直接对象另记。
    en: 'RDP, SMB, DCOM, SSH, VNC, WinRM, and cloud connections are implementation surfaces. Niji fixes four elements: a fresh
      connection, ordinary authentication and authorization, another target, and a verifiable result. It additionally requires
      adversary control over management-relationship conformity or connection-origin indirection. Interactive desktops, command
      channels, share access, and remote object invocations can produce different logs without becoming protocol children.
      Subsequent execution, file transfer, account change, or impact remains under its own direct object.'
stealth_characteristics:
  paragraphs:
  - zh: 远程服务横向访问保留真实服务、成功认证和正常连接形态。攻击者若从承担管理职责的内部来源、使用有权主体并选择目标日常启用的服务，目标日志可能与帮助台、运维和自动化产生相同的登录类型、服务名称和网络方向；单凭成功登录或原生协议无法区分控制者。残余包括来源主机受控迹象、主体—来源—目标—服务关系新颖度、会话扇出、非预期目标动作、并发和变更授权。
    en: Remote-Service Lateral Access preserves a real service, successful authentication, and an ordinary connection form.
      When an adversary originates from an internal system with a management role, uses an entitled principal, and selects
      a service routinely used for that target, destination logs can share logon type, service name, and network direction
      with helpdesk, operations, and automation. A successful logon or native protocol alone does not distinguish the controller.
      Residual evidence includes source compromise, novelty in the principal-source-destination-service relationship, session
      fan-out, unexpected target actions, concurrency, and change authorization.
  - zh: 攻击者还可让新连接经过受控跳板、端口转发或代理，使目标只记录中继或 localhost 来源，原始控制端停留在另一侧连接。会话因果被拆到原始来源、中继和目标三个观察面；目标会话仍存在，relay 进程、监听、配置、双侧流量和时间关系也保留。合法堡垒机、共享跳板和灾备通道具有相同表面，必须证明原始控制端、中继状态、目标连接和未授权结果。
    en: An adversary can route the fresh connection through a controlled jump host, port forward, or proxy so the destination
      records only the intermediary or localhost while the original controller remains on another connection. Session causality
      is divided across origin, intermediary, and destination. The target session remains, as do relay process, listener,
      configuration, bilateral flows, and timing. Authorized bastions, shared jump hosts, and recovery paths have the same
      surface, so classification requires the original controller, intermediary state, destination connection, and unauthorized
      result.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须证明攻击者已有内部控制点或身份材料，目标服务按正常认证和授权路径接受新连接或调用，另一目标产生可核查交互或动作，并且角色贴合或中继来源变量改变防守观察。合法帮助台、补丁、备份、管理员跳板、应急恢复、MSP 运维和云平台操作是强反例；需要结合
      owner、工单、允许源、服务、目标范围、时段和实际动作排除。只有协议使用而没有攻击者控制和观察差异时，不进入正式匿迹范围。
    en: Inclusion requires an existing internal control point or identity material, a fresh connection or invocation accepted
      through ordinary authentication and authorization, a reviewable interaction or action on another target, and a role-conformity
      or intermediary-origin variable changing defender observation. Legitimate helpdesk, patching, backup, administrator
      jump hosts, emergency recovery, MSP operations, and cloud administration are strong counterexamples and require owner,
      ticket, allowed source, service, destination scope, time, and actual action for exclusion. Protocol use without adversary
      control and an observation difference does not enter formal stealth scope.
  - zh: NJT-0149 要求软件缺陷触发，NJT-0151 要求接管他人已有传输或会话，本项要求攻击者新建其控制的认证连接。NJT-0061 拥有身份材料和认证状态；本项拥有连接到另一目标动作的横向关系。NJT-0078 的 fleet
      job—agent 链、NJT-0130 的文件到达、NJT-0064/0066/0068 的云或虚拟化管理命令结果均不由本项吸收。中继若还建立批准图禁止的跨域桥接，可同时记录 NJS-0168-002；使用批准跳板但操作者未授权仍可仅满足本项中继子轴。
    en: NJT-0149 requires a flaw trigger and NJT-0151 takeover of another principal's existing transport or session; this
      subject requires a new authenticated connection controlled by the adversary. NJT-0061 owns identity material and authentication
      state, while this subject owns the lateral relationship from connection to action on another target. NJT-0078's fleet
      job-to-agent chain, NJT-0130's file arrival, and NJT-0064/NJT-0066/NJT-0068 cloud or virtualization command outcomes
      are not absorbed here. If an intermediary also creates a prohibited inter-domain bridge, NJS-0168-002 may coexist. An
      unauthorized controller using an approved jump path can satisfy only this subject's intermediary axis.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者从受害工作站或管理服务器以已取得域身份连接其他服务器，可建立 RDP 桌面、SMB 网络登录或 WinRM/WMI 调用，再执行发现、凭据访问或勒索准备。Microsoft 对 PARINACOTA 和另一宗勒索事件分别记录
        RDP、SMB、WMI、PsExec 及域管理员跨设备 RDP；这些事件证明父行为和会话—结果链，但不证明每次连接都贴合正常管理基线。
      en: From a compromised workstation or management server, an adversary can use an acquired domain identity to reach other
        servers, create an RDP desktop, SMB network logon, or WinRM or WMI invocation, and then perform discovery, credential
        access, or ransomware preparation. Microsoft investigations of PARINACOTA and another ransomware intrusion record
        RDP, SMB, WMI, PsExec, and domain-administrator RDP between devices. These establish the parent behavior and session-to-result
        chain without showing every connection matched an ordinary management baseline.
    - zh: 在受分段网络中，攻击者可先控制有允许路由的管理跳板，再经 netsh portproxy、Plink/SSH 转发或连锁 RDP 把新连接送到仅跳板可达的目标。Mandiant 记录管理跳板 RDP 转发，Microsoft
        在 Exchange 攻击中观察到 Plink/SSH 隧道承载 RDP。中继建立与目标会话是两个可同时标注的阶段；本项只在目标接受新连接并出现可控动作时完成。
      en: In a segmented network, an adversary can control a management jump host with allowed routes and deliver a fresh
        connection to a destination reachable only from it through netsh portproxy, Plink or SSH forwarding, or chained RDP.
        Mandiant records RDP forwarding through administrative jump boxes, and Microsoft observed Plink or SSH tunnels carrying
        RDP during Exchange attacks. Relay establishment and destination session are concurrently recordable stages; this
        subject completes only when the target accepts the new connection and a controlled action follows.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须控制内部来源或使其发起连接，拥有目标服务接受的身份材料，知道地址、服务、权限和业务关系，并判断连接和目标动作是否成功。角色贴合还要求了解哪些来源资产、主体、服务、时段和目标组合被视为日常运维；中继间接化要求控制跳板、转发配置或代理并维持两侧路径。
        en: The adversary must control an internal source or cause it to connect, possess identity material accepted by the
          destination service, know address, service, authority, and business relationship, and determine whether connection
          and target action succeeded. Role conformity additionally requires knowledge of which source assets, principals,
          services, times, and destinations are treated as routine operations. Intermediation requires control of a jump host,
          forwarding configuration, or proxy and both paths.
      - zh: 登录权、网络分段、目标 ACL、MFA、设备限制和 JIT 授权均可中断。过度 fan-out、首次访问高价值目标、不符合来源角色的连接、异常命令或主体并发会提高可见度。中继增加进程、配置和第二条流量链；任一侧被隔离即失败。选择原生服务的事实本身不证明主观匿迹意图。
        en: Logon rights, segmentation, destination ACLs, MFA, device restrictions, and JIT authorization can interrupt access.
          Broad fan-out, first access to a high-value target, source-role mismatch, unusual commands, or principal concurrency
          raises visibility. Intermediation adds a process, configuration, and second flow chain and fails if either side
          is isolated. Choosing a native service alone does not prove subjective stealth intent.
    defender_model:
      paragraphs:
      - zh: 防守方需要连接身份认证、服务会话、源/目标资产和目标动作。Windows 可使用 DeviceLogonEvents 或 4624 的账户、LogonType、LogonId、RemoteIP/RemoteDeviceName，再连接
          DeviceProcessEvents 的远程会话、SessionId、LogonID 和进程谱系；其他服务需将自身审计规范化为相同关系。资产清单提供来源/目标角色、允许服务、owner、管理路径和变更窗口。
        en: Defenders need to join identity authentication, service session, source and destination assets, and target action.
          Windows can use account, LogonType, LogonId, RemoteIP, and RemoteDeviceName from DeviceLogonEvents or event 4624,
          then join remote-session, SessionId, LogonID, and process lineage from DeviceProcessEvents. Other services normalize
          their audits to the same relationship. Asset inventory supplies source and destination roles, allowed services,
          owner, management paths, and change windows.
      - zh: 中继分析还需要跳板进程/服务、监听、portproxy/隧道配置、入口与出口 socket/flow，以及目标登录来源。协议字段缺失、NAT、加密、动态地址、共用跳板、短保留期和云方不暴露来宾会话会打断谱系。没有目标动作只能确认连接，没有原始控制端与双侧
          flow 只能确认目标看到中继来源，均不足以断言恶意横向完成。
        en: Relay analysis additionally needs jump-host process or service, listener, portproxy or tunnel configuration, inbound
          and outbound sockets or flows, and destination logon origin. Missing fields, NAT, encryption, dynamic addressing,
          shared jump hosts, short retention, and cloud providers not exposing guest sessions break lineage. Without target
          action only the connection is confirmed; without original controller and bilateral flows only an intermediary-looking
          origin is known. Neither proves malicious lateral completion.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 角色贴合的原生管理关系包裹未授权远程会话
    en: A role-conforming native management relationship wraps an unauthorized remote session
  analysis:
    paragraphs:
    - zh: 攻击者选择真实远程服务、有权主体和通常承担管理职责的内部来源，让主体、来源角色、目标角色、服务和时段落入常见关系。Microsoft 指出攻击者利用 SMB、WMI、WinRM 和 RDP 融入预期遥测；Mandiant OT
        红队在实际环境使用 RDP、SMB 和远程执行服务，判断这些合法用户也使用的路径不易告警。单一登录区分度下降，形成特征伪装；来源受控、关系新颖度、扇出和目标动作仍可恢复差异。
      en: The adversary selects a real remote service, entitled principal, and internal source with a management role so principal,
        source role, destination role, service, and time fall inside a familiar relationship. Microsoft notes adversaries
        using SMB, WMI, WinRM, and RDP to blend with expected telemetry. Mandiant's OT red team used RDP, SMB, and remote-execution
        services in an actual environment and assessed that paths also used by legitimate users were unlikely to alert. One
        logon loses discrimination, producing Feature Disguise, while source compromise, relationship novelty, fan-out, and
        target action restore differences.
  evidence_refs:
  - REF-000843
  - REF-000844
  - REF-000278
  - REF-000845
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 受控中继把原始控制端与目标会话来源拆到不同观察面
    en: A controlled intermediary separates the original controller from destination session origin across vantages
  analysis:
    paragraphs:
    - zh: 攻击者让一侧连接在中继终止，另一侧由中继向目标建立新认证连接。目标日志看到中继或 localhost，原始来源只在入口侧可见；不连接 relay 状态、双侧 flow 和目标会话时，完整控制链被分散而形成时空释痕。Mandiant
        的管理跳板 RDP 转发和 Microsoft 的 Plink/SSH 隧道 RDP 调查支持该链；portproxy、relay 进程、双侧流量和目标动作仍是残余。
      en: The adversary terminates one connection at an intermediary, which creates a fresh authenticated destination connection.
        Destination logs see the relay or localhost, while the original source remains visible only on ingress. Without joining
        relay state, bilateral flows, and the destination session, the control chain is dispersed, producing Spatiotemporal
        Trace Dilution. Mandiant's administrative-jump-host RDP forwarding and Microsoft's Plink or SSH tunnel investigation
        support the chain. Portproxy, relay process, bilateral flows, and target actions remain residual.
  evidence_refs:
  - REF-000846
  - REF-000847
  - REF-000377
  - REF-000614
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 建议两个 Niji 原生子项。角色贴合的远程管理路径以主体、来源资产角色、目标角色、服务和时段相对批准管理关系的贴合度为变量，连接直接到达目标并改变单条会话的正常外观。中继来源远程会话间接化要求原始控制端与目标之间存在受控中继，改变目标所见来源并把谱系分散到两侧连接。前者不要求中继，后者即使目标关系罕见也可成立；两者可共现但不能互替，分别需要关系—动作基线和双侧
        relay—session 关联。
      en: Two Niji-native children are proposed. Role-Conforming Remote Administration Path uses conformity of principal,
        source-asset role, destination role, service, and time to an approved management relationship. Its connection reaches
        the target directly and changes the ordinary appearance of one session. Intermediary-Origin Remote Session Indirection
        requires a controlled intermediary and changes target-visible origin while dispersing lineage across two connections.
        The first needs no relay, and the second can exist even when the destination relationship is rare. They can coexist
        but do not substitute and require relationship-to-action baselining versus bilateral relay-to-session correlation.
    - zh: 八个 ATT&CK 子项全部保留为规划宽度。协议、交互性、身份材料、端口和厂商不是匿迹变量；连接与目标动作分离属于父级检测，云控制面—来宾平面断裂由 NJS-0064-001 等相邻对象承担，使用已有会话状态或接管他人会话分别由
        NJT-0055/NJT-0151 处理。长连接、低交互和分时连接因缺结论级事件与独立防御差异而延期。正式 2 项与 ATT&CK 8 项的数量差来自分类问题不同。
      en: All eight ATT&CK children remain planning breadth. Protocol, interactivity, authentication material, port, and vendor
        are not stealth variables. Connection-to-action separation is a parent detection problem; cloud control-plane-to-guest
        gaps belong to adjacent objects such as NJS-0064-001; existing session state and takeover of another session belong
        to NJT-0055 and NJT-0151. Long lifetime, low interaction, and time-spaced connections are deferred for lack of conclusion-level
        incidents and distinct defenses. The two formal children versus eight ATT&CK implementations reflects different classification
        questions.
  coverage: established
  subtechnique_refs:
  - NJS-0183-001
  - NJS-0183-002
