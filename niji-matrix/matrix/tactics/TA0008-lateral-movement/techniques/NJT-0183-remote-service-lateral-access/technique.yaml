research:
  limitations:
    paragraphs:
    - zh: MITRE 的父级与协议页面只能证明远程服务行为及其实现范围，不能独立证明角色贴合、中继来源、攻击者匿迹意图或本对象声明的检测字段。滚动页面新增的案例和检测还可能晚于本对象采用的版本，因此更窄结论均由独立现场、技术规范或遥测文档支持。
      en: MITRE parent and protocol pages establish remote-service behavior and implementation scope but do not independently
        prove role conformity, intermediary origin, attacker stealth intent, or the detection fields claimed here. Cases and
        detections added to the rolling page may also postdate the version used by this object, so narrower conclusions rely
        on independent field reporting, technical specifications, or telemetry documentation.
    - zh: 角色贴合的证据由 Microsoft 跨事件现场观察和 Mandiant 授权红队构成，没有逐会话风险分或随机对照，故为 medium。贴合也可偶然发生，必须同时有来源受控/攻击链和未授权目标动作。Windows 证据最丰富，其他协议需本地验证。
      en: Role-conformity evidence combines Microsoft cross-incident field observation and a Mandiant authorized red team,
        without per-session risk scores or randomized comparison, keeping confidence medium. Conformity may be accidental
        and requires source compromise or attack-chain evidence plus unauthorized target action. Windows evidence is strongest
        and other protocols need local validation.
    - zh: 中继项有两份独立现场报告和稳定技术语义，但未公开完整原始控制端—入口 flow—relay PID/config—出口 flow—目标 LogonId—动作链。合法堡垒高度同形；无批准路径和双侧遥测时只能判来源不可解析。
      en: The intermediary child has two independent field reports and stable technical semantics but no complete public controller-to-ingress-to-relay-PID-or-config-to-egress-to-destination-LogonId-to-action
        chain. Legitimate bastions are highly isomorphic; without approved paths and bilateral telemetry only unresolved origin
        can be concluded.
