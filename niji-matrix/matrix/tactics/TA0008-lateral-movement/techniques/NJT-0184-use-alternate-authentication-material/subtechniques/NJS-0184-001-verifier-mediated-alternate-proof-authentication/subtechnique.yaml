schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0184-001
parent_ref: NJT-0184
name:
  zh: 验证器介导的替代证明新建认证
  en: Verifier-Mediated Alternate-Proof Authentication
summary:
  zh: 攻击者以已生成材料触发当前验证事务，使目标建立新的安全上下文或签发目标证明，同时省略原始秘密与常规交互因素。
  en: An adversary uses generated material in a current verification transaction to create a fresh security context or target
    proof while omitting the original secret and ordinary interactive factors.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 验证器介导的替代证明新建认证是攻击者把系统先前生成的材料提交给当前 authentication verifier、KDC 或 token endpoint，验证成功后产生新的登录、安全上下文、service ticket 或
      access token，再用于目标资源。它不按 hash、ticket 或 refresh token 分割；稳定关系是 current presentation→verifier/authority acceptance→fresh
      context/proof，而原口令、MFA 或硬件因素没有由当前操作者重新执行。
    en: Verifier-Mediated Alternate-Proof Authentication occurs when an adversary presents material generated by the system
      earlier to a current authentication verifier, KDC, or token endpoint. Successful validation creates a fresh logon, security
      context, service ticket, or access token that is then used against a destination resource. It is not partitioned by
      hash, ticket, or refresh token. The stable relationship is current presentation to verifier or authority acceptance
      to fresh context or proof, while the current operator does not repeat the original password, MFA, or hardware-factor
      interaction.
  - zh: NTLM 路径中，hash 支持生成目标或域权威可验证的 challenge response，并在目标创建新 logon；Kerberos 路径中，被盗 TGT 可向 KDC 取得特定 SPN 的新 service ticket，被盗
      service ticket 也可由服务验证并形成本地安全上下文；OAuth 路径中，refresh 或 sign-in-session material 可由授权服务器验证后返回新的 audience-bound access token。三者协议不同，但都给防守方留下一个当前验证点和新上下文结果。
    en: In an NTLM path, the hash supports a challenge response the destination or domain authority can validate before a
      new destination logon is created. In Kerberos, a stolen TGT can obtain a new service ticket for a particular SPN from
      the KDC, while a stolen service ticket can also be validated by its service to form a local security context. In OAuth,
      refresh or sign-in-session material can be validated by an authorization server that returns a fresh audience-bound
      access token. The protocols differ, but each leaves a current verification point and a fresh-context result.
stealth_characteristics:
  paragraphs:
  - zh: 验证器介导的替代证明新建认证仍会产生“成功认证”外观：4776、4768/4769、token endpoint success 或目标 4624 可显示真实账户、允许的 encryption/grant、正常 issuer 和新
      session。与口令猜测不同，它通常没有失败序列；与交互登录不同，它不要求当前操作者重做 MFA 或出示原秘密。单看成功事件会把合法 SSO、后台刷新与材料重用混合，使真实操作者被协议有效性遮蔽。
    en: Verifier-Mediated Alternate-Proof Authentication still produces the appearance of successful authentication. Events
      such as 4776, 4768 or 4769, token-endpoint success, or destination 4624 can show a real account, allowed encryption
      or grant, a legitimate issuer, and a fresh session. Unlike password guessing it usually has no failure sequence, and
      unlike interactive sign-in it does not require the current operator to repeat MFA or present the original secret. Success
      events alone mix legitimate SSO and background refresh with material reuse, allowing protocol validity to hide the real
      operator.
  - zh: 残余差异位于验证来源与原认证谱系：同一用户的 NTLM validation 来自非许可 workstation，TGS 请求来自没有相邻合法 TGT/用户登录的设备，refresh redemption 来自异常 client/device/source，或新
      context 随即访问角色不符资源。某些平台提供 ticket hash、token family 或 correlation ID，可精确连接；旧 Windows、跨 SaaS 和本地账户验证可能只提供主体、设备、目标和时间，因此结论必须标记降级。
    en: Residual differences lie in verification origin and original-authentication lineage. NTLM validation for a user may
      come from a workstation outside the allowlist; a TGS request may originate from a device without adjacent legitimate
      TGT issuance or user logon; refresh redemption may come from an anomalous client, device, or origin; or the new context
      may immediately access resources outside the identity's role. Some platforms expose ticket hashes, token families, or
      correlation IDs for exact joins. Older Windows versions, cross-SaaS services, and local-account validation may expose
      only principal, device, target, and time, requiring an explicitly degraded conclusion.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入必须有当前验证事务及 fresh context/proof。hash dump、ticket/token 文件、Credential Guard 告警或 token acquisition 是材料取得；没有验证结果时不能标记本项。presented
      material 被拒绝时为 attempt；验证成功但没有新 context/proof 时为 verifier_accepted；生成新 context/proof 后本子项成立，后继资源操作作为父级横向结果另行关联。合法 domain
      SSO、后台 token refresh、service-account ticket、scheduled task 和票据自动续期是强反例。
    en: Inclusion requires a current verification transaction and a fresh context or proof. A hash dump, ticket or token file,
      Credential Guard alert, or token acquisition belongs to acquisition; without a validation result this child does not
      apply. Rejected presented material is an attempt. Validation without fresh context or proof is verifier_accepted. This
      child is established when fresh context or proof is created; the downstream resource operation is separately joined as the parent lateral outcome. Legitimate domain
      SSO, background token refresh, service-account tickets, scheduled tasks, and automatic ticket renewal are strong counterexamples.
  - zh: 资源只续用已有 Cookie/access token/session 而不产生当前 verification/fresh context 时由 NJS-0061-002 所有；外部网关以活动状态建立会话时也可由 NJS-0055-001
      所有。攻击者修改 verifier 或信任策略使无效材料通过归 T1556/NJT-0093；攻击者构造新 ticket/assertion/token 归 T1558/NJT-0166。正规 authority 接受被盗 TGT/refresh
      后签发新 proof 仍属本项，因为材料是原件且验证规则未改。
    en: Resource continuation through an existing cookie, access token, or session without a current verification and fresh
      context belongs to NJS-0061-002, and live-state creation of an external gateway session can also belong to NJS-0055-001.
      Modified verifiers or trust policy that accept otherwise invalid material belong to T1556 or NJT-0093; adversary construction
      of a new ticket, assertion, or token belongs to T1558 or NJT-0166. A legitimate authority issuing fresh proof after
      accepting a stolen TGT or refresh token remains here because the material is an original and validation rules are unchanged.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在已控服务器上取得帮助台或管理员的 NTLM hash，以远程执行工具触发目标 NTLM 认证。域控制器记录该账户从受害源工作站的 credential validation，目标建立 Type 3 或相应新登录并启动服务/命令。UNC6692
        从备份服务器取得 LSASS dump 后使用高权 hash 进入域控制器，直接支持这一完整场景；公开报告未披露每条 4776/4624 字段，Analytic 字段仍来自 Microsoft 官方事件定义。
      en: An adversary obtains an NTLM hash for a help-desk operator or administrator on a compromised server and uses a remote-execution
        path that triggers NTLM authentication at a destination. A domain controller records credential validation for the
        account from the compromised source workstation, while the destination creates a type-3 or corresponding fresh logon
        and starts a service or command. UNC6692 obtained an LSASS dump from a backup server and used elevated hashes to enter
        domain controllers, directly supporting the complete scenario. The public report does not disclose every 4776 and
        4624 field; analytic fields come separately from Microsoft's event definitions.
    - zh: 攻击者把从另一主机取得的 TGT 注入可控上下文，从该设备向 KDC 请求文件服务器、域控制器或管理服务的 service ticket；或者以被盗 refresh token 向授权服务器取得新 access token。KDC/token
        service 的响应是真实且新鲜的，目标可见新 ticket/token，原始交互认证却发生在别处或早已结束。Microsoft 的 overpass-the-hash 关联示例与 Kerberos/OAuth 规范支持能力和观察拓扑，不把它们升级为特定受害者事件。
      en: An adversary injects a TGT acquired on another host into a controlled context and requests a service ticket from
        the KDC for a file server, domain controller, or management service, or redeems a stolen refresh token at an authorization
        server for a fresh access token. The KDC or token-service response is genuine and newly issued, while original interactive
        authentication occurred elsewhere or ended earlier. Microsoft's overpass-the-hash correlation scenario and the Kerberos
        and OAuth specifications support capability and observation topology and are not promoted into a specific victim incident.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须控制被目标 verifier 接受的完整 proof input，并满足时间、realm/tenant、audience/SPN、client、scope 与任何 sender/device binding。hash
          路径需要协议客户端或工具完成 challenge response；TGT/refresh 路径还需要访问 KDC/token endpoint 和处理返回材料；service ticket 直接验证则需要匹配目标服务。材料过期、被撤销、账户禁用、时钟偏差、auth
          silo、NTLM restriction 或 binding key 缺失会阻断。
        en: The adversary must control complete proof input accepted by the target verifier and satisfy time, realm or tenant,
          audience or SPN, client, scope, and any sender or device binding. A hash path needs a protocol client or tool to
          complete challenge response. A TGT or refresh path also needs access to the KDC or token endpoint and handling of
          returned material. Direct service-ticket validation needs a matching target service. Expiry, revocation, account
          disablement, clock skew, authentication silos, NTLM restriction, or a missing binding key can block the path.
    defender_model:
      paragraphs:
      - zh: 防守方假定能在 authority/verifier 和目标至少各取得一个观察面，并有 identity-to-device 基线。Windows 可关联 4776 SourceWorkstation、4768/4769
          ClientAddress/ServiceName/TicketOptions/EncryptionType 与目标 4624 LogonID/AuthenticationPackage/IpAddress，再连接 service/process/resource；token
          service 则关联 grant type、client、subject、token family、audience/scope、device/binding、source 和下游 API。原始材料不可集中化。
        en: Assume the defender has at least one observation point at the authority or verifier and one at the destination,
          plus an identity-to-device baseline. Windows can correlate 4776 SourceWorkstation and 4768 or 4769 ClientAddress,
          ServiceName, TicketOptions, and EncryptionType with destination 4624 LogonID, AuthenticationPackage, and IpAddress
          and then with service, process, or resource activity. A token service joins grant type, client, subject, token family,
          audience and scope, device or binding, source, and downstream API. Raw material must not be centralized.
      - zh: 并非所有事件都能区分“原口令”与“hash 重用”，也不能由缺少 4768 判定 TGT 被盗：票据可来自缓存、跨域、离线或日志保留外。高置信结论还需要源端攻击者进程/材料控制、同一 proof/ticket/token
          的安全标识、非许可设备或异常后继结果之一；没有这些条件时输出 lineage_gap 或 suspected_material_reuse，而不是断言 Pass-the-Hash/Ticket。
        en: Not every event distinguishes original-password use from hash reuse, and missing 4768 does not prove a stolen
          TGT because tickets can be cached, cross-realm, offline, or outside retention. High confidence additionally needs
          source-end adversary process or material-control evidence, a safe identifier for the same proof, ticket, or token,
          an unauthorized device, or an anomalous follow-on result. Without those conditions, emit lineage_gap or suspected_material_reuse
          rather than asserting Pass-the-Hash or Pass-the-Ticket.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 当前验证保留成功事件却省略原始交互证明
    en: Current verification preserves success events while omitting the original interactive proof
  analysis:
    paragraphs:
    - zh: 攻击者让 verifier 接受可复用派生材料或 ticket/token，产生正常 validation、proof issuance 与 fresh context，但当前链不含原始口令、MFA 或硬件因素。痕迹变化不是“没有认证”，而是只剩协议成功和派生事件；若防守方不把
        source device、原认证和新 context 连接，验证成功会充当正常解释并遮蔽操作者。4776/4769/token endpoint 与目标结果的跨面关联可恢复断点。
      en: The adversary has a verifier accept reusable derivative material or a ticket or token, producing normal validation,
        proof issuance, and a fresh context without the original password, MFA, or hardware factor in the current chain. The
        trace change is not absence of authentication; it is retention of protocol success and derivation events alone. If
        the defender does not join source device, original authentication, and fresh context, successful validation supplies
        a normal explanation that hides the operator. Cross-plane correlation from 4776, 4769, or a token endpoint to destination
        outcome can recover the break.
  confidence: high
  evidence_refs:
  - REF-000850
  - REF-000851
  - REF-000853
  - REF-000855
  - REF-000856
  - REF-000815
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 新签发证明延续真实主体与权威外观
    en: Freshly issued proof preserves the authentic principal and authority appearance
  analysis:
    paragraphs:
    - zh: TGT/refresh 等上游材料通过正规 KDC 或 authorization server 换取新 service/access token，目标看到当前签发时间、正确签名、subject 与 audience；NTLM
        验证也返回真实账户成功。攻击者由此把操作包裹在新鲜而合法的 proof 外观中。发行—使用谱系、异常 client/device、缺少相邻原认证与角色不符结果仍可揭露，故该机理不是不可见。
      en: Upstream material such as a TGT or refresh token obtains a fresh service or access token from a legitimate KDC or
        authorization server, so the destination sees current issue time, valid signature, subject, and audience. NTLM validation
        likewise returns success for a real account. The adversary thereby wraps operations in fresh legitimate proof. Issuance-to-use
        lineage, anomalous client or device, missing adjacent original authentication, and role-inconsistent results can still
        reveal it, so the mechanism is not invisibility.
  confidence: medium
  evidence_refs:
  - REF-000852
  - REF-000856
  - REF-000815
  - REF-000859
