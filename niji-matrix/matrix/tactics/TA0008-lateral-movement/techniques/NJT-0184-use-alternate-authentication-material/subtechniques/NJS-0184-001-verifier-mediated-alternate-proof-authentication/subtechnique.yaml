research:
  limitations:
    paragraphs:
    - zh: 证据强度跨材料不均衡。UNC6692 一手事件直接证明 hash→NTLM authentication→域控制器结果；UNC6395 和 Microsoft token 报告直接证明 OAuth token/Cookie
        资源使用与已认证状态继承。Kerberos TGT→TGS 和 OAuth refresh→access 的观察拓扑主要由 Microsoft/IETF 规范及 Microsoft overpass detection scenario
        支持，未建立新的具名 victim Case。正式子项应以跨材料技术变量成立，但不得把 capability 文档包装成同一野外事件或宣称相同流行度。
      en: Evidence strength differs across materials. The first-party UNC6692 incident directly establishes hash to NTLM authentication
        to domain-controller result. UNC6395 and Microsoft token reporting directly establish OAuth token or cookie resource
        use and inherited authenticated state. The observation topology for Kerberos TGT-to-TGS and OAuth refresh-to-access
        is grounded mainly in Microsoft or IETF specifications and Microsoft's overpass detection scenario, without a new
        named-victim Case. The formal child can stand on the cross-material technical variable, but capability documentation
        must not be presented as one field incident or equal prevalence.
    - zh: Windows 原生日志通常不说明当前操作者提交的是明文口令还是 hash，4769 是高频正常事件，缺 4768 也可能由票据缓存、跨域或保留期造成。SaaS/IdP 对 token family、refresh grant、binding
        key、resource request 的字段与保留期差异更大。Analytic 因而必须先记录 coverage、使用 exact ID 时的强关联与仅按主体/时间时的弱关联，并要求 source controller 或异常目标结果；不能以日志空白补全攻击链。
      en: Native Windows logs usually do not state whether the current operator supplied a plaintext password or a hash. Event
        4769 is a high-volume normal event, while missing 4768 can result from ticket cache, cross-realm behavior, or retention.
        SaaS and IdP fields and retention for token family, refresh grant, binding key, and resource request vary even more.
        Analytics must record coverage first, distinguish strong exact-ID joins from weak principal-and-time joins, and require
        source-controller or anomalous-destination evidence; missing logs cannot complete the attack chain.
    - zh: 设备或 sender binding 只在支持的 client/resource 上起作用。Microsoft Token Protection 明确存在平台与应用覆盖限制，RFC 9700 的 mTLS/DPoP 也需要部署方实现；攻击者控制原设备、进程和
        binding key 时仍可满足证明。严格 NTLM 阻断、短 ticket/token 寿命、频繁 step-up 与全局撤销会中断旧应用、服务账户、离线客户端和灾备，必须审计先行、分阶段实施并逐目标验证实际拒绝。
      en: Device or sender binding works only on supported clients and resources. Microsoft Token Protection has explicit
        platform and application coverage limits, and RFC 9700 mTLS or DPoP requires deployment support. An adversary controlling
        the original device, process, and binding key may still satisfy proof. Strict NTLM blocking, short ticket or token
        lifetimes, frequent step-up, and global revocation can disrupt legacy applications, service identities, offline clients,
        and disaster recovery and therefore require audit-first staged deployment and per-destination verification of actual
        denial.
