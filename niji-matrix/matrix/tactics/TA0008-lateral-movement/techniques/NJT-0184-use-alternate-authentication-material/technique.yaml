schema_version: 2.0.0
type: technique
id: NJT-0184
name:
  zh: 替代认证材料横向使用
  en: Lateral Use of Alternate Authentication Material
summary:
  zh: 攻击者提交系统已生成的替代认证材料，使目标在没有原始秘密或常规交互因素的情况下建立或续用身份状态，并由此访问另一内部资源。
  en: An adversary presents system-generated alternate authentication material so a target establishes or continues identity
    state without the original secret or ordinary interactive factors, enabling access to another internal resource.
aliases:
- Use Alternate Authentication Material
- T1550
classification:
  tactic_refs:
  - TA0008
  origin:
    kind: attack-adapted
    source_attack_id: T1550
    source_attack_version: '19.1'
  decision_ref: DEC-TA0008-T1550
definition_and_concept:
  paragraphs:
  - zh: 使用替代认证材料是攻击者控制一个由正规身份、操作系统或应用流程先前生成的可提交认证工件，并把它交给认证权威、协议验证器或依赖方；目标在材料仍有效且约束满足时，为相应主体建立新的登录/安全上下文、签发派生证明，或接受既有会话状态。工件可以是挑战响应所需的秘密派生物、票据、访问/刷新令牌、Cookie
      或等价状态，但材料类别不定义 Niji 子项。
    en: Use of Alternate Authentication Material occurs when an adversary controls a presentable authentication artifact previously
      generated by a legitimate identity, operating-system, or application process and submits it to an authentication authority,
      protocol verifier, or relying party. If the artifact remains valid and its constraints are satisfied, the target establishes
      a new logon or security context, issues derived proof, or accepts established session state for the represented principal.
      The artifact may be a secret derivative used in challenge response, a ticket, an access or refresh token, a cookie,
      or equivalent state, but material class does not define a Niji child.
  - zh: 在 TA0008 下，成功还要求材料使用越过攻击者原控制点并产生另一内部系统、云控制面、SaaS 资源、租户或服务上的可控结果。一次 hash/ticket/token 验证成功只证明身份材料被接受；若没有另一资源的会话、授权请求或后继操作，只能记录材料使用成功，不能自动称为横向移动。相反，资源动作可证明
      possession，却不能反推材料如何取得、是否伪造或具体从哪个进程导出。
    en: Under TA0008, completion additionally requires the material use to cross beyond the adversary's original control point
      and produce a controllable outcome on another internal system, cloud control plane, SaaS resource, tenant, or service.
      Successful hash, ticket, or token validation proves acceptance of the authentication material. Without a session, authorization
      request, or follow-on action on another resource, it establishes material use but not lateral movement. Conversely,
      a resource action can prove possession without revealing how the material was acquired, whether it was forged, or which
      process exported it.
stealth_characteristics:
  paragraphs:
  - zh: 替代材料把操作者从原始认证交互中分离。验证器可以看到真实账户、有效 hash 派生响应、受 KDC/issuer 签名的 ticket/token、正确 audience/scope 或已完成 MFA 的 Cookie，却看不到当前操作者亲自提供口令、硬件因素或原设备证明。验证与目标授权因此继续显示合法主体和正常协议结果，粗粒度规则容易把攻击者请求解释为单点登录、后台续期或普通服务访问。
    en: Alternate material separates the current operator from the original authentication interaction. A verifier may see
      a real account, a valid hash-derived response, a KDC- or issuer-signed ticket or token, correct audience and scope,
      or a cookie carrying completed MFA, while never seeing the current operator provide the password, hardware factor, or
      original device proof. Validation and destination authorization therefore retain a legitimate principal and normal protocol
      outcome, allowing coarse rules to interpret adversary requests as single sign-on, background renewal, or ordinary service
      access.
  - zh: 痕迹随观察拓扑改变。NTLM 或等价验证会留下权威侧 credential validation 与目标登录；TGT、refresh token 或可派生材料可在 KDC/token endpoint 留下新 proof 请求；service
      ticket、access token 和 Cookie 可能直接由目标资源或本地缓存验证，使身份权威在使用时没有事件。残余证据包括材料/票据/token 的安全标识或 family、issuer、subject、audience、scope、issued-at/expiry、绑定键/设备、验证来源、目标会话和首个资源动作。无法取得安全材料标识时，主体、源设备、SPN/resource、验证结果和时间只能形成降级关联。
    en: Residue changes with the observation topology. NTLM or an equivalent verifier leaves credential validation at the
      authority and a destination logon. A TGT, refresh token, or other derivation-capable material can leave a fresh proof
      request at a KDC or token endpoint. A service ticket, access token, or cookie may be validated directly by the destination
      resource or local cache, leaving no identity-authority event at use time. Residual evidence includes a safe material,
      ticket, or token identifier or family, issuer, subject, audience, scope, issue and expiry time, binding key or device,
      validation origin, destination session, and first resource action. Without a safe material identifier, principal, source
      device, SPN or resource, validation result, and time provide only degraded correlation.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求材料在本次使用前已经由系统生成并进入攻击者控制，攻击者随后实际提交该材料或用其完成协议证明，目标接受并出现另一内部资源结果。材料的存在、导出文件、内存读取、token claims、ticket cache、hash dump、提交尝试或拒绝分别只证明前提或
      attempt。合法 SSO、应用 refresh、服务账户、票据续期、浏览器恢复、管理员自动化和灾难恢复会产生同形事件，必须以所有者、批准 client/device、允许来源、audience/scope、时间和资源用途排除。
    en: Inclusion requires material already generated by the system and under adversary control before this use, actual presentation
      of the material or completion of protocol proof with it, target acceptance, and a result on another internal resource.
      Material presence, an exported file, a memory read, token claims, a ticket cache, a hash dump, a presentation attempt,
      and a rejection respectively establish only prerequisites or an attempt. Legitimate SSO, application refresh, service
      identities, ticket renewal, browser recovery, administrator automation, and disaster recovery create the same event
      shapes and require owner, approved client or device, permitted origin, audience and scope, time, and resource purpose
      as exclusions.
  - zh: NJT-0178/T1528 以完整 access/refresh material 返回、读取或复制到攻击者接收者为完成点，T1550 从其后“材料被呈现”开始；正规 token endpoint 因 refresh material
      返回新 access token时，两者可分别记录 input use 与 output acquisition。NJT-0166/T1606、T1558 及其他伪造对象拥有权威链外构造的新材料；T1556/NJT-0093 拥有
      verifier、provider、trust 或策略被修改后产生的异常接受。已盗原件按原验证规则被使用才属于本对象。
    en: NJT-0178 or T1528 completes when full access or refresh material is returned, read, or copied into an adversary recipient;
      T1550 begins when that material is presented. When a legitimate token endpoint returns a new access token in response
      to refresh material, input use and output acquisition can be recorded separately. NJT-0166 or T1606, T1558, and other
      forgery objects own newly constructed material outside the authoritative chain. T1556 or NJT-0093 owns anomalous acceptance
      caused by modified verifiers, providers, trust, or policy. This object applies when a stolen original is used under
      the existing validation rules.
  - zh: 资源直接接受仍有效 Cookie/access token/browser state 而没有新完整认证链时，接受和使用的匿迹变量已由 NJS-0061-002“既有认证会话续用”拥有；外部 VPN/网关的新会话重放另由 NJS-0055-001
      所有。T1550 可与它们共映射材料呈现阶段，但不重复建立“会话续用”子项。NJT-0151 要求控制者进入同一个既有远程传输或交互会话；T1550 则用材料触发另一验证、派生或资源接受，即使最终账户相同也不是会话控制端接管。
    en: When a resource directly accepts a still-valid cookie, access token, or browser state without a fresh complete authentication
      chain, NJS-0061-002, Reuse of Established Authenticated Sessions, already owns the acceptance-and-use stealth variable;
      creation of a new external VPN or gateway session by replay is separately owned by NJS-0055-001. T1550 can co-map the
      material-presentation stage without creating another session-reuse child. NJT-0151 requires the adversary to enter the
      same existing remote transport or interactive session. T1550 instead uses material to trigger another validation, derivation,
      or resource acceptance, even when the represented account is unchanged.
  - zh: T1021 拥有远程服务连接与目标交互，T1550 拥有其中替代材料的认证输入。一次 Pass-the-Hash 后通过 SMB/WinRM 控制目标可分别标注材料验证和远程服务结果；不能由远程连接成功推断使用了 hash，也不能由验证成功推断已取得目标控制。进程访问
      token、线程模拟和本地主体切换若没有跨主机/资源认证，属于对应的进程令牌或权限技术。
    en: T1021 owns the remote-service connection and destination interaction, while T1550 owns alternate material as the authentication
      input. Pass-the-Hash followed by SMB or WinRM control can be labeled separately as material validation and remote-service
      outcome. Remote connection success does not prove hash use, and validation success does not prove destination control.
      Process access tokens, thread impersonation, and local principal switching without cross-host or cross-resource authentication
      belong to the relevant process-token or privilege technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在 Windows 域场景中，攻击者从一台已受害主机获得另一个账户的 NTLM hash、TGT 或 service ticket。hash 可用于完成 NTLM challenge-response 并在目标形成新的网络登录；TGT
        可向 KDC 请求目标 SPN 的 service ticket；现成 service ticket 可直接交给对应服务。UNC6692 在备份服务器导出 LSASS 内存后，以高权账户 hash 横向进入域控制器并执行取证与目录数据收集，证明“材料—验证—另一主机结果”链。
      en: In a Windows domain, an adversary obtains another account's NTLM hash, TGT, or service ticket from a compromised
        host. The hash can complete NTLM challenge response and create a new network logon at a destination. A TGT can request
        a service ticket for a target SPN from the KDC, while an existing service ticket can be presented directly to its
        service. UNC6692 exported LSASS memory from a backup server and then used elevated-account hashes to enter domain
        controllers laterally and perform forensic-tool and directory-data collection, establishing a material-to-validation-to-other-host
        result chain.
    - zh: 在云与 SaaS 场景中，攻击者可把已取得 OAuth access token 直接提交给 resource server，或以 refresh/sign-in-session material 向授权服务器换取新的 audience-bound
        access token，再访问邮件、CRM、代码或管理 API。UNC6395 使用与既有 Salesloft Drift 集成相关的被盗 OAuth token 访问多个客户 Salesforce 实例和少量 Workspace
        邮箱；Microsoft 还记录 Cookie/token 在另一浏览器重放并继承已完成 MFA 状态。前者证明 token 资源使用，后者同时说明直接状态续用的既有 Niji 边界。
      en: In cloud and SaaS environments, an adversary can present an acquired OAuth access token directly to a resource server
        or redeem refresh or sign-in-session material at an authorization server for a new audience-bound access token before
        reaching mail, CRM, code, or management APIs. UNC6395 used compromised OAuth tokens associated with existing Salesloft
        Drift integrations to access multiple customer Salesforce instances and a small number of Workspace mailboxes. Microsoft
        also documents cookie or token replay in another browser inheriting completed MFA state. The former establishes token
        use against resources, while the latter also illustrates the existing Niji boundary for direct session-state continuation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须拥有可提交的完整材料及其协议所需伴随状态，并知道对应 identity、tenant/domain、issuer/KDC、audience/SPN、scope、有效期和目标。NTLM hash 需要能完成相应挑战响应，Kerberos
          ticket 需要匹配 realm、服务和时间，bearer token/cookie 必须仍被目标接受；sender-constrained 或 device-bound token 还要求绑定私钥、设备上下文或在原设备上执行。只有
          claims、token ID、掩码日志或不可用 ticket 文件不足以完成。
        en: The adversary needs complete presentable material and any companion state required by its protocol, plus knowledge
          of the corresponding identity, tenant or domain, issuer or KDC, audience or SPN, scope, lifetime, and target. An
          NTLM hash must support the required challenge response; a Kerberos ticket must match realm, service, and time; and
          a bearer token or cookie must remain acceptable to the target. A sender-constrained or device-bound token additionally
          requires the binding private key, device context, or execution on the original device. Claims, a token ID, masked
          logs, or an unusable ticket file are insufficient.
      - zh: 攻击者能选择直接呈现 target-ready material，或使用 TGT/refresh 等上游材料向权威派生新的目标证明；两条路径改变日志所在位置。直接材料减少当前权威事件但更易暴露来源/设备跳变，派生路径产生正规新票据/令牌并可更新
          issued-at/audience 外观，却留下 KDC/token endpoint 请求。使用真实受控设备、设备指纹或绑定密钥可保留更多情境，但这些变量分别与 NJS-0061-001、NJS-0050-004 及材料绑定控制相交，不能由材料使用自动推定。
        en: The adversary can present target-ready material directly or use upstream material such as a TGT or refresh token
          to derive fresh target proof through an authority, changing where logs appear. Direct use reduces current authority
          events but can expose origin or device transitions. Derivation yields a legitimately signed ticket or token with
          fresh issue time and audience while leaving a KDC or token-endpoint request. Operating on a controlled genuine device
          or carrying device fingerprints or binding keys can preserve more context, but those variables intersect NJS-0061-001,
          NJS-0050-004, and material-binding controls and cannot be inferred from material use alone.
    defender_model:
      paragraphs:
      - zh: 防守方需要同时观察材料验证面和目标结果面。Windows 至少包括 DC/权威侧 4776、4768、4769 或等价协议记录，目标侧 4624 Logon ID、AuthenticationPackage、LogonType、源工作站/IP
          与服务/进程结果；云/SaaS 包括 token endpoint/grant、safe token/family ID、client、subject、issuer、audience/scope、device/binding、source、resource
          allow 和 API audit。原始 hash、ticket、token 或 Cookie 不应写入集中日志，应使用提供方 ID、ticket hash（若平台可靠提供）或受限 HMAC 指纹。
        en: The defender needs both the material-validation plane and the destination-outcome plane. On Windows this includes
          domain-controller or authority events such as 4776, 4768, and 4769 or protocol equivalents, plus destination 4624
          Logon ID, AuthenticationPackage, LogonType, source workstation or IP, and service or process outcomes. Cloud and
          SaaS visibility includes token-endpoint grant, a safe token or family identifier, client, subject, issuer, audience
          and scope, device or binding state, source, resource allow, and API audit. Raw hashes, tickets, tokens, and cookies
          must not enter centralized logs; use provider identifiers, ticket hashes where a platform reliably exposes them,
          or restricted HMAC fingerprints.
      - zh: 防守结论按 material_exposed、presentation_attempt、verifier_accepted、fresh_context_created 或 established_state_accepted、remote_resource_access
          分级。4776/4769、token refresh 或资源 allow 在合法 SSO 和自动化中极常见，单事件不能识别真实操作者；需连接预期来源设备、该身份近期认证、绑定/受众验证、并发活动、目标敏感度和攻击者后继动作。若身份权威与资源不共享稳定
          ID，只能明确 coverage gap 和降低置信度。
        en: Defender conclusions should be tiered as material_exposed, presentation_attempt, verifier_accepted, fresh_context_created
          or established_state_accepted, and remote_resource_access. Events such as 4776, 4769, token refresh, and resource
          allow are common in legitimate SSO and automation and cannot identify the real operator alone. They need joins to
          expected source device, recent authentication for the identity, binding and audience validation, concurrent activity,
          destination sensitivity, and adversary follow-on action. When identity authorities and resources share no stable
          identifier, record the coverage gap and lower confidence.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以已生成材料省略原始秘密与常规交互因素
    en: Use generated material to omit the original secret and ordinary interactive factors
  analysis:
    paragraphs:
    - zh: 攻击者提交 hash 派生证明、ticket、token 或 Cookie，使验证器沿用早先认证结果、材料签名或缓存状态，而不重新采集原口令、MFA 或硬件因素。行为设计把关键操作者变化移出常规认证交互；痕迹从 credential/MFA
        challenge 变成 credential validation、TGS/token refresh、resource-local validation 和后继 session。只监测口令/MFA 失败或交互登录的防守方会漏掉当前操作者，形成行为透明。Windows、OAuth
        与 Microsoft token 资料直接支持省略关系，具体日志覆盖因协议而异。
      en: The adversary presents hash-derived proof, a ticket, token, or cookie so the verifier relies on an earlier authentication
        result, material signature, or cached state rather than reacquiring the original password, MFA, or hardware factor.
        This design moves the critical operator change outside ordinary authentication interaction. Traces shift from credential
        and MFA challenge to credential validation, TGS or token refresh, resource-local validation, and a later session.
        Defenders monitoring password or MFA failure and interactive sign-in alone miss the current operator, producing Behavioral
        Transparency. Windows, OAuth, and Microsoft token sources directly support the omitted interaction, although log coverage
        differs by protocol.
  confidence: high
  evidence_refs:
  - REF-000849
  - REF-000851
  - REF-000850
  - REF-000858
  - REF-000070
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 正规主体与有效材料外观掩盖真实操作者
    en: Legitimate principal and valid-material appearance masks the actual operator
  analysis:
    paragraphs:
    - zh: 目标接受的工件仍携带真实主体、合法 issuer/KDC 签名、可接受的 challenge response、audience/scope 或已完成认证声明，因此资源日志显示批准账户与正常 allow，而不是攻击者自建身份。攻击者借材料的真实来源和协议有效性包裹后继操作，降低按用户名、签名或成功状态区分的能力。设备/来源变化、发行—使用断点、绑定失败、同一材料跨设备并发及角色不符的资源行为仍是残余差异；UNC6692、UNC6395
        和 Cookie 重放事件支持操作者与可见身份分离。
      en: An accepted artifact still carries a real principal, legitimate issuer or KDC signature, acceptable challenge response,
        audience and scope, or completed-authentication claims. Resource logs therefore show an approved account and normal
        allow rather than an attacker-created identity. The adversary wraps follow-on operations in the material's authentic
        provenance and protocol validity, weakening classification by username, signature, or success state. Device or origin
        change, issuance-to-use discontinuity, binding failure, concurrent cross-device use, and role-inconsistent resource
        behavior remain. UNC6692, UNC6395, and cookie-replay reporting support separation between actual operator and visible
        identity.
  confidence: medium
  evidence_refs:
  - REF-000857
  - REF-000178
  - REF-000070
  - REF-000859
subtechnique_taxonomy:
  coverage: established
  narrative:
    paragraphs:
    - zh: 建议一项新 Niji 子项“验证器介导的替代证明新建认证”，稳定变量是攻击者以已有材料触发当前 verifier/authority 验证并形成新的登录、安全上下文或派生目标证明。它跨越 NTLM hash challenge
        response、TGT 请求 service ticket、refresh/sign-in-session material 换取新 access token 等实现；痕迹集中在 verifier/KDC/token endpoint
        与新 context，而不是材料名称。TGT→TGS 与 refresh→access 可在新上下文前多一层权威派生，NTLM 可直接验证，但二者均产生当前验证事务并需要类似的预期来源与原认证关联。
      en: Propose one new Niji child, Verifier-Mediated Alternate-Proof Authentication. Its stable variable is an adversary
        using existing material to trigger current verifier or authority validation that creates a fresh logon, security context,
        or derived target proof. It spans NTLM hash challenge response, a TGT requesting a service ticket, and refresh or
        sign-in-session material obtaining a new access token. Residue concentrates at the verifier, KDC, or token endpoint
        and the new context rather than following material names. TGT-to-TGS and refresh-to-access add authority-mediated
        derivation before the fresh context, while NTLM can validate directly, but both produce a current verification transaction
        needing expected-origin and original-authentication correlation.
    - zh: “资源直接接受既有 bearer/cookie session state”确有不同观察拓扑：使用时 IdP/KDC 可能无事件，资源只看到真实 session/token 继续。然而 NJS-0061-002 已按同一稳定变量、痕迹和防御拥有该行为，NJS-0055-001
        又拥有远程网关的活动状态重放；本批不为 T1550 复制子项。设备/来源情境移植由 NJS-0061-001 或 NJS-0050-004 表达，材料取得由 NJT-0178 表达，proof 伪造由 NJT-0166/T1558
        表达。四个 ATT&CK 子项仅作为材料与协议宽度，均未导入。
      en: 'Direct resource acceptance of established bearer or cookie session state has a different observation topology:
        the IdP or KDC may have no event at use, while the resource sees a real session or token continuing. NJS-0061-002
        already owns that behavior with the same stable variable, traces, and defenses, and NJS-0055-001 owns live-state replay
        at remote gateways. This batch does not duplicate it under T1550. NJS-0061-001 or NJS-0050-004 expresses device or
        origin-context transplantation; NJT-0178 expresses material acquisition; and NJT-0166 or T1558 expresses proof forgery.
        The four ATT&CK children remain material and protocol breadth only and are not imported.'
  subtechnique_refs:
  - NJS-0184-001
