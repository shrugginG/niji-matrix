candidate:
  source_type: attack
  source_attack_id: T1005
  source_attack_version: '19.1'
  name_en: Data from Local System
  name_zh: 从本地系统获取数据
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 的 T1005 覆盖攻击者在已控制主机上从文件系统、配置文件、本地数据库、虚拟机文件或进程内存中寻找并取得有用数据。这个 Collection 锚点应保留，但本地主机位置、文件类型、目录名或读取工具本身都不是匿迹变量。Niji
  应把正式范围适配为实际取得本地内容且至少存在一项由攻击者控制、会改变读取痕迹或防守观察位置的设计；只列出路径、看到文件名或获得读取权限仍属于发现或暴露，不能代替内容结果。


  开放式检索后，路径或扩展名筛选缺少独立痕迹效应，状态化增量由 NJT-0135 管理，库内查询选择由 NJT-0143 管理，既有集成或受信身份控制由 NJT-0086 等身份对象管理，卷影、原始卷与块视图由 NJT-0108 管理，认证材料由
  T1555 与 NJT-0177 等凭据对象管理。派生本地视图仍值得作为低置信度条件子项提交：攻击者读取打印队列、文件级本地备份或应用派生副本而不直接读取规范源，使当前访问落到另一存储视图。Kaspersky 与 Unit 42 只证明相应模块能力，并未证明目标内容已成功取得或检测概率下降，主
  Agent 应在跨技术评审后选择 formalize 或 defer。'
rationale_en: 'ATT&CK Enterprise 19.1 T1005 covers an adversary finding and acquiring useful data from file systems, configuration
  files, local databases, virtual-machine files, or process memory on an accessed host. That Collection anchor should remain,
  but local placement, file type, directory name, or reader tool is not itself a stealth variable. Niji should adapt the formal
  scope to actual local-content acquisition with at least one attacker-controlled design that changes read traces or the defender''s
  observation plane. Listing a path, seeing a filename, or obtaining read authority remains discovery or exposure and does
  not substitute for a content result.


  After an open taxonomy search, path or extension filtering lacks an independent trace effect; NJT-0135 owns stateful incremental
  collection, NJT-0143 owns repository query selection, NJT-0086 and related identity objects own control of an existing integration
  or trusted identity, NJT-0108 owns shadow, raw-volume, and block views, and T1555 plus NJT-0177 and related credential objects
  own authentication material. A derivative local view remains worth submitting as a low-confidence conditional child: an
  adversary reads a print queue, file-level local backup, or application-derived copy instead of directly reading the canonical
  source, moving the current access to another storage view. Kaspersky and Unit 42 establish the relevant module capabilities
  but do not prove successful content acquisition or reduced detection probability, so the primary agent should formalize
  or defer it after cross-technique review.'
scope_notes_zh: 纳入要求同时说明受控主机、本地内容对象、成功读取结果，以及攻击者控制的读取视图或接口如何改变可见痕迹。T1083/NJT-0182 负责文件与目录发现，T1119/NJT-0135 负责跨轮自动获取与检查点，T1213/NJT-0143
  负责信息库内查询选择，T1074/NJT-0134 负责取得后的汇聚暂存，T1560/NJT-0133 负责归档转换。读取网络共享、云对象、邮件、配置存储库、剪贴板或可移动介质时，分别交给其数据来源父技术。
scope_notes_en: Inclusion requires an accessed host, a local content object, a successful read result, and an attacker-controlled
  read view or interface whose effect on visible traces can be explained. T1083/NJT-0182 owns file and directory discovery;
  T1119/NJT-0135 owns cross-pass automation and checkpoints; T1213/NJT-0143 owns query selection inside information repositories;
  T1074/NJT-0134 owns aggregation and staging after acquisition; and T1560/NJT-0133 owns archive transformation. Reads from
  network shares, cloud objects, mail, configuration repositories, clipboards, or removable media belong to their respective
  source parents.
