id: DEC-TA0009-T1025
tactic_ref: TA0009
candidate:
  source_type: attack
  source_attack_id: T1025
  source_attack_version: '19.1'
  name_en: Data from Removable Media
  name_zh: 从可移动介质获取数据
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 将 T1025 置于 Collection，描述攻击者在已失陷计算机上从已连接的 USB 存储、光盘和其他可移动介质寻找并收集敏感数据；固定版没有 ATT&CK
  子项。ESET 在 Turla 使用的 Crutch 工具集中分析出监视可移动驱动器、把匹配文件置入加密归档并在新版中自动上传本地和可移动驱动器文件的组件。Kaspersky 又在一处外交机构受害环境发现 TajMahal，并逆向出可在先前见过的
  USB 再次接入时窃取指定文件的能力。这些来源足以保留介质内容取得这一父行为，但没有公开逐文件读取、稳定介质身份和取得内容的完整受害时间线，因此置信度为 medium。


  建议适配为“匿迹型可移动介质内容获取”。介质位置本身不构成匿迹；正式范围要求攻击者利用正常接入、介质读取授权或跨接入状态，使恶意读取在进程来源、业务目的或时间谱系上难与用户导入、备份、取证、杀毒扫描和恢复区分，并证明内容进入攻击者控制的处理链。开放式分类搜索仅建议一项
  Niji 原生子项“重接入门控目标回收”：先保存介质与目标对象知识，待同一介质后续接入才读取既定目标，把发现与取得分散到不同接入会话。TajMahal 直接支持能力设计，但无告警率或逐文件受害结果测量，故子项保持 medium。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 baseline places T1025 under Collection and describes adversaries searching
  and collecting sensitive data from USB storage, optical media, and other removable media connected to a compromised computer;
  the fixed version has no ATT&CK children. ESET analyzed a removable-drive monitor in the Turla Crutch toolset that placed
  matching files into an encrypted archive and, in a later version, automatically uploaded files from local and removable
  drives. Kaspersky separately found TajMahal in a diplomatic victim environment and reverse engineered the ability to steal
  a requested file when a previously seen USB returned. These sources justify retaining acquisition of media content, but
  do not publish a complete victim timeline joining per-file reads, stable media identity, and acquired content, so confidence
  is medium.


  Adapt the parent as Stealth-Oriented Removable-Media Content Acquisition. Media location is not stealth by itself. Formal
  scope requires the adversary to exploit ordinary attachment, media-read authorization, or state across attachments so malicious
  reads are hard to distinguish from user import, backup, forensics, antimalware scanning, or recovery by process origin,
  business purpose, or temporal lineage, while proving that content entered an attacker-controlled processing path. Open taxonomy
  search supports only one Niji-native child, Reattachment-Gated Target Recall: retain media and target-object knowledge and
  read the selected target only when the same medium later returns, dispersing discovery and acquisition across sessions.
  TajMahal supports the capability design but provides no alert-rate or per-file victim-outcome measurement, so confidence
  remains medium.'
scope_notes_zh: 直接对象是当前由可移动存储、光盘、可携设备对象存储或等价介质提供的文件正文或字节。T1120、卷枚举、盘符出现、mount、目录列表、文件名和属性只证明介质或候选对象；须以允许的 File Read、4663 ReadData、可信读取遥测、输出对象或等价内容结果补强。T1091/NJT-0058
  负责恶意内容随介质进入另一主机并触发；T1005/NJT-0215 负责正常导入后的本地副本；T1074/NJT-0134 负责暂存；T1560/NJT-0133 负责归档；T1119/NJT-0135 负责自动选择、轮询和检查点；T1570/NJT-0130
  负责内部送达；NJT-0194 负责写入介质并离域；NJT-0207 负责介质命令—结果闭环；NJT-0108 负责原始卷、隐藏分区和普通文件命名空间之外的读取。
scope_notes_en: The direct object is a file body or bytes supplied by removable storage, optical media, a portable-device
  object store, or equivalent media. T1120, volume enumeration, a drive letter, mount, directory listing, filename, and attributes
  establish only a medium or candidate object and require an allowed File Read, event 4663 ReadData, validated read telemetry,
  an output object, or equivalent content result. T1091 and NJT-0058 own malicious content triggering another host; T1005
  and NJT-0215 own local copies after normal import; T1074 and NJT-0134 own staging; T1560 and NJT-0133 own archiving; T1119
  and NJT-0135 own automated selection, polling, and checkpoints; T1570 and NJT-0130 own internal delivery; NJT-0194 owns
  writing to media and departure; NJT-0207 owns media command-result loops; and NJT-0108 owns raw volumes, hidden partitions,
  and reads outside the ordinary file namespace.
