candidate:
  source_type: attack
  source_attack_id: T1039
  source_attack_version: '19.1'
  name_en: Data from Network Shared Drive
  name_zh: 从网络共享驱动器获取数据
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 将 T1039 置于 Collection，并把行为锚定为从当前系统可达的远程共享驱动器或文件服务器取得敏感内容，固定版没有 ATT&CK 子项。Forcepoint
  对 TINYTYPHON 的逆向分析显示样本遍历可见驱动器、按配置扩展名选择文档并上传，研究者在其控制端看到数千份被取走文档；The DFIR Report 又在真实入侵中观察到 Rclone 从 UNC 共享直接复制到 MEGA。两类资料足以保留“实际取得远端共享内容”这一父行为，不能把共享枚举、访问授权或工具能力替代为取得结果。


  网络共享位置本身不构成匿迹，因此建议适配为“匿迹型网络共享内容获取”：只有攻击者借用业务共享、有效身份、既有映射或正常读取接口，使读取在来源、进程或业务语境上难与合法访问区分时才进入正式矩阵。当前建议一项 Niji 原生子项“既有映射共享语境复用”，变量是恶意进程使用受害者登录会话中已经存在的映射和访问身份，而不另建映射或显式提交新凭据。Forcepoint
  证明恶意收集器确实从已映射驱动器取文档，Microsoft 证明映射与登录会话绑定；来源没有测量告警下降，故子项置信度为 medium，主 Agent 可在跨技术评审中保留或降为 deferred。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 baseline places T1039 under Collection and anchors it in obtaining sensitive
  content from a remote shared drive or file server reachable from the current system, with no ATT&CK children. Forcepoint
  reverse engineered TINYTYPHON traversing visible drive letters, selecting configured document extensions, and uploading
  them, while researchers observed thousands of stolen documents on its controller. The DFIR Report separately observed Rclone
  copying directly from a UNC share to MEGA in an intrusion. These sources justify retaining actual acquisition of remote-share
  content as the parent behavior; share enumeration, authorization, or tool capability cannot substitute for the acquisition
  outcome.


  A network-share location is not stealth by itself, so adapt the candidate to Stealth-Oriented Network Share Content Acquisition.
  It enters the formal matrix only when an adversary borrows a business share, valid identity, preexisting mapping, or ordinary
  read interface so source, process, or business context poorly distinguishes the read from legitimate access. One Niji-native
  child is proposed: Preexisting Mapped-Share Context Reuse, whose variable is malicious use of a mapping and access identity
  already present in the victim logon session instead of creating a new mapping or explicitly submitting new credentials.
  Forcepoint establishes malicious collection from mapped drives, and Microsoft establishes that mappings are bound to logon
  sessions. Neither source measures alert reduction, so the child is medium confidence and may be retained or deferred by
  the primary agent after cross-technique review.'
scope_notes_zh: 直接对象是远程 SMB、NFS 或等价共享文件系统返回的文件正文或字节。T1135 与 T1083 只证明共享、路径或名称；T1021 负责远程服务会话或目标交互；T1005 负责从本地主机及已落地离线缓存读取；T1074/NJT-0134
  负责取得后的汇聚与暂存；T1570/NJT-0130 负责把工具或文件送达另一内部主机；T1567 等负责离开环境。一次 Rclone 从 UNC 共享直达外部云可同时具有 T1039 与外传语义，但因为没有中间落点而不能自动记为 T1074。5145
  是共享访问权限检查；必须以实际使用 ReadData 的 4663、NAS 成功 READ 记录、成功 SMB READ 响应或内容结果补强，后续复制只作独立旁证。
scope_notes_en: The direct object is file content or bytes returned by a remote SMB, NFS, or equivalent shared filesystem.
  T1135 and T1083 establish only shares, paths, or names. T1021 owns remote-service sessions or destination interaction. T1005
  owns reads from the local host or an already materialized offline cache. T1074 and NJT-0134 own aggregation and staging
  after acquisition. T1570 and NJT-0130 own delivery of a tool or file to another internal host, and T1567 and peers own departure
  from the environment. One Rclone operation from a UNC share directly to external cloud can instantiate T1039 and exfiltration
  without automatically becoming T1074 because no intermediate destination exists. Event 5145 is a share-access authorization
  check and requires stronger support from exercised ReadData in 4663, a NAS successful READ record, a successful SMB READ
  response, or a content result; later copying remains separate corroboration.
