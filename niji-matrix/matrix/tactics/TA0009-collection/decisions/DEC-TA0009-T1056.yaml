  name_en: Input Capture
  name_zh: 输入捕获
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 将 T1056 同时映射到 Collection 与 Credential Access，并以“取得凭据或收集信息”定义父行为。当前正式 NJT-0169“认证输入路径截获”及其三个子项已经完整表达口令、验证码和同类认证秘密在提交时被复制的
  Credential Access 结果，但其决议、定义、证据和防御都明确把完成点收窄到认证输入。直接为 NJT-0169 增加 TA0009 会把非认证输入内容遗漏；把既有对象整体泛化又会改变其正式决议与登录、身份提供方和验证者绑定防御的语义。


  因此建议为 TA0009 建立独立的 Collection 收窄对象，以用户正在形成的非认证内容或有意义交互事件实际进入攻击者可读结果为完成点，并沿用同一 ATT&CK 来源但不复制其四个子项。仓库对 T1557 已采用凭据路径 NJT-0136
  与一般内容路径 NJT-0142 的结果导向拆分，该先例支持按直接对象而非按实现重复建模。DRBControl 直接证明全局输入流被写入带用户、进程和窗口语境的报告；Sucuri 对受侵 PrestaShop 的分析直接证明恶意代码在受信结账来源内覆盖表单、监视支付字段变化并把实际支付数据送入恶意处理链。这些证据支持消费者外输入流与受信来源数据入口两个原生变量。'
rationale_en: 'ATT&CK Enterprise 19.1 maps T1056 to both Collection and Credential Access and defines the parent as obtaining
  credentials or collecting information. The existing formal NJT-0169, Authentication-Input Path Interception, and its three
  children already express the Credential Access result in which passwords, verification codes, and comparable authentication
  secrets are copied during submission. Its decision, definition, evidence, and defenses deliberately narrow completion to
  authentication input. Adding TA0009 directly to NJT-0169 would omit non-authentication input content, while generalizing
  the existing object would change the semantics of its formal decision and its sign-in, identity-provider, and verifier-binding
  defenses.


  The recommendation is therefore a separate Collection-scoped object under TA0009, completed when non-authentication content
  being composed by a user or a meaningful interaction event actually reaches an attacker-readable result, while retaining
  the same ATT&CK source without copying its four children. The repository already splits T1557 by direct outcome into NJT-0136
  for credential paths and NJT-0142 for ordinary content paths, supporting result-oriented separation rather than implementation
  duplication. DRBControl directly establishes a global input stream written into a report with user, process, and window
  context. Sucuri''s analysis of a compromised PrestaShop site directly establishes malicious code overlaying a form within
  a trusted checkout origin, monitoring payment-field changes, and delivering actual payment data into a malicious processing
  chain. Those sources support consumer-external input streams and trusted-origin data entry as two native variables.'
scope_notes_zh: TA0009 对象只在非认证输入内容或有意义交互事件进入攻击者可读缓冲、文件、请求或等价结果时完成。口令、验证码、恢复秘密和认证证明仍归 NJT-0169；同一混合输入流只有在一般内容结果与认证秘密结果分别得到证明时才可双标。T1115
  负责从剪贴板服务取得已经复制的内容，T1185/NJT-0145 负责浏览器已呈现或返回的页面内容，T1055 负责让代码进入另一进程，T1204 负责诱导用户执行，T1074/T1560 与 TA0010 负责取得后的暂存、归档和外传。合法无障碍、输入法、远程支持、自动化测试、质量监控和获批分析脚本是必须按主体、会话、任务与结果去向排除的反例。
scope_notes_en: The TA0009 object completes only when non-authentication input content or a meaningful interaction event reaches
  an attacker-readable buffer, file, request, or equivalent outcome. Passwords, verification codes, recovery secrets, and
  authentication proofs remain under NJT-0169; a mixed input stream may carry both labels only when ordinary-content and authentication-secret
  outcomes are separately evidenced. T1115 owns content already obtained from a clipboard service, T1185 and NJT-0145 own
  page content already rendered or returned by a browser, T1055 owns placing code in another process, T1204 owns inducing
  user execution, and T1074, T1560, and TA0010 own later staging, archiving, and exfiltration. Accessibility, input methods,
  remote support, automated testing, quality monitoring, and approved analytics scripts are counter-examples that must be
  excluded by principal, session, task, and result destination.
