candidate:
  source_type: attack
  source_attack_id: T1074
  source_attack_version: '19.1'
  name_en: Data Staged
  name_zh: 数据暂存
decision: adapt
rationale_zh: 'ATT&CK 的父级行为是把已经取得的数据汇入后续外传前的暂存位置，数据可以分文件保存，也可以再由 T1560 归档。固定 19.1 基线明确指出，集中暂存可以减少受害网络到攻击者 C2 的连接数，因此这一父行为有可验证的匿迹潜力；但普通复制到临时目录并不自动具备匿迹特征。建议适配为“匿迹型数据暂存”，只纳入攻击者有意改变暂存拓扑、可见命名空间或存储观察面的情况。


  父级准入由暂存对防守观察的变化决定，而非由“本地/远程”位置标签决定。Volexity 观察到邮件导出文件被放到 OWA 服务器可由 HTTP 获取的路径；SecureWorks 观察到加密归档先转移到遭入侵的互联网服务器再被取走；Calisto
  与 BackdoorDiplomacy 则显示隐藏目录或回收站可被用作数据暂存。实际减小告警概率需要结合组织的日志覆盖和正常工作流判断，不能由案例反推每个攻击者的主观意图。'
rationale_en: 'The ATT&CK parent behavior moves already acquired data into a staging location before later exfiltration; files
  may remain separate or be archived under T1560. The fixed 19.1 baseline explicitly says central staging can reduce connections
  from the victim network to adversary C2, giving the parent a verifiable stealth potential. An ordinary copy into a temporary
  directory does not itself establish stealth. Adapt the parent to Stealth-Oriented Data Staging, limited to deliberate changes
  in staging topology, visible namespace, or storage observation plane.


  Admission rests on a change to defender observation, not a local-versus-remote location label. Volexity observed mailbox
  exports placed in an HTTP-retrievable OWA server path; SecureWorks observed encrypted archives moved to a compromised Internet-facing
  server before retrieval; Calisto and BackdoorDiplomacy show hidden directories or the Recycle Bin used for collected data.
  A lower alert probability depends on the organization''s telemetry and normal workflows, and the cases do not prove every
  actor''s subjective intent.'
scope_notes_zh: 直接对象是已取得数据的暂存位置、汇聚链与后续取用关系。T1119 拥有规则化或自动触发的获取过程，T1560 拥有归档容器及压缩加密过程，T1036/T1027 拥有一般外观伪装或表示遮蔽，T1070 拥有外传后的擦除。只有收集数据的暂存安排本身改变观察时，才归入此父级。
scope_notes_en: The direct object is the staging location, aggregation chain, and later retrieval relationship for data already
  obtained. T1119 owns rule-based or automatically triggered acquisition; T1560 owns archive-container construction, compression,
  and encryption; T1036/T1027 own general appearance or representation concealment; T1070 owns post-exfiltration erasure.
  The staging arrangement belongs here only when it itself changes observation.
