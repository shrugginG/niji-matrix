candidate:
  source_type: attack
  source_attack_id: T1113
  source_attack_version: '19.1'
  name_en: Screen Capture
  name_zh: 屏幕捕获
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿把 T1113 置于 TA0009 Collection，直接行为是取得桌面或应用窗口显示像素，且没有 ATT&CK 子项。ESET 对 Attor 的逆向分析确证按目标进程及前台窗口条件取得截图，Bitdefender
  对 FunnyDream 的分析确证连续截图与本地产物。屏幕捕获作为父行为应保留，但一般用户截图或持续截屏并不自身证明匿迹；建议将正式 Niji 父级适配为攻击者控制截图发生条件的屏幕像素获取，明确至少取得过一帧显示像素。


  目前仅有 Attor 足以支撑一个稳定的 Niji 子项：目标应用和前台内容条件控制截图是否发生，命中后每十秒产生截图并加密写入 Upload 目录。条件读取步骤与 NJT-0132 的窗口发现可并存，但 T1113 子项须以实际像素产物及其命中前后差异为判定核心。BLUELIGHT
  的三十秒转五分钟节奏证明频率变化，却未证明降低检测阈值或匿迹目的；FunnyDream 的五秒持续抓屏与落盘反而显示高密度对照。二者不应为追求子项数被提升为正式匿迹子技术。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 workbook places T1113 in TA0009 Collection, with desktop or application-window
  display pixels as the direct object and no ATT&CK children. ESET''s Attor analysis establishes screenshots acquired under
  target-process and foreground-window conditions; Bitdefender''s FunnyDream analysis establishes continuous capture and local
  artifacts. Preserve the parent capture behavior, but an ordinary user screenshot or continuous capture does not itself establish
  stealth. Adapt the formal Niji parent to acquisition of screen pixels under attacker-controlled capture conditions, requiring
  evidence that at least one displayed frame was actually obtained.


  At present Attor supports one stable Niji child: target-app and foreground-content conditions determine whether screenshots
  occur, followed by capture every ten seconds and encrypted writes to an Upload directory. Reading those conditions may also
  be NJT-0132 window discovery, but the T1113 child requires acquired pixels and a before/after difference in capture outcome.
  BLUELIGHT''s shift from thirty-second to five-minute screenshots proves a frequency change, not evasion intent or passage
  below a detection threshold. FunnyDream''s five-second continuous capture and disk writes instead offer a high-density comparator.
  Neither should become a formal stealth child merely to increase the count.'
scope_notes_zh: 直接对象是显示器、桌面或应用窗口的像素；T1125 直接对象是摄像头、视频通话或其他视频输入帧，不能仅以静态图像与视频文件格式区分。T1123 负责音频，NJT-0132/T1010 负责窗口状态发现，T1056
  负责按键和界面输入。T1074 与 T1560 负责屏幕像素取得后的暂存、压缩或加密归档。合法远程支持、会议共享、质检、无障碍和用户主动截图是必要反例；仅有截图命令、模块能力、窗口匹配或图像文件名都不足以断言已恶意采集。
scope_notes_en: The direct object is pixels from a display, desktop, or application window. T1125 takes camera, video-call,
  or other video-input frames; a still image versus video file is not the boundary. T1123 owns audio, NJT-0132/T1010 owns
  window-state discovery, and T1056 owns keystrokes and interface input. T1074 and T1560 own staging, compression, or encrypted
  archiving after pixels are acquired. Authorized remote support, meeting sharing, quality assurance, accessibility, and user-initiated
  screenshots are necessary benign comparators. A screenshot command, module capability, window match, or image filename alone
  does not prove malicious acquisition.
