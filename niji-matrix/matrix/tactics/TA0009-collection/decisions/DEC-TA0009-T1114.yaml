candidate:
  source_type: attack
  source_attack_id: T1114
  source_attack_version: '19.1'
  name_en: Email Collection
  name_zh: 邮件收集
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿将 T1114 定义为从邮件服务器或客户端取得敏感消息，并列出 T1114.001、T1114.002、T1114.003 三个按存储位置或转发功能区分的子项。邮箱内容可包含业务秘密、个人信息或应急响应细节，父行为符合
  Collection 范围；但授权邮件读取、迁移与备份同样会产生大量读取，普通获取不能自动算作匿迹。建议适配为“匿迹型邮件内容收集”，要求有可证的读取观察面转移、内容选择或消息到达触发分流，并把账户取得与后续外传分开分析。


  Microsoft 说明预先同步到 Outlook 的邮件可在离线状态访问，而服务器 MailItemsAccessed 不会记录这次本地再次读取；Microsoft 的 BEC 调查则直接观察到攻击者以财务关键词选择邮件，并由转发规则持续复制至受控地址。两者改变的痕迹及防守关联方式不同，支持进一步研究
  Niji 原生子项。来源并未量化告警下降率，也不能仅凭有 OST 或有转发规则断言攻击者匿迹意图。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 workbook defines T1114 as obtaining sensitive messages from mail servers or
  clients and lists three children partitioned by storage location or forwarding capability. Mail can contain business secrets,
  personal information, or incident-response details, so the parent belongs in Collection. Authorized reading, migration,
  and backup can also cause large reads, however; ordinary acquisition is not automatically stealth. Adapt the parent to Stealth-Oriented
  Email Content Collection and require a demonstrable shift in the read observation plane, content selection, or arrival-triggered
  replication, while analyzing account acquisition and later exfiltration separately.


  Microsoft documents that previously synchronized Outlook mail can be accessed offline without a new server MailItemsAccessed
  record for that local reread. Its BEC investigation directly observed attackers selecting financial mail by keywords and
  continuously copying matching messages to controlled addresses through forwarding rules. Their traces and defender joins
  differ, supporting Niji-native child inquiry. The sources do not quantify alert reduction, and an OST file or a forwarding
  rule alone does not prove adversarial stealth intent.'
scope_notes_zh: 直接对象是邮件正文与附件的取得、选取及被动复制。T1213 负责非邮件信息库，T1185 负责浏览器会话中的交互中介；取得账户、令牌、邮箱委派或会话属于前置访问，T1119 拥有跨源通用自动搜集的调度和检查点，T1074
  拥有已取得邮件导出物的暂存，T1560 拥有归档，TA0010 拥有组织边界之外的传送。规则配置可作为本技术的前提与观测事实，但持久规则本身还可能属于账户/配置持久化；不可把规则存在等同于已有消息被取得。
scope_notes_en: The direct object is acquisition, selection, or passive replication of email bodies and attachments. T1213
  covers nonmail repositories, and T1185 covers interaction mediation in an active browser session. Account, token, delegation,
  or session acquisition is prerequisite access; T1119 owns generic cross-source automated schedules and checkpoints, T1074
  owns staging of already acquired mail exports, T1560 owns archiving, and TA0010 owns transmission beyond the organization.
  Rule configuration can be a prerequisite and observable fact here but a durable rule may also be account or configuration
  persistence; its existence alone does not prove message acquisition.
