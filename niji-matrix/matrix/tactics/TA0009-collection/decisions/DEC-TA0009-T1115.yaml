candidate:
  source_type: attack
  source_attack_id: T1115
  source_attack_version: '19.1'
  name_en: Clipboard Data
  name_zh: 剪贴板数据
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿将 T1115 置于 TA0009 Collection，直接行为是取得用户在应用内或应用间复制到剪贴板的数据，且没有 ATT&CK 子项。eSentire
  对 NightshadeC2 的现场与样本分析证明恶意程序在剪贴板变化后取得内容、写入隐藏日志并可由 C2 命令上传；Fortinet 对 QBot 的逆向分析证明注入模块在实际粘贴路径中截获 GetClipboardData 返回值，记录进程、窗口和内容后加密暂存并传输。父行为有充分的实害和
  Collection 结果证据，应保留其来源对象，同时适配为要求实际内容取得并具备可论证匿迹变量的“匿迹型剪贴板内容获取”。


  两个原生子项通过证据门禁。第一项把读取绑定到剪贴板变化通知，空闲期不作固定轮询，痕迹从连续打开与读取转为长期监听注册及变化后的短窗读取；第二项在正常粘贴消费者进程中截获剪贴板读取结果，使内容副本沿既有粘贴调用出现并把表面主体转移到被注入应用。二者的控制变量、残余痕迹和分析方法不同。按内容正则筛选、按目标应用但不证明实际取得、低频轮询、复用剪贴板管理器或同步主体等轴尚缺少同时证明
  Collection 结果与独立观察差的来源，应保持暂缓，不能为扩大子项数而正式化。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 workbook places T1115 under TA0009 Collection, with data copied within or
  between applications as its direct object and no ATT&CK children. eSentire''s incident and sample analysis of NightshadeC2
  establishes content acquisition after clipboard changes, writes to a hidden log, and upload through a C2 command. Fortinet''s
  QBot reverse engineering establishes an injected module intercepting the GetClipboardData return path during an actual paste,
  recording process, window, and content before encrypted staging and transmission. The parent behavior has strong harm and
  Collection-outcome evidence. Preserve its source object while adapting it to Stealth-Oriented Clipboard Content Acquisition,
  which requires actual content acquisition and a defensible stealth variable.


  Two Niji-native children pass the evidence gate. The first binds reads to clipboard-change notifications, avoiding fixed
  polling while idle and shifting traces from repeated open-and-read operations to a long-lived listener plus short-window
  reads after changes. The second intercepts clipboard results inside a normal paste-consuming process, placing the copied
  content on an existing paste call path and shifting the apparent actor to the injected application. Their control variables,
  residual traces, and analytics differ. Content-regex selection, app targeting without proof of acquired content, low-rate
  polling, and reuse of clipboard-manager or synchronization identities currently lack sources that jointly establish a Collection
  outcome and an independent observation difference; keep them deferred rather than formalizing them to increase child count.'
scope_notes_zh: 本候选以剪贴板服务、pasteboard 或 selection 提供的实际内容为直接对象，至少须证明内容进入攻击者控制的内存、日志、缓冲或传输链。T1056 负责在内容进入剪贴板前捕获按键、表单或其他输入；T1119
  负责跨数据源的自动遍历和轮次控制；T1185 负责浏览器会话内页面、请求或响应内容介入；T1005 负责直接解析本地文件、数据库或应用存储，包含绕过剪贴板服务而直接读取历史数据库的情形。取得后的集中落点属于 T1074，压缩或加密归档属于
  T1560。只替换钱包地址、写入恶意命令、注册监听器、执行一次失败读取或仅具备读取能力均不足以确认本 Collection 技术。密码管理器、剪贴板历史工具、DLP、远程支持、虚拟机共享剪贴板、RDP 和无障碍工具是必须保留的正常反例。
scope_notes_en: This candidate takes actual content supplied by a clipboard service, pasteboard, or selection as its direct
  object and requires evidence that content entered adversary-controlled memory, a log, a buffer, or a transfer chain. T1056
  owns keystrokes, form values, and other input captured before it enters the clipboard. T1119 owns automated traversal and
  round control across data sources. T1185 owns interposition on pages, requests, or responses inside a browser session. T1005
  owns direct parsing of local files, databases, or application storage, including reading a clipboard-history database while
  bypassing the clipboard service. T1074 covers a centralized destination after acquisition, while T1560 covers compression
  or encrypted archiving. Merely replacing a wallet address, writing a malicious command, registering a listener, attempting
  one failed read, or possessing read capability does not confirm this Collection technique. Password managers, clipboard-history
  tools, DLP, remote support, virtual-machine shared clipboards, RDP, and accessibility tools are required benign comparators.
