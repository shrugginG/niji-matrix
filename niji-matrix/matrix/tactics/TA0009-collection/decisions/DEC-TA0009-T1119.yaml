  source_attack_id: T1119
  source_attack_version: '19.1'
  name_en: Automated Collection
  name_zh: 自动收集
decision: adapt
rationale_zh: ATT&CK T1119 的固定版本将规则化、周期性或工具内置的内部数据自动获取列入 Collection，范围覆盖主机与云端；这为父技术提供稳定的行为锚点。自动执行本身并不改变可见性，定时任务、脚本或 API 调用的存在更不能证明匿迹，因此建议
  adapt：仅在攻击者有意控制获取集合、重复访问范围或触发时机，且这种控制改变痕迹及防守观察时，纳入正式匿迹技术。Bitdefender 对 FunnyDream FilePakMonitor 的逆向分析直接记录了首轮后依上次扫描时间只收集已变化文件，足以支持状态化的收集范围变量；“因此更难发现”是基于访问量和跨时关联的分析推断，不能写成该报告实测结论。
rationale_en: The fixed T1119 baseline anchors rule-driven, periodic, or tool-integrated automated acquisition of internal
  data under Collection across hosts and cloud services. Automation alone does not change visibility, and the presence of
  a scheduled task, script, or API call does not establish stealth. Adapt the candidate to cases in which the adversary intentionally
  controls the acquisition set, repeated-access scope, or trigger timing and that control changes traces and defender observation.
  Bitdefender's reverse engineering of FunnyDream FilePakMonitor directly documents collection of only files changed since
  the previous scan after an initial pass, supporting a stateful collection-scope variable. Reduced detectability is an inference
  from access volume and the need for cross-time correlation, not an outcome measured by that report.
scope_notes_zh: 适配为有证据证明获取集合或触发时机改变观察的自动收集；仅有周期任务、脚本、API 调用或文件类型过滤不构成匿迹。暂存与归档分别由 T1074 和 T1560 处理，ATT&CK 无子项亦不影响开放式 Niji 分类。
scope_notes_en: Adapt to automated collection with evidence that the acquisition set or trigger timing changes observation.
  A periodic task, script, API call, or extension filter alone is not stealth. Staging and archiving belong to T1074 and T1560,
  and the absence of ATT&CK children does not constrain open-ended Niji taxonomy.
