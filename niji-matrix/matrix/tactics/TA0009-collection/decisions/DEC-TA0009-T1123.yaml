  name_en: Audio Capture
  name_zh: 音频捕获
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿把 T1123 置于 Collection，涵盖利用麦克风或通信应用取得环境和谈话音频，且没有 ATT&CK 子项。该父行为有明确的一手实例，但单纯录音不必然改变防守观察。建议将
  Niji 父级适配为有意改变音频来源归因或通话授权解释的匿迹型音频捕获，同时保留设备与应用音频这两种输入路径。


  ESET 对 Attor 的逆向分析显示录音插件只在会议应用进程中激活，即便录到应用外谈话也可让麦克风访问看起来来自预期使用麦克风的进程；作者明确将此作为可能的隐蔽理由。Unit 42 对 T9000 的分析显示恶意插件经 Skype 内置接口附着到已登录应用，在用户许可后录制通话，授权提示中的正常进程身份可能误导用户。二者分别说明进程归因与应用接口两条实施路径，但都借用了正常通信应用的身份语境。严格按稳定匿迹变量收敛时，只建议
  Attor 的进程归因作为当前正式子项；T9000 接口路径作为父级实例和独立防守分析保留，不仅因接口不同而另建子项。来源没有提供告警率下降的实测数值。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 workbook places T1123 in Collection and covers acquisition of environmental
  or conversational audio through microphones or communication applications, with no ATT&CK children. Primary reports establish
  the parent behavior, but recording alone does not necessarily change defender observation. Adapt the Niji parent to audio
  capture that deliberately changes attribution of the audio source or the interpretation of call authorization, while retaining
  both device and application audio input paths.


  ESET''s reverse engineering shows Attor''s recorder activates only inside teleconferencing processes, so even conversations
  outside the app can appear as microphone access by a process expected to use a microphone; the authors explicitly identify
  stealth as a possible reason. Unit 42 shows T9000 attaching through Skype''s built-in interface after the app is running
  and logged in, then recording calls following user approval; the normal process identity in the prompt may mislead the user.
  They show process-attribution and application-interface implementation paths, but both borrow the normal communication-app
  identity context. Under a strict stable-stealth-variable test, only the Attor process-attribution child is recommended for
  formalization now. Keep the T9000 interface path as a parent example and a distinct defense analytic rather than creating
  a child solely from a different interface. Neither source measures a reduction in alerts.'
scope_notes_zh: 直接对象为环境或通话音频的取得。T1056 负责键盘、图形界面等输入事件与文字内容，不能因声波由输入设备产生就吞并 T1123。T1113 与 T1125 分别负责屏幕图像和视频帧；同一次会议可并列标注音频与视频，但不得将视频帧作为音频证据。取得麦克风权限、注入进程或建立应用接口授权是前提及伴随行为；T1074
  处理录音后暂存，T1560 处理压缩或加密归档，外传另属后续战术。合法会议录音、语音转写和客服质检是必需的正常反例。
scope_notes_en: The direct object is acquisition of ambient or call audio. T1056 owns keyboard, GUI, and other input events
  or text; sound originating from an input device does not make it T1056. T1113 and T1125 own screen images and video frames
  respectively; one meeting can warrant both audio and video labels, but frames are not evidence of audio capture. Obtaining
  microphone permission, injecting a process, or obtaining an application-interface grant are prerequisites or accompanying
  acts. T1074 owns staging after recording, T1560 owns compression or encrypted archiving, and exfiltration belongs to a later
  tactic. Authorized meeting recording, transcription, and quality assurance are necessary benign comparators.
