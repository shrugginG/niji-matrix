  name_en: Video Capture
  name_zh: 视频捕获
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿将 T1125 列为 Collection 父技术，覆盖摄像头、视频通话等视频输入的录像或间隔图像，且无 ATT&CK 子项。Unit 42 直接报告 T9000
  在获用户许可后经已登录 Skype 的接口录制视频通话，并在解密产物中见到周期性取得的通话图像；ESET 在 InvisiMole 样本的内部文件类型中区分 webcam 照片与屏幕截图。这足以保留视频取得这一行为，但单纯具有摄像头功能或生成图片不构成匿迹，应把
  Niji 父级适配为有意使视频取得混入可信通话语境或改变可见来源归因的采集行为。


  建议只正式化一项有现场样本支持的原生子项：经通话应用接口取得视觉媒体，令第三方采集与正常会话及授权提示同现。T9000 的提示显示正常进程可能误导用户，但用户确需允许访问，不能宣称无提示绕过。Objective-See 在旧 macOS 既有摄像头会话以及
  2020 年 Zoom 进程内权限继承上做了能录到视频的实验，分别说明另一种潜在观察差；它们不是已见野外恶意实施，故不据此增列正式子项。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 workbook places T1125 under Collection and covers recordings or interval images
  from camera and video-call inputs, with no ATT&CK children. Unit 42 directly reports T9000 recording video calls through
  a signed-in Skype interface after user approval and observing periodically captured call images in decrypted output. ESET
  distinguishes webcam photos from screen screenshots in InvisiMole''s internal file types. These sources support retaining
  the acquisition behavior, but a camera capability or image file alone is not stealth. Adapt the Niji parent to acquisition
  deliberately placed in a trusted call context or otherwise changing attribution of the visible source.


  Recommend one formal Niji child with an observed malware sample: acquiring visual call media through a call-app interface
  so third-party capture coexists with a normal session and grant prompt. Unit 42 says the prompt''s normal process could
  mislead a user, but the user had to approve access; no silent permission bypass is established. Objective-See demonstrated
  recording through an already active camera session on older macOS and inherited camera grants inside Zoom in 2020. These
  show potential observation differences, but they are experiments rather than observed malicious deployment and do not justify
  more formal children here.'
scope_notes_zh: 直接对象是摄像头或视频通话输入的帧或序列，是否保存为图片或视频文件不决定分类。T1113 取得桌面和应用窗口像素；T1123 取得音频；设备授权、进程注入和接口许可属于前提或相邻行为；T1074/T1560 处理采集后的暂存与归档。同一会议可同时产生这些对象，须分别证明来源和结果。合法会议录制、远程支持、无障碍辅助、质检及用户主动拍照均为正常反例。
scope_notes_en: The direct object is frames or sequences from a camera or video-call input; still-image versus movie storage
  does not determine classification. T1113 acquires desktop or application-window pixels, and T1123 acquires audio. Device
  grants, process injection, and interface approval are prerequisites or adjacent acts; T1074 and T1560 own later staging
  and archiving. One meeting may involve several of these objects, each requiring separate source and outcome evidence. Authorized
  meeting recording, remote support, accessibility, quality assurance, and user-initiated photography are benign comparators.
