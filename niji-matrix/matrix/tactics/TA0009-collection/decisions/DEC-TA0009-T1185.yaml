candidate:
  source_type: attack
  source_attack_id: T1185
  source_attack_version: '19.1'
  name_en: Browser Session Hijacking
  name_zh: 浏览器会话劫持
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿的 T1185 行将浏览器会话劫持列为 Collection，涵盖在浏览器内改变内容、拦截信息以及借用已经认证的浏览器上下文。Niji 应保留这一父行为，但把本战术的直接对象限定为活动浏览器会话中的业务页面、请求或响应内容及其可读机会。单纯取得
  Cookie、执行注入、盗取表单按键，或让用户首次进入钓鱼站点，均不足以宣称已发生本技术的内容收集。


  样本研究直接展示浏览器网络 API hook、按目标页面注入脚本与扩展读取页面源码或请求内容；浏览器 pivot 的工具作者文档证明可在目标浏览器上下文内代理独立请求，但属于能力说明而非某次真实入侵中已获取内容的观察。准入因此为 adapt
  且中等置信；正式案例只能在有具体会话内容或应用端访问证据时落到相应子项，不能把工具功能清单写成现场成效。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 T1185 row maps browser session hijacking to Collection and covers changing
  content, intercepting information, and borrowing an authenticated browser context. Niji should keep that parent behavior
  while narrowing this tactic''s direct object to readable business pages, requests, or responses in an active browser session.
  A cookie result, an injection event, captured form keystrokes alone, or the user''s first entry to a phishing site does
  not establish collection through this technique.


  Sample research directly shows browser network API hooks, target-page script injection, and an extension reading page source
  or request content. The browser pivot author''s documentation demonstrates that independent requests can be proxied through
  a victim browser context, but describes capability rather than observed content acquisition in a particular intrusion. Admission
  is therefore adapt with medium confidence. A formal case should map to a child only when session content or application
  access is evidenced, not merely because a tool lists the capability.'
scope_notes_zh: 仅纳入攻击者控制正在使用或可复用的浏览器执行上下文，且有会话内容读取或可验证读取机会的行为。T1557 处理通信路径中间介入，T1539 处理会话 Cookie 取得，T1055 处理跨进程注入实现，T1114
  处理邮件正文取得，TA0001 处理首次钓鱼入口；同一链可多重标注，但每一对象需独立证据。
scope_notes_en: Include adversary control over an active or reusable browser execution context only when session content is
  read or a verifiable opportunity to read it exists. T1557 owns communication-path interposition, T1539 cookie acquisition,
  T1055 cross-process injection implementation, T1114 email body acquisition, and TA0001 the first phishing entry. One chain
  may receive multiple labels only with separate evidence for each object.
