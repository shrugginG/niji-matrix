candidate:
  source_type: attack
  source_attack_id: T1213
  source_attack_version: '19.1'
  name_en: Data from Information Repositories
  name_zh: 从信息库获取数据
decision: adapt
rationale_zh: '固定版 T1213 的直接行为是从协作、业务或代码等信息库取得内容，而不是确定使用何种工具、产品或后继外传渠道。这个 Collection 锚点值得保留，但“读取信息库”本身不具有匿迹性质；Niji 应把范围改写为攻击者在库内选择、读取和呈现方式上有意改变可见痕迹的内容获取。至少应证明成功的内容访问，以及所主张变量如何改变防守观察。


  当前一条可进一步正式化的轴是查询驱动的选择性读取，证据证明攻击者会检索目标词且平台留下不同的搜索、访问和下载事件；低量选择是否确实降低告警仍是有条件推断。借用受信集成身份的案例虽涉及 CRM 数据，但 NJT-0086 已拥有身份与持久授权边界；本批不得以信息库名称重建它。'
rationale_en: 'Fixed-baseline T1213 directly concerns acquiring content from collaboration, business, code, and other information
  repositories, rather than a particular tool, product, or later exfiltration channel. That Collection anchor should remain,
  but repository access alone is not stealth. Niji should adapt the scope to attacker-controlled selection and retrieval choices
  that change visible traces, requiring proof of successful content access and of the claimed variable''s effect on defender
  observation.


  Query-led selective reading is the one axis worth considering for formalization: incident evidence shows adversary searches
  for target terms, while platforms expose distinct search, access, and download events. Whether low-volume selection actually
  lowers alerts remains a conditional inference. The trusted-integration case also involves CRM data, but NJT-0086 already
  owns identity and durable-grant boundaries and must not be rebuilt under a repository label.'
scope_notes_zh: 只纳入取得协作、代码或业务信息库实际内容且其查询与读取安排改变防守观察的行为。单纯搜索或权限存在不证明内容取得；T1530 云对象存储、T1602 配置存储库、T1114 邮件、NJT-0086 既有集成身份与
  NJT-0135 状态化自动收集各保有直接对象。六个 ATT&CK 产品/内容子项不导入 NJS。
scope_notes_en: Include acquisition of actual collaboration, code, or business-repository content where query and read arrangements
  change defender observation. Search or permission alone does not prove acquisition. T1530 cloud object storage, T1602 configuration
  stores, T1114 email, NJT-0086 integration identity, and NJT-0135 stateful automation retain their direct objects. The six
  ATT&CK product or content children are not imported as NJS.
