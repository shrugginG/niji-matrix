id: DEC-TA0009-T1530
tactic_ref: TA0009
candidate:
  source_type: attack
  source_attack_id: T1530
  source_attack_version: '19.1'
  name_en: Data from Cloud Storage
  name_zh: 从云存储获取数据
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 将 T1530 锚定为从 IaaS 对象存储、云盘或兼具存储用途的 SaaS 中访问数据，固定版没有 ATT&CK 子项。美国司法部在 Capital One 案中确认攻击者侵入云端存储数据，且搜查设备中存在数据副本；Microsoft
  又记录 Storm-0501 窃取 Azure Storage 账户密钥并用 AzCopy 把账户中的数据外传；Mandiant 记录 APT42 浏览并下载受害者 OneDrive 文件到磁盘。三组来源均证明了内容实际取得，而不只证明桶、对象、权限或工具能力，因此父行为应保留。


  云位置本身不构成匿迹，故建议适配为“匿迹型云存储内容获取”。正式范围要求攻击者选择的读取路径、主体语境或授权载体改变痕迹归属和防守观察；AWS S3 对象数据事件、GCP Cloud Storage DATA_READ 与 Azure Blob
  资源日志均需显式配置或路由，M365 云盘审计虽对多数租户默认启用，仍需用客户端、应用、对象和结果字段区分正常同步与恶意下载。开放检索后仅建议一项 Niji 原生子项“消费主体解绑的云对象读取”：公开权限、账户/共享密钥、SAS 或预签名/签名链接使成功读取无法从授权记录直接还原实际持有者。直接对象数据面与前端应用审计错位保留在父级机理和待证轴，因为
  IaaS 直接接口常是父行为核心，按 GUI/API/CLI 拆分会违反分类规则。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 baseline anchors T1530 in accessing data from IaaS object storage, cloud drives,
  or SaaS with a storage role, and it has no ATT&CK children. The United States Department of Justice confirms intrusion into
  Capital One cloud-stored data and recovery of a copy on seized devices. Microsoft separately records Storm-0501 stealing
  Azure Storage account keys and using AzCopy to exfiltrate data from those accounts, while Mandiant records APT42 browsing
  and downloading victim OneDrive files to disk. These sources establish actual content acquisition rather than only a bucket,
  object, permission, or tool capability, so the parent behavior should remain.


  A cloud location is not stealth by itself, so adapt the candidate to Stealth-Oriented Cloud Storage Content Acquisition.
  Formal scope requires an attacker-selected read path, principal context, or authorization carrier that changes trace attribution
  and defender observation. AWS S3 object data events, GCP Cloud Storage DATA_READ, and Azure Blob resource logs all require
  explicit selection, enablement, or routing. Microsoft 365 cloud-drive auditing is enabled by default for most tenants, yet
  client, application, object, and outcome fields are still needed to separate normal synchronization from malicious download.
  The open search supports one Niji-native child, Consumer-Identity-Decoupled Cloud Object Retrieval: public permission, an
  account or shared key, SAS, or a presigned or signed link lets a successful read occur without authorization records identifying
  the actual holder. Direct data-plane versus front-end audit mismatch remains a parent mechanism and deferred axis because
  a direct IaaS interface is often parent-core behavior, and a GUI, API, or CLI partition would violate the taxonomy rule.'
scope_notes_zh: 直接对象是云存储服务返回的对象或文件正文。T1619/NJT-0141 管理已知容器内键、前缀和清单元数据；ListObjects、ListBlobs、objects.list、HeadObject、对象元数据或成功授权不证明正文已取得。T1213/NJT-0143
  管理协作、代码或业务信息库的查询驱动内容读取；已知云盘/对象路径的正文下载由 T1530 管理，若先在 SharePoint 等库内搜索再下载，可分别记录两个阶段。NJT-0086 管理持久应用集成和 service principal grant，NJT-0135
  管理重复/增量收集轮次，NJT-0134 管理读取后的中间暂存。NJT-0196/T1537 管理同服务跨账户 grant、有效外部访问或独立副本，外送网络或外部服务结果归 TA0010；这些行为可与 T1530 同现，但证据不得互相替代。
scope_notes_en: The direct object is an object or file body returned by a cloud storage service. T1619 and NJT-0141 own keys,
  prefixes, and inventory metadata inside a known container. ListObjects, ListBlobs, objects.list, HeadObject, object metadata,
  or successful authorization does not prove body acquisition. T1213 and NJT-0143 own query-led reading from collaboration,
  code, or business repositories. Downloading a known cloud-drive or object path belongs to T1530; a SharePoint search followed
  by a download can instantiate the two stages separately. NJT-0086 owns durable application integration and service-principal
  grants, NJT-0135 owns repeated or incremental collection passes, and NJT-0134 owns intermediate staging after the read.
  NJT-0196 and T1537 own same-service cross-account grants, effective external access, or independent replicas, while outbound
  network or external-service delivery belongs to TA0010. These behaviors may co-occur with T1530, but their evidence is not
  interchangeable.
