  name_en: Adversary-in-the-Middle
  name_zh: 攻击者居中
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿将 T1557 同时归入 Collection 和 Credential Access，父行为是主动使通信经过攻击者控制的位置，以支持信息收集等后续行为。TA0006
  的 NJT-0136 已有意收窄为凭据承载路径、认证交换或认证证明；它的两项子技术及检测均以认证结果为直接对象，不能承载一般通信正文、附件或业务响应的取得。TA0009 应另立经过范围改写的父技术，以主动路径介入和可证实的通信内容接触为必要条件；只有
  DNS、ARP、DHCP、无线或证书异常而没有内容承载会话时，仍只是路径调查线索。


  2019 年哈萨克斯坦 HTTPS 拦截的原始测量记录了按域名和路径选择的证书替换、面向真实站点的上游握手以及测试响应未见头部或正文变化，因而足以支持选择性内容流介入与可信终止转发两个候选匿迹轴。Mozilla 对受信自定义根证书使中间节点能够解密网站通信的解释补足技术因果链。这些来源并未取得拦截节点的存储记录或证明哪一份真实用户正文被保存；正式案例和事件判断必须把“明文可接触”与“特定内容已收集”分层表述。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 workbook maps T1557 to both Collection and Credential Access and defines the
  parent as active positioning of adversary-controlled infrastructure in a communication path to enable information collection
  and other follow-on acts. Existing TA0006 NJT-0136 deliberately narrows this behavior to credential-bearing paths, authentication
  exchanges, and proofs. Its two children and analytics have authentication outcomes as their direct object and cannot represent
  access to ordinary message bodies, attachments, or business responses. TA0009 therefore needs a separately adapted parent
  requiring active path intervention and evidenced access to a content-bearing exchange. A DNS, ARP, DHCP, wireless, or certificate
  anomaly alone remains a path lead without a content-flow link.


  Original measurements of Kazakhstan''s 2019 HTTPS interception recorded domain- and path-selective certificate substitution,
  an upstream handshake to the real site, and no observed header or body change in test responses. They support two candidate
  stealth axes, selective content-flow interception and trusted termination with forwarding. Mozilla''s explanation of decryption
  through a trusted custom root supplies the technical causal link. These sources did not obtain the interceptor''s storage
  records or prove that any specific real user''s message was saved. A formal case and incident decision must distinguish
  plaintext accessibility from confirmed acquisition of particular content.'
scope_notes_zh: 直接对象是仍在传输的非凭据通信内容及其读取机会；同一路径若同时涉及凭据和正文，可分别标注 TA0006 与 TA0009，但须各有对象证据。T1040 处理不改变路径的被动嗅探，T1114/T1213 等处理后来从邮箱或资料库读取的静态内容，T1565.002
  处理传输内容改写，T1689/T1600 处理降级或加密保护削弱结果。
scope_notes_en: The direct object is non-credential content in transit and a demonstrable opportunity to read it. A path carrying
  both credentials and message content may justify both TA0006 and TA0009 only with separate evidence for each object. T1040
  owns passive observation without path intervention; T1114/T1213 own later reads from mailboxes or repositories; T1565.002
  owns modification of transmitted content; T1689/T1600 own downgrade or weakened-protection outcomes.
