candidate:
  source_type: attack
  source_attack_id: T1560
  source_attack_version: '19.1'
  name_en: Archive Collected Data
  name_zh: 归档已收集数据
decision: retain
rationale_zh: '固定 Enterprise 19.1 工作簿把 T1560 定义为外传前压缩或加密已收集数据；压缩减少传输量并遮蔽原始内容，加密使没有密钥的防守方难以检查内容。归档过程本身因此具有明确的 Collection 行为和可分析的匿迹面，值得保留父级语义。保留不意味着把每次合法压缩都视为匿迹，正式归类仍应要求已收集数据、攻击者控制的打包动作及可论证的观察变化。


  T1074 以数据被汇聚到何处以及如何暂存为直接对象，归档可以发生在暂存之前、之中或之后；T1119 以预设规则或重复触发的数据获取为直接对象，自动化是否存在不决定归档方式。一次事件可以同时映射三者，但 T1560 的独立证据应落在输入数据到容器或编码流的转换，而不是目录位置、计划任务或网络上传本身。'
rationale_en: 'The fixed Enterprise 19.1 workbook defines T1560 as compression or encryption of already collected data before
  exfiltration. Compression reduces transfer volume and obscures source content, while encryption makes contents difficult
  for a defender without the key to inspect. The archival process therefore has a clear Collection behavior and analyzable
  stealth surface that warrants retaining the parent meaning. Retention does not turn ordinary compression into stealth; formal
  classification still requires collected data, attacker-controlled packaging, and a defensible change in observation.


  T1074 directly concerns where data is aggregated and staged, and archiving may occur before, during, or after that staging.
  T1119 directly concerns rule-based or repeatedly triggered acquisition, so automation does not define the archival method.
  One incident can map to all three, but independent T1560 evidence must show transformation of input data into a container
  or encoded stream, rather than a directory location, scheduled task, or network upload alone.'
scope_notes_zh: 保留已取得数据向归档容器或编码流的转换；暂存位置、自动获取、分卷传输与后续删除分别由相邻对象处理。正式子项按内容可检查性和归档进程谱系划分，不导入 ATT&CK 的工具、库、自定义方法类别。
scope_notes_en: Retain transformation of acquired data into an archive container or encoded stream. Staging location, automated
  acquisition, transfer chunking, and later deletion belong to adjacent objects. Children divide content inspectability and
  archiver process lineage, not ATT&CK utility, library, or custom-method categories.
