id: DEC-TA0009-T1602
tactic_ref: TA0009
candidate:
  source_type: attack
  source_attack_id: T1602
  source_attack_version: '19.1'
  name_en: Data from Configuration Repository
  name_zh: 从配置存储库收集数据
decision: adapt
rationale_zh: '固定 ATT&CK Enterprise 19.1 工作簿将 T1602 列为 Collection 父技术并列出两个实现导向子项。NCSC 对 Jaguar Tooth 的逆向分析直接证明恶意程序执行 Cisco
  IOS 命令导出当前 running configuration，并将命令结果经 TFTP 外送；2025 年 CISA 等机构联合通告还记录网络设备配置从 provider script 输出或主动设备勘测与 TFTP 取得，并说明已收集配置可含弱散列或可逆口令。这些材料足以证明配置内容实际进入攻击者控制链，而不只是在认证、查询或枚举层停留，因此保留父行为。


  Niji 需要适配父级，因为配置取得本身不天然匿迹。正式范围要求攻击者有意选择会改变防守观察的读取语境或副本位置，并把取得证明分为认证、请求、成功响应/返回量和配置内容导出四层。公开资料支持两个跨协议变量：借用正常配置管理/监控主体与来源取得内容，以及从已存在的归档、版本或
  provider script 副本取得内容，使本次 Collection 不产生对应的实时设备读取。SNMP/MIB、完整导出、NETCONF、厂商或格式均不直接成为 NJS。'
rationale_en: 'The fixed ATT&CK Enterprise 19.1 workbook places T1602 under Collection and lists two implementation-oriented
  children. NCSC''s reverse engineering of Jaguar Tooth directly establishes that malware executed a Cisco IOS command to
  dump the current running configuration and exfiltrated command output over TFTP. A 2025 joint advisory led by CISA also
  reports acquisition of network-device configurations from provider-script output or active device survey and TFTP, and explains
  that collected configurations can contain weakly hashed or reversibly encoded passwords. This evidence establishes configuration
  content entering an attacker-controlled chain rather than stopping at authentication, a request, or enumeration, so the
  parent behavior is retained.


  Niji must adapt the parent because acquiring configuration is not inherently stealthy. Formal scope requires an attacker-selected
  retrieval context or replica location that changes defender observation, and it separates proof into authentication, request,
  successful response or returned quantity, and exported configuration content. Public evidence supports two cross-protocol
  variables: acquiring content through an ordinary configuration-management or monitoring principal and source, and acquiring
  content from an existing archive, version, or provider-script copy so the current Collection event creates no corresponding
  live-device read. SNMP/MIB, full dumps, NETCONF, vendors, and formats do not directly become NJS boundaries.'
scope_notes_zh: 直接对象是管理设备、网络或基础设施所用配置存储中的实际配置值、运行/启动配置、协议和拓扑参数或历史副本。仅认证成功、进入管理会话、发送查询、看到对象名称或列举设备属于前提、尝试或 Discovery；只有成功响应中返回可用配置值，或可验证导出/副本内容进入攻击者控制链，才完成本
  Collection。T1213 管理一般协作、代码和业务信息库，T1530 管理通用云对象存储访问，NJT-0086 管理持久云应用授权，NJT-0135 管理跨轮自动化和检查点，NJT-0134/T1560 管理取得后的暂存和归档。合法
  NMS 轮询、RANCID 或同类备份、灾备校验、合规扫描、故障排除和厂商支持均为反例。
scope_notes_en: The direct object is actual configuration values, running or startup configuration, protocol and topology
  parameters, or historical copies from a repository used to manage devices, networks, or infrastructure. Successful authentication,
  entering a management session, sending a query, seeing object names, or enumerating devices is a prerequisite, attempt,
  or Discovery. This Collection behavior completes only when a successful response returns usable configuration values or
  verifiable export or replica content enters an attacker-controlled chain. T1213 owns general collaboration, code, and business
  repositories; T1530 owns generic cloud-object access; NJT-0086 owns durable cloud-app authorization; NJT-0135 owns cross-pass
  automation and checkpoints; and NJT-0134 or T1560 owns later staging and archiving. Legitimate NMS polling, RANCID or equivalent
  backup, disaster-recovery validation, compliance scans, troubleshooting, and vendor support are counter-examples.
