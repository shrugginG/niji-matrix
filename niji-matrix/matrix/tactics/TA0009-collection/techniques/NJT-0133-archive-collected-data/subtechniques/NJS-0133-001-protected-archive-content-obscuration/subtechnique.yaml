schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0133-001
parent_ref: NJT-0133
name:
  zh: 受保护归档内容遮蔽
  en: Protected Archive Content Obscuration
summary:
  zh: 以密钥不可得的归档容器承载已收集数据，使内容检查失去内部文件语义。
  en: Carry collected data in an archive whose key is unavailable to inspection, removing direct access to inner file semantics.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受保护归档内容遮蔽是攻击者把已取得数据放入需口令或密钥才能恢复内部条目的归档容器，并使无密钥的检查点只能处理外层字节。其直接目标是在随后暂存或外传前限制防守方对数据类别、来源文件及敏感内容的检查。口令算法和归档格式不是分类边界，关键是检查点能否恢复内部语义。
    en: Protected Archive Content Obscuration places acquired data in an archive whose inner members require a password or
      key to recover, leaving a keyless inspection point with outer bytes only. Its immediate purpose is to restrict inspection
      of data class, source files, and sensitive contents before later staging or exfiltration. Password algorithm and archive
      format do not define the category; recoverability at the inspection point does.
stealth_characteristics:
  paragraphs:
  - zh: 受保护归档内容遮蔽把可读的文件和部分成员元数据变成无法直接分类的加密负载，内容规则不能据外层扫描结果排除敏感数据。容器头、大小、创建者、源文件读取与外联仍可见；防守方若获得密钥、在加密前执行 DLP，或关联源侧敏感对象与产物，效果就会减弱。
    en: Protected Archive Content Obscuration turns readable files and some member metadata into encrypted payload that cannot
      be classified directly, so an outer scan cannot rule out sensitive data. Container headers, size, creator, source-file
      reads, and egress remain visible. The effect weakens when defenders obtain the key, classify sources before encryption,
      or link sensitive source objects to the archive output.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入已收集数据到受保护容器的可证转换，且检查点缺少必要密钥。合法加密备份、受批准传输及隐私保护归档是反例；高熵或受保护文件本身不能证明恶意收集。普通可解压归档属于父级但不属于本子项；把归档放到隐藏目录是 T1074 或相邻伪装边界，分卷和上传则需分别判断。
    en: Include a demonstrated transformation from collected data to a protected container where the inspection point lacks
      the necessary key. Approved encrypted backups, authorized transfers, and privacy archives are counterexamples; high
      entropy or protection alone does not prove malicious collection. An ordinarily parseable archive remains in the parent
      but not this child. Placement in a concealed directory belongs to T1074 or adjacent disguise boundaries, while splitting
      and upload require separate classification.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在端点或服务器取得文件、导出数据库或收集配置之后，可能先用口令归档集中这些内容，再交给暂存或外传链。TONESHELL 事件证明这种受保护归档用于实际外传；并不证明所有目标都采用相同检查路径。
      en: After obtaining files, database exports, or configuration on an endpoint or server, an adversary may consolidate
        them into a passworded archive before staging or exfiltration. The TONESHELL incident establishes such protected archival
        in an observed transfer chain but does not show that every target used the same inspection path.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需有目标数据的读取权、可生成归档的执行能力及不暴露给防守检查点的口令或密钥。若归档在被防守方掌握的密钥服务中创建，或源文件在加密前已被审计，内容遮蔽收益会下降。
        en: The adversary needs read access to the target data, the ability to build an archive, and a password or key unavailable
          at the defensive inspection point. The benefit falls if the archive uses a key service controlled by defenders or
          source files were audited before encryption.
    defender_model:
      paragraphs:
      - zh: 防守方可观察文件读取、归档创建、容器格式、大小、进程与传输，却可能无法解析内部成员。只有配置源侧分类、归档解析状态和后继对象关联的检查面，才能在不能解密时仍给出数据暴露风险，而不是把解析失败当作阴性。
        en: Defenders may see file reads, archive creation, format, size, process, and transfer while being unable to parse
          inner members. Source-side classification, archive parse status, and downstream object linkage are needed to assess
          exposure without decryption, rather than treating parser failure as a negative result.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 密钥缺失使归档内部数据不能在检查点恢复
    en: A missing key prevents archive contents from being recovered at inspection
  analysis:
    paragraphs:
    - zh: 攻击者先读取源文件，再把内容加密进归档。检查点只能处理容器字节而不能恢复原文件，内容分类和逐成员规则因此失去输入；源侧读取、外层产物和传输元数据仍为可用线索。只有把源、归档与后继取用关联，才能避免把解析失败误认作无敏感内容。
      en: The adversary reads source files and encrypts their contents into an archive. The inspection point sees container
        bytes rather than original files, depriving content classifiers and member rules of input. Source reads, outer artifact,
        and transfer metadata remain. Joining source, archive, and retrieval prevents a parse failure from being mistaken
        for absence of sensitive data.
