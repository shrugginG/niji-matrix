research:
  limitations:
    paragraphs:
    - zh: Unit 42 报告证明口令归档用于外传，但没有实测防御产品漏报；Microsoft 的缺口描述仅适用于所述邮件检查产品。其他检查点仍可能依据外层结构、源侧访问或密钥托管识别风险。
      en: Unit 42 proves passworded archival in an exfiltration chain but does not measure missed detections. Microsoft's
        inspection limitation applies to the described mail-security product. Other checkpoints may still identify risk through
        outer structure, source access, or key custody.
