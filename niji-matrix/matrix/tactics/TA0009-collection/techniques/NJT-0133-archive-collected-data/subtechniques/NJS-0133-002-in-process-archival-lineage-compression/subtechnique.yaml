schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0133-002
parent_ref: NJT-0133
name:
  zh: 进程内归档谱系压缩
  en: In-Process Archival Lineage Compression
summary:
  zh: 在既有收集进程中完成封装，减少独立归档工具的进程谱系痕迹。
  en: Package data within an existing collection process, removing a separate archiver utility from process lineage.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 进程内归档谱系压缩是攻击者让已经运行的收集组件直接调用内部压缩例程或已链接库，把已收集数据形成归档或编码输出，而不启动独立归档工具。其直接目的在于完成归档转换；匿迹变量是是否出现可被进程创建遥测识别的工具启动边，不是使用了哪一种库或算法。
    en: In-Process Archival Lineage Compression has an already running collector call an internal routine or linked library
      to turn acquired data into archive or encoded output without launching a separate archiver utility. Its direct purpose
      is archival transformation; the stealth variable is whether a utility-launch edge appears in process telemetry, not
      the chosen library or algorithm.
stealth_characteristics:
  paragraphs:
  - zh: 进程内归档谱系压缩使 7z、rar 或 tar 等独立工具命令行及父子进程边不出现，按工具名检测的规则因此失去匹配对象。源文件读取、同进程写入、加载的压缩模块或同进程外联仍可能暴露链条；仅仅没有看见工具也可能是日志缺失或合法应用内置压缩，不能作阳性判断。
    en: In-Process Archival Lineage Compression removes a separate 7z, rar, or tar command line and parent-child edge, leaving
      tool-name rules without a match. Source reads, writes by the same process, compression modules, or same-process egress
      may still expose the chain. A missing tool event alone can also reflect missing logs or legitimate integrated compression
      and is not a positive finding.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入可证实的源数据读取与同一现有进程内封装输出，且没有独立归档工具启动的路径。合法备份代理、浏览器下载器与数据库导出器可使用相同架构，必须结合未授权敏感数据目标和后继取用判断。纯粹内存中直接传输而无归档转换不属于本子项；口令造成的内容不可检查性可与兄弟项共现。
    en: Include a demonstrated path from source reads to packaging output inside an existing process without a separate archiver
      launch. Legitimate backup agents, browsers, and database exporters can use the same architecture, so unauthorized sensitive
      targets and later retrieval matter. Direct memory-to-network transfer without archival transformation is outside this
      child; password-based inspection loss may coexist with its sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 植入程序在端点长期运行并定期取得内部数据时，可把压缩代码直接放入自身处理路径，减少另起归档工具的可见动作。ESET 对 InvisiMole 的分析提供内置 Zlib 与外部 WinRAR 路径的实际对照，但没有证明所有收集内容都走内部路径。
      en: An implant that already runs on an endpoint and periodically acquires data can place compression code in its own
        pipeline, avoiding an extra archiver launch. ESET's InvisiMole analysis provides an observed contrast between integrated
        Zlib and external WinRAR paths, without proving that every collected item used the integrated path.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制已经能够读取目标数据的进程，并把压缩例程集成在该进程中；若只能调用系统工具，则此变量不成立。内置实现增加开发和内存处理成本，仍可能产生可见模块、缓冲、输出文件及网络传输。
        en: The adversary must control an existing process with access to target data and integrate a compression routine
          within it. The variable does not hold when only a system utility can be invoked. Integration raises implementation
          and memory-processing cost while still leaving possible modules, buffers, output files, and network traffic.
    defender_model:
      paragraphs:
      - zh: 防守方若只保留进程启动与已知工具命令行，将缺少该路径的关键事件；文件读取、写入、模块加载与网络事件在充分采集时仍能按进程身份连接。没有源文件读取审计或稳定进程标识时，只能提出未解析的输出来源，不能断言进程内归档。
        en: A defender retaining only process starts and known archiver commands lacks a key event for this path. With sufficient
          collection, file reads, writes, module loads, and network events can still be joined by process identity. Without
          source-read audit or a stable process key, the output origin remains unresolved rather than proven in-process archival.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 归档转换不产生独立工具启动边
    en: Archival transformation produces no separate utility-launch edge
  analysis:
    paragraphs:
    - zh: 攻击者将压缩例程放在既有植入进程中，源文件进入该进程后直接成为归档输出。只依赖独立归档工具进程和命令行的检测不再有匹配事件，但同进程读取、模块、写入及外联可以恢复转换链。此差异是技术推断，不能由单个缺失事件或所有内置压缩行为自动推出规避意图。
      en: The adversary places compression in an existing implant, so source files enter that process and become archive output
        directly. Detection dependent on a separate utility process and command line has no event to match, but same-process
        reads, modules, writes, and egress can restore the conversion chain. This difference is a technical inference, not
        proof of evasive intent from one missing event or from every integrated compressor.
