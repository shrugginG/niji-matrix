research:
  limitations:
    paragraphs:
    - zh: ESET 的内置 Zlib 主要描述内部数据与注册表材料；Bitdefender 直接显示收集文件在恶意程序内形成压缩 pak。两者共同支持无独立归档工具的实现路径，但均未实测对进程名告警的规避率。源读取审计缺失或正常应用集成归档时，应降低结论置信度。
      en: ESET's integrated Zlib passage chiefly describes internal data and Registry material, while Bitdefender directly
        shows collected files compressed into a pak by malware code. Together they support a path without a separate archive
        utility, but neither measures evasion of process-name alerts. Missing source-read audit or legitimate integrated packaging
        lowers confidence.
