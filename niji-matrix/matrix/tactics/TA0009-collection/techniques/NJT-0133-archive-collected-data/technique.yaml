research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定版锚定归档行为，却不能单独证明 Niji 子项的规避意图。Unit 42 的口令 RAR、ESET 的内置 Zlib 与外部 WinRAR，以及 Bitdefender 直接把收集文件压缩为 pak 产物的分析分别支持不同实现。进程内归档的检测差异具有明确技术基础，但没有事件级资料量化告警下降，故保持中等置信度；暂存、分卷和删除不能被归入同一个归档机理。
      en: The ATT&CK technique description anchors archival behavior but does not alone establish evasive intent for these
        variants. Unit 42's passworded RAR, ESET's integrated Zlib and external WinRAR, and Bitdefender's direct compression
        of collected files into a pak artifact support distinct implementation facts. The in-process detection difference
        has a clear technical basis, but no event-level evidence quantifies reduced alerts, so it remains medium confidence.
        Staging, splitting, and deletion must not be folded into one archive mechanism.
    - zh: Microsoft Safe Attachments 的口令限制仅针对该邮件检查产品；不能据此宣称所有端点和网关都无法识别外层归档。若 Windows 文件读取审计没有开启、归档流从不落盘或产物被多次重写，源到产物的防御关联会不完整。正式分析需要在实际环境验证源文件读取、产物解析状态与出口对象之间的键。
      en: Microsoft Safe Attachments' password limitation applies to that mail-inspection product and does not imply that
        all endpoints or gateways lose outer-archive visibility. Source-to-output correlation is incomplete when Windows file-read
        audit is absent, the archive stream never lands on disk, or output is repeatedly rewritten. The analytic must validate
        keys among source reads, parse status, and outbound objects in the actual environment.
