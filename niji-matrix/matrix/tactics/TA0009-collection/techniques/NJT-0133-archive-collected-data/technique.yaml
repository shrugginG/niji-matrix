schema_version: 2.0.0
type: technique
id: NJT-0133
name:
  zh: 归档已收集数据
  en: Archive Collected Data
summary:
  zh: 攻击者在外传前把已收集数据压缩、加密或封装，以降低内容可检查性或改变归档行为的可见痕迹。
  en: An adversary compresses, encrypts, or packages already collected data before exfiltration to reduce content inspectability
    or alter the visible traces of archiving.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-retained
    source_attack_id: T1560
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1560
definition_and_concept:
  paragraphs:
  - zh: 本技术指攻击者在取得目标数据之后、向控制端传送之前，将其转换为压缩包、加密归档或等价的封装数据流。核心对象是这次转换及产物：多个源文件可能成为一个容器，单个源文件可能成为不可直接解释的压缩或加密流。实现可以使用外部工具、链接库或程序内置代码，不能据此把
      ATT&CK 的实现分类照搬为 Niji 子技术。
    en: 'This technique covers the attacker-controlled conversion of target data after acquisition and before delivery to
      a control endpoint into a compressed package, encrypted archive, or equivalent packaged stream. Its core objects are
      the transformation and result: multiple source files may become one container, or one source file may become a compressed
      or encrypted stream that cannot be interpreted directly. External utilities, linked libraries, and built-in code can
      all implement it; those ATT&CK implementation classes do not define Niji children.'
  - zh: 归档可同时服务于运输效率和匿迹。是否属于本矩阵的匿迹技术，应依据其让源文件语义、敏感性或执行谱系更难被防守方连接的可观察事实，而非仅凭扩展名、压缩比、工具名称或后来发生外传来推断主观意图。
    en: Archiving can serve both transport efficiency and stealth. Inclusion in this matrix should rest on observable facts
      showing that source-file meaning, sensitivity, or execution lineage became harder for the defender to connect, rather
      than inferring intent solely from an extension, compression ratio, tool name, or later exfiltration.
stealth_characteristics:
  paragraphs:
  - zh: 压缩使大量原始文件的名称、内容和逐文件传输量缩为较少的产物与传输，原有按文件类型或内容运行的检查不一定能直接作用于外层字节。密码保护或加密进一步使没有密钥的检查器无法还原内部条目；但容器头、创建时间、大小、写入进程和先前源文件访问仍可能可见。
    en: Compression collapses many source names, contents, and per-file transfers into fewer artifacts and transfers, so controls
      that inspect original file types or contents may not work directly on the outer bytes. Password protection or encryption
      further prevents an inspector without the key from recovering inner entries, although the container header, creation
      time, size, writing process, and earlier source-file access may remain visible.
  - zh: 当封装发生在既有进程内时，归档工具启动事件可能完全不存在，只有源文件读取、模块调用、输出写入或同进程外联保留为线索。该差异不能从“没有看到工具”倒推成立：进程日志缺失、正常应用集成归档和直接编码通信都可产生相似现象，必须结合可证明的输入到产物关系。
    en: 'When packaging occurs inside an existing process, a separate archiver launch event may never exist; source reads,
      module use, output writes, or same-process egress remain as clues. Absence of a tool event cannot establish this variant
      by itself: missing process telemetry, legitimate integrated archiving, and direct encoded communications can look similar.
      The input-to-output transformation must be demonstrated.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入针对已收集目标数据的压缩、加密和封装，无论输出是落盘容器还是随即发送的数据流。单纯复制、移动、集中存放或选取暂存目录归 T1074；按照规则定期搜寻和获取数据归 T1119；传输路径、协议、带宽、分块大小或删除完成后的文件归属后续外传、传输大小限制或清痕技术。分卷归档如果只有网络分块大小这一目的，应交给
      T1030 而非据此创造 T1560 子项。
    en: Scope includes compression, encryption, and packaging of already collected target data, whether the output is a disk
      container or an immediately transmitted stream. Copying, moving, centralizing, or choosing a staging directory belongs
      to T1074; repeatedly finding and acquiring data under rules belongs to T1119. Transfer path, protocol, bandwidth, chunk
      size, or post-transfer deletion belongs to exfiltration, transfer-size, or cleanup techniques. A multivolume archive
      used only to size network chunks should be handled under T1030 rather than used to manufacture a T1560 child.
  - zh: 正常备份、软件发布、邮件附件和用户授权的数据打包会产生相同的压缩程序及容器格式；受保护的业务归档也可能无法在检测系统中解密。仅有归档文件或失败的内容检查不够，需将敏感源文件访问、执行身份、异常目的地、授权业务流程和产物关系合并判断。仅对恶意代码本身做打包、编码或混淆，而未处理已收集数据的行为，归其他技术。
    en: Legitimate backup, software release, email attachment, and authorized user packaging create the same utility and container
      formats; protected business archives may also be unreadable to a scanner. An archive file or failed content scan alone
      is insufficient. Sensitive source access, execution identity, unusual destination, approved workflow, and output relationship
      must be assessed together. Packing, encoding, or obfuscating malicious code itself without processing collected data
      belongs elsewhere.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 常见情境是在已入侵端点或服务器上选取文档、数据库导出、凭据材料或配置后，先形成便于后续上传的归档。外部可访问 Web 服务器、共享目录或本地主机均可承载产物，但地点只描述 T1074 的伴随行为；T1560 的关键时刻是源数据被转换为容器或编码流。Unit
        42 和 SecureWorks 的事件显示加密 RAR 可与分卷和暂存同现，ESET 的 InvisiMole 分析则显示恶意程序可在内部完成部分压缩。
      en: A common scenario begins after compromise of an endpoint or server, when documents, database exports, credential
        material, or configuration are selected and packaged for later upload. An internet-facing web server, share, or local
        host may hold the result, but location describes accompanying T1074 behavior; the T1560 moment is conversion of source
        data into a container or encoded stream. Unit 42 and SecureWorks incidents show encrypted RAR alongside volume splitting
        and staging, while ESET's InvisiMole analysis shows that malware can perform some compression internally.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须已能读取目标数据，并有权启动归档工具、调用可用库或运行自己的压缩代码。其可控制输入集合、归档参数、密钥或口令及输出位置，但未必控制企业的端点传感器、DLP 或出口网关。若想削弱内容检查，需要密钥不在防守检查点可用；若想省去独立归档进程，需要能够在现有进程上下文中完成转换。
        en: The attacker must already be able to read the target data and invoke an archive utility, an available library,
          or custom compression code. The attacker can choose inputs, archival parameters, keys or passwords, and output location,
          but may not control endpoint sensors, DLP, or egress gateways. Content inspection is weakened only if the key is
          unavailable at the defensive inspection point; eliminating a separate archiver process requires transformation inside
          an existing process context.
    defender_model:
      paragraphs:
      - zh: 防守方可能具备文件创建、进程启动、网络连接与 DLP 分类事件，但未必持续记录所有文件读取、归档条目或内存缓冲。若只在外传点检查容器内容，密码保护会形成盲区；若只按 7z、rar、tar 等工具命令行告警，进程内路径会漏报。具备源文件敏感性标签、进程关联
          ID、产物解析结果与出口对象 ID 的环境可以重建更多上下文，即使仍无法解密内容。
        en: A defender may have file creation, process launch, network connection, and DLP classification events without continuous
          records of every file read, archive member, or memory buffer. Inspecting only container content at egress leaves
          a blind spot when the container is password protected; alerting only on 7z, rar, or tar command lines misses an
          in-process path. Environments with source sensitivity labels, process correlation IDs, archive parsing outcomes,
          and egress object IDs can recover more context even when content cannot be decrypted.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 将已收集数据封入难以直接检查的归档内容
    en: Place collected data in archive content that resists direct inspection
  analysis:
    paragraphs:
    - zh: 攻击者把可读源文件转换为压缩或加密产物，检查点看到的从原始语义变成容器字节；若密钥不可用，检查器不能完整恢复内部内容。攻击者因而可以让内容规则、敏感信息分类或逐文件审阅失去直接输入，但文件访问、产物头部、大小和转出元数据并不随之消失。
      en: The attacker transforms readable source files into compressed or encrypted output, so an inspection point sees container
        bytes in place of original semantics. If the key is unavailable, the inspector cannot fully recover inner content.
        Content rules, sensitive-information classification, or per-file review then lose their direct input, while file access,
        container headers, size, and transfer metadata remain.
  confidence: high
  evidence_refs:
  - REF-000504
  - REF-000505
  - REF-000507
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 在既有进程内形成归档而省去独立工具启动
    en: Create packaging inside an existing process without a separate utility launch
  analysis:
    paragraphs:
    - zh: 由植入程序自身或已链接代码完成归档时，基于单独归档工具进程及命令行的检测没有触发对象。防守方仍可从同一进程的源文件访问、归档写入、压缩模块加载或外联行为恢复链条；若这些数据未采集，行为可能落在进程创建监测之外。现有证据支持实现和遥测差异，不直接证明每个使用内置压缩的攻击者都有规避进程检测的主观目的。
      en: When an implant or linked code packages data itself, a detector keyed to a separate archiver process and command
        line has no event to match. A defender may still reconstruct the chain from source-file access, archive writes, compression-module
        loads, or egress by the same process; without such telemetry, the behavior can fall outside process-creation monitoring.
        Current evidence supports the implementation and telemetry difference, not a claim that every actor using integrated
        compression intended to evade process detection.
  confidence: medium
  evidence_refs:
  - REF-000504
  - REF-000506
  - REF-000230
  - REF-000512
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术按归档过程中防守方失去何种观察来划分：受保护归档内容遮蔽改变内部数据的可恢复性，进程内归档谱系压缩则移除独立归档工具的进程启动边。两者可以同现，但前者由密钥可得性与内容解析状态验证，后者由源读取、同进程转换与产物或外联关系验证；工具、库和自定义算法只是实现。分卷、存放位置和文件改名分别留给传输、暂存或身份伪装边界。
      en: 'The children divide what defenders lose during archival: Protected Archive Content Obscuration changes recoverability
        of inner data, while In-Process Archival Lineage Compression removes a separate archiver launch edge. They can coexist,
        but the former is tested through key availability and parse status, and the latter through source reads and output
        or egress by the same process. Utility, library, and custom algorithm are implementations. Volume splitting, storage
        location, and renaming remain with transfer, staging, or identity-disguise boundaries.'
  coverage: established
  subtechnique_refs:
  - NJS-0133-001
  - NJS-0133-002
