research:
  limitations:
    paragraphs:
    - zh: ATT&CK 19.1 明确支持“集中暂存减少 C2 连接”的因果方向；两个事件报告证实中间服务器和取回链，但公开材料不足以量化每案的外联节点收敛比。 正常备份汇聚、集中 ETL 和邮件迁移可形成相似图形，需要授权与业务基线区分。
      en: ATT&CK 19.1 supports the causal direction that central staging reduces C2 connections; the two incident reports
        establish intermediate servers and retrieval chains, but public material does not quantify the egress-node convergence
        ratio in either case. Legitimate backup aggregation, centralized ETL, and mailbox migration can form similar graphs
        and require authorization and workflow baselines.
