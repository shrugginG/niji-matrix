schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0134-001
parent_ref: NJT-0134
name:
  zh: 出口汇聚暂存
  en: Egress-Convergent Staging
summary:
  zh: 攻击者先将多处已收集数据汇入少数内部节点，再由这些节点对外取用，使外部连接与真实来源脱钩。
  en: Adversaries first aggregate collected data from several origins at a few internal nodes, then retrieve it externally
    from those nodes, separating outbound connections from the true sources.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 出口汇聚暂存是在外传前，把来自多个已取得来源的数据放到少数受控中间节点，并让后续外联从这些节点发起的安排。它服务于“汇集后取用”的 Collection 阶段，关键是出口来源与原始数据来源的关系被收敛，而不是 SMB、SCP、云实例或某一服务器产品。
    en: Egress-Convergent Staging places data from multiple already acquired sources on a small number of controlled intermediate
      nodes before exfiltration and initiates later external retrieval from those nodes. It serves the aggregate-then-retrieve
      stage of Collection. The defining property is convergence between outbound source and original data sources, not SMB,
      SCP, cloud instances, or a server product.
stealth_characteristics:
  paragraphs:
  - zh: 出口汇聚暂存让外部边界只看到少数外联节点，因此源主机的收集规模与流向不再由外联主机数直接体现。内部横向复制、共享访问、暂存目录增长、服务器访问和最终外联仍会形成多对一图形；部署了跨边界谱系关联的防守方反而更容易注意异常的单点汇入。
    en: Egress-Convergent Staging leaves an external boundary seeing only a few outbound nodes, so source-host count no longer
      directly reflects collection scale or direction. Internal lateral copying, share access, staging-directory growth, server
      access, and final egress still form a many-to-one graph; defenders with cross-boundary lineage may find the unusual
      concentration easier to notice.
scope_boundary_definition:
  paragraphs:
  - zh: 本项要求至少两个可区分的数据来源向较少的暂存节点汇聚，随后这些节点被用来取用或外传。单源的远程复制、正常备份代理与集中 ETL 都不因其拓扑相似而自动纳入；应结合授权、数据类别、任务时间和目标节点角色判断。归档形成属于 T1560，自动选择并复制源文件属于
      T1119，后续外传协议属于相应外传技术。
    en: This child requires at least two distinguishable data origins converging on fewer staging nodes that are later used
      for retrieval or exfiltration. A single-source remote copy, normal backup agent, or central ETL is not automatically
      included because its topology looks similar; authorization, data class, schedule, and node role must be assessed. Archive
      creation belongs to T1560, automatic source selection and copying to T1119, and the eventual outbound protocol to the
      relevant exfiltration technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在多个主机或邮箱已暴露后，攻击者可用内部共享或管理权限把导出物汇集到被控 Web 服务器，再由该服务器提供一次或少数几次外部取回。Scattered Spider 联合建议直接记录多个数据源汇入中央数据库；BRONZE UNION
        在受害环境中把加密归档转至已经遭入侵的互联网服务器，Volexity 观察到 OWA 上的邮箱导出归档。后两案支持中间服务器与后继取回，但不能单独证明同一事件有多少原始来源。
      en: Once several hosts or mailboxes are exposed, the adversary can use internal shares or administration rights to aggregate
        exports on a compromised web server and retrieve them externally in one or a few sessions. The Scattered Spider joint
        advisory directly records multiple data sources brought into a central database. BRONZE UNION moved encrypted archives
        to already compromised Internet-facing servers, while Volexity observed mailbox-export archives on OWA. The latter
        two cases support intermediate servers and later retrieval but do not individually establish the number of original
        sources in each event.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要多个数据来源的读取权限、一个具备足够容量的可写中间节点，以及对该节点外部取用能力。增加汇聚点会提高内部传输和权限暴露，也可能使被控服务器的文件增长异常。
        en: The attacker needs read access to multiple data origins, a writable intermediate node with sufficient capacity,
          and an external retrieval path from it. Adding the aggregation point increases internal transfer and permission
          exposure and may make file growth on the compromised server anomalous.
    defender_model:
      paragraphs:
      - zh: 假定出口边界能看到连接但缺少源文件上下文，内部共享审计和目标主机文件创建可能只部分开启。若对共享访问的来源 IP、账户、目标文件，与出口服务器上的创建及后续 HTTP 请求进行关联，原本分离的阶段可被恢复；没有详细共享审计或服务器日志时只能提出较弱怀疑。
        en: Assume the egress boundary sees connections but lacks source-file context, while internal share auditing and destination
          file creation may be only partly enabled. Joining share-access source IP, account, and target with creation on the
          egress server and later HTTP requests can reconstruct the stages. Without detailed share or server logs, only a
          weaker suspicion is possible.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以内部多源汇入替换多源直接外联
    en: Replace multiple direct exits with internal many-to-one ingress
  analysis:
    paragraphs:
    - zh: 攻击者把多源数据先送到被控节点，再从该节点取走，令仅依赖外联节点清单的规则把多个来源合并成一个源。内部传输与目标写入没有消失，跨主机图关联可以重建真实规模，因此这一机理依赖出口视角与内部视角之间的关联缺口。
      en: By sending multiple sources to a controlled node before retrieval, the adversary makes rules based only on outbound-node
        lists collapse many origins into one. Internal transfers and destination writes remain. Cross-host graph correlation
        can recover the true scale, so the mechanism depends on a gap between egress and internal views.
