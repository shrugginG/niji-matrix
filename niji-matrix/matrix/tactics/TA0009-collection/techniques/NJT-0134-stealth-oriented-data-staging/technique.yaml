research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定版直接说明集中暂存可减少到 C2 的连接，但没有给出特定事件中的来源数、出口数或告警结果。Volexity、SecureWorks 与澳大利亚联合建议证明中间点或多源数据库的使用，无法单独证明每次选择都以规避检测为主观目的。案例还包含归档、改名和外传步骤，效果不得全部归因于暂存。
      en: The fixed ATT&CK baseline explicitly states that central staging can reduce C2 connections but gives no incident-specific
        source count, egress count, or alert outcome. Volexity, SecureWorks, and the Australian joint advisory establish intermediate
        points or a multi-source database but do not prove that every choice was subjectively intended to evade detection.
        The cases also include archiving, renaming, and exfiltration, whose effects cannot all be attributed to staging.
    - zh: 多源到单点也是正常备份、邮件迁移和 ETL 的常见形态。共享审计或文件创建数据缺失时，不能仅凭 5145 的权限检查判断成功暂存；Web 请求可证明取用尝试，但不一定证明完整内容已离开网络。低审查命名空间与非文件缓冲仍有研究线索，因与既有正式对象边界未收敛而未设为本批
        NJS。
      en: Many-source-to-one-node paths are also ordinary for backup, mailbox migration, and ETL. Without share audit or file-create
        data, a 5145 permission check alone cannot prove successful staging; a web request may show retrieval attempt without
        proving complete transfer. Low-scrutiny namespaces and non-file buffers remain research leads and were not made Niji
        children in this batch because their boundaries with existing formal objects have not converged.
