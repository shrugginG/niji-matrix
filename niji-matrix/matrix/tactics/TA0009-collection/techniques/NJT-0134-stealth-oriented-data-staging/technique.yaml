subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子项以多源数据是否先汇聚到少数外联节点为轴，而不使用 ATT&CK 的本地与远程位置标签。出口汇聚暂存改变源主机到边界的可见拓扑，跨主机共享访问、目标写入和外联图是其直接防守差异。低审查命名空间和注册表缓冲有案例线索，但与既有资源身份拟态及非文件载体遮蔽边界未充分收敛，暂留研究记录。
      en: The formal child uses whether multiple source hosts first converge on few outbound nodes, rather than ATT&CK local
        and remote location labels. Egress-Convergent Staging changes the source-host-to-boundary topology, with cross-host
        share access, target writes, and outbound graph as its distinct defender view. Low-scrutiny namespaces and Registry
        buffers have case leads, but their boundaries with existing resource-identity mimicry and non-file carrier concealment
        remain unresolved and are deferred in research.
  coverage: established
  subtechnique_refs:
  - NJS-0134-001
