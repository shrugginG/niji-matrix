schema_version: 2.0.0
type: technique
id: NJT-0134
name:
  zh: 匿迹型数据暂存
  en: Stealth-Oriented Data Staging
summary:
  zh: 攻击者在外传前重排已收集数据的暂存拓扑或可见位置，使数据来源、敏感性质或取用链路更难被防守方识别。
  en: Before exfiltration, adversaries rearrange the topology or visible location of collected data so its origin, sensitivity,
    or retrieval chain is harder for defenders to identify.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1074
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1074
definition_and_concept:
  paragraphs:
  - zh: 匿迹型数据暂存是攻击者在已取得数据之后、最终取走或外传之前，将多个来源的内容写入受控中间节点，并改变数据来源与出口节点之间可见关系的 Collection 技术。直接对象是暂存拓扑及其源、落点、后继取用链，而不是文件类型、归档格式或某个本地或远程位置标签。集中点可让攻击者从少数节点取走数据，而来源主机只显示内部复制。
    en: Stealth-Oriented Data Staging is a Collection technique in which an adversary writes acquired content from several
      origins to a controlled intermediate node before final retrieval or exfiltration, changing the visible relationship
      between sources and egress. Its direct object is the staging topology and the source, destination, and later-use chain,
      not file type, archive format, or a local-versus-remote label. Aggregation can let the actor retrieve data from few
      nodes while source hosts show internal copying.
  - zh: 普通暂存只是数据处理步骤；本适配技术要求攻击者控制的暂存安排使单一观察面的判断发生变化。T1119 管理数据的重复自动获取，T1560 管理已收集数据的归档转换，真正的外传由后继战术描述。三者可以同现，但对暂存的判断必须依赖源到中间点再到取用者的独立证据。
    en: Ordinary staging is a data-processing step; this adapted technique requires an attacker-controlled arrangement that
      changes what one defensive vantage can conclude. T1119 governs repeated automated acquisition, T1560 governs archival
      transformation of collected data, and later exfiltration belongs to its own tactic. They may coexist, but a staging
      verdict requires independent evidence linking sources to the intermediate point and then to retrieval.
stealth_characteristics:
  paragraphs:
  - zh: 多台受影响主机的数据先进入同一中间节点时，出口传感器只见到该节点的少量取用或外联，难从外联主机清单估计真正的来源数量。攻击者把原本分散的直接外联痕迹转成内部共享访问和目标文件写入；这些痕迹没有消失，并可能在汇聚节点形成异常的写入峰值。
    en: When data from several affected hosts first enters one intermediate node, an egress sensor sees only a few retrievals
      or outbound connections from that node and cannot estimate all source hosts from the egress list. The adversary trades
      dispersed direct egress for internal share access and target-file writes. Those traces remain and may create an unusual
      write spike at the aggregation point.
  - zh: 匿迹收益取决于防守方是否把内部文件与网络事件连接到最终出口。如果共享访问、目标创建和取回请求可按主机、对象和时间关联，暂存反而呈现多源汇入、少点外联的明显图形。目录位置、加密归档或快速清理可能另有作用，却不构成本批已证实的出口汇聚子项边界。
    en: The stealth benefit depends on whether defenders join internal file and network events to final egress. With share
      access, target creation, and retrieval requests linked by host, object, and time, staging instead forms a conspicuous
      many-source-inbound, few-node-outbound graph. Directory location, encrypted archives, or rapid cleanup may have other
      effects but do not define the egress-convergence child established in this batch.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入已取得数据被多个来源送往攻击者可控中间节点，且后续从少数节点取用导致来源主机的直接外联观察发生变化的行为。至少应证实源侧复制、目标写入和后继取用中的两个相邻环节；只有目录存在或共享权限检查、没有成功写入时，不能宣称完成汇聚。
    en: Include acquired data sent from multiple sources to an attacker-controlled intermediate node where later retrieval
      through few nodes changes observation of direct source-host egress. At least two adjacent stages among source copying,
      destination creation, and later retrieval should be established. A directory's existence or a share permission check
      without successful writes does not establish completed convergence.
  - zh: 批准备份、邮件迁移、集中 ETL 和合法数据仓库可形成相似多源拓扑，须结合身份、任务范围、落点和取用者判断。归档容器属于 T1560，自动取得数据属于 T1119，外传后的清理属于相邻防御规避技术。隐藏目录、Web 资源路径与注册表缓冲作为未收敛轴保留研究，不由其外观单独认定本子项。
    en: Approved backup, mailbox migration, centralized ETL, and legitimate data warehouses can form similar many-source topology
      and require comparison with identity, job scope, destination, and retriever. Archive containers belong to T1560, automated
      acquisition to T1119, and post-exfiltration cleanup to adjacent defense evasion. Hidden paths, web-resource paths, and
      Registry buffers remain research axes whose appearance alone does not establish this child.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得文件共享、邮箱或数据库访问后，可利用已控制的文件或 Web 服务器作为中间汇聚点，再从该点集中取走数据。Volexity 的 OWA 邮箱导出链和 SecureWorks 的 BRONZE UNION 中间服务器链证明这种路径可在实际入侵中出现；澳大利亚联合建议还记录
        Scattered Spider 使用 ETL 将多源数据汇入中央数据库。公开材料没有量化这些事件中的告警下降。
      en: After gaining access to shares, mailboxes, or databases, an adversary may use a controlled file or web server as
        an intermediate aggregation point and retrieve data from there. Volexity's OWA mailbox-export chain and SecureWorks'
        BRONZE UNION intermediate-server chain show such paths in intrusions; an Australian joint advisory also records Scattered
        Spider using ETL to bring many sources into a central database. The public reports do not quantify reduced alerts
        in those incidents.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要读取多个来源、写入同一中间点并再次取用的权限，通常还需跨主机或跨服务移动数据。其可控制汇聚节点、写入账户和取走时机，却承担内部复制增加、暂存容量与权限暴露的成本；若只控制一台主机，便无法成立多源收敛变量。
        en: The adversary needs authority to read multiple sources, write one intermediate point, and retrieve from it, often
          across hosts or services. The actor may control the aggregation node, writing identities, and retrieval time but
          incurs more internal copying, storage demand, and permission exposure. Control of only one source host does not
          establish a many-source convergence variable.
    defender_model:
      paragraphs:
      - zh: 防守方可从目标服务器的共享访问、文件创建、Web 请求和网络流量恢复链条，但单看出口会低估源主机数量。Windows 5145 是访问检查而非成功写入证明，需要与文件创建事件连接；如果中间节点通过非 SMB 方式接收数据，须另有对应传输日志。身份、资产和文件键跨设备不一致时，结论应保持为部分谱系。
        en: Defenders can recover the chain through share access, file creation, web requests, and network flows at the destination
          server, but an egress-only view undercounts source hosts. Windows 5145 is an access check rather than proof of a
          successful write and needs a file-create join. Other transfer logs are needed when the intermediate point receives
          data outside SMB. Inconsistent identity, asset, or file keys across devices leave only partial lineage.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 通过内部多源汇聚减少来源主机的直接外联痕迹
    en: Reduce direct source-host egress traces through internal many-source aggregation
  analysis:
    paragraphs:
    - zh: 攻击者将多台来源主机的数据先复制到受控中间点，再从该点取走。只观察外联的防守方会把多个来源压缩为一个出口节点，难以直接估计受影响主机数量；共享访问、目标写入和内部传输没有消失。跨主机与出口关联能重建多源汇入、少点外联的图形，因此收益取决于观察面之间的关联缺口。
      en: The adversary first copies data from several source hosts to a controlled intermediate point and then retrieves
        it there. A defender watching egress alone sees many sources collapsed into one outbound node and cannot directly
        estimate the affected host count. Share access, destination writes, and internal transfers remain. Joining host and
        egress telemetry can reconstruct the many-to-one graph, so the benefit depends on a correlation gap between observation
        points.
  confidence: medium
