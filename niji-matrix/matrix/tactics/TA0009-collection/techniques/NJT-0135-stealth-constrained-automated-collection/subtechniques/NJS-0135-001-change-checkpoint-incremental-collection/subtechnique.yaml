research:
  limitations:
    paragraphs:
    - zh: 公开逆向结果证明了 FilePakMonitor 的状态与筛选实现，却没有对照试验量化检测概率。文件修改时间可以被篡改，某些文件访问不经过所配置的 Windows 审计面；跨平台或云端增量收集需另找案例证明，不得从本机案例直接泛化。
      en: Published reverse engineering establishes FilePakMonitor's state and selection behavior but provides no controlled
        measurement of detection probability. File modification times can be manipulated, and some accesses fall outside a
        configured Windows audit surface. Cross-platform or cloud incremental collection needs separate case evidence rather
        than extrapolation from this host example.
