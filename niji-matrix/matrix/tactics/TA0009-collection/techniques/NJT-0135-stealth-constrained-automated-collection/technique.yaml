schema_version: 2.0.0
type: technique
id: NJT-0135
name:
  zh: 匿迹约束的自动收集
  en: Stealth-Constrained Automated Collection
summary:
  zh: 攻击者用预设规则和状态持续获取内部数据，并约束每次获取的范围或时机，以减少单次可见收集痕迹，同时留下可跨轮次关联的访问记录。
  en: An adversary uses predefined rules and state to acquire internal data repeatedly while constraining the scope or timing
    of each acquisition, reducing each visible collection episode while leaving access records that can be correlated across
    runs.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1119
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1119
definition_and_concept:
  paragraphs:
  - zh: 匿迹约束的自动收集指入侵者在已获得的主机、账户或云资源访问权限内，配置代理、脚本、计划流程或 API 客户端按规则反复取得内部数据，并通过可重复的范围或触发控制降低收集动作的显著性。行为核心是从源对象读取或复制数据；规则可以选择文件、对象、变化状态或事件窗口，但只有其对痕迹有因果作用时才构成匿迹特性。
    en: Stealth-constrained automated collection is the repeated acquisition of internal data through an agent, script, scheduled
      workflow, or API client operating with access already obtained by an intruder. A repeatable scope or trigger constraint
      makes individual collection episodes less conspicuous. The core behavior is reading or copying source objects. Rules
      may select files, objects, change state, or event windows, but they count as stealth properties only when they causally
      alter the traces left behind.
  - zh: 该技术表达的是数据获取的编排维度，可以与从本地系统、共享驱动器、云存储或电子邮件获取数据同时出现。它不把后续暂存、归档压缩或外传定义为自动收集的必要步骤，也不因工具同时提供这些功能而吞并相邻父技术。正式对象应保留 ATT&CK
      T1119 的自动化获取锚点，同时显式要求匿迹变量成立。
    en: This technique describes the orchestration of acquisition and can coexist with collection from a local system, a shared
      drive, cloud storage, or email. Subsequent staging, archive creation, and exfiltration are separate operations rather
      than required stages of automated collection, even when one tool performs all of them. The formal object should retain
      T1119's automated-acquisition anchor while explicitly requiring an established stealth variable.
stealth_characteristics:
  paragraphs:
  - zh: 状态化的筛选能够让后续轮次只读取近期变化的目标，减少单轮重复读取的文件数和目录广度；在以短时间大量读取为条件的告警中，局部信号可能下降，但这些较小活动仍会在较长时间内累积。首次基线扫描、定期列目录、检查点文件和目标文件的实际读取仍然可见；攻击者不能凭“自动”或“低频”推导出不可见。
    en: Stateful selection can limit later passes to recently changed targets, reducing repeated file reads and directory
      breadth per pass. Local signals may fall below rules that require a large short-window read burst, while smaller episodes
      accumulate over a longer horizon. The initial baseline pass, directory enumeration, checkpoint artifact, and actual
      reads remain observable; neither automation nor a low frequency implies invisibility.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入有可核验获取规则、重复或自动触发、并有意改变获取痕迹的内部数据收集。T1560 的归档容器形成、T1074 的汇聚位置与暂存生命周期、T1020 的自动外传，以及 T1053 或其他执行技术的任务注册和触发，由各自对象负责；T1119
      只描述收集判定和源数据取得。文件扩展名、目标平台、任务调度器或 API 产品不是 Niji 子技术边界。
    en: Include internal-data acquisition with verifiable rules and repeated or automatic triggering when those rules intentionally
      change acquisition traces. T1560 owns archive-container formation, T1074 owns the aggregation location and staging lifecycle,
      T1020 owns automated exfiltration, and T1053 or other execution techniques own task registration and launch. T1119 covers
      the decision to collect and the acquisition from source objects. File extensions, target platforms, schedulers, and
      API products are not Niji child boundaries.
  - zh: 正常备份、企业搜索索引、同步、ETL、电子发现和安全扫描也可能定期读取相同文件，甚至采用增量规则。仅凭重复性、检查点、文件数量或夜间运行无法判定恶意；需要结合进程或身份来源、授权作业清单、读取目标敏感性、任务配置和后续去向。按活动窗口捕获屏幕或键盘内容可能归
      T1113/T1056；只有其自动触发如何改变收集痕迹得到独立证明时，才可同时从 T1119 角度讨论。
    en: Legitimate backup, enterprise indexing, synchronization, ETL, e-discovery, and security scans may read the same files
      periodically and may also use incremental rules. Repetition, a checkpoint, file count, or nighttime execution cannot
      by itself establish malice. Process or identity provenance, an inventory of authorized jobs, target sensitivity, task
      configuration, and subsequent destinations must be considered. Screen or keystroke capture during an activity window
      may belong to T1113 or T1056; a T1119 interpretation additionally requires independent proof that its automated trigger
      changes collection traces.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得持续访问后，希望长期获取新增或修改的文档，而持续全盘复制会反复触及大量静态文件。其收集组件可以先建立基线，再在后续轮次按变化时间选择目标，使资料逐渐进入攻击者控制的处理链。Bitdefender 记录的 FilePakMonitor
        属于此类场景，但该工具随后把文件装入归档并传送的阶段仍须分别归 T1560、T1074 或外传技术。
      en: After gaining persistent access, an adversary may want newly created or modified documents over a long period while
        avoiding repeated copies of the same static files. A collector can establish an initial baseline and select targets
        by modification time on later passes, gradually feeding the adversary's processing chain. Bitdefender's FilePakMonitor
        illustrates such acquisition, while its later archive and transfer stages still require separate treatment under T1560,
        T1074, or exfiltration techniques.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要可读取目标数据的身份或进程权限、运行重复收集逻辑的能力，以及存储上次扫描状态或从源端取得变化信息的途径。增量方案还要求可靠的时间比较、跨重启状态延续和对首次基线扫描较高可见性的容忍；时间戳被重写、文件被替换或权限变化会造成漏收。对云
          API 的泛化需另证具体服务的枚举和读取权限。
        en: The adversary needs an identity or process that can read target data, a way to run repeated collection logic,
          and a checkpoint or source-side change signal. An incremental design also requires reliable time comparison, state
          persistence across runs, and tolerance for a more visible initial baseline. Rewritten timestamps, replaced files,
          or permission changes may make it miss data. Applying the model to a cloud API requires separate evidence for that
          service's enumeration and read permissions.
    defender_model:
      paragraphs:
      - zh: 防守方若只保留进程启动或短窗大批量复制告警，可能看到任务而无法识别低量的后续源文件读取。对于启用了敏感目录 SACL 和 Audit File System 的 Windows 主机，4663 可记录主体、对象、进程与
          ReadData 权限；文件改动事件可提供比较基线。防守方仍需足够长的保留期、稳定的进程与身份关联键，以及获授权作业清单，才能区分增量窃取与正常备份或同步。未启用读取审计时，不能声称仅用 DeviceFileEvents 的创建/修改事件恢复全部读取。
        en: A defender retaining only process launches or short-window bulk-copy alerts may see a task yet miss low-volume
          source reads in later passes. On Windows hosts where sensitive-directory SACLs and Audit File System are enabled,
          event 4663 can record the subject, object, process, and ReadData right; file modification events supply a comparison
          baseline. The defender still needs sufficient retention, stable process and identity correlation keys, and an authorized-job
          inventory to distinguish incremental theft from backup or synchronization. Without read auditing, creation and modification
          events in DeviceFileEvents cannot be assumed to reconstruct all reads.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 用变化检查点收缩后续收集轮次的访问范围
    en: Change checkpoints narrow the access scope of subsequent collection passes
  analysis:
    paragraphs:
    - zh: 收集组件在首轮后保存上次列举时间，并让后续轮次主要处理此后变更的文件。相较每轮重复读取完整目标集，每次活动触及的对象更少，按短窗读取总量或目录扇出判断的检测更难在单轮恢复完整行为；防守方必须跨轮次把同一进程或身份对不同文件的读取与检查点更新关联起来。Bitdefender
        证明了该选择机制和残留检查点，降低告警强度与匿迹收益则是有条件的推断，取决于源文件变化率及监测配置。
      en: After an initial pass, the collector stores the previous listing time and mostly processes files changed since then.
        Compared with rereading the whole target set on every run, each episode touches fewer objects, so a detector based
        on short-window read volume or directory fan-out may fail to reconstruct the whole operation from one episode. The
        defender must link reads by the same process or identity and checkpoint updates across runs. Bitdefender establishes
        the selection logic and residual checkpoint; lower alert strength and stealth benefit are conditional inferences that
        depend on file-change rate and monitoring configuration.
  confidence: medium
  evidence_refs:
  - REF-000511
  - REF-000512
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 目前只有变化检查点约束的增量收集通过稳定变量、痕迹差异和证据门槛：它改变后续轮次的读取集合，需要跨轮关联。来源到达触发、工作流触发、固定周期和扩展名筛选均已研究，但前两者缺少独立匿迹效果证据，后两者只是普通自动化或目标条件；子项不按工具、数据类型或
        ATT&CK 子项划分。
      en: 'Only Change-Checkpoint-Constrained Incremental Collection currently passes the stable-variable, trace-difference,
        and evidence gates: it changes later read sets and requires cross-pass correlation. Source-arrival and workflow triggers,
        fixed periods, and extension filters were examined, but the first two lack distinct stealth-effect evidence and the
        latter two are ordinary automation or target criteria. Children are not divided by tool, data type, or ATT&CK child.'
  coverage: established
  subtechnique_refs:
  - NJS-0135-001
