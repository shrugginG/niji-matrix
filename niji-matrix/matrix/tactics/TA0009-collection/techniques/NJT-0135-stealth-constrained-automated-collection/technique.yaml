research:
  limitations:
    paragraphs:
    - zh: 固定工作簿与 ATT&CK 页面证明 T1119 的通用行为，不证明任一自动收集天然匿迹。FilePakMonitor 报告证明状态化选择和残余状态文件，却未测量告警概率；短窗阈值下降需按具体目录变化率与审计配置检验。Windows
        4663 和 S3 CloudTrail 仅为特定已启用遥测面，不能直接覆盖其他平台或缺失审计的环境。
      en: The fixed workbook and ATT&CK page establish general T1119 behavior, not that automated collection is inherently
        stealthy. The FilePakMonitor report establishes stateful selection and a residual state file but does not measure
        alert probability; a reduced short-window signal must be tested against local change rates and auditing. Windows 4663
        and S3 CloudTrail are specific enabled telemetry surfaces, not coverage for other platforms or environments without
        auditing.
