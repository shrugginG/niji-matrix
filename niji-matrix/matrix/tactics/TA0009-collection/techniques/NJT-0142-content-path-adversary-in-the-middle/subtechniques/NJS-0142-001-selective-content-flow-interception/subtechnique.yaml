schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0142-001
parent_ref: NJT-0142
name:
  zh: 选择性内容流介入
  en: Selective Content-Flow Interception
summary:
  zh: 仅令目标域、受害终端、路径或时段的内容流经过中间节点，使异常按范围稀疏分布。
  en: Route content flows for selected domains, endpoints, paths, or periods through an intermediary so the anomalous traces
    remain sparse by scope.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 选择性内容流介入是攻击者控制哪些正在传输的一般内容会经过可读取的中间位置，而非持续覆盖全部通信。选择变量可以是域名、SNI、终端、网络路径或时间，必须实际决定内容会话是否被介入；DNS、无线和代理只是实现面。分类需要证明被选择的会话包含一般内容且与中间节点相连，不能仅凭过滤配置成立。
    en: Selective Content-Flow Interception means the actor controls which ordinary content in transit passes through a readable
      intermediary instead of continuously intercepting all communication. Domain, SNI, endpoint, network path, or time may
      be the selector if it actually determines whether a content session is intercepted; DNS, wireless, and proxy are implementation
      surfaces. Classification requires a selected content-bearing session linked to the intermediary, not merely the existence
      of a filter setting.
stealth_characteristics:
  paragraphs:
  - zh: 选择性内容流介入使同一网络中多数连接仍呈正常路径与证书，异常只出现在受影响域和受影响路径交集。全网 TLS 失败率和平均证书变化可能保持很低，而被选择终端仍会出现到中间节点的改道、证书链差异或双连接。哈萨克斯坦测量记录了目标域与网络路径两重条件；将这种稀疏性解释为防守遗漏风险是分析推论，不是已经量化的规避效果。
    en: Selective Content-Flow Interception leaves most connections on their ordinary path and certificate, confining anomalies
      to the intersection of selected domains and affected paths. Network-wide TLS failure rates and average certificate changes
      may remain low, while a selected endpoint still shows diversion, a chain difference, or two legs of a proxied connection.
      The Kazakhstan measurements document target-domain and path conditions. Their effect on missed alerts is an analytic
      inference, not a quantified evasion result.
scope_boundary_definition:
  paragraphs:
  - zh: 本项要求有意限定介入集合且这种限定改变痕迹分布；持续全域代理属于父级，受信证书终止可与本项并存并另标第二子项。单纯按用户分流的合法 CDN、企业代理例外、测试网段迁移也会造成选择性，须对照批准策略与证书所有权。凭据选择性引流仍以
      NJT-0136 的认证对象判断，本项仅处理一般内容。
    en: This child requires deliberate scoping that changes trace distribution; persistent all-domain proxying remains parent
      core, while trusted-certificate termination may coexist and qualify for the second child. Legitimate CDN steering, enterprise
      proxy exceptions, and test-segment migrations are also selective and require comparison with approved policy and certificate
      ownership. Selectively diverted credentials remain assessed through NJT-0136; this child concerns ordinary content.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者若只关心协作或通信域，可在受控接入路径上按 SNI 插入中间设备，而让软件更新与其他网页继续正常直连。现场测量中通信站点被命中、其他域不注入证书，说明该变量不是按协议或产品机械拆分；实际企业调查仍需把目标终端的一次内容访问与中间节点连起来。
      en: An actor interested in collaboration or communications domains can insert an intermediary by SNI on a controlled
        access path while leaving software updates and unrelated browsing direct. Field measurements observed communications
        sites being selected while other domains received no injected certificate, showing a variable beyond protocol or product
        labels. An enterprise investigation must still connect a particular endpoint's content visit to the intermediary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须控制能够检查或引导连接的网段或代理规则，并知道目标域或主机在何时经过该路径。过滤太窄会错失内容，过滤太宽会增加证书或路径异常；对 TLS，筛选命中后仍须有使正文可读的额外条件。
        en: The actor must control a segment or proxy rule that can select or steer connections and know when target domains
          or hosts cross that path. A narrow selector misses content; a broad one increases certificate or route anomalies.
          For TLS, a selected flow still needs an additional condition before its body becomes readable.
    defender_model:
      paragraphs:
      - zh: 防守方应按目的域、路径、终端和时间比较证书签发者与实际转发来源，并保存未命中连接作对照。仅在某一出口汇总的证书统计可能看不见这种交集；不同 CDN 边缘与地区合法证书差异需要分层基线，不能把任何证书不一致直接判恶。
        en: Defenders should compare certificate issuer and forwarding source by destination domain, path, endpoint, and time,
          retaining unaffected flows as controls. Aggregated certificate statistics from one egress point can miss the intersection.
          Legitimate differences among CDN edges and regions need separate baselines; any certificate mismatch alone is not
          malicious.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 把内容拦截痕迹局限在少数域与路径
    en: Confine content-interception traces to selected domains and paths
  analysis:
    paragraphs:
    - zh: 目标域和路径条件使多数连接没有证书或路由差，令总体平均掩盖受影响交集。原始测量证明这种筛选确实存在；其降低现实告警的程度仍未测量。防守方可构造相同域名在不同路径、相同路径在不同域名的对照，寻找只在交集出现的异常证书及内容流。
      en: Domain and path conditions leave most connections without certificate or route differences, so an overall average
        hides the affected intersection. Original measurements establish this selection but do not measure its effect on real
        alerts. Defenders can compare the same domain across paths and different domains on the same path, looking for a certificate
        anomaly and content flow only at the intersection.
  confidence: medium
  evidence_refs:
  - REF-000556
