research:
  limitations:
    paragraphs:
    - zh: 运营商级 HTTPS 测量证实部分域与路径上的证书替换、上游连接及受信根下的可解密条件，却未进入中间节点证明真实用户正文被保存。案例和检测结果必须分别标识路径介入、内容可读终止和已证实的内容取得，不能把凭据事件或工具能力升级为一般内容证据。该案例也不能直接外推到企业
        DNS、DHCP 或无线部署。
      en: Carrier-scale HTTPS measurements establish substitute certificates, upstream connections, and decryptability conditions
        for selected domains and paths, but did not enter the intermediary to prove retention of real-user bodies. Cases and
        detections must distinguish path intervention, readable termination, and proven content acquisition rather than promoting
        credential events or tool capability to general-content evidence. The carrier case does not automatically generalize
        to enterprise DNS, DHCP, or wireless deployments.
    - zh: 两种变量来自同一现场系统，不能据此断言所有协议都独立支持它们。ECH、端到端应用加密、证书轮换和缺少源站协作会削弱证书差分与明文判定；正常企业 TLS 检查、授权代理和网络迁移也是强反例。窗口及关联字段应按实际部署可见性校准。
      en: Both variables are observed in one field system, not proof that every protocol supports them independently. ECH,
        application-layer end-to-end encryption, certificate rotation, and absent origin cooperation weaken certificate differential
        and plaintext conclusions. Authorized enterprise TLS inspection, proxies, and network migration are strong comparators.
        Correlation windows and fields require deployment-specific calibration.
