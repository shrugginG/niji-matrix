research:
  limitations:
    paragraphs:
    - zh: 证据将攻击者关键词搜索、平台可记录搜索与读取、以及按批量提取检测的盲点联系起来，但未提供同一文件的查询—下载配对或对照实验。产品和许可影响搜索词、页面访问、附件下载的可见性；已授权员工、电子发现与秘密扫描均可能出现类似的少量高敏命中。若无法证明实际内容被读取，应退回发现阶段而非正式子项。
      en: Evidence links adversary keyword search, platform search/read telemetry, and the limitations of bulk-extraction
        detection, but supplies neither a same-file query-to-download pair nor a controlled comparison. Product and licensing
        affect visibility of terms, page access, and attachments; authorized staff, e-discovery, and secret scanning can produce
        similar small high-sensitivity hit sets. If actual content access cannot be proven, the case returns to discovery
        rather than this child.
