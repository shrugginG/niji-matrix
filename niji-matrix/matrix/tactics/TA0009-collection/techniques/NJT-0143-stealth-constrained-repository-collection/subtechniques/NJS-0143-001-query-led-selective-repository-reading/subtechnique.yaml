schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0143-001
parent_ref: NJT-0143
name:
  zh: 查询驱动的选择性库内读取
  en: Query-Led Selective Repository Reading
summary:
  zh: 攻击者先用库内查询筛出高价值内容，再读取少量匹配对象，使批量提取指标减弱，但留下可关联的查询与内容访问。
  en: An adversary filters valuable content with repository-native queries and reads a small matching set, weakening bulk-extraction
    signals while leaving linkable query and content-access traces.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 查询驱动的选择性库内读取是攻击者根据已知主题、关键词、业务字段或路径条件，在内部信息库中缩小候选集合，并实际打开、读取或下载匹配内容的获取方式。它的直接对象是内部内容而非搜索功能本身；查询结果只列出标题、元数据或权限时不能单独认定内容已被收集。
    en: Query-Led Selective Repository Reading is an acquisition pattern in which an adversary uses known topics, keywords,
      business fields, or path predicates to narrow candidates within an internal information repository and actually opens,
      reads, or downloads matching content. Its direct object is internal content rather than the search feature itself; a
      result exposing only titles, metadata, or permissions does not alone prove content collection.
  - zh: 变量是高价值内容选择与读取集合之间的关系，可横跨知识库、文档库和结构化业务库，但必须在各实现上分别证明查询和读取的可观测性。它可以由人工操作或脚本完成，不要求产品 API、自动调度或固定字段类型。
    en: The variable is the relationship between valuable-content selection and the resulting read set. It can cross knowledge
      bases, document libraries, and structured business repositories, but query and read observability must be proven for
      each implementation. A person or script may perform it; no product API, automated schedule, or fixed field type is required.
stealth_characteristics:
  paragraphs:
  - zh: 查询驱动的选择性库内读取把可见活动压缩为少数查询和目标对象读取，避免大量无关文件触碰所产生的高扇出或导出事件。与正常员工调查同形的访问使单个事件难以归因；可恢复的痕迹包括搜索词或过滤条件、对象访问/下载、敏感标签、身份与来源设备。查询量很高、搜索词明显异常，或目标文件已被精细审计时，匿迹效果会减弱。
    en: Query-Led Selective Repository Reading compresses visible activity into a few queries and target-object reads, avoiding
      the high fan-out or export events of touching many unrelated files. Individual accesses resemble employee research and
      are difficult to attribute alone. Recoverable traces include terms or predicates, object access/download, sensitivity
      labels, identity, and source device. The benefit weakens when query volume is high, terms are conspicuous, or target
      objects are closely audited.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入可证实的“过滤条件—匹配内容—成功取用”链，允许查询与取用相隔短暂时间但不得只凭同一账户的两个无关事件拼接。无后继内容读取的搜索是发现，完整仓库克隆或全表导出没有选择性边界；重复检查点由 NJT-0135 管，应用 token
      来源由 NJT-0086 管。仅凭“读取量小”无法区别合法分析、法务调查与恶意收集。
    en: Include a supportable filter-to-matching-content-to-successful-retrieval chain. Query and retrieval may be separated
      briefly, but two unrelated events from the same account must not be stitched together. Search without later content
      access is discovery; full repository clones or full-table exports lack this selection boundary. NJT-0135 owns repeated
      checkpoints and NJT-0086 owns application-token provenance. Small read volume alone cannot distinguish lawful analysis
      or legal review from malicious collection.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 拿到协作平台用户会话的攻击者希望快速找到内部 VPN、客户或未公开项目资料，不愿下载整站。Mandiant 报告 UNC6661 在云应用中搜索此类词并记录了同一行动的 SharePoint 下载；这些材料支持场景存在，却没有证明某条特定搜索导致某个特定下载，应由本地日志确认。
      en: An attacker with a collaboration-platform user session may want VPN, customer, or unpublished-project information
        without downloading the entire site. Mandiant reports UNC6661 searches for such terms in cloud applications and documents
        a SharePoint download in the same activity. These observations support the scenario but do not prove that a specific
        query caused a specific download; local logs must establish that join.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要有权运行库内搜索或谓词查询并读取命中对象，且须掌握足够的业务词汇以减少无关命中。搜索索引不完整、权限限制或未知命名会使选择失效；为补足信息而扩展查询或导出，会增加可见度。
        en: The attacker needs permission to issue native search or predicate queries and read matching objects, and enough
          business vocabulary to limit irrelevant hits. Incomplete indexing, access restrictions, or unfamiliar naming can
          defeat selection; widening queries or exporting to compensate raises visibility.
    defender_model:
      paragraphs:
      - zh: 防守方需要搜索/查询审计、对象级成功访问、主体与会话、敏感标签及批准职责，并能在同一库内按时间和对象连接。Confluence Data Center Full 可给搜索词与附件下载，Microsoft 365 可给 SharePoint
          搜索和文件访问，但查询词、页面正文访问或行级结果未必可用；缺字段时不能宣称验证了完整链。
        en: The defender needs search/query audit, object-level successful access, principal and session, sensitivity labels,
          and approved duties, joined by time and object in one repository. Confluence Data Center Full can expose terms and
          attachment downloads; Microsoft 365 can expose SharePoint search and file access. Query terms, page-body reads,
          or row-level results may be unavailable, and a missing field precludes claiming the full chain was verified.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 目标查询与少量读取落在批量提取告警盲点内
    en: Targeted queries and few reads fall outside bulk-extraction alerts
  analysis:
    paragraphs:
    - zh: 攻击者以语义或业务谓词提前筛除无关对象，随后只读取匹配资料，使短窗访问量较全量枚举和导出低。若检测仅看读取次数或导出作业，内容已被取得却不会达到其触发条件；搜索词、敏感文件访问、身份职责偏离仍然可见且应联合分析。公开报告不证明攻击者主观选择此方式专为规避检测，也没有给出告警下降率，因此机理维持低置信度。
      en: The attacker filters irrelevant objects with semantic or business predicates and then reads matching material, producing
        fewer short-window accesses than broad enumeration or export. A detector limited to read counts or export jobs may
        not trigger despite successful acquisition; terms, sensitive-file access, and deviation from role remain visible and
        should be joined. Public reporting neither proves the actor chose this pattern expressly to evade detection nor measures
        alert reduction, so the mechanism stays low confidence.
  confidence: low
