research:
  limitations:
    paragraphs:
    - zh: 公开事件证明信息库敏感词搜索与 SharePoint 下载在同一行动中出现，未证明某次搜索导致同一文件被下载，也未量化选择性读取的告警影响。因此父级内容获取和单项低置信度子技术的结论层级不同；缺少同对象键时，只能把短窗信号下降视为条件性推断，不能把该案例标作子项已证事件。
      en: Public reporting places sensitive-term repository searches and SharePoint downloads in the same activity but does
        not prove one search caused a download of the same file or quantify an alert effect. Parent-level acquisition and
        the sole low-confidence child thus carry different conclusion levels. Without a same-object key, reduced short-window
        signal remains conditional inference and this case must not be labeled a proven child event.
    - zh: 信息库审计依赖平台、许可与设置。SharePoint 搜索事件可能由系统账户生成，文件访问存在重复抑制；Confluence Full 审计可能记录搜索词与附件下载却不记录页面正文读取。实现检测时必须先验证租户实际字段、保留期和对象键，避免把一种平台的可见性推广到所有库。
      en: Repository audit depends on platform, license, and settings. SharePoint search events may be produced by system
        accounts and file access can be deduplicated; Confluence Full audit may record terms and attachment downloads without
        page-body reads. Detection must first verify tenant fields, retention, and object keys instead of generalizing one
        platform's visibility to every repository.
