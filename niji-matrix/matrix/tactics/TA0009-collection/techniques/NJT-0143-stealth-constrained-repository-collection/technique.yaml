schema_version: 2.0.0
type: technique
id: NJT-0143
name:
  zh: 匿迹约束的信息库内容获取
  en: Stealth-Constrained Information Repository Collection
summary:
  zh: 攻击者从有权访问的信息库取得内部内容，并通过选择性查询与读取使少量高价值访问混入普通库活动；搜索与内容读取仍可留下可关联记录。
  en: An adversary acquires internal content from an accessible information repository and uses selective querying and reading
    to blend a small number of valuable accesses into ordinary repository activity; search and content reads still leave linkable
    records.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1213
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1213
definition_and_concept:
  paragraphs:
  - zh: 匿迹型信息库内容获取，是攻击者使用既有访问途径从组织的协作知识库、代码库、业务记录库或非邮件消息库读取可利用的内部内容，并调节库内发现与取用的范围，使其在普通使用流中较难被区分。直接目标是获得信息内容；仅知道库地址、权限、目录结构或搜索结果标题，不足以证明完成
      Collection。
    en: Stealth-oriented information-repository collection occurs when an adversary uses an available access path to read
      exploitable internal content from a collaboration knowledge base, code repository, business-record repository, or non-mail
      messaging store, while shaping discovery and retrieval scope so it is harder to distinguish within ordinary use. The
      direct objective is acquiring content. Knowing a repository address, permission, hierarchy, or search-result title alone
      does not establish completed Collection.
  - zh: 信息库是持续组织和检索内容的服务，不由某个厂商名称定义。父级可以覆盖人工浏览、库内搜索、查询接口和经批准客户端的成功读取，但纳入匿迹矩阵要求额外识别由攻击者控制且改变痕迹的选择变量。凭据如何取得、应用授权如何维持，以及取出数据之后如何归档、暂存或外传，都需按相邻对象另判。
    en: An information repository is a service that organizes and retrieves persistent content, not a vendor name. The parent
      can encompass manual browsing, native search, query interfaces, and successful reading through an approved client, but
      inclusion in a stealth matrix additionally requires an attacker-controlled selection variable that changes traces. Credential
      acquisition, durable application authorization, and later archiving, staging, or exfiltration require separate classification.
stealth_characteristics:
  paragraphs:
  - zh: 当攻击者先用目标语义搜索再读取少量匹配对象时，短时间内的对象总数与导出量可能低于按批量访问构造的告警；库内动作仍与正常查询、审阅和下载同形，恶意性须从查询主题、对象敏感性、身份职责和后续使用恢复。搜索、成功访问、下载、来源设备和会话活动并未消失，具有足够细粒度日志与保留期的防守方可重建序列。
    en: When an adversary searches for target concepts and reads only a few matching objects, object counts and export volume
      in a short window may fall below bulk-access alerts. Native repository actions also resemble ordinary search, review,
      and download; maliciousness must be reconstructed from query topic, object sensitivity, role, and later use. Search,
      successful access, download, source device, and session activity remain, and defenders with granular logs and adequate
      retention can reconstruct the sequence.
  - zh: 匿迹效果取决于平台是否审计搜索内容、页面取用与具体对象，以及安全团队是否把这些日志与身份和数据分类连接。Confluence Data Center 的搜索与附件下载需要 Full 审计才有相应事件，GitHub 克隆事件的访问与保留限制也不同；不能把一个平台的日志能力推广到所有信息库。大量导出或定时增量收集可能与本父级同现，但其自身的批量与编排轴应另判。
    en: The effect depends on whether a platform audits search content, page retrieval, and specific objects, and whether
      the security team joins those logs to identity and classification context. Confluence Data Center search and attachment-download
      events require Full auditing, while GitHub clone events have different access and retention limits; one platform's visibility
      cannot be generalized to every repository. Bulk export or scheduled incremental collection may co-occur but their volume
      and orchestration axes need separate assessment.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入有成功内容读取、能界定库内对象与主体，并有证据表明攻击者选择的检索/取用路径改变可见痕迹的事件。T1530 管理云对象存储的对象读取，T1602 管理设备或基础设施配置库，T1114 管理邮件消息和附件，T1119 管理重复自动化或检查点约束；一个服务既有文档又有邮件时按实际取得的内容及操作划界，而不是按品牌划界。
    en: Include events with successful content reading, an identifiable repository object and principal, and evidence that
      the attacker-selected retrieval path changes observable traces. T1530 owns cloud object-storage reads, T1602 owns device
      or infrastructure configuration repositories, T1114 owns mail messages and attachments, and T1119 owns repeated automation
      or checkpoint constraints. When a service holds both documents and mail, classify by content and action, not by brand.
  - zh: 仅列举站点、查询元数据、检索公开代码或取得权限而未读取内部内容，不足以认定本 Collection 技术；既有集成的授权与 token 挪用归 NJT-0086，攻击者居中截获通信归 T1557，已取得内容的汇聚、归档和外送另属后继步骤。合法员工搜索、法务电子发现、审计、迁移、备份和源代码安全扫描可产生相似日志，必须用职责、工单、对象敏感性与去向排除。
    en: Site enumeration, metadata-only queries, public-code search, or obtaining permission without reading internal content
      do not establish this Collection technique. Existing-integration grants and token co-option belong to NJT-0086; interception
      in transit belongs to T1557; aggregation, archiving, and transfer of acquired content are later steps. Employee research,
      legal e-discovery, audit, migration, backup, and source-code security scanning can yield similar logs and need role,
      ticket, object sensitivity, and destination context.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 入侵者取得可访问内部协作库的账户后，可能先搜索“confidential”“vpn”或项目词，再打开或下载少数与凭据、网络或客户有关的文档，以便横向移动、进一步利用或勒索。Mandiant 对 UNC6661 的报告记录了此类云应用关键词搜索，并给出同一行动中
        SharePoint FileDownloaded 日志；报告没有把具体每次搜索与相同文件的一次下载逐一配对。
      en: After gaining an account that can access internal collaboration repositories, an intruder may search for terms such
        as confidential, vpn, or a project name and then open or download a small set of documents useful for lateral movement,
        further exploitation, or extortion. Mandiant reports UNC6661 searches for such terms in cloud applications and supplies
        a SharePoint FileDownloaded record from the same activity. It does not pair each particular query with a download
        of the same object.
    - zh: 代码库、知识库、CRM 和聊天库可能共同提供资料，但本建议的分类依据是查询到内容读取的选择关系，而不是跨库收集这一事实。若调查只看到代码库的 git.clone 或 CRM 批量导出，应在父级记录来源和实际内容范围，并另检验自动化、受信集成身份或外传特征，不能自动套入选择性读取子项。
      en: Code, knowledge, CRM, and chat repositories may collectively supply information, but the proposed child turns on
        the relationship between a query and selected content reads rather than multi-repository use. If an investigation
        sees only a code-repository git.clone or a CRM bulk export, it should record source and actual content at the parent
        level and separately test automation, trusted-integration identity, or exfiltration properties rather than assign
        the selective-reading child automatically.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需拥有可成功读取相关库对象的账户、会话或应用权限，并知道可过滤高价值资料的词、字段或业务实体。选择性搜索牺牲了全量覆盖，依赖检索索引和权限对目标资料的可发现性；若命中不足，攻击者可能转向更显眼的广泛浏览、克隆或导出。与自动增量收集不同，该轴不要求计划任务或跨轮状态。
        en: The attacker needs an account, session, or application authorization that can successfully read relevant objects,
          plus terms, fields, or business entities that filter valuable material. Selection sacrifices complete coverage and
          depends on indexed, permission-visible target content; poor hits may push the actor toward more visible browsing,
          cloning, or export. Unlike automated incremental collection, this axis does not require a schedule or cross-run
          state.
    defender_model:
      paragraphs:
      - zh: 防守方需要库内搜索/查询事件、成功对象访问或下载事件、账户/应用和会话标识、对象分类与授权职责清单，并在足够时段内按主体和对象连接。Microsoft 365 能记录 SharePoint 查询与 FileAccessed/FileDownloaded，但部分系统账户会触发搜索，FileAccessed
          对同一用户和文件有五分钟抑制；Confluence 需配置 Full 审计才暴露搜索词。缺少搜索词或页面读取日志时，防守方只能证明敏感对象访问，不能证明查询驱动关系。
        en: Defenders need repository search or query events, successful object access or download, account/application and
          session identifiers, object classification, and an authorized-duty inventory, joined over a suitable period by principal
          and object. Microsoft 365 can record SharePoint search and FileAccessed/FileDownloaded, but system accounts also
          search and FileAccessed is suppressed for the same user/file for five minutes. Confluence requires Full auditing
          for search terms. Without query text or page-read logs, defenders can establish sensitive-object access but cannot
          prove a query-led sequence.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 库内选择性读取避开只识别批量提取的观察逻辑
    en: Selective repository reads evade bulk-extraction-only observation logic
  analysis:
    paragraphs:
    - zh: 攻击者用库的原生搜索或谓词筛出少数内容并成功读取，使库侧形成搜索与零散访问，而不是连续全库导出。若防守方只监控短窗读取数或导出作业，少量敏感读取可能落在检测逻辑外；把查询主题、对象标签、主体职责和随后去向关联可以恢复异常。真实案例证明搜索行为与下载事件可出现，现有来源没有量化减少的告警，因此匿迹收益须按本地规则作条件推断。
      en: The attacker uses native search or predicates to select a small content set and reads it successfully, leaving search
        and scattered access rather than continuous corpus export. A defender watching only short-window read counts or export
        jobs may miss a few sensitive reads; joining query topic, object label, principal duty, and later destination can
        recover the anomaly. Incident evidence establishes search behavior and download events, but does not quantify alert
        reduction, so the stealth benefit is conditional on local rules.
  confidence: low
  evidence_refs:
  - REF-000560
  - REF-000559
  - REF-000561
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术目前仅建立查询驱动的选择性库内读取一项低置信度子技术，其变量是用库内语义或谓词选择缩小后继内容读取集合，而非仓库产品、数据类型、SQL 方言或是否由脚本执行。防守方需尝试连接查询意图与成功读取，且在无法取得同对象键时把结论保留为条件性推断。
      en: This technique currently establishes one low-confidence child, Query-Led Selective Repository Reading. Its variable
        is repository-native semantic or predicate selection that narrows subsequent content reads, not product, data type,
        SQL dialect, or script execution. Defenders must try to join query intent to successful reads and keep the conclusion
        conditional when no same-object key is available.
    - zh: 六个 ATT&CK 子项主要按产品和内容模型划分。既有集成身份归 NJT-0086，状态化增量获取归 NJT-0135；原位浏览、多主体稀释和接口选择没有独立结论级支持。因此六对一的广度差距反映不同分类问题及证据限制，不是要以产品名称补足的空缺。
      en: The six ATT&CK children mostly partition product and content models. Existing integration identity remains with
        NJT-0086 and stateful incremental acquisition with NJT-0135; in-place viewing, cross-principal dilution, and interface
        choice lack independent conclusion-level support. The six-to-one breadth gap therefore reflects different classification
        questions and evidence limits, not a gap to fill with product names.
  coverage: established
  subtechnique_refs:
  - NJS-0143-001
