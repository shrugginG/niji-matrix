schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0144-002
parent_ref: NJT-0144
name:
  zh: 到达条件驱动的邮件副本分流
  en: Arrival-Conditioned Mail Replication
summary:
  zh: 攻击者让邮件到达与内容匹配触发持续复制，使一次规则配置和多次收集结果分散在不同审计时点。
  en: An attacker makes mail arrival and content matching trigger continued copying, separating a one-time rule change from
    collection outcomes at later audit times.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 到达条件驱动的邮件副本分流是攻击者预先设置消息选择条件和副本目的地，让邮件服务器在后续消息送达时自动复制匹配内容。它的定义是到达事件与谓词触发收集，适用的机制可以是邮箱规则、邮件流规则或等价的投递处理，而不是把 ATT&CK 的“转发规则”子项重新命名。若规则尚未命中消息，只能记录为准备或企图。
    en: Arrival-Conditioned Mail Replication is the adversary's advance setting of a message predicate and copy destination
      so that a mail service replicates matching content on later delivery. The defining relation is arrival plus predicate
      triggering collection. An inbox rule, mail-flow rule, or equivalent delivery processor may implement it; this is not
      a relabeling of ATT&CK's forwarding-rule child. A rule with no observed message match remains preparation or attempt.
stealth_characteristics:
  paragraphs:
  - zh: 到达条件驱动的邮件副本分流使一次配置在较长时间内产生多个匹配副本，内容取得不再与攻击者登录或主动读信逐次对应。Microsoft 的 BEC 案例证明按财务关键词转发到受控地址并设置删除规则；删除是相邻痕迹抑制行为，不是本子项成立条件。每次成功分流仍可在自动转发报告或邮件流记录留下目的地，效果取决于防守能否联查规则和消息结果。
    en: Arrival-Conditioned Mail Replication lets one configuration create many matching copies over time, so content acquisition
      no longer maps one-to-one to attacker sign-ins or active reads. Microsoft's BEC case documents finance-keyword forwarding
      to controlled addresses with deletion rules; deletion is adjacent trace suppression, not a condition of this child.
      Each successful copy can still leave a destination in forwarding reports or message trace, and the effect depends on
      joining rule and message outcomes.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明攻击者控制的选择条件、实际匹配邮件和副本目的地，不能仅凭规则新建或外部地址配置定性。没有消息谓词、只把所有邮件转发的设置仍可属于父级收集与外传，但未必体现本项的低噪音选择变量。规则持久性归相邻账户或配置持久化；消息跨组织传送归外传战术，通用自动调度归
      T1119。
    en: Establish the attacker-controlled selection condition, actual matching mail, and copy destination; a new rule or configured
      external address alone is insufficient. A setting that forwards every message without a message predicate may belong
      to parent-level collection and exfiltration but need not have this child's low-volume selection variable. Durable rule
      state belongs to adjacent account or configuration persistence, cross-boundary transmission to Exfiltration, and generic
      automatic scheduling to T1119.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在 BEC 场景中，攻击者取得一个财务相关邮箱后，可把包含 invoice、payment 或 statement 的未来邮件复制到可控地址，并在正常收件箱中保留业务流；Microsoft 观察到这类条件规则覆盖多个受害组织。合规归档、企业邮件日记、代理收件与迁移期间的临时转发可能产生相似结果，必须核查审批、目的域和生效时间。
      en: In BEC, an attacker with a finance-related mailbox can copy future messages containing invoice, payment, or statement
        to a controlled address while ordinary business mail continues. Microsoft observed such conditional rules across multiple
        victim organizations. Compliance archiving, enterprise journaling, delegated receipt, and temporary forwarding during
        migration can produce similar results, so approval, destination domain, and effective time must be checked.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要邮箱或邮件流配置写入权限、能预测目标邮件的稳定谓词，并维护可收到消息的目的地。条件过窄会漏掉目标邮件，条件过宽会增加传输量和被审查概率；阻断外部自动转发或规则审批会压缩该路径，但内部受控目的地仍可能可用。
        en: The attacker needs mailbox or mail-flow configuration write access, a stable predicate anticipating target mail,
          and a reachable receiving destination. A narrow predicate misses targets, while a broad one raises transport volume
          and scrutiny. Blocking external auto-forwarding or requiring rule approval constrains this route, although an attacker-controlled
          internal destination may remain possible.
    defender_model:
      paragraphs:
      - zh: 防守方需要统一审计中的 New-InboxRule、Set-InboxRule 或等价配置事件，以及自动转发报告或消息跟踪中的匹配邮件与新增收件人。只核查当前规则可能漏掉已删除规则，只审查新建操作可能漏掉修改旧规则；需保留规则历史和消息结果。Microsoft
          报告可按规则类型、收件域、用户和首次转发时间回溯，但具体字段和保留期依租户实现。
        en: Defenders need New-InboxRule, Set-InboxRule, or equivalent configuration events in unified audit and matching
          mail plus added recipients in auto-forward reports or message trace. Current-rule inspection can miss deleted rules,
          and creation-only review misses changes to existing rules; retain rule history and message outcomes. Microsoft's
          report can pivot by rule type, recipient domain, forwarding user, and first-forward time, subject to tenant-specific
          fields and retention.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 以投递事件分散持续邮件收集的控制与结果痕迹
    en: Separate continuing mail collection control and outcomes across delivery events
  analysis:
    paragraphs:
    - zh: 攻击者仅在前期改变一次路由选择状态，之后每封目标邮件由正常投递过程触发副本；控制事件与多个收集结果跨时间分布，若告警只看短窗口的异常登录或批量读信，难以把它们复原为一条链。规则历史、匹配谓词、InternetMessageId
        和目的地关联可消除此差异；合法归档也可产生相似图形，必须纳入批准基线。
      en: The attacker changes routing selection state once; each later target message causes a copy through ordinary delivery.
        The control event and multiple collection results are spread over time, so alerts focused on short windows of anomalous
        sign-ins or bulk reads may fail to reconstruct one chain. Joining rule history, predicate, InternetMessageId, and
        destination removes that gap; authorized archiving can produce a similar graph and requires an approval baseline.
