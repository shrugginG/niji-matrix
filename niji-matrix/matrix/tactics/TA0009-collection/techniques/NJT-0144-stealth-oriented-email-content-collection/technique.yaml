subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 正式子项按邮件副本如何偏离单一邮箱审计视角划分。既存邮件副本二次读取使当前内容读取发生在预先同步或归档的副本上，关键是服务器逐封访问与端点读取的时间错位；到达条件驱动的邮件副本分流让投递事件和规则谓词产生新副本，关键是规则版本与实际消息路由闭环。两者可组合，但不按本地/远程或转发功能名称照搬三个
        ATT&CK 子项；一般自动化调度另由 T1119 处理。
      en: The children divide how mail copies depart from one mailbox-audit view. Rereading a Preexisting Mail Replica moves
        a current content read to a previously synchronized or archived copy, with a time gap between server item access and
        endpoint read. Arrival-Conditioned Mail Replication uses delivery and a rule predicate to create new copies, requiring
        a join from rule version to actual message route. They can coexist but do not import ATT&CK local, remote, or forwarding
        labels; general automation belongs to T1119.
  coverage: established
  subtechnique_refs:
  - NJS-0144-001
  - NJS-0144-002
