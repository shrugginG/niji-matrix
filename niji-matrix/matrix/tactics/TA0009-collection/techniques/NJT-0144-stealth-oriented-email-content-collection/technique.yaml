schema_version: 2.0.0
type: technique
id: NJT-0144
name:
  zh: 匿迹型邮件内容收集
  en: Stealth-Oriented Email Content Collection
summary:
  zh: 攻击者取得邮件正文或附件时，利用已有副本或邮件到达处理改变读取与复制的可见位置，使单一邮箱观察面难以还原取得过程。
  en: Adversaries acquire email bodies or attachments through preexisting copies or message-arrival processing, shifting where
    reading and copying appear so that one mailbox observation plane cannot reconstruct the acquisition.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1114
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1114
definition_and_concept:
  paragraphs:
  - zh: 匿迹型邮件内容收集是在攻击者已能触及邮箱、邮件服务器、客户端或其同步副本之后，取得消息正文与附件，并有意安排读取或复制路径，使邮件服务端、终端或邮件传输层中的某一单独视角不能完整表述收集过程。收集可以是历史邮件的针对性读取，也可以是新邮件到达时按条件生成副本；它的直接结果是攻击者获得或可持续接收邮件内容，不以具体产品、协议、邮箱所在位置或文件扩展名定义。
    en: Stealth-Oriented Email Content Collection occurs after an attacker can reach a mailbox, mail server, client, or synchronized
      replica. The attacker obtains message bodies or attachments and deliberately arranges the read or copy path so that
      any single mail-service, endpoint, or transport view gives an incomplete account of the collection. It may involve targeted
      reading of historical mail or conditional copies when new mail arrives. Its direct result is attacker access to mail
      content; no product, protocol, mailbox location, or file extension defines it.
  - zh: 判断需要把被访问的消息集合、发起主体、访问上下文、选择条件和结果副本联系起来。服务端的成功登录、客户端缓存存在、规则创建或邮件投递，只能分别证明链上的一环。若没有内容接触或匹配消息确已流向攻击者控制点的证据，应保留为访问、配置或企图，而不能直接写成已完成收集。
    en: Assessment must connect the accessed message set, acting principal, access context, selection condition, and resulting
      copy. A successful server login, existing client cache, rule creation, or mail delivery proves only one link in that
      chain. Without evidence of content access or a matching message reaching an attacker-controlled point, classify the
      observation as access, configuration, or attempt rather than completed collection.
stealth_characteristics:
  paragraphs:
  - zh: 对已有同步副本的再次读取不需要新的服务器消息绑定事件，却会在终端留下缓存文件读取、进程活动或后继复制；到达触发的分流则把一次配置操作和后续多次邮件副本分散在不同时间，历史邮件读取量可能很低，但规则变更、路由与外部收件人仍可关联。两种方式都没有让消息凭空消失，而是把关键证据移到与传统邮箱读取不同的观察面。
    en: Rereading an existing synchronized replica needs no new server message-bind event, while leaving endpoint cache-file
      access, process activity, or later copies. Arrival-triggered replication separates a one-time configuration action from
      later message copies; historical mail reads can be low, but rule changes, transport, and external recipients remain
      joinable. Neither mode makes messages disappear. Each moves decisive evidence to an observation plane different from
      conventional mailbox reads.
  - zh: 正常 Outlook 离线使用、共享邮箱同步、归档、灾备、合规留存和邮件迁移都可能呈现相似痕迹。匿迹结论依赖原设备和进程基线、审批与工单、被选消息敏感度、目的地归属，以及攻击前后时间关系；不能把缺少单类日志当作没有发生收集，也不能把高容量读取单独当作恶意。
    en: Normal Outlook offline use, shared-mailbox sync, archiving, disaster recovery, compliance retention, and migration
      can create similar traces. A stealth conclusion depends on device and process baseline, approvals and tickets, sensitivity
      of selected messages, destination ownership, and the before-and-after timeline. Missing one log class is not evidence
      that collection did not occur, and high read volume alone does not establish malice.
scope_boundary_definition:
  paragraphs:
  - zh: 范围纳入攻击者接触的邮件正文和附件，无论通过缓存副本、服务端 API、导出或投递时复制。T1213 的协作与代码平台内容不因通知邮件而整体转为 T1114；若实际读取的是邮件中的摘要或附件，则只将该邮件对象计入本技术。T1185
      的活跃浏览器交互截获或改写仍由会话中介负责，浏览器里打开网页版邮箱本身不改变这里的内容对象边界。
    en: Scope includes attacker access to message bodies and attachments through cached copies, server APIs, exports, or delivery-time
      copies. Collaboration and code-platform material under T1213 does not all become T1114 merely because notification mail
      exists; only a digest or attachment actually read as mail belongs here. T1185 owns interception or alteration of live
      browser interaction, and opening webmail in a browser does not change the content-object boundary here.
  - zh: 被盗凭据、会话令牌、OAuth 授权和邮箱委派解决“如何进入”，不是邮件内容获取本身。T1119 适用于通用的周期搜集规则与增量检查点；在邮件特有的投递事件、选择谓词和邮件路由形成独立痕迹时，才把到达触发分流作为本技术子项，二者可在同一事件链并存。取得后生成
      PST、ZIP 或其他暂存副本分别由 T1074、T1560 处理；外部转发的跨边界传送还应与外传战术交叉标注，不能由收集技术吞并。
    en: Stolen credentials, session tokens, OAuth grants, and mailbox delegation explain entry, not email content acquisition.
      T1119 owns generic periodic collection rules and incremental checkpoints. Arrival-triggered replication is a child here
      only when mail-specific delivery events, selection predicates, and mail routing create an independent trace; both techniques
      may coexist in an incident chain. PST, ZIP, or other copies staged after acquisition belong to T1074 or T1560 as applicable.
      External forwarding across the organizational boundary may also require an exfiltration annotation and is not swallowed
      by this Collection technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 取得受管工作站后，攻击者可从已经同步的邮箱副本抽取历史通信，避开为本次逐封取信重新调用邮件服务；Mandiant 对 APT1 的 GETMAIL 报告表明攻击者可从 PST 取消息与附件，并按日期限制范围。攻陷邮箱账户后，攻击者也可根据财务主题设置到达触发的规则，Microsoft
        在一场 BEC 行动中看到数百个邮箱的条件转发与后续删除规则。两例说明实现可能性，具体是否降低某环境告警仍需当地基线检验。
      en: After compromising a managed workstation, an adversary can extract historical communications from a previously synchronized
        mailbox copy without asking the mail service for each message again. Mandiant's APT1 report shows GETMAIL extracting
        messages and attachments from PST files with date-limited selection. After taking over mail accounts, adversaries
        can configure arrival-triggered rules for financial topics; Microsoft observed conditional forwarding and deletion
        rules across hundreds of mailboxes in one BEC campaign. These cases establish possible implementations, while any
        reduction in alerts requires the local baseline to be tested.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 副本复用要求攻击者能读取已同步端点文件或进程可见的邮件，并接受缓存可能只有近月内容、附件未完全同步或副本陈旧。到达触发分流要求攻击者能修改邮箱或邮件流规则，知道可选的主题、发件人或正文条件，并控制可收取副本的目的地；其代价是留下配置变更、规则状态和每封匹配邮件的路由记录。两者都不要求攻击者同时拥有所有邮箱的管理员权限。
        en: Replica reuse requires access to already synchronized endpoint files or mail visible to the client process, and
          the attacker must accept that cache content may be recent only, attachments incompletely synchronized, or copies
          stale. Arrival-triggered replication requires permission to change mailbox or mail-flow rules, knowledge of selectable
          subject, sender, or body conditions, and control of a destination receiving copies. It leaves configuration changes,
          rule state, and routing records for every match. Neither mode requires administrator rights over every mailbox.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有 Exchange Online 的 MailItemsAccessed、规则变更、自动转发报告、消息跟踪、终端文件审计和身份登录日志，但覆盖受许可、设置与留存限制。只审查服务器消息访问会漏掉既有缓存再次读取，只审查异常登录会漏掉同一会话内的持续转发；将设备、进程、邮箱、规则、InternetMessageId
          与接收目的地关联后可恢复链条。若终端文件审计或邮件传输日志缺失，应明确降低结论强度。
        en: Defenders may have Exchange Online MailItemsAccessed, rule-change records, auto-forward reports, message trace,
          endpoint file audit, and identity sign-ins, subject to licensing, configuration, and retention limits. Server-message-access
          review alone misses rereads of existing caches; anomalous-sign-in review alone misses continuing forwarding in the
          same session. Joining device, process, mailbox, rule, InternetMessageId, and recipient destination can recover the
          chain. Missing endpoint file audit or transport logs should lower confidence explicitly.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 邮件读取移至服务器访问审计之外的副本或投递流程
    en: Shift mail acquisition to a replica or delivery path outside ordinary server-read review
  analysis:
    paragraphs:
    - zh: 攻击者不再对每封目标邮件产生新的服务端绑定读取，而从早已同步的终端副本提取内容，或让邮件投递流程按条件复制新消息。以邮箱登录或逐封读取为中心的分析因此只能看到先前同步或一次规则变更，误把后续获取视为空白；终端文件和消息路由证据仍可重建行为。Microsoft
        的审计说明、缓存模式说明和转发报告支持观察面差异，攻击案例支持真实使用，但防守遗漏是依赖部署的推断。
      en: The attacker avoids a fresh server bind for every target message by extracting from an earlier endpoint replica
        or causing the delivery process to copy new messages conditionally. Analysis centered on mailbox sign-ins or per-message
        reads sees an earlier sync or a single rule change and may mistake subsequent acquisition for inactivity; endpoint-file
        and mail-routing evidence can still reconstruct it. Microsoft's audit, cached-mode, and forwarding documentation supports
        the observation-plane difference, and incident reports support real use, while actual defensive misses depend on deployment.
  confidence: medium
  evidence_refs:
  - REF-000567
  - REF-000568
