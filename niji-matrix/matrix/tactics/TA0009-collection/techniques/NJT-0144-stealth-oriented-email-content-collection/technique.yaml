research:
  limitations:
    paragraphs:
    - zh: GETMAIL 的 PST 事件证明离线邮件抽取，却不能证明 OST 缓存也在该入侵中被利用或特定告警被规避。Microsoft 的 BEC 报告证明条件转发规则存在，但没有公开逐封消息的完整匹配与送达链；邮件审计和自动转发报告还受许可、启用及留存条件限制。正常迁移、备份、eDiscovery、委派、合规日记与用户离线阅读均可能形成相似形状，缺少授权、设备与结果目的地证据时应降低置信度。
      en: The GETMAIL PST incident establishes offline extraction, not use of an OST cache in that intrusion or evasion of
        a particular alert. Microsoft's BEC report establishes conditional forwarding rules but does not publish a complete
        per-message match-and-delivery chain. Mail audit and auto-forward reports also depend on licensing, enablement, and
        retention. Authorized migration, backup, eDiscovery, delegation, compliance journaling, and ordinary offline reading
        can look similar; confidence falls without authorization, device, and destination evidence.
