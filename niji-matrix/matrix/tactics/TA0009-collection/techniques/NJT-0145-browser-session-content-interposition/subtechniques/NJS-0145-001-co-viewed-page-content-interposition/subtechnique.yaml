schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0145-001
parent_ref: NJT-0145
name:
  zh: 同页活动内容中介
  en: Co-Viewed Page Content Interposition
summary:
  zh: 攻击者在用户正在浏览的页面或请求上按条件读取或改写内容，使收集与正常页面活动重叠。
  en: An actor conditionally reads or modifies the page or requests the user is viewing, overlapping collection with normal
    page activity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 同页活动内容中介是攻击者把读取或改写点放入用户正在使用的页面、浏览器网络处理或扩展脚本，使当前会话中的页面源码、请求正文或响应片段进入攻击者可控范围。直接目的是取得这些内容，条件式触发可由站点、页面路径或业务动作决定；是否使用
      DLL、扩展或调试接口不决定此子项身份。
    en: Co-Viewed Page Content Interposition places a read or modification point in the page, browser network handling, or
      extension script the user is currently using, exposing page source, request bodies, or response fragments to the actor.
      Its direct purpose is to acquire that content, with triggers based on site, page path, or business action. A DLL, extension,
      or debugger interface does not define the child.
stealth_characteristics:
  paragraphs:
  - zh: 同页活动内容中介把异常读取压进用户原本会访问的页面时段，服务端可能只见自然的登录和页面顺序，外部网络传感器也可能看不到浏览器内的 DOM 或请求截取。残余包括新扩展权限、页面脚本/DOM 差异、浏览器控制端外连和被改写的请求；若用户没有打开目标页面，条件式控制点通常不产生相同内容流。
    en: Co-Viewed Page Content Interposition compresses the read into the time the user was already visiting a page. The service
      may see a natural login and page order, and perimeter sensors may miss browser-local DOM or request interception. Residue
      includes new extension permissions, script or DOM differences, browser egress to a controller, and altered requests.
      Without a user visit to the targeted page, a conditional control point usually has no equivalent content flow.
scope_boundary_definition:
  paragraphs:
  - zh: 本子项要求攻击者从用户当前页面或同次页面请求实际取得内容或具有可验证的读取链。单独截取按键和表单字符归 T1056；仅把用户导向假登录页且未在原会话读取内容，归首次入口或凭据路径。页面改写若仅推动交易欺诈或保持会话而没有内容取得证据，不足以成立
      Collection。获批准的扩展和开发者调试需按授权、版本、站点权限及数据目的区分。
    en: This child requires actual content acquisition or a verifiable read chain from the user's current page or its requests.
      Keystrokes and form characters alone belong to T1056. Sending a user to a fake login page without reading the original
      session belongs to first entry or credential-path behavior. A page rewrite that only promotes fraud or preserves a session
      does not establish Collection without content evidence. Authorized extensions and developer debugging require checks
      of approval, version, host permissions, and data purpose.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 用户已登录企业或金融应用并打开包含敏感正文的页面时，攻击者驻留的浏览器控制点按域名或页面状态启用，复制页面或请求内容，并可能用局部 HTML 改写诱导显示更多字段。后续凭据盗取、交易改写和外传另作行为评价。
      en: When a user opens a sensitive page in an authenticated enterprise or financial app, a resident browser control point
        activates on domain or page state, copies page or request content, and may locally change HTML to elicit additional
        fields. Later credential theft, transaction alteration, and exfiltration are assessed separately.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需使浏览器加载受控脚本、扩展或 hook，并匹配目标页面结构和时机；动态页面、CSP、扩展许可与浏览器更新可能破坏读取或改写路径。攻击者若只持有页面外的网络位置，应转由 T1557 评价。
        en: The actor must cause the browser to load a controlled script, extension, or hook and match target page structure
          and timing. Dynamic pages, CSP, extension permission, and browser updates can break reading or modification. Control
          only at a network position is evaluated under T1557.
    defender_model:
      paragraphs:
      - zh: 防守方需要扩展清单及权限、进程模块与调试附着、浏览器外连和应用请求日志；单一应用端请求日志无法看到本地 DOM 读取。用户可报告页面变化，但不应以可见变化为必要条件。
        en: The defender needs extension inventory and permissions, process modules and debugger attachments, browser egress,
          and application request logs. Application requests alone do not expose local DOM reads. User-visible page changes
          can be reported but are not required.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 页面内读取避开外围内容观察
    en: Page-local reads evade perimeter content observation
  analysis:
    paragraphs:
    - zh: 控制点只在目标页面加载后于浏览器内取得页面或请求内容，服务端仍处理正常会话且外围网络可能仅见加密连接，造成内容读取与服务访问日志脱钩。扩展权限、脚本变更和内容外传仍可恢复这一链条。
      en: A control point reads page or request content inside the browser after a target page loads. The service handles
        a normal session while perimeter monitoring may see only encrypted connections, separating the read from ordinary
        service logs. Extension permissions, script changes, and content egress can still reconstruct the chain.
  confidence: medium
  evidence_refs:
