research:
  limitations:
    paragraphs:
    - zh: Kaspersky 的 QakBot 分析证明网络 API hook 与按金融页面注入脚本，但所展示片段不量化每次实际取回的数据；Elastic 的扩展分析区分从样本得到的能力与实验靶页验证。Talos Qbot 样本中全部
        618 份只观察到登出重定向，该动作是保持会话的佐证，不能单独支持本子项的内容取得。正常扩展同样可能观察 DOM，故权限异常不能代替内容证据。
      en: Kaspersky documents QakBot network API hooking and financial-page script injection but does not quantify the content
        retrieved in every instance. Elastic distinguishes sample capability from validation on a test page. In the 618 Qbot
        samples Talos examined, the observed webinject action was logout redirection; it corroborates session manipulation
        but does not by itself prove this child's content acquisition. Legitimate extensions can also observe the DOM, so
        permission anomalies cannot replace content evidence.
