research:
  limitations:
    paragraphs:
    - zh: Cobalt Strike 原作者说明代理在旧版 Internet Explorer/WinINet 上借用会话，并非现代 Chromium、Firefox 或真实受害现场的普遍实证。ATT&CK 文本将浏览器 pivot
        列为例子，却没有为每次被引用的入侵给出应用端请求与内容证据。正式案例需要代理连接、受害浏览器进程和站点资源读取三者闭环。
      en: Cobalt Strike's author describes session borrowing in older Internet Explorer and WinINet; this is not universal
        evidence for modern Chromium, Firefox, or real victim incidents. ATT&CK lists browser pivoting as an example but does
        not supply application request and content evidence for every cited intrusion. A formal case needs a closed chain
        among relay connection, victim browser process, and resource read.
