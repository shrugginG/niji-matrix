schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0145-002
parent_ref: NJT-0145
name:
  zh: 浏览器上下文代理借用
  en: Browser-Context Proxy Borrowing
summary:
  zh: 攻击者从独立操作端经受害浏览器上下文请求站点内容，使服务端仍见既有会话身份但出现额外访问序列。
  en: An actor requests site content from a separate operator endpoint through the victim browser context, leaving existing
    session identity but extra access sequences at the service.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 浏览器上下文代理借用是攻击者在目标浏览器执行环境中建立请求转发点，让独立操作端提出的页面请求由受害浏览器所持会话状态完成。它取得的内容可与用户当时屏幕上的页面不同，因此区别于同页中介；核心变量是操作端与受害浏览器分离，而非所用代理产品或浏览器类型。
    en: Browser-Context Proxy Borrowing establishes a request relay in the victim browser execution environment so pages requested
      by a separate operator are fulfilled with the victim browser's session state. Retrieved content can differ from what
      the user is viewing. The stable variable is separation of operator and victim browser, not the proxy product or browser
      type.
stealth_characteristics:
  paragraphs:
  - zh: 浏览器上下文代理借用可以不改变用户当前页面，且目标站点可能把独立操作端的请求记在受害者既有认证与设备环境之下。可观察残余是浏览器进程控制点、与远端的代理或隧道连接，以及用户缺少相应交互时仍出现的额外资源请求；高权限注入并非所有实现的必要条件，但典型进程内代理会留下句柄和线程线索。
    en: Browser-Context Proxy Borrowing can leave the current user page unchanged while the target site records the operator's
      requests under the victim's existing authentication and device environment. Residue includes a browser control point,
      remote proxy or tunnel connection, and extra resource requests without matching user interaction. High-integrity injection
      is not required by every implementation, though a typical in-process proxy leaves handle and thread clues.
scope_boundary_definition:
  paragraphs:
  - zh: 只有证明独立请求经浏览器上下文完成并取得站点内容，才纳入本子项。复制 Cookie 后在另一台设备重放属于 T1539 的结果及后续凭据使用；一般企业代理未借受害浏览器会话；单纯建立隧道或注入 DLL 也不等于收集。若经代理读取邮件或知识库内容，可在有对象证据时同时记
      T1114 或 T1213。
    en: Include this child only when independent requests are shown to complete through the browser context and retrieve site
      content. Copying a cookie and replaying it on another device is a T1539 result and later credential use. An ordinary
      enterprise proxy does not borrow the victim browser session, and a tunnel or DLL injection alone is not Collection.
      Reading mail or repository content through the relay may additionally map to T1114 or T1213 when the object is evidenced.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 已控制终端的攻击者发现用户浏览器可访问内部门户或已完成多因素认证的业务站点，便从独立操作端请求用户未必正在查看的页面。此用法可避免新设备登录流程，并可取得应用内容；是否真的绕过特定 MFA 政策须按应用日志证明。
      en: After controlling an endpoint, the actor finds that the user's browser can reach an intranet portal or an MFA-authenticated
        business site, then requests pages the user may not be viewing from a separate operator endpoint. This can avoid a
        new-device sign-in flow and acquire application content, but bypass of a particular MFA policy requires application
        evidence.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需能在具备有效会话状态的浏览器上下文建立代理、维持与远端操作端的链路，并选择该浏览器确实有权访问的资源。权限、进程隔离和浏览器关闭会限制有效期；工具作者的实现说明不证明现代浏览器都具有同样状态共享方式。
        en: The actor must establish a relay in a browser context with valid session state, maintain a link to the remote
          operator, and select resources the browser can actually access. Permissions, process isolation, and browser closure
          limit its lifetime. A tool author's implementation does not establish that modern browsers all share state in the
          same way.
    defender_model:
      paragraphs:
      - zh: 防守方应有浏览器进程访问/模块事件、主机连接记录、IdP 与目标应用的细粒度请求日志，并可在隐私允许下取得用户交互线索。若只有登录事件，独立请求会被并入同一会话；若只有主机事件，也可能只看到注入而无法证明读取了哪一页。
        en: The defender needs browser process-access and module events, host connection records, fine-grained IdP and target-app
          requests, and user interaction evidence where privacy permits. Sign-in events alone can fold independent requests
          into one session; endpoint events alone may show injection without proving which page was read.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 独立请求借用受害浏览器认证外观
    en: Independent requests borrow victim-browser authentication appearance
  analysis:
    paragraphs:
    - zh: 独立操作端把请求交给受害浏览器中的代理，该代理使用浏览器现有状态取得响应，目标服务遂把额外请求关联到熟悉的会话而非新设备。新登录检测失去区分力，但服务端额外请求序列与端点代理链仍可揭露借用。
      en: A separate operator passes requests to a proxy inside the victim browser, which fulfills them with existing browser
        state. The service associates extra requests with a familiar session instead of a new device. New-login detection
        loses discrimination, but extra request sequences and the endpoint relay chain can expose the borrowing.
  confidence: low
  evidence_refs:
  - REF-000575
  - REF-000574
