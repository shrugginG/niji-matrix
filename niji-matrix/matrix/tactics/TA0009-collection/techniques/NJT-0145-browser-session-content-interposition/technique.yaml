research:
  limitations:
    paragraphs:
    - zh: 浏览器代理借用的一手资料来自工具作者，说明 IE/WinINet 能力但不是受害者现场取证；QakBot 和 KREMLIN 样本证明控制与可读内容路径，不能把每个可触发功能当作真实用户数据已取得。浏览器版本、扩展 API、目标站点、会话隔离与隐私权限会改变可见字段；Talos
        对 Qbot 样本看到的登出重定向也提醒，页面改动不自动意味着内容收集。
      en: The first-party browser-pivot source is a tool author's account of IE/WinINet capability rather than victim incident
        response. QakBot and KREMLIN samples support control and content-readable paths but do not turn each available feature
        into observed user-data acquisition. Browser version, extension APIs, target site, session isolation, and privacy
        permission change telemetry. Talos's observed logout redirects in Qbot samples also show that a page change does not
        automatically establish collection.
