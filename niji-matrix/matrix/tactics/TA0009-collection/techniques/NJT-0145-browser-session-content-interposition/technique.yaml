schema_version: 2.0.0
type: technique
id: NJT-0145
name:
  zh: 浏览器会话内内容介入
  en: Browser-Session Content Interposition
summary:
  zh: 攻击者借用或改变目标浏览器的活动会话，使页面与请求内容在原有认证上下文中可被读取，而常规服务日志仍可能呈现为该用户的浏览器活动。
  en: An adversary borrows or alters an active victim browser session to read pages and requests in its existing authentication
    context, while service logs may still resemble that user's browser activity.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1185
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1185
definition_and_concept:
  paragraphs:
  - zh: 活动浏览器会话中介是攻击者在已建立的浏览器上下文内设置可观察、改写或转发会话交互的控制点，以取得浏览器能够访问的页面、请求或响应内容。控制点可位于浏览器进程内、具有页面权限的扩展或经浏览器上下文完成请求的代理；浏览器、插件和注入手段只是实现条件。Collection
      的直接结果是对内容的访问，既有认证状态使内容可读但不等同于再次获得账户凭据。
    en: Active Browser Session Interposition places an adversary-controlled observation, modification, or forwarding point
      inside an established browser context to obtain pages, requests, or responses accessible to that browser. The control
      point can reside in a browser process, a page-permitted extension, or a proxy that fulfills requests through the browser
      context; browser products, plug-ins, and injection methods are implementation conditions. The Collection result is access
      to content. Existing authentication state makes that content readable but is not itself newly acquired account credentials.
  - zh: 这一概念要求把会话状态与内容取得连成因果链。进程句柄、扩展权限、调试附着或代理监听只能证明控制能力；还需页面读取、请求正文、响应访问或可信服务端记录，才可认定内容路径确实被使用。攻击者也可在用户浏览的页面上插入条件式内容或借同一浏览器为远端操作员发出请求，这两者对用户界面和服务端请求序列留下不同的痕迹。
    en: This concept requires a causal link between session state and content acquisition. A process handle, extension permission,
      debugger attachment, or proxy listener shows control capability; a page read, request body, response access, or corroborating
      application record is needed to establish use of the content path. An adversary may interpose on pages the user is viewing
      or drive separate requests through the same browser for a remote operator, leaving different UI and server-side request
      traces.
stealth_characteristics:
  paragraphs:
  - zh: 中介运行在用户本来访问网站的浏览器环境中，服务端的登录状态、客户端证书与常用设备属性可以延续，使仅按新设备登录或显著来源变化建模的检测较难区分。若攻击者只在目标页面或业务动作出现时启用，恶意请求的时间与正常会话重叠。代理式借用则可能完全不改变用户当前页面，但在同一会话身份下产生额外的资源访问。
    en: Interposition runs in the browser environment that already visits the service, so login state, client certificates,
      and familiar device attributes can persist and frustrate detection based only on a new sign-in or large source shift.
      A trigger tied to a target page or business action overlaps malicious activity with normal session time. Proxy-style
      borrowing may leave the user's current page untouched while producing additional resource accesses under the same session
      identity.
  - zh: 匿迹并非无痕。浏览器扩展版本、权限或来源的变化，外部进程访问浏览器、远程线程与模块载入，调试连接，浏览器到陌生控制端的连接，以及服务端与用户可见页面不一致的请求序列，均可形成交叉证据。浏览器隔离、权限约束、内容安全策略和企业扩展策略可能使中介失效；若缺少端点浏览器和服务端双侧遥测，正常扩展、自动化测试与恶意中介的区分会降低。
    en: 'Stealth leaves residue: extension version, permission, or origin changes; external process access to a browser; remote
      threads and module loads; debugger attachments; browser connections to an unfamiliar controller; and request sequences
      inconsistent with the visible user workflow. Browser isolation, permissions, content security policy, and managed extension
      policy can defeat an implementation. Without both browser endpoint and service telemetry, distinguishing approved extensions
      or test automation from malicious interposition becomes less reliable.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入浏览器内 hook、受控扩展或附着工具实际读取已认证页面及请求内容，或远端操作经受害浏览器上下文访问其可见的站点内容。合法密码管理器、无障碍扩展、开发者调试、受批准的自动化测试和企业流量检查可产生相似权限或连接，须依据批准主体、变更记录、访问对象与结果区分。仅有扩展安装、进程注入或浏览器代理能力而无内容读取链时，不能进入
      Collection 的确认层级。
    en: Include an in-browser hook, controlled extension, or attached tool that actually reads authenticated pages or requests,
      and remote actions that retrieve site content through the victim browser context. Legitimate password managers, accessibility
      extensions, developer debugging, approved test automation, and enterprise inspection can create similar permissions
      or connections; distinguish them by authorization, change history, target objects, and outcome. An extension install,
      process injection, or available browser proxy without a content-read chain does not reach confirmed Collection.
  - zh: T1557 的介入点在终端与服务之间的通信路径，本技术的介入点在浏览器执行或会话上下文。T1539 的对象是 Cookie 或令牌；T1055 是让代码进入另一进程的执行步骤；T1056 是捕获输入事件或表单键值。邮件正文、仓库页面或云资源在被浏览器实际读取后仍可按
      T1114、T1213 等数据来源技术另记，不应因浏览器作为客户端就吞并来源边界。TA0001 的首次钓鱼入口也不因后续页面中介而倒填为本技术。
    en: T1557 interposes in the path between endpoint and service; this technique interposes in browser execution or session
      context. T1539 concerns a cookie or token result, T1055 the execution step of placing code in another process, and T1056
      input events or form values. Email bodies, repository pages, or cloud resources read through a browser may also map
      to T1114, T1213, or another source technique; the browser client does not erase the source boundary. A first phishing
      entry under TA0001 should not be recast as this technique because of later page interposition.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者已在终端或浏览器配置取得控制，发现目标用户处于已认证的银行、企业门户或内网站点会话时，选择与页面活动同步读取内容，或在远端操作端发起受害浏览器能够访问的额外页面请求。成功的 Collection 可为后续信息盗取、欺诈或横向行动提供材料，但后续外传与交易篡改是各自独立行为。
      en: After obtaining endpoint or browser-configuration control, an adversary finds an authenticated banking, enterprise
        portal, or intranet session and either reads content alongside the user's page activity or requests additional pages
        reachable from the victim browser for a remote operator. Successful Collection may feed later theft, fraud, or lateral
        activity, but exfiltration and transaction alteration are separate behaviors.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要浏览器进程写入能力、可安装或篡改扩展的配置能力、或已经建立的浏览器自动化/调试权限之一，并了解目标站点的登录状态、页面结构或可访问资源。进程内代理可能要求高完整性或特定浏览器架构；扩展路径受主机权限和站点访问许可限制。攻击者还需把收集到的内容传回控制端或保留在本机，其通道若缺失，只有观察机会不能证明已取得内容。
        en: The attacker needs at least one of browser-process write access, control of an installable or alterable extension,
          or established browser automation or debugging permission, together with knowledge of target login state, page structure,
          or reachable resources. An in-process proxy may require high integrity or a particular browser architecture; extension
          paths depend on host and site permissions. The actor also needs a way to retain or return read content; without
          that channel, observed control is only an opportunity, not proof of acquisition.
    defender_model:
      paragraphs:
      - zh: 防守方可结合端点进程与扩展清单、调试会话、浏览器外连、企业 IdP/应用访问日志以及用户实际交互或页面导航线索。服务端通常只见同一认证主体发出的请求，不能直接分辨由用户、扩展还是代理生成；端点也未必能解密浏览器内每个读取动作。把浏览器控制事件与页面访问对象、时窗和内容外传关联，可提高归因强度，但保留期、隐私限制和未受管设备会形成盲区。
        en: The defender may combine endpoint processes and extension inventory, debugger sessions, browser egress, identity-provider
          and application access logs, and evidence of actual user interaction or page navigation. The service often sees
          requests under one authenticated principal and cannot directly tell whether the user, extension, or proxy generated
          them; endpoint sensors may not expose every in-browser read. Joining browser-control events to page objects, time
          windows, and content egress improves attribution, but retention, privacy limits, and unmanaged devices leave blind
          spots.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借既有浏览器身份呈现内容访问
    en: Content access under an established browser identity
  analysis:
    paragraphs:
    - zh: 攻击者在浏览器上下文中读取页面或由它发出请求，服务端因而继续观察到用户已有的认证状态和浏览器来源，而非明显的新客户端。身份连续性降低仅依赖新登录或来源偏移的区分能力，但额外访问顺序、扩展或注入痕迹仍可暴露控制点。此机理说明归因困难，不宣称认证本身消失或所有服务端控制均被绕过。
      en: The actor reads pages or sends requests inside the browser context, so the service continues to observe existing
        user authentication and browser origin rather than an obviously new client. Identity continuity weakens rules based
        only on new logins or source shifts, while extra request order, extensions, or injection residue can reveal the control
        point. This mechanism describes attribution difficulty and does not imply authentication disappears or all server
        controls are bypassed.
  confidence: medium
  evidence_refs:
  - REF-000574
  - REF-000575
  - REF-000576
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 浏览器内部读取落在外围遥测盲区
    en: In-browser reads fall outside perimeter telemetry
  analysis:
    paragraphs:
    - zh: 页面内容可在浏览器网络或 DOM 层被读取，外围网络设备只见正常的浏览器到服务连接，未必看到本地扩展或脚本取得的数据。若终端没有扩展权限、脚本及浏览器外连的记录，关键读取动作就不进入常规检测视野；具备端点和服务端关联时，这一盲区会缩小。此项仅在实际使用浏览器内控制点时成立。
      en: Page content can be read at the browser network or DOM layer while perimeter devices see ordinary browser-to-service
        connections and may miss local extension or script access. Without endpoint records of extension permissions, scripts,
        and browser egress, the critical read falls outside routine detection. Correlated endpoint and service telemetry narrows
        that gap. This mechanism applies only when an in-browser control point is actually used.
  confidence: medium
  evidence_refs:
  - REF-000576
  - REF-000578
  - REF-000579
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术按攻击者与用户活动是否共用同一页面过程划分：同页活动内容中介在用户正在访问的页面内条件式读取请求或页面内容，浏览器上下文代理借用则让远端操作者借受害浏览器状态发起额外请求。前者保留页面脚本、扩展与内容差异，后者保留控制通道和服务端额外访问序列。浏览器品牌、扩展或
        DLL、表单字段和目标网站类别都不是稳定子项边界；代理借用仍以工具能力证据作低置信度分类。
      en: The children divide whether adversary action shares the user's current page activity. Co-Viewed Page Content Interposition
        conditionally reads requests or page content during that activity; Browser-Context Proxy Borrowing drives additional
        requests from a remote operator through the victim browser's state. The first leaves page script, extension, and content-difference
        traces, while the second leaves a control channel and extra service-side requests. Browser brand, extension versus
        DLL, form fields, and target site type are not stable boundaries; proxy borrowing remains a low-confidence classification
        based chiefly on tool capability.
  coverage: established
  subtechnique_refs:
  - NJS-0145-001
  - NJS-0145-002
