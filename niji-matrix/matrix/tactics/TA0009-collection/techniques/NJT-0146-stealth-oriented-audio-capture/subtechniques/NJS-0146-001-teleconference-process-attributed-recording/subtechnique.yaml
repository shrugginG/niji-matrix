schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0146-001
parent_ref: NJT-0146
name:
  zh: 会议进程归因借用录音
  en: Teleconference-Process-Attributed Recording
summary:
  zh: 攻击者只在预期使用麦克风的会议进程内激活录音，使设备访问呈现正常应用身份，即使录制的是应用外谈话。
  en: An adversary activates recording only within a meeting process expected to use the microphone, giving device access
    a normal app identity even when outside-app conversation is captured.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 本子项以录音代码所在的进程身份为可控变量：恶意模块先进入电话会议应用进程，再从输入设备获取音频。它不要求正在发生通话，也不声称会议应用自行批准录音。与父级的普通独立录音相比，其直接变化是麦克风访问和文件写入可以落在一个本来就有音频职责的进程谱系中。
    en: This child uses the recorder's process identity as the controlled variable. A malicious module first enters a teleconferencing
      app process and then obtains audio from an input device. It does not require an active call or claim that the meeting
      app authorized recording. Relative to a separate recorder, microphone access and file writes can appear under a process
      lineage that already has an audio role.
stealth_characteristics:
  paragraphs:
  - zh: 会议进程归因借用录音使“应用获准使用麦克风”这个单点信号失去区分力。ESET 在 Attor 中发现录音插件依据进程名只在会议应用内激活，既可能录制在线通话，也能记录应用外环境谈话；作者将这种安排解释为可能避免用户怀疑。模块注入、麦克风活跃时段和加密录音文件仍是残余线索，不能据此宣称设备访问完全不可见。
    en: Teleconference-Process-Attributed Recording makes the single signal of an app being allowed to use a microphone less
      discriminating. ESET found Attor's recorder activated by process name only inside meeting apps; it could record online
      calls or ambient conversation outside the app, and the authors saw reduced user suspicion as a possible reason. Module
      injection, microphone-active intervals, and encrypted recording files remain traces, so device access is not invisible.
scope_boundary_definition:
  paragraphs:
  - zh: 只有实际在音频职责进程中执行采集才属于本子项；仅将恶意文件命名为会议软件、只注入而未录音或仅有会议进程自身的合法录制均不足。若通过应用接口取得通话媒体而非借宿主进程设备访问，应留在父级，待独立匿迹变量得到证明后再考虑子项。进程注入本身、音频文件暂存和加密后上传可分别并列归其他技术，不能替代采集证据。
    en: This child applies only when capture actually executes in an audio-role process. Naming malware after meeting software,
      injecting without recording, or a legitimate recording by the meeting app is insufficient. When call media are obtained
      through the app's interface rather than device access under its process identity, keep them at the parent pending evidence
      of an independent stealth variable. Process injection itself, audio staging, and encrypted upload may receive separate
      labels but cannot replace proof of capture.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: ESET 对 Attor 的插件分析给出明确实例：录音插件位于包含 Skype 等应用的硬编码进程名单中才激活，使用可用麦克风并把录音加密写入集中 Upload 目录。该场景适用于会议客户端常驻、用户习惯看到其占用麦克风的终端；若会议应用从未启动，预期进程身份就不存在，攻击路径也不能按此子项成立。
      en: ESET's Attor plugin analysis provides a concrete example. The recorder activates only in a hard-coded process list
        including Skype, uses an available microphone, and writes encrypted recordings to a central Upload directory. The
        scenario fits an endpoint where a meeting client runs and users expect it to use the microphone. If that app never
        runs, the expected process identity is absent and this child does not describe the path.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需已能将录音代码加载进会议软件进程，并控制何时启用设备访问；进程注入可遭受应用保护、模块完整性检测或权限边界阻拦。攻击者并不控制所有音频会话审计，也无法确保用户不会看到麦克风指示或录音产物。
        en: The attacker needs to load recording code into a meeting-app process and control when it accesses the device.
          App protection, module-integrity checks, and privilege boundaries may block injection. The attacker does not control
          all audio-session audit and cannot guarantee users miss microphone indicators or recorded artifacts.
    defender_model:
      paragraphs:
      - zh: 防守方如果只对未知进程访问麦克风告警，容易把该进程列为正常；若保留模块加载、跨进程访问、进程签名与麦克风会话同一进程键，可检验音频职责是否由非预期代码触发。正常会议插件、虚拟音频设备、无障碍组件和录制软件也会装入模块，必须结合代码来源、授权清单与实际会议时段。
        en: A defender alerting only on unknown microphone-using processes may allowlist this process. With module loads,
          cross-process access, process signature, and microphone sessions joined by process identity, the defender can test
          whether unexpected code caused audio use. Legitimate meeting plugins, virtual audio devices, accessibility components,
          and recording tools also load modules, so code provenance, approved inventories, and actual meeting times matter.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 让恶意麦克风会话继承会议应用的正常进程外观
    en: Give a malicious microphone session the normal process appearance of a meeting app
  analysis:
    paragraphs:
    - zh: 恶意模块在会议应用内启动设备录音，传感器看到的是预期使用麦克风的进程，按进程名筛选的规则因此丢失区分力。残留的模块加载、注入边、非会议时段采集和音频文件仍可重建行为。ESET 直接观察到这一执行条件及产物，并将降低用户怀疑表述为可能目的，因此匿迹效果保持中等置信度。
      en: A malicious module starts device recording inside a meeting app, causing a sensor to see a process expected to use
        a microphone and reducing the value of a process-name rule. Module loads, injection edges, capture outside meeting
        time, and audio files can still reconstruct the action. ESET directly observed the activation condition and artifacts
        but described reduced suspicion as a possible motive, so the stealth effect remains medium confidence.
  confidence: medium
  evidence_refs:
  - REF-000583
