research:
  limitations:
    paragraphs:
    - zh: Attor 白皮书是单一样本族的逆向结果，能够证明进程条件、录音和可能的匿迹意图，不能推断所有会议进程内录音都恶意，也没有量化对端点告警的影响。需要现场传感器证明音频会话能与进程及模块对应；只有进程创建日志时，该子项的核心因果边无法直接检验。
      en: The Attor white paper is reverse engineering of one malware family. It establishes process gating, recording, and
        a possible stealth rationale, not that every recording inside a meeting app is malicious or that endpoint alerts fell
        by a measured amount. A local sensor must prove audio sessions can be joined to process and module identity; process-creation
        logs alone cannot test the core causal edge.
