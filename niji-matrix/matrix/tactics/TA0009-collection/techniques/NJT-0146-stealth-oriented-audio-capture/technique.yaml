research:
  limitations:
    paragraphs:
    - zh: ESET 与 Unit 42 样本分析直接报告录音，平台文档只说明权限、指示或控制能力。Attor 对进程条件和磁盘产物的证据较强，降低用户怀疑是作者的可能性判断；T9000 是旧 Skype 接口的真实实现，不代表现行会议客户端或无提示权限绕过。设备和接口字段需经本地产品试点验证，Windows
        用户界面的七日历史不自动构成企业日志流。
      en: ESET and Unit 42 sample analyses directly report recording, whereas platform documentation establishes only permission,
        indicator, or control capabilities. Attor strongly documents process gating and disk output, while reduced suspicion
        is the authors' possible explanation. T9000 is a real older Skype implementation, not evidence for current meeting
        clients or silent permission bypass. Device and interface fields need local product-pilot validation; Windows' seven-day
        UI history is not automatically an enterprise log stream.
    - zh: 合法会议录音、转写、客服质检和无障碍使用是必要反例。缺少模块身份、接口请求者、音频会话与录音结果关联时，只能上报较弱的调查线索，不能从麦克风活动、授权提示或音频扩展名直接断言恶意采集。
      en: Authorized meeting recording, transcription, contact-center quality assurance, and accessibility are necessary comparators.
        Without joins among module identity, interface requester, audio session, and recording result, only weaker investigation
        leads are justified; microphone activity, a grant prompt, or an audio extension alone cannot prove malicious capture.
