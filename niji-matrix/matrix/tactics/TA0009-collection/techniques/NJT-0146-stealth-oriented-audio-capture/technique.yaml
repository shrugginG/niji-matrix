schema_version: 2.0.0
type: technique
id: NJT-0146
name:
  zh: 匿迹型音频捕获
  en: Stealth-Oriented Audio Capture
summary:
  zh: 攻击者获取环境或通话音频，并让采集活动借用预期会使用音频的进程或通话应用接口，削弱单凭麦克风活动或授权提示识别恶意录音的能力。
  en: An adversary acquires ambient or call audio while placing capture in an audio-expected process or call-application interface,
    weakening identification from microphone activity or authorization prompts alone.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1123
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1123
definition_and_concept:
  paragraphs:
  - zh: 匿迹型音频捕获指攻击者在已控制端点或应用交互路径后，通过输入音频设备或通信应用接口取得环境谈话、语音会议或通话音频，并有意安排采集所处进程或应用会话，使行为与正常音频使用更难区分。判断对象是音频从设备或应用会话进入攻击者控制的记录链，而非插件名称、音频编码格式或最终上传路径。
    en: Stealth-Oriented Audio Capture occurs after an adversary controls an endpoint or application interaction path and
      obtains ambient conversation, voice-meeting, or call audio through an input device or communication-application interface.
      The adversary deliberately places capture in a process or application session where it is harder to distinguish from
      expected audio use. The object of assessment is the path by which audio enters an attacker-controlled recording chain,
      not a plugin name, encoding format, or eventual upload route.
  - zh: 录音能力、麦克风权限和实际取得内容应分层确认。植入程序包含录音模块只能证明潜在能力；设备会话、应用接口附着与音频产物共同出现，才足以提高已发生采集的结论强度。任何预期会使用麦克风的应用仍可能被恶意代码借用，因此“进程正常”或“用户点过允许”都不能单独证明录音得到业务授权。
    en: Recording capability, microphone permission, and actual acquisition must be assessed separately. An implant containing
      a recorder proves capability only. A device session or application-interface attachment combined with an audio artifact
      gives stronger grounds to conclude capture occurred. An app expected to use a microphone can still be borrowed by malicious
      code, so a normal-looking process or a user approval click alone does not establish business authorization for the recording.
stealth_characteristics:
  paragraphs:
  - zh: 进程内麦克风录音使设备访问的进程归因落到电话会议软件，而不一定出现独立录音程序；防守方若只维护“会议软件可用麦克风”的许可名单，就可能忽略同一进程中新载入的恶意模块、异常开始时点与录音产物。麦克风会话和模块注入并未消失，关键变化是正常进程名降低了单一信号的区分力。
    en: In-process microphone recording attributes device access to teleconferencing software without necessarily launching
      a separate recorder. A defender that merely allows listed meeting apps to use microphones may miss a newly loaded malicious
      module, an unusual start time, or a recording artifact in the same process. The microphone session and module injection
      do not vanish; the normal process name reduces the discriminating value of one signal.
  - zh: 通话应用接口路径将采集与一次已登录、可能正在进行的通话关联起来，授权提示及本地暂存痕迹可能看似由合法应用发起。T9000 案例仍要求用户允许 Skype 接口访问，并留下附着、调用、临时音频和会后文件的线索；它既不证明自动绕过授权，也不证明完全复用现存麦克风设备会话。
    en: The call-application-interface path associates capture with a logged-in app and potentially an active call, while
      an authorization prompt and local temporary files may look tied to a legitimate application. In the T9000 case the user
      still had to allow Skype API access, and attachment, calls, temporary audio, and post-call files remained observable.
      The case proves neither automatic bypass of authorization nor complete reuse of an existing microphone-device session.
scope_boundary_definition:
  paragraphs:
  - zh: 范围包括恶意进程借预期使用麦克风的应用身份采集环境声音，及经通信应用接口取得语音通话内容。录音前的进程注入、应用权限取得或会话登录可分别归入其自身技术；本父技术只在音频输入被实际接触或记录时成立。键击、剪贴板文本和表单输入归 T1056
      等相邻项；屏幕和视频内容归 T1113、T1125，纵使来源于同一会议。
    en: Scope includes ambient sound captured under the identity of an application expected to use the microphone and voice-call
      content acquired through a communication-application interface. Prior process injection, application grants, or sign-in
      can receive their own technique labels; this parent applies when audio input is actually accessed or recorded. Keystrokes,
      clipboard text, and form input belong to T1056 or other neighbors; screen and video content belong to T1113 and T1125
      even when they come from the same meeting.
  - zh: 录音产物被放入集中目录时可另标 T1074，被压缩或加密归档时可另标 T1560，随后网络送出不改变本技术的采集边界。合法会议录音、媒体制作、无障碍语音功能与客服质检会呈现相同麦克风访问；仅有设备唤醒、进程名称、WAV 文件或用户点击允许都不足以作恶意结论，应结合应用完整性、会议或工作任务、录音目的地及产物授权判定。
    en: A recording placed in a central directory may also be T1074, and a compressed or encrypted package may also be T1560;
      later network delivery does not change this capture boundary. Authorized meeting recording, media production, accessibility
      speech features, and contact-center quality assurance can show the same microphone access. Device activation, process
      name, a WAV file, or an approval click alone is insufficient; app integrity, the meeting or work task, recording destination,
      and authorization for the artifact must be joined.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在受害者经常使用会议软件的工作站上，植入程序可以进入这些进程再访问麦克风；ESET 观察到 Attor 的录音插件只在硬编码的电话会议进程中启用，并将音频加密存入 Upload 目录。另一场景是恶意插件附着已登录的通话应用接口；Unit
        42 的 T9000 案例中用户须批准 Skype 接口请求，随后插件录制通话并在会后处理暂存音频。两例的防守关注点分别是进程完整性与第三方应用接口授权。
      en: On a workstation where the victim regularly uses meeting software, an implant can enter those processes and access
        the microphone. ESET observed Attor's recorder activating only in a hard-coded list of teleconferencing processes
        and storing encrypted audio in an Upload directory. In another scenario a malicious plugin attaches to a logged-in
        call application's interface. In Unit 42's T9000 case the user had to approve Skype API access, after which the plugin
        recorded calls and processed temporary audio after the call. Process integrity matters in the first case and third-party
        application-interface authorization in the second.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要执行可访问音频输入的代码，或能让通话应用接受第三方接口连接。进程归因路径还要求将模块注入或装入会议应用，并识别该应用的进程名；应用接口路径要求目标应用运行、登录、接口可用以及可能的用户批准。攻击者可以选择宿主进程、模块、录音时机和文件位置，但不能假定能压制操作系统的麦克风指示器、应用授权弹窗或终端文件审计。
        en: The attacker needs code able to access audio input or a way to have a call application accept a third-party interface
          connection. The process-attribution path further requires injecting or loading a module into a meeting app and recognizing
          its process identity. The application-interface path requires the target app to be running, signed in, and exposing
          the interface, and may require user approval. The attacker can choose host process, module, timing, and file location,
          but cannot assume suppression of OS microphone indicators, app prompts, or endpoint file audit.
    defender_model:
      paragraphs:
      - zh: 防守方可能看到进程与模块加载、跨进程访问、麦克风活跃会话、应用授权事件、会议开始结束时间、文件写入和网络外联，但这些数据未必都集中可查询。Windows 的用户界面可显示麦克风使用历史，macOS 可显示麦克风指示与应用权限；这些不等于自动提供企业级逐事件导出。只有在传感器验证确实能提供进程和时间键后，才可把音频设备会话、应用状态和产物关联为分析逻辑。
        en: A defender may observe process and module loads, cross-process access, active microphone sessions, app-grant events,
          meeting start and end times, file writes, and network egress, but these data may not all be centrally queryable.
          Windows can display microphone-use history to the user, and macOS can show microphone indicators and app grants;
          neither guarantees enterprise-grade event export. An analytic may join audio-device sessions, app state, and artifacts
          only after a sensor pilot verifies process and time keys are actually available.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用预期录音的应用身份或通话接口掩盖恶意音频采集
    en: Borrow an audio-expected app identity or call interface to disguise malicious capture
  analysis:
    paragraphs:
    - zh: 攻击者将录音模块放进本来就可能使用麦克风的电话会议进程，或使通话应用接口成为录音入口。设备访问和授权提示于是携带正常应用身份，单靠进程名或会话存在无法区分恶意录音。防守仍可寻找非预期模块、第三方接口授权、异常录音时段和未经批准的音频产物；ESET
        与 Unit 42 直接支持实现与混淆可能性，不支持量化成功率。
      en: An adversary places a recorder in a teleconferencing process that is normally expected to use a microphone or makes
        a call-app interface the recording entry point. Device access and prompts then carry a legitimate app context, so
        process name or call existence alone cannot distinguish malicious capture. Defenders can still seek unexpected modules,
        third-party interface grants, unusual recording intervals, and unapproved audio artifacts. ESET and Unit 42 directly
        support the implementations and potential confusion, not a quantified success rate.
  confidence: medium
  evidence_refs:
  - REF-000583
  - REF-000584
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术只按一项已证匿迹变量建立子项：恶意录音被归因给本来就承担音频职责的会议进程，需用模块、设备会话和进程身份恢复真实调用者。T9000 通过应用接口录制通话需要另一套防守分析，但两条路径共同借用正常通信应用身份，接口类型差异不足以再建一项
        NJS。短时启停与内存缓冲缺少独立企业端点证据，保留为研究限制。
      en: 'This technique establishes one supported stealth variable: malicious recording appears under a meeting process
        with a normal audio role, requiring module, device-session, and process identity to recover the true caller. T9000''s
        call-app interface path needs a different defense analytic, yet both paths borrow normal communication-app identity
        and interface type alone does not justify another child. Short activation and memory buffering lack independent enterprise-endpoint
        evidence and remain research limits.'
  coverage: established
  subtechnique_refs:
  - NJS-0146-001
