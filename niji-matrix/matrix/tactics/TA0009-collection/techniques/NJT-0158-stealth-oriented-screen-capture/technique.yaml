schema_version: 2.0.0
type: technique
id: NJT-0158
name:
  zh: 匿迹型屏幕捕获
  en: Stealth-Oriented Screen Capture
summary:
  zh: 攻击者取得桌面或应用窗口的显示像素，并以受控的目标与时机减少无关截图痕迹，使按全屏持续抓取假设建立的观察更难还原采集过程。
  en: An adversary acquires desktop or application-window pixels while controlling capture target and timing, reducing irrelevant
    capture traces and complicating reconstruction based on continuous full-screen capture assumptions.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1113
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1113
definition_and_concept:
  paragraphs:
  - zh: 匿迹型屏幕捕获是攻击者在已控制的交互桌面上把显示像素读入其控制的程序、内存或截图产物，以获取用户正在观看的邮件、文档、会话或其他可视信息，并有意改变截图发生的条件。其完成点是像素已经被取得，而不是拥有截图代码、发现窗口标题或准备一个输出目录；一次截图、周期抓屏与窗口内截图都可能属于父级，前提是具有可论证的匿迹变量。
    en: Stealth-Oriented Screen Capture is the adversary's reading of displayed pixels from a controlled interactive desktop
      into its program, memory, or image artifact to acquire visible email, documents, conversations, or other information,
      while deliberately changing when capture occurs. Completion requires acquired pixels, not possession of screenshot code,
      discovery of a window title, or preparation of an output folder. A single screenshot, periodic capture, or application-window
      capture can fall within the parent when a defensible stealth variable is present.
  - zh: 截屏路径可以调用操作系统工具、图形接口或应用内部组件；这些路径只说明怎样取像，不自动构成不同技术。ESET 的 Attor 插件提供已观测的条件化像素获取实例，Bitdefender 的 FunnyDream 则证明持续屏幕抓取也能产生相同类别的像素结果。正式分类需要把行为设计、取得结果及防守观察差相连，而不按工具、操作系统、API
      或文件扩展名分拆。
    en: Capture may use an operating-system utility, graphics API, or in-app component; these paths describe how pixels are
      obtained and do not automatically define separate techniques. ESET's Attor plugin provides an observed instance of conditional
      pixel acquisition, while Bitdefender's FunnyDream shows that continuous screen grabbing can produce the same class of
      pixel result. Formal classification joins behavior design, acquisition outcome, and defender-observation difference
      rather than splitting by tool, operating system, API, or extension.
stealth_characteristics:
  paragraphs:
  - zh: 条件化截图改变截图产物与目标上下文的分布：未命中目标进程或前台窗口时不形成该采集链，命中后才在较窄的时段连续输出目标画面。相对无条件抓屏，防守方若只检查固定短时窗口或搜索大量全屏图片，可能错过等待阶段，且较难从孤立截图推断前置门控。该效果是从
      Attor 行为推得的观察差，来源没有量化告警降低或证明所有传感器都会漏报。
    en: Conditional capture changes the distribution of screenshot artifacts relative to target context. The capture chain
      remains inactive before a selected process or foreground window matches, then emits target images in a narrower period.
      Compared with unconditional grabbing, a defender examining only a fixed short interval or looking for a large run of
      full-screen images may miss the waiting phase and struggle to infer the preceding gate from isolated images. This is
      an observation effect inferred from Attor's behavior; the source does not measure alert reduction or prove all sensors
      miss it.
  - zh: 截图并未因此不可见。Attor 仍需存在于交互进程中，命中后每十秒取得图像，并把加密产物交给共享 Upload 目录；FunnyDream 在五秒循环中还留下临时 JPEG、二进制包和归档。进程与模块谱系、经验证的图形捕获遥测、文件创建和目标窗口会话可以提供重建线索。只有确认相应数据被采集并可用同一进程与会话关联，才能把“预期目标下出现像素结果”提升为分析结论。
    en: The screenshots are not invisible. Attor still resides in an interactive process, obtains an image every ten seconds
      after a match, and places encrypted output in a shared Upload directory. FunnyDream's five-second loop also leaves a
      temporary JPEG, binary blobs, and archives. Process and module lineage, validated graphics-capture telemetry, file creation,
      and target-window session context can reconstruct the action. A conclusion about pixels appearing under the selected
      context requires proof that these sources were collected and joinable by process and session.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者实际读取桌面、显示器或应用窗口像素，并以目标状态控制取像而改变截图痕迹的情形。只读取窗口标题、焦点、句柄或进程名称而没有画面取得，归 NJT-0132；仅具截图能力、发出失败命令、创建空目录或生成非屏幕图像，也不达到本技术完成点。受信应用中出现截图并不自动证明恶意，仍须检验代码来源、业务授权及结果去向。
    en: Include actual acquisition of desktop, display, or application-window pixels when target state controls acquisition
      and changes capture traces. Reading only title, focus, handle, or process name without pixels belongs to NJT-0132. A
      screenshot capability, failed command, empty directory, or image unrelated to the display does not reach this technique's
      completion point. A screenshot within a trusted app is not automatically malicious; code provenance, business authorization,
      and outcome destination still matter.
  - zh: 摄像头及视频通话图像输入归 T1125，即使只存单帧；屏幕共享或桌面录像若直接取得显示像素仍由 T1113 负责，是否同时涉及其他媒介应另证。麦克风与通话声音归 T1123，按键和界面操作输入归 T1056。取得后的集中暂存可另标
      T1074，压缩或加密包可另标 T1560，网络发送不能代替屏幕取得证据。员工主动截图、授权远程协助、会议共享和无障碍辅助属于相同观察面的正常反例。
    en: Camera and video-call visual input belongs to T1125 even if only one frame is saved. Screen sharing or desktop recording
      still has display pixels as its direct source and falls under T1113; other media require their own evidence. Microphone
      or call audio belongs to T1123, and keystrokes or interface input to T1056. Central staging after capture may also be
      T1074, compression or encryption T1560, and network transfer cannot substitute for proof of pixel acquisition. Employee-initiated
      screenshots, authorized remote help, meeting sharing, and accessibility assistance are benign comparators on the same
      observation surface.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者已在用户登录的 Windows 工作站运行植入组件，等待浏览器、邮件客户端或即时通信窗口呈现目标内容后截图。Attor 在选中的进程中激活抓屏插件，并对符合条件的前台窗口每十秒取像，适合等待高价值会话出现而不持续保存无关桌面画面。另一种已观测的连续抓屏可由
        FunnyDream 说明，但其高频落盘是对照案例，不构成同一匿迹子项。
      en: An adversary runs an implant on a logged-in Windows workstation and waits for a browser, mail client, or messaging
        window to show target content. Attor activates a grabber in selected processes and captures a qualifying foreground
        window every ten seconds, fitting a campaign that waits for a high-value session without continuously storing unrelated
        desktop images. FunnyDream illustrates observed continuous capture, but its frequent disk output is a comparator rather
        than the same stealth child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要在有交互桌面的会话内执行截图代码或控制具有等效访问能力的进程，并掌握可判断目标窗口的进程名、标题类别或前台状态。条件化采集还要求组件驻留并接受目标不出现时没有截图的成本；若恶意模块寄居其他应用，则须承担注入或加载造成的额外痕迹。攻击者不能假定所有图形接口无提示，也不能假定文件或网络遥测被关闭。
        en: The attacker needs capture-capable code in an interactive desktop session or control of an equivalent process
          and knowledge of process names, title categories, or foreground state that identify a target. Conditional capture
          requires residence and accepts no screenshot if the target never appears. If the malicious module inhabits another
          app, injection or loading adds traces. The attacker cannot assume every graphics API is promptless or that file
          and network telemetry are absent.
    defender_model:
      paragraphs:
      - zh: 防守方可能获得进程创建、模块加载、文件创建、用户会话、前台窗口及经试点验证的截图接口调用数据。Sysmon 的进程或文件事件不能单独证明发生图形抓取，也无法解释加密文件内容；Windows.Graphics.Capture
          的选择器和黄色边框只适用于该接口，不能泛化到 Attor 使用的路径。若没有能把调用主体、目标窗口和像素结果连起来的传感器，检测只能报告可疑图像链或模块行为，不能把窗口匹配当成截图完成。
        en: Defenders may have process creation, module load, file creation, user session, foreground-window state, and capture-API
          data from a pilot-validated sensor. Sysmon process or file events alone do not prove a graphics grab or explain
          encrypted contents. The picker and yellow border documented for Windows.Graphics.Capture apply to that interface,
          not automatically to Attor's path. Without telemetry joining caller, target window, and pixel outcome, detection
          can report only a suspicious image chain or module behavior and cannot treat a window match as completed capture.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 目标窗口未命中时不产生截图结果，延迟可见采集链
    en: Withhold screenshot results before a target-window match, delaying the visible capture chain
  analysis:
    paragraphs:
    - zh: 攻击者将实际取像绑定到目标进程与前台窗口条件。Attor 的加密截图在命中后按十秒间隔出现，非命中时缺少这条结果链；只看截图文件的防守方难以把等待期与之后的采集连成同一行为。命中后的取像和产物仍可观察，检测率变化没有实测。此条件缺席机理与
        NJS-0132-001 属于同一窗口门控轴；本父级只补充证明显示像素已取得，不据此增加第二个子技术。
      en: The adversary binds actual pixel acquisition to a target-process and foreground-window condition. Attor produced
        encrypted screenshots at ten-second intervals after matches, leaving no corresponding outcome chain during nonmatches.
        A defender watching only image files may fail to connect the waiting period to later capture. Post-match capture and
        artifacts remain visible, and a change in detection rate was not measured. This absence-on-nonmatch mechanism is the
        same window-gating axis already owned by NJS-0132-001; this parent adds proof that display pixels were obtained, not
        another child.
  evidence_refs:
  - REF-000583
  - REF-000484
  confidence: low
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 屏幕捕获已有可证的条件性取像与连续取像对照，但“窗口状态决定后继截图何时出现”的可控变量及非命中时段缺席的痕迹差，已由 NJS-0132-001 规范拥有。T1113 父技术要求实际取得显示像素，其 DET/NJA 再核实条件命中后取像结果；增加这一结果条件不会创造第二项
        Niji 子技术。截图节奏、API 与文件格式也没有独立且足证的匿迹边界，因此当前不设子项。
      en: Evidence shows both conditional and continuous screen acquisition, but NJS-0132-001 already owns the controlled
        variable in which window state decides when later screenshots appear and their absence during nonmatches. The T1113
        parent requires actual display pixels, while its DET/NJA verifies capture after a match; adding that outcome condition
        does not create another Niji variable. Cadence, API, and file format lack separate sufficiently supported stealth
        boundaries, so the current taxonomy has no children.
  coverage: none-justified
  subtechnique_refs: []
