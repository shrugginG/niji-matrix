research:
  limitations:
    paragraphs:
    - zh: ESET 的 Attor 逆向分析证明条件匹配及其后的截图，但没有量化检出率；Bitdefender 的 FunnyDream 是持续抓屏与文件痕迹对照，Volexity 的 BLUELIGHT 只证明频率改变而非规避目的。条件门控造成非命中时段缺少截图，是根据代码和结果作出的低置信度观察推断，不得将其升级为实测告警下降。相同窗口变量已经由
        NJS-0132-001 记录，屏幕像素结果则由本父级承担。
      en: ESET reverse engineering proves Attor’s condition and later screenshots but does not measure detection rates. Bitdefender’s
        FunnyDream supplies a continuous capture and file-trace comparator; Volexity’s BLUELIGHT proves cadence change, not
        evasion intent. Absence of screenshots while a condition is false is a low-confidence observation inference from code
        and result, not a measured alert reduction. NJS-0132-001 already records the window variable, while this parent owns
        the acquired display pixels.
    - zh: 实际检测依赖经试点验证的图形与窗口传感器及可确认的像素产物。Sysmon 进程、模块和文件事件只提供谱系与产物线索，不能冒充截图 API 日志；Windows.Graphics.Capture 的选择器和边框也不能外推到 GDI
        或全部截图路径。macOS 屏幕授权界面不保证集中可导出逐次事件。合法远程支持、会议共享、无障碍和用户主动截图需按任务授权排除。
      en: Detection depends on pilot-validated graphics and window sensors plus verifiable pixel output. Sysmon process, module,
        and file events supply lineage and artifact leads, not screenshot-API logs. The Windows.Graphics.Capture picker and
        border do not generalize to GDI or every capture path. A macOS screen grant UI does not guarantee centrally exported
        per-capture events. Authorized remote support, meeting sharing, accessibility, and user screenshots require task-level
        exclusion.
