schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0159-001
parent_ref: NJT-0159
name:
  zh: 通话接口语境取帧
  en: Call-Interface-Context Frame Capture
summary:
  zh: 攻击者附着真实视频通话应用的媒体接口取得周期性画面，让未经授权的取帧伴随已登录通话及看似正常的授权流程。
  en: An adversary attaches to a real video-call app's media interface for periodic images, placing unauthorized frame capture
    alongside a signed-in call and apparently ordinary grant flow.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 通话接口语境取帧的可控变量是视频画面从已登录通话应用的媒体接口进入第三方组件，而非另起一个直接摄像头读取器。它要求证明接口附着、实际通话及帧取得的连接；通话应用仅运行、用户批准接口或恶意插件只具备录制能力都不足以完成子项。所得媒体可为周期性图片，不要求生成连续视频文件。
    en: 'Call-Interface-Context Frame Capture controls the entry point: visual call media pass from a signed-in call app''s
      interface into a third-party component rather than a separate direct camera reader. The child requires a link among
      interface attachment, an actual call, and acquired frames. A running app, an interface approval, or a plugin merely
      capable of recording is insufficient. Output may be periodic images rather than a continuous movie file.'
stealth_characteristics:
  paragraphs:
  - zh: 通话接口语境取帧使第三方视觉采集贴附在本来允许视频活动的会话中，普通“摄像头被使用”或“Skype 正在通话”信号因而不足以辨认偷录。T9000 仍触发明确的 Skype API 授权，用户必须允许；Unit 42 只指出提示中的正常进程可能误导用户。第三方附着动作、授予记录与通话后的图像产物仍提供独立观察面，本子项不声称关闭摄像头灯或绕开新的授权。
    en: Call-Interface-Context Frame Capture places third-party visual acquisition inside a session where video activity is
      already expected, making a bare camera-use or active-Skype signal insufficient to recognize unauthorized recording.
      T9000 still triggered an explicit Skype API grant that the user had to approve; Unit 42 only noted that the normal process
      in the prompt might mislead. Third-party attachment, grant records, and post-call image output remain independent observation
      surfaces. The child does not claim a disabled camera light or bypassed grant.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入经通话媒体接口取得参与者视频帧的恶意行为，排除只从桌面截图观察通话窗口、仅通过摄像头驱动直接拍照、只录通话音频和仅取得接口授权而未取帧。前两类分别归 T1113 或本父级直接设备路径，音频另归 T1123；许可、会后加密暂存和外传可另行标注。合法会议录制机器人、经授权的转写与录像插件、质检和远程支持是必要反例，须核对组件与业务审批。
    en: Include malicious acquisition of participant frames through a call-media interface. Exclude screenshots of a call
      window on the desktop, camera-driver photography without call-media attachment, audio-only recording, and interface
      approval without frames. The first paths belong to T1113 or this parent's direct-device route, and audio belongs to
      T1123; grant, later encrypted staging, and egress may be labeled separately. Authorized meeting recorders, transcription
      or video plugins, quality assurance, and remote support are necessary comparators requiring requester and business-approval
      checks.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Unit 42 对 T9000 的逆向报告显示，插件只在 Skype 运行且用户已登录后调用 SkypeControlAPIDiscover 和 SkypeControlAPIAttach。用户许可后它录制视频通话，临时视频放在应用数据路径的视频子目录；会后文件被压缩加密，解密结果是周期性通话图像。该例证明旧
        Skype 接口上的实际取帧与授权语境，不意味着今天所有会议产品仍开放相同接口。
      en: Unit 42's reverse engineering reports that T9000 called SkypeControlAPIDiscover and SkypeControlAPIAttach only after
        Skype was running and the user signed in. Following approval it recorded video calls, used a video subdirectory under
        application data for temporary output, and compressed and encrypted files after calls; decrypted output showed periodic
        call images. This proves actual frame capture and a grant context on an older Skype interface, not equivalent interfaces
        in current meeting products.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能在终端运行附着组件，等待目标通话应用登录，并诱使用户或管理员许可第三方媒体接口。攻击者可控制附着请求与产物处理，却不能跳过该旧接口的用户批准条件；若平台禁用第三方媒体读取或明确展示请求者身份，该路径受阻。视频通话可包含对方画面，本子项不要求本地摄像头被再次打开。
        en: The adversary needs a runnable attachment component, a signed-in target call app, and a user or administrator
          grant for the third-party media interface. The adversary controls attachment request and output handling but cannot
          skip the older interface's approval condition. A platform that disables third-party media reads or clearly identifies
          the requester constrains the path. Call frames can contain a remote participant, so this child does not require
          a fresh local camera open.
    defender_model:
      paragraphs:
      - zh: 防守方若能取得接口授权、请求组件标识、通话会话以及端点文件事件，可将“有人开会”与“第三方提取画面”拆开。仅有摄像头使用日志会遗漏远端参与者媒体接口取帧；仅有文件后缀又无法区分通话帧与桌面截图。若现代客户端不导出接口事件，应降级为文件与模块的调查线索，而非自动声称已识别该子项。
        en: Interface grants, requester identity, call sessions, and endpoint file events allow defenders to separate a real
          meeting from third-party frame extraction. Camera-use logs alone can miss media-interface capture of a remote participant,
          while extensions cannot distinguish call frames from desktop screenshots. If a current client exports no interface
          events, detection degrades to file and module investigation rather than a conclusive automated classification.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 将取帧入口置于已登录通话的正常授权语境
    en: Place frame acquisition in the normal grant context of a signed-in call
  analysis:
    paragraphs:
    - zh: T9000 的组件经已登录 Skype 的控制接口进入通话媒体，在用户可见的正常进程授权提示后取得视频帧。这把恶意取帧的时间、应用名称及输出背景与正常会议重叠，单凭通话存在无法确认授权采集；防守需用请求组件、批准事件和视频子目录产物恢复真正采集者。Unit
        42 证实行为和可能的误判，未测量防守告警减少。
      en: T9000's component entered call media through a signed-in Skype control interface and acquired video frames after
        a prompt associated with an apparently ordinary process. Timing, app name, and output context thus overlap a normal
        meeting, so call existence alone does not establish authorized capture. Defenders must recover the actual collector
        through requester identity, grant event, and video-directory output. Unit 42 establishes the behavior and possible
        confusion, not a measured reduction in defender alerts.
