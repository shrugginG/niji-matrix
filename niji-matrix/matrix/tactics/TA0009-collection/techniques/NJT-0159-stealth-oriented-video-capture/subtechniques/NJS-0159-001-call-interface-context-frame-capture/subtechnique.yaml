research:
  limitations:
    paragraphs:
    - zh: 该子项的结论级实例仅是旧 Skype API 的 T9000，尚无证据表明现代会议应用保留相同接口或提示。报告直接展示周期性视频画面，但没有给出可迁移的接口日志架构、帧提取频率阈值或成功误导率；正式检测必须针对实际产品试点验证日志字段，并保留用户明示许可这一事实。
      en: The conclusion-level example is T9000 on an older Skype API; there is no evidence that current meeting apps retain
        the same interface or prompt. The report directly shows periodic video images but supplies no portable interface-audit
        schema, frame-rate threshold, or deception success rate. A formal detector must validate fields on each real product
        and retain the fact of explicit user approval.
