schema_version: 2.0.0
type: technique
id: NJT-0159
name:
  zh: 匿迹型视频捕获
  en: Stealth-Oriented Video Capture
summary:
  zh: 攻击者取得摄像头或视频通话帧，并安排采集落在可信通话或设备使用语境中，使单看应用身份、摄像头指示或文件类型难以辨认未经授权的视觉记录。
  en: An adversary obtains camera or video-call frames while placing capture in a trusted call or device-use context, so app
    identity, camera indication, or file type alone poorly distinguishes unauthorized visual recording.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1125
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1125
definition_and_concept:
  paragraphs:
  - zh: 匿迹型视频捕获指攻击者在已有端点或通话应用访问能力后，从摄像头、视频通话媒体或同等视频输入取得一帧、多帧或连续序列，并有意利用采集入口与正常使用的关系削弱防守归因。判断核心是视觉媒体是否实际进入攻击者可控制的记录链；摄像头可用、授权已授予、插件已装入和后续文件加密只是不同层级的事实，均不能单独证明这一取得结果。
    en: Stealth-Oriented Video Capture occurs after an adversary gains endpoint or call-app access and obtains one frame,
      repeated frames, or a continuous sequence from a camera, video-call media, or equivalent video input. The adversary
      deliberately exploits the relationship between capture entry point and expected use to weaken attribution. The core
      question is whether visual media actually enters an attacker-controlled recording path; camera availability, an existing
      grant, a loaded plugin, and later file encryption are separate facts that do not individually prove acquisition.
  - zh: 该概念以输入来源而非文件容器划界。周期性保存的通话画面仍是视频输入的取得，屏幕录制保存为 AVI 仍可能只属于屏幕捕获。T9000 同时具备桌面截图和视频通话画面采集，必须依据报告中不同线程、接口调用和结果文件把两者拆开；任何“会开摄像头”的工具功能列表也应与实际执行和产物分开记录。
    en: This concept is bounded by input source, not output container. Periodically saved call images are still acquisition
      from a video input, whereas a desktop recording saved as AVI may remain screen capture. T9000 had both desktop-screenshot
      and video-call capture functionality; its different threads, interface calls, and artifacts must keep the conclusions
      separate. A tool feature list saying it can open a camera must likewise be separated from observed execution and output.
stealth_characteristics:
  paragraphs:
  - zh: 恶意组件若从正常视频通话接口取得帧，时间和对象会贴近用户确在使用的通话。T9000 的 Skype 接口请求仍弹出许可提示，但 Unit 42 指出提示中看似正常的进程可能使用户错误批准；会话本身并不证明第三方记录获得业务授权。残余线索包括接口发现和附着、批准主体、通话时段、视频子目录中的临时文件及会后加密产物。
    en: When a malicious component takes frames through an ordinary video-call interface, timing and content align with a
      call the user is actually conducting. T9000 still presented a Skype API approval prompt, yet Unit 42 noted that an apparently
      legitimate process in the prompt could induce a mistaken approval. The call itself does not authorize third-party recording.
      Interface discovery and attachment, the granting actor, call timing, temporary video files, and encrypted post-call
      output remain residual traces.
  - zh: 直接打开摄像头的恶意程序通常会增加设备会话，并可能触发摄像头灯或系统指示；若只看文件扩展名或可执行文件名，防守方也可能漏掉 webcam 照片。InvisiMole 的内部类型表把 webcam 照片与屏幕截图分别标注，说明两类来源可留下不同产物；该报告没有证明摄像头指示被隐藏或拍照节奏本身降低告警。本父级不把“设备可访问”写成无痕采集。
    en: Malware opening a camera directly usually adds a device session and can trigger a camera light or system indicator;
      a defender relying only on extensions or executable names can also miss webcam photos. InvisiMole's internal type table
      separately identifies webcam photos and screen screenshots, showing distinguishable outputs from the two sources. That
      report does not show a hidden camera indicator or reduced alerting from capture cadence. This parent does not equate
      device access with traceless capture.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入已证实从摄像头取得画面，或经视频通话应用的媒体接口取得参与者画面，即使最终只有间隔图片。排除只采集显示器、远程支持共享屏幕、应用窗口缩略图和屏幕录制的路径，它们由 T1113 处理。T1123 只覆盖同一通话的声音；语音与视频必须分别具备输入及产物证据。打开设备权限、劫持应用进程和说服用户批准接口可作为先决或伴随行为，但不是本技术的完成条件。
    en: Include proven acquisition of camera imagery or participant imagery through a video-call media interface, even if
      output consists only of interval images. Exclude display capture, shared screens in remote support, application-window
      thumbnails, and desktop recordings; T1113 owns those paths. T1123 covers sound from the same call only when separate
      input and outcome evidence exists. Opening device permissions, subverting a host process, and inducing interface approval
      can be prerequisites or accompanying acts, not completion of this technique.
  - zh: 视频帧被集中暂存、压缩、加密或外传可以另行标注 T1074、T1560 或后续战术，不能反推画面来源。正常会议录制、授权视频质检、远程技术支持和无障碍图像处理会产生类似会话和文件；仅有绿色摄像头指示、一次接口授权或 MOV、JPG
      文件均不足以判恶。应结合发起组件身份、会议业务目的、参与者同意、产物去向和批准记录。
    en: Central staging, compression, encryption, or egress of frames may receive T1074, T1560, or later-tactic labels but
      cannot establish the frame source retrospectively. Authorized meeting recording, video quality assurance, remote technical
      support, and accessibility image processing can produce similar sessions and files. A green camera indicator, one interface
      grant, or a MOV or JPG file alone does not prove malicious capture. Join requester identity, meeting purpose, participant
      consent, output destination, and approval records.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在已登录的视频通话客户端上，T9000 插件先调用 Skype 的发现与附着接口，用户批准后记录通话媒体；Unit 42 对解密数据确认视频画面以周期性图像形式取得。此场景的匿迹约束是攻击者必须等到应用和会话可用，并让采集伴随真实通信需求。另一类直接设备取得可由
        InvisiMole 的 webcam 照片内部类型证明，但其文件加密和删除属于后续产物处理，不应自动作为视频采集子项。
      en: In a signed-in video-call client, T9000 called Skype discovery and attachment interfaces, then recorded call media
        after user approval. Unit 42 confirmed that decrypted video output contained periodically taken call images. This
        path depends on an available app and session, placing acquisition alongside real communication activity. InvisiMole's
        webcam-photo internal type shows a separate direct-device acquisition route, but its file encryption and deletion
        are later artifact handling and do not automatically create a video-capture child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少须能运行读取摄像头或附着通信应用接口的组件，并有权限接触目标输入。T9000 路径要求 Skype 正在运行、目标已登录且用户许可接口访问；攻击者能选择请求时机和媒体保存位置，却不能假定所有视频平台提供同类接口。经受信进程继承相机授权是实验所证技术可能性，若用于正式行为结论仍须有目标平台版本和现场执行证据。
        en: The attacker needs runnable code able to read a camera or attach to a communication-app interface and authorization
          to reach the input. T9000 required Skype to be running and signed in, plus user approval for API access. The attacker
          could choose request timing and output location but cannot assume every video platform exposes a similar interface.
          Inheriting a trusted process's camera grant is demonstrated experimentally, yet a formal behavioral claim still
          needs the relevant platform version and observed execution.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有进程及模块来源、摄像头会话、应用接口授权、通话时间、文件创建和文件内容类型等数据，但这些数据通常分散在端点、应用与用户界面。Windows 可向用户显示摄像头灯或启动通知，并保留有限使用历史；macOS 对应用访问摄像头要求授权且显示使用指示。这些用户界面并不保证可导出逐事件企业日志；正式检测须先验证传感器确能给出用户、进程、会话和时间键。
        en: Defenders may have process and module provenance, camera sessions, app-interface grants, call timing, file creation,
          and media-type evidence, but these often sit across endpoint, application, and user-interface surfaces. Windows
          may show a camera light or activation notice and limited usage history; macOS requires app authorization and shows
          use indication. Those user interfaces do not guarantee event-level enterprise exports. A deployable detector must
          first verify that its sensors supply user, process, session, and time keys.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用正常视频通话的应用与授权语境掩盖第三方取帧
    en: Borrow a normal video-call app and grant context to disguise third-party frame capture
  analysis:
    paragraphs:
    - zh: 恶意组件经已登录通话应用的媒体接口附着，取得视频帧时会话和请求提示仍带有正常通话应用的外观。若审查只看“通话正在进行”或提示的进程名，真实第三方采集者可能被混同于业务通话；这正是 T9000 中 Unit 42 指出的用户误判风险。接口授权、请求组件、视频子目录和解密后的周期性帧仍可恢复因果链；该来源支持误导可能和真实录制，不支持实测告警下降或无提示绕过。
      en: A malicious component attaches through a signed-in call app's media interface, so the session and grant prompt retain
        an ordinary call-app appearance while frames are taken. Reviewing only the fact that a call exists or the process
        name in a prompt can conflate the third-party collector with the business call, matching the user-confusion risk identified
        by Unit 42 for T9000. Interface grant, requester component, video directory, and decrypted periodic frames preserve
        a causal trail. The source supports possible confusion and actual capture, not a measured alert reduction or silent
        bypass.
  confidence: medium
  evidence_refs:
  - REF-000584
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 通话接口语境取帧是当前唯一成立的原生子项：第三方视觉采集借真实通话应用的媒体授权和会话承载，防守需联查请求者、授予、视频会话及帧产物。独立打开摄像头是父级对照；既有摄像头会话寄生与受信会议进程权限继承目前只有研究演示，不能当作野外子项。OS、摄像头品牌、接口名称、图片后缀或视频文件格式都不是稳定分类基础。
      en: 'Call-Interface-Context Frame Capture is the sole established native child: third-party visual acquisition rides
        a real call app media grant and session, requiring a join across requester, grant, video session, and frame output.
        Direct camera opening is a parent comparator. Piggybacking on an existing camera session and inheriting a trusted
        meeting process grant remain research demonstrations rather than field children. OS, camera brand, interface name,
        image extension, and movie-file format are not stable partitions.'
  coverage: established
  subtechnique_refs:
  - NJS-0159-001
