research:
  limitations:
    paragraphs:
    - zh: Unit 42 对 T9000 的视频事实来自逆向与解密产物观察，旧 Skype API 不能代表现行会议客户端。用户必须批准接口请求；报告只说正常进程提示可能误导，不证明无提示绕过或告警下降。InvisiMole 的类型表区分
        webcam 照片与屏幕截图，但不证明每次执行均有视频结果。既有摄像头会话寄生和 Zoom 权限继承是实验演示，应留在待证范围。
      en: Unit 42’s T9000 video facts come from reverse engineering and decrypted output, but the old Skype API does not represent
        current meeting clients. The user had to approve interface access; the report describes possible prompt confusion,
        not silent bypass or fewer alerts. InvisiMole’s type table separates webcam photos from screen screenshots without
        proving a video result on every execution. Existing-camera-session piggybacking and Zoom grant inheritance are research
        demonstrations and remain unadmitted.
    - zh: Windows 与 Apple 文档说明用户可见的相机许可、指示与控制能力，不保证端点或会议产品能导出设备会话、接口请求者、视频模态和帧内容键。缺失这些数据时只能形成设备访问或授权暴露线索。合法会议录制、远程支持、质检和用户拍照也可产生相同外观，不能由摄像头灯、文件扩展名或批准点击单独断言恶意采集。
      en: Windows and Apple documents describe user-visible camera grants, indicators, and controls, not guaranteed exports
        of device session, interface requester, video modality, or frame-content keys. Without those data, only device-access
        or grant-exposure leads are justified. Authorized meeting recording, remote support, quality assurance, and user photography
        can look alike; a camera light, file extension, or approval click alone cannot establish malicious capture.
