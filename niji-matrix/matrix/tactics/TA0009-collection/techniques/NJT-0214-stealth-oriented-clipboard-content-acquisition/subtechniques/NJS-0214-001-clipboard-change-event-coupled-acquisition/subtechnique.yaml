research:
  limitations:
    paragraphs:
    - zh: NightshadeC2 提供一个现场关联的 Windows 样本和完整结果链，却没有公开比较事件监听与轮询实现的告警率；时空释痕结论来自已证调用结构与防守模型。不同 Windows 版本、终端产品和内存取证工具对 listener、窗口与
        API 的可见性不同。正常剪贴板管理器与安全产品会产生相同通知和读取，缺少软件来源、业务 owner 与内容去向时，本子项只能作为待调查行为，不能直接判恶。
      en: NightshadeC2 provides one incident-linked Windows sample and a complete outcome chain but publishes no alert-rate
        comparison between event-listener and polling implementations. The spatiotemporal-trace conclusion follows from the
        established call structure and defender model. Listener, window, and API visibility differs by Windows version, endpoint
        product, and memory-forensic tooling. Legitimate clipboard managers and security products generate the same notifications
        and reads. Without software provenance, business owner, and content destination, this child is investigative behavior
        rather than a malicious verdict.
