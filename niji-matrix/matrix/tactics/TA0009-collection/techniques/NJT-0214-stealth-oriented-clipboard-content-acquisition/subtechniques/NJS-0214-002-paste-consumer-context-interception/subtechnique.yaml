research:
  limitations:
    paragraphs:
    - zh: QBot 来源提供动态实验、明确内容和后继处理，但只覆盖一个 Windows 家族及其 2020 年样本。GetClipboardData hook 与 TranslateMessage hook 同时存在，来源没有量化单独剪贴板介入对告警率的影响。不同编译器、应用更新、EDR、自保护、合法
        DLP 和辅助功能会改变函数入口与调用栈；没有内容结果时不得从注入或 hook 能力推断已完成本子项。
      en: The QBot source supplies a dynamic experiment, explicit content, and downstream handling but covers one Windows
        family and its 2020 sample. GetClipboardData and TranslateMessage hooks coexist, and the source does not quantify
        the independent alert-rate effect of clipboard interposition. Compilers, application updates, EDR, self-protection,
        legitimate DLP, and accessibility change function entries and call stacks. Without a content outcome, injection or
        hook capability cannot establish completion of this child.
