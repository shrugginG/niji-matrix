research:
  limitations:
    paragraphs:
    - zh: 结论级恶意样本主要来自 Windows。NightshadeC2 证明变化事件驱动的实际内容、日志和上传，QBot 证明消费者进程内 hook、内容和传输，但两份来源都没有量化检测率、阈值或与替代实现的告警对照。NM-ST
        与 NM-FD 的防守影响因此采用 medium 置信度，不能把“使用原生 API”“隐藏窗口”或“运行在合法进程”单独描述成匿迹成功。其他家族只证明一般能力时不应扩展到子项案例。
      en: Conclusion-level malicious samples are primarily Windows-based. NightshadeC2 establishes change-event-driven content,
        logging, and upload, while QBot establishes an in-consumer hook, content, and transfer. Neither source measures detection
        rates, thresholds, or alert differences against an alternative implementation. Defensive effects for NM-ST and NM-FD
        therefore carry medium confidence. Use of a native API, a hidden window, or execution in a legitimate process cannot
        alone be described as successful stealth. Other families that prove only general capability should not be expanded
        into child cases.
    - zh: 平台文档说明 Windows listener/viewer、macOS changeCount、X11 selection 与 Wayland data offer 的数据前提，却不保证统一、默认且可集中导出的逐次读取审计。Cortex
        XDR 只证明某一产品可以观察异常 GetClipboardData 调用。正式分析必须在部署环境验证 API、窗口、调用栈、返回状态和对象键；否则输出降级为 listener、hook 或后继文件线索。明文剪贴板遥测具有显著隐私与凭据风险，应优先使用端点生成的短期不可逆
        token、sequence、大小和目的地元数据。
      en: Platform documentation establishes Windows listener and viewer, macOS changeCount, X11 selection, and Wayland data-offer
        prerequisites but does not guarantee a uniform, default, centrally exportable event for each read. Cortex XDR only
        establishes that one product can observe unusual GetClipboardData calls. Formal analytics must validate API, window,
        call-stack, return-status, and object-key fields in the deployment environment or downgrade output to listener, hook,
        or downstream-file leads. Plaintext clipboard telemetry creates substantial privacy and credential risk and should
        be replaced where possible by endpoint-generated short-lived irreversible tokens, sequence, size, and destination
        metadata.
    - zh: autofill、DLP、短清理、history/cloud 排除与 RDP 重定向限制降低暴露或传播，却不能阻止清理前同会话的实时读取，也可能影响可用性和无障碍。合法剪贴板历史、密码管理器、DLP、远程支持、虚拟化和自动化与恶意行为共享接口，必须按精确版本、owner、会话、目的地和变更窗口调优。消费者介入还需最小化跨进程写入和调试权，并约束动态代码、模块来源与回调完整性；单靠减少剪贴板暴露不能覆盖进程内
        hook。
      en: Autofill, DLP, short clearing, history or cloud exclusion, and RDP-redirection restrictions reduce exposure or propagation
        but do not stop real-time reads in the same session before clearing and may affect usability and accessibility. Legitimate
        clipboard history, password managers, DLP, remote support, virtualization, and automation share interfaces with malicious
        behavior and require tuning by exact version, owner, session, destination, and change window. Consumer interposition
        also requires least cross-process write and debug rights plus dynamic-code, module-provenance, and callback integrity
        controls; reducing clipboard exposure alone does not cover in-process hooks.
