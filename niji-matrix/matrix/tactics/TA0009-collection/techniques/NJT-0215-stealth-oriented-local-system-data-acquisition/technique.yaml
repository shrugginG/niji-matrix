research:
  limitations:
    paragraphs:
    - zh: T1005 来源页能锚定广泛的本地内容获取行为，却不能证明任一读取天然匿迹。TajMahal 与 CookieMiner 是代码或模块能力分析，缺少派生对象已向攻击者返回内容的受害端证据。因此父级结论为 medium，派生视图假设与相应
        NM-BT 机理只有 low；当前不把派生视图列为正式子技术。
      en: The T1005 source page anchors broad local-content acquisition but does not make every read stealthy. TajMahal and
        CookieMiner are code or module capability analyses without victim-side evidence that a derivative object returned
        content to an adversary. The parent conclusion is therefore medium confidence, while the derivative-view hypothesis
        and associated NM-BT mechanism are low; the derivative view is not a formal child at present.
    - zh: 文件读取遥测依赖平台与配置。4663 需要匹配 SACL，备份/恢复权限审计可能造成极高事件量，Print 307 不保证 spool 路径映射，EDR 文件表不等于完整读取记录，macOS 本地备份也缺少可在本稿中验证的等价审计字段。正式
        Analytic 必须先在目标环境验证字段、事件量、时间同步、对象键和保留期。
      en: File-read telemetry depends on platform and configuration. Event 4663 needs a matching SACL, backup and restore
        privilege auditing can create very high volume, Print 307 does not guarantee spool-path mapping, an EDR file table
        is not a universal read record, and an equivalent validated audit field set for macOS local backups was not established
        here. A formal analytic must first validate fields, volume, time synchronization, object keys, and retention in the
        target environment.
    - zh: 正常备份、索引、打印、EDR、反恶意软件、管理员支持、迁移、电子发现和取证与候选行为高度同形。签名进程或熟悉服务身份不能单独作为永久放行条件；精度依赖主体、作业、目标范围、产生者—消费者关系和结果去向。内容验证应使用隔离解析与摘要，避免把敏感原文写入检测日志。
      en: Normal backup, indexing, printing, EDR, antimalware, administrator support, migration, e-discovery, and forensics
        closely resemble the candidate behavior. A signed process or familiar service identity cannot be a permanent allowance
        by itself; precision depends on principal, job, target scope, producer-consumer relationship, and output destination.
        Content validation should use isolated parsing and protected digests rather than logging sensitive plaintext.
