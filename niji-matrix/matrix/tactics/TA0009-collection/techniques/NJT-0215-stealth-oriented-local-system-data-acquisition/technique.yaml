schema_version: 2.0.0
type: technique
id: NJT-0215
name:
  zh: 匿迹型本地内容获取
  en: Stealth-Oriented Local Content Acquisition
summary:
  zh: 攻击者从已控制主机实际取得本地内容，并通过选择读取视图或接口改变源侧痕迹；文件发现、内容结果和后继暂存必须分别验证。
  en: An adversary actually acquires local content from an accessed host and changes source-side traces by choosing a read
    view or interface; file discovery, content outcome, and later staging require separate proof.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1005
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1005
definition_and_concept:
  paragraphs:
  - zh: 匿迹型本地内容获取是攻击者在已经能够访问的终端、服务器、虚拟化主机或网络设备上，从本地持久存储、应用数据、文件级副本或可读进程内容中取得能服务于后续行动的信息，并有意选择使读取范围、主体或观察位置发生变化的获取路径。其直接目标是让内容进入攻击者可处理的上下文；文件名、元数据、存在性、ACL
      或可读句柄只能证明候选和能力，除非来源进一步证明内容字节、可验证记录或等价结果已被取得。
    en: Stealth-Oriented Local Content Acquisition occurs when an adversary on an already accessible endpoint, server, virtualization
      host, or network device obtains information from local persistent storage, application data, file-level copies, or readable
      process content for later operations, while deliberately choosing an acquisition path that changes read scope, subject,
      or observation location. Its direct objective is to place content in an attacker-usable context. A filename, metadata,
      existence, ACL, or readable handle establishes only a candidate and capability unless the source further proves content
      bytes, validated records, or an equivalent result were obtained.
  - zh: “本地”描述内容在获取时由受控主机承载，不按 Windows、Linux、macOS、数据库产品、文件格式或目录分类。一次人工读取、脚本复制、应用导出或经文件级副本恢复都可落入父级，但必须分别证明相应匿迹变量。权限取得、目录发现、自动化轮次、内容暂存、归档转换和外传是可以同现的相邻阶段，不因同一程序同时完成而被本技术吞并。
    en: Local describes content hosted by the accessed machine at acquisition time and does not partition by Windows, Linux,
      macOS, database product, file format, or directory. A manual read, scripted copy, application export, or recovery from
      a file-level copy may fall within the parent, but the corresponding stealth variable must be established separately.
      Authority acquisition, directory discovery, automated passes, content staging, archive transformation, and exfiltration
      are adjacent stages that may coexist and are not absorbed merely because one program performs them together.
stealth_characteristics:
  paragraphs:
  - zh: 攻击者若从应用已经生成的派生副本、打印队列或文件级备份取得内容，规范源应用可能没有本次逐对象读取事件，当前文件访问则出现在通常由打印、恢复、索引或同步组件接触的位置。只监测原目录、原数据库事务或短窗批量读取的防守方可能低估内容接触；派生对象的创建者、路径、读取进程、主体会话和后继输出仍留下可关联痕迹。
    en: When an adversary obtains content from an application-produced derivative copy, print queue, or file-level backup,
      the canonical source application may have no current per-object read event while the present access appears in a location
      routinely approached by printing, recovery, indexing, or synchronization components. A defender watching only the original
      directory, canonical database transaction, or short-window bulk reads may undercount content contact. The derivative
      object's producer, path, reader process, subject session, and successor output remain correlatable traces.
  - zh: 直接读取一般本地文件并不天然匿迹；Windows 4663 只有在目标对象存在匹配 SACL 且启用文件系统审计时才记录实际使用的访问权，EDR 文件事件也不保证覆盖读取。完整监测若同时保存敏感源清单、派生对象 manifest、进程谱系、读取访问与输出去向，可以恢复观察差。派生副本已加密、保留时间短或访问范围受限时会降低攻击可行性；宽泛备份权限、长期明文副本和仅按进程名放行会放大盲区。
    en: Ordinary direct reads of local files are not inherently stealthy. Windows 4663 records exercised access only when
      the target has a matching SACL and file-system auditing is enabled, and EDR file events do not guarantee read coverage.
      Complete monitoring that retains a sensitive-source inventory, derivative-object manifests, process lineage, read access,
      and output destinations can reconstruct the observation difference. Encrypted or short-lived derivative copies and narrow
      access scope reduce feasibility, while broad backup authority, long-lived plaintext copies, and process-name-only allowances
      enlarge the blind spot.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求同时说明受控主机、本地内容对象、成功读取结果，以及攻击者控制的读取视图或接口如何改变可见痕迹。T1083/NJT-0182 负责文件与目录发现，T1119/NJT-0135 负责跨轮自动获取与检查点，T1213/NJT-0143
      负责信息库内查询选择，T1074/NJT-0134 负责取得后的汇聚暂存，T1560/NJT-0133 负责归档转换。读取网络共享、云对象、邮件、配置存储库、剪贴板或可移动介质时，分别交给其数据来源父技术。
    en: Inclusion requires an accessed host, a local content object, a successful read result, and an attacker-controlled
      read view or interface whose effect on visible traces can be explained. T1083/NJT-0182 owns file and directory discovery;
      T1119/NJT-0135 owns cross-pass automation and checkpoints; T1213/NJT-0143 owns query selection inside information repositories;
      T1074/NJT-0134 owns aggregation and staging after acquisition; and T1560/NJT-0133 owns archive transformation. Reads
      from network shares, cloud objects, mail, configuration repositories, clipboards, or removable media belong to their
      respective source parents.
  - zh: 浏览器凭据、口令库、认证数据库、token 与会话材料按 T1555、NJT-0147、NJT-0177 或其他凭据对象判定，不能因其文件位于本机而重复计入。卷影、原始卷、块设备或不经普通文件命名空间的读取属于 NJT-0108；若只体现既有集成身份、备份服务身份或受信进程控制权变化，应交给
      NJT-0086、进程上下文或权限对象。合法备份、索引、EDR、反恶意软件、打印、迁移、电子发现、取证和管理员支持都是重要反例，必须按身份、签名、目标范围、工单、时间与结果去向排除。
    en: Browser credentials, password stores, authentication databases, tokens, and session material are classified under
      T1555, NJT-0147, NJT-0177, or another credential object and are not duplicated merely because their files are local.
      Shadow copies, raw volumes, block devices, and reads outside the ordinary file namespace belong to NJT-0108. If the
      only variable is control of an existing integration identity, backup-service identity, or trusted process, ownership
      returns to NJT-0086, a process-context object, or an authority object. Legitimate backup, indexing, EDR, antimalware,
      printing, migration, e-discovery, forensics, and administrator support are material counterexamples that must be excluded
      by identity, signer, target scope, ticket, time, and output destination.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 入侵者在员工终端上需要文档、业务记录或移动设备内容时，可以直接读取原文件，也可能优先使用已存在的应用派生物。Kaspersky 对 TajMahal 的分析发现其具备从打印队列窃取文档和建立主机文件索引的模块；Unit 42
        对 CookieMiner 的代码分析表明它尝试从连接 Mac 的 iTunes 本地备份取得 iPhone 短信。两份来源证明能力设计，均未证明相关模块在已确认受害环境中成功返回了具体内容。
      en: An intruder seeking documents, business records, or mobile-device content on an employee endpoint may read originals
        directly or prefer an existing application derivative. Kaspersky's TajMahal analysis found modules capable of stealing
        print-queue documents and building a host file index. Unit 42's CookieMiner code analysis shows an attempt to obtain
        iPhone text messages from an iTunes local backup on the tethered Mac. Both sources establish capability design, but
        neither proves that the relevant module successfully returned specific content in a confirmed victim environment.
    - zh: 管理员权限或服务账户也可能允许攻击者调用备份语义、应用导出或本地数据库接口读取受保护内容。只有单次命令、成功句柄或工具存在时应保持在能力层；取得的文件、副本、记录集合或独立取证验证才能支持 Collection 结果。若收集按修改时间跨轮持续进行，同时标注
        NJT-0135；若输出先集中到隐藏目录，再标注 NJT-0134，而不改变本父级对源读取的判断。
      en: Administrator authority or a service identity may also let an adversary invoke backup semantics, an application
        export, or a local database interface to read protected content. A command, successful handle, or tool presence alone
        remains capability-level evidence; an acquired file, copy, record set, or independent forensic validation is needed
        to support a Collection result. If acquisition continues across passes by modification time, NJT-0135 may also apply.
        If output is concentrated into a concealed directory, NJT-0134 may also apply without changing this parent's source-read
        judgment.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要在目标主机上执行读取逻辑，或控制能代表其完成读取的本地应用、服务或账户，并具备目标路径、应用格式或派生对象布局知识。派生视图方式还要求目标内容此前被打印、同步、备份、缓存或导出，且副本仍存在并可解密；它可能比直接读取更陈旧、不完整，也可能缺少规范源的最新变更。
        en: The adversary needs to execute read logic on the target host or control a local application, service, or account
          that can read on its behalf, together with knowledge of target paths, application formats, or derivative-object
          layout. A derivative-view path additionally requires that the target content was previously printed, synchronized,
          backed up, cached, or exported and that the copy still exists and can be decrypted. It may be staler or less complete
          than a direct read and may omit recent changes to the canonical source.
      - zh: 备份语义可能要求 SeBackupPrivilege 或等价平台权限，受信应用读取可能要求进程注入、插件控制或已解锁会话，文件级副本可能受独立密钥保护。攻击者若无法把可见读取与内容结果对应，或只取得损坏、加密且不可恢复的对象，则不能把准备能力升级为完成的本地内容获取。
        en: Backup semantics may require SeBackupPrivilege or equivalent platform authority; trusted-application reads may
          require process injection, plug-in control, or an unlocked session; and file-level copies may be protected by a
          separate key. If the adversary cannot connect a visible read to a content result, or obtains only a corrupt or unrecoverable
          encrypted object, preparatory capability cannot be promoted to completed local-content acquisition.
    defender_model:
      paragraphs:
      - zh: 防守方需要预先标记高价值本地源及派生存储，针对性启用成功 ReadData 审计，并保存主体 SID、LogonId、对象路径、AccessMask、进程 ID/映像、进程启动与父子关系。输出文件创建、临时目录写入和网络去向用于验证内容进入后继处理链；目录列举或
          ReadAttributes 不应被误写为内容读取。没有目标 SACL 时，Windows 4663 的缺席不能证明文件未被访问。
        en: Defenders need an inventory of high-value local sources and derivative stores, targeted successful ReadData auditing,
          and retained subject SID, LogonId, object path, AccessMask, process ID or image, process start, and parent-child
          lineage. Output-file creation, temporary-directory writes, and network destinations help establish that content
          entered a successor processing chain. Directory enumeration or ReadAttributes must not be mislabeled as content
          reads. Without a target SACL, the absence of Windows 4663 does not prove that a file was untouched.
      - zh: 对派生视图，防守方还需保存生成它的控制面或 manifest，例如打印文档、用户、客户端、打印机、大小与页数，或备份作业、来源范围、服务身份、完成时间与保留期。关联键不足时只能报告“未批准进程读取了派生存储”，不能断言读取了某一规范源内容。备份、索引、反恶意软件和
          EDR 具有高读取量及宽权限，例外必须绑定准确的身份、签名、作业、路径范围和有效期，不能永久按进程名信任。
        en: For derivative views, defenders also need the control-plane record or manifest that produced them, such as print
          document, user, client, printer, size, and page count, or backup job, source scope, service identity, completion
          time, and retention. When correlation keys are insufficient, the conclusion is limited to an unapproved process
          reading a derivative store, not that a particular canonical source was read. Backup, indexing, antimalware, and
          EDR perform broad high-volume reads; exceptions must bind exact identity, signer, job, path scope, and validity
          rather than permanently trusting a process name.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 派生存储把当前内容读取移出规范源观察面
    en: Derivative storage moves the current content read outside canonical-source observation
  analysis:
    paragraphs:
    - zh: 正常打印、备份、同步或应用处理先生成一个可读派生对象，攻击者随后从该对象取得内容，使当前读取不必再次经过规范应用的逐对象接口。源应用审计与原目录规则因而可能只看到较早的正常生成过程，关键读事件转移到常被忽略的队列或副本路径；派生对象的生成
        manifest、成功 ReadData、读取进程与后继输出仍可重建这条链。TajMahal 与 CookieMiner 报告证明这种能力存在，但没有测量告警规避或证明受害环境中的内容结果，因此机理保持低置信度。
      en: Normal printing, backup, synchronization, or application processing first creates a readable derivative object,
        which an adversary later uses to obtain content without another per-object call through the canonical application.
        Source-application audit and original-directory rules may therefore show only the earlier legitimate production step
        while the critical read moves to an overlooked queue or copy path. The derivative manifest, successful ReadData access,
        reader process, and successor output can still reconstruct the chain. TajMahal and CookieMiner reporting establishes
        the capability, but measures neither alert evasion nor a victim-side content result, so the mechanism remains low
        confidence.
  confidence: low
  evidence_refs:
  - REF-001077
  - REF-001078
  - REF-001083
  - REF-000379
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 暂建议一项 Niji 原生子项，以“当前内容是否从正常流程先前生成的本地派生视图取得”为稳定变量。变量改变当前读取所在对象和审计面，横跨打印队列、文件级本地备份和应用派生副本；产品、扩展名、目录、备份厂商、数据库类型和读取工具均不是分类边界。卷影、原始卷或块视图不纳入此项，交还
        NJT-0108。
      en: One Niji-native child is proposed conditionally, keyed to whether current content is obtained from a local derivative
        view produced earlier by a normal workflow. The variable changes the object and audit plane of the current read across
        print queues, file-level local backups, and application-derived copies. Product, extension, directory, backup vendor,
        database type, and reader tool do not define the boundary. Shadow, raw-volume, and block views are excluded and returned
        to NJT-0108.
    - zh: ATT&CK 19.1 对 T1005 没有子技术，因此不存在外部子项导入。开放检索仍审查了路径/内容选择、低频、事件触发、既有身份、备份语义、快照和替代接口；前四项分别因缺少稳定痕迹差或已由 NJT-0143、NJT-0135
        与 NJT-0086 等对象拥有而收敛，快照与原始接口归 NJT-0108。派生视图子项只有能力级案例，主 Agent 若要求实际内容取得证据，应将 taxonomy 置为 deferred，而不是以文件种类补足。
      en: ATT&CK 19.1 has no T1005 sub-techniques, so no external child is imported. The open search still examined path or
        content selection, low rate, event triggering, existing identity, backup semantics, snapshots, and alternate interfaces.
        The first four either lack a stable trace difference or are already owned by NJT-0143, NJT-0135, NJT-0086, and related
        objects; snapshots and raw interfaces return to NJT-0108. The derivative-view proposal has only capability-level cases.
        If the primary agent requires evidence of actual content acquisition, the taxonomy should be deferred rather than
        padded with file categories.
  coverage: deferred
  subtechnique_refs: []
