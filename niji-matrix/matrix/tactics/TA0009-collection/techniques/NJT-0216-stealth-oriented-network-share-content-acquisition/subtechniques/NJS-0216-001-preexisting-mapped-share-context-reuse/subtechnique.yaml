research:
  limitations:
    paragraphs:
    - zh: Forcepoint 没有公开 TINYTYPHON 的逐盘 UNC、用户 SID/LUID、SMB/NFS 服务器事件或映射创建历史，控制端文档也未逐件标注本地或网络来源。因此该案例证明从 mapped drives 收集和真实文档外流，但“省去新建映射使告警下降”仍是平台语义支持的有界推断。若后续证据显示样本实际为每个目标新建连接，子项应撤回而父技术仍成立。
      en: Forcepoint does not publish per-drive UNC paths, user SID or LUID, SMB or NFS server events, or mapping-creation
        history for TINYTYPHON, and the controller documents are not individually labeled as local or network sourced. The
        case establishes mapped-drive collection and real document loss, while reduced alerting from avoiding a new mapping
        remains a bounded inference supported by platform semantics. If later evidence shows the sample created a fresh connection
        for each target, withdraw the child while retaining the parent.
