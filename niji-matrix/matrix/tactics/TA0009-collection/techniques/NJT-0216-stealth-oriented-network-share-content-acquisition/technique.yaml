schema_version: 2.0.0
type: technique
id: NJT-0216
name:
  zh: 匿迹型网络共享内容获取
  en: Stealth-Oriented Network Share Content Acquisition
summary:
  zh: 攻击者从远程文件共享实际取得内容，并借用有效共享身份、业务路径或既有访问语境，使恶意读取与正常浏览、备份或迁移读取难以在单一观察面区分。
  en: An adversary actually obtains content from a remote file share while borrowing a valid share identity, business path,
    or existing access context, making malicious reads difficult to distinguish from ordinary browsing, backup, or migration
    at one observation point.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1039
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1039
definition_and_concept:
  paragraphs:
  - zh: 匿迹型网络共享内容获取是攻击者在取得共享访问权和网络可达性后，从另一主机、文件服务器或 NAS 所承载的共享文件系统读取文件正文，并有意让请求沿预期身份、命名空间或读取接口出现，以降低单一日志对恶意目的的区分力。完成条件是远端对象的内容进入攻击者控制的处理链；共享存在、目录列表、ACL
      允许、文件句柄打开或一条权限检查均不足以证明内容已经取得。
    en: Stealth-Oriented Network Share Content Acquisition occurs after an adversary gains share authority and network reachability,
      reads file content from a shared filesystem hosted by another endpoint, file server, or NAS, and deliberately makes
      the request appear through an expected identity, namespace, or read interface. Completion requires remote-object content
      to enter an attacker-controlled processing path. Share existence, directory listing, an allowing ACL, an opened handle,
      or one authorization check does not establish acquisition.
  - zh: 概念锚是“客户端或进程—共享会话或映射—服务器共享/导出—对象路径—成功内容读取”，不是 SMB、NFS、盘符、NAS 品牌或复制工具。读取后可直接外传，也可写入本地或远程暂存点；这些后继方向不改变源行为的 T1039 归属。若文件先由合法同步或离线缓存落到本地主机，攻击者随后只读本地副本，则当次读取归
      T1005，不能因副本历史来源于共享而继续标成 T1039。
    en: The conceptual anchor is client or process, share session or mapping, server share or export, object path, and successful
      content read, rather than SMB, NFS, a drive letter, a NAS brand, or a copy utility. The read may feed direct exfiltration
      or a local or remote staging write; those later directions do not change the T1039 source behavior. If legitimate synchronization
      or offline caching first materializes the file locally and the adversary later reads only that local copy, the read
      belongs to T1005 even though the copy historically came from a share.
stealth_characteristics:
  paragraphs:
  - zh: 文件共享本来就承载员工文档访问、应用数据、备份、索引、反恶意软件扫描与迁移。恶意读取使用同一用户或服务身份、同一共享名和同一 ReadData 语义时，服务器侧事件可以完整记录访问却仍缺乏业务目的；若检测只按工具名、总字节或新映射命令判断，使用原生
      API、现有盘符或低量目标读取的行为会与正常活动重叠。对象敏感度、主体职责、源主机角色、进程来源与后继处理必须共同恢复区分力。
    en: File shares normally carry employee document access, application data, backup, indexing, antimalware scanning, and
      migration. When a malicious read uses the same user or service identity, share name, and ReadData semantics, server
      events may accurately record access while lacking business purpose. Detection based only on tool names, aggregate bytes,
      or a new mapping command can therefore conflate native APIs, an existing drive letter, or a small targeted read set
      with ordinary activity. Object sensitivity, principal duty, source-host role, process provenance, and later handling
      must restore distinction together.
  - zh: 客户端与服务器还保留不同视角：5145 能给出服务器、源地址、登录标识、共享和相对路径，却只是访问检查；配置 SACL 后的 4663 能表明对象权限被实际使用，但不说明完整字节量或攻击者是否保存内容。客户端进程遥测可能归出发进程，却未必记录远端成功结果。成功
      SMB READ 响应或 NAS 成功读取审计可补强结果，后续本地文件、归档或外联则进一步提高可信度；任何缺层都应保留为部分谱系。
    en: Client and server retain different views. Event 5145 can expose server, source address, logon ID, share, and relative
      path, but it remains an access check. With a SACL, event 4663 can show that an object right was exercised, yet it does
      not report complete byte volume or prove attacker retention. Client process telemetry can attribute the initiating process
      without necessarily recording the remote result. A successful SMB READ response or NAS successful-read audit strengthens
      the outcome, while a later local file, archive, or egress raises confidence further. Missing layers must remain a partial
      lineage.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入从已知共享或挂载文件系统实际读取远端文件正文的行为，包括从 UNC、映射盘符或 NFS mount 读取后直接送往外部目的地。只列出共享、目录、文件名、时间戳或属性属于 T1135/T1083；登录远程服务、执行命令或横向控制属于
      T1021 等行为。读取失败、AccessCheck 允许但未返回数据、仅打开目录句柄和仅发现文件均不完成本技术。
    en: Include actual reads of remote file bodies from a known share or mounted filesystem, including content read from a
      UNC path, mapped drive, or NFS mount and sent directly to an external destination. Listing shares, directories, file
      names, timestamps, or attributes belongs to T1135 or T1083. Remote-service logon, command execution, and lateral control
      belong to T1021 and related behaviors. A failed read, an allowing AccessCheck without returned data, a directory handle
      alone, or discovery alone does not complete this technique.
  - zh: 取得后的本地/远程写入与汇聚归 T1074/NJT-0134，压缩归 T1560，离开环境归外传战术；把载荷复制到另一主机归 T1570/NJT-0130。方向必须从对象来源和结果判断：从服务器共享读业务文件是 T1039，向
      ADMIN$ 写工具是 T1570，同一 SMB 会话可同时发生但证据不可互相替代。合法备份、文件服务器扫描、杀毒/分类、电子发现、恢复、用户批量复制及 Storage Migration Service/RoboCopy 迁移都是强反例，必须用作业
      owner、身份、源/目标范围、时间与变更记录排除。
    en: 'Later local or remote writes and aggregation belong to T1074 and NJT-0134, archiving to T1560, and departure to exfiltration;
      copying a payload to another host belongs to T1570 and NJT-0130. Direction follows object source and result: reading
      business files from a server share is T1039, while writing a tool into ADMIN$ is T1570. One SMB session may contain
      both, but their evidence is not interchangeable. Authorized backup, file-server scanning, antimalware or classification,
      e-discovery, restore, user bulk copy, and Storage Migration Service or RoboCopy migration are strong counterexamples
      that require job owner, identity, source and destination scope, schedule, and change record for exclusion.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 一类场景是进入用户会话的收集器遍历该会话可见的映射驱动器，筛选文档并上传。Forcepoint 对 TINYTYPHON 的分析记录其扫描驱动器字母、按配置扩展名选择并上传文档，控制端存在数千份受害者文档；公开报告没有为每份文档保留远端共享与本地盘的逐文件来源标签，因此它最强地支持映射语境行为与实际文档取得，而不支持所有文档均来自共享的数量结论。
      en: One scenario places a collector in a user session, where it traverses visible mapped drives, selects documents,
        and uploads them. Forcepoint reports TINYTYPHON scanning drive letters, selecting configured extensions, and uploading
        documents, with thousands of victim documents present on the controller. The public report does not preserve a per-file
        label separating remote-share and local-drive origin, so it most strongly establishes mapped-context behavior and
        actual document acquisition rather than a count asserting that every document came from a share.
    - zh: 另一类场景由内网服务器直接读取远端共享并外传。The DFIR Report 在 Bazar/Conti 入侵中观察到 Rclone 以 UNC 共享为源向 MEGA 复制，另一次 Emotet 入侵的命令行同样以共享为源，且
        Zeek 记录到 SMB 共享连接。这些事件证明读取与后继发送可由同一工具连续完成；直接外传不产生独立中间暂存点，不能据此增加 T1074。
      en: Another scenario has an internal server read a remote share directly into exfiltration. The DFIR Report observed
        Rclone copying from a UNC share to MEGA in a Bazar/Conti intrusion. A separate Emotet intrusion likewise used a share
        as the command-line source and exposed SMB share connections in Zeek. These incidents establish that one tool can
        perform source acquisition and subsequent sending continuously. Direct egress creates no separate intermediate staging
        point and does not by itself add T1074.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要到共享服务器的网络路径、可读取目标对象的共享与文件系统权限，以及能在客户端发出文件读取的进程或会话。其可控制源主机、身份、路径集合、读取顺序和后继去向，但受 ACL、export policy、映射所属登录会话、文件锁、离线状态和协议版本约束。既有映射子项还要求恶意进程实际运行在能看见该映射的同一登录上下文；提升或另起身份可能因
          LUID 分离而看不到原盘符。
        en: The adversary needs network reachability to the share server, share and filesystem authority to read target objects,
          and a client process or session able to issue file reads. The actor can control source host, identity, path set,
          read order, and successor destination, but ACLs, export policy, mapping ownership by logon session, locks, offline
          state, and protocol version constrain the operation. The proposed preexisting-mapping child additionally requires
          malicious execution in the same logon context that can see the mapping; elevation or another identity may lose the
          drive letter because of LUID separation.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有文件服务器共享审计、对象 SACL、NAS/NFS 审计、网络 SMB 元数据、端点进程与映射清单，但这些来源的成功语义和关联键不同。Windows 5145 应只产生“请求并通过/拒绝共享检查”的候选；4663
          ReadData、NAS 成功 READ 或成功 SMB READ 响应才把结论提升到服务器提供内容。再按服务器、LogonId、源 IP/资产、对象路径、客户端进程、身份职责和批准作业关联。没有服务器成功事件时可报告高风险请求，不能宣称数据已被完整取得。
        en: Defenders may have file-server share audit, object SACLs, NAS or NFS audit, SMB network metadata, endpoint processes,
          and mapping inventory, but these sources differ in success semantics and join keys. Windows 5145 should create only
          a requested and allowed or denied share-check candidate. Event 4663 ReadData, a NAS successful READ, or a successful
          SMB READ response raises the conclusion to server-provided content. Correlation then uses server, LogonId, source
          IP or asset, object path, client process, identity duty, and approved job. Without a server success event, report
          a high-risk request rather than claiming complete acquisition.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用业务共享身份与读取外观掩盖恶意内容获取
    en: Borrow business-share identity and read appearance to disguise malicious content acquisition
  analysis:
    paragraphs:
    - zh: 攻击者以已获授权的用户或服务身份，通过日常共享路径执行与浏览、备份、扫描或迁移相同的文件读取。服务器记录的主体、源地址、共享和 ReadData 可以真实，却无法单独表达业务目的；如果客户端又复用现有映射，显式建连或凭据提交动作还会少于新挂载路径。防守方必须把成功读取与主体职责、客户端进程、映射归属、对象敏感度和批准作业做差。Forcepoint
        证明映射驱动器被恶意收集器实际使用，Microsoft 证明映射属于登录会话，匿迹收益仍是受环境基线约束的推断。
      en: The adversary reads through an already authorized user or service identity and an ordinary share path, producing
        the same file-read semantics as browsing, backup, scanning, or migration. Server-recorded principal, source address,
        share, and ReadData may all be accurate while failing to express business purpose. Reuse of an existing mapping can
        also avoid the explicit mapping or credential-submission action of a newly mounted path. Defenders must compare successful
        reads with principal duty, client process, mapping ownership, object sensitivity, and approved jobs. Forcepoint establishes
        malicious use of mapped drives and Microsoft establishes logon-session ownership of mappings; the stealth benefit
        remains an inference bounded by the environment's baseline.
  confidence: medium
  evidence_refs:
  - REF-001086
  - REF-001088
  - REF-000474
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 建议仅把“既有映射共享语境复用”形式化为当前 Niji 子项。稳定变量是读取者是否进入受害者登录会话中已经存在的共享映射和身份语境；反事实是另建映射、显式提供新凭据或从新客户端访问。该变量改变客户端侧建连/映射痕迹及服务器侧归因解释，并要求映射、登录会话、客户端进程与成功读取的专门关联。按
        SMB/NFS、盘符/UNC、文件服务器/NAS、工具或服务器产品拆分都只是实现差异。
      en: Recommend formalizing only Preexisting Mapped-Share Context Reuse as the current Niji child. Its stable variable
        is whether the reader enters a share mapping and identity context already present in the victim logon session; the
        counterfactual creates a mapping, explicitly submits new credentials, or arrives from a new client. This variable
        changes client-side connection or mapping traces and the interpretation of server-side attribution, requiring a distinct
        join among mapping, logon session, client process, and successful read. SMB versus NFS, drive letter versus UNC, file
        server versus NAS, tool, and server product are implementation differences.
    - zh: 扩展名、路径、年龄或敏感标签筛选属于 T1119/NJT-0135 的收集编排或父级目标范围；变化检查点和低频增量已由 NJS-0135-001 覆盖。跨多源分散读取缺少结论级现场证据；服务器审计与端点缓存错位是观察限制，而从离线缓存读字节归
        T1005。快照、备份 API 与管理 REST 旁路审计有风险线索，但当前没有恶意主体实际经这些接口取得共享正文的充分证据。它们均不增列子项。
      en: Extension, path, age, and sensitivity filters belong to T1119 and NJT-0135 orchestration or to parent target scope;
        change-checkpoint and low-rate incremental behavior is already covered by NJS-0135-001. Cross-source dispersion lacks
        conclusion-level incident evidence. Server-audit versus endpoint-cache mismatch is an observation limit, while reading
        bytes from an offline cache belongs to T1005. Snapshot, backup API, and administrative REST audit-bypass paths are
        research leads without sufficient evidence of a malicious actor actually obtaining shared content through them. None
        creates another child.
  coverage: established
  subtechnique_refs:
