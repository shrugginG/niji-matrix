research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定版与事件资料证明共享内容获取的存在，却不证明任何网络共享读取天然匿迹。Forcepoint 报告将映射驱动器遍历、文档上传和控制端文档结合，但没有逐文件来源、登录 LUID 或服务器读事件；DFIR 案例给出
        UNC 源与 Rclone 外传，却不能把限速、选择条件或外传匿迹全部归因于 T1039。父级的特征拟态机理应保持 medium，不能写成“共享读取无痕”。
      en: The fixed ATT&CK baseline and incident sources establish network-share acquisition but do not make every share read
        stealthy. Forcepoint combines mapped-drive traversal, document upload, and controller documents without per-file origin,
        logon LUID, or server read events. The DFIR cases provide UNC source and Rclone egress but do not attribute throttling,
        selection, or exfiltration stealth wholly to T1039. The parent's feature-disguise mechanism should remain medium confidence
        and must not be described as traceless share reading.
    - zh: 防御可见性依赖审计前置条件。5145 是高量权限检查；4663 需 SACL 且不提供完整字节量；NFS/NAS 字段、支持版本和 first-read 语义随平台变化；管理 REST、缓存或未审计路径可绕开所选观察面。成功
        READ 也只能证明服务器提供过数据，不能单独证明攻击者完整保存、暂存或外传。所有阈值、路径敏感度和批准作业例外必须本地验证。
      en: Defensive visibility depends on auditing prerequisites. Event 5145 is a high-volume authorization check. Event 4663
        requires a SACL and does not provide complete byte volume. NFS or NAS fields, supported versions, and first-read semantics
        vary by platform. Administrative REST, caches, or unaudited paths can bypass the selected view. A successful READ
        proves only that the server provided data, not that the adversary retained, staged, or exfiltrated it completely.
        Every threshold, sensitivity map, and approved-job exception requires local validation.
