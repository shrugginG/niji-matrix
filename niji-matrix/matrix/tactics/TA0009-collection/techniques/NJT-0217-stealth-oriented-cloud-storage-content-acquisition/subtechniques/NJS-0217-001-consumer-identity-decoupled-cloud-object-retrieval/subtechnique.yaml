research:
  limitations:
    paragraphs:
    - zh: 当前恶意事件对子项的强证据集中在 Storm-0501 的 Azure Storage account key 与 AzCopy 链；公开/预签名/SAS 其他实现主要由官方能力和日志语义支持，未形成同等强度的在野成功案例。可转移载体的匿迹收益也没有量化，来源
        IP、user agent、响应字节、公开策略变化和 key 访问仍可能使其显著。若主 Agent 要求每种实现均有现场案例，应保留统一子项但把未观测实现写入限制，不能按厂商补分。
      en: Strong malicious-event evidence for the child currently concentrates on Storm-0501's Azure Storage account-key and
        AzCopy chain. Other public, presigned, and SAS implementations rely mainly on official capability and logging semantics
        rather than equally strong field cases. No source quantifies the carrier's stealth benefit, and source IP, user agent,
        response bytes, public-policy changes, or key access can remain conspicuous. If the primary reviewer requires a field
        case for every implementation, retain one unified child while limiting unobserved implementations rather than creating
        provider-specific children.
