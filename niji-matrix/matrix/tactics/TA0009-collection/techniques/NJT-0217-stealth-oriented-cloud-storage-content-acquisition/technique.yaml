research:
  limitations:
    paragraphs:
    - zh: T1530 来源页能证明广泛父行为和平台范围，却不能证明每次云读取天然匿迹，也不能自动支持原生子技术。Capital One 司法资料证明云端存储数据被复制并在设备中发现副本，但未公开原始 CloudTrail、对象键、请求状态或字节，不能据此补造日志序列。APT42
        报告直接观察 OneDrive 下载到磁盘，却没有逐对象 UAL 字段或总量；向仿冒 OneDrive 外传仅为“尝试且可能成功”。
      en: The T1530 source page establishes broad behavior and platform scope but does not make every cloud read stealthy
        or automatically support a native child. Capital One court material establishes copied cloud-stored data and a copy
        on devices, but publishes no raw CloudTrail, object keys, request status, or bytes and cannot support an invented
        log sequence. The APT42 report directly observes OneDrive download to disk but gives no per-object UAL fields or total
        volume, while transfer to a masquerading OneDrive is only attempted and possibly successful.
    - zh: Storm-0501 是消费主体解绑子项的最强现场证据，直接连接 storage account key、AzCopy 和完成外传，但 Microsoft 没有发布 StorageBlobLogs、具体 AuthenticationType、RequesterObjectId
        或 ResponseBodySize。官方字段只证明目标环境可实现检测，不能声称事件调查已经看见这些字段，也不能量化密钥路径比 OAuth 更少告警。
      en: Storm-0501 is the strongest field evidence for the consumer-identity-decoupled child, directly connecting a storage-account
        key, AzCopy, and completed exfiltration. Microsoft publishes no StorageBlobLogs, exact AuthenticationType, RequesterObjectId,
        or ResponseBodySize. Official fields establish implementable detection in a target environment, not that the incident
        investigation observed them, and do not quantify fewer alerts than OAuth.
    - zh: 数据面日志的默认和成功语义不可跨平台机械等价。CloudTrail 对象 data events、GCP DATA_READ、Azure diagnostic routing 和 GCP usage logs 都需配置；S3
        server/ GCP usage log 完整性不保证。M365 Audit 对多数组织默认开启，但许可、保留、应用代理 IP、app/service 主体与 FileAccessed 聚合会改变可见性。正式 Analytic
        必须先用受控请求核对本地字段。
      en: Data-plane defaults and success semantics cannot be mechanically equated across platforms. CloudTrail object data
        events, GCP DATA_READ, Azure diagnostic routing, and GCP usage logs require configuration, while S3 server and GCP
        usage-log completeness is not guaranteed. Microsoft 365 Audit is enabled by default for most organizations, but licensing,
        retention, proxy application IP, application or service actors, and FileAccessed aggregation change visibility. A
        formal Analytic must first validate local fields with controlled requests.
    - zh: 正常同步、备份、ETL、分析、CDN、客户下载、迁移、电子发现、灾备和管理员响应与本父级高度同形。最小权限与作业清单只能降低范围并改进归因，不能阻止被控批准主体在其合法范围内读数。成功响应字节证明服务端提供内容，不证明客户端完整保留；撤销
        link/key 也不能追回已经复制的数据。
      en: Normal synchronization, backup, ETL, analytics, CDN, customer download, migration, e-discovery, disaster recovery,
        and administrative response closely resemble this parent. Least privilege and job inventories reduce scope and improve
        attribution but cannot stop a compromised approved principal from reading within its lawful range. Successful response
        bytes establish provider delivery rather than complete client retention, and revoking a link or key cannot recall
        copied data.
