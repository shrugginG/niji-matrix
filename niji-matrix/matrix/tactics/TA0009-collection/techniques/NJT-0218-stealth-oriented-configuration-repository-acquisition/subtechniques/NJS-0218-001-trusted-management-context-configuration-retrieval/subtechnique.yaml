schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0218-001
parent_ref: NJT-0218
name:
  zh: 受信管理语境配置取得
  en: Trusted-Management-Context Configuration Retrieval
summary:
  zh: 攻击者让配置读取由已登记的监控、配置归档或自动化主体及批准管理来源承载，使实际返回内容与正常轮询或备份共享身份和网络外观。
  en: An adversary has a registered monitoring, configuration-archive, or automation principal and approved manager source
    carry configuration reads, making actual returned content share identity and network appearance with ordinary polling
    or backup.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信管理语境配置取得的稳定变量，是本次配置内容读取由组织已认可的管理主体、管理节点或例行作业语境发起，而攻击者控制了该主体、委派会话、任务参数或工具执行。子项要求证明管理请求得到成功响应并返回实际配置值或文件；仅偷到服务账户、从管理网段登录、启动
      RANCID/NMS 或发出失败命令，都只证明暴露与企图。
    en: Trusted-Management-Context Configuration Retrieval varies whether the current configuration-content read originates
      from an organization-recognized management principal, manager node, or routine job context whose principal, delegated
      session, task parameters, or tool execution is controlled by the adversary. The child requires a management request
      that succeeds and returns actual configuration values or a file. Stealing a service account, logging in from a management
      subnet, starting RANCID or an NMS, or sending a failed command establishes exposure or attempt only.
  - zh: 语境可以是只读监控用户、配置归档服务身份、已批准 NMS 来源或合法备份作业内的额外目标，但协议与厂商不构成身份。攻击者若创建新的未知管理员或从外部地址直接导出配置，仍可归父级，却不满足本子项；若其建立持久云应用授权，应另评 NJT-0086，若按检查点重复取值则另评
      NJT-0135。
    en: Context may be a read-only monitoring user, configuration-archive service identity, approved NMS source, or additional
      target inserted into a legitimate backup job, but protocol and vendor do not define the child. An adversary who creates
      an unknown administrator or exports configuration directly from an external address can remain at parent scope but does
      not meet this child. A durable cloud-app grant needs separate NJT-0086 assessment, and checkpointed repeated retrieval
      needs separate NJT-0135 assessment.
stealth_characteristics:
  paragraphs:
  - zh: 受信管理语境配置取得：该子项不会删除认证或配置读取痕迹，而是让其关键外观与正常任务一致：同一 service principal、同一管理主机、同一端口或 RPC、相似的读取对象和时间。若检测把这些特征当作永久可信，实际配置返回会被普通作业覆盖；需要把设备侧请求与
      NMS job_id、操作员、工单、设备清单、允许对象集合和响应结果连接，才能识别职责外读取。
    en: Trusted-Management-Context Configuration Retrieval：This child does not remove authentication or configuration-read
      traces. It makes their key appearance match ordinary work through the same service principal, manager host, port or
      RPC, and similar object set or timing. If detection treats these features as permanently trusted, actual configuration
      returns disappear into routine jobs. Defenders must join device-side requests to NMS job ID, operator, work order, device
      inventory, allowed object set, and response outcome to identify out-of-duty reads.
  - zh: CISA 联合通告直接记录行为者使用配置归档系统（如 RANCID）的服务/自动化凭据访问其他网络设备，并使用环境内监控工具观察配置变化；同一通告也记录配置文件被取得。该来源是多事件聚合，不能断言每次凭据使用都取得配置，亦没有测量告警下降。因此正式案例只能在找到同主体、目标、成功返回或配置产物时归入子项。
    en: The joint CISA advisory directly reports actors using service or automation credentials from configuration-archive
      systems such as RANCID to access other network devices and using monitoring tools already present to observe configuration
      changes. The same advisory reports acquired configuration files. Because it aggregates multiple incidents, it does not
      show that every use of those credentials yielded configuration or measure alert reduction. A formal case qualifies for
      this child only when the same principal, target, and successful return or configuration artifact can be joined.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入经已认可管理身份或来源成功返回的配置内容，并要求任务授权、设备范围、对象范围或实际运行者至少一项与正常基线不符。排除只证明身份被盗但没有配置结果、合法 NMS 轮询/备份、经批准的应急排障和合规导出。SNMP read-only、NETCONF
      get-config、CLI show 或 REST API 均可承载本变量，但任何协议名称都不足以分类。
    en: Include configuration content successfully returned through a recognized management identity or source when at least
      one of job authorization, device scope, object scope, or actual operator differs from the normal baseline. Exclude a
      stolen identity without a configuration result, legitimate NMS polling or backup, approved emergency troubleshooting,
      and compliance export. SNMP read-only access, NETCONF get-config, CLI show, or a REST API can carry the variable, but
      no protocol name is sufficient for classification.
  - zh: 如果攻击者只读取归档系统中已存在的配置文件且没有对设备发起当前管理请求，应归 T1602_CHILD_PREEXISTING_COPY；若合法管理作业被控制并生成新副本，随后攻击者又读取该副本，可以在分别验证两次成功结果后同时标注。配置修改、SNMP
      SET 和日志关闭属于其他行为，不能用来补足本子项的内容取得证据。
    en: If an adversary reads an existing configuration file in the archive system without a current management request to
      the device, classify T1602_CHILD_PREEXISTING_COPY. If a controlled legitimate job creates a new copy and the adversary
      later reads that copy, both children may apply only after separately validating the two successful outcomes. Configuration
      modification, SNMP SET, and logging disablement are different behaviors and cannot substitute for content-acquisition
      evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得配置备份服务账户后，从组织正常使用的管理节点登录一组路由器，让备份或监控工具读取比批准清单更广的 running configuration、路由、接口或 AAA 参数。设备看到熟悉来源和只读身份，配置管理平台则可能看到作业外设备、额外命令或不匹配工单。只有请求成功且结果保存到作业输出、客户端缓存或后继文件，才认定
        Collection 完成。
      en: After gaining a configuration-backup service account, an adversary uses the organization's normal manager node to
        log into routers and has backup or monitoring tooling read running configuration, routes, interfaces, or AAA parameters
        beyond the approved inventory. Devices see a familiar source and read-only identity, while the management platform
        may expose out-of-job devices, extra commands, or no matching work order. Collection completes only when requests
        succeed and results are saved in job output, client cache, or a downstream file.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制一个已登记管理主体或其执行环境，了解正常设备范围、作业节奏和读取接口，并具有足以返回目标配置的 read view。其可以利用共享服务账户和固定管理地址弱化归因，但增加异常目标、额外对象或过大返回会暴露；严格的每作业凭据、设备清单、MIB/YANG
          视图和双人审批会压缩空间。
        en: The adversary must control a registered management principal or execution environment, understand normal device
          scope, job cadence, and retrieval interface, and possess a read view that returns target configuration. Shared service
          accounts and fixed manager addresses weaken attribution, but extra targets, additional objects, or excessive returns
          can expose the operation. Per-job credentials, device inventory, MIB or YANG views, and two-person approval constrain
          it.
    defender_model:
      paragraphs:
      - zh: 防守方不能把管理网段或服务主体整体放行，而需获得每次 NMS/备份作业的 job_id、发起人、审批、设备与对象集合，并连接设备认证、RPC/命令、完成状态、返回量和结果保存。若产品只记登录或写操作，防守只能报告职责偏离的可疑会话；没有成功响应或配置产物时不能确认本子项。
        en: Defenders cannot globally allowlist the management subnet or service principal. They need each NMS or backup job's
          job ID, initiator, approval, device and object scope joined to device authentication, RPC or command, completion
          status, returned quantity, and result storage. If a product records only login or writes, defenders can report a
          suspicious out-of-duty session but cannot confirm this child without a successful response or configuration artifact.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 以正常管理主体和作业外观承载未经授权的配置返回
    en: Carry unauthorized configuration returns under an ordinary management principal and job appearance
  analysis:
    paragraphs:
    - zh: 已批准的监控/归档身份和管理节点发起真实配置请求，返回内容进入攻击者控制的作业或会话。认证、来源和协议特征与正常备份相同，恶意实体借用了合法管理任务的外观，形成 NM-FD；作业范围、请求对象、响应量和结果去向仍是区分点。CISA
        对凭据、工具及配置目标给出直接观察，但事务级连接与检出率未公开，故为 medium。
      en: An approved monitoring or archive identity and manager node issue real configuration requests, and returned content
        enters an adversary-controlled job or session. Authentication, source, and protocol features match ordinary backup,
        so the malicious entity borrows a legitimate management task's appearance and creates NM-FD. Job scope, requested
        objects, response quantity, and result destination remain discriminators. CISA directly observes credentials, tools,
        and configuration targets but does not publish transaction-level joins or detection rates, leaving confidence medium.
  confidence: medium
  evidence_refs:
