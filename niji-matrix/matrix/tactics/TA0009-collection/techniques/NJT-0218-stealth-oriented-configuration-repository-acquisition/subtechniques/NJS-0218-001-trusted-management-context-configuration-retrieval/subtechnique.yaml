research:
  limitations:
    paragraphs:
    - zh: 公开通告把服务/自动化凭据、监控工具和配置取得列为同类行动中的已观察行为，却没有发布同一请求的主体、命令、响应与保存产物。该子项因此需要组织内日志或取证补足事务级证据；仅凭“RANCID 账户被使用”不得写成配置已取得或成功混入正常备份。
      en: Public reporting lists service or automation credentials, monitoring tools, and configuration acquisition among
        observed activity, but does not publish principal, command, response, and saved artifact for one request. The child
        therefore needs transaction-level evidence from organizational logs or forensics. Use of a RANCID account alone cannot
        be written as acquired configuration or successful blending with normal backup.
