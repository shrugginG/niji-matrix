research:
  limitations:
    paragraphs:
    - zh: 联合通告证明行为者从 provider script 输出等既有来源取得配置，却没有公开具体副本路径、存储主体或完整读取日志；RANCID 与 Cisco 文档证明正常系统如何保存副本，不证明某一产品部署中的恶意读取。正式案例需补充实际对象、版本和成功读取结果，不能从设备“无命令”单独反推本子项。
      en: The joint advisory establishes actor acquisition from existing sources such as provider-script output but does not
        publish a specific replica path, storage principal, or complete read audit. RANCID and Cisco documentation establish
        how normal systems preserve copies, not a malicious read in one deployment. A formal case needs an actual object,
        version, and successful read result; absence of a device command alone cannot prove this child.
