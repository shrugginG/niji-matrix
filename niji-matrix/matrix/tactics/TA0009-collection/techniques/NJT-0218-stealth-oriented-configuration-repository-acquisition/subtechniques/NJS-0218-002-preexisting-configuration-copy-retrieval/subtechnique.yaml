schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0218-002
parent_ref: NJT-0218
name:
  zh: 既有配置副本取得
  en: Preexisting Configuration-Copy Retrieval
summary:
  zh: 攻击者读取此前由备份、归档或 provider script 生成的配置副本或历史版本，使本次内容取得发生在副本存储面而没有对应的实时设备配置请求。
  en: An adversary reads a configuration copy or historical version previously produced by backup, archiving, or a provider
    script, so current content acquisition occurs on replica storage without a corresponding live-device configuration request.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 既有配置副本取得的稳定变量，是攻击者把已经存在于配置管理服务器、版本库、备份目录、对象存储或 provider script 输出中的副本作为当前内容源，而不是向目标设备实时读取。副本必须能解析到特定设备、配置类型或版本，并证明读取、checkout、clone、download
      或文件打开成功返回了内容；仅列目录、看到版本号或发现备份位置属于 Discovery。
    en: Preexisting Configuration-Copy Retrieval varies whether an adversary uses a copy already present on a configuration-management
      server, version repository, backup directory, object store, or provider-script output as the current content source
      rather than reading the live target device. The copy must resolve to a device, configuration type, or version, and a
      successful read, checkout, clone, download, or file open must return content. Listing a directory, seeing a version
      number, or discovering a backup location is Discovery only.
  - zh: “既有”指本次攻击者读取前已由另一采集事务生成，不要求副本陈旧或离线，也不按 Git、CVS、S3、文件系统或 NMS 产品拆分。若攻击者先命令设备导出到临时位置再立即取走，设备侧仍有本次读取/导出，应留在父级或与受信管理语境子项并列；只有当前
      Collection 不需要实时设备事务时，才满足本子项观察差。
    en: Preexisting means another acquisition transaction produced the copy before the adversary's current read. It need not
      be stale or physically offline, and Git, CVS, S3, filesystem, or NMS products do not define partitions. If the adversary
      first commands a device to export to a temporary location and immediately retrieves it, the device still has a current
      read or export and the event stays at parent scope or co-classifies with the trusted-management-context child. This
      child's observation difference requires that current Collection need no live-device transaction.
stealth_characteristics:
  paragraphs:
  - zh: 既有配置副本取得：实时设备日志会显示“没有新的配置读取”，因为可用内容来自较早的正常备份、差异采集或版本提交；攻击者当前行为留在存储端的主体、文件或对象、版本、返回量和目的会话中。若设备团队与备份/版本库团队分开监控，或只把 Git/CVS/备份主机视为恢复设施，配置取得可能落在设备检测之外。副本读取并未消失，细粒度文件/对象审计与身份职责可恢复。
    en: Preexisting Configuration-Copy Retrieval：Live-device logs show no new configuration read because usable content comes
      from an earlier normal backup, difference collection, or version commit. Current adversary behavior remains in storage-side
      principal, file or object, version, returned quantity, and destination session. If device and backup or repository teams
      monitor separately, or treat Git, CVS, or backup hosts only as recovery infrastructure, the acquisition can fall outside
      device-focused detection. Replica reads remain visible where fine-grained file or object audit and identity duty are
      available.
  - zh: CISA 联合通告明确配置文件可从网络内既有来源（例如 provider script 输出）取得；RANCID 官方资料说明设备配置被处理并提交到版本控制，Cisco 配置版本功能也保存运行配置的历史副本。这些材料共同证明副本面和实际攻击取得，但没有给出某一恶意副本读取的完整存储审计或实测告警差，因此匿迹机理保持
      medium。
    en: The joint CISA advisory explicitly states that configuration files can be acquired from existing network sources such
      as provider-script output. Official RANCID material explains that device configuration is processed and committed to
      version control, and Cisco configuration versioning stores historical running-configuration copies. Together these sources
      establish the replica surface and actual adversary acquisition, but they do not provide complete storage audit for one
      malicious replica read or a measured alert difference, so the stealth mechanism remains medium confidence.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对已生成配置副本或历史版本的成功内容读取，并要求该读取没有同时间目标设备管理请求。若副本存在云对象存储，可同时评估 T1530 的存储访问，但 T1602 仍由内容的配置管理用途决定；若仓库保存一般文档、源代码或业务数据，相关对象归
      T1213。对副本的再压缩、加密和集中暂存属于 T1560/T1074。
    en: Include successful content reads of an already generated configuration copy or historical version when no contemporaneous
      management request reaches the target device. When the copy sits in cloud object storage, T1530 storage access may also
      apply, while T1602 remains determined by the content's configuration-management function. General documents, source
      code, and business data in the same repository belong to T1213. Recompression, encryption, and centralized staging of
      the copy belong to T1560 or T1074.
  - zh: 排除合法差异审查、备份完整性测试、灾备演练、合规扫描、授权恢复和厂商支持。只有 repository login、list、metadata get、版本号查询或失败 download 时，不得声明内容取得；只看到返回字节而不能确认对象为配置时，结论应保持“副本读取候选”。
    en: Exclude legitimate difference review, backup-integrity testing, disaster-recovery exercises, compliance scanning,
      authorized restore, and vendor support. Repository login, list, metadata get, version lookup, or failed download does
      not establish content acquisition. Returned bytes without confirmation that the object is configuration leave only a
      candidate replica read.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 网络运营商的 provider script 或配置归档系统定期把路由器配置保存到管理服务器和版本库。攻击者攻陷该服务器或复用其账户后，checkout 某设备历史版本或直接读取 configs 目录，从中恢复管理端点、ACL、路由和弱保护凭据；目标路由器本时段没有新命令。该场景也可出现在用于合规或灾备的配置备份对象，只要证明读取成功和对象语义。
      en: A provider script or configuration-archive system at a network operator periodically saves router configuration
        to a manager and version repository. After compromising that server or reusing its account, an adversary checks out
        a device's historical version or reads a configs directory to recover management endpoints, ACLs, routes, and weakly
        protected credentials. The target router has no new command during that interval. The same scenario can involve configuration
        backup objects used for compliance or disaster recovery when successful reading and object semantics are proven.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需能读取配置副本存储或控制有权读取的主体，知道文件/对象与设备及版本的映射，并能处理可能的加密、脱敏或 secret placeholder。选择历史副本可避开实时设备访问，却承担内容过期、关键秘密已轮换或副本访问审计更完整的风险；其不必拥有当前设备会话。
        en: The adversary needs read access to configuration-copy storage or control of an authorized reader, knowledge mapping
          files or objects to devices and versions, and a way to handle encryption, redaction, or secret placeholders. Choosing
          a historical copy avoids live-device access but risks stale content, rotated secrets, or stronger replica-store
          auditing. A current device session is unnecessary.
    defender_model:
      paragraphs:
      - zh: 防守方需要配置副本清单、device_id、snapshot/version_id、内容哈希与敏感性，以及版本库、对象存储或主机文件读取审计中的 principal、session、operation、outcome 和
          bytes。再与合法备份生产者、允许消费者、恢复工单和历史设备采集连接；若本地文件系统未启用读取审计、Git 只记录仓库级 clone 或共享账户掩盖实际人，文件级归因会受限。
        en: Defenders need a configuration-copy inventory with device ID, snapshot or version ID, content hash, and sensitivity,
          plus principal, session, operation, outcome, and bytes from version-repository, object-store, or host file-read
          audit. They then join authorized backup producers, allowed consumers, restore work orders, and historical device
          acquisition. File-level attribution is limited when local filesystems lack read audit, Git records only repository-level
          clone, or a shared account obscures the human operator.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 将当前配置读取移到设备命令监控之外的既有副本面
    en: Move current configuration reading to a preexisting replica plane outside device-command monitoring
  analysis:
    paragraphs:
    - zh: 合法备份或 provider script 先生成配置副本，攻击者以后从副本存储成功读取内容，目标设备在当前时窗没有配置查询。若防守方的有效观察范围止于设备 AAA、命令和管理流量，关键行为不会进入该范围，形成 NM-BT；副本对象与读取审计仍能补齐。CISA、RANCID
        与 Cisco 文档共同支持行为和架构，未提供检出率，故为 medium。
      en: A legitimate backup or provider script first creates a configuration copy, and the adversary later reads content
        successfully from replica storage without a current configuration query to the target device. If effective monitoring
        ends at device AAA, commands, and management traffic, the critical read remains outside that scope and creates NM-BT.
        Replica-object and access audit can close the gap. CISA, RANCID, and Cisco documentation jointly support behavior
        and architecture but provide no detection rate, leaving confidence medium.
  confidence: medium
