research:
  limitations:
    paragraphs:
    - zh: 研究使用固定 19.1 工作簿决定候选与 ATT&CK 子项广度，不采用后续 live ATT&CK 新增案例改变范围。Jaguar Tooth 对父级内容取得最强，AA25-239A 对两项原生变量提供多事件高可信支持，但事务级证据不完整。因此主
        Agent 若无法在跨候选收敛中接受 aggregate case 对变量存在性的支持，应保留父级 adapt，将一个或两个子项降为 deferred，而不应降低取得结果门。
      en: Research uses the fixed 19.1 workbook for candidate and ATT&CK-child breadth and does not change scope based on
        later live ATT&CK examples. Jaguar Tooth is strongest for parent content acquisition, while AA25-239A gives high-credibility
        multi-incident support for both native variables without complete transaction evidence. If cross-candidate convergence
        cannot accept an aggregate case as support for an axis's existence, the primary agent should retain parent adaptation
        and defer one or both children rather than lower the acquisition-outcome gate.
    - zh: 正常网络管理会规律读取大量敏感配置，导致简单的“高量/夜间/管理员”规则误报。具体 Analytic 因而要求作业授权和内容结果核对，并承认许多平台缺少逐读日志。任何部署都需先用合法 NMS、RANCID/备份、合规、灾备和厂商支持流量验证字段、保留期和基线；不得为获得通用覆盖而声明不存在的
        channel 或字段。
      en: Normal network management regularly reads large amounts of sensitive configuration, making simple high-volume, nighttime,
        or administrator rules noisy. Proposed analytics therefore require job authorization and content-outcome reconciliation
        while acknowledging that many platforms lack per-read logs. Every deployment must first validate fields, retention,
        and baseline against legitimate NMS, RANCID or backup, compliance, disaster-recovery, and vendor-support flows. It
        must not claim nonexistent channels or fields to obtain generic coverage.
