schema_version: 2.0.0
type: technique
id: NJT-0218
name:
  zh: 匿迹型配置存储库收集
  en: Stealth-Oriented Configuration Repository Collection
summary:
  zh: 攻击者取得设备或基础设施配置内容，并借受信管理语境或既有配置副本改变本次读取的主体归因和观察位置，使只看异常登录、实时设备命令或大规模导出的防守方难以确认收集。
  en: An adversary acquires device or infrastructure configuration content while using a trusted management context or a preexisting
    configuration copy to change attribution and the observation location of the read, frustrating defenders who inspect only
    anomalous logins, live-device commands, or bulk exports.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1602
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1602
definition_and_concept:
  paragraphs:
  - zh: 匿迹型配置存储库收集，是攻击者在已取得设备、管理系统、配置归档或相关身份访问能力后，从运行配置、启动配置、管理数据库、MIB/YANG 数据视图、自动化输出、备份或版本历史中取得实际配置内容，并有意选择使读取与正常管理活动难分或落到另一观察面的路径。配置内容可以包含接口、路由、访问控制、管理端点、协议参数、账户或凭据材料；其语义是设备或基础设施管理状态，而非文件扩展名或承载产品。
    en: Stealth-Oriented Configuration Repository Collection occurs after an adversary gains access to a device, management
      system, configuration archive, or relevant identity and acquires actual configuration content from running or startup
      configuration, a management database, a MIB or YANG data view, automation output, backup, or version history. The actor
      deliberately chooses a path that resembles ordinary management work or places the read on another observation surface.
      Content can include interfaces, routes, access controls, management endpoints, protocol parameters, accounts, or credential
      material. Its identity comes from device or infrastructure management state rather than a file extension or hosting
      product.
  - zh: 完成条件是内容结果而不是操作意图。认证成功仅证明主体进入，CLI、SNMP、NETCONF、RESTCONF、Smart Install 或文件请求仅证明尝试；无错误响应和返回字节证明服务端给出数据候选，但只有能解析的配置值、配置文件、保存的命令输出、对象版本或内容哈希与目标配置相符时，才可高置信度声明实际取得。Jaguar
      Tooth 的 running configuration 命令与外送结果满足该门槛；只观察到 SNMPwalk、get-config 或 copy 命令但没有响应/产物时不得越级。
    en: Completion depends on the content outcome rather than operational intent. Successful authentication proves entry only;
      a CLI, SNMP, NETCONF, RESTCONF, Smart Install, or file request proves an attempt. An error-free response and returned
      bytes establish a candidate server response, but high-confidence acquisition requires parseable configuration values,
      a configuration file, saved command output, an object version, or a content hash matching target configuration. Jaguar
      Tooth's running-configuration command and exfiltrated results meet this threshold. An observed SNMPwalk, get-config,
      or copy command without a response or artifact does not.
stealth_characteristics:
  paragraphs:
  - zh: 当恶意读取由正常监控或配置归档主体、批准的管理来源和常用协议发起时，设备端仍会留下认证、请求和响应，却与例行轮询、备份或合规采集共享主体及网络路径。恶意性转移到“该作业是否获批、目标设备和对象是否在职责范围、实际返回是否符合任务”这些跨系统问题；把服务账户或管理网段整体列入白名单会抹掉差异。联合通告直接证明行为者使用配置归档服务凭据、既有监控工具及配置内容，未测量告警率，因此匿迹收益以中等置信度表达。
    en: 'When malicious reads originate from an ordinary monitoring or configuration-archive principal, approved manager source,
      and familiar protocol, the device still records authentication, request, and response but shares principal and network
      path with routine polling, backup, or compliance collection. Maliciousness moves to cross-system questions: whether
      the job was approved, whether devices and objects fell within assigned scope, and whether returned results matched the
      task. Globally allowlisting a service account or management subnet erases those differences. The joint advisory directly
      establishes use of configuration-archive credentials, existing monitoring tools, and configuration content but does
      not measure alert rates, so the stealth effect carries medium confidence.'
  - zh: 从既有配置副本、版本历史或 provider script 输出取得内容时，本次恶意读取发生在配置管理服务器、文件系统或版本库；目标设备没有同时间的 show/get/export，设备侧只保留更早的合法备份采集。这不是无痕：副本存储会留下文件读取、clone/checkout/download、会话和返回字节，历史采集也能解释副本来源。若防守只保留设备
      AAA 或命令记账，不连接副本对象与读取者，就会把当前取得误判为没有发生。
    en: 'When content comes from an existing configuration copy, version history, or provider-script output, the current malicious
      read occurs on a configuration-management server, filesystem, or version repository. The target device has no contemporaneous
      show, get, or export operation and retains only an earlier legitimate backup collection. This is not traceless: replica
      storage can expose file reads, clone, checkout, or download events, sessions, and returned bytes, while historical collection
      records explain replica provenance. A defender retaining only device AAA or command accounting and not joining replica
      objects to readers can mistake the current acquisition for no event.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入能证明配置内容成功返回或被读出的事件，并要求至少一个攻击者可控变量改变观察：管理主体/来源语境与正常作业重叠，或本次读取转到既有副本面。配置位于本地磁盘、版本库、云对象存储还是 NMS 数据库不单独决定分类；若对象的主要功能是设备或基础设施配置，T1602
      负责内容来源，云存储访问路径可在确有独立行为时并列 T1530。一般文档、CRM、代码和聊天内容归 T1213，操作系统上偶然存在的普通本地配置文件若并非管理存储则按 T1005 评估。
    en: 'Include events that prove configuration content was successfully returned or read and require at least one attacker-controlled
      variable that changes observation: management principal or source context overlaps a normal job, or the current read
      moves to a preexisting replica plane. Local disk, version control, cloud object storage, or an NMS database does not
      independently determine classification. When an object''s primary function is device or infrastructure configuration,
      T1602 owns the content source; a cloud-storage access path may be co-classified as T1530 when it has independent behavioral
      relevance. General documents, CRM, code, and chat belong to T1213, while ordinary local configuration files that are
      not part of a management repository should be evaluated under T1005.'
  - zh: 排除仅探测 SNMP 服务、列举设备或 OID、查看路由器型号、获得凭据、登录管理会话、发送失败命令和只证明导出能力的事件；这些分别属于 Discovery、Credential Access、Remote Services/管理会话或未完成企图。按计划重复取得配置或只取变化版本可并列
      NJT-0135；成功内容随后集中写入、压缩、加密或外送分别属于 T1074、T1560 和后续战术。修改配置、清理日志或关闭审计不是本 Collection 的定义，即使同一入侵中出现。
    en: Exclude merely probing SNMP, listing devices or OIDs, viewing a router model, obtaining credentials, entering a management
      session, sending a failed command, or showing only export capability. Those are Discovery, Credential Access, Remote
      Services or management-session activity, or incomplete attempts. Scheduled repeated acquisition or change-only retrieval
      can be co-classified with NJT-0135. Writing acquired content to one location, compressing or encrypting it, and sending
      it out belong to T1074, T1560, and later tactics. Configuration modification, log clearing, and audit disabling do not
      define this Collection behavior even when present in the same intrusion.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在受侵网络设备上，攻击者可经 CLI、SNMP、管理 API 或原生导出功能取得 running/startup configuration、路由、接口、MPLS、AAA 或访问控制内容。Jaguar Tooth 自动执行包含
        running configuration 导出的命令并外送结果；联合通告中的行为者还从设备勘测、TFTP、provider script 输出和监控工具取得配置。协议只是入口，正式判断必须保留成功响应或内容产物以及与目标设备的连接。
      en: On a compromised network device, an adversary can use CLI, SNMP, a management API, or native export functionality
        to acquire running or startup configuration, routes, interfaces, MPLS, AAA, or access-control content. Jaguar Tooth
        automatically executed commands including a running-configuration dump and exfiltrated results. Actors in the joint
        advisory also acquired configurations through device survey, TFTP, provider-script output, and monitoring tools. Protocol
        is only an entry path; formal classification needs a successful response or content artifact linked to the target
        device.
    - zh: 在配置归档环境中，攻击者可能控制用于 RANCID 或同类作业的服务凭据，让目标设备把读取视为正常备份，也可能直接读取该系统已经提交到 Git/CVS/SVN 或备份目录的版本。前者在设备与 NMS 两侧都有当前事务但归因模糊，后者的当前事务只在副本存储面。合法备份、变更审核、灾备恢复、合规扫描和厂商故障排除会产生相同基础形态，必须通过任务、设备范围、对象范围、操作员和内容去向消歧。
      en: In a configuration-archive environment, an adversary may control service credentials used by RANCID or an equivalent
        job so the target device sees an ordinary backup read, or may directly read versions already committed to Git, CVS,
        SVN, or a backup directory. The first path creates a current transaction on device and NMS but weakens attribution;
        the second creates the current transaction only on replica storage. Legitimate backup, change review, disaster recovery,
        compliance scanning, and vendor troubleshooting have the same basic shape and require task, device scope, object scope,
        operator, and content destination to distinguish them.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者至少需要能成功读取配置值或副本的权限，以及把返回内容保存、解析或发送到其控制链的能力。受信管理语境路径还要求获得或劫持 NMS/备份主体、批准来源或运行作业；既有副本路径要求访问保存配置的主机、版本库或存储对象。攻击者可选择设备、配置视图、版本和时机，却受最小
          MIB/YANG 视图、管理平面 ACL、强认证、作业范围和副本权限限制。只读权限不会消除泄露风险，但不能支持配置修改结论。
        en: The adversary needs permission that successfully reads configuration values or copies and a way to save, parse,
          or move returned content into an attacker-controlled chain. The trusted-management-context path additionally requires
          access to or control of an NMS or backup principal, approved source, or running job. The preexisting-copy path requires
          access to the host, version repository, or storage object that holds configuration. The actor can choose devices,
          configuration views, versions, and timing but is constrained by least-privilege MIB or YANG views, management-plane
          ACLs, strong authentication, job scope, and replica permissions. Read-only authority still permits disclosure but
          does not support a configuration-modification conclusion.
    defender_model:
      paragraphs:
      - zh: 防守方理想上同时拥有网络设备认证与 AAA、管理请求和完成状态、响应值数量或字节、NMS/备份作业清单、版本库/文件读取、对象与版本标识、配置敏感性和批准工单。现实中 CLI 命令记账可能不覆盖 NETCONF/XML/gRPC，SNMPv3
          authPriv 与 NETCONF/SSH 会加密内容，部分设备只记录写操作，服务账户又可能共享；因此流量或认证不能单独证明内容取得。部署分析前必须验证每一通道能否给出主体、目标、请求、成功结果和对象键，并把缺失层级显式降级。
        en: Ideally, defenders have network-device authentication and AAA, management request and completion status, returned
          value count or bytes, NMS or backup job inventory, repository or file reads, object and version identifiers, configuration
          sensitivity, and approved work orders. In practice, CLI command accounting may not cover NETCONF, XML, or gRPC;
          SNMPv3 authPriv and NETCONF over SSH encrypt content; some devices log writes rather than reads; and service accounts
          may be shared. Traffic or authentication alone therefore cannot prove acquisition. Before deployment, an analytic
          must validate whether every channel supplies principal, target, request, successful result, and object key, explicitly
          downgrading when a layer is absent.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用已批准管理主体与来源使恶意配置读取呈现例行作业外观
    en: Borrow approved management principals and sources so malicious configuration reads resemble routine jobs
  analysis:
    paragraphs:
    - zh: 攻击者使用配置归档/监控服务凭据或控制既有管理工具，从常用管理来源对职责内外设备读取配置。设备侧可见身份、来源、协议和命令类型均与例行备份或轮询重叠，使只按未知账户、外部 IP 或失败认证分类的检测难以把恶意事务分离。作业
        ID、批准范围、请求对象、成功返回和后继内容去向仍能恢复差异；联合通告直接证明这些主体与工具被使用，却没有给出告警命中率，故为 medium。
      en: The adversary uses configuration-archive or monitoring-service credentials, or controls an existing management tool,
        to read configuration from in-scope or out-of-scope devices through a familiar manager source. Device-visible identity,
        source, protocol, and command type overlap routine backup or polling, making rules based on unknown accounts, external
        IPs, or failed authentication poor classifiers. Job ID, approved scope, requested objects, successful return, and
        downstream content destination can still recover the difference. The joint advisory directly establishes use of these
        principals and tools but supplies no alert rate, so confidence is medium.
  confidence: medium
  evidence_refs:
  - REF-000792
  - REF-001120
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 从既有配置副本读取使当前 Collection 落在实时设备审计之外
    en: Read preexisting configuration copies so current Collection falls outside live-device audit
  analysis:
    paragraphs:
    - zh: 配置归档或 provider script 先在合法流程中把设备内容写到配置管理服务器、版本库或备份目录，攻击者稍后直接读取该副本。本次 Collection 不触发目标设备的 show、get-config、SNMP GET
        或 export；若防守只查询设备 AAA 与命令日志，关键读取位于监控范围之外。副本对象、版本控制访问、文件读取和返回字节仍存在，连接历史采集与当前读取即可恢复链。CISA 直接证明从既有 provider 输出取得配置，Cisco
        与 RANCID 文档证明副本/版本结构；告警差异为条件推断，因此为 medium。
      en: A legitimate configuration archive or provider script first writes device content to a configuration-management
        server, version repository, or backup directory, and the adversary later reads that copy directly. The current Collection
        event triggers no show, get-config, SNMP GET, or export on the target device; a defender querying only device AAA
        and command logs leaves the critical read outside coverage. Replica objects, version-control access, file reads, and
        returned bytes remain, and joining historical collection to current access restores the chain. CISA directly establishes
        acquisition from existing provider output, while Cisco and RANCID documentation establish the replica and version
        structure. Alert impact remains conditional, so confidence is medium.
  confidence: medium
  evidence_refs:
  - REF-000792
  - REF-001121
  - REF-001120
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 建议两个 Niji 原生子项。受信管理语境配置取得按“本次读取是否由正常管理主体、批准来源或例行作业承载”划分，设备仍有当前读取但恶意归因需要跨 NMS 作业恢复；既有配置副本取得按“本次读取是否直接作用于此前生成的副本而不访问实时设备”划分，观察面转移到归档/版本存储。一个事件若先借正常作业生成新副本、再从副本读取，可以同时命中两个子项，但必须分别证明实时取得和副本读取结果。
      en: Two Niji-native children are proposed. Trusted-Management-Context Configuration Retrieval varies whether an ordinary
        management principal, approved source, or routine job carries the current read. The device still has a current transaction,
        but malicious attribution requires an NMS-job join. Preexisting Configuration-Copy Retrieval varies whether the current
        read targets a previously produced copy without accessing the live device, moving observation to archive or version
        storage. An event that first uses a routine job to create a fresh copy and then reads that copy can meet both children
        only when live acquisition and replica-read outcomes are independently proven.
    - zh: ATT&CK 的 SNMP/MIB 与网络设备配置导出仅为广度背景。SNMP、NETCONF、RESTCONF、CLI、TFTP、厂商、设备类型、running/startup、MIB/YANG 和配置格式均不得成为兄弟项。选择性配置投影和接口审计错位具有研究价值，但缺少同一事件中“过滤/接口选择—实际内容返回—防守观察差”的结论证据；分散或低频查询还与
        NJT-0135 自动收集状态轴相邻，均暂不正式化。
      en: ATT&CK's SNMP/MIB and network-device configuration-dump children are breadth context only. SNMP, NETCONF, RESTCONF,
        CLI, TFTP, vendor, device type, running versus startup state, MIB or YANG, and configuration format cannot define
        siblings. Selective configuration projection and interface-audit mismatch are useful research leads but lack conclusion-level
        evidence joining filter or interface choice, actual returned content, and a defender-observation difference in one
        incident. Distributed or low-rate querying also borders NJT-0135's automated-collection state axis and remains deferred.
  coverage: established
  subtechnique_refs:
  - NJS-0218-001
  - NJS-0218-002
