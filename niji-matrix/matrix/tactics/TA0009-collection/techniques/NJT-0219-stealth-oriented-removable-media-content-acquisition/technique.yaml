schema_version: 2.0.0
type: technique
id: NJT-0219
name:
  zh: 匿迹型可移动介质内容获取
  en: Stealth-Oriented Removable-Media Content Acquisition
summary:
  zh: 攻击者从当前接入的可移动介质实际取得内容，并借用正常介质接入、读取授权或跨接入状态，使恶意读取与导入、备份、扫描、取证或恢复在单一观察面上难以区分。
  en: An adversary actually obtains content from currently attached removable media while borrowing ordinary attachment, read
    authorization, or state across attachments so one observation point poorly distinguishes malicious reads from import,
    backup, scanning, forensics, or recovery.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1025
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1025
definition_and_concept:
  paragraphs:
  - zh: 匿迹型可移动介质内容获取是攻击者在已能控制主机进程、账户或本地植入后，从当时由可移动存储、光盘或可携设备对象存储提供的文件或数据流读取内容，并有意使用正常接入时机、既有读取授权或跨接入目标状态降低恶意目的的可见差异。完成条件是介质内容进入攻击者可处理的内存、文件、归档或传输链；检测到设备、分配盘符、列出目录、匹配扩展名、成功打开句柄或一次允许策略判定均不能单独证明内容已取得。
    en: Stealth-Oriented Removable-Media Content Acquisition occurs after an adversary can control a host process, account,
      or local implant and reads content from a file or data stream then supplied by removable storage, optical media, or
      a portable-device object store, deliberately using ordinary attachment timing, existing read authority, or target state
      across attachments to reduce visible differences in purpose. Completion requires media content to enter attacker-usable
      memory, a file, an archive, or a transfer chain. Device detection, drive-letter assignment, directory listing, extension
      matching, a successfully opened handle, or one allowing policy decision cannot alone establish acquisition.
  - zh: 概念锚是“介质身份—接入会话与挂载点—读取主体和进程—介质对象路径—成功内容读取—后继处理”，不是 USB、CD、MTP、盘符、文件类型或复制工具。若合法应用已把对象导入内部磁盘，攻击者随后只接触内部副本，则当次获取归本地内容；若绕过普通文件命名空间读取物理设备或隐藏区域，则归原始存储视图。
    en: The conceptual anchor is media identity, attachment session and mount point, reading principal and process, media
      object path, successful content read, and subsequent processing rather than USB, CD, MTP, a drive letter, file type,
      or copy utility. If a legitimate application has imported an object to internal storage and the adversary touches only
      that copy, the acquisition is local content. Bypassing the ordinary file namespace to read a physical device or hidden
      region is raw-storage-view access.
stealth_characteristics:
  paragraphs:
  - zh: 员工、导入程序、备份恢复工具、反恶意软件、电子取证工具和索引服务本来就会读取可移动介质。恶意程序等待用户或操作系统完成正常接入，再以同一用户或服务身份读取时，设备接入、卷挂载和允许 File Read 都可准确记录事实，却不表达业务目的。只以未知
      DeviceID、新 mount、脚本名称或大量复制为判据会漏掉认可介质上的小量目标读取，也会误报常规扫描和导入。
    en: Employees, importers, backup and restore tools, antimalware, forensic tools, and indexing services routinely read
      removable media. When malware waits for ordinary attachment and reads through the same user or service authority, attachment,
      volume mount, and an allowed File Read can accurately record facts while failing to express business purpose. Detection
      based only on unknown DeviceID, a new mount, a script name, or bulk copying can miss sparse targeted reads from approved
      media and misclassify ordinary scanning and import.
  - zh: PnP 或 mount 只说明可达，设备控制允许或拒绝只说明策略处理了请求，4663 ReadData 说明对象访问权被实际使用；这些事件仍不保证完整文件被攻击者保留。进程谱系、对象路径、读后输出、归档输入或外联字节结果可提高结论强度。事件上限、隔离主机无代理、MTP
      非盘符对象、加密介质及短保留会造成盲区。
    en: PnP or mount shows reachability, a device-control allow or deny shows policy handling, and event 4663 ReadData shows
      an exercised object right; none guarantees that the adversary retained a complete file. Process lineage, object path,
      post-read output, archive input, or egress bytes raises confidence. Event caps, agentless isolated hosts, non-drive-letter
      MTP objects, encrypted media, and short retention create blind spots.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求介质在读取当时仍是内容来源，并证明成功内容读取或等价结果。设备插入、PnpDeviceConnected、UsbDriveMounted、mount 命令、卷枚举、目录浏览、文件属性访问和策略允许只进入候选层；读取失败、仅
      ReadAttributes、仅扫描文件名或内容未进入攻击者处理链均不完成父行为。普通文件系统、光盘和可携设备对象读取可同属父级；介质品牌、总线或协议不产生子项。
    en: Include behavior only when the medium remains the content source at read time and a successful content read or equivalent
      outcome is established. Device insertion, PnpDeviceConnected, UsbDriveMounted, mount, volume enumeration, directory
      browsing, file-attribute access, and policy allow remain candidate-level signals. A failed read, ReadAttributes alone,
      filename scanning alone, or content outside attacker control does not complete the parent. Ordinary filesystem, optical-disc,
      and portable-device object reads can belong to the parent; media brand, bus, and protocol do not form children.
  - zh: T1091/NJT-0058 以另一主机触发为结果；T1005/NJT-0215 接管导入后的本地副本；T1119/NJT-0135 接管自动编排；T1074/NJT-0134 与 T1560/NJT-0133 接管读后暂存和归档；T1570/NJT-0130
      接管内部送达；NJT-0194 接管写介质离域；NJT-0207 要求命令、动作和结果闭环。用户导入、备份恢复、杀毒、迁移、电子发现、取证和合规复制须以批准设备、主体、签名、工单、路径、时间和去向排除。
    en: T1091 and NJT-0058 end in triggering another host; T1005 and NJT-0215 own imported local copies; T1119 and NJT-0135
      own automation; T1074 and NJT-0134 plus T1560 and NJT-0133 own post-read staging and archiving; T1570 and NJT-0130 own
      internal delivery; NJT-0194 owns media departure; NJT-0207 requires a command-action-result loop. User import, backup
      restore, antimalware, migration, e-discovery, forensics, and compliance copying require exclusion by approved device,
      principal, signer, ticket, path, time, and destination.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在外交、政府、研发和工业环境中，员工可将 USB、移动设备、光盘或维护介质接入已有植入的工作站。植入监视新卷、读取目标文档，再写入本地加密归档或直接上传。Crutch 早期版本暂存可移动驱动器文件，新版自动上传本地和可移动驱动器文件，说明源读取、暂存和外传虽连续发生仍需分别建模。TajMahal
        还可先记住介质对象，待同一 USB 返回时窃取指定文件。
      en: In diplomatic, government, research, and industrial environments, employees may attach USB storage, mobile devices,
        discs, or maintenance media to a workstation already hosting an implant. The implant monitors new volumes, reads target
        documents, then writes a local encrypted archive or uploads directly. Early Crutch versions staged removable-drive
        files and the later version uploaded local and removable-drive files, showing that source read, staging, and exfiltration
        remain separate. TajMahal can instead remember a media object and steal the specified file when the same USB returns.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要在接入主机执行读取逻辑，或控制可代读的账户、服务或应用，并知道目标路径、格式或条件。操作系统须识别介质且策略允许文件级读取；加密卷需要解锁或密钥，MTP 等对象存储需要相应 API。重接入门控还需保存介质身份和目标状态，容忍盘符变化、离线、文件移动与序列号不可靠；等待降低主动扫描，却牺牲即时性并可能等不到介质。
        en: The adversary needs execution on the attachment host or control of an account, service, or application that can
          read, plus target path, format, or condition knowledge. The operating system must recognize the medium and permit
          file-level read; encrypted volumes need unlock or keys, and MTP object stores need an appropriate API. Reattachment
          gating also requires retained media identity and target state tolerant of drive-letter changes, offline periods,
          moved files, and unreliable serials. Waiting reduces active scanning but sacrifices immediacy and may never see
          the medium again.
    defender_model:
      paragraphs:
      - zh: 防守方需把 PnP、mount/unmount、介质序列号或组织资产号、卷和挂载点映射到主体会话、进程、对象路径和 ReadData，并以输出文件、归档或网络结果补强。还需维护批准介质、进程读取范围和业务作业，保存跨最长正常返回周期的介质—对象历史。设备事件上限、隔离端无代理、序列号复用和
          MTP 字段差异均限制结论；USB 接入或一次读取不能独立归因。
        en: Defenders need to map PnP, mount and unmount, media serial or organizational asset identity, volume, and mount
          point to subject session, process, object path, and ReadData, strengthened by output file, archive, or network outcome.
          They also need approved media, process read scope, business jobs, and media-object history across the longest normal
          return cycle. Event caps, agentless isolated endpoints, reused serials, and MTP field differences limit conclusions;
          USB attachment or one read cannot independently establish maliciousness.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 介质读取借用正常导入扫描和恢复的主体与路径外观
    en: Media reads borrow the principal and path appearance of ordinary import scanning and recovery
  analysis:
    paragraphs:
    - zh: 攻击者等待正常接入，再沿已允许的文件读取路径取得内容，使 DeviceID、用户、盘符和 ReadData 语义与导入、备份、杀毒或取证相似。痕迹没有消失，而是缺少业务目的；异常进程、未批准路径、对象敏感度、读后输出和目的地仍可揭示。Crutch
        证明恶意介质读取，Microsoft 文档证明文件级读取可按介质、主体、进程和策略观察；未测告警效果，故置信度为 medium。
      en: The adversary waits for ordinary attachment and obtains content through an allowed file-read path, making DeviceID,
        user, drive path, and ReadData resemble import, backup, antimalware, or forensics. Traces remain but lack business
        purpose; anomalous process, unapproved path, sensitivity, output, and destination can expose them. Crutch establishes
        malicious media reads and Microsoft documentation supports observation by media, principal, process, and policy. Alert
        effect is unmeasured, so confidence is medium.
  confidence: medium
  evidence_refs:
  - REF-000914
  - REF-000597
  - REF-001127
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 重接入门控目标回收是唯一找到的候选变量：组件先保存介质与对象知识，待同一介质后续返回时才读取既定目标，使发现与取得跨接入会话分离。TajMahal 支持这一模块设计，但公开资料没有逐文件受害结果或告警测量；按结论级证据门禁，本版将其延期，不建立正式子技术。
      en: 'Reattachment-Gated Target Recall is the only candidate variable found: a component retains media and object knowledge
        and reads the selected target only when the same medium later returns, separating discovery from acquisition across
        attachment sessions. TajMahal supports the module design but public reporting provides no per-file victim outcome
        or alert measurement. Under the conclusion-level evidence gate, this version defers the hypothesis and creates no
        formal child.'
    - zh: 接入触发、轮询、扩展名、关键词、文件年龄和增量检查由 T1119/NJT-0135 或父级目标范围表达；USB、CD、MTP、操作系统、API、盘符和文件类型只是实现。原始卷归 NJT-0108，介质命令—结果信箱归 NJT-0207，正常导入后的本地副本归
        NJT-0215。受信导入进程劫持和策略审计旁路也缺少现场结论证据。
      en: Attachment triggers, polling, extensions, keywords, file age, and incremental checks belong to T1119 and NJT-0135
        or parent target scope. USB, CD, MTP, operating system, API, drive letter, and file type are implementations. Raw
        volumes belong to NJT-0108, media command-result mailboxes to NJT-0207, and local copies after normal import to NJT-0215.
        Trusted importer hijack and policy-audit bypass also lack field-level outcome evidence.
  coverage: deferred
  subtechnique_refs: []
