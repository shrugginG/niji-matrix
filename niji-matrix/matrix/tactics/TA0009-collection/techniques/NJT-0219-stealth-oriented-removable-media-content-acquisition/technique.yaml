research:
  limitations:
    paragraphs:
    - zh: Crutch 资料证明介质监视、匹配文件处理和后续上传能力，但没有公开逐文件读取事件或完整受害时间线。TajMahal 来自一处外交机构受害环境并包含重接入取回模块，却没有证明某个指定文件在现场被成功读取，也没有量化告警变化。因此父级为
        medium，重接入假设仅保留在研究限制与父级分析中，不列为正式子技术。
      en: Crutch reporting establishes media monitoring, matching-file handling, and later upload capability but publishes
        no per-file read events or complete victim timeline. TajMahal came from a diplomatic victim environment and contained
        a reattachment retrieval module, yet does not prove one requested file was successfully read in the field or quantify
        alert change. The parent is therefore medium confidence, while the reattachment hypothesis remains in research limits
        and parent analysis rather than as a formal child.
    - zh: 检测实现以 Windows 官方字段最具体；Linux 与 macOS 可按等价 mount、介质身份、进程读取和结果字段移植，但当前研究未证明各发行版或传感器字段相同。事件上限、MTP 对象模型、序列号质量、隔离端覆盖和合法取证/备份高读取量会改变效果，需在本地审计模式验证。
      en: Detection is most specific for official Windows fields. Linux and macOS can adapt equivalent mount, media identity,
        process-read, and outcome fields, but this research does not establish identical fields across distributions or sensors.
        Event caps, MTP models, serial quality, isolated-endpoint coverage, and legitimate high-volume forensics or backup
        change effectiveness and require local audit-mode validation.
