research:
  limitations:
    paragraphs:
    - zh: 平台文档证明观察权限和调用位置，DRBControl 证明特定恶意程序在 RDP session 形成输出；公开报告未公开真实内容、逐次成功率或告警结果，也不能把所有 Hook、Input Monitoring 或设备读取视为恶意。正式案例需要结果链与批准前态，且不能从一般键盘日志自动推断其中包含认证秘密。
      en: Platform documentation establishes observation authority and call position, while DRBControl establishes output
        from one malware family in RDP sessions. Public reporting does not disclose actual content, per-attempt success, or
        alert outcomes, and not every hook, Input Monitoring grant, or device read is malicious. A formal case needs an outcome
        chain and approval pre-state, and a general key log cannot automatically establish that authentication secrets were
        present.
