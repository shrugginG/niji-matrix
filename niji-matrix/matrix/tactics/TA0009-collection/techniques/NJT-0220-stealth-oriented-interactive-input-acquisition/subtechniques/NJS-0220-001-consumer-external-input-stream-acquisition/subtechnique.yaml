schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0220-001
parent_ref: NJT-0220
name:
  zh: 消费者外输入流取得
  en: Consumer-External Input-Stream Acquisition
summary:
  zh: 攻击者在输入到达预期应用前从全局事件、设备或辅助功能面复制实际内容，使应用继续正常处理而自身审计不含第二份结果。
  en: The adversary copies actual content from a global event, device, or accessibility surface before it reaches the intended
    application, allowing normal processing while the application's own audit lacks the second result.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 消费者外输入流取得以“副本形成在预期应用或数据消费者之外”为稳定变量。攻击者通过全局键盘或鼠标 Hook、事件 tap、输入设备读取、驱动、辅助功能或等价观察面取得非认证文字和有意义交互，并把它保存到攻击者可读缓冲、文件或传输链。平台
      API 或设备只是实现；实际输入结果与外部捕获位置共同构成子项。
    en: Consumer-External Input-Stream Acquisition uses formation of the copy outside the intended application or data consumer
      as its stable variable. Through a global keyboard or mouse hook, event tap, input-device read, driver, accessibility
      authority, or equivalent observation surface, the adversary acquires non-authentication text or meaningful interactions
      and saves them to an attacker-readable buffer, file, or transfer chain. A platform API or device is only an implementation;
      an actual input outcome and the external capture position together define the child.
  - zh: 结果可以同时带进程、窗口、用户和时间语境，以解释输入来自何处，但这些附加标签不另建子项。DRBControl 在每个 RDP 会话运行键盘记录逻辑并写出包含用户名、进程、窗口标题和捕获输出的混淆报告，直接证明了消费者外输入流及结果。若只看到
      Hook 或权限而没有记录、缓冲、外联或经实验确认的输出，只能认定 exposure。
    en: The outcome can include process, window, user, and time context to explain where input originated, but those labels
      do not create additional children. DRBControl ran keylogging logic in every RDP session and wrote an obfuscated report
      containing username, process, window title, and captured output, directly establishing an external input stream and
      outcome. A hook or permission without a record, buffer, egress, or lab-confirmed output supports exposure only.
stealth_characteristics:
  paragraphs:
  - zh: 消费者外输入流取得让真实应用继续接收原始输入并保持普通业务事务，因此应用日志无法说明同一事件是否被第二读者复制。痕迹集中在系统输入观察权限、设备访问、后台观察进程、字符或事件缓冲和随后的文件或网络结果；防守方若按应用孤立审查，会把
      Collection 与正常交互分开存放。
    en: Consumer-External Input-Stream Acquisition allows the genuine application to receive the original input and preserve
      an ordinary business transaction, so application audit cannot say whether a second reader copied the same event. Traces
      concentrate in system input-observation authority, device access, a background observer process, character or event
      buffers, and later file or network outcomes. Application-siloed review stores the Collection event separately from the
      normal interaction.
  - zh: 合法输入法、屏幕阅读器、远程支持、游戏覆盖层、密码管理器、自动化测试和安全代理形成高基率反例；单独 API、TCC 授权或 /dev/input open 不具备足够判别力。仍可观察的差异是首次或职责外全局观察、后台服务进入交互
      session、目标面偏离批准范围以及观察后同进程出现重复小写入或新外联。
    en: Legitimate input methods, screen readers, remote support, game overlays, password managers, automated tests, and security
      agents form high-base-rate counter-examples, so an API, TCC grant, or /dev/input open alone is weak. Residual differences
      include first-seen or out-of-duty global observation, a background service entering an interactive session, target surfaces
      outside approved scope, and repeated small writes or new egress from the observing process.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求输入副本形成在消费者之外并存在非认证内容或有意义事件结果。只获得输入权限、安装 Hook、加载驱动或打开设备但没有结果是准备或暴露；只读取剪贴板返回内容归 NJT-0214；只捕获屏幕像素归 NJT-0158；只发现活动窗口或用窗口状态门控后继动作归
      NJT-0132 及 NJS-0132-001。按窗口选择采集时机可与本子项并列，但不能替代实际输入结果。
    en: Inclusion requires a copy outside the consumer and an outcome containing non-authentication content or a meaningful
      event. Obtaining input authority, installing a hook, loading a driver, or opening a device without an outcome is preparation
      or exposure. Clipboard-returned content belongs to NJT-0214, screen pixels to NJT-0158, and discovery of an active window
      or use of window state to gate a later action to NJT-0132 and NJS-0132-001. Window-conditioned timing can coexist with
      this child but cannot substitute for an actual input outcome.
  - zh: 若结果是口令、验证码或认证秘密，NJS-0169-001 拥有 Credential Access 结果；普通内容属于本子项。同一日志不能因“可能包含密码”就自动双标，必须有相匹配的秘密证据。输入捕获后的加密文件、批量上传或低频发送改变后继处理，不改变本子项的消费者外位置。
    en: NJS-0169-001 owns the Credential Access outcome when the result is a password, verification code, or authentication
      secret; ordinary content belongs here. A log cannot be dual-labeled merely because it may contain a password; matching
      secret evidence is required. An encrypted file, bulk upload, or low-rate transmission after capture changes successor
      processing rather than this child's consumer-external position.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在长期受控终端、跳板机或 RDP 会话中启动后台输入观察，等待用户编写文档、输入搜索与命令、处理客户资料或发送消息，并用窗口和进程标签减少后续解释成本。输出可先写入本地报告，也可由同进程送出；本子项在结果形成时完成，后继暂存和外送独立分类。
      en: An adversary starts background input observation on a persistently compromised endpoint, jump host, or RDP session
        and waits while a user writes documents, enters searches and commands, handles customer data, or sends messages, using
        window and process labels to reduce later interpretation cost. Output may first enter a local report or leave from
        the same process. The child completes when the result forms, while later staging and sending are classified separately.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要进入目标交互 session 或控制能跨 session 观察的组件，获得足够的输入设备、辅助功能、TCC、Hook 或驱动权限，并将按键、鼠标或事件序列解析到字符和应用语境。其受隔离桌面、protected
          input、驱动签名、最小辅助功能权限、布局和语言差异以及用户未活动限制；广泛连续记录还会增加缓冲、文件和网络痕迹。
        en: The adversary needs access to the target interactive session or control of a component that observes across sessions,
          sufficient input-device, accessibility, TCC, hook, or driver authority, and the ability to resolve key, mouse, or
          event sequences into characters and application context. Isolated desktops, protected input, driver signing, least
          accessibility authority, layout and language differences, and absent user activity constrain the actor. Broad continuous
          recording also increases buffer, file, and network residue.
    defender_model:
      paragraphs:
      - zh: 防守方假定可验证至少一个输入观察通道，并能连接进程、用户、session、目标输入面、缓冲与外联，同时维护获批输入软件和任务清单。没有 API/设备传感器时，文件和网络结果只能表明可疑输出而不能说明其来自输入；只有权限时则只能表明暴露。分析应使用脱敏测试输入验证采集链，不收集生产按键内容。
        en: The defender is assumed to validate at least one input-observation channel and join process, user, session, target
          surface, buffer, and egress while maintaining approved input-software and task inventories. Without an API or device
          sensor, file and network outcomes can show suspicious output but not that it came from input; authority alone shows
          exposure. Analytics should validate the acquisition chain with redacted test input rather than collect production
          keystroke content.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 将输入副本移到业务消费者审计之外
    en: Move the input copy outside business-consumer audit
  analysis:
    paragraphs:
    - zh: 外部观察者先于或独立于预期应用复制输入，应用只记录正常事务，不记录第二读者。痕迹从业务审计转到端点权限、设备和观察进程结果，使未关联观察面时出现盲区；同一 host、user、session 与 process 上的权限或设备读取、缓冲及外联能够恢复链。DRBControl
        提供实际结果证据，但跨环境检测差异未量化，故为 medium。
      en: An external observer copies input before or independently of the intended application, which records only the ordinary
        transaction and not the second reader. Traces move from business audit to endpoint authority, devices, and observer-process
        outcomes, creating a blind spot when those surfaces are not joined. Authority or device reads, buffers, and egress
        on the same host, user, session, and process reconstruct the chain. DRBControl provides actual-outcome evidence, but
        cross-environment detection difference is unquantified, leaving medium confidence.
  confidence: medium
  evidence_refs:
