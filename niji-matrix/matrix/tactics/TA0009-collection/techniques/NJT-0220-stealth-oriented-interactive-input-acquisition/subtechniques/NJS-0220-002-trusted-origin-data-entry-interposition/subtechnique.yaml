research:
  limitations:
    paragraphs:
    - zh: 当前直接案例集中于支付页，并把覆盖表单、字段监视、同源路径、服务端处理和外送放在一个复杂感染中。它支持受信来源与输入结果，但不能证明所有业务应用、原生桌面组件或第三方脚本具有相同痕迹。CSP、SRI 与 PCI 指南支持控制设计，不证明某部署的检出率；正式
        Analytic 必须用本地脱敏测试字段验证浏览器和服务器两端。
      en: Current direct case evidence centers on a payment page and combines an overlaid form, field observation, a same-origin
        path, server processing, and forwarding in one complex infection. It supports a trusted origin and input outcome but
        does not establish identical traces for every business application, native desktop component, or third-party script.
        CSP, SRI, and PCI guidance support control design rather than detection performance. A formal analytic must validate
        both browser and server branches with locally redacted test fields.
