schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0220-002
parent_ref: NJT-0220
name:
  zh: 受信来源数据入口介入
  en: Trusted-Origin Data-Entry Interposition
summary:
  zh: 攻击者把恶意字段观察或接收逻辑置于用户预期的数据入口来源内，使实际输入进入第二结果链而域名、品牌和会话外观仍保持可信。
  en: The adversary places malicious field-observation or receiving logic inside an expected data-entry origin, sending actual
    input into a second outcome chain while domain, brand, and session appearance remain trusted.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信来源数据入口介入以“恶意输入接收者寄生在用户预期访问的真实应用来源”为稳定变量。攻击者修改脚本、模板、组件、服务端控制器或运行态，在原页面或应用中观察真实字段、增加覆盖字段，或把提交复制到另一处理路径；域名、证书、品牌与导航仍可属于合法服务。子项要求实际非认证字段值进入恶意请求、服务端记录或后继结果，而不是只发现页面被改写。
    en: Trusted-Origin Data-Entry Interposition uses a malicious input receiver inhabiting the genuine application origin
      the user expects to visit as its stable variable. The adversary changes scripts, templates, components, server controllers,
      or runtime to observe real fields, add overlaid fields, or copy submissions into another processing path while domain,
      certificate, branding, and navigation can still belong to the legitimate service. The child requires actual non-authentication
      field values to enter a malicious request, server-side record, or downstream result rather than merely a changed page.
  - zh: 该变量不等于 Web 产品或表单类型。当前强证据来自受侵结账页面，但同一边界可用于受信桌面或业务应用内的恶意输入组件，只要来源身份保留、接收者控制权改变且内容结果成立。攻击者完全控制的陌生域或独立假页面没有借用受侵数据入口本身，可落入父级、社会工程或其他信息收集对象；认证页面和口令结果仍由
      NJT-0169 处理。
    en: The variable is not a web product or form type. Current strong evidence comes from a compromised checkout page, but
      the same boundary can apply to a malicious input component within a trusted desktop or business application when origin
      identity remains, receiver control changes, and a content outcome is established. A wholly attacker-controlled unfamiliar
      origin or stand-alone fake page does not borrow the compromised data entry itself and may remain at parent scope, social
      engineering, or another information-gathering object. Authentication pages and password outcomes remain under NJT-0169.
stealth_characteristics:
  paragraphs:
  - zh: 受信来源数据入口介入保留用户原本会访问的域名、TLS 和业务语境，恶意字段可以具有一致样式，提交还可先发往同源路径再由服务器外送。只按域名信誉、TLS 存在或跨域表单目标检测时，恶意输入接收者与正常结账、客户资料或工单流程难以分开；同源阶段还会把异常推迟到服务器制品、路由或出站面。
    en: Trusted-Origin Data-Entry Interposition preserves the domain, TLS, and business context the user already intended
      to visit. Malicious fields can match the expected style, and a submission can first go to a same-origin path before
      the server sends it onward. Detection based only on domain reputation, TLS presence, or cross-origin form destinations
      struggles to separate the malicious receiver from ordinary checkout, customer-profile, or ticket workflows, while a
      same-origin stage defers the anomaly to server artifacts, routes, or egress.
  - zh: 残余痕迹包括未批准脚本、模板或控制器哈希，消费者浏览器所见资源与发布清单不一致，新增或覆盖字段、异常 form action/connect 目的、同源陌生路由、服务端对特定参数的选择性处理，以及页面进程或服务器的第二输出。合法标签管理、A/B
      测试、无障碍注入、反欺诈脚本、支付处理器和客服工具也会改变表单，因此必须把部署、数据合同、字段用途与接收方一起核对。
    en: Residual traces include unapproved script, template, or controller hashes; differences between the browser's received
      resources and the release manifest; added or overlaid fields; unusual form-action or connect destinations; unfamiliar
      same-origin routes; selective server processing of a parameter; and a second output from the page process or server.
      Tag management, A/B tests, accessibility injection, fraud scripts, payment processors, and support tooling also change
      forms, so deployment, data contract, field purpose, and receiver must be reconciled together.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求真实或组织认可的应用来源仍承载用户交互，而恶意组件取得实际非认证字段或交互结果。若页面只被篡改但用户未提交、只出现覆盖层、脚本只读取已经呈现的页面正文、或只向未知地址发出空请求，都不足以证明输入取得。T1185/NJT-0145
      负责已呈现或返回的浏览器内容；本子项负责用户在入口中形成的值，二者在各自结果都成立时可以并列。
    en: Inclusion requires a genuine or organization-recognized application origin to continue carrying user interaction while
      a malicious component obtains actual non-authentication fields or interaction outcomes. A changed page without submission,
      an overlay alone, a script reading only rendered page text, or an empty request to an unknown address does not establish
      input acquisition. T1185 and NJT-0145 own browser content already rendered or returned, while this child owns values
      the user creates in the entry surface; both can apply when each result is supported.
  - zh: 认证登录字段、口令、OTP 和恢复秘密归 NJS-0169-002 或 NJS-0169-003，取决于真实消费者内镜像还是仿冒消费者；不能因同一站点还包含支付或个人资料就把凭据证据移给本子项。修改脚本或控制器的进入方式可另标供应链、Web
      入侵、T1055 或 T1565.002；本子项只在输入结果链闭合时成立。后继服务器 curl、文件落地和外传属于后续动作。
    en: Authentication fields, passwords, OTPs, and recovery secrets belong to NJS-0169-002 or NJS-0169-003 depending on genuine-consumer
      shadowing or an impersonated consumer; credential evidence does not transfer here merely because the same site also
      contains payment or profile fields. The way scripts or controllers were changed can be separately classified as supply-chain
      compromise, web intrusion, T1055, or T1565.002. This child requires a closed input-outcome chain, while later server
      curl, file writes, and exfiltration are successor actions.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制电商或客户门户的部署文件、第三方依赖或服务端控制器后，在真实结账或资料页面插入看似正常的字段或字段观察逻辑。输入可以先提交到站点自身隐藏路径，再由受侵服务器转往攻击者，从而保持浏览器层同源外观；也可以在正常提交继续或错误提示出现前复制。正式案例应保留浏览器所见制品、表单或字段模式、成功请求、服务器处理与最终结果之间的同事件链。
      en: After controlling deployment files, a third-party dependency, or a server controller for a commerce site or customer
        portal, the adversary inserts plausible fields or field-observation logic into a genuine checkout or profile page.
        Input can first submit to a hidden path on the same site and then leave through the compromised server, preserving
        same-origin appearance in the browser, or it can be copied before normal submission continues or an error is shown.
        A formal case should preserve a same-event chain across browser-delivered artifact, form or field schema, successful
        request, server handling, and final outcome.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要修改或运行控制数据入口客户端或服务端组件的能力，以及足够的业务知识来匹配品牌、字段、验证和反馈。若使用同源接收，还需控制服务器路由或处理器并把结果送到其可读位置。严格的制品签名、只读部署、外部渲染监测、最小脚本清单、SRI/CSP、form-action/connect-src、服务出站限制和独立托管高价值字段会增加成本，但同源服务器失陷仍可能绕过部分浏览器策略。
        en: The adversary needs authority to change or runtime-control client or server components of the data-entry surface
          and enough business knowledge to match branding, fields, validation, and feedback. A same-origin receiver also requires
          control of a server route or handler and a path moving results to an attacker-readable location. Artifact signing,
          read-only deployment, external rendered-page monitoring, minimal script inventories, SRI and CSP, form-action and
          connect-src restrictions, service egress controls, and independently hosted high-value fields increase cost, although
          a compromised same-origin server can bypass some browser policy.
    defender_model:
      paragraphs:
      - zh: 防守方需要把 CI/CD 批准制品和脚本清单作为外部锚点，比较边缘或真实浏览器收到的资源哈希、DOM/字段模式摘要、form action、fetch/XHR 目的和 CSP/SRI 报告，并连接服务器文件完整性、请求路由、进程与出站网络。若只校验源代码仓库，运行态注入、CDN/第三方变化或服务器动态改写可能不可见；若只看浏览器跨域，则同源隐藏路径会形成盲区。
        en: The defender needs CI or CD approved artifacts and a script inventory as an external anchor, compares resource
          hashes, DOM or field-schema digests, form actions, fetch or XHR destinations, and CSP or SRI reports as received
          at the edge or a real browser, and joins server file integrity, request routes, processes, and outbound network.
          Validating only the source repository misses runtime injection, CDN or third-party drift, and dynamic server rewriting;
          inspecting only cross-origin browser traffic leaves a blind spot for hidden same-origin routes.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 以真实数据入口的来源特征承载恶意字段接收
    en: Carry malicious field receipt under a genuine data-entry origin's features
  analysis:
    paragraphs:
    - zh: 恶意脚本或处理器在真实应用来源内接收用户字段，保留域名、TLS、品牌和导航等正常特征，并可用同源路径隐藏浏览器到未知域的直接提交。恶意接收者因而借用合法入口的特征分布，改变防守方从域名异常转向制品、字段图、路由和服务器第二输出的观察责任。Sucuri
        案例直接证明这一链，但只有一个具体电商实现且未测量告警率，故为 medium。
      en: A malicious script or handler receives user fields inside a genuine application origin, preserving ordinary domain,
        TLS, branding, and navigation features and optionally using a same-origin path to avoid a direct browser submission
        to an unknown domain. The malicious receiver therefore borrows the legitimate entry surface's feature distribution,
        moving defensive responsibility from domain anomaly to artifacts, field graph, routes, and a second server output.
        The Sucuri case directly establishes the chain, but it is one commerce implementation without measured alert rates,
        leaving medium confidence.
