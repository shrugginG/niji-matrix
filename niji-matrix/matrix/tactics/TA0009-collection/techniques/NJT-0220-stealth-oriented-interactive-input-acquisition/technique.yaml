research:
  limitations:
    paragraphs:
    - zh: DRBControl 和 PrestaShop 证据分别证明消费者外报告结果与受信来源支付字段结果，但来自不同活动、平台和攻击阶段，不能拼成同一普遍链。平台文档证明 API 位置或权限，不证明恶意行为；PCI、CSP 与 SRI
        证明控制语义，不证明任何部署已检出攻击。两项 NJS 因此保持 medium 机理置信度，案例置信度按来源单独校准。
      en: DRBControl and PrestaShop evidence separately establish a consumer-external report outcome and trusted-origin payment-field
        outcome but concern different operations, platforms, and stages and cannot be combined into one universal chain. Platform
        documentation proves API position or authority rather than malicious use, while PCI, CSP, and SRI establish control
        semantics rather than detection in any deployment. Both NJS therefore retain medium mechanism confidence, with case
        confidence calibrated separately by source.
    - zh: 检测输入行为会接触高度敏感且可能受法律、隐私和劳资政策约束的数据。正式实现必须优先使用权限、进程、资源哈希、字段模式摘要、目标、状态和字节元数据，以脱敏合成事务验证链路，并对无障碍、输入法、远程支持、分析、反欺诈和测试制定精确且到期的例外。缺少结果层时只能报告
        exposure，不得用采集能力代替成功 Collection。
      en: Detecting input behavior touches highly sensitive data and may be constrained by legal, privacy, and labor policy.
        Formal implementations must prefer authority, process, resource hash, field-schema digest, destination, status, and
        byte metadata, validate lineage with redacted synthetic transactions, and maintain exact expiring exceptions for accessibility,
        input methods, remote support, analytics, fraud controls, and testing. Where the outcome layer is absent, report exposure
        only and do not substitute capture capability for successful Collection.
