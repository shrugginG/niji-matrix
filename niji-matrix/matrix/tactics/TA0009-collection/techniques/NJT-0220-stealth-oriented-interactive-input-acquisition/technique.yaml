schema_version: 2.0.0
type: technique
id: NJT-0220
name:
  zh: 匿迹型交互输入内容取得
  en: Stealth-Oriented Interactive Input Acquisition
summary:
  zh: 攻击者在用户形成文字、字段值或有意义交互事件时取得其实际内容，并通过移出预期消费者审计面或寄生受信数据入口改变防守方能够关联的采集痕迹。
  en: An adversary acquires actual text, field values, or meaningful interaction events as a user creates them and changes
    defender-visible collection traces by moving outside the intended consumer's audit surface or inhabiting a trusted data-entry
    origin.
aliases: []
classification:
  tactic_refs:
  - TA0009
  origin:
    kind: attack-adapted
    source_attack_id: T1056
    source_attack_version: '19.1'
  decision_ref: DEC-TA0009-T1056
definition_and_concept:
  paragraphs:
  - zh: 匿迹型交互输入内容取得，是攻击者在用户输入尚未进入预期应用、正在被应用处理或正在通过数据入口提交时，复制非认证文字、表单字段、选择或具有信息价值的交互事件，并使结果进入攻击者可读的内存、文件、请求或传输链。直接目标是收集用户此刻正在形成的信息，例如文档片段、搜索、消息、业务字段、支付资料或操作意图，而不是读取已经静态保存的文件、页面正文或凭据库。
    en: Stealth-Oriented Interactive Input Acquisition occurs when an adversary copies non-authentication text, form fields,
      selections, or information-bearing interaction events before they reach the intended application, while the application
      processes them, or as a data-entry surface submits them, and causes the result to enter attacker-readable memory, a
      file, a request, or a transfer chain. The direct objective is information the user is creating at that moment, such
      as document fragments, searches, messages, business fields, payment details, or operational intent, rather than a previously
      stored file, page body, or credential vault.
  - zh: 完成点必须区分输入观察能力、实际输入结果、结果保留或送出以及后继使用。全局 Hook、Input Monitoring 权限、/dev/input 打开、表单脚本变化、覆盖层或提示框只证明暴露或准备；只有捕获内容、输入事件记录、成功表单请求、恶意服务端记录或与目标字段相符的后继结果，才能证明
      Collection。防守分析不应为了证明这一点而集中保存真实用户输入，应使用权限、来源、字段模式摘要、字节、目的地和结果元数据。
    en: Completion must separate input-observation capability, an actual input outcome, retention or forwarding of that outcome,
      and later use. A global hook, Input Monitoring permission, an open on /dev/input, a changed form script, an overlay,
      or a prompt proves exposure or preparation only. Collection requires captured content, an input-event record, a successful
      form request, a malicious server-side record, or a downstream result matching target fields. Defensive analysis should
      not centrally retain actual user input to make that determination and should instead use authority, provenance, field-schema
      digests, byte counts, destinations, and outcome metadata.
stealth_characteristics:
  paragraphs:
  - zh: 当复制发生在预期消费者之外时，目标应用仍接收并处理正常输入，却不会在自己的审计中记录第二份副本；痕迹转移到全局 Hook、输入设备读取、辅助功能或 Input Monitoring 权限、观察进程缓冲和外联。若防守只看应用事务或内容库访问，实际
      Collection 会落在端点输入面。输入法、无障碍、远程支持和自动化也使用相同权限，攻击者因此还能借高基率合法行为削弱单一 API 或权限告警的判别力。
    en: When copying occurs outside the intended consumer, the target application continues to receive and process ordinary
      input but does not record the second copy in its own audit. Traces move to global hooks, input-device reads, accessibility
      or Input Monitoring authority, observer-process buffers, and egress. Defenders inspecting only application transactions
      or content-store access can miss the actual Collection event on the endpoint input plane. Input methods, accessibility
      tools, remote support, and automation use the same authority, allowing the adversary to exploit a high legitimate base
      rate that weakens a single API or permission alert.
  - zh: 当恶意接收逻辑寄生在用户预期访问的数据入口时，正确域名、TLS、品牌、导航与部分业务反馈可以保留，用户与网络边界看到的来源仍像合法服务。异常缩小为脚本、模板、控制器或运行态差异，新增或覆盖字段、表单接收目标、同源异常路径以及服务器的第二输出。受信来源不会令行为无痕；外部锚定的制品清单、浏览器实际渲染图、表单目标、服务端路由和外联仍可恢复接收者谱系。
    en: When malicious receiver logic inhabits a data-entry origin the user expects to visit, the correct domain, TLS, branding,
      navigation, and some business feedback can remain, so the user and network boundary still see a legitimate service.
      Anomalies narrow to script, template, controller, or runtime differences; added or overlaid fields; form destinations;
      unusual same-origin routes; and a second server output. A trusted origin does not make the behavior traceless. Externally
      anchored artifact inventories, the browser's rendered graph, form targets, server routes, and egress can reconstruct
      receiver lineage.
  - zh: 匿迹收益取决于观察面是否连接。端点没有输入权限或 API 传感器、Web 团队只校验仓库而不校验消费者浏览器实际接收内容、或网络策略把同源请求全部视为正常时，路径差更难识别；反之，能以用户、会话、进程、页面 origin、release、form_id、路由和时间连接输入暴露与结果，就能把普通相似行为排除。公开来源没有量化检出率或误报率，因此机理置信度不高于
      medium。
    en: The stealth benefit depends on whether observation surfaces are joined. Path differences are harder to identify when
      endpoints lack input-authority or API sensors, web teams validate only a repository rather than what the consumer browser
      received, or network policy treats every same-origin request as ordinary. Conversely, joining exposure to outcome by
      user, session, process, page origin, release, form ID, route, and time permits legitimate lookalikes to be excluded.
      Public sources do not quantify detection or false-positive rates, so mechanism confidence does not exceed medium.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对象是非认证输入内容或有意义的交互事件，并要求攻击者有意控制捕获位置或接收来源，使观察面与预期消费者不同。一般键盘、鼠标或表单事件只有在实际记录或结果证明其进入攻击者控制链时才成立；只发现 Hook、按键 API、输入权限、输入设备、可疑表单或登录页变化属于线索。操作系统、键盘、GUI、Web、API、字段种类和产品是实现面，不能单独定义子项。
    en: Included objects are non-authentication input content or meaningful interaction events, with an attacker-controlled
      capture position or receiver origin that differs from the intended consumer's observation surface. Keyboard, mouse,
      or form activity qualifies only when a record or outcome proves entry into an attacker-controlled chain. A hook, key-state
      API, input permission, input device, suspicious form, or changed sign-in page alone is a lead. Operating system, keyboard,
      GUI, web, API, field category, and product are implementation surfaces and do not independently define children.
  - zh: 口令、验证码、恢复秘密、认证证明以及以身份验证为直接目的的提示归 NJT-0169；同一键盘日志若同时含普通内容与真实认证秘密，必须分别证明两类结果后才可同时映射。T1115/NJT-0214 以从剪贴板服务成功返回内容为完成点，本技术以内容进入剪贴板或应用之前的输入流为对象。T1185/NJT-0145
      读取浏览器已经呈现或返回的页面、文档与会话内容；本技术只处理用户正在形成和提交的值。
    en: Passwords, verification codes, recovery secrets, authentication proofs, and prompts whose direct purpose is authentication
      belong to NJT-0169. A key log containing both ordinary content and real authentication secrets may map to both only
      after each result class is evidenced. T1115 and NJT-0214 complete when content is successfully returned by a clipboard
      service; this technique covers the input stream before content enters a clipboard or application. T1185 and NJT-0145
      read page, document, or session content already rendered or returned by a browser; this technique is limited to values
      the user is forming and submitting.
  - zh: 进程注入、API Hook 安装或浏览器扩展加载由 T1055 等执行技术解释其进入方式，不能替代输入结果。诱导用户打开文件、点击链接或启动程序归 T1204；只有其后的输入被实际取得时本技术才成立。页面或表单被改写还可单独评估
      T1565.002，取得后写入暂存区、压缩、加密和外送分别归 T1074、T1560 与 TA0010。获批无障碍、输入法、远程支持、表单分析、反欺诈、自动化测试和质量回放须以签名、版本、工单、数据合同、字段最小化和目的地排除。
    en: Process injection, API-hook installation, or browser-extension loading is explained by execution techniques such as
      T1055 and does not substitute for an input outcome. Inducing a user to open a file, follow a link, or start a program
      belongs to T1204; this technique begins only when subsequent input is actually acquired. A changed page or form can
      also warrant T1565.002, while staging, compression, encryption, and sending after acquisition belong to T1074, T1560,
      and TA0010. Approved accessibility, input methods, remote support, form analytics, fraud controls, automated testing,
      and quality replay require exclusion through signer, version, ticket, data contract, field minimization, and destination.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在受控工作站或 RDP 会话中，攻击者可持续或按会话使用低层 Hook、事件 tap、输入设备读取或辅助功能权限，记录用户在文档、搜索、聊天、管理控制台和业务应用中的输入，并附加用户、进程或窗口语境。DRBControl 的公开分析直接展示每个
        RDP 会话运行键盘记录逻辑，并把用户名、时间、进程、窗口标题和捕获输出写入混淆报告文件；该结果支持一般 Collection，但不能据此假定所有记录都是凭据。
      en: On a compromised workstation or RDP session, an adversary can use a low-level hook, event tap, input-device read,
        or accessibility authority continuously or by session to record input in documents, search, chat, administrative consoles,
        and business applications, adding user, process, or window context. Public analysis of DRBControl directly shows keylogging
        logic running in each RDP session and writing the username, time, process, window title, and captured output to an
        obfuscated report file. That outcome supports general Collection but does not establish that every record was a credential.
    - zh: 在受侵电商、客户门户或业务 Web 应用中，攻击者可修改脚本、模板或服务端控制器，让受信来源内的输入表单增加覆盖字段、监视值变化或把提交复制到恶意处理路径。Sucuri 的 PrestaShop 事件中，恶意 JavaScript
        覆盖支付表单、另一个脚本监视支付字段并向站点自身路径发送数据，服务端代码识别请求并把窃取的支付资料外送。域名和结账语境保留，但实际字段结果和第二接收链已经成立。
      en: In a compromised commerce site, customer portal, or business web application, an adversary can change scripts, templates,
        or server controllers so a data-entry form within the trusted origin adds overlaid fields, observes value changes,
        or copies a submission into a malicious processing path. In Sucuri's PrestaShop case, malicious JavaScript overlaid
        a payment form, another script monitored payment fields and sent data to a path on the same site, and server-side
        code recognized the request and forwarded stolen payment details. The domain and checkout context remained, while
        actual field results and a second receiver chain were established.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 消费者外路径要求攻击者在目标交互会话运行代码或控制驱动、输入设备、全局 Hook、TCC/辅助功能权限或等价输入观察面，并能把原始事件映射为字符、窗口、用户或操作语义。攻击者可能等待目标应用出现或长期驻留，但布局差异、secure
          desktop、受保护输入、隔离桌面、硬件设备与缺少用户活动都会限制结果；管理员权限本身不保证读取所有输入面。
        en: The consumer-external path requires code in the target interactive session or control of a driver, input device,
          global hook, TCC or accessibility authority, or equivalent observation surface, plus the ability to map raw events
          to characters, windows, users, or operational meaning. The adversary may wait for a target application or remain
          resident, but layout differences, secure desktop, protected input, isolated desktops, hardware devices, and absent
          user activity constrain outcomes. Administrator rights alone do not guarantee access to every input surface.
      - zh: 受信来源路径要求攻击者能修改部署制品、第三方脚本依赖、模板、服务端控制器或应用运行态，并理解正常字段、提交路径和业务反馈。攻击者还需选择接收路径，使输入到达恶意逻辑并在必要时保留足够正常流程以避免用户立即停止。签名制品、外部黄金哈希、只读部署、严格
          CSP/SRI、独立支付字段、出站限制和服务器端路由完整性都会压缩空间。
        en: The trusted-origin path requires authority to change deployment artifacts, third-party script dependencies, templates,
          server controllers, or application runtime, along with knowledge of expected fields, submission paths, and business
          feedback. The adversary must select a receiving path that delivers input to malicious logic and, where needed, preserve
          enough normal workflow to keep the user engaged. Signed artifacts, external golden hashes, read-only deployment,
          strict CSP and SRI, isolated payment fields, egress restriction, and server-route integrity constrain that path.
    defender_model:
      paragraphs:
      - zh: 防守方理想上拥有端点输入权限和设备访问、进程与模块、文件和网络结果、获批输入软件清单，以及应用发布制品、浏览器实际资源与表单图、CSP/SRI 报告、反向代理、服务端路由和出站网络。共同关联键包括设备、用户、交互 session、process_guid、页面
          origin、release_id、asset_hash、form_id、route、目的地和时间。真实字段值不应作为集中检测数据，字段模式可用经治理的摘要或分类表示。
        en: Ideally the defender has endpoint input authority and device access, process and module, file and network outcomes,
          an approved-input-software inventory, plus application release artifacts, the browser's actual resource and form
          graph, CSP or SRI reports, reverse-proxy data, server routes, and outbound network telemetry. Common join keys include
          device, user, interactive session, process GUID, page origin, release ID, asset hash, form ID, route, destination,
          and time. Actual field values should not be centralized for detection; governed digests or classifications can represent
          field schemas.
      - zh: 现实中 Windows 默认日志不记录低层键盘 Hook，macOS Input Monitoring 主要证明权限，Linux auditd 需事先配置设备规则；未受管浏览器可能没有资源和表单目标遥测，同源恶意路径又可能绕开跨域规则。若只能看到权限、脚本差异或提示存在，防守只能输出
          exposure；只有输入结果或经实验验证的结果链出现时才升级为 capture。合法无障碍、输入法、测试、标签管理、A/B 发布、反欺诈和支付服务集成必须按精确任务与版本消歧。
        en: In practice, default Windows logs do not record low-level keyboard hooks, macOS Input Monitoring primarily proves
          authority, and Linux auditd needs preconfigured device rules. Unmanaged browsers may lack resource and form-target
          telemetry, while a malicious same-origin path can evade cross-origin rules. If only permission, script drift, or
          a prompt is visible, defenders can report exposure only; capture requires an input outcome or a lab-validated outcome
          chain. Accessibility, input methods, testing, tag management, A/B releases, fraud controls, and payment-service
          integrations must be disambiguated by exact task and version.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 在预期消费者审计边界外形成输入副本
    en: Form the input copy outside the intended consumer's audit boundary
  analysis:
    paragraphs:
    - zh: 攻击者从全局 Hook、事件 tap、设备流或辅助功能面读取输入，使预期应用继续接收相同事件，却不生成“内容被第二读者复制”的应用记录。行为设计把采集痕迹从业务消费者转移到端点输入权限、设备访问和观察进程结果，造成观察面分离；只有把这些面与缓冲或外联连接，防守方才能从
        exposure 走到 capture。平台文档和 DRBControl 结果支持该链，但没有检出率测量，置信度为 medium。
      en: The adversary reads input through a global hook, event tap, device stream, or accessibility surface, allowing the
        intended application to receive the same event without an application record that a second reader copied content.
        The design shifts collection traces from the business consumer to endpoint input authority, device access, and observer-process
        outcomes, separating observation planes. Defenders move from exposure to capture only by joining those surfaces to
        a buffer or egress. Platform documentation and the DRBControl outcome support the chain, but no detection-rate measurement
        is available, leaving medium confidence.
  confidence: medium
  evidence_refs:
  - REF-000726
  - REF-000727
  - REF-000728
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 借受信数据入口身份掩盖恶意输入接收者
    en: Borrow a trusted data-entry identity to mask the malicious receiver
  analysis:
    paragraphs:
    - zh: 攻击者把覆盖表单、字段观察或接收处理逻辑放入用户预期访问的真实应用来源，使域名、TLS、品牌与导航继续指向合法服务，而输入又进入第二接收链。恶意实体借用受信来源的特征分布，令只比较域名或跨域目的地的检测失去区分力；制品哈希、浏览器实际表单图、同源路由和服务端外联仍会留下差异。PrestaShop
        案例直接证明输入与恶意结果，泛化到其他应用的告警效果未测量，置信度为 medium。
      en: The adversary places an overlaid form, field observer, or receiving handler inside the genuine application origin
        the user expects to visit, preserving domain, TLS, branding, and navigation while input also enters a second receiver
        chain. The malicious entity borrows the trusted origin's feature distribution, weakening detections that compare only
        domain or cross-origin destinations. Artifact hashes, the browser's actual form graph, same-origin routes, and server
        egress still preserve differences. The PrestaShop case directly establishes input and malicious outcome, but alert
        effects across applications are unmeasured, leaving medium confidence.
  confidence: medium
  evidence_refs:
  - REF-001128
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 建议两个 Niji 原生子项。消费者外输入流取得控制副本相对预期消费者的位置，使应用审计缺少第二读者并把检测责任转到端点输入权限、设备与观察进程结果。受信来源数据入口介入控制恶意接收者是否寄生在真实应用来源，使域名和会话外观保留并把检测责任转到发布制品、消费者表单图、同源路由与服务器第二输出。两项可以共现，但有独立完成证据、残余痕迹和防御对象。
      en: Two Niji-native children are proposed. Consumer-External Input-Stream Acquisition controls the copy's position relative
        to the intended consumer, leaving application audit without the second reader and moving defense to endpoint input
        authority, devices, and observer-process outcomes. Trusted-Origin Data-Entry Interposition controls whether the malicious
        receiver inhabits a genuine application origin, preserving domain and session appearance while moving defense to release
        artifacts, the consumer form graph, same-origin routes, and second server output. The two can coexist but have separate
        completion evidence, residual traces, and defense objects.
    - zh: ATT&CK 的 Credential API Hooking、GUI Input Capture、Keylogging 和 Web Portal Capture 只作为广度背景。API、键盘、鼠标、GUI、Web、操作系统、产品、字段类型和
        Hook 方法均不成为兄弟项；凭据接收路径保持 NJT-0169，窗口或页面条件门控保持 NJS-0132-001，捕获后加密、缓存、暂存和发送保持后继对象。独立仿冒的非认证输入界面因缺少当前结果级证据和独立防御链而 deferred，不为接近
        ATT&CK 数量正式化。
      en: ATT&CK Credential API Hooking, GUI Input Capture, Keylogging, and Web Portal Capture provide breadth context only.
        APIs, keyboards, mice, GUIs, web, operating systems, products, field types, and hook methods do not define siblings.
        Credential receiver paths remain under NJT-0169, window or page context gating under NJS-0132-001, and post-capture
        encryption, buffering, staging, and sending under successor objects. A stand-alone impersonated interface for non-authentication
        input remains deferred for lack of current outcome-level evidence and a distinct defense chain and is not formalized
        to approach the ATT&CK count.
  coverage: established
  subtechnique_refs:
  - NJS-0220-001
  - NJS-0220-002
