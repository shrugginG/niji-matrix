  name_en: Victim-Service Response Pull Exfiltration
  name_zh: 受害服务响应式拉取外传
decision: add
rationale_zh: 固定 TA0010 父候选均不能稳定承载“先写入受害者对外服务路径，再由外部请求触发受害服务响应外送”这一方向反转行为。Dark Halo 公开案例给出邮箱导出、受保护归档、OWA 服务器路径和公开
  HTTPS 取回 URL，证明行为链及区别于仅暂存的结果。该对象具有独立检测数据和缓解控制，填补 Niji 战术级缺口。
rationale_en: None of the fixed TA0010 parents stably owns the direction reversal in which data is first written
  into a victim-facing service path and an outside request triggers the victim service to send it. The public Dark
  Halo case gives mailbox export, protected archival, an OWA server path, and a public HTTPS retrieval URL, establishing
  the chain and its result beyond staging alone. The object has distinct detection data and mitigation controls
  and fills a Niji tactic-level gap.
scope_notes_zh: 纳入受害者自有服务路径中的已收集数据与外部请求触发的服务响应；外部 SaaS 接收归 T1567，同云账户转移归 T1537，仅暂存归 NJT-0134，同一 C2 关系归 NJT-0192。
scope_notes_en: Include collected data in a victim-owned served path and the service response triggered by an outside
  request. External SaaS receipt belongs to T1567, same-service account transfer to T1537, staging alone to NJT-0134,
  and an existing C2 relationship to NJT-0192.
gap_statement_zh: 填补受害服务自身成为外传发送方、而端点不主动连接攻击者目的地的方向反转缺口。
gap_statement_en: Fills the direction-reversal gap where the victim service becomes the sender and the endpoint
  does not initiate a connection to an attacker destination.
