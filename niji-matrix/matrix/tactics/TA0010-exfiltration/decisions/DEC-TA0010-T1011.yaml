candidate:
  source_type: attack
  source_attack_id: T1011
  source_attack_version: '19.1'
  name_en: Exfiltration Over Other Network Medium
  name_zh: 经其他网络介质渗出
decision: retain
rationale_zh: 'ATT&CK Enterprise 19.1 的 T1011 直接锚定通过不同于主要 C2/企业互联网路径的 Wi-Fi、调制解调器、蜂窝、Bluetooth 或其他 RF 网络介质外传，并明确指出这些连接没有经过同一企业网络，可能获得较弱的保护与监测。这个路径与传感器边界变化本身就是稳定的匿迹问题，因此保留父技术。正式
  Niji 范围仍要求攻击者有意控制替代网络路径并证明数据离开受害环境，不能把设备具备第二块网卡或一次正常无线连接直接视为匿迹。


  T1011.001 只作为 Bluetooth 实现广度参考。开放分类后，稳定差异收敛为“通过独立默认路由或公网出口直接外送”和“把数据交给近距对等接收者”两条轴：前者在端点仍保留可路由远端与次要接口痕迹，后者只在本地短距链路留下
  peer、会话与发送字节，接收者身份还依赖物理邻近。两者使用不同关联键和控制措施，不按 Bluetooth、Wi-Fi、蜂窝或产品名称划分。'
rationale_en: 'ATT&CK Enterprise 19.1 anchors T1011 in exfiltration over Wi-Fi, modem, cellular, Bluetooth, or another
  RF network medium that differs from the primary C2 or enterprise Internet path and explicitly notes that such
  connections do not traverse the same enterprise network and may receive weaker protection and monitoring. That
  path and sensor-boundary change is itself a stable stealth problem, so the parent is retained. Formal Niji scope
  still requires attacker control of the alternate network path and evidence that data leaves the victim environment;
  possession of a second adapter or one normal wireless connection does not establish stealth.


  T1011.001 is used only as breadth context for one Bluetooth implementation. Open taxonomy search converged on
  two stable axes: direct sending through an independently routed interface or public egress, and delivery to a
  proximity-scoped peer. The first retains a routable remote destination and secondary-interface traces at the endpoint;
  the second leaves only local short-range peer, session, and sent-byte traces, with receiver attribution dependent
  on physical proximity. They require different joins and controls and are not divided by Bluetooth, Wi-Fi, cellular,
  or product name.'
scope_notes_zh: 纳入不经过主要企业网络观察面的独立路由接口或近距对等网络；协议替代、控制面复制和物理介质保管分别归 T1048、T1020 与 T1052。
scope_notes_en: Include independently routed interfaces or proximity peer networks outside primary enterprise observation;
  protocol substitution, control-plane replication, and physical-media custody belong to T1048, T1020, and T1052.
