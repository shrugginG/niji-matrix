candidate:
  source_type: attack
  source_attack_id: T1020
  source_attack_version: '19.1'
  name_en: Automated Exfiltration
  name_zh: 自动化数据渗出
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 将 T1020 定义为在 Collection 后通过自动处理外传数据，并列出一个“Traffic Duplication”子项。自动化本身主要说明处理方式和规模能力，并不当然构成匿迹；ESET
  对 Gamaredon 的研究既记录自动上传，也明确指出该组织几乎不努力保持低可见性。Niji 因此保留父行为但收紧为：自动选择、触发、交接或复制必须有意造成可论证的痕迹重排或防守观察差异，才能作为正式匿迹技术，故建议
  adapt。


  现有证据支持两项独立 Niji 变量。Attor 将无网络能力的采集插件、共享 Upload 文件夹与独立 File uploader 串成自动流水线，使数据取得与外部连接落在不同进程和存储边界；国家机构联合通告与 Google
  Cloud 审计语义则支持不改变原通信交付、由网络或云控制面建立复制边并向独立收集器交付副本。按时间重复、传输大小以及通道或介质选择分别属于 T1029、T1030 与相邻通道候选，不能借“自动”合并。'
rationale_en: 'ATT&CK Enterprise 19.1 defines T1020 as exfiltrating data through automated processing after Collection
  and lists one Traffic Duplication child. Automation by itself primarily describes processing and scale and does
  not inherently create stealth; ESET''s Gamaredon research documents automatic upload while explicitly observing
  that the group made little effort to stay under the radar. Niji therefore keeps the parent behavior but narrows
  it to automated selection, triggering, handoff, or replication that deliberately creates a defensible change in
  traces or defender observation, supporting an adapt decision.


  Available evidence supports two independent Niji variables. Attor joins collection plugins with no network capability,
  a shared Upload folder, and a separate File uploader into an automated pipeline, placing acquisition and external
  connection in different process and storage boundaries. A joint government advisory and Google Cloud audit semantics
  support a separate copy edge created in network or cloud control planes without changing delivery on the original
  path. Repetition by time, transfer size, and channel or medium choice belong to T1029, T1030, and adjacent channel
  candidates respectively and cannot be collapsed under automation.'
scope_notes_zh: 纳入有独立痕迹重排或观察差异的自动生产—处理—外送链；普通脚本、定时、规模和通道选择分别由父级或相邻对象处理。
scope_notes_en: Include automated production, processing, and egress chains with a distinct trace rearrangement
  or observation difference; ordinary scripts, timing, volume, and channel choice remain parent or adjacent concerns.
