candidate:
  source_type: attack
  source_attack_id: T1029
  source_attack_version: '19.1'
  name_en: Scheduled Transfer
  name_zh: 定时传输
decision: adapt
rationale_zh: ATT&CK 19.1 将只在指定时刻或间隔外传数据归入 T1029。Sedreco 的待发文件和独立外传计时器证明攻击者可把数据产生与外送分离，使短窗关联失去相邻事件；因此保留父行为，但将 Niji
  范围收紧到有可论证观察变化的攻击者时间控制。纯 C2 心跳、合法作业调度和仅为可用性等待都不准入。业务时窗对齐虽有代码门控线索，却缺少与受害者常态背景和实际防守差异相匹配的证据，本批暂缓其正式子项。
rationale_en: ATT&CK 19.1 places data exfiltration at selected times or intervals under T1029. Sedreco's outbound
  file and independent transfer timer establish that an attacker can separate data production from egress, breaking
  short-window adjacency. The parent behavior is retained, but Niji scope is narrowed to attacker timing control
  with a defensible observation change. C2-only heartbeats, ordinary job schedules, and availability waits do not
  qualify. Business-window alignment has code-level gating evidence but lacks victim-background and defender-difference
  support at the proposed child scope, so that child is deferred in this batch.
scope_notes_zh: 纳入攻击者控制的实际外传释放周期；传输规模、通道与自动触发分别归相邻候选。业务时窗轴留在研究层，不作为本批正式子项或机理。
scope_notes_en: Include attacker-controlled release periods for actual data egress; volume, channel and automated
  triggering have adjacent owners. The business-window axis remains research-only and is not a formal child or mechanism
  in this batch.
