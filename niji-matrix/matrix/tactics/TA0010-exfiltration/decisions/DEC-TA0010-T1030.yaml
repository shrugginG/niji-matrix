  source_attack_version: '19.1'
  name_en: Data Transfer Size Limits
  name_zh: 数据传输大小限制
decision: adapt
rationale_zh: T1030 在 Enterprise 19.1 的父级定义把固定大小切块或低于阈值的报文外传归入 TA0010；其案例又包含明确的带宽限速。保留控制外传规模这一行为锚点，但把 Niji 范围改写为攻击者有意改变单次外传单元或一段时间内的发送量，进而削弱单事件或短窗口阈值判断。普通传输协议分段、目的服务的强制大小限制、网络拥塞以及业务流量整形都不能仅凭小块或低速外观准入。
rationale_en: The Enterprise 19.1 T1030 parent anchors fixed-size chunks and packets kept below thresholds within
  TA0010, while its examples also include explicit bandwidth limiting. Keep attacker control of exfiltration magnitude
  as the behavioral anchor, but adapt the Niji scope to intentional control of either one outbound unit or the amount
  sent over a time window, thereby weakening single-event or short-window threshold judgments. Ordinary protocol
  segmentation, a destination service's mandatory size ceiling, congestion, and authorized traffic shaping do not
  qualify merely because transfers look small or slow.
scope_notes_zh: 单元体积与时间窗体积是两条可并存的变量；T1029 管理时刻或周期，T1020 管理自动触发，T1041/T1048/T1567 管理通道，NJT-0133 管理传输前归档内容。
scope_notes_en: Unit size and time-window volume are independent, combinable variables; T1029 owns clock or cycle
  choice, T1020 automated triggering, T1041/T1048/T1567 channels, and NJT-0133 pre-transfer archival content.
