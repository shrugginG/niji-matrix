id: DEC-TA0010-T1041
tactic_ref: TA0010
candidate:
  source_type: attack
  source_attack_id: T1041
  source_attack_version: '19.1'
  name_en: Exfiltration Over C2 Channel
  name_zh: 通过 C2 通道外传
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 将 T1041 定义为通过已经存在的命令控制通道、以与命令控制相同的协议外传被盗数据。该行为在 TA0010 中独立成立，但 Niji 准入必须把“发往
  C2 服务器”收窄为对既有逻辑控制关系的实际复用：外传不另建专用目的关系，导致连接、进程、协议和控制端历史同时归属于 C2 与数据外送，防守方更难从已经识别或尚未识别的控制流中分离外传阶段。SolarMarker 与 FakeUpdates
  的原始分析分别展示了既有加密 HTTP C2 上的数据外送，以及同一 C2 请求族先回传系统信息、后回传截图的真实实现。
rationale_en: Enterprise ATT&CK 19.1 defines T1041 as exfiltrating stolen data through an existing command-and-control
  channel with the same protocol used for C2. The behavior is independently relevant to TA0010, but Niji admission
  must narrow “sent to a C2 server” to actual reuse of an existing logical control relationship. Exfiltration creates
  no dedicated destination relationship, so its connection, process, protocol, and controller history are shared
  with C2 and defenders have more difficulty separating the data-loss phase from control traffic whether or not
  that traffic has already been identified as C2. Primary SolarMarker and FakeUpdates analyses respectively show
  data leaving through an existing encrypted HTTP C2 channel and a repeated C2 request family carrying system information
  and later screenshots.
scope_notes_zh: “通道”按已承担任务下发、回调或结果回送的逻辑 C2 关系判定，不要求单一 TCP/TLS socket 始终存活。T1048 负责切换到不同于 C2 的协议路径；T1567 负责以外部 Web
  服务为外传媒介；T1132、T1573 与 NJT-0152 分别负责编码、加密和 C2 消息混淆；NJT-0160 负责 C2 应用会话的控制关系。上述对象可以与本候选并列，但均不能仅凭目标是 C2 服务器替代“既有关系复用”的证据。
scope_notes_en: “Channel” is assessed as a logical C2 relationship that already carries tasking, callbacks, or results;
  one TCP or TLS socket need not remain alive throughout. T1048 owns a path using a protocol separate from C2, T1567
  owns an external web service used as an exfiltration medium, and T1132, T1573, and NJT-0152 own encoding, encryption,
  and C2-message obfuscation. NJT-0160 owns the control relationship of the C2 application session. These objects
  may co-occur with this candidate, but none substitutes for evidence of relationship reuse merely because the destination
  is a C2 server.
