id: DEC-TA0010-T1048
tactic_ref: TA0010
candidate:
  source_type: attack
  source_attack_id: T1048
  source_attack_version: '19.1'
  name_en: Exfiltration Over Alternative Protocol
  name_zh: 经替代协议渗出
decision: retain
rationale_zh: 'Enterprise ATT&CK 19.1 将 T1048 定义为使用不同于既有命令与控制通道的网络协议外传数据，并允许数据送往不同于主 C2 的网络位置。该父行为直接属于 TA0010，且
  OilRig、ProjectSauron、MirrorFace 与 Dark Halo 资料分别证明攻击者会把外传移到 FTP、DNS、邮件、SFTP 或受害者 Web 服务路径，因此建议保留父语义。Niji 正式内容应要求能够说明既有
  C2 关系与替代外传关系的差异；若同一会话同时承担命令、控制和回传而没有独立协议或接收路径，则应交给 T1041。


  固定版三个 ATT&CK 子项按对称加密、非对称加密和未加密划分密码实现。该划分不直接成为 Niji taxonomy：TLS 和 SSH 在握手后也使用对称加密，密钥类型本身不会稳定改变防守动作；未加密协议又可同时具有明文、编码、字段嵌入和独立接收端。Niji
  应改按协议相对业务角色的偏离、载荷是否伪装为协议语义、检查点能否解释内容，以及是否由受害服务反向提供数据来划分。'
rationale_en: 'Enterprise ATT&CK 19.1 defines T1048 as stealing data through a network protocol different from the
  existing command-and-control channel and permits delivery to a network location other than the main C2 server.
  The parent behavior directly serves TA0010, and OilRig, ProjectSauron, MirrorFace, and Dark Halo reporting demonstrates
  movement of exfiltration onto FTP, DNS, mail, SFTP, or a victim-hosted web path. Retain the parent semantics,
  while requiring canonical Niji content to establish the difference between the existing C2 relationship and the
  alternative exfiltration relationship. A single session carrying commands, control, and results without an independent
  protocol or receiver path belongs under T1041.


  The three fixed-version ATT&CK children divide symmetric encryption, asymmetric encryption, and no encryption.
  That cryptographic implementation taxonomy is not imported into Niji. TLS and SSH use symmetric protection after
  key exchange, so key type does not create a stable defensive boundary, while an unencrypted protocol may carry
  clear text, encoding, field embedding, or a separate receiver. Niji should instead partition protocol deviation
  from workload role, camouflage of payload as protocol semantics, content interpretability at the inspection point,
  and victim-service delivery in response to an outside fetch.'
scope_notes_zh: T1048 要求外传协议或接收路径与既有 C2 可区分。复用既有 C2 关系归 T1041；第三方 Web 服务作为目的地归 T1567；同一云服务内账户转移归 T1537；企业主网络之外的网络介质归
  T1011；物理介质归 T1052。协议编码、加密、暂存和归档可伴随标注，但不改变直接行为对象。
scope_notes_en: T1048 requires an exfiltration protocol or receiver path distinguishable from the existing C2 relationship.
  Reuse of that C2 relationship belongs to T1041; a third-party web service as destination belongs to T1567; same-service
  cloud account transfer belongs to T1537; a network medium outside the primary enterprise network belongs to T1011;
  and physical media belongs to T1052. Encoding, encryption, staging, and archiving may be co-tagged but do not
  change the direct behavioral object.
