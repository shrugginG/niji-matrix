id: DEC-TA0010-T1052
tactic_ref: TA0010
candidate:
  source_type: attack
  source_attack_id: T1052
  source_attack_version: '19.1'
  name_en: Exfiltration Over Physical Medium
  name_zh: 通过物理介质外传
decision: adapt
rationale_zh: Enterprise ATT&CK 19.1 将 T1052 定义为通过可移动驱动器等物理介质外传数据，并明确介质既可成为最终外传点，也可在原本断开的系统之间跳转。该行为在 TA0010 中独立成立，但
  Niji 准入需从“使用介质”收窄为可证明的数据与保管链：受害数据被写入或置于可携介质，介质随后断开并脱离原观察域，由攻击者、协作者或后继系统接续读取。ESET USBStealer 研究给出联网 A 与隔离 B 间同一介质往返、B
  收集并在后续插入时写回介质、再由 A 侧取回的完整能力链；ProjectSauron 研究给出从隔离网向联网系统搬运数据的专用介质模块。
rationale_en: 'Enterprise ATT&CK 19.1 defines T1052 as exfiltrating data through a physical medium such as a removable
  drive and explicitly states that the medium may be the final exfiltration point or a hop between otherwise disconnected
  systems. The behavior is independently relevant to TA0010, but Niji admission narrows “using media” to an evidenced
  data and custody chain: victim data is written to or placed on a carryable medium, the medium is disconnected
  and leaves the original observation domain, and an attacker, collaborator, or successor system later retrieves
  it. ESET''s USBStealer research supplies a complete capability chain in which one drive moves between Internet-connected
  A and isolated B, B collects and writes data on a later insertion, and A-side operators retrieve it. ProjectSauron
  research documents a dedicated media module moving data from isolated to Internet-connected systems.'
scope_notes_zh: 固定基线唯一 ATT&CK 子项 T1052.001 仅表示 USB 设备实现，不继承为 Niji 子技术。正式判定需要连接数据复制或底层写入、介质断开、保管或物理跨区、以及接收侧取用中的相邻阶段；普通介质插入、本地备份或写入后介质始终留在原系统均不足。Bluetooth、蜂窝或其他设备在传输期间保持网络会话时归
  T1011；介质只作为外传前本地汇聚点且未发生物理转运时归 T1074。
scope_notes_en: The fixed baseline's sole ATT&CK child, T1052.001, represents a USB implementation and is not inherited
  as a Niji child. Formal classification needs adjacent stages among data copy or low-level write, media disconnection,
  custody or physical zone crossing, and receiver-side retrieval. Ordinary insertion, local backup, or a write to
  media that remains attached to the original system is insufficient. Bluetooth, cellular, or other devices that
  maintain a network session during transfer belong to T1011. Media used only as a local aggregation point before
  exfiltration, without physical transport, belongs to T1074.
