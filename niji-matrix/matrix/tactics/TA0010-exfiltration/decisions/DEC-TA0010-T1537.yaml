candidate:
  source_type: attack
  source_attack_id: T1537
  source_attack_version: '19.1'
  name_en: Transfer Data to Cloud Account
  name_zh: 向云账户转移数据
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 将 T1537 锚定为利用共享、同步、复制或备份，把数据转移到同一云服务上攻击者控制的另一个账户；这种服务内控制权变化可以避开只观察外部网络接口或
  C2 大流量的检测。固定页面同时列出匿名链接，以及仅说明用 Mega/AzCopy 向云或自有基础设施传输的实例，它们不都证明“同服务跨账户”结果。Niji 因此建议 adapt：正式范围要求另一账户/租户取得同一对象的有效权利或形成独立持久副本，且需证明攻击者控制或未获批准的外部主体。


  开放分类收敛为两项以对象身份和撤销结果为核心的 Niji 变量。原对象跨账户授权投射保留 object ID，只改变 owner、ACL、share、link 或外部主体权利；跨账户持久副本脱离则在目标账户生成新的对象/快照身份，使源侧撤销无法收回已经复制的数据。同步、备份、共享和复制不直接成为子项，授权工作流与服务身份也只有在改变上述对象/控制结果时才归入相应轴。'
rationale_en: 'ATT&CK Enterprise 19.1 anchors T1537 in sharing, syncing, copying, or backing up data to another
  adversary-controlled account on the same cloud service, a service-internal change of control that can evade monitoring
  focused on external interfaces, C2, or large network transfers. The fixed page also lists anonymous links and
  examples that merely describe Mega or AzCopy transfer to cloud or actor infrastructure, which do not all establish
  a same-service cross-account result. Niji therefore recommends adapt: formal scope requires another account or
  tenant to gain effective rights to the same object or materialize an independent durable replica, with evidence
  that the recipient is attacker-controlled or otherwise unapproved.


  Open taxonomy search converged on two Niji variables centered on object identity and revocation outcome. Same-Object
  Cross-Account Entitlement Projection preserves the object ID while changing owner, ACL, share, link, or external-principal
  rights. Cross-Account Durable Replica Detachment creates a new object or snapshot identity in the destination
  account, so source-side revocation cannot recover the copied data. Sync, backup, sharing, and copy are not children
  by themselves; delegated workflows and service identities enter an axis only when they produce the corresponding
  object and control outcome.'
scope_notes_zh: 正式范围要求同一云服务内的目标账户或租户取得访问权或独立副本；同账户暂存、下载再上传和普通外部 Web 服务上传不属于本项。
scope_notes_en: Formal scope requires a target account or tenant in the same cloud service to obtain access or an
  independent replica; same-account staging, download then upload, and ordinary external web-service upload are
  outside this object.
