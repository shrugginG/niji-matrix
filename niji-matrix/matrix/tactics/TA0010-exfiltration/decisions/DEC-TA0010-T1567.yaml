id: DEC-TA0010-T1567
tactic_ref: TA0010
candidate:
  source_type: attack
  source_attack_id: T1567
  source_attack_version: '19.1'
  name_en: Exfiltration Over Web Service
  name_zh: 经 Web 服务渗出
decision: retain
rationale_zh: 'Enterprise ATT&CK 19.1 将 T1567 定义为利用既有合法外部 Web 服务而非主要 C2 通道外传数据；服务常已被组织访问并获防火墙允许，TLS 又会降低网络侧内容可见性。真实事件中，Bazar/Conti
  将共享目录送入 MEGA，InvisibleFerret 使用 Telegram API bot token 把归档上传到聊天，Shai-Hulud 将本机收集的秘密写入公开 GitHub 仓库并经 Webhook 服务发送。该行为直接服务
  TA0010，建议保留父语义。


  固定版四个 ATT&CK 子项按代码仓库、云存储、文本存储和 Webhook 这种服务或承载实现划分，不能导入 Niji。跨这些实现更稳定的匿迹变量是：接收者账号、聊天、仓库或端点被共享服务域名遮蔽；数据被保存为服务对象后由攻击者异步取回；以及服务端
  Webhook/集成代表受害租户把数据主动转交给外部端点。这三项改变不同痕迹、归因键和防御动作，适合作为 Niji 分类。'
rationale_en: 'Enterprise ATT&CK 19.1 defines T1567 as using an existing legitimate external web service to exfiltrate
  data rather than the primary C2 channel. Organizations commonly already reach the service and permit it through
  firewalls, while TLS reduces network-content visibility. In observed incidents, Bazar or Conti sent a network
  share to MEGA, InvisibleFerret used a Telegram API bot token to upload an archive to a chat, and Shai-Hulud wrote
  locally harvested secrets into public GitHub repositories and sent them through a webhook service. The behavior
  directly serves TA0010, so retain the parent semantics.


  The four fixed-version ATT&CK children divide code repositories, cloud storage, text storage, and webhooks, which
  are service or carriage implementations and are not imported into Niji. More stable cross-service stealth variables
  are an account, chat, repository, or endpoint hidden behind a shared service domain; data persisted as a service
  object for later adversary retrieval; and a server-side webhook or integration that delivers victim-tenant data
  to an outside endpoint on the tenant''s behalf. These change different traces, attribution keys, and defensive
  actions and therefore form suitable Niji axes.'
scope_notes_zh: T1567 的直接对象是合法外部 Web 服务作为接收或转交媒介。若数据已在同一云服务并通过共享、复制、同步、导出或备份改变到账户/租户所有权，归 T1537；若复用既有逻辑 C2 关系，归
  T1041；只有协议或接收关系相对 C2 改变但服务身份不是核心时归 T1048。把数据放入受害者自有 Web 根目录后由外部取回不使用外部服务，继续作为 TA0010 原生缺口候选。
scope_notes_en: T1567 directly concerns a legitimate external web service as receiver or relay. If data already
  resides in the same cloud service and sharing, copying, synchronization, export, or backup changes account or
  tenant control, T1537 owns the behavior. Reuse of the existing logical C2 relationship belongs to T1041. A protocol
  or receiver change relative to C2 belongs to T1048 when service identity is not the defining object. Data placed
  in a victim-owned web root and fetched from outside uses no external service and remains a TA0010 native-gap candidate.
