research:
  limitations:
    paragraphs:
    - zh: ATT&CK 的 T1030 说明可用于规避传输量阈值，但 Play 与 LunarWeb 原始资料主要证明发生了分段，不提供具体阈值、被绕过的产品或告警前后对照。LuminousMoth 绕过的 5 MB
        限额可能是服务兼容性限制，故不据此提升匿迹置信度。需要从外传上下文与防守规则共同验证有意限额，不能从大小重复单独判定恶意。
      en: ATT&CK says the technique can evade transfer-size alerts, but primary Play and LunarWeb reporting mainly
        proves segmentation and gives no specific defender threshold, bypassed product, or before-and-after alert
        comparison. LuminousMoth's 5 MB limit may be a service compatibility ceiling, so it does not raise stealth
        confidence. Intentional capping needs exfiltration context and defender-rule evidence; repeated sizes alone
        do not establish malicious use.
