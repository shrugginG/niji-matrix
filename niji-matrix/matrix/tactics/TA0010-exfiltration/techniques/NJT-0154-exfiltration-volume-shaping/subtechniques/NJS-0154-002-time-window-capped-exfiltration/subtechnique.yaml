research:
  limitations:
    paragraphs:
    - zh: StealBit 逆向支持设计能力和作者所述规避目标，却未公开某企业监测规则及真实告警下降；DFIR 的 Rclone --bwlimit 10M 也可能兼顾稳定性或链路占用。不同计量来源对长连接、TLS
        与代理拆分的时间粒度不同，实施分析前须验证字段和采样，不应把任何低速连接自动归为恶意限额。
      en: StealBit reverse engineering supports the capability and its stated evasion purpose but does not publish
        an enterprise rule or observed alert reduction. The DFIR Rclone --bwlimit 10M choice could also reflect
        stability or link-use concerns. Telemetry sources differ in granularity across long connections, TLS, and
        proxies, so an implementation must validate fields and sampling rather than labeling every slow connection
        as malicious capping.
