research:
  limitations:
    paragraphs:
    - zh: T1030 固定版提供父行为和可能的阈值规避机理，而多份原始案例只能证明切块或限速的发生，不能证明当地检测规则实际漏报。StealBit 的作者级逆向对速率规避意图最明确，DFIR 的 Rclone 事件则对真实使用最明确；因此速率子项的设计因果强于具体攻击效果，切块子项保持中等置信度。
      en: Fixed-version T1030 anchors parent behavior and a possible threshold-evasion mechanism, while several
        primary incidents establish chunking or rate capping without proving a local rule missed an alert. StealBit
        reverse engineering is clearest about rate-evasion design and the DFIR case about real use; the rate child's
        design causality is stronger than proof of operational effect, and the chunk child remains medium-confidence.
    - zh: 分块检测需要能见 HTTP 请求或服务对象边界，速率检测需要经过部署验证的周期字节字段；任一前提不满足时都应降低覆盖声称。连接数量、单个结束时的 Zeek conn.log 与 DeviceNetworkEvents
        的进程归属均不能独立替代请求大小或窗内发送量。ATT&CK 过程实例还须逐条核对原始报告，避免把入站分段写入误记为外传。
      en: Chunk detection needs visible HTTP request or service-object boundaries, while rate detection needs deployment-validated
        periodic byte fields. Coverage claims must be reduced when either prerequisite is absent. Connection count,
        a Zeek conn.log emitted only at connection end, and DeviceNetworkEvents process attribution cannot independently
        substitute for request size or in-window sent volume. ATT&CK procedure examples also require primary-source
        checking so inbound segmented writes are not mistaken for exfiltration.
