research:
  limitations:
    paragraphs:
    - zh: Sedreco 的详细队列证据来自逆向分析，不能代表所有周期外传实现；Machete 仅独立证明定期发送被窃数据，而非相同的积压机理。未看到队列、数据对象或出站字节时，应把重复连接保留为“周期通信”线索，不可直接宣称外传。较大的批次也可能更易触发上传量阈值。
      en: Sedreco's detailed queue evidence comes from reverse engineering and cannot represent every periodic exfiltration
        implementation. Machete independently confirms recurrent sends of stolen data, not the same queuing mechanism.
        Without a queue, data object, or outbound byte evidence, recurring connections remain a periodic-communication
        lead rather than proof of exfiltration. Larger releases may also be easier to catch with upload-volume thresholds.
