schema_version: 2.0.0
type: technique
id: NJT-0155
name:
  zh: 定时传输
  en: Scheduled Transfer
summary:
  zh: 攻击者控制已取得数据的周期性外传释放，使数据产生与网络出站错开，并减少持续收集期间的外部联系。
  en: An adversary controls the periodic release of acquired data, separating data production from network egress
    and reducing external contacts during continuing collection.
aliases: []
classification:
  tactic_refs:
  - TA0010
  origin:
    kind: attack-adapted
    source_attack_id: T1029
    source_attack_version: '19.1'
  decision_ref: DEC-TA0010-T1029
definition_and_concept:
  paragraphs:
  - zh: 定时传输是攻击者在已经取得待外传数据或能够持续产出数据后，为实际出站传输设置重复间隔、绝对时刻或允许时窗，让数据只在所选时间离开受害环境。它在 Exfiltration 战术中改变的是外传发生的时间关系，而不是数据如何取得、打包、分块、选择目的地或使用何种协议；同一外传可以同时落入自动化外传或某个通道技术。
    en: Scheduled Transfer occurs when an adversary who has obtained data or can continuously produce it imposes
      a recurring interval, absolute time, or allowed window on actual outbound transfer, so the data leaves the
      victim environment only at selected times. Within Exfiltration it changes the temporal relation of egress,
      not how data is acquired, archived, divided, addressed, or carried by a protocol. The same transfer can also
      satisfy Automated Exfiltration or a channel-specific technique.
  - zh: “定时”的判定对象必须是数据出站，而非植入体的心跳、命令轮询、普通睡眠或计划任务启动。攻击者可以在程序内部维护计时器，也可以使用系统调度器；这些实现形式本身不决定分类。只有证明数据传输被时间门控，且该时间选择具有可论证的匿迹作用，才进入
      Niji 正式技术。
    en: The scheduled object must be data egress, rather than an implant heartbeat, command polling, generic sleep,
      or the launch of a scheduled task. An adversary may keep a timer inside a program or use a platform scheduler,
      but those implementation forms do not define the category. Formal Niji scope requires evidence that data transfer
      is time gated and that the choice of time has a defensible stealth effect.
stealth_characteristics:
  paragraphs:
  - zh: 定时传输可先把待传数据留在本地队列，再按攻击者设定的周期释放，把持续产生的敏感输出折叠为较少的出站事件。按数据读取后短时间内外联作关联的检测可能丢失相邻边；但周期规律、待发文件和单次较大的上传量也会留下新线索，定时本身并不必然隐蔽。
    en: Scheduled Transfer can retain data in a local queue and release it on an attacker-set period, folding continuing
      sensitive output into fewer egress events. Detection that joins a data read only to nearby connections can
      lose that adjacency. Recurrence, pending files and larger individual uploads leave other leads, so a timer
      is not inherently covert.
  - zh: 残余痕迹包括待发文件的增长与清空、独立外传计时器、按源和目的地重复出现的出站连接及原发字节。若防守方保存足够长的流量、进程和数据访问记录，仍可把错开的阶段重连；如果发送周期太短或每次批量过大，还可能提高异常显著性。工作时窗贴合正常背景的假设须有目标局部基线证据，本批不将其作为既成匿迹机理。
    en: Residual traces include growth and draining of pending files, a distinct exfiltration timer, recurring source-to-destination
      connections and originator bytes. Sufficiently retained flows, process identity and data access can reconnect
      the displaced stages; a very short cycle or large release can instead stand out. The hypothesis that a business
      window blends into normal traffic needs a victim-local baseline and is not treated as an established stealth
      mechanism here.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入条件是攻击者控制外传时机，且有数据实际出站或清晰的、可执行的外传门控逻辑，并能说明时间选择如何改变防守观察。只有 C2 重连间隔、命令请求、植入体休眠或计划任务触发而没有数据外传证据时，不作 T1029
      正式映射；ATT&CK 页面中的多项软件实例只达到该较低证据层级。合法备份、邮件队列重试、软件更新、批处理和带宽管理会产生相似周期，必须由目的地、数据对象、发起主体、配置来源或未授权行为补充判定。
    en: Inclusion requires attacker control over egress timing and either observed data leaving or clear executable
      gating logic for exfiltration, together with an explanation of how the time choice changes defender observation.
      C2 reconnect intervals, command requests, implant sleep, or task triggers without evidence of data egress
      do not establish formal T1029 mapping; several software entries on the ATT&CK page reach only that lower evidence
      level. Backups, mail-queue retries, updates, batch processing, and bandwidth management can have similar cadence,
      so destination, data object, initiating principal, configuration provenance, or other unauthorized behavior
      must complete the judgment.
  - zh: 与 T1030 的边界是控制量：T1029 控制“何时发送”和两次外传之间的距离，T1030 控制每次或单位时间的传输规模；一个配置可同时具备两者，但不能把速率限制自动视为定时匿迹。T1020 负责自动触发与处理，T1041、T1048
      和 T1567 等负责通道或服务，T1074 和 T1560 负责暂存和归档。平台调度器中有恶意任务时还可映射计划执行，但这里的研究对象仍是外传时序而非任务对象的隐藏或执行权限。
    en: 'The boundary with T1030 is the controlled quantity: T1029 controls when transfer occurs and the distance
      between transfers, whereas T1030 controls per-transfer or per-period volume. One configuration can express
      both without making rate limiting automatically a timing stealth mechanism. T1020 addresses automation and
      processing; T1041, T1048, and T1567 address channel or service; T1074 and T1560 address staging and archiving.
      A malicious platform task can additionally map to scheduled execution, while this candidate still studies
      egress timing rather than concealment or authority of the task object.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在长期情报收集或持续记录敏感输出的入侵中，攻击者可先把键盘日志、命令结果或选定文件写入本地待发区，再按周期送往外部控制端。Sedreco 的独立外传计时器与出站文件直接证明这种积压—释放实现；Machete
        的十分钟被窃数据发送另证周期外传，却未证明相同队列。业务时窗门控仍留在研究层，本批不把仅有代码能力的时窗选择写作已观察到的外传事件。
      en: In a long-running intelligence intrusion or continuing capture of sensitive output, an adversary can write
        keystroke logs, command results or selected files to a local pending area and send them to an outside controller
        periodically. Sedreco's independent exfiltration timer and outbound file directly establish this queue-and-release
        implementation. Machete separately establishes ten-minute sends of stolen data without proving the same
        queue. Business-window gating remains in research; code-level timing capability is not presented as an observed
        exfiltration incident.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需能够读取或生成待传数据、维持可写待发区和独立的外传计时器，并持有持续可用的外部路径。周期积压要求容忍本地暴露、崩溃恢复、数据延迟和会话失效；攻击者不必使用操作系统计划任务，也不必改变传输协议。周期过短不能明显降低联系密度，周期过长则增加丢失或被扣押的风险。
        en: The attacker needs the ability to read or produce data for transfer, maintain a writable pending area
          and independent exfiltration timer, and keep an external path usable. Periodic queuing entails local exposure,
          crash recovery, delayed receipt and session-expiry costs. An OS scheduled task or protocol change is unnecessary.
          Too short a period barely reduces contacts; too long a period raises loss or seizure risk.
    defender_model:
      paragraphs:
      - zh: 假定防守方可按统一时间轴连接网关或 Zeek 流记录、端点连接发起进程，以及可用的待发文件或敏感数据访问记录。流记录提供时间、源和目的地、持续时间及原发字节；DeviceNetworkEvents 补充进程归属，却不能单独提供外传体积。NAT、加密和短日志保留会限制队列到目的地的重建，而稳定的设备、进程和目的地键及跨多个周期的保留可恢复这一关系。
        en: The defender is assumed to join gateway or Zeek flow records, initiating endpoint processes, and available
          pending-file or sensitive-data access events on one timeline. Flows provide time, endpoints, duration
          and originator bytes; DeviceNetworkEvents adds process attribution but cannot alone establish transfer
          volume. NAT, encryption and short retention limit queue-to-destination reconstruction, while stable device,
          process and destination keys retained across several cycles can recover it.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将数据产生与出站传输分离并减少局部外联
    en: Separate data production from egress and reduce local network contacts
  analysis:
    paragraphs:
    - zh: 攻击者先让待传数据在本地队列积累，再按较长周期统一释放，使数据访问与网络出站落入不同告警窗口，并减少持续收集期间的网络接触次数。ESET 对 Sedreco 的分析明确记录了待发文件、通常十分钟的独立外传计时器与批量发送，并谨慎指出较少接触“可能”降低注意；这是有依据的匿迹可能性，不是对所有周期值的效果保证。队列变化、固定节律及每次原发字节仍然可见。
      en: The adversary lets outbound data accumulate locally and releases it on a period, putting data access and
        network egress in different alert windows and reducing network contacts during continuous collection. ESET
        directly documented Sedreco's outbound file, usually ten-minute independent exfiltration timer, and bulk
        sends, and cautiously stated that fewer contacts might attract less attention. This is a supported stealth
        possibility, not a guarantee for every interval. Queue changes, fixed cadence, and originator bytes per
        send remain observable.
  evidence_refs:
  - REF-000644
  - REF-000643
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前唯一正式子项以待发数据产生到周期释放之间的时间距离为稳定变量：它留下队列增长与清空、较少而重复的外联，以及收集—传输时差。业务时窗对齐、单纯 C2 抖动和按时间表改变速率均经过审查，分别因目标局部观察证据不足、并非数据出站、或属于
        T1030 规模变量而未成为本批 NJS。分类不按工具、平台、协议或 ATT&CK 子项建立。
      en: The sole formal child uses the interval between data production and periodic release as its stable variable,
        leaving queue growth and draining, fewer but recurrent contacts, and a collection-to-egress delay. Business-window
        alignment, C2-only jitter and rate timetables were examined but did not become Niji children in this batch
        because victim-local observation evidence is insufficient, no data egress is shown, or the variable belongs
        to T1030's volume scope. Tools, platforms, protocols and ATT&CK children do not define this taxonomy.
  coverage: established
  subtechnique_refs:
  - NJS-0155-001
