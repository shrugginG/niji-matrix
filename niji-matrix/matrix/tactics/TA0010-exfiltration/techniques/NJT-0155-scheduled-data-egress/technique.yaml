research:
  limitations:
    paragraphs:
    - zh: ATT&CK 的 T1029 页面把若干 C2 睡眠或轮询也列作过程实例，不能将它们全部当成已确认外传。Sedreco 的待发文件、独立外传计时器和批量发送是本批唯一直接支持“周期积压”子项的详细行为链；Machete
        只独立证明定期外送被窃数据。现有来源没有给出定时外传相对即时外传的量化漏检差异，因此机理效果保持中等置信度。
      en: The ATT&CK T1029 page includes C2 sleep and polling among its examples, so these entries cannot all be
        treated as confirmed exfiltration. Sedreco provides the detailed outbound file, independent timer and bulk-send
        chain supporting the periodic queued child; Machete separately proves recurrent sends of stolen data only.
        No source quantifies missed detection against immediate transfer, so the mechanism effect remains medium
        confidence.
    - zh: 备份、邮件队列、云同步和软件遥测也会产生周期出站。原发字节说明数据向外发送的量，却不能证明内容敏感；端点连接事件能补足进程，不能独立给出体积。缺少未授权目标、异常进程、数据来源或队列变化时，结果只能称为待核查的周期出站。业务时窗轴还缺少受害资产本地背景和实际防守差异证据，故本批暂缓正式化。
      en: Backups, mail queues, cloud synchronization and software telemetry also produce recurrent outbound traffic.
        Originator bytes measure sent data, not sensitivity, and endpoint connection events add process context
        without independently establishing volume. Without an unauthorized destination, unusual process, data provenance
        or queue changes, the result remains recurrent egress for investigation. The business-window axis lacks
        victim-local background and demonstrated defender difference and is therefore deferred in this batch.
