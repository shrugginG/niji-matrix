research:
  limitations:
    paragraphs:
    - zh: 直接强证据集中于 Attor 的 Windows 插件架构；跨平台泛化依据生产者—消费者对象语义而非同等强度的 Linux/macOS 恶意案例。目录交接在正常日志、备份和同步软件中极常见，必须保留未授权目的地、主体或数据来源条件。来源证明架构与痕迹分离，不量化漏检率。
      en: Strong direct evidence is concentrated in Attor's Windows plugin architecture. Cross-platform generalization
        rests on producer-consumer object semantics rather than equally strong Linux or macOS malicious cases. Directory
        handoff is common in legitimate logging, backup, and synchronization and requires an unauthorized destination,
        principal, or data-source condition. The source establishes architecture and trace separation, not a measured
        miss rate.
