research:
  limitations:
    paragraphs:
    - zh: 联合通告汇总多起活动，未把每个 SPAN/RSPAN/ERSPAN 配置逐一连接到攻击者 collector 的字节接收；Google 来源仅证明平台能力和审计方法。正式结论必须分开“复制配置存在”“collector
        收到副本”和“副本含可用敏感数据”三层。物理 TAP、交换芯片或云提供方内部复制可能不留租户可见控制面日志。
      en: The joint advisory aggregates multiple activities and does not connect every SPAN, RSPAN, or ERSPAN configuration
        to byte receipt at an adversary collector. The Google source establishes platform capability and audit methods
        only. Formal conclusions must separate mirror configuration, collector receipt, and usable sensitive content.
        Physical taps, switch-silicon copies, or provider-internal replication may leave no tenant-visible control-plane
        audit.
