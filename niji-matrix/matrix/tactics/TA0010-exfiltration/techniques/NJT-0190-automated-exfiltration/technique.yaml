research:
  limitations:
    paragraphs:
    - zh: 自动化与匿迹没有必然关系。Gamaredon 同时具备自动扫描和上传能力，却被研究者描述为追求快速扩散和外传而几乎不努力隐藏；因此正式判断必须证明痕迹跨边界分离，而不能从“automatic”“script”或“daemon”字样推断意图。Attor
        提供强架构证据但不量化检测规避率，跨平台推广依赖通用对象交接语义。
      en: Automation has no necessary relationship to stealth. Gamaredon used automated scan and upload capabilities
        yet was described as prioritizing rapid spread and exfiltration with little effort to remain hidden. Formal
        judgment must therefore establish trace separation across boundaries rather than infer intent from the words
        automatic, script, or daemon. Attor provides strong architectural evidence but no measured evasion rate,
        and cross-platform extension relies on general object-handoff semantics.
    - zh: 复制观察面证据必须区分配置、接收与内容结果。联合通告证明行为者在受侵网络设备使用 PCAP 和 SPAN/RSPAN/ERSPAN，Google 文档证明云镜像审计字段；二者不共同证明每次复制都向攻击者交付敏感明文。合法监控背景极强，严格准入需要未经批准的
        actor/source/filter/collector 关系和实际接收，内容敏感度另行确认。
      en: Replica evidence must distinguish configuration, receipt, and content outcome. The joint advisory establishes
        actor use of PCAP and SPAN, RSPAN, and ERSPAN on compromised network devices, while Google documentation
        establishes cloud-mirror audit semantics. Together they do not prove that every copy delivered sensitive
        plaintext to an adversary. Authorized-monitoring background is strong, so strict admission needs an unapproved
        actor, source, filter, or collector relationship plus actual receipt, with content sensitivity confirmed
        separately.
    - zh: DeviceFileEvents 和 DeviceNetworkEvents 支持对象与发起进程字段，但具体产品覆盖、读取事件可用性和连接字节字段必须在部署中验证。共享代理、长期连接、内存队列与加密容器会降低文件到网络的归因。所有
        Analytic 阈值需按合法队列 SLA 和镜像工单基线调整，不把单点变成外传结论。
      en: DeviceFileEvents and DeviceNetworkEvents support object and initiating-process fields, but product coverage,
        read-event availability, and connection-byte fields must be validated in deployment. Shared proxies, long-lived
        connections, memory queues, and encrypted containers weaken file-to-network attribution. Analytic windows
        and thresholds require tuning to legitimate queue SLAs and mirror approvals, and no point signal should
        become an exfiltration conclusion.
