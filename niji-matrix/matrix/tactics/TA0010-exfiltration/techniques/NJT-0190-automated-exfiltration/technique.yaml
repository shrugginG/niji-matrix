schema_version: 2.0.0
type: technique
id: NJT-0190
name:
  zh: 自动化数据渗出
  en: Automated Exfiltration
summary:
  zh: 攻击者让数据选择、待发交接或流量复制自动驱动外传，并利用跨进程或跨控制面的痕迹分离降低完整外传链的可见性。
  en: Adversaries automate data selection, pending-data handoff, or traffic replication for exfiltration and use
    trace separation across processes or control planes to reduce visibility of the complete egress chain.
aliases: []
classification:
  tactic_refs:
  - TA0010
  origin:
    kind: attack-adapted
    source_attack_id: T1020
    source_attack_version: '19.1'
  decision_ref: DEC-TA0010-T1020
definition_and_concept:
  paragraphs:
  - zh: 自动化数据渗出是攻击者预置规则、状态条件或复制配置，使已经收集或正在经过受控基础设施的数据无需每次人工命令即可被选择、交接并发送到受害环境之外。直接目标是形成可持续的外传流程；Niji 关注的是自动流程如何把数据取得、待发状态、传输主体和外部接收分散到不同观察面，而不是把所有脚本上传都解释为匿迹。
    en: Automated Exfiltration uses preset rules, state conditions, or replication configuration so collected data
      or data traversing controlled infrastructure can be selected, handed off, and sent outside the victim environment
      without a fresh operator command for every item. Its direct goal is a sustainable egress process. Niji focuses
      on how automation distributes acquisition, pending state, transfer principal, and external receipt across
      observation planes rather than treating every scripted upload as stealth.
  - zh: “自动化”描述触发与处理关系，不决定 HTTP、FTP、C2、云服务、其他网络介质或物理介质，也不决定何时发送或每次发送多少。固定周期是 T1029 的时间变量，分块或速率是 T1030 的规模变量，具体通道仍归相应
      Exfiltration 候选。操作系统计划任务、守护进程、插件或云 API 只是实现；若没有独立的痕迹与观察差异，留在父级核心而不形成 Niji 子项。
    en: Automation describes trigger and processing relationships; it does not determine HTTP, FTP, C2, cloud service,
      another network medium, or physical media, nor does it determine when or how much is sent. A fixed cadence
      is T1029's timing variable, chunking or rate is T1030's volume variable, and the concrete channel remains
      with its corresponding Exfiltration candidate. OS tasks, daemons, plugins, and cloud APIs are implementations.
      Without a distinct trace and observation difference, they remain within the parent scope rather than becoming
      Niji children.
stealth_characteristics:
  paragraphs:
  - zh: 跨组件自动交接使采集进程只写本地待发区，由另一进程读取并产生网络连接；单看采集端看不到外传，单看上传端又可能看不到原始敏感数据访问。复制观察面则保留原流的目的地、响应和端点行为，同时从网络设备或云控制面增加到独立收集器的副本，源端点不产生第二次发送。两者都把完整因果链拆散到默认不相连的数据域。
    en: Cross-component automated handoff lets collection processes write only to a local pending area while another
      process reads it and creates the network connection. Collection telemetry lacks egress, while uploader telemetry
      may lack the original sensitive-data access. A replicated observation plane preserves the original flow's
      destination, response, and endpoint behavior while adding a copy from a network-device or cloud control plane
      to an independent collector, with no second send by the source endpoint. Both split one causal chain across
      data domains that are not joined by default.
  - zh: 自动化并不消除痕迹。待发文件的创建、读取与清空，进程间稳定的目录或对象交接，上传进程到外部目的地的连接，镜像资源 create/patch/delete、源范围、过滤器、collector 目标和接收字节仍可关联。普通脚本还可能因规模、频率或错误重试变得更显眼；只有在防守方缺少跨进程对象谱系或跨控制面审计时，上述分离才产生匿迹优势。
    en: Automation does not erase traces. Creation, read, and draining of pending files; stable directory or object
      handoff between processes; uploader connections to external destinations; and mirror create, patch, delete,
      source scope, filters, collector target, and receipt bytes remain correlatable. Ordinary scripts may become
      more conspicuous through scale, frequency, or failed retries. The separation produces a stealth advantage
      only when defenders lack cross-process object lineage or cross-control-plane audit.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求存在攻击者控制的自动外传规则或状态转换、实际外送或可执行的外送链，以及自动化造成的痕迹位置变化或观察差异。仅使用批处理、脚本、守护进程或任务调度不够；合法备份、遥测、邮件投递、云同步、NDR 镜像和故障诊断都可能具有相同自动形态，必须结合未授权所有者、数据来源、目的地、配置变更、批准窗口与结果判断。
    en: Inclusion requires an attacker-controlled automated egress rule or state transition, actual outward transfer
      or an executable outward chain, and a trace-location or observation difference caused by automation. Use of
      a batch file, script, daemon, or scheduler alone is insufficient. Legitimate backup, telemetry, mail delivery,
      cloud synchronization, NDR mirroring, and troubleshooting can have the same automated form and must be distinguished
      using unauthorized ownership, data source, destination, configuration change, approval window, and outcome.
  - zh: 发现文件后由同一脚本立即上传只证明父级自动化；如果没有跨主体、跨对象或跨观察面的独立差异，不单列子项。按十分钟运行的脚本同时可能属于 T1029，但周期不属于本候选；限制字节或带宽属于 T1030；经 C2、替代协议、Web
      服务、其他网络或物理介质的实现分别归对应候选。镜像只有在副本被送至独立收集目标时才进入外传范围，本地诊断抓包而无外送只构成观察或收集能力。
    en: Immediate upload by the same script after finding a file establishes parent-level automation only. It does
      not form a child without a distinct cross-principal, cross-object, or cross-observation-plane difference.
      A script running every ten minutes may also map to T1029, but cadence is outside this candidate; byte or bandwidth
      limits belong to T1030; implementations over C2, alternative protocol, web service, another network, or physical
      media belong to their respective candidates. Mirroring enters Exfiltration only when the copy is delivered
      to an independent collection target. Local diagnostic capture without outward delivery establishes observation
      or collection capability only.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在端点间谍平台中，键盘记录、截图、音频或文档采集插件可以只把结果写入统一待发目录，由独立上传组件自动消费并经既定通道外送；Attor 直接展示了这种架构。攻击者也可在长期文件窃取中维护“已上传”状态，只处理新出现或匹配规则的文档，但这种筛选若仍由同一进程直接上传，属于父级核心，不能仅因规则自动化形成子项。
      en: In an endpoint espionage platform, keylogging, screenshot, audio, or document-collection plugins can write
        results only to a common pending directory while a separate uploader automatically consumes them over an
        established channel; Attor directly demonstrates this architecture. An adversary can also maintain uploaded-file
        state during long-running theft and process only new or rule-matching documents. When one process still
        performs direct upload, that filtering remains within the parent scope and does not become a child merely
        because the rule is automated.
    - zh: 在受侵交换机、路由器或 IaaS 控制面中，攻击者可选择接口、实例、子网或过滤器，把经过原路径的流量复制到受控 collector。原业务会话继续成功，不需要端点植入体逐个读取并上传文件。联合机构通告记录了国家支持行为者在受侵设备上使用
        SPAN/RSPAN/ERSPAN 与 PCAP 能力；Google Cloud 文档则证明镜像资源的生命周期和审计方法可实现。
      en: In a compromised switch, router, or IaaS control plane, an adversary can select interfaces, instances,
        subnets, or filters and copy traffic traversing the original path to a controlled collector. The business
        session continues successfully without an endpoint implant reading and uploading each file. A joint agency
        advisory records state-sponsored use of SPAN, RSPAN, ERSPAN, and PCAP capability on compromised devices,
        while Google Cloud documentation establishes implementable mirror-resource lifecycle and audit methods.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 跨组件交接要求攻击者能部署或控制至少一个数据生产组件、共享待发对象和上传组件，并维持对象命名、权限、重试与清理语义。若待发目录被隔离、生产者不能写入或上传者不能读取，流水线中断。复制观察面要求修改交换镜像、设备抓包/导出或云
          Packet Mirroring 的权限、可接收副本的 collector，以及对源范围和路由的了解；加密流量还可能只能得到不可解释的密文。
        en: Cross-component handoff requires control of at least one data-producing component, a shared pending
          object, and an uploader, together with object naming, permissions, retry, and cleanup semantics. The pipeline
          fails if the pending area is isolated, producers cannot write, or the uploader cannot read. A replicated
          observation plane requires authority to change switch mirroring, device capture or export, or cloud Packet
          Mirroring; a collector able to receive copies; and knowledge of source scope and routing. Encrypted flows
          may yield only uninterpretable ciphertext.
      - zh: 自动化减少逐次操作，但增加固定配置与重复关系。攻击者必须保护规则、队列、令牌、collector 和错误状态，避免积压、重复上传或异常字节放大。镜像若覆盖过宽会增加带宽和 collector 成本，跨项目或外部目标也更易被控制面审计发现。
        en: Automation reduces per-item operation but creates fixed configuration and recurring relationships. The
          adversary must protect rules, queues, tokens, collectors, and error state while avoiding backlog, duplicate
          upload, or anomalous byte amplification. An overly broad mirror increases bandwidth and collector cost,
          and cross-project or external targets are more visible in control-plane audit.
    defender_model:
      paragraphs:
      - zh: 端点侧假定防守方能保留文件/对象创建与读取、进程身份和网络连接，并用稳定 process GUID、object identity、hash/path、时间和目的地连接生产者—待发区—上传者。网络与云侧假定保存镜像资源事件时版本、actor、source/filter、collector、批准工单及
          collector receipt。没有原发字节或 collector 接收证据时，只能确认连接或复制能力，不能直接宣称数据已外传。
        en: On endpoints, defenders are assumed to retain file or object create and read events, process identity,
          and network connections and to join producer, pending area, and uploader using stable process GUID, object
          identity, hash or path, time, and destination. On network and cloud control planes, defenders retain event-time
          mirror versions, actor, source and filter, collector, approval record, and collector receipt. Without
          originator bytes or collector receipt evidence, a finding confirms connection or copy capability rather
          than completed exfiltration.
      - zh: EDR 未记录文件读取、临时对象只存在内存、共享代理抹去源进程、网络设备未启用 AAA 命令记账、控制面审计可被删除、物理 TAP 或云提供方内部复制都会形成盲区。合法备份、DLP、NDR 与同步服务造成高相似背景，因此基线必须记录
          owner、源数据、可执行主体、目的地、生命周期和保留目的，而不能仅对白名单进程名放行。
        en: Blind spots include EDR without file-read events, memory-only pending objects, shared proxies that erase
          process provenance, network devices without AAA command accounting, deletable control-plane audit, physical
          taps, and provider-internal copies. Authorized backup, DLP, NDR, and synchronization services create highly
          similar background, so baselines must record owner, source data, executable principal, destination, lifecycle,
          and retention purpose rather than allowlisting process names alone.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将数据取得与外部发送分散到不同组件和对象边界
    en: Distribute data acquisition and external sending across component and object boundaries
  analysis:
    paragraphs:
    - zh: 攻击者让采集插件只写共享待发区，独立 uploader 再读取并外送，使敏感读取与网络连接不再由同一进程在同一短窗口内完成。Attor 的采集插件无网络能力，文件由中央 Upload 文件夹交给 File
        uploader 自动发送，直接支持这条链。痕迹没有消失，而是被拆成 producer write、uploader read 和 outbound flow；缺少跨进程对象谱系的防守方难以还原完整外传。
      en: The adversary makes collection plugins write only to a shared pending area and lets a separate uploader
        read and send it, so sensitive access and network connection no longer occur in one process and one short
        window. Attor's collection plugins lack network capability and place files in a central Upload folder for
        automatic sending by the File uploader, directly supporting this chain. Traces are split into producer write,
        uploader read, and outbound flow rather than erased; a defender without cross-process object lineage has
        difficulty reconstructing the complete exfiltration.
  evidence_refs:
  - REF-000484
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 复制分支外送数据而保持原通信端点行为与交付正常
    en: Send data over a copy branch while original endpoint behavior and delivery remain normal
  analysis:
    paragraphs:
    - zh: 交换或云镜像增加一条到独立 collector 的复制边，原端点仍向原目的地发送并收到正常响应，因此端点进程、会话目标和应用结果没有第二次外传动作。异常痕迹转移到镜像控制面、封装流和 collector
        接收。CISA 联合通告记录行为者使用 SPAN/RSPAN/ERSPAN，Google Cloud 明确记录 packetMirrorings insert、patch 与 delete；只有把这些数据域相连，才能从“业务路径正常”恢复额外复制结果。
      en: Switch or cloud mirroring adds a copy edge to an independent collector while the source endpoint continues
        sending to its original destination and receives a normal response. Endpoint process, session destination,
        and application result contain no second exfiltration action. Anomaly traces move to the mirror control
        plane, encapsulated flow, and collector receipt. The joint CISA advisory records actor use of SPAN, RSPAN,
        and ERSPAN, while Google Cloud explicitly logs packetMirrorings insert, patch, and delete. Only correlation
        across these domains recovers the extra copy from an otherwise normal business path.
  evidence_refs:
  - REF-000792
  - REF-000795
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两个子项分别固定自动外传中的“数据生产者与外送主体是否由待发对象分离”和“原始数据路径是否保持不变而增加独立复制边”。前者的残余是跨进程文件/对象交接和上传者连接，需要 producer—object—consumer
        谱系；后者的残余是镜像资源与 collector 接收，需要控制面—数据面关联。二者可同时存在，但其身份、数据和缓解控制不同，边界不按工具、协议、平台或 ATT&CK 子项名称建立。
      en: The two children fix whether a pending object separates data producer from egress principal and whether
        the original data path remains unchanged while an independent copy edge is added. The first leaves cross-process
        file or object handoff and uploader connections and needs producer-object-consumer lineage. The second leaves
        mirror resources and collector receipt and needs control-plane-to-data-plane correlation. They can coexist,
        but their identities, data, and mitigations differ. Boundaries do not follow tools, protocols, platforms,
        or ATT&CK child names.
    - zh: 同进程按扩展名或“新文件”规则直接上传、普通批处理脚本及守护进程重复发送都留在父级核心，除非另有可证明的分离变量。按固定时刻释放归 T1029，按大小或速率调节归 T1030。固定基线的 T1020.001
        被解析为复制边行为证据，其名称和分类没有导入 Niji。
      en: Direct same-process upload based on extension or new-file rules, ordinary batch scripts, and repeated
        daemon sends remain within the parent scope unless another supported separation variable exists. Fixed-time
        release belongs to T1029 and size or rate shaping to T1030. Fixed-baseline T1020.001 is resolved as evidence
        for copy-edge behavior; its name and taxonomy are not imported into Niji.
