schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0191-001
parent_ref: NJT-0191
name:
  zh: 角色偏离协议出口
  en: Role-Deviant Protocol Egress
summary:
  zh: 攻击者从不应直接使用某协议或外部端点的设备和进程发送数据，使外传离开受管解析器、代理、邮件中继或批准通道。
  en: An adversary sends data from a device or process that should not directly use that protocol or external endpoint,
    moving exfiltration outside a managed resolver, proxy, mail relay, or approved path.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 角色偏离协议出口是经替代协议渗出的一种实现，其中攻击者让受害工作负载直接发起超出其业务角色的外部 DNS、FTP、SFTP、SMTP、SMB 或其他协议会话，而不是经过该角色获准的中介或目的地。分类变量是资产/进程角色与实际出口路径之间的差异；协议名称、端口或工具只是观察属性。
    en: Role-Deviant Protocol Egress is an implementation of Exfiltration Over Alternative Protocol in which the
      adversary causes a victim workload to initiate external DNS, FTP, SFTP, SMTP, SMB, or another protocol outside
      its business role instead of using the role's approved intermediary or destination. The classification variable
      is the difference between asset or process role and actual egress path; protocol name, port, and tool are
      observed attributes.
stealth_characteristics:
  paragraphs:
  - zh: 角色偏离协议出口把外传从组织重点检查的 Web/C2 路径移到另一政策和日志面。直接 FTP 可能只留下防火墙与流记录，直接 DNS 可能绕开受管递归器，脚本 SMTP 可能跳过邮件网关；单个传感器看到的是允许端口或普通连接而非敏感数据谱系。异常进程、未批准接收端、方向字节和源文件读取仍然可见，严格的角色基线会削弱匿迹收益。
    en: Role-Deviant Protocol Egress moves theft from the organization's closely inspected web or C2 path to another
      policy and logging surface. Direct FTP may leave only firewall and flow records, direct DNS may bypass managed
      recursion, and scripted SMTP may bypass the mail gateway. One sensor sees an allowed port or ordinary connection
      rather than sensitive-data lineage. The unusual process, unapproved receiver, directional bytes, and source-file
      reads remain visible, and a strong role baseline reduces the stealth benefit.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要证明设备或进程角色、批准中介/目的地、实际协议路径和外传结果之间的偏离。管理员批准的 SFTP、备份代理、邮件服务器、DNS 递归器和软件发布是正常反例；端口异常、首次连接或非浏览器进程本身不足。若外传仍复用既有
      C2 关系归 T1041；通过不同网络介质归 T1011；仅改变时间或体积分别归 T1029/T1030。
    en: Inclusion requires evidence of workload or process role, approved intermediary or destination, the actual
      protocol path, and an exfiltration result. Authorized SFTP administration, backup agents, mail servers, DNS
      resolvers, and software distribution are normal counterexamples. An unusual port, first connection, or non-browser
      process alone is insufficient. Exfiltration that still reuses existing C2 belongs to T1041, a different network
      medium to T1011, and changes only to timing or volume to T1029 or T1030.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: OilRig 的 Helminth PowerShell 通过 DNS 接收任务和文件内容，研究人员捕获的命令又要求把 whoami、ipconfig 和 systeminfo 输出写入文件后直接 FTP
        PUT 到外部 IP。该链证明同一活动把控制留在 DNS 而把外传切换到 FTP，并提供文件、目标 IP 和协议差异；来源没有量化 FTP 是否绕过了某项防线，因此本子项保持 medium。
      en: OilRig's Helminth PowerShell received tasks and file content over DNS, while commands captured by researchers
        wrote whoami, ipconfig, and systeminfo output to a file and directly issued an FTP PUT to an external IP.
        The chain establishes control remaining on DNS while exfiltration moved to FTP, with a file, receiver IP,
        and protocol difference. The source does not quantify whether FTP bypassed a defensive control, so this
        child remains medium-confidence.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要从受害设备建立替代协议会话、准备接收端或滥用现有外部服务，并知道业务角色允许或未严格阻断的出口。直接路径可能需要凭据、协议客户端或防火墙例外，也可能因端口阻断、代理强制和服务端认证失败。攻击者接受增加一个接收基础设施和暴露新目标的成本。
        en: The attacker needs to establish the alternative protocol session from the victim, operate a receiver
          or abuse an external service, and identify egress that the workload role can reach or that policy does
          not strictly block. The direct path may require credentials, a protocol client, or a firewall exception
          and can fail under port blocking, forced proxies, or receiver authentication. The attacker accepts the
          cost of another receiving system and exposing another destination.
    defender_model:
      paragraphs:
      - zh: 防守方具备资产/进程角色清单、批准解析器/代理/中继和网络流或端点连接事件。若只按端口允许而没有应用识别、进程键或直接/中介路径标记，偏离难以判断；NAT 和共享代理还会压缩发起身份。防守结论依赖本地角色基线，而不是跨环境通用协议黑名单。
        en: The defender has an asset and process role inventory, approved resolvers, proxies and relays, and network-flow
          or endpoint-connection events. Port-only allow rules without application identification, process keys,
          or direct-versus-mediated path markers make deviation hard to assess; NAT and shared proxies further compress
          origin identity. The defensive conclusion depends on local role baselines rather than a universal protocol
          blacklist.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 使外传进入该工作负载常规监控未覆盖的直接协议路径
    en: Place exfiltration on a direct protocol path outside routine monitoring for that workload
  analysis:
    paragraphs:
    - zh: 攻击者从受控主机绕过受管中介并直接使用另一协议，使代理、邮件网关或递归器不生成预期事务，关键数据传输只存在于端点、流量或另一日志面。现有基于批准路径的检测逻辑可能看不见完整内容和主体；角色清单、方向字节与源文件读取仍可恢复。OilRig
        的 DNS 控制与独立 FTP PUT 支持路径分离，具体告警损失属于待本地验证的强推断。
      en: The adversary bypasses a managed intermediary from a compromised host and uses another protocol directly,
        so the proxy, mail gateway, or resolver does not produce the expected transaction. The critical transfer
        exists only at the endpoint, flow layer, or another log surface. Analytics built around approved paths may
        lose content and identity, while role inventory, directional bytes, and source-file reads can recover the
        behavior. OilRig's DNS control and separate FTP PUT support path separation; actual alert loss remains a
        strong inference requiring local validation.
  evidence_refs:
  - REF-000916
  - REF-000922
  confidence: medium
