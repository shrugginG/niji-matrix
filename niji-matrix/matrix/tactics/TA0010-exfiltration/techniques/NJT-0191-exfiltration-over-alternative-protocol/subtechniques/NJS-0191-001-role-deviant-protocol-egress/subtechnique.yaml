research:
  limitations:
    paragraphs:
    - zh: 公开案例通常说明使用了替代协议，却不公开资产角色清单、实际代理策略或漏报对照。OilRig 证明 DNS 控制与 FTP 外传可分离，但不能证明受害者原本禁止 FTP。正式内容应把匿迹置信度与“是否违反批准路径”分开，角色与政策证据缺失时只能输出可疑
        T1048 父行为。
      en: Public incidents commonly establish use of another protocol without publishing asset-role inventories,
        actual proxy policy, or missed-alert comparisons. OilRig proves separation of DNS control and FTP exfiltration
        but not that the victim prohibited FTP. Canonical content should separate stealth confidence from violation
        of an approved path; absent role and policy evidence, analysis can conclude only suspicious T1048 parent
        behavior.
