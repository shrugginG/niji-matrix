schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0191-002
parent_ref: NJT-0191
name:
  zh: 协议语义载荷伪装
  en: Protocol-Semantic Payload Camouflage
summary:
  zh: 攻击者把失窃数据编码或嵌入正常协议事务结构，使查询、邮件或请求在局部上仍呈现合法协议外观。
  en: An adversary encodes or embeds stolen data inside normal protocol transaction structures so queries, mail,
    or requests retain a locally legitimate protocol appearance.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 协议语义载荷伪装是经替代协议渗出的一种实现：攻击者把数据拆解、编码并放入 DNS 标签、邮件字段/正文、HTTP 参数/首部或其他协议允许的事务位置，使中间设备能够解析外层协议却不能仅凭单次事务识别其外传语义。固定变量是“失窃数据被映射到正常协议语义位置”的选择，不是
      DNS、SMTP 或某种编码算法本身。
    en: Protocol-Semantic Payload Camouflage is an implementation of Exfiltration Over Alternative Protocol in which
      the adversary segments and encodes data into DNS labels, mail fields or bodies, HTTP parameters or headers,
      or another protocol-permitted transaction location. An intermediary can parse the outer protocol but cannot
      identify exfiltration meaning from one transaction alone. The fixed variable is the mapping of stolen data
      into a normal semantic position, not DNS, SMTP, or any encoding algorithm itself.
stealth_characteristics:
  paragraphs:
  - zh: 协议语义载荷伪装保留合法语法、请求方向和中介处理方式，使单个 DNS 查询、邮件或 HTTP 请求看似可接受；真实数据意义只有在跨事务解码、排序或与源文件关联后出现。残余痕迹包括异常标签长度与唯一率、重复序号、收件人与进程不匹配、首部体积、响应比例和同进程敏感读取。加密
      DNS 或端到端邮件会进一步阻断语义检查。
    en: Protocol-Semantic Payload Camouflage preserves valid syntax, request direction, and intermediary handling,
      making one DNS query, message, or HTTP request look acceptable. The stolen-data meaning emerges only after
      decoding, ordering across transactions, or joining to source files. Residual traces include unusual label
      length and uniqueness, repeated sequence values, recipient-to-process mismatch, header volume, response ratio,
      and sensitive reads by the same process. Encrypted DNS or end-to-end mail can further block semantic inspection.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求外层协议事务有效、内部字段实际承载拟外传数据，并且该映射改变了防守分类或关联。普通 Base64、合法追踪标识、CDN 高熵标签、DKIM、邮件附件和 API 参数不因形态相似而纳入。只对内容加密而没有借用协议语义位置归检查不透明兄弟项；仅改变大小归
      T1030；若同一事务属于既有 C2 回传则归 T1041。
    en: Inclusion requires a valid outer transaction, actual target data in its fields, and a resulting change to
      defensive classification or correlation. Ordinary Base64, legitimate tracking identifiers, high-entropy CDN
      labels, DKIM, mail attachments, and API parameters do not qualify from appearance alone. Content encryption
      without borrowing a protocol-semantic location belongs to the inspection-opaque sibling, size-only changes
      to T1030, and result transfer in the existing C2 transaction to T1041.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: ProjectSauron 具备 DNS 数据外传插件和多种 ICMP、UDP、TCP、DNS、SMTP、HTTP 通信能力；Kaspersky 明确说明其通过合法邮件和 DNS 路径外传，并把从受害者复制的信息伪装在常规流量中。该资料同时支持真实恶意使用、协议事务承载和降低局部可区分性的意图，比只列出工具能力更适合作为子项结论证据。
      en: ProjectSauron had a DNS data-exfiltration plug-in and communication capabilities spanning ICMP, UDP, TCP,
        DNS, SMTP, and HTTP. Kaspersky explicitly states that it used legitimate mail and DNS routes and disguised
        information copied from the victim within regular traffic. This supports real malicious use, carriage in
        protocol transactions, and intent to reduce local distinguishability, providing stronger child-level evidence
        than a capability list alone.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需实现协议有效的编码、分块、序列和接收端重组，并控制可接收 DNS 域、邮箱、Web 端点或等价基础设施。协议长度、字符集、速率、邮件反滥用和服务器验证限制吞吐；较低吞吐会延长暴露。若中介规范化、解码或对事务建长期基线，伪装成本显著增加。
        en: The attacker needs protocol-valid encoding, segmentation, sequencing, receiver-side reconstruction,
          and control of a receiving DNS domain, mailbox, web endpoint, or equivalent infrastructure. Protocol length
          and character sets, rate, mail anti-abuse, and server validation limit throughput, while lower throughput
          lengthens exposure. Intermediary normalization, decoding, and long-horizon transaction baselines raise
          the camouflage cost.
    defender_model:
      paragraphs:
      - zh: 防守方可访问受管解析器、邮件网关或代理的事务级字段和原始载荷片段，并能按源设备、进程、注册域、收件人或 URI 长期聚合。若只保留流记录，或 DoH/DoT、TLS、外部邮件服务遮蔽事务，无法恢复载荷语义；即使字段可见，也需用正常服务基线过滤遥测、CDN、EDR、广告和软件更新。
        en: The defender can access transaction-level fields and raw payload fragments at managed resolvers, mail
          gateways, or proxies and aggregate by source device, process, registered domain, recipient, or URI over
          time. Flow-only records, DoH or DoT, TLS, and external mail services can hide transactions. Even with
          visible fields, normal-service baselines must filter telemetry, CDNs, EDR, advertising, and software updates.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 把失窃数据塑造成解析器仍接受的常规协议事务特征
    en: Shape stolen data into ordinary protocol-transaction features accepted by intermediaries
  analysis:
    paragraphs:
    - zh: 攻击者把目标字节编码进合法字段并维持外层协议状态，使解析器、邮件中继或代理按正常事务转发。防守方看到的是 DNS 查询、邮件或 HTTP 请求，必须跨事件恢复隐藏负载后才能区分恶意。ProjectSauron
        对“合法邮件和 DNS 路径”以及“隐藏于常规流量”的直接描述建立行为—痕迹—观察差异链；标签、收件人、序号和源进程仍可揭示不一致。
      en: The adversary encodes target bytes into valid fields and preserves outer protocol state, causing a resolver,
        mail relay, or proxy to forward an apparently normal transaction. The defender sees a DNS query, message,
        or HTTP request and must recover hidden payload across events before classifying it. ProjectSauron's directly
        reported use of legitimate mail and DNS routes with information disguised in regular traffic establishes
        the behavior-to-trace-to-observation chain; labels, recipients, sequence values, and source process remain
        available contradictions.
  evidence_refs:
