research:
  limitations:
    paragraphs:
    - zh: ProjectSauron 资料明确支持 DNS 和邮件外传及伪装意图，但公开内容未提供每次事务的完整 PCAP、接收端重组或本地误报统计。DNS 研究证明长期基线和合法服务过滤有用，也说明低吞吐更难识别；其评估数据不能直接移植为生产阈值。非
        DNS 协议须使用各自语义解析，不能只复制熵规则。
      en: ProjectSauron reporting directly supports DNS and mail exfiltration and camouflage intent but does not
        publish complete PCAP, receiver reconstruction, or local false-positive statistics for every transaction.
        DNS research supports long-horizon baselining and legitimate-service filtering and also shows low-throughput
        detection is harder; its evaluation thresholds do not transfer directly to production. Non-DNS protocols
        need their own semantic parsers rather than copied entropy rules.
