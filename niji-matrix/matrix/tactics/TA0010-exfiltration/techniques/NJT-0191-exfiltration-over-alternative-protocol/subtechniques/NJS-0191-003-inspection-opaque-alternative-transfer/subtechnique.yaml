research:
  limitations:
    paragraphs:
    - zh: SSH 与 TLS 的机密性是协议属性，不能证明攻击者主观匿迹目的。MirrorFace 资料证明 SFTP 外传，但不公开会话字节、证书、检测产品或告警结果。正式分析必须把“内容不可检查”与“外传已确认”分开，并以端点或数据谱系补足；只从加密流量反推数据失窃会产生大量误报。
      en: SSH and TLS confidentiality is a protocol property and does not prove adversary stealth intent. MirrorFace
        reporting establishes SFTP exfiltration but does not publish session bytes, certificates, detection products,
        or alert outcomes. Canonical analysis must keep “content opaque” separate from “exfiltration confirmed”
        and add endpoint or data lineage; inferring theft from encryption alone produces extensive false positives.
