schema_version: 2.0.0
type: technique
id: NJT-0191
name:
  zh: 经替代协议渗出
  en: Exfiltration Over Alternative Protocol
summary:
  zh: 攻击者把数据外传移到不同于既有 C2 的协议或接收路径，以分割防守观察面，并可借协议外观、内容不透明或受害服务响应降低识别和归因能力。
  en: An adversary moves data theft onto a protocol or receiver path distinct from existing C2, splitting defensive
    observation and potentially reducing recognition or attribution through protocol appearance, opaque content,
    or victim-service responses.
aliases: []
classification:
  tactic_refs:
  - TA0010
  origin:
    kind: attack-retained
    source_attack_id: T1048
    source_attack_version: '19.1'
  decision_ref: DEC-TA0010-T1048
definition_and_concept:
  paragraphs:
  - zh: 经替代协议渗出是攻击者在已经取得可外传数据后，选择不同于既有命令与控制关系的网络协议或独立接收路径，将数据送出受害环境的行为。替代关系可以表现为 C2 使用 DNS 而外传改用 FTP，也可以表现为植入保持一个控制端而数据由另一接收端、邮件系统或受害者
      Web 服务提供。直接目标是完成数据泄露；协议和接收关系决定传输如何进入防守观测。
    en: Exfiltration Over Alternative Protocol occurs after an adversary has data available for theft and selects
      a network protocol or independent receiver path distinct from the existing command-and-control relationship.
      C2 may use DNS while exfiltration uses FTP, or an implant may retain one controller while data is delivered
      to another receiver, a mail system, or a victim-hosted web service. The direct objective is data loss; protocol
      and receiver relationships determine how delivery enters defensive observation.
  - zh: “替代”是相对于同一入侵的既有 C2 关系，而不是相对于某一组织最常见的协议。FTP、SMTP、HTTP/S、DNS、SFTP 与 SMB 都可能正常存在，也都可能成为替代外传载体；工具、端口、密码算法和云产品不能单独定义父项或子项。若没有可证明的既有
      C2 对照，仍可记录可疑外传，但不能仅凭使用不同端口断言 T1048。
    en: “Alternative” is relative to the intrusion's existing C2 relationship, not merely to the protocol most common
      in an organization. FTP, SMTP, HTTP/S, DNS, SFTP, and SMB can all be legitimate and can all carry alternative
      exfiltration. A tool, port, cryptographic algorithm, or cloud product does not independently define the parent
      or a child. Without a demonstrable C2 comparator, suspicious egress may still be recorded, but a different
      port alone does not establish T1048.
stealth_characteristics:
  paragraphs:
  - zh: 经替代协议渗出把控制活动与数据外送拆到不同日志面、解析器和策略边界。Web 代理可能只看到 C2，FTP 或 SFTP 流量出现在防火墙和流记录中，DNS 或邮件载荷则由解析器和邮件网关记录；任何单一系统都可能缺少完整攻击图像。协议选择还可避开按设备角色部署的中介，使原本可由代理检查的上传变成直接外联。
    en: Exfiltration Over Alternative Protocol splits control activity and data delivery across different logs,
      parsers, and policy boundaries. A web proxy may see C2 while FTP or SFTP appears in firewall and flow records
      and DNS or mail payloads appear at resolvers and mail gateways. Any one system can lack the complete attack
      picture. Protocol choice can also bypass role-specific intermediaries, turning a proxy-inspectable upload
      into direct egress.
  - zh: 匿迹不等于痕迹消失。替代通道仍留下源主机、进程、目的地、方向字节、协议事务、证书、邮件或查询序列；加密只会移除内容解释，受害服务拉取还会留下文件写入与访问日志。防守方若能以设备、进程、文件、身份和时间跨观测面关联，就能恢复控制链与外传链之间的关系。合法备份、软件分发、邮件投递、管理
      SFTP 与 DNS 服务会产生强反例。
    en: Stealth does not remove traces. The alternative channel still leaves source host, process, destination,
      directional bytes, protocol transactions, certificates, mail, or query sequences; encryption removes content
      interpretation, while victim-service retrieval leaves file-write and access logs. A defender that correlates
      devices, processes, files, identities, and time across observation surfaces can reconstruct the relationship
      between control and exfiltration. Authorized backup, software delivery, mail submission, administrative SFTP,
      and DNS services are strong counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入通过不同于已建立 C2 的协议发送已收集数据，或在该协议变化中使用独立接收端、协议字段嵌入、加密内容或受害服务响应改变防守观察的行为。纳入判定至少需要外传对象或结果、协议/接收关系，以及与既有 C2 的对照；只有连接、工具存在或协议能力不足。若外传协议后来也承担命令控制，应分别标注相应
      C2 行为，并说明当前事件的直接目的。
    en: Scope includes sending acquired data through a protocol different from established C2 and changes to defender
      observation through a separate receiver, protocol-field embedding, opaque content, or a victim-service response
      on that alternative path. Inclusion requires at least an exfiltrated object or result, the protocol or receiver
      relationship, and a comparator to existing C2; a connection, installed tool, or protocol capability is insufficient.
      If the exfiltration protocol later carries command and control, tag the relevant C2 behavior separately and
      state the direct purpose of the event under review.
  - zh: T1041 负责在既有 C2 关系中回传数据。T1567 以第三方 Web 服务作为外传目的地，T1537 以云账户间转移为对象；若这些行为也使用与 C2 不同的协议，可以并存，但服务或账户不能成为 T1048
      子项。T1011 由替代网络介质定义，T1052 由物理承载定义。T1074 与 NJT-0133 分别负责暂存和外传前归档；把文件放入 Web 根目录是暂存，外部请求实际取回字节才完成本技术的传输。
    en: T1041 owns return of data through the existing C2 relationship. T1567 is defined by a third-party web service
      destination and T1537 by account-to-account cloud transfer. These may coexist with a protocol distinct from
      C2, but the service or account does not define a T1048 child. T1011 is defined by an alternative network medium
      and T1052 by physical carriage. T1074 and NJT-0133 own staging and pre-egress archiving. Writing a file into
      a web root is staging; the outside request that retrieves the bytes completes this transfer behavior.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在植入或交互式会话已经建立 C2 后，可以把大文件、凭据、邮件导出或命令结果移到另一协议，以避开 C2 带宽、内容检查或已知基础设施告警。OilRig 的 DNS 控制脚本接收了使用 FTP 上传侦察输出的命令；MirrorFace
        入侵中使用 SFTP 取走已审阅的数据；ProjectSauron 使用 DNS 与合法邮件路径外送并把信息藏入正常流量。
      en: Once an implant or interactive session has established C2, an adversary can move large files, credentials,
        mailbox exports, or command results onto another protocol to avoid C2 bandwidth limits, content inspection,
        or known-infrastructure alerts. OilRig's DNS-controlled script received commands to upload reconnaissance
        output by FTP, MirrorFace intrusions used SFTP for reviewed data, and ProjectSauron used DNS and legitimate
        mail routes while disguising stolen information in regular traffic.
    - zh: 另一情境是先把数据写入受害者对外服务，再由攻击者拉取。Dark Halo 把邮箱导出打成受口令保护的归档，置于 OWA 可访问目录并通过 HTTPS URL 取回。这里外传表现为受害 Web 服务向外部客户端响应，检测需连接服务器端产物创建、发布路径和访问日志，而不能只寻找内网主机主动上传。
      en: Another scenario stages data behind a victim-facing service for later retrieval. Dark Halo placed a password-protected
        mailbox-export archive in an OWA-accessible directory and retrieved it through an HTTPS URL. Exfiltration
        then appears as a victim web service responding to an external client. Detection must join server-side artifact
        creation, publication path, and access logs rather than look only for an internal host initiating an upload.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者须已经能够读取目标数据，并了解或控制至少一个不同于既有 C2 的发送实现或接收端。角色偏离需要进程能够直连外部协议端点；协议载荷伪装需要构造合法事务并在接收端重组；检查不透明需要协商受保护会话或在传输前形成密文；拉取式外传需要写入可对外服务的位置并知道可取回
          URL。不同实现分别增加协议开发、密钥、接收基础设施和更长操作链成本。
        en: The attacker must already be able to read target data and know or control at least one sending implementation
          or receiver distinct from existing C2. Role deviation requires a process able to contact an external protocol
          endpoint directly. Protocol-payload camouflage requires valid transaction construction and receiver-side
          reconstruction. Inspection opacity requires negotiation of a protected session or ciphertext before transfer.
          Pull exfiltration requires writing to an externally served location and knowing the retrieval URL. These
          implementations add distinct protocol-development, key, receiver-infrastructure, and operational-chain
          costs.
    defender_model:
      paragraphs:
      - zh: 防守方可能分别拥有 Web 代理、受管 DNS、邮件网关、NetFlow/IPFIX、Zeek 连接/DNS/TLS 日志、端点文件与进程网络事件，以及服务端访问日志。结论针对能够跨这些来源保留主机、进程、用户、目的地和时间关联键的环境；只保留端口或最终连接摘要时，协议语义、短事务和文件来源会丢失。TLS、SSH、DoH、共享递归器、NAT、CDN
          与外部 SaaS 会进一步压缩可见性。
        en: Defenders may separately hold web-proxy, managed-DNS, mail-gateway, NetFlow or IPFIX, Zeek connection,
          DNS and TLS, endpoint file and process-network, and server access logs. The conclusion assumes an environment
          that preserves host, process, user, destination, and time join keys across those sources. Port-only or
          final connection summaries lose protocol semantics, short transactions, and file provenance. TLS, SSH,
          DoH, shared recursive resolvers, NAT, CDNs, and external SaaS further reduce visibility.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 把外传移出既有 C2 监控面并利用协议或服务路径覆盖缺口
    en: Move exfiltration outside existing C2 monitoring and exploit gaps in protocol or service-path coverage
  analysis:
    paragraphs:
    - zh: 攻击者选择与既有 C2 不同的协议、进程或受害服务接收路径，使原本可在单一通道重建的控制与回传分布到代理、解析器、邮件、流量和服务日志。若组织只围绕 C2 协议部署深度检查或只寻找主动外联上传，替代传输可能不进入该逻辑；OilRig
        的 DNS 控制与 FTP 上传、Dark Halo 的 OWA 响应式取回直接证明观察面发生分离。痕迹仍在其他来源中，因此效果取决于跨源关联是否存在。
      en: The adversary selects a protocol, process, or victim-service receiver path different from existing C2,
        distributing control and return traffic across proxy, resolver, mail, flow, and service logs rather than
        one channel. If deep inspection is deployed only around C2 or analytics look only for initiated uploads,
        the alternative transfer may fall outside that logic. OilRig's DNS control with FTP upload and Dark Halo's
        OWA response-based retrieval directly establish observation-surface separation. Traces remain elsewhere,
        so the effect depends on cross-source correlation.
  evidence_refs:
  - REF-000625
  - REF-000916
  - REF-000509
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 让失窃数据以合法协议事务和常见服务响应的外观出现
    en: Present stolen data with the appearance of legitimate protocol transactions and common service responses
  analysis:
    paragraphs:
    - zh: 攻击者把数据编码到 DNS 请求、邮件或其他协议字段，或让受害 Web 服务返回看似普通的静态资源。防守方可以观察事务，却难以仅凭协议名、端口或单次请求把它与正常解析、邮件和下载区分。ProjectSauron
        报告明确说明失窃信息被隐藏在正常邮件和 DNS 流量中，Dark Halo 的归档则以 OWA 路径中的 Redir.png 名称提供取回；异常标签结构、文件生成谱系和敏感来源仍可作为反证。
      en: The adversary encodes data into DNS requests, mail, or other protocol fields, or causes a victim web service
        to return what looks like an ordinary static resource. Defenders can observe the transaction but cannot
        classify it reliably from protocol name, port, or one request alone. ProjectSauron reporting explicitly
        states that stolen information was disguised in regular mail and DNS traffic, while Dark Halo exposed an
        archive under a Redir.png name in an OWA path. Abnormal label structure, file-generation lineage, and sensitive
        source data remain counterevidence.
  evidence_refs:
  - REF-000917
  - REF-000509
  confidence: high
- mechanism_ref: NM-DO
  role: secondary
  summary:
    zh: 使替代通道检查点只能看到受保护会话和不可直接解释的载荷
    en: Leave alternative-channel inspection points with a protected session and payload they cannot directly interpret
  analysis:
    paragraphs:
    - zh: 攻击者使用 SSH/SFTP、TLS 或附加加密后，网络检查点仍能看到端点、时间、方向字节、握手与证书，却无法直接恢复所传文件内容。RFC 4253 说明 SSH 传输提供加密与完整性，JPCERT/CC
        又确认 MirrorFace 使用 SFTP 外传；这支持内容可检查性变化，但没有证明某次事件实际绕过了特定产品。对称或非对称密钥协商只是实现，不形成两个 Niji 机理。
      en: When the adversary uses SSH or SFTP, TLS, or additional encryption, a network inspection point still sees
        endpoints, timing, directional bytes, handshakes, and certificates but cannot directly recover transferred
        file content. RFC 4253 specifies encryption and integrity for SSH transport, and JPCERT/CC confirmed MirrorFace
        using SFTP for exfiltration. Together they support a change in content inspectability, without proving that
        a particular product missed that incident. Symmetric or asymmetric key establishment is an implementation
        detail and does not form separate Niji mechanisms.
  evidence_refs:
  - REF-000918
  - REF-000919
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术按替代关系改变防守观察的主要变量划分三项：角色偏离协议出口改变工作负载允许的直接路径，协议语义载荷伪装把失窃数据映射到合法事务位置，检查不透明替代传输使检查点保留会话却失去内容语义。三者可以同现，但分别需要角色/中介基线、事务重建和端点到密文谱系。
      en: Three children divide the principal observation change in an alternative relationship. Role-Deviant Protocol
        Egress changes the direct path allowed for a workload. Protocol-Semantic Payload Camouflage maps stolen
        data into valid transaction positions. Inspection-Opaque Alternative Transfer leaves a session visible while
        removing content meaning at the inspection point. They can coexist but require role/intermediary baselines,
        transaction reconstruction, and endpoint-to-ciphertext lineage respectively.
    - zh: 加密密钥模型、协议名、端口和工具不构成兄弟边界；对称与非对称加密共同归入检查点可解释性。由受害服务响应外部拉取数据的方向变化虽然具有研究价值，但其父级归属需在 Web 服务候选和战术级缺口审查后确定，未纳入当前正式分类。
      en: Cryptographic key model, protocol name, port, and tool do not define siblings; symmetric and asymmetric
        protection converge on inspectability at the observation point. Direction reversal through outside retrieval
        from a victim service remains relevant research, but its parent ownership requires later web-service and
        tactic-gap review and is outside this formal taxonomy.
  coverage: established
  subtechnique_refs:
