research:
  limitations:
    paragraphs:
    - zh: 证据强度不均衡。ATT&CK 19.1 精确固定父行为和三个密码实现子项；OilRig 给出 DNS 控制到 FTP PUT 的跨协议链，ProjectSauron 直接给出正常流量伪装，MirrorFace
        只证明 SFTP 外传，Dark Halo 给出 OWA 产物路径和取回 URL。公开资料均未提供受害者完整网络策略和告警前后对照，因此 ROLE、OPAQUE 与 PULL 的匿迹效果保持 medium 或以本地验证为条件。
      en: Evidence strength varies. ATT&CK 19.1 fixes the parent behavior and three cryptographic implementation
        children. OilRig provides a cross-protocol chain from DNS control to FTP PUT, ProjectSauron directly states
        regular-traffic camouflage, MirrorFace establishes only SFTP exfiltration, and Dark Halo provides the OWA
        artifact path and retrieval URL. None publishes the victim's complete network policy and before-and-after
        alert comparison, so stealth effect for ROLE, OPAQUE, and PULL remains medium or conditional on local validation.
    - zh: ATT&CK 父页部分 procedure 把数据送往 C2 服务器也列入 T1048，固定定义又要求不同于既有 C2 的协议；Niji 应优先遵守行为边界并逐案证明关系，不能把“curl、HTTPS、FTP
        或 DNS 出现”当作自动准入。加密、归档、字段编码、第三方 Web 服务和介质变化均有相邻技术，组合使用允许多重标注但不得吞并边界。
      en: Some ATT&CK parent procedures describe data sent to a C2 server even though the fixed definition requires
        a protocol different from existing C2. Niji should prioritize the behavioral boundary and prove the relationship
        case by case rather than treating curl, HTTPS, FTP, or DNS as automatic admission. Encryption, archiving,
        field encoding, third-party web services, and medium changes have adjacent techniques; combined use can
        receive multiple tags without collapsing boundaries.
