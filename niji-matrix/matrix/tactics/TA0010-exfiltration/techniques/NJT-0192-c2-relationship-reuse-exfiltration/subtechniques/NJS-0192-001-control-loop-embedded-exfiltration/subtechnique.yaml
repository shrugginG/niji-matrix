research:
  limitations:
    paragraphs:
    - zh: 两项事件研究提供 HTTP 层面的控制与数据回传顺序，但未公开完整 PCAP、消息模式统计、误报率或部署阈值，也未证明每次回传都在同一 TCP/TLS socket 中完成。因此本子项只声称重复控制事务族的内嵌，不把持久传输会话续用或检测绕过效果写成事实。
      en: The two incident studies provide HTTP-level control and data-return sequences but do not publish complete
        PCAP, message-pattern statistics, false-positive rates, or deployment thresholds, and do not show that every
        return used one TCP or TLS socket. This child therefore claims embedding in a recurring control-transaction
        family only and does not present persistent-transport-session reuse or measured detection bypass as fact.
