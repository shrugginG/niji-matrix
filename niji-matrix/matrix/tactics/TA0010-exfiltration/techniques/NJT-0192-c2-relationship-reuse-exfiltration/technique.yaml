research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定版能够锚定既有 C2 关系与相同协议，SolarMarker 对“existing C2 channel”的表述最直接，FakeUpdates 对重复请求族和数据类型的观察最具体；但“channel”在公开材料中多为逻辑关系，不能自动解释为一个持续
        socket。为避免证据越级，正式定义允许重复短连接，子项只划分控制事务族内嵌，持久会话续用保持待补证据。
      en: The ATT&CK T1041 page anchors an existing C2 relationship and the same protocol, SolarMarker is most explicit
        about an “existing C2 channel,” and FakeUpdates is most concrete about repeated request features and data
        types. Public sources generally use “channel” as a logical relationship and cannot be read automatically
        as one persistent socket. To avoid exceeding the evidence, the formal definition allows repeated short connections,
        the child is limited to control-transaction-family embedding, and persistent-session continuation remains
        deferred.
    - zh: DET0348、Zeek 与 Sysmon 说明可实施的字段和关联方向，不证明某阈值或查询具有普遍准确度。Sysmon Event 3 默认未必启用，Windows 对象访问依赖 SACL 与部署，Zeek
        conn.log 通常在连接结束后产生，TLS 和共享代理会隐藏应用事务或原主机。正式 Analytic 应在本地验证字段、留存、时间和连接身份，缺少源数据访问时不得仅凭出站字节声称已发生外传。
      en: DET0348, Zeek, and Sysmon establish implementable fields and correlation directions, not universal accuracy
        for a threshold or query. Sysmon Event 3 may be disabled, Windows object access depends on SACL and deployment,
        Zeek conn.log is generally emitted after connection close, and TLS or shared proxies can hide application
        transactions or originating hosts. A canonical Analytic must validate fields, retention, time, and connection
        identity locally and must not claim exfiltration from outbound bytes alone when source-data access is absent.
    - zh: 出口限制与关系终止会降低继续外送机会，但可能影响使用共享云、CDN 或合法远程管理产品的业务。已经外送的数据无法由后续控制追回，且攻击者可切换备用 C2、协议或服务；因此缓解应用必须同时处置端点植入、凭据与重连路径，并把新路径交给相邻候选分析。
      en: Egress restriction and relationship termination reduce the opportunity for continued transfer but can
        disrupt business using shared cloud, CDN, or legitimate remote-management products. Controls cannot recover
        data already sent, and the attacker may switch to alternate C2, protocol, or service. Mitigation must therefore
        address the endpoint implant, credentials, and reconnection paths together and route any new path to the
        adjacent candidate analysis.
