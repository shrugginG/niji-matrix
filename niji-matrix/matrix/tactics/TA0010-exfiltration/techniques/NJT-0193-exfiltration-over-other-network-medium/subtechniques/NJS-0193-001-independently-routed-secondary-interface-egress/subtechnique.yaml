research:
  limitations:
    paragraphs:
    - zh: ATT&CK T1011 页面与 NIST 威胁目录支持能力和观察盲区，但本研究未取得公开 Enterprise 入侵中经蜂窝或第二 Wi-Fi 完成敏感文件外传的结论级案例。因此该子项的行为与防御差异为
        medium，具体归因必须有本地接口、发送字节和外部目的地证据。
      en: The ATT&CK T1011 page and NIST threat catalogue support capability and observation blind spots, but this
        research found no conclusion-level public Enterprise incident proving sensitive-file exfiltration through
        cellular or a second Wi-Fi path. Behavior and defense distinction remain medium confidence, and a specific
        attribution requires local interface, sent-byte, and external-destination evidence.
