schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0193-001
parent_ref: NJT-0193
name:
  zh: 独立路由次要接口外传
  en: Independently Routed Secondary-Interface Egress
summary:
  zh: 通过具有独立地址和网关的次要接口直接连接外部网络，使外传绕开主要企业出口并只在端点和外部网络留下完整路径。
  en: Connect directly to an external network through a secondary interface with independent addressing and gateway,
    bypassing primary enterprise egress and leaving the complete path only at the endpoint and outside network.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 独立路由次要接口外传是攻击者启用或利用目标上的第二网络接口，使外送流量通过不同于主要受管网络的地址、网关或策略路由到达外部目的地。稳定变量是独立路由路径；以太网、Wi-Fi、蜂窝、调制解调器、Bluetooth
      PAN 或虚拟适配器只是实现，只有实际映射到独立出口时才成立。
    en: Independently Routed Secondary-Interface Egress enables or uses a second network interface on the target
      so outbound traffic reaches an external destination through addressing, gateway, or policy routing distinct
      from the primary managed network. The stable variable is the independent routed path. Ethernet, Wi-Fi, cellular,
      modem, Bluetooth PAN, or virtual adapters are implementations and qualify only when mapped to an independent
      egress.
stealth_characteristics:
  paragraphs:
  - zh: 独立路由次要接口外传使企业防火墙、代理和 NDR 不再处于转发路径，因而主要出口没有与敏感读取对应的远端连接。端点仍可见新接口 up、公共 connected network、IP/default gateway
      变化、进程 LocalIP 与外部目的地；运营商、热点或访客网络也可能留痕。若 EDR 不能把 LocalIP 映射回 adapter，网络事件会被错误地看作普通连接。
    en: Independently Routed Secondary-Interface Egress makes enterprise firewall, proxy, and NDR leave the forwarding
      path, so primary egress has no remote connection corresponding to sensitive access. The endpoint still exposes
      interface-up state, a public connected network, IP or default-gateway change, and the process LocalIP and
      external destination; carrier, hotspot, or guest network may also log activity. Without mapping LocalIP back
      to an adapter, EDR can misread the event as an ordinary connection.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求次要接口在相关时段具有独立出口，发起进程或路由把外送数据绑定到该路径，并有发送字节或接收结果。合法故障切换、差旅连接、企业 WWAN 与双链路 SD-WAN 必须按批准 profile、服务身份、目的地与变更工单排除。若接口仍把流量送入相同受管网关，不构成本子项；若变化只在协议层，归
      T1048。
    en: Inclusion requires independent egress on the secondary interface during the relevant interval, process or
      routing binding outward data to that path, and sent bytes or receiver outcome. Authorized failover, travel
      connectivity, enterprise WWAN, and dual-link SD-WAN require exclusion by approved profile, service identity,
      destination, and change record. An interface that still feeds the same managed gateway does not qualify, and
      a protocol-only change belongs to T1048.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可在有线企业工作站上启用内置 Wi-Fi 并连接未受管热点，或使用已存在的蜂窝/调制解调器接口建立独立公网路由，再让外传进程绑定该接口的 LocalIP。公开 Enterprise 事件证据有限；NIST
        对蜂窝路径无法由企业网络机制直接分析的说明支持观察模型，而非证明某个已知行为者的实施。
      en: An adversary can enable built-in Wi-Fi on a wired enterprise workstation and join an unmanaged hotspot,
        or use an existing cellular or modem interface to create independent public routing and bind the exfiltration
        process to that interface's LocalIP. Public Enterprise incident evidence is limited. NIST's statement that
        cellular paths cannot be directly analyzed by enterprise network mechanisms supports the observation model
        rather than a known actor implementation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要操作 adapter 或连接 profile 的权限、可用热点/蜂窝服务、地址与路由控制，以及能选择源地址或服从新默认路由的外传程序。接口策略、SIM/eSIM 管理、信号覆盖、门户认证、数据上限和防火墙会限制可行性。
        en: The adversary needs authority over the adapter or connection profile, an available hotspot or cellular
          service, address and route control, and an exfiltration program that can select a source address or follow
          the new default route. Interface policy, SIM or eSIM management, radio coverage, captive authentication,
          data caps, and firewalling constrain feasibility.
    defender_model:
      paragraphs:
      - zh: 防守方把 DeviceNetworkInfo 等 adapter 快照的 IPAddresses、ConnectedNetworks 和 DefaultGateways 与进程网络事件的 LocalIP
          连接，并使用按接口流量计数或本地防火墙字节确认外送。主要边界的未见记录只有在覆盖完整时才作为差分。虚拟 VPN/tunnel adapter 需单独基线，避免误判为物理旁路。
        en: Defenders join IPAddresses, ConnectedNetworks, and DefaultGateways from adapter snapshots such as DeviceNetworkInfo
          to LocalIP in process network events and use per-interface counters or local firewall bytes to confirm
          sending. Non-observation at primary egress is used only when coverage is known complete. Virtual VPN or
          tunnel adapters require separate baselines to avoid treating them as physical bypasses.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 独立接口把外传痕迹从企业网关移到端点和外部网络
    en: An independent interface moves exfiltration traces from enterprise gateway to endpoint and outside network
  analysis:
    paragraphs:
    - zh: 外传进程选择次要接口地址或独立默认路由后，数据不穿过原企业出口，边界流量检测失去直接事件；痕迹改为分布在端点 adapter/route、进程 socket 和外部运营网络。NIST 明确指出蜂窝连接不能由企业网络机制直接分析，Microsoft
        字段说明端点仍可保留 adapter 和 LocalIP 关系。跨这两个视点关联可恢复路径。
      en: After the exfiltration process selects a secondary-interface address or independent default route, data
        does not traverse the original enterprise egress and boundary detection loses the direct event. Traces distribute
        across endpoint adapter and route, process socket, and outside carrier network. NIST explicitly notes that
        cellular connections cannot be directly analyzed by enterprise network mechanisms, while Microsoft fields
        show that endpoint adapter and LocalIP relationships remain. Correlation across those views recovers the
        path.
