research:
  limitations:
    paragraphs:
    - zh: Flame 来源证明模块能力但公开文本未给出某起受害事件的发送量、接收设备和成功接收结果；BLEWhisperer 是实验研究而非野外攻击。Bluetooth/NFC/AirDrop 的审计字段在平台间差异很大，不能假定所有端点都有
        peer、profile 与方向字节。正式案例证据应继续区分发现、会话、发送和接收四层。
      en: Flame material establishes module capability but does not provide victim-specific byte volume, receiver
        device, or successful receipt in the public text. BLEWhisperer is experimental research rather than an incident.
        Audit fields for Bluetooth, NFC, and AirDrop vary greatly by platform, so peer, profile, and directional
        bytes cannot be assumed everywhere. Formal case evidence must keep discovery, session, send, and receipt
        as separate levels.
