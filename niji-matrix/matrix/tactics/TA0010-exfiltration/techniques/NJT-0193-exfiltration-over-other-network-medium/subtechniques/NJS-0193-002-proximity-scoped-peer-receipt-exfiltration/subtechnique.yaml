schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0193-002
parent_ref: NJT-0193
name:
  zh: 近距对等接收外传
  en: Proximity-Scoped Peer-Receipt Exfiltration
summary:
  zh: 将数据通过本地短距网络交给有效范围内的 peer，使企业 IP 出口没有远端连接，并把接收者归因分散到设备身份和物理邻近。
  en: Deliver data over a local short-range network to a peer within range, leaving no remote connection at enterprise
    IP egress and distributing receiver attribution across device identity and physical proximity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 近距对等接收外传是受控进程经短距网络会话、广播或面向 peer 的服务把数据交给附近接收设备。稳定变量是接收者由本地 radio 范围和 peer 关系限定，而不是 Bluetooth 名称；Bluetooth、BLE
      advertisement、NFC 或平台邻近共享只有在承载网络式数据交付且接收者仍在线时才是实现。
    en: Proximity-Scoped Peer-Receipt Exfiltration uses a short-range network session, advertisement, or peer-oriented
      service to deliver data from a controlled process to a nearby receiver. The stable variable is a receiver
      bounded by local radio range and peer relation, not the Bluetooth name. Bluetooth, BLE advertisement, NFC,
      or platform nearby sharing are implementations only when carrying network-like data delivery while the receiver
      remains online.
stealth_characteristics:
  paragraphs:
  - zh: 近距对等接收外传使企业 IP 边界没有可路由远端目的地，短距 peer 地址还可能随机化或只在一次会话中存在，使接收者难以与长期攻击基础设施关联。残余包括 radio enable、discoverability、scan/pair/connect、service/profile、发起进程、方向字节和连接失败；有
      RF 或物理位置记录时，可以把 peer 出现范围与发送者时间线连接。
    en: Proximity-Scoped Peer-Receipt Exfiltration makes enterprise IP egress has no routable remote destination,
      while short-range peer addresses may randomize or exist for one session, making the receiver difficult to
      connect to long-lived adversary infrastructure. Residuals include radio enablement, discoverability, scan,
      pair, connect, service or profile, initiating process, directional bytes, and failures. RF or physical-location
      records can join peer presence to the sender timeline.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求实际短距网络发送或有可执行发送链、未批准 peer，以及外传数据或字节结果。仅发现附近设备、发送 beacon 状态、连接耳机或键盘不证明外传。若设备被当作挂载存储并在断开后搬运，归 T1052；若
      Bluetooth PAN 建立独立公网路由，则归兄弟“独立路由次要接口外传”；若只是协议变更而仍走主网，归 T1048。
    en: Inclusion requires an actual short-range network send or executable send chain, an unapproved peer, and
      exfiltrated data or byte outcome. Nearby-device discovery, status beaconing, or headset and keyboard connections
      do not establish exfiltration. A device used as mounted storage and carried after disconnect belongs to T1052.
      A Bluetooth PAN with independent public routing belongs to sibling Independently Routed Secondary-Interface
      Egress. A protocol change over the primary network belongs to T1048.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Flame 的 BeetleJuice 模块能够识别附近 Bluetooth 设备、发布包含状态的 beacon，并被报告可从感染主机传输编码信息。该能力适合攻击者或受控设备在办公室、会议室、酒店或其他短距范围内接收小规模数据。BLEWhisperer
        进一步以实验说明 advertisement 可构造低速外传，展示无传统连接流时的可行性与吞吐限制。
      en: Flame's BeetleJuice module can identify nearby Bluetooth devices, advertise a beacon carrying status,
        and was reported capable of transmitting encoded information from the infected host. The capability fits
        receipt by an attacker or controlled device within office, conference room, hotel, or another short-range
        location. BLEWhisperer experimentally shows that advertisements can form a low-rate exfiltration channel,
        establishing feasibility and throughput constraints without a conventional connection flow.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制发送进程和 radio API，准备兼容接收者并保持其在有效范围内；某些实现还需配对、用户确认或已批准 service/profile。距离、干扰、地址随机化、低吞吐、功耗和接收者暴露是主要限制，较大文件可能需要长时间或多次会话。
        en: The adversary needs control of the sender process and radio API, a compatible receiver, and presence
          within effective range. Some implementations also require pairing, user confirmation, or an approved service
          or profile. Distance, interference, address randomization, low throughput, power use, and receiver exposure
          are primary limits, and larger files may require long or repeated sessions.
    defender_model:
      paragraphs:
      - zh: 防守方假定能获得 adapter 状态、scan/pair/connect/service 日志、peer identity、发起进程、方向字节及批准外设清单，并在高价值区域可选地使用 RF 或物理接近记录。很多平台不会提供完整字节或
          peer 稳定标识，因此需要把敏感文件读取、非交互进程和重复短距发送作为组合证据。
        en: Defenders are assumed to obtain adapter state, scan, pair, connect, and service logs, peer identity,
          initiating process, directional bytes, and an approved-peripheral inventory, with optional RF or physical-proximity
          records in high-value areas. Many platforms lack complete bytes or stable peer identifiers, so sensitive-file
          reads, non-interactive processes, and repeated short-range sends must be combined.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 把接收者和发送痕迹分散到短距 peer 会话与物理邻近范围
    en: Distribute receiver and send traces across a short-range peer session and physical proximity
  analysis:
    paragraphs:
    - zh: 数据通过本地 peer 链路离开主机时，企业网关没有远端 IP 流，接收端身份只出现在 radio 会话并受距离约束。NIST 指出 Bluetooth/NFC 需要邻近接收者且较少被企业机制监测，Flame
        和 BLEWhisperer 分别支持恶意功能与技术可行性。防守方必须跨端点进程、peer、方向字节和位置恢复链，因此形成时空释痕。
      en: When data leaves over a local peer link, the enterprise gateway has no remote IP flow and receiver identity
        appears only in a distance-bounded radio session. NIST notes that Bluetooth or NFC requires a nearby receiver
        and is less likely to be monitored by enterprise mechanisms, while Flame and BLEWhisperer support malicious
        functionality and technical feasibility respectively. Defenders must reconstruct the chain across endpoint
        process, peer, directional bytes, and location, producing Spatiotemporal Trace Dilution.
