research:
  limitations:
    paragraphs:
    - zh: T1011 的公开 Enterprise 事件证据稀少。ATT&CK T1011 页面直接证明父行为和传感器边界，Flame 证明 Bluetooth 恶意模块能力，BLEWhisperer 证明低速技术可行性，NIST
        APP-30 证明移动设备上的企业分析盲区；这些来源不能合并成某个已观察攻击者在 Windows/Linux/macOS 企业终端完成大规模旁路外传的事实。正式实例必须按本地 adapter/peer、发送字节和接收结果校准。
      en: Public Enterprise incident evidence for T1011 is sparse. The ATT&CK T1011 page establishes the parent
        behavior and sensor boundary, Flame establishes malicious Bluetooth module capability, BLEWhisperer establishes
        low-rate technical feasibility, and NIST APP-30 establishes enterprise-analysis blind spots on mobile devices.
        These sources cannot be combined into a claim that an observed actor completed large-scale bypass exfiltration
        from Enterprise Windows, Linux, or macOS endpoints. Formal instances require local adapter or peer, sent-byte,
        and receipt evidence.
    - zh: 网络接口与近距 radio 的日志质量跨平台差异大。DeviceNetworkInfo 是状态快照而非完整生命周期，DeviceNetworkEvents 的标准字段不提供发送字节，Bluetooth/NFC/AirDrop
        也常缺少发起进程或稳定 peer。Analytic 必须允许 capability、session、send 和 receipt 分级，不能因发现新接口、未知 peer 或主要出口无记录就直接宣布外传。
      en: Logging quality for network interfaces and proximity radios varies substantially by platform. DeviceNetworkInfo
        is a state snapshot rather than a complete lifecycle, standard DeviceNetworkEvents fields do not provide
        sent bytes, and Bluetooth, NFC, or AirDrop often lacks initiating process or stable peer identity. Analytics
        must grade capability, session, send, and receipt rather than declaring exfiltration from a new interface,
        unknown peer, or absent primary-egress record.
    - zh: 企业环境合法使用热点、蜂窝故障切换、外设、邻近共享与 BYOD，会产生强相似背景。按资产角色建立允许接口、网络、route、peer class、service/profile 与业务窗口比按技术名称封禁更可靠。物理邻近和
        RF 数据受隐私与权限约束，仅应在明确授权区域使用。
      en: Enterprise use of hotspots, cellular failover, peripherals, nearby sharing, and BYOD creates strong benign
        background. Baselines of allowed interface, network, route, peer class, service or profile, and business
        window by asset role are more reliable than blocking by technology name. Physical-proximity and RF data
        carry privacy and authority constraints and should be used only in explicitly authorized areas.
