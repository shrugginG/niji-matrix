schema_version: 2.0.0
type: technique
id: NJT-0193
name:
  zh: 经其他网络介质渗出
  en: Exfiltration Over Other Network Medium
summary:
  zh: 攻击者通过不受主要企业出口监测的独立网络接口或近距对等链路外送数据，使边界传感器看不到完整外传路径。
  en: Adversaries send data through an independently routed network interface or proximity peer link outside primary
    enterprise-egress monitoring, preventing boundary sensors from seeing the complete exfiltration path.
aliases: []
classification:
  tactic_refs:
  - TA0010
  origin:
    kind: attack-retained
    source_attack_id: T1011
    source_attack_version: '19.1'
  decision_ref: DEC-TA0010-T1011
definition_and_concept:
  paragraphs:
  - zh: 经其他网络介质渗出是攻击者让数据从主要企业网络和既有 C2 网络路径之外的联网接口、无线承载或近距网络会话离开受害环境。直接目标是完成外传，概念重点是数据路径穿过不同的网络介质和管理域，导致原本覆盖主要出口的防守传感器不再处于转发路径上。
    en: Exfiltration Over Other Network Medium sends data out of the victim environment through a networked interface,
      wireless bearer, or proximity network session outside the primary enterprise and established C2 network path.
      The direct objective is exfiltration. Its conceptual focus is a data path crossing a different medium and
      administrative domain, leaving defenders that monitor the primary egress outside the forwarding path.
  - zh: 网络介质表示仍有接口、地址/peer、会话或包/字节交付语义；可移动存储的复制、断开与人工携带归 T1052。改变应用或传输协议但仍走原企业出口归 T1048；在原路径上创建到 collector 的副本归
      T1020；是否自动、定时或限速分别由 T1020、T1029 与 T1030 描述。具体协议和无线品牌不定义本技术。
    en: Network medium retains interface, address or peer, session, and packet or byte delivery semantics. Copying
      to removable storage, disconnecting, and physical carriage belong to T1052. Changing application or transport
      protocol while retaining the original enterprise egress belongs to T1048. Creating a collector copy on the
      original path belongs to T1020. Automation, scheduling, and rate or size limits are described by T1020, T1029,
      and T1030 respectively. A specific protocol or radio brand does not define this technique.
stealth_characteristics:
  paragraphs:
  - zh: 替代介质把外传流从企业防火墙、代理、NDR、DNS 与 NetFlow 的主要视野中移走。独立路由接口仍在端点留下 adapter 状态、连接网络、IP、默认网关、本地地址与发起进程；近距对等链路则留下 radio
      enable、发现/配对、peer、服务/profile、会话方向和字节计数。防守方如果只验证主要出口“没有异常”，会把传感器未覆盖误当成没有外传。
    en: An alternate medium moves exfiltration out of the primary view of enterprise firewalls, proxies, NDR, DNS,
      and NetFlow. An independently routed interface still leaves adapter state, connected network, IP, default
      gateway, local address, and initiating process at the endpoint. A proximity peer link leaves radio enablement,
      discovery or pairing, peer, service or profile, session direction, and byte counters. A defender that verifies
      only that primary egress looks normal can mistake lack of sensor coverage for absence of exfiltration.
  - zh: 匿迹效果取决于观察边界，而不是无线天然不可见。EDR、MDM、接口配置快照、操作系统连接日志、短距链路审计、RF 监测、运营商或访客网络记录仍可能恢复活动。新启用接口、非批准公网网络、敏感文件读取后持续发送、异常
      peer 或默认路由变化都是残余；在受管 Wi-Fi 与有完整端点遥测的环境中，替代介质优势会明显下降。
    en: Stealth depends on the observation boundary rather than wireless being inherently invisible. EDR, MDM, adapter
      snapshots, OS connection logs, short-range link audit, RF monitoring, and carrier or guest-network records
      may recover activity. A newly enabled adapter, unapproved public network, sustained send after sensitive-file
      access, anomalous peer, or default-route change remains. The advantage falls sharply on managed Wi-Fi with
      complete endpoint telemetry.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要识别非主要网络介质或接口、实际外送或可执行会话、以及该路径绕开主要企业网络传感器的关系。合法 WWAN 故障切换、差旅热点、家庭/访客 Wi-Fi、外设配对、AirDrop/邻近共享与辅助无障碍设备会形成相似痕迹，必须用资产角色、批准网络/peer、用户上下文、数据来源、发送字节和外部结果排除正常行为。
    en: Inclusion requires an identifiable non-primary network medium or interface, actual outward transfer or an
      executable session, and a relationship showing that the path bypasses primary enterprise-network sensors.
      Authorized WWAN failover, travel hotspots, home or guest Wi-Fi, peripheral pairing, AirDrop or nearby sharing,
      and assistive devices produce similar traces and require exclusion using asset role, approved network or peer,
      user context, data source, sent bytes, and external outcome.
  - zh: 若接口只是建立但没有数据外送，只能确认旁路能力；若数据仍经同一企业网关，仅使用了不同协议，则归 T1048。短距设备仅作为离线存储接收文件、之后被拔出携带时归 T1052；只有连接期间存在网络会话和 peer-to-peer
      字节交付时才归本技术。网络控制面把原始流量镜像给 collector 而端点没有选择新介质时归 T1020 复制轴。
    en: An established interface without outward data confirms bypass capability only. Data using a different protocol
      over the same enterprise gateway belongs to T1048. A short-range device that receives files merely as offline
      storage and is later unplugged and carried belongs to T1052; this technique requires a network session and
      peer-to-peer byte delivery while connected. A network control plane that mirrors the original flow to a collector
      while the endpoint selects no new medium belongs to T1020's replica axis.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在同时具备受管以太网和蜂窝、未受管 Wi-Fi 或调制解调器的工作站上，攻击者可以启用次要接口、获得独立地址和默认/策略路由，再将已收集数据发送到外部地址。企业边界只看到原主要接口保持正常，端点却经另一个运营商或公共网络完成传输。NIST
        的移动威胁目录明确指出蜂窝连接不能由企业网络安全机制直接分析，这一观察支持传感器边界差异，但不是 Enterprise 环境的具体攻击事件。
      en: On a workstation with managed Ethernet plus cellular, unmanaged Wi-Fi, or a modem, an adversary can enable
        the secondary interface, obtain an independent address and default or policy route, and send collected data
        to an external address. The enterprise boundary sees the original primary interface remain normal while
        the endpoint completes transfer through another carrier or public network. NIST's Mobile Threat Catalogue
        explicitly notes that cellular connections cannot be directly analyzed by enterprise network security mechanisms.
        That supports the sensor-boundary difference but is not a specific Enterprise incident.
    - zh: 在需要近距离接收者的环境中，攻击者可让受控进程通过短距网络向附近设备交付编码信息。Flame 的 BeetleJuice 模块被公开分析为具备经 Bluetooth 从受感染系统传输编码信息、发布 beacon
        和发现附近设备的功能；公开资料证明恶意能力，但未证明某一受害事件中已完成多少字节的外传。BLEWhisperer 的实验则证明 BLE advertisements 可以实现低速数据外传并受距离与吞吐限制。
      en: Where a nearby receiver is available, an adversary can have a controlled process deliver encoded information
        to a local device over a short-range network. Public analysis of Flame's BeetleJuice module describes capability
        to transmit encoded information from an infected system over Bluetooth, advertise a beacon, and discover
        nearby devices. The evidence establishes malicious capability but not the byte volume completed in a particular
        victim incident. BLEWhisperer experimentally establishes low-rate exfiltration through BLE advertisements
        under proximity and throughput constraints.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 独立路由接口需要攻击者控制适配器启用、网络关联、地址配置与进程绑定或路由，并维持一个不经受管出口的可用外部网络。近距对等传输需要短距 radio 权限、发现或已知 peer、兼容服务/profile，以及接收者在有效范围内。设备策略、物理射频环境、数据上限、带宽、功耗、配对提示和用户可见通知都会限制行动。
        en: Independently routed egress requires authority to enable an adapter, associate to a network, configure
          addressing, and bind process or route, plus a usable external network outside managed egress. Proximity
          transfer requires short-range radio authority, discovery or knowledge of a peer, a compatible service
          or profile, and a receiver within range. Device policy, physical RF environment, data caps, bandwidth,
          power, pairing prompts, and user-visible notifications constrain the operation.
      - zh: 为保持低可见性，攻击者还需避免接口频繁切换、陌生 SSID/peer、异常默认路由、长时高字节发送和配对弹窗。独立介质失效时，数据可能积压或回落到受管网络并暴露；近距接收者离开范围时也会产生重试与连接失败。
        en: To remain less visible, the adversary must avoid frequent interface transitions, unfamiliar SSIDs or
          peers, anomalous default routes, long high-byte sends, and pairing prompts. Failure of the independent
          medium can cause backlog or fallback to the managed network, while a proximity receiver leaving range
          creates retries and connection failures.
    defender_model:
      paragraphs:
      - zh: 防守方假定拥有资产级接口清单、连接网络/peer 基线、接口状态与默认网关快照、发起进程网络事件、按接口或本地地址的发送计数、敏感文件访问和主要边界流量覆盖图。Microsoft DeviceNetworkInfo
          提供 adapter type/status、connected networks、IP 与 default gateway，DeviceNetworkEvents 提供 LocalIP 和发起进程；二者需按
          DeviceId、时间和 LocalIP 连接，且常规 DeviceNetworkEvents 没有可依赖的发送字节字段。
        en: The defender is assumed to have an asset-level interface inventory, connected-network or peer baseline,
          adapter state and default-gateway snapshots, initiating-process network events, sent counters by interface
          or local address, sensitive-file access, and a map of primary-boundary coverage. Microsoft DeviceNetworkInfo
          exposes adapter type and status, connected networks, IPs, and default gateways, while DeviceNetworkEvents
          exposes LocalIP and initiating process. They require a join by DeviceId, time, and LocalIP, and standard
          DeviceNetworkEvents has no reliable sent-byte field.
      - zh: 防守盲区包括适配器快照过稀、peer 地址随机化、操作系统不记录 Bluetooth/NFC/AirDrop 方向字节、共享用户设备不受 MDM、无线芯片或基带固件行为不进入 EDR，以及主要边界本身覆盖不完整。若无法证明主要出口在同一时间段有完整覆盖，“边界未见流量”只能是低置信度旁证。
        en: Blind spots include sparse adapter snapshots, peer-address randomization, OS logs without directional
          bytes for Bluetooth, NFC, or AirDrop, unmanaged personal devices, radio-chip or baseband behavior outside
          EDR, and incomplete primary-boundary coverage. When complete coverage of the primary egress cannot be
          established for the same interval, absence from that boundary is only low-confidence supporting evidence.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将外传流量移出主要企业出口传感器并分散到端点与邻近网络
    en: Move exfiltration outside primary enterprise-egress sensors and distribute traces across endpoint and nearby
      networks
  analysis:
    paragraphs:
    - zh: 攻击者选择独立路由接口或短距 peer，使本应集中于企业网关的外送痕迹转移到端点 adapter、公共/运营商网络或邻近接收设备。主要边界只能看到正常或缺失的原路径活动，完整链需要连接接口状态、本地地址、进程、peer
        和外部接收。ATT&CK 与 NIST 均指出这些介质不通过或难由同一企业网络机制直接分析，支持时空释痕因果；这不代表替代介质没有其他传感器。
      en: The adversary selects an independently routed interface or short-range peer, moving egress traces that
        would otherwise concentrate at the enterprise gateway to endpoint adapters, a public or carrier network,
        or a nearby receiver. The primary boundary sees normal or absent original-path activity, and reconstruction
        requires joining interface state, local address, process, peer, and external receipt. ATT&CK and NIST both
        note that these media do not traverse or cannot be directly analyzed by the same enterprise mechanisms,
        supporting Spatiotemporal Trace Dilution without implying that the alternate medium has no sensors.
  evidence_refs:
  - REF-000930
  - REF-000933
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 主要企业边界保持无异常结果而端点经旁路接口完成外送
    en: Keep the primary enterprise boundary apparently normal while endpoint egress completes over a bypass interface
  analysis:
    paragraphs:
    - zh: 当进程绑定次要本地地址或短距会话时，主要企业出口没有对应远端连接，常规网络检测可能把“未观察到外传”当作正常。行为事实没有被删除，而是落在另一接口和管理域；用端点 adapter/peer 事件与主要边界覆盖差分能够恢复这种观察空白。其置信度依赖边界传感器在同一时段的覆盖证明。
      en: When a process binds a secondary local address or short-range session, the primary enterprise egress has
        no corresponding remote connection, and routine network detection may treat non-observation as normal. The
        behavior is not erased; it lands on another interface and administrative domain. A differential between
        endpoint adapter or peer events and verified primary-boundary coverage recovers the gap, with confidence
        dependent on proof of boundary coverage during the same interval.
  evidence_refs:
  - REF-000930
  - REF-000934
  - REF-000604
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两个子项按替代介质的路径拓扑和接收者归因划分。独立路由次要接口仍建立到可路由外部目的地的 IP 网络路径，关键痕迹是 adapter、connected network、local IP、gateway/route
        与发起进程；近距对等接收把数据交给本地 radio 范围内的 peer，关键痕迹是发现/配对、peer、service/profile、方向字节与物理邻近。二者的传感器位置和缓解方法不同，可以组合但不能互相替代。
      en: The children are divided by alternate-medium path topology and receiver attribution. An independently
        routed secondary interface still establishes an IP path to a routable external destination, leaving adapter,
        connected network, local IP, gateway or route, and initiating-process traces. Proximity-scoped peer delivery
        hands data to a peer within local radio range, leaving discovery or pairing, peer, service or profile, directional
        bytes, and physical-proximity traces. Sensor placement and mitigations differ; the variables may combine
        but do not substitute for one another.
    - zh: Bluetooth 既可能承载 PAN 等可路由路径，也可能承担本地 peer 传输，因此协议名称不能决定子项。Wi-Fi、蜂窝和调制解调器同样只作为实现。固定基线 T1011.001 的 Flame 资料主要支持近距对等轴，原
        ATT&CK 名称没有继承。
      en: Bluetooth may carry a routable PAN or a local peer transfer, so the protocol name cannot select a child.
        Wi-Fi, cellular, and modem are likewise implementations. Flame material under fixed-baseline T1011.001 mainly
        supports the proximity-peer axis, and the ATT&CK child name is not inherited.
  coverage: established
  subtechnique_refs:
