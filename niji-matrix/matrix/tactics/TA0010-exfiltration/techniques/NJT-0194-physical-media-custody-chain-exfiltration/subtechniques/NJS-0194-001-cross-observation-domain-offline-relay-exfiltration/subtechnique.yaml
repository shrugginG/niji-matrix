schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0194-001
parent_ref: NJT-0194
name:
  zh: 跨观察域离线接续外传
  en: Cross-Observation-Domain Offline Relay Exfiltration
summary:
  zh: 同一介质在隔离或高控制源侧承载数据后断开，并在另一系统或区域重新接入继续交付，使任何单一观察域只看到外传链的一部分。
  en: The same medium carries data from an isolated or tightly controlled source, disconnects, and is reattached
    in another system or zone to continue delivery, leaving each observation domain with only part of the exfiltration
    chain.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨观察域离线接续外传是物理介质保管链外传的一种实现：介质在源系统或隔离区接收被盗数据，经历断开和物理转运，再在另一主机、网络区或攻击者接收点接入，数据由此继续复制、上传或取走。子项变量是写入与接收是否分属不同观察域，而不是介质型号、往返次数或接收侧所用网络协议。
    en: Cross-Observation-Domain Offline Relay Exfiltration is a form of physical-media custody exfiltration in
      which the medium receives stolen data on a source system or isolated zone, undergoes disconnection and physical
      transport, and is then attached at another host, network zone, or attacker receiver for continued copying,
      upload, or removal. The child variable is whether writing and receipt occur in different observation domains,
      not media model, trip count, or the receiver-side network protocol.
stealth_characteristics:
  paragraphs:
  - zh: 跨观察域离线接续外传把源数据读取与最终接收之间的直接会话替换为介质往返和保管间隔。源区只见敏感读取、介质写入与断开，接收区只见后续介质接入、读取或外联；任一侧都不能单独证明完整路径。USBStealer 明确用同一介质在联网
      A 与隔离 B 间往返，并在 B 写回感兴趣文件后由 A 侧取回，留下设备硬件 ID、主机名目录、复制文件和接续时间等残余关联键。
    en: Cross-Observation-Domain Offline Relay Exfiltration replaces a direct session from source access to receipt
      with media trips and a custody interval. The source zone sees sensitive access, media writes, and disconnection,
      while the receiving zone sees later attachment, reads, or egress; neither side alone establishes the full
      route. USBStealer explicitly used one medium between connected A and isolated B, wrote interesting files on
      B, and enabled A-side retrieval, leaving residual join keys such as hardware ID, host-named directories, copied
      files, and continuation time.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求同一介质或可信等价身份连接不同系统或区域，并把源侧数据写入与接收侧取用连接起来。攻击者直接把介质从源主机带到不可见接收者可由父项覆盖；只有观察域间接续产生独立关联问题时使用本子项。普通离线补丁、数据二极管流程、取证转运和获批跨区交换是反例，须用内容清单、保管人、方向、目标系统和后继用途排除。
    en: Inclusion requires the same medium or a credibly equivalent identity to connect different systems or zones
      and link source-side data writes to receiver-side retrieval. Direct carry-away from a source to an unobserved
      receiver remains parent coverage; use this child when continuation between observation domains creates a distinct
      correlation problem. Offline patching, data-diode workflows, forensic transport, and approved cross-zone exchange
      are counterexamples to exclude through content manifest, custodian, direction, destination system, and successor
      use.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 隔离 B 上的植入体可先按文件名、扩展名或命令收集敏感材料，待已标记为可回到联网侧的介质再次接入时写入；介质随后回到 A，操作者或另一组件读取内容并继续传送。ESET 对 USBStealer 的四步说明直接展示了这一往返与接续链，同时指出失败写入会先在
        B 本地分组并等待下一枚可上网介质。
      en: An implant on isolated B can first collect sensitive material by filename, extension, or command and write
        it when a medium marked as able to return to the connected side is next attached. The medium then returns
        to A, where an operator or another component retrieves and may continue transferring the content. ESET's
        four-step USBStealer description directly demonstrates this return and continuation chain and states that
        failed writes are grouped locally on B until the next Internet-capable medium arrives.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需预测或影响介质跨域路线，并在源区写入和接收区读取至少各控制一端；若接收区不是攻击者直接控制的主机，还需协作者或后继恶意组件。长保管周期、介质更换、清洗检查、只读策略和单向介质会破坏链路；依赖序列号或标记文件的组件还可能因介质重新格式化而失去识别。
        en: The attacker must predict or influence the media route across domains and control at least one writer
          in the source zone and one reader in the receiving zone. If the receiving host is not directly attacker-controlled,
          a collaborator or successor malicious component is needed. Long custody periods, media replacement, sanitization,
          read-only policy, and one-way media break the path; components relying on serials or marker files may
          also lose recognition after reformatting.
    defender_model:
      paragraphs:
      - zh: 防守方需要两侧的介质接入、文件和进程事件，加上跨区台账、介质资产标识与足够长留存，才能把 B 写入同 A 读取或外联连接起来。隔离 B 无代理、A 属第三方、序列号伪造、时钟漂移或内容在接收侧立即改名都会降低确定性；此时可用内容摘要、目录结构、容量变化和保管记录给出分级判断，不能声称看到了不可见接收者。
        en: The defender needs media, file, and process events on both sides plus a cross-zone ledger, media asset
          identity, and sufficient retention to join B-side writes to A-side reads or egress. No agent on isolated
          B, a third-party A, spoofed serials, clock drift, or immediate renaming on receipt lowers certainty. Content
          digest, directory structure, capacity change, and custody records can support graded findings but cannot
          justify a claim that an unobserved receiver was seen.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 离线转运拆分源写入与接收侧动作
    en: Offline transport separates source writes from receiver actions
  analysis:
    paragraphs:
    - zh: 攻击者让介质先在 B 承载数据、断开并经历保管，再在 A 接续读取，使一次外传被分散成不同主机和时间上的弱信号，且没有直接网络连接。单端点或短留存分析无法还原完整链；只有跨介质身份、内容和台账的关联才能重建。USBStealer
        的往返步骤直接支持该结构，具体组织中的匿迹效果仍受双方日志覆盖和保管周期影响。
      en: The attacker has media carry data on B, disconnect and pass through custody, then continue with retrieval
        on A, dispersing one exfiltration into weaker signals across hosts and time without a direct network connection.
        Single-endpoint or short-retention analysis cannot reconstruct the chain; correlation across media identity,
        content, and ledger is required. USBStealer's return steps directly support this structure, while the stealth
        effect in an organization still depends on coverage on both sides and the custody interval.
