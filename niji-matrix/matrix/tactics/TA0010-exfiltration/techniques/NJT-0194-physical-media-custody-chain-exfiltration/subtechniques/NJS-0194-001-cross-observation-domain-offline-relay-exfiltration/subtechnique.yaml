research:
  limitations:
    paragraphs:
    - zh: USBStealer 来源是详细样本逆向与攻击模型，不是同一组织端到端公开的设备台账和日志导出；其 A 侧另有组件及最终远程交付属于合理但未取得样本的环节。因此正式子项可以高置信定义跨域接续能力与痕迹结构，但具体事件确认仍需源写入、保管和接收侧结果三门证据。
      en: USBStealer is supported by detailed sample reverse engineering and an attack model rather than a public
        end-to-end device ledger and log export from one organization. Another A-side component and final remote
        delivery are reasonable but unsampled stages. The child can therefore define cross-domain continuation capability
        and trace structure with high confidence, while incident confirmation still requires source write, custody,
        and receiver-outcome gates.
