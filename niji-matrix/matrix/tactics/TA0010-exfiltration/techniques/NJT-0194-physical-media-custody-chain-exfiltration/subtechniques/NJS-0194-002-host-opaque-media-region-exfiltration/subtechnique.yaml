research:
  limitations:
    paragraphs:
    - zh: ProjectSauron 提供已注册攻击、专用模块和存储布局的直接研究，并明确声称部分 DLP 绕过；公开材料未给出受害者原始扇区镜像、逐次介质转运日志或不同 DLP 产品的测试结果。子项可高置信定义隐藏区域与认可身份差异，但检测阈值、熵和布局规则必须在组织已知设备上本地验证。
      en: ProjectSauron provides direct research on registered attacks, the dedicated module, and storage layout
        and explicitly states bypass of some DLP controls. Public material does not provide victim raw-sector images,
        per-trip media logs, or comparative tests across DLP products. The child can define hidden-region and recognized-identity
        differentials with high confidence, while layout, entropy, and alert rules require local validation on known
        organizational devices.
