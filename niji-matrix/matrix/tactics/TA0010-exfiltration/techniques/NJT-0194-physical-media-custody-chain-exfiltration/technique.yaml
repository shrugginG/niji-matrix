research:
  limitations:
    paragraphs:
    - zh: ATT&CK T1052 页面可以锚定父行为并记录 USB 这一实现，ESET 与 Kaspersky 提供两种结论级技术链，但都不能证明所有物理介质外传具有相同匿迹效果。USBStealer 的最终 A
        侧外送组件未取得，ProjectSauron 的原始受害介质与 DLP 测试未公开；案例应分别限于跨域返回能力和宿主不可见区域设计。
      en: The ATT&CK T1052 page anchors the parent and records USB as one implementation, while ESET and Kaspersky
        provide two conclusion-level technical chains. Neither shows that all physical-media exfiltration has the
        same stealth effect. USBStealer's final A-side delivery component was not recovered, and ProjectSauron's
        original victim media and DLP tests are not public. The cases must remain limited to cross-domain return
        capability and host-opaque-region design respectively.
    - zh: DET0123 与 Microsoft 文档支持挂载、文件、进程和网络字段，不证明跨系统关联会自动成功。读取审计需显式启用，DeviceFileEvents 摘要并非每条都有，DeviceID 也不是强身份；接收端通常位于组织外。正式
        Analytic 必须验证字段、驱动器映射、保留期和介质台账，缺少出区或接收证据时只能报告可疑复制。
      en: DET0123 and Microsoft documentation support mount, file, process, and network fields but do not show that
        cross-system correlation succeeds automatically. Read audit must be enabled, DeviceFileEvents does not provide
        a digest on every event, DeviceID is not a strong identity, and the receiver often sits outside the organization.
        A canonical Analytic must validate fields, drive mapping, retention, and the media ledger and can report
        only suspicious copying when zone-exit or receiver evidence is absent.
    - zh: 原始介质检查可发现声明布局差异，但厂商保留区、合法加密盘、历史残留和硬件控制器行为均可能相似。完整扫描和擦除增加时间、隐私和业务连续性成本；若固件向宿主隐藏真实容量，软件检查仍会失效。高置信判断必须将逐资产基线、原始写入进程和保管链结合。
      en: Raw-media inspection can find declared-layout differences, but vendor-reserved areas, legitimate encrypted
        disks, historical remnants, and hardware-controller behavior may look similar. Full scanning and sanitization
        add time, privacy, and continuity costs, and software inspection still fails when firmware hides true capacity.
        A high-confidence finding must join a per-asset baseline, raw-write process, and custody chain.
