schema_version: 2.0.0
type: technique
id: NJT-0194
name:
  zh: 物理介质保管链外传
  en: Physical-Media Custody-Chain Exfiltration
summary:
  zh: 攻击者把受害数据写入可携介质并通过断开、保管和物理转运将其带离原观察域，使网络出口缺少对应会话，并把证据分散在设备、文件和接收侧事件中。
  en: An adversary writes victim data to carryable media and moves it beyond the original observation domain through
    disconnection, custody, and physical transport, leaving no corresponding network-egress session and dispersing
    evidence across device, file, and receiver-side events.
aliases: []
classification:
  tactic_refs:
  - TA0010
  origin:
    kind: attack-adapted
    source_attack_id: T1052
    source_attack_version: '19.1'
  decision_ref: DEC-TA0010-T1052
definition_and_concept:
  paragraphs:
  - zh: 物理介质保管链外传是攻击者把已取得的数据复制到可移动或可带离的数字存储介质，或把数据写入介质底层区域，随后让该介质脱离源系统并经人员或物流移动到攻击者能够读取的位置。直接目标是把受害数据带出受控环境；分类核心是介质上的数据状态与物理保管变化共同完成交付，而不是
      USB、外置硬盘、手机或播放器等设备名称。
    en: Physical-Media Custody-Chain Exfiltration occurs when an adversary copies acquired data to removable or
      carryable digital storage, or writes it into a low-level media region, then has the medium leave the source
      system and move through people or logistics to a location accessible to the attacker. Its direct objective
      is delivery of victim data outside the controlled environment. The classification centers on data state on
      the medium plus physical custody change, not device names such as USB drive, external disk, phone, or media
      player.
  - zh: 同一介质可以成为最终接收物，也可以先把数据从隔离系统带到另一台联网或低控制强度主机，再由后继通道继续外传。写入介质只是链中的一个阶段；只有断开、移交、出区或接收侧取用使数据越过原防守边界时，才完成本技术的 TA0010
      结果。若攻击者直接带走原已存有数据的可拆介质，也需证明介质所含数据、保管变化和攻击者接收之间的关系。
    en: The same medium may be the final item received or may first carry data from an isolated system to another
      networked or less-controlled host before a successor channel continues exfiltration. Writing the medium is
      one stage only. The TA0010 outcome is completed when disconnection, handoff, zone exit, or receiver-side retrieval
      carries data across the original defensive boundary. If an attacker removes a detachable medium that already
      contains data, classification still requires a relationship among the data present, the custody change, and
      attacker receipt.
stealth_characteristics:
  paragraphs:
  - zh: 本技术把数据路径从网络连接转成源文件读取、介质写入、设备卸载或拔出、保管间隔和后继接入。源侧网关因此没有目的地址、协议、连接字节或上传账号可用于判断，单机短窗也只能看到一次介质会话。痕迹仍存在于设备序列号或资产标识、卷与挂载信息、介质路径上的文件创建、源读取主体、弹出事件、转运台账以及接收侧读取或外联中。
    en: This technique changes the data path from a network connection into source-file access, media writes, device
      unmount or removal, a custody interval, and later attachment. The source-side gateway therefore has no destination
      address, protocol, connection byte count, or upload account to evaluate, and a short single-host window sees
      only one media session. Traces remain in device serial or asset identity, volume and mount data, file creation
      on media paths, the source-reading principal, ejection, transfer ledgers, and receiver-side reads or egress.
  - zh: 匿迹收益取决于端点覆盖和保管治理。能够在介质离区前阻断写入、保存内容清单并在另一系统接入时连接同一介质的防守方，可以恢复原本缺失的路径；介质序列号可重复或伪造、隔离区可能无 EDR、攻击者控制的最终接收机通常不可见。ProjectSauron
      还显示，认可设备身份上的宿主不可见区域可绕过只按 DeviceID 和普通文件对象执行的控制。
    en: The stealth benefit depends on endpoint coverage and custody governance. A defender that blocks writes before
      media leaves, retains a content manifest, and links the same medium on another system can recover the otherwise
      missing path. Media serials may be duplicated or spoofed, isolated zones may lack EDR, and the attacker-controlled
      final receiver is normally invisible. ProjectSauron further shows that a host-opaque region on a recognized
      device can bypass controls limited to DeviceID and ordinary file objects.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要证明受害数据到介质的写入或介质上既有数据的攻击者取用，并至少再证明断开、保管变化、物理出区或不同系统接续中的一个结果环节。介质插入、枚举、格式化、正常文件写入或一次弹出事件单独都不能证明外传；获批准的离线补丁、取证采集、备份恢复、数据交换和员工设备同步可能具有相同痕迹，必须以来源数据、审批内容、保管人、目标区和接收结果区分。
    en: Inclusion requires evidence of victim data written to media or attacker retrieval of data already present
      on it, plus at least one result stage among disconnection, custody change, physical zone exit, or continuation
      on a different system. Media insertion, enumeration, formatting, an ordinary file write, or one ejection event
      cannot establish exfiltration alone. Approved offline patching, forensic acquisition, backup restore, data
      exchange, and employee-device synchronization can produce the same traces and must be distinguished by source
      data, approved contents, custodian, destination zone, and receiver outcome.
  - zh: T1011 负责 Bluetooth、蜂窝或其他网络介质上的活动会话，T1048 负责网络路径所用替代协议；设备物理接近不把网络会话变成本项。T1074 负责外传前暂存位置及生命周期，只有暂存介质随后通过物理保管链越界时才同时满足本项。T1091/NJT-0058
      负责介质把恶意内容带到另一主机并触发执行，T1025 负责从已接入介质收集数据；本项只负责受害数据随介质离开。NJT-0108 负责绕过文件系统的原始存储访问，可与宿主不可见介质区域子项并列，但不替代物理转运结果。
    en: T1011 owns active sessions over Bluetooth, cellular, or another network medium, and T1048 owns an alternative
      protocol on a network path; physical proximity does not turn a network session into this technique. T1074
      owns the staging location and lifecycle before exfiltration and co-applies only when staged media later crosses
      a boundary through physical custody. T1091/NJT-0058 owns malicious content carried to another host and triggered
      there, while T1025 owns collecting data from attached media. This object owns victim data leaving with the
      medium. NJT-0108 owns raw storage access that bypasses a file system and may co-apply with the host-opaque-region
      child, but it does not replace the physical transport outcome.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在隔离网络仍需用维护盘交换文件的环境中，攻击者可让受控组件识别曾接入联网主机的介质，把选定文档或密钥复制到该介质，并等待其按正常流程回到联网侧。USBStealer 明确使用同一介质在 A 与 B 间往返，先在
        B 本地聚合感兴趣文件，再在下一次插入 B 时写入介质并由 A 侧取回。更直接的内部人场景是把敏感目录复制到获准介质后将介质带离，但必须有数据和保管证据，不能从岗位或设备拥有权推定。
      en: In an isolated network that still exchanges files through maintenance media, an attacker-controlled component
        can identify a drive previously attached to an Internet-connected host, copy selected documents or keys
        to it, and wait for routine handling to return it to the connected side. USBStealer explicitly moved one
        drive between A and B, first aggregated interesting files locally on B, wrote them to the drive during a
        later B insertion, and enabled A-side retrieval. A more direct insider scenario copies a sensitive directory
        to approved media and carries it away, but it still needs data and custody evidence rather than inference
        from role or device ownership.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要读取目标数据、向介质文件系统或原始区域写入的权限，以及让介质离开源主机和受控区域的实际保管机会。跨区接续还需介质按可预测流程到达另一系统，或有协作者在外部取走；宿主不可见区域需要原始设备访问、布局知识和接收侧解析器。容量、介质损坏、写保护、审批检查和不可预测的转运周期会限制成功率，并可能延长证据暴露时间。
        en: The attacker needs access to target data, authority to write the media file system or raw region, and
          a real custody opportunity for the medium to leave the source host and controlled zone. Cross-zone continuation
          additionally requires the medium to reach another system through a predictable workflow or a collaborator
          to take it outside. A host-opaque region requires raw-device access, layout knowledge, and a receiver-side
          parser. Capacity, media damage, write protection, approval checks, and unpredictable transfer cycles constrain
          success and may lengthen evidence exposure.
    defender_model:
      paragraphs:
      - zh: 防守方假定可在部分端点取得设备接入与卸载、驱动器标识、敏感对象访问、介质路径文件创建及发起进程，并维护介质资产、保管人、来源、目标和内容清单。跨区关联需日志保留覆盖数日或数周，并在检查站重新采集同一介质身份、布局与内容；最终攻击者接收机不可见时，只能把已证写入与出区保管记录作为交付证据。普通文件级
          EDR 无法自动看到保留扇区或自定义 VFS，需原始介质扫描补足。
        en: The defender is assumed to obtain device attach and detach events, drive identity, sensitive object
          access, file creation on media paths, and initiating process on some endpoints, while maintaining media
          asset, custodian, source, destination, and content manifests. Cross-zone correlation requires retention
          spanning days or weeks and fresh acquisition of media identity, layout, and contents at checkpoints. Where
          the final attacker receiver is invisible, only evidenced writes plus custody records showing zone exit
          can support delivery. Ordinary file-level EDR does not automatically see reserved sectors or a custom
          VFS and needs raw-media inspection.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 物理保管路径绕开网络出口观察
    en: Physical custody bypasses network-egress observation
  analysis:
    paragraphs:
    - zh: 攻击者把数据写入可携介质并让介质离开源系统，网络出口不产生对应的连接、目的端或上传事务；只部署 NDR、代理或防火墙分析的防守方看不到数据交付。观察痕迹转移到源读取、介质写入、设备断开和保管记录，必须由端点与物理流程恢复。ATT&CK
        的父行为、USBStealer 的往返链和 ProjectSauron 的隔离网模块共同支持这一行为—痕迹变化；具体告警缺失仍取决于组织是否部署设备控制与介质检查。
      en: The attacker writes data to carryable media and has it leave the source system, producing no matching
        network connection, destination, or upload transaction at egress. A defender relying on NDR, proxies, or
        firewalls does not observe delivery. Traces move to source access, media writes, device disconnection, and
        custody records and must be recovered from endpoints and physical processes. The ATT&CK parent, USBStealer
        return chain, and ProjectSauron air-gap module jointly support this behavior-to-trace change; actual alert
        absence still depends on device control and media inspection in the organization.
  evidence_refs:
  - REF-000936
  - REF-000596
  - REF-000917
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 写入与接收被保管间隔分散到不同系统
    en: Custody separates writing and receipt across systems
  analysis:
    paragraphs:
    - zh: 介质从源主机断开后经历人工保管和转运，再在不同系统或域内接入，使源文件读取、介质写入与最终取用分布于不同主机和时间。单机短窗只能看到局部阶段，防守必须以介质资产、序列号、卷标识、内容摘要和台账跨域重建。USBStealer
        的 A—B 往返直接展示该结构；实际转运时长和序列号可靠性未统一公开，故跨事件恢复效果保持中等置信。
      en: After disconnection, the medium passes through human custody and transport before attachment in another
        system or domain, distributing source access, media writing, and final retrieval across hosts and time.
        A short single-host window sees only a local stage, so defenders must reconstruct across domains using media
        asset, serial, volume identity, content digest, and transfer ledger. USBStealer directly demonstrates the
        A-to-B return structure. Transfer duration and serial reliability are not uniformly reported, so the reconstruction
        effect remains medium-confidence.
  evidence_refs:
  - REF-000596
  - REF-000597
  - REF-000475
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 建议建立两个 Niji 原生子项。跨观察域离线接续外传控制介质是否在不同系统或区域重新接入并继续交付，主要痕迹是源写入、断开、保管和接收侧读取的跨主机谱系；宿主不可见介质区域外传控制数据是否位于操作系统普通文件视图之外，主要痕迹是物理容量、分区布局、原始
        I/O 与声明清单的差异。前者改变关联拓扑，后者改变可见存储对象，防御不可互换。
      en: Two Niji-native children are proposed. Cross-Observation-Domain Offline Relay Exfiltration controls whether
        the medium is reattached in a different system or zone to continue delivery; its primary traces are cross-host
        lineage among source writes, disconnection, custody, and receiver reads. Host-Opaque Media-Region Exfiltration
        controls whether data resides outside the operating system's ordinary file view; its traces are differences
        among physical capacity, partition layout, raw I/O, and the declared manifest. The first changes correlation
        topology and the second changes the visible storage object, so their defenses are not interchangeable.
    - zh: USB、外置硬盘、手机与播放器只是介质实现；ATT&CK T1052.001 解析为父级实现范围，不直接对应任何 NJS。短接入时长、自动复制、归档、隐藏文件属性与获准设备身份均已检查：短时长证据不足，自动化归
        T1020，归档归 NJT-0133，普通隐藏文件缺少独立于现有工件可见性技术的防御差异；只有跨域接续与宿主不可见区域通过全部门槛。
      en: USB drives, external disks, phones, and media players are implementations. ATT&CK T1052.001 resolves to
        parent implementation coverage rather than a NJS. Short attachment duration, automated copying, archiving,
        hidden file attributes, and approved device identity were also examined. Duration lacks evidence, automation
        belongs to T1020, archiving to NJT-0133, and ordinary hidden files lack a defense difference independent
        of existing artifact-visibility techniques. Only cross-domain continuation and host-opaque regions pass
        every gate.
  coverage: established
