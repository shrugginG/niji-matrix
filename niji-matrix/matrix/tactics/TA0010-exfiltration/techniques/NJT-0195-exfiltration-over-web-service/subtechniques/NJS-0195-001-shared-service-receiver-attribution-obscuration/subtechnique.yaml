research:
  limitations:
    paragraphs:
    - zh: InvisibleFerret 来源给出 bot token、Telegram chat、归档与独立 C2，足以证明行为和归因分层，但没有公开服务端 chat ID、完整请求日志或告警对照。共享域名产生的匿迹效果依赖组织是否具备
        CASB、TLS 检查或服务审计；如果代理已解析接收命名空间，置信度应下降。正式规则不能把所有 Telegram/GitHub/云盘访问视为恶意。
      en: InvisibleFerret reporting gives a bot token, Telegram chat, archive, and distinct C2, sufficient to establish
        behavior and attribution layers but not the server-side chat ID, complete request logs, or alert comparison.
        The stealth effect of a shared domain depends on CASB, TLS inspection, and service audit. Confidence should
        fall when a proxy already resolves the receiver namespace. Production rules cannot treat every Telegram,
        GitHub, or drive access as malicious.
