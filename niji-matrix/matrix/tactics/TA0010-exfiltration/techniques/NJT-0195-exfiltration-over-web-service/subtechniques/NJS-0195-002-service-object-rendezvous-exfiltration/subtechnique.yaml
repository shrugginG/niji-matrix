schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0195-002
parent_ref: NJT-0195
name:
  zh: 服务对象会合式外传
  en: Service-Object Rendezvous Exfiltration
summary:
  zh: 攻击者把失窃数据保存为持久 Web 服务对象，使受害端上传与攻击者读取在身份和时间上分离。
  en: An adversary stores stolen data as a persistent web-service object, separating victim-side upload from adversary
    retrieval in identity and time.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 服务对象会合式外传是经 Web 服务渗出的一种实现：攻击者把数据写成仓库文件、云对象、粘贴文本、聊天附件或等价持久对象，服务返回稳定 object/repo/message ID，攻击者随后从另一身份、位置或时间读取。分类变量是服务对象作为上传者与接收者之间的会合点，而不是对象所在的代码、存储或文本产品类别。
    en: Service-Object Rendezvous Exfiltration is an implementation of Exfiltration Over Web Service in which the
      adversary writes data as a repository file, cloud object, pasted text, chat attachment, or equivalent persistent
      object. The service returns a stable object, repository, or message ID that the adversary later reads from
      another identity, location, or time. The classification variable is the service object as rendezvous between
      uploader and receiver, not whether the object resides in a code, storage, or text product.
stealth_characteristics:
  paragraphs:
  - zh: 服务对象会合式外传把端点上传和攻击者取回拆为两条服务事务。受害网络只看到向可信服务写入，读取发生在外部租户或匿名访问；短窗连接关联和直接 attacker-IP 归因失效。对象创建、写入、可见性、共享、读取、下载、删除、actor/app/token、hash/size
      和端点源文件仍可连接。公开对象更可见但便于匿名取回，私有对象需要凭据却可能保留更强身份审计。
    en: Service-Object Rendezvous Exfiltration divides endpoint upload and adversary retrieval into two service
      transactions. The victim network sees only a write to a trusted service, while reading occurs in an outside
      tenant or anonymously, defeating short-window connection joins and direct attacker-IP attribution. Object
      creation, write, visibility, share, read, download, delete, actor or app or token, hash or size, and endpoint
      source file remain joinable. Public objects are more visible but enable anonymous retrieval; private objects
      require credentials but may retain stronger identity audit.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求端点/攻击者把已收集数据创建或写入持久服务对象，并存在攻击者可取回性或实际读取证据。普通开发提交、用户云同步、备份、公开文档发布和支持附件是正常反例；只有对象存在而无敏感来源或外传意图不足。把服务内既有私有仓库迁移到攻击者账户属于
      T1537；Shai-Hulud 从本机秘密生成新的 data.json 并上传公开仓库属于本子项。
    en: Inclusion requires creation or writing of a persistent service object from acquired data plus adversary
      retrievability or actual read evidence. Ordinary development commits, user cloud sync, backup, public document
      publication, and support attachments are normal counterexamples. Object existence without sensitive source
      or exfiltration intent is insufficient. Migrating an existing private service repository into an attacker
      account belongs to T1537; Shai-Hulud generating a new data.json from local secrets and uploading it to a public
      repository belongs here.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Shai-Hulud 恶意 npm 包执行后用 TruffleHog 和环境变量收集秘密，创建名为 Shai-Hulud 的公开 GitHub 仓库并写入双重 Base64 的 data.json。Wiz
        观察到 36 个用户的秘密被暴露，并指出 CreateEvent、PublicEvent、仓库/可见性和审计日志可用于调查。这直接证明本机源数据—服务对象—外部可取回链。
      en: After malicious Shai-Hulud npm packages executed, they used TruffleHog and environment variables to harvest
        secrets, created public GitHub repositories named Shai-Hulud, and wrote double-Base64 data.json objects.
        Wiz observed secrets exposed for 36 users and identified CreateEvent, PublicEvent, repository and visibility,
        and audit logs as investigation evidence. This directly establishes a local-source-to-service-object-to-outside-retrieval
        chain.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要对服务对象具有 create/write 权限，并能选择公开、共享或私有可读状态以及以后读取的身份。公开对象无需长期凭据但更易被发现和索引；私有对象依赖令牌、共享链接或外部账号。对象大小、秘密扫描、恶意内容检测、保留策略和
          API 配额会限制操作，删除对象也不保证审计或缓存消失。
        en: The attacker needs create or write permission for a service object and can choose public, shared, or
          privately readable state plus an identity for later access. Public objects need no persistent credential
          but are easier to discover and index; private objects depend on a token, sharing link, or outside account.
          Object size, secret scanning, malicious-content detection, retention, and API quotas constrain the operation,
          and deletion does not guarantee removal from audit or caches.
    defender_model:
      paragraphs:
      - zh: 防守方能导出组织拥有服务的 object/repo/message 审计，包含 action、actor、app/token、tenant/org、object/repository、visibility、request
          ID 和时间，并与端点文件 hash/size/标签及进程连接。个人外部账号、匿名读取、对象内容转换和供应商短保留会阻断端到端谱系；只在网络层看到 HTTPS 不能判断对象生命周期。
        en: The defender can export object, repository, or message audit from organization-owned services with action,
          actor, application or token, tenant or organization, object or repository, visibility, request ID, and
          time and join it to endpoint file hash, size, label, process, and connection. Personal outside accounts,
          anonymous reads, object transformation, and short provider retention break end-to-end lineage. HTTPS at
          the network layer alone cannot establish object lifecycle.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 以持久服务对象分离受害上传与攻击者读取的时间和主体
    en: Use a persistent service object to separate victim upload and adversary retrieval across time and principal
  analysis:
    paragraphs:
    - zh: 攻击者把数据写入服务对象后结束受害端会话，后续从其他身份或匿名位置取回。原本直接的 victim-to-receiver 流被拆为 upload-to-object 与 read-from-object，局部日志难以关联完整交付。Shai-Hulud
        的公开 data.json 仓库和观察到的暴露用户直接支持这种两段链；对象 ID、可见性变化与内容 hash 仍可跨段恢复。
      en: After writing data into a service object, the adversary ends the victim-side session and later retrieves
        it under another identity or anonymously. A direct victim-to-receiver flow becomes upload-to-object and
        read-from-object, making the complete delivery difficult to correlate in local logs. Shai-Hulud's public
        data.json repositories and observed exposed users directly support this two-leg chain, while object ID,
        visibility change, and content hash can reconnect the legs.
  evidence_refs:
  - REF-000940
  - REF-000942
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 让攻击者读取发生在服务控制面而不产生受害端后继连接
    en: Move adversary retrieval into the service control plane without a successor victim-endpoint connection
  analysis:
    paragraphs:
    - zh: 服务承担保存和提供对象，攻击者读取由提供方基础设施处理，受害端 EDR 和网络传感器没有第二段连接。缺少服务审计时，取回行为完全落在组织常规端点观察之外；GitHub 审计和仓库事件证明服务侧仍存在 actor、repo、visibility、request
        和 token 痕迹。
      en: The service stores and serves the object, so provider infrastructure handles adversary retrieval and victim
        EDR and network sensors see no second-leg connection. Without service audit, retrieval remains outside ordinary
        organizational endpoint observation. GitHub audit and repository events show that actor, repository, visibility,
        request, and token traces still exist provider-side.
  evidence_refs:
  - REF-000942
  - REF-000940
  confidence: high
