research:
  limitations:
    paragraphs:
    - zh: Shai-Hulud 事件对公开仓库、data.json、双重 Base64、暴露用户、CreateEvent/PublicEvent 与审计建议均有直接资料，证据强。该事件同时迁移私有仓库到攻击者个人账号；那一部分改变同服务所有权，应留给
        T1537，不能用于扩大本子项。其他服务的对象字段和匿名访问日志差异很大，正式 NJA 必须做产品映射而不是假设 GitHub 字段普遍存在。
      en: Shai-Hulud directly documents public repositories, data.json, double Base64, exposed users, CreateEvent
        and PublicEvent, and audit guidance, providing strong evidence. The campaign also migrated private repositories
        into attacker personal accounts; that portion changes ownership inside the same service and belongs to T1537
        rather than expanding this child. Object fields and anonymous-read logs vary widely across providers, so
        a canonical NJA must map products rather than assume GitHub fields universally exist.
