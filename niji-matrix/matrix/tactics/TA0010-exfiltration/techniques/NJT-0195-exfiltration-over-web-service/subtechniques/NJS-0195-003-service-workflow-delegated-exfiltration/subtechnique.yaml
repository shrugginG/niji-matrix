research:
  limitations:
    paragraphs:
    - zh: Push Security 为行为、请求方向与观察差异提供明确研究结论，但不是逐事件入侵报告。Shai-Hulud 证明恶意工作流向 webhook.site 发送秘密，Wiz 同时说明免费配额导致端点被停用、部分
        Webhook 外传失效；因此工作流存在和尝试为 high，稳定交付和实测匿迹效果保持 medium。不同 SaaS 对 Webhook scope、投递日志和回调身份的字段差异需要产品级映射。
      en: Push Security provides explicit research conclusions about behavior, request direction, and observation
        difference but is not a per-event incident report. Shai-Hulud establishes a malicious workflow sending secrets
        to webhook.site, while Wiz also reports that free-tier limits disabled the endpoint and made some webhook
        exfiltration nonfunctional. Workflow presence and attempt are high-confidence; reliable delivery and measured
        stealth effect remain medium. SaaS products require product-level mapping for webhook scope, delivery logs,
        and callback identity.
