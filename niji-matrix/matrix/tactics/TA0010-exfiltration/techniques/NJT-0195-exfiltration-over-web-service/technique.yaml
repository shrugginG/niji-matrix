schema_version: 2.0.0
type: technique
id: NJT-0195
name:
  zh: 经 Web 服务渗出
  en: Exfiltration Over Web Service
summary:
  zh: 攻击者把失窃数据提交给合法外部 Web 服务或由该服务转交，借用已获准的服务身份、共享基础设施和服务工作流降低网络侧识别与接收者归因能力。
  en: An adversary submits stolen data to a legitimate external web service or has that service relay it, borrowing
    an allowed service identity, shared infrastructure, and service workflows to reduce network-side recognition
    and receiver attribution.
aliases: []
classification:
  tactic_refs:
  - TA0010
  origin:
    kind: attack-retained
    source_attack_id: T1567
    source_attack_version: '19.1'
  decision_ref: DEC-TA0010-T1567
definition_and_concept:
  paragraphs:
  - zh: 经 Web 服务渗出是攻击者在获得目标数据后，通过已有合法 SaaS、云存储、代码协作、文本发布、即时通信或 Webhook/API 服务，把数据送入攻击者可访问的服务对象、账号、聊天、仓库或回调端点。直接目标是让数据离开受害控制范围；服务负责接收、保存或转交，HTTPS、官方客户端、API
      和自动化工作流只是实现。
    en: Exfiltration Over Web Service occurs after an adversary obtains target data and uses an existing legitimate
      SaaS, cloud-storage, code-collaboration, text-publication, messaging, or webhook and API service to deliver
      it into a service object, account, chat, repository, or callback endpoint the adversary can access. The immediate
      objective is to move data outside victim control. The service receives, stores, or relays it; HTTPS, official
      clients, APIs, and automation workflows are implementations.
  - zh: “Web 服务”在这里要求外部提供方参与传输语义，而非仅使用 HTTP/S。攻击者自建 HTTPS 服务器属于相应协议或 C2 技术；受害者自有 Web 服务返回本地暂存产物属于另一个拉取式缺口；同一服务内部从受害账户转到攻击者账户则由
      T1537 判断。代码、云盘、文本和 Webhook 产品类型不构成 Niji 子项。
    en: “Web service” here requires an outside provider to participate in the transfer semantics, rather than merely
      using HTTP or HTTPS. An attacker-operated HTTPS server belongs to the applicable protocol or C2 technique.
      A victim-owned web service returning a locally staged artifact belongs to a separate pull-style gap. Movement
      inside one service from a victim account to an attacker account is judged under T1537. Code, drive, text,
      and webhook product types do not define Niji children.
stealth_characteristics:
  paragraphs:
  - zh: 经 Web 服务渗出让网络侧看到已知 SaaS 域名、有效证书、标准 443 流量和组织中原本存在的访问背景。共享服务域与地址只归属提供方，通常不显示具体接收账号、聊天、仓库、对象或 Webhook；目的信誉、域名允许清单和单次
      TLS 会话因而难以区分恶意接收者。端点进程、API URI、令牌/应用身份、服务对象和租户审计仍可提供更细粒度证据。
    en: Exfiltration Over Web Service presents the network with a known SaaS domain, valid certificate, standard
      port 443 traffic, and access already common in the organization. A shared service domain and address identify
      the provider but often not the receiving account, chat, repository, object, or webhook. Destination reputation,
      domain allowlists, and one TLS session therefore struggle to distinguish the malicious receiver. Endpoint
      process, API URI, token or application identity, service object, and tenant audit remain finer-grained evidence.
  - zh: 服务对象和工作流还会把上传、保存、转交及攻击者取回分散到不同主体和时间。受害端只看到上传，攻击者读取发生在服务端；Webhook 由 SaaS 自身向外部发送，端点没有相应连接。匿迹收益受服务审计、CASB、端点
      DLP、对象可见性政策和接收者注册表限制。合法开发提交、备份、协作聊天、支持工单、监控 Webhook 与用户云同步构成高相似背景。
    en: Service objects and workflows also distribute upload, storage, relay, and adversary retrieval across principals
      and time. The victim endpoint sees only the upload while adversary access occurs at the provider, and a webhook
      sends from SaaS without a corresponding endpoint connection. Service audit, CASB, endpoint DLP, object-visibility
      policy, and receiver registries constrain the stealth benefit. Legitimate development commits, backups, collaboration
      chat, support tickets, monitoring webhooks, and user cloud sync create highly similar background.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求已收集数据被提交给合法外部 Web 服务、API 或 Webhook，或由受害租户中的服务工作流向攻击者端点实际转交；同时需要可证明的服务接收对象、接收者命名空间或交付结果。只有访问 SaaS、持有令牌、安装
      Rclone、创建 Webhook 或出现 HTTPS 连接不足。服务仍可被同时用于 C2，但若同一逻辑服务关系承担命令、控制和回传，当前外传事件归 T1041，不能仅因提供方合法而改标 T1567。
    en: Inclusion requires acquired data to be submitted to a legitimate outside web service, API, or webhook, or
      actually relayed from a victim-tenant service workflow to an attacker endpoint. A service object, receiver
      namespace, or delivery result must be demonstrable. SaaS access, possession of a token, installation of Rclone,
      webhook creation, or an HTTPS connection alone is insufficient. A service may also carry C2, but when the
      same logical service relationship carries commands, control, and return data, the current exfiltration event
      belongs to T1041 and does not become T1567 merely because the provider is legitimate.
  - zh: 如果源数据已在云/SaaS 内，并通过共享、同步、复制、导出或备份转入另一账户/租户而没有端点重新上传，T1537 是直接对象；若先下载到端点再上传外部服务，则收集与 T1567 可并存。T1048 在协议或接收路径区别于
      C2 时可伴随标注，但 Web 服务身份必须是本技术的核心。受害 Web 根拉取、企业外其他网络介质和物理介质分别留给原生缺口、T1011 和 T1052。
    en: If source data already resides in cloud or SaaS and sharing, synchronization, copying, export, or backup
      moves it into another account or tenant without endpoint re-upload, T1537 is the direct object. Download to
      an endpoint followed by upload to an outside service can receive both collection and T1567 tags. T1048 may
      accompany a protocol or receiver path distinct from C2, but web-service identity must remain central here.
      Victim-web-root retrieval, another network medium, and physical media remain with the native gap, T1011, and
      T1052 respectively.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 勒索与间谍活动常在归档或暂存后把大量文件交给云盘或文件共享服务。DFIR Report 观察到 Bazar/Conti 入侵者通过 Rclone 将共享目录送入 MEGA。开发与 CI/CD 环境中，Shai-Hulud
        从本机和环境变量收集秘密，创建公开 GitHub 仓库并写入 data.json；网络看到的是 GitHub API 访问，服务审计则保留仓库创建、可见性与对象活动。
      en: Ransomware and espionage operations commonly send archived or staged files to cloud drives or file-sharing
        services. The DFIR Report observed Bazar or Conti intruders using Rclone to send a network share into MEGA.
        In development and CI/CD environments, Shai-Hulud harvested local and environment secrets, created public
        GitHub repositories, and wrote data.json. The network sees GitHub API access while service audit preserves
        repository creation, visibility, and object activity.
    - zh: 信息窃取程序也可把较小归档直接交给共享通信服务。InvisibleFerret 在自建 HTTP/TCP C2 之外，使用 Telegram API 和 bot token 把浏览器扩展、密码管理器与钱包数据归档上传到聊天。服务端工作流场景则由攻击者在受害
        SaaS 配置 Webhook 或集成，让新邮件、文件或聊天事件由服务持续推送给外部端点；这种转交无需受害端点为每个对象建立连接。
      en: Information stealers can send smaller archives directly into a shared communication service. Separate
        from its self-hosted HTTP or TCP C2, InvisibleFerret used the Telegram API and a bot token to upload archives
        containing browser-extension, password-manager, and wallet data into a chat. In a service-workflow scenario,
        the adversary configures a webhook or integration in victim SaaS so new mail, file, or chat events are continually
        pushed by the service to an outside endpoint, without the victim endpoint creating a connection for each
        object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须能读取拟外传数据，并获得外部服务的接收命名空间、API/客户端能力及令牌、bot token、仓库权限或 Webhook URL。对象会合需要创建或写入服务对象并在以后访问；工作流转交需要在受害租户创建/修改集成、选择事件范围并控制回调端点。服务配额、上传限制、恶意内容扫描、账号冻结、API
          速率和审计保留会提高成本或中断行动。
        en: The attacker must read the target data and obtain a receiving namespace, API or client capability, and
          token, bot token, repository permission, or webhook URL for the outside service. Object rendezvous requires
          creating or writing a service object and accessing it later. Workflow relay requires creating or modifying
          an integration in the victim tenant, selecting event scope, and controlling the callback endpoint. Service
          quotas, upload limits, malicious-content scanning, account suspension, API rate limits, and audit retention
          raise cost or interrupt the operation.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有端点文件/进程事件、代理或 CASB 事务、服务提供方审计、应用与 OAuth 同意日志、对象生命周期和批准接收者/集成清单。有效观察需把设备、进程、用户、应用、令牌、租户、接收账号/聊天/仓库、对象和请求
          ID 连起来；只见域名或 IP 时无法完成租户级归因。个人账号、外部租户、TLS、服务端内部转交、短审计保留和缺少源文件读取会形成盲区。
        en: Defenders may have endpoint file and process events, proxy or CASB transactions, provider audit, application
          and OAuth-consent logs, object lifecycle, and approved receiver and integration inventories. Effective
          observation joins device, process, user, application, token, tenant, receiving account or chat or repository,
          object, and request IDs. Domain or IP alone cannot establish tenant-level attribution. Personal accounts,
          outside tenants, TLS, provider-internal relay, short audit retention, and missing source-file reads create
          blind spots.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用已获准 Web 服务的域名证书和正常业务流量外观
    en: Borrow an allowed web service domain certificate and normal business-traffic appearance
  analysis:
    paragraphs:
    - zh: 攻击者把失窃数据提交给组织已经访问的合法服务，外层连接继承提供方信誉、证书、标准 API 和普通协作/存储流量形态。域名或 IP 规则只能识别 GitHub、Telegram、MEGA 等提供方，不能区分攻击者的账号、聊天、仓库或对象。ESET
        明确指出 OilRig 选择常见 Office 365 API 可更容易混入常规网络流，InvisibleFerret 与 Shai-Hulud 又证明相同服务抽象可承载真实外传；端点进程、接收命名空间和服务审计仍可揭示异常。
      en: The adversary submits stolen data to a legitimate service already used by the organization, inheriting
        provider reputation, certificate, standard APIs, and ordinary collaboration or storage traffic shape. Domain
        and IP rules identify only providers such as GitHub, Telegram, or MEGA and cannot distinguish an attacker
        account, chat, repository, or object. ESET explicitly states that OilRig selected common Office 365 APIs
        to blend more readily into regular network traffic, while InvisibleFerret and Shai-Hulud establish that
        the same service abstraction carries real exfiltration. Endpoint process, receiver namespace, and service
        audit remain anomalous evidence.
  evidence_refs:
  - REF-000939
  - REF-000940
  - REF-000945
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 把接收者对象和转交结果移入提供方控制面而缩减端点网络可见性
    en: Move receiver objects and relay outcomes into provider control planes reducing endpoint-network visibility
  analysis:
    paragraphs:
    - zh: 服务保存对象或执行 Webhook 后，受害端网络只记录到提供方的一段 HTTPS；攻击者读取和 SaaS 到外部端点的第二段发生在提供方侧，端点没有完整接收者或结果。若组织未接入服务审计或外部租户日志，关键行为不进入常规观测。Wiz
        的 GitHub 仓库/工作流事件和 Push Security 对 SaaS Webhook 的分析支持这条观察域转移；对象、集成和请求审计仍可恢复。
      en: After a service stores an object or runs a webhook, the victim network records only one HTTPS leg to the
        provider. Adversary retrieval and the second leg from SaaS to an outside endpoint occur provider-side, leaving
        the endpoint without the complete receiver or result. When service audit or outside-tenant logs are not
        connected, critical behavior remains outside routine observation. Wiz's GitHub repository and workflow events
        and Push Security's SaaS-webhook analysis support this shift in observation domain, while object, integration,
        and request audit can recover it.
  evidence_refs:
  - REF-000940
  - REF-000941
  - REF-000942
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 建议建立三个 Niji 原生子项。共享服务接收者归因遮蔽改变网络可见的提供方身份与真实接收账号/聊天/仓库/端点之间的关系；服务对象会合式外传把上传与攻击者读取分成持久对象的两段生命周期；服务工作流转交外传让
        SaaS 集成或 Webhook 成为发送主体。三者可组合，但分别要求接收者命名空间解析、对象生命周期审计和工作流配置—交付关联。
      en: Three Niji-native children are proposed. Shared-Service Receiver Attribution Obscuration changes the relationship
        between the provider identity visible on the network and the real receiving account, chat, repository, or
        endpoint. Service-Object Rendezvous Exfiltration splits upload and adversary retrieval into two legs of
        a persistent object's lifecycle. Service-Workflow Delegated Exfiltration makes a SaaS integration or webhook
        the sending principal. They can co-occur but respectively require receiver-namespace resolution, object-lifecycle
        audit, and workflow-configuration-to-delivery correlation.
    - zh: 代码仓库、云存储、文本存储、即时通信和 Webhook 产品类型不得成为兄弟项。同一代码仓库既可遮蔽接收者，也可保存对象或执行工作流；云盘、聊天和文本服务也可能落入同一变量。手工 POST 到 Webhook
        仅属于父级或共享接收者子项，只有服务端触发/转交才进入工作流子项。T1537 的同服务账户所有权转移不纳入本 taxonomy。
      en: Code repository, cloud storage, text storage, messaging, and webhook product types do not define siblings.
        One code repository can obscure a receiver, retain an object, or execute a workflow, while drives, chats,
        and text services can express the same variables. A manual POST to a webhook remains within the parent scope
        or Shared-Service Receiver Attribution Obscuration; only server-side triggering or relay enters the workflow
        child. T1537 same-service account-ownership transfer is outside this taxonomy.
