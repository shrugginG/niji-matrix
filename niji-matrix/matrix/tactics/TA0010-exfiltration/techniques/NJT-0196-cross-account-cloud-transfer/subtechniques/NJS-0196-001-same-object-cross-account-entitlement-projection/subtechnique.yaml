research:
  limitations:
    paragraphs:
    - zh: 官方文档证明授权、审计、访问和撤销语义，但本研究未取得明确记录攻击者通过 external share 向其同服务账户完成数据窃取的公开事件报告。因此子项为 medium，正式案例为空。Link forwarding、guest
        预存在目录和未记录 download 都会削弱 target-account 结论。
      en: Official documentation establishes entitlement, audit, access, and revocation semantics, but this research
        found no public incident report explicitly documenting an adversary completing theft to its same-service
        account through external sharing. The child remains medium confidence with no formal case. Link forwarding,
        preexisting guest identities, and unlogged download weaken target-account conclusions.
