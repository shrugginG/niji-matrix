schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0196-001
parent_ref: NJT-0196
name:
  zh: 原对象跨账户授权投射
  en: Same-Object Cross-Account Entitlement Projection
summary:
  zh: 保留云对象身份并向另一账户投射读取、编辑或拥有权，使数据控制变化表现为正常共享而非新文件传输。
  en: Preserve cloud-object identity while projecting read, edit, or ownership rights to another account, making
    the change of data control appear as ordinary sharing rather than a new file transfer.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 原对象跨账户授权投射是攻击者不复制内容对象，而是在同一服务中把另一账户、guest、外部 domain 或 account principal 加入原对象的 ACL、specific-people link、shared
      drive/site membership 或 ownership，使该主体能够读取或控制相同 object ID。稳定变量是身份连续的对象与新增的跨账户权利。
    en: Same-Object Cross-Account Entitlement Projection does not copy the content object. Within the same service
      it adds another account, guest, external domain, or account principal to the original object's ACL, specific-people
      link, shared drive or site membership, or ownership so that principal can read or control the same object
      ID. The stable variable is a continuous object identity with new cross-account rights.
  - zh: 创建 invitation 或 link 但没有 acceptance/access 时只属于 exposure。匿名 Anyone link 无法解析到另一个账户时不符合本子项；若 specific-people/guest
      link 记录 target account 并发生 FileAccessed/download，则成立。ownership transfer 只有实际 source/target owner 状态变化时才纳入。
    en: Creating an invitation or link without acceptance or access is exposure only. An anonymous Anyone link that
      cannot resolve to another account does not qualify. A specific-people or guest link with a recorded target
      account followed by FileAccessed or download can qualify. Ownership transfer enters only when source and target
      owner state actually changes.
stealth_characteristics:
  paragraphs:
  - zh: 原对象跨账户授权投射使内容没有新建副本，企业网络和对象创建监测看不到大文件外送；同一 object ID 继续位于原站点或 drive，访问由云服务完成。残余集中在 acting user、target user/domain、old/new
      role/visibility、link ID、acceptance、FileAccessed/download 和 revoke。服务身份或合法协作界面会降低单个分享事件的可区分性，但目标主体与后继访问仍可恢复。
    en: Same-Object Cross-Account Entitlement Projection makes no new content copy is created, so enterprise network
      and object-creation monitoring sees no large transfer. The same object ID remains in its original site or
      drive and the cloud service performs access. Residuals concentrate in acting user, target user or domain,
      old and new role or visibility, link ID, acceptance, FileAccessed or download, and revoke. Service identities
      and legitimate collaboration interfaces reduce the distinguishability of one share event, but target principal
      and successor access remain recoverable.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求敏感源对象、同服务外部账户/租户、有效 grant 与后继访问或 ownership 结果。批准客户/供应商协作须按合同、owner、domain/account allowlist、对象范围和到期排除；一个外部
      guest 不自动表示攻击者。若目标主体只下载后在其他服务上传，后续行为归 T1567；若共享后目标账户 copy 成独立对象，则同时或转入副本兄弟项。
    en: Inclusion requires a sensitive source object, an external account or tenant on the same service, an effective
      grant, and successor access or ownership outcome. Approved customer or vendor collaboration requires exclusion
      by contract, owner, domain or account allowlist, object scope, and expiry; an external guest is not automatically
      an adversary. If the target merely downloads and later uploads to another service, the successor behavior
      belongs to T1567. If the target copies the shared object into an independent object, the replica sibling additionally
      or subsequently applies.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制受害用户后，可在 SharePoint/OneDrive 为外部账户创建 specific-people link 或 invitation，或在 Google Drive 把 target_user
        加入文件/共享盘。Microsoft 审计可连接 SharingInvitationCreated→Accepted 或 SecureLinkCreated/AddedToSecureLink→FileAccessed；Google
        记录 target_user、owner、visibility_change 与 shared_drive_id。合法 UI 和 API 都可产生同样流程。
      en: After controlling a victim user, an adversary can create a specific-people link or invitation in SharePoint
        or OneDrive for an external account or add target_user to a file or shared drive in Google Drive. Microsoft
        audit can join SharingInvitationCreated to Accepted or SecureLinkCreated and AddedToSecureLink to FileAccessed.
        Google records target_user, owner, visibility_change, and shared_drive_id. Legitimate UI and API produce
        the same workflow.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要源对象分享/ownership 权限和可接收邀请或访问的目标账户，并绕过 domain allowlist、guest policy、DLP 与敏感标签。持续访问依赖 grant、link、guest
          或 shared-drive membership 保持有效；owner 审查、到期或重新认证会中断。
        en: The adversary needs source-object sharing or ownership authority and a destination account able to accept
          or access, while bypassing domain allowlists, guest policy, DLP, and sensitivity labels. Continuing access
          depends on the grant, link, guest, or shared-drive membership remaining effective; owner review, expiry,
          or reauthentication can interrupt it.
    defender_model:
      paragraphs:
      - zh: 防守方按稳定 object ID 维护 owner、sensitivity、acting principal、target principal/domain、link/permission ID、old/new
          state、accept/access/download 和 revoke，并与批准合作清单连接。若 target account 不在目录或使用 bearer token，主体归因下降；若未启用数据面访问日志，只能确认
          exposure 不能确认内容交付。
        en: Defenders maintain owner, sensitivity, acting principal, target principal or domain, link or permission
          ID, old and new state, accept, access or download, and revoke by stable object ID and join these to approved
          collaboration. Attribution drops when the target account is absent from the directory or uses a bearer
          token. Without data-plane access logs, evidence establishes exposure rather than content delivery.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 用正常协作授权替代可见文件传输并保持对象身份不变
    en: Substitute ordinary collaboration entitlement for visible file transfer while preserving object identity
  analysis:
    paragraphs:
    - zh: 攻击者只改变原对象的 target rights，云服务随后向外部账户提供内容；网络传输、文件复制和本地 uploader 都不出现，单个 share 事件与日常协作相同。Microsoft 和 Google
        审计字段仍可连接 acting/target principal、object ID 和 access outcome。只有目标账户未批准且完成访问时，正常外观才形成可证行为透明。
      en: The adversary changes only target rights on the original object, after which the cloud service serves
        content to the external account. No local uploader, visible network transfer, or content-copy event appears,
        and one share event resembles daily collaboration. Microsoft and Google audit fields still join acting and
        target principal, object ID, and access outcome. The normal appearance becomes supported Behavioral Transparency
        only when the target account is unapproved and access completes.
  evidence_refs:
  - REF-000950
  - REF-000951
  confidence: medium
