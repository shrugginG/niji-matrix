research:
  limitations:
    paragraphs:
    - zh: DNC 文件是诉讼陈述并总结取证结论，不公开原始 CloudTrail、snapshot IDs 或 API 顺序；正式 Case 必须保留此证据性质。AWS 语义不能自动推广到所有提供商，某些平台不会把目标
        copy ID 或后继访问返回源租户。加密 snapshot 的 KMS grant 与 copy 完成需分别验证。
      en: The DNC filing is a litigation statement summarizing forensic conclusions and does not publish raw CloudTrail,
        snapshot IDs, or API order; a formal Case must preserve that evidence character. AWS semantics cannot be
        projected automatically to every provider, and some platforms do not return destination copy IDs or successor
        access to the source tenant. KMS grant and completed copy for encrypted snapshots require separate verification.
