research:
  limitations:
    paragraphs:
    - zh: 固定 ATT&CK 页面的 procedure examples 并不都满足同服务跨账户语义：Mega 工具上传和 AzCopy 到自有基础设施可能只是 Web 服务或普通通道外传。正式范围以资源 owner/target
        account、object continuity 和 provider-native share/copy 为准，不用 ATT&CK 标签替代结论级证据。
      en: Procedure examples on the fixed ATT&CK page do not all satisfy same-service cross-account semantics. Mega
        utility uploads and AzCopy to actor infrastructure may be web-service or ordinary-channel exfiltration.
        Formal scope relies on resource owner and target account, object continuity, and provider-native share or
        copy rather than using an ATT&CK label as conclusion-level evidence.
    - zh: 原对象授权资料来自权威产品文档而非公开恶意事件，因此证明可实施路径、字段和撤销语义，不证明实际规避率或攻击者意图。跨平台字段不能机械等价：Microsoft 的 ObjectId/link event、Google
        的 target_user/visibility、AWS 的 snapshot/permission/copy 具有不同身份和保留期，Analytic 必须先规范化再关联。
      en: 'Same-object entitlement material comes from authoritative product documentation rather than a public
        malicious incident. It establishes an implementable path, fields, and revocation semantics, not measured
        evasion or attacker intent. Cross-platform fields are not mechanically equivalent: Microsoft ObjectId and
        link events, Google target_user and visibility, and AWS snapshot, permission, and copy have different identities
        and retention and require normalization before correlation.'
    - zh: DNC 案例是法院诉状对 CrowdStrike 取证和政府归因的总结，没有原始审计记录，Case 置信度保持 medium。目标账户不在组织控制下时，copy 后访问、再分享和删除可能无法直接观察；provider
        共享资源事件也不总返回 destination object ID。响应结论必须区分 exposure、effective access、content delivery、copy initiated 和 durable
        replica。
      en: The DNC case is a court filing summarizing CrowdStrike forensics and government attribution without raw
        audit, so Case confidence remains medium. When the destination account lies outside organizational control,
        post-copy access, resharing, and deletion may not be directly visible, and provider shared-resource events
        do not always return destination object IDs. Response conclusions must distinguish exposure, effective access,
        content delivery, copy initiated, and durable replica.
    - zh: 合法外部协作和灾备产生极高相似背景。撤销 share、禁用 external setting 或删除 source snapshot 只能改变未来源侧权利，不能证明未下载，也不能收回独立副本。防御对象因此必须同时治理批准关系、内容敏感度、账户
        allowlist、密钥权威、到期与撤销后接收核查。
      en: Legitimate external collaboration and disaster recovery create very strong benign background. Revoking
        a share, disabling an external setting, or deleting a source snapshot changes only future source-side rights;
        it cannot prove no download and cannot recall an independent replica. Defense must therefore govern approved
        relationships, content sensitivity, account allowlists, key authority, expiry, and post-revocation receipt
        assessment together.
