research:
  limitations:
    paragraphs:
    - zh: Dark Halo 案例同时涉及邮箱导出、归档、暂存和清理；本子项只使用外部 HTTPS 请求从受害服务取回产物这一段。来源没有访问日志样本、响应字节或下载完成确认，但给出具体 URL 和服务器路径，足以支持拉取关系而不能量化检测效果。不同服务器和
        CDN 的路径映射需要本地实现验证。
      en: The Dark Halo case also includes mailbox export, archiving, staging, and cleanup; this child uses only
        the outside HTTPS retrieval of the artifact from a victim service. The source does not publish the access-log
        record, response bytes, or download-completion confirmation, but the concrete URL and server path support
        the pull relationship without quantifying detection effect. Path mapping varies across servers and CDNs
        and requires local implementation validation.
