schema_version: 2.0.0
type: technique
id: NJT-0197
name:
  zh: 受害服务响应式拉取外传
  en: Victim-Service Response Pull Exfiltration
summary:
  zh: 攻击者把数据置于受害者对外服务路径，再从外部请求取回，使数据送出表现为服务响应而非内部主机主动上传。
  en: An adversary places data behind a victim-facing service and retrieves it from outside, making delivery appear
    as a service response rather than an internal host initiating an upload.
aliases: []
classification:
  tactic_refs:
  - TA0010
  origin:
    kind: niji-added
    source_attack_id: null
    source_attack_version: null
  decision_ref: DEC-TA0010-NIJI-0001
definition_and_concept:
  paragraphs:
  - zh: 受害服务拉取式外传是经替代协议渗出的一种实现：攻击者先把已收集数据写入受害 Web、邮件或等价对外服务能够返回的位置，再由外部客户端发起请求，使服务在正常响应方向上传输数据。分类变量是外部拉取和受害服务响应关系；暂存位置、文件扩展名和具体服务器产品不是子项边界。
    en: Victim-Service Pull Exfiltration is an implementation of Exfiltration Over Alternative Protocol in which
      the adversary first writes acquired data into a location that a victim-facing web, mail, or equivalent service
      can return, then initiates an outside request so the service transfers data in its normal response direction.
      The classification variable is the outside fetch and victim-service response relationship; staging location,
      extension, and server product do not define the child.
  - zh: 本概念固定的是发送方向和服务所有权：攻击者外部客户端发起读取，受害者自有服务成为网络发送方。协议、服务器产品、文件扩展名和归档形式只是实现属性；其匿迹意义来自端点没有面向攻击者新建主动上传关系，以及外层来源身份仍属于受害组织。
    en: 'The concept fixes send direction and service ownership: an attacker client initiates retrieval and the
      victim-owned service becomes the network sender. Protocol, server product, extension, and archive format are
      implementation attributes. Its stealth value comes from the endpoint creating no new attacker-bound upload
      relation while the outer source identity remains the victim organization.'
stealth_characteristics:
  paragraphs:
  - zh: 受害服务拉取式外传使边界设备看到外部客户端访问组织自有服务以及服务发送响应，源主机不必建立面向攻击者的独立出站上传。基于“内部进程主动连接新外部目的地”的规则可能无匹配对象，目的 IP 归因也落在受害基础设施。服务端仍留下异常文件创建、发布路径、请求
      URI、客户端 IP、响应字节、认证与清理记录；连接这些痕迹可恢复外传。
    en: Victim-Service Pull Exfiltration causes the perimeter to see an external client accessing an organization-owned
      service and the service returning a response, without a source workstation initiating a separate upload to
      the attacker. Rules based on an internal process connecting to a new outside destination may have no matching
      event, and destination attribution points to victim infrastructure. The service still leaves unusual file
      creation, served path, request URI, client IP, response bytes, authentication, and cleanup records that can
      reconstruct the theft.
  - zh: 若防守方保留服务目录创建者、物理路径到 URI 的映射、外部客户端、状态码、响应字节与清理事件，仍可恢复链条。动态内存响应、CDN 缓存、缺失响应字节或共享反向代理会削弱关联；普通网站发布和用户下载则构成强反例。
    en: The chain remains reconstructible when defenders retain served-path creator, physical-path-to-URI mapping,
      outside client, status, response bytes, and cleanup. Dynamic in-memory responses, CDN caching, absent response-byte
      logging, or shared reverse proxies weaken the join, while ordinary publishing and user download are strong
      counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要证明数据产物写入可服务位置、外部请求命中该产物并返回字节。只有 Web 根目录中的文件属于 T1074/NJT-0134 暂存，不足以确认外传；只有大响应或外部 GET 也不足。使用第三方代码库、云盘或文本站点由
      T1567 负责；同一 C2 Web 会话取回结果归 T1041；合法发布、用户下载和管理员导出是强反例。
    en: Inclusion requires an artifact written into a served location and an outside request that hits it and returns
      bytes. A file in a web root is T1074 or NJT-0134 staging and does not alone confirm exfiltration; neither
      does a large response or outside GET. Third-party repositories, cloud drives, or text sites belong to T1567,
      retrieval through the same web C2 relationship to T1041, and authorized publishing, user downloads, and administrative
      exports are strong counterexamples.
  - zh: 合法静态资源发布、软件分发、客户下载和批准导出即使具有大响应也不属于本技术。判定必须同时连接未经批准的数据产物、服务路径和外部取回；文件伪装、口令归档和清理可作为并行行为，不能替代实际响应结果。
    en: Legitimate static publishing, software distribution, customer download, and approved export remain outside
      the technique even with large responses. Classification must join an unauthorized data artifact, served path,
      and outside retrieval. File disguise, passworded archival, and cleanup can coexist but cannot substitute for
      the response outcome.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Dark Halo 在受害 OWA 服务器上导出目标邮箱、创建受口令保护的归档并命名为 Redir.png，随后使用公开 HTTPS URL 取回。Volexity 给出具体服务器路径和 URL，直接支持产物—服务路径—外部取回链；来源未量化异常响应告警或证明所有请求均逃过检查，因此匿迹效果保持
        medium。
      en: Dark Halo exported target mailboxes on a victim OWA server, created a password-protected archive named
        Redir.png, and retrieved it through a public HTTPS URL. Volexity provides the server path and URL, directly
        supporting the artifact-to-service-path-to-outside-fetch chain. It does not quantify response anomaly alerts
        or establish that every request escaped inspection, so stealth effect remains medium-confidence.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要在对外服务主机写入或生成文件、预测外部可访问路径，并从外部请求取回。其可能需要高权限、服务配置知识和足够存储时间；WAF、发布目录 ACL、内容扫描、缓存和文件清理会影响成功。若服务通过 CDN
          或反向代理提供内容，攻击者还需处理缓存与访问控制。
        en: The attacker needs to write or generate a file on a victim-facing service host, predict an externally
          reachable path, and retrieve it from outside. This may require privilege, service-configuration knowledge,
          and enough storage time. WAF, served-directory ACLs, content scanning, caching, and cleanup can affect
          success. A CDN or reverse proxy adds cache and access-control considerations.
    defender_model:
      paragraphs:
      - zh: 防守方保留服务目录文件事件、生成进程/账号、IIS/W3C 或反向代理访问日志、响应字节和外部客户端信息，并能把物理路径映射到 URI。若内容在内存动态生成、日志不记响应字节、CDN 缓存或文件事件缺少进程键，关联会不完整。正常
          Web 发布和大型下载必须由部署工单、内容来源和批准主体排除。
        en: The defender retains served-directory file events, creating process and account, IIS W3C or reverse-proxy
          access logs, response bytes, and external client information and can map physical paths to URIs. In-memory
          generation, logs without response bytes, CDN caching, or file events without process keys make the join
          incomplete. Normal web publishing and large downloads require deployment ticket, content provenance, and
          approved-principal exclusions.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 把外传改写为外部请求触发的受害服务响应以避开主动上传观察
    en: Recast exfiltration as a victim-service response triggered by an outside request to evade initiated-upload
      observation
  analysis:
    paragraphs:
    - zh: 攻击者先把数据写入可服务位置，再由外部请求触发响应，网络方向从“内部主机主动上传”变为“服务器响应入站客户端”。只检测新外部目的地和上传进程的逻辑没有对应事件；文件写入与访问响应分处端点和 Web 日志。Dark
        Halo 提供了完整产物与取回链，实际漏报仍需本地验证。
      en: The adversary writes data into a served location and later triggers a response from outside, changing
        network direction from an internal host initiating an upload to a server responding to an inbound client.
        Logic that looks only for new outside destinations and uploader processes has no equivalent event, while
        the file write and response reside in endpoint and web logs. Dark Halo provides a complete artifact-and-retrieval
        chain, although actual alert loss needs local validation.
  evidence_refs:
  - REF-000509
  - REF-000514
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 让外传响应继承受害者公开服务和静态资源路径的合法外观
    en: Give the exfiltration response the legitimate appearance of the victim's public service and static-resource
      path
  analysis:
    paragraphs:
    - zh: 由受害 OWA 或 Web 服务提供产物时，来源地址、TLS 服务身份与响应方向都属于受害组织；把归档命名为图片并置于现有静态目录进一步接近普通资源请求。防守方若仅依赖外部目的信誉或扩展名难以区分，仍可从创建进程、内容类型、响应体积和不常见客户端恢复异常。来源支持外观借用，不证明所有检查系统均受骗。
      en: When victim OWA or a web service serves the artifact, source address, TLS service identity, and response
        direction all belong to the victim organization. Naming the archive as an image in an existing static directory
        further resembles an ordinary resource request. Destination reputation or extension alone cannot distinguish
        it, while creating process, content type, response size, and unusual client can expose the mismatch. The
        source supports borrowed appearance but does not prove every inspection system was deceived.
  evidence_refs:
  - REF-000509
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前证据只支持一个稳定变量：受害者自有服务响应外部请求，从而反转外传发送方向。按 Web/邮件产品、路径、文件扩展名、归档类型或服务器平台拆分不会改变痕迹因果、检测数据和缓解动作；因此不建立子技术。未来只有出现独立方向、主体或观察变量及相应证据时才重新评估。
      en: 'Current evidence supports one stable variable: a victim-owned service responds to an outside request
        and reverses exfiltration send direction. Dividing by web or mail product, path, extension, archive type,
        or server platform does not change trace causality, detection data, or mitigation action, so no child is
        established. Reassessment requires a distinct direction, principal, or observation variable with supporting
        evidence.'
  coverage: none-justified
  subtechnique_refs: []
