  name_en: Data Obfuscation
  name_zh: 数据混淆
decision: adapt
rationale_zh: '保留 T1001 所指向的命令控制通信遮蔽问题，但将正式范围收紧到攻击者有意改变 C2 消息的可见内容、承载结构或服务会话表征，从而使防守方错读消息语义或误认通信角色。Mandiant 对 SUNBURST
  的逆向分析同时确认可选垃圾字节、XML/GUID 中的命令、貌似合法 OIP 遥测的 JSON；Unit 42 对 RDAT 的逆向分析确认 BMP 附件中的双向数据隐藏。这些行为共同支持以通信观察差异为核心的准入，而不支持将一切编码、加密或正常协议选择并入本项。


  TA0005 的 NJT-0115 已覆盖不限定阶段的内容表示遮蔽，因此 T1001 不能简单重写该项。T1001 的独立分析对象是具有往返和时序的 C2 会话：消息边界、请求与响应配对、声明服务与真实目的、网络传感器所见和端点进程所为。相同字节变换可以同时满足两个技术，但只有出现
  C2 功能及会话层观察差时才进入本项；单纯隐藏静态载荷或脚本不进入 TA0011。'
rationale_en: 'Retain the ATT&CK T1001 problem of concealing command-and-control communication, but narrow the formal
  scope to deliberate changes in the visible content, carrier structure, or apparent service conversation of C2
  messages that cause defenders to misread message semantics or misidentify the communicating role. Mandiant''s
  SUNBURST reverse engineering directly documents optional junk bytes, commands embedded in XML GUIDs, and JSON
  resembling legitimate OIP telemetry; Unit 42''s RDAT analysis documents bidirectional data concealed in BMP attachments.
  Together these support admission around a communication-observation differential, not inclusion of every encoding,
  encryption, or ordinary protocol choice.


  TA0005 NJT-0115 already covers content-representation obscuration without a phase constraint, so T1001 cannot
  merely restate it. T1001 has a separate analytic unit: a bidirectional, timed C2 conversation with message boundaries,
  request-response pairs, claimed service versus actual purpose, network-sensor view, and endpoint-process behavior.
  The same byte transformation may satisfy both techniques, but it enters this TA0011 scope only when C2 function
  and a conversation-level observation differential are established; static payload or script concealment alone
  stays outside TA0011.'
scope_notes_zh: 正式对象限于 C2 消息及服务会话观察差；载体内外遮蔽保留父级并与 NJT-0115 并行归类，不独立复制为 NJS。
scope_notes_en: Formal scope is the C2 message and service-conversation observation differential. Carrier-to-inner
  concealment stays at parent level and may be classified alongside NJT-0115 without a duplicate NJS.
