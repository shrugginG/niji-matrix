  name_en: Fallback Channels
  name_zh: 备用通道
decision: adapt
rationale_zh: 'ATT&CK 19.1 的 T1008 把主要通道受损或不可达时使用替代通信路径列为命令与控制行为，并提到规避单一路径的数据传输阈值。应保留这一父行为锚点，但在 Niji 中限定为攻击者预设或控制切换条件，且切换实际改变目的地、协议遥测面或可检查的服务上下文，使同一植入的控制活动更难被单点规则持续观察或关联。DustySky、TinyTurla、QUADAGENT
  和 ISMAgent 的原始分析证明了失败后的条件式切换；匿迹收益是结合传感器边界的审慎推断，并非这些样本自动证明所有备用通道都有匿迹效果。


  本准入不把多目的地配置、普通网络重试、负载均衡、灾备或正常代理故障切换本身作为匿迹证据。还需取得同一植入或稳定进程身份、旧路径失败或不可达、以及替代路径上持续控制通信的组合证据。若攻击者只是改变防火墙策略，直接对象归 NJT-0124；若只是为不同载荷阶段或功能设置独立通道，则优先审查
  T1104。暂不把依赖服务信誉、延时激活或 DGA 的模式独立定为 Niji 子项，除非后续来源证明切换条件及独立观察差异。'
rationale_en: 'ATT&CK Enterprise 19.1 anchors T1008 in use of an alternate communication path when the primary path
  is compromised or unavailable and mentions avoiding a single path''s transfer threshold. Preserve that parent
  behavior, but narrow Niji admission to an attacker configured or controlled switch whose actual destination, protocol
  telemetry surface, or inspectable service context changes, making one implant''s C2 harder to follow with a single
  point rule. Original analyses of DustySky, TinyTurla, QUADAGENT, and ISMAgent establish conditional failover after
  failure. The stealth benefit is a calibrated inference about defender sensor boundaries; those samples do not
  establish that every backup channel is stealthy.


  A list of destinations, ordinary network retries, load balancing, disaster recovery, or legitimate proxy failover
  is not by itself evidence of stealth. Admission also requires a consistent implant or process identity, an unavailable
  or failed former path, and continued control communication on the alternate path. An adversary''s firewall policy
  change directly belongs to NJT-0124, while separate channels for payload stages or functions first require T1104
  review. Service reputation, delayed activation, and DGA based patterns are not independent Niji children until
  further sources establish their switch conditions and distinct observation effects.'
scope_notes_zh: 正式对象要求同一植入、可验证的失败或受控触发以及备用路径上的后继控制；纯可靠性冗余和普通重试不入子项。
scope_notes_en: Formal scope requires the same implant, verified failure or controlled trigger, and subsequent control
  on a reserve path. Reliability redundancy and ordinary retries do not form children.
