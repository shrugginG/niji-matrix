  name_en: Application Layer Protocol
  name_zh: 应用层协议
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 将 T1071 锚定为应用层协议承载命令及结果的行为。Wekby pisloader 的 DNS TXT 解析、WailingCrab 与 MQsTTang
  的 MQTT broker 任务传递，以及 Turla Outlook 后门的 MAPI 命令检查逻辑共同证明这一父行为真实存在。Niji 保留父级行为，同时把匿迹判断收紧到应用事务实际改变控制端可归属性、受害端可见路径或跨受害者关联的情形；普通协议名称、端口和
  TLS 不足以准入。


  五个 ATT&CK 子项按 Web、文件传输、邮件、DNS 和发布订阅媒介拆分，不能直接继承为 Niji 子项。原始样本支持两项跨实现的变量：协议中介使受害端会话目的地与真正下令者分离，以及每接收者逻辑地址使共享主题观察不再覆盖整体控制。WailingCrab
  的前后版本提供后一项直接可见性对照；FTP 的独立匿迹轴证据不足而延期。NJT-0152 的消息/服务契约伪装和 NJT-0153 的失败触发换路仍按各自直接对象另行归类。'
rationale_en: 'Enterprise ATT&CK 19.1 anchors T1071 in application-layer carriage of commands and results. Wekby
  pisloader DNS TXT parsing, WailingCrab and MQsTTang task delivery through MQTT brokers, and Turla Outlook MAPI
  command-checking logic establish the parent behavior. Niji retains it while limiting stealth findings to application
  transactions that change attribution of the controller, the victim-visible path, or correlation across victims.
  A protocol name, port, or TLS alone is insufficient.


  The five ATT&CK children divide web, file-transfer, mail, DNS, and publish-subscribe media and cannot be inherited
  as Niji children. Original samples support two variables across implementations: an intermediary separates the
  victim session destination from the task issuer, and recipient-specific logical addresses remove coverage from
  a shared-topic observer. The WailingCrab version comparison gives a direct visibility contrast for the latter.
  A distinct FTP stealth axis lacks evidence and is deferred. NJT-0152 message and service-contract camouflage and
  NJT-0153 failure-triggered switching retain their own direct objects.'
scope_notes_zh: 持续或可重复的应用事务需连接任务、结果与防守观察差；单次下载、纯外传、正常解析或 MQTT/HTTP 连接不构成父级 C2 匿迹。公共 broker 信誉与 T1102 可并列，但中介路由变量不按公共服务命名。
scope_notes_en: A continuing or repeatable application transaction must connect task, result, and defender-observation
  difference. A one-time download, pure exfiltration, or ordinary DNS, MQTT, or HTTP connection does not establish
  parent C2 stealth. Public-broker reputation may co-map to T1102, but intermediary routing is not named by public-service
  status.
