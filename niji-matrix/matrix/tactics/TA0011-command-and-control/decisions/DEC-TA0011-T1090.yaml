  name_en: Proxy
  name_zh: 代理
decision: adapt
rationale_zh: '保留 T1090 的核心问题，因为 SOCKS、端口转发、FRP、Tor 与 CDN 路由均可在受害端和真实控制端之间插入中介，使目标侧五元组、连接来源或表面目的地不再直接代表控制基础设施。CISA 对
  Volt Typhoon 的调查直接记录了 PRTG 服务器上的 PortProxy 和 FRP 中继，Microsoft 与美国司法部又记录了被攻陷 SOHO 路由器作为隐藏真实来源的出口；Mandiant 对 APT29 的现场调查则确认
  Tor 与 meek 域前置被用于后门访问。这些证据足以支持 TA0011 中独立的中介转发对象。


  采用 adapt 而不是照搬 ATT&CK 范围。正式对象限定为承载 C2 或操作者访问的路径中介，并要求说明可见相邻节点、真实控制端和防守观察面之间的差异。Internal Proxy 与 External Proxy 是中介相对网络边界的位置，单独不产生稳定的
  Niji 子项；Multi-hop 只有在不同节点分割端到端观察责任时才形成原生变量；Domain Fronting 只有在外层 TLS 身份与内层 HTTP 路由权威分离时才形成原生变量。一般企业代理、NAT、负载均衡与远程办公
  VPN 没有攻击者控制及 C2 结果时属于正常反例。'
rationale_en: 'Retain the core T1090 problem because SOCKS, port forwarding, FRP, Tor, and CDN routing can insert an
  intermediary between a victim and the real controller, causing the victim-side five-tuple, connection origin, or apparent
  destination to cease representing the control infrastructure directly. CISA''s Volt Typhoon investigation directly
  records PortProxy and FRP relay use on a PRTG server; Microsoft and the U.S. Department of Justice separately record
  compromised SOHO routers used as egress to hide true origin; and Mandiant''s APT29 investigation confirms Tor plus
  meek domain fronting for backdoor access. These sources support a distinct intermediary-forwarding object in TA0011.


  Adapt rather than copy ATT&CK''s scope. The formal object is limited to intermediated paths carrying C2 or operator
  access and requires an explained differential among the visible adjacent node, real controller, and defender vantage.
  Internal Proxy and External Proxy describe where the intermediary sits relative to a network boundary and do not independently
  form stable Niji children. Multi-hop contributes a native variable only when separate nodes partition end-to-end observation
  custody. Domain Fronting contributes a native variable only when outer TLS identity and inner HTTP routing authority
  diverge. Ordinary enterprise proxies, NAT, load balancing, and remote-work VPNs are normal counterexamples absent attacker
  control and a C2 outcome.'
scope_notes_zh: 正式范围与相邻对象依照批次收敛记录执行。
scope_notes_en: Formal scope and adjacent ownership follow the batch convergence record.
