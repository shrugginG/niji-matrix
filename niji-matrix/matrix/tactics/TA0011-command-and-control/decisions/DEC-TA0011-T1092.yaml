candidate:
  source_type: attack
  source_attack_id: T1092
  source_attack_version: '19.1'
  name_en: Removable-Media Store-and-Forward C2
  name_zh: 可移动介质存储转发指挥控制
decision: retain
rationale_zh: 'ATT&CK Enterprise 19.1 的 T1092 直接描述两端已受控后，利用可移动介质在可能断连的系统之间传递命令，并把文件从隔离端中继回攻击者可直接访问的联网端。ESET 对 USBStealer
  的逆向分析展示了联网 A、隔离 B、按 B 计算机名寻址的加密命令文件、B 上连续执行命令以及文件返回；ESET 对 GoldenDealer 的现场工具集分析又展示了按在线状态分工、经同一介质向隔离端传递执行文件并把系统信息带回联网端。因此父行为、TA0011
  目的和往返控制链均有结论级支持，建议 retain。


  准入必须使用严格结果门。仅把载荷送达另一主机、首次通过介质触发感染、把受害数据带离、人工搬运文件、离线补丁或一次性物理交付均不构成本技术。正式范围至少要求两端已受控，并证明命令或任务包由控制侧写入介质、受限侧读取和执行、结果或状态写回并在控制侧取用；若公开证据无法覆盖完整闭环，则至少应证明同一工具具备可重复的双向任务周期，并把事件结论降为能力而非已观察全链。'
rationale_en: 'ATT&CK Enterprise 19.1 directly defines T1092 as passing commands through removable media between already
  compromised systems on potentially disconnected networks and relaying files from the disconnected side to an Internet-connected
  system directly reachable by the operator. ESET''s reverse engineering of USBStealer shows connected host A, isolated
  host B, encrypted command files addressed by B''s computer name, consecutive command execution on B, and file return.
  ESET''s observed GoldenDealer toolset independently shows online-role selection, executable delivery to an isolated
  host through the same medium, and system information returning to the connected side. The parent behavior, TA0011 purpose,
  and round-trip control chain therefore have conclusion-level support, so retain is recommended.


  Admission requires a strict outcome gate. Delivering a payload to another host, first infection through media, carrying
  victim data outward, human file transport, offline patching, or one physical delivery does not establish this technique.
  Canonical scope should require both sides to be compromised and should show a command or task package written by the
  control side, read and acted on by the restricted side, and a result or status written back and consumed on the control
  side. If public evidence does not cover the complete observed loop, it must at least establish that the same tooling
  implements a repeatable bidirectional task cycle, and the case conclusion must remain a capability rather than a fully
  observed incident chain.'
scope_notes_zh: 正式范围与相邻对象依照批次收敛记录执行。
