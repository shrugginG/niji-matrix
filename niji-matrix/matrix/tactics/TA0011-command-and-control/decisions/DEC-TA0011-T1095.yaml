candidate:
  source_type: attack
  source_attack_id: T1095
  source_attack_version: '19.1'
  name_en: Non-Application Layer Protocol
  name_zh: 非应用层协议
decision: adapt
rationale_zh: '>- ATT&CK Enterprise 19.1 的 T1095 明确覆盖以网络层、传输层、会话层或平台局部通信机制在受害主机与控制端之间交换数据。PingPull 的 ICMP Echo 请求/回复及
  raw TCP 变体、ShadowPad 的 UDP 自定义会话、UNC3886 的 VMCI 后门和 PLATINUM 的 AMT Serial-over-LAN 均提供原始技术分析，证明这种行为在现实样本或事件中存在，并造成应用解析缺失或观察平面迁移。


  >- Niji 应作 adapt，因为固定基线描述同时列出 SOCKS、重定向/隧道协议及各种仅凭 TCP/UDP 名称的案例，容易与真实应用事务、代理和隧道对象重叠。正式父级应收敛为“持续任务与结果直接承载在非应用事务通道上”，要求说明攻击者可控的承载方式、痕迹变化和防守观察差。端口选择、协议名称、加密或编码都不能单独构成准入或子技术。'
rationale_en: '>- Enterprise ATT&CK 19.1 T1095 explicitly covers exchange between a victim and controller through network-layer,
  transport-layer, session-layer, or platform-local communication mechanisms. Original technical analyses of PingPull''s
  ICMP Echo and raw TCP variants, ShadowPad''s custom UDP session, UNC3886''s VMCI backdoors, and PLATINUM''s AMT Serial-over-LAN
  establish this behavior in samples or incidents and show either absent application parsing or movement of the observation
  plane.


  >- Niji should adapt the source because the fixed baseline also lists SOCKS, redirected or tunneled protocols, and
  many cases described only by TCP or UDP names, creating overlap with real application transactions, proxies, and tunneling.
  The formal parent should converge on continuing task and result carriage directly over a channel without an application
  transaction and require an attacker-controlled carrier choice, trace change, and defender-observation differential.
  Port selection, protocol name, encryption, or encoding alone cannot establish admission or a child.'
scope_notes_zh: '>- 父级以有证据的持续 C2 为必要条件。单次魔术包激活归 T1205；完整内层协议封装归 T1572；真实 HTTP、DNS、MQTT、SSH 或 SOCKS 事务按实际行为归 NJT-0160、T1090
  或其他相邻对象。并列归类仅在持续后继通信本身仍满足本父级时成立。'
scope_notes_en: '>- Evidence of continuing C2 is required. A one-time magic-packet activation belongs to T1205; intact
  inner-protocol encapsulation belongs to T1572; real HTTP, DNS, MQTT, SSH, or SOCKS transactions map by actual behavior
  to NJT-0160, T1090, or another adjacent object. Concurrent classification is appropriate only where continuing successor
  communication independently satisfies this parent.'
