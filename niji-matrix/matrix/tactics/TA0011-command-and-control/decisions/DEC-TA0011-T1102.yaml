  name_en: Web Service
  name_zh: Web 服务
decision: adapt
rationale_zh: '保留 T1102 的独立问题：攻击者可让合法外部服务的账号、API、邮箱、云存储或发布对象承担任务、载荷和结果交换，使受害网络只看到通常获准的提供方，而真实控制命名空间和对象生命周期位于服务内部。ESET
  在多个 OilRig 受害环境中观察到共享 OneDrive、Outlook 与 Exchange 账户承载命令和结果；Trellix 对 Graphite 的逆向确认 OneDrive 任务读取、结果上传与任务删除；ESET 又独立观察到
  ComRAT 通过 Gmail Web UI 获取命令附件。


  采用 adapt，因为 ATT&CK 的 Dead Drop Resolver、Bidirectional Communication 和 One-Way Communication 按用途与方向分组，不能直接成为 Niji 子项。正式父项要求重复或可持续控制关系、攻击者控制的服务命名空间或对象，以及端点控制结果；单次托管载荷下载、普通
  SaaS 访问或只解析一个地址不自动成立。子项按共享提供方身份与真实控制命名空间分离，以及持久服务对象分隔操作者写入、植入读取和结果回写这两类稳定变量划分。'
rationale_en: 'Retain the independent T1102 problem: an adversary can make accounts, APIs, mailboxes, cloud storage,
  or publication objects of a legitimate external service carry tasks, payloads, and results. The victim network sees
  a normally allowed provider while the real control namespace and object lifecycle reside inside the service. ESET observed
  shared OneDrive, Outlook, and Exchange accounts carrying commands and results across multiple OilRig victim environments;
  Trellix reverse engineered Graphite task retrieval, result upload, and task deletion in OneDrive; and ESET independently
  observed ComRAT obtaining command attachments through Gmail Web UI.


  Adapt because ATT&CK Dead Drop Resolver, Bidirectional Communication, and One-Way Communication partition by use and
  direction rather than Niji stealth variables. The formal parent requires a repeatable or sustained control relationship,
  an attacker-controlled service namespace or object, and an endpoint control outcome. One hosted-payload download, ordinary
  SaaS access, or one address lookup is insufficient. Children instead partition by separation between shared provider
  identity and the real control namespace, and by persistent service objects separating operator write, implant read,
  and result write-back.'
scope_notes_zh: 正式范围与相邻对象依照批次收敛记录执行。
scope_notes_en: Formal scope and adjacent ownership follow the batch convergence record.
