candidate:
  source_type: attack
  source_attack_id: T1104
  source_attack_version: '19.1'
  name_en: Multi-Stage Channels
  name_zh: 多阶段通道
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 的 T1104 锚定在不同条件或功能下使用多个 C2 阶段。APT30 BACKSPACE 的自动化第一阶段只向被选主机提供第二阶段位置和连接指令，Juniper
  oemd 从 UDP 接收目标后才建立 TCP 操作通道，LunarWeb 将首次主机登记与命令 URL 分离，BlackWater 从一个服务器取得枚举组件后向另一 C2 回传结果；这些原始分析证明角色化通道和交接不是单纯多域名推断。


  Niji 应作 adapt，因为固定定义还提及备用第一阶段和“上传第二 RAT”等可能分别属于 NJT-0153 或普通载荷执行的事实。正式父级只纳入至少两个逻辑 C2 通道被攻击者赋予不同阶段/功能，且能证明交接触发、同一受害者/植入谱系及跨通道控制结果。协议、域名、工具组件或载荷阶段本身不构成准入或子技术。'
rationale_en: 'Enterprise ATT&CK 19.1 T1104 is anchored in multiple C2 stages used under different conditions or for
  different functions. APT30 BACKSPACE uses an automated first stage that supplies second-stage location and connection
  instructions only to selected hosts. Juniper oemd receives a target over UDP before establishing an operational TCP
  channel. LunarWeb separates first-contact host registration from command URLs. BlackWater retrieves an enumeration
  component from one server and returns results to another C2. These original analyses establish role-assigned channels
  and handoffs rather than an inference from multiple domains alone.


  Niji should adapt the source because the fixed definition also mentions backup first-stage callbacks and uploading
  a second RAT, facts that may belong respectively to NJT-0153 or ordinary payload execution. The formal parent should
  require at least two logical C2 channels assigned different stage or functional roles by the actor, plus evidence of
  the handoff trigger, the same victim or implant lineage, and a control outcome across channels. Protocols, domains,
  tool components, or payload stages alone do not establish admission or a child.'
scope_notes_zh: 阶段交接须由配置/地址下发、主机选择、通道角色字段、进程谱系或命令—结果因果链支持。主通道失败后启用备用路径归 NJT-0153；同一会话的请求/响应、下载后执行但没有新 C2、多个镜像域名及多跳转发均不满足本候选。
scope_notes_en: A stage handoff must be supported by configuration or address delivery, host selection, channel-role
  fields, process lineage, or a command-to-result causal chain. Reserve paths activated after primary failure belong
  to NJT-0153. Request and response in one session, payload execution without new C2, multiple mirror domains, and multihop
  forwarding do not satisfy this candidate.
