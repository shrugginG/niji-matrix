candidate:
  source_type: attack
  source_attack_id: T1105
  source_attack_version: '19.1'
  name_en: Ingress Tool Transfer
  name_zh: 入站工具传输
decision: adapt
rationale_zh: 'T1105 与现有 NJT-0130 共享同一个直接结果门：攻击者控制的独立工具或文件在已受控目标上实际到达，并且源、目标和内容或等价谱系能够被指认。T1570 的源位于受害环境内另一主机，T1105 的源位于外部系统、C2
  或替代路径；来源拓扑决定不同的防守数据，却不改变“目标文件到达”这一行为对象。矩阵已有不同 ATT&CK 候选映射到同一 NJT 的先例，因此建议为 TA0011 保留独立 adapt 决策，扩展 NJT-0130 的名称、战术引用和双语范围，而不复制父技术。


  现有 DET-000139/NJA-000143 与 MIT-000127 只覆盖内部 SMB 到达，不能宣称覆盖 T1105。共享父技术后仍需新增外部请求/响应—目标文件创建 Analytic 与外部入站控制；这属于同一 Technique
  下按来源观察面拆分防御，不构成新 Technique 的理由。Mandiant 对 UNC2975 使用重命名 curl 下载 MSI/AutoIt 文件、Microsoft 对 sLoad 经 BITS 下载编码文件再解码执行，以及
  BazaCall 经重命名 certutil 下载 BazaLoader 的研究均证明外部响应到目标文件和后继执行链。'
rationale_en: 'T1105 and existing NJT-0130 share the same direct outcome gate: an adversary-controlled independent tool
  or file actually arrives on an already controlled destination, with identifiable source, destination, and content or
  equivalent lineage. T1570 starts from another host inside the victim environment; T1105 starts from an outside system,
  C2, or alternate path. Source topology requires different defensive data but does not change the behavior object of
  destination file arrival. The matrix already permits different ATT&CK candidates to resolve to one NJT, so TA0011 should
  retain an independent adapt decision and extend NJT-0130 name, tactic references, and bilingual scope rather than duplicate
  the parent.


  Existing DET-000139, NJA-000143, and MIT-000127 cover internal SMB arrival only and cannot claim T1105 coverage. A
  shared parent still needs a new external request-or-response-to-destination-file analytic and external-ingress controls.
  That is a defense split by source observation plane under one Technique, not a reason for another Technique. Mandiant
  reporting on UNC2975 using renamed curl to download MSI or AutoIt files, Microsoft reporting on sLoad downloading encoded
  files through BITS before decoding and execution, and BazaCall using renamed certutil to download BazaLoader each establish
  an external-response-to-destination-file-to-successor-execution chain.'
scope_notes_zh: T1105 复用 NJT-0130 的独立文件到达结果门；外部/C2 来源作为新防御分支，内部 SMB 保持既有分支。
scope_notes_en: T1105 reuses NJT-0130 and its independent-file-arrival gate. Outside or C2 sources form a new defense
  branch while internal SMB retains the existing branch.
