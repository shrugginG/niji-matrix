candidate:
  source_type: attack
  source_attack_id: T1132
  source_attack_version: '19.1'
  name_en: Reversible C2 Representation Encoding
  name_zh: C2 可逆表示编码
decision: adapt
rationale_zh: 'ATT&CK Enterprise 19.1 的 T1132 将对命令控制数据施加字符或二进制到文本表示变换，以降低内容在规范化前的可检测性，明确限定于 TA0011。NCSC 对 SpecCom 的代码级报告展示了
  C2 请求、入站任务和回传输出经过 UTF-16、XOR、Base64 与 URL 编码的可逆链；Unit 42 对 TDrop2 的逆向分析展示了加密后使用自定义 Base64 字母表、接收端解码并恢复命令、执行后回传结果。父行为和“可见表示—恢复语义”因果链均获一手证据支持，因此不应
  exclude。


  需要 adapt 的原因是 Niji 现有 `NJT-0115` 及 `NJS-0115-001` 已经覆盖跨战术的可逆语义变换，`NJT-0152` 又已覆盖 C2 消息中的噪声、载体和服务契约观察差。T1132 不能成为第三个拥有
  Base64、十六进制、自定义字母表、多层编码或压缩恢复变量的分类。建议只保留一个 TA0011 父级对象，明确其直接对象是 C2 命令或结果在传输中的可逆表示，以及规范化前后的语义差；正式子项为 `none-justified`，变量级归类复用
  `NJS-0115-001`，会话层额外混淆按条件与 `NJT-0152` 并列。'
rationale_en: 'ATT&CK Enterprise 19.1 defines T1132 as applying character or binary-to-text representation transforms
  to command-and-control data so the content is harder to detect before normalization, specifically within TA0011. NCSC''s
  code-level SpecCom report shows a reversible chain of UTF-16, XOR, Base64, and URL encoding for C2 requests, inbound
  tasking, and returned output. Unit 42''s reverse engineering of TDrop2 shows encryption followed by a custom Base64
  alphabet, receiver-side decoding to recover commands, execution, and result upload. The parent behavior and visible-representation-to-recovered-semantics
  causal chain have direct evidence, so exclusion is unwarranted.


  Adaptation is required because existing `NJT-0115` and `NJS-0115-001` already cover reversible semantic transformation
  across tactics, while `NJT-0152` already owns C2 observation differences created by noise, carriers, and service contracts.
  T1132 must not become a third owner of Base64, hexadecimal, custom alphabets, layered encoding, or decompression variables.
  Keep one TA0011 parent whose direct object is reversible representation of commands or results in transit and the semantic
  difference before and after normalization. Its formal child coverage should be `none-justified`; variable-level classification
  reuses `NJS-0115-001`, while additional conversation-level obfuscation co-classifies with `NJT-0152` only when present.'
scope_notes_zh: 保留传输中 C2 可逆表示父级；可逆表示变量由 NJS-0115-001 唯一拥有，正式新增零 NJS。
scope_notes_en: Retain a parent for reversible C2 representation in transit. NJS-0115-001 uniquely owns the reversible-representation
  variable, leaving zero new NJS children.
