  source_attack_version: '19.1'
  name_en: Traffic Signaling
  name_zh: 流量信令
decision: adapt
rationale_zh: 'Enterprise ATT&CK 19.1 将 T1205 同时映射到 Stealth、Persistence 与 Command and Control，并要求魔术值或信号序列触发隐藏端口、任务或控制功能。既有
  NJT-0120“网络信号门控功能暴露”已经以攻击者控制的信号、匹配状态、隐藏→激活状态转变及后继监听/重定向/进程/控制会话为父行为，其内容直接覆盖 TA0011，不需要复制技术。


  TA0011 应独立作 `adapt` 决策并复用 NJT-0120，因为 Niji 已有意把 ATT&CK 的产品/实现式 Port Knocking 与 Socket Filters 重构为“有状态信号序列激活”和“内容模式数据包激活”两个稳定
  matcher 变量。对 TA0011 的额外门禁是后继结果必须建立可重复的 C2 监听、反向/入站会话或命令功能；只维持持久化、唤醒主机或执行一次本地任务的隐藏功能仍可属于 TA0005/Persistence，但不形成 TA0011
  结论。'
rationale_en: 'Enterprise ATT&CK 19.1 maps T1205 to Stealth, Persistence, and Command and Control and requires a magic
  value or signal sequence to activate a hidden port, task, or control function. Existing NJT-0120 Network-Signal-Gated
  Function Exposure already defines the parent through an attacker-controlled signal, match state, hidden-to-active transition,
  and successor listener, diversion, process, or control session. Its content directly covers TA0011 and should not be
  duplicated.


  TA0011 should record an independent `adapt` decision and reuse NJT-0120 because Niji deliberately rebuilt ATT&CK''s
  implementation-shaped Port Knocking and Socket Filters into the stable matcher variables Stateful Signal-Sequence Activation
  and Content-Pattern Packet Activation. The additional TA0011 gate is a successor outcome establishing a repeatable
  C2 listener, reverse or inbound session, or command function. Hidden functionality that only preserves persistence,
  wakes a host, or executes one local task may remain relevant to TA0005 or Persistence but does not establish a TA0011
  conclusion.'
scope_notes_zh: 不改变父级或子级身份。正式集成应扩展 NJT-0120 的 tactic_refs，保留其创建设计 decision_ref，并新增 TA0011 自身的交叉战术决策指向同一 NJT。没有信号→匹配→C2
  结果的连续链时，不得仅凭稀有包、开放端口、BPF/WFP 对象或魔术字符串标记 TA0011。
scope_notes_en: Parent and child identities remain unchanged. Canonical integration should extend NJT-0120 tactic_refs,
  preserve its founding decision_ref, and add a separate TA0011 cross-tactic decision pointing to the same NJT. Without
  a continuous signal-to-match-to-C2-outcome chain, a rare packet, open port, BPF or WFP object, or magic string cannot
  establish TA0011.
