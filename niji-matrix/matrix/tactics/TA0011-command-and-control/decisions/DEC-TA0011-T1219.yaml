candidate:
  source_type: attack
  source_attack_id: T1219
  source_attack_version: '19.1'
  name_en: Remote Access Tools
  name_zh: 远程访问工具
decision: adapt
rationale_zh: '保留 T1219，因为真实事件证明攻击者会用合法远控软件、IDE 远程开发服务和 IP-KVM 建立具交互能力的控制通道。SentinelLabs/Tinexta 在 Operation Digital
  Eye 直接观察攻击者以 Microsoft 签名的 VS Code 和 GitHub 账号建立 dev tunnel 并从 vscode.dev 控制目标；Microsoft 观察 Storm-1811 冒充帮助台诱使用户批准
  Quick Assist 后投放更多 RMM 与勒索组件；Mandiant 和 Microsoft 的 DPRK IT worker 调查又记录 IP-KVM 与多种远管工具控制公司设备。这些行为共享“合法远控能力承载未授权操作者”的父语义。


  采用 adapt，因为固定 T1219.001/.002/.003 按 IDE、桌面软件和硬件实现分组，而 Niji 子项应跨实现按控制归属、批准工作流和观察面划分。正式范围要求远控产品/服务/硬件形成实际交互会话或持续控制能力，并把
  controller、target 与结果连接；只安装工具、登录 vendor portal、存在 KVM 或使用有效账号不足。建议三项原生变量：控制端命名空间重绑定、批准工作流脱离的受信会话、以及控制平面移出宿主 OS 的观察置换。'
rationale_en: 'Retain T1219 because field incidents establish adversaries using legitimate remote-control software, IDE
  remote-development services, and IP-KVM devices to create interactive control channels. SentinelLabs and Tinexta directly
  observed Operation Digital Eye actors establishing a dev tunnel with Microsoft-signed VS Code and GitHub accounts and
  controlling targets from vscode.dev. Microsoft observed Storm-1811 impersonating help desk staff to obtain Quick Assist
  approval before deploying additional RMM and ransomware components. Mandiant and Microsoft DPRK IT-worker investigations
  separately record IP-KVM and multiple remote-management tools controlling corporate devices. These behaviors share
  a parent meaning of legitimate remote-control capability carrying an unauthorized operator.


  Adapt because fixed T1219.001, .002, and .003 group IDE, desktop software, and hardware implementations, while Niji
  children should cut across implementations by controller ownership, approval workflow, and observation plane. Formal
  scope requires the remote-control product, service, or hardware to form an actual interactive session or continuing
  control capability and join controller, target, and outcome. Tool installation, vendor-portal login, KVM presence,
  or a valid account alone is insufficient. Three native variables are proposed: controller-namespace rebinding, a trusted
  session detached from approval workflow, and observation displacement when the control plane sits outside the host
  OS.'
scope_notes_zh: 父级限定合法远控能力被用于建立交互控制；三个子项按控制命名空间、批准工作流和宿主外观察面划分。
scope_notes_en: Parent scope is legitimate remote-control capability used for interactive control. Three children separate
  controller namespace, approval workflow, and off-host observation plane.
