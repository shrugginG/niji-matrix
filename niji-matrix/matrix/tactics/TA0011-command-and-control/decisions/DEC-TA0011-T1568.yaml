  name_en: Dynamic Resolution
  name_zh: 动态解析
decision: adapt
rationale_zh: 'Enterprise ATT&CK 19.1 的 T1568 锚定攻击者在运行时动态调整 C2 域名、IP 或端口。ESET 对 Gamaredon 的样本与基础设施研究显示工具自行解析频繁变更地址的域并随后按得到的
  IP 联系 C2；Mandiant 的 POSHSPY 事件/样本分析显示植入从词表组合派生最多 550 个 C2 URL；CrowdStrike 的 Numbered Panda 分析显示恶意代码使用一个 DNS 应答的地址字节计算另一个
  C2 通道的端口。三类证据都把运行时求值连接到后续 C2 消费。


  Niji 应作 adapt，因为 ATT&CK 子项按 Fast Flux、DGA 和 DNS Calculation 实现命名，且父级把失败后恢复 C2 作为常见用途。正式范围应收敛为攻击者控制的解析/计算值被同一植入实际消费为后续
  C2 endpoint；域名随机、低 TTL、多 IP、DDNS、DNS 查询或失败换路本身都不足。子技术按“何处保存动态状态、如何把它转换成端点以及防守需要恢复何种映射”划分。'
rationale_en: 'Enterprise ATT&CK 19.1 T1568 anchors adversary adjustment of C2 domains, IP addresses, or ports at runtime.
  ESET''s Gamaredon sample and infrastructure research shows tools resolving domains whose addresses change frequently
  and then using the obtained IP to contact C2. Mandiant''s POSHSPY incident and sample analysis shows an implant deriving
  as many as 550 C2 URLs from word lists. CrowdStrike''s Numbered Panda analysis shows malware using address bytes from
  one DNS answer to calculate the port of another C2 channel. Each evidence class connects runtime evaluation to later
  C2 consumption.


  Niji should adapt the source because ATT&CK children are named for Fast Flux, DGA, and DNS Calculation implementations
  and the parent treats post-failure C2 recovery as a common use. Formal scope should require an attacker-controlled
  resolved or computed value to be consumed by the same implant as a later C2 endpoint. A random-looking domain, low
  TTL, multiple IPs, DDNS, a DNS query, or failure-driven switching alone is insufficient. Children should be divided
  by where dynamic state resides, how it becomes an endpoint, and which mapping defenders must reconstruct.'
scope_notes_zh: 严格要求运行时 derived/resolved value 被同一植入消费为后继 C2 endpoint；普通 DNS/CDN/DDNS 不准入。
scope_notes_en: Require a runtime-derived or resolved value to be consumed by the same implant as a successor C2 endpoint;
  ordinary DNS, CDN, and DDNS are excluded.
