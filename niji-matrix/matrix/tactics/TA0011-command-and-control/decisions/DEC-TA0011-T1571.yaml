  source_attack_id: T1571
  source_attack_version: '19.1'
  name_en: Non-Standard Port
  name_zh: 非标准端口
decision: adapt
rationale_zh: '保留 T1571 所代表的协议—端口错配问题，但将“非标准”从固定端口表改写为环境预期差：同一 source role、destination/service 与 policy 下，流量实际协议或应用语义不同于该端口被允许、解析或记录时的预期，并且这种差异造成
  filter allow、parser failure/错选或日志语义缺失。DFIR Report 在真实入侵中观察 FlawedGrace 以 custom binary protocol 经 TCP/443 C2，缺少 SSL certificate
  与 JA3；VMware 通过协议仿真在 TCP/443 验证 Winnti 4.0 的 custom request/response；BitSight 为 PseudoManuscrypt 实现其 UDP/53 与 TCP/443 proprietary
  protocol 并通过 sinkhole 获得感染遥测。三者都证明端口标签不能代表真实 C2 语义。


  采用 adapt 而非按 well-known/non-standard 数字保留原表述。正式准入必须同时有 actual semantics、environment expected service/policy、解析/过滤/日志差分与后继
  C2；单个高位端口、443/53 出站、unknown-tcp、扫描命中或“端口不常见”不足。官方 Zeek DPD、Suricata app_proto mismatch/failed 与 Palo Alto App-ID/application-default
  证明可以独立记录 actual protocol 和 policy outcome，也说明现代 port-independent inspection 会削弱匿迹。开放 taxonomy 搜索最终建议零 NJS，因为 filter allowance
  与 parser displacement 是同一攻击者控制错配在不同防守面上的后果，而非稳定兄弟变量。'
rationale_en: 'Retain the protocol-to-port mismatch problem represented by T1571, but rewrite non-standard from a fixed port
  table into an environmental expectation differential. For a given source role, destination or service, and policy, the actual
  protocol or application semantics differ from what the port was expected to allow, parse, or record, and the difference
  produces filter allow, parser failure or wrong selection, or missing log semantics. In a real intrusion, The DFIR Report
  observed FlawedGrace using a custom binary C2 protocol over TCP/443 without SSL certificates or JA3. VMware validated Winnti
  4.0 custom requests and responses over TCP/443 through protocol emulation. BitSight implemented PseudoManuscrypt''s proprietary
  UDP/53 and TCP/443 protocol and obtained infection telemetry through sinkholing. All three establish that a port label does
  not identify real C2 semantics.


  Adapt rather than retain a numeric well-known versus non-standard formulation. Formal admission requires actual semantics,
  an environment-expected service or policy, a parsing, filtering, or logging differential, and successor C2. One high port,
  outbound 443 or 53, unknown-tcp, a scan hit, or an uncommon-port label is insufficient. Official Zeek DPD, Suricata app_proto
  mismatch or failed fields, and Palo Alto App-ID and application-default controls establish independent recording of actual
  protocol and policy outcome and show that modern port-independent inspection reduces stealth. The open taxonomy search recommends
  zero NJS because filter allowance and parser displacement are consequences of the same attacker-controlled mismatch at different
  defensive planes rather than stable sibling variables.'
scope_notes_zh: 要求实际语义、当地端口服务预期、防守差分与后继 C2 四层证据；现有公开案例不证明每个目标的本地策略效果。
scope_notes_en: Require actual semantics, local port-service expectation, a defensive differential, and successor C2; public
  cases do not establish every victim's local policy effect.
