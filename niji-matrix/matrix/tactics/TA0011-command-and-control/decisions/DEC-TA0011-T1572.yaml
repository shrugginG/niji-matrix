  name_en: Protocol Tunneling
  name_zh: 协议隧道
decision: retain
rationale_zh: 'ATT&CK Enterprise 19.1 的 T1572 以“显式把一种协议封装在另一协议中”为父行为，并要求其用于绕过网络过滤、穿越不可达边界或隐藏通信。Mandiant 现场观察 APT29 通过 meek
  把 Tor 流量编码进 HTTP、再包入 TLS，并由 Tor hidden service 把 Terminal Services、NetBIOS 和 SMB 转发至受害主机本地端口；FortiGuard 对 TrickBot 样本的逆向分析恢复了跨多个
  DNS 查询/应答分片的会话 ID、片序、重组缓冲区及与 HTTP 版本相同的内层命令结构；NVISO 对 BRICKSTORM 的逆向分析恢复了 WebSocket、嵌套 TLS、Yamux 多路复用和并发内层会话。这些来源分别证明服务端点封装、事务化重组和多流汇聚，足以
  retain 父行为。


  Niji 准入需把范围收紧为可证明的内外层关系。必须识别完整或可重建的内层会话语义、承载它的外层协议/会话、封装或重组边界，以及由内层会话产生的 C2、远程访问或跨边界结果。只发现隧道工具、TLS、VPN、SSH 连接、SOCKS 能力、异常
  DNS 或 Web 流量不够；不能从产品名、端口或加密外观推定封装。父级语义与 ATT&CK 一致，因此保留而非 adapt，但正式内容明确写入结果门和正常隧道反例。'
rationale_en: 'ATT&CK Enterprise 19.1 anchors T1572 in explicitly encapsulating one protocol within another to bypass network
  filtering, cross an otherwise unreachable boundary, or conceal communication. Mandiant observed APT29 using meek to encode
  Tor traffic into HTTP, wrap it in TLS, and forward Terminal Services, NetBIOS, and SMB through a Tor hidden service to local
  victim ports. FortiGuard reverse engineering of a TrickBot sample recovers session identifiers, fragment ordering, reassembly
  buffers across DNS queries and answers, and an inner command structure identical to its HTTP variant. NVISO reverse engineering
  of BRICKSTORM recovers WebSocket, nested TLS, Yamux multiplexing, and concurrent inner sessions. These sources independently
  establish service-endpoint encapsulation, transactionized reassembly, and multi-stream convergence, supporting retention.


  Niji admission requires a proven inner-to-outer relationship. Evidence must identify an intact or reconstructable inner
  session semantic, the outer protocol or session carrying it, the encapsulation or reassembly boundary, and a C2, remote-access,
  or cross-boundary outcome produced by the inner session. Discovery of a tunneling tool, TLS, VPN, SSH connection, SOCKS
  capability, anomalous DNS, or web traffic alone is insufficient; product name, port, or encrypted appearance cannot establish
  encapsulation. The parent remains semantically faithful to ATT&CK and is therefore retained rather than adapted, while canonical
  prose should state the outcome gate and legitimate-tunnel counterexamples explicitly.'
scope_notes_zh: 要求内层语义、外层承载、解封装或重组关系及后继 C2/访问结果；单一代理、VPN 或加密连接不足。
scope_notes_en: Require inner semantics, outer carriage, a decapsulation or reassembly relationship, and successor C2 or access
  outcome; a proxy, VPN, or encrypted connection alone is insufficient.
