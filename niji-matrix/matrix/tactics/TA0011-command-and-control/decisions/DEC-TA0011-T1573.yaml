  name_en: Encrypted Channel
  name_zh: 加密通道
decision: adapt
rationale_zh: 'Enterprise ATT&CK 19.1 的 T1573 父级已将范围描述为攻击者施加加密算法，而不是仅依赖协议固有保护。CrowdStrike 对 3PARA RAT 恢复了固定字符串派生 DES/XOR key
  及任务—结果链；联合政府 Snake 报告记录 PSK 与 Diffie-Hellman 建立每会话秘密、key material 和解密命令参数；NCSC 对 Cyclops Blink 证明每消息随机 AES key/IV 经硬编码 RSA
  public key 封套，消息再置于 TLS 内，并恢复命令格式与模块结果。这些证据共同支持额外密码变换、接收端恢复和 C2 结果。


  Niji 应作 adapt，因为 ATT&CK 子项按对称/非对称算法家族划分，且固定清单包含只使用 SSL/TLS 的案例。正式范围要求攻击者控制的附加密码层、key/material/receiver recovery path 以及解密后的命令/结果。正常协议原生
  TLS、单独高熵、算法/library 名称或 encrypted 标签不准入。子技术按密钥可复用范围、运行时秘密生命周期和检查边界划分。'
rationale_en: 'Enterprise ATT&CK 19.1 already describes T1573 as an adversary-applied encryption algorithm rather than reliance
  on protections inherent in a protocol. CrowdStrike recovered 3PARA RAT''s fixed-string-derived DES or XOR keying and task-result
  chain. The joint-government Snake report documents PSK plus Diffie-Hellman session-secret establishment, key material, and
  decrypted command parameters. NCSC establishes Cyclops Blink generating a random AES key and IV for each message, enveloping
  them with a hardcoded RSA public key, placing messages beneath TLS, and recovering command formats and module outcomes.
  Together these sources support an added cryptographic transform, receiver recovery, and C2 outcome.


  Niji should adapt the source because ATT&CK children divide symmetric and asymmetric algorithm families and the fixed inventory
  includes cases using SSL or TLS alone. Formal scope requires an attacker-controlled additional cryptographic layer, a key,
  material, or receiver recovery path, and a command or result after decryption. Ordinary protocol-native TLS, high entropy
  alone, an algorithm or library name, or an encrypted label does not qualify. Children use key reuse scope, runtime-secret
  lifetime, and inspection boundary.'
scope_notes_zh: 仅纳入承载协议之外的攻击者附加密码层；密钥/材料恢复、接收端解密和命令或结果需连接。
scope_notes_en: Include only an attacker-added cryptographic layer beyond the carrier protocol, joining key or material recovery,
  receiver decryption, and a command or result.
