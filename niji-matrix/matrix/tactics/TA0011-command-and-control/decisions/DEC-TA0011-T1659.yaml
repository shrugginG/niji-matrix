  source_attack_version: '19.1'
  name_en: Content Injection
  name_zh: 内容注入
decision: retain
rationale_zh: 'ATT&CK Enterprise 19.1 将同一 T1659 父技术同时映射到 TA0001 与 TA0011，并明确写明受控在线传输路径既可用于首次访问，也可向已经受控系统持续投递额外载荷和其他数据。ESET
  对 MoustachedBouncer 的现场研究不仅记录按目标网络注入 DNS、HTTP 与 SMB 响应完成首次感染，还记录植入后的定时任务持续从路径局部的 SMB share 读取命令文件、把输出写回 share、取得插件并形成约一秒延迟的反向
  shell。父行为与稳定路径变量未因战术阶段改变，因此 TA0011 应 retain 并复用 NJT-0052，而非复制父技术。


  复用必须伴随父级与三个子项的逐字段重写。现有正式正文把 definition、scope、scenario、attacker/defender model、mechanism analysis 和 limitations 全部锚定在“首个入口”，并在
  scope 中明确排除 C2；只增加 TA0011 tactic_ref 会制造自相矛盾。建议把父级改为阶段中性的“攻击者在受控传输路径中按请求注入内容，使接收端接受源站未发送的对象/回复”，再分别以首次立足点或持续命令/结果作为战术结果。三个既有
  Niji 变量继续唯一拥有分类；新增 C2-only 子项未发现独立缺口。'
rationale_en: 'ATT&CK Enterprise 19.1 maps the same T1659 parent to both TA0001 and TA0011 and explicitly states that compromised
  online transfer paths can provide initial access and continuously deliver additional payloads or other data to already compromised
  systems. ESET''s field research on MoustachedBouncer documents not only target-network injection of DNS, HTTP, and SMB responses
  for first compromise, but also post-compromise scheduled tasks repeatedly reading command files from path-local SMB shares,
  writing output back to those shares, retrieving plugins, and forming a reverse shell with roughly one-second latency. The
  parent behavior and stable path variables do not change with tactic phase, so TA0011 should retain and reuse NJT-0052 rather
  than duplicate it.


  Reuse requires field-by-field rewriting of the parent and all three children. Current canonical definition, scope, scenario,
  attacker and defender models, mechanism analyses, and limitations all anchor on first entry, and the scope explicitly excludes
  C2. Adding only a TA0011 tactic reference would create a contradiction. Rewrite the parent as stage-neutral adversary injection
  of request-specific content on a controlled transfer path that causes a receiver to accept an object or response not sent
  by the origin, with either first foothold or continuing command-and-result exchange as the tactic outcome. The three existing
  Niji variables remain unique owners of the taxonomy; research found no independently supported C2-only child gap.'
scope_notes_zh: 复用 NJT-0052，分别要求初始入口或已受控主机经注入路径持续取得任务与结果；竞速响应的 C2 用途仍为假设。
scope_notes_en: Reuse NJT-0052 with distinct initial-entry or continuing task-and-result outcomes on an already compromised
  host; C2 use of racing responses remains a hypothesis.
