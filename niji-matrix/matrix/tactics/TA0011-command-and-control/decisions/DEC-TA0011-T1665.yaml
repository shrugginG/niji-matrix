candidate:
  source_type: attack
  source_attack_id: T1665
  source_attack_version: '19.1'
  name_en: Hide Infrastructure
  name_zh: 隐藏基础设施
decision: adapt
rationale_zh: '保留 T1665 的运行时基础设施隐藏问题，但把宽泛的代理、可信托管、域名伪装和资源取得剥离，改写为“选择性 C2 基础设施暴露”：攻击者控制正在运行的 C2 front、redirector、listener、WAF/CDN
  rule 或 origin，使同一基础设施只向具备 implant 请求资格的会话暴露实际 C2，或专门对扫描器、研究员与已知防守来源拒绝、重定向、返回良性外观或关闭服务，同时受害端仍完成 tasking、result、payload/config
  retrieval 或持续控制。Unit 42 在与 24 个柬埔寨政府组织保持持久通信的 C2 上观察到屏蔽 Palo Alto、云/VPS、大型科技及其他安全公司地址，并只在攻击者活动时段开放 C2 端口；IronNet 在乌克兰相关
  Cobalt Strike C2 集群中观察到用于 Nginx redirector 的 profile，并说明只有特定 Beacon 流量被转发而其余流量被导向合法 server。这些材料直接支持独立于路径中继和资源准备的运行时暴露差。


  正式准入必须有隐藏基础设施的后继结果，不能从 CDN/WAF、404、honeypot、geo rule、关闭端口或研究地址被拒单点推断攻击。最低证据链是：受害端或原始事件材料证明 candidate endpoint 支撑 C2；攻击者可控的请求资格、观察者分类或
  exposure policy；在尽量同时间、同 endpoint/protocol 下的响应、origin route、listener state 或连接结果差；以及被排除观察者看不到而合格 implant/受害者仍获得的 C2 结果。普通
  anti-bot、DDoS、地域合规、mTLS/API allowlist、维护窗口和内部管理入口都是强反例。固定 T1665 的代理、ORB、公共云和域名伪装内容由相邻 Niji 技术拥有，不能因为 ATT&CK 父级宽泛而在这里重复。'
rationale_en: 'Retain T1665''s runtime infrastructure-hiding problem, but remove broad proxying, trusted hosting, domain masquerading,
  and resource acquisition and adapt it as Selective C2 Infrastructure Exposure. The actor controls a running C2 front, redirector,
  listener, WAF or CDN rule, or origin so that the infrastructure exposes real C2 only to sessions carrying an implant-qualified
  request, or specifically denies, redirects, serves a benign facade to, or closes service for scanners, researchers, and
  known defensive sources while the victim still completes tasking, result return, payload or configuration retrieval, or
  continuing control. Unit 42 observed C2 maintaining persistent communications with 24 Cambodian government organizations
  while blocking Palo Alto Networks, cloud or VPS, Big Tech, and other security-company ranges and opening C2 ports only during
  actor activity. IronNet observed a profile for an Nginx redirector in a Cobalt Strike C2 cluster tied to attacks on Ukraine
  and explains that only specific Beacon traffic is forwarded while remaining traffic is sent to a legitimate server. These
  materials directly support a runtime exposure differential independent of path relaying and resource preparation.


  Formal admission requires a successor result from the hidden infrastructure and cannot infer attack from a CDN or WAF, a
  404, a honeypot, a geographic rule, a closed port, or rejection of a research address alone. The minimum chain is a candidate
  endpoint established as supporting C2 by victim-side telemetry or original incident evidence; an attacker-controlled request
  qualification, observer classification, or exposure policy; a response, origin-route, listener-state, or connection-result
  differential under a matched endpoint and protocol and as close in time as possible; and a C2 result still obtained by a
  qualified implant or victim while the excluded observer cannot see it. Ordinary anti-bot, DDoS defense, geographic compliance,
  mTLS or API allowlists, maintenance windows, and internal administration entries are strong counterexamples. Proxy, ORB,
  public-cloud, and domain-masquerading material in the fixed T1665 object is owned by adjacent Niji techniques and must not
  be duplicated merely because the ATT&CK parent is broad.'
scope_notes_zh: 要求攻击者控制的前端/监听器产生请求或观察者差分且合格受害端有真实 C2 结果；时窗轴暂缓独立子项。
scope_notes_en: Require an actor-controlled front or listener to create request or observer differentials with a real C2 outcome
  for a qualified victim; defer the temporal-exposure child.
