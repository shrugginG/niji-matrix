research:
  limitations:
    paragraphs:
    - zh: Mandiant 的样本支持可选垃圾字节和解析规则，没有实测该设计在不同 NDR 或代理上的漏报率。所关联的检测分析中的长度、字段和端点关联属于可实施设计，阈值需按真实产品格式与合法可选字段校准；TLS
        不可见时只能保留低置信形态判断。
      en: Mandiant's sample supports optional junk bytes and parser rules but does not measure miss rates across
        NDRs or proxies. The linked length, field, and endpoint joins are an implementable design whose thresholds
        need calibration against real product formats and legitimate optional fields. Opaque TLS leaves only a lower-confidence
        shape judgment.
