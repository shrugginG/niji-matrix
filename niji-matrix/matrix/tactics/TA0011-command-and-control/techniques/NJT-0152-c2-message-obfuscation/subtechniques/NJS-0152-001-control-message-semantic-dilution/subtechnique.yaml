schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0152-001
parent_ref: NJT-0152
name:
  zh: 控制消息有效语义稀释
  en: Control-Message Semantic Dilution
summary:
  zh: 在 C2 帧内掺入接收方可丢弃的数据，改变真实控制字节的长度和位置。
  en: Mix receiver-discarded data into C2 frames, changing the length and position of actual control bytes.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 控制消息有效语义稀释是攻击者让外层 C2 消息包含不参与命令解释的字节、字段或步骤，同时让受控端依照长度、标志或私有规则提取真实任务。直接目的在于让网络检查面看到的整个消息不同于接收方执行的控制内容；填充格式和协议名称只是实现条件。
    en: Control-Message Semantic Dilution makes an outer C2 message include bytes, fields, or steps not consumed
      as commands while the controlled endpoint extracts the real task by length, flags, or private rules. Its immediate
      purpose is to make the message seen by network inspection differ from the control content executed by the
      receiver. Padding format and protocol name are implementation choices.
  - zh: 本子项要求同一交换中可指出外层帧、接收端消费边界和被丢弃部分。单纯压缩、编码或加密并不满足这一判据；即使这些操作与噪声混用，也必须独立证明攻击者控制了无效数据比例或布局。
    en: This child requires a demonstrable outer frame, receiver consumption boundary, and discarded part within
      the same exchange. Compression, encoding, or encryption alone do not meet that test. If combined with noise,
      the attacker-controlled share or placement of inert data still needs separate evidence.
stealth_characteristics:
  paragraphs:
  - zh: 控制消息有效语义稀释使同一命令在原始帧中的长度和字节位置可变，简单签名或固定偏移提取器可能匹配无效片段或误估负载大小。残余痕迹包括声明长度与实际长度的差、重复响应中的可变尾部、无效步骤标志以及消息解析后的端点动作。完整帧与接收端还原逻辑一旦可得，稀释就不再隐藏真实语义。
    en: Control-Message Semantic Dilution varies raw-frame length and byte position for the same command, so a simple
      signature or fixed-offset extractor may match inert fragments or mismeasure payload size. Residual traces
      include declared-versus-actual length, variable tails across responses, inert-step flags, and endpoint actions
      after parsing. Once complete frames and receiver reconstruction logic are available, the dilution no longer
      conceals the real meaning.
  - zh: 这一效果以检查器只消费外层字段或有限签名为前提。拥有协议解析、原始流量留存和进程结果关联的防守方可计算无效/有效字节比，并重构控制循环；仅从高熵、大响应或字段冗余不能认定攻击者在施行匿迹。
    en: The effect assumes an inspector consumes only outer fields or limited signatures. A defender with protocol
      parsing, raw-flow retention, and process-result joins can measure inert-to-effective byte share and reconstruct
      the control loop. High entropy, large responses, or redundant fields alone do not prove adversarial stealth.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入接收方明确忽略的填充字节、伪步骤或非消费字段，且这些元素改变可见 C2 帧与真实任务的关系。SUNBURST 响应中真实长度之后的可选 junk bytes 满足样本级行为条件；对其他样本需重新证明私有提取规则。
    en: Include padding bytes, decoy steps, or unconsumed fields that a receiver explicitly ignores and that alter
      the relationship between visible C2 frame and real task. Optional junk bytes after the true SUNBURST response
      length establish a sample-level instance; other samples require their own parser evidence.
  - zh: 合法协议填充、网络设备补齐、序列化器保留字段和测试数据可呈现相似外观。服务身份仿真归 NJS-0152-002；隐藏在独立图像或文档载体内的提取差属于父级并与 NJT-0115 对照；仅改变编码表示则按 T1132
      研究。
    en: Legitimate protocol padding, network-device padding, reserved serializer fields, and test data can look
      similar. Forged service identity belongs to NJS-0152-002. Extraction from an independent image or document
      carrier stays at parent level and is compared with NJT-0115. Mere recoding is studied under T1132.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 已安装植入在与远端控制端交换任务时，可能为同一命令生成长度不同的响应或在产品遥测结构中加入不消费的步骤，以降低固定载荷签名在代理或 NDR 中的稳定性。SUNBURST 提供可复核的长度字段与可选垃圾字节实例。
      en: An installed implant exchanging tasks with a remote controller may generate different-length responses
        for the same command or add unconsumed steps inside telemetry-shaped structures, weakening fixed payload
        signatures at a proxy or NDR. SUNBURST provides a reproducible true-length and optional-junk-byte instance.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制消息生成器和接收端解析器，知道哪些字段会被丢弃，并能承担更大的带宽和解析复杂度。严格格式限制、代理重写或版本不匹配可能损坏伪步骤，导致命令失败并留下异常响应。
        en: The attacker must control message generation and receiver parsing, know which fields will be discarded,
          and absorb extra bandwidth and parsing complexity. Strict format constraints, proxy rewriting, or version
          mismatch may break decoy steps, causing command failure and anomalous responses.
    defender_model:
      paragraphs:
      - zh: 防守方需在合法授权范围内保存请求与响应长度、原始帧、解析状态和端点进程身份。只有流量摘要时可发现形态变化，但不能声称恢复了隐藏命令；若能把声明长度、未消费字段和执行结果连接，就能确定哪部分内容实际驱动控制。
        en: The defender needs authorized retention of request and response lengths, raw frames, parse status, and
          endpoint process identity. Flow summaries alone may reveal shape changes but cannot establish recovery
          of a hidden command. Joining declared length, unconsumed fields, and execution outcome can identify which
          content actually drove control.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 无效字段分散外层帧中的真实控制语义
    en: Inert fields disperse real control meaning within the outer frame
  analysis:
    paragraphs:
    - zh: 发送端将命令与可丢弃数据放入同一帧，接收端依长度或标志取出任务。防守方若把全部帧等同有效负载，就会在签名、大小及命令提取上偏离真实语义；保留原始帧并按接收端规则规范化可以消除该差异。SUNBURST 样本证明这种长度边界与可选尾部确实存在，未证明所有传感器都会误判。
      en: The sender puts commands and discardable data in one frame, and the receiver extracts the task by length
        or flag. A defender treating the whole frame as effective payload can misread signature, size, and command
        extraction; retaining raw frames and normalizing by receiver rules removes that differential. The SUNBURST
        sample proves this length boundary and optional tail exist, not that every sensor misclassifies it.
  evidence_refs:
  - REF-000626
  confidence: high
