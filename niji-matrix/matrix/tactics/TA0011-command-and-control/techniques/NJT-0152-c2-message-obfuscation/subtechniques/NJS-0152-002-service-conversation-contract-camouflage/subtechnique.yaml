schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0152-002
parent_ref: NJT-0152
name:
  zh: 服务会话契约伪装
  en: Service-Conversation Contract Camouflage
summary:
  zh: 使 C2 请求响应呈现为获准软件的服务会话，同时真实目标或控制功能违反该服务契约。
  en: Make C2 request-response traffic appear to be an approved software service while the real destination or control
    function violates that service contract.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 服务会话契约伪装是攻击者让双向 C2 交换借用合法产品的请求路径、字段关系、事件名称、客户端身份与响应形态，从而声称一个并未真实履行的服务角色。其直接目标是让代理或审查员把控制通信归入已允许的产品遥测或维护活动。服务是否真的符合契约，须由软件版本、目的地主体、字段依赖和响应后结果共同判断。
    en: Service-Conversation Contract Camouflage makes a bidirectional C2 exchange borrow a legitimate product's
      request paths, field relationships, event names, client identity, and response shape, thereby claiming a service
      role it does not truly fulfill. The immediate aim is to have proxy rules or analysts classify control traffic
      as allowed telemetry or maintenance. Whether the contract actually holds must be tested across software version,
      destination owner, field dependencies, and post-response outcome.
  - zh: 本子项的单位是会话而非单个报头。SUNBURST 的 OIP 样式 JSON、随机会话标识及步骤对象展示了服务级仿真；只复制 User-Agent 或选择 HTTP 协议不足以证明相同变量。
    en: The unit is a conversation rather than one header. SUNBURST's OIP-shaped JSON, randomized session identifiers,
      and step objects demonstrate service-level emulation; copying only a User-Agent or choosing HTTP does not
      establish the same variable.
stealth_characteristics:
  paragraphs:
  - zh: 服务会话契约伪装把真实任务流放入受信产品的可见模式，让依赖进程信誉、URI 或事件标签的单层分类器降低优先级。仍可观察到与批准目的地不符的连接、字段值间不合逻辑的依赖、异常响应内容以及随后由同一进程产生的执行或下载。攻击者若接入真正受控的供应商端点并完整模拟业务，简单差分的效力会下降。
    en: Service-Conversation Contract Camouflage places task traffic in the visible pattern of a trusted product,
      reducing priority in classifiers keyed only to process reputation, URI, or event label. Connections outside
      approved destinations, inconsistent field dependencies, unusual response content, and subsequent execution
      or download by the same process remain observable. If the attacker uses a genuinely approved endpoint and
      fully models the business exchange, simple differentials lose power.
  - zh: 只有防守方具备版本化服务画像和进程至网络关联时，才能把“貌似遥测”与“真正遥测”作有力区分。没有内容或供应商变更记录时，应报告身份未验证，不能把陌生域名或单个字段直接定为伪装。
    en: A strong distinction between apparent and genuine telemetry requires a versioned service profile and process-to-network
      joins. Without content or vendor-change records, report unverified identity instead of treating an unfamiliar
      domain or one field as proof of camouflage.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者有意复制合法服务的多个交互特征，同时真实控制功能与该服务声明发生可证偏差的 C2 会话。合法产品遥测、供应商代理、区域 CDN 和紧急升级可产生相似流量，必须结合软件来源和变更审批排除。
    en: Include C2 exchanges that intentionally copy multiple interaction features of a legitimate service while
      a provable mismatch remains between actual control function and claimed service. Legitimate product telemetry,
      vendor proxies, regional CDNs, and emergency upgrades can look similar and require software provenance and
      change context.
  - zh: 仅借用应用协议归 T1071，单一客户端指纹仿真应与既有 NJS-0114-004 比对，单纯 JSON 或 XML 内嵌命令属于 T1001 父级并可并列 NJT-0115；服务契约的会话级差异才成立本项。
    en: Use of an application protocol alone belongs to T1071; a single client-fingerprint impersonation is compared
      with existing NJS-0114-004; embedded commands in JSON or XML alone remain at the T1001 parent and may also
      map to NJT-0115. The session-level service-contract differential defines this child.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 一个具有正常出站权的产品进程被植入后，攻击者可让 HTTP 回连外观贴合该产品遥测，使 C2 越过只看进程名或路径的允许规则。SUNBURST 将消息制成类似 SolarWinds OIP 的 JSON，但其远端控制功能仍需由命令恢复与后继动作证明。
      en: After a product process with normal egress is implanted, an actor may shape HTTP callbacks to resemble
        its telemetry, passing allow rules keyed only to process name or path. SUNBURST shaped messages like SolarWinds
        OIP JSON, while its remote-control function still requires command recovery and successor behavior for proof.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需掌握目标产品的服务格式、常见目的地和版本差异，且能控制发送、接收与错误处理。完整伪装需要维持字段之间的约束，错误会暴露于产品升级、供应商端点切换或代理校验。
        en: The attacker needs knowledge of the target product's service format, common destinations, and version
          differences and control over sending, receiving, and error handling. Full emulation must maintain relationships
          among fields, and errors may surface after product upgrades, vendor endpoint changes, or proxy validation.
    defender_model:
      paragraphs:
      - zh: 防守方可从代理、DNS/TLS、软件清单和端点进程得到声明服务、实际目的地、进程身份及后继行为。内容可见时再检验字段依赖与响应形态；仅有五元组时只能提出目的地或进程角色异常，不能断言服务契约已被伪造。
        en: The defender can obtain claimed service, actual destination, process identity, and successor behavior
          from proxy, DNS/TLS, software inventory, and endpoint telemetry. Where content is visible, it can also
          test field dependencies and response shape. Five-tuples alone support destination or process-role anomalies
          but not proof of a forged service contract.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: C2 借用产品遥测外观使服务角色被错认
    en: C2 borrows product-telemetry appearance to misidentify its service role
  analysis:
    paragraphs:
    - zh: 攻击者把控制请求塑造成获准软件的遥测会话，保留常见路径、字段及事件标签，使按外观放行的规则把恶意控制解释为正常服务。真实目的地主体、字段关系和响应后的执行若不符合该软件画像，跨层核对仍可拆穿伪装。SUNBURST
        的 OIP 形态为直接样本证据，但单一字符串相似不等于完整契约被模仿。
      en: The actor shapes control requests as approved software telemetry, retaining familiar paths, fields, and
        event labels so appearance-based allow rules interpret malicious control as routine service. Cross-layer
        checks can expose it when destination owner, field relationships, or post-response execution does not match
        the software profile. SUNBURST's OIP form is direct sample evidence, but one matching string does not prove
        the full contract was copied.
  evidence_refs:
  - REF-000626
  confidence: high
