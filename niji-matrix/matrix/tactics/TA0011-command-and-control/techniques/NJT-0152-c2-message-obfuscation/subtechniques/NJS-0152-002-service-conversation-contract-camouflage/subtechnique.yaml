research:
  limitations:
    paragraphs:
    - zh: 直接资料证明 SUNBURST 样本的 OIP 仿真，但没有给出其通过了哪项具体允许规则，也不能推断所有 SolarWinds 遥测都有相同字段。服务画像、目的地授权和字段约束必须按本地版本验证；攻击者若真正控制批准服务，伪装差分可能不再成立。
      en: Direct reporting proves OIP emulation in SUNBURST but does not identify a particular allow rule it defeated
        or establish identical fields for every SolarWinds telemetry version. Service profiles, destination approvals,
        and field constraints require local version validation. If the actor actually controls an approved service,
        the camouflage differential may disappear.
