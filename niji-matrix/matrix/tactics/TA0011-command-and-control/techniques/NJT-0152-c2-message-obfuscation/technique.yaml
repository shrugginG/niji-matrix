research:
  limitations:
    paragraphs:
    - zh: Mandiant 的 SUNBURST 样本提供可核实的消息填充、结构化载体及遥测外观，但单一案例不能证明这些变换在所有网络或产品中有相同效果。Unit 42 对 RDAT 的 BMP 收发功能有代码级解释，并明确表示未现场观察到
        C2 通过该路径发送入站命令；这项能力不得写成现场事实。
      en: The SUNBURST sample provides verifiable message padding, structured carriers, and telemetry appearance,
        but one case cannot establish the same effect across networks or products. Unit 42 explains RDAT BMP send
        and receive logic at code level while explicitly stating that inbound commands through this path were not
        observed in the field; that capability must not be presented as a field fact.
    - zh: 来源未给出所关联检测分析的灵敏度、误报率或通用阈值。Zeek 文档只证明字段可用，不能证明告警有效；服务画像、内容留存、代理映射和格式解析器必须在本地环境测试。TLS 或邮件内容不可见时，外层形态异常最多支持较低置信的候选判断。
      en: The sources give no sensitivity, false-positive rate, or universal threshold for the linked analytics.
        Zeek documentation establishes field availability, not alert effectiveness; service profiles, content retention,
        proxy mapping, and format parsers require local testing. Where TLS or mail content is opaque, outer-shape
        anomaly supports only a lower-confidence candidate finding.
