schema_version: 2.0.0
type: technique
id: NJT-0152
name:
  zh: 命令控制消息混淆
  en: C2 Message Obfuscation
summary:
  zh: 攻击者改变命令控制消息的可见形态、载体或服务语义，使真实指令或控制目的难以从常规通信观察中辨认。
  en: Adversaries change the visible form, carrier, or service semantics of command-and-control messages so routine
    communication observation is less able to reveal the actual commands or control purpose.
aliases: []
classification:
  tactic_refs:
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1001
    source_attack_version: '19.1'
  decision_ref: DEC-TA0011-T1001
definition_and_concept:
  paragraphs:
  - zh: 本技术指攻击者在已建立或正在建立的 C2 通信中，刻意让防守传感器所见消息与接收端实际解析的控制语义分离。它可以改变帧中的有效与无效字节比例、把命令嵌入可独立解析的良性载体，或让整段请求与响应呈现为某项预期服务。直接目的不是建立通道，而是让已经存在的控制交换不易被内容检查、协议分类或基线审计识别。
    en: This technique covers deliberate separation between the message seen by a defender sensor and the control
      semantics parsed by the receiver in an established or establishing C2 exchange. The actor may alter the ratio
      of meaningful to inert bytes in a frame, embed commands in an independently parseable benign carrier, or make
      the request-response conversation resemble an expected service. Its direct purpose is to reduce recognition
      of an existing control exchange by content inspection, protocol classification, or baseline audit, rather
      than to establish the channel itself.
  - zh: 判定必须连接具体通信行为、攻击者控制的变换或伪装以及接收端的提取或后继命令执行。孤立的 JSON、图像、Base64、TLS、压缩或高熵不构成本项；合法遥测、媒体邮件、测试流量和私密通信也可能具有相似外观。研究时须同时保存原始流量与还原后的消息/结果，不能把某种格式名称当作匿迹机理。
    en: Classification requires a link among a concrete communication, an actor-controlled transformation or disguise,
      and receiver-side extraction or subsequent command execution. JSON, images, Base64, TLS, compression, or high
      entropy alone do not establish this technique; legitimate telemetry, media mail, testing traffic, and private
      communication can look similar. Research should preserve both raw traffic and recovered messages or outcomes,
      rather than treating a format name as a stealth mechanism.
stealth_characteristics:
  paragraphs:
  - zh: 噪声会移动稳定特征和消息长度，载体嵌入会让外层解析器得到貌似无害的 XML、JSON 或图像，服务仿真会使请求路径、字段、客户端标识或时序贴近批准业务。其共同效果是降低单条流量在默认解析层上的可疑程度，而不是消除痕迹。帧长分布、无效字段比例、原始与重编码载体差异、外层字段的功能关系、进程身份、目的地主体和命令后的端点结果仍可恢复偏差。
    en: Noise moves stable signatures and message lengths; carrier embedding lets an outer parser see apparently
      harmless XML, JSON, or images; service emulation aligns paths, fields, client identity, or timing with an
      approved application. Their common effect is to reduce the apparent suspiciousness of individual traffic at
      the default parse layer, not to erase traces. Frame-length distribution, inert-field proportion, differences
      between raw and re-encoded carriers, functional relationships among outer fields, process identity, destination
      ownership, and endpoint outcomes after a command remain available for investigation.
  - zh: 防守观察效果取决于可见层。只有五元组或未解密 TLS 时通常只能提出流量形态异常；能够取得 HTTP 内容、附件和端点关联时，才可验证载体与服务语义差异。SUNBURST 的 OIP 外观与真实 SolarWinds
      软件进程共存，说明仅凭可信进程名或相似 User-Agent 不能排除恶意，需将服务许可的目的地、消息字段关系和后继执行共同校验。
    en: The defender effect depends on observation depth. Five-tuples or opaque TLS alone normally support only
      traffic-shape suspicion; access to HTTP content, attachments, and endpoint correlation permits tests of carrier
      and service-semantic differences. SUNBURST combined an OIP appearance with a real SolarWinds process context,
      showing that a trusted process name or similar User-Agent cannot rule out abuse; allowed destination, field
      relationships, and successor execution must be checked together.
scope_boundary_definition:
  paragraphs:
  - zh: T1132 负责把数据编码到另一表示，T1573 负责以密码变换保护通信；单独 Base64、XOR 或 TLS 不满足本技术。只有额外的无意义字段、伪装载体或伪造服务契约改变防守方对 C2 的观察时，才记为
      T1001。T1071 按实际承载的应用协议划分，HTTP 或邮件的使用本身不等于混淆；T1572 关注把一种协议会话封装在另一通道中以穿越边界，若只是消息外观仿真而无内层协议会话，不归隧道。
    en: T1132 owns recoding data into another representation and T1573 owns cryptographic protection of communication;
      Base64, XOR, or TLS alone does not meet this technique. T1001 applies when additional inert fields, a deceptive
      carrier, or a forged service contract changes defenders' observation of C2. T1071 describes the application
      protocol actually carrying traffic, so HTTP or mail use by itself is not obfuscation. T1572 describes an inner
      protocol session encapsulated in another channel to cross a boundary; a message that merely looks like a service
      without an inner protocol session is not tunneling.
  - zh: 与 TA0005 NJT-0115 的交集按研究对象处理：静态代码、下载载荷和一般工件即使藏在图像中仍归该技术；用于持续收发指令的图像、JSON 或邮件消息还可作为本技术的 C2 证据。若正式子项只重复 NJT-0115
      的内外摘要谱系或 NJT-0114 的 User-Agent 模仿，主 Agent 应拆除该子项并复用既有对象；只有会话层检测分工明确且有独立证据时才建立新的 NJS。
    en: 'Resolve overlap with TA0005 NJT-0115 by analytic subject: static code, downloaded payloads, and general
      artifacts remain there even when hidden in images, while images, JSON, or mail messages used for ongoing command
      exchange also provide C2 evidence here. If a proposed child only repeats NJT-0115''s outer-to-inner digest
      lineage or NJT-0114''s User-Agent imitation, the primary agent should remove that child and reuse existing
      objects; create a new NJS only when a conversation-level detection role and independent evidence are clear.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在有互联网出口但进行网络内容审查的受害环境，后门可在正常 HTTP 请求中加入噪声，并把命令拼入 XML 的 GUID 字段或使用貌似产品遥测的 JSON 交换。另一个场景是已能访问组织邮箱的植入体借 EWS
        收发附带 BMP 的邮件，在图像像素中藏入命令或结果；邮件服务在此是通信媒介，像素内外语义差才是本技术的匿迹点。
      en: In a victim environment with Internet egress and network-content inspection, an implant may add noise
        to ordinary HTTP requests, assemble commands from GUID fields in XML, or exchange JSON resembling product
        telemetry. In another scenario, an implant with access to an organizational mailbox may use EWS to send
        and receive BMP attachments that hide commands or results in pixel values. Mail is the transport in that
        example; the semantic differential between the image and embedded data is the stealth feature examined here.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制至少一端 C2 生成与另一端解析逻辑，或掌握能让现有客户端读取隐藏字段的格式；服务仿真还要求了解目标软件正常请求、允许的出口和校验规则。增加噪声与复杂载体会消耗带宽、增大解析失败和格式损坏风险，且容易在样本与实际业务之间留下可比较的异常。
        en: The actor needs control of at least one C2 message generator and the corresponding parser, or a format
          the existing client can read for hidden fields. Service emulation also requires knowledge of normal application
          requests, permitted egress, and validation rules. Noise and complex carriers consume bandwidth, increase
          parser and format-failure risk, and may leave anomalies visible when samples are compared with genuine
          business traffic.
    defender_model:
      paragraphs:
      - zh: 防守方假定可从代理、NDR 或邮件审计获得会话时间、源目的、HTTP 方法与主机/路径、请求响应长度、附件或文件标识，并在部分主机上把流量连接到进程、软件安装清单和后继执行。若能依法取得内容，可重建载体结构和服务字段约束；若
          TLS 未解密、邮件加密、CDN 或代理汇聚隐藏真实目的地，结论只能降低为形态或来源异常，不能声称已看到隐藏命令。
        en: The defender is assumed to obtain session time, endpoints, HTTP method and host/path, request-response
          lengths, attachment or file IDs from a proxy, NDR, or mail audit, and to join some traffic to process,
          installed-product inventory, and successor execution. Where content is lawfully available, carrier structure
          and service-field constraints can be reconstructed. With opaque TLS, encrypted mail, or a CDN or proxy
          that hides the final destination, the conclusion must be limited to shape or provenance anomaly, not a
          claim that hidden commands were observed.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 外层通信内容隐藏实际控制语义
    en: Outer communication content conceals actual control semantics
  analysis:
    paragraphs:
    - zh: 攻击者将控制字节分散在图像像素、XML GUID 或貌似遥测的 JSON 字段中，并让植入体按专用规则复原；默认解析层只得到图像或业务数据，真实指令须经过提取才能出现。因此可见痕迹与控制语义分离，形成数据遮蔽。RDAT
        的 BMP 与 SUNBURST 的 XML/JSON 为不同承载实现，均要求防守保留外层与内层的因果链。
      en: The actor distributes control bytes across image pixels, XML GUIDs, or telemetry-like JSON fields and
        has the implant reconstruct them by private rules. A default parser sees an image or business data, while
        the command appears only after extraction. This separates visible traces from control semantics and yields
        Data Obscuration. RDAT BMP and SUNBURST XML/JSON are different carrier implementations but each requires
        defenders to retain the outer-to-inner causal chain.
  evidence_refs:
  - REF-000626
  - REF-000627
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 伪造服务外观改变流量归类
    en: Forged service appearance changes traffic classification
  analysis:
    paragraphs:
    - zh: 攻击者让 C2 请求复制正常软件的遥测形态、字段和会话上下文，使只看外层标签的防守规则把流量归入允许服务；真实目的地或字段内容与批准服务不一致时，跨层核对又能识别差异。这是服务角色的特征伪装，不能从单一
        User-Agent 推出完整仿真成功。
      en: The actor copies a legitimate application's telemetry shape, fields, and conversation context into C2
        requests, causing rules that only inspect outer labels to classify them as allowed service traffic. Cross-layer
        checks reveal differences when destination ownership or field contents diverge from the approved service.
        This is service-role Feature Disguise; a single User-Agent does not prove complete emulation succeeded.
  evidence_refs:
  - REF-000626
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两项正式子技术按 C2 消息的两个不同可控变量划分：控制消息有效语义稀释改变真实控制字节相对于外层帧的比例和位置，需要帧级规范化；服务会话契约伪装改变整段请求响应所声称的产品服务角色，需要进程、目的地主体与字段约束核对。两者可同时发生，但单独修复任一观察差不会自动修复另一项。
      en: Two formal children use different attacker-controlled C2-message variables. Control-Message Semantic Dilution
        changes the share and position of real control bytes inside the outer frame and requires frame-level normalization.
        Service-Conversation Contract Camouflage changes the product-service role claimed by a request-response
        exchange and requires process, destination-owner, and field-constraint checks. They can coexist, but correcting
        one observation differential does not automatically correct the other.
    - zh: BMP、XML 和 JSON 中隐藏命令显示父级仍涵盖控制语义载体分离；其内外提取变量已与 TA0005/NJS-0115-003 高度重合，因此不另建同义子项。具体协议、图片格式、User-Agent
        或编码算法不构成这一子技术分类的边界。
      en: Commands hidden in BMP, XML, and JSON show that the parent also covers control-semantics carrier separation.
        Its outer-to-inner extraction variable strongly overlaps TA0005/NJS-0115-003, so no synonymous child is
        created. Particular protocols, image formats, User-Agents, and encoding algorithms do not define this child
        taxonomy.
  coverage: established
  subtechnique_refs:
  - NJS-0152-001
  - NJS-0152-002
