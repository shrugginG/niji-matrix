research:
  limitations:
    paragraphs:
    - zh: 样本分析证明失败条件与备用端点逻辑，没有提供真实防守系统的目的地聚合规则或漏报结果。多端点更新器和灾备服务是强反例，窗口与同进程判断须在本地数据上校准；没有新路径控制结果时仅报告备用路径尝试。
      en: Sample analyses prove failure criteria and reserve-endpoint logic but do not report a defender's actual
        destination aggregation or missed alerts. Multipath updaters and disaster-recovery services are strong counterexamples;
        windows and same-process matching need calibration on local data. Without control outcome on the new path,
        report an attempted reserve route only.
