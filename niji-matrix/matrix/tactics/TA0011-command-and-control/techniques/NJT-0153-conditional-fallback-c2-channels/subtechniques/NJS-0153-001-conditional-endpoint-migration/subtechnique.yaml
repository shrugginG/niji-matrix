schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0153-001
parent_ref: NJT-0153
name:
  zh: 条件式端点迁移
  en: Conditional Endpoint Migration
summary:
  zh: 首选 C2 端点失效后，同一植入保持协议而转向另一配置端点继续控制。
  en: After preferred C2 endpoint failure, the same implant keeps its transport but moves to another configured
    endpoint to continue control.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 条件式端点迁移是同一植入在首选 C2 域名、地址或服务器不响应或被拒绝后，按预置或受控规则选择另一端点，并在主要通信协议不变的情况下恢复任务交换。直接目标是延续指挥控制；Niji 子项关注端点身份变化如何把一个进程的连续控制过程分拆到不同目的地记录。
    en: Conditional Endpoint Migration occurs when the same implant selects another endpoint after its preferred
      C2 domain, address, or server fails or is denied, then resumes task exchange without changing its main transport.
      The immediate aim is continuity of command and control. This Niji child concerns how endpoint identity change
      splits one process's continuous control across destination records.
  - zh: 备用地址的存在只说明可能性，必须连起旧路径失败、切换决策和新路径上的后继控制。DustySky 的首域健康检查与第二域尝试、TinyTurla 遍历地址列表的样本逻辑支持这一行为，而不是证明任意多域配置都属于匿迹。
    en: The presence of a reserve address establishes only possibility; old-path failure, switch decision, and subsequent
      control on the new path must be connected. DustySky's first-domain health check and second-domain attempt
      and TinyTurla's traversal of an address list support the behavior, not a claim that every multidomain configuration
      is stealth.
stealth_characteristics:
  paragraphs:
  - zh: 条件式端点迁移使按单个域名或 IP 汇总的回连序列在旧端点终止，新端点从低历史量开始，可能短暂降低目的地规则的连续性。旧路径的失败、DNS 查询、同一进程对新端点的连接、相似回连节律和任务结果仍是可关联痕迹。若防守方能跨端点按进程长期汇总，局部稀释不再带来可观匿迹。
    en: Conditional Endpoint Migration ends destination-keyed callback history at the old domain or IP and starts
      the new endpoint with little local history, potentially interrupting continuity in destination rules. Failed
      old-path traffic, DNS lookups, same-process connection to the new endpoint, comparable callback cadence, and
      task outcomes remain joinable traces. Where defenders aggregate by process across destinations for a long
      horizon, local dilution offers little concealment.
  - zh: 端点变化本身不证明低于任何真实阈值；它只提出明确的观察模型：检测器若把目的地作为唯一主键，会丢失一个植入的连续谱系。使用设备和进程启动键、失败连接及后继结果可以检验这个条件。
    en: 'Endpoint change alone does not prove that any real threshold was evaded. It states a testable observation
      model: a detector using destination as its only primary key loses one implant''s continuous lineage. Device
      and process-start keys, failed connections, and successor results can test that condition.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入首选 C2 路径失效后同协议换到备用端点并继续控制的序列。向同一端点重传、正常 DNS 答案轮转、负载均衡、CDN 或获批灾备在缺少攻击者植入与控制结果时不构成本项。
    en: Include sequences where a preferred C2 path fails and the same transport moves to a reserve endpoint with
      continued control. Retransmission to one endpoint, normal DNS-answer rotation, load balancing, CDN, or approved
      disaster recovery do not establish this child without an adversarial implant and control outcome.
  - zh: 协议改变导致主要日志面变化时，以 NJS-0153-002 归类；动态生成地址属于 T1568，代理中继属于 T1090，纯防火墙策略改写属于 NJT-0124。它们可以与失败切换并存，但不能取代端点迁移证据。
    en: When protocol change dominates the log-surface difference, classify under NJS-0153-002. Dynamic address
      generation belongs to T1568, proxy relay to T1090, and firewall-policy rewrite alone to NJT-0124. They may
      co-occur with failover but cannot substitute for endpoint-migration evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 长驻后门在首选域名失联或封锁后仍需接收任务时，可通过预置的第二域名或地址恢复同类 Web 回连。处置团队若只封锁最初的域名，新的路径可能继续存在；DustySky 样本提供明确的失败触发。
      en: A persistent backdoor that loses its preferred domain or encounters a block may resume similar web callbacks
        through a preconfigured second domain or address to receive tasks. Response teams blocking only the first
        domain may leave the new route active; the DustySky sample provides an explicit failure trigger.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需在植入内保存可用的备用端点和响应判据，维护后端对同一植入的识别，并使新目的地能从目标网络到达。切换可能产生超时、健康检查及新解析，备用基础设施失联会让恢复失败。
        en: The attacker needs usable reserve endpoints and response criteria in the implant, backend recognition
          of the same implant, and reachability of the new destination from the victim network. Switching can produce
          timeouts, health checks, and new resolution; unavailable reserve infrastructure causes recovery to fail.
    defender_model:
      paragraphs:
      - zh: 防守方需保留允许与拒绝连接、DNS 解析、端点进程身份和批准故障切换目录，覆盖至少一个正常回连周期。进程重启、代理或 NAT 可能断开强关联键；这时只能做设备级推断，需借实际命令或持续回连提高确定性。
        en: The defender needs allowed and denied connections, DNS resolution, endpoint process identity, and an
          approved failover catalog spanning at least one normal callback period. Process restarts, proxies, or
          NAT may break strong join keys; then only device-level inference is possible until actual commands or
          sustained callback improve confidence.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 失败后把同一植入的回连分散到不同目的地
    en: After failure, distribute one implant’s callbacks across destinations
  analysis:
    paragraphs:
    - zh: 植入先向原端点发出健康检查或连接，失败后把任务交换移到备用端点；按目的地分组的防守方看到两个较短序列而非一个完整控制过程。相同进程身份、失败结果、后继连接和控制节律可把它们重组。DustySky 与 TinyTurla
        直接证明切换逻辑，低于告警阈值只在具体检测窗口内成立。
      en: The implant health-checks or connects to the old endpoint, then moves task exchange to a reserve endpoint
        after failure. A destination-keyed defender sees two shorter sequences rather than one continuous control
        operation. Same-process identity, failure result, successor connection, and control cadence can reassemble
        them. DustySky and TinyTurla directly establish switch logic; falling below an alert threshold is conditional
        on a particular detector window.
