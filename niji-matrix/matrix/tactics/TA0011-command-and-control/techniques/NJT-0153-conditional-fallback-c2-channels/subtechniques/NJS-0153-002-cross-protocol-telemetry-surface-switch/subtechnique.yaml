schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0153-002
parent_ref: NJT-0153
name:
  zh: 跨协议遥测面切换
  en: Cross-Protocol Telemetry-Surface Switch
summary:
  zh: 原 Web 控制路径失败后，同一植入改用 DNS 等另一协议继续任务交换，跨越单一日志面。
  en: After a web control path fails, the same implant uses another protocol such as DNS for task exchange, crossing
    a single log surface.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨协议遥测面切换是植入在既有 C2 协议路径失败后，按预设条件改用另一协议承载后继任务与结果，使同一控制活动跨越不同传感器和日志类别。QUADAGENT 的 HTTPS、HTTP、DNS 顺序与 ISMAgent
      的 HTTP 后备 DNS 展示了失败触发的协议迁移；协议名称只是被观察面，切换条件和任务连续性才构成子项。
    en: Cross-Protocol Telemetry-Surface Switch occurs when an implant uses another protocol for later tasks and
      results after its original C2 protocol path fails, moving one control operation across sensors and log classes.
      QUADAGENT's HTTPS, HTTP, DNS order and ISMAgent's HTTP-to-DNS backup show failure-triggered migration. Protocol
      names are observation surfaces; the switch condition and task continuity define the child.
  - zh: 直接目标仍是维持远端控制。只有 Web 错误、DNS 查询及同一植入后继控制彼此关联时，才能把该序列称为备用控制；孤立 DNS 隧道或同时存在两种协议并不足以证明失败切换。
    en: The direct goal remains continued remote control. Only when web failure, DNS queries, and successor control
      from the same implant are linked can the sequence be called fallback control. Isolated DNS tunneling or simultaneous
      use of two protocols does not prove failure-driven switching.
stealth_characteristics:
  paragraphs:
  - zh: 跨协议遥测面切换让 Web 代理的会话在失败后终止，而 DNS 解析日志或其他协议面开始出现任务样式流量。若组织只保留代理记录或两个日志面使用不同身份键，连续攻击会被读作故障和无关解析。失败 Web 请求、进程
      DNS 事件、重复查询响应结构和任务后端点动作仍留下可重组证据。
    en: Cross-Protocol Telemetry-Surface Switch ends the proxy-visible web conversation after failure while task-like
      traffic begins in DNS resolution logs or another protocol surface. An organization retaining only proxy records
      or using different identity keys across logs may read one continuing attack as a fault followed by unrelated
      resolution. Failed web requests, process DNS events, repeated query-response structure, and post-task endpoint
      actions remain reconstructable evidence.
  - zh: 这一匿迹特性依赖实际采集缺口：同时保留代理、DNS 和端点日志并能按进程关联时，跨面切换反而增加异常对照。仅看到长域名、NXDOMAIN 或 DNS 高流量时不得推断控制语义，尤其要区分正常服务发现和 CDN
      行为。
    en: The concealment depends on an actual collection gap. If proxy, DNS, and endpoint logs are retained and joined
      by process, crossing surfaces may instead create a stronger anomaly differential. Long domain names, NXDOMAIN,
      or high DNS volume alone do not establish control semantics, especially amid legitimate service discovery
      and CDN behavior.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入原协议失败或受控触发、同一植入切至另一协议以及后继控制三者可证的序列。若仅更换域名但协议与日志类别不变，归 NJS-0153-001；HTTP 与 DNS 自始并行用于不同阶段而非失败后备时，审查 T1104。
    en: Include sequences with provable old-protocol failure or controlled trigger, same-implant move to a different
      protocol, and subsequent control. A domain change with unchanged protocol and log class belongs to NJS-0153-001.
      HTTP and DNS used from the outset for distinct stages rather than fallback require review under T1104.
  - zh: 合法浏览器代理故障后的 DNS 恢复、软件升级、CDN 调度和网络诊断均可产生部分相似迹象。DNS 负载编码可并列 T1132，应用协议的选用可并列 T1071；但它们不能代替这里的失败触发与跨观察面连续性。
    en: Legitimate browser DNS recovery after proxy faults, software upgrades, CDN steering, and network diagnostics
      may show parts of this shape. DNS payload encoding may also map to T1132 and application-protocol selection
      to T1071; neither substitutes for the failure trigger and cross-surface continuity here.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 植入的 Web 回连被阻断或无法取得响应后，预先实现的 DNS 后备路径可继续传递任务。QUADAGENT 与 ISMAgent 的样本给出这种切换；对于使用 Web 代理监控却未把 DNS 日志接入相同分析链的网络，这是一个需要专门核查的盲点。
      en: After an implant's web callback is blocked or fails to obtain a response, a prebuilt DNS backup can continue
        carrying tasks. QUADAGENT and ISMAgent samples demonstrate the switch. In a network monitoring web proxy
        traffic but not joining DNS logs into the same analytic chain, it creates a specific blind spot to investigate.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需在植入和远端同时实现第二协议的编码、认证和任务格式，并使备用协议从目标网络可达。DNS 后备会增加查询数量、标签结构及解析器依赖，若受管解析器阻断或记录完整，攻击者须承担更多暴露与维护成本。
        en: The attacker needs second-protocol encoding, authentication, and task formats in both implant and remote
          endpoint and reachability from the target network. DNS backup increases query volume, label structure,
          and resolver dependency; a managed resolver that blocks or logs comprehensively imposes added exposure
          and maintenance cost.
    defender_model:
      paragraphs:
      - zh: 防守方需保留失败 Web 会话、DNS 查询与响应、端点进程网络事件和时间同步，最好以进程启动键关联。加密 DNS、递归器聚合和短保留会切断链条；若只能按设备关联，应下调置信度并寻找可解释的任务结果。
        en: The defender needs failed web sessions, DNS queries and responses, endpoint process network events,
          and synchronized clocks, preferably joined by process-start key. Encrypted DNS, recursive aggregation,
          and short retention break the chain. With only device-level joins, confidence should fall and an interpretable
          task result should be sought.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 原协议失败后控制活动移出单一传感器视野
    en: After original-protocol failure, control moves outside one sensor’s view
  analysis:
    paragraphs:
    - zh: 植入把原 Web 路径失败作为切换条件，随后让任务通过 DNS 等另一个协议面流动；只消费代理日志的检测逻辑失去后继片段，形成有条件的行为透明。相同进程的 HTTP 错误、DNS 查询和结果动作可消除盲区。QUADAGENT
        与 ISMAgent 支持切换事实，具体部署是否确有单面监控缺口仍需测量。
      en: The implant uses failure of its web path as a switch condition and sends later tasks through another protocol
        surface such as DNS. A detector consuming proxy logs alone loses later fragments, creating conditional Behavioral
        Transparency. HTTP error, DNS query, and result action from the same process can close the gap. QUADAGENT
        and ISMAgent support the switch; whether a deployment actually has a single-surface monitoring gap requires
        measurement.
