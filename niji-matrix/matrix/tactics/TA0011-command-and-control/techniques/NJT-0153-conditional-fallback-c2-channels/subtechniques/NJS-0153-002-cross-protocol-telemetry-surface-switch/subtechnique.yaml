research:
  limitations:
    paragraphs:
    - zh: 样本证据显示 Web 至 DNS 切换设计，不显示受害组织的采集范围、检测阈值或实际告警结果。所关联的跨日志检测分析是可实施方案，仍需验证 DNS 字段、ProcessGuid 覆盖和代理失败记录；无法恢复
        DNS 任务时只能标为后备路径候选。
      en: Sample evidence shows web-to-DNS switch design but not the victim organization's collection scope, detection
        thresholds, or actual alerts. The cross-log analytic is implementable but requires validation of DNS fields,
        ProcessGuid coverage, and proxy-failure records. If DNS tasks cannot be recovered, retain a reserve-path
        candidate conclusion.
