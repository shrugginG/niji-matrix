research:
  limitations:
    paragraphs:
    - zh: 直接样本证据证明了备用路径的实现与切换条件，但未提供防守方真实监控布局、告警阈值、流量基线或处置后的逐端点效果。因此，目的地计数被拆分、Web 规则遗漏 DNS 后继活动等匿迹结论都以观察边界为前提，应在具体环境中复测。特别是
        QUADAGENT 的 DNS 仍有可见查询，TinyTurla 的新连接仍可由进程级日志关联。
      en: Direct sample evidence establishes reserve paths and switch conditions but does not provide a defender's
        actual sensor layout, alert thresholds, traffic baseline, or per-endpoint postresponse outcomes. Stealth
        conclusions about split destination counters or web rules missing later DNS activity therefore depend on
        an observation boundary and require local validation. QUADAGENT's DNS queries remain visible, and TinyTurla's
        new connections remain joinable through process telemetry.
    - zh: 拥塞、CDN 调度、合法灾备、代理配置和更新器镜像切换可产生相似失败序列；多个域名、端口或 DNS 查询本身不能判别攻击。检测窗口与阈值只是工程起点，需按当地日志质量与服务目录校准。可信服务、长延时和 DGA
        触发模式的独立匿迹差异仍缺少充分证据，不能据此扩张子技术边界。
      en: Congestion, CDN steering, legitimate disaster recovery, proxy configuration, and updater mirrors can produce
        similar failure sequences; multiple domains, ports, or DNS queries cannot classify an attack by themselves.
        Detection windows and thresholds are engineering starting points requiring calibration to local log quality
        and service catalogs. Trusted-service, long-delay, and DGA-triggered patterns lack sufficient evidence for
        independent stealth differences and cannot expand the child boundary yet.
