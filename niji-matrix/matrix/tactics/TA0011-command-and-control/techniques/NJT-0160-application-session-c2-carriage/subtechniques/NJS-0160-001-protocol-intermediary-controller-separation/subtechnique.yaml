research:
  limitations:
    paragraphs:
    - zh: 两个原始 MQTT 案例确证 broker 分离控制端，但并未测量任一具体防守网络的告警遗漏率；Wekby 案例中的 DNS 问题名和 TXT 数据仍可能可见。邮件基础设施可能保留完整发件人与消息 ID，不应假设每种中介都隐匿操作者。外部
        broker 无日志共享时，提出的跨两侧关联分析不能完整实施。
      en: Two original MQTT cases establish controller separation by a broker but do not measure missed-alert rates
        in any specific defender network. DNS question names and TXT data in Wekby can remain visible. Mail infrastructure
        may retain sender and message IDs, so intermediary use cannot be assumed to hide the operator in every case.
        Cross-side correlation cannot be fully implemented when an external broker does not share logs.
