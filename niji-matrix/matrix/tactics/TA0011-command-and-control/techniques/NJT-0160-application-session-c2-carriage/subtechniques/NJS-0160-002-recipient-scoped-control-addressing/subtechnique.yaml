research:
  limitations:
    paragraphs:
    - zh: WailingCrab 的版本差直接支持共享主题覆盖缩减，MQsTTang 支持独立客户端主题，但尚未证明该分区在任何被入侵组织中实际绕过告警。协议允许正常每设备主题，故没有业务设备目录、全量 broker
        审计与后继执行时，随机或唯一主题只能作为调查线索。邮箱或其他队列的同类分区仍需独立样本，不以 MQTT 两例自动推广。
      en: WailingCrab's version change directly supports loss of shared-topic coverage, and MQsTTang supports unique
        client topics, but neither proves the partition bypassed an alert in a particular victim organization. The
        protocol permits legitimate per-device topics, so random or unique topics are leads only without a device
        inventory, complete broker audit, and subsequent execution. Similar partitioning in mailboxes or other queues
        needs independent samples and cannot be generalized automatically from two MQTT cases.
