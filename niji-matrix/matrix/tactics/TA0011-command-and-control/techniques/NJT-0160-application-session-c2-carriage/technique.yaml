schema_version: 2.0.0
type: technique
id: NJT-0160
name:
  zh: 应用会话承载指挥控制
  en: Application-Session C2 Carriage
summary:
  zh: 攻击者利用可达的应用协议会话交换命令及结果，并通过会话方向或协议中介改变防守方可见的控制关系。
  en: An adversary exchanges commands and results through reachable application-protocol sessions while session
    direction or protocol mediation changes the control relationship visible to defenders.
aliases: []
classification:
  tactic_refs:
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1071
    source_attack_version: '19.1'
  decision_ref: DEC-TA0011-T1071
definition_and_concept:
  paragraphs:
  - zh: 应用会话承载指挥控制指植入体和控制端按实际应用协议的交互规则收发任务、载荷指令或执行结果。受害端可能先发出 Web 请求或 DNS 查询，先连接到消息 broker 并订阅主题，或在邮件客户端可读取的邮箱中处理指令。其直接目的在可到达的应用服务路径上维持双向或分阶段控制，而不是仅把任意字节放在
      80、443 或 53 端口。
    en: Application-Session C2 Carriage covers an implant and controller exchanging tasks, payload instructions,
      or execution results according to a real application protocol's interaction rules. The victim may issue a
      web request or DNS query, connect to a message broker and subscribe to a topic, or process instructions in
      a mailbox accessible to a mail client. Its direct purpose is continuing bidirectional or staged control on
      a reachable application-service path, rather than merely placing arbitrary bytes on ports 80, 443, or 53.
  - zh: 本概念的匿迹成立条件是应用层交换改变了防守方通常能看到的关系。受害主机只连到递归解析器或消息 broker 时，单凭五元组不能还原后端控制者；控制消息借受害端已建立的会话进入时，单纯筛查外部主动入站连接也会遗漏。需要把协议事务、进程或设备身份、消息方向和后继命令执行结合起来，才可从普通服务流量中判别
      C2。
    en: Stealth in this concept requires the application exchange to change a relationship normally visible to a
      defender. When a victim contacts only a recursive resolver or message broker, a five-tuple alone cannot reconstruct
      the back-end controller. When commands arrive through a victim-established session, checks limited to unsolicited
      inbound connections also miss them. Protocol transactions must be joined to process or device identity, message
      direction, and subsequent command execution to distinguish C2 from normal service traffic.
stealth_characteristics:
  paragraphs:
  - zh: 应用协议会产生真实而非伪造的请求、回复、订阅、发布或邮件投递记录，因此外层协议验证可以通过。其可控变量是会话由谁建立、控制者是否经协议中介分离、收件或主题地址是否按受害者分区。WailingCrab 的公共
      broker 使受害端连接到 broker 而非操作者，后续从共享活动主题转为每客户端主题又削弱了只监视共享主题的关联能力；MQsTTang 独立显示了控制端和植入体通过不同主题交换命令与结果。
    en: Application protocols produce real requests, replies, subscriptions, publications, or mail deliveries, so
      outer protocol validation may pass. The controllable variables are who establishes the session, whether the
      controller is separated by a protocol intermediary, and whether recipient or topic addresses are partitioned
      by victim. WailingCrab's public broker puts the victim in contact with the broker rather than the operator,
      and its later move from a shared campaign topic to per-client topics weakens correlation that watches only
      the shared topic. Independently, MQsTTang shows a controller and implant exchanging commands and results over
      different topics.
  - zh: 匿迹并不意味着无线索。DNS 问题名、类型和答案、Web 请求路径、邮件消息 ID 与附件、broker 的客户端 ID 和主题、以及端点上的进程和执行结果可形成残余链。协议默认允许的环境与监测位置决定收益：在不使用
      MQTT 的办公网，新的 broker 连接反而显眼；受管解析器记录完整问题名时，DNS 中介只隐藏直连 IP，不能隐藏可疑域名或负载形态。
    en: Stealth does not remove evidence. DNS question names, types, and answers; web paths; mail message IDs and
      attachments; broker client IDs and topics; and endpoint processes and execution outcomes leave a residual
      chain. Benefit depends on which protocols are allowed and where sensors sit. A new broker connection can stand
      out in an office network with no MQTT use. A managed resolver that records full question names leaves suspicious
      domains and payload shapes visible even though the victim does not connect directly to an authoritative server
      IP.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入需要同时证明实际应用协议事务、持续或可重复的控制任务/结果关系，以及该事务如何改变防守观察。仅以 curl 或 FTP 下载一次可执行文件属于交付或暂存；只有文件被周期性读作命令队列并据此执行，才进入本项。仅把原始
      TCP 包放在常见端口而不遵循应用语义应归 T1095；将完整内层协议会话封装在外层协议以跨越边界应另评 T1572。
    en: Inclusion requires a real application-protocol transaction, a continuing or repeatable task-and-result relationship,
      and an explanation of how that transaction changes defender observation. A single executable fetched by curl
      or FTP is delivery or staging; a file periodically read as a command queue and acted upon may qualify. Raw
      TCP placed on a common port without application semantics belongs with T1095, while encapsulation of an intact
      inner protocol session across a boundary calls for separate T1572 analysis.
  - zh: T1102 以滥用现成外部 Web 服务及其资源为中心，本项以应用协议事务和中介路由关系为中心；公共 MQTT broker 同时满足两者时可并列标注，不能以服务信誉作为本项子技术定义。NJT-0152 负责命令字节在图像、JSON、PDF
      或服务字段内的表征与伪装；T1132/T1573 分别负责编码与密码保护；NJT-0153 负责在失败条件后换目的地或协议。正常浏览、解析、邮件、文件传输及 IoT 遥测是必须用进程、授权服务和后继执行排除的反例。
    en: T1102 centers on an existing external Web service and its resources; this object centers on application
      transactions and protocol routing relationships. A public MQTT broker can satisfy both, but service reputation
      cannot define this object's child taxonomy. NJT-0152 owns representation or disguise of command bytes inside
      images, JSON, PDFs, or service fields; T1132 and T1573 own encoding and cryptographic protection; NJT-0153
      owns destination or protocol changes after failure conditions. Normal browsing, resolution, mail, file transfer,
      and IoT telemetry are counterexamples that must be excluded using process identity, approved service context,
      and subsequent execution.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在只允许受管 DNS 出口的环境中，植入体可向攻击者控制的域发送查询，并从 TXT 答案取得任务；Wekby pisloader 的样本逻辑和研究者搭建的模拟 DNS 服务器展示了这种往返。若环境允许消息
        broker，植入体可向 broker 发布登记或结果并订阅接收任务的主题；IBM 的 WailingCrab 分析和 ESET 的 MQsTTang 分析说明了不同的主题结构与后继执行。Turla 的 Outlook
        案例表明邮件客户端及其邮箱也可承载控制，但其 PDF 内隐藏命令应并行交由 NJT-0152 分析。
      en: In an environment limited to managed DNS egress, an implant may query an actor-controlled domain and obtain
        tasks from TXT answers; Wekby pisloader sample logic and a researcher-built DNS server demonstrate the round
        trip. Where a message broker is reachable, an implant can publish registration or results to the broker
        and subscribe to a task topic; IBM's WailingCrab and ESET's MQsTTang analyses show different topic structures
        and subsequent execution. Turla's Outlook case shows that a mail client and mailbox can also carry control,
        while concealed commands in its PDFs should be analyzed concurrently under NJT-0152.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制植入体的协议客户端行为及可下发任务的一侧，并掌握目标环境至少一条可达应用服务路径。DNS 需要受控域及可返回指定记录的权威端；broker 模式需要可发布和订阅相应主题的账户或匿名权限，并协调植入与控制端的主题标识；邮件模式需要可投递或读取目标邮箱的路径。所选中介若实施鉴权、主题
          ACL、速率约束或日志留存，会提高攻击成本并留下可核查记录。
        en: The actor must control the implant's protocol-client behavior and a tasking endpoint, with at least
          one reachable application-service path in the target environment. DNS needs an actor-controlled domain
          and authoritative responses; broker operation needs accounts or anonymous permission to publish and subscribe
          to matching topics and a way to coordinate their identifiers; mail needs a route for delivery to or reading
          from a target mailbox. Intermediary authentication, topic ACLs, rate limits, and retained logs raise cost
          and create reviewable records.
    defender_model:
      paragraphs:
      - zh: 防守方可能有端点进程与网络连接事件、Zeek DNS/HTTP/连接日志，以及自营解析器、邮件平台或 broker 的事务日志。能把设备和进程映射到 DNS 问题、邮件项目或 broker 客户端/主题，并追踪响应后的子进程与文件变化时，可以重建命令谱系。只有流量五元组、外部公共
          broker 不共享日志、TLS 未解密或被劫持的合法进程时，结论分别限于路径异常、关联猜测或需结合主机取证；不得声称已见操作者身份或命令内容。
        en: A defender may have endpoint process and network events, Zeek DNS, HTTP, and connection logs, and transaction
          logs from managed resolvers, mail platforms, or brokers. Joining devices and processes to DNS questions,
          mail items, or broker clients and topics, then tracing child processes and file changes after replies,
          can reconstruct task lineage. With only five-tuples, an external public broker that does not share logs,
          opaque TLS, or a compromised legitimate process, conclusions are limited to route anomalies, tentative
          correlation, or host forensics; the operator's identity or command content must not be claimed.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 应用事务使控制端脱离常规直连观察
    en: Application transactions move the controller beyond direct-link observation
  analysis:
    paragraphs:
    - zh: 攻击者让受害端按真实协议向解析器或 broker 请求、订阅或发布，再由服务返回或转发控制信息。受害端网关看到的是批准或可到达的应用服务，单一连接目的地不能证明真实下令者；只检查外部主动入站连接或直连恶意
        IP 的规则因观察层不足而漏掉控制关系。DNS 完整问题名和 broker 主题仍可保留归属线索，故该机理只在相应监控缺口存在时成立。
      en: The actor has the victim request, subscribe, or publish through a real protocol to a resolver or broker,
        which returns or forwards control information. A victim-side gateway sees a reachable application service,
        and one connection destination cannot identify the actual issuer. Rules limited to unsolicited inbound connections
        or direct malicious IP contact miss the control relationship at that observation layer. Full DNS questions
        and broker topics can still preserve attribution clues, so the mechanism depends on a real monitoring gap.
  evidence_refs:
  - REF-000679
  - REF-000680
  - REF-000682
  - REF-000678
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 按接收者划分的地址拆散共享控制痕迹
    en: Recipient-scoped addresses fragment shared control traces
  analysis:
    paragraphs:
    - zh: 攻击者将原可在共享主题观察的控制流量改为每受害者独立主题，使单一主题订阅和按主题汇总不再看到全部客户端。IBM 报告直接比较了 WailingCrab 前后版本的观察差，ESET 报告则独立描述 MQsTTang
        的唯一客户端主题。痕迹仍在 broker 的主题、客户端和发布订阅记录中，但防守需要跨主题、客户端与进程重建，而不能将一条公共主题当成全体控制活动。
      en: The actor moves activity previously visible on a shared topic to recipient-specific topics, so one topic
        subscription or topic-keyed aggregate no longer sees every client. IBM directly compares observer visibility
        across WailingCrab versions, while ESET independently documents MQsTTang's unique client topic. Broker topic,
        client, and publish-subscribe records retain traces, but defenders must reconstruct across topics, clients,
        and processes rather than treat one public topic as the whole control operation.
  evidence_refs:
  - REF-000679
  - REF-000680
  - REF-000683
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两项匿迹子技术按控制关系而非协议名称划分。协议中介分离控制端改变受害端连接目的地与实际下令者的关系，检测需连接中介两侧事务及端点结果；按接收者分区控制地址改变多个植入是否汇入同一可见逻辑地址，检测需跨主题、客户端和注册标识重建图谱。两者可同现于
        MQTT，但前者在共享主题下仍成立，后者在 broker 身份已知时仍影响单主题覆盖。
      en: Two evasion children are separated by control relationships rather than protocol names. Protocol-Intermediary
        Controller Separation changes the relationship between the destination contacted by the victim and the actual
        issuer, requiring a join across intermediary transactions and endpoint outcomes. Recipient-Scoped Control
        Addressing changes whether several implants share one visible logical address, requiring a graph across
        topics, clients, and registration identifiers. Both can appear in MQTT, but the first exists even with a
        shared topic, while the second limits single-topic coverage even when broker identity is known.
    - zh: 普通受害端先发起会话属于父级连接事实；Web、文件传输、邮件、DNS 和发布订阅仅是实现媒介。消息内容伪装、编码、加密、公共服务资源滥用及失败后的协议切换分别与 NJT-0152、T1132、T1573、T1102
        和 NJT-0153 划界。文件传输中可重复命令队列若无独立原始来源及观察差，不建立子技术。
      en: A victim-originated session alone is parent-level connection behavior. Web, file transfer, mail, DNS,
        and publish-subscribe are implementation media. Message-content disguise, encoding, encryption, public-service
        resource abuse, and post-failure protocol switching remain with NJT-0152, T1132, T1573, T1102, and NJT-0153
        respectively. A repeatable command queue over file transfer does not become a child without independent
        original evidence and an observation differential.
