research:
  limitations:
    paragraphs:
    - zh: 原始样本证明应用协议控制交换与 broker 中介关系，WailingCrab 提供共享主题转私有主题的直接可见性对照，但来源不提供本地出口许可、日志完整度、告警阈值或被规避产品的测量。中介控制端分离和跨主题关联成本均是依赖传感器位置的结论；在没有
        IoT 业务的办公网，MQTT 连接反而可能比常见 Web 会话更显眼。
      en: Original samples establish application-protocol control exchange and broker mediation, and WailingCrab
        provides a direct visibility comparison between shared and private topics. They do not provide local egress
        allowances, log completeness, alert thresholds, or measured evasion of a product. Controller separation
        and cross-topic correlation cost depend on sensor placement; MQTT can stand out more than web traffic in
        an office network without IoT work.
    - zh: Wekby 文章中的命令往返来自模拟 DNS 服务器，Turla Outlook 研究没有取得真实入站命令 PDF；两者只能在各自证据层级使用。Zeek、Sysmon、EMQX Cloud 与 AWS 文档说明可配置字段及措施，不证明告警精度。Sysmon
        Event 3 默认关闭，公共 broker 的发布者事件可能无法取得，递归缓存和加密 DNS 也会改变可见性，因此所述关联窗口须在部署中验证。
      en: The command exchanges in the Wekby article came from a mock DNS server, and Turla Outlook researchers
        obtained no actual inbound command PDF; each must stay within its evidence level. Zeek, Sysmon, EMQX Cloud,
        and AWS documentation establish configurable fields and measures, not alert accuracy. Sysmon Event 3 is
        disabled by default, publisher events from a public broker may be unavailable, and resolver caching or encrypted
        DNS changes visibility, so the stated correlation windows need deployment validation.
