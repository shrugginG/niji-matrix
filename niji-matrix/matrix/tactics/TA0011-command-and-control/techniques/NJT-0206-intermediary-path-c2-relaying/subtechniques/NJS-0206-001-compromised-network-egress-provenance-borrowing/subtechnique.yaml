schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0206-001
parent_ref: NJT-0206
name:
  zh: 被攻陷网络出口归属借用
  en: Compromised-Network Egress Provenance Borrowing
summary:
  zh: 攻击者从被攻陷的住宅、SOHO、企业或边缘设备转发控制流量，使目标把第三方真实网络归属误作操作者来源。
  en: The actor relays control traffic from compromised residential, SOHO, enterprise, or edge devices so the target
    mistakes genuine third-party network provenance for operator origin.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 被攻陷网络出口归属借用是攻击者让已受控的住宅、SOHO、企业或边缘设备实际转发 C2，使目标记录第三方真实网络所有权而非操作者原始位置。直接目标是借用节点的合法归属和正常功能降低来源信誉与地理信号，而非仅取得一个代理地址。
    en: Compromised-Network Egress Provenance Borrowing uses a controlled residential, SOHO, enterprise, or edge device
      to relay C2 so the target records genuine third-party network ownership rather than the operator’s origin. Its
      direct aim is to borrow the node’s legitimate provenance and normal function rather than merely obtain a proxy
      address.
  - zh: 分类变量是第三方资产对最后跳网络归属的真实所有权以及该资产实际产生的 C2 出站。出口池的攻陷、准备和轮换属于资源开发；本子项从首次真实转发及目标侧归属替代开始。
    en: The variable is genuine third-party ownership of last-hop network provenance together with actual C2 egress from
      that asset. Compromise, preparation, and rotation of an egress pool belong to Resource Development; this child
      begins with real forwarding and provenance substitution at the target.
stealth_characteristics:
  paragraphs:
  - zh: 被攻陷网络出口归属借用让目标看到住宅或企业接入网来源，使粗粒度 ASN、国家和点信誉接近正常。资产侧仍留下代理/VPN 模块、管理访问、监听和面向目标的出站流；目标侧还保留客户端指纹、时序和跨出口共同目标。
    en: Compromised-Network Egress Provenance Borrowing makes the target see a residential or enterprise access-network
      origin, making coarse ASN, country, and point-reputation signals look normal. The asset side retains proxy or VPN
      modules, management access, listeners, and target-bound egress; the target retains client fingerprint, timing,
      and common destinations across exits.
  - zh: 匿迹效果依赖目标把网络归属当作信任线索且无法取得节点所有者遥测。跨组织连接最后跳与设备完整性、配置和 flow 可以恢复关系；单个住宅 IP 或本地地理位置不能证明该子项。
    en: The effect depends on the target treating network provenance as trust and lacking node-owner telemetry. Cross-organizational
      joins from last hop to device integrity, configuration, and flow can recover the relationship. One residential
      IP or local geography does not prove this child.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制真实第三方出口并完成可证 C2 转发的活动。排除合法住宅代理、企业 VPN、CGNAT 和只有资源准备而没有目标侧控制结果的节点。一个中介即可成立，不要求出口轮换。
    en: Include activity where an actor controls a genuine third-party egress and completes evidenced C2 relaying. Exclude
      legitimate residential proxies, enterprise VPNs, CGNAT, and resource preparation without a target-side control
      outcome. One intermediary is sufficient; rotation is not required.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Volt Typhoon 等活动可通过被攻陷 SOHO/边缘设备把远程操作流量转发到目标，使目标只见第三方最后跳。防守应把高风险目标会话与节点所有者的代理状态和出站流连接。
      en: Activity such as Volt Typhoon can relay remote-operation traffic through compromised SOHO or edge devices so
        the target sees only a third-party last hop. Defense joins high-risk victim sessions to proxy state and outbound
        flow at the node owner.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需持续控制第三方设备、建立监听或转发配置并维持其正常功能，以避免快速处置。节点离线、固件更新、带宽限制和所有者调查会降低可用性。
        en: The actor needs sustained control of the third-party device, a listener or forwarding configuration, and
          preservation of its normal function to avoid rapid response. Node loss, firmware updates, bandwidth limits,
          and owner investigation reduce viability.
    defender_model:
      paragraphs:
      - zh: 目标可见最后跳、TLS/客户端特征、时间和结果；节点所有者可见管理访问、模块、监听和出站流。可靠判断需要授权的双侧关联，并将商业代理和正常远程支持纳入基线。
        en: The target sees last hop, TLS or client features, timing, and outcome; the node owner sees management access,
          modules, listeners, and outbound flow. Reliable classification needs authorized bilateral correlation and baselines
          for commercial proxies and normal remote support.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实第三方网络归属替代操作者来源
    en: Genuine third-party network provenance substitutes for operator origin
  analysis:
    paragraphs:
    - zh: 攻击者经被攻陷设备转发 C2，目标痕迹从操作者基础设施变为真实住宅或企业接入网。来源信誉和地理规则因此误分类，防守必须恢复设备完整性与双侧流量谱系；节点的异常代理状态和出站关系仍可打破伪装。
      en: The actor relays C2 through a compromised device, changing target traces from actor infrastructure to a genuine
        residential or enterprise access network. Reputation and geography rules can misclassify the source, requiring
        recovery of device integrity and bilateral flow lineage. Anomalous proxy state and outbound relationships can
        still break the disguise.
