research:
  limitations:
    paragraphs:
    - zh: 公开事件支持被攻陷边缘设备用于代理和目标侧真实归属替代，但目标与节点所有者的逐流数据通常不同时公开。不能从住宅来源、EOL 设备或代理模块单独推断 C2。
      en: Public incidents support proxying through compromised edge devices and genuine provenance substitution at targets,
        but victim and node-owner per-flow data are rarely public together. Residential origin, an end-of-life device,
        or a proxy module alone does not establish C2.
