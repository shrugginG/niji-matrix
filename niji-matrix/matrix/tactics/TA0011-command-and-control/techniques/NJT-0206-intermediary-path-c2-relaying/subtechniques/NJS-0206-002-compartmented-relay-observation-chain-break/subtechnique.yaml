schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0206-002
parent_ref: NJT-0206
name:
  zh: 分舱中继观察链断裂
  en: Compartmented-Relay Observation-Chain Break
summary:
  zh: 攻击者用只保留相邻路径关系的中继分割操作者到受害端的观察责任，使任一常规日志域无法独立恢复完整链。
  en: The actor partitions operator-to-victim observation custody across relays that retain only adjacent path relationships
    so no ordinary logging domain independently recovers the full chain.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 分舱中继观察链断裂是攻击者让多级中继只保留前后相邻路径关系，并把操作者到目标的完整观察责任分散到不同节点和管理域。直接目标是使任一常规日志域只能看到局部会话，而不是增加代理数量本身。
    en: Compartmented-Relay Observation-Chain Break has each relay retain only adjacent path relationships and distributes
      complete operator-to-target observation across nodes and administrative domains. Its direct aim is to leave each
      ordinary logging domain with a local session, not merely to increase hop count.
  - zh: 定义变量是端到端路径知识和日志保管的有意分舱。入口、中间、出口和目标可以使用同一逻辑控制会话；如果一个组织完整记录所有中继腿，则活动只属于父级普通转发。
    en: The variable is intentional compartmentation of end-to-end path knowledge and log custody. Entry, middle, exit,
      and target can carry one logical control session. If one organization fully records every relay leg, the activity
      remains ordinary parent-level relaying.
stealth_characteristics:
  paragraphs:
  - zh: 分舱中继观察链断裂把直接连接拆成多个局部会话，目标稳定看到出口，单个中继却不能同时给出完整源与目的。时间、字节、电路和配置痕迹分散在不同辖区；端点代理状态、跨视点流量确认和多节点日志仍可重建部分链。
    en: Compartmented-Relay Observation-Chain Break turns a direct connection into local sessions. The target reliably
      sees the exit, while one relay cannot provide complete source and destination. Timing, byte, circuit, and configuration
      traces are distributed across jurisdictions; endpoint proxy state, multi-vantage flow confirmation, and multi-node
      logs can still reconstruct parts of the chain.
  - zh: 效果随中继运营者、时钟、采样和日志保留而变化。Tor 使用、两个代理或目标只能看到最后跳都不是充分条件；必须证明观察保管确实分布且影响端到端恢复。
    en: The effect varies with relay operators, clocks, sampling, and retention. Tor use, two proxies, or a target seeing
      only the last hop is not sufficient; distributed observation custody and its effect on end-to-end recovery must
      be established.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入跨管理域或等效保管边界的相邻可见中继。排除同一组织内可完整联接的企业代理栈。协议封装归 T1572，失败后换路归 NJT-0153，按功能拆通道归 NJT-0210。
    en: Include relays with adjacency-only visibility across administrative or equivalent custody boundaries. Exclude
      enterprise proxy stacks fully joinable within one organization. Protocol encapsulation belongs to T1572, failure-triggered
      switching to NJT-0153, and functional channel division to NJT-0210.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: APT29 使用 Tor、meek 和隐藏服务时，受害侧、CDN/Tor 中继及操作者侧分别持有不同路径片段。该场景要求跨边界时间、字节和配置关系恢复，而非封禁一个出口地址。
      en: When APT29 used Tor, meek, and a hidden service, the victim, CDN or Tor relays, and operator side held different
        path fragments. The scenario requires cross-boundary timing, byte, and configuration recovery rather than blocking
        one exit address.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需配置或选择具有分舱性质的中继网络，协调密钥、路由和会话，并接受延迟、失效和提供方处置成本。
        en: The actor needs a relay network with compartmented custody, coordinated keys, routing, and sessions, and
          must accept latency, failure, and provider-enforcement costs.
    defender_model:
      paragraphs:
      - zh: 防守方需保留端点代理配置、边界 flow、最后跳情报和稳定时间，并在授权范围内连接多视点。缺少其他中继日志时只能证明局部路径，不能声称恢复操作者。
        en: Defenders need endpoint proxy configuration, boundary flows, last-hop intelligence, and stable time, with
          authorized joins across vantages. Without other relay logs, they can establish only a local path and cannot
          claim operator recovery.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 相邻可见性把完整路径置于单一观察域之外
    en: Adjacency-only visibility places the full path outside one observation domain
  analysis:
    paragraphs:
    - zh: 中继仅记录前一跳和后一跳，完整路径关系被分散到多个管理域。单点分析因此看不到操作者到目标的全链，形成观察覆盖盲区；跨视点时间、字节和配置关联可缩小这一差异。
      en: Relays record only the previous and next hop, distributing the complete path across administrative domains.
        One-point analysis therefore misses the operator-to-target chain, creating an observation-coverage gap. Cross-vantage
        timing, byte, and configuration correlation narrows the differential.
  evidence_refs:
  - REF-001024
  - REF-001027
  - REF-001028
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 同一控制会话被拆为多个局部路径片段
    en: One control session is dispersed into local path fragments
  analysis:
    paragraphs:
    - zh: 攻击者把一个控制过程分布到入口、中间、出口和目标的局部会话，使每个窗口和节点只保留片段。防守需跨节点及时间重建共同谱系，路径越分舱，关联成本越高；完整全局 flow 会削弱该效果。
      en: The actor distributes one control process across local entry, middle, exit, and target sessions, leaving each
        window and node with a fragment. Defense must reconstruct common lineage across nodes and time; greater compartmentation
        raises cost, while complete global flow reduces the effect.
  evidence_refs:
  - REF-001027
  - REF-001028
  confidence: medium
