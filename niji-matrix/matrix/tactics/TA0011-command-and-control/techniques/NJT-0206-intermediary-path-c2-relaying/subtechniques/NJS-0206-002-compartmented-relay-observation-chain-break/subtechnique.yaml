research:
  limitations:
    paragraphs:
    - zh: APT29/Tor 资料支持分舱路径和一个实际组合，但不提供全部中继日志或可量化归因成本。公共中继、合法隐私工具和企业多代理可能产生相似拓扑，需以端点控制结果和路径证据区分。
      en: APT29 and Tor sources support compartmented paths and one real combination, but do not provide every relay
        log or quantified attribution cost. Public relays, legitimate privacy tools, and enterprise multi-proxy paths
        can look similar and require endpoint control outcomes and path evidence.
