research:
  limitations:
    paragraphs:
    - zh: 一项历史活动和提供方防护文档支持路由差及控制面，但没有统一展示同一受害者、边缘账户和源站的完整日志。提供方实现变化会改变可行性，检测结论需按当前平台验证。
      en: One historical operation and provider-control documentation support the routing differential and control surface,
        but no source exposes complete victim, edge-account, and origin logs together. Provider implementation changes
        alter feasibility, so detection conclusions require current-platform validation.
