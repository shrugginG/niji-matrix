schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0206-003
parent_ref: NJT-0206
name:
  zh: 跨层路由权威分离
  en: Cross-Layer Routing-Authority Divergence
summary:
  zh: 攻击者让连接外层声明的服务身份与解密后决定后端的路由权威不同，使边界传感器只看到获准前端。
  en: The actor separates the service identity declared by the outer connection from the decrypted routing authority
    that selects the backend, leaving a boundary sensor with an approved front end.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨层路由权威分离是攻击者让同一共享边缘会话的外层 TLS 服务身份与解密后决定后端的 HTTP Host/:authority、账户或源站不一致。直接目标是让边界只看到获准前端，而真正控制后端由另一权威选择。
    en: Cross-Layer Routing-Authority Divergence makes the outer TLS service identity in one shared-edge session disagree
      with the HTTP Host or :authority, account, or origin that selects the backend after decryption. Its direct aim
      is to leave the boundary with an approved front end while another authority selects the real control backend.
  - zh: 分类变量是同一请求内不同协议/提供方层对“目的地”的权威不一致。它不依赖中继被攻陷、路径多跳或服务对象存储任务；共享 CDN 或前门即可产生该差异。
    en: The variable is disagreement among protocol or provider layers over destination authority in the same request.
      It does not require a compromised relay, multiple hops, or task storage in a service object; a shared CDN or front
      door can create the differential.
stealth_characteristics:
  paragraphs:
  - zh: 跨层路由权威分离让企业边界记录高信誉 SNI、证书和共享边缘 IP，提供方却按另一 Host、账户或 OriginURL 路由。SNI、Host/:authority、证书覆盖、route owner、源站和错误码仍是残余；拥有解密出口或提供方日志的防守者可以直接比较。
    en: Cross-Layer Routing-Authority Divergence leaves the enterprise boundary with a high-reputation SNI, certificate,
      and shared edge IP while the provider routes by another Host, account, or OriginURL. SNI, Host or :authority, certificate
      coverage, route owner, origin, and error codes remain residuals that a decrypting egress or provider can compare.
  - zh: TLS 不解密、ECH、HTTP/3 覆盖不足和外部租户日志缺失会限制检测。历史域前置案例不能证明当前任意 CDN 仍允许同一差异，合法反向代理重写也必须纳入基线。
    en: Opaque TLS, ECH, incomplete HTTP3 coverage, and absent outside-tenant logs limit detection. Historical domain-fronting
      cases do not prove that every current CDN permits the same differential, and legitimate reverse-proxy rewriting
      requires baselining.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入可证的同会话外层身份与实际后端路由权威差。排除普通 CDN 多租户、同账户批准路由和只伪造 User-Agent/内容的会话。共享服务对象归 T1102，完整内层协议封装归 T1572。
    en: Include a provable same-session differential between outer identity and actual backend routing authority. Exclude
      ordinary CDN multitenancy, approved same-account routing, and sessions that only mimic User-Agent or content. Shared
      service objects belong to T1102, and intact inner-protocol encapsulation belongs to T1572.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: APT29 meek 组合用 Google 外观和 HTTP reflection-server Host 选择 Tor 后端；提供方可用 SNI、Host、证书、账户和源站一致性阻断类似跨租户路由。
      en: The APT29 meek combination used a Google appearance and an HTTP reflection-server Host to select a Tor backend.
        Providers can reject similar cross-tenant routing through SNI, Host, certificate, account, and origin congruence.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制内层后端并找到允许外层/内层名称分离的共享边缘配置，还要处理证书、协议和提供方策略变化。错误组合可能产生 421 或路由失败。
        en: The actor needs an inner backend and a shared-edge configuration that permits outer and inner name separation
          while handling certificate, protocol, and provider-policy changes. Incorrect combinations can produce 421 or
          routing failures.
    defender_model:
      paragraphs:
      - zh: 企业可在有权解密时比较 DNS、SNI、证书和 Host；提供方还能看到账户、route owner、OriginURL、request ID 和拒绝结果。没有提供方字段时只报告跨层差异，不能宣称隐藏后端归属。
        en: An enterprise can compare DNS, SNI, certificate, and Host where decryption is authorized; the provider can
          also see account, route owner, OriginURL, request ID, and denials. Without provider fields, report a cross-layer
          differential rather than claiming backend ownership.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 获准外层身份伪装未关联的真实后端路由
    en: An approved outer identity disguises routing to an unrelated backend
  analysis:
    paragraphs:
    - zh: 攻击者让边界看到正常前端名称和证书，同时由内层 Host 或提供方账户路由到控制后端。粗粒度域名允许因此误分类，防守需比较同请求的多个权威层；提供方错误与源站记录仍可揭示差异。
      en: The actor presents a normal front name and certificate at the boundary while an inner Host or provider account
        routes to the control backend. Coarse domain allowlisting can misclassify the request, requiring comparison of
        authority layers within the same request. Provider errors and origin records remain revealing traces.
