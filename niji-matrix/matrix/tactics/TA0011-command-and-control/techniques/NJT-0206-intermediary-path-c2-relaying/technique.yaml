schema_version: 2.0.0
type: technique
id: NJT-0206
name:
  zh: 中介路径指挥控制转发
  en: Intermediary-Path C2 Relaying
summary:
  zh: 攻击者通过一个或多个网络中介转发指挥控制流量，使防守方可见的相邻节点、来源归属或表面目的地与真实控制路径分离。
  en: Adversaries relay command-and-control traffic through one or more network intermediaries so the adjacent node,
    source provenance, or apparent destination visible to defenders is separated from the real control path.
aliases:
- T1090
- Proxy
classification:
  tactic_refs:
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1090
    source_attack_version: '19.1'
  decision_ref: DEC-TA0011-T1090
definition_and_concept:
  paragraphs:
  - zh: 中介转发指挥控制路径是攻击者让受害端、控制端或操作者会话先连接到代理、转发器、被控边缘设备或共享路由前端，再由该中介建立或延续另一段网络关系的行为。其直接目的在于避免受害端与真实控制基础设施直接互见、借用另一网络来源的归属，或让部分观察面只看到路径的一段。RFC
      1928 的 SOCKS CONNECT 明确区分客户端到 SOCKS 服务器的连接与服务器按 DST.ADDR、DST.PORT 建立的目标连接，为这一“两段关系”提供协议级模型；攻击实现不必使用 SOCKS 才能满足概念。
    en: Intermediary-Relayed C2 Paths is adversary behavior in which a victim, controller, or operator session first
      connects to a proxy, forwarder, compromised edge device, or shared routing front end and that intermediary establishes
      or continues another network relationship. The immediate purpose is to prevent direct visibility between the victim
      and true control infrastructure, borrow another network origin's provenance, or expose only part of the path to
      a given observation plane. RFC 1928 SOCKS CONNECT explicitly separates the client-to-SOCKS-server connection from
      the server's connection to DST.ADDR and DST.PORT, providing a protocol-level model for this two-leg relationship;
      implementations need not use SOCKS to satisfy the concept.
  - zh: 本技术的概念锚是可归因的中介状态、至少两段可连接的流量关系、以及 C2 或操作者控制结果。单条到住宅 IP、单个监听端口、安装代理工具或一次异常转发规则只能构成调查线索；需进一步证明中介接收一侧流量并向另一侧转发，或者权威路由层将外层所示目标交付到隐藏后端。代理可以与加密、隧道、应用服务、故障切换或多阶段通道并列，但这些并列事实不能替代中介转发证据。
    en: The conceptual anchors are attributable intermediary state, at least two joinable traffic relationships, and
      a C2 or operator-control result. One connection to a residential IP, a listening port, installation of proxy software,
      or one anomalous forwarding rule is only an investigative lead. Classification additionally requires evidence that
      the intermediary received traffic on one side and forwarded it on the other, or that an authoritative routing layer
      delivered an outerly named destination to a concealed back end. Proxying may coexist with encryption, tunneling,
      application services, failover, or multi-stage channels, but those parallel facts do not substitute for intermediary-forwarding
      evidence.
stealth_characteristics:
  paragraphs:
  - zh: 中介把直接的受害端—控制端连接改写为受害端—最后跳点和中介—后端等局部关系。目标日志记录的是代理、SOHO 路由器、内部服务器、Tor 出口或 CDN 前端，而不是最初操作者；受害端允许列表和地理信誉也可能只评价最后跳点。若路径由多个独立中继组成，任一节点或单点传感器通常只有相邻关系，防守方必须取得端点、代理、网络设备或提供方的共同时间、会话和流量证据才能恢复端到端谱系。
    en: An intermediary rewrites a direct victim-to-controller connection into local relationships such as victim-to-last-hop
      and relay-to-backend. Target logs record a proxy, SOHO router, internal server, Tor exit, or CDN front end rather
      than the original operator, while victim allowlists and geographic reputation may evaluate only that last hop.
      Where independently operated relays form the path, any one node or sensor normally retains only adjacent relationships.
      Defenders need common time, session, and traffic evidence across endpoints, proxies, network devices, or providers
      to recover end-to-end lineage.
  - zh: 匿迹不等于无痕。中介主机上仍会出现监听、代理配置、入站和出站 socket、流量计数与身份；目标侧仍可记录最后跳来源、TLS 指纹、时间和字节形态。被攻陷出口还留下固件或进程完整性异常、管理登录和同一设备向多个目标转发的关系；域前置留下
      SNI、证书、HTTP Host 或 :authority、CDN 账户与源站之间的路由关系。缺少中介侧或提供方日志时，目标侧可以确认“观察到最后跳”或“路由身份不一致”，但不能据此声称已恢复真实控制者。
    en: Stealth does not erase evidence. The intermediary host can retain listeners, proxy configuration, inbound and
      outbound sockets, traffic counters, and identity; the target can retain last-hop origin, TLS fingerprint, timing,
      and byte shape. Compromised egress also leaves firmware or process-integrity changes, administrative logons, and
      one device relaying toward multiple targets. Domain fronting leaves SNI, certificate, HTTP Host or :authority,
      CDN account, and origin-routing relationships. Without intermediary-side or provider logs, the target may establish
      that it observed a last hop or a routing-identity mismatch, but cannot claim to have recovered the true controller.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入经内部受控主机、外部代理、被攻陷边缘设备、层叠中继或共享路由前端转发 C2/操作者会话，并且这种转发改变来源、目的或路径可见性的行为。内部与外部是部署属性：二者都可只产生相同的“可见对端不是控制端”结果，也都可能因完整代理审计而没有明显匿迹收益。多跳只有在跨节点观察责任分割、日志不可共同取得或路径关系分舱时才超过父级核心；代理数量本身不是分类变量。
    en: 'Scope includes forwarding C2 or operator sessions through controlled internal hosts, external proxies, compromised
      edge devices, layered relays, or shared routing front ends when the forwarding changes source, destination, or
      path visibility. Internal versus external is a deployment attribute: either may produce the same result that the
      visible peer is not the controller, and either may have little stealth value under complete proxy audit. Multi-hop
      exceeds retained at the parent level only where observation custody is partitioned across nodes, logs cannot be jointly obtained,
      or path relationships are compartmented. Proxy count itself is not a taxonomy variable.'
  - zh: NJT-0160“应用会话承载指挥控制”中的协议中介会终止并理解 DNS、MQTT、邮件等应用事务，再按主题、收件者或解析结果路由消息；本项中 SOCKS、PortProxy、FRP 或普通转发中介只需建立另一段网络关系，不要求理解控制消息语义。T1102
      的直接对象是合法 Web 服务的内容、API 或资源承担死信箱或命令交换；仅把 CDN 当路由层或把 Web 服务前面的代理当字节中继归本项。公共 broker 既承担应用事务又隐藏控制端时可与 NJT-0160 并列，但不能只因目的地是第三方服务就记为
      T1090。
    en: The protocol intermediary in NJT-0160 Application-Session C2 Carriage terminates and understands an application
      transaction such as DNS, MQTT, or mail and routes messages by topic, recipient, or resolution result. A SOCKS,
      PortProxy, FRP, or ordinary forwarding intermediary here only needs to establish another network relationship and
      need not understand control-message semantics. T1102 directly concerns legitimate Web-service content, APIs, or
      resources serving as a dead drop or command exchange; using a CDN as a routing layer or a proxy before a Web service
      as a byte relay belongs here. A public broker that both handles application transactions and hides the controller
      may coexist with NJT-0160, but a third-party-service destination alone does not establish T1090.
  - zh: T1572 的直接对象是把完整内层协议会话封装进外层协议以跨越控制边界；本技术关注谁转发两段连接，即使转发负载没有内外协议嵌套也成立。APT29 的 meek 同时使用 HTTP/TLS 封装 Tor 流量并借 CDN
      路由，因而可同时涉及隧道与代理，但两种证据不可互换。NJT-0153 要求主要路径失败或触发条件之后启用备用路径；持续使用代理不构成 fallback，只有失败后才切换到代理路线时才可并列归类。T1104 的阶段/功能分工也不由多个代理地址或链中多个节点自动证明。
    en: T1572 directly concerns encapsulating an intact inner protocol session in an outer protocol to cross a control
      boundary. This technique asks who forwards two connection legs and applies even when the relayed payload has no
      nested inner and outer protocols. APT29 meek both wrapped Tor traffic in HTTP/TLS and used CDN routing, so tunneling
      and proxying can coexist, but their evidence is not interchangeable. NJT-0153 requires activation of a reserve
      path after primary-path failure or another handoff condition. Persistent proxy use is not fallback and co-classifies
      only when a failure causes a switch to the proxy route. T1104 stage or function division is likewise not established
      by multiple proxy addresses or multiple nodes in one chain.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可在受限区内部署 FRP 客户端、PortProxy 或 SOCKS 监听，把不具直接出站能力的植入流量汇聚到可联网主机；也可让目标仅看到一台外部 VPS、VPN 或被攻陷 SOHO 路由器，再由它连接控制基础设施。高资源行动可将这些节点组成分舱路径，使不同资产所有者和网络观察者各自只掌握一段。Volt
        Typhoon 的 PRTG/FRP 与 SOHO 出口分别证明内部转发和借用外部网络归属的现场行为。
      en: An actor may deploy an FRP client, PortProxy, or SOCKS listener inside a restricted zone to aggregate implant
        traffic through an Internet-reachable host. The actor may instead expose only an external VPS, VPN, or compromised
        SOHO router to the target and have that node contact control infrastructure. A well-resourced operation can compose
        such nodes into a compartmented path so different asset owners and network observers each possess only one segment.
        Volt Typhoon's PRTG/FRP activity and SOHO egress independently establish internal forwarding and borrowed external-network
        provenance in field operations.
    - zh: 在共享 CDN 或边缘路由服务允许不同名称层参与路由时，植入可在 TLS 握手中呈现高信誉前端名称，而在解密后的 HTTP Host 或 :authority 中指定另一后端。APT29 的 meek 将 Tor
        流量包装在合法 TLS/HTTP 连接中，并利用 CDN 把请求重定向到 reflection server；受害边界看到公共服务，CDN 才能看到内层路由目标。该场景还可能包含 Tor 多跳和协议隧道，应按各自直接对象并列记录。
      en: Where a shared CDN or edge-routing service lets different naming layers participate in routing, an implant
        can present a high-reputation front name during the TLS handshake and identify another back end in the decrypted
        HTTP Host or :authority. APT29 meek wrapped Tor traffic in legitimate TLS and HTTP and used the CDN to redirect
        requests to a reflection server; the victim boundary saw a public service while the CDN could see the inner routing
        destination. This scenario may also contain Tor multi-hop and protocol tunneling and should be co-classified
        by each behavior's direct object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制或租用至少一个能接收并转发流量的中介，掌握监听地址、认证、目的路由与双侧可达性。内部代理要求已有主机或网络设备权限以及穿越分区的连接；被攻陷出口要求维持第三方设备控制而不破坏其正常功能；多跳需要配置和维护节点间密钥、路由或会话状态；域前置还要求共享服务接受外层名称与内层路由目标的特定组合。中介增加延迟、故障点、带宽与运维成本，并可能在配置、进程和提供方日志中集中暴露关系。
        en: The actor must control or rent at least one intermediary able to receive and forward traffic and must manage
          listener address, authentication, destination routing, and reachability on both sides. Internal proxying requires
          prior authority on a host or network device plus connectivity across zones. Compromised egress requires continued
          control of a third-party device without disrupting its normal function. Layered relays require keys, routing,
          or session state between nodes. Domain fronting additionally requires a shared service to accept a particular
          combination of outer name and inner routing target. Intermediaries add latency, failure points, bandwidth,
          and operational cost and can concentrate relationship evidence in configuration, process, and provider logs.
    defender_model:
      paragraphs:
      - zh: 防守方至少拥有受害端连接或边界流量，理想情况下还拥有端点进程网络事件、内部代理/防火墙/NAT 配置与会话日志、网络设备管理审计、被控边缘设备完整性数据以及 CDN 诊断日志。分析需统一设备、进程、原始和转换后五元组、代理会话、请求目的、SNI/Host、证书、提供方账户与时间。单个目标通常无权取得外部中介或多个司法辖区的日志，因此对真实控制者的结论必须区分“目标侧最后跳推断”“已配对两段转发”“跨提供方恢复完整链”三种置信等级。
        en: The defender has at least victim connection or boundary-flow telemetry and ideally endpoint process-network
          events, internal proxy, firewall, or NAT configuration and session logs, network-device administrative audit,
          compromised-edge integrity data, and CDN diagnostic logs. Analysis normalizes device, process, pre- and post-translation
          tuple, proxy session, requested destination, SNI and Host, certificate, provider account, and time. A single
          target normally lacks authority to obtain logs from external intermediaries or multiple jurisdictions, so conclusions
          about the true controller must distinguish victim-side last-hop inference, paired two-leg forwarding, and a
          complete cross-provider chain.
      - zh: 合法安全网关、服务网格、远程办公 VPN、CDN、反向代理、跳板机和故障恢复会产生相似的两段流量或名称差异。防守方需要批准的中介清单、变更工单、软件角色、代理身份与目标服务契约来排除正常行为；不得把 Tor 节点、住宅
          ASN、SNI/Host 差异或 portproxy 注册项单独等同于恶意 C2。TLS 内容不可见、ECH、QUIC、NAT 日志缺失、时钟偏差和短保留期都会削弱跨段关联。
        en: Legitimate security gateways, service meshes, remote-work VPNs, CDNs, reverse proxies, jump hosts, and disaster
          recovery create similar two-leg flows or naming differences. Defenders need an approved-intermediary inventory,
          change tickets, software role, proxy identity, and destination-service contract to exclude normal behavior.
          A Tor node, residential ASN, SNI-to-Host difference, or PortProxy registry entry alone must not be equated
          with malicious C2. Opaque TLS, ECH, QUIC, absent NAT logs, clock skew, and short retention weaken cross-leg
          correlation.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 中介来源或外层路由身份替代真实控制端的可见身份
    en: Intermediary origin or outer routing identity substitutes for the visible identity of the true controller
  analysis:
    paragraphs:
    - zh: 攻击者让目标只与代理、被攻陷路由器、Tor 出口或 CDN 前端直接交互，目标侧痕迹中的来源地址、网络所有者或服务名称因此指向中介而非控制端。粗粒度信誉与地理规则会把中介的真实属性当作操作者属性；只有连接代理配置、双侧会话、设备完整性或
        SNI—Host—提供方路由关系才能恢复差异。这一行为以另一真实或可信特征替代控制基础设施特征，形成特征伪装。
      en: The actor causes the target to interact directly only with a proxy, compromised router, Tor exit, or CDN front
        end, so source address, network owner, or service name in target-side traces points to the intermediary rather
        than the controller. Coarse reputation and geography rules treat the intermediary's genuine attributes as operator
        attributes. The differential is recovered only by joining proxy configuration, both flow legs, device integrity,
        or SNI-to-Host-to-provider routing. Another real or trusted feature substitutes for control-infrastructure features,
        producing Feature Disguise.
  evidence_refs:
  - REF-000073
  - REF-000074
  - REF-001024
  - REF-001025
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 分舱中继把一条控制关系拆到不同节点和观察辖区
    en: Compartmented relays split one control relationship across nodes and observation jurisdictions
  analysis:
    paragraphs:
    - zh: 当路径由相互独立或只知相邻节点的中继组成时，受害端、入口、中间节点和出口分别保存局部流量，单一日志集不能直接连接操作者与受害者。Tor 官方说明三跳路径及每个 relay 只知前后相邻关系，Mandiant 又在
        APT29 后门中观察到 Tor 与域前置组合。痕迹不是消失，而是空间分布在多个管理域；防守方需跨节点长窗重建，形成时空释痕效果。仅增加一个由同一组织完整记录的代理不自动满足本机理。
      en: When independently operated relays or relays that know only adjacent nodes form the path, victim, entry, middle,
        and exit vantage points each retain local traffic and no single log set directly joins operator to victim. Tor
        documentation describes three-hop paths and per-relay adjacency knowledge, while Mandiant observed Tor combined
        with domain fronting in APT29's backdoor. Traces are distributed spatially across administrative domains rather
        than erased, requiring long-window cross-node reconstruction and producing Spatiotemporal Trace Dilution. Adding
        one fully logged proxy under a single organization does not automatically satisfy this mechanism.
  evidence_refs:
  - REF-001024
  - REF-001027
  - REF-001028
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 三项子技术按中介带来的独立观察差划分：被攻陷网络出口归属借用改变目标看到的真实网络所有权；分舱中继观察链断裂把端到端关系拆给不同管理域；跨层路由权威分离使同一共享边缘会话的外层身份与实际后端路由不一致。三者分别要求设备完整性、跨视点路径和提供方路由字段，互不包含。
      en: Three children use distinct observation differentials. Compromised-Network Egress Provenance Borrowing changes
        the genuine network ownership seen by the target. Compartmented-Relay Observation-Chain Break distributes the
        end-to-end relationship across administrative domains. Cross-Layer Routing-Authority Divergence makes outer identity
        disagree with actual backend routing in one shared-edge session. They require device integrity, multi-vantage
        path, and provider-routing fields respectively and do not contain one another.
    - zh: 普通单跳代理留在父级。中介处于内部或外部、代理产品和跳数不是子项变量；出口池准备与轮换、协议封装、服务资源、消息伪装和失败换路分别由相邻对象处理。
      en: Ordinary one-hop proxying remains retained at the parent level. Internal or external placement, proxy product, and hop count
        are not child variables. Egress-pool preparation and rotation, protocol encapsulation, service resources, message
        disguise, and failure-triggered switching remain with adjacent objects.
