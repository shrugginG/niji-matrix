research:
  limitations:
    paragraphs:
    - zh: 代理协议标准、Tor 架构和共享边缘文档支持路径与字段机理，公开事件支持具体使用；它们不提供所有中介的完整多视点日志，也不证明任意住宅 IP、Tor 使用或 SNI/Host 差异为恶意。没有节点所有者或提供方数据时，结论须限制为最后跳或路由异常。
      en: Proxy standards, Tor architecture, and shared-edge documentation support path and field mechanics, while public
        incidents support specific use. They do not provide complete multi-vantage logs for every intermediary or make
        every residential IP, Tor use, or SNI-to-Host difference malicious. Without node-owner or provider data, conclusions
        remain last-hop or routing anomalies.
    - zh: 被攻陷出口的准备和轮换与实时转发可能同时出现，但公开证据不能保证同一组织拥有跨双方取证授权。域前置已被部分提供方阻断，历史案例不能证明当前任意 CDN 仍接受同一组合；检测字段和关联窗口需按部署验证。
      en: Compromised-egress preparation and live relaying may coexist, but public evidence does not guarantee cross-party
        forensic authority. Some providers now block domain fronting, so historical cases do not prove every current
        CDN accepts the same combination. Detection fields and windows require deployment validation.
