schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0207-001
parent_ref: NJT-0207
name:
  zh: 身份定向介质信箱
  en: Identity-Addressed Media Mailboxes
summary:
  zh: 只处理目标身份对应的稀疏任务和返回对象。
  en: Process only sparse task and return objects addressed to the target identity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 身份定向介质信箱是攻击者按目标计算机名、用户标识、目标列表及已执行摘要选择介质上的任务和返回对象，使每次行程只携带面向特定受控端的稀疏消息。直接目标是在重复介质往返中维持定向控制，同时避免面向所有主机的通用载荷。
    en: Identity-Addressed Media Mailboxes select task and return objects by target computer name, user identifier, target
      list, and executed-content digest so each trip carries sparse messages for a particular controlled endpoint. The
      direct aim is targeted control across repeated media trips without a generic payload for every host.
  - zh: 分类变量是信箱收件身份和去重状态，而非文件名、加密算法或介质型号。单次按主机投递而无结果回传只属于传播或文件到达的支持步骤。
    en: The variable is mailbox recipient identity and deduplication state rather than filename, encryption algorithm,
      or media model. One host-targeted delivery without a result return is only a supporting step for propagation or
      file arrival.
stealth_characteristics:
  paragraphs:
  - zh: 身份定向介质信箱使介质只出现少量目标相关任务与返回包，削弱固定文件名、批量写入和多主机同步执行信号。计算机名、用户 ID、任务列表、执行摘要、结果对象和对应进程仍是残余，跨行程可恢复信箱关系。
    en: Identity-Addressed Media Mailboxes leave only a small number of target-relevant task and return packages, weakening
      fixed-filename, bulk-write, and simultaneous multi-host signals. Computer name, user ID, task list, executed digest,
      result object, and matching process remain as residuals that can recover the mailbox across trips.
  - zh: 合法离线作业也可按主机或用户定向。只有身份选择、受限端动作、结果写回和控制侧消费形成闭环时才确认；无法解析加密内容时可依顺序和稳定对象特征判断，但不能声称读懂命令。
    en: Legitimate offline jobs can also be host- or user-specific. Confirmation requires identity selection, restricted-side
      action, result write-back, and control-side consumption in one loop. Where content is encrypted, order and stable
      object features can support lineage but not a claim to understand the command.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入两端已受控、同一介质重复往返且按身份选择任务与回报的闭环。排除普通补丁包、按资产分发的批准维护、只有执行无返回的介质传播和只有返回无命令的外传。
    en: Include loops with both sides controlled, repeated movement of the same medium, and identity-selected tasks and
      returns. Exclude ordinary patches, approved asset-targeted maintenance, media propagation with execution but no
      return, and exfiltration with return but no inward command.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: USBStealer 用计算机名文件让操作者在 A 端投递 B 的命令并回收文件；GoldenDealer 用用户标识列表和执行摘要选择隔离端任务。这些案例显示同一稳定变量跨两种工具存在。
      en: USBStealer uses a computer-name file for operators on A to deliver commands to B and recover files. GoldenDealer
        uses user-ID lists and executed digests to select isolated-side tasks. The cases show the same stable variable
        across two tools.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要两端共享或可登记的目标身份、可重复介质行程、任务去重和返回对象管理。错误身份、介质丢失、格式变化和人工检查会中断闭环。
        en: The actor needs a shared or registrable target identity on both sides, repeatable media trips, task deduplication,
          and return-object management. Wrong identity, lost media, format changes, and manual inspection can break the
          loop.
    defender_model:
      paragraphs:
      - zh: 防守方需连接介质资产/实例、计算机或用户身份、文件摘要/稳定特征、写读执行进程、行程方向和控制侧外联。只在一端观察时最多确认局部投递或返回。
        en: Defenders need to join media asset or instance, computer or user identity, file digest or stable features,
          writer, reader, and execution processes, trip direction, and control-side egress. Observation on one side confirms
          only local delivery or return at most.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 身份门控使任务行为只在指定受控端显现
    en: Identity gating makes task behavior appear only on the addressed controlled endpoint
  analysis:
    paragraphs:
    - zh: 攻击者让非目标主机忽略任务，只在身份匹配的受限端执行并生成回报。广泛监控看见的是稀疏普通文件活动而非同步恶意行为，防守必须跨身份与行程恢复关系；地址和结果状态仍留下可关联痕迹。
      en: The actor has non-target hosts ignore tasks and executes only on the identity-matched restricted endpoint before
        producing a return. Broad monitoring sees sparse ordinary file activity rather than synchronized malicious behavior,
        requiring reconstruction across identity and trips. Address and result state remain joinable traces.
  evidence_refs:
  - REF-000596
  - REF-001032
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 每受害者稀疏信箱拆散批量控制痕迹
    en: Sparse per-victim mailboxes disperse bulk control traces
  analysis:
    paragraphs:
    - zh: 任务和结果按受害者及行程分散，单盘和单主机只看到少量对象。短窗口或固定 IOC 无法恢复整体控制集，需跨内容摘要、身份和多次行程关联；全量台账会削弱该效果。
      en: Tasks and results are distributed by victim and trip, leaving one drive or host with a few objects. Short windows
        and fixed IoCs do not recover the full control set, requiring joins across content digest, identity, and repeated
        trips. A complete ledger reduces the effect.
  evidence_refs:
  - REF-000596
  - REF-001032
  confidence: medium
