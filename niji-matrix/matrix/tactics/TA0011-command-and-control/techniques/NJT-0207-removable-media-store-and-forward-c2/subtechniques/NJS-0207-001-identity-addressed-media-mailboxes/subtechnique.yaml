research:
  limitations:
    paragraphs:
    - zh: USBStealer 与 GoldenDealer 支持身份和角色状态变量，但前者的 A 侧组件未恢复，后者的一般文件复制组件未观察。合法离线维护也可使用设备定向与状态标记，必须以完整任务—结果闭环区分。
      en: USBStealer and GoldenDealer support identity and role-state variables, but the former A-side component was
        not recovered and the latter general file-copy component was not observed. Legitimate offline maintenance can
        also use device targeting and state markers and requires a complete task-result loop for distinction.
