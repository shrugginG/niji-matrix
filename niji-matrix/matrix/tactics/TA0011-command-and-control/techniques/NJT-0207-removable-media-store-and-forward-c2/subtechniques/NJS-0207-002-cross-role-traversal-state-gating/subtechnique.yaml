schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0207-002
parent_ref: NJT-0207
name:
  zh: 跨角色遍历状态门控
  en: Cross-Role Traversal-State Gating
summary:
  zh: 只有介质按要求访问联网与隔离角色后才启用任务中继。
  en: Enable task relay only after the medium visits connected and isolated roles in the required order.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨角色遍历状态门控是攻击者让联网侧和隔离/受限侧分别写入介质状态标记，并只在标记证明介质按所需顺序访问两种角色后创建或处理命令—结果信箱。直接目标是把控制条件移出普通任务文件，并防止未走完整路径的介质触发。
    en: Cross-Role Traversal-State Gating has connected and isolated or restricted sides write separate media-state markers
      and creates or processes a task-result mailbox only after the markers prove the medium visited both roles in the
      required order. Its direct aim is to move the control condition outside ordinary task files and prevent media that
      did not traverse the complete path from triggering.
  - zh: 分类变量是介质路径资格状态，而非具体 MBR 字节、隐藏目录或序列号。身份寻址可并列存在，但不决定介质是否完成角色遍历。
    en: The variable is media-path eligibility state rather than a particular MBR byte, hidden directory, or serial number.
      Identity addressing may coexist but does not decide whether the medium completed role traversal.
stealth_characteristics:
  paragraphs:
  - zh: 跨角色遍历状态门控把明显控制条件变为小型标记文件、硬件 ID 记录或启动扇区字节差分，使普通文件清单和已批准设备序列号看似正常。原始扇区差分、隐藏属性、标记写入进程、接入顺序及随后信箱活动仍可恢复状态机。
    en: Cross-Role Traversal-State Gating turns an obvious control condition into a small marker file, remembered hardware
      ID, or boot-sector byte difference, leaving ordinary file inventory and an approved device serial looking normal.
      Raw-sector differences, hidden attributes, marker-writing processes, attachment order, and later mailbox activity
      can still recover the state machine.
  - zh: 只有文件级 EDR 或只检查签名清单的扫描站可能看不到原始区域状态。合法维护工具也会写入介质元数据，因此标记必须与跨区行程、任务执行和结果返回闭合。
    en: File-only EDR or inspection stations that check signed manifests may miss raw-region state. Legitimate maintenance
      tools also write media metadata, so markers must close with cross-zone trips, task execution, and result return.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入介质状态由不同角色写入且该状态实际门控双向 C2 的活动。排除一般 MBR 修改、普通隐藏文件、只有宿主不可见存储的外传，以及不影响任务处理的设备元数据。
    en: Include activity where different roles write media state and that state actually gates bidirectional C2. Exclude
      general MBR modification, ordinary hidden files, exfiltration using host-opaque storage alone, and device metadata
      that does not affect task processing.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: USBStealer 用联网标记和硬件 ID 识别返回路径；GoldenDealer 的联网与隔离线程分别修改 BOOTMGR 字节，两个标记齐全后才处理隐藏信箱。
      en: USBStealer uses an online marker and hardware ID to recognize a return path. GoldenDealer connected and isolated
        threads modify separate BOOTMGR bytes and process hidden mailboxes only after both marks exist.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需在两种角色上读写稳定标记或原始区域、识别连接状态并保持介质可正常使用。扫描站重写、只读策略、重新格式化和并发行程会破坏状态。
        en: The actor needs to read and write stable markers or raw regions on both roles, identify connectivity state,
          and keep the medium usable. Inspection-station rewriting, read-only policy, reformatting, and concurrent trips
          can break state.
    defender_model:
      paragraphs:
      - zh: 防守方需在检查站采集介质资产、行程、原始扇区/分区摘要、隐藏文件清单和写入进程，并连接受限端执行与返回对象。序列号本身不是稳定信任根。
        en: Defenders need media asset and trip data, raw sector or partition digests, hidden-file inventory, and writer
          processes at checkpoints, joined to restricted-side execution and return objects. Serial number alone is not
          a stable trust root.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 路径状态门使控制信箱只在完成双角色遍历后激活
    en: A path-state gate activates the control mailbox only after dual-role traversal
  analysis:
    paragraphs:
    - zh: 两侧将角色状态写入介质，处理逻辑只在组合状态成立时显现。常规文件观察缺少这个条件，恶意行为因此落在默认分析范围之外；原始区域摘要、标记写入和接入顺序可恢复门控。
      en: Both sides write role state to the medium, and processing appears only when the combined state is satisfied.
        Ordinary file observation lacks this condition, putting the behavior outside default analysis. Raw-region digests,
        marker writes, and attachment order can recover the gate.
