research:
  limitations:
    paragraphs:
    - zh: ESET 逆向直接支持 USBStealer 和 GoldenDealer 的目标寻址、角色标记及任务/结果机制，但 USBStealer 的 A 侧配套组件未恢复，GoldenDealer 的一般文件复制组件未观察。正式结论只覆盖可证的命令、执行文件、系统信息和返回行为。
      en: ESET reverse engineering directly supports USBStealer and GoldenDealer target addressing, role markers, and
        task or result mechanisms. The companion A-side USBStealer component was not recovered, and GoldenDealer general
        file-copying components were not observed. Formal conclusions cover only evidenced commands, executables, system
        information, and return behavior.
    - zh: 介质序列号可重复或伪造，隔离网可能没有 EDR，行程间隔也可能超出保留期。设备、文件、进程和台账字段只是可实施条件，不给出通用四十五日窗口或检测精度；合法离线维护与数据交换必须进入基线。
      en: Media serials can repeat or be spoofed, isolated networks may lack EDR, and trip intervals can exceed retention.
        Device, file, process, and ledger fields are implementation conditions, not universal forty-five-day windows
        or detection accuracy. Legitimate offline maintenance and data exchange require baselining.
