research:
  limitations:
    paragraphs:
    - zh: '>- Unit 42 的 PingPull 命令与文件读取结果来自分析环境中的测试命令，证明样本能力及完整往返，但不等于在受害网络捕获的操作者命令。VMware TAU 对 ShadowPad 的主动协议仿真发现服务器并验证
        UDP 头关联，但没有给出某一组织中被绕过的检测。两个来源都支持状态结构，不支持通用包长、熵或时间阈值。'
      en: '>- Unit 42''s PingPull command and file-read result came from a test command in the analysis environment,
        establishing sample capability and a complete round trip rather than captured operator tasking in a victim network.
        VMware TAU''s active ShadowPad protocol emulation found servers and validated UDP header relationships but does
        not identify a detector bypassed in a particular organization. Both sources support state structure, not universal
        packet-length, entropy, or timing thresholds.'
