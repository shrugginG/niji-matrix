schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0208-002
parent_ref: NJT-0208
name:
  zh: 主机栈旁路控制平面
  en: Host-Stack-Bypassing Control Plane
summary:
  zh: '>- 攻击者把控制移入 VMCI、固件管理引擎或同类平台平面，使通信不经过主机 IP 栈或常规网络传感器。'
  en: '>- Adversaries move control into VMCI, a firmware management engine, or an equivalent platform plane so communication
    bypasses the host IP stack or ordinary network sensors.'
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: '>- 主机栈旁路控制平面是攻击者让植入通过独立于主机常规 IP 网络配置与安全控制的地址族、虚拟化通道或固件管理路径收发任务。VMCI/vsock 在宿主与来宾间使用 CID 与端口，AMT SOL 由管理引擎把网络通信映射到虚拟串口；直接目的都是在主机操作系统仍能执行或处理结果的同时，让控制传输不进入其正常网络栈。'
    en: '>- Host-Stack-Bypassing Control Plane means an actor sends and receives tasks through an address family, virtualization
      channel, or firmware-management path independent of the host''s ordinary IP network configuration and controls.
      VMCI or vsock uses CIDs and ports between host and guests, while AMT SOL maps network communication to a virtual
      serial port through the management engine. Each keeps control transport out of the ordinary host network stack
      while the operating system still executes or processes outcomes.'
  - zh: '>- Mandiant 在多起调查中确认 UNC3886 部署 VIRTUALGATE/VIRTUALPITA VMCI 后门，并明确说明外部网络和默认工具不可见；Microsoft 原研究记录 PLATINUM 文件传输工具使用
      AMT SOL 且主机防火墙/监视应用不可见。两类平台不同，但攻击者控制的稳定变量相同，即把通信面从被监控的主机 IP 路径迁到另一个平台平面。'
    en: '>- Mandiant confirmed UNC3886 deploying VIRTUALGATE and VIRTUALPITA VMCI backdoors in multiple investigations
      and states that external networks and default tools cannot see the traffic. Microsoft''s original research documents
      a PLATINUM file-transfer tool using AMT SOL outside host firewall and monitoring visibility. The platforms differ,
      but the stable attacker-controlled variable is the same: moving communication from the monitored host IP path into
      another platform plane.'
stealth_characteristics:
  paragraphs:
  - zh: 主机栈旁路控制平面使>- 主机栈旁路控制平面不产生该主机预期的 TCP/UDP/ICMP socket、Windows 防火墙连接或外部交换机流记录。VMCI 流量只在同一裸机范围内，SOL 的网络部分由独立管理引擎处理；因此按开放端口、NetFlow、主机代理或来宾网络隔离验证控制面的规则会出现空白。可见性转移而非消失：VMCI
      的 CID/端口、AF_VSOCK 调用、`.vmx` 配置、VMCI 驱动、AMT/SOL 配置、管理端会话以及命令后进程仍可调查。
    en: 'Host-Stack-Bypassing Control Plane means >- Host-Stack-Bypassing Control Plane does not produce the expected
      host TCP, UDP, or ICMP socket, Windows Firewall connection, or external-switch flow record. VMCI stays within one
      bare-metal host, while SOL''s network portion is handled by a separate management engine. Controls based on open
      ports, NetFlow, host proxies, or guest network isolation therefore have a blind spot. Visibility moves rather than
      disappears: VMCI CIDs and ports, AF_VSOCK calls, `.vmx` configuration, VMCI drivers, AMT or SOL configuration,
      management-console sessions, and post-command processes remain investigable.'
  - zh: '>- 该轴在替代平面未部署或严格停用时没有匿迹收益。已集中采集虚拟化/固件审计、限制 CID/端口并监控 vsock 的环境可以比 IP 流量更准确地限定使用者。合法 VMware Tools、宿主来宾代理、备份、服务发现和远程管理会使用相同平面，故不能把存在
      VMCI/AMT 直接等同恶意。'
    en: '>- This axis provides no stealth where the alternate plane is absent or strictly disabled. Environments that
      centrally collect virtualization or firmware audit, constrain CIDs and ports, and monitor vsock can attribute users
      more precisely than IP-flow analysis. Legitimate VMware Tools, host-guest agents, backup, service discovery, and
      remote management use the same planes, so VMCI or AMT presence cannot be treated as malicious by itself.'
scope_boundary_definition:
  paragraphs:
  - zh: '>- 纳入要求通信明确绕过被评估主机的常规 IP 栈或外围网络传感器，并持续承载 C2 任务/结果。只有管理 API 执行而没有持续通道的 Guest Operations 可属于其他技术；只有合法 VMCI、virtio-vsock
      或 AMT 管理也不是攻击。互联网代理或第三方 broker 仍经过主机 IP 栈，应分别评估 T1090 或 NJT-0160，而非本子项。'
    en: '>- Inclusion requires communication that clearly bypasses the evaluated host''s ordinary IP stack or perimeter
      network sensor and continually carries C2 tasks or results. Guest Operations execution without a continuing channel
      can belong to other techniques, and legitimate VMCI, virtio-vsock, or AMT management is not adversary behavior.
      Internet proxies and third-party brokers still traverse the host IP stack and should be evaluated under T1090 or
      NJT-0160 rather than this child.'
  - zh: '>- 如果 SOL 或 VMCI 仅承载一条完整 SSH/TCP 会话，T1572 可与本项并列描述封装关系；如果一个特殊管理分组只激活后门，则 T1205 拥有信号变量。恶意 VIB 安装、Secure Boot
      绕过或固件配置修改是前置/持久化事实，不能替代持续控制通道证据。'
    en: '>- If SOL or VMCI carries an intact SSH or TCP session, T1572 may coexist to describe encapsulation. If one
      special management packet only activates a backdoor, T1205 owns the signaling variable. Malicious VIB installation,
      Secure Boot bypass, or firmware configuration changes are prerequisite or persistence facts and cannot replace
      evidence of a continuing control channel.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: '>- 攻击者控制 ESXi 后可安装带 VMCI listener 的恶意 VIB；随后只需控制同一宿主上的任一来宾，就能以 VMCI CID/端口重新连到宿主后门，不经过来宾网络分段。另一个场景是在已经启用或可由管理员权限配置
        AMT SOL 的终端，用本地恶意进程读写虚拟串口，远端管理端通过管理引擎传输文件或控制数据。'
      en: '>- After compromising ESXi, an actor can install a malicious VIB with a VMCI listener, then reconnect to the
        host backdoor from any guest on the same host using a VMCI CID and port without traversing guest network segmentation.
        On an endpoint with AMT SOL enabled or configurable through administrator privilege, local malware can read and
        write the virtual serial port while a remote management endpoint transfers files or control data through the
        management engine.'
  threat_model:
    attacker_model:
      paragraphs:
      - zh: '>- 攻击者通常需要先取得 ESXi/root、管理员或管理控制台能力，部署两端兼容组件并了解 CID、VM 归属、SOL 配置和平台版本。该前提高于普通出站连接，但一旦建立，通道可跨过现有主机防火墙与分段检查。Secure
          Boot、签名 VIB、未配置的 AMT/SOL、受限 VMCI 及完整资产审计都会提高建立或维持成本。'
        en: '>- The actor normally needs prior ESXi or root, administrator, or management-console capability, compatible
          components at both ends, and knowledge of CIDs, VM ownership, SOL configuration, and platform version. This
          prerequisite is higher than an ordinary outbound connection, but once established the channel can cross existing
          host firewall and segmentation checks. Secure Boot, signed VIBs, unprovisioned AMT or SOL, restricted VMCI,
          and complete asset audit raise setup and persistence costs.'
    defender_model:
      paragraphs:
      - zh: '>- 防守方假定能从 vCenter/ESXi 和配置管理获得 host、VM UUID、CID、`.vmx`、VIB 名称/签名/接受级别和 Secure Boot 状态，并在 Linux 来宾或宿主以增强系统调用/eBPF
          记录 socket family、type、peer CID/port、pid、exe 与时间。AMT 场景需固件配置和管理控制台会话。若 hypervisor 已被完全控制或平台没有导出 socket/会话事件，网络传感器无法补足缺口，只能依赖完整性检查与结果侧取证。'
        en: '>- The defender is assumed to obtain host, VM UUID, CID, `.vmx`, VIB name, signature and acceptance level,
          and Secure Boot state from vCenter, ESXi, and configuration management, plus enriched syscall or eBPF records
          for socket family, type, peer CID and port, pid, executable, and time on Linux guests or hosts. AMT additionally
          needs firmware configuration and management-console sessions. If the hypervisor is fully controlled or the
          platform exports no socket or session events, network sensors cannot fill the gap and defenders must rely on
          integrity checks and outcome-side forensics.'
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 替代控制平面使通信缺席主机网络遥测
    en: An alternate control plane removes communication from host network telemetry
  analysis:
    paragraphs:
    - zh: '>- 攻击者把控制字节交给 VMCI 地址族或独立管理引擎，主机常规 IP 栈、开放端口清单、主机防火墙和外围流量采集没有相应会话，关键行为落在既有监控范围之外。Mandiant 对 VMCI 可见性和 Microsoft
        对 SOL 的主机旁路描述直接支持该因果链。增加 AF_VSOCK/VMCI、VIB、固件与管理会话审计可将行为重新纳入观察。'
      en: '>- The actor hands control bytes to the VMCI address family or an independent management engine, leaving no
        corresponding session in the host''s ordinary IP stack, open-port inventory, host firewall, or perimeter flow
        collection. Mandiant''s VMCI visibility findings and Microsoft''s host-bypass description of SOL directly support
        this causal chain. AF_VSOCK or VMCI, VIB, firmware, and management-session audit can bring the behavior back
        into observation.'
