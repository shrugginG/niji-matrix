research:
  limitations:
    paragraphs:
    - zh: '>- Mandiant 直接确认多种 UNC3886 VMCI 后门与跨来宾/宿主能力，但公开材料没有提供每条实际 VMCI 命令内容或标准化 socket 日志。Microsoft 的 PLATINUM 原文记录
        SOL 文件传输及主机监控缺口，但对 AMT 是攻击者自行配置还是复用既有配置并不确定。两例支持观察平面迁移，不支持把所有 VMCI/SOL 活动视为 C2。'
      en: '>- Mandiant directly confirms multiple UNC3886 VMCI backdoors and guest or host reachability but the public
        report does not provide every actual VMCI command or a standardized socket log. Microsoft''s original PLATINUM
        report documents SOL file transfer and a host-monitoring gap but is uncertain whether the actor provisioned AMT
        or reused existing configuration. The cases support observation-plane displacement, not treating all VMCI or
        SOL activity as C2.'
