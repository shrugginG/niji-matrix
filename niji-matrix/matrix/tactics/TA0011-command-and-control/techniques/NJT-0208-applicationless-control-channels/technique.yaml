research:
  limitations:
    paragraphs:
    - zh: PingPull 的命令示例来自实验室测试，ShadowPad 证据来自主动协议仿真；PLATINUM 报告不确定 AMT 的配置来源。它们支持协议与平台能力，却不证明某一生产传感器漏报或所有 ICMP、UDP、VMCI、SOL
        活动具有相同意图。
      en: PingPull commands were exercised in a lab, ShadowPad evidence comes from active protocol emulation, and the
        PLATINUM report is uncertain how AMT was provisioned. They support protocol and platform capability but do not
        establish a production sensor miss or identical intent in all ICMP, UDP, VMCI, or SOL activity.
    - zh: 普通 auditd 不会自动解释 sockaddr_vm，ESXi/Windows 也可能缺少 socket 传感器；分组抽样、加密首部和带外管理日志缺失会降低关联。协议号、端口、分组长度和 CID 只能排序候选，不能充当跨环境固定阈值。
      en: Plain auditd does not automatically decode sockaddr_vm, and ESXi or Windows may lack socket sensors. Packet
        sampling, encrypted headers, and missing out-of-band management logs weaken correlation. Protocol number, port,
        packet length, and CID can rank candidates but are not universal thresholds.
