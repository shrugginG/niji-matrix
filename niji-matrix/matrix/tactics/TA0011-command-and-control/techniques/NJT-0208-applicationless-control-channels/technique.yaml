schema_version: 2.0.0
type: technique
id: NJT-0208
name:
  zh: 无应用事务控制通道
  en: Applicationless Control Channels
summary:
  zh: '>- 攻击者把任务和结果直接组织在网络、传输或平台局部通道中，使通信缺少常规应用事务语义或移出主机网络观察面。'
  en: '>- Adversaries organize tasks and results directly in network, transport, or platform-local channels, leaving
    communication without ordinary application-transaction semantics or moving it outside host network observation.'
aliases:
- T1095
- Non-Application Layer Protocol
classification:
  tactic_refs:
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1095
    source_attack_version: '19.1'
  decision_ref: DEC-TA0011-T1095
definition_and_concept:
  paragraphs:
  - zh: '>- 无应用事务控制通道指植入体与控制端不按 HTTP、DNS、邮件、消息 broker 或其他真实应用协议的事务规则交互，而是直接在 ICMP 消息、TCP/UDP 字节或数据报、VMCI/vsock、Serial-over-LAN
      等低层或平台专用通道中定义自己的登记、任务、分片和结果格式。其直接目的仍是维持可重复的命令执行、载荷投送或结果回传；“无应用事务”描述承载层的语义边界，并不表示通信没有攻击者自定义协议。'
    en: '>- Applicationless Control Channels covers an implant and controller that do not transact according to HTTP,
      DNS, mail, message-broker, or another real application protocol. They instead define their own registration, tasking,
      fragmentation, and result formats directly in ICMP messages, TCP or UDP byte streams and datagrams, VMCI or vsock,
      Serial-over-LAN, or another lower-layer or platform-specific channel. The direct purpose remains repeatable command
      execution, payload delivery, or result return. Applicationless describes the carrier''s semantic boundary and does
      not mean the exchange lacks an attacker-defined protocol.'
  - zh: '>- 该概念必须由消息往返或代码级客户端/服务端逻辑确认。端口 443 上的自定义 TCP 仍可能属于本项，因为没有 HTTPS 事务；相反，53 端口上的真实 DNS 查询属于 NJT-0160，即使数据可疑。单纯看到
      TCP、UDP、ICMP、VMCI 或一个 raw socket 不足以证明 C2，正常诊断、集群、虚拟化代理、实时媒体、游戏、VPN 和设备管理都能产生相似痕迹。'
    en: '>- Classification requires confirmed message exchange or code-level client and server logic. Custom TCP on port
      443 can remain here when no HTTPS transaction exists, whereas a real DNS query on port 53 belongs to NJT-0160 even
      if its data is suspicious. TCP, UDP, ICMP, VMCI, or a raw socket alone does not establish C2; diagnostics, clustering,
      virtualization agents, real-time media, games, VPNs, and device management can produce similar traces.'
stealth_characteristics:
  paragraphs:
  - zh: '>- 常规代理和 NDR 常以应用解析器生成方法、主机名、URI、事务 ID 或用户身份。本技术让相同设备只留下五元组、ICMP 类型/代码、字节量、数据报序列或非 IP 地址族标识，防守方因此失去标准事务字段，必须从原始分组、进程套接字和后继执行重建控制关系。PingPull
      在 ICMP Echo 数据段中维护序列号及 total/current 长度，ShadowPad 在 UDP 头中自行维护源/目标会话 ID，显示攻击者必须补回底层承载没有提供的任务会话语义。'
    en: '>- Proxies and NDR systems commonly rely on application parsers to produce methods, hostnames, URIs, transaction
      IDs, or user identity. This technique leaves only a five-tuple, ICMP type and code, byte counts, datagram sequence,
      or non-IP address-family identifiers, requiring defenders to rebuild the control relationship from raw packets,
      process sockets, and successor execution. PingPull keeps sequence and total or current lengths inside ICMP Echo
      data, while ShadowPad maintains source and destination session IDs in its own UDP header, showing the actor must
      replace session semantics absent from the carrier.'
  - zh: '>- 某些实现进一步把通信移出主机 IP 栈或外部网络链路。Mandiant 记录的 VMCI 只在同一裸机的 ESXi 与来宾之间路由，默认 tcpdump、netstat、nmap 和 Wireshark 看不到；PLATINUM
      的 AMT SOL 由独立管理引擎处理，主机防火墙与网络监视应用不见该流量。残余痕迹转移到虚拟化/固件配置、替代地址族套接字、管理会话、恶意 VIB、设备驱动及命令后的进程或文件结果。'
    en: '>- Some implementations move communication beyond the host IP stack or external network path. Mandiant documents
      VMCI routing only between ESXi and guests on one bare-metal host and being invisible to default tcpdump, netstat,
      nmap, and Wireshark. PLATINUM''s AMT SOL traffic is handled by a separate management engine and is absent from
      host firewall and network-monitoring applications. Residual evidence moves to virtualization or firmware configuration,
      alternate-address-family sockets, management sessions, malicious VIBs, device drivers, and process or file outcomes
      after commands.'
scope_boundary_definition:
  paragraphs:
  - zh: '>- 纳入对象必须持续或可重复地在没有真实应用事务的通道中承载命令、结果或控制载荷，并有报文结构、代码或事件链证明接收端会解析并采取行动。仅一次数据传输、单向扫描、网络错误、健康检查或正常基础设施通信不满足条件。协议类型和端口是实现证据，不能成为
      Niji 子技术边界；自定义 TCP、UDP 和 ICMP 可处于同一父级，分类取决于会话状态与观察平面等稳定变量。'
    en: '>- Included behavior must repeatedly or continuously carry commands, results, or control payloads through a
      channel without a real application transaction, with packet structure, code, or an event chain showing receiver
      parsing and action. One data transfer, one-way scanning, network errors, health checks, or normal infrastructure
      communication does not qualify. Protocol type and port are implementation evidence rather than Niji child boundaries.
      Custom TCP, UDP, and ICMP can share this parent, with classification based on stable variables such as session
      state and observation plane.'
  - zh: '>- NJT-0160 要求真实应用事务，T1571 负责应用协议与非典型端口配对，故端口 443 上的 raw TCP 不会仅因端口成为 HTTPS。T1572 要求把完整内层会话封装在另一协议中；直接在 ICMP
      或 UDP 中定义命令格式仍属于本项。T1205 负责魔术值或序列激活功能；若信号后另建通道则只把后继直接通信评为本项。T1132/T1573 分别负责编码与加密，不能把 PingPull 的 Base64/AES 或 ShadowPad
      的编码算法当作本技术子项。'
    en: '>- NJT-0160 requires a real application transaction, while T1571 owns atypical protocol-to-port pairings; raw
      TCP on 443 does not become HTTPS because of the port. T1572 requires encapsulation of an intact inner session in
      another protocol, whereas commands defined directly in ICMP or UDP remain here. T1205 owns magic values or sequences
      that activate functionality; where signaling opens another channel, only the continuing direct communication is
      evaluated here. T1132 and T1573 own encoding and encryption, so PingPull''s Base64 and AES or ShadowPad''s encoding
      algorithm cannot define children of this technique.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: '>- 在允许 ICMP 诊断但代理只记录 Web 事务的边界，植入体可以 Echo Request 轮询并从 Echo Reply 接收命令，再用自定义序列与长度字段回传结果。在允许广泛 UDP 的网络，植入体可用自定义数据报握手和会话
        ID 维持控制，而不产生应用解析记录。在已攻陷 ESXi 或具备 AMT 的设备上，攻击者还可选择 VMCI 或 SOL，让同裸机来宾、宿主或管理控制台之间的控制避开通常的主机 IP 监控。'
      en: '>- At a boundary permitting ICMP diagnostics while proxies record only web transactions, an implant can poll
        with Echo Requests, receive commands in Echo Replies, and return results using custom sequence and length fields.
        On a network allowing broad UDP, an implant can maintain control with a custom datagram handshake and session
        IDs without application-parser records. On compromised ESXi or AMT-capable devices, an actor can instead select
        VMCI or SOL so control among guests, host, or management console avoids ordinary host IP monitoring.'
  threat_model:
    attacker_model:
      paragraphs:
      - zh: '>- 攻击者需要在植入与控制端实现相同的低层报文或套接字逻辑，并拥有创建 raw socket、使用 UDP、安装/调用 VMCI 组件或访问 AMT SOL 所需的权限与平台知识。无连接实现须处理丢包、乱序、分片和重传；替代控制平面实现通常要求先取得管理员、root、ESXi
          或管理凭据。低层通道减少现成应用基础设施的掩护，也可能因环境中罕见而更加显眼。'
        en: '>- The actor needs matching low-level packet or socket logic in implant and controller, plus permissions
          and platform knowledge to create raw sockets, use UDP, install or invoke VMCI components, or access AMT SOL.
          Connectionless designs must handle loss, reordering, fragmentation, and retransmission. Alternate-control-plane
          designs normally require administrator, root, ESXi, or management credentials first. A lower-layer channel
          also loses cover from ordinary application infrastructure and may stand out where rare.'
    defender_model:
      paragraphs:
      - zh: '>- 防守方可在网络边界取得完整分组或至少包含协议、方向、分组数、字节数和时间的双向流，在部分端点取得进程、套接字地址族/类型、系统调用和子进程。虚拟化与带外管理环境还需保存 VM/宿主/CID 清单、VIB
          与 Secure Boot 状态、AMT 配置及管理会话。若只有采样 NetFlow、没有 ICMP 负载、没有 raw/vsock 系统调用或管理平面日志，结论只能是未解析流量异常，不能声称已还原命令。'
        en: '>- Defenders may obtain full packets at network boundaries or at least bidirectional flows with protocol,
          direction, packet counts, bytes, and time, and may obtain process, socket address family and type, system calls,
          and child-process outcomes on some endpoints. Virtualization and out-of-band management environments additionally
          need VM, host, and CID inventory, VIB and Secure Boot state, AMT configuration, and management sessions. With
          sampled NetFlow, no ICMP payload, no raw or vsock syscall telemetry, or no management-plane logs, the conclusion
          is limited to unparsed-flow anomaly and cannot claim command recovery.'
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 低层承载绕开应用事务与常规观察平面
    en: Lower-layer carriage bypasses application transactions and ordinary observation planes
  analysis:
    paragraphs:
    - zh: '>- 攻击者直接在网络/传输报文或平台专用套接字中定义控制协议，使 Web、DNS 或消息解析器没有可输出的事务；选择 VMCI 或 SOL 时，通信甚至不进入通常的主机 IP 监控。行为仍发生，但落在应用分析或主机网络传感器覆盖之外，形成行为透明。完整分组、socket
        family 事件、虚拟化/固件配置和后继执行可重新建立观察，因此匿迹效果取决于这些低层数据是否实际采集。'
      en: '>- The actor defines a control protocol directly in network or transport packets or platform-specific sockets,
        leaving web, DNS, or messaging parsers with no transaction to emit. With VMCI or SOL, communication may not enter
        ordinary host IP monitoring at all. The behavior occurs outside application analytics or host network sensor
        coverage, producing Behavioral Transparency. Full packets, socket-family events, virtualization or firmware configuration,
        and successor execution can restore observation, so the stealth effect depends on whether those lower-layer data
        are actually collected.'
