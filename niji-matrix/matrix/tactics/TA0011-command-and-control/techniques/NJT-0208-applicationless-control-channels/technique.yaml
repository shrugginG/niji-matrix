subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两项子技术按会话状态存在于何处划分。无连接分组序列控制在 ICMP/UDP 等分组中用自定义标识、序号、长度或 session ID 恢复任务往返；主机栈旁路控制平面把会话置于 VMCI/vsock 或 AMT SOL
        等平台局部路径，使主机 IP 网络日志缺失。前者仍在网络分组面，后者需要平台或固件审计。
      en: Two children are separated by where session state exists. Connectionless Packet-Sequence Control restores task
        exchange in ICMP or UDP packets with custom identifiers, sequence, length, or session IDs. Host-Stack-Bypassing
        Control Plane places the session in platform-local paths such as VMCI, vsock, or AMT SOL, leaving host IP-network
        logs absent. The first remains in packet telemetry, while the second requires platform or firmware audit.
    - zh: raw TCP、自定义协议号和一般低层通信留在父级。非标准端口、内层隧道、魔术激活、编码和加密是相邻变量，不按协议名称建立 NJS。
      en: Raw TCP, custom protocol numbers, and other lower-layer communication remain retained at the parent level. Nonstandard ports,
        inner tunnels, magic activation, encoding, and encryption are adjacent variables. Protocol names do not define
        NJS children.
