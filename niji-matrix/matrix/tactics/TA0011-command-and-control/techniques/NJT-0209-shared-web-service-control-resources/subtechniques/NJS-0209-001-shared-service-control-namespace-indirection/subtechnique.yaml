schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0209-001
parent_ref: NJT-0209
name:
  zh: 共享服务控制命名空间间接化
  en: Shared-Service Control-Namespace Indirection
summary:
  zh: 植入只连接合法多租户提供方，而真实控制者位于服务内的外部 account、tenant、app/token、mailbox、drive 或 repository 命名空间。
  en: The implant connects only to a legitimate multi-tenant provider while the real controller resides in an outside
    account, tenant, application or token, mailbox, drive, or repository namespace inside the service.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 共享服务控制命名空间间接化是攻击者让植入只连接合法多租户 Web 服务，而真实控制者位于服务内部的外部 tenant、account、application、token、mailbox、drive、repository
      或其他资源命名空间。直接目标是借 provider 网络身份隐藏控制资源的所有权。
    en: Shared-Service Control-Namespace Indirection has the implant connect only to a legitimate multi-tenant web service
      while the actual controller resides in an outside tenant, account, application, token, mailbox, drive, repository,
      or other resource namespace. Its direct aim is to hide control-resource ownership behind provider network identity.
  - zh: 分类变量是 provider 身份与 controller namespace 身份分离。命令是否单向、API 产品和对象类型不会改变变量；账号取得或服务路由到隐藏后端属于相邻对象。
    en: The variable is separation between provider identity and controller namespace identity. Command direction, API
      product, and object type do not change it; account acquisition and service routing to a hidden backend belong to
      adjacent objects.
stealth_characteristics:
  paragraphs:
  - zh: 共享服务控制命名空间间接化让 DNS、TLS 和代理记录只显示获准 provider，真实 tenant/account/app/token/resource 只存在于认证、API 或服务审计。允许域名因此失去区分力；资源
      tenant、AppId、token、object 和端点进程后果仍可恢复归属。
    en: Shared-Service Control-Namespace Indirection leaves DNS, TLS, and proxy records showing only an allowed provider
      while the real tenant, account, application, token, or resource exists only in authentication, API, or service
      audit. Domain allowlisting loses discrimination; resource tenant, AppId, token, object, and endpoint-process outcomes
      can still recover ownership.
  - zh: 外部攻击者租户、个人账号和 Web UI 可能不给组织完整审计。此时只能结合进程角色、资源 URI、读取后执行和重复访问给出候选，不能声称识别控制账号。
    en: An outside actor tenant, personal account, or web UI may not give the organization complete audit. Then process
      role, resource URI, execution after read, and recurrence support only a candidate, not identification of the controller
      account.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入合法 provider 背后的未批准控制 namespace 与可证任务/结果。排除批准 SaaS 集成、同步客户端、普通个人协作和只使用 provider 网络但没有控制资源的流量。NJT-0160 的协议中介、T1090
      路由代理和 NJT-0152 服务契约伪装各有独立直接对象。
    en: Include an unapproved control namespace behind a legitimate provider with evidenced tasks or results. Exclude
      approved SaaS integrations, sync clients, ordinary personal collaboration, and provider traffic without a control
      resource. NJT-0160 protocol mediation, T1090 routing proxy, and NJT-0152 service-contract camouflage retain independent
      direct objects.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: OilRig 使用共享邮箱和 OneDrive，Graphite 使用 OneDrive/Graph API，ComRAT 使用 Gmail Web UI；受害端连接合法服务，但任务归属于攻击者控制的服务命名空间。
      en: OilRig used shared mailboxes and OneDrive, Graphite used OneDrive and Graph API, and ComRAT used the Gmail
        Web UI. The victim connects to a legitimate service while tasks belong to an actor-controlled service namespace.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制服务账号、应用或令牌及相关资源，并让目标环境允许访问 provider。租户政策、token 到期、对象删除、服务处置和账号归属审计会增加成本。
        en: The actor needs control of a service account, application, or token and its resources, with provider access
          allowed in the target environment. Tenant policy, token expiry, object deletion, provider enforcement, and
          account-ownership audit raise cost.
    defender_model:
      paragraphs:
      - zh: 防守方需把端点 provider 请求解析到 tenant/account/app/token/resource，并与批准登记、认证会话和进程结果比较。外部 tenant 无日志时须保存 unresolved
          状态并依赖端点证据。
        en: Defenders need to resolve endpoint provider requests to tenant, account, application, token, and resource
          and compare them with approved registry, authentication sessions, and process outcomes. Outside tenants without
          logs remain unresolved and require endpoint evidence.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 合法 provider 身份掩护未批准控制命名空间
    en: Legitimate provider identity covers an unapproved control namespace
  analysis:
    paragraphs:
    - zh: 攻击者让端点与知名 provider 通信，使边界特征看似正常，而控制所有权实际位于陌生 tenant/account/app/token/resource。域名/IP 分类因此误判，需服务端命名空间和端点后果恢复真实关系。
      en: The actor has the endpoint communicate with a known provider, making boundary features look normal while control
        ownership resides in an unfamiliar tenant, account, application, token, or resource. Domain or IP classification
        can misjudge it, requiring provider namespace and endpoint outcomes to restore the relationship.
