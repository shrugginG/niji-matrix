research:
  limitations:
    paragraphs:
    - zh: 多个原始案例支持服务对象或 namespace 参与控制，但外部攻击者 tenant 的完整审计、令牌历史和本地告警结果通常不可得。服务对象方向和产品不能代替端点控制结果，三十日历史等窗口需按提供方保留与业务节奏验证。
      en: Multiple original cases support service objects or namespaces in control, but complete audit from actor-owned
        tenants, token history, and local alert outcomes are usually unavailable. Object direction and product cannot
        substitute for an endpoint control outcome, and windows such as thirty-day history require validation against
        provider retention and business cadence.
