schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0209-002
parent_ref: NJT-0209
name:
  zh: 服务对象任务状态会合
  en: Service-Object Task-State Rendezvous
summary:
  zh: 攻击者以 draft、file、post、event 或 attachment 等持久对象保存任务与结果，把操作者写入、植入读取和端点执行拆成异步生命周期。
  en: The actor stores tasks and results in persistent objects such as drafts, files, posts, events, or attachments,
    splitting operator write, implant retrieval, and endpoint execution into an asynchronous lifecycle.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 服务对象任务状态会合是攻击者把任务、执行状态、结果或确认物化为 draft、file、post、event、attachment 等持久服务对象，使操作者写入、植入读取和端点执行在不同时间与主体下会合。直接目标是用对象生命周期代替持续的操作者—植入会话。
    en: Service-Object Task-State Rendezvous materializes tasks, execution state, results, or acknowledgments as persistent
      service objects such as drafts, files, posts, events, or attachments, allowing operator write, implant read, and
      endpoint execution to rendezvous across time and principals. Its direct aim is to replace a continuous operator-to-implant
      session with an object lifecycle.
  - zh: 分类变量是稳定 object ID/path/version 及其 create/update/read/delete/ack 状态，而非消息为单向或双向。账号可已知且批准，只要对象仍承担隐蔽任务会合即可成立。
    en: The variable is stable object ID, path, or version and its create, update, read, delete, or acknowledgment state,
      not one-way or bidirectional messaging. The account can be known and approved if the object still provides covert
      task rendezvous.
stealth_characteristics:
  paragraphs:
  - zh: 服务对象任务状态会合把完整控制循环拆成任务创建、周期列举/读取、端点执行、结果对象写回和删除等服务事件；端点或代理一次只见片段。object ID、version、actor/app/token、读取进程、后继命令和结果写回仍可长窗连接。
    en: Service-Object Task-State Rendezvous splits a control loop into task creation, periodic list or read, endpoint
      execution, result-object write-back, and deletion events, leaving endpoint or proxy with fragments. Object ID,
      version, actor or application or token, reader process, successor command, and result write-back remain joinable
      over a longer window.
  - zh: API 批处理、同步缓存、外部 tenant 和快速删除会造成生命周期缺口。普通协作、作业队列、制品投放和备份具有相似对象序列，必须以未批准 namespace、任务内容或端点控制结果区分。
    en: API batching, sync caching, outside tenants, and rapid deletion create lifecycle gaps. Ordinary collaboration,
      job queues, artifact delivery, and backup can show similar sequences and require an unapproved namespace, task
      semantics, or endpoint control outcome for distinction.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入服务对象承载任务状态并与端点动作或结果闭合的异步 C2。排除普通同步、一次下载、无后继执行的公开内容和纯外传。对象只提供新 C2 地址时动态定位归 T1568；对象内隐写/编码归 NJT-0152/T1132。
    en: Include asynchronous C2 where a service object carries task state and closes with endpoint action or result.
      Exclude ordinary sync, one-time downloads, public content without successor execution, and pure exfiltration. When
      an object only supplies a new C2 address, dynamic location belongs to T1568; steganography or encoding inside the
      object belongs to NJT-0152 or T1132.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Graphite 读取 check 对象、执行 shellcode、向 update 写结果并删除任务；OilRig、ComRAT 和 HAMMERTOSS 展示邮箱、文件和社交对象的其他完成度。方向差异属于同一对象生命周期。
      en: Graphite reads check objects, executes shellcode, writes results to update, and deletes tasks. OilRig, ComRAT,
        and HAMMERTOSS show other completion levels across mail, file, and social objects. Direction differences remain
        one object lifecycle.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制与植入共享的对象空间、约定任务/结果/删除语义，并维护 token 和资源路径。对象保留、版本冲突、服务扫描、账号撤销和 provider 限速会暴露或中断循环。
        en: The actor needs a shared object space with the implant, agreed task, result, and deletion semantics, and
          maintained tokens and resource paths. Retention, version conflicts, service scanning, account revocation, and
          provider rate limiting can expose or interrupt the loop.
    defender_model:
      paragraphs:
      - zh: 防守方需持续导出服务对象的 actor/app/token、tenant、object、version、action、request/correlation 与结果字段，并与端点读取进程和后继执行连接。只有最新
          delta 状态而无历史时不能恢复完整循环。
        en: Defenders need continuous export of service-object actor or application or token, tenant, object, version,
          action, request or correlation, and result fields, joined to endpoint reader process and successor execution.
          Latest delta state without history cannot reconstruct the full loop.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 服务对象把控制循环分散到异步生命周期事件
    en: Service objects disperse the control loop across asynchronous lifecycle events
  analysis:
    paragraphs:
    - zh: 操作者写入、植入读取、执行和结果回写发生在不同主体与时间，单一窗口只见片段。防守必须跨 object ID/version、请求和端点后果重建共同谱系；持续服务审计会显著降低该释痕效果。
      en: Operator write, implant read, execution, and result write-back occur across principals and time, leaving one
        window with fragments. Defense must reconstruct common lineage across object ID or version, requests, and endpoint
        outcomes. Continuous service audit substantially reduces the dilution effect.
  evidence_refs:
  - REF-000945
  - REF-001048
  - REF-001050
  - REF-001051
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 外部服务内的对象变化可能不进入端点常规监控
    en: Object changes inside an external service may remain outside routine endpoint monitoring
  analysis:
    paragraphs:
    - zh: 任务状态存在 provider 对象内，端点日志只在轮询或下载时显现，外部 tenant 的操作者写入可能完全不在组织审计域。服务端持续审计和端点结果关联可关闭盲区；没有提供方日志时结论需降级。
      en: Task state resides in provider objects and appears at the endpoint only during polling or download, while operator
        writes in an outside tenant can sit outside organizational audit. Continuous provider audit and endpoint-outcome
        joins close the gap; confidence falls without provider logs.
  evidence_refs:
  - REF-000945
  - REF-001048
  - REF-001049
  confidence: medium
