schema_version: 2.0.0
type: technique
id: NJT-0209
name:
  zh: 共享 Web 服务控制资源
  en: Shared Web-Service Control Resources
summary:
  zh: 攻击者借合法外部服务的账号、API 和持久资源交换指令与结果，使提供方身份遮蔽真实控制命名空间，并把控制活动拆入服务对象生命周期。
  en: Adversaries exchange commands and results through accounts, APIs, and persistent resources of a legitimate external
    service, allowing provider identity to obscure the real control namespace and splitting control activity into service-object
    lifecycles.
aliases:
- T1102
- Web Service
classification:
  tactic_refs:
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1102
    source_attack_version: '19.1'
  decision_ref: DEC-TA0011-T1102
definition_and_concept:
  paragraphs:
  - zh: 外部服务资源中介指挥控制是攻击者让植入体和操作者通过合法多租户 Web、云存储、邮箱、内容发布或社交服务中的账号、目录、草稿、文件、帖子或消息对象交换任务、载荷与执行结果的行为。提供方不仅承载 TLS，还验证令牌、解析资源标识并保存或提供服务对象。直接目的在于借用允许服务的可达性和网络身份维持控制，同时避免在受害边界直接暴露攻击者自建
      C2 域和服务器。
    en: 'External-Service C2 Resource Mediation is adversary use of an account, directory, draft, file, post, or message
      object in a legitimate multi-tenant Web, cloud-storage, mailbox, content-publication, or social service to exchange
      tasks, payloads, and execution results between implant and operator. The provider does more than carry TLS: it
      validates tokens, resolves resource identifiers, and stores or serves service objects. The direct purpose is to
      maintain control through the reachability and network identity of an allowed service while avoiding direct exposure
      of an attacker-operated C2 domain and server at the victim boundary.'
  - zh: 判定锚点是服务内真实控制命名空间、任务或控制对象、端点读取/处理和后继执行结果。提供方域名、443 端口、官方 API、OAuth 令牌或云盘客户端本身都不是充分证据；必须把服务资源操作连接到异常端点进程和命令、载荷执行、结果回写或持续心跳。服务品牌、产品类别、API
      方法和单个消息字段只是实现，不能替代匿迹变量。
    en: Classification anchors are a real control namespace inside the service, a task or control object, endpoint retrieval
      or processing, and a subsequent execution outcome. Provider domain, port 443, official API, OAuth token, or cloud-drive
      client is insufficient by itself. Service-resource operations must join to an anomalous endpoint process and command
      or payload execution, result write-back, or sustained heartbeat. Service brand, product class, API method, and
      one message field are implementations and cannot replace a stealth variable.
stealth_characteristics:
  paragraphs:
  - zh: 共享服务让外层 DNS、IP、TLS 证书和域名稳定归属于真实提供方；网络日志通常不能从这一身份区分攻击者 account、tenant、app/token、mailbox、drive、repo 或 object。OilRig
      报告明确说明 Office 365 在组织中常见，因此下载器更容易混入正常网络流。端点进程、OAuth client、resource tenant、API URI、对象路径、token ID 和服务审计仍可恢复更细粒度身份。
    en: A shared service keeps outer DNS, IP, TLS certificate, and domain genuinely attributable to the provider. Network
      logs normally cannot distinguish an attacker account, tenant, application or token, mailbox, drive, repository,
      or object from that identity. The OilRig report explicitly states that Office 365 is common in organizations and
      therefore lets the downloaders blend more readily into regular network traffic. Endpoint process, OAuth client,
      resource tenant, API URI, object path, token ID, and provider audit can still recover finer identity.
  - zh: 持久对象会把操作者发布命令、植入轮询读取、端点执行和结果写回分散到不同时间与主体。Graphite 从 check 目录读取任务、向 update 写结果并在处理后删除任务；OilBooster 以受害者子目录和对象类型区分命令与结果；SC5k
      使用未实际发送的草稿。单个端点会话只显示一次提供方 API 操作，完整控制循环须从对象 ID/路径/版本、actor/app/token 和端点后果恢复。
    en: Persistent objects distribute operator task publication, implant polling and retrieval, endpoint execution, and
      result write-back across time and principals. Graphite reads tasks from check, writes results to update, and deletes
      tasks after processing. OilBooster separates commands and results through victim directories and object types.
      SC5k uses drafts that are never sent. One endpoint session shows only one provider API operation; the full control
      loop requires object ID, path or version, actor or application or token, and endpoint outcome.
  - zh: 匿迹收益取决于服务归属和日志权限。攻击者使用个人或外部 tenant 时，受害管理员通常不能查询资源 tenant 的 Graph/邮箱对象审计；资源位于受害 tenant 或提供方协助调查时，命名空间、对象和请求日志可缩小盲区。API
      限额、令牌更新、对象删除、账号封禁和内容扫描也会留下成本与残迹。
    en: Stealth benefit depends on service ownership and log authority. When the actor uses a personal or outside tenant,
      victim administrators generally cannot query Graph or mailbox object audit in that resource tenant. Namespace,
      object, and request logs reduce the blind spot when resources reside in the victim tenant or the provider assists.
      API limits, token refresh, object deletion, account suspension, and content scanning also create cost and residual
      evidence.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求合法外部提供方的服务语义实际参与 C2：植入访问攻击者控制或滥用的命名空间/资源以取得任务、载荷、配置或控制地址，或者回写结果/心跳，并能连接到端点控制后果。自建 HTTPS 服务器、一次文件托管、合法同步与协作均在范围外，除非另有重复任务关系。纯粹把已窃数据送走归
      TA0010 NJT-0195/T1567。
    en: 'Inclusion requires service semantics of a legitimate outside provider to participate in C2: an implant accesses
      an attacker-controlled or abused namespace or resource for tasks, payloads, configuration, or control addresses,
      or writes back results or heartbeats, and activity joins to an endpoint control outcome. An attacker-operated HTTPS
      server, one-time file hosting, and legitimate sync or collaboration are outside scope absent a repeatable task
      relationship. Pure movement of stolen data belongs to TA0010 NJT-0195 or T1567.'
  - zh: NJT-0160 拥有应用事务和中介拓扑，包括 broker/解析器如何终止、路由及按收件者寻址；本项拥有合法外部服务资源和共享 provider 身份。公共 broker/邮箱可并列，但按 victimID、主题或收件地址分区由
      NJS-0160-002 判断。T1090 拥有两段网络代理转发；CDN 只按 Host 路由字节归 T1090，OneDrive/Gmail 保存任务对象归本项。
    en: 'NJT-0160 owns application transactions and intermediary topology, including broker or resolver termination,
      routing, and recipient addressing. This object owns the legitimate external service resource and shared provider
      identity. A public broker or mailbox may co-classify, but partitioning by victim ID, topic, or recipient is judged
      under NJS-0160-002. T1090 owns two-leg network proxy forwarding: a CDN routing bytes by Host belongs there, while
      OneDrive or Gmail storing task objects belongs here.'
  - zh: NJT-0152 分析 C2 消息或服务契约的外观；本项可使用完全标准 API 和对象结构，仅因真实 provider 身份遮蔽控制资源而成立。T1568 负责动态求出或轮换 C2 地址：服务对象只保存当前域名/IP
      时，T1102 父级记录资源参与，地址算法与变化归 T1568。T1104 要求不同通道按阶段/功能分工；多个服务、对象或读写方向不能自动证明多阶段，失败换服务还需 NJT-0153。
    en: 'NJT-0152 analyzes appearance of C2 messages or service contracts. This object may use fully standard APIs and
      object structures and still apply because genuine provider identity obscures the control resource. T1568 owns dynamic
      computation or rotation of C2 addresses: when a service object stores only a current domain or IP, T1102 parent
      records resource participation while the address algorithm and change belong to T1568. T1104 requires channels
      divided by stage or function; multiple services, objects, or read and write directions do not automatically establish
      multi-stage behavior, and failure-driven service switching also requires NJT-0153.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在允许 Microsoft 365 的政府、医疗、制造和外交网络中，下载器可携带攻击者账号凭据或刷新令牌，周期访问 Graph、Outlook 或 EWS。OilRig 下载器从共享邮箱或 OneDrive 下载命令/载荷并上传结果；Graphite
        从 OneDrive check 读取任务、向 update 写结果，随后转入 Empire；ComRAT 通过 Gmail Web UI 附件接收命令。网络侧均可只见知名服务端点。
      en: In government, healthcare, manufacturing, and diplomatic networks where Microsoft 365 is allowed, a downloader
        can carry attacker-account credentials or refresh tokens and periodically access Graph, Outlook, or EWS. OilRig
        downloaders retrieve commands or payloads and upload results through a shared mailbox or OneDrive. Graphite reads
        OneDrive check tasks, writes update results, and later transitions to Empire. ComRAT receives commands through
        Gmail Web UI attachments. The network can see only well-known service endpoints.
    - zh: 公共内容服务也可提供只读任务对象。HAMMERTOSS 每日生成 Twitter handle，从帖子取得位置与解密材料，再从 GitHub 或被攻陷站点取得带命令的图像；PolyglotDuke 从 Twitter、Reddit、Imgur
        获取 C2 URL。前者支持对象会合，后者若只返回地址还应以 T1568 为动态解析直接对象。输出另走云存储时按 T1567/T1041 判断，不建方向子项。
      en: Public-content services can also provide read-only task objects. HAMMERTOSS derives a daily Twitter handle,
        obtains location and decryption material from a post, and retrieves a command-bearing image from GitHub or a
        compromised site. PolyglotDuke obtains a C2 URL from Twitter, Reddit, and Imgur. The former supports object rendezvous;
        where the latter only returns an address, T1568 is also the direct dynamic-resolution object. Output using separate
        cloud storage is assessed under T1567 or T1041 rather than a direction child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要取得或创建可由植入访问的 service account、mailbox、drive、repository 或发布对象，控制 token/credential 和对象规则，并在 API 变化、令牌到期、内容扫描与账号处置下维持可用性。共享账号常以目录、扩展属性或类别区分受害者和任务类型，这会增加复杂度并留下稳定资源关系。外部
          tenant 扩大受害日志盲区，也把控制集中到可被提供方冻结的账号和应用。
        en: The actor needs a service account, mailbox, drive, repository, or publication object accessible to the implant,
          control of token or credential and object rules, and resilience against API change, token expiry, content scanning,
          and account enforcement. Shared accounts often distinguish victims and task types through directories, extended
          properties, or categories, increasing complexity and leaving stable resource relationships. An outside tenant
          expands the victim's audit blind spot but concentrates control in an account and application the provider can
          suspend.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有端点进程/网络/文件事件、代理元数据、OAuth/Entra 登录、Graph 请求、M365/GitHub 等服务审计、对象 delta/版本及批准资源清单。分析需连接 device、process
          start、user、AppId/service principal、token、resource tenant/account、container/object、request ID、operation 和 endpoint
          outcome。只有 provider 域/IP 时只能输出 provider_only。
        en: The defender may have endpoint process, network, and file events; proxy metadata; OAuth or Entra sign-ins;
          Graph requests; Microsoft 365 or GitHub service audit; object delta or versions; and an approved-resource registry.
          Analysis must join device, process start, user, AppId or service principal, token, resource tenant or account,
          container or object, request ID, operation, and endpoint outcome. Provider domain or IP alone supports only
          provider_only.
      - zh: 日志权限必须显式建模。Graph 活动日志只覆盖 resource tenant，不能显示多租户应用在另一个 tenant 的活动；个人 Gmail、Twitter、GitHub 账号通常也不在受害审计范围。合法
          OneDrive 同步、邮件、CI/CD、机器人、备份和社交访问是强相似行为，需按资源命名空间和端点后果排除。日志缺失降低结论而不提高风险。
        en: Log authority must be explicit. Graph activity logs cover the resource tenant and do not show multitenant-application
          activity in another tenant. Personal Gmail, Twitter, or GitHub accounts are also generally outside victim audit.
          Legitimate OneDrive sync, mail, CI/CD, bots, backup, and social access are strong lookalikes and require namespace
          and endpoint-outcome exclusion. Missing logs reduce confidence rather than increase risk.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实提供方身份替代攻击者控制命名空间的网络可见身份
    en: Genuine provider identity substitutes for the network-visible identity of the attacker-controlled namespace
  analysis:
    paragraphs:
    - zh: 植入访问真实服务域、证书和 API，网络侧看到 provider，而控制权属于服务内攻击者 account/tenant/app/token/resource。域名信誉将提供方属性误作控制端属性；只有资源 tenant、应用、令牌和对象审计能恢复差异。OilRig、Graphite
        与 ComRAT 独立证明该链，形成特征伪装。
      en: The implant accesses genuine service domains, certificates, and APIs, so the network sees the provider while
        control belongs to an attacker account, tenant, application, token, or resource inside the service. Domain reputation
        substitutes provider attributes for controller attributes. Resource tenant, application, token, and object audit
        recover the differential. OilRig, Graphite, and ComRAT independently establish this chain, producing Feature
        Disguise.
  evidence_refs:
  - REF-000945
  - REF-001048
  - REF-001049
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 持久对象把任务发布植入读取和结果回写分散到不同时间与主体
    en: Persistent objects distribute task publication implant retrieval and result write-back across time and principal
  analysis:
    paragraphs:
    - zh: 操作者先写 task object，植入稍后轮询读取，执行后再写 result object；直接控制会话变为多个对象事件与 API 请求。单会话或短窗只见片段，需用 object ID/path/version、token
        和 endpoint outcome 长窗重建。Graphite、OilRig 与 HAMMERTOSS 支持该时空分布，形成时空释痕。
      en: The operator writes a task object, the implant polls and reads it later, and a result object is written after
        execution. A direct control session becomes several object events and API requests. One session or short window
        sees fragments and needs long-window reconstruction through object ID, path or version, token, and endpoint outcome.
        Graphite, OilRig, and HAMMERTOSS support this spatiotemporal distribution, producing Spatiotemporal Trace Dilution.
  evidence_refs:
  - REF-000945
  - REF-001048
  - REF-001050
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 服务控制面保留关键对象状态而端点网络只留下提供方事务
    en: The service control plane retains key object state while endpoint networking leaves only provider transactions
  analysis:
    paragraphs:
    - zh: 对象作者、resource tenant、操作者读取和服务端删除发生在 provider control plane，受害 EDR/边界可能没有这些事件。Graph/M365 文档证明 provider 侧仍可记录
        AppId、tenant、request、token、ObjectId 和 actor；扩大观察面可恢复差异，形成行为透明。
      en: Object author, resource tenant, operator retrieval, and service-side deletion occur in the provider control
        plane and may be absent from victim EDR or boundary logs. Graph and Microsoft 365 documentation establishes provider-side
        AppId, tenant, request, token, ObjectId, and actor records. Broader observation recovers the differential, producing
        Behavioral Transparency.
  evidence_refs:
  - REF-000833
  - REF-000944
  - REF-001051
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 两项子技术按合法服务隐藏控制关系的不同位置划分。共享服务控制命名空间间接化使 provider 域名和证书与真实 tenant/account/app/token/resource 分离；服务对象任务状态会合把任务写入、植入读取、端点执行和结果回写物化为持久对象的异步生命周期。命名空间差不要求对象持久化，对象会合在账号已知时仍成立。
      en: Two children separate where a legitimate service hides the control relationship. Shared-Service Control-Namespace
        Indirection separates provider domain and certificate from the real tenant, account, application, token, or resource.
        Service-Object Task-State Rendezvous materializes task write, implant read, endpoint execution, and result write-back
        as an asynchronous persistent-object lifecycle. Namespace indirection does not require persistence, while object
        rendezvous can apply when the account is known.
    - zh: 服务品牌、API、对象类型和单向/双向方向不构成子项。动态 locator、应用协议中介、网络代理、服务内容伪装和通道角色交接分别由相邻对象处理。
      en: Service brand, API, object type, and one-way or bidirectional direction do not define children. Dynamic locators,
        application-protocol mediation, network proxies, service-content disguise, and channel-role handoff remain with
        adjacent objects.
  coverage: established
  subtechnique_refs:
  - NJS-0209-001
  - NJS-0209-002
