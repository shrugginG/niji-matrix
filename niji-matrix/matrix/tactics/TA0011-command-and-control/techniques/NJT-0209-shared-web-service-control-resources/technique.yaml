research:
  limitations:
    paragraphs:
    - zh: OilRig、Graphite、ComRAT 和 HAMMERTOSS 证明合法服务资源可承载任务或结果，但公开资料通常不包含攻击者外部 tenant 的完整服务审计、令牌历史或本地检测结果。服务域允许不等于任意命名空间恶意，端点后果仍是关键结果门。
      en: OilRig, Graphite, ComRAT, and HAMMERTOSS show legitimate service resources carrying tasks or results, but public
        reports usually lack complete audit from actor-owned tenants, token history, or local detection outcomes. An
        allowed service domain does not make every namespace malicious; endpoint outcome remains a key gate.
    - zh: 对象生命周期可能因 API 批处理、同步缓存、快速删除或 provider 留存策略而不完整。动态 locator、隐写、编码、外传和阶段交接只按相邻对象记录；字段与三十日历史是实施建议，不是通用可见性或阈值。
      en: Object lifecycle can be incomplete because of API batching, sync caching, rapid deletion, or provider retention.
        Dynamic locators, steganography, encoding, exfiltration, and stage handoff are recorded only under adjacent objects.
        Fields and thirty-day history are implementation guidance, not universal visibility or thresholds.
