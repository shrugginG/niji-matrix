research:
  limitations:
    paragraphs:
    - zh: APT30 报告详细描述工具配置和控制器工作流，但公开资料不能证明每个已知 BACKSPACE 样本都实际进入第二阶段。Juniper oemd 的代码级分析证明 UDP→TCP 能力，但 Mandiant 没有宣称在事件中捕获该样本的每次实际交接。LunarWeb
        的首次联系与命令 URL 分工为样本逻辑，两个命令 URL 之间是否按选择或备用使用未完全说明。
      en: The APT30 report details tool configuration and controller workflow but does not establish that every known
        BACKSPACE sample entered stage two in the field. Juniper oemd code analysis establishes UDP-to-TCP capability,
        but Mandiant does not claim every actual handoff was captured during an incident. LunarWeb's first-contact and
        command-URL roles are sample logic, while selection or fallback behavior between its two command URLs is not
        fully explained.
