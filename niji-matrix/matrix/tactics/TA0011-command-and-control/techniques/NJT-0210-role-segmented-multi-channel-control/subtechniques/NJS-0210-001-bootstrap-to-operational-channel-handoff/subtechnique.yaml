schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0210-001
parent_ref: NJT-0210
name:
  zh: 引导—操作通道交接
  en: Bootstrap-to-Operational Channel Handoff
summary:
  zh: 攻击者让低能力引导通道下发选择、地址或组件，仅在条件满足后建立完整操作通道，从而分离普遍轮询与高价值控制。
  en: Adversaries use a lower-capability bootstrap channel to deliver selection, address, or component material and establish
    a full operational channel only after a condition is met, separating broad polling from high-value control.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 引导—操作通道交接是攻击者先让植入使用自动化、低能力或低暴露的通道获取第二阶段位置、选择状态、令牌、配置或后继组件，并只在这些条件成立后建立承担交互命令、文件操作或完整 RAT 功能的另一通道。直接目标是把广泛长期存在的引导基础设施与只为被选主机暴露的操作基础设施分离。
    en: Bootstrap-to-Operational Channel Handoff means an actor first has an implant use an automated, lower-capability,
      or lower-exposure channel to obtain second-stage location, selection state, token, configuration, or a successor
      component, then establishes another channel for interactive commands, file operations, or full RAT capability only
      after those conditions are met. The direct goal is separating broadly and persistently exposed bootstrap infrastructure
      from operational infrastructure revealed only to selected hosts.
  - zh: BACKSPACE 第一阶段不支持操作者互动，而是自动获取 dizhi/connect 配置并只让名单中的主机连接第二控制器；Juniper oemd 先在 UDP socket 接收 C2 地址/端口，再建立 TCP
      命令通道；LunarWeb 则将首次主机信息上送 URL 与命令 URL 分开。这些不同实现共同证明顺序交接变量，不要求使用相同协议、进程或文件格式。
    en: BACKSPACE's first stage does not support operator interaction; it automatically retrieves dizhi and connect configuration
      and only listed hosts reach the second controller. Juniper oemd first receives a C2 address and port over a UDP
      socket and then establishes a TCP command channel. LunarWeb separates its first-contact host-information URL from
      command URLs. These distinct implementations establish a sequential handoff variable without requiring the same
      protocol, process, or file format.
stealth_characteristics:
  paragraphs:
  - zh: 引导—操作通道交接让绝大多数观察只看到稳定、自动化、低带宽的第一阶段，而交互式第二阶段仅出现在操作者选择的少数主机和较短时间段。按第一阶段基础设施查封可能找不到完整控制器，按第二阶段倒查也会漏掉尚未升级的植入。痕迹仍包括引导回复中的地址/端口、选择列表、配置文件或下载摘要，以及紧随其后的新连接、子进程和能力变化。
    en: Bootstrap-to-Operational Channel Handoff leaves most observations with a stable, automated, low-bandwidth first
      stage while interactive second-stage activity appears only on operator-selected hosts and for shorter intervals.
      Seizing bootstrap infrastructure may not reveal the full controller, while pivoting from the second stage misses
      implants not yet upgraded. Residual traces include addresses and ports, selection lists, configuration files, or
      download digests in bootstrap responses and the new connection, child process, and capability change that follows.
  - zh: 匿迹不来自“第二域名”本身，而来自有条件状态转换。若防守能解密第一阶段内容、保留下载文件来源并用 ProcessUniqueId 跨足够窗口关联新目的地，交接会非常显眼。若第二阶段延迟数天、以进程注入继承原进程身份、使用同一
      CDN 或只在内存中保存地址，桥接难度上升。
    en: Stealth comes from a conditional state transition rather than the mere existence of a second domain. If defenders
      decrypt bootstrap content, retain download provenance, and correlate new destinations by ProcessUniqueId over a
      sufficient window, the handoff can be conspicuous. A delay of days, process injection that preserves the original
      identity, the same CDN, or in-memory-only address storage raises bridge difficulty.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求第一通道角色受限、存在可识别的选择/配置/能力交接，并在同一植入或直接后继组件上出现第二操作通道和控制结果。普通软件安装后首次联网、加载器执行载荷、同服务的登录后会话、OAuth 重定向、CDN 地址变化或仅下载文件都不是本项，除非能证明后继通道承担独立
      C2 角色。
    en: Inclusion requires a role-limited first channel, an identifiable selection, configuration, or capability handoff,
      and a second operational channel plus control outcome on the same implant or direct successor. Ordinary first launch
      after installation, loader execution, an authenticated session within one service, OAuth redirection, CDN address
      changes, or file download alone do not qualify without proof that a successor channel has an independent C2 role.
  - zh: 第一阶段因失败切换主/备服务器属于 NJT-0153，BACKSPACE 的 bak.txt 便是并行邻接事实；选择目标后进入第二控制器则属于本项。若多个节点只转发同一操作会话，归 T1090；若第一阶段在 TechNet、GitHub
      等服务发布位置，服务资源滥用归 T1102，而位置到操作通道的阶段交接仍可并列本项。
    en: A first stage switching between primary and backup servers after failure belongs to NJT-0153; BACKSPACE's bak.txt
      is a concurrent adjacent fact. Entering a second controller after victim selection belongs here. Multiple nodes
      merely forwarding one operational session belong to T1090. If a first stage publishes location through TechNet,
      GitHub, or another service, T1102 owns the service-resource abuse while the location-to-operational-stage handoff
      can coexist here.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在大规模长期情报行动中，植入可每天轮询第一阶段获取版本、更新和 run/hide 状态；当操作者确认主机价值后，将 victim ID 放入 selection 文件并发布第二阶段地址，植入才开启完整控制会话。网络设备上的被动后门也可先通过本地
        UDP 接收目标，再从设备发起 TCP 连接，避免长期暴露固定操作控制器。
      en: In a large, long-running intelligence operation, implants can poll a first stage daily for versions, updates,
        and run or hide state. After an operator confirms host value, the victim ID is placed in a selection file and
        a second-stage address is published before the implant opens a full control session. A passive backdoor on a
        network device can similarly receive a target over local UDP before initiating TCP from the device, avoiding
        continuous exposure of a fixed operational controller.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制第一阶段内容和第二阶段基础设施，维护 victim ID/配置格式并让植入保存阶段状态。目标选择降低第二阶段暴露，却要求可靠发布 selection/address 并处理错误或版本漂移。操作员若误配地址、名单或令牌，会产生失败连接、重复下载和更明显的交接痕迹。
        en: The actor needs control of first-stage content and second-stage infrastructure, must maintain victim IDs
          and configuration formats, and must have the implant preserve stage state. Victim selection reduces second-stage
          exposure but requires reliable publication of selections and addresses and handling of errors or version drift.
          Misconfigured addresses, lists, or tokens create failed connections, repeated downloads, and more visible handoff
          traces.
    defender_model:
      paragraphs:
      - zh: 防守方能把代理/HTTP 响应、文件创建、端点进程和新网络连接以 DeviceId、ProcessUniqueId、文件摘要、URL/RemoteIP 和时间连接起来，并至少保留一个完整的引导周期。内容可见时解析地址/端口/列表；内容不可见时以同进程/后继进程突然改变目的地、流量方向和交互强度作为较低置信线索。
        en: The defender can join proxy or HTTP responses, file creation, endpoint processes, and new network connections
          by DeviceId, ProcessUniqueId, file digest, URL or RemoteIP, and time, retaining at least one complete bootstrap
          cycle. Where content is visible, addresses, ports, and lists can be parsed. With opaque content, sudden changes
          in destination, direction, and interaction intensity by the same or successor process are lower-confidence
          leads.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 选择式交接把低噪声引导与完整操作分置
    en: Selective handoff separates low-noise bootstrap from full operation
  analysis:
    paragraphs:
    - zh: 攻击者让所有植入在第一阶段只留下自动化弱信号，并仅为选中主机生成第二阶段连接，完整控制活动在主机集合、时间和基础设施上被稀释。BACKSPACE 的 connect/dizhi 交接和 oemd 的 UDP 目标到
        TCP 会话直接证明状态转换。防守若保留交接材料并按同一设备/进程连接两个阶段，可重新集中这些信号。
      en: The actor leaves only weak automated first-stage signals across all implants and creates second-stage connections
        only for selected hosts, dispersing full control across host population, time, and infrastructure. BACKSPACE's
        connect and dizhi handoff and oemd's UDP target to TCP session directly establish the state transition. Defenders
        can reconcentrate the signals by retaining handoff material and joining both stages on the same device and process.
