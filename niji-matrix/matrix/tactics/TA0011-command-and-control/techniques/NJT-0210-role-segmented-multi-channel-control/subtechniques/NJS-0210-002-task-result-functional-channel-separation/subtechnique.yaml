research:
  limitations:
    paragraphs:
    - zh: Talos 直接描述 BlackWater 从一个服务器取得组件并向不同 C2 回传枚举数据，同时对 MuddyWater 归因只给出中等置信。报告没有测量具体产品漏报率。LunarWeb 的 output URL
        是可控能力，但有限观察的命令包使用同一 command/output URL，故不能把它写成已观察的功能分离案例。
      en: Talos directly describes BlackWater retrieving a component from one server and returning enumeration data to
        a different C2, while attributing the campaign to MuddyWater only with moderate confidence. The report does not
        measure a product miss rate. LunarWeb has a controllable output URL capability, but the limited observed command
        packages used the same command and output URL, so it cannot be written as an observed functional-separation case.
