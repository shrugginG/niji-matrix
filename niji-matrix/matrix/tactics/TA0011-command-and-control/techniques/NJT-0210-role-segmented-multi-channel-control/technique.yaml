research:
  limitations:
    paragraphs:
    - zh: APT30、Juniper 与 BlackWater 直接支持不同的角色交接；LunarWeb 只直接支持首次联系与命令 URL 分工，有限恢复样本中 output URL 与 command URL 相同，不能将其写成已观察的任务—结果分离。
      en: APT30, Juniper, and BlackWater directly support distinct role handoffs. LunarWeb directly supports first-contact
        and command URL roles only; in limited recovered samples the output and command URLs were the same, so observed
        task-result separation cannot be claimed.
    - zh: 内容不可见、内存配置、进程注入、长延迟和共享 CDN 会破坏谱系。零至六十分钟、七日和二十四小时窗口是工程起点，必须按软件首次运行、更新、远程支持和企业 agent 基线调整；多个域名或进程阶段本身不证明多个 C2
        通道。
      en: Opaque content, in-memory configuration, process injection, long delay, and shared CDNs break lineage. Zero-to-sixty-minute,
        seven-day, and twenty-four-hour windows are engineering starting points that require calibration to software
        first run, update, remote support, and enterprise-agent baselines. Multiple domains or process stages alone do
        not prove multiple C2 channels.
