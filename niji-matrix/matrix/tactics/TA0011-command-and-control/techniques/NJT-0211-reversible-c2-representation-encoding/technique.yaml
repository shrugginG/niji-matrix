schema_version: 2.0.0
type: technique
id: NJT-0211
name:
  zh: C2 可逆表示编码
  en: Reversible C2 Representation Encoding
summary:
  zh: 攻击者将 C2 命令或结果转换为可逆的字符或二进制表示，使防守方在完成正确规范化前无法直接使用原始控制语义。
  en: An adversary transforms C2 commands or results into a reversible character or binary representation so defenders
    cannot directly use the original control semantics before correct normalization.
aliases:
- T1132
- Data Encoding
classification:
  tactic_refs:
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1132
    source_attack_version: '19.1'
  decision_ref: DEC-TA0011-T1132
definition_and_concept:
  paragraphs:
  - zh: C2 可逆表示编码是攻击者对正在传输的命令、任务参数、主机标识或执行结果施加一个或多个可重放变换，使接收端能够按对应逆变换恢复原字节，而防守传感器首先看到 Base-N、十六进制、转义文本、修改字母表、压缩流或其组合。直接目的是把可解释的控制语义推迟到恢复边界之后，而不是建立通道、保护通信机密性或改变消息所属服务。
    en: Reversible C2 Representation Encoding is the application of one or more replayable transforms to commands, task
      parameters, host identifiers, or execution results in transit, allowing the receiver to restore original bytes
      through corresponding inverse transforms while the defender first sees Base-N, hexadecimal, escaped text, a modified
      alphabet, a compressed stream, or a combination. Its direct purpose is to postpone interpretable control semantics
      until after the recovery boundary, rather than establish a channel, protect communication confidentiality, or change
      the service role claimed by the message.
  - zh: 概念锚是原始 C2 语义、传输中表示、按确定顺序执行的变换链、接收端恢复结果和控制后果。Base64、十六进制、gzip、XOR 或自定义表只是实现名称；标准或非标准并不改变根本行为。只有来源证明攻击者有意对 C2 内容施加变换，并能把可见表示连接到恢复命令或结果时，才进入本技术。协议为互操作强制执行的编码以及没有恶意控制语义的压缩不属于本项。
    en: The conceptual anchors are original C2 semantics, in-transit representation, an ordered transform chain, receiver-side
      recovery, and a control outcome. Base64, hexadecimal, gzip, XOR, and custom tables are implementation names; whether
      an encoding is standard does not change the behavior. Classification requires evidence that the adversary deliberately
      transformed C2 content and a link from visible representation to a recovered command or result. Encoding mandated
      by a protocol for interoperability and compression without malicious control semantics are outside scope.
stealth_characteristics:
  paragraphs:
  - zh: 表示变换会移除或重排原命令关键字、路径、参数、文件头和结果文本，使只对原始网络缓冲区运行字符串、正则或文件签名的规则不能直接命中。多层链还让一次规范化只得到中间表示，自定义字母表会使默认 Base64 解析失败。防守方看到的长度、字符分布和格式标识仍然存在，但若没有正确的层序、参数或字母表，这些痕迹不能直接还原控制语义。
    en: Representation transforms remove or rearrange original command keywords, paths, parameters, file headers, and
      result text, preventing string, regular-expression, or file signatures applied only to the raw network buffer from
      matching directly. Layered chains leave an intermediate representation after one normalization pass, and a custom
      alphabet can defeat a default Base64 parser. Length, character distribution, and format markers remain visible,
      but without the correct layer order, parameters, or alphabet they do not directly recover control semantics.
  - zh: 残余痕迹包括编码字母表约束、填充和长度关系、解码/解压例程、变换参数、输入输出摘要、网络对象与端点进程的连接，以及恢复后立即出现的命令执行、文件动作或回传。保存原始对象并递归记录每层输入输出的防守方可以恢复语义；TLS
      不可见、内容未留存、密钥缺失、专有变换或资源上限会形成盲区。高熵或长 Base64 字符串单独只支持待规范化对象，不能证明恶意。
    en: Residual traces include alphabet constraints, padding and length relationships, decode or decompression routines,
      transform parameters, input and output digests, linkage between the network object and endpoint process, and command
      execution, file activity, or return traffic immediately after recovery. A defender preserving the original and
      recording every layer's input and output can restore semantics. Opaque TLS, absent content retention, missing keys,
      proprietary transforms, or resource limits create blind spots. High entropy or a long Base64 string alone supports
      only a normalization candidate, not a malicious conclusion.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求同时具备 C2 语境、攻击者控制的可逆表示变换、接收端恢复能力以及恢复后的命令或结果证据。标准库调用与自定义解码器均可成立，算法是否公开不是判定条件。合法邮件 MIME、HTTP URL 编码、JSON 转义、协议规定的二进制到文本转换、备份压缩、软件更新包和性能型
      Content-Encoding 是正常反例；只有当相同表示被攻击者用于隐藏恶意控制语义，并形成恢复结果链时才分类。
    en: Inclusion requires a C2 context, an attacker-controlled reversible representation transform, receiver recovery
      capability, and evidence of the recovered command or result. A standard library call and a custom decoder can both
      qualify; public availability of the algorithm is not a criterion. Legitimate mail MIME, HTTP URL encoding, JSON
      escaping, protocol-required binary-to-text conversion, backup compression, software-update packages, and performance-oriented
      Content-Encoding are normal counterexamples. Classification applies only when the adversary uses the representation
      to conceal malicious control semantics and a recovery-outcome chain exists.
  - zh: '`NJS-0115-001` 唯一拥有“可重放可逆表示链”这一原生变量；当证据能够恢复 C2 编码链时，事件应同时归入本父级和该跨战术子项，而不在 T1132 下复制子项。`NJT-0152` 只在攻击者额外加入无意义字节、把语义分散到载体字段或伪造产品服务契约时并列；纯编码不满足消息混淆子项。`T1573`
      负责密码变换带来的机密性，即使密文随后 Base64 化也应把加密和编码分别归类。`T1001` 的噪声、载体和服务伪装，及普通压缩和协议编码，均不能由“存在 Base64”推定。'
    en: '`NJS-0115-001` uniquely owns the Niji-native variable of a replayable reversible representation chain. When
      evidence recovers a C2 encoding chain, the event should co-classify under this parent and that cross-tactic child
      without duplicating a T1132 child. `NJT-0152` co-applies only when the actor additionally inserts inert bytes,
      distributes semantics across carrier fields, or forges a product-service contract; plain encoding does not satisfy
      its children. `T1573` owns confidentiality from cryptographic transformation, so encryption and later Base64 representation
      are classified separately. Noise, carrier or service camouflage under `T1001`, ordinary compression, and protocol
      encoding cannot be inferred from the mere presence of Base64.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在 HTTP C2 中，植入可以先把主机标识转为 UTF-16，按流量密钥和样本密钥执行 XOR，再 Base64 与 URL 编码后放入表单参数；服务端按逆序恢复。入站响应可在 HTML 注释中携带另一条多层编码任务，植入恢复出
        `dir` 等命令并执行，再对输出执行同一类链后 POST 回传。SpecCom 提供完整实例。TDrop2 则说明自定义 Base64 字母表只是另一实现，仍须解码并解密才出现 `tick` 命令和参数。
      en: 'In HTTP C2, an implant can convert a host identifier to UTF-16, apply XOR with traffic and sample keys, then
        Base64- and URL-encode it into a form parameter for inverse recovery by the server. An inbound response can carry
        another layered task inside an HTML comment; the implant recovers a command such as `dir`, executes it, and applies
        a similar chain to returned output. SpecCom provides a complete instance. TDrop2 shows that a custom Base64 alphabet
        is another implementation: decoding and decryption are still required before `tick` commands and parameters appear.'
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制发送端变换与接收端逆变换，选择能通过承载字段字符、长度和解析约束的表示，并处理填充、分块和错误。多层或专有变换可能增加带宽、CPU、实现缺陷和互操作失败；解码器、固定字母表、流量密钥及恢复顺序也会成为稳定分析点。若真正目标是机密性，还必须另行管理密码密钥并承担
          T1573 的成本，编码本身不提供该性质。
        en: The adversary must control the sender transform and receiver inverse, choose a representation compatible
          with carrier character, length, and parsing constraints, and handle padding, chunking, and errors. Multiple
          or proprietary layers increase bandwidth, CPU, implementation defects, and interoperability failures. Decoders,
          fixed alphabets, traffic keys, and recovery order also become stable analytic points. If confidentiality is
          the real objective, the actor must separately manage cryptographic keys and accept T1573 costs because encoding
          itself does not provide that property.
    defender_model:
      paragraphs:
      - zh: 防守方假定可在合法授权下取得原始 HTTP、DNS、邮件或其他消息对象，保留会话与对象标识，并把网络内容连接到发起/接收进程和后继动作。规范化流水线能够识别候选表示、限制递归深度与总展开量、记录每层输入输出摘要和失败原因，并把恢复对象重新送入内容检测。若只能看到五元组或
          TLS 元数据，最多能报告字符/长度形态，不能声称已恢复编码命令。
        en: The defender is assumed to lawfully obtain raw HTTP, DNS, mail, or other message objects, retain session
          and object identifiers, and join network content to sending or receiving processes and successor actions. A
          normalization pipeline identifies candidate representations, limits recursion depth and total expansion, records
          every layer's input and output digests plus failure reason, and resubmits recovered objects to content detection.
          If only five-tuples or TLS metadata are visible, the defender can report character or length shape at most
          and cannot claim a recovered encoded command.
      - zh: 协议解析器应先给出字段的合法编码要求和内容边界，再对不需要编码或恢复后含控制语义的对象提高优先级。Snort 的 Base64 解码缓冲区证明可以把检测游标放到规范化结果，Zeek 的 uid/fuid 可连接
          HTTP 事务和文件对象；这些文档只证明实现字段与操作，不证明阈值、误报率或未知字母表自动恢复。生产策略必须保留正常 MIME、认证头和业务压缩基线。
        en: Protocol parsers should first supply legitimate encoding requirements and content boundaries, then prioritize
          representations not required by the protocol or whose recovered content contains control semantics. Snort's
          Base64 decoded buffer shows that a detection cursor can operate on normalized output, and Zeek uid or fuid
          can join HTTP transactions and file objects. These documents establish implementable fields and operations,
          not thresholds, false-positive rates, or automatic recovery of unknown alphabets. Production policy must preserve
          baselines for normal MIME, authentication headers, and business compression.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 传输表示在恢复前不直接揭示控制语义
    en: In-transit representation does not directly reveal control semantics before recovery
  analysis:
    paragraphs:
    - zh: 攻击者按确定链把命令或结果从可解释字节转换成编码、转义或压缩表示，网络和日志痕迹首先保存变换后对象；防守方若只检查这一层，原关键词和结构不存在，必须重放逆变换才能理解。接收端恢复后执行或回传完成从表示差到控制结果的因果链，形成数据遮蔽。SpecCom
        与 TDrop2 均提供可复核输入、恢复步骤和恶意结果；具体产品是否漏报未被测量。
      en: The adversary converts commands or results from interpretable bytes into encoded, escaped, or compressed representations
        through an ordered chain, causing network and log traces to retain the transformed object first. Original keywords
        and structure are absent for a defender inspecting only that layer, and inverse transforms are required for interpretation.
        Receiver recovery followed by execution or return completes the causal chain from representation difference to
        control outcome, producing Data Obscuration. SpecCom and TDrop2 provide reproducible inputs, recovery steps,
        and malicious results; no source measures a particular product miss.
  evidence_refs:
  - REF-000625
  - REF-001056
  - REF-001057
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本父级不建立 Niji 子技术。标准/非标准编码、Base64/hex/custom alphabet、单层/多层和算法名称都是实现类别；可逆表示的稳定变量及恢复路径已由跨战术 NJS-0115-001 唯一拥有，充分恢复时可并列归类。
      en: This parent defines no Niji children. Standard or nonstandard encoding, Base64, hexadecimal, custom alphabets,
        one or several layers, and algorithm names are implementation categories. Cross-tactic NJS-0115-001 uniquely
        owns the stable reversible-representation variable and recovery path and may be co-classified when recovery is
        established.
    - zh: 若编码之外另有无意义字段、载体分离或服务契约伪装，可再并列 NJT-0152；密码机密性归 T1573。证据只能确认编码而无法重放恢复时，留在父级并降低置信度。
      en: When inert fields, carrier separation, or service-contract camouflage exists beyond encoding, NJT-0152 can
        also apply. Cryptographic confidentiality belongs to T1573. If evidence identifies encoding but cannot replay
        recovery, retain the parent at lower confidence.
  coverage: none-justified
  subtechnique_refs: []
