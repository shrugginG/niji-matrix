research:
  limitations:
    paragraphs:
    - zh: SpecCom 与 TDrop2 都是结论级样本逆向，分别证明多层标准表示与自定义字母表能够在接收端恢复控制语义；二者没有公开生产网络中的检测命中率、漏报率或正常业务基线。TDrop2 同时加密和编码，必须分别归入
        T1573 与 T1132，不能把密码效果归功于自定义 Base64。SpecCom 同时使用 HTML 注释载体和 XOR，只有各层证据明确时才能进一步并列 NJT-0152。
      en: SpecCom and TDrop2 are conclusion-level sample analyses establishing receiver recovery of control semantics
        through layered standard representation and a custom alphabet respectively. Neither provides production-network
        sensitivity, miss rates, or normal-business baselines. TDrop2 both encrypts and encodes, so T1573 and T1132 must
        be classified separately and cryptographic effect cannot be attributed to custom Base64. SpecCom also uses an
        HTML-comment carrier and XOR, and further NJT-0152 co-classification requires evidence for each independent layer.
    - zh: RFC 4648 说明 Base-N 本来服务于互操作，并允许因 URL、文件名或协议约束选择不同字母表；因此“标准 Base64”“去掉填充”或“字符替换”不自动代表攻击。Snort 文档只证明标准 Base64
        可被指定位置解码，Zeek 文档只证明事务和文件关联字段；未知自定义表、压缩炸弹、嵌套编码、内容不可见和端点进程缺失仍需专用分析与本地资源限制。
      en: RFC 4648 shows that Base-N normally serves interoperability and that URLs, filenames, or protocol constraints
        can require different alphabets. Standard Base64, omitted padding, or character substitution therefore does not
        automatically indicate attack. Snort documentation only establishes standard Base64 decoding at selected locations,
        and Zeek documentation only establishes transaction and file linkage fields. Unknown custom tables, decompression
        bombs, nested encoding, opaque content, and missing endpoint process identity still require specialized analysis
        and local resource limits.
    - zh: '`NJT-0115` 的范围包含文件、脚本、命令和传输内容，直接复用可避免变量重复，但 T1132 仍需独立 TA0011 父级以表达 C2 结果门。这个双层建模依赖人工评审确认页面导航、证据引用和战术计数不会把
        NJT-0115 的其他三个子项错误带入 TA0011；在正式写入前应由主 Agent 检查 schema 与 Web 展示。'
      en: '`NJT-0115` covers files, scripts, commands, and in-transit content, so reuse prevents duplicate variables,
        while T1132 still needs an independent TA0011 parent to express the C2 outcome gate. This two-level model needs
        human review to ensure navigation, evidence references, and tactic counts do not pull NJT-0115''s other three
        children into TA0011 incorrectly. The primary agent should verify schema and Web presentation before canonical
        writing.'
