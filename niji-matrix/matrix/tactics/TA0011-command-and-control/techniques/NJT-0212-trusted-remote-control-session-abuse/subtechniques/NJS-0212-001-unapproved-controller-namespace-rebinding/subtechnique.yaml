schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0212-001
parent_ref: NJT-0212
name:
  zh: 未批准控制端命名空间重绑定
  en: Unapproved Controller-Namespace Rebinding
summary:
  zh: 攻击者把目标 agent、IDE tunnel 或远控设备绑定到其控制的 vendor tenant、账号或 controller ID，使合法产品通道归属外部操作者。
  en: The actor binds a target agent, IDE tunnel, or remote-control device to an actor-controlled vendor tenant, account,
    or controller ID, making a legitimate product channel belong to an outside operator.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 未批准控制端命名空间重绑定是攻击者把目标上的合法 agent、IDE tunnel 或远控设备注册到其控制的 vendor tenant、账号、workspace 或 controller ID，并随后建立交互会话。直接目标是让受信产品能力归属于组织外操作者，而不是替换产品二进制。
    en: Unapproved Controller-Namespace Rebinding registers a legitimate agent, IDE tunnel, or remote-control device
      on the target to an actor-controlled vendor tenant, account, workspace, or controller ID and then establishes an
      interactive session. Its direct aim is to place a trusted product capability under an outside operator without
      replacing the product binary.
  - zh: 分类变量是 endpoint capability 与 controller namespace 的绑定所有权变化。账号如何取得、agent 如何安装、tunnel 使用何种协议或产品名称都属于相邻或实现事实。
    en: The variable is a change in ownership of the binding between endpoint capability and controller namespace. Account
      acquisition, agent installation, tunnel protocol, and product name are adjacent or implementation facts.
stealth_characteristics:
  paragraphs:
  - zh: 未批准控制端命名空间重绑定让软件清单只看到合法签名 agent 或 IDE，而控制平面记录新的 tenant/account/controller、capability ID 和首次会话。端点新增 service/tunnel、provider
      egress、identity sign-in、首次 shell/file 操作和重连仍是残余。
    en: Unapproved Controller-Namespace Rebinding leaves software inventory showing a legitimate signed agent or IDE
      while the control plane records a new tenant, account, controller, capability ID, and first session. A new endpoint
      service or tunnel, provider egress, identity sign-in, first shell or file action, and reconnection remain residuals.
  - zh: 只有工具名或首次 provider 连接不能证明重绑定。防守必须解析 controller namespace 并与批准 tenant/account/app/capability registry 比较，再连接真实
      session 和控制结果。
    en: Tool name or first provider connection alone does not prove rebinding. Defenders must resolve the controller
      namespace, compare it with approved tenant, account, application, and capability inventory, and join a real session
      and control outcome.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入合法远控 capability 被注册到未批准 controller namespace 且产生会话/结果的活动。排除批准开发 tunnel、MSP onboarding、替换 agent 和测试。账号/令牌取得归身份技术，文件到达/执行/持久化和代理/隧道可并列记录。
    en: Include legitimate remote-control capability registered to an unapproved controller namespace with a session
      or outcome. Exclude approved developer tunnels, MSP onboarding, replacement agents, and testing. Account or token
      acquisition belongs to identity techniques; file arrival, execution, persistence, and proxy or tunneling can be
      co-recorded.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Operation Digital Eye 使用 GitHub 认证的 VS Code tunnel 把目标绑定到外部控制；其他 RMM 事件证明同一变量不依赖单一产品。
      en: Operation Digital Eye used a GitHub-authenticated VS Code tunnel to bind the target to outside control. Other
        RMM incidents show the variable is not product-specific.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需能在目标运行或配置合法 capability，拥有可用 controller identity，并通过 provider 建立会话。租户策略、设备注册限制、token 撤销和快速 unregister
          会增加成本。
        en: The actor needs to run or configure a legitimate capability on the target, own a usable controller identity,
          and establish a provider session. Tenant policy, device-registration limits, token revocation, and rapid unregister
          raise cost.
    defender_model:
      paragraphs:
      - zh: 防守方需要端点 service/process/network、provider enrollment、tenant/account/controller、identity sign-in、capability
          ID、first session 和后继动作。外部 tenant 审计缺失时只能依赖端点和批准登记降置信判断。
        en: Defenders need endpoint service, process, and network events; provider enrollment; tenant, account, and controller;
          identity sign-in; capability ID; first session; and successor actions. Missing outside-tenant audit leaves
          lower-confidence endpoint and inventory evidence.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 合法远控产品身份掩护外部控制命名空间
    en: Legitimate remote-control product identity covers an outside controller namespace
  analysis:
    paragraphs:
    - zh: 攻击者保留受信 binary/vendor 外观，只改变 capability 的 tenant/account/controller 绑定。软件允许规则因此误把会话视作正常产品流量；控制平面 enrollment、身份和端点结果能恢复真实所有权。
      en: The actor preserves trusted binary and vendor appearance while changing the capability’s tenant, account, or
        controller binding. Software allow rules can misclassify the session as normal product traffic; control-plane
        enrollment, identity, and endpoint outcome recover real ownership.
