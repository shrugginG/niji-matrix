schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0212-002
parent_ref: NJT-0212
name:
  zh: 批准工作流脱离的受信远控会话
  en: Approval-Detached Trusted Remote-Control Session
summary:
  zh: 攻击者建立技术上有效的合法远控 session，但其 operator、target、ticket、consent、access mode 或时间不匹配组织批准流程。
  en: The actor establishes a technically valid legitimate remote-control session whose operator, target, ticket, consent,
    access mode, or time does not match organizational approval workflow.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 批准工作流脱离的受信远控会话是攻击者通过合法远控能力建立技术上有效的交互 session，但其 operator、target、ticket、consent、access mode 或时间与组织批准记录缺失、过期或不匹配。直接目标是借真实认证与产品信任掩护未授权控制。
    en: Approval-Detached Trusted Remote-Control Session is a technically valid interactive session through a legitimate
      remote-control capability whose operator, target, ticket, consent, access mode, or time is missing, expired, or
      inconsistent with organizational approval. Its direct aim is to cover unauthorized control with genuine authentication
      and product trust.
  - zh: 分类变量是 session-to-approval 关系而非工具是否允许、用户是否真实点击同意或账号是否有效。既有 session 被另一主体接管才属于 NJT-0151。
    en: The variable is the session-to-approval relationship, not whether the tool is allowed, the user genuinely clicked
      consent, or the account is valid. Takeover of another principal’s existing session belongs to NJT-0151.
stealth_characteristics:
  paragraphs:
  - zh: 批准工作流脱离的受信远控会话让 provider、agent 和身份系统都记录真实成功会话，单看签名、认证或同意呈现正常。ticket、实名操作者、目标、权限、时间、同意证据及会话后子进程/文件却无法闭合，构成残余差分。
    en: Approval-Detached Trusted Remote-Control Session leaves provider, agent, and identity systems with a genuine
      successful session, so signature, authentication, or consent alone looks normal. Ticket, named operator, target,
      privilege, time, consent evidence, and post-session process or file action fail to close and remain a differential.
  - zh: 紧急支持、MSP 交接和事件响应可能事后补票。检测应保留 session 事实与授权状态分层，不能因工单缺失立即判恶，也不能因真实用户同意自动放行。
    en: Emergency support, MSP handoff, and incident response may receive retrospective approval. Detection keeps session
      fact and authorization state separate, neither treating a missing ticket as automatically malicious nor a genuine
      consent click as automatically allowed.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入真实远控 session 与批准工作流属性不匹配并产生交互控制后果的活动。排除批准 helpdesk、开发、自助支持、容灾与 IR。欺骗用户、有效账号或新 agent 注册可并列，但不取代 workflow 结果门。
    en: Include real remote sessions whose attributes conflict with approved workflow and produce interactive-control
      outcomes. Exclude approved helpdesk, development, self-support, disaster recovery, and incident response. User
      deception, valid accounts, or new agent enrollment can coexist but do not replace the workflow gate.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Storm-1811 滥用 Quick Assist 并诱导用户允许控制；Scattered Spider 活动展示 helpdesk/RMM 在正常产品流程内脱离组织批准。
      en: Storm-1811 abused Quick Assist and induced users to permit control. Scattered Spider activity shows helpdesk
        and RMM use departing from organizational approval within legitimate product flows.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需取得 helper/operator 身份或诱导 consent，并在允许产品中建立 session。实名绑定、抗钓鱼 MFA、JIT 票据、权限最小化、录制与自动到期会提高成本。
        en: The actor needs a helper or operator identity or induced consent and must establish a session in an allowed
          product. Named identity binding, phishing-resistant MFA, JIT tickets, least privilege, recording, and automatic
          expiry raise cost.
    defender_model:
      paragraphs:
      - zh: 防守方需 provider session ID、controller principal/tenant、目标设备、access mode、start/end、consent 与 identity correlation，以及工单中的批准主体、目标、scope、窗口和
          owner，再连接端点后果。
        en: Defenders need provider session ID, controller principal and tenant, target device, access mode, start and
          end, consent and identity correlation, plus approved principal, target, scope, window, and owner from the ticket,
          joined to endpoint outcomes.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实产品会话与认证外观掩盖授权工作流偏差
    en: Genuine product session and authentication appearance cover an authorization-workflow deviation
  analysis:
    paragraphs:
    - zh: 攻击者利用真实 agent、认证和可能的用户同意，使会话具备正常外观；恶意差异存在于 session 与 ticket/operator/target/scope/time 的关系。粗粒度产品信任失去区分力，精确工作流和后果关联恢复差异。
      en: The actor uses a real agent, authentication, and possibly user consent, giving the session normal appearance.
        The malicious difference lies in the relationship between session and ticket, operator, target, scope, and time.
        Coarse product trust loses discrimination, while exact workflow and outcome correlation restores it.
