research:
  limitations:
    paragraphs:
    - zh: 公开案例证明合法远控能力被用于外部控制、工作流脱离和带外设备，但提供方、工单、用户同意、KVM 会话与物理保管数据通常不完整。工具、认证、同意或 HID 事件任一单独信号不能定性，窗口与允许命名空间必须按业务校准。
      en: Public cases establish legitimate remote-control capability used for outside control, workflow detachment,
        and out-of-band devices, but provider, ticket, user-consent, KVM-session, and custody data are often incomplete.
        Tool, authentication, consent, or HID signals alone are insufficient, and windows and approved namespaces require
        business calibration.
