schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0212-003
parent_ref: NJT-0212
name:
  zh: 带外远控观察置换
  en: Out-of-Band Remote-Control Observation Displacement
summary:
  zh: 攻击者通过宿主 OS 外的 KVM 或等价控制平面取得视频和注入输入，使宿主把远程操作呈现为本地外设/用户行为。
  en: The actor obtains video and injects input through a KVM or equivalent control plane outside the host OS, causing
    the host to present remote operation as local peripheral or user behavior.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 带外远控观察置换是攻击者通过宿主 OS 外的 KVM、BMC 或等价控制设备取得视频并注入键盘/鼠标输入，使远端网络会话终止于独立设备而非宿主。直接目标是让宿主把远程操作呈现为本地外设或用户行为。
    en: Out-of-Band Remote-Control Observation Displacement uses a KVM, BMC, or equivalent device outside the host OS
      to obtain video and inject keyboard or mouse input, terminating the remote network session at an independent device
      rather than the host. Its direct aim is to have the host present remote operation as local peripheral or user behavior.
  - zh: 分类变量是控制平面与宿主观察域分离，而非硬件产品名。物理引入/首次访问归 T1200，自动 HID 执行归 NJS-0071-003，controller VPN/proxy 归 T1090。
    en: The variable is separation between control plane and host observation domain rather than hardware product name.
      Physical introduction or first access belongs to T1200, automated HID execution to NJS-0071-003, and controller
      VPN or proxy to T1090.
stealth_characteristics:
  paragraphs:
  - zh: 带外远控观察置换让远程网络流和视频停留在 KVM/BMC，宿主 EDR 只见新 HID/video/USB/EDID 与本地输入或屏幕结果，没有 remote agent/process/connection。设备 IP/MAC/switch
      port、controller account/session、PnP 事件和物理保管仍是残余。
    en: Out-of-Band Remote-Control Observation Displacement keeps remote network flow and video at the KVM or BMC while
      host EDR sees a new HID, video, USB, or EDID device and local-looking input or display outcome without a remote
      agent, process, or connection. Device IP, MAC, switch port, controller account and session, PnP events, and physical
      custody remain residuals.
  - zh: 只看宿主进程和网络的规则会失去观察面；只看 HID 事件又不能证明远程 controller。必须跨端点、NAC/switch、远控设备审计、资产和保管记录连接。
    en: Rules limited to host processes and network lose the observation surface, while HID events alone do not prove
      a remote controller. Endpoint, NAC or switch, device audit, asset, and custody records must be joined.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入持续或交互远控 session 通过宿主外设备产生主机动作。排除批准数据中心 KVM、辅助设备、实验自动化、break-glass 管理，以及只有硬件接入但没有远控会话/结果的情况。
    en: Include continuing or interactive remote sessions that produce host actions through an off-host device. Exclude
      approved data-center KVM, accessibility devices, lab automation, break-glass management, and hardware attachment
      without a remote session or outcome.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: DPRK IT worker 活动中的 IP-KVM/laptop farm 与 PiKVM 案例展示独立设备、独立网络和宿主本地外设表象可用于远程控制。
      en: IP-KVM or laptop-farm and PiKVM cases in DPRK IT-worker activity show how an independent device and network
        can provide remote control while appearing as local peripherals to the host.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者或协助者需物理连接设备、提供独立网络、掌握 controller credentials 并维持设备不被资产巡检发现。NAC、端口安全、USB inventory 和保管审计会增加成本。
        en: The actor or facilitator needs physical attachment, separate networking, controller credentials, and avoidance
          of asset inspection. NAC, port security, USB inventory, and custody audit raise cost.
    defender_model:
      paragraphs:
      - zh: 防守方需宿主 PnP/USB/HID/video 事件、设备指纹、KVM/BMC IP/MAC/账号/session、交换机端口/NAC、资产位置与保管人，并连接 session 期间的宿主动作。
        en: Defenders need host PnP, USB, HID, and video events; device fingerprint; KVM or BMC IP, MAC, account, and
          session; switch port and NAC; asset location and custodian; and host actions during the session.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 带外控制平面把远程会话置于宿主常规遥测之外
    en: An out-of-band control plane places the remote session outside routine host telemetry
  analysis:
    paragraphs:
    - zh: 网络会话终止在独立 KVM/BMC，宿主只接收外设输入并产生本地动作，远控进程和连接在 EDR 中缺失，形成观察盲区。多视点资产、网络和设备审计可恢复关系。
      en: The network session terminates at an independent KVM or BMC, and the host receives peripheral input and produces
        local action. Remote-control process and connection are absent from EDR, creating an observation gap that multi-vantage
        asset, network, and device audit can recover.
