schema_version: 2.0.0
type: technique
id: NJT-0212
name:
  zh: 受信远控会话滥用
  en: Trusted Remote-Control Session Abuse
summary:
  zh: 攻击者滥用合法远控软件、开发隧道或带外控制设备建立交互通道，使受信代理、服务工作流或宿主外控制平面掩盖真实操作者。
  en: Adversaries abuse legitimate remote-control software, development tunnels, or out-of-band control devices to establish
    interactive channels in which a trusted agent, service workflow, or off-host control plane obscures the real operator.
aliases:
- T1219
- Remote Access Tools
classification:
  tactic_refs:
  - TA0011
  origin:
    kind: attack-adapted
    source_attack_id: T1219
    source_attack_version: '19.1'
  decision_ref: DEC-TA0011-T1219
definition_and_concept:
  paragraphs:
  - zh: 合法远控通道滥用是攻击者让商业/开源远程支持代理、IDE tunnel、远程开发服务、浏览器协助工具、EDR 响应功能或网络 KVM 等真实管理能力，在目标与攻击者控制端之间建立可查看、输入、终端、文件或调试操作的交互关系。工具可以既有、便携安装、由用户启动、作为服务持久化或位于宿主之外。直接目的在于以产品原生会话持续操控目标，而不是仅转发任意字节或完成一次命令。
    en: Legitimate Remote-Control Channel Abuse is adversary use of a genuine management capability such as a commercial
      or open-source remote-support agent, IDE tunnel, remote-development service, browser assistance tool, EDR response
      feature, or network KVM to establish an interactive relationship for viewing, input, terminal, file, or debugging
      operations between target and attacker controller. The capability may be preexisting, portably installed, user-started,
      service-persistent, or located outside the host. Its direct purpose is continuing control through a product-native
      session rather than merely forwarding arbitrary bytes or completing one command.
  - zh: 判定至少需要 target、remote-control capability、controller/session 和可核查结果。agent/service/tunnel/device 的安装或注册只是暴露或准备；vendor
      登录只证明控制面访问；外联到知名远控域只证明网络关系；必须进一步看到 session 建立、输入/terminal/file/debug 功能被启用或由该 session 产生的目标动作。产品签名、合法 vendor 和真实用户同意均不是自动授权，需与组织控制命名空间及工单/同意流程比较。
    en: Classification requires at least a target, remote-control capability, controller or session, and a reviewable
      outcome. Installation or registration of an agent, service, tunnel, or device is exposure or preparation; vendor
      login establishes control-plane access only; egress to a known remote-tool domain establishes a network relationship
      only. A session must then be established, an input, terminal, file, or debug capability enabled, or a target action
      produced by that session. Product signature, legitimate vendor, and real user consent do not automatically establish
      organizational authorization and must be compared with approved controller namespaces and ticket or consent workflow.
stealth_characteristics:
  paragraphs:
  - zh: 合法远控通道保留真实签名、vendor relay、加密协议和常见支持/开发进程，因此端点与边界可把会话解释为帮助台、MSP、开发或设备运维。攻击者若把目标绑定到其 GitHub/Microsoft/RMM tenant、使用一次性
      Quick Assist code 或控制 IP-KVM，实际操作者不会直接呈现为恶意 C2 域。粗粒度 application allowlist、vendor reputation 和 agent 进程白名单失去区分，真实
      controller account/tenant/device 与 workflow approval 才是关键差异。
    en: A legitimate remote-control channel preserves real signatures, vendor relays, encrypted protocols, and common
      support or development processes, so endpoint and boundary views may interpret it as help desk, MSP, development,
      or device operations. When an actor binds a target to an attacker GitHub, Microsoft, or RMM tenant, uses a one-time
      Quick Assist code, or controls an IP-KVM, the real operator does not appear as a malicious C2 domain. Coarse application
      allowlists, vendor reputation, and agent-process exclusions lose discrimination; real controller account, tenant,
      or device plus workflow approval provide the critical difference.
  - zh: 残余痕迹分布在不同平面。软件/IDE 分支留下安装或 portable execution、service/autorun、agent/device/tunnel ID、controller identity、provider
      session、outbound relay、子进程、文件和终端动作；硬件分支可能没有宿主远控进程，却会留下新 HID/video/USB/EDID、IP/MAC/交换端口、KVM 管理登录及看似本地的输入结果。若 provider
      只短期保留或不向客户暴露 controller/session，宿主日志只见签名代理，会形成重要盲区。
    en: Residual evidence is distributed across planes. Software and IDE branches leave install or portable execution,
      service or autorun, agent, device, or tunnel ID, controller identity, provider session, outbound relay, child process,
      file, and terminal action. The hardware branch may have no host remote-control process but leaves a new HID, video,
      USB, or EDID device, IP and MAC and switch port, KVM-management login, and input outcomes that look local. Where
      a provider retains data briefly or does not expose controller or session information, host logs show only a signed
      agent and a material blind spot remains.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入合法远控能力实际建立未授权交互控制，并要求 agent/tunnel/device、controller/session 与 target outcome 的可连接证据。合法帮助台、MSP、IDE 开发、实验室 KVM、灾备控制和安全响应是强反例；应按批准
      tenant/account、工具/设备、目标、ticket/change、用户同意、访问模式、时间与动作排除。未知远控进程或设备本身只形成 exposure，未看到 session/outcome 时不完成父项。
    en: Scope includes actual unauthorized interactive control established through a legitimate remote-control capability
      and requires joinable evidence among agent, tunnel, or device, controller or session, and target outcome. Approved
      help desk, MSP, IDE development, laboratory KVM, disaster-recovery control, and security response are strong counterexamples
      and must be excluded by approved tenant or account, tool or device, target, ticket or change, user consent, access
      mode, time, and action. An unknown remote-control process or device is exposure only and does not complete the
      parent without session or outcome.
  - zh: T1133/NJT-0055 的直接对象是受害组织远程服务接受并建立入口或重入会话，并研究 token/session 与风险情境；T1219 的直接对象是合法远控产品工作流/控制能力成为 C2。某远控平台既是外部入口又承担交互控制时可并列，但产品名不替代
      T1133 的服务接受结果。有效账户、OAuth token、GitHub/Microsoft/RMM account 及地理/设备情境分别是身份或会话前提；只有远控 session 和目标动作完成 T1219。
    en: T1133 and NJT-0055 directly concern a victim remote service accepting and establishing an ingress or reentry
      session and analyze token or session state and risk context. T1219 directly concerns a legitimate remote-control
      product workflow or capability becoming C2. A remote-access platform that serves both as external entry and interactive
      control may co-classify, but product name cannot replace T1133's service-acceptance outcome. A valid account, OAuth
      token, GitHub or Microsoft or RMM account, and geography or device context are identity or session prerequisites;
      only a remote-control session plus target action completes T1219.
  - zh: T1563/NJT-0151 要求攻击者接入另一主体已经认证并维持的传输/桌面，控制者与原 session owner 分离；T1219 通常由攻击者创建或使用其控制的合法工具 session。若攻击者劫持现有帮助台/IDE/RMM
      session，两个对象可并列，远程会话所有权与控制端治理只覆盖该所有权转换，不覆盖 T1219 的新 enrollment 与批准工作流偏差。远程会话状态—风险情境检测中的 session replay/风险情境同样不等于合法工具工作流滥用。
    en: T1563 and NJT-0151 require an adversary to enter another principal's already authenticated and maintained transport
      or desktop, separating current controller from original session owner. T1219 normally uses a legitimate tool session
      created or controlled by the attacker. Hijacking an existing help desk, IDE, or RMM session can co-classify. Remote Session Ownership and Controller Governance
      governs that ownership transition only and does not cover T1219's new enrollment or approval-workflow deviation.
      Remote session-state and risk-context detection of session replay and risk context likewise do not equal legitimate-tool workflow abuse.
  - zh: T1090 负责代理节点转发并改变网络路径，T1572 负责内层协议封装；IDE tunnel、RMM vendor relay 或 KVM VPN 可并列，但 T1219 要求交互控制语义。T1021/NJT-0183
      等 remote service 对象拥有新认证连接到目标和横向动作；NJT-0078 拥有 fleet job→agent 执行；单次 remote script/command 归相应远程管理执行。T1219 只拥有持续或可交互工具通道，不能吞并每个会话内命令、文件传输、权限改变或影响结果。
      T1200/硬件入口负责外设被引入并产生首次访问，NJS-0071-003 负责 HID 自动输入冒充用户并产生 Execution；带外远控子项要求远端 controller、宿主外控制平面和持续/交互输入—视频关系。一个
      PiKVM 可同时涉及三者，但物理存在、一次键盘序列或网络 KVM 登录不能互相替代证据。
    en: T1090 owns proxy relays and network-path change, while T1572 owns inner-protocol encapsulation. An IDE tunnel,
      RMM vendor relay, or KVM VPN may co-classify, but T1219 requires interactive-control semantics. Remote-service
      objects such as T1021 and NJT-0183 own a new authenticated connection to a target and lateral action. NJT-0078
      owns fleet job-to-agent execution, and a one-shot remote script or command belongs to the relevant remote-administration
      execution object. T1219 owns only the continuing or interactive tool channel and does not absorb every in-session
      command, file transfer, permission change, or impact result. T1200 or hardware-entry objects own introduction of
      a peripheral and first access, while NJS-0071-003 owns automated HID input impersonating a user and producing Execution.
      The out-of-band remote-control child requires a remote controller, a control plane outside the host, and a continuing
      or interactive input-to-video relationship. One PiKVM may involve all three, but physical presence, one keyboard
      sequence, and a network KVM login cannot substitute for one another's evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 已入侵 Windows 主机上，Operation Digital Eye 以 service 启动 Microsoft 签名 code.exe tunnel，使用 GitHub 账号注册 tunnel，再从 vscode.dev
        浏览器访问终端和文件系统。另一类活动中，Storm-1811 冒充支持人员取得用户 Quick Assist 许可，随后部署 ScreenConnect、NetSupport、AnyDesk、Qakbot、Cobalt
        Strike 或 ransomware。两者都借真实服务与工具，却分别突出 controller binding 和批准 workflow 偏差。
      en: On compromised Windows hosts, Operation Digital Eye starts Microsoft-signed code.exe tunnel as a service, registers
        the tunnel with a GitHub account, and accesses terminal and filesystem through vscode.dev in a browser. In another
        pattern, Storm-1811 impersonates support staff to obtain Quick Assist approval and then deploys ScreenConnect,
        NetSupport, AnyDesk, Qakbot, Cobalt Strike, or ransomware. Both borrow genuine services and tools but respectively
        foreground controller binding and approval-workflow deviation.
    - zh: 在远程雇佣/设备托管场景，DPRK IT worker 让公司 laptop 位于 facilitator 的 laptop farm，接入 IP-KVM 和多种远管工具，从境外操作者持续控制设备。Mandiant
        在多起响应中观察 IP-KVM 与 GoToRemote、Chrome Remote Desktop、AnyDesk、TeamViewer、RustDesk 等组合；Microsoft 后续案例记录四个 compromised
        accounts 连接 PiKVM 并出现数据窃取。这类控制可能绕过宿主远控进程检测，却仍留下硬件、网络与身份痕迹。
      en: In remote-employment and device-hosting scenarios, DPRK IT workers place corporate laptops in facilitator laptop
        farms, attach IP-KVM and several remote-management tools, and maintain control from an overseas operator. Mandiant
        observed IP-KVM together with GoToRemote, Chrome Remote Desktop, AnyDesk, TeamViewer, and RustDesk across incident
        responses. A later Microsoft case records four compromised accounts connecting PiKVM and data theft. Such control
        may bypass host remote-control process detection but still leaves hardware, network, and identity traces.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 软件/IDE 路径需要在目标启动或保留合法 agent/tunnel、控制 vendor/GitHub/Microsoft account 或 session code，并维持出站 relay；workflow
          滥用还需取得用户同意、被盗 operator 身份或能避开工单核验。硬件路径需要物理安装/托管者协助、独立网络和 KVM controller 凭据。攻击者须处理 MFA、tenant restriction、agent
          approval、session timeout、用户提示、vendor 处置和设备枚举，工具越持久越容易留下 enrollment/service/asset 关系。
        en: Software and IDE paths require starting or retaining a legitimate agent or tunnel on the target, controlling
          a vendor, GitHub, or Microsoft account or session code, and maintaining outbound relay. Workflow abuse also
          needs user consent, a stolen operator identity, or an ability to evade ticket validation. The hardware path
          requires physical installation or facilitator assistance, separate networking, and KVM-controller credentials.
          The actor must handle MFA, tenant restriction, agent approval, session timeout, user prompts, vendor enforcement,
          and device enumeration. More persistent tooling leaves stronger enrollment, service, and asset relationships.
    defender_model:
      paragraphs:
      - zh: 防守方需要四类视角：端点上的 process/service/extension/agent/device events 和子进程；vendor/IDE 控制面的 tenant/account/controller/agent/tunnel/session/action
          审计；身份提供方的 sign-in/MFA/device/source；工单/变更/同意与批准 inventory。硬件还需 USB/HID/video/EDID、DHCP/NAC/switch-port、KVM
          管理登录与物理保管。稳定关联键为 device、agent/tunnel/hardware ID、controller account/tenant、session/request、ticket、target、access
          mode 和 time。
        en: 'Defenders need four vantage classes: endpoint process, service, extension, agent, and device events plus
          child processes; vendor or IDE control-plane audit for tenant, account, controller, agent, tunnel, session,
          and action; identity-provider sign-in, MFA, device, and source; and ticket, change, consent, and approved inventory.
          Hardware additionally needs USB, HID, video, and EDID, DHCP, NAC, switch port, KVM-management login, and physical
          custody. Stable keys are device, agent, tunnel, or hardware ID, controller account or tenant, session or request,
          ticket, target, access mode, and time.'
      - zh: 日志能力差异巨大。Quick Assist 官方说明 host 两端不创建详细日志，provider 仅短期保留少量 session health 数据且不记录按键/动作；外部 RMM tenant 和 GitHub
          account 也可能不向受害组织开放完整审计。此时只能把 agent/tunnel lifecycle、identity、network 和 endpoint outcome 形成分级推断，不得将签名工具或无工单自动定性。合法支持、MSP、多租户开发、实验室
          KVM、灾备和事件响应必须按明确 owner/scope/window 排除。
        en: Logging varies sharply. Official Quick Assist documentation states that neither endpoint creates detailed
          logs, the provider keeps a small amount of session-health data briefly, and keystrokes or actions are not recorded.
          Outside RMM tenants and GitHub accounts may likewise withhold complete audit from the victim organization.
          In those conditions, agent or tunnel lifecycle, identity, network, and endpoint outcome support graded inference
          only; a signed tool or missing ticket is not automatically malicious. Legitimate support, MSP, multi-tenant
          development, laboratory KVM, disaster recovery, and incident response require explicit owner, scope, and window
          as counterexamples.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实远控产品身份与支持开发外观替代攻击者控制通道特征
    en: Genuine remote-control product identity and support or development appearance substitute for attacker control-channel
      features
  analysis:
    paragraphs:
    - zh: 攻击者通过签名 agent、vendor relay、GitHub/Microsoft dev tunnel 或用户批准的 Quick Assist 建立控制，端点进程、证书、域名和交互形式均属于真实产品。粗粒度分类把合法产品特征当作会话授权，恶意
        controller 和目标动作被支持/开发工作流包裹，形成特征伪装。Operation Digital Eye、Storm-1811 和 Scattered Spider 直接支持；controller tenant、agent
        binding、ticket、consent 与 action 可恢复差异。
      en: The actor establishes control through a signed agent, vendor relay, GitHub or Microsoft dev tunnel, or user-approved
        Quick Assist, leaving endpoint process, certificate, domain, and interaction form genuine to the product. Coarse
        classification treats legitimate product features as session authorization, wrapping a malicious controller and
        target action in support or development workflow and producing Feature Disguise. Operation Digital Eye, Storm-1811,
        and Scattered Spider directly support the chain; controller tenant, agent binding, ticket, consent, and action
        recover the difference.
  evidence_refs:
  - REF-001062
  - REF-001063
  - REF-000031
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 带外控制将远程操作者活动移出宿主进程与网络观察面
    en: Out-of-band control moves remote-operator activity outside host process and network observation
  analysis:
    paragraphs:
    - zh: IP-KVM 在宿主外获取视频并模拟键盘/鼠标，操作者网络连接终止于 KVM 而非 corporate endpoint；宿主可能只见本地 HID 与普通用户动作，没有 remote-control process
        或 vendor egress。依赖 EDR 进程/网络的分析因此不触发，形成行为透明。Mandiant 与 Microsoft 现场观察支持该差；USB/HID/video、MAC/IP/switch port、KVM
        login 和 identity outcome 仍可恢复。
      en: An IP-KVM captures video and emulates keyboard and mouse outside the host, with the operator network connection
        terminating at the KVM rather than the corporate endpoint. The host may see only local HID and ordinary user
        actions with no remote-control process or vendor egress. Analytics dependent on EDR process and network therefore
        do not fire, creating Behavioral Transparency. Mandiant and Microsoft field observations support the differential;
        USB, HID, video, MAC, IP, switch port, KVM login, and identity outcome remain recoverable.
  evidence_refs:
  - REF-001064
  - REF-001065
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 三项子技术按受信远控能力失去控制的不同位置划分：未批准控制端命名空间重绑定改变 capability 所属 tenant/account/controller；批准工作流脱离使真实会话与 ticket、操作者、目标、权限或时间不匹配；带外远控观察置换把网络控制终止于宿主外
        KVM/BMC，使 OS 只见本地外设动作。三者分别要求 enrollment、session-workflow 和 OOB asset telemetry。
      en: Three children separate where a trusted remote-control capability loses governance. Unapproved Controller-Namespace
        Rebinding changes the tenant, account, or controller owning the capability. Approval-Detached Trusted Remote-Control
        Session creates a real session that conflicts with ticket, operator, target, privilege, or time. Out-of-Band
        Remote-Control Observation Displacement terminates network control at an off-host KVM or BMC so the OS sees local
        peripheral action. They require enrollment, session-workflow, and OOB asset telemetry respectively.
    - zh: IDE、远程桌面软件和远控硬件只是媒介。远程服务入口、已有会话劫持、有效账户、代理/隧道、远程管理执行和首次硬件接入保留相邻对象；普通批准 helpdesk、开发和 KVM 运维是反例。
      en: IDE, remote desktop software, and remote-control hardware are media only. Remote-service entry, existing-session
        hijack, valid accounts, proxy or tunneling, remote-administration execution, and initial hardware entry remain
        adjacent. Approved helpdesk, development, and KVM operations are counterexamples.
