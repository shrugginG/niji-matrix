research:
  limitations:
    paragraphs:
    - zh: 公开事件直接支持 VS Code tunnel、Quick Assist/RMM 和 IP-KVM 远控滥用，但提供方租户审计、工单、用户同意和带外硬件日志通常不完整。工具签名、真实认证、用户点击同意或硬件存在均不能单独证明恶意。
      en: Public incidents directly support abuse of VS Code tunnels, Quick Assist or RMM, and IP-KVM control, but provider-tenant
        audit, tickets, user consent, and out-of-band hardware logs are usually incomplete. Tool signature, genuine authentication,
        a user consent click, or hardware presence does not prove malice alone.
    - zh: 远控提供方保留期、字段和 controller ID 可用性不同，便携 agent 与共享账号也会破坏稳定关联。检测窗口和 namespace/workflow 基线需按产品与业务校准；带外设备需要资产和保管证据，宿主
        HID 事件不能识别远端操作者。
      en: Remote-control providers differ in retention, fields, and controller-ID availability, while portable agents
        and shared accounts break stable joins. Windows and namespace or workflow baselines require product and business
        calibration. Out-of-band devices need asset and custody evidence; host HID events cannot identify a remote operator.
