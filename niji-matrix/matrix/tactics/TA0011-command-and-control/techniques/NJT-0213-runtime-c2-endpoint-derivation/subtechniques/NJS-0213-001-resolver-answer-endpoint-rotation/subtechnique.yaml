research:
  limitations:
    paragraphs:
    - zh: ESET 直接支持地址轮换和工具使用解析结果，但未公开每台受害主机的完整 DNS→socket 事件，也未给出统一 TTL。报告还说明 2022–2023 部分工具转向硬编码 IP，因此不能把所有 Gamaredon
        C2 或每次变化都归入本子项。
      en: ESET directly supports address rotation and tools consuming resolver results but does not publish complete
        DNS-to-socket events for every victim or a universal TTL. The report also states some 2022–2023 tools shifted
        to hardcoded IPs, so not every Gamaredon C2 or change qualifies.
