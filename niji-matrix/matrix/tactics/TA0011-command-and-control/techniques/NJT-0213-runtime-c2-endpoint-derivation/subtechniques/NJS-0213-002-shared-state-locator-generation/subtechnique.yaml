research:
  limitations:
    paragraphs:
    - zh: POSHSPY 来源直接证明样本生成逻辑和事件中的 C2 使用，但没有列出所有 550 URL 的 DNS/HTTP 尝试，也不提供通用 NXDOMAIN 或词法阈值。其被分析样本使用合法被攻陷网站，域信誉和 DGA
        外观都不能单独检测。
      en: The POSHSPY source directly establishes sample generation logic and C2 use in incidents but does not enumerate
        DNS or HTTP attempts for all 550 URLs or provide universal NXDOMAIN or lexical thresholds. The analyzed sample
        used legitimate compromised sites, so domain reputation and DGA appearance alone cannot detect it.
