research:
  limitations:
    paragraphs:
    - zh: CrowdStrike 来源明确说明算法和 C2 port 使用，并称规则经过测试，但公开页面没有提供特定样本 hash、完整 PCAP 或逐受害连接，因此支持技术存在与公式，不支持任一组织的实际漏报率或所有变体都用同一公式。
      en: CrowdStrike explicitly describes the algorithm and C2 port use and states that rules were tested, but the public
        page provides no specific sample hash, complete PCAP, or per-victim connection. It supports technique existence
        and the formula, not a real-world miss rate or use of one formula by every variant.
