research:
  limitations:
    paragraphs:
    - zh: Gamaredon、POSHSPY 和 Numbered Panda 来源分别支持应答消费、候选生成和参数合成，但不提供所有受害者的完整解析器、端点和基础设施历史。运行时值必须实际进入后继 C2；随机域名、短 TTL
        或多个答案本身不成立。
      en: Gamaredon, POSHSPY, and Numbered Panda sources support answer consumption, candidate generation, and parameter
        synthesis respectively but do not provide complete resolver, endpoint, and infrastructure history for every victim.
        The runtime value must enter successor C2; random-looking domains, short TTL, or several answers alone are insufficient.
    - zh: DoH/DoQ、缓存、代理、NAT、ECH、共享浏览器进程和无样本环境会削弱 query-to-process-to-socket 关联。被动 DNS、RDAP、CT 和证书情报存在覆盖偏差；七至三十日窗口及候选族阈值必须按合法
        CDN、DDNS 和服务发现基线校准。
      en: DoH or DoQ, caching, proxies, NAT, ECH, shared browser processes, and lack of a sample weaken query-to-process-to-socket
        joins. Passive DNS, RDAP, CT, and certificate intelligence have coverage bias. Seven-to-thirty-day windows and
        candidate-family thresholds require calibration against legitimate CDN, DDNS, and service-discovery baselines.
