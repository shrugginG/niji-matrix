research:
  limitations:
    paragraphs:
    - zh: FlawedGrace、Winnti 与 PseudoManuscrypt 直接证明真实协议、所用端口及后继控制，却没有公开各受害组织的防火墙策略、代理预期或解析器输出。它们不能单独证明具体现场已发生过滤绕过或日志错分。正式认定须补充当地规则、动作与解析结果；缺少部署证据时，只能记录协议—端口错配候选。
      en: FlawedGrace, Winnti, and PseudoManuscrypt directly establish actual protocol semantics, selected port, and successor
        C2, but they do not publish each victim organization's firewall policy, proxy expectation, or parser output. They
        therefore do not independently prove that filtering was bypassed or logs were misclassified at a particular site.
        Formal classification must add local policy, rule and action, and analyzer result. Without that deployment evidence,
        record only a protocol-port mismatch candidate rather than a complete stealth effect.
    - zh: Zeek、Suricata 与 PAN-OS 文档证明字段和控制措施可以实施，并不证明检测率或恶意意图。解析失败可由协议升级、错误配置、短流与单向流引起；应用识别也可能在会话中变化，并受解密和签名覆盖限制。十五分钟与二十四小时窗口只是工程起点，应以当地测试流量、报文重放和合法自定义服务校准。
      en: Zeek, Suricata, and PAN-OS documentation establishes implementable fields and controls, not detection rates or malicious
        intent. Zeek analyzer failure can arise from protocol upgrades or misconfigured services, Suricata failed or skipped
        can arise from short and one-direction flows, and App-ID can change during a session and depends on decryption and
        signature coverage. The stated fifteen-minute and twenty-four-hour windows are engineering starting points requiring
        calibration with local canaries, PCAP replay, and legitimate custom services.
    - zh: 较早的流量研究说明按端口推断 TLS 容易错分及内容验证的价值，但其样本和网络环境不能代表当前流行度或阈值。专有加密可能阻止真实语义恢复；协议仿真可以验证已知家族响应，却不能假定总能对活跃控制端合法探测。解析器没有得出语义，既不能证明本技术存在，也不能证明其不存在。
      en: The 2012 study directly demonstrates port-based malware and TLS misclassification and the value of content validation,
        but its samples, TLS ecosystem, and IDS are old. It supports causality rather than current prevalence or thresholds.
        Proprietary encryption may prevent recovery of actual semantics. Protocol emulation can prove a known-family response,
        but probing live C2 has legal and operational constraints and cannot be assumed available. Absence of semantic parsing
        proves neither absence nor presence of T1571.
