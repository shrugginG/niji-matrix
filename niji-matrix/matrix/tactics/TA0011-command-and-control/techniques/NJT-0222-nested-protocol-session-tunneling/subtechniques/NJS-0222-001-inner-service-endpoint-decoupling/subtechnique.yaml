research:
  limitations:
    paragraphs:
    - zh: Mandiant 的 APT29 现场材料证明内外层服务与端口链，但没有给出每个受害边界的完整传感器配置或漏报记录。Zeek tunnel 日志文档证明可用字段，不能证明所有应用隧道自动被识别；本项效应需按目标部署验证。
      en: Mandiant's APT29 field report establishes the inner and outer service and port chain but does not publish every
        victim boundary sensor configuration or missed alert. Zeek tunnel documentation establishes available fields, not
        automatic recognition of every application tunnel; the effect requires validation against the target deployment.
