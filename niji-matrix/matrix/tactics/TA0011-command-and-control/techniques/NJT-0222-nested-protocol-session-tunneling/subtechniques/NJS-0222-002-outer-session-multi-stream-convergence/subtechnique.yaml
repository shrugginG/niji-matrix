research:
  limitations:
    paragraphs:
    - zh: BRICKSTORM 逆向证据直接支持协议多流与并发能力，但公开材料不能量化受害者实际漏报，也未完全说明所有基础设施终止点。把任意长 WebSocket 视为多流会混入合法业务，必须有 stream 或内层结果证据。
      en: BRICKSTORM reverse engineering directly supports multiplexing and concurrent capability, but public reporting cannot
        quantify victim alert misses or locate every infrastructure termination point. Treating any long WebSocket as multiplexing
        would mix in legitimate business traffic; stream or inner-outcome evidence is required.
