research:
  limitations:
    paragraphs:
    - zh: FortiGuard 的客户端逆向与模拟服务端确认重组逻辑，但公开材料没有完整真实服务端事务或统一现场漏报记录；dnscat2 是独立实现说明。故本项的变量存在性成立，TrickBot 具体现场成功控制和普遍匿迹效果保持较低结论强度。
      en: FortiGuard's client reverse engineering and simulated server confirm reconstruction logic, but public material lacks
        full production server transactions or a common field miss record. dnscat2 documents an independent implementation.
        The variable is supported, while specific TrickBot field control success and general stealth effect retain lower confidence.
