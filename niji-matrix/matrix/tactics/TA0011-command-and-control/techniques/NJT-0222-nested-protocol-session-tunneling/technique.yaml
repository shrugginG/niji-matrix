research:
  limitations:
    paragraphs:
    - zh: 三项主证据处于不同层级。APT29/meek 是 Mandiant 现场观察，能证明外层 HTTPS/Tor 与本地服务关系，但同时含域前置、中介路由和双层加密，不能把所有匿迹效果只归因于隧道。BRICKSTORM 是多个样本和事件响应材料的逆向，可证明多路
        framing，生产网络若无密钥仍可能不可解。TrickBot 是捕获样本与模拟服务端的实验链，应把客户端结构和实验响应严格区分。
      en: The three primary sources have different evidence levels. APT29 and meek are Mandiant field observations proving
        an outer HTTPS or Tor to local-service relationship, but the event also includes domain fronting, intermediary routing,
        and layered encryption, so stealth effect cannot be attributed solely to tunneling. BRICKSTORM combines multiple samples
        and incident-response material and establishes multiplex framing, while production traffic may remain undecodable
        without keys. TrickBot combines captured samples with a simulated server and requires strict separation between direct
        client structure and experimental responses.
    - zh: Zeek tunnel.log 只对支持的网络层封装提供可靠 tunnel_parent，不能普遍解出 SSH、TLS、WebSocket、Yamux 或自定义 DNS。Sysmon Event 3 默认关闭且只记录连接，不完整覆盖
        listen/accept；端点 socket 图通常需要 EDR/eBPF 或平台专用审计。缺少这些字段时，长连接、fan-in、字节比和 DNS 形态只支持候选，不满足正式 T1572 结果门。
      en: Zeek tunnel.log supplies reliable tunnel_parent linkage only for supported network-layer encapsulation and does
        not generally decode SSH, TLS, WebSocket, Yamux, or custom DNS. Sysmon Event 3 is disabled by default and records
        connections without complete listen or accept coverage; endpoint socket graphs usually need EDR, eBPF, or platform-specific
        audit. Without those fields, a long connection, fan-in, byte ratio, or DNS shape supports a candidate only and does
        not pass the formal T1572 outcome gate.
    - zh: 生产环境广泛使用合法 VPN、服务网格、SSH forwarding、IDE tunnels、远控 relay、数据库代理和 HTTP/2/QUIC 多路复用。缓解措施若仅按工具、端口、加密或并发数阻断会产生显著业务影响，也可被改名绕过。必须以批准
        path graph、身份、inner service、outer peer、配置摘要和期限实施；OpenSSH 控制不能阻止有 shell 权限的用户安装另一 forwarder。
      en: Production environments widely use legitimate VPNs, service meshes, SSH forwarding, IDE tunnels, remote-control
        relays, database proxies, and HTTP/2 or QUIC multiplexing. Controls based only on tool, port, encryption, or concurrency
        cause significant business impact and are bypassed by renaming. Enforcement needs an approved path graph, identity,
        inner service, outer peer, configuration digest, and expiry. OpenSSH controls cannot stop a user retaining shell access
        from installing another forwarder.
