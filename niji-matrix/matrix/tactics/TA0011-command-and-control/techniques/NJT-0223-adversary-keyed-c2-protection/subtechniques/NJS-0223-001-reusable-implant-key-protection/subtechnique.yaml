research:
  limitations:
    paragraphs:
    - zh: CrowdStrike 报告直接给出 3PARA key derivation、fallback、task output 和 commands，但不提供可下载 PCAP，也不能证明所有 3PARA 变体/受害者共享同 key。历史解密能力需由主
        Agent 在可用样本与流量上验证。
      en: CrowdStrike directly reports 3PARA key derivation, fallback, task output, and commands but provides no downloadable
        PCAP and cannot establish that every 3PARA variant or victim shares one key. Retrospective decryption requires validation
        on available samples and traffic.
