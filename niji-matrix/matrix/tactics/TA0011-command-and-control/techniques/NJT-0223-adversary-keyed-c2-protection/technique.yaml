research:
  limitations:
    paragraphs:
    - zh: 3PARA、Snake 与 Cyclops Blink 是三组实现证据，不构成所有 encrypted C2 的流行度或完备样本；无原始 PCAP 时不能在本批复验全部 decrypt path。
      en: 3PARA, Snake, and Cyclops Blink are three implementation evidence sets rather than prevalence or exhaustive coverage
        of encrypted C2; without original PCAP this batch cannot reproduce every decryption path.
    - zh: high entropy、TLS、crypto API call、算法或 key length 都可能来自正常软件；缺少 receiver-compatible recovery 与 command/result outcome
        时必须保持 candidate。
      en: High entropy, TLS, cryptographic API calls, algorithms, and key lengths commonly occur in legitimate software; without
        receiver-compatible recovery and a command or result outcome, classification must remain a candidate.
    - zh: endpoint memory/API instrumentation 不是操作系统默认数据源，可能产生隐私、稳定性和密钥泄露风险；只能在授权范围内短时采集并隔离 key material。RFC 9850 也明确不支持把
        TLS key logging 作为生产默认。
      en: Endpoint memory and API instrumentation is not an operating-system default data source and can create privacy, stability,
        and key-disclosure risk; collect it only temporarily within authorized scope and isolate key material. RFC 9850 likewise
        does not support TLS key logging as a production default.
    - zh: 嵌套检查边界与 key lifetime 是正交轴；只有 Cyclops Blink 直接支持 runtime+nested。本批没有 reusable+nested 的直接案例，正式写入时不得用概念可组合性代替证据。
      en: The nested inspection boundary and key lifetime are orthogonal axes. Only Cyclops Blink directly supports runtime
        plus nested. This batch lacks a direct reusable plus nested case, so formal authoring must not substitute conceptual
        composability for evidence.
