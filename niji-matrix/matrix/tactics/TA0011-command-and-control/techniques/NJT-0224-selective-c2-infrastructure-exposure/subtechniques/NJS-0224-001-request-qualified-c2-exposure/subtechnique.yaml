schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0224-001
parent_ref: NJT-0224
name:
  zh: 请求资格门控 C2 暴露
  en: Request-Qualified C2 Exposure
summary:
  zh: C2 前端只向满足植入体请求资格的流量暴露真实控制端，其余请求得到良性或错误表面。
  en: A C2 front exposes the real controller only to traffic matching an implant request qualification while other requests
    receive a benign or error surface.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 请求资格门控 C2 暴露是攻击者在前端或监听器上设置正向请求条件，只有携带匹配的路径、消息校验、头字段组合或会话序列的植入体请求才被转发到控制端或得到任务。直接目标是让普通扫描器无法到达真实 C2 功能；稳定变量是请求与植入体资格的匹配关系，不是具体
      Cookie、令牌或产品。
    en: Request-Qualified C2 Exposure places a positive request condition at a front or listener. Only implant requests with
      the matching path, message checksum, header combination, or session sequence are forwarded to the controller or receive
      tasking. Its direct purpose is keeping ordinary scanners from reaching the true C2 function. The stable variable is
      request congruence with the implant qualification rather than a particular cookie, token, or product.
  - zh: 正式判定要求同一端点在可控请求变体下给出不同路由或响应，并至少一次把合格分支连接到受害植入体的命令或结果。IronNet 对乌克兰相关 Cobalt Strike 基础设施记录用于 Nginx 的防御绕过 profile，并说明
      redirector 把特定 Beacon 流量送往 team server；Mandiant 文档补充校验和与用户代理规则的实现语义。产品能力本身不能替代事件链。
    en: Classification requires different route or response outcomes for controlled request variants at the same endpoint
      and at least one join from the qualified branch to a victim implant command or result. IronNet documented an Nginx-directed
      defender-bypass profile on Ukraine-related Cobalt Strike infrastructure and explained redirectors sending specific Beacon
      traffic to a team server. Mandiant documents checksum and user-agent rule semantics. Product capability alone cannot
      replace an incident chain.
stealth_characteristics:
  paragraphs:
  - zh: 请求资格门控 C2 暴露使未掌握有效请求格式的探针只能看到普通站点、404、重定向或超时；真实 team server 的 banner、路径和任务从这一观察面消失。合格植入体却可以在同一地址持续收发控制数据，形成按请求内容而非地址划分的观察差。
    en: Request-Qualified C2 Exposure leaves probes without the valid request form seeing only an ordinary site, 404, redirect,
      or timeout. The team server's banner, route, and tasking disappear from that vantage while a qualified implant continues
      exchanging control data at the same address, creating an observation difference keyed to request content rather than
      address.
  - zh: 残余包括前端匹配规则、请求 ID、命中与未命中动作、上游 origin 访问、变体响应摘要和受害端任务结果。取得样本配置或受害请求并在授权环境中逐字段比较，可以恢复门控；一次无效探针或单个 CDN 地址没有证明力。
    en: Residuals include front-end match rules, request IDs, matched and unmatched actions, upstream origin access, variant
      response digests, and victim task results. Sample configuration or victim requests support field-by-field comparison
      in an authorized setting to recover the gate. One invalid probe or a CDN address alone proves nothing.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求攻击者控制的正向资格条件、同端点请求差分和合格分支的真实 C2 结果。前端只隐匿 origin 但所有请求路由一致时归 NJT-0206；内容仅伪装为 Web 却不分支时归 NJT-0152；向合法源站与受害者之间的路径注入伪造响应时归
      NJT-0052。多个变量可并列，但不能把前端正常反爬规则本身算作攻击。
    en: Inclusion requires an actor-controlled positive qualification, a same-endpoint request differential, and a real C2
      result on the qualified branch. A front that merely hides its origin while routing every request alike belongs to NJT-0206.
      Content that only resembles web traffic without branching belongs to NJT-0152. A forged response inserted between a
      legitimate origin and victim belongs to NJT-0052. Variables may co-apply, but ordinary anti-bot rules alone are not
      attacks.
  - zh: 兄弟项依据观察者身份执行负向抑制，即保持请求相同而更换来源会改变结果；本项保持来源相同而改变请求资格即可触发分支。合法 API token、访问控制、WAF challenge 和灰度发布可产生相似差分，必须凭恶意租户、植入体请求与任务结果排除。
    en: The sibling applies negative suppression by observer identity, so changing source while holding the request constant
      changes the result. This child branches when qualification changes with the source held constant. Legitimate API tokens,
      access control, WAF challenges, and staged releases can produce similar differences and require exclusion using malicious
      tenant, implant request, and task outcome evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者把 Cobalt Strike 类 team server 放在反向代理之后，令扫描器访问普通站点，只有预置 profile 的 Beacon 才到达控制端。在已受控主机继续轮询时，这种设置降低公开扫描与研究者对基础设施的发现机会，并让同一前端地址同时呈现正常与恶意结果。
      en: An actor can place a Cobalt Strike-style team server behind a reverse proxy that sends scanners to an ordinary site
        while only Beacons with a preset profile reach the controller. Continued polling by compromised hosts reduces discovery
        by public scanners and researchers while one front address presents both ordinary and malicious outcomes.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要维护前端规则、植入体请求 profile 与 origin 映射，并让密钥或校验条件在客户端和服务器版本间一致。有效 profile 泄漏、规则误配或前端日志被取得会暴露控制端；过严门控也可能拒绝自己的植入体。
        en: The actor must maintain front rules, implant request profiles, and origin mapping and keep secret or checksum
          conditions synchronized across client and server versions. Leaked profiles, misconfigured rules, or recovered front
          logs expose the controller, while an overly strict gate can reject the actor's own implants.
    defender_model:
      paragraphs:
      - zh: 防守方需取得受害请求或样本 profile、前端 request ID/rule/action、origin 日志、端点任务结果以及合法站点配置。以同一来源和时间固定变量后安全地更改一个请求字段，观察 edge-to-origin
          与响应差；无前端权限时仅能建立较低置信的外部差分。
        en: Defenders need victim requests or a sample profile, front request IDs and rule actions, origin logs, endpoint
          task outcomes, and legitimate site configuration. Hold source and time constant while safely varying one request
          field and compare edge-to-origin routing and responses. Without front access, external differentials support lower
          confidence.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 未满足植入体资格的请求无法观察真实 C2 功能
    en: Requests failing implant qualification cannot observe the real C2 function
  analysis:
    paragraphs:
    - zh: 攻击者以正向资格规则把合格请求送往 team server、其余请求送往良性表面，导致普通探针即使命中同一地址也没有任务或 origin 指纹。关键控制行为在其观察模型中消失；将有效请求、前端规则、origin 访问及植入体结果连接，才能恢复被门控的行为。
      en: The actor uses a positive qualification rule to route matching requests to a team server and other requests to a
        benign surface. An ordinary probe can reach the same address yet see no task or origin fingerprint, making the control
        behavior absent from its observation model. Joining valid requests, front rules, origin access, and implant outcomes
        restores the gated behavior.
