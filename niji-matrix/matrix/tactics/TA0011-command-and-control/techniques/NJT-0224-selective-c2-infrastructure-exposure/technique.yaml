research:
  limitations:
    paragraphs:
    - zh: 固定 ATT&CK 19.1 的父描述比本文准入宽，且 procedure examples 大多证明代理/ORB/公共云/命名伪装而非 selective runtime exposure；它们用于 boundary，不用于强行扩展
        formal Niji parent。ATT&CK 引用的 TA571、SocGholish、fake browser update 等主要是 initial delivery/filtering，不满足本文要求的 hidden
        C2 successor，因而未作为两个 NJS 的独立主证据。
      en: The fixed ATT&CK 19.1 parent is broader than this admission and most procedure examples establish proxies, ORBs,
        public cloud, or naming camouflage rather than selective runtime exposure. They inform boundaries and do not force
        expansion of the formal Niji parent. ATT&CK-cited TA571, SocGholish, and fake-browser-update material primarily concerns
        initial delivery and filtering and does not meet this handoff's hidden-C2 successor requirement, so it is not primary
        independent evidence for the two NJS proposals.
    - zh: 公开 incident reports 很少披露 production WAF/reverse-proxy rule、完整 probe corpus、request IDs 或 origin logs。Unit 42 对 source
        filtering/time window 的观察最强；IronNet 对 incident-linked profile 最强，但 request gate 细节部分由公开 profile 与技术行为解释。正式对象应分别标记
        field observation、sample/capability、controlled experiment 和 sensor-model inference，不能把 proposed raw fields 写成已经采集的事件事实。
      en: Public incident reports rarely disclose production WAF or reverse-proxy rules, complete probe corpora, request IDs,
        or origin logs. Unit 42 provides the strongest field observation of source filtering and time windows. IronNet provides
        the strongest incident-linked profile evidence, while request-gate details partly rely on the public profile and supported
        technical behavior. Formal objects should distinguish field observation, sample or capability, controlled experiment,
        and sensor-model inference and must not describe proposed raw fields as already collected incident facts.
    - zh: 合法 WAF/CDN/anti-bot 与 malicious exposure gate 使用相同字段和 actions，任何自动检测都必须先有 victim C2/process/outcome 或 provider abuse
        context。active probing 涉及授权、隐私、速率和对手告警风险，不能把本 analytic 视为允许扫描任意第三方。时间子项因证据广度不足 defer；若后续出现第二宗 original incident 或
        provider rule seizure，可重新评审。
      en: Legitimate WAF, CDN, and anti-bot systems use the same fields and actions as a malicious exposure gate. Any automated
        detection must begin with victim C2, process and outcome or provider abuse context. Active probing raises authorization,
        privacy, rate, and adversary-notification risks and this analytic does not authorize scanning arbitrary third parties.
        The temporal child is deferred for evidence breadth; reassess if a second original incident or seized provider rule
        becomes available.
