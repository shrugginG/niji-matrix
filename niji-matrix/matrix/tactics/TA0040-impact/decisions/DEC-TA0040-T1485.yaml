  name_en: Data Destruction
  name_zh: 数据销毁
decision: adapt
rationale_zh: 数据销毁属于影响释放，但直接删除或覆写并不自动具备匿迹特性。本矩阵将父行为适配为具有证据支持的观察分离式破坏：攻击者改动删除规则，由存储服务在后来执行对象移除，使规则写入者与对象损失事件分离。其他销毁方式用于界定父级范围，却不能仅凭危害结果升级成原生子技术；当前证据尚无完整受害者案例证明此子项的业务损失链。
rationale_en: 'Data destruction is Impact, but direct deletion or overwrite is not automatically stealthy. This
  matrix adapts the parent to evidenced observation-separated destruction: an adversary changes a deletion rule
  and a storage service later removes objects, separating the rule writer from the object-loss event. Other destructive
  forms define the parent boundary but cannot become native children from harm alone; current evidence lacks a complete
  victim case for this child''s business-loss chain.'
scope_notes_zh: 纳入文件与对象业务可用性损失及有证据的决策—执行观察差异；不吸收加密、磁盘结构擦除、恢复副本抑制、仍可使用的数据值篡改或攻击工具清理。T1485.001 只作为研究广度资料，不被导入。
scope_notes_en: Include business-data loss through file or object destruction and evidenced decision-to-execution
  observation differences. Exclude encryption, disk-structure wiping, recovery-copy suppression, usable-data value
  manipulation, and cleanup of attacker tools. T1485.001 is research-breadth context only, not imported.
