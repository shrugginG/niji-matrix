  name_en: Data Encrypted for Impact
  name_zh: 为影响而加密数据
decision: adapt
rationale_zh: 攻击者令原本可读的数据因未授权加密和密钥控制而不可读，属于影响释放。Niji 适配其正式范围为两类有独立证据的匿迹设计：文件内部稀疏改写降低整文件统计和写入信号，或利用有效云凭据让存储服务在客户密钥下重加密现有对象，把活动移出主机文件观察面。勒索要求、算法和文件后缀不构成匿迹证据。
rationale_en: 'An adversary denying reading of formerly usable data through unauthorized encryption and key control
  is Impact. Niji adapts the formal scope to two independently supported stealth designs: sparse within-file rewriting
  weakens whole-file and write signals, or valid cloud credentials cause a storage service to re-encrypt existing
  objects under a customer key, moving activity outside host file observation. Ransom demands, ciphers, and file
  suffixes are not stealth evidence.'
scope_notes_zh: 直接对象是仍存在但在组织正常密钥上下文中不可读的内容或对象版本；数据删除归 T1485，磁盘擦除归 T1561，恢复抑制归 T1490，选择性跳过目标与来宾观察域隔离沿用既有 Niji 分类。ATT&CK
  T1486 无子项，Niji 两个子项来自独立匿迹变量研究。
scope_notes_en: The direct object is surviving content or an object version unreadable under normal organizational
  key custody. Data deletion belongs to T1485, disk wiping to T1561, recovery inhibition to T1490, and selective
  target skipping and guest observation-domain isolation remain with existing Niji owners. ATT&CK T1486 has no children;
  its two Niji children arise from independent stealth-variable research.
