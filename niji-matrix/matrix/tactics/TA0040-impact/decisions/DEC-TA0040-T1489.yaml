  name_en: Business Service Stop
  name_zh: 业务服务停用
decision: adapt
rationale_zh: 服务停止符合 Impact，但停止业务服务、防御工具和恢复服务的直接对象不同。Niji 将父级适配为攻击者借服务接受的正常控制路径有序停止业务功能，使恶意中断与批准维护共享状态终态。Prestige
  证明实际使用，Windows 文档证明痕迹等价；来源未证明伪装动机，故置信度为中等且不设 NJS。
rationale_en: Service stopping is Impact, but business services, defensive tools, and recovery services have different
  direct objects. Niji adapts the parent to an adversary orderly stopping a business function through the service's
  accepted control path so malicious interruption shares its terminal state with approved maintenance. Prestige establishes
  actual use and Windows documentation establishes trace equivalence; the sources do not prove camouflage motive,
  so confidence is medium and no NJS is defined.
scope_notes_zh: 正式范围只含具有正常控制路径与业务不可用结果的业务服务停止。安全工具停止归 NJT-0123，恢复服务停止归 T1490，整机关机或重启归 T1529；后继加密与销毁分别保留 NJT-0157/NJT-0156。
scope_notes_en: Formal scope includes business-service stopping with an ordinary control path and business-unavailability
  outcome. Security-tool stopping belongs to NJT-0123, recovery-service stopping to T1490, and whole-system shutdown
  or reboot to T1529; later encryption and destruction remain NJT-0157 and NJT-0156.
