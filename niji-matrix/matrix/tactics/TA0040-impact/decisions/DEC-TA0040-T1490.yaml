  name_en: Inhibit System Recovery
  name_zh: 抑制系统恢复
decision: adapt
rationale_zh: 攻击者删除或削弱恢复点、备份、恢复配置和依赖，使组织在事件后无法按预期恢复，明确属于 Impact。Niji 将父级适配为恢复平面先于生产故障失去能力的观察差异，并正式保留一个中等置信的策略驱动延迟到期子项；该子项由
  AWS 生命周期语义与防御指导支持，不制造命名受害案例。
rationale_en: Adversary deletion or impairment of recovery points, backups, recovery configuration, and dependencies
  denies expected post-incident recovery and clearly serves Impact. Niji adapts the parent to the observation difference
  where the recovery plane loses capability before production fails and retains one medium-confidence policy-driven
  deferred-expiry child. AWS lifecycle semantics and defensive guidance support the child without inventing a named
  victim case.
scope_notes_zh: 直接当前数据删除和加密归 NJT-0156/NJT-0157；只有恢复职责对象或依赖受损才属于本候选。策略写入须与后来恢复点到期、删除和 RPO 结果相连。
scope_notes_en: Direct current-data deletion and encryption belong to NJT-0156 and NJT-0157. This candidate requires
  damage to an object or dependency with a recovery role. A policy write must join later recovery-point expiry, deletion,
  and RPO outcome.
