  name_en: Defacement
  name_zh: 篡改展示内容
decision: adapt
rationale_zh: 攻击者让组织控制的网站、入口、登录消息或其他面向人的界面呈现未经授权内容，直接损害展示完整性和受众信任。Niji 把直接对象固定为组织身份下的实际展示结果，并以 Hushmail 事件支持一个展示源绑定替换子项；ATT&CK
  的内部/外部子项仅为位置维度，不导入。
rationale_en: An adversary causes an organization-controlled website, portal, login message, or other human-facing
  interface to present unauthorized content, directly harming display integrity and audience trust. Niji fixes the
  direct object as actual output under the organization identity and uses the Hushmail incident to support one Display-Source
  Binding Substitution child. ATT&CK internal and external children are location dimensions and are not imported.
scope_notes_zh: 业务数据值变化影响流程或决策归 T1565；钓鱼页、C2 内容、Web shell 或站点入侵若没有组织身份下的可见篡改结果，不满足本技术。
scope_notes_en: Business-data value changes affecting process or decision belong to T1565. Phishing pages, C2 content,
  web shells, or site compromise without a visible defacement result under the organization identity do not satisfy
  this technique.
