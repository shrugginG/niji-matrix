  name_en: Observation-Collapsing Firmware Corruption
  name_zh: 观察链坍塌型固件破坏
decision: adapt
rationale_zh: 未授权覆写或损坏硬件消费的固件，使设备不能初始化、启动或继续提供功能，明确产生 Impact。Niji 将范围收窄为破坏同时让 OS、agent 或常规固件读回无法报告变化后根因的情形；停机明显，但根因观察链坍塌。CIH
  与 NIST 支持因果效果，未证明攻击者以 concealment 为动机，故保持中等置信且不设 NJS。
rationale_en: Unauthorized overwrite or damage to hardware-consumed firmware prevents initialization, boot, or continued
  function and clearly produces Impact. Niji narrows the scope to corruption that also prevents the OS, agent, or
  ordinary firmware readback from reporting the post-change root cause. The outage is conspicuous while the root-cause
  observation chain collapses. CIH and NIST support the causal effect but not a concealment motive, so confidence
  remains medium and no NJS is defined.
scope_notes_zh: 能运行的 pre-OS 植入、继续服务的网络设备修改映像、完成的受限启动和磁盘结构擦除保留既有 owner；合法可回滚更新失败是反例。
scope_notes_en: Functional pre-OS implants, modified network-device images that keep serving, completed restricted
  boot, and disk-structure wiping retain their existing owners. A legitimate recoverable update failure is a counterexample.
