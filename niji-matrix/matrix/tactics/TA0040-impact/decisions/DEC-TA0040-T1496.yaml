  name_en: Resource Hijacking
  name_zh: 资源劫持
decision: adapt
rationale_zh: 攻击者未经授权消耗受害方计算、网络、消息或托管服务资源完成自身任务，并把费用、配额或容量影响留给受害方，明确属于 Impact。Niji 按观察变量适配为活动反馈控制消费时间包络，以及由提供方执行和计量的消费；资源类型与变现方式仅作
  ATT&CK 广度参考。
rationale_en: 'An adversary consumes victim compute, network, messaging, or managed-service resources without authorization
  for an adversary task and leaves cost, quota, or capacity impact with the victim, clearly serving Impact. Niji adapts
  by observation variables: activity feedback controlling the consumption envelope and consumption executed and metered
  by a provider. Resource type and monetization are ATT&CK breadth context only.'
scope_notes_zh: 必须证明实际资源计量或服务交易；执行、凭据、C2 和持久化为相邻对象。低覆盖区域归 NJT-0121，竞争驻留清除归 NJT-0091，直接拒绝服务和金融盗窃保持独立。
scope_notes_en: Actual resource metering or service transactions must be established; execution, credentials, C2,
  and persistence are adjacent objects. Low-coverage Region placement belongs to NJT-0121, competing-foothold eviction
  to NJT-0091, and direct denial of service and financial theft remain separate.
