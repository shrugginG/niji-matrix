  name_en: Network Denial of Service
  name_zh: 网络拒绝服务
decision: adapt
rationale_zh: 网络拒绝服务直接使网络链路、协议路径或边界容量无法承载合法通信。Niji 保留父结果并按来源拓扑适配为多源低贡献洪泛和响应源归因置换；ATT&CK 的直接/反射子项只作证据聚类。
rationale_en: Network Denial of Service directly prevents a link, protocol path, or boundary capacity from carrying
  legitimate traffic. Niji retains the result and adapts by source topology into multi-source low-contribution flooding
  and response-origin displacement; ATT&CK direct and reflection children remain evidence clusters only.
scope_notes_zh: 端点内部资源失败归 T1499；为攻击者任务消费带宽归 NJT-0189；botnet/C2 是前置控制。
scope_notes_en: Endpoint-internal failure belongs to T1499, bandwidth consumed for adversary work to NJT-0189, and
  botnet or C2 is precursor control.
