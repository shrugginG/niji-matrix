  name_en: Endpoint Denial of Service
  name_zh: 端点拒绝服务
decision: adapt
rationale_zh: 端点拒绝服务通过内部连接、工作槽位、CPU、内存、事件循环或缺陷触发造成服务不可用。Niji 按低速状态保持与小输入工作量放大划分原生子项，四个 ATT&CK 子项仅描述栈层与实现。
rationale_en: Endpoint Denial of Service causes unavailability through internal connection state, workers, CPU, memory,
  event loop, or triggered faults. Niji defines low-rate state holding and small-input work amplification as native
  children, while four ATT&CK children describe stack layers and implementation only.
scope_notes_zh: 有序服务停止归 NJT-0185，网络路径饱和归 T1498，为攻击者任务的资源消费归 NJT-0189；漏洞行为需有实际 availability 结果。
scope_notes_en: Orderly service stopping belongs to NJT-0185, network-path saturation to T1498, and resource consumption
  for attacker work to NJT-0189; exploitation needs an actual availability outcome.
