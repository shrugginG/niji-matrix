  name_en: System Shutdown/Reboot
  name_zh: 系统关机或重启
decision: adapt
rationale_zh: 攻击者控制系统接受的生命周期转换并造成主机、VM 或设备访问中断，属于 Impact。Niji 正式化延迟委托执行和目标外控制面两个观察变量；ATT&CK 无子项不限制开放搜索。
rationale_en: An attacker-controlled lifecycle transition accepted by the system and interrupting host, VM, or device
  access is Impact. Niji formalizes deferred delegated execution and out-of-target control plane as two observation
  variables; absence of ATT&CK children does not limit open search.
scope_notes_zh: 单服务停止归 NJT-0185；阻止关机以维持立足点归 NJT-0096；受限启动归 NJT-0172；无攻击者生命周期请求的 panic/watchdog 首先归 T1499。
scope_notes_en: Single-service stopping belongs to NJT-0185, inhibited shutdown preserving a foothold to NJT-0096,
  restricted boot to NJT-0172, and panic or watchdog without an attacker lifecycle request first to T1499.
