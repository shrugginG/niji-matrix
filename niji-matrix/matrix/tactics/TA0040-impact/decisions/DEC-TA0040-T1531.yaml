  name_en: Account Access Removal
  name_zh: 移除账户访问
decision: adapt
rationale_zh: 移除账户访问只有在既有合法主体实际无法认证或授权访问时完成。Niji 按账户身份保留但认证器被排他置换，以及认证仍成功但授权边被撤除两种观察差异划分。
rationale_en: Account Access Removal completes only when an existing legitimate principal actually loses authentication
  or authorized access. Niji divides by identity-preserving exclusive authenticator displacement and successful authentication
  followed by authorization-edge eviction.
scope_notes_zh: 新增攻击者访问状态归 NJT-0083，权限提升归 TA0004，会话级撤销不是持久 Impact；正常 offboarding、恢复和 fraud response 是反例。
scope_notes_en: Added attacker access state belongs to NJT-0083, privilege escalation to TA0004, and session-only
  revocation is not durable Impact; normal offboarding, recovery, and fraud response are counterexamples.
