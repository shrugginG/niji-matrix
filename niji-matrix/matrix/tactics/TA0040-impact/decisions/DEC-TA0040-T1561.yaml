  name_en: Disk Wipe
  name_zh: 磁盘擦除
decision: adapt
rationale_zh: 磁盘擦除在块、物理盘或卷层破坏内容与结构并造成介质级不可用。Niji 按少量关键元数据写入造成大范围损失，以及不可恢复擦除被包装为可解密勒索两个变量划分；ATT&CK 内容/结构子项不导入。
rationale_en: Disk Wipe destroys content and structure at block, physical-disk, or volume level and causes media-wide
  unavailability. Niji divides by small critical-metadata writes causing broad loss and irreversible wipe presented
  as decryptable ransomware; ATT&CK content and structure children are not imported.
scope_notes_zh: 文件/对象销毁归 NJT-0156，固件破坏归 NJT-0188，恢复对象归 NJT-0186，只读 raw access 归 NJT-0108；正常格式化/退役是反例。
scope_notes_en: File or object destruction belongs to NJT-0156, firmware corruption to NJT-0188, recovery objects
  to NJT-0186, and read-only raw access to NJT-0108; normal formatting or decommission is a counterexample.
