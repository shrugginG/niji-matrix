  name_en: Data Manipulation
  name_zh: 数据操纵
decision: adapt
rationale_zh: 攻击者改变仍可被业务消费的数据值、消息或运行结果，使流程、理解或决策基于错误信息。Niji 按业务合形外观和跨表示完整性分歧划分原生子项；stored/transmitted/runtime 仅作 ATT&CK
  广度参考。
rationale_en: An attacker changes data values, messages, or runtime results that remain consumable so processes, understanding,
  or decisions use false information. Niji divides by business-conforming appearance and cross-representation integrity
  divergence; stored, transmitted, and runtime remain ATT&CK breadth only.
scope_notes_zh: 数据不可用/删除归 NJT-0156，加密不可读归 NJT-0157，直接人类展示篡改归 NJT-0187，完成价值转移归 NJT-0204。
scope_notes_en: Unavailable or deleted data belongs to NJT-0156, unreadable encryption to NJT-0157, direct human-display
  defacement to NJT-0187, and completed value transfer to NJT-0204.
