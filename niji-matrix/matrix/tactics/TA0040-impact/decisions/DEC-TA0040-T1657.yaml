  name_en: Financial Theft
  name_zh: 金融盗窃
decision: adapt
rationale_zh: 金融盗窃正式范围严格要求受害方价值已扣账或失去控制，且攻击者/其受益方已成功入账或取得控制。Niji 按业务受益账户替换和快速多跳价值分散划分；只有金融动机、凭据、指令或 pending 状态不准入。
rationale_en: Financial Theft formal scope strictly requires victim debit or loss of value control and successful
  credit or control by the attacker or beneficiary. Niji divides by business beneficiary-account substitution and
  rapid multi-hop value dispersion. Financial motive, credentials, instructions, or pending status alone are not admitted.
scope_notes_zh: NJT-0189 只转移资源成本/容量，T1565 可改变交易数据但未完成价值转移；凭据、账户接管、BEC 与社会工程是前置。
scope_notes_en: NJT-0189 shifts resource cost or capacity, while T1565 can change transaction data without completing
  value transfer; credentials, account takeover, BEC, and social engineering are precursors.
