  name_en: Email Bombing
  name_zh: 邮件轰炸
decision: adapt
rationale_zh: 邮件轰炸以大量邮件造成合法邮件埋没、处理/投递困难、接收限额或业务中断为完成门；邮件量本身不够。Niji 按合法发送者扇出与关键后果消息同步埋没划分。
rationale_en: Email Bombing completes only when message volume causes legitimate-message burial, handling or delivery
  difficulty, receive-limit impact, or business interruption; volume alone is insufficient. Niji divides by legitimate-sender
  fan-out and synchronized burial of consequential messages.
scope_notes_zh: 邮件服务器内部资源耗尽可另归 T1499，网络容量归 T1498，钓鱼、邮件 C2 和 MFA request bombing 保留各自对象。
scope_notes_en: Mail-server internal exhaustion can separately belong to T1499, network capacity to T1498, and phishing,
  mail C2, and MFA request bombing retain their own objects.
