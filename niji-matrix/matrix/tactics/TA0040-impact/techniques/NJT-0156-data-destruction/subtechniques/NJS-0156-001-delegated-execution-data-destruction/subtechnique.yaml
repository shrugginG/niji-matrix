research:
  limitations:
    paragraphs:
    - zh: AWS 文档能确认服务执行、通知和版本结果，Palo Alto Networks 的分析支持恶意规则如何避开仅监视直接对象访问的逻辑；它不是已披露受害事件。尚不能声称实际受害者的业务损失、攻击者主观意图或通用漏检率，故不设子项案例引用。
      en: AWS documents service execution, notifications, and version effects, while Palo Alto Networks' analysis
        supports how a malicious rule can evade direct-object-access-only monitoring. It is not a disclosed victim
        incident. Actual victim loss, subjective intent, and a general miss rate cannot be asserted, so this child
        has no case reference.
    - zh: 规则资格、执行延迟和是否产生永久删除因桶的版本与保留设置而异；管理事件字段和通知的规则标识也要在目标环境验证。若守方保留规则修订并观察服务事件，这一分类仍成立，但预期匿迹收益会显著降低。
      en: Rule eligibility, execution lag, and permanent removal vary with bucket version and retention settings.
        Management-event fields and notification rule identifiers require validation in the target environment.
        The taxonomy remains valid when defenders retain revisions and observe service events, but expected stealth
        benefit falls substantially.
