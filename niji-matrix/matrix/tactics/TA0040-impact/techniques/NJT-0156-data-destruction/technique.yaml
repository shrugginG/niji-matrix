research:
  limitations:
    paragraphs:
    - zh: 官方资料确证生命周期规则权限、异步执行和事件形态，Palo Alto Networks 的威胁分析支持间接删除如何绕开仅看对象访问的监测；现有公开资料没有把某个真实受害者完整追溯为恶意规则写入、服务过期和业务不可用。故该子技术的恶意实例为受约束的攻击路径推断，不能填造受害案例。
      en: Official documentation establishes lifecycle authority, asynchronous execution, and event shapes, while
        Palo Alto Networks' threat analysis supports how indirect deletion evades object-access-only monitoring.
        Public evidence does not trace one real victim end to end from malicious rule write through service expiry
        to business outage. The malicious instance is therefore a bounded attack-path inference, not a fabricated
        victim case.
    - zh: 实际删除时点、可恢复性和漏检与否取决于桶配置、版本控制、对象锁、通知和跨平面日志留存。4663 删除权限事件也可能反映重命名，必须用完成事件或对象状态核实；父级 Windows 文件分析不能被当作云生命周期子项的直接证据。
      en: Actual deletion timing, recovery, and missed detection depend on bucket configuration, versioning, Object
        Lock, notifications, and cross-plane log retention. A Windows 4663 delete-access event may also indicate
        rename and needs a completion event or object-state check. The parent-level Windows file analytic is not
        direct evidence for the cloud lifecycle child.
