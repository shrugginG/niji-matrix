subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前原生分类只保留委托执行式数据销毁：其变量是破坏规则写入者与数据删除执行者在身份、时间及遥测平面上的分离。ATT&CK 的生命周期功能提供实例，但子技术边界不按云平台或规则名称划分；直接删除、覆写及删除对象类型属于父级行为，尚无证据证明其他独立匿迹轴。
      en: The current native taxonomy retains only Delegated-Execution Data Destruction. Its variable is separation
        of the destructive rule writer from the data-deletion executor across identity, time, and telemetry plane.
        ATT&CK's lifecycle feature supplies an example, but neither platform nor rule name defines the child. Direct
        deletion, overwrite, and object type remain parent behavior without evidence for another independent stealth
        axis.
    - zh: 选择性保留关键目标已有 NJT-0117 负责，来宾传感器隔离已有 NJS-0111-004 负责；慢速销毁和保留路径的覆写仍待结论级证据。一个真实事件可能结合这些行为，但组合不应消除各自不同的直接对象和防守关联方法。
      en: NJT-0117 owns selective preservation, and NJS-0111-004 owns guest sensor isolation. Slow destruction and
        namespace-preserving overwrite remain deferred pending conclusion-level evidence. One incident can combine
        these behaviors, but co-occurrence does not erase their different direct objects and defensive joins.
  coverage: established
