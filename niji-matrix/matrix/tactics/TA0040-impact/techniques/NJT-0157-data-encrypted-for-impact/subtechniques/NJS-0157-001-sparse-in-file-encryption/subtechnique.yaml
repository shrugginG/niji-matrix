research:
  limitations:
    paragraphs:
    - zh: SentinelOne Labs 观察了多个使用间歇加密的家族及具体区域模式，足以支持此变量的存在，但不能推出所有部分覆写都是恶意，亦无适用于所有文件格式和传感器的阈值。样本层面的匿迹意图描述与具体受害环境的检测成败应分开。
      en: SentinelOne Labs observed several families and regional patterns, supporting the variable's existence,
        but neither every partial overwrite is malicious nor one threshold fits all formats and sensors. Sample-level
        descriptions of evasion intent must be separated from detection outcomes in a particular victim environment.
    - zh: 区域比较需要可信前版本、受控诱饵或安全的内容抽样，大型文件会增加存储和隐私成本。仅有 DeviceFileEvents 时可以调查批量写入，但不能声称已观察到稀疏密文布局。
      en: Regional comparison needs a trusted prior version, controlled canary, or safe content sample and can raise
        storage and privacy costs for large files. DeviceFileEvents alone supports investigation of bulk writes
        but cannot establish observed sparse ciphertext layout.
