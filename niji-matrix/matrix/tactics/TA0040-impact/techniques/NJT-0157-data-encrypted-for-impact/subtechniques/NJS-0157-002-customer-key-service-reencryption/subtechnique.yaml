research:
  limitations:
    paragraphs:
    - zh: AWS CIRT 确认恶意大规模 SSE-C 覆写并给出对象数据事件线索，但未公开逐受害者的完整读取验证或时间线。该案例可证明观察到的操作模式，不能证明每个对象均永久无法恢复，也不能推广成所有云平台的通用
        API 字段。
      en: AWS CIRT confirms malicious mass SSE-C overwrites and object-data-event leads but does not publish a complete
        read test or timeline for each victim. The case proves the observed operation pattern, not permanent unrecoverability
        for every object or universal API fields across cloud platforms.
    - zh: AWS 在 2026 年默认阻止多类桶的新 SSE-C 写入，因此必须按桶核实当前允许状态和配置变更；历史攻击报告不能代表现在所有桶都易受此路径影响。组织持有旧版本时可能恢复，但当前版本的读取中断仍须独立确认。
      en: AWS's 2026 default blocks new SSE-C writes for multiple bucket classes, so permission state and configuration
        changes must be checked per bucket. A historical incident report does not establish susceptibility of every
        bucket today. Older versions may aid recovery, while current-version read interruption requires independent
        verification.
