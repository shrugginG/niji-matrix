research:
  limitations:
    paragraphs:
    - zh: SentinelOne Labs 的样本分析证明几种勒索程序采用间歇区段改写，却没有给出适用于所有文件类型和传感器的通用阈值。AWS CIRT 的报告确认恶意 SSE-C 大量覆写，但未披露每个客户的完整读取测试或主观匿迹动机；应分别报告样本事实、服务实现和检测推断。
      en: SentinelOne Labs' sample analysis establishes regional rewriting in several ransomware families but no
        universal threshold across file types or sensors. AWS CIRT confirms malicious mass SSE-C overwrites without
        publishing each customer's full read test or subjective stealth motive. Sample facts, service behavior,
        and detection inference must be reported separately.
    - zh: 缺少前版本时，端点文件事件最多提示异常写入，不能证明局部密文布局；缺少对象数据事件时，主机安静不能证明服务端未加密。2026 年后 S3 的 SSE-C 默认阻止使云路径依赖具体桶配置或额外配置权限，受保护旧版本可能恢复数据，但不能否认当前版本短时不可用。
      en: Without a prior version, endpoint file events suggest abnormal writes at most and cannot prove sparse
        ciphertext layout. Without object data events, a quiet host cannot rule out service-side encryption. S3's
        post-2026 default SSE-C block makes the cloud path contingent on bucket configuration or additional configuration
        authority. Protected prior versions may aid recovery without negating a temporary current-version outage.
