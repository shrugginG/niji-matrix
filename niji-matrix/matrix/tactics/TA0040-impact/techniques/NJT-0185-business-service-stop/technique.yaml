research:
  limitations:
    paragraphs:
    - zh: Prestige 直接证明攻击者用标准命令停止 MSSQL 服务，Windows 文档证明正常状态机，但事件报告把停止归于释放锁和提高加密可靠性，没有陈述维护式伪装动机。因此父行为置信度高，匿迹机理为中等，不能把所有有序停止解释为隐蔽。
      en: Prestige directly establishes an attacker stopping MSSQL with a standard command, and Windows documentation
        establishes the normal state machine. The incident attributes stopping to lock release and encryption reliability
        rather than maintenance camouflage. Parent behavior is high confidence while the stealth mechanism is medium,
        and not every orderly stop is covert.
    - zh: 服务状态和业务故障有大量正常原因；缺少调用者、权限、审批或独立健康结果时只能报告未经解释的停止。部分平台不会提供等价 SCM 字段，正式分析必须降低置信度而不能伪造字段。
      en: Service state and business failure have many benign causes. Without caller, authority, approval, or independent
        health outcome, only an unexplained stop can be reported. Some platforms lack equivalent SCM fields; deployment
        must lower confidence rather than invent fields.
