schema_version: 2.0.0
type: technique
id: NJT-0185
name:
  zh: 业务服务停用
  en: Business Service Stop
summary:
  zh: 攻击者通过服务接受的正常控制路径有序停止业务服务，使合法功能中断并让恶意停用呈现常规管理终态。
  en: Adversaries orderly stop business services through accepted control paths, interrupting legitimate functionality
    while giving malicious disablement an ordinary administrative terminal state.
aliases:
- Service Stop
- T1489
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1489
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1489
definition_and_concept:
  paragraphs:
  - zh: 业务服务停用是攻击者使数据库、消息、Web、工业应用、文件共享、虚拟化工作负载或其他业务功能从运行状态转为停止、禁用或不能继续服务合法用户。直接对象是服务可用性与消费结果；管理命令、API、进程终止形式、服务名称和平台只是实现。服务仍登记、底层数据仍存在或主机仍运行，都不否定业务可用性损失。
    en: Business Service Stop moves a database, messaging, Web, industrial application, file-sharing, virtualization
      workload, or another business function from running to stopped, disabled, or unable to serve legitimate users.
      The direct object is service availability and its consumer outcome. Management commands, APIs, process-termination
      form, service name, and platform are implementations. A registered service, surviving data, or a running host
      does not negate business availability loss.
  - zh: Niji 的正式范围要求有证据的观察差异：攻击者让服务管理器转交标准停止请求，服务按自身状态机清理并报告常规停止终态。恶意意图不编码在终态，防守方必须把控制者、权限、命令或 API、维护审批和业务结果重新连接。异常崩溃、资源耗尽和公开批量杀进程不在这一适配范围。
    en: Niji formal scope requires an evidenced observation difference. The adversary has a service manager deliver
      a standard stop request, and the service cleans up through its own state machine and reports an ordinary stopped
      terminal state. Malicious intent is absent from that terminal state, so defenders must reconnect controller,
      authority, command or API, maintenance approval, and business outcome. Abnormal crashes, resource exhaustion,
      and overt mass process killing fall outside this adapted scope.
stealth_characteristics:
  paragraphs:
  - zh: 业务服务停用把控制意图与状态结果分离。Windows SCM 接受停止控制后，服务从运行态经过停止待定进入停止态，同一序列也用于正常维护；只消费服务状态或健康面板的防守方看到熟悉的“已停止”，不会自动得知恶意主体或后继加密目的。相比异常终止，有序停止还移除崩溃或失败这一类区分特征。
    en: Business Service Stop separates control intent from state outcome. After Windows SCM accepts a stop control,
      the service moves from running through stop-pending to stopped, the same sequence used for maintenance. A defender
      consuming only service state or a health panel sees a familiar stopped result without the malicious principal
      or later encryption purpose. Compared with abnormal termination, orderly stopping also removes crash or failure
      as a distinguishing feature.
  - zh: 残余痕迹包括控制进程及命令行、账户与登录会话、服务句柄权限、SCM 状态、启动类型、依赖服务、维护单据缺口、外部业务健康失败及后继文件活动。直接 API 调用可能没有 net/sc 包装器，但调用进程、服务访问和不同权健康探针仍能恢复因果。
    en: Residual traces include controller process and command line, account and logon session, service-handle authority,
      SCM state, start type, dependencies, absent maintenance ticket, external health failure, and successor file
      activity. A direct API call may omit a net or sc wrapper, but caller process, service access, and a differently
      authorized health probe can still restore causality.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者通过业务服务接受的管理路径实施停止或禁用，并实际使组织预期功能不可用的行为。服务处于 stopped 状态本身不足；还需目标业务职责、控制主体或进程、未经批准上下文和健康/用户结果。补丁、升级、故障转移、容量维护、排障、依赖编排、崩溃恢复和许可证问题是强反例。
    en: Include an adversary stop or disablement through the accepted management path of a business service that actually
      makes an expected organizational function unavailable. A stopped state alone is insufficient; target business
      role, controlling principal or process, missing approval, and health or user outcome are also required. Patching,
      upgrade, failover, capacity maintenance, troubleshooting, dependency orchestration, crash recovery, and licensing
      issues are strong counterexamples.
  - zh: 安全产品、日志代理或响应服务被停用且直接削弱防御时归 NJT-0123；备份、快照和恢复服务被停用且直接损害恢复能力时归 NJT-0186。整机或虚拟机关机/重启归 T1529。停止服务为后继加密或销毁释放文件锁可以共同记录，但内容结果分别归
      NJT-0157 和 NJT-0156。
    en: Stopping a security product, logging agent, or response service belongs to NJT-0123 when it directly impairs
      defense. Stopping backup, snapshot, or recovery services belongs to NJT-0186 when it directly harms recovery.
      Whole-host or VM shutdown and reboot belongs to T1529. A service stop that releases locks for later encryption
      or destruction can be co-recorded, while content outcomes belong to NJT-0157 and NJT-0156 respectively.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 在勒索或破坏的数据处理阶段前，攻击者可用已取得的管理员会话、远程管理通道或载荷内服务 API，有序停止 MSSQL、Exchange、Web 应用或虚拟化相关业务服务。停止立即中断合法业务，也可能释放应用持有的数据文件。Prestige
        的硬编码 `net.exe stop MSSQLSERVER` 展示了这一链，但服务损失和后继密文必须分别证明。
      en: Before the data-processing stage of ransomware or destruction, an adversary can use an acquired administrator
        session, remote management path, or an in-payload service API to orderly stop MSSQL, Exchange, a Web application,
        or a virtualization-related business service. The stop immediately interrupts business and may release application-held
        files. Prestige's hard-coded `net.exe stop MSSQLSERVER` demonstrates the chain, while service loss and later
        ciphertext require separate proof.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要目标服务的停止或等价控制权限、服务和依赖知识，以及承受停机暴露行动的能力。命令包装器方便自动化但留下参数；直接 API 减少包装器，却仍有调用进程和服务句柄。受保护 DACL、不可停止服务、集群仲裁、快速故障转移和不同权审批会限制效果。
        en: The attacker needs stop or equivalent control authority, service and dependency knowledge, and tolerance
          for the outage exposing the operation. Command wrappers ease automation but leave arguments; direct APIs
          remove the wrapper while retaining a caller process and service handle. Protected DACLs, non-stoppable services,
          cluster quorum, rapid failover, and differently authorized approval constrain the effect.
    defender_model:
      paragraphs:
      - zh: 防守方保存服务清单及 owner、SCM 状态、进程与命令行、账户/会话、远程来源、服务权限、维护审批和独立业务健康探针，并按设备、服务、主体和时间关联。仅看当前状态无法判断操作者，限于 net/sc 会遗漏
          PowerShell、WMI 与直接 API，只有本地 agent 时还可能与服务一起失去观察。
        en: Defenders retain service inventory and owner, SCM state, process and command line, account and session,
          remote origin, service authority, maintenance approval, and an independent business-health probe and correlate
          by device, service, principal, and time. Current state cannot identify the operator, net/sc-only detection
          misses PowerShell, WMI, and direct APIs, and a local-only agent may lose observation together with the service.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 有序停止让恶意中断呈现常规管理终态
    en: Orderly stopping gives malicious interruption an ordinary administrative terminal state
  analysis:
    paragraphs:
    - zh: 攻击者经服务管理器发送服务已声明接受的停止控制，服务执行自身清理并报告停止待定和停止终态；痕迹从异常崩溃变为正常管理也会产生的状态序列。只消费状态的守方难以从终态区分恶意与维护，形成特征伪装；调用者、权限、审批与独立健康结果仍能揭示矛盾。
      en: The adversary sends a stop control accepted by the service through the service manager, and the service
        performs cleanup and reports stop-pending and stopped states. The trace changes from an abnormal crash to
        a sequence also produced by normal administration. State-only defenders cannot distinguish maliciousness from
        maintenance at the terminal state, producing feature disguise; caller, authority, approval, and independent
        health outcome reveal the contradiction.
  evidence_refs:
  - REF-000865
  - REF-000866
  - REF-000867
  - REF-000336
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 开放搜索只确认有序控制路径这一稳定匿迹变量，它同时定义适配后的父级范围，若再建唯一子项会与父级同义。命令包装器、平台、服务类别、停止数量、启动类型和后继载荷是实现、持续时间或相邻结果。
      en: Open search confirms only the orderly control path as a stable stealth variable, and it also defines the
        adapted parent scope; creating it as the sole child would duplicate the parent. Command wrapper, platform,
        service type, stop count, start type, and successor payload are implementations, duration, or adjacent outcomes.
    - zh: 维护窗口对齐、跨主机交错和低速停止缺少结论级攻击证据，保持 deferred；安全和恢复服务的选择由 NJT-0123 与 NJT-0186 负责。未来子项需另有可控变量、痕迹变化和不可互换防御。
      en: Maintenance-window alignment, cross-host staggering, and low-rate stopping lack conclusion-level attack
        evidence and remain deferred. NJT-0123 and NJT-0186 own selection of security and recovery services. A future
        child needs another controllable variable, trace change, and non-interchangeable defense.
  coverage: none-justified
  subtechnique_refs: []
