research:
  limitations:
    paragraphs:
    - zh: 官方资料建立可复现的策略—计算到期—服务删除链，防御资料也要求监控未授权保留变化；没有公开命名受害者案例证明攻击者实际用此路径造成失败恢复。正式置信度为中等且不创建 CASE。
      en: Official sources establish a reproducible policy-to-calculated-expiry-to-service-deletion chain, and defensive
        guidance calls for monitoring unauthorized retention changes. No public named victim case establishes attacker
        use causing failed restoration. Confidence is medium and no CASE is created.
    - zh: 服务删除时间、连续备份语义、锁模式和已有恢复点是否受新计划影响需按产品验证。短保留期、服务延迟和 RPO 缺口也可能由合法运营产生，必须连接主体、审批和结果。
      en: Service deletion timing, continuous-backup semantics, lock mode, and whether a new plan affects existing
        points require product validation. Short retention, service delay, and an RPO gap can also arise from legitimate
        operations and require actor, approval, and outcome.
