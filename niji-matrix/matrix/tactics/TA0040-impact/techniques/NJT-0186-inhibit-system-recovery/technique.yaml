research:
  limitations:
    paragraphs:
    - zh: 公开事件充分证明攻击者删除卷影副本、恢复点和备份，生产/恢复分面亦有权威指导；生产继续运行只说明潜伏窗口，不证明所有攻击者主观寻求匿迹。恢复点存在也不等于可恢复，只有受控演练能验证依赖。
      en: Public incidents establish adversary deletion of shadow copies, recovery points, and backups, and authoritative
        guidance supports production/recovery separation. Continued production creates a latent window but does not
        prove every adversary subjectively sought stealth. Recovery-point presence does not equal recoverability;
        controlled exercises are needed to validate dependencies.
    - zh: AWS 文档证明策略驱动自动到期与字段，Mandiant 证明需要监测该控制面，但没有命名受害者完成恶意策略写入到失败恢复的全链。子项保持中等置信且无 CASE，不能推广到字段和语义不同的其他产品。
      en: AWS documents policy-driven automatic expiry and fields, and Mandiant establishes the need to monitor that
        plane, but no named victim completes malicious policy write through failed restore. The child remains medium
        confidence without a CASE and cannot be generalized to products with different fields and semantics.
