  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 策略驱动的延迟恢复点到期以攻击者改变保留策略、由服务在计算时间执行删除为变量；它把写入主体与删除主体、配置时点与影响时点分开，需要策略版本和恢复点结果的长窗口关联。直接命令/API 删除保持父级核心。
      en: Deferred Policy-Driven Recovery-Point Expiry varies an attacker change to retention policy followed by service
        deletion at a calculated time. It separates policy writer from deletion actor and configuration time from
        impact time and requires long-horizon correlation between policy revision and recovery-point outcome. Direct
        command or API deletion remains parent core.
    - zh: 恢复介质类型、Windows 与云平台、备份产品和快照格式不是子项边界。跨账户拓扑、诱饵恢复点、低速删除和伪造恢复成功缺少结论级证据，保持 deferred。
      en: Recovery-media type, Windows versus cloud platform, backup product, and snapshot format do not define children.
        Cross-account topology, decoy recovery points, slow deletion, and forged restore success lack conclusion-level
        evidence and remain deferred.
