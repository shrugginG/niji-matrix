schema_version: 2.0.0
type: technique
id: NJT-0186
name:
  zh: 抑制系统恢复
  en: Inhibit System Recovery
summary:
  zh: 攻击者削减恢复点、备份或恢复依赖，使生产业务可能仍运行而未来恢复能力已不可见地下降。
  en: Adversaries reduce recovery points, backups, or dependencies so production may still run while future recoverability
    has already declined outside ordinary production observation.
aliases:
- T1490
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1490
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1490
definition_and_concept:
  paragraphs:
  - zh: 抑制系统恢复是攻击者删除、禁用或重配置卷影副本、备份、快照、恢复目录、恢复密钥、启动恢复和恢复服务，使受影响资产不能按既定 RPO/RTO 回到可信业务状态。直接对象是恢复职责及可恢复性结果，而不是当前生产数据是否已经被删除或加密。
    en: Inhibit System Recovery deletes, disables, or reconfigures shadow copies, backups, snapshots, recovery catalogs,
      recovery keys, boot recovery, or recovery services so an affected asset cannot return to a trusted business
      state under its intended RPO and RTO. The direct object is the recovery role and recoverability outcome rather
      than whether current production data has already been deleted or encrypted.
  - zh: Niji 关注恢复平面与生产平面的观察错位。恢复副本可以先被删除，或保留策略先被缩短，而生产系统继续服务；常规业务健康面因此看似正常，直到后续破坏或恢复请求才暴露风险。直接破坏和延迟策略都属于父级，只有后者具有足够独立的执行主体、时间和防御差异而形成原生子项。
    en: Niji focuses on the observation mismatch between recovery and production planes. Recovery copies can be deleted
      or retention shortened while production continues serving, so ordinary business-health views remain normal until
      later destruction or a restore request exposes the risk. Direct destruction and deferred policy action belong
      to the parent, while only the latter has sufficiently distinct execution actor, time, and defense to form a
      native child.
stealth_characteristics:
  paragraphs:
  - zh: 恢复抑制的影响常在当前业务之外积累：生产文件、服务和用户会话尚未变化，恢复点数量、保留期限、密钥或恢复依赖已被削弱。只监控生产可用性和端点告警的守方缺少恢复平面状态，不会立刻看见未来不可恢复性。直接删除留下密集命令/API，策略驱动到期则把策略主体与服务删除结果分离。
    en: Recovery-inhibition impact often accumulates outside current business operation. Production files, services,
      and sessions may be unchanged while recovery-point count, retention, keys, or dependencies have weakened. Defenders
      watching only production availability and endpoint alerts lack recovery-plane state and do not immediately see
      future non-recoverability. Direct deletion leaves concentrated commands or APIs, while policy-driven expiry
      separates the policy actor from service deletion outcomes.
  - zh: 残余痕迹包括恢复控制命令与进程、备份 API 主体、恢复点和 vault 标识、策略前后态、计算到期时间、锁状态、RPO 覆盖差及恢复演练结果。恢复清单、不同权控制面与完整演练能恢复差分；只有恢复点“存在”不能证明依赖或密钥完整。
    en: Residual traces include recovery-control commands and processes, backup API principal, recovery-point and
      vault identifiers, policy before and after state, calculated expiry, lock state, RPO coverage gap, and restore-test
      result. Recovery inventory, differently authorized control planes, and full exercises recover the differential.
      Mere recovery-point presence does not prove dependencies or keys are intact.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制的恢复对象或依赖状态下降，并能证明受保护资源的可恢复性、RPO 或恢复测试结果受损。命令、API 或策略变更未成功、恢复对象仍满足要求时只表示企图或暴露。已批准保留调整、灾备演练、资源退役、容量清理、备份迁移和故障修复是反例。
    en: Include adversary-controlled reduction in recovery-object or dependency state with proven damage to protected-resource
      recoverability, RPO, or restore-test outcome. An unsuccessful command, API, or policy change where recovery
      requirements remain met establishes attempt or exposure only. Approved retention changes, DR exercises, resource
      retirement, capacity cleanup, backup migration, and fault repair are counterexamples.
  - zh: 当前业务文件或对象被删除/覆写归 NJT-0156，被加密归 NJT-0157；停止普通业务服务归 NJT-0185。停止或篡改备份产品只有在直接损害恢复能力时进入本项；如果直接结果是安全观察削弱，还要按 NJT-0123
      评估。
    en: Deletion or overwrite of current business files and objects belongs to NJT-0156, encryption to NJT-0157, and
      stopping an ordinary business service to NJT-0185. Stopping or changing backup products enters here only when
      recovery is directly impaired; a direct loss of security observation also requires assessment under NJT-0123.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 勒索操作者可删除 Windows 卷影副本、禁用恢复环境和备份目录，或在云备份中删除恢复点、缩短保留期限及移除锁定。直接路径常紧邻加密；策略路径可在数小时或数日后由服务执行，使生产侧暂时无故障。
      en: Ransomware operators can delete Windows shadow copies, disable recovery environments and catalogs, or delete
        cloud recovery points, shorten retention, and remove locks. Direct paths often precede encryption, while a
        policy path can execute through the service hours or days later with no immediate production failure.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要本地主机恢复控制权、备份管理员/API 权限或改变生命周期和锁配置的云权限，并了解哪些副本覆盖关键资产。不可变合规锁、不同权账户、离线副本、最小权限和快速策略告警会限制效果；过早删除也会暴露行动。
        en: The attacker needs local recovery-control authority, backup administrator or API rights, or cloud authority
          over lifecycle and lock configuration and knowledge of copies covering critical assets. Immutable compliance
          lock, differently authorized accounts, offline copies, least privilege, and rapid policy alerts constrain
          the effect; early deletion can also expose the operation.
    defender_model:
      paragraphs:
      - zh: 防守方维护资产到恢复点、密钥、vault、RPO/RTO 和 owner 的映射，采集主机命令/状态、CloudTrail、策略版本、锁状态和删除结果，并执行受控恢复。若恢复管理与生产共享身份或日志、没有前态清单、只检查副本存在而不测试依赖，就会形成盲区。
        en: Defenders maintain mappings from assets to recovery points, keys, vaults, RPO/RTO, and owners; collect
          host command and state, CloudTrail, policy revisions, lock state, and deletion outcomes; and perform controlled
          restores. Blind spots arise when recovery and production share identities or logs, prior-state inventory
          is absent, or defenders check only copy presence without testing dependencies.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 恢复能力先于生产故障在独立观察面中消失
    en: Recovery capability disappears in a separate observation plane before production fails
  analysis:
    paragraphs:
    - zh: 攻击者先削减恢复副本、策略或依赖，生产业务仍从当前数据运行；痕迹落在恢复控制面和清单，而日常业务面暂时没有故障。只观察生产的守方会把风险推迟到加密、销毁或恢复请求之后，形成行为透明；不同权恢复清单、策略差分和演练能提前揭示。
      en: The adversary first reduces recovery copies, policy, or dependencies while production continues from current
        data. Traces remain in the recovery control plane and inventory while ordinary business shows no immediate
        failure. Production-only defenders defer discovery until encryption, destruction, or a restore request, producing
        behavioral transparency. Differently authorized recovery inventory, policy diffs, and exercises reveal it
        earlier.
