schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0187-001
parent_ref: NJT-0187
name:
  zh: 展示源绑定替换
  en: Display-Source Binding Substitution
summary:
  zh: 攻击者保留组织展示标识和规范源，却把标识绑定到替代内容源，使源站监控看似正常而用户看到篡改页面。
  en: An adversary preserves the organization display identifier and canonical source but binds the identifier to
    a substitute source, leaving origin monitoring normal while users see a defaced page.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 展示源绑定替换是攻击者不修改规范发布源，而改变组织展示标识到实际内容源的注册、DNS、路由或等效发布映射，使受众在组织身份下取得攻击者内容。稳定变量是标识—源关系被替换且规范源保持批准状态，不是 DNS 产品或内外位置。
    en: Display-Source Binding Substitution changes registration, DNS, routing, or an equivalent publication mapping
      from an organization display identifier to the actual source without modifying the canonical publication source,
      causing audiences to receive attacker content under the organization identity. The stable variable is a replaced
      identifier-to-source relation with an approved canonical source, not DNS product or internal/external location.
  - zh: 完成要求异常绑定或答案实际把用户引向替代源、替代源呈现未经授权内容且规范源仍是批准版本。只有注册变更、DNS 错误、证书异常或路径风险不确认展示篡改。
    en: Completion requires an anomalous binding or answer actually directing users to a substitute source, unauthorized
      content at that source, and a canonical origin still at the approved version. Registration change, DNS error,
      certificate anomaly, or path risk alone does not confirm defacement.
stealth_characteristics:
  paragraphs:
  - zh: 展示源绑定替换让源站文件、CMS 版本和部署审计保持干净，恶意内容和访问痕迹落在替代服务器与解析路径。只检查规范源的防守方得到正常完整性结果，用户却看到篡改页面，造成跨观察面的行为透明。
    en: Display-Source Binding Substitution leaves origin files, CMS versions, and deployment audit clean while malicious
      content and access traces reside at a substitute server and resolution path. Origin-only defenders receive a
      normal integrity result while users see a defaced page, producing behavioral transparency across observation
      planes.
  - zh: 注册/DNS 主体、前后 RRset、TTL、DNSSEC、跨解析器答案、替代证书、HTTP 正文和视觉哈希仍可恢复链。若已有带外域名通知、多观察点抓取和规范源比较，优势会缩小。
    en: Registrar and DNS actor, before and after RRsets, TTL, DNSSEC, cross-resolver answers, substitute certificate,
      HTTP body, and visual hash remain available to restore the chain. Out-of-band domain notifications, multivantage
      retrieval, and canonical-source comparison reduce the advantage.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入组织标识仍被受众使用、绑定被未经授权替换、实际页面或界面被篡改且规范源未发生对应批准变化的情况。正常 CDN/GeoDNS、故障转移、迁移、维护页和缓存传播是反例。
    en: Include cases where audiences still use the organization identifier, its binding is replaced without authorization,
      an actual page or interface is defaced, and the canonical source has no matching approved change. Normal CDN
      or GeoDNS, failover, migration, maintenance pages, and cache propagation are counterexamples.
  - zh: DNS 改道只窃取凭据、读取流量或造成不可用时分别评估钓鱼、中间路径或拒绝服务。直接修改源站内容保持父级核心；内部或外部位置不改变子项边界。
    en: DNS diversion used only to steal credentials, read traffic, or cause outage is assessed as phishing, intermediary
      path, or denial of service. Direct origin modification remains parent core, and internal or external location
      does not alter the child boundary.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者接管注册商或权威 DNS，将高价值网站名称指向托管篡改页的服务器，在真实源站和 CMS 不变时向公众展示恶意消息。Hushmail 事件证明注册控制、DNS 改向、替代页面和干净源站的完整链。
      en: An attacker takes over a registrar or authoritative DNS and points a high-value website name to a server
        hosting a defaced page, presenting an attacker message while the real origin and CMS remain unchanged. Hushmail
        establishes the full chain from registration control and DNS diversion to substitute page and clean origin.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要注册、权威 DNS 或客户端接受的解析路径权限，知道目标名称与记录并控制替代内容源。HTTPS 还需可接受证书或可容忍错误；TTL、DNSSEC、注册锁、通知和快速回滚限制覆盖与驻留。
        en: The attacker needs authority over registration, authoritative DNS, or a client-accepted resolution path,
          knowledge of the target name and records, and a substitute content source. HTTPS also requires an acceptable
          certificate or tolerance for errors; TTL, DNSSEC, registry locks, notification, and rollback constrain coverage
          and residence.
    defender_model:
      paragraphs:
      - zh: 防守方独立保存注册/DNS 变更身份、前后 RRset 与审批，从权威与多个递归器记录答案，并用相同 Host/SNI 抓取 TLS/HTTP 内容与规范源比较。单一解析器可能只见缓存，源站监控只证明源站未改，公共探测可能错过内部/选择性答案。
        en: Defenders independently retain registration and DNS actor, before and after RRsets, and approval, record
          answers from authoritative and multiple recursive resolvers, and retrieve TLS/HTTP content with the same
          Host and SNI for canonical comparison. One resolver may see only cache state, origin monitoring proves only
          the origin is unchanged, and public probes may miss internal or selective answers.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 源绑定替换绕开规范源完整性观察
    en: Source-binding substitution bypasses canonical-source integrity observation
  analysis:
    paragraphs:
    - zh: 攻击者把组织标识映射到替代服务器，关键变化进入注册/解析控制面，用户内容不再来自被 FIM 和发布审计覆盖的规范源。源站检查因此正常而影响已发生；跨 DNS 变化、解析答案、证书和实际内容关联能恢复原因。
      en: The attacker maps an organization identifier to a substitute server, moving the critical change into registration
        or resolution control while user content no longer comes from the canonical source covered by FIM and publication
        audit. Origin checks remain normal while impact occurs; joining DNS change, answers, certificate, and actual
        content restores the cause.
