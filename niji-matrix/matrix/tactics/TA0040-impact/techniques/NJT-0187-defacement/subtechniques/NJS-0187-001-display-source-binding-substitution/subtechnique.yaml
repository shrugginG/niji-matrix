research:
  limitations:
    paragraphs:
    - zh: 正式结论主要依赖 Hushmail 外部域名案例和规范文档，不能证明所有 DNS 劫持都以匿迹为目的，亦不能直接推广到现代 CDN、内部解析或选择性回答。
      en: The formal conclusion relies mainly on the external-domain Hushmail case and normative documentation. It
        does not prove every DNS hijack has a stealth purpose or directly generalize to modern CDN, internal resolution,
        or selective answers.
    - zh: 没有实际页面快照、用户观察或等价输出证据时，只能确认路径风险；缓存、证书错误和短驻留也可能使部分受众从未看到篡改内容。
      en: Without an actual page snapshot, user observation, or equivalent output evidence, only path risk is established.
        Cache, certificate errors, and brief residence can also mean some audiences never saw defacement.
