schema_version: 2.0.0
type: technique
id: NJT-0187
name:
  zh: 篡改展示内容
  en: Defacement
summary:
  zh: 攻击者恶意替换组织控制的视觉内容或界面结果，并通过把变化移出规范发布源而延迟发现与归因。
  en: Adversaries maliciously replace organization-controlled visual content or interface output and delay detection
    and attribution by moving the change outside the canonical publication source.
aliases:
- T1491
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1491
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1491
definition_and_concept:
  paragraphs:
  - zh: 篡改展示内容是攻击者让组织控制的网站、内部入口、登录消息、桌面或其他面向人的界面呈现未经授权的文字、图像或布局，以传递消息、恐吓、误导、施压或宣示入侵，直接损害展示完整性与受众信任。概念单位是组织身份或系统界面下实际呈现结果；文件、数据库、CMS、壁纸和
      DNS 记录只是载体。
    en: Defacement causes a website, internal portal, login message, desktop, or other human-facing interface controlled
      by an organization to present unauthorized text, imagery, or layout to communicate, intimidate, mislead, pressure,
      or claim intrusion, directly harming display integrity and audience trust. The conceptual unit is the result
      actually presented under the organization identity or interface; files, databases, CMS objects, wallpaper, and
      DNS records are carriers.
  - zh: Niji 关注展示结果与守方监测的规范发布源之间的观察差异。直接覆写页面或壁纸界定父行为但不自动构成匿迹；当攻击者保留规范源而替换标识到内容源的绑定时，源站完整性可继续显示正常，受众却取得攻击者页面。站点访问、Web
      shell 或不可见脚本若没有展示结果属于相邻行为。
    en: Niji focuses on the observation difference between displayed result and the canonical publication source monitored
      by defenders. Direct page or wallpaper overwrite defines the parent but is not automatically stealthy. If the
      adversary preserves the canonical source while replacing the identifier-to-source binding, origin integrity
      can remain normal while the audience receives an attacker page. Site access, a web shell, or invisible script
      without a display outcome is adjacent behavior.
stealth_characteristics:
  paragraphs:
  - zh: 篡改最终通常要被目标受众看到，匿迹价值在影响前后防守观察错位。源绑定被替换后，恶意内容、访问和证书痕迹位于替代服务器或解析路径，规范文件、CMS 和部署历史没有对应变化；只检查源站或单一探测点的守方可能把报告误判为缓存或客户端故障。
    en: Defacement is usually intended to be visible to its audience; stealth value lies in defender-observation mismatch
      before and around impact. After source binding changes, malicious content, access, and certificate traces reside
      at the substitute server or resolution path, while canonical files, CMS, and deployment history have no corresponding
      change. Origin-only or single-vantage defenders may misclassify reports as cache or client faults.
  - zh: 残余包括注册或托管区变更、前后 RRset、TTL、跨解析器答案、DNSSEC、替代 IP/证书、HTTP 重定向和正文/视觉哈希，以及规范源与用户内容差分。独立观察点、长期控制面日志与发布快照可恢复链条；合法故障切换、CDN
      迁移、维护页、A/B 测试和区域化是反例。
    en: Residue includes registrar or hosted-zone changes, before and after RRsets, TTLs, cross-resolver answers,
      DNSSEC, substitute IP and certificate, HTTP redirects and body or visual hashes, and a differential between
      canonical source and user content. Independent vantages, long-lived control-plane logs, and publication snapshots
      restore the chain. Legitimate failover, CDN migration, maintenance pages, A/B tests, and localization are counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入组织控制或被冒用的展示身份/界面实际向人呈现未经授权内容的行为，需要确认展示身份、可见结果和攻击行为到结果的关系。CMS 首页即使存于数据库中，只要直接对象是展示页面仍属本技术。
    en: Include behavior that actually presents unauthorized content to a person under an organization-controlled
      or appropriated display identity or interface. Classification requires the display identity, visible result,
      and adversary-to-result relation. A CMS home page remains in scope even when stored in a database if the direct
      object is the displayed page.
  - zh: T1565 负责业务数据值、传输数据或运行时数据变化以影响流程、理解或决策；业务记录在界面显示不自动成为 T1491。相似域克隆站和凭据页归钓鱼，承载命令或载荷的网页归 C2/投放，未改变人类可见内容的 Web
      shell 和普通站点攻陷不纳入。DNS 改道只有在组织身份下出现恶意展示时才确认本技术。
    en: T1565 owns business-value, transmitted-data, or runtime-data changes affecting process, understanding, or
      decision; rendering a manipulated record does not automatically make it T1491. Lookalike cloned sites and credential
      pages belong to phishing, web content carrying commands or payloads to C2 or staging, and web shells or compromise
      without changed human-facing content are excluded. DNS diversion confirms this technique only when malicious
      display appears under the organization identity.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者接管注册商或权威 DNS 账户，把组织网站的 A、AAAA、CNAME 或 NS 绑定改到托管篡改页面的服务器，同时保留真实源站。内部场景还包括入口、登录 banner 或桌面消息，但直接本地修改保持父级核心；伴随加密、擦除和凭据盗取分别建模。
      en: An attacker can take over a registrar or authoritative-DNS account and point an organization's A, AAAA,
        CNAME, or NS binding to a server hosting a defacement page while preserving the real origin. Internal scenarios
        include portals, login banners, or desktop messages, while direct local changes remain parent core; accompanying
        encryption, wiping, and credential theft are modeled separately.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需修改内容源或标识到源绑定的权限、选择高价值表面的知识和足够驻留时间。绑定替换需要控制注册、权威 DNS、解析或等效映射并提供替代内容；HTTPS 还可能需要可接受证书。注册锁、MFA、双人批准、DNSSEC、带外通知、缓存与快速回滚限制效果。
        en: The attacker needs authority over content source or identifier-to-source binding, knowledge of a high-value
          surface, and enough residence time. Binding substitution requires control of registration, authoritative
          DNS, resolution, or equivalent mapping and a substitute source; HTTPS may require an accepted certificate.
          Registry locks, MFA, dual approval, DNSSEC, out-of-band notification, caching, and rapid rollback constrain
          it.
    defender_model:
      paragraphs:
      - zh: 防守方分别取得内容库/CMS 版本、FIM、部署审计、注册/DNS 变更、递归答案、TLS 证书、多地域 HTTP/视觉快照和用户报告，并连接批准发布到实际输出以及名称绑定到内容源。只有源站 FIM、一个解析器或缺少前态
          RRset 时，展示与原因会拆散。
        en: Defenders separately obtain content-repository or CMS versions, FIM, deployment audit, registration and
          DNS changes, recursive answers, TLS certificates, multiregion HTTP or visual snapshots, and user reports
          and join approved publication to output and name binding to source. Origin FIM alone, one resolver, or missing
          prior RRsets separates display from cause.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 解析绑定替换使恶意展示落在规范源监测之外
    en: Resolution-binding replacement moves malicious display outside canonical-source monitoring
  analysis:
    paragraphs:
    - zh: 攻击者不修改受监测源站，而把组织展示标识指向攻击者服务器。关键变化落在注册或解析控制面，用户请求在另一源结束；源站 FIM、CMS 审计和部署哈希保持正常。防守若未连接 DNS 变化、跨解析器答案和实际 HTTP
        内容就看不到原因。
      en: The attacker leaves the monitored origin unchanged and directs the organization display identifier to an
        attacker server. The critical change resides in registration or resolution control, and user requests terminate
        at another source; origin FIM, CMS audit, and deployment hashes stay normal. Without joining DNS changes,
        cross-resolver answers, and actual HTTP content, defenders miss the cause.
  evidence_refs:
  - REF-000884
  - REF-000885
  - REF-000887
  - REF-000888
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 当前只保留展示源绑定替换：组织标识与规范内容源的绑定被替换，而规范源自身不变；痕迹从文件/CMS 平面转到注册、解析或发布控制面。内部/外部、网站/桌面、文件/数据库和平台都不是边界。
      en: 'The taxonomy retains only Display-Source Binding Substitution: the binding between organization identifier
        and canonical content source is replaced while the canonical source remains unchanged, moving traces from
        the file or CMS plane to registration, resolution, or publication control. Internal/external, website/desktop,
        file/database, and platform do not define boundaries.'
    - zh: T1491.001 和 .002 仅表示展示位置，不能形成原生匿迹兄弟项。按受众条件呈现、低差分覆盖和集中委托发布缺少结论级 T1491 证据，暂不进入正式分类。
      en: T1491.001 and .002 describe display location only and cannot form native stealth siblings. Audience-conditioned
        presentation, low-difference overlays, and centralized delegated publication lack conclusion-level T1491 evidence
        and remain outside the formal taxonomy.
  coverage: established
  subtechnique_refs:
  - NJS-0187-001
