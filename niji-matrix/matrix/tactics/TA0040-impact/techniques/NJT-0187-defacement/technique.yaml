research:
  limitations:
    paragraphs:
    - zh: ATT&CK 锚定父行为，ICANN Hushmail 调查直接证明 DNS 绑定替换与篡改结果；该单一 2005 外部域名事件不能证明 CDN、内部 DNS、MDM/GPO 或条件呈现具有相同链。DNS 变化本身也不证明篡改，必须保留实际内容与规范源状态。
      en: ATT&CK anchors the parent and ICANN's Hushmail investigation directly establishes DNS binding substitution
        and a defacement outcome. One 2005 external-domain case cannot establish identical chains for CDN, internal
        DNS, MDM/GPO, or conditioned presentation. DNS change alone does not prove defacement; actual content and
        canonical-source state are required.
    - zh: 动态页面、合法区域化、缓存传播、TLS 错误和缺失控制面日志限制检测。多观察点数量和五分钟轮次是调优起点而非来源测得阈值。
      en: Dynamic pages, legitimate localization, cache propagation, TLS errors, and absent control-plane logs limit
        detection. Vantage count and five-minute polling are tuning starts rather than source-measured thresholds.
