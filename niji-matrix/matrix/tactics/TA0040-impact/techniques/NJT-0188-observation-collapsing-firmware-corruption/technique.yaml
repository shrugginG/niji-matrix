research:
  limitations:
    paragraphs:
    - zh: CIH 来源证明破坏能力与 no-boot 症状，NIST 证明固件韧性和独立恢复需求；来源没有命名受害者事件完整写入链，也未声明攻击者为隐匿根因而选择固件破坏。因此父行为高置信，观察坍塌机理中等且无 CASE。
      en: The CIH source establishes destructive capability and no-boot symptoms, while NIST supports firmware resiliency
        and independent recovery. Sources do not provide a named victim with a complete write chain or state that
        the attacker chose corruption to conceal root cause. Parent behavior is high confidence, the observation-collapse
        mechanism medium, and no CASE is created.
    - zh: 很多旧设备缺少远程证明、BMC 或可读固件，恢复本身会改变证据。没有外部可信源、实际消费和离线差分时，只能报告固件完整性/启动异常，不能断言恶意破坏。
      en: Many legacy devices lack remote attestation, BMC, or readable firmware, and recovery can alter evidence.
        Without an external trust source, actual consumption, and offline differential, report firmware integrity
        or boot anomaly rather than malicious corruption.
