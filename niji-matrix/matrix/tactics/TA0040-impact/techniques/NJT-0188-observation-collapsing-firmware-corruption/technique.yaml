schema_version: 2.0.0
type: technique
id: NJT-0188
name:
  zh: 观察链坍塌型固件破坏
  en: Observation-Collapsing Firmware Corruption
summary:
  zh: 攻击者破坏启动或组件初始化所依赖的非易失固件，使设备不可用，并同时切断设备自身对破坏后状态的观察与报告。
  en: Adversaries corrupt nonvolatile firmware required for boot or component initialization, making the device unavailable
    while severing its own observation and reporting of the post-corruption state.
aliases:
- Firmware Corruption
- T1495
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1495
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1495
definition_and_concept:
  paragraphs:
  - zh: 观察链坍塌型固件破坏是攻击者未授权覆写、擦除或损坏平台或组件非易失存储中的固件代码及启动关键数据，使硬件无法初始化、操作系统无法接管，或组件不能提供预期功能。直接对象是硬件在上电或初始化阶段消费的固件状态与可用性结果，不是更新工具、品牌或普通磁盘内容。
    en: Observation-Collapsing Firmware Corruption is unauthorized adversary overwrite, erase, or damage to firmware
      code or boot-critical data in platform or component nonvolatile storage so hardware cannot initialize, the operating
      system cannot take control, or a component cannot provide expected function. The direct object is firmware state
      consumed by hardware at power-on or initialization and the resulting availability loss, not update tool, brand,
      or ordinary disk content.
  - zh: Niji 的附加条件是破坏同时移除同一设备的有效观察面：主机日志、EDR、管理代理或常规固件读回无法在变化后启动或响应，守方只能从变化前远程日志、外部控制器、证明失败或离线硬件取证重建原因。停机明显，匿迹效果位于受损设备无法自证写入者、固件差和根因。
    en: Niji adds the condition that corruption also removes an effective observation plane on the same device. Host
      logs, EDR, management agents, or ordinary firmware readback cannot start or respond after the change, forcing
      reconstruction from pre-change remote logs, external controllers, attestation failure, or offline forensics.
      The outage is conspicuous; the stealth effect lies in the damaged device's inability to establish writer, firmware
      difference, and root cause itself.
stealth_characteristics:
  paragraphs:
  - zh: 变化可由高权进程、驱动、闪存工具或暂存更新发起；一旦损坏内容在重启或组件初始化被消费，系统可在 OS、日志转发和传感器启动前停止。守方看到电源存在但 POST/启动/心跳缺失、组件消失或更新失败，而不是本机连续记录的攻击者写入—固件差—不可用链。
    en: A privileged process, driver, flash utility, or staged update can initiate the change. Once corrupted content
      is consumed during reboot or initialization, the platform can stop before the OS, log forwarder, and sensor
      start. Defenders see power without POST, boot, or heartbeat, a missing component, or update failure rather than
      a locally continuous chain from attacker write to firmware difference to unavailability.
  - zh: 残余包括刷写进程、驱动签名/hash、固件资源 GUID 与状态、审批、重启、TPM PCR/TCG 日志、BMC/串口 POST、心跳断点、已知良好映像和离线读回。不同权证明和不可变日志缩小盲区；设备自报版本与本地
      agent 在成功破坏后失去独立性。
    en: Residue includes flashing process, driver signature and hash, firmware-resource GUID and status, approval,
      reboot, TPM PCR and TCG log, BMC or serial POST, heartbeat break, known-good image, and offline readback. Differently
      authorized attestation and immutable logs reduce the blind spot; device self-reported version and local agent
      lose independence after successful corruption.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入要求攻击者控制的未授权固件变化、目标确为硬件消费的非易失对象、变化被上电/重启/初始化实际消费，以及设备或组件不可用且同一设备正常观察或读回失效。只有刷写工具、可写 SPI、hash 异常、暂存包或一次启动失败最多证明
      exposure/anomaly。
    en: Include only with an adversary-controlled unauthorized firmware change, a true hardware-consumed nonvolatile
      target, actual consumption at power-on, reboot, or initialization, and resulting device or component unavailability
      together with loss of the same device's ordinary observation or readback. A flashing tool, writable SPI, hash
      anomaly, staged package, or one boot failure establishes exposure or anomaly at most.
  - zh: 能启动并在 OS 前运行恶意代码归 NJT-0097；网络设备运行修改映像并继续服务归 NJT-0167；完成受限启动且防御缺席归 NJT-0172；磁盘扇区、MBR、分区和文件系统擦除归 T1561。合法签名更新因电源/兼容/硬件故障失败并回滚、厂商诊断与自然故障是反例。
    en: Malicious code that boots before the OS belongs to NJT-0097; a network device running a modified image while
      continuing service to NJT-0167; completed restricted boot with missing defenses to NJT-0172; and disk-sector,
      MBR, partition, and filesystem wiping to T1561. A legitimate signed update failing from power, compatibility,
      or hardware error and rolling back, vendor diagnostics, and natural failure are counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得内核或硬件接口访问后，可加载具有 SPI/物理内存写能力的驱动，识别芯片组和 BIOS 写保护，再擦除或覆写启动固件；也可滥用更新权限暂存重启时消费的破坏映像。CIH 证明 Flash BIOS 随机覆写能阻止重启，TrickBoot
        只证明现代写入前提和可行性。
      en: After obtaining kernel or hardware-interface access, an adversary can load a driver with SPI or physical-memory
        write capability, identify chipset and BIOS protection, and erase or overwrite boot firmware, or abuse update
        authority to stage a destructive image consumed at reboot. CIH establishes that random Flash BIOS overwrite
        can prevent reboot; TrickBoot establishes only modern prerequisites and feasibility.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要固件更新、SPI/flash、BMC 或等价低层写权限，准确识别型号、区域和写保护，并在验证/回滚前提交变化。硬件写保护、签名 capsule、最低版本、独立恢复根和错误写入过早 brick 会限制行动。
        en: The attacker needs firmware-update, SPI or flash, BMC, or equivalent low-level write authority, accurate
          model, region, and write-protection knowledge, and commitment before validation or rollback. Hardware write
          protection, signed capsules, minimum versions, independent recovery roots, and premature bricking constrain
          the operation.
    defender_model:
      paragraphs:
      - zh: 防守方在破坏前观察主体、包来源/hash/签名、进程/驱动、重启和固件资源状态；启动边界取得 TPM/TCG，失联后依靠不同权 BMC、串口、电源、集中日志、已知良好映像与离线读回。无硬件信任根、组件未测量或
          BMC 同时失陷时，恶意破坏与合法故障仍是竞争解释。
        en: Before corruption, defenders observe actor, package source/hash/signature, process and driver, reboot,
          and firmware-resource status; at boot they obtain TPM or TCG evidence, and after loss rely on differently
          authorized BMC, serial, power, centralized logs, known-good images, and offline readback. Without a hardware
          root, with an unmeasured component, or with a compromised BMC, malicious corruption and benign failure remain
          competing explanations.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 破坏固件同时终止设备自身的启动后观察与读回
    en: Firmware corruption also terminates the device's own post-boot observation and readback
  analysis:
    paragraphs:
    - zh: 攻击者损坏硬件启动或初始化必须消费的固件；生效后 OS、agent 与常规读回不能启动，原应由本机记录的固件变化和后继状态从观察链消失，只剩变化前写入痕迹、外部失联和硬件证据。匿迹效果是内容/根因从同一设备观察面脱落，而不是停机本身不被看见。
      en: The adversary corrupts firmware required by hardware boot or initialization. After consumption, the OS,
        agent, and ordinary readback cannot start, removing the firmware difference and successor state from the local
        observation chain and leaving pre-change write traces, external loss, and hardware evidence. The stealth effect
        is the content and root cause dropping from the same-device observation plane, not invisibility of the outage
        itself.
  evidence_refs:
  - REF-000892
  - REF-000194
  - REF-000897
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 开放搜索只确认在带观察坍塌这一稳定变量，它定义适配父级且作为唯一子项会同义重复。直接 flash 与 capsule、即时与重启消费、平台/外设类别及完全/部分损坏分别是路径、时机、目标或严重度。
      en: Open search confirms only in-band observation collapse as a stable variable, defining the adapted parent
        and becoming redundant as a sole child. Direct flash versus capsule, immediate versus reboot consumption,
        platform versus peripheral, and complete versus partial damage are path, timing, target, or severity distinctions.
    - zh: 破坏恢复固件属于 T1490 边界，触发门控由执行 taxonomy 负责；现有来源不足以建立另一个有独立防御的 NJS，因此覆盖为 none-justified。
      en: Corrupting recovery firmware meets the T1490 boundary, and trigger gating belongs to execution taxonomy.
        Current sources do not establish another NJS with independent defense, so coverage is none-justified.
  coverage: none-justified
  subtechnique_refs: []
