research:
  limitations:
    paragraphs:
    - zh: 在野证据直接支持 Windows 交互端 GPU 矿工读取活动反馈并启停；不能无条件推广到 CPU、带宽和服务器。具体 idle 秒数是样本实现而非子项边界或阈值。
      en: Field evidence directly supports a GPU miner on interactive Windows endpoints reading activity feedback
        and stopping or restarting. It cannot be generalized unconditionally to CPU, bandwidth, and servers. Exact
        idle seconds are a sample implementation, not the child boundary or threshold.
    - zh: 合法维护、渲染和批处理也可在空闲运行，进程 owner、批准用途、收益网络和重复闭环必须共同验证。
      en: Legitimate maintenance, rendering, and batch jobs can also run when idle; process owner, approved purpose,
        profit network, and repeated loop must be verified together.
