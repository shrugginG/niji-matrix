schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0189-001
parent_ref: NJT-0189
name:
  zh: 活动门控的剩余容量消耗
  en: Activity-Gated Residual-Capacity Consumption
summary:
  zh: 攻击者根据用户空闲或竞争负载暂停和恢复消费者，只在剩余容量窗口运行恶意任务。
  en: An adversary pauses and resumes a consumer according to user idle state or competing load, running malicious
    work only in residual-capacity windows.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 活动门控的剩余容量消耗是攻击者持续取得用户输入、会话、GPU/CPU 或业务负载反馈，并用该反馈决定恶意消费者何时启动、暂停或终止，使任务主要占用暂时未被合法活动使用的容量。稳定变量是反馈闭环控制的时间包络，不是低固定速率、夜间计划或矿工产品。
    en: Activity-Gated Residual-Capacity Consumption continually obtains user-input, session, GPU/CPU, or business-load
      feedback and uses it to decide when a malicious consumer starts, pauses, or stops, concentrating the task in
      capacity temporarily unused by legitimate activity. The stable variable is the feedback-controlled time envelope,
      not a fixed low rate, nighttime schedule, or miner product.
  - zh: 消费仍必须完成攻击者任务并产生可计量用量；仅查询空闲状态或部署调度代码是前置。活动出现时可靠收缩、空闲恢复时重启以及资源结果共同形成该子项。
    en: Consumption must still perform an adversary task and create metered usage; querying idle state or deploying
      scheduler code is a precursor. Reliable contraction when activity appears, restart when idle returns, and resource
      outcome together form the child.
stealth_characteristics:
  paragraphs:
  - zh: 活动门控的剩余容量消耗把持续高负载变为与用户活动负相关的分散片段，降低用户可感卡顿与短窗口阈值。合法活动越强，恶意消费者越弱或消失，使常规忙时抽样看到正常资源竞争；跨空闲—活动转换的长期分析却会看到同一进程反复随反馈启停。
    en: Activity-Gated Residual-Capacity Consumption converts sustained high load into dispersed fragments negatively
      correlated with user activity, reducing user-visible slowdown and short-window thresholds. As legitimate activity
      increases, the malicious consumer weakens or disappears, leaving normal competition in busy-period samples.
      Long-horizon analysis across idle-to-active transitions reveals one process repeatedly starting and stopping
      with feedback.
  - zh: 残余包括反馈 API/会话事件、矿工进程 lineage、资源计数、暂停/退出、重启任务和矿池/收益网络。固定低资源合法任务是反例，只有反馈关系与未经授权 owner 差共同成立才确认。
    en: Residue includes feedback APIs or session events, miner-process lineage, resource counters, pause or exit,
      restart task, and pool or profit network. Legitimate fixed-low-resource jobs are counterexamples; feedback relation
      and unauthorized owner differential must both hold.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入未经授权消费者的资源使用与用户/工作负载状态之间有重复、因果一致的负相关，并能连接到实际任务输出。单纯夜间运行、固定 CPU 上限、一次暂停或正常节能不满足。
    en: Include repeated, causally consistent negative correlation between unauthorized consumer resource use and
      user or workload state joined to actual task output. Nighttime operation, a fixed CPU cap, one pause, or normal
      power saving alone do not qualify.
  - zh: 消费者启动归执行，重启计划归持久化，进程隐藏归相应 stealth owner，竞争矿工清除归 NJT-0091；本项只描述反馈如何改变资源消费时间。
    en: Consumer start belongs to execution, restart scheduling to persistence, process hiding to its stealth owner,
      and competing-miner removal to NJT-0091. This child describes only how feedback changes the timing of resource
      consumption.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在 Windows 交互端部署 GPU 矿工，轮询最后输入与 GPU 负载；游戏、流媒体或用户活动出现时关闭矿工，空闲若干时间后由编排器重启。相同原理只有在证据证明闭环时才能扩展到 CPU 或业务服务器。
      en: An attacker deploys a GPU miner on an interactive Windows endpoint and polls last input and GPU load, terminating
        it when gaming, streaming, or user activity appears and restarting through an orchestrator after idle returns.
        The principle extends to CPU or servers only with evidence of a closed loop.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需执行消费者和反馈监测、可靠暂停/重启、保持收益通道并承受较低产量。应用控制、受保护任务/服务、资源隔离、会话审计和矿池限制提高成本。
        en: The attacker needs consumer and feedback-monitor execution, reliable pause and restart, a profit channel,
          and tolerance for lower yield. Application control, protected tasks or services, resource isolation, session
          audit, and pool restrictions raise cost.
    defender_model:
      paragraphs:
      - zh: 防守方关联进程唯一键、CPU/GPU 计数、锁定/解锁或输入空闲、进程停止/重启和网络目的，比较批准后台任务。短窗口高负载规则会漏检；性能计数无进程维度或活动事件缺失时只能报告 ownerless intermittent
          load。
        en: Defenders join process unique keys, CPU/GPU counters, lock/unlock or input idle, process stop/restart,
          and network destination against approved background jobs. Short-window high-load rules miss it; counters
          without process dimension or absent activity events yield only ownerless intermittent load.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 反馈闭环把消费分散到用户空闲与剩余容量窗口
    en: A feedback loop disperses consumption into user-idle and residual-capacity windows
  analysis:
    paragraphs:
    - zh: 攻击者监视活动反馈并在合法竞争出现时收缩消费者，空闲时恢复。持续用量变成跨窗口碎片，短阈值和用户感知低估累计消耗，形成时空释痕；把活动转换与同一消费者资源变化长期关联可恢复闭环。
      en: The attacker monitors activity feedback and contracts the consumer when legitimate competition appears,
        restoring it during idle. Continuous usage becomes cross-window fragments, causing short thresholds and user
        experience to underestimate cumulative consumption and producing spatiotemporal trace dilution. Long-horizon
        joining of activity transitions to the same consumer's resource changes restores the loop.
