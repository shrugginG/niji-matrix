research:
  limitations:
    paragraphs:
    - zh: Sysdig 直接观察凭据与服务探测、反向代理线索及模型调用尝试，但验证阶段没有运行合法模型查询，潜在每日费用不是实际损失。Twilio 提供交易字段和 pumping 模式而非命名案例，因此子项为中等置信且无
        CASE。
      en: Sysdig directly observed credential and service probes, reverse-proxy evidence, and attempted model calls,
        but the validation phase did not run legitimate model queries and potential daily cost is not realized loss.
        Twilio provides transaction fields and pumping patterns rather than a named case, so the child is medium confidence
        without a CASE.
    - zh: 提供方字段、日志默认值和计费语义不可互换。没有成功事务和 owner 差时，只能报告服务滥用风险；账单异常可能晚于实际影响。
      en: Provider fields, log defaults, and billing semantics are not interchangeable. Without a successful transaction
        and owner differential, only service-abuse risk can be reported; billing anomaly may lag impact.
