schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0189-002
parent_ref: NJT-0189
name:
  zh: 提供方代理的计量资源消耗
  en: Provider-Brokered Metered Consumption
summary:
  zh: 攻击者提交有效 API 或表单请求，让外部提供方执行并向受害账户计量任务，使主机端没有对应消费者。
  en: An adversary submits valid API or form requests so an external provider executes and meters work to the victim
    account without a corresponding host consumer.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 提供方代理的计量资源消耗是攻击者利用有效云身份、API key 或公共应用入口，提交会触发模型推理、消息发送或其他计费任务的请求，由服务提供方完成实际工作并记入受害账户。稳定变量是执行和计量位于提供方数据面，而受害主机没有对应消费者进程；服务类型不是边界。
    en: Provider-Brokered Metered Consumption uses a valid cloud identity, API key, or public application entry to
      submit requests that trigger model inference, message delivery, or another billable task performed and charged
      by the provider. The stable variable is execution and metering in the provider data plane without a corresponding
      victim-host consumer process; service type does not define the boundary.
  - zh: 完成要求成功服务事务和受害账户资源/费用/配额结果。凭据探测、ValidationException、未发送的 OTP 请求或潜在费用估算只表示前置风险；必须与真实调用或提供方发送记录相连。
    en: Completion requires a successful service transaction and resource, cost, or quota outcome on the victim account.
      Credential probes, ValidationException, an OTP request with no send, or potential-cost estimates establish precursor
      risk only and must join an actual invocation or provider delivery record.
stealth_characteristics:
  paragraphs:
  - zh: 提供方代理的计量资源消耗使主机 EDR 与本地性能计数没有模型计算或消息发送进程，生产侧可能只看到经认证 API 或普通验证码请求。实际执行、目标和计量位于提供方日志，若这些日志默认未启用、分区域或只在账单后出现，业务侧检测难以及时理解资源消耗。
    en: Provider-Brokered Metered Consumption leaves host EDR and local counters without a model-compute or message-send
      process, while production may see only authenticated API or ordinary verification requests. Execution, target,
      and metering reside in provider logs. If those logs are disabled by default, regional, or visible only through
      later billing, business-side detection struggles to understand consumption promptly.
  - zh: 服务主体、来源、user-agent、请求/交易 ID、模型、token、号码、转换状态、配额和费用仍可连接。按应用 owner、主体、目标及转换率计量能缩小盲区；合法新应用、负载测试、OTP 峰值与跨区故障转移是反例。
    en: Service principal, origin, user-agent, request or transaction ID, model, tokens, number, conversion state,
      quota, and cost remain joinable. Metering by application owner, principal, target, and conversion rate reduces
      the blind spot. Legitimate new applications, load tests, OTP peaks, and cross-Region failover are counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入提供方成功执行并计量的未经授权事务，且组织无法把主体、用途、来源或目标与批准应用对应。只有 API 登录、服务枚举、日志配置查询、表单请求或费用告警不够；需实际服务结果。
    en: Include successful provider-executed and metered unauthorized transactions where the organization cannot map
      principal, purpose, origin, or target to an approved application. API login, service enumeration, logging-configuration
      inquiry, form request, or cost alert alone is insufficient; an actual service result is required.
  - zh: 在受害 VM/容器内运行矿工或代理属于父级/其他子项，不因云托管而进入本项。低覆盖区域选择归 NJT-0121；短信、AI、SaaS 和提供方名称是实现，不能再拆 NJS。
    en: A miner or proxy running inside a victim VM or container remains parent or another child and does not enter
      merely because it is cloud hosted. Low-coverage Region choice belongs to NJT-0121. SMS, AI, SaaS, and provider
      names are implementations and do not create more NJS.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者用窃取云凭据调用托管模型，或自动化公开 OTP/验证入口让消息提供方向攻击者号码发送高成本短信。服务执行计算或投递并记入受害账户，端点无对应进程。
      en: An attacker uses stolen cloud credentials to invoke a hosted model or automates a public OTP or verification
        entry so a messaging provider sends costly messages to attacker numbers. The service executes compute or delivery
        and meters the victim account without an endpoint process.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要有效身份或可驱动提供方事务的公共入口、足够配额和把输出/收益接回自身的目标。短期分应用身份、服务禁用、事务速率/目的地控制、模型/消息限额和 bot 挑战会降低收益。
        en: The attacker needs a valid identity or public entry that drives provider transactions, sufficient quota,
          and a target returning output or profit. Short-lived per-app identity, disabled services, transaction rate
          or destination controls, model or message limits, and bot challenges reduce yield.
    defender_model:
      paragraphs:
      - zh: 防守方启用每个允许区域的提供方调用/交易日志，连接 CloudTrail 或应用入口、主体、来源、请求 ID、模型/token 或号码/转换，并映射 owner、预算和批准用途。共享角色、无请求映射、日志延迟或被盗批准应用会削弱判断。
        en: Defenders enable provider invocation or transaction logs in each allowed Region and join CloudTrail or
          application entry, principal, origin, request ID, model and token or number and conversion to owner, budget,
          and approved purpose. Shared roles, absent request mapping, log delay, or a compromised approved app weaken
          judgment.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 提供方执行把消费移出受害主机资源观察面
    en: Provider execution moves consumption outside victim-host resource observation
  analysis:
    paragraphs:
    - zh: 攻击者提交有效请求，提供方完成实际计算或发送并向受害账户计量；主机没有消费者进程或本地资源峰值，只看端点的守方无法看到任务。转向服务事务、身份和用量日志可恢复行为链。
      en: The attacker submits a valid request, and the provider performs the compute or delivery and meters the victim
        account. The host has no consumer process or local-resource spike, so endpoint-only defenders cannot see the
        task. Provider transaction, identity, and usage logs restore the chain.
