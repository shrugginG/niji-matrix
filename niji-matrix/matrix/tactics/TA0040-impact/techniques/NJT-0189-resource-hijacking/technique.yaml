research:
  limitations:
    paragraphs:
    - zh: Microsoft 案例高质量支持 Windows 交互端 GPU 活动门控，扩展到 CPU、带宽或服务器负载需降低置信度。Sysdig 观察凭据探测、配置查询与模型调用尝试，但潜在日费用不是实际损失；Twilio
        提供字段和模式而非受害案例。
      en: Microsoft's case strongly supports activity-gated GPU use on interactive Windows endpoints; extension to
        CPU, bandwidth, or server load needs lower confidence. Sysdig observed credential probes, configuration inquiry,
        and attempted model calls, while potential daily cost is not realized loss; Twilio supplies fields and patterns
        rather than a victim case.
    - zh: 账单、配额和性能异常可由正常增长产生，必须恢复 owner、批准用途与实际交易。提供方子项为中等置信且无 CASE；平台字段不可互换。
      en: Billing, quota, and performance anomalies can arise from normal growth and require owner, approved purpose,
        and actual transactions. The provider child is medium confidence without a CASE; platform fields are not interchangeable.
