schema_version: 2.0.0
type: technique
id: NJT-0189
name:
  zh: 资源劫持
  en: Resource Hijacking
summary:
  zh: 攻击者未经授权消耗受害方资源完成自身任务，并通过活动门控或提供方计量执行使消耗更像正常容量波动或合法交易。
  en: Adversaries consume victim resources for their own tasks and use activity gating or provider-metered execution
    to make usage resemble normal capacity variation or legitimate transactions.
aliases:
- T1496
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1496
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1496
definition_and_concept:
  paragraphs:
  - zh: 资源劫持是攻击者未经资源所有者授权，使用受控主机、容器、云账户、网络出口、消息平台或托管服务执行攻击者任务，消耗计算周期、带宽、消息额度、模型令牌、配额或费用预算。直接对象是可计量资源及 owner，影响为费用、配额、性能、容量或受害身份承担的外部滥用。
    en: Resource Hijacking is adversary use of a controlled host, container, cloud account, network egress, messaging
      platform, or managed service without owner authorization to perform an adversary task, consuming compute cycles,
      bandwidth, messages, model tokens, quota, or spending budget. The direct object is a metered resource and its
      owner, with cost, quota, performance, capacity, or external abuse attributed to the victim.
  - zh: 概念锚连接主体/入口、实际消费动作、资源计量、批准 owner/用途和结果。挖矿、代理、短信、AI 和垃圾消息是用途，同一资源可有多种用途；只有有证据改变消费时间包络或执行观察面的方式进入原生子项。
    en: The concept joins principal or entry, actual consumption, resource meter, approved owner and purpose, and
      outcome. Mining, proxying, SMS, AI, and spam are uses and one resource can have many uses; only evidenced changes
      to the consumption envelope or execution observation plane enter native children.
stealth_characteristics:
  paragraphs:
  - zh: 持续满载或突发滥用易产生性能和账单峰值。攻击者可读取用户空闲或竞争负载，只在剩余容量出现时运行消费者，降低忙时异常；也可让云/通信提供方在受害账户下执行计量事务，使主机 EDR 没有对应工作进程，生产侧只出现看似有效请求。
    en: Continuous saturation or burst abuse creates performance and billing spikes. An attacker can read user idle
      or competing load and run a consumer only when residual capacity appears, reducing busy-period anomalies, or
      have a cloud or communications provider execute metered transactions under the victim account, leaving host
      EDR without a corresponding worker and production with apparently valid requests.
  - zh: 进程 lineage、CPU/GPU/网络计量、会话状态、服务主体、请求 ID、号码、模型、令牌、配额和费用仍可观察。owner 基线、活动状态关联、按主体计量和服务事务日志缩小优势；后台批处理、扩缩容、OTP
      峰值和模型测试是反例。
    en: Process lineage, CPU/GPU/network meters, session state, service principal, request ID, number, model, tokens,
      quota, and cost remain observable. Owner baselines, activity-state correlation, per-principal metering, and
      service transaction logs reduce the advantage; background batches, autoscaling, OTP peaks, and model tests are
      counterexamples.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者实际使用受害资源完成自身任务，并能证明用量、费用、配额或容量影响及相应匿迹变量。只创建实例、取得 shell、探测 API、安装代理或保存凭据是前置；费用异常也需排除批准扩容、增长、价格变化和配置错误。
    en: Include actual adversary use of victim resources for an adversary task with proven usage, cost, quota, or
      capacity effect and its stealth variable. Instance creation, shell access, API probes, proxy installation, or
      stored credentials are precursors. Cost anomalies also require exclusion of approved scaling, growth, price
      changes, and configuration mistakes.
  - zh: 工作负载执行、凭据、C2 与持久化保留各自对象；低覆盖区域归 NJT-0121，竞争驻留驱逐归 NJT-0091，直接以耗尽为目标归 DoS，资金转移归 T1657。资源种类、厂商、矿池、号码国家与收益方式不形成
      NJS。
    en: Workload execution, credentials, C2, and persistence retain their own objects. Low-coverage Region placement
      belongs to NJT-0121, competing-foothold eviction to NJT-0091, direct exhaustion objectives to DoS, and fund
      transfer to T1657. Resource type, vendor, pool, destination country, and revenue form do not define NJS.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 交互端点上的矿工可按空闲输入、游戏或流媒体负载暂停/恢复，在用户不易感知时消耗剩余 GPU/CPU。云环境可在容器/VM 运行矿工或代理。托管服务中，窃取凭据可调用模型推理，公开 OTP 表单可驱动提供方向攻击者号码发送短信，受害方承担令牌、消息与费用。
      en: A miner on an interactive endpoint can pause and resume according to idle input, gaming, or streaming load,
        consuming residual GPU or CPU when less noticeable. Cloud environments can run miners or proxies in containers
        or VMs. In managed services, stolen credentials can invoke models and a public OTP form can drive a provider
        to send SMS to attacker numbers, leaving tokens, messages, and cost to the victim.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要执行消费者或调用计量服务的权限、收益/任务返回路径和足够驻留/凭据寿命。活动门控需读取用户/负载并暂停消费者；提供方消费需有效 API/表单入口、额度和服务。限额、短期身份、owner 绑定、事务限制和隔离降低收益。
        en: The attacker needs authority to execute a consumer or invoke a metered service, a return path for profit
          or task, and sufficient foothold or credential life. Activity gating needs user or load visibility and pausing;
          provider consumption needs a valid API or form entry, quota, and service. Limits, short-lived identity,
          owner binding, transaction controls, and isolation reduce yield.
    defender_model:
      paragraphs:
      - zh: 防守方观察进程、性能计数、网络、用户活动、云身份/API、提供方调用、令牌/消息、费用和配额，把计量映射到 owner、批准工作负载和来源，并跨分钟活动切换与日/周费用保持多尺度关联。高 CPU 阈值漏看活动门控，主机
          EDR 漏看提供方执行，月账单发现过晚。
        en: Defenders observe processes, performance counters, network, user activity, cloud identity and API, provider
          invocation, tokens or messages, cost, and quota; map meters to owner, approved workload, and origin; and
          correlate minute-level activity changes with daily or weekly spending. High-CPU thresholds miss gating,
          host EDR misses provider execution, and monthly billing detects too late.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 消费移动到空闲窗口并在竞争活动出现时收缩
    en: Consumption shifts into idle windows and contracts when competing activity appears
  analysis:
    paragraphs:
    - zh: 攻击者持续读取用户空闲或 GPU/业务负载，在竞争活动出现时终止消费者、空闲恢复后重启。资源痕迹从持续高负载变为与用户活动负相关的时间片段，局部阈值和体验难以重建累计消耗；长期活动—资源相关仍揭示闭环。
      en: The adversary continuously reads idle or GPU/business load and stops the consumer when competing activity
        appears, restarting after idle. Resource traces change from sustained load to time fragments negatively correlated
        with user activity, weakening local thresholds and user experience as measures of total consumption; long-horizon
        activity-resource correlation reveals the loop.
  evidence_refs:
  - REF-000900
  - REF-000906
  - REF-000907
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 提供方执行把消耗移出受害主机传感器
    en: Provider execution moves consumption outside victim host sensors
  analysis:
    paragraphs:
    - zh: 攻击者提交看似有效的模型、消息或验证请求，提供方执行并把实际工作计入受害账户；主机进程与本地资源视图没有对应工作，守方必须转向身份、服务调用和计量日志。事务 ID、主体、目标、令牌/消息和费用仍可关联。
      en: The attacker submits apparently valid model, messaging, or verification requests while the provider executes
        and meters work to the victim account. Host processes and local-resource views have no corresponding work,
        requiring identity, service-call, and meter logs. Transaction ID, principal, target, tokens or messages, and
        cost remain correlatable.
  evidence_refs:
  - REF-000901
  - REF-000902
  - REF-000903
  - REF-000904
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 活动门控的剩余容量消耗按闭环活动信号控制何时消费划分；提供方代理的计量资源消耗按实际执行/计量位于外部提供方而主机无对应消费者划分。两者可共现，但时间包络和观察域不互相蕴含，防御数据不同。
      en: Activity-Gated Residual-Capacity Consumption is defined by a closed-loop activity signal controlling when
        consumption runs. Provider-Brokered Metered Consumption is defined by execution and metering at an external
        provider without a corresponding host consumer. They can co-occur, but time envelope and observation domain
        do not imply each other and require different defense data.
    - zh: T1496.001–.004 按资源与变现形式划分且不导入。计算为活动门控提供证据，短信与托管服务为提供方计量提供证据，带宽保持父级。跨资产稀释与 victim-IP 归因转移证据不足，区域选择和竞争者驱逐由既有技术负责。
      en: T1496.001–.004 partition resource and monetization forms and are not imported. Compute supplies activity-gating
        evidence, SMS and hosted services supply provider-metering evidence, and bandwidth remains parent core. Cross-asset
        dilution and victim-IP attribution transfer lack evidence, while Region selection and competitor eviction
        have existing owners.
  coverage: established
  subtechnique_refs:
  - NJS-0189-001
  - NJS-0189-002
