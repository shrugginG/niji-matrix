type: evasion-subtechnique
id: NJS-0198-001
parent_ref: NJT-0198
name:
  zh: 多源低贡献洪泛
  en: Multi-Source Low-Contribution Flooding
summary:
  zh: 攻击者把洪泛分散到大量真实来源，使每源贡献低而目的端汇聚后耗尽容量。
  en: An adversary distributes flooding across many real sources so each contributes little while destination aggregation
    exhausts capacity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 多源低贡献洪泛通过多个真实执行来源协同向同一目的、前缀或服务发送互补流量，让单源速率/包量保持较低而聚合 fan-in 超过网络容量。稳定变量是真实来源分布与局部贡献，不是 botnet 家族、国家或协议。
    en: Multi-Source Low-Contribution Flooding coordinates multiple real executing origins toward one destination,
      prefix, or service so per-source rate or packets stay low while aggregate fan-in exceeds network capacity. The
      stable variable is real-origin distribution and local contribution, not botnet family, country, or protocol.
  - zh: 完成要求目的路径容量/丢弃和合法通信失败；多源扫描、C2 心跳或未饱和流量不是本项。来源数量本身无固定阈值，需相对于每源基线和总体容量判断。
    en: Completion requires destination path capacity or discard and failed legitimate communication. Multi-source
      scanning, C2 heartbeat, or unsaturated traffic falls outside. Source count has no universal threshold and is
      judged against per-source baseline and aggregate capacity.
stealth_characteristics:
  paragraphs:
  - zh: 多源低贡献洪泛使每个来源只留下接近普通连接的弱信号，攻击总量只在目的或中转汇聚。单源限速与一个 observation domain 无法看见完整图像；来源/AS 分布、目的 fan-in、容量和丢弃的跨域关联仍可恢复。
    en: Multi-Source Low-Contribution Flooding leaves only weak ordinary-looking signals per origin while total attack
      appears at destination or transit aggregation. Per-source rate limits and one observation domain miss the full
      picture; cross-domain correlation of source or AS distribution, destination fan-in, capacity, and discard restores
      it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入多个真实来源低局部贡献、同一目的聚合和网络可用性结果。单一 NAT 后大量合法用户、CDN、软件发布和自然 flash crowd 是反例；伪造同一受害源驱动第三方响应属于兄弟项。
    en: Include low local contribution from multiple real origins, aggregation at one destination, and network-availability
      outcome. Many legitimate users behind NAT, CDN, software release, and natural flash crowd are counterexamples;
      third-party responses driven by a spoofed victim source belong to the sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制 bot、代理或受侵主机群，让每节点发送不高的 UDP/TCP/HTTP 流量，目标边界在总体上被耗尽。
      en: An attacker controls bots, proxies, or compromised hosts and has each send modest UDP, TCP, or HTTP traffic
        while aggregate traffic exhausts the target boundary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要足够来源、同步能力和目标容量知识，并承受节点失效与上游阻断；Anycast、CDN、清洗和跨源限额降低效果。
        en: The attacker needs enough origins, coordination, and knowledge of target capacity and tolerates node loss
          and upstream blocking; Anycast, CDN, scrubbing, and cross-source limits reduce the effect.
    defender_model:
      paragraphs:
      - zh: 防守方需要多域流量、目的容量、来源/AS 基线和合法业务事件。采样、共享限制和代理/NAT 会降低来源判断。
        en: Defenders need multidomain flows, destination capacity, source or AS baselines, and legitimate business
          events. Sampling, sharing limits, and proxies or NAT weaken source assessment.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 每源低贡献在目的端聚合为容量耗尽
    en: Low per-source contribution aggregates into destination capacity exhaustion
  analysis:
    paragraphs:
    - zh: 攻击者把总洪泛拆散到来源与时间，局部事件低于单源门槛，目的 fan-in 和接口利用却累积。跨观察域聚合恢复完整活动。
      en: The attacker divides total flooding across origins and time, keeping local events below per-source thresholds
        while destination fan-in and interface utilization accumulate. Cross-observation-domain aggregation restores
        the complete activity.
