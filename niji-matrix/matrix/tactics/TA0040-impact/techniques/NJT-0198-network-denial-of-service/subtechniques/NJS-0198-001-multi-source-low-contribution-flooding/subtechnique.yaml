research:
  limitations:
    paragraphs:
    - zh: 标准与研究支持来源拓扑与汇聚效果，但来源数量、单源贡献和饱和阈值随链路/采样变化；无命名 CASE。
      en: Standards and research support source topology and aggregation effects, but source count, local contribution,
        and saturation thresholds vary by link and sampling; no named CASE is used.
    - zh: flash crowd 与大型合法事件可能完全同形，需 owner、事件日历和协议行为排除。
      en: Flash crowds and large legitimate events can be isomorphic and require owner, event-calendar, and protocol
        behavior for exclusion.
