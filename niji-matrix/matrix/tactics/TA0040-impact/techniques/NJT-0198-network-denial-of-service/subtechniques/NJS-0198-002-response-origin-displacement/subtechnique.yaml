research:
  limitations:
    paragraphs:
    - zh: 规范资料高置信支持反射因果，但不同协议的请求/响应字段和放大语义不可互换；无命名 CASE。
      en: Normative sources strongly support reflection causality, but request and response fields and amplification
        semantics are not interchangeable across protocols; no named CASE is used.
    - zh: 缺 victim 出站日志、NAT/Anycast 和采样会削弱无请求判断；合法异步响应需协议/业务基线。
      en: Missing victim outbound logs, NAT or Anycast, and sampling weaken unmatched-response analysis; legitimate
        asynchronous responses need protocol and business baselines.
