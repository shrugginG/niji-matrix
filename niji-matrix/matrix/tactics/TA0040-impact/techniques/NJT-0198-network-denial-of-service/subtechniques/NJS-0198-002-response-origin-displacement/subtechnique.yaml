schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0198-002
parent_ref: NJT-0198
name:
  zh: 响应源归因置换
  en: Response-Origin Displacement
summary:
  zh: 攻击者伪造受害源驱动第三方服务回包，使合法响应者成为受害侧可见来源并隐藏真实发起者。
  en: An adversary spoofs the victim source to drive third-party replies, making legitimate responders victim-visible
    origins and hiding the true initiator.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 响应源归因置换是攻击者以受害者地址为源向第三方 UDP/无连接服务发送请求，使这些服务向受害者产生响应流量。稳定变量是可见响应来源与真实诱导请求发起者分离；是否放大、协议名称和 reflector 数量是实现。
    en: Response-Origin Displacement sends requests to third-party UDP or connectionless services with the victim
      address as source so those services reply to the victim. The stable variable is separation of visible response
      origin from the true inducement requester; amplification, protocol name, and reflector count are implementations.
  - zh: 完成要求无对应 victim 请求、第三方响应与容量损失相连。正常递归、缓存、异步 webhook 或合法服务回包不是本项。
    en: Completion requires absent corresponding victim requests and third-party responses joined to capacity loss.
      Normal recursion, caching, asynchronous webhooks, or legitimate service replies are excluded.
stealth_characteristics:
  paragraphs:
  - zh: 响应源归因置换让目标看到大量真实 DNS/NTP/其他服务地址，黑名单和受害侧来源调查指向被滥用响应者，而真实攻击者在另一网络发送小请求。请求—响应不对称、协议事务 ID、包长比和无出站请求仍可揭示因果。
    en: Response-Origin Displacement makes the target see real DNS, NTP, or other service addresses, directing blacklists
      and victim-side source investigation toward abused responders while the attacker sends small requests elsewhere.
      Request-response asymmetry, protocol transaction IDs, packet-size ratio, and absent outbound requests reveal
      causality.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入伪造 victim source、第三方协议响应、无对应请求和网络容量/通信失败的链。直接 bot 流量、被攻陷 reflector 上的攻击代码或仅源地址欺骗而无反射结果不满足。
    en: Include a chain of spoofed victim source, third-party protocol responses, no corresponding request, and network
      capacity or communication failure. Direct bot traffic, attack code on a compromised reflector, or source spoofing
      without a reflection outcome do not qualify.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者向开放 DNS 递归器、NTP 或其他反射服务发送小请求并伪造 victim 地址，第三方响应在目标汇聚。
      en: An attacker sends small requests to open DNS resolvers, NTP, or other reflectors with the victim address
        spoofed, and third-party responses converge on the target.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可伪造源的网络与可访问 reflector；BCP38、服务 ACL 和响应限速限制效果。
        en: The attacker needs a spoof-capable network and reachable reflectors; BCP38, service ACLs, and response
          limiting constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方要连接 victim 出站请求、入站响应、协议字段、来源 AS 和容量；没有出站日志时只能概率判断。
        en: Defenders join victim outbound requests, inbound responses, protocol fields, source AS, and capacity;
          without outbound logs only probabilistic classification is possible.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 合法第三方响应者掩盖诱导请求发起者
    en: Legitimate third-party responders disguise the inducement requester
  analysis:
    paragraphs:
    - zh: 攻击者伪造受害源，第三方按协议响应，受害侧来源身份被置换为正常服务。真实攻击者与大流量不在同一观察面，形成特征伪装；无请求响应关联恢复。
      en: The attacker spoofs the victim source and third parties reply normally, replacing victim-visible origin
        identity with legitimate services. The real attacker and large traffic are in different observation planes,
        producing feature disguise; unmatched-response correlation restores it.
  evidence_refs:
  - REF-000956
  - REF-000958
  - REF-000960
  confidence: high
