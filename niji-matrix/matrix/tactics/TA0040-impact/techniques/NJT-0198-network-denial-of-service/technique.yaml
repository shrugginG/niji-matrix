research:
  limitations:
    paragraphs:
    - zh: NIST/IETF 高置信支持分布式与反射拓扑、源伪造和控制，但没有为本批建立一个具完整受害链的命名 CASE。来源分布也可能为 flash crowd，反射响应者通常是被滥用而非被控制。
      en: NIST and IETF strongly support distributed and reflection topology, spoofing, and controls, but this batch
        has no named CASE with a complete victim chain. Source distribution can also be a flash crowd, and reflectors
        are usually abused rather than controlled.
    - zh: 流量采样与多域数据共享限制精确归因；任何固定 10 秒/60 秒阈值必须按链路容量、业务和采样调优。
      en: Traffic sampling and cross-domain data sharing limit attribution; any fixed 10-second or 60-second threshold
        needs tuning to link capacity, business, and sampling.
