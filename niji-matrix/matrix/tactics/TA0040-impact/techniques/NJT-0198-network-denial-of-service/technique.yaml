schema_version: 2.0.0
type: technique
id: NJT-0198
name:
  zh: 网络拒绝服务
  en: Network Denial of Service
summary:
  zh: 攻击者以汇聚攻击流量耗尽网络路径或边界容量，并通过来源分布或响应来源置换提高局部检测与归因成本。
  en: Adversaries aggregate attack traffic to exhaust network-path or boundary capacity while source distribution
    or response-origin displacement raises local detection and attribution cost.
aliases:
- T1498
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1498
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1498
definition_and_concept:
  paragraphs:
  - zh: 网络拒绝服务是攻击者让链路、边界设备、网络协议或面向网络的容量无法承载合法通信，使用户虽可能面对仍存活的端点，却无法建立或维持预期连接。直接对象是网络路径及汇聚容量，而不是端点内部线程、应用资源或攻击者用带宽完成的代理/挖矿任务。
    en: Network Denial of Service prevents a link, boundary device, network protocol, or network-facing capacity from
      carrying legitimate communication, so users cannot establish or maintain expected connections even if endpoints
      remain alive. The direct object is network path and aggregate capacity, not internal endpoint workers or application
      resources or attacker bandwidth used for proxying or mining.
  - zh: Niji 关注来源拓扑怎样让完整攻击在任何单源/单域中难以识别，以及反射怎样让可见响应来源替代真实发起者。直接高流量洪泛保持父级核心；协议、放大倍数、botnet 家族和目标端口是实现。
    en: Niji focuses on source topology that keeps the complete attack from appearing in one origin or domain and
      reflection that makes visible responders replace the true initiator. Direct high-volume flooding remains parent
      core; protocol, amplification ratio, botnet family, and target port are implementations.
stealth_characteristics:
  paragraphs:
  - zh: 多源洪泛把总量拆到大量真实来源，每源贡献可接近普通用户，源侧与短窗规则只见低强度事件，目的或中转处才形成容量损失。响应源置换则用受害者伪造源驱动合法第三方回包，使受害侧记录的是 DNS/NTP/其他服务响应者，而不是发送诱导请求的攻击者。
    en: Multi-source flooding divides total volume across many real origins so each contribution can resemble an ordinary
      user, leaving origin-side and short-window rules with weak events while destination or transit suffers capacity
      loss. Response-origin displacement spoofs the victim source to drive legitimate third-party replies, so victim-side
      records show DNS, NTP, or other responders rather than the attacker that sent inducement requests.
  - zh: 残余包括 IPFIX 流、来源/AS 分布、目的 fan-in、包字节比、接口 octet/packet/discard、容量利用、无对应请求的响应和上游清洗结果。flash crowds、软件发布、灾难新闻和合法大响应可形成相似汇聚，需业务/协议基线排除。
    en: Residue includes IPFIX flow, source and AS distribution, destination fan-in, packet-to-byte ratio, interface
      octet, packet and discard counters, capacity utilization, responses without matching requests, and upstream
      scrubbing outcome. Flash crowds, software releases, disaster news, and legitimate large responses can create
      similar aggregation and need business and protocol baselines.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击流量与网络容量/丢弃/时延、合法通信失败之间的因果。高流量但容量充足、被上游完全吸收、扫描或 botnet 心跳无合法通信影响时只为企图/相邻行为。
    en: Include a causal relation among attack traffic, network capacity or discard or latency, and failed legitimate
      communication. High traffic with sufficient capacity, fully absorbed upstream, scanning, or botnet heartbeat
      without legitimate-communication impact is attempt or adjacent behavior.
  - zh: 端点内部资源耗尽归 NJT-0199；为攻击者任务消费 victim bandwidth 归 NJT-0189；C2 与 botnet 建立是前置。反射器自身正常响应不等于其被攻陷，必须区分真实执行来源、可见来源和受害目的。
    en: Endpoint-internal exhaustion belongs to NJT-0199, victim bandwidth consumed for attacker work to NJT-0189,
      and C2 or botnet establishment is precursor. A reflector responding normally is not necessarily compromised;
      distinguish real execution origin, visible origin, and victim destination.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者可协调大量 bot/代理向同一边界发送低到中等单源流量，或向开放解析器/放大服务发送伪造受害源请求，使第三方响应在目标链路汇聚。目的可能是政治中断、勒索或掩护其他活动。
      en: An attacker can coordinate many bots or proxies to send low-to-moderate per-origin traffic to one boundary,
        or send victim-spoofed requests to open resolvers or amplifiers so third-party responses converge on the target
        link. Purposes include political disruption, extortion, or cover for other activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要足够真实来源或可伪造源网络，以及对目标容量、协议反射面和汇聚路径的理解。源验证、反射服务访问控制、Anycast/CDN、上游清洗和速率/容量保护提高成本。
        en: The attacker needs enough real origins or spoof-capable networks and knowledge of target capacity, protocol
          reflection surfaces, and convergence paths. Source validation, reflector access control, Anycast or CDN,
          upstream scrubbing, and rate or capacity protection raise cost.
    defender_model:
      paragraphs:
      - zh: 防守方可观察 IPFIX/NetFlow、接口容量与丢弃、BGP/AS、DNS/NTP 等协议请求响应、边界健康、上游告警和业务可用性，并跨 observationDomain 聚合。采样、NAT/代理、加密和缺少
          victim 出站请求日志会削弱来源与反射判断。
        en: Defenders observe IPFIX or NetFlow, interface capacity and discard, BGP or AS, protocol request and response
          such as DNS or NTP, boundary health, upstream alerts, and business availability and aggregate across observation
          domains. Sampling, NAT or proxying, encryption, and missing victim outbound requests weaken source and reflection
          assessment.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 多源低贡献流量在目的端汇聚成容量损失
    en: Low-contribution traffic from many sources converges into capacity loss
  analysis:
    paragraphs:
    - zh: 攻击者把洪泛分散到大量真实来源，每个来源的事件强度下降，而目的端 fan-in 和链路利用累积。单源或单域短窗分析无法看到整体，跨来源长期聚合恢复，形成时空释痕。
      en: The attacker disperses flooding across many real origins, lowering event strength per source while destination
        fan-in and link utilization accumulate. Per-source or single-domain short-window analysis misses the whole,
        while cross-source long-horizon aggregation restores it, producing spatiotemporal trace dilution.
  evidence_refs:
  - REF-000956
  - REF-000957
  - REF-000958
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 第三方响应者替代真实发起者成为受害侧可见来源
    en: Third-party responders replace the real initiator as victim-visible sources
  analysis:
    paragraphs:
    - zh: 攻击者伪造受害者地址向第三方服务发请求，响应者按协议回包。目标记录合法服务来源，真实发起者仅在诱导请求一侧留下痕迹，来源外观与因果错位形成特征伪装。
      en: The attacker sends victim-spoofed requests to third-party services, which reply normally. The target records
        legitimate service origins while the true initiator appears only on the inducement side, producing feature
        disguise through origin-causality mismatch.
  evidence_refs:
  - REF-000956
  - REF-000958
  - REF-000960
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 多源低贡献洪泛按真实执行来源分布划分，检测依赖跨来源 fan-in 与容量；响应源归因置换按可见响应者与真实发起者分离划分，检测依赖无对应请求和反射协议。二者可组合但防御不可互换。
      en: Multi-Source Low-Contribution Flooding is divided by distribution of real executing origins and requires
        cross-source fan-in and capacity analysis. Response-Origin Displacement is divided by separation of visible
        responders from the true initiator and requires unmatched requests and reflection-protocol analysis. They
        can combine but defenses are not interchangeable.
    - zh: T1498.001/.002 只作直接与反射实现广度。单/少源直接洪泛和协议/放大倍数留父级，botnet 名称、端口和地理不形成 NJS。
      en: T1498.001 and .002 remain implementation breadth for direct and reflected flooding. Single or few-source
        direct floods and protocol or amplification ratio remain parent core; botnet name, port, and geography do
        not define NJS.
  coverage: established
  subtechnique_refs:
  - NJS-0198-001
  - NJS-0198-002
