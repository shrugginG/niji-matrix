research:
  limitations:
    paragraphs:
    - zh: 证据主要是权威技术与指南而非命名事件；HTTP 以外协议需验证进度语义。
      en: Evidence is mainly authoritative technical documentation rather than a named incident; protocols beyond
        HTTP require progress-semantics validation.
    - zh: 合法慢客户端可同形，必须结合状态规模、容量和健康结果。
      en: Legitimate slow clients can be isomorphic and require state scale, capacity, and health outcome.
