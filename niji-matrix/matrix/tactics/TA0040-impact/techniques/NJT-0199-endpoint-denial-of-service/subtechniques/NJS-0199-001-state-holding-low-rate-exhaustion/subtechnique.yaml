schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0199-001
parent_ref: NJT-0199
name:
  zh: 状态保持式低速耗尽
  en: State-Holding Low-Rate Exhaustion
summary:
  zh: 攻击者以低进度维持大量未完成连接或事务，使并发状态累积而流量仍低。
  en: An adversary maintains many incomplete connections or transactions with low progress so concurrent state accumulates
    while traffic stays low.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 状态保持式低速耗尽通过控制请求阶段、字节进度和持有时间，让连接、header/body、会话或工作槽长期未完成，直至内部并发资源耗尽。稳定变量是低进度与长持有，不是 HTTP 工具或来源数量。
    en: State-Holding Low-Rate Exhaustion controls request stage, byte progress, and holding time so connections,
      headers or bodies, sessions, or worker slots remain incomplete until internal concurrency is exhausted. The
      stable variable is low progress and long holding, not an HTTP tool or source count.
stealth_characteristics:
  paragraphs:
  - zh: 状态保持式低速耗尽让每连接带宽和单源请求率低，完成请求日志甚至无记录，短窗阈值低估正在占槽的状态。连接年龄、progress、活动/完成比、timeout 和池容量仍可见。
    en: State-Holding Low-Rate Exhaustion keeps per-connection bandwidth and source request rate low; completion logs
      may contain no record and short windows underestimate occupied state. Connection age, progress, active-to-completed
      ratio, timeouts, and pool capacity remain visible.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入大量低进度未完成事务与池/连接状态耗尽及合法请求失败。正常慢网络、大上传、长轮询和批准持久连接是反例；完成的小输入高工作归兄弟项。
    en: Include many low-progress incomplete transactions joined to pool or connection-state exhaustion and failed
      legitimate requests. Slow networks, large uploads, long polling, and approved persistent connections are counterexamples;
      completed small inputs causing high work belong to the sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者维持慢 header/body 或 keepalive，使 Web 服务器连接/worker 长期占用。
      en: An attacker maintains slow headers, bodies, or keepalives so Web server connections or workers stay occupied.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需足够会话并绕过 timeout/min-rate，可能多源分布；代理超时、并发限额和最小速率限制效果。
        en: The attacker needs enough sessions and to evade timeout or minimum rate, possibly with many sources; proxy
          timeouts, concurrency limits, and minimum rates constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方保留未完成连接、age/progress、worker、timeout、外部健康和合法慢客户端基线。
        en: Defenders retain incomplete connections, age or progress, workers, timeouts, external health, and legitimate
          slow-client baselines.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 低进度事务跨时间累积内部状态
    en: Low-progress transactions accumulate internal state over time
  analysis:
    paragraphs:
    - zh: 攻击者用少量周期字节保持状态，网络量被时间稀释而连接/工作槽不释放，形成时空释痕；长窗口连接状态恢复。
      en: The attacker uses sparse periodic bytes to keep state, diluting network volume over time while slots remain
        allocated, producing spatiotemporal trace dilution; long-window connection state restores it.
