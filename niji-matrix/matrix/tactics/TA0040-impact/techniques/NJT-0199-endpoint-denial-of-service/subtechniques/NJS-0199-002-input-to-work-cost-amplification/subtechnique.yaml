schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0199-002
parent_ref: NJT-0199
name:
  zh: 输入到工作量成本放大
  en: Input-to-Work Cost Amplification
summary:
  zh: 攻击者以少量普通外形输入触发不成比例的计算、解析或故障，使端点内部资源失效。
  en: An adversary uses small ordinary-looking inputs to trigger disproportionate computation, parsing, or faults
    that disable internal endpoint resources.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 输入到工作量成本放大利用算法复杂度、回溯、解析或缺陷，使输入字节/请求数相对内部 CPU、内存、事件循环阻塞或崩溃代价极不对称。稳定变量是输入—工作比，不是漏洞编号或应用层。
    en: Input-to-Work Cost Amplification uses algorithmic complexity, backtracking, parsing, or a flaw to make input
      bytes or requests grossly asymmetric with internal CPU, memory, event-loop blocking, or crash cost. The stable
      variable is the input-to-work ratio, not vulnerability ID or application layer.
stealth_characteristics:
  paragraphs:
  - zh: 输入到工作量成本放大让入口请求长度和数量接近正常，却在内部产生异常工作。流量/速率规则不见明显洪泛；路由、输入结构、每请求时延、资源和健康结果揭示不对称。
    en: Input-to-Work Cost Amplification leaves ingress length and count near normal while generating abnormal internal
      work. Traffic or rate rules see no flood; route, input structure, per-request duration, resources, and health
      reveal asymmetry.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入小输入到高工作/故障及实际可用性损失。失败探测、普通慢查询、合法复杂内容和无服务影响的错误不是本项；长期持有未完成状态归兄弟项。
    en: Include small input to high work or fault and actual availability loss. Failed probes, ordinary slow queries,
      legitimate complex content, and errors without service impact are excluded; long-held incomplete state belongs
      to the sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者向易受 ReDoS 的路由或高复杂度 parser 提交精心构造短输入，阻塞共享事件循环或工作线程。
      en: An attacker submits crafted short input to a ReDoS-prone route or complex parser, blocking shared event
        loops or workers.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需识别高复杂度路径；非回溯算法、输入界限、超时、隔离池和熔断限制效果。
        en: The attacker needs to identify a high-complexity path; nonbacktracking algorithms, input bounds, timeouts,
          isolation, and circuit breakers constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方关联 route/request、输入结构、duration/error、内部资源、崩溃和外部健康；标准 OTel 无每请求 CPU。
        en: Defenders join route and request, input structure, duration or error, internal resources, crash, and external
          health; standard OTel lacks per-request CPU.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 普通小请求外观掩盖异常内部代价
    en: Ordinary small-request appearance disguises abnormal internal cost
  analysis:
    paragraphs:
    - zh: 攻击输入在长度/数量上接近正常，内部算法/解析却放大工作，入口特征与影响不匹配，形成特征伪装；每请求工作/时延恢复。
      en: Attack input resembles normal length and count while internal algorithms or parsing amplify work, making
        ingress features mismatch impact and producing feature disguise; per-request work or duration restores it.
  evidence_refs:
  - REF-000968
  - REF-000969
  - REF-000970
  confidence: high
