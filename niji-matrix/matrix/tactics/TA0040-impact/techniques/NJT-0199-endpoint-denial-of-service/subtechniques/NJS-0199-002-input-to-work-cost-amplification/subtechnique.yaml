research:
  limitations:
    paragraphs:
    - zh: ReDoS 高置信成立，跨任意 parser/内核故障泛化为中等；无命名 CASE。
      en: ReDoS is high confidence while generalization across arbitrary parsers or kernel faults is medium; no named
        CASE is used.
    - zh: 高时延可由复杂合法输入与代码回归造成，需输入结构和健康结果。
      en: High latency can arise from legitimate complex input or regression and needs input structure and health
        outcome.
