schema_version: 2.0.0
type: technique
id: NJT-0199
name:
  zh: 端点拒绝服务
  en: Endpoint Denial of Service
summary:
  zh: 攻击者使端点内部资源耗尽或触发故障，并用低速状态保持或输入成本放大削弱失效前兆。
  en: Adversaries exhaust endpoint-internal resources or trigger faults while low-rate state holding or input-cost
    amplification weakens failure precursors.
aliases:
- T1499
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1499
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1499
definition_and_concept:
  paragraphs:
  - zh: 端点拒绝服务是攻击者使主机、操作系统、服务进程或应用因连接/会话、线程、队列、句柄、CPU、内存、事件循环或缺陷触发而不能为合法用户提供预期功能。直接对象是端点内部可用性；网络地址仍可达或进程仍存活，不否定服务挂起或无工作槽位。
    en: Endpoint Denial of Service makes a host, OS, service process, or application unable to serve legitimate users
      because connection or session state, workers, queues, handles, CPU, memory, event loop, or a triggered flaw
      is exhausted or blocked. The direct object is endpoint-internal availability; a reachable address or surviving
      process does not negate a hang or absence of worker slots.
  - zh: Niji 关注外部输入量与内部损失如何脱钩：低速请求长期持有状态，或少量输入触发不成比例计算/故障。高流量普通耗尽留父级；栈层、漏洞编号和平台是实现。
    en: 'Niji focuses on decoupling external input volume from internal loss: slow requests hold state for long periods,
      or small inputs trigger disproportionate computation or fault. Ordinary high-volume exhaustion remains parent
      core; stack layer, vulnerability ID, and platform are implementations.'
stealth_characteristics:
  paragraphs:
  - zh: 状态保持攻击以低数据率让连接、头部、请求体或会话长期未完成，带宽和单源速率低但并发状态积累。成本放大用少量正常外形输入触发指数回溯或昂贵解析，使内部 CPU/事件循环/内存远高于输入量。请求量 alone 会低估两者。
    en: State-holding attacks use low data rates to keep connections, headers, bodies, or sessions incomplete, with
      low bandwidth and per-source rate but accumulating concurrency. Cost amplification uses a few normal-looking
      inputs to trigger exponential backtracking or expensive parsing, making internal CPU, event-loop, or memory
      cost far exceed input. Request count alone underestimates both.
  - zh: 残余包括活动/完成连接比、连接年龄和字节进度、工作线程/句柄/队列、每请求时延和长度、路由、错误、CPU/内存、OOM/崩溃/重启和外部健康。无入口—内部资源—健康关联时，故障容易被归因于容量或代码回归。
    en: Residue includes active-to-completed connection ratio, age and byte progress, workers, handles, queues, per-request
      duration and length, route, errors, CPU or memory, OOM, crash or restart, and external health. Without ingress-to-internal-resource-to-health
      joins, failures can be attributed to capacity or regression.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击输入与端点内部耗尽/故障之间可验证因果及实际合法功能损失。资源升高但健康正常、被限流无影响、失败探测和非关键进程崩溃为企图/相邻；正常峰值、慢客户端、大上传、缓存冷启、GC 和配置不足是反例。
    en: Include verified causality from adversary input to internal exhaustion or fault and actual legitimate-function
      loss. Raised resources with healthy service, rate-limited no-impact traffic, failed probes, and noncritical
      crashes are attempts or adjacent; normal peaks, slow clients, large uploads, cold cache, GC, and insufficient
      capacity are counterexamples.
  - zh: 有序管理停止归 NJT-0185，网络路径容量归 NJT-0198，为攻击者任务消费资源归 NJT-0189。漏洞利用需另证执行/权限结果；自动恢复不否定短暂 DoS，但需记录持续时间和用户范围。
    en: Orderly management stop belongs to NJT-0185, network-path capacity to NJT-0198, and resource use for adversary
      work to NJT-0189. Exploitation needs separate execution or privilege evidence. Automatic recovery does not negate
      transient DoS but duration and user scope must be recorded.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Web 端点可被大量低进度连接占用工作池，而接入带宽未饱和；或攻击者向低效正则/解析路径提交短输入，阻塞事件循环或少数工作线程。系统服务和内核也可出现低输入、高内部代价。
      en: A web endpoint can have its worker pool occupied by many low-progress connections while ingress bandwidth
        remains unsaturated, or receive short crafted input on an inefficient regex or parser path that blocks an
        event loop or workers. System services and kernels can show the same low-input, high-internal-cost relation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 状态保持攻击者需维持会话并围绕 timeout/min-rate 发送；成本放大攻击者需发现高复杂度/故障输入。超时、限额、非回溯算法、输入界限、隔离池和故障转移限制效果。
        en: A state-holder maintains sessions and sends around timeout or minimum-rate bounds; a cost amplifier finds
          high-complexity or faulting input. Timeouts, limits, nonbacktracking algorithms, input bounds, isolated
          pools, and failover constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方观察负载均衡连接/请求/字节/拒绝、未完成状态、Web 日志、工作池、OTel 路由/时延/错误、进程资源、崩溃和外部健康。完成日志会漏持有状态，源 IP 阈值会漏多源低速，只有主机资源无法区分代码回归。
        en: Defenders observe load-balancer connections, requests, bytes and rejects, incomplete state, Web logs,
          worker pools, OTel route, duration and error, process resource, crash, and external health. Completion logs
          miss held state, source-IP thresholds miss distributed slow activity, and host resource alone cannot separate
          regression.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 低进度连接跨时间累积并发状态
    en: Low-progress connections accumulate concurrent state over time
  analysis:
    paragraphs:
    - zh: 攻击者把请求拆成低速进度并维持未完成状态，流量在时间和来源上稀释而连接槽持续占用。短窗流量无法还原累计耗尽，连接年龄、进度和全局并发可恢复。
      en: The attacker fragments requests into low-rate progress and maintains incomplete state, diluting traffic
        across time and sources while slots remain occupied. Short-window volume misses accumulated exhaustion, while
        age, progress, and global concurrency restore it.
  evidence_refs:
  - REF-000965
  - REF-000966
  - REF-000967
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 小型请求外观掩盖不成比例的内部工作
    en: Small request appearance disguises disproportionate internal work
  analysis:
    paragraphs:
    - zh: 短输入触发回溯或高复杂度路径，外部数量/长度接近正常而内部工作异常增长。入口外观不表明代价，形成特征伪装；每请求时延、输入结构和健康结果揭示。
      en: Short input triggers backtracking or high-complexity paths; external count and length resemble normal while
        internal work grows abnormally. Ingress appearance does not reveal cost, producing feature disguise; per-request
        duration, input structure, and health expose it.
  evidence_refs:
  - REF-000968
  - REF-000969
  - REF-000970
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 状态保持式低速耗尽按进度率与持有时长积累并发状态划分；输入到工作量成本放大按输入复杂度与内部工作不对称划分。前者单事务工作低/持有长，后者单事务代价高/输入小，检测不可互换。
      en: State-Holding Low-Rate Exhaustion is divided by progress rate and holding duration accumulating state; Input-to-Work
        Cost Amplification by asymmetry between input complexity and internal work. The former has low per-transaction
        work and long hold, the latter high per-transaction cost and small input, requiring different detection.
    - zh: T1499.001–.004 仅作 OS/服务/应用/利用广度，不导入。普通高量耗尽留父级，来源分布与 crash 外观证据不足而 defer。
      en: T1499.001–.004 remain OS, service, application, and exploit breadth only and are not imported. Ordinary
        high-volume exhaustion remains parent core; source distribution and crash appearance remain deferred.
  coverage: established
  subtechnique_refs:
  - NJS-0199-001
  - NJS-0199-002
