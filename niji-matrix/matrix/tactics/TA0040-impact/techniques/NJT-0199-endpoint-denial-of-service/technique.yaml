research:
  limitations:
    paragraphs:
    - zh: 权威技术文档高置信支持慢 HTTP 和 ReDoS，跨协议、解析器和内核泛化为中等。无命名在野 CASE，不能从高时延 alone 推断攻击。
      en: Authoritative technical sources strongly support slow HTTP and ReDoS; generalization across protocols, parsers,
        and kernels is medium. There is no named field CASE and high latency alone cannot infer attack.
    - zh: 正常慢客户端、流量峰值和代码回归需要入口、内部资源及外部健康三面关联排除；窗口和阈值需按服务调优。
      en: Normal slow clients, traffic peaks, and regressions require ingress, internal-resource, and external-health
        joins; windows and thresholds require service tuning.
