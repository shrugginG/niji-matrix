research:
  limitations:
    paragraphs:
    - zh: Petya 直接支持一次性任务与 10–60 分钟延迟，但其他调度器语义需另证；随机时间本身不证明匿迹动机。
      en: Petya directly supports a one-time task and 10-to-60-minute delay, but other schedulers need separate semantics;
        random timing alone does not prove stealth motive.
    - zh: 任务审计缺失、直接后端修改与时钟篡改会削弱关联。
      en: Missing task audit, direct backend manipulation, and clock tampering weaken correlation.
