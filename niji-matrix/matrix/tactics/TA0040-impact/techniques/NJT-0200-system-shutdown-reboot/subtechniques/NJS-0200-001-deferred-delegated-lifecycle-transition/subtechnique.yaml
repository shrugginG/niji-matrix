schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0200-001
parent_ref: NJT-0200
name:
  zh: 延迟委托式生命周期转换
  en: Deferred-Delegated Lifecycle Transition
summary:
  zh: 攻击者登记未来关机或重启任务，让调度器稍后执行，使原始 writer 与生命周期结果分离。
  en: An adversary registers a future shutdown or reboot task so the scheduler executes later, separating the original
    writer from the lifecycle outcome.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 延迟委托式生命周期转换把恶意关机/重启决定写入计划任务、作业或等价调度对象，由调度器在未来时间以另一个 runtime 主体执行。稳定变量是 writer/definition 与执行/结果跨时间和主体分离，不是
      Windows Task Scheduler 产品。
    en: Deferred-Delegated Lifecycle Transition writes a malicious shutdown or reboot decision into a task, job, or
      equivalent scheduler object for later execution under another runtime principal. The stable variable is separation
      of writer or definition from execution or outcome across time and actor, not Windows Task Scheduler.
stealth_characteristics:
  paragraphs:
  - zh: 延迟委托式生命周期转换让临近关机的日志只显示 Task Scheduler/SYSTEM 和 shutdown，原恶意进程可能已退出。短窗口无法回溯任务登记，definition digest、creator、next-run、run
      instance 和 boot 仍可连接。
    en: Deferred-Delegated Lifecycle Transition leaves logs near shutdown showing Task Scheduler or SYSTEM and shutdown
      after the malicious writer may have exited. Short windows lose registration, while definition digest, creator,
      next run, run instance, and boot remain joinable.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入恶意任务/作业定义、后来实际执行的生命周期 action 和 availability 结果。任务被删除/阻断或只启动其他载荷不满足；合法补丁、安装和恢复任务是反例。
    en: Include a malicious task or job definition, later executed lifecycle action, and availability outcome. A deleted
      or blocked task or one launching another payload does not qualify; legitimate patch, install, and recovery tasks
      are counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: Petya 创建一次性 task，在随机 10–60 分钟后执行强制重启。
      en: Petya creates a one-time task to force reboot 10 to 60 minutes later.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需 task writer 权限和可执行 shutdown 的 runtime；审计、任务签名/allowlist、未来 action 审批和快速撤销限制效果。
        en: The attacker needs task-writer authority and a runtime able to shut down; audit, task signing or allowlists,
          future-action approval, and rapid revocation constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方保留 task old/new、writer、runtime、run instance、scheduled time、Event 1074 和 boot ID，日志需跨任务触发时间。
        en: Defenders retain task old and new state, writer, runtime, run instance, scheduled time, Event 1074, and
          boot ID across the trigger horizon.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 关机决定与结果跨时间和进程身份分散
    en: Shutdown decision and outcome disperse across time and process identity
  analysis:
    paragraphs:
    - zh: writer 登记任务后离开，调度器稍后执行；原始痕迹和 availability 结果分散，短窗无法关联。长期 task-to-boot 谱系恢复。
      en: The writer leaves after registering a task and the scheduler executes later; origin trace and availability
        outcome disperse beyond short windows. Long task-to-boot lineage restores it.
  evidence_refs:
  - REF-000601
  confidence: medium
