research:
  limitations:
    paragraphs:
    - zh: Play 通告和 VMware 资料支持 ESXi 场景，但其他控制面的事件字段与权限需独立验证。
      en: Play reporting and VMware sources support ESXi, while other control planes need independent field and authority
        validation.
    - zh: guest 失联也可由网络、host 故障或迁移造成，必须有成功 power event。
      en: Guest disappearance can also arise from network, host fault, or migration and requires a successful power
        event.
