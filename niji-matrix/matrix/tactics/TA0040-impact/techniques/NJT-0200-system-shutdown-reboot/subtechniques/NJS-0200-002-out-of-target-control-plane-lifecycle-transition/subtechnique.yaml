schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0200-002
parent_ref: NJT-0200
name:
  zh: 目标外控制面生命周期转换
  en: Out-of-Target Control-Plane Lifecycle Transition
summary:
  zh: 攻击者从 hypervisor 或云控制面关闭/重启目标，使目标内部只见失联而请求者留在外部审计面。
  en: An adversary powers off or reboots a target from a hypervisor or cloud control plane, leaving internal sensors
    to see disappearance while the requester remains in external audit.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 目标外控制面生命周期转换从目标 OS/guest 外的 hypervisor、云或设备管理面发出 power action，使目标实例完成关机/重启。稳定变量是 actor/action 与受影响系统观察域分离，不是
      ESXi 或云厂商。
    en: Out-of-Target Control-Plane Lifecycle Transition issues a power action from a hypervisor, cloud, or device
      plane outside the target OS or guest and completes target shutdown or reboot. The stable variable is separation
      of actor and action from the affected system observation domain, not ESXi or cloud provider.
stealth_characteristics:
  paragraphs:
  - zh: 目标外控制面生命周期转换使 guest/端点 agent 在电源事件前没有本地 requester，随后随系统离线；内部只见 heartbeat/网络消失。hypervisor event、user、chainId、VM/host
      和 auditId 保留外部因果。
    en: Out-of-Target Control-Plane Lifecycle Transition leaves the guest or endpoint agent without a local requester
      before it disappears with the system; internally only heartbeat or network loss remains. Hypervisor event, user,
      chainId, VM or host, and auditId preserve external causality.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入外部管理面成功 power-off/reboot、明确目标和 availability 结果。Guest 内 WMI/命令、管理面登录无 action、网络断开或 host 故障不满足。
    en: Include a successful external management-plane power-off or reboot with an explicit target and availability
      outcome. Guest-local WMI or command, management login without action, network loss, or host fault do not qualify.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 勒索操作者控制 ESXi 后枚举并关闭运行 VM，再操作 VMDK；VM 内监控随关机中断。
      en: A ransomware operator controls ESXi, enumerates and powers off running VMs, and then operates on VMDKs;
        in-guest monitoring stops with power.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需 hypervisor/cloud power 权限和目标映射；MFA、JIT、分离角色、不可变审计和 HA 限制效果。
        en: The attacker needs hypervisor or cloud power authority and target mapping; MFA, JIT, separated roles,
          immutable audit, and HA constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方连接管理面 session/event、actor、host/VM、power state、guest heartbeat 和业务健康；只有 guest telemetry 形成盲区。
        en: Defenders join management session or event, actor, host and VM, power state, guest heartbeat, and business
          health; guest-only telemetry creates the blind spot.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 外部控制面跨越目标系统生命周期观察边界
    en: An external control plane crosses the target system's lifecycle observation boundary
  analysis:
    paragraphs:
    - zh: 攻击者从外层管理面执行 power action，目标本地不生成原始请求并很快失去传感器。关键因果留在不同权控制面，形成行为透明；跨管理事件和 guest 结果关联恢复。
      en: The attacker executes the power action from an outer management plane, leaving no local original request
        and quickly removing target sensors. Critical causality remains in a differently authorized plane, producing
        behavioral transparency; joining management events to guest outcome restores it.
  evidence_refs:
  - REF-000981
  - REF-000982
  - REF-000983
  confidence: high
