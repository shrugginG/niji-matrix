research:
  limitations:
    paragraphs:
    - zh: Petya 直接支持计划重启，Play/CISA 支持 ESXi 外层关机；正常维护使用相同路径，必须连接审批和 availability。原因码可被任意填写，不能独立证明伪装。
      en: Petya directly supports scheduled reboot and Play or CISA supports outer ESXi power-off. Normal maintenance
        uses the same paths, requiring approval and availability joins. Reason codes can be arbitrary and do not independently
        prove camouflage.
    - zh: 不同平台生命周期字段不可互换；guest 失联也可由网络/故障造成，需管理面事件确认。
      en: Lifecycle fields are not interchangeable across platforms; guest disappearance can also result from network
        or faults and needs management-plane confirmation.
