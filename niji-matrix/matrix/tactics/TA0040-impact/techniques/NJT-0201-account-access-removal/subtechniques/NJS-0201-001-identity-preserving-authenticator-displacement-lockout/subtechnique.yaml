research:
  limitations:
    paragraphs:
    - zh: Storm-2949 支持 SSPR/MFA 置换和 owner 失败；其他平台需映射等价 method 与恢复字段。
      en: Storm-2949 supports SSPR or MFA displacement and owner failure; other platforms need equivalent method and
        recovery fields.
    - zh: signIn 日志可能无精确 method ID，需主体级和状态快照关联。
      en: Sign-in logs may lack exact method IDs and require principal-level and snapshot correlation.
