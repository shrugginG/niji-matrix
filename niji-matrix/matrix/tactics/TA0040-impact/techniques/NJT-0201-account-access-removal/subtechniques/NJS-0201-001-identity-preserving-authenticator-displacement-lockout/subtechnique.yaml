schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0201-001
parent_ref: NJT-0201
name:
  zh: 身份保留式认证器置换锁定
  en: Identity-Preserving Authenticator-Displacement Lockout
summary:
  zh: 攻击者保留账户实体和启用状态，却排他替换 owner 认证与恢复方法，使合法主体无法登录。
  en: An adversary preserves the account entity and enabled state while exclusively replacing owner authentication
    and recovery methods so the legitimate principal cannot sign in.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 身份保留式认证器置换锁定删除/替换 owner 密码、MFA、恢复邮箱/电话或其他方法，同时账户仍存在启用且可能由攻击者方法控制。稳定变量是身份实体与合法认证路径分离，不是认证器类型。
    en: Identity-Preserving Authenticator-Displacement Lockout deletes or replaces owner password, MFA, recovery email
      or phone, or another method while the account remains present and enabled and may be controlled by attacker
      methods. The stable variable is separation of identity entity from the legitimate authentication path, not authenticator
      type.
stealth_characteristics:
  paragraphs:
  - zh: 身份保留式认证器置换锁定让目录清单仍显示熟悉账户，攻击者登录甚至显示成功，合法 owner 的失败只在登录/恢复平面出现。方法 old-new、发起者、审批和 owner failure 恢复差分。
    en: Identity-Preserving Authenticator-Displacement Lockout leaves the directory showing a familiar account and
      may show attacker sign-ins succeeding while legitimate-owner failure appears only in sign-in or recovery planes.
      Method old-new, initiator, approval, and owner failure restore the differential.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入 owner 全部有效认证/恢复路径被未经授权置换并实际登录失败。增加并行方法但 owner 仍能登录归 NJT-0083；单 session 撤销或临时风险 challenge 不满足。
    en: Include unauthorized displacement of all effective owner authentication or recovery paths with actual sign-in
      failure. Adding a parallel method while the owner still signs in belongs to NJT-0083; one-session revocation
      or temporary risk challenge does not qualify.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者滥用 SSPR 重置密码、删除原 MFA 并注册自己的方法，保留同一账户名。
      en: An attacker abuses SSPR to reset a password, remove original MFA, and enroll its own methods under the same
        account name.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需恢复/方法管理权限并识别所有路径；独立 break-glass、强审批和方法变更通知限制效果。
        en: The attacker needs recovery or method-management authority and knowledge of all paths; independent break-glass,
          strong approval, and method-change notification constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方连接 directoryAudit modifiedProperties、发起者、correlation、owner signIn failure、method inventory 和审批。
        en: Defenders join directoryAudit modifiedProperties, initiator, correlation, owner sign-in failure, method
          inventory, and approval.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 保留账户身份外观掩盖 owner 认证器被排他替换
    en: Preserved account appearance disguises exclusive replacement of owner authenticators
  analysis:
    paragraphs:
    - zh: 账户名/启用状态不变，目录和实体信誉保持熟悉，但 owner 路径已失效，形成特征伪装；方法版本与登录失败揭示。
      en: Account name and enabled state remain, preserving directory and entity reputation while owner paths fail,
        producing feature disguise; method versions and sign-in failure reveal it.
  evidence_refs:
  - REF-000167
  - REF-000985
  - REF-000986
  confidence: high
