research:
  limitations:
    paragraphs:
    - zh: DEV-0537 支持 Global Admin 撤除与 tenant lockout；其他资源图需验证 deny 与传播。
      en: DEV-0537 supports Global Admin eviction and tenant lockout; other resource graphs require denial and propagation
        validation.
    - zh: 资源 deny 可由策略、许可或故障造成，必须连接具体 edge 和审批。
      en: Resource denial can arise from policy, licensing, or faults and must join a specific edge and approval.
