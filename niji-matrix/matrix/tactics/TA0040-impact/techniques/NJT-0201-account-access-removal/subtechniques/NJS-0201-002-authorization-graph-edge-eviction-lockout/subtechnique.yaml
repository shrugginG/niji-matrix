schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0201-002
parent_ref: NJT-0201
name:
  zh: 授权图边撤除锁定
  en: Authorization-Graph Edge-Eviction Lockout
summary:
  zh: 攻击者移除角色、组、委托或策略边，使合法主体仍能认证但在资源求值时失去访问。
  en: An adversary removes role, group, delegation, or policy edges so a legitimate principal can still authenticate
    but loses access at resource evaluation.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 授权图边撤除锁定删除既有主体依赖的角色、组成员、委托、owner 或 policy edge，导致认证后无法管理/访问资源。稳定变量是认证成功与授权失败跨决策平面分离，不是角色名称。
    en: Authorization-Graph Edge-Eviction Lockout deletes roles, group memberships, delegations, ownership, or policy
      edges needed by an existing principal, causing post-authentication resource denial. The stable variable is separation
      of successful authentication from authorization failure across decision planes, not role name.
stealth_characteristics:
  paragraphs:
  - zh: 授权图边撤除锁定保留账户与 sign-in 正常外观，Impact 在资源 deny 时才显现。只监控认证健康的守方会延迟理解；图 old-new、资源求值和 break-glass 结果恢复。
    en: Authorization-Graph Edge-Eviction Lockout preserves normal account and sign-in appearance and reveals Impact
      only at resource denial. Authentication-health-only defenders delay understanding; graph old-new, resource evaluation,
      and break-glass results restore it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入未经授权撤除关键访问边与实际资源 deny。正常岗位变更、PIM 到期、offboarding 和 least-privilege 清理是反例；认证器失效归兄弟项。
    en: Include unauthorized removal of critical access edges and actual resource denial. Normal role change, PIM
      expiry, offboarding, and least-privilege cleanup are counterexamples; authenticator failure belongs to the sibling.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者建立自身管理员后，移除其他 Global Admin 或关键 owner/group/delegation，使组织仍能登录但无法管理租户/资源。
      en: After establishing its own administrator, an attacker removes other Global Admins or critical owners, groups,
        or delegations so the organization can sign in but cannot administer tenants or resources.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需 role/group/policy 写权和依赖图知识；PIM、双人审批、最小写权和多个独立 emergency accounts 限制效果。
        en: The attacker needs role, group, or policy write authority and graph knowledge; PIM, dual approval, least
          write authority, and multiple independent emergency accounts constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方保存 graph 快照、directoryAudit、resource deny、owner 清单和 break-glass 测试，并关联 propagation。
        en: Defenders retain graph snapshots, directoryAudit, resource denial, owner inventory, and break-glass tests
          and account for propagation.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 授权边变化在资源决策平面隐藏于正常认证之后
    en: Authorization-edge mutation hides in a resource decision plane after normal authentication
  analysis:
    paragraphs:
    - zh: 身份提供者继续认证熟悉主体，资源平面因边撤除拒绝访问。防守若止于 sign-in success 看不到 Impact，形成行为透明；图变化到 deny 的关联恢复。
      en: The identity provider continues authenticating a familiar principal while the resource plane denies access
        after edge eviction. Defenders stopping at sign-in success miss Impact, producing behavioral transparency;
        graph-change-to-deny correlation restores it.
