research:
  limitations:
    paragraphs:
    - zh: Microsoft 案例高置信支持两类锁定结果，但租户字段和方法 ID 并非所有平台一致。管理员变更不等于 owner 已失败，必须验证 post-state。
      en: Microsoft cases strongly support both lockout outcomes, but tenant fields and method IDs are not uniform
        across platforms. An administrative mutation does not equal owner failure and post-state must be verified.
    - zh: 正常 offboarding、账户恢复和 fraud response 产生相似负向变化；审批、owner、时限和 break-glass 结果决定反例。
      en: Normal offboarding, account recovery, and fraud response create similar negative mutations; approval, owner,
        duration, and break-glass outcome determine counterexamples.
