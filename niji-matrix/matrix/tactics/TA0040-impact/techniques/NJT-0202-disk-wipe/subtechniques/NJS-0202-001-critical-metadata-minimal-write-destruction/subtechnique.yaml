research:
  limitations:
    paragraphs:
    - zh: HermeticWiper 证明关键结构与启动失败，但同时更广泛写入，不能把所有损失只归于首 512 字节。
      en: HermeticWiper establishes critical structures and boot failure but also writes more broadly, so not all
        loss can be attributed only to the first 512 bytes.
    - zh: 跨文件系统推广为中等，需各结构的完整性/冗余语义。
      en: Cross-filesystem generalization is medium and needs each structure's integrity and redundancy semantics.
