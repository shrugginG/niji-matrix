schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0202-001
parent_ref: NJT-0202
name:
  zh: 关键元数据最小写入式毁坏
  en: Critical-Metadata Minimal-Write Destruction
summary:
  zh: 攻击者只破坏少量引导、分区或文件系统关键块，即造成整个盘或卷不可用。
  en: An adversary destroys only small boot, partition, or filesystem critical extents yet makes the entire disk or
    volume unavailable.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 关键元数据最小写入式毁坏把 raw 写入集中在占介质很小但决定启动、分区解析、文件系统定位或一致性的区间，使少量字节变化造成全盘/卷失效。稳定变量是写入覆盖率与可用性损失不对称，不是 MBR/GPT/MFT 名称。
    en: Critical-Metadata Minimal-Write Destruction concentrates raw writes on small extents controlling boot, partition
      parsing, filesystem location, or consistency so few changed bytes disable the disk or volume. The stable variable
      is asymmetry between write coverage and availability loss, not MBR, GPT, or MFT names.
stealth_characteristics:
  paragraphs:
  - zh: 关键元数据最小写入式毁坏不会产生与全盘损失相称的写入量或文件事件。少量扇区、驱动/IOCTL 和 metadata 校验变化决定结果；只看文件/总写量的守方低估风险。
    en: Critical-Metadata Minimal-Write Destruction produces neither write volume nor file events proportional to
      whole-disk loss. A few sectors, driver or IOCTL, and metadata-validation changes decide outcome; file or total-volume-only
      defenders underestimate risk.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入少量关键块的未经授权破坏、结构校验失败及 mount/boot/volume 结果。全盘内容覆写留父级；正常修复、分区转换和格式化是反例。
    en: Include unauthorized destruction of a small critical extent, failed structure validation, and mount, boot,
      or volume outcome. Full-disk content overwrite remains parent core; normal repair, partition conversion, and
      formatting are counterexamples.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: HermeticWiper 借驱动写入 MBR/MFT 等，首 512 字节 MBR 破坏足以使系统不可启动。
      en: HermeticWiper used a driver to write MBR and MFT areas; corruption of the first 512-byte MBR was sufficient
        to make a system unbootable.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需 raw write/driver 和关键布局知识；backup headers、冗余 metadata、写保护与结构验证限制效果。
        en: The attacker needs raw-write or driver authority and layout knowledge; backup headers, redundant metadata,
          write protection, and structure validation constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方关联 raw open、driver/IOCTL、sector/length、metadata hash/CRC 和 mount/boot。文件日志不能替代块 telemetry。
        en: Defenders join raw open, driver or IOCTL, sector and length, metadata hash or CRC, and mount or boot.
          File logs cannot replace block telemetry.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 少量关键块写入跨越文件级观察并造成全卷损失
    en: A few critical-block writes cross file-level observation and cause whole-volume loss
  analysis:
    paragraphs:
    - zh: 攻击者不遍历文件而直接改变结构块，文件传感器看不到路径级因果，影响远大于写量，形成行为透明；offset 和结构校验恢复。
      en: The attacker changes structural blocks without traversing files, leaving file sensors without path-level
        causality and impact far greater than write volume, producing behavioral transparency; offsets and structure
        validation restore it.
