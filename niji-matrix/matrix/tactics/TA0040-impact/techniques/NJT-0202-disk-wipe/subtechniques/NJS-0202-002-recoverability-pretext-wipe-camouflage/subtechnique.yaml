research:
  limitations:
    paragraphs:
    - zh: ExPetr 高置信证明随机 ID 与不可恢复性；不同 wiper 的 key/IV 和呈现方式不可互换。
      en: ExPetr strongly establishes random IDs and irrecoverability; key or IV and presentation are not interchangeable
        across wipers.
    - zh: 缺样本/块证据时，不能从勒索字条 alone 判定 wipe。
      en: Without sample or block evidence, a ransom note alone cannot establish wiping.
