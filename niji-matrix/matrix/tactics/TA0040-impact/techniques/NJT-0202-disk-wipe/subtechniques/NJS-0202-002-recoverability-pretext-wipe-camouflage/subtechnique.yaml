schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0202-002
parent_ref: NJT-0202
name:
  zh: 可恢复性话术伪装式擦除
  en: Recoverability-Pretext Wipe Camouflage
summary:
  zh: 攻击者用勒索、安装 ID 或解密承诺把不可恢复擦除呈现为可支付、可解密的加密事件。
  en: An adversary uses ransom, installation IDs, or decryption promises to present an irreversible wipe as a payable,
    decryptable encryption event.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 可恢复性话术伪装式擦除在实际磁盘破坏不保留可用 key/恢复路径时，仍展示勒索、ID、扩展名或解密承诺，使事件被理解为密钥控制而非不可逆介质毁坏。稳定变量是呈现的可恢复性与真实恢复语义冲突。
    en: Recoverability-Pretext Wipe Camouflage displays ransom, IDs, extensions, or decryption promises even though
      disk destruction retains no usable key or recovery path, causing the event to be understood as key custody rather
      than irreversible media destruction. The stable variable is conflict between presented recoverability and actual
      recovery semantics.
stealth_characteristics:
  paragraphs:
  - zh: 可恢复性话术伪装式擦除让初始工件与普通 ransomware 相似，守方可能优先追踪支付/解密并延迟介质保全与裸机重建。随机 ID、未保存 key/IV、块结构毁坏和不可达恢复代码揭示矛盾。
    en: Recoverability-Pretext Wipe Camouflage makes initial artifacts resemble ordinary ransomware, causing defenders
      to prioritize payment or decryption and delay media preservation and bare-metal rebuild. Random IDs, unretained
      keys or IVs, destroyed structures, and unreachable recovery code expose the contradiction.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入实际不可恢复块破坏、明确可恢复性呈现和两者冲突。只有勒索字条/扩展名，或攻击者持有真实可用 key 的磁盘加密不满足；后者归 NJT-0157。
    en: Include actual irreversible block destruction, explicit recoverability presentation, and their conflict. A
      ransom note or extension alone, or disk encryption with a real usable attacker-held key, does not qualify; the
      latter belongs to NJT-0157.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: ExPetr 显示安装 ID 与勒索，但 ID 随机且无法生成解密；GigaWiper/PartyTicket 等也可用勒索外观掩护擦除。
      en: ExPetr displayed an installation ID and ransom while the ID was random and could not enable decryption;
        GigaWiper or PartyTicket can also use ransomware appearance around wiping.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需完成擦除并部署可信的恢复叙事；真实 key provenance、样本逆向和快速块状态验证限制误导。
        en: The attacker needs to complete wiping and deploy a credible recovery narrative; real key provenance, reverse
          engineering, and rapid block-state validation constrain deception.
    defender_model:
      paragraphs:
      - zh: 防守方连接 ransom artifacts、ID/key/IV 生成与保存、恢复代码、块 metadata 和恢复试验；不执行会扩大损失的未验证解密器。
        en: Defenders join ransom artifacts, ID or key or IV generation and retention, recovery code, block metadata,
          and safe recovery testing and avoid unverified decryptors that can worsen loss.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 可解密勒索外观掩盖不可恢复介质毁坏
    en: A decryptable-ransomware appearance disguises irreversible media destruction
  analysis:
    paragraphs:
    - zh: 攻击者提供 familiar ransomware 特征但不保留恢复材料，守方从表象推断错误响应，形成特征伪装；key/ID 来源和块状态揭示。
      en: The attacker supplies familiar ransomware features without recovery material, leading defenders to infer
        the wrong response and producing feature disguise; key or ID provenance and block state reveal it.
