research:
  limitations:
    paragraphs:
    - zh: HermeticWiper 同时更广泛擦除，因此只可断言 512-byte MBR 破坏足以启动失败，不把全部损失归于最少写入。ExPetr 高置信证明话术/ID 与可恢复性冲突；不同 wiper 呈现不能模板化。
      en: HermeticWiper also wipes broadly, so only sufficiency of a 512-byte MBR change for boot failure can be claimed,
        not all loss attributed to minimal writes. ExPetr strongly establishes presentation or ID conflict with recoverability;
        different wiper presentations cannot be templated.
    - zh: Linux 字段是可实施示例；Windows 默认 EDR 无逐扇区字段，必须用自建/内核传感器。合法格式化与退役是强反例。
      en: Linux fields are implementable examples. Windows default EDR lacks per-sector fields and needs custom or
        kernel sensing. Legitimate formatting and decommission are strong counterexamples.
