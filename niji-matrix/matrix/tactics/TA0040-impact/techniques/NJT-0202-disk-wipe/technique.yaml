schema_version: 2.0.0
type: technique
id: NJT-0202
name:
  zh: 磁盘擦除
  en: Disk Wipe
summary:
  zh: 攻击者在块或磁盘层破坏内容和关键结构，并通过少量关键写入或可恢复性伪装降低早期识别与正确响应。
  en: Adversaries destroy block-level content and critical disk structures while minimal critical writes or recoverability
    pretext reduce early recognition and correct response.
aliases:
- T1561
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1561
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1561
definition_and_concept:
  paragraphs:
  - zh: 磁盘擦除是攻击者直接写入、丢弃、重新初始化或不可恢复地变换物理盘、块设备或卷，使内容、引导、分区或文件系统元数据不能支持原有系统/数据用途。直接对象是介质级结构与可用性，不是单个路径对象；设备仍枚举或通电不否定磁盘状态已失效。
    en: Disk Wipe writes, discards, reinitializes, or irreversibly transforms a physical disk, block device, or volume
      so content, boot, partition, or filesystem metadata no longer supports the original system or data purpose.
      The direct object is media-level structure and availability, not one path object; continued enumeration or power
      does not negate invalid disk state.
  - zh: Niji 关注很少关键块写入造成远大于写量的损失，以及不可恢复擦除被呈现为可支付/可解密的勒索。写零、随机数、加密、格式化、IOCTL、驱动和重启是实现；块状态与合法可用性结果共同区分完成、企图和维护。
    en: Niji focuses on small critical-block writes causing loss far beyond write volume and irreversible wiping presented
      as payable or decryptable ransomware. Zeroes, random data, encryption, formatting, IOCTL, driver, and reboot
      are implementations; block state plus legitimate availability outcome separates completion, attempt, and maintenance.
stealth_characteristics:
  paragraphs:
  - zh: 关键引导、分区和文件系统元数据占介质很小，却决定整个卷能否定位解释。集中写入这些区间时，文件级修改和全盘写量阈值没有与结果相称信号；原始句柄、驱动/IOCTL、扇区和 metadata 校验保留因果。
    en: Critical boot, partition, and filesystem metadata occupies little media but determines whether the entire
      volume can be located and interpreted. Concentrated writes produce no file-level or full-disk-volume signal
      proportional to impact; raw handles, driver or IOCTL, sectors, and metadata validation preserve causality.
  - zh: 勒索画面、安装 ID、扩展名或解密承诺可把不可恢复擦除呈现为密钥控制事件，守方可能追踪支付/解密而延迟保全介质和裸机重建。块状态、key/ID 来源与恢复代码揭示矛盾。
    en: A ransom screen, installation ID, extension, or decryption promise can present irreversible wiping as key
      custody, causing defenders to pursue payment or decryption and delay media preservation and bare-metal rebuild.
      Block state, key or ID provenance, and recovery code expose the contradiction.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入对物理盘、块设备或卷的未授权写入/丢弃/初始化，以及分区表、引导记录、文件系统、块内容、挂载/启动或业务数据集失效。仅驱动加载、磁盘枚举、raw open/read 或失败 IOCTL 是前置/企图；合法格式化/退役需匹配
      owner、工单、范围和预期新状态。
    en: Include unauthorized write, discard, or initialization of a physical disk, block device, or volume and failure
      of partition table, boot record, filesystem, block content, mount or boot, or business dataset. Driver load,
      disk enumeration, raw open or read, or failed IOCTL is precursor or attempt; legitimate format or decommission
      needs matching owner, ticket, scope, and expected new state.
  - zh: 路径级文件/对象损失归 NJT-0156，固件归 NJT-0188，恢复角色对象归 NJT-0186，只读 raw view 归 NJT-0108。可由掌握密钥恢复的密文归 NJT-0157；无 key 且直接破坏盘状态可归本技术，但需验证介质与不可恢复性。
    en: Path-level file or object loss belongs to NJT-0156, firmware to NJT-0188, recovery-role objects to NJT-0186,
      and read-only raw views to NJT-0108. Ciphertext recoverable with a held key belongs to NJT-0157; encryption
      with no key and direct disk-state destruction can belong here with verified media and irrecoverability.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者取得管理员/内核/raw-write 权限后，覆写 MBR、GPT、MFT、位图/日志或全盘，使主机不可启动或卷不可挂载。HermeticWiper 借 EaseUS 驱动和 DeviceIoControl；GigaWiper
        重建分区并覆写物理盘；ExPetr 用随机安装 ID 呈现虚假可恢复性。
      en: After obtaining administrator, kernel, or raw-write authority, an attacker overwrites MBR, GPT, MFT, bitmap
        or log, or the full disk, making the host unbootable or volume unmountable. HermeticWiper used EaseUS drivers
        and DeviceIoControl; GigaWiper reinitialized partitions and overwrote disks; ExPetr used a random installation
        ID to present false recoverability.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要 raw write、storage IOCTL、driver-load/root 或存储控制权与目标/metadata 知识；伪装还需可信勒索叙事。只读/受保护设备、应用控制、内核遥测、冗余
          metadata 与独立映像限制效果。
        en: The attacker needs raw write, storage IOCTL, driver-load or root, or storage control and target and metadata
          knowledge; camouflage also needs a credible ransom story. Read-only or protected devices, application control,
          kernel telemetry, redundant metadata, and independent images constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方观察进程/账户、raw open、驱动签名、IOCTL、块 I/O device/sector/length/direction、分区/文件系统清单、metadata hash/CRC、mount/boot/health、勒索工件和重启。完整块追踪昂贵且主机可随盘失效，因此关键区间和外部汇聚优先。
        en: Defenders observe process or account, raw open, driver signature, IOCTL, block-I/O device, sector, length
          and direction, partition or filesystem inventory, metadata hash or CRC, mount, boot or health, ransom artifacts,
          and reboot. Full block tracing is expensive and host telemetry can die with the disk, so critical extents
          and external collection take priority.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 关键块破坏发生在文件级观察之外
    en: Critical-block destruction occurs outside file-level observation
  analysis:
    paragraphs:
    - zh: 攻击者少量 raw 写入 MBR/GPT/MFT 等区间，痕迹从大量文件变化变为设备句柄、驱动/IOCTL 和有限扇区；文件传感器看不到决定卷可用性的因果，形成行为透明。
      en: The attacker performs a few raw writes to MBR, GPT, or MFT, changing traces from many file changes to a
        device handle, driver or IOCTL, and limited sectors. File sensors cannot see the cause deciding volume availability,
        producing behavioral transparency.
  evidence_refs:
  - REF-000988
  - REF-000989
  - REF-000990
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 可恢复勒索外观掩盖不可恢复磁盘毁坏
    en: A recoverable-ransomware appearance disguises irreversible disk destruction
  analysis:
    paragraphs:
    - zh: 攻击者显示勒索、ID 或解密状态，事件看似可用 key 恢复，但实现不保留恢复材料或并行擦除结构。呈现与真实状态冲突形成特征伪装；块状态与 key/恢复语义揭示。
      en: The attacker displays ransom, an ID, or decryption state so the event appears key-recoverable while the
        implementation retains no recovery material or wipes structures. The conflict between presentation and reality
        produces feature disguise; block state and key or recovery semantics expose it.
  evidence_refs:
  - REF-000989
  - REF-000990
  - REF-000991
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 关键元数据最小写入式毁坏按破坏覆盖与全盘影响不对称划分，需 raw I/O 与结构完整性；可恢复性话术伪装式擦除按呈现与实际恢复语义冲突划分，需 key/ID 和块状态验证。
      en: Critical-Metadata Minimal-Write Destruction is divided by asymmetry between write coverage and disk impact
        and needs raw I/O and structure integrity. Recoverability-Pretext Wipe Camouflage is divided by conflict between
        presentation and actual recovery semantics and needs key or ID and block-state validation.
    - zh: T1561.001/.002 内容/结构不导入。全盘覆写和普通结构初始化留父级，signed driver 是路径，写入模式和 device sanitize 证据不足，恢复对象/固件由相邻 owner 负责。
      en: T1561.001 and .002 content or structure are not imported. Full-disk overwrite and ordinary structure initialization
        remain parent core, signed drivers are a path, overwrite patterns and device sanitize lack evidence, and recovery
        objects or firmware have adjacent owners.
  coverage: established
  subtechnique_refs:
  - NJS-0202-001
  - NJS-0202-002
