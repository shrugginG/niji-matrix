schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0203-001
parent_ref: NJT-0203
name:
  zh: 业务合形值操纵
  en: Business-Conforming Value Manipulation
summary:
  zh: 攻击者写入错误但符合 schema、关系和业务节奏的值，使粗粒度规则把操纵视为正常交易。
  en: An adversary writes false values that conform to schema, relationships, and business cadence so coarse rules
    treat manipulation as normal transactions.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 业务合形值操纵用有效类型、允许范围、熟悉客户/供应商、正常金额/频率和关系组合产生错误记录或交易。稳定变量是语义错误与业务外观合形，而不是 stored/transmitted/runtime 位置。
    en: Business-Conforming Value Manipulation uses valid types, allowed ranges, familiar customers or vendors, normal
      amounts or frequencies, and plausible relations to produce false records or transactions. The stable variable
      is semantic falsity with a business-conforming appearance, not stored, transmitted, or runtime location.
stealth_characteristics:
  paragraphs:
  - zh: 业务合形值操纵通过 schema 和单字段 validation，单笔事件与正常基线接近；异常只在累计金额、关系图、授权来源和后继结果显现。CDC writer/transaction、业务不变量和长期关系仍可识别。
    en: Business-Conforming Value Manipulation passes schema and single-field validation and individual events resemble
      baseline. Anomaly appears in cumulative amount, relationship graph, authority origin, and successor outcomes.
      CDC writer or transaction, business invariants, and long-lived relations remain detectable.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入错误值仍可消费并符合局部语法/业务外观，且影响流程或决策。合法纠错、退款、调账、促销与季节变化是反例；数据不可用、纯显示改动或完成资产转移分别归相邻技术。
    en: Include false values that remain consumable and conform locally to syntax or business appearance and affect
      process or decision. Legitimate correction, refund, adjustment, promotion, and seasonality are counterexamples;
      unavailable data, display-only change, or completed asset transfer have adjacent owners.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: FIN13 学习金融业务，创建模仿正常客户与流程的欺诈交易并渐进抽取金额。
      en: FIN13 learned financial operations and created fraudulent transactions mimicking normal customers and processes
        while siphoning incremental amounts.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需业务数据写权和语义知识，并控制金额/频率以避免规则；双人审批、语义规则和独立对账限制效果。
        en: The attacker needs business-data write authority and semantic knowledge and controls amount or cadence
          to avoid rules; dual approval, semantic rules, and independent reconciliation constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方连接 CDC before/after、writer/transaction、业务 owner/approval、不变量、历史关系和下游 outcome，并使用 15 分钟到 90 天多尺度。
        en: Defenders join CDC before and after, writer or transaction, business owner or approval, invariants, historical
          relationships, and downstream outcomes over 15-minute to 90-day scales.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 业务合形外观掩盖错误值与恶意累计结果
    en: Business-conforming appearance disguises false values and malicious cumulative outcomes
  analysis:
    paragraphs:
    - zh: 攻击者让每笔值保持有效类型、关系与节奏，字段级观察正常而语义/累计结果恶意，形成特征伪装；业务不变量和长期图恢复。
      en: The attacker keeps each value within valid type, relation, and cadence so field-level observation remains
        normal while semantic or cumulative outcome is malicious, producing feature disguise; business invariants
        and long-horizon graphs restore it.
