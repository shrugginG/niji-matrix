research:
  limitations:
    paragraphs:
    - zh: FIN13 支持金融业务合形操纵，不给通用金额/频率阈值；其他行业需独立不变量。
      en: FIN13 supports business-conforming financial manipulation without universal amount or frequency thresholds;
        other sectors need their own invariants.
    - zh: 合法增长和纠错同形，需 owner、审批和长期 outcome。
      en: Legitimate growth and correction can be isomorphic and need owner, approval, and long-term outcome.
