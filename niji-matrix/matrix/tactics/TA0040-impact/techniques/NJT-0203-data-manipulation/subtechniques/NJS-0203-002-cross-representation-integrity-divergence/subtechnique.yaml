schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0203-002
parent_ref: NJT-0203
name:
  zh: 跨表示完整性分歧
  en: Cross-Representation Integrity Divergence
summary:
  zh: 攻击者让同一业务对象在数据库、消息、文档、UI 或外部回执间呈现不同值，使单一观察面看似自洽。
  en: An adversary makes one business object carry different values across database, message, document, UI, or external
    receipt so each single observation surface appears consistent.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 跨表示完整性分歧改变同一业务对象的一部分表示或转换路径，使数据库、消息、打印/PDF/UI、报表或外部确认之间不一致。稳定变量是 object identity 跨表示分叉，不是 runtime 或 stored
      名称。
    en: Cross-Representation Integrity Divergence changes one representation or transformation path of a business
      object so database, message, print or PDF or UI, report, or external confirmation disagree. The stable variable
      is branching of object identity across representations, not runtime or stored labels.
stealth_characteristics:
  paragraphs:
  - zh: 跨表示完整性分歧让每个局部系统的日志、格式和状态内部一致，只有跨系统对账才能看见冲突。攻击者可让 operator 面隐藏实际交易或让下游消费错误版本。稳定 ID、版本、digest、provenance 和独立
      receipt 揭示。
    en: Cross-Representation Integrity Divergence leaves each local system's logs, format, and state internally consistent
      and reveals conflict only through cross-system reconciliation. The attacker can hide the real transaction from
      the operator or feed a false version downstream. Stable IDs, versions, digests, provenance, and independent
      receipts expose it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入同一业务对象跨至少两个表示的不一致、攻击者控制和实际消费/判断结果。eventual consistency、格式舍入、缓存、合法重算或版本延迟是反例；直接页面篡改且无业务对象分歧归 NJT-0187。
    en: Include inconsistency across at least two representations of one business object, attacker control, and actual
      consumption or decision outcome. Eventual consistency, rounding, cache, legitimate recomputation, or version
      delay are counterexamples; direct page defacement without business-object divergence belongs to NJT-0187.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: APT38/DYEPACK 修改数据库记录并改变打印消息/PDF 输出，使 operator 看到与真实 SWIFT 交易不同的表示。
      en: APT38 or DYEPACK changed database records and printer or PDF output so operators saw a representation different
        from actual SWIFT transactions.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制多个表示或转换链中的至少一面，并知道 stable IDs；端到端签名、外部回执和独立对账限制效果。
        en: The attacker needs control of at least one representation or transform path and knowledge of stable IDs;
          end-to-end signing, external receipts, and independent reconciliation constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方收集 DB CDC、message ID、document/UI digest、版本、render job、外部 receipt 与 operator action，以对象 ID 在 5 分钟/24
          小时窗口对账。
        en: Defenders collect DB CDC, message IDs, document or UI digests, versions, render jobs, external receipts,
          and operator actions and reconcile by object ID over five-minute and 24-hour windows.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 业务对象跨表示分叉使真实状态离开单一观察边界
    en: Business-object divergence across representations moves truth outside a single observation boundary
  analysis:
    paragraphs:
    - zh: 攻击者只改一部分表示或转换，局部面各自正常，真实状态分散在多个系统，单面观察无法确定因果，形成行为透明；provenance/digest reconciliation 恢复。
      en: The attacker changes only part of the representations or transformations, leaving each local surface normal
        while truth is distributed across systems. One surface cannot establish causality, producing behavioral transparency;
        provenance and digest reconciliation restore it.
