research:
  limitations:
    paragraphs:
    - zh: DYEPACK 高置信支持金融表示分歧；其他领域需要稳定 object ID 和各表示语义。
      en: DYEPACK strongly supports financial representation divergence; other domains need stable object IDs and
        representation semantics.
    - zh: eventual consistency 和合法转换差可持续较久，必须按 SLA/版本排除。
      en: Eventual consistency and legitimate transformation differences can persist and require SLA and version handling.
