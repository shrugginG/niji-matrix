research:
  limitations:
    paragraphs:
    - zh: FIN13 与 APT38 直接支持两个变量，但集中于金融流程；跨行业 business invariants 与表示必须本地定义。stored/transmitted/runtime 不能作为原生兄弟项。
      en: FIN13 and APT38 directly support both variables but concentrate on financial workflows; business invariants
        and representations require local definition in other sectors. Stored, transmitted, and runtime cannot become
        native siblings.
    - zh: CDC 和 span 不自动证明恶意，eventual consistency、合法调整和转换差可产生相似结果；需要 owner、审批与 outcome。
      en: CDC and spans do not automatically prove malice; eventual consistency, legitimate adjustments, and transformation
        differences create similar outcomes and need owner, approval, and outcome.
