research:
  limitations:
    paragraphs:
    - zh: BEC 来源高置信支持受益账户替换，但变量也可由 ERP/insider/direct takeover 实现，不能把 BEC 作为子项边界。
      en: BEC sources strongly support beneficiary substitution, but the variable can also arise through ERP, insider,
        or direct takeover and BEC cannot define the child.
    - zh: 支付 rail 字段不同，必须证明 debit/credit 而非 instruction alone。
      en: Payment-rail fields differ and debit and credit must be proven rather than instruction alone.
