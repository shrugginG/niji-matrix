schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0204-001
parent_ref: NJT-0204
name:
  zh: 业务受益人结算账户替换
  en: Business-Beneficiary Settlement-Account Substitution
summary:
  zh: 攻击者保留熟悉供应商、金额和付款流程，仅把受益结算账户替换为攻击者控制 destination 并完成转账。
  en: An adversary preserves familiar vendor, amount, and payment workflow while substituting an attacker-controlled
    settlement destination and completing the transfer.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 业务受益人结算账户替换在熟悉发票、供应商、邮件线程或付款模板中改变 creditor account/agent，其他业务字段保持正常，最终 victim debit 与 attacker-beneficiary
      credit 均完成。稳定变量是 destination 的窄替换与流程外观保留，不是 BEC 渠道。
    en: Business-Beneficiary Settlement-Account Substitution changes the creditor account or agent in a familiar invoice,
      vendor, email thread, or payment template while other business fields remain normal and both victim debit and
      attacker-beneficiary credit complete. The stable variable is narrow destination substitution with preserved
      workflow appearance, not the BEC channel.
stealth_characteristics:
  paragraphs:
  - zh: 业务受益人结算账户替换让金额、供应商、周期、审批人与通信上下文贴近历史，单笔反欺诈可能认为正常；只有 beneficiary master old-new、独立确认、holder mismatch 和 rail
      IDs 揭示 destination 异常。
    en: Business-Beneficiary Settlement-Account Substitution keeps amount, vendor, cadence, approver, and communication
      context near history, so single-transaction fraud checks can appear normal. Beneficiary-master old and new state,
      independent confirmation, holder mismatch, and rail IDs reveal the destination anomaly.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入受益 destination 被未经授权替换、付款/结算成功及攻击者 beneficiary 入账。只有改发票/指令但支付被拒绝或未执行不完成；合法供应商银行变更需独立验证与审批。
    en: Include unauthorized substitution of beneficiary destination, successful payment or settlement, and credit
      to an attacker beneficiary. A changed invoice or instruction whose payment is rejected or not executed does
      not complete; legitimate vendor-bank changes require independent validation and approval.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制供应商/员工邮件或 ERP master data，只改账户尾号或 creditor agent，让应付账款按常规流程完成 wire。
      en: An attacker controls vendor or employee mail or ERP master data and changes only account digits or creditor
        agent so accounts payable completes a wire normally.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需影响 instruction/master 或审批，控制接收账户并保持上下文可信；call-back、pre-validation、双人批准与新受益人 hold 限制效果。
        en: The attacker needs to influence instruction, master, or approval, control a receiving account, and preserve
          context; callback, prevalidation, dual approval, and new-beneficiary holds constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方连接 instruction version/digest、supplier master、confirmation、UETR/EndToEndId、beneficiary/agent、status
          和 debit/credit。
        en: Defenders join instruction version or digest, supplier master, confirmation, UETR or EndToEndId, beneficiary
          or agent, status, and debit or credit.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 正常付款外观掩盖受益 destination 的窄替换
    en: Normal payment appearance disguises narrow substitution of the beneficiary destination
  analysis:
    paragraphs:
    - zh: 攻击者保留大多数业务特征，仅替换结算 endpoint，规则和人员看到熟悉交易，形成特征伪装；master/version 和独立确认恢复。
      en: The attacker preserves most business features and replaces only the settlement endpoint, leaving rules and
        people with a familiar transaction and producing feature disguise; master versions and independent confirmation
        restore it.
