research:
  limitations:
    paragraphs:
    - zh: 公开案例支持多银行/跨国移动但无完整 transaction IDs 与金额守恒，精确 hop/velocity 阈值需机构数据。
      en: Public cases support multi-bank and international movement without complete transaction IDs and amount conservation;
        exact hop and velocity thresholds need institutional data.
    - zh: 合法 treasury/payment processor 图可相似，需 owner、purpose 与 initial malicious settlement。
      en: Legitimate treasury or payment-processor graphs can resemble it and require owner, purpose, and initial
        malicious settlement.
