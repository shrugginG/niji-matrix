schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0204-002
parent_ref: NJT-0204
name:
  zh: 快速多跳价值分散
  en: Rapid Multi-Hop Value Dispersion
summary:
  zh: 攻击者在首次入账后迅速拆分并跨多个账户、银行、国家或地址转移价值，缩短冻结和追回窗口。
  en: An adversary rapidly splits and moves value across accounts, banks, countries, or addresses after initial credit,
    shortening freeze and recovery windows.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 快速多跳价值分散从已完成 attacker-beneficiary credit 开始，将金额拆分到多个 successor accounts/addresses 并在短期内继续转移。稳定变量是结算后 value
      graph 的 hop/fan-out 与时间，不是 mule 类型或国家。
    en: Rapid Multi-Hop Value Dispersion begins after completed attacker-beneficiary credit and splits value across
      successor accounts or addresses with onward movement in a short period. The stable variable is post-settlement
      value-graph hops, fan-out, and time, not mule type or country.
stealth_characteristics:
  paragraphs:
  - zh: 快速多跳价值分散让每个账户/机构只观察局部金额，完整所有权路径跨边界，且 recall/freeze 窗口随 hop 缩短。transaction IDs、金额/币种守恒、时间和 successor graph
      可恢复。
    en: Rapid Multi-Hop Value Dispersion leaves each account or institution seeing only a fraction, moves full ownership
      path across boundaries, and shortens recall or freeze time with each hop. Transaction IDs, amount and currency
      conservation, time, and successor graph restore it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入首次恶意入账后由攻击者控制的快速 successor transfers。正常 treasury sweep、payment processor、投资 rebalancing、拆薪和退款是反例；没有首次恶意
      settlement 不属于本项。
    en: Include attacker-controlled rapid successor transfers after initial malicious credit. Normal treasury sweeps,
      payment processors, investment rebalancing, payroll splitting, and refunds are counterexamples; absent initial
      malicious settlement falls outside.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: money mule 接收盗窃 wire 后拆分到多个银行并准备跨境转移；APT38 通过不同银行/国家多笔 SWIFT 转账分散价值。
      en: A money mule receives a stolen wire, splits it across banks, and prepares foreign movement; APT38 disperses
        value through multiple SWIFT transfers across banks and countries.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需控制 beneficiary 与 successor 网络、快速执行和跨机构通道；hold、速度/图规则、跨机构协作和立即报案限制效果。
        en: The attacker needs control of beneficiary and successor networks, rapid execution, and cross-institution
          channels; holds, velocity and graph rules, interinstitution cooperation, and immediate reporting constrain
          it.
    defender_model:
      paragraphs:
      - zh: 防守方连接 initial settlement、successor IDs、amount/currency、time、account ownership、returns/recalls 和 law-enforcement
          freeze，最好跨机构共享。
        en: Defenders join initial settlement, successor IDs, amount and currency, time, account ownership, returns
          or recalls, and law-enforcement freeze, ideally across institutions.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 结算后快速拆分把价值路径分散到多账户和机构窗口
    en: Rapid post-settlement splitting disperses the value path across account and institution windows
  analysis:
    paragraphs:
    - zh: 攻击者将价值拆成多个 successor hops，每个观察者只见局部且时间窗口短，形成时空释痕；ID 和金额守恒的长期图恢复。
      en: The attacker splits value into successor hops, leaving each observer with a fragment and a short window
        and producing spatiotemporal trace dilution; long-lived graphs of IDs and value conservation restore it.
