schema_version: 2.0.0
type: technique
id: NJT-0204
name:
  zh: 金融盗窃
  en: Financial Theft
summary:
  zh: 攻击者完成受害方价值扣账和受益方入账/控制，并通过受益账户替换或快速多跳分散降低发现与追回能力。
  en: Adversaries complete victim debit and beneficiary credit or control and reduce detection and recovery through
    beneficiary-account substitution or rapid multi-hop dispersion.
aliases:
- T1657
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1657
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1657
definition_and_concept:
  paragraphs:
  - zh: 金融盗窃是攻击者使受害方资金、数字资产或等价价值完成扣账/失去控制，并使攻击者或其受益方完成入账/取得控制的 Impact 行为。直接对象是已结算或已转移的价值所有权；金融动机、勒索要求、凭据、付款指令、恶意批准或
      pending transaction 没有双边结果时不完成。
    en: Financial Theft is an Impact behavior where victim funds, digital assets, or equivalent value are debited
      or leave victim control and the attacker or beneficiary is credited or gains control. The direct object is settled
      or transferred value ownership. Financial motive, ransom demand, credentials, payment instruction, malicious
      approval, or pending transaction without both sides of the result does not complete.
  - zh: Niji 关注欺诈怎样嵌入熟悉的受益人/付款流程，或结算后怎样迅速分散价值以跨越单机构冻结与观察窗口。交易指令操纵可另归 T1565，但不能替代 debit/credit evidence。
    en: Niji focuses on fraud embedded in familiar beneficiary or payment workflows and rapid dispersion after settlement
      across single-institution freeze and observation windows. Transaction-instruction manipulation can separately
      map to T1565 but cannot replace debit and credit evidence.
stealth_characteristics:
  paragraphs:
  - zh: 受益账户替换只改变 account/agent 等少数字段，金额、供应商、邮件线程、审批和业务时序保持正常；单据外观熟悉而价值进入攻击者控制账户。多跳分散在入账后快速拆分金额，单账户余额/单银行监控只见局部，整体
      value graph 跨机构或链上地址。
    en: Beneficiary-account substitution changes only a few account or agent fields while amount, vendor, email thread,
      approval, and business timing remain normal; instructions look familiar while value reaches an attacker-controlled
      account. Multi-hop dispersion rapidly splits value after credit, leaving one-account or one-bank monitoring
      with a fragment while the full value graph crosses institutions or addresses.
  - zh: 残余包括 instruction version/digest、beneficiary master old-new、独立 confirmation、UETR/EndToEndId/IMAD/OMAD、PDNG/ACSC/RJCT、debit/credit、successor
      transfers、amount/currency conservation、return/recall 与时间。跨业务—rail—value graph 关联恢复。
    en: Residue includes instruction version or digest, beneficiary master old and new, independent confirmation,
      UETR, EndToEndId, IMAD or OMAD, PDNG, ACSC or RJCT, debit and credit, successor transfers, amount and currency
      conservation, return or recall, and time. Cross business-to-rail-to-value-graph correlation restores it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入受害账户/钱包价值实际减少或失控，攻击者受益方成功入账/控制，且 actor/beneficiary 与交易链可支持恶意结论。被拒绝/撤销/returned/pending 交易、未使用凭据、发票变更未付款和诈骗尝试不完成。授权
      chargeback、退款和执法冻结是结果变更而非原盗窃不存在。
    en: Include actual reduction or loss of control of victim account or wallet value, successful credit or control
      by an attacker beneficiary, and transaction lineage supporting maliciousness. Rejected, canceled, returned,
      or pending transactions, unused credentials, and unpaid changed invoices do not complete. Authorized chargeback,
      refund, or law-enforcement freeze changes later outcome rather than negating the original theft.
  - zh: NJT-0189 转移受害方资源使用成本/容量而非既有价值，T1565 可操纵 transaction/instruction/history 但无结算不构成 T1657。Credential Access、账户接管、BEC
      和社会工程是前置，不能以金融动机替代完成门。
    en: NJT-0189 shifts victim resource use or cost rather than existing value, and T1565 can manipulate transactions,
      instructions, or history without settlement and therefore not complete T1657. Credential Access, account takeover,
      BEC, and social engineering are precursors and financial motive cannot replace completion.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在真实供应商/付款线程中替换受益账号，使企业完成 wire；或用被盗 banking/SWIFT/crypto authority 发起并结算交易，再转到多个 mule 银行或地址。
      en: An attacker substitutes beneficiary details in a real vendor or payment thread so a business completes a
        wire, or uses stolen banking, SWIFT, or crypto authority to initiate and settle transactions before moving
        value through mule banks or addresses.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要影响付款指令或 transaction authority、控制 beneficiary 和在 recall/freeze 前移动价值。独立确认、beneficiary allowlist、双人批准、settlement
          hold、交易限额和快速机构联系限制效果。
        en: The attacker needs influence over payment instructions or transaction authority, control of a beneficiary,
          and ability to move value before recall or freeze. Independent confirmation, beneficiary allowlists, dual
          approval, settlement holds, transaction limits, and rapid institution contact constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方连接业务 instruction/procurement、beneficiary master、身份/审批、支付 rail 状态、victim debit、beneficiary credit、successor
          graph、return/recall 和外部确认。不同 rail finality/字段不可互换，跨机构可见性有限。
        en: Defenders join business instruction or procurement, beneficiary master, identity or approval, payment-rail
          status, victim debit, beneficiary credit, successor graph, return or recall, and external confirmation.
          Rail finality and fields are not interchangeable and cross-institution visibility is limited.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 熟悉业务指令外观掩盖受益结算账户被替换
    en: Familiar business-instruction appearance disguises substituted beneficiary settlement accounts
  analysis:
    paragraphs:
    - zh: 攻击者只改受益账户/agent，保留供应商、金额、线程与流程，使字段和用户判断贴近正常，形成特征伪装；beneficiary master/digest 和独立确认揭示。
      en: The attacker changes only beneficiary account or agent while preserving vendor, amount, thread, and process,
        keeping fields and user judgment near normal and producing feature disguise; beneficiary master or digest
        and independent confirmation expose it.
  evidence_refs:
  - REF-001004
  - REF-001005
  - REF-001006
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 结算后快速拆分使价值图跨账户与机构观察窗口分散
    en: Rapid post-settlement splitting disperses the value graph across account and institution observation windows
  analysis:
    paragraphs:
    - zh: 攻击者在首次入账后迅速分拆并转出，使每个银行/账户只见局部且冻结时间缩短，形成时空释痕；transaction IDs、金额守恒和 successor graph 恢复。
      en: The attacker rapidly splits and forwards value after initial credit so each bank or account sees only a
        fragment and the freeze window shrinks, producing spatiotemporal trace dilution; transaction IDs, amount conservation,
        and successor graphs restore it.
  evidence_refs:
  - REF-001007
  - REF-001008
  - REF-001013
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 业务受益人结算账户替换按付款/结算指令中受益 destination 被小范围替换划分；快速多跳价值分散按完成入账后的 successor graph 和时间划分。前者检测 instruction-to-settlement，后者检测
        settlement-to-dispersion。
      en: Business-Beneficiary Settlement-Account Substitution is divided by narrow replacement of beneficiary destination
        in payment or settlement instructions. Rapid Multi-Hop Value Dispersion is divided by the successor graph
        and timing after completed credit. The former detects instruction to settlement and the latter settlement
        to dispersion.
    - zh: ATT&CK 无子项。BEC、凭据、malicious approval、rail 类型和资产类型不形成 NJS；没有完成 debit+credit 的事件不进入父级。
      en: ATT&CK has no children. BEC, credentials, malicious approval, rail type, and asset type do not define NJS;
        events without completed debit and credit do not enter the parent.
