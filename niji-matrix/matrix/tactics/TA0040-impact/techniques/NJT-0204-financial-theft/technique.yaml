research:
  limitations:
    paragraphs:
    - zh: 许多 ATT&CK 例子只证明钱包凭据、卡信息、勒索或金融动机，正式对象不能把它们当已结算盗窃。公开多跳案例没有完整 IDs/金额守恒表，图阈值需机构数据验证。
      en: Many ATT&CK examples establish wallet credentials, card data, extortion, or financial motive only and cannot
        prove settled theft. Public multi-hop cases lack complete IDs and value-conservation tables, so graph thresholds
        need institutional data.
    - zh: Fedwire 字段/状态不可直接复制到 ACH、card、SEPA 或 crypto；每条 rail 需独立 finality 与 return 语义。
      en: Fedwire fields and statuses cannot be copied directly to ACH, card, SEPA, or crypto; each rail needs its
        own finality and return semantics.
