schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0205-001
parent_ref: NJT-0205
name:
  zh: 合法发送者扇出式收件箱洪泛
  en: Legitimate-Sender Fan-Out Inbox Flooding
summary:
  zh: 攻击者驱动大量真实第三方发送少量已认证邮件，使单来源正常而 recipient fan-in 压倒邮箱。
  en: An adversary drives many real third parties to send small amounts of authenticated mail so each origin is normal
    while recipient fan-in overwhelms the mailbox.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 合法发送者扇出式收件箱洪泛通过自动订阅、注册或触发大量独立合法服务，使每个 sender/domain/IP 只发送少量正常格式/认证邮件，而同一 recipient 接收巨大总量并失去合法邮件可处理性。稳定变量是真实来源
      fan-out 与 recipient 汇聚，不是 newsletter 产品。
    en: Legitimate-Sender Fan-Out Inbox Flooding automates subscriptions, registrations, or triggers across independent
      legitimate services so each sender, domain, or IP sends a small amount of normal and authenticated mail while
      one recipient receives a huge aggregate and loses legitimate-mail usability. The stable variable is real-origin
      fan-out and recipient convergence, not a newsletter product.
stealth_characteristics:
  paragraphs:
  - zh: 合法发送者扇出式收件箱洪泛使 SPF/DKIM/DMARC、sender reputation 和单域速率通常正常，传统 spam/source 规则缺少共同恶意来源；recipient fan-in、EmailClusterId/campaign/list
      关系和异常 first-contact 分布揭示。
    en: Legitimate-Sender Fan-Out Inbox Flooding leaves SPF, DKIM, DMARC, sender reputation, and one-domain rate generally
      normal, depriving spam or source rules of one malicious origin. Recipient fan-in, EmailClusterId or campaign
      or list relations, and abnormal first-contact distribution reveal it.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入大量真实第三方来源、同一 recipient 汇聚和合法邮件处理/邮箱可用性影响。单一 spam campaign、合法营销 surge、组织 newsletter migration 和 phishing
      lure 不自动满足；后继 helpdesk 冒充独立。
    en: Include many real third-party origins, convergence on one recipient, and legitimate-mail handling or mailbox
      availability impact. One spam campaign, legitimate marketing surge, organization newsletter migration, or phishing
      lure does not automatically qualify; follow-on helpdesk impersonation is separate.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者把政府/员工邮箱订阅到数千 customer lists，或自动触发众多 newsletter confirmations，使几小时/数日收件箱不可处理。
      en: An attacker subscribes government or employee mailboxes to thousands of customer lists or triggers many
        newsletter confirmations, making the inbox unusable for hours or days.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需地址与自动化注册、绕过 opt-in/CAPTCHA 并分散来源；confirmed opt-in、abuse API、recipient fan-in limits 和 campaign cleanup
          限制效果。
        en: The attacker needs addresses and automated registration, bypasses opt-in or CAPTCHA, and disperses origins;
          confirmed opt-in, abuse APIs, recipient fan-in limits, and campaign cleanup constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方按 recipient 聚合 authenticated sender/domain/IP、cluster/list/campaign、delivery/folder/read 与用户影响，不能按
          spam label alone。
        en: Defenders aggregate authenticated sender, domain, IP, cluster, list or campaign, delivery, folder or read,
          and user impact by recipient rather than spam label alone.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 真实发送者扇出掩盖共同 recipient 攻击意图
    en: Real-sender fan-out disguises common recipient-targeting intent
  analysis:
    paragraphs:
    - zh: 每个第三方执行正常发送，局部信誉和认证良好；共同恶意意图只在 recipient fan-in/订阅关系显现，形成特征伪装。
      en: Each third party sends normally with good local reputation and authentication; shared malicious intent appears
        only in recipient fan-in or subscription relations, producing feature disguise.
