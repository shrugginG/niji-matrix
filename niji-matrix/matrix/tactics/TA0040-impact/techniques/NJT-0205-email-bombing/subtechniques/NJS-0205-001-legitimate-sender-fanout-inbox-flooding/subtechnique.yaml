research:
  limitations:
    paragraphs:
    - zh: 事件支持大量合法来源与 inbox impact，但 list/campaign 归一化因提供方不同；阈值需 recipient 角色基线。
      en: Incidents support many legitimate origins and inbox impact, but list or campaign normalization differs by
        provider and thresholds need recipient-role baselines.
    - zh: 合法 marketing/event surge 可同形，必须有 owner/活动日历与可用性结果。
      en: Legitimate marketing or event surges can be isomorphic and require owner or event calendar and availability
        outcome.
