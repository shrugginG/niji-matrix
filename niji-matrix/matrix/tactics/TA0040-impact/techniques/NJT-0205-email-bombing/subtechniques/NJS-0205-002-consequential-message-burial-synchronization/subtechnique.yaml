research:
  limitations:
    paragraphs:
    - zh: HHS 指南和字段支持机制与防御，但缺命名事件完整连接关键通知、洪泛和 missed action，因此保持 medium 且无 CASE。
      en: HHS guidance and fields support the mechanism and defense, but no named incident fully joins consequential
        notice, flood, and missed action, so confidence remains medium without a CASE.
    - zh: read/access 不等于人已理解，offline sync 会产生盲区；必须用业务 action/SLA 作为结果。
      en: Read or access does not equal human understanding and offline sync creates blind spots; business action
        or SLA is required as outcome.
