schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0205-002
parent_ref: NJT-0205
name:
  zh: 关键消息埋没同步
  en: Consequential-Message Burial Synchronization
summary:
  zh: 攻击者把邮件洪泛与密码、金融或安全后果通知同步，使关键消息在短时噪声中无法及时发现或处理。
  en: An adversary synchronizes mail flooding with password, financial, or security consequence notifications so critical
    messages cannot be found or handled promptly in short-lived noise.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 关键消息埋没同步把高 fan-in 邮件窗口与另一攻击动作产生的 consequential notification 对齐，使通知虽然投递却在人工/规则处理窗口被大量非关键邮件稀释。稳定变量是洪泛与关键消息的时间/业务关系，不是邮件数量。
    en: Consequential-Message Burial Synchronization aligns a high-fan-in mail window with a consequential notification
      created by another attack action so the notice is delivered but diluted by noncritical mail during human or
      rule handling. The stable variable is the temporal and business relation between flood and consequential message,
      not message count.
stealth_characteristics:
  paragraphs:
  - zh: 关键消息埋没同步的总量显著但意义被隐藏：密码重置、支付、规则变更或安全告警的单封邮件处于同 recipient 同期洪泛中。message ID、received/folder/isRead/access、notification
      event 和 action/SLA 关联可恢复。
    en: 'Consequential-Message Burial Synchronization makes volume obvious while hiding meaning: one password-reset,
      payment, rule-change, or security-alert message sits inside concurrent flooding for the same recipient. Message
      ID, received, folder, read or access, notification event, and action or SLA correlation restore it.'
scope_boundary_definition:
  paragraphs:
  - zh: 纳入 consequential message、同 recipient 洪泛窗口及延迟/缺失业务 action 或 SLA breach。高量但没有关键通知、通知被及时处理或单纯 phishing lure 不满足。
    en: Include a consequential message, same-recipient flood window, and delayed or missing business action or SLA
      breach. High volume without a critical notice, timely handled notice, or a phishing lure alone does not qualify.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者触发账户重置、金融变更或安全告警后立即邮件轰炸，使通知在收件箱被埋没并延迟响应。
      en: An attacker triggers account reset, financial change, or security alert and immediately mail-bombs the recipient
        so the notice is buried and response delayed.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需知道目标地址与关键动作/通知时机，并产生足够 fan-in；独立 priority channel、push/SMS confirmation、SLA monitor 和 auto-escalation
          限制效果。
        en: The attacker needs the address and timing of the critical action or notice and enough fan-in; independent
          priority channels, push or SMS confirmation, SLA monitoring, and auto-escalation constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方维护 consequential notification registry，把 source event/message ID、recipient、received/folder/read/access
          与预期 action/SLA 关联。离线读取使 audit 缺失不能证明未读。
        en: Defenders maintain a consequential-notification registry and join source event or message ID, recipient,
          received, folder, read or access, and expected action or SLA. Offline reading means absent audit cannot
          prove unread.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 与关键通知同步的短时洪泛稀释后果消息可见性
    en: Short flood synchronized with a consequential notice dilutes message visibility
  analysis:
    paragraphs:
    - zh: 攻击者把大量普通邮件集中在关键通知的时间邻域，单封后果消息在注意力与规则队列中被稀释，形成时空释痕；message-to-action/SLA 长关联恢复。
      en: The attacker concentrates ordinary messages around a consequential notice, diluting one high-impact message
        in attention and rule queues and producing spatiotemporal trace dilution; long message-to-action or SLA correlation
        restores it.
