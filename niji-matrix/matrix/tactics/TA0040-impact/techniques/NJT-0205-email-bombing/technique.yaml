schema_version: 2.0.0
type: technique
id: NJT-0205
name:
  zh: 邮件轰炸
  en: Email Bombing
summary:
  zh: 攻击者向目标收件人或邮件服务注入大量邮件，使合法通信埋没或投递/处理受阻，并通过合法发送者扇出或关键消息同步降低过滤效果。
  en: Adversaries inject large volumes of mail into a target recipient or service, burying legitimate communication
    or blocking delivery and handling while legitimate-sender fan-out or consequential-message synchronization weakens
    filtering.
aliases:
- T1667
classification:
  tactic_refs:
  - TA0040
  origin:
    kind: attack-adapted
    source_attack_id: T1667
    source_attack_version: '19.1'
  decision_ref: DEC-TA0040-T1667
definition_and_concept:
  paragraphs:
  - zh: 邮件轰炸是攻击者使目标邮箱、收件人群或邮件服务接收异常大量消息，并造成合法邮件难以发现/处理、接收限额、队列或投递失败、客户端/人员负担或业务中断。直接对象是 recipient-centric 邮件可用性与注意力；高量没有结果只构成候选。
    en: Email Bombing causes a target mailbox, recipient set, or mail service to receive abnormal message volume and
      creates legitimate-message discovery or handling difficulty, receive-limit, queue or delivery failure, client
      or human burden, or business interruption. The direct object is recipient-centric mail availability and attention;
      high volume without outcome is only a candidate.
  - zh: Niji 关注洪泛如何分散到大量合法发送者，使认证和 sender reputation 失去判别力，以及洪泛如何与重置/金融/安全等关键通知同步，把 consequential message 埋在噪声中。
    en: Niji focuses on flooding distributed across many legitimate senders so authentication and sender reputation
      lose discrimination and on synchronization with password-reset, financial, security, or other consequential
      notifications to bury them in noise.
stealth_characteristics:
  paragraphs:
  - zh: 注册炸弹让第三方合法 list/commerce/security 服务各发送少量 authenticated 邮件，单 sender/domain/IP 不异常而 recipient fan-in 巨大；关键消息埋没同步让总量本身显著，却隐藏哪一封具有业务后果。
    en: Registration bombs cause third-party legitimate list, commerce, or security services each to send a few authenticated
      messages, leaving no anomalous single sender, domain, or IP while recipient fan-in is huge. Consequential-message
      burial makes total volume obvious but hides which message carries a business consequence.
  - zh: 残余包括 NetworkMessageId、sender/domain/IP、recipient、EmailClusterId、auth/BCL、delivery action/location、message/list/campaign、Graph
      received/isRead/folder、MailItemsAccessed、transport status/NDR、receive limits、用户 action/SLA 和独立通知。
    en: Residue includes NetworkMessageId, sender, domain, IP, recipient, EmailClusterId, authentication and BCL,
      delivery action and location, message, list or campaign, Graph received, read and folder, MailItemsAccessed,
      transport status or NDR, receive limits, user action or SLA, and independent notifications.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入邮件扇入与合法通信埋没、处理/投递困难、receive-limit/queue/邮箱不可用或业务中断的因果。新闻/营销活动、事故通知、正常 list migration 和合法高量工作流是反例；邮件量 alone
      不完成。
    en: Include causal mail fan-in plus legitimate-message burial, handling or delivery difficulty, receive-limit,
      queue or mailbox unavailability, or business interruption. News or marketing campaigns, incident notifications,
      list migration, and legitimate high-volume workflows are counterexamples; volume alone does not complete.
  - zh: 邮件系统内部资源耗尽可另归 NJT-0199，网络容量归 NJT-0198，诱饵内容归 phishing，邮件控制信道归 C2，MFA challenge flooding 归 T1621/身份对象。后继 vishing/helpdesk
      冒充独立建模。
    en: Mail-system internal resource exhaustion can separately map to NJT-0199, network capacity to NJT-0198, lure
      content to phishing, mail control channels to C2, and MFA challenge flooding to T1621 or identity objects. Follow-on
      vishing or helpdesk impersonation is modeled separately.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者把目标地址自动订阅到大量 newsletter/commerce lists，使数千封合法确认邮件进入少数邮箱；也可在触发密码重置、金融变更或安全通知时同步洪泛，掩盖后果消息，随后实施 helpdesk
        冒充。
      en: An attacker subscribes a target address to many newsletter or commerce lists, sending thousands of legitimate
        confirmations into a few mailboxes, or synchronizes flooding with password reset, financial change, or security
        notices to bury consequential mail before helpdesk impersonation.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要目标地址、自动化注册/发送能力和足够来源，关键消息子项还需知道触发时点。confirmed opt-in、CAPTCHA、list abuse controls、recipient fan-in
          limits、priority channels 和 provider 协作限制效果。
        en: The attacker needs target addresses, automated registration or sending, and enough sources; the consequential-message
          child also needs trigger timing. Confirmed opt-in, CAPTCHA, list-abuse controls, recipient fan-in limits,
          priority channels, and provider cooperation constrain it.
    defender_model:
      paragraphs:
      - zh: 防守方按 recipient 观察 EmailEvents/message trace/Graph mailbox/access/transport limits，维护 sender/campaign/list、合法业务与关键
          notification registry，并连接用户 action/SLA。离线读取和 Sync/Bind 审计限制意味着无 access event 不等于未读。
        en: Defenders observe EmailEvents, message trace, Graph mailbox and access, and transport limits by recipient;
          maintain sender, campaign, list, legitimate business, and consequential-notification registries; and join
          user action and SLA. Offline reading and Sync or Bind semantics mean absent access events do not prove unread.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 众多合法发送者使 recipient 洪泛缺少单一恶意来源特征
    en: Many legitimate senders leave recipient flooding without one malicious-origin feature
  analysis:
    paragraphs:
    - zh: 攻击者驱动大量真实第三方发送 authenticated 邮件，每源局部正常，传统 sender reputation/blocklist 难以聚类，形成特征伪装；recipient fan-in、campaign/list
        关系与 delivery outcome 恢复。
      en: The attacker drives many real third parties to send authenticated mail, leaving each origin locally normal
        and defeating sender-reputation or blocklist clustering, producing feature disguise; recipient fan-in, campaign
        or list relations, and delivery outcomes restore it.
  evidence_refs:
  - REF-001016
  - REF-001017
  - REF-001018
  - REF-001019
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 洪泛与关键通知同步，使后果消息在短时噪声中埋没
    en: Flood synchronization buries consequential messages in short-lived noise
  analysis:
    paragraphs:
    - zh: 攻击者把高 fan-in 窗口与目标操作通知对齐，关键邮件在时间邻域被大量普通邮件稀释，人员/规则难以及时识别，形成时空释痕；稳定 message ID、notification registry 和 action
        SLA 恢复。
      en: The attacker aligns a high-fan-in window with a target-operation notice, diluting consequential mail among
        ordinary messages in its temporal neighborhood so people and rules fail to identify it promptly, producing
        spatiotemporal trace dilution; stable message IDs, notification registries, and action SLAs restore it.
  evidence_refs:
  - REF-001016
  - REF-001020
  - REF-000567
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 合法发送者扇出式收件箱洪泛按来源真实性和 fan-out 划分，需要 recipient-centric 聚合而非单 sender 过滤；关键消息埋没同步按洪泛与 consequential notification
        的时间/业务关系划分，需要 message-to-action 关联。
      en: Legitimate-Sender Fan-Out Inbox Flooding is divided by real sender identity and fan-out and needs recipient-centric
        aggregation instead of one-sender filtering. Consequential-Message Burial Synchronization is divided by temporal
        and business relation between flood and consequential notification and needs message-to-action joins.
    - zh: ATT&CK 无子项。原始邮件速率、目标邮箱类型、spam/ham 分类和后继 phishing 不形成 NJS；没有埋没/投递/处理/业务结果的高量留在候选层。
      en: ATT&CK has no children. Raw mail rate, mailbox type, spam or ham label, and follow-on phishing do not define
        NJS; high volume without burial, delivery, handling, or business outcome remains candidate-level.
  coverage: established
  subtechnique_refs:
