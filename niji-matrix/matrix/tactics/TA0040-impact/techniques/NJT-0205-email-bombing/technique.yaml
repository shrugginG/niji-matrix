research:
  limitations:
    paragraphs:
    - zh: 政府注册炸弹与 MDR 事件支持合法发送者 fan-out 和实际 inbox impact；关键消息同步轴由 HHS 指南和消息字段强推断，缺命名完整案例，保持 medium 且无 CASE。
      en: Government registration bombs and MDR incidents support legitimate-sender fan-out and inbox impact. The
        consequential-message synchronization axis is strongly inferred from HHS guidance and message fields, lacks
        a named complete case, and remains medium without a CASE.
    - zh: 合法活动可造成高量，MailItemsAccessed/Graph read 状态不完全代表人员认知；必须连接 delivery、access、action/SLA 和业务结果。
      en: Legitimate activity can create high volume, and MailItemsAccessed or Graph read state does not fully represent
        human awareness; delivery, access, action or SLA, and business outcome need joining.
