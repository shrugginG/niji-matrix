  name_en: Acquire Infrastructure
  name_zh: 获取基础设施
decision: adapt
rationale_zh: 基础设施购买、租用或注册本身不自动构成匿迹；当取得合法多租户资源以借用共享域、证书和流量背景，或在取得阶段实施可证明的生命周期与替换资源设计时，行为具有稳定防御边界，因此适配保留。
rationale_en: Buying, leasing, or registering infrastructure is not automatically stealth; when acquisition obtains legitimate multi-tenant resources to borrow shared domains, certificates, and traffic background or applies a demonstrable lifecycle or replacement-resource design, the behavior has a stable defensive boundary and is retained as adapted.
scope_notes_zh: 不按域名、VPS、服务器、广告、云或 Web 服务继承 ATT&CK 子技术。攻陷第三方资源属于 T1584 候选，账户建立属于 T1585 候选，能力投放属于 T1608 候选。
scope_notes_en: ATT&CK children are not imported by domain, VPS, server, advertising, cloud, or Web-service type. Compromise of third-party resources belongs to the T1584 candidate, account establishment to T1585, and capability staging to T1608.
gap_statement_zh: 注册与账单身份分舱因跨账户与基础设施归属边界以及直接证据不足继续延期。
gap_statement_en: Registration and billing identity compartmentation remains deferred because of cross-account and infrastructure-ownership boundaries and insufficient direct evidence.
