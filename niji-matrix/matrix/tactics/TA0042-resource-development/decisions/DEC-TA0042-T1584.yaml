  name_en: Compromise Infrastructure
  name_zh: 攻陷基础设施
decision: retain
rationale_zh: 被攻陷基础设施可继承真实所有者的域、网络归属、信誉和正常功能，使实际操作者与可见资产所有者分离，并把恶意代理或托管叠加到合法流量中，具有独立匿迹链。
rationale_en: Compromised infrastructure can inherit a real owner's domain, network attribution, reputation, and normal function, separating the actual operator from the visible asset
  owner and overlaying malicious proxying or hosting on legitimate traffic, which forms an independent stealth chain.
scope_notes_zh: 取得控制的入侵步骤和后续代理/C2/投放分开；不按域名、服务器、设备或 Web 服务继承 ATT&CK 子技术。
scope_notes_en: Separate the compromise step and downstream proxy, C2, or staging behavior; do not import ATT&CK children by domain, server, device, or Web service.
