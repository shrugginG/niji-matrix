  name_en: Establish Accounts
  name_zh: 建立账户
decision: retain
rationale_zh: 新建并培育行动账户或人物身份可形成账户年龄、公开历史、关系图和一致人物特征，使后续目标难以依靠新账户和首次接触信号区分恶意身份，因此应保留。
rationale_en: Creating and cultivating operational accounts or personas can establish age, public history, relationship graphs, and coherent persona features, making malicious identities
  difficult to distinguish through new-account and first-contact signals, so the technique should be retained.
scope_notes_zh: 与 T1586 按新建培育和真实历史继承区分；NJS-0024 仅覆盖开放源研究账户隔离；生成内容归 NJT-0018，下游接触另行分类。
scope_notes_en: Distinguish it from T1586 by create-and-cultivate versus inheritance of real history; NJS-0024 only covers open-source research-account compartmentation; generated content
  belongs to NJT-0018 and downstream contact remains separate.
