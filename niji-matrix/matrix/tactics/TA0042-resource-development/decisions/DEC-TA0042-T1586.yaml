  name_en: Compromise Accounts
  name_zh: 攻陷账户
decision: retain
rationale_zh: 被接管账户继承真实身份、域、年龄、信誉、权限、关系和历史，能够降低后续账户实体与业务情境的异常度；提供方和原租户仍可从登录、令牌、设置与内容访问识别准备行为，因此这是独立但并非全局不可见的资源技术。
rationale_en: Taken-over accounts inherit authentic identity, domain, age, reputation, privilege, relationships, and history, reducing later account-entity and business-context anomaly. Providers and original tenants can still identify preparation through sign-in, token, setting, and content-access records, making this an independent but not globally invisible resource technique.
scope_notes_zh: 账户接管步骤与后续发送、投递或登录均被排除；唯一子技术截止于首次对外行动前的历史关系情境选择，并与后续线程回复或社会工程行为分开。
scope_notes_en: Account-takeover steps and downstream sending, delivery, or logon are excluded; the sole child ends at historical relationship-context selection before first outward action and remains separate from later thread reply or social-engineering behavior.
