  name_en: Develop Capabilities
  name_zh: 开发能力
decision: adapt
rationale_zh: 普通能力自研只是资源准备；当攻击者在需求和构建阶段把分析环境、工具或目标配置条件写入能力，减少分析环境中的高信号行为时，研发阶段本身具有独立痕迹和防守边界，故适配保留。
rationale_en: Ordinary in-house development is merely resource preparation; when adversaries encode analysis-environment, tool, or target-configuration conditions during requirements
  and build stages to reduce high-signal behavior in analysis environments, development has independent traces and a defensive boundary and is retained as adapted.
scope_notes_zh: 门控设计属于本技术，运行时检查/退出属于相应规避行为；外部取得归 NJT-0019，部署归 NJT-0020，非代码内容生成归 NJT-0018。
scope_notes_en: Gating design belongs here, while runtime checking or exit belongs to the applicable evasion behavior; external acquisition belongs to NJT-0019, staging to NJT-0020,
  and non-code content generation to NJT-0018.
gap_statement_zh: 遥测抑制设计仍因公开材料主要证明运行时行为而延期；构建多样化已完成独立分类。
gap_statement_en: Telemetry-suppression design remains deferred because public material primarily demonstrates runtime behavior; build diversification is now independently classified.
