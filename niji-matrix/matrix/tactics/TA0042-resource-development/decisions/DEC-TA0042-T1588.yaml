  name_en: Obtain Capabilities
  name_zh: 获取能力
decision: adapt
rationale_zh: 普通购买、窃取或下载能力不自动构成匿迹；当外部能力使操作者与开发者谱系分离，或继承合法工具、发行者、签名和证书特征时，具有独立归因与信任边界，故适配保留。
rationale_en: Ordinary capability purchase, theft, or download is not automatically stealth; externally obtained capability has independent attribution and trust boundaries when it separates
  operator from developer lineage or inherits legitimate tool, publisher, signature, or certificate features, so it is retained as adapted.
scope_notes_zh: 内部研发归 NJT-0016，特定目标访问权归 NJT-0012，能力布置归 NJT-0020，AI 生成内容归 NJT-0018。
scope_notes_en: In-house development belongs to NJT-0016, target-specific access to NJT-0012, capability placement to NJT-0020, and AI-generated content to NJT-0018.
