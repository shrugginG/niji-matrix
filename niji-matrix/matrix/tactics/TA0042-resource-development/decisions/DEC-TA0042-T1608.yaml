  name_en: Stage Capabilities
  name_zh: 投放能力
decision: adapt
rationale_zh: 普通上传、安装或配置只是准备动作；当投放选择真实高信誉服务并把恶意性内移到租户、对象或内容层，使受害者首先看到共享域、证书和常见流量时，具有独立匿迹链，故适配保留。
rationale_en: Ordinary upload, installation, or configuration is merely preparation; when staging uses genuine high-reputation services and moves maliciousness into tenant, object, or
  content layers so victims first observe shared domains, certificates, and common traffic, it has an independent stealth chain and is retained as adapted.
scope_notes_zh: 不继承上传恶意软件、工具、证书、链接目标等 ATT&CK 子技术。资源取得/攻陷归 NJT-0013/NJT-0015，能力来源归 NJT-0016/NJT-0019，下游下载、执行、C2 分开。
scope_notes_en: Do not import ATT&CK children such as malware, tool, certificate, or link-target staging. Resource acquisition or compromise belongs to NJT-0013/NJT-0015, capability
  source to NJT-0016/NJT-0019, and downstream download, execution, or C2 remains separate.
gap_statement_zh: 按需短寿命投放仍因与条件门控、资源轮换和 IOC 生命周期重叠而延期；条件门控已完成独立分类。
gap_statement_en: Just-in-time ephemeral staging remains deferred because of overlap with context gating, resource rotation, and IOC lifecycle; context gating is now independently classified.
