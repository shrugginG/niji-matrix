  name_en: Acquire Access
  name_zh: 获取访问权
decision: retain
rationale_zh: 购买、交换或通过伙伴取得已经存在的目标访问权，可让买方跳过自行扫描、钓鱼或利用形成入口的活动，并从经纪筛选出的高权限或低监控位置开始后续行动，因此具有独立资源对象和观察边界。
rationale_en: Purchasing, exchanging, or receiving through partners existing victim access lets the buyer skip buyer-performed scanning, phishing, or exploitation used to create a foothold and begin later activity from broker-selected privileged or weakly monitored positions, giving the candidate an independent resource object and observation boundary.
scope_notes_zh: 仅涵盖已验证目标入口的取得、交付确认与使用前准备；通用凭据或工具、前置攻陷以及交付后的登录、横移、持久化或执行均属于其他行为。不继承 ATT&CK 子技术。
scope_notes_en: Covers only acquisition, handoff confirmation, and pre-use preparation of a verified victim foothold; generic credentials or tools, preceding compromise, and post-handoff logon, lateral movement, persistence, or execution remain separate. ATT&CK children are not imported.
