  name_en: Generate Content
  name_zh: 生成内容
decision: adapt
rationale_zh: 内容可为人物身份、冒充和社会工程减少语言、角色与业务语境异常，但普通写作、翻译或仅使用 AI 不自动构成匿迹；将父级收窄为有明确拟态目标的欺骗内容资产准备后适配保留。
rationale_en: Content can reduce language, role, and business-context anomalies for personas, impersonation, and social engineering, but ordinary writing, translation, or AI use is not
  automatically stealth; adapt the parent to deceptive content-asset preparation with an explicit camouflage objective.
scope_notes_zh: 不按文字/音视频继承 ATT&CK 子技术。生成在首次发送/展示前结束；直接信息诱导归 NJS-0020，账户培育归 NJT-0017，公共 AI 查询归 NJT-0011。
scope_notes_en: Do not import ATT&CK children by written or audiovisual medium. Generation ends before first sending or display; direct information elicitation belongs to NJS-0020, account
  cultivation to NJT-0017, and public-AI querying to NJT-0011.
