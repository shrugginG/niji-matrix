research:
  limitations:
    paragraphs:
    - zh: Microsoft 案例直接记录账户接管后的财务邮件、附件和付款线程检索，Proofpoint 案例证明真实邮箱与既有业务会话被用于后续内容，但后者未公开完整的准备阶段对象访问日志。因此子技术存在性为高置信度，而特定事件中每个被使用情境都来自主动历史搜索的结论不能超出来源。
      en: The Microsoft case directly records access to finance mail, attachments, and payment-thread searches after takeover,
        while the Proofpoint case establishes later use of authentic mailboxes and existing business conversations but does
        not publish complete preparation-stage object audit. The child therefore has high-confidence existence, but conclusions
        that every context used in a particular event came from active history search must not exceed the source.
    - zh: 合法财务处理、审计、诉讼取证和人员交接也会集中访问历史对象，且隐私限制可能阻止跨组织关联。可靠判断需要同时出现异常会话、目的明确的检索、对象与后续用途对应以及账户完整性变化中的多个要素。
      en: Legitimate financial processing, audit, legal discovery, and staff handover also concentrate on historical objects,
        while privacy limits may prevent cross-organizational correlation. Reliable judgment requires multiple elements across
        anomalous session context, purpose-directed retrieval, mapping of objects to later use, and account-integrity change.
