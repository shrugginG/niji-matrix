schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0043-001
parent_ref: NJT-0043
name:
  zh: 账户历史导向的关系情境选择
  en: Account-History-Guided Relationship Context Selection
summary:
  zh: 在首次对外行动前检索真实账户的邮件、联系人、文件或既有线程，并选择可信关系与业务情境供后续使用。
  en: Search a genuine account's mail, contacts, files, or existing threads before first outward action and select a trusted
    relationship and business context for later use.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 账户历史导向的关系情境选择是攻击者在已经控制真实账户后、首次对外行动前，主动检索邮件、联系人、附件、共享文件或既有线程，并从中选择具体业务关系、主题和交流背景的资源准备方法。其直接目的是为后续冒充、投递或欺诈提供真实而非编造的关系上下文。
    en: Account-History-Guided Relationship Context Selection is a resource-preparation method in which an adversary, after
      controlling a genuine account and before first outward action, actively searches mail, contacts, attachments, shared
      files, or existing threads and selects a specific business relationship, topic, and communication background. Its immediate
      purpose is to supply authentic rather than fabricated relationship context for later impersonation, delivery, or fraud.
  - zh: 该概念以“准备阶段的历史检索与选择”为边界。账户原本拥有历史不够构成本子技术，攻击者必须实际消费历史对象并把选择结果用于后续计划；真正发送回复、注入线程、请求付款或访问其他系统属于下游行为。
    en: The concept is bounded by history retrieval and selection during preparation. Merely possessing an account with history
      is insufficient; the adversary must actually consume historical objects and use the selected result for later planning.
      Sending a reply, injecting a thread, requesting payment, or accessing another system is downstream behavior.
stealth_characteristics:
  paragraphs:
  - zh: 账户历史导向的关系情境选择把后续话术、收件人、附件和主题建立在真实交往记录上，使外部目标看到的内容与既有关系、术语和业务节奏一致。恶意操作者因此无需凭空猜测组织结构或业务事实，基于内容陌生度、首次接触和关系不存在性的检测更难区分后续交互。
    en: Account-History-Guided Relationship Context Selection grounds later wording, recipients, attachments, and topics in
      genuine interaction records, so an external target sees content consistent with existing relationships, terminology,
      and business cadence. The malicious operator need not guess organizational structure or business facts, making detections
      based on unfamiliar content, first contact, or absent relationships less discriminating.
  - zh: 检索仍在服务提供方或原租户侧留下搜索、读取、下载、会话和对象访问痕迹，且异常会话后的集中财务或联系人搜索可以区别于日常使用。若平台缺少对象级审计、客户端缓存绕过服务日志或历史检索与首次使用相隔过久，防守方更难恢复准备链。
    en: Retrieval still leaves provider- or tenant-side search, read, download, session, and object-access traces, and concentrated
      finance or contact searches after an anomalous session can differ from routine use. Missing object-level audit, client
      caching that bypasses service logs, or long delay between history access and first use makes the preparation chain harder
      to reconstruct.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入对真实账户历史对象的有目的检索、筛选和关系情境选择，且该活动必须发生在首次对外操作前。判定应结合异常会话、对象访问模式、所选关系与后续用途，而不能仅依据账户存在历史或访问了旧邮件。
    en: This child includes purposeful retrieval, filtering, and relationship-context selection from genuine account history
      before first outward action. Classification should combine anomalous session context, object-access pattern, selected
      relationship, and later use rather than rely only on the account having history or opening old mail.
  - zh: 批量窃取全部邮箱内容、账户接管和令牌窃取属于其他行为，账户本身的信誉继承属于父级范围；在既有线程中实际回复或注入内容属于下游社会工程或投递。电子取证、内部调查、员工交接和合法财务回溯可能呈现相似集中检索，需要授权和业务周期解释。
    en: Bulk theft of all mailbox contents, account takeover, and token theft belong to other behavior, while inheritance
      of account reputation belongs to the parent scope. Actual reply or content injection into an existing thread is downstream
      social engineering or delivery. Forensics, internal investigation, employee handover, and legitimate financial review
      may show similar concentrated retrieval and require authorization and business-cycle context.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者接管企业邮箱、供应商协作账户或文件共享身份后，准备从真实付款线程、合同附件、联系人网络或项目记录中选择下一步目标与借口的场景。它特别适合后续行动依赖既有信任关系和精确业务语境，而外部接收方无法看到账户内部准备活动的环境。
      en: This child applies after an adversary takes over an enterprise mailbox, supplier collaboration account, or file-sharing
        identity and prepares to select the next target and pretext from genuine payment threads, contract attachments, contact
        networks, or project records. It especially suits later operations that depend on established trust and precise business
        context where external recipients cannot see preparation inside the account.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够访问账户历史对象并理解足够的组织与业务语义，以区分有价值关系和普通内容。其成本包括避免触发批量访问、数据防泄漏和异常会话控制，维持访问直到完成筛选，以及在历史陈旧、权限受限或内容加密时接受不完整情境。
        en: The adversary needs access to historical account objects and enough organizational and business understanding
          to distinguish valuable relationships from ordinary content. Costs include avoiding bulk-access, data-loss-prevention,
          and anomalous-session controls, retaining access through selection, and accepting incomplete context when history
          is stale, privileges are limited, or content is encrypted.
    defender_model:
      paragraphs:
      - zh: 防守方假设服务或租户至少保留登录、会话和部分对象访问记录，并能把邮件、联系人、文件或线程与后续收件人和操作关联。外部目标通常看不到这些记录；若提供方不记录搜索条件或读取事件，防守只能从异常会话、内容访问量和后续用途进行条件推断。
        en: The defender is assumed to retain sign-in, session, and at least some object-access records and to correlate mail,
          contacts, files, or threads with later recipients and actions. External targets usually lack these records; if the
          provider does not log search terms or reads, defense can only infer conditionally from anomalous sessions, access
          volume, and downstream use.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 以真实账户历史选择后续关系和业务语境，使外部交互在内容与关系特征上接近既有合法活动
    en: Select later relationships and business context from genuine account history so external interactions resemble established
      legitimate activity in content and relationship features
  analysis:
    paragraphs:
    - zh: 攻击者先读取真实邮件、联系人、文件或线程，再选择与后续目标对应的关系、术语和业务主题。行为设计把原本需要编造的身份背景替换为账户中已经存在的真实情境；目标看到的收件关系、话术和引用因此更接近合法历史，基于陌生联系人、语义不一致或错误业务事实的分类信号减弱。对象级历史访问和会话变化仍为防守提供准备阶段证据。
      en: The adversary first reads genuine mail, contacts, files, or threads and then selects relationships, terminology,
        and business topics matching a later target. This design replaces a fabricated identity background with authentic
        context already present in the account; recipient relationships, wording, and references therefore more closely match
        legitimate history, weakening classification signals based on unfamiliar contacts, semantic inconsistency, or incorrect
        business facts. Object-level history access and session changes still provide preparation-stage evidence.
  evidence_refs:
  - REF-000067
  - REF-000068
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 将关系情境采集保留在服务提供方和原租户内部，使外部目标只看到经过真实历史支撑的最终交互
    en: Keep relationship-context collection inside the provider and original tenant so external targets see only the final
      interaction supported by genuine history
  analysis:
    paragraphs:
    - zh: 历史检索发生在被接管账户内部，而后续目标通常只接收最终消息或请求。行为设计让关键准备事件进入提供方或原租户的内容审计，却不出现在外部目标的可见时间线；外部防守因此无法从自身记录解释攻击者如何获得准确关系情境。跨租户事件共享或事后联合调查可以连接内部检索与外部使用，但缺少这种协作时观察边界显著提高重构成本。
      en: History retrieval occurs inside the taken-over account while a later target normally receives only the final message
        or request. This design places the key preparation event in provider or original-tenant content audit and outside
        the external target's visible timeline; external defense therefore cannot explain from its own records how the adversary
        obtained accurate relationship context. Cross-tenant event sharing or joint post-incident investigation can connect
        internal retrieval with external use, but without that coordination the observation boundary materially raises reconstruction
        cost.
  evidence_refs:
  - REF-000067
  - REF-000068
  confidence: high
