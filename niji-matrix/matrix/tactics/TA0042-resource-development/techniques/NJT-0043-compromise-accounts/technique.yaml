research:
  limitations:
    paragraphs:
    - zh: 公开材料通常从账户接管后的可见结果回溯准备过程，服务提供方拥有的完整令牌、设备和对象级审计很少公开，因此不同操作者是否有意利用每一项真实账户特征有时只能从行为序列推断。真实账户的合法恢复、共享使用和角色交接也会产生相似会话与历史访问，不能把账户真实性反向当作恶意或安全证明。
      en: Public reporting usually reconstructs preparation from visible results after account takeover, while complete provider-held
        token, device, and object-level audit is rarely public, so deliberate use of every authentic account feature by a
        different operator sometimes remains inferred from sequence. Legitimate recovery, shared use, and role handover also
        produce similar session and history access, so account authenticity proves neither maliciousness nor safety.
    - zh: 现有案例对邮件与协作账户支持最强，对社交、开发者和其他 SaaS 账户在准备阶段的细粒度证据较弱。未来证据应分别证明账户已被接管、准备行为发生在首次对外用途前、历史或关系确实被消费，以及外部目标与提供方分别能看到哪些痕迹。
      en: Existing cases most strongly support mail and collaboration accounts, with weaker fine-grained preparation evidence
        for social, developer, and other SaaS accounts. Future evidence should separately establish takeover, preparation
        before first outward use, actual consumption of history or relationships, and the traces visible to external targets
        versus providers.
