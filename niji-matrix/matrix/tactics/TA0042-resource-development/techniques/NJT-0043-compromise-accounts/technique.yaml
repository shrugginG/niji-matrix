schema_version: 2.0.0
type: technique
id: NJT-0043
name:
  zh: 攻陷账户
  en: Compromise Accounts
summary:
  zh: 将被接管且继承真实身份、域、年龄、权限、关系与历史的既有服务账户准备为后续行动资源，并利用其可信特征降低账户实体和业务情境的异常度。
  en: Prepare taken-over service accounts that inherit authentic identity, domain, age, privilege, relationships, and history
    as resources for later operations, using those trusted features to reduce account-entity and business-context anomaly.
aliases:
- Prepare Taken-Over Accounts
classification:
  tactic_refs:
  - TA0042
  origin:
    kind: attack-retained
    source_attack_id: T1586
    source_attack_version: '19.1'
  decision_ref: DEC-TA0042-T1586
definition_and_concept:
  paragraphs:
  - zh: 攻陷账户是攻击者在资源准备阶段，将已经被接管的邮件、社交、协作、云或其他服务账户整理为后续行动可用资源的技术。直接行为包括确认账户仍可用、理解其权限和关系、检查历史内容与业务语境，以及在首次对外行动前维持账户状态；其直接目的不是完成账户接管，而是把既有真实主体积累的身份属性转化为行动资源。
    en: Compromise Accounts is a Resource Development technique in which an adversary prepares already taken-over mail, social,
      collaboration, cloud, or other service accounts for later operations. Direct behavior includes confirming continued
      usability, understanding privileges and relationships, examining historical content and business context, and preserving
      account state before first outward action; the immediate purpose is not to perform takeover but to convert identity
      properties accumulated by a genuine subject into an operational resource.
  - zh: 本技术的概念边界由“真实既有账户的准备”确定，而不由账户产品或服务类别确定。账户原有域、年龄、联系人、业务线程和信誉可以服务于后续冒充、投递、访问或欺诈，但这些后续使用仍属于相应战术；只有在账户被接管后、首次对外使用前发生的资源准备活动属于本技术。
    en: The concept is delimited by preparation of a genuine existing account rather than by account product or service category.
      The account's established domain, age, contacts, business threads, and reputation may support later impersonation, delivery,
      access, or fraud, but those downstream uses remain under their respective tactics; this technique ends with resource
      preparation after takeover and before first outward use.
stealth_characteristics:
  paragraphs:
  - zh: 攻陷账户保留真实主体已经形成的身份、域、账户年龄、权限、关系图和历史内容，使后续行动不必从一个全新或明显虚构的账户开始。目标或外部接收方可能只看到熟悉的发件域、既有联系人关系与正常账户外观，因此基于新账户、陌生域或首次接触的粗粒度筛选能力下降。
    en: Compromise Accounts preserves identity, domain, account age, privilege, relationship graphs, and historical content
      created by a genuine subject, so later activity need not begin from a new or visibly fabricated account. A target or
      external recipient may see only a familiar sending domain, existing contact relationship, and normal account appearance,
      weakening coarse filters based on new accounts, unfamiliar domains, or first contact.
  - zh: 匿迹效果不表示账户准备无痕。服务提供方和原租户仍可能观察到异常登录、令牌与设备变化、恢复属性修改、邮件或文件历史检索、转发规则和权限变化；当这些痕迹得到长期保留并与首次对外用途关联时，真实账户外观不能消除操作者变化。
    en: The stealth effect does not make account preparation traceless. Service providers and original tenants may still observe
      anomalous sign-ins, token and device changes, recovery-attribute modification, mail or file history access, forwarding
      rules, and privilege changes; when these traces are retained and correlated with first outward use, authentic account
      appearance does not erase the operator transition.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击者已控制既有账户后，为后续行动确认可用性、保留会话、理解权限和关系、检索历史内容以及选择真实业务情境的活动。纳入判定要求账户确实继承真实主体的历史和关系，且行为发生在首次对外发送、登录目标、投递或其他下游操作之前。
    en: This technique includes confirming usability, preserving sessions, understanding privileges and relationships, retrieving
      historical content, and selecting genuine business context after the adversary already controls an existing account
      for later operations. Inclusion requires an account that truly inherits a genuine subject's history and relationships
      and behavior occurring before first outward sending, victim logon, delivery, or another downstream action.
  - zh: 获取账户控制权的钓鱼、凭据窃取或利用步骤不在本技术内；新建并培育行动账户属于 T1585 候选，购买特定目标系统入口属于 T1650 候选，发送邮件、登录目标和删除痕迹属于相应后续技术。合法账户恢复、员工交接、合规审计或日常历史搜索可能产生相似痕迹，不能仅凭一次登录或一次内容访问认定本技术。
    en: Phishing, credential theft, or exploitation that obtains account control is outside this technique; creating and cultivating
      an operational account belongs to the T1585 candidate, purchasing target-specific system access to the T1650 candidate,
      and sending mail, logging into a victim, or deleting traces to corresponding downstream techniques. Legitimate account
      recovery, employee handover, compliance audit, or routine history search can produce similar traces and must not be
      classified as this technique from one sign-in or content access alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术常用于攻击者已经取得员工、供应商、合作伙伴、运输物流、财务或云服务账户，并准备利用该账户开展后续 BEC、社会工程、文件访问、投递或可信关系滥用的场景。攻击者在首次对外行动前检查真实业务线程、联系人、附件、共享文件和权限，以选择最可信且最有价值的行动路径。
      en: This technique commonly applies after an adversary obtains an employee, supplier, partner, transport and logistics,
        finance, or cloud-service account and prepares it for later business-email compromise, social engineering, file access,
        delivery, or abuse of trusted relationships. Before first outward action, the adversary examines genuine business
        threads, contacts, attachments, shared files, and privileges to choose the most credible and valuable path.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须已经控制可用的既有服务账户，并能够在不立即触发失效的情况下访问其会话、历史内容或权限信息。更强的实现需要维持令牌或设备状态、理解组织业务语境并约束准备动作的速度和范围；攻击者受账户所有者活动、条件访问、对象级审计、令牌撤销和服务保留策略限制。
        en: The adversary must already control a usable existing service account and be able to access its session, historical
          content, or privilege information without immediately losing access. Stronger implementations require preserving
          token or device state, understanding organizational business context, and constraining the speed and scope of preparation;
          owner activity, conditional access, object-level audit, token revocation, and service retention policies limit the
          adversary.
    defender_model:
      paragraphs:
      - zh: 防守方模型区分外部接收方、原租户和服务提供方。外部接收方往往只能看到真实域和既有关系，原租户与提供方则可能拥有登录、令牌、设备、恢复、内容访问、规则和权限记录；若对象级访问日志缺失、保留期很短或账户由多人共享，防守方难以把准备动作与后续用途归于同一操作者。
        en: The defender model separates external recipients, the original tenant, and the service provider. External recipients
          often see only an authentic domain and existing relationship, while the tenant and provider may hold sign-in, token,
          device, recovery, content-access, rule, and privilege records; missing object-level audit, short retention, or shared
          accounts make it difficult to attribute preparation and downstream use to one operator.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 继承真实账户的身份、域、年龄、权限与关系特征，使后续行动实体接近既有合法主体
    en: Inherit authentic account identity, domain, age, privilege, and relationship features so the later operational entity
      resembles an established legitimate subject
  analysis:
    paragraphs:
    - zh: 攻击者以被接管的真实账户作为后续资源，而不是创建一个没有历史的新身份。行为设计保留账户原有域、年龄、联系人、线程和权限，使目标看到的实体特征由攻击者新建痕迹变为真实主体长期积累的合法外观；基于账户新旧、域信誉和关系存在性的分类因此降低区分力，恶意操作者更容易混入既有业务活动。服务商侧会话与完整性记录仍可揭示控制者变化，所以该机理改变可见特征而不消除痕迹。
      en: The adversary uses a taken-over genuine account as the later resource instead of creating an identity without history.
        This design preserves the account's domain, age, contacts, threads, and privileges, changing the visible entity from
        adversary-created traces to the legitimate appearance accumulated by a real subject; classification based on account
        novelty, domain reputation, and relationship existence therefore loses discriminating power, allowing the malicious
        operator to blend into established business activity. Provider-side session and integrity records can still reveal
        the control change, so the mechanism alters visible features rather than eliminating traces.
  evidence_refs:
  - REF-000060
  - REF-000067
  - REF-000068
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 将准备活动保留在第三方账户与服务内部，使后续目标通常看不到接管后的历史检索和会话变化
    en: Keep preparation inside a third-party account and service so later targets usually cannot see post-takeover history
      access and session changes
  analysis:
    paragraphs:
    - zh: 攻击者在真实账户内部确认权限、读取历史并选择关系情境，随后才面向外部目标行动。行为设计把关键准备动作置于原租户或服务提供方的身份与内容审计面，而外部目标通常只看到最终真实账户发出的交互；目标侧缺少接管与准备序列，因而难以理解可信消息或访问的形成过程。若提供方审计、租户调查和外部事件能够跨组织关联，这一观察边界可以被恢复。
      en: The adversary confirms privileges, reads history, and selects relationship context inside the genuine account before
        acting toward an external target. This design places key preparation in the identity and content audit plane of the
        original tenant or provider, while the external target usually sees only the final interaction from an authentic account;
        the target lacks the takeover and preparation sequence and therefore has difficulty understanding how the trusted
        message or access was formed. Provider audit, tenant investigation, and external events can recover this observation
        boundary when correlated across organizations.
  evidence_refs:
  - REF-000067
  - REF-000068
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立一项匿迹子技术“账户历史导向的关系情境选择”。其稳定变量是在首次对外行动前，攻击者是否从真实账户历史中主动检索并选择具体关系、主题或业务线程；这会产生对象级历史访问痕迹，并使后续用途获得真实情境，而不仅是父级账户实体的信誉继承。
      en: This technique defines one evasion sub-technique, Account-History-Guided Relationship Context Selection. Its stable
        variable is whether the adversary actively retrieves and selects a specific relationship, topic, or business thread
        from genuine account history before first outward action; this creates object-level history-access traces and supplies
        authentic context to later use beyond the parent's inheritance of account-entity reputation.
    - zh: 账户类型、服务产品、被接管方式和后续用途均不构成子技术。单纯维持真实账户身份与信誉属于父级行为，令牌窃取与账户接管属于前置行为，线程回复、发送和痕迹抑制属于下游行为；这些行为不会形成第二个具有独立防御差异的兄弟项。
      en: Account type, service product, takeover method, and downstream use do not constitute children. Merely preserving
        authentic account identity and reputation belongs to the parent behavior, token theft and account takeover are preceding
        behavior, and thread reply, sending, and trace suppression are downstream. These behaviors do not form a second sibling
        with an independent defensive distinction.
  coverage: established
  subtechnique_refs:
  - NJS-0043-001
