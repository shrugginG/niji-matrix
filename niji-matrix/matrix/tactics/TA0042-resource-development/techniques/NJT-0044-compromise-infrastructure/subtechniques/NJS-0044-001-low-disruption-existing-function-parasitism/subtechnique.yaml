schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0044-001
parent_ref: NJT-0044
name:
  zh: 低扰动既有功能寄生
  en: Low-Disruption Existing-Function Parasitism
summary:
  zh: 保留被攻陷资产的正常功能和信誉，同时叠加恶意代理、托管或中转功能。
  en: Preserve the compromised asset's normal function and reputation while overlaying malicious proxying, hosting, or relay function.
aliases:
- Compromised Trust-Surface Inheritance
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 保留被攻陷资产的正常功能和信誉，同时叠加恶意代理、托管或中转功能。其直接目标是让恶意功能继承真实资产外观并减少所有者异常，实现原则是最小化对既有服务、端口、证书和用户流量的破坏，只叠加必要功能；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Preserve the compromised asset's normal function and reputation while overlaying malicious proxying, hosting, or relay function. Its direct objective is to make malicious function
      inherit a real asset's appearance and reduce owner-visible anomaly, and its operating principle is to minimize disruption to existing service, ports, certificates, and user traffic
      while adding only necessary function; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 低扰动既有功能寄生使专用恶意节点变为正常资产上的附加功能。对防守方的观察影响是目标按所有权和信誉误分类，所有者仅在完整性/流量关联后发现异常；与此同时，配置异常但服务可用、正常流量中出现代理/托管行为仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Low-Disruption Existing-Function Parasitism changes traces so that a dedicated malicious node becomes an added function on a normal asset. The defender-observation effect is
      that victims misclassify by ownership and reputation; owners detect anomaly only through integrity and traffic correlation; at the same time, configuration anomaly while service
      remains available and proxy or hosting behavior inside normal traffic remain recoverable residual traces, and observers with finer telemetry or longer retention can limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入正常功能与恶意功能并存、继承真实域/证书/网络信誉，排除关闭原服务后完全替换、后续代理或 C2 会话本身。其兄弟边界是：NJS-0044-002 在大量被攻陷节点间轮换出口；本子技术在单个资产上低扰动寄生；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes coexistence of normal and malicious function and inheritance of real domain/certificate/network reputation and excludes complete replacement after shutting
      down original service and downstream proxy or C2 sessions. Its sibling boundary is that NJS-0044-002 rotates egress across many compromised nodes; this child parasitizes one asset
      with low disruption; inclusion requires adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility,
      or ordinary content and account activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 Web/云服务、服务器、DNS 和边缘设备 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。配置异常但服务可用、正常流量中出现代理/托管行为可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in web/cloud services, servers, DNS, and edge devices and wants to change traces visible to victims, platforms,
        or analysts before first high-risk use. Configuration anomaly while service remains available and proxy or hosting behavior inside normal traffic may appear during preparation
        or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：被攻陷资产仍可正常服务。实施者还需持续控制用于最小化对既有服务、端口、证书和用户流量的破坏，只叠加必要功能的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: the compromised asset can continue normal service. The operator also needs sustained control of the configuration,
          timing, build, account, or third-party resources used to minimize disruption to existing service, ports, certificates, and user traffic while adding only necessary function.
          Resource loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到配置异常但服务可用、正常流量中出现代理/托管行为；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see configuration anomaly while service remains available and proxy or hosting behavior inside normal traffic; reliable identification requires
          authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 恶意功能借用真实资产的所有权、信誉和正常流量特征
    en: Malicious function borrows a real asset's ownership, reputation, and normal traffic features
  analysis:
    paragraphs:
    - zh: 恶意功能借用真实资产的所有权、信誉和正常流量特征。攻击者通过最小化对既有服务、端口、证书和用户流量的破坏，只叠加必要功能改变痕迹，使专用恶意节点变为正常资产上的附加功能；目标按所有权和信誉误分类，所有者仅在完整性/流量关联后发现异常。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Malicious function borrows a real asset''s ownership, reputation, and normal traffic features. The adversary changes traces through this operating principle: Minimize disruption
        to existing service, ports, certificates, and user traffic while adding only necessary function. As a result, a dedicated malicious node becomes an added function on a normal
        asset; victims misclassify by ownership and reputation; owners detect anomaly only through integrity and traffic correlation. The design substitutes normal or trusted features
        for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise effect.'
  evidence_refs:
  - REF-000061
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 低扰动叠加可能绕过只监测可用性而不监测完整性的所有者控制
    en: A low-disruption overlay may bypass owner controls that monitor availability but not integrity
  analysis:
    paragraphs:
    - zh: 低扰动叠加可能绕过只监测可用性而不监测完整性的所有者控制。攻击者通过最小化对既有服务、端口、证书和用户流量的破坏，只叠加必要功能改变痕迹，使专用恶意节点变为正常资产上的附加功能；目标按所有权和信誉误分类，所有者仅在完整性/流量关联后发现异常。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
      en: 'A low-disruption overlay may bypass owner controls that monitor availability but not integrity. The adversary changes traces through this operating principle: Minimize disruption
        to existing service, ports, certificates, and user traffic while adding only necessary function. As a result, a dedicated malicious node becomes an added function on a normal
        asset; victims misclassify by ownership and reputation; owners detect anomaly only through integrity and traffic correlation. The design makes critical activity appear blank,
        low-signal, or normal under an existing observation model, preventing its analytic logic from firing; broader vantage or changed analysis conditions can still recover the difference,
        producing a Behavioral Transparency effect.'
  evidence_refs:
  - REF-000061
  confidence: medium
