research:
  limitations:
    paragraphs:
    - zh: 公开证据能够支持本子技术的稳定变量和所列痕迹变化，但不保证每个SOHO 路由器、摄像机、DVR、NAS 与边缘出口实例都具有相同匿迹意图或效果。租用住宅代理、单一节点寄生、后续代理协议可能产生局部相似现象，且提供方内部数据通常不公开；置信度应随直接准备证据、跨视角复现和正常基线的可得性调整。
      en: Public evidence supports this child's stable variable and stated trace change but does not establish identical stealth intent or effect in every instance of SOHO routers, cameras,
        dVRs, NAS devices, and edge egress. rented residential proxies, single-node parasitism, and downstream proxy protocol can produce locally similar effects, and provider-internal
        data is often unavailable; confidence should vary with direct preparation evidence, cross-vantage reproduction, and availability of a legitimate baseline.
