schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0044-002
parent_ref: NJT-0044
name:
  zh: 被攻陷边缘出口池轮换
  en: Rotating Compromised-Edge Egress Pool
summary:
  zh: 在大量被攻陷住宅、SOHO 或边缘设备间轮换出口，使目标看到短寿命合法接入网来源。
  en: Rotate egress across many compromised residential, SOHO, or edge devices so victims see short-lived legitimate-access-network origins.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 在大量被攻陷住宅、SOHO 或边缘设备间轮换出口，使目标看到短寿命合法接入网来源。其直接目标是降低来源地理、IOC 和操作者归因信号可靠性，实现原则是控制大规模第三方节点并按时段或目标轮换出口；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Rotate egress across many compromised residential, SOHO, or edge devices so victims see short-lived legitimate-access-network origins. Its direct objective is to reduce reliability
      of source geography, ioc, and operator-attribution signals, and its operating principle is to control a large third-party node pool and rotate egress by time or target; this boundary
      describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 被攻陷边缘出口池轮换使稳定操作者出口变为大量合法网络中的轮换短寿 IP。对防守方的观察影响是地理和单点信誉规则失效，需跨节点证书、协议、目标与时间关联；与此同时，短寿住宅来源、多节点共享协议/目标、设备配置异常仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Rotating Compromised-Edge Egress Pool changes traces so that stable operator egress becomes rotating short-lived ips across legitimate networks. The defender-observation effect
      is that geography and point-reputation rules weaken, requiring cross-node certificate, protocol, target, and time correlation; at the same time, short-lived residential origins,
      shared protocol or targets across nodes, and device configuration anomalies remain recoverable residual traces, and observers with finer telemetry or longer retention can limit
      the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入被攻陷住宅/SOHO/边缘节点池、多节点轮换出口，排除租用住宅代理、单一节点寄生、后续代理协议。其兄弟边界是：NJS-0044-001 在单个资产保留正常功能；本子技术以被攻陷节点池轮换为变量；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes compromised residential/SOHO/edge node pools and multi-node rotating egress and excludes rented residential proxies, single-node parasitism, and downstream
      proxy protocol. Its sibling boundary is that NJS-0044-001 preserves normal function on one asset; this child is defined by rotation across a compromised node pool; inclusion requires
      adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary content and account
      activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 SOHO 路由器、摄像机、DVR、NAS 与边缘出口 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。短寿住宅来源、多节点共享协议/目标、设备配置异常可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in SOHO routers, cameras, dVRs, NAS devices, and edge egress and wants to change traces visible to victims,
        platforms, or analysts before first high-risk use. Short-lived residential origins, shared protocol or targets across nodes, and device configuration anomalies may appear during
        preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：攻击者控制足量边缘设备。实施者还需持续控制用于控制大规模第三方节点并按时段或目标轮换出口的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: the adversary controls enough edge devices. The operator also needs sustained control of the configuration, timing,
          build, account, or third-party resources used to control a large third-party node pool and rotate egress by time or target. Resource loss, provider enforcement, cost, artifact
          reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到短寿住宅来源、多节点共享协议/目标、设备配置异常；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see short-lived residential origins, shared protocol or targets across nodes, and device configuration anomalies; reliable identification requires
          authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 目标看到住宅或企业接入网中的合法设备 IP，而不是真实操作者来源
    en: The victim sees legitimate device IPs in residential or enterprise access networks rather than the real operator origin
  analysis:
    paragraphs:
    - zh: 目标看到住宅或企业接入网中的合法设备 IP，而不是真实操作者来源。攻击者通过控制大规模第三方节点并按时段或目标轮换出口改变痕迹，使稳定操作者出口变为大量合法网络中的轮换短寿 IP；地理和单点信誉规则失效，需跨节点证书、协议、目标与时间关联。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'The victim sees legitimate device IPs in residential or enterprise access networks rather than the real operator origin. The adversary changes traces through this operating
        principle: Control a large third-party node pool and rotate egress by time or target. As a result, stable operator egress becomes rotating short-lived IPs across legitimate networks;
        geography and point-reputation rules weaken, requiring cross-node certificate, protocol, target, and time correlation. The design substitutes normal or trusted features for conspicuous
        operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise effect.'
  evidence_refs:
  - REF-000073
  - REF-000074
  - REF-000075
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 来源在大量短寿节点间分散，单节点历史不足以恢复整体行动
    en: Origin disperses across many short-lived nodes, leaving one node's history insufficient to reconstruct the operation
  analysis:
    paragraphs:
    - zh: 来源在大量短寿节点间分散，单节点历史不足以恢复整体行动。攻击者通过控制大规模第三方节点并按时段或目标轮换出口改变痕迹，使稳定操作者出口变为大量合法网络中的轮换短寿 IP；地理和单点信誉规则失效，需跨节点证书、协议、目标与时间关联。该设计把同一行动痕迹分散到多个时间或空间单元，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
      en: 'Origin disperses across many short-lived nodes, leaving one node''s history insufficient to reconstruct the operation. The adversary changes traces through this operating
        principle: Control a large third-party node pool and rotate egress by time or target. As a result, stable operator egress becomes rotating short-lived IPs across legitimate networks;
        geography and point-reputation rules weaken, requiring cross-node certificate, protocol, target, and time correlation. The design distributes traces of one operation across temporal
        or spatial units so short windows and point indicators see only fragments; defenders must rebuild shared lineage across units, producing a Spatiotemporal Trace Dilution effect.'
  evidence_refs:
  - REF-000075
  confidence: high
