schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0045-001
parent_ref: NJT-0045
name:
  zh: 观测感知式能力门控
  en: Observation-Aware Capability Gating
summary:
  zh: 在研发时把分析工具、环境或目标配置条件写入能力，使非目标环境不激活或缩减行为。
  en: Encode analysis-tool, environment, or target-configuration conditions during development so behavior does not activate or is reduced outside intended targets.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 在研发时把分析工具、环境或目标配置条件写入能力，使非目标环境不激活或缩减行为。其直接目标是减少分析环境中的高信号行为和有效样本，实现原则是构建条件检查与替代执行路径，仅在匹配环境显示完整能力；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Encode analysis-tool, environment, or target-configuration conditions during development so behavior does not activate or is reduced outside intended targets. Its direct objective
      is to reduce high-signal behavior and effective samples in analysis environments, and its operating principle is to build condition checks and alternate execution paths that expose
      full capability only in matching environments; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 观测感知式能力门控使一个能力在不同观察环境呈现完整、缩减或空白行为。对防守方的观察影响是单一沙箱结果漏掉有效路径，必须进行多环境差分与静态条件分析；与此同时，环境依赖分支、沙箱中缩减行为、目标配置匹配后激活仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Observation-Aware Capability Gating changes traces so that one capability presents full, reduced, or blank behavior across observation environments. The defender-observation
      effect is that one sandbox result misses the effective path, requiring multi-environment differential and static condition analysis; at the same time, environment-dependent branches,
      reduced sandbox behavior, and activation after target-configuration match remain recoverable residual traces, and observers with finer telemetry or longer retention can limit the
      effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入开发阶段嵌入门控逻辑、目标/沙箱/工具条件，排除运行时检查事件本身、普通兼容性检测。其兄弟边界是：NJS-0045-002 改变不同构建的可见特征；本子技术控制同一能力何时激活；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes development-time gating logic and target/sandbox/tool conditions and excludes the runtime check event itself and ordinary compatibility detection. Its sibling
      boundary is that NJS-0045-002 changes visible features across builds; this child controls when one capability activates; inclusion requires adversary control of the stable variable
      and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary content and account activity do not establish classification
      alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 构建、测试、沙箱和目标运行环境 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。环境依赖分支、沙箱中缩减行为、目标配置匹配后激活可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in build, test, sandbox, and target runtime environments and wants to change traces visible to victims,
        platforms, or analysts before first high-risk use. Environment-dependent branches, reduced sandbox behavior, and activation after target-configuration match may appear during
        preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：研发方知道可判定的环境条件。实施者还需持续控制用于构建条件检查与替代执行路径，仅在匹配环境显示完整能力的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: the developer knows testable environment conditions. The operator also needs sustained control of the configuration,
          timing, build, account, or third-party resources used to build condition checks and alternate execution paths that expose full capability only in matching environments. Resource
          loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到环境依赖分支、沙箱中缩减行为、目标配置匹配后激活；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see environment-dependent branches, reduced sandbox behavior, and activation after target-configuration match; reliable identification requires
          authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 非目标或分析环境不呈现关键行为，使自动分析不触发既有逻辑
    en: Non-target or analysis environments do not expose critical behavior, preventing existing automated logic from triggering
  analysis:
    paragraphs:
    - zh: 非目标或分析环境不呈现关键行为，使自动分析不触发既有逻辑。攻击者通过构建条件检查与替代执行路径，仅在匹配环境显示完整能力改变痕迹，使一个能力在不同观察环境呈现完整、缩减或空白行为；单一沙箱结果漏掉有效路径，必须进行多环境差分与静态条件分析。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
      en: 'Non-target or analysis environments do not expose critical behavior, preventing existing automated logic from triggering. The adversary changes traces through this operating
        principle: Build condition checks and alternate execution paths that expose full capability only in matching environments. As a result, one capability presents full, reduced,
        or blank behavior across observation environments; one sandbox result misses the effective path, requiring multi-environment differential and static condition analysis. The design
        makes critical activity appear blank, low-signal, or normal under an existing observation model, preventing its analytic logic from firing; broader vantage or changed analysis
        conditions can still recover the difference, producing a Behavioral Transparency effect.'
  evidence_refs:
  - REF-000014
  - REF-000062
  confidence: medium
