schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0045-002
parent_ref: NJT-0045
name:
  zh: 构建多样化与谱系抑制
  en: Build Diversification and Lineage Suppression
summary:
  zh: 按目标或行动改变配置、编译产物和可见调试特征，缩短静态 IOC 的复用范围。
  en: Vary configuration, build artifacts, and visible debug features by target or operation to shorten reuse of static IOCs.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 按目标或行动改变配置、编译产物和可见调试特征，缩短静态 IOC 的复用范围。其直接目标是分散哈希与配置特征并增加跨样本关联成本，实现原则是在构建系统中注入目标化配置或变体参数，同时复用核心代码；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Vary configuration, build artifacts, and visible debug features by target or operation to shorten reuse of static IOCs. Its direct objective is to disperse hash and configuration
      features and raise cross-sample correlation cost, and its operating principle is to inject target-specific configuration or variation parameters during build while reusing core
      code; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 构建多样化与谱系抑制使单一稳定产物变为共享核心但配置和哈希不同的构建集合。对防守方的观察影响是精确 IOC 覆盖缩短，需代码族、编译和配置谱系分析；与此同时，相近编译时间、不同硬编码目标、共享代码段、变化哈希仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Build Diversification and Lineage Suppression changes traces so that one stable artifact becomes a set of builds sharing core code but differing in configuration and hash. The
      defender-observation effect is that exact-ioc coverage shortens, requiring code-family, compilation, and configuration lineage analysis; at the same time, close compilation times,
      different hard-coded targets, shared code sections, and changing hashes remain recoverable residual traces, and observers with finer telemetry or longer retention can limit the
      effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入目标化配置构建、每行动产物变化，排除运行时多态本身、普通版本升级、完全不同工具。其兄弟边界是：NJS-0045-001 控制何时激活；本子技术控制构建产物间可见差异；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes target-specific configured builds and per-operation artifact variation and excludes runtime polymorphism itself, ordinary version upgrades, and completely
      different tools. Its sibling boundary is that NJS-0045-001 controls when behavior activates; this child controls visible differences among builds; inclusion requires adversary
      control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary content and account activity
      do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 构建系统、CI/CD、配置生成与样本仓库 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。相近编译时间、不同硬编码目标、共享代码段、变化哈希可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in build systems, CI/CD, configuration generation, and sample repositories and wants to change traces visible
        to victims, platforms, or analysts before first high-risk use. Close compilation times, different hard-coded targets, shared code sections, and changing hashes may appear during
        preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：攻击者控制构建流程和目标配置。实施者还需持续控制用于在构建系统中注入目标化配置或变体参数，同时复用核心代码的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: the adversary controls build process and target configuration. The operator also needs sustained control of the configuration,
          timing, build, account, or third-party resources used to inject target-specific configuration or variation parameters during build while reusing core code. Resource loss, provider
          enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到相近编译时间、不同硬编码目标、共享代码段、变化哈希；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see close compilation times, different hard-coded targets, shared code sections, and changing hashes; reliable identification requires authorized
          correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 每个产物重塑哈希、配置和调试特征，使固定恶意特征难以复用
    en: Each artifact reshapes hash, configuration, and debug features, limiting reuse of fixed malicious signatures
  analysis:
    paragraphs:
    - zh: 每个产物重塑哈希、配置和调试特征，使固定恶意特征难以复用。攻击者通过在构建系统中注入目标化配置或变体参数，同时复用核心代码改变痕迹，使单一稳定产物变为共享核心但配置和哈希不同的构建集合；精确 IOC 覆盖缩短，需代码族、编译和配置谱系分析。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Each artifact reshapes hash, configuration, and debug features, limiting reuse of fixed malicious signatures. The adversary changes traces through this operating principle:
        Inject target-specific configuration or variation parameters during build while reusing core code. As a result, one stable artifact becomes a set of builds sharing core code
        but differing in configuration and hash; exact-IOC coverage shortens, requiring code-family, compilation, and configuration lineage analysis. The design substitutes normal or
        trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature
        Disguise effect.'
  evidence_refs:
  - REF-000062
  - REF-000076
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 同一代码族的痕迹分散到多个短寿构建，增加跨样本重构要求
    en: One code family's traces disperse across short-lived builds, increasing cross-sample reconstruction requirements
  analysis:
    paragraphs:
    - zh: 同一代码族的痕迹分散到多个短寿构建，增加跨样本重构要求。攻击者通过在构建系统中注入目标化配置或变体参数，同时复用核心代码改变痕迹，使单一稳定产物变为共享核心但配置和哈希不同的构建集合；精确 IOC 覆盖缩短，需代码族、编译和配置谱系分析。该设计把同一行动痕迹分散到多个时间或空间单元，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
      en: 'One code family''s traces disperse across short-lived builds, increasing cross-sample reconstruction requirements. The adversary changes traces through this operating principle:
        Inject target-specific configuration or variation parameters during build while reusing core code. As a result, one stable artifact becomes a set of builds sharing core code
        but differing in configuration and hash; exact-IOC coverage shortens, requiring code-family, compilation, and configuration lineage analysis. The design distributes traces of
        one operation across temporal or spatial units so short windows and point indicators see only fragments; defenders must rebuild shared lineage across units, producing a Spatiotemporal
        Trace Dilution effect.'
  evidence_refs:
  - REF-000076
  confidence: medium
