schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0046-001
parent_ref: NJT-0046
name:
  zh: 时间培育的正常历史
  en: Time-Cultivated Benign History
summary:
  zh: 在高风险接触前长期播种低风险内容、互动和关系，使账户积累年龄与连续历史。
  en: Seed low-risk content, interactions, and relationships over time before high-risk contact so the account accumulates age and continuous history.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 在高风险接触前长期播种低风险内容、互动和关系，使账户积累年龄与连续历史。其直接目标是降低新账户、稀疏画像和首次接触异常，实现原则是在行动前较长时间维持低风险、角色一致的公开活动与关系；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Seed low-risk content, interactions, and relationships over time before high-risk contact so the account accumulates age and continuous history. Its direct objective is to reduce
      new-account, sparse-profile, and first-contact anomalies, and its operating principle is to maintain low-risk, role-consistent public activity and relationships for an extended
      pre-operation period; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 时间培育的正常历史使新鲜稀疏账户变为具有长期内容和关系的账户。对防守方的观察影响是新账户规则和首次接触信号失效，需关联注册与长期行为来源；与此同时，低风险内容序列、关系增长、后续用途突变仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Time-Cultivated Benign History changes traces so that a fresh sparse account becomes one with long-term content and relationships. The defender-observation effect is that new-account
      rules and first-contact signals weaken, requiring registration and long-term provenance correlation; at the same time, low-risk content sequence, relationship growth, and later
      use change remain recoverable residual traces, and observers with finer telemetry or longer retention can limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入长期低风险活动、逐步关系建立、高风险用途前完成培育，排除下游多轮诱导、接管真实账户、单纯等待账户变老。其兄弟边界是：NJS-0046-002 通过独立平台相互背书；本子技术通过时间和连续活动培育；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes long low-risk activity, gradual relationship building, and cultivation completed before high-risk use and excludes downstream multi-turn elicitation, takeover
      of a real account, and passive waiting without cultivation. Its sibling boundary is that NJS-0046-002 uses independent platforms to backstop one another; this child cultivates
      through time and continuous activity; inclusion requires adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration,
      compatibility, or ordinary content and account activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 社交、论坛、邮箱和开发者平台 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。低风险内容序列、关系增长、后续用途突变可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in social, forum, email, and developer platforms and wants to change traces visible to victims, platforms,
        or analysts before first high-risk use. Low-risk content sequence, relationship growth, and later use change may appear during preparation or after correlation with downstream
        use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：攻击者能长期维持账户。实施者还需持续控制用于在行动前较长时间维持低风险、角色一致的公开活动与关系的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: the adversary can maintain the account over time. The operator also needs sustained control of the configuration,
          timing, build, account, or third-party resources used to maintain low-risk, role-consistent public activity and relationships for an extended pre-operation period. Resource
          loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到低风险内容序列、关系增长、后续用途突变；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see low-risk content sequence, relationship growth, and later use change; reliable identification requires authorized correlation across those
          vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 连续正常历史使虚构账户在年龄、内容和关系上接近真实用户
    en: Continuous benign history makes a fabricated account resemble a real user in age, content, and relationships
  analysis:
    paragraphs:
    - zh: 连续正常历史使虚构账户在年龄、内容和关系上接近真实用户。攻击者通过在行动前较长时间维持低风险、角色一致的公开活动与关系改变痕迹，使新鲜稀疏账户变为具有长期内容和关系的账户；新账户规则和首次接触信号失效，需关联注册与长期行为来源。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Continuous benign history makes a fabricated account resemble a real user in age, content, and relationships. The adversary changes traces through this operating principle:
        Maintain low-risk, role-consistent public activity and relationships for an extended pre-operation period. As a result, a fresh sparse account becomes one with long-term content
        and relationships; new-account rules and first-contact signals weaken, requiring registration and long-term provenance correlation. The design substitutes normal or trusted features
        for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise effect.'
  evidence_refs:
