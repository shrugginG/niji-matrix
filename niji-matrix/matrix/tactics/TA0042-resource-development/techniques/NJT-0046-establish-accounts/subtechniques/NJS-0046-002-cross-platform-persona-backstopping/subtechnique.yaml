schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0046-002
parent_ref: NJT-0046
name:
  zh: 跨平台人物身份背书
  en: Cross-Platform Persona Backstopping
summary:
  zh: 在多个独立平台建立同一虚构身份的角色一致公开存在，使平台间信息相互验证。
  en: Establish a role-consistent public presence for one fictitious identity across independent platforms so information validates across services.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 在多个独立平台建立同一虚构身份的角色一致公开存在，使平台间信息相互验证。其直接目标是降低单点画像真实性审查的有效性，实现原则是在多个账户维持相同姓名、职业、履历、关系与活动主题，并建立交叉引用；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Establish a role-consistent public presence for one fictitious identity across independent platforms so information validates across services. Its direct objective is to reduce
      effectiveness of single-profile authenticity checks, and its operating principle is to maintain the same name, occupation, biography, relationships, and activity themes across
      accounts and create cross-references; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 跨平台人物身份背书使单一孤立假画像变为跨平台相互支持的人物网络。对防守方的观察影响是单平台检查难以发现虚构性，需跨平台设备、内容、关系和时间关联；与此同时，跨平台相同传记/图像/关系、共享设备或恢复标识、同步活动仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Cross-Platform Persona Backstopping changes traces so that one isolated false profile becomes a cross-platform mutually supporting persona network. The defender-observation effect
      is that single-platform checks struggle to identify fabrication, requiring cross-platform device, content, relationship, and time correlation; at the same time, same biography/image/relationships
      across platforms, shared device or recovery identifiers, and synchronized activity remain recoverable residual traces, and observers with finer telemetry or longer retention can
      limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入多平台同一人物账户、跨平台属性和关系背书，排除仅生成一致内容、单一平台多个账户、实际对话迁移。其兄弟边界是：NJS-0046-001 通过时间培育历史；本子技术通过独立平台相互背书；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes one persona across platforms and cross-platform attribute and relationship backstopping and excludes generating coherent content alone, multiple accounts
      on one platform, and actual conversation migration. Its sibling boundary is that NJS-0046-001 cultivates history over time; this child uses independent platforms to backstop one
      another; inclusion requires adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or
      ordinary content and account activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 社交、职业、邮箱、协作与消息平台 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。跨平台相同传记/图像/关系、共享设备或恢复标识、同步活动可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in social, professional, email, collaboration, and messaging platforms and wants to change traces visible
        to victims, platforms, or analysts before first high-risk use. Same biography/image/relationships across platforms, shared device or recovery identifiers, and synchronized activity
        may appear during preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：可在多个平台建立账户和公开内容。实施者还需持续控制用于在多个账户维持相同姓名、职业、履历、关系与活动主题，并建立交叉引用的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: accounts and public content can be established across platforms. The operator also needs sustained control of the
          configuration, timing, build, account, or third-party resources used to maintain the same name, occupation, biography, relationships, and activity themes across accounts and
          create cross-references. Resource loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity
          is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到跨平台相同传记/图像/关系、共享设备或恢复标识、同步活动；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see same biography/image/relationships across platforms, shared device or recovery identifiers, and synchronized activity; reliable identification
          requires authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 多个平台呈现一致人物和关系，使虚构身份更接近真实跨服务用户
    en: Coherent persona and relationships across platforms make a fictitious identity resemble a real cross-service user
  analysis:
    paragraphs:
    - zh: 多个平台呈现一致人物和关系，使虚构身份更接近真实跨服务用户。攻击者通过在多个账户维持相同姓名、职业、履历、关系与活动主题，并建立交叉引用改变痕迹，使单一孤立假画像变为跨平台相互支持的人物网络；单平台检查难以发现虚构性，需跨平台设备、内容、关系和时间关联。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Coherent persona and relationships across platforms make a fictitious identity resemble a real cross-service user. The adversary changes traces through this operating principle:
        Maintain the same name, occupation, biography, relationships, and activity themes across accounts and create cross-references. As a result, one isolated false profile becomes
        a cross-platform mutually supporting persona network; single-platform checks struggle to identify fabrication, requiring cross-platform device, content, relationship, and time
        correlation. The design substitutes normal or trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral
        and lineage relationships, producing a Feature Disguise effect.'
