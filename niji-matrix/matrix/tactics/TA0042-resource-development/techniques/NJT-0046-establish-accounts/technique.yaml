research:
  limitations:
    paragraphs:
    - zh: 现有证据直接支持候选行为和至少一个稳定匿迹变量，但对攻击者在每个实例中的主观目的、所有平台的同等效果以及提供方内部可见性并不完整。接管真实既有账户、仅用于公开研究的账户隔离、内容生成本身、实际钓鱼/欺诈/投递也可能产生部分相似痕迹，因此结论必须保持在来源直接证明的行为、痕迹变化和观察模型内；新增子技术需要独立证据和防御差异。
      en: Current evidence directly supports the candidate behavior and at least one stable stealth variable, but does not fully establish adversary intent in every instance, equal effect
        across platforms, or provider-internal visibility. takeover of a real existing account, account compartmentation only for open research, content generation itself, and actual
        phishing/fraud/delivery can also create some similar traces, so conclusions must remain within behavior, trace change, and observation models directly supported by sources; any
        additional child requires independent evidence and defensive distinction.
