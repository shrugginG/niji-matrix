schema_version: 2.0.0
type: technique
id: NJT-0046
name:
  zh: 建立账户
  en: Establish Accounts
summary:
  zh: 创建并培育新的行动账户或人物身份，使其在高风险接触前积累年龄、公开历史、关系与一致人物特征。
  en: Create and cultivate new operational accounts or personas so they accumulate age, public history, relationships, and coherent persona features before high-risk contact.
aliases:
- Cultivate Operational Personas
classification:
  tactic_refs:
  - TA0042
  origin:
    kind: attack-retained
    source_attack_id: T1585
    source_attack_version: '19.1'
  decision_ref: DEC-TA0042-T1585
definition_and_concept:
  paragraphs:
  - zh: 创建并培育新的行动账户或人物身份，使其在高风险接触前积累年龄、公开历史、关系与一致人物特征。本技术的直接目标是在攻击准备阶段形成可供后续行动使用的资源或状态，而不是完成具体攻陷步骤、投递、执行、通信或其他下游行为；产品、介质和工具名称只有在承载稳定匿迹变量时才具有分类意义。
    en: Create and cultivate new operational accounts or personas so they accumulate age, public history, relationships, and coherent persona features before high-risk contact. The direct
      objective is to create a resource or state for later operations during Resource Development rather than perform the compromise step, delivery, execution, communication, or another
      downstream behavior; products, media, and tool names matter only when they carry a stable stealth variable.
stealth_characteristics:
  paragraphs:
  - zh: 长期正常历史把新鲜稀疏账户转化为可检验的身份资源，降低账户年龄与首次接触异常。该对象仍会留下长期低风险活动、关系图逐步增长、多账户共享设备/恢复/内容工件、后续高风险用途等痕迹；这些痕迹在资源提供方、资产所有者或构建与内容平台侧通常比后续目标侧更完整，因此跨视角和长期谱系可以限制匿迹效果。
    en: Long benign history turns a fresh sparse account into a testable identity resource, reducing account-age and first-contact anomalies. The object still leaves traces such as long
      low-risk activity, gradual relationship-graph growth, shared devices/recovery/content artifacts across accounts, and later high-risk use; those traces are generally more complete
      at resource providers, asset owners, or build and content platforms than at downstream victims, so cross-vantage and long-horizon lineage can limit the stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入创建行动账户/人物、高风险接触前培育历史和关系、维持人物属性一致性。它排除接管真实既有账户、仅用于公开研究的账户隔离、内容生成本身、实际钓鱼/欺诈/投递，并与以下相邻对象明确区分：NJT-0043 继承真实主体历史、NJS-0024 按研究查询隔离、NJT-0047 生成支撑内容。合法业务、测试、兼容性或运维行为只有在缺少攻击者控制的匿迹变量时属于正常相似行为，不能仅凭资源类别或单一异常纳入。
    en: This technique includes creation of operational accounts or personas, cultivation of history and relationships before high-risk contact, and maintenance of coherent persona properties.
      It excludes takeover of a real existing account, account compartmentation only for open research, content generation itself, and actual phishing/fraud/delivery and is distinguished
      because NJT-0043 inherits a real subject's history, NJS-0024 compartmentalizes research queries, and NJT-0047 generates supporting content. Legitimate business, testing, compatibility,
      or administration remains a normal lookalike when no adversary-controlled stealth variable is present, and resource class or one anomaly alone cannot qualify the behavior.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者在社交、邮箱、云、开发者、论坛和协作平台中准备需要信誉、关系和历史的行动身份，并希望这些资源在首次高风险使用前获得较低可区分性或较高归因成本的场景。后续结果可以证明准备效果，但不能扩张本技术边界。
      en: This technique applies when adversaries prepare operational identities requiring reputation, relationships, and history in social, email, cloud, developer, forum, and collaboration
        platforms and want those resources to have lower distinguishability or higher attribution cost before first high-risk use. Downstream results may establish preparation effects
        but do not expand this technique boundary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：平台允许账户创建与公开互动、攻击者有时间维持人物。实施者还需控制资源准备的时间、配置、关系或供应过程，并承担长期维护、跨平台协调、构建管理或第三方服务处置等成本；失去资源控制、可见工件复用和提供方审计都会削弱效果。
        en: 'The adversary must satisfy the following prerequisites: platforms permit account creation and public interaction and the adversary has time to maintain the persona. The
          operator must also control timing, configuration, relationships, or supply during resource preparation and bear costs such as long-term maintenance, cross-platform coordination,
          build administration, or third-party enforcement; loss of resource control, reuse of visible artifacts, and provider audit reduce the effect.'
    defender_model:
      paragraphs:
      - zh: 防守方可能观察到长期低风险活动、关系图逐步增长、多账户共享设备/恢复/内容工件、后续高风险用途，但不同观察者拥有的字段和保留期并不相同。可靠判断需要把目标侧记录与提供方、资产所有者、账户、构建、签名或控制平面遥测关联，并为合法相似行为保留基线；缺少跨组织授权时只能形成受限推断。
        en: Defenders may observe long low-risk activity, gradual relationship-graph growth, shared devices/recovery/content artifacts across accounts, and later high-risk use, but fields
          and retention differ by vantage. Reliable judgment requires joining victim-side records with provider, asset-owner, account, build, signing, or control-plane telemetry and
          maintaining baselines for legitimate lookalikes; without authority for cross-organizational correlation, conclusions remain limited.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 年龄、连续活动和关系历史使虚构身份在可见特征上接近真实长期用户
    en: Age, continuous activity, and relationship history make a fabricated identity resemble a genuine long-term user in visible features
  analysis:
    paragraphs:
    - zh: 年龄、连续活动和关系历史使虚构身份在可见特征上接近真实长期用户。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: Age, continuous activity, and relationship history make a fabricated identity resemble a genuine long-term user in visible features. The design substitutes normal or trusted
        features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise
        effect.
  evidence_refs:
  - REF-000063
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立时间培育的正常历史、跨平台人物身份背书两项匿迹子技术。它们分别以在高风险使用前持续积累低风险活动与关系历史；让同一虚构身份在独立平台间获得相互支持的公开存在为稳定划分变量；每项都会改变可见痕迹和防守观察，并需要不同的关联或控制能力。分类不按 ATT&CK 子技术、资源种类、产品、平台、内容媒介或工具拆分，两个变量可以组合但不能相互替代。
      en: This technique defines two evasion sub-techniques, Time-Cultivated Benign History and Cross-Platform Persona Backstopping. They respectively use accumulating low-risk activity
        and relationship history over time before high-risk use; giving one fictitious identity mutually supporting public presence across independent platforms as stable partition variables;
        each changes visible traces and defender observation and requires a different correlation or control capability. The taxonomy does not partition by ATT&CK children, resource
        type, product, platform, content medium, or tool, and the two variables may combine without substituting for one another.
  coverage: established
  subtechnique_refs:
  - NJS-0046-001
  - NJS-0046-002
