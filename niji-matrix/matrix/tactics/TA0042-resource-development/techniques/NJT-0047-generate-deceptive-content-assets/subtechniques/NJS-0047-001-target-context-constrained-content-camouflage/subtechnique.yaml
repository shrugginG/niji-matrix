schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0047-001
parent_ref: NJT-0047
name:
  zh: 目标情境约束的内容拟态
  en: Target-Context-Constrained Content Camouflage
summary:
  zh: 以目标履历、角色、组织语气、当地语言、业务节奏或回复约束生成内容，使其符合特定情境。
  en: Constrain generated content with target biography, role, organizational tone, local language, business tempo, or replies so it fits a specific context.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 以目标履历、角色、组织语气、当地语言、业务节奏或回复约束生成内容，使其符合特定情境。其直接目标是减少局部语言、角色和业务理由异常，实现原则是在首次使用前把目标事实和人物状态作为生成与修订约束；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Constrain generated content with target biography, role, organizational tone, local language, business tempo, or replies so it fits a specific context. Its direct objective is
      to reduce local language, role, and business-reason anomalies, and its operating principle is to use victim facts and persona state as generation and revision constraints before
      first use; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 目标情境约束的内容拟态使通用或矛盾内容变为目标约束的一致资产。对防守方的观察影响是局部内容信号降低，需独立关系核验和跨资产关联；与此同时，目标细节重现、角色语气一致、多资产共享模板或生成工件仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Target-Context-Constrained Content Camouflage changes traces so that generic or contradictory content becomes a target-constrained coherent asset. The defender-observation effect
      is that local content signals weaken, requiring independent relationship verification and cross-asset correlation; at the same time, victim details recurring, coherent role and
      tone, and shared templates or generation artifacts across assets remain recoverable residual traces, and observers with finer telemetry or longer retention can limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入目标化语言/角色/语气/理由生成、依据回复修订但尚未发送，排除按文字/音视频媒介拆分、普通翻译、实际发送和诱导。其兄弟边界是：NJS-0047-002 维持跨资产人物连续性；本子技术使单项内容匹配具体目标情境；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes targeted language/role/tone/reason generation and revision from received replies before sending and excludes partition by written or audiovisual medium, ordinary
      translation, and actual sending and elicitation. Its sibling boundary is that NJS-0047-002 maintains persona continuity across assets; this child matches one content item to specific
      target context; inclusion requires adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility,
      or ordinary content and account activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 人工/委托/AI 内容制作 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。目标细节重现、角色语气一致、多资产共享模板或生成工件可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in human/commissioned/AI content production and wants to change traces visible to victims, platforms, or
        analysts before first high-risk use. Victim details recurring, coherent role and tone, and shared templates or generation artifacts across assets may appear during preparation
        or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：可用目标与人物情境。实施者还需持续控制用于在首次使用前把目标事实和人物状态作为生成与修订约束的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: victim and persona context is available. The operator also needs sustained control of the configuration, timing,
          build, account, or third-party resources used to use victim facts and persona state as generation and revision constraints before first use. Resource loss, provider enforcement,
          cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到目标细节重现、角色语气一致、多资产共享模板或生成工件；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see victim details recurring, coherent role and tone, and shared templates or generation artifacts across assets; reliable identification requires
          authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 内容在语言、角色与业务情境上接近目标熟悉的合法材料
    en: Content resembles legitimate material familiar to the target in language, role, and business context
  analysis:
    paragraphs:
    - zh: 内容在语言、角色与业务情境上接近目标熟悉的合法材料。攻击者通过在首次使用前把目标事实和人物状态作为生成与修订约束改变痕迹，使通用或矛盾内容变为目标约束的一致资产；局部内容信号降低，需独立关系核验和跨资产关联。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Content resembles legitimate material familiar to the target in language, role, and business context. The adversary changes traces through this operating principle: Use victim
        facts and persona state as generation and revision constraints before first use. As a result, generic or contradictory content becomes a target-constrained coherent asset; local
        content signals weaken, requiring independent relationship verification and cross-asset correlation. The design substitutes normal or trusted features for conspicuous operational
        features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise effect.'
