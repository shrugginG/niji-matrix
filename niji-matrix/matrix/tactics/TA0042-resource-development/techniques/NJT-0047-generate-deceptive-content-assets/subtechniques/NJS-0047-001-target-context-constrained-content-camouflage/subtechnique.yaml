research:
  limitations:
    paragraphs:
    - zh: 公开证据能够支持本子技术的稳定变量和所列痕迹变化，但不保证每个人工/委托/AI 内容制作实例都具有相同匿迹意图或效果。按文字/音视频媒介拆分、普通翻译、实际发送和诱导可能产生局部相似现象，且提供方内部数据通常不公开；置信度应随直接准备证据、跨视角复现和正常基线的可得性调整。
      en: Public evidence supports this child's stable variable and stated trace change but does not establish identical stealth intent or effect in every instance of human/commissioned/AI
        content production. partition by written or audiovisual medium, ordinary translation, and actual sending and elicitation can produce locally similar effects, and provider-internal
        data is often unavailable; confidence should vary with direct preparation evidence, cross-vantage reproduction, and availability of a legitimate baseline.
