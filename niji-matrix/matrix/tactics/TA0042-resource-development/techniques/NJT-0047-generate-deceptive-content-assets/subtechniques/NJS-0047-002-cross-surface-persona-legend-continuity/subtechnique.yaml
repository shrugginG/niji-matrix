schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0047-002
parent_ref: NJT-0047
name:
  zh: 跨表面人物设定连续性
  en: Cross-Surface Persona-Legend Continuity
summary:
  zh: 使用集中人物设定状态约束跨账户、平台和模态的简介、帖子、回复、图像与语言。
  en: Use centralized persona-legend state to constrain biographies, posts, replies, images, and language across accounts, platforms, and modalities.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 使用集中人物设定状态约束跨账户、平台和模态的简介、帖子、回复、图像与语言。其直接目标是减少跨表面角色漂移、属性冲突和语言不一致，实现原则是维护可更新的人物属性表，并让所有内容资产遵循同一状态；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Use centralized persona-legend state to constrain biographies, posts, replies, images, and language across accounts, platforms, and modalities. Its direct objective is to reduce
      cross-surface role drift, attribute conflicts, and language inconsistency, and its operating principle is to maintain an updateable persona attribute record and constrain all content
      assets to the same state; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 跨表面人物设定连续性使分散矛盾内容变为共享人物状态约束的连续资产集。对防守方的观察影响是局部矛盾信号下降，需跨账户、语义、媒体、生成基础设施和时间关联；与此同时，跨资产相同人物属性、共享模板/提示/图像工件、状态同步更新仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Cross-Surface Persona-Legend Continuity changes traces so that dispersed contradictory content becomes a continuous asset set constrained by shared persona state. The defender-observation
      effect is that local contradiction signals decrease, requiring correlation across accounts, semantics, media, generation infrastructure, and time; at the same time, same persona
      attributes across assets, shared template/prompt/image artifacts, and synchronized state updates remain recoverable residual traces, and observers with finer telemetry or longer
      retention can limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入跨平台/模态内容连续性、人物属性状态约束，排除账户本身建立、单条目标化内容、下游对话发送。其兄弟边界是：NJS-0047-001 使单项内容匹配目标；本子技术维持多资产间人物连续性；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes cross-platform/modal content continuity and persona-attribute state constraints and excludes account establishment itself, one target-specific content item,
      and downstream conversation sending. Its sibling boundary is that NJS-0047-001 matches one content item to a target; this child maintains persona continuity across assets; inclusion
      requires adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary content and
      account activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 社交内容、简介、消息草稿、图像/音视频和 AI 服务 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。跨资产相同人物属性、共享模板/提示/图像工件、状态同步更新可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in social content, biographies, message drafts, image/audio-video, and AI services and wants to change traces
        visible to victims, platforms, or analysts before first high-risk use. Same persona attributes across assets, shared template/prompt/image artifacts, and synchronized state updates
        may appear during preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：可维护统一人物设定并控制多个内容表面。实施者还需持续控制用于维护可更新的人物属性表，并让所有内容资产遵循同一状态的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: a unified persona legend can be maintained across controlled content surfaces. The operator also needs sustained
          control of the configuration, timing, build, account, or third-party resources used to maintain an updateable persona attribute record and constrain all content assets to the
          same state. Resource loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary
          preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到跨资产相同人物属性、共享模板/提示/图像工件、状态同步更新；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see same persona attributes across assets, shared template/prompt/image artifacts, and synchronized state updates; reliable identification
          requires authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 一致人物属性让跨表面内容接近真实身份长期产出
    en: Coherent persona attributes make cross-surface content resemble long-term output from a real identity
  analysis:
    paragraphs:
    - zh: 一致人物属性让跨表面内容接近真实身份长期产出。攻击者通过维护可更新的人物属性表，并让所有内容资产遵循同一状态改变痕迹，使分散矛盾内容变为共享人物状态约束的连续资产集；局部矛盾信号下降，需跨账户、语义、媒体、生成基础设施和时间关联。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Coherent persona attributes make cross-surface content resemble long-term output from a real identity. The adversary changes traces through this operating principle: Maintain
        an updateable persona attribute record and constrain all content assets to the same state. As a result, dispersed contradictory content becomes a continuous asset set constrained
        by shared persona state; local contradiction signals decrease, requiring correlation across accounts, semantics, media, generation infrastructure, and time. The design substitutes
        normal or trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing
        a Feature Disguise effect.'
