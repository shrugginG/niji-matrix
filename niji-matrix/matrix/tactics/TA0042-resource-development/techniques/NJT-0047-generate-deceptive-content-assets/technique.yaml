schema_version: 2.0.0
type: technique
id: NJT-0047
name:
  zh: 生成欺骗性内容资产
  en: Generate Deceptive Content Assets
summary:
  zh: 为人物身份、冒充、社会工程、欺诈或影响行动准备具有明确身份与情境拟态目标的文字、图像、音频、视频或叙事资产。
  en: Prepare text, image, audio, video, or narrative assets for personas, impersonation, social engineering, fraud, or influence with an explicit identity and context-camouflage objective.
aliases:
- Generate Content
classification:
  tactic_refs:
  - TA0042
  origin:
    kind: attack-adapted
    source_attack_id: T1683
    source_attack_version: '19.1'
  decision_ref: DEC-TA0042-T1683
definition_and_concept:
  paragraphs:
  - zh: 为人物身份、冒充、社会工程、欺诈或影响行动准备具有明确身份与情境拟态目标的文字、图像、音频、视频或叙事资产。本技术的直接目标是在攻击准备阶段形成可供后续行动使用的资源或状态，而不是完成具体攻陷步骤、投递、执行、通信或其他下游行为；产品、介质和工具名称只有在承载稳定匿迹变量时才具有分类意义。
    en: Prepare text, image, audio, video, or narrative assets for personas, impersonation, social engineering, fraud, or influence with an explicit identity and context-camouflage objective.
      The direct objective is to create a resource or state for later operations during Resource Development rather than perform the compromise step, delivery, execution, communication,
      or another downstream behavior; products, media, and tool names matter only when they carry a stable stealth variable.
stealth_characteristics:
  paragraphs:
  - zh: 目标约束生成减少语言、角色、组织语气和业务理由异常，使下游防守方更难由局部内容识别欺骗意图。该对象仍会留下内容与目标细节高度匹配、多资产人物属性一致、共享提示/模板/图像工件、后续定向使用等痕迹；这些痕迹在资源提供方、资产所有者或构建与内容平台侧通常比后续目标侧更完整，因此跨视角和长期谱系可以限制匿迹效果。
    en: Target-constrained generation reduces language, role, organizational-tone, and business-reason anomalies, making deception intent harder to identify from local content. The object
      still leaves traces such as content closely matching victim details, coherent persona attributes across assets, shared prompt/template/image artifacts, and later targeted use;
      those traces are generally more complete at resource providers, asset owners, or build and content platforms than at downstream victims, so cross-vantage and long-horizon lineage
      can limit the stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入生成用于身份/冒充/社工的欺骗内容资产、以目标资料约束语言/角色/语气/理由、人工、委托或 AI 生成。它排除普通写作/翻译/内容量产、恶意代码和脚本开发、AI 能力取得、内容首次发送或展示后的下游行为，并与以下相邻对象明确区分：NJT-0046 建立和培育账户、NJT-0045 开发代码能力、NJS-0020 从直接信息诱导开始。合法业务、测试、兼容性或运维行为只有在缺少攻击者控制的匿迹变量时属于正常相似行为，不能仅凭资源类别或单一异常纳入。
    en: This technique includes generation of deceptive content assets for personas/impersonation/social engineering, target constraints on language/role/tone/reason, human, commissioned,
      and or AI generation. It excludes ordinary writing/translation/content production, malicious code or script development, acquisition of AI capability, and downstream behavior after
      first sending or display and is distinguished because NJT-0046 establishes and cultivates accounts, NJT-0045 develops code capability, and NJS-0020 begins with direct information
      elicitation. Legitimate business, testing, compatibility, or administration remains a normal lookalike when no adversary-controlled stealth variable is present, and resource class
      or one anomaly alone cannot qualify the behavior.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者在内容制作、翻译和设计流程、公共/私有 AI 服务、人物与活动协作环境中准备语言、语气、角色、品牌、履历、业务理由与跨内容一致性，并希望这些资源在首次高风险使用前获得较低可区分性或较高归因成本的场景。后续结果可以证明准备效果，但不能扩张本技术边界。
      en: This technique applies when adversaries prepare language, tone, role, branding, biography, business reason, and cross-content coherence in content production, translation,
        design workflows, public/private AI services, and persona and campaign collaboration environments and want those resources to have lower distinguishability or higher attribution
        cost before first high-risk use. Downstream results may establish preparation effects but do not expand this technique boundary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：可用目标资料或人物设定、具备人工/承包/AI 生成能力。实施者还需控制资源准备的时间、配置、关系或供应过程，并承担长期维护、跨平台协调、构建管理或第三方服务处置等成本；失去资源控制、可见工件复用和提供方审计都会削弱效果。
        en: 'The adversary must satisfy the following prerequisites: victim information or a persona legend is available and human/contractor/AI generation capability is available. The
          operator must also control timing, configuration, relationships, or supply during resource preparation and bear costs such as long-term maintenance, cross-platform coordination,
          build administration, or third-party enforcement; loss of resource control, reuse of visible artifacts, and provider audit reduce the effect.'
    defender_model:
      paragraphs:
      - zh: 防守方可能观察到内容与目标细节高度匹配、多资产人物属性一致、共享提示/模板/图像工件、后续定向使用，但不同观察者拥有的字段和保留期并不相同。可靠判断需要把目标侧记录与提供方、资产所有者、账户、构建、签名或控制平面遥测关联，并为合法相似行为保留基线；缺少跨组织授权时只能形成受限推断。
        en: Defenders may observe content closely matching victim details, coherent persona attributes across assets, shared prompt/template/image artifacts, and later targeted use,
          but fields and retention differ by vantage. Reliable judgment requires joining victim-side records with provider, asset-owner, account, build, signing, or control-plane telemetry
          and maintaining baselines for legitimate lookalikes; without authority for cross-organizational correlation, conclusions remain limited.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 以目标和人物约束内容，使语言、语气、角色与业务情境接近合法通信和真实身份材料
    en: Target and persona constraints make language, tone, role, and business context resemble legitimate communication and authentic identity material
  analysis:
    paragraphs:
    - zh: 以目标和人物约束内容，使语言、语气、角色与业务情境接近合法通信和真实身份材料。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: Target and persona constraints make language, tone, role, and business context resemble legitimate communication and authentic identity material. The design substitutes normal
        or trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature
        Disguise effect.
  evidence_refs:
  - REF-000043
  - REF-000064
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立目标情境约束的内容拟态、跨表面人物设定连续性两项匿迹子技术。它们分别以用目标角色、语言、组织语气和业务理由约束单项内容；在多个内容资产和渠道之间维持统一人物状态为稳定划分变量；每项都会改变可见痕迹和防守观察，并需要不同的关联或控制能力。分类不按 ATT&CK 子技术、资源种类、产品、平台、内容媒介或工具拆分，两个变量可以组合但不能相互替代。
      en: This technique defines two evasion sub-techniques, Target-Context-Constrained Content Camouflage and Cross-Surface Persona-Legend Continuity. They respectively use constraining
        one content item with victim role, language, organizational tone, and business reason; maintaining unified persona state across content assets and channels as stable partition
        variables; each changes visible traces and defender observation and requires a different correlation or control capability. The taxonomy does not partition by ATT&CK children,
        resource type, product, platform, content medium, or tool, and the two variables may combine without substituting for one another.
  coverage: established
  subtechnique_refs:
  - NJS-0047-001
  - NJS-0047-002
