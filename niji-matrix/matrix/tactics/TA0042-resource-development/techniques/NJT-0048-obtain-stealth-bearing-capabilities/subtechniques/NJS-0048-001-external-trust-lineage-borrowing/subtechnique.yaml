research:
  limitations:
    paragraphs:
    - zh: 公开证据能够支持本子技术的稳定变量和所列痕迹变化，但不保证每个合法管理工具、软件签名与证书生态实例都具有相同匿迹意图或效果。仅使用开源工具但不借用可信特征、能力实际执行可能产生局部相似现象，且提供方内部数据通常不公开；置信度应随直接准备证据、跨视角复现和正常基线的可得性调整。
      en: Public evidence supports this child's stable variable and stated trace change but does not establish identical stealth intent or effect in every instance of legitimate management-tool,
        software-signing, and certificate ecosystems. using open-source tools without borrowing trusted features and capability execution can produce locally similar effects, and provider-internal
        data is often unavailable; confidence should vary with direct preparation evidence, cross-vantage reproduction, and availability of a legitimate baseline.
