schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0048-001
parent_ref: NJT-0048
name:
  zh: 外部信任谱系借用
  en: External Trust-Lineage Borrowing
summary:
  zh: 取得并保留合法工具、第三方发行者、签名服务或证书的可信特征。
  en: Obtain and preserve trusted features of legitimate tools, third-party publishers, signing services, or certificates.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 取得并保留合法工具、第三方发行者、签名服务或证书的可信特征。其直接目标是使恶意能力在产品、发行者或签名层接近正常软件，实现原则是在能力取得后保留可被安全工具和用户识别为可信的外部谱系特征；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Obtain and preserve trusted features of legitimate tools, third-party publishers, signing services, or certificates. Its direct objective is to make malicious capability resemble
      normal software at product, publisher, or signature layers, and its operating principle is to preserve external lineage features recognized as trusted by security tools and users
      after acquisition; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 外部信任谱系借用使未知恶意产物变为带合法工具或可信发行谱系的能力。对防守方的观察影响是基于工具类别、发行者或签名的放行逻辑失效，需行为和供应链关联；与此同时，有效签名与恶意行为冲突、多活动共享发行者或工具谱系仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: External Trust-Lineage Borrowing changes traces so that an unknown malicious artifact becomes capability carrying legitimate tool or trusted-publisher lineage. The defender-observation
      effect is that allow logic based on tool category, publisher, or signature weakens, requiring behavior and supply-chain correlation; at the same time, valid signature conflicting
      with malicious behavior and publisher or tool lineage shared across campaigns remain recoverable residual traces, and observers with finer telemetry or longer retention can limit
      the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入合法工具外观、受信发行者/签名/证书特征，排除仅使用开源工具但不借用可信特征、能力实际执行。其兄弟边界是：NJS-0048-002 分离供应商与操作者谱系；本子技术借用能力外观中的可信特征；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes legitimate tool appearance and trusted publisher/signature/certificate features and excludes using open-source tools without borrowing trusted features and
      capability execution. Its sibling boundary is that NJS-0048-002 separates provider and operator lineage; this child borrows trusted visible features; inclusion requires adversary
      control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary content and account activity
      do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 合法管理工具、软件签名与证书生态 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。有效签名与恶意行为冲突、多活动共享发行者或工具谱系可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in legitimate management-tool, software-signing, and certificate ecosystems and wants to change traces visible
        to victims, platforms, or analysts before first high-risk use. Valid signature conflicting with malicious behavior and publisher or tool lineage shared across campaigns may appear
        during preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：可取得具有可信外部特征的能力。实施者还需持续控制用于在能力取得后保留可被安全工具和用户识别为可信的外部谱系特征的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: capability with trusted external features can be obtained. The operator also needs sustained control of the configuration,
          timing, build, account, or third-party resources used to preserve external lineage features recognized as trusted by security tools and users after acquisition. Resource loss,
          provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到有效签名与恶意行为冲突、多活动共享发行者或工具谱系；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see valid signature conflicting with malicious behavior and publisher or tool lineage shared across campaigns; reliable identification requires
          authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 可信产品与签名特征降低恶意能力和正常软件的可区分性
    en: Trusted product and signature features reduce distinguishability between malicious capability and normal software
  analysis:
    paragraphs:
    - zh: 可信产品与签名特征降低恶意能力和正常软件的可区分性。攻击者通过在能力取得后保留可被安全工具和用户识别为可信的外部谱系特征改变痕迹，使未知恶意产物变为带合法工具或可信发行谱系的能力；基于工具类别、发行者或签名的放行逻辑失效，需行为和供应链关联。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Trusted product and signature features reduce distinguishability between malicious capability and normal software. The adversary changes traces through this operating principle:
        Preserve external lineage features recognized as trusted by security tools and users after acquisition. As a result, an unknown malicious artifact becomes capability carrying
        legitimate tool or trusted-publisher lineage; allow logic based on tool category, publisher, or signature weakens, requiring behavior and supply-chain correlation. The design
        substitutes normal or trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships,
        producing a Feature Disguise effect.'
  evidence_refs:
  - REF-000065
  confidence: high
