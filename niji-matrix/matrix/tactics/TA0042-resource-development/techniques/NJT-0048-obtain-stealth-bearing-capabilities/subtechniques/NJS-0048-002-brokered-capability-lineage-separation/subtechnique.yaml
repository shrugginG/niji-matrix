research:
  limitations:
    paragraphs:
    - zh: 公开证据能够支持本子技术的稳定变量和所列痕迹变化，但不保证每个MaaS、签名服务、RMM/工具供应与地下市场实例都具有相同匿迹意图或效果。一次性普通购买、可信特征本身、特定目标访问经纪可能产生局部相似现象，且提供方内部数据通常不公开；置信度应随直接准备证据、跨视角复现和正常基线的可得性调整。
      en: Public evidence supports this child's stable variable and stated trace change but does not establish identical stealth intent or effect in every instance of maaS, signing services,
        RMM/tool supply, and underground markets. one-time ordinary purchase, trusted features themselves, and target-specific access brokerage can produce locally similar effects, and
        provider-internal data is often unavailable; confidence should vary with direct preparation evidence, cross-vantage reproduction, and availability of a legitimate baseline.
