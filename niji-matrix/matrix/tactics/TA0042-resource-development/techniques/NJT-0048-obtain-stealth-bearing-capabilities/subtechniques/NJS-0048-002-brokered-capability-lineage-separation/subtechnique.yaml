schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0048-002
parent_ref: NJT-0048
name:
  zh: 经纪化能力谱系分离
  en: Brokered Capability-Lineage Separation
summary:
  zh: 独立供应商持续控制能力开发、构建、签名和交付，操作者只作为客户取得产物。
  en: An independent provider continuously controls capability development, build, signing, and delivery while the operator obtains artifacts only as a customer.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 独立供应商持续控制能力开发、构建、签名和交付，操作者只作为客户取得产物。其直接目标是分离开发/供应痕迹与具体操作者，并提高客户归因成本，实现原则是供应商维护服务、基础设施和构建流程，为多个客户交付共享能力族；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: An independent provider continuously controls capability development, build, signing, and delivery while the operator obtains artifacts only as a customer. Its direct objective
      is to separate development and supply traces from a specific operator and raise customer-attribution cost, and its operating principle is to the provider maintains service, infrastructure,
      and build process and delivers a shared capability family to multiple customers; this boundary describes a repeatable stealth variable rather than a specific tool, product, or
      accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 经纪化能力谱系分离使操作者自建痕迹变为供应商侧构建和多个客户共享谱系。对防守方的观察影响是工具族可识别但客户身份不明确，需供应商、付款、租户和行动关系；与此同时，多客户共享证书/工具族、供应商门户与构建记录、客户交付差异仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Brokered Capability-Lineage Separation changes traces so that operator-built traces become provider-side build and lineage shared among customers. The defender-observation effect
      is that the tool family is recognizable but customer identity is unclear, requiring provider, payment, tenant, and campaign relationships; at the same time, certificates/tool families
      shared by customers, provider portal and build records, and customer-delivery differences remain recoverable residual traces, and observers with finer telemetry or longer retention
      can limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入MaaS/签名即服务/利用供应链、供应商与客户持续分层，排除一次性普通购买、可信特征本身、特定目标访问经纪。其兄弟边界是：NJS-0048-001 关注能力外观的可信特征；本子技术关注供应商—操作者谱系；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes maaS/signing-as-a-service/exploit supply chains and persistent provider-customer layering and excludes one-time ordinary purchase, trusted features themselves,
      and target-specific access brokerage. Its sibling boundary is that NJS-0048-001 concerns trusted visible features; this child concerns provider-operator lineage; inclusion requires
      adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary content and account
      activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 MaaS、签名服务、RMM/工具供应与地下市场 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。多客户共享证书/工具族、供应商门户与构建记录、客户交付差异可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in maaS, signing services, RMM/tool supply, and underground markets and wants to change traces visible to
        victims, platforms, or analysts before first high-risk use. Certificates/tool families shared by customers, provider portal and build records, and customer-delivery differences
        may appear during preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：独立能力供应商向多个客户提供服务。实施者还需持续控制用于供应商维护服务、基础设施和构建流程，为多个客户交付共享能力族的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: an independent capability provider serves multiple customers. The operator also needs sustained control of the configuration,
          timing, build, account, or third-party resources used to the provider maintains service, infrastructure, and build process and delivers a shared capability family to multiple
          customers. Resource loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary
          preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到多客户共享证书/工具族、供应商门户与构建记录、客户交付差异；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see certificates/tool families shared by customers, provider portal and build records, and customer-delivery differences; reliable identification
          requires authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 开发、构建、签名和交易痕迹集中在供应商，受害者通常只看到共享能力族
    en: Development, build, signing, and transaction traces concentrate at the provider while victims usually see only a shared capability family
  analysis:
    paragraphs:
    - zh: 开发、构建、签名和交易痕迹集中在供应商，受害者通常只看到共享能力族。攻击者通过供应商维护服务、基础设施和构建流程，为多个客户交付共享能力族改变痕迹，使操作者自建痕迹变为供应商侧构建和多个客户共享谱系；工具族可识别但客户身份不明确，需供应商、付款、租户和行动关系。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
      en: 'Development, build, signing, and transaction traces concentrate at the provider while victims usually see only a shared capability family. The adversary changes traces through
        this operating principle: The provider maintains service, infrastructure, and build process and delivers a shared capability family to multiple customers. As a result, operator-built
        traces become provider-side build and lineage shared among customers; the tool family is recognizable but customer identity is unclear, requiring provider, payment, tenant, and
        campaign relationships. The design makes critical activity appear blank, low-signal, or normal under an existing observation model, preventing its analytic logic from firing;
        broader vantage or changed analysis conditions can still recover the difference, producing a Behavioral Transparency effect.'
  evidence_refs:
  - REF-000081
  - REF-000082
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 多客户在不同时间和行动中使用同一供应层，增加具体操作者归属重构成本
    en: Multiple customers use one supply layer across times and campaigns, increasing reconstruction cost for a specific operator
  analysis:
    paragraphs:
    - zh: 多客户在不同时间和行动中使用同一供应层，增加具体操作者归属重构成本。攻击者通过供应商维护服务、基础设施和构建流程，为多个客户交付共享能力族改变痕迹，使操作者自建痕迹变为供应商侧构建和多个客户共享谱系；工具族可识别但客户身份不明确，需供应商、付款、租户和行动关系。该设计把同一行动痕迹分散到多个时间或空间单元，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
      en: 'Multiple customers use one supply layer across times and campaigns, increasing reconstruction cost for a specific operator. The adversary changes traces through this operating
        principle: The provider maintains service, infrastructure, and build process and delivers a shared capability family to multiple customers. As a result, operator-built traces
        become provider-side build and lineage shared among customers; the tool family is recognizable but customer identity is unclear, requiring provider, payment, tenant, and campaign
        relationships. The design distributes traces of one operation across temporal or spatial units so short windows and point indicators see only fragments; defenders must rebuild
        shared lineage across units, producing a Spatiotemporal Trace Dilution effect.'
  evidence_refs:
  - REF-000081
  confidence: medium
