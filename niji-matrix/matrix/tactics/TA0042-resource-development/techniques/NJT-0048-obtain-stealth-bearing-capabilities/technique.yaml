schema_version: 2.0.0
type: technique
id: NJT-0048
name:
  zh: 获取携带匿迹属性的能力
  en: Obtain Stealth-Bearing Capabilities
summary:
  zh: 从外部购买、窃取、下载或许可能力，并利用供应层分离或其已有合法工具、发行者、签名与证书特征支持隐蔽行动。
  en: Purchase, steal, download, or license capability externally and use supplier-layer separation or existing legitimate tool, publisher, signature, and certificate features to support
    covert operations.
aliases:
- Obtain Capabilities
classification:
  tactic_refs:
  - TA0042
  origin:
    kind: attack-adapted
    source_attack_id: T1588
    source_attack_version: '19.1'
  decision_ref: DEC-TA0042-T1588
definition_and_concept:
  paragraphs:
  - zh: 从外部购买、窃取、下载或许可能力，并利用供应层分离或其已有合法工具、发行者、签名与证书特征支持隐蔽行动。本技术的直接目标是在攻击准备阶段形成可供后续行动使用的资源或状态，而不是完成具体攻陷步骤、投递、执行、通信或其他下游行为；产品、介质和工具名称只有在承载稳定匿迹变量时才具有分类意义。
    en: Purchase, steal, download, or license capability externally and use supplier-layer separation or existing legitimate tool, publisher, signature, and certificate features to support
      covert operations. The direct objective is to create a resource or state for later operations during Resource Development rather than perform the compromise step, delivery, execution,
      communication, or another downstream behavior; products, media, and tool names matter only when they carry a stable stealth variable.
stealth_characteristics:
  paragraphs:
  - zh: 外部供应层把开发者与操作者谱系分离；可信工具和签名特征则降低恶意能力与正常软件的可区分性。该对象仍会留下多客户共享工具谱系、可信签名与恶意行为冲突、供应商水印/构建/证书关系等痕迹；这些痕迹在资源提供方、资产所有者或构建与内容平台侧通常比后续目标侧更完整，因此跨视角和长期谱系可以限制匿迹效果。
    en: An external supply layer separates developer and operator lineage, while trusted tool and signature features reduce distinguishability between malicious capability and normal
      software. The object still leaves traces such as tool lineage shared by customers, trusted signatures conflicting with malicious behavior, and provider watermark/build/certificate
      relationships; those traces are generally more complete at resource providers, asset owners, or build and content platforms than at downstream victims, so cross-vantage and long-horizon
      lineage can limit the stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入外部取得具有匿迹属性的能力、供应商/客户谱系分离、保留合法工具/发行者/签名/证书特征。它排除普通购买/下载、内部开发、特定目标访问权、能力上传/安装/配置、下游执行，并与以下相邻对象明确区分：NJT-0045 控制内部研发、NJT-0050 取得目标入口、NJT-0049 处理投放。合法业务、测试、兼容性或运维行为只有在缺少攻击者控制的匿迹变量时属于正常相似行为，不能仅凭资源类别或单一异常纳入。
    en: This technique includes external acquisition of capability with stealth properties, provider/customer lineage separation, and preservation of legitimate tool/publisher/signature/certificate
      features. It excludes ordinary purchase/download, in-house development, target-specific access, capability upload/install/configuration, and downstream execution and is distinguished
      because NJT-0045 controls in-house development, NJT-0050 acquires a victim foothold, and NJT-0049 handles staging. Legitimate business, testing, compatibility, or administration
      remains a normal lookalike when no adversary-controlled stealth variable is present, and resource class or one anomaly alone cannot qualify the behavior.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者在商业/地下能力市场、开源与合法管理工具生态、签名和证书服务中准备恶意软件/工具/利用、签名/证书/许可、AI 与漏洞信息，并希望这些资源在首次高风险使用前获得较低可区分性或较高归因成本的场景。后续结果可以证明准备效果，但不能扩张本技术边界。
      en: This technique applies when adversaries prepare malware/tools/exploits, signatures/certificates/licenses, and AI and vulnerability information in commercial/underground capability
        markets, open-source and legitimate management-tool ecosystems, and signing and certificate services and want those resources to have lower distinguishability or higher attribution
        cost before first high-risk use. Downstream results may establish preparation effects but do not expand this technique boundary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：外部供应商、市场或可下载能力存在。实施者还需控制资源准备的时间、配置、关系或供应过程，并承担长期维护、跨平台协调、构建管理或第三方服务处置等成本；失去资源控制、可见工件复用和提供方审计都会削弱效果。
        en: 'The adversary must satisfy the following prerequisites: an external provider, market, and or downloadable capability exists. The operator must also control timing, configuration,
          relationships, or supply during resource preparation and bear costs such as long-term maintenance, cross-platform coordination, build administration, or third-party enforcement;
          loss of resource control, reuse of visible artifacts, and provider audit reduce the effect.'
    defender_model:
      paragraphs:
      - zh: 防守方可能观察到多客户共享工具谱系、可信签名与恶意行为冲突、供应商水印/构建/证书关系，但不同观察者拥有的字段和保留期并不相同。可靠判断需要把目标侧记录与提供方、资产所有者、账户、构建、签名或控制平面遥测关联，并为合法相似行为保留基线；缺少跨组织授权时只能形成受限推断。
        en: Defenders may observe tool lineage shared by customers, trusted signatures conflicting with malicious behavior, and provider watermark/build/certificate relationships, but
          fields and retention differ by vantage. Reliable judgment requires joining victim-side records with provider, asset-owner, account, build, signing, or control-plane telemetry
          and maintaining baselines for legitimate lookalikes; without authority for cross-organizational correlation, conclusions remain limited.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 合法工具名、发行者和签名特征使外取能力在可见特征上接近正常软件
    en: Legitimate tool names, publishers, and signature features make obtained capability resemble normal software in visible features
  analysis:
    paragraphs:
    - zh: 合法工具名、发行者和签名特征使外取能力在可见特征上接近正常软件。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: Legitimate tool names, publishers, and signature features make obtained capability resemble normal software in visible features. The design substitutes normal or trusted features
        for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise effect.
  evidence_refs:
  - REF-000065
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 开发、构建和交易主要发生在供应商侧，受害者通常只能看到共享能力族而非具体操作者取得过程
    en: Development, build, and transaction occur mainly at the provider, while victims usually see only the shared capability family rather than operator acquisition
  analysis:
    paragraphs:
    - zh: 开发、构建和交易主要发生在供应商侧，受害者通常只能看到共享能力族而非具体操作者取得过程。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
      en: Development, build, and transaction occur mainly at the provider, while victims usually see only the shared capability family rather than operator acquisition. The design makes
        critical activity appear blank, low-signal, or normal under an existing observation model, preventing its analytic logic from firing; broader vantage or changed analysis conditions
        can still recover the difference, producing a Behavioral Transparency effect.
  evidence_refs:
  - REF-000065
  confidence: medium
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 多个客户在不同时间和行动中共享供应层，使供应商工具族与具体操作者映射分散
    en: Multiple customers share one supply layer across time and campaigns, dispersing mapping from provider tool family to a specific operator
  analysis:
    paragraphs:
    - zh: 多个客户在不同时间和行动中共享供应层，使供应商工具族与具体操作者映射分散。该设计把同一行动痕迹分散到多个时间或空间单元，使短窗口和单点指标只能看到片段；防守方必须跨单元重建共同谱系，因而形成时空释痕效果。
      en: Multiple customers share one supply layer across time and campaigns, dispersing mapping from provider tool family to a specific operator. The design distributes traces of one
        operation across temporal or spatial units so short windows and point indicators see only fragments; defenders must rebuild shared lineage across units, producing a Spatiotemporal
        Trace Dilution effect.
  evidence_refs:
  - REF-000081
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立外部信任谱系借用、经纪化能力谱系分离两项匿迹子技术。它们分别以保留合法工具、发行者、签名或证书的可见可信特征；由独立供应商向多个客户持续提供构建、签名或交付服务为稳定划分变量；每项都会改变可见痕迹和防守观察，并需要不同的关联或控制能力。分类不按 ATT&CK 子技术、资源种类、产品、平台、内容媒介或工具拆分，两个变量可以组合但不能相互替代。
      en: This technique defines two evasion sub-techniques, External Trust-Lineage Borrowing and Brokered Capability-Lineage Separation. They respectively use preserving visible trusted
        features of legitimate tools, publishers, signatures, or certificates; using an independent provider to supply build, signing, or delivery services to multiple customers as stable
        partition variables; each changes visible traces and defender observation and requires a different correlation or control capability. The taxonomy does not partition by ATT&CK
        children, resource type, product, platform, content medium, or tool, and the two variables may combine without substituting for one another.
  coverage: established
  subtechnique_refs:
  - NJS-0048-001
  - NJS-0048-002
defense:
  detections:
    coverage: available
    strategy_refs:
    - DET-000045
  mitigations:
