research:
  limitations:
    paragraphs:
    - zh: 公开证据能够支持本子技术的稳定变量和所列痕迹变化，但不保证每个云、PaaS、对象存储、代码托管和 Web 服务实例都具有相同匿迹意图或效果。服务账户取得、资源攻陷、下游下载和执行可能产生局部相似现象，且提供方内部数据通常不公开；置信度应随直接准备证据、跨视角复现和正常基线的可得性调整。
      en: Public evidence supports this child's stable variable and stated trace change but does not establish identical stealth intent or effect in every instance of cloud, paaS, object
        storage, code hosting, and web services. service-account acquisition, resource compromise, and downstream download and execution can produce locally similar effects, and provider-internal
        data is often unavailable; confidence should vary with direct preparation evidence, cross-vantage reproduction, and availability of a legitimate baseline.
