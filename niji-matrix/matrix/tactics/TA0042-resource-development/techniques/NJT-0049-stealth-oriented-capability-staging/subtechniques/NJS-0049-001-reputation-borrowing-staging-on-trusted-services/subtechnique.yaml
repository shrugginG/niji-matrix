schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0049-001
parent_ref: NJT-0049
name:
  zh: 可信服务信誉借宿投放
  en: Reputation-Borrowing Staging on Trusted Services
summary:
  zh: 把落地页、载荷或中转对象投放到合法云、PaaS、对象存储或 Web 服务，借用其域、TLS 与流量信誉。
  en: Stage landing pages, payloads, or relay objects on legitimate cloud, PaaS, object storage, or Web services, borrowing their domain, TLS, and traffic reputation.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 把落地页、载荷或中转对象投放到合法云、PaaS、对象存储或 Web 服务，借用其域、TLS 与流量信誉。其直接目标是降低域名、ASN 和服务类别层面的恶意区分能力，实现原则是在可信服务租户/对象层布置能力，同时保持供应商外层特征；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Stage landing pages, payloads, or relay objects on legitimate cloud, PaaS, object storage, or Web services, borrowing their domain, TLS, and traffic reputation. Its direct objective
      is to reduce malicious distinguishability at domain, asn, and service-category layers, and its operating principle is to place capability at trusted-service tenant or object layers
      while preserving provider outer features; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 可信服务信誉借宿投放使专用恶意托管表面变为共享可信服务中的对象。对防守方的观察影响是粗粒度信誉阻断失效，需提供方和对象/端点级关联；与此同时，共享域下新对象、上传/部署日志、后续访问和下载仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Reputation-Borrowing Staging on Trusted Services changes traces so that a dedicated malicious hosting surface becomes an object inside a shared trusted service. The defender-observation
      effect is that coarse reputation blocking weakens, requiring provider and object or endpoint correlation; at the same time, new objects under shared domains, upload/deployment
      logs, and later access and download remain recoverable residual traces, and observers with finer telemetry or longer retention can limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入可信服务上的对象上传/配置、供应商域与证书借用，排除服务账户取得、资源攻陷、下游下载和执行。其兄弟边界是：NJS-0049-002 控制内容对不同访问者的显露；本子技术借用可信服务外层信誉；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes object upload/configuration on trusted services and provider domain and certificate borrowing and excludes service-account acquisition, resource compromise,
      and downstream download and execution. Its sibling boundary is that NJS-0049-002 controls content exposure across visitors; this child borrows outer trusted-service reputation;
      inclusion requires adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary
      content and account activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 云、PaaS、对象存储、代码托管和 Web 服务 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。共享域下新对象、上传/部署日志、后续访问和下载可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in cloud, paaS, object storage, code hosting, and web services and wants to change traces visible to victims,
        platforms, or analysts before first high-risk use. New objects under shared domains, upload/deployment logs, and later access and download may appear during preparation or after
        correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：攻击者控制可信服务租户或可上传位置。实施者还需持续控制用于在可信服务租户/对象层布置能力，同时保持供应商外层特征的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: the adversary controls a trusted-service tenant or upload location. The operator also needs sustained control of
          the configuration, timing, build, account, or third-party resources used to place capability at trusted-service tenant or object layers while preserving provider outer features.
          Resource loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到共享域下新对象、上传/部署日志、后续访问和下载；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see new objects under shared domains, upload/deployment logs, and later access and download; reliable identification requires authorized correlation
          across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 投放对象与合法对象共享供应商域、证书和协议，恶意差异只在租户/内容层显现
    en: Staged and legitimate objects share provider domains, certificates, and protocols, leaving malicious differences at tenant and content layers
  analysis:
    paragraphs:
    - zh: 投放对象与合法对象共享供应商域、证书和协议，恶意差异只在租户/内容层显现。攻击者通过在可信服务租户/对象层布置能力，同时保持供应商外层特征改变痕迹，使专用恶意托管表面变为共享可信服务中的对象；粗粒度信誉阻断失效，需提供方和对象/端点级关联。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Staged and legitimate objects share provider domains, certificates, and protocols, leaving malicious differences at tenant and content layers. The adversary changes traces
        through this operating principle: Place capability at trusted-service tenant or object layers while preserving provider outer features. As a result, a dedicated malicious hosting
        surface becomes an object inside a shared trusted service; coarse reputation blocking weakens, requiring provider and object or endpoint correlation. The design substitutes normal
        or trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature
        Disguise effect.'
  evidence_refs:
  - REF-000066
  confidence: high
