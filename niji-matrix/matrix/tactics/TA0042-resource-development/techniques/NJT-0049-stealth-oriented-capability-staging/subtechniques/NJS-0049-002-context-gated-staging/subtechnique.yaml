schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0049-002
parent_ref: NJT-0049
name:
  zh: 条件门控投放
  en: Context-Gated Staging
summary:
  zh: 将已投放资源配置为只在设备、地域、来源、会话或时间条件匹配时显露恶意内容。
  en: Configure staged resources to reveal malicious content only when device, geography, origin, session, or time conditions match.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 将已投放资源配置为只在设备、地域、来源、会话或时间条件匹配时显露恶意内容。其直接目标是减少公开暴露窗口并使单视角抓取获得正常、空白或替代响应，实现原则是在服务端投放配置中执行上下文判定并选择恶意或替代内容路径；这一边界描述可重复的匿迹变量，而不是特定工具、产品或偶然环境。
    en: Configure staged resources to reveal malicious content only when device, geography, origin, session, or time conditions match. Its direct objective is to reduce public exposure
      windows and give single-vantage crawlers benign, blank, or substitute responses, and its operating principle is to evaluate context in server-side staging configuration and select
      malicious or substitute content paths; this boundary describes a repeatable stealth variable rather than a specific tool, product, or accidental condition.
stealth_characteristics:
  paragraphs:
  - zh: 条件门控投放使稳定公开恶意内容变为按访问上下文短时显露的差异响应。对防守方的观察影响是单次抓取和广告审核易漏检，需授权多视点复现并关联服务端策略；与此同时，相同 URL 跨视点内容不同、特定画像触发重定向、极短暴露窗口仍是可恢复的残余痕迹，拥有更细粒度遥测或更长保留期的观察者可以限制效果。
    en: Context-Gated Staging changes traces so that stable public malicious content becomes differential responses briefly exposed by visitor context. The defender-observation effect
      is that one fetch and advertising review may miss content, requiring authorized multivantage reproduction and server-side policy correlation; at the same time, one URL differing
      across vantages, redirects triggered by specific profiles, and very short exposure windows remain recoverable residual traces, and observers with finer telemetry or longer retention
      can limit the effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入投放阶段设备/地域/来源/会话/时间门控、差异响应，排除能力代码内环境门控、普通 A/B 测试、下游执行。其兄弟边界是：NJS-0049-001 借用可信服务外观；本子技术控制已投放内容对不同访问者的显露；只有攻击者有意控制该稳定变量并产生相应痕迹变化时才纳入，合法运维、兼容性或普通内容与账户活动造成的相似现象不能单独证明分类。
    en: This child includes device/geography/origin/session/time gating during staging and differential responses and excludes environment gating inside capability code, ordinary A/B
      testing, and downstream execution. Its sibling boundary is that NJS-0049-001 borrows trusted-service appearance; this child controls staged-content exposure to different visitors;
      inclusion requires adversary control of the stable variable and the corresponding trace change, while similar effects from legitimate administration, compatibility, or ordinary
      content and account activity do not establish classification alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在 落地页、恶意广告、重定向服务、云函数和 Web 应用 中完成资源准备，并希望在首次高风险使用前改变目标、平台或分析者所见痕迹的场景。相同 URL 跨视点内容不同、特定画像触发重定向、极短暴露窗口可在准备阶段或与后续用途关联后出现，但下游操作本身不属于本子技术。
      en: This child applies when an adversary completes resource preparation in landing pages, malvertising, redirect services, cloud functions, and web applications and wants to change
        traces visible to victims, platforms, or analysts before first high-risk use. One URL differing across vantages, redirects triggered by specific profiles, and very short exposure
        windows may appear during preparation or after correlation with downstream use, but the downstream operation itself is outside this child.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：投放服务支持服务端条件和替代响应。实施者还需持续控制用于在服务端投放配置中执行上下文判定并选择恶意或替代内容路径的配置、时间、构建、账户或第三方资源。资源失效、平台处置、成本、工件复用和操作一致性都会限制实施；缺少这些能力时只会形成普通准备行为。
        en: 'The adversary must satisfy the following prerequisites: the staging service supports server-side conditions and substitute responses. The operator also needs sustained control
          of the configuration, timing, build, account, or third-party resources used to evaluate context in server-side staging configuration and select malicious or substitute content
          paths. Resource loss, provider enforcement, cost, artifact reuse, and operational consistency constrain implementation; without those capabilities, the activity is ordinary
          preparation.'
    defender_model:
      paragraphs:
      - zh: 防守方模型包括直接目标、资源或账户提供方以及能够保存长期谱系的分析者。直接目标可能只看到局部结果，其他观察者则可能看到相同 URL 跨视点内容不同、特定画像触发重定向、极短暴露窗口；可靠识别需要在合法授权和保留期内关联这些视角，并把正常相似行为纳入基线。
        en: The defender model includes the direct victim, the resource or account provider, and analysts able to retain long-horizon lineage. The direct victim may see only a local
          result while other observers may see one URL differing across vantages, redirects triggered by specific profiles, and very short exposure windows; reliable identification requires
          authorized correlation across those vantages and retention periods with legitimate lookalikes in the baseline.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 非匹配扫描器和审核员看不到恶意资源，既有单视角逻辑不触发
    en: Non-matching scanners and reviewers do not see the malicious resource, so existing single-vantage logic does not trigger
  analysis:
    paragraphs:
    - zh: 非匹配扫描器和审核员看不到恶意资源，既有单视角逻辑不触发。攻击者通过在服务端投放配置中执行上下文判定并选择恶意或替代内容路径改变痕迹，使稳定公开恶意内容变为按访问上下文短时显露的差异响应；单次抓取和广告审核易漏检，需授权多视点复现并关联服务端策略。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
      en: 'Non-matching scanners and reviewers do not see the malicious resource, so existing single-vantage logic does not trigger. The adversary changes traces through this operating
        principle: Evaluate context in server-side staging configuration and select malicious or substitute content paths. As a result, stable public malicious content becomes differential
        responses briefly exposed by visitor context; one fetch and advertising review may miss content, requiring authorized multivantage reproduction and server-side policy correlation.
        The design makes critical activity appear blank, low-signal, or normal under an existing observation model, preventing its analytic logic from firing; broader vantage or changed
        analysis conditions can still recover the difference, producing a Behavioral Transparency effect.'
  evidence_refs:
  - REF-000084
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 非匹配访问者获得正常或替代内容，使同一 URL 在局部呈现合法外观
    en: Non-matching visitors receive benign or substitute content, giving the same URL a locally legitimate appearance
  analysis:
    paragraphs:
    - zh: 非匹配访问者获得正常或替代内容，使同一 URL 在局部呈现合法外观。攻击者通过在服务端投放配置中执行上下文判定并选择恶意或替代内容路径改变痕迹，使稳定公开恶意内容变为按访问上下文短时显露的差异响应；单次抓取和广告审核易漏检，需授权多视点复现并关联服务端策略。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: 'Non-matching visitors receive benign or substitute content, giving the same URL a locally legitimate appearance. The adversary changes traces through this operating principle:
        Evaluate context in server-side staging configuration and select malicious or substitute content paths. As a result, stable public malicious content becomes differential responses
        briefly exposed by visitor context; one fetch and advertising review may miss content, requiring authorized multivantage reproduction and server-side policy correlation. The
        design substitutes normal or trusted features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships,
        producing a Feature Disguise effect.'
  evidence_refs:
  - REF-000084
  confidence: high
