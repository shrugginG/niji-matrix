research:
  limitations:
    paragraphs:
    - zh: 公开证据能够支持本子技术的稳定变量和所列痕迹变化，但不保证每个落地页、恶意广告、重定向服务、云函数和 Web 应用实例都具有相同匿迹意图或效果。能力代码内环境门控、普通 A/B 测试、下游执行可能产生局部相似现象，且提供方内部数据通常不公开；置信度应随直接准备证据、跨视角复现和正常基线的可得性调整。
      en: Public evidence supports this child's stable variable and stated trace change but does not establish identical stealth intent or effect in every instance of landing pages,
        malvertising, redirect services, cloud functions, and web applications. environment gating inside capability code, ordinary A/B testing, and downstream execution can produce
        locally similar effects, and provider-internal data is often unavailable; confidence should vary with direct preparation evidence, cross-vantage reproduction, and availability
        of a legitimate baseline.
