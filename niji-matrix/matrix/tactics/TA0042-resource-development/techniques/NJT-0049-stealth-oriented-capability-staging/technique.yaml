research:
  limitations:
    paragraphs:
    - zh: 现有证据直接支持候选行为和至少一个稳定匿迹变量，但对攻击者在每个实例中的主观目的、所有平台的同等效果以及提供方内部可见性并不完整。基础设施取得或攻陷、能力研发或外取、下游点击/下载/执行/C2、普通无匿迹投放也可能产生部分相似痕迹，因此结论必须保持在来源直接证明的行为、痕迹变化和观察模型内；新增子技术需要独立证据和防御差异。
      en: Current evidence directly supports the candidate behavior and at least one stable stealth variable, but does not fully establish adversary intent in every instance, equal effect
        across platforms, or provider-internal visibility. infrastructure acquisition or compromise, capability development or acquisition, downstream click/download/execution/C2, and
        ordinary staging without stealth can also create some similar traces, so conclusions must remain within behavior, trace change, and observation models directly supported by sources;
        any additional child requires independent evidence and defensive distinction.
