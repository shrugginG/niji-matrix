schema_version: 2.0.0
type: technique
id: NJT-0049
name:
  zh: 匿迹型能力投放
  en: Stealth-Oriented Capability Staging
summary:
  zh: 把已开发或取得的能力上传、安装或配置为后续可用状态，并通过可信服务表面降低准备和取用的可区分性。
  en: Upload, install, or configure developed or obtained capability into a later-usable state and use trusted service surfaces to reduce distinguishability of preparation and retrieval.
aliases:
- Stage Capabilities
classification:
  tactic_refs:
  - TA0042
  origin:
    kind: attack-adapted
    source_attack_id: T1608
    source_attack_version: '19.1'
  decision_ref: DEC-TA0042-T1608
definition_and_concept:
  paragraphs:
  - zh: 把已开发或取得的能力上传、安装或配置为后续可用状态，并通过可信服务表面降低准备和取用的可区分性。本技术的直接目标是在攻击准备阶段形成可供后续行动使用的资源或状态，而不是完成具体攻陷步骤、投递、执行、通信或其他下游行为；产品、介质和工具名称只有在承载稳定匿迹变量时才具有分类意义。
    en: Upload, install, or configure developed or obtained capability into a later-usable state and use trusted service surfaces to reduce distinguishability of preparation and retrieval.
      The direct objective is to create a resource or state for later operations during Resource Development rather than perform the compromise step, delivery, execution, communication,
      or another downstream behavior; products, media, and tool names matter only when they carry a stable stealth variable.
stealth_characteristics:
  paragraphs:
  - zh: 合法云、PaaS、对象存储或 Web 服务把外层域、TLS 和常见流量借给已投放对象，恶意性内移到租户与内容层。该对象仍会留下控制平面创建/上传/配置、共享域下异常对象、投放后下载/执行关系等痕迹；这些痕迹在资源提供方、资产所有者或构建与内容平台侧通常比后续目标侧更完整，因此跨视角和长期谱系可以限制匿迹效果。
    en: Legitimate cloud, PaaS, object storage, or Web services lend outer domain, TLS, and common traffic to staged objects, moving maliciousness into tenant and content layers. The
      object still leaves traces such as control-plane creation/upload/configuration, anomalous objects under shared domains, and download/execution relationships after staging; those
      traces are generally more complete at resource providers, asset owners, or build and content platforms than at downstream victims, so cross-vantage and long-horizon lineage can
      limit the stealth effect.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入把能力布置为可取用状态、在可信第三方服务上上传/配置对象、投放状态转换。它排除基础设施取得或攻陷、能力研发或外取、下游点击/下载/执行/C2、普通无匿迹投放，并与以下相邻对象明确区分：NJT-0051/NJT-0044 提供基础设施、NJT-0045/NJT-0048 提供能力来源。合法业务、测试、兼容性或运维行为只有在缺少攻击者控制的匿迹变量时属于正常相似行为，不能仅凭资源类别或单一异常纳入。
    en: This technique includes placing capability into a retrievable state, uploading/configuring objects on trusted third-party services, and staging-state transition. It excludes
      infrastructure acquisition or compromise, capability development or acquisition, downstream click/download/execution/C2, and ordinary staging without stealth and is distinguished
      because NJT-0051/NJT-0044 provide infrastructure and NJT-0045/NJT-0048 provide capability source. Legitimate business, testing, compatibility, or administration remains a normal
      lookalike when no adversary-controlled stealth variable is present, and resource class or one anomaly alone cannot qualify the behavior.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者在云/PaaS/对象存储、Web/代码托管/粘贴服务、已取得或攻陷基础设施中准备落地页、载荷、工具、证书与中转对象，并希望这些资源在首次高风险使用前获得较低可区分性或较高归因成本的场景。后续结果可以证明准备效果，但不能扩张本技术边界。
      en: This technique applies when adversaries prepare landing pages, payloads, tools, certificates, and relay objects in cloud/PaaS/object storage, web/code-hosting/paste services,
        and acquired or compromised infrastructure and want those resources to have lower distinguishability or higher attribution cost before first high-risk use. Downstream results
        may establish preparation effects but do not expand this technique boundary.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须满足以下前提：已有能力和可控基础设施/服务。实施者还需控制资源准备的时间、配置、关系或供应过程，并承担长期维护、跨平台协调、构建管理或第三方服务处置等成本；失去资源控制、可见工件复用和提供方审计都会削弱效果。
        en: 'The adversary must satisfy the following prerequisites: capability and controlled infrastructure or service already exist. The operator must also control timing, configuration,
          relationships, or supply during resource preparation and bear costs such as long-term maintenance, cross-platform coordination, build administration, or third-party enforcement;
          loss of resource control, reuse of visible artifacts, and provider audit reduce the effect.'
    defender_model:
      paragraphs:
      - zh: 防守方可能观察到控制平面创建/上传/配置、共享域下异常对象、投放后下载/执行关系，但不同观察者拥有的字段和保留期并不相同。可靠判断需要把目标侧记录与提供方、资产所有者、账户、构建、签名或控制平面遥测关联，并为合法相似行为保留基线；缺少跨组织授权时只能形成受限推断。
        en: Defenders may observe control-plane creation/upload/configuration, anomalous objects under shared domains, and download/execution relationships after staging, but fields
          and retention differ by vantage. Reliable judgment requires joining victim-side records with provider, asset-owner, account, build, signing, or control-plane telemetry and
          maintaining baselines for legitimate lookalikes; without authority for cross-organizational correlation, conclusions remain limited.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 可信服务的域、证书和协议使投放对象在粗粒度网络特征上接近合法内容
    en: Trusted-service domains, certificates, and protocols make staged objects resemble legitimate content at coarse network granularity
  analysis:
    paragraphs:
    - zh: 可信服务的域、证书和协议使投放对象在粗粒度网络特征上接近合法内容。该设计以正常或可信特征替代显著行动特征，使粗粒度分类失去区分力；防守方必须恢复更细粒度的行为和谱系关系，因而形成特征伪装效果。
      en: Trusted-service domains, certificates, and protocols make staged objects resemble legitimate content at coarse network granularity. The design substitutes normal or trusted
        features for conspicuous operational features, weakening coarse classification; defenders must recover finer behavioral and lineage relationships, producing a Feature Disguise
        effect.
  evidence_refs:
  - REF-000066
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 条件门控使非匹配扫描器与审核员无法看到恶意投放内容，绕过单视角观察逻辑
    en: Context gating prevents non-matching scanners and reviewers from seeing malicious staged content, bypassing single-vantage observation logic
  analysis:
    paragraphs:
    - zh: 条件门控使非匹配扫描器与审核员无法看到恶意投放内容，绕过单视角观察逻辑。该设计使关键活动在既有观察模型中表现为空白、低信号或正常行为，导致原有分析逻辑不触发；扩大观察面或改变分析条件仍可恢复差异，因而形成行为透明效果。
      en: Context gating prevents non-matching scanners and reviewers from seeing malicious staged content, bypassing single-vantage observation logic. The design makes critical activity
        appear blank, low-signal, or normal under an existing observation model, preventing its analytic logic from firing; broader vantage or changed analysis conditions can still recover
        the difference, producing a Behavioral Transparency effect.
  evidence_refs:
  - REF-000084
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立可信服务信誉借宿投放、条件门控投放两项匿迹子技术。它们分别以把对象放在合法共享服务内并保留供应商外层；由请求者、设备、地区、来源、会话或时间决定恶意对象是否显露为稳定划分变量；每项都会改变可见痕迹和防守观察，并需要不同的关联或控制能力。分类不按 ATT&CK 子技术、资源种类、产品、平台、内容媒介或工具拆分，两个变量可以组合但不能相互替代。
      en: This technique defines two evasion sub-techniques, Reputation-Borrowing Staging on Trusted Services and Context-Gated Staging. They respectively use placing objects inside
        a legitimate shared service while preserving its provider surface; using requester, device, geography, origin, session, or time to decide whether a malicious object is exposed
        as stable partition variables; each changes visible traces and defender observation and requires a different correlation or control capability. The taxonomy does not partition
        by ATT&CK children, resource type, product, platform, content medium, or tool, and the two variables may combine without substituting for one another.
  coverage: established
  subtechnique_refs:
  - NJS-0049-001
  - NJS-0049-002
