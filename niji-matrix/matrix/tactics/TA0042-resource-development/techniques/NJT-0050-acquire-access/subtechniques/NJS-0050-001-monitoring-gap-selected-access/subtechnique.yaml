research:
  limitations:
    paragraphs:
      - zh: ATT&CK 的访问经纪描述支持按价值、权限和环境条件选择入口，但公开事件很少披露卖方完整验证表或明确写出“缺少 EDR”是成交原因，因此监控条件参与筛选在部分活动中属于强推断。低监控位置也可能由资产遗留、部署失败或偶然配置造成。
        en: ATT&CK reporting on access brokers supports selection by value, privilege, and environmental conditions, but public incidents rarely disclose complete seller validation sheets or state explicitly that absent EDR caused a sale, so monitoring-aware selection remains strongly inferred in some activity. Weak monitoring may also result from legacy assets, deployment failure, or accidental configuration.
      - zh: 未来证据应区分卖方发现监控缺口、以其作为筛选条件、买方实际从该入口开始活动，以及防守方确实缺失关键遥测四个层级；缺少其中任一层级都会降低对特定事件的置信度。
        en: Future evidence should distinguish the seller discovering a monitoring gap, using it as a selection criterion, the buyer actually beginning through that foothold, and the defender truly lacking key telemetry; missing any layer should reduce confidence for a particular event.
