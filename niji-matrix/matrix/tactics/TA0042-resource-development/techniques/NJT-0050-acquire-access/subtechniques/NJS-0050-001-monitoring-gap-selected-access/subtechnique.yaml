schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0050-001
parent_ref: NJT-0050
name:
  zh: 监控缺口导向的访问筛选
  en: Monitoring-Gap-Selected Access
summary:
  zh: 在交付前按缺少安全监控、高权限或高价值信任位置筛选既有入口，使买方首次活动从低遥测位置开始。
  en: Select existing footholds before handoff by absent security monitoring, high privilege, or valuable trust position so the buyer's first activity begins in a low-telemetry location.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 监控缺口导向的访问筛选是卖方或经纪在交付已验证目标入口前，根据 EDR 部署、日志覆盖、权限级别或信任位置评估并选择立足点的资源准备方法。其直接目标是把可用访问交给买方的同时，让首次买方活动发生在防守方预先存在的观测薄弱处。
      en: Monitoring-Gap-Selected Access is a resource-preparation method in which a seller or broker evaluates and selects a verified victim foothold by EDR deployment, log coverage, privilege level, or trust position before handoff. Its immediate objective is to deliver usable access while placing the buyer's first activity in a pre-existing weak point in defender observation.
    - zh: 该概念以交付前的监控条件筛选为稳定变量，而不是以 VPN、远程桌面、Web shell 或账户等入口类型为变量。仅知道资产缺少监控、但没有据此筛选和交付入口，不足以构成本子技术；交付后的规避动作属于后续行为。
      en: The stable variable is pre-handoff selection by monitoring conditions rather than foothold type such as VPN, remote desktop, Web shell, or account. Merely knowing that an asset lacks monitoring is insufficient without selecting and handing off access on that basis; post-handoff evasion is downstream behavior.
stealth_characteristics:
  paragraphs:
    - zh: 监控缺口导向的访问筛选使买方从缺少端点代理、身份审计不足、网络边界薄弱或具有过度权限的位置开始行动。入口形成痕迹由卖方产生，而首次买方活动又落在低遥测资产，导致目标既缺少相邻的买方前置信号，也可能无法记录关键主机行为。
      en: Monitoring-Gap-Selected Access places the buyer on a system without an endpoint agent, with weak identity audit, thin network coverage, or excessive privilege. The seller produced foothold-creation traces and first buyer activity occurs on a low-telemetry asset, so the victim lacks adjacent buyer-side preceding signals and may also fail to record key host behavior.
    - zh: 残余痕迹包括资产监控覆盖清单、经纪对监控条件的描述、身份和远程服务首次使用、来自相邻网络设备的流量以及迟到的高权限操作。若组织能持续核对关键资产是否纳管，并把外部访问情报映射到具体入口，筛选所得的盲点会缩小。
      en: Residual traces include asset coverage inventories, broker descriptions of monitoring conditions, first use in identity and remote-service logs, traffic from adjacent network devices, and delayed privileged actions. Continuous verification that critical assets are monitored and mapping external access intelligence to concrete footholds narrows the selected blind spot.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入卖方或经纪对有效入口进行 EDR、日志、权限或信任位置评估，并以该评估结果决定向买方交付哪个目标入口。判定需要能够证明或有强证据表明监控条件参与了筛选，而不是事后发现入口恰好位于低监控资产。
      en: This child includes seller or broker evaluation of EDR, logging, privilege, or trust position for usable footholds and use of that evaluation to decide which victim access to deliver. Classification requires proof or strong evidence that monitoring conditions informed selection rather than a post hoc finding that the foothold happened to be weakly monitored.
    - zh: 普通高权限访问、偶然缺少日志、买方交付后关闭安全工具和未验证凭据清单不属于本子技术。经纪主体分工归兄弟项 NJS-0050-002，时间休眠归 NJS-0050-003，活动认证状态交付归 NJS-0050-004。
      en: Ordinary privileged access, accidental logging gaps, buyer-side disabling of security tools after handoff, and unverified credential lists are outside this child. Broker actor segmentation belongs to sibling NJS-0050-002, temporal dormancy to NJS-0050-003, and live authentication-state transfer to NJS-0050-004.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本子技术适用于初始访问经纪掌握同一组织的多个入口，或能够为买方验证端点防护、日志状态、权限和网络位置的场景。攻击者可优先选择缺少 EDR 的服务器、审计薄弱的远程服务、高权限会话或位于供应链信任位置的入口，以降低首次使用被立即识别的概率。
        en: This child applies when an initial-access broker controls multiple footholds in one organization or can validate endpoint protection, logging status, privilege, and network position for a buyer. The adversary may prefer a server without EDR, a weakly audited remote service, a privileged session, or a foothold in a supply-chain trust position to reduce the chance that first use is immediately recognized.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 卖方需要能够测试入口、观察或推断安全工具与日志覆盖，并把结果可靠传递给买方；买方需要相信或复核这些声明。主动验证可能暴露入口，覆盖状态也会随部署变化而失效，因此攻击者必须在信息新鲜度和验证风险之间权衡。
          en: The seller needs to test access, observe or infer security-tool and logging coverage, and communicate results reliably to the buyer; the buyer must trust or revalidate those claims. Active validation may expose the foothold and coverage status can change with deployment, forcing a tradeoff between freshness and validation risk.
    defender_model:
      paragraphs:
        - zh: 防守方需要掌握资产所有权、EDR 与日志覆盖、远程入口、权限和首次使用记录，并能识别关键资产从纳管状态中脱落。若低监控资产本身没有本地日志，只能依赖身份提供方、网络路径、管理平面和外部访问情报进行间接关联。
          en: The defender needs asset ownership, EDR and log coverage, remote footholds, privilege, and first-use records and must identify critical assets that fall out of managed coverage. When the weakly monitored asset has no local history, correlation depends on identity-provider, network-path, management-plane, and external access intelligence.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 按监控覆盖筛选并交付入口，使首次买方活动发生在有效观测或告警范围之外
      en: Select and hand off footholds by monitoring coverage so first buyer activity occurs outside effective observation or alerting scope
    analysis:
      paragraphs:
        - zh: 卖方在多个入口中评估 EDR、日志、权限和信任位置，并把低覆盖立足点交给买方。行为设计改变的不是恶意操作内容，而是操作发生的观察位置；首次买方行为因此缺少端点或身份记录，或进入没有相应检测逻辑的高权限路径。防守方只能从相邻网络、管理平面、覆盖清单和迟到的结果反推活动，关键行为看不见或未触发告警，从而形成行为透明效果。
          en: The seller evaluates EDR, logging, privilege, and trust position across footholds and gives the buyer a low-coverage position. The design changes the observation location rather than the content of malicious activity; first buyer behavior consequently lacks endpoint or identity records or enters a privileged path without matching detection logic. Defenders can infer the activity only from adjacent network, management-plane, coverage-inventory, and delayed outcome signals, leaving key behavior unseen or unalerted and producing a Behavioral Transparency effect.
    evidence_refs:
      - REF-000058
    confidence: high
