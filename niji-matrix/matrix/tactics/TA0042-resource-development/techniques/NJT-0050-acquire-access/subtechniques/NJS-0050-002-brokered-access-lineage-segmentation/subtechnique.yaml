schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0050-002
parent_ref: NJT-0050
name:
  zh: 经纪化访问谱系分段
  en: Brokered Access-Lineage Segmentation
summary:
  zh: 由经纪或伙伴建立、验证并交付入口，使初始攻陷与买方使用分属不同操作者、工具、组织边界和时间段。
  en: Have a broker or partner establish, validate, and hand off a foothold so initial compromise and buyer use belong to different operators, tools, organizational boundaries, and time segments.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 经纪化访问谱系分段是卖方、经纪或伙伴完成目标入口的建立与验证，再把可用访问交付给另一买方或行动单元的资源准备方法。初始攻陷、访问库存、交易交付和首次买方使用由不同主体承担，其直接目标是分工获取目标特定入口并降低买方自行建立入口的需要。
      en: Brokered Access-Lineage Segmentation is a resource-preparation method in which a seller, broker, or partner establishes and validates a victim foothold and then delivers usable access to another buyer or operational unit. Initial compromise, access inventory, transaction handoff, and first buyer use are performed by different actors, with the immediate objective of obtaining target-specific access through division of labor rather than buyer-created entry.
    - zh: 该概念以操作者与组织谱系的分段为稳定变量。单一主体延迟使用自己的入口不构成本子技术，普通凭据购买也不足够；必须存在已经验证的目标访问权在不同主体之间交付，而买方后续操作在交付边界之后开始。
      en: The stable variable is segmentation of operator and organizational lineage. One actor delaying use of its own foothold does not qualify, and ordinary credential purchase is insufficient; verified victim access must be handed between distinct actors, with buyer-side operations beginning after that boundary.
stealth_characteristics:
  paragraphs:
    - zh: 经纪化访问谱系分段使目标侧初始攻陷痕迹与后续活动呈现不同来源、工具、时间和操作习惯。短窗口调查可能把卖方活动视为已经结束的事件，又把买方首次使用视为没有来源的新异常，难以从任一片段确认完整操作者谱系。
      en: Brokered Access-Lineage Segmentation causes initial-compromise and follow-on traces at the victim to show different origins, tools, times, and operating patterns. A short-window investigation may treat seller activity as a closed incident and buyer first use as a new anomaly without provenance, making the complete operator lineage difficult to establish from either fragment.
    - zh: 市场清单、交易记录、卖方验证、受感染设备状态、入口标识以及目标首次使用仍能连接这些阶段。若私下交易不留记录、组织只保留短期日志或不同团队分别处理身份与端点事件，谱系分段的匿迹效果更强。
      en: Market listings, transaction records, seller validation, infected-device state, foothold identifiers, and victim first use can still connect the stages. The effect is stronger when private deals leave no records, the organization retains only short-term logs, or separate teams handle identity and endpoint events.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入不同主体之间对已验证目标入口的建立、验证、库存、转售或伙伴交付，只覆盖从卖方入口形成到买方接收的谱系分段。判定必须存在可区分的卖方与买方或行动单元，而不是同一主体内部普通任务分工。
      en: This child includes establishment, validation, inventory, resale, or partner handoff of verified victim access between distinct actors and covers lineage segmentation from seller-created access through buyer receipt. Classification requires distinguishable seller and buyer actors or operational units rather than ordinary task assignment inside one actor.
    - zh: 未验证凭据清单、通用能力供应链和买方交付后的目标操作不属于本子技术。按监控覆盖选择入口属于 NJS-0050-001，核心变量为时间静默的自有或经纪入口属于 NJS-0050-003，交付认证设备状态属于 NJS-0050-004。
      en: Unverified credential lists, generic capability supply chains, and buyer actions in the victim after handoff are outside this child. Selection by monitoring coverage belongs to NJS-0050-001, a self-held or brokered foothold whose core variable is temporal silence to NJS-0050-003, and transfer of authentication-device state to NJS-0050-004.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本子技术适用于访问经纪向勒索软件或其他行动方出售企业入口、犯罪伙伴共享已建立立足点，或专门感染与状态采集服务把访问交给独立买方的场景。买方希望从已完成验证的入口开始，而卖方不参与后续目标操作。
        en: This child applies when an access broker sells enterprise footholds to ransomware or other operators, criminal partners share established access, or a dedicated infection and state-collection service hands access to an independent buyer. The buyer seeks to begin from validated access while the seller does not participate in later victim operations.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要具有卖方、经纪、市场或伙伴交付关系，并能传递足以验证目标、入口类型、权限和有效性的材料。分工带来交易欺诈、入口被重复出售、卖方监控和执法渗透风险，买方还可能为复核入口而重新产生可见痕迹。
          en: The adversary needs a seller, broker, market, or partner handoff relationship and must transfer enough material to validate victim, foothold type, privilege, and continued usability. Division of labor introduces transaction fraud, duplicate sale, seller surveillance, and law-enforcement infiltration risk, and buyer revalidation may create new visible traces.
    defender_model:
      paragraphs:
        - zh: 防守方需要保留入口形成、完整性、身份和首次使用历史，并能消费外部市场或执法情报。只查看最近会话或单一工具无法恢复谱系；跨团队事件编号、资产和账户标识以及长期时间线是连接卖方与买方的关键。
          en: The defender needs retained foothold-creation, integrity, identity, and first-use history and the ability to consume external market or law-enforcement intelligence. Recent sessions or one tool family cannot recover lineage; cross-team incident identifiers, asset and account identifiers, and long-horizon timelines are key to joining seller and buyer.
stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 将初始攻陷、入口验证、交易交付和买方使用分散到不同主体与时间，使单一窗口只呈现访问链片段
      en: Distribute initial compromise, foothold validation, transaction handoff, and buyer use across actors and time so one window shows only fragments of the access chain
    analysis:
      paragraphs:
        - zh: 卖方完成入口建立与验证，市场或伙伴完成交付，买方在另一时间和工具环境中首次使用。行为设计把原本连续的初始访问过程分散到不同主体、组织边界和时间窗口；目标日志中的来源与工具关系断裂，外部交易证据又位于目标视野之外，局部分析只能看到卖方或买方片段。防守方必须跨时间连接入口标识、市场情报和首次使用才能恢复全链，因而事件关联和操作者归因成本上升。
          en: The seller creates and validates the foothold, a market or partner performs handoff, and the buyer first uses it at another time and with another tool environment. This design distributes an otherwise continuous initial-access process across actors, organizational boundaries, and time windows; origin and tool relationships break in victim logs while external transaction evidence sits outside victim visibility, leaving local analysis with only seller or buyer fragments. Defenders must connect foothold identifiers, market intelligence, and first use across time to recover the chain, increasing event-correlation and operator-attribution cost.
    evidence_refs:
      - REF-000058
      - REF-000069
    confidence: high
