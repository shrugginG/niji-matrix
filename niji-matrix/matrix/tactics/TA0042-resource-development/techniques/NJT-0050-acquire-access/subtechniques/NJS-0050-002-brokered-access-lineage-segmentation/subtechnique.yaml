research:
  limitations:
    paragraphs:
      - zh: ATT&CK 直接支持访问经纪与伙伴交付，Genesis Market 案例直接支持感染、状态采集、销售和买方使用的主体分段，但公开材料通常不披露完整买方身份或每次首次使用时间。因此子技术存在性置信度高，具体案件的全谱系归因仍可能不完整。
        en: ATT&CK directly supports access-broker and partner handoff, and the Genesis Market case directly supports actor segmentation across infection, state collection, sale, and buyer use, but public reporting usually withholds complete buyer identity or each first-use time. Confidence in child existence is high, while full lineage attribution for an individual case may remain incomplete.
      - zh: 合法托管服务、外包运维和跨组织事件响应也会产生多主体分段。分类必须同时验证访问未获授权、入口针对具体目标并在交付后被另一行动方使用，不能只因工具或来源变化而判定。
        en: Legitimate managed services, outsourced administration, and cross-organizational incident response also produce multi-actor segmentation. Classification must validate unauthorized access, a victim-specific foothold, and use by another operator after handoff rather than infer from tool or origin change alone.
