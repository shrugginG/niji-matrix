schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0050-003
parent_ref: NJT-0050
name:
  zh: 休眠入口再激活
  en: Dormant Foothold Reactivation
summary:
  zh: 让已建立、囤积或交付的入口长期保持静默，再在原始攻陷遥测衰减或超出常见关联窗口后由买方激活。
  en: Keep an established, stockpiled, or handed-off foothold silent and let the buyer activate it after original-compromise telemetry has decayed or fallen outside common correlation windows.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 休眠入口再激活是攻击者或访问经纪在入口已经建立并保持有效后，主动延迟首次买方使用，使入口在一段低活动或无活动时期后重新出现的资源准备方法。其直接目标是把入口形成、交付和首次买方活动拉开到不同观察与日志留存窗口。
      en: Dormant Foothold Reactivation is a resource-preparation method in which an adversary or access broker deliberately delays first buyer use after a foothold has been established and remains valid, causing access to reappear after a period of low or no activity. Its immediate objective is to separate foothold creation, handoff, and first buyer activity across observation and log-retention windows.
    - zh: 稳定变量是同一有效入口在形成与首次买方激活之间的有意静默时间。普通排期延迟、入口失效后重新攻陷或基础设施注册后的信誉老化不属于本子技术；必须能够保持目标特定访问权，而不是只保持域名或服务器资源。
      en: The stable variable is deliberate silence between creation and first buyer activation of the same valid foothold. Ordinary scheduling delay, re-compromise after access expires, or reputation aging after infrastructure registration is outside this child; target-specific access itself, rather than only a domain or server resource, must remain usable.
stealth_characteristics:
  paragraphs:
    - zh: 休眠入口再激活把紧邻初始攻陷的后续活动变为长时间静默后的孤立使用。若原始钓鱼、利用、恶意软件或完整性告警已经超出保留期，防守方可能只看到一个陈旧账户、后门或远程服务突然恢复活动，而缺少解释其来源的前置证据。
      en: Dormant Foothold Reactivation changes follow-on activity adjacent to initial compromise into isolated use after prolonged silence. If original phishing, exploitation, malware, or integrity alerts have passed beyond retention, defenders may see only an old account, backdoor, or remote service resume activity without preceding evidence explaining its origin.
    - zh: 入口存活检查、账户或服务状态、周期性信号、卖方库存记录和首次使用仍可能暴露休眠链；密钥轮换、会话到期、补丁和资产退役也可能使入口失效。匿迹效果取决于静默期是否超过防守关联能力，而不是时间经过本身。
      en: Foothold health checks, account or service state, periodic signals, seller inventory records, and first use may still expose the dormant chain; key rotation, session expiry, patching, and asset retirement may invalidate access. The effect depends on silence exceeding defender correlation capability rather than on elapsed time alone.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入已验证目标入口在囤积或交付前后保持低活动或无活动，并在仍然有效的情况下延迟由买方首次使用。判定需要同一入口、可证实静默期和之后的再激活，以及静默对日志留存或关联造成的实际影响。
      en: This child includes a verified victim foothold kept at low or no activity during stockpiling or handoff and delayed until first buyer use while still valid. Classification requires the same foothold, a demonstrable silent period and later reactivation, and an actual effect of silence on log retention or correlation.
    - zh: 普通项目延期、用户长期未登录、维护窗口、休眠基础设施、入口失效后的重新攻击和交付后的低速操作不在本子技术内。操作者分段属于 NJS-0050-002，监控覆盖筛选属于 NJS-0050-001，认证状态交付属于 NJS-0050-004。
      en: Ordinary project delay, long user absence, maintenance windows, dormant infrastructure, renewed attack after access expiry, and low-rate post-handoff operation are outside this child. Operator segmentation belongs to NJS-0050-002, monitoring-coverage selection to NJS-0050-001, and authentication-state transfer to NJS-0050-004.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本子技术适用于经纪长期库存仍有效的 VPN、远程服务、账户、Web shell 或后门，并在找到买方或行动窗口后才激活的场景。攻击者希望原始入口形成事件与后续首次使用不再落入同一调查窗口，同时愿意承担入口在等待期间被修复或失效的风险。
        en: This child applies when a broker holds still-valid VPN, remote-service, account, Web shell, or backdoor access in inventory and activates it only after finding a buyer or operational window. The adversary seeks to keep original foothold-creation events and later first use out of the same investigation window while accepting the risk that access is remediated or expires while waiting.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要能够长期保持入口有效并判断何时激活，同时避免频繁健康检查产生明显活动。访问形式必须允许令牌、凭据、后门或远程服务跨过静默期；补丁、轮换、条件访问、资产变更和原用户活动都会降低成功率。
          en: The adversary needs to preserve access over time, decide when to activate it, and avoid frequent health checks that create conspicuous activity. The access form must let tokens, credentials, backdoors, or remote services survive the silent period; patching, rotation, conditional access, asset changes, and original-user activity reduce success.
    defender_model:
      paragraphs:
        - zh: 防守方需要长期保留入口完整性、账户状态、远程服务与网络历史，并对长时间未使用但仍有效的访问进行周期复核。若保留期短于囤积周期、资产没有完整性基线或入口检查发生在不可见位置，首次再激活将难以与原始攻陷关联。
          en: The defender needs long-term foothold-integrity, account-state, remote-service, and network history and periodic review of long-unused but still-valid access. If retention is shorter than stockpiling, assets lack integrity baselines, or health checks occur in an unseen location, first reactivation is difficult to join to original compromise.
stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 以有意静默把入口形成与首次买方使用分离到不同留存窗口，使局部时间线无法连接完整访问链
      en: Use deliberate silence to separate foothold creation and first buyer use across retention windows so a local timeline cannot connect the complete access chain
    analysis:
      paragraphs:
        - zh: 已建立入口在囤积或交付阶段保持低活动，买方直到较晚行动窗口才进行首次使用。行为设计把原本相邻的入口形成与后续活动沿时间轴分开；原始攻陷信号可能在再激活前过期，短窗口分析只看到孤立的陈旧入口使用。防守方需要跨越更长周期保留状态并验证同一入口，若无法关联，完整访问链变得难以厘清，从而形成时空释痕效果。
          en: An established foothold remains low-activity during stockpiling or handoff and is first used by the buyer only in a later operational window. The design separates otherwise adjacent foothold creation and follow-on activity along time; original-compromise signals may expire before reactivation, leaving short-window analysis with isolated use of old access. Defenders must retain state over a longer horizon and verify the same foothold; without that correlation, the complete access chain becomes difficult to reconstruct, producing Spatiotemporal Trace Dilution.
    evidence_refs:
      - REF-000058
      - REF-000069
    confidence: medium
