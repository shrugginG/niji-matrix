research:
  limitations:
    paragraphs:
      - zh: 公开来源支持访问经纪能够库存、出售并转移访问资源，但很少给出证明攻击者有意等待日志过期的卖方或买方记录。时间变量和防御差异成立，主观匿迹目的与具体静默长度仍属强推断，因此整体置信度为中等。
        en: Public sources support brokers inventorying, selling, and transferring access resources but rarely provide seller or buyer records proving deliberate waiting for log expiry. The temporal variable and defensive distinction are supported, while subjective stealth intent and exact dormancy remain strongly inferred, so overall confidence is medium.
      - zh: 合法用户休假、灾难恢复账户、季节性系统和延迟项目也会在长静默后恢复活动。可靠判断需要验证入口此前未获授权、静默前后为同一立足点，并把再激活与经纪或其他攻击证据关联。
        en: Legitimate user absence, disaster-recovery accounts, seasonal systems, and delayed projects also resume after long silence. Reliable judgment requires validating prior unauthorized access, the same foothold across silence, and correlation of reactivation with broker or other adversary evidence.
