research:
  limitations:
    paragraphs:
      - zh: Genesis Market 执法材料直接证明凭据、Cookie 与设备指纹被打包出售，Microsoft 直接说明被盗令牌和 Cookie 可以在另一浏览器重放并继承已完成 MFA 的状态，因此行为与特征变化证据较强。但公开材料不总能区分买方是否重放完整浏览器环境或只使用部分凭据。
        en: Law-enforcement reporting on Genesis Market directly establishes packaged sale of credentials, cookies, and device fingerprints, and Microsoft directly explains that stolen tokens and cookies can be replayed in another browser while inheriting MFA-completed state, providing strong evidence for behavior and feature change. Public reports do not always distinguish whether a buyer replays a complete browser environment or only part of the material.
      - zh: 合法设备迁移、漫游网络、会话恢复和无密码认证也可能缺少新的密码或 MFA 事件。可靠判断需要令牌签发与使用谱系、设备绑定、来源变化和用户连续性，而不能把“没有新 MFA”单独视为攻击。
        en: Legitimate device migration, roaming networks, session restoration, and passwordless authentication may also lack a new password or MFA event. Reliable judgment requires token issuance and use lineage, device binding, origin change, and user continuity rather than treating absence of new MFA alone as malicious.
