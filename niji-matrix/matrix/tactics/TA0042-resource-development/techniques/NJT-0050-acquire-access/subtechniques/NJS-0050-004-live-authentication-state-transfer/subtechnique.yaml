schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0050-004
parent_ref: NJT-0050
name:
  zh: 活动认证状态交付
  en: Live Authentication-State Transfer
summary:
  zh: 将仍有效的令牌、Cookie、浏览器状态和设备指纹与入口一并交付，使买方继承已有认证环境而减少新登录信号。
  en: Transfer still-valid tokens, cookies, browser state, and device fingerprints with a foothold so the buyer inherits an existing authenticated environment and reduces new-sign-in signals.
aliases:
  - Live Session State Transfer
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 活动认证状态交付是卖方或经纪把仍有效的会话令牌、Cookie、浏览器资料和设备指纹作为已验证访问权的一部分交给买方，使买方能够在有效期内恢复或重放原有认证环境的资源准备方法。其直接目标是交付“当前可用的认证状态”，而不是只交付密码或等待买方重新认证。
      en: Live Authentication-State Transfer is a resource-preparation method in which a seller or broker gives a buyer still-valid session tokens, cookies, browser profiles, and device fingerprints as part of verified access, allowing the buyer to restore or replay the existing authenticated environment while it remains valid. Its immediate objective is to deliver current usable authentication state rather than only a password that requires fresh authentication.
    - zh: 该概念以可移植且仍有效的认证与设备状态为稳定变量。状态最初如何被窃取属于前置行为，买方重放后在目标内执行什么属于后续行为；失效 Cookie、普通凭据清单和仅描述设备属性的情报不构成本子技术。
      en: The stable variable is portable authentication and device state that remains valid. How the state was originally stolen is preceding behavior and what the buyer does in the victim after replay is downstream; expired cookies, ordinary credential lists, and intelligence that only describes device attributes do not qualify.
stealth_characteristics:
  paragraphs:
    - zh: 活动认证状态交付用既有会话续用替代买方的新密码登录和 MFA 挑战，并可复制原设备或浏览器的可见特征。身份系统可能看到一个已经认证的令牌继续活动，而不是新的认证仪式，因此基于密码失败、MFA 提示、新设备注册或首次 Cookie 的规则获得更少信号。
      en: Live Authentication-State Transfer replaces a buyer's new password sign-in and MFA challenge with continuation of an existing session and may reproduce visible features of the original device or browser. The identity system may see an already authenticated token continue rather than a fresh authentication ceremony, leaving rules based on password failure, MFA prompts, new-device enrollment, or first cookies with fewer signals.
    - zh: 状态交付仍会留下令牌谱系、来源与地理突变、设备绑定差异、并发使用、浏览器环境不一致和持续访问风险。令牌过期、通道或设备绑定、重新认证与快速撤销会限制匿迹效果；若真实设备环境也被完整控制，检测难度进一步提高。
      en: State transfer still leaves token lineage, origin and geography changes, device-binding differences, concurrent use, browser-environment inconsistency, and continuous-access risk. Token expiry, channel or device binding, reauthentication, and rapid revocation limit the effect; detection becomes harder if the genuine device environment is fully controlled as well.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入与已验证目标访问权一起交付可重放的有效令牌、Cookie、浏览器资料或设备指纹，并由这些状态减少买方重新认证需求。判定应证明材料在交付时仍有效且用于恢复既有会话，而不是仅存在被盗认证数据。
      en: This child includes delivery of replayable valid tokens, cookies, browser profiles, or device fingerprints with verified victim access where that state reduces the buyer's need to reauthenticate. Classification should establish that the material remained valid at handoff and restored an existing session rather than merely existed as stolen authentication data.
    - zh: 令牌窃取、信息窃取恶意软件、密码购买、MFA 疲劳以及重放后的目标操作不属于本子技术。卖方与买方主体分段属于 NJS-0050-002，按覆盖条件筛选属于 NJS-0050-001，核心变量为时间静默的入口属于 NJS-0050-003。
      en: Token theft, information-stealing malware, password purchase, MFA fatigue, and victim operations after replay are outside this child. Seller-buyer actor segmentation belongs to NJS-0050-002, selection by coverage conditions to NJS-0050-001, and a foothold whose core variable is temporal silence to NJS-0050-003.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本子技术适用于犯罪市场或伙伴把感染设备的凭据、Cookie、令牌和设备指纹打包出售，或把已经完成 MFA 的云会话交付给买方的场景。攻击者希望在会话有效期内访问邮件、云应用或其他服务，同时避免重新触发完整身份验证和反欺诈流程。
        en: This child applies when criminal markets or partners package credentials, cookies, tokens, and device fingerprints from infected systems for sale or deliver cloud sessions that already completed MFA. The adversary seeks access to mail, cloud applications, or other services while the session remains valid without repeating the full authentication and anti-fraud flow.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要获得仍有效且可移植的认证材料，并能够在浏览器、代理或设备环境中恢复相应状态。令牌受众、通道绑定、设备密钥、IP 与地理条件、过期时间和持续风险评估都会限制重放；卖方验证状态的动作也可能产生额外遥测。
          en: The adversary needs still-valid portable authentication material and the ability to restore matching state in a browser, proxy, or device environment. Token audience, channel binding, device keys, IP and geography conditions, expiry, and continuous risk evaluation constrain replay; seller validation may also produce extra telemetry.
    defender_model:
      paragraphs:
        - zh: 防守方需要令牌签发与使用、设备标识、浏览器会话、来源网络、并发状态和风险评估记录，而不仅是登录成功事件。若服务只保留认证时刻、不记录令牌后续使用，或攻击者控制真实设备，身份连续性分析会失去关键区分信号。
          en: The defender needs token issuance and use, device identifiers, browser sessions, source networks, concurrency, and risk-evaluation records rather than only successful sign-ins. If the service retains only authentication time and not later token use, or the adversary controls the genuine device, identity-continuity analysis loses key discriminators.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 以原用户令牌、Cookie 和设备特征替代新认证，使买方会话在身份与设备外观上接近既有合法会话
      en: Substitute original-user tokens, cookies, and device features for fresh authentication so buyer sessions resemble established legitimate sessions in identity and device appearance
    analysis:
      paragraphs:
        - zh: 卖方将有效认证材料与浏览器或设备状态成套交给买方，买方直接恢复现有会话。行为设计把新的密码与 MFA 流程替换为原令牌续用，并复制部分设备和浏览器特征；身份系统因此观察到的实体更接近原用户会话，基于新认证和新设备的恶意分类信号减弱。令牌谱系、来源变化、并发使用和绑定失败仍能区分重放，所以这是特征伪装而不是数据消失。
          en: The seller packages valid authentication material with browser or device state and gives it to the buyer, who restores the existing session directly. The design replaces a new password and MFA flow with continuation of the original token and copies some device and browser features; the entity observed by the identity system therefore more closely resembles the original user's session, weakening malicious classification signals based on fresh authentication and new devices. Token lineage, origin change, concurrent use, and binding failure can still distinguish replay, so this is Feature Disguise rather than trace disappearance.
    evidence_refs:
      - REF-000069
      - REF-000070
    confidence: high
