research:
  limitations:
    paragraphs:
      - zh: ATT&CK 能够证明目标访问权被经纪、购买或交换，司法材料能够证明认证状态与设备指纹被市场化，但公开报道通常缺少卖方验证日志、交易记录和买方首次使用的完整联合时间线。因此父技术与活动认证状态交付证据较强，而监控缺口筛选和经纪谱系的具体匿迹意图部分依赖强推断。
        en: ATT&CK establishes that victim access is brokered, purchased, or exchanged, and law-enforcement reporting establishes markets for authentication state and device fingerprints, but public reporting rarely supplies a complete joined timeline of seller validation, transaction records, and buyer first use. Evidence is therefore strong for the parent and Live Authentication-State Transfer, while specific stealth intent for monitoring-gap selection and brokered lineage partly relies on strong inference.
      - zh: 休眠入口再激活具有清晰的时间变量和防御差异，但现有来源主要证明访问能够被库存与转售，尚不能普遍证明攻击者有意等待日志过期，因此保持中等置信度。合法外包、应急访问和并购交接也会产生相似分段，可靠判断必须验证未授权性、目标特定入口与后续使用。
        en: Dormant Foothold Reactivation has a clear temporal variable and defensive distinction, but current sources primarily show that access can be inventoried and resold rather than universally proving deliberate waiting for log expiry, so confidence remains medium. Legitimate outsourcing, emergency access, and merger handoff also produce similar segmentation; reliable judgment requires validation of unauthorized status, target-specific access, and later use.
