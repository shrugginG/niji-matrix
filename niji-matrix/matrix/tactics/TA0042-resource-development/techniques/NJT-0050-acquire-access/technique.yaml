schema_version: "2.0.0"
type: technique
id: NJT-0050
name:
  zh: 获取访问权
  en: Acquire Access
summary:
  zh: 购买、交换或通过伙伴取得已经存在且经验证的目标系统或网络入口，并通过转移入口形成痕迹、筛选监控缺口、分段谱系或交付认证状态降低后续行动的可观察性与可归因性。
  en: Purchase, exchange, or receive through partners an existing verified foothold into a victim system or network and reduce later observability or attribution by displacing foothold-creation traces, selecting monitoring gaps, segmenting lineage, or transferring authentication state.
aliases:
  - Initial Access Broker Handoff
classification:
  tactic_refs:
    - TA0042
  origin:
    kind: attack-retained
    source_attack_id: T1650
    source_attack_version: "19.1"
  decision_ref: DEC-TA0042-T1650
definition_and_concept:
  paragraphs:
    - zh: 获取访问权是攻击者在资源准备阶段，通过购买、交换、经纪或伙伴交付取得已经存在且经验证的目标系统或网络入口，并将其准备为后续行动资源的技术。入口可以表现为有效会话、远程服务、Web shell、后门或其他可用立足点，但技术身份由“目标特定的既有访问权被取得”确定，而不是由凭据、工具或入口介质确定。
      en: Acquire Access is a Resource Development technique in which an adversary purchases, exchanges, brokers, or receives through partners an existing verified foothold into a victim system or network and prepares it as a resource for later operations. The foothold may be an active session, remote service, Web shell, backdoor, or another usable entry point, but the technique is defined by acquisition of target-specific existing access rather than by credentials, tools, or foothold medium.
    - zh: 本技术的直接目标是获得可交付、可验证且在交付时仍有效的入口，使买方无需重新执行形成入口的全部扫描、钓鱼或利用活动。卖方如何最初建立入口属于前置行为，买方交付后如何登录、横移、执行或持久化属于后续行为；取得通用凭据或能力而没有已验证目标入口也不属于本技术。
      en: The immediate objective is to obtain a deliverable, validated foothold that remains usable at handoff, so the buyer need not repeat all scanning, phishing, or exploitation used to create access. How the seller originally established the foothold is preceding behavior, and how the buyer later logs on, moves laterally, executes, or persists is downstream; obtaining generic credentials or capabilities without verified victim access is also outside this technique.
stealth_characteristics:
  paragraphs:
    - zh: 获取访问权把入口形成与买方行动分离。目标可能保存卖方的扫描、钓鱼、利用或恶意软件痕迹，却没有由买方产生的相邻入口形成序列；如果经纪又按监控覆盖、权限或信任位置筛选，买方可以从一个有效但低遥测的立足点开始，令首次活动缺少通常用于解释来源的前置信号。
      en: Acquire Access separates foothold creation from buyer activity. The victim may retain seller-originated scanning, phishing, exploitation, or malware traces but has no adjacent buyer-originated foothold-creation sequence; if a broker also selects by monitoring coverage, privilege, or trust position, the buyer can begin from a valid but weakly monitored foothold whose first activity lacks the preceding signals normally used to explain provenance.
    - zh: 经纪交付、休眠和活动认证状态还可以把完整链分散到不同主体与时间窗口，或让新操作者继承既有令牌、Cookie 和设备外观。痕迹并未消失：市场与伙伴记录、身份提供方会话、端点完整性、入口历史和首次使用仍可能恢复链路，但需要跨组织、跨时间和跨数据域关联。
      en: Broker handoff, dormancy, and live authentication state can further distribute the complete chain across actors and time windows or let a new operator inherit existing tokens, cookies, and device appearance. Traces remain in market or partner records, identity-provider sessions, endpoint integrity, foothold history, and first use, but recovery requires correlation across organizations, time, and data domains.
scope_boundary_definition:
  paragraphs:
    - zh: 本技术纳入对目标特定且已经验证的账户、会话、远程服务、后门或其他系统与网络入口的取得、交付确认和使用前准备。入口必须在交付时仍然有效，并且买方能够据此进入目标或保持已有访问；经纪按权限、监控覆盖、存续时间或认证状态进行筛选也属于准备范围。
      en: This technique includes acquisition, handoff confirmation, and pre-use preparation of target-specific validated accounts, sessions, remote services, backdoors, or other system and network footholds. Access must remain valid at handoff and enable the buyer to enter the victim or preserve existing access; broker selection by privilege, monitoring coverage, lifetime, or authentication state is also within preparation.
    - zh: 未验证的凭据清单、通用恶意软件与工具、漏洞信息和与具体目标无关的账户不属于本技术；卖方的前置攻陷以及买方的实际登录、命令执行、横移和持久化也被排除。合法外包运维、并购交接、灾难恢复和授权红队可能产生相似的主体与时间分段，必须用授权、资产所有权和工单区分。
      en: Unverified credential lists, generic malware and tools, vulnerability information, and accounts unrelated to a concrete victim are outside this technique; seller-side compromise and buyer-side logon, command execution, lateral movement, and persistence are also excluded. Legitimate outsourced administration, merger handoff, disaster recovery, and authorized red teams may produce similar actor and temporal segmentation and require authorization, asset ownership, and ticket context for distinction.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本技术常见于初始访问经纪市场、犯罪伙伴网络、勒索软件生态和其他分工化行动中，卖方验证 VPN、远程桌面、云会话、Web shell 或内部立足点后把访问交给买方。它适合希望缩短进入时间、避免重复入口形成活动、从高权限或低监控位置开始后续行动，或继承仍有效认证状态的攻击者。
        en: This technique commonly appears in initial-access broker markets, criminal partner networks, ransomware ecosystems, and other divided operations where a seller validates VPN, remote desktop, cloud session, Web shell, or internal foothold access and hands it to a buyer. It suits adversaries seeking to shorten time to entry, avoid repeating foothold-creation activity, begin from privileged or weakly monitored positions, or inherit still-valid authentication state.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 买方需要访问经纪、伙伴或交换渠道，能够验证入口与目标、权限、监控条件和有效期，并承担欺诈清单、入口失效和卖方监控的风险。更强实现需要卖方提供入口历史、EDR 状态、有效令牌、Cookie、设备指纹或浏览器环境；长期休眠还要求入口能够在不暴露或不失效的情况下持续存在。
          en: The buyer needs access to broker, partner, or exchange channels and the ability to validate victim, privilege, monitoring conditions, and lifetime while accepting fraudulent listings, expired footholds, and seller surveillance risk. Stronger implementations require seller-provided foothold history, EDR status, valid tokens, cookies, device fingerprints, or browser environments; long dormancy also requires access to remain usable without exposure or expiration.
    defender_model:
      paragraphs:
        - zh: 防守方可能拥有身份、VPN、远程服务、端点和网络日志，以及部分凭据泄露或市场情报，但通常看不到私下交易和卖方验证。单个异常会话或论坛提及判定力不足；恢复完整链需要把外部暴露与资产所有权、入口形成历史、监控覆盖、静默期、令牌设备连续性和首次使用关联，并保留足够长的时间跨度。
          en: Defenders may have identity, VPN, remote-service, endpoint, and network logs plus some credential-exposure or market intelligence, but usually lack private transactions and seller validation. One anomalous session or forum mention is inconclusive; reconstructing the chain requires joining external exposure with asset ownership, foothold-creation history, monitoring coverage, dormancy, token-device continuity, and first use across a sufficiently long retention horizon.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 由卖方建立入口并可按监控缺口筛选，使买方准备与首次活动缺少自身前置痕迹或落在低遥测位置
      en: Have a seller establish and optionally select footholds by monitoring gaps so buyer preparation and first activity lack buyer-side preceding traces or begin in a low-telemetry location
    analysis:
      paragraphs:
        - zh: 卖方先完成目标入口的建立与验证，买方只在资源准备阶段取得可用访问；监控缺口导向的筛选还可优先选择缺少 EDR、日志不足或具有高权限的位置。行为设计因此把买方本应产生的扫描、钓鱼或利用替换为卖方历史，并让首次买方活动进入较弱的观测面；目标无法从买方时间线看到完整入口形成过程，既有告警也可能因缺少遥测而不触发。卖方痕迹、外部经纪记录和迟到的身份或网络信号仍能恢复链路。
          en: A seller first establishes and validates the victim foothold, while the buyer only acquires usable access during resource preparation; monitoring-gap selection may further prioritize positions without EDR, with weak logging, or with high privilege. This design replaces buyer-generated scanning, phishing, or exploitation with seller history and places first buyer activity in a weaker observation plane; the victim cannot see the complete foothold-creation process in the buyer timeline, and existing alerts may not fire when telemetry is absent. Seller traces, external broker records, and delayed identity or network signals can still recover the chain.
    evidence_refs:
      - REF-000058
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 将入口形成、验证、交付、休眠与首次使用分散到不同主体和时间窗口，提高长期跨来源关联成本
      en: Distribute foothold creation, validation, handoff, dormancy, and first use across actors and time windows to increase long-horizon cross-source correlation cost
    analysis:
      paragraphs:
        - zh: 经纪化访问谱系分段把卖方攻陷、市场或伙伴交付和买方使用交给不同主体，休眠入口再激活又可以拉开入口形成与首次买方活动的时间。连续的初始访问链因此变为跨组织、跨工具和跨留存窗口的多个片段，任一局部观察面只能看到部分活动；防守方必须保留长期入口历史并结合外部情报才能重构完整过程。公开证据支持访问库存与转售，但刻意等待日志过期的目的并非每次都能直接证明。
          en: Brokered access-lineage segmentation assigns seller compromise, market or partner handoff, and buyer use to different actors, while dormant-foothold reactivation may widen the time between access creation and first buyer activity. A continuous initial-access chain becomes fragments across organizations, tools, and retention windows, leaving each local vantage with only part of the activity; defenders need long-horizon foothold history and external intelligence to reconstruct the process. Public evidence supports access inventory and resale, but deliberate waiting for logs to expire is not directly established in every instance.
    evidence_refs:
      - REF-000058
      - REF-000069
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 交付有效令牌、Cookie、浏览器状态与设备指纹，使买方会话继承原用户认证和设备特征
      en: Transfer valid tokens, cookies, browser state, and device fingerprints so buyer sessions inherit original-user authentication and device features
    analysis:
      paragraphs:
        - zh: 活动认证状态交付把仍有效的令牌和 Cookie 与浏览器或设备特征成套转移给买方，买方不必重新完成全部密码与 MFA 流程。新操作者产生的认证序列因此被既有会话续用替代，身份系统看到的令牌和设备外观更接近原用户，基于新登录和新设备的分类信号减弱；令牌谱系、来源突变、设备绑定和持续访问评估仍可揭示重放。
          en: Live authentication-state transfer packages still-valid tokens and cookies with browser or device features for the buyer, who need not repeat the full password and MFA flow. A new operator's authentication sequence is replaced by continuation of an existing session, making token and device appearance more similar to the original user and weakening classification based on new sign-ins and devices; token lineage, origin changes, device binding, and continuous access evaluation can still reveal replay.
    evidence_refs:
      - REF-000069
      - REF-000070
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 本技术建立四项匿迹子技术：监控缺口导向的访问筛选、经纪化访问谱系分段、休眠入口再激活和活动认证状态交付。它们分别改变交付入口的观测覆盖、入口形成与使用之间的操作者谱系、入口形成与首次买方活动的时间间隔，以及买方收到的认证与设备状态。
        en: "This technique defines four evasion sub-techniques: Monitoring-Gap-Selected Access, Brokered Access-Lineage Segmentation, Dormant Foothold Reactivation, and Live Authentication-State Transfer. They respectively change observation coverage of the handed-off foothold, operator lineage between access creation and use, time between access creation and first buyer activity, and authentication or device state delivered to the buyer."
      - zh: 分类不按凭据、VPN、Web shell、远程服务或后门等入口介质拆分，也不继承 ATT&CK 子技术。四个变量可以组合，但各自产生不同残余痕迹和防御要求：覆盖补齐、跨主体谱系、长期留存和令牌设备完整性不能由单一控制互相替代。
        en: The taxonomy does not partition by credential, VPN, Web shell, remote service, backdoor, or other foothold medium and does not inherit ATT&CK children. The four variables may be combined, but each produces distinct residual traces and defensive requirements; coverage deployment, cross-actor lineage, long-term retention, and token-device integrity are not interchangeable controls.
  coverage: established
  subtechnique_refs:
    - NJS-0050-001
    - NJS-0050-002
    - NJS-0050-003
    - NJS-0050-004
