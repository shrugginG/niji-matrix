research:
  limitations:
    paragraphs:
      - zh: ATT&CK 直接列明可取得云、Web、广告和无服务器资源，但外层共享如何在每个产品中影响防守观察通常需要从多租户架构强推断。合法供应商使用本身不能证明匿迹意图，只有实际依赖共享外层并存在租户或对象级差异时才应分类。
        en: ATT&CK directly lists cloud, Web, advertising, and serverless resources that can be acquired, but the effect of shared outer surfaces on defender observation often requires strong inference from multi-tenant architecture for each product. Use of a legitimate provider alone does not prove stealth intent and should qualify only when the operation actually relies on the shared surface with tenant- or object-level differences.
      - zh: 提供方的内部检测能力、租户标识暴露程度和受害方可见字段因服务而异，本子技术不能保证粗粒度控制始终失效。未来案例应同时记录提供方与受害方可见性，并证明外层信任对处置产生了实际约束。
        en: Provider detection capability, tenant-identifier exposure, and victim-visible fields vary by service, so this child does not guarantee that coarse controls always fail. Future cases should record both provider and victim visibility and establish an actual response constraint caused by outer-surface trust.
