schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0051-001
parent_ref: NJT-0051
name:
  zh: 合法多租户信任表面取得
  en: Legitimate Multi-Tenant Trust-Surface Acquisition
summary:
  zh: 在合法共享云、Web、营销、广告或无服务器服务中取得租户或项目，使后续资源借用供应商外层域、证书、ASN、协议和流量背景。
  en: Acquire a tenant or project in a legitimate shared cloud, Web, marketing, advertising, or serverless service so later resources borrow provider outer domains, certificates, ASNs, protocols, and traffic background.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 合法多租户信任表面取得是攻击者通过正常注册、购买、租用或试用，在合法共享服务中获得租户、项目、站点或对象命名空间，并将供应商共同外层作为后续行动资源的准备方法。其直接目标是取得可受攻击者控制的细粒度空间，同时保持供应商域、证书、ASN 和协议等外层特征。
      en: Legitimate Multi-Tenant Trust-Surface Acquisition is a resource-preparation method in which an adversary uses normal registration, purchase, lease, or trial to obtain a tenant, project, site, or object namespace in a legitimate shared service and preserve the provider's common outer surface for later operations. Its immediate objective is to acquire fine-grained attacker-controlled space while retaining outer features such as provider domain, certificate, ASN, and protocol.
    - zh: 稳定变量是行动资源与大量正常租户共享外层信任表面，而不是服务属于云、Web 或广告等某一产品类别。后续在租户中上传能力、建立重定向或发送内容属于其他技术；本子技术截止于取得并准备共享表面下的可控空间。
      en: The stable variable is sharing an outer trust surface with many benign tenants rather than belonging to a cloud, Web, advertising, or other product category. Later capability upload, redirect construction, or content delivery in the tenant belongs to other techniques; this child ends with acquisition and preparation of controllable space beneath the shared surface.
stealth_characteristics:
  paragraphs:
    - zh: 合法多租户信任表面取得使目标侧首先看到知名供应商的域名、TLS 证书、网络归属和常见协议，而不是专用恶意基础设施的独立外层。粗粒度信誉和允许列表难以安全地区分其中一个行动租户，整体阻断又可能影响大量正常客户，恶意差异因此被推迟到租户、对象、内容或行为层。
      en: Legitimate Multi-Tenant Trust-Surface Acquisition causes the victim to first observe a known provider's domain, TLS certificate, network ownership, and common protocol rather than an independent outer surface dedicated to malicious infrastructure. Coarse reputation and allowlists cannot safely distinguish one operational tenant, while wholesale blocking may affect many benign customers, delaying malicious differences to tenant, object, content, or behavior layers.
    - zh: 提供方仍能观察账户、租户、账单、项目、对象创建和配置，受害方也可能从 URL 路径、对象标识、内容与后续连接看到细粒度差异。若服务提供租户级威胁情报、对象扫描或可安全阻断的命名空间，外层信任借用的效果会降低。
      en: Providers still observe accounts, tenants, billing, projects, object creation, and configuration, and victims may see fine-grained differences in URL paths, object identifiers, content, and downstream connections. Tenant-level threat intelligence, object scanning, or safely blockable namespaces reduce the effect of borrowing outer trust.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入通过非攻陷方式取得合法多租户服务中的可控租户、项目或命名空间，并有意依赖与正常客户共享的外层域、证书、ASN 或流量背景。判定必须下钻到具体租户或对象，不能仅因攻击者使用知名云或 Web 服务而分类。
      en: This child includes obtaining a controllable tenant, project, or namespace in a legitimate multi-tenant service without compromise and deliberately relying on outer domains, certificates, ASNs, or traffic background shared with benign customers. Classification must resolve a concrete tenant or object and cannot follow merely because an adversary uses a well-known cloud or Web service.
    - zh: 攻陷第三方租户、普通合法云采购、专用 VPS 与域名、账户人物培育以及已取得租户上的能力投放不属于本子技术。单资源年龄设计属于 NJS-0051-002，暴露前的多资源替换关系属于 NJS-0051-003。
      en: Compromise of a third-party tenant, ordinary legitimate cloud procurement, dedicated VPS or domains, account-persona cultivation, and capability staging on an acquired tenant are outside this child. Single-resource age design belongs to NJS-0051-002 and pre-exposure multi-resource replacement relationships to NJS-0051-003.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本子技术适用于攻击者在后续托管、重定向、投放、代理或通信前取得云项目、无服务器应用、共享 Web 站点、营销或广告租户的场景。攻击者希望目标网络首先看到通常允许的供应商连接，并迫使防守方在不影响正常业务的条件下识别具体滥用对象。
        en: This child applies when an adversary acquires a cloud project, serverless application, shared Web site, marketing tenant, or advertising tenant before later hosting, redirection, staging, proxying, or communication. The adversary wants victim networks to first see a normally allowed provider connection and force defenders to identify the abused object without disrupting legitimate business.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要能够通过提供方注册和验证流程取得租户，并控制项目、路径、对象或配置。其约束包括实名或付款验证、服务配额、对象扫描、滥用投诉、租户关联和快速下架；过度复用相同账户或内容会暴露内部谱系。
          en: The adversary needs to pass provider registration and verification to obtain a tenant and control projects, paths, objects, or configuration. Constraints include identity or payment verification, quotas, object scanning, abuse complaints, tenant linkage, and rapid removal; excessive reuse of accounts or content exposes internal lineage.
    defender_model:
      paragraphs:
        - zh: 受害防守方可能只拥有 DNS、代理、TLS 和端点连接记录，服务提供方则拥有租户、账户、账单、对象与配置审计。没有提供方协作或 URL 与对象级遥测时，本地设备可能只能看到共享外层；跨视角关联是区分恶意租户的关键。
          en: Victim defenders may have only DNS, proxy, TLS, and endpoint connection records, while the provider holds tenant, account, billing, object, and configuration audit. Without provider cooperation or URL- and object-level telemetry, local controls may see only the shared surface; cross-vantage correlation is key to distinguishing malicious tenants.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 让行动租户与大量正常租户共享供应商外层特征，把可区分的恶意差异内移到对象与行为层
      en: Make the operational tenant share provider outer features with many benign tenants, moving distinguishable malicious differences inward to object and behavior layers
    analysis:
      paragraphs:
        - zh: 攻击者通过合法流程取得共享服务内的租户或项目，同时保持供应商域、证书、ASN 和协议不变。行为设计用高良性基数的共同外层替代专用恶意域与网络特征；受害方看到的实体在粗粒度上与正常客户一致，按提供方整体允许或阻断均缺乏区分力，必须获得租户、对象、内容和后续用途才能分类。恶意实体因此更难从正常实体中辨出，形成特征伪装。
          en: The adversary obtains a tenant or project through a legitimate process while preserving the service's domain, certificate, ASN, and protocol. This design replaces dedicated malicious domain and network features with a common outer surface having a large benign base; the victim sees an entity coarsely identical to normal customers, so provider-wide allow or block decisions lack discrimination and classification requires tenant, object, content, and downstream-use context. The malicious entity is therefore harder to distinguish from normal entities, producing Feature Disguise.
    evidence_refs:
      - REF-000059
    confidence: high
