research:
  limitations:
    paragraphs:
      - zh: Unit 42 直接分析恶意域名的战略老化和休眠到活跃 DNS 趋势，为行为与观察效果提供强支持，但域名证据不能自动推广到所有云项目、服务器和证书。其他资源类型应在出现等价生命周期证据后再提高置信度。
        en: Unit 42 directly analyzes strategic aging of malicious domains and dormant-to-active DNS trends, strongly supporting behavior and observation effect, but domain evidence cannot automatically generalize to every cloud project, server, and certificate. Confidence for other resource types should rise only with equivalent lifecycle evidence.
      - zh: 许多合法资源会因灾备、季节性业务、品牌保护或项目延期长期静默。域龄和流量突增均不能单独证明攻击，必须结合对象、目标、注册关系和后续用途，并避免将年龄反向当作恶意或良性决定因素。
        en: Many legitimate resources remain quiet because of disaster recovery, seasonal business, brand protection, or project delay. Neither age nor traffic surge alone proves attack; object, target, registration relationships, and downstream use are required, and age must not become a deterministic malicious or benign label.
