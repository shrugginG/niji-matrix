schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0051-002
parent_ref: NJT-0051
name:
  zh: 预用休眠与信誉老化
  en: Pre-Use Dormancy and Reputation Aging
summary:
  zh: 取得基础设施后长期保持低活动并延迟恶意启用，使资源在使用时脱离新注册窗口并呈现长期资产特征。
  en: Keep infrastructure at low activity after acquisition and delay malicious activation so the resource leaves the newly registered window and presents long-lived asset features when used.
aliases:
  - Strategically Aged Infrastructure
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 预用休眠与信誉老化是攻击者在取得一个基础设施资源后，长期维持低 DNS、低服务或低风险活动，并把首次显著恶意启用延迟到资源年龄和注册时间脱离“新资源”窗口之后的准备方法。其直接目标是改变取得到启用的生命周期，而不是在启用后降低操作速率。
      en: Pre-Use Dormancy and Reputation Aging is a preparation method in which an adversary maintains low DNS, service, or low-risk activity after acquiring one infrastructure resource and delays first material malicious activation until resource age and registration time have left the newly registered window. Its immediate objective is to change the acquisition-to-activation lifecycle rather than lower operational rate after activation.
    - zh: 稳定变量是单个资源在取得与首次恶意使用之间的有意低活动时间以及由此形成的年龄特征。普通闲置、合法灾备、品牌保护注册和目标访问权的休眠不属于本子技术；资源必须是行动基础设施，而不是已经存在的目标入口。
      en: The stable variable is deliberate low-activity time between acquisition and first malicious use of one resource and the resulting age feature. Ordinary idleness, legitimate disaster recovery, brand-protection registration, and dormancy of victim access are outside this child; the resource must be operational infrastructure rather than an existing victim foothold.
stealth_characteristics:
  paragraphs:
    - zh: 预用休眠与信誉老化使资源在启用时具有较早注册时间、较长域龄或一段低风险历史，从而不再符合只关注新注册域、新建项目或立即启用服务器的规则。防守方可能把年龄误当作信誉，并在短窗口内看不到取得与当前活动的关系。
      en: Pre-Use Dormancy and Reputation Aging gives a resource an older registration time, longer domain age, or low-risk history at activation, so it no longer matches rules focused on newly registered domains, new projects, or immediately activated servers. Defenders may treat age as reputation and fail to see the relationship between acquisition and current activity in a short window.
    - zh: 长期低 DNS 或服务活动、证书与托管历史以及启用时的流量突增仍然可见，单纯域龄不能抹去内容与目标异常。若防守方保留生命周期趋势并在首次显著启用时重新评分，年龄伪装和时间分离的效果会减弱。
      en: Prolonged low DNS or service activity, certificate and hosting history, and traffic surge at activation remain visible, while age alone cannot erase anomalous content and targets. Retaining lifecycle trends and rescoring at first material activation reduces both age disguise and temporal separation.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入攻击者在取得域名、服务器、证书、云项目或其他基础设施后有意保持低活动，并在较晚时间首次启用以利用年龄或历史特征。判定应同时观察取得时间、休眠状态、启用跃迁和后续用途，不能只按域龄或注册日期分类。
      en: This child includes deliberate low activity after obtaining a domain, server, certificate, cloud project, or other infrastructure and later first activation that relies on age or history features. Classification should jointly observe acquisition time, dormant state, activation transition, and downstream use rather than classify by domain age or registration date alone.
    - zh: 合法长期闲置资源、灾备、季节性站点、品牌保护域、预发布项目和暴露后的低速使用被排除。与 NJS-0051-003 的区别是本子技术改变一个资源的取得到启用时间，后者在暴露前准备多个可替换资源；共享供应商外层属于 NJS-0051-001。
      en: Legitimate long-idle resources, disaster recovery, seasonal sites, brand-protection domains, prerelease projects, and low-rate use after exposure are excluded. Unlike NJS-0051-003, this child changes acquisition-to-activation timing for one resource, while the sibling prepares multiple replaceable resources before exposure; a shared provider surface belongs to NJS-0051-001.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本子技术适用于攻击者提前注册域名、取得证书、租用服务器或创建云项目，并在数周或数月低活动后用于钓鱼、重定向、托管、代理或通信的场景。它针对依赖新注册标签、短观察窗或把年龄当作信誉的防御环境。
        en: This child applies when adversaries register domains, obtain certificates, lease servers, or create cloud projects in advance and use them for phishing, redirection, hosting, proxying, or communication after weeks or months of low activity. It targets defensive environments that rely on newly registered labels, short observation windows, or age as reputation.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要承担长期持有、续费和低风险维护成本，并控制首次启用时间。资源可能因到期、提供方清理、注册信息变化、预启用扫描或自身维护活动而暴露；持有周期越长，成本和谱系痕迹越多。
          en: The adversary must bear long-term holding, renewal, and low-risk maintenance cost and control first activation. Resources may be exposed by expiry, provider cleanup, registration changes, pre-activation scanning, or their own maintenance activity; longer holding increases both cost and lineage traces.
    defender_model:
      paragraphs:
        - zh: 防守方需要域名注册、DNS、证书、托管和服务流量的长期趋势，并能识别从低活动到显著启用的跃迁。只保存最近流量或只给资源标注年龄会遗漏准备过程；业务用途和发布计划则用于排除合法静默资源。
          en: The defender needs long-term domain-registration, DNS, certificate, hosting, and service-traffic trends and the ability to identify low-activity-to-material-activation transitions. Recent traffic alone or age labels alone miss preparation; business purpose and release plans help exclude legitimate dormant resources.
stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 拉开资源取得与首次恶意启用时间，使短窗口无法连接注册、低活动维护和当前用途
      en: Separate resource acquisition from first malicious activation so short windows cannot connect registration, low-activity maintenance, and current use
    analysis:
      paragraphs:
        - zh: 攻击者在取得资源后保持低 DNS 或服务活动，并把首次显著使用推迟到更晚。行为设计沿时间轴分散注册、维护和启用痕迹；当前窗口只看到一个较老资源突然活动，而取得阶段可能已经超出日志或规则关注范围。防守方必须保留长期生命周期并识别休眠到活跃的跃迁，否则难以重构完整准备过程，形成时空释痕。
          en: The adversary keeps DNS or service activity low after acquisition and delays first material use. This design distributes registration, maintenance, and activation traces along time; the current window sees only an older resource suddenly act, while acquisition may lie beyond retained logs or rule focus. Defenders must preserve long-term lifecycle and identify dormant-to-active transition or cannot reconstruct complete preparation, producing Spatiotemporal Trace Dilution.
    evidence_refs:
      - REF-000071
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 让资源在启用时呈现较长年龄和低风险历史，降低新注册特征对恶意分类的贡献
      en: Give the resource longer age and low-risk history at activation, reducing the contribution of newly registered features to malicious classification
    analysis:
      paragraphs:
        - zh: 长期持有使域龄、注册时间和可能的低活动历史接近普通长期资产，启用时不再带有显著新资源标签。行为设计改变了可见信誉特征，使只按年龄筛选的系统更难把行动资源与正常资源区分；然而启用后的内容、目标和流量跃迁仍保持可见，年龄只是降低一个分类信号而不是证明资源安全。
          en: Long holding makes domain age, registration time, and possible low-activity history resemble ordinary long-lived assets, removing a conspicuous new-resource label at activation. The design changes visible reputation features and makes age-only systems less able to distinguish operational from normal resources; content, targets, and traffic transition after activation remain visible, so age weakens one classifier rather than proving safety.
    evidence_refs:
      - REF-000071
    confidence: high
