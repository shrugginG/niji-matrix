schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0051-003
parent_ref: NJT-0051
name:
  zh: 预置可替换资源池
  en: Prepositioned Replacement Resource Pool
summary:
  zh: 在暴露前跨注册商或供应商取得并维护多个替补资源，以便一个资源失效后快速切换并缩短单点可观察寿命。
  en: Acquire and maintain multiple replacement resources across registrars or providers before exposure so operations can switch rapidly after one fails and shorten observable lifetime at any point resource.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 预置可替换资源池是攻击者在任何单个资源暴露或失效之前，取得并维护多个可以承担相同后续角色的域名、服务器、租户、重定向节点或其他基础设施，并设计它们之间的切换关系。其直接目标是在资源准备阶段建立冗余，使后续行动不依赖一个长寿命基础设施点。
      en: Prepositioned Replacement Resource Pool is a resource-preparation method in which an adversary acquires and maintains multiple domains, servers, tenants, redirectors, or other infrastructure resources capable of the same later role before any point resource is exposed or fails and designs switching relationships among them. Its immediate objective is to establish redundancy during preparation so later operations do not depend on one long-lived infrastructure point.
    - zh: 稳定变量是暴露前已经存在的多个替补项及其可切换关系，而不是资源数量本身。暴露后临时购买新资源、普通高可用部署、被攻陷设备组成的出口池和同一服务自动扩容不属于本子技术。
      en: The stable variable is multiple replacements and their switchable relationship already present before exposure, not resource count alone. Procurement only after exposure, ordinary high availability, egress pools of compromised devices, and automatic scaling within one service are outside this child.
stealth_characteristics:
  paragraphs:
    - zh: 预置可替换资源池把同一行动分散到多个短寿命资源片段。一个域、IP、租户或对象被发现后，攻击者可以切换到尚未暴露的替补，使单点 IOC 和针对单个提供方的处置快速失效；任一传感器或短窗口只看到资源池的一部分。
      en: Prepositioned Replacement Resource Pool distributes one operation across multiple short-lived resource fragments. After one domain, IP, tenant, or object is discovered, the adversary can switch to an unexposed replacement, causing point IOCs and one-provider response to expire quickly; any sensor or short window sees only part of the pool.
    - zh: 成组注册、共同证书、命名模式、配对托管、相似内容、共享重定向服务和目标顺序仍可暴露资源关系。更强分舱会降低这些共同特征，但增加取得、维护和协调成本；若防守方进行长期跨供应商谱系分析，替补可在启用前被发现。
      en: Grouped registration, common certificates, naming patterns, paired hosting, similar content, shared redirect services, and target order can still expose relationships among resources. Stronger compartmentation reduces these common features but raises acquisition, maintenance, and coordination cost; long-horizon cross-provider lineage can identify replacements before activation.
scope_boundary_definition:
  paragraphs:
    - zh: 本子技术纳入在后续行动暴露前跨一个或多个注册商、托管商或服务提供方取得和维护多个可替换资源，并存在实际或计划中的角色接续关系。判定需要预置时序和共同用途证据，不能因一次活动出现多个无关域名或服务器就建立分类。
      en: This child includes acquisition and maintenance of multiple replaceable resources across one or more registrars, hosting firms, or service providers before downstream operational exposure where an actual or planned role-succession relationship exists. Classification requires prepositioning chronology and common-purpose evidence and cannot follow merely because one operation contains multiple unrelated domains or servers.
    - zh: 暴露后才采购替换资源、合法灾备与负载均衡、同一云服务弹性扩容、攻陷节点轮换和运行期快速变更不属于本子技术。单个资源的年龄设计属于 NJS-0051-002，共享供应商外层属于 NJS-0051-001。
      en: Replacement procured only after exposure, legitimate disaster recovery and load balancing, elastic scaling in one cloud service, rotation of compromised nodes, and rapid runtime change are outside this child. Single-resource age design belongs to NJS-0051-002 and a shared provider surface to NJS-0051-001.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本子技术适用于攻击者提前准备成组域名、配对 VPS、多个云租户或重定向服务，并在钓鱼、托管、代理或通信基础设施被识别后切换的场景。跨注册商与提供方分布可以使单一滥用团队或网络阻断难以一次覆盖整个资源池。
        en: This child applies when adversaries prepare grouped domains, paired VPSs, multiple cloud tenants, or redirect services in advance and switch after phishing, hosting, proxy, or communication infrastructure is identified. Distribution across registrars and providers can keep one abuse team or network block from covering the whole pool at once.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要提前承担多个资源的注册、租用、维护和状态同步成本，并能在后续配置中快速切换。为了避免谱系关联，还需分离注册、付款、证书、托管和内容工件；分舱越强，运营协调和一致配置越困难。
          en: The adversary must bear advance registration, lease, maintenance, and state-synchronization cost for multiple resources and support rapid switching in later configuration. Avoiding lineage correlation also requires separating registration, payment, certificates, hosting, and content artifacts; stronger compartmentation makes operational coordination and consistent configuration harder.
    defender_model:
      paragraphs:
        - zh: 防守方需要跨注册商、证书、DNS、托管、内容和目标保留长期关系图，并在一个资源确认恶意后查找未启用同群项。若资源完全分舱、提供方数据不可共享或替补在启用前完全静默，防守方可能只能在每次使用后重新发现。
          en: The defender needs long-term relationship graphs across registrars, certificates, DNS, hosting, content, and targets and must search for inactive cohort members after one resource is confirmed malicious. Fully compartmented resources, unavailable provider data, or replacements silent before activation may force rediscovery after each use.
stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 将同一行动分散到多个提前取得且依次启用的资源，使单点指标和局部窗口只能观察一个短寿片段
      en: Distribute one operation across multiple resources acquired in advance and activated in sequence so point indicators and local windows observe only one short-lived fragment
    analysis:
      paragraphs:
        - zh: 攻击者在暴露前取得多个可以承担相同角色的资源，并在单点被阻断或信誉下降后切换。行为设计把原本集中于一个长寿资源的连接、内容和目标痕迹分散到多个注册商、提供方与时间片；单点 IOC 很快失效，局部防守只能看到当前激活片段。只有连接注册、证书、托管、对象和目标关系才能恢复资源池，分散因此提高完整谱系重构成本并形成时空释痕。
          en: The adversary obtains multiple resources capable of the same role before exposure and switches after one point is blocked or loses reputation. This design distributes connections, content, and target traces that would otherwise concentrate on one long-lived resource across registrars, providers, and time segments; point IOCs expire quickly and local defense sees only the active fragment. Recovering the pool requires joining registration, certificate, hosting, object, and target relationships, so distribution raises complete-lineage reconstruction cost and produces Spatiotemporal Trace Dilution.
    evidence_refs:
      - REF-000059
      - REF-000072
    confidence: high
