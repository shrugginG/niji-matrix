research:
  limitations:
    paragraphs:
      - zh: Microsoft 对 Star Blizzard 的多注册商、配对 VPS、共享重定向和变化域名记录直接支持预置替换关系，但公开材料不一定披露每个资源的购买时间或完整切换计划。案例足以支持子技术存在，高度分舱资源池的规模和未启用成员仍可能未知。
        en: Microsoft's reporting on Star Blizzard directly supports prepositioned replacement relationships through multiple registrars, paired VPSs, shared redirect services, and changing domains, but public material may not disclose purchase time or complete switching plans for every resource. The case supports child existence, while the size and inactive members of strongly compartmented pools may remain unknown.
      - zh: 合法内容分发、灾备、高可用和营销活动也会使用资源池与快速切换。可靠判断需要暴露前取得、共同攻击用途、异常目标或内容以及单点失效后的接续，而不能仅凭多供应商或多域部署认定。
        en: Legitimate content delivery, disaster recovery, high availability, and marketing also use resource pools and rapid switching. Reliable judgment requires acquisition before exposure, common adversary purpose, anomalous targets or content, and succession after point failure rather than multi-provider or multi-domain deployment alone.
