research:
  limitations:
    paragraphs:
      - zh: ATT&CK 直接证明多种基础设施可通过非攻陷方式取得，Unit 42 直接分析战略老化域名，Microsoft 直接记录 Star Blizzard 的多注册商、配对 VPS 与变化域名。共享服务的匿迹效果常由外层与租户层差异强推断，不能把合法供应商的存在本身升级为攻击者有意匿迹。
        en: ATT&CK directly establishes that many infrastructure forms can be obtained without compromise, Unit 42 directly analyzes strategically aged domains, and Microsoft directly records Star Blizzard's multiple registrars, paired VPSs, and changing domains. The stealth effect of shared services is often strongly inferred from outer-versus-tenant-layer differences, and use of a legitimate provider alone cannot be elevated into deliberate adversary stealth.
      - zh: 正常业务也会使用多租户服务、长期闲置域、灾备资源和跨供应商资源池。现有证据对注册与账单身份分舱不足，且部分后续恶意用途只能在资源启用后被确认；可靠判断需要结合取得时序、租户对象、共同谱系和后续行为，并允许攻击者意图保持不确定。
        en: Normal business also uses multi-tenant services, long-idle domains, disaster-recovery resources, and cross-provider resource pools. Current evidence is insufficient for registration and billing identity compartmentation, and some malicious purpose becomes confirmable only after activation; reliable judgment requires acquisition timing, tenant objects, shared lineage, and downstream behavior while allowing adversary intent to remain uncertain.
