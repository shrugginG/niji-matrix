schema_version: "2.0.0"
type: technique
id: NJT-0051
name:
  zh: 获取隐蔽型基础设施
  en: Acquire Stealth-Oriented Infrastructure
summary:
  zh: 通过购买、租用、注册或申请取得具有明确匿迹设计的行动基础设施，并利用共享信任表面、预用休眠或预置替换关系降低后续资源的可区分性与可关联性。
  en: Buy, lease, register, or provision operational infrastructure with an explicit stealth design and use shared trust surfaces, pre-use dormancy, or prepositioned replacement relationships to reduce distinguishability and correlation of later resources.
aliases:
  - Acquire Infrastructure
classification:
  tactic_refs:
    - TA0042
  origin:
    kind: attack-adapted
    source_attack_id: T1583
    source_attack_version: "19.1"
  decision_ref: DEC-TA0042-T1583
definition_and_concept:
  paragraphs:
    - zh: 获取隐蔽型基础设施是攻击者通过购买、租用、注册、试用或合法申请等非攻陷方式取得域名、服务器、云项目、Web 服务、无服务器资源、代理或其他行动基础设施，并在取得阶段赋予其可论证匿迹属性的技术。其直接目标是准备可支撑后续托管、重定向、代理、投放或通信的资源，而不是在该资源上执行后续恶意功能。
      en: Acquire Stealth-Oriented Infrastructure is a technique in which an adversary obtains domains, servers, cloud projects, Web services, serverless resources, proxies, or other operational infrastructure through purchase, lease, registration, trial, or another non-compromise method and gives the resource a defensible stealth property during acquisition. Its immediate objective is to prepare resources for later hosting, redirection, proxying, staging, or communication rather than execute those later malicious functions on the resource.
    - zh: 本技术是对 T1583 的有意收窄：普通采购、常见云服务或匿名付款本身不自动构成匿迹，必须存在共享外层信任借用、注册与启用时间设计、暴露前替换池预置或其他能够改变防守观察的稳定变量。基础设施类型、供应商和产品仅是介质，不定义技术或子技术边界。
      en: This technique deliberately narrows T1583. Ordinary procurement, common cloud use, or anonymous payment is not automatically stealth; a stable variable such as borrowing a shared outer trust surface, designing registration-to-activation timing, or prepositioning a replacement pool before exposure must change defender observation. Infrastructure type, provider, and product are media rather than technique or child boundaries.
stealth_characteristics:
  paragraphs:
    - zh: 获取隐蔽型基础设施可以让后续目标首先看到合法供应商的共享域、证书、ASN 和常见协议，而真实行动差异位于租户、项目、对象或行为层；也可以让资源在启用前脱离新注册窗口，或在单点暴露后由已准备的替补快速接续。粗粒度信誉、域龄和单点 IOC 因此降低区分与持续关联能力。
      en: Acquire Stealth-Oriented Infrastructure can make later targets first observe a legitimate provider's shared domain, certificate, ASN, and common protocol while operational differences reside at tenant, project, object, or behavior layers; it can also move a resource out of the newly registered window before activation or let prepositioned replacements continue after point-resource exposure. Coarse reputation, domain age, and point IOCs therefore lose discriminating and durable correlation power.
    - zh: 取得与维护仍留下注册者、账单主体、租户、证书、DNS、托管、对象创建和启用时间等痕迹。提供方往往比受害方拥有更强控制平面可见性，长期 DNS 与证书历史也能暴露休眠跃迁和替换关系；完全分舱、一次性对象和不可共享的提供方记录会限制这种恢复。
      en: Acquisition and maintenance still leave registrant, billing-subject, tenant, certificate, DNS, hosting, object-creation, and activation-time traces. Providers often have stronger control-plane visibility than victims, while long-term DNS and certificate history can expose dormant transitions and replacement relationships; strict compartmentation, one-time objects, and unavailable provider records limit recovery.
scope_boundary_definition:
  paragraphs:
    - zh: 本技术纳入通过非攻陷方式取得基础设施并在取得或预置阶段实施明确匿迹设计的行为，包括取得合法多租户租户或项目以借用共享外层特征、在启用前长期维持低活动，以及在暴露前取得具有替换关系的多个资源。纳入必须能够说明资源设计如何改变痕迹、防守观察和后续匿迹效果。
      en: This technique includes infrastructure obtained without compromise and given an explicit stealth design during acquisition or prepositioning, including acquiring a legitimate multi-tenant project to borrow shared outer features, maintaining low activity for a long period before activation, or obtaining multiple related replacements before exposure. Inclusion requires explaining how resource design changes traces, defender observation, and later stealth effect.
    - zh: 普通域名、服务器或云租户采购，合法业务扩容，攻陷第三方基础设施，创建行动账户，以及把能力上传或配置到已取得资源均被排除。攻陷资源属于 T1584 候选，账户建立属于 T1585 候选，能力投放属于 T1608 候选；正常休眠、灾备和营销资源只有在没有攻击者匿迹设计证据时仍是合法相似行为。
      en: Ordinary domain, server, or cloud-tenant procurement, legitimate business scaling, compromise of third-party infrastructure, creation of operational accounts, and upload or configuration of capabilities on acquired resources are excluded. Compromised resources belong to the T1584 candidate, account establishment to T1585, and capability staging to T1608; normal dormancy, disaster recovery, and marketing resources remain legitimate lookalikes absent evidence of adversary stealth design.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 本技术常用于攻击者在钓鱼、恶意内容托管、重定向、代理、C2 或其他后续行动前准备基础设施的场景。行动方可以取得合法共享服务租户以借用供应商外层，提前注册并老化资源以绕过新域筛选，或跨注册商和提供方维护替补池，以便某个资源被阻断后快速切换。
        en: This technique commonly applies when adversaries prepare infrastructure before phishing, malicious-content hosting, redirection, proxying, command and control, or other downstream activity. Operators may acquire legitimate shared-service tenants to borrow the provider surface, register and age resources in advance to evade new-domain filtering, or maintain replacement pools across registrars and providers for rapid switching after one resource is blocked.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要能够购买、租用、注册或申请资源，并控制取得、低活动维护、首次启用和替换时机。共享服务实现需要管理租户与对象，老化实现需要承担长期持有成本，资源池实现需要协调多个供应商并减少共同工件；提供方身份验证、账单、滥用检测、配额和资源回收都会限制行动。
          en: The adversary needs to purchase, lease, register, or provision resources and control acquisition, low-activity maintenance, first activation, and replacement timing. Shared-service use requires tenant and object administration, aging requires long-term holding cost, and resource pools require coordination across providers with fewer shared artifacts; provider identity verification, billing, abuse detection, quotas, and reclamation constrain operations.
    defender_model:
      paragraphs:
        - zh: 防守方模型包括受害组织、互联网测量与证书生态以及资源提供方。受害方可能只看到共享外层和网络行为，提供方则可能拥有租户、账单和对象审计；可靠分析需要长期保留注册、DNS、证书、托管、内容和目标关系，并把供应商外层解析到具体租户或对象。
          en: The defender model includes victim organizations, Internet-measurement and certificate ecosystems, and resource providers. Victims may see only a shared outer surface and network behavior, while providers may hold tenant, billing, and object audit; reliable analysis requires long-term retention of registration, DNS, certificate, hosting, content, and target relationships and resolution of provider surfaces to concrete tenants or objects.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用合法共享服务或长期资源的外层信誉特征，使行动基础设施在粗粒度观察中接近正常资源
      en: Borrow outer reputation features of legitimate shared services or long-lived resources so operational infrastructure resembles normal resources under coarse observation
    analysis:
      paragraphs:
        - zh: 攻击者取得合法多租户服务中的租户或项目，或使资源在启用前积累年龄与低风险历史。行为设计用供应商共享域、证书、ASN、常见协议或长期注册特征替代专用新建恶意资源的显著外观；受害方的粗粒度信誉与年龄规则因此难以区分行动资源和正常租户或长期资产，整体阻断又会影响大量合法业务。租户、对象、启用跃迁和后续用途仍能揭示差异，所以匿迹来自特征借用而非不可见。
          en: The adversary acquires a tenant or project in a legitimate multi-tenant service or lets a resource accumulate age and low-risk history before activation. This design replaces the conspicuous appearance of dedicated newly created malicious infrastructure with a provider's shared domain, certificate, ASN, common protocol, or long registration history; coarse victim reputation and age rules therefore struggle to distinguish operational resources from normal tenants or long-lived assets, while wholesale blocking affects substantial legitimate business. Tenant, object, activation transition, and downstream use can still expose differences, so stealth comes from feature borrowing rather than invisibility.
    evidence_refs:
      - REF-000059
      - REF-000071
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 将注册与启用分隔并把行动分散到预置替补资源，使短窗口和单点指标难以恢复完整基础设施谱系
      en: Separate registration from activation and distribute operations across prepositioned replacements so short windows and point indicators cannot recover complete infrastructure lineage
    analysis:
      paragraphs:
        - zh: 预用休眠把资源取得和首次显著使用拉开到不同时间，预置替换池又把同一行动分散到多个提前取得且依次启用的资源。局部时间窗口只看到一个陈旧资源突然活跃或一个短寿资源片段，单点 IOC 在轮换后迅速失效；防守方必须跨较长周期和多个供应商连接注册、证书、托管、对象和目标关系。共同谱系仍会留下可关联痕迹，但分散显著提高重构成本。
          en: Pre-use dormancy separates resource acquisition from first material use, while a prepositioned replacement pool distributes one operation across multiple resources acquired in advance and activated in sequence. A local window sees only an old resource suddenly become active or one short-lived resource fragment, and point IOCs expire quickly after rotation; defenders must join registration, certificate, hosting, object, and target relationships across longer periods and providers. Shared lineage still leaves correlatable traces, but distribution materially increases reconstruction cost.
    evidence_refs:
      - REF-000071
      - REF-000072
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 本技术建立三项匿迹子技术：合法多租户信任表面取得、预用休眠与信誉老化、预置可替换资源池。它们分别改变资源外层特征的共享程度、单个资源注册到启用的时间关系，以及同一行动在多个提前取得资源之间的空间与轮换关系。
        en: "This technique defines three evasion sub-techniques: Legitimate Multi-Tenant Trust-Surface Acquisition, Pre-Use Dormancy and Reputation Aging, and Prepositioned Replacement Resource Pool. They respectively change sharing of outer resource features, the temporal relationship from registration to activation for one resource, and the spatial and rotation relationship across multiple resources acquired before an operation."
      - zh: 分类不按域名、VPS、云、Web、广告、代理或无服务器等资源类型拆分，也不继承 ATT&CK 子技术。共享外层、单资源老化和多资源预置可以组合，但需要租户对象级解析、生命周期跃迁分析和跨资源谱系三类不同防御能力；注册与账单身份分舱因跨账户边界和直接证据不足继续延期。
        en: The taxonomy does not partition by domain, VPS, cloud, Web, advertising, proxy, serverless, or other resource type and does not inherit ATT&CK children. Shared surfaces, single-resource aging, and multi-resource prepositioning may combine, but require distinct defensive capabilities for tenant-object resolution, lifecycle-transition analysis, and cross-resource lineage; registration and billing identity compartmentation remains deferred because of cross-account boundaries and insufficient direct evidence.
  coverage: established
  subtechnique_refs:
    - NJS-0051-001
    - NJS-0051-002
    - NJS-0051-003
