  name_en: Gather Victim Identity Information
  name_zh: 收集目标身份信息
decision: retain
rationale_zh: 攻击前收集人员、账户和数字身份属性可直接支持目标筛选、社会工程、账户攻击和后续行动。联合公告与事件调查记录攻击者从公开信息、商业情报和历史泄露中富化高价值身份，也记录了通过正常登录和自助恢复流程推断账户及验证属性。匿迹价值来自采集痕迹转移到受害域外，或主动推断在观测上接近普通身份事务，因此应保留该父技术。
rationale_en: Pre-compromise collection of people, account, and digital-identity attributes directly supports target selection,
  social engineering, account attacks, and follow-on operations. Joint advisories and incident investigations document adversaries
  enriching high-value identities from public, commercial, and historical breach data, as well as inferring account and verification
  attributes through normal login and self-service recovery workflows. Stealth arises when traces move outside the victim
  domain or active inference resembles ordinary identity transactions, justifying retention.
scope_notes_zh: 保留 T1589 的父级身份信息语义，不继承其 ATT&CK 原子技术。Niji 子技术按采集遥测域和身份事务拟态划分；直接诱导人员披露信息属于 T1598，凭证猜测、填充或账户接管属于凭据获取或初始入侵。
scope_notes_en: Retain the parent identity-information semantics of T1589 without importing ATT&CK children. Partition Niji
  children by collection telemetry domain and identity-transaction mimicry. Directly eliciting information from people belongs
  to T1598, while credential guessing, stuffing, or account takeover belongs to Credential Access or Initial Access.
