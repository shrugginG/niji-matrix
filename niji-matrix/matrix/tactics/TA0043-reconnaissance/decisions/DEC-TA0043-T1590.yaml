  source_attack_id: T1590
  source_attack_version: '19.1'
  name_en: Gather Victim Network Information
  name_zh: 收集目标网络信息
decision: retain
rationale_zh: 目标网络的命名、地址、路由、拓扑、信任和边界属性构成稳定的信息对象，可直接支持高后果行动的目标选择。公开联合公告记录 Volt Typhoon 使用第三方互联网测绘服务开展广泛攻击前侦查；证书透明度、被动 DNS、RDAP
  和路由收集器也允许攻击者从非受害方基础设施获取网络事实。只有当这些实现替代新的目标交互或将查询移出受害方遥测时才构成匿迹路径，但该路径稳定且有证据，因此应保留。
rationale_en: Victim network naming, addressing, routing, topology, trust, and perimeter properties form a stable information
  object that directly supports high-consequence targeting. A joint advisory documents Volt Typhoon using third-party Internet-mapping
  services for extensive pre-compromise reconnaissance, while certificate transparency, passive DNS, RDAP, and route collectors
  expose network facts through non-victim infrastructure. These implementations constitute a stealth path only when they replace
  new target interaction or displace queries outside victim telemetry, but that path is stable and evidenced, justifying retention.
scope_notes_zh: 保留 T1590 的父级网络信息语义，不继承其 ATT&CK 原子技术。Niji 子技术按第三方传感观测复用和公共控制面旁路查询划分。直接探测属于 NJT-0001；主机、身份和组织属性分别由 NJT-0032、NJT-0033、NJT-0035 处理。
scope_notes_en: Retain the parent network-information semantics of T1590 without importing ATT&CK children. Partition Niji children into third-party sensor-observation reuse and public control-plane off-target querying. Direct probing belongs to NJT-0001; host, identity, and organizational attributes belong to NJT-0032, NJT-0033, and NJT-0035 respectively.
