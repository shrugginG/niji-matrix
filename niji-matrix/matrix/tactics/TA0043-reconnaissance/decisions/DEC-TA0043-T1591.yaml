  name_en: Gather Victim Org Information
  name_zh: 收集目标组织信息
decision: adapt
rationale_zh: 组织结构、业务关系、岗位职责和运营规律是目标选择、话术塑造和行动规划的重要信息对象。为满足匿迹因果要求，本技术收窄为攻击前、非直接诱导式组织画像，并只保留目标外情报拼接这一明确改变受害方可观察性的实现，因此以 adapt 保留。
rationale_en: Organizational structure, business relationships, role responsibilities, and operating patterns are important information objects for targeting, pretext construction, and operational planning. To preserve the Niji causal requirement, this technique is narrowed to pre-compromise, non-elicitation organizational profiling and retains only off-target intelligence synthesis as an implementation that explicitly changes victim observability, so it remains adapted.
scope_notes_zh: 不继承 T1591 的 ATT&CK 原子技术。具体人员和账户归 NJT-0033，网络属性归 NJT-0034，直接诱导披露归 NJT-0036；正常访客拟态属于 NJT-0038，假名平台研究属于 NJT-0037，不在本父技术重复。
scope_notes_en: Do not import ATT&CK children of T1591. Concrete people and accounts belong to NJT-0033, network attributes to NJT-0034, and direct elicitation to NJT-0036; benign-visitor mimicry belongs to NJT-0038 and pseudonymous platform research to NJT-0037, so neither is duplicated here.
