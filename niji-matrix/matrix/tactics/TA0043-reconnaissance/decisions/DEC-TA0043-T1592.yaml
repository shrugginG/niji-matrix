candidate:
  source_type: attack
  source_attack_id: T1592
  source_attack_version: '19.1'
  name_en: Gather Victim Host Information
  name_zh: 收集目标主机信息
decision: retain
rationale_zh: 攻击前收集目标主机、设备、平台和端点属性直接服务于目标选择、环境适配和后续行动。公开事件记录高能力主体复用第三方互联网测绘结果、利用普通请求元数据筛选客户端，并将指纹代码嵌入目标主动发起的网页会话。上述方式可以把采集痕迹移出受害方遥测，或使恶意主机画像混入正常
  Web 行为，因此该父技术具有稳定且可区分的匿迹实现，有必要保留。
rationale_en: Pre-compromise collection of victim host, device, platform, and endpoint attributes directly supports target
  selection, environment adaptation, and follow-on operations. Public incidents document capable actors reusing third-party
  Internet measurements, filtering clients through ambient request metadata, and embedding fingerprinting code in victim-initiated
  web sessions. These methods can move collection traces outside victim telemetry or blend malicious host profiling into normal
  web behavior, providing stable and distinguishable stealth implementations that justify retention.
scope_notes_zh: 保留 T1592 的父级信息对象，但不继承其 ATT&CK 原子技术。Niji 子技术按“第三方观测替代、请求固有元数据、嵌入式客户端枚举”三种匿迹实现变量划分。攻击者直接向目标发送端口、服务或协议探测的行为仍属于
  NJT-0001。
scope_notes_en: 'Retain the parent information object of T1592 without importing its ATT&CK children. Partition Niji children
  by three stealth implementation variables: third-party observation substitution, ambient request metadata, and embedded
  client-side enumeration. Direct adversary probes for ports, services, or protocols remain NJT-0001.'
