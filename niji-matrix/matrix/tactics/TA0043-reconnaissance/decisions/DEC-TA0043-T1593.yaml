  name_en: Search Open Websites/Domains
  name_zh: 搜索开放网站与域
decision: adapt
rationale_zh: 高后果主体确实在攻击前搜索开放网站、搜索服务、社交平台和公开内容。原 ATT&CK 父技术按网站类型组织，与 NJT-0032 至 NJT-0035 的信息对象分类交叉，因此适配为第三方开放内容访问表面，并只把有直接证据的假名研究账户隔离建立为 Niji 子技术。
rationale_en: High-consequence actors search open websites, search services, social platforms, and public content before compromise. Because the ATT&CK parent is organized by site type and intersects the information-object taxonomy in NJT-0032 through NJT-0035, adapt it to the third-party open-content access surface and admit only evidenced pseudonymous research-account compartmentation as a Niji child.
scope_notes_zh: 不继承 ATT&CK 按社交媒体、搜索引擎或代码仓库划分的子技术。目标自有网站归 NJT-0038；结构化主机与网络数据按 NJT-0032/NJT-0034 处理；公共 AI 实质中介归 T1682。公开访问本身不自动构成匿迹。
scope_notes_en: Do not import ATT&CK children partitioned by social media, search engines, or code repositories. Victim-owned sites belong to NJT-0038; structured host and network data are handled by NJT-0032 or NJT-0034; material public-AI mediation belongs to T1682. Public access alone is not automatically stealth.
