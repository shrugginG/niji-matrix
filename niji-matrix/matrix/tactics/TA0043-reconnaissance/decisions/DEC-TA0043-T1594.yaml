  name_en: Search Victim-Owned Websites
  name_zh: 搜索受害者自有网站
decision: adapt
rationale_zh: 受害者自有 Web 资产具有独立的目标侧日志和防守边界，高后果主体也被记录在入侵前访问此类站点。原 ATT&CK 范围混入猜测式路径枚举和表单诱导，因此收窄为具有明确匿迹链的公开站点读取：正常访客拟态与使用受害者已发布导航工件替代猜测式枚举。
rationale_en: 'Victim-owned Web assets have an independent victim-side logging and defensive boundary, and high-consequence
  actors have been documented accessing such sites before compromise. Because the ATT&CK scope mixes speculative path enumeration
  and form elicitation, narrow it to public-site reading with explicit stealth chains: benign-visitor mimicry and use of victim-published
  navigation artifacts instead of speculative enumeration.'
scope_notes_zh: 猜测路径并以成功、错误或响应差异验证端点属于 NJT-0001；提交内容诱导人员回应属于 NJT-0036；第三方缓存、索引和 AI 中介不属于直接受害者 Web 访问。Niji 子技术为 NJS-0038-001 与 NJS-0038-002。
scope_notes_en: Guessing paths and validating endpoints through successes, errors, or response differences belongs to NJT-0001; submitting content to elicit a response belongs to NJT-0036; third-party caches, indexes, and AI mediation are not direct victim-Web access. The Niji children are NJS-0038-001 and NJS-0038-002.
