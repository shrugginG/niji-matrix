  name_en: Active Scanning
  name_zh: 主动扫描
decision: retain
rationale_zh: >-
  主动扫描是攻击者通过网络流量直接探测目标基础设施、获取资产、服务和暴露面信息的基础侦察技术。ATT&CK 将其置于 Reconnaissance 战术并记录真实恶意活动；CAIDA 对 Sality 僵尸网络的测量以及慢速、分布式扫描研究进一步证明，该技术能够以长周期、多来源协同和探测特征调整等方式获得显著匿迹效果。因此，该技术既与高隐蔽网络公害的侦察需求直接相关，又能承载多个稳定、可区分的匿迹子技术，有必要保留。
rationale_en: >-
  Active Scanning is a foundational reconnaissance technique in which adversaries directly probe victim infrastructure over network traffic to learn about assets, services, and exposure. ATT&CK places it under Reconnaissance and documents malicious use; CAIDA's measurement of the Sality botnet and research on slow and distributed scanning further demonstrate that the technique can gain substantial stealth through long duration, coordinated sources, and probe-feature manipulation. It is therefore directly relevant to stealth-oriented network harm and supports multiple stable, distinguishable evasion sub-techniques, justifying retention.
scope_notes_zh: >-
  保留 T1595 的父技术语义：通过网络流量与目标基础设施直接交互以获得侦察信息。匿迹子技术完全按照降低可观察性、可区分性或可归因性的机理重新建立，不导入 T1595.001、T1595.002 或 T1595.003，也不按扫描对象或扫描内容拆分。
scope_notes_en: >-
  Retain only the parent-level semantics of T1595: direct interaction with victim infrastructure over network traffic to obtain reconnaissance information. Rebuild all evasion sub-techniques from mechanisms that reduce observability, distinguishability, or attribution. Do not import T1595.001, T1595.002, or T1595.003, and do not partition by scan target or scan content.
