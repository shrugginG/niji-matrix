  name_en: Search Open Technical Databases
  name_zh: 搜索开放技术数据库
decision: exclude
rationale_zh: >-
  高后果主体确实查询开放互联网测绘和公开技术数据，但 T1596 的父级区分变量只是数据访问表面，不是新的信息对象或独立匿迹实现。第三方主机观测、第三方网络观测及公共注册/证书/路由旁路已分别由 NJS-0032-001、NJS-0034-001、NJS-0034-002 覆盖；身份和组织信息也由 NJT-0033、NJS-0035-001 覆盖。另建技术会按来源重复分类。
rationale_en: >-
  High-consequence actors do query open Internet mapping and public technical data, but T1596 is distinguished only by data-access surface, not a new information object or independent stealth implementation. NJS-0032-001, NJS-0034-001, and NJS-0034-002 already cover third-party host observations, third-party network observations, and public registration/certificate/routing paths; NJT-0033 and NJS-0035-001 cover identity and organization information. A new technique would duplicate taxonomy by source.
scope_notes_zh: >-
  攻击者自行向目标发送连接、路径、服务、协议或权威查询时归 NJT-0001。非定向批量获取与离线筛选、历史快照时序解耦具有合理假设，但缺少攻击者刻意采用的公开证据，暂缓而不建立正式子技术。
scope_notes_en: >-
  Adversary-originated connection, path, service, protocol, or authoritative queries sent to the victim belong to NJT-0001. Untargeted bulk acquisition with offline filtering and historical-snapshot temporal decoupling remain plausible but deferred because public evidence does not establish deliberate actor use.
gap_statement_zh: 未来若提供方审计或事件材料证明攻击者刻意通过通用批量下载隐藏目标选择，应作为跨信息对象的 Niji 原生缺口重新评估。
gap_statement_en: Reassess a cross-information-object Niji-native gap if future provider audit or incident evidence establishes deliberate general bulk downloading to hide target selection.
