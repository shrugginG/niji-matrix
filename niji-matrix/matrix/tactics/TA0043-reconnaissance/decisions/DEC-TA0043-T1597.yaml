tactic_ref: TA0043
candidate:
  source_type: attack
  source_attack_id: T1597
  source_attack_version: "19.1"
  name_en: Search Closed Sources
  name_zh: 搜索封闭来源
decision: exclude
rationale_zh: >-
  威胁主体确实使用商业情报、私有数据库、历史泄露和地下市场，但 T1597 只按访问权与交易表面区分。封闭来源中的身份、组织、主机和网络材料已由 NJS-0033-001、NJS-0035-001、NJS-0032-001、NJS-0034-001 按直接信息对象覆盖，且已经表达目标外检索的 NM-BT 因果链；另建技术会按许可层级或卖方类型重复分类。
rationale_en: >-
  Threat actors do use commercial intelligence, private databases, historical breaches, and underground markets, but T1597 is distinguished only by entitlement and transaction surface. NJS-0033-001, NJS-0035-001, NJS-0032-001, and NJS-0034-001 already cover closed-source identity, organization, host, and network material by immediate information object and express the off-victim NM-BT chain; another technique would duplicate taxonomy by access tier or seller type.
scope_notes_zh: >-
  同一付费威胁情报服务用于购买目标资料时按所得信息对象分类；用于搜索攻击者自身或同业暴露并触发行动调整时归 T1681 候选。经纪代查与账户/付款/会话隔离存在合理匿迹假设，但没有与 T1597 绑定的直接事件证据，予以暂缓。
scope_notes_en: >-
  Use of a paid threat-intelligence service for victim data maps by the information obtained; use to search actor or peer exposure and trigger operational adaptation belongs to the T1681 candidate. Broker-mediated querying and account/payment/session compartmentation have plausible stealth chains but lack T1597-specific incident evidence and are deferred.
gap_statement_zh: 未来若事件证据证明经纪代查或账户、付款、会话隔离被刻意用于隐藏封闭来源查询主体，应重新评估跨信息对象缺口。
gap_statement_en: Reassess a cross-information-object gap if future incident evidence establishes deliberate broker querying or account, payment, and session compartmentation to hide the closed-source consumer.
original_attack_subtechniques_imported: false
