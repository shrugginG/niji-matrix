  name_en: Phishing for Information
  name_zh: 通过钓鱼获取信息
decision: retain
rationale_zh: 通过电子社会工程诱导目标披露凭据、验证码、联系人、财务或运营信息，是高隐蔽主体在不投递代码的情况下获取可操作情报的重要方法。ATT&CK 与事件资料记录身份和话术伪装、多轮对话、可信账户或线程利用、可信托管表面和痕迹抑制等行为，这些实现分别改变可区分性、时间关联或邮箱侧可观察性，因此该父技术及其匿迹分类应保留。
rationale_en: Electronic social engineering that induces targets to disclose credentials, verification codes, contacts, financial
  data, or operational information is an important way for stealth-oriented actors to obtain actionable intelligence without
  delivering code. ATT&CK and incident reporting document persona and pretext camouflage, multi-turn dialogue, trusted-account
  or thread use, trusted hosting surfaces, and trace suppression. These implementations change distinguishability, temporal
  correlation, or mailbox-side observability, so the parent technique and its Niji stealth taxonomy should be retained.
scope_notes_zh: 不继承 T1598 的 ATT&CK 原子技术，也不按邮件、链接、附件或语音媒介拆分。直接结果必须是获取信息；子技术按身份与话术、交互时序、受信账户关系、邮箱证据完整性和技术承载面五个变量划分。
scope_notes_en: Do not import ATT&CK children of T1598 or partition by email, link, attachment, or voice medium. The immediate result must be information acquisition; partition children by persona and pretext, interaction timing, trusted-account relationships, mailbox evidence integrity, and technical hosting surface.
