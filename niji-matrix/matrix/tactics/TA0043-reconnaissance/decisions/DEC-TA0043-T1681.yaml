  name_en: Search Threat Vendor Data
  name_zh: 搜索威胁厂商数据
decision: retain
rationale_zh: T1681 具备独立的“防守反馈感知—行动调整”闭环。公开调查记录攻击者查询自身基础设施、归因和候选资源声誉，并记录公开披露后快速替换指标。其直接目的是了解自身或同业暴露并改变后续可观测特征或资源选择，而非获取受害者数据，因此应保留。
rationale_en: T1681 has an independent defender-feedback-to-operational-adjustment loop. Public investigations document actors
  querying their own infrastructure, attribution, and candidate-resource reputation and rapidly replacing indicators after
  disclosure. Its immediate purpose is to learn actor or peer exposure and change subsequent observables or resource selection,
  not acquire victim data, so it should be retained.
scope_notes_zh: 子技术按反馈后的实现变量划分为暴露触发的特征轮换和威胁声誉门控的基础设施选择，不按公开/封闭来源、厂商或 IOC 类型划分。一般规避知识学习若没有自身/同业暴露评估与后续调整闭环，不属于本技术。
scope_notes_en: Children are partitioned by post-feedback implementation—exposure-triggered feature rotation and threat-reputation-gated
  infrastructure selection—not by open or closed source, vendor, or IOC type. General evasion learning without self or peer
  exposure assessment and a follow-on adjustment loop is outside this technique.
