candidate:
  source_type: attack
  source_attack_id: T1682
  source_attack_version: '19.1'
  name_en: Query Public AI Services
  name_zh: 查询公共 AI 服务
decision: adapt
rationale_zh: 国家关联威胁主体已使用公共 AI 服务构建目标列表、研究人员与组织、综合 OSINT 并准备社会工程，父行为可信；但使用 AI 本身只说明工具或效率。仅当公共 AI 实质聚合、推理、转换或生成，并替代攻击者直接目标/逐源查询而改变痕迹拓扑时，作为适配技术保留。
rationale_en: State-affiliated actors have used public AI services to build target lists, research people and organizations,
  synthesize OSINT, and prepare social engineering, establishing the parent behavior; using AI alone only indicates a tool
  or efficiency. Retain it as adapted only when public AI materially aggregates, infers, transforms, or generates and substitutes
  for adversary-originated victim or source-by-source queries, changing trace topology.
scope_notes_zh: 受害者侧可见性下降，但服务商可能保留账户、提示、响应、分类器和工具调用记录，不能描述为不可检测。匿名/假名账户、提示编码、跨服务分散因缺少直接证据而暂缓；AI 生成话术在直接诱导人员时归 NJT-0036。
scope_notes_en: Victim visibility is reduced, but providers may retain account, prompt, response, classifier, and tool-invocation
  records, so the technique is not undetectable. Anonymous or pseudonymous accounts, prompt encoding, and cross-service distribution
  are deferred for lack of direct evidence; AI-generated language belongs to NJT-0036 once used to elicit a person.
gap_statement_zh: 本地或私有模型不在 T1682 范围；其目标外推理但缺少公共服务方观测的情形留待跨战术缺口评估。
gap_statement_en: Local or private models are outside T1682; off-victim inference without a public-provider vantage remains
  for cross-tactic gap assessment.
