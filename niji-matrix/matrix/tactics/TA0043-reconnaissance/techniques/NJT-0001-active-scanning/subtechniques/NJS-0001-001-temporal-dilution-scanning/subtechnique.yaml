schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0001-001
parent_ref: NJT-0001
name:
  zh: 时间稀释扫描
  en: Temporal-Dilution Scanning
summary:
  zh: 通过降低探测速率、延长探测间隔或采用间歇活动，将扫描事件稀释到更长时间范围。
  en: Dilute scan events over a longer period by reducing probe rate, extending intervals, or operating intermittently.
aliases:
- Low-and-Slow Scanning
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 时间稀释扫描通过主动控制探测速率、间隔和活动周期，把原本可能集中出现的扫描痕迹分散到更长时间范围。其主要匿迹效果不是改变报文内容，而是使任一短窗口中的异常强度不足以触发阈值，并让完整关联所需的状态和日志保留成本显著增加。
    en: Temporal-Dilution Scanning deliberately controls probe rate, interval, and activity periods to disperse an otherwise concentrated scan
      over a longer horizon. Its primary effect is not to change packet content but to keep anomaly strength below thresholds in any short window
      and materially increase the state and retention cost required for full correlation.
  - zh: 本子技术的基本工作过程是控制单一来源对单一目标或目标集合的探测节奏，在较长周期内逐步积累侦察结果。其预期匿迹目标是使任一短时间窗口中的探测数量或异常强度低于检测阈值，并提高完整活动重构所需的留存周期。
    en: The operating principle is to control the probing cadence from one source toward one target or target set and accumulate reconnaissance
      results progressively over a longer period. The intended stealth effect is to keep probe counts or anomaly strength below detection thresholds
      in any short window and increase the retention horizon required to reconstruct the activity.
stealth_characteristics:
  paragraphs:
  - zh: 时间稀释扫描利用长间隔和低速率，使短窗口中的扫描事件保持在检测阈值以下，并迫使检测系统在数天或更长时间内维持状态。扫描痕迹并未消失，但其局部强度降低，防守方需要更长的观察周期和更多上下文才能恢复完整活动。
    en: Temporal-Dilution Scanning uses long intervals and low rates to keep scan events below short-window thresholds and force detection systems
      to maintain state for days or longer. The traces remain present, but their local intensity is reduced, requiring longer observation and
      more context to reconstruct the activity.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术的纳入范围包括有意降低探测速率、增加间隔或交替活动与静默、扫描周期明显长于常规检测窗口。这些变化必须是攻击者有意控制的匿迹变量，而不是偶然或自然产生的现象。
    en: The included scope covers deliberate reduction of probe rate, extension of intervals, or alternation between activity and silence and
      a scan campaign materially longer than conventional detection windows. These changes must be deliberately controlled by the adversary as
      evasion variables rather than arise accidentally or naturally.
  - zh: 本分类不包括由拥塞、丢包、目标限速或设备性能自然造成的扫描变慢、主要通过增加真实来源数量降低单源密度的行为。与兄弟子技术的边界如下：与 NJS-0001-002 的区别是主要控制变量为时间，而不是执行来源数量；与 NJS-0001-005 的区别是降低事件密度，而不是改变报文可见特征。
    en: 'The classification excludes scanning slowed naturally by congestion, loss, target rate limiting, or device performance and behavior that
      primarily lowers per-source density by increasing the number of real origins. It differs from sibling sub-techniques in the following ways:
      differs from NJS-0001-002 because time, rather than the number of executing origins, is the primary control variable; differs from NJS-0001-005
      because it reduces event density rather than changing visible packet features.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术主要应用于对外暴露基础设施、适用短窗口频率阈值的网络边界。在这些场景中，攻击者需要在继续获得主动扫描反馈的同时，削弱局部观察面对完整活动的识别或解释能力。
      en: This sub-technique primarily applies in internet-facing infrastructure and network perimeters using short-window rate thresholds. In
        these settings, the adversary needs to preserve feedback from Active Scanning while weakening the ability of a local vantage point to
        identify or explain the complete activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者模型假设攻击者能够接受较长侦察周期、目标暴露状态在扫描周期内相对稳定。攻击者还必须能够主动控制本子技术的关键变量，而不是仅因网络状态、设备性能或偶发条件产生相似痕迹。
        en: The attacker model assumes that the adversary can tolerate a longer reconnaissance period and target exposure remains sufficiently
          stable during the scan campaign. The adversary must also deliberately control the defining variable rather than produce similar traces
          only through network conditions, device performance, or coincidence.
    defender_model:
      paragraphs:
      - zh: 防守方模型假设能够观察到同一来源在长周期内重复发起低信息量连接或请求、活动与静默交替，单个时间窗均低于常规阈值、长期目标或端口覆盖逐步增加。这些信号通常不能单独证明恶意，必须结合时间、来源、协议状态、目标覆盖和正常业务基线进行关联。
        en: The defender model assumes visibility into repeated low-information connections or requests from the same origin over a long horizon,
          alternating activity and silence with each local window below conventional thresholds and gradually increasing target or port coverage
          over time. These signals usually do not prove malicious intent on their own and must be correlated with time, origin, protocol state,
          target coverage, and normal operational baselines.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 长间隔和低速率使短窗口中的扫描事件低于阈值，并迫使检测系统在数天或更长时间内维持状态
    en: Long intervals and low rates keep scan events below short-window thresholds and force detection systems to maintain state for days or
      longer
  analysis:
    paragraphs:
    - zh: 控制单一来源对单一目标或目标集合的探测节奏，在较长周期内逐步积累侦察结果。由此，集中的扫描序列变为低频、长间隔、间歇性且持续时间显著延长的连接或请求事件。防守方在短窗口中只能看到孤立弱信号，若留存和状态周期不足则无法还原完整扫描，最终使任一短时间窗口中的探测数量或异常强度低于检测阈值，并提高完整活动重构所需的留存周期。
      en: Control the probing cadence from one source toward one target or target set and accumulate reconnaissance results progressively over
        a longer period. As a result, a concentrated scan sequence becomes a low-rate, long-interval, intermittent set of connection or request
        events with materially extended duration. Defenders see only isolated weak signals in short windows and cannot reconstruct the full scan
        when retention or state duration is insufficient. Ultimately, the effect is to keep probe counts or anomaly strength below detection thresholds
        in any short window and increase the retention horizon required to reconstruct the activity.
