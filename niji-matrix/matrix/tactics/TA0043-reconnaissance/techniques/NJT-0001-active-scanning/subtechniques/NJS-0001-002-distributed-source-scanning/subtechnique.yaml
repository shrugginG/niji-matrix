schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0001-002
parent_ref: NJT-0001
name:
  zh: 分布式源扫描
  en: Distributed-Source Scanning
summary:
  zh: 将互补的主动探测任务分配给多个真实执行来源，使每个来源只产生整体扫描的一部分痕迹。
  en: Allocate complementary active-probing tasks across multiple real executing origins so that each origin produces only part of the aggregate
    scan trace.
aliases:
- Coordinated Distributed Scanning
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 分布式源扫描将互补的目标、端口、路径或探测阶段分配给多个真实执行来源。每个来源只呈现少量活动，但聚合后形成完整或高覆盖度的扫描。Sality 案例证明，数百万来源可以在长周期内协同完成互联网规模探测。
    en: Distributed-Source Scanning allocates complementary targets, ports, paths, or probing phases across multiple real executing origins. Each
      origin exposes little activity, but the aggregate forms a complete or high-coverage scan. The Sality case demonstrates that millions of
      sources can coordinate Internet-scale probing over a long period.
  - zh: 本子技术的基本工作过程是对目标地址、端口、路径或探测阶段进行任务划分，由多个实际可接收或处理反馈的来源协同完成。其预期匿迹目标是降低任一来源、网络或局部传感器所观察到的扫描密度，同时维持整体目标覆盖效率。
    en: The operating principle is to partition target addresses, ports, paths, or probing phases and have multiple origins that actually send
      probes and receive or process feedback complete them cooperatively. The intended stealth effect is to reduce scan density observed for any
      one origin, network, or local sensor while preserving aggregate target-coverage efficiency.
stealth_characteristics:
  paragraphs:
  - zh: 分布式源扫描通过把互补任务分配给多个真实来源，降低单一来源或局部传感器中的事件密度，并要求防守方跨来源和跨网络边界关联后才能还原整体扫描。每个来源只暴露局部片段，而协同性体现在聚合后的目标和端口覆盖中。
    en: Distributed-Source Scanning assigns complementary tasks to multiple real origins, reducing event density at any one source or local sensor
      and requiring cross-origin and cross-boundary correlation to reconstruct the aggregate scan. Each origin exposes only a fragment, while
      coordination appears in the combined target and port coverage.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术的纳入范围包括多个真实来源承担互补而非完全重复的探测任务、单源活动低于局部阈值，但汇总后形成系统性扫描覆盖。这些变化必须是攻击者有意控制的匿迹变量，而不是偶然或自然产生的现象。
    en: The included scope covers multiple real origins perform complementary rather than entirely duplicated probing tasks and per-origin activity
      remains below local thresholds while the aggregate forms systematic scan coverage. These changes must be deliberately controlled by the
      adversary as evasion variables rather than arise accidentally or naturally.
  - zh: 本分类不包括只加入伪造或诱饵来源、但实际任务仍由单一来源完成、多个无关主体偶然访问同一目标、仅为提高速度而并发、且不降低局部可见性的扫描。与兄弟子技术的边界如下：与 NJS-0001-001 的区别是主要控制变量为真实来源空间而不是时间；与 NJS-0001-003
      的区别是每个来源都真实参与互补任务，而不是仅制造归因歧义。
    en: 'The classification excludes adding spoofed or decoy origins while a single real source still performs the task, unrelated entities coincidentally
      accessing the same target and parallel scanning used only for speed without reducing local visibility. It differs from sibling sub-techniques
      in the following ways: differs from NJS-0001-001 because real-source space rather than time is the primary control variable; differs from
      NJS-0001-003 because each origin actually performs a complementary task rather than merely creating attribution ambiguity.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术主要应用于互联网规模侦察、多边界、分布式或分段网络。在这些场景中，攻击者需要在继续获得主动扫描反馈的同时，削弱局部观察面对完整活动的识别或解释能力。
      en: This sub-technique primarily applies in internet-scale reconnaissance and multi-perimeter, distributed, or segmented networks. In these
        settings, the adversary needs to preserve feedback from Active Scanning while weakening the ability of a local vantage point to identify
        or explain the complete activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者模型假设攻击者可控制或协调多个可用网络来源、能够分配任务并汇总各来源反馈。攻击者还必须能够主动控制本子技术的关键变量，而不是仅因网络状态、设备性能或偶发条件产生相似痕迹。
        en: The attacker model assumes that the adversary can control or coordinate multiple usable network origins and the adversary can allocate
          tasks and aggregate feedback across origins. The adversary must also deliberately control the defining variable rather than produce
          similar traces only through network conditions, device performance, or coincidence.
    defender_model:
      paragraphs:
      - zh: 防守方模型假设能够观察到多来源访问互补目标、端口或路径集合、不同来源共享首部编码、请求序列或工具指纹、单源低密度但聚合后具有高覆盖度。这些信号通常不能单独证明恶意，必须结合时间、来源、协议状态、目标覆盖和正常业务基线进行关联。
        en: The defender model assumes visibility into multiple origins access complementary target, port, or path sets, sources share header
          encodings, request sequences, or tool fingerprints and low density per source but high aggregate coverage. These signals usually do
          not prove malicious intent on their own and must be correlated with time, origin, protocol state, target coverage, and normal operational
          baselines.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 互补任务分布使单一来源或传感器中的事件数量降低，并要求跨来源和跨网络边界关联后才能还原整体扫描
    en: Complementary task distribution reduces event counts per origin or sensor and requires cross-origin and cross-boundary correlation to
      reconstruct the aggregate scan
  analysis:
    paragraphs:
    - zh: 对目标地址、端口、路径或探测阶段进行任务划分，由多个实际可接收或处理反馈的来源协同完成。由此，单一高扇出来源变为多个低扇出来源，且各来源的目标或端口集合具有互补关系。单点监测只看到低强度片段，缺少跨来源关联时无法识别其协同性和整体覆盖目标，最终降低任一来源、网络或局部传感器所观察到的扫描密度，同时维持整体目标覆盖效率。
      en: Partition target addresses, ports, paths, or probing phases and have multiple origins that actually send probes and receive or process
        feedback complete them cooperatively. As a result, one high-fan-out origin becomes multiple low-fan-out origins whose target or port sets
        are complementary. A local monitor sees only low-intensity fragments and cannot identify coordination or aggregate coverage without cross-origin
        correlation. Ultimately, the effect is to reduce scan density observed for any one origin, network, or local sensor while preserving aggregate
        target-coverage efficiency.
