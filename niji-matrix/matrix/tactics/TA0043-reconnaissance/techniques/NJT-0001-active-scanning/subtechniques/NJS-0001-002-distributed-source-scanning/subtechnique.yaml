research:
  limitations:
    paragraphs:
    - zh: 当前分类得到公开案例和技术证据共同支持，但正常网络条件也可能产生相似局部痕迹，因此仍须结合长期行为和上下文确认攻击者的有意实施。
      en: The classification is supported by both public cases and technical evidence, but normal network conditions can produce similar local
        traces; deliberate adversary use must still be established from long-term behavior and context.
