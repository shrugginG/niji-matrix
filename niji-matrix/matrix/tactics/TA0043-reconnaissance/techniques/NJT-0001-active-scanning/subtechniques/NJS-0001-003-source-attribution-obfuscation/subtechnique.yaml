schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0001-003
parent_ref: NJT-0001
name:
  zh: 来源归因混淆扫描
  en: Source-Attribution-Obfuscated Scanning
summary:
  zh: 通过诱饵、代理、中继、伪造或间接探测，使观测来源不能可靠代表真实扫描发起者。
  en: Use decoys, proxies, relays, spoofing, or indirect probing so that observed origins do not reliably represent the true scan initiator.
aliases:
- Decoy Scanning
- Relayed Scanning
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 来源归因混淆扫描通过诱饵、代理、中继、来源伪造或间接主机，使目标侧观测到的来源不能可靠代表真实扫描发起者。其主要目标不是降低扫描事件数量，而是降低告警和后续调查对来源身份的可信度。
    en: Source-Attribution-Obfuscated Scanning uses decoys, proxies, relays, source spoofing, or indirect hosts so that the origin visible at
      the target does not reliably represent the true scan initiator. Its primary objective is not to reduce the number of scan events but to
      reduce confidence in alerts and subsequent source attribution.
  - zh: 本子技术的基本工作过程是在目标或传感器可见的来源与真实发起者之间加入虚假候选或中间节点，并利用单点观测无法验证来源真实性的限制。其预期匿迹目标是降低防守方对扫描真实来源、控制主体和基础设施归属的归因置信度。
    en: The operating principle is to insert false candidates or intermediary nodes between the origin visible to the target or sensor and the
      true initiator, exploiting the inability of a single vantage point to validate source authenticity. The intended stealth effect is to reduce
      defender confidence in attributing the scan's true origin, controlling actor, and infrastructure ownership.
stealth_characteristics:
  paragraphs:
  - zh: 来源归因混淆扫描利用虚假来源、代理、中继或间接主机，使真实发起者在观测中表现为其他主机或多个候选之一，从而降低来源身份的可区分性。防守方可能识别出扫描行为，却难以仅凭目标侧记录确认控制主体。
    en: Source-Attribution-Obfuscated Scanning uses false origins, proxies, relays, or indirect hosts so the true initiator appears as another
      host or one candidate among many, reducing the distinguishability of source identity. Defenders may recognize scanning while remaining unable
      to identify the controlling actor from target-side records alone.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术的纳入范围包括诱饵来源与真实来源同时出现在扫描记录中、通过代理、中继或间接主机发起可获得结果的探测、来源伪造用于误导告警或归因。这些变化必须是攻击者有意控制的匿迹变量，而不是偶然或自然产生的现象。
    en: The included scope covers decoy and real origins appearing together in scan records, result-bearing probes sent through proxies, relays,
      or indirect hosts and source spoofing used to misdirect alerts or attribution. These changes must be deliberately controlled by the adversary
      as evasion variables rather than arise accidentally or naturally.
  - zh: 本分类不包括多个真实来源分别承担互补目标覆盖的分布式源扫描、普通 NAT 或负载均衡自然改变观测来源，且无匿迹意图。与兄弟子技术的边界如下：与 NJS-0001-002 的区别是本技术关注来源真实性和归因歧义，而不是多来源任务覆盖；与 NJS-0001-005 的区别是伪装对象为来源身份，而不是报文或协议外观。
    en: 'The classification excludes distributed-source scanning in which multiple real origins perform complementary coverage and ordinary NAT
      or load balancing that changes the observed origin without evasion intent. It differs from sibling sub-techniques in the following ways:
      differs from NJS-0001-002 because it concerns source authenticity and attribution ambiguity, not multi-source task coverage; differs from
      NJS-0001-005 because the disguised object is source identity rather than packet or protocol appearance.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术主要应用于缺少反向路径验证或多点观测的网络边界、允许代理或中继访问目标服务的环境。在这些场景中，攻击者需要在继续获得主动扫描反馈的同时，削弱局部观察面对完整活动的识别或解释能力。
      en: This sub-technique primarily applies in network perimeters lacking reverse-path validation or multi-vantage observation and environments
        where proxies or relays can access the target service. In these settings, the adversary needs to preserve feedback from Active Scanning
        while weakening the ability of a local vantage point to identify or explain the complete activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者模型假设存在可用诱饵地址、代理、中继、间接主机或来源伪造条件、扫描方式允许通过间接路径获得结果，或攻击者只需要制造告警与归因歧义。攻击者还必须能够主动控制本子技术的关键变量，而不是仅因网络状态、设备性能或偶发条件产生相似痕迹。
        en: The attacker model assumes that decoy addresses, proxies, relays, indirect hosts, or source-spoofing conditions are available and
          the scan can obtain results through an indirect path, or the adversary only needs to create alert and attribution ambiguity. The adversary
          must also deliberately control the defining variable rather than produce similar traces only through network conditions, device performance,
          or coincidence.
    defender_model:
      paragraphs:
      - zh: 防守方模型假设能够观察到多个来源产生高度同步或共同指纹的探测、只有部分来源能够完成响应交互、来源地址与路由、TTL、自治系统或协议状态不一致。这些信号通常不能单独证明恶意，必须结合时间、来源、协议状态、目标覆盖和正常业务基线进行关联。
        en: The defender model assumes visibility into highly synchronized probes or shared fingerprints across multiple origins, only a subset
          of origins completing response interaction and source addresses inconsistent with route, TTL, autonomous system, or protocol state.
          These signals usually do not prove malicious intent on their own and must be correlated with time, origin, protocol state, target coverage,
          and normal operational baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 虚假或中间来源使真实发起者在观测上表现为其他主机或多个候选之一，降低来源身份的可区分性
    en: False or intermediary origins make the true initiator appear as another host or one candidate among many, reducing the distinguishability
      of source identity
  analysis:
    paragraphs:
    - zh: 在目标或传感器可见的来源与真实发起者之间加入虚假候选或中间节点，并利用单点观测无法验证来源真实性的限制。由此，扫描日志中的来源地址、路由路径或交互主体与真实控制来源分离，可能同时出现无法完成双向交互的候选来源。防守方可以发现扫描行为，但难以仅凭目标侧日志确定真实发起者和控制基础设施，最终降低防守方对扫描真实来源、控制主体和基础设施归属的归因置信度。
      en: Insert false candidates or intermediary nodes between the origin visible to the target or sensor and the true initiator, exploiting
        the inability of a single vantage point to validate source authenticity. As a result, source addresses, routing paths, or interacting
        entities in scan logs are separated from the true controlling origin, potentially including candidates that cannot complete bidirectional
        interaction. Defenders can observe scanning behavior but cannot reliably identify the true initiator or controlling infrastructure from
        target-side logs alone. Ultimately, the effect is to reduce defender confidence in attributing the scan's true origin, controlling actor,
        and infrastructure ownership.
  evidence_refs:
  - REF-000003
  confidence: high
