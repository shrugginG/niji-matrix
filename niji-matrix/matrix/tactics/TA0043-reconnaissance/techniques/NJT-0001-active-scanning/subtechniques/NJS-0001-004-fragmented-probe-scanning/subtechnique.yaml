schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0001-004
parent_ref: NJT-0001
name:
  zh: 分片探测扫描
  en: Fragmented-Probe Scanning
summary:
  zh: 将主动探测报文拆分为多个 IP 分片，使关键传输层字段或探测语义跨分片分布。
  en: Split active-probe packets into multiple IP fragments so that critical transport-layer fields or probe semantics are distributed across
    fragments.
aliases:
- Fragmented Scanning
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 分片探测扫描有意将主动探测报文拆分为多个 IP 分片，使端口、标志或其他探测语义不能在单个分片中完整呈现。它利用过滤器、IDS 和目标终端在分片重组能力、超时和重叠处理上的差异降低检查能力。
    en: Fragmented-Probe Scanning deliberately splits active-probe packets into multiple IP fragments so that ports, flags, or other probe semantics
      do not appear completely in any single fragment. It exploits differences in fragment reassembly capability, timeout, and overlap handling
      among filters, IDSs, and target endpoints.
  - zh: 本子技术的基本工作过程是使单个分片缺少完整的端口、标志或其他探测上下文，并利用分片顺序、大小、重叠或重组策略差异形成检查缺口。其预期匿迹目标是降低无状态过滤、未重组检测或与终端重组策略不一致的监测设备对扫描报文的检查能力。
    en: The operating principle is to ensure that individual fragments lack complete port, flag, or other probe context and exploit differences
      in fragment order, size, overlap, or reassembly policy to create inspection gaps. The intended stealth effect is to reduce the inspection
      capability of stateless filters, non-reassembling detection, or sensors whose reassembly policy differs from the endpoint.
stealth_characteristics:
  paragraphs:
  - zh: 分片探测扫描将关键探测信息拆分到多个 IP 分片中，使任何单一分片都无法表达完整的端口、标志或协议语义，并迫使检测系统先正确重组再进行检查。传感器与目标终端的重组差异还可能进一步降低检测可靠性。
    en: Fragmented-Probe Scanning splits critical probe information across multiple IP fragments so no individual fragment expresses complete
      port, flag, or protocol semantics, forcing detection systems to reassemble traffic correctly before inspection. Differences between sensor
      and endpoint reassembly can further reduce detection reliability.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术的纳入范围包括有意使用小分片、跨首部分片或重组歧义降低扫描检测能力、分片行为与主动探测请求直接关联。这些变化必须是攻击者有意控制的匿迹变量，而不是偶然或自然产生的现象。
    en: The included scope covers deliberate use of tiny fragments, header-spanning fragments, or reassembly ambiguity to reduce scan detection
      and fragmentation directly associated with active probe requests. These changes must be deliberately controlled by the adversary as evasion
      variables rather than arise accidentally or naturally.
  - zh: 本分类不包括正常路径 MTU、隧道或网络设备自然产生的分片、与主动扫描无关的通用分片攻击。与兄弟子技术的边界如下：与 NJS-0001-005 的区别是本技术改变报文分片和可重组性，而不是完整报文的外观特征。
    en: 'The classification excludes fragmentation naturally caused by path MTU, tunnels, or network devices and general fragmentation attacks
      unrelated to Active Scanning. It differs from sibling sub-techniques in the following ways: differs from NJS-0001-005 because it changes
      packet fragmentation and reassemblability rather than the appearance of a complete packet.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术主要应用于使用无状态过滤或不完整分片重组的网络边界、传感器与终端重组策略可能不同的环境。在这些场景中，攻击者需要在继续获得主动扫描反馈的同时，削弱局部观察面对完整活动的识别或解释能力。
      en: This sub-technique primarily applies in network perimeters using stateless filtering or incomplete fragment reassembly and environments
        where sensor and endpoint reassembly policies may differ. In these settings, the adversary needs to preserve feedback from Active Scanning
        while weakening the ability of a local vantage point to identify or explain the complete activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者模型假设扫描方式允许构造原始 IP 报文或控制分片、路径和目标能够传递或重组相关分片。攻击者还必须能够主动控制本子技术的关键变量，而不是仅因网络状态、设备性能或偶发条件产生相似痕迹。
        en: The attacker model assumes that the scanning method can construct raw IP packets or control fragmentation and the path and target
          can carry or reassemble the relevant fragments. The adversary must also deliberately control the defining variable rather than produce
          similar traces only through network conditions, device performance, or coincidence.
    defender_model:
      paragraphs:
      - zh: 防守方模型假设能够观察到异常小、重叠、乱序或不完整的分片、传输层首部跨分片、分片后紧随与扫描目标相关的响应。这些信号通常不能单独证明恶意，必须结合时间、来源、协议状态、目标覆盖和正常业务基线进行关联。
        en: The defender model assumes visibility into unusually small, overlapping, reordered, or incomplete fragments, transport-layer headers
          spanning fragments and fragment sequences followed by responses associated with scan targets. These signals usually do not prove malicious
          intent on their own and must be correlated with time, origin, protocol state, target coverage, and normal operational baselines.
stealth_mechanisms:
- mechanism_ref: NM-DO
  role: primary
  summary:
    zh: 关键探测信息被拆分到多个片段中，单个分片无法表达完整语义，检测系统必须正确重组后才能检查
    en: Critical probe information is split across fragments, preventing any individual fragment from expressing complete semantics and requiring
      correct reassembly before inspection
  analysis:
    paragraphs:
    - zh: 使单个分片缺少完整的端口、标志或其他探测上下文，并利用分片顺序、大小、重叠或重组策略差异形成检查缺口。由此，完整探测报文变为多个小分片，可能出现跨传输层首部、重叠、乱序、缺失或异常重组超时。未进行一致重组的防守设备可能看不到完整端口、标志和协议语义，或与目标终端对同一报文形成不同解释，最终降低无状态过滤、未重组检测或与终端重组策略不一致的监测设备对扫描报文的检查能力。
      en: Ensure that individual fragments lack complete port, flag, or other probe context and exploit differences in fragment order, size, overlap,
        or reassembly policy to create inspection gaps. As a result, a complete probe becomes multiple small fragments, potentially spanning transport
        headers or exhibiting overlap, reordering, loss, or abnormal reassembly timeout. Defensive devices without consistent reassembly may not
        see complete ports, flags, or protocol semantics, or may interpret the same packet differently from the target endpoint. Ultimately, the
        effect is to reduce the inspection capability of stateless filters, non-reassembling detection, or sensors whose reassembly policy differs
        from the endpoint.
