schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0001-005
parent_ref: NJT-0001
name:
  zh: 探测特征伪装
  en: Probe-Feature Camouflage
summary:
  zh: 调整主动探测报文的来源端口、载荷、长度、协议字段或交互模式，使其接近允许或常见流量特征。
  en: Adjust source ports, payloads, lengths, protocol fields, or interaction patterns of active probes so they resemble permitted or common traffic.
aliases:
- Benign-Looking Probe Traffic
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 探测特征伪装调整主动探测报文或应用请求的可见属性，使其更接近目标环境允许或常见的流量。可调整的对象包括来源端口、报文长度、载荷内容、协议字段和交互顺序。其匿迹效果来自降低特征可区分性，而不是降低事件数量。
    en: Probe-Feature Camouflage modifies visible attributes of active-probe packets or application requests so they resemble traffic permitted
      or common in the target environment. Adjustable attributes include source port, packet length, payload content, protocol fields, and interaction
      order. Its stealth effect comes from reducing feature distinguishability, not from reducing event count.
  - zh: 本子技术的基本工作过程是选择被允许或被信任的可见属性，并避免扫描工具典型的最小报文、固定载荷、端口或交互序列。其预期匿迹目标是降低探测流量与正常业务、健康检查或常见客户端访问之间的可区分性。
    en: The operating principle is to select visible attributes that are commonly permitted or trusted and avoid minimal packets, fixed payloads,
      ports, or interaction sequences characteristic of scanning tools. The intended stealth effect is to reduce the distinguishability of probe
      traffic from normal business traffic, health checks, or common client access.
stealth_characteristics:
  paragraphs:
  - zh: 探测特征伪装使报文外观和交互特征接近正常或允许流量，从而削弱基于端口、长度、固定载荷或简单签名的检测对侦察意图的区分能力。请求仍然可见，但防守方需要结合完整协议语义和跨目标行为才能正确判断。
    en: Probe-Feature Camouflage makes packet appearance and interaction patterns resemble normal or permitted traffic, weakening the ability
      of port-, length-, payload-, or signature-based detection to distinguish reconnaissance intent. Requests remain visible, but defenders need
      full protocol semantics and cross-target behavior to classify them correctly.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术的纳入范围包括有意调整来源端口、报文长度、载荷或协议外观以接近允许流量、调整后仍以获取侦察信息为直接目的。这些变化必须是攻击者有意控制的匿迹变量，而不是偶然或自然产生的现象。
    en: The included scope covers deliberate adjustment of source port, packet length, payload, or protocol appearance to resemble permitted traffic
      and the adjusted traffic still has reconnaissance information acquisition as its immediate purpose. These changes must be deliberately controlled
      by the adversary as evasion variables rather than arise accidentally or naturally.
  - zh: 本分类不包括仅使用常见协议但没有降低可区分性的普通扫描、只改变速率、来源数量或来源身份而不改变探测外观。与兄弟子技术的边界如下：与 NJS-0001-003 的区别是本技术伪装探测报文本身，而不是来源身份；与 NJS-0001-004 的区别是本技术保留完整报文但改变可见特征，而不是跨分片拆分语义。
    en: 'The classification excludes ordinary scanning that merely uses a common protocol without reducing distinguishability and changes only
      to rate, number of origins, or origin identity without changing probe appearance. It differs from sibling sub-techniques in the following
      ways: differs from NJS-0001-003 because it disguises the probe itself rather than source identity; differs from NJS-0001-004 because it
      preserves a complete packet while changing visible features rather than splitting semantics across fragments.'
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术主要应用于依赖端口信任、简单特征或静态签名的网络边界、正常业务流量量大、探测请求容易混入背景的服务。在这些场景中，攻击者需要在继续获得主动扫描反馈的同时，削弱局部观察面对完整活动的识别或解释能力。
      en: This sub-technique primarily applies in network perimeters relying on port trust, simple features, or static signatures and services
        with high normal traffic volume in which probes can blend into the background. In these settings, the adversary needs to preserve feedback
        from Active Scanning while weakening the ability of a local vantage point to identify or explain the complete activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者模型假设攻击者了解目标允许的协议、端口或常见客户端特征、扫描工具允许控制报文或应用请求外观。攻击者还必须能够主动控制本子技术的关键变量，而不是仅因网络状态、设备性能或偶发条件产生相似痕迹。
        en: The attacker model assumes that the adversary understands permitted protocols, ports, or common client characteristics at the target
          and the scanning tool allows control over packet or application-request appearance. The adversary must also deliberately control the
          defining variable rather than produce similar traces only through network conditions, device performance, or coincidence.
    defender_model:
      paragraphs:
      - zh: 防守方模型假设能够观察到常见端口或合法协议外观与实际会话状态不一致、低信息量请求跨多个目标或服务重复、报文载荷、长度或顺序与真实客户端基线存在稳定偏差。这些信号通常不能单独证明恶意，必须结合时间、来源、协议状态、目标覆盖和正常业务基线进行关联。
        en: The defender model assumes visibility into common ports or legitimate protocol appearance inconsistent with actual session state,
          low-information requests repeated across multiple targets or services and stable deviations in payload, length, or sequence from real-client
          baselines. These signals usually do not prove malicious intent on their own and must be correlated with time, origin, protocol state,
          target coverage, and normal operational baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 报文外观和交互特征接近正常或允许流量时，基于端口、长度、固定载荷或简单签名的检测难以区分其侦察意图
    en: When packet appearance and interaction features resemble normal or permitted traffic, detection based on ports, length, fixed payloads,
      or simple signatures has difficulty distinguishing reconnaissance intent
  analysis:
    paragraphs:
    - zh: 选择被允许或被信任的可见属性，并避免扫描工具典型的最小报文、固定载荷、端口或交互序列。由此，典型扫描工具特征被替换或弱化，探测报文在端口、长度、载荷或协议交互上接近正常基线。防守方能够看到请求，但仅凭局部特征难以判断其为侦察，需要结合协议语义和跨目标行为，最终降低探测流量与正常业务、健康检查或常见客户端访问之间的可区分性。
      en: Select visible attributes that are commonly permitted or trusted and avoid minimal packets, fixed payloads, ports, or interaction sequences
        characteristic of scanning tools. As a result, characteristic scanner features are replaced or weakened, and probe packets approach normal
        baselines in port, length, payload, or protocol interaction. Defenders can see the requests but cannot reliably classify them as reconnaissance
        from local features alone, requiring protocol-semantic and cross-target analysis. Ultimately, the effect is to reduce the distinguishability
        of probe traffic from normal business traffic, health checks, or common client access.
  evidence_refs:
  - REF-000003
  confidence: medium
defense:
  detections:
    coverage: available
    strategy_refs:
    - DET-000004
  mitigations:
    coverage: deferred
    mitigation_refs: []
    rationale:
      paragraphs:
      - zh: 尚未建立可独立映射到本子技术的规范缓解对象。
        en: No canonical mitigation has yet been mapped independently to this sub-technique.
evidence:
  claim_refs:
  - CLM-000006
  case_refs: []
  reference_refs:
  - REF-000003
research:
  limitations:
    paragraphs:
    - zh: 当前分类主要由技术能力、机理链和可观测差异支撑，尚缺少能够独立证明攻击者有意采用该方式的公开案例；分析时必须排除正常网络条件或合法操作造成的相似表现。
      en: The classification is currently supported mainly by technical capability, causal reasoning, and observable differences, without a public
        case that independently proves deliberate adversary use; analysis must exclude similar effects caused by normal network conditions or
        legitimate operation.
