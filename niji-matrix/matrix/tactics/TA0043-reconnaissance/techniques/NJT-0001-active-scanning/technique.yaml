research:
  limitations:
    paragraphs:
    - zh: 主动扫描具有大量合法用途，行为本身不能直接证明恶意意图。Triton 资料只能证明恶意活动采用了目标网络侦察，不能据此推断某一具体匿迹子技术；Sality 案例虽然为时间稀释和分布式源扫描提供了较强支持，但不能代表所有高隐蔽主体。
      en: Active Scanning has many legitimate uses, so the behavior alone does not prove malicious intent. Reporting on Triton demonstrates malicious
        reconnaissance against target networks but does not establish a particular Niji evasion sub-technique; the Sality case strongly supports
        temporal dilution and distributed-source scanning but does not represent every stealth-oriented adversary.
    - zh: 探测特征伪装目前主要由工具能力文档支撑，真实恶意活动案例证据弱于其他子技术，因此保持中等置信度。未来新增证据必须区分工具具备某项能力、攻击者实际使用该能力以及该能力确实产生匿迹效果这三个不同结论层级。
      en: Probe-Feature Camouflage is currently supported primarily by tool-capability documentation, with weaker malicious-case evidence than
        the other children, so it remains medium-confidence. Future evidence must distinguish among a tool possessing a capability, an adversary
        actually using it, and that use producing a demonstrated stealth effect.
