schema_version: 2.0.0
type: technique
id: NJT-0001
name:
  zh: 主动扫描
  en: Active Scanning
summary:
  zh: 通过网络流量直接探测目标基础设施，以获得资产、服务、协议、配置和暴露面信息，并通过改变探测痕迹降低检测、关联或归因能力。
  en: Directly probe victim infrastructure through network traffic to learn about assets, services, protocols, configurations, and exposure while
    altering probe traces to reduce detection, correlation, or attribution.
aliases: []
classification:
  tactic_refs:
  - TA0043
  origin:
    kind: attack-retained
    source_attack_id: T1595
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1595
definition_and_concept:
  paragraphs:
  - zh: 主动扫描是攻击者在获得目标内部访问前，通过网络请求、连接尝试或协议探测与目标基础设施或其直接服务路径发生交互，从响应、超时、错误和协议行为中获取网络事实的侦察技术。这些事实可以揭示资产存活、服务暴露、应用入口和配置特征，并支持目标筛选、攻击面理解及后续行动规划。
    en: Active Scanning is a reconnaissance technique in which an adversary interacts with victim infrastructure or its direct service path through
      network requests, connection attempts, or protocol probes before obtaining internal access. Responses, timeouts, errors, and protocol behavior
      reveal facts about asset availability, exposed services, application entry points, and configuration characteristics that support targeting
      and follow-on planning.
  - zh: 本技术关注主动探测行为本身，以及攻击者为了降低可观察性、可关联性、可区分性或可归因性而改变探测实施方式的过程。扫描对象、扫描内容和具体工具可以影响行动细节，但它们本身不构成匿迹子技术。
    en: This technique concerns active probing itself and the ways adversaries alter its execution to reduce observability, correlation, distinguishability,
      or attribution. Scan targets, requested information, and particular tools can shape an operation, but they do not independently constitute
      evasion sub-techniques.
stealth_characteristics:
  paragraphs:
  - zh: 主动扫描天然会在目标侧和网络路径上留下痕迹。高隐蔽扫描的核心矛盾在于，攻击者必须获得足够反馈以完成侦察，同时又要避免在单一时间窗口、来源、传感器或特征空间内形成容易识别和归因的完整扫描图像。
    en: Active Scanning necessarily leaves traces at the target and along the network path. Its central stealth problem is to obtain enough feedback
      for reconnaissance without forming a complete and readily recognizable scan picture in any single time window, source, sensor, or feature
      space.
  - zh: 攻击者可以改变扫描痕迹的密度、时间分布、真实来源分布、来源可归因性、报文可检查性和可见外观。匿迹效果并不意味着痕迹消失，而是把完整活动拆散到防守方难以在单一观察面或短周期内关联和解释的形态。
    en: An adversary can change the density, timing, real-source distribution, attribution, inspectability, and visible appearance of scan traces.
      The traces do not disappear; instead, the complete activity is distributed into a form that is difficult to correlate and interpret from
      one vantage point or short observation window.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入直接面向目标基础设施的网络请求、连接尝试和协议探测，以及为降低这些活动的可见性和关联性而进行的速率、来源、路径、分片或请求特征调整。其直接目的必须是获取侦察信息，而不是改变目标状态或取得访问权限。
    en: This technique includes network requests, connection attempts, and protocol probes directed at victim infrastructure, together with changes
      to rate, origin, path, fragmentation, or request features that reduce visibility or correlation. The immediate purpose must be reconnaissance
      rather than changing victim state or obtaining access.
  - zh: 不与目标基础设施直接交互的公开资料查询和第三方数据库检索不属于主动扫描；获得内部访问后的主机、账户和内部网络发现也不属于本技术。由拥塞、设备性能、路径 MTU 或误配置自然造成的低速、分片和异常流量，不能仅凭外观被认定为匿迹实现。
    en: Public-information collection and third-party database queries that do not directly contact victim infrastructure are outside this technique,
      as are host, account, and internal-network discovery after access. Low-rate, fragmented, or anomalous traffic caused naturally by congestion,
      device performance, path MTU, or misconfiguration must not be classified as an evasion implementation based on appearance alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 主动扫描要求攻击者能够向目标地址、服务、应用入口或相邻网络接口发送流量，并能够观察响应、超时、错误或其他可用于推断的反馈。它通常出现在攻击前互联网侦察中，适用于对外暴露基础设施以及云、边缘、分段网络和工业控制边界。
      en: Active Scanning requires the adversary to send traffic to target addresses, services, application entry points, or adjacent network
        interfaces and to observe responses, timeouts, errors, or other inferential feedback. It commonly occurs during pre-compromise Internet
        reconnaissance against exposed infrastructure and cloud, edge, segmented-network, or industrial-control perimeters.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者模型假设其能够向目标地址、服务、应用入口或相邻网络接口发送网络流量，并能够从响应、超时、错误和协议状态中获得反馈。攻击者可以控制探测节奏、来源或报文构造，并根据所采用的匿迹子技术承担更长行动周期、协调多个真实来源或控制原始报文的成本。
        en: The attacker model assumes an adversary can send network traffic to target addresses, services, application entry points, or adjacent
          interfaces and obtain feedback from responses, timeouts, errors, and protocol state. Depending on the evasion sub-technique, the adversary
          can control probing cadence, origins, or packet construction and can bear the cost of longer campaigns, coordination across real sources,
          or raw-packet control.
    defender_model:
      paragraphs:
      - zh: 防守方可能观察到连接尝试、失败连接、协议请求与响应，以及来源、目标、端口、时间和首部字段。单个事件通常缺乏判定力，分析需要结合请求顺序、速率、目标覆盖、响应结果和跨来源共同特征来重构整体活动。
        en: Defenders may observe connection attempts, failed connections, protocol requests and responses, and associated source, destination,
          port, timing, and header fields. Individual events are often inconclusive, so analysis must combine request ordering, rate, target coverage,
          response outcomes, and features shared across sources to reconstruct the activity.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 将探测分散到更长时间或多个真实来源，降低局部信号强度并提高跨窗口、跨来源关联成本
    en: Disperse probes over longer periods or multiple real sources to reduce local signal strength and increase cross-window and cross-source
      correlation cost
  analysis:
    paragraphs:
    - zh: 时间稀释扫描通过降低单源速率、延长间隔或交替活动与静默，把原本集中的扫描序列摊入更长周期；分布式源扫描则把互补目标、端口或探测阶段分配给多个真实来源。两者都会降低单个窗口、来源或传感器看到的异常强度，使完整扫描只能通过长期和跨来源关联恢复。
      en: Temporal-Dilution Scanning lowers per-source rate, extends intervals, or alternates activity and silence so that a concentrated scan
        is spread across a longer horizon. Distributed-Source Scanning instead allocates complementary targets, ports, or probing stages across
        multiple real origins. Both reduce the anomaly strength visible in one window, source, or sensor and require long-horizon, cross-source
        correlation to recover the complete scan.
    - zh: 两种子技术可以组合，但分类变量不同：前者主要改变时间，后者主要改变真实执行来源的空间分布。保持这一边界可以避免把所有低密度扫描笼统归入同一类别。
      en: 'The two sub-techniques can be combined, but their classification variables differ: the former primarily changes time, while the latter
        changes the spatial distribution of real executing origins. Preserving that distinction prevents all low-density scanning from collapsing
        into one category.'
  evidence_refs:
  - REF-000002
  - REF-000004
  - REF-000005
  - REF-000006
  - REF-000007
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 利用诱饵、中间来源或请求特征调整，使真实来源或侦察意图更难与其他来源及正常流量区分
    en: Use decoys, intermediary origins, or request-feature manipulation to make the true source or reconnaissance intent harder to distinguish
      from other origins and normal traffic
  analysis:
    paragraphs:
    - zh: 来源归因混淆在目标可见的来源与真实发起者之间加入诱饵、代理、中继或间接主机，使扫描行为即使被发现，也难以仅凭目标侧记录确定控制主体。探测特征伪装则保留完整请求，但调整端口、长度、载荷、协议字段或交互顺序，使请求在局部上接近允许或常见流量。
      en: Source-attribution obfuscation inserts decoys, proxies, relays, or indirect hosts between the origin visible to the target and the true
        initiator, so target-side records cannot reliably identify the controlling actor even when scanning is detected. Probe-Feature Camouflage
        keeps requests intact but adjusts ports, length, payload, protocol fields, or interaction order so they locally resemble permitted or
        common traffic.
    - zh: 来源归因混淆关注观测来源是否真实代表发起者，而分布式源扫描要求每个来源实际承担互补任务；探测特征伪装关注请求外观，而不是来源身份。检测因此需要同时验证来源真实性、完整协议语义和跨目标行为。
      en: Source-attribution obfuscation asks whether observed origins represent the true initiator, whereas distributed scanning requires each
        origin to perform complementary work; probe-feature camouflage concerns request appearance rather than source identity. Detection therefore
        needs to validate source authenticity, full protocol semantics, and behavior across targets.
  evidence_refs:
  - REF-000003
  confidence: high
- mechanism_ref: NM-DO
  role: secondary
  summary:
    zh: 使用 IP 分片使关键首部和探测语义无法在单个片段中完整呈现，增加一致重组和检查要求
    en: Use IP fragmentation so critical headers and probe semantics do not appear completely in one fragment, increasing consistent reassembly
      and inspection requirements
  analysis:
    paragraphs:
    - zh: 分片探测扫描把端口、标志或其他关键语义拆分到多个 IP 分片中，使无状态过滤器或未执行正确重组的传感器无法检查完整请求。重叠、乱序、缺失和超时还可能使传感器与目标终端对同一流量形成不同解释，从而降低检测可靠性。
      en: Fragmented-Probe Scanning distributes ports, flags, or other critical semantics across IP fragments so stateless filters or sensors
        without correct reassembly cannot inspect the complete request. Overlap, reordering, loss, and timeout can also cause sensors and endpoints
        to interpret the same traffic differently, reducing detection reliability.
    - zh: 这里被遮蔽的是报文结构中的完整探测语义，而不是加密内容。只有能够证明分片有意用于降低检查能力时才属于本机理，正常路径 MTU 分片不纳入。
      en: The obscured data is the complete probe meaning embodied in packet structure, not encrypted content. Fragmentation belongs here only
        when it is deliberately used to reduce inspectability; ordinary path-MTU fragmentation is excluded.
  evidence_refs:
  - REF-000003
  - REF-000008
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立五项匿迹子技术：时间稀释扫描、分布式源扫描、来源归因混淆扫描、分片探测扫描和探测特征伪装。它们分别改变扫描发生的时间、真实执行来源的分布、可见来源与真实发起者的关系、报文可检查性以及完整请求的可见特征。
      en: 'This technique defines five evasion sub-techniques: Temporal-Dilution Scanning, Distributed-Source Scanning, Source-Attribution-Obfuscated
        Scanning, Fragmented-Probe Scanning, and Probe-Feature Camouflage. They respectively change scan timing, the distribution of real executing
        origins, the relationship between visible and true origins, packet inspectability, and the visible features of complete requests.'
    - zh: 子技术按稳定的匿迹实现变量和防守观测影响划分，而不是按扫描目标、扫描内容、协议名称或工具名称划分。组合使用不会改变各自独立的分类边界。
      en: The children are partitioned by stable evasion variables and defender-observation effects rather than scan targets, requested information,
        protocol names, or tool names. Combined use does not erase their independently defined boundaries.
