schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0032-001
parent_ref: NJT-0032
name:
  zh: 第三方主机观测替代
  en: Third-Party Host-Observation Substitution
summary:
  zh: 查询互联网测绘或历史主机数据，复用第三方已经产生的端点观测，以替代攻击者重新向目标发送相应探测。
  en: Query Internet-mapping or historical host data and reuse endpoint observations already produced by a third party instead of re-probing the victim.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 第三方主机观测替代是攻击者从互联网测绘、资产搜索或历史观测平台取得主机、服务、版本、设备和配置信息，并使用提供方已经完成的测量替代自身对目标的相应探测。攻击者的直接行为是查询平台索引、快照或导出结果，目标在该阶段不必建立当前会话。
    en: Third-Party Host-Observation Substitution occurs when an adversary obtains host, service, version, device, and configuration information from Internet-mapping, asset-search, or historical-observation platforms and uses measurements already performed by the provider instead of conducting equivalent victim probes. The adversary directly queries a provider index, snapshot, or export, and the victim need not establish a current session during this stage.
  - zh: 该概念要求第三方观测实际替代目标交互；平台只是介质，稳定分类变量是原始测量主体由攻击者变为数据提供方。随后由攻击者重新验证端口、服务或协议的部分是独立主动扫描行为，不因前置平台查询而并入本子技术。
    en: The concept requires third-party observation to substitute for victim interaction; the platform is only a medium, while the stable classification variable is that the original measurement actor changes from the adversary to the data provider. Any later adversary revalidation of a port, service, or protocol is separate Active Scanning and does not become part of this child because a platform query preceded it.
stealth_characteristics:
  paragraphs:
  - zh: 第三方主机观测替代把攻击者与目标之间的直接采集流量改为数据提供方先前的测量和提供方侧查询记录。受害方本地遥测可能只保留早先无法归因给当前攻击者的平台扫描，甚至在攻击者查询时没有新增事件，因此难以从自身日志确认谁在何时消费了主机画像。
    en: Third-Party Host-Observation Substitution changes direct collection traffic between adversary and victim into prior provider measurements and provider-side query records. Victim telemetry may retain only an earlier platform scan that cannot be attributed to the current adversary, or no new event when the adversary queries, making it difficult to establish who consumed the host profile and when from local logs.
  - zh: 残余痕迹包括提供方账户与 API 审计、导出活动、目标后来遭遇的精确接触，以及组织从外部视角看到的暴露画像。数据过时或信息不完整可能迫使攻击者直接复核目标，从而削弱替代效果并重新产生 NJT-0001 痕迹。
    en: Residual traces include provider account and API audit, export activity, precise downstream contact with the victim, and the exposure profile visible to the organization from an external vantage point. Stale or incomplete data may force the adversary to revalidate the victim directly, weakening substitution and creating NJT-0001 traces again.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入对第三方已经保存的主机、服务、版本、设备和历史观测的查询，且在本子技术范围内不向目标重新发送对应探测。查询结果必须用于具体目标的主机画像、筛选或后续行动，而不是一般安全研究或无目标资产分析。
    en: This sub-technique includes queries for host, service, version, device, and historical observations already stored by a third party, with no corresponding victim probe performed within this child. Results must support profiling, selection, or follow-on action against a concrete victim rather than general security research or untargeted asset analysis.
  - zh: 通过代理、租用基础设施或僵尸网络由攻击者实际执行扫描不属于替代，因为原始测量主体仍由攻击者控制。仅获得 DNS、路由、地址或拓扑等网络级属性属于相应网络信息范围；后续直接验证属于 NJT-0001。与兄弟项的区别是目标无需建立当前 Web 会话，原始观测在攻击者查询前已由第三方生成。
    en: Adversary-operated scanning through proxies, rented infrastructure, or botnets is not substitution because the original measurement actor remains adversary-controlled. Acquisition limited to DNS, routing, addressing, or topology belongs to the corresponding network-information scope, and later direct validation belongs to NJT-0001. Unlike its siblings, this child requires no current victim web session because a third party produced the original observation before the adversary query.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在目标选择、漏洞适配或入口规划前，通过 FOFA、Shodan、Censys 等互联网测绘和历史观测服务筛选暴露主机的场景。它尤其适合不希望由自身基础设施产生早期目标侧探测痕迹，但能够容忍数据陈旧和平台审计风险的行动。
      en: This sub-technique applies when an adversary uses Internet-mapping and historical-observation services such as FOFA, Shodan, or Censys to select exposed hosts before targeting, exploit adaptation, or entry planning. It particularly suits operations seeking to avoid early victim-side probes from adversary infrastructure while tolerating stale data and provider-audit risk.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要获得提供方公开、注册、付费或被滥用的查询能力，并能把平台字段映射到具体目标和后续决策。其约束包括查询配额、账户归因、平台数据覆盖与时效，以及不重新验证目标时可能接受错误画像的成本。
        en: The adversary needs public, registered, paid, or abused provider query capability and must map provider fields to concrete victims and downstream decisions. Constraints include query quotas, account attribution, platform coverage and freshness, and the cost of accepting an inaccurate profile when the victim is not revalidated.
    defender_model:
      paragraphs:
      - zh: 防守方通常只能看到第三方早先的测量、组织自己的外部暴露状态和后续接触，而缺少查询账户、条件和导出内容。若数据提供方共享账户与 API 审计，防守方可以直接关联；否则只能依据暴露属性的稀有度、后续使用精度和时间顺序作条件推断。
        en: Defenders usually see only earlier third-party measurements, their organization's external exposure state, and downstream contact, while lacking querying account, terms, and export content. Provider sharing of account and API audit enables direct correlation; otherwise defenders can make only conditional inference from attribute rarity, precision of downstream use, and event sequence.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 让数据提供方承担原始测量，使攻击者查询留在平台侧并避免目标出现对应的攻击者采集事件
    en: Have a data provider perform the original measurement so the adversary query remains provider-side and the victim has no corresponding adversary collection event
  analysis:
    paragraphs:
    - zh: 攻击者从平台检索已有主机观测并直接用于筛选或规划，而不重复测量目标。行为设计把攻击者发起的主机探测替换为提供方过去的扫描和当前平台查询；受害方在攻击者消费数据时没有新增流量，目标日志也无法识别实际查询账户。检测必须跨越组织边界获得提供方审计或从后续精确使用反推，因而降低本地可观察性和归因能力。
      en: The adversary retrieves existing host observations from a platform and uses them directly for selection or planning without remeasuring the victim. The design replaces adversary-originated host probes with past provider scans and a current platform query; no new victim traffic occurs when the adversary consumes the data, and target logs cannot identify the actual querying account. Detection must cross organizational boundaries for provider audit or infer backward from precise downstream use, reducing local observability and attribution.
  evidence_refs: [REF-000025, REF-000026]
  confidence: medium
