research:
  limitations:
    paragraphs:
    - zh: 公开报告证明恶意主体使用第三方互联网测绘，但通常没有给出完整平台查询审计，也不一定证明选择平台的主观目的就是匿迹。因此本子技术的痕迹替代因果链成立，但攻击者意图和单次活动归因保持中等置信度。
      en: Public reporting establishes malicious use of third-party Internet mapping but usually lacks complete platform query audit and does not necessarily prove that stealth was the subjective reason for choosing the platform. The causal trace substitution is supported, while adversary intent and attribution of an individual query remain medium confidence.
