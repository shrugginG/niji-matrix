research:
  limitations:
    paragraphs:
    - zh: User-Agent 和协商字段被广泛用于正常服务，单条请求无法证明恶意。现有案例直接支持基于 User-Agent 的选择性投递，但不同协议字段和环境的泛化仍需更多事件证据；浏览器降粒度和中间设备重写也会改变攻击者与防守方实际可见内容。
      en: User-Agent and negotiation fields are widely used by normal services, so one request cannot establish malicious intent. Current incident evidence directly supports User-Agent-based selective delivery, but generalization across other protocol fields and environments needs more case evidence; browser reduction and intermediary rewriting also change what adversaries and defenders actually see.
