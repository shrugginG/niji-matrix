schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0032-002
parent_ref: NJT-0032
name:
  zh: 环境请求元数据采集
  en: Ambient Request-Metadata Harvesting
summary:
  zh: 在目标主动建立普通会话时，仅消费请求固有字段推断主机属性，不触发附加客户端枚举。
  en: Infer host attributes only from fields inherent in an ordinary victim-initiated session without triggering additional client enumeration.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 环境请求元数据采集是攻击者在目标访问其可观察的 HTTP 或类似服务时，从原始请求已经携带的 User-Agent、语言、地址、客户端提示和协商字段推断主机属性，并把结果用于目标筛选或选择性响应。服务器不要求客户端为画像发送新的请求或执行附加属性枚举。
    en: Ambient Request-Metadata Harvesting occurs when an adversary infers host attributes from User-Agent, language, address, client hints, and negotiation fields already carried by the original request as the victim accesses an observable HTTP or similar service, then uses the result for target selection or selective response. The server does not require the client to send a new profiling request or execute additional property enumeration.
  - zh: 稳定分类变量是采集对客户端事件增量为零，而不是某一具体首部字段。读取字段只有在服务于恶意主机画像、筛选或后续动作选择时才属于本子技术；正常服务为了兼容性、区域化或无障碍目的处理相同字段不在范围内。
    en: The stable classification variable is zero incremental client event count, not any particular header field. Reading a field belongs to this sub-technique only when it serves malicious host profiling, selection, or downstream action choice; normal processing of the same fields for compatibility, localization, or accessibility is outside scope.
stealth_characteristics:
  paragraphs:
  - zh: 环境请求元数据采集让主机画像共享目标本来就会产生的资源访问，目标侧不会出现独立枚举消息或额外客户端 API 调用。局部网络和浏览器记录与普通访问相同，画像目的存在于远端服务器逻辑和不同客户端获得的响应差异中，因此单个受害方事件难以揭示恶意意图。
    en: Ambient Request-Metadata Harvesting makes host profiling share resource access the victim would generate anyway, producing no separate enumeration message or additional client API call. Local network and browser records match ordinary access, while profiling intent resides in remote server logic and differences among responses to different clients, making malicious purpose difficult to reveal from one victim event.
  - zh: 残余痕迹包括请求字段本身、远端根据字段选择内容的稳定模式、与后续投递结果的对应以及服务端审计。若请求字段已被浏览器降粒度、不同平台返回相同内容，或攻击者需要运行附加脚本才能补全画像，本子技术的匿迹和信息价值都会降低。
    en: Residual traces include the request fields themselves, stable remote content selection from those fields, correspondence with downstream delivery, and server-side audit. The stealth and information value decline when browsers reduce field granularity, platforms receive identical content, or the adversary must run additional scripts to complete the profile.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入目标主动访问远端资源时，只读取原始请求固有字段并用于恶意平台判断、主机画像或选择性响应的行为。请求可以来自浏览器、身份客户端、下载工具或其他正常协议实现，但本子技术内不得要求客户端为画像执行额外属性读取。
    en: This sub-technique includes behavior that reads only fields inherent in an original victim-initiated resource request and uses them for malicious platform determination, host profiling, or selective response. Requests may come from browsers, identity clients, download tools, or other normal protocol implementations, but this child must not require additional client property access for profiling.
  - zh: JavaScript、Web API 或其他客户端代码执行附加属性读取和回传属于 NJS-0032-003；目标不建立当前会话且攻击者查询第三方既有观测属于 NJS-0032-001。合法兼容性处理、反欺诈和分析不因读取 User-Agent 而进入本技术，直接向目标发送专用探测也不属于本子技术。
    en: Additional property access and reporting through JavaScript, web APIs, or other client code belongs to NJS-0032-003, while use of pre-existing third-party observations without a current victim session belongs to NJS-0032-001. Legitimate compatibility, anti-fraud, and analytics do not enter this technique merely by reading User-Agent, and dedicated direct victim probes are outside this child.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于目标访问攻击者控制、被入侵或用于投递的 Web 资源，攻击者希望在返回内容、载荷或后续链接前判断操作系统、客户端软件或语言环境。它也适用于身份入口和下载服务中以原始请求字段进行目标资格筛选的场景。
      en: This sub-technique applies when a victim accesses adversary-controlled, compromised, or delivery-oriented web resources and the adversary wants to determine operating system, client software, or language environment before returning content, a payload, or a follow-on link. It also applies to target qualification at identity entry points and download services using fields from the original request.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须能够观察目标请求并控制或影响服务器侧处理和响应选择，但不需要控制浏览器脚本执行。其能力受限于标准请求字段的粒度、浏览器隐私措施、代理或网关重写，以及将一次请求可靠绑定到具体目标身份的难度。
        en: The adversary must observe the victim request and control or influence server-side processing and response selection but need not control browser script execution. Capability is constrained by standard field granularity, browser privacy measures, proxy or gateway rewriting, and difficulty binding one request reliably to a concrete target identity.
    defender_model:
      paragraphs:
      - zh: 防守方能够看到出站请求和返回结果时，可以比较不同客户端元数据与响应之间的稳定关系，但通常看不到远端画像规则。单一请求字段十分常见，只有结合已知恶意目的地、差异化内容、未预期下载或后续活动，才能超过合法兼容性背景。
        en: Defenders who see outbound requests and returned results can compare stable relationships between client metadata and responses but usually cannot see remote profiling rules. Individual request fields are ubiquitous, so known malicious destinations, differential content, unexpected downloads, or downstream activity are necessary to rise above legitimate compatibility background.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 仅使用普通请求固有字段完成画像，使局部事件与合法兼容性和内容选择难以区分
    en: Profile only from fields inherent in an ordinary request so the local event is difficult to distinguish from legitimate compatibility and content selection
  analysis:
    paragraphs:
    - zh: 攻击者等待目标发起普通资源请求，在服务器侧读取固有字段并据此选择后续响应。行为设计省去任何显式枚举请求，痕迹保持为正常请求首部和一次内容返回；防守方在单个会话中无法区分远端是在处理兼容性还是进行恶意目标画像。只有跨客户端比较响应并关联后续结果，才能恢复选择逻辑，因此恶意采集的单事件可区分性降低。
      en: The adversary waits for an ordinary victim resource request, reads inherent fields server-side, and selects a downstream response. The design removes any explicit enumeration request, leaving traces as normal request headers and one content response; within one session, defenders cannot distinguish compatibility processing from malicious remote profiling. Recovering the selection logic requires cross-client response comparison and downstream correlation, reducing per-event distinguishability of malicious collection.
  evidence_refs: [REF-000027, REF-000028]
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 由目标主动会话承载主机画像且不增加客户端事件，使采集目的只存在于远端处理逻辑
    en: Carry host profiling in a victim-initiated session without adding a client event so collection purpose exists only in remote processing logic
  analysis:
    paragraphs:
    - zh: 目标因访问资源而主动建立会话，攻击者只消费已经到达服务器的元数据。专用主机探测被目标原本会产生的请求替代，目标侧没有额外消息、属性读取或回传可直接标记为画像；防守方必须取得服务器逻辑或观察差异化响应才能确认用途。采集行为因此在客户端观察面上接近透明，但服务提供方日志和后续内容选择仍保留线索。
      en: The victim initiates a session to access a resource, and the adversary consumes only metadata already received by the server. A request the victim would have generated replaces dedicated host probing, leaving no extra message, property access, or report at the client that directly marks profiling; defenders need server logic or differential-response observation to confirm purpose. Collection is therefore close to transparent at the client vantage point, while provider logs and downstream content selection retain clues.
  evidence_refs: [REF-000027, REF-000028]
  confidence: medium
