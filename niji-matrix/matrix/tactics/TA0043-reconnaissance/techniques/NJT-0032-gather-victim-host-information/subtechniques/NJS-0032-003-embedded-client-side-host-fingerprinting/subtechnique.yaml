schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0032-003
parent_ref: NJT-0032
name:
  zh: 嵌入式客户端主机指纹采集
  en: Embedded Client-Side Host Fingerprinting
summary:
  zh: 将附加主机属性枚举嵌入目标访问的网页会话，由客户端执行并通过常见页面通道回传结果。
  en: Embed additional host-property enumeration in a web session visited by the victim so the client executes it and reports results through common page channels.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 嵌入式客户端主机指纹采集是攻击者把端点属性枚举代码置入受信、被入侵、仿冒或诱导访问的网页内容，使目标浏览器读取软件、补丁、语言、图形、字体、插件、设备或其他系统属性，并在同一会话或相关网络通道回传结果。
    en: Embedded Client-Side Host Fingerprinting occurs when an adversary places endpoint-property enumeration code in trusted, compromised, imitated, or lured web content, causing the victim browser to read software, patch, language, graphics, font, plugin, device, or other system attributes and report results through the same session or a related network channel.
  - zh: 稳定分类变量是客户端实际执行了超出原始请求固有字段的附加属性读取和回传。网页、脚本语言和具体 API 只是实现方式；本概念不包括后续载荷执行、漏洞利用、键盘记录或凭据窃取，也不把合法分析或反欺诈脚本自动视为恶意。
    en: The stable classification variable is actual client execution of additional property reads and reporting beyond fields inherent in the original request. The page, scripting language, and particular APIs are implementation choices; the concept excludes downstream payload execution, exploitation, keylogging, and credential theft and does not automatically treat legitimate analytics or anti-fraud scripts as malicious.
stealth_characteristics:
  paragraphs:
  - zh: 嵌入式客户端主机指纹采集把附加枚举放入目标主动建立的网页会话，使属性访问与常见页面脚本共享进程、执行外观和出站通道。防守方可以观察到 API 调用和回传，但正常网站也大量产生相似行为，因而需要页面完整性、脚本来源、属性集合和目的地上下文才能区分恶意画像。
    en: Embedded Client-Side Host Fingerprinting places additional enumeration inside a victim-initiated web session, causing property access to share process, execution appearance, and outbound channels with common page scripts. Defenders can observe API calls and reporting, but normal sites generate similar behavior at scale, so page integrity, script provenance, attribute sets, and destination context are needed to distinguish malicious profiling.
  - zh: 与环境请求元数据采集相比，本子技术留下更多客户端残余痕迹，包括密集属性读取、新脚本哈希、异常来源和紧随其后的结构化回传。若浏览器限制高熵属性、内容安全策略阻止脚本或页面完整性监测及时发现变更，攻击者的画像范围和匿迹效果都会下降。
    en: Compared with Ambient Request-Metadata Harvesting, this child leaves more client-side residual traces, including dense property access, new script hashes, anomalous origins, and immediate structured reporting. Browser restrictions on high-entropy attributes, content security policy, or timely page-integrity detection reduce both profiling scope and stealth.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入客户端执行附加属性枚举、所得信息服务于恶意主机画像，并通过当前网页会话或相关通道回传的行为。攻击者可以控制页面、篡改受害者信任的网站、影响外部脚本供应链或诱导目标访问仿冒页面，前提是直接目标仍是收集主机属性。
    en: This sub-technique includes client execution of additional property enumeration for malicious host profiling with results reported through the current web session or a related channel. The adversary may control a page, alter a victim-trusted site, influence an external script supply chain, or lure the victim to an imitation page, provided the immediate objective remains collection of host attributes.
  - zh: 只读取原始请求已有字段属于 NJS-0032-002；使用第三方既有观测且目标不建立当前会话属于 NJS-0032-001。载荷执行、漏洞利用、键盘记录、令牌或凭据窃取超出本子技术，合法分析、广告测量和反欺诈脚本也必须结合未授权变更或恶意后续目的才能进入判断。
    en: Reading only fields already present in the original request belongs to NJS-0032-002, while use of pre-existing third-party observations without a current victim session belongs to NJS-0032-001. Payload execution, exploitation, keylogging, and token or credential theft are outside this child, and legitimate analytics, advertising measurement, and anti-fraud scripts require unauthorized change or malicious downstream purpose before they enter the assessment.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在被篡改 VPN 门户、水坑页面、仿冒登录或下载页面中收集访问者端点细节，以决定是否继续投递、选择适配内容或筛除研究环境。它还适用于攻击者滥用已获信任的外部脚本依赖，在不另建显眼采集通道的情况下获得浏览器侧画像。
      en: This sub-technique applies when an adversary collects visitor endpoint detail from an altered VPN portal, watering-hole page, imitation login, or download page to decide whether to continue delivery, select adapted content, or exclude research environments. It also applies when an adversary abuses a trusted external script dependency to obtain a browser-side profile without creating an obviously separate collection channel.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制或影响目标访问的网页和脚本执行上下文，并能够接收枚举结果。其能力包括选择属性 API、处理浏览器差异、维护脚本与回传基础设施以及把画像接入后续逻辑；浏览器沙箱、权限、脚本阻断和页面变更审计会限制可获得属性和驻留时间。
        en: The adversary must control or influence web content and the script-execution context visited by the victim and receive enumeration results. Capabilities include choosing property APIs, handling browser variation, maintaining script and reporting infrastructure, and feeding the profile into downstream logic; browser sandboxing, permissions, script blocking, and page-change audit limit obtainable attributes and dwell time.
    defender_model:
      paragraphs:
      - zh: 防守方需要浏览器、端点或受控分析环境中的脚本级遥测，以及页面和第三方依赖的完整性基线。网络流量只能显示加密会话和目的地时判定力较弱，必须把新脚本、密集属性集合、执行顺序、回传结构、异常目的地和后续差异响应联合起来。
        en: Defenders need script-level telemetry from browsers, endpoints, or controlled-analysis environments together with integrity baselines for pages and third-party dependencies. Network traffic showing only encrypted sessions and destinations has weak discriminative value, requiring combination of new scripts, dense attribute sets, execution order, report structure, anomalous destinations, and downstream differential responses.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 让附加属性读取和回传共享常见网页脚本的执行外观与通道，使恶意画像处于高背景噪声中
    en: Make additional property access and reporting share the execution appearance and channels of common web scripts so malicious profiling sits in high background noise
  analysis:
    paragraphs:
    - zh: 攻击者把枚举模块嵌入目标访问的页面，使浏览器像执行分析、兼容性或反欺诈代码一样读取属性并通过网页通道回传。独立主机枚举由此变成常见脚本 API 调用、页面网络请求和数据对象，局部特征与大量合法活动重叠；防守方必须验证脚本来源、授权状态、属性组合和回传目的，才能从背景中识别恶意采集。结果是单一属性读取或网络事件的可区分性显著下降。
      en: The adversary embeds an enumeration module in a visited page so the browser reads properties and reports through web channels in the same manner as analytics, compatibility, or anti-fraud code. Standalone host enumeration becomes common script API calls, page network requests, and data objects whose local features overlap with abundant legitimate activity; defenders must validate script provenance, authorization, attribute combinations, and reporting purpose to identify malicious collection. The result is materially reduced distinguishability for any individual property access or network event.
  evidence_refs: [REF-000029, REF-000030]
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 由目标浏览行为触发附加枚举，使采集不表现为攻击者从外部发起的独立主机探测
    en: Trigger additional enumeration through victim browsing so collection does not appear as a standalone adversary-originated external host probe
  analysis:
    paragraphs:
    - zh: 目标为了访问网页主动建立会话，攻击者让属性枚举随页面内容执行并复用同一信任和通信上下文。目标侧痕迹从独立外部探测变为内部浏览器脚本活动，边界设备难以仅凭会话方向识别画像目的；只有浏览器遥测和页面完整性能够揭示附加工作。采集在边界观察面上因此更接近普通访问，但并非无迹，因为客户端仍执行和回传额外动作。
      en: The victim initiates a session to access a page, and the adversary causes property enumeration to execute with page content in the same trust and communication context. Victim traces change from a standalone external probe to internal browser-script activity, and perimeter devices cannot identify profiling purpose from session direction alone; browser telemetry and page integrity are needed to reveal the added work. Collection therefore appears more like ordinary access at the perimeter but is not traceless because the client still performs and reports additional actions.
  evidence_refs: [REF-000029]
  confidence: medium
