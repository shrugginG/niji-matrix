research:
  limitations:
    paragraphs:
    - zh: Scanbox 事件直接证明恶意网页主机指纹采集，正常网站测量则证明背景噪声广泛存在，但合法和恶意脚本可能使用相同 API。没有页面完整性、脚本来源或后续行为时，本子技术不能从通用浏览器指纹信号可靠归因，且不同浏览器版本会持续改变可见属性。
      en: The Scanbox incident directly establishes malicious web-based host fingerprinting, while normal-site measurement establishes broad background noise, but legitimate and malicious scripts can use the same APIs. Without page integrity, script provenance, or downstream behavior, generic browser-fingerprinting signals cannot reliably attribute this child, and changing browser versions continue to alter visible attributes.
