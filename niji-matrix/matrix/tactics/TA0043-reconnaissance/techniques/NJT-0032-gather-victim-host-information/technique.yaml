schema_version: 2.0.0
type: technique
id: NJT-0032
name:
  zh: 收集目标主机信息
  en: Gather Victim Host Information
summary:
  zh: 在获得目标内部访问前收集或推断主机、设备、平台和端点属性，并通过第三方观测或普通 Web 会话降低采集的可见性与可区分性。
  en: Collect or infer host, device, platform, and endpoint attributes before internal access while using third-party observations or ordinary web sessions to reduce collection visibility and distinguishability.
aliases: []
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-retained
    source_attack_id: T1592
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1592
definition_and_concept:
  paragraphs:
  - zh: 收集目标主机信息是攻击者在获得目标内部访问前，取得或推断特定主机、设备、平台和端点配置属性的侦查技术。信息可以包括操作系统、软件与版本、补丁、浏览器、语言、插件、设备能力和客户端配置，并用于目标筛选、载荷或内容适配、环境真实性判断及后续行动规划。
    en: Gather Victim Host Information is reconnaissance in which an adversary obtains or infers attributes of specific hosts, devices, platforms, and endpoint configurations before gaining internal access. The information can include operating systems, software and versions, patches, browsers, language, plugins, device capabilities, and client configuration, supporting target selection, payload or content adaptation, environment validation, and follow-on planning.
  - zh: 本技术的概念锚点是所获得的主机信息及不产生攻击者专用直接探测的采集方式，而不是硬件、软件、固件等字段类别。第三方平台、HTTP 请求和网页脚本只是可能的实现介质；只有攻击者有意利用这些路径改变采集痕迹及防守方观察效果时，才形成匿迹实现。
    en: The conceptual anchor is the host information obtained and collection methods that do not create a dedicated adversary direct probe, not field categories such as hardware, software, or firmware. Third-party platforms, HTTP requests, and web scripts are implementation media; they become stealth implementations only when the adversary deliberately uses the path to change collection traces and defender observation.
stealth_characteristics:
  paragraphs:
  - zh: 收集目标主机信息可以把关键画像活动从攻击者与目标之间的专用探测，转化为第三方平台中的查询、目标主动发起的普通资源访问，或与页面功能共存的客户端脚本执行。相应痕迹并未消失，而是停留在数据提供方、远端服务器或浏览器遥测中，受害方边界日志可能看不到实际查询者或只能看到一次正常 Web 会话。
    en: Gather Victim Host Information can transform dedicated probing between an adversary and victim into a query at a third-party platform, ordinary resource access initiated by the victim, or client-script execution interleaved with page functionality. The traces remain, but reside at the data provider, remote server, or browser telemetry; victim perimeter logs may not reveal the actual consumer or may show only a normal web session.
  - zh: 其匿迹效果取决于采集路径是否真正替代直接探测，以及正常活动是否为恶意画像提供足够背景噪声。第三方记录共享、浏览器级脚本遥测、页面完整性和跨客户端响应比较仍可恢复部分行为；公开数据过时、请求字段粒度不足或脚本被阻断也会降低画像价值。
    en: The stealth effect depends on whether the collection path truly substitutes for direct probing and whether normal activity supplies enough background noise for malicious profiling. Provider record sharing, browser-level script telemetry, page integrity, and cross-client response comparison can still recover parts of the behavior; stale public data, coarse request fields, or blocked scripts also reduce profiling value.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击前获得设备、操作系统、软件、版本、补丁、浏览器和客户端配置等具体主机属性，并要求所得画像服务于恶意目标选择、环境适配或后续行动。纳入的匿迹路径包括第三方已存观测替代、只消费目标请求固有元数据，以及在目标主动 Web 会话中执行附加客户端属性枚举。
    en: This technique includes pre-compromise acquisition of concrete host attributes such as device, operating system, software, version, patch, browser, and client configuration when the resulting profile supports malicious targeting, environment adaptation, or follow-on action. Included stealth paths are substitution with stored third-party observations, consumption only of metadata inherent in a victim request, and additional client-property enumeration within a victim-initiated web session.
  - zh: 人员、账户和数字身份属性属于 NJT-0033；网络命名、地址、路由、拓扑和边界属性属于相应网络信息候选；取得内部访问后的本地主机发现不属于 Reconnaissance。攻击者直接向目标发送端口、服务或协议探测的部分仍属于 NJT-0001，合法兼容性、分析、反欺诈和资产管理行为也不能仅凭相同字段或 API 被认定为本技术。
    en: People, account, and digital-identity attributes belong to NJT-0033; network naming, addressing, routing, topology, and perimeter properties belong to the corresponding network-information candidate; local host discovery after access is outside Reconnaissance. Adversary-originated port, service, or protocol probes remain NJT-0001, and legitimate compatibility, analytics, anti-fraud, or asset-management activity must not be classified here merely because it uses the same fields or APIs.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术常用于攻击前筛选互联网暴露设备、判断访问者平台是否符合投递条件、识别浏览器或软件环境，以及为后续社会工程、漏洞利用或内容选择准备端点画像。它适用于第三方互联网测绘与历史观测平台、软件下载与身份入口、VPN 门户、被篡改网站、仿冒页面和外部脚本供应链。
      en: This technique commonly supports pre-compromise selection of Internet-exposed devices, determination of whether a visitor platform qualifies for delivery, identification of browser or software environments, and preparation of endpoint profiles for later social engineering, exploitation, or content selection. It applies to third-party Internet-mapping and historical-observation platforms, software-download and identity entry points, VPN portals, altered sites, imitation pages, and external script supply chains.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够查询已保存目标观测的数据提供方、运营可接收目标请求的服务，或控制和影响目标访问的网页内容。其能力可以从只读取服务器已收到的字段，到编写客户端脚本、维护回传端点和把画像结果接入后续选择逻辑；攻击者还必须接受第三方数据陈旧、浏览器权限限制和受控页面被发现的约束。
        en: The adversary must be able to query a provider holding victim observations, operate a service that receives victim requests, or control or influence web content visited by the victim. Capability ranges from reading fields already received by a server to writing client scripts, maintaining reporting endpoints, and integrating profile results into downstream selection logic; constraints include stale third-party data, browser permission limits, and discovery of controlled pages.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有边界 Web 日志、代理与 DNS 记录、浏览器或端点脚本遥测、页面完整性基线和外部暴露管理数据，但通常无法看到第三方平台的实际查询账户。单条 User-Agent、脚本属性读取或平台查询均缺乏恶意判定力，防守需要跨提供方共享、页面版本、属性集合、回传目的地、差异化响应和后续活动进行关联。
        en: Defenders may have perimeter web logs, proxy and DNS records, browser or endpoint script telemetry, page-integrity baselines, and external-exposure management data, but usually cannot see the actual querying account at a third-party platform. An individual User-Agent value, script property read, or platform query is not sufficient to establish malicious intent; defense requires correlation across provider sharing, page versions, attribute sets, reporting destinations, differential responses, and follow-on activity.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以第三方观测或目标主动会话替代攻击者专用主机探测，使主要采集痕迹离开受害方边界或表现为普通访问
    en: Substitute third-party observations or victim-initiated sessions for dedicated adversary host probes so primary collection traces leave the victim boundary or appear as ordinary access
  analysis:
    paragraphs:
    - zh: 攻击者查询第三方已生成的主机观测，或等待目标访问攻击者可观察的资源，再从固有请求字段或页面执行结果建立画像。行为设计把攻击者发起的专用探测替换为提供方的历史测量、提供方侧查询或目标主动发起的会话；受害方因此没有对应攻击者查询记录，或只看到普通 Web 访问和脚本执行。防守方必须借助提供方审计、端点细节和后续行为才能恢复采集意图，直接可见性与归因能力随之下降。
      en: The adversary queries host observations already produced by a third party or waits for the victim to access an observable resource and then profiles from inherent request fields or page-execution results. This design replaces dedicated adversary probing with provider historical measurements, provider-side queries, or victim-initiated sessions; the victim therefore has no corresponding adversary query record or sees only ordinary web access and script execution. Defenders need provider audit, endpoint detail, and downstream behavior to recover collection intent, reducing direct visibility and attribution.
  evidence_refs: [REF-000025, REF-000026, REF-000027, REF-000029]
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 让主机属性读取与回传接近兼容性、分析、反欺诈和跟踪行为，降低恶意画像在单事件中的可区分性
    en: Make host-property access and reporting resemble compatibility, analytics, anti-fraud, and tracking behavior to reduce per-event distinguishability of malicious profiling
  analysis:
    paragraphs:
    - zh: 攻击者只消费正常请求已经携带的字段，或把附加属性枚举嵌入常见网页脚本和既有出站通道。由此，专用枚举请求变成服务器端普通字段处理，或变成高背景噪声中的浏览器 API 调用与结构化回传；局部日志无法仅凭外观区分恶意画像和合法网站功能。防守方需要结合属性组合、脚本授权状态、回传目的地与选择性响应，才能提高判断可靠性。
      en: The adversary consumes only fields already carried by an ordinary request or embeds additional property enumeration in common web scripts and existing outbound channels. Dedicated enumeration therefore becomes routine server-side field processing or browser API calls and structured reporting within high background noise; local logs cannot distinguish malicious profiling from legitimate site functions by appearance alone. Defenders must combine attribute sets, script authorization state, reporting destination, and selective response to improve reliability.
  evidence_refs: [REF-000027, REF-000028, REF-000029, REF-000030]
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立三项匿迹子技术：第三方主机观测替代、环境请求元数据采集和嵌入式客户端主机指纹采集。它们分别由谁生成原始观测、采集是否增加客户端事件以及客户端是否执行附加属性枚举三个稳定变量界定，并对应目标侧无直接查询、普通请求不增量和网页脚本新增读取与回传三种不同观察结果。
      en: 'This technique defines three evasion sub-techniques: Third-Party Host-Observation Substitution, Ambient Request-Metadata Harvesting, and Embedded Client-Side Host Fingerprinting. They are delimited by stable variables concerning who produces the original observation, whether collection adds a client event, and whether the client executes additional property enumeration, yielding distinct defender outcomes of no direct victim query, no increment beyond an ordinary request, and added page-script reads and reporting.'
    - zh: 分类不沿用 ATT&CK 的硬件、软件、固件或客户端配置类别，也不按平台、工具、网站类型或所获字段拆分。同一次行动可以先消费第三方观测，再从访问请求补充字段或执行网页指纹；组合使用不会消除三个子技术各自的行为和防守边界。
      en: The taxonomy does not inherit ATT&CK categories for hardware, software, firmware, or client configuration and does not partition by platform, tool, site type, or collected field. One operation may consume third-party observations and then enrich them from request fields or web fingerprinting; combined use does not erase the behavioral and defensive boundary of each child.
  coverage: established
  subtechnique_refs: [NJS-0032-001, NJS-0032-002, NJS-0032-003]
