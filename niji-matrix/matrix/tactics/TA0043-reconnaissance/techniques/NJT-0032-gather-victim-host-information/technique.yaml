research:
  limitations:
    paragraphs:
    - zh: 第三方平台查询记录通常不向受害组织开放，公开事件多能证明数据被使用，却难以证明攻击者选择平台的主观目的就是规避检测。目标主动会话也只能证明元数据或脚本结果被暴露，不能在缺少远端逻辑、页面篡改或后续选择证据时单独证明恶意画像。
      en: Third-party platform query records are rarely available to victim organizations, and public incidents often establish data use without proving that the adversary selected the platform specifically to evade detection. A victim-initiated session also proves only that metadata or script results were exposed and cannot alone establish malicious profiling without evidence from remote logic, page alteration, or downstream selection.
    - zh: 合法网站广泛使用客户端适配、分析、反欺诈和浏览器指纹，产生与本技术相似的字段读取和回传。低速、多来源、代理化和缓存使用尚缺少绑定 T1592 且证明刻意释痕的充分证据，因此不作为本技术子技术；未来证据需要同时区分能力存在、攻击者实际使用和可观察匿迹效果。
      en: Legitimate sites widely use client adaptation, analytics, anti-fraud, and browser fingerprinting, producing field access and reporting similar to this technique. Low rate, multiple origins, proxying, and cache use currently lack sufficient T1592-specific evidence of deliberate trace dilution and are not children here; future evidence must distinguish capability, actual adversary use, and observable stealth effect.
