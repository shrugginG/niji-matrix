schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0033-001
parent_ref: NJT-0033
name:
  zh: 受害域外身份获取
  en: Off-Victim Identity Acquisition
summary:
  zh: 从公开、商业、泄露或地下资料中取得并富化具体身份属性，使主要采集不经过受害方身份系统。
  en: Obtain and enrich concrete identity attributes from public, commercial, breached, or illicit material so primary collection does not traverse victim identity systems.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受害域外身份获取是攻击者从公开信息、商业情报、历史泄露、外部代码库或地下市场取得人员、账户、联系、恢复、凭据和其他身份属性，并在目标组织控制范围之外完成实体解析、筛选与富化。所得结果必须形成面向具体目标的可操作身份画像。
    en: Off-Victim Identity Acquisition occurs when an adversary obtains people, account, contact, recovery, credential, and other identity attributes from public information, commercial intelligence, historical breaches, external repositories, or illicit markets and performs entity resolution, selection, and enrichment outside victim control. The result must form an actionable identity profile for a concrete target.
  - zh: 稳定分类变量是主要采集交互不访问目标身份系统，痕迹位于外部平台、泄露材料或离线分析环境。具体来源类别不是子技术边界；只有身份材料的检索和组合实际发生在受害域外，并在后续阶段使用结果时，才属于本概念。
    en: The stable classification variable is that primary collection does not access victim identity systems and its traces reside in external platforms, breached material, or offline analysis. Particular source categories do not define the child; the concept applies only when identity-material retrieval and composition actually occur off-victim and the result is used downstream.
stealth_characteristics:
  paragraphs:
  - zh: 受害域外身份获取使目标身份服务没有攻击者的检索、筛选或富化事件，防守方通常只能看到资料曾公开或泄露，以及随后高度定向的帮助台、恢复或社会工程活动。实际查询者、检索时间和材料组合过程留在第三方或攻击者环境中，因而本地可观察性与采集归因能力显著降低。
    en: Off-Victim Identity Acquisition leaves no adversary retrieval, selection, or enrichment event in victim identity services. Defenders usually see only that material was public or breached and later highly targeted help-desk, recovery, or social-engineering activity. The actual consumer, retrieval time, and composition process remain in third-party or adversary environments, materially reducing local observability and attribution of collection.
  - zh: 残余痕迹包括外部资料来源与发布时间、提供方账户和 API 审计、泄露监测结果，以及后续活动对稀有属性的精确使用。若资料过时、实体解析错误或组织不再使用公开事实作为验证依据，攻击者画像的可操作性会下降。
    en: Residual traces include external-material provenance and publication time, provider account and API audit, breach-monitoring results, and precise downstream use of rare attributes. Profile utility declines when material is stale, entity resolution is wrong, or the organization no longer accepts public facts as verification evidence.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入从受害域外来源取得并组合具体人员、账户、邮箱、电话、恢复线索、历史凭据或其他身份属性，且主要采集阶段不向目标身份系统发起查询的行为。所得画像必须支持恶意目标选择、冒充、社会工程或后续账户行动。
    en: This sub-technique includes obtaining and combining concrete people, account, email, phone, recovery-clue, historical-credential, or other identity attributes from off-victim sources without querying victim identity systems during primary collection. The profile must support malicious targeting, impersonation, social engineering, or follow-on account action.
  - zh: 直接向人员提问或诱导披露属于 T1598；查询目标登录、注册、恢复或 MFA 工作流属于 NJS-0033-002；只建立抽象岗位、部门和组织职责属于组织信息。合法招聘、客户尽调和泄露响应使用相同资料时，不因来源相同而被归类为本子技术。
    en: Directly questioning or inducing disclosure from a person belongs to T1598; querying victim login, registration, recovery, or MFA workflows belongs to NJS-0033-002; building only abstract roles, departments, and organizational responsibilities is organizational information. Legitimate recruiting, customer due diligence, and breach response using the same sources are not classified here merely because the sources overlap.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在接触目标前利用公开资料、商业人员数据和历史泄露确定高价值员工、联系方式、账户关系及恢复线索，并为帮助台冒充、定制化社会工程或账户恢复滥用准备可信背景。它也适用于把多个低敏属性组合成高风险身份画像的长期侦查。
      en: This sub-technique applies when an adversary uses public records, commercial people data, and historical breaches before contact to identify high-value employees, contact details, account relationships, and recovery clues and to prepare credible context for help-desk impersonation, tailored social engineering, or recovery abuse. It also applies to long-term reconnaissance that composes multiple low-sensitivity attributes into a high-risk identity profile.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够访问至少一种外部身份资料来源，并具备把姓名、联系方式、岗位、账户和泄露记录解析到同一实体的能力。更成熟的行动可以使用商业订阅、数据经纪和离线分析，但仍受资料陈旧、同名误配、提供方账户审计和目标身份变化限制。
        en: The adversary needs access to at least one external identity-material source and the ability to resolve names, contact details, roles, accounts, and breach records to the same entity. More mature operations may use commercial subscriptions, data brokers, and offline analysis but remain constrained by stale information, namesake misattribution, provider account audit, and changes in the victim identity.
    defender_model:
      paragraphs:
      - zh: 防守方可能维护公开信息清单、商业暴露扫描、泄露通知和高价值身份风险档案，但通常看不到攻击者实际下载、查询和离线组合资料。判断依赖把已知暴露属性与后续精确冒充或恢复活动连接，并区分合法人员数据使用和恶意目标选择。
        en: Defenders may maintain public-information inventories, commercial exposure scanning, breach notifications, and risk profiles for high-value identities but generally cannot see adversary downloads, queries, or offline composition. Assessment depends on linking known exposed attributes to precise downstream impersonation or recovery activity while separating legitimate use of people data from malicious targeting.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 把身份检索与富化放在外部平台或离线材料中，使目标身份系统没有对应采集事件
    en: Place identity retrieval and enrichment in external platforms or offline material so victim identity systems contain no corresponding collection event
  analysis:
    paragraphs:
    - zh: 攻击者从目标控制范围之外的资料解析并组合身份属性，只在后续行动中使用结果。目标身份系统中的直接查询被外部平台访问、泄露材料处理和离线富化替代，受害方因此无法从本地日志观察采集账户、时间或方法。只有提供方审计、暴露时间线和后续属性使用能够间接连接行为，主要采集在目标观察面上趋于透明。
      en: The adversary resolves and combines identity attributes from material outside victim control and uses the result only in downstream action. Direct queries in victim identity systems are replaced by external-platform access, breached-material processing, and offline enrichment, so local logs cannot reveal the collection account, time, or method. Only provider audit, exposure timelines, and downstream attribute use can indirectly connect the behavior, making primary collection close to transparent at the victim vantage point.
  evidence_refs: [REF-000031, REF-000032]
  confidence: high
