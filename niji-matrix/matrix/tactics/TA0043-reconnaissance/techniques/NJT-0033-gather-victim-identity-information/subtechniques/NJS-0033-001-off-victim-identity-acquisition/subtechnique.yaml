research:
  limitations:
    paragraphs:
    - zh: 公开事件通常证明攻击者使用历史泄露或公开信息支持后续冒充，但很少提供实际检索账户、完整来源集合和离线富化过程。现有证据足以确认域外采集和防守盲区，但对单次查询的恶意意图和具体平台归因仍需提供方记录支持。
      en: Public incidents usually establish adversary use of historical breaches or public information for downstream impersonation but rarely provide actual querying accounts, complete source sets, or offline enrichment processes. The evidence supports off-victim collection and the defensive blind spot, while malicious intent and attribution for any individual query still require provider records.
