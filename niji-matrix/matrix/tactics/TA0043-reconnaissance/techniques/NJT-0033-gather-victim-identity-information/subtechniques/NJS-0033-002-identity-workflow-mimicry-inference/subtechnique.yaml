schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0033-002
parent_ref: NJT-0033
name:
  zh: 身份工作流拟态推断
  en: Identity-Workflow Mimicry and Inference
summary:
  zh: 使用语义有效且外观正常的身份事务，通过响应差异推断账户存在性、恢复方式、MFA 配置或其他身份状态。
  en: Use semantically valid, normal-looking identity transactions to infer account existence, recovery methods, MFA configuration, or other identity state from response differences.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 身份工作流拟态推断是攻击者向登录、注册、密码恢复、联合身份或 MFA 流程发送格式和业务语义有效的请求，再通过正文、状态、跳转、验证选项、资源大小或处理时间差异推断账户存在性和身份配置。请求停留在信息获取阶段，不要求成功认证或改变账户状态。
    en: Identity-Workflow Mimicry and Inference occurs when an adversary sends syntactically and semantically valid requests to login, registration, password-recovery, federation, or MFA flows and infers account existence and identity configuration from differences in content, status, redirects, verification options, resource size, or processing time. Requests remain in the information-acquisition stage and do not require successful authentication or account-state change.
  - zh: 稳定分类变量是主动查询遵循正常身份事务语义，同时被用于跨身份或跨流程比较内部状态。具体云平台、身份产品和响应字段不是边界；只要外部可观察差异被用于身份属性推断，并且结果尚未越过侦查进入访问，就属于本概念。
    en: The stable classification variable is that active queries follow normal identity-transaction semantics while being used to compare internal state across identities or flows. A particular cloud platform, identity product, or response field does not define the boundary; the concept applies when externally observable differences support identity-attribute inference and the result has not crossed from reconnaissance into access.
stealth_characteristics:
  paragraphs:
  - zh: 身份工作流拟态推断使明显账户枚举转化为普通失败或未完成的登录、注册、恢复和 MFA 事务。单条日志通常符合合法客户端和业务流程格式，与用户输入错误、兼容性问题或放弃流程高度相似，防守方必须跨账户、功能、来源和时间关联高扇出及差异比较，才能恢复侦查意图。
    en: Identity-Workflow Mimicry and Inference transforms obvious account enumeration into ordinary failed or incomplete login, registration, recovery, and MFA transactions. An individual log usually conforms to legitimate client and business-flow formats and closely resembles user input error, compatibility problems, or abandoned flows, requiring correlation of fan-out and differential comparison across accounts, functions, origins, and time to recover reconnaissance intent.
  - zh: 残余痕迹包括被请求身份、来源与客户端特征、响应类别和长度、跳转、呈现的验证方式、时延以及流程未完成状态。响应等价化、认证前披露限制和跨工作流风险共享会减少可利用差异；分布式低频执行仍可能提高关联成本，但该执行变量不在本子技术中重复分类。
    en: Residual traces include requested identity, origin and client features, response class and length, redirects, offered verification methods, latency, and incomplete-flow state. Response equalization, pre-authentication disclosure limits, and cross-workflow risk sharing reduce exploitable differences; distributed low-rate execution may still increase correlation cost, but that execution variable is not reclassified within this child.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入以身份属性推断为直接目标的语义有效登录、注册、恢复、联合身份或 MFA 请求，以及对多个身份或流程响应差异的比较。请求可以失败或保持未完成，所得信息包括账户有效性、租户关系、恢复渠道、可用 MFA 方式和其他认证前状态。
    en: This sub-technique includes semantically valid login, registration, recovery, federation, or MFA requests whose immediate objective is identity-attribute inference, together with comparison of response differences across identities or flows. Requests may fail or remain incomplete, and inferred information can include account validity, tenant relationship, recovery channels, available MFA methods, and other pre-authentication state.
  - zh: 密码猜测、凭证填充、成功重置、认证完成和账户接管属于后续访问或凭据行为；直接向人员索取信息属于 T1598；不访问目标身份系统的外部资料获取属于 NJS-0033-001。正常用户错误、批量开户、目录迁移和帮助台测试需要通过授权上下文排除。
    en: Password guessing, credential stuffing, successful reset, completed authentication, and account takeover are downstream access or credential behavior; direct requests to a person belong to T1598; external-material acquisition that does not access victim identity systems belongs to NJS-0033-001. Normal user error, bulk onboarding, directory migration, and help-desk testing require exclusion through authorization context.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在社会工程、帮助台冒充或账户攻击前验证员工账户是否存在、判断可用恢复方式、识别 MFA 配置或确认租户关系。常见环境包括互联网暴露的 SaaS、云身份、SSO、注册、密码恢复和 MFA 服务，特别是不同内部状态会返回可测差异的入口。
      en: This sub-technique applies when an adversary validates employee-account existence, determines available recovery methods, identifies MFA configuration, or confirms tenant relationships before social engineering, help-desk impersonation, or account attack. Common environments include Internet-facing SaaS, cloud identity, SSO, registration, password-recovery, and MFA services, especially entry points where differing internal state produces measurable responses.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要候选身份列表、访问外部身份功能的能力，以及观察和比较响应内容、状态、跳转、验证方式或时延的工具。自动化能够扩大比较规模，但受速率控制、设备指纹、统一响应、挑战流程和来源关联限制；本模型不假定攻击者已经拥有有效凭据。
        en: The adversary needs a candidate identity list, access to external identity functions, and tooling to observe and compare response content, status, redirects, verification methods, or latency. Automation can expand comparison scale but is constrained by rate controls, device fingerprinting, equalized responses, challenge flows, and origin correlation; the model does not assume possession of valid credentials.
    defender_model:
      paragraphs:
      - zh: 防守方需要跨登录、注册、恢复、联合身份和 MFA 服务保留规范化事务日志，并能够关联来源、客户端、身份、响应和完成状态。若 SaaS 提供方只返回聚合告警、日志留存短或中间代理隐藏客户端特征，低频分散推断可能无法重构；单条失败事件仍不能证明恶意。
        en: Defenders need normalized transaction logs across login, registration, recovery, federation, and MFA services and the ability to correlate origin, client, identity, response, and completion state. Low-rate distributed inference may not be reconstructable when a SaaS provider returns only aggregate alerts, retention is short, or intermediaries hide client features; one failed event still cannot establish malicious intent.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 让属性推断请求保持正常身份事务语义，使单条记录与用户错误或未完成流程高度相似
    en: Keep attribute-inference requests within normal identity-transaction semantics so individual records closely resemble user error or incomplete flows
  analysis:
    paragraphs:
    - zh: 攻击者使用合法入口和有效请求格式遍历候选身份，再比较各流程返回的可观察差异。明显枚举特征被替换为常见失败、跳转和未完成流程，局部日志只呈现正常业务事件；防守方需要聚类多个身份、功能和响应簇，并结合共同客户端和时间序列才能发现比较行为。恶意意图由此隐藏在合法事务背景中，降低单事件可区分性。
      en: The adversary uses legitimate entry points and valid request formats across candidate identities, then compares observable differences returned by each flow. Obvious enumeration features are replaced by common failures, redirects, and incomplete flows, so local logs present normal business events; defenders must cluster multiple identities, functions, and response classes with shared client and temporal sequences to reveal comparison behavior. Malicious purpose is thereby hidden in legitimate transaction background, reducing per-event distinguishability.
