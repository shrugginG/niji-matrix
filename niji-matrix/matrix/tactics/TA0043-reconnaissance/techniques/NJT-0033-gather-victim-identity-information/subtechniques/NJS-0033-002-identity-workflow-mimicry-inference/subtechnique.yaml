research:
  limitations:
    paragraphs:
    - zh: OWASP 与 CWE 资料证明响应差异的技术基础，SSPR 事件证明真实攻击者会观察身份验证方式，但产品日志和流程实现差异很大。合法失败和自动化业务流量会产生相似信号，因此检测结论依赖跨事件模式，不能从单个响应差异直接归因。
      en: OWASP and CWE material establish the technical basis for response discrepancies, and the SSPR incident shows a real adversary observing identity verification methods, but product logging and flow implementations vary widely. Legitimate failure and automated business traffic produce similar signals, so detection conclusions depend on cross-event patterns and cannot attribute the activity from one response difference.
