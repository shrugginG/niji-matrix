schema_version: 2.0.0
type: technique
id: NJT-0033
name:
  zh: 收集目标身份信息
  en: Gather Victim Identity Information
summary:
  zh: 在获得目标内部访问前收集或推断具体人员、账户和数字身份属性，并通过域外获取或正常身份事务拟态降低采集可见性与可区分性。
  en: Collect or infer attributes of specific people, accounts, and digital identities before internal access while using off-victim acquisition or normal-transaction mimicry to reduce collection visibility and distinguishability.
aliases: []
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-retained
    source_attack_id: T1589
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1589
definition_and_concept:
  paragraphs:
  - zh: 收集目标身份信息是攻击者在获得目标内部访问前，取得或推断具体人员、账户和数字身份属性的侦查技术。信息可以包括姓名、联系方式、账户存在性、身份标识、历史凭据、恢复线索、MFA 配置和账户状态，并用于高价值目标筛选、身份冒充、社会工程及后续账户行动规划。
    en: Gather Victim Identity Information is reconnaissance in which an adversary obtains or infers attributes of specific people, accounts, and digital identities before gaining internal access. The information can include names, contact details, account existence, identity identifiers, historical credentials, recovery clues, MFA configuration, and account state, supporting high-value target selection, impersonation, social engineering, and planning for follow-on account activity.
  - zh: 本技术的概念锚点是具体身份信息对象及其前置获取过程，而不是凭据、邮箱或姓名等字段类别。公开资料、商业平台、泄露材料和身份工作流只是实现环境；只有攻击者利用域外遥测或正常事务外观改变防守观察时，才形成匿迹实现。
    en: The conceptual anchor is the concrete identity-information object and its pre-compromise acquisition process, not field categories such as credentials, email addresses, or names. Public records, commercial platforms, breached material, and identity workflows are implementation environments; they become stealth implementations only when the adversary uses off-victim telemetry or normal transaction appearance to alter defender observation.
stealth_characteristics:
  paragraphs:
  - zh: 收集目标身份信息可以在公开、商业、泄露或地下资料生态中完成主要筛选与富化，使受害组织身份系统没有对应查询；也可以通过语义有效但未完成的登录、注册、恢复或 MFA 事务比较响应差异，使每条日志接近普通用户错误。前者改变痕迹所在遥测域，后者改变主动推断的局部外观。
    en: Gather Victim Identity Information can perform primary selection and enrichment in public, commercial, breached, or illicit information ecosystems, leaving no corresponding query in victim identity systems. It can also compare response differences across semantically valid but incomplete login, registration, recovery, or MFA transactions so each record resembles ordinary user error. The former changes the telemetry domain of traces; the latter changes the local appearance of active inference.
  - zh: 匿迹效果不等于身份材料或请求消失。外部资料仍有发布时间、来源和访问审计，目标身份服务仍可记录来源、客户端、响应类别、时延和流程状态；只有缺少跨域共享、跨账户关联或长周期留存时，这些残余痕迹才难以重构为前置画像。资料陈旧、响应等价化和认证前披露限制会降低攻击者所得信息质量。
    en: The stealth effect does not make identity material or requests disappear. External data retain publication time, provenance, and access audit, while victim identity services may record origins, clients, response classes, latency, and flow state; the residual traces are difficult to reconstruct into preceding profiling only when cross-domain sharing, cross-account correlation, or long-term retention is absent. Stale material, response equalization, and pre-authentication disclosure limits reduce information quality for the adversary.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击前收集具体人员、账户、联系方式、恢复属性、凭据材料、MFA 配置和账户有效状态，以及从受害域外资料形成可操作身份画像或从身份工作流响应差异推断属性的行为。所得信息必须服务于恶意目标筛选、冒充、社会工程或后续账户行动。
    en: This technique includes pre-compromise collection of concrete people, account, contact, recovery, credential-material, MFA-configuration, and account-validity attributes, including creation of actionable identity profiles from off-victim material or inference from identity-workflow response differences. The information must support malicious target selection, impersonation, social engineering, or follow-on account activity.
  - zh: 抽象岗位、部门和职责关系属于组织信息；直接通过邮件、通话或消息诱导人员披露信息属于 T1598。密码猜测、凭证填充、成功重置、认证完成或账户接管超出本技术的侦查信息获取范围，取得内部访问后的账户发现也不属于本技术。合法招聘、客户支持、批量开户和普通用户失败不能仅凭相似身份字段或事务被认定为本技术。
    en: Abstract roles, departments, and responsibility relationships are organizational information, while direct elicitation through email, voice, or messaging belongs to T1598. Password guessing, credential stuffing, successful reset, completed authentication, or account takeover exceeds the reconnaissance information-acquisition scope, and account discovery after internal access is also outside this technique. Legitimate recruiting, customer support, bulk onboarding, and ordinary user failures must not be classified here merely because they involve similar identity fields or transactions.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术常用于攻击者在社会工程、帮助台冒充、密码恢复滥用或定向账户行动前确定高价值员工及其账户属性。它适用于公开目录与代码库、商业身份情报、历史泄露和地下市场，以及互联网暴露的登录、注册、SSO、恢复和 MFA 服务。
      en: This technique commonly supports identification of high-value employees and their account attributes before social engineering, help-desk impersonation, password-recovery abuse, or targeted account action. It applies to public directories and repositories, commercial identity intelligence, historical breaches and illicit markets, and Internet-facing login, registration, SSO, recovery, and MFA services.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问足以关联目标的公开、商业、泄露或地下身份材料，或能够向目标身份功能发送语义有效请求并观察响应。其能力包括实体解析、跨来源富化、自动化身份事务和差异比较；约束包括资料时效、账户和来源归因、速率控制、响应等价化，以及不得在本技术内越过信息推断进入成功认证或账户控制。
        en: The adversary needs access to public, commercial, breached, or illicit identity material sufficient to resolve the victim, or the ability to send semantically valid requests to victim identity functions and observe responses. Capabilities include entity resolution, cross-source enrichment, automated identity transactions, and differential comparison; constraints include data freshness, account and origin attribution, rate controls, response equalization, and the boundary against progressing from inference to successful authentication or account control within this technique.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有身份服务审计、风险与账户上下文、帮助台和恢复记录、外部泄露情报及公开信息治理数据，但通常无法观察攻击者离线筛选和第三方平台查询。单个公开资料访问或失败身份事务均缺乏判定力，检测需要把外部暴露与后续精确使用关联，或跨账户、功能、来源和时间重构差异比较行为。
        en: Defenders may have identity-service audit, risk and account context, help-desk and recovery records, external breach intelligence, and public-information governance data, but generally cannot observe adversary offline selection or third-party platform queries. An individual public-data access or failed identity transaction is inconclusive; detection must correlate external exposure with precise downstream use or reconstruct differential comparison across accounts, functions, origins, and time.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 在受害组织控制域外检索和富化身份材料，使主要采集不进入目标身份遥测且只在后续使用时显现
    en: Retrieve and enrich identity material outside victim control so primary collection never enters target identity telemetry and appears only during downstream use
  analysis:
    paragraphs:
    - zh: 攻击者在公开平台、商业情报、历史泄露或离线材料中解析并组合人员与账户属性，只把完成的画像用于后续行动。行为设计把目标身份系统中的查询替换为外部访问和离线分析记录；受害方在主要采集阶段没有对应事件，通常只能看到资料曾暴露或稍后的定向冒充和恢复活动。防守需要跨组织共享和时间线关联才能反推采集过程，因此直接可观察性和采集归因能力降低。
      en: The adversary resolves and combines people and account attributes across public platforms, commercial intelligence, historical breaches, or offline material, using only the completed profile downstream. The design replaces queries in victim identity systems with external access and offline-analysis records; the victim has no corresponding primary-collection event and usually sees only prior exposure or later targeted impersonation and recovery activity. Defense must use cross-organizational sharing and timeline correlation to infer backward, reducing direct observability and attribution of collection.
  evidence_refs: [REF-000031, REF-000032]
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 以语义正常的失败或未完成身份事务承载属性比较，使恶意推断难以从单条业务日志中区分
    en: Carry attribute comparison in semantically normal failed or incomplete identity transactions so malicious inference is difficult to distinguish in one business log
  analysis:
    paragraphs:
    - zh: 攻击者向登录、注册、恢复、联合身份或 MFA 流程发送格式和业务语义有效的请求，再比较内容、状态、跳转、验证方式和时延。明显枚举由此变为常见的失败或未完成事务，单条记录与用户错误、兼容性问题或支持活动高度重叠；防守方只有跨身份、功能、来源和窗口聚类，才能恢复差异比较意图。结果是主动身份推断在局部事件上的可区分性降低。
      en: The adversary sends syntactically and semantically valid requests to login, registration, recovery, federation, or MFA flows and compares content, status, redirects, verification methods, and latency. Obvious enumeration becomes common failed or incomplete transactions whose individual records overlap heavily with user error, compatibility problems, or support activity; defenders must cluster across identities, functions, origins, and windows to recover differential-comparison intent. Active identity inference is therefore less distinguishable at the local-event level.
  evidence_refs: [REF-000033, REF-000034, REF-000035]
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立两项匿迹子技术：受害域外身份获取和身份工作流拟态推断。前者以主要采集痕迹位于外部平台、泄露材料或离线分析环境为稳定变量，使目标身份系统没有查询；后者以请求进入目标身份系统但保持正常业务语义为稳定变量，使防守方只能通过响应差异和跨事件关联恢复推断意图。
      en: 'This technique defines two evasion sub-techniques: Off-Victim Identity Acquisition and Identity-Workflow Mimicry and Inference. The former uses primary traces in external platforms, breached material, or offline analysis as its stable variable, leaving no query in victim identity systems. The latter sends requests into victim identity systems while preserving normal business semantics, requiring response-difference and cross-event correlation to recover inference intent.'
    - zh: 分类不沿用 ATT&CK 的凭据、邮箱或员工姓名类别，也不按平台、数据来源或具体身份字段拆分。低速、多来源、匿名账户和代理只是可能组合的执行条件；现有证据不足以证明它们在本父技术中形成独立且可防守的身份信息匿迹边界。
      en: The taxonomy does not inherit ATT&CK categories for credentials, email addresses, or employee names and is not partitioned by platform, source, or particular identity field. Low rate, multiple origins, anonymous accounts, and proxies are combinable execution conditions; current evidence does not establish them as independent, defensible identity-information evasion boundaries under this parent.
  coverage: established
  subtechnique_refs: [NJS-0033-001, NJS-0033-002]
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000031, DET-000033]
  mitigations:
    coverage: available
    mitigation_refs: [MIT-000032, MIT-000033]
evidence:
  claim_refs: [CLM-000124, CLM-000125, CLM-000126, CLM-000129]
  case_refs: [CASE-000029, CASE-000030, CASE-000031]
  reference_refs: [REF-000021, REF-000024, REF-000031, REF-000032, REF-000033, REF-000034, REF-000035]
research:
  limitations:
    paragraphs:
    - zh: 防守方通常无法确定攻击者何时从外部平台或离线材料完成身份富化，公开案例更多证明资料的后续使用而非完整采集日志。身份工作流案例和技术规范能够证明响应差异被利用，但合法用户错误、批量开户和迁移也会产生相似高扇出与未完成流程，必须避免由单事件推断恶意。
      en: Defenders generally cannot establish when an adversary completed identity enrichment through external platforms or offline material, and public cases more often demonstrate downstream use than complete collection audit. Identity-workflow incidents and technical guidance establish exploitation of response differences, but legitimate user error, bulk onboarding, and migration can produce similar fan-out and incomplete flows, so malicious intent must not be inferred from one event.
    - zh: 本技术暂不把匿名查询、跨平台分片或低速身份枚举建立为独立子技术，因为现有证据没有同时证明稳定变量、匿迹意图和不同防守效果。未来材料还需严格区分身份信息收集、直接信息诱导、凭据攻击和成功账户访问四个阶段。
      en: Anonymous querying, cross-platform fragmentation, and low-rate identity enumeration are not currently separate children because available evidence does not jointly establish a stable variable, stealth intent, and distinct defensive effect. Future evidence must also distinguish identity-information collection, direct elicitation, credential attack, and successful account access as separate stages.
