schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0034-001
parent_ref: NJT-0034
name:
  zh: 第三方网络观测复用
  en: Third-Party Network-Observation Reuse
summary:
  zh: 使用互联网测绘、被动 DNS 或其他外部传感服务已采集的网络观测，替代攻击者重新生成目标交互。
  en: Use network observations already collected by Internet-mapping, passive-DNS, or other external sensor services instead of generating new victim interaction.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 第三方网络观测复用是攻击者查询互联网测绘、被动 DNS、暴露面搜索或历史网络数据服务，使用平台已经采集的域解析、地址、服务关系和其他网络事实，在自身环境建立目标网络模型而不重新测量目标。
    en: Third-Party Network-Observation Reuse occurs when an adversary queries Internet-mapping, passive-DNS, exposure-search, or historical network-data services and uses domain-resolution, addressing, service-relationship, and other network facts already collected by the platform to build a victim network model without remeasuring the target.
  - zh: 稳定分类变量是网络事实由外部传感器或测量平台预先观测产生。若数据由注册、证书透明度或路由基础设施按正常职能直接发布，则属于 NJS-0034-002；若攻击者控制扫描来源并重新探测目标，则属于 NJT-0001。
    en: The stable classification variable is prior production of network facts by an external sensor or measurement platform. Data published directly through normal registration, certificate-transparency, or routing functions belongs to NJS-0034-002, while victim remeasurement from adversary-controlled scanning origins belongs to NJT-0001.
stealth_characteristics:
  paragraphs:
  - zh: 第三方网络观测复用把攻击者当前测量替换为提供方过去的扫描、解析或被动传感记录，攻击者查询只留在平台侧。目标可能见过提供方原始测量，但无法从本地日志确定后续消费者、查询时间和范围，因此直接发现与归因能力下降。
    en: Third-Party Network-Observation Reuse replaces current adversary measurement with past provider scan, resolution, or passive-sensor records, leaving the adversary query only at the platform. The victim may have seen the original provider measurement but cannot determine the later consumer, query time, or scope from local logs, reducing direct detection and attribution.
  - zh: 残余痕迹包括提供方账户、API 查询与导出审计，以及后续接触与平台数据的精确对应。平台覆盖不足或数据陈旧会迫使攻击者重新验证目标；提供方共享和外部资产清单则可以恢复部分可见性。
    en: Residual traces include provider account, API query, and export audit and precise correspondence between downstream contact and platform data. Incomplete coverage or stale data may force victim revalidation, while provider sharing and external-asset inventories can restore partial visibility.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入第三方传感或测量已经生成目标相关网络事实、攻击者不在本范围内重新验证目标，并把结果用于网络画像或后续目标选择的行为。数据可以来自主动互联网测绘或被动 DNS，但来源类型本身不改变分类。
    en: This sub-technique includes behavior where third-party sensing or measurement has already produced victim-related network facts, the adversary does not revalidate the victim within this scope, and results support network profiling or downstream targeting. Data may come from active Internet mapping or passive DNS, but source type does not change the classification.
  - zh: 公共控制面例行发布的数据属于 NJS-0034-002，攻击者自行运营的代理或僵尸网络扫描仍是主动扫描，单主机软件与设备属性属于 NJT-0032。合法外部攻击面管理和安全研究必须依据授权与用途排除。
    en: Routinely published public control-plane data belongs to NJS-0034-002, adversary-operated proxy or botnet scanning remains Active Scanning, and single-host software and device attributes belong to NJT-0032. Legitimate external attack-surface management and security research require exclusion through authorization and purpose.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在主动接触前使用测绘与被动 DNS 平台识别目标域、地址、暴露服务、历史解析和网络关系，从而缩小后续探测范围或选择更精确入口。
      en: This sub-technique applies when an adversary uses mapping and passive-DNS platforms before active contact to identify victim domains, addresses, exposed services, historical resolutions, and network relationships, narrowing later probing or selecting more precise entry points.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要平台查询或导出权限以及跨对象实体解析能力，并接受账户审计、配额、数据覆盖和时效限制。为了维持替代效果，攻击者不能在本子技术内直接验证不确定结果。
        en: The adversary needs platform query or export access and cross-object entity-resolution capability and must accept account audit, quota, coverage, and freshness limits. To preserve substitution, the adversary cannot directly validate uncertain results within this child.
    defender_model:
      paragraphs:
      - zh: 防守方通常拥有自身外部暴露和后续边界事件，却缺少平台查询账户与条件。提供方日志可直接支持检测，否则只能依据平台数据版本、后续接触精度和时间顺序作条件推断。
        en: Defenders usually possess their external exposure state and downstream perimeter events but lack provider querying accounts and terms. Provider logs can support direct detection; otherwise only conditional inference is possible from platform-data version, precision of downstream contact, and event sequence.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以平台既有传感记录替代攻击者当前测量，使目标没有可归因于实际查询者的新采集事件
    en: Substitute existing platform sensor records for current adversary measurement so the victim has no new collection event attributable to the actual consumer
  analysis:
    paragraphs:
    - zh: 攻击者查询外部平台已保存的网络观测并直接用于建模。攻击者发起的目标测量被提供方历史传感与当前平台查询替代，目标侧没有对应新流量，也无法从旧测量识别后续消费者；防守方必须获得平台审计或关联后续精确接触。采集因此在受害方当前观察面上趋于透明。
      en: The adversary queries network observations stored by an external platform and uses them directly for modeling. Provider historical sensing and a current platform query replace adversary-originated victim measurement, leaving no corresponding new victim traffic and no way to identify the later consumer from the old measurement; defenders need platform audit or correlation with precise downstream contact. Collection is therefore close to transparent at the victim's current vantage point.
  evidence_refs: [REF-000025, REF-000026, REF-000037]
  confidence: medium
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000034]
  mitigations:
