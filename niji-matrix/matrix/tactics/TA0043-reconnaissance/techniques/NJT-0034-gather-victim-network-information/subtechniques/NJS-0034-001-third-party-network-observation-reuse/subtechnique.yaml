evidence:
  claim_refs: [CLM-000131, CLM-000132]
  case_refs: [CASE-000032]
  reference_refs: [REF-000025, REF-000026, REF-000037]
research:
  limitations:
    paragraphs:
    - zh: 事件报告证明恶意主体使用外部测绘，规范资料证明被动 DNS 能保存历史观测，但平台查询审计通常不可公开获得。因果替代得到支持，单次查询的恶意意图和具体消费者归因仍保持中等置信度。
      en: Incident reporting establishes malicious use of external mapping and normative material establishes stored passive-DNS observations, but platform query audit is rarely public. Causal substitution is supported, while malicious intent and consumer attribution for an individual query remain medium confidence.
