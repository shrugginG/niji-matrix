schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0034-002
parent_ref: NJT-0034
name:
  zh: 公共控制面旁路查询
  en: Public Control-Plane Off-Target Querying
summary:
  zh: 仅查询注册、证书透明度、路由收集等非受害方公共基础设施，从例行发布元数据推断目标网络。
  en: Query only non-victim registration, certificate-transparency, routing-collection, or similar public infrastructure and infer the victim network from routinely published metadata.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 公共控制面旁路查询是攻击者从 RDAP、证书透明度、BGP 路由收集和类似公共基础设施获取域、地址、前缀、自治系统、证书名称、名称服务器和关系，并在不访问目标业务端点或目标控制权威服务的情况下推断网络模型。
    en: Public Control-Plane Off-Target Querying occurs when an adversary obtains domains, addresses, prefixes, autonomous systems, certificate names, nameservers, and relationships from RDAP, certificate transparency, BGP route collection, and similar public infrastructure and infers a network model without accessing victim business endpoints or victim-controlled authoritative services.
  - zh: 稳定分类变量是网络事实由公共基础设施按正常行政、透明度或控制面职能例行发布，而不是传感器观测目标流量。具体协议和字段不是子技术边界；查询若到达目标权威 DNS、应用或其他目标控制服务，则需要按直接交互重新分类。
    en: The stable classification variable is routine publication of network facts through normal administrative, transparency, or control-plane functions rather than sensor observation of victim traffic. Particular protocols and fields do not define the child; queries reaching victim authoritative DNS, applications, or other victim-controlled services require reclassification as direct interaction.
stealth_characteristics:
  paragraphs:
  - zh: 公共控制面旁路查询使攻击者访问终止于非受害方注册、透明度或路由服务，目标业务与应用日志没有对应事件。查询外观与网络运营、证书监测、研究和资产管理高度相似，受害方通常只能看到自身公开对象而无法确定谁在组合它们。
    en: Public Control-Plane Off-Target Querying terminates adversary access at non-victim registration, transparency, or routing services, leaving no corresponding event in victim business and application logs. Query appearance closely resembles network operations, certificate monitoring, research, and asset management, and the victim usually sees only its own public objects rather than who combines them.
  - zh: 残余痕迹包括公共服务访问日志、批量查询模式、对象版本与下载记录，以及后续目标选择对公开属性的精确使用。访问服务不记录账户、数据可批量离线获取或后续活动长期延迟时，可见性进一步下降。
    en: Residual traces include public-service access logs, bulk-query patterns, object versions and downloads, and precise downstream use of public attributes for targeting. Visibility declines further when services do not record accounts, data is available in bulk for offline use, or downstream activity is substantially delayed.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入对非受害方公共注册、证书透明度、路由归档和其他控制面服务的查询，并要求结果用于具体目标的网络画像。查询必须只消费基础设施已例行发布的对象，不向目标端点或权威服务诱发新的网络事实。
    en: This sub-technique includes queries to non-victim public registration, certificate-transparency, route-archive, and other control-plane services when results support a concrete victim network profile. Queries must consume only objects already routinely published by the infrastructure and must not elicit new network facts from victim endpoints or authoritative services.
  - zh: 第三方扫描或被动传感产生的数据属于 NJS-0034-001；查询目标权威服务、猜测名称或路径并比较响应属于直接探测。普通网络运营和研究具有相同访问表面，必须依据目标集中度、后续用途和授权区分。
    en: Data produced by third-party scanning or passive sensing belongs to NJS-0034-001, while querying victim authoritative services or guessing names or paths and comparing responses is direct probing. Normal network operations and research share the same access surface and require distinction through target concentration, downstream purpose, and authorization.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在接触目标前通过证书日志发现隐藏域名和服务线索、通过 RDAP 解析地址与自治系统归属、通过路由归档理解前缀与提供商关系，再据此选择后续探测或入口。
      en: This sub-technique applies when an adversary discovers hidden domain and service clues through certificate logs, resolves address and autonomous-system ownership through RDAP, and understands prefixes and provider relationships through route archives before selecting later probes or entry points.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问公共查询接口或批量数据，并能够跨域、证书、地址、前缀和组织实体进行解析。其约束包括速率限制、服务审计、数据滞后、隐私遮蔽和将公开注册对象正确归属到目标的难度。
        en: The adversary needs access to public query interfaces or bulk data and the ability to resolve domains, certificates, addresses, prefixes, and organizational entities across sources. Constraints include rate limits, service audit, data lag, privacy redaction, and difficulty attributing public registration objects correctly to the victim.
    defender_model:
      paragraphs:
      - zh: 防守方可以监测自身注册、证书和路由对象及其变化，但通常缺少公共服务上的消费者日志。具备服务方共享时可识别集中查询，否则只能把公开暴露与后续精确使用关联，且必须排除证书监测与正常网络运营。
        en: Defenders can monitor their registration, certificate, and routing objects and changes but usually lack consumer logs at public services. Provider sharing can identify concentrated queries; otherwise defenders can only correlate public exposure with precise downstream use and must exclude certificate monitoring and normal network operations.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 查询终止于非受害方公共控制面，使目标业务端点没有对应采集事件且无法识别实际消费者
    en: Terminate queries at non-victim public control planes so victim business endpoints have no corresponding collection event and cannot identify the actual consumer
  analysis:
    paragraphs:
    - zh: 攻击者查询公共基础设施已经发布的网络对象并在本地组合关系。目标请求被非受害方注册、透明度或路由查询替代，受害方业务遥测没有对应事件，公共对象也不会显示具体消费者；防守方必须依赖服务审计和后续属性使用。采集由此绕过目标观察面并降低直接归因能力。
      en: The adversary queries network objects already published by public infrastructure and composes relationships locally. Non-victim registration, transparency, or routing queries replace victim requests, leaving no corresponding event in victim business telemetry and no consumer identity in the public object; defenders need service audit and downstream attribute use. Collection therefore bypasses the victim vantage point and reduces direct attribution.
  evidence_refs: [REF-000036, REF-000038, REF-000039]
  confidence: high
