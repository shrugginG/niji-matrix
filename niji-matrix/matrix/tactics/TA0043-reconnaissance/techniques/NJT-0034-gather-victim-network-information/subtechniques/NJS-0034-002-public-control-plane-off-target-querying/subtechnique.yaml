research:
  limitations:
    paragraphs:
    - zh: RFC 与 RIPE 文档证明公开对象和查询能力，但不证明特定攻击者或匿迹意图；本分类的高置信度针对痕迹旁路因果，而不是单次访问归因。批量镜像和离线副本还可能使服务方也无法看到后续查询。
      en: RFC and RIPE documentation establish public objects and query capability but not a particular adversary or stealth intent; high confidence applies to the trace-bypass causal chain, not attribution of an individual access. Bulk mirrors and offline copies may also prevent service providers from seeing later queries.
