research:
  limitations:
    paragraphs:
    - zh: 标准和平台资料证明数据公开与可查询，事件报告证明攻击者使用外部测绘，但很少提供完整查询账户或明确匿迹动机。受害方只能从公开暴露和后续接触进行条件推断，不能把所有被动 DNS、注册、证书或路由查询视为恶意。
      en: Standards and platform documentation establish data publication and queryability, while incident reporting establishes adversary use of external mapping, but complete querying accounts or explicit stealth motives are rarely available. Victims can make only conditional inference from public exposure and downstream contact and must not treat all passive-DNS, registration, certificate, or routing queries as malicious.
    - zh: 历史快照时序解耦、批量离线下载和多提供方分散查询可能进一步改变痕迹，但现有材料不足以证明这些变量被 T1590 攻击者有意用于匿迹或产生独立防守效果，因此保持延期。
      en: Historical-snapshot decoupling, bulk offline acquisition, and multi-provider distribution may further change traces, but available material does not establish deliberate T1590 stealth use or a distinct defensive effect, so those hypotheses remain deferred.
