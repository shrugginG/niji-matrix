schema_version: 2.0.0
type: technique
id: NJT-0034
name:
  zh: 收集目标网络信息
  en: Gather Victim Network Information
summary:
  zh: 在获得内部访问前收集目标网络的命名、地址、路由、拓扑、信任与边界属性，并通过第三方观测或公共控制面查询降低目标侧可见性。
  en: Collect victim network naming, addressing, routing, topology, trust, and perimeter attributes before internal access while using third-party observations or public control-plane queries to reduce victim-side visibility.
aliases: []
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-retained
    source_attack_id: T1590
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1590
definition_and_concept:
  paragraphs:
  - zh: 收集目标网络信息是攻击者在获得目标内部访问前，取得或推断域名、地址、前缀、自治系统、路由、拓扑、技术信任依赖、网络提供商和安全边界等网络级属性的侦查技术。所得模型可以支持目标选择、入口定位、资源准备和后续行动规划。
    en: Gather Victim Network Information is reconnaissance in which an adversary obtains or infers network-level attributes such as domains, addresses, prefixes, autonomous systems, routes, topology, technical trust dependencies, network providers, and security perimeters before internal access. The resulting model supports target selection, entry-point identification, resource preparation, and follow-on planning.
  - zh: 本技术以网络级关系与边界信息为概念锚点，不按 DNS、证书、IP 或拓扑字段建立 Niji 子技术。第三方测量平台、被动 DNS、注册服务、证书透明度和路由收集器只是可能来源；子技术依据事实产生方式和查询是否经过受害者控制面划分。
    en: The conceptual anchor is network-level relationship and perimeter information, not DNS, certificate, IP, or topology fields as Niji children. Third-party measurement platforms, passive DNS, registration services, certificate transparency, and route collectors are possible sources; children are partitioned by how facts are produced and whether queries traverse victim-controlled infrastructure.
stealth_characteristics:
  paragraphs:
  - zh: 收集目标网络信息可以把攻击者直接面向目标的探测替换为数据提供方先前的传感观测，或替换为对非受害方公共控制面的查询。目标业务与应用日志因而没有攻击者当前的采集事件，或只留下无法指向实际消费者的历史第三方测量，完整网络模型只在提供方或攻击者侧形成。
    en: Gather Victim Network Information can replace adversary direct probing of a target with earlier sensor observations produced by a data provider or with queries to non-victim public control planes. Victim business and application logs therefore contain no current adversary collection event or only historical third-party measurements that do not identify the actual consumer, while the complete network model forms provider- or adversary-side.
  - zh: 残余痕迹包括提供方账户与 API 审计、公共注册和透明度访问、公开网络对象、目标外暴露清单以及随后的精确探测或入口选择。数据陈旧、公开对象缺失或实体映射错误可能迫使攻击者重新验证目标并产生 NJT-0001 痕迹；提供方共享与长期关联也会削弱匿迹效果。
    en: Residual traces include provider account and API audit, public registration and transparency access, public network objects, external exposure inventories, and later precise probing or entry selection. Stale data, missing public objects, or entity-resolution errors may force victim revalidation and create NJT-0001 traces; provider sharing and long-horizon correlation also weaken stealth.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击前获得网络命名、地址、路由、拓扑、技术信任、提供商和边界属性，并要求所得网络模型服务于恶意目标选择或后续行动。正式匿迹路径包括复用第三方传感或测量结果，以及仅查询非受害方注册、透明度和路由基础设施。
    en: This technique includes pre-compromise acquisition of network naming, addressing, routing, topology, technical trust, provider, and perimeter attributes when the resulting network model supports malicious targeting or follow-on action. Formal stealth paths include reuse of third-party sensor or measurement results and queries limited to non-victim registration, transparency, and routing infrastructure.
  - zh: 攻击者直接向目标基础设施发送连接、服务、协议或猜测式请求属于 NJT-0001；单主机软件和设备属性属于 NJT-0032，人员与账户属于 NJT-0033，抽象组织关系属于 NJT-0035。获得内部访问后的网络发现不在 Reconnaissance 范围，合法网络运营与安全研究也不能仅凭访问相同数据源被认定为本技术。
    en: Adversary-originated connection, service, protocol, or speculative requests to victim infrastructure belong to NJT-0001; single-host software and device attributes belong to NJT-0032, people and accounts to NJT-0033, and abstract organizational relationships to NJT-0035. Network discovery after internal access is outside Reconnaissance, and legitimate network operations or security research must not be classified here merely for accessing the same sources.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术常用于互联网目标筛选、云与边缘边界理解、合作与信任依赖识别，以及为主动扫描、基础设施准备或初始入口选择建立网络图。适用环境包括互联网测绘、被动 DNS、RDAP、证书透明度、BGP 路由归档和其他外部暴露数据服务。
      en: This technique commonly supports Internet target selection, understanding of cloud and edge perimeters, identification of partnership and trust dependencies, and construction of a network graph for Active Scanning, infrastructure preparation, or initial-entry selection. Applicable environments include Internet mapping, passive DNS, RDAP, certificate transparency, BGP route archives, and other external-exposure data services.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要能够访问保存网络观测的第三方平台或公开控制面，并具备将域、地址、前缀、证书和路由对象解析到同一组织的能力。其约束包括查询账户归因、配额、数据时效、覆盖缺口和公开信息与当前目标状态之间的不一致。
        en: The adversary needs access to third-party platforms holding network observations or public control planes and the ability to resolve domains, addresses, prefixes, certificates, and routing objects to the same organization. Constraints include query-account attribution, quotas, data freshness, coverage gaps, and inconsistency between public information and current victim state.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有外部攻击面清单、权威服务日志、证书与域名监测和后续边界事件，但通常看不到第三方或公共服务上的实际查询者。判断需要提供方审计、公开对象版本、实体映射和后续目标活动；单次 RDAP、透明度或被动 DNS 查询具有很高合法率。
        en: Defenders may have external attack-surface inventories, authoritative-service logs, certificate and domain monitoring, and downstream perimeter events but usually cannot see the actual consumer at third-party or public services. Assessment requires provider audit, public-object versions, entity mapping, and later targeting; an individual RDAP, transparency, or passive-DNS query has a high legitimate rate.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以第三方传感观测或非受害方公共控制面替代目标交互，使主要网络画像活动不进入受害方业务遥测
    en: Substitute third-party sensor observations or non-victim public control planes for target interaction so primary network profiling does not enter victim business telemetry
  analysis:
    paragraphs:
    - zh: 攻击者检索第三方已经保存的测量，或查询注册、证书透明度和路由收集基础设施例行发布的对象，再在自身环境组合网络图。行为设计把目标端点的直接探测替换为提供方侧查询和离线解析；受害方没有对应攻击者采集事件，也无法从本地日志识别查询范围和身份。防守必须跨组织获取审计或从后续使用反推，因而直接可观察性和归因能力下降。
      en: The adversary retrieves measurements already stored by third parties or queries objects routinely published by registration, certificate-transparency, and route-collection infrastructure, then assembles a network graph in its own environment. The design replaces direct victim-endpoint probing with provider-side queries and offline resolution; the victim has no corresponding adversary collection event and cannot identify query scope or identity from local logs. Defense requires cross-organizational audit or inference from downstream use, reducing direct observability and attribution.
  evidence_refs: [REF-000025, REF-000026, REF-000036, REF-000037, REF-000038, REF-000039]
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立第三方网络观测复用和公共控制面旁路查询两项匿迹子技术。前者的网络事实由扫描、被动 DNS 或其他外部传感器观测产生，后者的事实由注册、证书透明度和路由基础设施按其正常职能例行发布；两者在数据生成主体、残余日志和可实施检测上不同。
      en: This technique defines Third-Party Network-Observation Reuse and Public Control-Plane Off-Target Querying. In the former, network facts are produced by scanning, passive DNS, or other external sensors; in the latter, facts are routinely published by registration, certificate-transparency, and routing infrastructure as part of normal operation. The two differ in data-producing actor, residual logs, and implementable detection.
    - zh: 分类不继承 ATT&CK 的域属性、DNS、信任依赖、拓扑、IP 地址或安全设备类别，也不按协议、平台或数据字段拆分。一次网络画像可以组合两项子技术，但直接重新验证目标的部分仍单独属于 NJT-0001。
      en: The taxonomy does not inherit ATT&CK categories for domain properties, DNS, trust dependencies, topology, IP addresses, or security appliances and does not partition by protocol, platform, or data field. One network profile may combine both children, but any direct victim revalidation remains separately classified as NJT-0001.
  coverage: established
  subtechnique_refs: [NJS-0034-001, NJS-0034-002]
