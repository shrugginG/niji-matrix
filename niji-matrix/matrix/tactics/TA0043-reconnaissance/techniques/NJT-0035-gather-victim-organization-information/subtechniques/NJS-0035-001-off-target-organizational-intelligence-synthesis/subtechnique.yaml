schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0035-001
parent_ref: NJT-0035
name:
  zh: 目标外组织情报拼接
  en: Off-Target Organizational Intelligence Synthesis
summary:
  zh: 有意避免直接访问目标资产，从外部来源收集碎片并在攻击者侧综合组织结构、关系与运营模型。
  en: Deliberately avoid direct victim-asset access, collect fragments from external sources, and synthesize organizational structure, relationships, and operating models adversary-side.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 目标外组织情报拼接是攻击者有意避免直接访问目标资产，从监管、商业、搜索、归档、新闻或外部 AI 服务取得组织结构、职责、关系与运营碎片，并在自身环境解析为统一组织模型。
    en: Off-Target Organizational Intelligence Synthesis occurs when an adversary deliberately avoids direct victim assets, obtains fragments about organizational structure, responsibilities, relationships, and operations from regulatory, commercial, search, archival, news, or external AI services, and resolves them into a unified model in its own environment.
  - zh: 稳定分类变量是主要资料来源和综合过程均位于目标控制域外，而不是特定数据库或所获字段。第三方开放访问表面可以同时标记为 NJT-0037，但本子技术的直接对象始终是完成的组织模型。
    en: The stable classification variable is that both primary sources and synthesis remain outside victim control, not a particular database or collected field. The third-party open access surface may also be represented by NJT-0037, but the immediate object of this child remains the completed organizational model.
stealth_characteristics:
  paragraphs:
  - zh: 目标外组织情报拼接把目标站点的集中访问或直接人员询问转化为多个外部平台的普通查询和本地综合。目标没有采集日志，各提供方只观察局部主题，完整关系与行动意图不会在单一防守观察面出现。
    en: Off-Target Organizational Intelligence Synthesis transforms concentrated victim-site access or direct questioning of people into ordinary queries across external platforms and local composition. The victim has no collection logs, each provider observes only a partial topic, and the complete relationship and operational intent do not appear in one defensive vantage point.
  - zh: 残余痕迹包括平台账户与下载记录、公开对象版本、跨来源实体解析和后续话术对稀有组织细节的重现。资料冲突、时效不足或外部服务处置账户会降低模型可靠性与匿迹效果。
    en: Residual traces include platform account and download records, public-object versions, cross-source entity resolution, and recurrence of rare organizational detail in downstream pretexts. Conflicting material, insufficient freshness, or provider account enforcement reduces model reliability and stealth.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入从目标外来源收集并综合抽象组织结构、职责、关系和运营规律，且直接目标为形成可操作组织模型的行为。主要查询不得进入目标组织控制的网站、身份系统或通信渠道。
    en: This sub-technique includes collection and synthesis of abstract organizational structure, responsibilities, relationships, and operating patterns from off-target sources when the immediate objective is an actionable organizational model. Primary queries must not enter victim-controlled websites, identity systems, or communication channels.
  - zh: 具体身份记录属于 NJT-0033，网络技术关系属于 NJT-0034，直接诱导人员属于 NJT-0036，直接浏览受害者自有站点属于 NJT-0038。合法投资、招聘、合规和供应商研究必须依据目的与授权排除。
    en: Concrete identity records belong to NJT-0033, technical network relationships to NJT-0034, direct elicitation to NJT-0036, and direct browsing of victim-owned sites to NJT-0038. Legitimate investment, recruiting, compliance, and supplier research require exclusion through purpose and authorization.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在供应商冒充、社会工程、关系利用或行动排期前，将公司申报、招聘、采购、新闻、搜索结果和外部 AI 回答综合成部门、角色、伙伴与业务节奏图。
      en: This sub-technique applies when an adversary combines company filings, recruiting, procurement, news, search results, and external AI answers into a map of departments, roles, partners, and business tempo before supplier impersonation, social engineering, relationship abuse, or operation scheduling.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问多个目标外来源，并能够解决同名实体、时间冲突和关系方向。长期收集、商业订阅和外部 AI 可以降低人工成本，但平台审计、错误输出和资料陈旧仍限制结果。
        en: The adversary needs access to multiple off-target sources and must resolve namesake entities, temporal conflicts, and relationship direction. Long-term collection, commercial subscriptions, and external AI can reduce manual effort, but provider audit, erroneous output, and stale material still constrain results.
    defender_model:
      paragraphs:
      - zh: 防守方能够治理自身公开内容并监测后续话术，但通常看不到外部查询和本地综合。提供方共享和属性稀有度能够增强判断，缺少这些条件时只能把外部暴露与后续使用作条件关联。
        en: Defenders can govern their public content and observe downstream pretexts but usually cannot see external queries and local synthesis. Provider sharing and attribute rarity strengthen assessment; without them, only conditional correlation between external exposure and downstream use is possible.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 让组织资料查询终止于目标外服务并在攻击者侧综合，使完整画像不进入受害方日志
    en: Terminate organizational queries at off-target services and synthesize adversary-side so the complete profile never enters victim logs
  analysis:
    paragraphs:
    - zh: 攻击者分别查询外部资料并在本地合成组织模型，替代直接访问目标资产或询问人员。目标侧没有对应查询，各提供方仅保存局部访问，防守方必须跨平台并结合后续行为重构完整目的；完整画像因此不出现在受害方观察面，直接检测能力下降。
      en: The adversary queries external material separately and synthesizes an organizational model locally, replacing direct victim-asset access or questioning of people. The victim has no corresponding query and each provider stores only partial access, forcing defenders to reconstruct the complete purpose across platforms and downstream behavior; the complete profile therefore does not appear at the victim vantage point, reducing direct detection.
  evidence_refs: [REF-000040, REF-000041]
  confidence: high
