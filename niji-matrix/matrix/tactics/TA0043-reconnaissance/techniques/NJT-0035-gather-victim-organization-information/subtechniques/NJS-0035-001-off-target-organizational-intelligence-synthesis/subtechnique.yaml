research:
  limitations:
    paragraphs:
    - zh: 外部服务使用广泛且多为合法，目标组织通常不能取得实际查询日志。OpenAI 报告证明威胁主体开展外部组织研究，但未公开完整输入、输出和行动链，因此子技术对域外痕迹变化为高置信度，对单次查询归因为条件性。
      en: External services are widely and legitimately used, and victim organizations usually cannot obtain actual query logs. OpenAI reporting establishes threat-actor external organizational research but does not disclose complete input, output, and operation chains, so confidence is high for the off-target trace change and conditional for attribution of an individual query.
