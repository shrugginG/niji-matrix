research:
  limitations:
    paragraphs:
    - zh: 公开和监管资料具有高合法使用率，外部 AI 与商业平台通常不会向目标组织提供查询日志。现有证据证明威胁主体会在目标外研究组织，但具体来源组合、完整模型和匿迹意图常不可见，因此检测多为条件推断。
      en: Public and regulatory material has high legitimate use, and external AI or commercial platforms usually do not provide query logs to the victim. Available evidence establishes off-target organizational research by threat actors, but source combinations, complete models, and stealth intent are often invisible, so detection is commonly conditional inference.
    - zh: 跨平台分片画像可能增加关联成本，但当前证据不足以把查询分散本身与目标外综合区分为稳定子技术。未来材料需要显示攻击者有意控制平台分布并产生不同防守效果。
      en: Cross-platform fragmented profiling may increase correlation cost, but current evidence does not distinguish query distribution itself from off-target synthesis as a stable child. Future material must show deliberate control of platform distribution and a distinct defensive effect.
