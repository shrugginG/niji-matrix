schema_version: 2.0.0
type: technique
id: NJT-0035
name:
  zh: 收集目标组织信息
  en: Gather Victim Organization Information
summary:
  zh: 在攻击前以非直接诱导方式收集并综合组织结构、职责、业务关系和运营规律，并通过目标外画像降低受害方可见性。
  en: Non-interactively collect and synthesize organizational structure, responsibilities, business relationships, and operating patterns before compromise while using off-target profiling to reduce victim visibility.
aliases: [Gather Victim Org Information]
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-adapted
    source_attack_id: T1591
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1591
definition_and_concept:
  paragraphs:
  - zh: 收集目标组织信息是攻击者在入侵前，以非直接诱导方式取得和综合目标组织结构、部门职能、岗位职责、业务关系、合作伙伴、供应链、运营规律与业务节奏的侦查技术。所得模型可以支持目标优先级、话术塑造、行动时机和后续关系利用。
    en: Gather Victim Organization Information is pre-compromise reconnaissance in which an adversary non-interactively obtains and synthesizes a victim's organizational structure, departmental functions, role responsibilities, business relationships, partners, supply chain, operating patterns, and business tempo. The resulting model supports target prioritization, pretext shaping, operation timing, and later relationship abuse.
  - zh: 本技术对 ATT&CK 父语义进行收窄：只保留组织级信息对象和具有明确匿迹因果的非诱导式画像。数据来源、网站类型或具体字段不是子技术边界；稳定实现是有意避免目标资产，在目标外服务查询碎片并在攻击者侧形成完整模型。
    en: This technique narrows the ATT&CK parent semantics to the organizational information object and non-elicitation profiling with an explicit stealth causal chain. Data source, site type, and particular field do not define children; the stable implementation deliberately avoids victim assets, queries fragments at off-target services, and forms the complete model adversary-side.
stealth_characteristics:
  paragraphs:
  - zh: 收集目标组织信息可以把集中访问受害者网站或直接询问人员的行为，替换为对监管、商业、搜索、归档、新闻或外部 AI 服务的普通查询。各平台只看到局部资料访问，目标组织没有对应采集日志，完整组织关系图与行动意图仅在攻击者环境中出现。
    en: Gather Victim Organization Information can replace concentrated visits to victim websites or direct questioning of people with ordinary queries to regulatory, commercial, search, archival, news, or external AI services. Each platform sees only partial data access, the victim has no corresponding collection log, and the complete organizational relationship graph and operational intent appear only in the adversary environment.
  - zh: 残余痕迹包括提供方查询与下载、公开资料版本、跨来源实体解析以及后续话术对稀有关系和运营细节的复用。提供方共享、外部内容盘点和后续活动关联可以恢复部分证据；法规披露和正常商业研究的高合法率限制了单次查询判定。
    en: Residual traces include provider queries and downloads, public-material versions, cross-source entity resolution, and reuse of rare relationships or operating details in downstream pretexts. Provider sharing, external-content inventories, and downstream correlation can restore partial evidence, while required disclosures and high legitimate volumes of business research limit per-query assessment.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入攻击前获得抽象组织结构、部门、职责、关系、合作伙伴、供应链和运营规律，并要求输出服务于恶意目标选择或行动塑造。正式子技术只覆盖有意避免目标资产、从多个目标外来源综合组织模型的实现。
    en: This technique includes pre-compromise acquisition of abstract organizational structure, departments, responsibilities, relationships, partners, supply chain, and operating patterns when the output supports malicious targeting or operational shaping. Its formal child covers only deliberate avoidance of victim assets and synthesis of an organizational model from multiple off-target sources.
  - zh: 具体人员、邮箱、账户和恢复属性属于 NJT-0033，网络命名、路由和技术信任属于 NJT-0034；直接与人员通信并诱导披露属于 NJT-0036。直接读取受害者自有网站由 NJT-0038 表达，第三方开放内容访问表面由 NJT-0037 表达，而本技术仍以所得组织信息对象为主。
    en: Concrete people, email, account, and recovery attributes belong to NJT-0033, while network naming, routing, and technical trust belong to NJT-0034; direct communication eliciting disclosure belongs to NJT-0036. Direct reading of victim-owned websites is represented by NJT-0038 and the third-party open-content access surface by NJT-0037, while this technique remains anchored in the resulting organizational information object.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术常用于攻击者在社会工程、供应商冒充、关系利用、行动排期和高价值角色选择前，从公司申报、新闻、招聘、采购、搜索、归档和外部 AI 服务综合目标组织结构与业务节奏。
      en: This technique commonly applies when an adversary synthesizes victim organizational structure and business tempo from company filings, news, recruiting, procurement, search, archives, and external AI services before social engineering, supplier impersonation, relationship abuse, operation scheduling, or high-value role selection.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问多个外部资料源，并具备实体解析、时间线整理、关系图构建和冲突信息校验能力。其约束包括资料陈旧、法定披露范围、同名实体、平台审计以及不得通过直接诱导或目标站点专用探测补全模型。
        en: The adversary needs access to multiple external sources and capability for entity resolution, timeline construction, relationship-graph building, and conflicting-data validation. Constraints include stale material, limits of mandatory disclosure, namesake entities, platform audit, and the boundary against completing the model through direct elicitation or dedicated victim-site probing.
    defender_model:
      paragraphs:
      - zh: 防守方可能管理公开内容、监管披露和第三方品牌或代码监测，并能观察后续通信和访问，但通常无法看到攻击者跨平台查询和本地综合。检测依赖提供方记录、公开对象版本、属性稀有度和后续精确使用，不能把正常投资、招聘、合规或供应商尽调视为恶意。
        en: Defenders may govern public content, regulatory disclosures, and third-party brand or code monitoring and observe downstream communication and access, but generally cannot see adversary cross-platform queries and local synthesis. Detection depends on provider records, public-object versions, attribute rarity, and precise downstream use and must not treat normal investment, recruiting, compliance, or supplier due diligence as malicious.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 在目标外服务查询碎片并于攻击者侧形成完整组织模型，使主要画像过程不进入受害方遥测
    en: Query fragments at off-target services and form the complete organizational model adversary-side so primary profiling does not enter victim telemetry
  analysis:
    paragraphs:
    - zh: 攻击者从监管、商业、搜索、归档或外部 AI 服务分别取得组织碎片，再在自身环境解析关系和运营规律。直接访问目标资产或询问人员被多个外部平台的普通查询替代，目标没有对应采集事件，每个平台也只看到局部意图；防守方需要跨提供方和后续活动重构完整模型。主要画像因此在目标观察面上趋于透明。
      en: The adversary obtains organizational fragments separately from regulatory, commercial, search, archival, or external AI services and resolves relationships and operating patterns in its own environment. Ordinary queries across multiple external platforms replace direct victim-asset access or questioning of people, leaving no corresponding victim collection event and only partial intent at each provider; defenders must reconstruct the complete model across providers and downstream activity. Primary profiling is therefore close to transparent at the victim vantage point.
  evidence_refs: [REF-000023, REF-000040, REF-000041]
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立一项目标外组织情报拼接子技术，其稳定变量是主要来源与综合过程均位于目标控制域外，完整模型只在攻击者环境形成。研究未发现第二项能够同时证明独立痕迹变化和不同防御要求的组织信息子技术。
      en: This technique defines one child, Off-Target Organizational Intelligence Synthesis, whose stable variable is that both primary sources and synthesis remain outside victim control and the complete model forms only in the adversary environment. Research did not identify a second organizational-information child with both an independent trace change and distinct defensive requirements.
    - zh: 分类不按部门、岗位、业务关系、行业、网站或数据库拆分。正常访客拟态属于 NJT-0038 的直接受害者网站访问变量，假名账户属于 NJT-0037 的第三方平台身份变量，均不在本父技术下复制。
      en: The taxonomy does not partition by department, role, business relationship, industry, website, or database. Benign-visitor mimicry is a direct victim-site access variable under NJT-0038, while pseudonymous accounts are a third-party platform identity variable under NJT-0037; neither is duplicated under this parent.
  coverage: established
  subtechnique_refs: [NJS-0035-001]
