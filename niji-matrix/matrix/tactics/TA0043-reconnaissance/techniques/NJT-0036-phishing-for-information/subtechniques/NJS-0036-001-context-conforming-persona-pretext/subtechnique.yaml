research:
  limitations:
    paragraphs:
    - zh: 合法请求同样会高度贴合岗位和业务情境，且事件资料通常展示成功样本而非完整基线。没有授权与关系上下文时，本子技术只能识别为可疑话术，不能可靠归因恶意。
      en: Legitimate requests also align closely with role and business context, and incident reporting usually shows successful examples rather than complete baselines. Without authorization and relationship context, this child can only identify suspicious pretext and cannot reliably attribute malicious intent.
