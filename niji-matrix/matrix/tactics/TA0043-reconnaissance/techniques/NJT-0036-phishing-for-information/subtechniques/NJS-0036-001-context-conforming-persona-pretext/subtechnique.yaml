schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0036-001
parent_ref: NJT-0036
name:
  zh: 情境一致的身份与话术伪装
  en: Context-Conforming Persona and Pretext Camouflage
summary:
  zh: 按目标角色、语言、关系、业务周期和合理信息需求塑造请求者身份与话术，使敏感请求接近正常沟通。
  en: Shape requester persona and pretext around victim role, language, relationships, business timing, and a plausible information need so sensitive requests resemble normal communication.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 情境一致的身份与话术伪装是攻击者利用目标组织、角色、语言、关系、术语和业务流程知识，塑造相互一致的请求者身份与信息需求理由，直接诱导人员披露信息。伪装对象是通信语义和社会身份，而不是承载页面或发送账户本身。
    en: Context-Conforming Persona and Pretext Camouflage occurs when an adversary uses knowledge of the victim organization, role, language, relationships, terminology, and business workflow to shape a mutually consistent requester persona and reason for needing information and directly induce disclosure. The disguised objects are communication semantics and social identity rather than the hosting page or sending account itself.
  - zh: 稳定分类变量是身份、请求理由和目标情境之间的一致性被有意用于降低异常。具体语言、行业、媒介或所索取字段不构成边界；直接目标必须是信息披露，非互动式组织画像属于 NJT-0035。
    en: The stable classification variable is deliberate use of consistency among persona, request justification, and victim context to reduce anomaly. Particular language, industry, medium, or requested field does not define the boundary; information disclosure must be the immediate objective, while non-interactive organizational profiling belongs to NJT-0035.
stealth_characteristics:
  paragraphs:
  - zh: 情境一致的身份与话术伪装把粗糙或异常索取转化为符合岗位、语气、关系和业务时机的请求，使人员和内容分析系统难以从局部语言特征区分恶意意图。残余差异通常存在于请求者真实授权、关系来源、信息敏感度和是否绕过正式流程，而不一定存在于语法或关键词。
    en: Context-Conforming Persona and Pretext Camouflage transforms a crude or anomalous solicitation into a request fitting role, tone, relationship, and business timing, making malicious intent difficult for people and content-analysis systems to distinguish from local language features. Residual differences usually lie in actual requester authorization, relationship provenance, information sensitivity, and bypass of formal workflow rather than grammar or keywords.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入请求者身份、语言、组织语气、关系和业务理由被有意塑造成相互一致，且请求直接要求人员披露信息的行为。身份可以是真实人物仿冒、虚构画像或角色声称，但判断依据是情境一致性而不是账户类型。
    en: This sub-technique includes deliberate shaping of requester identity, language, organizational tone, relationship, and business reason into a consistent whole when the request directly asks a person to disclose information. The persona may imitate a real person, use a fictitious profile, or claim a role, but classification depends on contextual consistency rather than account type.
  - zh: 只复制技术界面或托管域属于 NJS-0036-005，真实受信账户或线程承载请求属于 NJS-0036-003，请求敏感度随时间上升属于 NJS-0036-002。合法业务请求若具有真实授权和正常披露流程则排除。
    en: Copying only a technical interface or hosting domain belongs to NJS-0036-005, carrying a request in a genuine trusted account or thread belongs to NJS-0036-003, and sensitivity escalation over time belongs to NJS-0036-002. Legitimate business requests with genuine authorization and normal disclosure workflows are excluded.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者利用招聘、教育、供应商、财务、技术支持或内部行政背景，向具有敏感信息访问权的人员提出看似合理的验证、更新或紧急请求。
      en: This sub-technique applies when an adversary uses recruiting, education, supplier, finance, technical-support, or internal-administration context to make apparently reasonable verification, update, or urgent requests to people with access to sensitive information.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要足够的目标组织、角色、语言和业务知识，并能维持一个在局部上可信的身份。错误关系、过时细节、独立回拨和权限目录会暴露不一致。
        en: The adversary needs sufficient victim organization, role, language, and business knowledge and must maintain a locally plausible persona. Incorrect relationships, stale details, independent callback, and authorization directories can expose inconsistency.
    defender_model:
      paragraphs:
      - zh: 防守方可能看到完整消息和身份元数据，但基于关键词、拼写和域名的规则判定力有限。可靠判断需要请求者授权、业务关系、敏感数据类别、批准渠道和历史交互基线。
        en: Defenders may see complete messages and identity metadata, but rules based on keywords, spelling, or domains have limited discriminative value. Reliable assessment requires requester authorization, business relationship, sensitive-data category, approved channel, and historical interaction baselines.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 使身份、语言和请求理由符合目标业务情境，降低恶意索取与正常沟通之间的局部差异
    en: Align persona, language, and request justification with victim business context to reduce local differences between malicious solicitation and normal communication
  analysis:
    paragraphs:
    - zh: 攻击者把真实组织背景、术语和关系嵌入请求，使身份与理由相互支持。异常或泛化话术变为符合岗位和业务时机的通信，局部特征与正常请求重叠；防守方必须验证授权关系和披露流程，不能只依赖文本异常。信息诱导因此获得特征伪装效果。
      en: The adversary embeds real organizational context, terminology, and relationships into the request so persona and justification reinforce each other. Anomalous or generic wording becomes communication aligned with role and business timing, overlapping local features of normal requests; defenders must validate authorization relationships and disclosure workflow rather than rely only on text anomalies. The elicitation therefore gains feature-disguise effect.
  evidence_refs: [REF-000024, REF-000042, REF-000043]
  confidence: high
