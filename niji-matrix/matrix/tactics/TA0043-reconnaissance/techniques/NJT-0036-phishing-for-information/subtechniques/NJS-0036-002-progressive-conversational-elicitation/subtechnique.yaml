schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0036-002
parent_ref: NJT-0036
name:
  zh: 渐进式会话诱导
  en: Progressive Conversational Elicitation
summary:
  zh: 先建立可信交流，再通过多轮小步请求逐渐提高所索取信息敏感度，使完整目的不出现在单条消息中。
  en: Establish trusted interaction before increasing requested-information sensitivity through multiple small steps so the complete purpose does not appear in one message.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 渐进式会话诱导是攻击者先进行身份确认、关系建立或低敏感度交流，再在多轮消息中逐步提高请求范围和敏感度，最终诱导目标披露关键数据。完整信息收集目的需要跨消息和可能跨渠道重构。
    en: Progressive Conversational Elicitation occurs when an adversary first performs identity confirmation, relationship building, or low-sensitivity exchange and then progressively increases request scope and sensitivity across multiple messages until the victim discloses critical data. The complete information-collection purpose requires reconstruction across messages and possibly channels.
  - zh: 稳定分类变量是会话阶段与请求敏感度的时间结构，而不是消息数量或通信媒介。单条完整高风险请求不属于本子技术，合法长期访谈则因真实授权、预期流程和披露边界而排除。
    en: The stable classification variable is the temporal structure of conversation stage and requested sensitivity, not message count or medium. A complete high-risk request in one message is outside this child, while legitimate long-running interviews are excluded through genuine authorization, expected workflow, and disclosure boundaries.
stealth_characteristics:
  paragraphs:
  - zh: 渐进式会话诱导把集中的敏感信息索取分散为关系培养和逐步升级的局部请求，每条消息只呈现有限目的并可能低于内容规则阈值。残余痕迹存在于敏感度上升、同一话术跨渠道延续、关系未验证和最终绕过披露流程，短留存或无法统一身份会削弱重构。
    en: Progressive Conversational Elicitation disperses a concentrated sensitive-information solicitation into relationship cultivation and progressively escalating partial requests, with each message presenting limited purpose and potentially remaining below content-rule thresholds. Residual traces lie in sensitivity escalation, continuation of the same pretext across channels, unverified relationships, and eventual disclosure-workflow bypass; short retention or inability to unify identities weakens reconstruction.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入多轮交流中请求信息的敏感度或范围有意逐步上升，并且完整恶意目的不能由任何单条消息直接表达的行为。关系建立和低敏请求必须服务于后续直接披露。
    en: This sub-technique includes deliberate escalation of requested-information sensitivity or scope across multiple turns when no individual message directly expresses the complete malicious purpose. Relationship building and low-sensitivity requests must serve later direct disclosure.
  - zh: 仅改变身份和话术而没有时间结构变化属于 NJS-0036-001，仅使用受信账户属于 NJS-0036-003，单条高风险表单或消息属于父技术但不属于本子技术。合法招聘、审计和支持会话需要授权与流程基线排除。
    en: Changing only persona and pretext without temporal restructuring belongs to NJS-0036-001, using only a trusted account belongs to NJS-0036-003, and a single high-risk form or message belongs to the parent but not this child. Legitimate recruiting, audit, and support conversations require exclusion through authorization and workflow baselines.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于社交平台、即时消息、邮件线程和长期业务沟通中，攻击者需要先获得回应与信任，再从一般背景问题逐步转向联系人、流程、验证码、凭据或财务资料。
      en: This sub-technique applies on social platforms, instant messaging, email threads, and long-running business communication when an adversary first needs engagement and trust before moving from general background questions toward contacts, processes, verification codes, credentials, or financial data.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者必须能够在较长周期维持身份、话术和会话状态，理解目标回应并调整下一步请求，也要承担目标中断对话和平台关联多轮活动的风险。
        en: The adversary must maintain persona, pretext, and conversation state over a longer period, interpret victim responses, and adapt subsequent requests, while accepting the risk that the victim stops responding or the platform correlates multiple turns.
    defender_model:
      paragraphs:
      - zh: 防守方需要保留完整会话、请求数据类别、敏感度和渠道迁移，并将身份解析到同一关系。仅有单消息分类或短留存时，早期低风险内容不会暴露完整目的。
        en: Defenders need complete conversation retention, requested-data category, sensitivity, channel transitions, and identity resolution to one relationship. With only per-message classification or short retention, early low-risk content does not reveal the complete purpose.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  summary:
    zh: 把完整敏感索取分散到多轮和较长周期，使每条消息只留下局部弱信号
    en: Distribute the complete sensitive solicitation across multiple turns and a longer period so each message leaves only a partial weak signal
  analysis:
    paragraphs:
    - zh: 攻击者按关系建立、低敏请求和关键披露安排会话阶段。集中的恶意目的被拆到不同时间和消息，短窗口只看到局部正常交流，防守方必须长期保存并关联敏感度状态；无法跨渠道统一身份时完整序列进一步丢失。攻击由此降低局部信号强度并提高重构成本。
      en: The adversary stages the conversation through relationship building, low-sensitivity requests, and critical disclosure. A concentrated malicious purpose is split across times and messages, leaving short windows with only locally normal interaction and requiring long-term retention and sensitivity-state correlation; the complete sequence degrades further when identities cannot be unified across channels. The behavior reduces local signal strength and increases reconstruction cost.
  evidence_refs: [REF-000024, REF-000043]
  confidence: medium
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 让早期低敏感度交流表现为正常关系建立，并为后续请求提供可信上下文
    en: Make early low-sensitivity interaction appear as normal relationship building and provide plausible context for later requests
  analysis:
    paragraphs:
    - zh: 攻击者先交换普通信息并响应目标反馈，使后续请求继承已有会话的语言和关系。早期事件与正常社交或业务交流重叠，后续敏感请求也因历史上下文显得更合理；防守方必须验证关系和授权而不能把会话持续时间视为信任。由此请求外观获得次要特征伪装效果。
      en: The adversary first exchanges ordinary information and responds to victim feedback so later requests inherit the language and relationship of an existing conversation. Early events overlap normal social or business interaction, and later sensitive requests appear more plausible through history; defenders must validate relationship and authorization rather than treat conversation duration as trust. The request appearance therefore gains a secondary feature-disguise effect.
  evidence_refs: [REF-000043]
  confidence: medium
