research:
  limitations:
    paragraphs:
    - zh: 公开资料支持多轮对话与关系培养用于社会工程，但对每轮请求敏感度和完整时间线的披露有限，因此保持中等置信度。合法长期访谈和业务流程会产生相同结构，必须以授权、敏感度和流程偏离共同判断。
      en: Public material supports multi-turn dialogue and relationship cultivation in social engineering but provides limited disclosure of per-turn sensitivity and complete timelines, so confidence remains medium. Legitimate long-running interviews and business processes create the same structure and require joint assessment of authorization, sensitivity, and workflow deviation.
