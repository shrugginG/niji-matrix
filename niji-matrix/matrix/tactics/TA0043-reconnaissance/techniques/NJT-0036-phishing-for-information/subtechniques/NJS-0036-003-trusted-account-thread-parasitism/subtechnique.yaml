schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0036-003
parent_ref: NJT-0036
name:
  zh: 受信账户与线程寄生
  en: Trusted-Account and Thread Parasitism
summary:
  zh: 使用已受控合法账户或既有通信线程发起信息请求，使发送身份和对话上下文继承真实关系信任。
  en: Use a compromised legitimate account or existing communication thread to request information so sender identity and conversation context inherit genuine relationship trust.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受信账户与线程寄生是攻击者使用已受控的合法邮箱或协作账户，或进入真实既有通信线程，以该身份和关系上下文直接索取信息。账户控制的取得属于前置行为，本子技术从受信身份或线程被用于当前信息诱导开始。
    en: Trusted-Account and Thread Parasitism occurs when an adversary uses a compromised legitimate email or collaboration account or enters a genuine existing communication thread to request information under that identity and relationship context. Acquisition of account control is a prerequisite; this child begins when the trusted identity or thread is used for the current elicitation.
  - zh: 稳定分类变量是请求通过真实受信身份或已有关系承载，而不是仅伪造显示名称或复制话术。发送后删除、隐藏或规则操纵属于 NJS-0036-004，除非两项行为组合出现，否则不在本子技术内要求痕迹抑制。
    en: The stable classification variable is carriage of the request through a genuinely trusted identity or established relationship rather than only spoofing a display name or copying a pretext. Post-send deletion, hiding, or rule manipulation belongs to NJS-0036-004, and trace suppression is not required here unless the two behaviors are combined.
stealth_characteristics:
  paragraphs:
  - zh: 受信账户与线程寄生使信息请求带有有效域认证、真实账户历史、既有参与者和连贯会话上下文，降低陌生来源与新关系异常。残余痕迹集中在会话控制变化、设备与来源、令牌风险、收件人扩展、话术用途漂移和敏感请求，而不是邮件来源真实性。
    en: Trusted-Account and Thread Parasitism gives an information request valid domain authentication, genuine account history, established participants, and coherent conversation context, reducing unfamiliar-origin and new-relationship anomalies. Residual traces concentrate in changes of session control, device and origin, token risk, recipient expansion, purpose drift, and sensitive requests rather than authenticity of the sending domain.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入已受控合法账户或真实既有线程被用于当前直接信息请求的行为，且信任继承必须实质降低来源或关系异常。账户可以属于目标、伙伴或其他受信主体，媒介本身不构成分类。
    en: This sub-technique includes use of a compromised legitimate account or genuine existing thread for the current direct information request when inherited trust materially reduces origin or relationship anomaly. The account may belong to the victim, a partner, or another trusted party, and medium does not define the classification.
  - zh: 仅伪造显示名称或新建仿冒账户属于身份话术伪装，取得账户控制属于前置行为，一般邮箱持久化不服务于信息诱导时不在范围。删除消息或操纵规则是独立痕迹抑制变量。
    en: Merely spoofing a display name or creating a new imitation account is persona and pretext camouflage, acquiring account control is prerequisite behavior, and general mailbox persistence unrelated to information elicitation is outside scope. Message deletion or rule manipulation is a separate trace-suppression variable.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者控制教师、供应商、员工或合作伙伴账户后，在既有邮件或协作线程中索取凭据、财务、联系人或运营资料，使目标把请求视为关系内延续。
      en: This sub-technique applies when an adversary controls an educator, supplier, employee, or partner account and requests credentials, financial, contact, or operational data within an existing email or collaboration thread so the victim treats the request as continuation of a relationship.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要有效账户会话或真实线程访问权，并能理解历史语境、选择收件人和维持账户控制。异常设备、再认证、令牌撤销和收件关系基线会限制使用。
        en: The adversary needs a valid account session or access to a genuine thread and must understand historical context, select recipients, and maintain account control. Anomalous-device checks, reauthentication, token revocation, and recipient-relationship baselines constrain use.
    defender_model:
      paragraphs:
      - zh: 防守方可见有效域身份和线程内容，但必须关联身份会话、设备、令牌、收件人图和请求敏感度。只依赖 SPF、DKIM、DMARC 或既有发件关系会把攻击流量视为正常。
        en: Defenders see a valid domain identity and thread content but must correlate identity sessions, devices, tokens, recipient graphs, and request sensitivity. Reliance only on SPF, DKIM, DMARC, or an established sending relationship treats the attack traffic as normal.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 让信息请求继承真实账户和既有线程的身份与关系特征，降低来源和上下文异常
    en: Make the information request inherit identity and relationship features of a genuine account and existing thread to reduce origin and context anomaly
  analysis:
    paragraphs:
    - zh: 攻击者从真实账户或线程发起请求，使域认证、显示身份、历史参与者和会话主题保持正常。陌生发件人与新关系痕迹被可信身份和既有上下文替代，传统来源规则降低权重；防守方必须从会话控制、设备、收件人变化和敏感请求识别用途漂移。信息诱导因此获得来源与关系特征伪装。
      en: The adversary sends from a genuine account or thread so domain authentication, displayed identity, historical participants, and conversation topic remain normal. Trusted identity and established context replace unfamiliar-sender and new-relationship traces, reducing the weight of conventional origin rules; defenders must identify purpose drift through session control, devices, recipient changes, and request sensitivity. The elicitation therefore gains origin and relationship feature disguise.
