research:
  limitations:
    paragraphs:
    - zh: 受信账户的合法使用和攻击者使用在域认证层面相同，公开报告也可能省略完整会话证据。高置信度针对真实账户或线程带来的特征继承，具体操作者归因仍依赖身份审计和后续调查。
      en: Legitimate and adversary use of a trusted account is identical at the domain-authentication layer, and public reporting may omit complete session evidence. High confidence applies to feature inheritance from a genuine account or thread, while operator attribution still depends on identity audit and investigation.
