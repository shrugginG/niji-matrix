schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0036-004
parent_ref: NJT-0036
name:
  zh: 邮箱侧诱导痕迹抑制
  en: Mailbox-Side Solicitation Trace Suppression
summary:
  zh: 在信息请求发送前后隐藏、删除或操纵消息、规则、转发和元数据，降低普通邮箱视图与短期审计的证据完整性。
  en: Hide, delete, or manipulate messages, rules, forwarding, and metadata before or after information solicitation to reduce evidence integrity in ordinary mailbox views and short-term audit.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 邮箱侧诱导痕迹抑制是攻击者在受控邮箱或协作账户中，为隐藏通过钓鱼获取信息的请求而删除已发送或收到消息、建立隐藏或转发规则、改变普通视图或操纵可见元数据。行为直接服务于当前信息诱导证据的减少。
    en: Mailbox-Side Solicitation Trace Suppression occurs when an adversary in a controlled email or collaboration account deletes sent or received messages, creates hiding or forwarding rules, changes ordinary views, or manipulates visible metadata to conceal requests used for Phishing for Information. The behavior directly reduces evidence of the current elicitation.
  - zh: 稳定分类变量是邮箱侧证据可见性和完整性被有意改变，而不是账户本身是否受信。使用真实账户或线程属于 NJS-0036-003；一般邮箱持久化、数据收集或痕迹清理如果不服务于信息诱导，则不属于本子技术。
    en: The stable classification variable is deliberate alteration of mailbox-side evidence visibility and integrity rather than whether the account itself is trusted. Use of a genuine account or thread belongs to NJS-0036-003; general mailbox persistence, collection, or cleanup unrelated to information elicitation is outside this child.
stealth_characteristics:
  paragraphs:
  - zh: 邮箱侧诱导痕迹抑制使关键发送、回复或规则变化从用户普通视图消失，并可能超过短期审计保留或使调查只看到不完整线程。集中不可变日志、身份会话、管理员审计和收件方副本仍可能保留证据，因此匿迹取决于日志独立性、粒度与留存。
    en: Mailbox-Side Solicitation Trace Suppression removes key sends, replies, or rule changes from the user's ordinary view and may outlast short audit retention or leave investigators with an incomplete thread. Central immutable logs, identity sessions, administrator audit, and recipient copies may retain evidence, so stealth depends on log independence, granularity, and retention.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入为隐藏当前信息请求而执行的消息删除、隐藏、规则、转发、元数据或审计可见性变化。变化可以发生在发送前后，但必须与具体诱导会话具有时间和目的联系。
    en: This sub-technique includes message deletion, hiding, rule, forwarding, metadata, or audit-visibility changes performed to conceal a current information request. Changes may occur before or after sending but must have temporal and purposeful linkage to a concrete elicitation conversation.
  - zh: 使用受信账户但不改变证据属于 NJS-0036-003，普通用户清理、合法归档和安全响应删除需要按授权排除。取得邮箱权限、持续收集邮件或一般防御规避不在本技术范围。
    en: Use of a trusted account without evidence alteration belongs to NJS-0036-003, while ordinary user cleanup, legitimate archiving, and security-response deletion require exclusion through authorization. Acquisition of mailbox access, continuing email collection, or general defense evasion is outside this technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者从受控企业邮箱或协作账户发出信息请求后快速删除消息、隐藏回复或设置转发与清理规则，以减少账户所有者和调查人员看到的诱导证据。
      en: This sub-technique applies when an adversary sends information requests from a controlled enterprise email or collaboration account and then rapidly deletes messages, hides replies, or configures forwarding and cleanup rules to reduce elicitation evidence visible to the account owner and investigators.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要足够邮箱权限修改消息、规则或转发，并了解平台审计与保留机制。集中不可变日志、管理员保护的审计和快速会话撤销会限制痕迹抑制。
        en: The adversary needs sufficient mailbox permissions to modify messages, rules, or forwarding and knowledge of platform audit and retention. Central immutable logs, administrator-protected audit, and rapid session revocation constrain suppression.
    defender_model:
      paragraphs:
      - zh: 防守方若只查看用户当前邮箱将看到不完整证据，需要独立身份和邮箱审计、收件人副本及配置历史。SaaS 日志许可、留存和字段缺失会形成主要盲区。
        en: Defenders who inspect only the user's current mailbox see incomplete evidence and need independent identity and mailbox audit, recipient copies, and configuration history. SaaS logging licenses, retention, and missing fields create primary blind spots.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 通过删除、隐藏或规则操纵使关键信息请求不出现在普通邮箱视图或完整短期审计中
    en: Use deletion, hiding, or rule manipulation so key information requests do not appear in ordinary mailbox views or complete short-term audit
  analysis:
    paragraphs:
    - zh: 攻击者在发送诱导消息前后改变消息和邮箱配置，使用户视图、线程或转发状态不再反映真实活动。可见证据被删除或移至隐藏路径，缺少不可变集中日志的防守方无法重构完整会话；信息诱导因此降低邮箱侧可观察性。身份会话、管理员审计和收件方记录仍是残余证据。
      en: The adversary changes messages and mailbox configuration before or after sending elicitation so user views, threads, or forwarding state no longer reflect actual activity. Visible evidence is deleted or moved to hidden paths, preventing defenders without immutable centralized logs from reconstructing the full conversation; the elicitation therefore reduces mailbox-side observability. Identity sessions, administrator audit, and recipient records remain residual evidence.
