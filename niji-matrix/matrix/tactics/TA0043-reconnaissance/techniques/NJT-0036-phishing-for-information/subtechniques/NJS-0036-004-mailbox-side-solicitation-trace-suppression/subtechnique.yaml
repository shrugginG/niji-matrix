research:
  limitations:
    paragraphs:
    - zh: 当前证据主要来自 ATT&CK 对父技术中删除和操纵邮件或元数据的官方记录，缺少披露完整发送与清理时间线的独立公开案例，因此保持中等置信度。正常归档与用户清理会产生相似局部事件。
      en: Current evidence comes primarily from official ATT&CK documentation of deleting or manipulating emails or metadata under the parent technique, with no independent public case disclosing a complete send-and-cleanup timeline, so confidence remains medium. Normal archiving and user cleanup create similar local events.
