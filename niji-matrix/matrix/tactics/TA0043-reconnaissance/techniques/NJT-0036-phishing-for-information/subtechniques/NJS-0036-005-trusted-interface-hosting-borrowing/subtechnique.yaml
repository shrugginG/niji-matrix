research:
  limitations:
    paragraphs:
    - zh: 事件资料直接支持可信 Google Forms、院校品牌和业务流程仿冒，但同类平台也被大量合法部门使用。没有租户、所有权和数据去向时，可信域名与视觉相似只能说明风险，不能单独证明恶意。
      en: Incident reporting directly supports trusted Google Forms, institutional branding, and business-workflow imitation, but the same platforms are widely used by legitimate departments. Without tenant, ownership, and data-destination data, a trusted domain and visual similarity indicate risk but cannot alone establish malicious intent.
