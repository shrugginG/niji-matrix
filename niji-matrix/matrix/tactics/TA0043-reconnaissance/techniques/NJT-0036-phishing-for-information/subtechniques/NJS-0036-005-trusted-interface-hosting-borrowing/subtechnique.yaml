schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0036-005
parent_ref: NJT-0036
name:
  zh: 可信界面与托管表面借用
  en: Trusted Interface and Hosting-Surface Borrowing
summary:
  zh: 在常见可信服务上承载信息收集并复制目标品牌和流程，使页面技术与视觉属性接近合法业务界面。
  en: Host information collection on a common trusted service and copy victim branding and workflow so the page's technical and visual properties resemble a legitimate business interface.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 可信界面与托管表面借用是攻击者使用云表单、文档协作或类似常见可信服务承载信息收集，并复制目标品牌、配色、术语和业务流程，使目标直接在页面提交敏感信息。伪装对象是技术托管表面、租户关系和界面外观。
    en: Trusted Interface and Hosting-Surface Borrowing occurs when an adversary hosts information collection on cloud forms, document collaboration, or a similar common trusted service and copies victim branding, colors, terminology, and workflow so the victim submits sensitive information directly through the page. The disguised objects are the technical hosting surface, tenant relationship, and interface appearance.
  - zh: 稳定分类变量是可信平台属性和目标化界面共同降低页面异常，而不是仅使用链接或某个产品。只改变请求者身份与话术属于 NJS-0036-001，页面以执行载荷或直接取得访问为即时目标时不属于本技术。
    en: The stable classification variable is the joint reduction of page anomaly through trusted-platform properties and a victim-specific interface, not merely use of a link or product. Changing only requester persona and pretext belongs to NJS-0036-001, and a page whose immediate objective is payload execution or direct access is outside this technique.
stealth_characteristics:
  paragraphs:
  - zh: 可信界面与托管表面借用让信息收集页面使用具有良好声誉和正常 TLS 的常见平台域名，同时在视觉与流程上接近目标业务。域名声誉、证书和页面外观因而失去独立判别力；残余差异存在于实际租户、页面所有者、品牌授权、字段敏感度和数据提交目的地。
    en: Trusted Interface and Hosting-Surface Borrowing gives an information-collection page a common platform domain with good reputation and normal TLS while visually and procedurally resembling victim business. Domain reputation, certificates, and page appearance therefore lose independent discriminative value; residual differences remain in actual tenant, page owner, brand authorization, field sensitivity, and data-submission destination.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入可信托管服务和目标化界面共同用于直接接收披露信息的页面，且攻击者有意利用平台声誉或品牌相似降低识别。云表单、协作页、教育、招聘、财务和供应商界面都只是可能实现。
    en: This sub-technique includes pages where trusted hosting and a victim-specific interface jointly receive disclosed information and the adversary deliberately uses platform reputation or brand similarity to reduce detection. Cloud forms, collaboration pages, education, recruiting, finance, and supplier interfaces are possible implementations only.
  - zh: 仅有情境化消息而没有页面承载面变化属于 NJS-0036-001，使用受信发送账户属于 NJS-0036-003，普通链接媒介不是分类。合法外部表单若租户、所有者、数据去向和业务授权均可验证则排除。
    en: A contextualized message without a changed page surface belongs to NJS-0036-001, use of a trusted sending account belongs to NJS-0036-003, and a generic link medium does not define a class. Legitimate external forms are excluded when tenant, owner, data destination, and business authorization are verifiable.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者创建或滥用可信云表单和协作页面，模仿学校、招聘、财务、福利或供应商流程，收集登录凭据、银行信息和其他敏感资料。
      en: This sub-technique applies when an adversary creates or abuses trusted cloud forms and collaboration pages that imitate education, recruiting, finance, benefits, or supplier workflows to collect login credentials, banking information, and other sensitive data.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可用托管租户或被控制环境、复制品牌与流程的能力以及接收提交数据的权限。平台处置、租户验证、浏览器策略和品牌监测会限制页面寿命。
        en: The adversary needs an available hosting tenant or compromised environment, capability to copy branding and workflow, and access to submitted data. Platform enforcement, tenant validation, browser policy, and brand monitoring constrain page lifetime.
    defender_model:
      paragraphs:
      - zh: 防守方可能看到可信平台域名和正常加密，但需要解析具体租户、页面所有者、字段类型和数据去向，并与组织登记的敏感表单和品牌授权比较。只按 URL 声誉会产生盲区。
        en: Defenders may see a trusted platform domain and normal encryption but need to resolve the specific tenant, page owner, field types, and data destination and compare them with registered sensitive forms and brand authorization. URL reputation alone creates a blind spot.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 借用可信平台、品牌和业务流程外观，使信息收集页面与合法界面难以凭域名或视觉特征区分
    en: Borrow trusted platform, brand, and business-workflow appearance so the information-collection page is difficult to distinguish from a legitimate interface by domain or visual features
  analysis:
    paragraphs:
    - zh: 攻击者在常见可信服务上建立表单并复制目标视觉和流程。可疑独立站点的域、证书和布局被可信平台与品牌化界面替代，用户和安全工具若只看声誉或外观会认为正常；防守方必须验证租户、所有权和提交目的地。信息收集页面因此获得技术与视觉特征伪装。
      en: The adversary creates a form on a common trusted service and copies victim visual and workflow elements. A suspicious standalone site's domain, certificate, and layout are replaced by a trusted platform and branded interface, causing users and security tools relying only on reputation or appearance to treat it as normal; defenders must validate tenant, ownership, and submission destination. The collection page therefore gains technical and visual feature disguise.
  evidence_refs: [REF-000042]
  confidence: high
