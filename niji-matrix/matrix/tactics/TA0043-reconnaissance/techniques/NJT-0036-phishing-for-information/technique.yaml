schema_version: 2.0.0
type: technique
id: NJT-0036
name:
  zh: 通过钓鱼获取信息
  en: Phishing for Information
summary:
  zh: 通过电子社会工程直接诱导人员披露敏感或可操作信息，并通过身份、话术、时序、受信账户、痕迹抑制或可信界面降低识别与关联能力。
  en: Directly induce people through electronic social engineering to disclose sensitive or actionable information while using persona, pretext, timing, trusted accounts, trace suppression, or trusted interfaces to reduce detection and correlation.
aliases: [Information Elicitation]
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-retained
    source_attack_id: T1598
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1598
definition_and_concept:
  paragraphs:
  - zh: 通过钓鱼获取信息是攻击者借助电子邮件、即时消息、社交平台、在线表单或电子引导的语音通信，直接诱导人员披露凭据、验证码、联系人、财务、运营或其他可操作信息的侦查技术。其即时结果是获得数据，所获信息随后可以支持目标选择、身份冒充或账户行动。
    en: Phishing for Information is reconnaissance in which an adversary uses email, instant messaging, social platforms, online forms, or electronically initiated voice communication to directly induce a person to disclose credentials, verification codes, contacts, financial, operational, or other actionable information. Its immediate result is data acquisition, which may later support targeting, impersonation, or account action.
  - zh: 本技术不按邮件、链接、附件、服务或语音等媒介拆分 Niji 子技术，而按攻击者有意控制的匿迹变量划分。以代码执行、载荷打开、认证完成或直接取得访问为即时目标的行为属于其他技术；只有直接索取信息及其隐蔽实现属于本父技术。
    en: This technique does not partition Niji children by email, link, attachment, service, voice, or other medium, but by stealth variables deliberately controlled by the adversary. Behavior whose immediate objective is code execution, payload opening, completed authentication, or direct access belongs elsewhere; only direct information solicitation and its covert implementations belong to this parent.
stealth_characteristics:
  paragraphs:
  - zh: 通过钓鱼获取信息可以让恶意请求在身份、语言、业务理由、会话发展和技术界面上接近正常沟通，并可借用真实受信账户或既有线程降低来源异常。完整目的还可以分散到多轮消息，或通过删除、隐藏和规则操纵减少邮箱侧证据，使单条消息、可信域认证或普通用户视图都不足以判断活动。
    en: Phishing for Information can make a malicious request resemble normal communication in persona, language, business reason, conversation development, and technical interface, and can borrow a genuine trusted account or existing thread to reduce source anomaly. The complete purpose can also be distributed across multiple messages or mailbox evidence reduced through deletion, hiding, and rule manipulation, making one message, valid domain authentication, or an ordinary user view insufficient.
  - zh: 残余痕迹包括通信身份和授权关系、请求信息敏感度、跨消息升级、会话与设备、收件人图、表单租户与数据去向，以及不可变发送、删除和规则审计。独立验证、长周期关联、租户所有权检查与集中审计可以削弱匿迹；未受管个人渠道和端到端加密则扩大盲区。
    en: Residual traces include communication identity and authorization relationships, requested-information sensitivity, cross-message escalation, sessions and devices, recipient graphs, form tenant and data destination, and immutable send, deletion, and rule audit. Independent verification, long-horizon correlation, tenant-ownership checks, and centralized audit weaken stealth, while unmanaged personal channels and end-to-end encryption enlarge blind spots.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入通过电子通信直接让人员提供信息，且攻击者通过身份与话术、交互节奏、受信账户或线程、邮箱痕迹处理以及托管界面改变可区分性、关联性或可观察性的行为。请求可以针对凭据、验证码、联系人、财务、业务或环境资料，但直接目标必须是披露。
    en: This technique includes direct requests through electronic communication that cause people to provide information and adversary changes to persona and pretext, interaction cadence, trusted accounts or threads, mailbox traces, or hosting interfaces that alter distinguishability, correlation, or observability. Requests may target credentials, verification codes, contacts, financial, business, or environment data, but disclosure must be the immediate objective.
  - zh: 不与人员互动的公开、商业或第三方资料收集属于相应信息对象或访问表面；密码猜测、凭证填充、成功认证和账户接管属于后续访问行为。一般业务询问、合法访谈和支持流程不能仅凭敏感字段或多轮对话被认定为恶意，取得受信账户或托管资源本身也是本技术的前置条件而非组成部分。
    en: Public, commercial, or third-party collection without interaction with a person belongs to the corresponding information object or access surface, while password guessing, credential stuffing, successful authentication, and account takeover are downstream access behavior. Ordinary business questions, legitimate interviews, and support workflows must not be classified as malicious merely for sensitive fields or multiple turns, and acquisition of a trusted account or hosting resource is a prerequisite rather than part of this technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者在入侵前通过招聘、教育、财务、供应商、技术支持和内部行政等可信情境索取凭据、验证码或业务资料，也适用于使用云表单、协作服务和既有邮件线程收集信息。所得数据可用于后续社会工程、账户访问、支付重定向或更精确的目标选择。
      en: This technique applies when an adversary requests credentials, verification codes, or business data before compromise through plausible recruiting, education, finance, supplier, technical-support, or internal-administration contexts and when cloud forms, collaboration services, or existing email threads collect the information. The data may support later social engineering, account access, payment redirection, or more precise targeting.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要可用通信渠道、足够目标情境和接收披露信息的表面；不同子技术还要求长期维持身份、控制合法账户或线程、修改邮箱状态，或建立可信托管页面。其约束包括平台处置、身份与租户归因、独立验证、用户警觉、日志留存和无法保证目标回应。
        en: The adversary needs a usable communication channel, sufficient victim context, and a surface capable of receiving disclosed information; particular children additionally require maintaining a persona over time, controlling a legitimate account or thread, modifying mailbox state, or establishing a trusted hosted page. Constraints include platform enforcement, identity and tenant attribution, independent verification, user vigilance, log retention, and inability to guarantee a response.
    defender_model:
      paragraphs:
      - zh: 防守方可能拥有邮件与协作事件、身份会话、邮箱审计、Web 与表单元数据、数据分类和组织授权关系，但跨个人平台、语音和端到端加密渠道的可见性不完整。单一关键词、拼写、可信域名或域认证结果都不足够，必须验证关系、请求敏感度、会话进展、租户所有权、数据去向和痕迹一致性。
        en: Defenders may have email and collaboration events, identity sessions, mailbox audit, web and form metadata, data classification, and organizational authorization relationships, but visibility across personal platforms, voice, and end-to-end encrypted channels is incomplete. A keyword, spelling cue, trusted domain, or domain-authentication result alone is insufficient; relationships, request sensitivity, conversation progression, tenant ownership, data destination, and trace consistency require validation.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 让请求身份、业务语义、受信关系和托管界面接近正常通信与工作流，降低局部恶意特征
    en: Make requester identity, business semantics, trusted relationships, and hosting interfaces resemble normal communication and workflows to reduce local malicious features
  analysis:
    paragraphs:
    - zh: 攻击者塑造与目标角色一致的身份和理由，借用真实受信账户或线程，或把收集页面置于常见可信服务并复制品牌流程。粗糙或陌生的信息索取由此变成语义、来源或界面看似合理的业务请求，单条通信与正常活动特征重叠；防守方必须验证授权关系、会话控制者、租户和数据去向。恶意请求的局部可区分性因而下降。
      en: The adversary shapes a persona and reason consistent with the victim role, borrows a genuine trusted account or thread, or places a collection page on a common trusted service and copies branded workflow. A crude or unfamiliar solicitation becomes a business request with plausible semantics, origin, or interface whose individual features overlap normal activity; defenders must validate authorization relationships, session controller, tenant, and data destination. Local distinguishability of the malicious request therefore declines.
  evidence_refs: [REF-000024, REF-000042, REF-000043]
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 将完整信息索取分散到多轮和较长时间，使单条消息仅呈现低敏感度局部目的
    en: Distribute the complete information request across multiple turns and a longer period so each message presents only a low-sensitivity partial purpose
  analysis:
    paragraphs:
    - zh: 攻击者先建立关系或交换低敏感度信息，再逐轮提高请求范围和敏感度。集中的高风险索取被分解为跨时间和可能跨渠道的局部消息，单消息规则无法看到完整意图，防守需要长期保存身份、线程和敏感度状态。完整活动的关联成本上升，形成时空释痕效果。
      en: The adversary first establishes a relationship or exchanges low-sensitivity information and then expands scope and sensitivity turn by turn. A concentrated high-risk request is decomposed into partial messages across time and possibly channels, preventing per-message rules from seeing the complete purpose and requiring long-term retention of identity, thread, and sensitivity state. Correlation cost for the complete activity rises, producing spatiotemporal trace dilution.
  evidence_refs: [REF-000024, REF-000043]
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 通过删除、隐藏或操纵邮箱消息与规则减少普通视图和短期审计中的诱导证据
    en: Reduce solicitation evidence in ordinary views and short-term audit by deleting, hiding, or manipulating mailbox messages and rules
  analysis:
    paragraphs:
    - zh: 攻击者在受控邮箱发送信息请求前后删除消息、建立隐藏或转发规则，或操纵可见元数据。关键诱导事件从普通用户视图消失，短期或可修改审计也可能缺失，防守方若没有不可变集中日志便难以还原会话。活动因此降低邮箱侧可观察性，但身份与审计基础设施仍可能保存残余证据。
      en: The adversary deletes messages, creates hiding or forwarding rules, or manipulates visible metadata before or after sending information requests from a controlled mailbox. Key solicitation events disappear from ordinary user views and may be absent from short-lived or mutable audit, preventing reconstruction without immutable centralized logs. The activity therefore reduces mailbox-side observability, although identity and audit infrastructure may retain residual evidence.
  evidence_refs: [REF-000024]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立五项匿迹子技术：情境一致的身份与话术伪装、渐进式会话诱导、受信账户与线程寄生、邮箱侧诱导痕迹抑制、可信界面与托管表面借用。它们分别改变通信语义、请求的时间结构、真实发送身份与关系、发送后证据可见性以及技术承载与视觉所有权。
      en: 'This technique defines five evasion sub-techniques: Context-Conforming Persona and Pretext Camouflage, Progressive Conversational Elicitation, Trusted-Account and Thread Parasitism, Mailbox-Side Solicitation Trace Suppression, and Trusted Interface and Hosting-Surface Borrowing. They respectively change communication semantics, temporal structure of requests, genuine sending identity and relationship, visibility of post-send evidence, and technical hosting and visual ownership.'
    - zh: 受信账户寄生与邮箱痕迹抑制由旧归档合并项拆分，因为前者依赖信任继承并改变来源可区分性，后者依赖删除或规则操作并改变证据完整性。分类不按邮件、链接、附件、服务或语音媒介拆分，组合使用也不消除各自独立的检测与缓解边界。
      en: Trusted-account parasitism and mailbox trace suppression are split from the former archived combined child because the former depends on inherited trust and changes origin distinguishability, while the latter depends on deletion or rule manipulation and changes evidence integrity. The taxonomy does not partition by email, link, attachment, service, or voice medium, and combined use does not erase the independent detection and mitigation boundary of each child.
  coverage: established
  subtechnique_refs: [NJS-0036-001, NJS-0036-002, NJS-0036-003, NJS-0036-004, NJS-0036-005]
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000036, DET-000037, DET-000038]
  mitigations:
    coverage: available
    mitigation_refs: [MIT-000035, MIT-000036, MIT-000037]
evidence:
  claim_refs: [CLM-000138, CLM-000139, CLM-000140, CLM-000141, CLM-000142, CLM-000143]
  case_refs: [CASE-000034]
  reference_refs: [REF-000024, REF-000042, REF-000043]
research:
  limitations:
    paragraphs:
    - zh: 不同通信渠道对内容、线程、会话、删除和表单租户提供的遥测差异很大，个人平台与语音常完全位于组织视野之外。合法招聘、支持、财务和供应商流程也会使用可信情境、多轮沟通和外部表单，任何单一信号都不能证明恶意。
      en: Communication channels vary substantially in telemetry for content, thread, session, deletion, and form tenant, and personal platforms or voice often sit entirely outside organizational visibility. Legitimate recruiting, support, finance, and supplier workflows also use plausible contexts, multiple turns, and external forms, so no individual signal establishes malicious intent.
    - zh: 邮箱痕迹抑制目前主要由 ATT&CK 父技术的官方记录支持，公开案例证据弱于情境和托管界面伪装，因此保持中等置信度。未来证据需要区分取得账户、使用账户发送诱导、删除证据和使用所获信息四个独立阶段。
      en: Mailbox trace suppression is currently supported primarily by official ATT&CK parent documentation, with weaker public-case evidence than contextual and hosting-interface camouflage, so confidence remains medium. Future evidence must distinguish account acquisition, use of the account for elicitation, evidence deletion, and use of acquired information as separate stages.
