research:
  limitations:
    paragraphs:
    - zh: Microsoft 与 LinkedIn 的观测支持虚假画像开展定向员工侦查，司法文件支持虚构身份和在线服务被指控用于掩蔽归属，但后者属于刑事指控。合法假名和隐私工具产生相似信号，因此单账户不能确定归因。
      en: Microsoft and LinkedIn observations support targeted employee reconnaissance through a false profile, while judicial material alleges use of fictitious identities and online services to mask attribution and remains a criminal allegation. Legitimate pseudonymity and privacy tools create similar signals, so one account cannot establish attribution.
