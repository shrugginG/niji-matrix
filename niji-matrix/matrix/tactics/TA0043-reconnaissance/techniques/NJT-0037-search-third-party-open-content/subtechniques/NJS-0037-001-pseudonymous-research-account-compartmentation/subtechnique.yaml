schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0037-001
parent_ref: NJT-0037
name:
  zh: 假名研究账户隔离
  en: Pseudonymous Research-Account Compartmentation
summary:
  zh: 通过假名、虚构画像或专用平台账户开展第三方开放内容研究，使查询历史首先归属于隔离身份。
  en: Conduct third-party open-content research through a pseudonym, false profile, or dedicated platform account so query history is initially attributed to a compartmented identity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 假名研究账户隔离是攻击者使用假名、虚构画像或专用平台账户执行第三方开放内容查询和目标查看，并使该账户与真实身份、发送账户及其他行动基础设施保持分离。研究活动在平台日志中首先表现为该画像的普通参与行为。
    en: Pseudonymous Research-Account Compartmentation occurs when an adversary uses a pseudonym, false profile, or dedicated platform account for third-party open-content searches and target views while separating it from the real identity, sending accounts, and other operational infrastructure. Research activity appears first in platform logs as ordinary participation by that profile.
  - zh: 稳定分类变量是研究身份和查询历史的账户级隔离，而不是账户虚假程度、网站类型或账户数量。纯匿名无账户访问没有可供本分类分析的账户痕迹，假账户若只用于发送钓鱼而不研究则属于其他技术。
    en: The stable classification variable is account-level compartmentation of research identity and query history, not degree of profile falsity, site type, or number of accounts. Purely anonymous accountless access lacks the account trace analyzed by this class, and a false account used only to send phishing rather than conduct research belongs elsewhere.
stealth_characteristics:
  paragraphs:
  - zh: 假名研究账户隔离将真实操作者和跨行动关系替换为外观可信或用途单一的平台画像，使单次查询、目标查看和间歇活动难以识别为恶意侦查并归到真实身份。残余关系仍存在于设备、登录来源、恢复属性、创建模式、目标图和后续滥用中，严格隔离会提高关联难度。
    en: Pseudonymous Research-Account Compartmentation replaces the real operator and cross-operation relationships with a plausible or single-purpose platform profile, making individual searches, target views, and intermittent activity difficult to classify as malicious reconnaissance and attribute to the real identity. Residual links remain in devices, login origins, recovery attributes, creation patterns, target graphs, and downstream abuse, while strict separation raises correlation difficulty.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入用于第三方开放内容研究的假名或虚构画像，以及有意把查询历史与其他行动身份分离的专用研究账户。账户必须实际执行目标查询或查看，并具有身份隔离目的。
    en: This sub-technique includes pseudonymous or fictitious profiles used for third-party open-content research and dedicated research accounts deliberately separating query history from other operational identities. The account must actually query or view targets and serve an identity-compartmentation purpose.
  - zh: 无账户普通浏览、新建但未隔离的合法账户、仅用于发送诱导消息的假账户和仅因使用多个网站而推断的分布式查询均排除。平台、代码库、社交或搜索介质本身不定义子技术。
    en: Accountless ordinary browsing, a new legitimate account without compartmentation, a false account used only to send elicitation, and distributed querying inferred merely from multiple sites are excluded. Platform, code repository, social, or search medium does not define the child.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在社交、搜索或代码平台上间歇研究特定组织员工、关系、公开代码和主题，同时避免把目标查看记录直接连接到后续发送或基础设施账户。
      en: This sub-technique applies when an adversary intermittently researches employees, relationships, public code, and topics tied to a specific organization on social, search, or code platforms while avoiding direct linkage of target-view records to downstream sending or infrastructure accounts.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要平台账户和可信画像运营能力，并能够隔离设备、登录、恢复和其他身份属性。长期维持画像会增加时间成本，平台挑战与处置也可能暴露关联。
        en: The adversary needs a platform account and capability to operate a plausible profile and separate devices, logins, recovery, and other identity attributes. Maintaining a profile over time adds cost, while platform challenges and enforcement may expose linkage.
    defender_model:
      paragraphs:
      - zh: 目标组织通常看不到查询，平台方需要账户、设备、登录、恢复、目标图与后续滥用数据。隐私规则和合法假名要求检测依赖多维组合并保留置信度。
        en: Victim organizations usually cannot see queries, while providers need account, device, login, recovery, target-graph, and downstream-abuse data. Privacy rules and legitimate pseudonymity require multidimensional evidence and calibrated confidence.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 将查询归到外观可信且隔离的研究画像，使单次平台活动接近普通参与者并掩蔽真实操作者
    en: Attribute queries to a plausible compartmented research profile so individual platform activity resembles ordinary participation and masks the real operator
  analysis:
    paragraphs:
    - zh: 攻击者通过隔离画像进行搜索和查看，并避免复用真实或其他行动身份。平台可见身份从操作者变为普通账户外观，单条日志缺少跨行动或恶意特征；检测必须关联设备、登录、恢复属性、目标集中度和后续滥用。真实归属因而被账户特征伪装并提高恢复成本。
      en: The adversary searches and views through a compartmented profile and avoids reuse of real or other operational identities. The platform-visible identity changes from the operator to an ordinary-looking account, leaving individual logs without cross-operation or malicious features; detection must correlate devices, logins, recovery attributes, target concentration, and downstream abuse. Attribution is therefore disguised by account features and costs more to recover.
  evidence_refs: [REF-000050, REF-000051]
  confidence: medium
