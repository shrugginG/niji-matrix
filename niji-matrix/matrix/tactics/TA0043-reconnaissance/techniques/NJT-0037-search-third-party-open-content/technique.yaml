schema_version: 2.0.0
type: technique
id: NJT-0037
name:
  zh: 检索第三方开放内容
  en: Search Third-Party Open Content
summary:
  zh: 在入侵前从不由目标控制的公开网站、搜索、社交或代码内容中检索目标信息，并以目标外查询或假名研究账户降低受害方可见性与归因能力。
  en: Search public websites, search, social, or code content not controlled by the victim before compromise while using off-victim queries or pseudonymous research accounts to reduce victim visibility and attribution.
aliases: [Search Open Websites/Domains]
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-adapted
    source_attack_id: T1593
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1593
definition_and_concept:
  paragraphs:
  - zh: 检索第三方开放内容是攻击者在入侵前，从不由目标组织控制的公开网站、搜索索引、社交平台、新闻、归档、公共登记页面或公开代码内容中检索可用于目标选择的信息。该技术描述访问表面，所得主机、身份、网络和组织信息仍由相应信息对象技术表达。
    en: Search Third-Party Open Content is pre-compromise reconnaissance in which an adversary searches public websites, search indexes, social platforms, news, archives, public registration pages, or public code content not controlled by the victim for information useful in targeting. This technique describes the access surface, while resulting host, identity, network, and organizational information remains represented by the corresponding information-object technique.
  - zh: 本技术适配 ATT&CK 父语义以消除按网站类型与信息对象重复：不继承社交媒体、搜索引擎或代码仓库原子分类。第三方公开访问本身只有在替代目标资产访问、把痕迹移到提供方，或通过假名研究身份改变可见归属时才具有 Niji 匿迹意义。
    en: This technique adapts the ATT&CK parent semantics to remove duplication between site type and information object and does not inherit atomic categories for social media, search engines, or code repositories. Third-party public access has Niji stealth meaning only when it substitutes for victim-asset access and moves traces to a provider or changes visible attribution through a pseudonymous research identity.
stealth_characteristics:
  paragraphs:
  - zh: 检索第三方开放内容使实际查询停留在服务提供方，目标组织没有对应采集事件；提供方通常只看到普通公开内容访问。假名或专用研究账户还可以把查询历史首先归到与真实身份和其他行动账户隔离的画像，使目标方缺少可见性，平台方也需要跨账户和后续滥用关联才能识别操作者。
    en: Search Third-Party Open Content leaves actual queries at the service provider with no corresponding victim collection event, while the provider usually sees ordinary public-content access. A pseudonymous or dedicated research account can also attach query history first to a profile separated from the real identity and other operational accounts, depriving the victim of visibility and requiring the provider to correlate across accounts and downstream abuse to identify the operator.
  - zh: 残余痕迹包括平台账户创建、登录、设备、恢复属性、查询、画像查看与处置记录，以及公开内容在后续定向活动中的重现。无账户访问、离线副本和严格账户隔离会降低可见性；公开访问的高合法率也使单次查询难以判定。
    en: Residual traces include platform account creation, login, device, recovery, query, profile-view, and enforcement records and recurrence of public content in downstream targeting. Accountless access, offline copies, and strict account separation reduce visibility, while the high legitimate prevalence of public access makes one query difficult to assess.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入在第三方公开网站、索引、社交平台、新闻、归档、登记页面或代码内容中搜索目标资料，并以目标外访问表面或隔离研究身份改变防守观察的行为。查询内容可以涉及人员、组织、网络或主机，但这些信息对象不成为本父技术的子技术。
    en: This technique includes searches for victim material in third-party public websites, indexes, social platforms, news, archives, registration pages, or code content when an off-target access surface or compartmented research identity changes defender observation. Query content may concern people, organizations, networks, or hosts, but those information objects do not become children of this parent.
  - zh: 受害者控制或代运营的网站属于 NJT-0038，结构化网络和主机观测由 NJT-0034 或 NJT-0032 表达，公共 AI 对材料进行实质综合、推理或生成时属于 T1682 范围。没有痕迹变化的普通公开阅读不构成 Niji 子技术，直接探测目标仍属于 NJT-0001。
    en: Websites controlled by or operated for the victim belong to NJT-0038, structured network and host observations are represented by NJT-0034 or NJT-0032, and material synthesis, inference, or generation by public AI belongs to the T1682 scope. Ordinary public reading without a trace change is not a Niji child, and direct victim probing remains NJT-0001.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术常用于攻击者在接触目标前搜索员工、合作伙伴、公开代码、招聘和业务资料，以构造话术、识别泄露凭据、筛选技术环境或了解组织关系。它适用于搜索、社交、新闻、归档、公共登记和代码托管平台。
      en: This technique commonly applies when an adversary searches for employees, partners, public code, recruiting, and business material before victim contact to build pretexts, identify leaked credentials, select technical environments, or understand organizational relationships. Applicable environments include search, social, news, archive, public-registry, and code-hosting platforms.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问公开内容，并可能维护与真实身份及其他行动账户隔离的研究画像。其能力包括搜索语法、实体解析、目标图构建和账户运营，约束包括平台日志、账户处置、查询配额、公开数据陈旧和跨账户关联。
        en: The adversary needs access to public content and may maintain a research profile separated from its real identity and other operational accounts. Capabilities include search syntax, entity resolution, target-graph construction, and account operation; constraints include platform logs, account enforcement, query quotas, stale public data, and cross-account linkage.
    defender_model:
      paragraphs:
      - zh: 目标组织通常只能治理自身暴露并观察后续定向活动，平台方则可能看到账户、设备、登录、查询和目标查看。检测需要平台共享或内容到后续使用的关联，且必须保护合法研究、记者、招聘和隐私敏感用户。
        en: The victim organization can generally govern its exposure and observe downstream targeting, while providers may see accounts, devices, logins, queries, and target views. Detection requires provider sharing or correlation from content to downstream use and must protect legitimate research, journalism, recruiting, and privacy-sensitive users.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以第三方开放内容查询替代目标资产访问，使实际消费者的采集痕迹停留在服务提供方
    en: Substitute third-party open-content queries for victim-asset access so the actual consumer's collection traces remain with the service provider
  analysis:
    paragraphs:
    - zh: 攻击者从第三方已公开、索引或归档的内容取得目标资料，不访问受害者资产。目标侧采集事件被提供方查询替代，受害方没有直接日志，提供方看到的又是高频普通内容访问；防守需要平台审计或从后续使用反推。采集因此移出目标观察面并降低直接可见性。
      en: The adversary obtains victim material from content already published, indexed, or archived by a third party and does not access victim assets. Provider queries replace victim-side collection events, leaving no direct victim logs while the provider sees high-volume ordinary content access; defense requires platform audit or inference from downstream use. Collection therefore leaves the victim vantage point and reduces direct visibility.
  evidence_refs: [REF-000044, REF-000052]
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary:
    zh: 让可见查询归属于外观可信的隔离研究画像，使单次平台行为接近普通参与者并难以关联真实操作者
    en: Attribute visible queries to a plausible compartmented research profile so individual platform activity resembles ordinary participation and is difficult to link to the real operator
  analysis:
    paragraphs:
    - zh: 攻击者使用假名、虚构画像或专用账户执行查询与目标查看，并避免直接复用其他行动身份。真实操作者痕迹被看似普通的账户身份替代，单次平台活动缺少恶意或跨行动特征；平台必须关联设备、登录、恢复属性、目标图和后续滥用。研究行为因此获得身份与归属特征伪装。
      en: The adversary uses a pseudonym, false profile, or dedicated account for searches and target views while avoiding direct reuse of other operational identities. An apparently ordinary account identity replaces traces of the real operator, leaving one platform action without malicious or cross-operation features; the provider must correlate devices, logins, recovery attributes, target graphs, and downstream abuse. The research behavior therefore gains identity and attribution feature disguise.
  evidence_refs: [REF-000050, REF-000051]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立一项假名研究账户隔离子技术，其稳定变量是查询与目标查看记录首先归属于和真实身份及其他行动账户分离的可信画像。父技术固有的目标外访问不因网站类型继续拆分，只有账户身份隔离产生额外且可独立防守的观察差异。
      en: This technique defines one child, Pseudonymous Research-Account Compartmentation, whose stable variable is that search and target-view records are attributed first to a plausible profile separated from the real identity and other operational accounts. The parent's inherent off-target access is not further divided by site type; only account-identity compartmentation produces an additional, independently defensible observation difference.
    - zh: 匿名无账户访问、缓存与镜像、多平台分散查询和批量离线筛选仍保持延期，因为现有证据没有同时证明攻击者有意使用、稳定痕迹变量和不同防御效果。分类也不继承 ATT&CK 的社交、搜索或代码仓库子技术。
      en: Anonymous accountless access, caches and mirrors, multi-platform distribution, and bulk offline filtering remain deferred because available evidence does not jointly establish deliberate adversary use, a stable trace variable, and distinct defensive effect. The taxonomy also does not inherit ATT&CK children for social, search, or code repositories.
  coverage: established
  subtechnique_refs: [NJS-0037-001]
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000034, DET-000035]
  mitigations:
