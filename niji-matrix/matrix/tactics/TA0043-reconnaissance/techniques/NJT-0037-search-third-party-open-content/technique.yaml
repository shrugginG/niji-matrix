research:
  limitations:
    paragraphs:
    - zh: 第三方开放搜索具有很高合法发生率并常在受害方视野之外，目标组织通常无法观察采集本身。平台资料和事件可以证明假名画像用于定向研究，但用户隐私、合法假名和共享基础设施限制确定性归因。
      en: Third-party open search has very high legitimate prevalence and often occurs outside victim visibility, so target organizations usually cannot observe collection itself. Platform and incident reporting establish pseudonymous profiles used for targeted research, but user privacy, legitimate pseudonymity, and shared infrastructure limit deterministic attribution.
    - zh: T1593 的访问表面会与 NJT-0032、NJT-0033、NJT-0034 和 NJT-0035 的直接信息对象同时适用；这种交叉不表示父技术重复。评审必须确认页面按访问路径解释，而不是把所得数据类别重新包装为子技术。
      en: The T1593 access surface can co-occur with the direct information objects of NJT-0032, NJT-0033, NJT-0034, and NJT-0035; that intersection does not make the parents duplicates. Review must ensure the page explains the access path rather than repackaging resulting data categories as children.
