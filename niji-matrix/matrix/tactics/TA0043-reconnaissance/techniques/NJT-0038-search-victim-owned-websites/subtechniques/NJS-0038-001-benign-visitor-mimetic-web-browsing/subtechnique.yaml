schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0038-001
parent_ref: NJT-0038
name:
  zh: 正常访客拟态的网站浏览
  en: Benign-Visitor-Mimetic Web Browsing
summary:
  zh: 读取受害者公开内容时保持合法客户端语义、人工节奏、连贯页面路径和有限请求范围，使侦查接近正常访客。
  en: Preserve legitimate client semantics, human cadence, coherent page paths, and limited request scope while reading victim public content so reconnaissance resembles benign visitors.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 正常访客拟态的网站浏览是攻击者直接读取受害者自有公开内容时，有意使用常见浏览器语义、自然 Referer 与导航顺序、人工请求间隔和有限页面范围，使会话接近求职、客户、媒体、投资者、供应商或研究访问。
    en: Benign-Visitor-Mimetic Web Browsing occurs when an adversary directly reads victim-owned public content while deliberately using common browser semantics, natural referrers and navigation order, human request intervals, and limited page scope so the session resembles job-seeker, customer, media, investor, supplier, or research visits.
  - zh: 稳定分类变量是会话整体外观与节奏被有意塑造成正常访客，而不是单纯低速、某个 User-Agent 或请求量少。行为必须服务于攻击前画像，合法访问和由网络条件自然造成的相似节奏排除。
    en: The stable classification variable is deliberate shaping of overall session appearance and cadence as a normal visitor rather than low rate, a particular User-Agent, or low request count alone. The behavior must support pre-compromise profiling, excluding legitimate access and similar cadence arising naturally from network conditions.
stealth_characteristics:
  paragraphs:
  - zh: 正常访客拟态的网站浏览把批量或机械化采集转换为低量、连贯、具有人工节奏且客户端特征常见的会话，降低单会话异常。访问仍完整留在 Web 日志中，主题组合、来源历史和后续行动仍可能暴露画像目的；短窗口或只看速率的检测更容易漏失。
    en: Benign-Visitor-Mimetic Web Browsing transforms bulk or mechanical collection into low-volume, coherent, human-paced sessions with common client features, reducing per-session anomaly. Access remains fully present in web logs, and topic combinations, origin history, and downstream action can still reveal profiling purpose; short-window or rate-only detection is more likely to miss it.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入有意保持正常客户端、导航、节奏和有限范围的受害者公开页面访问，并要求页面组合用于恶意目标信息收集。所有路径都应已经公开或正常可达。
    en: This sub-technique includes victim public-page access that deliberately preserves normal client, navigation, cadence, and limited scope when the page combination supports malicious victim-information collection. Every path should already be public or normally reachable.
  - zh: 路径猜测和响应差异验证属于 NJT-0001，只依据已发布导航工件减少请求属于 NJS-0038-002，第三方网站查询属于 NJT-0037。合法访客和经授权研究不得仅因访问高价值主题而归类。
    en: Path guessing and response-difference validation belong to NJT-0001, request reduction based only on published navigation artifacts belongs to NJS-0038-002, and third-party website queries belong to NJT-0037. Legitimate visitors and authorized research must not be classified merely for visiting high-value topics.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在公开公司、招聘、合作伙伴、文档或支持页面之间自然导航，以了解人员、流程、技术与业务关系并准备后续定向活动。
      en: This sub-technique applies when an adversary navigates naturally across public corporate, recruiting, partner, documentation, or support pages to learn people, processes, technologies, and business relationships for later targeted activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要控制浏览器特征、访问顺序和节奏，并理解正常用户旅程。较长操作时间、内容更新、会话标识和来源历史会限制大规模画像。
        en: The adversary needs control of browser features, access order, and cadence and understanding of normal user journeys. Longer operation time, content changes, session identifiers, and origin history constrain profiling at scale.
    defender_model:
      paragraphs:
      - zh: 防守方需要完整会话、页面主题、来源历史和后续事件，单一 User-Agent、低速或低请求量不足以判断。CDN 聚合和隐私标识可能破坏跨会话关联。
        en: Defenders need complete sessions, page topics, origin history, and downstream events; a User-Agent, low rate, or low request count alone is insufficient. CDN aggregation and privacy identifiers may break cross-session correlation.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 让客户端、导航、节奏和访问范围接近正常访客，降低恶意画像会话的局部可区分性
    en: Make client, navigation, cadence, and access scope resemble normal visitors to reduce local distinguishability of a malicious profiling session
  analysis:
    paragraphs:
    - zh: 攻击者按正常用户旅程访问少量语义相关页面，并保持常见客户端和人工间隔。机械化抓取的高并发、异常跳转和广泛覆盖被正常会话特征替代，单会话分析难以区分意图；防守方必须结合主题组合、来源历史和后续使用。恶意访问因此获得特征伪装效果。
      en: The adversary follows a normal user journey across a few semantically related pages with a common client and human intervals. Normal session features replace high concurrency, anomalous transitions, and broad coverage of mechanical crawling, making intent difficult to distinguish within one session; defenders must combine topic sets, origin history, and downstream use. The malicious access therefore gains feature disguise.
  evidence_refs: [REF-000030, REF-000045]
  confidence: medium
