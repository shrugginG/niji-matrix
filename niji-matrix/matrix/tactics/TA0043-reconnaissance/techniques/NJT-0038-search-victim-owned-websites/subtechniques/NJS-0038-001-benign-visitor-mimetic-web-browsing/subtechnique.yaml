research:
  limitations:
    paragraphs:
    - zh: 正常用户和合法研究会产生相同会话外观，当前事件资料也未公开足够请求序列直接证明攻击者使用该变量。因此分类因果为强推断并保持中等置信度，必须依赖后续用途与多维上下文。
      en: Normal users and legitimate researchers create the same session appearance, and current incidents do not disclose enough request sequence to prove adversary use of this variable directly. The classification causal chain is strongly inferred at medium confidence and requires downstream purpose and multidimensional context.
