research:
  limitations:
    paragraphs:
    - zh: ATT&CK 明确记录 sitemap 和 robots 可用于发现路径，也给出快速爬取与大量请求检测线索，但公开事件未披露攻击者完整导航序列。因此替代因果为中等置信度，不能把任何 sitemap 或 robots 访问直接视为恶意。
      en: ATT&CK explicitly records use of sitemaps and robots files for path discovery and provides rapid-crawling and high-volume detection leads, but public incidents do not disclose complete adversary navigation sequences. The substitution causal chain remains medium confidence, and any sitemap or robots access must not be treated as malicious by itself.
