schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0038-002
parent_ref: NJT-0038
name:
  zh: 受害者发布导航工件替代
  en: Victim-Published Navigation-Artifact Substitution
summary:
  zh: 只使用受害者公开链接、sitemap 或 robots 工件揭示的路径，以确定性导航替代字典猜测和高扇出验证。
  en: Use only paths revealed by victim public links, sitemaps, or robots artifacts, substituting deterministic navigation for wordlist guessing and high-fan-out validation.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 受害者发布导航工件替代是攻击者先读取公开链接图、sitemap 或 robots 工件，再只请求其中明确列出或由公开链接确定可达的路径，以少量成功访问获得信息而不生成未发布候选路径。
    en: Victim-Published Navigation-Artifact Substitution occurs when an adversary first reads public link graphs, sitemaps, or robots artifacts and then requests only paths explicitly listed or deterministically reachable through public links, obtaining information through a few successful visits without generating unpublished candidate paths.
  - zh: 稳定分类变量是路径候选完全来自受害者已发布导航数据，而不是请求数量少。自行使用字典、命名规则或响应差异发现未发布路径属于主动扫描；导航工件只是公开信息来源，不是访问控制。
    en: The stable classification variable is that path candidates come entirely from victim-published navigation data rather than low request count. Using wordlists, naming rules, or response differences to discover unpublished paths is Active Scanning; navigation artifacts are public information sources, not access controls.
stealth_characteristics:
  paragraphs:
  - zh: 受害者发布导航工件替代把大量候选路径、错误响应和可识别字典序列转换为先读取工件后访问少量已列出路径的成功请求。目标仍能观察完整访问，但基于错误率、路径扇出和猜测顺序的检测信号减弱；工件读取、低流量路径组合和后续使用仍是残余线索。
    en: Victim-Published Navigation-Artifact Substitution transforms numerous candidate paths, error responses, and recognizable wordlist sequences into a navigation-artifact read followed by a few successful requests to listed paths. The victim still observes complete access, but detection signals based on error rate, path fan-out, and guessing order weaken; artifact reads, low-traffic path combinations, and downstream use remain residual clues.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入读取受害者公开链接、sitemap 或 robots 工件，并只访问其中已列出路径以替代猜测式枚举的行为。工件必须由受害者公开，路径选择与工件之间必须具有可验证来源关系。
    en: This sub-technique includes reading victim public links, sitemaps, or robots artifacts and accessing only listed paths in place of speculative enumeration. The victim must publish the artifact, and path selection must have a verifiable provenance relationship to it.
  - zh: 从字典或规则生成未发布候选、通过成功与错误比较存在性、或仅因访问数量少推断匿迹均排除。正常搜索引擎和站点地图验证需要依据来源、用途与后续行为区分。
    en: Generating unpublished candidates from wordlists or rules, comparing success and errors to test existence, or inferring stealth only from low access count are excluded. Normal search engines and sitemap validation require distinction through origin, purpose, and downstream behavior.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者从公开网站导航工件发现文档、支持、开发者、归档或低流量业务路径，并希望避免字典扫描产生的错误与高扇出信号。
      en: This sub-technique applies when an adversary discovers documentation, support, developer, archive, or low-traffic business paths from public site navigation artifacts and seeks to avoid errors and high-fan-out signals produced by wordlist scanning.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要读取和解析链接图、sitemap 或 robots，并严格限制请求到已发布路径。工件陈旧、路径撤回和访问控制会降低结果，进一步猜测会越过本分类边界。
        en: The adversary needs to read and parse link graphs, sitemaps, or robots artifacts and strictly limit requests to published paths. Stale artifacts, withdrawn paths, and access controls reduce results, while further guessing crosses this classification boundary.
    defender_model:
      paragraphs:
      - zh: 防守方需要保留导航工件版本、路径发现来源和会话顺序，单看成功请求难以判断。搜索引擎、站点验证和正常直接链接访问形成高合法背景。
        en: Defenders need navigation-artifact versions, path-discovery provenance, and session order; successful requests alone are difficult to assess. Search engines, site validation, and normal direct-link access create high legitimate background.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以受害者已发布路径的少量成功访问替代猜测、错误和高扇出请求，使枚举信号不再出现
    en: Substitute a few successful accesses to victim-published paths for speculation, errors, and high-fan-out requests so enumeration signals no longer appear
  analysis:
    paragraphs:
    - zh: 攻击者从公开导航工件取得确定路径并只请求这些对象。字典生成、存在性验证和错误响应被已发布信息读取替代，基于猜测行为的检测无法观察原本的枚举过程；防守方只能从工件读取、访问顺序和后续使用推断意图。主动枚举在目标日志中因此被行为更透明的公开导航替代。
      en: The adversary obtains deterministic paths from public navigation artifacts and requests only those objects. Published-information reading replaces wordlist generation, existence validation, and error responses, preventing guessing-based detection from observing the original enumeration process; defenders can infer intent only from artifact reads, access order, and downstream use. Active enumeration is therefore replaced in victim logs by behaviorally more transparent public navigation.
  evidence_refs: [REF-000045]
  confidence: medium
