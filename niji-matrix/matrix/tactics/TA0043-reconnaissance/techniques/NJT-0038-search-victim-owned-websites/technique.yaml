schema_version: 2.0.0
type: technique
id: NJT-0038
name:
  zh: 搜索受害者自有网站
  en: Search Victim-Owned Websites
summary:
  zh: 在入侵前直接读取受害者控制或代运营的公开 Web 资产，并通过正常访客拟态或已发布导航工件降低访问意图和枚举信号。
  en: Directly read public web assets controlled by or operated for the victim before compromise while using benign-visitor mimicry or published navigation artifacts to reduce access-intent and enumeration signals.
aliases: [Victim-Public-Site Reconnaissance]
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-adapted
    source_attack_id: T1594
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1594
definition_and_concept:
  paragraphs:
  - zh: 搜索受害者自有网站是攻击者在入侵前直接访问由受害者控制或代表其运营的公开 Web 资产，读取部门、位置、人员、业务关系、运营、技术栈、工作流和品牌信息，以支持目标选择与后续行动的侦查技术。
    en: Search Victim-Owned Websites is pre-compromise reconnaissance in which an adversary directly accesses public web assets controlled by or operated for the victim and reads departmental, location, people, business-relationship, operating, technology-stack, workflow, and brand information to support targeting and follow-on action.
  - zh: 本技术对 ATT&CK 父范围进行收窄，只保留读取受害者已经公开的页面、路径和导航工件，并要求存在正常访客拟态或确定性导航替代等匿迹因果。自行生成路径并比较成功、错误或响应差异属于主动扫描，提交表单诱导人员回应属于通过钓鱼获取信息。
    en: This technique narrows the ATT&CK parent scope to reading pages, paths, and navigation artifacts already published by the victim and requires a stealth causal chain such as benign-visitor mimicry or deterministic-navigation substitution. Generating paths and comparing success, errors, or response differences is Active Scanning, while submitting forms to elicit human response is Phishing for Information.
stealth_characteristics:
  paragraphs:
  - zh: 搜索受害者自有网站必然进入目标的 Web、CDN 或 WAF 日志，但攻击者可以保持合法浏览器语义、连贯路径、人工节奏和有限范围，使会话与求职、客户、媒体、投资者、供应商或研究访问高度相似。攻击者也可以只使用公开链接、sitemap 或 robots 工件已揭示的路径，避免高扇出猜测和错误响应。
    en: Search Victim-Owned Websites necessarily enters victim web, CDN, or WAF logs, but an adversary can preserve legitimate-browser semantics, coherent paths, human cadence, and limited scope so the session closely resembles job-seeker, customer, media, investor, supplier, or research visits. The adversary can also use only paths revealed by public links, sitemaps, or robots artifacts, avoiding high-fan-out speculation and error responses.
  - zh: 残余痕迹包括客户端、来源、Referer、请求顺序、页面主题、导航工件读取和后续行为。正常外观不能消除主题组合和意图线索，已发布路径也可能包含低流量或敏感对象；完整会话、导航图和后续活动关联能够削弱匿迹效果。
    en: Residual traces include client, origin, referrer, request sequence, page topics, navigation-artifact reads, and downstream behavior. Normal appearance does not remove thematic and intent clues, and published paths may still include low-traffic or sensitive objects; full-session, navigation-graph, and downstream correlation can weaken stealth.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入直接读取受害者官网、招聘、新闻、投资者关系、文档、支持、状态和开发者门户等公开内容，以及有意保持正常访客会话或只访问已发布路径的实现。页面信息必须用于攻击前目标画像或行动规划。
    en: This technique includes direct reading of public victim corporate, recruiting, news, investor-relations, documentation, support, status, and developer portals and implementations that deliberately preserve a normal visitor session or access only published paths. Page information must support pre-compromise victim profiling or operation planning.
  - zh: 查询第三方缓存、索引、社交或代码平台属于 NJT-0037；自行生成未发布候选路径并通过响应验证属于 NJT-0001；提交消息或表单直接诱导人员披露属于 NJT-0036。普通网站浏览如果没有恶意目标和有意匿迹变量则排除。
    en: Queries to third-party caches, indexes, social, or code platforms belong to NJT-0037; generating unpublished candidate paths and validating them through responses belongs to NJT-0001; submitting messages or forms to elicit disclosure directly from people belongs to NJT-0036. Ordinary site browsing without a malicious objective and deliberate stealth variable is excluded.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术常用于攻击者在联系目标、构造钓鱼、选择入口或安排攻击时间前，从受害者公开网站了解人员、合作伙伴、技术、支持流程和运营节奏。它适用于公开公司网站、教育与招聘门户、文档、状态页和客户支持站点。
      en: This technique commonly applies when an adversary learns about people, partners, technologies, support workflows, and operating tempo from victim public websites before contacting targets, crafting phishing, selecting entry points, or scheduling operations. Applicable environments include public corporate sites, education and recruiting portals, documentation, status pages, and customer-support sites.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要公开网络访问和解析页面、链接及导航工件的能力，并可控制客户端语义、请求节奏和访问范围。其约束包括目标日志、WAF 与 CDN 关联、内容更新、会话标识和不得通过猜测或提交越过公开读取边界。
        en: The adversary needs public network access and capability to parse pages, links, and navigation artifacts and can control client semantics, request cadence, and access scope. Constraints include victim logs, WAF and CDN correlation, content changes, session identifiers, and the boundary against moving beyond public reading through speculation or submission.
    defender_model:
      paragraphs:
      - zh: 防守方拥有 Web、CDN 和 WAF 请求日志、站点链接与导航工件版本以及内容主题，但单次正常浏览具有极高合法率。有效观察需要完整会话、页面主题组合、导航来源、来源历史和后续活动，且应避免把搜索引擎与真实访客误判。
        en: Defenders have web, CDN, and WAF request logs, site link and navigation-artifact versions, and content topics, but individual normal browsing has extremely high legitimate prevalence. Effective observation requires complete sessions, page-topic combinations, navigation provenance, origin history, and downstream activity while avoiding misclassification of search engines and genuine visitors.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 保持合法客户端语义、连贯路径、人工节奏和有限范围，使直接访问接近正常访客会话
    en: Preserve legitimate client semantics, coherent paths, human cadence, and limited scope so direct access resembles a normal visitor session
  analysis:
    paragraphs:
    - zh: 攻击者只访问公开且语义相关的页面，使用常见浏览器特征、自然导航和人工间隔，避免高并发与异常跳转。批量或机械化画像痕迹被正常访问外观替代，单会话规则难以区分恶意与合法访客；防守方必须分析主题组合、来源历史和后续用途。访问意图因此获得特征伪装效果。
      en: The adversary accesses only public, semantically related pages with common browser features, natural navigation, and human intervals while avoiding high concurrency and anomalous transitions. Normal access appearance replaces bulk or mechanical profiling traces, making per-session rules unable to distinguish malicious from legitimate visitors; defenders must analyze topic combinations, origin history, and downstream use. Access intent therefore gains feature disguise.
  evidence_refs: [REF-000030, REF-000045]
  confidence: medium
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 只使用受害者已发布导航工件和路径，以少量确定性成功请求替代猜测、错误和高扇出枚举
    en: Use only victim-published navigation artifacts and paths to replace speculation, errors, and high-fan-out enumeration with a few deterministic successful requests
  analysis:
    paragraphs:
    - zh: 攻击者先读取公开链接图、sitemap 或 robots，再只请求明确出现的路径。大量候选、错误响应和字典序列被少量成功请求替代，基于错误率和路径扇出的检测信号不再出现；防守方必须保留导航来源和访问顺序。猜测式枚举行为因此在目标日志中被公开读取替代并降低可见性。
      en: The adversary first reads public link graphs, sitemaps, or robots artifacts and then requests only explicitly present paths. A few successful requests replace numerous candidates, error responses, and wordlist sequences, removing detection signals based on error rate and path fan-out; defenders must retain navigation provenance and access order. Speculative enumeration is therefore replaced by public reading in victim logs and becomes less observable.
  evidence_refs: [REF-000045]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立正常访客拟态的网站浏览和受害者发布导航工件替代两项匿迹子技术。前者的稳定变量是会话外观与节奏，改变访问的可区分性；后者的稳定变量是路径候选来源，改变请求数量、错误率和枚举序列。
      en: This technique defines Benign-Visitor-Mimetic Web Browsing and Victim-Published Navigation-Artifact Substitution. The former uses session appearance and cadence as its stable variable and changes access distinguishability; the latter uses path-candidate provenance as its stable variable and changes request volume, error rate, and enumeration sequence.
    - zh: 分类不按官网、招聘、文档或支持等网站类别拆分，也不把请求量少本身视为匿迹。猜测式路径验证、第三方查询和表单诱导均分别由 NJT-0001、NJT-0037 和 NJT-0036 承载。
      en: The taxonomy does not partition by corporate, recruiting, documentation, support, or other site categories and does not treat low request count alone as stealth. Speculative path validation, third-party queries, and form elicitation are represented separately by NJT-0001, NJT-0037, and NJT-0036.
  coverage: established
  subtechnique_refs: [NJS-0038-001, NJS-0038-002]
