research:
  limitations:
    paragraphs:
    - zh: 受害者网站访问具有极高合法率，现有事件通常证明目标站点被用于侦查，却不披露足够请求序列确认具体拟态或导航子技术。因此父技术使用案例为高置信度，两个子技术的攻击者意图和实际事件归因保持中等置信度。
      en: Victim-site access has extremely high legitimate prevalence, and incidents usually establish site use for reconnaissance without disclosing enough request sequence to confirm a particular mimicry or navigation child. Parent use cases are high confidence, while adversary intent and incident attribution for both children remain medium confidence.
    - zh: 低速访问、常见 User-Agent 或全部成功请求都可能自然产生，必须同时证明攻击前画像目的和有意控制的会话或导航变量。缓存、代理与住宅来源浏览缺少 T1594 专属因果证据，继续延期。
      en: Low-rate access, common User-Agent values, or all-successful requests can occur naturally, so both pre-compromise profiling purpose and a deliberately controlled session or navigation variable must be established. Cache, proxy, and residential-origin browsing lack T1594-specific causal evidence and remain deferred.
