schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0039-001
parent_ref: NJT-0039
name:
  zh: 威胁暴露触发的可观测特征轮换
  en: Threat-Exposure-Triggered Observable Rotation
summary:
  zh: 在威胁报告或厂商数据暴露可检测指标后快速替换或退役对应文件、基础设施和其他可观测特征。
  en: Rapidly replace or retire files, infrastructure, and other observables after threat reporting or vendor data exposes detectable indicators.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 威胁暴露触发的可观测特征轮换是攻击者获知自身或相关同业的文件、域名、IP、证书、标题、路径或协议特征已被公开、标记或关联后，在短窗口内替换、重塑或退役这些特征并启用后续实体。反馈必须与变化具有可论证时间和谱系联系。
    en: Threat-Exposure-Triggered Observable Rotation occurs when an adversary learns that file, domain, IP, certificate, title, path, or protocol features associated with its own or relevant peer activity have been published, labeled, or linked and replaces, reshapes, or retires those features within a short window while activating follow-on entities. Feedback must have a defensible temporal and lineage relationship to the change.
  - zh: 稳定分类变量是暴露反馈触发对已有可观测项的替换，而不是一般版本更新或资产寿命。实际构建新文件、注册资源或部署基础设施属于后续行为；本子技术描述反馈后的选择与轮换逻辑。
    en: The stable classification variable is replacement of existing observables triggered by exposure feedback rather than routine version updates or asset lifetime. Actual construction of a new file, resource registration, or infrastructure deployment is downstream behavior; this child describes the post-feedback selection and rotation logic.
stealth_characteristics:
  paragraphs:
  - zh: 威胁暴露触发的可观测特征轮换使已进入报告与精确规则的指标快速停止出现，后续活动改用新实体并把同一行动拆成多个短寿命时间片段。目标仍可观察新活动，新旧实体也可能共享代码、证书、托管、行为或目标关系；只有依赖静态 IOC 或短留存时，防守覆盖才最易衰减。
    en: Threat-Exposure-Triggered Observable Rotation causes indicators already present in reports and exact rules to stop appearing quickly while follow-on activity uses new entities and splits one operation into multiple short-lived temporal fragments. The victim can still observe new activity and old and new entities may share code, certificate, hosting, behavior, or targeting relationships; defensive coverage decays most when it relies on static IOCs or short retention.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入威胁报告、厂商标签或平台自查后轮换已暴露原子指标、退役被标记基础设施或重塑可观察特征的决策。旧指标消失和新指标出现必须具有反馈时序与行动谱系支持。
    en: This sub-technique includes decisions after threat reports, vendor labels, or platform self-checking to rotate exposed atomic indicators, retire flagged infrastructure, or reshape visible features. Disappearance of old indicators and appearance of new ones must have feedback timing and operational lineage support.
  - zh: 与威胁反馈无关的例行更新、单个资产自然消失和无法关联的新基础设施排除。部署前筛选候选资源属于 NJS-0039-002，仅读取报告而没有调整只属于父级研究不足以形成子技术。
    en: Routine updates unrelated to threat feedback, natural disappearance of one asset, and unlinked new infrastructure are excluded. Pre-deployment screening of candidate resources belongs to NJS-0039-002, while report reading without adjustment is insufficient to form a child.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者监测到恶意软件哈希、域名、IP、证书、文件名或协议特征进入公开报告和检测后，快速替换构建或基础设施以削弱精确匹配覆盖。
      en: This sub-technique applies when an adversary observes malware hashes, domains, IPs, certificates, filenames, or protocol features entering public reporting and detection and rapidly replaces builds or infrastructure to weaken exact-match coverage.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要及时获知暴露、确认指标与自身关系，并拥有可快速替换的代码或资源。轮换速度、成本、操作连续性和新旧谱系泄露限制效果。
        en: The adversary needs timely exposure awareness, must confirm indicator relevance to its activity, and requires code or resources that can be replaced rapidly. Rotation speed, cost, operational continuity, and leaked lineage between old and new entities constrain effectiveness.
    defender_model:
      paragraphs:
      - zh: 防守方可能看到报告发布时间、旧指标末次出现和新实体首次出现，但没有平台查询日志时反馈只能推断。长期代码、证书、托管、行为和目标谱系能够恢复关联。
        en: Defenders may see report publication, last occurrence of old indicators, and first occurrence of new entities, but feedback is inferential without platform query logs. Long-term code, certificate, hosting, behavioral, and targeting lineage can restore correlation.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 替换已被精确规则识别的文件和基础设施特征，使后续实体不再匹配已知恶意指标
    en: Replace file and infrastructure features recognized by exact rules so follow-on entities stop matching known malicious indicators
  analysis:
    paragraphs:
    - zh: 攻击者根据暴露反馈重塑哈希、名称、域、IP、标题、路径或其他特征。已知恶意特征从后续活动中消失，新实体在精确匹配层面接近未知或普通资源；静态规则失去覆盖，防守必须依赖行为与谱系。轮换因此产生主要特征伪装效果。
      en: The adversary reshapes hashes, names, domains, IPs, titles, paths, or other features based on exposure feedback. Known malicious features disappear from follow-on activity and new entities appear unknown or ordinary at the exact-match layer; static rules lose coverage and defense must rely on behavior and lineage. Rotation therefore produces a primary feature-disguise effect.
  evidence_refs: [REF-000053, REF-000054]
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 在短窗口切换新旧指标，把同一行动分散为跨时间的短寿命谱系片段
    en: Switch old and new indicators within a short window to disperse one operation into short-lived lineage fragments across time
  analysis:
    paragraphs:
    - zh: 攻击者在暴露后快速停止旧指标并启用相关新实体，使单个标识只覆盖行动的一段时间。短留存或按 IOC 分割的记录无法看到连续行动，必须跨更长时间关联多维谱系；整体活动因此被分散为时间片段并提高重构成本。
      en: The adversary stops old indicators rapidly after exposure and activates related new entities so each identifier covers only one period of the operation. Short retention or IOC-partitioned records cannot see continuity and require longer correlation across multidimensional lineage; the complete activity is therefore dispersed into temporal fragments and costs more to reconstruct.
  evidence_refs: [REF-000053, REF-000054]
  confidence: medium
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000040]
  mitigations:
    coverage: available
    mitigation_refs: [MIT-000039]
evidence:
  claim_refs: [CLM-000151, CLM-000152]
  case_refs: [CASE-000037, CASE-000038]
  reference_refs: [REF-000048, REF-000053, REF-000054, REF-000055]
research:
  limitations:
    paragraphs:
    - zh: UNC3886 案例直接支持披露后快速指标替换，但没有观察到具体报告访问；Contagious Interview 案例直接支持平台自查，却只观察到零散调整。因此轮换行为为高置信度，反馈来源与每次轮换效果仍需按证据分别校准。
      en: The UNC3886 case directly supports rapid indicator replacement after disclosure but does not observe access to a particular report; the Contagious Interview case directly supports platform self-checking but observes only sporadic adaptation. Rotation behavior is high confidence, while feedback source and effectiveness of each rotation require separate calibration.
