research:
  limitations:
    paragraphs:
    - zh: Validin 平台日志直接支持候选域名声誉查询和部署前后自查，但报告指出反馈调整有限，不能假定所有未标恶资源均因门控而被选择或能够持续规避。新合法资源也天然缺少历史声誉。
      en: Validin platform logs directly support candidate-domain reputation queries and checks around deployment, but reporting describes limited adaptation and does not justify assuming every unflagged resource was selected through gating or will remain evasive. New legitimate resources also naturally lack historical reputation.
