schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0039-002
parent_ref: NJT-0039
name:
  zh: 威胁声誉门控的基础设施选择
  en: Threat-Reputation-Gated Infrastructure Selection
summary:
  zh: 在购买、注册或部署候选基础设施前查询其威胁声誉与归因历史，排除已标恶资源并在投入后持续自查。
  en: Query threat reputation and attribution history before purchasing, registering, or deploying candidate infrastructure, reject flagged resources, and continue checking after use.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: 威胁声誉门控的基础设施选择是攻击者在候选域名、IP、证书、托管或其他资源投入行动前，通过威胁情报和声誉平台检查其恶意历史、归因与关联，排除已被标记对象并选择未标恶者，随后在注册、部署和运行阶段继续自查。
    en: Threat-Reputation-Gated Infrastructure Selection occurs when an adversary checks malicious history, attribution, and relationships of candidate domains, IPs, certificates, hosting, or other resources through threat-intelligence and reputation platforms before operational use, rejects flagged objects, selects unflagged ones, and continues checking through registration, deployment, and operation.
  - zh: 稳定分类变量是威胁声誉作为资源进入行动的门控条件，而不是一般价格、性能或可用性检查。实际购买、注册和部署属于后续资源开发；已有实体暴露后轮换属于 NJS-0039-001。
    en: The stable classification variable is use of threat reputation as a gate for operational resource entry rather than ordinary price, performance, or availability checking. Actual purchase, registration, and deployment are downstream resource development, while rotation of an existing entity after exposure belongs to NJS-0039-001.
stealth_characteristics:
  paragraphs:
  - zh: 威胁声誉门控的基础设施选择使投入行动的新资源缺少既往恶意标签或已知 IOC 命中，在早期声誉特征上接近普通新资产。目标方看不到部署前筛查，只能在新资源开始行为后评估；提供方仍可能保留候选查询、账户、设备与部署后复查记录。
    en: Threat-Reputation-Gated Infrastructure Selection causes new resources entering operations to lack prior malicious labels or known-IOC matches and resemble ordinary new assets in early reputation features. Victims cannot see pre-deployment screening and can assess only after behavior begins, while providers may retain candidate queries, accounts, devices, and post-deployment rechecks.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入购买、注册或部署前对候选资源的恶意声誉和归因检查、基于结果筛除已标恶对象，以及运行后确认资源是否被识别。声誉结果必须实际影响资源选择或退役。
    en: This sub-technique includes malicious-reputation and attribution checks of candidate resources before purchase, registration, or deployment, result-based rejection of flagged objects, and post-deployment checks for recognition. Reputation results must actually affect resource selection or retirement.
  - zh: 普通可用性、价格、地理或性能检查排除，为取得受害者资料购买数据属于信息对象分类。已有实体在反馈后替换属于 NJS-0039-001，实际资源取得与部署不在本技术内。
    en: Ordinary availability, price, geography, or performance checks are excluded, and purchasing data to obtain victim information follows the information-object taxonomy. Replacement of an existing entity after feedback belongs to NJS-0039-001, while actual resource acquisition and deployment are outside this technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者在注册域名、租用地址或托管、配置证书和部署内容前检查候选对象是否已关联恶意活动，并在上线后周期性复查以决定继续使用或退役。
      en: This sub-technique applies when an adversary checks whether candidate objects are already associated with malicious activity before registering domains, renting addresses or hosting, configuring certificates, or deploying content and rechecks periodically after launch to decide whether to continue use or retire them.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要多个可替代候选资源、声誉平台访问和把查询结果纳入采购部署决策的能力。资源成本、平台审计、候选稀缺和新资源行为迅速建立恶意声誉会限制效果。
        en: The adversary needs multiple replaceable candidate resources, reputation-platform access, and capability to incorporate results into acquisition and deployment decisions. Resource cost, provider audit, candidate scarcity, and rapid accumulation of malicious reputation after first use constrain effectiveness.
    defender_model:
      paragraphs:
      - zh: 目标防守方通常只看到首次接触时声誉为空的新资源，需要结合注册、托管、证书、内容和行为上下文。平台方可通过候选查询与后续部署关系观察门控过程。
        en: Victim defenders usually see a new resource with empty reputation at first contact and need registration, hosting, certificate, content, and behavioral context. Providers can observe the gating process through relationships between candidate queries and later deployment.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 只让未标恶候选进入行动，使初始基础设施在历史声誉上接近普通新资源
    en: Allow only unflagged candidates into the operation so initial infrastructure resembles ordinary new resources in historical reputation
  analysis:
    paragraphs:
    - zh: 攻击者查询候选资源并拒绝已有恶意标签或归因关系的对象，只部署当前声誉为空或良好的资源。已知声誉命中从实际行动集合中消失，目标早期过滤器把新实体视为未知或普通；防守必须使用注册、托管、内容和首次行为而非历史标签。基础设施因此获得声誉特征伪装。
      en: The adversary queries candidate resources and rejects objects with existing malicious labels or attribution relationships, deploying only resources with currently empty or favorable reputation. Known reputation hits disappear from the operational set and victim early filters treat new entities as unknown or ordinary; defense must use registration, hosting, content, and first behavior rather than historical labels. Infrastructure therefore gains reputation feature disguise.
