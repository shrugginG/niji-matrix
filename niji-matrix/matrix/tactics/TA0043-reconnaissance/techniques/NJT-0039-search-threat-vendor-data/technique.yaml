schema_version: 2.0.0
type: technique
id: NJT-0039
name:
  zh: 搜索威胁厂商数据
  en: Search Threat Vendor Data
summary:
  zh: 检索关于自身或相关同业的暴露、检测、归因和威胁声誉，并把反馈用于轮换可观测特征或门控候选资源。
  en: Search exposure, detection, attribution, and threat reputation concerning the actor or relevant peers and use the feedback to rotate observables or gate candidate resources.
aliases: [Adversary Exposure Reconnaissance]
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-retained
    source_attack_id: T1681
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1681
definition_and_concept:
  paragraphs:
  - zh: 搜索威胁厂商数据是攻击者检索开放或封闭威胁情报、厂商平台、IOC 与声誉数据库和公开研究，以了解自身或相关同业行动、基础设施、恶意软件、指标、检测覆盖与归因状态，并把反馈用于规划后续行为的侦查技术。技术要求形成“反馈获取—暴露判断—行动调整”闭环。
    en: Search Threat Vendor Data is reconnaissance in which an adversary searches open or closed threat intelligence, vendor platforms, IOC and reputation databases, and public research to learn the exposure, detection coverage, attribution, and reputation of its own or relevant peer operations, infrastructure, malware, and indicators and uses the feedback to plan subsequent behavior. The technique requires a feedback-acquisition, exposure-assessment, and operational-adjustment loop.
  - zh: 本技术的概念锚点是攻击者自身或同业暴露反馈，而不是来源开放性、厂商名称或 IOC 类型。同一平台用于获取受害者资料时按所得主机、身份、网络或组织信息对象分类；实际购买、注册、部署基础设施或修改恶意软件属于后续资源与执行行为。
    en: The conceptual anchor is feedback about actor or peer exposure rather than source openness, vendor name, or IOC type. Use of the same platform to obtain victim data is classified by the resulting host, identity, network, or organizational information object, while actual purchase, registration, or deployment of infrastructure or modification of malware is downstream resource or execution behavior.
stealth_characteristics:
  paragraphs:
  - zh: 搜索威胁厂商数据使攻击者在目标组织视野之外获知哪些特征已进入公开报告、厂商标签或归因分析，再以新哈希、域名、IP、标题、路径或未标恶资源替换旧特征。目标方可能只看到已知指标突然消失和新实体出现，无法从自身日志确认反馈来源和决策时点。
    en: Search Threat Vendor Data lets an adversary learn outside victim visibility which features have entered public reports, vendor labels, or attribution analysis and replace old features with new hashes, domains, IPs, titles, paths, or unflagged resources. The victim may see only known indicators disappear and new entities appear and cannot establish the feedback source or decision time from local logs.
  - zh: 痕迹并未消失：威胁平台可能保留账户、查询、设备、声誉结果和导航日志，新旧实体也可能共享代码、证书、注册、托管、行为或目标谱系。轮换速度、资源隔离和提供方数据共享决定匿迹强度；公开案例还表明反馈后的调整可能零散且并非每次都成功。
    en: Traces do not disappear because threat platforms may retain accounts, queries, devices, reputation results, and navigation logs, while old and new entities may share code, certificate, registration, hosting, behavioral, or targeting lineage. Rotation speed, resource separation, and provider data sharing determine stealth strength, and public cases show that post-feedback adaptation may be sporadic and not always successful.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入关于攻击者自身或相关同业基础设施、恶意软件、指标、检测或归因的查询，以及查询或公开披露后用于轮换已暴露特征、退役资源、筛除已标恶候选或持续自查部署资源的决策。仅阅读报告而没有可论证的暴露评估与调整不纳入。
    en: This technique includes queries concerning the adversary's own or relevant peers' infrastructure, malware, indicators, detection, or attribution and decisions after a query or public disclosure to rotate exposed features, retire resources, reject flagged candidates, or continue checking deployed resources. Reading reporting without a defensible exposure assessment and adjustment is excluded.
  - zh: 为取得受害者人员、组织、主机或网络数据而搜索威胁来源分别属于 NJT-0033、NJT-0035、NJT-0032 或 NJT-0034；一般学习规避知识但没有自身或同业反馈闭环也不属于本技术。实际资源取得和能力修改需由相应 Resource Development 或后续技术表达。
    en: Searching threat sources to obtain victim people, organization, host, or network data belongs respectively to NJT-0033, NJT-0035, NJT-0032, or NJT-0034, and general learning about evasion without a self- or peer-feedback loop is outside this technique. Actual resource acquisition and capability modification require the corresponding Resource Development or downstream technique.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者在行动前后查询自身域名、IP、证书、文件哈希、恶意软件名称和公开归因，检查候选资源是否已有恶意声誉，并在报告发布或平台标记后快速替换现有特征。它常发生于威胁情报门户、基础设施情报、IOC 仓库和声誉服务。
      en: This technique applies when an adversary checks its own domains, IPs, certificates, file hashes, malware names, and public attribution before or during operations, determines whether candidate resources already have malicious reputation, and rapidly replaces existing features after reports or platform labeling. It commonly occurs in threat-intelligence portals, infrastructure intelligence, IOC repositories, and reputation services.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要访问威胁平台或公开研究，能够识别与自身或相关同业的关系，并拥有可替换特征或候选资源。成熟主体可以维持查询账户和快速轮换流程，但受平台审计、查询归因、资源成本、报告时延和新旧实体谱系限制。
        en: The adversary needs access to threat platforms or public research, can recognize relationships to its own or relevant peer activity, and has replaceable features or candidate resources. A mature actor may maintain query accounts and rapid rotation workflows but is constrained by platform audit, query attribution, resource cost, reporting delay, and lineage between old and new entities.
    defender_model:
      paragraphs:
      - zh: 目标组织通常只能观察报告发布、旧指标消失、新实体出现和后续行为，提供方则可能看到查询账户、条件与声誉结果。可靠检测需要平台协作和跨时间谱系；单个研究查询、指标消失或新资源缺少声誉均不足以证明恶意反馈闭环。
        en: Victim organizations usually observe only report publication, disappearance of old indicators, appearance of new entities, and downstream behavior, while providers may see querying accounts, terms, and reputation results. Reliable detection requires provider cooperation and longitudinal lineage; one research query, indicator disappearance, or absence of reputation on a new resource is insufficient to prove a malicious feedback loop.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary:
    zh: 根据威胁反馈替换已知恶意特征或选择无恶意历史资源，使当前实体不再匹配静态指标和声誉标签
    en: Replace known malicious features or select resources without malicious history from threat feedback so current entities stop matching static indicators and reputation labels
  analysis:
    paragraphs:
    - zh: 攻击者根据报告或平台结果替换被识别的文件与基础设施特征，或在部署前拒绝已有恶意声誉的候选资源。已知恶意哈希、域名、IP、标题或标签从后续活动消失，当前实体在精确特征与历史声誉上更接近普通新资源；依赖静态匹配的防守覆盖快速衰减，必须改用行为和谱系关系。当前活动因此获得特征伪装效果。
      en: The adversary uses report or platform results to replace recognized file and infrastructure features or reject candidate resources with existing malicious reputation before deployment. Known malicious hashes, domains, IPs, titles, or labels disappear from subsequent activity, making current entities resemble ordinary new resources in exact features and historical reputation; defenses relying on static matches decay rapidly and must use behavior and lineage. Current activity therefore gains feature disguise.
  evidence_refs: [REF-000048, REF-000053, REF-000054]
  confidence: high
- mechanism_ref: NM-BT
  role: secondary
  summary:
    zh: 将防守暴露查询放在威胁情报提供方，使目标无法直接观察攻击者获知了哪些检测与归因信息
    en: Place defensive-exposure queries at threat-intelligence providers so victims cannot directly observe which detection and attribution information the adversary learned
  analysis:
    paragraphs:
    - zh: 攻击者通过威胁平台查询自身或同业指标和归因，而不与目标组织交互。实际反馈获取痕迹留在提供方账户、查询和导航日志中，目标只看到后续行为变化，无法从本地遥测知道攻击者何时获知哪些信息；防守必须依赖平台共享或时间反推。反馈获取因此降低受害方直接可观察性，但并非服务商不可见。
      en: The adversary queries its own or peer indicators and attribution through threat platforms without interacting with the victim organization. Actual feedback-acquisition traces remain in provider account, query, and navigation logs, while the victim sees only later behavioral change and cannot know locally when or what the adversary learned; defense depends on provider sharing or temporal inference. Feedback acquisition therefore reduces direct victim observability but is not invisible to the provider.
  evidence_refs: [REF-000048, REF-000054, REF-000055]
  confidence: high
- mechanism_ref: NM-ST
  role: secondary
  summary:
    zh: 快速轮换把同一行动拆成跨时间的新旧短寿命指标片段，提高长期谱系恢复成本
    en: Rapid rotation splits one operation into old and new short-lived indicator fragments across time and raises long-term lineage-reconstruction cost
  analysis:
    paragraphs:
    - zh: 报告或标记出现后，攻击者在短窗口退役旧指标并启用相关新实体。同一行动不再持续呈现一个稳定标识，而形成多个时间分离片段；短留存和只按单个 IOC 聚合的防守方难以连接它们，需要长期代码、基础设施、行为和目标关系。轮换因而产生次要时空释痕效果。
      en: After reporting or labeling, the adversary retires old indicators and activates related new entities within a short window. One operation no longer presents a stable identifier and instead forms temporally separated fragments; defenders with short retention or single-IOC aggregation cannot connect them without long-term code, infrastructure, behavior, and targeting relationships. Rotation therefore creates a secondary spatiotemporal trace-dilution effect.
  evidence_refs: [REF-000053, REF-000054]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立威胁暴露触发的可观测特征轮换和威胁声誉门控的基础设施选择两项匿迹子技术。前者在已有实体被公开或标记后替换特征，改变跨时间指标连续性；后者在资源投入前依据历史声誉筛除候选，改变进入行动的实体集合。
      en: This technique defines Threat-Exposure-Triggered Observable Rotation and Threat-Reputation-Gated Infrastructure Selection. The former replaces features after an existing entity is published or labeled and changes indicator continuity across time; the latter rejects candidates by historical reputation before use and changes the set of entities entering the operation.
    - zh: 两项子技术可以通过持续自查相连，但反馈时点和防守观察不同。分类不按厂商、开放或封闭来源、恶意软件与基础设施类型或 IOC 字段拆分，也不把没有后续调整的报告阅读写成子技术。
      en: The two children can connect through continuing self-checking but differ in feedback timing and defender observation. The taxonomy does not partition by vendor, open or closed source, malware versus infrastructure, or IOC field and does not treat report reading without subsequent adjustment as a child.
  coverage: established
  subtechnique_refs: [NJS-0039-001, NJS-0039-002]
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000040]
  mitigations:
    coverage: available
    mitigation_refs: [MIT-000039]
evidence:
  claim_refs: [CLM-000150, CLM-000151, CLM-000152, CLM-000153, CLM-000154]
  case_refs: [CASE-000037, CASE-000038]
  reference_refs: [REF-000020, REF-000021, REF-000022, REF-000023, REF-000047, REF-000048, REF-000053, REF-000054, REF-000055]
research:
  limitations:
    paragraphs:
    - zh: 平台日志能够直接证明自查和候选声誉查询，但反馈后的调整不一定发生或成功；披露后指标变化也可能来自防守处置、自然基础设施寿命或例行版本更新。只有查询、报告、变化和谱系共同一致时，才能强化反馈闭环结论。
      en: Platform logs can directly establish self-checking and candidate-reputation queries, but post-feedback adaptation may not occur or succeed; indicator change after disclosure can also result from defensive remediation, natural infrastructure lifetime, or routine version updates. The feedback-loop conclusion strengthens only when query, report, change, and lineage align.
    - zh: 攻击者实际修改恶意软件、购买域名或部署基础设施发生在本技术之外，公开资料也不总能区分决策与执行。多平台查询释痕和账户隔离具有合理假设，但缺少证明其专门用于 T1681 匿迹的直接事件证据，继续延期。
      en: Actual malware modification, domain purchase, or infrastructure deployment occurs outside this technique, and public reporting does not always separate decision from execution. Multi-platform query dilution and account compartmentation remain plausible but deferred because direct event evidence does not establish their deliberate use for T1681 stealth.
