schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0040-001
parent_ref: NJT-0040
name:
  zh: AI 中介的目标外查询替代
  en: AI-Mediated Off-Victim Query Substitution
summary:
  zh: 让公共 AI 以模型知识、索引或服务商检索实质综合公开来源，替代攻击者直接目标访问与逐源查询。
  en: Have public AI materially synthesize public sources through model knowledge, indexes, or provider retrieval, substituting for adversary direct victim access and source-by-source queries.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
  - zh: AI 中介的目标外查询替代是攻击者把目标研究、跨源实体关联和综合委托给公共 AI，让模型通过知识、索引或服务商检索产生新的可操作输出，并直接消费结果，从而减少自身访问目标和多个原始来源的次数。
    en: AI-Mediated Off-Victim Query Substitution occurs when an adversary delegates target research, cross-source entity linking, and synthesis to public AI, has the model produce new actionable output through knowledge, indexes, or provider retrieval, and consumes the result directly, thereby reducing its own visits to the victim and multiple original sources.
  - zh: 稳定分类变量是公共 AI 的实质语义中介造成实际查询替代，而不是使用自然语言提示、模型品牌或简单链接返回。若攻击者仍逐一访问链接和来源，相关访问属于原本的开放内容、受害者网站或数据库技术。
    en: The stable classification variable is actual query substitution caused by material semantic mediation from public AI rather than natural-language prompting, model brand, or simple link return. If the adversary still visits links and sources individually, those accesses belong to the original open-content, victim-site, or database techniques.
stealth_characteristics:
  paragraphs:
  - zh: AI 中介的目标外查询替代把多个实际消费者来源访问和本地拼接事件转化为较少的 AI 账户提示、响应与可能的服务商工具调用。目标方无法从自身日志看到真实查询者，实时检索时也通常只看到服务商出口；平台仍可通过账户、会话、目标实体和工具序列关联完整活动。
    en: AI-Mediated Off-Victim Query Substitution converts multiple actual-consumer source visits and local assembly events into fewer AI-account prompts, responses, and possible provider tool calls. Victims cannot see the real querier in their logs and usually see only provider egress during live retrieval, while the platform can still correlate the complete activity through account, session, target-entity, and tool sequences.
  - zh: 残余痕迹包括目标化提示、跨会话实体补齐、名单扩展、响应中的稀有属性、检索目的地和后续定向使用。模型错误或资料陈旧可能迫使攻击者核验，从而削弱替代；无日志服务和严格隔离账户则降低服务商关联能力。
    en: Residual traces include targeted prompts, cross-session entity completion, list expansion, rare output attributes, retrieval destinations, and downstream targeted use. Model errors or stale material may force verification and weaken substitution, while no-log services and strictly separated accounts reduce provider correlation.
scope_boundary_definition:
  paragraphs:
  - zh: 本子技术纳入公共 AI 通过模型知识、索引或服务商检索对多个公开来源进行实质综合、推理或实体关联，生成攻击者可直接使用的目标信息，并实际替代至少一部分直接目标或逐源访问的行为。
    en: This sub-technique includes public AI using model knowledge, indexes, or provider retrieval to materially synthesize, infer, or link entities across multiple public sources, generating target information the adversary can use directly and actually replacing at least part of direct victim or source-by-source access.
  - zh: 仅总结用户已经提供的材料、通用写作与编码帮助、返回链接后人工逐一访问、本地或私有模型和直接向人员发送 AI 生成话术均排除。输出信息类别和模型供应商不构成子技术边界。
    en: Merely summarizing material already supplied by the user, generic writing or coding assistance, manually visiting returned links one by one, local or private models, and directly sending AI-generated pretexts to people are excluded. Output information category and model provider do not define child boundaries.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本子技术适用于攻击者让公共 AI 构建高价值人员与邮箱列表、汇总组织和商业伙伴、识别目标技术与公开漏洞或按攻击面优先级排序，而不直接遍历每个网站和数据库。
      en: This sub-technique applies when an adversary has public AI build lists of high-value people and email addresses, summarize organizations and business partners, identify victim technologies and public vulnerabilities, or prioritize attack surfaces without directly traversing every website and database.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要公共 AI 访问、足够上下文和直接使用输出的能力，模型或服务商必须拥有相关知识、索引或检索工具。平台限制、输出错误、引用缺失和高风险事实核验需求会削弱替代。
        en: The adversary needs public-AI access, sufficient context, and capability to use output directly, while the model or provider must possess relevant knowledge, indexes, or retrieval tools. Platform limits, output errors, missing citations, and the need to verify high-risk facts weaken substitution.
    defender_model:
      paragraphs:
      - zh: 受害方可能只看到服务商出口或后续使用，服务商则可能看到完整提示、响应和工具调用。检测需要服务商内部账户与目标实体关联，并以政策、授权和后续活动排除合法深度研究。
        en: Victims may see only provider egress or downstream use, while providers may see complete prompts, responses, and tool calls. Detection requires provider-internal correlation of accounts and target entities and exclusion of legitimate deep research through policy, authorization, and downstream activity.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以服务商侧提示和检索替代实际消费者的多源访问，使受害者看不到真实查询身份和完整目标选择
    en: Substitute provider-side prompts and retrieval for the actual consumer's multisource visits so victims cannot see the real querying identity or complete target selection
  analysis:
    paragraphs:
    - zh: 攻击者要求公共 AI 对目标进行跨源综合并直接采用输出，服务商的模型与工具代替其访问多个来源。多个消费者侧事件变成较少的平台交互和可能的服务商出口，目标无法识别真实查询者，完整目标图只在服务商与攻击者上下文形成；检测视角迁移到平台。由此，受害方观察面上的采集行为趋于透明。
      en: The adversary asks public AI to synthesize a target across sources and uses the output directly, causing provider models and tools to replace its visits to multiple sources. Multiple consumer-side events become fewer platform interactions and possible provider egress, preventing victims from identifying the real querier and leaving the complete target graph only in provider and adversary context; detection moves to the platform. Collection is therefore close to transparent at the victim vantage point.
