research:
  limitations:
    paragraphs:
    - zh: 公开案例证明威胁主体通过公共 AI 进行目标研究，却很少直接记录攻击者原本会访问多少来源，因此“实际替代”需要结合工具调用和后续行为验证并保持中等置信度。不同服务的日志政策也不能由单一平台文档泛化。
      en: Public cases establish threat-actor target research through public AI but rarely record how many sources the adversary would otherwise have visited, so actual substitution requires tool-invocation and downstream validation and remains medium confidence. Logging policies across services also cannot be generalized from one platform's documentation.
    - zh: 模型虚构、信息完整性和自动化偏见可能产生错误画像，攻击者直接核验会重新暴露来源访问。提示伪装、匿名账户和跨服务分散仍因缺少直接 T1682 匿迹证据而延期。
      en: Confabulation, information-integrity problems, and automation bias may create incorrect profiles, while direct verification recreates source-access exposure. Prompt disguise, anonymous accounts, and cross-service distribution remain deferred for lack of direct T1682 stealth evidence.
