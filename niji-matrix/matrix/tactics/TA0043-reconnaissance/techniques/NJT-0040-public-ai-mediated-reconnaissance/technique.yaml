  claim_refs: [CLM-000155, CLM-000156, CLM-000157, CLM-000158]
  case_refs: [CASE-000039, CASE-000040]
  reference_refs: [REF-000041, REF-000043, REF-000049, REF-000056, REF-000057]
research:
  limitations:
    paragraphs:
    - zh: 公开威胁报告证明恶意主体使用公共 AI 开展目标研究并证明服务商能够检测和处置账户，但通常不能量化原始来源访问减少多少，也不总披露完整提示、响应与工具调用。因此父行为为高置信度，查询替代因果与具体痕迹拓扑保持中等置信度。
      en: Public threat reporting establishes malicious use of public AI for target research and provider ability to detect and enforce against accounts but usually cannot quantify reduction in original-source access and does not always disclose complete prompts, responses, and tool calls. Confidence is high in the parent behavior and medium in the query-substitution causal chain and specific trace topology.
    - zh: 生成式 AI 输出可能虚构、过时或受自动化偏见影响，攻击者若必须直接核验关键事实便重新产生来源访问痕迹。不同服务的数据保留和工具架构不可互相泛化，REF-000056 只证明一种服务实现而非行业统一状态。
      en: Generative-AI output may be confabulated, stale, or affected by automation bias, and direct verification of critical facts recreates source-access traces. Data retention and tool architecture differ across services and cannot be generalized; REF-000056 establishes one service implementation rather than an industry-wide state.
