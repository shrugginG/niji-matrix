schema_version: 2.0.0
type: technique
id: NJT-0040
name:
  zh: 公共 AI 中介侦查
  en: Public-AI-Mediated Reconnaissance
summary:
  zh: 查询目标组织之外的公共 AI 服务，由模型或其工具实质综合、推理、转换或生成公开信息，并以服务商中介替代直接或逐源查询。
  en: Query a public AI service outside victim control so the model or its tools materially synthesize, infer, transform, or generate over public information and substitute provider mediation for direct or source-by-source queries.
aliases: [Query Public AI Services]
classification:
  tactic_refs: [TA0043]
  origin:
    kind: attack-adapted
    source_attack_id: T1682
    source_attack_version: '19.1'
  decision_ref: DEC-TA0043-T1682
definition_and_concept:
  paragraphs:
  - zh: 公共 AI 中介侦查是攻击者在入侵前查询位于目标组织控制范围之外且公众可访问的 AI 服务，由模型知识、索引或服务商检索工具对公开材料进行实质聚合、跨源综合、实体关联、推理、翻译转换或目标信息生成，并把新输出用于人员、组织、技术、关系和攻击面研究。
    en: Public-AI-Mediated Reconnaissance is pre-compromise reconnaissance in which an adversary queries a publicly accessible AI service outside victim control and uses model knowledge, indexes, or provider retrieval tools to materially aggregate, synthesize across sources, link entities, infer, translate, transform, or generate target information for research on people, organizations, technologies, relationships, and attack surfaces.
  - zh: 本技术适配 ATT&CK 父语义，要求 AI 产生实质语义贡献并实际替代攻击者直接目标访问或逐源查询；仅把 AI 当作通用写作、编码或效率工具不纳入。输出信息对象仍可同时由 NJT-0032 至 NJT-0035 表达，而本技术描述 AI 中介改变的痕迹拓扑。
    en: This technique adapts the ATT&CK parent semantics by requiring a material semantic contribution from AI and actual substitution for adversary direct victim access or source-by-source queries; generic use of AI for writing, coding, or productivity is excluded. Output information objects may still be represented by NJT-0032 through NJT-0035, while this technique describes trace topology changed by AI mediation.
stealth_characteristics:
  paragraphs:
  - zh: 公共 AI 中介侦查可以把多个攻击者发起的原始来源访问和本地拼接步骤压缩为较少的服务商侧提示、响应与工具调用。受害者或原始内容提供方可能看不到实际消费者，只看到公共 AI 服务商的检索出口或完全没有当前访问；攻击者的查询身份和目标选择痕迹集中迁移到 AI 平台。
    en: Public-AI-Mediated Reconnaissance can compress multiple adversary-originated original-source visits and local assembly steps into fewer provider-side prompts, responses, and tool invocations. Victims or original content providers may not see the actual consumer and may see only public-AI provider retrieval egress or no current access at all; traces of querying identity and target selection concentrate at the AI platform.
  - zh: 中介并不意味着不可检测。服务商可能保留账户、会话、提示、响应、分类器和工具调用，实时检索也会在原始来源留下服务商出口痕迹；严格数据控制、无日志服务或本地模型会改变观察条件。模型虚构、信息陈旧与自动化偏见还可能降低攻击者输出可靠性并迫使直接验证。
    en: Mediation does not mean undetectability. Providers may retain accounts, sessions, prompts, responses, classifiers, and tool invocations, and live retrieval can leave provider-egress traces at original sources; strict data controls, no-log services, or local models change the observation model. Confabulation, stale information, and automation bias can also reduce output reliability and force direct validation.
scope_boundary_definition:
  paragraphs:
  - zh: 本技术纳入公众可访问 AI 或 LLM 服务对公开资料执行实质综合、实体关联、推理、转换或生成，并用模型知识、索引或服务商检索替代攻击者直接访问目标或多个原始来源的行为。输出必须用于攻击前目标选择、画像、技术识别、关系研究或社会工程准备。
    en: This technique includes publicly accessible AI or LLM services materially synthesizing, linking entities, inferring, transforming, or generating over public material and using model knowledge, indexes, or provider retrieval to replace adversary direct victim access or multiple original-source visits. Output must support pre-compromise target selection, profiling, technology identification, relationship research, or social-engineering preparation.
  - zh: 只返回链接后由攻击者直接访问时，访问按 NJT-0037、NJT-0038 或相应信息来源技术分类；直接发送 AI 生成话术诱导人员披露属于 NJT-0036。本地、自托管或攻击者私有模型、AI 账户或凭据取得、非公开或入侵后数据处理均排除。
    en: When a service merely returns links followed by direct adversary access, that access is classified under NJT-0037, NJT-0038, or the corresponding source technique; direct delivery of AI-generated pretexts to elicit disclosure belongs to NJT-0036. Local, self-hosted, or adversary-private models, acquisition of AI accounts or credentials, and processing of non-public or post-compromise data are excluded.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 本技术适用于攻击者让公共 AI 汇总组织结构和商业伙伴、补齐高价值人员与官方邮箱、识别目标技术和公开漏洞、建立关系图或生成侦查摘要，从而减少直接浏览多个网站和数据库的需要并准备后续定向活动。
      en: This technique applies when an adversary has public AI summarize organizational structure and business partners, complete lists of high-value people and official email addresses, identify victim technologies and public vulnerabilities, build relationship graphs, or generate reconnaissance summaries, reducing the need to browse multiple websites and databases directly and preparing later targeted activity.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要公共 AI 的聊天、API、搜索或检索功能以及可直接使用综合输出的能力。模型知识覆盖、实时工具访问、账户限制、平台检测、提示与输出保留、错误回答和必须核验高风险事实都会约束效果。
        en: The adversary needs chat, API, search, or retrieval functionality from a public AI service and the ability to use synthesized output directly. Model knowledge coverage, live tool access, account limits, platform detection, prompt and output retention, erroneous answers, and the need to verify high-risk facts constrain effectiveness.
    defender_model:
      paragraphs:
      - zh: 受害方通常没有实际消费者提示与查询日志，只能看到服务商出口或后续定向使用；AI 服务商则可能拥有集中账户、会话、内容、分类器和工具调用视角。检测需要平台内部关联与可信共享，并必须区分合法研究、招聘、新闻、合规和安全分析。
        en: Victims generally lack actual-consumer prompt and query logs and see only provider egress or downstream targeted use, while AI providers may have a concentrated account, session, content, classifier, and tool-invocation vantage. Detection requires provider-internal correlation and trusted sharing and must distinguish legitimate research, recruiting, journalism, compliance, and security analysis.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary:
    zh: 以公共 AI 的模型知识、索引和检索工具替代直接或逐源查询，使实际消费者痕迹迁移到服务商上下文
    en: Substitute public-AI model knowledge, indexes, and retrieval tools for direct or source-by-source queries so actual-consumer traces move into provider context
  analysis:
    paragraphs:
    - zh: 攻击者把目标研究和跨源综合委托给公共 AI，并直接消费模型新生成的可操作输出。多个攻击者侧来源访问与本地拼接被较少的提示、响应和可能的服务商检索替代，目标和原始来源无法从自身日志识别实际消费者；服务商则集中观察账户与交互。受害方直接可见性因此下降，但检测能力从目标侧迁移而非消失。
      en: The adversary delegates target research and cross-source synthesis to public AI and directly consumes newly generated actionable output. Fewer prompts, responses, and possible provider retrievals replace multiple adversary-side source visits and local assembly steps, preventing victims and original sources from identifying the actual consumer in their logs while concentrating account and interaction visibility at the provider. Direct victim visibility therefore declines, but detection capability moves rather than disappears.
  evidence_refs: [REF-000041, REF-000043, REF-000049, REF-000056]
  confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术建立一项 AI 中介的目标外查询替代子技术，其稳定变量是公共 AI 产生新综合或推断输出，并实际减少攻击者对目标或原始来源的访问。模型知识直接回答与服务商实时检索会留下不同残余痕迹，但都属于同一中介替代变量，不据此强拆兄弟项。
      en: This technique defines one child, AI-Mediated Off-Victim Query Substitution, whose stable variable is public AI producing new synthesized or inferred output while actually reducing adversary access to victims or original sources. Direct answers from model knowledge and live provider retrieval leave different residual traces but instantiate the same mediation-substitution variable and are not forced into sibling children.
    - zh: 提示词语义伪装、匿名或假名账户、多账户或多服务分散和本地私有模型均未进入正式分类：前几项缺少直接证据证明被用于 T1682 匿迹，最后一项没有公共服务商观察面且超出 ATT&CK 父范围。
      en: Prompt-semantic disguise, anonymous or pseudonymous accounts, multi-account or multi-service distribution, and local private models are not formal children because the first group lacks direct evidence of deliberate T1682 stealth use, while the last lacks a public-provider vantage and falls outside the ATT&CK parent scope.
  coverage: established
  subtechnique_refs: [NJS-0040-001]
defense:
  detections:
    coverage: available
