schema_version: "1.1.0"
type: technique-decision
id: DEC-TA0112-T1112
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1112, source_attack_version: "19.1", name_en: Modify Registry, name_zh: 修改注册表}
decision: adapt
rationale_zh: ATT&CK T1112 同时覆盖 Registry 驻留、执行、持久化、权限和防御削弱，直接保留会复制 TA0003 的 NJT-0094 并把介质误当作结果。Booz Allen 对乌克兰攻击相关 BlackEnergy 3 样本的静态/动态分析直接记录 Internet/IE 安全值被写低并连接 rundll32 与后继 C2；Microsoft 的 4657、Sysmon 与篡改保护文档则证明写入、消费者有效值和被阻断结果必须分层。TA0112 因此采用 adapt，只保留本地 Registry 防御设置被攻击者写入、真实消费者采用且有效预防、检测、审计或响应能力下降的分支。
rationale_en: ATT&CK T1112 spans Registry-resident payloads, execution, persistence, authority, and defensive impairment. Retaining it unchanged would duplicate TA0003 NJT-0094 and confuse the medium with the outcome. Booz Allen static and dynamic analysis of BlackEnergy 3 samples associated with the Ukraine attack directly records reduced Internet and Internet Explorer security values joined to rundll32 and later C2. Microsoft event 4657, Sysmon, and tamper-protection documentation establish that write, consumer effective value, and blocked outcome must remain separate. TA0112 therefore adapts the candidate to local Registry defensive settings written by an adversary, adopted by a real consumer, and causing effective prevention, detection, audit, or response decline.
scope_notes_zh: 驻留载荷、隐藏键和跨 API 视图差归 NJT-0094；域或租户权威版本的中心扇出归 NJT-0125；具体工具最终损伤可并记 NJT-0123。Registry 键类别、产品和 hive 不是 NJS。只有 mutation—consumer—effective outcome 闭合时确认成功；篡改保护或集中策略覆盖本地值时保留 blocked 结果。
scope_notes_en: Resident payloads, hidden keys, and cross-API view differences belong to NJT-0094. Central fan-out of an authoritative domain or tenant version belongs to NJT-0125. Concrete final tool damage may also map to NJT-0123. Registry key category, product, and hive do not define NJS. Success requires a closed mutation-to-consumer-to-effective-outcome chain, while tamper protection or central policy overriding a local value remains a blocked result.
gap_statement_zh: 现有 Registry 持久化与集中策略对象不能独立表达本地安全设置由普通 Registry 消费路径造成真实防御下降的 writer—consumer 因果链。
gap_statement_en: Existing Registry persistence and central-policy objects do not independently express the writer-to-consumer causal chain in which an ordinary local Registry consumption path produces real defensive decline.
