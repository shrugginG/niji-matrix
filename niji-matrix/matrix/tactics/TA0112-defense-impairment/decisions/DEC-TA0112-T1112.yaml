review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: BlackEnergy 样本链不外推为现代产品普遍结果；零 NJS 为介质、证据和既有 owner 边界裁决。, review_notes_en: "The BlackEnergy sample chain is not generalized to every modern product; zero NJS follows medium, evidence, and existing-owner boundaries."}
