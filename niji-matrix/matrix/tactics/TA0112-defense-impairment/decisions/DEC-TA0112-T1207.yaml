review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 零子项来自注册—复制—结果窄闭环；失活注册复用等待直接案例，不能以 ATT&CK 父页单句建立 NJS。, review_notes_en: The zero-child result follows from the narrow registration-to-replication-to-outcome closure; inactive-registration reuse awaits a direct case and cannot become an NJS from one parent-page statement.}
