id: DEC-TA0112-T1207
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1207, source_attack_version: "19.1", name_en: Rogue Domain Controller, name_zh: 伪造域控制器}
decision: adapt
rationale_zh: 固定 T1207 直接支持攻击者把未批准主机注册或呈现为域控制器，并使用正常目录复制协议将恶意变化注入合法 DC。Niji 把直接对象改写为“目录复制来源错位”：必须闭合未批准 controller identity、DRS 事务、合法 DC 接受和目录对象结果，匿迹收益来自写入来源被置换为受信复制身份以及正常来源日志缺失，而不是工具、设备类型或任意 AD 修改。
rationale_en: "Fixed T1207 directly supports an adversary registering or presenting an unapproved host as a domain controller and using normal directory-replication protocols to inject malicious changes into legitimate DCs. Niji rewrites the direct object as directory-replication origin displacement: an unapproved controller identity, DRS transaction, legitimate-DC acceptance, and directory-object outcome must close, and stealth comes from replacing the write origin with a trusted replication identity and losing the normal source log rather than from a tool, device type, or arbitrary AD modification."
scope_notes_zh: 正常 DC promotion/demotion、灾备恢复和站点迁移按批准 inventory、工单和生命周期排除。DCSync 从合法 DC 拉取秘密属于 Credential Access；策略、账户、ACL、信任或凭据内容结果由对应对象负责；复制元数据事后删除归 NJT-0112。新建注册、DRS push 和撤销是一个完成链，不拆为 NJS；失活注册复用证据不足，暂 defer。
scope_notes_en: Approved inventory, tickets, and lifecycle exclude normal DC promotion or demotion, disaster recovery, and site migration. DCSync retrieval from a legitimate DC belongs to Credential Access. Policy, account, ACL, trust, or credential-content outcomes have their respective owners, and post-hoc deletion of replication metadata belongs to NJT-0112. New registration, DRS push, and removal form one completion chain and are not split into NJS; evidence for inactive-registration reuse is deferred.
gap_statement_zh: TA0112 需要独立表达恶意目录写入以受信复制来源被合法 DC 接受、同时移出正常来源审计链的防御削弱结果。
gap_statement_en: TA0112 needs an independent object for the defensive-impairment result in which a malicious directory write is accepted by a legitimate DC as trusted replication while being displaced from the normal source-audit chain.
original_attack_subtechniques_imported: false
