review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: Grandoreiro 案例保持恶意权限修改与结果未完全公开的证据边界；零 NJS 不按平台复制 ATT&CK。, review_notes_en: "The Grandoreiro case preserves the boundary between malicious permission modification and incompletely reported outcome; zero NJS avoids copying ATT&CK by platform."}
