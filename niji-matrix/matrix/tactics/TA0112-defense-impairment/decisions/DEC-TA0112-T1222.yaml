type: technique-decision
id: DEC-TA0112-T1222
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1222, source_attack_version: "19.1", name_en: File and Directory Permissions Modification, name_zh: 文件和目录权限修改}
decision: adapt
rationale_zh: ATT&CK T1222 广泛覆盖通过 Windows DACL、POSIX 权限、owner 与属性取得文件访问或支持其他技术，但 TA0112 需要直接的防御削弱结果。ESET 对 Grandoreiro 的样本分析直接观察到其向 Trusteer 主二进制写入拒绝 ACL 并意图破坏保护软件；公开材料未逐台证明产品最终停用。正式对象因此采用 adapt，只保留受保护安全工件的有效权限被攻击者改变、真实防御消费者因此无法执行、读取、更新或保护该工件的分支，并把权限写入、有效拒绝和功能结果分成三个证据层。
rationale_en: ATT&CK T1222 broadly covers Windows DACLs, POSIX permissions, ownership, and attributes used to obtain file access or support other techniques, while TA0112 requires a direct defensive outcome. ESET's Grandoreiro sample analysis directly observes denial ACLs written to a main Trusteer binary with intent to break the protection software, but public reporting does not prove final shutdown on every device. The formal object is therefore adapted to the branch where an adversary changes effective permissions of a protected security artifact and a real defensive consumer can no longer execute, read, update, or protect it, preserving permission write, effective denial, and functional result as three evidence layers.
scope_notes_zh: Windows 与 Linux/macOS ATT&CK 子项只是访问控制实现，不导入 NJS。扩大攻击者写权但尚未发生防御结果是前提；后继文件替换、日志删除、工具功能损伤可由各自对象并记。合法产品升级、所有权修复、隔离和取证会产生相似权限变化，需要审批、对象版本、消费者身份及恢复验证。
scope_notes_en: The Windows and Linux or macOS ATT&CK children are access-control implementations and are not imported as NJS. Granting adversary write access without a defensive outcome is a prerequisite; later file replacement, log deletion, or tool-function damage may also map to their owners. Legitimate product upgrades, ownership repair, quarantine, and forensics create similar permission changes and require approval, object version, consumer identity, and recovery validation.
gap_statement_zh: 现有 NJT-0123 表达工具能力结果，却不能独立表示攻击者借文件系统有效权限阻断安全工件消费者的原因与残余痕迹。
gap_statement_en: Existing NJT-0123 expresses a tool-capability outcome but does not independently represent the cause and residue of blocking a security-artifact consumer through effective file-system permissions.
original_attack_subtechniques_imported: false
resulting_technique_ref: NJT-0161
