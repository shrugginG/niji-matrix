id: DEC-TA0112-T1484
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1484, source_attack_version: "19.1", name_en: Domain or Tenant Policy Modification, name_zh: 域或租户策略修改}
decision: adapt
rationale_zh: 固定 T1484 同时映射 Defense Impairment 和 Privilege Escalation，但现有 NJT-0100 已以实际权限正差承载后者。TA0112 只保留攻击者改写域或租户权威安全策略并经目标消费者实际降低防护、审计或响应能力的分支。Microsoft 2026 事件直接证明攻击者构造并发布 Defender 篡改 GPO 的意图、版本与集中扇出，却因防守阻断不能证明目标成功失防；平台文档证明策略传播与篡改保护的效果门槛。因此采用 adapt 缩小父语义，并把成功结果作为分类门槛而非把策略写入等同于削弱。
rationale_en: Fixed T1484 maps to both Defense Impairment and Privilege Escalation, while existing NJT-0100 already owns the latter through a positive authority difference. TA0112 retains only adversary modification of authoritative domain or tenant security policy that actually reduces protection, audit, or response capability after target consumption. Microsoft's 2026 case directly establishes intent, version, and central fan-out of a Defender-tampering GPO but cannot establish target protection loss because defenders blocked it; platform documentation establishes propagation and tamper-protection outcome gates. The parent is therefore adapted to a narrower scope, with successful effect as the classification threshold rather than equating a policy write with impairment.
scope_notes_zh: 正式对象按权威防御策略版本、作用域、消费者和实际功能结果定义；GPO 与 trust 只是 ATT&CK 实现维度，不导入子技术。只有权限增加归 NJT-0100，认证证明例外归 NJT-0093，账户授权边归 NJT-0083，计划任务或载荷执行归各自执行对象，工具本地状态损伤可并记 NJT-0123 但不能代替本项的中心发布—消费链。作用域例外与用后回退证据不足，暂不建立 NJS。
scope_notes_en: The formal object is defined by authoritative defensive-policy version, scope, consumer, and real functional outcome. GPO and trust are ATT&CK implementation dimensions and are not imported as children. Added authority belongs to NJT-0100, authentication-proof exceptions to NJT-0093, account-authorization edges to NJT-0083, and scheduled-task or payload execution to their execution objects. Local tool-state damage can also be recorded under NJT-0123 but cannot replace this central publish-to-consume chain. Scoped exceptions and post-use reversion lack sufficient evidence for NJS creation now.
gap_statement_zh: 需在 TA0112 独立表示中心策略版本经受信消费者削弱安全控制的结果，与现有 NJT-0100 的实际提权结果和 NJT-0123 的工具本地损伤区分。
gap_statement_en: TA0112 needs an independent object for defensive-control loss propagated through a central policy version and trusted consumers, distinct from the actual authority gain in NJT-0100 and local tool damage in NJT-0123.
