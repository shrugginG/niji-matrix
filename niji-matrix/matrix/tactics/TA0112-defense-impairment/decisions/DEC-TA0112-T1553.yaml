review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 六项 ATT&CK 子项经覆盖表和第二轮审查收敛为四项信任输入层变量；没有导入平台、产品、证书类型或容器格式。, review_notes_en: "The six ATT&CK children converged through a coverage table and second pass into four trust-input-layer variables; no platform, product, certificate type, or container format was imported."}
