type: technique-decision
id: DEC-TA0112-T1553
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1553, source_attack_version: "19.1", name_en: Subvert Trust Controls, name_zh: 颠覆信任控制}
decision: adapt
rationale_zh: T1553 直接描述攻击者削弱会警告或阻止未受信对象的安全 consumer，但六个 ATT&CK 子项混合平台、输入介质和验证层。Niji 把完成点固定为 attacker-controlled trust input/state—named consumer evaluation—baseline-different allow/trusted/no-warning decision—accepted malicious outcome，并按 trust input 位于对象证明、anchor graph、evaluator policy/provider 或 per-object provenance 四层建立原生 NJS。
rationale_en: "T1553 directly describes adversary impairment of security consumers that warn on or block untrusted objects, but its six ATT&CK children mix platform, input medium, and verification layer. Niji fixes completion on attacker-controlled trust input or state to named consumer evaluation to an allow, trusted, or no-warning decision differing from baseline to an accepted malicious outcome and creates native NJS according to whether trust input resides in object attestation, the anchor graph, evaluator policy or provider, or per-object provenance."
scope_notes_zh: 签名、证书、Registry、policy、xattr/ADS 或 unsigned execution 只有被 consumer 消费并改变实际结果才纳入。二进制内容破坏归 NJT-0087，可见身份伪装归 NJT-0114，网络 AiTM/内容读取归其 owner，一般证据删除归 NJT-0112，人际信任归 NJT-0118。证书类型、平台、Gatekeeper 产品、容器格式和后继结果不形成 NJS。
scope_notes_en: A signature, certificate, Registry value, policy, xattr or ADS, or unsigned execution qualifies only when a consumer consumes it and the actual result changes. Binary-content compromise belongs to NJT-0087, visible-identity disguise to NJT-0114, network AiTM or content reading to its owner, generic evidence deletion to NJT-0112, and human trust to NJT-0118. Certificate type, platform, the Gatekeeper product, container format, and downstream outcome do not create NJS.
gap_statement_zh: TA0112 需要一个以实际 security-consumer trust decision 为完成点的对象，统一解释恶意输入如何在对象、锚、验证器或来源层获得可信/允许结果，同时保留四种不同防守观察。
gap_statement_en: TA0112 needs an object completed by an actual security-consumer trust decision that explains how malicious input gains a trusted or allowed result at the object, anchor, verifier, or provenance layer while preserving four distinct defensive observations.
