id: DEC-TA0112-T1556
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1556, source_attack_version: "19.1", name_en: Modify Authentication Process, name_zh: 修改认证过程}
decision: retain
rationale_zh: ATT&CK 19.1 将 T1556 同时映射 Persistence、Credential Access 与 Defense Impairment。TA0003 的 NJT-0093 已以认证 decision path 为直接对象，将九项 ATT&CK 实现经覆盖表和第二轮 taxonomy 收敛为“额外接受攻击者证明”和“总体策略仍启用但窄范围例外”两项原生变量。TA0112 的成立门槛是同一验证器、信任或策略变化使预期认证要求实际下降；状态键、痕迹、检测和恢复与 NJT-0093 完全相同，因此复用父子项并扩展 tactic_refs，不复制技术或防御对象。
rationale_en: >-
  ATT&CK 19.1 maps T1556 to Persistence, Credential Access, and Defense Impairment. TA0003 NJT-0093 already uses the authentication decision path as its direct object and converges nine ATT&CK implementations through a coverage table and second taxonomy pass into two native variables: added acceptance of an adversary proof and a narrow exception under an otherwise enabled policy. TA0112 qualifies when the same validator, trust, or policy mutation actually lowers the intended authentication requirement. State keys, traces, detection, and recovery are identical to NJT-0093, so the parent and children are reused with an added tactic_ref rather than duplicating technique or defense objects.
scope_notes_zh: TA0112 个案必须连接未批准组件/信任/策略变更、以后请求命中和相对基线较弱的允许结果。只获取密码、私钥或认证输入归 Credential Access；账户级 MFA/设备注册归 T1098；纯日志关闭归记录对象；仅使用有效凭据归 T1078。九子项不导入，既有 NJS-0093-001/002 保持权威 taxonomy。
scope_notes_en: A TA0112 case must join an unapproved component, trust, or policy mutation to a later request match and an allow result weaker than baseline. Password, private-key, or authentication-input acquisition alone belongs to Credential Access; account-level MFA or device enrollment to T1098; logging-only shutdown to recording objects; and use of valid credentials to T1078. The nine ATT&CK children are not imported, and existing NJS-0093-001 and NJS-0093-002 remain the authoritative taxonomy.
gap_statement_zh: 无新分类缺口；TA0112 复用 NJT-0093，并以认证要求下降作为本战术个案结果门槛。
gap_statement_en: No new taxonomy gap exists. TA0112 reuses NJT-0093 and applies reduced authentication requirement as the tactic-specific case outcome gate.
original_attack_subtechniques_imported: false
resulting_technique_ref: NJT-0093
evidence_refs: [REF-000187, REF-000303, REF-000304, REF-000305, REF-000306, REF-000307]
confidence: high
review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 九项子项覆盖和第二轮 taxonomy 复用 TA0003 已审结果；TA0112 复用包的质量、Bundle 与 Web 门禁通过。, review_notes_en: "The nine-child coverage and second taxonomy pass reuse the reviewed TA0003 result; the TA0112 reuse package passed quality, bundle, and Web gates."}
