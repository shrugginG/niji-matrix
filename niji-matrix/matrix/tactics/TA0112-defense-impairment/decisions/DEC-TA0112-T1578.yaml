type: technique-decision
id: DEC-TA0112-T1578
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1578, source_attack_version: "19.1", name_en: Modify Cloud Compute Infrastructure, name_zh: 修改云计算基础设施}
decision: adapt
rationale_zh: T1578 的五个 ATT&CK 子项按快照、创建、删除、回退和配置操作划分实现，但 TA0112 不能把任意云生命周期 API 等同于失防。Microsoft 与 CISA 直接观察攻击者在受害云内创建并使用新 VM/EC2，Microsoft 还观察 LAPSUS$ 在窃取后删除云资源；云厂商文档证明生命周期事件可在控制面保留，而来宾状态与备份可能在删除后不可恢复。Niji 因而适配为“计算 lineage 与防御状态位移”，要求新 lineage 在等效控制注册前承载活动，或既有 lineage 的取证状态在恶意窗口后不可恢复，并按这两种前态、痕迹与防守方法建立原生子项。
rationale_en: T1578's five ATT&CK children divide snapshot, creation, deletion, reversion, and configuration implementations, but TA0112 cannot equate any cloud lifecycle API with lost defense. Microsoft and CISA directly observe adversaries creating and using new VMs or EC2 instances inside victim clouds, and Microsoft also observes LAPSUS$ deleting cloud resources after theft. Provider documentation establishes that lifecycle events can remain in the control plane while guest state and backups may be unrecoverable after deletion. Niji therefore adapts the parent to compute lineage and defensive-state displacement, requiring either activity on a new lineage before equivalent control enrollment or unrecoverable forensic state on an existing lineage after a malicious interval, and creates native children from those different prior states, traces, and defensive methods.
scope_notes_zh: T1578.001/.002 为影子计算分叉提供实现广度，T1578.003/.004 为取证连续性断裂提供实现广度，均不导入名称。T1578.005 的配额、订阅和区域修改仅在造成本父级结果时纳入，否则归资源劫持、区域选择、NJT-0125 策略或 NJT-0126 层级对象。批量删除若主要造成业务破坏可同时归 Impact，但不能替代取证断点证明。
scope_notes_en: T1578.001 and T1578.002 provide implementation breadth for shadow-compute forks, while T1578.003 and T1578.004 provide breadth for forensic-continuity breaks; none of their names are imported. T1578.005 quota, subscription, and region changes qualify only when they cause this parent's outcome and otherwise belong to resource hijacking, region selection, NJT-0125 policy, or NJT-0126 hierarchy. Mass deletion whose main result is business destruction may also map to Impact but cannot replace proof of a forensic break.
gap_statement_zh: TA0112 需要独立表达计算资源 lineage 相对控制注册与来宾取证状态的差，不能由云层级 ancestry 或一般策略对象替代。
gap_statement_en: TA0112 needs an independent object for compute-resource lineage differences relative to control enrollment and guest forensic state, which cloud ancestry and generic policy objects cannot replace.
