review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 恶意新实例和删除为直接案例，控制未注册与证据不可恢复仍需环境结果；两个 NJS 不复制五项 ATT&CK 生命周期名称。, review_notes_en: "Malicious new instances and deletion have direct cases, while missing control enrollment and unrecoverable evidence remain environment-specific outcomes; the two NJS do not copy five ATT&CK lifecycle names."}
