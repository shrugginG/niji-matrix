id: DEC-TA0112-T1599
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1599, source_attack_version: "19.1", name_en: Network Boundary Bridging, name_zh: 网络边界桥接}
decision: adapt
rationale_zh: T1599 父行为直接描述攻击者让原本分隔的可信/不可信或企业/受限网络出现可用路径。ThreatNeedle 事件完整证明受侵路由 VM 的 proxy 配置、禁止互通基线和双侧后继流量；APT41 NATBypass 及印度关键基础设施 FRP/VPN 报告补充转发与 overlay 实现。Niji 将范围固定为 approved path graph—bridge state—bilateral flow 的结果链，并按边界设备转发状态与独立 relay 会话状态建立两项原生变量，不导入 ATT&CK NAT 子项。
rationale_en: T1599 directly describes an adversary creating a usable path between networks that should be separated as trusted and untrusted or corporate and restricted. The ThreatNeedle incident fully establishes a compromised router VM's proxy configuration, a prohibited-communication baseline, and bilateral follow-on traffic, while APT41 NATBypass and Indian critical-infrastructure FRP or VPN reporting add forwarding and overlay implementations. Niji fixes scope on the approved-path-graph to bridge-state to bilateral-flow outcome chain and creates two native variables from boundary-device forwarding state and independent relay-session state rather than importing the ATT&CK NAT child.
scope_notes_zh: 必须证明两个安全域、批准路径/检查点、攻击者 bridge 状态和真实跨域流。只修改防火墙规则可并记 NJT-0124，但没有端到端桥接不属于本项；普通 VPN、远程支持、同域 proxy、单边 C2、横向移动凭据和持久网络配置由相邻对象拥有。NAT、FRP、VPN、Apache 与设备类型只是实现。
scope_notes_en: Proof requires two security domains, the approved path or inspection point, adversary bridge state, and actual cross-domain flow. A firewall-rule modification may also map to NJT-0124 but is outside this object without end-to-end bridging. Ordinary VPN, remote support, same-domain proxy, one-sided C2, lateral-movement credentials, and durable network configuration have adjacent owners. NAT, FRP, VPN, Apache, and device type are implementations only.
gap_statement_zh: TA0112 需要独立表达端到端分段路径失效，区别于单设备防火墙策略、普通代理/隧道和横向移动结果。
gap_statement_en: TA0112 needs an independent object for end-to-end segmentation-path failure, distinct from one-device firewall policy, ordinary proxy or tunnel, and lateral-movement outcomes.
original_attack_subtechniques_imported: false
resulting_technique_ref: NJT-0168
