review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 两项 NJS 按 device forwarding state 与 relay session state 划分；没有批准图和双侧流时不确认桥接。, review_notes_en: "The two NJS are divided by device-forwarding state and relay-session state; bridging is not confirmed without an approved graph and bilateral flow."}
