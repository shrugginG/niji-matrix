review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 两项 ATT&CK 子项仅作实现广度；关闭加速器不是成功加密削弱的充分条件。, review_notes_en: "The two ATT&CK children are implementation breadth only; disabling acceleration is not sufficient proof of cryptographic impairment."}
