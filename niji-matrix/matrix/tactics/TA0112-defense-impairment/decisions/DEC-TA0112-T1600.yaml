id: DEC-TA0112-T1600
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1600, source_attack_version: "19.1", name_en: Weaken Encryption, name_zh: 削弱加密}
decision: adapt
rationale_zh: ATT&CK T1600 的网络设备父语义包括弱密钥空间与停用密码硬件，但二者不是等价的成功结果。Cisco 对两起恶意 IOS 映像的原始取证直接证明派生密钥材料被弱化、流量粗略外观仍为密文；另有原厂回顾指出曾停用加密硬件，但该动作若软件仍提供等效保护则不构成同等防御削弱。TA0112 因此采用 adapt，把正式范围收窄到实际通信会话保密性或完整性相对批准基线下降，要求设备变化与有效会话结果连接。
rationale_en: The ATT&CK T1600 network-device parent includes reduced key space and disabled cryptographic hardware, but these are not equivalent successful outcomes. Cisco's original forensics directly documents two malicious IOS images weakening derived keying material while traffic still looked encrypted under casual inspection. Its later vendor retrospective also notes disabled crypto hardware, but that action is not equivalent impairment when software preserves protection. TA0112 therefore adapts the scope to an actual reduction in session confidentiality or integrity relative to the approved baseline and requires a join from device change to effective session result.
scope_notes_zh: 加密参数、运行映像、硬件路径和协议协商均可为因果入口，但并非 NJS 划分依据；T1600.001 的密钥缩减是父级结果核心，T1600.002 的硬件路径必须另证强度下降。只改变协议版本但未损伤加密归 T1689；系统映像修改本身归 T1601；明文暴露、凭据获取与流量收集是后继结果，不可代替加密损伤证明。
scope_notes_en: Crypto parameters, running images, hardware paths, and negotiation can be causal entry points but are not NJS partition keys. T1600.001 key-space reduction contributes to the parent outcome, whereas T1600.002 hardware-path change needs separate proof of reduced strength. A protocol version change without cryptographic loss belongs to T1689; image modification itself to T1601. Plaintext exposure, credential access, and traffic collection are downstream outcomes and cannot replace proof of cryptographic damage.
gap_statement_zh: 现有版本回退和映像对象不能表达表面仍为正常密文、但网络设备真实密钥材料或完整性保护已弱化的防守观察差。
gap_statement_en: Existing rollback and image objects do not express the defender-observation gap in which traffic still appears normally encrypted while a network device has weakened real keying material or integrity protection.
