type: technique-decision
id: DEC-TA0112-T1601
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1601, source_attack_version: "19.1", name_en: Modify System Image, name_zh: 修改系统映像}
decision: adapt
rationale_zh: T1601 固定父项锚定嵌入式网络设备系统映像修改，并明确变化可发生于运行内存或持久存储。Cisco 原始取证直接区分运行内存补丁且重载后消失的事件，与修改闪存 IOS/ROMMON、跨重载或升级持续的事件；PHASEJAM 又证明 appliance 关键组件和本地 manifest 可被同步修改并阻断升级。Niji 因而适配为“系统映像完整性削弱”，按实际消费拓扑分为运行时内存修改和启动持久替换，而不复制 ATT&CK 的 Patch/Downgrade 名称。
rationale_en: Fixed T1601 anchors embedded network-device system-image modification and explicitly states that changes can occur in running memory or persistent storage. Cisco original forensics directly distinguishes running-memory patches that disappear after reload from modified flash IOS or ROMMON that persists across reload or upgrade. PHASEJAM additionally establishes co-modification of critical appliance components and a local manifest while blocking upgrade. Niji therefore adapts the candidate to system-image integrity impairment and divides it by actual consumption topology into runtime-memory mutation and boot-persistent replacement rather than copying ATT&CK Patch or Downgrade names.
scope_notes_zh: 成立需连接未批准映像/组件变化、设备实际消费与安全/观察/恢复能力结果。仅版本回退但代码来自可信旧版本归 NJT-0127；加密结果归 NJT-0128；认证路径结果可并记 NJT-0093；一般模块 hook、web shell 或持久化只有改变设备映像信任面时才纳入。厂商、文件格式和版本号不构成 NJS。
scope_notes_en: Qualification joins an unapproved image or component mutation, actual device consumption, and a security, observation, or recovery outcome. Rollback to a trusted older version without unapproved image mutation belongs to NJT-0127, cryptographic outcomes to NJT-0128, and authentication-path outcomes may also map to NJT-0093. Generic module hooks, web shells, or persistence qualify only when they change the device image trust plane. Vendor, file format, and version number do not define NJS.
gap_statement_zh: TA0112 需要独立表示网络设备可信持久映像、启动消费与运行内存之间的完整性差，并区分重启前证据与跨重启恢复。
gap_statement_en: TA0112 needs an independent object for integrity differences among a network device's trusted persistent image, boot consumption, and running memory and must distinguish pre-reboot evidence from cross-reboot recovery.
original_attack_subtechniques_imported: false
resulting_technique_ref: NJT-0167
evidence_refs: [REF-000449, REF-000467, REF-000468, REF-000720]
confidence: high
review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 两个 NJS 由重载持续性和证据面定义，不按 patch/downgrade；需保留与 NJT-0127、NJT-0128 和 NJT-0123 的结果边界。, review_notes_en: "The two NJS are defined by reload persistence and evidence plane rather than patch or downgrade, with outcome boundaries preserved against NJT-0127, NJT-0128, and NJT-0123."}
