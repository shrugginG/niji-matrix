id: DEC-TA0112-T1647
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1647, source_attack_version: "19.1", name_en: Plist File Modification, name_zh: Plist 文件修改}
decision: exclude
rationale_zh: T1647 以 macOS property list 为介质，固定父页和 XCSSET 直接案例覆盖 LSUIElement 隐藏、显示名/图标与 Dock URI 替换、LaunchAgent/LaunchDaemon 或恢复状态持久化以及加载环境变量。Apple 文档证明这些键由 Launch Services 正常消费，但现有案例的直接结果是可见性重塑、熟悉应用重绑定、用户/生命周期执行或持久化；XCSSET 的防火墙和系统更新关闭由独立模块完成，而不是 plist 消费本身。NJT-0111 已拥有默认视图遗漏与呈现差，NJT-0084/NJT-0089 已拥有启动/服务定义，执行与加载劫持也有各自 owner。没有结论级证据表明 Plist 介质形成新的、不可由这些对象表达的 TA0112 防御削弱，因此排除重复父项。
rationale_en: T1647 is defined by the macOS property-list medium. The fixed parent and direct XCSSET case cover LSUIElement hiding, display-name, icon, and Dock URI replacement, LaunchAgent or LaunchDaemon and restoration persistence, and loader environment variables. Apple documentation establishes normal Launch Services consumption of these keys, but direct outcomes in available cases are visibility reshaping, familiar-application rebinding, user or lifecycle execution, or persistence. XCSSET shuts down the firewall and system updates through separate modules rather than plist consumption itself. NJT-0111 already owns default-view omission and presentation differences, NJT-0084 and NJT-0089 own boot or service definitions, and execution or loader hijacking has its own owners. No conclusion-level evidence establishes a new TA0112 defensive impairment unique to the plist medium and not expressible by those objects, so the duplicate parent is excluded.
scope_notes_zh: T1647 无 ATT&CK 子项；开放 taxonomy 搜索审查默认 UI 遗漏、Dock/LaunchPad 目标重绑定、launchd/登录消费、环境变量加载和假设性防御设置损伤。前三类归现有可见性、执行和持久化对象，最后一类缺少直接案例。plist 路径、格式、工具、key 和应用名均不得成为 NJS；exclude 不创建 NJT/NJS 或通用防御对象。
scope_notes_en: T1647 has no ATT&CK children. Open taxonomy search reviewed default-UI omission, Dock or LaunchPad target rebinding, launchd or logon consumption, environment-variable loading, and hypothetical defensive-setting damage. The first classes belong to existing visibility, execution, and persistence objects, while the last lacks a direct case. Plist path, format, tool, key, and application name cannot define NJS. Exclusion creates no NJT, NJS, or generic defense object.
gap_statement_zh: 当前无独立 TA0112 缺口；未来只有在直接案例证明某个 plist 防御设置被消费者采用、使安全控制下降且现有结果 owner 无法表达时，才重新评估。
gap_statement_en: No independent TA0112 gap is established. Reassessment requires a direct future case in which a defensive plist setting is consumed, reduces a security control, and cannot be expressed by an existing outcome owner.
