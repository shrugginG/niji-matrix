candidate: {source_type: attack, source_attack_id: T1666, source_attack_version: "19.1", name_en: Modify Cloud Resource Hierarchy, name_zh: 修改云资源层级}
decision: adapt
rationale_zh: 固定 ATT&CK T1666 将云资源层级修改置于 Defense Impairment，但“创建账户”或“移动项目”并不天然构成匿迹。AWS 官方文档证明既有成员离开组织后，原组织 trail 不再采集该账户的新事件；Google Cloud 证明项目迁移可在资源 ID 和工作负载不变时立即更换继承策略；AWS Control Tower 则区分层级存在与治理注册。Microsoft 观察到 Peach Sandstorm 新建并使用订阅，却未披露失去的具体控制。故本批 adapt 为“层级造成的防御覆盖位移”，只有 ancestry 变化、控制正差及后继活动共同成立时才纳入。
rationale_en: Fixed ATT&CK T1666 places cloud-hierarchy modification in Defense Impairment, but creating an account or moving a project is not intrinsically stealthy. AWS documentation establishes that an existing member leaving an organization stops sending new events to its former organization trail. Google Cloud establishes that a project move can replace inherited policy immediately while resource ID and workloads persist. AWS Control Tower distinguishes hierarchy existence from governance enrollment. Microsoft observed Peach Sandstorm create and use subscriptions but did not disclose a specific lost control. The parent is therefore adapted to hierarchy-driven defensive coverage displacement and admitted only when ancestry change, a positive control difference, and follow-on activity coexist.
scope_notes_zh: 直接对象是资源 parent/ancestor 边、成员资格和由此决定的继承安全控制与集中观察，而不是策略文本或计算实例生命周期。既有资源迁离与新节点在治理注册前运行按前态和观察差异建立两个 Niji 原生子项；ATT&CK 本身没有子项。单纯账单重排、已配置等效控制的合法迁移、新建但未使用节点及只改策略内容的 T1484 分支排除。
scope_notes_en: The direct object is the resource parent or ancestor edge, membership, and resulting inherited security controls and central observation, not policy text or compute-instance lifecycle. Departure of an existing resource and operation of a new node before governance enrollment form two Niji-native children based on prior state and observation differences; ATT&CK itself has no children. Billing-only reorder, legitimate migration with equivalent controls, unused new nodes, and T1484 policy-content edits are excluded.
gap_statement_zh: 新父技术必须区分资源层级关系导致的继承控制位移与 T1484 的权威策略版本修改，并明确“层级 API 成功不等于防御缺口”。
gap_statement_en: A new parent must distinguish inherited-control displacement through resource ancestry from T1484 authoritative policy-version modification and explicitly state that a successful hierarchy API does not equal a defensive gap.
