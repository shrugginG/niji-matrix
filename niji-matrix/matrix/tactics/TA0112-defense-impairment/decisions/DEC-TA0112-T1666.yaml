review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: AWS/GCP 文档直接支持层级与控制差，Peach Sandstorm 仅支持恶意新节点使用；实际失明仍须逐环境确认。, review_notes_en: "AWS and Google Cloud documentation directly support hierarchy-to-control differences, while Peach Sandstorm supports malicious new-node use only; actual blindness still requires environment-specific confirmation."}
