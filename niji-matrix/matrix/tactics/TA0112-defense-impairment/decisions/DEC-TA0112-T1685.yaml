candidate:
  source_type: attack
  source_attack_id: T1685
  source_attack_version: "19.1"
  name_en: Disable or Modify Tools
  name_zh: 禁用或修改工具
decision: retain
rationale_zh: 固定 ATT&CK 19.1 父项直接描述攻击者停止、降级、篡改或阻断安全工具、传感器、日志代理和更新能力，从而降低防御预防、检测与响应效力。BlackByte 对 Defender 排除范围和安全进程的修改、CLEANPULSE 对日志处理路径的条件化跳过、PHASEJAM 对升级结果的伪造反馈，以及 Scattered Spider 对传感器例程的内核级篡改尝试，分别证明完整停用、范围收缩、遥测抑制与反馈伪造均具有攻击者可控的痕迹变化和防守观察差异。因此保留父语义，并以“防御工具功能削弱”作为 Niji 的直接对象。
rationale_en: The fixed ATT&CK 19.1 parent directly describes adversary stopping, degradation, tampering, or blocking of security tools, sensors, logging agents, and update capability to reduce prevention, detection, and response effectiveness. BlackByte changes to Defender scope and security processes, CLEANPULSE conditional skipping in a log-handling path, PHASEJAM forged upgrade feedback, and Scattered Spider's attempted kernel-level sensor-routine tampering respectively establish whole disablement, scope contraction, telemetry suppression, and feedback forgery as adversary-controlled trace changes with distinct defender-observation effects. The parent semantics are therefore retained with Defensive Tool Function Impairment as the direct Niji object.
scope_notes_zh: 正式范围只纳入直接损害安全工具可用性、防护范围、遥测产生或输送、操作员健康反馈及更新恢复功能的攻击者受控变化。防火墙策略归 T1686；已持久化日志或工件的事后删除归 NJT-0112；普通服务管理、注册表编辑、软件卸载、故障、资源压力、许可证到期、兼容性调优和批准维护均需独立排除。六项 ATT&CK 子技术只用于广度审查，没有任何一项被导入。
scope_notes_en: Formal scope includes only adversary-controlled changes that directly impair security-tool availability, protection scope, telemetry generation or delivery, operator health feedback, or update and recovery functions. Firewall policy belongs to T1686; post-hoc deletion of already durable logs or artifacts belongs to NJT-0112. Ordinary service administration, Registry edits, software removal, failure, resource pressure, license expiry, compatibility tuning, and approved maintenance require independent exclusion. The six ATT&CK children are used only for breadth review and none is imported.
gap_statement_zh: 需要一个新父技术承载该防御对象；四项 Niji 原生子技术按照完整能力可用性、防护范围、持久存储前事件存在性和报告状态保真度划分。
gap_statement_en: A new parent technique is required for this defensive object. Four Niji-native children partition whole-capability availability, protection scope, event existence before durable storage, and reported-state fidelity.
