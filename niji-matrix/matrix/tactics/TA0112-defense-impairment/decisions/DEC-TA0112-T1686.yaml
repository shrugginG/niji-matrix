candidate: {source_type: attack, source_attack_id: T1686, source_attack_version: "19.1", name_en: Disable or Modify System Firewall, name_zh: 禁用或修改系统防火墙}
decision: retain
rationale_zh: 固定 ATT&CK Enterprise 19.1 将攻击者停用或修改主机、网络与虚拟化防火墙以削弱流量限制的父行为归入 Defense Impairment。CISA 报告直接记录 Dragonfly 相关脚本关闭主机防火墙并开放远程入口，Sandfly 对 BPFDoor 的样本分析证明来源定向规则把表面常用端口转发给隐藏 shell，Mandiant 则记录 UNC3886 在受 ACL 限制的设备上通过 TABLEFLIP 恢复后门访问。它们显示有效过滤与真实接收路径可被攻击者控制，并具有可区分的规则、流量及进程残余，故保留父语义。
rationale_en: Fixed ATT&CK Enterprise 19.1 places adversary disablement or modification of host, network, and virtualization firewalls under Defense Impairment because it weakens traffic restrictions. CISA directly records a Dragonfly-related script disabling a host firewall and opening remote access. Sandfly's BPFDoor sample analysis establishes source-scoped rules forwarding an apparently ordinary port to a hidden shell, while Mandiant records UNC3886 restoring backdoor access through TABLEFLIP on an ACL-restricted device. These show adversary control over effective filtering and real receiving path with distinguishable rule, flow, and process residue, so the parent semantics are retained.
scope_notes_zh: 正式范围要求攻击者控制防火墙有效策略，且至少一条原本受限会话的裁决或接收路径实际改变；配置命令、规则存在或端口开放但缺少生效和会话证据时只标记尝试或暴露。整体姿态下降、精确规则例外与策略路径重定向按不同匿迹变量重新划分；云、网络设备与 Windows 三项 ATT&CK 子技术没有导入。仅停用日志归 NJT-0123，普通路由、C2、横向移动和正常运维各守其直接对象。
scope_notes_en: Formal scope requires adversary control of effective firewall policy and an actual decision or receiving-path change for at least one formerly restricted session. A command, rule existence, or open port without enforcement and session evidence remains an attempt or exposure. Broad posture loss, precise rule exception, and policy-path redirection are repartitioned by distinct stealth variables; the cloud, network-device, and Windows ATT&CK children are not imported. Logging-only disablement belongs to NJT-0123, while ordinary routing, C2, lateral movement, and legitimate operations retain their direct objects.
gap_statement_zh: 需要独立父技术承载系统防火墙有效裁决这一防御对象；三个 Niji 原生子项按受损范围与表面入口—真实接收者映射划分。
gap_statement_en: An independent parent is needed for effective system-firewall decisions as a defensive object; three Niji-native children partition impairment breadth and the mapping from apparent entry to actual receiver.
