schema_version: "1.1.0"
type: technique-decision
id: DEC-TA0112-T1687
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1687, source_attack_version: "19.1", name_en: Exploitation for Defense Impairment, name_zh: 防御削弱漏洞利用}
decision: adapt
rationale_zh: T1687 固定父项涵盖安全软件、基础设施和云/SaaS 缺陷，但宽平台枚举不能充当结论级证据。Avast 对 Lazarus 的原始调查直接记录 AppLocker 驱动 CVE-2024-21338 被利用，随后内核读写原语使 FudModule 操作安全回调与产品；部分针对产品的动作只是尝试。TA0112 因此采用 adapt，正式范围限定可证的防御组件漏洞触发、利用后能力、具体防御功能下降三层因果链；单纯漏洞存在、利用成功或权限增加均不足以准入结果。现有 NJT-0110 处理观察边界逃逸，NJT-0123 处理工具损伤，本对象负责利用到损伤的连接。
rationale_en: Fixed T1687 spans security software, infrastructure, and cloud or SaaS flaws, but broad platform enumeration is not conclusion-level evidence. Avast's original Lazarus investigation directly documents exploitation of AppLocker driver CVE-2024-21338 and a kernel read/write primitive used by FudModule to manipulate security callbacks and products; some product-targeted actions were attempts only. TA0112 therefore adapts the formal scope to a provable three-layer causal chain of defensive-component vulnerability trigger, post-exploitation capability, and concrete defensive-function decline. Mere vulnerability presence, successful exploitation, or added authority is insufficient. Existing NJT-0110 owns observation-boundary escape and NJT-0123 owns tool damage; this object owns the exploit-to-damage connection.
scope_notes_zh: 现有直接证据支持端点/内核防御组件，不能仅凭 ATT&CK 父页扩充到未证实的云和 SaaS 子类。漏洞 ID、驱动产品、崩溃形式与提权上下文是实现或结果，不作为 NJS；只有可证明独立痕迹、兄弟边界和防守方法时才重开分类。可同时记录实际被关闭的工具，但不得用工具停用记录反推特定漏洞成功。
scope_notes_en: Direct evidence currently supports endpoint and kernel defensive components, not unverified cloud and SaaS subclasses merely because the ATT&CK parent mentions them. Vulnerability ID, driver product, crash form, and privilege context are implementations or outcomes rather than NJS. Taxonomy reopens only with an independently proven trace, sibling boundary, and defender method. An actually disabled tool may also be recorded, but its shutdown record cannot retroactively prove a specific exploit succeeded.
gap_statement_zh: 既有匿迹漏洞利用与工具损伤对象未独立表达“漏洞触发后具体防御功能失效”的可验证因果链。
gap_statement_en: Existing exploitation-for-stealth and tool-impairment objects do not independently express the verifiable causal chain from exploit trigger to specific defensive-function failure.
original_attack_subtechniques_imported: false
resulting_technique_ref: NJT-0129
