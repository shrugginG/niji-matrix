review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: Avast 的安全产品 attempt 不升级为全部成功；零子项为证据及兄弟边界裁决。, review_notes_en: "Avast's product-targeted attempts are not promoted to universal success; zero children follow evidence and sibling-boundary review."}
