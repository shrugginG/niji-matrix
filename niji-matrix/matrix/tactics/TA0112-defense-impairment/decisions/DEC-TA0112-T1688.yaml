id: DEC-TA0112-T1688
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1688, source_attack_version: "19.1", name_en: Safe Mode Boot, name_zh: 安全模式启动}
decision: adapt
rationale_zh: T1688 直接支持攻击者利用 Windows Safe Mode 的有限 driver/service 集让 endpoint defenses 缺席。Niji 把范围从“设置安全模式”收窄为 boot intent—实际 restricted session—具体防御组件 expected-loaded 差—窗口内恶意结果，避免把 BCD 命令或重启当完成。公开 Snatch 与 Embargo 事件还支持一项独立变量：攻击者把自身 service/payload 加入 SafeBoot 允许集，使载荷在防御仍被排除时存活。
rationale_en: "T1688 directly supports adversary use of Windows Safe Mode's limited driver and service set to leave endpoint defenses absent. Niji narrows scope from setting Safe Mode to boot intent, an actual restricted session, a specific expected-versus-loaded defensive-component difference, and a malicious outcome in that window so a BCD command or reboot is not completion. Public Snatch and Embargo incidents also support one independent variable: adversary enrollment of its own service or payload in the SafeBoot allowlist so the payload survives while defenses remain excluded."
scope_notes_zh: 正常故障排查、驱动回滚、DSRM、灾备和批准维护按 boot/console/工单/结果排除。BCD/Registry 变化但未实际启动只算 exposure；直接停用工具归 NJT-0123，版本/启动信任降级归 NJT-0127，加密与恢复破坏归 Impact。Minimal/Networking 是连接能力，one-time/persistent 是时长，均不建立 NJS。
scope_notes_en: Boot, console, ticket, and outcome evidence excludes troubleshooting, driver rollback, DSRM, recovery, and approved maintenance. BCD or Registry change without actual boot is exposure only. Direct tool disablement belongs to NJT-0123, version or boot-trust downgrade to NJT-0127, and encryption or recovery damage to Impact. Minimal versus Networking changes connectivity and one-time versus persistent changes duration; neither creates an NJS.
gap_statement_zh: TA0112 需要独立表达合法受限启动策略造成防御组件缺席、攻击者在该跨重启覆盖缺口中继续行为的结果，以及恶意载荷在 SafeBoot 允许集中的非对称存活。
gap_statement_en: TA0112 needs an independent object for legitimate restricted-boot policy leaving defensive components absent while an adversary continues across that reboot-created coverage gap, including asymmetric survival of malicious payloads in the SafeBoot allowlist.
