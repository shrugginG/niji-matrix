review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 一项 NJS 按 SafeBoot allowlist 中攻击者载荷的额外注册与 boot consumption 建立；模式、时长、工具与家族不构成子项。, review_notes_en: "One NJS is established by additional adversary-payload enrollment and boot consumption in the SafeBoot allowlist; mode variant, duration, tool, and family do not create children."}
