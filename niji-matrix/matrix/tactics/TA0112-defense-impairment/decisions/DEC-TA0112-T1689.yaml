tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1689, source_attack_version: "19.1", name_en: Downgrade Attack, name_zh: 降级攻击}
decision: adapt
rationale_zh: T1689 的固定父行为是使用过时版本使安全能力不可用，但其示例跨脚本运行时、协议和启动组件。TA0112 正式对象只在旧版本被实际执行或加载、且相对批准基线失去可验证的审计或信任保护时成立；旧包存在、更新事务成功和兼容性配置均不足以推定损伤。Microsoft 的 4104 日志规范与 Boot Manager 撤销控制给出可验证的防守差，SafeBreach 的研究证明启动与虚拟化组件回退可使表面“已更新”与实际防护分离。故以 adapt 收窄父级，保留两个按运行时内容缺口和启动信任差分划分的 Niji 原生变量。
rationale_en: Fixed T1689 covers use of outdated versions that remove security capabilities, but its examples span script runtimes, protocols, and boot components. The TA0112 object applies only when an old version actually executes or loads and a verifiable audit or trust protection is lost relative to the approved baseline. An old package's presence, a successful update transaction, or a compatibility configuration cannot establish impairment. Microsoft's 4104 logging model and Boot Manager revocation control provide testable defender differences, while SafeBreach research demonstrates that boot and virtualization rollback can separate an apparently current version from real protection. The parent is therefore adapted to a narrower effect gate with two Niji-native variables for runtime content gaps and boot-trust differential.
scope_notes_zh: 直接对象是实际运行版本与防御能力的因果差。通信加密强度下降归 T1600，映像内容被修改本身归 T1601，直接关停安全工具归 NJT-0123；可并记多结果，但不得以同一介质重复子项。ATT&CK 19.1 无子项，正式两个 NJS 来自不同前态、残余痕迹和防守验证，不是移植 ATT&CK 分类。
scope_notes_en: The direct object is the causal difference between the version actually running and defensive capability. Weakened communication cryptography belongs to T1600, image-content modification itself to T1601, and direct security-tool shutdown to NJT-0123. Multiple outcomes may be recorded without duplicating a medium-based child. ATT&CK 19.1 has no children; the two formal NJS derive from different prior states, residue, and defender validation rather than an imported classification.
gap_statement_zh: 现有工具关停、策略削弱和映像对象均不能独立表达“表面版本合规但运行能力因回退缺失”的防守观察差。
gap_statement_en: Existing tool-shutdown, policy-impairment, and image objects do not independently express the defender-observation gap in which a compliant-looking version lacks capability because an older component actually runs.
