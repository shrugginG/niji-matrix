type: technique-decision
id: DEC-TA0112-T1690
tactic_ref: TA0112
candidate: {source_type: attack, source_attack_id: T1690, source_attack_version: "19.1", name_en: Prevent Command History Logging, name_zh: 阻止命令历史记录}
decision: adapt
rationale_zh: T1690 的核心与 TA0112 一致，但固定父页混合交互历史生成前抑制、选择性过滤、已有历史删除以及更广泛日志关闭。BPFDoor 将 HISTFILE/MYSQL_HISTFILE 指向 /dev/null，APT38 使用 ignorespace，分别直接支持两种不同结果链。Niji 将正式对象收窄为 command execution—history-generation decision—durable entry，并按整段 session 不持久化与相邻历史仍存在但命中 predicate 的条目遗漏建立两个原生变量。
rationale_en: "T1690's core fits TA0112, but the fixed parent mixes pre-generation suppression of interactive history, selective filtering, deletion of existing history, and broader logging shutdown. BPFDoor pointing HISTFILE and MYSQL_HISTFILE to /dev/null and APT38 using ignorespace directly support two different outcome chains. Niji narrows the formal object to command execution to history-generation decision to durable entry and creates two native variables: whole-session non-persistence and predicate-selected entry omission while surrounding history remains."
scope_notes_zh: 只纳入交互命令本应记录且攻击者在持久化前控制生成条件或 sink 的情况。已有历史删除归 NJT-0112；ScriptBlock、syslog 或安全遥测管线关闭归相应记录/工具对象；非交互 shell 默认不记录、合法隐私策略、会话崩溃和权限/磁盘故障是反例。Bash、PowerShell、数据库或网络设备 CLI 只是平台载体。
scope_notes_en: Include only interactive commands expected to be recorded where an adversary controls generation conditions or the sink before persistence. Deletion of existing history belongs to NJT-0112; shutdown of ScriptBlock, syslog, or security telemetry pipelines belongs to their recording or tool objects. Default noninteractive no-history behavior, approved privacy policy, session crashes, and permission or disk failure are counterexamples. Bash, PowerShell, database, and network-device CLIs are platform carriers only.
gap_statement_zh: TA0112 需要独立表达“命令成功执行但预期交互历史在生成前被抑制”的防御削弱结果，并区分整段 sink 失效与选择性 predicate 遗漏。
gap_statement_en: TA0112 needs an independent object for the defense-impairment outcome in which commands execute but expected interactive history is suppressed before generation, separating whole-session sink failure from selective predicate omission.
original_attack_subtechniques_imported: false
resulting_technique_ref: NJT-0170
evidence_refs: [REF-000453, REF-000737, REF-000738, REF-000739, REF-000740]
confidence: high
review: {status: review, authors: [Niji Matrix Research], reviewers: [], review_notes_zh: 两项 NJS 按持久化范围、残余序列和防守关联方式划分；没有独立命令证据时不得从空白历史推断恶意。, review_notes_en: "The two NJS are divided by persistence scope, residual sequence, and defensive correlation; an empty history must not imply maliciousness without independent command evidence."}
