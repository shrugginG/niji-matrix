schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0123-001
parent_ref: NJT-0123
name:
  zh: 防御能力可用性抑制
  en: Defensive-Capability Availability Suppression
summary:
  zh: 使安全进程、服务、驱动、传感器、代理或更新功能整体停止或无法恢复，在后续行动期间移除一类防护与观察能力。
  en: Stop a security process, service, driver, sensor, agent, or update function as a whole or prevent its recovery, removing a class of protection and observation during follow-on activity.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 防御能力可用性抑制是攻击者使一个可识别的安全能力整体从工作状态转为停止、卸载、删除、禁用、无法启动或持续无法更新，并在该状态存续期间开展后续行为。直接目标是让防护或观察能力不再提供任何预期结果；被影响对象可以由多个进程、服务、驱动或代理组成，只要它们共同承载同一功能。
      en: Defensive-Capability Availability Suppression is adversary transition of an identifiable security capability from working state to stopped, unloaded, deleted, disabled, unable to start, or persistently unable to update, followed by activity while that state persists. The immediate goal is to make a protection or observation capability produce none of its expected outcomes. The affected object may consist of several processes, services, drivers, or agents when they jointly carry the same function.
    - zh: 该概念以“完整能力是否可用”为变量，而不以 kill、service control、driver unload、uninstall、Registry、云 API 或产品名划分。它服务于父技术的方式是创建范围广但通常可从心跳识别的防御空窗；若工具仍正常工作而只排除选定对象，则属于 NJS-0123-002。
      en: The variable is whether the whole capability is available, not kill, service control, driver unload, uninstall, Registry, cloud API, or product name. It serves the parent by creating a broad defensive interval that is often observable through heartbeat. When the tool remains functional but only selected objects are excluded, NJS-0123-002 applies instead.
stealth_characteristics:
  paragraphs:
    - zh: 防御能力可用性抑制使后续活动失去一整类预防、扫描、审计、告警或响应结果，行为与防御信号之间的联系因此大面积消失。攻击者通常把停用放在载荷或批量操作之前，并力图把空窗限制在足以完成目标的时间内；持续时间越短、资产越少，集中可用性看板越难把它与普通波动区分。
      en: Defensive-Capability Availability Suppression removes an entire class of prevention, scanning, audit, alerting, or response outcomes from follow-on activity, causing the behavior-to-defensive-signal link to disappear broadly. Adversaries commonly place disablement before payload or bulk activity and limit the blind interval to the time needed for the objective. The shorter the duration and smaller the asset set, the harder it is for centralized availability views to distinguish it from ordinary fluctuation.
    - zh: 完整停用仍会留下服务控制、进程退出、驱动卸载、文件或任务删除、启动类型变化、卸载记录、版本停滞和集中 heartbeat 丢失；被禁用工具无法可靠记录自身死亡，因此最有价值的证据来自操作系统、虚拟化/云管理面、独立 supervisor 与远端健康服务。若攻击者能伪造 heartbeat 或同时破坏这些观察面，缺口会被误认为离线、故障或维护。
      en: Whole disablement still leaves service control, process exit, driver unload, file or task deletion, startup-mode change, uninstall records, stalled versions, and lost centralized heartbeat. An impaired tool cannot reliably record its own death, so the most valuable evidence comes from the operating system, virtualization or cloud management plane, independent supervisor, and remote health service. If the adversary forges heartbeat or impairs those observation planes as well, the gap can be mistaken for offline state, failure, or maintenance.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入使安全能力整体不可用并持续到后续活动的停止、终止、卸载、删除、禁用自动启动、驱动或模块卸载、代理移除和恢复/更新功能破坏。需要证明组件确属该能力、变化成功生效且能力未在预期 SLO 内自动恢复；失败的终止命令只能构成尝试。
      en: Scope includes stopping, termination, uninstall, deletion, disabling autostart, driver or module unload, agent removal, and damage to recovery or update functions that make a security capability wholly unavailable through follow-on activity. Evidence must show that the components carry the capability, the change takes effect, and the capability does not automatically recover within its expected SLO. A failed termination command establishes only an attempt.
    - zh: 工具继续运行但通过排除项或规则遗漏部分对象归 NJS-0123-002；事件源仍工作但选定事件在入库前消失归 NJS-0123-003；界面错误显示健康归 NJS-0123-004。批准的升级、迁移、退役、故障恢复、资源保护或安全响应停机是正常反例，必须有 owner、工单、版本、时间、范围和预期恢复结果，不能只凭“管理员执行”降噪。
      en: A running tool that omits some objects through exclusions or rules belongs to NJS-0123-002; a working event source whose selected events disappear before storage belongs to NJS-0123-003; a falsely healthy interface belongs to NJS-0123-004. Approved upgrade, migration, retirement, failure recovery, resource protection, and incident-response shutdown are normal counterexamples and require owner, ticket, version, time, scope, and expected recovery outcome. Administrator execution alone is not a suppression condition.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 勒索软件可在枚举文件和加密前终止反病毒、EDR 或反勒索工具；入侵者可在横向移动前停用网络设备或云代理日志，在部署内核载荷前卸载传感器驱动，或阻断安全工具更新与重启，使旧的受损能力贯穿行动窗口。BlackByte 对 Raccine 的终止、卸载与任务删除是直接案例。
        en: Ransomware can terminate antivirus, EDR, or anti-ransomware tooling before file enumeration and encryption. An intruder can disable network-device or cloud-agent logging before lateral movement, unload a sensor driver before deploying a kernel payload, or block security-tool update and restart so stale impaired capability persists through the operational window. BlackByte termination, uninstall, and task deletion of Raccine is a direct case.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要对承载能力的进程、服务、驱动、文件、任务、代理或管理 API 拥有控制权限，并知道完整停用是否会触发 watchdog、篡改告警或自动恢复。高权限、脆弱签名驱动和集中管理账户可扩大效果；冗余传感器、受保护进程、不同权 supervisor、短 heartbeat 周期和强制恢复会压缩可用空窗。
          en: The adversary needs control over the processes, services, drivers, files, tasks, agents, or management APIs that carry the capability and knowledge of whether whole disablement triggers a watchdog, tamper alert, or automatic recovery. High privilege, vulnerable signed drivers, and centralized management accounts can expand the effect. Redundant sensors, protected processes, differently authorized supervisors, short heartbeat intervals, and forced recovery contract the usable interval.
    defender_model:
      paragraphs:
        - zh: 防守方从组件清单、OS/管理面状态、进程和驱动谱系、集中 heartbeat、版本/策略状态及独立活动结果观察可用性。检测需要知道组件正常重启与报到 SLO，并把缺失同控制主体和后续未受保护行为连接；只依赖本地工具告警或每日资产快照会错过短驻空窗。
          en: Defenders observe availability through component inventory, OS or management-plane state, process and driver lineage, centralized heartbeat, version and policy state, and independent activity outcomes. Detection requires normal restart and check-in SLOs and joins absence to the controlling principal and subsequent unprotected behavior. Reliance on local tool alerts or daily asset snapshots misses short-lived blind intervals.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 整体撤除防御能力使空窗内行为缺少原应存在的安全结果
      en: Remove an entire defensive capability so activity in the blind interval lacks the security outcomes that should exist
    analysis:
      paragraphs:
        - zh: 攻击者把承载同一防御功能的组件转为不可用，随后在恢复之前执行恶意步骤；本应出现的 scan、block、alert 或 audit 因功能缺席而不生成，行为痕迹只剩 OS/管理面控制事件、心跳断点和其他独立来源。短驻空窗可落在粗粒度健康检查之间，防守方若不能把组件状态与后继结果关联，就会把恶意行为视为普通未告警活动，形成行为透明。
          en: The adversary makes the components carrying one defensive function unavailable and performs malicious steps before recovery. Expected scan, block, alert, or audit outcomes are not generated because the function is absent, leaving only OS or management-plane control events, a heartbeat break, and other independent sources. A short blind interval can fall between coarse health checks. If defenders cannot join component state to follow-on outcome, the malicious behavior appears as ordinary unalerted activity, producing Behavioral Transparency.
    evidence_refs: [REF-000446, REF-000447, REF-000358]
    confidence: high
