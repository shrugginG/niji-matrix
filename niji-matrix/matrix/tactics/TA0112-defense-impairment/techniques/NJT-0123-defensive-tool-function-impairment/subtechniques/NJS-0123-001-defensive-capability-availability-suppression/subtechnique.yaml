research:
  limitations:
    paragraphs:
      - zh: BlackByte 样本直接证明 Raccine 进程、任务与注册状态被移除，支持成功的用户态能力停用；Scattered Spider 来源只记录被阻止的内核传感器篡改尝试，因此不能据此宣称成功的内核级失明。产品可能把一个功能分散在多个组件或保留云端检测，单个服务停止不等于完整能力丧失；缺少组件清单、heartbeat SLO 和对象结果时应降为控制事件或可用性异常。
        en: The BlackByte sample directly establishes removal of Raccine processes, task, and registration state and supports successful user-mode capability disablement. The Scattered Spider source records only a prevented kernel sensor-tampering attempt and cannot establish successful kernel-level blindness. A product may distribute one function across several components or retain cloud-side detection, so stopping one service does not equal whole-capability loss. Without component inventory, heartbeat SLO, and object outcome, the conclusion must remain a control event or availability anomaly.
