research:
  limitations:
    paragraphs:
      - zh: BlackByte 样本直接证明 Defender 扩展名排除与后续载荷类别之间的能力路径，Microsoft 文档证明排除项可受篡改保护并被集中检查；其他 selector 类型主要由 ATT&CK 跨平台行为和防御模型支持，尚没有同等细粒度的四平台案例。排除项存在、heartbeat 健康或对象未告警都不能单独证明恶意范围收缩，缺少旧策略和对象级 evaluation 时结论必须保持潜在暴露。
        en: The BlackByte sample directly establishes the capability path from Defender extension exclusions to follow-on payload classes, while Microsoft documentation establishes that exclusions can be tamper protected and centrally reviewed. Other selector types rely mainly on ATT&CK cross-platform behavior and the defensive model and lack equally granular cases across four platforms. An exclusion's existence, healthy heartbeat, or an unalerted object cannot independently establish malicious scope contraction; without old policy and object-level evaluation, the conclusion remains potential exposure.
