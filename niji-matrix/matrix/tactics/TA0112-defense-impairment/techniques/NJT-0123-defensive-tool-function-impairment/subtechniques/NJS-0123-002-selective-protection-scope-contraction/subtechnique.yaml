schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0123-002
parent_ref: NJT-0123
name:
  zh: 选择性防护范围收缩
  en: Selective Protection-Scope Contraction
summary:
  zh: 保持安全工具总体运行与报到，只通过排除项、规则或选择器移除攻击者选定对象的检查与阻断。
  en: Keep a security tool generally running and checking in while exclusions, rules, or selectors remove inspection and blocking only for adversary-selected objects.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 选择性防护范围收缩是攻击者修改排除项、规则、扫描方向、provider、事件类别、租户/账户/区域或资源选择器，使安全工具仍在工作并处理其他对象，却不再检查、告警或阻断攻击者选定的文件、进程、请求、身份、资源或事件。直接目标是创造窄而可预测的盲区，而非让整个产品离线。
      en: Selective Protection-Scope Contraction is adversary modification of exclusions, rules, scan direction, providers, event classes, tenant, account, Region, or resource selectors so a security tool continues operating on other objects but no longer inspects, alerts on, or blocks adversary-selected files, processes, requests, identities, resources, or events. The direct objective is a narrow predictable blind spot rather than taking the whole product offline.
    - zh: 稳定变量是实际受保护集合在变化前后的差，而不是配置介质或 selector 类型。文件扩展名排除、整盘路径排除、某条检测规则禁用和云集成资源范围缩小可以属于同一子技术；只有当它们产生可枚举的 scope_removed 且真实对象命中时，才证明已利用的范围收缩。
      en: The stable variable is the difference in the effective protected set before and after change, not the configuration medium or selector type. File-extension exclusion, whole-drive path exclusion, disabling one detection rule, and narrowing a cloud-integration resource set can belong to the same child. Exploited contraction is established only when they create an enumerable scope_removed set and a real object enters it.
stealth_characteristics:
  paragraphs:
    - zh: 选择性防护范围收缩保留产品进程、服务、heartbeat、一般事件量和大量正常检测结果，使粗粒度“工具在线”看板继续显示健康；只有攻击者选择的对象不再产生 evaluation、alert 或 block。正常背景因此掩盖局部功能缺口，防守方若不保留策略版本和对象级结果，就可能把未告警行为误判为已检查且安全。
      en: Selective Protection-Scope Contraction preserves product processes, services, heartbeat, general event volume, and many normal detection outcomes, so coarse tool-online dashboards continue to appear healthy. Only adversary-selected objects stop producing evaluation, alert, or block outcomes. Normal background masks the local functional gap, and defenders without policy versions and object-level outcomes can mistake unalerted behavior for inspected and safe behavior.
    - zh: 残余痕迹集中在高权限 writer、配置前后态、新增 exclude、禁用 rule、provider 或 integration 拆除、selector 扩张、策略版本变化，以及命中新范围对象的产品结果缺失。攻击者把 selector 设计得越贴合载荷，盲区越小越难从总事件量发现，但也越需要了解产品匹配语义并承担配置审计暴露。
      en: Residue concentrates in the privileged writer, configuration before and after state, new exclusions, disabled rules, provider or integration removal, selector expansion, policy-version change, and missing product outcomes for objects matching the new scope. The more tightly a selector fits the payload, the smaller and harder to see the blind spot becomes in aggregate event volume, but the adversary needs greater knowledge of product matching semantics and incurs configuration-audit exposure.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入工具仍总体可用且范围可从 old_policy 与 new_policy 计算的恶意排除、规则禁用、扫描方向改变、provider 拆除和资源选择器缩小。确认需要 policy writer、scope_removed、同一工具健康状态、命中对象和缺失/放行结果；只有高风险配置但尚无对象命中时属于潜在暴露。
      en: Scope includes malicious exclusions, rule disablement, scan-direction change, provider removal, and resource-selector narrowing while the tool remains generally available and effective scope can be computed from old_policy and new_policy. Confirmation requires policy writer, scope_removed, health state for the same tool, a matching object, and an absent or allowed outcome. High-risk configuration without an affected object establishes potential exposure only.
    - zh: 工具整体停止归 NJS-0123-001；代码级跳过事件而非改变策略范围归 NJS-0123-003；UI 谎报健康归 NJS-0123-004。兼容性、性能、备份、开发、隐私和事件响应可能需要真实例外，必须以 owner、业务对象、最窄范围、到期和验证样本证明；默认宽松配置若没有攻击者主动变化不属于本对象。
      en: Whole-tool stoppage belongs to NJS-0123-001, code-level event skipping rather than policy-scope change to NJS-0123-003, and a UI lying about health to NJS-0123-004. Compatibility, performance, backup, development, privacy, and incident response can require real exceptions and must be supported by owner, business object, narrowest scope, expiry, and validation sample. A permissive default without adversary-directed change is outside this object.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者可在载荷执行前为其目录、扩展名、进程或签名加入反病毒排除，禁用会阻断某种脚本或凭据访问的规则，缩小云审计集成覆盖的账户/区域/资源，或移除只负责某类事件的 provider。BlackByte 把 .JS 与 .EXE 加入 Defender 排除列表，使脚本启动器和载荷类别进入窄盲区。
        en: Before payload execution, an adversary can add its directory, extension, process, or signer to antivirus exclusions, disable a rule that would block a script or credential access, narrow cloud-audit integration coverage by account, Region, or resource, or remove a provider responsible for one event class. BlackByte added .JS and .EXE to Defender exclusions, placing its script launcher and payload classes inside a narrow blind spot.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要能够写入安全策略或影响其继承顺序，并准确了解 selector 匹配、策略优先级与目标对象属性。相比完整停用，所需权限可能相同但操作知识更高；集中受控配置、禁止本地合并、篡改保护、例外审批和对象级 evaluation 会限制效果。
          en: The adversary needs authority to write security policy or influence inheritance and accurate knowledge of selector matching, policy precedence, and target-object properties. Privilege may be similar to whole disablement but operational knowledge is greater. Centralized controlled configuration, disabled local merge, tamper protection, exception approval, and object-level evaluation constrain the effect.
    defender_model:
      paragraphs:
        - zh: 防守方需要保存完整有效策略的版本化快照，而不是只采集变化后的当前值，并能把 selector 展开为文件、进程、身份或资源集合，再与对象活动和产品 decision 关联。仅检查服务是否运行、心跳是否正常或排除项总数，会漏掉窄范围、短时和继承层中的恶意变化。
          en: Defenders need versioned snapshots of complete effective policy rather than only current post-change values, must expand selectors into file, process, identity, or resource sets, and join them to object activity and product decisions. Checking only service state, healthy heartbeat, or exclusion count misses narrow, short-lived, and inherited malicious changes.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 让选定对象穿过仍然健康的防御外观而不产生检查与阻断结果
      en: Let selected objects pass through a still-healthy defensive appearance without inspection or block outcomes
    analysis:
      paragraphs:
        - zh: 攻击者只从受保护集合中移除与载荷或行动匹配的 selector，保留工具对其他对象的日常处理；总事件量、heartbeat 和正常告警继续存在，而目标对象不再产生可关联的 evaluation 或 block。防守方若把“在线”当作“完整覆盖”，就无法看到局部行为—防御结果链已经断开，选定活动形成行为透明。
          en: The adversary removes only selectors matching its payload or operation from the protected set while preserving ordinary handling of other objects. Aggregate event volume, heartbeat, and normal alerts continue, but target objects no longer produce correlatable evaluation or block outcomes. If defenders equate online with complete coverage, they miss that the local behavior-to-defensive-outcome chain has broken and selected activity becomes behaviorally transparent.
    evidence_refs: [REF-000447]
    confidence: high
