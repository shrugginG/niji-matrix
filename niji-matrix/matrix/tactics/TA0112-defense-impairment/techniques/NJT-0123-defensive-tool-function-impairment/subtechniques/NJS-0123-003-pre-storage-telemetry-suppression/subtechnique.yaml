research:
  limitations:
    paragraphs:
      - zh: CLEANPULSE 的逆向工程直接证明特定进程和版本中的条件化日志函数跳过，并与同一报告中的事后日志清除形成清楚边界；它没有公开所有受害环境的完整 event baseline，也不证明云、Windows 与 Linux 管线使用相同控制点。预期事件模型需要现场验证，尤其是采样、隐私过滤和低频批处理；没有独立活动、event key 或阶段指标时只能确认不完整，不能把“没有日志”提升为攻击者抑制。
        en: CLEANPULSE reverse engineering directly establishes conditional logging-function bypass in a particular process and version and provides a clear boundary from post-hoc log clearing in the same report. It does not disclose complete event baselines for every victim environment or establish the same control point across cloud, Windows, and Linux pipelines. Expected-event models need local validation, especially under sampling, privacy filtering, and low-frequency batches. Without independent activity, an event key, or stage metrics, only incompleteness can be established; no log cannot be upgraded to adversary suppression.
