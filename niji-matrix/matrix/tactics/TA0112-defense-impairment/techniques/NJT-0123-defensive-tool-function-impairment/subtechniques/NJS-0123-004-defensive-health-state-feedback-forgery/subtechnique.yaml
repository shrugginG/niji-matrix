research:
  limitations:
    paragraphs:
      - zh: PHASEJAM 直接证明单一网络设备产品中的升级拦截、假进度与真实版本未恢复，但当前公开资料对普通 EDR 托盘、云控制台和其他产品 UI 的已验证在野案例较少。ATT&CK 给出跨平台检测线索，仍不能替代每个产品的 cache、版本和 canary 校准。界面与真实状态短暂不一致很常见，没有超出容差的正向声明、独立失败结果和攻击者 writer 时不得判为伪造。
        en: PHASEJAM directly establishes upgrade interception, false progress, and absent real version recovery in one network-appliance product, while public material contains fewer validated in-the-wild cases for ordinary EDR trays, cloud consoles, and other product UIs. ATT&CK provides cross-platform detection clues but does not replace product-specific cache, version, and canary calibration. Brief UI-to-state disagreement is common and cannot be classified as forgery without a positive claim beyond tolerance, an independent failed outcome, and an adversary writer.
