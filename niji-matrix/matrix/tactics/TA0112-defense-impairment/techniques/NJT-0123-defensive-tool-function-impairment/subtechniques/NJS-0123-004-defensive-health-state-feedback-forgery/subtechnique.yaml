schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0123-004
parent_ref: NJT-0123
name:
  zh: 防御健康状态反馈伪造
  en: Defensive Health-State Feedback Forgery
summary:
  zh: 让安全工具界面、管理 API 或升级流程报告健康、进度或成功，同时真实组件、版本或功能结果保持受损。
  en: Make a security-tool interface, management API, or upgrade flow report health, progress, or success while real components, versions, or functional outcomes remain impaired.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 防御健康状态反馈伪造是攻击者操纵面向操作员的 UI、托盘、CLI、管理 API、任务进度或成功响应，使其对服务状态、版本、完整性、更新或功能结果作出与真实状态不一致的正向声明。直接目标不是单纯隐藏文件或展示任意假界面，而是让负责判断防御是否健康的人或流程接受错误的安全状态。
      en: Defensive Health-State Feedback Forgery is adversary manipulation of an operator-facing UI, tray, CLI, management API, task progress, or success response so it makes a positive claim about service state, version, integrity, update, or functional outcome that disagrees with reality. The direct objective is not merely to hide a file or display an arbitrary fake interface but to make the person or workflow responsible for judging defensive health accept an incorrect security state.
    - zh: 稳定变量是 reported_state 对 real_state 的保真度。伪造图标、拦截升级并播放进度、篡改健康 API 或替换检查工具都可实现这一变量；界面技术、HTML、原生窗口和产品品牌不构成子技术边界。只有正向健康/成功声明与实际受损共同存在时才属于反馈伪造。
      en: The stable variable is the fidelity of reported_state to real_state. A forged icon, intercepted upgrade with simulated progress, tampered health API, or replaced checker can implement the variable. Interface technology, HTML, native window, and product brand do not define children. Feedback forgery requires both a positive healthy or success claim and actual impairment.
stealth_characteristics:
  paragraphs:
    - zh: 防御健康状态反馈伪造以熟悉的品牌、布局、进度和成功语义覆盖服务停止、版本未推进、完整性失败或保护结果缺失，使操作员在最需要修复时反而得到“无需行动”的信号。与单纯无日志不同，它制造可见但错误的证据，并可让正常工单自动关闭、延迟隔离或使受侵设备继续被信任。
      en: Defensive Health-State Feedback Forgery overlays service stoppage, stalled version, integrity failure, or missing protection outcomes with familiar branding, layout, progress, and success semantics, giving operators a no-action signal when remediation is most needed. Unlike mere missing logs, it creates visible but false evidence and can automatically close normal tickets, delay isolation, or keep a compromised device trusted.
    - zh: 残余痕迹是 reported_version 与 installed_version、UI progress 与 transaction outcome、健康消息与 service/process state、签名文件 hash 与批准清单、以及成功声明与 canary 结果之间的矛盾。攻击者若只替换本地 UI，独立管理面容易识别；若同时控制管理 API 和版本来源，则必须依赖离线完整性、不同启动分区或外部功能测试。
      en: Residue is disagreement between reported_version and installed_version, UI progress and transaction outcome, health message and service or process state, signed-file hash and approved inventory, or success claim and canary result. Replacement of only the local UI is readily exposed by an independent management plane. If the adversary also controls the management API and version source, offline integrity, a different boot partition, or external functional testing is required.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入对安全或完整性工具的健康、保护状态、扫描结果、升级进度、版本和成功反馈进行伪造或替换，并能证明真实组件或结果与声明不一致的行为。状态缓存短暂过期、滚动升级不同步和失败后 UI bug 只能构成产品问题，除非有攻击者 writer、代码变化、拦截路径或会话证据。
      en: Scope includes forging or replacing health, protection state, scan result, upgrade progress, version, or success feedback for a security or integrity tool when real components or outcomes demonstrably disagree with the claim. Brief stale cache, rolling-upgrade inconsistency, and a UI bug after failure are product issues unless accompanied by an adversary writer, code change, interception path, or session evidence.
    - zh: 只让工具离线而没有正向健康声明归 NJS-0123-001；heartbeat 正常但某类对象因规则排除而不受保护归 NJS-0123-002；一般钓鱼页面、品牌冒充、假系统错误和与防御健康无关的数据操纵归各自社会工程、伪装或数据操纵对象。更新被阻断但没有假成功时按功能可用性研究，不能仅因 PHASEJAM 同时具备两种行为就合并边界。
      en: Taking a tool offline without a positive healthy claim belongs to NJS-0123-001. Healthy heartbeat with objects unprotected by rule exclusion belongs to NJS-0123-002. General phishing pages, brand impersonation, fake system errors, and data manipulation unrelated to defensive health belong to their social-engineering, masquerading, or data-manipulation objects. A blocked update without false success is examined as functional availability; PHASEJAM possessing both behaviors does not collapse their boundaries.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者可在关闭端点防护后替换托盘或设置界面，修改完整性检查器使其持续返回 clean，拦截集中管理健康请求，或在设备升级被阻断时播放仿真的成功进度。PHASEJAM 修改 Ivanti DSUpgrade.pm，拦截真实升级并显示十三步 HTML 进度，使管理员以为恢复正在完成而设备仍处于攻击者控制。
        en: After disabling endpoint protection, an adversary can replace a tray or settings interface, modify an integrity checker to keep returning clean, intercept centralized health requests, or simulate successful progress while an appliance upgrade is blocked. PHASEJAM modified Ivanti DSUpgrade.pm, intercepted the real upgrade, and displayed thirteen-step HTML progress, making administrators believe recovery was proceeding while the appliance remained under adversary control.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要写入 UI/reporting 组件、hook 状态请求、控制升级流程或替换健康 authority，并知道操作员期望的布局、阶段、版本和时间。仅控制本地显示容易被管理面反证；持久伪造需要同步操纵组件清单、transaction 和返回值，成本更高且会留下 hash、signer 与流程差异。
          en: The adversary needs write access to UI or reporting components, the ability to hook state requests, control the upgrade flow, or replace the health authority, and knowledge of expected layout, stages, version, and timing. Local-display control alone is easily contradicted by the management plane. Durable forgery requires coordinated manipulation of component inventory, transaction, and return value, increasing cost and leaving hash, signer, and process differences.
    defender_model:
      paragraphs:
        - zh: 防守方把 UI 和单一 API 响应当作声明，从不同权来源读取 service/process、installed version、签名文件、boot/partition、策略和更新 transaction，并用低风险 canary 验证真实阻断或事件到达。需要定义产品缓存与重启容差；没有独立 verifier 的封闭设备只能标记状态未验证。
          en: Defenders treat UI and a single API response as claims, read service and process state, installed version, signed files, boot or partition, policy, and update transaction from a differently authorized source, and use a low-risk canary to verify real blocking or event arrival. Product cache and reboot tolerance must be defined. Closed appliances without an independent verifier can only be marked state unverified.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 用可信健康与成功外观遮蔽真实防御状态和恢复失败
      en: Cover real defensive state and recovery failure with a trusted healthy and successful appearance
    analysis:
      paragraphs:
        - zh: 攻击者保留或复制操作员熟悉的健康、进度和版本特征，同时让底层服务、组件或更新结果维持受损；真实异常不再呈现在主要决策界面，反而被正向状态替代。防守方按外观分流时会降低优先级并停止恢复，只有跨 authority 的状态与功能差分才能揭示矛盾，因此形成特征伪装。
          en: The adversary preserves or copies health, progress, and version features familiar to operators while underlying services, components, or update outcomes remain impaired. The real anomaly no longer appears in the primary decision interface and is replaced by positive state. Defenders triaging by appearance lower priority and stop recovery; only a cross-authority state and function differential reveals the contradiction, producing Feature Disguise.
    evidence_refs: [REF-000449]
    confidence: high
