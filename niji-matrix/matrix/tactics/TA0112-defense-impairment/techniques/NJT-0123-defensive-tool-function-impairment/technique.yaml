schema_version: "2.0.0"
type: technique
id: NJT-0123
name:
  zh: 防御工具功能削弱
  en: Defensive Tool Function Impairment
summary:
  zh: 攻击者使防御工具或其观察与反馈链停止、缩小、静默或错误报告健康，以降低安全控制覆盖并制造难以确认的观察缺口。
  en: Adversaries stop, narrow, silence, or falsely report the health of defensive tools and their observation chains to reduce control coverage and create difficult-to-verify visibility gaps.
aliases: [Disable or Modify Tools, T1685]
classification:
  tactic_refs: [TA0112]
  origin:
    kind: attack-retained
    source_attack_id: T1685
    source_attack_version: "19.1"
  decision_ref: DEC-TA0112-T1685
definition_and_concept:
  paragraphs:
    - zh: 防御工具功能削弱是攻击者直接改变安全工具、传感器、日志组件、分析代理、响应功能或其更新恢复路径，使原本应执行的预防、采集、判断、告警或处置能力全部或部分失效。它服务于 Defense Impairment 的方式是降低防守机制的有效性和可信度，为后续恶意行为建立攻击者已知而防守方可能未知的控制缺口。
      en: Defensive Tool Function Impairment is adversary-directed change to a security tool, sensor, logging component, analytic agent, response function, or its update and recovery path so an expected prevention, collection, decision, alerting, or response capability fails wholly or partially. It serves Defense Impairment by reducing the effectiveness and trustworthiness of defensive mechanisms and establishing a control gap known to the adversary but potentially unknown to defenders.
    - zh: 概念锚由变更前应有能力、攻击者控制的变更、受损范围、实际功能结果与残余观察构成。停止服务、修改注册表、加载驱动、调用云 API、移除代理或替换界面代码只是实现介质；只有它们直接改变安全控制能力或可信反馈时才属于本技术，工具品牌、平台和数据类型本身不定义边界。
      en: The concept is anchored in expected pre-change capability, an adversary-controlled change, impaired scope, actual functional outcome, and residual observation. Stopping a service, editing the Registry, loading a driver, calling a cloud API, removing an agent, or replacing interface code are implementation media. They enter scope only when they directly change a security control or its trustworthy feedback; product brand, platform, and data type do not define the boundary.
stealth_characteristics:
  paragraphs:
    - zh: 防御工具功能削弱改变防守方本应获得的阻断结果、事件序列、覆盖范围或健康反馈，使后续恶意活动在更少告警、更少遥测或错误健康状态下进行。其核心匿迹效果不是一般“关闭软件”，而是使真实活动与原应伴随的防御信号脱钩；最隐蔽的实现甚至让工具继续运行、报到或显示正常，只遗漏攻击者选择的对象和事件。
      en: Defensive Tool Function Impairment changes the blocking outcomes, event sequence, protection scope, or health feedback defenders should receive, allowing follow-on malicious activity to proceed with fewer alerts, less telemetry, or false healthy state. Its central stealth effect is not generic software shutdown but decoupling real activity from the defensive signals that should accompany it. The most covert implementations can leave a tool running, checking in, or appearing normal while omitting only adversary-selected objects and events.
    - zh: 攻击者仍会留下权限主体、服务与进程状态变化、配置前后态、排除项、版本停滞、心跳中断、预期事件量断点、控制面操作，以及报告状态与真实结果矛盾。不同权控制面、远程追加式留存、组件完整性度量和功能性 canary 能恢复差分；如果这些观察与工具共享同一被攻陷身份、主机、内核或管理面，防守方就可能只看到被攻击者塑造的状态。
      en: Residual traces include acting principal, service and process state changes, configuration before and after state, exclusions, stalled versions, missing heartbeats, breaks in expected event volume, control-plane operations, and contradictions between reported state and real outcome. Differently authorized control planes, remote append-oriented retention, component-integrity measurement, and functional canaries can recover the differential. If those observations share the compromised identity, host, kernel, or management plane with the tool, defenders may see only state shaped by the adversary.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入针对安全工具可用性、防护范围、遥测生成或输送、操作员健康视图及更新恢复功能的攻击者受控变更。判定需要证明目标具有防御职责、变化由攻击者实施或指使、至少一项预期能力实际受损，并说明受损如何减少、选择性遗漏或歪曲防守观察；工具仅被访问或配置发生变化而没有功能结果时，最多构成暴露或异常。
      en: Scope includes adversary-controlled changes to security-tool availability, protection scope, telemetry generation or delivery, operator health views, and update or recovery functions. Classification requires evidence that the target has a defensive role, the adversary performs or directs the change, at least one expected capability is actually impaired, and the impairment reduces, selectively omits, or distorts defender observation. Access to a tool or a configuration change without a functional outcome establishes at most exposure or anomaly.
    - zh: 禁用或修改防火墙由 T1686 负责；已写入持久存储后再删除日志、文件或关系属于 NJT-0112“选择性痕迹收敛”；只改变注册表、服务或策略但主要结果是执行、持久化、提权或认证旁路的行为归相应 owner。正常升级、故障重启、资源耗尽、许可证问题、批准的安全调优、隐私留存和产品迁移是强反例，不能仅因出现相同心跳或日志缺口就归入。
      en: T1686 owns firewall disablement or modification. Deletion of logs, files, or relationships after durable storage belongs to NJT-0112 Selective Trace Contraction. Registry, service, or policy changes whose primary result is execution, persistence, privilege escalation, or authentication bypass belong to their respective owners. Normal upgrade, failure restart, resource exhaustion, license problems, approved security tuning, privacy retention, and product migration are strong counterexamples and cannot be classified from a similar heartbeat or logging gap alone.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者常在投放载荷、横向移动、凭据操作、勒索加密、批量破坏或撤离之前，削弱端点防护、防病毒、审计系统、云监控、网络设备日志、完整性检查或集中响应功能。动作可以局限于一个主机或设备，也可以通过租户、集中管理服务、更新系统或日志管线扩大到一个资产群；后续阶段通常在攻击者确认盲区后开始。
        en: Adversaries commonly impair endpoint protection, antivirus, audit systems, cloud monitoring, network-device logging, integrity checking, or centralized response before payload delivery, lateral movement, credential operations, ransomware encryption, mass disruption, or withdrawal. The action can remain on one host or appliance or expand through a tenant, centralized management service, update system, or logging pipeline to an asset fleet. Follow-on activity commonly begins after the adversary confirms the blind area.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要足以控制防御进程、服务、驱动、配置、策略、API、代理、日志路径或界面的本地或控制面权限，并了解哪些能力、范围或状态会暴露其后续行为。其资源可以包括管理员会话、脆弱签名驱动、内存 patch、受侵集中身份或设备专用代码；主要约束是篡改保护、签名与完整性检查、不同权管理、远程副本、自动恢复和过度停用造成的显著心跳缺口。
          en: The adversary needs local or control-plane authority over defensive processes, services, drivers, configuration, policy, APIs, agents, logging paths, or interfaces and knowledge of which capability, scope, or state would expose follow-on behavior. Resources may include an administrator session, vulnerable signed driver, memory patch, compromised centralized identity, or appliance-specific code. Principal constraints are tamper protection, signing and integrity checks, differently authorized management, remote copies, automatic recovery, and conspicuous heartbeat loss from excessive disablement.
    defender_model:
      paragraphs:
        - zh: 防守模型假定至少存在一个与被削弱工具不同权的观察面，可提供配置与服务状态、独立资产活动、代理 heartbeat、事件计数、策略版本、签名组件或功能测试，并能按资产、工具实例、版本、主体、请求和时间关联。若组织只保留同一产品的本地 UI、当前配置或单一路径日志，则“无告警”和“健康”都不可验证；资产清单、时钟或版本谱系不完整还会把维护、故障和攻击混为一体。
          en: The defender model assumes at least one observation plane authorized differently from the impaired tool that provides configuration and service state, independent asset activity, agent heartbeat, event counts, policy version, signed components, or functional tests and can correlate by asset, tool instance, version, principal, request, and time. If an organization retains only the same product's local UI, current configuration, or single-path logs, neither no alert nor healthy is verifiable. Incomplete asset inventory, clocks, or version lineage also conflates maintenance, failure, and attack.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 削弱观察链使后续恶意行为不再产生或上送原有防御信号
      en: Impair the observation chain so follow-on malicious behavior no longer produces or delivers expected defensive signals
    analysis:
      paragraphs:
        - zh: 攻击者先停止一个防御能力、收缩其覆盖范围，或在持久存储前让选定事件跳过生成和输送；后续恶意行为因此不再与原本应有的扫描、阻断、告警或日志结果成对出现。完整“行为—防御判断—记录”链被压缩为组件状态变化、策略差分、心跳缺口或独立来源中的孤立后继行为，防守方如果只查询受损工具就会把活动解释为未发生或正常。
          en: The adversary first stops a defensive capability, contracts its coverage, or causes selected events to skip generation and delivery before durable storage. Follow-on malicious behavior no longer pairs with the scan, block, alert, or log outcome that should exist. The complete behavior-to-defense-decision-to-record chain contracts into a component-state change, policy differential, heartbeat gap, or isolated follow-on action in an independent source. Defenders querying only the impaired tool can interpret the activity as absent or normal.
        - zh: 完整停用使信号广泛消失但更容易形成心跳异常；选择性范围与事件抑制保留正常背景，只让攻击者选定对象透明，匿迹更强但要求更精确的配置或代码控制。两者都属于行为透明，因为被隐藏的是恶意行为与防御结果之间的可观察联系，而不是保留内容的可读性。
          en: Whole disablement removes signals broadly but creates a more conspicuous heartbeat anomaly. Selective scope and event suppression preserve normal background and make only adversary-selected objects transparent, producing stronger stealth at the cost of more precise configuration or code control. Both are Behavioral Transparency because the hidden element is the observable link between malicious behavior and defensive outcome, not the readability of retained content.
    evidence_refs: [REF-000446, REF-000447, REF-000448, REF-000358]
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 伪造健康或成功反馈使受损防御继续呈现正常外观
      en: Forge healthy or successful feedback so an impaired defense retains a normal appearance
    analysis:
      paragraphs:
        - zh: 攻击者把操作员可见的健康、进度、版本或成功状态与真实服务、组件和结果分离，使未升级或已受损的工具继续呈现熟悉的正常外观。此时痕迹不是单纯缺失，而是两个观察面相互矛盾；防守方如果把本地 UI 或同一管理 API 当作权威，就会延迟调查、修复和隔离。
          en: The adversary separates operator-visible health, progress, version, or success state from the real service, components, and outcome, leaving an unupgraded or impaired tool with a familiar normal appearance. The trace is not mere absence but contradiction across observation planes. Defenders that treat a local UI or the same management API as authoritative delay investigation, remediation, and isolation.
    evidence_refs: [REF-000449]
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 子技术按攻击者稳定控制的防御链变量和恢复方法分为四项。NJS-0123-001 改变整个能力是否可用，主要残留为组件状态与 heartbeat；NJS-0123-002 保持工具运行但改变哪些对象受保护，主要残留为策略版本与对象级结果；NJS-0123-003 改变选定活动是否在持久存储前形成事件，恢复依赖独立活动与管线阶段；NJS-0123-004 改变操作员看到的状态是否忠实反映真实功能，恢复依赖不同权状态和 canary。
        en: Four children partition stable adversary-controlled variables in the defensive chain and their recovery methods. NJS-0123-001 changes whether the whole capability is available and leaves component state and heartbeat as principal residue. NJS-0123-002 keeps the tool running but changes which objects are protected, leaving policy versions and object-level outcomes. NJS-0123-003 changes whether selected activity forms an event before durable storage and requires independent activity and pipeline stages for recovery. NJS-0123-004 changes whether operator-visible state faithfully represents real function and requires differently authorized state plus canaries.
      - zh: 平台、产品、进程/服务/驱动停止方式、日志类型和 ATT&CK 子项名称均不是兄弟边界。已持久化历史的事后擦除由 NJT-0112 负责；纯版本降级由 T1689 研究；更新阻断只有在造成整体功能不可用或伪造成功反馈时才分别归入第一或第四子项。四项可以组合，但检测和缓解仍以各自残余痕迹为准。
        en: Platform, product, process versus service versus driver stop method, log type, and ATT&CK child names are not sibling boundaries. NJT-0112 owns post-hoc erasure of durable history, and T1689 will examine version downgrade as the direct object. Update blocking enters the first child only when it makes the capability unavailable or the fourth when it forges success feedback. The four variables may combine, but detection and mitigation remain grounded in their distinct residue.
  coverage: established
  subtechnique_refs: [NJS-0123-001, NJS-0123-002, NJS-0123-003, NJS-0123-004]
defense:
  detections:
    coverage: available
    strategy_refs: [DET-000130, DET-000131]
  mitigations:
    coverage: available
    mitigation_refs: [MIT-000121]
evidence:
  claim_refs: [CLM-000658, CLM-000659, CLM-000660, CLM-000661, CLM-000662, CLM-000663, CLM-000664]
  case_refs: [CASE-000166, CASE-000167, CASE-000168]
  reference_refs: [REF-000446, REF-000447, REF-000448, REF-000449, REF-000450, REF-000358]
research:
  limitations:
    paragraphs:
      - zh: BlackByte 样本直接证明排除范围收缩与安全工具停用，CLEANPULSE 逆向工程直接证明日志函数条件化跳过，PHASEJAM 直接证明假升级反馈；这些案例分别支持四项变量，但不能证明所有产品、平台和攻击者具有相同控制路径。Scattered Spider 来源记录的是被产品阻止的内核传感器篡改尝试，只能证明意图、控制面和防守对象，不能当作已成功失明。
        en: The BlackByte sample directly establishes exclusion-scope contraction and security-tool disablement, CLEANPULSE reverse engineering directly establishes conditional logging-function bypass, and PHASEJAM directly establishes false upgrade feedback. These cases support the four variables but do not show that every product, platform, or adversary has the same control path. The Scattered Spider source records kernel sensor tampering prevented by the product and establishes intent, control surface, and defensive object, not completed blindness.
      - zh: 遥测缺失、心跳消失、工具崩溃和配置变化都有大量正常原因；没有变更主体、前后态或独立活动结果时，只能标记完整性未知。DET/NJA 的字段是可实施的规范模型，具体产品可能不提供对象级 decision、管线 stage 或独立版本接口，现场部署必须降低置信度而不能用推测补字段。人工评审还需验证“入库前”与“事后擦除”、T1685 与 T1686/T1689 的边界是否在更多设备报告中保持稳定。
        en: Missing telemetry, lost heartbeat, tool crash, and configuration change have many normal causes. Without a changing principal, before-and-after state, or independent activity outcome, only integrity unknown is justified. DET and NJA fields form an implementable canonical model, but some products lack object-level decisions, pipeline stages, or an independent version interface. Deployment must lower confidence rather than invent missing fields. Human review must also test whether the pre-storage versus post-hoc-erasure boundary and the boundaries among T1685, T1686, and T1689 remain stable across additional appliance reporting.
