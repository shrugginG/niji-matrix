research:
  limitations:
    paragraphs:
      - zh: CISA 直接披露脚本关闭主机防火墙并开放远程入口，却没有公开每条入站 RDP 会话的基线拒绝结果，因此可确认恶意姿态变化，逐会话影响仍需本地数据。云安全组解绑、网络设备 zone 关闭和虚拟化 profile 停用在逻辑上可形成同类变量，但不同平台的审计覆盖和自动恢复不同；不能把单一 Windows 事件外推为所有边界上的等价可见性。
        en: CISA directly discloses a script disabling the host firewall and opening remote access but not each inbound RDP session's baseline deny outcome, so malicious posture change is confirmed while per-session effect still needs local data. Cloud-security-group detachment, network-device zone shutdown, and virtualization-profile disablement can logically form the same variable, but audit coverage and automatic restoration vary by platform. One Windows event cannot be generalized into equivalent visibility across every boundary.
