schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0124-001
parent_ref: NJT-0124
name: {zh: 广域防火墙姿态压低, en: Broad Firewall Posture Suppression}
summary: {zh: 停用整个防火墙或宽范围 profile、zone、默认拒绝策略，让多个原应被阻断的路径同时可达。, en: "Disable an entire firewall or broad profile, zone, or default-deny policy so multiple formerly blocked paths become reachable together."}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 广域防火墙姿态压低是攻击者关闭整个系统防火墙、停用一个覆盖多服务的 profile/zone、撤除默认拒绝或移除宽范围策略，使一组而非单个精确匹配的网络路径失去过滤。直接目标是在后续远程访问、横向移动或载荷阶段扩大可用通路；“广域”由有效受控流量集合定义，不由被修改的规则条数定义。
      en: Broad Firewall Posture Suppression is adversary disablement of an entire system firewall, a profile or zone spanning multiple services, a default-deny posture, or another broad policy so a set of network paths rather than one precise match loses filtering. The direct objective is to widen usable routes for later remote access, lateral movement, or payload action. Broad is defined by the effective controlled traffic set, not the number of rules edited.
    - zh: 一条 allow-any 规则可形成广域姿态压低，停用多个小规则却可能只形成局部例外；归类依据仍是前后有效拒绝集合的规模与受影响服务多样性。CISA 的 enu.cmd 事件记录了整体关闭防火墙并开放远程入口，提供直接行为锚点。
      en: One allow-any rule can create broad posture suppression, while disabling several narrow rules can still create only a local exception. Classification rests on the scale of the effective denied-set difference and diversity of affected services. CISA's enu.cmd account records whole-firewall shutdown and remote-entry opening as a direct behavior anchor.
stealth_characteristics:
  paragraphs:
    - zh: 广域防火墙姿态压低让许多本应被拒绝的连接变为允许，减少防火墙拒绝与后继入站活动的对应信号。它为攻击者迅速建立网络空窗，但不像精确开口那样隐藏在大量正常拒绝中；profile 停用、默认动作反转、拒绝量骤降和多个服务同时可达，都会构成明显残余。
      en: Broad Firewall Posture Suppression turns many connections expected to be denied into allowed traffic and removes the expected pairing of firewall denial with later inbound activity. It rapidly establishes a network blind interval but does not hide among normal denials as a scoped opening can. Profile disablement, default-action reversal, falling deny volume, and simultaneous reachability of several services remain conspicuous residue.
    - zh: 匿迹效果取决于防守方是否只看目标端点告警或将防火墙“服务仍运行”误作策略生效。独立管理面、边界探针与变更前策略可快速恢复差异；攻击者可能把停用限制在短时或小资产群，但时间和资产范围的缩小只是该广域变量的实施强度，不会抹去整体状态变化。
      en: The stealth effect depends on whether defenders watch only endpoint alerts or mistake a running firewall service for effective policy. Independent management, boundary probes, and prior policy quickly recover the difference. An adversary may confine disablement to a short interval or small asset fleet, but narrower time and asset scope change the intensity of the broad variable, not its whole-state transition.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入经攻击者控制且使多个基线拒绝路径转为可通的 profile、zone、默认动作或大范围规则变化。成功判定需要有效策略前后态与至少一条真实越界会话；只运行关闭命令但被受管策略覆盖、服务自动恢复或资产并无命中流量时，分别属于失败尝试或暴露。
      en: Scope includes attacker-controlled changes to a profile, zone, default action, or broad rule that make multiple baseline-denied paths passable. Confirmation requires effective-policy before-and-after state and at least one real boundary-crossing session. A shutdown command overridden by managed policy, automatically restored service, or no matching asset traffic remains a failed attempt or exposure respectively.
    - zh: 精确来源/目标例外归 NJS-0124-002，正常端口到隐藏监听的策略路径错位归 NJS-0124-003。灾备、主备切换、隔离规则撤销和受控维护可能临时放宽全局策略，必须核实 owner、工单、时限、替代控制与回滚；仅因拒绝日志下降但网络流量也下降，不得判为广域关闭。
      en: A precise source or target exception belongs to NJS-0124-002, and policy-path mismatch from an ordinary port to a hidden listener belongs to NJS-0124-003. Disaster recovery, failover, isolation-rule removal, and controlled maintenance can temporarily widen global policy and require owner, ticket, time limit, compensating control, and rollback. Fewer deny logs when traffic also falls do not establish broad shutdown.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 拿到主机管理员或设备管理权后，攻击者可在计划远程操作之前整体关闭主机防火墙、把一个接口的默认阻断改为允许，或临时撤下覆盖多个服务的云/设备策略。Dragonfly 相关事件中的关停与远程入口开放展示了此类先削弱边界、再利用路径的顺序。
        en: After host or device administration is obtained, an adversary can disable a host firewall before planned remote action, turn an interface's default deny into allow, or temporarily remove cloud or device policy covering multiple services. The shutdown and remote-entry opening in the Dragonfly-related case illustrates weakening the boundary before using a path.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需有覆盖 profile、zone 或全局规则的权限，并知道哪个边界阻止后续流量；还要在独立告警与运维自动修复之前完成行动。集中策略强制、不同权云角色、设备配置签名及外部可达性探针会压缩可用窗口。
          en: The adversary needs authority over a profile, zone, or global rule and knowledge of which boundary blocks later traffic, then must act before independent alerts or automated operations restore it. Centrally enforced policy, differently authorized cloud roles, signed device configuration, and external reachability probes compress the usable interval.
    defender_model:
      paragraphs:
        - zh: 防守方需知道原本应拒绝的多个来源—服务组合，记录 profile 状态、默认动作、规则集合、资源绑定、拒绝事件与独立握手结果，并保持变更前版本。只采集当前服务状态或单个开放端口，不足以区分恶意广域关停与批准的故障切换。
          en: Defenders need several source-to-service pairs expected to be denied and retain profile state, default action, rule set, resource attachment, deny events, independent handshake results, and the prior version. Current service state or one open port cannot distinguish malicious broad shutdown from approved failover.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 广域过滤失效使多个后继会话失去应有的拒绝信号, en: Broad filtering failure removes expected deny signals from multiple follow-on sessions}
    analysis:
      paragraphs:
        - zh: 攻击者使一个广域执行边界从默认拒绝转为允许或不执行，多个原本受限的请求于是成功进入。拒绝事件、受控路径与后继服务活动的正常因果链被截断；防守方若没有有效策略前态和独立流量，就可能把成功会话当成原本允许的业务流量，形成行为透明。相较精确规则开口，广域状态异常较容易暴露，因此效果依赖短时间窗或弱健康监测。
          en: The adversary changes a broad enforcement boundary from default deny to allow or nonenforcement, and multiple formerly restricted requests then succeed. The normal causal chain of deny events, controlled path, and later service activity is cut. Without prior effective policy and independent flow, defenders may treat successful sessions as traffic that was always allowed, producing Behavioral Transparency. Compared with a precise rule opening, broad state anomalies are easier to see, so the effect depends on a brief interval or weak health monitoring.
    evidence_refs: [REF-000452, REF-000451]
    confidence: high
