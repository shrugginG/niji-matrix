research:
  limitations:
    paragraphs:
      - zh: BPFDoor 的来源限定规则直接证明局部开口，但同一实验还包含 NAT 重定向，不能把每个精确规则例外都解释为同样的后门路径。云与 Windows 官方资料说明可见的配置审计，不提供攻击者实际会话结果。若规则没有生效、没有命中或旧策略本就允许该流量，最多是异常变更而非已确认边界削弱；此子项因此把一般化置信度保持为中等。
        en: BPFDoor directly establishes a source-limited opening, but the same experiment also uses NAT redirection, so not every precise exception can be assumed to have the same backdoor path. Cloud and Windows official material establish visible configuration audit, not a real adversary session outcome. If the rule does not take effect, is not hit, or the old policy already allowed the traffic, the result is at most an anomalous change rather than confirmed boundary impairment. Generalized confidence for this child is therefore medium.
