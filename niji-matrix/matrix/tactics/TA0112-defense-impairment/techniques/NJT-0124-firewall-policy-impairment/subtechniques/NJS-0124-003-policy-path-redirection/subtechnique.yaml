research:
  limitations:
    paragraphs:
      - zh: BPFDoor 的可复现实验明确展示 pre/post-NAT 错位及其他来源正常响应，但其公开演示关闭了真实植入所用加密，不能把演示中可见协议内容当作检测条件。Mandiant 对 TABLEFLIP 的现场调查提供独立案例，但其设备和进程日志可见性与普通 Linux 主机不同；没有规则命中、conntrack 或真实进程映射时，只能认定可疑路径，不能断言具体后门接收者。
        en: The reproducible BPFDoor demonstration explicitly shows pre/post-NAT mismatch and normal responses to other origins, but disables encryption used by the real implant, so visible demo protocol content is not a valid detection condition. Mandiant's TABLEFLIP field investigation provides an independent case, but appliance and process-log visibility differs from an ordinary Linux host. Without rule hit, conntrack, or real process mapping, only a suspicious path can be established, not a particular backdoor receiver.
