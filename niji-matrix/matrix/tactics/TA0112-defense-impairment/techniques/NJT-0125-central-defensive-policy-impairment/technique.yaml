schema_version: "2.0.0"
type: technique
id: NJT-0125
name: {zh: 集中防御策略削弱, en: Central Defensive-Policy Impairment}
summary: {zh: 攻击者改写域或租户的权威安全策略，使受信消费者应用后实际降低多个目标的防护、审计或响应能力。, en: "Adversaries rewrite authoritative domain or tenant security policy so trusted consumers actually reduce protection, audit, or response capability across targets."}
aliases: [Domain or Tenant Policy Modification, T1484]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1484, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1484
definition_and_concept:
  paragraphs:
    - zh: 集中防御策略削弱是攻击者在域、目录或身份租户的权威管理面创建或修改安全策略版本，让目标设备、身份组件或受信管理代理消费后降低原本应启用的检测、审计、阻断或响应功能。直接目标是经中心控制面改变防御结果；一个 GPO 或租户 API 写入只有被目标采用并产生功能下降时才构成完成的防御削弱。
      en: Central Defensive-Policy Impairment is adversary creation or modification of an authoritative security-policy version in a domain, directory, or identity-tenant management plane so target devices, identity components, or trusted management agents consume it and reduce detection, audit, blocking, or response functions that should remain enabled. The direct goal is to change defensive outcomes through a central control plane. A GPO or tenant API write becomes completed impairment only after target adoption and functional decline.
    - zh: 本对象以“权威版本—作用域—受信消费者—实际防御效果”为概念链，区别于本地服务停止、单一工具排除项或普通配置发布。GPO 的 AD 容器、SYSVOL 模板、link 与版本，或租户策略对象、目标组与传播状态，是实现该链的组成部分；文件格式、API 名称和 GPO/trust 标签不是独立匿迹子项。
      en: The concept is an authoritative-version-to-scope-to-trusted-consumer-to-real-defensive-effect chain, distinct from local service stoppage, one tool exclusion, or ordinary configuration release. A GPO's AD container, SYSVOL template, link, and version—or a tenant policy object, target group, and propagation state—are components of that chain. File format, API name, and GPO versus trust label are not independent stealth children.
stealth_characteristics:
  paragraphs:
    - zh: 集中防御策略削弱把攻击者的一次控制面写入与众多目标上的防护缺口分置于不同时间、主机和日志域。端点侧可能只显示正常 Group Policy 客户端或受信管理代理应用设置，控制面侧只显示策略版本变化；若防守方分别信任这些正常组件且不按版本追踪消费者，原始 writer 与实际失防对象之间的因果关系会模糊。
      en: Central Defensive-Policy Impairment places one adversary control-plane write and defensive gaps on many targets in different times, hosts, and log domains. Endpoint records may show only a normal Group Policy client or trusted management agent applying settings, while the control plane shows only a policy-version change. Defenders that trust each ordinary component separately without following versions to consumers lose the causal link between original writer and actually unprotected objects.
    - zh: 残余痕迹包括旧新策略内容、AD 与 SYSVOL 版本一致性、link/filter 作用域、writer 会话、复制和刷新记录、目标实际采用版本、篡改保护拒绝事件以及防御功能测试。中央策略被创建或刷新并不保证安全工具真的关闭；现代篡改保护可能使管理面看似成功而工具仍受保护，这一相反结果必须保留。不可变版本和消费者侧不同权状态可以限制匿迹收益。
      en: Residue includes old and new policy content, AD-to-SYSVOL version consistency, link and filter scope, writer session, replication and refresh records, version actually consumed by targets, tamper-protection rejection events, and defensive-function tests. A central policy being created or refreshed does not guarantee the security tool shut down. Modern tamper protection can leave management activity apparently successful while the tool stays protected, and that opposite outcome must be preserved. Immutable versions and differently authorized consumer-side state limit the stealth benefit.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入攻击者控制的域或租户权威安全策略变更，只有作用域命中目标、消费者采用恶意版本、且有效防护/审计/响应状态相对旧版本下降时，才确认本技术完成。策略已写入但没有传播、目标不在作用域或被篡改保护挡住时，只记录尝试、暴露或受阻结果，不能为了战术映射宣称成功。
      en: Scope includes adversary-controlled changes to authoritative domain or tenant security policy. Completion requires target inclusion in scope, consumer adoption of the malicious version, and a decline in effective protection, audit, or response state relative to the old version. A policy written but not propagated, a target outside scope, or a change blocked by tamper protection remains an attempt, exposure, or blocked outcome rather than a success inferred from tactic mapping.
    - zh: 只获得新增资源权限归 NJT-0100；认证证明或 MFA 例外归 NJT-0093，账户授权边归 NJT-0083；策略投递的计划任务、脚本与勒索载荷归执行或影响对象。若同一中心策略确实关闭安全工具，可同时记录 NJT-0123 的受损工具结果，但本对象关注发布—消费的来源分离，不按工具品牌复制。批准的域迁移、策略更新、证书轮换和应急排障需 owner、工单、范围、预期版本及回滚证据。
      en: Newly gained resource authority belongs to NJT-0100, authentication-proof or MFA exceptions to NJT-0093, account-authorization edges to NJT-0083, and policy-delivered tasks, scripts, or ransomware to execution or impact objects. If the same central policy actually disables a security tool, the tool outcome can also be recorded under NJT-0123, but this object concerns separation of publication and consumption provenance rather than duplicating product brands. Approved domain migration, policy update, certificate rotation, and emergency troubleshooting require owner, ticket, scope, expected version, and rollback evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者在准备勒索或广域远程操作时，可借被盗域管理员或错误委派的 GPO 写权发布关闭实时保护、行为监控或审计的设置，等待目标设备刷新后再投放载荷。Microsoft 2026 调查观察到攻击者先创建 Defender 篡改 GPO，再发布计划任务与载荷，但 Defender 的防护阻断了相关传播；该事件显示企图与中心扇出，而非完成的 GPO 路径失防。
        en: Before ransomware or broad remote operations, an adversary can use stolen domain administration or misdelegated GPO write authority to publish settings that turn off real-time protection, behavior monitoring, or audit and wait for target refresh before delivering payloads. Microsoft's 2026 investigation observed the actor first create a Defender-tampering GPO and then publish a task and payload, but Defender blocked the relevant propagation. The incident shows the attempt and central fan-out, not completed protection loss through the GPO path.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需有策略对象、模板、link 或租户安全设置写权，能理解版本、复制、优先级与目标 filter，并愿意等待消费者刷新。它可能利用受信发布机制减少逐主机操作，却必须承受控制面审计、SYSVOL 版本不一致、目标离线、篡改保护、分阶段部署和被防守方抢先加固的风险。
          en: The adversary needs write authority over policy object, template, link, or tenant security setting, knowledge of versions, replication, precedence, and target filters, and tolerance for consumer refresh delay. Trusted distribution can reduce per-host actions but exposes the operator to control-plane audit, inconsistent SYSVOL versions, offline targets, tamper protection, staged rollout, and defender hardening before application.
    defender_model:
      paragraphs:
        - zh: 防守方能读取不可变的策略旧新版本、目录与模板两部分、writer 与审批、链接和目标 filter、复制与设备刷新、目标采用版本及独立安全工具状态。单独看 5136 事件只能证明目录属性改变，单独看目标保护下降也不能找到原始 writer；必须把对象版本、作用域和实际功能结果连成一条链。
          en: Defenders can read immutable old and new policy versions, directory and template components, writer and approval, links and target filters, replication and device refresh, consumed target version, and independent security-tool state. Directory event 5136 alone proves an attribute change, while target protection decline alone cannot identify the original writer. Object version, scope, and real functional outcome must be joined into one chain.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 受信策略传播把攻击者写入与多目标失防拆成不同观察面, en: Trusted policy propagation separates the adversary write from defensive loss across many target observation planes}
    analysis:
      paragraphs:
        - zh: 攻击者在中心对象中写入防御弱化版本，复制器和受信策略客户端随后代表正常管理链传播并消费。攻击痕迹从逐主机安全工具修改转为控制面一次 writer event 与端点多处普通策略应用；缺少版本和目标作用域连接时，防守方会把端点失防看成合规发布或本地故障，形成跨信任边界的行为透明。只有消费者实际功能下降时，此因果链才闭合。
          en: The adversary writes a defense-weakening version into a central object, and replicators plus trusted policy clients later propagate and consume it as part of an ordinary management chain. Traces shift from per-host security-tool edits to one control-plane writer event and many routine endpoint policy applications. Without version and target-scope joins, defenders may attribute endpoint protection loss to compliant rollout or local failure, creating behavioral transparency across a trust boundary. The chain closes only when consumer function actually declines.
    evidence_refs: [REF-000338, REF-000341, REF-000344]
    confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 当前正式范围不建立 NJS。GPO 与信任设置只是中心策略的不同实现形式，不能凭载体不同推断防守观察变量不同；一次中心写入由多个受信消费者应用是父级共同核心。选择性排除部分目标或在受损后迅速回退版本，都还需要精确的作用域、消费者结果和残余防御状态证据，现有公开案例不足以把它们确立为稳定兄弟项。
        en: No NJS is established in the current formal scope. GPO and trust settings are different implementation forms of central policy, and a different carrier alone does not establish a different defender-observation variable. One central write applied by many trusted consumers is the common parent core. Selectively excluding some targets or rapidly reverting a version after impairment still requires precise scope, consumer outcomes, and residual defensive-state evidence; available public cases do not establish them as stable siblings.
      - zh: NJT-0100 已对实际权限增加的用后策略回退建立不同结果对象，不能借同一 ATT&CK 描述把它复制为 TA0112 子项。未来若出现直接事件证明中心策略的特定范围、残余痕迹及防守方法独立，需重新审查 taxonomy；目前零子项是证据与边界裁决，不表示域/租户平台没有差异。
        en: NJT-0100 already has a different outcome object for post-use policy reversion that actually adds authority, and the same ATT&CK description cannot be copied into a TA0112 child. Direct future evidence of a central defensive policy's distinct scope, residue, and defensive method should reopen taxonomy. Zero children now is an evidence and boundary decision, not a claim that domain and tenant platforms are identical.
  coverage: none-justified
  subtechnique_refs: []
defense:
  detections: {coverage: available, strategy_refs: [DET-000134]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000123]}
evidence:
  claim_refs: [CLM-000671, CLM-000672, CLM-000673, CLM-000674]
  case_refs: [CASE-000126]
  reference_refs: [REF-000338, REF-000339, REF-000340, REF-000341, REF-000342, REF-000344, REF-000450]
research:
  limitations:
    paragraphs:
      - zh: ATT&CK 与 Microsoft 平台文档直接支持中心策略发布、GPO 双组件复制、目录变更审计及篡改保护效果。Microsoft 2026 事件直接支持攻击者对 Defender 的策略篡改企图，但防守方阻断了 GPO 路径；不能用随后的并行 SMB 勒索结果证明 GPO 目标失防。正式父级因此描述具备明确效果门槛的行为类别，机制置信度为中等，而不把此案例升格为成功实例。
        en: ATT&CK and Microsoft platform documentation directly support central policy publication, dual-component GPO replication, directory-change audit, and tamper-protection behavior. Microsoft's 2026 incident directly supports an adversary attempt to tamper with Defender policy, but defenders blocked the GPO path. Concurrent SMB ransomware outcomes cannot prove that GPO targets lost protection. The formal parent therefore describes a behavior class with an explicit effect gate and medium mechanism confidence rather than promoting this case to a successful instance.
      - zh: 域与租户消费遥测可见性不同，且目录 5136 依赖目标 SACL，某些产品无法报告精确采用版本或功能性 canary。策略成功消息可能被篡改保护覆盖；没有 old/new、实际命中作用域和目标保护结果时，应保留 mutation_only 或 unresolved。作用域例外与短时回退目前只在规划中作为证据不足假设，人工评审需特别审查零子项结论。
        en: Domain and tenant consumer visibility differs, directory event 5136 depends on target SACLs, and some products cannot report exact adopted version or a functional canary. A policy-success message can be overridden by tamper protection. Without old and new state, actually matched scope, and target protection outcome, retain mutation_only or unresolved. Scoped exceptions and brief reversion remain evidence-insufficient hypotheses in planning, and human review should scrutinize the zero-child conclusion.
