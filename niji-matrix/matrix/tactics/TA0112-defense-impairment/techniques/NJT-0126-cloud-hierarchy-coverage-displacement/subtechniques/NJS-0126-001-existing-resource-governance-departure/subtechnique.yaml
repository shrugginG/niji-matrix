schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0126-001
parent_ref: NJT-0126
name:
  zh: 既有资源治理迁离
  en: Existing-Resource Governance Departure
summary:
  zh: 将已有云账户或项目移出受管祖先，使同一资源继续运行但不再受原组织日志或继承控制覆盖。
  en: Move an existing cloud account or project out of a governed ancestor so the same resource keeps running but loses former organization logging or inherited controls.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 既有资源治理迁离是攻击者改变已受管账户、订阅或项目的 parent 或 organization 关系，使稳定的资源身份离开原来的组织 trail、检测注册或安全策略祖先，同时让工作负载继续运行。直接目标是把原本连续可见的活动后半段移到旧观察边界之外，而非创建一个全新资源或删除历史记录。
      en: Existing-Resource Governance Departure is adversary change to the parent or organization relationship of a governed account, subscription, or project. A stable resource identity leaves its former organization trail, detection enrollment, or security-policy ancestor while its workload continues. The immediate goal is to move the latter part of previously visible activity beyond the old observation boundary, not to create a wholly new resource or delete historical records.
    - zh: 该子项由同一 resource_id 的旧新祖先关系及继承控制连续性定义。AWS 成员账户离开组织与 Google Cloud 项目换父组织是不同实现；若目的位置立即提供等效控制，则不存在防御覆盖位移。
      en: This child is defined by old and new ancestry and inherited-control continuity for the same resource_id. An AWS member account leaving its organization and a Google Cloud project changing parent organization are distinct implementations. If the destination immediately supplies equivalent controls, there is no defensive-coverage displacement.
stealth_characteristics:
  paragraphs:
    - zh: 既有资源治理迁离使旧组织 trail 中同一资源的事件序列突然停在成员变化附近，而资源 ID、应用服务和计费关系可能继续存在。只查询原组织日志的防守方容易把沉默当作活动终止、资产离线或项目退役，无法关联迁移后仍发生的云 API 与网络操作。
      en: Existing-Resource Governance Departure makes the old organization trail's event sequence for the same resource stop near a membership change, while resource ID, application service, and billing relationship may persist. Defenders querying only former-organization logs can mistake silence for stopped activity, outage, or retirement and fail to join cloud API and network actions that continue after migration.
    - zh: 管理账户的成员离开事件、旧日志的 last_seen、目的组织的 first_seen、祖先路径版本、继承策略差分和继续运行的工作负载是残余。AWS 文档明确历史日志仍留在旧仓库，缺口只涉及新事件；目的组织可能有更强控制，因此不经两侧核对不能宣称整体失明。
      en: Residue includes the management account's membership-departure event, last_seen in the old trail, first_seen in the destination, ancestor-path versions, inherited-policy differences, and continuing workload activity. AWS documents that historical logs remain in the old store, so the gap concerns new events only. The destination may have stronger controls; complete blindness cannot be claimed without comparing both sides.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入攻击者使一个已有受管节点迁离到防御较弱的祖先，并证明该节点在原集中日志、guardrail 或检测覆盖降低后的窗口继续活动。只有 LeaveOrganization 请求成功或项目移动记录、却没有有效控制差或后继操作，只能记为层级变更或潜在暴露。
      en: Scope includes adversary movement of an existing governed node to a weaker defensive ancestor with continuing activity in the interval after former central logging, guardrail, or detection coverage declines. A successful LeaveOrganization request or project-move record without an effective control difference or later action establishes only hierarchy change or potential exposure.
    - zh: 新节点在治理注册前首用归兄弟 NJS-0126-002；仅改策略正文而不动祖先关系归 NJT-0125；对单个 VM 或快照造成取证状态变化归 T1578 候选。经批准的并购、组织拆分与项目迁移会产生相似断点，需以来源和目的 owner、迁移计划、预期策略及验证结果排除。
      en: First use of a new node before enrollment belongs to sibling NJS-0126-002. Editing policy text without changing ancestry belongs to NJT-0125. A forensic-state change to one VM or snapshot belongs to the T1578 candidate. Approved mergers, organization splits, and project migrations create similar breaks and require source and destination owners, a migration plan, expected controls, and validation outcome as counterevidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 掌握成员账户或项目迁移权限的攻击者可能在已有工作负载运行时更改其组织归属，随后继续使用该工作负载进行云 API 或网络活动。AWS 的组织 trail 在成员离开后不再接收该账户的新事件；Google Cloud 项目迁移可保持项目和服务身份，却立即切换继承的组织策略。两者都只有在目的控制更弱时才构成本子项。
        en: An adversary with member-account or project-move authority can change organizational parentage while an existing workload runs and continue its cloud API or network activity afterward. An AWS organization trail stops receiving new events for an account after departure. A Google Cloud project move retains project and service identity but immediately changes inherited organization policy. Either is this child only if destination controls are weaker.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要成员离开或项目迁移权限、满足独立运行的资料，并了解来源与目的祖先在 SCP、组织日志和策略上的差异。管理账户可阻止离开，目的组织可能要求接受或验证，支付与 owner 要求也会延缓行动并增加控制面痕迹。
          en: The adversary needs membership-departure or project-move authority, prerequisites for independent operation, and knowledge of source-to-destination differences in SCPs, organization logging, and policy. The management account can prohibit departure; the destination may require acceptance or verification, and payment and owner requirements can delay the action and increase control-plane traces.
    defender_model:
      paragraphs:
        - zh: 防守方从管理账户保存稳定资源 ID、成员或项目移动事件、原 trail 最后事件、目的侧首个事件、两个祖先的有效控制快照及继续运行的工作负载结果。若目的租户不共享证据，只能证明原覆盖断裂与活动可能延续，不能断言所有防御控制消失。
          en: Defenders retain stable resource ID, membership or project-move events, the last event in the former trail, the first destination-side event, effective-control snapshots for both ancestors, and continuing workload outcomes in the management account. If the destination tenant does not share evidence, they can establish a break in former coverage and possible continued activity but not disappearance of every defensive control.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 同一资源迁离后续活动不再进入原组织的防御视图
      en: The same resource's later activity stops entering its former organization's defensive view after departure
    analysis:
      paragraphs:
        - zh: 攻击者改变既有节点的 parent 边，原组织 trail 与继承控制随成员关系解除，而工作负载和资源 ID 保持不变。旧视图只留下历史与离开后的沉默，防守方因跨治理边界看不到后继动作而可能误判为停止活动；管理账户成员事件、两侧策略和目的资源结果可恢复这一行为—观察断裂，形成行为透明。
          en: The adversary changes an existing node's parent edge. The old organization trail and inherited controls cease with membership while workload and resource ID remain. The former view contains history followed by silence, so defenders may infer activity stopped because follow-on actions crossed a governance boundary. Management-account membership events, both policy states, and destination resource outcomes recover that behavior-to-observation break, producing Behavioral Transparency.
    evidence_refs: [REF-000457, REF-000458, REF-000460]
    confidence: medium
defense:
  detections: {coverage: available, strategy_refs: [DET-000135]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000124]}
evidence:
  claim_refs: [CLM-000676, CLM-000678, CLM-000679]
  case_refs: []
  reference_refs: [REF-000456, REF-000457, REF-000458, REF-000460]
research:
  limitations:
    paragraphs:
      - zh: AWS 与 Google Cloud 官方文档证明层级变化和特定继承控制或组织日志后果，但并非同时记录攻击者迁离、目的侧弱控制和恶意后继活动的事件案例。因此本子项维持中等置信度，现场须逐项证明实际覆盖差。旧组织 trail 沉默不代表资源没有其他日志，历史事件仍保留；不得把迁离叙述成清除既有证据。
        en: AWS and Google Cloud official documentation establish hierarchy change and specific inherited-control or organization-log effects, but do not present one incident showing adversary departure, weak destination controls, and malicious follow-on activity together. This child remains medium confidence and requires local proof of the actual coverage difference. Silence in the former trail does not mean no other logs exist, and prior events remain; departure must not be described as erasing historical evidence.
