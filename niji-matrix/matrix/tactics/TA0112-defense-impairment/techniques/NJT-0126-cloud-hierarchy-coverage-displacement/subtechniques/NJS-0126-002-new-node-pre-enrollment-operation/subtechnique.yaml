schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0126-002
parent_ref: NJT-0126
name:
  zh: 新节点先于治理注册运行
  en: New-Node Pre-Enrollment Operation
summary:
  zh: 在新云账户、订阅或项目的必需日志与 guardrail 注册完成前使用该节点，利用创建到首用之间的控制时差。
  en: Use a new cloud account, subscription, or project before required logging and guardrail enrollment completes, exploiting the delay from creation to first use.
aliases: []
lineage:
  attck_subtechnique_inherited: false
definition_and_concept:
  paragraphs:
    - zh: 新节点先于治理注册运行是攻击者创建云账户、订阅、项目或同等层级节点后，在组织日志、guardrail、检测服务、资产清单或告警路由按要求生效之前部署或使用工作负载。它的直接目的不是单纯多建一个账户，而是在中心治理尚未认识或覆盖该节点的时间窗内开展后续活动。
      en: New-Node Pre-Enrollment Operation is adversary creation of a cloud account, subscription, project, or equivalent hierarchy node followed by workload deployment or use before required organization logging, guardrails, detection service, asset inventory, or alert routing becomes effective. Its direct purpose is not simply another account, but follow-on activity in the interval before central governance recognizes and covers the node.
    - zh: 稳定变量是节点创建、必需控制注册和首个真实工作负载操作的时间顺序。云厂商、订阅名称、支付方式和 API 名称只是实现；若控制在首个操作之前全部生效，或节点始终空置，本子项不成立。
      en: The stable variable is the order of node creation, required control enrollment, and first real workload action. Cloud provider, subscription name, payment method, and API name are implementations. If all controls are effective before first action or the node remains unused, this child does not apply.
stealth_characteristics:
  paragraphs:
    - zh: 新节点先于治理注册运行没有既有资源迁离时的旧日志突然断点；它从诞生起就可能不在中心检测资产集中。攻击者若迅速创建计算、网络中转或身份资源，首批活动只出现在未注册节点及其目的服务。防守方只枚举已入治理账户时，甚至不知道应查询哪个资源 ID。
      en: New-Node Pre-Enrollment Operation leaves no sudden break in an old log as existing-resource departure does. From birth, the node may be absent from central detection inventory. If the adversary rapidly creates compute, network-relay, or identity resources, first activity appears only in the unenrolled node and destination services. Defenders enumerating governed accounts alone may not know which resource ID to query.
    - zh: 管理账户或租户根层仍保留创建事件、creator、owner 或 billing 联系、层级位置、注册任务、首个资源 API、网络目的地及可能的首次集中日志。Microsoft 观察 Peach Sandstorm 创建并使用新 Azure 订阅，直接证明恶意新节点首用；报告没有披露特定日志或 guardrail 缺口，因此本子项的匿迹效果还需现场注册时间与控制状态印证。
      en: Management-account or tenant-root records still include creation, creator, owner or billing linkage, hierarchy position, enrollment jobs, first resource APIs, network destinations, and perhaps a first central log. Microsoft observed Peach Sandstorm creating and using new Azure subscriptions, directly establishing malicious first use of a new node. The report does not disclose a specific logging or guardrail gap, so this child's stealth effect needs local enrollment timing and control-state evidence.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入攻击者创建的新层级节点在必需日志、guardrail 或检测注册实际生效之前发生工作负载操作，并能证明当时缺少哪项批准基线要求的控制。只有创建请求、空订阅、控制配置排队或最终一致性延迟但工作负载被阻断，不属于完成的防御削弱。
      en: Scope includes an adversary-created hierarchy node with workload action before required logging, guardrail, or detection enrollment actually takes effect and proof of the approved-baseline control missing then. A create request, empty subscription, queued configuration, or eventual-consistency delay while workload action remains blocked is not completed defensive impairment.
    - zh: 原本受管的同一节点改变祖先归 NJS-0126-001；在既有账户中创建 VM 或快照归 T1578 候选；受害组织之外新建攻击基础设施归资源开发。批准的沙箱、教育订阅、灾备节点和隔离实验可出现类似创建—注册时差，应以 owner、用途、隔离边界、有效期和首用结果区别，不因“新”而推定恶意。
      en: A previously governed node changing ancestor belongs to NJS-0126-001. Creating a VM or snapshot in an existing account belongs to the T1578 candidate. New attacker infrastructure outside victim governance belongs to Resource Development. Approved sandboxes, education subscriptions, disaster-recovery nodes, and isolated experiments may show similar creation-to-enrollment delay and require owner, purpose, isolation boundary, lifetime, and first-use result as distinctions; new alone does not imply malice.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者获得受害租户中的订阅创建权后，可能先部署中转、计算或身份资源，再让中心注册流程发现节点。Peach Sandstorm 在部分受害租户新建 Azure 订阅并用于与其基础设施通信，展示恶意首用；要归入本子项，还必须核对受害租户该订阅的日志、guardrail 实际生效时间与通信时刻。
        en: After gaining subscription-creation rights in a victim tenant, an adversary may deploy relay, compute, or identity resources before central enrollment discovers the node. Peach Sandstorm created Azure subscriptions in some victim tenants and used them to communicate with its infrastructure, illustrating malicious first use. Classification here additionally requires comparison of that subscription's actual logging and guardrail effective times with the communication.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需有层级节点创建和随后资源部署权限，了解治理注册的触发与延迟，并可能准备支付、owner 或资源组资料。若组织在根层对每个新节点自动强制先注册、阻断未注册资源创建或隔离外联，时间差即失去可利用性。
          en: The adversary needs hierarchy-node creation and subsequent resource-deployment authority, knowledge of governance-enrollment triggers and delay, and perhaps payment, owner, or resource-group details. Root-level automatic pre-enrollment, blocked creation in unenrolled nodes, or isolated egress removes the exploitable interval.
    defender_model:
      paragraphs:
        - zh: 防守方在管理账户或租户根保存所有创建事件，为每类节点定义必需控制及生效 SLO，并从不同权来源看到首个 workload API、网络与身份操作。只看已注册的 Control Tower OU 或 SIEM 资产列表会产生选择偏差，漏掉从未入表的新节点。
          en: Defenders retain all creation events at management-account or tenant-root level, define required controls and effective SLO by node class, and observe first workload API, network, and identity operations from differently authorized sources. Looking only at registered Control Tower OUs or SIEM asset inventory creates selection bias and misses new nodes never enrolled.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 新节点首用早于治理注册，使活动落在中心检测资产集之外
      en: First use of a new node precedes governance enrollment and places activity outside central detection inventory
    analysis:
      paragraphs:
        - zh: 攻击者先创建尚未被组织安全流程注册的节点，在日志或 guardrail 生效前操作资源。创建事件留在管理面，但真实活动未进入依赖已注册资产的中心观察；防守方可能把新节点的服务通信当作普通云来源，形成行为透明。只有创建 ID、控制生效时间、首个动作和应有覆盖共同闭合，才能证明这一短窗。
          en: The adversary creates a node before the organization's security workflow enrolls it and operates resources before logging or guardrails become effective. Creation remains visible on the management plane, but real activity is absent from central observation restricted to enrolled assets. Defenders may treat the node's service communication as ordinary cloud traffic, producing Behavioral Transparency. Creation ID, control effective time, first action, and required coverage must close together to prove the interval.
    evidence_refs: [REF-000456, REF-000459, REF-000461]
    confidence: medium
defense:
  detections: {coverage: available, strategy_refs: [DET-000135]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000124]}
evidence:
  claim_refs: [CLM-000677, CLM-000678, CLM-000679]
  case_refs: [CASE-000172]
  reference_refs: [REF-000456, REF-000459, REF-000461]
research:
  limitations:
    paragraphs:
      - zh: Peach Sandstorm 报告只证明恶意新订阅创建及后继通信；AWS Control Tower 文档只证明组织层级中的某些节点可能未自动注册治理。两者没有在同一事件中直接证明具体日志或 guardrail 缺席，因此子项保持中等置信，并要求现场提供首用与控制有效时间。若租户级日志或另一传感器已覆盖活动，不能只凭 Control Tower 未注册宣称匿迹成功。
        en: Peach Sandstorm reporting proves malicious new-subscription creation and later communication only; AWS Control Tower documentation shows some nodes in an organization may not automatically enroll in governance. They do not directly prove a particular log or guardrail absent in the same incident, so the child remains medium confidence and requires local first-use and control-effective times. If tenant-level logs or another sensor covered the activity, Control Tower nonenrollment alone cannot establish successful stealth.
