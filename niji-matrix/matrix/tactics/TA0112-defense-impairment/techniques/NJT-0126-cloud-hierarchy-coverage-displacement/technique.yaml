schema_version: "2.0.0"
type: technique
id: NJT-0126
name: {zh: 云层级防御覆盖位移, en: Cloud Hierarchy Defensive-Coverage Displacement}
summary: {zh: 攻击者改变账户、订阅或项目的层级位置，使继承 guardrail、集中日志或检测注册与真实工作负载脱节。, en: "Adversaries change an account, subscription, or project's hierarchy placement so inherited guardrails, central logs, or detection enrollment diverge from real workload activity."}
aliases: [Modify Cloud Resource Hierarchy, T1666]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1666, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1666
definition_and_concept:
  paragraphs:
    - zh: 云层级防御覆盖位移是攻击者新建或重置云资源节点的 parent/ancestor 关系，使账户、订阅、项目或其工作负载离开原本覆盖它的组织策略、集中日志、检测服务或治理注册，并在控制缺口中继续活动。直接对象是资源位置与继承控制之间的关系；资源可以仍在运行、计费和接受 API 调用，变化并不要求修改策略正文。
      en: Cloud Hierarchy Defensive-Coverage Displacement is adversary creation or reassignment of a cloud resource node's parent or ancestor relationship so an account, subscription, project, or its workloads leave organization policy, central logging, detection service, or governance enrollment that should cover them and continue activity in the gap. The direct object is the relationship between resource placement and inherited control. The resource can remain running, billed, and API-accessible without changing policy text.
    - zh: 概念锚包括稳定资源身份或新节点创建 ID、旧新 ancestor path、应继承的控制集合、实际注册与生效状态，以及首个在缺口中发生的资源操作。LeaveOrganization、CreateAccount、项目迁移、订阅转移或 OU 创建只是实现；只有防御覆盖相对批准基线实际下降，才构成本技术。
      en: The concept is anchored in a stable resource identity or new-node creation ID, old and new ancestor paths, the expected inherited control set, actual enrollment and effective state, and the first resource action in the gap. LeaveOrganization, CreateAccount, project migration, subscription transfer, and OU creation are implementations. This technique requires defensive coverage actually declining relative to the approved baseline.
stealth_characteristics:
  paragraphs:
    - zh: 云层级防御覆盖位移让相同资源活动从原管理组织的观察域中消失，或让新节点先于中心日志和 guardrail 注册开始活动。原工作负载可能不重启，资源 ID、计费和应用服务也不变；防守方若只查询旧组织 trail 或已登记资产集，会把后续操作误读为停止，或根本不知道新资源被使用。
      en: Cloud Hierarchy Defensive-Coverage Displacement causes activity of the same resource to disappear from the former managing organization's observation domain or lets a new node operate before central logs and guardrails enroll it. The old workload may not restart, and resource ID, billing, and application service can remain unchanged. Defenders who query only the former organization trail or enrolled asset set may mistake later actions for cessation or never learn a new resource was used.
    - zh: 残余痕迹不在同一观察面：管理账户保留成员离开或节点创建事件，目的组织可能留存新日志，云资源本身保留首个 API/网络结果，历史日志仍在旧仓库。全局 ancestry 版本、源/目的继承策略和注册时间可以恢复控制差；如果跨租户身份无法关联或目的组织不共享证据，只能证明覆盖未知，不能把原组织的沉默自动解释为攻击成功。
      en: >-
        Residue is distributed across observation planes: the management account retains departure or creation events, the destination organization may retain new logs, the cloud resource preserves first API or network outcomes, and historical logs remain in the old store. Global ancestry versions, source and destination inherited policy, and enrollment time recover the control difference. If cross-tenant identity cannot be joined or the destination withholds evidence, coverage is unknown; silence in the former organization alone is not proof of attack success.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入攻击者控制的既有账户/项目迁离受管祖先，或新账户/订阅/项目在必需治理注册前承载实际操作，并能枚举至少一种原应生效但实际缺失的 guardrail、集中日志、检测或响应控制。必须连接成员或创建事件、有效控制前后态和后继资源活动；API 成功、账单变化或资源出现在新目录中只属于层级异常。
      en: Scope includes adversary-controlled departure of an existing account or project from a governed ancestor or actual operation in a new account, subscription, or project before required enrollment, with at least one expected but absent guardrail, central log, detection, or response control enumerated. Membership or creation event, effective control before and after state, and follow-on resource activity must join. API success, billing changes, or a resource appearing in a new directory alone is a hierarchy anomaly.
    - zh: 策略正文被攻击者改写而资源 ancestor 不变归 NJT-0125 或更具体控制对象；实例创建/删除/快照与取证工件变化归 T1578 候选；云区域选择归 NJT-0121，普通 C2 和资源开发各有直接对象。经批准的公司重组、租户合并、项目迁移、沙箱创建和临时教学订阅若保持等效控制或没有攻击者活动，应排除，不能因组织外或新建就推定隐蔽。
      en: Adversary policy-text editing with unchanged resource ancestry belongs to NJT-0125 or a more specific control object. Instance creation, deletion, snapshots, and forensic-object changes belong to the T1578 candidate. Cloud-Region choice belongs to NJT-0121; ordinary C2 and resource development have their own direct objects. Approved reorganization, tenant merger, project migration, sandbox creation, and temporary education subscriptions with equivalent controls or no adversary activity are excluded. Outside-organization or newly created does not itself imply stealth.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者取得组织或租户管理能力后，可使已有账户离开组织，让其新事件不再进入旧组织 trail；也可创建或接管新订阅，在中心治理注册前部署网络中转、计算或身份资源。Google Cloud 的项目迁移说明已有工作负载可在身份不变时立刻改用目的祖先策略；Peach Sandstorm 报告直接记录新订阅的恶意使用，但没有证明其具体日志盲区。
        en: With organization or tenant management capability, an adversary can let an existing account leave so its new events no longer enter the former organization trail. It can also create or take over a new subscription and deploy network relay, compute, or identity resources before central governance enrollment. Google Cloud project migration shows an existing workload can immediately use destination-ancestor policy while retaining identity. Peach Sandstorm reporting directly records malicious use of new subscriptions but does not prove their specific logging blind spot.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要成员离开、账户/订阅创建、项目移动或跨租户转移权限，了解来源与目的 ancestry 的继承控制差及治理注册时延，并可能准备替代支付或 owner 资料。SCP 禁止离开、订阅转移限制、自动注册、组织根审批、跨组织库存和首用阻断会提高成本；没有真正较弱的目的控制时该行为不具匿迹收益。
          en: The adversary needs membership-departure, account or subscription creation, project-move, or cross-tenant transfer authority, knowledge of inherited-control differences between source and destination ancestry and enrollment delay, and sometimes replacement payment or owner information. SCP prevention of departure, subscription-transfer limits, automatic enrollment, organization-root approval, cross-organization inventory, and first-use blocking raise cost. If destination controls are not actually weaker, the action provides no stealth benefit.
    defender_model:
      paragraphs:
        - zh: 防守方保留不由成员账户单独删除的全局层级历史、创建/离开/移动审计、每个资源的有效继承策略、组织 trail 与传感器注册、目的侧日志、稳定 ID 以及首个工作负载操作。AWS 的成员离开事件只在管理账户历史中可见，旧组织 trail 的历史文件不会被该动作删除；两者需与新事件停止到达和资源继续活动一同解释。
          en: Defenders retain global hierarchy history that a member account alone cannot delete, create/departure/move audit, each resource's effective inherited policy, organization trail and sensor enrollment, destination-side logs, stable IDs, and first workload action. AWS membership departure appears in management-account history, while old organization-trail files are not deleted by that action. Both must be interpreted with cessation of new-event arrival and continuing resource activity.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 改变资源祖先使后继活动脱离原组织防御观察域, en: Change resource ancestry so later activity leaves the former organization's defensive observation domain}
    analysis:
      paragraphs:
        - zh: 攻击者改写资源的 parent 边或先创建尚未受管的新节点，继承 guardrail 与集中日志的适用集合随之变化，而工作负载或资源操作继续。痕迹从旧组织的一条连续资源序列变为成员事件、注册状态和另一观察域中的后继活动；只看旧日志时，防守方误以为资源安静或不存在，形成跨治理边界的行为透明。只有稳定资源 ID、ancestry 版本、源/目的控制与首个后继操作连接，才能恢复完整路径。
          en: The adversary changes a resource parent edge or first creates an unenrolled node. The applicable inherited guardrails and central logs change while workload or resource actions continue. A continuous old-organization resource sequence becomes a membership event, enrollment state, and subsequent activity in another observation domain. Defenders reading only old logs may infer the resource is quiet or absent, producing behavioral transparency across a governance boundary. Stable resource ID, ancestry version, source and destination controls, and first follow-on action must join to restore the path.
    evidence_refs: [REF-000457, REF-000458, REF-000459, REF-000460]
    confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 子技术按层级变化发生前是否存在同一受管节点划分。NJS-0126-001“既有资源治理迁离”保留稳定账户或项目 ID、旧日志历史与运行负载，但 parent/organization 改变后需追踪连续性断点；NJS-0126-002“新节点先于治理注册运行”没有同一节点的旧活动历史，需连接创建、注册时差与首个工作负载结果。这是不同的前态与防守观察方法，而不是 AWS 对 Azure、账户对项目的介质划分。
        en: Children are partitioned by whether the same governed node existed before the hierarchy change. NJS-0126-001 Existing-Resource Governance Departure retains a stable account or project ID, old log history, and running workload but requires a continuity join after parent or organization changes. NJS-0126-002 New-Node Pre-Enrollment Operation has no prior activity history for the same node and requires creation, enrollment delay, and first workload outcome. These are different prior states and defender methods, not AWS versus Azure or account versus project media.
      - zh: 两者都必须证明实际日志、guardrail 或检测覆盖下降并有后继活动；合法创建、移动和账单重排不自动进入。修改策略版本而保持层级不变归 NJT-0125，迁移既有 VM、快照或实例对象的取证结果归 T1578 候选。ATT&CK T1666 无子项，正式 NJS 完全从上述稳定变量推导。
        en: Both children require a real decline in log, guardrail, or detection coverage and follow-on activity; legitimate creation, movement, and billing changes do not automatically qualify. Editing a policy version without hierarchy change belongs to NJT-0125, while forensic effects of moving an existing VM, snapshot, or instance belong to the T1578 candidate. ATT&CK T1666 has no children, and the formal NJS taxonomy is derived entirely from these stable variables.
  coverage: established
  subtechnique_refs: [NJS-0126-001, NJS-0126-002]
defense:
  detections: {coverage: available, strategy_refs: [DET-000135]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000124]}
evidence:
  claim_refs: [CLM-000675, CLM-000676, CLM-000677, CLM-000678, CLM-000679]
  case_refs: [CASE-000172]
  reference_refs: [REF-000456, REF-000457, REF-000458, REF-000459, REF-000460, REF-000461]
research:
  limitations:
    paragraphs:
      - zh: AWS 文档直接证明账户离开后原组织 trail 不再覆盖新事件，但历史日志保留；Google Cloud 文档直接证明项目迁移改变继承策略，是否弱化仍取决于目的祖先；AWS Control Tower 文档证明新 OU 不自动注册治理。Peach Sandstorm 案例只证明攻击者新建并使用订阅，没有给出该订阅缺失哪项控制。因此机制与两个 NJS 的存在为中等置信，不能把每次创建或迁离都宣称为已完成防御削弱。
        en: AWS documentation directly establishes that the former organization trail no longer covers new events after account departure while historical logs remain. Google Cloud documentation directly establishes changed inherited policy after a project move, whose strength still depends on the destination ancestor. AWS Control Tower documents that new OUs do not automatically enroll in governance. The Peach Sandstorm case shows an adversary creating and using subscriptions but not which control those subscriptions lacked. Mechanism and child existence are therefore medium confidence, and not every creation or departure is completed defensive impairment.
      - zh: 不同云的资源 ID、成员事件、组织日志和治理注册数据并不一致，且目的租户可能不向原组织开放活动。没有目的侧证据时可判定原覆盖失去但未必整体失明；若另有同等或更强的安全控制接管，则不应纳入。人工评审需实证检验新节点首用窗口是否稳定区分于普通自动化延迟，并与未来 T1578 云计算对象修改保持边界。
        en: Resource IDs, membership events, organization logs, and governance-enrollment data differ across clouds, and a destination tenant may not expose activity to the former organization. Without destination evidence, loss of former coverage can be established but not complete blindness. Equivalent or stronger replacement controls exclude the behavior. Human review should empirically test whether the new-node first-use interval remains distinct from ordinary automation delay and maintain the boundary with future T1578 cloud-compute modifications.
