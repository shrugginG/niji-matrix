research:
  limitations:
    paragraphs:
      - zh: ATT&CK 说明旧 PowerShell 可能规避脚本块日志，Microsoft 文档说明当前日志通道，但公开材料并未证明每个已安装旧引擎在每个配置下都不产生日志。某些设备有 EDR、AMSI 或集中代理的等效内容覆盖；若没有实际引擎版本与脚本执行证明，应将结果降为可能性而非已完成匿迹。
        en: ATT&CK explains that legacy PowerShell may evade script-block logging, and Microsoft documents the current log channel, but public sources do not establish that every installed old engine lacks logging under every configuration. Some devices retain equivalent EDR, AMSI, or central-agent content coverage. Without actual engine version and script-execution proof, the result is a possibility rather than completed evasion.
