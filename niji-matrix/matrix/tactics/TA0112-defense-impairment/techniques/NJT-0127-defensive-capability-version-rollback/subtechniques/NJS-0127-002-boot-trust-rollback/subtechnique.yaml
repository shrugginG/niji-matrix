research:
  limitations:
    paragraphs:
      - zh: SafeBreach 研究是实验性证明，Microsoft 的撤销指导是控制文档，二者不能共同证明任意组织中发生了成功的恶意回退。设备型号、撤销部署环与 VBS 配置会改变预期保护；若只见旧磁盘文件而无实际加载或功能下降，必须保持未确认。更新链被完全控制时，同权测量也可能被污染。
        en: SafeBreach research is an experimental demonstration and Microsoft's revocation guidance is control documentation; together they do not prove successful malicious rollback in an arbitrary organization. Device model, revocation ring, and VBS configuration change expected protection. An old disk file without actual loading or functional decline remains unconfirmed. Measurements sharing authority with a fully compromised update chain can also be contaminated.
