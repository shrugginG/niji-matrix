schema_version: "2.0.0"
type: technique
id: NJT-0127
name: {zh: 防御能力版本回退, en: Defensive Capability Version Rollback}
summary: {zh: 攻击者让旧组件真实执行或加载，使表面正常的运行环境失去新版本应有的审计或信任保护。, en: Adversaries cause an older component to execute or load so an apparently normal environment loses auditing or trust protections expected from its approved version.}
aliases: [Downgrade Attack, T1689]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1689, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1689
definition_and_concept:
  paragraphs:
    - zh: 防御能力版本回退是攻击者选择、恢复或强制使用低于受批准基线的运行组件，使其被实际执行或加载时缺少新版本的审计、完整性或信任控制。直接目标是版本消费后的防御能力差，而不是安装旧文件、修改更新配置或获得旧软件本身；旧版本与后续攻击活动必须处于同一有效运行路径。
      en: Defensive Capability Version Rollback is adversary selection, restoration, or forced use of a component below the approved baseline so actual execution or loading lacks auditing, integrity, or trust controls available in the current version. Its direct target is the defensive-capability difference after version consumption, not installation of an old file, editing update configuration, or possession of old software. The older version and follow-on activity must belong to the same effective execution path.
    - zh: 该概念可覆盖有内容审计差的脚本引擎和有受信启动差的引导/虚拟化安全组件，但不把所有旧版本都视为匿迹。防守方需要把“版本声明”“实际加载对象”和“该对象本应实施的安全功能”分成三个事实层；只有第三层下降且可连回第一、二层的攻击者控制时，才确认 TA0112 结果。
      en: >-
        The concept can cover script engines with content-audit differences and boot or virtualization-security components with trusted-boot differences, but it does not make every old version an evasion technique. Defenders need three separate facts: reported version, actually loaded object, and security function that object should enforce. A TA0112 outcome is confirmed only when the third declines and can be causally joined to adversary control over the first two.
stealth_characteristics:
  paragraphs:
    - zh: 防御能力版本回退把攻击行为留在看似正常的产品使用和更新链中。旧脚本引擎仍显示合法进程与命令来源，却可能不产生预期内容日志；旧启动组件可由正常更新路径或已有签名加载，管理界面仍报告“已更新”，但实际信任检查能力较弱。攻击者利用的是表面合规记录与有效防护之间的观察差，而不是仅靠文件名隐藏。
      en: Defensive Capability Version Rollback leaves behavior inside apparently ordinary product use and update paths. A legacy script engine still presents a legitimate process and command origin but may omit expected content logs. An older boot component may load through a normal update path or existing signature while a management console still reports current state, yet effective trust checking is weaker. The adversary exploits the gap between compliant-looking records and effective protection, not merely a concealed filename.
    - zh: 残余包括进程映像 hash、实际引擎版本、日志通道健康与 4104 对照，或更新事务、EFI/TPM 启动测量、撤销列表及 VBS 状态。版本差并不必然意味着失防，尤其在替代审计、向后移植补丁或独立保护存在时；可信加载证明与功能性测试会压缩这种匿迹空间。
      en: Residue includes process-image hash, actual engine version, log-channel health, and 4104 comparison, or update transactions, EFI or TPM boot measurements, revocation lists, and VBS state. A version difference does not necessarily mean lost defense where alternative audit, backported fixes, or independent protection exists. Trusted load evidence and functional tests narrow the stealth space.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入攻击者有意选择的旧版本确实运行或加载，并在同一作用对象上相对批准版本造成可验证的安全能力下降。只下载旧包、策略允许兼容模式、更新任务失败或显示版本落后但实际加载新组件时，只记录准备、尝试或正常配置。合法灾备回滚须保留变更审批、组件 hash、受影响范围、到期与替代控制；不能因旧版本本身判恶。
      en: Include intentional adversary selection of an older version that truly runs or loads and measurably reduces a security capability on the same object relative to the approved version. Downloading an old package, permitting compatibility mode, a failed update job, or a stale displayed version while the current component loads is preparation, attempt, or ordinary configuration. Legitimate recovery rollback requires approval, component hash, affected scope, expiry, and compensating controls; old age alone is not malicious.
    - zh: 通信会话的有效加密强度下降由 T1600 候选负责，系统映像本体补丁与替换归 T1601，安全工具被直接关闭或范围缩小可并记 NJT-0123 的结果。子技术不按 Windows、PowerShell、固件等产品分；本对象关注版本路径带来的防守观察差，可与后续提权或持久化结果并列，但不以那些结果替代防御能力证明。
      en: Effective cryptographic weakening of a communication session belongs to the T1600 candidate, system-image patching or replacement to T1601, and direct shutdown or scope contraction of a security tool may also be recorded under NJT-0123. Children are not divided by Windows, PowerShell, or firmware products. This object concerns the defender-observation difference created by a version path; later privilege escalation or persistence may coexist but cannot replace proof of defensive capability loss.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者在运行恶意脚本前选择仍可调用但缺少内容审计的旧解释器，或在需要避开启动完整性控制时使已修补设备加载较旧的启动/虚拟化安全组件。前者的后继动作位于旧进程执行窗口，后者通常跨重启并影响随后加载的保护。公开 Windows Downdate 研究是可行性演示，不能被当作所有现场都有同样攻击的证据。
        en: An adversary may choose an invocable legacy interpreter without content auditing before running a malicious script, or cause a patched device to load an older boot or virtualization-security component before trying to bypass startup integrity controls. The first follow-on action occurs within a legacy process interval; the second normally crosses a reboot and affects protections loaded afterward. Public Windows Downdate research is a feasibility demonstration, not proof of identical attacks in every environment.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 旧运行时路径要求攻击者能启动指定引擎并了解审计策略及日志采集；启动路径需要足以控制更新或引导对象的高权限、可用旧组件、重启机会以及对撤销状态的了解。两者都可能被应用控制、Secure Boot 撤销、独立更新验证与功能性 canary 阻断，不能假设仅有管理员权限就必然成功。
          en: The legacy-runtime path requires authority to invoke a selected engine and knowledge of audit policy and collection. The boot path needs high privilege over update or boot objects, an available older component, a reboot opportunity, and knowledge of revocation state. Application control, Secure Boot revocations, independent update validation, and functional canaries can block either path; administrator privilege alone does not guarantee success.
    defender_model:
      paragraphs:
        - zh: 防守方保存受批准组件清单、进程与更新来源、真实加载 hash/版本、脚本内容事件或 TPM/EFI 测量，并从不同权系统读取审计和保护结果。只看管理界面版本会漏掉被回退而仍报告更新的组件；只看日志缺席会把采集故障误判为旧引擎。需要依目标区分运行时秒级窗口与启动周期级窗口。
          en: Defenders retain approved component inventories, process and update provenance, actual loaded hash and version, script-content events or TPM and EFI measurements, and differently authorized audit and protection outcomes. Console version alone misses rolled-back components still reported as current; absence of logs alone confuses collection failure with a legacy engine. Runtime windows measured in seconds and boot-cycle windows need separate handling.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 合法旧组件运行使关键活动落在预期防御功能之外, en: Legitimate-looking older components place activity outside expected defensive functions}
    analysis:
      paragraphs:
        - zh: 攻击者不必直接关闭日志或删除事件，而是让缺少目标防御功能的旧版本进入真实执行路径。进程或更新链仍符合普通产品操作，安全控制却在该版本路径上没有提供预期的脚本内容或信任判断；若防守只以软件名称或更新成功为基线，就会把功能缺口当作正常活动。实际加载证据和功能差分是打破这种行为透明的关键。
          en: The adversary need not directly turn off a log or delete an event, instead placing an older version without the target defense function in the real execution path. Process or update activity still resembles ordinary product operation, but the security control does not provide expected script content or trust decisions on that version path. Defenders baselining only software names or update success can treat the functional gap as normal activity. Actual-load evidence and capability differential break this behavioral transparency.
    evidence_refs: [REF-000462, REF-000463, REF-000465]
    confidence: medium
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: NJS-0127-001 按旧脚本运行时造成的内容审计缺口划分，关键前态是同设备本应启用脚本块记录，后态仍有进程与引擎痕迹但缺少预期内容事件；NJS-0127-002 按旧启动/虚拟化安全组件进入受信链划分，关键前态是批准映像和撤销状态，后态为跨重启的测量与有效保护差。两者在时间尺度、残余证据和防守验证上不同，不能用同一缺失日志规则替代。
        en: NJS-0127-001 is defined by a legacy script runtime's content-audit gap. Its prior state is expected script-block logging on the same device; the result preserves process and engine residue but lacks expected content events. NJS-0127-002 concerns an older boot or virtualization-security component entering the trusted chain. Its prior state is an approved image and revocation state; the result is a cross-reboot difference in measurements and effective protection. Their time scales, residue, and defender validation differ, so one missing-log rule cannot serve both.
      - zh: ATT&CK T1689 无子项。协议降级若直接影响通信加密归 T1600，普通安装旧软件、仅性能变化和未生效的回滚请求不建立 NJS；未来其他版本轴需先证明独立的痕迹变化与防守方法。当前两个子项不是产品列表，也不是把“降级”一词按组件任意拆分。
        en: ATT&CK T1689 has no children. Protocol downgrade that directly weakens communication cryptography belongs to T1600; ordinary old-software installation, performance-only change, and rollback requests that never take effect do not form NJS. Future version axes require independent trace change and defensive method. These two children are not a product list or an arbitrary split of the word downgrade by component.
  coverage: established
  subtechnique_refs: [NJS-0127-001, NJS-0127-002]
defense:
  detections: {coverage: available, strategy_refs: [DET-000136]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000125]}
