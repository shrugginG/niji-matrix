  claim_refs: [CLM-000680, CLM-000681, CLM-000682]
  case_refs: []
  reference_refs: [REF-000462, REF-000463, REF-000464, REF-000465, REF-000198]
research:
  limitations:
    paragraphs:
      - zh: ATT&CK 父页为版本回退提供战术背景，Microsoft 文档给出日志与启动撤销的控制语义，SafeBreach 研究实证了特定 Windows 测试路径；它们不共同证明某个未经观察的组织遭受了完整攻击。PowerShell 旧引擎、Boot Manager 和 VBS 的证据强度不同，后者的实验结论必须与真实现场测量区分。
        en: The ATT&CK parent provides tactic context for rollback, Microsoft documentation defines logging and boot-revocation controls, and SafeBreach empirically demonstrates one Windows research path. Together they do not prove a complete attack in an unobserved organization. Evidence strength differs for the legacy PowerShell engine, Boot Manager, and VBS; experimental findings must remain distinct from measurements in a real deployment.
      - zh: 某些旧组件有回补补丁或替代日志，Secure Boot/VBS 也因硬件、策略和撤销部署环而异。缺少可信实际加载版本、健康的日志通道或功能结果时，只能报告可疑版本差或无法确认，不能把没有 4104、一次更新失败或旧映像 hash 直接提升为成功失防。人工评审需复核协议加密与系统映像兄弟边界。
        en: Some older components have backported fixes or alternative logs, while Secure Boot and VBS vary by hardware, policy, and revocation ring. Without a trustworthy actual-load version, healthy log channel, or functional outcome, report only a suspicious version difference or unresolved state. Missing 4104, one failed update, or an old image hash cannot alone become successful impairment. Human review should revisit the boundaries with communication cryptography and system-image siblings.
