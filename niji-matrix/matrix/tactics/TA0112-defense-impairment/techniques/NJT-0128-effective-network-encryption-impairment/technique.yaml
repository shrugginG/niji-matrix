schema_version: "2.0.0"
type: technique
id: NJT-0128
name: {zh: 网络通信加密效能削弱, en: Effective Network Encryption Impairment}
summary: {zh: 攻击者改变网络设备的加密实现或配置，使真实会话的保密性或完整性下降，即使流量仍有加密外观。, en: "Adversaries alter network-device cryptographic implementation or configuration so real sessions lose confidentiality or integrity even while traffic may still appear encrypted."}
aliases: [Weaken Encryption, T1600]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1600, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1600
definition_and_concept:
  paragraphs:
    - zh: 网络通信加密效能削弱是攻击者控制网络设备的密钥交换、算法参数、运行映像或加密路径，使某条真实通信会话相对批准基线失去应有的保密性或完整性。直接目标是传输保护的有效能力，而不是设备上是否显示“加密已启用”或专用引擎是否在工作；确认该技术需要把设备变化连到受影响接口、隧道、对等体及会话结果。
      en: Effective Network Encryption Impairment is adversary control of key exchange, algorithm parameters, running images, or cryptographic path on a network device so a real communication session loses confidentiality or integrity expected from its approved baseline. The direct target is effective transport protection, not a device's encryption-enabled label or whether a dedicated engine is active. Confirmation joins the device change to affected interface, tunnel, peer, and session outcome.
    - zh: Cisco 的恶意 IOS 映像案例说明概念核心，受改写的 Diffie–Hellman 过程产出较弱密钥材料，流量仍可在粗略观测中呈现正常密文。映像修改是实现入口，加密退化才是本对象的战术结果；同一入侵可另记映像技术，但不能因实现材料重叠而省略会话强度的独立证明。
      en: Malicious Cisco IOS images illustrate the concept. A changed Diffie–Hellman process produced weaker keying material while traffic still looked like ordinary ciphertext under casual observation. Image modification is the implementation entry, whereas cryptographic regression is this object's tactic outcome. The same intrusion may also have an image-technique record, but overlapping implementation material cannot replace independent proof of session strength.
stealth_characteristics:
  paragraphs:
    - zh: 此技术最重要的匿迹特性是可见“加密”与真实抗解密能力不一致。边界传感器仍看到加密隧道与正常握手，常规仪表盘可能只读设备配置或吞吐量；密钥派生内部变化未必显露在握手字段，导致防守误判数据仍受到原强度保护。攻击者随后读取或操作通信的能力不应反向充当降强的唯一证据。
      en: The principal stealth property is divergence between visible encryption and actual resistance to decryption. Boundary sensors still see an encrypted tunnel and ordinary handshake, while dashboards may read only device configuration or throughput. Internal key-derivation changes need not appear in handshake fields, so defenders may believe data retains its approved strength. Later ability to read or manipulate traffic cannot serve as the sole backward proof of weakening.
    - zh: 残余包括管理会话、加密配置旧新态、闪存与运行内存映像 hash、模块差分、接口绑定、真实协商参数及可控测试会话结果。完整性证明和外部对等体验证可缩小盲区，但旧网络设备可能缺少可靠运行内存测量；仅有加速器关闭或吞吐量变化时，应避免越级推断。
      en: Residue includes administrative sessions, old and new crypto configuration, flash and running-memory image hashes, module differences, interface binding, real negotiated parameters, and controlled test-session results. Integrity attestation and external peer validation narrow the gap, but legacy devices may lack trustworthy running-memory measurement. Accelerator-off or throughput change alone must not be promoted to a cryptographic conclusion.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入攻击者对网络设备的加密实现或配置施加控制，真实会话的密钥材料、算法强度或消息完整性相对批准基线下降，且受影响路径可被确定。配置写入、恶意映像存在、专用硬件停用或明文测试失败各自只是部分证据；若软件回退仍提供等效密码保护，则不属于完成的本技术。合法对等体兼容变更应有工单、限定接口、期限和补偿控制。
      en: Include adversary control over network-device cryptographic implementation or configuration where actual session keying material, algorithm strength, or message integrity declines relative to the approved baseline and the affected path is identifiable. A configuration write, malicious image presence, dedicated-hardware disablement, or failed plaintext probe is only partial evidence. Software fallback with equivalent cryptographic protection is not completed impairment. Legitimate peer-compatibility changes need a ticket, scoped interface, expiry, and compensating control.
    - zh: 仅回退协议或组件版本而有效密码能力不变归 NJT-0127；系统映像补丁本身归 T1601 候选；窃听、凭据获取与数据篡改是可能后果，不由本对象证明。ATT&CK 的“减小密钥空间”和“关闭加密硬件”是实施维度，不能直接命名两个 Niji 子项；硬件状态与安全强度之间必须有额外结果证据。
      en: Version rollback without effective cryptographic loss belongs to NJT-0127, system-image patching itself to the T1601 candidate, and interception, credential access, or data modification are possible consequences rather than conclusions proved here. ATT&CK's reduced key space and disabled crypto hardware are implementation dimensions, not names for two Niji children. Hardware state needs additional outcome evidence before becoming a security-strength conclusion.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者控制跨站点 VPN 或内部关键网关后，在计划窃听或操纵流量前改写密钥交换实现或配置，使业务隧道继续建立但保护低于管理员批准水平。Cisco 历史事件中的恶意 IOS 映像削弱 DH 派生材料，说明“不中断连接”可与“降低真实保护”同时出现；不能由该事件推导所有受害流量最终都被解密。
        en: After controlling an intersite VPN or critical internal gateway, an adversary may alter key-exchange implementation or configuration before attempting traffic interception or manipulation, allowing business tunnels to continue while protection falls below the administrator's approved level. The historical Cisco incidents show that an uninterrupted connection and weaker real protection can coexist, but they do not prove every victim flow was ultimately decrypted.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要加密配置写权或更高等级的运行映像修改能力，理解受影响对等体和协商策略，并承受设备重载、签名验证、AAA 审计与外部端点测试风险。它可能保持密文外观以降低注意，但不能假设改写加速器状态就必然降低密钥熵；新设备的 Trust Anchor 与签名映像也可能阻止路径。
          en: The adversary needs crypto-configuration write authority or stronger running-image modification capability, knowledge of affected peers and negotiation policy, and tolerance for reload, signature verification, AAA audit, and external endpoint tests. Ciphertext appearance can reduce attention, but changing accelerator state does not necessarily reduce key entropy. Trust anchors and signed images on current devices may also prevent the path.
    defender_model:
      paragraphs:
        - zh: 防守方维护设备与隧道级密码基线，掌握不同权的 AAA、配置快照、固件/运行内存证明及真实会话的对等端握手结果。网络抓包能证实加密外观和部分协商参数，却未必揭示设备内部密钥派生补丁；必要时需原厂取证或隔离测试，不能要求采集生产密钥明文。
          en: Defenders maintain device- and tunnel-level cryptographic baselines, with separately authorized AAA, configuration snapshots, firmware or running-memory attestation, and peer-observed handshakes from real sessions. Packet capture shows encrypted appearance and some negotiated parameters but may miss an internal key-derivation patch. Vendor forensics or isolated testing may be necessary without collecting production plaintext keys.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 正常密文外观掩盖真实密钥材料强度下降, en: Ordinary ciphertext appearance conceals weaker real keying material}
    analysis:
      paragraphs:
        - zh: 攻击者改变设备密钥交换的内部实现，外部仍保留加密隧道、类似握手和业务连续性；防守传感器从可见特征把该会话归类为正常受保护流量，实际派生材料却更易被解密。Cisco 对恶意 IOS 映像的取证直接支持此“外观—能力”差；运行映像完整性和受控密码结果比仅数密文包更能揭示特征伪装。
          en: The adversary changes internal device key-exchange implementation while retaining an encrypted tunnel, similar handshake, and business continuity. Defenders classify the session as normally protected from visible features even though derived material is easier to decrypt. Cisco forensics on malicious IOS images directly supports this appearance-to-capability gap. Running-image integrity and controlled cryptographic outcomes reveal the feature disguise better than counting ciphertext packets alone.
    evidence_refs: [REF-000467, REF-000468]
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 本轮不建立 NJS。ATT&CK T1600.001 的减小密钥空间直接贡献父级“有效保护下降”核心，T1600.002 的停用硬件加速可改变执行路径，但若软件仍实施同等算法和密钥材料，防守观察只见性能或路径变化，不能把它当作独立的加密损伤。把这两项按实现形式一对一翻译会混淆原因与结果。
        en: No NJS is established in this round. ATT&CK T1600.001 reduced key space contributes directly to the parent's effective-protection-loss core. T1600.002 disabled hardware acceleration can change the execution path, but software with equivalent algorithms and keying material yields only performance or path differences, not a distinct cryptographic impairment. One-to-one translation of these implementations would confuse cause with outcome.
      - zh: 开放搜索还审查了弱协商、明文路径和加密外观下的派生材料扭曲。弱协商与派生材料扭曲可能需要不同取证，但目前直接恶意案例只证实后一种；明文路径往往在普通流量审查中更直接可见，尚无独立稳定匿迹变量和结论级案例。若未来来源证明独立的控制面、残余痕迹与防守方法，应重新打开 taxonomy，而不是现在制造平台或算法型子项。
        en: Open search also examined weak negotiation, plaintext paths, and derived-material distortion behind encrypted appearance. Weak negotiation and derived-material distortion may require different forensics, but direct malicious evidence here establishes only the latter. Plaintext paths are often directly visible in routine traffic inspection, and no independent stable stealth variable with conclusion-level case evidence is established. Future sources showing distinct control surface, residue, and defensive method should reopen taxonomy rather than manufacturing platform- or algorithm-named children now.
  coverage: none-justified
  subtechnique_refs: []
defense:
  detections: {coverage: available, strategy_refs: [DET-000137]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000126]}
evidence:
  claim_refs: [CLM-000683, CLM-000684, CLM-000685]
  case_refs: [CASE-000173]
  reference_refs: [REF-000466, REF-000467, REF-000468]
research:
  limitations:
    paragraphs:
      - zh: Cisco 的 2015 原始取证直接支持恶意 IOS 映像削弱 DH 密钥材料及表面加密外观，2020 回顾支持攻击者停用硬件加速的实施广度；二者没有给出每一条受害会话的最终解密记录，也没有证明加速器停用本身必然使软件密码变弱。正式父级因此把实际会话强度或受控测试作为完成门槛，不把硬件事件升级成子项。
        en: Cisco's 2015 original forensics directly supports malicious IOS images weakening DH keying material under an encrypted appearance, and its 2020 retrospective supports the breadth of accelerator disablement. Neither documents final decryption of every victim session or proves that disabling acceleration necessarily weakens software cryptography. The parent therefore requires real session strength or a controlled test as its completion gate and does not promote a hardware event into a child.
      - zh: 网络设备的运行内存测量、密钥交换测试和真实对等体协商可能不可同时取得。公开文档只支持特定 IOS 家族与取证条件，不能推断其他厂商产品相同；若设备已被完全控制，其自报配置也不可信。缺少不同权证明时须保留 suspected_config_change 或 unresolved，人工评审需复核零 NJS 结论与 T1689/T1601 边界。
        en: Running-memory measurement, key-exchange testing, and real peer negotiation may not all be available on a network device. Public documentation supports particular IOS families and forensic conditions, not identical behavior in other vendors. A fully compromised device's self-reported configuration is untrusted. Without differently authorized proof retain suspected_config_change or unresolved, and have human reviewers revisit the zero-NJS conclusion and T1689 or T1601 boundaries.
