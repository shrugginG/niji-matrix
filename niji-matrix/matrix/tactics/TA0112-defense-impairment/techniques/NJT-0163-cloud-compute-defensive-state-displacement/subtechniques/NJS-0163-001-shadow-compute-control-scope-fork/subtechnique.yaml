schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0163-001
name: {zh: 影子计算控制范围分叉, en: Shadow-Compute Control-Scope Fork}
summary: {zh: 攻击者创建或派生新计算身份，并在等效安全控制生效前让它承载后继活动。, en: Adversaries create or derive a new compute identity and make it carry follow-on activity before equivalent security controls become effective.}
aliases: []
parent_ref: NJT-0163
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 影子计算控制范围分叉是攻击者在受害云账户或项目内创建空白实例，或从既有映像、快照、卷派生新实例，使新的 resource ID 在网络、IAM、安全代理、集中日志或策略注册尚未达到原资源等效状态时开始工作。直接目标是新 lineage 的控制范围差，而不是一般云实例创建。
      en: Shadow-Compute Control-Scope Fork is adversary creation of a blank instance or derivation of a new instance from an existing image, snapshot, or volume inside a victim cloud account or project, followed by use while network, IAM, security-agent, centralized-log, or policy enrollment for the new resource ID is not yet equivalent to the original. Its direct target is the new lineage's control-scope difference rather than cloud-instance creation in general.
    - zh: “分叉”表示数据或操作语义从受管 lineage 复制或转移到新的计算身份，而旧资源的代理和历史不会因内容相同自动继承。空白新实例也可形成 root fork，但必须证明攻击者在控制 checklist 完成前首用。新订阅/项目层级归 NJT-0126，本子项只处理同一治理节点内的计算身份。
      en: Fork means that data or operational semantics copy or move from a governed lineage into a new compute identity whose agents and history do not automatically follow merely because content is the same. A blank instance can form a root fork but needs proof of adversary first use before the control checklist completes. New subscription or project hierarchy belongs to NJT-0126; this child concerns compute identity within the same governed node.
stealth_characteristics:
  paragraphs:
    - zh: 影子计算控制范围分叉让新实例在云清单中呈现为正常部署，并可能使用合法映像、标签和自动化主体；原实例上的 EDR、主机日志、漏洞状态和行为基线却仍绑定旧 resource ID。防守若只看当前模板合规或旧实例健康，会把新身份首用解释为注册延迟，而攻击活动已经在无历史窗口内发生。
      en: Shadow-Compute Control-Scope Fork leaves a new instance looking like ordinary provisioning in cloud inventory and can use a legitimate image, label, and automation principal, while EDR, host logs, vulnerability state, and behavioral baseline on the original remain bound to the old resource ID. Defenders checking only template compliance or old-instance health may interpret first use of the new identity as enrollment delay after adversary activity already occurred in a history-free interval.
    - zh: 残余包括创建/快照 actor、source→new lineage、映像/卷、网络/IAM、user data、首个 boot/token/flow/process 及每项控制生效时间。强制创建门禁、隔离未注册实例和跨 resource lineage 关联会消除分叉收益；新实例在首用前已具等效控制时不成立。
      en: Residue includes creation or snapshot actor, source-to-new lineage, image or volume, network and IAM, user data, first boot, token, flow, or process, and each control's effective time. Mandatory creation gates, quarantine of unenrolled instances, and cross-resource lineage correlation remove the benefit. The child does not hold when equivalent controls are effective before first use.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求攻击者控制新计算 identity、能连接来源或 root lineage、至少一项批准安全控制在首个恶意/高风险活动时未生效，且活动利用该窗口。只创建 VM、快照或挂载卷，或只有代理管理面上报延迟但控制已工作时不确认。批准的扩容、蓝绿、灾备和取证克隆在首用前完成 checklist 时排除。
      en: Include only when an adversary controls a new compute identity, its source or root lineage is connectable, at least one approved security control is ineffective at the first malicious or high-risk activity, and activity uses that interval. VM or snapshot creation, volume attachment, or management-plane agent-reporting delay with an effective control is not confirmation. Approved scaling, blue-green release, recovery, and forensic clones are excluded when their checklist completes before first use.
    - zh: 云 hierarchy 新节点归 NJT-0126，区域选择归 NJT-0121，防火墙差归 NJT-0124，数据从快照被读取归 Collection/Credential Access。子项不按 AWS/Azure/GCP、VM 类型、snapshot/AMI 或 agent 品牌分；这些只是 lineage 和控制字段。
      en: A new cloud hierarchy node belongs to NJT-0126, region selection to NJT-0121, firewall difference to NJT-0124, and data read from a snapshot to Collection or Credential Access. The child is not divided by AWS, Azure, GCP, VM type, snapshot or AMI, or agent brand; those are lineage and control fields.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者拥有受害云的实例/快照权限后，可复制敏感卷到新 VM，绑定更宽网络或 IAM，在 EDR 和集中日志完成注册前进行读取、横向或 C2。Microsoft 观察 LAPSUS$ 在受害云内建立攻击者 VM，CISA/FBI 观察 Scattered Spider 转入新建 EC2；这些案例证明恶意新 lineage，具体失防仍需本地 checklist 与首用时间。
        en: After obtaining instance or snapshot rights in a victim cloud, an adversary can copy a sensitive volume into a new VM, attach broader network or IAM, and read, move laterally, or conduct C2 before EDR and centralized logging enroll. Microsoft observed LAPSUS$ establish actor VMs in victim clouds, and CISA or FBI observed Scattered Spider move into newly created EC2. These cases establish malicious new lineage, while specific impairment still needs local checklist and first-use timing.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要创建或派生实例、附加磁盘、配置网络/IAM并启动工作负载的权限，理解控制注册的依赖和延迟。强制模板、组织策略、无代理网络监测、JIT 权限和首用门禁会缩短或关闭窗口；异常映像、标签和高成本资源也可能暴露。
          en: The adversary needs authority to create or derive instances, attach disks, configure network and IAM, and start workloads plus knowledge of control enrollment dependencies and delay. Mandatory templates, organization policy, agentless network monitoring, JIT authority, and first-use gates shorten or close the interval, while anomalous images, labels, and costly resources may expose activity.
    defender_model:
      paragraphs:
        - zh: 防守方能读取生命周期 actor/request、snapshot/image lineage、资源 ID、网络/IAM、模板审批、每项控制的 expected/enrolled/effective 和首个来宾/网络活动。不能只依赖 agent 自报；新身份在 agent 前活动需要网络、身份和控制面侧信号补足。跨账户复制缺失来源时结论降级。
          en: Defenders can read lifecycle actor and request, snapshot or image lineage, resource ID, network and IAM, template approval, expected, enrolled, and effective state for each control, and first guest or network activity. They cannot rely only on agent self-report; pre-agent activity on a new identity needs network, identity, and control-plane signals. Missing provenance on cross-account copy lowers confidence.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 新资源正常部署外观遮蔽旧实例控制未随 lineage 继承, en: Ordinary new-resource provisioning conceals that controls on the old instance did not follow the lineage}
    analysis:
      paragraphs:
        - zh: 攻击者用受信生命周期 API 生成新计算 identity，云侧呈现标准创建/挂载/启动事件，而防御注册和来宾历史仍停留在旧资源。痕迹被拆成正常控制面部署与新身份上的低可见活动，防守若不追踪 source→new lineage 就无法在首用窗口应用原基线，形成行为透明。
          en: The adversary uses trusted lifecycle APIs to generate a new compute identity. The cloud shows standard create, attach, and start events while defensive enrollment and guest history remain on the old resource. Traces split into ordinary control-plane provisioning and low-visibility activity on the new identity. Without source-to-new lineage, defenders cannot apply the old baseline during first use, producing behavioral transparency.
    evidence_refs: [REF-000103, REF-000697, REF-000698]
    confidence: medium
