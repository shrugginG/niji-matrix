research:
  limitations:
    paragraphs:
      - zh: 两条事件来源直接证明新 VM/EC2 被恶意使用，但没有公开每个资源的控制 enrollment；子项因此依赖强推断并保持 medium。若组织采用 agentless 控制或模板在首用前已完成等效保护，表面“无 agent”不能证明分叉。跨账户复制和自动伸缩还可能破坏 lineage 完整性。
        en: Two incident sources directly establish malicious use of new VMs or EC2 but do not publish control enrollment for each resource, so the child relies on strong inference and remains medium. If agentless controls apply or a template completes equivalent protection before first use, apparent absence of an agent does not prove a fork. Cross-account copy and autoscaling may also break lineage completeness.
