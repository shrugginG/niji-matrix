research:
  limitations:
    paragraphs:
      - zh: LAPSUS$ 来源直接证明窃取后删除资源，但主要动机可为破坏或危机操纵，不直接证明每个资源的取证缺口；Google 文档证明永久删除可能性但不是事件。子项保持 medium，并要求 target interval 与不可恢复结果。快照回退的恶意现场案例仍有限。
        en: The LAPSUS$ source directly establishes resource deletion after theft, but the primary motive may be destruction or crisis manipulation and does not prove a forensic gap for every resource. Google documentation establishes permanent-deletion possibility but is not an incident. The child remains medium and requires a target interval plus unrecoverable outcome. Malicious field cases for snapshot reversion remain limited.
