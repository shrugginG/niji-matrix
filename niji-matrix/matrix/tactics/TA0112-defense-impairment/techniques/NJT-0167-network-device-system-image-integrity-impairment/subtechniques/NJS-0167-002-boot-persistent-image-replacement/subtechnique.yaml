schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0167-002
name: {zh: 启动持久映像替换, en: Boot-Persistent Image Replacement}
summary: {zh: 攻击者把修改写入闪存、ROMMON、启动目标或关键 appliance 组件，使后续重载继续消费恶意代码。, en: "Adversaries store changes in flash, ROMMON, a boot target, or critical appliance components so later reloads continue consuming malicious code."}
aliases: []
parent_ref: NJT-0167
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 启动持久映像替换是攻击者改变设备存储的系统映像、ROMMON/bootloader、boot variable 或与整体 appliance 功能共同发布的关键组件，使修改在当前或后续启动被实际加载并跨重载存在。直接对象是存储状态—启动消费—功能结果链，不是文件落盘或固件版本号。
      en: Boot-Persistent Image Replacement is adversary change to a stored system image, ROMMON or bootloader, boot variable, or critical component distributed with the appliance so the mutation actually loads at current or later boot and persists across reload. Its direct object is the stored-state to boot-consumption to functional-outcome chain rather than a file written to disk or firmware version string.
    - zh: 设备内 manifest、版本和升级界面可能与恶意组件一起被修改；因此信任源必须位于设备之外。PHASEJAM 修改组件和 manifest 并阻断升级，Cisco 事件显示闪存/ROMMON 可跨重载持续。没有启动消费的 staged image 只是暴露。
      en: An on-device manifest, version, and upgrade interface can be modified with the malicious component, so the trust source must be external. PHASEJAM changes components and manifests while blocking upgrade, and Cisco incidents show flash or ROMMON persistence across reload. A staged image not consumed at boot is exposure only.
stealth_characteristics:
  paragraphs:
    - zh: 启动持久映像替换让设备在重启、甚至正常升级后继续以相同管理身份运行；攻击者可同步改写 manifest 或伪造升级进度，使本地完整性/恢复反馈认可受损状态。表面版本、配置和服务可保持正常，真正差异位于外部厂商 hash、boot measurement 与 post-boot 功能。
      en: Boot-Persistent Image Replacement lets a device continue under the same management identity after reboot and sometimes after a normal upgrade. The adversary can co-rewrite a manifest or forge upgrade progress so local integrity or recovery feedback accepts the compromised state. Visible version, configuration, and service can remain normal while the real difference lies in external vendor hashes, boot measurement, and post-boot function.
    - zh: 残余包括 image/boot writer、来源 URI/hash、flash slot、ROMMON/boot variable、reload ID、Trust Anchor 决策、loaded image、外部 manifest 差和升级/认证/遥测 canary。signed image、secure boot、不同权信任库和已知良好重装会压缩匿迹；启动根或供应链同时受损时置信度降低。
      en: Residue includes image or boot writer, source URI and hash, flash slot, ROMMON or boot variable, reload ID, Trust Anchor decision, loaded image, external-manifest difference, and upgrade, authentication, or telemetry canary. Signed images, secure boot, a separately authorized trust store, and known-good reinstall reduce stealth. Confidence falls when the boot root or supply chain is also compromised.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求未批准映像/组件被存储并在 boot_id 中实际消费，可信签名/hash/manifest 或 boot measurement 与批准来源不同，并有安全/观察/恢复结果。只写入未激活 slot、合法升级、版本陈旧或设备内 manifest 差不足。仅当前内存不同归 NJS-0167-001。
      en: Include only when an unapproved image or component is stored and actually consumed in a boot_id, trusted signature, hash, manifest, or boot measurement differs from approved provenance, and a security, observation, or recovery outcome follows. A write to an inactive slot, legitimate upgrade, old version, or on-device manifest difference alone is insufficient. A current-memory-only difference belongs to NJS-0167-001.
    - zh: 可信旧映像回退且无恶意代码修改归 NJT-0127；pre-OS bootkit 持久化可并记 NJT-0097；PHASEJAM 错误反馈并记 NJS-0123-004。子项不按 ROMMON/flash/module、厂商或 patch/downgrade 拆分。
      en: Rollback to a trusted old image without malicious code mutation belongs to NJT-0127. Pre-OS bootkit persistence may also map to NJT-0097, and PHASEJAM false feedback to NJS-0123-004. The child is not divided by ROMMON, flash, module, vendor, or patch versus downgrade.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者取得映像或 appliance root 权限后，可替换 IOS/固件、修改 ROMMON 或关键认证/升级组件，并更新本地 manifest，使设备重启后继续后门、遥测阻断或升级阻断。维护窗口和紧急升级可提供外观掩护。
        en: After image or appliance-root authority, an adversary can replace IOS or firmware, modify ROMMON or critical authentication or upgrade components, and update the local manifest so backdoor, telemetry blocking, or upgrade blocking continues after reboot. Maintenance windows and emergency upgrades can provide cover.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 需要 flash/boot/组件写权、可信格式和依赖知识、重载机会，以及绕过签名/Trust Anchor 或篡改本地验证的能力。错误映像可能使设备变砖；离线厂商 hash、只读启动根和双人审批限制路径。
          en: The adversary needs flash, boot, or component write authority, knowledge of trusted formats and dependencies, a reload opportunity, and the ability to bypass signatures or Trust Anchor or tamper with local validation. A bad image can brick the device; offline vendor hashes, a read-only boot root, and two-person approval constrain the path.
    defender_model:
      paragraphs:
        - zh: 防守方保存外部厂商签名/hash/manifest、映像写和 boot variable 审计、实际启动测量、post-boot 组件与 canary、可信恢复副本。设备内 hash/版本只能作为一个视图；重载前后必须按 boot/reload ID 连接。
          en: Defenders retain external vendor signatures, hashes, manifests, image-write and boot-variable audit, actual boot measurement, post-boot components and canaries, and trusted recovery copies. On-device hash or version is one view only, and before and after states require boot or reload ID correlation.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 设备身份与本地可信反馈掩盖跨重载恶意映像, en: Device identity and local trust feedback conceal a malicious image across reload}
    analysis:
      paragraphs:
        - zh: 攻击者让设备从恶意存储映像启动，同时保留名称、角色和管理界面，并可同步修改 manifest/升级显示；防守按本地反馈把运行代码归类为批准版本。外部签名、Trust Anchor 与 boot/post-boot 差分揭示这种特征伪装。
          en: The adversary boots the device from a malicious stored image while preserving name, role, and management interface and can co-modify manifest or upgrade display. Defenders relying on local feedback classify the running code as approved. External signatures, Trust Anchor, and boot-to-post-boot differential expose the feature disguise.
    evidence_refs: [REF-000449, REF-000467, REF-000468, REF-000720]
    confidence: high
defense:
  detections: {coverage: available, strategy_refs: [DET-000190]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000171]}
evidence:
