  reference_refs: [REF-000449, REF-000467, REF-000468, REF-000720]
research:
  limitations:
    paragraphs:
      - zh: Cisco 与 PHASEJAM 提供直接高置信事件，但实现从 monolithic IOS/ROMMON 到 appliance 文件组件不完全相同；只有组件属于设备受信系统映像面并被启动/服务消费时才可类推。供应链签名恶意、首个基线已失陷和缺少 Trust Anchor 会削弱结论。
        en: Cisco and PHASEJAM provide direct high-confidence incidents, but implementations range from monolithic IOS or ROMMON to appliance file components. Generalization applies only when the component belongs to the trusted system-image plane and is consumed by boot or service. Malicious supply-chain signing, a compromised first baseline, and absent Trust Anchor weaken the conclusion.
