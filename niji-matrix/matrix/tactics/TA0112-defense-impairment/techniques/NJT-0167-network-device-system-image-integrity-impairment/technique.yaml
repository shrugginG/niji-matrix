schema_version: "2.0.0"
type: technique
id: NJT-0167
name: {zh: 网络设备系统映像完整性削弱, en: Network-Device System-Image Integrity Impairment}
summary: {zh: 攻击者修改网络设备实际运行或启动消费的系统映像，使安全、观察或恢复能力在受信设备身份下发生未批准变化。, en: "Adversaries modify the system image actually running or consumed at boot on a network device so security, observation, or recovery changes under a trusted device identity."}
aliases: [Modify System Image, T1601]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1601, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1601
definition_and_concept:
  paragraphs:
    - zh: 网络设备系统映像完整性削弱是攻击者改变嵌入式路由器、防火墙、VPN 或其他网络设备实际执行的操作系统/关键 appliance 代码，使受信设备继续提供网络服务时增加攻击者能力或降低安全、观察和恢复功能。直接对象是可信持久映像、启动链和运行代码之间的完整性关系，而不是固件文件名、厂商或版本标签。
      en: Network-Device System-Image Integrity Impairment is adversary change to operating-system or critical appliance code actually executed by an embedded router, firewall, VPN, or other network device, adding adversary capability or reducing security, observation, and recovery while the trusted device continues network service. The direct object is the integrity relationship among trusted persistent image, boot chain, and running code rather than firmware filename, vendor, or version label.
    - zh: 修改可只存在于当前 boot 的运行内存，也可写入闪存、ROMMON、bootloader 或 appliance 组件并在后续重载再次消费。映像差异只有与实际加载和功能结果连接才成立；未启动的恶意映像只是 staged risk，普通升级或旧版本也不自动等于本技术。
      en: A mutation can exist only in running memory for the current boot or be stored in flash, ROMMON, bootloader, or appliance components and consumed again after reload. An image difference qualifies only when joined to actual loading and functional outcome. An unbooted malicious image is staged risk, while ordinary upgrade or an old version is not automatically this technique.
stealth_characteristics:
  paragraphs:
    - zh: 网络设备系统映像完整性削弱保留设备地址、管理身份、业务转发和常见版本外观，使防守把受损代码当作正常设备功能。运行时补丁可让 flash hash 完全可信，持久替换则可同步修改设备内 manifest 或模拟升级成功；配置备份和普通 CLI 视图因此未必显示真实代码差。Cisco 与 PHASEJAM 分别展示内存/映像差和本地可信反馈被攻击者塑造。
      en: Network-Device System-Image Integrity Impairment preserves device address, management identity, business forwarding, and familiar version appearance, leading defenders to treat compromised code as normal device function. A runtime patch can leave the flash hash fully trusted, while a persistent replacement can co-modify an on-device manifest or simulate upgrade success. Configuration backup and ordinary CLI views may therefore miss the real code difference. Cisco incidents and PHASEJAM respectively demonstrate memory or image differentials and attacker-shaped local trust feedback.
    - zh: 残余包括 AAA/CLI debug 与 image write、来源 URI/hash、flash/boot target、签名/Trust Anchor、boot_id、运行内存/模块/core dump、版本/manifest 外部对照和流量/认证/遥测 canary。不同权厂商信任库、启动测量和重载前内存保全可恢复事实；只信任设备自报会在 OS 被控制时失去独立性。
      en: Residue includes AAA or CLI debug and image writes, source URI and hash, flash and boot target, signature or Trust Anchor, boot_id, running memory, modules, core dump, external version or manifest comparison, and traffic, authentication, or telemetry canaries. A separately authorized vendor trust store, boot measurement, and pre-reload memory preservation recover facts. Device self-report alone loses independence when the OS is controlled.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求攻击者控制映像/关键组件变化、证明设备实际运行或启动消费该变化，并出现安全、观察或恢复能力相对可信基线的结果差。只发现不同 hash、旧版本、未加载 image、配置变化或合法升级失败时，不确认完成。运行内存差没有持久修改归 NJS-0167-001，跨重载存储/启动差归 NJS-0167-002。
      en: Include only when an adversary controls an image or critical-component mutation, the device actually runs or boots the mutation, and a security, observation, or recovery outcome differs from trusted baseline. A different hash, old version, unconsumed image, configuration change, or failed legitimate upgrade alone does not confirm completion. A running-memory difference without persistent mutation belongs to NJS-0167-001; a stored or boot difference crossing reload belongs to NJS-0167-002.
    - zh: 可信旧版本实际运行且能力退化归 NJT-0127，加密强度归 NJT-0128，防火墙策略归 NJT-0124，认证 decision path 归 NJT-0093，工具反馈伪造可并记 NJT-0123。主机普通二进制替换、容器映像和 pre-OS 持久化各有 owner；仅网络设备整体映像信任面属于本项。
      en: A trusted older version actually running with reduced capability belongs to NJT-0127, cryptographic strength to NJT-0128, firewall policy to NJT-0124, authentication decision path to NJT-0093, and forged tool feedback may also map to NJT-0123. Ordinary host-binary replacement, container images, and pre-OS persistence have separate owners. This object owns the whole-image trust plane of network devices.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 取得网络设备高权的攻击者可借调试 CLI 在运行 IOS 内存植入数据复制/NAT/后门，避免改变 flash；也可替换持久 IOS、ROMMON 或 appliance 关键组件，使重启后继续加载并阻止可信升级。攻击服务于长期访问、流量观察、认证绕过或隐藏其他活动，但每项结果仍需相应证据。
        en: An adversary with privileged network-device access can use debugging CLI to implant data-copy, NAT, or backdoor behavior into running IOS memory without changing flash, or replace persistent IOS, ROMMON, or critical appliance components so the mutation loads again after reboot and blocks trusted upgrade. The path can support long-term access, traffic observation, authentication bypass, or hiding other activity, while each result still needs its own evidence.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 运行时路径需要 debug/内存写权限、设备架构和函数布局知识，并在崩溃/重载前完成目标；持久路径需要 flash/image/boot 写权、签名/manifest 绕过和重启机会。攻击者可能同步修改 version/manifest 或伪造升级反馈。JIT AAA、命令审计、Trust Anchor、signed image、只读 boot、内存证明和原厂恢复提高成本。
          en: The runtime path needs debug or memory-write authority, device-architecture and function-layout knowledge, and completion before crash or reload. The persistent path needs flash, image, or boot write authority, signature or manifest bypass, and a reboot opportunity. The adversary may co-modify version or manifest or forge upgrade feedback. JIT AAA, command audit, Trust Anchor, signed images, read-only boot, memory attestation, and vendor recovery raise cost.
    defender_model:
      paragraphs:
        - zh: 防守方能从不同权厂商库取得型号/版本/hash/签名/manifest，并读取 AAA/CLI、flash/boot target、Trust Anchor、boot measurement、运行内存或 core dump、post-boot 组件和功能 canary。运行时证据可能在重载后消失，故先保全再恢复；持久证据需要跨重载关联，不能以设备内 manifest 作为唯一黄金源。
          en: Defenders obtain model, version, hash, signature, and manifest from a separately authorized vendor store and read AAA or CLI, flash and boot target, Trust Anchor, boot measurement, running memory or core dump, post-boot components, and functional canaries. Runtime evidence can disappear after reload, requiring preservation before recovery. Persistent evidence needs cross-reload correlation, and an on-device manifest cannot be the only golden source.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 受信设备身份与版本外观掩盖实际运行或启动代码差, en: Trusted device identity and version appearance conceal the code difference actually running or booted}
    analysis:
      paragraphs:
        - zh: 攻击者保留设备名称、网络角色、管理界面和业务行为的熟悉特征，只在运行内存、持久映像或启动组件改变关键代码；设备仍被归类为批准资产，版本/manifest 甚至可被同步伪造。防守若依赖可见版本与配置，会忽略代码完整性差；外部映像信任、内存与启动测量揭示特征伪装。
          en: The adversary preserves familiar device name, network role, management interface, and business behavior while changing critical code only in running memory, persistent image, or boot component. The device remains classified as an approved asset, and version or manifest can even be forged in tandem. Defenders relying on visible version and configuration miss the code-integrity difference, while external image trust plus memory and boot measurements expose the feature disguise.
    evidence_refs: [REF-000449, REF-000467, REF-000468, REF-000720]
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: NJS-0167-001“运行内存映像即时修改”以持久映像可信、当前 boot 的运行代码不同且重载后消失为变量，证据窗口在重启前，恢复可通过可信重载但必须先取证。NJS-0167-002“启动持久映像替换”以 flash/ROMMON/boot/appliance 组件被存储并在后续 boot 再消费为变量，需要签名/Trust Anchor、跨重载测量和可信重装。两者的证据时机与恢复不可互换。
        en: NJS-0167-001 Runtime-Memory Image Mutation varies a trusted persistent image with different running code in the current boot that disappears after reload. Its evidence window is pre-reboot, and recovery can use a trusted reload only after forensics. NJS-0167-002 Boot-Persistent Image Replacement varies flash, ROMMON, boot, or appliance components stored and consumed again in later boots, requiring signing or Trust Anchor, cross-reload measurement, and trusted reinstallation. Their evidence timing and recovery are not interchangeable.
      - zh: ATT&CK Patch 与 Downgrade 可在任一拓扑发生，只是变更语义；不作为 NJS。可信旧版本能力下降归 NJT-0127，平台/厂商/映像格式与具体模块也不形成兄弟项。PHASEJAM 组件与 manifest 修改归持久子项，同时可并记工具反馈伪造结果。
        en: ATT&CK Patch and Downgrade can occur in either topology and describe mutation semantics rather than NJS. Reduced capability from a trusted older version belongs to NJT-0127, while platform, vendor, image format, and module do not define siblings. PHASEJAM component and manifest modification belongs to the persistent child and may also map to forged tool-feedback outcome.
  coverage: established
  subtechnique_refs: [NJS-0167-001, NJS-0167-002]
defense:
  detections: {coverage: available, strategy_refs: [DET-000190]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000171]}
evidence:
  claim_refs: [CLM-000821, CLM-000822, CLM-000823, CLM-000824, CLM-000825]
  case_refs: [CASE-000168, CASE-000231, CASE-000232]
  reference_refs: [REF-000449, REF-000467, REF-000468, REF-000720]
research:
  limitations:
    paragraphs:
      - zh: Cisco 取证直接区分运行内存、闪存 IOS 与 ROMMON 拓扑，PHASEJAM 直接证明关键 appliance 组件和 manifest 可被同步篡改；案例集中于少数网络设备家族，不能无条件推广。T1601 当前 DRYHOOK 例子修改认证模块，其整体映像边界仍需按设备架构解释，因此父级要求实际 trust-plane 结果。
        en: Cisco forensics directly distinguishes running-memory, flash-IOS, and ROMMON topologies, while PHASEJAM directly establishes co-tampering of critical appliance components and manifests. Cases concentrate on a few network-device families and cannot be generalized unconditionally. The current T1601 DRYHOOK example modifies an authentication module, whose whole-image boundary still depends on device architecture, so the parent requires an actual trust-plane outcome.
      - zh: 很多旧设备缺少运行证明、secure boot 或可导出的 core dump，设备 OS 被控制后版本/hash 自报不可信。获取内存和重装可能造成停机，错误恢复会破坏配置。没有外部可信源、实际消费和功能结果时，只能报告 image integrity anomaly，不能宣称防御削弱。
        en: Many legacy devices lack runtime attestation, secure boot, or exportable core dumps, and OS self-reported version or hash is untrusted after compromise. Memory acquisition and reinstallation can cause downtime, while bad recovery can destroy configuration. Without an external trust source, actual consumption, and functional outcome, report an image-integrity anomaly rather than defensive impairment.
