schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0168-002
name: {zh: 叠加中继边界桥接, en: Overlay-Relay Boundary Bridge}
summary: {zh: 攻击者运行同时触达两个安全域的进程、服务或隧道，以成对会话跨越边界而不修改底层路由。, en: "Adversaries run a process, service, or tunnel that reaches two security domains and crosses the boundary with paired sessions without changing the underlying route."}
aliases: []
parent_ref: NJT-0168
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 叠加中继边界桥接是攻击者在双宿主主机、管理跳板、受侵 MSP/VPN 入口或可达两域的节点上运行 FRP、VPN、proxy 或等价 relay，以一个 inbound 和一个 outbound session 转发原本禁止的跨域流量，而底层边界 route/ACL 可保持不变。直接对象是 relay identity—paired sessions—domain pair。
      en: Overlay-Relay Boundary Bridge is adversary operation of FRP, VPN, proxy, or an equivalent relay on a dual-homed host, management jump box, compromised MSP or VPN entry, or another node reaching two domains, forwarding prohibited cross-domain traffic through one inbound and one outbound session while the underlying boundary route or ACL can remain unchanged. Its direct object is relay identity to paired sessions to domain pair.
    - zh: relay 工具和加密协议只是载体；同一主机同时有独立客户端和服务器会话不等于转发。只有 session 在时间、容量、协议/内容和因果上配对，并跨越禁止域对时完成。底层设备配置变化是兄弟项。
      en: Relay tools and encrypted protocols are carriers only. Independent client and server sessions on one host are not forwarding. Completion requires sessions paired by time, volume, protocol or content, and causality across a prohibited domain pair. Underlying device configuration change belongs to the sibling.
stealth_characteristics:
  paragraphs:
    - zh: 叠加中继边界桥接可以使用签名 VPN、常见代理或普通 TLS，使入口和出口各自呈现为允许工具的一条连接；攻击者无需留下边界路由 diff。真正异常在于 relay process/tunnel 同时绑定两个域并转发相关字节流。没有 process/socket 归因和双侧 flow 时，单个加密会话很难与合法 MSP/运维区分。
      en: Overlay-Relay Boundary Bridge can use a signed VPN, familiar proxy, or ordinary TLS so ingress and egress each appear as one connection from an allowed tool, with no boundary-route difference. The anomaly is the relay process or tunnel binding two domains and forwarding related byte streams. Without process or socket attribution and bilateral flows, one encrypted session is difficult to distinguish from legitimate MSP or administration.
    - zh: 残余包括 binary/signature、command/config、principal/session、listener、tunnel ID、接口/namespace、两侧 socket/flow、byte ratio、burst 和目的 peer。应用控制、禁止未登记双宿主、准确 peer/domain allowlist 与对侧监测会压缩；工具改名不会消除会话关系。
      en: Residue includes binary and signature, command or configuration, principal and session, listener, tunnel ID, interface or namespace, bilateral sockets or flows, byte ratio, bursts, and destination peer. Application control, prohibition of unregistered dual-homing, exact peer or domain allowlists, and other-side monitoring reduce stealth. Renaming the tool does not remove the session relationship.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求 relay 未批准或 owner/用途不符、节点/入口同时触达两个安全域、成对会话可连接且承载禁止访问/载荷/外送。只发现 FRP/VPN/proxy、监听端口、第三方登录或一侧连接时不确认。批准 MSP VPN、跳板、服务网格和灾备 relay 用准确域对、peer、binary、工单与期限排除。
      en: Include only when the relay is unapproved or mismatches owner or purpose, the node or entry reaches two security domains, paired sessions are connectable, and they carry prohibited access, payloads, or exfiltration. FRP, VPN, proxy, a listening port, third-party sign-in, or one-sided connection alone is insufficient. Approved MSP VPNs, jump boxes, service meshes, and recovery relays are excluded through exact domain pair, peer, binary, ticket, and expiry.
    - zh: 边界设备 route/NAT/ACL/proxy 被改写归 NJS-0168-001；同域 proxy、普通 C2 和 multi-hop proxy 没有分段结果归通信对象；凭据取得和在目标执行分别归 Credential Access/Lateral Movement/Execution。工具/协议不形成更多子项。
      en: Rewritten route, NAT, ACL, or proxy on a boundary device belongs to NJS-0168-001. Same-domain proxy, ordinary C2, and multihop proxy without a segmentation result belong to communication objects. Credential acquisition and execution on a target belong to Credential Access, Lateral Movement, or Execution. Tool and protocol do not create more children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者控制具有两域接口的管理主机或第三方 VPN 后，部署 FRP/反向代理或建立 VPN tunnel，把外部/企业网会话转发到受限关键基础设施，或将受限区数据转发出网。印度电网报告支持 FRP 与可能受侵 MSP VPN 的此类路径。
        en: After controlling a management host with interfaces in two domains or a third-party VPN, an adversary deploys FRP or a reverse proxy or establishes a VPN tunnel to forward an external or corporate session into restricted critical infrastructure or relay restricted-zone data outward. Indian power-grid reporting supports this pattern through FRP and a potentially compromised MSP VPN.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 需要在 relay 主体运行服务/进程或控制隧道、到达两域、维持 peer 和 egress，并了解允许协议/第三方信任。主机应用控制、最小双宿主、VPN peer 限定、出站 deny 和进程 socket telemetry 会暴露；relay 容量与稳定性也限制。
          en: The adversary needs authority to run a service or process or control a tunnel on the relay principal, reach both domains, maintain peer and egress, and understand allowed protocols or third-party trust. Host application control, minimal dual-homing, VPN peer restrictions, egress denial, and process-socket telemetry expose the path, while relay capacity and stability constrain it.
    defender_model:
      paragraphs:
        - zh: 防守方维护双宿主/第三方/relay inventory，取得进程/服务、listener/tunnel、principal/session 与两侧 flow，并可按时间/byte/protocol 配对。加密时无需解密但需要容量和因果；MSP 不共享目的日志时置信度下降。
          en: Defenders maintain dual-homed, third-party, and relay inventory and obtain process or service, listener or tunnel, principal or session, and bilateral flows that can be paired by time, bytes, and protocol. Encryption need not be broken but volume and causality are needed. Confidence falls when an MSP does not share destination logs.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 两条普通加密会话在受信 relay 上组合成禁止跨域路径, en: Two ordinary encrypted sessions combine on a trusted relay into a prohibited cross-domain path}
    analysis:
      paragraphs:
        - zh: 攻击者让 relay 分别与两域建立看似正常的会话，单侧监控只看到合法工具/协议；转发语义存在于两个 session 的组合。缺少 relay identity 和双侧 flow 关联时策略绕过不进入默认检测，形成行为透明。
          en: The adversary makes the relay establish an apparently ordinary session with each domain, leaving one-sided monitoring with a legitimate-looking tool or protocol. Forwarding semantics exist only in the combination of two sessions. Without relay identity and bilateral flow correlation, policy bypass does not enter default detection, producing behavioral transparency.
    evidence_refs: [REF-000721, REF-000724]
    confidence: medium
defense:
  detections: {coverage: available, strategy_refs: [DET-000191]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000172]}
evidence:
  claim_refs: [CLM-000828, CLM-000829, CLM-000830]
  case_refs: [CASE-000234]
  reference_refs: [REF-000721, REF-000724]
research:
  limitations:
    paragraphs:
      - zh: Recorded Future/ATT&CK 支持 FRP/VPN 桥接，但公开资料没有完整 PID/socket/flow 配对，故 medium。加密 relay、NAT 和第三方日志缺失会降低归因；合法运维中继非常相似，必须依赖批准路径和具体 owner/用途，而不能按工具名检测。
        en: Recorded Future and ATT&CK support FRP or VPN bridging but do not publish complete PID, socket, and flow pairing, keeping confidence medium. Encrypted relays, NAT, and missing third-party logs reduce attribution. Legitimate administrative relays are highly similar and require approved paths plus specific owner and purpose rather than tool-name detection.
