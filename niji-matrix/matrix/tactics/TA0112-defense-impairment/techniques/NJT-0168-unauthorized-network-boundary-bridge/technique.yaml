  claim_refs: [CLM-000826, CLM-000827, CLM-000828, CLM-000829, CLM-000830]
  case_refs: [CASE-000233, CASE-000234]
  reference_refs: [REF-000721, REF-000722, REF-000723, REF-000724]
research:
  limitations:
    paragraphs:
      - zh: ThreatNeedle 提供高粒度直接案例，APT41 NATBypass 与印度 FRP/VPN 公开细节更有限；overlay 子项保持 medium。很多组织没有完整批准 path graph 或双侧流，第三方/MSP 域也不共享日志；此时只能报告异常 relay/可达性而不能确认桥接。
        en: ThreatNeedle provides a high-detail direct case, while public detail for APT41 NATBypass and Indian FRP or VPN is more limited, keeping the overlay child medium. Many organizations lack a complete approved-path graph or bilateral flow, and third-party or MSP domains do not share logs. In those cases defenders can report anomalous relay or reachability but cannot confirm bridging.
      - zh: 合法运维、灾备、服务网格和动态路由会产生相同多接口与跨域流，单纯工具名、端口或加密长连接误报高。攻击者若同时控制两侧传感器和边界配置，端到端独立性消失，需要物理/组织外控制点。人工评审需验证 path graph 的维护成本。
        en: Legitimate administration, recovery, service meshes, and dynamic routing produce similar multi-interface and cross-domain flows, making tool-name, port, or encrypted-long-connection alerts noisy. An adversary controlling sensors on both sides plus boundary configuration removes end-to-end independence and requires a physical or organizationally external control point. Human review should validate path-graph maintenance cost.
