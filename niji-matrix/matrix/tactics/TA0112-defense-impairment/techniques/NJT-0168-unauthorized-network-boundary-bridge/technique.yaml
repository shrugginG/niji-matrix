schema_version: "2.0.0"
type: technique
id: NJT-0168
name: {zh: 未授权网络边界桥接, en: Unauthorized Network-Boundary Bridge}
summary: {zh: 攻击者在原本禁止互通的安全域之间建立可用传输路径，使流量绕过预期分段和检查。, en: "Adversaries establish a usable transit path between security domains that should not communicate, bypassing intended segmentation and inspection."}
aliases: [Network Boundary Bridging, T1599]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1599, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1599
definition_and_concept:
  paragraphs:
    - zh: 未授权网络边界桥接是攻击者在批准 path graph 明确禁止或要求特定检查的两个网络域之间，建立可归因的设备转发或叠加中继状态，并让真实流量通过该路径。直接目标是端到端可达性与 inspection path 的差，而不是一个 NAT、代理、VPN、隧道或防火墙配置对象。
      en: Unauthorized Network-Boundary Bridge is adversary establishment of attributable device-forwarding or overlay-relay state between two network domains whose approved path graph denies communication or requires a particular inspection point, followed by real traffic over that path. Its direct target is the end-to-end reachability and inspection-path difference rather than a NAT, proxy, VPN, tunnel, or firewall configuration object.
    - zh: 桥接可能由边界路由器/防火墙/路由 VM 改写 route、NAT、ACL 或 proxy，也可能由同时接触两个域的主机、MSP 入口或隧道程序以两个会话转发。两种实现都需证明域 A—bridge—域 B 的完整链；单侧监听、单条出站连接或配置变化只表示暴露。
      en: Bridging can arise when a boundary router, firewall, or router VM changes route, NAT, ACL, or proxy state, or when a host, MSP entry, or tunnel process touching both domains forwards through two sessions. Both implementations require proof of the complete domain-A to bridge to domain-B chain. A one-sided listener, one outbound connection, or configuration change shows exposure only.
stealth_characteristics:
  paragraphs:
    - zh: 未授权网络边界桥接借用受信边界设备、管理主机或合法隧道协议，使每一侧单独观察时都像普通路由、运维代理或 VPN 会话；真正异常在于同一 bridge 把本应隔离的域对连接，并可能绕过要求的检查点。缺少全局域/路径模型和双侧时间关联时，防守无法从单设备日志确认策略失效。
      en: Unauthorized Network-Boundary Bridge borrows a trusted boundary device, management host, or legitimate tunnel protocol so each side alone resembles ordinary routing, an administrative proxy, or a VPN session. The real anomaly is one bridge connecting a domain pair that should be isolated and potentially bypassing a required inspection point. Without a global domain or path model and bilateral time correlation, defenders cannot confirm policy failure from one device log.
    - zh: 残余包括边界 route/NAT/ACL/proxy old-new、AAA writer、bridge 进程/服务/隧道、listener/socket、设备 session/translation 与两侧 NetFlow/packet metadata。独立分段控制与不同权 flow 保留会压缩匿迹；若路径已经批准、检查点等效且 owner/用途一致，则不成立。
      en: Residue includes boundary route, NAT, ACL, or proxy old and new state, AAA writer, bridge process, service, or tunnel, listener and socket, device session or translation, and bilateral NetFlow or packet metadata. Independent segmentation controls and differently authorized flow retention reduce stealth. The object does not hold when the path is approved, inspection is equivalent, and owner and purpose match.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求批准模型中两个域不应互通或必须经过指定检查，攻击者控制 bridge state，双侧流量/会话可连接，并观察到禁止访问、载荷传输、交互或外送。只有代理/隧道存在、单边流、配置修改或可达性扫描时分别保留 exposure/path anomaly，不确认完成桥接。
      en: Include only when the approved model denies communication between two domains or requires a named inspection point, an adversary controls bridge state, bilateral flows or sessions are connectable, and prohibited access, payload transfer, interaction, or exfiltration is observed. Proxy or tunnel presence, one-sided flow, configuration change, or reachability scanning alone remains exposure or path anomaly rather than completed bridging.
    - zh: 单一防火墙策略削弱归 NJT-0124，配置为持久网络入口可并记持久化，凭据和主机移动归 Lateral Movement，普通 C2/多跳 proxy 由通信对象负责。批准的运维跳板、MSP VPN、服务网格、灾备互联与临时应急路径必须具有 owner、准确域对、peer、期限和等效检查证据。
      en: One-firewall policy impairment belongs to NJT-0124, configuration creating a durable network entry may also map to persistence, credentials and host movement to Lateral Movement, and ordinary C2 or multihop proxy to communication objects. Approved jump hosts, MSP VPNs, service meshes, recovery interconnects, and temporary emergency paths require owner, exact domain pair, peer, expiry, and equivalent-inspection evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者在企业网取得同时触达 corporate 与 restricted 区的路由 VM/管理主机后，可配置 proxy/route/NAT，或部署 FRP/VPN relay，使恶意样本、RDP/SSH、扫描和数据跨过分段。ThreatNeedle 事件完整展示了受侵路由 VM 的 Apache proxy、恶意样本托管和受限区外送；其他事件支持 NATBypass 与 FRP/VPN。
        en: After controlling a router VM or management host that can reach both corporate and restricted zones, an adversary can configure proxy, route, or NAT or deploy an FRP or VPN relay so malicious samples, RDP or SSH, scans, and data cross segmentation. The ThreatNeedle incident fully shows Apache proxying on a compromised router VM, malware hosting, and restricted-zone exfiltration, while other incidents support NATBypass and FRP or VPN.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 边界设备路径需要配置/AAA root 和 route/NAT/ACL/proxy 知识；overlay 路径需要在双宿主主机或第三方入口运行 relay 并维持两个会话。攻击者必须避免业务中断和显著路由异常。不同权重复分段、应用控制、出站限制、JIT 管理和第三方最小连接会阻断。
          en: The boundary-device path needs configuration or AAA root and route, NAT, ACL, or proxy knowledge. The overlay path needs a relay on a dual-homed host or third-party entry and maintenance of two sessions. The adversary must avoid business disruption and conspicuous routing anomaly. Differently authorized repeated segmentation, application control, egress restriction, JIT administration, and least third-party connectivity block the path.
    defender_model:
      paragraphs:
        - zh: 防守方维护 network_domain、trust、approved path、required inspection 和边界 owner，取得设备配置/AAA、主机进程/listener/tunnel 与边界两侧 flow/policy decision。动态路由、HA 与加密会话需要等效 path identity、时间同步和容量/协议关联；缺少任一侧时结论降级。
          en: Defenders maintain network_domain, trust, approved path, required inspection, and boundary owner and obtain device configuration and AAA, host process, listener, or tunnel, plus bilateral flows and policy decisions. Dynamic routing, HA, and encrypted sessions require equivalent path identity, time synchronization, and volume or protocol correlation. Missing either side lowers confidence.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 受信边界设备或中继把禁止跨域流量呈现为普通路由与会话, en: A trusted boundary device or relay presents prohibited cross-domain traffic as ordinary routing and sessions}
    analysis:
      paragraphs:
        - zh: 攻击者借用正常 route/proxy/VPN/relay 功能，域两侧只看到各自熟悉的连接，策略失效只在端到端 path graph 上显现。痕迹被分裂为配置或 relay 状态和两侧普通流量，缺少全链关联时关键行为落在默认分析边界之外，形成行为透明。
          en: The adversary borrows ordinary route, proxy, VPN, or relay function, leaving each domain with a familiar local connection while policy failure appears only in the end-to-end path graph. Traces split into configuration or relay state and ordinary traffic on both sides. Without full-chain correlation, critical behavior falls outside default analytics and produces behavioral transparency.
    evidence_refs: [REF-000721, REF-000722, REF-000723, REF-000724]
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: NJS-0168-001“边界设备转发路径改写”以原边界设备 route/NAT/ACL/proxy state 变化为变量，检测连接配置 old-new、writer、策略 decision 与双侧流。NJS-0168-002“叠加中继边界桥接”以独立进程/服务/隧道的两个 session 为变量，底层 route 可不变，检测连接 relay identity、listener/tunnel 与成对 flow。两者的 state key 和处置不同。
        en: NJS-0168-001 Boundary-Device Forwarding-Path Rewrite varies route, NAT, ACL, or proxy state on the original boundary device and detection joins configuration old and new, writer, policy decision, and bilateral flow. NJS-0168-002 Overlay-Relay Boundary Bridge varies two sessions of an independent process, service, or tunnel while underlying route can remain unchanged, and detection joins relay identity, listener or tunnel, and paired flow. Their state keys and response differ.
      - zh: ATT&CK T1599.001 NAT Traversal 只为第一项提供一种实现，不导入分类。FRP、VPN、Apache、router/firewall/host、协议与端口都是载体；只有设备状态和 relay session 状态构成稳定兄弟边界。只开防火墙但未形成端到端路径仍归 NJT-0124 或 exposure。
        en: ATT&CK T1599.001 NAT Traversal supplies one implementation for the first child and is not imported. FRP, VPN, Apache, router, firewall, host, protocol, and port are carriers; only device state and relay-session state define stable siblings. A firewall opening without an end-to-end path remains NJT-0124 or exposure.
  coverage: established
  subtechnique_refs: [NJS-0168-001, NJS-0168-002]
defense:
  detections: {coverage: available, strategy_refs: [DET-000191]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000172]}
