research:
  limitations:
    paragraphs:
      - zh: BPFDoor 提供直接恶意 sink 案例，GNU/Microsoft 提供平台语义，但不同 shell 可能在每条命令、退出或显式调用时写历史。共享 history、histappend、远程 home 和异常终止会改变预期，因此 analytic 必须加载版本化基线，不能用固定“退出后写入”假设覆盖所有平台。
        en: BPFDoor provides a direct malicious-sink case and GNU or Microsoft provides platform semantics, but shells can write after every command, on exit, or through an explicit call. Shared history, histappend, remote homes, and abnormal termination change expectations, so analytics require versioned baselines rather than one fixed assumption that all history writes at exit.
