  case_refs: [CASE-000241]
  reference_refs: [REF-000737, REF-000738, REF-000740]
research:
  limitations:
    paragraphs:
      - zh: APT38 案例直接支持 ignorespace，但公开资料没有完整的前后 history 序列；高置信检测依赖本地 session 对照。不同 shell 会进行 expansion、deduplication、multiline folding 或敏感内容过滤，原始输入到最终条目的规范化必须版本化，否则会产生大量假缺口。
        en: The APT38 case directly supports ignorespace but public reporting does not include a complete before and after history sequence, so high-confidence detection depends on local session comparison. Shells perform expansion, deduplication, multiline folding, or sensitive-content filtering. Normalization from raw input to final entry must be versioned or it will create many false gaps.
