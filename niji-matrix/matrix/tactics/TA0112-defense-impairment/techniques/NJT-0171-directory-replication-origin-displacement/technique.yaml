  claim_refs: [CLM-000845, CLM-000846, CLM-000847, CLM-000848]
  case_refs: []
  reference_refs: [REF-000748, REF-000749, REF-000750, REF-000751, REF-000752, REF-000753]
research:
  limitations:
    paragraphs:
      - zh: 公开来源直接支持 DCShadow 技术、协议语义、产品检测和研究复现，但没有披露可验证完整注册—复制—结果链的在野事件，因此本文不声称特定威胁组织已使用该闭环，也不把 UncoverDCShadow POC 当作生产覆盖证明。失活 registration 复用只有父页层级支持，保持延迟。
        en: Public sources directly support DCShadow technique semantics, protocol behavior, product detection, and research reproduction, but disclose no in-the-wild event with a verifiable complete registration-to-replication-to-outcome chain. This technique therefore does not claim a named threat actor completed the chain and does not treat the UncoverDCShadow proof of concept as production coverage. Inactive-registration reuse remains deferred with only parent-page-level support.
      - zh: 不同 Windows 版本、审计策略、RPC 加密、site link 延迟和传感器产品会改变可见字段；事件 4928/4929、产品告警和快速创建/删除均不是必要且充分条件。攻击者若使用仍在批准 inventory 中的陈旧身份或同时控制合法 DC、网络传感器和目录元数据，置信度下降，必须依靠外部历史版本与人工拓扑复核。
        en: Windows version, audit policy, RPC encryption, site-link delay, and sensor product change visible fields. Events 4928 or 4929, product alerts, and rapid creation or deletion are neither individually necessary nor sufficient. Confidence falls when an adversary uses a stale identity still present in approved inventory or controls a legitimate DC, network sensor, and directory metadata together, requiring external historical versions and manual topology review.
