research:
  limitations:
    paragraphs:
      - zh: Snatch 与 Embargo 直接支持 service enrollment、实际 Safe Mode 消费和 payload 结果，但两者均是 ransomware 场景，不能证明其他操作目的或 COM 变体已在野使用。Microsoft 文档支持允许集语义，不支持攻击归因；COM 只保留为实现广度，不以无案例推高置信。
        en: Snatch and Embargo directly support service enrollment, actual Safe Mode consumption, and payload outcome, but both are ransomware contexts and do not prove in-the-wild use for other operational purposes or COM variants. Microsoft documentation supports allowlist semantics rather than adversary attribution. COM remains implementation breadth and is not given higher confidence without a case.
      - zh: 安全、恢复、存储和网络产品可能合法增加相同 Registry/service 状态，且有些 EDR 会主动在 Safe Mode 存活；因此只有新键、未知签名或随机名称误报高。攻击者复用受信服务、替换其二进制、使用内存注入或离线修改 hive 时，需要文件/内存/磁盘和不同权管理面证据。
        en: Security, recovery, storage, and network products can legitimately add identical Registry or service state, and some EDRs intentionally survive Safe Mode. A new key, unknown signature, or random name alone is therefore noisy. When an adversary reuses a trusted service, replaces its binary, uses memory injection, or modifies a hive offline, file, memory, disk, and differently authorized management-plane evidence is required.
