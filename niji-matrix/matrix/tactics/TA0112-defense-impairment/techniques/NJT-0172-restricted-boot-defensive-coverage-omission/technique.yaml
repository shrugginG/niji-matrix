research:
  limitations:
    paragraphs:
      - zh: Snatch 与 Embargo 原始调查直接支持实际受限启动、防御缺席和 SafeBoot payload enrollment，CISA LockBit 通告补充另一能力；但公开报告不会列出每台受害主机完整的 expected-versus-loaded driver/service set。因此案例支持技术与 child 存在，不证明所有 EDR/AV 或所有 Safe Mode 变体都会产生相同缺口。
        en: Original Snatch and Embargo investigations directly support actual restricted boot, defensive absence, and SafeBoot payload enrollment, while the CISA LockBit advisory adds another capability. Public reporting does not enumerate the full expected-versus-loaded driver and service set on every victim host. The cases therefore support existence of the technique and child but do not prove that every EDR or AV or every Safe Mode variant creates the same gap.
      - zh: Windows build、security product/version、Safe Mode 支持、加密 RPC/远程管理和早期启动日志决定可见性；Ntbtlog 可能缺失，agent heartbeat gap 也可能来自故障。攻击者若离线修改 BCD/Registry 或控制 hypervisor/cloud 管理面，writer 和外部证据会弱化，需要磁盘/固件取证、网络侧观测和人工维护记录复核。
        en: Windows build, security product or version, Safe Mode support, encrypted remote management, and early-boot logging determine visibility. Ntbtlog can be absent, and an agent heartbeat gap can result from failure. If the adversary modifies BCD or Registry offline or controls the hypervisor or cloud management plane, writer and external evidence weaken and require disk or firmware forensics, network-side observation, and manual maintenance-record review.
