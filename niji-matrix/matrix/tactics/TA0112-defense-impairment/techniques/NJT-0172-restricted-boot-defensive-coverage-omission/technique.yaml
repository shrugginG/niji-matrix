schema_version: "2.0.0"
type: technique
id: NJT-0172
name: {zh: 受限启动防御覆盖缺失, en: Restricted-Boot Defensive-Coverage Omission}
summary: {zh: 攻击者使主机实际进入受限启动状态，让正常模式应在场的防御组件缺席，并在该跨重启覆盖缺口中继续恶意行为。, en: "Adversaries place a host into an actual restricted boot state so defensive components expected in normal mode are absent and continue malicious activity in the cross-reboot coverage gap."}
aliases: [Safe Mode Boot, T1688]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1688, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1688
definition_and_concept:
  paragraphs:
    - zh: 受限启动防御覆盖缺失是攻击者改变 Windows 启动意图并使主机完成 Safe Mode/等价受限启动，使正常启动基线中应加载的特定 EDR、AV、防火墙、tamper 或其他防御 driver/service 没有进入当前 boot session，再在该窗口内执行可验证的后继行为。直接对象是 boot intent—actual boot mode—expected-versus-loaded defense set—follow-on outcome，不是 bcdedit 命令、BCD 文件、Registry 介质或重启事件。
      en: Restricted-Boot Defensive-Coverage Omission is adversary change of Windows boot intent followed by a completed Safe Mode or equivalent restricted boot in which a specific EDR, AV, firewall, tamper, or other defensive driver or service expected by the normal-boot baseline does not enter the current boot session, followed by a verifiable action in that window. Its direct object is boot intent to actual boot mode to expected-versus-loaded defense set to follow-on outcome, not a bcdedit command, BCD file, Registry medium, or reboot event.
    - zh: 启动设置写入但主机没有进入受限模式只是 exposure；主机进入 Safe Mode 但安全产品本就支持该模式、没有具体组件差或没有后继结果，只能表示维护/故障或覆盖风险。技术完成要求跨 boot_id 证明攻击者意图被启动管理器消费、防御差真实形成且攻击者利用窗口。加密、恢复删除或目录重命名是后继结果，分别可与 Impact 或工具损伤对象共同映射。
      en: A boot-setting write without entry into restricted mode is exposure only. A host that enters Safe Mode while its security product supports that mode, with no specific component difference or no follow-on result, establishes maintenance, failure, or coverage risk rather than completion. Completion requires cross-boot proof that adversary intent was consumed by the boot manager, a real defensive difference formed, and the adversary used the window. Encryption, recovery deletion, or directory renaming are follow-on outcomes that can also map to Impact or tool-impairment objects.
stealth_characteristics:
  paragraphs:
    - zh: 受限启动防御覆盖缺失借用操作系统合法诊断策略。Safe Mode 按设计只加载有限文件、driver 和 service，防御组件不在场可以被解释为排障、更新回滚或自动恢复；攻击者不需要逐一关闭每个传感器，就能让后继行为发生在 endpoint agent、其 heartbeat 与部分本地日志不可用的窗口。Minimal 与 Networking 只改变可用连接能力，核心仍是启动消费造成的覆盖差。
      en: Restricted-Boot Defensive-Coverage Omission borrows a legitimate operating-system diagnostic policy. Safe Mode loads only a limited set of files, drivers, and services by design, so defensive absence can be interpreted as troubleshooting, update rollback, or automatic recovery. The adversary need not disable every sensor individually and can perform follow-on activity while the endpoint agent, its heartbeat, and some local logs are unavailable. Minimal versus Networking changes available connectivity, while the core remains the coverage difference caused by boot consumption.
    - zh: 残余包括 BCD store/entry old-new、修改主体与进程、shutdown/reboot、boot ID/mode、Ntbtlog、loaded/unloaded driver/service、SafeBoot allowlist、Winlogon/console/network session、外部 EDR heartbeat gap 和进程/文件/Registry/备份结果。支持 Safe Mode 的防御组件、独立网络/虚拟化/云管理面和远程配置版本会压缩匿迹；同一 agent 自身缺席且没有外部面时盲区最大。
      en: Residue includes BCD store and entry old and new, modifying principal and process, shutdown or reboot, boot ID and mode, Ntbtlog, loaded and unloaded drivers or services, the SafeBoot allowlist, Winlogon, console, or network session, external EDR heartbeat gap, and process, file, Registry, or backup outcomes. Defenses supporting Safe Mode, independent network, virtualization, or cloud management planes, and remote configuration versions reduce stealth. The blind spot is greatest when the same agent is absent and no external plane exists.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求四项闭合：未经批准或与工单不符的 boot intent，实际完成的 Safe Mode/受限 boot session，至少一个正常模式应在场而当前缺席的具体防御组件，以及同一窗口中由攻击者产生的后继结果。只命中 bcdedit/safeboot、只发生重启、只有 agent heartbeat 消失或只有加密事件均不足；分别保留为 boot exposure、availability anomaly 或结果对象。
      en: "Include only when four elements close: boot intent that is unapproved or mismatches a ticket, an actual completed Safe Mode or restricted boot session, at least one specific defensive component expected in normal mode but absent now, and an adversary-generated follow-on outcome in the same window. A bcdedit or safeboot hit alone, reboot alone, disappearance of only an agent heartbeat, or encryption alone is insufficient and remains boot exposure, an availability anomaly, or an outcome object respectively."
    - zh: 正常故障排查、驱动/更新回滚、OEM 恢复、DSRM、灾备和批准维护以准确 host、boot entry、actor/console、工单、窗口和恢复动作排除。直接 stop/disable/rename 防御或删除 SafeBoot 防御项可同时归 NJT-0123；旧版本/不可信启动组件归 NJT-0127 或启动信任对象。模式、命令、工具、ransomware 家族和影响类型都不形成 NJS。
      en: Exact host, boot entry, actor or console, ticket, window, and recovery action exclude normal troubleshooting, driver or update rollback, OEM recovery, DSRM, disaster recovery, and approved maintenance. Direct stopping, disabling, or renaming of a defense or deletion of its SafeBoot entry can also belong to NJT-0123. Old versions or untrusted boot components belong to NJT-0127 or a boot-trust object. Mode, command, tool, ransomware family, and impact type do not create NJS.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 勒索软件操作者在获得本地管理员或远程高权执行后，写入下一次 safeboot、准备本地/网络控制路径并强制重启。主机进入 Minimal 或 Network Safe Mode 后，正常 EDR/AV 组件可能不加载；攻击者随后启动 loader、重命名安全产品目录、删除 shadow copies、横向协调或加密文件，完成后删除 safeboot 设置返回正常模式。Snatch、Embargo 与 LockBit 报告展示不同实现。
        en: After obtaining local administrator or remote privileged execution, a ransomware operator writes the next safeboot, prepares a local or network control path, and forces a reboot. Once the host enters Minimal or Network Safe Mode, normal EDR or AV components may not load. The adversary then starts a loader, renames security-product directories, deletes shadow copies, coordinates laterally, or encrypts files and removes safeboot to return to normal mode. Reporting on Snatch, Embargo, and LockBit demonstrates different implementations.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要能修改 BCD/Registry/service 并重启主机的管理员权限，能够承受业务中断和控制通道中断，知道目标安全产品在 Safe Mode 的实际支持情况，并确保 payload 的 driver/service/network 依赖在受限环境可满足。BitLocker、Secure Boot、无法远程登录、错误 service 依赖、启动修复或 payload 内存不足会使攻击失败并提高可见性。
          en: The adversary needs administrator authority to modify BCD, Registry, or services and reboot the host, tolerance for business and control-channel interruption, knowledge of actual Safe Mode support for the target security product, and assurance that payload driver, service, or network dependencies remain available in the restricted environment. BitLocker, Secure Boot, inability to sign in remotely, incorrect service dependencies, startup repair, or insufficient payload memory can fail the attack and increase visibility.
    defender_model:
      paragraphs:
        - zh: 防守方维护每种 host role、OS build 与 security-stack version 的 normal/Minimal/Network/DSRM 组件和 heartbeat 基线，记录批准维护入口，并从 BCD/config、System/boot、SCM/Registry、EDR 管理面、虚拟化/云、网络和结果遥测跨 boot_id 关联。若只有本地 endpoint agent，恰恰在受限启动中可能失去观察；因此防守模型需要不同权外部传感和远程 old-new 保留。
          en: Defenders maintain normal, Minimal, Network, and DSRM component and heartbeat baselines by host role, OS build, and security-stack version, record approved maintenance entry points, and correlate BCD or configuration, System or boot, SCM or Registry, EDR management, virtualization or cloud, network, and outcome telemetry across boot IDs. A local endpoint agent alone can lose observation precisely during restricted boot, so the defensive model needs differently authorized external sensors and remote old-and-new retention.
stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 合法受限启动策略让防御组件缺席而恶意活动继续, en: Legitimate restricted-boot policy omits defenses while malicious activity continues}
    analysis:
      paragraphs:
        - zh: 攻击者不必为每个防御组件制造单独的停用痕迹，而是让启动管理器按正常 Safe Mode 规则消费一个有限允许集。防御缺席成为操作系统政策的预期结果，后继行为发生在默认传感器不在场或 heartbeat 断开的 session，因而对以本地 agent 为观察边界的分析透明。跨启动连接 intent、actual mode、component gap 与外部结果可恢复该窗口。
          en: The adversary need not create a separate disablement trace for every defensive component and instead has the boot manager consume a limited allowlist under normal Safe Mode rules. Defensive absence becomes an expected operating-system policy result, and follow-on behavior occurs in a session where default sensors are absent or their heartbeats are broken, making it transparent to analytics bounded by the local agent. Cross-boot linkage of intent, actual mode, component gap, and external outcome recovers the window.
    evidence_refs: [REF-000359, REF-000754, REF-000755, REF-000756, REF-000758]
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 父技术覆盖受限启动本身造成的防御组件缺失。NJS-0172-001“受限启动载荷存活注册”增加一个独立攻击者变量：在重启前把恶意 service、COM 或 payload activation path 写入 SafeBoot Minimal/Network 允许集，使载荷在基线防御仍被排除时由同一启动策略加载。它新增 Registry/service/binary 前态、消费关系和专门恢复动作，因此值得独立。
        en: "The parent covers defensive-component absence caused by restricted boot itself. NJS-0172-001 Restricted-Boot Payload Survival Enrollment adds an independent adversary variable: before reboot, a malicious service, COM object, or payload activation path is written into the SafeBoot Minimal or Network allowlist so the same boot policy loads it while baseline defenses remain excluded. It adds Registry, service, and binary prior state, a consumption relation, and specific recovery and therefore remains distinct."
      - zh: Minimal 与 Networking 只改变网络能力和攻击者控制方式，一次性与持续 safeboot 只改变窗口时长；直接删除/停用防御项由工具损伤对象负责。没有额外 SafeBoot enrollment 的攻击仍由父项完整表达，而存在 enrollment 时可同时映射父项和该子项。工具、家族、命令和影响载荷不再划分。
        en: Minimal versus Networking changes connectivity and the adversary's control method, while one-time versus persistent safeboot changes only window duration. Direct deletion or disablement of a defensive entry belongs to tool impairment. An attack without additional SafeBoot enrollment remains fully represented by the parent, while an attack with enrollment can map to both parent and child. Tool, family, command, and impact payload do not partition the taxonomy.
  coverage: established
  subtechnique_refs: [NJS-0172-001]
