research:
  limitations:
    paragraphs:
      - zh: PipeMon 直接证明有效且很可能被盗的 certificate 用于在野恶意对象，但报告未逐台公开实际 App Control/AV allow decision，因此 child 存在为 high，具体 consumer 结果仍需本地证据。Apple 文档证明 code signing/notarization 语义，不证明攻击者事件；self-signed 与欺诈证书的成功高度依赖 policy/anchor。
        en: PipeMon directly establishes a valid and likely stolen certificate on in-the-wild malicious objects, but reporting does not disclose every App Control or AV allow decision on each host. Child existence is high confidence, while a concrete consumer result still needs local evidence. Apple documentation establishes code-signing and notarization semantics rather than an adversary event, and success of self-signed or fraudulently obtained certificates depends heavily on policy and anchors.
      - zh: Revocation/time-stamping/cache 会让“当前 revoked”与事件时 valid 并存；合法紧急 release、重新签名、企业 repack 和第三方 publisher 也可能暂时缺少 central manifest。攻击者完全控制 CI/signing service 后可以伪造较完整 lineage，需要 source review、reproducible build 或外部供应链证据。
        en: Revocation, timestamping, and caches allow currently revoked and valid at event time to coexist. Legitimate emergency releases, resigning, enterprise repacking, and third-party publishers can temporarily lack a central manifest. Full compromise of CI or signing service can forge more complete lineage and requires source review, reproducible builds, or external supply-chain evidence.
