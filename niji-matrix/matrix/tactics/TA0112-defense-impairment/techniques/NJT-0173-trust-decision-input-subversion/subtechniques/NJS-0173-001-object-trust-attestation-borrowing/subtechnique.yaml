schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0173-001
name: {zh: 对象信任证明借用, en: Object Trust-Attestation Borrowing}
summary: {zh: 攻击者让恶意对象携带可验证的签名、证书或 notarization 身份，在 consumer policy 与 anchor 基本不变时借用合法 publisher 特征。, en: "Adversaries give a malicious object verifiable signing, certificate, or notarization identity so it borrows legitimate publisher features while consumer policy and anchors remain materially unchanged."}
aliases: []
parent_ref: NJT-0173
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 对象信任证明借用是攻击者使用被盗、失陷、欺诈取得或在目标 policy 中可接受的 signing key/certificate/notarization 流程，为恶意 executable、script、package、driver 或其他对象生成可由安全 consumer 验证的 attestation，并让该对象获得 trusted/allowed 结果。直接对象是 artifact digest—attestation—signer/key provenance—consumer decision—accepted outcome，而不是“文件已签名”这一属性。
      en: Object Trust-Attestation Borrowing is adversary use of a stolen, compromised, fraudulently obtained, or policy-acceptable signing key, certificate, or notarization process to generate attestation for a malicious executable, script, package, driver, or other object that a security consumer can verify and allow or trust. Its direct object is artifact digest to attestation to signer or key provenance to consumer decision to accepted outcome, not the property that a file is signed.
    - zh: Consumer policy/provider 与 trust anchors 在此变量中保持基本不变；差来自恶意对象携带合法或可接受证明，而 signer control、CI build/release、distribution 或 object behavior 与 publisher 语义不一致。Self-signed 只有被 policy/anchor 接受并实际放行才纳入；合法 signed vulnerable driver 的 capability abuse 可共同映射，但必须区分“原厂合法内容被滥用”和“恶意内容借用 signer”。
      en: Consumer policy or providers and trust anchors remain materially unchanged in this variable. The difference comes from a malicious object carrying legitimate or acceptable proof while signer control, CI build or release, distribution, or object behavior diverges from publisher semantics. A self-signed object qualifies only when policy or anchors accept and actually allow it. Abuse of a legitimate signed vulnerable driver can co-map, but original legitimate content whose capability is abused must remain distinct from malicious content borrowing a signer.
stealth_characteristics:
  paragraphs:
    - zh: 对象信任证明借用让恶意对象在 Authenticode、Code Integrity/App Control、Gatekeeper/notarization、package manager 或其他 consumer 中呈现 signature valid、identified developer、notarized 或 trusted publisher。只按 signed=true、publisher name 或 certificate chain 降低告警的控制会把攻击者对象映射为合法 release。PipeMon 使用很可能被盗的有效游戏公司证书，展示合法 signer 特征与恶意对象控制者分离。
      en: Object Trust-Attestation Borrowing lets a malicious object appear as signature valid, identified developer, notarized, or trusted publisher in Authenticode, Code Integrity or App Control, Gatekeeper or notarization, a package manager, or another consumer. Controls that lower alerts by signed equals true, publisher name, or certificate chain map the adversary object to a legitimate release. PipeMon's use of a valid gaming-company certificate assessed as likely stolen demonstrates separation of legitimate signer features from malicious-object control.
    - zh: 残余包括 artifact digest/type/path、embedded/catalog signature、certificate fingerprint/serial/chain/EKU、signing/timestamp/revocation、key/HSM access、CI build/source commit/release manifest、distribution channel、consumer decision/cache 和 first behavior。不同权 build/CA/release 基线与 signer inventory 可揭示；完全控制 signing service/CI 或缺少 publisher manifest 时，合法与恶意签名对象更难区分。
      en: Residue includes artifact digest, type, and path, embedded or catalog signature, certificate fingerprint, serial, chain, and EKU, signing, timestamp, and revocation, key or HSM access, CI build, source commit, and release manifest, distribution channel, consumer decision and cache, and first behavior. Differently authorized build, CA, and release baselines plus signer inventory expose it. Legitimate and malicious signed objects are harder to distinguish when the signing service or CI is fully controlled or publisher manifests are unavailable.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求恶意对象的 attestation 被 named consumer 实际验证/允许，且独立证据显示 key control、build/release、distribution 或行为与 signer owner 不一致。仅有 valid certificate/signature、恶意对象在磁盘或 unsigned object 执行不够；consumer 拒绝或 revocation 生效时是 attempt。Certificate type、self-signed/stolen、平台和对象格式不形成更多子项。
      en: Include only when a named consumer actually verifies or allows a malicious object's attestation and independent evidence shows that key control, build or release, distribution, or behavior mismatches the signer owner. A valid certificate or signature, a malicious object on disk, or unsigned-object execution is insufficient. Consumer rejection or effective revocation is an attempt. Certificate type, self-signed versus stolen, platform, and object format do not create more children.
    - zh: 若攻击者先安装 root 使该签名链受信，另映射 NJS-0173-002；若 policy/provider 被改写才放行，另映射 NJS-0173-003；若仅删除 MOTW/quarantine，归 NJS-0173-004。恶意二进制内容替换已有软件归 NJT-0087；signed binary proxy execution 与 vulnerable driver 分别由 execution/tool-impairment 对象共同负责。
      en: If the adversary first installs a root that makes the signature chain trusted, also map NJS-0173-002. If a rewritten policy or provider enables allowance, also map NJS-0173-003. If only MOTW or quarantine is removed, use NJS-0173-004. Malicious binary-content replacement of existing software belongs to NJT-0087, while signed-binary proxy execution and vulnerable-driver use are co-owned by execution or tool-impairment objects.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 威胁组织可窃取游戏/软件厂商代码签名私钥并给 backdoor/installer/tool 签名，购买或欺诈取得证书，对 malware 使用企业 private CA，或取得 Developer ID/notarization 后投递恶意应用。PipeMon 的 modules 和 installer 共享有效且很可能被盗的证书；攻击者希望安全产品、用户和 allow policy 在首次加载时降低怀疑。
        en: A threat actor can steal a game or software vendor code-signing private key and sign a backdoor, installer, or tool, purchase or fraudulently obtain a certificate, use an enterprise private CA for malware, or obtain Developer ID or notarization before delivering a malicious app. PipeMon modules and installer shared a valid and likely stolen certificate, and the adversary benefits when security products, users, and allow policies reduce suspicion at first load.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要 private key/HSM/signing-service 访问、可接受证书或 notarization channel，能够生成格式正确且 digest/time/chain 兼容的证明，并了解 target consumer 的 revocation/cache/allow rule。CA/Apple/enterprise revocation、HSM JIT/双人签名、transparency、CI digest binding 和受控 distribution 提高成本；签名格式错误或 revoked chain 会直接暴露。
          en: The adversary needs private-key, HSM, or signing-service access, an acceptable certificate or notarization channel, ability to produce correctly formatted proof compatible with digest, time, and chain, and knowledge of the target consumer's revocation, cache, and allow rules. CA, Apple, or enterprise revocation, HSM JIT and two-person signing, transparency, CI digest binding, and controlled distribution raise cost. A malformed signature or revoked chain directly exposes the object.
    defender_model:
      paragraphs:
        - zh: 防守方取得完整 signature/chain/timestamp/notarization、decision-time revocation/cache 与 consumer result，并从 CA/HSM/CI/source/release/repository 验证 signer 是否授权该 exact digest。需要保留 key compromise/rotation 时间线和同证书所有 artifact；没有 publisher build manifest 时只能依据 distribution 与行为降低置信。
          en: Defenders obtain complete signature, chain, timestamp, notarization, decision-time revocation and cache, and consumer result and verify from CA, HSM, CI, source, release, or repository whether the signer authorized the exact digest. Key-compromise and rotation timelines plus every artifact under the certificate are retained. Without a publisher build manifest, defenders can only lower confidence using distribution and behavior.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 恶意对象借用合法 Publisher 的可验证证明特征, en: A malicious object borrows verifiable attestation features of a legitimate publisher}
    analysis:
      paragraphs:
        - zh: 攻击者把 cryptographically valid signer/certificate/notarization 附到恶意对象，使 consumer 输出与合法 release 相同的 valid/trusted feature，而 policy 与 anchor 无需明显改变。粗粒度检测把证书 owner 当成对象 controller，形成特征伪装；exact digest、key/build/release/distribution lineage 与 object outcome 可以恢复实际控制者差。
          en: The adversary attaches cryptographically valid signer, certificate, or notarization evidence to a malicious object so the consumer emits the same valid or trusted feature as for a legitimate release without an obvious policy or anchor change. Coarse detection mistakes certificate owner for object controller and produces Feature Disguise. Exact digest, key, build, release, and distribution lineage plus object outcome recover the real control difference.
    evidence_refs: [REF-000281, REF-000763, REF-000769]
    confidence: high
