  case_refs: [CASE-000247]
  reference_refs: [REF-000765, REF-000770, REF-000774]
research:
  limitations:
    paragraphs:
      - zh: OSX/MaMi 样本直接支持恶意 root 注册与 DNS 改写，但原分析不证明每条 HTTPS 内容已被读取；因此 child 与无警告条件为 high，具体 Collection outcome 需额外网络/内容证据。Windows/Linux/browser/private store 行为由官方语义与 ATT&CK 程序支持，不能假定所有应用共享系统 root。
        en: The OSX/MaMi sample directly supports malicious-root enrollment and DNS change but does not prove that every HTTPS body was read. The child and warning-free condition are high confidence, while a concrete Collection outcome needs additional network or content evidence. Windows, Linux, browser, and private-store behavior is supported by official semantics and ATT&CK procedures and cannot assume every application shares the system root.
      - zh: Root program/MDM/代理/安全产品合法更新频繁且可能在 user/application scope；subject/CN 可重复，必须按 fingerprint/public key/scope 识别。Pinning、cache 和离线 chain 可能使删除 root 后仍暂时信任，错误移除也会中断大量业务。
        en: Legitimate root-program, MDM, proxy, and security-product updates are frequent and can occur in user or application scope. Subject or CN can repeat, requiring fingerprint, public key, and scope identity. Pinning, caches, and offline chains can preserve trust temporarily after root removal, while incorrect removal can disrupt broad business activity.
