schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0173-002
name: {zh: 信任锚图扩展, en: Trust-Anchor Graph Expansion}
summary: {zh: 攻击者向 system、user 或 application trust store 加入或提升 root/anchor，使后继自控证书链由不受信变为允许。, en: "Adversaries add or promote a root or anchor in a system, user, or application trust store so later attacker-controlled certificate chains change from untrusted to allowed."}
aliases: []
parent_ref: NJT-0173
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 信任锚图扩展是攻击者向 system、user、browser、application 或 package trust store/keychain 写入新的 root/anchor，或把已有 certificate 的 trust setting 从 partial/deny 提升为 trustRoot/等价允许，使后继由攻击者控制的 leaf/intermediate chain 在相同 consumer 中终止于该 anchor 并获得 trusted/allow/no-warning 结果。直接对象是 anchor change—chain termination—consumer decision—accepted outcome。
      en: Trust-Anchor Graph Expansion is adversary addition of a new root or anchor to a system, user, browser, application, or package trust store or keychain, or promotion of an existing certificate from partial or deny to trustRoot or equivalent allowance, causing a later attacker-controlled leaf or intermediate chain to terminate at that anchor and receive a trusted, allow, or no-warning result in the same consumer. Its direct object is anchor change to chain termination to consumer decision to accepted outcome.
    - zh: Root 安装只是建立状态，只有后继 chain 实际消费且基线不信任、effective decision 放行才完成。Anchor 可以服务 TLS、code signing、driver/package 或其他 PKI consumer；下游网络中间介入、credential collection 或 code execution 是结果对象，不决定 child。Cloned chain、跨 scope 复制和 application-private store 均可纳入，只要 anchor graph 实际变化。
      en: Root installation only establishes state, and completion requires actual later-chain consumption with an untrusted baseline and allowed effective decision. An anchor can serve TLS, code signing, driver or package, or another PKI consumer. Downstream network interposition, credential collection, or code execution is an outcome object and does not define the child. A cloned chain, cross-scope copy, or application-private store can qualify when the anchor graph actually changes.
stealth_characteristics:
  paragraphs:
    - zh: 信任锚图扩展让攻击者控制的 certificate chain 继承本机/应用 trust store 的合法信任，browser、loader 或 verifier 可能只记录 chain trusted、valid root 或无证书警告。调查者若把当前 root store 当作权威事实，会忽略 anchor 是何时由谁加入，以及 baseline 在其缺失时会拒绝。OSX/MaMi 把恶意 root 与 DNS 重定向结合，展示本地信任图被扩展后无警告连接条件。
      en: Trust-Anchor Graph Expansion lets an attacker-controlled certificate chain inherit legitimate trust from a local or application trust store, and a browser, loader, or verifier can record only chain trusted, valid root, or no certificate warning. An investigator treating the current root store as authoritative overlooks when and by whom the anchor was added and that baseline would reject without it. OSX/MaMi combined a malicious root with DNS redirection and demonstrates conditions for warning-free connections after local trust-graph expansion.
    - zh: 残余包括 store/keychain old-new、scope、anchor fingerprint/subject/issuer/public key、trust setting、writer/process/session/source、install method、MDM/GPO/package transaction、后继 leaf/intermediate/root chain、SNI/artifact、consumer/version/decision/cache/pinning 与 first outcome。不同权 approved-anchor inventory 和 chain consumption ledger 可发现；private store、用户 scope 和缓存/离线 consumer 会制造盲区。
      en: Residue includes store or keychain old and new, scope, anchor fingerprint, subject, issuer, and public key, trust setting, writer, process, session, and source, install method, MDM, GPO, or package transaction, later leaf, intermediate, and root chain, SNI or artifact, consumer, version, decision, cache, and pinning, and first outcome. Differently authorized approved-anchor inventory and a chain-consumption ledger expose it. Private stores, user scope, and cached or offline consumers create blind spots.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求未批准 anchor 新增/提升、同一 consumer 后继 chain 实际终止于该 anchor、baseline 无该 anchor 时 warn/block/untrusted、effective decision trusted/allow/no-warning，并有恶意连接/对象结果。Root 存在、install command、chain 构造或自签证书任一单项不足；未消费 anchor 为 dormant exposure。
      en: Include only when an unapproved anchor is added or promoted, a later chain in the same consumer actually terminates at it, baseline without the anchor is warn, block, or untrusted, the effective decision is trusted, allow, or no-warning, and a malicious connection or object outcome follows. Root presence, an install command, chain construction, or a self-signed certificate alone is insufficient, and an unconsumed anchor is dormant exposure.
    - zh: 经批准的企业 TLS inspection、私有 PKI、VPN/proxy/security product、MDM、开发/test CA、OS root program update 和证书 rollover 是反例，需 fingerprint/scope/owner/purpose/expiry。若只使用被盗的公共签名证书而没有 trust-store 变化，归 NJS-0173-001；实际 AiTM/collection 由相邻对象共同负责。
      en: Approved enterprise TLS inspection, private PKI, VPN, proxy, or security product, MDM, development or test CA, OS root-program update, and certificate rollover are counterexamples requiring fingerprint, scope, owner, purpose, and expiry. Use of a stolen public signing certificate with no trust-store change belongs to NJS-0173-001, and actual AiTM or collection is co-owned by adjacent objects.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: Malware 获得管理员/用户 trust-store 写权后，可把自生成 root 加入 macOS System keychain、Windows Local Machine/Current User Root、Linux CA bundle 或 browser/private store，再通过 DNS/proxy 使假站 certificate chain 到该 root，或用其签 code/driver/package。OSX/MaMi 安装 cloudguard.me root 并改写 DNS，为后继中间介入创造无警告条件。
        en: After gaining administrator or user trust-store write authority, malware can add a self-generated root to the macOS System keychain, Windows Local Machine or Current User Root, a Linux CA bundle, or a browser or private store and then use DNS or proxy redirection so a fake-site certificate chains to that root or sign code, drivers, or packages under it. OSX/MaMi installed a cloudguard.me root and changed DNS, creating warning-free conditions for later interposition.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要目标 store/scope 的写权限、生成/控制 root 与 leaf/private keys、理解目标 consumer 使用哪个 store、EKU/name constraints/pinning/cache，并控制后继 connection/artifact。ProtectedRoots、MDM/GPO、keychain prompt、pinning、root transparency、JIT admin 与不同权 inventory 提高成本；错误 scope 或 chain 会继续告警。
          en: The adversary needs write authority over the target store or scope, generation or control of root and leaf private keys, knowledge of which store the target consumer uses plus EKU, name constraints, pinning, and caches, and control of the later connection or artifact. Protected roots, MDM or GPO, keychain prompts, pinning, root transparency, JIT administration, and differently authorized inventory raise cost. Wrong scope or chain continues warning.
    defender_model:
      paragraphs:
        - zh: 防守方按 fingerprint/store scope/host role/owner/有效期维护 anchor inventory，记录 store old-new 与 writer，并对每次 TLS/code/package/driver decision 保存 actual chain、baseline/effective result、cache/pinning 和 outcome。Application-private store、用户级 root 和 agent 自身依赖被污染 store 时需要 browser/proxy/MDM 等外部证据。
          en: Defenders maintain anchor inventory by fingerprint, store scope, host role, owner, and validity interval, record store old and new plus writer, and retain actual chain, baseline and effective result, cache or pinning, and outcome for each TLS, code, package, or driver decision. Application-private stores, user-level roots, and agents that depend on the contaminated store require external browser, proxy, or MDM evidence.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 攻击者证书链继承本地受信 Root 的合法特征, en: An attacker certificate chain inherits legitimate features from a locally trusted root}
    analysis:
      paragraphs:
        - zh: 攻击者先把自控 root 放入 consumer 的信任图，后继 leaf/chain 即可产生与合法 CA 相同的 trusted/valid/no-warning 特征。粗粒度观察只见成功 chain，真实差异藏在 anchor writer、scope 与历史 baseline，形成特征伪装；store version、approved root inventory 与 chain ledger 可恢复。
          en: The adversary first places an attacker-controlled root in the consumer's trust graph so a later leaf or chain produces the same trusted, valid, or no-warning feature as a legitimate CA. Coarse observation sees only a successful chain while the real difference lies in anchor writer, scope, and historical baseline, producing Feature Disguise. Store versions, approved-root inventory, and a chain ledger recover it.
    evidence_refs: [REF-000765, REF-000770, REF-000774]
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 较早 Root 写入与后继 Chain 接受分离在不同时间与系统, en: Earlier root writing and later chain acceptance are separated across time and systems}
    analysis:
      paragraphs:
        - zh: Anchor 写入可能远早于实际 TLS/code consumer 使用，且当前决策只记录 chain trusted；writer 已离开默认日志窗口，root 也可能被清理。只观察连接/执行或当前 store 无法恢复因果，形成行为透明；版本化 store 与后继 chain/outcome 关联打破分离。
          en: Anchor writing can precede actual TLS or code consumer use by a long interval, and the current decision records only chain trusted. The writer has left the default log window and the root can already be removed. Connection or execution observation or current store alone cannot recover causality and produces Behavioral Transparency. Versioned stores joined to later chains and outcomes break the separation.
    evidence_refs: [REF-000765, REF-000770, REF-000774]
    confidence: high
defense:
  detections: {coverage: available, strategy_refs: [DET-000200]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000183]}
