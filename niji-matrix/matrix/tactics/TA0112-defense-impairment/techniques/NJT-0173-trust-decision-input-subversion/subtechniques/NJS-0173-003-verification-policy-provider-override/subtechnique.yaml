research:
  limitations:
    paragraphs:
      - zh: Microsoft 文档和 SpecterOps POC 直接支持 consumer/provider 架构、可改写能力和可观测状态，ATT&CK 程序例支持在野工具/组织采用；本批没有创建独立在野 Case，因为公开材料对每个事件的 effective decision/outcome 闭环不一致。具体确认需本地 policy query、canary 与 accepted object。
        en: Microsoft documentation and SpecterOps proofs of concept directly support consumer or provider architecture, rewrite capability, and observable state, while ATT&CK procedures support in-the-wild tool or actor use. This batch creates no independent in-the-wild Case because public materials do not consistently close effective decision and outcome for each event. Concrete confirmation requires local policy queries, canaries, and an accepted object.
      - zh: Kernel memory patch、provider search-order hijack 和受信 module 内部修改可能不改变标准 Registry/policy；consumer/version 更新也会改变 decision code/cache。恢复 signed policy 或 mapping 后已加载代码仍可能运行，响应必须枚举 historical decision/outcome 而非只检查当前状态。
        en: Kernel-memory patches, provider search-order hijacking, and modification inside a trusted module may leave standard Registry or policy unchanged. Consumer or version updates also change decision codes and caches. Code already loaded can continue after signed policy or mappings are restored, so response enumerates historical decisions and outcomes rather than only current state.
