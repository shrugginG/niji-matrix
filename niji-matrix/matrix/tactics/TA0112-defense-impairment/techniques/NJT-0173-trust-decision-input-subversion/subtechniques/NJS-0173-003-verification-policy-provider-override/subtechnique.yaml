schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0173-003
name: {zh: 验证策略与提供者改写, en: Verification-Policy and Provider Override}
summary: {zh: 攻击者改写 enforcement policy、SIP/trust provider 映射、验证 callback 或有效状态，使原本应拒绝的输入被 consumer 允许。, en: "Adversaries rewrite enforcement policy, SIP or trust-provider mappings, verification callbacks, or effective state so a consumer allows input that should be rejected."}
aliases: []
parent_ref: NJT-0173
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 验证策略与提供者改写是攻击者在对象 signature/attestation 与 trust anchors 可以保持不变时，改变安全 evaluator 的 effective enforcement mode、rule set、SIP/trust provider mapping、provider DLL/function/callback 或内核验证变量，使 named consumer 对原本 unsigned、invalid、untrusted 或不合规输入从 block/warn 变为 allow/trusted/no-warning。直接对象是 verifier state change—effective consumption—baseline-different decision—accepted outcome。
      en: Verification-Policy and Provider Override is adversary change of a security evaluator's effective enforcement mode, rule set, SIP or trust-provider mapping, provider DLL, function, or callback, or kernel-verification variable while object signatures or attestations and trust anchors can remain unchanged, causing a named consumer to change unsigned, invalid, untrusted, or noncompliant input from block or warn to allow, trusted, or no-warning. Its direct object is verifier-state change to effective consumption to baseline-different decision to accepted outcome.
    - zh: Policy/Registry/BCD/csrutil/TESTSIGNING 命令或 provider mapping 修改只有真正 refresh/reboot/reload、module/callback 被 consumer 使用并改变 decision 才完成。SIP/provider hijack、DSE/SIP/Gatekeeper/App Control 修改和 kernel variable patch 共享 evaluator state 位置；平台、持久/内存介质和具体 API 是实现。Provider 改写还可成为持久执行入口，但该结果由 Persistence 共同负责。
      en: A policy, Registry, BCD, csrutil, or TESTSIGNING command or provider-mapping change completes only after actual refresh, reboot, or reload, use of the module or callback by the consumer, and a changed decision. SIP or provider hijacking, DSE, SIP, Gatekeeper, or App Control modification, and a kernel-variable patch share the evaluator-state location. Platform, durable or memory medium, and specific API are implementations. Provider override can also create a persistent execution entry, which Persistence co-owns.
stealth_characteristics:
  paragraphs:
    - zh: 验证策略与提供者改写让受信 consumer 自己返回允许结果。恶意 provider 可以始终返回 TRUE/已知好 signature，放宽 policy 可以把 unsigned 输入当开发/test/audit 例外，kernel variable 改写可不留下磁盘配置；粗粒度日志只显示 policy decision 或合法 provider process，隐藏真实规则/回调已变。研究 POC 和 ATT&CK 程序支持这种 decision-state 颠覆。
      en: Verification-Policy and Provider Override causes the trusted consumer itself to return an allowed result. A malicious provider can always return TRUE or a known-good signature, relaxed policy can treat unsigned input as a development, test, or audit exception, and a kernel-variable change can leave no disk configuration. Coarse logs show only a policy decision or legitimate provider process and hide changed rules or callbacks. Research proofs of concept and ATT&CK procedures support this decision-state subversion.
    - zh: 残余包括 signed/sealed policy digest、enforcement/effective mode、SIP/provider GUID/Registry/DLL/function、module hash/signer/path/load、BCD/NVRAM/boot ID、kernel/attestation、writer/session、policy deployment/approval、canary baseline/effective decision 和 first module/driver/process outcome。Secure Boot/HVCI/MDM、signed policy、module allowlist 与外部 attestation 压缩；memory patch、DLL search order 和受信 module hijack 增加盲区。
      en: Residue includes signed or sealed policy digest, enforcement and effective mode, SIP or provider GUID, Registry, DLL, and function, module hash, signer, path, and load, BCD, NVRAM, and boot ID, kernel or attestation, writer and session, policy deployment and approval, canary baseline and effective decision, and first module, driver, or process outcome. Secure Boot or HVCI or MDM, signed policy, module allowlists, and external attestation reduce stealth. Memory patches, DLL search order, and trusted-module hijacking increase blind spots.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求未批准 verifier state change 已生效/被 consumer 消费，同一或可比 input 在 baseline 应 block/warn 而 effective decision allow/trusted/no-warning，并产生恶意 load/execute outcome。只执行 bcdedit/csrutil、写 Registry、部署 policy、加载 provider DLL 或观察 unsigned code 不够；state 未生效/consumer 仍拒绝为 exposure/attempt。
      en: Include only when an unapproved verifier-state change becomes effective or is consumed by the consumer, the same or comparable input should block or warn under baseline while the effective decision allows, trusts, or produces no warning, and a malicious load or execution outcome follows. Running bcdedit or csrutil, writing Registry, deploying policy, loading a provider DLL, or observing unsigned code is insufficient. State not effective or continued consumer rejection is exposure or attempt.
    - zh: 批准开发/test signing、compatibility audit、driver 调试、break-glass recovery、MDM/GPO rollout、vendor provider update 与 signed supplemental policy 是反例，需 host/input class/owner/window/canary/rollback。对象使用被盗 signature 而 policy 不变归 NJS-0173-001；新增 root 归 NJS-0173-002；provenance 缺失归 NJS-0173-004。
      en: Approved development or test signing, compatibility audit, driver debugging, break-glass recovery, MDM or GPO rollout, vendor-provider update, and signed supplemental policy are counterexamples requiring host, input class, owner, window, canary, and rollback. Use of a stolen signature with unchanged policy belongs to NJS-0173-001, a new root to NJS-0173-002, and missing provenance to NJS-0173-004.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: Windows 攻击者可改写 SIP CryptSIPDllVerifyIndirectData 或 trust provider FinalPolicy mapping 指向恶意/现有导出，启用 TESTSIGNING、关闭 RequireSigned、修改 g_CiOptions 或把 App Control 转 audit；macOS 攻击者可在 recovery/高权条件下改 SIP/Gatekeeper policy。随后 unsigned/invalid driver、DLL、app 或 script 被 named consumer 接受并执行。
        en: A Windows adversary can redirect SIP CryptSIPDllVerifyIndirectData or trust-provider FinalPolicy mappings to a malicious or existing export, enable TESTSIGNING, turn off RequireSigned, change g_CiOptions, or move App Control to audit. A macOS adversary can change SIP or Gatekeeper policy under recovery or high privilege. An unsigned or invalid driver, DLL, app, or script is then accepted and executed by a named consumer.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要 local admin/SYSTEM/root、Registry/policy/BCD/NVRAM/provider DLL 写权，或 kernel exploit/内存写能力；理解 action/provider GUID、policy format/signing、refresh/reboot、consumer cache 和目标 input class。Signed policy、Secure Boot/HVCI、SIP/MDM、只读 provider path、JIT recovery 与 external attestation 提高成本；错误 policy/provider 会导致 boot failure、crash 或广泛业务阻断。
          en: The adversary needs local administrator, SYSTEM, or root authority, write access to Registry, policy, BCD, NVRAM, or provider DLL state, or a kernel exploit or memory-write capability, plus knowledge of action or provider GUIDs, policy format and signing, refresh or reboot, consumer caches, and target input classes. Signed policy, Secure Boot or HVCI, SIP or MDM, read-only provider paths, JIT recovery, and external attestation raise cost. Incorrect policy or provider state can cause boot failure, crashes, or broad business interruption.
    defender_model:
      paragraphs:
        - zh: 防守方维护 consumer/version 对应的 signed policy/provider/module baseline 与 canary expected decision，采集 policy/Registry/BCD/NVRAM/kernel state、writer、deployment/approval、module load/callback、effective query、decision 和 outcome。Disk 配置完整不能排除内存 patch；需要 boot attestation、memory evidence 或可重复 canary。合法 audit/test 例外必须可枚举且自动到期。
          en: Defenders maintain signed-policy, provider, and module baselines plus expected canary decisions by consumer and version and collect policy, Registry, BCD, NVRAM, or kernel state, writer, deployment and approval, module load and callback, effective query, decision, and outcome. Intact disk configuration does not exclude a memory patch and needs boot attestation, memory evidence, or a repeatable canary. Legitimate audit or test exceptions are enumerable and expire automatically.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 被改写验证器为未受信对象生成合法允许特征, en: A rewritten verifier generates legitimate allow features for untrusted objects}
    analysis:
      paragraphs:
        - zh: 攻击者控制 evaluator rule/provider/callback，使可信 consumer 对 unsigned/invalid object 输出与合规对象相同的 allow/trusted 状态。检测若只接受 consumer decision 而不验证 effective state，就把被操纵裁决当安全事实，形成特征伪装；policy/provider/module digest、canary baseline 与 outcome 可揭示。
          en: The adversary controls evaluator rules, providers, or callbacks so a trusted consumer outputs the same allow or trusted state for an unsigned or invalid object as for compliant input. Detection that accepts the consumer decision without validating effective state treats a manipulated judgment as security fact and produces Feature Disguise. Policy, provider, or module digests, canary baseline, and outcome expose it.
    evidence_refs: [REF-000762, REF-000764, REF-000767, REF-000768, REF-000771, REF-000772, REF-000773]
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 较早验证器状态改写与后继对象允许分置于不同窗口, en: Earlier verifier-state rewriting and later object allowance occupy different windows}
    analysis:
      paragraphs:
        - zh: Policy/provider 状态在早期被修改，实际安全影响在后续 consumer 调用/boot/reload 才发生；当前 allow log 不包含 writer，当前配置也可能恢复。变更与结果分离使行为对短窗分析透明；effective-state 历史、module/callback consumption、decision 与 first outcome 可恢复。
          en: Policy or provider state changes earlier, while security impact occurs only on a later consumer call, boot, or reload. The current allow log lacks the writer, and current configuration can be restored. Separation between change and result makes behavior transparent to short-window analysis. Effective-state history, module or callback consumption, decision, and first outcome recover it.
    evidence_refs: [REF-000764, REF-000767, REF-000771, REF-000773]
    confidence: high
