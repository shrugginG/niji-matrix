schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0173-004
name: {zh: 对象来源约束移除, en: Object Provenance-Constraint Removal}
summary: {zh: 攻击者移除、抑制或阻断外部来源标记向子对象传播，使 consumer 把互联网/隔离 payload 当作本地对象并降低警告或限制。, en: "Adversaries remove, suppress, or prevent external-origin marks from propagating to child objects so consumers treat internet or quarantined payloads as local and reduce warnings or restrictions."}
aliases: []
parent_ref: NJT-0173
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 对象来源约束移除是攻击者控制 delivery、downloader、container、mount/copy/extraction 或对象 metadata，使 internet/restricted origin 对应的 Windows Zone.Identifier/MOTW、macOS com.apple.quarantine 或等价 per-object constraint 被删除、置零、从未写入或不继承给实际被消费 child，导致 SmartScreen、Office Protected View/macro blocking、Gatekeeper 或其他 consumer 不进入本应适用的 warning/restricted path。直接对象是 external source—parent/container—child provenance—consumer decision—outcome。
      en: Object Provenance-Constraint Removal is adversary control of delivery, downloader, container, mounting, copying, extraction, or object metadata so Windows Zone.Identifier or MOTW, macOS com.apple.quarantine, or an equivalent per-object constraint representing internet or restricted origin is deleted, zeroed, never written, or not inherited by the child actually consumed, causing SmartScreen, Office Protected View or macro blocking, Gatekeeper, or another consumer not to enter the warning or restricted path that should apply. Its direct object is external source to parent or container to child provenance to consumer decision to outcome.
    - zh: Trust policy/provider 和 anchors 可保持不变，差来自 consumer 接收的 per-object provenance input。显式 Unblock/xattr/ADS removal、downloader 不打标、container/filesystem 不传播和 mount 后 child 缺失都可纳入；format 只是实现。只有 metadata gap 尚未被 consumer 使用是 exposure，consumer 仍限制是 protected gap，无法证明 external source 是 unknown origin。
      en: Trust policy or providers and anchors can remain unchanged, with the difference residing in per-object provenance input received by the consumer. Explicit Unblock or xattr or ADS removal, a downloader not marking, container or filesystem non-propagation, and missing child metadata after mounting can qualify, while format is an implementation. A metadata gap not consumed by a consumer is exposure, continued restriction is a protected gap, and inability to prove external source is unknown origin.
stealth_characteristics:
  paragraphs:
    - zh: 对象来源约束移除让外部 payload 呈现“本地文件、无 quarantine、无 MOTW”的可见特征。Consumer 可能跳过 SmartScreen reputation、Protected View、macro block 或 Gatekeeper first-open prompt；调查者若只看 child 当前 ADS/xattr，会把缺失标记解释为从未来自外部。BlueNoroff 通过 ISO/VHD delivery 让内层恶意脚本/文档不继承外层 provenance，直接展示这种 source-to-child 断裂。
      en: Object Provenance-Constraint Removal makes an external payload present visible features of a local file with no quarantine or MOTW. The consumer can skip SmartScreen reputation, Protected View, macro blocking, or a Gatekeeper first-open prompt. An investigator viewing only the child's current ADS or xattr can interpret the missing mark as never externally sourced. BlueNoroff used ISO and VHD delivery so inner malicious scripts or documents did not inherit outer provenance, directly demonstrating the source-to-child break.
    - zh: 残余包括 mail/browser/chat/share source、URL/message、download process、outer digest/type/MOTW/quarantine、archive/image mount ID、extract/copy/rename、child digest/path、ADS/xattr old-new、consumer/version/policy/decision/prompt 和 first process/content/network outcome。Gateway delivery ID 与 content digest、file lineage 和 consumer decision 可揭示；不支持 metadata 的文件系统、加密容器、内存/streaming payload 和隐私限制形成盲区。
      en: Residue includes mail, browser, chat, or share source, URL or message, download process, outer digest, type, MOTW, or quarantine, archive or image mount ID, extraction, copying, or renaming, child digest and path, ADS or xattr old and new, consumer, version, policy, decision, and prompt, and first process, content, or network outcome. Gateway delivery IDs and content digests, file lineage, and consumer decisions expose it. Filesystems without metadata support, encrypted containers, in-memory or streaming payloads, and privacy constraints create blind spots.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求可证明 external/restricted source，父/外层对象带有或按基线应带 provenance，child 被显式移除/抑制/不继承，named consumer 的 baseline warn/block/restrict 变为 effective allow/no-warning/unrestricted，并产生恶意结果。只有缺失 MOTW/quarantine、container 使用、ADS/xattr 删除命令或 child execution 任一单项不足。
      en: Include only when an external or restricted source is provable, the parent or outer object carries or should carry provenance by baseline, the child has it explicitly removed, suppressed, or not inherited, a named consumer changes baseline warn, block, or restrict to effective allow, no-warning, or unrestricted, and a malicious outcome follows. Missing MOTW or quarantine, container use, an ADS or xattr removal command, or child execution alone is insufficient.
    - zh: 经批准 Unblock、签名企业包、software distribution/repack、内部同步、跨不支持 metadata 的文件系统复制和用户明确 override 是反例，需 user/reason/digest/owner/destination/decision。若删除 metadata 仅为抹取证且不改变 consumer route，可并记 NJT-0112 但不完成本项；平台、ISO/VHD/ZIP/DMG 等格式不形成子项。
      en: Approved Unblock, signed enterprise packages, software distribution or repacking, internal synchronization, copying across filesystems without metadata support, and explicit user override are counterexamples requiring user, reason, digest, owner, destination, and decision. Metadata deletion only to erase forensic evidence without changing the consumer route can co-map to NJT-0112 but does not complete this child. Platform and formats such as ISO, VHD, ZIP, or DMG do not create children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者把 lure 与 payload 放入来自互联网的 ISO/VHD/ZIP/DMG，使 mount/extraction 后的 child 不继承外层来源；通过 curl/自定义 downloader 避免 quarantine；使用 xattr -d、Unblock-File、ADS 写入/删除把 Internet zone 改成本地；再诱使用户或自动 consumer 打开 script、macro、app 或 executable。BlueNoroff 使用 ISO/VHD 承载 decoy 与恶意脚本。
        en: An adversary places a lure and payload in an internet-delivered ISO, VHD, ZIP, or DMG so children do not inherit outer origin after mounting or extraction, uses curl or a custom downloader to avoid quarantine, or uses xattr -d, Unblock-File, or ADS writing or deletion to change Internet-zone input to local, then has a user or automated consumer open a script, macro, app, or executable. BlueNoroff used ISO and VHD to carry decoys and malicious scripts.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要控制 delivery/downloader/container 或目标文件 metadata，理解 browser/mail/client/filesystem/container 与 consumer/version 的 propagation 规则，并让 child 进入实际 consumer。Gateway 解包/重标、container blocking、受控 mount、MOTW/quarantine 强制继承与 user training 提高成本；格式/版本变化可能恢复标记或阻断。
          en: The adversary needs control of delivery, downloader, container, or target-file metadata, knowledge of propagation rules across browser, mail client, filesystem, container, and consumer or version, and ability to place the child in an actual consumer. Gateway unpacking and re-marking, container blocking, controlled mounting, mandatory MOTW or quarantine inheritance, and user training raise cost. Format or version changes can restore marking or blocking.
    defender_model:
      paragraphs:
        - zh: 防守方维护 source-to-container-to-child content lineage，采集 mail/browser/proxy/download、outer/child digest、mount/extract/copy、ADS/xattr old-new 与 consumer decision/prompt/protected mode。按 consumer/version 实测 propagation，不把无标记一律恶意。若 delivery 与 endpoint 无共同 ID、container 加密或 payload 在内存执行，需要 gateway/sandbox/network 证据。
          en: Defenders maintain source-to-container-to-child content lineage and collect mail, browser, proxy, or download, outer and child digests, mounting, extraction, copying, ADS or xattr old and new, and consumer decision, prompt, or protected mode. Propagation is tested by consumer and version rather than treating every unmarked object as malicious. Gateway, sandbox, or network evidence is needed when delivery and endpoint share no ID, containers are encrypted, or payloads execute in memory.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 外部 Payload 呈现本地无来源约束的可见特征, en: An external payload presents visible features of a local unconstrained object}
    analysis:
      paragraphs:
        - zh: 攻击者让 external payload 的 child 缺少 MOTW/quarantine，使 consumer 按 local object 处理并输出 no-warning/allow，与真正本地对象共享粗粒度特征，形成特征伪装。Delivery/source 与 parent-child metadata lineage 可揭示外观和真实来源不一致。
          en: The adversary causes a child of an external payload to lack MOTW or quarantine so the consumer handles it as a local object and emits no-warning or allow, sharing coarse features with a genuinely local object and producing Feature Disguise. Delivery or source plus parent-child metadata lineage exposes the mismatch between appearance and real origin.
    evidence_refs: [REF-000594, REF-000762, REF-000766, REF-000768, REF-000775]
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 外部投递与后继 Child 消费分置于容器和文件转换两侧, en: External delivery and later child consumption are separated across container and file transformations}
    analysis:
      paragraphs:
        - zh: 外部 delivery 在早期由 mail/browser/gateway 观察，实际执行对象在 mount/extract/copy 后成为不同 child；单点 consumer 看不到 parent source，投递系统也未必看到 child outcome。容器/文件转换把因果分开形成行为透明，digest/lineage 与 decision/outcome 关联可恢复。
          en: External delivery is observed earlier by mail, browser, or gateway, while the actually executed object becomes a different child after mounting, extraction, or copying. A point consumer lacks the parent source, and the delivery system may not see the child outcome. Container or file transformation separates causality and produces Behavioral Transparency, which digest and lineage joined to decision and outcome can recover.
    evidence_refs: [REF-000594, REF-000766, REF-000775]
    confidence: high
