research:
  limitations:
    paragraphs:
      - zh: BlueNoroff 直接支持 ISO/VHD 外部投递、child provenance 缺失和后继恶意脚本，但公开报告不逐版本重放所有 SmartScreen/Office decision；具体完成需本地 decision/prompt。Apple/Microsoft 文档支持 Gatekeeper/MOTW consumer 语义，不能把任意 xattr/ADS 缺失自动归因攻击者。
        en: BlueNoroff directly supports external ISO or VHD delivery, missing child provenance, and later malicious scripts, but public reporting does not replay every SmartScreen or Office decision by version. Concrete completion needs local decision or prompt data. Apple and Microsoft documentation supports Gatekeeper or MOTW consumer semantics and cannot attribute every missing xattr or ADS to an adversary automatically.
      - zh: ADS/xattr 在 FAT、网络 share、云同步、archive/repack、邮件安全产品和跨平台传输中可能合法丢失；consumer policy 也可能本就不使用该标记。内容 digest/lineage 采集有隐私与存储成本，streaming/内存 payload 无 child file，需要把结论降为 provenance risk。
        en: ADS or xattr can be legitimately lost across FAT, network shares, cloud synchronization, archives or repacking, mail-security products, and cross-platform transfer, while consumer policy might not use the mark at all. Content-digest and lineage collection has privacy and storage costs, and streaming or in-memory payloads create no child file, requiring a lower-confidence provenance-risk conclusion.
