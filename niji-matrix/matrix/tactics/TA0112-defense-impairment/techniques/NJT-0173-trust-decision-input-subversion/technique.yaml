research:
  limitations:
    paragraphs:
      - zh: PipeMon、OSX/MaMi 与 BlueNoroff 直接支持对象证明、anchor 和 provenance 三项变量；验证策略/provider 主要由 Microsoft consumer 语义、SpecterOps POC 及 ATT&CK 程序例支持，没有新增在野 Case。研究演示能证明能力和痕迹，不能证明特定组织完成攻击；不同 consumer/version 的 baseline 必须本地验证。
        en: PipeMon, OSX/MaMi, and BlueNoroff directly support the object-attestation, anchor, and provenance variables. Verification policy or provider relies mainly on Microsoft consumer semantics, SpecterOps proofs of concept, and ATT&CK procedures and has no new in-the-wild Case. Research demonstrations establish capability and residue rather than a named actor completing an attack, and baselines require local validation by consumer and version.
      - zh: Cryptographic validity、revocation、timestamp、notarization、cache、private trust stores、policy refresh/reboot、container/文件系统继承与用户 override 会让相同输入得到不同裁决。很多产品不记录 baseline decision 或实际 chain/provider，历史重放也可能受更新影响。攻击者若控制 CA/HSM/CI、endpoint/MDM 与 decision ledger，全链独立性消失，只能依赖外部供应链/取证。
        en: Cryptographic validity, revocation, timestamps, notarization, caches, private trust stores, policy refresh or reboot, container or filesystem inheritance, and user overrides can give different decisions for the same input. Many products record neither baseline decisions nor actual chains or providers, and historical replay can change after updates. If the adversary controls CA or HSM and CI, endpoint or MDM, and the decision ledger, end-to-end independence disappears and requires external supply-chain or forensic evidence.
