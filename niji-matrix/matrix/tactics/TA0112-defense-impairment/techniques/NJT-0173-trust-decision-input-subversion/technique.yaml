schema_version: "2.0.0"
type: technique
id: NJT-0173
name: {zh: 信任裁决输入颠覆, en: Trust-Decision Input Subversion}
summary: {zh: 攻击者控制安全消费者使用的对象证明、信任锚、验证器状态或来源约束，使恶意输入获得允许、可信或无警告的实际裁决。, en: "Adversaries control object attestation, trust anchors, verifier state, or provenance constraints used by security consumers so malicious input receives an actual allow, trusted, or no-warning decision."}
aliases: [Subvert Trust Controls, T1553]
classification:
  tactic_refs: [TA0112]
  origin: {kind: attack-adapted, source_attack_id: T1553, source_attack_version: "19.1"}
  decision_ref: DEC-TA0112-T1553
definition_and_concept:
  paragraphs:
    - zh: 信任裁决输入颠覆是攻击者控制安全 consumer 用于判断对象、连接或内容是否可信的输入或有效状态，并让该 consumer 对恶意输入给出相对基线不同的 allow、trusted、no-warning 或 unrestricted 结果。直接对象是 attacker-controlled trust input/state—named consumer evaluation—decision difference—accepted malicious outcome，而不是签名、证书、Registry、xattr/ADS、文件格式或某个产品本身。
      en: Trust-Decision Input Subversion is adversary control of an input or effective state used by a security consumer to decide whether an object, connection, or content is trusted, causing that consumer to return an allow, trusted, no-warning, or unrestricted result that differs from baseline for malicious input. Its direct object is attacker-controlled trust input or state to named consumer evaluation to decision difference to accepted malicious outcome, not a signature, certificate, Registry value, xattr or ADS, file format, or product by itself.
    - zh: 完成需要四项闭合：攻击者取得或制造 trust input/state，明确 consumer 与版本实际消费该输入，历史/可重放基线应拒绝/警告/限制而有效裁决放行，且后继执行、加载、连接或内容活动形成恶意结果。只有 valid signature、root 存在、policy/provider 改动、MOTW/quarantine 缺失或 unsigned code 执行都是 exposure/anomaly；若 consumer 仍拒绝则只是 attempt。
      en: "Completion requires four linked elements: the adversary obtains or creates trust input or state, a named consumer and version actually consumes it, a historical or replayable baseline would block, warn, or restrict while the effective decision allows, and follow-on execution, loading, connection, or content activity produces a malicious outcome. A valid signature, root presence, policy or provider change, missing MOTW or quarantine, or unsigned-code execution alone is exposure or anomaly. Continued consumer rejection is only an attempt."
stealth_characteristics:
  paragraphs:
    - zh: 信任裁决输入颠覆让恶意输入借用 consumer 自己生成的可信特征。被盗证书、恶意 anchor、放宽的 verifier/provider 或缺失来源约束均可使粗粒度日志只呈现 signature valid、chain trusted、policy allowed、no warning 或 local file，原本用来提高警惕的信号反而为攻击者降低审查。不同 consumer 可以同时消费多层输入，例如 Gatekeeper 结合签名/notarization、policy 和 quarantine。
      en: Trust-Decision Input Subversion lets malicious input borrow trusted features generated by the consumer itself. A stolen certificate, malicious anchor, relaxed verifier or provider, or missing provenance constraint can leave coarse logs showing signature valid, chain trusted, policy allowed, no warning, or local file, turning a signal meant to raise assurance into reduced scrutiny for the adversary. A consumer can use several layers together, as Gatekeeper combines signing or notarization, policy, and quarantine.
    - zh: 残余仍分布在 artifact digest/signature/chain、key/CI build/release provenance、trust store old-new、policy/provider/module effective state、delivery/container/child metadata、consumer/version/action/decision、prompt/cache/revocation 和 first outcome。独立 CA/HSM/build、MDM/attestation、gateway/delivery 和远程 decision ledger 能揭示差；攻击者若同时控制 build/CA、endpoint 与 ledger，或 consumer 不记录实际 decision，置信度下降。
      en: Residue remains distributed across artifact digest, signature, and chain, key, CI build, and release provenance, trust-store old and new, policy, provider, module, and effective state, delivery, container, and child metadata, consumer, version, action, and decision, prompt, cache, and revocation, and first outcome. Independent CA, HSM, and build systems, MDM or attestation, gateways and delivery, and a remote decision ledger expose the difference. Confidence falls when the adversary controls build or CA, endpoint, and ledger together or the consumer records no actual decision.
scope_boundary_definition:
  paragraphs:
    - zh: 纳入要求 attacker-controlled trust input/state、实际 consumer evaluation、baseline-to-effective decision 差和 accepted malicious outcome。Consumer 可以是 code loader、WinVerifyTrust/Code Integrity/App Control、Gatekeeper、browser/TLS stack、Office/SmartScreen、package/driver verifier 或等价控制。Input 可以位于对象证明、anchor graph、evaluator policy/provider 或 per-object provenance；这些位置决定 NJS，而平台和介质不决定。
      en: Include only when attacker-controlled trust input or state, actual consumer evaluation, a baseline-to-effective decision difference, and an accepted malicious outcome are linked. Consumers can be a code loader, WinVerifyTrust, Code Integrity or App Control, Gatekeeper, browser or TLS stack, Office or SmartScreen, package or driver verifier, or an equivalent control. Input can reside in object attestation, the anchor graph, evaluator policy or provider, or per-object provenance, and those locations define the NJS rather than platform or medium.
    - zh: 二进制内容本身被补丁/替换归 NJT-0087；只改变名称/图标/可见身份归 NJT-0114；真正的 network interposition、credential collection 或 code execution 由对应战术对象共同负责；一般证据删除归 NJT-0112，人际关系/消息信任归 NJT-0118。批准的开发/test certificate、企业 CA/TLS inspection、signed policy rollout、用户确认 Unblock 和合法容器/文件系统 metadata 差是强反例，需 owner/scope/decision/result 排除。
      en: Patching or replacing binary content belongs to NJT-0087, and changing only name, icon, or visible identity belongs to NJT-0114. Actual network interposition, credential collection, or code execution is co-owned by the corresponding tactic object. Generic evidence deletion belongs to NJT-0112, and interpersonal or message trust belongs to NJT-0118. Approved development or test certificates, enterprise CAs or TLS inspection, signed-policy rollout, user-confirmed Unblock, and legitimate container or filesystem metadata differences are strong counterexamples excluded through owner, scope, decision, and result.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者可能以被盗代码签名密钥给 malware 生成有效 signature；把自控 root 安装到 system/user/application store，让 TLS/code chain 变为 trusted；改写 SIP/trust-provider callback、App Control/DSE/SIP/Gatekeeper policy，使 unsigned/invalid object 返回 allow；或通过 xattr/ADS 删除、downloader 抑制、ISO/VHD/container 继承差让外部 payload 缺少 quarantine/MOTW。后继可以是程序/driver 加载、恶意 macro/script、无警告连接或假站交互。
        en: An adversary can use a stolen code-signing key to generate a valid signature for malware, install an attacker-controlled root into a system, user, or application store so a TLS or code chain becomes trusted, rewrite a SIP or trust-provider callback or App Control, DSE, SIP, or Gatekeeper policy so an unsigned or invalid object returns allow, or use xattr or ADS removal, downloader suppression, or ISO, VHD, or container inheritance gaps so an external payload lacks quarantine or MOTW. Follow-on outcomes can be program or driver loading, a malicious macro or script, a warning-free connection, or fake-site interaction.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 对象证明分支需要 stolen/controlled private key、certificate/notarization access 或可接受 self-signed path；anchor 分支需要 trust-store/keychain 写权；verifier 分支需要 policy/provider/Registry/BCD/NVRAM/kernel 写权和 reload/reboot；provenance 分支需要 delivery/container/metadata/transfer 控制。所有分支都需要理解 consumer/version 的 chain、revocation/cache、policy sealing、metadata inheritance 和实际决策时机，错误 proof、scope 或依赖会导致 block/prompt 或破坏目标。
          en: The object-attestation branch needs a stolen or controlled private key, certificate or notarization access, or an acceptable self-signed path. The anchor branch needs trust-store or keychain write authority. The verifier branch needs policy, provider, Registry, BCD, NVRAM, or kernel write authority plus reload or reboot. The provenance branch needs control of delivery, container, metadata, or transfer. Every branch requires knowledge of consumer and version chain, revocation and caches, policy sealing, metadata inheritance, and actual decision timing. Incorrect proof, scope, or dependencies lead to blocking, prompting, or target breakage.
    defender_model:
      paragraphs:
        - zh: 防守方维护不同权的 signing key/CI release、approved anchors、effective verifier policy/provider 和 delivery provenance baseline，并能取得 consumer 实际 input/chain/policy/decision 与 first outcome。按 artifact/chain/policy/delivery ID 跨 CA/HSM、build、endpoint、MDM/GPO、gateway、browser/Office/Gatekeeper 和运行结果关联。只有当前文件或当前配置无法判断历史 writer/决策；revocation/cache、private trust stores、offline host 和 legacy consumer 是主要盲区。
          en: Defenders maintain differently authorized signing-key and CI-release, approved-anchor, effective verifier-policy or provider, and delivery-provenance baselines and obtain the consumer's actual input, chain, policy, decision, and first outcome. Artifact, chain, policy, or delivery IDs join CA or HSM, build, endpoint, MDM or GPO, gateway, browser, Office, Gatekeeper, and runtime outcomes. Current files or configuration alone cannot establish historical writer or decision. Revocation and caches, private trust stores, offline hosts, and legacy consumers are primary blind spots.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 恶意输入呈现安全消费者会接受的可信特征, en: Malicious input presents trusted features the security consumer accepts}
    analysis:
      paragraphs:
        - zh: 攻击者让恶意对象携带有效 signer/chain，或改变 anchor、verifier/provider、provenance input，使 consumer 输出与合法对象相同的 valid、trusted、allowed 或 no-warning 特征。检测若把 consumer 输出当作独立事实，就把攻击者控制的输入映射为可信来源，形成特征伪装。对象/密钥/build、anchor writer、policy/provider baseline 或 delivery lineage 与 decision/outcome 的差可破坏伪装。
          en: The adversary gives malicious input a valid signer or chain or changes anchor, verifier or provider, or provenance input so the consumer emits the same valid, trusted, allowed, or no-warning feature as for legitimate input. Detection that treats consumer output as an independent fact maps adversary-controlled input to a trusted source and produces Feature Disguise. Differences across object, key, and build, anchor writer, policy or provider baseline, or delivery lineage plus decision and outcome break the disguise.
    evidence_refs: [REF-000281, REF-000594, REF-000763, REF-000768, REF-000769, REF-000770, REF-000771, REF-000773, REF-000774, REF-000775]
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 较早信任状态改变与后续允许裁决分离在不同证据面, en: Earlier trust-state change and later allow decision are separated across evidence planes}
    analysis:
      paragraphs:
        - zh: Anchor、policy/provider 或 provenance 在较早写入/投递阶段被改变，真正风险在后续 loader、browser、Office、Gatekeeper 或其他 consumer 消费时才出现；当前 decision 只显示允许，当前配置也可能已清理，writer 与来源离开默认窗口。分离使行为对单点分析透明；版本 state、delivery/build lineage、consumer decision 与 first outcome 的长链关联可恢复。
          en: An anchor, policy or provider, or provenance changes during an earlier write or delivery stage, while risk appears only when a later loader, browser, Office, Gatekeeper, or another consumer uses it. The current decision shows only allow, current configuration can already be cleaned, and writer and source have left the default window. This separation makes behavior transparent to point analysis. Long-chain correlation of versioned state, delivery or build lineage, consumer decision, and first outcome recovers it.
    evidence_refs: [REF-000594, REF-000764, REF-000765, REF-000766, REF-000767, REF-000770, REF-000771, REF-000773, REF-000774, REF-000775]
    confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
      - zh: 四项 NJS 按 trust decision 的攻击者输入位置划分。NJS-0173-001“对象信任证明借用”保持 consumer policy/anchor 基本不变，让对象携带可验证 signer/certificate/notarization；NJS-0173-002“信任锚图扩展”加入 root/anchor，使后继 chain 变为 trusted；NJS-0173-003“验证策略与提供者改写”改变 evaluator 的 enforcement rule、provider/SIP callback 或 effective state；NJS-0173-004“对象来源约束移除”让外部对象失去 MOTW/quarantine 或不继承到 child。
        en: Four NJS divide by the location of adversary input to a trust decision. NJS-0173-001 Object Trust-Attestation Borrowing keeps consumer policy and anchors materially unchanged while an object carries a verifiable signer, certificate, or notarization. NJS-0173-002 Trust-Anchor Graph Expansion adds a root or anchor so later chains become trusted. NJS-0173-003 Verification-Policy and Provider Override changes evaluator enforcement rules, provider or SIP callbacks, or effective state. NJS-0173-004 Object Provenance-Constraint Removal causes an external object to lose MOTW or quarantine or prevents inheritance to a child.
      - zh: Gatekeeper 可同时消费对象证明、policy 与 quarantine，因此不单独成为平台子项；SIP/provider 与 code-sign enforcement 都改变 evaluator state；root 的 TLS/code 后继结果不改变 anchor 变量；stolen/self-signed 证书、ISO/VHD/ZIP 格式、平台、工具与后继攻击类型只是实现。多个子项可共现，分类记录每条实际影响 decision 的 input，而不是强制互斥选一。
        en: Gatekeeper can consume object attestation, policy, and quarantine together and is not a platform child. SIP or providers and code-signing enforcement both change evaluator state. TLS or code outcomes from a root do not change the anchor variable. Stolen versus self-signed certificates, ISO, VHD, or ZIP format, platform, tool, and downstream attack type are implementations. Several children can coexist, and classification records each input that actually affected the decision rather than forcing one exclusive choice.
  coverage: established
  subtechnique_refs: [NJS-0173-001, NJS-0173-002, NJS-0173-003, NJS-0173-004]
