schema_version: "1.0.0"
type: mechanism
id: NM-BT
name_en: Behavioral Transparency
name_zh: 行为透明
shortname: behavioral-transparency
core_question_zh: 攻击行为为什么落在既有监控和认知范围之外？
core_question_en: Why does the adversary behavior fall outside existing monitoring and analytic understanding?
definition_zh: >-
  利用防守方在监控覆盖、检测逻辑或认知理解上的盲点，使攻击行为不进入常规
  观测范围，或在发生时不触发既有检测逻辑。
definition_en: >-
  Exploit blind spots in defensive coverage, detection logic, or analytic understanding so
  that adversary behavior remains outside routine observation or does not trigger existing
  detection logic when it occurs.
defender_effect_zh: 看不见——关键行为发生但未进入有效观测或告警视野。
defender_effect_en: Invisible to observation—critical behavior occurs without entering effective monitoring or alerting scope.
lifecycle:
  status: draft
  version: "0.1.0"
