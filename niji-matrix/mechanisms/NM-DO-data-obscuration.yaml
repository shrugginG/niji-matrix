schema_version: "1.0.0"
type: mechanism
id: NM-DO
name_en: Data Obscuration
name_zh: 数据遮蔽
shortname: data-obscuration
core_question_zh: 防守方即使获取数据，为什么仍无法理解其真实含义？
core_question_en: Why can defenders still not understand the true meaning of data they have acquired?
definition_zh: >-
  通过改变信息内容的固有形态、可见性或可解释性，使防守方即使捕获相关数据，
  也难以识别其真实内容、恶意性质或操作意图。
definition_en: >-
  Alter the inherent form, visibility, or interpretability of information so that defenders,
  even after capturing the relevant data, cannot readily identify its true content,
  malicious nature, or operational intent.
defender_effect_zh: 望不透——数据存在但内容、语义或意图不可直接解释。
defender_effect_en: Opaque to inspection—the data exists, but its content, semantics, or intent cannot be directly interpreted.
lifecycle:
  status: draft
  version: "0.1.0"
