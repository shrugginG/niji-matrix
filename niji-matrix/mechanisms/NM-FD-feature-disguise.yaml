schema_version: "1.0.0"
type: mechanism
id: NM-FD
name_en: Feature Disguise
name_zh: 特征伪装
shortname: feature-disguise
core_question_zh: 恶意实体为什么难以与正常实体区分？
core_question_en: Why is the malicious entity difficult to distinguish from normal entities?
definition_zh: >-
  通过模仿、借用、寄生或重塑外观和行为特征，使攻击活动中的关键实体与正常、
  合法实体高度相似，降低恶意特征的可区分性。
definition_en: >-
  Imitate, borrow, parasitize, or reshape visible and behavioral characteristics so that key
  entities in adversary activity resemble normal, legitimate entities and become less distinguishable.
defender_effect_zh: 辨不出——能够观察到活动，但难以将其准确识别为恶意。
defender_effect_en: Indistinguishable in classification—the activity is visible but difficult to identify accurately as malicious.
lifecycle:
  status: draft
  version: "0.1.0"
