schema_version: "1.0.0"
type: mechanism
id: NM-ST
name_en: Spatiotemporal Trace Dilution
name_zh: 时空释痕
shortname: spatiotemporal-trace-dilution
core_question_zh: 分散的微弱信号为什么难以还原为完整攻击过程？
core_question_en: Why are dispersed weak signals difficult to reconstruct into a complete adversary operation?
definition_zh: >-
  在时间或空间维度上分散、稀释原本集中的攻击行为，使局部时间窗口或局部节点
  中的异常信号低于检测阈值，并提高跨事件关联和攻击链重构的难度。
definition_en: >-
  Disperse and dilute otherwise concentrated adversary behavior across time or space so that
  anomalous signals at any local time window or node remain below detection thresholds and
  cross-event correlation becomes more difficult.
defender_effect_zh: 厘不清——能够看到零散信号，但难以关联为完整攻击图像。
defender_effect_en: Unclear in reconstruction—isolated signals are visible but difficult to correlate into a complete adversary picture.
lifecycle:
  status: draft
  version: "0.1.0"
