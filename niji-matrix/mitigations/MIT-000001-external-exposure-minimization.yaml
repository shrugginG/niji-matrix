schema_version: 2.0.0
type: mitigation
id: MIT-000001
name:
  zh: 外部暴露面与信息最小化
  en: External Exposure and Information Minimization
summary:
  zh: 通过持续管理互联网暴露面和公开技术信息，减少主动探测与第三方观测可获得的有效目标情报
  en: Reduce actionable target intelligence available through direct probing and third-party observation by continuously managing Internet exposure and public technical information
description:
  paragraphs:
  - zh: 持续维护互联网暴露资产清单，关闭不必要服务，及时修复对外系统，减少错误、版本、调试、DNS、证书命名、注册和路由元数据中的非必要信息，并从第三方测绘与公共数据视角验证组织实际可见的主机和网络画像。
    en: Maintain a continuous inventory of Internet-exposed assets, close unnecessary services, remediate public systems promptly, minimize unnecessary
      information in errors, versions, debug interfaces, DNS, certificate naming, registration, and routing metadata, and verify the visible host
      and network profile from third-party mapping and public-data vantage points.
domains:
- enterprise
measures:
- key: external-exposure-inventory
  name:
    zh: 外部暴露面盘点与收敛
    en: External Exposure Inventory and Reduction
  description:
    paragraphs:
    - zh: 持续维护互联网暴露资产清单，关闭不必要的服务和入口，并及时修复必须公开的系统。
      en: Maintain a continuous inventory of Internet-exposed assets, close unnecessary services and entry points, and promptly remediate systems
        that must remain public.
  control_type: exposure-reduction
- key: public-information-minimization
  name:
    zh: 公开信息最小化
    en: Public Information Minimization
  description:
    paragraphs:
    - zh: 减少错误页面、版本信息、调试接口、DNS、证书命名、注册和路由元数据中不必要的组织与技术细节。
      en: Remove unnecessary organizational and technical detail from errors, version disclosures, debug interfaces, DNS, certificate naming,
        registration, and routing metadata.
  control_type: exposure-reduction
- key: external-vantage-validation
  name:
    zh: 外部视角验证
    en: External-Vantage Validation
  description:
    paragraphs:
    - zh: 从第三方测绘和公共数据视角定期验证组织实际暴露的主机、服务和网络画像，并将发现纳入整改流程。
      en: Regularly verify the organization's visible host, service, and network profile from third-party mapping and public-data vantage points
        and feed findings into remediation.
  control_type: governance
applications:
- target_ref: NJT-0001
  use:
    paragraphs:
    - zh: 在主动扫描场景中，应优先减少不必要的互联网入口和可被远程探测获得的版本、配置及组织信息，并持续从外部视角验证真实暴露面。
      en: For Active Scanning, prioritize removing unnecessary Internet-facing entry points and version, configuration, or organizational information
        obtainable through remote probing, and continuously validate the real exposure from an external vantage point.
  expected_effect:
    paragraphs:
    - zh: 该措施不能消除探测请求，但能够减少扫描可获得的信息量、降低目标筛选效率，并压缩后续利用机会。
      en: The mitigation does not eliminate probe requests, but it reduces the information yielded by scanning, lowers targeting efficiency, and
        narrows follow-on exploitation opportunities.
  limitations:
    paragraphs:
    - zh: 必须公开的服务仍可被扫描；该措施不能替代主动扫描监测，也无法撤回第三方已经保存或归档的历史观测。
      en: Services that must remain public can still be scanned; this mitigation does not replace Active Scanning detection and cannot retract
        historical observations already stored or archived by third parties.
- target_ref: NJT-0032
  use:
    paragraphs:
    - zh: 对收集目标主机信息，应减少互联网服务、错误、版本、证书命名和其他公开技术元数据中的非必要端点细节，并从第三方测绘视角持续验证组织可见画像。
      en: For Gather Victim Host Information, minimize unnecessary endpoint detail in Internet services, errors, versions, certificate naming, and other public technical metadata, and continuously validate the organization's visible profile from third-party mapping vantage points.
  expected_effect:
    paragraphs:
    - zh: 该措施降低直接探测和第三方平台能够提供的主机画像精度，使攻击者需要额外验证并承担更多可观察活动。
      en: The measures reduce the precision of host profiles available from direct probing and third-party platforms, forcing the adversary to perform additional validation and create more observable activity.
  limitations:
    paragraphs:
    - zh: 必须公开的服务仍会暴露部分属性，历史观测可能长期保留，且本措施不能限制目标访问远端资源时主动发送的客户端元数据。
      en: Services that must remain public still expose some attributes, historical observations may persist for long periods, and these measures do not limit client metadata actively sent when the victim accesses a remote resource.
- target_ref: NJS-0032-001
  use:
    paragraphs:
    - zh: 对第三方主机观测替代，应定期查询主要测绘和历史数据提供方，确认目标主机、版本和配置的外部可见性，并通过收敛暴露、修复披露和可行的更正或删除流程减少可复用观测。
      en: For Third-Party Host-Observation Substitution, regularly query major mapping and historical-data providers to establish external visibility of victim hosts, versions, and configurations, then reduce reusable observations through exposure reduction, disclosure remediation, and feasible correction or deletion processes.
  expected_effect:
    paragraphs:
    - zh: 攻击者可直接消费的现成主机事实减少且更快失效，迫使其接受低质量画像或重新接触目标。
      en: Fewer ready-made host facts remain available for direct consumption and those facts become stale sooner, forcing the adversary to accept a lower-quality profile or contact the victim again.
  limitations:
    paragraphs:
    - zh: 组织无法控制所有第三方扫描与存档，也不能保证提供方删除历史数据；必须公开的资产仍会被重新测量。
      en: Organizations cannot control every third-party scan or archive and cannot guarantee provider deletion of historical data; assets that must remain public will be measured again.
- target_ref: NJT-0034
  use:
    paragraphs:
    - zh: 对收集目标网络信息，应减少 DNS、证书、注册、路由、错误和服务元数据中的非必要网络关系与边界细节，并从第三方测绘和公共控制面持续验证外部画像。
      en: For Gather Victim Network Information, minimize unnecessary network relationship and perimeter detail in DNS, certificates, registration, routing, errors, and service metadata and continuously validate the external profile through third-party mapping and public control planes.
  expected_effect:
    paragraphs:
    - zh: 攻击者可直接组合的域、地址、前缀、证书和路由关系减少或更快失效，需要更多来源与直接验证。
      en: Fewer domain, address, prefix, certificate, and routing relationships remain directly composable or stay current, requiring more sources and direct validation.
  limitations:
    paragraphs:
    - zh: 网络运行和公共信任体系要求部分数据公开，第三方与历史归档不一定接受删除，必须暴露的边界仍会被重新测量。
      en: Network operations and public trust systems require some data to remain public, third parties and historical archives may not support deletion, and necessary perimeters will be measured again.
- target_ref: NJS-0034-001
  use:
    paragraphs:
    - zh: 对第三方网络观测复用，应定期检查测绘、被动 DNS 和历史数据平台中的目标网络画像，收敛非必要暴露并使陈旧关系失效。
      en: For Third-Party Network-Observation Reuse, regularly inspect victim network profiles in mapping, passive-DNS, and historical-data platforms, reduce unnecessary exposure, and invalidate stale relationships.
  expected_effect:
    paragraphs:
    - zh: 可复用观测的完整性和时效下降，攻击者需要承担错误画像或重新探测目标的风险。
      en: Reusable observations become less complete and current, forcing the adversary to accept profile errors or risk re-probing the victim.
  limitations:
    paragraphs:
    - zh: 组织无法阻止所有独立测量或撤回历史数据，且对外服务会持续产生新观测。
      en: Organizations cannot stop every independent measurement or retract historical data, and public services continually create new observations.
- target_ref: NJS-0034-002
  use:
    paragraphs:
    - zh: 对公共控制面旁路查询，应最小化非必要注册实体、证书名称和路由描述，审查公开对象变更，并避免在名称中编码内部结构和用途。
      en: For Public Control-Plane Off-Target Querying, minimize unnecessary registration entities, certificate names, and routing descriptions, review public-object changes, and avoid encoding internal structure and purpose in names.
  expected_effect:
    paragraphs:
    - zh: 公共控制面仍可查询，但单个对象和跨对象组合泄露的网络拓扑、职责和入口线索减少。
      en: Public control planes remain queryable, but individual objects and cross-object composition disclose fewer topology, responsibility, and entry-point clues.
  limitations:
    paragraphs:
    - zh: 协议、法规和证书运行要求限制可隐藏信息，历史日志与第三方副本也可能长期保留旧对象。
      en: Protocol, regulatory, and certificate-operational requirements limit what can be hidden, and historical logs or third-party copies may retain old objects.
