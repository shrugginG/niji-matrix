schema_version: 2.0.0
type: mitigation
id: MIT-000002
name:
  zh: 长周期遥测留存与跨边界汇聚
  en: Long-Horizon Telemetry Retention and Cross-Boundary Aggregation
summary:
  zh: 通过延长遥测留存并统一跨边界数据，使分散扫描痕迹能够在更大时间和来源范围内被关联
  en: Enable correlation of dispersed scan traces across broader time and source ranges through longer telemetry retention and cross-boundary
    normalization
description:
  paragraphs:
  - zh: 保留足以覆盖慢速扫描周期的网络流和关键协议元数据，统一多边界传感器的时间、资产和来源标识，并支持按来源、目标、工具指纹和访问关系开展长周期检索。
    en: Retain network flows and key protocol metadata long enough to cover slow-scan campaigns, normalize time, asset, and origin identities
      across perimeter sensors, and support long-horizon search by source, target, tool fingerprint, and access relationship.
domains:
- enterprise
measures:
- key: long-horizon-retention
  name:
    zh: 长周期遥测留存
    en: Long-Horizon Telemetry Retention
  description:
    paragraphs:
    - zh: 保留足以覆盖慢速扫描活动周期的网络流、关键协议元数据和必要的响应信息。
      en: Retain network flows, key protocol metadata, and necessary response information long enough to cover slow-scan campaigns.
  control_type: detective-support
- key: cross-boundary-normalization
  name:
    zh: 跨边界数据规范化
    en: Cross-Boundary Data Normalization
  description:
    paragraphs:
    - zh: 统一不同边界传感器中的时间、资产、来源和协议标识，并支持按目标覆盖、工具指纹和访问关系开展查询。
      en: Normalize time, asset, origin, and protocol identities across perimeter sensors and support queries by target coverage, tool fingerprint,
        and access relationship.
  control_type: detective-support
applications:
- target_ref: NJT-0001
  use:
    paragraphs:
    - zh: 将主动扫描相关流量和协议元数据保留到足以覆盖完整侦察周期，并统一多个边界和传感器的事件标识。
      en: Retain Active Scanning flow and protocol metadata for the full reconnaissance horizon and align event identities across boundaries and
        sensors.
  expected_effect:
    paragraphs:
    - zh: 提高分散扫描片段被重新关联为完整活动的概率。
      en: Increase the probability that dispersed scan fragments are reconstructed as one activity.
  limitations:
    paragraphs:
    - zh: 长期留存和跨域汇聚会增加存储、隐私和治理成本；缺少合适关联模型时，增加数据本身不会自动形成检测。
      en: Long-term retention and cross-domain aggregation increase storage, privacy, and governance costs; without suitable correlation models,
        more data does not automatically produce detection.
- target_ref: NJS-0001-001
  use:
    paragraphs:
    - zh: 留存窗口必须长于时间稀释扫描的活动周期，并支持分钟、小时、天和更长周期的多尺度统计。
      en: Retention windows must exceed the Temporal-Dilution Scanning campaign and support multiscale statistics across minutes, hours, days,
        and longer periods.
  expected_effect:
    paragraphs:
    - zh: 使短窗口中的孤立弱信号能够在长周期内形成渐进覆盖和重复模式。
      en: Allow isolated weak signals in short windows to form progressive coverage and recurring patterns over longer horizons.
  limitations:
    paragraphs:
    - zh: 如果扫描周期超过保留期，或者低容量事件在采样中丢失，完整活动仍然无法恢复。
      en: If the campaign exceeds the retention period or low-volume events are lost through sampling, the complete activity remains unrecoverable.
- target_ref: NJS-0001-002
  use:
    paragraphs:
    - zh: 跨来源和跨边界汇聚目标集合、端口覆盖、请求顺序和工具指纹，以识别多个低密度来源之间的互补关系。
      en: Aggregate target sets, port coverage, request ordering, and tool fingerprints across origins and boundaries to identify complementary
        relationships among low-density sources.
  expected_effect:
    paragraphs:
    - zh: 降低分布式来源在单点监测中彼此独立、无法识别协同性的问题。
      en: Reduce the chance that distributed origins appear independent and uncoordinated at local monitoring points.
  limitations:
    paragraphs:
    - zh: 不同安全域无法统一来源身份或时间时，跨来源关联会产生较高的不确定性。
      en: Cross-source correlation remains uncertain when security domains cannot align origin identities or time.
- target_ref: NJS-0001-003
  use:
    paragraphs:
    - zh: 结合多点传感器、代理、NAT、路由和响应完成度数据验证扫描来源是否真实参与交互。
      en: Combine multi-vantage sensor, proxy, NAT, routing, and response-completion data to verify whether observed scan origins actually participated.
  expected_effect:
    paragraphs:
    - zh: 提高对诱饵、代理、中继和真实扫描来源的区分与归因能力。
      en: Improve differentiation and attribution among decoys, proxies, relays, and real scan origins.
  limitations:
    paragraphs:
    - zh: 缺少中间路径日志或只能观察单向流量时，真实发起者仍可能无法确认。
      en: The true initiator may remain unresolved when intermediary-path logs are unavailable or only one-way traffic is visible.
