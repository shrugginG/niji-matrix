schema_version: 2.0.0
type: mitigation
id: MIT-000003
name:
  zh: 分片规范化与一致重组策略
  en: Fragment Normalization and Consistent Reassembly Policy
summary:
  zh: 通过分片规范化和一致重组，减少异常分片利用传感器与终端解释差异形成的检查缺口
  en: Reduce inspection gaps created by divergent sensor and endpoint interpretations through fragment normalization and consistent reassembly
description:
  paragraphs:
  - zh: 在边界设备上对异常小分片、重叠分片和不完整重组实施明确策略，使监测设备的重组结果与受保护终端保持一致；在业务允许时拒绝不必要或异常的分片流量。
    en: Apply explicit perimeter policies for tiny, overlapping, and incompletely reassembled fragments, align sensor reassembly with protected
      endpoints, and reject unnecessary or anomalous fragmented traffic where business requirements permit.
domains:
- enterprise
measures:
- key: fragment-normalization
  name:
    zh: 异常分片规范化
    en: Anomalous Fragment Normalization
  description:
    paragraphs:
    - zh: 在边界设备上对异常小分片、重叠分片、乱序分片和不完整重组实施明确处理策略。
      en: Apply explicit perimeter handling policies for tiny, overlapping, reordered, and incompletely reassembled fragments.
  control_type: preventive
- key: consistent-reassembly
  name:
    zh: 传感器与终端一致重组
    en: Consistent Sensor and Endpoint Reassembly
  description:
    paragraphs:
    - zh: 使监测设备使用与受保护终端一致的重组语义，并保留原始分片用于验证差异和取证。
      en: Align monitoring-device reassembly semantics with protected endpoints and retain original fragments for discrepancy analysis and forensics.
  control_type: detective-support
applications:
- target_ref: NJT-0001
  use:
    paragraphs:
    - zh: 在主动扫描检测链路中，应先完成分片规范化和重组，再执行端口、协议和扫描模式分析。
      en: Within Active Scanning detection pipelines, normalize and reassemble fragments before analyzing ports, protocols, and scan patterns.
  expected_effect:
    paragraphs:
    - zh: 减少不完整报文语义造成的漏检，并提高不同观察点对扫描行为解释的一致性。
      en: Reduce misses caused by incomplete packet semantics and improve consistent interpretation of scanning across observation points.
  limitations:
    paragraphs:
    - zh: 重组会增加状态和资源开销，过于严格的策略可能影响合法隧道、遗留协议和特殊网络路径。
      en: Reassembly increases state and resource costs, while overly strict policies may affect legitimate tunnels, legacy protocols, and unusual
        network paths.
- target_ref: NJS-0001-004
  use:
    paragraphs:
    - zh: 针对分片探测扫描，应检测跨首部分片、异常小分片、重叠、缺失、乱序和超时，并比较传感器与目标终端的重组结果。
      en: For Fragmented-Probe Scanning, detect header-spanning fragments, tiny fragments, overlap, loss, reordering, and timeout, and compare
        sensor and endpoint reassembly results.
  expected_effect:
    paragraphs:
    - zh: 压缩攻击者利用分片可检查性差异规避扫描检测的空间。
      en: Reduce the opportunity to evade scan detection through differences in fragment inspectability.
  limitations:
    paragraphs:
    - zh: 无法观察完整分片内容或无法获得终端处理结果时，仍可能无法确认重组差异。
      en: Reassembly differences may remain unconfirmed when complete fragment content or endpoint processing results are unavailable.
evidence_refs:
- REF-000008
