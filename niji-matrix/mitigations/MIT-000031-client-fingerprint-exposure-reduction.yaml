schema_version: 2.0.0
type: mitigation
id: MIT-000031
name:
  zh: 客户端指纹暴露最小化与脚本治理
  en: Client-Fingerprint Exposure Minimization and Script Governance
summary:
  zh: 减少普通请求和网页脚本可获得的端点属性，并约束脚本来源与差异化响应用途。
  en: Reduce endpoint attributes available through ordinary requests and web scripts while governing script provenance and differential-response purposes.
description:
  paragraphs:
  - zh: 本缓解通过降低客户端发送的细粒度平台信息、限制页面脚本读取高熵属性、治理第三方脚本供应链并审查基于客户端特征的内容选择，减少攻击者在普通 Web 会话中建立可操作主机画像的能力。措施既覆盖服务器侧消费请求固有字段，也覆盖浏览器执行附加枚举的场景。
    en: This mitigation reduces an adversary's ability to build actionable host profiles within ordinary web sessions by limiting fine-grained platform information sent by clients, constraining page-script access to high-entropy properties, governing third-party script supply, and reviewing content selection based on client characteristics. It covers both server-side consumption of inherent request fields and additional enumeration executed by the browser.
domains: [enterprise]
measures:
- key: request-metadata-minimization
  name:
    zh: 请求元数据最小化
    en: Request-Metadata Minimization
  description:
    paragraphs:
    - zh: 对组织管理的浏览器和客户端采用尽可能粗粒度且一致的 User-Agent、Client Hints、语言和协商配置，并避免暴露不影响服务交付的版本或平台细节。
      en: Configure managed browsers and clients to use the coarsest practical and consistent User-Agent, Client Hints, language, and negotiation values, avoiding version or platform detail that is unnecessary for service delivery.
  control_type: exposure-reduction
- key: high-entropy-property-control
  name:
    zh: 高熵客户端属性访问控制
    en: High-Entropy Client-Property Control
  description:
    paragraphs:
    - zh: 通过浏览器策略、内容安全策略和应用设计限制网页对软件、图形、字体、插件、设备和系统属性的读取，并对异常属性组合和回传目的地保留遥测。
      en: Use browser policy, content security policy, and application design to constrain web access to software, graphics, font, plugin, device, and system properties while retaining telemetry for anomalous attribute sets and reporting destinations.
  control_type: exposure-reduction
- key: script-provenance-governance
  name:
    zh: 页面脚本来源与完整性治理
    en: Page-Script Provenance and Integrity Governance
  description:
    paragraphs:
    - zh: 对高价值门户建立授权脚本清单、完整性基线、变更审批和第三方依赖审查，并验证客户端特征驱动的差异化响应具有明确业务用途。
      en: Establish authorized-script inventories, integrity baselines, change approval, and third-party dependency review for high-value portals, and verify that client-characteristic-driven differential responses have a documented business purpose.
  control_type: governance
applications:
- target_ref: NJT-0032
  use:
    paragraphs:
    - zh: 对收集目标主机信息，应同时减少请求固有字段和客户端脚本可泄露的端点细节，并在身份、VPN、软件下载和外部门户上治理基于主机属性的内容选择。
      en: For Gather Victim Host Information, reduce endpoint detail disclosed by both inherent request fields and client scripts, and govern host-attribute-based content selection on identity, VPN, software-download, and external portals.
  expected_effect:
    paragraphs:
    - zh: 该措施降低远端建立精细主机画像的分辨率，并使未经授权的附加枚举更容易偏离已知脚本与属性访问基线。
      en: The measures reduce the resolution of remote host profiling and make unauthorized additional enumeration more likely to diverge from known script and property-access baselines.
  limitations:
    paragraphs:
    - zh: 服务交付、防欺诈和兼容性可能仍需部分客户端属性；攻击者也可以组合地址、行为和其他来源，因此无法完全消除主机指纹。
      en: Service delivery, anti-fraud, and compatibility may still require some client attributes, and adversaries can combine address, behavior, and other sources, so host fingerprinting cannot be eliminated completely.
- target_ref: NJS-0032-002
  use:
    paragraphs:
    - zh: 对环境请求元数据采集，应降低 User-Agent 和客户端提示的粒度，统一不必要的协商差异，并审查服务器根据这些字段进行选择性响应的规则。
      en: For Ambient Request-Metadata Harvesting, reduce the granularity of User-Agent and client hints, normalize unnecessary negotiation differences, and review server rules that select responses from those fields.
  expected_effect:
    paragraphs:
    - zh: 远端仅从原始请求能够推断的操作系统、软件和版本信息减少，恶意平台筛选和选择性投递的准确度随之下降。
      en: The operating-system, software, and version detail inferable from the original request is reduced, lowering the accuracy of malicious platform selection and selective delivery.
  limitations:
    paragraphs:
    - zh: 地址、TLS、行为和必要协商字段仍可能形成组合指纹；过度统一还可能破坏兼容性或反欺诈控制。
      en: Address, TLS, behavior, and necessary negotiation fields can still form a composite fingerprint, while excessive normalization may impair compatibility or anti-fraud controls.
- target_ref: NJS-0032-003
  use:
    paragraphs:
    - zh: 对嵌入式客户端主机指纹采集，应在高价值门户强制脚本来源和内容安全策略，监测高熵属性访问，并阻止未经授权脚本向异常目的地回传结果。
      en: For Embedded Client-Side Host Fingerprinting, enforce script provenance and content security policy on high-value portals, monitor high-entropy property access, and block unauthorized scripts from reporting results to anomalous destinations.
  expected_effect:
    paragraphs:
    - zh: 该措施缩小可枚举属性集合，并提高篡改页面或供应链脚本与正常网页执行基线之间的可见差异。
      en: The measures narrow the enumerable attribute set and increase the visible divergence of altered pages or supply-chain scripts from normal web-execution baselines.
  limitations:
    paragraphs:
    - zh: 合法分析和反欺诈脚本可能使用相同 API；若受信脚本或门户本身被攻陷，既有允许策略可能同时被滥用。
      en: Legitimate analytics and anti-fraud scripts may use the same APIs, and compromise of a trusted script or portal can abuse existing allow policy.
