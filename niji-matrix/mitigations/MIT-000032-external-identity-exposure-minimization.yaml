schema_version: 2.0.0
type: mitigation
id: MIT-000032
name:
  zh: 外部身份暴露最小化与验证属性隔离
  en: External Identity Exposure Minimization and Verification-Attribute Separation
summary:
  zh: 减少外部可组合的人员与账户属性，并避免公开事实同时充当高价值身份验证依据。
  en: Reduce externally composable people and account attributes and prevent public facts from also serving as verification evidence for high-value identities.
description:
  paragraphs:
  - zh: 本缓解持续盘点公开、商业和已知泄露渠道中的组织身份材料，减少不必要的员工、联系和账户信息，并把帮助台与恢复验证所依赖的属性同公开事实隔离。它不能撤回已流出的历史数据，但可以降低新资料的可组合性并限制旧资料对后续冒充的价值。
    en: This mitigation continuously inventories organizational identity material across public, commercial, and known breach channels, removes unnecessary employee, contact, and account detail, and separates attributes used for help-desk or recovery verification from public facts. It cannot retract historical data already released, but it can reduce the composability of new material and limit the value of old material for downstream impersonation.
domains: [enterprise]
measures:
- key: external-identity-inventory
  name:
    zh: 外部身份暴露盘点
    en: External Identity Exposure Inventory
  description:
    paragraphs:
    - zh: 定期从公开搜索、商业数据和可信泄露情报视角识别员工姓名、邮箱、电话、岗位、恢复线索和账户关联，并按身份风险和可组合性确定整改优先级。
      en: Regularly identify employee names, email addresses, phone numbers, roles, recovery clues, and account relationships from public search, commercial data, and trusted breach intelligence, prioritizing remediation by identity risk and composability.
  control_type: governance
- key: identity-data-minimization
  name:
    zh: 人员与账户资料最小化
    en: People and Account Data Minimization
  description:
    paragraphs:
    - zh: 从组织控制的网站、目录、代码库、文档和元数据中删除非必要身份细节，并为确需公开的信息设定责任人、用途和复核周期。
      en: Remove unnecessary identity detail from organization-controlled sites, directories, repositories, documents, and metadata, and assign an owner, purpose, and review period to information that must remain public.
  control_type: exposure-reduction
- key: verification-attribute-separation
  name:
    zh: 验证属性与公开事实隔离
    en: Verification-Attribute Separation from Public Facts
  description:
    paragraphs:
    - zh: 禁止帮助台和恢复流程仅依赖可从公开资料或历史泄露获得的知识型属性，并对高价值身份采用抗钓鱼认证和独立回拨或审批。
      en: Prevent help-desk and recovery workflows from relying solely on knowledge attributes obtainable from public records or historical breaches, and use phishing-resistant authentication with independent callback or approval for high-value identities.
  control_type: preventive
applications:
- target_ref: NJT-0033
  use:
    paragraphs:
    - zh: 对收集目标身份信息，应建立从外部暴露发现到人员、账户和恢复流程整改的闭环，并优先保护管理员、帮助台人员和其他高价值身份。
      en: For Gather Victim Identity Information, establish a closed loop from external-exposure discovery to remediation of people, account, and recovery processes, prioritizing administrators, help-desk staff, and other high-value identities.
  expected_effect:
    paragraphs:
    - zh: 可供攻击者组合的身份属性减少，旧资料在冒充和社会工程中的验证价值下降，并提高使用外部身份材料开展后续行动的成本。
      en: Fewer identity attributes remain available for adversary composition, old material has less verification value in impersonation and social engineering, and the cost of downstream use of external identity material increases.
  limitations:
    paragraphs:
    - zh: 法规、招聘和业务联系可能要求公开部分资料，历史泄露无法完全撤回，控制也不能阻止攻击者从独立第三方继续购买或交换数据。
      en: Regulation, recruiting, and business contact may require some information to remain public, historical breaches cannot be fully retracted, and the controls cannot stop adversaries from buying or exchanging data through independent third parties.
- target_ref: NJS-0033-001
  use:
    paragraphs:
    - zh: 对受害域外身份获取，应监测公开与已知泄露生态中的身份材料，减少新暴露，并确保帮助台、恢复和 MFA 变更不把这些材料视为充分验证。
      en: For Off-Victim Identity Acquisition, monitor identity material in public and known breach ecosystems, reduce new exposure, and ensure help-desk, recovery, and MFA changes do not treat that material as sufficient verification.
  expected_effect:
    paragraphs:
    - zh: 攻击者仍可能取得历史数据，但其构建当前可操作身份画像和利用该画像通过组织验证流程的成功率降低。
      en: An adversary may still obtain historical data, but its ability to build a current actionable identity profile and use it to pass organizational verification is reduced.
  limitations:
    paragraphs:
    - zh: 目标组织通常无法观察实际检索者，且第三方删除和更正能力有限，因此效果依赖持续治理和后续流程不信任公开事实。
      en: Victim organizations generally cannot observe the actual consumer, and third-party deletion and correction are limited, so effectiveness depends on continuous governance and downstream processes not trusting public facts.
