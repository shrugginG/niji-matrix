schema_version: 2.0.0
type: mitigation
id: MIT-000033
name:
  zh: 身份工作流响应等价化与未认证披露限制
  en: Identity-Workflow Response Equalization and Pre-Authentication Disclosure Limitation
summary:
  zh: 统一有效与无效身份的外部响应并限制未认证状态披露，降低账户和恢复属性推断能力。
  en: Equalize external responses for valid and invalid identities and limit unauthenticated state disclosure to reduce account and recovery-attribute inference.
description:
  paragraphs:
  - zh: 本缓解在登录、注册、恢复、联合身份和 MFA 流程中统一可观察的正文、状态、跳转和时延，避免在认证前显示账户存在性、验证方式或恢复配置，并保留内部风险信号支持跨功能关联。它减少响应差异能够提供的信息量，但必须与速率控制和异常分析共同实施。
    en: This mitigation equalizes observable content, status, redirects, and timing across login, registration, recovery, federation, and MFA flows, avoids displaying account existence, verification methods, or recovery configuration before authentication, and retains internal risk signals for cross-function correlation. It reduces information available from response differences but must operate together with rate controls and anomaly analysis.
domains: [enterprise]
measures:
- key: external-response-equalization
  name:
    zh: 外部响应等价化
    en: External Response Equalization
  description:
    paragraphs:
    - zh: 对有效与无效身份返回语义等价的正文、状态、跳转和大致一致的处理时间，并避免通过资源大小或流程分支暴露内部判定。
      en: Return semantically equivalent content, status, redirects, and broadly consistent processing time for valid and invalid identities, avoiding disclosure of internal decisions through response size or flow branching.
  control_type: preventive
- key: preauthentication-state-minimization
  name:
    zh: 未认证身份状态最小化
    en: Pre-Authentication Identity-State Minimization
  description:
    paragraphs:
    - zh: 在充分认证前不展示恢复渠道、MFA 类型、账户启用状态、租户关系或其他可用于筛选目标的身份属性。
      en: Do not expose recovery channels, MFA types, account-enabled state, tenant relationships, or other target-selection attributes before sufficient authentication.
  control_type: exposure-reduction
- key: cross-workflow-abuse-control
  name:
    zh: 跨身份工作流滥用控制
    en: Cross-Workflow Abuse Control
  description:
    paragraphs:
    - zh: 在登录、注册、恢复和 MFA 服务之间共享风险标识、速率状态和未完成流程信号，同时为内部检测保留不对外呈现的判定细节。
      en: Share risk identifiers, rate state, and incomplete-flow signals across login, registration, recovery, and MFA services while retaining internal decision detail that is not exposed externally.
  control_type: preventive
applications:
- target_ref: NJT-0033
  use:
    paragraphs:
    - zh: 对收集目标身份信息，应在所有外部身份入口统一未认证响应与披露策略，并把差异测试纳入上线验收和持续安全测试。
      en: For Gather Victim Identity Information, standardize unauthenticated response and disclosure policy across all external identity entry points and include differential testing in release acceptance and continuous security testing.
  expected_effect:
    paragraphs:
    - zh: 攻击者从单次或比较请求中能够推断的账户存在性、恢复方式和 MFA 配置减少，自动化筛选需要更多请求且可靠性下降。
      en: Attackers can infer less account-existence, recovery-method, and MFA-configuration information from individual or comparative requests, requiring more requests with lower automation reliability.
  limitations:
    paragraphs:
    - zh: 网络时延、后端缓存、第三方身份提供方和业务流程差异仍可能形成侧信道；等价响应不能阻止攻击者利用已泄露身份材料。
      en: Network latency, backend caching, third-party identity providers, and business-flow differences can still create side channels, and equalized responses cannot prevent use of already breached identity material.
- target_ref: NJS-0033-002
  use:
    paragraphs:
    - zh: 对身份工作流拟态推断，应同时统一外部响应、隐藏未认证验证选项，并跨功能限制同一来源或客户端对大量身份发起未完成事务。
      en: For Identity-Workflow Mimicry and Inference, combine external response equalization, concealment of unauthenticated verification options, and cross-function limits on incomplete transactions across many identities from one source or client.
  expected_effect:
    paragraphs:
    - zh: 响应簇之间的可测差异和可枚举属性减少，高扇出比较更容易触发内部关联，同时不要求向攻击者暴露具体阻断原因。
      en: Measurable differences between response clusters and enumerable attributes are reduced, while high-fan-out comparison becomes easier to correlate internally without disclosing specific blocking reasons to the adversary.
  limitations:
    paragraphs:
    - zh: 过严速率限制可能影响合法恢复和批量开户，且分布式低频请求可能绕过单来源控制，因此需要风险分层和长周期关联。
      en: Aggressive rate limits may impair legitimate recovery and bulk onboarding, and distributed low-rate requests may evade per-origin controls, requiring risk stratification and long-horizon correlation.
evidence_refs: [REF-000033, REF-000034, REF-000035]
