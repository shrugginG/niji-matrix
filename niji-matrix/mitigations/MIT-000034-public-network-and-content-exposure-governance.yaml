schema_version: 2.0.0
type: mitigation
id: MIT-000034
name:
  zh: 公开组织与网站内容暴露治理
  en: Public Organizational and Website Content Exposure Governance
summary:
  zh: 盘点并最小化公开组织资料、代码内容、网页和导航工件中的可组合目标情报。
  en: Inventory and minimize composable targeting intelligence in public organizational records, code content, web pages, and navigation artifacts.
description:
  paragraphs:
  - zh: 本缓解建立公开内容从创建、审批、发布、外部发现到撤回的治理闭环，减少组织结构、职责、业务关系、运营规律、技术细节和敏感路径被跨来源组合的价值。它同时覆盖组织自有网站和第三方开放内容，但不把所有公开信息都视为可删除，而是依据业务必要性、敏感度、时效与组合风险管理。
    en: This mitigation establishes a governance loop from creation, approval, and publication through external discovery and withdrawal, reducing the value of combining organizational structure, responsibilities, business relationships, operating patterns, technical detail, and sensitive paths across sources. It covers both organization-owned websites and third-party open content without assuming all public information can be removed, instead managing business necessity, sensitivity, freshness, and composition risk.
domains: [enterprise]
measures:
- key: public-content-inventory
  name:
    zh: 公开内容与组合风险清单
    en: Public Content and Composition-Risk Inventory
  description:
    paragraphs:
    - zh: 持续盘点官网、招聘、投资者关系、采购、代码库、监管资料和第三方索引中的组织、人员、业务与技术属性，并识别单项低敏信息组合后的目标价值。
      en: Continuously inventory organizational, people, business, and technical attributes across corporate, recruiting, investor-relations, procurement, code-repository, regulatory, and third-party indexed content, including the targeting value created by combining individually low-sensitivity facts.
  control_type: governance
- key: publication-minimization-review
  name:
    zh: 发布前最小化与敏感内容审查
    en: Pre-Publication Minimization and Sensitive-Content Review
  description:
    paragraphs:
    - zh: 在发布页面、文档、代码和元数据前移除非必要职责、联系方式、合作关系、版本、密钥与内部路径，并为必须公开的内容设定责任人和复核周期。
      en: Before publishing pages, documents, code, and metadata, remove unnecessary responsibilities, contact details, relationships, versions, secrets, and internal paths, and assign an owner and review period to content that must remain public.
  control_type: exposure-reduction
- key: navigation-artifact-review
  name:
    zh: 导航工件与低流量路径审查
    en: Navigation-Artifact and Low-Traffic Path Review
  description:
    paragraphs:
    - zh: 审查公开链接图、sitemap 和 robots 工件，确保它们不披露本不应公开的管理、测试、备份或敏感业务路径，并在路径撤回时同步清理索引和缓存线索。
      en: Review public link graphs, sitemaps, and robots artifacts to ensure they do not disclose administrative, test, backup, or sensitive business paths that should not be public, and remove index and cache clues when paths are withdrawn.
  control_type: exposure-reduction
- key: external-content-validation
  name:
    zh: 外部内容视角验证与整改
    en: External Content-Vantage Validation and Remediation
  description:
    paragraphs:
    - zh: 定期从搜索、社交、代码、归档和监管数据视角验证组织的外部画像，并通过更正、删除、凭据轮换或流程调整降低已发现暴露的后续价值。
      en: Regularly validate the organization's external profile from search, social, code, archive, and regulatory-data vantage points, reducing downstream value through correction, removal, credential rotation, or process change.
  control_type: governance
applications:
- target_ref: NJT-0035
  use:
    paragraphs:
    - zh: 对收集目标组织信息，应识别公开资料中可组合的部门、职责、合作伙伴和运营规律，并在不影响法定披露和业务沟通的前提下减少非必要细节。
      en: For Gather Victim Organization Information, identify composable departments, responsibilities, partners, and operating patterns in public material and reduce unnecessary detail without impairing required disclosure or business communication.
  expected_effect:
    paragraphs:
    - zh: 攻击者构建完整组织模型所需来源增多、数据一致性下降，并需要更多验证活动。
      en: The adversary needs more sources to build a complete organizational model, encounters lower data consistency, and must perform more validation activity.
  limitations:
    paragraphs:
    - zh: 法规、招聘、采购和投资者沟通要求部分组织信息公开，外部平台和归档也可能长期保留旧版本。
      en: Regulation, recruiting, procurement, and investor communication require some organizational information to remain public, and external platforms or archives may retain old versions for long periods.
- target_ref: NJS-0035-001
  use:
    paragraphs:
    - zh: 对目标外组织情报拼接，应从第三方视角定期重建组织画像，找出跨来源组合后暴露的关系和节奏，并减少或使高风险属性失效。
      en: For Off-Target Organizational Intelligence Synthesis, periodically reconstruct the organizational profile from third-party vantage points, identify relationships and operating patterns exposed only after cross-source composition, and reduce or invalidate high-risk attributes.
  expected_effect:
    paragraphs:
    - zh: 目标外来源仍可查询，但完整画像更不准确、更快过时，并降低其直接支持冒充或目标选择的价值。
      en: Off-target sources remain queryable, but the complete profile becomes less accurate and stales faster, reducing its direct value for impersonation or target selection.
  limitations:
    paragraphs:
    - zh: 组织无法控制独立新闻、监管记录和历史归档，且公开事实可能通过其他来源再次出现。
      en: The organization cannot control independent news, regulatory records, and historical archives, and public facts may reappear through other sources.
- target_ref: NJT-0037
  use:
    paragraphs:
    - zh: 对检索第三方开放内容，应扫描公开代码、社交、搜索和归档结果中的高风险资料，并优先撤销暴露凭据、恢复属性和内部技术细节。
      en: For Search Third-Party Open Content, scan public code, social, search, and archive results for high-risk material and prioritize revocation of exposed credentials, recovery attributes, and internal technical detail.
  expected_effect:
    paragraphs:
    - zh: 可被第三方查询直接转化为访问或高精度目标画像的内容减少，后续利用需要额外来源或验证。
      en: Less third-party-searchable content can be converted directly into access or high-precision targeting, requiring additional sources or validation for downstream use.
  limitations:
    paragraphs:
    - zh: 删除源内容不保证搜索缓存、镜像或历史副本同步消失，也不能阻止对合法公开内容的查询。
      en: Removing source content does not guarantee disappearance from search caches, mirrors, or historical copies and cannot prevent queries of legitimately public material.
- target_ref: NJT-0038
  use:
    paragraphs:
    - zh: 对搜索受害者自有网站，应按页面与导航工件审查公开信息必要性，移除无业务价值的敏感关系、内部路径、技术细节和过期资料。
      en: For Search Victim-Owned Websites, review the necessity of public information by page and navigation artifact, removing sensitive relationships, internal paths, technical detail, and stale material without business value.
  expected_effect:
    paragraphs:
    - zh: 网站仍可被访问，但单次或连贯浏览能够获得的可操作情报减少，敏感路径也更少通过公开导航泄露。
      en: The website remains accessible, but individual or coherent browsing yields less actionable intelligence and fewer sensitive paths are disclosed through public navigation.
  limitations:
    paragraphs:
    - zh: 公开网站必须服务真实访客，无法依靠内容最小化区分恶意阅读，且已归档内容可能继续存在。
      en: Public websites must serve legitimate visitors, content minimization cannot distinguish malicious reading, and archived content may persist.
- target_ref: NJS-0038-001
  use:
    paragraphs:
    - zh: 对正常访客拟态的网站浏览，应减少单个用户旅程即可组合的高价值人员、伙伴、技术和运营细节，并为敏感内容设置适当访问或联系流程。
      en: For Benign-Visitor-Mimetic Web Browsing, reduce high-value people, partner, technical, and operating detail composable within one user journey and place sensitive content behind appropriate access or contact workflows.
  expected_effect:
    paragraphs:
    - zh: 即使恶意会话保持正常外观，其能够无摩擦取得的画像深度和后续行动价值也会下降。
      en: Even when a malicious session preserves a normal appearance, the depth and downstream value of the profile obtainable without friction declines.
  limitations:
    paragraphs:
    - zh: 过度限制会损害求职、客户、媒体和投资者体验，攻击者仍可跨时间和外部来源组合信息。
      en: Excessive restriction harms job-seeker, customer, media, and investor experience, while adversaries can still compose information across time and external sources.
- target_ref: NJS-0038-002
  use:
    paragraphs:
    - zh: 对受害者发布导航工件替代，应确保公开链接、sitemap 和 robots 只列出预期公开路径，并在敏感或废弃路径变化时同步更新与清理。
      en: For Victim-Published Navigation-Artifact Substitution, ensure public links, sitemaps, and robots artifacts list only intentionally public paths and update or clean them when sensitive or retired paths change.
  expected_effect:
    paragraphs:
    - zh: 攻击者从确定性导航直接发现未预期路径的机会减少，若继续寻找则更可能产生猜测式请求和错误响应。
      en: The opportunity to discover unintended paths directly from deterministic navigation declines, and continued searching is more likely to create speculative requests and error responses.
  limitations:
    paragraphs:
    - zh: robots 与 sitemap 不是访问控制，已公开路径可能被缓存；真正敏感资源仍必须使用认证和授权保护。
      en: Robots and sitemap files are not access controls and published paths may be cached; genuinely sensitive resources still require authentication and authorization.
