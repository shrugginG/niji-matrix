schema_version: 2.0.0
type: mitigation
id: MIT-000035
name:
  zh: 敏感信息请求独立验证与最小披露
  en: Independent Verification and Minimal Disclosure for Sensitive Requests
summary:
  zh: 通过独立验证请求者与业务授权、标准披露流程和分阶段最小化，降低情境伪装与渐进诱导的成功率。
  en: Reduce success of contextual camouflage and progressive elicitation through independent requester and business authorization checks, standard disclosure workflows, and staged minimization.
description:
  paragraphs:
  - zh: 本缓解把敏感信息披露从通信说服力中分离出来，要求员工依据数据类别、请求者角色和业务关系使用预先登记的回拨、审批或系统工作流验证，并只提供完成合法任务所需的最小信息。培训用于识别情境一致和多轮诱导，但不替代技术性授权检查。
    en: This mitigation separates sensitive-information disclosure from communication persuasiveness by requiring employees to verify data category, requester role, and business relationship through pre-registered callback, approval, or system workflows and disclose only the minimum needed for a legitimate task. Training supports recognition of contextual and multi-turn elicitation but does not replace technical authorization checks.
domains: [enterprise]
measures:
- key: independent-requester-verification
  name:
    zh: 请求者与关系独立验证
    en: Independent Requester and Relationship Verification
  description:
    paragraphs:
    - zh: 对凭据、验证码、财务、运营和人员资料请求，使用组织已登记的联系方式或业务系统独立确认请求者身份、关系与授权，而不依赖消息内提供的号码、链接或证明。
      en: For requests involving credentials, verification codes, financial, operational, or people data, independently confirm requester identity, relationship, and authorization through organization-registered contacts or business systems rather than numbers, links, or evidence supplied in the message.
  control_type: preventive
- key: sensitive-disclosure-workflow
  name:
    zh: 敏感信息标准披露流程
    en: Standard Sensitive-Information Disclosure Workflow
  description:
    paragraphs:
    - zh: 按数据类型规定允许渠道、审批人、记录和最小披露范围，并禁止通过普通消息或外部表单发送凭据、验证码和完整敏感记录。
      en: Define allowed channels, approvers, records, and minimum disclosure scope by data type, prohibiting credentials, verification codes, and complete sensitive records from being sent through ordinary messages or external forms.
  control_type: governance
- key: elicitation-resistance-training
  name:
    zh: 情境与渐进诱导识别训练
    en: Contextual and Progressive Elicitation Resistance Training
  description:
    paragraphs:
    - zh: 训练员工识别贴合岗位的话术、关系培养、跨渠道迁移和敏感度逐步上升，并在任何阶段使用一致的独立验证和上报流程。
      en: Train personnel to recognize role-aligned pretexts, relationship cultivation, channel migration, and gradual sensitivity escalation and to use consistent independent verification and reporting at every stage.
  control_type: governance
applications:
- target_ref: NJT-0036
  use:
    paragraphs:
    - zh: 对通过钓鱼获取信息，应将凭据、验证码、财务和运营资料请求统一纳入敏感披露政策，并要求所有媒介采用同一独立验证标准。
      en: For Phishing for Information, place requests for credentials, verification codes, financial data, and operational information under one sensitive-disclosure policy and require the same independent verification standard across media.
  expected_effect:
    paragraphs:
    - zh: 即使身份、话术、节奏或界面具有可信外观，攻击者仍难以仅凭通信说服力获得可操作信息。
      en: Even when persona, pretext, cadence, or interface appears credible, the adversary is less able to obtain actionable information through persuasion alone.
  limitations:
    paragraphs:
    - zh: 控制依赖流程可用性和人员执行，紧急业务、影子 IT 或被攻陷的批准渠道仍可能绕过验证。
      en: The control depends on workflow availability and human execution, while urgent business, shadow IT, or compromised approval channels can still bypass verification.
- target_ref: NJS-0036-001
  use:
    paragraphs:
    - zh: 对情境一致的身份与话术伪装，应验证请求者是否真实拥有所声称角色和信息授权，并通过消息之外的已登记渠道确认异常敏感请求。
      en: For Context-Conforming Persona and Pretext Camouflage, verify that the requester actually holds the claimed role and data authorization and confirm anomalous sensitive requests through a registered channel outside the message.
  expected_effect:
    paragraphs:
    - zh: 组织语气、术语和业务时机不再足以通过验证，攻击者必须同时攻陷独立关系或审批链。
      en: Organizational tone, terminology, and business timing no longer suffice for verification, forcing the adversary also to compromise an independent relationship or approval chain.
  limitations:
    paragraphs:
    - zh: 若授权目录过时或独立联系人本身受控，验证仍可能失败；过度验证也会增加业务摩擦。
      en: Verification can still fail when authorization records are stale or the independent contact is compromised, and excessive verification adds business friction.
- target_ref: NJS-0036-002
  use:
    paragraphs:
    - zh: 对渐进式会话诱导，应在每次请求敏感度上升时重新执行授权检查，禁止早期低风险互动自动授予后续高敏感披露信任。
      en: For Progressive Conversational Elicitation, repeat authorization checks whenever requested sensitivity increases and prevent early low-risk interaction from automatically granting trust for later high-sensitivity disclosure.
  expected_effect:
    paragraphs:
    - zh: 攻击者无法仅靠长期关系积累逐步跨越披露边界，完整诱导链更可能在升级节点被中断或上报。
      en: The adversary cannot cross disclosure boundaries merely through accumulated relationship time, making the full elicitation chain more likely to be interrupted or reported at escalation points.
  limitations:
    paragraphs:
    - zh: 合法长期合作也会逐步请求更多资料，若敏感度分类和审批体验不合理，人员可能绕开正式流程。
      en: Legitimate long-term relationships also request more data over time, and personnel may bypass formal processes when sensitivity classification or approval experience is impractical.
