schema_version: 2.0.0
type: mitigation
id: MIT-000036
name:
  zh: 受信账户保护与邮箱审计完整性
  en: Trusted-Account Protection and Mailbox Audit Integrity
summary:
  zh: 强化账户会话、委派与规则治理并保留不可变审计，降低受信线程寄生和诱导痕迹抑制能力。
  en: Harden account sessions, delegation, and rule governance and retain immutable audit to reduce trusted-thread parasitism
    and solicitation-trace suppression.
description:
  paragraphs:
  - zh: 本缓解通过抗钓鱼认证、会话风险控制、委派与转发最小化、邮箱规则变更保护以及不可变发送和删除审计，降低攻击者借用真实受信身份开展信息诱导并隐藏痕迹的能力。措施分别保护身份信任和证据完整性，不能以正常域认证替代行为审查。
    en: This mitigation uses phishing-resistant authentication, session-risk controls, delegation and forwarding minimization,
      mailbox-rule change protection, and immutable send and deletion audit to reduce an adversary's ability to elicit information
      through a genuine trusted identity and hide traces. The measures separately protect identity trust and evidence integrity;
      successful domain authentication does not replace behavioral review.
domains:
- enterprise
measures:
- key: phishing-resistant-session-control
  name:
    zh: 抗钓鱼认证与会话风险控制
    en: Phishing-Resistant Authentication and Session-Risk Control
  description:
    paragraphs:
    - zh: 对邮箱和协作账户启用抗钓鱼 MFA、设备与位置风险评估、令牌撤销和异常会话再认证，并优先保护高信任业务角色。
      en: Enable phishing-resistant MFA, device and location risk assessment, token revocation, and anomalous-session reauthentication
        for email and collaboration accounts, prioritizing high-trust business roles.
  control_type: preventive
- key: mailbox-rule-delegation-governance
  name:
    zh: 邮箱规则、委派与转发治理
    en: Mailbox Rule, Delegation, and Forwarding Governance
  description:
    paragraphs:
    - zh: 限制和审批外部转发、隐藏规则、共享邮箱委派及自动删除，并对高风险变更触发独立确认和快速回滚。
      en: Restrict and approve external forwarding, hiding rules, shared-mailbox delegation, and automatic deletion, requiring
        independent confirmation and rapid rollback for high-risk changes.
  control_type: preventive
- key: immutable-mail-audit
  name:
    zh: 不可变消息与配置审计
    en: Immutable Message and Configuration Audit
  description:
    paragraphs:
    - zh: 将发送、删除、规则、转发、委派和审计状态事件写入用户无法修改的集中日志，并设置覆盖关系培养和发送后清理的留存期。
      en: Write send, deletion, rule, forwarding, delegation, and audit-state events to centralized logs users cannot modify,
        retaining them long enough to cover relationship cultivation and post-send cleanup.
  control_type: detective-support
applications:
- target_ref: NJS-0036-003
  use:
    paragraphs:
    - zh: 对受信账户与线程寄生，应保护高信任账户会话、限制异常设备和令牌，并在既有线程出现新收件人或敏感请求时要求再验证。
      en: For Trusted-Account and Thread Parasitism, protect sessions for high-trust accounts, constrain anomalous devices
        and tokens, and require revalidation when new recipients or sensitive requests appear in an existing thread.
  expected_effect:
    paragraphs:
    - zh: 攻击者取得或维持可信发送身份的难度上升，既有线程中的异常用途更容易偏离会话和收件关系基线。
      en: The cost of obtaining or maintaining a trusted sending identity increases, and anomalous use within existing threads
        is more likely to diverge from session and recipient-relationship baselines.
  limitations:
    paragraphs:
    - zh: 已通过强认证建立的被盗会话仍可能短期可用，共享账户和复杂委派关系也会增加误报与治理成本。
      en: A stolen session established through strong authentication may remain usable briefly, and shared accounts or complex
        delegation relationships increase false positives and governance cost.
- target_ref: NJS-0036-004
  use:
    paragraphs:
    - zh: 对邮箱侧诱导痕迹抑制，应阻止用户关闭关键审计，集中保存发送和删除事件，并对发送后快速删除、隐藏规则和异常转发进行保护与告警。
      en: For Mailbox-Side Solicitation Trace Suppression, prevent users from disabling critical audit, centrally retain send
        and deletion events, and protect and alert on rapid post-send deletion, hiding rules, and anomalous forwarding.
  expected_effect:
    paragraphs:
    - zh: 攻击者可以改变普通邮箱视图，但难以同步删除集中证据，防守方能够恢复信息诱导的时间线和控制会话。
      en: The adversary may alter ordinary mailbox views but cannot easily remove centralized evidence at the same time, allowing
        defenders to reconstruct the elicitation timeline and controlling session.
  limitations:
    paragraphs:
    - zh: SaaS 许可、日志粒度和留存成本可能限制不可变审计，攻击者也可转向组织不可见的个人平台。
      en: SaaS licensing, log granularity, and retention cost may limit immutable audit, and the adversary can move to personal
        platforms outside organizational visibility.
- target_ref: NJT-0150
  use:
    paragraphs:
    - zh: 对内部定向钓鱼，在已确认受陷发件账户后检查会话、委派、转发与邮箱规则；对按本次主题归档警示回复的规则实施独立告警和回滚，同时保留服务器侧发送、收件与归档证据。
      en: For Internal Spearphishing, inspect sessions, delegation, forwarding, and mailbox rules once a sender is confirmed
        compromised. Independently alert on and roll back a rule archiving warnings by this campaign subject while retaining
        server-side send, receive, and archive evidence.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难借真实内部身份持续发送诱导或让警示回复从原所有者日常视图消失而不留下中心审计；响应者仍能找回同批次收件者。
      en: The adversary has less opportunity to keep sending lures from a genuine internal identity or remove warning replies
        from the original owner's ordinary view without central audit residue, while responders can recover the campaign recipient
        set.
  limitations:
    paragraphs:
    - zh: 已取得的令牌可在撤销前短暂使用，合法助理和共享邮箱委派也会形成相似操作；规则治理不替代 MIT-000154 对实际内部消息与收件动作的检查。
      en: A stolen token can remain usable briefly before revocation, and legitimate assistants or shared-mailbox delegation
        may look similar. Rule governance does not replace MIT-000154 inspection of the actual internal message and recipient
        action.
