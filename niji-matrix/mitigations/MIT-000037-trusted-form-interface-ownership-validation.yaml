schema_version: 2.0.0
type: mitigation
id: MIT-000037
name:
  zh: 可信表单与品牌界面所有权验证
  en: Trusted-Form and Branded-Interface Ownership Validation
summary:
  zh: 验证托管租户、页面所有者、数据去向和品牌授权，防止可信平台与视觉外观替代真实业务关系。
  en: Validate hosting tenant, page owner, data destination, and brand authorization so trusted platforms and visual appearance cannot substitute for genuine business relationships.
description:
  paragraphs:
  - zh: 本缓解要求组织登记所有用于敏感信息收集的外部表单、协作页面和品牌化界面，并通过受管入口向用户提供可验证所有权与数据去向。邮件和浏览器控制应检查租户而非只检查平台域名，员工则不得在未登记页面提交凭据、验证码或财务资料。
    en: This mitigation requires organizations to register every external form, collaboration page, and branded interface used for sensitive-information collection and provide verifiable ownership and data destination through managed entry points. Email and browser controls should inspect tenant rather than platform domain alone, and personnel should not submit credentials, verification codes, or financial information to unregistered pages.
domains: [enterprise]
measures:
- key: sensitive-form-registry
  name:
    zh: 敏感表单与租户登记
    en: Sensitive Form and Tenant Registry
  description:
    paragraphs:
    - zh: 记录批准表单和页面的完整 URL、托管租户、所有者、品牌实体、字段类别、数据接收方与有效期，并向浏览器和邮件安全控制提供查询接口。
      en: Record the complete URL, hosting tenant, owner, branded entity, field categories, data recipient, and validity period for approved forms and pages, exposing the registry to browser and email security controls.
  control_type: governance
- key: tenant-aware-link-control
  name:
    zh: 租户感知链接与提交控制
    en: Tenant-Aware Link and Submission Control
  description:
    paragraphs:
    - zh: 对可信云平台解析实际租户、页面所有权和提交目的地，在品牌不一致或敏感字段发送到未登记主体时阻断或警告。
      en: Resolve actual tenant, page ownership, and submission destination on trusted cloud platforms, blocking or warning when branding is inconsistent or sensitive fields are sent to an unregistered party.
  control_type: preventive
- key: brand-abuse-response
  name:
    zh: 品牌滥用发现与下架响应
    en: Brand-Abuse Discovery and Takedown Response
  description:
    paragraphs:
    - zh: 持续发现外部平台上的仿冒品牌页面，保存证据并通过平台举报、租户冻结和域名或链接阻断快速处置。
      en: Continuously discover imitative branded pages on external platforms, preserve evidence, and respond rapidly through platform reporting, tenant suspension, and domain or link blocking.
  control_type: containment
applications:
- target_ref: NJS-0036-005
  use:
    paragraphs:
    - zh: 对可信界面与托管表面借用，应验证云表单或协作页面的具体租户、业务所有者和数据接收方，而不能把常见服务域名、学校品牌或视觉相似视为可信证明。
      en: For Trusted Interface and Hosting-Surface Borrowing, verify the specific tenant, business owner, and data recipient of a cloud form or collaboration page rather than treating a common service domain, institutional brand, or visual similarity as proof of trust.
  expected_effect:
    paragraphs:
    - zh: 攻击者借用可信平台声誉和复制品牌的收益降低，未登记租户与敏感提交路径更容易被阻断和处置。
      en: The benefit of borrowing trusted-platform reputation and copied branding declines, while unregistered tenants and sensitive submission paths become easier to block and remove.
  limitations:
    paragraphs:
    - zh: 已登记租户或业务所有者账户被攻陷时，所有权验证本身可能通过；平台下架也可能滞后于短期诱导窗口。
      en: Ownership validation may pass when a registered tenant or business-owner account is compromised, and platform takedown may lag a short elicitation window.
