schema_version: 2.0.0
type: mitigation
id: MIT-000038
name:
  zh: 平台研究账户完整性与滥用控制
  en: Platform Research-Account Integrity and Abuse Controls
summary:
  zh: 通过账户生命周期、基础设施和目标访问图关联，提高假名研究账户的建立、维持与隔离成本。
  en: Increase the cost of establishing, maintaining, and compartmenting pseudonymous research accounts through account-lifecycle, infrastructure, and target-access graph correlation.
description:
  paragraphs:
  - zh: 本缓解由开放内容、社交或代码平台实施，通过风险分层注册、设备与恢复属性关联、查询和目标查看图分析、用途限制与分级处置，降低攻击者用假名账户隔离研究身份的效果。控制应允许合法假名与安全研究，同时对集中目标画像和后续滥用要求更强验证。
    en: This mitigation is implemented by open-content, social, or code platforms and uses risk-tiered registration, device and recovery-attribute linkage, query and target-view graph analysis, purpose limits, and graduated enforcement to reduce the effectiveness of pseudonymous accounts in compartmenting research identity. Controls should preserve legitimate pseudonymity and security research while requiring stronger verification for concentrated target profiling and downstream abuse.
domains: [enterprise]
measures:
- key: risk-tiered-account-integrity
  name:
    zh: 风险分层账户完整性
    en: Risk-Tiered Account Integrity
  description:
    paragraphs:
    - zh: 根据账户权限、查询规模、目标敏感度和滥用历史分层验证，并在高风险研究行为出现时要求增强验证或限制功能。
      en: Tier verification by account privilege, query scale, target sensitivity, and abuse history, requiring enhanced verification or limiting functions when high-risk research behavior appears.
  control_type: cost-increasing
- key: cross-account-linkage
  name:
    zh: 跨账户基础设施与恢复属性关联
    en: Cross-Account Infrastructure and Recovery Linkage
  description:
    paragraphs:
    - zh: 在隐私和法律边界内关联设备、登录来源、恢复标识、创建模式与查询序列，识别被分散到多个假名画像的共同操作者。
      en: Within privacy and legal boundaries, correlate devices, login origins, recovery identifiers, creation patterns, and query sequences to identify common operators distributed across pseudonymous profiles.
  control_type: detective-support
- key: target-graph-enforcement
  name:
    zh: 目标访问图与分级处置
    en: Target-Access Graph and Graduated Enforcement
  description:
    paragraphs:
    - zh: 对集中研究同一组织人员、代码或主题并与后续滥用重合的账户执行限制、挑战、证据保存、冻结和可信共享。
      en: Apply limits, challenges, evidence preservation, suspension, and trusted sharing to accounts concentrating research on one organization's people, code, or topics and overlapping downstream abuse.
  control_type: containment
applications:
- target_ref: NJT-0037
  use:
    paragraphs:
    - zh: 对检索第三方开放内容，平台应保留查询和查看级审计，限制异常批量或集中目标行为，并在确认滥用时向受影响组织提供最小必要情报。
      en: For Search Third-Party Open Content, platforms should retain query- and view-level audit, constrain anomalous bulk or concentrated targeting, and provide minimally necessary intelligence to affected organizations when abuse is confirmed.
  expected_effect:
    paragraphs:
    - zh: 目标外查询仍然可用，但持续集中研究更可能触发平台摩擦、调查和共享，从而降低完全不可见性。
      en: Off-victim querying remains available, but sustained concentrated research is more likely to trigger platform friction, investigation, and sharing, reducing complete invisibility.
  limitations:
    paragraphs:
    - zh: 普通公开访问具有高合法率，平台不能仅按研究主题限制账户；无账户查询和严格隔离基础设施仍可能绕过关联。
      en: Ordinary public access has a high legitimate rate and platforms cannot restrict accounts solely by research topic; accountless access and strictly separated infrastructure can still evade correlation.
- target_ref: NJS-0037-001
  use:
    paragraphs:
    - zh: 对假名研究账户隔离，应将账户画像、设备、登录、恢复、目标图和后续滥用联合评分，并采用逐步挑战与证据保存避免只依据假名身份本身处置。
      en: For Pseudonymous Research-Account Compartmentation, jointly score profile, device, login, recovery, target graph, and downstream abuse, using graduated challenges and evidence preservation rather than acting on pseudonymity alone.
  expected_effect:
    paragraphs:
    - zh: 攻击者维持可信隔离画像和阻断跨账户关联的成本上升，平台更可能恢复真实操作关系并限制后续研究。
      en: The cost of maintaining plausible compartmented profiles and preventing cross-account linkage rises, making the platform more likely to recover operator relationships and constrain further research.
  limitations:
    paragraphs:
    - zh: 隐私保护、共享设备和合法假名会限制确定性归因，处置结果应保持置信度并提供申诉机制。
      en: Privacy protections, shared devices, and legitimate pseudonymity limit deterministic attribution, so enforcement outcomes should preserve confidence levels and provide appeal mechanisms.
evidence_refs: [REF-000050, REF-000051, REF-000052]
