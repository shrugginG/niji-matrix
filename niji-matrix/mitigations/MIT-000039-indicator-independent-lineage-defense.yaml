schema_version: 2.0.0
type: mitigation
id: MIT-000039
name:
  zh: 指标无关检测与恶意资源谱系防御
  en: Indicator-Independent Detection and Malicious-Resource Lineage Defense
summary:
  zh: 以行为和跨实体谱系补充原子指标与历史声誉，降低反馈驱动轮换和清洁资源门控的规避收益。
  en: Supplement atomic indicators and historical reputation with behavior and cross-entity lineage to reduce the evasion benefit of feedback-driven rotation and clean-resource gating.
description:
  paragraphs:
  - zh: 本缓解避免把防守覆盖绑定到单个哈希、域名、IP、文件名或即时声誉，持续关联代码、证书、注册、托管、协议行为、目标谱和时间关系，并以行为级检测覆盖新实体。威胁情报发布和平台共享应保留足够谱系证据，使被轮换的指标仍能连接到同一行动，同时避免不必要暴露高敏感内部检测细节。
    en: This mitigation avoids binding defensive coverage to one hash, domain, IP, filename, or point-in-time reputation by continuously correlating code, certificates, registration, hosting, protocol behavior, targeting, and temporal relationships and covering new entities with behavioral detection. Threat-intelligence publication and provider sharing should retain enough lineage evidence to connect rotated indicators to one operation while avoiding unnecessary exposure of highly sensitive internal detection detail.
domains: [enterprise]
measures:
- key: behavior-first-detection
  name:
    zh: 行为优先检测
    en: Behavior-First Detection
  description:
    paragraphs:
    - zh: 将原子 IOC 作为上下文而非唯一判定，使用协议序列、身份行为、资源用途、目标模式和跨阶段活动建立对特征变化更稳健的检测。
      en: Treat atomic IOCs as context rather than the sole decision rule and use protocol sequences, identity behavior, resource purpose, targeting patterns, and cross-stage activity for detection resilient to feature changes.
  control_type: detective-support
- key: malicious-resource-lineage-graph
  name:
    zh: 恶意资源谱系图
    en: Malicious-Resource Lineage Graph
  description:
    paragraphs:
    - zh: 关联新旧文件与基础设施之间的代码、证书、注册、托管、内容、行为、目标和时间关系，并保留被退役对象作为历史节点。
      en: Correlate code, certificate, registration, hosting, content, behavior, targeting, and temporal relationships across old and new files or infrastructure and retain retired objects as historical nodes.
  control_type: detective-support
- key: feedback-resilient-intelligence-sharing
  name:
    zh: 面向反馈规避的情报共享
    en: Feedback-Evasion-Resilient Intelligence Sharing
  description:
    paragraphs:
    - zh: 在法律和运营边界内共享行为、谱系与置信度，而不只共享短寿命原子指标，并协调提供方观察轮换与候选资源自查。
      en: Within legal and operational boundaries, share behavior, lineage, and confidence rather than only short-lived atomic indicators and coordinate provider observation of rotation and candidate-resource self-checking.
  control_type: governance
applications:
- target_ref: NJT-0039
  use:
    paragraphs:
    - zh: 对搜索威胁厂商数据，应假定攻击者可能读取公开指标与声誉，并把防守重点从隐藏报告转向行为覆盖、谱系保留和跨提供方快速关联。
      en: For Search Threat Vendor Data, assume adversaries may read public indicators and reputation and shift defense from concealing reports toward behavioral coverage, lineage retention, and rapid cross-provider correlation.
  expected_effect:
    paragraphs:
    - zh: 攻击者仍能获得防守反馈，但替换单个指标或选择暂未标恶资源不再足以脱离现有检测与调查关系。
      en: The adversary can still obtain defensive feedback, but replacing an individual indicator or selecting a resource not yet flagged is no longer sufficient to escape existing detection and investigative relationships.
  limitations:
    paragraphs:
    - zh: 行为和谱系分析需要长期、多域数据并产生更高计算与人工成本；过度公开检测细节仍可能帮助攻击者调整。
      en: Behavioral and lineage analysis requires long-term multidomain data with greater computational and analyst cost, while excessive disclosure of detection detail can still aid adversary adaptation.
- target_ref: NJS-0039-001
  use:
    paragraphs:
    - zh: 对威胁暴露触发的可观测特征轮换，应保留旧指标并自动搜索新实体与旧实体共享的代码、证书、托管、行为和目标谱系，以行为规则覆盖过渡期。
      en: For Threat-Exposure-Triggered Observable Rotation, retain old indicators and automatically search for code, certificate, hosting, behavioral, and targeting lineage shared by new and old entities, using behavioral rules to cover the transition.
  expected_effect:
    paragraphs:
    - zh: 新哈希、域名、IP 或文件名仍可能避开精确匹配，但其与旧行动的多维关系更快被恢复，缩短轮换收益窗口。
      en: New hashes, domains, IPs, or filenames may evade exact matches, but their multidimensional relationship to the old operation is recovered faster, shortening the benefit window of rotation.
  limitations:
    paragraphs:
    - zh: 攻击者若同时改变代码、基础设施、证书、行为和目标，谱系可能断裂；不同合法资源共享托管也会增加误关联风险。
      en: Lineage may break when an adversary changes code, infrastructure, certificates, behavior, and targets together, while shared legitimate hosting increases false-link risk.
- target_ref: NJS-0039-002
  use:
    paragraphs:
    - zh: 对威胁声誉门控的基础设施选择，应在初始声誉为空时仍根据注册、托管、证书、内容部署和行为上下文评估新资源，并持续更新风险。
      en: For Threat-Reputation-Gated Infrastructure Selection, evaluate new resources from registration, hosting, certificate, content-deployment, and behavioral context even when initial reputation is empty and update risk continuously.
  expected_effect:
    paragraphs:
    - zh: 干净或未知历史不再等同于低风险，攻击者通过部署前筛掉已标恶资源获得的早期信任优势下降。
      en: Clean or unknown history no longer equals low risk, reducing the early trust advantage gained by screening out already flagged resources before deployment.
  limitations:
    paragraphs:
    - zh: 新建合法资源同样缺少历史，严格控制会影响正常业务；低信号基础设施在首次行为前仍可能不可区分。
      en: Newly created legitimate resources also lack history, aggressive controls can impair normal business, and low-signal infrastructure may remain indistinguishable before first use.
evidence_refs: [REF-000053, REF-000054, REF-000055]
