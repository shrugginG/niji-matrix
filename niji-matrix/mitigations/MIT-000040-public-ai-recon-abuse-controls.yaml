schema_version: 2.0.0
type: mitigation
id: MIT-000040
name:
  zh: 公共 AI 目标侦查滥用监控与处置
  en: Public-AI Target-Reconnaissance Abuse Monitoring and Enforcement
summary:
  zh: 通过服务商交互审计、目标化综合检测、账户关联和分级处置，提高公共 AI 中介侦查的成本与可见性。
  en: Increase the cost and visibility of public-AI-mediated reconnaissance through provider interaction audit, targeted-synthesis detection, account linkage, and graduated enforcement.
description:
  paragraphs:
  - zh: 本缓解由公共 AI 服务商实施，保留与政策允许范围相称的账户、提示、响应、分类器和工具调用审计，识别围绕具体人员或组织的规模化实体补齐、目标列表、关系推断与攻击面排序，并将账户关系和后续滥用纳入处置。控制必须区分合法研究与恶意目标开发，并满足隐私、合同、数据保留和申诉要求。
    en: This mitigation is implemented by public-AI providers and retains account, prompt, response, classifier, and tool-invocation audit proportionate to policy, identifies scaled entity completion, target lists, relationship inference, and attack-surface prioritization around specific people or organizations, and incorporates account relationships and downstream abuse into enforcement. Controls must distinguish legitimate research from malicious target development and satisfy privacy, contractual, retention, and appeal requirements.
domains: [enterprise]
measures:
- key: interaction-and-tool-audit
  name:
    zh: 交互与工具调用审计
    en: Interaction and Tool-Invocation Audit
  description:
    paragraphs:
    - zh: 按服务政策记录账户、会话、提示、响应、分类器标签、检索查询、访问目的地和结果标识，并保护日志免受普通用户修改。
      en: Record account, session, prompt, response, classifier labels, retrieval queries, accessed destinations, and result identifiers according to service policy and protect logs from ordinary user modification.
  control_type: detective-support
- key: targeted-recon-risk-model
  name:
    zh: 目标化侦查风险模型
    en: Targeted-Reconnaissance Risk Model
  description:
    paragraphs:
    - zh: 结合目标实体集中度、跨源综合、敏感属性、查询规模、账户关系和后续用途识别目标开发，同时避免仅凭安全术语或公开研究主题判定恶意。
      en: Combine target-entity concentration, cross-source synthesis, sensitive attributes, query scale, account relationships, and downstream purpose to identify target development without treating security terminology or public research topics alone as malicious.
  control_type: detective-support
- key: graduated-ai-abuse-enforcement
  name:
    zh: 公共 AI 滥用分级处置与共享
    en: Graduated Public-AI Abuse Enforcement and Sharing
  description:
    paragraphs:
    - zh: 对高风险账户实施限制、增强验证、工具禁用、证据保存、账户终止和可信生态共享，并为合法用户提供复核与申诉路径。
      en: Apply limits, enhanced verification, tool disablement, evidence preservation, account termination, and trusted ecosystem sharing to high-risk accounts while providing review and appeal paths for legitimate users.
  control_type: containment
applications:
- target_ref: NJT-0040
  use:
    paragraphs:
    - zh: 对公共 AI 中介侦查，服务商应关联同一账户和相关账户的目标研究、跨源综合、检索工具调用和后续策略命中，并在确认恶意目标开发时限制或终止服务。
      en: For Public-AI-Mediated Reconnaissance, providers should correlate target research, cross-source synthesis, retrieval-tool calls, and downstream policy hits across an account and related accounts and restrict or terminate service when malicious target development is confirmed.
  expected_effect:
    paragraphs:
    - zh: 受害者侧仍可能缺少直接日志，但服务商集中观察面能够提高查询替代活动的发现率，并增加攻击者维持账户、会话和工具访问的成本。
      en: Victim-side direct logs may remain absent, but the provider's concentrated vantage can improve detection of query-substitution activity and raise the cost of maintaining accounts, sessions, and tool access.
  limitations:
    paragraphs:
    - zh: 不同服务保留能力和政策不同，模型内容具有语境歧义，攻击者也可转向多个账户、服务或本地模型；处置不能消除公开信息本身。
      en: Services differ in retention capability and policy, model content is contextually ambiguous, and adversaries can move across accounts, services, or local models; enforcement cannot remove the underlying public information.
- target_ref: NJS-0040-001
  use:
    paragraphs:
    - zh: 对 AI 中介的目标外查询替代，应检测服务商工具代为访问多个来源、提示持续补齐同一目标实体以及用户直接消费新综合输出的序列，并限制异常检索范围或频率。
      en: For AI-Mediated Off-Victim Query Substitution, detect sequences where provider tools access multiple sources, prompts repeatedly complete the same target entity, and the user directly consumes newly synthesized output, then constrain anomalous retrieval scope or frequency.
  expected_effect:
    paragraphs:
    - zh: 攻击者减少原始来源访问的行为在服务商侧形成更清晰的提示与工具调用图，完全隔离实际消费者的难度上升。
      en: Behavior reducing original-source visits forms a clearer provider-side prompt and tool-invocation graph, making complete separation of the actual consumer more difficult.
  limitations:
    paragraphs:
    - zh: 模型知识直接回答时可能没有实时工具调用，合法深度研究也会产生跨源综合；仅凭提示内容不能可靠证明恶意或查询替代。
      en: Direct answers from model knowledge may have no live tool call, and legitimate deep research also creates cross-source synthesis; prompt content alone cannot reliably prove maliciousness or query substitution.
