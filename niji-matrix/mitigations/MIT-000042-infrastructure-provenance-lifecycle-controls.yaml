schema_version: 2.0.0
type: mitigation
id: MIT-000042
name:
  zh: 取得型基础设施的租户、来源与生命周期控制
  en: Acquired-Infrastructure Tenant, Provenance, and Lifecycle Controls
summary:
  zh: 通过租户对象级治理、长期生命周期分析和跨资源谱系保留，降低共享信任借用、预用老化和预置替换池的隐蔽价值。
  en: Reduce the stealth value of shared-trust borrowing, pre-use aging, and prepositioned replacement pools through tenant-object governance, long-horizon lifecycle analysis, and cross-resource
    lineage retention.
description:
  paragraphs:
  - zh: 本缓解要求基础设施提供方、注册与证书生态、资产所有者和受害组织保留从资源取得到启用、替换和退役的可审计关系。控制应把知名域、证书、ASN 和供应商信誉下钻到租户、项目、对象、注册者和行为层，同时识别长期低活动后的跃迁并保留跨注册商与供应商的共同谱系，使合法外层特征和单点快速轮换不能替代具体资源验证。
    en: This mitigation requires infrastructure providers, registration and certificate ecosystems, asset owners, and victim organizations to retain auditable relationships from resource
      acquisition through activation, replacement, and retirement. Controls should resolve well-known domains, certificates, ASNs, and provider reputation to tenant, project, object,
      registrant, and behavior layers, identify transitions after prolonged low activity, and preserve shared lineage across registrars and providers so legitimate outer features and
      rapid point-resource rotation cannot substitute for concrete resource validation.
domains:
- enterprise
measures:
- key: tenant-object-provenance
  name:
    zh: 租户与对象级来源治理
    en: Tenant- and Object-Level Provenance Governance
  description:
    paragraphs:
    - zh: 为共享云、Web、营销、广告和无服务器服务保留注册、租户、账单、项目、对象、证书与配置审计，并支持按具体租户和对象暂停、调查与下架，而不是永久信任或整体阻断供应商外层。
      en: Retain registration, tenant, billing, project, object, certificate, and configuration audit for shared cloud, Web, marketing, advertising, and serverless services and support
        suspension, investigation, and removal at concrete tenant and object scope rather than permanently trusting or blocking the provider surface wholesale.
  control_type: governance
- key: dormant-to-active-lifecycle-monitoring
  name:
    zh: 休眠到活跃生命周期监测
    en: Dormant-to-Active Lifecycle Monitoring
  description:
    paragraphs:
    - zh: 长期保留 DNS、证书、托管和服务流量历史，识别资源在长期低活动后突然启用的跃迁，并以当前对象、目标和行为重新评估信誉，不把域龄本身视为信任。
      en: Retain long-term DNS, certificate, hosting, and service-traffic history, identify resources that activate suddenly after prolonged low activity, and reassess reputation from
        current objects, targets, and behavior rather than treating domain age itself as trust.
  control_type: detective-support
- key: replacement-pool-lineage
  name:
    zh: 替换资源池谱系保留
    en: Replacement-Pool Lineage Retention
  description:
    paragraphs:
    - zh: 跨注册商和供应商关联成组注册、证书、命名、托管、对象与目标顺序，并在一个资源确认恶意后扩展到同谱系的未启用替补项进行验证和有依据处置。
      en: Correlate grouped registration, certificates, naming, hosting, objects, and target order across registrars and providers and, after one resource is confirmed malicious, extend
        validation and evidence-based response to inactive replacements in the same lineage.
  control_type: detective-support
applications:
- target_ref: NJT-0051
  use:
    paragraphs:
    - zh: 对通过购买、租用、注册或申请取得的行动基础设施建立从注册者和租户到对象及后续用途的来源与生命周期图，并要求共享服务信誉只在具体对象验证后才能影响放行。
      en: Build provenance and lifecycle graphs from registrant and tenant through objects and downstream use for infrastructure acquired by purchase, lease, registration, or provisioning,
        and allow shared-service reputation to affect trust only after concrete object validation.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以仅凭合法取得方式、供应商外层或资源年龄获得持久信任，取得阶段留下的控制平面与生命周期关系成为可检测和可处置证据。
      en: Adversaries have greater difficulty gaining durable trust solely from a legitimate acquisition method, provider surface, or resource age, while acquisition-stage control-plane
        and lifecycle relationships become detectable and actionable evidence.
  limitations:
    paragraphs:
    - zh: 隐私、司法辖区和供应商数据访问限制会阻止跨组织谱系，资源也可能在首次使用前完全静默；控制不能把所有新租户或匿名注册等同于恶意。
      en: Privacy, jurisdiction, and provider-data access limits impede cross-organizational lineage, and resources may remain wholly silent before first use; controls cannot equate
        every new tenant or anonymous registration with maliciousness.
- target_ref: NJS-0051-001
  use:
    paragraphs:
    - zh: 将共享域、证书和 ASN 下钻到具体租户、项目、对象与行为，要求高风险重定向、托管或投放对象接受内容、创建者和后续用途验证，并由提供方保留控制平面证据。
      en: Resolve shared domains, certificates, and ASNs to concrete tenants, projects, objects, and behavior; validate content, creator, and downstream use for high-risk redirect, hosting,
        or delivery objects; and require providers to retain control-plane evidence.
  expected_effect:
    paragraphs:
    - zh: 合法供应商的高良性背景不再自动遮盖恶意租户，受害方可以避免整体阻断服务的同时提高对象级区分能力。
      en: A legitimate provider's large benign background no longer automatically masks malicious tenants, allowing victims to improve object-level discrimination without blocking the
        entire service.
  limitations:
    paragraphs:
    - zh: 端到端加密、租户隐私和一次性对象会限制检查，受害组织也可能无法获得提供方内部标识；供应商外层仍会对本地粗粒度设备形成盲点。
      en: End-to-end encryption, tenant privacy, and one-time objects limit inspection, and victim organizations may not obtain provider-internal identifiers; the provider surface may
        remain a blind spot for coarse local devices.
- target_ref: NJS-0051-002
  use:
    paragraphs:
    - zh: 对长期低活动域名、证书、云项目和服务器在首次显著启用时重新评分，比较启用前后 DNS、托管、流量、对象和目标变化，并在业务上不需要时周期清理闲置资源。
      en: Rescore long-low-activity domains, certificates, cloud projects, and servers at first material activation, compare DNS, hosting, traffic, object, and target changes across
        activation, and periodically remove idle resources where business does not require them.
  expected_effect:
    paragraphs:
    - zh: 域龄和注册时间不能直接转化为信任，恶意资源从休眠到活跃的跃迁成为更强信号，长期持有成本也会上升。
      en: Domain age and registration time cannot directly become trust, the transition from dormancy to malicious activity becomes a stronger signal, and long-term holding cost increases.
  limitations:
    paragraphs:
    - zh: 灾备、季节性业务、品牌保护和预发布资源也会长期静默后启用，必须结合对象与用途避免误报；合法长期持有本身无法被禁止。
      en: Disaster recovery, seasonal business, brand protection, and prerelease resources also activate after long silence and require object and purpose context to avoid false positives;
        legitimate long-term holding cannot itself be prohibited.
- target_ref: NJS-0051-003
  use:
    paragraphs:
    - zh: 在一个资源确认恶意后，使用注册、证书、命名、托管、对象和目标关系搜索同组替补，并在其启用前进行验证、风险限制或有证据的暂停，同时保留跨供应商时间线。
      en: After one resource is confirmed malicious, use registration, certificate, naming, hosting, object, and target relationships to find grouped replacements and validate, risk-limit,
        or evidence-based suspend them before activation while retaining a cross-provider timeline.
  expected_effect:
    paragraphs:
    - zh: 单点轮换不再立即切断防守认知，预置资源池中的共同工件可以提前暴露替补，攻击者需要更强分舱和更高持有成本。
      en: Point-resource rotation no longer immediately resets defender knowledge, shared artifacts can expose replacements in a prepositioned pool before activation, and the adversary
        needs stronger compartmentation and higher holding cost.
  limitations:
    paragraphs:
    - zh: 完全独立注册、付款、证书、托管和内容的替补项可能没有可见共同关系，过度扩展同群处置也会影响共享供应商中的合法租户。
      en: Replacements with fully independent registration, payment, certificates, hosting, and content may expose no visible common relationship, while overbroad cohort response can
        affect legitimate tenants at shared providers.
- target_ref: NJS-0049-001
  use:
    paragraphs:
    - zh: 将共享域、证书、ASN 和协议下钻到投放租户、对象、上传者与后续取用，要求高风险对象接受内容、创建来源和端点结果验证，并由提供方保留上传与配置证据。
      en: Resolve shared domains, certificates, ASNs, and protocols to the staging tenant, object, uploader, and downstream retrieval; validate content, creation provenance, and endpoint
        outcomes for high-risk objects and require providers to retain upload and configuration evidence.
  expected_effect:
    paragraphs:
    - zh: 合法服务外层不再自动遮盖恶意投放对象，受害方可以在不整体阻断服务的情况下提高对象级区分力，提供方控制平面也可恢复准备谱系。
      en: A legitimate service surface no longer automatically masks malicious staged objects, victims gain object-level discrimination without blocking the service wholesale, and provider
        control-plane records can recover preparation lineage.
  limitations:
    paragraphs:
    - zh: 端到端加密、一次性对象、租户隐私和无法获得提供方内部标识会限制验证；供应商外层仍可能对只记录域或 ASN 的本地设备形成盲点。
      en: End-to-end encryption, one-time objects, tenant privacy, and unavailable provider identifiers limit validation; the provider surface may remain a blind spot for local devices
        recording only domains or ASNs.
