schema_version: "2.0.0"
type: mitigation
id: MIT-000043
name:
  zh: 被接管账户的会话与历史内容完整性控制
  en: Taken-Over Account Session and Historical-Content Integrity Controls
summary:
  zh: 通过抗钓鱼认证、会话持续评估、历史内容最小权限和对象级审计，降低真实账户与关系历史被用于隐蔽准备的价值。
  en: Reduce the value of authentic accounts and relationship history for covert preparation through phishing-resistant authentication, continuous session evaluation, least-privilege historical access, and object-level audit.
description:
  paragraphs:
    - zh: 本缓解把账户安全从登录时的一次性认证扩展到令牌、设备、恢复属性、历史内容访问和对外用途的持续完整性。组织与服务提供方应能撤销可疑会话、限制敏感历史对象的批量检索、保留对象级访问证据，并在真实账户用途发生突变时要求重新验证，从而削弱攻击者仅凭既有身份、域和关系获得的信任。
      en: This mitigation extends account security from one-time sign-in authentication to continuous integrity across tokens, devices, recovery attributes, historical-content access, and outward use. Organizations and service providers should revoke suspicious sessions, restrict bulk retrieval of sensitive historical objects, retain object-level access evidence, and require re-verification when a genuine account's purpose changes abruptly, reducing trust gained solely from existing identity, domain, and relationships.
domains:
  - enterprise
measures:
  - key: continuous-session-integrity
    name:
      zh: 持续会话与令牌完整性
      en: Continuous Session and Token Integrity
    description:
      paragraphs:
        - zh: 部署抗钓鱼认证、令牌与设备绑定、异常会话持续评估、快速令牌撤销和恢复属性变更保护，并把高风险内容访问纳入重新认证条件。
          en: Deploy phishing-resistant authentication, token and device binding, continuous evaluation of anomalous sessions, rapid token revocation, and protection of recovery-attribute changes, and include high-risk content access among reauthentication conditions.
    control_type: preventive
  - key: historical-content-governance
    name:
      zh: 历史内容最小权限与对象级审计
      en: Least-Privilege Historical Content and Object-Level Audit
    description:
      paragraphs:
        - zh: 限制财务邮件、联系人、共享文件和长期线程的批量搜索与导出，记录搜索、读取、下载和规则变更所对应的账户、会话与对象，并为异常集中访问建立响应流程。
          en: Limit bulk search and export of finance mail, contacts, shared files, and long-lived threads; record the account, session, and object for search, read, download, and rule changes; and establish response procedures for anomalous concentrated access.
    control_type: exposure-reduction
applications:
  - target_ref: NJT-0043
    use:
      paragraphs:
        - zh: 对既有账户实施会话持续评估、历史内容分级授权与完整性变化监测，并在接管迹象出现时撤销令牌、恢复安全设置和调查准备窗口内的对象访问。
          en: Apply continuous session evaluation, tiered authorization for historical content, and account-integrity monitoring to existing accounts; when takeover indicators appear, revoke tokens, restore secure settings, and investigate object access during the preparation window.
    expected_effect:
      paragraphs:
        - zh: 被接管账户即使保留真实域、年龄与关系，也更难长期维持原用户会话外观，准备痕迹会更早进入身份和内容审计视野。
          en: Even when a taken-over account retains authentic domain, age, and relationships, it becomes harder to preserve the original user's session appearance, and preparation traces enter identity and content audit earlier.
    limitations:
      paragraphs:
        - zh: 原用户设备被同时控制、服务缺少细粒度审计或共享账户缺少稳定个人基线时，控制无法确定操作者身份；严格限制历史访问也会增加合法协作成本。
          en: Controls cannot determine operator identity when the original device is also controlled, the service lacks fine-grained audit, or a shared account has no stable individual baseline; strict limits on historical access also increase legitimate collaboration cost.
  - target_ref: NJS-0043-001
    use:
      paragraphs:
        - zh: 对异常会话后的财务、联系人、附件、文件和既有线程搜索实施对象级记录、速率与导出限制，并在这些检索与新收件人或高风险外部操作相连时触发重新验证。
          en: Apply object-level recording, rate and export limits to searches of finance material, contacts, attachments, files, and existing threads after anomalous sessions, and require re-verification when those searches connect to new recipients or high-risk external actions.
    expected_effect:
      paragraphs:
        - zh: 攻击者更难在首次对外行动前无声选择真实关系情境，历史检索与后续用途之间会留下可关联的准备证据。
          en: The adversary has greater difficulty silently selecting genuine relationship context before first outward action, and preparation evidence remains linkable between history access and later use.
    limitations:
      paragraphs:
        - zh: 合法用户和自动化同样会检索历史内容，且端到端加密、客户端缓存或短保留期会削弱对象级可见性，因此该控制必须结合会话与用途信号。
          en: Legitimate users and automation also retrieve history, while end-to-end encryption, client caching, or short retention weakens object-level visibility, so this control must be combined with session and purpose signals.
