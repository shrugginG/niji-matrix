schema_version: 2.0.0
type: mitigation
id: MIT-000044
name:
  zh: 能力构建、签名与供应谱系治理
  en: Capability Build, Signing, and Supply-Lineage Governance
summary:
  zh: 在多个真实和分析环境验证能力行为，保留构建、代码族、配置、签名、发行者、供应商与客户谱系；把有效签名和合法工具名作为信号而非信任结论。
  en: Validate capability behavior across multiple realistic and analytic environments; preserve build, code-family, configuration, signature, publisher, provider, and customer lineage;
    and treat valid signatures and legitimate tool names as signals rather than trust verdicts.
description:
  paragraphs:
  - zh: 在多个真实和分析环境验证能力行为，保留构建、代码族、配置、签名、发行者、供应商与客户谱系；把有效签名和合法工具名作为信号而非信任结论。 本缓解将可复用控制动作与逐技术应用分开，使相同措施能够在保持边界的同时降低资源准备阶段的匿迹价值。
    en: Validate capability behavior across multiple realistic and analytic environments; preserve build, code-family, configuration, signature, publisher, provider, and customer lineage;
      and treat valid signatures and legitimate tool names as signals rather than trust verdicts. This mitigation separates reusable control actions from per-technique applications so
      the same measures can reduce preparation-stage stealth value while preserving subject boundaries.
domains:
- enterprise
measures:
- key: capability-lineage-governance
  name:
    zh: 能力行为与供应谱系验证
    en: Capability Behavior and Supply-Lineage Validation
  description:
    paragraphs:
    - zh: 在多个真实和分析环境验证能力行为，保留构建、代码族、配置、签名、发行者、供应商与客户谱系；把有效签名和合法工具名作为信号而非信任结论。
      en: Validate capability behavior across multiple realistic and analytic environments; preserve build, code-family, configuration, signature, publisher, provider, and customer lineage;
        and treat valid signatures and legitimate tool names as signals rather than trust verdicts.
  control_type: governance
applications:
- target_ref: NJT-0045
  use:
    paragraphs:
    - zh: 针对开发匿迹型能力，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Develop Stealth-Oriented Capabilities, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content,
        tenant, or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 开发匿迹型能力用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Develop Stealth-Oriented Capabilities to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships
        become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有开发匿迹型能力实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Develop Stealth-Oriented Capabilities, and privacy, cross-organizational data access, encryption, short retention, and legitimate
        lookalikes limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
