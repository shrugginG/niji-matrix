    - zh: 目标情境约束的内容拟态用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Target-Context-Constrained Content Camouflage to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle
        relationships become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有目标情境约束的内容拟态实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Target-Context-Constrained Content Camouflage, and privacy, cross-organizational data access, encryption, short retention, and
        legitimate lookalikes limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
