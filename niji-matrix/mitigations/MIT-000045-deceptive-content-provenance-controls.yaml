schema_version: 2.0.0
type: mitigation
id: MIT-000045
name:
  zh: 欺骗内容来源与人物设定治理
  en: Deceptive-Content Provenance and Persona Governance
summary:
  zh: 平台在合法范围保留最小必要的生成与处置元数据，关联人物、目标和跨模态资产；接收方通过独立渠道核验身份、关系和业务授权，不以语言流畅、头像一致或域认证作为充分信任。
  en: Platforms retain minimum necessary generation and enforcement metadata within lawful bounds and correlate personas, targets, and cross-modal assets; recipients independently verify
    identity, relationship, and business authorization rather than trusting fluent language, coherent imagery, or domain authentication alone.
description:
  paragraphs:
  - zh: 平台在合法范围保留最小必要的生成与处置元数据，关联人物、目标和跨模态资产；接收方通过独立渠道核验身份、关系和业务授权，不以语言流畅、头像一致或域认证作为充分信任。 本缓解将可复用控制动作与逐技术应用分开，使相同措施能够在保持边界的同时降低资源准备阶段的匿迹价值。
    en: Platforms retain minimum necessary generation and enforcement metadata within lawful bounds and correlate personas, targets, and cross-modal assets; recipients independently
      verify identity, relationship, and business authorization rather than trusting fluent language, coherent imagery, or domain authentication alone. This mitigation separates reusable
      control actions from per-technique applications so the same measures can reduce preparation-stage stealth value while preserving subject boundaries.
domains:
- enterprise
measures:
- key: content-persona-provenance
  name:
    zh: 内容来源与人物授权核验
    en: Content Provenance and Persona Authorization Verification
  description:
    paragraphs:
    - zh: 平台在合法范围保留最小必要的生成与处置元数据，关联人物、目标和跨模态资产；接收方通过独立渠道核验身份、关系和业务授权，不以语言流畅、头像一致或域认证作为充分信任。
      en: Platforms retain minimum necessary generation and enforcement metadata within lawful bounds and correlate personas, targets, and cross-modal assets; recipients independently
        verify identity, relationship, and business authorization rather than trusting fluent language, coherent imagery, or domain authentication alone.
  control_type: governance
applications:
- target_ref: NJT-0047
  use:
    paragraphs:
    - zh: 针对生成欺骗性内容资产，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Generate Deceptive Content Assets, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content, tenant,
        or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 生成欺骗性内容资产用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Generate Deceptive Content Assets to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships
        become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有生成欺骗性内容资产实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Generate Deceptive Content Assets, and privacy, cross-organizational data access, encryption, short retention, and legitimate
        lookalikes limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
- target_ref: NJS-0047-001
  use:
    paragraphs:
    - zh: 针对目标情境约束的内容拟态，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Target-Context-Constrained Content Camouflage, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build,
        content, tenant, or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
