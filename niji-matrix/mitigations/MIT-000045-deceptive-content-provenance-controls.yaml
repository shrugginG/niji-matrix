    - zh: 针对跨表面人物设定连续性，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Cross-Surface Persona-Legend Continuity, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content,
        tenant, or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
