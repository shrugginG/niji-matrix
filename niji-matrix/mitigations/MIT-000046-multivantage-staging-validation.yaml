schema_version: 2.0.0
type: mitigation
id: MIT-000046
name:
  zh: 多视角投放验证与条件规则治理
  en: Multi-Vantage Staging Validation and Conditional-Rule Governance
summary:
  zh: 广告、云和 Web 服务商对重定向、设备/地域/会话条件及短时策略变更实施审计，从授权多视点复现内容；对高风险差分响应限制发布、隔离租户并保留证据。
  en: Advertising, cloud, and Web providers audit redirects, device/geography/session conditions, and short-lived policy changes and reproduce content from authorized multiple vantages;
    restrict publication, isolate tenants, and preserve evidence for high-risk differential responses.
description:
  paragraphs:
  - zh: 广告、云和 Web 服务商对重定向、设备/地域/会话条件及短时策略变更实施审计，从授权多视点复现内容；对高风险差分响应限制发布、隔离租户并保留证据。 本缓解将可复用控制动作与逐技术应用分开，使相同措施能够在保持边界的同时降低资源准备阶段的匿迹价值。
    en: Advertising, cloud, and Web providers audit redirects, device/geography/session conditions, and short-lived policy changes and reproduce content from authorized multiple vantages;
      restrict publication, isolate tenants, and preserve evidence for high-risk differential responses. This mitigation separates reusable control actions from per-technique applications
      so the same measures can reduce preparation-stage stealth value while preserving subject boundaries.
domains:
- enterprise
measures:
- key: multivantage-conditional-validation
  name:
    zh: 多视角响应与条件规则验证
    en: Multi-Vantage Response and Conditional-Rule Validation
  description:
    paragraphs:
    - zh: 广告、云和 Web 服务商对重定向、设备/地域/会话条件及短时策略变更实施审计，从授权多视点复现内容；对高风险差分响应限制发布、隔离租户并保留证据。
      en: Advertising, cloud, and Web providers audit redirects, device/geography/session conditions, and short-lived policy changes and reproduce content from authorized multiple vantages;
        restrict publication, isolate tenants, and preserve evidence for high-risk differential responses.
  control_type: governance
applications:
- target_ref: NJT-0049
  use:
    paragraphs:
    - zh: 针对匿迹型能力投放，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Stealth-Oriented Capability Staging, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content,
        tenant, or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 匿迹型能力投放用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Stealth-Oriented Capability Staging to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships
        become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有匿迹型能力投放实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Stealth-Oriented Capability Staging, and privacy, cross-organizational data access, encryption, short retention, and legitimate
        lookalikes limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
- target_ref: NJS-0049-002
  use:
    paragraphs:
    - zh: 针对条件门控投放，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Context-Gated Staging, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content, tenant, or conditional-rule
        level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 条件门控投放用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Context-Gated Staging to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships become
        easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有条件门控投放实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Context-Gated Staging, and privacy, cross-organizational data access, encryption, short retention, and legitimate lookalikes
        limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
