schema_version: "2.0.0"
type: mitigation
id: MIT-000047
name:
  zh: 已取得访问权的暴露响应与入口失效
  en: Acquired-Access Exposure Response and Foothold Invalidation
summary:
  zh: 将外部访问暴露快速映射到内部身份与资产，并通过会话撤销、入口修复、监控补齐和长期复核降低已售访问权的持续价值。
  en: Rapidly map external access exposure to internal identities and assets and reduce the continuing value of sold access through session revocation, foothold remediation, monitoring deployment, and long-horizon review.
description:
  paragraphs:
    - zh: 本缓解把经纪市场、伙伴、凭据泄露和执法情报作为内部入口处置的触发源。组织应持续维护外部暴露到身份、远程服务和资产的映射，验证后撤销令牌与会话、轮换凭据、修补或移除入口、隔离受影响资产，并补齐卖方可能利用的监控缺口；长期历史必须覆盖入口囤积与延迟再激活。
      en: This mitigation uses broker-market, partner, credential-exposure, and law-enforcement intelligence as triggers for internal foothold response. Organizations should continuously map external exposure to identities, remote services, and assets and, after validation, revoke tokens and sessions, rotate credentials, patch or remove footholds, isolate affected assets, and close monitoring gaps that a seller may have exploited; long-term history must cover access stockpiling and delayed reactivation.
domains:
  - enterprise
measures:
  - key: external-access-exposure-mapping
    name:
      zh: 外部访问暴露映射
      en: External Access Exposure Mapping
    description:
      paragraphs:
        - zh: 监测公开与授权可得的访问经纪、凭据泄露、伙伴和执法情报，将组织、域、账户、设备、远程入口和权限声明解析到内部资产与身份所有者，并记录验证结果。
          en: Monitor publicly and lawfully available access-broker, credential-exposure, partner, and law-enforcement intelligence; resolve organization, domain, account, device, remote foothold, and privilege assertions to internal asset and identity owners; and record validation results.
    control_type: detective-support
  - key: rapid-foothold-invalidation
    name:
      zh: 会话撤销与入口快速失效
      en: Session Revocation and Rapid Foothold Invalidation
    description:
      paragraphs:
        - zh: 对已验证暴露撤销令牌、Cookie 和活动会话，轮换凭据与密钥，修补或移除后门和远程服务入口，隔离相关设备并调查首次使用前后的活动。
          en: For validated exposure, revoke tokens, cookies, and active sessions; rotate credentials and keys; patch or remove backdoors and remote-service footholds; isolate related devices; and investigate activity around first use.
    control_type: containment
  - key: monitoring-gap-closure-and-retention
    name:
      zh: 监控缺口补齐与长期留存
      en: Monitoring-Gap Closure and Long-Term Retention
    description:
      paragraphs:
        - zh: 为高权限、远程访问和缺少 EDR 的资产补充身份、端点与网络遥测，保留入口完整性、令牌设备关系和首次使用历史，使长期囤积与休眠再激活仍可关联。
          en: Add identity, endpoint, and network telemetry for privileged, remotely accessible, or EDR-deficient assets and retain foothold integrity, token-device relationships, and first-use history so long-stockpiled and dormant access remains correlatable.
    control_type: detective-support
applications:
  - target_ref: NJT-0050
    use:
      paragraphs:
        - zh: 将外部访问情报解析到具体账户、资产和入口，验证后同时处置身份状态、远程入口与端点完整性，并回溯卖方形成入口到买方首次使用的时间线。
          en: Resolve external access intelligence to concrete accounts, assets, and footholds; after validation, remediate identity state, remote entry paths, and endpoint integrity together and reconstruct the timeline from seller-created access to buyer first use.
    expected_effect:
      paragraphs:
        - zh: 已经取得的入口更快失效，卖方与买方之间的观察断点缩小，攻击者难以把现成访问长期保留为低成本资源。
          en: Acquired footholds become invalid sooner, the observation gap between seller and buyer narrows, and adversaries have greater difficulty retaining ready-made access as a low-cost resource.
    limitations:
      paragraphs:
        - zh: 封闭交易可能完全不可见，经纪描述也可能错误；过度处置会中断合法远程运维，因此外部线索必须先由内部状态验证。
          en: Closed transactions may be wholly invisible and broker descriptions may be wrong; aggressive response can disrupt legitimate remote administration, so internal state must validate external leads.
  - target_ref: NJS-0050-001
    use:
      paragraphs:
        - zh: 根据外部暴露和资产清单优先为无 EDR、日志不足、高权限或高信任位置的入口补齐监控，并在补齐前限制远程访问与权限。
          en: Use external exposure and asset inventory to prioritize telemetry for footholds without EDR, with weak logging, high privilege, or valuable trust position, and restrict remote access and privilege until coverage is restored.
    expected_effect:
      paragraphs:
        - zh: 买方更难从已知监控盲点开始行动，首次使用会进入身份、端点或网络告警视野。
          en: The buyer has greater difficulty beginning activity in a known monitoring blind spot, and first use enters identity, endpoint, or network alerting scope.
    limitations:
      paragraphs:
        - zh: 无法部署端点代理的遗留、边缘或第三方资产仍可能保留盲点，补充网络日志也不一定揭示主机内操作。
          en: Legacy, edge, or third-party assets that cannot run endpoint agents may retain blind spots, and added network logs may still not reveal host-local actions.
  - target_ref: NJS-0050-002
    use:
      paragraphs:
        - zh: 保留入口形成、完整性告警、经纪情报和首次使用的长期谱系，并以组织、资产、账户、工具和时间连接卖方与买方阶段。
          en: Retain long-horizon lineage for foothold creation, integrity alerts, broker intelligence, and first use, joining seller and buyer stages by organization, asset, account, tool, and time.
    expected_effect:
      paragraphs:
        - zh: 不同操作者和工具仍会留下可连接的资源与时间关系，谱系分段对归因和事件重构的阻碍降低。
          en: Different operators and tools still leave connectable resource and temporal relationships, reducing the obstruction that lineage segmentation poses to attribution and incident reconstruction.
    limitations:
      paragraphs:
        - zh: 私下伙伴交付没有外部记录，跨司法辖区和跨组织共享限制也可能使卖方阶段永久缺失。
          en: Private partner handoff may have no external record, and jurisdictional or organizational sharing limits may leave the seller stage permanently unavailable.
  - target_ref: NJS-0050-003
    use:
      paragraphs:
        - zh: 对长期未使用但仍有效的远程入口、账户、后门和服务实施周期复核、密钥轮换、会话失效与完整性验证，并保留超过常见短窗口的历史。
          en: Periodically review, rotate keys for, invalidate sessions on, and verify integrity of long-unused but still-valid remote footholds, accounts, backdoors, and services, retaining history beyond common short windows.
    expected_effect:
      paragraphs:
        - zh: 休眠入口更可能在买方激活前失效，且长期静默后的再使用仍可连接到原始异常状态。
          en: Dormant footholds are more likely to expire before buyer activation, and reuse after prolonged silence remains connectable to the original anomalous state.
    limitations:
      paragraphs:
        - zh: 业务上必须长期保留的应急账户和设备可能无法频繁轮换，超过法定或成本允许的留存期后原始证据仍会丢失。
          en: Emergency accounts and devices that must remain valid for business may not tolerate frequent rotation, and original evidence still disappears once legal or affordable retention ends.
  - target_ref: NJS-0050-004
    use:
      paragraphs:
        - zh: 对令牌和 Cookie 实施设备与通道绑定、持续访问评估、异常重放识别和快速撤销，并在设备、来源或风险上下文变化时要求重新认证。
          en: Apply device and channel binding, continuous access evaluation, anomalous replay detection, and rapid revocation to tokens and cookies, requiring reauthentication when device, origin, or risk context changes.
    expected_effect:
      paragraphs:
        - zh: 买方难以仅凭已交付认证状态持续继承原用户外观，缺少新认证事件不再等于会话可信。
          en: A buyer has greater difficulty inheriting the original user's appearance solely through transferred authentication state, and absence of a new sign-in event no longer implies a trusted session.
    limitations:
      paragraphs:
        - zh: 真实设备或完整浏览器环境被同时控制时，绑定信号可能继续一致；严格重新认证也会增加正常用户摩擦。
          en: Binding signals may remain consistent when the genuine device or complete browser environment is also controlled, and strict reauthentication increases legitimate user friction.
