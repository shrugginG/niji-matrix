schema_version: 2.0.0
type: mitigation
id: MIT-000048
name:
  zh: 被攻陷基础设施完整性与出口池治理
  en: Compromised-Infrastructure Integrity and Egress-Pool Governance
summary:
  zh: 提供方和资产所有者对注册、租户、项目、证书、路由、对象上传与配置变化建立可审计控制，使用租户/对象/内容与行为信号而非仅按供应商域或 ASN 判定，并支持快速隔离与谱系保留。
  en: Providers and asset owners maintain auditable controls over registration, tenants, projects, certificates, routing, object uploads, and configuration changes; use tenant, object,
    content, and behavioral signals rather than provider domain or ASN alone; and support rapid isolation and lineage preservation.
description:
  paragraphs:
  - zh: 提供方和资产所有者对注册、租户、项目、证书、路由、对象上传与配置变化建立可审计控制，使用租户/对象/内容与行为信号而非仅按供应商域或 ASN 判定，并支持快速隔离与谱系保留。 本缓解将可复用控制动作与逐技术应用分开，使相同措施能够在保持边界的同时降低资源准备阶段的匿迹价值。
    en: Providers and asset owners maintain auditable controls over registration, tenants, projects, certificates, routing, object uploads, and configuration changes; use tenant, object,
      content, and behavioral signals rather than provider domain or ASN alone; and support rapid isolation and lineage preservation. This mitigation separates reusable control actions
      from per-technique applications so the same measures can reduce preparation-stage stealth value while preserving subject boundaries.
domains:
- enterprise
measures:
- key: asset-integrity-egress-lineage
  name:
    zh: 资产完整性与出口谱系控制
    en: Asset-Integrity and Egress-Lineage Controls
  description:
    paragraphs:
    - zh: 提供方和资产所有者对注册、租户、项目、证书、路由、对象上传与配置变化建立可审计控制，使用租户/对象/内容与行为信号而非仅按供应商域或 ASN 判定，并支持快速隔离与谱系保留。
      en: Providers and asset owners maintain auditable controls over registration, tenants, projects, certificates, routing, object uploads, and configuration changes; use tenant, object,
        content, and behavioral signals rather than provider domain or ASN alone; and support rapid isolation and lineage preservation.
  control_type: governance
applications:
- target_ref: NJT-0044
  use:
    paragraphs:
    - zh: 针对攻陷基础设施，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Compromise Infrastructure, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content, tenant, or
        conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 攻陷基础设施用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Compromise Infrastructure to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships become
        easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有攻陷基础设施实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Compromise Infrastructure, and privacy, cross-organizational data access, encryption, short retention, and legitimate lookalikes
        limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
- target_ref: NJS-0044-001
  use:
    paragraphs:
    - zh: 针对低扰动既有功能寄生，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Low-Disruption Existing-Function Parasitism, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build,
        content, tenant, or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 低扰动既有功能寄生用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Low-Disruption Existing-Function Parasitism to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle
        relationships become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有低扰动既有功能寄生实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Low-Disruption Existing-Function Parasitism, and privacy, cross-organizational data access, encryption, short retention, and
        legitimate lookalikes limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
- target_ref: NJS-0044-002
  use:
    paragraphs:
    - zh: 针对被攻陷边缘出口池轮换，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Rotating Compromised-Edge Egress Pool, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content,
        tenant, or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 被攻陷边缘出口池轮换用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Rotating Compromised-Edge Egress Pool to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships
        become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有被攻陷边缘出口池轮换实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Rotating Compromised-Edge Egress Pool, and privacy, cross-organizational data access, encryption, short retention, and legitimate
        lookalikes limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
