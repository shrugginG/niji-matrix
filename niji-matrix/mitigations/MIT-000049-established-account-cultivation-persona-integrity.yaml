    - zh: 时间培育的正常历史用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Time-Cultivated Benign History to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships
        become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有时间培育的正常历史实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Time-Cultivated Benign History, and privacy, cross-organizational data access, encryption, short retention, and legitimate lookalikes
        limit effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
- target_ref: NJS-0046-002
  use:
    paragraphs:
    - zh: 针对跨平台人物身份背书，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Cross-Platform Persona Backstopping, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content,
        tenant, or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 跨平台人物身份背书用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Cross-Platform Persona Backstopping to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships
        become easier to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有跨平台人物身份背书实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
