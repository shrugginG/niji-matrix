schema_version: 2.0.0
type: mitigation
id: MIT-000049
name:
  zh: 新建账户培育与人物身份完整性控制
  en: Established-Account Cultivation and Persona-Integrity Controls
summary:
  zh: 平台关联注册、设备、恢复、画像、关系和活动历史，对虚假培育实施分级验证；对密码/MFA/OAuth/令牌异常执行条件访问、连续会话评估、全量撤销和内容访问调查。
  en: Platforms correlate registration, device, recovery, profile, relationship, and activity history and apply graduated verification to fabricated cultivation; enforce conditional
    access, continuous session evaluation, full revocation, and content-access investigation for password, MFA, OAuth, or token anomalies.
description:
  paragraphs:
  - zh: 平台关联注册、设备、恢复、画像、关系和活动历史，对虚假培育实施分级验证；对密码/MFA/OAuth/令牌异常执行条件访问、连续会话评估、全量撤销和内容访问调查。 本缓解将可复用控制动作与逐技术应用分开，使相同措施能够在保持边界的同时降低资源准备阶段的匿迹价值。
    en: Platforms correlate registration, device, recovery, profile, relationship, and activity history and apply graduated verification to fabricated cultivation; enforce conditional
      access, continuous session evaluation, full revocation, and content-access investigation for password, MFA, OAuth, or token anomalies. This mitigation separates reusable control
      actions from per-technique applications so the same measures can reduce preparation-stage stealth value while preserving subject boundaries.
domains:
- enterprise
measures:
- key: account-cultivation-integrity
  name:
    zh: 账户培育与人物谱系完整性
    en: Account-Cultivation and Persona-Lineage Integrity
  description:
    paragraphs:
    - zh: 平台关联注册、设备、恢复、画像、关系和活动历史，对虚假培育实施分级验证；对密码/MFA/OAuth/令牌异常执行条件访问、连续会话评估、全量撤销和内容访问调查。
      en: Platforms correlate registration, device, recovery, profile, relationship, and activity history and apply graduated verification to fabricated cultivation; enforce conditional
        access, continuous session evaluation, full revocation, and content-access investigation for password, MFA, OAuth, or token anomalies.
  control_type: governance
applications:
- target_ref: NJT-0046
  use:
    paragraphs:
    - zh: 针对建立账户，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Establish Accounts, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content, tenant, or conditional-rule
        level rather than relying on outer reputation or point indicators.
  expected_effect:
    paragraphs:
    - zh: 建立账户用于降低可区分性或切断谱系的空间会缩小，准备阶段留下的控制平面、完整性和生命周期关系更容易恢复，攻击者需要更高分舱与维护成本。
      en: The room for Establish Accounts to reduce distinguishability or break lineage is narrowed, preparation-stage control-plane, integrity, and lifecycle relationships become easier
        to recover, and the adversary requires stronger compartmentation and higher maintenance cost.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有建立账户实例，且隐私、跨组织数据访问、加密、短保留期和合法相似行为会限制效果。处置必须基于组合证据，不能把资源类别、账户年龄、签名或响应差异本身等同于恶意。
      en: The control cannot eliminate every instance of Establish Accounts, and privacy, cross-organizational data access, encryption, short retention, and legitimate lookalikes limit
        effect. Enforcement must use combined evidence rather than equating resource class, account age, signature, or response difference itself with maliciousness.
- target_ref: NJS-0046-001
  use:
    paragraphs:
    - zh: 针对时间培育的正常历史，实施本缓解的审计、关联、验证与处置措施，并把控制落实到具体资源、账户、构建、内容、租户或条件规则，而不是依赖外层信誉或单点指标。
      en: For Time-Cultivated Benign History, apply this mitigation's audit, correlation, validation, and enforcement measures at the concrete resource, account, build, content, tenant,
        or conditional-rule level rather than relying on outer reputation or point indicators.
  expected_effect:
