schema_version: 2.0.0
type: mitigation
id: MIT-000050
name:
  zh: 传输完整性与浏览器入口面加固
  en: Transfer Integrity and Browser Entry-Surface Hardening
summary:
  zh: 强制验证 TLS 和软件签名，部署 CSP/SRI 与站点发布完整性，快速更新/隔离浏览器，并使用独立出口进行多视点内容比较。
  en: Enforce validated TLS and software signatures, deploy CSP/SRI and site-release integrity, rapidly update or isolate browsers, and use independent egress for multivantage content
    comparison.
description:
  paragraphs:
  - zh: 强制验证 TLS 和软件签名，部署 CSP/SRI 与站点发布完整性，快速更新/隔离浏览器，并使用独立出口进行多视点内容比较。本缓解把可复用控制措施与逐目标应用分开，重点减少攻击者对入口信任、观测缺口和分散谱系的利用，同时保留合法业务所需的例外与审计证据。
    en: Enforce validated TLS and software signatures, deploy CSP/SRI and site-release integrity, rapidly update or isolate browsers, and use independent egress for multivantage content
      comparison. This mitigation separates reusable controls from per-target applications, reducing adversary use of entry trust, observation gaps, and dispersed lineage while retaining
      exceptions and audit evidence required for legitimate business.
domains:
- enterprise
measures:
- key: path-browser-integrity
  name:
    zh: 传输与浏览器入口完整性控制
    en: Transfer and Browser-Entry Integrity Controls
  description:
    paragraphs:
    - zh: 强制验证 TLS 和软件签名，部署 CSP/SRI 与站点发布完整性，快速更新/隔离浏览器，并使用独立出口进行多视点内容比较。
      en: Enforce validated TLS and software signatures, deploy CSP/SRI and site-release integrity, rapidly update or isolate browsers, and use independent egress for multivantage content
        comparison.
  control_type: preventive
applications:
- target_ref: NJT-0052
  use:
    paragraphs:
    - zh: 针对内容注入，将本缓解落实到其直接入口对象与控制平面：强制验证 TLS 和软件签名，部署 CSP/SRI 与站点发布完整性，快速更新/隔离浏览器，并使用独立出口进行多视点内容比较。实施时必须保存入口前后关联键和处置证据，并针对该目标的身份、会话、对象、设备、路径或供应关系验证真实来源，而不是依据外层信誉自动放行。
      en: 'For Content Injection, apply this mitigation to the direct entry object and its control plane: Enforce validated TLS and software signatures, deploy CSP/SRI and site-release
        integrity, rapidly update or isolate browsers, and use independent egress for multivantage content comparison. Implementation must retain pre-entry and post-entry correlation
        keys and enforcement evidence and validate the actual provenance of the relevant identity, session, object, device, path, or supply relationship rather than auto-allowing outer
        reputation.'
  expected_effect:
    paragraphs:
    - zh: 该应用缩小内容注入利用正常外观、观测空白或分散谱系建立首个立足点的机会，同时提高攻击者维持匹配条件、合法关系和低差异痕迹的成本，并为跨视角恢复入口链提供数据。
      en: This application narrows the opportunity for Content Injection to establish a first foothold through normal appearance, observation gaps, or dispersed lineage, raises the cost
        of maintaining matching conditions, legitimate relationships, and low-difference traces, and supplies data for cross-vantage reconstruction of the entry chain.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有内容注入实例；终端或可信根被控时 TLS 失效、合法动态内容增加差异、无法阻止未知客户端利用会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Content Injection. Effectiveness is limited by TLS fails when endpoints or trusted roots are controlled, legitimate dynamic content
        increases differences, and cannot prevent unknown client exploits. Enforcement must rely on combined evidence and account for business continuity, privacy, and cross-organizational
        authority rather than treating one new device, trusted source, signature, identity, or response difference as maliciousness.
