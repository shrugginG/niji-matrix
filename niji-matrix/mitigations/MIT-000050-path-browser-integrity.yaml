    - zh: 该控制无法消除所有多跳重定向溯源切割实例；终端或可信根被控时 TLS 失效、合法动态内容增加差异、无法阻止未知客户端利用会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Multi-Hop Redirect Provenance Fragmentation. Effectiveness is limited by TLS fails when endpoints or trusted roots are controlled,
        legitimate dynamic content increases differences, and cannot prevent unknown client exploits. Enforcement must rely on combined evidence and account for business continuity,
        privacy, and cross-organizational authority rather than treating one new device, trusted source, signature, identity, or response difference as maliciousness.
