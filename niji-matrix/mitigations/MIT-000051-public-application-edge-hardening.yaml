schema_version: 2.0.0
type: mitigation
id: MIT-000051
name:
  zh: 公开应用与边界设备分层加固
  en: Layered Public-Application and Edge-Device Hardening
summary:
  zh: 维护互联网暴露清单，快速修补或迁移 EOL 设备，限制管理来源，使用 WAF/虚拟补丁、最小权限、隔离和出站控制，并把设备日志实时外送。
  en: Maintain Internet exposure inventory, rapidly patch or migrate EOL devices, restrict management origins, use WAF or virtual patching, least privilege, isolation, and egress controls,
    and export device logs in real time.
description:
  paragraphs:
  - zh: 维护互联网暴露清单，快速修补或迁移 EOL 设备，限制管理来源，使用 WAF/虚拟补丁、最小权限、隔离和出站控制，并把设备日志实时外送。本缓解把可复用控制措施与逐目标应用分开，重点减少攻击者对入口信任、观测缺口和分散谱系的利用，同时保留合法业务所需的例外与审计证据。
    en: Maintain Internet exposure inventory, rapidly patch or migrate EOL devices, restrict management origins, use WAF or virtual patching, least privilege, isolation, and egress controls,
      and export device logs in real time. This mitigation separates reusable controls from per-target applications, reducing adversary use of entry trust, observation gaps, and dispersed
      lineage while retaining exceptions and audit evidence required for legitimate business.
domains:
- enterprise
measures:
- key: public-application-edge-hardening
  name:
    zh: 公开应用与边界设备分层加固
    en: Layered Public-Application and Edge-Device Hardening
  description:
    paragraphs:
    - zh: 维护互联网暴露清单，快速修补或迁移 EOL 设备，限制管理来源，使用 WAF/虚拟补丁、最小权限、隔离和出站控制，并把设备日志实时外送。
      en: Maintain Internet exposure inventory, rapidly patch or migrate EOL devices, restrict management origins, use WAF or virtual patching, least privilege, isolation, and egress
        controls, and export device logs in real time.
  control_type: preventive
applications:
- target_ref: NJT-0054
  use:
    paragraphs:
    - zh: 针对匿迹约束的公开应用利用，将本缓解落实到其直接入口对象与控制平面：维护互联网暴露清单，快速修补或迁移 EOL 设备，限制管理来源，使用 WAF/虚拟补丁、最小权限、隔离和出站控制，并把设备日志实时外送。实施时必须保存入口前后关联键和处置证据，并针对该目标的身份、会话、对象、设备、路径或供应关系验证真实来源，而不是依据外层信誉自动放行。
      en: 'For Stealth-Constrained Public Application Exploitation, apply this mitigation to the direct entry object and its control plane: Maintain Internet exposure inventory, rapidly
        patch or migrate EOL devices, restrict management origins, use WAF or virtual patching, least privilege, isolation, and egress controls, and export device logs in real time.
        Implementation must retain pre-entry and post-entry correlation keys and enforcement evidence and validate the actual provenance of the relevant identity, session, object, device,
        path, or supply relationship rather than auto-allowing outer reputation.'
  expected_effect:
    paragraphs:
    - zh: 该应用缩小匿迹约束的公开应用利用利用正常外观、观测空白或分散谱系建立首个立足点的机会，同时提高攻击者维持匹配条件、合法关系和低差异痕迹的成本，并为跨视角恢复入口链提供数据。
      en: This application narrows the opportunity for Stealth-Constrained Public Application Exploitation to establish a first foothold through normal appearance, observation gaps,
        or dispersed lineage, raises the cost of maintaining matching conditions, legitimate relationships, and low-difference traces, and supplies data for cross-vantage reconstruction
        of the entry chain.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有匿迹约束的公开应用利用实例；零日和未知配置仍可利用、WAF 可被绕过、厂商设备日志能力不一会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Stealth-Constrained Public Application Exploitation. Effectiveness is limited by zero-days and unknown misconfigurations remain
        exploitable, WAF can be bypassed, and vendor device logging varies. Enforcement must rely on combined evidence and account for business continuity, privacy, and cross-organizational
        authority rather than treating one new device, trusted source, signature, identity, or response difference as maliciousness.
