        workload remain category-specific.
    - zh: 实施同时保留 authentication/session/resource lineage：采用抗钓鱼 MFA、device/workload-bound token、连续访问评估和资源侧 allow/deny；风险或账户状态变化时撤销全部
        token/Cookie/application session 并逐 relying party 验证。为 TA0004 保存攻击者较低权限前态、accepted identity/session、实际结果主体和 event-time
        authorization，只有新增资源许可才按提权处置。
      en: Implementation also preserves authentication session and resource lineage through phishing-resistant MFA device-
        or workload-bound tokens continuous access evaluation and resource-side allow or deny. After risk or account-state
        change revoke all tokens cookies and application sessions and verify every relying party. For TA0004 retain the adversary
        lower-authority pre-state accepted identity or session actual result principal and event-time authorization and treat
        only newly available resource permission as elevation.
    - zh: 对 TA0003，事件响应还必须轮换已暴露 credential 和 key，撤销所有 token、Cookie、application session 与 device trust，逐 relying party 验证旧状态被拒绝，并在预期生效后持续监控同一 identity 的重新认证或资源访问。只有拒绝验证与后续无重入共同成立，才认为身份入口关闭。
      en: For TA0003 incident response additionally rotates exposed credentials and keys revokes every token cookie application session and device trust verifies rejection of old state at each relying party and continues monitoring the identity for reauthentication or resource access after expected enforcement. The identity entry is considered closed only when denial verification and absence of later re-entry both hold.
  expected_effect:
    paragraphs:
    - zh: 强认证和绑定降低凭据或会话在另一环境被接受的概率，连续评估缩短风险变化后的可用窗口，owner/休眠治理在攻击前移除低反馈身份。即使登录成功，身份、session、设备、资源和撤销证据仍可把攻击者与合法主体区分，降低利用正常账户外观取得第一个立足点的机会。
      en: Strong authentication and binding reduce acceptance of credentials or sessions in another environment continuous
        evaluation shortens usability after risk change and owner or dormancy governance removes low-feedback identities before
        abuse. Even after successful sign-in identity session device resource and revocation evidence help separate an adversary
        from the legitimate principal and reduce first-foothold opportunity through normal account appearance.
    - zh: 最小/JIT 权限直接缩小结果身份相对攻击前态可能获得的权限差，并把高权操作置于审批、时间、设备和资源约束中；资源 decision 与授权快照又能确认控制是否阻止了操作。效果不是让所有有效身份失效，而是降低可借用权限并提高从
        accepted use 到 elevation confirmed 的可观测性。
      en: Least or JIT privilege directly shrinks the authority difference available from a result identity and places privileged
        operations behind approval time device and resource constraints. Resource decisions and authorization snapshots confirm
        whether enforcement blocked the operation. The effect is not to invalidate every identity but to reduce borrowable
        authority and improve observability from accepted use to elevation confirmed.
    - zh: 全状态撤销与 post-response 监控把“已改密码”从假定处置变成跨访问时段可审计结果，缩短同一身份或 session 继续恢复访问的窗口，并暴露不支持连续评估、缓存或传播延迟的资源。
      en: Full-state revocation and post-response monitoring turn password changed from assumed containment into an auditable cross-episode result shorten the window for the same identity or session to restore access and expose resources with unsupported continuous evaluation caching or propagation delay.
  limitations:
    paragraphs:
    - zh: 已控真实设备、合法管理员 session、受信合作方或绑定正确的 workload credential 仍可能通过；MFA 不能阻止被盗的已认证状态，密码重置也不会自动终止所有 relying party session。CAE、device
        binding 和撤销支持不一致，传播延迟、离线客户端、共享出口与跨租户边界都会留下窗口。
      en: A controlled real device legitimate administrator session trusted partner or correctly bound workload credential
        can still pass. MFA does not stop a stolen authenticated state and password reset does not automatically terminate
        every relying-party session. CAE device binding and revocation support vary and propagation delay offline clients
        shared egress and cross-tenant boundaries leave windows.
    - zh: 过度移除身份或压缩会话会中断自动化、灾备、远程工作和 break-glass；JIT/PIM 也可能被已控审批者或错误 delegation 滥用。所有动作需以 owner、dependency、批准和业务连续性为条件，并验证具体
        resource/action 的效果；不能把 admin 名称、休眠阈值、住宅 IP 或单个 allow/deny 当作恶意与提权结论。
      en: Aggressive identity removal or session compression can disrupt automation disaster recovery remote work and break-glass
        and JIT or PIM can be abused through a controlled approver or faulty delegation. Actions require owner dependency
        approval and continuity evidence and validation for the specific resource and action. An admin name dormancy threshold
        residential IP or one allow or deny cannot establish maliciousness or elevation.
    - zh: 合法重认证、移动客户端 refresh、灾备和季节任务会在处置后产生访问；第三方 SaaS、本地离线认证和旧协议可能延迟拒绝。过度把任一 post-response 登录视为攻击会误伤业务，必须结合先前攻击者控制、authenticator epoch、device、owner 和资源结果。
      en: Legitimate reauthentication mobile-client refresh disaster recovery and seasonal jobs produce access after response while third-party SaaS local offline authentication and legacy protocols can delay denial. Treating every post-response sign-in as attack disrupts business and requires prior adversary control authenticator epoch device owner and resource outcome context.
- target_ref: NJS-0061-001
  use:
    paragraphs:
    - zh: 对 NJS-0061-001，不因住宅/移动 ASN、本国地理、企业 VPN 或受管设备自动放行。按 identity+role 建立 source ISP/ASN、device certificate、client、authentication
        method、time 和 resource 组合基线，并比较身份提供方与资源方分别看到的出口；高权身份在新设备、无法证明 device-bound 或高价值资源前执行 phishing-resistant step-up。
      en: For NJS-0061-001 do not auto-allow residential or mobile ASNs same-country geography enterprise VPN or managed-device
        labels. Build source ISP or ASN device-certificate client authentication-method time and resource baselines by identity
        and role and compare egress observed independently by identity and resource providers. Require phishing-resistant
        step-up for privileged identities before novel devices unproved device binding or high-value resources.
    - zh: TA0004 场景将同一 device/process/browser/network 下的低权 prestate identity 与随后新登录的 result identity 关联，保存两者 event-time entitlement，并让敏感
        resource policy 评估具体 action。仅在批准的管理员切换、helpdesk、共享跳板机或 break-glass 流程中豁免，例外绑定主体、设备、资源和到期。
      en: In TA0004 join the lower-authority pre-state identity to the newly signed-in result identity on a common device
        process browser or network retain event-time entitlement for both and have sensitive-resource policy evaluate the
        concrete action. Exempt only approved administrator switching helpdesk shared jump-host or break-glass workflows and
        bind the exception to principal device resource and expiry.
    - zh: TA0003 场景在 credential 轮换或处置后要求新的认证重新满足 device proof、强认证和资源级策略；即使来源仍高度贴合，也比较 authenticator epoch、access episode、client 与结果，不能因情境正常而自动放行后续重入。
      en: Under TA0003 fresh authentication after credential rotation or response must satisfy new device proof strong authentication and resource policy. Even highly aligned origin is compared through authenticator epoch access episode client and outcome and does not auto-allow later re-entry from normal context.
  expected_effect:
    paragraphs:
    - zh: 多维、逐身份且跨 provider 的基线使攻击者不能只购买本地住宅出口就复制完整情境；device proof、client、认证方法与资源意图的剩余差异仍会触发 step-up 或阻断。攻击者若改用真实设备，还需承担端点暴露和会话控制成本。
      en: Multidimensional per-identity cross-provider baselines prevent an adversary from copying full context merely by
        buying local residential egress. Residual differences in device proof client authentication method and resource intent
        still trigger step-up or denial. Moving to a real device imposes endpoint exposure and session-control cost.
    - zh: 原身份—新身份—资源授权的连续记录使“两个登录都正常”不再掩盖 controller transition；最小/JIT 权限还减少第二身份能新增的操作。防守方可以把 context-aligned accepted use
        与 same-authority use 分开，只在确有正差和资源 allow 时确认提权。
      en: Continuous original-identity to new-identity to resource-authorization records prevent two individually normal sign-ins
        from hiding controller transition and least or JIT privilege reduces the operations added by the second identity.
        Defenders can separate context-aligned accepted use from same-authority use and confirm elevation only with a positive
        difference and resource allow.
    - zh: 处置前后 identity context 与资源结果的连续记录使攻击者不能仅靠重复使用相似来源恢复访问而不留下 epoch 和 episode 差分；step-up 和新 device proof 能在后续认证被接受前重新建立信任。
      en: Continuous identity-context and resource-outcome records before and after response prevent an adversary from restoring access through a similar origin without epoch and episode differentials while step-up and fresh device proof reestablish trust before later authentication is accepted.
  limitations:
    paragraphs:
    - zh: 已控真实设备、远程桌面、企业代理和共享跳板机可能让全部情境信号合法一致；移动网络、NAT、split tunneling 与 IdP/resource split path 又可能让合法用户看起来不一致。设备注册本身也可能已被攻击者控制，任何单项信任标签都不能作为最终
        allow。
      en: A controlled real device remote desktop enterprise proxy or shared jump host can make every context signal legitimately
        consistent while mobile networks NAT split tunneling and split paths between identity and resource providers can make
        legitimate users appear inconsistent. Device registration itself may be adversary controlled and no single trust label
        can become the final allow.
    - zh: 精细身份基线和跨 provider 关联涉及隐私、保留期、时钟与标识规范化，且对新员工、旅行、设备更新和轮班易产生冷启动误报。step-up 也无法阻止已控用户实时批准。策略必须以资源敏感度和本地正常范围调优；没有低权前态/正权限差时不应把异常登录标为
        TA0004。
      en: Fine-grained identity baselines and cross-provider joins raise privacy retention clock and identifier-normalization
        concerns and create cold-start false positives for new employees travel device refresh and shift work. Step-up also
        cannot stop a controlled user approving in real time. Tune by resource sensitivity and local normal range and do not
        label an anomalous sign-in TA0004 without lower pre-state and positive authority difference.
    - zh: 真实受控设备、企业 VPN 和共享跳板机可让 post-response 情境继续正常；频繁 step-up 会影响移动与远程工作。没有先前攻击者控制和后续资源 allow 时，只能将重复情境贴合登录作为复核线索，不能确认 TA0003。
      en: Controlled real devices enterprise VPNs and shared jump hosts can keep post-response context normal while frequent step-up disrupts mobile and remote work. Without prior adversary control and a later resource allow repeated context-aligned sign-in remains a review lead rather than confirmed TA0003.
- target_ref: NJS-0061-002
  use:
    paragraphs:
    - zh: 对 NJS-0061-002，将控制对象从密码扩展到 refresh/access token、Cookie、设备状态、应用 session 和依赖方缓存；采用 device/workload-bound token、短期高权会话、登录频率和资源侧连续访问评估。账户禁用、密码或认证器变化、风险上升和设备丢失均触发全会话撤销，并逐
        relying party 以实际拒绝结果验证传播完成。
      en: For NJS-0061-002 extend control beyond the password to refresh and access tokens cookies device state application
        sessions and relying-party caches. Use device- or workload-bound tokens short privileged sessions sign-in frequency
        and resource-side continuous access evaluation. Account disablement password or authenticator change risk increase
        and device loss trigger revocation of every session with completion verified through actual denial at each relying
        party.
    - zh: 对敏感操作把 session ID/token family、原始认证、设备证明、controller transition、结果主体和 event-time entitlement 连接到资源 allow/deny；在旧会话请求新增角色、管理
        API 或受保护对象时执行 step-up 或 JIT，而不因该会话曾经成功认证就继承永久信任。处置证据应记录撤销请求、确认时间、未覆盖应用和离线客户端。
      en: For sensitive operations join the session ID or token family original authentication device proof controller transition
        result principal and event-time entitlement to the resource allow or deny. Require step-up or JIT when an old session
        requests a new role administrative API or protected object rather than inheriting permanent trust from earlier authentication.
        Containment evidence records revocation request confirmation time uncovered applications and offline clients.
    - zh: TA0003 还要求在原 session 结束、风险或撤销事件后持续监控同一 token family 和 identity；密码重置、单次 revoke API 成功或终止当前 VPN/RDP 连接均不能替代逐 relying party 的旧状态拒绝和 post-response 重入验证。
      en: TA0003 additionally monitors the same token family and identity after original-session termination risk or revocation events. Password reset one successful revoke API call or termination of the current VPN or RDP connection does not replace per-relying-party denial of old state and post-response re-entry verification.
  expected_effect:
    paragraphs:
    - zh: token 绑定、短会话和资源重评缩短被盗状态可用期，并阻止一个依赖方仍接受已在身份提供方撤销的会话；逐应用拒绝验证把“已改密码”从假定处置变成可审计结果。攻击者必须持续控制原设备、满足新证明或重新认证，因而增加端点暴露和交互成本。
      en: Token binding short sessions and resource reevaluation shorten stolen-state usability and prevent a relying party
        from continuing to accept a session already revoked at the identity provider. Per-application denial verification
        turns password changed from an assumed containment into an auditable result. The adversary must keep control of the
        original device satisfy new proof or reauthenticate increasing endpoint exposure and interaction cost.
    - zh: 在 TA0004 中，对旧 session 的 accepted continuation 与新增角色/资源许可分别留证，可避免把持续登录本身误报为提权，也能在结果主体获得正权限差时确认权限变化。JIT 进一步限制旧会话可直接继承的
        standing authority。
      en: For TA0004 retaining separate evidence for accepted continuation and newly granted role or resource permission avoids
        treating persistence of login as elevation while confirming the authority change when the result principal gains a
        positive difference. JIT further limits standing authority that an old session can inherit directly.
    - zh: 在 TA0003 中，逐资源拒绝验证和 post-response 监控缩短旧 Cookie/token 恢复访问的窗口，并把“处置已提交”推进为“旧状态已被每个依赖方拒绝”的可审计结果；任何继续 allow 都会显式暴露持续入口。
      en: Under TA0003 per-resource denial verification and post-response monitoring shorten the window in which old cookies or tokens restore access and advance response submitted into an auditable result that every relying party rejected old state. Any continuing allow explicitly exposes the persistent entry.
  limitations:
    paragraphs:
    - zh: 并非所有 relying party、旧协议、离线客户端或第三方 SaaS 都支持连续评估和近实时撤销；access token 在到期前可能仍可用，缓存与跨租户传播会产生不一致。攻击者若控制真实设备与浏览器进程，device
        binding 也可能继续成立；一次撤销 API 成功不能证明每个资源已经拒绝。
      en: Not every relying party legacy protocol offline client or third-party SaaS supports continuous evaluation and near-real-time
        revocation. Access tokens can remain usable until expiry and caches or cross-tenant propagation create inconsistency.
        Device binding can remain valid when the adversary controls the real device and browser process and one successful
        revocation API call does not prove denial by every resource.
    - zh: 过短会话、频繁 step-up 或一次风险信号触发全局退出会中断自动化、移动工作与应急访问；高权服务身份还可能无法交互重认证。时长和触发器需按资源敏感度、客户端能力与依赖调优，且没有低权前态、正权限差和资源 allow 时，只能判断会话滥用，不能确认
        TA0004。
      en: Excessively short sessions frequent step-up or global logout from one risk signal can interrupt automation mobile
        work and emergency access and privileged service identities may be unable to reauthenticate interactively. Tune duration
        and triggers to resource sensitivity client capability and dependency. Without a lower-authority pre-state positive
        authority difference and resource allow the conclusion is session abuse rather than confirmed TA0004.
    - zh: access token 在到期前仍可能有效，第三方 SaaS、离线客户端和缓存可延迟拒绝；攻击者控制真实设备时 device binding 仍可能成立。没有 session/token 标识和资源结果时只能标记 persistence_unresolved，不能从密码重置或风险事件推断入口关闭。
      en: Access tokens may remain valid until expiry and third-party SaaS offline clients and caches can delay denial while device binding can remain valid on a controlled real device. Without session or token identity and resource outcome only persistence_unresolved is justified and entry closure cannot be inferred from password reset or a risk event.
- target_ref: NJS-0061-003
  use:
    paragraphs:
    - zh: 对 NJS-0061-003，为每个人类、来宾、服务和 workload identity 维护可联系 owner、用途、依赖、允许主机/登录类型、权限和复核到期，并同时计量 interactive 与 noninteractive
        活动。休眠阈值按 payroll、月结、证书轮换和灾备周期设置；先移除高权，再禁用并观察依赖，确认无需要后删除，而不是把一个统一天数直接应用到所有身份。
      en: For NJS-0061-003 maintain a reachable owner purpose dependency permitted host or logon type privilege and review
        expiry for every human guest service and workload identity while measuring both interactive and noninteractive activity.
        Set dormancy thresholds around payroll month-end certificate rotation and disaster-recovery cycles. Remove privilege
        first then disable and observe dependencies before deletion rather than applying one day count to every identity.
    - zh: 服务和 workload identity 使用 managed credential、禁止不需要的交互登录，并在 silent period 后首次使用、unexpected host/resource 或用途外高权操作时要求
        owner 复核、step-up 或阻断。保留身份清单快照、权限变更、owner 确认和资源结果，使攻击者对低反馈身份的选择能与正常低频任务及 TA0004 权限差分开。
      en: Use managed credentials for service and workload identities block unnecessary interactive logon and require owner
        review step-up or denial on first use after a silent period an unexpected host or resource or privileged action outside
        purpose. Retain identity-inventory snapshots privilege changes owner confirmation and resource outcomes so adversary
        selection of a low-feedback identity can be separated from legitimate low-frequency jobs and the TA0004 authority
        difference.
    - zh: TA0003 处置先移除 standing privilege，再禁用、观察依赖并删除低反馈身份，同时撤销其 credential 和 session；后续重新启用、沉默期后首次使用或非许可主机访问均进入高优先级跨时段复核，只有资源拒绝验证后才关闭入口。
      en: TA0003 response removes standing privilege before disabling dependency observation and deletion of a low-feedback identity and revokes its credentials and sessions. Later reenablement first use after silence or access from a nonpermitted host enters high-priority cross-episode review and entry closure requires verified resource denial.
  expected_effect:
    paragraphs:
    - zh: owner、依赖和到期治理在被利用前减少无人关注且仍具权限的身份，并使真实低频账户不再因“没有日志”而不可解释；先降权后禁用还把未知依赖的业务风险与 standing authority 分开。攻击者可选择的低反馈池缩小，沉默后首次使用则获得高质量复核点。
      en: Ownership dependency and expiry governance reduce unattended identities that still retain authority before abuse
        and make genuinely low-frequency accounts explainable rather than merely absent from logs. Removing privilege before
        disablement separates unknown dependency risk from standing authority. The adversary has a smaller low-feedback pool
        and first use after silence becomes a high-quality review point.
    - zh: 用途、允许主机和资源结果把同一个稀疏身份的合法自动化与异常交互或高权访问区分；最小/JIT 权限又降低其被借用时可产生的权限差。该效果针对“低反馈选择”这一观察变量，不依赖把服务账户、云账户或默认账户另立为 Niji 子类。
      en: Purpose permitted hosts and resource outcomes distinguish legitimate automation from interactive or privileged use
        of the same sparse identity and least or JIT privilege reduces the authority difference available when it is borrowed.
        The effect addresses low-feedback selection as an observation variable without creating separate Niji classes for
        service cloud or default accounts.
    - zh: owner、依赖、禁用和 post-response 首次使用监控减少攻击者在处置后重新借用休眠/服务身份恢复访问的机会，并把正常低频任务与真正跨中断重入分开。
      en: Owner dependency disablement and post-response first-use monitoring reduce opportunities to reuse dormant or service identities to restore access after response and separate legitimate low-frequency jobs from true post-interruption re-entry.
  limitations:
    paragraphs:
    - zh: 休眠不是恶意：灾备、break-glass、年度任务、季节性员工和低频集成可能长期沉默；应用或设备也可能在目录登录之外使用缓存凭据。错误删除会中断关键业务，owner 记录还可能过期或由被控人员确认，因此清理必须分阶段、可回退并观察依赖。
      en: Dormancy is not malicious because disaster-recovery break-glass annual jobs seasonal staff and low-frequency integrations
        can remain silent for long periods and applications or devices may use cached credentials outside directory sign-in.
        Erroneous deletion can interrupt critical business and ownership records may be stale or confirmed by a compromised
        person so cleanup must be staged recoverable and dependency-observed.
    - zh: 若 telemetry 不含 noninteractive sign-in、本地离线登录、API key 使用或跨租户活动，低反馈判断会偏差；攻击者也可能挑选刚刚合法使用过的身份绕过沉默门槛。阈值只能触发核验，不能单独证明攻击或提权；TA0004
        仍需低权前态、结果主体、event-time entitlement 和资源 allow 组成的正权限差。
      en: Low-feedback classification is biased when telemetry omits noninteractive sign-in local offline logon API-key use
        or cross-tenant activity and an adversary can select an identity used legitimately moments earlier to evade a silence
        threshold. The threshold only triggers review and cannot alone prove attack or elevation. TA0004 still requires a
        positive authority difference formed from lower pre-state result principal event-time entitlement and resource allow.
    - zh: 灾备、break-glass、年度任务、季节身份和恢复中的 service account 会合法在长沉默后重新出现；错误删除可中断关键业务。TA0003 必须要求先前攻击者控制和后续资源结果，不能把休眠阈值或首次复用单独当作持续访问。
      en: Disaster recovery break-glass annual jobs seasonal identities and recovering service accounts legitimately reappear after long silence and erroneous deletion can disrupt critical business. TA0003 requires prior adversary control and a later resource outcome and cannot treat a dormancy threshold or first reuse alone as continuing access.
- target_ref: NJT-0178
  use:
    paragraphs:
    - zh: 确认 token 材料取得后，保全 token reference/family、subject、client/workload、grant、audience、有效期和取得路径，撤销 access/refresh token、grant/consent、client
        credentials、workload identity 与关联应用会话，并逐 audience 验证旧材料被拒绝。
      en: After confirmed token-material acquisition, preserve token reference or family, subject, client or workload, grant,
        audiences, lifetime, and acquisition path; revoke access and refresh tokens, grant or consent, client credentials,
        workload identity, and linked application sessions, then verify old material is rejected at every audience.
  expected_effect:
    paragraphs:
    - zh: 把“revoke API 成功”推进为可审计的跨资源拒绝结果，缩短被取材料和 refresh family 的可用期并发现撤销传播缺口。
      en: Turn successful revoke API into auditable cross-resource denial, shorten usability of acquired material and its
        refresh family, and expose revocation-propagation gaps.
  limitations:
    paragraphs:
    - zh: 第三方 SaaS、离线客户端和不支持连续评估的资源可能延迟到 token 到期；攻击者若仍控制 grant、client secret、workload 或绑定私钥，可取得新材料。
      en: Third-party SaaS, offline clients, and resources without continuous evaluation may delay denial until expiry. An
        adversary retaining the grant, client secret, workload, or bound private key can obtain new material.
- target_ref: NJS-0178-001
  use:
    paragraphs:
    - zh: 除撤销返回 token family 外，同时移除恶意 consent/grant、禁用或重建受侵 managed identity/workload、修复 redirect/client 并验证 token endpoint
        不再向旧 recipient 返回材料。
      en: In addition to revoking the returned token family, remove malicious consent or grant, disable or rebuild the compromised
        managed identity or workload, repair redirect and client state, and verify the token endpoint no longer returns material
        to the old recipient.
  expected_effect:
    paragraphs:
    - zh: 阻断同一 request 前提再次产生新 token，并用失败返回和资源拒绝双向验证控制恢复。
      en: Prevent the same request prerequisites from producing fresh tokens and validate restored control through both failed
        return and resource denial.
  limitations:
    paragraphs:
    - zh: 业务 workload 重建可能中断服务，供应商 app 或跨租户 grant 的撤销需对方协作并可能存在缓存。
      en: Rebuilding a business workload may interrupt service, and revocation of vendor applications or cross-tenant grants
        requires counterpart cooperation and may face caching.
- target_ref: NJS-0178-002
  use:
    paragraphs:
    - zh: 撤销读取工件内的 token family，删除或重新投影所有副本，轮换 Secret/cache，并扫描同 mount、workspace、repository 与备份；随后验证旧 token 在每个 audience 失败。
      en: Revoke the token family found in the artifact, remove or reproject every copy, rotate Secrets and caches, and scan
        the same mount, workspace, repository, and backups, then verify the old token fails at every audience.
  expected_effect:
    paragraphs:
    - zh: 同一 token 不再因残留副本重新出现，工件清理与 resource denial 共同关闭材料传播路径。
      en: Prevent the token from reappearing through residual copies and close material propagation through both artifact
        cleanup and resource denial.
  limitations:
    paragraphs:
    - zh: 不可控备份、fork、下游 cache 和已外传副本无法保证删除；只能依靠撤销、到期和绑定限制后继价值。
      en: Uncontrolled backups, forks, downstream caches, and exfiltrated copies cannot be guaranteed deleted and require
        revocation, expiry, and binding to limit downstream value.
- target_ref: NJS-0178-003
  use:
    paragraphs:
    - zh: 终止并重建受侵 job/runner/process，撤销其 token family 和 secret injection，轮换可能同存的绑定密钥，并在干净环境重新签发；验证旧状态在资源端被拒绝且原 process 不再存活。
      en: Terminate and rebuild the compromised job, runner, or process, revoke its token family and secret injection, rotate
        any co-resident binding key, and reissue only in a clean environment; verify resource denial of old state and termination
        of the original process.
  expected_effect:
    paragraphs:
    - zh: 同时清除运行态读取能力和已复制材料的授权价值，避免只杀恶意子进程却让 token 或 consumer 继续有效。
      en: Remove both runtime read capability and authorization value of copied material, avoiding a response that kills only
        a malicious child while token or consumer remains valid.
  limitations:
    paragraphs:
    - zh: 无状态 serverless/短 job 可能在发现前结束，runner 重建不影响已经外传的 token；仍需全 audience 撤销验证。
      en: Stateless serverless or short jobs may end before discovery, and runner rebuild does not affect already exfiltrated
        tokens; full-audience revocation verification remains necessary.
- target_ref: NJT-0183
  use:
    paragraphs:
    - zh: 将授权绑定到主体、受管来源、目标组、服务、登录类型和期限；高权连接采用抗钓鱼 MFA、PAM/JIT、专用管理工作站和逐目标 ACL。对角色贴合路径，批准关系的 allow 不抑制来源风险与会话内行为检测；工单例外绑定 owner、目标、服务、动作类别和到期。
        父级同时要求远程连接、目标会话与目标动作可连接。
      en: Bind authorization to principal, managed source, destination group, service, logon type, and expiry; use phishing-resistant
        MFA, PAM or JIT, dedicated administrative workstations, and per-destination ACLs for privileged connections. For role-conforming
        paths, an approved relationship must not suppress source risk and in-session behavior detection; bind ticket exceptions
        to owner, destination, service, action class, and expiry. The parent additionally requires a join among remote connection,
        destination session, and target action.
  expected_effect:
    paragraphs:
    - &id001
      zh: 攻击者更难仅凭有效身份从任意受害主机连接，且路径贴合不再成为全会话信任。
      en: An adversary has greater difficulty connecting from any compromised host with valid identity, and path conformity
        no longer grants trust to the entire session.
  limitations:
    paragraphs:
    - &id002
      zh: 被控真实管理工作站、主体和批准时段仍可满足控制；旧协议可能不支持 MFA 或设备证明，过度收紧会中断遗留管理和应急。
      en: A controlled real management workstation, principal, and approved time can still satisfy controls; legacy protocols
        may lack MFA or device proof, and overrestriction can interrupt legacy or emergency administration.
- target_ref: NJS-0183-001
  use:
    paragraphs:
    - zh: 将授权绑定到主体、受管来源、目标组、服务、登录类型和期限；高权连接采用抗钓鱼 MFA、PAM/JIT、专用管理工作站和逐目标 ACL。对角色贴合路径，批准关系的 allow 不抑制来源风险与会话内行为检测；工单例外绑定 owner、目标、服务、动作类别和到期。
      en: Bind authorization to principal, managed source, destination group, service, logon type, and expiry; use phishing-resistant
        MFA, PAM or JIT, dedicated administrative workstations, and per-destination ACLs for privileged connections. For role-conforming
        paths, an approved relationship must not suppress source risk and in-session behavior detection; bind ticket exceptions
        to owner, destination, service, action class, and expiry.
  expected_effect:
    paragraphs:
    - *id001
  limitations:
    paragraphs:
    - *id002
- target_ref: NJT-0184
  use:
    paragraphs:
    - zh: 对替代认证材料的资源本地接受分支，使用设备/工作负载绑定、连续访问评估、短会话和逐依赖方撤销验证；同时保存 identity、session/token family、device、resource 与实际 allow/deny
        关联键。hash、ticket 和派生 proof 的验证器治理由 MIT-000193 补充。
      en: For resource-local acceptance of alternate authentication material, use device or workload binding, continuous access
        evaluation, short sessions, and per-relying-party revocation verification while retaining identity, session or token
        family, device, resource, and actual allow or deny join keys. MIT-000193 complements this application with verifier
        governance for hashes, tickets, and derived proof.
  expected_effect:
    paragraphs:
    - zh: 减少既有 bearer/session state 脱离原设备或风险情境后继续访问另一资源的机会，并使成功资源请求仍能回溯原认证和实际操作者。
      en: Reduce continued access to another resource after established bearer or session state leaves its original device
        or risk context, while keeping successful resource requests traceable to original authentication and actual operator.
  limitations:
    paragraphs:
    - zh: 真实设备被控、第三方资源缺少连续评估、撤销传播延迟和离线缓存会限制效果；不能把密码重置或单次 revoke 调用视为全部会话已失效。
      en: Control of the genuine device, third-party resources without continuous evaluation, revocation delay, and offline
        caches limit effectiveness; a password reset or one revoke call cannot be treated as proof that all sessions are invalid.
