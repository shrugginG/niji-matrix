schema_version: 2.0.0
type: mitigation
id: MIT-000052
name:
  zh: 身份、远程服务与跨组织信任一致控制
  en: Consistent Identity Remote-Service and Cross-Organization Trust Controls
summary:
  zh: 以抗钓鱼认证、设备/会话约束、连续授权、最小/JIT 权限和可问责身份生命周期共同限制有效身份、远程服务与跨组织信任滥用。
  en: Combine phishing-resistant authentication device and session constraints continuous authorization least or JIT privilege
    and accountable identity lifecycle to limit abuse of valid identities remote services and cross-organization trust.
description:
  paragraphs:
  - zh: 对远程和无线入口采用抗钓鱼 MFA、设备绑定令牌与连续评估；对伙伴委托实施最小权限/JIT/到期和双边日志，并在风险变化时撤销所有会话。本缓解把可复用控制措施与逐目标应用分开，重点减少攻击者对入口信任、观测缺口和分散谱系的利用，同时保留合法业务所需的例外与审计证据。
    en: Use phishing-resistant MFA, device-bound tokens, and continuous evaluation for remote and wireless entry; apply least
      privilege, JIT, expiry, and bilateral logging to partner delegation and revoke all sessions on risk change. This mitigation
      separates reusable controls from per-target applications, reducing adversary use of entry trust, observation gaps, and
      dispersed lineage while retaining exceptions and audit evidence required for legitimate business.
  - zh: 对有效身份使用，控制必须同时覆盖账户、认证、会话、授权和资源五层。身份应有 owner、用途、依赖与复核到期；高权访问采用分离账户、最小权限和 JIT/PAM/PIM；认证采用抗钓鱼 MFA 和 workload-bound credential；session
      在账户、风险、设备或位置变化时连续重评并验证各 relying party 已拒绝；资源侧保存实际 allow/deny。任一层的“成功”都不能替代其余控制。
    en: Valid-identity use requires controls across account authentication session authorization and resource layers. Identities
      have owners purposes dependencies and review expiry. Privileged access uses separated accounts least privilege and JIT
      PAM or PIM. Authentication uses phishing-resistant MFA and workload-bound credentials. Sessions undergo continuous reevaluation
      after account risk device or location changes with denial verified at each relying party and resources retain actual
      allow or deny. Success at one layer does not replace the other controls.
  - zh: 缓解目标是缩小 standing authority、阻止不符合身份用途的认证或会话继续、把低反馈账户在被利用前清理，并为攻击者前态到结果态的权限差保留证据；它不能通过禁止所有远程、移动、自动化或 break-glass 活动实现。例外必须绑定具体
      owner、资源、允许主机/登录类型、有效期和复核记录，响应还需考虑撤销传播、业务依赖与跨租户授权。
    en: The mitigation reduces standing authority blocks authentication or session continuation inconsistent with identity
      purpose removes low-feedback accounts before abuse and preserves evidence of authority difference from adversary pre-state
      to result. It does not do so by banning all remote mobile automation or break-glass activity. Exceptions bind a concrete
      owner resource permitted host or logon type expiry and review record and response accounts for revocation propagation
      business dependency and cross-tenant authority.
domains:
- enterprise
measures:
- key: identity-remote-trust-controls
  name:
    zh: 身份、远程服务与跨组织信任控制
    en: Identity, Remote-Service, and Cross-Organization Trust Controls
  description:
    paragraphs:
    - zh: 对远程和无线入口采用抗钓鱼 MFA、设备绑定令牌与连续评估；对伙伴委托实施最小权限/JIT/到期和双边日志，并在风险变化时撤销所有会话。
      en: Use phishing-resistant MFA, device-bound tokens, and continuous evaluation for remote and wireless entry; apply
        least privilege, JIT, expiry, and bilateral logging to partner delegation and revoke all sessions on risk change.
  control_type: governance
- key: valid-identity-authority-minimization
  name:
    zh: 有效身份权限最小化与按需提升
    en: Valid-Identity Authority Minimization and On-Demand Elevation
  description:
    paragraphs:
    - zh: 分离日常与管理员身份，移除跨域/云重复高权和不再需要的 standing entitlement；敏感资源通过 PAM/PIM、审批、JIT/JEA、限定管理主机与细粒度 resource policy 临时授予。记录 grant、resulting
        principal/token、scope、有效期与资源授权结果，便于验证是否真正产生权限差。
      en: Separate daily and administrator identities remove duplicated cross-domain or cloud privilege and unnecessary standing
        entitlement and grant sensitive-resource authority temporarily through PAM or PIM approval JIT or JEA constrained
        administration hosts and fine-grained resource policy. Record grant resulting principal or token scope validity and
        resource authorization outcome so actual authority difference can be verified.
  control_type: preventive
- key: authenticated-session-containment
  name:
    zh: 认证会话约束、连续评估与撤销验证
    en: Authenticated-Session Constraint Continuous Evaluation and Revocation Verification
  description:
    paragraphs:
    - zh: 对高风险和高权身份采用 device/workload-bound token、短会话或登录频率、资源侧连续访问评估和 step-up；发生账户禁用、密码/认证器变化、风险上升或设备丢失时撤销 refresh/access
        token、Cookie、应用 session 和设备状态，并逐 relying party 验证拒绝，而不把密码重置视为已完成处置。
      en: Use device- or workload-bound tokens short sessions or sign-in frequency resource-side continuous access evaluation
        and step-up for high-risk and privileged identities. After disablement password or authenticator change risk increase
        or device loss revoke refresh and access tokens cookies application sessions and device state and verify denial at
        every relying party rather than treating password reset as completed containment.
  control_type: containment
- key: low-feedback-identity-lifecycle
  name:
    zh: 低反馈身份的责任、依赖与休眠生命周期治理
    en: Ownership Dependency and Dormancy Governance for Low-Feedback Identities
  description:
    paragraphs:
    - zh: 为用户、来宾、服务和 workload identity 指定可联系 owner、业务用途、依赖、允许主机/登录类型和复核到期，同时计量 interactive 与 noninteractive 活动。按本地业务周期移除 dormant
        identity 的高权、禁用并观察依赖后删除；服务身份采用 managed credential、禁止不需要的交互登录，并对 first use after silence 或 unexpected host/resource
        强制复核。
      en: Assign a reachable owner business purpose dependency permitted host or logon type and review expiry to user guest
        service and workload identities while measuring interactive and noninteractive activity. Remove privilege from dormant
        identities under local business cycles then disable observe dependency and delete. Use managed credentials for service
        identities block unnecessary interactive logon and require review for first use after silence or an unexpected host
        or resource.
  control_type: governance
applications:
- target_ref: NJT-0055
  use:
    paragraphs:
    - zh: 针对远程服务拟态访问，将本缓解落实到首次和持续重入对象与控制平面：对远程入口采用抗钓鱼 MFA、设备绑定 token、连续评估和全会话撤销；实施时保存身份、会话、设备、来源、服务和处置关联键，不能依据一次成功认证自动放行。
      en: 'For Stealth-Conforming External Remote-Service Access, apply this mitigation to initial and continuing re-entry
        objects and their control planes: Use phishing-resistant MFA, device-bound tokens, and continuous evaluation for remote
        and wireless entry; apply least privilege, JIT, expiry, and bilateral logging to partner delegation and revoke all
        sessions on risk change. Implementation must retain pre-entry and post-entry correlation keys and enforcement evidence
        and validate the actual provenance of the relevant identity, session, object, device, path, or supply relationship
        rather than auto-allowing outer reputation.'
  expected_effect:
    paragraphs:
    - zh: 该应用缩小远程服务拟态访问利用正常外观、观测空白或分散谱系建立首次或持续立足点的机会，同时提高维持会话状态和匹配情境的成本，并为跨视角恢复访问链提供数据。
      en: This application narrows the opportunity for Stealth-Conforming External Remote-Service Access to establish an initial
        or continuing foothold through normal appearance, observation gaps, or dispersed lineage, raises the cost of maintaining
        matching conditions, legitimate relationships, and low-difference traces, and supplies data for cross-vantage reconstruction
        of the entry chain.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有远程服务拟态入口实例；真实设备或合法委托被控仍可通过、跨组织执行不一致、住宅代理降低地理信号会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Stealth-Conforming External Remote-Service Entry. Effectiveness is
        limited by controlled real devices or legitimate delegation may still pass, cross-organization enforcement varies,
        and residential proxies reduce geography signals. Enforcement must rely on combined evidence and account for business
        continuity, privacy, and cross-organizational authority rather than treating one new device, trusted source, signature,
        identity, or response difference as maliciousness.
- target_ref: NJS-0055-001
  use:
    paragraphs:
    - zh: 针对活动远程会话状态重放，将本缓解落实到其直接入口对象与控制平面：对远程和无线入口采用抗钓鱼 MFA、设备绑定令牌与连续评估；对伙伴委托实施最小权限/JIT/到期和双边日志，并在风险变化时撤销所有会话。实施时必须保存入口前后关联键和处置证据，并针对该目标的身份、会话、对象、设备、路径或供应关系验证真实来源，而不是依据外层信誉自动放行。
      en: 'For Live Remote-Session State Replay, apply this mitigation to the direct entry object and its control plane: Use
