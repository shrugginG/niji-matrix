schema_version: 2.0.0
type: mitigation
id: MIT-000053
name:
  zh: 物理、介质与无线入口统一控制
  en: Unified Physical Media and Wireless Entry Controls
summary:
  zh: 强化门禁和资产/线缆巡检，默认拒绝未授权 USB 与网口，使用设备证书/802.1X/NAC、禁用自动播放和介质脚本执行，并使 WLAN 与公网远程访问采用同等强认证。
  en: Harden physical access and asset or cabling inspection, deny unauthorized USB and switch ports by default, use
    device certificates, 802.1X, and NAC, disable autorun and media script execution, and apply equally strong authentication
    to WLAN and public remote access.
description:
  paragraphs:
  - zh: 强化门禁和资产/线缆巡检，默认拒绝未授权 USB 与网口，使用设备证书/802.1X/NAC、禁用自动播放和介质脚本执行，并使 WLAN 与公网远程访问采用同等强认证。本缓解把可复用控制措施与逐目标应用分开，重点减少攻击者对入口信任、观测缺口和分散谱系的利用，同时保留合法业务所需的例外与审计证据。
    en: Harden physical access and asset or cabling inspection, deny unauthorized USB and switch ports by default, use
      device certificates, 802.1X, and NAC, disable autorun and media script execution, and apply equally strong authentication
      to WLAN and public remote access. This mitigation separates reusable controls from per-target applications, reducing
      adversary use of entry trust, observation gaps, and dispersed lineage while retaining exceptions and audit evidence
      required for legitimate business.
  - zh: 对通过介质跨主机复制的场景，控制点还包括已批准介质的 A/B 流转台账、写入前后内容摘要、目标端进程和离线入区检查。介质型号或厂商签名不能替代此次内容、来源与接收主机的授权验证。
    en: For cross-host replication through media, controls also include an approved A/B transfer ledger, before-and-after
      content digests, destination processes, and an offline inspection checkpoint. Media model or vendor signature cannot
      replace authorization of this content, source, and receiving host.
domains:
- enterprise
measures:
- key: physical-media-wireless-controls
  name:
    zh: 物理、介质与无线入口控制
    en: Physical, Media, and Wireless Entry Controls
  description:
    paragraphs:
    - zh: 强化门禁和资产/线缆巡检，默认拒绝未授权 USB 与网口，使用设备证书/802.1X/NAC、禁用自动播放和介质脚本执行，并使 WLAN 与公网远程访问采用同等强认证。
      en: Harden physical access and asset or cabling inspection, deny unauthorized USB and switch ports by default,
        use device certificates, 802.1X, and NAC, disable autorun and media script execution, and apply equally strong
        authentication to WLAN and public remote access.
  control_type: preventive
- key: approved-media-host-lineage
  name:
    zh: 介质跨主机流转与内容清单
    en: Approved Media Host Lineage and Content Manifest
  description:
    paragraphs:
    - zh: 对进入隔离区或维护流程的介质记录唯一资产标识、保管人、来源主机、预期目标、内容摘要与期限；在 A 卸载和 B 接入检查执行入口与隐藏内容，必要时使用只读介质及独立扫描站。
      en: Record a unique asset identity, custodian, source host, intended destination, content digest, and expiry for
        media entering isolated or maintenance workflows. Inspect executable entries and hidden content after A unmounts
        and before B mounts, using read-only media and an independent inspection station where feasible.
  control_type: preventive
- key: media-trigger-and-auto-seeding-control
  name:
    zh: 介质触发与自动播种约束
    en: Media Trigger and Automatic Seeding Control
  description:
    paragraphs:
    - zh: 禁用不需要的自动运行，解析快捷方式真实目标并限制未受信介质上的脚本与可执行文件；监测接入后的卷枚举、批量复制和隐藏属性变化，不按文件图标或卷标作信任决定。
      en: Disable unnecessary autorun, parse actual shortcut targets, and restrict scripts and executables on untrusted
        media. Monitor post-insertion volume enumeration, bulk copies, and hidden-attribute changes without granting
        trust based on file icon or volume label.
  control_type: preventive
applications:
- target_ref: NJT-0056
  use:
    paragraphs:
    - zh: 针对伪装硬件入口，将本缓解落实到其直接入口对象与控制平面：强化门禁和资产/线缆巡检，默认拒绝未授权 USB 与网口，使用设备证书/802.1X/NAC、禁用自动播放和介质脚本执行，并使 WLAN 与公网远程访问采用同等强认证。实施时必须保存入口前后关联键和处置证据，并针对该目标的身份、会话、对象、设备、路径或供应关系验证真实来源，而不是依据外层信誉自动放行。
      en: 'For Camouflaged Hardware Entry, apply this mitigation to the direct entry object and its control plane: Harden
        physical access and asset or cabling inspection, deny unauthorized USB and switch ports by default, use device
        certificates, 802.1X, and NAC, disable autorun and media script execution, and apply equally strong authentication
        to WLAN and public remote access. Implementation must retain pre-entry and post-entry correlation keys and enforcement
        evidence and validate the actual provenance of the relevant identity, session, object, device, path, or supply
        relationship rather than auto-allowing outer reputation.'
  expected_effect:
    paragraphs:
    - zh: 该应用缩小伪装硬件入口利用正常外观、观测空白或分散谱系建立首个立足点的机会，同时提高攻击者维持匹配条件、合法关系和低差异痕迹的成本，并为跨视角恢复入口链提供数据。
      en: This application narrows the opportunity for Camouflaged Hardware Entry to establish a first foothold through
        normal appearance, observation gaps, or dispersed lineage, raises the cost of maintaining matching conditions,
        legitimate relationships, and low-difference traces, and supplies data for cross-vantage reconstruction of the
        entry chain.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有伪装硬件入口实例；无源植入和隔离主机难观察、BYOD 与维护介质产生摩擦、邻近第三方不受控会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Camouflaged Hardware Entry. Effectiveness is limited by passive
        implants and air-gapped hosts are hard to observe, BYOD and maintenance media create friction, and nearby third
        parties are uncontrolled. Enforcement must rely on combined evidence and account for business continuity, privacy,
        and cross-organizational authority rather than treating one new device, trusted source, signature, identity,
        or response difference as maliciousness.
