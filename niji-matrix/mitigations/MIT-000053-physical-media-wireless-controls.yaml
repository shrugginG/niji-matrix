  use:
    paragraphs:
    - zh: 针对无线控制差异入口，将本缓解落实到其直接入口对象与控制平面：强化门禁和资产/线缆巡检，默认拒绝未授权 USB 与网口，使用设备证书/802.1X/NAC、禁用自动播放和介质脚本执行，并使 WLAN 与公网远程访问采用同等强认证。实施时必须保存入口前后关联键和处置证据，并针对该目标的身份、会话、对象、设备、路径或供应关系验证真实来源，而不是依据外层信誉自动放行。
      en: 'For Wireless Control-Differential Ingress, apply this mitigation to the direct entry object and its control
        plane: Harden physical access and asset or cabling inspection, deny unauthorized USB and switch ports by default,
        use device certificates, 802.1X, and NAC, disable autorun and media script execution, and apply equally strong
        authentication to WLAN and public remote access. Implementation must retain pre-entry and post-entry correlation
        keys and enforcement evidence and validate the actual provenance of the relevant identity, session, object, device,
        path, or supply relationship rather than auto-allowing outer reputation.'
  expected_effect:
    paragraphs:
    - zh: 该应用缩小无线控制差异入口利用正常外观、观测空白或分散谱系建立首个立足点的机会，同时提高攻击者维持匹配条件、合法关系和低差异痕迹的成本，并为跨视角恢复入口链提供数据。
      en: This application narrows the opportunity for Wireless Control-Differential Ingress to establish a first foothold
        through normal appearance, observation gaps, or dispersed lineage, raises the cost of maintaining matching conditions,
        legitimate relationships, and low-difference traces, and supplies data for cross-vantage reconstruction of the
        entry chain.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有无线控制差异入口实例；无源植入和隔离主机难观察、BYOD 与维护介质产生摩擦、邻近第三方不受控会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Wireless Control-Differential Ingress. Effectiveness is limited
        by passive implants and air-gapped hosts are hard to observe, BYOD and maintenance media create friction, and
        nearby third parties are uncontrolled. Enforcement must rely on combined evidence and account for business continuity,
        privacy, and cross-organizational authority rather than treating one new device, trusted source, signature, identity,
        or response difference as maliciousness.
- target_ref: NJT-0194
  use:
    paragraphs:
    - zh: 对可写介质实施设备组、用户和进程级准入，记录资产标识、保管人、来源、目的区、内容摘要和期限；介质离开敏感区前核对源读取与新增内容，在外部接收不可见时把经审批的出区记录作为交付门，并对未批准写入阻断或隔离。
      en: Enforce device-group, user, and process admission for writable media and record asset identity, custodian,
        source, destination zone, content digest, and expiry. Before media leaves a sensitive zone, reconcile source
        reads with newly added content. Where an external receiver is unobservable, use approved zone-exit custody as
        the delivery gate and block or isolate unapproved writes.
  expected_effect:
    paragraphs:
    - zh: 未授权介质难以获得写权限，获准介质的数据与保管变化可审计，物理路径不再完全脱离数据控制。
      en: Unauthorized media has greater difficulty obtaining write access, data and custody changes on approved media
        become auditable, and the physical path no longer sits wholly outside data control.
  limitations:
    paragraphs:
    - zh: 内部人可滥用获准介质，序列号可以伪造，紧急维护和取证需要例外；离区后无法控制攻击者接收机，控制必须在写入和出区前执行。
      en: Insiders can abuse approved media, serials can be spoofed, and emergency maintenance or forensics needs exceptions.
        The attacker receiver cannot be controlled after zone exit, so enforcement must occur before writing and departure.
- target_ref: NJS-0194-001
  use:
    paragraphs:
    - zh: 对跨区交换采用独立检查站、方向固定或只读介质和逐次签发的内容清单，要求 A 卸载后、B 接入前和返回时核对同一介质、保管人及摘要；禁止一枚普通双向介质在高敏区和互联网区无检查往返。
      en: For cross-zone exchange, use independent inspection stations, direction-fixed or read-only media, and per-trip
        signed manifests. Reconcile medium, custodian, and digest after A unmounts, before B attaches, and on return.
        Prohibit unchecked round trips by one general-purpose writable medium between sensitive and Internet-connected
        zones.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以利用正常轮转建立隐蔽返回路径，源写入与接收侧内容可在跨区点被阻断或连接。
      en: The attacker has greater difficulty turning routine rotation into a covert return path, and source writes and
        receiver-side content can be blocked or joined at the zone boundary.
  limitations:
    paragraphs:
    - zh: 无代理的隔离系统、第三方保管和长周期离线任务会使台账不完整；只读或单向流程也可能不适用于确需双向交换的业务。
      en: Agentless isolated systems, third-party custody, and long offline workflows can leave incomplete ledgers. Read-only
        or one-way handling may not fit business processes that require bidirectional exchange.
- target_ref: NJS-0194-002
  use:
    paragraphs:
    - zh: 对认可介质不只校验 DeviceID 和可见文件清单，还在检查站比较物理容量、分区表、声明外区域摘要并在需要时完整重建或擦除介质；限制非批准进程取得物理磁盘/卷原始写权限。
      en: For recognized media, verify physical capacity, partition table, and undeclared-region digest in addition to
        DeviceID and the visible file manifest, fully rebuilding or sanitizing media when required. Restrict raw physical-disk
        or volume write access to approved processes.
  expected_effect:
    paragraphs:
    - zh: 认可设备身份和宿主不可见区域不再自动绕过控制，隐藏存储需改变已签名布局或突破原始写权限。
      en: Recognized device identity and host-opaque regions no longer bypass control automatically; hidden storage must
        alter a signed layout or defeat raw-write restrictions.
  limitations:
    paragraphs:
    - zh: 原始扫描增加处理时间并可能接触合法加密内容，固件级隐藏区仍可能不可见；完整擦除会破坏业务数据，必须配合保管和恢复流程。
      en: Raw scanning adds handling time and may encounter legitimate encrypted content, while firmware-level hidden
        areas may remain invisible. Full sanitization destroys business data and needs custody and recovery procedures.
- target_ref: NJT-0207
  use:
    paragraphs:
    - zh: 对联网区与隔离区禁止同一枚通用可写介质无检查往返；确需双向业务时，以独立检查站签发每次行程，记录源/目的角色、保管人和内容摘要，并优先使用入站只读介质与独立出站介质。控制侧和受限侧只允许批准进程读写指定目录，隔离端禁止介质上的非签名执行内容。
      en: Prohibit unchecked round trips by one general-purpose writable medium between connected and isolated zones.
        Where business requires bidirectional exchange, issue each trip at an independent checkpoint with source and
        destination roles, custodian, and content digest, preferring read-only inbound media and separate outbound media.
        Permit only approved processes and directories on both sides and prohibit unsigned executable content from media
        on the restricted endpoint.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以把正常轮转变成未审计的命令—结果队列，且每次方向变化都会产生可核对的清单和保管记录。
      en: An adversary has greater difficulty turning routine rotation into an unaudited command-result queue, and each
        direction change produces a reconcilable manifest and custody record.
  limitations:
    paragraphs:
    - zh: 紧急维护、取证和旧系统可能确需双向可写介质；隔离端无代理、第三方保管和长周期任务仍会造成证据缺口，检查站也不能解释所有加密业务包。
      en: Emergency maintenance, forensics, and legacy systems may require bidirectional writable media. Agentless isolated
        endpoints, third-party custody, and long rotations still leave evidence gaps, and a checkpoint cannot interpret
        every encrypted business package.
- target_ref: NJS-0207-001
  use:
    paragraphs:
    - zh: 对离线任务包实施签名、明确收件主机、单调任务号、到期时间和回传目录，并将批准摘要写入逐次清单；受限端仅由专用代理验证后执行，返回结果也须绑定原任务号。阻断收件身份、签名、任务号或目录偏离批准定义的对象。
      en: Require offline task packages to carry a signature, explicit recipient host, monotonic task number, expiry,
        and return directory, recording approved digests in the per-trip manifest. A dedicated agent on the restricted
        side executes only after verification, and returned results bind to the originating task number. Block objects
        whose recipient, signature, task number, or directory differs from approval.
  expected_effect:
    paragraphs:
    - zh: 攻击者的低量定向信箱必须伪造受控任务系统的身份与状态，未知命令和无来源结果会在执行或出区前暴露。
      en: The adversary's sparse addressed mailbox must forge the managed task system's identity and state; unknown commands
        and unprovenanced results become visible before execution or zone exit.
  limitations:
    paragraphs:
    - zh: 业务系统若没有端到端签名和任务编号，控制只能依赖摘要与人工审批；获准签名密钥或专用代理被攻陷时仍可生成表面合规包。
      en: Without end-to-end package signatures and task numbers, control falls back to digests and manual approval.
        A compromised approved signing key or dedicated agent can still generate apparently compliant packages.
- target_ref: NJS-0207-002
  use:
    paragraphs:
    - zh: 检查站除 DeviceID 与可见文件外，还比较启动区域、分区表、隐藏/系统属性和声明外区域摘要；离开每个安全域前重新生成或彻底清理介质，限制非批准进程打开物理磁盘/卷执行原始写入。无法原始检查的介质不得在联网与高敏区间双向复用。
      en: At checkpoints, compare boot region, partition table, hidden or system attributes, and undeclared-region digest
        in addition to DeviceID and visible files. Rebuild or sanitize media before departure from each security zone
        and restrict unapproved processes from raw physical-disk or volume writes. Media that cannot be inspected raw
        must not be reused bidirectionally between connected and high-sensitivity zones.
  expected_effect:
    paragraphs:
    - zh: 小型 MBR/启动区状态门和隐藏信箱不再因设备获准而自动通过，攻击者必须突破原始写权限或改变签名基线。
      en: Small MBR or boot-region gates and hidden mailboxes no longer pass merely because the device is approved; the
        adversary must defeat raw-write controls or alter a signed baseline.
  limitations:
    paragraphs:
    - zh: 原始扫描增加处理时间，完整清理会破坏业务数据，固件隐藏区仍可能不可见；合法启动盘或加密卷需要按资产维护独立基线。
      en: Raw scanning adds handling time, complete sanitization destroys business data, and firmware-hidden regions
        may remain invisible. Legitimate boot media and encrypted volumes need separate per-asset baselines.
