- target_ref: NJT-0058
  use:
    paragraphs:
    - zh: 对已控 A 到不同内部 B 的介质传播，绑定批准的介质、来源主机、目标资产和内容摘要，并在 B 接入前核对写入历史；对 B 首次进程结果及偏离清单的文件实施阻断和回溯。
      en: For media propagation from controlled host A to distinct internal host B, bind the approved medium, source,
        destination, and digest, checking write history before B insertion. Block and investigate B first-process outcomes
        or files outside the manifest.
    - zh: 若介质从受害环境外首次进入，仍应在第一台接收主机检查批准来源、内容清单、诱导入口和执行结果；只有已控内部 A 及不同 B 的链均可证时才使用跨主机流转归因。
      en: If the medium first enters from outside the victim environment, inspect approved source, content manifest,
        lure entry, and execution on the first receiving host. Use the internal A-to-distinct-B attribution only when
        both hosts and the transfer chain are evidenced.
  expected_effect:
    paragraphs:
    - zh: 攻击者无法仅靠正常 USB 外观把 A 的播种内容送入 B；即使离线网络没有直接复制流量，跨主机介质与内容谱系也可恢复。
      en: An attacker cannot rely on an ordinary USB appearance alone to carry A-seeded content into B; media and content
        lineage across hosts remains recoverable despite no direct network copy flow.
    - zh: 同一控制同时降低外来介质建立首个立足点的机会，并保留对后续内部介质扩散的源目标区分。
      en: The same control also reduces first-foothold establishment through outside media while preserving source-to-destination
        distinctions for later internal spread.
  limitations:
    paragraphs:
    - zh: 介质序列号可以重复或伪造，隔离 B 可能没有 EDR；合法离线补丁和紧急维护需要有时限的例外。缺少 A 的写入证据时，只能确认 B 端触发，不宣称完整 A—介质—B 链。
      en: Media serials can repeat or be spoofed, and isolated B may lack EDR. Authorized offline patching and emergency
        maintenance need time-limited exceptions. Without A-side write evidence, confirm only B-side triggering rather
        than a full A-to-media-to-B chain.
    - zh: 初始进入通常没有内部播种主机 A；要求 A/B 全链作为首个入口的必要条件会漏报，因此两种战术位置应分别审查。
      en: Initial entry often has no internal seeding host A. Requiring the full A/B chain for a first foothold would
        miss that case, so the two tactic positions need separate review.
- target_ref: NJS-0058-001
  use:
    paragraphs:
    - zh: 对伪装式介质触发，比较可见目录名、文件图标与实际 LNK 目标、AutoRun 配置和 B 上解释器或安装器进程；对不在批准清单的目标命令和隐藏载荷拦截执行。
      en: For a masqueraded media trigger, compare visible directory names and icons with real LNK targets, autorun configuration,
        and interpreter or installer processes on B. Block target commands and hidden payloads outside an approved manifest.
  expected_effect:
    paragraphs:
    - zh: 诱饵外观不再足以掩盖真实命令，目标端首次触发可在后继网络或下载器启动前暴露。
      en: A lure appearance no longer hides the real command, and the first trigger on the destination can be exposed
        before a downloader or successor network action.
  limitations:
    paragraphs:
    - zh: 合法快捷方式、驱动安装和老旧自动运行工作流也会触发同类检查；签名系统二进制被滥用时需要解析参数与来源，不能一概放行或阻断。
      en: Legitimate shortcuts, driver installations, and legacy autorun workflows also trigger these checks. Abuse of
        signed system binaries requires argument and provenance parsing rather than blanket allowing or blocking.
- target_ref: NJS-0058-002
  use:
    paragraphs:
    - zh: 对低触达自动播种，监控受控 A 接入介质后的卷枚举、批量 LNK 或可执行文件写入及隐藏属性变化；关键离线交换点优先采用只读介质或独立内容清单验证。
      en: For low-touch automatic seeding, watch volume enumeration, bulk LNK or executable writes, and hidden-attribute
        changes after the medium reaches controlled A. Prefer read-only media or an independent content-manifest check
        at critical offline exchange points.
  expected_effect:
    paragraphs:
    - zh: 自动播种失去无人工逐盘操作的静默扩散优势，多个目标共享的恶意内容可按介质与摘要快速回查。
      en: Automatic seeding loses the advantage of propagation without manual per-drive work, and malicious content shared
        across destinations can be traced quickly by medium and digest.
  limitations:
    paragraphs:
    - zh: 批量离线发布、介质初始化和备份还原也会产生高密度写入；离线区若无源主机遥测，检查站只能发现内容差异，无法独立归因于 A 上的具体进程。
      en: Bulk offline releases, media initialization, and backup restoration also produce dense writes. Without source-host
        telemetry in an isolated zone, a checkpoint can find content differences but cannot independently attribute them
        to a process on A.
