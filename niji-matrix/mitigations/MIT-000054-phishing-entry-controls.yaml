schema_version: 2.0.0
type: mitigation
id: MIT-000054
name:
  zh: 钓鱼会话、对象与认证入口分层控制
  en: Layered Phishing Conversation Object and Authentication Entry Controls
summary:
  zh: 组合发件身份验证、会话级分析、外部共享对象租户治理、授权多视点重放、带外业务核验、抗钓鱼 MFA 和设备绑定会话；真实账户或合法平台不自动放行。
  en: Combine sender authentication, conversation-level analysis, external shared-object tenant governance, authorized multivantage replay, out-of-band business verification, phishing-resistant
    MFA, and device-bound sessions; do not auto-allow real accounts or legitimate platforms.
description:
  paragraphs:
  - zh: 组合发件身份验证、会话级分析、外部共享对象租户治理、授权多视点重放、带外业务核验、抗钓鱼 MFA 和设备绑定会话；真实账户或合法平台不自动放行。本缓解把可复用控制措施与逐目标应用分开，重点减少攻击者对入口信任、观测缺口和分散谱系的利用，同时保留合法业务所需的例外与审计证据。
    en: Combine sender authentication, conversation-level analysis, external shared-object tenant governance, authorized multivantage replay, out-of-band business verification, phishing-resistant
      MFA, and device-bound sessions; do not auto-allow real accounts or legitimate platforms. This mitigation separates reusable controls from per-target applications, reducing adversary
      use of entry trust, observation gaps, and dispersed lineage while retaining exceptions and audit evidence required for legitimate business.
domains:
- enterprise
measures:
- key: phishing-entry-controls
  name:
    zh: 钓鱼会话、对象与认证入口控制
    en: Phishing Conversation, Object, and Authentication Entry Controls
  description:
    paragraphs:
    - zh: 组合发件身份验证、会话级分析、外部共享对象租户治理、授权多视点重放、带外业务核验、抗钓鱼 MFA 和设备绑定会话；真实账户或合法平台不自动放行。
      en: Combine sender authentication, conversation-level analysis, external shared-object tenant governance, authorized multivantage replay, out-of-band business verification, phishing-resistant
        MFA, and device-bound sessions; do not auto-allow real accounts or legitimate platforms.
  control_type: preventive
applications:
- target_ref: NJT-0057
  use:
    paragraphs:
    - zh: 针对匿迹型钓鱼入口，将本缓解落实到其直接入口对象与控制平面：组合发件身份验证、会话级分析、外部共享对象租户治理、授权多视点重放、带外业务核验、抗钓鱼 MFA 和设备绑定会话；真实账户或合法平台不自动放行。实施时必须保存入口前后关联键和处置证据，并针对该目标的身份、会话、对象、设备、路径或供应关系验证真实来源，而不是依据外层信誉自动放行。
      en: 'For Stealth-Oriented Phishing Entry, apply this mitigation to the direct entry object and its control plane: Combine sender authentication, conversation-level analysis, external
        shared-object tenant governance, authorized multivantage replay, out-of-band business verification, phishing-resistant MFA, and device-bound sessions; do not auto-allow real
        accounts or legitimate platforms. Implementation must retain pre-entry and post-entry correlation keys and enforcement evidence and validate the actual provenance of the relevant
        identity, session, object, device, path, or supply relationship rather than auto-allowing outer reputation.'
  expected_effect:
    paragraphs:
    - zh: 该应用缩小匿迹型钓鱼入口利用正常外观、观测空白或分散谱系建立首个立足点的机会，同时提高攻击者维持匹配条件、合法关系和低差异痕迹的成本，并为跨视角恢复入口链提供数据。
      en: This application narrows the opportunity for Stealth-Oriented Phishing Entry to establish a first foothold through normal appearance, observation gaps, or dispersed lineage,
        raises the cost of maintaining matching conditions, legitimate relationships, and low-difference traces, and supplies data for cross-vantage reconstruction of the entry chain.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有匿迹型钓鱼入口实例；E2EE/语音和第三方日志盲区、合法业务会话高度相似、条件门控难复现会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Stealth-Oriented Phishing Entry. Effectiveness is limited by E2EE/voice and third-party logging gaps, strong similarity to legitimate
        business conversations, and difficult reproduction of conditional gating. Enforcement must rely on combined evidence and account for business continuity, privacy, and cross-organizational
        authority rather than treating one new device, trusted source, signature, identity, or response difference as maliciousness.
