schema_version: 2.0.0
type: mitigation
id: MIT-000055
name:
  zh: 可验证构建与传递供应链完整性
  en: Verifiable Build and Transitive Supply-Chain Integrity
summary:
  zh: 使用隔离签名密钥、双人审批、可复现构建、透明日志、SBOM/锁文件/摘要钉扎和私有命名空间；对已签名更新仍实施端点行为分析并跨供应商通报。
  en: Use isolated signing keys, dual approval, reproducible builds, transparency logs, SBOMs, lockfiles, digest pinning, and private namespaces; continue endpoint behavioral analysis
    of signed updates and cross-supplier notification.
description:
  paragraphs:
  - zh: 使用隔离签名密钥、双人审批、可复现构建、透明日志、SBOM/锁文件/摘要钉扎和私有命名空间；对已签名更新仍实施端点行为分析并跨供应商通报。本缓解把可复用控制措施与逐目标应用分开，重点减少攻击者对入口信任、观测缺口和分散谱系的利用，同时保留合法业务所需的例外与审计证据。
    en: Use isolated signing keys, dual approval, reproducible builds, transparency logs, SBOMs, lockfiles, digest pinning, and private namespaces; continue endpoint behavioral analysis
      of signed updates and cross-supplier notification. This mitigation separates reusable controls from per-target applications, reducing adversary use of entry trust, observation
      gaps, and dispersed lineage while retaining exceptions and audit evidence required for legitimate business.
domains:
- enterprise
measures:
- key: supply-chain-integrity
  name:
    zh: 构建、交付与传递供应链完整性
    en: Build, Delivery, and Transitive Supply-Chain Integrity
  description:
    paragraphs:
    - zh: 使用隔离签名密钥、双人审批、可复现构建、透明日志、SBOM/锁文件/摘要钉扎和私有命名空间；对已签名更新仍实施端点行为分析并跨供应商通报。
      en: Use isolated signing keys, dual approval, reproducible builds, transparency logs, SBOMs, lockfiles, digest pinning, and private namespaces; continue endpoint behavioral analysis
        of signed updates and cross-supplier notification.
  control_type: governance
applications:
- target_ref: NJT-0059
  use:
    paragraphs:
    - zh: 针对受信供应链入口，将本缓解落实到其直接入口对象与控制平面：使用隔离签名密钥、双人审批、可复现构建、透明日志、SBOM/锁文件/摘要钉扎和私有命名空间；对已签名更新仍实施端点行为分析并跨供应商通报。实施时必须保存入口前后关联键和处置证据，并针对该目标的身份、会话、对象、设备、路径或供应关系验证真实来源，而不是依据外层信誉自动放行。
      en: 'For Trusted Supply-Chain Entry, apply this mitigation to the direct entry object and its control plane: Use isolated signing keys, dual approval, reproducible builds, transparency
        logs, SBOMs, lockfiles, digest pinning, and private namespaces; continue endpoint behavioral analysis of signed updates and cross-supplier notification. Implementation must retain
        pre-entry and post-entry correlation keys and enforcement evidence and validate the actual provenance of the relevant identity, session, object, device, path, or supply relationship
        rather than auto-allowing outer reputation.'
  expected_effect:
    paragraphs:
    - zh: 该应用缩小受信供应链入口利用正常外观、观测空白或分散谱系建立首个立足点的机会，同时提高攻击者维持匹配条件、合法关系和低差异痕迹的成本，并为跨视角恢复入口链提供数据。
      en: This application narrows the opportunity for Trusted Supply-Chain Entry to establish a first foothold through normal appearance, observation gaps, or dispersed lineage, raises
        the cost of maintaining matching conditions, legitimate relationships, and low-difference traces, and supplies data for cross-vantage reconstruction of the entry chain.
  limitations:
    paragraphs:
    - zh: 该控制无法消除所有受信供应链入口实例；不可复现生态和闭源供应商限制验证、长休眠延迟发现、SBOM 不证明构建未被污染会限制效果。处置必须依赖组合证据并评估业务连续性、隐私与跨组织授权，不能把单个新设备、可信来源、签名、身份或响应差异等同于恶意。
      en: The control cannot eliminate every instance of Trusted Supply-Chain Entry. Effectiveness is limited by irreproducible ecosystems and closed suppliers limit verification, long
        dormancy delays discovery, and SBOM does not prove build integrity. Enforcement must rely on combined evidence and account for business continuity, privacy, and cross-organizational
        authority rather than treating one new device, trusted source, signature, identity, or response difference as maliciousness.
