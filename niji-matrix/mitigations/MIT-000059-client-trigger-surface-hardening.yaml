schema_version: 2.0.0
type: mitigation
id: MIT-000059
name: {zh: 用户执行内容、工作流与交互边界治理, en: User-Execution Content Workflow and Interaction-Boundary Governance}
summary: {zh: 通过可信内容来源、隔离预览、ASR/应用控制、剪贴板到 Shell 阻断、受管 Repository/远程支持与可报告培训降低用户执行, en: Reduce User Execution through trusted content provenance isolated preview ASR or application control clipboard-to-shell interruption managed repositories and remote support and reportable training}
description:
  paragraphs:
    - {zh: 本缓解把社会工程前的身份/内容控制、用户动作时的安全摩擦和动作后的执行阻断组合起来。邮件、URL、USB、repository、image、library 与支持身份必须可验证；Office/browser/Explorer/IDE/package manager 到脚本、installer、RMM 或 workload 的边界由 MOTW、隔离预览、ASR 和应用控制约束；多步 clipboard→Run/Terminal 链用内容警告、paste protection 和 shell policy 中断。培训用于提升核验与上报，不替代技术控制。, en: This mitigation combines identity and content controls before social engineering safety friction at user action and execution blocking after action. Mail URLs USB repositories images libraries and support identities must be verifiable. MOTW isolated preview ASR and application control govern transitions from Office browsers Explorer IDEs or package managers to scripts installers RMM or workloads. Content warnings paste protection and shell policy interrupt clipboard-to-Run or Terminal chains. Training improves verification and reporting and does not replace technical controls.}
domains: [enterprise]
measures:
  - {key: trusted-content-and-identity, name: {zh: 内容、Repository 与支持身份验证, en: Content Repository and Support Identity Verification}, description: {paragraphs: [{zh: 验证 sender/domain/recruiter/helpdesk、URL、file/package/image/repository digest 和 publisher；开发任务使用内部/批准 registry 与 sandbox，远程支持走工单回拨与批准工具，USB 与下载保留来源/MOTW。, en: Verify sender domain recruiter or helpdesk URLs file package image or repository digests and publishers use internal or approved registries and sandboxes for developer tasks require ticket callbacks and approved tools for remote support and preserve provenance or MOTW for USB and downloads.}]}, control_type: exposure-reduction}
  - {key: handler-to-payload-execution-control, name: {zh: Handler 到 Payload 的执行控制, en: Handler-to-Payload Execution Control}, description: {paragraphs: [{zh: 启用 ASR、应用控制、宏/脚本/installer/package policy、低信誉与 USB 阻断，限制 Office/browser/archiver/IDE/package manager 启动解释器、LOLBin、RMM 或未批准 workload；保留阻断审计。, en: Enable ASR application control macro script installer and package policy low-reputation and USB blocking and restrict Office browsers archivers IDEs or package managers from launching interpreters LOLBins RMM or unapproved workloads while retaining blocked-event audit.}]}, control_type: preventive}
  - {key: clipboard-shell-interaction-protection, name: {zh: Clipboard 到 Shell 交互保护, en: Clipboard-to-Shell Interaction Protection}, description: {paragraphs: [{zh: 对网页写入可执行命令、Run/Terminal paste 和 encoded one-liner 提示/阻断，企业脚本通过签名 portal/managed launcher 运行，不让用户按网页指令关闭安全或执行未知命令；最小化 clipboard 内容采集。, en: Warn or block web-written executable commands Run or Terminal paste and encoded one-liners run enterprise scripts through signed portals or managed launchers and prevent users following web instructions to disable security or execute unknown commands while minimizing clipboard content collection.}]}, control_type: preventive}
  - {key: role-based-reportable-training, name: {zh: 角色化核验与可报告培训, en: Role-Based Verification and Reportable Training}, description: {paragraphs: [{zh: 针对开发者、helpdesk、云管理员和普通用户训练真实工作流异常、独立渠道核验、停止/报告路径和被诱导后响应；模拟演练测量上报而非责罚点击，并把反馈用于策略。, en: Train developers helpdesks cloud administrators and general users on workflow anomalies out-of-band verification stop and report paths and response after inducement and measure reporting rather than punish clicks in simulations while feeding results into policy.}]}, control_type: governance}
applications:
  - target_ref: NJT-0081
    use: {paragraphs: [{zh: 对工作流合形用户执行，从身份/内容进入到首个 payload 建立分层门禁：不可信来源隔离，用户动作前显示真实 publisher/target，动作后由 ASR/应用控制约束 handler、interpreter、installer、RMM 和 workload，并保留 user/session/content/result 证据。, en: For Workflow-Conforming User Execution establish layered gates from identity or content arrival to first payload by isolating untrusted origins showing real publishers and targets before user action enforcing ASR or application control on handlers interpreters installers RMM and workloads afterward and preserving user session content and outcome evidence.}]}
    expected_effect: {paragraphs: [{zh: 攻击者必须同时绕过身份与内容验证、用户核验和技术执行控制，单一可信外观或真实用户动作不再足以运行载荷；阻断后仍能调查并提醒用户重置凭据/撤销会话。, en: Attackers must bypass identity and content verification user validation and technical execution controls together and one trusted appearance or real user action no longer suffices. Blocked attempts remain investigable and trigger credential reset or session revocation.}]}
    limitations: {paragraphs: [{zh: 强安全摩擦会影响开发、支持和无障碍流程，用户仍可能批准受信签名恶意内容或共谋；平台对 link/file/image/library 控制不同，隐私限制交互遥测。必须按角色调优且不能以培训替责。, en: Strong friction affects development support and accessibility and users may approve signed malicious content or collude while platforms vary across link file image and library controls and privacy limits interaction telemetry. Role-based tuning is required and training cannot shift responsibility away from controls.}]}
  - target_ref: NJS-0081-001
    use: {paragraphs: [{zh: 对工作流合形用户触发，把 recruiter/helpdesk/update identity、repository/package/image/file 与用户角色任务绑定到批准清单和独立核验；npm/pip、RMM、USB LNK 和下载 installer 首次执行在隔离环境或受管 portal 完成，并验证后继 child/network。, en: For Workflow-Conforming User Trigger bind recruiter helpdesk or update identities repositories packages images and files to approved lists and out-of-band verification for user roles. First execution of npm or pip RMM USB LNK and downloaded installers occurs in isolation or managed portals and verifies successor children and network.}]}
    expected_effect: {paragraphs: [{zh: Contagious Interview、Raspberry Robin 和假支持任务即使贴合用户工作，也会因来源、publisher、MOTW、package script 或 first outcome 差异被阻断/上报。, en: Contagious Interview Raspberry Robin and fake-support tasks encounter blocking or reporting from provenance publisher MOTW package scripts or first-outcome differences despite workflow fit.}]}
    limitations: {paragraphs: [{zh: 合法面试/开源项目和临时支持身份变化频繁，严格批准可能拖慢业务；被攻陷合法 repository/publisher 仍可通过，需要运行结果与 SBOM/provenance。, en: Legitimate interviews open-source projects and temporary support identities change often and strict approval slows business while compromised legitimate repositories or publishers may pass and require runtime outcomes plus SBOM or provenance.}]}
  - target_ref: NJS-0081-002
    use: {paragraphs: [{zh: 对多步交互因果分离，浏览器写 clipboard 的可执行文本显示来源警告，Run/PowerShell/Terminal 对来自 clipboard 的 encoded/download command 二次确认或阻断；企业修复命令通过签名脚本/portal 自动执行而不要求用户复制，保留最小 content hash/focus/command 审计。, en: For Multi-Step Interaction Causality Separation show provenance warnings when browsers write executable clipboard text and require confirmation or block encoded or download commands pasted into Run PowerShell or Terminal. Deliver enterprise fixes through signed scripts or portals without user copying and retain minimal content-hash focus and command audit.}]}
    expected_effect: {paragraphs: [{zh: ClearFake/TA571 的页面→clipboard→Run/PowerShell 链在 paste 或命令解释前被中断，同时 hash 与阻断结果重新建立跨应用因果，降低用户 self-pwn 成功率。, en: ClearFake or TA571 page-to-clipboard-to-Run or PowerShell chains are interrupted before paste or interpretation while hashes and blocked results rebuild cross-application causality and reduce self-pwn success.}]}
    limitations: {paragraphs: [{zh: 管理员和开发者合法复制命令频繁，全面禁止会不可用；用户可手工重打或修改命令，clipboard 监控有隐私风险，macOS/Linux 控制能力不一致。应按风险命令和来源分级。, en: Administrators and developers legitimately copy commands frequently and blanket prohibition is unusable while users may retype or edit commands clipboard monitoring raises privacy risk and macOS or Linux controls differ. Tier policy by command risk and provenance.}]}
evidence_refs: [REF-000297, REF-000298, REF-000031, REF-000301, REF-000302]
