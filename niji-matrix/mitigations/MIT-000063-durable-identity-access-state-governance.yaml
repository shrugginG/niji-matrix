schema_version: 2.0.0
type: mitigation
id: MIT-000063
name:
  zh: 持久身份访问状态治理与恢复
  en: Durable Identity Access-State Governance and Recovery
summary:
  zh: 以最小变更权限、显式审批、完整访问边盘点、有限寿命和全路径撤销，减少攻击者向既有身份植入持久认证或授权状态的机会。
  en: Reduce opportunities to implant durable authentication or authorization state into existing identities through
    least change authority, explicit approval, complete access-edge inventory, bounded lifetime, and all-path revocation.
description:
  paragraphs:
  - zh: 本缓解把身份安全控制对象从“账户是否启用”扩展到附着在主体上的每条可持续访问边。组织应分别盘点密码与密钥、认证方法、设备信任、组与角色成员关系、应用权限、邮件委托、SSH 授权和等价本地配置，限定谁能新增、替换、延长或删除这些状态，并使每次高风险变更具备目标、用途、审批、有效期和可恢复旧值。控制重点是让攻击者无法凭一次高权限会话留下未经所有者知情的第二入口。
    en: This mitigation extends identity security from whether an account is enabled to every durable access edge
      attached to the principal. Organizations should separately inventory passwords and keys, authentication methods,
      device trust, group and role memberships, application permissions, mail delegation, SSH authorization, and equivalent
      local configuration; constrain who can add, replace, extend, or remove each state; and give every high-risk
      change a target, purpose, approval, validity period, and recoverable old value. The objective is to prevent
      one privileged session from leaving a second entry unknown to the owner.
  - zh: 处置必须覆盖全部访问路径，而不是只重置主密码。发现可疑变更后，应先保存变更事件、目录快照、key 或角色标识、发起者、审批和首次使用证据，再撤销相关密钥、认证方法、令牌、会话、角色、委托和设备信任，并验证身份对象恢复到可信基线。过度统一禁止会破坏轮换、自动化和应急访问，因此策略需要把可审计的合法例外与永久宽松授权分开。
    en: Response must cover every access path rather than merely reset the primary password. After a suspicious change,
      preserve the change event, directory snapshot, key or role identifier, initiator, approval, and first-use evidence
      before revoking related keys, authentication methods, tokens, sessions, roles, delegations, and device trust
      and verifying restoration to a trusted baseline. Uniform prohibition can break rotation, automation, and emergency
      access, so policy must distinguish auditable legitimate exceptions from permanently broad authority.
domains:
- enterprise
measures:
- key: identity-state-change-authority
  name:
    zh: 身份状态变更最小权限与强审批
    en: Least Identity-State Change Authority and Strong Approval
  description:
    paragraphs:
    - zh: 将新增凭据、认证方法、设备、组、角色、委托和应用权限的能力从日常账户中移除，使用隔离管理身份、抗钓鱼强认证、按目标和时间限定的 JIT 权限，以及高风险变更的双人或所有者确认。自动化只获得完成明确对象变更所需的最小
        API 权限，并把变更单 ID、发起者和审批者写入不可变审计。
      en: Remove the ability to add credentials, authentication methods, devices, groups, roles, delegations, and
        application permissions from daily accounts. Use isolated administrative identities, phishing-resistant strong
        authentication, target- and time-bounded just-in-time authority, and two-person or owner confirmation for
        high-risk changes. Automation receives only the API permissions needed for an explicit object mutation and
        records change ID, initiator, and approver in immutable audit.
  control_type: preventive
- key: parallel-access-edge-inventory-expiry
  name:
    zh: 并行访问边盘点、到期与复核
    en: Parallel Access-Edge Inventory, Expiry, and Review
  description:
    paragraphs:
    - zh: 为每个身份维护可解析的凭据、认证方法、角色、组、委托、设备和本地授权清单，记录所有者、创建来源、用途、最近使用和到期时间。禁止无业务依据的长期密钥和隐式永久委托，定期执行差异快照与访问复核，并在轮换重叠期结束后验证旧路径确已撤销。
      en: Maintain a resolvable inventory of credentials, authentication methods, roles, groups, delegations, devices,
        and local authorization for every identity, including owner, creation source, purpose, last use, and expiry.
        Prohibit long-lived keys and implicit permanent delegation without business justification, perform periodic
        differential snapshots and access review, and verify that old paths are revoked after a rotation overlap ends.
  control_type: exposure-reduction
- key: all-path-recovery-and-evidence
  name:
    zh: 全路径恢复与证据保全
    en: All-Path Recovery and Evidence Preservation
  description:
    paragraphs:
    - zh: 账户疑似被操纵时，按身份图枚举并撤销所有密码、密钥、认证方法、活跃令牌、会话、设备、角色、组、委托和应用授权，而不是只更改一个秘密。撤销前导出变更审计、状态快照和使用记录，恢复后重新验证权限图、清除未知所有者并监控任何旧路径或关联资源的再次使用。
      en: When manipulation is suspected, enumerate and revoke every password, key, authentication method, active
        token, session, device, role, group, delegation, and application grant in the identity graph rather than changing
        one secret. Export change audit, state snapshots, and use records before revocation, then revalidate the authorization
        graph, remove unknown owners, and monitor for renewed use of any old path or linked resource after recovery.
  control_type: containment
- key: device-trust-enrollment-governance
  name:
    zh: 设备信任注册治理与独立撤销
    en: Device-Trust Enrollment Governance and Independent Revocation
  description:
    paragraphs:
    - zh: 限制自助注册与加入配额，对高价值主体强制抗钓鱼 MFA、管理员或所有者审批、硬件证明、MDM 合规和资产匹配；持续盘点 device ID、owner、trust type、注册者、证书与最近使用。处置时删除恶意设备对象，并分别撤销
        PRT、相关令牌和会话。
      en: Constrain self-service enrollment and join quotas; require phishing-resistant MFA, administrator or owner
        approval, hardware attestation, MDM compliance, and asset matching for high-value principals; and continuously
        inventory device ID, owner, trust type, registrant, certificate, and last use. During response, remove the
        rogue device object and separately revoke its PRT, related tokens, and sessions.
  control_type: preventive
- key: effective-authority-before-after-gate
  name:
    zh: 有效权威变更前后门禁
    en: Effective-Authority Before-and-After Gate
  description:
    paragraphs:
    - zh: 对任何能新增认证器、角色、组、委托、资源策略主体或设备信任的请求，在批准时计算发起者原权限、目标主体/应用的当前有效权限、拟新增 edge 的作用域与变更后可达动作。若低权限管理面可借该变更获得更高资源 authority，要求独立
        owner、安全审批、最小 scope、短有效期和 token/session 刷新；执行后验证实际 post-state 与批准 diff 一致，并阻止未批准的 newly-authorized 操作。
      en: For every request able to add an authenticator, role, group, delegation, resource-policy principal, or device
        trust, approval computes the initiator's original authority, the target principal or application's current
        effective permission, the proposed edge scope, and actions reachable after change. When a lower-authority
        administrative plane can use the mutation to obtain greater resource authority, require independent owner
        and security approval, minimum scope, short validity, and token or session refresh. After execution, verify
        actual post-state against the approved diff and block unapproved newly authorized actions.
  control_type: preventive
applications:
- target_ref: NJT-0083
  use:
    paragraphs:
    - zh: 对既有身份状态操纵，把变更权限、审批、状态盘点、日志保留和恢复演练覆盖到组织实际使用的目录、云 IAM、SaaS、邮件、容器、虚拟化、端点和网络设备。每类访问边必须能够回答谁新增或替换、目标是谁、旧路径是否仍有效、何时到期以及是否被使用；高价值主体的未批准变更先阻断新增路径，再在保存证据后执行全路径恢复。
      en: For manipulation of existing identity state, extend change authority, approval, state inventory, log retention,
        and recovery exercises across the organization's directory, cloud IAM, SaaS, mail, container, virtualization,
        endpoint, and network-device environments. Every access-edge class must answer who added or replaced it, which
        principal was targeted, whether the old path remains valid, when it expires, and whether it was used. For
        unapproved changes to high-value principals, block the added path first and perform all-path recovery after
        preserving evidence.
    - zh: 对 TA0004，同一治理还必须在变更前模拟或解析 effective access，拒绝任何允许发起者通过目标身份/应用、嵌套授权边或设备 claim 获得未审批高权限动作的 mutation。变更后立即比较
        graph/policy、刷新或撤销旧 token，并监控精确 edge 的首次资源消费；处置恢复 pre-state，而不是只删除显示角色或重置主密码。
      en: For TA0004, the same governance must simulate or resolve effective access before mutation and reject a change
        that lets the initiator obtain an unapproved privileged action through a target identity or application, nested
        authorization edge, or device claim. Immediately compare graph or policy after change, refresh or revoke old
        tokens, and monitor first resource consumption through the exact edge. Response restores pre-state rather
        than merely removing a displayed role or resetting the primary password.
  expected_effect:
    paragraphs:
    - zh: 该应用减少能够写入持久身份状态的主体与时段，使未经批准的凭据、角色和委托更快暴露并自动到期，同时让处置覆盖攻击者可能留下的替代入口。攻击者需要控制更严格隔离的管理路径、伪造审批或反复重建已撤销状态，成本和可观察痕迹都会增加。
      en: This application reduces the principals and intervals able to write durable identity state, makes unapproved
        credentials, roles, and delegations surface and expire sooner, and ensures response covers alternative entries
        an adversary may leave. The adversary must control a more tightly isolated administrative path, forge approval,
        or repeatedly rebuild revoked state, increasing both cost and observable traces.
    - zh: 变更权限与资源权限之间的跨域路径变成可见且需独立批准，攻击者不能仅凭一项较窄管理权给自己附加更强身份、entitlement 或 device trust。即使 mutation 成功，before/after
        diff、token refresh 和 first-use gate 会阻止或快速揭示 authority delta，并使恢复能够删除完整授权原因。
      en: Cross-domain paths between mutation authority and resource authority become visible and independently approved,
        preventing an adversary from using one narrower administrative right to attach a stronger identity, entitlement,
        or device trust. Even when mutation succeeds, before-and-after diff, token refresh, and a first-use gate block
        or quickly reveal authority delta and let recovery remove the complete authorization cause.
  limitations:
    paragraphs:
    - zh: 合法业务依赖密钥轮换重叠、服务主体、邮件代理、同步目录和应急账户，错误撤销可能造成跨系统中断；不支持细粒度审计或集中盘点的旧设备仍会留下盲区。若攻击者持续控制变更审批者、身份治理自动化或可信管理主机，控制本身也可能被滥用，因此需要职责分离和独立验证。
      en: Legitimate operations depend on key-rotation overlap, service principals, mail delegates, directory synchronization,
        and emergency accounts, so erroneous revocation can cause cross-system outage. Legacy devices without fine-grained
        audit or centralized inventory remain blind spots. If the adversary continues to control the approver, identity-governance
        automation, or a trusted administrative host, the controls can themselves be abused and therefore require
        separation of duties and independent verification.
    - zh: 跨云、SaaS、目录、容器与本地主机的有效权限模拟可能不完整，deny 条件、外部委托和缓存 token 会让预测与实际结果不同；强制同步刷新也可能中断业务。若审批者、图解析器、MDM 或 policy telemetry
        被攻击者控制，门禁会接受伪造 pre/post 状态，因此需独立资源侧验证和保守降级。
      en: Effective-authority simulation across cloud, SaaS, directory, container, and local hosts can be incomplete,
        while deny conditions, external delegation, and cached tokens make predicted and actual results differ. Forced
        synchronous refresh can interrupt business. If an adversary controls the approver, graph resolver, MDM, or
        policy telemetry, the gate can accept falsified before-and-after state, requiring independent resource-side
        validation and conservative degradation.
- target_ref: NJS-0083-001
  use:
    paragraphs:
    - zh: 对并行认证路径增补，策略显式检测同一主体同时存在的旧、新认证器，并为轮换或迁移定义短重叠期限。第二 key、证书、MFA 方法或 SSH 授权只有绑定具体工单、所有者确认、最小寿命和自动到期后才能生效；恢复按认证器逐项撤销，不能因主密码已更改就结束。
      en: For Parallel Authentication-Path Augmentation, policy explicitly detects old and new authenticators coexisting
        on one principal and defines a short overlap limit for rotation or migration. A second key, certificate, MFA
        method, or SSH authorization takes effect only when bound to a concrete change record, owner confirmation,
        minimum lifetime, and automatic expiry. Recovery revokes authenticator by authenticator and does not end after
        a primary-password change.
  expected_effect:
    paragraphs:
    - zh: 该应用缩短攻击者与合法所有者共享同一主体的时间，使每个并行认证器具有可归因发起者、用途和寿命，并阻止未知第二认证器在密码重置或会话撤销后继续签发访问。
      en: This application shortens the interval in which adversary and legitimate owner share one principal, gives
        every parallel authenticator an attributable initiator, purpose, and lifetime, and prevents an unknown second
        authenticator from issuing access after password reset or session revocation.
  limitations:
    paragraphs:
    - zh: 部分平台不能标识实际用于登录的 key 或认证方法，只能证明存在未批准认证器；真实迁移和高可用轮换也需要短期并存。过短重叠会中断服务，过宽例外会恢复攻击空间，必须用本地依赖和首次使用遥测校准。
      en: Some platforms cannot identify the key or authentication method actually used and can only establish an
        unapproved authenticator. Genuine migration and high-availability rotation also require brief coexistence.
        An overlap that is too short interrupts service, while broad exceptions restore adversary opportunity, so
        local dependencies and first-use telemetry must calibrate enforcement.
- target_ref: NJS-0083-002
  use:
    paragraphs:
    - zh: 对间接授权图增补，控制必须按有效权限而非直接角色名盘点主体，展开嵌套组、委托链与资源策略，并要求每条新增边具有 owner、最小作用域、工单和自动到期。职责分离应阻止主体自授予或同一操作者同时发起和批准高风险边；恢复要移除导致权限的完整路径并刷新相关令牌。
      en: For Indirect Authorization-Graph Augmentation, controls inventory principals by effective privilege rather
        than direct role name, resolve nested groups, delegation chains, and resource policies, and require owner,
        minimum scope, change record, and automatic expiry for every added edge. Separation of duties prevents self-grant
        or one operator both initiating and approving a high-risk edge. Recovery removes the full path supplying privilege
        and refreshes related tokens.
  expected_effect:
    paragraphs:
    - zh: 该应用把隐藏在嵌套或间接关系中的权限变成可审查对象，缩短未批准边的寿命，并阻止仅移除显式角色后仍由另一条委托或组路径继续授权。攻击者必须控制更严格的授权工作流或重复创建可见图差异。
      en: This application makes privilege hidden in nested or indirect relationships reviewable, shortens the lifetime
        of unapproved edges, and prevents authorization from continuing through another delegation or group path after
        only an explicit role is removed. The adversary must control a more rigorous authorization workflow or repeatedly
        create visible graph differences.
  limitations:
    paragraphs:
    - zh: 跨 SaaS、目录、容器与资源策略的有效权限解析可能不完整，deny/allow 优先级和长寿命令牌也会使撤销延迟。错误展开或批量清除可中断业务；治理需要应用所有者验证与分阶段撤销，不能假定一个中央图覆盖所有服务。
      en: Effective-access resolution across SaaS, directories, containers, and resource policies may be incomplete,
        while deny or allow precedence and long-lived tokens can delay revocation. Incorrect expansion or bulk removal
        can interrupt business. Governance needs application-owner validation and staged revocation and cannot assume
        one central graph covers every service.
- target_ref: NJS-0083-003
  use:
    paragraphs:
    - zh: 对身份绑定设备信任附着，组织应限制谁能注册/加入设备、注册时允许何种认证强度、设备是否必须存在于资产与 MDM 清单，以及 device ID、owner、trust type 和证书可存续多久。发现异常时同时隔离终端、删除设备对象、撤销
        PRT/令牌/会话并复核条件访问，不能只重置用户密码。
      en: For Identity-Bound Device-Trust Attachment, organizations constrain who may register or join devices, required
        enrollment authentication strength, whether the device must exist in asset and MDM inventory, and the permitted
        lifetime of device ID, owner, trust type, and certificate. On anomaly, isolate the endpoint, remove the device
        object, revoke PRT, tokens, and sessions, and review Conditional Access together rather than only resetting
        the user password.
  expected_effect:
    paragraphs:
    - zh: 该应用阻止未受管终端轻易取得组织设备特征，使每个新设备关系具有可验证硬件、注册者和审批，并清除密码恢复之外仍可工作的设备信任路径。异常注册会留下认证强度、资产不匹配或独立撤销记录。
      en: This application prevents an unmanaged endpoint from easily acquiring organization device features, gives
        every new device relationship verifiable hardware, registrant, and approval, and removes device-trust paths
        that remain after password recovery. An anomalous enrollment leaves authentication-strength, asset-mismatch,
        or independent-revocation evidence.
  limitations:
    paragraphs:
    - zh: BYOD、自助注册、无硬件证明的旧终端与离线设备会限制强制策略，误删设备可能中断生产访问。某些平台删除目录对象不会立即撤销已签发令牌，因此必须验证令牌寿命与会话失效，并为合法恢复保留受控例外。
      en: BYOD, self-service enrollment, legacy endpoints without hardware attestation, and offline devices constrain
        enforcement, while erroneous device removal can interrupt production access. On some platforms, deleting a
        directory object does not immediately revoke issued tokens, so token lifetime and session invalidation must
        be verified and controlled recovery exceptions retained.
- target_ref: NJT-0201
  use:
    paragraphs:
    - zh: 限制负向身份状态写权限，保存 old/new 与可恢复值，监控 owner post-state，并维护至少两个独立 break-glass 账户与完整恢复演练。
      en: Restrict negative identity-state write authority, retain old and new and recoverable values, monitor owner
        post-state, and maintain at least two independent break-glass accounts with full recovery exercises.
  expected_effect:
    paragraphs:
    - zh: 认证器/授权边被恶意移除时可快速识别、回滚并恢复合法 owner 访问。
      en: Malicious authenticator or authorization-edge removal is rapidly identified, rolled back, and legitimate-owner
        access restored.
  limitations:
    paragraphs:
    - zh: 审批或 break-glass 同时受陷、外部 IdP 或本地状态未采集时仍可能 tenant lockout。
      en: Concurrent compromise of approval or break-glass, external IdP, or uncollected local state can still cause
        tenant lockout.
- target_ref: NJS-0201-001
  use:
    paragraphs:
    - zh: 对密码/SSPR/MFA/恢复方法删除与新增实施强审批、owner 带外通知和 old-value/方法清单保留，测试独立恢复账户。
      en: Apply strong approval, out-of-band owner notification, and old-value or method inventory retention to password,
        SSPR, MFA, and recovery-method deletion or addition and test independent recovery accounts.
  expected_effect:
    paragraphs:
    - zh: 排他认证器置换更难静默完成，owner 路径可恢复。
      en: Exclusive authenticator displacement becomes harder to complete silently and owner paths remain recoverable.
  limitations:
    paragraphs:
    - zh: 某些密码不可恢复、紧急恢复本身可被社会工程，method ID 不完整会延迟定位。
      en: Some passwords cannot be restored, emergency recovery can be socially engineered, and incomplete method
        IDs delay localization.
- target_ref: NJS-0201-002
  use:
    paragraphs:
    - zh: 对 owner/Global Admin/组/角色/委托/policy edge 撤除使用 PIM/JIT、双人审批、graph snapshot 和资源级 break-glass 测试。
      en: Use PIM or JIT, dual approval, graph snapshots, and resource-level break-glass testing for removal of owners,
        Global Admins, groups, roles, delegations, or policy edges.
  expected_effect:
    paragraphs:
    - zh: 授权边可回滚，认证成功但资源 deny 的锁定被快速发现并恢复。
      en: Authorization edges are recoverable and lockout with successful authentication but resource denial is rapidly
        found and restored.
  limitations:
    paragraphs:
    - zh: 嵌套/外部图、传播延迟和审批系统受陷仍会隐藏真实有效边。
      en: Nested or external graphs, propagation delay, and compromised approval can still hide effective edges.
