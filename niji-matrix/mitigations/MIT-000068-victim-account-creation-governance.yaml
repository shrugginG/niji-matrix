schema_version: 2.0.0
type: mitigation
id: MIT-000068
name:
  zh: 受害环境账户创建与生命周期治理
  en: Victim-Environment Account Creation and Lifecycle Governance
summary:
  zh: 以最小创建权限、强审批、初始最小角色、到期、盘点和全链撤销减少攻击者新建持久身份。
  en: Reduce adversary-created persistent identities through least creation authority, strong approval, minimum initial role, expiry, inventory,
    and full-chain revocation.
description:
  paragraphs:
  - zh: 限制可创建账户的主体与接口，对人、服务和设备身份绑定 owner、purpose、role、审批与到期；新身份首次使用要求强认证和监控。可疑时保全创建/使用证据后禁用账户、撤销 tokens/keys/roles 并检查其创建的资源。
    en: Restrict principals and interfaces that create accounts and bind owner, purpose, role, approval, and expiry to human, service, and device
      identities. Require strong authentication and monitoring at first use. On suspicion, preserve creation and use evidence before disabling
      the account, revoking tokens, keys, and roles, and inspecting resources it created.
domains:
- enterprise
measures:
- key: account-create-authority
  name:
    zh: 创建权限、审批与到期
    en: Creation Authority, Approval, and Expiry
  description:
    paragraphs:
    - zh: 使用隔离管理员/JIT 和双人审批，默认最小角色并为临时/服务账户设置 owner 与到期。
      en: Use isolated administrators or JIT and two-person approval, default to minimum role, and assign owner and expiry to temporary or service
        accounts.
  control_type: preventive
- key: account-first-use-recovery
  name:
    zh: 首次使用监控与全链恢复
    en: First-Use Monitoring and Full-Chain Recovery
  description:
    paragraphs:
    - zh: 连接创建与首次使用；可疑时撤销账户全部凭据、token、角色和资源，并保存证据。
      en: Join creation to first use and revoke every credential, token, role, and resource of a suspicious account while preserving evidence.
  control_type: containment
- key: cross-plane-provisioning-attribution
  name:
    zh: 跨控制面投放归因与到期
    en: Cross-Plane Provisioning Attribution and Expiry
  description:
    paragraphs:
    - zh: 对 VM 凭据恢复、来宾扩展、设备编排和集中账户投放使用 JIT 权限与批准 allowlist，将 operation/request ID、目标工作负载、预期账户、owner 和到期传播到下游审计，并在任务完成后撤销临时身份。
      en: Use JIT authority and an approved allowlist for VM credential recovery, guest extensions, device orchestration, and centralized account
        provisioning. Propagate operation or request ID, target workload, expected account, owner, and expiry into downstream audit and revoke
        temporary identities after completion.
  control_type: governance
applications:
- target_ref: NJT-0088
  use:
    paragraphs:
    - zh: 对受害环境所有新身份实施创建授权、稳定 ID 清单、最小初始权限、首次登录验证和自动到期。
      en: Apply creation authorization, stable-ID inventory, minimum initial privilege, first-sign-in verification, and automatic expiry to every
        new identity inside the victim environment.
  expected_effect:
    paragraphs:
    - zh: 减少次级身份入口并使创建者到使用可归因，迫使攻击者控制更高价值身份治理流程。
      en: Reduces secondary identity entry and attributes creator-to-use, forcing control of higher-value identity-governance workflows.
  limitations:
    paragraphs:
    - zh: 自动化和紧急账户需要例外；被攻陷审批者或无审计设备仍可绕过，错误禁用会中断业务。
      en: Automation and emergency accounts require exceptions. A compromised approver or unaudited device can bypass controls, and erroneous
        disablement interrupts business.
- target_ref: NJS-0088-001
  use:
    paragraphs:
    - zh: 为每个窄范围账户绑定唯一 owner、单一业务用途、允许服务/资源集合、来源、最大活动间隔和复核/到期时间；账户即使权限少，也必须在创建与首次使用时接受验证。
      en: Bind every narrow-scope account to one owner, single business purpose, allowed service or resource set, origin, maximum activity interval,
        and review or expiry time. Even low-privilege accounts require validation at creation and first use.
  expected_effect:
    paragraphs:
    - zh: 使稀疏且对象限定的持久入口仍可通过缺少 owner、超期、来源或用途差异被发现，并迫使攻击者扩大活动或控制身份治理记录。
      en: Keeps sparse object-bounded persistence detectable through missing owner, expiry, origin, or purpose discrepancies and forces the adversary
        to expand activity or control identity-governance records.
  limitations:
    paragraphs:
    - zh: 合法服务账户天然低活动且可能长期存在；过短到期会中断自动化，资源级日志缺失时也无法确认实际范围，因此需要应用所有者和调用遥测。
      en: Legitimate service accounts are naturally sparse and long-lived. Short expiry can break automation, and missing object-level logs prevents
        confirmation of actual scope, requiring application owners and call telemetry.
- target_ref: NJS-0088-002
  use:
    paragraphs:
    - zh: 只允许批准的管理主体从指定来源对指定工作负载调用账户恢复或投放功能，并要求 operation ID 与来宾创建事件、预期用户名、SID/UID 和到期回传；任务结束后自动撤销投放账户及上游扩展。
      en: Allow only approved management principals from designated origins to invoke account recovery or provisioning on specified workloads.
        Require the operation ID to return with guest creation event, expected username, SID or UID, and expiry, then automatically revoke the
        provisioned account and upstream extension after completion.
  expected_effect:
    paragraphs:
    - zh: 缩小合法跨面创建路径，使未知云操作与来宾账户无法分别伪装成正常恢复和正常本地身份，并为创建者到首次使用建立稳定链。
      en: Narrows legitimate cross-plane creation paths so an unknown cloud operation and guest account cannot separately resemble normal recovery
        and a normal local identity, establishing stable creator-to-first-use lineage.
  limitations:
    paragraphs:
    - zh: 部分平台不传播 operation 到本地 SID，紧急恢复又可能要求快速创建管理员；攻击者控制批准管理身份或来宾代理时仍可制造一致记录，因此需要独立审批和事后复核。
      en: Some platforms do not propagate an operation to local SID, and emergency recovery may require rapid administrator creation. An adversary
        controlling an approved management identity or guest agent can still produce consistent records, requiring independent approval and post-action
        review.
