schema_version: 2.0.0
type: mitigation
id: MIT-000069
name:
  zh: 事件回调注册、谓词与 Broker 执行治理
  en: Event Callback Registration, Predicate, and Broker-Execution Governance
summary:
  zh: 以最小注册权、可解析谓词、版本化 owner/action 清单、Broker 结果审计和安全禁用流程减少恶意持久回调。
  en: Reduce malicious durable callbacks through least registration authority, parseable predicates, versioned owner and action inventory, broker-outcome audit, and safe disablement procedures.
description:
  paragraphs:
    - zh: >-
        本缓解限制能够创建或修改永久 callback、subscription、rule、filter、consumer、binding 和 hook 的主体与接口，为每个对象绑定 owner、批准谓词、允许 action、Broker、软件包/工单和有效期。WMI namespace、设备/应用规则和用户扩展面分别采用最小 ACL、隔离管理身份与 JIT 写权，未知可执行 consumer 或不可解释条件在上线前进入人工复核。
      en: >-
        This mitigation constrains principals and interfaces able to create or modify permanent callbacks, subscriptions, rules, filters, consumers, bindings, and hooks and binds each object to owner, approved predicate, allowed action, broker, package or change record, and validity. WMI namespaces, device or application rules, and user extension surfaces use least ACL, isolated administration, and JIT write authority, while unknown executable consumers or opaque conditions enter human review before deployment.
    - zh: >-
        控制不能依赖 Broker 进程信誉。组织应将 object/binding、writer/CreatorSID、predicate、匹配事件、callback/operation、provider host 和后继结果跨注册寿命保留，按首次触发复核并支持多情境回放。处置前保全注册与执行证据，再禁用 binding/action、验证合法依赖、删除对象并监控重建；直接封禁 WmiPrvSE 或批量删除回调会破坏管理和业务自动化。
      en: >-
        Control cannot depend on broker-process reputation. Organizations should retain object or binding, writer or CreatorSID, predicate, matching event, callback or operation, provider host, and downstream outcome across registration lifetime, review first trigger, and support multi-context replay. Preserve registration and execution evidence before disabling a binding or action, validating legitimate dependencies, removing the object, and monitoring recreation. Blocking WmiPrvSE or deleting callbacks in bulk breaks administration and business automation.
    - zh: >-
        对 TA0004，治理还必须约束从低权限 writer/caller 到更高 consumer 的委托边。每个高权限 callback 记录可写主体、actual consumer token/hosting model、impersonation/delegation policy、允许 predicate/action/target、pre/post authorization 与到期；默认让 Broker impersonate caller 或使用最小 service identity，并在结果级验证。确认异常权限结果后，除了移除注册，还要撤销由该 object/version 产生的进程、会话、账户、服务、文件/ACL、凭据和远程资源 side effects。
      en: >-
        For TA0004, governance also constrains the delegation edge from a lower-authority writer or caller to a higher consumer. Every privileged callback records writable principals, actual consumer token or hosting model, impersonation or delegation policy, allowed predicate, action, and target, pre-state and post-state authorization, and expiry. Brokers impersonate the caller or use a least-authority service identity by default, with result-level validation. After a confirmed anomalous authority result, response removes the registration and revokes processes, sessions, accounts, services, file or ACL changes, credentials, and remote-resource side effects created by that object and version.
domains: [enterprise]
measures:
  - key: callback-registration-least-authority
    name: {zh: 回调注册最小权限与独立批准, en: Least Callback Registration Authority and Independent Approval}
    description:
      paragraphs:
        - zh: 限制 WMI namespace、规则引擎、解释器 hook、file association 和 Broker 扩展写权，使用隔离管理身份、JIT 授权和高风险 action 的双人批准；持续审计 CreatorSID、writer、权限和远程来源。
          en: Restrict write authority for WMI namespaces, rule engines, interpreter hooks, file associations, and broker extensions, using isolated administrative identities, JIT authorization, and two-person approval for high-risk actions while continuously auditing CreatorSID, writer, permissions, and remote origin.
    control_type: preventive
  - key: predicate-action-owner-inventory
    name: {zh: 谓词、Action 与 Owner 版本清单, en: "Versioned Predicate, Action, and Owner Inventory"}
    description:
      paragraphs:
        - zh: 保存完整及规范化谓词、引用字段、预期匹配集合/频率、允许 action、Broker、owner、包/工单和到期；条件或 action 变化形成新版本，不允许无 owner、不可解析或永久例外对象静默上线。
          en: Preserve complete and normalized predicates, referenced fields, expected match set or frequency, allowed action, broker, owner, package or change record, and expiry. Condition or action changes create a new version, and ownerless, opaque, or permanent-exception objects cannot deploy silently.
    control_type: governance
  - key: callback-broker-outcome-audit
    name: {zh: Callback、Broker 与结果来源审计, en: "Callback, Broker, and Outcome Provenance Audit"}
    description:
      paragraphs:
        - zh: 将 registration/object/binding ID 和 callback/operation/correlation ID 传播到匹配事件、provider host、进程/模块和资源日志，保留到首次触发与对象删除；不能传播精确 ID 的平台记录降级原因和校准时间窗。
          en: Propagate registration, object, or binding ID and callback, operation, or correlation ID into matching-event, provider-host, process or module, and resource logs through first trigger and object removal. Platforms unable to propagate exact IDs record the degradation reason and calibrated time window.
    control_type: detective-support
  - key: safe-callback-disable-and-recovery
    name: {zh: 安全禁用回调与依赖恢复, en: Safe Callback Disablement and Dependency Recovery}
    description:
      paragraphs:
        - zh: 可疑时先导出 filter、consumer、binding、谓词、action、writer 和最近结果，再禁用 binding/action 而非立即销毁全部对象；确认业务 owner 和依赖后清除恶意注册、终止相关会话/进程，并监控对象或 action 被重建。
          en: On suspicion, export filter, consumer, binding, predicate, action, writer, and recent outcomes before disabling the binding or action rather than destroying every object immediately. After validating business owner and dependencies, remove the malicious registration, terminate related sessions or processes, and monitor recreation of the object or action.
    control_type: containment
  - key: broker-authority-confinement-and-effect-revocation
    name: {zh: Broker 权限约束与结果效果撤销, en: Broker Authority Confinement and Result-Effect Revocation}
    description:
      paragraphs:
        - zh: 对能够以 root、SYSTEM 或 service account 执行的 consumer，优先使用 caller impersonation、沙箱/低权限服务身份、method/action/target allowlist 和独立审批；持续比较 writer/caller pre-state 与 actual consumer post-state，并记录首个资源授权结果。事件响应按 registration version 建立 side-effect graph，撤销新增 token/session、账户、服务、任务、进程、文件/ACL 与远程权限，不能只删除 callback。
          en: For consumers able to execute as root, SYSTEM, or a service account, prefer caller impersonation, a sandboxed or least-authority service identity, method, action, and target allowlists, and independent approval. Continuously compare writer or caller pre-state with actual consumer post-state and record the first resource-authorization result. Incident response builds a side-effect graph by registration version and revokes added tokens or sessions, accounts, services, tasks, processes, file or ACL changes, and remote authority rather than deleting only the callback.
    control_type: preventive
applications:
  - target_ref: NJT-0090
    use:
      paragraphs:
        - zh: 对所有可执行持久回调建立注册权、owner/来源、谓词/action、Broker、版本和到期清单，并把首次与高风险触发连接到后继结果。发现未知对象时先确认其跨会话存续和实际 action，再安全禁用 binding、检查依赖并清除，不能只删除进程或只保留静态快照。
          en: Apply registration authority, owner and origin, predicate and action, broker, version, and expiry inventory to every executable durable callback and join first and high-risk triggers to downstream outcomes. For an unknown object, establish cross-session survival and actual action before safely disabling its binding, checking dependencies, and removing it rather than deleting only a process or retaining only a static snapshot.
        - zh: TA0004 应用为每个高权限 callback 增加 writer/caller pre-state、consumer actual token/hosting/impersonation、post-state、允许 target/operation 与首个结果基线。未经批准的低→高委托先阻断；已消费对象则保全 exact version、callback transaction 和 resource side effect，再禁用、隔离 consumer，并撤销所有新增权限效果。
          en: The TA0004 application adds writer or caller pre-state, consumer actual token, hosting or impersonation, post-state, allowed target and operation, and first-result baseline for every privileged callback. Block an unapproved lower-to-higher delegation before use. For an already consumed object, preserve the exact version, callback transaction, and resource side effect, then disable it, isolate the consumer, and revoke every added-authority effect.
    expected_effect:
      paragraphs:
        - zh: 该应用减少未经批准的自动恢复入口，使静态注册、匹配事件和以后执行保持可归因，并迫使攻击者控制更受限的规则治理、部署和审计链或反复留下版本差异。
          en: This application reduces unapproved automatic-recovery entries, keeps static registration, matching event, and later execution attributable, and forces an adversary to control more restricted rule governance, deployment, and audit chains or repeatedly leave version differences.
        - zh: 同时切断未经批准的 writer/caller→高权限 consumer 边，或使正权限差和首个新获准结果可审计；Persistence 与 Privilege Escalation 可以分别确认，受信 Broker 名称不再掩盖权限来源。
          en: It also breaks unapproved writer or caller to higher-consumer edges or makes positive authority difference and the first newly authorized result auditable. Persistence and Privilege Escalation can be confirmed separately, and a trusted-broker name no longer masks authority origin.
    limitations:
      paragraphs:
        - zh: 合法监控、备份、设备管理、辅助功能和用户定制依赖广泛回调，错误禁用会中断业务；旧平台可能不提供 callback ID，控制可信部署身份的攻击者也可提交表面一致对象。治理必须按 Broker 和 owner 分阶段部署并保留回滚。
          en: Legitimate monitoring, backup, device management, accessibility, and user customization depend on broad callbacks, and incorrect disablement interrupts business. Legacy platforms may omit callback IDs, while an adversary controlling a trusted deployment identity can submit an apparently consistent object. Governance must be staged by broker and owner with rollback.
        - zh: 合法 installer、响应和设备管理本就使用低权限前端到高权限 Broker 的委托；一律要求同权会破坏业务。部分平台无法提供 actual token 或资源 authorization，内核/高权限 compromise 还能篡改本地记录。控制需按精确 caller/action/target 批准并把缺失字段标为 coverage gap，不能把 root/SYSTEM 自动定罪或自动放行。
          en: Legitimate installers, response workflows, and device administration inherently delegate from lower-authority front ends to higher brokers, and requiring equal authority everywhere breaks business. Some platforms omit actual token or resource authorization, and kernel or privileged compromise can alter local records. Controls require exact caller, action, and target approval and mark missing fields as a coverage gap rather than automatically convicting or allowing root or SYSTEM.
  - target_ref: NJS-0090-001
    use:
      paragraphs:
        - zh: 要求谓词可解析并记录引用字段、预期匹配事件集合、业务周期、频率范围、owner 与理由；对目标特异或极低频条件执行独立复核和多情境回放，比较版本前后匹配率，不因一次未触发而批准。
          en: Require parseable predicates with referenced fields, expected matching-event set, business cycle, frequency range, owner, and rationale. Independently review and replay target-specific or extremely sparse conditions across multiple contexts and compare match rates before and after versions rather than approving after one non-trigger.
        - zh: 若该窄谓词最终调用高权限 consumer，还要将预期 consumer token、允许 target/operation、writer pre-state 与首个授权结果纳入批准；每次 match 继承 exact registration version。未触发对象只限制潜在 action，已触发且缺权限数据时保留 authority_unresolved，不从低匹配率推断提升。
          en: When the narrow predicate ultimately invokes a privileged consumer, approval also includes expected consumer token, allowed target and operation, writer pre-state, and first authorization result, with every match inheriting the exact registration version. An untriggered object only constrains potential action, while a triggered object lacking authority data remains authority_unresolved rather than inferring elevation from a low match rate.
    expected_effect:
      paragraphs:
        - zh: 该应用降低攻击者以窄条件逃避通用沙箱和短窗口监控的能力，把休眠注册变成可治理风险，并使任何实际触发都能与预期事件集合比较。
          en: This application reduces the ability to evade generic sandboxes and short-window monitoring through narrow conditions, turns dormant registration into governed risk, and makes every actual trigger comparable to the expected event set.
        - zh: 对提权链，攻击者不能再只等到稀有事件借高权限 consumer 执行；谓词、consumer authority 和结果同时受约束，任何新增权限都留下可比较的版本与授权证据。
          en: For an elevation chain, the adversary can no longer merely wait for a rare event to execute through a privileged consumer. Predicate, consumer authority, and outcome are constrained together, and every added permission leaves comparable version and authorization evidence.
    limitations:
      paragraphs:
        - zh: 合法业务规则可能本来低频且包含敏感条件，完整重放成本高，事件样本不足时只能限制 action 与注册权而不能证明安全。环境变化也会让正常谓词匹配率突然下降或上升，需要 owner 解释。
          en: Legitimate business rules can be naturally sparse and contain sensitive conditions, complete replay is costly, and insufficient event samples permit only action and registration constraints rather than proof of safety. Environmental change also shifts normal match rates and requires owner explanation.
        - zh: 谓词分析不能证明 consumer 相对 writer 的权限差；某些稀有维护事件合法调用高权限 Broker。没有 pre-state、actual token 和 target authorization 时，该应用只能降低激活匿迹，不能确认或排除 TA0004。
          en: Predicate analysis cannot prove the consumer's authority difference from the writer, and some rare maintenance events legitimately invoke a privileged broker. Without pre-state, actual token, and target authorization, this application can reduce activation stealth but cannot confirm or exclude TA0004.
  - target_ref: NJS-0090-002
    use:
      paragraphs:
        - zh: 限制 Broker 可执行 action 类型，要求 object/binding、注册者、批准包和 callback/operation ID 随执行传播；对 WmiPrvSE、解释器、应用和规则引擎后继进程取消永久信誉豁免，并用 caller、namespace、consumer 与结果校准。
          en: Restrict action types a broker can execute, require object or binding, registrant, approved package, and callback or operation ID to propagate with execution, remove permanent reputation exemptions for successors of WmiPrvSE, interpreters, applications, and rule engines, and calibrate with caller, namespace, consumer, and outcome.
        - zh: 对可提权 Broker，默认 impersonate caller 或使用最小 service identity，按 method/action/target 限权并把 actual token、delegation decision、pre/post authorization 和 side effect 传播到 callback。确认异常后同时撤销原 caller access、consumer task/process 与新增资源效果，防止删除 binding 后权限仍残留。
          en: For an elevation-capable broker, impersonate the caller or use a least-authority service identity by default, constrain method, action, and target, and propagate actual token, delegation decision, pre-state and post-state authorization, and side effect into the callback. After confirmation, revoke original-caller access, consumer task or process, and added-resource effects together so authority does not remain after binding removal.
    expected_effect:
      paragraphs:
        - zh: 该应用恢复原注册者到后继结果的来源，使受信父进程和服务身份不能单独遮蔽恶意 action；攻击者必须伪造注册、Broker 与进程三层一致性或放弃来源分离优势。
          en: This application restores provenance from the original registrant to the downstream outcome so a trusted parent process and service identity cannot alone mask a malicious action. The adversary must forge consistency across registration, broker, and process layers or abandon provenance separation.
        - zh: 同时把 consumer 的高权限限制在批准调用和目标内，使来源遮蔽不再自动转化为权限提升；攻击者必须突破 impersonation/allowlist 或伪造 caller、registration、token 和结果四层一致性。
          en: It also confines the consumer's greater authority to approved calls and targets so provenance masking no longer automatically converts into elevation. The adversary must defeat impersonation or allowlists or forge consistency across caller, registration, token, and outcome.
    limitations:
      paragraphs:
        - zh: in-process callback 可能没有子进程，旧平台无法传播 ID，严格 action allowlist 也会破坏扩展性；WMI/provider host 被广泛用于管理，不能直接封禁。缺失精确键时只能降级关联并保留正常自动化反例。
          en: An in-process callback can have no child process, legacy platforms cannot propagate IDs, and strict action allowlists can break extensibility. WMI and provider hosts are widely used for administration and cannot simply be blocked. Missing exact keys require lower-confidence linkage and legitimate-automation counterexamples.
        - zh: 某些 consumer 必须以固定 service identity 运行且无法安全 impersonate；过窄 target policy 会破坏安装、修复和设备事件。缺 actual token 或 resource authorization 时只能阻断高风险 action 或标记 coverage gap，不能假定 service account 必然提升或必然安全。
          en: Some consumers must run under a fixed service identity and cannot safely impersonate, while an overly narrow target policy breaks installation, repair, and device events. Without actual token or resource authorization, controls can block high-risk actions or mark a coverage gap but cannot assume a service account necessarily elevates or is necessarily safe.
