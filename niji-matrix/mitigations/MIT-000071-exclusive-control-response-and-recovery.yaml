schema_version: 2.0.0
type: mitigation
id: MIT-000071
name: {zh: 排他控制的独立响应、证据保全与可信恢复, en: "Independent Response, Evidence Preservation, and Trusted Recovery for Exclusive Control"}
summary:
  zh: 以带外隔离、可信变更来源、before/after 全入口盘点、方向化删除审计和全路径重建，阻止攻击者把自修补或选择性清除转化为唯一持续控制。
  en: Use out-of-band isolation, trusted change provenance, complete before and after entry inventory, directional deletion audit, and all-path rebuild to prevent adversary self-patching or selective cleanup from becoming sole continuing control.
description:
  paragraphs:
    - zh: T1668 难以仅靠禁止 patch、service stop 或 kill 预防，因为这些都是合法管理和响应功能。本缓解限制谁能执行高风险排除动作并把命令、API、actor、target、old/new、结果和工单保存在独立管理面，同时周期盘点漏洞、服务、账户、密钥、任务、进程和网络通道。目标是保留方向与选择性，而不是因对象被清除就信任清除者。
      en: T1668 cannot be prevented by simply prohibiting patch, service stop, or kill because those are legitimate administration and response functions. This mitigation constrains who can perform high-risk exclusion actions and retains command, API, actor, target, old and new state, outcome, and change record in an independent management plane while periodically inventorying vulnerabilities, services, accounts, keys, tasks, processes, and network channels. The objective is to preserve direction and selectivity rather than trust a cleaner because an object disappeared.
    - zh: 恢复不能只确认原漏洞已修补或竞争恶意软件已消失。疑似排他控制时先隔离但保留远程日志和快照，列举历史/当前全部入口与对象，验证每个 patch/stop/delete 的主体和批准，再从可信镜像/固件重建高风险资产、轮换所有账户/密钥/证书、撤销未知服务/任务/会话/通道并验证后继访问停止。受污染备份与管理面也需独立复核。
      en: Recovery cannot stop after confirming the original vulnerability is patched or competing malware is gone. On suspected exclusive control, isolate while preserving remote logs and snapshots, enumerate every historical and current entry and object, validate the principal and approval for each patch, stop, or delete, then rebuild high-risk assets from trusted images or firmware, rotate every account, key, and certificate, revoke unknown services, tasks, sessions, and channels, and verify downstream access ends. Contaminated backups and management planes also require independent review.
domains: [enterprise]
measures:
  - key: trusted-exclusion-change-provenance
    name: {zh: 排除变更的可信来源与 JIT 权限, en: "Trusted Provenance and JIT Authority for Exclusion Changes"}
    description: {paragraphs: [{zh: 只允许受签名编排、隔离 JIT 管理身份和具体工单执行补丁、停服、账户降权、任务/服务删除与批量终止，并把 actor/session/process、命令/API、目标和结果远程保全。, en: "Allow only signed orchestration, isolated JIT administrative identities, and concrete change records to patch, stop services, deprivilege accounts, delete tasks or services, or terminate at scale, and retain actor, session or process, command or API, target, and outcome remotely."}]}
    control_type: governance
  - key: before-after-entry-object-inventory
    name: {zh: 带外 Before/After 全入口与对象盘点, en: "Out-of-Band Before and After Complete Entry and Object Inventory"}
    description: {paragraphs: [{zh: 从独立控制面周期保存漏洞、端口/服务、账户/密钥、web shell、任务/cron、进程、Registry 和网络通道状态，清除时冻结前后集合并标记恶意证据与 owner。, en: "Periodically retain vulnerability, port or service, account or key, web shell, task or cron, process, Registry, and network-channel state from an independent control plane and freeze before and after sets with malicious evidence and owner during cleanup."}]}
    control_type: detective-support
  - key: directional-termination-deletion-audit
    name: {zh: 终止与删除的有向审计, en: "Directional Termination and Deletion Audit"}
    description: {paragraphs: [{zh: 将 terminator/deleter 与 target object 建立有向边，连接清除前恶意证据、清除结果和清除后存续入口；EDR/响应者与攻击者使用相同命令时通过可信 session、工单和独立通信确认。, en: "Build a directed edge from terminator or deleter to target object and join pre-cleanup malicious evidence, cleanup outcome, and post-cleanup surviving entry. When EDR or responders and adversaries use the same commands, validate through trusted session, change record, and independent communication."}]}
    control_type: detective-support
  - key: trusted-rebuild-and-full-revocation
    name: {zh: 可信重建与全部入口撤销, en: "Trusted Rebuild and Full Entry Revocation"}
    description: {paragraphs: [{zh: 从可信映像/固件重建受影响资产，轮换全部凭据、密钥和证书，撤销未知账户、服务、任务、会话与网络通道，复核补丁来源和管理面，并监控清除对象或入口被重建。, en: "Rebuild affected assets from trusted images or firmware, rotate every credential, key, and certificate, revoke unknown accounts, services, tasks, sessions, and network channels, validate patch provenance and management planes, and monitor recreation of removed objects or entries."}]}
    control_type: containment
applications:
  - target_ref: NJT-0091
    use: {paragraphs: [{zh: 在疑似排他控制时冻结原利用、替代入口、排除变更和清除前后对象证据，按 actor→target 检查方向并列举仍存入口；从独立管理面验证工单和操作员后执行可信重建与全路径撤销，不把“当前已修补/更干净”作为处置完成条件。, en: "On suspected exclusive control, freeze evidence of original exploitation, alternative entry, exclusion change, and before and after objects, inspect direction through actor-to-target edges, and enumerate surviving entries. After validating change records and operators from an independent management plane, perform trusted rebuild and full-path revocation rather than treating currently patched or cleaner as response completion."}]}
    expected_effect: {paragraphs: [{zh: 消除当前姿态产生的虚假安全感，保留攻击者排除竞争路径的方向，并迫使其同时控制独立变更、快照、响应和恢复证据才能维持唯一入口。, en: "Eliminates false assurance from current posture, preserves the direction of adversary exclusion of competing paths, and forces the operator to control independent change, snapshot, response, and recovery evidence to maintain sole entry."}]}
    limitations: {paragraphs: [{zh: 全量快照、重建和凭据轮换成本高，业务关键设备可能无法立即离线；旧设备和短生命周期容器缺少历史，受污染备份或管理面会重新引入入口。必须按风险分阶段但保持远程证据采集。, en: "Complete snapshots, rebuild, and credential rotation are costly, and business-critical devices may not go offline immediately. Legacy devices and short-lived containers lack history, while contaminated backups or management planes can reintroduce entry. Response must be staged by risk while remote evidence collection continues."}]}
  - target_ref: NJS-0091-001
    use: {paragraphs: [{zh: 对入侵后 patch、端口关闭、服务停用或账户降权要求独立批准，并在确认原面关闭时同时搜索更早创建的账户、密钥、web shell、服务、隧道与后继访问。外部姿态历史和不可变 exploit 日志保留“先入侵、后关门”的顺序。, en: "Require independent approval for post-compromise patching, port closure, service disablement, or account deprivileging and search simultaneously for earlier-created accounts, keys, web shells, services, tunnels, and downstream access while confirming the original surface is closed. External posture history and immutable exploit logs preserve compromise first and closure later."}]}
    expected_effect: {paragraphs: [{zh: 阻止攻击者用正确的补丁状态结束调查，使原入口、变更 actor 和替代入口的不对称可见；攻击者必须伪造更受限的变更来源或接受后门被一并清除。, en: "Prevents an adversary from ending investigation with a correct patch state and exposes asymmetry among original entry, change actor, and alternative entry. The adversary must forge a more restricted change source or accept removal of the backdoor as well."}]}
    limitations: {paragraphs: [{zh: 自动更新和紧急修复可能早于工单且补丁本身正确，管理员身份也可能被盗；缺少历史利用、账户/服务创建或补丁后访问时仍难证明谁关门，必须保留不确定性。, en: "Automatic update and emergency remediation can precede a change record and the patch itself can be correct, while administrator identities can be stolen. Without historical exploitation, account or service creation, or post-patch access, who closed the door remains uncertain and must be reported as such."}]}
  - target_ref: NJS-0091-002
    use: {paragraphs: [{zh: 在终止/删除前远程快照进程、任务、服务、账户、文件和 Registry，记录清除 actor/session 与 target，并在清除后比较 watchdog、后门用户、新 cron/service、miner 和网络通道。未知主体清除恶意对象也不得自动加入白名单。, en: "Before termination or deletion, remotely snapshot processes, tasks, services, accounts, files, and Registry, record cleanup actor or session and target, and compare watchdogs, backdoor users, new cron or services, miners, and network channels afterward. An unknown principal removing malware cannot be automatically allowlisted."}]}
    expected_effect: {paragraphs: [{zh: 保留竞争清除的方向与选择性，使攻击者难以通过减少其他恶意噪声隐藏自身存续，并让 EDR/响应者清除与攻击者清除可以按来源区分。, en: "Preserves direction and selectivity of competitor removal so an adversary cannot easily hide its own survival by reducing other malicious noise and separates EDR or responder cleanup from adversary cleanup by provenance."}]}
    limitations: {paragraphs: [{zh: 高速终止可能早于快照，多个操作者共享工具时 owner 不明确，合法 EDR 也会选择性清除；需要可信传感器、恶意对象独立标签和清除后长期观察，不能单靠进程名。, en: "Rapid termination can precede snapshots, ownership is unclear when operators share tools, and legitimate EDR also removes selectively. Trusted sensors, independent malicious-object labels, and long post-cleanup observation are required rather than process names alone."}]}
evidence_refs: [REF-000184, REF-000314, REF-000315, REF-000316]
