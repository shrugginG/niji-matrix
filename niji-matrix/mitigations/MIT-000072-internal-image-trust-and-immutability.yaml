schema_version: 2.0.0
type: mitigation
id: MIT-000072
name: {zh: 内部镜像信任、不可变引用与置备验证, en: Internal Image Trust Immutable References and Provisioning Verification}
summary: {zh: 以最小镜像写权限、不可变 tag、digest pinning、签名/SBOM 与启动前验证阻断镜像谱系植入。, en: "Block image-lineage implantation through least image-write authority, immutable tags, digest pinning, signature or SBOM, and pre-launch verification."}
description: {paragraphs: [{zh: 本缓解隔离 builder 与 registry 写权限，为镜像生成可验证签名和 SBOM，禁止生产可变 tag 或在 admission 时解析并固定 digest，并在每次置备前验证实际内容身份。可疑时撤销 digest、停止新置备并从可信基线重建所有消费实例。, en: "This mitigation isolates builders and registry write authority, generates verifiable signatures and SBOMs, prohibits mutable production tags or resolves and pins digests at admission, and verifies actual content identity before every provisioning event. On suspicion revoke the digest stop new provisioning and rebuild all consuming instances from a trusted baseline."}]}
domains: [enterprise]
measures:
- {key: image-write-and-signing, name: {zh: 镜像写入与签名隔离, en: Isolated Image Write and Signing}, description: {paragraphs: [{zh: 使用 JIT push 权限、隔离 builder、独立签名者与每 digest 审批。, en: Use JIT push authority isolated builders independent signers and per-digest approval.}]}, control_type: preventive}
- {key: immutable-reference, name: {zh: 不可变引用与 Digest 固定, en: Immutable Reference and Digest Pinning}, description: {paragraphs: [{zh: 禁止生产 tag 重定向或在 admission 将名称解析为批准 digest，并记录实际 pull 身份。, en: Resolve production references to approved immutable digests at admission and record actual pull identity.}]}, control_type: preventive}
- {key: provisioning-verification, name: {zh: 置备前谱系验证与全实例恢复, en: Pre-Provisioning Lineage Verification and Full-Instance Recovery}, description: {paragraphs: [{zh: 启动前验证签名、SBOM、builder 和批准，并在发现问题时重建所有消费实例。, en: Verify signature SBOM builder and approval before start and rebuild every consuming instance on failure.}]}, control_type: containment}
applications:
- target_ref: NJT-0092
  use: {paragraphs: [{zh: 限制内部镜像创建/修改，按 digest 记录来源和批准，在置备时验证实际身份，并对可疑 digest 的所有历史与当前实例执行范围恢复。, en: "Restrict internal image creation and modification, record provenance and approval per digest, verify actual identity at provisioning, and scope recovery to every historical and current instance of a suspicious digest."}]}
  expected_effect: {paragraphs: [{zh: 切断攻击者从单一上游镜像反复恢复入口的能力，并保留 push 到实例的完整归因。, en: Breaks repeated restoration of entry from one upstream image and preserves complete attribution from push to instance.}]}
  limitations: {paragraphs: [{zh: 被攻陷 builder/签名者仍可产生一致元数据，重建大量实例可能影响可用性。, en: A compromised builder or signer can produce consistent metadata and rebuilding many instances may affect availability.}]}
- target_ref: NJS-0092-001
  use: {paragraphs: [{zh: 对生产引用启用不可变 tag 或 digest pinning，任何 retag 必须新审批并触发消费实例核查。, en: Enable immutable tags or digest pinning for production references and require new approval plus consumer-instance review for any retag.}]}
  expected_effect: {paragraphs: [{zh: 使引用不再能在规范不变时静默改变内容，迫使攻击者留下 deployment 或批准变化。, en: Prevents silent content change under an unchanged specification and forces a deployment or approval change.}]}
  limitations: {paragraphs: [{zh: 某些发布流程依赖可变 tag，迁移需要兼容控制；已缓存恶意 digest 仍须撤销和清理。, en: Some release processes depend on mutable tags and need compatibility controls during migration; cached malicious digests still require revocation and cleanup.}]}
- target_ref: NJS-0092-002
  use: {paragraphs: [{zh: 每次扩缩容、重建和灾备前重新验证 digest、签名、SBOM 与批准状态，并阻止已撤销或未知镜像启动。, en: "Revalidate digest, signature, SBOM, and approval before every scaling, rebuild, and recovery event and block revoked or unknown images."}]}
  expected_effect: {paragraphs: [{zh: 将上游植入的检测机会前移到未来实例执行之前，并使延迟不能绕过策略。, en: Moves detection of an upstream implant before future instance execution and prevents delay from bypassing policy.}]}
  limitations: {paragraphs: [{zh: 控制平面不可用会阻塞恢复，离线/边缘节点可能无法实时验证；需要缓存可信证明和失效策略。, en: Control-plane unavailability can block recovery and offline or edge nodes may not verify in real time; trusted proof caching and expiry policy are required.}]}
evidence_refs: [REF-000185, REF-000186]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-11', modified: '2026-09-11', contributors: [Niji Matrix Research], reviewers: []}

