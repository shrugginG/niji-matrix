schema_version: 2.0.0
type: mitigation
id: MIT-000073
name:
  zh: 认证路径完整性与策略例外治理
  en: Authentication-Path Integrity and Policy-Exception Governance
summary:
  zh: 以受保护验证器、独立联合信任盘点、最小策略写权、限时例外和全路径恢复减少攻击者建立选择性持久认证入口的机会。
  en: Reduce opportunities to establish selective durable authentication entries through protected validators, independent federation-trust inventory,
    least policy-write authority, time-bounded exceptions, and all-path recovery.
description:
  paragraphs:
  - zh: 本缓解把认证安全对象从“账户密码和 MFA 是否存在”扩展到决定请求最终结果的组件、内存流程、加载模块、联合信任、签名证书、条件与排除集合。组织应将认证组件的构建和更新、联合域及证书、MFA/Conditional Access/IAM 策略纳入独立版本与 owner
      管理，限制能够改变它们的身份、主机和 API，并使每次高风险变化具有双人批准、明确作用域、有限寿命和可验证回滚。
    en: This mitigation expands authentication security beyond whether an account password and MFA exist to components, in-memory flows, loaded
      modules, federation trust, signing certificates, conditions, and exclusion sets that determine final request outcome. Organizations should
      independently version and assign owners to authentication-component build and update, federation domains and certificates, and MFA, Conditional
      Access, or IAM policy; constrain identities, hosts, and APIs able to change them; and give every high-risk mutation two-person approval,
      explicit scope, bounded lifetime, and verifiable rollback.
  - zh: 处置不能只重置用户密码。发现异常组件、信任或例外后，应先保全版本、内存/文件度量、证书、old/new 策略、发起者、请求和资源结果，再从可信介质恢复验证器，移除恶意信任或排除，轮换相关签名和管理秘密，撤销全部令牌与会话，并验证每个原应失败的情境重新失败。高可用、联合迁移和
      break-glass 需要受控例外；治理目标是让例外可归因、可到期和可演练，而不是禁止所有变更。
    en: Response cannot stop at a user-password reset. After finding an anomalous component, trust, or exception, preserve version, memory or
      file measurement, certificate, old and new policy, initiator, request, and resource outcome; restore the validator from trusted media; remove
      malicious trust or exclusions; rotate related signing and administrative secrets; revoke every token and session; and verify that each context
      expected to fail does so again. High availability, federation migration, and break-glass require controlled exceptions. Governance should
      make exceptions attributable, expiring, and testable rather than prohibit every change.
domains:
- enterprise
measures:
- key: validator-build-load-integrity
  name:
    zh: 验证器构建、加载与运行完整性
    en: Validator Build, Load, and Runtime Integrity
  description:
    paragraphs:
    - zh: 对域控制器、PAM/SSO、VPN 与网络设备认证组件实施受保护进程、签名或受信启动、只读系统面、隔离构建和更新、同版本 hash/页/段度量及加载模块允许清单。更新使用独立签名者和可回滚包，运行状态与磁盘文件分别验证，避免只检查路径或版本标签。
      en: Apply protected process, signing or measured boot, read-only system surfaces, isolated build and update, same-version hash or page or
        section measurement, and loaded-module allowlists to domain-controller, PAM or SSO, VPN, and network-device authentication components.
        Use independent signers and recoverable packages for updates and validate runtime separately from files on disk rather than checking only
        path or version label.
  control_type: preventive
- key: federation-trust-key-governance
  name:
    zh: 联合信任与签名密钥独立治理
    en: Independent Federation-Trust and Signing-Key Governance
  description:
    paragraphs:
    - zh: 盘点每个联合域、issuer、metadata endpoint、签名证书指纹、有效期与 owner，限制信任变更权限并要求双人批准。签名私钥使用硬件保护和独立轮换；新增或重叠证书必须绑定迁移窗口。定期从受信外部视角导出并比较联合配置，避免被接管的身份平台自证正常。
      en: Inventory every federation domain, issuer, metadata endpoint, signing-certificate fingerprint, validity, and owner; constrain trust-change
        authority and require two-person approval. Hardware-protect and independently rotate signing private keys, and bind added or overlapping
        certificates to a migration window. Regularly export and compare federation configuration from a trusted external view so a compromised
        identity plane cannot attest itself healthy.
  control_type: preventive
- key: policy-exception-least-authority
  name:
    zh: 策略例外最小权限、批准与到期
    en: Least Policy-Exception Authority, Approval, and Expiry
  description:
    paragraphs:
    - zh: 从日常身份中移除修改 MFA、Conditional Access、受信位置和等价 IAM 条件的权限，使用隔离管理身份、抗钓鱼 MFA、按目标与时间限定的 JIT 角色及高风险变化的双人批准。每个 exclude 或信任条件必须记录 owner、业务理由、最小有效作用域、命中监控和自动到期，禁止无所有者的永久例外。
      en: Remove authority to modify MFA, Conditional Access, trusted locations, and equivalent IAM conditions from daily identities. Use isolated
        administrative identities, phishing-resistant MFA, target- and time-bounded JIT roles, and two-person approval for high-risk changes.
        Every exclusion or trust condition needs an owner, business rationale, minimum effective scope, match monitoring, and automatic expiry;
        ownerless permanent exceptions are prohibited.
  control_type: governance
- key: independent-decision-differential
  name:
    zh: 独立认证决策差分与持续导出
    en: Independent Authentication-Decision Differential and Continuous Export
  description:
    paragraphs:
    - zh: 将组件/信任版本、策略 old/new 和逐请求认证结果导出到独立保留面，使用无生产能力的 canary 证明与代表性主体、设备、位置、应用和认证流比较可信与生产结果。覆盖正确、错误和 canary 输入，记录 request/correlation ID 与逐策略
        decision；异常时先隔离验证，不在生产账户穷举秘密。
      en: Export component or trust versions, policy old and new state, and request-level authentication outcomes to an independent retention
        plane. Compare trusted and production results with canary proofs that have no production capability and representative principals, devices,
        locations, applications, and authentication flows. Cover correct, wrong, and canary input and retain request or correlation ID plus per-policy
        decision. Validate anomalies in isolation rather than exhaust secrets against production accounts.
  control_type: detective-support
- key: all-path-identity-recovery
  name:
    zh: 全认证路径恢复与会话失效
    en: All-Authentication-Path Recovery and Session Invalidation
  description:
    paragraphs:
    - zh: 认证基础设施疑似被改变时，从可信介质重建验证器或受影响节点，恢复联合与策略基线，轮换签名证书、管理凭据和相关密钥，撤销全部令牌、会话与 refresh state，并对异常证明和被排除情境重新测试。恢复前保全组件、内存、证书、策略和使用证据，恢复后持续监控旧 signer、例外和会话再次出现。
      en: When authentication infrastructure may be changed, rebuild validators or affected nodes from trusted media, restore federation and policy
        baselines, rotate signing certificates, administrative credentials, and related keys, revoke all tokens, sessions, and refresh state,
        and retest anomalous proofs and formerly excluded contexts. Preserve component, memory, certificate, policy, and use evidence before recovery
        and monitor after recovery for reappearance of old signers, exceptions, and sessions.
  control_type: containment
applications:
- target_ref: NJT-0093
  use:
    paragraphs:
    - zh: 对认证路径持久操纵，将组件运行完整性、联合信任、策略例外、逐请求 decision 与恢复演练统一纳入身份基础设施控制。每个验证器、联合域和策略必须回答谁能改变、当前可信版本是什么、哪些证明或作用域会得到不同结果、变化何时到期以及相关令牌/会话是否仍有效；高价值变更在隔离管理面批准并导出到不可由同一管理员删除的保留域。
      en: For Authentication-Path Persistence Manipulation, govern component runtime integrity, federation trust, policy exceptions, request-level
        decisions, and recovery exercises as one identity-infrastructure control. Every validator, federation domain, and policy must answer who
        can change it, which version is trusted, which proofs or scopes receive different outcomes, when the change expires, and whether related
        tokens or sessions remain valid. Approve high-value changes in an isolated administration plane and export them to retention the same
        administrator cannot delete.
  expected_effect:
    paragraphs:
    - zh: 该应用减少一次高权限会话可留下持久认证分支的表面，并把组件/信任/策略变化与实际异常允许连接成可审查痕迹。攻击者必须同时突破更严格的构建、签名或策略管理面，伪造独立审批和导出，或在每次恢复后重建状态，从而增加成本和暴露机会。
      en: This application reduces the surface on which one privileged session can leave a durable authentication branch and connects component,
        trust, or policy change to actual anomalous allow as reviewable evidence. The adversary must compromise a more restricted build, signing,
        or policy-administration plane, forge independent approval and export, or rebuild state after each recovery, increasing cost and exposure.
  limitations:
    paragraphs:
    - zh: 认证基础设施具有高可用、灾难恢复、联合迁移和兼容性要求，错误回滚或证书轮换会造成广泛锁定；旧设备可能缺少运行度量和逐请求 decision。若攻击者持续控制构建、硬件信任、身份管理员和日志保留面，控制也可被伪造，因此需要职责分离、离线恢复材料和跨域验证。
      en: Authentication infrastructure has high-availability, disaster-recovery, federation-migration, and compatibility requirements, and a
        bad rollback or certificate rotation can cause broad lockout. Legacy devices may lack runtime measurement and request-level decision logs.
        If the adversary continues to control build, hardware trust, identity administration, and retention, the controls can be forged and require
        separation of duties, offline recovery material, and cross-domain verification.
- target_ref: NJS-0093-001
  use:
    paragraphs:
    - zh: 对选择性后门秘密接受，分别保护验证器运行状态与联合签名信任。域控制器/PAM/VPN 使用受保护进程、签名模块、同版本内存/文件度量和重启后验证；联合身份使用独立证书清单、硬件保护私钥、双人信任变更和 signer 级令牌监控。隔离测试以不可用于生产的 canary、正确输入和普通错误输入比较黄金与生产结果。
      en: For Selective Backdoor-Secret Acceptance, protect validator runtime and federation signing trust separately. Domain controllers, PAM,
        and VPNs use protected processes, signed modules, same-version memory and file measurement, and post-restart validation. Federation uses
        an independent certificate inventory, hardware-protected private keys, two-person trust changes, and signer-level token monitoring. Isolated
        testing compares golden and production outcomes using a production-incapable canary, correct input, and ordinary wrong input.
  expected_effect:
    paragraphs:
    - zh: 该应用阻止攻击者轻易在正常密码旁增加第二成功证明，使主密码补丁、异常模块或攻击者证书产生独立完整性和信任差异；发现后通过可信重建、证书轮换和全会话撤销清除主密码或自签令牌在普通密码重置后仍可工作的路径。
      en: This application prevents an adversary from easily adding a second successful proof beside normal passwords, causing a master-password
        patch, anomalous module, or attacker certificate to produce independent integrity and trust differences. Trusted rebuild, certificate
        rotation, and all-session revocation then remove paths by which a master password or self-issued token would survive ordinary password
        reset.
  limitations:
    paragraphs:
    - zh: 未知后门秘密无法穷举，真实密码不得写入检测日志，纯内存变化可能在采集前消失；高可用证书重叠和热补丁也会形成合法差异。隔离测试不能替代运行度量，反之 hash 变化也不能证明异常证明已被使用，必须结合状态和结果并避免破坏生产认证。
      en: Unknown backdoor secrets cannot be exhausted, real passwords must not enter detection logs, and a purely in-memory change can disappear
        before acquisition. High-availability certificate overlap and hot patching also create legitimate differences. Isolated testing cannot
        replace runtime measurement, while a hash change cannot prove use of an anomalous proof; state and outcome must be combined without disrupting
        production authentication.
- target_ref: NJS-0093-002
  use:
    paragraphs:
    - zh: 对范围化认证策略例外，限制策略和受信位置写权，要求每个排除具有 owner、工单、最小主体/设备/来源/资源作用域、双人批准、命中告警和自动到期。版本导出必须显示完整 include/exclude 与 old/new，而不是只展示 enabled；将每次 not-applied、单因素或弱化结果以
        policy、request/correlation 和 token/session 键连接到后续资源访问。
      en: For Scoped Authentication-Policy Exception, restrict policy and trusted-location write authority and require each exclusion to have
        an owner, change record, minimum principal, device, origin, or resource scope, two-person approval, match alerting, and automatic expiry.
        Version export must show complete include and exclude plus old and new state rather than only enabled. Join every not-applied, single-factor,
        or weakened result to downstream resource access through policy, request or correlation, and token or session keys.
  expected_effect:
    paragraphs:
    - zh: 该应用缩短未经批准例外的寿命，使总体策略仍启用时的每个窄绕过具有可归因变更者和实际命中记录，并阻止攻击者把一个被攻陷主体、设备或受信来源长期藏在排除集合中。攻击者必须控制更受限的策略管理与审批路径，或反复创建会触发差分和命中告警的状态。
      en: This application shortens unapproved-exception lifetime, gives every narrow bypass under an enabled overall policy an attributable writer
        and actual match record, and prevents a compromised principal, device, or trusted origin from remaining hidden in exclusions indefinitely.
        The adversary must control a more restricted policy-administration and approval path or repeatedly create state that triggers differential
        and match alerts.
  limitations:
    paragraphs:
    - zh: break-glass、服务主体、设备注册 bootstrap、外部协作和故障恢复确实需要低频例外，过短到期或错误嵌套解析会锁定合法访问。部分 IdP 不记录逐策略 decision 或在令牌签发后延迟执行新策略，因此治理必须按平台校准，保留受控例外，并验证撤销后令牌与会话实际失效。
      en: Break-glass, service principals, device-registration bootstrap, external collaboration, and failure recovery genuinely require sparse
        exceptions, while expiry that is too short or incorrect nested-scope resolution can lock out legitimate access. Some identity providers
        omit per-policy decisions or delay application of new policy after token issuance. Governance must be calibrated per platform, preserve
        controlled exceptions, and verify that tokens and sessions actually become invalid after revocation.
- target_ref: NJT-0166
  use:
    paragraphs:
    - zh: 对离权威 Web 认证材料构造，保护活动签名密钥与集成秘密，建立 signer/issuer 清单，并在疑似伪造时轮换密钥、撤销全部相关会话和验证依赖方受众/时限规则。
      en: For off-authority web authentication material, protect active signing keys and integration secrets, inventory signers and issuers, and
        on suspected forgery rotate keys, revoke all related sessions, and validate relying-party audience and lifetime rules.
  expected_effect:
    paragraphs:
    - zh: 缩小攻击者可独立构造可信材料的秘密面，并使信任变化、材料接受和恢复动作可关联。
      en: Reduce the secrets with which an adversary can independently construct trusted material and make trust change, material acceptance,
        and recovery actions correlatable.
  limitations:
    paragraphs:
    - zh: 已泄露材料可能在轮换前生成会话；第三方 SaaS 的验证和撤销语义不同，恢复需要逐依赖方验证。
      en: Leaked material may create sessions before rotation. Third-party SaaS validation and revocation semantics differ, requiring per-relying-party
        recovery validation.
- target_ref: NJS-0166-001
  use:
    paragraphs:
    - zh: 把活动 AD FS 或等价 signer 放入硬件保护和隔离管理，完整记录签发，并要求依赖方把接受事件回连 IdP 事务；异常时同时轮换 signer 与撤销其签发会话。
      en: Place active AD FS or equivalent signers under hardware protection and isolated administration, retain complete issuance, and require
        relying parties to join acceptance to IdP transactions; on anomaly rotate the signer and revoke sessions issued under it.
  expected_effect:
    paragraphs:
    - zh: 使链外完整证明必须突破更强的密钥保护，且依赖方接受缺少签发谱系时形成检测和恢复信号。
      en: Force off-chain complete proof minting to defeat stronger key protection and make acceptance without issuance lineage a detection and
        recovery signal.
  limitations:
    paragraphs:
    - zh: IdP 发起 SSO、灾备节点和日志缺口可形成表面差异；不能仅以缺少一条签发日志宣称伪造。
      en: IdP-initiated SSO, disaster-recovery nodes, and logging gaps can create apparent differences; one missing issuance event alone does
        not prove forgery.
