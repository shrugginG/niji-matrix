schema_version: 2.0.0
type: mitigation
id: MIT-000075
name: {zh: Office 扩展与信任面治理, en: Office Extension and Trust-Surface Governance}
summary: {zh: 限制 Office 扩展写入，集中管理 trusted locations，要求签名/owner，并约束 Office 后继行为。, en: Restrict Office extension writes centrally manage trusted locations require signature or owner and constrain Office successor behavior.}
description: {paragraphs: [{zh: 本缓解禁用不需要的宏、add-in 和旧 Outlook 功能，集中策略管理 trusted/startup locations，最小化写权限并为每个扩展绑定签名、owner、来源、版本和批准；同时启用 Office ASR 与加载审计。发现异常时撤销扩展并检查其生成的会话、任务和凭据。, en: "This mitigation disables unnecessary macros, add-ins, and legacy Outlook features; centrally manages trusted or startup locations; minimizes write authority; binds every extension to signature owner origin version and approval; and enables Office ASR plus load audit. On anomaly revoke the extension and inspect sessions tasks and credentials it created."}]}
domains: [enterprise]
measures:
- {key: office-extension-allowlist, name: {zh: Office 扩展签名与 Owner 清单, en: Office Extension Signature and Owner Inventory}, description: {paragraphs: [{zh: 只允许批准 hash/signature 的模板、add-in 与持久 Outlook 对象，并设置 owner/版本/到期。, en: Allow only approved template add-in and durable Outlook object hashes or signatures with owner version and expiry.}]}, control_type: preventive}
- {key: office-trust-surface-control, name: {zh: Office 信任与启动面权限控制, en: Office Trust and Startup-Surface Permission Control}, description: {paragraphs: [{zh: 禁止用户自建网络 trusted location，集中管理目录并限制写权限，关闭不需要旧功能。, en: Prohibit user-created network trusted locations centrally manage directories restrict write access and disable unnecessary legacy features.}]}, control_type: preventive}
- {key: office-behavior-guardrail, name: {zh: Office 行为防护与加载审计, en: Office Behavior Guardrails and Load Audit}, description: {paragraphs: [{zh: 应用 ASR 阻止 Office 创建子进程/写可执行内容，并记录扩展 load 与结果。, en: Apply ASR to block Office child processes or executable writes and record extension load and outcome.}]}, control_type: detective-support}
applications:
- target_ref: NJT-0095
  use: {paragraphs: [{zh: 对模板、宏、add-in、Office Test 和 Outlook 持久对象建立集中清单、签名/owner、最小写权限和加载审计；补丁移除旧 homepage/form 功能。, en: "Create centralized inventory signature or owner minimum write access and load audit for templates macros add-ins Office Test and durable Outlook objects and apply patches removing legacy home page or form behavior."}]}
  expected_effect: {paragraphs: [{zh: 减少 Office 自动加载的未批准状态并恢复扩展来源到后继结果的归因。, en: Reduces unapproved state automatically loaded by Office and restores attribution from extension origin to successor outcome.}]}
  limitations: {paragraphs: [{zh: 业务依赖宏和 add-in，全面禁用可能不可行；被攻陷签名者或管理部署身份仍可提交一致内容。, en: Business depends on macros and add-ins so full disablement may be impractical and a compromised signer or managed deployment identity can submit consistent content.}]}
- target_ref: NJS-0095-001
  use: {paragraphs: [{zh: 集中定义最少 trusted/startup locations，禁用网络位置和用户自建，目录只允许受控部署写入，并在每次 Office load 验证 object hash/signature。, en: Restrict trusted or startup locations to a minimal centrally defined set prohibit network and user-created locations allow writes only through controlled deployment and verify object hash or signature at each Office load.}]}
  expected_effect: {paragraphs: [{zh: 使位置和 Office 父进程不再自动赋予内容信誉，迫使攻击者控制部署或签名链。, en: Prevents location and Office parent process from automatically granting content reputation and forces control of deployment or signing chains.}]}
  limitations: {paragraphs: [{zh: 默认目录随版本/应用不同，旧插件可能无签名；严格策略需要分阶段兼容，否则中断关键文档流程。, en: Default directories vary by version and application and legacy plugins may lack signatures so strict policy requires staged compatibility to avoid disrupting critical document workflows.}]}
evidence_refs: [REF-000189, REF-000190]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-11', modified: '2026-09-11', contributors: [Niji Matrix Research], reviewers: []}

