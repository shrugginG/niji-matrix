schema_version: 2.0.0
type: mitigation
id: MIT-000076
name: {zh: 电源状态策略与生命周期强制, en: Power-State Policy and Lifecycle Enforcement}
summary: {zh: 集中保护 power settings，限制/到期 power requests，执行维护重启并审计跨边界进程。, en: Centrally protect power settings limit and expire power requests enforce maintenance reboot and audit processes across boundaries.}
description: {paragraphs: [{zh: 本缓解集中定义资产角色允许的睡眠/锁定/重启策略，限制能修改配置或创建长期 power request 的主体，要求 reason、caller 和最大时长，并从独立管理面执行维护重启。处置时撤销异常 request/setting、终止依赖会话并检查是否存在替代持久化。, en: "This mitigation centrally defines allowed sleep lock and reboot policy by asset role restricts principals that can change configuration or create long-lived power requests requires reason caller and maximum duration and enforces maintenance reboot from an independent management plane. On response revoke anomalous requests or settings terminate dependent sessions and inspect for alternative persistence."}]}
domains: [enterprise]
measures:
- {key: power-policy-control, name: {zh: 集中 Power Policy 与最小修改权限, en: Central Power Policy and Least Modification Authority}, description: {paragraphs: [{zh: 强制基线 timeout/hibernate/lock/reboot 并只允许 JIT 管理身份修改。, en: Enforce baseline timeout hibernate lock and reboot and allow only JIT management identities to modify them.}]}, control_type: preventive}
- {key: power-request-lifecycle, name: {zh: Power Request Caller、Reason 与到期, en: Power Request Caller Reason and Expiry}, description: {paragraphs: [{zh: 记录 request 创建/关闭，限制 caller，要求可审计 reason 与最大期限。, en: Record request creation and closure restrict callers and require an auditable reason plus maximum lifetime.}]}, control_type: governance}
- {key: enforced-maintenance-boundary, name: {zh: 强制维护边界与存续检查, en: Enforced Maintenance Boundary and Survival Check}, description: {paragraphs: [{zh: 从带外管理执行维护锁定/重启并验证不应存续的进程、会话和 token 已消失。, en: Enforce maintenance lock or reboot through out-of-band management and verify that processes sessions and tokens that should not survive have disappeared.}]}, control_type: containment}
applications:
- target_ref: NJT-0096
  use: {paragraphs: [{zh: 对终端和网络设备按角色强制 power-state policy，审计所有例外/request，保护 shutdown/reboot 工具并定期验证状态转换真实发生。, en: Enforce role-specific power-state policy on endpoints and network devices audit every exception or request protect shutdown or reboot utilities and verify that transitions actually occur.}]}
  expected_effect: {paragraphs: [{zh: 减少攻击者无限延长感染状态的能力，并把异常 caller 到存续入口建立可追溯链。, en: Reduces the ability to extend infected state indefinitely and creates traceable linkage from anomalous caller to surviving entry.}]}
  limitations: {paragraphs: [{zh: 服务器和关键设备可能不能频繁重启，错误强制会中断业务；内存取证需在终止前完成。, en: Servers and critical devices may not reboot frequently and incorrect enforcement disrupts business while memory evidence must be acquired before termination.}]}
- target_ref: NJS-0096-001
  use: {paragraphs: [{zh: 对未知或超时 power request 自动升级审查，在批准维护窗口从带外执行锁定/重启，并确认依赖 PID/session/token 已终止且没有新自启动对象。, en: Review unknown or expired power requests automatically enforce lock or reboot out of band in an approved maintenance window and confirm the dependent PID session or token ended without a new autostart object.}]}
  expected_effect: {paragraphs: [{zh: 强制攻击者跨生命周期建立更显眼持久化或失去易失入口。, en: Forces the adversary to create more conspicuous cross-lifecycle persistence or lose the volatile entry.}]}
  limitations: {paragraphs: [{zh: 合法长任务需例外且重启可能丢失取证状态；攻击者若已有固件/启动持久化则重启不能清除，需联合检查。, en: Legitimate long jobs need exceptions and reboot can destroy forensic state while firmware or boot persistence may survive and requires joint inspection.}]}
evidence_refs: [REF-000191, REF-000192]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-11', modified: '2026-09-11', contributors: [Niji Matrix Research], reviewers: []}

