schema_version: 2.0.0
type: mitigation
id: MIT-000077
name:
  zh: 启动完整性、组件 Attestation 与可信恢复
  en: Boot Integrity Component Attestation and Trusted Recovery
summary:
  zh: 以硬件信任根、固件写保护、组件度量、签名启动源和独立恢复约束 OS 前持久化。
  en: Constrain pre-OS persistence with hardware roots of trust firmware write protection component measurement signed
    boot sources and independent recovery.
description:
  paragraphs:
  - zh: 本缓解按 NIST 保护—检测—恢复原则保护 firmware/boot critical data，限制 flash/raw write/boot config 权限，启用 secure/measured boot
      并扩展到可支持的组件，验证 network-boot server 与 image signature/hash，保存独立清单和恢复 image。发现异常时不要信任受影响 OS，使用硬件或离线根恢复/重刷并轮换设备凭据。
    en: Following NIST protect detect and recover principles this mitigation protects firmware and boot critical data
      restricts flash raw-write and boot-configuration authority enables secure or measured boot and extends it to
      supported components validates network-boot servers and image signatures or hashes and preserves independent
      inventory plus recovery images. On anomaly do not trust the affected OS and recover or reflash from a hardware
      or offline root before rotating device credentials.
domains:
- enterprise
measures:
- key: boot-write-protection
  name:
    zh: 固件与启动区写保护
    en: Firmware and Boot-Region Write Protection
  description:
    paragraphs:
    - zh: 仅允许 JIT 更新身份、签名 vendor package 和物理/硬件保护流程修改 firmware、EFI、boot record 与 ROMMON。
      en: Allow only JIT update identities signed vendor packages and physical or hardware-protected workflows to
        modify firmware EFI boot records and ROMMON.
  control_type: preventive
- key: complete-measurement-map
  name:
    zh: 完整组件度量与 Readback 清单
    en: Complete Component Measurement and Readback Inventory
  description:
    paragraphs:
    - zh: 显式记录每个组件是否被 measured boot/attestation 覆盖，并对未覆盖对象部署独立 readback/hash 验证。
      en: Explicitly record whether each component is covered by measured boot or attestation and deploy independent
        readback or hash validation for uncovered objects.
  control_type: detective-support
- key: trusted-boot-source
  name:
    zh: 可信启动源与网络隔离
    en: Trusted Boot Source and Network Isolation
  description:
    paragraphs:
    - zh: 固定批准 boot server、image hash/signature 和管理路径，阻断设备到未知 TFTP/FTP/SCP 源。
      en: Pin approved boot servers image hashes or signatures and management paths and block devices from unknown
        TFTP FTP or SCP sources.
  control_type: preventive
- key: independent-firmware-recovery
  name:
    zh: 独立固件恢复根
    en: Independent Firmware Recovery Root
  description:
    paragraphs:
    - zh: 保留离线/硬件保护恢复 image 和步骤，异常时重刷全部相关组件并验证多次启动 measurement。
      en: Preserve offline or hardware-protected recovery images and procedures and reflash all related components
        plus verify multiple boot measurements on anomaly.
  control_type: containment
applications:
- target_ref: NJT-0097
  use:
    paragraphs:
    - zh: 对平台、组件、EFI/boot record、ROMMON 与 network boot 建立统一 inventory/measurement/source policy，限制写入并从 OS 外验证；处置使用独立恢复根而非仅重装磁盘。
      en: Create one inventory measurement and source policy for platform components EFI or boot records ROMMON and
        network boot restrict writes and validate outside the OS and recover from an independent root rather than
        only reinstalling disk.
  expected_effect:
    paragraphs:
    - zh: 减少 OS 前未授权状态并将写入、启动和运行结果可归因，避免常规重装留下根因。
      en: Reduces unauthorized pre-OS state attributes write boot and runtime outcome and avoids leaving the root
        cause after ordinary reinstall.
  limitations:
    paragraphs:
    - zh: 旧设备可能无 secure/measured boot 或 readback，重刷可能 brick/停机，供应商签名链被攻陷仍可通过验证。
      en: Legacy devices may lack secure or measured boot or readback reflashing can brick or interrupt service and
        a compromised vendor signing chain can still pass validation.
- target_ref: NJS-0097-001
  use:
    paragraphs:
    - zh: 维护逐组件 measurement coverage map，对未覆盖 firmware 使用独立 controller/readback/hash；采购要求硬件 root of trust 和安全恢复能力。
      en: Maintain a per-component measurement coverage map use independent controller or readback or hash for uncovered
        firmware and require hardware roots of trust plus secure recovery in procurement.
  expected_effect:
    paragraphs:
    - zh: 缩小攻击者可选择的度量盲区，并使“attestation pass”不再掩盖未覆盖组件。
      en: Shrinks measurement blind spots available to the adversary and prevents attestation pass from concealing
        uncovered components.
  limitations:
    paragraphs:
    - zh: 部分组件无法可靠 readback，vendor 更新会改变 hash；需签名 manifest 与型号/version 基线，仍可能存在供应链风险。
      en: Some components cannot be read back reliably and vendor updates change hashes requiring signed manifests
        plus model and version baselines while supply-chain risk remains.
- target_ref: NJS-0097-002
  use:
    paragraphs:
    - zh: 只允许设备从固定管理网络和批准 server netboot，要求 image signature/hash pinning、配置变更双人批准和每次启动 running-version 回报；未知源流量立即隔离。
      en: Allow devices to netboot only from fixed management networks and approved servers require image signature
        or hash pinning two-person boot-configuration approval and running-version reporting at each boot and isolate
        unknown-source traffic.
  expected_effect:
    paragraphs:
    - zh: 使标准 netboot 功能不能静默切换到攻击者 image，并恢复 boot pointer 到运行版本来源。
      en: Prevents standard netboot functionality from silently switching to an adversary image and restores provenance
        from boot pointer to running version.
  limitations:
    paragraphs:
    - zh: 灾备可能临时使用替代 server，TFTP 本身缺少强认证；需要网络隔离、签名 image 和有期限例外共同补偿。
      en: Disaster recovery may temporarily use alternate servers and TFTP lacks strong authentication requiring network
        isolation signed images and time-bounded exceptions together.
- target_ref: NJT-0188
  use:
    paragraphs:
    - zh: 对平台与组件固件启用硬件写保护、签名 capsule 和最低版本策略，以不同权启动度量和外部 BMC 观察完整覆盖；保存匹配硬件 GUID 的可信映像、离线读回与独立恢复根。
      en: Enable hardware write protection, signed capsules, and minimum-version policy for platform and component
        firmware, measure complete coverage through differently authorized boot attestation and external BMC observation,
        and retain trusted images matched to hardware GUID, offline readback, and an independent recovery root.
  expected_effect:
    paragraphs:
    - zh: 未经授权写入更难提交，固件消费失败可在 OS 缺席时仍由外部面识别，可信恢复减少永久 brick 和根因丢失。
      en: Unauthorized writes become harder to commit, firmware-consumption failure remains identifiable externally
        when the OS is absent, and trusted recovery reduces permanent bricking and root-cause loss.
  limitations:
    paragraphs:
    - zh: 旧设备可能无写保护或完整测量，BMC 可能同权受陷，恢复会停机并改变证据，错误的已知良好映像可造成二次损害。
      en: Legacy devices may lack write protection or complete measurement, a similarly authorized BMC may be compromised,
        recovery causes outage and changes evidence, and a wrong known-good image can create further damage.
