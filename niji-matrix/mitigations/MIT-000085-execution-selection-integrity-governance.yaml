schema_version: "2.0.0"
type: mitigation
id: MIT-000085
name: {zh: 执行选择、依赖完整性与 Runtime 激活治理, en: Execution Selection Dependency Integrity and Runtime Activation Governance}
summary: {zh: 以安全搜索路径、受保护程序位置、版本化内容完整性、应用控制和批准激活槽阻断执行流劫持并保留恢复谱系。, en: Block execution-flow hijacking and preserve recovery lineage through safe search paths protected program locations versioned content integrity application control and approved activation slots.}
description:
  paragraphs:
  - zh: 本缓解同时管理 consumer 如何查找代码、稳定身份下保存什么内容/目标以及 runtime 允许哪些激活扩展。开发与部署使用完整限定路径、安全 loader flags 和最小 PATH，程序/服务/依赖/注册表由最小 ACL 与受信安装器写入，版本化 hash/签名/manifest；App Control 同时覆盖 EXE、DLL 和动态代码，不因 launcher 签名而放行任意依赖。
    en: This mitigation governs how consumers locate code, what content or target resides under stable identities, and which runtime activation extensions are permitted. Development and deployment use fully qualified paths safe loader flags and minimal PATH. Programs services dependencies and registry are written only through least ACL and trusted installers with versioned hashes signatures and manifests. Application Control covers executables libraries and dynamic code and does not allow arbitrary dependencies because the launcher is signed.
  - zh: 对 COR_PROFILER、AppDomainManager、callback 与等价槽建立批准 owner、配置、module 和有效期，开发 profiler 与生产环境分离；每次状态变化连接下一次加载/结果。异常时冻结 writer 与软件包、保存旧/new 文件/配置和加载状态，停止 consumer，恢复受信版本并审查所有已消费实例；仅删除恶意 DLL 而不修复搜索路径、ACL 或激活槽会复发。
    en: Maintain approved owner configuration module and validity for COR_PROFILER AppDomainManager callbacks and equivalent slots and separate development profilers from production. Join every state change to the next load and outcome. On anomaly freeze writer and package preserve old and new file or configuration plus load state stop the consumer restore a trusted version and inspect every consumer instance. Deleting a malicious DLL without repairing search paths ACL or activation slots allows recurrence.
domains: [enterprise]
measures:
- key: safe-resolution-and-full-paths
  name: {zh: 安全解析顺序与完整路径, en: Safe Resolution Order and Fully Qualified Paths}
  description: {paragraphs: [{zh: 开发者对 LoadLibrary/CreateProcess/动态 linker 使用完整路径、安全搜索 flags、受控 RPATH/PATH 和 manifest，移除当前/用户可写目录并审计缺失依赖。, en: Developers use full paths safe search flags controlled RPATH or PATH and manifests for loaders or process creation remove current or user-writable directories and audit missing dependencies.}]}
  control_type: preventive
- key: protected-content-target-integrity
  name: {zh: 程序、服务与依赖内容/目标完整性, en: Program Service and Dependency Content or Target Integrity}
  description: {paragraphs: [{zh: 以最小 ACL、受信安装器、事务更新、hash/签名/manifest 和服务注册保护稳定 path/target，持续版本化并拒绝未批准 writer。, en: Protect stable paths or targets through least ACL trusted installers transactional updates hashes signatures manifests and service-registry controls continuously versioning and rejecting unapproved writers.}]}
  control_type: preventive
- key: governed-runtime-activation
  name: {zh: 受管 Runtime 激活与 Callback, en: Governed Runtime Activation and Callbacks}
  description: {paragraphs: [{zh: 生产环境默认禁用未批准 profiler/AppDomain/callback，固定 CLSID/module/config/owner 与有效期，使用 App Control/动态代码安全并审计所有变化。, en: Deny unapproved profiler AppDomain or callback activation in production by default pin CLSID module configuration owner and validity use application control or dynamic-code security and audit every change.}]}
  control_type: preventive
- key: state-load-response
  name: {zh: 状态—加载审计与证据化恢复, en: State-to-Load Audit and Evidence-Preserving Recovery}
  description: {paragraphs: [{zh: 连接 writer、旧/new 状态、consumer、resolved hash、module 和结果；异常时保存两版内容、暂停 consumer、恢复受信状态并核查全部消费实例。, en: Join writer old and new state consumer resolved hash module and outcome. On anomaly preserve both versions pause consumers restore trusted state and inspect every consuming instance.}]}
  control_type: containment
applications:
- target_ref: NJT-0070
  use: {paragraphs: [{zh: 对每个受信执行入口建立 search candidates、稳定内容/target 和 runtime activation 三类批准基线，强制 writer 权限与 state-to-load 日志；发现异常按 consumer 和所有消费实例处置，而非只清理单文件。, en: Establish approved search candidates stable content or targets and runtime activation for every trusted execution entry enforce writer authority and state-to-load logs and respond by consumer and every consuming instance rather than cleaning one file.}]}
  expected_effect: {paragraphs: [{zh: 阻断攻击者以正常 launcher、路径或 runtime 生命周期承载恶意内容，并让任何控制转移留下可恢复状态和内容身份差异。, en: Blocks attacker content from riding normal launchers paths or runtime lifecycles and leaves recoverable state and content-identity differences for every control transfer.}]}
  limitations: {paragraphs: [{zh: 旧软件常依赖相对搜索、可写插件和 profiler，全面应用控制有兼容/性能成本；受信更新器被攻陷仍可产生一致元数据，需要独立结果检测。, en: Legacy software often depends on relative search writable plug-ins and profilers and comprehensive application control has compatibility or performance cost. A compromised trusted updater can produce consistent metadata and requires independent outcome detection.}]}
- target_ref: NJS-0070-001
  use: {paragraphs: [{zh: 使用完整路径与 LOAD_LIBRARY_SEARCH/等价安全 flags，移除用户可写目录和不受控 PATH/RPATH，修复缺失依赖并验证实际 resolved path/hash；对签名 launcher 加载未批准本地模块阻断。, en: Use full paths and LOAD_LIBRARY_SEARCH or equivalent safe flags remove user-writable directories and uncontrolled PATH or RPATH repair missing dependencies and validate actual resolved path or hash. Block signed launchers loading unapproved local modules.}]}
  expected_effect: {paragraphs: [{zh: 消除攻击者新增候选赢得搜索顺序的机会，并使依赖名不再能掩盖实际来源。, en: Removes opportunities for a new attacker candidate to win search order and prevents dependency names from hiding actual origin.}]}
  limitations: {paragraphs: [{zh: 便携应用、插件和开发工具可能需要本地目录，迁移应先审计；完整路径的依赖还可能继续搜索其二级依赖，需递归验证。, en: Portable applications plug-ins and development tools may need local directories and require audit-first migration. A fully qualified dependency can still search for secondary dependencies requiring recursive validation.}]}
- target_ref: NJS-0070-002
  use: {paragraphs: [{zh: 对 executable/library/service target 建立版本化 hash、签名、ACL 与批准 writer，更新使用事务包并保留旧版本；任何稳定 identity 下内容/target 变化在下一次启动前验证。, en: Version hashes signatures ACLs and approved writers for executables libraries and service targets use transactional update packages retain prior versions and verify any content or target change under a stable identity before next start.}]}
  expected_effect: {paragraphs: [{zh: 使攻击者无法在保持路径/服务/界面外观时静默改变内容，并支持精确恢复。, en: Prevents silent content change while preserving path service or interface appearance and supports precise recovery.}]}
  limitations: {paragraphs: [{zh: 高频更新和自修改软件会产生大量合法差异，签名者被攻陷也会通过静态检查；需 package/审批和运行结果联合。, en: Frequent updates and self-modifying software produce many legitimate differences and a compromised signer can pass static checks requiring package or approval and runtime outcomes together.}]}
- target_ref: NJS-0070-003
  use: {paragraphs: [{zh: 生产主机维护 profiler/AppDomain/callback allowlist，保护环境、注册表、config 与进程结构写入，CLR/runtime 启动时校验 module/CLSID/manager；开发 profiler 使用隔离环境和到期许可。, en: Maintain profiler AppDomain or callback allowlists on production hosts protect writes to environment registry configuration and process structures and validate module CLSID or manager at CLR or runtime start. Development profilers use isolated environments and expiring approvals.}]}
  expected_effect: {paragraphs: [{zh: 让受信 runtime 只在批准激活槽加载已知代码，攻击者必须留下配置/内存完整性失败或转向其他入口。, en: Makes trusted runtimes load known code only through approved activation slots forcing configuration or memory-integrity failures or another entry path.}]}
  limitations: {paragraphs: [{zh: 合法 APM、诊断和安全 profiler 频繁升级，KernelCallbackTable 等内存槽难以使用统一策略；需按 runtime/版本分开基线并结合调用结果。, en: Legitimate APM diagnostics and security profilers update frequently and in-memory slots such as KernelCallbackTable resist one uniform policy requiring separate runtime and version baselines plus outcome correlation.}]}
