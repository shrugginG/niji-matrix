schema_version: "2.0.0"
type: mitigation
id: MIT-000087
name: {zh: 输入设备、活动会话与后继执行治理, en: Input Device Active-Session and Successor-Execution Governance}
summary: {zh: 以设备批准、USB/HID 限制、软件输入权限、锁屏/焦点保护、时序监控和输入触发执行控制降低用户拟态输入注入。, en: Reduce user-mimetic input injection through device approval USB or HID restrictions software-input authority lock or focus protection timing monitoring and input-triggered execution control.}
description:
  paragraphs:
  - zh: 本缓解不禁用所有合成输入，因为辅助功能、远程支持、自动测试和宏设备依赖它。它把输入来源与结果绑定：未知 USB/HID 默认询问或阻断，按 device instance/interface/owner 批准并限制锁屏连接；软件 automation 只允许签名进程在明确 session/application 使用，利用 UIPI/secure desktop/最小权限阻止跨完整性输入，并审计 injected flags、焦点/clipboard 与后继程序。
    en: This mitigation does not disable all synthetic input because accessibility remote support automated tests and macro devices depend on it. It binds input origin to outcome. Unknown USB or HID devices are prompted or blocked by default and approved by device instance interface and owner with locked-session restrictions. Software automation permits signed processes only in explicit sessions and applications, uses UIPI secure desktop and least privilege to prevent cross-integrity input, and audits injected flags focus or clipboard and successor programs.
  - zh: timing 检测使用多维 hold/flight/burst/pause 与来源/上下文/结果，不依赖单一速度阈值；Run dialog、terminal、PowerShell、浏览器开发者控制台和脚本执行可设置高风险 input-to-execution 策略。异常时保存设备、input sequence、session/window 和结果，断开/隔离设备或 injector、锁定 session、终止后继、轮换凭据并调查载荷；仅拔除 USB 不能清除已执行代码。
    en: Timing detection uses multidimensional hold or flight burst and pause plus origin context and outcome rather than one speed threshold. Run dialogs terminals PowerShell browser developer consoles and script execution can receive high-risk input-to-execution policy. On anomaly preserve device input sequence session or window and outcome disconnect or isolate device or injector lock the session terminate successors rotate credentials and investigate payloads. Removing the USB alone does not remove executed code.
domains: [enterprise]
measures:
- key: device-interface-approval
  name: {zh: USB/HID 设备与 Interface 批准, en: USB or HID Device and Interface Approval}
  description: {paragraphs: [{zh: 对新设备默认询问/阻断，按 instance/serial/interface/owner 允许，限制复合设备新增键盘接口并记录 PnP/driver；锁屏时拒绝未知外设。, en: Prompt or block new devices by default allow by instance serial interface and owner restrict composite devices adding keyboard interfaces and record PnP or driver events. Reject unknown peripherals while locked.}]}
  control_type: preventive
- key: software-input-session-authority
  name: {zh: 软件输入与 Session/焦点权限, en: Software Input and Session or Focus Authority}
  description: {paragraphs: [{zh: 只允许签名辅助/远程/测试工具向批准应用和 session 注入，实施 UIPI/secure desktop、最小 token、clipboard 与开发者控制台限制，并记录 injector。, en: Allow signed accessibility remote or test tools to inject only into approved applications and sessions enforce UIPI secure desktop least tokens clipboard and developer-console restrictions and record injectors.}]}
  control_type: preventive
- key: cadence-origin-outcome-monitoring
  name: {zh: 节奏、来源与结果联合监控, en: Cadence Origin and Outcome Joint Monitoring}
  description: {paragraphs: [{zh: 匿名化分析按键间隔、burst/pause 与随机性，并连接 injected flag 或 HID、用户在场、焦点和后继 shell/network；固定速度阈值不单独阻断。, en: Anonymously analyze intervals bursts pauses and randomness and join injected flags or HID user presence focus and successor shell or network. Fixed speed thresholds do not block alone.}]}
  control_type: detective-support
- key: input-execution-containment
  name: {zh: 输入触发执行的证据化遏制, en: Evidence-Preserving Input-Triggered Execution Containment}
  description: {paragraphs: [{zh: 对输入后 Run/shell/PowerShell/console 设置策略；告警时保存 device/sequence/session/result，断开来源、锁定会话、终止后继并调查下载载荷。, en: Apply policy to Run shell PowerShell and console after input. On alert preserve device sequence session and outcome disconnect the source lock the session terminate successors and investigate downloaded payloads.}]}
  control_type: containment
applications:
- target_ref: NJT-0071
  use: {paragraphs: [{zh: 建立设备与软件 automation inventory，按来源/owner/session/application 限权，连接所有高风险输入序列到执行结果。辅助/远程例外使用到期工单；新 HID 与未知 injector 不因输入看似用户而放行。, en: Maintain device and software-automation inventory restrict by origin owner session and application and join every high-risk input sequence to execution outcomes. Accessibility or remote exceptions use expiring tickets and new HIDs or unknown injectors are not allowed because input looks human.}]}
  expected_effect: {paragraphs: [{zh: 减少攻击者可用输入来源和 session，保留真实 provenance，并在合成输入转成命令/载荷前阻断或快速遏制。, en: Reduces input origins and sessions available to adversaries preserves true provenance and blocks or rapidly contains synthetic input before it becomes commands or payloads.}]}
  limitations: {paragraphs: [{zh: 设备身份和软件签名可被冒用，远程支持/辅助功能业务依赖强；输入隐私限制内容采集，必须结合行为与结果而非全面键盘记录。, en: Device identities and software signatures can be abused and remote support or accessibility are strong business dependencies. Input privacy limits content collection and requires behavior and outcome rather than pervasive keylogging.}]}
- target_ref: NJS-0071-001
  use: {paragraphs: [{zh: 使用多维人类/自动化 timing 模型和多种随机/减速攻击生成训练，结合来源、用户在场、context 和结果；阈值按用户/设备类别调优，并只保存匿名时序。, en: Use multidimensional human and automation timing models trained against diverse randomized and slowed attack generation and combine origin user presence context and outcome. Tune by user or device class and retain anonymous timing only.}]}
  expected_effect: {paragraphs: [{zh: 提高对随机/减速输入的稳健性并迫使攻击者进一步延长操作、增加用户察觉与焦点干扰风险。, en: Improves robustness to randomized or slowed input and forces longer operations with greater user observation and focus-interference risk.}]}
  limitations: {paragraphs: [{zh: 人类差异、辅助设备和短命令样本会产生误报/漏报；当前无野外人类节奏案例，不能以该控制证明风险普遍。, en: Human variability assistive devices and short command samples produce false positives or negatives. No field human-cadence case exists and this control does not establish prevalence.}]}
- target_ref: NJS-0071-002
  use: {paragraphs: [{zh: 限制后台/跨完整性向活动窗口注入，监控 active-window/URL query 到 input 的短链，保护 clipboard/开发者控制台，并对交易/管理员界面要求独立确认或 secure input。, en: Restrict background or cross-integrity injection into active windows monitor short chains from active-window or URL queries to input protect clipboard and developer consoles and require independent confirmation or secure input for transaction or administrator UI.}]}
  expected_effect: {paragraphs: [{zh: 阻止攻击者仅靠等待真实 session/focus 获取用户因果外观，并把 context 监控和注入者暴露为独立信号。, en: Prevents waiting for a real session or focus from conferring user-causality appearance and exposes context monitoring and injector as independent signals.}]}
  limitations: {paragraphs: [{zh: 合法自动填充、密码管理器和辅助技术需要 context；浏览器内部注入可能无独立 process，需扩展/DOM 与网络遥测。, en: Legitimate autofill password managers and accessibility need context. In-browser injection may have no separate process and requires extension or DOM and network telemetry.}]}
- target_ref: NJS-0071-003
  use: {paragraphs: [{zh: 使用 device control/USB Restricted Mode/udev 或等价策略按 instance/interface 批准 HID，锁屏拒绝新设备，检测复合设备突增键盘接口，并把 PnP 与输入后 shell/network 关联。, en: Use device control USB Restricted Mode udev or equivalent policy to approve HIDs by instance and interface reject new devices while locked detect composite devices adding keyboard interfaces and join PnP to post-input shell or network.}]}
  expected_effect: {paragraphs: [{zh: 阻断未批准 BadUSB 枚举或在按键转成执行时快速识别，使标准 HID 类别不再自动代表用户信任。, en: Blocks unapproved BadUSB enumeration or rapidly detects keys becoming execution so standard HID class no longer automatically represents user trust.}]}
  limitations: {paragraphs: [{zh: VID/PID/serial 可克隆，企业可能使用大量无稳定序列的键盘/KVM/条码枪；需要 owner/port/行为和分阶段部署，物理接入控制仍必要。, en: VID PID or serial can be cloned and enterprises may use many keyboards KVMs or barcode scanners without stable serials requiring owner port behavior and staged rollout plus physical-access controls.}]}
