schema_version: 2.0.0
type: mitigation
id: MIT-000091
name: {zh: 模块来源与动态代码完整性治理, en: Module Provenance and Dynamic-Code Integrity Governance}
summary: {zh: 通过受控模块路径、Host—Module 组合、动态代码策略和内存差分遥测限制标准与反射模块执行, en: Constrain standard and reflective module execution through controlled module paths host-to-module combinations dynamic-code policy and memory differential telemetry}
description: {paragraphs: [{zh: 本缓解不试图禁止所有共享库，而是把 module 来源、host 适用性、loader 路径和 executable memory 纳入完整性策略。标准模块必须来自不可写受控位置并匹配批准 host；private executable code 必须由受信 JIT/运行时解释且可审计。签名 host 或 module 单独不能放行组合。, en: This mitigation does not ban all shared libraries and instead brings module provenance host applicability loader paths and executable memory under integrity policy. Standard modules originate from controlled nonwritable locations and match approved hosts while private executable code must be explained by trusted auditable JIT or runtimes. Signed hosts or modules alone do not allow combinations.}]}
domains: [enterprise]
measures:
  - {key: controlled-module-provenance, name: {zh: 受控模块来源与 Host 绑定, en: Controlled Module Provenance and Host Binding}, description: {paragraphs: [{zh: 限制用户可写、临时和 UNC/远程模块路径，验证 hash/signature/package 来源，并维护按 process role 与版本批准的 host—module 组合；软件更新通过受管安装器变更基线。, en: Restrict user-writable temporary and UNC or remote module paths verify hashes signatures and package provenance and maintain approved host-to-module combinations by process role and version with software updates changing baselines through managed installers.}]}, control_type: preventive}
  - {key: dynamic-code-memory-policy, name: {zh: 动态代码与可执行内存策略, en: Dynamic-Code and Executable-Memory Policy}, description: {paragraphs: [{zh: 在兼容进程启用 DLL/Library Validation、App Control Dynamic Code Security、W^X/ACG 等策略，限制无 file backing 的 executable region，并为 JIT、安全产品和浏览器建立最小例外。, en: Enable DLL or Library Validation App Control Dynamic Code Security W^X or ACG-like policies on compatible processes restrict executable regions without file backing and create minimal exceptions for JIT security products and browsers.}]}, control_type: preventive}
  - {key: module-memory-observability, name: {zh: Module—Memory 差分可观察性, en: Module-to-Memory Differential Observability}, description: {paragraphs: [{zh: 收集 image/module load、file provenance、memory protection、thread/call stack 与 network，保留 loader inventory 和 memory map 差分，不因受信 host 排除子进程或内存。, en: Collect image or module loads file provenance memory protections thread or call stacks and network retain loader-inventory-to-memory-map differentials and do not exclude child or memory telemetry for trusted hosts.}]}, control_type: detective-support}
applications:
  - target_ref: NJT-0077
    use: {paragraphs: [{zh: 对匿迹化共享模块执行，把 host role、批准 module set、来源路径和 memory policy 联合执行；未知 module 或 imageless executable region 先隔离调用进程并保全内存、module list 与文件，再按业务角色处置。, en: For Stealth-Conforming Shared-Module Execution enforce host roles approved module sets provenance paths and memory policy together. Isolate processes with unknown modules or imageless executable regions and preserve memory module lists and files before role-based remediation.}]}
    expected_effect: {paragraphs: [{zh: 攻击者难以仅借既有进程身份加载模块，标准 loader 和 reflective mapper 都产生可验证差分；保全证据改善模块来源和功能归因。, en: Existing process identity alone no longer enables module loading and standard loaders and reflective mappers both create verifiable differentials while preserved evidence improves module provenance and function attribution.}]}
    limitations: {paragraphs: [{zh: 插件、JIT、浏览器和安全产品模块变化频繁，严格策略可能导致崩溃；内核级或受信供应链攻击可绕过来源根，内存采集还有性能与隐私成本。, en: Plugins JIT browsers and security products change modules frequently and strict policy may crash applications while kernel-level or trusted supply-chain attacks can bypass provenance roots and memory collection adds performance and privacy cost.}]}
  - target_ref: NJS-0077-001
    use: {paragraphs: [{zh: 对既有进程内模块承载，按 host+module+version 而非 signer 允许，阻止用户可写/远程路径和未批准插件，执行时核对 canonical path、digest 与 package。受信 host 首次加载新 module 进入审计/隔离。, en: For Existing-Process In-Module Payload Hosting allow by host plus module plus version rather than signer block user-writable or remote paths and unapproved plugins and verify canonical paths digests and packages at load. First-seen modules in trusted hosts enter audit or isolation.}]}
    expected_effect: {paragraphs: [{zh: Astaroth 式载荷不能仅靠合法 host 获得信誉，恶意 file-backed module 在加载前或行为发生时被识别，同时保留合法已批准插件。, en: Astaroth-like payloads cannot gain reputation from legitimate hosts alone and malicious file-backed modules are identified at load or behavior while approved plugins remain usable.}]}
    limitations: {paragraphs: [{zh: 合法应用动态发现插件且版本更新频繁，hash allowlist 维护量大；签名恶意 module 或被攻陷软件包仍可匹配来源，需后继行为检测。, en: Legitimate applications discover plugins dynamically and update frequently making hash allowlists costly while signed malicious modules or compromised packages may match provenance and require successor-behavior detection.}]}
  - target_ref: NJS-0077-002
    use: {paragraphs: [{zh: 对内存驻留模块实例化，在非 JIT 进程限制 private executable memory 与 RW→RX，启用 memory integrity/dynamic-code policy，并实时关联 allocation、write/decrypt、protect、entry/thread 与 PE-like layout；命中时保全区域和 writer。, en: For Memory-Resident Module Instantiation restrict private executable memory and RW-to-RX on non-JIT processes enable memory integrity or dynamic-code policy and correlate allocation write or decrypt protection entry or thread and PE-like layouts in real time while preserving regions and writers on detection.}]}
    expected_effect: {paragraphs: [{zh: reflective mapper 即使绕过磁盘和 LoadLibrary 也必须暴露内存构造与入口，PipeMon/DOUBLEPULSAR 类路径更易阻断和取证。, en: Reflective mappers must expose memory construction and entry even after bypassing disk and LoadLibrary making PipeMon or DOUBLEPULSAR-like paths easier to block and investigate.}]}
    limitations: {paragraphs: [{zh: JIT、packer、浏览器和 EDR 自身会产生相似内存，强制 ACG/W^X 兼容性有限；攻击者可利用已批准 JIT 或内核路径，需组合 call stack 与结果。, en: JIT packers browsers and EDR create similar memory and enforced ACG or W^X has compatibility limits while attackers may use approved JIT or kernel paths requiring call-stack and outcome combination.}]}
evidence_refs: [REF-000240, REF-000279, REF-000280, REF-000283, REF-000288]
