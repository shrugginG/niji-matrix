schema_version: 2.0.0
type: mitigation
id: MIT-000092
name: {zh: 开发 Utility 角色、输入与动态代码控制, en: Developer-Utility Role Input and Dynamic-Code Control}
summary: {zh: 在非开发系统阻止高风险 Utility，并在开发系统限制调用者、输入来源、Project 内容和动态代码，防止签名工具代理, en: Block high-risk utilities on nondeveloper systems and constrain callers input provenance project content and dynamic code on developer systems to prevent signed-tool proxying}
description: {paragraphs: [{zh: 本缓解按资产角色而非 Microsoft publisher 管理开发 utility。非开发工作站和服务器原则上阻止 MSBuild 等可绕过 App Control 的程序；开发/构建主机仅允许批准用户、父进程、canonical utility、repository 与 project digest，并解析 UsingTask/TaskFactory/Code 等可执行结构。动态代码和后继 child/module/network 仍受策略与审计。, en: This mitigation governs developer utilities by asset role rather than Microsoft publisher. Nondeveloper workstations and servers block MSBuild-like App Control bypass applications by default while developer or build hosts allow approved users parents canonical utilities repositories and project digests and parse executable structures such as UsingTask TaskFactory and Code. Dynamic code and successor child module or network behavior remain governed and audited.}]}
domains: [enterprise]
measures:
  - {key: role-scoped-utility-control, name: {zh: 按资产角色阻止或允许 Utility, en: Role-Scoped Utility Blocking and Allowance}, description: {paragraphs: [{zh: 使用 App Control/WDAC 在非开发系统阻止 msbuild、Microsoft.Build 和不需要的开发工具；开发系统的例外绑定用户、设备、版本、canonical path、父进程和批准 repository，不使用 publisher 全局 allow。, en: Use App Control or WDAC to block msbuild Microsoft.Build and unnecessary developer tools on nondeveloper systems and bind developer-system exceptions to users devices versions canonical paths parents and approved repositories without global publisher allowance.}]}, control_type: preventive}
  - {key: trusted-build-input-admission, name: {zh: 受信 Build 输入准入, en: Trusted Build-Input Admission}, description: {paragraphs: [{zh: 阻止来自用户临时目录、邮件、浏览器、MOTW、UNC/URL 或未批准 repo 的 project/manifest/response 输入，验证 digest/signature，并静态审查 Import、UsingTask、TaskFactory、Code、remote source 和 command sink。, en: Block project manifest or response inputs from user temporary mail browser MOTW UNC or URL and unapproved repositories verify digest or signature and statically review Import UsingTask TaskFactory Code remote sources and command sinks.}]}, control_type: preventive}
  - {key: dynamic-code-outcome-enforcement, name: {zh: 动态代码与运行结果约束, en: Dynamic-Code and Runtime-Outcome Enforcement}, description: {paragraphs: [{zh: 启用 App Control Dynamic Code Security、module/memory 与 child/network 审计，要求 build ID 传播到结果；非预期 inline assembly、用户路径 PE、脚本解释器、注入或外连触发停止和证据保全。, en: Enable App Control Dynamic Code Security module or memory and child or network audit propagate build IDs into outcomes and stop and preserve evidence for unexpected inline assemblies user-path PEs script interpreters injection or egress.}]}, control_type: containment}
applications:
  - target_ref: NJT-0080
    use: {paragraphs: [{zh: 对受信开发实用程序代理执行，建立 developer-host inventory，并将 utility 启动与 project/manifest 准入和结果策略绑定。非开发资产默认阻止；开发资产要求受管 repo、批准 parent/toolchain、输入内容审查和完整 build/runtime 日志。, en: For Trusted Developer-Utility Proxy Execution inventory developer hosts and bind utility launch to project or manifest admission and outcome policy. Block by default on nondeveloper assets and require managed repositories approved parents and toolchains input-content review and complete build or runtime logs on developer assets.}]}
    expected_effect: {paragraphs: [{zh: 攻击者不能仅凭 Microsoft 签名穿过应用控制，恶意输入在 utility 运行前或 child/module/memory/network 结果出现时被发现；合法开发范围保持明确。, en: Microsoft signatures alone cannot cross application control and malicious input is detected before utility execution or when child module memory or network outcomes appear while legitimate development scope remains explicit.}]}
    limitations: {paragraphs: [{zh: 开发工具和项目高度动态，严格 hash/path 策略维护成本高；构建供应链或批准 repo 被攻陷时输入仍可通过，CI/IDE 兼容性需要审计模式和分阶段实施。, en: Developer tools and projects are highly dynamic making strict hash or path policy costly while compromised build supply chains or approved repositories may pass admission and CI or IDE compatibility requires audit-mode staged rollout.}]}
  - target_ref: NJS-0080-001
    use: {paragraphs: [{zh: 对受信实用程序输入代理执行，验证 utility caller、host role 与 input origin/digest，阻止 Office/browser/script 从用户目录或网络 share 调用 project；保存输入原文与 build ID，并对 child、module、file 和 network 结果施加 allow policy。, en: For Trusted-Utility Input-Proxy Execution verify utility caller host role and input origin or digest block Office browser or scripts invoking projects from user directories or network shares retain original input and build IDs and apply allow policy to child module file and network outcomes.}]}
    expected_effect: {paragraphs: [{zh: Frankenstein/AkaiRyū 式 XML 不再因 MSBuild 受信而自动执行，输入来源和结构在代理发生前暴露，后继 injector/loader 也能回连 project。, en: Frankenstein or AkaiRyū-style XML no longer executes automatically because MSBuild is trusted and input origin and structure surface before proxying while downstream injectors or loaders link back to projects.}]}
    limitations: {paragraphs: [{zh: 组织可能合法从网络 repo 构建，IDE 与 package manager 会生成临时 project；过宽例外重新造成旁路。攻击者控制批准 repo 或合法开发用户时需依赖结果检测。, en: Organizations may legitimately build from network repositories and IDEs or package managers generate temporary projects while broad exceptions recreate bypasses. Control of approved repositories or developers requires outcome detection.}]}
  - target_ref: NJS-0080-002
    use: {paragraphs: [{zh: 对无独立制品实用程序内执行，静态拒绝未批准 UsingTask/TaskFactory/inline Code，启用 Dynamic Code Security 和 build task 日志，并把 dynamic assembly、private executable memory 和 in-process network 与 project digest 关联。只有受管 repo 的批准 inline task 可执行。, en: For Artifactless In-Utility Execution statically reject unapproved UsingTask TaskFactory or inline Code enable Dynamic Code Security and build-task logs and join dynamic assemblies private executable memory and in-process network to project digests. Only approved inline tasks from managed repositories execute.}]}
    expected_effect: {paragraphs: [{zh: 攻击者不能用内存 task assembly 绕过新文件/child 规则，project 中的代码与运行时对象形成可审计链，并可在编译或首次敏感结果时阻断。, en: Attackers cannot use in-memory task assemblies to bypass new-file or child rules and project code forms an auditable chain to runtime objects that can be blocked at compilation or first sensitive outcome.}]}
    limitations: {paragraphs: [{zh: 合法自定义 build 广泛使用 inline task，静态语义判断困难；Dynamic Code Security 有版本和兼容性限制，恶意代码也可只调用允许 API。需按 repo/owner 与结果持续调优。, en: Legitimate custom builds widely use inline tasks and static semantic judgment is difficult while Dynamic Code Security has version and compatibility limits and malicious code may use only allowed APIs requiring ongoing repository owner and outcome tuning.}]}
evidence_refs: [REF-000284, REF-000287, REF-000288]
