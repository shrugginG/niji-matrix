schema_version: 2.0.0
type: mitigation
id: MIT-000093
name: {zh: 服务控制、定义与生命周期治理, en: Service Control Definition and Lifecycle Governance}
summary: {zh: 通过最小服务权限、版本化目标、远程来源限制、实时生命周期审计和 Manager Child 策略降低服务执行滥用, en: Reduce service-execution abuse through least service authority versioned targets remote-origin restrictions real-time lifecycle audit and manager-child policy}
description: {paragraphs: [{zh: 本缓解把 service start/control/create/delete 和实际 manager result 作为一项受控事务。只有 JIT 管理主体可控制高权服务或创建临时服务，definition/target 与 package 来源被版本化验证，生命周期实时集中保存，services.exe/svchost/launchd/systemd 的 child 或 module 不因受信父级免检。, en: This mitigation governs service start control create delete and actual manager outcomes as one transaction. Only JIT management principals control privileged services or create temporary services definitions or targets and package provenance are versioned and verified lifecycle is centralized in real time and children or modules of services.exe svchost launchd or systemd are not exempt from inspection.}]}
domains: [enterprise]
measures:
  - {key: least-service-control-authority, name: {zh: 最小服务控制与远程来源, en: Least Service Control and Remote Origins}, description: {paragraphs: [{zh: 限制 start/config/create/delete、SCM RPC、launchctl/systemctl 与 service database 权限，使用 JIT/MFA/受管来源，分离 definition approver 与 operator。, en: Restrict start config create delete SCM RPC launchctl or systemctl and service-database authority use JIT MFA and managed origins and separate definition approvers from operators.}]}, control_type: preventive}
  - {key: versioned-service-target-integrity, name: {zh: 版本化 Service—Target 完整性, en: Versioned Service-to-Target Integrity}, description: {paragraphs: [{zh: 保存 name/type/account/start/target/module/driver/ACL 每个版本，验证 binary hash/signature/package 与 canonical path，阻止用户可写、近似名或未批准 target。, en: Version every name type account start target module driver and ACL verify binary hashes signatures packages and canonical paths and block user-writable near-name or unapproved targets.}]}, control_type: preventive}
  - {key: immutable-service-transaction-audit, name: {zh: 不可变服务事务与 Child 审计, en: Immutable Service Transaction and Child Audit}, description: {paragraphs: [{zh: 实时集中 remote request、create/start/stop/delete、manager child/module/driver、named pipe 与 network，删除后保留 definition；按 service/request ID 自动关联。, en: Centralize remote requests create start stop delete manager children modules or drivers named pipes and network in real time retain definitions after deletion and correlate by service or request IDs.}]}, control_type: detective-support}
applications:
  - target_ref: NJT-0079
    use: {paragraphs: [{zh: 对匿迹化系统服务执行，要求每次 service control/create 绑定 actor、approved definition/package、request/change ID 与后继 process/module；异常时暂停 service、保全状态和 remote session，再按业务关键性处置。, en: For Stealth-Conforming System-Service Execution bind each control or create to actor approved definition or package request or change ID and successor process or module and on anomaly pause the service preserve state and remote session and remediate by business criticality.}]}
    expected_effect: {paragraphs: [{zh: 已有 identity 不再掩盖 target 变化，短驻对象无法在日志转发前完全消失，远程发起者可回连本地 manager result。, en: Existing identities no longer hide target changes ephemeral objects cannot disappear before log forwarding and remote initiators link to local manager outcomes.}]}
    limitations: {paragraphs: [{zh: 补丁、安装和 incident response 需要高权服务操作；严格阻断可能中断关键服务，受控 package/approver 同时失陷仍可绕过。, en: Patching installation and incident response need privileged service operations and strict blocking may interrupt critical services while compromise of controlled packages and approvers can still bypass.}]}
  - target_ref: NJS-0079-001
    use: {paragraphs: [{zh: 对既有服务情境借用，在每次 start/control 比较当前 definition/target/hash 与批准历史，并核对 actor/change；已有 name/account 或 manager parent 不能覆盖差异。, en: For Existing-Service Context Borrowing compare current definition target and hash with approved history at every start or control and verify actor and change while existing names accounts or manager parents cannot override differences.}]}
    expected_effect: {paragraphs: [{zh: Blue Mockingbird 式 wercplsupport 借用会因 target/近似 DLL 与历史不符而在执行前或 manager child 时暴露。, en: Blue Mockingbird-style wercplsupport borrowing surfaces from target or near-name DLL deviation before execution or at manager child.}]}
    limitations: {paragraphs: [{zh: 服务合法升级和 recovery 会改变目标；恶意签名更新或被控 approver 可匹配历史，需要结果检测和可回滚版本。, en: Legitimate upgrades and recovery change targets and malicious signed updates or compromised approvers may match history requiring outcome detection and rollbackable versions.}]}
  - target_ref: NJS-0079-002
    use: {paragraphs: [{zh: 对短驻服务生命周期压缩，禁止未批准 remote SCM/create，实时保留 create→start→child/pipe→delete，临时服务只允许受管安装器/响应工具、固定 target 与短期授权；检测后撤销队列和远程凭据。, en: For Ephemeral Service-Lifecycle Compression block unapproved remote SCM or create retain create start child or pipe delete in real time and allow temporary services only for managed installers or response tools with fixed targets and short authority while revoking queued work and remote credentials on detection.}]}
    expected_effect: {paragraphs: [{zh: PsExec 类服务即使删除也留下完整事务，攻击者不能仅借 services.exe 与短生命周期逃过状态盘点。, en: PsExec-like services leave complete transactions despite deletion and cannot evade state inventory through services.exe parentage and short lifetime alone.}]}
    limitations: {paragraphs: [{zh: 合法安装器/运维大量使用临时服务，平台可能不记录 delete 或 request ID；缺字段时只能限制自动阻断并用 file/pipe/process 补偿。, en: Legitimate installers and operations use many temporary services and platforms may omit delete or request IDs requiring constrained automated blocking and compensation through file pipe and process data.}]}
evidence_refs: [REF-000289, REF-000290, REF-000291, REF-000292]
lifecycle: {status: review, version: 1.0.0, created: '2026-09-12', modified: '2026-09-12', contributors: [Niji Matrix Research], reviewers: []}
