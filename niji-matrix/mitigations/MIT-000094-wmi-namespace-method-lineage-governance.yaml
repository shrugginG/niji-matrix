schema_version: 2.0.0
type: mitigation
id: MIT-000094
name:
  zh: WMI Namespace、Method 与来源谱系治理
  en: WMI Namespace Method and Provenance-Lineage Governance
summary:
  zh: 通过最小 WMI 权限、受管远程来源、Operation tracing、方法准入和 Wmiprvse 结果控制降低 WMI 执行滥用
  en: Reduce WMI execution abuse through least WMI authority managed remote origins operation tracing method admission and
    Wmiprvse outcome controls
description:
  paragraphs:
  - zh: 本缓解保留 WMI 的管理价值，但按角色限制 namespace 和 execution-capable method，强制远程认证/加密/来源，启用 client-to-provider operation tracing，并对
      Wmiprvse child/module/network 应用行为控制。目标是让 provider 托管不丢失原始身份，让常见管理方法不能成为全局白名单。
    en: This mitigation preserves WMI management value while restricting namespaces and execution-capable methods by role
      enforcing remote authentication encryption and origins enabling client-to-provider operation tracing and applying behavioral
      controls to Wmiprvse children modules and network. Provider hosting must not lose original identity and common management
      methods cannot become global allowlists.
domains:
- enterprise
measures:
- key: least-wmi-namespace-method
  name:
    zh: 最小 Namespace 与执行 Method 权限
    en: Least Namespace and Execution-Method Authority
  description:
    paragraphs:
    - zh: 只向受管管理员/服务账户授予所需 namespace、class/method，单独限制 Win32_Process/ExecMethod、provider 注册和远程访问，移除共享账户与过宽 DCOM/WinRM 权限。
      en: Grant only needed namespaces classes and methods to managed administrators or service accounts separately restrict
        Win32_Process or ExecMethod provider registration and remote access and remove shared accounts and broad DCOM or WinRM
        rights.
  control_type: preventive
- key: managed-remote-wmi-origin
  name:
    zh: 受管远程 WMI 来源与认证
    en: Managed Remote WMI Origins and Authentication
  description:
    paragraphs:
    - zh: 仅允许批准管理服务器通过 Kerberos/强认证和加密访问 WMI，限制端口/防火墙与 JIT，记录 source host、user、session 和 target。
      en: Allow WMI only from approved management servers through Kerberos or strong authentication and encryption restrict
        ports firewalls and JIT and record source host user session and target.
  control_type: exposure-reduction
- key: operation-lineage-and-provider-outcome
  name:
    zh: Operation 谱系与 Provider 结果控制
    en: Operation Lineage and Provider-Outcome Control
  description:
    paragraphs:
    - zh: 启用 WMI-Activity/Trace 并集中保存 client/OperationId/provider，向 EDR 关联 Wmiprvse child/module/file/network；阻止 encoded shell、用户路径、未批准下载和
        destructive method 结果。
      en: Enable and centralize WMI-Activity or Trace client OperationId and provider data and join Wmiprvse children modules
        files and network in EDR while blocking encoded shells user paths unapproved downloads and destructive method outcomes.
  control_type: detective-support
applications:
- target_ref: NJT-0082
  use:
    paragraphs:
    - zh: 对匿迹化 WMI 执行，为所有 execution-capable operation 保留 client→method→provider→outcome 链，并用资产角色策略检查 source/principal/method/command。无
        OperationId 或来自非管理源的高风险 method 转入阻断/隔离。
      en: For Stealth-Conforming WMI Execution retain client-to-method-to-provider-to-outcome lineage for every execution-capable
        operation and check source principal method and command against asset-role policy while high-risk methods without
        OperationIds or from nonmanagement origins are blocked or isolated.
  expected_effect:
    paragraphs:
    - zh: Wmiprvse 不再遮蔽原始发起者，常见管理身份与端口也不能覆盖 encoded command 或异常结果；远程横向和本地谱系打断成本上升。
      en: Wmiprvse no longer hides original initiators and common management identities or ports cannot override encoded commands
        or anomalous outcomes raising costs for remote lateral movement and local lineage breaking.
  limitations:
    paragraphs:
    - zh: WMI 广泛被 SCCM、监控和应用使用，方法级限制可能破坏业务；Trace 数据量大且 client PID 会重用，平台升级/WMIC 弃用要求持续映射。
      en: WMI is broadly used by SCCM monitoring and applications and method restrictions may break business while Trace is
        high volume client PIDs are reused and platform changes or WMIC deprecation require ongoing mapping.
- target_ref: NJS-0082-001
  use:
    paragraphs:
    - zh: 对 Provider 宿主来源遮蔽，强制 WMI Trace 记录 ClientMachine/User/PID/OperationId，并在 provider child 创建时附加 operation context；Office/script/remote
        nonmanagement client 的 execution method 默认高风险。
      en: For Provider-Hosted Execution-Provenance Masking require WMI Trace client machine user PID and OperationId and attach
        operation context to provider children while execution methods from Office scripts or remote nonmanagement clients
        default to high risk.
  expected_effect:
    paragraphs:
    - zh: TA551 式 winword 谱系打断可还原，AvosLocker encoded PowerShell 能连接原始 WMI client/remote session，而非停在 Wmiprvse。
      en: TA551-style Winword lineage breaks are recoverable and AvosLocker encoded PowerShell links to original WMI clients
        or remote sessions rather than stopping at Wmiprvse.
  limitations:
    paragraphs:
    - zh: Legacy/第三方 provider 可能不提供完整 ID，自托管 provider 不使用 Wmiprvse；日志关闭或同一高权主体控制 tracing 时仍可失去来源。
      en: Legacy or third-party providers may omit IDs and self-hosted providers do not use Wmiprvse while disabled logs or
        one privileged actor controlling tracing can still lose provenance.
- target_ref: NJS-0082-002
  use:
    paragraphs:
    - zh: 对日常管理情境合形，按管理平台和资产角色建立 namespace-class-method-principal-cadence 与允许结果基线，例外绑定 source host、service account、method、target
        role 和期限；不全局放行 WMIC、PowerShell 或 Wmiprvse。
      en: For Routine-Administration Context Conformity baseline namespace class method principal cadence and allowed outcomes
        by management platform and asset role and bind exceptions to source host service account method target role and expiry
        without globally allowing WMIC PowerShell or Wmiprvse.
  expected_effect:
    paragraphs:
    - zh: 恶意操作必须同时匹配实际管理源、权限和结果，借常见 class/account 不足以伪装，encoded command、异常下载或 destructive side effect 会触发差分。
      en: Malicious operations must match real management origins authority and outcomes and common classes or accounts alone
        cannot disguise them while encoded commands anomalous downloads or destructive side effects create differentials.
  limitations:
    paragraphs:
    - zh: 管理基线随软件和脚本变化，紧急响应会使用非常用 method；攻击者控制批准管理服务器可匹配 source/principal，因此仍需 command 与结果审查。
      en: Management baselines change with software and scripts and emergency response uses unusual methods while adversaries
        controlling approved servers may match sources and principals so command and outcome review remains necessary.
- target_ref: NJT-0244
  use:
    paragraphs:
    - zh: 对系统信息发现的 WMI 路径，按职责复核命名空间连接和实例读权限，保留必要的本地诊断，限制无需要的远程来源，并集中启用可归属的查询 operation Trace。把 OS、主板与修补类查询同批准客户端核验；执行方法和 provider
        变更仍作为单独高权限面约束，不能替代读查询授权判断。
      en: For the WMI path of System Information Discovery, review namespace connection and instance-read authority by duty,
        retain necessary local diagnostics, restrict unnecessary remote origins, and centralize attributable query-operation
        tracing. Check OS, baseboard, and patch-class queries against approved clients. Constrain execution methods and provider
        changes as separate privileged surfaces rather than substituting them for read-query authorization.
  expected_effect:
    paragraphs:
    - zh: 减少不必要的远程查询机会，并使来自正常管理接口的系统画像可以回溯到原始客户端和职责，补充仅有工具启动的观察。它提升请求问责而不声称隐藏所有系统属性。
      en: Reduce unnecessary remote-query opportunities and make profiling through ordinary management interfaces traceable
        to original clients and duties, supplementing utility-launch observation. It improves request accountability without
        claiming to hide every system attribute.
  limitations:
    paragraphs:
    - zh: 普通用户与合法组件仍可能需要实例读取，过度收紧 namespace 可破坏安装与监控；阻止 ExecMethod 不会自动阻止 ExecQuery。SACL 4662 审核的是命名空间访问而非 provider 结果，Trace
        需要启用与版本验证且不含完整属性值，其他 getter 不受本应用覆盖。
      en: Ordinary users and legitimate components may still need instance reads, and excessive namespace restrictions can
        break installation and monitoring. Blocking ExecMethod does not automatically block ExecQuery. SACL 4662 audits namespace
        access rather than provider results, tracing requires enablement and version validation without complete attribute
        values, and other getters remain outside this application.
- target_ref: NJS-0244-001
  use:
    paragraphs:
    - zh: 对进程内系统属性查询，将 operation Trace 与客户端生存期结合，按查询类、字段、调用主体和客户端职责保留来源链；即使没有新诊断进程也核验具体请求。收敛客户端不需要的 WMI 读与远程能力，保留受控诊断，并把异常请求交给能够保全原始客户端证据的响应流程。
      en: For In-Process System-Attribute Query, join operation tracing to client lifetimes and retain provenance by query
        class, properties, principal, and client duty, verifying particular requests even without a new diagnostic process.
        Reduce unneeded WMI read and remote authority while preserving controlled diagnostics, and route anomalous requests
        to response that preserves original-client evidence.
  expected_effect:
    paragraphs:
    - zh: 查询任务不再因缺少 systeminfo 或 wmic 子进程而失去归属，攻击者直接借用程序内接口的观察优势缩小。允许范围与实际请求的差异可独立保留，不依赖将 WmiPrvSE 的正常身份当作风险豁免。
      en: Inquiry attribution no longer depends on systeminfo or wmic children, reducing the observation advantage of direct
        programmatic interfaces. Differences between allowed scope and actual requests remain independently available without
        treating normal WmiPrvSE identity as a risk exemption.
  limitations:
    paragraphs:
    - zh: 该应用只覆盖 WMI 方式，不禁止普通进程的其他系统 getter。Trace 或生存期不完整会丢失客户端，批准代理被攻陷仍可匹配职责；命名空间审核不证明属性读取成功，结果与稳定性代价须另行评估，无法承诺预防所有进程内画像。
      en: This application covers WMI rather than other system getters in ordinary processes. Incomplete tracing or lifetimes
        can lose client identity, and a compromised approved agent can match expected duties. Namespace auditing does not
        establish successful attribute acquisition. Results and stability costs need separate assessment, with no promise
        to prevent all in-process profiling.
