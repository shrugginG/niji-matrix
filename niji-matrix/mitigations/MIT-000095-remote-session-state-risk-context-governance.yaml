schema_version: 2.0.0
type: mitigation
id: MIT-000095
name: {zh: 远程会话状态、风险情境与全路径撤销治理, en: "Remote Session-State, Risk-Context, and Full-Path Revocation Governance"}
summary:
  zh: 以短寿命绑定会话、来源/设备变化重认证、代理与设备来源核验、持续风险评估和全局撤销，降低隐蔽远程入口与持续重入。
  en: Reduce covert remote entry and continuing re-entry through short-lived bound sessions, reauthentication on origin or device change, proxy and device-provenance validation, continuous risk evaluation, and global revocation.
description:
  paragraphs:
    - zh: 本缓解把远程接入控制从“密码与 MFA 是否成功”扩展到 session/token 完整生命周期和登录风险情境。组织应缩短状态寿命、对高价值服务使用 proof-of-possession 或设备/证书绑定、在来源/设备显著变化时重新认证，并保留签发、refresh、challenge、使用、logout 与 revoke。风险控制同时验证 IP/ASN/ISP、代理类型、设备资产与注册来源、客户端、时间和后继资源，而不把本地住宅 IP 当作可信身份。
      en: This mitigation expands remote-access control beyond whether password and MFA succeeded to complete session or token lifecycle and sign-in risk context. Organizations should shorten state lifetime, use proof of possession or device or certificate binding for high-value services, reauthenticate on material origin or device change, and retain issuance, refresh, challenge, use, logout, and revoke. Risk controls also validate IP, ASN or ISP, proxy type, device asset and enrollment origin, client, time, and downstream resource rather than treating a local residential IP as trusted identity.
    - zh: 处置必须覆盖所有认证状态和远程入口。确认账户或网关受影响后，保存 session/token、设备、来源和资源证据，再撤销 access/refresh token、cookie、gateway session、设备信任与相关证书，轮换凭据并验证撤销实际传播；随后对相同主体、设备、代理与服务监控重入。只重置密码或终止当前 RDP/VPN 会话可能留下可恢复状态。
      en: Response must cover every authentication state and remote entry. After confirming account or gateway compromise, preserve session or token, device, origin, and resource evidence, then revoke access and refresh tokens, cookies, gateway sessions, device trust, and related certificates, rotate credentials, and verify actual revocation propagation. Monitor the same principal, device, proxy, and service for re-entry afterward. Resetting only a password or terminating the current RDP or VPN session can leave recoverable state.
domains: [enterprise]
measures:
  - key: bound-short-lived-session-state
    name: {zh: 短寿命且绑定的会话状态, en: "Short-Lived and Bound Session State"}
    description: {paragraphs: [{zh: 对高价值 VPN/VDI/管理网关使用短 access/refresh 寿命、proof-of-possession、设备或证书绑定、单点注销和来源/设备变化重认证，并记录稳定 session/token ID 或 hash。, en: "Use short access and refresh lifetimes, proof of possession, device or certificate binding, single logout, and reauthentication on origin or device change for high-value VPN, VDI, and management gateways and record a stable session or token ID or hash."}]}
    control_type: preventive
  - key: remote-origin-device-provenance
    name: {zh: 远程来源、代理与设备 Provenance, en: "Remote Origin, Proxy, and Device Provenance"}
    description: {paragraphs: [{zh: 维护企业 egress、住宅/移动/数据中心 ASN、代理提供方、设备资产与注册者、TLS/client 和用户旅行/轮班清单，对本地住宅代理和非资产设备不因低风险分数自动信任。, en: "Maintain enterprise egress, residential or mobile or datacenter ASN, proxy provider, device asset and registrant, TLS or client, and user travel or shift inventory and do not automatically trust a local residential proxy or nonasset device because of a low risk score."}]}
    control_type: detective-support
  - key: continuous-session-resource-risk
    name: {zh: 会话内持续资源风险评估, en: "Continuous In-Session Resource Risk Evaluation"}
    description: {paragraphs: [{zh: 将远程会话连接到端点进程、资源、命令与数据行为，在来源情境看似正常但后继用途偏离角色时提升风险并要求抗钓鱼重新认证或隔离。, en: "Join remote sessions to endpoint process, resource, command, and data behavior and raise risk with phishing-resistant reauthentication or containment when origin context looks normal but downstream use deviates from role."}]}
    control_type: detective-support
  - key: global-state-revocation-verification
    name: {zh: 全局认证状态撤销与生效验证, en: "Global Authentication-State Revocation and Effect Verification"}
    description: {paragraphs: [{zh: 事件响应同时撤销 access/refresh token、cookie、gateway session、设备信任与证书，记录预期生效时间并主动验证旧状态被拒绝；密码轮换不替代会话与设备撤销。, en: "Incident response revokes access and refresh tokens, cookies, gateway sessions, device trust, and certificates together, records expected effective time, and actively verifies old state is rejected. Password rotation does not replace session and device revocation."}]}
    control_type: containment
  - key: post-response-reentry-monitoring
    name: {zh: 处置后持续重入监控, en: "Post-Response Continuing-Reentry Monitoring"}
    description: {paragraphs: [{zh: 从处置前保留主体、session/token、设备、来源、代理和服务键，在撤销生效后监控相同或近似组合重新建立远程会话，并将其连接到资源结果与新认证步骤。, en: "Preserve principal, session or token, device, origin, proxy, and service keys from before response and monitor the same or near combination reestablishing remote sessions after revocation is effective, joining it to resource outcome and new authentication steps."}]}
    control_type: containment
applications:
  - target_ref: NJT-0055
    use: {paragraphs: [{zh: 对外部远程服务统一管理 session/token 生命周期、强设备/证书绑定、来源/设备变化重认证、长期用户风险基线和会话后资源关联。每个 VPN/RDP/VDI/管理会话应回答使用了哪一认证状态、从何来源与设备、哪些步骤被省略、是否命中基线以及处置后是否重入。, en: "Govern session or token lifecycle, strong device or certificate binding, reauthentication on origin or device change, long-term user-risk baselines, and post-session resource correlation across external remote services. Every VPN, RDP, VDI, or management session should identify which authentication state was used, origin and device, omitted steps, baseline match, and whether re-entry followed response."}]}
    expected_effect: {paragraphs: [{zh: 该应用缩短可重放状态寿命，减少只靠住宅代理或设备外观压低风险的机会，并让首次入口与持续重入都形成 session—来源—设备—资源谱系。攻击者必须同时控制更强绑定、持续情境和后继行为或频繁触发重认证与撤销。, en: "This application shortens replayable-state lifetime, reduces opportunities to lower risk through residential proxy or device appearance alone, and gives initial entry and continuing re-entry session-origin-device-resource lineage. The adversary must control stronger binding, continuous context, and downstream behavior together or repeatedly trigger reauthentication and revocation."}]}
    limitations: {paragraphs: [{zh: 旧 VPN/VDI 可能不支持 token binding、全局撤销或逐请求 ID，强重认证会影响漫游和可用性；住宅代理与真实用户共享 ISP。控制必须按服务能力分阶段部署并保留应急访问，不能用地理或设备单项阻断所有会话。, en: "Legacy VPN or VDI may not support token binding, global revocation, or request IDs, while strong reauthentication affects roaming and availability and residential proxies share ISPs with real users. Controls require service-specific staged deployment and emergency access and cannot block every session on geography or device alone."}]}
  - target_ref: NJS-0055-001
    use: {paragraphs: [{zh: 对状态重放，使用短 token/session 寿命、proof-of-possession、设备/证书/IP 适度绑定、来源变化挑战和并发检测；处置同时撤销 refresh/access、cookie、gateway session 和设备状态，并在预期生效后验证旧材料失败。, en: "For state replay, use short token or session lifetime, proof of possession, measured device, certificate or IP binding, origin-change challenges, and concurrency detection. Response revokes refresh and access state, cookies, gateway sessions, and device state together and verifies old material fails after expected effect time."}]}
    expected_effect: {paragraphs: [{zh: 该应用阻止窃取状态在另一设备或来源无新认证地恢复会话，并使同一 token/session 的跨来源、并发和撤销后使用产生显著证据；攻击者必须重新取得受绑定状态或完成新的强认证。, en: "This application prevents stolen state from resuming a session on another device or origin without new authentication and makes cross-origin, concurrent, and post-revocation use of one token or session conspicuous. The adversary must reacquire bound state or complete new strong authentication."}]}
    limitations: {paragraphs: [{zh: 严格 IP 绑定会破坏移动和 roaming，撤销可能传播延迟，部分服务没有稳定 token ID；未知 cookie/token 内容也不能写入日志。控制需要用 hash/ID 与设备证明，并为 HA 与合法恢复校准。, en: "Strict IP binding breaks mobility and roaming, revocation can propagate slowly, and some services lack stable token IDs, while raw cookie or token content cannot be logged. Controls need hashes or IDs plus device proof and calibration for high availability and legitimate recovery."}]}
  - target_ref: NJS-0055-002
    use: {paragraphs: [{zh: 对风险情境拟态，将地理与 ASN 视为概率信号并结合 proxy provider、network class、设备资产/注册者、TLS/client、用户实际活动、时间和会话内资源；本地住宅来源或已注册设备仍需可解释 owner 与后继用途，异常时要求强重认证。, en: "For risk-context mimicry, treat geography and ASN as probabilistic signals and combine proxy provider, network class, device asset or registrant, TLS or client, actual user activity, time, and in-session resources. A local residential origin or registered device still needs an explainable owner and downstream use and triggers strong reauthentication on anomaly."}]}
    expected_effect: {paragraphs: [{zh: 该应用使攻击者不能仅购买本地住宅出口或借用设备外观就继承用户信誉，必须同时匹配更难伪造的设备 provenance 与会话内行为；代理和设备变化会留下可审查痕迹。, en: "This application prevents an adversary from inheriting user reputation merely by buying local residential egress or borrowing device appearance and requires alignment with harder-to-forge device provenance and in-session behavior. Proxy and device changes leave reviewable evidence."}]}
    limitations: {paragraphs: [{zh: 真实用户会旅行、换设备、使用企业/隐私代理和移动网络，过强风险控制会误阻远程办公；provider 不公开 risk 特征时难以解释。应使用分层挑战和用户/角色基线，不以国家、ASN 或 residential 标签单独定罪。, en: "Real users travel, change devices, and use enterprise or privacy proxies and mobile networks, so aggressive risk controls can block remote work and providers may not expose risk features. Use tiered challenges and user or role baselines rather than making country, ASN, or a residential label independently malicious."}]}
evidence_refs: [REF-000102, REF-000103, REF-000111, REF-000112, REF-000070]
