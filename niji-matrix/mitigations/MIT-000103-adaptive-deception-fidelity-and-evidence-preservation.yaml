schema_version: 2.0.0
type: mitigation
id: MIT-000103
name:
  zh: 自适应诱捕真实性与证据保全
  en: Adaptive Deception Fidelity and Evidence Preservation
summary:
  zh: 通过跨表面一致性、部署异质性、渐进交互和隐蔽共享遥测，提高远程判真的成本并保留条件化退出证据。
  en: Increase the cost of remote authenticity assessment and preserve evidence of conditional exit through cross-surface
    coherence, deployment heterogeneity, progressive interaction, and concealed shared telemetry.
description:
  paragraphs:
  - zh: 本缓解以不向攻击者提供稳定判真信号为目标，同时让诱捕节点在风险受控的前提下持续到足以观察后续行为。措施覆盖技术与运行状态一致性、节点间差异化、按风险逐步提高交互深度，以及不改变外部响应的跨节点证据保全；它降低识别可靠性和能力保留收益，但不能保证攻击者继续攻击。
    en: This mitigation aims to avoid giving the adversary stable authenticity signals while allowing a deception node to
      continue long enough to observe follow-on behavior under controlled risk. Measures cover coherence of technical and
      operational state, heterogeneity across nodes, risk-based progressive interaction, and cross-node evidence preservation
      that does not alter external responses. It reduces assessment reliability and the benefit of capability withholding
      but cannot guarantee that an adversary will continue.
domains:
- enterprise
- ics
measures:
- key: cross-surface-coherence
  name:
    zh: 跨表面状态一致性
    en: Cross-surface state coherence
  description:
    paragraphs:
    - zh: 让横幅、网络身份、协议状态、错误处理、业务数据和时间演化共享一致的设备与运行模型，并在部署变更时同步更新相关表面。
      en: Make banners, network identity, protocol state, error handling, operational data, and temporal evolution follow
        one coherent device and operational model, updating related surfaces together when the deployment changes.
  control_type: cost-increasing
- key: heterogeneous-dynamic-deployment
  name:
    zh: 异质动态部署
    en: Heterogeneous dynamic deployment
  description:
    paragraphs:
    - zh: 在相关节点之间改变模板、寿命、暴露节奏和响应微特征，避免所有节点同步出现、消失或呈现可批量关联的固定时序。
      en: Vary templates, lifetimes, exposure cadence, and response microfeatures across related nodes to avoid synchronized
        appearance, disappearance, or fixed timing that can be correlated at scale.
  control_type: exposure-reduction
- key: progressive-safe-interaction
  name:
    zh: 渐进式安全高交互
    en: Progressive safe high interaction
  description:
    paragraphs:
    - zh: 在隔离和资源限制下逐步开放有状态功能与真实后端语义，使浅层挑战不会立即暴露仿真，同时在进入高风险阶段前执行边界控制。
      en: Gradually expose stateful functions and genuine backend semantics under isolation and resource limits so shallow
        challenges do not immediately reveal emulation while enforcing boundaries before high-risk stages.
  control_type: containment
- key: concealed-fleet-telemetry
  name:
    zh: 隐蔽节点群遥测
    en: Concealed fleet telemetry
  description:
    paragraphs:
    - zh: 跨节点保存请求、响应、部署版本、会话结果和回访关系，同时避免采集组件改变面向攻击者的延迟、错误或协议外观。
      en: Preserve requests, responses, deployment versions, session outcomes, and revisit relationships across nodes while
        preventing collection components from changing attacker-visible latency, errors, or protocol appearance.
  control_type: detective-support
applications:
- target_ref: NJT-0104
  use:
    paragraphs:
    - zh: 组合四项措施，使远程技术、运行与时间表面保持可信但不完全同质，并将所有真实性挑战和后续结果汇入同一证据面。
      en: Combine all four measures so remote technical, operational, and temporal surfaces remain credible without becoming
        fully homogeneous, and bring authenticity challenges and follow-on outcomes into one evidence surface.
  expected_effect:
    paragraphs:
    - zh: 攻击者需要投入更多请求、来源和时间才能形成可靠判断，防守方同时获得从判真到行为转折的更完整链条。
      en: The adversary must invest more requests, origins, and time to reach a reliable assessment while defenders gain a
        more complete chain from authenticity testing to behavioral transition.
  limitations:
    paragraphs:
    - zh: 高真实性和长保留期增加运维、隔离与隐私成本；外部情报或已泄露的地址信誉仍可能让攻击者在没有本地交互时避开节点。
      en: High fidelity and long retention increase operations, isolation, and privacy costs. External intelligence or leaked
        address reputation may still let an adversary avoid a node without local interaction.
- target_ref: NJS-0104-001
  use:
    paragraphs:
    - zh: 重点实施跨表面状态一致性与渐进式交互，让身份、状态机、错误处理和运行数据在同一会话中保持因果一致。
      en: Emphasize cross-surface state coherence and progressive interaction so identity, state machines, error handling,
        and operational data remain causally consistent within one session.
  expected_effect:
    paragraphs:
    - zh: 减少差分挑战可利用的矛盾，并迫使攻击者进入更深、更可观察的交互才能区分环境。
      en: Reduce contradictions available to differential challenges and force the adversary into deeper, more observable
        interaction to distinguish the environment.
  limitations:
    paragraphs:
    - zh: 无法真实实现的专有功能或信息物理过程仍可能形成指纹；过度仿真会扩大安全风险和维护负担。
      en: Proprietary functions or cyber-physical processes that cannot be implemented faithfully may remain fingerprints.
        Excessive emulation expands safety risk and maintenance burden.
- target_ref: NJS-0104-002
  use:
    paragraphs:
    - zh: 使用异质动态部署并保留节点身份映射，使外部可见变化不形成整齐同步模式，同时内部仍可跨版本关联回访。
      en: Use heterogeneous dynamic deployment while retaining internal node-identity mappings so external change does not
        form a synchronized pattern and revisits remain correlatable across versions internally.
  expected_effect:
    paragraphs:
    - zh: 降低攻击者从寿命、拓扑和时序推断统一编排的可靠性，并提高防守方重建低频复测的能力。
      en: Lower the reliability of inferring common orchestration from lifetime, topology, and timing while improving defenders'
        ability to reconstruct low-rate revisits.
  limitations:
    paragraphs:
    - zh: 云提供商、网络路径和地址分配仍可能留下共同基础设施特征；变化过于频繁也可能自身成为异常模式。
      en: Cloud provider, network path, and address allocation may still reveal common infrastructure. Changes that are too
        frequent can themselves become an anomalous pattern.
- target_ref: NJS-0104-003
  use:
    paragraphs:
    - zh: 采用渐进式安全交互和隐蔽节点群遥测，让通过浅层检查的会话能够在隔离条件下继续，并用同类响应组保存退出与载荷结果差异。
      en: Use progressive safe interaction and concealed fleet telemetry so sessions that pass shallow checks can continue
        under isolation and comparable response cohorts preserve differences in exit and payload outcomes.
  expected_effect:
    paragraphs:
    - zh: 增加获得后续载荷或控制行为的机会，并把“未见载荷”转化为可由对照和回访支持的条件化证据。
      en: Increase opportunities to observe follow-on payload or control behavior and turn an absent payload into conditional
        evidence supported by controls and revisits.
  limitations:
    paragraphs:
    - zh: 攻击者仍可基于外部信誉直接退出，且允许更深交互必须受隔离、资源和法律边界约束。
      en: The adversary may still exit directly based on external reputation, and deeper interaction must remain bounded by
        isolation, resource, and legal constraints.
