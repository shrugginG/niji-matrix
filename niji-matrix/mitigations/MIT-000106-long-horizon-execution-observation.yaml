schema_version: 2.0.0
type: mitigation
id: MIT-000106
name:
  zh: 长周期执行观察与时间差分
  en: Long-Horizon Execution Observation and Time Differential
summary:
  zh: 延长进程与持久对象的关联寿命，并用一致的虚拟时间和资源约束降低延迟执行规避收益。
  en: Extend correlation lifetime for processes and persistent objects and use coherent virtual time and resource controls
    to reduce the benefit of delayed-execution evasion.
description:
  paragraphs:
  - zh: 延迟机制通常是正常系统功能，不能普遍禁止。本缓解保留等待前后稳定身份和敏感结果，在隔离分析中一致推进相关时钟与计时器，并限制无业务作用的计算和输出资源；长期任务和日期门控对象需有所有者、用途和到期。
    en: Delay mechanisms are normal system functions and cannot be prohibited generally. This mitigation retains stable identity
      and sensitive outcomes before and after waiting, advances related clocks and timers coherently in isolated analysis,
      and constrains computation and output with no business effect. Long-lived tasks and date-gated objects require an owner,
      purpose, and expiry.
domains:
- enterprise
measures:
- key: long-lived-causality
  name:
    zh: 长寿命因果保留
    en: Long-Lived Causality Retention
  description:
    paragraphs:
    - zh: 保存进程 start key、样本、脚本、任务和植入体身份，并把等待事件与重启后或长期后的首个敏感动作连接。
      en: Preserve process start key, sample, script, task, and implant identity and join waiting events to the first sensitive
        action after reboot or a long interval.
  control_type: detective-support
- key: coherent-time-differential
  name:
    zh: 一致时间差分
    en: Coherent Time Differential
  description:
    paragraphs:
    - zh: 在隔离分析中同步推进墙钟、单调时钟、计时器和计划对象，比较正常时间与加速时间的行为，并限制无效循环资源。
      en: Advance wall clock, monotonic clock, timers, and scheduled objects coherently in isolated analysis, compare normal
        and accelerated-time behavior, and limit resources consumed by ineffective loops.
  control_type: detective-support
- key: work-value-and-resource-bounds
  name:
    zh: 工作价值计量与资源边界
    en: Work-Value Accounting and Resource Bounds
  description:
    paragraphs:
    - zh: 按进程统计操作模板、重复次数、唯一对象、持久输出、CPU、I/O 与墙钟用时，对低输出高消耗循环实施隔离资源上限，并在上限到达后保留进程与后继载荷供差分执行。
      en: Measure operation templates, repetition, unique objects, durable output, CPU, I/O, and wall-clock time by process,
        enforce isolated resource ceilings on low-output high-cost loops, and preserve the process and successor payload for
        differential execution after the ceiling is reached.
  control_type: containment
applications:
- target_ref: NJT-0107
  use:
    paragraphs:
    - zh: 对未知或高风险样本保留完整寿命遥测，执行一致时间差分，并为合法长期等待建立业务依赖和所有者基线。
      en: Retain full-lifetime telemetry for unknown or high-risk samples, perform coherent time differential, and baseline
        business dependency and ownership for legitimate long waits.
  expected_effect:
    paragraphs:
    - zh: 等待不再自动越过观察窗口，延迟后的首个动作可回连原始样本，基于时钟差异的规避更容易暴露。
      en: Waiting no longer automatically outlasts observation, the first action after delay can be joined to the original
        sample, and clock-dependent evasion is more readily exposed.
  limitations:
    paragraphs:
    - zh: 长保留和重复执行成本高，真实数周或数月等待难以完整模拟；恶意代码还可依赖外部事件或多时钟一致性检查，导致差分不稳定。
      en: Long retention and repeated execution are expensive, and real waits of weeks or months are difficult to simulate
        fully. Malware may also depend on external events or cross-clock consistency checks, making differential results unstable.
- target_ref: NJS-0107-001
  use:
    paragraphs:
    - zh: 保留进程 start key、等待操作、计时器到期和后继敏感动作，在隔离环境同步推进墙钟、单调时钟与计时器，比较正常与加速条件下的后继结果。
      en: Preserve process start key, wait operation, timer due time, and sensitive successor action and advance wall clock,
        monotonic clock, and timers coherently in isolation to compare successor outcomes under normal and accelerated conditions.
  expected_effect:
    paragraphs:
    - zh: 静默等待不再稳定越过分析窗口，后继载荷可与原始等待与前态回连，时钟不一致检查也更易被差分发现。
      en: Quiescent waiting no longer reliably outlasts analysis, the successor payload can be joined to the original wait and
        prior state, and cross-clock consistency checks are more readily exposed by differential.
  limitations:
    paragraphs:
    - zh: 真实数周或数月等待难以完整模拟，外部事件与服务器时间也可能阻止加速；长寿命遥测增加存储成本。
      en: Real waits of weeks or months are difficult to simulate fully, and external events or server time may prevent acceleration.
        Long-lifetime telemetry increases storage cost.
- target_ref: NJS-0107-002
  use:
    paragraphs:
    - zh: 计算操作重复、对象数、工作输出比和资源消耗，对低输出高消耗循环设置隔离上限，并在一致加速时间下保留循环后载荷与操作模板关系。
      en: Measure repetition, object count, work-output ratio, and resource consumption, enforce isolated ceilings on low-output
        high-cost loops, and preserve the relationship between operation templates and the post-loop payload under coherently
        accelerated time.
  expected_effect:
    paragraphs:
    - zh: API hammering 和类似循环更难无界消耗分析窗口，防守方可直接观察低价值工作与后继恶意载荷的因果。
      en: API hammering and similar loops are less able to consume the analysis window without bound, and defenders can observe
        causality between low-value work and the malicious successor payload.
  limitations:
    paragraphs:
    - zh: 资源上限可能中断合法密集工作，工作价值计量需要应用上下文；高度分散的小批次操作可能避免单进程上限。
      en: Resource ceilings can interrupt legitimate intensive work and work-value accounting requires application context.
        Highly distributed small batches may avoid one-process ceilings.
