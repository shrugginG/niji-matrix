schema_version: 2.0.0
type: mitigation
id: MIT-000107
name:
  zh: 原始存储访问治理
  en: Raw Storage Access Governance
summary:
  zh: 最小化卷、设备和备份权限，并将低层 I/O 与文件对象及批准任务关联。
  en: Minimize volume, device, and backup authority and correlate low-level I/O with file objects and approved tasks.
description:
  paragraphs:
  - zh: 本缓解限制谁能打开原始卷、创建副本或使用备份语义，保护存储加密密钥，并保留块层进程归因与文件区间映射。合法备份和取证使用隔离身份、固定工具、目标范围和工单。
    en: This mitigation restricts who can open raw volumes, create copies, or use backup semantics, protects storage-encryption
      keys, and retains block-layer process attribution and file-extent mapping. Legitimate backup and forensics use
      isolated identities, fixed tooling, target scope, and work records.
domains:
- enterprise
measures:
- key: raw-device-least-authority
  name:
    zh: 原始设备最小权限
    en: Least Authority for Raw Devices
  description:
    paragraphs:
    - zh: 仅向登记备份、存储和取证服务授予卷、设备、备份和恢复权限，并限制普通管理员与脚本直接取得句柄。
      en: Grant volume, device, backup, and restore authority only to registered backup, storage, and forensic services
        and restrict ordinary administrators and scripts from obtaining handles directly.
  control_type: preventive
- key: block-object-lineage
  name:
    zh: 块到对象谱系
    en: Block-to-Object Lineage
  description:
    paragraphs:
    - zh: 记录进程级块 I/O、卷区间和文件映射，并与副本、输出和后继用途统一保留。
      en: Record process-level block I/O, volume extents, and file mapping and retain them with copies, outputs, and
        successor use.
  control_type: detective-support
applications:
- target_ref: NJT-0108
  use:
    paragraphs:
    - zh: 收紧原始存储与备份权限，隔离批准工具，并对敏感文件区间建立低层访问告警和结果关联。
      en: Tighten raw-storage and backup authority, isolate approved tools, and establish low-level access alerting
        and outcome correlation for sensitive file extents.
  expected_effect:
    paragraphs:
    - zh: 未授权主体更难绕开文件路径，成功低层访问也留下可映射到目标内容的证据。
      en: Unauthorized principals have greater difficulty bypassing file paths, and successful low-level access leaves
        evidence that can be mapped to target content.
  limitations:
    paragraphs:
    - zh: 备份与存储服务需要高权限，内核或固件攻击者可能避开主机遥测；完整块记录也有性能和隐私成本。
      en: Backup and storage services require high authority, kernel or firmware adversaries may evade host telemetry,
        and complete block recording has performance and privacy costs.
- target_ref: NJS-0177-002
  use:
    paragraphs:
    - zh: 对 OS 认证存储的 snapshot、backup 和 raw-derived view 限制创建、暴露和读取权限，把 copy ID 映射回活动 SAM、SECURITY、NTDS 或 shadow 对象，并连接输出。
      en: For snapshots, backups, and raw-derived views of OS authentication stores, restrict creation, exposure,
        and read authority, map the copy identifier back to live SAM, SECURITY, NTDS, or shadow objects, and join
        output.
  expected_effect:
    paragraphs:
    - zh: 该控制减少材料暴露范围并把处置收敛到可验证的对象、账户和复制关系。
      en: The control reduces material exposure scope and narrows response to verifiable objects, accounts, and replication
        relationships.
  limitations:
    paragraphs:
    - zh: 合法备份仍需要高权限，内核或存储管理员可绕过主机审计；介质控制不能证明材料未在更早时间被复制。
      en: Legitimate backup still needs high authority, kernel or storage administrators can bypass host audit, and
        medium controls cannot prove material was not copied earlier.
- target_ref: NJT-0202
  use:
    paragraphs:
    - zh: 限制 raw device/volume write、危险 IOCTL 和驱动加载到批准工具/身份/设备范围，监测关键 extents 并外部保留日志。
      en: Restrict raw device or volume writes, dangerous IOCTLs, and driver load to approved tools, identities, and
        device scope, monitor critical extents, and retain logs externally.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难取得或滥用 raw-write 权限，破坏写入在介质失效前可被阻断或归因。
      en: Attackers have less ability to obtain or abuse raw-write rights and destructive writes can be blocked or
        attributed before media failure.
  limitations:
    paragraphs:
    - zh: 高权内核/存储控制器和签名但脆弱驱动可绕过，严格控制会影响运维/取证。
      en: High-privilege kernels or storage controllers and signed vulnerable drivers can bypass controls, while strict
        controls affect operations and forensics.
- target_ref: NJS-0202-001
  use:
    paragraphs:
    - zh: 对 MBR/GPT/MFT 等关键区间实施优先 raw-I/O 监测和结构 hash/CRC，任何无工单小范围写入立即阻断/隔离。
      en: Prioritize raw-I/O monitoring and structure hash or CRC for MBR, GPT, MFT, and similar critical extents
        and block or isolate small writes without a ticket.
  expected_effect:
    paragraphs:
    - zh: 少量关键写入不再因总写量低而被忽略。
      en: Small critical writes are no longer ignored because total volume is low.
  limitations:
    paragraphs:
    - zh: 结构随正常格式化/升级变化，跨文件系统 extent 清单和性能成本需管理。
      en: Structures change during normal format or upgrade and cross-filesystem extent inventory and performance
        cost need management.
