schema_version: 2.0.0
type: mitigation
id: MIT-000108
name:
  zh: 观察边界加固与独立审计
  en: Observation-Boundary Hardening and Independent Audit
summary:
  zh: 通过补丁、隔离、利用缓解和独立遥测降低漏洞跨越观察边界的机会与影响。
  en: Reduce the opportunity and impact of vulnerability-driven observation-boundary crossing through patching, isolation,
    exploit mitigations, and independent telemetry.
description:
  paragraphs:
  - zh: 本缓解优先修补日志、安全工具、内核、云和 SaaS 边界缺陷，隔离高风险组件并启用控制流和内存利用保护；关键动作同时写入不依赖目标组件的基础设施或控制面审计，健康检查验证事件完整性而不只验证进程存活。
    en: This mitigation prioritizes patching flaws in logging, security-tool, kernel, cloud, and SaaS boundaries, isolates
      high-risk components, and enables control-flow and memory exploit protection. Critical actions are also written to infrastructure
      or control-plane audit independent of the target component, and health checks validate event integrity rather than process
      liveness alone.
domains:
- enterprise
measures:
- key: patch-and-exploit-protection
  name:
    zh: 补丁与利用保护
    en: Patching and Exploit Protection
  description:
    paragraphs:
    - zh: 维护组件版本与暴露面，快速修补已知缺陷，并在兼容范围内部署沙箱、微分段、控制流和内存保护。
      en: Maintain component versions and exposure, patch known flaws rapidly, and deploy sandboxing, microsegmentation, control-flow,
        and memory protections where compatible.
  control_type: preventive
- key: independent-audit-plane
  name:
    zh: 独立审计面
    en: Independent Audit Plane
  description:
    paragraphs:
    - zh: 从基础设施、内核或控制面记录关键对象与动作，并与组件自身日志比较预期事件序列和主体。
      en: Record critical objects and actions from infrastructure, kernel, or control-plane sources and compare expected event
        sequence and subject with component-local logs.
  control_type: detective-support
applications:
- target_ref: NJT-0110
  use:
    paragraphs:
    - zh: 对承担监控、日志或受信执行的组件优先修补和隔离，并为其关键动作建立独立审计与完整性差分。
      en: Prioritize patching and isolation for components that provide monitoring, logging, or trusted execution and establish
        independent audit and integrity differential for their critical actions.
  expected_effect:
    paragraphs:
    - zh: 可利用缺陷减少，单一组件被绕过时仍有独立证据，遥测缺口更快被识别并连接后继活动。
      en: Exploitable flaws decrease, independent evidence remains when one component is bypassed, and telemetry gaps are
        recognized and joined to successor activity more quickly.
  limitations:
    paragraphs:
    - zh: 未知漏洞、托管 SaaS 和内核级攻击可能仍绕过多个观察面；补丁和利用保护存在兼容性与运营成本。
      en: Unknown flaws, managed SaaS, and kernel-level attacks may still bypass multiple observation planes. Patching and
        exploit protection carry compatibility and operational costs.
- target_ref: NJS-0110-001
  use:
    paragraphs:
    - zh: 修补已知审计路径缺陷，关闭非生产端点，并把关键资源状态、网络请求和下游消费复制到不依赖同一服务日志的观察面。
      en: Patch known audit-path flaws, close non-production endpoints, and replicate critical resource state, network requests,
        and downstream consumption into observation planes independent of the same service log.
  expected_effect:
    paragraphs:
    - zh: 缺陷路径被移除；即使主要事件未生成，独立对象状态与请求证据仍可暴露不一致。
      en: The flawed path is removed, and independent object state and request evidence still expose inconsistency even if
        the primary event is not generated.
  limitations:
    paragraphs:
    - zh: 托管服务可能不提供独立状态或端点清单，未知缺陷在厂商修复前仍可绕过主要审计面。
      en: Managed services may not expose independent state or endpoint inventory, and unknown flaws may continue to bypass
        the primary audit plane before vendor remediation.
- target_ref: NJS-0110-002
  use:
    paragraphs:
    - zh: 修补接口逃逸漏洞，限制管理入口和账户，并为 appliance 建立集中 accounting、网络流、固件完整性与可行的底层威胁狩猎。
      en: Patch interface-escape flaws, restrict management entry and accounts, and establish centralized accounting, network
        flow, firmware integrity, and feasible underlying threat hunting for appliances.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难从受限接口进入底层环境，成功跨越也会在接口外留下可关联证据。
      en: The adversary has greater difficulty entering the underlying environment from the constrained interface, and a successful
        crossing leaves correlatable evidence outside the interface.
  limitations:
    paragraphs:
    - zh: 黑盒设备可能缺少底层遥测，补丁需要停机，拥有本地最高权限的攻击者仍可能破坏 accounting 与固件状态。
      en: Black-box devices may lack underlying telemetry, patching may require downtime, and an adversary with highest local
        authority may still damage accounting and firmware state.
