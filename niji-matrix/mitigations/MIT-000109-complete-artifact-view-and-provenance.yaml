schema_version: 2.0.0
type: mitigation
id: MIT-000109
name:
  zh: 完整工件视图与表示谱系治理
  en: Complete Artifact View and Representation-Lineage Governance
summary:
  zh: 用完整枚举、全命名空间扫描、不可变创建记录和跨观察域遥测缩小工件可见性差异。
  en: Reduce artifact-visibility differences through complete enumeration, all-namespace scanning, immutable creation records,
    and cross-observation-domain telemetry.
description:
  paragraphs:
  - zh: 本缓解要求防守方不把默认视图当作完整状态。组织保存底层对象身份与修改者，扫描所有地址空间，保留创建时与运行时表示谱系，并将虚拟化管理面、宿主和来宾遥测按实例连接；合法隐藏、排除和隔离均需 owner、用途和到期。
    en: This mitigation requires defenders not to treat a default view as complete state. Organizations preserve underlying
      object identity and modifier, scan all address spaces, retain creation-time to runtime representation lineage, and join
      virtualization management-plane, host, and guest telemetry by instance. Legitimate hiding, exclusion, and isolation
      require an owner, purpose, and expiry.
domains:
- enterprise
measures:
- key: complete-enumeration-and-namespace-scan
  name:
    zh: 完整枚举与全命名空间扫描
    en: Complete Enumeration and All-Namespace Scanning
  description:
    paragraphs:
    - zh: 定期比较默认与完整对象视图，遍历隐藏属性、替代数据地址、扩展属性、资源分支和挂载关系，并关联实际消费。
      en: Compare default and complete object views regularly, traverse hidden attributes, alternate data addresses, extended
        attributes, resource forks, and mount relationships, and correlate actual consumption.
  control_type: detective-support
- key: immutable-representation-lineage
  name:
    zh: 不可变表示谱系
    en: Immutable Representation Lineage
  description:
    paragraphs:
    - zh: 在创建或启动时保存参数、源码、编译状态和对象摘要，并与运行时内存、查询表示和结果比较。
      en: Preserve arguments, source, compiled state, and object digest at creation or launch and compare them with runtime
        memory, queried representation, and outcome.
  control_type: detective-support
- key: cross-domain-coverage
  name:
    zh: 跨观察域覆盖
    en: Cross-Observation-Domain Coverage
  description:
    paragraphs:
    - zh: 限制未管理虚拟实例，要求来宾代理或等价管理面观察，并映射实例网络、镜像和磁盘谱系。
      en: Restrict unmanaged virtual instances, require guest agents or equivalent management-plane observation, and map instance
        network, image, and disk lineage.
  control_type: governance
applications:
- target_ref: NJT-0111
  use:
    paragraphs:
    - zh: 组合完整枚举、地址空间扫描、不可变表示和跨域覆盖，按稳定对象 ID 连接隐藏状态与后继消费。
      en: Combine complete enumeration, address-space scanning, immutable representation, and cross-domain coverage and join
        hidden state to successor consumption by stable object ID.
  expected_effect:
    paragraphs:
    - zh: 默认视图不再成为唯一事实源，工件即使隐藏仍留下可连接的底层状态、表示差异或边界事件。
      en: The default view is no longer the only source of truth, and a hidden artifact still leaves joinable underlying state,
        representation difference, or boundary event.
  limitations:
    paragraphs:
    - zh: 全量扫描、内存保存和来宾覆盖成本高，并涉及隐私与性能；内核或固件攻击者仍可能操纵多个视角。
      en: Complete scanning, memory retention, and guest coverage are expensive and have privacy and performance costs. Kernel
        or firmware adversaries may still manipulate multiple views.
- target_ref: NJS-0111-001
  use:
    paragraphs:
    - zh: 比较默认和完整枚举，审计隐藏与排除规则，并要求合法项具有 owner 和到期。
      en: Compare default and complete enumeration, audit hiding and exclusion rules, and require legitimate entries to have
        an owner and expiry.
  expected_effect:
    paragraphs:
    - zh: 被遗漏对象仍会在完整状态和消费关系中出现，用户界面或普通列表无法单独隐藏它。
      en: An omitted object still appears in complete state and consumption relationships and cannot be hidden by a user interface
        or ordinary list alone.
  limitations:
    paragraphs:
    - zh: 产品可能不提供完整枚举接口，合法系统隐藏对象数量大，需要精确基线。
      en: Products may not provide a complete-enumeration interface, and large numbers of legitimate system-hidden objects
        require precise baselines.
- target_ref: NJS-0111-002
  use:
    paragraphs:
    - zh: 扫描所有数据流、属性、分支和挂载，规范化地址并关联写入者与读取者。
      en: Scan all streams, attributes, forks, and mounts, normalize addresses, and correlate writer and reader.
  expected_effect:
    paragraphs:
    - zh: 替代地址不再绕开内容检查，隐藏内容可按承载对象和摘要追踪。
      en: Alternate addresses no longer bypass content inspection, and hidden content can be tracked by carrier object and
        digest.
  limitations:
    paragraphs:
    - zh: 文件系统语义不同，备份和迁移可能丢失属性；全命名空间扫描会增加 I/O。
      en: File-system semantics differ, backups and migration may lose attributes, and all-namespace scanning increases I/O.
- target_ref: NJS-0111-003
  use:
    paragraphs:
    - zh: 保存创建时不可变参数和内容摘要，并与后续查询、内存和执行结果比较。
      en: Preserve immutable launch-time arguments and content digests and compare them with later queries, memory, and execution
        outcome.
  expected_effect:
    paragraphs:
    - zh: 攻击者修改可变表示后仍无法覆盖创建时事实，源码或参数与运行状态差异可检测。
      en: The adversary cannot overwrite creation-time facts by modifying a mutable representation, and source or argument
        differences from runtime state become detectable.
  limitations:
    paragraphs:
    - zh: 合法即时编译和自修改运行时会产生差异，内存采集成本和隐私风险较高。
      en: Legitimate just-in-time compilation and self-modifying runtimes create differences, and memory collection has substantial
        cost and privacy risk.
- target_ref: NJS-0111-004
  use:
    paragraphs:
    - zh: 限制虚拟实例创建，要求来宾或管理面传感器，并把桥接网络、镜像和磁盘映射到实例身份。
      en: Restrict virtual-instance creation, require guest or management-plane sensors, and map bridged networking, image,
        and disk to instance identity.
  expected_effect:
    paragraphs:
    - zh: 来宾内部活动不再只显示为宿主虚拟化进程，边界流量和内部工件能形成完整谱系。
      en: Guest activity no longer appears only as a host virtualization process, and boundary traffic and internal artifacts
        form a complete lineage.
  limitations:
    paragraphs:
    - zh: 未管理或加密来宾可能拒绝传感器，某些隔离环境无法安全检查内部内容。
      en: Unmanaged or encrypted guests may reject sensors, and some isolated environments cannot be inspected safely.
