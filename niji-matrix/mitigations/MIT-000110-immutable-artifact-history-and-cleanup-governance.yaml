schema_version: 2.0.0
type: mitigation
id: MIT-000110
name:
  zh: 不可变工件历史与清理治理
  en: Immutable Artifact History and Cleanup Governance
summary:
  zh: 用不可变远程历史、版本保留和受控清理权限，使痕迹变化可恢复并限制攻击者删除范围。
  en: Use immutable remote history, version retention, and governed cleanup authority so trace changes remain recoverable
    and adversary deletion scope is limited.
description:
  paragraphs:
  - zh: 本缓解把关键日志、对象版本、时间元数据、邮箱和持久化关系复制到攻击者权限之外，并最小化删除、保留策略和时间修改权限。合法清理必须有 owner、范围、工单与审计，恢复流程验证当前状态与独立历史。
    en: This mitigation copies critical logs, object versions, temporal metadata, mailbox state, and persistence relationships
      outside adversary authority and minimizes deletion, retention-policy, and time-modification rights. Legitimate cleanup
      has an owner, scope, work record, and audit, and recovery compares current state with independent history.
domains:
- enterprise
measures:
- key: immutable-remote-history
  name:
    zh: 不可变远程历史
    en: Immutable Remote History
  description:
    paragraphs:
    - zh: 集中复制关键事件和对象版本，使用独立身份、追加写或对象锁，并保留足够长的序号和元数据。
      en: Centrally replicate critical events and object versions under independent identity with append-only or object-lock
        controls and retain sequence and metadata long enough.
  control_type: detective-support
- key: governed-cleanup-authority
  name:
    zh: 受控清理权限
    en: Governed Cleanup Authority
  description:
    paragraphs:
    - zh: 分离删除、时间修改、邮箱规则、连接清理和持久化移除权限，要求审批并审计成功与失败操作。
      en: Separate authority for deletion, time modification, mailbox rules, connection cleanup, and persistence removal and
        require approval while auditing successful and failed operations.
  control_type: preventive
applications:
- target_ref: NJT-0112
  use:
    paragraphs:
    - zh: 对高价值工件保存攻击者不可修改的前态，并把清理权限限制给登记流程；检测和恢复按对象 ID 比较当前状态、远程历史和后继活动。
      en: Preserve attacker-immutable prior state for high-value artifacts and restrict cleanup authority to registered workflows.
        Detection and recovery compare current state, remote history, and successor activity by object ID.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以同时删除所有证据，选择性变化留下独立差分，时间和位置改写不能覆盖历史事实。
      en: The adversary has difficulty deleting every copy of evidence, selective change leaves an independent differential,
        and time or location rewriting cannot overwrite historical facts.
  limitations:
    paragraphs:
    - zh: 长期版本与不可变存储成本高并涉及隐私；拥有集中日志或云租户管理权的攻击者仍可能破坏多个副本，需要职责分离和离线恢复。
      en: Long-term versions and immutable storage are expensive and raise privacy concerns. An adversary controlling centralized
        logging or cloud-tenant administration may still damage multiple copies and requires separation of duties and offline
        recovery.
- target_ref: NJS-0112-001
  use:
    paragraphs:
    - zh: 把关键日志、脚本、暂存和载荷对象复制到追加写或对象锁存储，最小化删除权限，并保留删除者与恢复位置。
      en: Replicate critical log, script, staging, and payload objects into append-only or object-lock storage, minimize deletion
        authority, and retain deleting principal and recovery location.
  expected_effect:
    paragraphs:
    - zh: 删除当前对象不能消除全部内容与身份，独立副本可以恢复被擦除节点及其先前用途。
      en: Deleting the current object cannot remove all content and identity, and independent copies can recover the erased
        node and its prior use.
  limitations:
    paragraphs:
    - zh: 全量内容复制成本高且涉及隐私，短寿命内存对象和高权限云管理员仍可能逃逸或破坏多个副本。
      en: Full content replication is expensive and privacy-sensitive, while short-lived memory objects and highly privileged
        cloud administrators may still evade or damage multiple copies.
- target_ref: NJS-0112-002
  use:
    paragraphs:
    - zh: 对共享、连接和持久化关系保存两端会话与配置版本，限制拆除权限，并要求正常撤销具有 owner、原因与工单。
      en: Preserve both endpoint sessions and configuration versions for share, connection, and persistence relationships,
        restrict teardown authority, and require normal revocation to have an owner, reason, and work record.
  expected_effect:
    paragraphs:
    - zh: 当前关系被删除后仍可恢复建立、使用与拆除链，并区分正常关闭和攻击后清理。
      en: Establishment, use, and teardown can be recovered after the current relation is removed, distinguishing normal closure
        from post-attack cleanup.
  limitations:
    paragraphs:
    - zh: 动态会话数量大、跨产品关系 ID 不统一，服务器端日志缺失会降低重建能力。
      en: Dynamic session volume is high, relation identities differ across products, and missing server-side logs reduce reconstruction.
- target_ref: NJS-0112-003
  use:
    paragraphs:
    - zh: 限制时间属性修改权限，保留不可变创建与加载事件，并采集文件系统多套时间属性和时间写入调用者。
      en: Restrict timestamp modification authority, retain immutable create and load events, and collect multiple file-system
        timestamp sets and the time-writing caller.
  expected_effect:
    paragraphs:
    - zh: 用户可见时间即使被改写，也不能覆盖独立事件顺序和底层时间差分。
      en: Rewritten user-visible time cannot overwrite the independent event order and underlying timestamp differential.
  limitations:
    paragraphs:
    - zh: 合法恢复与复制大量改变时间，某些文件系统缺少第二时间源，内核级攻击者可能修改更底层元数据。
      en: Legitimate restore and copy operations change time extensively, some file systems lack a second time source, and
        kernel-level adversaries may modify deeper metadata.
- target_ref: NJS-0112-004
  use:
    paragraphs:
    - zh: 跨目录和卷保留内容摘要、复制或移动事件与消费者引用，并限制从临时路径向系统、排除和持久化目录的未批准提升。
      en: Retain content digests, copy or move events, and consumer references across directories and volumes and restrict
        unapproved promotion from temporary paths into system, excluded, and persistence directories.
  expected_effect:
    paragraphs:
    - zh: 载荷改变路径后仍可通过内容身份连接原始投递与新位置执行，并减少可用目标位置。
      en: A payload remains joinable from initial delivery to new-location execution through content identity and has fewer
        usable destination locations.
  limitations:
    paragraphs:
    - zh: 重打包或轻微改写会破坏强摘要，合法安装与更新广泛迁移文件，需要签名事务和模糊身份补充。
      en: Repacking or small rewrites break strong digests, and legitimate installation and update move files widely, requiring
        signed transactions and fuzzy identity as supplements.
