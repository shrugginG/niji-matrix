schema_version: 2.0.0
type: mitigation
id: MIT-000111
name:
  zh: 系统实用程序代理治理
  en: System-Utility Proxy Governance
summary:
  zh: 约束高风险实用程序的调用者、参数与配置，并保留代理到结果的完整谱系。
  en: Constrain callers, arguments, and configuration of high-risk utilities and preserve complete proxy-to-outcome lineage.
description:
  paragraphs:
  - zh: 本缓解盘点具有间接执行能力的系统实用程序，使用应用控制、参数策略和配置 ACL 限制调用，并集中记录完整输入、配置变化、子进程与网络。无法禁止的工具按批准用途建立 owner 与到期例外。
    en: This mitigation inventories system utilities with indirect execution capability, constrains invocation through application
      control, argument policy, and configuration ACLs, and centrally records complete input, configuration change, child
      processes, and networking. Utilities that cannot be prohibited use owner- and expiry-bound exceptions for approved purposes.
domains:
- enterprise
measures:
- key: utility-argument-and-config-control
  name:
    zh: 实用程序参数与配置控制
    en: Utility Argument and Configuration Control
  description:
    paragraphs:
    - zh: 将高风险工具限制给批准主体与参数模式，保护 SSH 等持久配置，并阻止用户可写脚本或目标被代理执行。
      en: Restrict high-risk utilities to approved principals and argument patterns, protect durable configuration such as
        SSH settings, and prevent proxy execution of user-writable scripts or targets.
  control_type: preventive
- key: proxy-outcome-lineage
  name:
    zh: 代理结果谱系
    en: Proxy Outcome Lineage
  description:
    paragraphs:
    - zh: 保存原始调用者、完整参数、配置写入、代理进程、子进程与网络，并使用稳定进程键关联。
      en: Preserve original caller, complete arguments, configuration writes, proxy process, child process, and networking
        and correlate them with stable process keys.
  control_type: detective-support
applications:
- target_ref: NJT-0113
  use:
    paragraphs:
    - zh: 对具有代理能力的系统实用程序应用最小调用权限、参数和配置约束，并把任何后继命令或网络归因回原始请求者。
      en: Apply least invocation authority, argument, and configuration constraints to system utilities with proxy capability
        and attribute every successor command or network action back to the original requester.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难利用受信工具绕过解释器限制，成功代理也不能隐藏真实命令与调用来源。
      en: Attackers have greater difficulty using a trusted utility to bypass interpreter controls, and successful proxying
        cannot hide the real command and caller origin.
  limitations:
    paragraphs:
    - zh: 企业运维广泛依赖系统工具，过严限制会破坏兼容性；工具新增功能或进程内执行可能绕过既有参数规则。
      en: Enterprise operations depend widely on system utilities, and strict restriction can break compatibility. New utility
        features or in-process execution may bypass existing argument rules.
- target_ref: NJS-0113-001
  use:
    paragraphs:
    - zh: 将 pcalua、forfiles、WSL、ScriptRunner 等高风险调用限制给批准主体和参数模式，并保留完整参数、标准输入摘要、调用文件与后继结果。
      en: Restrict high-risk invocation of pcalua, forfiles, WSL, ScriptRunner, and similar tools to approved principals and
        argument patterns and retain complete arguments, standard-input digest, invocation file, and successor outcome.
  expected_effect:
    paragraphs:
    - zh: 一次性恶意输入更难借用受信工具，成功代理也可在同一进程事务中恢复真实请求者与命令。
      en: One-shot malicious input has less opportunity to borrow a trusted tool, and successful proxying remains attributable
        to its real requester and command within one process transaction.
  limitations:
    paragraphs:
    - zh: 合法兼容性与自动化依赖相同工具，进程内执行或标准输入不可见可能绕过参数规则。
      en: Legitimate compatibility and automation depend on the same tools, and in-process execution or invisible standard
        input may bypass argument rules.
- target_ref: NJS-0113-002
  use:
    paragraphs:
    - zh: 保护用户与系统工具配置 ACL，集中版本化 ssh_config 等文件，禁用非必要 LocalCommand，并将配置写入与未来会话消费关联。
      en: Protect ACLs on user and system utility configuration, centrally version files such as ssh_config, disable unnecessary
        LocalCommand, and correlate configuration writes with future session consumption.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难植入持久代理命令，后续正常工具触发也能回溯到具体配置版本和写入者。
      en: The adversary has greater difficulty planting durable proxy commands, and later normal-tool triggers remain traceable
        to a specific configuration version and writer.
  limitations:
    paragraphs:
    - zh: 用户 home 与便携配置可能不受集中治理，业务堡垒和自动化需要相同选项，错误限制会中断连接。
      en: User homes and portable configuration may escape central governance, legitimate bastion and automation need the
        same options, and incorrect restrictions can break connectivity.
