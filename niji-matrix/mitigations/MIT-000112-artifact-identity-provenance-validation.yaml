schema_version: 2.0.0
type: mitigation
id: MIT-000112
name:
  zh: 工件身份来源验证
  en: Artifact Identity and Provenance Validation
summary:
  zh: 以签名、内容、对象身份、创建谱系和行为验证替代对名称、位置或显示类型的信任。
  en: Replace trust in name, location, or displayed type with validation of signing, content, object identity, creation lineage,
    and behavior.
description:
  paragraphs:
  - zh: 本缓解使用应用控制、签名与内容验证、对象唯一标识、创建与重命名历史、真实父体和网络行为来验证身份。名称、路径、图标、扩展名、账户名和用户代理只作为提示，不作为信任依据。
    en: This mitigation validates identity through application control, signing and content validation, unique object identifiers,
      creation and rename history, actual parent, and network behavior. Name, path, icon, extension, account name, and user
      agent are hints rather than trust anchors.
domains:
- enterprise
measures:
- key: verified-artifact-identity
  name:
    zh: 已验证工件身份
    en: Verified Artifact Identity
  description:
    paragraphs:
    - zh: 将签名、哈希、文件头、对象 ID、发布者和来源路径组合为稳定身份，并阻止用户可写位置冒用受信对象。
      en: Combine signing, hash, file header, object ID, publisher, and provenance path into a stable identity and prevent
        user-writable locations from impersonating trusted objects.
  control_type: preventive
- key: immutable-creation-lineage
  name:
    zh: 不可变创建谱系
    en: Immutable Creation Lineage
  description:
    paragraphs:
    - zh: 保存创建者、实际父体、原始名称与参数以及后续重命名和移动，关联对象行为结果。
      en: Preserve creator, actual parent, original name and arguments, and later rename and move events and correlate object
        behavior outcomes.
  control_type: detective-support
applications:
- target_ref: NJT-0114
  use:
    paragraphs:
    - zh: 对文件、任务、服务、账户、进程和网络客户端使用可验证来源与行为身份，限制基于名称和位置的允许规则。
      en: Use verifiable provenance and behavioral identity for files, tasks, services, accounts, processes, and network clients
        and restrict allow logic based on name and location.
  expected_effect:
    paragraphs:
    - zh: 攻击者改变表面特征不会自动继承合法信任，多源身份差异可在敏感结果前被识别。
      en: Changing surface features no longer automatically inherits legitimate trust, and multi-source identity differences
        can be identified before a sensitive outcome.
  limitations:
    paragraphs:
    - zh: 合法软件更新和动态内容会改变哈希与路径，签名基础设施也可能被滥用；完整谱系保留增加存储与隐私成本。
      en: Legitimate software updates and dynamic content change hashes and paths, and signing infrastructure can be abused.
        Complete lineage retention increases storage and privacy cost.
- target_ref: NJS-0114-001
  use:
    paragraphs:
    - zh: 对文件、任务、服务、账户和工具强制验证签名状态、稳定对象 ID、内容摘要、创建者与变更审批，不让名称或受信路径单独授予信任。
      en: Enforce signing state, stable object identity, content digest, creator, and change approval for files, tasks, services, accounts, and utilities, and do not let a name or trusted path grant trust alone.
  expected_effect:
    paragraphs:
    - zh: 借用受信资源标签的对象无法自动继承允许规则，来源差异可在执行或授权前被阻断。
      en: Objects borrowing a trusted resource label cannot automatically inherit allow rules, and provenance differences can be blocked before execution or authorization.
  limitations:
    paragraphs:
    - zh: 合法升级和迁移会改变内容与位置，被盗证书仍可能通过签名验证，故需结合行为与审批。
      en: Legitimate upgrades and migrations change content and location, and a stolen certificate may still pass signing validation, so behavior and approval must also be used.
- target_ref: NJS-0114-002
  use:
    paragraphs:
    - zh: 在邮件、下载、归档和文件管理界面显示完整扩展与控制字符，以文件头和策略确定类型，并阻止呈现类型与执行类型不一致的对象。
      en: Display complete extensions and control characters in mail, download, archive, and file-management interfaces, determine type from headers and policy, and block objects whose presented and execution types differ.
  expected_effect:
    paragraphs:
    - zh: 双扩展、不可见字符和图标不能再把可执行内容自动降级为媒体或文档。
      en: Double extensions, invisible characters, and icons can no longer automatically downgrade executable content to media or a document.
  limitations:
    paragraphs:
    - zh: 复杂容器和多格式文件可能具有多个合法类型，旧客户端未必能安全呈现全部字符。
      en: Complex containers and polyglot files may have multiple legitimate types, and legacy clients may not safely render every character.
- target_ref: NJS-0114-003
  use:
    paragraphs:
    - zh: 限制 WMI、服务和任务 broker 的调用主体与命令范围，启用客户端和服务端审计，并以活动 ID 将请求者连接到所创建进程。
      en: Restrict callers and command scope for WMI, service, and task brokers, enable client- and server-side auditing, and join requesters to created processes with activity identities.
  expected_effect:
    paragraphs:
    - zh: 正常系统父体不再掩盖真实请求者，未批准代理执行可被拒绝或快速归因。
      en: A normal system parent no longer hides the real requester, and unapproved brokered execution can be denied or rapidly attributed.
  limitations:
    paragraphs:
    - zh: 合法管理依赖这些 broker，活动 ID 传播不一致，严格限制可能影响运维自动化。
      en: Legitimate administration depends on these brokers, activity-identity propagation varies, and strict restrictions may affect operational automation.
- target_ref: NJS-0114-004
  use:
    paragraphs:
    - zh: 将出站连接绑定到发起进程和用户会话，比较 User-Agent、TLS 与 HTTP 指纹，并限制非浏览器进程访问浏览器凭据和外部目标。
      en: Bind outbound connections to originating process and user session, compare User-Agent, TLS, and HTTP fingerprints, and restrict non-browser processes from browser credentials and external destinations.
  expected_effect:
    paragraphs:
    - zh: 复制单个客户端字符串不足以进入浏览器基线，跨层矛盾和非预期进程可触发阻断。
      en: Copying one client string is insufficient to enter the browser baseline, and cross-layer conflicts and unexpected processes can trigger blocking.
  limitations:
    paragraphs:
    - zh: 代理和嵌入式浏览器会改变指纹，端点到网络映射与会话元数据具有部署和隐私成本。
      en: Proxies and embedded browsers change fingerprints, and endpoint-to-network mapping and session metadata carry deployment and privacy cost.
