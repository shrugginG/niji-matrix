schema_version: 2.0.0
type: mitigation
id: MIT-000113
name:
  zh: 内容规范化与运行时检查
  en: Content Normalization and Runtime Inspection
summary:
  zh: 在信任与执行前递归规范化内容，并用隔离运行时、内存检查和应用控制限制遮蔽载荷。
  en: Recursively normalize content before trust and execution and use isolated runtime, memory inspection, and application
    control to constrain obscured payloads.
description:
  paragraphs:
  - zh: 本缓解对文档、脚本、命令、归档和网络载体执行安全解码、解压与结构解析，将恢复内容重新进入扫描；未知或无法恢复内容在隔离环境执行并监控内存。应用控制限制恢复后代码和用户可写载体的执行。
    en: This mitigation safely decodes, decompresses, and parses documents, scripts, commands, archives, and network
      carriers and resubmits recovered content to scanning. Unknown or unrecoverable content executes in isolation with
      memory monitoring. Application control constrains recovered code and execution from user-writable carriers.
domains:
- enterprise
measures:
- key: recursive-content-normalization
  name:
    zh: 递归内容规范化
    en: Recursive Content Normalization
  description:
    paragraphs:
    - zh: 记录每层变换并递归解码、解压和提取嵌入内容，将所有恢复对象按独立摘要扫描。
      en: Record every transformation layer and recursively decode, decompress, and extract embedded content, scanning
        every recovered object by independent digest.
  control_type: preventive
- key: isolated-runtime-memory-inspection
  name:
    zh: 隔离运行与内存检查
    en: Isolated Runtime and Memory Inspection
  description:
    paragraphs:
    - zh: 对无法静态恢复的内容在资源受控环境执行，捕获解密缓冲区、可执行内存与动态解析，并限制后继动作。
      en: Execute content that cannot be recovered statically in a resource-controlled environment, capture decrypted
        buffers, executable memory, and dynamic resolution, and constrain successor actions.
  control_type: containment
applications:
- target_ref: NJT-0115
  use:
    paragraphs:
    - zh: 将所有外部与用户可控内容先规范化，恢复对象再次扫描，未知运行时受隔离与应用控制约束，并保存原始到恢复摘要谱系。
      en: Normalize all external and user-controlled content first, rescan recovered objects, constrain unknown runtimes
        through isolation and application control, and preserve original-to-recovered digest lineage.
  expected_effect:
    paragraphs:
    - zh: 编码、打包和载体外观不再阻止内容检查，运行时恢复的真实载荷可被捕获并与来源关联。
      en: Encoding, packing, and carrier appearance no longer prevent content inspection, and real payloads recovered
        at runtime can be captured and attributed to provenance.
  limitations:
    paragraphs:
    - zh: 递归规范化易受资源消耗与解析器漏洞影响，密钥和环境门控可能阻止恢复；合法加密内容还涉及隐私和密钥管理。
      en: Recursive normalization is exposed to resource exhaustion and parser flaws, while keys and environmental gating
        may prevent recovery. Legitimate encrypted content also raises privacy and key-management concerns.
- target_ref: NJS-0115-001
  use:
    paragraphs:
    - zh: 对外部文件、脚本、命令和网络内容递归解码、解密、解压、解包与规范化，记录每层输入输出摘要，并将恢复内容重新进入扫描和应用控制。
      en: Recursively decode, decrypt, decompress, unpack, and normalize external files, scripts, commands, and network
        content, record input and output digests for every layer, and resubmit recovered content to scanning and application
        control.
  expected_effect:
    paragraphs:
    - zh: 编码、加密、压缩和打包不再永久移除语义，恢复后的命令与载荷在执行前或执行时被识别。
      en: Encoding, encryption, compression, and packing no longer permanently remove semantics, and recovered commands
        and payloads are identified before or during execution.
  limitations:
    paragraphs:
    - zh: 缺少密钥、资源炸弹、专有打包器和环境门控可能阻止恢复，合法加密还涉及隐私与密钥访问。
      en: Missing keys, resource bombs, proprietary packers, and environmental gating may prevent recovery, while legitimate
        encryption raises privacy and key-access concerns.
- target_ref: NJS-0115-002
  use:
    paragraphs:
    - zh: 结合语义归一、控制流恢复、多样本聚类、动态行为和专用去混淆器识别功能等价变体，并以应用控制限制未知和异常构建。
      en: Combine semantic normalization, control-flow recovery, multi-sample clustering, dynamic behavior, and purpose-built
        deobfuscators to identify functionally equivalent variants, and use application control to constrain unknown
        and anomalous builds.
  expected_effect:
    paragraphs:
    - zh: 改变字节、长度、指令和控制流不足以逃离功能家族，变体仍可按规范语义和恶意结果聚合。
      en: Changing bytes, length, instructions, and control flow is insufficient to leave a functional family, and variants
        can still be grouped by normalized semantics and malicious outcome.
  limitations:
    paragraphs:
    - zh: 深度语义分析成本高且可能被自修改代码阻断，合法编译差异和软件保护会增加误报与人工复核。
      en: Deep semantic analysis is expensive and may be defeated by self-modifying code, while legitimate build variation
        and software protection increase false positives and manual review.
- target_ref: NJS-0115-003
  use:
    paragraphs:
    - zh: 对图像、文档、HTML、SVG、快捷方式和非文件值使用格式专属解析器递归提取，重编码不需要的媒体元数据，并将所有内层对象按独立摘要扫描和限制执行。
      en: Use format-specific parsers to recursively extract images, documents, HTML, SVG, shortcuts, and non-file values,
        transcode unnecessary media metadata, and scan and constrain every inner object by an independent digest.
  expected_effect:
    paragraphs:
    - zh: 良性外层类型不能阻止对内层载荷的检查，提取程序、内层对象与后继执行保持可归因。
      en: A benign outer type cannot prevent inspection of an inner payload, and the extractor, inner object, and successor
        execution remain attributable.
  limitations:
    paragraphs:
    - zh: 格式解析器扩大攻击面，递归提取会消耗资源，专有格式、内层加密和业务元数据可能无法安全移除。
      en: Format parsers expand attack surface, recursive extraction consumes resources, and proprietary formats, encrypted
        inner content, and business metadata may not be safely removable.
- target_ref: NJS-0115-004
  use:
    paragraphs:
    - zh: 限制脚本宿主和未批准编译器，监控动态解析、反射与可执行内存，并把生成输入、解析结果、内存摘要和首次调用纳入应用控制。
      en: Restrict script hosts and unapproved compilers, monitor dynamic resolution, reflection, and executable memory,
        and bring generation input, resolved result, memory digest, and first call under application control.
  expected_effect:
    paragraphs:
    - zh: 静态对象中缺失的最终调用与代码会在物化时被捕获，未批准生成结果不能直接执行。
      en: Final calls and code absent from the static object are captured during materialization, and unapproved generated
        results cannot execute directly.
  limitations:
    paragraphs:
    - zh: JIT、反射、插件和构建系统广泛使用动态生成，严格控制可能破坏业务软件，短暂内存代码仍可能漏采。
      en: JIT, reflection, plug-ins, and build systems widely use dynamic generation, strict controls may disrupt business
        software, and transient memory code may still be missed.
- target_ref: NJT-0211
  use:
    paragraphs:
    - zh: 在合法可见的 C2 风险出口对 HTTP 参数、头、正文、DNS 载荷、邮件附件和其他消息字段先按协议规范化，再进行受限递归解码、解压和自定义表恢复；记录每层摘要并把恢复内容重新送入签名、语义和端点结果检查。对标准解析失败、超过安全预算或恢复出可执行控制语义的对象隔离或阻断，同时保留原始证据。
      en: At lawfully visible C2-risk egress points, normalize HTTP parameters, headers, bodies, DNS payloads, mail attachments,
        and other message fields according to protocol before bounded recursive decoding, decompression, and custom-table
        recovery. Record every layer's digest and resubmit recovered content to signature, semantic, and endpoint-outcome
        checks. Isolate or block objects that fail standard parsing, exceed safe budgets, or recover executable control
        semantics while preserving original evidence.
  expected_effect:
    paragraphs:
    - zh: 标准和自定义字母表、单层和多层变换均不能永久移除命令或结果语义，检测在规范化缓冲区而非只在原始表示上运行。
      en: Standard and custom alphabets and single- or multi-layer transforms no longer permanently remove command or
        result semantics, because detection runs on normalized buffers rather than only raw representation.
  limitations:
    paragraphs:
    - zh: TLS 或端到端加密可能使网关无内容可处理，专有变换和缺失密钥会阻止恢复，递归规范化还面临资源消耗和解析器攻击。合法 MIME、认证字段、压缩和隐私数据要求字段级基线、保留期限与访问控制，不能默认全部解码和留存。
      en: TLS or end-to-end encryption may leave gateways without content, proprietary transforms and missing keys can
        prevent recovery, and recursive normalization introduces resource-exhaustion and parser-attack risk. Legitimate
        MIME, authentication fields, compression, and private data require field-level baselines, retention limits, and
        access controls rather than universal decoding and retention.
