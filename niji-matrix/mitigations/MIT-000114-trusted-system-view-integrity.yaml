schema_version: 2.0.0
type: mitigation
id: MIT-000114
name:
  zh: 可信系统视图完整性
  en: Trusted System-View Integrity
summary:
  zh: 使用可信启动、代码与驱动完整性和跨层独立观察，限制系统信息接口被 rootkit 控制。
  en: Use trusted boot, code and driver integrity, and independent cross-layer observation to constrain rootkit control of
    system-information interfaces.
description:
  paragraphs:
  - zh: 本缓解限制未批准内核模块、驱动、preload 与固件，验证启动和运行时代码完整性，并从 hypervisor、管理面、网络或离线介质取得独立视图。恢复时不信任受影响 OS 自身报告。
    en: This mitigation restricts unapproved kernel modules, drivers, preload state, and firmware, validates boot and runtime
      code integrity, and obtains independent views from hypervisor, management plane, network, or offline media. Recovery
      does not trust reports from the affected OS itself.
domains:
- enterprise
measures:
- key: trusted-boot-and-code-integrity
  name:
    zh: 可信启动与代码完整性
    en: Trusted Boot and Code Integrity
  description:
    paragraphs:
    - zh: 启用签名、可信启动、驱动和模块策略，度量关键函数、表与固件并保留远程证明。
      en: Enable signing, trusted boot, driver and module policy, measure critical functions, tables, and firmware, and retain
        remote attestation.
  control_type: preventive
- key: independent-system-view
  name:
    zh: 独立系统视图
    en: Independent System View
  description:
    paragraphs:
    - zh: 从更低或旁路层采集对象、磁盘和网络状态，与 OS 查询结果比较，并支持可信介质离线检查。
      en: Collect object, disk, and network state from lower or side-channel layers, compare with OS query results, and support
        trusted-media offline inspection.
  control_type: detective-support
applications:
- target_ref: NJT-0116
  use:
    paragraphs:
    - zh: 限制系统信息路径的可修改代码，持续比较跨层视图，发现差异后隔离并从可信介质验证与恢复。
      en: Restrict modifiable code on system-information paths, compare cross-layer views continuously, and isolate and verify
        or recover from trusted media after a differential is found.
  expected_effect:
    paragraphs:
    - zh: rootkit 更难安装和保持 hook，上层伪造视图可由独立层揭示，受影响 OS 不能单独证明自身完整。
      en: Rootkits have greater difficulty installing and maintaining hooks, independent layers expose falsified higher-level
        views, and the affected OS cannot prove its integrity alone.
  limitations:
    paragraphs:
    - zh: 高权限内核、hypervisor 或固件攻击可能控制多个层，可信启动部署和离线恢复成本高且存在兼容性限制。
      en: Highly privileged kernel, hypervisor, or firmware attacks may control multiple layers. Trusted-boot deployment and
        offline recovery are costly and have compatibility limits.
- target_ref: NJS-0116-001
  use:
    paragraphs:
    - zh: 限制未签名模块、preload 与系统调用表修改，远程证明关键查询函数和分派指针，并从不共享路径的内核、网络或离线视图比较返回集合。
      en: Restrict unsigned modules, preloads, and system-call-table changes, remotely attest critical query functions and dispatch pointers, and compare returned sets with kernel, network, or offline views that do not share the path.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难把过滤代码放入共同查询路径，已安装 hook 会同时暴露完整性变化和跨视图对象缺失。
      en: Attackers have greater difficulty placing filtering code in a common query path, and an installed hook exposes both an integrity change and a cross-view object omission.
  limitations:
    paragraphs:
    - zh: 合法安全与兼容性产品也使用 hook，内核级攻击者可隐藏函数修改，持续跨层采集增加性能和运维成本。
      en: Legitimate security and compatibility products also use hooks, a kernel-level adversary can hide function changes, and continuous cross-layer collection adds performance and operational cost.
- target_ref: NJS-0116-002
  use:
    paragraphs:
    - zh: 保护关键动态内核结构，使用 hypervisor 或可信内存监控验证对象链、引用和元数据不变量，并保留原始文件系统与 Registry 状态供离线差分和恢复。
      en: Protect critical dynamic kernel structures, validate object-list, reference, and metadata invariants with a hypervisor or trusted memory monitor, and retain raw file-system and Registry state for offline differential analysis and recovery.
  expected_effect:
    paragraphs:
    - zh: 即使查询代码未被修改，功能对象与枚举背衬状态脱钩仍会触发结构或原始数据差分，攻击者必须同时控制更低可信层。
      en: Even when query code is unmodified, detachment between a functional object and enumeration-backing state produces a structural or raw-data differential, forcing the adversary to control a lower trusted layer as well.
  limitations:
    paragraphs:
    - zh: 动态结构随版本变化且监控成本高，最低层被攻陷时同层证明不可信，恢复通常需要停机、可信介质或重新部署。
      en: Dynamic structures vary by version and are expensive to monitor, same-layer proof is untrustworthy when the lowest layer is compromised, and recovery often requires downtime, trusted media, or reimaging.
evidence_refs:
