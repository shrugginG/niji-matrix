schema_version: 2.0.0
type: mitigation
id: MIT-000115
name:
  zh: 破坏流程范围与韧性治理
  en: Destructive-Workflow Scope and Resilience Governance
summary:
  zh: 通过应用控制、最小文件权限、关键组件完整性与不可变备份限制恶意选择性处理并保留恢复能力。
  en: Limit malicious selective processing and preserve recovery through application control, least file authority,
    critical-component integrity, and immutable backup.
description:
  paragraphs:
  - zh: 无法禁止正常程序使用排除列表，因此本缓解阻止未知破坏载荷执行，限制批量文件修改权限，保护关键系统组件并保留不可变备份。检测保存处理与跳过集合，响应隔离进程和受影响范围，而不是依赖系统仍可用。
    en: Normal programs cannot be prohibited from using exclusion lists, so this mitigation blocks unknown destructive
      payloads, limits bulk file-modification authority, protects critical system components, and retains immutable
      backups. Detection preserves processed and skipped sets, and response isolates the process and affected scope
      rather than relying on continued system usability.
domains:
- enterprise
measures:
- key: destructive-payload-control
  name:
    zh: 破坏载荷执行与权限控制
    en: Destructive Payload Execution and Authority Control
  description:
    paragraphs:
    - zh: 使用应用控制、最小权限和行为预防限制未知程序批量枚举、加密、擦除或篡改，并保护关键目录与服务。
      en: Use application control, least privilege, and behavior prevention to restrict unknown programs from bulk
        enumeration, encryption, wiping, or tampering and protect critical directories and services.
  control_type: preventive
- key: immutable-recovery-state
  name:
    zh: 不可变恢复状态
    en: Immutable Recovery State
  description:
    paragraphs:
    - zh: 保留离线或对象锁备份、关键配置和主机角色清单，并验证恢复不依赖攻击者保留的组件。
      en: Retain offline or object-locked backups, critical configuration, and host-role inventories and verify
        that recovery does not depend on components preserved by the adversary.
  control_type: containment
applications:
- target_ref: NJT-0117
  use:
    paragraphs:
    - zh: 阻止未批准批量处理，监控关键目标枚举与跳过差分，并在发现破坏链时立即隔离而不因系统仍运行而降低响应。
      en: Block unapproved bulk processing, monitor enumeration and skip differentials for critical targets, and
        isolate immediately on a destructive chain without lowering response because the system still operates.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以利用排除维持低异常外观，破坏范围受限且恢复状态独立于恶意选择。
      en: Attackers have greater difficulty using exclusions to maintain a low-anomaly appearance, destructive scope
        is limited, and recovery state is independent of adversary selection.
  limitations:
    paragraphs:
    - zh: 合法备份、杀毒和部署工具也执行批量枚举与排除，行为控制需要精确基线；已获高权限攻击者仍可能破坏在线备份。
      en: Legitimate backup, antivirus, and deployment tools also perform bulk enumeration and exclusion and require
        precise baselines. A highly privileged adversary may still damage online backups.
- target_ref: NJS-0117-001
  use:
    paragraphs:
    - zh: 用应用控制和行为阻断限制未知进程批量修改，保护启动、身份、网络和恢复对象，并持续计算同一主机内枚举对象的处理与保留覆盖差分。
      en: Use application control and behavioral blocking to restrict unknown bulk modification, protect boot, identity,
        networking, and recovery objects, and continuously calculate processed-to-preserved coverage for enumerated
        objects within the same host.
  expected_effect:
    paragraphs:
    - zh: 攻击者不能仅靠保留少量关键对象维持低异常外观，批量破坏会在覆盖差分和受保护对象访问阶段被阻断。
      en: Attackers cannot rely on preserving a small critical set to maintain a low-anomaly appearance, and bulk
        destruction is blocked at the coverage differential or protected-object access stage.
  limitations:
    paragraphs:
    - zh: 合法备份、杀毒和数据生命周期工具也使用排除谓词，关键对象保护不能替代离线备份，获得高权限的载荷仍可能同时破坏在线控制。
      en: Legitimate backup, antivirus, and data-lifecycle tools also use exclusion predicates, critical-object
        protection does not replace offline backup, and a high-authority payload may still damage online controls
        together.
- target_ref: NJS-0117-002
  use:
    paragraphs:
    - zh: 限制 GPO 与集中部署权限，为高价值角色使用独立管理面和分段，完整记录每个目标的启动结果，并在同一载荷出现角色条件退出或任一同批破坏时隔离整个部署波次。
      en: Restrict GPO and centralized-deployment authority, use independent management planes and segmentation
        for high-value roles, record the launch outcome on every target, and isolate the entire deployment wave
        when the same payload shows role-conditioned exit or any peer destruction.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以用被保留角色继续分发破坏载荷，跨主机差分会触发整体遏制而不是把关键主机正常运行解释为安全。
      en: Attackers have greater difficulty using preserved roles to continue destructive distribution, and the
        cross-host differential triggers wave-wide containment instead of treating a healthy critical host as evidence
        of safety.
  limitations:
    paragraphs:
    - zh: 集中管理本身具有高业务依赖，隔离域控制器或部署服务可能影响运营；陈旧资产角色和离线节点会降低覆盖判断。
      en: Centralized management has high business dependency, and isolating domain controllers or deployment services
        can affect operations. Stale asset roles and offline nodes reduce coverage judgment.
- target_ref: NJT-0157
  use:
    paragraphs:
    - zh: 对可写业务目录限制未知加密载荷和过宽写权限，在支持的平台启用受控文件夹访问，并把不可变恢复副本与生产账户分离。多文件可读性丧失时隔离写入进程，即使单文件改写量不大。
      en: Restrict unknown encryptors and excessive write authority over writable business directories, enable controlled
        folder access where supported, and separate immutable recovery copies from production accounts. Isolate
        the writer on multi-file readability loss even when per-file writes are modest.
  expected_effect:
    paragraphs:
    - zh: 提高未批准加密写入的执行成本并保留恢复路径，使攻击者无法单靠降低单文件 I/O 绕过写入授权。
      en: Raise the cost of unauthorized encryption writes and preserve restoration, so lowering per-file I/O does
        not bypass writer authorization alone.
  limitations:
    paragraphs:
    - zh: 受信任应用或被盗有权身份仍可能写入，受控文件夹仅保护配置范围，恢复副本也不能消除当前数据短时不可用。
      en: Trusted applications or stolen authorized identities may still write. Controlled folder access protects
        only configured scope, and recovery copies do not remove temporary current-data unavailability.
- target_ref: NJS-0157-001
  use:
    paragraphs:
    - zh: 对稀疏文件加密，保护业务目录不受未知写入者修改，并保留可安全比较的前版本或诱饵；响应条件以跨文件同进程异常和解析失败为准，不要求整文件高熵。
      en: For sparse file encryption, protect business directories against unknown writers and retain safely comparable
        prior versions or canaries. Trigger response on cross-file same-process anomaly and parse failure rather
        than requiring high whole-file entropy.
  expected_effect:
    paragraphs:
    - zh: 在稀疏区段积累为大范围不可读前限制写入，并保留恢复及区域差分证据。
      en: Constrain writes before sparse regions accumulate into widespread unreadability and preserve recovery
        and regional-difference evidence.
  limitations:
    paragraphs:
    - zh: 被批准的写入者遭劫持仍可越过应用控制，缺少受保护前版本时只能发现可疑改写，不能自动恢复文件。
      en: A hijacked approved writer can still pass application control. Without a protected prior version, suspicious
        rewriting may be found but the file cannot automatically be restored.
