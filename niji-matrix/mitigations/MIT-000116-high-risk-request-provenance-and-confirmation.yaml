schema_version: 2.0.0
type: mitigation
id: MIT-000116
name:
  zh: 高风险请求来源验证与独立确认
  en: High-Risk Request Provenance and Independent Confirmation
summary:
  zh: 强化身份与域认证，并要求执行、授权、支付和秘密披露通过独立渠道确认。
  en: Strengthen identity and domain authentication and require execution, authorization, payment, and secret disclosure
    to be confirmed through an independent channel.
description:
  paragraphs:
  - zh: 本缓解结合邮件域认证、账户保护、关系情境提示、敏感动作审批和独立回呼。用户界面应突出真实地址与外部来源，系统对命令执行、OAuth、支付和秘密访问设置二次确认与最小权限。
    en: This mitigation combines mail-domain authentication, account protection, relationship-context prompts, sensitive-action
      approval, and independent callback. User interfaces expose real addresses and external provenance, while systems
      require secondary confirmation and least privilege for command execution, OAuth, payment, and secret access.
domains:
- enterprise
measures:
- key: provenance-authentication
  name:
    zh: 来源身份认证
    en: Provenance Authentication
  description:
    paragraphs:
    - zh: 部署域与账户认证、强 MFA、外部来源标记和显示身份差分，保护高价值通信账户。
      en: Deploy domain and account authentication, strong MFA, external-source marking, and display-identity differential
        and protect high-value communication accounts.
  control_type: preventive
- key: independent-action-confirmation
  name:
    zh: 独立动作确认
    en: Independent Action Confirmation
  description:
    paragraphs:
    - zh: 对执行、批准、权限、支付和秘密披露要求独立渠道回呼、双人审批或受控工作流。
      en: Require independent-channel callback, dual approval, or controlled workflow for execution, approval, authority,
        payment, and secret disclosure.
  control_type: governance
applications:
- target_ref: NJT-0118
  use:
    paragraphs:
    - zh: 验证请求来源和关系情境，并在用户动作前通过独立渠道确认高风险意图；后继权限和支付使用最小化与可撤销设计。
      en: Validate request provenance and relationship context and confirm high-risk intent through an independent
        channel before user action. Successor authority and payment use minimized and revocable designs.
  expected_effect:
    paragraphs:
    - zh: 伪造显示身份或单一渠道控制不足以驱动敏感动作，被攻陷账户也需要跨渠道确认，用户代理链更易中断。
      en: A forged display identity or control of one channel is insufficient to drive a sensitive action, and compromised
        accounts still require cross-channel confirmation, interrupting the user-brokered chain.
  limitations:
    paragraphs:
    - zh: 真实关系账户和多渠道同时被攻陷仍可绕过确认，过多提示会产生疲劳，紧急流程需要安全例外。
      en: Compromise of real relationship accounts and multiple channels can still bypass confirmation, excessive
        prompts cause fatigue, and emergency workflows need secure exceptions.
- target_ref: NJS-0118-001
  use:
    paragraphs:
    - zh: 将服务台、高管、供应商和招聘等高风险关系映射到权威目录与 owner，对 MFA、远程协助、权限、支付和秘密请求强制使用已知联系方式独立回呼或双人审批。
      en: Map high-risk help-desk, executive, vendor, and recruiting relationships to authoritative directories and
        owners and require independent callback through known contact information or dual approval for MFA, remote
        assistance, authority, payment, and secret requests.
  expected_effect:
    paragraphs:
    - zh: 控制一个聊天、语音或邮件账户不足以借用关系权威，用户动作在执行前需由另一可信事实源确认。
      en: Control of one chat, voice, or mail account is insufficient to borrow relational authority, and a user action
        requires confirmation from another trusted source before execution.
  limitations:
    paragraphs:
    - zh: 真实关系账户、目录和回呼渠道同时被攻陷仍可绕过，高频提示会造成疲劳，紧急流程必须设计受审计的安全例外。
      en: Simultaneous compromise of the real relationship account, directory, and callback channel can still bypass
        controls, frequent prompts create fatigue, and emergency workflows need audited secure exceptions.
- target_ref: NJS-0118-002
  use:
    paragraphs:
    - zh: 为组织域部署对齐的 SPF 与 DKIM，强制 DMARC quarantine/reject，保留 ARC 和原始消息头，限制 Direct Send 与匿名中继，并在客户端突出外部来源和认证失败。
      en: Deploy aligned SPF and DKIM for organizational domains, enforce DMARC quarantine or reject, preserve ARC
        and raw headers, restrict Direct Send and anonymous relay, and surface external provenance and authentication
        failure in clients.
  expected_effect:
    paragraphs:
    - zh: 显示 From 无法单独继承域信任，未对齐或未经授权的发送基础设施会被拒绝、隔离或明确标记，并可由 DMARC 报告追踪。
      en: Displayed From cannot inherit domain trust alone, and unaligned or unauthorized sending infrastructure is
        rejected, quarantined, or clearly labeled and can be tracked through DMARC reporting.
  limitations:
    paragraphs:
    - zh: 转发、邮件列表和第三方发送会造成对齐问题，DMARC 不验证正文真实性或真实账户控制，合作方配置和 ARC 信任需要持续治理。
      en: Forwarding, mailing lists, and third-party sending create alignment problems, DMARC does not validate body
        truthfulness or control of a real account, and partner configuration and ARC trust require continuous governance.
- target_ref: NJS-0175-002
  use:
    paragraphs:
    - zh: 对支持、安保与恢复请求使用权威人员目录、已登记工单和独立回呼；明确支持人员不得要求用户批准 MFA challenge，并把核验结果连接到身份事务。
      en: Use authoritative personnel directories, registered cases, and independent callbacks for support, security,
        and recovery requests. State that support personnel never ask users to approve an MFA challenge and join verification
        outcome to the identity transaction.
  expected_effect:
    paragraphs:
    - zh: 支持请求与真实人员、工单和回呼绑定后，用户更容易识别没有业务授权的 MFA 动作。
      en: Binding support requests to real personnel, cases, and callbacks makes MFA actions without business authorization
        easier for users to recognize.
  limitations:
    paragraphs:
    - zh: 真实支持身份被攻陷或个人通信不可见时，来源核验可能失效；仍需 IdP 风险、challenge 情境和会话控制。
      en: Compromise of a genuine support identity or invisible personal communication can defeat provenance checks,
        so IdP risk, challenge context, and session controls remain necessary.
- target_ref: NJT-0204
  use:
    paragraphs:
    - zh: 对高风险付款指令、受益人变更和支付请求执行已知渠道独立确认，并要求确认对象与最终 rail beneficiary 一致；确认后仍以 settlement 结果验证。
      en: Independently confirm high-risk payment instructions, beneficiary changes, and payment requests through
        known channels and require the confirmed object to match the final rail beneficiary; verify settlement outcome
        after confirmation.
  expected_effect:
    paragraphs:
    - zh: BEC/社会工程或被盗身份不能只凭熟悉内容驱动完成盗窃，业务请求与结算目标保持来源链。
      en: BEC, social engineering, or stolen identity cannot drive completed theft through familiar content alone,
        and business request remains linked to settlement destination.
  limitations:
    paragraphs:
    - zh: 攻击者控制真实供应商/确认渠道或 insider 时仍可通过，独立确认不替代 rail hold、debit/credit 监测和追回。
      en: An attacker controlling the real vendor or confirmation channel or an insider can still pass; independent
        confirmation does not replace rail holds, debit or credit monitoring, and recovery.
- target_ref: NJS-0204-001
  use:
    paragraphs:
    - zh: 对任何新/变更 creditor account 或 agent 使用预登记联系方式和 receiving-bank pre-validation，禁止回复同一邮件线程作为唯一确认。
      en: Use preregistered contacts and receiving-bank prevalidation for every new or changed creditor account or
        agent and prohibit replying in the same email thread as the sole confirmation.
  expected_effect:
    paragraphs:
    - zh: 受益账户窄替换在结算前被发现，熟悉线程和 sender 无法替代 destination 验证。
      en: Narrow beneficiary-account substitution is found before settlement and familiar threads or senders cannot
        replace destination validation.
  limitations:
    paragraphs:
    - zh: 供应商真实渠道受陷、紧急变更和部分 rail 无 pre-validation 时需要受控例外与更长 hold。
      en: Compromised real vendor channels, emergency changes, and rails without prevalidation need governed exceptions
        and longer holds.
