schema_version: 2.0.0
type: mitigation
id: MIT-000117
name:
  zh: 文档外部引用治理
  en: Document External-Reference Governance
summary:
  zh: 限制不受信模板与外部资源解析，并保护文档应用认证和宏执行边界。
  en: Restrict untrusted template and external-resource resolution and protect document-application authentication and macro execution boundaries.
description:
  paragraphs:
  - zh: 本缓解在入口解析文档关系，阻止未批准外部模板与协议，使用受保护视图与宏策略，并限制文档应用向外部 SMB 或 Web 发送凭据。企业模板需签名、固定域和内容完整性。
    en: This mitigation parses document relationships at ingress, blocks unapproved external templates and protocols, uses protected view and
      macro policy, and restricts document applications from sending credentials to external SMB or web destinations. Enterprise templates require
      signing, fixed domains, and content integrity.
domains:
- enterprise
measures:
- key: trusted-template-resolution
  name:
    zh: 受信模板解析
    en: Trusted Template Resolution
  description:
    paragraphs:
    - zh: 仅允许签名文档引用批准域和模板，阻止外部 SMB、未知协议与用户可写模板。
      en: Allow only signed documents to reference approved domains and templates and block external SMB, unknown protocols, and user-writable
        templates.
  control_type: preventive
- key: document-application-credential-boundary
  name:
    zh: 文档应用凭据边界
    en: Document-Application Credential Boundary
  description:
    paragraphs:
    - zh: 限制办公应用自动认证外部资源，并对宏、脚本和后继进程应用最小权限与应用控制。
      en: Restrict office applications from authenticating automatically to external resources and apply least privilege and application control
        to macros, scripts, and child processes.
  control_type: preventive
applications:
- target_ref: NJT-0119
  use:
    paragraphs:
    - zh: 在打开前解析并验证所有外部关系，限制网络和认证，未批准模板在隔离环境处理。
      en: Parse and validate all external relationships before open, restrict networking and authentication, and process unapproved templates
        in isolation.
  expected_effect:
    paragraphs:
    - zh: 静态文档不能通过隐藏引用在打开时取得任意内容或泄露认证，原文件到外部结果谱系完整。
      en: A static document cannot use a hidden reference to retrieve arbitrary content or leak authentication at open time, and lineage from
        original file to external outcome remains complete.
  limitations:
    paragraphs:
    - zh: 企业依赖动态模板和协作资源时限制可能破坏业务；被攻陷批准域或签名模板仍可能绕过。
      en: Restrictions may disrupt business that depends on dynamic templates and collaboration resources. A compromised approved domain or signed
        template may still bypass controls.
- target_ref: NJS-0119-001
  use:
    paragraphs:
    - zh: 在入口解析关系并只允许签名文档引用版本化批准模板，代理取得并扫描实际响应，固定内容摘要或签名，禁止按来源变化的未知宏模板。
      en: Parse relationships at ingress and allow signed documents to reference only versioned approved templates, proxy and scan the actual
        response, pin content digest or signature, and prohibit unknown macro templates that vary by source.
  expected_effect:
    paragraphs:
    - zh: 远程模板不能绕开静态检查或按目标替换内容，原文档、响应和执行谱系被完整保留。
      en: Remote templates cannot bypass static inspection or substitute content by target, and lineage among original document, response, and
        execution is preserved.
  limitations:
    paragraphs:
    - zh: 动态企业模板和协作内容可能频繁变化，批准域失陷或加密响应不可检查仍可绕过，代理解析器也扩大攻击面。
      en: Dynamic enterprise templates and collaboration content may change frequently, compromised approved domains or uninspectable encrypted
        responses can still bypass controls, and proxy parsers expand attack surface.
- target_ref: NJS-0119-002
  use:
    paragraphs:
    - zh: 禁止办公应用向外部 SMB 和未批准 Web 域自动认证，使用抗中继认证与凭据保护，并对模板解析产生的登录提示显式标记和阻断。
      en: Prevent office applications from automatically authenticating to external SMB and unapproved web domains, use relay-resistant authentication
        and credential protection, and explicitly label and block sign-in prompts produced by template resolution.
  expected_effect:
    paragraphs:
    - zh: 外部引用不再能静默或以可信提示取得认证材料，任何允许的认证都有批准目标和可追踪身份结果。
      en: External references can no longer obtain authentication material silently or through a trusted-looking prompt, and every allowed authentication
        has an approved target and traceable identity outcome.
  limitations:
    paragraphs:
    - zh: 企业文档可能依赖内部认证模板，用户仍可在仿冒提示中主动输入秘密，外部个人设备和旧协议难以统一控制。
      en: Enterprise documents may depend on authenticated internal templates, users can still enter secrets into a deceptive prompt, and external
        personal devices and legacy protocols are difficult to control uniformly.
- target_ref: NJS-0165-001
  use:
    paragraphs:
    - zh: 对文档外部引用诱发认证子集，阻断非批准外部模板和 SMB/WebDAV 目的地，将文档关系、打开者、认证目标和接收结果保存在不同权日志中。
      en: For the document external-reference subset, block unapproved templates and SMB or WebDAV destinations and retain document relationship,
        opener, authentication target, and receiver outcome under separate authority.
  expected_effect:
    paragraphs:
    - zh: 减少恶意文档在解析时触发凭据提示或自动认证的机会，并为仍发生的材料外发保留对象到结果谱系。
      en: Reduce opportunities for malicious documents to trigger credential prompts or automatic authentication during resolution and retain
        object-to-outcome lineage when emission still occurs.
  limitations:
    paragraphs:
    - zh: 该应用只覆盖文档引用；图标、消息属性和远程服务调用需要相应通用或服务面控制。
      en: This application covers document references only; icons, message properties, and remote-service invocations require their general or
        service-surface controls.
