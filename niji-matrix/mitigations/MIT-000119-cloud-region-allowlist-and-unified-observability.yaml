schema_version: 2.0.0
type: mitigation
id: MIT-000119
name:
  zh: 云区域允许清单与统一可观察性
  en: Cloud-Region Allowlisting and Unified Observability
summary:
  zh: 限制资源创建到批准区域，并在所有可用区域统一启用日志、配置规则、安全服务和响应权限。
  en: Restrict resource creation to approved regions and enable uniform logging, configuration rules, security services, and
    responder authority in every available region.
description:
  paragraphs:
  - zh: 本缓解使用组织策略拒绝未批准区域和服务，在全部区域预配置控制面日志、配置审计、网络流与安全服务，并集中资产和账单。例外需 owner、用途和到期，响应团队具备全区域枚举与隔离权限。
    en: This mitigation uses organization policy to deny unapproved regions and services, preconfigures control-plane logging,
      configuration audit, network flow, and security services in every region, and centralizes assets and billing. Exceptions
      require an owner, purpose, and expiry, and responders have cross-region enumeration and isolation authority.
domains:
- enterprise
measures:
- key: region-service-control-policy
  name:
    zh: 区域服务控制策略
    en: Region Service-Control Policy
  description:
    paragraphs:
    - zh: 默认拒绝未批准区域资源创建，仅通过有期限例外开放。
      en: Deny resource creation in unapproved regions by default and open access only through expiring exceptions.
  control_type: preventive
- key: all-region-observability
  name:
    zh: 全区域可观察性
    en: All-Region Observability
  description:
    paragraphs:
    - zh: 在所有区域统一启用日志、配置、安全服务、资产和账单汇总，并授予响应权限。
      en: Enable uniform logging, configuration, security services, asset and billing aggregation in every region and grant
        response authority.
  control_type: detective-support
applications:
- target_ref: NJT-0121
  use:
    paragraphs:
    - zh: 限制区域选择并持续扫描所有区域的资源与覆盖状态，首次或未批准使用立即告警和隔离。
      en: Restrict regional selection and continuously scan resources and coverage in every region, alerting and isolating
        first or unapproved use immediately.
  expected_effect:
    paragraphs:
    - zh: 攻击者无法利用未使用区域绕开基线，任何区域资源都进入统一日志和响应链。
      en: Attackers cannot exploit an unused region to bypass baseline, and resources in every region enter a unified logging
        and response chain.
  limitations:
    paragraphs:
    - zh: 全球业务和灾备需要例外，云服务的全局与区域语义不同，统一日志和安全服务增加成本。
      en: Global business and disaster recovery require exceptions, cloud services differ in global and regional semantics,
        and uniform logging and security services add cost.
- target_ref: NJS-0121-001
  use:
    paragraphs:
    - zh: 用组织策略默认拒绝未批准区域，为例外绑定 owner、服务、用途和到期，并从全局资产与账单持续检测任何首次区域使用。
      en: Deny unapproved Regions by default through organization policy, bind exceptions to owner, service, purpose, and expiry, and continuously detect first Region use through global assets and billing.
  expected_effect:
    paragraphs:
    - zh: 攻击者无法把资源放到历史空白区域，任何新区域活动在创建前被拒绝或在全局清单中立即显现。
      en: Attackers cannot place resources in historically empty Regions, and any new Region activity is denied before creation or immediately exposed in global inventory.
  limitations:
    paragraphs:
    - zh: 灾备、全球业务和新服务需要例外，部分全局服务不遵循 requestedRegion 语义，过严策略会阻断合法恢复。
      en: Disaster recovery, global business, and new services require exceptions, some global services do not follow requestedRegion semantics, and overly strict policy can block legitimate recovery.
- target_ref: NJS-0121-002
  use:
    paragraphs:
    - zh: 在全部可用区域自动启用控制面审计、配置规则、威胁检测、网络流与响应角色，持续比较覆盖矩阵和日志交付健康并拒绝低于最低基线的服务使用。
      en: Automatically enable control-plane audit, configuration rules, threat detection, network flow, and responder roles in every available Region, continuously compare the coverage matrix and log-delivery health, and deny service use below the minimum baseline.
  expected_effect:
    paragraphs:
    - zh: 次区域不再提供更弱检测或响应面，同一主体跨区域活动进入统一观察和隔离链。
      en: Secondary Regions no longer provide a weaker detection or response surface, and cross-Region activity by one principal enters unified observation and isolation.
  limitations:
    paragraphs:
    - zh: 安全服务区域支持不同且成本增加，跨分区/主权云可能需要独立控制面，日志故障仍需旁路健康监控。
      en: Security-service regional support differs and adds cost, cross-partition or sovereign clouds can require separate control planes, and log failures still need side-channel health monitoring.
evidence_refs:
