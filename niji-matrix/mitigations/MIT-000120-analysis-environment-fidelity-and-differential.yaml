schema_version: 2.0.0
type: mitigation
id: MIT-000120
name:
  zh: 分析环境真实性与差分执行
  en: Analysis-Environment Fidelity and Differential Execution
summary:
  zh: 提高分析环境真实性，使用多环境差分与透明插桩恢复被条件化隐藏的行为。
  en: Increase analysis-environment fidelity and use multi-environment differential and transparent instrumentation to recover
    conditionally hidden behavior.
description:
  paragraphs:
  - zh: 本缓解通过多样化分析环境、受控活动回放和时间实验，增加发现条件化保留行为的机会。部署需声明插桩、身份、输入、时钟、重放及健康合同；透明性和全源控制是待验证目标，不能从hypervisor或工具名称推断。实验使用隔离资源和网络配置，未能继续或触及预算时保留不完整状态。
    en: This mitigation diversifies analysis environments and uses controlled activity replay and timing experiments to increase
      opportunities to expose conditional withholding. Deployment declares instrumentation, identity, input, clock, replay,
      and health contracts. Transparency and complete source control require validation and do not follow from a hypervisor
      or tool name. Experiments use isolated resources and networking and retain incomplete state when continuation fails
      or budgets are reached.
domains:
- enterprise
measures:
- key: high-fidelity-analysis-environment
  name:
    zh: 高真实性分析环境
    en: High-Fidelity Analysis Environment
  description:
    paragraphs:
    - zh: 多样化硬件、软件、用户活动与时间特征，避免固定模板和明显分析工件。
      en: Diversify hardware, software, user activity, and timing features and avoid fixed templates and obvious analysis
        artifacts.
  control_type: detective-support
- key: controlled-environment-differential
  name:
    zh: 受控环境差分
    en: Controlled Environment Differential
  description:
    paragraphs:
    - zh: 在多个环境重执行同一样本，逐项改变条件并比较核心行为、内存和网络结果。
      en: Re-execute one sample across environments, vary conditions individually, and compare core behavior, memory, and
        network outcomes.
  control_type: detective-support
applications:
- target_ref: NJT-0122
  use:
    paragraphs:
    - zh: 保留同样本和启动条件，使用登记的系统、活动与时间变体捕获检查和后继，验证输入/时间干预与采集健康；差分作为分析支撑，不把任意重跑或假定工具透明性当作完成因果证据。
      en: Retain sample and launch conditions and capture checks and successors under registered system, activity, and timing
        variants, validating interventions and capture health. Differentials support analysis without treating arbitrary reruns
        or assumed tool transparency as completed causal evidence.
  expected_effect:
    paragraphs:
    - zh: 增加可解释条件暴露核心路径并与检查对齐的机会，减少单模板报告遗漏能力的风险；效果仍需样本级验证。
      en: Increase opportunities for interpretable conditions to expose and align core paths with checks, reducing single-template
        omissions while requiring per-sample validation.
  limitations:
    paragraphs:
    - zh: 高真实性环境成本高，攻击者可使用目标专属条件或外部情报，差分执行也受非确定行为影响。
      en: High-fidelity environments are costly, adversaries can use target-specific conditions or external intelligence,
        and differential execution is affected by nondeterministic behavior.
- target_ref: NJS-0122-001
  use:
    paragraphs:
    - zh: 多样化硬件、固件、驱动、进程和文件模板，使用裸机/VM 对照并逐项移除可疑工件，同时以透明插桩记录系统查询与分支。
      en: Diversify hardware, firmware, driver, process, and file templates, use bare-metal and VM controls and remove suspicious
        artifacts one at a time, and record system queries and branches through transparent instrumentation.
  expected_effect:
    paragraphs:
    - zh: 降低已知单一工件稳定抑制部署的机会，并提供定位控制分支的工件对照，不能保证全部VM工件被隐藏。
      en: Reduce opportunities for one known artifact to suppress deployment and provide artifact controls for locating the
        branch without guaranteeing concealment of every VM artifact.
  limitations:
    paragraphs:
    - zh: 维护多环境成本高，目标专属硬件和企业虚拟化会扩大分布，底层透明性无法完全保证。
      en: Maintaining multiple environments is expensive, target-specific hardware and enterprise virtualization widen distributions,
        and lower-layer transparency cannot be guaranteed completely.
- target_ref: NJS-0122-002
  use:
    paragraphs:
    - zh: 为已识别活动条件提供最小对照和动作脚本，记录实际插入数、目标会话/桌面/焦点及动作回执，再比较样本读到的活动与后继；仅当样本比较节奏或位置时改变自然度。
      en: Provide minimal controls and action scripts for identified activity conditions, recording insertion counts, target
        session/desktop/focus, and action acknowledgments before comparing sample-read activity and successors. Vary naturalness
        only for actual cadence or position comparisons.
  expected_effect:
    paragraphs:
    - zh: 降低缺少可模拟活动而保留路径的机会，并帮助区分输入未到达与条件未满足；复杂交互仍可能无法触发。
      en: Reduce withholding from missing reproducible activity and distinguish undelivered input from unsatisfied conditions,
        while complex interaction can remain untriggered.
  limitations:
    paragraphs:
    - zh: 复杂 UI、物理设备和远程会话难以真实模拟，交互采集涉及隐私，攻击者可要求目标专属工作流。
      en: Complex UI, physical devices, and remote sessions are difficult to emulate realistically, interaction collection
        raises privacy concerns, and adversaries can require target-specific workflows.
- target_ref: NJS-0122-003
  use:
    paragraphs:
    - zh: 保留原速基线、独立主机时间与样本读取源，核验单位、位宽、频率及干预生效后做单项uptime或时间关系对照。加速仅覆盖已验证源，达到预算时记录未完成而不强行继续。
      en: Retain real-time baselines, independent host time, and sample-read sources, verifying units, width, frequency, and
        effective intervention before single-variable uptime or timing controls. Accelerate only validated sources and record
        incompleteness at budgets rather than forcing continuation.
  expected_effect:
    paragraphs:
    - zh: 增加识别时间条件与后继关系的机会并减少已知不一致加速工件，不能保证满足长时、硬件或外部时间条件。
      en: Increase opportunities to identify timing–successor relationships and reduce known incoherent-acceleration artifacts
        without guaranteeing long-duration, hardware, or external-time conditions.
  limitations:
    paragraphs:
    - zh: 硬件计时和外部时间源难以全部控制，长真实延迟增加成本，资源耗尽攻击仍需独立限制。
      en: Hardware timing and external time sources cannot all be controlled easily, long real delays add cost, and resource-exhaustion
        attacks still need separate limits.
