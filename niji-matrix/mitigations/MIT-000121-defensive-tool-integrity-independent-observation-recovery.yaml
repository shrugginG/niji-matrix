schema_version: "2.0.0"
type: mitigation
id: MIT-000121
name:
  zh: 防御工具完整性、独立观察与验证恢复
  en: Defensive-Tool Integrity, Independent Observation, and Verified Recovery
summary:
  zh: 分离工具控制权，保护安全配置，把证据送往不同权存储，并用签名状态与功能结果验证恢复。
  en: Separate tool-control authority, protect security configuration, send evidence to a differently authorized store, and verify recovery with signed state and functional outcomes.
description:
  paragraphs:
    - zh: 本缓解把预防、检测支持和恢复分成三个互补控制面：集中且最小化的工具管理权限限制谁能停用或改写防御；篡改保护和签名策略保护组件、配置、排除项与更新路径；不同权的远程遥测、健康报到和功能性 canary 为本地工具状态提供独立证据。单纯自动重启服务不能证明保护范围、事件生成或界面反馈已经恢复。
      en: This mitigation separates prevention, detective support, and recovery into complementary control planes. Centralized least-privilege tool management limits who can disable or rewrite defenses. Tamper protection and signed policy protect components, configuration, exclusions, and update paths. Differently authorized remote telemetry, health check-ins, and functional canaries provide evidence independent of local tool state. Merely restarting a service does not prove that protection scope, event generation, or interface feedback has recovered.
    - zh: 实施需要为每个防御产品维护权威组件与策略清单、变更审批、心跳 SLO、远程留存目标、已验证的低风险 canary 和离线恢复介质。恢复必须从独立证据确定受损范围，使用签名版本或可信镜像重建，并验证真实阻断、事件到达和版本结果；同权管理面、内核或固件完全失陷时仍可能同时破坏控制与证据。
      en: Implementation requires an authoritative component and policy inventory, change approval, heartbeat SLO, remote retention target, validated low-risk canary, and offline recovery media for each defensive product. Recovery determines scope from independent evidence, rebuilds with a signed version or trusted image, and verifies real blocking, event arrival, and version outcome. Complete compromise of a co-authorized management plane, kernel, or firmware can still defeat both controls and evidence.
domains: [enterprise]
measures:
  - key: separated-tool-control
    name: {zh: 分离且受控的工具管理权限, en: Separated and Controlled Tool Administration}
    description:
      paragraphs:
        - zh: 使用与日常工作负载权限分离的集中管理角色、即时授权和多方批准管理停用、卸载、排除项、provider、日志目的地和更新设置；启用产品支持的篡改保护、签名策略与受控故障排除窗口，并审计所有尝试与结果。
          en: Manage disablement, uninstall, exclusions, providers, log destinations, and update settings through centralized roles separated from ordinary workload privilege, just-in-time authorization, and multi-party approval. Enable product-supported tamper protection, signed policy, and controlled troubleshooting windows, and audit both attempted and effective changes.
    control_type: preventive
  - key: independent-observation-retention
    name: {zh: 不同权观察与远程持久留存, en: Differently Authorized Observation and Remote Durable Retention}
    description:
      paragraphs:
        - zh: 将工具心跳、控制面审计、关键事件和管线阶段指标实时发送到攻击者不能以同一权限修改的远程存储，配置冗余路径与序列完整性，并定期运行携带稳定关联键的低风险 canary 验证端到端生成、转发和存储。
          en: Send tool heartbeat, control-plane audit, critical events, and pipeline-stage metrics in real time to remote storage that the same authority cannot modify. Configure redundant paths and sequence integrity, and periodically run low-risk canaries carrying stable correlation keys to verify end-to-end generation, forwarding, and storage.
    control_type: detective-support
  - key: verified-recovery
    name: {zh: 签名状态与功能结果验证恢复, en: Signed-State and Functional-Outcome Verified Recovery}
    description:
      paragraphs:
        - zh: 保护独立更新与恢复路径、签名组件清单和离线可信介质；疑似受损时从独立状态枚举组件、策略、排除项、版本和历史缺口，重建后用真实阻断、事件到达、版本读取和 UI—结果一致性验证，而不是依赖本地“成功”消息。
          en: Protect independent update and recovery paths, signed component inventories, and offline trusted media. On suspected impairment, enumerate components, policy, exclusions, versions, and historical gaps from independent state, then validate rebuilding through real block outcomes, event arrival, version reads, and UI-to-outcome consistency rather than a local success message.
    control_type: containment
applications:
  - target_ref: NJT-0123
    use:
      paragraphs:
        - zh: 对父技术统一登记防御工具 owner、管理 authority、组件、策略、heartbeat、遥测目的地、更新路径和功能验证，并让停用、范围变化、事件缺口和健康声明均能被不同权来源核验。
          en: For the parent technique, register each defensive tool's owner, management authority, components, policy, heartbeat, telemetry destination, update path, and functional validation so disablement, scope changes, event gaps, and health claims can all be checked by a differently authorized source.
    expected_effect:
      paragraphs:
        - zh: 控制面分离提高篡改成本，远程证据缩短未知盲区，验证恢复避免仅重启进程却继续遗漏事件或对象。
          en: Control-plane separation raises tampering cost, remote evidence shortens unknown blind intervals, and verified recovery prevents a process restart from masking continued event or object omissions.
    limitations:
      paragraphs:
        - zh: 同时控制集中管理、身份、远程存储或内核/固件的攻击者仍可破坏多层证据；高可用与离线设备也会增加状态同步和恢复复杂度。
          en: An adversary controlling centralized management, identity, remote storage, or kernel or firmware can still defeat multiple evidence layers; high-availability and offline devices also complicate state synchronization and recovery.
  - target_ref: NJS-0123-001
    use:
      paragraphs:
        - zh: 为关键服务、进程、驱动、传感器和代理配置篡改保护、受控停止权限、独立 supervisor 与集中 heartbeat，并为更新和卸载要求签名包、精确审批和恢复 SLO。
          en: Configure tamper protection, controlled stop authority, an independent supervisor, and centralized heartbeat for critical services, processes, drivers, sensors, and agents, and require signed packages, exact approval, and a recovery SLO for updates and uninstall.
    expected_effect:
      paragraphs:
        - zh: 未授权终止与卸载更可能被阻止或迅速暴露，完整能力离线时间缩短，攻击者必须同时突破管理和健康观察面。
          en: Unauthorized termination and uninstall are more likely to be blocked or exposed quickly, whole-capability downtime is shortened, and the adversary must cross both management and health-observation planes.
    limitations:
      paragraphs:
        - zh: 合法高权限排障需要受控例外；易受攻击的签名驱动、内核写入或被接管 supervisor 仍可能绕过用户态保护和伪造 heartbeat。
          en: Legitimate privileged troubleshooting needs controlled exceptions. Exploitable signed drivers, kernel writes, or a compromised supervisor can still bypass user-mode protection and forge heartbeat.
  - target_ref: NJS-0123-002
    use:
      paragraphs:
        - zh: 由集中受控策略管理排除项、规则、provider 和资源选择器，禁止本地管理员合并，给每个例外绑定 owner、窄范围、到期和验证对象，并保留版本差分与对象级 evaluation。
          en: Manage exclusions, rules, providers, and resource selectors through controlled centralized policy, disable local-administrator merge, bind each exception to an owner, narrow scope, expiry, and validation object, and retain version differences plus object-level evaluation.
    expected_effect:
      paragraphs:
        - zh: 攻击者更难在工具保持健康外观时悄然扩大盲区；短期例外会过期，范围变化与实际遗漏对象能够被直接关联。
          en: An adversary has greater difficulty silently widening a blind spot while the tool appears healthy. Temporary exceptions expire, and scope change can be directly joined to real omitted objects.
    limitations:
      paragraphs:
        - zh: 业务兼容性可能需要真实排除项，集中策略 authority 被接管时控制会失效；没有对象级 decision 的产品只能证明暴露，不能证明已利用。
          en: Business compatibility can require real exclusions, and compromise of centralized policy authority defeats the control. Products without object-level decisions can establish exposure but not exploitation.
  - target_ref: NJS-0123-003
    use:
      paragraphs:
        - zh: 对关键事件启用不同权远程发送、冗余目的地、队列与序列完整性，使用独立活动源和端到端 canary 检查生成、转发、摄取与持久存储，不让本地日志成为唯一事实源。
          en: For critical events, enable differently authorized remote delivery, redundant destinations, queue and sequence integrity, and independent activity sources plus end-to-end canaries across generation, forwarding, ingestion, and durable storage so local logs are not the sole source of truth.
    expected_effect:
      paragraphs:
        - zh: 选择性跳过和整源静默更快表现为活动—事件差分；至少一个独立副本或阶段指标可保留缺口发生前后的证据。
          en: Selective skipping and whole-source silence become activity-to-event differentials sooner, while at least one independent copy or stage metric preserves evidence around the gap.
    limitations:
      paragraphs:
        - zh: 攻击发生在最初事件生成之前时，冗余转发不能创造不存在的记录，必须依赖独立活动或 canary；带宽、隐私和成本限制也会压缩覆盖。
          en: Redundant forwarding cannot create a record suppressed before initial generation, so independent activity or canaries remain necessary. Bandwidth, privacy, and cost constraints can also narrow coverage.
  - target_ref: NJS-0123-004
    use:
      paragraphs:
        - zh: 把本地 UI 与单一成功响应降为非权威声明，从独立管理 authority 读取已安装版本、服务与签名清单，并用非破坏 canary 验证真实防护、事件和恢复结果。
          en: Treat a local UI and single success response as nonauthoritative claims, read installed version, service state, and signed inventory from an independent management authority, and use nondestructive canaries to verify real protection, event, and recovery outcomes.
    expected_effect:
      paragraphs:
        - zh: 伪造进度或健康图标无法单独关闭升级与响应流程，反馈与真实状态矛盾会在攻击者继续控制设备前被揭示。
          en: Fake progress or a healthy icon cannot independently close upgrade and response workflows, and disagreement between feedback and real state is exposed before continued adversary control is trusted.
    limitations:
      paragraphs:
        - zh: 某些封闭设备没有独立版本接口或安全 canary；若本地 UI、管理 API 与验证 authority 同时被接管，必须依赖离线完整性检查或重建。
          en: Some closed appliances lack an independent version interface or safe canary. If local UI, management API, and validation authority are compromised together, offline integrity checking or rebuilding is required.
