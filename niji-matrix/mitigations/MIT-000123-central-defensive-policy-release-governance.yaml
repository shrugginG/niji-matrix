schema_version: "2.0.0"
type: mitigation
id: MIT-000123
name: {zh: 集中防御策略发布与消费者验证治理, en: Central Defensive-Policy Release and Consumer Verification Governance}
summary: {zh: 限制安全策略写权、保护版本与审批，并在目标消费者上验证真实防护状态。, en: "Limit security-policy writers, protect versions and approvals, and verify real protection state at target consumers."}
description:
  paragraphs:
    - zh: 本缓解把域或租户安全策略当作高影响发布工件。防御设置、GPO 链接和作用域由与日常管理员分离的角色维护，发布前比较完整旧新版本与目标集合，使用双人批准和分阶段部署；不可变审计保留 AD/SYSVOL 或租户对象、writer、审批、消费者和功能验证。对有篡改保护的工具，必须确认实际生效状态而非依赖策略管理器的“成功”反馈。
      en: This mitigation treats domain or tenant security policy as a high-impact release artifact. Defensive settings, GPO links, and scope are maintained by roles separated from ordinary administrators, complete old and new versions plus target sets are compared before release, and dual approval and staged deployment are used. Immutable audit retains AD and SYSVOL or tenant object, writer, approval, consumer, and functional validation. For tamper-protected tools, real effective state is checked instead of relying on a policy manager's success response.
domains: [enterprise]
measures:
  - key: separated-policy-write
    name: {zh: 分离防御策略写入权, en: Separated Defensive-Policy Write Authority}
    description: {paragraphs: [{zh: 收紧 GPO、SYSVOL、link、security filter 与租户安全策略的委派写入权限，对关闭防护、审计或响应的字段要求即时授权和双人批准，并限制账户同时改写审计出口。, en: "Restrict delegated write access to GPO, SYSVOL, links, security filters, and tenant security policy; require just-in-time authority and two-person approval for fields that disable protection, audit, or response, and prevent the same account from rewriting audit export."}]}
    control_type: preventive
  - key: immutable-policy-consumer-lineage
    name: {zh: 不可变策略—消费者谱系, en: Immutable Policy-to-Consumer Lineage}
    description: {paragraphs: [{zh: 把完整策略版本、模板 hash、作用域、复制状态、目标采用版本及工具有效设置送往不同权存储，发布后按设备或服务确认真实防护结果与预期一致。, en: "Send complete policy versions, template hashes, scope, replication state, target-consumed versions, and effective tool settings to differently authorized storage, then verify real defensive outcomes against expectations on each device or service after release."}]}
    control_type: detective-support
applications:
  - target_ref: NJT-0125
    use: {paragraphs: [{zh: 将会影响安全工具、审计或响应的域/租户权威版本列为高风险变更，预先审阅受影响控制与消费者集合，发布中连接 writer 与目标，发布后用受控事件或状态检查验证实际能力。, en: "Classify authoritative domain or tenant versions affecting security tools, audit, or response as high-risk changes, review impacted controls and consumers before release, join writer to targets during rollout, and validate real capability afterward with controlled events or state checks."}]}
    expected_effect: {paragraphs: [{zh: 单个恶意中心写入难以悄然扇出到大量目标；即便发布被篡改保护阻断，也能明确记录“已尝试、已消费、未失防”的结果。, en: "A single malicious central write is less able to fan out silently to many targets. Even when tamper protection blocks the release, attempted, consumed, and not-impaired outcomes remain explicit."}]}
    limitations: {paragraphs: [{zh: 委派管理员、域控制器或租户根权限被完全接管时仍可能绕过审批并污染同权证据；离线设备与复制延迟要求延长观察窗口，不能把未回报直接视为安全。, en: "Complete compromise of delegated administrators, domain controllers, or tenant-root authority can bypass approval and contaminate co-authorized evidence. Offline devices and replication delay require a longer observation window, and lack of reporting cannot be treated as safety."}]}
evidence_refs: [REF-000338, REF-000341, REF-000342, REF-000344, REF-000450]
lifecycle: {status: review, version: "1.0.0", created: "2026-09-22", modified: "2026-09-22", contributors: [Niji Matrix Research], reviewers: []}
