schema_version: "2.0.0"
type: mitigation
id: MIT-000124
name: {zh: 云层级防护继承与注册连续性, en: Cloud Hierarchy Guardrail and Enrollment Continuity}
summary: {zh: 限制层级迁移，要求新节点先入治理，再以全局清单和独立日志验证控制在前后祖先之间连续。, en: "Constrain hierarchy moves, enroll new nodes before use, and verify control continuity across old and new ancestors with global inventory and independent logs."}
description:
  paragraphs:
    - zh: 本缓解保护资源的 parent 边与治理注册，而不是只保护策略文本。成员离开、跨组织项目迁移和新账户/订阅创建应由独立组织管理角色审批，并事先计算来源和目的 ancestry 的 guardrail、集中日志、传感器与账单/owner 关系；必要的日志和策略未生效前，阻止新节点部署工作负载或进入生产网络。管理账户保留成员事件与不可变全局库存，防止原组织日志停止后失去唯一线索。
      en: This mitigation protects the resource parent edge and governance enrollment rather than only policy text. Membership departure, cross-organization project moves, and new account or subscription creation require approval by an independent organization-management role and precomputed guardrail, central logging, sensor, and billing or owner relationships for source and destination ancestry. Block workload deployment or production-network access until required logs and policy are effective on a new node. Retain membership events and immutable global inventory in the management account so loss of an old organization trail does not remove the sole clue.
domains: [enterprise]
measures:
  - key: guarded-hierarchy-authority
    name: {zh: 受控层级写权与迁移预审, en: Guarded Hierarchy Write Authority and Pre-Move Review}
    description: {paragraphs: [{zh: 最小化 LeaveOrganization、项目迁移、账户创建和订阅转移权限；通过 SCP、订阅转移策略及双人审批要求说明目标 ancestry、继承策略、日志去向和回退计划。, en: "Minimize LeaveOrganization, project migration, account creation, and subscription-transfer rights. Use SCPs, subscription-transfer policy, and dual approval to require target ancestry, inherited policy, log destination, and rollback plan."}]}
    control_type: preventive
  - key: enrollment-before-operation
    name: {zh: 工作负载运行前完成安全注册, en: Security Enrollment Before Workload Operation}
    description: {paragraphs: [{zh: 新账户、订阅或项目进入生产前验证组织级 trail、guardrail、检测代理、资源库存和告警路由均已生效，并用低风险 canary 检查真实事件可到达集中存储。, en: "Before a new account, subscription, or project enters production, verify that organization trail, guardrails, detection agents, resource inventory, and alert routing are effective and use a low-risk canary to test event delivery to central storage."}]}
    control_type: preventive
  - key: global-membership-evidence
    name: {zh: 全局成员与控制连续性证据, en: Global Membership and Control-Continuity Evidence}
    description: {paragraphs: [{zh: 在成员账户权限之外保存节点创建、离开、移动和注册事件及完整祖先历史，按稳定 resource ID 比较迁移前后有效控制和首个资源操作。, en: "Retain node creation, departure, move, and enrollment events plus complete ancestry history outside member-account authority and compare effective controls and first resource action before and after movement by stable resource ID."}]}
    control_type: detective-support
applications:
  - target_ref: NJT-0126
    use: {paragraphs: [{zh: 将账户、订阅、项目和 OU 的 parent 关系纳入安全变更流程，迁移或创建前预审继承控制，后续按稳定资源 ID 验证中心日志与资源活动是否连续。, en: "Put parent relationships for accounts, subscriptions, projects, and OUs under security change control, pre-review inherited controls before creation or movement, and verify central-log and resource-activity continuity afterward by stable resource ID."}]}
    expected_effect: {paragraphs: [{zh: 攻击者难以把运行中的资源悄然移出管辖或在未注册新节点中活动，层级改变后的控制缺口会被管理账户发现。, en: "The adversary has less opportunity to silently move a running resource out of governance or operate in an unenrolled new node, and management-account evidence exposes any post-change gap."}]}
    limitations: {paragraphs: [{zh: 组织根权限被接管或跨租户无法协作时可能失去目的侧可见性；强制先注册会延迟合法实验与灾备，不能恢复从未采集的历史事件。, en: Compromise of organization-root authority or lack of cross-tenant cooperation can remove destination-side visibility. Mandatory pre-enrollment can delay legitimate experiments and disaster recovery and cannot restore historical events never collected.}]}
  - target_ref: NJS-0126-001
    use: {paragraphs: [{zh: 对既有节点离开或项目迁移要求来源和目的管理者共同批准，预先比较两个祖先的 SCP、组织策略与 trail，并在切换后验证同一资源继续产生目标侧日志。, en: "Require joint approval by source and destination managers for departure or migration of an existing node, compare both ancestors' SCPs, organization policies, and trails beforehand, and verify that the same resource continues producing destination-side logs after transition."}]}
    expected_effect: {paragraphs: [{zh: 可阻止原组织 trail 突然失去既有成员而无人认领，迁移期间的控制下降被明确显示且可据可信基线回滚。, en: "A former organization trail is less likely to lose an existing member without ownership, and control degradation during migration becomes explicit and reversible from a trusted baseline."}]}
    limitations: {paragraphs: [{zh: 目的组织若在攻击者控制下可能声称等效控制但不提供证据；资源历史身份不稳定时对齐困难，离开后的未记录行为仍无法补采。, en: "An adversary-controlled destination organization can claim equivalent control without evidence. Unstable historical resource identity complicates joins, and unrecorded behavior after departure cannot be backfilled."}]}
  - target_ref: NJS-0126-002
    use: {paragraphs: [{zh: 为新账户或订阅定义自动注册事务，在组织 trail、guardrail、检测路由和资产所有者确认完成前限制工作负载创建及外联，并对首个资源操作生成独立管理账户告警。, en: "Define an automatic enrollment transaction for new accounts or subscriptions, restrict workload creation and egress until organization trail, guardrails, detection routing, and asset owner are confirmed, and alert from the management account on the first resource operation."}]}
    expected_effect: {paragraphs: [{zh: 新节点从创建到首用之间的无监控窗口被压缩或消除；未入治理的活动会形成明确的 creation-to-first-use 异常。, en: "The unmonitored interval between creation and first use shrinks or disappears, and activity in an unenrolled node becomes an explicit creation-to-first-use anomaly."}]}
    limitations: {paragraphs: [{zh: 沙箱和教育订阅可能被业务要求快速启用，需要有时限的隔离例外；跨租户新建且不共享管理身份的资源仍可能在全局库存之外。, en: Sandbox and education subscriptions may need rapid activation and require time-limited isolated exceptions. Cross-tenant creations without shared management identity can remain outside global inventory.}]}
evidence_refs: [REF-000456, REF-000457, REF-000458, REF-000459, REF-000460, REF-000461]
