schema_version: "2.0.0"
type: mitigation
id: MIT-000125
name: {zh: 版本化安全能力连续性治理, en: Versioned Security-Capability Continuity Governance}
summary: {zh: 限制旧组件使用，并以独立的运行、启动和功能证明阻断静默回退。, en: "Restrict legacy-component use and verify runtime, boot, and functional state independently to prevent silent rollback."}
description:
  paragraphs:
    - zh: 本缓解把安全版本当作会被真正执行或加载的状态，而不是更新系统的一行安装记录。运行时通过应用控制和功能移除缩小旧引擎入口，启动链通过撤销列表、受信引导与可验证映像约束旧组件；在两种路径中都保留不可变批准基线和不同权的有效能力验证，以免管理界面仍显示合规而保护已经下降。
      en: This mitigation treats security version as a state actually executed or loaded, not a line in update history. Application control and feature removal reduce legacy-engine entry points, while revocation lists, trusted boot, and verifiable images constrain old boot components. Both paths retain an immutable approved baseline and differently authorized verification of effective capability so a compliant-looking management console cannot conceal reduced protection.
domains: [enterprise]
measures:
  - key: remove-legacy-runtime
    name: {zh: 移除不需要的旧运行时并控制调用, en: Remove Unneeded Legacy Runtimes and Govern Invocation}
    description: {paragraphs: [{zh: 从受管映像中移除旧脚本引擎，保留需求时用应用控制限定允许的引擎 hash、调用主体、设备和期限，并验证脚本块审计仍由实际引擎产生。, en: "Remove legacy script engines from managed images where unnecessary. Where required, use application control to bind permitted engine hash, caller, device, and expiry, and verify that the actual engine still produces expected script-block audit."}]}
    control_type: preventive
  - key: attest-boot-and-revocation
    name: {zh: 启动撤销与独立测量, en: Boot Revocation and Independent Measurement}
    description: {paragraphs: [{zh: 按厂商指导部署启动组件撤销和更新，记录批准 hash 与 TPM/EFI 测量，并在每次重启后独立确认 Secure Boot、VBS 及相关内核保护实际启用。, en: "Deploy boot-component revocations and updates under vendor guidance, retain approved hashes and TPM or EFI measurements, and independently confirm that Secure Boot, VBS, and related kernel protections actually operate after every reboot."}]}
    control_type: preventive
applications:
  - target_ref: NJT-0127
    use: {paragraphs: [{zh: 为有防御责任的运行时和启动组件建立批准版本—真实加载—功能结果清单；任何降级申请要求变更单、特定设备与到期时间，发布后用独立测量复核。, en: "Maintain an approved-version to actual-load to functional-outcome inventory for defense-bearing runtimes and boot components. Every downgrade request needs a change ticket, specific devices, and expiry, followed by independent post-release verification."}]}
    expected_effect: {paragraphs: [{zh: 攻击者不能仅靠旧包存在或更新界面表象隐藏防御退化，版本和能力不一致会留下可追溯差分。, en: An adversary cannot rely on an old package's presence or update-console appearance to hide defensive regression; version-to-capability inconsistency remains traceable.}]}
    limitations: {paragraphs: [{zh: 无受信测量根或管理员同时控制批准基线与遥测出口时，版本证明可能被污染；确需兼容的旧组件仍需隔离和限时例外。, en: "Without a trusted measurement root, or when an administrator controls both approved baseline and telemetry export, version evidence can be contaminated. Essential legacy components still need isolation and time-limited exceptions."}]}
  - target_ref: NJS-0127-001
    use: {paragraphs: [{zh: 在需要脚本审计的 Windows 设备禁用不必要的旧 PowerShell 引擎；批准兼容负载必须指定进程 hash 和独立脚本内容观测，定期以受控脚本验证 4104 路径。, en: "Disable unneeded legacy PowerShell engines on Windows devices that require script auditing. Approved compatibility workloads must specify process hashes and independent script-content observation, with a controlled script periodically validating the 4104 path."}]}
    expected_effect: {paragraphs: [{zh: 旧引擎不能静默替代有内容审计的新引擎；例外运行也能被标记并保留替代遥测。, en: A legacy engine cannot silently replace a current audited engine; exceptional execution remains marked and retains alternative telemetry.}]}
    limitations: {paragraphs: [{zh: 禁用旧引擎可能破坏遗留业务脚本，且 4104 缺席也可能由采集故障造成，因此仍需执行证明和日志健康检查。, en: "Removing a legacy engine can break old business scripts, and absent 4104 events may reflect collection failure, so execution proof and log-health checks remain necessary."}]}
  - target_ref: NJS-0127-002
    use: {paragraphs: [{zh: 对受信启动与 VBS 设备按环发布 Boot Manager 撤销和受信组件清单，阻断旧加载链，并比较 TPM/EFI 测量与更新管理面和实际防护状态。, en: "Roll out Boot Manager revocations and trusted-component inventories by deployment ring on trusted-boot and VBS devices, block old load paths, and compare TPM or EFI measurements with update-console and effective-protection state."}]}
    expected_effect: {paragraphs: [{zh: 已撤销的旧组件难以重新进入启动链；即使版本表面正常，测量和功能差仍可揭示回退。, en: "Revoked old components are harder to reintroduce into the boot chain, and measurements plus function checks can expose rollback despite a normal-looking version display."}]}
    limitations: {paragraphs: [{zh: 撤销操作具有兼容和恢复风险，必须遵循厂商阶段计划；被攻陷的固件或缺失 TPM 的设备不能仅凭本措施确认真实启动状态。, en: Revocations carry compatibility and recovery risk and must follow vendor staging. Compromised firmware or devices without TPM cannot have their true boot state confirmed by this measure alone.}]}
evidence_refs: [REF-000462, REF-000463, REF-000464, REF-000465, REF-000198]
lifecycle: {status: review, version: "1.0.0", created: "2026-09-22", modified: "2026-09-22", contributors: [Niji Matrix Research], reviewers: []}
