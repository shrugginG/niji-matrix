schema_version: "2.0.0"
type: mitigation
id: MIT-000126
name: {zh: 网络加密路径与运行映像完整性治理, en: Network Crypto-Path and Running-Image Integrity Governance}
summary: {zh: 限制加密配置与设备映像写权，并独立验证真实会话强度和运行代码。, en: Restrict cryptographic configuration and image writes while independently validating real session strength and running code.}
description:
  paragraphs:
    - zh: 受保护的对象不是“已启用加密”标签，而是设备运行映像、密钥交换实现、服务配置和实际会话共同构成的保护路径。本缓解收紧网络设备 AAA 与映像发布，按原厂可信 hash 验证闪存和运行内存，限制弱算法协商，并用受控端点验证通信保密和完整性结果。对不支持运行证明的旧设备，优先隔离或更新，而不把吞吐量正常误认为密码安全。
      en: The protected object is not an encryption-enabled label but the path formed by a device's running image, key-exchange implementation, service configuration, and real sessions. This mitigation tightens network-device AAA and image release, verifies flash and running memory against trusted vendor hashes, restricts weak algorithm negotiation, and uses controlled peers to validate confidentiality and integrity outcomes. Legacy devices without runtime attestation should be isolated or replaced rather than treating normal throughput as cryptographic safety.
domains: [enterprise]
measures:
  - key: signed-image-and-aaa
    name: {zh: 受信映像与加密管理权分离, en: Trusted Images and Separated Crypto Administration}
    description: {paragraphs: [{zh: 限制可改写映像、密钥交换与加密配置的账户，启用原厂签名和启动/运行映像校验，并将变更审计送往不同权存储。, en: "Restrict accounts able to rewrite images, key exchange, and crypto configuration; enable vendor signatures and boot or running-image checks; export change audit to separately authorized storage."}]}
    control_type: preventive
  - key: approved-crypto-profile-test
    name: {zh: 批准密码配置与会话测试, en: Approved Crypto Profile and Session Test}
    description: {paragraphs: [{zh: 对每条关键隧道维护允许算法、密钥交换组与完整性基线，变更后以受控对等体和原厂验证检查实际结果，不依赖设备自报加密状态。, en: "Maintain allowed algorithms, key-exchange groups, and integrity baselines for each critical tunnel; validate outcomes after changes with a controlled peer and vendor verification rather than relying on a device's encryption-status label."}]}
    control_type: detective-support
applications:
  - target_ref: NJT-0128
    use: {paragraphs: [{zh: 为网络设备的每一关键加密接口记录批准映像与算法、受信管理者和会话基线；在更新、重载或加速器路径变化后复核运行 hash、握手与受控密钥交换结果。, en: "Record approved image and algorithms, authorized administrators, and session baseline for every critical encryption interface; after an update, reload, or accelerator-path change, recheck running hash, handshake, and controlled key-exchange result."}]}
    expected_effect: {paragraphs: [{zh: 恶意映像或配置导致的密钥材料变弱更难在普通密文外观下静默存在，等效的软件回退则不会被错误判为成功失防。, en: "Weak keying material caused by a malicious image or configuration is harder to conceal under ordinary ciphertext appearance, while an equivalent software fallback is not mislabeled as completed impairment."}]}
    limitations: {paragraphs: [{zh: 旧设备可能没有受信运行内存证明，部分密码测试不能在生产链路安全执行；被完全接管的设备可伪造同权状态，需外部对等体或离线取证。, en: "Legacy devices may lack trusted running-memory attestation, and some cryptographic tests cannot safely run on production links. A fully compromised device can forge co-authorized status, requiring an external peer or offline forensics."}]}
evidence_refs: [REF-000466, REF-000467, REF-000468]
