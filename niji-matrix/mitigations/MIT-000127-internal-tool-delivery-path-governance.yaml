schema_version: "2.0.0"
type: mitigation
id: MIT-000127
name: {zh: 内部工具投递路径与内容治理, en: Internal Tool Delivery Path and Content Governance}
summary: {zh: 限定东西向可写共享和批准分发源，并保留内容与目标范围证据，降低任意受陷主机投递工具的机会。, en: Restrict east-west writable shares and approved distributors while retaining content and destination-scope evidence to reduce tool delivery from arbitrary compromised hosts.}
description:
  paragraphs:
    - zh: 本控制将内部文件分发视为需要明确来源、内容、目标和有效期的授权事务。Windows SMB 分段可减少普通终端直接写入其他主机的通路；发布记录和目标文件证据则让未被阻断的复制仍能与批准范围比较。它针对的是 T1570 的文件到达，不以阻止后来进程运行为唯一成功标准。
      en: This control treats internal file distribution as an authorized transaction with an identified source, content, destination, and validity period. Windows SMB segmentation reduces paths by which ordinary endpoints can write directly to other hosts, while release records and destination file evidence allow unblocked copies to be compared with approved scope. It addresses T1570 file arrival rather than making prevention of later process launch its only success criterion.
domains: [enterprise]
measures:
  - key: bounded-east-west-share-write
    name: {zh: 限定东西向共享写入, en: Bound East-West Share Writes}
    description:
      paragraphs:
        - zh: 清点需要 SMB 写入的业务、发布服务器和目标组；在主机防火墙与共享权限中只允许具名来源和服务身份写入目标，并在不需要的工作站及跨区路径关闭入站或出站 SMB。先对补丁、备份、集群和应急流程测试，再部署例外。
          en: Inventory business uses, distribution servers, and target groups that require SMB writes. Limit host-firewall and share write rules to named sources and service principals, and close inbound or outbound SMB on workstations and cross-zone paths that do not need it. Test patching, backup, clustering, and emergency workflows before deploying exceptions.
    control_type: preventive
  - key: authorized-artifact-scope
    name: {zh: 发布内容与目标范围登记, en: Register Release Content and Destination Scope}
    description:
      paragraphs:
        - zh: 对授权分发保存发布者、内容摘要、目标列表、变更单和到期时间，并使目标侧文件创建与共享日志可关联。对紧急响应提供短期例外和补录审核，不把签名工具或管理共享名称当作本次操作授权。
          en: Retain publisher, artifact digest, destination list, change record, and expiry for approved distribution, and make destination file creation joinable to share logs. Provide short-lived exceptions and retrospective review for emergency response rather than treating a signed utility or administrative-share name as authorization for the current operation.
    control_type: governance
  - key: cross-host-transfer-evidence
    name: {zh: 保留跨主机传输证据, en: Retain Cross-Host Transfer Evidence}
    description:
      paragraphs:
        - zh: 在高风险共享启用详细共享访问审计并采集目标文件事件，保留登录标识、源地址、共享路径、文件摘要和资产身份映射，使响应人员能够恢复多目标到达范围。
          en: Enable detailed share-access auditing on high-risk shares and collect destination file events, retaining logon ID, source address, share path, file digest, and asset-identity mapping so responders can reconstruct multi-target arrival scope.
    control_type: detective-support
applications:
  - target_ref: NJT-0130
    use:
      paragraphs:
        - zh: 对横向工具传输，把普通终端到其他主机的可写共享限制为经批准的源—目标对，并对发布工具强制内容摘要和目标集合登记。发现未经批准的多目标放置时撤销共享写权、隔离分发源并核查已落地文件；紧急处置采用有时限的专门通路。
          en: For Lateral Tool Transfer, limit writable shares from ordinary endpoints to approved source and destination pairs, and require artifact digests and destination-set registration for distribution tools. On unapproved multi-target placement, revoke share write rights, isolate the distribution source, and inspect already landed files; use a dedicated time-limited path for emergency response.
    expected_effect:
      paragraphs:
        - zh: 攻击者不能轻易从任意受陷工作站向多台主机复制工具；即使借获准源投递，也会在源身份、摘要或目标范围上留下可核对的差异，并使扩散范围可被快速枚举。
          en: An adversary cannot readily copy tools from any compromised workstation to many hosts. Delivery through an allowed source still leaves reviewable differences in source identity, digest, or destination scope and allows rapid enumeration of the spread.
    limitations:
      paragraphs:
        - zh: 已被攻陷的正式分发源、获批准但恶意的内容、非 SMB 传输和未纳入遥测的目标仍可绕过该控制。过度限制共享可能中断补丁、备份、集群或事件响应，因此需按业务 owner 验证例外并结合目标执行控制。
          en: A compromised approved distributor, approved but malicious content, non-SMB transfer, and destinations without telemetry can bypass this control. Excessive share restriction can interrupt patching, backup, clustering, or incident response, so exceptions need business-owner testing and destination execution controls remain necessary.
evidence_refs: [REF-000473, REF-000474, REF-000475, REF-000476]
