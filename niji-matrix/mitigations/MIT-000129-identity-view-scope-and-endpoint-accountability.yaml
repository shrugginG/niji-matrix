schema_version: 2.0.0
type: mitigation
id: MIT-000129
name:
  zh: 身份视图范围与端点访问问责
  en: Identity-View Scoping and Endpoint Accountability
summary:
  zh: 缩小可同步身份清单并为端点既存副本的非惯常读取保留可核查谱系。
  en: Reduce synchronized identity-list scope and retain verifiable lineage for unusual reads of endpoint-held copies.
description:
  paragraphs:
  - zh: 该控制在身份服务与终端两个位置治理同一份账户视图：管理员用地址簿策略限制用户可见的 GAL/OAB 范围，并在高价值受管端点确认缓存位置、客户端所有者与对象访问审计的实际覆盖。它降低未来同步副本可暴露的账户集合，并使本次端点再读取可被调查，但不能宣称
      ABP 是完整安全隔离。
    en: 'This control governs one identity view at the identity service and endpoint: administrators use address-book policies
      to limit GAL/OAB visibility and verify cache location, client ownership, and actual object-access auditing on high-value
      managed endpoints. It reduces the future synchronized account set and makes current endpoint rereads investigable, without
      treating ABP as complete security isolation.'
domains:
- enterprise
measures:
- key: address-book-scope
  name:
    zh: 限制地址簿可见范围
    en: Scope address-book visibility
  description:
    paragraphs:
    - zh: 按业务边界配置并验证 ABP、GAL 与 OAB 分配，定期复核共享邮箱和服务身份可见清单。
      en: Configure and test ABP, GAL, and OAB assignments by business boundary and periodically review lists visible to shared
        mailboxes and service identities.
  control_type: exposure-reduction
- key: endpoint-copy-audit
  name:
    zh: 审计身份副本访问
    en: Audit identity-copy access
  description:
    paragraphs:
    - zh: 盘点受管终端上的实际 OAB 或地址簿路径，在高价值设备上试点目标对象 SACL 或经验证的文件访问遥测，并保留进程与外传谱系。
      en: Inventory actual OAB or address-book paths on managed endpoints, pilot targeted object SACLs or verified file-access
        telemetry on high-value devices, and retain process and transfer lineage.
  control_type: detective-support
applications:
- target_ref: NJT-0131
  use:
    paragraphs:
    - zh: 对父级账户发现，先减少低权限会话可以同步的账户范围，再比较批准同步、端点读取和后继传输，使既存副本与在线查询均有责任归属。
      en: For parent Account Discovery, reduce the accounts a low-privilege session can synchronize, then compare approved
        sync, endpoint reads, and later transfer so preexisting copies and online queries both have accountable provenance.
  expected_effect:
    paragraphs:
    - zh: 可取得的账户集合缩小，异常端点读取更易被发现；攻击者需要接受较少或较旧的名单，或改用可审计的其他路径。
      en: The available account set shrinks and unusual endpoint reads become easier to investigate; the adversary must accept
        a smaller or older list or shift to another observable path.
  limitations:
    paragraphs:
    - zh: ABP 只分段视图，不隔离所有目录对象；既有缓存和已外传副本不会被追回，4663 需要 SACL 且可能产生日志负担。
      en: ABP segments views rather than isolating every directory object; existing caches and exfiltrated copies are not
        retracted, and 4663 requires a SACL with possible log cost.
- target_ref: NJS-0131-001
  use:
    paragraphs:
    - zh: 对既存身份视图复用，在允许缓存的终端缩小后续 OAB 同步范围，并把非批准客户端读取副本与同一进程的暂存、网络结果关联。
      en: For Reuse of a Preexisting Identity View, narrow future OAB synchronization where caching is allowed and join nonapproved
        client reads of copies with staging and network outcomes from the same process.
  expected_effect:
    paragraphs:
    - zh: 该子项转移到端点的观察面获得独立读取证据，且未来缓存含有的身份减少。
      en: The observation surface shifted to the endpoint gains independent read evidence, and future caches contain fewer
        identities.
  limitations:
    paragraphs:
    - zh: 合法 Outlook 必须访问其缓存；应用内部 API 可能绕过文件审计，已复制旧文件仍可被利用。
      en: Legitimate Outlook must read its cache; in-app APIs may bypass file auditing and already copied old files remain
        usable.
