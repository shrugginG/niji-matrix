schema_version: 2.0.0
type: mitigation
id: MIT-000130
name:
  zh: 交互窗口观察面治理
  en: Interactive Window-Observation Governance
summary:
  zh: 为读取窗口状态的主体建立可审计来源，并限制未授权主体在条件命中后的通信或收集能力。
  en: Establish auditable provenance for window-state readers and constrain unauthorized communication or collection after
    a condition matches.
description:
  paragraphs:
  - zh: 本控制面向可读取跨应用窗口状态的交互终端。组织盘点辅助功能、RPA、测试和远程支持主体，针对高价值会话部署经验证的 GUI 访问遥测，并以应用控制与最小权限约束未授权的后继截图和通信。控制重点是来源归属与结果约束，不是假定普通窗口标题读取可以普遍被禁止。
    en: This control concerns interactive endpoints where actors can read cross-application window state. Inventory accessibility,
      RPA, testing, and remote-support actors; deploy validated GUI access telemetry in high-value sessions; and use application
      control and least privilege to constrain unauthorized follow-on capture and communication. The control improves provenance
      and outcome restriction rather than assuming ordinary title reads can be universally prohibited.
domains:
- enterprise
measures:
- key: approved-gui-actors
  name:
    zh: 登记批准的 GUI 观察主体
    en: Register approved GUI observers
  description:
    paragraphs:
    - zh: 记录屏幕阅读器、自动化与远程支持工具的发布者、业务 owner、可用会话、目标范围及变更记录，并定期复核。
      en: Record publisher, business owner, permitted sessions, target scope, and change history for screen readers, automation,
        and remote-support tools, and review them periodically.
  control_type: governance
- key: verified-gui-telemetry
  name:
    zh: 部署可验证的窗口读取遥测
    en: Deploy verified window-read telemetry
  description:
    paragraphs:
    - zh: 先在试点确认传感器能把窗口读取归于调用进程与会话，再保存最小必要的标题类别、进程谱系及后继网络或截图事件。
      en: In a pilot, verify that the sensor attributes window reads to caller process and session, then retain the minimum
        necessary title categories, process lineage, and follow-on network or capture events.
  control_type: detective-support
- key: follow-on-capability-control
  name:
    zh: 限制未授权后继能力
    en: Constrain unauthorized follow-on capability
  description:
    paragraphs:
    - zh: 对非批准进程实行应用控制和出站规则，减少其在目标窗口出现后截图、注入或发起通信的能力。
      en: Apply application control and egress rules to unapproved processes to reduce their ability to capture, inject, or
        communicate after a target window appears.
  control_type: preventive
applications:
- target_ref: NJT-0132
  use:
    paragraphs:
    - zh: 对应用窗口发现，先建立同一交互会话内合法窗口观察程序的清单，再把未经批准的窗口读取与后继活动做进程级关联。
      en: For Application Window Discovery, inventory legitimate window observers in each interactive session and correlate
        unapproved window reads with later activity at process granularity.
  expected_effect:
    paragraphs:
    - zh: 窗口读取主体更容易归属，异常查询不必仅凭进程名猜测；未授权后继能力受到限制。
      en: Window readers become easier to attribute without guessing from a process name alone, and unauthorized follow-on
        capability is constrained.
  limitations:
    paragraphs:
    - zh: 辅助功能和自动化业务可能需要相同接口；默认 Windows/Sysmon 日志不提供完整 GUI 调用覆盖，传感器试点与隐私控制不可省略。
      en: Accessibility and automation may need the same interfaces; default Windows or Sysmon logs do not provide complete
        GUI-call coverage, so sensor validation and privacy controls are necessary.
- target_ref: NJS-0132-001
  use:
    paragraphs:
    - zh: 对窗口上下文门控后继活动，保留目标类别出现前后同一主体的窗口状态与通信/截图结果，并对未经批准的命中后结果实施应用或出站控制。
      en: For Window-Context-Gated Follow-On Activity, retain one actor’s window state and communication or capture outcomes
        before and after a target category appears, and apply application or egress controls to unapproved post-match outcomes.
  expected_effect:
    paragraphs:
    - zh: 防守方可验证“何时出现后继行为”的条件链，并减少命中后收集与通信机会。
      en: Defenders can test the condition chain governing when follow-on behavior appears and reduce post-match collection
        and communication opportunities.
  limitations:
    paragraphs:
    - zh: 标题可快速变化或含敏感信息，恶意代码也可能寄居于批准进程；单靠出站阻断不会阻止窗口状态读取。
      en: Titles can change quickly or contain sensitive information, and malicious code may inhabit an approved process;
        egress blocking alone does not prevent window-state reads.
