schema_version: 2.0.0
type: mitigation
id: MIT-000131
name:
  zh: 网络路径权威约束
  en: Network-Path Authority Enforcement
summary:
  zh: 限制非授权网络权威发布并保留终端实际指向，降低认证或内容通信被改道的机会。
  en: Restrict unauthorized network-authority announcements and retain endpoint-accepted directions to reduce redirection
    of authentication or content communications.
description:
  paragraphs:
  - zh: 在接入层限制谁能发布地址、名称与网关权威，并保留终端实际采用的配置。现有 DHCP snooping、动态 ARP 检查、DHCPv6 Guard、RA Guard 和名称解析治理分别覆盖适用协议；同一控制既能减少凭据路径替换，也能减少一般内容流被引到非授权中间节点。它不能阻止攻击者控制已批准代理或受信根后的
      TLS 终止。
    en: Constrain who can announce address, name, and gateway authority at the access layer and retain the configuration endpoints
      actually accept. Existing DHCP snooping, Dynamic ARP Inspection, DHCPv6 Guard, RA Guard, and name-resolution governance
      cover their applicable protocols. The same control reduces both credential-path substitution and diversion of ordinary
      content flows, but it cannot stop TLS termination by a compromised approved proxy or trusted root.
domains:
- enterprise
measures:
- key: authorized-dhcp-arp
  name:
    zh: DHCP 与 ARP 权威约束
    en: DHCP and ARP authority enforcement
  description:
    paragraphs:
    - zh: 在受管交换机对 IPv4 使用 DHCP snooping 可信端口和绑定库支持的动态 ARP 检查；对适用 IPv6 端口分别启用 DHCPv6 Guard 与 RA Guard，并验证异常通告被拒绝及合法服务仍可用。
      en: On managed switches, use trusted DHCP-snooping ports and binding-backed Dynamic ARP Inspection for IPv4. On applicable
        IPv6 ports, separately enable DHCPv6 Guard and RA Guard, verifying rejected rogue announcements and continued legitimate
        service.
  control_type: preventive
- key: name-resolution-authority
  name:
    zh: 名称解析权威约束
    en: Name-Resolution Authority Enforcement
  description:
    paragraphs:
    - zh: 无需 LLMNR 时通过策略禁用，维护批准 DNS 与 WPAD 清单，并对非授权回答保留来源、受害端与后继认证结果。
      en: Disable LLMNR by policy where unnecessary, maintain approved DNS and WPAD inventories, and retain responder, affected
        endpoint, and later authentication outcomes for unauthorized answers.
  control_type: preventive
applications:
- target_ref: NJT-0136
  use:
    paragraphs:
    - zh: 对承载认证的受管网段验证 DHCP/ARP 与 IPv6 第一跳权威，阻断非授权回答并把实际认证目标同批准服务对应。
      en: On managed authentication-bearing segments, validate DHCP and ARP plus IPv6 first-hop authority, block unauthorized
        replies, and match actual authentication destinations to approved services.
  expected_effect:
    paragraphs:
    - zh: 缩小攻击者可插入路径的机会，并让残余改道有可核对的端口、设备和身份结果。
      en: Reduce opportunities to insert an intermediary and make residual diversion auditable through port, device, and identity
        outcomes.
  limitations:
    paragraphs:
    - zh: 不覆盖攻击者已控制的受信网络设备或组织外部的无线网络；禁用旧协议和开启检查需评估兼容性。
      en: Does not cover a compromised trusted network device or wireless networks outside organizational control; disabling
        legacy protocols and enabling inspection require compatibility assessment.
- target_ref: NJS-0136-001
  use:
    paragraphs:
    - zh: 对少量主机的临时答案也执行来源验证和逐终端配置历史保留，不因整体网段异常率低而放行。
      en: Validate the source even for temporary answers affecting a few hosts and retain per-endpoint configuration history
        rather than allowing them on the basis of a low segment-wide anomaly rate.
  expected_effect:
    paragraphs:
    - zh: 选择性与短驻留不再足以避开接入层阻断和事后路径还原。
      en: Selectivity and brief residence no longer suffice to avoid access-layer blocking and later path reconstruction.
  limitations:
    paragraphs:
    - zh: 不受管交换机和个人设备缺少所需强制点；若批准权威被攻陷，仍需内容与认证结果差分。
      en: Unmanaged switches and personal devices lack required enforcement points; compromise of an authorized authority
        still requires answer and authentication-outcome comparison.
- target_ref: NJT-0142
  use:
    paragraphs:
    - zh: 验证内容目的地网络指向的来源并拒绝非授权回答。
      en: Verify the authority behind directions for content destinations and reject unauthorized replies.
  expected_effect:
    paragraphs:
    - zh: 减少伪权威插入内容路径的机会并保留访问时的路径证据。
      en: Reduce opportunities for false-authority insertion into content paths and retain route evidence at access time.
  limitations:
    paragraphs:
    - zh: 不覆盖组织外 Wi-Fi、已批准代理被滥用或受信根证书终止。
      en: Does not cover external Wi-Fi, abuse of approved proxies, or termination under a trusted root.
- target_ref: NJS-0142-001
  use:
    paragraphs:
    - zh: 少数域和终端的短时路径变化仍按单次来源合法性校验并保留同段对照。
      en: Validate each short-lived direction affecting even a few domains or endpoints and retain same-segment controls.
  expected_effect:
    paragraphs:
    - zh: 选择性不再单独足以绕过接入层阻断或事后路径还原。
      en: Selection alone no longer avoids access-layer blocking or later path reconstruction.
  limitations:
    paragraphs:
    - zh: 批准网络设备被攻陷时仍需证书和内容流差分。
      en: A compromised approved device still requires certificate and content-flow comparison.
