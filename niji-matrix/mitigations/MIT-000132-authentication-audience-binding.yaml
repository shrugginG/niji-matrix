schema_version: 2.0.0
type: mitigation
id: MIT-000132
name:
  zh: 认证受众绑定与抗中继
  en: Authentication-Audience Binding and Relay Resistance
summary:
  zh: 通过服务身份、消息完整性与通道绑定限制跨目标认证证明中继。
  en: Limit cross-destination authentication-proof relay through service identity, message integrity, and channel binding.
description:
  paragraphs:
  - zh: 通过服务身份验证、消息完整性与通道绑定，使一个目标收到的证明不能被中间节点无感转送给另一目标，并保留不兼容客户端的审计证据。该控制与网络权威约束互补，因为授权路径仍可能发生身份中继。
    en: Require service identity verification, message integrity, and channel binding so a proof offered to one destination cannot be silently
      forwarded by an intermediary to another, while retaining audit evidence for incompatible clients. This complements network-path controls
      because authentication relay can still occur along an otherwise authorized path.
domains:
- enterprise
measures:
- key: smb-mutual-auth-integrity
  name:
    zh: SMB 互认与完整性
    en: SMB mutual authentication and integrity
  description:
    paragraphs:
    - zh: 为高价值共享要求 SMB 签名或加密及 Kerberos 互认，针对 UNC 路径施加硬化策略，淘汰 SMB1 与不安全访客回退。
      en: Require SMB signing or encryption and Kerberos mutual authentication for high-value shares, apply UNC hardening to relevant paths,
        and remove SMB1 and insecure guest fallback.
  control_type: preventive
- key: ldap-signing-binding
  name:
    zh: LDAP 签名与通道绑定
    en: LDAP signing and channel binding
  description:
    paragraphs:
    - zh: 先审计无签名绑定与 CBT 不兼容客户端，再对域控强制 LDAP 签名和适用 LDAPS 的通道绑定，并验证受影响应用。
      en: Audit unsigned binds and CBT-incompatible clients first, then enforce LDAP signing and channel binding where applicable to LDAPS
        on domain controllers and verify affected applications.
  control_type: preventive
- key: adcs-web-enrollment-audience-binding
  name:
    zh: AD CS Web 注册通道与受众绑定
    en: AD CS Web Enrollment Channel and Audience Binding
  description:
    paragraphs:
    - zh: 按厂商支持配置在 Web Enrollment 与 CES 上落实 EPA 和 HTTPS 并限制不必要的 NTLM，先审计客户端兼容性，再以拒绝中继与合法注册样本验证；HTTPS 单独不等于抗中继。
      en: Apply vendor-supported EPA and HTTPS to Web Enrollment and CES and restrict unnecessary NTLM. Audit client compatibility, then
        test rejected relay and legitimate enrollment; HTTPS alone does not establish relay resistance.
  control_type: preventive
applications:
- target_ref: NJT-0136
  use:
    paragraphs:
    - zh: 逐服务识别认证材料可能经过的路径，优先对高权限 SMB、LDAP 与 Web 身份服务采用受众绑定，并为仍用 NTLM 的例外定义到期时间。
      en: Identify credential-bearing paths by service, prioritize audience binding for privileged SMB, LDAP, and web identity services,
        and set expiration for remaining NTLM exceptions.
  expected_effect:
    paragraphs:
    - zh: 即使攻击者暂时取得中间路径，可被另一个目标接受的认证证明范围也缩小，拒绝事件可供溯源。
      en: Even if an intermediary path is briefly obtained, fewer proofs remain acceptable to a different target and rejection events support
        reconstruction.
  limitations:
    paragraphs:
    - zh: SMB 和 LDAP 控制不能直接防住恶意无线门户上的明文输入或已窃 Cookie；旧应用可能不支持强制签名与绑定。
      en: SMB and LDAP controls do not directly prevent plaintext entry into a malicious wireless portal or theft of a cookie; legacy clients
        may not support required signing and binding.
- target_ref: NJS-0136-002
  use:
    paragraphs:
    - zh: 对中继目标清单上的 SMB 共享和 LDAP 服务强制签名、服务身份校验及通道绑定，持续审计拒绝与例外。
      en: Enforce signing, service identity validation, and channel binding on SMB shares and LDAP services in the relay target inventory,
        while auditing rejections and exceptions.
  expected_effect:
    paragraphs:
    - zh: 跨目标转送的挑战响应无法在受保护服务上悄然完成验证，失败及异常来源成为可用信号。
      en: A cross-destination challenge response cannot silently authenticate to protected services; failures and anomalous origins become
        useful signals.
  limitations:
    paragraphs:
    - zh: 仍允许 NTLM 的未受保护服务、其他未绑定协议和已取得明文秘密的攻击路径不受这组措施充分覆盖。
      en: Unprotected services that still accept NTLM, other unbound protocols, and paths where plaintext secrets have already been acquired
        remain outside this control's full coverage.
- target_ref: NJS-0165-002
  use:
    paragraphs:
    - zh: 对会触发机器或服务主体回连的远程方法收窄调用者和网络目的地，并在业务目标上强制 SMB 签名、LDAP 通道绑定或等价受众绑定。
      en: Constrain callers and network destinations for remote methods that trigger machine or service-principal callbacks and enforce SMB
        signing, LDAP channel binding, or equivalent audience binding on business targets.
  expected_effect:
    paragraphs:
    - zh: 即使服务被诱发回连，挑战响应更难被另一目标接受；拒绝事件和异常调用关系可被调查。
      en: Even when a service is induced to call back, its challenge response is less likely to be accepted by another target, while rejection
        events and anomalous call relationships remain investigable.
  limitations:
    paragraphs:
    - zh: 受众绑定不阻止最初材料外发，未受保护协议或攻击者仅离线破解时仍需出口限制、密码强度和轮换。
      en: Audience binding does not stop initial material emission. Unprotected protocols and offline cracking still require egress limits,
        password strength, and rotation.
- target_ref: NJS-0227-001
  use:
    paragraphs:
    - zh: 将会接受被转送认证证明的 Web Enrollment/CES 端点纳入清单，配置 EPA、适用通道绑定和 HTTPS，收窄 NTLM 并为旧客户端例外设期限。
      en: Inventory Web Enrollment and CES endpoints accepting forwarded authentication, configure EPA, applicable channel binding, and HTTPS,
        and restrict NTLM with bounded legacy-client exceptions.
  expected_effect:
    paragraphs:
    - zh: 使被中继身份更难在其他设备发起的签发事务中被接受，同时保留拒绝与例外证据。
      en: Make relayed identities harder to accept in enrollment initiated from another device while retaining rejection and exception evidence.
  limitations:
    paragraphs:
    - zh: 不阻止已获准请求者滥用宽模板、已有私钥被窃或服务外 CA 签名；配置不兼容会中断合法注册，应验证实际拒绝而非只检查 HTTPS。
      en: Does not prevent broad-template abuse by an approved requester, existing-key theft, or off-service CA signing. Incompatibility
        can disrupt legitimate enrollment; validate actual rejection instead of checking HTTPS alone.
