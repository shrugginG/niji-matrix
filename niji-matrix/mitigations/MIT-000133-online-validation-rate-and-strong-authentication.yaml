schema_version: 2.0.0
type: mitigation
id: MIT-000133
name:
  zh: 在线认证速率与抗重放控制
  en: Online Authentication Rate and Replay-Resistance Controls
summary:
  zh: 以跨时间和跨来源累积限速、风险挑战与强认证提高在线候选验证成本。
  en: Raise the cost of online candidate validation through cross-time and cross-source throttling, risk challenge, and strong authentication.
description:
  paragraphs:
  - zh: 在真正作密码判断的身份提供者处配置按稳定账号累积的限速和渐进延迟，同时依据跨账号来源覆盖施加风险挑战。高价值身份以抗钓鱼多因素认证或等效强认证隔离已匹配的主秘密与资源访问；策略应控制锁定导致的拒绝服务，并为联合身份入口核验实际生效点。
    en: Configure rate limits and progressive delay per stable account at the identity provider that actually judges the password, and apply risk
      challenges to sources covering multiple accounts. Phishing-resistant MFA or equivalent strong authentication separates a matched primary
      secret from resource access for high-value identities. Policies must control lockout-driven denial of service and verify the enforcement
      point in federated entry.
domains:
- enterprise
measures:
- key: per-account-throttle
  name:
    zh: 稳定账号失败累积与延迟
    en: Stable-Account Failure Accumulation and Delay
  description:
    paragraphs:
    - zh: 在实际验证器按稳定账户累计失败并逐步延时，避免只按 IP 与账户组合建桶。
      en: Accumulate failures per stable account at the actual verifier and introduce progressive delay; do not use only a combined IP-account
        bucket.
  control_type: preventive
- key: source-population-rate
  name:
    zh: 跨来源与账户覆盖风险控制
    en: Cross-Source and Account-Coverage Risk Control
  description:
    paragraphs:
    - zh: 对来源、ASN 和目标账户覆盖共同施加风险自适应速率控制与挑战，并保护正常用户免受批量锁定。
      en: Apply risk-adaptive throttling or challenge based on source, ASN, and covered account population while protecting legitimate users from
        mass lockouts.
  control_type: cost-increasing
- key: resistant-authentication
  name:
    zh: 高价值账户强认证
    en: Strong Authentication for High-Value Accounts
  description:
    paragraphs:
    - zh: 为高价值账户配置抗钓鱼 MFA 或等效强认证，并淘汰不能执行这些控制的旧入口。
      en: Require phishing-resistant MFA or equivalent strong authentication for high-value accounts and retire legacy entry points that cannot
        enforce it.
  control_type: preventive
applications:
- target_ref: NJS-0137-001
  use:
    paragraphs:
    - zh: 将失败限速与风险计数保留到超过常见攻击间隔的窗口，并校准账户历史及密码过期行为。
      en: Retain failed-attempt throttling and risk counters beyond common adversary spacing, calibrated to account history and password-expiry
        behavior.
  expected_effect:
    paragraphs:
    - zh: 提高长期低频候选成本，并在最终秘密匹配后仍以强认证阻断资源访问。
      en: Raise the cost of long-running low-rate trials and block resource access with strong authentication even after a primary-secret match.
  limitations:
    paragraphs:
    - zh: 过严锁定可被用来拒绝服务；MFA 不能阻止秘密被验证，长期计数也可能受到合规保留期约束。
      en: Overly strict lockout can be abused for denial of service; MFA does not prevent a secret from being validated, and long counters may
        be constrained by retention policy.
- target_ref: NJS-0137-002
  use:
    paragraphs:
    - zh: 对账户与来源分别限速，并依据跨账户覆盖面施加风险挑战，不因更换 IP 而重置账户风险。
      en: Rate-limit by account and source separately, adding risk challenge based on cross-account coverage rather than resetting account risk
        when IP changes.
  expected_effect:
    paragraphs:
    - zh: 抑制把失败摊到多个主体来源对的收益，提高分布式验证的基础设施与时间成本。
      en: Reduce the benefit of spreading failures over principal-source pairs and increase the infrastructure and time cost of distributed validation.
  limitations:
    paragraphs:
    - zh: 共享代理、跨租户分布和被盗住宅出口使来源分类不可靠，挑战与限速需避免误伤合法用户。
      en: Shared proxies, cross-tenant distribution, and compromised residential egress weaken source classification; challenges and throttles
        must avoid harming legitimate users.
evidence_refs:
- REF-000499
- REF-000500
- REF-000503
