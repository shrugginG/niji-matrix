schema_version: 2.0.0
type: mitigation
id: MIT-000134
name:
  zh: 验证材料抗离线恢复与暴露响应
  en: Verification-Material Offline Resistance and Exposure Response
summary:
  zh: 保护可离线比对的验证材料、提高候选计算成本，并在暴露后缩短所得秘密的可用期。
  en: Protect verifier material usable offline, increase candidate-computation cost, and shorten the useful lifetime of recovered
    secrets after exposure.
description:
  paragraphs:
  - zh: 对应用可控制的口令存储使用逐用户盐与经校准的自适应哈希，并限制哈希库、域数据库和快照的批量读取及导出。材料失控时，应按可验证的账户映射安排重置、会话撤销和后继认证监控；域数据库的存储格式不能机械套用普通应用哈希参数。
    en: Use per-user salts and calibrated adaptive hashing in application password stores where the design permits, and restrict
      bulk reading or export of hash stores, domain databases, and snapshots. On exposure, use verified account mapping to
      plan resets, session revocation, and later-authentication monitoring. Domain-database formats cannot be treated as ordinary
      application-hash parameters.
domains:
- enterprise
measures:
- key: hardened-password-verifier
  name:
    zh: 高成本口令验证材料
    en: High-Cost Password Verifier Storage
  description:
    paragraphs:
    - zh: 在可选的密码存储中采用逐用户盐与经校准的自适应哈希工作因子，保护数据库及导出权限。
      en: Use per-user salts and calibrated adaptive hash work factors in password stores where design permits, and protect
        database and export permissions.
  control_type: preventive
- key: exposed-material-response
  name:
    zh: 验证材料暴露响应
    en: Verifier-Material Exposure Response
  description:
    paragraphs:
    - zh: 材料泄露后定位受影响身份并重置秘密、撤销相关会话，监测后继认证。
      en: On exposure, identify affected identities, reset secrets, revoke related sessions, and monitor subsequent authentication.
  control_type: containment
applications:
- target_ref: NJS-0137-003
  use:
    paragraphs:
    - zh: 限制域数据库和应用验证材料的批量读取与外传；对泄露材料按存储类型和账号映射评估离线破解可能性，再分批重置并强制后继认证。
      en: Restrict bulk access and export of domain or application verification material; assess offline recoverability by
        store type and account mapping, then rotate affected credentials and enforce strong subsequent authentication.
  expected_effect:
    paragraphs:
    - zh: 减少可用离线材料或提高每个候选的计算成本，并在泄露后缩短已恢复秘密的可用期。
      en: Reduce availability of offline material or raise per-candidate compute cost, and shorten the usable life of any
        recovered secret after exposure.
  limitations:
    paragraphs:
    - zh: 不能把通用应用哈希方案直接套到 NTDS.dit；已外流材料不可召回，重置前可能已经完成破解，强工作因子不消除弱口令风险。
      en: Generic application hash schemes cannot simply be imposed on NTDS.dit. Exfiltrated material cannot be recalled,
        cracking may have completed before reset, and strong work factors do not eliminate weak-password risk.
- target_ref: NJT-0177
  use:
    paragraphs:
    - zh: 在 OS 认证材料暴露后按材料类别与账户范围安排轮换、ticket/session 撤销和后继监控；广泛 NTDS 或 krbtgt 暴露进入域级恢复，不能只重置单一账户。
      en: After OS authentication-material exposure, plan rotation, ticket or session revocation, and successor monitoring
        by material class and account scope. Broad NTDS or krbtgt exposure enters domain recovery rather than a single-account
        reset.
  expected_effect:
    paragraphs:
    - zh: 该控制减少材料暴露范围并把处置收敛到可验证的对象、账户和复制关系。
      en: The control reduces material exposure scope and narrows response to verifiable objects, accounts, and replication
        relationships.
  limitations:
    paragraphs:
    - zh: 域数据库格式不能使用通用应用哈希参数，材料已外传后无法召回，且恢复顺序受复制健康与业务连续性约束。
      en: Domain-database formats cannot use generic application-hash parameters, exfiltrated material cannot be recalled,
        and recovery order depends on replication health and business continuity.
- target_ref: NJS-0177-002
  use:
    paragraphs:
    - zh: 对从非活动视图复制的验证材料，先确认依赖是否齐备和可恢复范围，再限制出口、轮换受影响身份并撤销相关 session；不要从副本文件自动推断破解成功。
      en: For verifier material copied from an inactive view, first establish dependency completeness and recoverable scope,
        then constrain egress, rotate affected identities, and revoke related sessions without inferring cracking success
        from the copied file.
  expected_effect:
    paragraphs:
    - zh: 该控制减少材料暴露范围并把处置收敛到可验证的对象、账户和复制关系。
      en: The control reduces material exposure scope and narrows response to verifiable objects, accounts, and replication
        relationships.
  limitations:
    paragraphs:
    - zh: 快照或备份可能缺少 SYSTEM、密钥或一致性，恢复产出和账户范围可能长期未知。
      en: A snapshot or backup may lack SYSTEM data, keys, or consistency, leaving recovery yield and account scope unknown
        for an extended period.
- target_ref: NJS-0177-003
  use:
    paragraphs:
    - zh: 目录复制 secret-bearing response 确认后，撤销非法 DRS 权限、隔离 caller 与相关 DC，按返回 naming context 和材料类别执行凭据、trust、gMSA、session/ticket
        与必要 krbtgt 恢复。
      en: After a secret-bearing directory-replication response, remove illegitimate DRS rights, isolate the caller and related
        DCs, and recover credentials, trusts, gMSAs, sessions or tickets, and krbtgt where needed according to returned naming
        context and material class.
  expected_effect:
    paragraphs:
    - zh: 该控制减少材料暴露范围并把处置收敛到可验证的对象、账户和复制关系。
      en: The control reduces material exposure scope and narrows response to verifiable objects, accounts, and replication
        relationships.
  limitations:
    paragraphs:
    - zh: 加密 RPC 和不完整属性审计可能无法确定精确返回范围；在攻击者仍有目录写权时轮换不会关闭暴露。
      en: Encrypted RPC and incomplete attribute audit may hide exact returned scope, and rotation does not close exposure
        while the adversary retains directory write authority.
