schema_version: 2.0.0
type: mitigation
id: MIT-000135
name:
  zh: 敏感源与归档出口治理
  en: Sensitive-Source and Archive-Egress Governance
summary:
  zh: 限制归档前的敏感数据读取，并把无法检查的归档送入有证据的出口审核。
  en: Constrain sensitive reads before archiving and route uninspectable archives through evidence-based egress review.
description:
  paragraphs:
  - zh: 控制先在源数据仍可分类时降低读取权，再要求归档产物与批准的接收方、任务和密钥处理方式相符。对无法解析的口令归档保留不可检查状态；对内置压缩进程，限制其输入范围与外联权限。这样既控制内容遮蔽，也保留进程内归档路径的源侧边界。
    en: The control reduces read rights while source data is still classifiable, then requires archive outputs to match approved
      recipients, jobs, and key handling. Passworded archives retain an explicit uninspectable state; processes with integrated
      compression have constrained inputs and egress. This addresses content blindness while preserving a source-side boundary
      for in-process packaging.
domains:
- enterprise
measures:
- key: sensitive-source-access-and-pretransform-dlp
  name:
    zh: 源数据最小权限与归档前分类
    en: Source Least Privilege and Pre-Archive Classification
  description:
    paragraphs:
    - zh: 以身份、设备和目录为范围执行最小读取权限；在源文件仍可分类时启用敏感标签/DLP 与高价值目录访问审计，保留主体和对象 ID。
      en: Enforce least read privilege by identity, device, and directory; classify and audit high-value source access while
        files remain inspectable, preserving principal and object IDs.
  control_type: preventive
- key: protected-archive-release-gate
  name:
    zh: 受保护归档出口审核
    en: Protected Archive Egress Review
  description:
    paragraphs:
    - zh: 对出站受保护归档记录格式和不可检查原因；未经批准的口令归档隔离或人工审核，批准业务通过受控密钥交付或源文件级证明放行。
      en: Record format and reason an outbound protected archive cannot be inspected; quarantine or review unapproved password
        archives, allowing approved business delivery through controlled key handling or source-level evidence.
  control_type: containment
- key: archival-process-scope
  name:
    zh: 归档任务及应用内导出范围治理
    en: Archive Job and In-App Export Scope Governance
  description:
    paragraphs:
    - zh: 维护被批准归档工具、代理和应用内导出的具体任务、输入目录、账号、目的地及有效期，完整记录外部工具和进程内路径的输出与外联。
      en: Maintain task, input path, account, destination, and validity period for approved utilities, agents, and in-app
        exports, retaining output and egress records for both utility and integrated paths.
  control_type: detective-support
applications:
- target_ref: NJT-0133
  use:
    paragraphs:
    - zh: 把源数据权限、归档产物和出口审批连为一条控制链，而不只盘点安装的压缩工具。
      en: Connect source-data permissions, archive output, and egress approval as one control chain rather than merely inventorying
        installed compressors.
  expected_effect:
    paragraphs:
    - zh: 限制攻击者可读输入与可用出口，同时保留归档前仍可分类的证据。
      en: Reduce the attacker's readable inputs and available egress paths while retaining evidence before packaging removes
        content visibility.
  limitations:
    paragraphs:
    - zh: 高权限攻击者、未受管设备和内存直传仍可能绕过部分控制；通用封禁压缩会破坏正常备份和交付。
      en: Privileged attackers, unmanaged devices, and direct memory transfer can bypass parts of the control; blanket compression
        bans would disrupt legitimate backup and delivery.
- target_ref: NJS-0133-001
  use:
    paragraphs:
    - zh: 把口令保护且不可解析的归档作为需审查状态，依源文件标签和授权密钥流程决定出口。
      en: Treat password-protected, unparseable archives as a review state and decide release using source labels and an authorized
        key process.
  expected_effect:
    paragraphs:
    - zh: 消除“扫描未报毒即视为内容已检查”的错误放行，并保留元数据与源侧证据。
      en: Prevent a clean outer scan from being mistaken for completed content inspection while retaining metadata and source-side
        evidence.
  limitations:
    paragraphs:
    - zh: 防守方无法强制解开所有业务加密，合法高保密归档会带来审核负荷。
      en: The defender cannot force open every legitimate encrypted delivery, and authorized confidential archives create
        review workload.
- target_ref: NJS-0133-002
  use:
    paragraphs:
    - zh: 对能够读取敏感数据且自行归档的长期运行应用施加最小读取和出口权限，记录输出；不要仅以归档工具允许/禁止清单作控制。
      en: Apply least read and egress privilege to resident applications that can package sensitive data themselves and retain
        output records; do not rely only on utility allow or deny lists.
  expected_effect:
    paragraphs:
    - zh: 即使归档不生成独立工具进程，源文件和出口仍有权限与审计边界。
      en: Source files and egress retain permission and audit boundaries even when packaging launches no utility process.
  limitations:
    paragraphs:
    - zh: 已被攻陷的受信应用可能继承合法权限，需要以任务、输入范围和目的地限制例外。
      en: A compromised trusted application may inherit legitimate permissions, so exceptions must be constrained by task,
        input scope, and destination.
evidence_refs:
