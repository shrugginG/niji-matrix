schema_version: 2.0.0
type: mitigation
id: MIT-000136
name:
  zh: 限制敏感导出落点与出口节点
  en: Constrain Sensitive-Export Destinations and Egress Nodes
summary:
  zh: 限定敏感数据可写的暂存点及其外联权限，并保留多源写入与取用的独立审计。
  en: Constrain writable staging points and their egress rights for sensitive data while retaining independent audit
    of many-source writes and retrieval.
description:
  paragraphs:
  - zh: 为邮箱导出、共享复制和数据库转储指定受控落点，并把能接收多源数据的服务器与互联网可取回服务的职责分离。审计源写入、目标文件创建和后继访问，以便发现被盗账户或允许路径被滥用。措施降低可用汇聚点数量，但不能把任何中央服务器自动视为恶意。
    en: Assign controlled destinations for mailbox exports, share copies, and database dumps, and separate servers
      that receive many sources from Internet-retrievable service roles. Audit source writes, target creation, and
      later access to expose misuse of stolen accounts or allowed paths. The measures reduce usable aggregation
      points without treating every central server as malicious.
domains:
- enterprise
measures:
- key: approved-export-destinations
  name:
    zh: 敏感导出批准落点
    en: Approved Sensitive-Export Destinations
  description:
    paragraphs:
    - zh: 为敏感邮箱导出、文件共享和数据库转储指定受控落点；取消普通账户在 Web 静态资源、回收站以外异常系统目录和临时共享上的不必要写权限，审计例外。
      en: Assign controlled destinations for sensitive mailbox exports, shares, and database dumps; remove unnecessary
        ordinary-account write rights to web static resources, unusual system paths, and temporary shares, with
        audited exceptions.
  control_type: preventive
- key: egress-role-separation
  name:
    zh: 汇聚节点出口职责分离
    en: Aggregation-Node Egress Role Separation
  description:
    paragraphs:
    - zh: 使汇聚服务器的外联目的地与源主机权限按角色最小化；外部可访问 Web 服务器不应同时成为未经批准的敏感数据汇聚点。
      en: Minimize outbound destinations and source-host rights for aggregation servers by role; an Internet-facing
        web server should not also be an unapproved sensitive-data aggregation point.
  control_type: exposure-reduction
- key: independent-staging-audit
  name:
    zh: 暂存点独立审计
    en: Independent Staging-Point Audit
  description:
    paragraphs:
    - zh: 对批准导出目录保留文件或对象访问日志、共享访问日志和 Web 请求日志，并以独立权限保存，保证能复原源、暂存点和取用者。
      en: Retain file or object access, share access, and web request logs for approved export locations under independent
        access control so source, staging point, and retriever can be reconstructed.
  control_type: detective-support
applications:
- target_ref: NJT-0134
  use:
    paragraphs:
    - zh: 把数据导出路径与可外部取用的服务器分离，并持续审查新增临时目录和共享的写权限。
      en: Separate data-export destinations from externally retrievable servers and continuously review write rights
        on newly created temporary directories and shares.
  expected_effect:
    paragraphs:
    - zh: 提高建立任意暂存点的权限成本，并为正常导出与异常暂存建立可核对基线。
      en: Raise the permission cost of arbitrary staging points and create an auditable baseline separating normal
        exports from anomalous staging.
  limitations:
    paragraphs:
    - zh: 已取得管理员或云存储控制权的攻击者仍可能创建新路径；控制需要持续权限审查，不能阻止在批准目录内发生的恶意复制。
      en: An adversary with administrator or cloud-storage control may create new paths; the measure requires ongoing
        rights review and cannot stop malicious copying inside an approved directory.
- target_ref: NJS-0134-001
  use:
    paragraphs:
    - zh: 对可接收多台主机数据的服务器限定来源、写入账户和对外连接目的地，并将备份/迁移任务列为有期限的例外。
      en: Limit source hosts, writing accounts, and outbound destinations for servers able to receive data from
        many hosts; make backup and migration jobs time-bounded exceptions.
  expected_effect:
    paragraphs:
    - zh: 减少攻击者能选作单一出口的内部节点，并使新来源或新外联关系更突出。
      en: Reduce internal nodes usable as a single egress point and make new sources or outbound relationships more
        conspicuous.
  limitations:
    paragraphs:
    - zh: 正常集中备份也需要多源入站，过严限制会影响运维；受控账户被盗或允许的出口被滥用仍可能绕过。
      en: Legitimate central backup also needs many-source ingress, so strict controls can disrupt operations; stolen
        approved accounts or allowed egress paths may still be abused.
- target_ref: NJT-0197
  use:
    paragraphs:
    - zh: 禁止敏感导出落入可公开服务目录；将数据生成/导出服务器与互联网可取回角色分离，并关联目录写入、路径发布、外部请求和响应字节。
      en: Prevent sensitive exports from landing in publicly served paths, separate data-generation or export servers
        from Internet-retrievable roles, and join directory writes, path publication, outside requests, and response
        bytes.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难让受害服务在正常响应方向发送暂存数据，异常产物与取回形成可阻断谱系。
      en: The adversary has greater difficulty making a victim service send staged data in its normal response direction,
        while unusual artifacts and retrieval form a blockable lineage.
  limitations:
    paragraphs:
    - zh: 已取得服务管理员权限的攻击者仍可修改发布路径或动态生成响应；CDN、缓存和合法下载需要精确例外。
      en: An adversary with service-administrator authority may still change served paths or generate responses
        dynamically; CDN, caching, and legitimate downloads require precise exceptions.
