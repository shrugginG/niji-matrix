schema_version: 2.0.0
type: mitigation
id: MIT-000137
name:
  zh: 收集源读取权限与审计治理
  en: Collection-Source Read Permission and Audit Governance
summary:
  zh: 缩小自动收集可读取的敏感对象范围，并保留足以连接多轮小规模读取的审计。
  en: Reduce sensitive objects accessible to automated collectors and retain audit sufficient to join several small read passes.
description:
  paragraphs:
  - zh: 按身份和工作职责限制高价值目录与云桶的读取范围，单列批准的备份、索引和 ETL 作业。对这些源启用有针对性的读取审计和跨轮保留，记录身份、目标范围、检查点或作业窗口；这些措施削减失陷身份的批量读取能力，并使增量模式有可比较的正常基线。
    en: Restrict high-value directories and cloud buckets by identity and job duty, and separately inventory approved backup,
      indexing, and ETL jobs. Enable targeted read auditing and cross-pass retention for those sources, recording identity,
      target scope, and checkpoint or job window. These controls reduce bulk-read reach of a compromised identity and provide
      a normal baseline against which incremental patterns can be compared.
domains:
- enterprise
measures:
- key: restrict-source-reads
  name:
    zh: 敏感源读取授权收敛
    en: Sensitive-Source Read Authorization Reduction
  description:
    paragraphs:
    - zh: 对敏感目录及云对象范围按工作职责缩窄读取授权，审查可跨大量对象读取的服务账户和长时凭证，并将合法备份或 ETL 身份单列。
      en: Narrow read authorization on sensitive directories and cloud-object scopes by job duty, review service identities
        and long-lived credentials with broad read reach, and separately inventory approved backup or ETL identities.
  control_type: exposure-reduction
- key: preserve-read-lineage
  name:
    zh: 多轮读取谱系保留
    en: Cross-Pass Read-Lineage Retention
  description:
    paragraphs:
    - zh: 对高价值文件启用定向读取审计并保留足以覆盖多轮的事件；云端对敏感桶启用对象级数据事件，记录授权自动作业的身份、范围与时间。
      en: Enable targeted read auditing for high-value files and retain events across multiple passes; enable object-level
        data events for sensitive cloud buckets and record approved automation identities, scopes, and schedules.
  control_type: detective-support
applications:
- target_ref: NJT-0135
  use:
    paragraphs:
    - zh: 在自动收集可接触的源数据端限制可读对象和服务账户权限，并保留重复源读取的审计谱系。
      en: Limit readable objects and service-account rights at sources accessible to automated collectors and retain a lineage
        of repeated source reads.
  expected_effect:
    paragraphs:
    - zh: 缩小一次失陷身份可自动遍历的数据范围，并让小规模重复读取可跨轮次关联。
      en: Reduce the data a compromised identity can traverse automatically and make smaller repeated reads correlatable across
        passes.
  limitations:
    paragraphs:
    - zh: 已有合法广泛读取权限的高权限身份仍可滥用；读取审计会产生容量与性能开销，且无法阻止攻击者利用未覆盖的数据源。
      en: A compromised high-privilege identity with legitimate broad read rights can still be abused; read auditing has storage
        and performance costs and cannot cover uninstrumented sources.
- target_ref: NJS-0135-001
  use:
    paragraphs:
    - zh: 对允许增量访问的授权作业登记检查点、身份与目标目录，并针对其他进程的跨轮变化文件读取做审计关联。
      en: Register checkpoints, identities, and target directories for approved incremental jobs, then correlate changed-file
        reads by other processes across passes.
  expected_effect:
    paragraphs:
    - zh: 降低攻击者借用增量读取常态混入短窗低量访问的机会，并使状态化选择留下可审计差异。
      en: Reduce the opportunity to blend into normal low-volume incremental reads and make stateful selection distinguishable
        in audit history.
  limitations:
    paragraphs:
    - zh: 与获授权备份同一身份或同一进程内发生的滥用可能仍难分辨；权限与审计不能保证识别内容被复制后的去向。
      en: Abuse within the same identity or process as an approved backup may remain hard to distinguish; permissions and
        auditing do not establish what happens after the content is copied.
- target_ref: NJT-0215
  use:
    paragraphs:
    - zh: 把 owner 指定的本地敏感路径、数据库导出区和批准读取者纳入最小授权，限制交互账户和长期备份权限，并用定向 SACL 将成功 ReadData、作业范围和后继结果关联。
      en: Place owner-designated sensitive local paths, database export areas, and approved readers under least authorization;
        restrict interactive and standing backup rights; use targeted SACLs to join successful ReadData, job scope, and downstream
        outcomes.
  expected_effect:
    paragraphs:
    - zh: 减少非批准主体可读取的本地内容，并使内容读取与目录发现、权限存在或普通管理活动分离。
      en: Reduce local content available to unapproved actors and separate content reads from discovery, permission existence,
        and ordinary administration.
  limitations:
    paragraphs:
    - zh: SACL 与特权审计可能产生高事件量，应用内部或内存读取可能不可见；批准备份、索引、EDR、迁移和取证仍需精确作业例外。
      en: SACL and privilege auditing may produce high volume, and application-internal or memory reads may be invisible.
        Approved backup, indexing, EDR, migration, and forensics still need exact job exceptions.
