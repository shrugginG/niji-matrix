schema_version: 2.0.0
type: mitigation
id: MIT-000138
name:
  zh: 浏览记录保留与读取问责
  en: Browser-Record Retention and Read Accountability
summary:
  zh: 缩小不必要的浏览历史副本，并使非惯常配置读取可追溯。
  en: Reduce unnecessary browser-history copies and make unusual profile reads traceable.
description:
  paragraphs:
  - zh: 本控制同时管理浏览记录的积累与端点访问证据。高敏工作站可按业务决定历史保留和同步范围；需要保留浏览功能时，对真实配置路径试点对象访问审计并联结进程谱系。它降低现成站点情报并提高异常读取调查能力，不能追回已保存副本。
    en: This control governs accumulated browsing records and endpoint access evidence together. High-sensitivity workstations
      can scope history retention and sync by business need; where browsing remains necessary, pilot object-access auditing
      on actual profile paths and join process lineage. It reduces ready-made site intelligence and improves unusual-read
      investigation but cannot retract copies already saved.
domains:
- enterprise
measures:
- key: history-retention-policy
  name:
    zh: 按业务限定历史保留
    en: Scope history retention to business need
  description:
    paragraphs:
    - zh: 在敏感终端评估 Edge 禁止新增历史策略或其他经验证配置，记录其对标签页同步及用户恢复的影响；例外指定 owner 和到期日。
      en: On sensitive endpoints, assess Edge’s no-new-history policy or another validated setting, document effects on tab
        sync and user recovery, and give exceptions an owner and expiry.
  control_type: exposure-reduction
- key: browser-profile-read-audit
  name:
    zh: 验证浏览器配置读取审计
    en: Validate browser-profile read auditing
  description:
    paragraphs:
    - zh: 盘点受管浏览器的实际用户配置路径，在高价值设备为历史和书签对象配置可承受的读审计，并保留进程和后继网络记录。
      en: Inventory actual user-profile paths for managed browsers, configure sustainable read auditing on history and bookmark
        objects for high-value devices, and retain process and later network records.
  control_type: detective-support
applications:
- target_ref: NJT-0138
  use:
    paragraphs:
    - zh: 对浏览器信息发现，减少本机和漫游配置中可直接获取的旧 URL、书签与偏好范围，并将非常用进程的读取同临时文件及后继网络结果关联。
      en: For Browser Information Discovery, reduce older URLs, bookmarks, and preferences directly available in local and
        roaming profiles, then join unusual-process reads to temporary files and later network outcomes.
  expected_effect:
    paragraphs:
    - zh: 攻击者取得的现成浏览地图可能更短或更陈旧，异常读者更易被识别；若仍需入口信息，其主动访问会留下另种痕迹。
      en: An adversary’s ready-made browsing map may be shorter or staler, and unusual readers become easier to identify;
        active visits for further entry-point knowledge leave different traces.
  limitations:
    paragraphs:
    - zh: 用户体验、同步与取证需要会限制保留收缩；旧副本仍在，应用内读取可能绕过已监控路径，4663 需要目标 SACL 且有事件量成本。
      en: User experience, sync, and forensic needs limit retention reduction. Old copies remain, in-browser reads can bypass
        monitored paths, and 4663 needs a target SACL with event-volume cost.
