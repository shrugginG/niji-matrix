schema_version: 2.0.0
type: mitigation
id: MIT-000140
name:
  zh: 云防护状态读取权限与独立基线
  en: Cloud Protection-State Read Authority and Independent Baseline
summary:
  zh: 限制非必要的防护状态查询并验证查询日志与实际安全覆盖。
  en: Limit unnecessary protection-state inquiries and verify query logging against actual security coverage.
description:
  paragraphs:
  - zh: 服务启用与保护状态是攻击者可用的目标情报，也是防守方必须知道的运行事实。组织应分开治理读状态和改状态权限，为 GuardDuty 等服务维护独立的账户/区域覆盖快照与批准巡检清单；对官方不产生日志的方法，则以权限最小化和经验证的替代观测管理缺口，不能声称开启
      Data Access 会补回该方法的日志。
    en: Service enablement and protective state are useful target intelligence and facts defenders must know. Govern read-state
      and change-state authority separately, maintain independent account and Region coverage snapshots and approved checks
      for services such as GuardDuty, and handle officially unlogged methods through least privilege and validated alternate
      observation. Enabling Data Access cannot recreate logs for a method that never emits them.
domains:
- enterprise
measures:
- key: separate-status-read-authority
  name:
    zh: 分开治理服务状态读写权
    en: Separate service-state read and change authority
  description:
    paragraphs:
    - zh: 按账户、项目及区域复核 GuardDuty 状态和服务目录读取权限，移除与职责无关的广域读取，并使防护状态更改由独立角色审批。
      en: Review GuardDuty state and service-catalog read rights by account, project, and Region, remove broad reads unrelated
        to duty, and require separately approved roles for protection-state changes.
  control_type: preventive
- key: independent-protection-inventory
  name:
    zh: 维护独立防护覆盖快照
    en: Maintain independent protection-coverage snapshots
  description:
    paragraphs:
    - zh: 定期从受信管理身份记录各账户和区域的服务启用、探测器状态及审计覆盖，用于复核未知查询来源和后继控制变化。
      en: Use a trusted management identity to record service enablement, detector status, and audit coverage by account and
        Region for reviewing unknown read origins and later control changes.
  control_type: detective-support
- key: document-unlogged-reads
  name:
    zh: 记录无日志读取路径
    en: Document unlogged read paths
  description:
    paragraphs:
    - zh: 对 GCP Service Usage 等特定无提供方审计方法标注盲区，评估经验证的受管终端代理或会话遥测并限制调用身份；未部署替代传感器时明确不可检测。
      en: Mark the blind spot for specific methods such as GCP Service Usage that lack provider audit; assess validated managed-endpoint
        proxy or session telemetry and limit caller identities, explicitly noting nondetection where no alternate sensor exists.
  control_type: governance
applications:
- target_ref: NJT-0140
  use:
    paragraphs:
    - zh: 对云服务发现，收紧能读取安全和日志服务状态的主体，维护批准巡检范围和独立状态快照，并按身份关联 GuardDuty 状态读取与后继安全控制变化。
      en: For Cloud Service Discovery, constrain principals able to read security and logging state, retain approved check
        scopes and independent state snapshots, and join GuardDuty state reads to later security-control changes by identity.
  expected_effect:
    paragraphs:
    - zh: 未知主体更难广泛取得防护覆盖图，AWS 状态查询更易与例行巡检区别；无日志路径至少有明确的权限与观察缺口治理。
      en: Unknown actors have less reach into the protection-coverage map, AWS state reads are easier to distinguish from
        routine checks, and unlogged paths have explicit authority and observation-gap governance.
  limitations:
    paragraphs:
    - zh: 合法 SOC/CSPM 仍需读取状态；GCP ListServices 无提供方逐次审计，Azure Activity Log 通常缺读事件，独立状态快照不能证明谁曾查询。
      en: Legitimate SOC and CSPM still need state reads. GCP ListServices lacks provider per-call audit, Azure Activity Log
        generally omits reads, and a state snapshot cannot prove who queried it.
