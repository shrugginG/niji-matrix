schema_version: 2.0.0
type: mitigation
id: MIT-000141
name:
  zh: 云对象清单权限与数据面审计
  en: Cloud Object-Listing Permission and Data-Plane Audit
summary:
  zh: 限制桶内键列举范围，并独立验证对象列表请求的实际留痕。
  en: Constrain in-bucket key enumeration and independently verify audit traces of object-list requests.
description:
  paragraphs:
  - zh: 对象列表可暴露目标名称而无需下载正文，因此应分别治理容器存在性、对象键列举和对象正文读取权限。高价值容器需要沿真实调用路径验证 AWS 数据事件及服务器访问日志、Azure Blob 资源日志或 GCP DATA_READ，并保存可关联身份与容器的请求记录；任何单条请求都不等于完整返回对象清单。
    en: Object listing exposes target names without downloading bodies, so govern container-existence, in-bucket listing,
      and object-body read rights separately. Validate AWS data events and server access logs, Azure Blob resource logs, or
      GCP DATA_READ along actual call paths for high-value containers, retaining request records with joinable identity and
      container context. No single request record equals the complete returned inventory.
domains:
- enterprise
measures:
- key: limit-list-authority
  name:
    zh: 限制对象列表权限
    en: Limit object-list authority
  description:
    paragraphs:
    - zh: 按业务容器与工作身份收紧 AWS ListBucket、Azure Blob 列举或 SAS 列表能力、GCP storage.objects.list，避免备份身份默认拥有所有桶和前缀。
      en: Constrain AWS ListBucket, Azure Blob listing or SAS list capability, and GCP storage.objects.list by business container
        and workload identity instead of giving backup principals every bucket and prefix.
  control_type: preventive
- key: validate-object-list-logging
  name:
    zh: 验证对象列表日志覆盖
    en: Validate object-list logging coverage
  description:
    paragraphs:
    - zh: 对高价值容器执行受控 ListObjects/V2、ListBlobs 或 objects.list，核查 AWS 选择器与 server access log、Azure StorageBlobLogs 诊断导出以及 GCP
        DATA_READ 的实际启用和保留。
      en: Run controlled ListObjects/V2, ListBlobs, or objects.list against high-value containers and verify AWS selectors
        and server access logs, Azure StorageBlobLogs export, and GCP DATA_READ enablement and retention.
  control_type: detective-support
applications:
- target_ref: NJT-0141
  use:
    paragraphs:
    - zh: 对云存储对象发现，将允许列举的身份与容器范围绑定到批准备份/索引作业；在可用数据面日志中区分并关联新来源的桶内列表与后续 GetObject。
      en: For Cloud Storage Object Discovery, bind allowed listing identities and containers to approved backup or indexing
        jobs and, where data-plane logs exist, separate and join new-origin in-bucket listings to later GetObject.
  expected_effect:
    paragraphs:
    - zh: 攻击者可见的对象键集合受权限约束，异常清单读取更可能留下可核查的请求及后继对象访问谱系。
      en: The set of visible object keys is constrained by permission, and unusual inventory reads are more likely to leave
        verifiable request and successor-access lineage.
  limitations:
    paragraphs:
    - zh: 共享键、SAS 与跨账户访问削弱个人归因；S3 server access log 尽力投递，普通桶 V2 的 CloudTrail 覆盖需本地测试，未启用的 GCP DATA_READ 与 Azure 诊断日志无法补采旧请求。
      en: Shared keys, SAS, and cross-account access weaken personal attribution. S3 server access logs are best effort, ordinary-bucket
        V2 CloudTrail coverage needs local testing, and disabled GCP DATA_READ or Azure diagnostic logs cannot backfill old
        requests.
