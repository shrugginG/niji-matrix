schema_version: 2.0.0
type: mitigation
id: MIT-000142
name:
  zh: 保管库消费权限与导出治理
  en: Vault Consumer Authority and Export Governance
summary:
  zh: 把受信消费者权限限定到必要秘密，保护导出配置并保持内容读取审计。
  en: Restrict trusted consumers to necessary secrets, protect export configuration, and retain content-read audit.
description:
  paragraphs:
  - zh: 保管库的安全边界应落在消费者、具体秘密与输出目的，而不只在是否已解锁。对本机管理器，限制插件、触发器和导出设置写权，把明文导出列为高风险变更；对云库，为每个工作负载限定读取资源并远程留存已启用的数据访问日志。配置、身份与审计由不同权限主体维护，避免一个被接管的受信进程同时改变控制和删除证据。
    en: The store boundary should bind consumer, specific secret, and output purpose rather than only unlock state. For local managers, restrict
      plugin, trigger, and export-setting writes and treat plaintext export as a high-risk change. For cloud vaults, scope each workload to necessary
      resources and retain enabled data-access logs outside its control. Configuration, identity, and audit should be held under separate authority
      so one compromised trusted process cannot alter controls and erase evidence.
domains:
- enterprise
measures:
- key: per-secret-consumer-scope
  name:
    zh: 逐秘密消费授权
    en: Per-Secret Consumer Scope
  description:
    paragraphs:
    - zh: 按应用、工作负载身份和具体 secret 建最小读取关系，避免所有服务共用可读全库的角色；定期比较实际内容读取与用途清单。
      en: Bind application and workload identities to specific secrets, avoiding shared roles that can read a whole vault, and compare real content
        reads with the approved purpose inventory.
  control_type: preventive
- key: export-config-integrity
  name:
    zh: 导出与触发器配置完整性
    en: Export and Trigger Configuration Integrity
  description:
    paragraphs:
    - zh: 限制本机保管应用的触发器、插件、二进制和导出目录写权，对明文导出要求有期限的审批，并保留配置旧新 hash 与生成文件。
      en: Restrict write rights on local vault triggers, plugins, binaries, and export destinations; require time-limited approval for plaintext
        export and retain old and new configuration hashes plus generated files.
  control_type: exposure-reduction
- key: independent-content-audit
  name:
    zh: 独立内容读取审计
    en: Independent Content-Read Audit
  description:
    paragraphs:
    - zh: 在需要的平台启用秘密内容读取审计，按调用者、资源、来源、结果及请求标识送往不同权日志存储；验证 Google Data Access 与 Azure 诊断的实际启用和交付。
      en: Enable secret content-read audit where required and send principal, resource, origin, result, and request identifier to differently
        authorized log storage; verify actual Google Data Access and Azure diagnostic enablement and delivery.
  control_type: detective-support
applications:
- target_ref: NJT-0147
  use:
    paragraphs:
    - zh: 把受管理保管库的许可主体、返回秘密与明文输出纳入同一控制台账；对本机和云库分别核对配置权、资源范围、审计交付及紧急轮换。
      en: Track permitted consumers, returned secrets, and plaintext output in one control inventory for managed vaults; verify configuration
        authority, resource scope, audit delivery, and emergency rotation separately for local and cloud stores.
  expected_effect:
    paragraphs:
    - zh: 减少一次被接管的消费身份可取回的秘密集合，并使异常配置或读取范围留下不同权证据。
      en: Reduce the secrets reachable through one compromised consumer and preserve differently authorized evidence of configuration or read-scope
        deviation.
  limitations:
    paragraphs:
    - zh: 真实消费者在允许范围内仍能返回秘密；审计成功事件不证明攻击者保存了值，个人或离线保管库可能缺少逐项日志。
      en: A genuine consumer can still return secrets within its allowed scope; audit success does not prove attacker retention, and personal
        or offline vaults may lack per-item logs.
- target_ref: NJS-0147-001
  use:
    paragraphs:
    - zh: 对 KeePass 类触发器和导出配置建立文件完整性及审批，对云工作负载建立主体—秘密允许图并审查新来源、首次条目和批量返回。
      en: Apply file integrity and approval to KeePass-like triggers and export configuration; maintain a principal-to-secret allowed graph for
        cloud workloads and review new origins, first-time items, and broad retrieval.
  expected_effect:
    paragraphs:
    - zh: 使被借用的受信外观不再仅凭成功权限通过审查，并在配置、条目或输出偏离时提高阻断和溯源能力。
      en: Prevent a borrowed trusted identity from passing review solely because authorization succeeds, while improving interruption and reconstruction
        when configuration, items, or outputs diverge.
  limitations:
    paragraphs:
    - zh: 攻击者若完全控制仍属许可范围的真实消费者，最小权限只能限制损失；Google Data Access 未启用时必须先修复审计覆盖。
      en: If an attacker fully controls a genuinely entitled consumer, least privilege limits scope rather than preventing every read; disabled
        Google Data Access must be corrected before audit-based coverage is claimed.
