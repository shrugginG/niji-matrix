schema_version: 2.0.0
type: mitigation
id: MIT-000143
name:
  zh: 保管进程隔离与短时明文控制
  en: Vault Process Isolation and Transient Plaintext Control
summary:
  zh: 限制调试与转储权限、缩短解锁明文窗口，并在异常内存访问后处置受影响秘密。
  en: Restrict debug and dump rights, shorten unlocked plaintext windows, and respond to exposed secrets after abnormal memory access.
description:
  paragraphs:
  - zh: 运行态取密绕过保管库逐项授权，因此缓解应保护实际处理密钥或明文的进程。按产品与系统版本收紧跨进程读取、调试和任务端口权限，避免不必要的长时解锁、明文展示、剪贴板和导出；维护一组限时获批诊断主体，并在异常转储出现后隔离设备、评估可恢复条目和轮换秘密。
    en: Runtime retrieval bypasses per-item vault authorization, so mitigation must protect the processes that actually handle keys or plaintext.
      Restrict cross-process read, debug, and task-port rights by product and system version; avoid unnecessary long unlocks, plaintext display,
      clipboard use, and export. Maintain time-bounded approved diagnostic actors and, after an anomalous dump, isolate the device, assess recoverable
      items, and rotate affected secrets.
domains:
- enterprise
measures:
- key: vault-process-rights
  name:
    zh: 保管进程高权访问约束
    en: Vault-Process High-Rights Restriction
  description:
    paragraphs:
    - zh: 仅让受审计维护主体取得密码管理器或系统钥匙串服务的调试、转储与跨进程读权；以签名、用户和版本限定例外。
      en: Grant debug, dump, and cross-process read rights to password-manager or keychain services only to audited maintenance actors, binding
        exceptions to signer, user, and version.
  control_type: preventive
- key: transient-plaintext-window
  name:
    zh: 短暂明文窗口收缩
    en: Transient Plaintext Window Reduction
  description:
    paragraphs:
    - zh: 使用厂商支持的自动锁定和进程硬化，减少明文展示、剪贴板、自动输入与导出时长；确认控制不破坏必要的用户工作流。
      en: Use vendor-supported auto-lock and process hardening to reduce plaintext display, clipboard, auto-type, and export duration while validating
        required user workflows.
  control_type: exposure-reduction
- key: dump-exposure-response
  name:
    zh: 异常转储后的秘密处置
    en: Secret Response After Anomalous Dump
  description:
    paragraphs:
    - zh: 出现未批准保管进程转储时先保全访问与文件谱系，按目标进程和解锁状态判断可能暴露的条目，再隔离源设备并轮换可受影响凭据。
      en: After an unapproved vault-process dump, preserve access and file lineage, assess potentially exposed items by target process and unlock
        state, then isolate the source device and rotate affected credentials.
  control_type: containment
applications:
- target_ref: NJT-0147
  use:
    paragraphs:
    - zh: 把处理保管密钥或明文的应用和系统服务列入高敏进程清单，分环境限制诊断主体并定义转储后的条目映射和轮换流程。
      en: Inventory applications and system services that handle vault keys or plaintext, restrict diagnostic actors by environment, and define
        item mapping and rotation after a dump.
  expected_effect:
    paragraphs:
    - zh: 减少通过运行态绕开逐项读取控制的机会，并保留可调查的进程访问和响应证据。
      en: Reduce opportunities to bypass per-item controls through runtime state and retain investigable process-access and response evidence.
  limitations:
    paragraphs:
    - zh: 同进程恶意代码或内核控制可绕过外部句柄约束；旧版 securityd 的可读布局不代表现代系统。
      en: In-process malicious code or kernel control can bypass external-handle restrictions; a readable legacy securityd layout does not describe
        modern systems.
- target_ref: NJS-0147-002
  use:
    paragraphs:
    - zh: 针对已登记保管进程拦截非批准高权句柄或任务端口，缩短用户解锁和明文导出窗口；发现异常转储后按实际材料而非全部库存轮换。
      en: Block unapproved high-rights handles or task ports targeting inventoried vault processes, shorten user-unlocked and plaintext-export
        windows, and rotate based on actual exposed material rather than the entire inventory after a suspicious dump.
  expected_effect:
    paragraphs:
    - zh: 增加跨进程取密成本，降低明文可见时间，并把可疑读取与受影响凭据处置连接。
      en: Increase cross-process retrieval cost, reduce plaintext exposure time, and link suspicious access to affected-credential response.
  limitations:
    paragraphs:
    - zh: 合法诊断需要限时例外；只有 ProcessAccess 而无密钥或明文结果时无法判定哪些条目已泄露。
      en: Legitimate diagnostics require bounded exceptions; ProcessAccess without a key or plaintext result cannot identify which items were
        exposed.
