schema_version: 2.0.0
type: mitigation
id: MIT-000145
name:
  zh: 敏感信息库读取权限与审计治理
  en: Sensitive Repository Read-Scope and Audit Governance
summary:
  zh: 缩小非职责信息库读取范围并保留低量高敏对象访问的上下文。
  en: Narrow out-of-duty repository reads and retain context for small high-sensitivity access sets.
description:
  paragraphs:
  - zh: 以业务 owner 和对象敏感度约束站点、空间和库的读取权，同时验证搜索、对象读取与下载审计确已开启并能用稳定对象键关联。这个控制既减少可被关键词筛中的无关敏感内容，也让合法调查、维护和员工研究有可核对的批准范围；产品不能提供页面读取事件时，应承认盲区。
    en: Constrain site, space, and repository reads by business owner and object sensitivity while verifying that search,
      object-read, and download audit is enabled and joinable through stable object keys. This reduces unrelated sensitive
      content reachable by keyword selection and gives legitimate investigations, maintenance, and employee research an auditable
      approval scope. Where a product lacks page-read events, the gap remains explicit.
domains:
- enterprise
measures:
- key: sensitive-scope-review
  name:
    zh: 敏感库按职责授权
    en: Duty-Based Sensitive Repository Grants
  description:
    paragraphs:
    - zh: 对高敏站点、空间、库和业务对象按实际职责分组授权，定期审查宽泛读取、共享链接和离职/转岗成员，保留业务 owner 的审批依据。
      en: Grant high-sensitivity sites, spaces, repositories, and business objects by real duties; periodically review broad
        read rights, sharing links, and departing or transferred members while retaining owner approval records.
  control_type: exposure-reduction
- key: search-read-telemetry
  name:
    zh: 查询与成功读取审计
    en: Query and Successful-Read Audit
  description:
    paragraphs:
    - zh: 对关键库启用搜索、对象读取及下载审计，验证保留期与字段、保护日志完整性，并把对象敏感性映射到稳定 ID。
      en: Enable search, object-read, and download audit for critical repositories, verify retention and fields, protect log
        integrity, and map sensitivity to stable object IDs.
  control_type: detective-support
applications:
- target_ref: NJT-0143
  use:
    paragraphs:
    - zh: 限制不相关主体对敏感协作、代码和业务库的读取，并在同一身份下保留从查询到实际内容访问的证据。
      en: Limit irrelevant principals' reads of sensitive collaboration, code, and business repositories and retain evidence
        from search to actual content access under the same identity.
  expected_effect:
    paragraphs:
    - zh: 缩小可被普通账户悄然取得的内容集合，同时提高跨库调查的对象归属可见度。
      en: Shrinks the content a routine account can quietly acquire and improves object-attribution visibility across repositories.
  limitations:
    paragraphs:
    - zh: 过度限制会妨碍协作；已授权用户仍可读取其职责内内容，缺少对象日志的产品仍有盲区。
      en: Excessive restriction impairs collaboration; authorized users can still read in-duty content, and products without
        object-level logs retain gaps.
- target_ref: NJS-0143-001
  use:
    paragraphs:
    - zh: 为高敏对象维持精确访问组与标签，启用查询和成功内容读取事件，并按业务职责复核小量高敏命中，而不是仅设下载量阈值。
      en: Maintain precise access groups and labels for high-sensitivity objects, enable query and successful-read events,
        and review small sensitive hit sets against business duty rather than relying only on download-volume thresholds.
  expected_effect:
    paragraphs:
    - zh: 降低关键词筛选可命中的非职责内容，保留低量取用的上下文链，使攻击者必须扩大权限或暴露更多查询。
      en: Reduces out-of-duty content reachable by keyword filtering and preserves context for low-volume reads, forcing the
        actor to expand privileges or expose more queries.
  limitations:
    paragraphs:
    - zh: 合法调查与安全扫描仍会命中敏感内容；日志许可、页面访问缺项及未标记对象会削弱控制效果。
      en: Legitimate investigations and security scans still hit sensitive content; licensing, absent page-read logs, and
        unlabeled objects reduce effectiveness.
