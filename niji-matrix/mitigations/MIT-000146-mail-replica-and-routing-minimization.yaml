schema_version: 2.0.0
type: mitigation
id: MIT-000146
name:
  zh: 邮件副本与自动分流的最小化治理
  en: Mail Replica and Automatic Routing Minimization
summary:
  zh: 约束既存邮件副本与条件自动转发两种可被滥用的内容取得路径。
  en: Constrain preexisting mail replicas and conditional auto-forwarding as distinct paths to mailbox content.
description:
  paragraphs:
  - zh: 高敏邮箱的缓存范围、允许设备和端点副本需要和业务离线需求匹配；自动转发规则需按邮箱、匹配谓词、目的地和期限审批。服务器逐封访问、规则变更、转发结果与端点副本读取分别留存，避免把某一平面无事件误作无收集。措施不能直接撤回已被复制的邮件。
    en: Cache scope, allowed devices, and endpoint replicas for sensitive mailboxes should match real offline needs; auto-forward
      rules need approval by mailbox, predicate, destination, and duration. Retain server per-item access, rule changes, forwarding
      outcomes, and endpoint replica reads separately so silence on one plane is not mistaken for absence of collection. The
      measures cannot retract mail already copied.
domains:
- enterprise
measures:
- key: managed-mail-replica
  name:
    zh: 受管邮件副本范围
    en: Managed Mail Replica Scope
  description:
    paragraphs:
    - zh: 对高敏邮箱按业务需要限制离线同步窗口、共享邮箱下载和非受管设备访问；对保留副本的终端启用磁盘加密、文件访问遥测及退役清理。
      en: For sensitive mailboxes, limit offline sync windows, shared-mailbox downloads, and unmanaged-device access according
        to business need; encrypt, audit, and clean up endpoints that retain replicas.
  control_type: preventive
- key: automatic-routing-governance
  name:
    zh: 自动邮件分流治理
    en: Automatic Mail Routing Governance
  description:
    paragraphs:
    - zh: 默认限制外部自动转发，对经批准的目的域、邮箱和规则设置期限；保存规则变更及实际转发报告，定期复核内部转发链。
      en: Restrict external auto-forwarding by default, time-bound approved domains, mailboxes, and rules, preserve rule-change
        and actual-forward reports, and review internal forwarding paths.
  control_type: preventive
applications:
- target_ref: NJT-0144
  use:
    paragraphs:
    - zh: 对高敏邮箱同时限定可保留的端点副本和允许的自动转发目的地，保留服务器与端点的读取、规则和消息结果记录。
      en: For sensitive mailboxes, constrain retained endpoint replicas and allowed auto-forward destinations while keeping
        server and endpoint read, rule, and message-outcome records.
  expected_effect:
    paragraphs:
    - zh: 攻击者可继承的历史邮件集合和能自动生成的新副本范围缩小，跨平面调查有可连接的证据。
      en: The historical mail an actor can inherit and new copies a rule can generate both shrink, with joinable evidence
        for cross-plane investigation.
  limitations:
    paragraphs:
    - zh: 离线办公、合规日记与迁移需例外；已控制的受管端点或获批收件人仍可能被滥用。
      en: Offline work, journaling, and migration need exceptions; a compromised managed endpoint or approved recipient may
        still be abused.
- target_ref: NJS-0144-001
  use:
    paragraphs:
    - zh: 将高敏邮箱的离线同步期限和设备限定到有业务需要的范围，盘点既存 PST/缓存并审计非预期进程读取。
      en: Limit offline sync duration and devices for sensitive mailboxes to business need, inventory existing PST or caches,
        and audit unexpected process reads.
  expected_effect:
    paragraphs:
    - zh: 可离线二次读取的历史邮件范围下降，端点副本接触更容易归因到设备和进程。
      en: The historical mail available for offline rereading shrinks, and replica access becomes easier to attribute to device
        and process.
  limitations:
    paragraphs:
    - zh: 既有副本不会因策略更新立刻消失，合法迁移或 eDiscovery 也会读取相同文件。
      en: Existing copies do not disappear immediately after policy changes, and authorized migration or eDiscovery reads
        the same files.
- target_ref: NJS-0144-002
  use:
    paragraphs:
    - zh: 对新增的条件自动转发要求具体邮箱、谓词、目的地、批准人和有效期，并把规则变更同实际自动转发报告核对。
      en: Require mailbox, predicate, destination, approver, and expiry for new conditional auto-forwarding, then compare
        rule changes with actual forwarding reports.
  expected_effect:
    paragraphs:
    - zh: 非批准外部分流被阻断或留下策略拒绝结果，内部异常目的地也更容易偏离批准清单。
      en: Unapproved external diversion is blocked or leaves policy-denial evidence, while anomalous internal recipients depart
        from the approved register.
  limitations:
    paragraphs:
    - zh: 被盗获批账户和受控内部收件人仍可取得邮件；外部转发禁令不能替代匹配消息的结果核验。
      en: A stolen approved account or controlled internal recipient can still receive mail; external-forward blocking does
        not replace matched-message outcome checks.
