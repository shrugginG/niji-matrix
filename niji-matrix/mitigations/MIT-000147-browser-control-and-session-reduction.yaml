schema_version: 2.0.0
type: mitigation
id: MIT-000147
name:
  zh: 浏览器控制面与活动会话收敛
  en: Browser Control-Plane and Active-Session Reduction
summary:
  zh: 限制对浏览器执行上下文的控制，并缩短已认证内容可被借用的窗口。
  en: Constrain control over browser execution contexts and shorten the window in which authenticated content can be borrowed.
description:
  paragraphs:
  - zh: 对敏感站点治理扩展来源、主机和调试权限，限制普通账户写入浏览器进程，并对高价值应用采用合理会话到期和设备复核。措施分别提高同页中介与代理借用的成本；既有受信扩展失陷和正常远程支持必须依具体身份、版本与任务审查，不能只按浏览器名称允许。
    en: Govern extension origin, host, and debugger permissions for sensitive sites, reduce ordinary-account write access
      to browsers, and apply reasonable expiry and device checks to high-value sessions. These controls raise the cost of
      both co-viewed interposition and proxy borrowing. Compromise of an approved extension and legitimate remote support
      require identity, version, and task-specific review rather than a browser-name allow rule.
domains:
- enterprise
measures:
- key: extension-policy
  name:
    zh: 敏感站点扩展权限治理
    en: Sensitive-Site Extension Permission Governance
  description:
    paragraphs:
    - zh: 对敏感站点执行扩展安装来源、主机权限和 debugger 权限策略，维持带版本的批准清单与持续盘点。
      en: Enforce extension install-origin, host-permission, and debugger-permission policy for sensitive sites, with a versioned
        allowlist and continuous inventory.
  control_type: preventive
- key: process-protection
  name:
    zh: 浏览器进程写入权限限制
    en: Browser-Process Write Permission Reduction
  description:
    paragraphs:
    - zh: 限制普通账户调试与写入浏览器进程的权限，并对进程访问及远程线程进行审计。
      en: Restrict ordinary accounts' debugging and write access to browser processes, and audit process access and remote
        threads.
  control_type: cost-increasing
- key: session-lifecycle
  name:
    zh: 高价值会话寿命控制
    en: High-Value Session Lifetime Control
  description:
    paragraphs:
    - zh: 对高价值应用设置合理的不活动超时、会话撤销和设备状态复核，避免浏览器关闭后状态长期可复用。
      en: Set reasonable idle timeouts, session revocation, and device-state checks for high-value apps so browser state is
        not reusable indefinitely.
  control_type: exposure-reduction
applications:
- target_ref: NJT-0145
  use:
    paragraphs:
    - zh: 将浏览器控制权限与高价值会话有效期共同收敛，减少可被中介的已认证内容窗口。
      en: Reduce both browser-control permission and the lifetime of high-value authenticated content windows.
  expected_effect:
    paragraphs:
    - zh: 提高中介部署成本并缩短已认证内容可读时间。
      en: Raise interposition cost and shorten the period in which authenticated content is readable.
  limitations:
    paragraphs:
    - zh: 合法扩展和远程支持需要精细批准；会话超时不能移除已植入的浏览器控制点。
      en: Legitimate extensions and remote support need precise approval; session timeout does not remove an implanted browser
        control point.
- target_ref: NJS-0145-001
  use:
    paragraphs:
    - zh: 限制扩展对敏感域的读取/改写权限并复核版本变更，保留端点浏览器外连监测。
      en: Restrict extensions' read and modify permissions on sensitive domains, review version changes, and retain browser
        egress monitoring.
  expected_effect:
    paragraphs:
    - zh: 压缩同页读取入口，且使新增权限和外连更可辨。
      en: Narrow co-viewed read entry points and make new permissions and egress more distinguishable.
  limitations:
    paragraphs:
    - zh: 获批准扩展被攻陷或进程内 hook 可绕开单纯扩展策略；严禁一刀切破坏无障碍与密码管理功能。
      en: Compromised approved extensions or in-process hooks can bypass extension-only policy; blanket blocking can harm
        accessibility and password management.
- target_ref: NJS-0145-002
  use:
    paragraphs:
    - zh: 限制对浏览器进程的写入与调试，监控远端代理链路，并使高价值站点在关键资源读取时复核设备或会话状态。
      en: Restrict write and debug access to browser processes, monitor remote relay links, and have high-value sites recheck
        device or session state for sensitive resource reads.
  expected_effect:
    paragraphs:
    - zh: 增加建立代理的门槛并削弱长期无交互借用会话的机会。
      en: Increase the barrier to relay setup and reduce opportunities for long unattended session borrowing.
  limitations:
    paragraphs:
    - zh: 控制了受信端点的攻击者仍可使用其真实会话；过短超时或频繁复核会影响业务操作。
      en: An actor controlling a trusted endpoint may still use its real session; aggressive timeouts or rechecks can disrupt
        work.
