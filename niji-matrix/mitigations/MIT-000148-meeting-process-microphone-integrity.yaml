schema_version: 2.0.0
type: mitigation
id: MIT-000148
name:
  zh: 会议进程完整性与麦克风使用治理
  en: Meeting-Process Integrity and Microphone-Use Governance
summary:
  zh: 限制未批准录音模块进入会议进程，并把麦克风活动与真实模块及结果关联。
  en: Constrain unapproved recorder modules in meeting processes and join microphone activity to real module and output.
description:
  paragraphs:
  - zh: 会议客户端、插件和麦克风权限应经受管渠道批准，并留存能实际取得的音频设备会话与模块谱系。对正常会议进程中的新模块、非会议时段录音和异常产物按业务批准单核查；进程签名或授权提示只证明表层身份，不替代录音目的判断。
    en: Approve meeting clients, plug-ins, and microphone permissions through managed channels and retain audio-device sessions
      and module lineage where actually available. Compare new modules, out-of-meeting recording, and unusual outputs in normal
      meeting processes with business approvals. Process signing or a permission prompt proves surface identity, not recording
      purpose.
domains:
- enterprise
measures:
- key: approved-audio-processes
  name:
    zh: 受管会议进程与麦克风授权
    en: Managed Meeting Process and Microphone Grants
  description:
    paragraphs:
    - zh: 受管部署会议客户端与扩展，阻止未批准模块注入或加载，并在支持的平台上按应用执行麦克风权限策略。
      en: Deploy meeting clients and extensions through managed channels, block unapproved module injection or loading, and
        enforce per-app microphone policies where supported.
  control_type: preventive
- key: audio-activity-review
  name:
    zh: 音频活动与模块复核
    en: Audio Activity and Module Review
  description:
    paragraphs:
    - zh: 保留可用的麦克风使用记录，结合进程、模块、会议时段和录音目的地复核，不把正常客户端名称视为全面豁免。
      en: Retain available microphone-use records and review them against process, module, meeting time, and recording destination
        without exempting an entire normal client name.
  control_type: detective-support
applications:
- target_ref: NJT-0146
  use:
    paragraphs:
    - zh: 对处理敏感语音的工作站建立最小必要麦克风使用名单和受管录音流程；设备被启用时复核实际应用与业务目的。
      en: On workstations handling sensitive speech, maintain a least-necessary microphone-use inventory and managed recording
        workflow; review the actual app and business purpose when audio input activates.
  expected_effect:
    paragraphs:
    - zh: 降低未授权录音入口并提高后续音频活动的可解释性。
      en: Reduce unauthorized recording entry points and improve interpretability of later audio activity.
  limitations:
    paragraphs:
    - zh: 系统级麦克风禁止会影响合法会议；权限允许不能证明每次录音都获批准，传统桌面应用的控制能力随平台版本和策略范围而异。
      en: Disabling microphones at the system level disrupts legitimate meetings. A permission grant does not authorize every
        recording, and controls for classic desktop apps vary by platform version and policy scope.
- target_ref: NJS-0146-001
  use:
    paragraphs:
    - zh: 对会议客户端实行模块签名与扩展目录约束，对新出现的模块、注入和非会议时段麦克风活动触发复核。
      en: Constrain meeting-client modules by signer and extension directory; review newly observed modules, injection, and
        microphone use outside meeting periods.
  expected_effect:
    paragraphs:
    - zh: 提高恶意录音模块进入正常会议进程的成本，并保留可供归因的模块谱系。
      en: Raise the cost of placing a recorder in a normal meeting process and retain module lineage for attribution.
  limitations:
    paragraphs:
    - zh: 经批准的插件仍可能被攻陷，内存映射代码可能避开普通模块日志；不能仅靠代码签名判断录音目的。
      en: Approved plugins can be compromised and memory-mapped code may evade ordinary module logs; code signing alone cannot
        establish recording purpose.
