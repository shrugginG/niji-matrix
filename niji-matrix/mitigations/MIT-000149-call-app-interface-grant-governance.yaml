schema_version: 2.0.0
type: mitigation
id: MIT-000149
name:
  zh: 通话应用第三方接口授权治理
  en: Governance of Third-Party Call-App Interface Grants
summary:
  zh: 审批第三方通话音视频媒体接口，并把授权与录制结果连接。
  en: Approve third-party call audio/video media interfaces and join grants to recording outcomes.
description:
  paragraphs:
  - zh: 对提供音频或视频媒体接口的受管通话应用，按请求组件、用户、会话、模态和有效期限制第三方授权，并保存授予及撤销记录。通话时段、音频和视频产物均与授权链比较；不提供接口审计的产品须退回端点应用控制，旧 Skype API 名称不能当作现行通用字段。
    en: For managed call apps with audio or video media interfaces, constrain third-party grants by requester, user, session,
      modality, and duration, retaining grant and revocation records. Compare call intervals and audio or video output to
      the grant chain. Products without interface audit require endpoint application control, and old Skype API names are
      not universal modern fields.
domains:
- enterprise
measures:
- key: approved-call-integrations
  name:
    zh: 批准通话媒体集成
    en: Approved Call-Media Integrations
  description:
    paragraphs:
    - zh: 禁止或审批未经管理的通话媒体接口集成，要求明确显示请求组件身份、权限范围、有效期及负责业务人。
      en: Block or approve unmanaged call-media integrations and display requester identity, permission scope, expiry, and
        business owner clearly.
  control_type: preventive
- key: grant-and-artifact-review
  name:
    zh: 接口授权与录音结果复核
    en: Interface Grant and Recording Outcome Review
  description:
    paragraphs:
    - zh: 审核首次及长期第三方授权，将授权、通话时段、录音产物和批准记录相连。
      en: Review first-time and durable third-party grants and join grants, call intervals, recording artifacts, and approvals.
  control_type: detective-support
applications:
- target_ref: NJT-0146
  use:
    paragraphs:
    - zh: 对受管通话软件建立可取得音频的接口清单，默认只允许经审查的录音、转写或辅助功能集成。
      en: Inventory audio-capable interfaces in managed call software and allow only reviewed recording, transcription, or
        accessibility integrations by default.
  expected_effect:
    paragraphs:
    - zh: 减少把正常通话语境作为偷录入口的机会，并使异常授权可被追溯。
      en: Reduce opportunities to turn normal calls into recording entry points and make anomalous grants traceable.
  limitations:
    paragraphs:
    - zh: 应用若不提供接口治理或审计，只能依赖终端应用控制；此措施不阻止独立麦克风录音。
      en: If the app lacks interface governance or audit, only endpoint application control remains; this measure does not
        stop separate microphone recording.
- target_ref: NJT-0159
  use:
    paragraphs:
    - zh: 对受管会议产品列出能读取视频媒体或调取相机的第三方集成，默认阻断无业务所有人和会话范围的授权。
      en: Inventory integrations able to read video media or invoke cameras in managed meeting products and block grants without
        a business owner and session scope by default.
  expected_effect:
    paragraphs:
    - zh: 降低正常会议应用成为隐蔽视觉采集入口的机会，并为后续帧产物提供可核查的授权链。
      en: Reduce opportunities for a meeting app to become a disguised visual-acquisition entry point and leave an auditable
        grant chain for later frame output.
  limitations:
    paragraphs:
    - zh: 旧 Skype 案例不能证明当前产品能细粒度限制视频接口；独立恶意摄像头读取不依赖通话接口，需另设设备访问控制。
      en: The old Skype case does not show that current products can scope video interfaces finely; independent malicious
        camera reading does not depend on a call interface and needs device-access controls.
- target_ref: NJS-0159-001
  use:
    paragraphs:
    - zh: 将视频会议媒体读取权限限制于经审查的录制集成，授权提示清楚展示第三方请求者，并按会议及有效期复核长期授权。
      en: Limit video-call media reads to reviewed recording integrations, display the third-party requester clearly in the
        grant flow, and review durable grants by meeting and expiry.
  expected_effect:
    paragraphs:
    - zh: 减少 T9000 式误判正常进程后授予第三方取帧权限的机会，使请求者和会话可追溯。
      en: Reduce opportunities for a T9000-like requester to obtain frame access through confusion over a normal process and
        make requester and session traceable.
  limitations:
    paragraphs:
    - zh: 用户可仍批准恶意请求；不导出接口授权审计的产品无法仅靠该措施证明后续取帧，必须结合产物调查。
      en: Users may still approve a malicious request; a product without grant audit cannot prove later frame extraction through
        this measure alone and needs artifact investigation.
evidence_refs:
- REF-000584
- REF-000672
