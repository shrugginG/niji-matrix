schema_version: 2.0.0
type: mitigation
id: MIT-000150
name:
  zh: C2 服务出口与内容契约约束
  en: C2 Service Egress and Content-Contract Controls
summary:
  zh: 将软件外联绑定获准服务，校验可见消息结构并保留控制语义恢复证据。
  en: Bind software egress to approved services, validate visible message structure, and retain evidence needed
    to recover control semantics.
description:
  paragraphs:
  - zh: 措施在出口代理和端点两侧实施：管理软件按版本、签名、目的地主体及证书限制外联；内容检查在合法可见范围内校验格式与字段关系，保留必要的原件和解析状态。这样可减少伪装服务可借用的出口，并使可丢弃字段或异常载体被明确记录。
    en: 'Apply controls at both egress proxy and endpoint: constrain management software outbound traffic by version,
      signature, destination owner, and certificate; where content is lawfully visible, validate format and field
      relationships and retain necessary originals and parse status. This reduces the egress a forged service can
      borrow and records inert fields or anomalous carriers explicitly.'
domains:
- enterprise
measures:
- key: product-egress-binding
  name:
    zh: 产品出口身份绑定
    en: Product Egress Identity Binding
  description:
    paragraphs:
    - zh: 将进程/签名及软件版本绑定获准域名、证书和代理身份，拒绝未知服务目的地并记录拒绝结果。
      en: Bind process or signature and software version to approved domains, certificates, and proxy identity;
        reject unknown service destinations and log denials.
  control_type: preventive
- key: structured-message-validation
  name:
    zh: 结构化消息校验
    en: Structured Message Validation
  description:
    paragraphs:
    - zh: 对可见 HTTP、邮件与媒体对象校验声明长度、字段依赖、解析结果和附件谱系，隔离无法解释的高风险差分。
      en: Validate declared length, field dependencies, parse outcome, and attachment lineage for visible HTTP,
        mail, and media objects; isolate high-risk unexplained differences.
  control_type: detective-support
applications:
- target_ref: NJT-0152
  use:
    paragraphs:
    - zh: 对具有 C2 风险的进程统一限制批准服务目的地，并将请求响应、内容解析与进程结果关联。
      en: Constrain approved service destinations for C2-capable processes and join request-response, content parsing,
        and process results.
  expected_effect:
    paragraphs:
    - zh: 减少恶意控制交换仅凭协议或可信进程外观进入允许流量的机会。
      en: Reduce the chance that a malicious control exchange is allowed solely for its protocol or trusted-process
        appearance.
  limitations:
    paragraphs:
    - zh: 合法遥测更新与 CDN 变化需版本化例外；被攻陷的批准端点仍需行为检测。
      en: Legitimate telemetry updates and CDN changes need versioned exceptions; a compromised approved endpoint
        still needs behavior detection.
- target_ref: NJS-0152-001
  use:
    paragraphs:
    - zh: 对允许格式设声明长度和无效字段约束，保留异常消息的原始帧及解析长度。
      en: Constrain declared lengths and inert fields in allowed formats and retain raw frames plus decoded lengths
        for anomalies.
  expected_effect:
    paragraphs:
    - zh: 压缩可用于稀释有效控制字节的空间，并为规范化比较保留证据。
      en: Limit space for diluting effective control bytes and retain evidence for normalized comparison.
  limitations:
    paragraphs:
    - zh: 合法可选字段和大遥测对象可能相似；严格尺寸上界可能干扰业务。
      en: Legitimate optional fields and large telemetry objects may look similar; strict size bounds may disrupt
        business.
- target_ref: NJS-0152-002
  use:
    paragraphs:
    - zh: 将产品遥测进程绑定到批准服务主体及版本化请求 schema，违约时隔离并保留响应后动作。
      en: Bind product telemetry processes to approved service owners and versioned request schemas; isolate violations
        and retain post-response actions.
  expected_effect:
    paragraphs:
    - zh: 伪造 OIP 式会话必须同时满足独立的出口和消息契约。
      en: An OIP-like forged conversation must satisfy independent egress and message contracts.
  limitations:
    paragraphs:
    - zh: 供应商代理与合法受信进程被植入可降低精度，内容不可见时无法验证字段契约。
      en: Vendor proxies and implanted trusted processes reduce precision; opaque content prevents field-contract
        validation.
