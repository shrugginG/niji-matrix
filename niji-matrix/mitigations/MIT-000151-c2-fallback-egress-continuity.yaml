schema_version: 2.0.0
type: mitigation
id: MIT-000151
name:
  zh: 备用 C2 出口与处置连续性
  en: Fallback C2 Egress and Response Continuity
summary:
  zh: 以同一设备和进程谱系统一约束主、备通信路径并保留失败触发证据。
  en: Govern primary and reserve communication paths by device and process lineage while retaining failure-trigger
    evidence.
description:
  paragraphs:
  - zh: 把受管解析器、Web 代理、端点网络策略与事件响应放在同一出站控制面。按软件身份限制可访问的协议和目的地；发现 C2 时，连同失败连接、备用端点、DNS 查询及控制结果共同处置。成功会话之外还保留被阻断和超时记录，否则无法证明切换条件。
    en: Place managed resolver, web proxy, endpoint network policy, and incident response in one outbound control
      model. Restrict permitted protocols and destinations by software identity; on C2 discovery, address failed
      connections, reserve endpoints, DNS queries, and control outcomes together. Retain denied and timed-out traffic
      as well as successful sessions or the switch condition cannot be established.
domains:
- enterprise
measures:
- key: workload-bound-egress
  name:
    zh: 按工作负载绑定出口
    en: Workload-Bound Egress
  description:
    paragraphs:
    - zh: 按软件或设备角色限定 Web 代理、受管 DNS、目的地集合及端点网络规则，并审计例外与失败结果。
      en: Limit web proxy, managed DNS, destination set, and endpoint network rules by software or device role;
        audit exceptions and failed outcomes.
  control_type: preventive
- key: incident-path-continuity
  name:
    zh: 事件处置路径连续性
    en: Incident Path Continuity
  description:
    paragraphs:
    - zh: 封锁已知 C2 后以同一进程和设备搜索新端点、新协议与回连结果，隔离仍有控制结果的路径。
      en: After blocking known C2, search new endpoints, protocols, and callback outcomes on the same process and
        device and isolate paths that still carry control.
  control_type: containment
- key: blocked-path-retention
  name:
    zh: 阻断与失败路径保留
    en: Blocked and Failed Path Retention
  description:
    paragraphs:
    - zh: 集中保留代理拒绝、连接超时、DNS 查询和端点进程键，覆盖正常回连间隔。
      en: Centrally retain proxy denials, connection timeouts, DNS queries, and endpoint process keys across ordinary
        callback intervals.
  control_type: detective-support
applications:
- target_ref: NJT-0153
  use:
    paragraphs:
    - zh: 把同一植入的主通道和备用通道作为一个出站与处置对象，联查失败触发及后继控制。
      en: Treat primary and reserve channels of one implant as one egress and response object, joining failure triggers
        to continued control.
  expected_effect:
    paragraphs:
    - zh: 减少通过切换路径恢复 C2 的机会，并使两个日志面的断点可被调查。
      en: Reduce opportunities to restore C2 by switching paths and make breaks across two log surfaces investigable.
  limitations:
    paragraphs:
    - zh: 未知备用端点不能预先按 IOC 封锁；合法 SaaS 多路径需细粒度授权。
      en: Unknown reserve endpoints cannot be preblocked by IOC; legitimate multipath SaaS needs narrow authorization.
- target_ref: NJS-0153-001
  use:
    paragraphs:
    - zh: 封锁首选 C2 时按设备/进程同步检查首次出现的同协议端点，必要时隔离进程而非只加旧域名规则。
      en: When blocking preferred C2, inspect first-seen same-transport endpoints for that device and process and
        isolate the process when needed rather than adding only an old-domain rule.
  expected_effect:
    paragraphs:
    - zh: 削弱攻击者通过第二硬编码端点恢复控制的收益，并保存端点迁移证据。
      en: Reduce benefit from restoring control via a second hardcoded endpoint and preserve endpoint migration
        evidence.
  limitations:
    paragraphs:
    - zh: 误隔离合法更新器会影响服务；受损进程和未知后备基础设施仍需人工确认。
      en: Incorrectly isolating a legitimate updater can disrupt service; compromised processes and unknown reserve
        infrastructure still need human review.
- target_ref: NJS-0153-002
  use:
    paragraphs:
    - zh: 同时约束 Web 出口与直接 DNS，Web C2 处置后在受管解析器和端点继续搜索同进程 DNS 控制。
      en: Constrain both web egress and direct DNS, and after web-C2 response search managed resolvers and endpoints
        for same-process DNS control.
  expected_effect:
    paragraphs:
    - zh: 减少从 HTTP 转为 DNS 绕过单一 Web 控制的机会，并保留换路前后事件。
      en: Reduce the opportunity to bypass a web-only control by moving from HTTP to DNS and preserve both sides
        of the handoff.
  limitations:
    paragraphs:
    - zh: DNS 是必需基础服务；DoH、外部解析器或缺失进程键会削弱覆盖。
      en: DNS is a necessary service; DoH, external resolvers, or a missing process key weakens coverage.
