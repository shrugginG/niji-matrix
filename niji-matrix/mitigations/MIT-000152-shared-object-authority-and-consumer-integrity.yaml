schema_version: 2.0.0
type: mitigation
id: MIT-000152
name:
  zh: 共享对象写权与消费完整性治理
  en: Shared-Object Authority and Consumer Integrity Governance
summary:
  zh: 限制共享对象的未批准改写，并在另一主机消费前验证内容与导航目标。
  en: Constrain unauthorized shared-object mutations and verify content and navigation targets before another host consumes
    them.
description:
  paragraphs:
  - zh: 该控制同时保护共享对象的写入前态和异机消费点。对关键文档、安装包及导航目录保存旧新版本、授权发布者、内容摘要和目标绑定，使安全团队能把原路径下的恶意内容变化与另一主机的首次结果相连。保留业务协作能力，但不把熟悉的文件名、目录图标、签名容器或受信位置视作本次改写的授权。
    en: This control protects both a shared object's prior state and its cross-host consumption point. Preserve old and new
      versions, authorized publishers, digests, and target bindings for critical documents, installers, and navigation directories
      so security teams can join malicious change under an original path to another host's first outcome. Keep legitimate
      collaboration available without treating a familiar filename, directory icon, signed container, or trusted location
      as authorization for this mutation.
measures:
- key: bounded-shared-write-authority
  name:
    zh: 限定共享内容写权
    en: Bound Shared-Content Write Authority
  description:
    paragraphs:
    - zh: 把高价值共享区的编辑者、发布窗口与目标对象限定到具名角色和变更单；分离文档日常编辑与可执行内容发布权限，并保留不可由同一编辑者删除的旧版本和摘要。
      en: Limit editors, release windows, and target objects in high-value shares to named roles and change records. Separate
        routine document editing from executable-content publishing, and retain prior versions and digests that the same editor
        cannot delete.
  control_type: preventive
- key: active-content-and-binding-check
  name:
    zh: 消费前检查活动内容与导航绑定
    en: Check Active Content and Navigation Binding Before Consumption
  description:
    paragraphs:
    - zh: 对原路径内容变化检查宏、远程模板、脚本入口和二进制签名或摘要差异；对目录入口核对可见名称、图标、实际目标命令和隐藏原目录。目标主机对未批准活动内容实施 Office、脚本或应用控制。
      en: Inspect changes under original paths for macros, remote templates, script entry points, and binary signing or digest
        differences. Compare a directory entry's visible name and icon with its actual target command and any hidden original.
        Enforce Office, script, or application control on unapproved active content at consuming hosts.
  control_type: preventive
- key: consumer-scope-recovery
  name:
    zh: 按版本恢复异机消费范围
    en: Recover Cross-Host Consumer Scope by Version
  description:
    paragraphs:
    - zh: 发现污染时冻结对应对象版本与导航入口，隔离恶意内容并查询哪些内部设备实际读取、打开和产生后继进程；通过批准版本恢复共享内容后再解除限制。
      en: On taint discovery, freeze the object version and navigation entry, isolate malicious content, and identify internal
        devices that actually read, opened, and launched successors from it. Restore an approved version before lifting controls.
  control_type: containment
applications:
- target_ref: NJT-0148
  use:
    paragraphs:
    - zh: 把共享对象变更审批、旧新版本留存和异机消费日志连成发布事务，要求调查明确写者、对象、目标设备及首个攻击者结果。
      en: Treat share mutation approval, retained versions, and cross-host consumption logs as one release transaction, requiring
        investigation to identify writer, object, destination device, and first attacker outcome.
  expected_effect:
    paragraphs:
    - zh: 恶意内容即使保留原路径也会与授权版本产生差异，已消费目标可以按同一版本枚举并处置。
      en: Malicious content retaining an original path still differs from an approved version, and affected consumers can
        be enumerated and remediated by version.
  limitations:
    paragraphs:
    - zh: 高频协作和内部受信位置可能缺精确版本、预览与真实打开的区别；无法解析活动内容时要保留不确定性并用目标进程补证。
      en: High-volume collaboration and internal trusted locations may lack exact versions or distinguish preview from real
        open. Retain uncertainty when active content cannot be parsed and corroborate with destination processes.
- target_ref: NJS-0148-001
  use:
    paragraphs:
    - zh: 针对既有对象原位污染，锁定旧新摘要、嵌入宏或模板引用与授权编辑者，并在另一设备打开前检查其活动内容。
      en: For in-place taint of an established object, bind old and new digests, embedded macro or template references, and
        approved editor, then inspect active content before another device opens it.
  expected_effect:
    paragraphs:
    - zh: 原文件名和路径不再足以让被替换文档或安装包自动继承信任；同一版本的消费者能被准确回查。
      en: Original name and path no longer confer automatic trust on a replaced document or installer, and consumers of one
        version can be traced accurately.
  limitations:
    paragraphs:
    - zh: 恶意逻辑可位于合法签名容器或运行时远程模板中；内容扫描需要联网响应和解析能力，业务宏例外须绑定版本和期限。
      en: Malicious logic may sit inside a legitimately signed container or a runtime remote template. Content scanning needs
        response access and parsers, while business macro exceptions must bind a version and expiry.
- target_ref: NJS-0148-002
  use:
    paragraphs:
    - zh: 针对导航替身，比较目录项可见名称和图标与真实文件类型、快捷方式目标、隐藏原目录及受害主机点击后的命令链，阻止非管理员在高价值共享目录创建同名替身。
      en: For navigation substitution, compare visible name and icon with actual entry type, shortcut target, hidden original
        directory, and the consumer's post-click command chain. Block non-administrators from creating same-name substitutes
        in high-value shares.
  expected_effect:
    paragraphs:
    - zh: 攻击者不能仅靠目录外观和后续正常 Explorer 视图掩盖额外命令，异常绑定可在多台用户触发前被阻断。
      en: The attacker cannot rely only on directory appearance and a later normal Explorer view to conceal the extra command;
        anomalous bindings can be blocked before many users trigger them.
  limitations:
    paragraphs:
    - zh: 合法 DFS、快捷方式和目录迁移也会改变导航绑定；缺少目标端进程谱系时只能确认替身存在，不能证明其被打开并执行。
      en: Legitimate DFS, shortcuts, and directory migrations also change navigation bindings. Without destination process
        lineage, only substitute presence can be confirmed, not open and execution.
