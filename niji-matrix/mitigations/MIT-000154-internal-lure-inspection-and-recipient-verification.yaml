schema_version: 2.0.0
type: mitigation
id: MIT-000154
name:
  zh: 内部诱导消息检查与收件者独立核验
  en: Internal Lure Inspection and Independent Recipient Verification
summary:
  zh: 对组织内消息执行内容检查和高风险动作独立核验，阻止受陷账户把信任继续传给下一主体。
  en: Inspect intra-organization messages and independently verify high-risk recipient actions so a compromised account cannot
    carry trust to another principal.
description:
  paragraphs:
  - zh: 该控制处理“真实内部发件身份仍可作恶”的问题。内部邮件和协作消息应接受与外部诱导相称的链接、附件和身份风险检查，并在敏感凭据、远程协助或付款请求处设置独立确认路径；事件响应同时保留发件会话、收件范围和点击或附件结果。邮箱账户和规则完整性由
      MIT-000036 补充，消息本身及收件动作由本对象控制。
    en: This control addresses malicious use of a genuine internal sender. Intra-organization mail and collaboration messages
      receive link, attachment, and identity-risk inspection commensurate with external lures, while sensitive credential,
      remote-assistance, or payment requests require independent confirmation. Response retains sender sessions, recipient
      scope, and click or attachment outcomes. MIT-000036 complements mailbox account and rule integrity, while this object
      controls the message and recipient action.
measures:
- key: inspect-internal-message-content
  name:
    zh: 检查内部链接与附件
    en: Inspect Internal Links and Attachments
  description:
    paragraphs:
    - zh: 对组织内流转的消息仍运行 URL、附件和异常发件会话检查，保留 NetworkMessageId、发件与收件身份、内容摘要及投递状态，不能因同域身份自动免检。
      en: Run URL, attachment, and anomalous-sender-session checks on internal messages, retaining NetworkMessageId, sender
        and recipient identities, content digest, and delivery state without automatically trusting same-domain mail.
  control_type: preventive
- key: independent-high-risk-action-verification
  name:
    zh: 高风险动作独立核验
    en: Independently Verify High-Risk Actions
  description:
    paragraphs:
    - zh: 当内部消息要求重新认证、启用宏、安装远控或处理敏感流程时，收件者通过既有可信渠道联系真实发件人或业务 owner，核验当前请求与操作目标。
      en: When an internal message requests reauthentication, macro enablement, remote-control installation, or a sensitive
        workflow, recipients confirm the current request and target through an existing trusted channel with the real sender
        or business owner.
  control_type: cost-increasing
- key: trace-and-contain-recipient-fanout
  name:
    zh: 追踪并处置收件扩散
    en: Trace and Contain Recipient Fan-Out
  description:
    paragraphs:
    - zh: 发现受陷发件账户时撤销其会话、冻结继续投递，按消息标识查找所有内部收件者及后续动作，并对已出现第二账户异常的主体优先处置。
      en: When a sender compromise is found, revoke sessions, stop further delivery, identify all internal recipients and
        subsequent actions by message ID, and prioritize principals with signs of second-account compromise.
  control_type: containment
applications:
- target_ref: NJT-0150
  use:
    paragraphs:
    - zh: 对内部定向钓鱼把已证受陷发送者、消息内容、受害收件者动作与第二账户结果绑定。高风险请求通过独立渠道复核；发现连锁失陷时按同一发件会话和消息批次处置全部目标。
      en: For Internal Spearphishing, join a confirmed compromised sender to message content, recipient action, and second-account
        outcome. Verify high-risk requests through an independent channel and, on chained compromise, respond to every target
        in the same sender session and message batch.
  expected_effect:
    paragraphs:
    - zh: 内部发件身份不再自动绕过内容与操作核验，第二账户失陷前的点击或附件打开可触发有范围的阻断与告警。
      en: An internal sending identity no longer bypasses content and action checks; clicks or attachment opens can trigger
        scoped blocking and alerts before a second account is lost.
  limitations:
    paragraphs:
    - zh: 获批安全演练、真实协作和帮助台流程会产生相似消息；未知协作平台、无链接点击遥测或第二账户调查未完成时，不能以投递数替代横向成功判断。
      en: Approved simulations, genuine collaboration, and help-desk workflows create similar messages. Unlogged collaboration
        platforms, absent click telemetry, or unfinished second-account investigation prevent delivery count from substituting
        for lateral success.
