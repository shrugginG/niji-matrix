schema_version: 2.0.0
type: mitigation
id: MIT-000157
name:
  zh: 受管外传路径与周期作业授权
  en: Managed Egress Paths and Periodic Job Authorization
summary:
  zh: 要求周期性外传具有批准的主体、目的地和作业身份，并在异常释放前撤销例外。
  en: Require periodic outbound transfers to have approved principals, destinations and job identities, and revoke
    exceptions before an anomalous release.
description:
  paragraphs:
  - zh: 对敏感网段与服务器采用默认拒绝、按例外允许的外联策略，同时登记合法批处理的源数据、责任人、发起进程、目标和周期。周期本身不是合法性的证明；当未授权目的地或作业在一次释放后暴露，应在下一周期前暂停出站并保全待发区与连接证据。该控制直接作用于传输权限与重复释放机会，不依赖固定办公时段。
    en: Use default-deny, exception-allow egress for sensitive segments and servers while registering legitimate
      batch jobs by source data, owner, initiating process, destination and cadence. Recurrence itself does not
      prove authorization. When an unauthorized destination or job is identified after one release, hold egress
      before the next cycle and preserve pending-area and connection evidence. The control acts on transfer authority
      and recurrent opportunities without assuming any fixed office hours.
domains:
- enterprise
measures:
- key: managed-egress
  name:
    zh: 按例外允许的受管出口
    en: Exception-Approved Managed Egress
  description:
    paragraphs:
    - zh: 按主体、目的地和协议批准敏感资产出站，记录拒绝和例外。
      en: Approve outbound paths from sensitive assets by principal, destination and protocol, retaining denials
        and exceptions.
  control_type: preventive
- key: transfer-inventory
  name:
    zh: 周期传输作业登记
    en: Periodic Transfer-Job Inventory
  description:
    paragraphs:
    - zh: 登记合法批处理的所有者、源数据、目标、进程、周期和变更审批，并复核长期未用作业。
      en: Record owner, source data, destination, process, cadence and change approval for legitimate batch jobs,
        reviewing dormant jobs.
  control_type: governance
- key: hold-unapproved-release
  name:
    zh: 暂停未授权下一次释放
    en: Hold the Next Unauthorized Release
  description:
    paragraphs:
    - zh: 确认未授权周期出站后撤销相关出口例外，并在下次释放前保存队列、进程和流量证据。
      en: After confirming unauthorized recurrent egress, revoke the relevant exception and preserve queue, process
        and flow evidence before the next release.
  control_type: containment
applications:
- target_ref: NJT-0155
  use:
    paragraphs:
    - zh: 将周期传输与登记作业的源数据、进程、主体和目标比对，未登记路径不得因时间规律而放行。
      en: Compare recurrent transfers with registered source data, process, principal and destination; a regular
        schedule does not authorize an unregistered path.
  expected_effect:
    paragraphs:
    - zh: 时刻改变不能绕过目的地和主体约束，异常重复发送可在后续周期受阻。
      en: Changing timing cannot bypass destination and principal controls, and anomalous repeats can be blocked
        in later cycles.
  limitations:
    paragraphs:
    - zh: 被盗的批准身份或目标仍可外送，且第一次释放可能在关联前已完成。
      en: A stolen approved identity or destination may still send data, and the first release may precede correlation.
- target_ref: NJS-0155-001
  use:
    paragraphs:
    - zh: 把积压后批量外联与批准作业的源、目的地和进程对照，对不匹配的待发区先保全再暂停下一释放。
      en: Compare queue-draining egress with approved job sources, destinations and processes; preserve the mismatching
        pending area before holding the next release.
  expected_effect:
    paragraphs:
    - zh: 缩短跨多个周期持续外传的机会，并留下队列到外联的调查谱系。
      en: Shorten continued exfiltration across cycles and preserve a queue-to-egress investigation lineage.
  limitations:
    paragraphs:
    - zh: 内存队列、获批工具滥用及已完成的首次发送仍需额外源侧和身份审查。
      en: In-memory queues, abuse of an approved tool and a completed first send still need source-side and identity
        review.
