schema_version: 2.0.0
type: mitigation
id: MIT-000160
name:
  zh: 屏幕采集主体与输出路径治理
  en: Govern Screen-Capture Actors and Output Paths
summary:
  zh: 以批准主体、图形访问面和图像输出路径减少未经授权的屏幕像素获取机会，并保留可核验的结果链。
  en: Use approved actors, graphics-access surfaces, and image-output paths to reduce unauthorized acquisition of screen pixels
    and retain a verifiable outcome chain.
description:
  paragraphs:
  - zh: 在有人机交互的高价值终端上，组织应盘点远程支持、会议共享、无障碍、截图与自动化工具的签名、负责人、会话范围和输出位置，并限制未知组件进入这些进程或写入业务收集目录。macOS 的按应用屏幕录制授权可作平台特定控制，Windows.Graphics.Capture
      的选择器和边框只约束采用该接口的程序；控制方案不能假定所有截屏路径都有统一许可开关。
    en: On high-value interactive endpoints, inventory the signatures, owners, session scopes, and output locations of remote
      support, meeting sharing, accessibility, screenshot, and automation tools, and constrain unknown components entering
      those processes or writing to business collection paths. macOS app-level screen-recording grants offer a platform-specific
      control, while Windows.Graphics.Capture's picker and border apply only to programs using that API. The control cannot
      assume a universal permission switch for all capture paths.
domains:
- enterprise
measures:
- key: approved-capture-actors
  name:
    zh: 登记截图与共享屏幕主体
    en: Register screenshot and screen-sharing actors
  description:
    paragraphs:
    - zh: 为每个批准工具记录发布者、业务 owner、目标会话、截图用途、预期输出目录和留存期，离职或工单结束后移除不再需要的权限。
      en: Record publisher, business owner, target session, capture purpose, expected output directory, and retention for
        each approved tool, and remove grants no longer needed after a user departure or work-order closure.
  control_type: governance
- key: capture-process-integrity
  name:
    zh: 约束图形进程内未知模块
    en: Constrain unknown modules in graphics processes
  description:
    paragraphs:
    - zh: 在试点覆盖的高价值终端启用可执行代码和模块来源控制，阻断或隔离未批准的截图组件与注入链，并审计受信应用新出现的模块。
      en: On pilot-covered high-value endpoints, enforce executable and module provenance controls, block or isolate unapproved
        grabbers and injection chains, and audit newly loaded modules in trusted apps.
  control_type: preventive
- key: screen-grant-and-output-review
  name:
    zh: 复核屏幕授权与产物去向
    en: Review screen grants and artifact destinations
  description:
    paragraphs:
    - zh: 对平台可管理的屏幕录制授权实行最小化，并审核临时图像、批量截图及非批准上传目录的写入主体与留存。
      en: Minimize platform-manageable screen-recording grants and review writers and retention for temporary images, screenshot
        batches, and unapproved upload directories.
  control_type: detective-support
applications:
- target_ref: NJT-0158
  use:
    paragraphs:
    - zh: 对屏幕像素采集，限制非批准截屏程序运行及敏感工作站上的跨应用取像权限，并保留图像产物与进程谱系供调查。
      en: For screen-pixel acquisition, restrict unapproved grabbers and cross-app capture permissions on sensitive workstations,
        retaining image artifacts and process lineage for investigation.
  expected_effect:
    paragraphs:
    - zh: 减少可执行的未授权截屏路径，并提高取得结果与调用主体的可归属性。
      en: Reduce executable unauthorized capture paths and improve attribution of acquired images to their caller.
  limitations:
    paragraphs:
    - zh: 用户合法截图和业务共享不能全面禁用；GDI 等路径不受 Windows.Graphics.Capture 选择器覆盖，内存或远程流输出也可能不落盘。
      en: Legitimate user screenshots and business sharing cannot be universally disabled; GDI paths are outside the Windows.Graphics.Capture
        picker, and memory or remote-stream output may avoid disk.
