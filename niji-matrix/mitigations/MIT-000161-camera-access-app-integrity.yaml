schema_version: 2.0.0
type: mitigation
id: MIT-000161
name:
  zh: 摄像头访问范围与应用完整性控制
  en: Camera-Access Scope and App-Integrity Control
summary:
  zh: 限制未经批准的摄像头取像并保留相机应用与模块来源。
  en: Constrain unauthorized camera acquisition and retain provenance of camera apps and modules.
description:
  paragraphs:
  - zh: 在可管理的平台上限制摄像头访问主体，并检查视频会议与相机应用的模块来源、完整性和更新通道，减少未经批准代码直接取像或借受信进程权限取像的机会。
    en: Restrict camera access principals where the platform supports it and verify module provenance, integrity, and update
      channels for meeting and camera apps, reducing direct camera capture or abuse of trusted-process grants.
domains:
- enterprise
measures:
- key: scoped-camera-grants
  name:
    zh: 按业务限制摄像头授权
    en: Business-Scoped Camera Grants
  description:
    paragraphs:
    - zh: 使用受支持的系统与 MDM 相机策略设定设备或应用许可；Windows 传统桌面应用的细粒度限制需按平台实际能力验证。
      en: Apply supported system and MDM camera policies to devices or apps; validate the actual granularity available for
        classic Windows desktop apps.
  control_type: preventive
- key: meeting-app-integrity
  name:
    zh: 会议与相机应用完整性
    en: Meeting and Camera App Integrity
  description:
    paragraphs:
    - zh: 对会议应用和相机工具实施签名、模块来源和受管更新约束，并审计新增插件或替换库。
      en: Constrain signatures, module provenance, and managed updates for meeting and camera tools, and audit newly loaded
        plugins or replacement libraries.
  control_type: cost-increasing
applications:
- target_ref: NJT-0159
  use:
    paragraphs:
    - zh: 关闭无业务需要终端的摄像头访问，保留准许应用及进程完整性清单，对受管摄像头会话和新模块共同复核。
      en: Disable camera access on endpoints without a business need, retain an approved app and process-integrity inventory,
        and review managed camera sessions with newly loaded modules.
  expected_effect:
    paragraphs:
    - zh: 缩小直接设备取像面，提升攻击者借合法会议进程取像的成本并保留来源归因材料。
      en: Reduce direct camera acquisition exposure, increase the cost of using a legitimate meeting process, and preserve
        provenance for attribution.
  limitations:
    paragraphs:
    - zh: 通话接口仍可取得远端参与者画面而不新开本地摄像头；Windows 桌面应用权限不总能逐应用强制，摄像头指示不能代替审计。
      en: A call interface may acquire a remote participant without reopening a local camera; Windows desktop-app controls
        are not always enforceable per app, and a camera indicator is not audit evidence.
evidence_refs:
- REF-000675
- REF-000676
- REF-000673
