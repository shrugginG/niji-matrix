schema_version: 2.0.0
type: mitigation
id: MIT-000162
name:
  zh: 应用协议出口与中介受管化
  en: Managed Application Egress and Intermediaries
summary:
  zh: 按设备角色限定应用协议出口，并保留受管解析器和 broker 的事务路由。
  en: Restrict application-protocol egress by device role and retain transaction routing at managed resolvers and brokers.
description:
  paragraphs:
  - zh: 把设备、进程和业务角色与获准的解析器、Web 代理、邮件端点及消息 broker 对齐。对受管中介持续导出客户端查询、发布、投递和订阅的关联字段，并把拒绝记录及设备进程结果纳入处置。措施的目标是缩小能把控制端藏在中介之后的路径集合，同时让两侧事务可重建，而非把某个常用协议整体封禁。
    en: Align devices, processes, and business roles with approved resolvers, web proxies, mail endpoints, and message brokers.
      Continuously export client-query, publication, delivery, and subscription join fields from managed intermediaries and
      include denials and endpoint outcomes in response. The measures narrow routes that can place an issuer behind an intermediary
      while making both sides reconstructable, rather than banning an entire common protocol.
domains:
- enterprise
measures:
- key: role-bound-service-egress
  name:
    zh: 按角色绑定应用服务出口
    en: Role-Bound Application Service Egress
  description:
    paragraphs:
    - zh: 以设备和进程角色限制 DNS、Web、邮件及 broker 的可达目的地；DNS 仅经受管解析器并记录阻断决策。
      en: Restrict reachable DNS, web, mail, and broker destinations by device and process role; route DNS through managed
        resolvers and log deny decisions.
  control_type: preventive
- key: intermediary-route-export
  name:
    zh: 中介路由事件持续导出
    en: Continuous Intermediary Route Export
  description:
    paragraphs:
    - zh: 持续导出解析器客户端问题与答案以及受管 broker 的发布、投递、订阅事件，保留设备、客户端和主题关联键。
      en: Continuously export resolver client questions and answers plus managed-broker publication, delivery, and subscription
        events, retaining device, client, and topic join keys.
  control_type: detective-support
- key: path-linked-response
  name:
    zh: 按进程处置全部控制路径
    en: Process-Linked Response Across Control Paths
  description:
    paragraphs:
    - zh: 确认 C2 后按进程和设备查找同一中介上的其他主题、域和结果，并隔离仍有后继任务的路径。
      en: After confirming C2, search other topics, domains, and results on the same intermediary by process and device, isolating
        paths that still carry subsequent tasks.
  control_type: containment
applications:
- target_ref: NJT-0160
  use:
    paragraphs:
    - zh: 按实际业务角色审核可使用应用协议的进程与目标，记录每条允许或拒绝路径到设备身份的映射。
      en: Review which processes and destinations may use application protocols by actual business role and map allowed or
        denied paths to device identity.
  expected_effect:
    paragraphs:
    - zh: 缩减任意应用会话承载 C2 的机会，同时保留请求、应答和后继进程结果的关联。
      en: Reduce opportunities for arbitrary application sessions to carry C2 while preserving joins from request and response
        to process outcome.
  limitations:
    paragraphs:
    - zh: 已批准应用或被盗账户仍可传递控制；加密内容与外部服务日志缺口要求端点补证。
      en: Approved applications or stolen accounts can still carry control; opaque content and external-service log gaps require
        endpoint corroboration.
- target_ref: NJS-0160-001
  use:
    paragraphs:
    - zh: 阻止非批准的外部解析器和 broker，要求自营中介持续保留客户端、事务和路由映射。
      en: Block unapproved external resolvers and brokers and require managed intermediaries to retain client, transaction,
        and routing maps continuously.
  expected_effect:
    paragraphs:
    - zh: 减少受害端只看到中介而无法追索下令者的路径，并在可控中介上形成双侧证据。
      en: Reduce paths where victim logs show only an intermediary and cannot trace the issuer, while creating bilateral evidence
        on managed intermediaries.
  limitations:
    paragraphs:
    - zh: 业务必需的公共 broker 可能不共享发布日志；DoH 和解析缓存亦会遮蔽客户端到答案的直接映射。
      en: A business-required public broker may not share publisher logs; DoH and resolver caching also obscure direct client-to-answer
        mapping.
- target_ref: NJS-0245-001
  use:
    paragraphs:
    - zh: 优先限制植入和非业务远控回连，在发现后隔离会话以减少新的 bot 地址释放；保存当时有效的出口映射，并在合法控制端调查或模拟中绑定输入与结果。企业端定位域阻断只覆盖端点主动路径，不作为卸载控制已经生效的证明。
      en: Prioritize restrictions on implant and nonbusiness remote-control callbacks and isolate discovered sessions to reduce
        fresh bot-address release. Preserve the egress mappings valid at the time and link inputs to results in lawful controller
        investigation or simulation. Enterprise location-domain blocking covers only endpoint-initiated paths and does not
        prove offloading control effectiveness.
  expected_effect:
    paragraphs:
    - zh: 降低控制端取得新地址与持续刷新定位的机会，并使合法取得的远端证据能够关联至具体会话，而不把共享出口误当唯一受害者。
      en: Reduce opportunities for the controller to obtain new addresses or refresh location and allow lawfully acquired
        remote evidence to be linked to sessions without treating shared egress as one unique victim.
  limitations:
    paragraphs:
    - zh: 已被控制端观察的地址和保存结果不能被撤回，攻击者可从企业之外继续查询。没有合法远端可见性时只能减少通信并保留间接证据，不能声称检测或阻止了每次控制端地域推断。
      en: Addresses already observed and results saved by the controller cannot be retracted, and the adversary can continue
        lookup outside the enterprise. Without lawful remote visibility, controls reduce communication and preserve indirect
        evidence but cannot claim detection or prevention of every controller inference.
