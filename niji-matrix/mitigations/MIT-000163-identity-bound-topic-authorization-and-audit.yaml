schema_version: 2.0.0
type: mitigation
id: MIT-000163
name:
  zh: 消息主题按身份授权与审计
  en: Identity-Bound Topic Authorization and Audit
summary:
  zh: 把 broker 发布和订阅权绑定设备身份与主题，并保留跨主题路由图。
  en: Bind broker publish and subscribe rights to device identity and topic while retaining the cross-topic route
    graph.
description:
  paragraphs:
  - zh: 在受管 broker 为每个设备或服务身份分别限定可发布与可订阅的主题，拒绝匿名或宽泛授权，并持续外送主题事件供跨地址审计。EMQX Cloud v5 支持按 clientid 或 username 和 topic/action
      配置规则，但默认允许模式需要明确设置拒绝兜底与测试；正常每设备主题不因唯一性而被阻断。
    en: On managed brokers, separately constrain topics each device or service identity may publish and subscribe,
      reject anonymous or broad grants, and continuously export topic events for cross-address audit. EMQX Cloud
      v5 supports rules keyed by clientid or username and topic/action, but its default allow mode needs an explicit
      deny fallback and testing. Legitimate per-device topics are not blocked merely because they are unique.
domains:
- enterprise
measures:
- key: device-topic-acl
  name:
    zh: 设备主题最小授权
    en: Least-Privilege Device Topic ACL
  description:
    paragraphs:
    - zh: 分别校验发布者和订阅者身份、设备目录、主题模式及允许动作，拒绝未登记私有主题和过宽通配符。
      en: Check publisher and subscriber identities, device inventory, topic patterns, and allowed actions separately;
        reject unregistered private topics and overbroad wildcards.
  control_type: preventive
- key: cross-topic-audit
  name:
    zh: 跨主题全量事件保留
    en: Cross-Topic Event Retention
  description:
    paragraphs:
    - zh: 持续保存 clientid、发布者、订阅者、topic、动作、结果和时间，并与当前订阅清单对账。
      en: Continuously retain client ID, publisher, subscriber, topic, action, result, and time and reconcile with
        current subscription inventory.
  control_type: detective-support
applications:
- target_ref: NJS-0160-002
  use:
    paragraphs:
    - zh: 将每设备任务与回报主题绑定获批设备身份和发布者，拒绝未登记客户端的私有地址，并审查新建主题图。
      en: Bind each device’s task and result topics to approved device identity and publisher, reject private addresses
        from unregistered clients, and review new topic graphs.
  expected_effect:
    paragraphs:
    - zh: 增加攻击者任意分配私有控制地址的成本，保留跨主题定位同一控制活动的证据。
      en: Raise the cost of arbitrary private control addresses and preserve evidence to locate the same operation
        across topics.
  limitations:
    paragraphs:
    - zh: 被盗合法设备身份仍可操作批准主题；公共 broker 不受本组织 ACL 控制，过严规则会中断正常 IoT 任务。
      en: A stolen legitimate device identity can still use approved topics. A public broker is outside the organization’s
        ACL control, and overly strict rules can interrupt normal IoT work.
