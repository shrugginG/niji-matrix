schema_version: "2.0.0"
type: mitigation
id: MIT-000164
name: {zh: 安全工件权限连续性治理, en: Security-Artifact Permission Continuity Governance}
summary: {zh: 固定安全工件所有权和最小权限，独立保存 ACL 基线并验证消费者始终能够执行其防御职责。, en: "Fix ownership and least privilege on security artifacts, preserve independent ACL baselines, and verify that consumers retain access needed for defense."}
description:
  paragraphs:
    - zh: 本缓解把安全产品二进制、驱动、规则、配置和本地审计工件视为带有明确消费者的受保护对象。部署系统按产品版本设置 owner、DACL 或 POSIX 权限，限制 WRITE_DAC、WRITE_OWNER、chmod/chown 与继承源变更；不同权存储保存对象 hash 和权限快照，更新后以真实消费者身份执行功能测试。控制目的不是禁止所有权限维护，而是阻止攻击者借操作系统正常访问裁决让防御组件看似存在却无法消费工件。
      en: This mitigation treats security-product binaries, drivers, rules, configuration, and local audit artifacts as protected objects with explicit consumers. Deployment systems set owner, DACL, or POSIX permissions by product version and restrict WRITE_DAC, WRITE_OWNER, chmod or chown, and inheritance-source changes. Differently authorized storage retains object hashes and permission snapshots, and updates run functional tests under the real consumer identity. The goal is not to prohibit every permission operation but to prevent an adversary from using ordinary operating-system access decisions to leave a defense apparently present but unable to consume its artifacts.
domains: [enterprise]
measures:
  - key: protected-owner-and-acl
    name: {zh: 固定安全工件 owner 与最小 ACL, en: Fixed Security-Artifact Owner and Least-Privilege ACL}
    description: {paragraphs: [{zh: 为安全二进制、规则和配置指定不可由普通管理员随意更改的 owner 与允许列表，只授予安装器和服务所需访问，并审计写 DAC、改 owner、继承和符号链接目标。, en: "Assign security binaries, rules, and configuration an owner and allowlist that ordinary administrators cannot freely change; grant only installer and service access requirements, and audit DACL writes, owner changes, inheritance, and symbolic-link targets."}]}
    control_type: preventive
  - key: permission-and-function-attestation
    name: {zh: 权限与消费者功能联合证明, en: Permission and Consumer-Function Joint Attestation}
    description: {paragraphs: [{zh: 将对象 hash、owner、规范化 ACL 与消费者 SID 保存至不同权存储，升级或修复后重新计算有效访问，并以受控事件验证产品能加载、读取规则和实施保护。, en: "Store object hash, owner, normalized ACL, and consumer SID in separately authorized storage; recompute effective access after upgrade or repair, and use a controlled event to verify that the product loads, reads rules, and enforces protection."}]}
    control_type: detective-support
applications:
  - target_ref: NJT-0161
    use: {paragraphs: [{zh: 将安全产品可执行文件、驱动、规则库和审计工件加入受保护清单，限制权限管理者，预配置 4670 所需 SACL；发现异常 deny 或 owner 变化时，隔离 writer、恢复批准描述符并以原消费者身份复测。, en: "Add security-product executables, drivers, rule stores, and audit artifacts to a protected inventory, restrict permission administrators, and preconfigure the SACL needed for 4670. On an anomalous deny or owner change, isolate the writer, restore the approved descriptor, and retest under the original consumer identity."}]}
    expected_effect: {paragraphs: [{zh: 攻击者更难通过一次普通权限写入静默阻断防御工件，且修复过程能区分 ACL 恢复与真实保护能力恢复。, en: "An adversary has greater difficulty silently blocking a defensive artifact with one ordinary permission write, and recovery can distinguish restored ACL state from restored protective capability."}]}
    limitations: {paragraphs: [{zh: 取得内核或离线磁盘控制的攻击者可能绕过文件系统审计并同时污染基线；产品升级会合法改变 ACL，POSIX、容器层与 Windows 的有效权算法不同，需按平台实现而不能共用一条静态规则。, en: "An adversary with kernel or offline-disk control may bypass file-system audit and contaminate the baseline. Product upgrades legitimately change ACLs, and effective-access algorithms differ across POSIX, container layers, and Windows, requiring platform-specific implementation rather than one static rule."}]}
evidence_refs: [REF-000687, REF-000688, REF-000689, REF-000690]
lifecycle: {status: review, version: "1.0.0", created: "2026-09-23", modified: "2026-09-23", contributors: [Niji Matrix Research], reviewers: []}
