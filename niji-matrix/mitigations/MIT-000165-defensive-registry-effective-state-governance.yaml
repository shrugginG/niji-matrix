schema_version: "2.0.0"
type: mitigation
id: MIT-000165
name: {zh: 防御 Registry 有效状态治理, en: Defensive Registry Effective-State Governance}
summary: {zh: 限制敏感值写权、独立保留版本，并以消费者有效设置和功能验证确认本地 Registry 防护状态。, en: "Restrict sensitive-value writers, retain versions independently, and confirm local Registry protection through consumer effective settings and functional validation."}
description:
  paragraphs:
    - zh: 本缓解针对会被浏览器、安全工具和系统防御组件消费的本地 Registry 值，而非将整个 HKLM/HKCU 设为只读。关键值按设备角色登记 owner、允许 writer、批准值/范围、集中策略优先级、SACL、consumer 与保护职责；写入事务和版本快照送往不同权存储。对支持篡改保护的产品启用集中保护，并在变更后检查实际有效值和功能性 canary，避免管理工具或 Registry API 的成功返回掩盖被拒绝或未生效的状态。
      en: This mitigation targets local Registry values consumed by browsers, security tools, and system defensive components rather than making all of HKLM or HKCU read-only. Critical values are registered by device role with owner, allowed writer, approved value or range, central-policy precedence, SACL, consumer, and defensive responsibility; write transactions and version snapshots are exported to separately authorized storage. Central tamper protection is enabled where supported, and actual effective value plus a functional canary is checked after change so a successful management-tool or Registry API response cannot conceal a rejected or ineffective state.
domains: [enterprise]
measures:
  - key: sensitive-key-write-and-sacl
    name: {zh: 敏感键最小写权与预置审计, en: Sensitive-Key Least Write Authority and Preconfigured Audit}
    description: {paragraphs: [{zh: 限制防御设置键的 owner、Set Value、Write DAC 和远程 Registry 权限，为关键 value 预置 4657 所需 SACL；批准的 installer、策略代理和排障账户使用限时授权并记录工单。, en: "Restrict owner, Set Value, Write DAC, and remote Registry authority on defensive-setting keys; preconfigure the SACL required for 4657 on critical values, and give approved installers, policy agents, and troubleshooting accounts time-limited authority tied to a ticket."}]}
    control_type: preventive
  - key: effective-setting-and-tamper-validation
    name: {zh: 有效设置与篡改保护验证, en: Effective-Setting and Tamper-Protection Validation}
    description: {paragraphs: [{zh: 将 Registry old/new、writer、策略来源、篡改裁决和消费者实际有效值送往不同权存储，变更后用受控测试确认浏览器、工具或审计控制仍实施预期保护。, en: "Export Registry old and new state, writer, policy source, tamper decision, and consumer effective value to separately authorized storage, then use a controlled test after change to confirm that the browser, tool, or audit control still enforces expected protection."}]}
    control_type: detective-support
applications:
  - target_ref: NJT-0162
    use: {paragraphs: [{zh: 把能降低浏览器安全区、实时保护、行为监控、审计或响应的本地 Registry 值列为高风险对象，限制 writer 并启用篡改保护；异常写入后保全 old/new，检查消费者有效设置，再恢复批准状态和验证控制，而不是只删除值。, en: "Classify local Registry values that can reduce browser zones, real-time protection, behavior monitoring, audit, or response as high-risk objects, restrict writers, and enable tamper protection. After an anomalous write preserve old and new state, inspect consumer effective setting, then restore approved state and validate the control rather than merely deleting the value."}]}
    expected_effect: {paragraphs: [{zh: 攻击者更难让普通本地设置写入静默变成真实失防，防守方可以明确区分写入尝试、被阻断消费和有效功能下降，并恢复 writer—consumer 谱系。, en: "An adversary has greater difficulty turning an ordinary local setting write into silent protection loss. Defenders can distinguish a write attempt, blocked consumption, and effective functional decline while recovering writer-to-consumer lineage."}]}
    limitations: {paragraphs: [{zh: 并非所有产品支持篡改保护或报告有效值，关键键数量和正常变化量较大；取得内核或集中管理权限的攻击者可能同时污染设置和健康状态，严格 ACL 也可能破坏安装与排障，需按产品和设备角色校准。, en: "Not every product supports tamper protection or reports effective value, and critical-key volume and legitimate change can be high. An adversary with kernel or central-management authority may contaminate both setting and health state, while strict ACLs can break installation and troubleshooting, requiring calibration by product and device role."}]}
evidence_refs: [REF-000188, REF-000230, REF-000450, REF-000691, REF-000692]
lifecycle: {status: review, version: "1.0.0", created: "2026-09-23", modified: "2026-09-23", contributors: [Niji Matrix Research], reviewers: []}
