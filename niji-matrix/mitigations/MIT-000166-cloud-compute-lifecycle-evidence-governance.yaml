schema_version: "2.0.0"
type: mitigation
id: MIT-000166
name: {zh: 云计算生命周期控制与证据连续性治理, en: Cloud-Compute Lifecycle Control and Evidence-Continuity Governance}
summary: {zh: 限制实例与快照生命周期权限，在首用前强制安全注册，并用不同权备份和删除保护维持调查连续性。, en: "Restrict instance and snapshot lifecycle authority, enforce security enrollment before first use, and preserve investigation continuity with separately authorized backup and deletion protection."}
description:
  paragraphs:
    - zh: 本缓解把云计算创建、派生、回退和删除视为带有 lineage 与证据责任的高影响事务。组织策略和自动化模板在实例可接收网络、身份或数据前强制代理、日志、漏洞与策略注册；生命周期和快照权限使用 JIT、双人审批与用途范围。控制面日志、来宾遥测和证据 manifest 进入与计算管理员分离的存储，关键资源启用删除保护和不可变保留，使计算状态变化不能同时删除其审计来源。
      en: This mitigation treats cloud-compute creation, derivation, reversion, and deletion as high-impact transactions with lineage and evidence responsibility. Organization policy and automation templates enforce agent, logging, vulnerability, and policy enrollment before an instance receives network, identity, or data. Lifecycle and snapshot authority use JIT, two-person approval, and purpose scope. Control-plane logs, guest telemetry, and evidence manifests enter storage separated from compute administrators, while critical resources use deletion protection and immutable retention so compute state changes cannot also delete their audit source.
domains: [enterprise]
measures:
  - key: lifecycle-authority-and-lineage
    name: {zh: 最小生命周期权限与强制 lineage, en: Least Lifecycle Authority and Mandatory Lineage}
    description: {paragraphs: [{zh: 分离创建、快照、挂载、回退与删除权限，要求 request 记录 source/new resource、映像/快照、网络/IAM、owner、工单和期限，并在跨账户复制时保留来源标签与外部登记。, en: "Separate create, snapshot, attach, revert, and delete authority; require requests to record source and new resource, image or snapshot, network and IAM, owner, ticket, and expiry, and preserve source labels plus an external registry across account copies."}]}
    control_type: preventive
  - key: pre-use-control-enrollment
    name: {zh: 首用前强制安全控制注册, en: Mandatory Security-Control Enrollment Before First Use}
    description: {paragraphs: [{zh: 通过模板、启动门禁和组织策略在工作负载首用前启用安全代理、集中日志、网络/IAM 基线和漏洞管理；未满足 checklist 的实例保持隔离且不能挂载敏感数据。, en: "Use templates, startup gates, and organization policy to enable security agents, centralized logging, network and IAM baselines, and vulnerability management before first workload use; quarantine instances that fail the checklist and prevent sensitive-data attachment."}]}
    control_type: preventive
  - key: independent-evidence-retention
    name: {zh: 不同权证据保留与删除保护, en: Separately Authorized Evidence Retention and Deletion Protection}
    description: {paragraphs: [{zh: 把控制面事件、代理序列、关键摘要和备份 manifest 输出到计算管理员不能删除的存储，对关键实例/磁盘/快照启用删除保护、版本保留和审批恢复。, en: "Export control-plane events, agent sequence, critical digests, and backup manifests to storage compute administrators cannot delete, and enable deletion protection, version retention, and approved recovery for critical instances, disks, and snapshots."}]}
    control_type: detective-support
applications:
  - target_ref: NJT-0163
    use: {paragraphs: [{zh: 对云计算生命周期建立统一 lineage 与控制结果账本，任何创建、派生、回退或删除都需证明预期控制和证据覆盖；异常事务先隔离相关身份与资源，再保存控制面和来宾证据。, en: "Maintain a unified lineage and control-outcome ledger for cloud-compute lifecycles. Every creation, derivation, reversion, or deletion proves expected controls and evidence coverage; anomalous transactions first isolate the identity and resource and preserve control-plane and guest evidence."}]}
    expected_effect: {paragraphs: [{zh: 生命周期 API 不再能轻易把活动移动到无控制资源或同时清除本地取证状态，防守方能从独立账本重建前后版本和责任主体。, en: "Lifecycle APIs are less able to move activity into an uncontrolled resource or erase local forensic state at the same time, while defenders can reconstruct versions and responsible actors from an independent ledger."}]}
    limitations: {paragraphs: [{zh: 云提供商、旧镜像和第三方代理的 enrollment 语义不同，强制门禁可能延迟弹性扩容；若数据从未采集，不可变保留也无法恢复。跨账户或跨区域复制还需组织外证据通道。, en: "Enrollment semantics differ across providers, legacy images, and third-party agents, and mandatory gates can delay elastic scaling. Immutable retention cannot recover data never collected. Cross-account or cross-region copies also require evidence channels outside the resource owner."}]}
  - target_ref: NJS-0163-001
    use: {paragraphs: [{zh: 对新建和快照派生实例，在网络开放、IAM 绑定和敏感卷挂载前验证 lineage、模板签名和控制 checklist，未通过者自动隔离并阻止首用。, en: "For new and snapshot-derived instances, verify lineage, template signature, and the control checklist before opening network, binding IAM, or attaching sensitive volumes; automatically quarantine failures and block first use."}]}
    expected_effect: {paragraphs: [{zh: 新计算身份难以在旧资源控制范围之外先行承载攻击，创建到控制生效的窗口缩短且可测量。, en: "A new compute identity is less able to carry adversary activity before controls from the old resource apply, and the creation-to-enforcement window becomes shorter and measurable."}]}
    limitations: {paragraphs: [{zh: 无代理工作负载和短期函数式计算可能需要不同证明；错误的健康上报会阻断合法扩容或误放行未受管实例。, en: "Agentless workloads and short-lived function-style compute may need different attestation; incorrect health reporting can block legitimate scaling or admit an unmanaged instance."}]}
  - target_ref: NJS-0163-002
    use: {paragraphs: [{zh: 对关键实例、磁盘和快照启用删除保护与跨权限保留，回退/删除前生成 evidence manifest 并确认 target_interval 已由外部日志和可恢复备份覆盖。, en: "Enable deletion protection and cross-authority retention for critical instances, disks, and snapshots; before reversion or deletion, generate an evidence manifest and confirm the target interval is covered by external logs and recoverable backup."}]}
    expected_effect: {paragraphs: [{zh: 删除或回退不能静默抹去调查窗口，控制面动作与缺失来宾状态之间保留可证明连接。, en: "Deletion or reversion cannot silently erase the investigation window, preserving a provable connection between the control-plane action and missing guest state."}]}
    limitations: {paragraphs: [{zh: 删除保护可能延迟紧急处置和成本回收，攻击者若控制保留策略或云根身份仍可尝试同时删除证据；需要组织外或 WORM 副本。, en: "Deletion protection can delay emergency response and cost recovery. An adversary controlling retention policy or cloud-root identity may still try to delete evidence simultaneously, requiring an organization-external or WORM copy."}]}
evidence_refs: [REF-000103, REF-000696, REF-000697, REF-000698, REF-000699]
lifecycle: {status: review, version: "1.0.0", created: "2026-09-23", modified: "2026-09-23", contributors: [Niji Matrix Research], reviewers: []}
