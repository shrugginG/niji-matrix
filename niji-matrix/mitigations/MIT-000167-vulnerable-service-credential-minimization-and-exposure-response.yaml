schema_version: 2.0.0
type: mitigation
id: MIT-000167
name:
  zh: 脆弱服务凭据最小化与暴露响应
  en: Vulnerable-Service Credential Minimization and Exposure Response
summary:
  zh: 减少服务和管理平台可读取的长期认证材料，固化正确对象权限，并在漏洞读取证实时按暴露范围轮换和撤销。
  en: Reduce long-lived authentication material readable by services and management platforms, enforce correct object permissions, and rotate
    or revoke by exposure scope after a vulnerable read is confirmed.
description:
  paragraphs:
  - zh: 本缓解处理“修补以后仍需处置已经暴露的凭据”以及“服务本不应长期持有什么材料”两个问题。组织应把 VPN、身份和管理平台中的凭据承载对象映射到业务身份，减少明文、可逆口令、长期会话和广域管理凭据的驻留，用独立秘密服务或设备绑定保护必须保留的材料；同时用对象级 ACL
      与非破坏 canary 验证服务身份和低权主体只能访问必要集合。漏洞读取得到确认后，应保存证据、停用脆弱入口、按对象与身份集合轮换口令和密钥、撤销令牌与会话，并追查暴露窗口内的后继使用。
    en: This mitigation addresses both credentials that remain exposed after patching and material a service should not retain long term. Map
      credential-bearing objects in VPN, identity, and management platforms to business identities, minimize resident plaintext, reversible passwords,
      long-lived sessions, and broadly privileged management credentials, and protect required material through an independent secret service
      or device binding. Enforce object-level ACLs and use nondestructive canaries to verify that service identities and lower-authority subjects
      reach only necessary sets. After confirming a vulnerable read, preserve evidence, disable the vulnerable entry, rotate passwords and keys
      by object and affected identity set, revoke tokens and sessions, and investigate successor use during the exposure window.
domains:
- enterprise
measures:
- key: credential-bearing-object-inventory-and-minimization
  name:
    zh: 凭据承载对象清单与材料最小化
    en: Credential-Bearing Object Inventory and Material Minimization
  description:
    paragraphs:
    - zh: 为服务、appliance、管理数据库和本地文件登记对象标识、材料类型、关联身份、存储期限、运行时读取者和轮换负责人；移除不再需要的明文、可逆或长期材料，优先使用短寿命、最小范围和设备绑定的认证材料。
      en: Register object identifier, material type, related identities, retention, runtime readers, and rotation owner for services, appliances,
        management databases, and local files. Remove unnecessary plaintext, reversible, or long-lived material and prefer short-lived, narrowly
        scoped, device-bound authentication material.
  control_type: exposure-reduction
- key: object-policy-and-reader-canary
  name:
    zh: 对象权限策略与读取 canary
    en: Object Permission Policy and Read Canary
  description:
    paragraphs:
    - zh: 对每个凭据承载对象定义正确 owner、ACL、服务身份和允许调用者，阻止 Web/VPN 服务读取无业务需要的系统文件，阻止低权主体直接读取管理数据库；版本化保存策略，并用不含真实秘密的 canary 周期性验证未授权路径仍被拒绝和审计有效。
      en: Define correct owner, ACL, service identity, and allowed callers for each credential-bearing object. Prevent web or VPN services from
        reading system files outside business need and lower-authority subjects from reading management databases directly. Version the policy
        and periodically use a canary containing no real secret to verify unauthorized paths remain denied and audit remains effective.
  control_type: preventive
- key: exposure-scoped-rotation-and-session-revocation
  name:
    zh: 按暴露范围轮换与会话撤销
    en: Exposure-Scoped Rotation and Session Revocation
  description:
    paragraphs:
    - zh: 确认漏洞读取后，根据对象版本、暴露窗口、关联身份和材料类别建立轮换批次，重置口令、替换密钥或证书、撤销令牌与会话并审查后继登录；补丁完成不能替代凭据处置，密文材料则按解锁可能性与权限价值确定优先级。
      en: After a vulnerable read is confirmed, create rotation batches from object version, exposure window, related identities, and material
        class. Reset passwords, replace keys or certificates, revoke tokens and sessions, and review later sign-ins. Completed patching does not
        replace credential response, while encrypted material is prioritized by unlock feasibility and authority value.
  control_type: containment
applications:
- target_ref: NJT-0164
  use:
    paragraphs:
    - zh: 将所有可能由脆弱组件返回的凭据对象纳入清单，缩短长期材料驻留，并在 read-capability-confirmed 时保全证据和限制入口，在 material-recovered 时按身份集合执行轮换、撤销和后继使用调查。
      en: Inventory every credential object a vulnerable component could return, shorten long-lived material residency, preserve evidence and
        constrain the entry at read-capability-confirmed, and perform identity-set rotation, revocation, and successor-use investigation at material-recovered.
  expected_effect:
    paragraphs:
    - zh: 即使漏洞被成功触发，可取得的材料数量、权限和有效期也会下降；对象级映射让响应从整域重置收敛到可解释范围，并使缺失正常凭据审计的读取仍可通过 canary 与轮换记录调查。
      en: Even after successful exploitation, available material count, authority, and lifetime are reduced. Object-level mapping narrows response
        from domain-wide resets to an explainable scope and makes a read lacking ordinary credential audit investigable through canary and rotation
        records.
  limitations:
    paragraphs:
    - zh: 老旧 appliance 可能必须保存本地材料，设备绑定或短寿命机制未必受支持，轮换大量服务身份也会造成停机。未知的对象内容和暴露窗口会迫使扩大响应范围；最小化降低后果但不阻止漏洞触发。
      en: Legacy appliances may require local material and may not support device binding or short-lived mechanisms, while rotating many service
        identities can cause outages. Unknown object contents and exposure windows force a broader response. Minimization reduces impact but does
        not prevent exploitation.
- target_ref: NJS-0164-001
  use:
    paragraphs:
    - zh: 限制面向网络服务的运行身份只能读取业务必要文件，把会话与凭据材料移出可由静态资源处理器或支持下载路径访问的位置，并验证原始与规范化路径均不能取回 canary；出现材料响应后立即轮换对应 VPN 或管理身份并撤销会话。
      en: Restrict the network-facing service identity to business-required files, move session and credential material beyond static-resource
        handlers or support-download paths, and verify that neither raw nor canonical paths can retrieve the canary. After a material response,
        immediately rotate related VPN or management identities and revoke sessions.
  expected_effect:
    paragraphs:
    - zh: 受害服务即使处理恶意请求也缺少读取高价值凭据对象的权限，路径修复与 canary 同时降低成功率并提供非破坏验证；暴露后的凭据有效窗口被缩短。
      en: Even when processing a malicious request, the victim service lacks authority to read high-value credential objects. Path repair and
        a canary reduce success and provide nondestructive validation, while post-exposure credential lifetime is shortened.
  limitations:
    paragraphs:
    - zh: 一些一体化 appliance 把 Web、认证和配置功能置于同一高权进程，无法彻底分离文件权限；上游 WAF 也可能与设备路径解码不同。必须升级受影响版本，且不能用 canary 通过代替历史暴露调查。
      en: Some integrated appliances place web, authentication, and configuration functions in one privileged process and cannot fully separate
        file authority. An upstream WAF may decode paths differently from the device. Affected versions still require upgrade, and a passing canary
        does not replace historical exposure investigation.
- target_ref: NJS-0164-002
  use:
    paragraphs:
    - zh: 将管理数据库和凭据文件的正确 owner、ACL、数据库角色与允许进程固化为策略，移除低权读取和继承权限，在升级后以不含真实秘密的对象验证原主体被拒绝；已发生读取时识别数据库所含身份和密钥并按可解锁性轮换。
      en: Encode correct owner, ACL, database roles, and allowed processes for management databases and credential files, remove lower-authority
        reads and inherited permissions, and after upgrade verify the original subject is denied using an object containing no real secret. When
        a read occurred, identify identities and keys represented in the database and rotate according to unlock feasibility.
  expected_effect:
    paragraphs:
    - zh: 错误保护状态被纠正，低权主体无法直接读取；版本化策略和 canary 让配置漂移可见，材料轮换限制已复制密文或明文的后续价值。
      en: Faulty protection is corrected and lower-authority subjects cannot read directly. Versioned policy and canaries expose drift, while
        rotation limits the later value of copied encrypted or plaintext material.
  limitations:
    paragraphs:
    - zh: 应用升级可能重新创建文件或恢复默认 ACL，数据库维护和支持账户需要受控例外；加密材料的真实可用性可能未知。仅修正当前权限不能确定历史上谁读取过对象，必须依赖保留日志和调查。
      en: Application upgrades may recreate files or restore default ACLs, while database maintenance and support accounts require controlled
        exceptions. Actual usability of encrypted material may remain unknown. Correcting current permissions cannot determine who read the object
        historically and requires retained telemetry and investigation.
