schema_version: 2.0.0
type: mitigation
id: MIT-000168
name:
  zh: 自动认证目的地与出口边界
  en: Automatic Authentication Destination and Egress Boundary
summary:
  zh: 限制自动认证可以到达的目标，并在外发材料后按暴露身份实施轮换。
  en: Constrain destinations reachable by automatic authentication and rotate exposed identities after material emission.
description:
  paragraphs:
  - zh: 自动认证出口控制要同时约束解析来源、网络目的地和认证协议。组织应阻断不必要的外部 SMB/WebDAV/NTLM，维护可自动认证的内部服务清单，并在挑战响应可能离开边界时把材料视为暴露进行密码轮换或强认证处置。该控制不能仅依赖端口，因为 WebDAV 和代理可使用常见
      Web 端口。
    en: Automatic-authentication egress control must bind resolution provenance, network destination, and authentication protocol. Organizations
      should block unnecessary external SMB, WebDAV, and NTLM, inventory internal services allowed to receive automatic authentication, and treat
      challenge responses that may leave the boundary as exposed material for password rotation or stronger-authentication response. Port-only
      control is insufficient because WebDAV and proxies can use ordinary web ports.
domains:
- enterprise
measures:
- key: approved-integrated-auth-destinations
  name:
    zh: 将 NTLM 与集成认证限制到有 owner 的批准服务集合，先审计再拒绝未知外发目标，并为远程办公与 VPN 分流路径实施相同策略。
    en: Restrict NTLM and integrated authentication to an owned approved service set, audit before denying unknown outbound destinations, and
      apply the same policy to remote-work and split-tunnel paths.
  description:
    paragraphs:
    - zh: 将 NTLM 与集成认证限制到有 owner 的批准服务集合，先审计再拒绝未知外发目标，并为远程办公与 VPN 分流路径实施相同策略。
      en: Restrict NTLM and integrated authentication to an owned approved service set, audit before denying unknown outbound destinations, and
        apply the same policy to remote-work and split-tunnel paths.
  control_type: preventive
- key: protocol-egress-control
  name:
    zh: 在主机、防火墙和 VPN 出口阻断无业务必要的外部 SMB，并对 WebDAV 或可承载 Windows 认证的 HTTP 目的地使用精确允许清单，而非仅依赖边界端口。
    en: Block external SMB without a business requirement at host, firewall, and VPN egress, and use precise allowlists for WebDAV or HTTP destinations
      capable of Windows authentication rather than relying on perimeter ports alone.
  description:
    paragraphs:
    - zh: 在主机、防火墙和 VPN 出口阻断无业务必要的外部 SMB，并对 WebDAV 或可承载 Windows 认证的 HTTP 目的地使用精确允许清单，而非仅依赖边界端口。
      en: Block external SMB without a business requirement at host, firewall, and VPN egress, and use precise allowlists for WebDAV or HTTP destinations
        capable of Windows authentication rather than relying on perimeter ports alone.
  control_type: preventive
- key: material-exposure-response
  name:
    zh: 监听端或可靠网络证据确认挑战响应外泄后，按用户或机器主体、口令强度和可能中继目标分级处置，轮换高风险秘密并审查后继认证；失败连接不触发同等级轮换。
    en: After listener or reliable network evidence confirms response exposure, respond according to user or machine principal, password strength,
      and possible relay targets, rotating high-risk secrets and reviewing successor authentication. A failed connection alone does not trigger
      the same rotation level.
  description:
    paragraphs:
    - zh: 监听端或可靠网络证据确认挑战响应外泄后，按用户或机器主体、口令强度和可能中继目标分级处置，轮换高风险秘密并审查后继认证；失败连接不触发同等级轮换。
      en: After listener or reliable network evidence confirms response exposure, respond according to user or machine principal, password strength,
        and possible relay targets, rotating high-risk secrets and reviewing successor authentication. A failed connection alone does not trigger
        the same rotation level.
  control_type: containment
applications:
- target_ref: NJT-0165
  use:
    paragraphs:
    - zh: 清点终端和服务器允许发起的自动认证协议与目的地，逐步移除 NTLM 依赖，对无法移除的例外绑定服务身份、来源和到期时间，并远程保留拒绝日志。
      en: Inventory automatic-authentication protocols and destinations allowed from endpoints and servers, progressively remove NTLM dependencies,
        and bind unavoidable exceptions to service identity, origin, and expiration while retaining rejection logs remotely.
  expected_effect:
    paragraphs:
    - zh: 攻击者即使触发资源解析或服务回连，也更难使认证材料到达未经批准监听端，阻断事件可用于重建尝试。
      en: Even when resource resolution or a service callback is triggered, authentication material is less likely to reach an unapproved listener,
        and blocks become reconstruction evidence.
  limitations:
    paragraphs:
    - zh: 旧应用、跨域管理和外部文件服务可能依赖 NTLM 或 WebDAV；错误的广泛例外会恢复暴露，控制也不能撤回已经泄露的响应。
      en: Legacy apps, cross-domain administration, and external file services may depend on NTLM or WebDAV. Broad exceptions restore exposure,
        and the control cannot retract a response already leaked.
- target_ref: NJS-0165-001
  use:
    paragraphs:
    - zh: 禁止邮件、办公、浏览和桌面组件向外部 SMB 或未批准集成认证域自动发送当前凭据，对少数业务模板按签名、固定域和用户组设置例外。
      en: Prevent mail, office, browser, and shell components from automatically sending current credentials to external SMB or unapproved integrated-authentication
        domains, with narrow exceptions by signature, fixed domain, and user group.
  expected_effect:
    paragraphs:
    - zh: 恶意对象仍可能触发连接，但无法无声完成向任意目标的认证交换，例外具有可核对的业务所有者。
      en: A malicious object may still cause a connection, but cannot silently complete authentication to an arbitrary target, and each exception
        has an accountable business owner.
  limitations:
    paragraphs:
    - zh: 被攻陷的批准域、用户主动输入秘密和未受管个人设备不受充分覆盖；端口 80/443 上的认证需应用层策略。
      en: Compromised approved domains, user-entered secrets, and unmanaged personal devices remain incompletely covered. Authentication over
        ports 80 and 443 requires application-layer policy.
- target_ref: NJS-0165-002
  use:
    paragraphs:
    - zh: 对服务器机器账户建立允许出站认证目标清单，拒绝面向用户网段或互联网的未知 SMB/HTTP 认证，并把拒绝同入站管理调用关联。
      en: Establish allowed outbound authentication destinations for server machine accounts, deny unknown SMB or HTTP authentication to user
        networks or the Internet, and join rejections to inbound management calls.
  expected_effect:
    paragraphs:
    - zh: 远程方法即使被调用，也难以把机器证明送到攻击者监听端，异常回连留下高信号拒绝。
      en: Even if a remote method is invoked, machine proofs are less likely to reach an adversary listener, and anomalous callbacks leave high-signal
        denials.
  limitations:
    paragraphs:
    - zh: 集群、备份和跨服务器管理需要精细例外；内部攻击者可能把监听器放在仍被允许的服务区。
      en: Clustering, backup, and cross-server management need precise exceptions, and an internal adversary may place a listener in an allowed
        service zone.
