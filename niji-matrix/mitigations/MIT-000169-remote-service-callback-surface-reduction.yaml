schema_version: 2.0.0
type: mitigation
id: MIT-000169
name:
  zh: 远程服务回连面收窄
  en: Remote Service Callback Surface Reduction
summary:
  zh: 收窄可触发机器或服务主体认证回连的远程方法和调用关系。
  en: Reduce remote methods and caller relationships able to trigger machine or service-principal authentication callbacks.
description:
  paragraphs:
  - zh: 服务胁迫面治理应按接口、方法、调用者、目的地和主体维护允许关系，禁用不需要的远程方法，限制 RPC/管理入口，并在保留业务功能时要求目标服务使用签名、通道绑定或等价受众绑定。入站调用和出站认证日志需由不同权存储保留，以便拒绝或成功回连可以被重建。
    en: Service-coercion surface governance should maintain allowed interface, method, caller, destination, and principal relationships, disable
      unnecessary remote methods, constrain RPC and management entry, and require signing, channel binding, or equivalent audience binding where
      business functions remain. Inbound-call and outbound-authentication logs should be retained under separate authority so rejected or successful
      callbacks can be reconstructed.
domains:
- enterprise
measures:
- key: patch-and-method-governance
  name:
    zh: 保持服务补丁并维护可解释网络路径或回连的方法清单，删除不再需要的旧服务，不能停用时按接口与调用者限制访问。
    en: Keep services patched, inventory methods that interpret network paths or callback, remove obsolete services, and restrict interface and
      caller access where disablement is not possible.
  description:
    paragraphs:
    - zh: 保持服务补丁并维护可解释网络路径或回连的方法清单，删除不再需要的旧服务，不能停用时按接口与调用者限制访问。
      en: Keep services patched, inventory methods that interpret network paths or callback, remove obsolete services, and restrict interface
        and caller access where disablement is not possible.
  control_type: preventive
- key: rpc-call-boundary
  name:
    zh: 在关键服务器上只允许命名管理主机和主体访问高风险 RPC 接口，按系统版本验证 RPC 过滤或防火墙规则，并保留拒绝记录。
    en: Permit only named management hosts and principals to reach high-risk RPC interfaces on critical servers, validate RPC filtering or firewall
      rules by OS version, and retain denials.
  description:
    paragraphs:
    - zh: 在关键服务器上只允许命名管理主机和主体访问高风险 RPC 接口，按系统版本验证 RPC 过滤或防火墙规则，并保留拒绝记录。
      en: Permit only named management hosts and principals to reach high-risk RPC interfaces on critical servers, validate RPC filtering or firewall
        rules by OS version, and retain denials.
  control_type: preventive
- key: service-principal-segmentation
  name:
    zh: 让备份、打印、证书和文件服务使用范围受限的主体与网络区段，避免高权限机器身份能够向任意工作站或互联网认证。
    en: Use scoped principals and network zones for backup, print, certificate, and file services so privileged machine identities cannot authenticate
      to arbitrary workstations or the Internet.
  description:
    paragraphs:
    - zh: 让备份、打印、证书和文件服务使用范围受限的主体与网络区段，避免高权限机器身份能够向任意工作站或互联网认证。
      en: Use scoped principals and network zones for backup, print, certificate, and file services so privileged machine identities cannot authenticate
        to arbitrary workstations or the Internet.
  control_type: exposure-reduction
applications:
- target_ref: NJS-0165-002
  use:
    paragraphs:
    - zh: 对 EFSRPC 及其他经测试会回连的方法核对业务依赖，应用供应商修复，限制调用者与目标网络；AD CS 等可能接受中继的服务同时应用 EPA、HTTPS、签名或通道绑定。
      en: Review business need for EFSRPC and other experimentally verified callback methods, apply vendor fixes, and restrict callers and destination
        networks. Services such as AD CS that may accept relayed proofs also require EPA, HTTPS, signing, or channel binding.
  expected_effect:
    paragraphs:
    - zh: 降低攻击者触发系统主体回连的机会，并让残余调用局限在可审计的管理关系；后继中继目标也更难接受证明。
      en: Reduce opportunities to trigger a system-principal callback, confine remaining calls to auditable management relationships, and make
        successor relay targets less likely to accept the proof.
  limitations:
    paragraphs:
    - zh: Windows 远程服务功能与权限随版本变化，封堵单一方法不证明不存在其他回连入口；严格过滤可能破坏备份和管理，必须逐版本实测。
      en: Windows remote-service behavior and permissions vary by version, and blocking one method does not prove every callback path is closed.
        Strict filtering can disrupt backup and administration and requires version-specific testing.
