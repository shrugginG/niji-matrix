schema_version: 2.0.0
type: mitigation
id: MIT-000170
name:
  zh: Web 认证材料签发谱系与验证器绑定
  en: Web Authentication Material Issuance Lineage and Verifier Binding
summary:
  zh: 保护签名材料并要求依赖方把接受结果绑定到完整权威签发与组合认证事务。
  en: Protect signing material and require relying parties to bind acceptance to complete authoritative issuance and composed-authentication transactions.
description:
  paragraphs:
  - zh: Web 认证材料控制同时覆盖签名密钥、签发日志、依赖方验证和会话恢复。活动 signer 应使用硬件保护、隔离管理和轮换，依赖方校验 issuer、Audience、Recipient、时限、请求绑定及重放状态，并把接受事件回连权威签发。组合认证还须把主认证、外部 MFA
      或授权交换和本地辅状态纳入一个事务，禁止无 owner 的长期 fail-open。
    en: Web-authentication material control spans signing keys, issuance logs, relying-party validation, and session recovery. Active signers
      need hardware protection, isolated administration, and rotation. Relying parties validate issuer, Audience, Recipient, lifetime, request
      binding, and replay state and join acceptance to authoritative issuance. Composed authentication also binds primary authentication, external
      MFA or authorization exchange, and local auxiliary state in one transaction and prohibits ownerless persistent fail-open.
domains:
- enterprise
measures:
- key: strict-proof-constraint-validation
  name:
    zh: 对签名材料校验活动 signer、issuer、Audience、Recipient、NotOnOrAfter、请求绑定和重放 ID；禁用无业务需要的 unsolicited 或无限寿命路径。
    en: Validate active signer, issuer, Audience, Recipient, NotOnOrAfter, request binding, and replay identifier for signed material; disable
      unnecessary unsolicited or unbounded-lifetime paths.
  description:
    paragraphs:
    - zh: 对签名材料校验活动 signer、issuer、Audience、Recipient、NotOnOrAfter、请求绑定和重放 ID；禁用无业务需要的 unsolicited 或无限寿命路径。
      en: Validate active signer, issuer, Audience, Recipient, NotOnOrAfter, request binding, and replay identifier for signed material; disable
        unnecessary unsolicited or unbounded-lifetime paths.
  control_type: preventive
- key: independent-issuance-acceptance-lineage
  name:
    zh: 独立保留 IdP 认证/签发与依赖方接受日志，传播稳定 request/assertion/session ID 或安全摘要，并持续验证日志完整性。
    en: Independently retain IdP authentication and issuance plus relying-party acceptance, propagate stable request, assertion, or session identifiers
      or safe digests, and continuously validate logging integrity.
  description:
    paragraphs:
    - zh: 独立保留 IdP 认证/签发与依赖方接受日志，传播稳定 request/assertion/session ID 或安全摘要，并持续验证日志完整性。
      en: Independently retain IdP authentication and issuance plus relying-party acceptance, propagate stable request, assertion, or session
        identifiers or safe digests, and continuously validate logging integrity.
  control_type: detective-support
- key: per-session-auxiliary-state-binding
  name:
    zh: 对 MFA 和集成回调使用高熵每会话 state、同主体与原会话绑定、短时授权码及服务器到服务器交换，缺失或不匹配时 fail closed。
    en: Use high-entropy per-session state, same-subject and originating-session binding, short-lived authorization codes, and server-to-server
      exchange for MFA and integration callbacks, failing closed on absence or mismatch.
  description:
    paragraphs:
    - zh: 对 MFA 和集成回调使用高熵每会话 state、同主体与原会话绑定、短时授权码及服务器到服务器交换，缺失或不匹配时 fail closed。
      en: Use high-entropy per-session state, same-subject and originating-session binding, short-lived authorization codes, and server-to-server
        exchange for MFA and integration callbacks, failing closed on absence or mismatch.
  control_type: preventive
- key: material-and-session-recovery
  name:
    zh: 签名或集成秘密疑似失守时保全证据，轮换全部活动与重叠密钥，撤销受影响 token/Cookie/session，并逐依赖方验证旧材料已被拒绝。
    en: On suspected signing or integration-secret compromise, preserve evidence, rotate every active and overlapping key, revoke affected tokens,
      cookies, and sessions, and verify old material is rejected at each relying party.
  description:
    paragraphs:
    - zh: 签名或集成秘密疑似失守时保全证据，轮换全部活动与重叠密钥，撤销受影响 token/Cookie/session，并逐依赖方验证旧材料已被拒绝。
      en: On suspected signing or integration-secret compromise, preserve evidence, rotate every active and overlapping key, revoke affected tokens,
        cookies, and sessions, and verify old material is rejected at each relying party.
  control_type: containment
applications:
- target_ref: NJT-0166
  use:
    paragraphs:
    - zh: 为每类 Web 认证材料登记权威 issuer、允许 signer、完整字段约束、正常签发步骤和接受方；构造、接受和资源使用分别分级。部署跨平面 ID/摘要，并在密钥事件后同时轮换、撤销和做依赖方拒绝测试。
      en: Register the authoritative issuer, allowed signer, complete field constraints, normal issuance steps, and relying parties for each web
        authentication material class. Tier construction, acceptance, and resource use separately. Deploy cross-plane identifiers or digests,
        and after a key event combine rotation, revocation, and relying-party denial testing.
  expected_effect:
    paragraphs:
    - zh: 使密码学有效不再等同合法来源，并把权威外构造压缩到可由签发缺口、约束失败或恢复测试揭示的路径。
      en: Prevent cryptographic validity from being treated as legitimate origin and constrain off-authority construction to paths exposed by
        issuance gaps, constraint failures, or recovery tests.
  limitations:
    paragraphs:
    - zh: 活动受信密钥失守时严格字段校验仍可能全部通过；旧 SaaS 未必暴露 assertion ID 或支持全局撤销，轮换错误可能造成大范围登录中断。
      en: Strict field validation can still pass with a compromised active key. Legacy SaaS may omit assertion identifiers or global revocation,
        and faulty rotation can cause broad sign-in outages.
- target_ref: NJS-0166-001
  use:
    paragraphs:
    - zh: 对联合或自包含签名材料强制 issuer、signer、受众、接收端、时限、请求和重放绑定，保留 IdP issuance 与 RP acceptance 共同 ID；与 MIT-000073 的 HSM、Tier 0 和独立 signer 治理共同实施。
      en: Enforce issuer, signer, audience, recipient, time, request, and replay bindings for federated or self-contained signed material and
        retain a common IdP-issuance and relying-party-acceptance identifier. Pair this with MIT-000073 HSM, Tier 0, and independent signer governance.
  expected_effect:
    paragraphs:
    - zh: 拒绝结构或作用域不相容的材料，并让使用活动受信 signer 的链外证明留下可关联的签发缺口。
      en: Reject structurally or contextually incompatible material and make off-chain proofs using an active trusted signer leave a correlatable
        issuance gap.
  limitations:
    paragraphs:
    - zh: 合法 IdP 发起流程和日志缺失会造成缺口；若攻击者控制 signer 与发行日志，仍需独立保留、密钥访问和资源结果。
      en: Legitimate IdP-initiated flows and log loss create gaps; if the adversary controls signer and issuance logs, independent retention,
        key access, and resource outcomes remain necessary.
- target_ref: NJS-0166-002
  use:
    paragraphs:
    - zh: 将旧式静态或可预计算辅 Cookie 迁移为每会话 state 与短时授权码，绑定主体、应用、原会话和回调地址，由应用后端向 MFA 权威交换并验证结果；集成秘密失守时轮换并撤销所有依赖会话。
      en: Replace static or precomputable auxiliary cookies with per-session state and short-lived authorization codes bound to subject, application,
        originating session, and callback. Have the application backend exchange and validate the result with the MFA authority, and rotate secrets
        plus revoke every dependent session after compromise.
  expected_effect:
    paragraphs:
    - zh: 使单个集成秘密或跨会话值不足以本地伪造“已完成 MFA”，同时为每个最终会话留下供应商事务对应项。
      en: Make one integration secret or cross-session value insufficient to locally fabricate completed MFA and give every final session a provider-transaction
        counterpart.
  limitations:
    paragraphs:
    - zh: 应用服务器完全失守时攻击者可能窃取 state、授权码或修改回调逻辑；fail-open 和紧急绕过仍需限时治理，迁移会影响旧客户端。
      en: Full application-server compromise can expose state or codes or alter callback logic. Fail-open and emergency bypass still need time-bounded
        governance, and migration can affect legacy clients.
