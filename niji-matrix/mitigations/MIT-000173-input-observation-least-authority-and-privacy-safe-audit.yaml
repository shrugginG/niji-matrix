schema_version: 2.0.0
type: mitigation
id: MIT-000173
name:
  zh: 输入观察权限最小化与隐私安全审计
  en: Input Observation Least Authority and Privacy-Safe Audit
summary:
  zh: 最小化能在预期消费者之前观察输入的进程、设备与会话，并用不含实际输入内容的远程元数据审计剩余权限。
  en: Minimize processes, devices, and sessions able to observe input before the intended consumer and audit remaining authority
    with remote metadata that contains no actual input content.
description:
  paragraphs:
  - zh: 本缓解把输入观察者清单、隔离输入面与隐私安全审计组合使用。组织按签名、版本、所有者、目标应用和会话审批全局 Hook、Input Monitoring、辅助功能和输入设备读取；对高价值业务输入与认证使用 secure desktop、受保护输入或等价隔离，并只远程保留授权、进程、目标面和结果元数据。
    en: This mitigation combines an input-observer inventory, isolated input surfaces, and privacy-safe audit. Approve global
      hooks, Input Monitoring, accessibility, and input-device reads by signer, version, owner, target app, and session; use
      secure desktop, protected input, or equivalent isolation for high-value business and authentication input; and remotely
      retain only authority, process, target-surface, and outcome metadata.
domains:
- enterprise
measures:
- key: input-observer-allowlist
  name:
    zh: 按签名、版本、所有者、目标应用和会话批准 Input Monitoring、辅助功能、全局 Hook 与输入设备访问
    en: Approve Input Monitoring
  description:
    paragraphs:
    - zh: 按签名、版本、所有者、目标应用和会话批准 Input Monitoring、辅助功能、全局 Hook 与输入设备访问，并设置到期复核。
      en: Approve Input Monitoring, accessibility, global hooks, and input-device access by signer, version, owner, target
        app, and session with expiry review.
  control_type: preventive
- key: secure-input-boundary
  name:
    zh: 对高价值认证使用 secure desktop、受保护输入或等价隔离
    en: Use secure desktop
  description:
    paragraphs:
    - zh: 对高价值认证使用 secure desktop、受保护输入或等价隔离，限制普通进程、驱动和后台服务观察。
      en: Use secure desktop, protected input, or equivalent isolation for high-value authentication to limit observation
        by ordinary processes, drivers, and background services.
  control_type: exposure-reduction
- key: metadata-only-audit
  name:
    zh: 远程保留授权、API 或设备访问、进程和结果元数据
    en: Remotely retain authority
  description:
    paragraphs:
    - zh: 远程保留授权、API 或设备访问、进程和结果元数据，不集中保存真实按键或口令。
      en: Remotely retain authority, API or device access, process, and outcome metadata without centrally storing actual
        keystrokes or passwords.
  control_type: detective-support
applications:
- target_ref: NJS-0169-001
  use:
    paragraphs:
    - zh: 清点并最小化全局输入观察者，对新授权和设备读取连接进程输出；对 VPN、管理员入口和密码管理器解锁优先采用隔离输入面。
      en: Inventory and minimize global input observers, join new grants and device reads to process output, and prioritize
        isolated input surfaces for VPN, administration entry, and password-manager unlock.
  expected_effect:
    paragraphs:
    - zh: 缩小可在消费者之前看到认证输入的主体集合，并为剩余观察者保留可追查来源。
      en: Reduce the set of principals able to see authentication input before the consumer and preserve attributable provenance
        for remaining observers.
  limitations:
    paragraphs:
    - zh: 内核控制、已批准工具失陷或同一安全上下文内恶意代码仍可观察；严格限制会影响辅助功能、输入法和支持业务。
      en: Kernel control, compromise of an approved tool, or malicious code in the same security context can still observe
        input. Strict controls can disrupt accessibility, input methods, and support workflows.
- target_ref: NJS-0220-001
  use:
    paragraphs:
    - zh: 清点并最小化能观察普通业务输入的全局 Hook、Input Monitoring、辅助功能、远程支持和输入设备读取，把新授权与同进程缓冲、文件或外联结果关联，并按签名、版本、owner、目标应用、会话与期限管理例外。
      en: Inventory and minimize global hooks, Input Monitoring, accessibility, remote support, and input-device reads able
        to observe ordinary business input. Join new authority to same-process buffers, files, or egress and manage exceptions
        by signer, version, owner, target app, session, and expiry.
  expected_effect:
    paragraphs:
    - zh: 缩小能在业务消费者之前复制非认证输入的主体集合，并使剩余观察者具有可核查的权限和结果谱系。
      en: Reduce the set of actors able to copy non-authentication input before a business consumer and preserve verifiable
        authority and outcome lineage for remaining observers.
  limitations:
    paragraphs:
    - zh: 内核控制、批准工具失陷或同一安全上下文内恶意代码仍可观察输入；严格限制会影响无障碍、输入法、远程支持、测试和质量监控。
      en: Kernel control, compromise of an approved tool, or malicious code in the same security context can still observe
        input. Strict controls can disrupt accessibility, input methods, remote support, testing, and quality monitoring.
