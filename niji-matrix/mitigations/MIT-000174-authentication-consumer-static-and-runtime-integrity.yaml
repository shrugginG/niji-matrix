schema_version: 2.0.0
type: mitigation
id: MIT-000174
name:
  zh: 认证消费者静态与运行态完整性治理
  en: Authentication Consumer Static and Runtime Integrity Governance
summary:
  zh: 以外部信任根同时保护认证消费者的静态资产与运行态，并限制其形成第二输出路径。
  en: Protect both static assets and runtime of authentication consumers from an external trust anchor and constrain creation
    of a secondary output path.
description:
  paragraphs:
  - zh: 本缓解要求登录脚本、模板、组件和设备镜像采用签名部署并由外部控制面保存黄金哈希，同时限制认证进程调试、附着、预加载、instrumentation 与 agent。认证服务外联和可写临时位置收敛到业务必要集合；发现差异时隔离设备、恢复可信镜像，并按暴露时间窗轮换提交过的凭据与会话。
    en: Require signed deployment of login scripts, templates, components, and appliance images with golden hashes retained
      by an external control plane, while restricting debugging, attachment, preload, instrumentation, and agents for authentication
      processes. Constrain authentication-service egress and writable temporary locations to business need. On a difference,
      isolate the device, restore a trusted image, and rotate credentials and sessions submitted during the exposure window.
domains:
- enterprise
measures:
- key: signed-login-assets
  name:
    zh: 登录脚本、模板、组件和设备镜像只接受签名部署
    en: Accept only signed deployment of login scripts
  description:
    paragraphs:
    - zh: 登录脚本、模板、组件和设备镜像只接受签名部署，限制 Web 根写入并在外部保存黄金哈希。
      en: Accept only signed deployment of login scripts, templates, components, and appliance images, restrict web-root writes,
        and retain golden hashes externally.
  control_type: preventive
- key: runtime-agent-control
  name:
    zh: 限制认证进程调试、附着、库预加载、instrumentation 和 agent 加载
    en: Restrict debugging
  description:
    paragraphs:
    - zh: 限制认证进程调试、附着、库预加载、instrumentation 和 agent 加载，登记精确版本并监测运行态差异。
      en: Restrict debugging, attachment, library preload, instrumentation, and agent loading for authentication processes,
        inventory exact versions, and monitor runtime differences.
  control_type: cost-increasing
- key: auth-service-egress
  name:
    zh: 将认证服务外联和可写临时位置限制到业务必要集合
    en: Constrain authentication-service egress and writable temporary locations to business need and prevent login fields
      from entering APM
  description:
    paragraphs:
    - zh: 将认证服务外联和可写临时位置限制到业务必要集合，禁止登录字段进入 APM、错误日志或第三方分析。
      en: Constrain authentication-service egress and writable temporary locations to business need and prevent login fields
        from entering APM, error logs, or third-party analytics.
  control_type: exposure-reduction
- key: external-integrity-response
  name:
    zh: 从外部控制面运行完整性检查；发现差异时隔离设备、恢复可信镜像并轮换在暴露窗口提交的凭据和会话
    en: Run integrity checks from an external control plane; on a difference isolate the appliance
  description:
    paragraphs:
    - zh: 从外部控制面运行完整性检查；发现差异时隔离设备、恢复可信镜像并轮换在暴露窗口提交的凭据和会话。
      en: Run integrity checks from an external control plane; on a difference isolate the appliance, restore a trusted image,
        and rotate credentials and sessions submitted during the exposure window.
  control_type: containment
applications:
- target_ref: NJS-0169-002
  use:
    paragraphs:
    - zh: 对 VPN、SSO、Webmail 和管理门户同时保护登录资产与认证进程，连接每次未批准变化到第二输出，并按暴露时间窗执行凭据响应。
      en: Protect both login assets and authentication processes for VPN, SSO, webmail, and administration portals, join every
        unauthorized change to secondary output, and perform credential response for the exposure window.
  expected_effect:
    paragraphs:
    - zh: 提高在真实消费者内加入第二接收路径的成本，使静态或内存寄生更可能留下独立可验证差异，并限制结果外送。
      en: Raise the cost of adding a second receiver inside a genuine consumer, make static or memory residence more likely
        to leave an independently verifiable difference, and constrain result egress.
  limitations:
    paragraphs:
    - zh: 同一供应链、签名身份或外部基线被攻陷会削弱控制；无重启运行态和合法 APM 需要精细例外，完整性差异仍不等于已获秘密。
      en: Compromise of the same supply chain, signing identity, or external baseline weakens the control. Long-lived runtime
        and legitimate APM need precise exceptions, and an integrity difference still does not equal an acquired secret.
evidence_refs:
- REF-000729
- REF-000730
- REF-000366
