schema_version: 2.0.0
type: mitigation
id: MIT-000175
name:
  zh: 验证者绑定认证与可信输入界面
  en: Verifier-Bound Authentication and Trusted Input Surfaces
summary:
  zh: 将高价值认证绑定到权威验证者和可信本地输入路径，减少仿冒消费者获得可重放秘密的机会。
  en: Bind high-value authentication to authoritative verifiers and trusted local input paths to reduce opportunities for
    an impersonated consumer to obtain replayable secrets.
description:
  paragraphs:
  - zh: 本缓解组合验证者名称或通道绑定的抗钓鱼认证、登记的 IdP origin 与 redirect URI、secure desktop 本地提示、按 origin 自动填充和一键上报。企业逐步淘汰可在任意页面手工输入的共享口令与
      OTP，并把拒绝自动填充或偏离安全上下文作为需要独立核验的线索。
    en: Combine verifier-name or channel-bound phishing-resistant authentication, registered IdP origins and redirect URIs,
      secure-desktop local prompts, origin-aware autofill, and one-action reporting. Retire shared passwords and OTPs that
      can be manually entered on any page, and treat refused autofill or departure from a secure context as a lead requiring
      independent verification.
domains:
- enterprise
measures:
- key: phishing-resistant-authentication
  name:
    zh: 对高价值账户使用基于通道或验证者名称绑定的抗钓鱼加密认证
    en: Use channel-bound or verifier-name-bound phishing-resistant cryptographic authentication for high-value accounts to
      reduce manually entered reusable shared secrets
  description:
    paragraphs:
    - zh: 对高价值账户使用基于通道或验证者名称绑定的抗钓鱼加密认证，减少可手工输入和重放的共享秘密。
      en: Use channel-bound or verifier-name-bound phishing-resistant cryptographic authentication for high-value accounts
        to reduce manually entered reusable shared secrets.
  control_type: exposure-reduction
- key: authoritative-origin-and-secure-prompt
  name:
    zh: 维护 IdP origin、redirect URI 和本地安全提示实现清单
    en: Maintain inventories of IdP origins
  description:
    paragraphs:
    - zh: 维护 IdP origin、redirect URI 和本地安全提示实现清单，对系统级凭据请求使用 secure desktop 或等价可信路径。
      en: Maintain inventories of IdP origins, redirect URIs, and local secure-prompt implementations and use secure desktop
        or an equivalent trusted path for system credential requests.
  control_type: preventive
- key: origin-aware-autofill-and-reporting
  name:
    zh: 使用按 origin 自动填充的密码管理器、浏览器防钓鱼和用户一键上报
    en: Use origin-aware password-manager autofill
  description:
    paragraphs:
    - zh: 使用按 origin 自动填充的密码管理器、浏览器防钓鱼和用户一键上报，将拒绝自动填充或异常提示作为线索而非单独定罪。
      en: Use origin-aware password-manager autofill, browser anti-phishing, and one-action user reporting, treating refused
        autofill or an unusual prompt as a lead rather than proof.
  control_type: detective-support
applications:
- target_ref: NJS-0169-003
  use:
    paragraphs:
    - zh: 将企业登录收敛到登记 IdP 与本地可信提示，优先淘汰可在任意页面手工输入的口令和 OTP；对偏离 origin 或安全上下文的提示阻断或要求独立核验。
      en: Converge enterprise sign-in on registered IdPs and trusted local prompts, prioritize retiring passwords and OTPs
        manually enterable on any page, and block or independently verify prompts that depart from approved origin or security
        context.
  expected_effect:
    paragraphs:
    - zh: 使仿冒页面无法为真实验证者生成可用的验证者绑定证明，并提高仿冒本地提示与可信系统路径的可区分性。
      en: Prevent an impersonated page from producing verifier-bound proof usable by the genuine verifier and improve distinction
        between an impersonated local prompt and a trusted system path.
  limitations:
    paragraphs:
    - zh: 仍保留口令的旧系统、账户恢复和 OTP 会继续暴露；真实消费者被攻陷、端点会话被控制或用户输入其他敏感数据时，验证者绑定不能消除全部风险。
      en: Legacy systems, account recovery, and OTPs that retain manually entered secrets remain exposed. Verifier binding
        does not eliminate risk when the genuine consumer is compromised, the endpoint session is controlled, or the user
        enters other sensitive data.
- target_ref: NJT-0174
  use:
    paragraphs:
    - zh: 对 T1111 将高价值账户迁移到验证者绑定、不可转移或不可导出的认证器，减少仿冒验证者和第二读者可取得的 MFA 输出；同时保留一次证明和生成状态暴露后的撤销流程。
      en: For T1111, migrate high-value accounts to verifier-bound, nontransferable, or non-exportable authenticators to reduce
        MFA output available to impostor verifiers and second readers while retaining revocation workflows for proof or generator-state
        exposure.
  expected_effect:
    paragraphs:
    - zh: 可转移 MFA 输出和可导出生成状态减少，验证者与接收端绑定使材料在错误控制面中的后继价值下降。
      en: Transferable MFA output and exportable generator state decline, while verifier and recipient binding reduces successor
        value in the wrong control plane.
  limitations:
    paragraphs:
    - zh: 可转移 OTP、恢复流程、旧客户端和无障碍需求仍可能保留可截获证明；受害端被控时其他输入和 session 仍可暴露。
      en: Transferable OTP, recovery flows, legacy clients, and accessibility needs may retain interceptable proofs, while
        a compromised endpoint can still expose other inputs and sessions.
- target_ref: NJS-0174-001
  use:
    paragraphs:
    - zh: 对短时证明优先使用验证者绑定认证并减少手工输入 OTP；仍使用 OTP 时结合短 TTL、一次接受、provider console 最小权限和异源消费关联。
      en: For ephemeral proofs, prefer verifier-bound authentication and reduce manually entered OTP. Where OTP remains, combine
        short validity, one-time acceptance, least provider-console privilege, and different-origin consumption correlation.
  expected_effect:
    paragraphs:
    - zh: 短时证明的有效窗口和可重放性下降，提供者第二读者与异源消费更容易在证明失效前被关联。
      en: The proof validity window and replayability decline, while provider-side second readers and different-origin consumption
        become easier to correlate before expiry.
  limitations:
    paragraphs:
    - zh: 实时攻击者可能在有效期内同步使用 OTP，且恢复流程仍可能降级到可转移证明。
      en: A real-time adversary may use an OTP within its validity window, and recovery may still fall back to a transferable
        proof.
- target_ref: NJT-0175
  use:
    paragraphs:
    - zh: 对 T1621 使用验证者绑定抗钓鱼认证和一键欺诈报告，减少用户对攻击者事务的可批准 challenge，并把 challenge 控制与会话恢复结合。
      en: For T1621, use verifier-bound phishing-resistant authentication and one-action fraud reporting to reduce user-approvable
        challenges for adversary transactions and combine challenge controls with session recovery.
  expected_effect:
    paragraphs:
    - zh: 攻击者能够生成并让用户完成的 challenge 类型与后继会话价值下降，欺诈报告更快进入身份风险响应。
      en: The challenge types an adversary can generate and persuade a user to complete, plus successor session value, decline
        while fraud reports enter identity-risk response sooner.
  limitations:
    paragraphs:
    - zh: 旧版 VPN、电话、RADIUS 和恢复入口可能不支持验证者绑定，用户仍可能被诱导完成数字匹配。
      en: Legacy VPN, phone, RADIUS, and recovery entries may not support verifier binding, and users can still be induced
        to complete number matching.
- target_ref: NJS-0175-002
  use:
    paragraphs:
    - zh: 对跨信道情境同步，规定支持人员不得索要 MFA 动作，使用已登记工单和独立回呼，并以验证者绑定认证阻止外部叙事把用户动作转给攻击者事务。
      en: For cross-channel context synchronization, prohibit support personnel from requesting MFA actions, use registered
        cases and independent callbacks, and apply verifier-bound authentication so an external narrative cannot transfer
        user action to an adversary transaction.
  expected_effect:
    paragraphs:
    - zh: 外部叙事难以替代真实事务发起者的解释权，通信与身份平面之间获得可核验的工单和回呼连接。
      en: External narrative is less able to replace the true transaction initiator, and communication and identity planes
        gain verifiable case and callback links.
  limitations:
    paragraphs:
    - zh: 真实支持账户或租户失陷会保留可信外观，且未迁移的 OTP/推送仍可受社工影响。
      en: A compromised genuine support account or tenant preserves trusted appearance, while unmigrated OTP or push methods
        remain vulnerable to social engineering.
