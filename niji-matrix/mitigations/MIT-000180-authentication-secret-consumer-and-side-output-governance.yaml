schema_version: 2.0.0
type: mitigation
id: MIT-000180
name:
  zh: 认证秘密消费者与旁路输出治理
  en: Authentication Secret-Consumer and Side-Output Governance
summary:
  zh: 通过最小秘密消费者、受保护目的地、无值遥测和按事务暴露范围轮换，减少认证路径产生秘密副本的机会与寿命。
  en: Reduce the opportunity and lifetime of authentication-path secret copies through minimized secret consumers, protected
    destinations, value-free telemetry, and transaction-scoped rotation.
description:
  paragraphs:
  - zh: 本缓解把能够接触认证秘密的组件视为独立高价值面。组织登记每个过滤器、Provider、PAM、PTA/SSO 代理及同步消费者的 signer/hash、调用位置、业务 owner、允许材料、目的地和寿命；限制注册与加载权，使用受保护进程、只读或度量启动、签名模块、隔离更新和双人批准，并禁止认证组件向普通文件、用户可写目录或任意网络目的地输出秘密。
    en: Treat every component able to handle authentication secrets as a separate high-value surface. Inventory signer or
      hash, invocation point, business owner, allowed material, destination, and lifetime for each filter, provider, PAM,
      PTA or SSO agent, and synchronization consumer. Restrict registration and load authority, use protected processes, read-only
      or measured boot, signed modules, isolated updates, and two-person approval, and prohibit authentication components
      from sending secrets to ordinary files, user-writable directories, or arbitrary network destinations.
  - zh: 发现可疑消费者后，先保全组件、配置、事务和输出对象证据，再停止第二输出、从可信介质恢复组件，并按植入至可信恢复期间实际经过节点的主体计算轮换范围。真实秘密不得用于生产检测；canary 使用无生产权限隔离账户。只删除 DLL 或重置最初被攻陷管理员不足以处置已经复制的材料。
    en: After discovering a suspicious consumer, preserve component, configuration, transaction, and output-object evidence
      before stopping the second output, restoring the component from trusted media, and calculating rotation scope from principals
      whose transactions crossed the node between implantation and trusted recovery. Production detection must not use real
      secrets; canaries use isolated accounts without production access. Deleting a DLL or resetting only the initially compromised
      administrator is insufficient for copied material.
domains:
- enterprise
measures:
- key: secret-consumer-inventory-allowlist
  name:
    zh: 认证秘密消费者清单与最小化
    en: Authentication Secret-Consumer Inventory and Minimization
  description:
    paragraphs:
    - zh: 枚举认证服务调用的全部过滤器、Provider、PAM、代理和同步组件，固定 signer/hash、注册/栈位置、owner、用途、输入类别和受保护目的地；删除未知、重复和过期消费者。变更仅通过隔离管理面、签名包、双人批准和可回滚部署，运行态与磁盘态分别度量。
      en: Enumerate every filter, provider, PAM, agent, and synchronization component invoked by authentication services,
        binding signer or hash, registration or stack position, owner, purpose, input class, and protected destination. Remove
        unknown, duplicate, and expired consumers. Permit changes only through isolated administration, signed packages, two-person
        approval, and recoverable deployment, measuring runtime separately from disk state.
  control_type: preventive
- key: secret-output-containment
  name:
    zh: 秘密输出限制与无值遥测
    en: Secret-Output Containment and Value-Free Telemetry
  description:
    paragraphs:
    - zh: 禁止认证组件向普通文件、用户可写目录或任意网络目的地输出秘密；合法同步使用专用身份、加密通道、硬件或隔离密钥面、最小 ACL、短保留和可审计删除。遥测仅记录事务、消费者、目的地对象和敏感分类，不记录、hash 或采样真实口令。
      en: Prohibit authentication components from writing secrets to ordinary files, user-writable directories, or arbitrary
        network destinations. Legitimate synchronization uses dedicated identity, encrypted channel, hardware or isolated
        key plane, minimum ACLs, short retention, and auditable deletion. Telemetry records transaction, consumer, destination
        object, and sensitivity class without recording, hashing, or sampling real passwords.
  control_type: exposure-reduction
- key: exposure-window-recovery
  name:
    zh: 按认证事务与弱化窗口恢复
    en: Authentication-Transaction and Weakening-Window Recovery
  description:
    paragraphs:
    - zh: 保留组件/策略历史与认证事务索引，事件处置时枚举植入后经过恶意消费者或在弱化策略下变化的全部主体，轮换密码、密钥和相关认证材料，撤销令牌与会话，清除输出和可恢复对象，并验证旧材料拒绝。恢复前保全证据，恢复后监控旧组件、代理、策略和值重新出现。
      en: Retain component and policy history plus authentication-transaction indexes. During response, enumerate every principal
        whose transaction traversed the malicious consumer or whose secret changed under weakened policy, rotate passwords,
        keys, and related authentication material, revoke tokens and sessions, clear outputs and recoverable objects, and
        verify old material is rejected. Preserve evidence before recovery and monitor afterward for reappearance of old components,
        agents, policies, and values.
  control_type: containment
applications:
- target_ref: NJS-0093-003
  use:
    paragraphs:
    - zh: 将每个合法认证消费者绑定具体 signer/hash、栈位置、owner、允许事务与受保护目的地，拒绝未知消费者和普通文件/任意外连。发现植入后按其有效期内真实经过节点的主体轮换，而不是只重置部署者。
      en: Bind every legitimate authentication consumer to a specific signer or hash, stack position, owner, allowed transactions,
        and protected destination, rejecting unknown consumers and ordinary files or arbitrary egress. After finding an implant,
        rotate principals whose real transactions traversed the node during its lifetime rather than only resetting the deployer.
  expected_effect:
    paragraphs:
    - zh: 第二秘密接收者会同时产生未批准组件和目的地差异，攻击者难以仅借受信服务身份隐藏；事务级范围缩短响应遗漏与过度轮换。
      en: A second secret recipient produces both unapproved-component and destination differences, making trusted service
        identity alone insufficient for concealment. Transaction-level scope reduces missed and excessive rotation.
  limitations:
    paragraphs:
    - zh: 合法消费者也处理明文且部分输出只在内存存在；模块白名单不能证明没有运行时补丁，输出阻断也不能追回已外传材料。需要运行度量、调查和后继身份监控共同完成。
      en: Legitimate consumers also handle plaintext and some outputs exist only in memory. Module allowlists cannot prove
        absence of runtime patching, and output blocking cannot retrieve material already exfiltrated. Runtime measurement,
        investigation, and successor identity monitoring remain necessary.
- target_ref: NJS-0174-001
  use:
    paragraphs:
    - zh: 当 MFA 证明由受信认证组件处理时，将允许消费者绑定 signer/hash、栈位置、材料类别和受保护目的地，禁止普通文件或任意外联，并按暴露事务撤销 challenge 与 session。
      en: When a trusted authentication component handles MFA proof, bind allowed consumers to signer or hash, stack position,
        material class, and protected destination, prohibit ordinary files or arbitrary egress, and revoke challenges and
        sessions by exposed transaction.
  expected_effect:
    paragraphs:
    - zh: 认证组件内新增秘密接收者更难写入普通文件或任意目的地，已暴露 challenge 与 session 能按事务快速撤销。
      en: A new secret recipient inside an authentication component has less ability to write ordinary files or arbitrary
        destinations, and exposed challenges and sessions can be revoked by transaction.
  limitations:
    paragraphs:
    - zh: 该控制只覆盖认证组件内第二输出，无法阻止消息提供者、邮箱或仿冒输入面的证明截获。
      en: This control covers second outputs inside authentication components and cannot prevent proof capture at a messaging
        provider, mailbox, or impersonated input surface.
