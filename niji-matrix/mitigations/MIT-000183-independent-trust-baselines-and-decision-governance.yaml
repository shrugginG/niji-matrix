schema_version: "2.0.0"
type: mitigation
id: MIT-000183
name: {zh: 独立信任基线与裁决治理, en: Independent Trust Baselines and Decision Governance}
summary: {zh: 分离签名构建、信任锚、验证器与来源传播的控制权，并保留实际 consumer 裁决，使单一信任输入失陷不足以静默放行。, en: "Separate authority over signed builds, trust anchors, verifiers, and provenance propagation and retain actual consumer decisions so compromise of one trust input is insufficient for silent allowance."}
description:
  paragraphs:
    - zh: 本缓解把“trusted/valid”拆回四个独立控制面。签名私钥由 HSM/JIT/双人控制并绑定 CI build/release manifest；root/anchor store 按 fingerprint/scope/owner/version 治理；App Control、Gatekeeper、SIP/trust provider 等 verifier policy/provider 采用 signed/sealed policy、Secure Boot/HVCI/MDM 和独立 attestation；MOTW/quarantine 在 download、archive/image、copy/mount 和 child extraction 全链传播或由网关/consumer 补标。
      en: This mitigation decomposes trusted or valid into four independent control planes. Signing private keys use HSM, JIT, and two-person control and bind to CI build and release manifests. Root and anchor stores are governed by fingerprint, scope, owner, and version. Verifier policy or providers such as App Control, Gatekeeper, SIP, and trust providers use signed or sealed policy, Secure Boot, HVCI, MDM, and independent attestation. MOTW or quarantine propagates through download, archive or image, copy or mount, and child extraction or is restored by gateways or consumers.
    - zh: 每个 named consumer 记录 input digest/chain/provenance、policy/version、实际 decision、prompt/cache/revocation mode 和 first outcome，发送到 trust 管理员无法与 endpoint 管理员共同删除的存储。响应按变量撤销/轮换 signing key 与 release、移除 anchor、恢复 verifier/provider、重新标记/隔离 delivery lineage，并从 decision/outcome 识别已经接受的对象，而不是只修复当前配置。
      en: Each named consumer records input digest, chain, or provenance, policy and version, actual decision, prompt, cache or revocation mode, and first outcome and sends them to storage that trust administrators and endpoint administrators cannot jointly delete. Response revokes or rotates signing keys and releases, removes anchors, restores verifiers or providers, re-marks or quarantines delivery lineage, and identifies already accepted objects from decisions and outcomes rather than only repairing current configuration.
domains: [enterprise]
measures:
  - key: signing-key-and-build-provenance
    name: {zh: 签名密钥与构建来源绑定, en: Signing Key and Build-Provenance Binding}
    description: {paragraphs: [{zh: 私钥保存在 HSM，签名需要短时主体/双人批准并只接受 CI 生成的 digest；发布 manifest、transparency、timestamp、证书状态和分发渠道共同证明合法对象。, en: "Keep private keys in HSMs, require short-lived principals and two-person approval for signing, and accept only CI-generated digests. Release manifests, transparency, timestamps, certificate status, and distribution channels jointly prove a legitimate object."}]}
    control_type: preventive
  - key: trust-anchor-scope-governance
    name: {zh: Trust Anchor Scope 治理, en: Trust Anchor Scope Governance}
    description: {paragraphs: [{zh: 以 fingerprint/store scope/host role/owner/purpose/expiry 管理 root，限制 user/application private stores，审查新增/提升/复制，并对实际 chain consumption 生成记录。, en: "Govern roots by fingerprint, store scope, host role, owner, purpose, and expiry, restrict user or application private stores, review additions, promotions, and copying, and record actual chain consumption."}]}
    control_type: preventive
  - key: sealed-verifier-policy-and-provider
    name: {zh: 密封验证策略与 Provider, en: Sealed Verifier Policy and Provider}
    description: {paragraphs: [{zh: 使用 signed App Control policy、Secure Boot/HVCI、MDM/SIP 和受保护 provider mapping/module，JIT 控制 audit/test/recovery 例外并用 canary 验证 effective decision。, en: "Use signed App Control policy, Secure Boot or HVCI, MDM or SIP, and protected provider mappings and modules. Control audit, test, and recovery exceptions through JIT and verify effective decisions with canaries."}]}
    control_type: preventive
  - key: provenance-continuity-and-restriction
    name: {zh: 来源约束连续性, en: Provenance Constraint Continuity}
    description: {paragraphs: [{zh: 对 download、mail、share、archive/image、mount/copy 和 child extraction 保留/补写 MOTW/quarantine 与 delivery lineage；阻断或受控打开无法证明来源的高风险 child，而非仅封禁扩展名。, en: "Preserve or restore MOTW or quarantine and delivery lineage across downloads, mail, shares, archives or images, mounting or copying, and child extraction. Block or controlled-open high-risk children whose origin cannot be proven rather than only banning extensions."}]}
    control_type: exposure-reduction
  - key: immutable-consumer-decision-ledger
    name: {zh: 不可变 Consumer 裁决账本, en: Immutable Consumer Decision Ledger}
    description: {paragraphs: [{zh: 远程保存 input/state、consumer/version、baseline/effective decision、prompt/cache/revocation 与 first outcome，使配置修复后仍可定位已放行对象和受影响会话。, en: "Remotely retain input or state, consumer and version, baseline and effective decision, prompt, cache, revocation, and first outcome so accepted objects and affected sessions remain identifiable after configuration repair."}]}
    control_type: detective-support
applications:
  - target_ref: NJT-0173
    use: {paragraphs: [{zh: 为每类 trust consumer 定义独立 baseline input、允许的 writer/owner、decision canary 和结果日志，并把签名、anchor、verifier 与 provenance 管理权分离。发现异常后保全 decision ledger，识别所有已接受对象/会话，再按输入层撤销信任并恢复。, en: "For each trust consumer define independent baseline inputs, allowed writers and owners, decision canaries, and outcome logs and separate authority over signing, anchors, verifiers, and provenance. On anomaly preserve the decision ledger, identify every accepted object or session, and then revoke trust and recover according to the input layer."}]}
    expected_effect: {paragraphs: [{zh: 单一证书、root、policy/provider 或 metadata 被控制后不再自动等于全链 trusted，异常 decision 可由不同权基线和 outcome 复核。, en: "Control of one certificate, root, policy or provider, or metadata value no longer automatically makes the entire chain trusted, and anomalous decisions can be checked against differently authorized baselines and outcomes."}]}
    limitations: {paragraphs: [{zh: 多平台 consumer、离线 revocation/cache、私有 trust store 和 legacy 应用很难统一；过严控制会阻断内部软件、TLS inspection 或恢复流程，攻击者同时控制 CA/build/endpoint/ledger 时独立性消失。, en: "Multiplatform consumers, offline revocation or caches, private trust stores, and legacy applications are difficult to unify. Overly strict controls can block internal software, TLS inspection, or recovery, and independence disappears when the adversary controls CA, build, endpoint, and ledger together."}]}
  - target_ref: NJS-0173-001
    use: {paragraphs: [{zh: 将 signer fingerprint 与 artifact digest、HSM key event、CI build/source commit、release manifest 和 distribution channel 绑定；consumer allow 后仍验证 object 是否属于 publisher release。失陷时撤销/轮换 key、发布 deny manifest 并追溯同证书全部 decision/outcome。, en: "Bind signer fingerprint to artifact digest, HSM key events, CI build and source commit, release manifest, and distribution channel. Even after consumer allow, verify that the object belongs to a publisher release. On compromise revoke or rotate the key, publish a deny manifest, and trace every decision and outcome using the certificate."}]}
    expected_effect: {paragraphs: [{zh: 被盗或滥用证书不能仅凭 cryptographic validity 获得长期信任，恶意对象与合法 publisher build 的差可快速显现。, en: "A stolen or abused certificate cannot gain durable trust from cryptographic validity alone, and differences between malicious objects and legitimate publisher builds appear quickly."}]}
    limitations: {paragraphs: [{zh: 小型/第三方 publisher 可能没有可访问 CI manifest，revocation 传播和离线 cache 有延迟；紧急 release 与重新签名会产生短期差，签名服务本身被完全控制仍可伪造 lineage。, en: "Small or third-party publishers may expose no CI manifest, and revocation propagation and offline caches are delayed. Emergency releases and resigning create temporary differences, and full compromise of the signing service can still forge lineage."}]}
  - target_ref: NJS-0173-002
    use: {paragraphs: [{zh: 锁定 system/user/application anchor stores，root 新增/提升要求不同权批准、fingerprint/scope/用途/期限和实际 chain 测试；异常时移除 anchor、刷新 cache/pinning、隔离已接受连接/对象并轮换相关凭据。, en: "Lock system, user, and application anchor stores. Root addition or promotion requires differently authorized approval, fingerprint, scope, purpose, expiry, and actual-chain testing. On anomaly remove the anchor, refresh caches or pinning, isolate accepted connections or objects, and rotate related credentials."}]}
    expected_effect: {paragraphs: [{zh: 攻击者控制的 chain 无法仅靠本地 root 安装静默扩展到所有 consumer，anchor 使用和受影响结果可枚举。, en: "An attacker-controlled chain cannot silently expand to every consumer through local root installation alone, and anchor use plus affected outcomes can be enumerated."}]}
    limitations: {paragraphs: [{zh: 企业代理、安全产品、私有 PKI 和 MDM 合法依赖 root；应用私有 store/pinning 与 cache 可绕过系统治理，错误删除 anchor 会中断业务连接/驱动/软件。, en: "Enterprise proxies, security products, private PKI, and MDM legitimately depend on roots. Application-private stores, pinning, and caches can bypass system governance, and incorrect anchor removal can break business connections, drivers, or software."}]}
  - target_ref: NJS-0173-003
    use: {paragraphs: [{zh: 对 App Control/DSE/SIP/Gatekeeper policy 和 SIP/trust-provider mapping 使用 signed/sealed configuration、Secure Boot/HVCI/MDM 与 module allowlist；所有 audit/test/recovery 例外自动到期，并以 unsigned/invalid canary 验证 effective block。, en: "Use signed or sealed configuration, Secure Boot or HVCI or MDM, and module allowlists for App Control, DSE, SIP, or Gatekeeper policy and SIP or trust-provider mappings. Every audit, test, or recovery exception expires automatically, and unsigned or invalid canaries verify effective blocking."}]}
    expected_effect: {paragraphs: [{zh: 本地管理员或单个 Registry 写入难以改变实际 verifier decision，provider/module 与 policy drift 会在恶意对象消费前被发现。, en: "A local administrator or one Registry write has greater difficulty changing the actual verifier decision, and provider or module plus policy drift is found before malicious-object consumption."}]}
    limitations: {paragraphs: [{zh: Legacy/开发兼容性可能需要 audit/test mode，kernel exploit、内存 patch 或受信 module hijack 可绕过磁盘状态；错误 sealing/policy 会导致 boot failure 或大范围业务阻断。, en: "Legacy or development compatibility can require audit or test mode, and kernel exploits, memory patches, or trusted-module hijacking can bypass disk state. Incorrect sealing or policy can cause boot failure or broad business interruption."}]}
  - target_ref: NJS-0173-004
    use: {paragraphs: [{zh: 在邮件/浏览器/网关生成 delivery_id 与 digest，提取/挂载/复制时传播或补写 Zone.Identifier/quarantine；无法保持来源的 child 在 sandbox/受控路径打开，Unblock 绑定 user/reason/digest。异常时隔离同 lineage 的全部 child 与后继进程。, en: "Generate delivery IDs and digests at mail, browser, or gateway, propagate or restore Zone.Identifier or quarantine during extraction, mounting, or copying, and open children whose provenance cannot be preserved in a sandbox or controlled path. Bind Unblock to user, reason, and digest. On anomaly quarantine every child and successor process in the same lineage."}]}
    expected_effect: {paragraphs: [{zh: 容器/文件系统导致的 metadata 断裂不再自动把外部 payload 变成本地可信对象，consumer 可继续进入 warning/restricted 路径。, en: "Metadata discontinuity caused by containers or filesystems no longer automatically turns an external payload into a locally trusted object, and consumers can continue into warning or restricted paths."}]}
    limitations: {paragraphs: [{zh: ADS/xattr 不被所有文件系统/协议支持，签名企业包和内部同步可能合法丢失标记；全链内容跟踪有隐私/性能成本，内存/streaming payload 不产生 child file。, en: "ADS or xattr is not supported by every filesystem or protocol, and signed enterprise packages or internal synchronization can legitimately lose marks. Full content lineage has privacy and performance costs, and in-memory or streaming payloads create no child file."}]}
evidence_refs: [REF-000594, REF-000768, REF-000769, REF-000770, REF-000771, REF-000772]
