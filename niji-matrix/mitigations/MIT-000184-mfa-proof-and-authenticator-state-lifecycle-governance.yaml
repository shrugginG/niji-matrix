schema_version: 2.0.0
type: mitigation
id: MIT-000184
name:
  zh: MFA 证明与认证器状态生命周期保护
  en: MFA Proof and Authenticator-State Lifecycle Protection
summary:
  zh: 缩小可转移 MFA 证明和生成状态的暴露面，并在短时证明或认证器状态泄露后按不同生命周期撤销。
  en: Reduce exposure of transferable MFA proofs and generator state and revoke them according to different lifecycles after
    proof or authenticator-state compromise.
description:
  paragraphs:
  - zh: 本缓解同时处理一次性证明和长期生成状态。组织限制消息提供者与帮助台访问，使用短 TTL 和一次接受；软件 token 禁止普通备份或导出并绑定设备与应用完整性，高价值身份优先使用不可导出、验证者绑定的认证器。暴露响应必须区分单次
      challenge 失效和整个认证器撤销。
    en: This mitigation addresses both one-time proof and long-term generator state. Restrict messaging-provider and help-desk
      access and enforce short validity plus one-time acceptance. Exclude software tokens from ordinary backup or export and
      bind them to device and application integrity, preferring non-exportable verifier-bound authenticators for high-value
      identities. Exposure response separates invalidation of one challenge from revocation of the entire authenticator.
domains:
- enterprise
measures:
- key: proof-delivery-least-exposure
  name:
    zh: 证明投递最小暴露
    en: Proof-Delivery Least Exposure
  description:
    paragraphs:
    - zh: 缩短信件或 OTP 有效期并强制一次接受，限制消息提供者和帮助台查看正文，按 message scope 赋予到期权限并保留无值访问审计。
      en: Shorten message or OTP validity and enforce one-time acceptance, restrict provider and help-desk visibility into
        message bodies, grant expiring message-scoped authority, and retain value-free access audit.
  control_type: exposure-reduction
- key: generator-state-nonexportability
  name:
    zh: 生成状态不可导出
    en: Generator-State Nonexportability
  description:
    paragraphs:
    - zh: 优先使用硬件支持或不可导出的认证器状态；软件 token 禁止普通备份或导出，绑定设备与应用完整性，迁移时使旧实例失效。
      en: Prefer hardware-backed or non-exportable authenticator state. Exclude software tokens from ordinary backup or export,
        bind them to device and app integrity, and invalidate old instances during migration.
  control_type: preventive
- key: authenticator-lifecycle-audit
  name:
    zh: 认证器生命周期审计
    en: Authenticator Lifecycle Audit
  description:
    paragraphs:
    - zh: 记录绑定、恢复、迁移、导出、设备变化、撤销和认证方法使用，向用户通知并为高价值身份要求独立批准。
      en: Record binding, recovery, migration, export, device change, revocation, and authentication-method use, notify the
        user, and require independent approval for high-value identities.
  control_type: detective-support
- key: proof-exposure-response
  name:
    zh: 证明暴露响应
    en: Proof-Exposure Response
  description:
    paragraphs:
    - zh: 发现短时证明暴露时立即使挑战失效、撤销其建立的 session 并调查同窗登录；发现 seed 或 token state 暴露时撤销整个认证器、重新绑定并验证旧状态拒绝。
      en: On ephemeral proof exposure, invalidate the challenge, revoke sessions it established, and investigate sign-ins
        in the window. On seed or token-state exposure, revoke the entire authenticator, rebind, and verify rejection of old
        state.
  control_type: containment
applications:
- target_ref: NJS-0174-001
  use:
    paragraphs:
    - zh: 对可手工转移的 OTP 或 out-of-band 证明实施短 TTL、一次接受、provider console 最小权限和跨服务 challenge 关联；高价值账户逐步改用验证者绑定的抗钓鱼方法。
      en: Apply short TTL, one-time acceptance, least provider-console privilege, and cross-service challenge correlation
        to manually transferable OTP or out-of-band proofs, and migrate high-value accounts toward verifier-bound phishing-resistant
        methods.
  expected_effect:
    paragraphs:
    - zh: 缩短被截获证明的可用窗口，使第二读者和异源消费更可追查，并减少仿冒验证者可取得的可重放输出。
      en: Shorten the useful window of an intercepted proof, make second readers and different-origin consumption more traceable,
        and reduce replayable outputs obtainable by an impostor verifier.
  limitations:
    paragraphs:
    - zh: 短 TTL 不能阻止实时攻击者，provider 或真实认证组件被控时仍可能同步读取；恢复、离线场景和无障碍需求可能要求可转移因子。
      en: Short TTL does not stop a real-time adversary, and a compromised provider or genuine authentication component can
        still read synchronously. Recovery, offline settings, and accessibility needs may require transferable factors.
- target_ref: NJS-0174-002
  use:
    paragraphs:
    - zh: 把软件 token container 置于硬件支持存储并禁止普通导出，迁移使用经批准绑定流程且撤销旧实例；暴露后轮换 seed 或整个认证器，而不是只等待当前 OTP 过期。
      en: Place software-token containers in hardware-backed storage and prohibit ordinary export, use approved binding workflows
        for migration with old-instance revocation, and rotate the seed or whole authenticator after exposure rather than
        waiting for the current OTP to expire.
  expected_effect:
    paragraphs:
    - zh: 提高复制生成状态和在另一设备恢复的成本，并把合法迁移与未经批准复制区分为可审计生命周期事件。
      en: Raise the cost of copying generator state and restoring it on another device, and separate legitimate migration
        from unauthorized replication through auditable lifecycle events.
  limitations:
    paragraphs:
    - zh: 已控原设备可代替复制直接生成代码，厂商同步认证器有意允许多设备状态，硬件支持实现仍依赖供应链与本地解锁安全。
      en: A compromised original device can generate codes without copying, vendor syncable authenticators intentionally permit
        multi-device state, and hardware-backed implementations still depend on supply-chain and local-unlock security.
