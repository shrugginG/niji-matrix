schema_version: 2.0.0
type: mitigation
id: MIT-000186
name:
  zh: 凭据传输保护与观察面治理
  en: Credential Transport Protection and Observation-Plane Governance
summary:
  zh: 通过端到端传输保护、抓包权限最小化、镜像目标约束和隐私化证据处理降低凭据被动捕获机会并保留可调查痕迹。
  en: Reduce passive credential-capture opportunities and preserve investigable traces through end-to-end transport protection,
    least capture authority, constrained mirror targets, and privacy-preserving evidence handling.
description:
  paragraphs:
  - zh: 控制应同时减少“看得见流量”和“流量可转化为凭据”两个条件。组织应识别认证协议真实终止位置，对可升级协议实施强端到端保密性、完整性和对端认证；把主机 raw capture、网络设备 EPC/monitor capture、交换镜像和云镜像权限分别限制到有
      owner 的短期工作流，并把命令、资源生命周期和输出目的地写入独立审计。原始 PCAP 本身是敏感数据资产，须加密、最小访问、短保留和按需脱敏。
    en: Controls must reduce both visibility of the flow and the ability to turn observed traffic into credentials. Organizations
      should identify real authentication-protocol termination points and deploy strong end-to-end confidentiality, integrity,
      and peer authentication where protocols can be upgraded. Host raw capture, network-device EPC or monitor capture, switch
      mirroring, and cloud mirroring should each be limited to an owned short-lived workflow, with commands, resource lifecycle,
      and output destinations recorded independently. Raw PCAP is itself a sensitive data asset and requires encryption, least
      access, short retention, and need-based sanitization.
domains:
- enterprise
measures:
- key: end-to-end-authentication-transport
  name:
    zh: 认证传输与终止边界加固
    en: Authentication transport and termination-boundary hardening
  control_type: preventive
  description:
    paragraphs:
    - zh: 淘汰明文或仅弱混淆的认证交换，对 Web 与管理认证采用当前安全 TLS，对 TACACS+ 可行环境迁移至 TLS 1.3 并验证双方身份；记录代理、负载均衡和认证服务器的实际终止边界。加密不能防止终止端被控或共享秘密被盗，因此同时保护密钥、配置和认证服务完整性。
      en: Remove plaintext or weakly obfuscated authentication exchanges, use current secure TLS for web and management authentication,
        and migrate TACACS+ to TLS 1.3 where supported with peer validation. Record actual termination boundaries at proxies,
        load balancers, and authentication servers. Encryption does not prevent capture at a compromised terminator or with
        a stolen shared secret, so protect keys, configuration, and authentication-service integrity as well.
- key: least-capture-and-mirror-authority
  name:
    zh: 抓包与镜像最小权限
    en: Least packet-capture and mirror authority
  control_type: exposure-reduction
  description:
    paragraphs:
    - zh: 从普通工作负载移除不需要的 CAP_NET_RAW、捕获驱动和管理员权限；网络设备按角色限制抓包、文件导出与配置命令；云 IAM 将 mirror create/update/delete 与 collector 管理分权，并采用
        JIT、双人批准、固定目标和自动到期。
      en: Remove unnecessary CAP_NET_RAW, capture drivers, and administrator rights from ordinary workloads. Restrict capture,
        file export, and configuration commands on network devices by role. In cloud IAM, separate mirror create, update,
        and delete from collector administration and use JIT access, dual approval, pinned targets, and automatic expiration.
- key: independent-capture-lifecycle-audit
  name:
    zh: 独立抓包生命周期与输出审计
    en: Independent capture lifecycle and output audit
  control_type: detective-support
  description:
    paragraphs:
    - zh: 将端点捕获权限、网络设备 AAA 命令、镜像资源版本、PCAP 文件及导出目的地发送到攻击者难以同时修改的日志域，持续盘点现态和已删除对象；对认证流建立材料类别与终止边界目录，支持无正文关联。
      en: Send endpoint capture authority, network-device AAA commands, mirror resource versions, PCAP files, and export destinations
        to a logging domain the actor cannot readily alter at the same time. Inventory current and deleted objects and maintain
        material-class and termination-boundary records for authentication flows so correlation need not centralize payload.
- key: pcap-sensitive-data-governance
  name:
    zh: PCAP 敏感数据与响应治理
    en: PCAP sensitive-data and response governance
  control_type: containment
  description:
    paragraphs:
    - zh: 把 PCAP 和提取结果按凭据、PII 与敏感组织数据保护，限制原文读取，按会话与时间过滤并脱敏共享副本。确认未授权捕获后保全 hash 和生命周期证据、撤销观察面、轮换暴露口令/共享秘密、失效相关会话，并检查后继认证，不因只发现抓包命令就无差别轮换全部账户。
      en: Protect PCAPs and extracted results as credential, PII, and sensitive organizational data, restrict raw access,
        and filter by conversation and time while sanitizing shared copies. After confirming unauthorized capture, preserve
        hashes and lifecycle evidence, revoke the observation surface, rotate exposed passwords or shared secrets, invalidate
        related sessions, and inspect successor authentications. Do not rotate every account indiscriminately based only on
        a capture command.
applications:
- target_ref: NJT-0176
  use:
    paragraphs:
    - zh: 建立跨端点、网络设备和云控制面的统一观察面清单，并把每条认证路径的材料类别、加密终止、允许抓包主体和收集目的地记录在同一治理模型中。未授权观察面处置以实际覆盖的身份与材料类别确定轮换范围。
      en: Build one observation-surface inventory across endpoints, network devices, and cloud control planes, recording each
        authentication path's material class, encryption termination, permitted capture principals, and collector destinations
        in one governance model. Scope credential rotation after unauthorized observation to identities and material classes
        actually covered.
  expected_effect:
    paragraphs:
    - zh: 减少可直接看到认证流的主体，使路径外捕获更常只得到不可用密文，并为剩余抓包留下可与授权和材料结果关联的记录。
      en: Fewer principals can see authentication flows, outside-path captures more often yield unusable ciphertext, and remaining
        capture leaves records joinable to authorization and material outcome.
  limitations:
    paragraphs:
    - zh: 端点终止、合法监控和故障诊断仍需要一定观察能力；错误关闭抓包会损害运维与事件响应，终止端或密钥已失陷时网络加密也不能保护材料。
      en: Endpoint termination, authorized monitoring, and troubleshooting still require some observation capability. Overly
        broad capture denial harms operations and incident response, and network encryption cannot protect material when the
        terminator or key is compromised.
- target_ref: NJS-0176-001
  use:
    paragraphs:
    - zh: 在认证端点移除非必要 raw capture capability，固定允许的传感器 hash、接口和输出位置，将认证服务密钥设为最小可读，并对捕获文件与异常协议提取文件执行受限访问和短保留。
      en: Remove unnecessary raw-capture capability from authentication endpoints, pin approved sensor hashes, interfaces,
        and output locations, minimize readability of authentication-service keys, and apply restricted access and short retention
        to captures and protocol-extraction files.
  expected_effect:
    paragraphs:
    - zh: 攻击者必须提升到更高权限、破坏已登记传感器或修改端点完整性才能读取流量，且凭据提取更易留下进程与产物差异。
      en: The adversary must obtain higher privilege, compromise a registered sensor, or alter endpoint integrity to read
        traffic, and credential extraction is more likely to leave process and artifact differences.
  limitations:
    paragraphs:
    - zh: 内核级攻击、受信传感器被劫持和应用内部可见正文不受 raw socket 限制充分覆盖；认证设备可能不支持 EDR 或细粒度 capability。
      en: Kernel-level compromise, hijacked trusted sensors, and plaintext visible inside the application are not fully covered
        by raw-socket controls, and authentication appliances may lack EDR or granular capabilities.
- target_ref: NJS-0176-002
  use:
    paragraphs:
    - zh: 对转发设备启用独立 AAA 命令记账，按角色限制 capture/export，要求每次抓包绑定接口、ACL、时长、包长、文件路径和唯一管理目的地；禁止从设备直接导出到未知 TFTP/SCP 服务器。
      en: Enable independent AAA command accounting on forwarding devices, restrict capture and export by role, and bind each
        capture to interface, ACL, duration, packet length, file path, and one management destination. Prevent direct export
        to unknown TFTP or SCP servers.
  expected_effect:
    paragraphs:
    - zh: 原生诊断能力仍可使用，但恶意操作者可选择的敏感范围和出口减少，短时创建与删除也保留远端生命周期证据。
      en: Native diagnostics remain usable while the sensitive scope and destinations available to an adversary shrink, and
        short-lived creation and deletion retain remote lifecycle evidence.
  limitations:
    paragraphs:
    - zh: 固件或本地最高权限攻击者可绕过 CLI 和记账，旧设备可能没有命令级 AAA；紧急故障排查需要预定义 break-glass 路径并接受更高审计强度。
      en: Firmware or local highest-privilege adversaries may bypass CLI and accounting, and legacy devices may lack command-level
        AAA. Emergency troubleshooting needs a predefined break-glass path with stronger audit.
- target_ref: NJS-0176-003
  use:
    paragraphs:
    - zh: 将镜像创建与 collector 管理分权，只允许固定安全项目/端口接收副本，给镜像资源设置 owner、用途、源范围、过滤器、保留期与自动删除，并对跨项目目标和身份服务源实施双人批准。
      en: Separate mirror creation from collector administration, permit copies only to pinned security projects or ports,
        assign owner, purpose, source scope, filter, retention, and automatic deletion to every mirror, and require dual approval
        for cross-project targets and identity-service sources.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以静默建立任意复制边，异常目标与短期生命周期进入独立 Admin Activity，批准监控也具有可核对责任和到期时间。
      en: The adversary cannot silently create arbitrary copy edges as easily, anomalous targets and short lifecycles enter
        independent Admin Activity, and approved monitoring has accountable ownership and expiration.
  limitations:
    paragraphs:
    - zh: 合法 collector 被攻陷、物理 TAP、交换芯片或云提供方内部复制不会由租户镜像 IAM 阻止；严格固定目标可能影响弹性扩缩容。
      en: Compromise of an approved collector, physical taps, switch-silicon copying, and provider-internal replication are
        not prevented by tenant mirror IAM, while strict target pinning may complicate elastic scaling.
