schema_version: 2.0.0
type: mitigation
id: MIT-000189
name:
  zh: 容器资源读取权限与观察面治理
  en: Container Resource-Read Authority and Observation-Plane Governance
summary:
  zh: 限制容器资源图读取范围并验证 Kubernetes 与 Docker 只读请求的实际观察面。
  en: Constrain container resource-graph read scope and verify actual observation of Kubernetes and Docker read requests.
description:
  paragraphs:
  - zh: 容器控制面需要大量合法 list/get/watch，因此控制把 ServiceAccount/RBAC、namespace 与批准控制器职责绑定，并保留 kube audit。Docker 分支只有在请求或进程通道经验证时才声称覆盖；接口不可见时通过
      socket/API endpoint 访问控制降低暴露。
    en: Container control planes require extensive legitimate list, get, and watch activity, so bind ServiceAccount and RBAC,
      namespace, and approved controller duties and retain kube audit. Claim Docker coverage only where request or process
      telemetry is validated; use socket and API endpoint access control to reduce exposure where reads are not visible.
domains:
- enterprise
measures:
- key: scope-container-read-authority
  name:
    zh: 收紧容器资源读取权限
    en: Scope container resource-read authority
  description:
    paragraphs:
    - zh: 优先使用 RoleBinding 和 namespace 范围，移除无必要的 wildcard、cluster-wide list/watch 和匿名 kubelet/Docker API 访问，并为控制器权限指定 owner。
      en: Prefer RoleBindings and namespace scope, remove unnecessary wildcard or cluster-wide list and watch plus anonymous
        kubelet or Docker API access, and assign owners to controller authority.
  control_type: exposure-reduction
- key: retain-container-read-audit
  name:
    zh: 保留容器只读审计
    en: Retain container read audit
  description:
    paragraphs:
    - zh: 为 kube-apiserver 配置能记录 user、verb、resource、namespace 和状态的 audit policy，验证后端保留与 lost 指标；Docker 先验证 request/process
        通道。
      en: Configure kube-apiserver audit to retain user, verb, resource, namespace, and status, verify backend retention and
        lost indicators, and validate Docker request or process telemetry first.
  control_type: detective-support
applications:
- target_ref: NJT-0179
  use:
    paragraphs:
    - zh: 对容器与资源发现，将读取身份限制在批准 namespace 和资源类型，并把新主体的资源图读取同 exec/create 后继分别关联。
      en: For Container and Resource Discovery, constrain read identities to approved namespaces and resource types and separately
        join new-actor resource-graph reads to later exec or create.
  expected_effect:
    paragraphs:
    - zh: 攻击者可见的资源图缩小，异常 list/get/watch 更容易偏离控制器和运维基线；未授权 API 入口被收敛。
      en: The visible resource graph shrinks, abnormal list, get, and watch activity diverges more clearly from controller
        and operations baselines, and unauthorized API entry points are reduced.
  limitations:
    paragraphs:
    - zh: 合法控制器可能需要广域读取；被盗 ServiceAccount 保持正常身份。audit policy 与 Docker 通道可能缺失，限制过严会破坏调度、监控和发布。
      en: Legitimate controllers may need broad reads and a stolen ServiceAccount retains a normal identity. Audit policy
        and Docker channels may be absent, while excessive restriction can break scheduling, monitoring, and releases.
