schema_version: 2.0.0
type: mitigation
id: MIT-000190
name:
  zh: 驱动查询权限与资产基线治理
  en: Driver Query Authority and Asset-Baseline Governance
summary:
  zh: 限制未授权驱动查询并保持可解释的包、安装与加载状态基线。
  en: Constrain unauthorized driver queries and maintain interpretable package, installation, and load-state baselines.
description:
  paragraphs:
  - zh: 驱动信息是本机合法管理事实，无法普遍隐藏。控制重点是收紧未授权代码和不必要的调试权限、保持驱动资产状态基线，并使原生工具、注册表或 API 查询可归属。
    en: Driver information is a legitimate local-management fact and cannot be universally hidden. The control constrains
      unapproved code and unnecessary debug privilege, maintains driver-state baselines, and makes utility, registry, or API
      queries attributable.
domains:
- enterprise
measures:
- key: driver-asset-baseline
  name:
    zh: 维护驱动状态基线
    en: Maintain driver-state baselines
  description:
    paragraphs:
    - zh: 按主机角色记录驱动包、版本、签名、安装与加载状态及验证时间，未知字段保持 unknown，不由包存在推断 loaded。
      en: Record package, version, signer, installation and load state, and verification time by host role; keep unknown fields
        unknown and do not infer loaded from package presence.
  control_type: detective-support
- key: restrict-query-capability
  name:
    zh: 限制未授权查询能力
    en: Restrict unapproved query capability
  description:
    paragraphs:
    - zh: 使用应用控制限制未知代码执行，审计并收缩非必要 SeDebugPrivilege；原生工具例外绑定 owner、主机角色和期限。
      en: Use application control to constrain unknown code, audit and reduce unnecessary SeDebugPrivilege, and bind native-tool
        exceptions to owner, host role, and expiry.
  control_type: preventive
applications:
- target_ref: NJT-0180
  use:
    paragraphs:
    - zh: 对设备驱动程序发现，将查询事件与权威驱动状态基线比较，并限制异常程序调用 API、读取注册表或协调原生工具。
      en: For Device Driver Discovery, compare query events with an authoritative driver-state baseline and constrain abnormal
        programs from APIs, registry reads, or orchestration of native utilities.
  expected_effect:
    paragraphs:
    - zh: 查询结果更容易正确解释，未知调用者更难获得高价值加载地址，后继 BYOVD 或漏洞选择可更早获得上下文。
      en: Query results become easier to interpret, unknown callers have less access to high-value load addresses, and later
        BYOVD or exploit selection gains earlier context.
  limitations:
    paragraphs:
    - zh: 原生管理工具仍可被滥用；24H2 权限限制只影响特定 API 结果，不能阻止包/注册表发现。应用控制和基线维护有兼容性与运营成本。
      en: Native management tools remain abusable. The 24H2 privilege condition affects one API result rather than package
        or registry discovery. Application control and baseline maintenance carry compatibility and operational cost.
