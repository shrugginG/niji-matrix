schema_version: 2.0.0
type: mitigation
id: MIT-000191
name:
  zh: 身份信任拓扑最小化与读取问责
  en: Identity Trust-Topology Minimization and Read Accountability
summary:
  zh: 减少无必要信任边和广域读取权，并保留域/林与租户信任查询谱系。
  en: Reduce unnecessary trust edges and broad read authority while retaining domain, forest, and tenant trust-query lineage.
description:
  paragraphs:
  - zh: 信任拓扑本身是身份运行所需信息。控制删除陈旧或过宽信任、限制跨租户 partner policy 读取和管理入口，并将批准的健康、迁移和治理任务记录为可审查基线；检测与修改控制分开。
    en: Trust topology is operational identity data. Remove stale or overbroad trust, constrain cross-tenant partner-policy
      reads and management entry points, and register approved health, migration, and governance jobs as reviewable baselines
      while keeping read detection separate from trust modification.
domains:
- enterprise
measures:
- key: minimize-trust-edges
  name:
    zh: 最小化信任边与传递范围
    en: Minimize trust edges and transitive scope
  description:
    paragraphs:
    - zh: 定期审查域/林/租户 partner、方向、传递和 claims 设置，移除无 owner 或到期关系，并记录变更审批和恢复基线。
      en: Review domain, forest, and tenant partners, direction, transitivity, and claims; remove unowned or expired relationships
        and retain change approval and recovery baselines.
  control_type: exposure-reduction
- key: govern-trust-read-authority
  name:
    zh: 治理信任读取权限与日志
    en: Govern trust-read authority and logs
  description:
    paragraphs:
    - zh: 限制 Graph partner policy 和目录管理读取权限，启用可用的 IdentityQueryEvents/Graph activity，登记 AD 健康与迁移作业。
      en: Constrain Graph partner-policy and directory-management read rights, enable available IdentityQueryEvents and Graph
        activity, and register AD health and migration jobs.
  control_type: detective-support
applications:
- target_ref: NJT-0181
  use:
    paragraphs:
    - zh: 对身份信任拓扑发现，将 nltest、LDAP/API 或 Graph 读取同主体职责、来源、scope 和批准任务比较，并缩小攻击者可见和可利用的信任边。
      en: For Identity Trust-Topology Discovery, compare nltest, LDAP or API, and Graph reads with actor duty, origin, scope,
        and approved work while reducing visible and usable trust edges.
  expected_effect:
    paragraphs:
    - zh: 异常信任图读取更容易归属，陈旧信任和过宽跨租户关系减少，可供后继票据或横向路径利用的拓扑缩小。
      en: Abnormal trust-graph reads become easier to attribute, stale trust and broad cross-tenant relationships decline,
        and topology available for later ticket or lateral paths shrinks.
  limitations:
    paragraphs:
    - zh: 认证域用户可能合法读取部分信任，Graph/IdentityQuery 日志需配置；移除信任会影响业务。攻击者持有批准治理身份时仍可能保持正常外观。
      en: Authenticated domain users may legitimately read some trust, Graph and IdentityQuery logging requires configuration,
        and removing trust can affect business. An attacker holding an approved governance identity may retain normal appearance.
