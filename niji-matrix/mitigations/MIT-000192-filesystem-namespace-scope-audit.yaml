schema_version: 2.0.0
type: mitigation
id: MIT-000192
name:
  zh: 文件系统命名空间可见范围与枚举问责
  en: Filesystem Namespace Visibility and Enumeration Accountability
summary:
  zh: 限制不必要路径列表权并为高价值本地、共享和 POSIX 根目录建立可验证枚举证据。
  en: Limit unnecessary path-list rights and establish verifiable enumeration evidence for high-value local, shared, and POSIX
    roots.
description:
  paragraphs:
  - zh: 文件和目录名称是正常业务所需，控制应按权限缩小可见命名空间并对高价值根路径部署定向审计，而不是全面记录所有目录项。共享路径可使用 ABE 降低无权用户可见性；索引服务和 catalog 的访问也需独立治理。
    en: File and directory names are normal business data, so constrain visible namespace by authorization and deploy targeted
      audit on high-value roots rather than record every entry. Shared paths can use ABE to reduce visibility for unauthorized
      users, while index services and catalogs require separate governance.
domains:
- enterprise
measures:
- key: least-list-traverse-authority
  name:
    zh: 最小化 list/traverse 权限
    en: Minimize list and traverse authority
  description:
    paragraphs:
    - zh: 按身份和工作负载限制目录 list/traverse、共享访问及敏感根路径；在 DFS 等适用共享启用 ABE，并审查索引/catalog 读取权。
      en: Limit directory list and traverse, share access, and sensitive roots by identity and workload; enable ABE on applicable
        DFS shares and review index or catalog read rights.
  control_type: exposure-reduction
- key: targeted-namespace-audit
  name:
    zh: 高价值命名空间定向审计
    en: Targeted high-value namespace audit
  description:
    paragraphs:
    - zh: 对选定 Windows 路径配置 SACL/5145，对 Linux 高价值根配置 audit rule，监测 backlog/lost 并保留进程、主体与根路径关联。
      en: Configure SACL or 5145 for selected Windows paths and audit rules for high-value Linux roots, monitor backlog and
        lost counts, and retain process, actor, and root-path joins.
  control_type: detective-support
applications:
- target_ref: NJT-0182
  use:
    paragraphs:
    - zh: 对文件与目录发现，减少攻击者可列出的路径范围，并将异常进程对本地、共享或 POSIX 根的枚举同批准浏览、备份、索引与安全作业比较。
      en: For File and Directory Discovery, reduce the paths an adversary can list and compare abnormal local, share, or POSIX
        root enumeration with approved browsing, backup, indexing, and security jobs.
  expected_effect:
    paragraphs:
    - zh: 敏感路径和名称暴露减少，高扇出或越界枚举更容易归属；攻击者若继续选择文件，可能产生额外访问痕迹。
      en: Sensitive path and name exposure declines, high-fan-out or out-of-scope enumeration becomes easier to attribute,
        and continued file selection may create additional access traces.
  limitations:
    paragraphs:
    - zh: 合法用户、备份、杀毒和索引需要广泛枚举；全面审计会产生高事件量。ABE 不覆盖所有本地路径，未配置规则时无法补采历史。
      en: Legitimate users, backup, antivirus, and indexing need broad enumeration; comprehensive audit creates high event
        volume. ABE does not cover all local paths, and unconfigured rules cannot backfill history.
