schema_version: 2.0.0
type: mitigation
id: MIT-000194
name:
  zh: 关键业务服务控制与可用性韧性
  en: Critical Business-Service Control and Availability Resilience
summary:
  zh: 限制停止权限、独立验证业务健康并提供快速恢复或故障转移，降低有序恶意停用的影响。
  en: Restrict stop authority, validate business health independently, and provide rapid restart or failover to reduce
    orderly malicious disablement.
description:
  paragraphs:
  - zh: 此控制治理谁能停止关键业务服务、停止是否有审批、终态是否与外部健康一致以及如何恢复。它不依赖阻止合法管理接口，而以最小 SERVICE_STOP、不同权审批、业务探针和经过演练的启动/故障转移路径区分维护与攻击。
    en: This control governs who can stop critical business services, whether stopping is approved, whether terminal
      state matches external health, and how service is restored. It does not prohibit legitimate management interfaces
      and instead uses least SERVICE_STOP, differently authorized approval, business probes, and exercised restart
      or failover to distinguish maintenance from attack.
domains:
- enterprise
measures:
- key: least-stop-authority
  name:
    zh: 最小服务停止权限
    en: Least Service-Stop Authority
  description:
    paragraphs:
    - zh: 为关键业务服务收紧 DACL/RBAC 与远程管理权限，只向有明确职责和短期审批的身份授予停止、禁用和依赖控制。
      en: Tighten DACL or RBAC and remote-management rights for critical services, granting stop, disable, and dependency
        control only to identities with a defined role and time-bound approval.
  control_type: preventive
- key: independent-health-approval
  name:
    zh: 独立健康与审批校验
    en: Independent Health and Approval Validation
  description:
    paragraphs:
    - zh: 从与服务控制面不同权的探针验证业务可用性，将每次停止连接到 owner、变更单、调用者和终态，并对无审批的正常终态告警。
      en: Validate business availability from a probe authorized separately from the service control plane and join
        every stop to owner, change record, caller, and terminal state, alerting on an ordinary terminal state without
        approval.
  control_type: detective-support
- key: tested-restart-failover
  name:
    zh: 经过演练的启动与故障转移
    en: Tested Restart and Failover
  description:
    paragraphs:
    - zh: 维护依赖顺序、已知良好配置、快速重启与集群故障转移流程，定期验证停止后能恢复合法会话和数据一致性。
      en: Maintain dependency order, known-good configuration, rapid restart, and cluster failover procedures and
        regularly verify legitimate sessions and data consistency after a stop.
  control_type: containment
applications:
- target_ref: NJT-0185
  use:
    paragraphs:
    - zh: 对数据库、消息、Web 和虚拟化业务服务执行最小停止权限、双人或工单审批、外部健康探测和启动/故障转移演练；无审批控制与健康失败同时出现时隔离调用者。
      en: Apply least stop authority, dual or ticketed approval, external health probes, and restart or failover exercises
        to database, messaging, Web, and virtualization services; isolate the caller when unapproved control and health
        failure co-occur.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难借标准控制路径产生看似普通的 stopped 终态，服务中断范围和持续时间下降，控制主体保持可追溯。
      en: It becomes harder to use a standard control path for an ordinary-looking stopped state; outage scope and
        duration fall and the controller remains attributable.
  limitations:
    paragraphs:
    - zh: 高权被盗、集群共同管理面受陷或合法紧急维护会绕过/触发控制；快速自动重启可能与攻击者反复停止形成循环并放大风险。
      en: Stolen high privilege, compromise of a shared cluster plane, or legitimate emergency maintenance can bypass
        or trigger controls. Rapid automatic restart can loop against repeated attacker stops and amplify risk.
