schema_version: 2.0.0
type: mitigation
id: MIT-000195
name:
  zh: 恢复控制权限与不可变保管库治理
  en: Recovery-Control Authority and Immutable-Vault Governance
summary:
  zh: 把恢复删除和生命周期权限与生产分离，并用不可变保管库、最低保留和完整恢复演练保护可恢复性。
  en: Separate recovery deletion and lifecycle authority from production and protect recoverability with immutable
    vaults, retention floors, and full restore exercises.
description:
  paragraphs:
  - zh: 此控制保护恢复控制面而不仅是保存一份备份。删除、生命周期、计划、锁和密钥权限由不同权 break-glass 身份管理；关键恢复点进入经验证的 compliance/WORM 保留和隔离副本，并通过资源—恢复点—密钥—依赖映射与全量恢复演练验证。
    en: This control protects the recovery control plane rather than merely retaining one backup. Delete, lifecycle,
      plan, lock, and key rights are managed by differently authorized break-glass identities. Critical points enter
      validated compliance or WORM retention and isolated copies and are verified through resource-to-point-to-key-to-dependency
      maps and full restores.
domains:
- enterprise
measures:
- key: separate-recovery-administration
  name:
    zh: 恢复管理与生产权限分离
    en: Separate Recovery Administration
  description:
    paragraphs:
    - zh: 将恢复删除、策略更新、锁变更和密钥权限从生产身份移出，要求抗钓鱼 MFA、短期 break-glass、双人审批和独立日志。
      en: Move recovery deletion, policy update, lock change, and key rights away from production identities and require
        phishing-resistant MFA, time-bound break-glass, dual approval, and independent logs.
  control_type: preventive
- key: immutable-retention-floor
  name:
    zh: 不可变保留与最低期限
    en: Immutable Retention and Minimum Duration
  description:
    paragraphs:
    - zh: 在验证宽限期和保留边界后，对关键恢复点采用 compliance 模式或等价 WORM，并在策略层阻止保留期限低于工作负载要求。
      en: After validating grace and retention bounds, use compliance mode or equivalent WORM for critical points
        and prevent policy retention below workload requirements.
  control_type: preventive
- key: dependency-aware-restore-test
  name:
    zh: 依赖感知完整恢复演练
    en: Dependency-Aware Full Restore Test
  description:
    paragraphs:
    - zh: 维护资源、恢复点、密钥、身份、网络和应用依赖映射，按 RPO/RTO 定期执行隔离环境的完整恢复。
      en: Maintain mappings among resources, recovery points, keys, identities, network, and application dependencies
        and regularly perform full restoration in an isolated environment against RPO and RTO.
  control_type: governance
applications:
- target_ref: NJT-0186
  use:
    paragraphs:
    - zh: 保护本地卷影之外的独立副本和云恢复点，限制删除/禁用权限，对恢复状态下降实时告警，并用隔离演练确认实际恢复。
      en: Protect independent copies and cloud recovery points beyond local shadows, restrict delete and disable rights,
        alert on recovery-state reduction, and confirm actual restoration through isolated exercises.
  expected_effect:
    paragraphs:
    - zh: 直接删除和服务停用的成功率下降，即使在线副本受损仍保留不同权恢复路径。
      en: Direct deletion and service-disable success falls, and a differently authorized recovery path survives even
        if online copies are harmed.
  limitations:
    paragraphs:
    - zh: 本地卷影不是独立备份，同一身份域的副本可能同时受损；严格锁会增加成本并放大错误保留配置，演练也不维持当前生产可用性。
      en: Local shadows are not independent backup, copies in the same identity domain can fail together, strict locks
        add cost and amplify retention mistakes, and exercises do not preserve current production availability.
- target_ref: NJS-0186-001
  use:
    paragraphs:
    - zh: 对备份生命周期设置最低保留与批准 policy hash，使用 compliance Vault Lock 阻止 UpdateRecoveryPointLifecycle 缩短受保护点，并对任何计划/锁/连续规则变化预警。
      en: Set retention floors and approved policy hashes for backup lifecycle, use compliance Vault Lock to prevent
        UpdateRecoveryPointLifecycle from shortening protected points, and alert on any plan, lock, or continuous-rule
        change.
  expected_effect:
    paragraphs:
    - zh: 恶意策略不能在宽限期后缩短已保护恢复点，配置变化在服务到期前暴露，保留链可追溯。
      en: A malicious policy cannot shorten protected points after the grace period, configuration changes surface
        before service expiry, and retention lineage remains attributable.
  limitations:
    paragraphs:
    - zh: 已有点在加锁前的生命周期、产品特定连续备份语义和另一个未保护副本仍可能造成缺口；compliance 配置错误在宽限期后不可逆。
      en: Existing point lifecycle before locking, product-specific continuous-backup semantics, and another unprotected
        copy can still create gaps; a compliance configuration error becomes irreversible after grace.
