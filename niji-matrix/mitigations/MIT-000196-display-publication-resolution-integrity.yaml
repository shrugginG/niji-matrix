schema_version: 2.0.0
type: mitigation
id: MIT-000196
name:
  zh: 展示发布与解析权威完整性
  en: Display Publication and Resolution Authority Integrity
summary:
  zh: 分离内容发布与域名权威，保护绑定并从独立观察点验证实际展示，以阻止或快速恢复篡改。
  en: Separate publication from domain authority, protect bindings, and validate actual display from independent vantages
    to prevent or rapidly recover defacement.
description:
  paragraphs:
  - zh: 此控制同时保护批准内容、标识到源的绑定和实际人类可见结果。内容、DNS/注册、证书与恢复权限分离；高风险记录和发布需强身份与审批；批准内容/RRset 版本化，并从不共用生产解析或源站的观察点验证输出。
    en: This control protects approved content, identifier-to-source binding, and actual human-visible output together.
      Content, DNS or registration, certificate, and recovery authorities are separated; high-risk records and releases
      require strong identity and approval; approved content and RRsets are versioned and output is verified from
      vantages independent of production resolution and origin.
domains:
- enterprise
measures:
- key: segregated-publish-dns-authority
  name:
    zh: 发布与域名权限分离
    en: Separate Publication and Domain Authority
  description:
    paragraphs:
    - zh: 为注册商、权威 DNS、CMS 与证书使用抗钓鱼 MFA、最小权限、独立恢复渠道和双人高风险变更。
      en: Use phishing-resistant MFA, least privilege, independent recovery channels, and dual approval for high-risk
        changes at registrar, authoritative DNS, CMS, and certificate systems.
  control_type: preventive
- key: domain-lock-signed-resolution
  name:
    zh: 域名锁与签名解析
    en: Domain Locks and Signed Resolution
  description:
    paragraphs:
    - zh: 启用适用 registrar/registry 更新与转移锁，正确部署 DNSSEC 并监测验证失败；锁解除和 DS/NS 变化需带外复核。
      en: Enable applicable registrar and registry update or transfer locks, deploy DNSSEC correctly and monitor validation
        failure; review lock removal and DS or NS changes out of band.
  control_type: preventive
- key: versioned-display-assurance
  name:
    zh: 版本化展示状态与独立验证
    en: Versioned Display State and Independent Assurance
  description:
    paragraphs:
    - zh: 保存批准内容、UI 配置、RRset 和发布清单，从多个独立观察点核对实际展示；变更通知发送到不同域和身份。
      en: Retain approved content, UI configuration, RRsets, and release manifests and verify actual display from
        multiple independent vantages; send change notifications to a different domain and identity.
  control_type: detective-support
- key: evidence-preserving-rollback
  name:
    zh: 保全证据的回滚
    en: Evidence-Preserving Rollback
  description:
    paragraphs:
    - zh: 篡改时先保存注册/DNS、证书、页面和发布证据，再恢复账户、记录和已知良好内容并验证解析收敛。
      en: On defacement preserve registrar and DNS, certificate, page, and release evidence before restoring accounts,
        records, and known-good content and validating resolution convergence.
  control_type: containment
applications:
- target_ref: NJT-0187
  use:
    paragraphs:
    - zh: 为网站、入口、banner 与桌面展示登记 owner、批准 release、允许变体、实际结果和恢复版本，分离高权限并用输出而非源文件 alone 验证发布。
      en: Register owner, approved release, allowed variants, actual output, and recovery version for websites, portals,
        banners, and desktops; separate privilege and validate publication by output rather than source files alone.
  expected_effect:
    paragraphs:
    - zh: 未经授权内容更改更难发生且能快速定位到源或绑定平面，恢复时间和受众暴露下降。
      en: Unauthorized display changes become harder and can be quickly localized to source or binding planes, reducing
        recovery time and audience exposure.
  limitations:
    paragraphs:
    - zh: 被盗批准身份或同步篡改审批仍可形成完整但恶意链；备份恢复内容不能修补入侵入口或消除品牌影响。
      en: A stolen approved identity or co-tampered approval can form a complete malicious chain; content restoration
        does not repair entry or remove brand impact.
- target_ref: NJS-0187-001
  use:
    paragraphs:
    - zh: 对组织域启用注册/registry lock、抗钓鱼 MFA、独立恢复联系和双人 DNS 变更；保留前后 RRset、部署 DNSSEC，并从多个解析器抓取实际页面与规范源比较。
      en: Use registrar or registry locks, phishing-resistant MFA, independent recovery contacts, and dual DNS changes
        for organization domains; retain before and after RRsets, deploy DNSSEC, and retrieve actual pages from multiple
        resolvers for canonical comparison.
  expected_effect:
    paragraphs:
    - zh: 标识到源的未授权替换被阻止或快速暴露，干净源站不再被误当作无影响证据。
      en: Unauthorized identifier-to-source replacement is blocked or rapidly exposed, and a clean origin is no longer
        mistaken for evidence of no impact.
  limitations:
    paragraphs:
    - zh: DNSSEC 不能阻止已控制权威签名的攻击者，本地解析或客户端路径劫持可能在权威区外发生；缓存与严格锁会增加恢复复杂度。
      en: DNSSEC cannot stop an attacker controlling authoritative signing, and local resolver or client-path hijack
        can occur outside the authoritative zone; caches and strict locks complicate recovery.
