schema_version: 2.0.0
type: mitigation
id: MIT-000197
name:
  zh: 资源所有权与剩余容量消费控制
  en: Resource Ownership and Residual-Capacity Consumption Control
summary:
  zh: 为计算和网络消费者绑定 owner、用途和限额，并控制端点恶意消费者与反馈门控，限制资源劫持收益。
  en: Bind compute and network consumers to owner, purpose, and limits and control endpoint malicious consumers and
    feedback gating to constrain Resource Hijacking yield.
description:
  paragraphs:
  - zh: 此控制把资源使用从“谁能启动进程”扩展到“谁拥有用量、预算和输出”。每个主机、容器、作业和凭据记录 owner、批准用途、配额和到期；独立计量与应用控制限制未知消费者，并对反复跟随用户活动启停的 ownerless
      进程响应。
    en: This control extends resource use from who can start a process to who owns usage, budget, and output. Each
      host, container, job, and credential has an owner, approved purpose, quota, and expiry. Independent metering
      and application control constrain unknown consumers and respond to ownerless processes that repeatedly follow
      user activity.
domains:
- enterprise
measures:
- key: resource-owner-purpose-budget
  name:
    zh: 资源 owner、用途与预算
    en: Resource Owner, Purpose, and Budget
  description:
    paragraphs:
    - zh: 为计算、网络与作业建立 owner、批准用途、区域、配额、预算和到期，并拒绝无 owner 的新消费者或配额提升。
      en: Assign owner, approved purpose, Region, quota, budget, and expiry to compute, network, and jobs and deny
        unowned consumers or quota increases.
  control_type: governance
- key: independent-resource-metering
  name:
    zh: 独立资源计量与遏制
    en: Independent Resource Metering and Containment
  description:
    paragraphs:
    - zh: 从与工作负载不同权的平台采集 CPU/GPU/网络和成本，在 ownerless 用量越过调优界限时限制或隔离消费者。
      en: Collect CPU, GPU, network, and cost from a plane authorized separately from the workload and limit or isolate
        consumers when ownerless usage exceeds tuned bounds.
  control_type: containment
- key: endpoint-consumer-control
  name:
    zh: 端点消费者执行与反馈控制
    en: Endpoint Consumer Execution and Feedback Control
  description:
    paragraphs:
    - zh: 使用应用控制、EDR、受保护排除项、任务/服务完整性、矿池/代理出口限制和进程/容器资源上限，维护批准 idle job 清单。
      en: Use application control, EDR, protected exclusions, task or service integrity, pool or proxy egress limits,
        and process or container resource caps and maintain an approved idle-job registry.
  control_type: preventive
applications:
- target_ref: NJT-0189
  use:
    paragraphs:
    - zh: 为端点、容器、云工作负载和网络消费者登记 owner 与预算，拒绝未归属服务启用和配额变化，并把性能、网络和费用关联到任务输出。
      en: Register owner and budget for endpoint, container, cloud-workload, and network consumers; deny unowned service
        enablement and quota changes and join performance, network, and cost to task output.
  expected_effect:
    paragraphs:
    - zh: 未授权消费者收益受限，无 owner 的资源消耗变为可处置违规，费用与配额损失范围下降。
      en: Unauthorized-consumer yield is bounded, unowned consumption becomes actionable, and cost or quota loss is
        limited.
  limitations:
    paragraphs:
    - zh: 低速窃用可留在上限内，计费延迟，被盗批准 owner 可能看似正常，严格限额也会损害合法 burst。
      en: Low-rate theft can remain under limits, billing is delayed, a stolen approved owner can appear normal, and
        strict caps can harm legitimate bursts.
- target_ref: NJS-0189-001
  use:
    paragraphs:
    - zh: 对交互端限制未知消费者、保护任务/服务与 Defender 排除项，设置进程或容器资源上限，阻断已知矿池/代理出口，并调查随活动状态反复启停的进程。
      en: On interactive endpoints restrict unknown consumers, protect tasks or services and Defender exclusions,
        set process or container caps, block known pool or proxy egress, and investigate processes repeatedly starting
        or stopping with activity state.
  expected_effect:
    paragraphs:
    - zh: 消费者难以在空闲期长期积累收益，即使门控仍存在也被 owner、应用控制和资源上限限制，并留下清晰关联。
      en: Consumers have less ability to accumulate yield during idle; even with gating, owner, application control,
        and resource caps constrain them and leave clearer correlation.
  limitations:
    paragraphs:
    - zh: 受信签名工具或注入可绕过简单路径规则，资源上限不证明恶意，矿池可用中继，合法维护也会使用空闲时间。
      en: Trusted signed tools or injection can bypass simple path rules, caps do not prove malice, pools can use
        relays, and legitimate maintenance uses idle time.
