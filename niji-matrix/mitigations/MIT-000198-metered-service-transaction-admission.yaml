schema_version: 2.0.0
type: mitigation
id: MIT-000198
name:
  zh: 计量服务最小权限与事务准入
  en: Metered-Service Least Privilege and Transaction Admission
summary:
  zh: 用分应用短期身份、服务准入、事务限额和 bot/目标风险控制阻止公共入口或被盗凭据转化为受害方计费任务。
  en: Use per-app short-lived identities, service admission, transaction limits, and bot or destination-risk controls
    to stop public entries or stolen credentials becoming victim-billed work.
description:
  paragraphs:
  - zh: 此控制保护提供方执行和计量的资源。组织只启用所需模型、消息和区域，以分应用身份和 owner metadata 连接交易，开启提供方日志并按主体、模型、消息、目标和费用设界。公共表单还需服务端速率、设备/账户和号码风险以及
      bot challenge。
    en: This control protects provider-executed and metered resources. Organizations enable only required models,
      messaging, and Regions, join transactions through per-app identities and owner metadata, enable provider logs,
      and bound by principal, model, message, target, and cost. Public forms also need server-side rate, device or
      account and number risk, and bot challenge.
domains:
- enterprise
measures:
- key: per-app-short-lived-identity
  name:
    zh: 分应用短期身份与服务准入
    en: Per-App Short-Lived Identity and Service Admission
  description:
    paragraphs:
    - zh: 用短期角色或 key、最小模型/消息权限、允许来源与区域，只为有 owner 的应用启用计量服务；未使用服务默认拒绝。
      en: Use short-lived roles or keys, minimal model or messaging rights, allowed origins and Regions, and enable
        metered services only for owned applications; deny unused services by default.
  control_type: preventive
- key: transaction-quota-provider-logs
  name:
    zh: 事务限额与提供方日志
    en: Transaction Quotas and Provider Logs
  description:
    paragraphs:
    - zh: 开启每区域调用/交易日志，要求 application profile 或 request owner metadata，并按主体、模型、token、消息、目标和预算设限与告警。
      en: Enable per-Region invocation or transaction logs, require application profiles or request owner metadata,
        and apply limits and alerts by principal, model, token, message, target, and budget.
  control_type: detective-support
- key: public-entry-fraud-admission
  name:
    zh: 公共入口欺诈准入
    en: Public-Entry Fraud Admission
  description:
    paragraphs:
    - zh: 对 OTP/验证入口实施服务端速率、设备和账户约束、号码/国家风险、provider Fraud Guard 和 CAPTCHA/等价 bot challenge，并保留入口到 provider 的交易 ID。
      en: Apply server-side rate, device and account controls, number or country risk, provider Fraud Guard, and CAPTCHA
        or equivalent bot challenge to OTP or verification entries, preserving entry-to-provider transaction IDs.
  control_type: preventive
applications:
- target_ref: NJS-0189-002
  use:
    paragraphs:
    - zh: 对 Bedrock/托管 AI 使用分应用角色、模型与区域 allowlist、调用日志和 token/预算；对 SMS/验证入口连接应用请求与 provider 交易并按 source/device/account/destination
        限速和风控。
      en: For Bedrock or hosted AI use per-app roles, model and Region allowlists, invocation logging, and token or
        budget controls. For SMS or verification entries join application requests to provider transactions and rate-limit
        and risk-screen by source, device, account, and destination.
  expected_effect:
    paragraphs:
    - zh: 广泛共享凭据或公共表单更难无声转换为受害方付费工作，剩余 token、消息和费用被主体级界限控制。
      en: Broad shared credentials or public forms have less ability to silently become victim-paid work, and residual
        tokens, messages, and cost are bounded per principal.
  limitations:
    paragraphs:
    - zh: 分布式仿人流量可绕过挑战，被盗批准应用可能留在正常量内，详细模型日志可能含敏感 prompt，预算告警可能晚于花费。
      en: Distributed human-like traffic can bypass challenges, a compromised approved app may remain within normal
        volume, detailed model logs can contain sensitive prompts, and budget alerts can lag spending.
- target_ref: NJT-0189
  use:
    paragraphs:
    - zh: 对托管服务资源建立 owner、允许服务/区域和主体级预算，把成本异常回连真实交易；本应用补充 MIT-000197 的端点/工作负载资源控制。
      en: Establish owners, allowed services or Regions, and principal-level budgets for managed-service resources
        and connect cost anomalies to transactions; this complements endpoint and workload controls in MIT-000197.
  expected_effect:
    paragraphs:
    - zh: 提供方消费被纳入统一资源所有权和限额，主机外用量不再只在月底账单暴露。
      en: Provider consumption enters unified ownership and limits, so off-host use is not exposed only at month-end
        billing.
  limitations:
    paragraphs:
    - zh: 不同提供方字段和控制不可互换，成本数据仍会延迟，未覆盖的第三方应用可能没有交易级日志。
      en: Provider fields and controls are not interchangeable, cost data remains delayed, and uncovered third-party
        apps may lack transaction-level logs.
