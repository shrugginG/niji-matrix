schema_version: 2.0.0
type: mitigation
id: MIT-000199
name:
  zh: 自动外传流水线与复制面治理
  en: Automated Egress Pipeline and Replica-Surface Governance
summary:
  zh: 限制能够生产、消费和外送待发数据的关系，并对镜像复制边实施分权、固定 collector、到期和独立审计，使自动化不能静默跨越对象或控制面边界。
  en: Constrain relationships allowed to produce, consume, and send pending data and govern mirror copy edges with
    separated authority, pinned collectors, expiry, and independent audit so automation cannot silently cross object
    or control-plane boundaries.
description:
  paragraphs:
  - zh: 限制能够生产、消费和外送待发数据的关系，并对镜像复制边实施分权、固定 collector、到期和独立审计，使自动化不能静默跨越对象或控制面边界。
    en: Constrain relationships allowed to produce, consume, and send pending data and govern mirror copy edges
      with separated authority, pinned collectors, expiry, and independent audit so automation cannot silently cross
      object or control-plane boundaries.
domains:
- enterprise
measures:
- key: approved-pipeline-manifest
  name:
    zh: 自动传输流水线关系清单
    en: Automated transfer pipeline relationship manifest
  description:
    paragraphs:
    - zh: 为合法备份、同步、日志和邮件流水线登记 owner、生产者、待发 namespace、消费者、目的地、数据类别、重试/删除语义与有效期，变更任一关系均需审批并进入审计。
      en: Register owner, producer, pending namespace, consumer, destination, data class, retry or deletion semantics,
        and validity for legitimate backup, sync, logging, and mail pipelines, requiring approval and audit for
        any relationship change.
  control_type: governance
- key: pending-object-least-privilege
  name:
    zh: 待发对象生产与消费最小权限
    en: Least privilege for pending-object production and consumption
  description:
    paragraphs:
    - zh: 将写入、读取、删除和外送权限分别授予指定服务身份，阻止普通采集进程直接访问外部目的地，并阻止未登记 uploader 读取敏感待发区。
      en: Grant write, read, delete, and egress permissions separately to named service identities, preventing ordinary
        collection processes from direct external access and unregistered uploaders from reading sensitive pending
        areas.
  control_type: exposure-reduction
- key: mirror-authority-separation
  name:
    zh: 镜像权限分离与 collector 固定
    en: Mirror authority separation and collector pinning
  description:
    paragraphs:
    - zh: 将 mirror create/update/delete 与 collector 管理分权，采用 JIT、双人批准、固定安全项目或端口、最小 source/filter、自动到期并禁止未知跨项目目标。
      en: Separate mirror create, update, and delete from collector administration and use JIT, dual approval, pinned
        security projects or ports, minimum source and filter scope, automatic expiry, and denial of unknown cross-project
        targets.
  control_type: preventive
- key: independent-lifecycle-audit
  name:
    zh: 独立流水线与镜像生命周期审计
    en: Independent pipeline and mirror lifecycle audit
  description:
    paragraphs:
    - zh: 将文件/对象交接、服务身份、外部连接、网络设备 AAA 命令、镜像资源版本与 collector receipt 发送到相关执行主体不能同时修改的日志域，并保留已删除对象。
      en: Send file or object handoff, service identity, external connection, network-device AAA commands, mirror-resource
        versions, and collector receipt to a log domain that relevant execution principals cannot modify simultaneously,
        retaining deleted objects.
  control_type: detective-support
- key: revoke-and-preserve
  name:
    zh: 未授权流水线或复制面的撤销与保全
    en: Revoke and preserve unauthorized pipelines or replica surfaces
  description:
    paragraphs:
    - zh: 确认未授权自动外传后先保全 object identity、配置版本、流量与 collector 证据，再撤销 uploader 令牌、待发读取权、镜像资源和 collector 路由，并核查已经发送的数据范围。
      en: After confirming unauthorized automated exfiltration, preserve object identity, configuration versions,
        flows, and collector evidence before revoking uploader tokens, pending-area read access, mirror resources,
        and collector routing, then assess the data already sent.
  control_type: containment
applications:
- target_ref: NJT-0190
  use:
    paragraphs:
    - zh: 把所有合法自动外传表示为可审核的 producer/source—trigger—processor—destination 关系，并要求外部发送经受管出口或受管复制面。
      en: Represent every legitimate automated transfer as an auditable producer or source, trigger, processor,
        and destination relationship and require external sending through managed egress or managed replica surfaces.
  expected_effect:
    paragraphs:
    - zh: 未登记的自动处理不能仅凭脚本、服务身份或业务时段获得外送权限，重复关系和配置变化保留可调查痕迹。
      en: Unregistered automated processing cannot gain egress solely through a script, service identity, or business
        hour, while recurring relationships and configuration changes retain investigable traces.
  limitations:
    paragraphs:
    - zh: 已批准流水线或 collector 被攻陷后仍可能外传，且过严关系约束会影响弹性扩缩容与故障恢复。
      en: A compromised approved pipeline or collector can still exfiltrate, and strict relationship controls may
        impair elastic scaling and recovery.
- target_ref: NJS-0190-001
  use:
    paragraphs:
    - zh: 固定允许写入待发区的 producer、允许读取的 uploader 和批准目的地，并为新增 writer、reader 或 destination 建立变更门与短期高强度审计。
      en: Pin producers allowed to write the pending area, uploaders allowed to read it, and approved destinations,
        with change gates and short-term heightened audit for every new writer, reader, or destination.
  expected_effect:
    paragraphs:
    - zh: 攻击者必须破坏至少一个登记关系或服务身份才能把敏感对象交给外送组件，跨进程流水线更易形成确定性差分。
      en: The adversary must violate at least one registered relationship or service identity to hand sensitive
        objects to an egress component, creating a more deterministic cross-process differential.
  limitations:
    paragraphs:
    - zh: 合法 uploader 被劫持或待发对象仅存在内存时控制效果下降；内容加密会限制数据类别判断。
      en: Effect falls when a legitimate uploader is hijacked or the pending object exists only in memory; encryption
        limits data-class judgment.
- target_ref: NJS-0190-002
  use:
    paragraphs:
    - zh: 将镜像创建与 collector 管理分权，只允许固定项目或端口接收副本，并为 source/filter、owner、用途和到期建立必填约束。
      en: Separate mirror creation from collector administration, allow copies only to pinned projects or ports,
        and require source and filter, owner, purpose, and expiration constraints.
  expected_effect:
    paragraphs:
    - zh: 任意复制边更难被静默建立，短时镜像、广源范围和异常 collector 进入不可变控制面审计。
      en: Arbitrary copy edges become harder to establish silently, and short-lived mirrors, broad source scope,
        and anomalous collectors enter immutable control-plane audit.
  limitations:
    paragraphs:
    - zh: 物理 TAP、固件级复制、云提供方内部行为或合法 collector 被控不受租户 IAM 充分阻止。
      en: Physical taps, firmware-level copying, provider-internal behavior, and compromise of an approved collector
        are not fully prevented by tenant IAM.
