schema_version: 2.0.0
type: mitigation
id: MIT-000200
name:
  zh: 角色绑定协议中介与加密前数据控制
  en: Role-Bound Protocol Mediation and Pre-Encryption Data Control
summary:
  zh: 按工作负载限定协议、中介和接收端，在数据进入不透明或响应式通道前实施敏感内容控制。
  en: Constrain protocol, intermediary, and receiver by workload and apply sensitive-data controls before content enters an
    opaque or response-based channel.
description:
  paragraphs:
  - zh: 该控制把网络默认拒绝、受管 DNS/邮件/Web 中介、端点 DLP 与服务发布路径治理组成同一出口政策。协议只从获准角色和中介到达获准接收端；敏感文件在加密或协议字段嵌入之前由端点控制判断；对外服务目录只允许部署主体写入并保留文件到请求的关联。措施需要审计优先部署、带期限例外和业务连续性评估。
    en: This control combines network default-deny, managed DNS, mail and web intermediaries, endpoint DLP, and service-publication
      governance in one egress policy. Protocols reach approved receivers only from approved roles and intermediaries. Endpoint
      controls judge sensitive files before encryption or protocol-field embedding. Victim-facing served locations accept
      writes only from deployment principals and preserve file-to-request joins. Measures need audit-first rollout, time-bounded
      exceptions, and business-continuity review.
domains:
- enterprise
measures:
- key: role-bound-protocol-mediation
  name:
    zh: 按角色绑定协议与中介
    en: Role-Bound Protocol and Intermediary
  description:
    paragraphs:
    - zh: 终端仅经受管解析器发起 DNS、仅经邮件中继发送邮件、仅经批准代理访问 Web，并按资产角色阻断不必要的外部 FTP、SFTP、SMB、SMTP、DNS/DoT 与非标准协议；每项例外绑定主体、目的地、协议、所有者和到期时间。
      en: Require endpoints to use managed resolvers for DNS, mail relays for mail, and approved proxies for web access, and
        block unnecessary external FTP, SFTP, SMB, SMTP, DNS or DoT, and nonstandard protocols by asset role. Bind each exception
        to principal, destination, protocol, owner, and expiry.
  control_type: preventive
- key: pre-encryption-sensitive-data-control
  name:
    zh: 加密前敏感数据控制
    en: Pre-Encryption Sensitive Data Control
  description:
    paragraphs:
    - zh: 在端点文件访问、浏览器/应用上传和邮件提交处按敏感标签、目的域、应用与用户执行审计、警告或阻断，使 TLS、SSH 或自定义编码前仍有内容判定点。
      en: Audit, warn, or block at endpoint file access, browser or application upload, and mail submission by sensitivity
        label, destination domain, application, and user so content remains governable before TLS, SSH, or custom encoding.
  control_type: preventive
- key: served-path-publication-governance
  name:
    zh: 对外服务发布路径治理
    en: Victim-Facing Publication Path Governance
  description:
    paragraphs:
    - zh: 将 Web 根、静态目录、导出路径和对象桶写权限限制给专用部署主体，禁止应用服务账号任意写入公开路径，并记录文件/对象 ID 到 URI、部署工单和访问请求的关系。
      en: Restrict writes to web roots, static directories, export paths, and object buckets to dedicated deployment principals,
        prevent service accounts from arbitrary publication, and record file or object ID to URI, deployment ticket, and access-request
        relationships.
  control_type: preventive
- key: cross-surface-retention
  name:
    zh: 跨观察面关联字段保留
    en: Cross-Surface Join-Field Retention
  description:
    paragraphs:
    - zh: 统一保留受管中介、端点进程/文件、连接/TLS 和服务访问日志中的设备、进程、身份、事务、对象和时间键，覆盖低吞吐与延迟拉取窗口。
      en: Retain device, process, identity, transaction, object, and time keys across managed intermediary, endpoint process
        and file, connection and TLS, and service-access logs for low-throughput and delayed-pull windows.
  control_type: detective-support
applications:
- target_ref: NJT-0191
  use:
    paragraphs:
    - zh: 按工作负载列出允许协议、中介、应用和接收端，并在端点和网络同时拒绝未授权替代通道；外传调查跨 C2 与替代路径保留同一设备和数据对象。
      en: Inventory allowed protocols, intermediaries, applications, and receivers by workload and deny unauthorized alternative
        channels at both endpoint and network. Preserve device and data-object identity across C2 and alternative-path investigation.
  expected_effect:
    paragraphs:
    - zh: 缩小攻击者可把外传迁移到另一观察面的路径集合，并使剩余例外具备可审计主体与目的地。
      en: Narrow the path set onto which an adversary can move exfiltration and give remaining exceptions auditable principals
        and destinations.
  limitations:
    paragraphs:
    - zh: 已批准应用、服务账号和接收端被控时仍可外传；严格策略可能中断研发、备份和应急运维。
      en: Compromised approved applications, service accounts, and receivers can still exfiltrate data; strict policy can
        disrupt development, backup, and emergency operations.
- target_ref: NJS-0191-001
  use:
    paragraphs:
    - zh: 仅允许终端访问企业解析器和代理，邮件只经中继，FTP/SFTP 等按角色和固定目的地授权，并记录直接连接拒绝。
      en: Allow endpoints to reach enterprise resolvers and proxies only, route mail through relays, authorize FTP or SFTP
        by role and fixed destination, and log direct-connection denials.
  expected_effect:
    paragraphs:
    - zh: 直接协议偏离在建立会话前被阻断，或至少产生带政策版本和主体的明确拒绝证据。
      en: Block direct protocol deviation before session establishment or at least produce explicit denial evidence with policy
        version and principal.
  limitations:
    paragraphs:
    - zh: DoH、协议隧道、被控中介和业务例外可绕过简单端口控制，必须结合应用识别和端点策略。
      en: DoH, protocol tunneling, compromised intermediaries, and business exceptions bypass simple port controls and require
        application identification and endpoint policy.
- target_ref: NJS-0191-002
  use:
    paragraphs:
    - zh: 强制协议经可记录事务的受管中介，并在端点把敏感读取与 DNS、邮件或 Web 提交进程关联；对未知编码只限制接收端与应用，不依赖单一熵阈值。
      en: Force protocols through managed intermediaries with transaction logs and join sensitive reads at the endpoint to
        DNS, mail, or web-submission processes. For unknown encoding, constrain receiver and application rather than relying
        on one entropy threshold.
  expected_effect:
    paragraphs:
    - zh: 缩小可隐藏载荷的协议路径，并保留跨事务重组和源数据核验所需字段。
      en: Reduce protocol paths available for hidden payload and preserve fields needed for cross-transaction reconstruction
        and source-data validation.
  limitations:
    paragraphs:
    - zh: 低吞吐、小量凭据、加密 DNS 和外部邮件可能仍不可见；过度解析会增加成本和隐私风险。
      en: Low-throughput or small credential theft, encrypted DNS, and external mail may remain invisible; deep parsing adds
        cost and privacy risk.
- target_ref: NJS-0191-003
  use:
    paragraphs:
    - zh: 在数据进入 TLS/SSH 前由端点 DLP 按文件标签、应用和目的地控制上传，并只允许受管 SFTP/HTTPS 接收端与账号。
      en: Apply endpoint DLP by file label, application, and destination before data enters TLS or SSH, and permit only managed
        SFTP or HTTPS receivers and accounts.
  expected_effect:
    paragraphs:
    - zh: 内容不透明不再消除最后的内容判定点，未知接收端在网络层仍可被阻断。
      en: Content opacity no longer removes the last content decision point, while unknown receivers remain blockable at the
        network layer.
  limitations:
    paragraphs:
    - zh: 内存生成内容、未受管设备、自定义客户端和已批准接收端滥用可绕过端点 DLP；TLS 检查并非普遍可行。
      en: In-memory content, unmanaged devices, custom clients, and abuse of approved receivers can bypass endpoint DLP; TLS
        inspection is not universally feasible.
- target_ref: NJT-0195
  use:
    paragraphs:
    - zh: 在 HTTPS/API 加密前按数据标签、应用与 receiver namespace 限制敏感上传，并连接端点源文件与服务审计。
      en: Before HTTPS or API encryption, restrict sensitive upload by data label, application, and receiver namespace and
        join endpoint source files to service audit.
  expected_effect:
    paragraphs:
    - zh: 共享服务的 TLS 外观不再消除源侧内容控制和逻辑接收者归因。
      en: Shared-service TLS appearance no longer removes source-side content control or logical receiver attribution.
  limitations:
    paragraphs:
    - zh: 缺少端点 DLP 或服务接收者字段时只能执行较粗目的域控制。
      en: Without endpoint DLP or service receiver fields, only coarse destination-domain control is possible.
- target_ref: NJS-0195-001
  use:
    paragraphs:
    - zh: 对上传应用保存端点进程、数据标签、provider 和逻辑 receiver 字段，阻断未登记组合。
      en: Retain endpoint process, data label, provider, and logical receiver fields for upload applications and block unregistered
        combinations.
  expected_effect:
    paragraphs:
    - zh: 攻击者需劫持完整批准关系，而非只选择一个受信 SaaS 域。
      en: The adversary must hijack a complete approved relationship rather than merely choose a trusted SaaS domain.
  limitations:
    paragraphs:
    - zh: 个人浏览器会话、动态 bot 和共享 token 会降低绑定精度。
      en: Personal browser sessions, dynamic bots, and shared tokens reduce binding precision.
- target_ref: NJS-0222-003
  use:
    paragraphs:
    - zh: 强制终端只使用受管 DNS resolver 和 Web proxy，阻断直接外部 DNS/DoT/未经批准 DoH 与不登记 polling 服务；在隐私和权限允许范围内保留原始 query/answer、HTTP 字段、uid、进程键和方向，使专用解析器能按
        session/fragment/offset 重组。对合法事务隧道绑定应用、域、inner semantic、用途和到期。
      en: Force endpoints through managed DNS resolvers and web proxies and block direct external DNS, DoT, unapproved DoH,
        and unregistered polling services. Within privacy and authorization limits retain raw query and answer, HTTP fields,
        uid, process key, and direction so a purpose-built parser can reassemble by session, fragment, and offset. Bind legitimate
        transaction tunnels to application, domain, inner semantic, purpose, and expiry.
  expected_effect:
    paragraphs:
    - zh: 攻击者可用的外层事务路径收窄，跨事务关联字段保留，内层会话不再因单查询/响应观察而永久丢失。
      en: Available outer transaction paths narrow, cross-transaction join fields are retained, and inner sessions are no
        longer permanently lost to single-query or response observation.
  limitations:
    paragraphs:
    - zh: 外部网络、移动设备、证书固定和隐私要求可能阻止中介检查；受管 resolver 被控、域名获准或未知加密 framing 时仍需端点解析与结果检测。
      en: External networks, mobile devices, certificate pinning, and privacy requirements may prevent intermediary inspection.
        A compromised managed resolver, approved domain, or unknown encrypted framing still requires endpoint parsing and
        outcome detection.
