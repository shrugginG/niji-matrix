schema_version: 2.0.0
type: mitigation
id: MIT-000201
name:
  zh: C2 关系终止与敏感读取进程出口控制
  en: C2-Relationship Termination and Sensitive-Reader Egress Control
summary:
  zh: 终止已确认的恶意 C2 关系，并限制读取敏感数据的进程继续向其控制端外送。
  en: Terminate confirmed malicious C2 relationships and constrain processes that read sensitive data from continuing
    egress to their controllers.
description:
  paragraphs:
  - zh: 本缓解把网络关系处置与源侧数据控制连接起来：确认恶意 C2 后，先保全控制消息、敏感读取和出站证据，再阻断控制端、撤销植入运行与持久化，并限制同一进程或服务身份读取敏感对象后的外联。它针对既有 C2 关系复用，不以通用字节预算替代关系终止。
    en: This mitigation joins network-relationship response to source-side data control. After confirming malicious
      C2, preserve control messages, sensitive reads, and outbound evidence before blocking the controller, removing
      implant execution and persistence, and restricting egress by the same process or service identity after sensitive
      access. It targets reuse of an existing C2 relationship rather than substituting a generic byte budget for
      relationship termination.
domains:
- enterprise
measures:
- key: process-role-egress-policy
  name:
    zh: process role egress policy
    en: Process Role Egress Policy
  description:
    paragraphs:
    - zh: 对保存敏感数据的资产采用拒绝为默认的出站策略，以进程或工作负载身份、目的服务、协议和业务角色批准连接；将直接互联网访问汇聚到可保留原主机与应用身份的受管代理，并定期清理无业务依据的例外。
      en: Apply deny-by-default egress on assets holding sensitive data, approving connections by process or workload
        identity, destination service, protocol, and business role. Route direct Internet access through managed
        proxies that retain originating host and application identity, and remove exceptions lacking current business
        justification.
  control_type: preventive
- key: validated-c2-relationship-termination
  name:
    zh: validated c2 relationship termination
    en: Validated C2 Relationship Termination
  description:
    paragraphs:
    - zh: 确认 C2 关系后，在端点、代理和边界设备同时隔离主机、终止现有连接、封锁域名/IP/证书或服务身份、移除植入与持久化，并验证控制端、备用目的地和重连尝试不再可达。
      en: After validating a C2 relationship, isolate the host, terminate existing connections, block the domain,
        IP, certificate, or service identity at endpoint, proxy, and boundary layers, remove the implant and persistence,
        and verify that the controller, alternate destinations, and reconnection attempts are no longer reachable.
  control_type: containment
- key: sensitive-read-egress-enforcement
  name:
    zh: sensitive read egress enforcement
    en: Sensitive Read Egress Enforcement
  description:
    paragraphs:
    - zh: 将敏感对象标签与读取进程、网络目的关系和批准任务连接；对未获授权的读取后外联执行阻断、隔离或人工放行，并保留关系内字节和消息证据供响应核查。
      en: Join sensitive-object labels to the reading process, network destination relationship, and approved job.
        Block, isolate, or require review for unauthorized post-read egress, retaining in-relationship byte and
        message evidence for response.
  control_type: exposure-reduction
applications:
- target_ref: NJT-0192
  use:
    paragraphs:
    - zh: 为持有敏感数据的主机限定可以外联的进程—目的—协议组合；一旦验证某组合为 C2，不等待新的外传连接，立即终止现有关系、隔离端点并调查该关系建立以来的全部出站量和数据访问。
      en: Restrict process-destination-protocol combinations allowed from hosts holding sensitive data. Once a combination
        is validated as C2, terminate the existing relationship and isolate the endpoint without waiting for a new
        exfiltration connection, then investigate all outbound volume and data access since the relationship began.
  expected_effect:
    paragraphs:
    - zh: 攻击者可复用的控制关系在确认后同时失去任务与数据交付能力，且建立替代关系需要留下新的目的或会话痕迹。
      en: Once confirmed, the reusable control relationship loses both tasking and data-delivery capability, forcing
        the attacker to create an alternative relationship with new destination or session traces.
  limitations:
    paragraphs:
    - zh: 在确认前已经送出的数据无法追回；共享云或 CDN、被入侵的合法管理工具和快速轮换基础设施可能使关系级封锁产生业务影响或被替换，处置必须同时清除端点植入与凭据。
      en: Data sent before validation cannot be recovered. Shared cloud or CDN infrastructure, compromised legitimate
        management tools, and rapidly rotating infrastructure can make relationship blocking disruptive or replaceable,
        so response must also remove the endpoint implant and compromised credentials.
- target_ref: NJS-0192-001
  use:
    paragraphs:
    - zh: 对批准的周期代理定义可发送字段、对象类别与最大诊断范围，把敏感读取后出现的未批准字段或附件作为阻断或隔离条件；对已确认恶意的客户端标识和回调模板在代理与端点同时失效。
      en: Define permitted fields, object classes, and diagnostic scope for approved periodic agents. Treat unapproved
        fields or attachments following sensitive access as a block or isolation condition, and invalidate confirmed-malicious
        client identities and callback templates at both proxy and endpoint.
  expected_effect:
    paragraphs:
    - zh: 控制回路不能无限扩展为任意数据出口，攻击者必须改变消息族、突破过程策略或建立新通道，从而产生新的可观察差异。
      en: The control loop cannot expand into an unrestricted data outlet; the attacker must change the message
        family, defeat process policy, or create a new channel, producing new observable differences.
  limitations:
    paragraphs:
    - zh: 未知或频繁变化的自定义协议难以预先定义字段契约，端到端加密会阻止代理执行内容策略；仅限消息大小也可能被切块规避，必须与累计关系和端点读取控制结合。
      en: Field contracts are difficult to predefine for unknown or frequently changing custom protocols, and end-to-end
        encryption prevents proxy content enforcement. Size-only limits can be bypassed by chunking and must be
        combined with relationship accumulation and endpoint read controls.
