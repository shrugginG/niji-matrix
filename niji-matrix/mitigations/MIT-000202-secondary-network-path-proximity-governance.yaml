schema_version: 2.0.0
type: mitigation
id: MIT-000202
name:
  zh: 次要网络路径与近距 peer 治理
  en: Secondary Network Path and Proximity-Peer Governance
summary:
  zh: 通过接口最小化、批准网络和路由固定、近距服务限制、按接口审计与外送策略一致化，减少未经监测的旁路网络外传机会。
  en: Reduce unmonitored bypass-network exfiltration through interface minimization, pinned approved networks and
    routes, restricted proximity services, per-interface audit, and consistent egress policy.
description:
  paragraphs:
  - zh: 通过接口最小化、批准网络和路由固定、近距服务限制、按接口审计与外送策略一致化，减少未经监测的旁路网络外传机会。
    en: Reduce unmonitored bypass-network exfiltration through interface minimization, pinned approved networks
      and routes, restricted proximity services, per-interface audit, and consistent egress policy.
domains:
- enterprise
measures:
- key: disable-unused-secondary-interfaces
  name:
    zh: 禁用不需要的次要网络接口
    en: Disable unnecessary secondary network interfaces
  description:
    paragraphs:
    - zh: 通过固件、MDM、系统策略和设备管理禁用业务不需要的 Wi-Fi、WWAN、调制解调器、Bluetooth/NFC 数据服务和外接网络适配器，并防止普通用户重新启用或创建新 adapter。
      en: Use firmware, MDM, OS policy, and device management to disable unneeded Wi-Fi, WWAN, modem, Bluetooth
        or NFC data services, and external network adapters, preventing ordinary users from re-enabling or creating
        adapters.
  control_type: exposure-reduction
- key: pin-approved-networks-routes
  name:
    zh: 固定批准网络、profile 与路由
    en: Pin approved networks, profiles, and routes
  description:
    paragraphs:
    - zh: 对需要多接口的资产固定 SSID/APN/eSIM/profile、网关、DNS、路由优先级、允许目的地和服务身份，禁止未批准热点及同时存在的独立默认路由；合法故障切换需时限和工单。
      en: For multi-interface assets, pin SSID, APN, eSIM, profile, gateway, DNS, route preference, allowed destinations,
        and service identity, denying unapproved hotspots and simultaneous independent default routes. Authorized
        failover requires expiry and a change record.
  control_type: preventive
- key: restrict-proximity-data-services
  name:
    zh: 限制近距数据服务与 peer
    en: Restrict proximity data services and peers
  description:
    paragraphs:
    - zh: 按资产角色仅允许必要的 peer class 与 service/profile，关闭 discoverable、文件接收、PAN 和自定义 advertisement 数据功能，要求受管配对、用户可见确认与过期清理。
      en: Allow only necessary peer classes and services or profiles by asset role, disable discoverable, file receipt,
        PAN, and custom advertisement data functions, and require managed pairing, visible user confirmation, and
        expiration cleanup.
  control_type: preventive
- key: uniform-egress-and-interface-audit
  name:
    zh: 跨接口一致外送控制与生命周期审计
    en: Uniform egress control and interface lifecycle audit
  description:
    paragraphs:
    - zh: 将 DLP/主机防火墙和目的地策略应用到所有可用接口，集中 adapter/route/peer 生命周期、按接口方向字节和发起进程，并验证主要边界覆盖范围。
      en: Apply DLP, host firewall, and destination policy across every usable interface, centralize adapter, route,
        and peer lifecycle, directional bytes by interface, and initiating process, and verify primary-boundary
        coverage.
  control_type: detective-support
- key: revoke-bypass-path
  name:
    zh: 旁路路径撤销与证据保全
    en: Bypass-path revocation and evidence preservation
  description:
    paragraphs:
    - zh: 确认未授权外送后保全 adapter/profile/route、peer/session、进程、字节与文件证据，再禁用接口、撤销 eSIM/APN/配对、阻断目的地并核查接收范围。
      en: After confirming unauthorized sending, preserve adapter, profile, route, peer, session, process, byte,
        and file evidence before disabling the interface, revoking eSIM, APN, or pairing, blocking destination,
        and assessing receipt scope.
  control_type: containment
applications:
- target_ref: NJT-0193
  use:
    paragraphs:
    - zh: 盘点每台资产的全部联网与近距接口，明确主要出口、允许旁路、peer 数据服务和传感器覆盖，并将同一外送策略应用到所有路径。
      en: Inventory every network and proximity interface on each asset, define primary egress, allowed bypasses,
        peer data services, and sensor coverage, and apply one egress policy across all paths.
  expected_effect:
    paragraphs:
    - zh: 未登记介质不能仅因绕开企业网关而获得外送通路，接口与 peer 变化留下可关联证据。
      en: An unregistered medium cannot gain an egress path merely by bypassing the enterprise gateway, and interface
        and peer changes leave correlatable evidence.
  limitations:
    paragraphs:
    - zh: 基带/固件级行为、物理植入 radio 和第三方运营网络不可由端点策略完全控制，多接口业务会产生管理成本。
      en: Baseband or firmware behavior, physically implanted radios, and third-party carrier networks cannot be
        fully controlled by endpoint policy, and multi-interface business creates management cost.
- target_ref: NJS-0193-001
  use:
    paragraphs:
    - zh: 固定允许的次要 adapter、network profile、gateway 和服务身份，阻止并发独立默认路由，并对故障切换设置工单与自动到期。
      en: Pin allowed secondary adapters, network profiles, gateways, and service identities, prevent concurrent
        independent default routes, and place failover under tickets and automatic expiry.
  expected_effect:
    paragraphs:
    - zh: 攻击者必须改变可审核配置或劫持批准身份才能通过外部网络发送，LocalIP—adapter—route 差分更明确。
      en: The adversary must change auditable configuration or hijack an approved identity to send through an outside
        network, creating a clearer LocalIP-to-adapter-to-route differential.
  limitations:
    paragraphs:
    - zh: 合法应急连接和差旅场景需要例外；受控企业 WWAN 被劫持时仍可能符合 profile。
      en: Legitimate emergency and travel connectivity needs exceptions, and abuse of managed enterprise WWAN may
        still match its profile.
- target_ref: NJS-0193-002
  use:
    paragraphs:
    - zh: 在服务器和固定高价值终端关闭近距数据服务；确需使用时固定 peer class/service/profile、禁止未知文件/PAN、自定义广播数据，并记录配对和方向字节。
      en: Disable proximity data services on servers and fixed high-value endpoints. Where required, pin peer class,
        service or profile, deny unknown file, PAN, and custom advertisement data use, and record pairing and directional
        bytes.
  expected_effect:
    paragraphs:
    - zh: 近距接收者必须进入批准关系或触发可见策略变化，发现/会话/发送三层更易关联。
      en: A nearby receiver must enter an approved relationship or trigger a visible policy change, making discovery,
        session, and send layers easier to join.
  limitations:
    paragraphs:
    - zh: 地址随机化、被控批准 peer、被动 advertisement 接收和无操作系统可见性的 radio 固件会削弱控制。
      en: Address randomization, a compromised approved peer, passive advertisement receipt, and radio firmware
        outside OS visibility weaken the control.
