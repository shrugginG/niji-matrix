schema_version: 2.0.0
type: mitigation
id: MIT-000203
name:
  zh: Web 服务接收者、对象与工作流治理
  en: Web-Service Receiver Object and Workflow Governance
summary:
  zh: 把 Web 服务访问细化到接收命名空间、对象生命周期与工作流授权，并持续导出可关联审计。
  en: Govern web-service access at receiver-namespace, object-lifecycle, and workflow-authorization levels and continuously
    export joinable audit.
description:
  paragraphs:
  - zh: 该控制不把知名 SaaS 域名视为完整信任边界。组织为每个服务登记允许的 tenant/account/chat/repo/webhook、应用、数据类别与所有者；限制对象公开/外部共享和秘密发布；对 Webhook/集成实行最小
      scope、批准回调、签名、到期和凭据轮换；把服务审计与端点源数据长期关联。端点加密前 DLP 和累计上传预算由 MIT-000200/MIT-000156 补充。
    en: This control does not treat a well-known SaaS domain as a complete trust boundary. For each service, the organization
      registers permitted tenants, accounts, chats, repositories, and webhooks plus applications, data classes, and owners;
      restricts public or external object sharing and secret publication; governs webhooks and integrations with least
      scope, approved callbacks, signing, expiry, and credential rotation; and joins service audit to endpoint source
      data over time. MIT-000200 and MIT-000156 supplement it with pre-encryption endpoint DLP and cumulative upload
      budgets.
domains:
- enterprise
measures:
- key: receiver-namespace-authorization
  name:
    zh: 接收命名空间授权
    en: Receiver Namespace Authorization
  description:
    paragraphs:
    - zh: 对允许的 Web 服务按 tenant、account、chat/channel、repository/container、webhook ID、应用和数据类别建立正向清单；代理/CASB、端点 DLP 或服务策略对未知接收者审计、警告或阻断，并给例外设置所有者与到期。
      en: Positively inventory allowed web services by tenant, account, chat or channel, repository or container, webhook
        ID, application, and data class. Have proxy or CASB, endpoint DLP, or service policy audit, warn, or block unknown
        receivers and give exceptions an owner and expiry.
  control_type: preventive
- key: object-lifecycle-policy
  name:
    zh: 服务对象生命周期与可见性政策
    en: Service Object Lifecycle and Visibility Policy
  description:
    paragraphs:
    - zh: 限制公开仓库、匿名链接、外部共享、粘贴和个人存储；要求秘密/敏感内容扫描、批准创建者、默认私有、保留/删除策略及 object ID 级审计，防止新对象成为匿名会合点。
      en: Restrict public repositories, anonymous links, external sharing, pastes, and personal storage. Require secret
        and sensitive-content scanning, approved creators, private-by-default state, retention and deletion policy, and
        object-ID-level audit so a new object cannot become an anonymous rendezvous.
  control_type: preventive
- key: workflow-webhook-governance
  name:
    zh: 工作流与 Webhook 授权治理
    en: Workflow and Webhook Authorization Governance
  description:
    paragraphs:
    - zh: 仅允许批准主体创建或修改集成，精确限制事件/对象 scope 与 callback 域，验证签名和发布者，记录 secret hash、old/new state 与投递结果，并实行定期复核、自动到期和快速撤销。
      en: Permit only approved principals to create or modify integrations, narrowly constrain event or object scope
        and callback domain, validate signing and publisher, record secret hash, old and new state, and delivery results,
        and enforce periodic review, automatic expiry, and rapid revocation.
  control_type: governance
- key: provider-audit-export
  name:
    zh: 提供方审计持续导出与保留
    en: Continuous Provider Audit Export and Retention
  description:
    paragraphs:
    - zh: 持续导出 actor/app/token、tenant、receiver、object、visibility、workflow、request/correlation 和 delivery 字段，并与端点设备、进程、用户和
        source set 对齐，保留期覆盖异步读取与长期 Webhook。
      en: Continuously export actor or application or token, tenant, receiver, object, visibility, workflow, request
        or correlation, and delivery fields and align them with endpoint device, process, user, and source set, retaining
        them across asynchronous reads and long-lived webhooks.
  control_type: detective-support
applications:
- target_ref: NJT-0195
  use:
    paragraphs:
    - zh: 对所有批准 Web 服务登记具体接收者、应用、对象类型与数据类别，并把未知账号/仓库/聊天/Webhook 或公共发布置于审计和阻断。
      en: Register concrete receivers, applications, object types, and data classes for every approved web service and
        audit or block unknown accounts, repositories, chats, webhooks, or public publication.
  expected_effect:
    paragraphs:
    - zh: 服务域名允许不再等于任意租户/对象允许，攻击者需取得受管接收命名空间或产生明确审计偏差。
      en: Allowing a service domain no longer allows arbitrary tenants or objects, forcing the adversary to obtain a
        governed receiver namespace or create an explicit audit deviation.
  limitations:
    paragraphs:
    - zh: 外部个人租户、服务 API 字段差异和无法检查的客户端可能阻断 namespace 解析；过严政策会影响协作和客户交付。
      en: Outside personal tenants, provider API differences, and opaque clients can prevent namespace resolution, while
        strict policy can disrupt collaboration and customer delivery.
- target_ref: NJS-0195-001
  use:
    paragraphs:
    - zh: 将 provider 与 receiver 分别授权，bot token、chat/repo/account/webhook ID 使用稳定 hash 或对象 ID 管理，禁止只对白名单域放行。
      en: Authorize provider and receiver separately, manage bot-token, chat, repository, account, and webhook IDs through
        stable hashes or object IDs, and prohibit domain-only allowlisting.
  expected_effect:
    paragraphs:
    - zh: 可信服务外观不能自动掩护陌生接收者，端点或 CASB 可在首个上传时警告或阻断。
      en: Trusted service appearance no longer automatically covers an unfamiliar receiver, allowing endpoint or CASB
        warning or blocking on the first upload.
  limitations:
    paragraphs:
    - zh: 服务不暴露接收者、token 动态轮换或共享频道业务复杂时需要人工例外和服务端审计。
      en: Services that hide receivers, rotate tokens dynamically, or support complex shared-channel business require
        human exceptions and provider-side audit.
- target_ref: NJS-0195-002
  use:
    paragraphs:
    - zh: 限制公开/匿名对象和可见性变更，开启秘密与敏感数据扫描，要求对象所有者、业务理由、读取者和到期，并阻止未批准主体把私有对象公开。
      en: Restrict public and anonymous objects and visibility changes, enable secret and sensitive-data scanning, require
        object owner, business reason, readers, and expiry, and prevent unapproved principals from making private objects
        public.
  expected_effect:
    paragraphs:
    - zh: 服务对象更难成为长期匿名会合点，创建—公开—读取链可被审计并在读取前撤销。
      en: Service objects become harder to use as long-lived anonymous rendezvous, and creation-to-publication-to-read
        chains can be audited and revoked before retrieval.
  limitations:
    paragraphs:
    - zh: 外部个人仓库或存储不受租户政策控制，内容编码可能绕过扫描，匿名读取日志也可能缺失。
      en: Outside personal repositories or storage escape tenant policy, encoded content can evade scanning, and anonymous-read
        logs may be absent.
- target_ref: NJS-0195-003
  use:
    paragraphs:
    - zh: 对 Webhook/集成实行管理员或审批工作流、最小事件 scope、callback 域清单、签名验证、凭据轮换、自动到期和投递日志；scope/URL 改变触发重新审批。
      en: Require administrator or approval workflow, minimum event scope, callback-domain allowlist, signature validation,
        credential rotation, automatic expiry, and delivery logs for webhooks and integrations, with scope or URL changes
        forcing reapproval.
  expected_effect:
    paragraphs:
    - zh: 攻击者不能静默把服务变成长期发送主体，未经批准的配置或首次投递会产生可操作证据。
      en: The adversary cannot silently turn the service into a long-lived sender, and unapproved configuration or first
        delivery creates actionable evidence.
  limitations:
    paragraphs:
    - zh: 被控既有集成、供应商内部转发和无投递日志的服务仍可隐藏最终端点；撤销可能中断业务自动化。
      en: Compromised existing integrations, provider-internal forwarding, and services without delivery logs can hide
        the final endpoint; revocation can interrupt business automation.
- target_ref: NJT-0209
  use:
    paragraphs:
    - zh: 把 provider 允许拆分为命名空间、app/token、对象范围和端点进程允许；确认任务资源后撤销 token、隔离账号、删除对象并阻断进程。
      en: Decompose provider allowance into namespace, application or token, object scope, and endpoint-process authorization.
        After confirming a task resource, revoke token, isolate account, delete object, and block the process.
  expected_effect:
    paragraphs:
    - zh: 知名域名不再授权任意控制资源，攻击者须滥用已批准命名空间或产生 tenant/app/object 审计差。
      en: A well-known domain no longer authorizes arbitrary control resources, forcing abuse of an approved namespace
        or an auditable tenant, application, or object deviation.
  limitations:
    paragraphs:
    - zh: 外部个人 tenant、隐藏资源 ID、客户端加密和许可不足会限制控制；严格 tenant 政策可能影响合作伙伴与个人账号业务。
      en: Outside personal tenants, hidden resource IDs, client encryption, and licensing gaps limit controls; strict
        tenant policy can disrupt partner and personal-account business.
- target_ref: NJS-0209-001
  use:
    paragraphs:
    - zh: 绑定 provider 到批准 tenant/account/app/token/object prefix 与进程，最小化 OAuth scopes，禁止 provider 域整体豁免。
      en: Bind each provider to approved tenant, account, application, token, object prefix, and process, minimize OAuth
        scopes, and prohibit provider-domain-wide exemption.
  expected_effect:
    paragraphs:
    - zh: 外部控制命名空间在首次认证/API 请求形成策略差，可隔离真实账号/应用而不封禁整个服务。
      en: An outside control namespace creates a policy differential on first authentication or API request, allowing
        isolation of the real account or application without blocking the whole service.
  limitations:
    paragraphs:
    - zh: 浏览器个人账号、多租户应用和被窃批准账号仍需对象行为与端点后果。
      en: Browser personal accounts, multitenant applications, and stolen approved accounts still require object behavior
        and endpoint outcome.
- target_ref: NJS-0209-002
  use:
    paragraphs:
    - zh: 保留任务对象与删除事件，限制公共帖子/仓库/匿名链接/个人 drive，以 actor/app/object ID、版本和端点后果定位并移除对象。
      en: Retain task-object and deletion events, restrict public posts, repositories, anonymous links, and personal
        drives, and use actor, application, object ID, version, and endpoint outcome to locate and remove objects.
  expected_effect:
    paragraphs:
    - zh: 对象难以成为无审计任务队列，publish—read—execute—result 链可被恢复和打断。
      en: Objects become harder to use as unaudited task queues, and the publish-to-read-to-execute-to-result chain can
        be recovered and interrupted.
  limitations:
    paragraphs:
    - zh: 攻击者外部资源不受组织政策控制，公共读取可能无身份日志，快速删除和编码减少证据；提供方协作仍关键。
      en: Actor-owned outside resources do not obey organizational policy, public reads may lack identity logs, and rapid
        deletion and encoding reduce evidence. Provider cooperation remains critical.
