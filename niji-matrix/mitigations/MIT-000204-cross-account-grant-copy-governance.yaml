schema_version: 2.0.0
type: mitigation
id: MIT-000204
name:
  zh: 云数据跨账户授权与副本治理
  en: Cloud-Data Cross-Account Entitlement and Replica Governance
summary:
  zh: 限制可向外部账户授予云对象权利或创建独立副本的主体与目标，结合敏感度 DLP、账户 allowlist、密钥分权、到期复核和撤销后接收核查。
  en: Constrain principals and destinations permitted to grant cloud-object rights or create independent replicas,
    combining sensitivity-aware DLP, account allowlists, key separation, expiry review, and post-revocation receipt
    investigation.
description:
  paragraphs:
  - zh: 限制可向外部账户授予云对象权利或创建独立副本的主体与目标，结合敏感度 DLP、账户 allowlist、密钥分权、到期复核和撤销后接收核查。
    en: Constrain principals and destinations permitted to grant cloud-object rights or create independent replicas,
      combining sensitivity-aware DLP, account allowlists, key separation, expiry review, and post-revocation receipt
      investigation.
domains:
- enterprise
measures:
- key: external-account-entitlement-allowlist
  name:
    zh: 外部账户、domain 与角色允许清单
    en: External account, domain, and role allowlist
  description:
    paragraphs:
    - zh: 默认禁止高价值站点、drive、bucket、snapshot 和 backup 向组织外分享；确需协作时绑定 target account/domain、sponsor、对象范围、最小 role、用途和到期，禁止匿名链接或未归属账户。
      en: Deny external sharing by default for high-value sites, drives, buckets, snapshots, and backups. Where
        collaboration is required, bind target account or domain, sponsor, object scope, minimum role, purpose,
        and expiry and deny anonymous links or unowned accounts.
  control_type: preventive
- key: sensitivity-aware-cross-account-dlp
  name:
    zh: 敏感对象跨账户 DLP 门禁
    en: Sensitivity-aware cross-account DLP gate
  description:
    paragraphs:
    - zh: 对敏感标签、PII、凭据、源代码和受监管数据在 share/ownership/copy 前执行策略，阻止未批准 target principal 或 destination account，并把例外写入可审计工单。
      en: Evaluate sensitivity labels, PII, credentials, source code, and regulated data before share, ownership,
        or copy, blocking unapproved target principals or destination accounts and recording exceptions in auditable
        tickets.
  control_type: preventive
- key: replica-and-key-authority-separation
  name:
    zh: 副本、跨账户权限与密钥分权
    en: Separate replica, cross-account permission, and key authority
  description:
    paragraphs:
    - zh: 分离 snapshot/backup create、跨账户 permission、copy/restore 与 KMS grant 权限，启用 public-sharing block、组织策略、JIT/双人批准和固定
        DR/备份账户，避免单一 owner 身份完成整条链。
      en: Separate snapshot or backup create, cross-account permission, copy or restore, and KMS grant authority;
        enable public-sharing blocks, organization policies, JIT or dual approval, and pinned DR or backup accounts
        so one owner identity cannot complete the chain.
  control_type: exposure-reduction
- key: entitlement-replica-lifecycle-audit
  name:
    zh: 授权与副本全生命周期审计
    en: Full entitlement and replica lifecycle audit
  description:
    paragraphs:
    - zh: 远端保留 grant/accept/access/download/revoke 与 create/share/copy/restore/new-object/delete，并定期重建 current permission
        和跨账户 resource registry；service principal 必须有 owner、workflow、源范围和到期。
      en: Retain grant, accept, access, download, revoke, create, share, copy, restore, new object, and delete remotely
        and rebuild current permissions and cross-account resource registries periodically. Every service principal
        requires owner, workflow, source scope, and expiry.
  control_type: detective-support
- key: revoke-and-receipt-assessment
  name:
    zh: 撤销、令牌密钥轮换与既有接收核查
    en: Revoke, rotate tokens and keys, and assess prior receipt
  description:
    paragraphs:
    - zh: 确认未授权 transfer 后撤销 external grant/link/guest、SAS/token、snapshot permission 和 KMS grant，保全日志并核查 accept/access/download/copy/restore。对独立副本请求组织/提供方处置，不能把源侧
        revoke 当作数据收回。
      en: After unauthorized transfer, revoke external grant, link, guest, SAS or token, snapshot permission, and
        KMS grant; preserve logs and assess accept, access, download, copy, and restore. Seek organization or provider
        action for independent replicas rather than treating source-side revoke as data recovery.
  control_type: containment
applications:
- target_ref: NJT-0196
  use:
    paragraphs:
    - zh: 对所有云服务建立 source account/object—target account—effective right or new object 的登记与门禁，统一 SaaS 分享和 IaaS 副本的账户边界。
      en: Establish registration and gates for source account and object to target account to effective right or
        new object across all cloud services, unifying the account boundary for SaaS sharing and IaaS replicas.
  expected_effect:
    paragraphs:
    - zh: 攻击者不能仅借用正常云 API 或服务身份把数据控制移出组织，跨账户操作获得可核查 owner、用途、到期和结果。
      en: An adversary cannot move data control outside the organization merely by borrowing normal cloud APIs or
        service identities, and cross-account operations gain verifiable owner, purpose, expiry, and outcome.
  limitations:
    paragraphs:
    - zh: 被盗批准身份、目标账户被攻陷、匿名 bearer token 和提供方内部不可见行为仍会绕过部分控制；业务协作需要精细例外。
      en: A stolen approved identity, compromised destination account, anonymous bearer token, or provider-internal
        invisible behavior can bypass parts of the control, and business collaboration needs precise exceptions.
- target_ref: NJS-0196-001
  use:
    paragraphs:
    - zh: 对高价值对象限制 external domain/account 和最大 role，要求 specific target、sponsor 与到期，启用敏感度 DLP，并把 grant 与后继 access/download
        和 revoke 连接。
      en: Restrict external domains and accounts and maximum role for high-value objects, require a specific target,
        sponsor, and expiry, enable sensitivity-aware DLP, and join grant to successor access or download and revoke.
  expected_effect:
    paragraphs:
    - zh: 未批准主体难以获得原对象持续权利，正常分享界面仍留下 target、object 和访问结果以供快速撤销。
      en: Unapproved principals have greater difficulty gaining continuing rights to the original object, while
        ordinary sharing interfaces leave target, object, and access outcomes for rapid revocation.
  limitations:
    paragraphs:
    - zh: 撤销不能收回已经下载的内容；Google 等服务的残余 permission 可能在上层策略重新放开后恢复访问，需清理底层 grant。
      en: Revocation cannot recover downloaded content, and residual permissions in services such as Google may
        restore access if a higher-level restriction is relaxed, requiring cleanup of the underlying grant.
- target_ref: NJS-0196-002
  use:
    paragraphs:
    - zh: 仅允许固定 DR/备份/迁移账户接收 snapshot 或 backup，分离 share/copy/KMS 权限，记录 source lineage 与 expected destination ID，并在
        copy 后持续盘点目标副本。
      en: Allow only pinned DR, backup, or migration accounts to receive snapshots or backups, separate share, copy,
        and KMS authority, record source lineage and expected destination ID, and inventory destination replicas
        after copy.
  expected_effect:
    paragraphs:
    - zh: 未知账户的跨账户 copy 在物化前被阻止或形成多控制点告警，完成副本也可按 lineage 定位并处置。
      en: Cross-account copy to unknown accounts is blocked before materialization or triggers multiple control
        points, and completed replicas remain locatable for response through lineage.
  limitations:
    paragraphs:
    - zh: 提供方不向源侧公开目标新 ID、合法备份账户被控或目标离开组织权限时，副本删除依赖提供方和法律响应。
      en: When the provider does not expose the destination new ID, an approved backup account is compromised, or
        the destination leaves organizational authority, replica deletion depends on provider and legal response.
