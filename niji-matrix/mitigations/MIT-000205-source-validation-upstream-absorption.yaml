schema_version: 2.0.0
type: mitigation
id: MIT-000205
name:
  zh: 源验证、反射面约束与上游吸收
  en: Source Validation, Reflector Constraint, and Upstream Absorption
summary:
  zh: 阻止伪造源、限制可被反射的服务并在上游扩容/清洗汇聚洪泛，降低网络 DoS。
  en: Prevent spoofed sources, constrain reflector services, and absorb or scrub aggregate floods upstream to reduce
    network DoS.
description:
  paragraphs:
  - zh: 该控制在来源、反射服务与目的上游三个位置降低攻击。边界执行 BCP38/源验证，递归/UDP 服务限制访问与响应，目标预置 Anycast/CDN/清洗和联络流程；容量与路由变化由不同权监控验证。
    en: This control reduces attacks at source, reflector service, and destination upstream. Boundaries enforce BCP38
      or source validation, recursive or UDP services restrict access and responses, and targets prearrange Anycast,
      CDN, scrubbing, and contacts; differently authorized monitoring verifies capacity and routing changes.
domains:
- enterprise
measures:
- key: source-address-validation
  name:
    zh: 源地址验证
    en: Source-Address Validation
  description:
    paragraphs:
    - zh: 在可控边界实施 ingress/egress source validation/uRPF 等，阻断不属于来源网络的伪造地址并监测丢弃。
      en: Apply ingress or egress source validation or uRPF at controlled boundaries to block addresses not belonging
        to the source network and monitor drops.
  control_type: preventive
- key: reflector-surface-hardening
  name:
    zh: 反射服务面约束
    en: Reflector-Service Surface Hardening
  description:
    paragraphs:
    - zh: 限制开放递归/未授权 UDP 服务，应用 ACL、response rate limiting 和最小响应，修复可放大配置。
      en: Restrict open recursion and unauthorized UDP services and apply ACLs, response-rate limiting, and minimal
        responses, fixing amplifier configurations.
  control_type: exposure-reduction
- key: upstream-absorption-response
  name:
    zh: 上游吸收与响应编排
    en: Upstream Absorption and Response Orchestration
  description:
    paragraphs:
    - zh: 按业务容量预置 Anycast/CDN/清洗、RTBH/FlowSpec 或 provider playbook，保留合法流量保护与撤销条件。
      en: Prearrange Anycast, CDN, scrubbing, RTBH or FlowSpec, or provider playbooks by business capacity, preserving
        legitimate-traffic protection and rollback conditions.
  control_type: containment
applications:
- target_ref: NJT-0198
  use:
    paragraphs:
    - zh: 对关键前缀建立容量/业务基线和上游清洗入口，实施源验证与反射服务治理，并定期演练 provider 通知和业务保护。
      en: Establish capacity and business baselines and upstream scrubbing for critical prefixes, deploy source validation
        and reflector governance, and exercise provider notification and business protection.
  expected_effect:
    paragraphs:
    - zh: 降低可用攻击流量、提高目标可吸收容量并缩短洪泛持续时间。
      en: Reduce available attack traffic, increase absorbable capacity, and shorten flood duration.
  limitations:
    paragraphs:
    - zh: 源验证需要跨网络采用，Anycast/清洗有成本且可被更大攻击压倒，误触发会影响合法流量。
      en: Source validation needs cross-network adoption, Anycast or scrubbing costs money and can be overwhelmed,
        and false activation can affect legitimate traffic.
- target_ref: NJS-0198-001
  use:
    paragraphs:
    - zh: 使用目的级全局限额和清洗，不依赖单源限速；跨域聚合小贡献来源并保护已验证合法事件。
      en: Use destination-level global limits and scrubbing rather than per-source limits alone; aggregate small contributors
        across domains while protecting verified legitimate events.
  expected_effect:
    paragraphs:
    - zh: 多源分散不能通过每源低速绕过总体容量门。
      en: Distributed sources cannot bypass aggregate capacity gates through low per-source rates.
  limitations:
    paragraphs:
    - zh: flash crowds 同形，过紧全局门会拒绝真实用户；跨域数据可能延迟。
      en: Flash crowds are isomorphic, strict global gates can deny real users, and cross-domain data can be delayed.
- target_ref: NJS-0198-002
  use:
    paragraphs:
    - zh: 实施 BCP38/源验证，关闭开放 reflector 并对 DNS/NTP 等应用 ACL/RRL；与 provider 共享反射协议指纹和无请求响应证据。
      en: Implement BCP38 or source validation, close open reflectors, apply ACLs or RRL to DNS, NTP, and peers, and
        share reflection fingerprints and unmatched-response evidence with providers.
  expected_effect:
    paragraphs:
    - zh: 伪造受害源和可用 reflector 数量下降，第三方响应洪泛更快被归因和阻断。
      en: Victim-source spoofing and available reflectors decline, and third-party response floods are attributed
        and blocked faster.
  limitations:
    paragraphs:
    - zh: 无法控制外部 reflector，部分协议需要公开 UDP；不完整全球部署仍允许反射。
      en: External reflectors are outside control, some protocols need public UDP, and incomplete global deployment
        still permits reflection.
