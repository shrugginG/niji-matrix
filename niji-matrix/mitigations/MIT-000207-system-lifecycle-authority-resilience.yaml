schema_version: 2.0.0
type: mitigation
id: MIT-000207
name:
  zh: 系统生命周期权限与可用性韧性
  en: System Lifecycle Authority and Availability Resilience
summary:
  zh: 限制本地、调度与外部管理面的关机/重启权限，并以审批、不可变审计和高可用降低恶意生命周期影响。
  en: Restrict shutdown and reboot authority across local, scheduled, and external management planes and reduce malicious
    lifecycle impact through approval, immutable audit, and availability resilience.
description:
  paragraphs:
  - zh: 此控制把生命周期 action 视为高影响事务。最小化 SeShutdown/remote power/hypervisor 权限，对关键系统要求 JIT、MFA、双人审批和不同权日志；未来任务需绑定 writer/definition/runtime/target/expiry；关键服务采用
      HA 与经过演练的重启恢复。
    en: This control treats lifecycle actions as high-impact transactions. Minimize local shutdown, remote power,
      and hypervisor rights, require JIT, MFA, dual approval, and differently authorized logs for critical systems,
      bind future tasks to writer, definition, runtime, target, and expiry, and use HA and exercised reboot recovery.
domains:
- enterprise
measures:
- key: least-lifecycle-authority
  name:
    zh: 最小生命周期权限
    en: Least Lifecycle Authority
  description:
    paragraphs:
    - zh: 限制本地/远程关机、云/虚拟化 power actions 和批量目标范围，关键操作使用短期身份、MFA 与双人审批。
      en: Restrict local or remote shutdown, cloud or virtualization power actions, and bulk target scope and use
        short-lived identities, MFA, and dual approval for critical actions.
  control_type: preventive
- key: future-action-governance
  name:
    zh: 未来生命周期任务治理
    en: Future Lifecycle-Task Governance
  description:
    paragraphs:
    - zh: 对 shutdown/reboot task 记录 writer、definition digest、runtime、next run、target、approval 与 expiry，并在触发前撤销异常。
      en: Record writer, definition digest, runtime, next run, target, approval, and expiry for shutdown or reboot
        tasks and revoke anomalies before triggering.
  control_type: preventive
- key: external-audit-ha-recovery
  name:
    zh: 外部审计、高可用与恢复
    en: External Audit, High Availability, and Recovery
  description:
    paragraphs:
    - zh: 在目标外保留 lifecycle audit/health，使用集群/HA、自动恢复与启动验证，并演练恶意重启后的业务一致性。
      en: Retain lifecycle audit and health outside the target, use cluster or HA, automated recovery, and boot validation,
        and exercise business consistency after malicious reboot.
  control_type: containment
applications:
- target_ref: NJT-0200
  use:
    paragraphs:
    - zh: 对主机、VM 和设备 lifecycle 权限执行最小化与审批，将本地、任务和管理面事件统一到资产 owner 与外部健康，并演练 HA/recovery。
      en: Apply least privilege and approval to host, VM, and device lifecycle authority, unify local, task, and management-plane
        events with asset owner and external health, and exercise HA and recovery.
  expected_effect:
    paragraphs:
    - zh: 未经批准关机/重启更难完成，actor 保持可追溯，业务中断时间缩短。
      en: Unapproved shutdown or reboot becomes harder, actor remains attributable, and business interruption shortens.
  limitations:
    paragraphs:
    - zh: 紧急维护/故障恢复需相同权限，HA 可能共同受管理面攻击，重启本身仍会造成短时中断。
      en: Emergency maintenance and fault recovery need the same rights, HA can share a compromised management plane,
        and reboot still causes transient interruption.
- target_ref: NJS-0200-001
  use:
    paragraphs:
    - zh: 限制可创建 shutdown/reboot action 的 task writer/runtime，绑定 definition、creator、next-run、target、approval 与 boot，并在未来触发前阻断异常。
      en: Restrict task writers and runtimes for shutdown or reboot actions, bind definition, creator, next run, target,
        approval, and boot, and block anomalies before future trigger.
  expected_effect:
    paragraphs:
    - zh: 关闭 writer 与结果的时间断点，调度器身份不再掩盖原始决定。
      en: Close the temporal break between writer and outcome so scheduler identity no longer obscures the decision.
  limitations:
    paragraphs:
    - zh: 合法补丁高度依赖任务，时钟/离线补跑改变时间，受管 controller 受陷仍可满足策略。
      en: Legitimate patching relies heavily on tasks, clock or offline catch-up changes time, and a compromised managed
        controller can satisfy policy.
- target_ref: NJS-0200-002
  use:
    paragraphs:
    - zh: 分离 hypervisor/cloud power roles 与 guest admins，要求 JIT/MFA/审批，保留 vSphere/cloud immutable event，并限制批量 power
        scope。
      en: Separate hypervisor or cloud power roles from guest admins, require JIT, MFA, and approval, retain immutable
        vSphere or cloud events, and limit bulk power scope.
  expected_effect:
    paragraphs:
    - zh: guest 外动作可被目标外日志及时识别和撤销，单个管理身份不能静默关闭整个 fleet。
      en: Out-of-guest actions are identified and revoked from external logs and one identity cannot silently power
        off an entire fleet.
  limitations:
    paragraphs:
    - zh: 控制面整体受陷、break-glass 滥用或 provider 日志延迟仍可能造成 fleet 中断。
      en: Whole control-plane compromise, break-glass abuse, or delayed provider logs can still cause fleet outage.
