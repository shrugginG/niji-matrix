schema_version: 2.0.0
type: mitigation
id: MIT-000208
name:
  zh: 擦除影响验证与证据保全响应
  en: Wipe-Impact Validation and Evidence-Preserving Response
summary:
  zh: 快速验证介质结构和恢复材料，保全原盘并选择裸机恢复而非被虚假勒索话术误导。
  en: Rapidly validate media structure and recovery material, preserve original disks, and choose bare-metal recovery
    rather than follow false ransom claims.
description:
  paragraphs:
  - zh: 此控制面向被伪装成可解密勒索的 disk wipe。事件响应先隔离写入者和设备，镜像/保全原盘，验证 MBR/GPT/filesystem 与 key/IV/ID 来源及恢复代码，再按证据选择解密、结构修复或裸机重建。未经验证的
      decryptor 不在原盘运行。
    en: This control addresses disk wipes presented as decryptable ransomware. Response isolates writer and device,
      images and preserves original media, validates MBR, GPT, filesystem, key or IV or ID provenance, and recovery
      code, then selects decryption, structure repair, or bare-metal rebuild by evidence. Unverified decryptors never
      run on original media.
domains:
- enterprise
measures:
- key: preserve-validate-media
  name:
    zh: 保全并验证介质状态
    en: Preserve and Validate Media State
  description:
    paragraphs:
    - zh: 停止写入、捕获 raw image 与关键 metadata，记录驱动/IOCTL/进程和块差，在隔离副本验证恢复。
      en: Stop writes, capture raw images and critical metadata, record driver, IOCTL, process, and block differences,
        and validate recovery on isolated copies.
  control_type: containment
- key: verify-recovery-material
  name:
    zh: 验证 key、ID 与恢复代码
    en: Verify Key, ID, and Recovery Code
  description:
    paragraphs:
    - zh: 分析 key/IV/安装 ID 的生成、保存与传输以及恢复函数，按 ransomware-like、疑似 wipe、确认 wipe 分级。
      en: Analyze key, IV, or installation-ID generation, retention, transmission, and recovery functions and grade
        ransomware-like, suspected wipe, and confirmed wipe.
  control_type: detective-support
- key: bare-metal-recovery-playbook
  name:
    zh: 裸机恢复与沟通预案
    en: Bare-Metal Recovery and Communications Playbook
  description:
    paragraphs:
    - zh: 维护独立裸机映像、partition maps、boot/config 与数据副本，演练重建并准备不可恢复事件的业务/法律沟通。
      en: Maintain independent bare-metal images, partition maps, boot or configuration, and data copies, exercise
        rebuild, and prepare business and legal communications for irrecoverable incidents.
  control_type: containment
applications:
- target_ref: NJS-0202-002
  use:
    paragraphs:
    - zh: 在出现 ransom note/ID 时同时验证真实块结构和 key/recovery 语义，保全原盘，在隔离副本测试并在确认 wipe 后切换裸机重建。
      en: When ransom notes or IDs appear, validate actual block structure and key or recovery semantics, preserve
        original media, test on isolated copies, and switch to bare-metal rebuild after confirmed wipe.
  expected_effect:
    paragraphs:
    - zh: 减少支付/错误解密造成的延迟和二次损伤，快速选择与真实介质状态匹配的响应。
      en: Reduce delay and secondary damage from payment or incorrect decryption and rapidly choose a response matching
        media reality.
  limitations:
    paragraphs:
    - zh: 样本/密钥可能暂时不可得，完整镜像耗时，过早分类可能放弃可恢复数据；裸机恢复依赖镜像时效和外部副本。
      en: Samples or keys may be temporarily unavailable, full imaging takes time, premature classification can abandon
        recoverable data, and bare-metal recovery depends on image freshness and external copies.
- target_ref: NJT-0202
  use:
    paragraphs:
    - zh: 为 disk wipe 响应预置写入隔离、raw imaging、关键 metadata 快照、独立裸机映像与外部日志，按块结果而非工具/字条决定恢复路径。
      en: Prearrange write isolation, raw imaging, critical-metadata snapshots, independent bare-metal images, and
        external logs for disk-wipe response and choose recovery by block outcome rather than tool or ransom note.
  expected_effect:
    paragraphs:
    - zh: 擦除影响被快速确认，介质证据和独立恢复路径存活，恢复范围更准确。
      en: Wipe impact is confirmed quickly, media evidence and independent recovery survive, and restoration scope
        is more accurate.
  limitations:
    paragraphs:
    - zh: 该措施主要降低响应错误和恢复损失，不能阻止已获 raw-write 权限的攻击者；镜像和演练有成本。
      en: The measure mainly reduces response error and recovery loss and cannot stop an actor already holding raw-write
        authority; imaging and exercises are costly.
