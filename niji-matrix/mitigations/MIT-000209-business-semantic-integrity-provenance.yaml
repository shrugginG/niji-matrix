schema_version: 2.0.0
type: mitigation
id: MIT-000209
name:
  zh: 业务语义完整性、来源链与独立对账
  en: Business-Semantic Integrity, Provenance, and Independent Reconciliation
summary:
  zh: 用业务不变量、端到端来源链、版本/签名和独立表示对账阻止或发现仍可消费的错误数据。
  en: Use business invariants, end-to-end provenance, versions or signatures, and independent representation reconciliation
    to prevent or detect false yet consumable data.
description:
  paragraphs:
  - zh: 此控制不仅验证 schema，而保护业务语义和对象在多表示间的一致性。高风险 mutation 需要 owner/approval 与 before-after；稳定 object/version IDs、签名
      digest 和 provenance 跟随转换；独立对账和 canary 验证业务结果与外部回执。
    en: This control protects business semantics and one object's consistency across representations rather than schema
      alone. High-risk mutations need owner or approval and before and after state; stable object and version IDs,
      signed digests, and provenance follow transformations; independent reconciliation and canaries verify business
      outcome and external receipts.
domains:
- enterprise
measures:
- key: business-invariant-admission
  name:
    zh: 业务不变量与高风险写入准入
    en: Business Invariants and High-Risk Write Admission
  description:
    paragraphs:
    - zh: 为关键对象定义跨字段/关系/累计不变量，对高风险写入要求最小权限、双人审批、owner 和可恢复 old value。
      en: Define cross-field, relational, and cumulative invariants for critical objects and require least privilege,
        dual approval, owner, and recoverable old values for high-risk writes.
  control_type: preventive
- key: end-to-end-provenance-version
  name:
    zh: 端到端 provenance、版本与 digest
    en: End-to-End Provenance, Version, and Digest
  description:
    paragraphs:
    - zh: 在 DB、消息、转换、文档/UI 和外部回执中携带 stable object/version/transaction IDs、producer、parent、digest 和签名状态。
      en: Carry stable object, version, and transaction IDs, producer, parent, digest, and signature state through
        DB, messages, transforms, documents or UI, and external receipts.
  control_type: detective-support
- key: independent-reconciliation-recovery
  name:
    zh: 独立对账与完整性恢复
    en: Independent Reconciliation and Integrity Recovery
  description:
    paragraphs:
    - zh: 从不同权来源周期对账业务 totals、关系和表示，保留 before state，并在异常时冻结后继 action、回滚值和通知 owner。
      en: Periodically reconcile business totals, relations, and representations from differently authorized sources,
        retain prior state, and freeze successor actions, roll back values, and notify owners on anomalies.
  control_type: containment
applications:
- target_ref: NJT-0203
  use:
    paragraphs:
    - zh: 对关键业务数据写入建立语义不变量、CDC old-new、writer/approval、provenance 和跨系统对账，并在异常采用前暂停 downstream action。
      en: Establish semantic invariants, CDC old and new state, writer and approval, provenance, and cross-system
        reconciliation for critical data and pause downstream actions before adopting anomalies.
  expected_effect:
    paragraphs:
    - zh: schema-valid 错误值和表示差更难静默进入业务流程，并可从可信前态恢复。
      en: Schema-valid false values and representation differences have less ability to enter business processes silently
        and can be restored from trusted prior state.
  limitations:
    paragraphs:
    - zh: 业务规则维护成本高，权威源受陷或同步篡改多表示可通过对账，eventual consistency 会误报。
      en: Business-rule maintenance is costly, compromise of authoritative sources or synchronized multi-representation
        changes can pass reconciliation, and eventual consistency causes false positives.
- target_ref: NJS-0203-001
  use:
    paragraphs:
    - zh: 为交易/记录配置关系和累计不变量、历史 counterpart 画像、金额/频率 limits 和 writer approval，不以 schema-valid 作为正确性。
      en: Configure relational and cumulative invariants, historical counterpart profiles, amount or cadence limits,
        and writer approval for transactions or records and never treat schema validity as correctness.
  expected_effect:
    paragraphs:
    - zh: 业务合形值在累积结果或关系异常处暴露并在产生损失前被 hold。
      en: Business-conforming false values surface through cumulative or relational anomalies and can be held before
        loss.
  limitations:
    paragraphs:
    - zh: 新业务/季节变化与攻击相似，严格规则会阻断合法交易；需要 owner 和动态基线。
      en: New business or seasonality resembles attack and strict rules can block legitimate transactions, requiring
        owners and adaptive baselines.
- target_ref: NJS-0203-002
  use:
    paragraphs:
    - zh: 为同一对象跨 DB、消息、PDF/打印/UI 和外部回执传播 stable ID/version 与 digest，按转换 SLA 自动对账并保留 producer lineage。
      en: Propagate stable IDs, versions, and digests for one object across DB, message, PDF or print or UI, and external
        receipt, automatically reconcile by transformation SLA, and retain producer lineage.
  expected_effect:
    paragraphs:
    - zh: 单表示篡改无法让所有观察面保持一致，分歧被定位到具体 transform/producer。
      en: One-representation manipulation cannot keep all observation planes consistent and divergence is localized
        to a transform or producer.
  limitations:
    paragraphs:
    - zh: 非确定渲染、rounding、localization 和外部系统无稳定 ID 会限制比较；所有表示同时受控仍可绕过。
      en: Nondeterministic rendering, rounding, localization, and external systems without stable IDs limit comparison;
        compromise of all representations can bypass it.
