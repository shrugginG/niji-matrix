schema_version: 2.0.0
type: mitigation
id: MIT-000210
name:
  zh: 结算目标完整性、延迟与追回治理
  en: Settlement-Destination Integrity, Delay, and Recovery Governance
summary:
  zh: 保护受益人主数据，独立确认新 destination，并用结算 hold、速度/图限制和快速追回降低完成盗窃。
  en: Protect beneficiary master data, independently confirm new destinations, and use settlement holds, velocity
    or graph limits, and rapid recovery to reduce completed theft.
description:
  paragraphs:
  - zh: 此控制从业务 instruction 到 payment rail 和 post-settlement graph 保护价值。受益人 master 变更需强身份、双人审批和带外确认；新/变更 destination
      进入 hold；交易以稳定 IDs 连接 debit/credit/return；异常 fan-out 触发 freeze、机构和执法联络。
    en: This control protects value from business instruction through payment rail and post-settlement graph. Beneficiary-master
      changes need strong identity, dual approval, and out-of-band confirmation; new or changed destinations enter
      holds; stable IDs join debit, credit, and return; anomalous fan-out triggers freeze and institution or law-enforcement
      contact.
domains:
- enterprise
measures:
- key: beneficiary-master-independent-confirmation
  name:
    zh: 受益人主数据与独立确认
    en: Beneficiary Master Data and Independent Confirmation
  description:
    paragraphs:
    - zh: 版本化受益人账户/agent，限制变更 authority，对新/变更 destination 通过已知渠道或 receiving-bank pre-validation 独立确认。
      en: Version beneficiary accounts or agents, restrict change authority, and independently confirm new or changed
        destinations through known channels or receiving-bank prevalidation.
  control_type: preventive
- key: settlement-hold-dual-approval
  name:
    zh: 结算 hold、双人批准与 rail 状态
    en: Settlement Hold, Dual Approval, and Rail State
  description:
    paragraphs:
    - zh: 对高风险、新受益人或超阈交易要求双人批准与可撤销 hold，保留 UETR/EndToEndId/IMAD/OMAD、finality 和 return 状态。
      en: Require dual approval and revocable holds for high-risk, new-beneficiary, or threshold transactions and
        retain UETR, EndToEndId, IMAD or OMAD, finality, and return status.
  control_type: preventive
- key: value-graph-freeze-recovery
  name:
    zh: 价值图监测、冻结与快速追回
    en: Value-Graph Monitoring, Freeze, and Rapid Recovery
  description:
    paragraphs:
    - zh: 从已确认 settlement 构建 successor graph，按 owner/amount/currency/velocity 监测，并在 24 小时内联系金融机构与执法冻结/recall。
      en: Build successor graphs from confirmed settlement, monitor owner, amount, currency, and velocity, and contact
        institutions and law enforcement within 24 hours for freeze or recall.
  control_type: containment
applications:
- target_ref: NJT-0204
  use:
    paragraphs:
    - zh: 要求金融盗窃告警同时具备 victim debit 和 beneficiary credit，保护 instruction/master、执行 settlement hold，并把 successor movement
        接入追回 playbook。
      en: Require Financial Theft alerts to contain victim debit and beneficiary credit, protect instruction and master
        data, execute settlement holds, and feed successor movement into a recovery playbook.
  expected_effect:
    paragraphs:
    - zh: 未授权 destination 更难结算，已结算价值更快冻结/追回，完成门与事件分类更准确。
      en: Unauthorized destinations are harder to settle, settled value is frozen or recovered faster, and completion
        and incident classification become more accurate.
  limitations:
    paragraphs:
    - zh: 快速支付/crypto finality 缩短 hold，跨机构数据不可见，严格控制会延迟合法付款；已完成盗窃不一定可追回。
      en: Instant payments or crypto finality shorten holds, cross-institution data is invisible, strict controls
        delay legitimate payments, and completed theft may remain unrecoverable.
- target_ref: NJS-0204-001
  use:
    paragraphs:
    - zh: 对 supplier/beneficiary destination 的任何变化执行独立 callback/pre-validation、双人 approval 和冷却 hold，并把 instruction
        digest 与 rail creditor fields 对比。
      en: Apply independent callback or prevalidation, dual approval, and cooling hold to every supplier or beneficiary
        destination change and compare instruction digests with rail creditor fields.
  expected_effect:
    paragraphs:
    - zh: 小范围账户替换无法借熟悉业务上下文静默完成。
      en: Narrow account substitution cannot complete silently through familiar business context.
  limitations:
    paragraphs:
    - zh: 攻击者控制供应商真实渠道、insider 或审批系统时可通过确认；紧急付款需要受控例外。
      en: An attacker controlling real vendor channels, an insider, or approval system can pass confirmation; emergency
        payment needs governed exceptions.
- target_ref: NJS-0204-002
  use:
    paragraphs:
    - zh: 从首次恶意入账立即构建 value graph，按 24 小时优先窗口与 rail finality 分析 fan-out/hops/amount conservation，并自动启动 freeze/recall。
      en: Build a value graph immediately from initial malicious credit, analyze fan-out, hops, and amount conservation
        within a 24-hour priority window and rail finality, and automatically initiate freeze or recall.
  expected_effect:
    paragraphs:
    - zh: 多跳分散在价值离开更多机构前被识别，追回窗口延长。
      en: Multi-hop dispersion is identified before value leaves more institutions, extending recovery time.
  limitations:
    paragraphs:
    - zh: 合法 treasury/processor 图相似，跨机构/链上地址 owner 不透明，24 小时不是通用恶意阈值。
      en: Legitimate treasury or processor graphs resemble it, cross-institution or on-chain owners are opaque, and
        24 hours is not a universal malicious threshold.
