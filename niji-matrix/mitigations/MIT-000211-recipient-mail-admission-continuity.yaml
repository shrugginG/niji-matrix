schema_version: 2.0.0
type: mitigation
id: MIT-000211
name:
  zh: 收件人中心的邮件准入与关键通信连续性
  en: Recipient-Centric Mail Admission and Critical-Communication Continuity
summary:
  zh: 用 confirmed opt-in、recipient fan-in 控制、campaign 清理、接收限额韧性和独立关键通知渠道维持邮件可用性。
  en: Use confirmed opt-in, recipient fan-in controls, campaign cleanup, receive-limit resilience, and independent
    critical-notification channels to preserve mail availability.
description:
  paragraphs:
  - zh: 此控制从发送触发、recipient 聚合、mail transport 到关键业务通知保护邮件连续性。公共 signup 使用 confirmed opt-in、CAPTCHA/速率/abuse feedback；邮件系统按
      recipient/campaign/list 而非单 sender 检测和清理；关键通知使用 priority folder、独立 push/SMS/portal 与 SLA escalation。
    en: This control protects mail continuity from send trigger through recipient aggregation, transport, and consequential
      business notices. Public signup uses confirmed opt-in, CAPTCHA, rate controls, and abuse feedback. Mail systems
      detect and clean by recipient, campaign, or list rather than one sender. Consequential notices use priority
      folders, independent push, SMS, or portals, and SLA escalation.
domains:
- enterprise
measures:
- key: confirmed-optin-signup-abuse-control
  name:
    zh: 确认订阅、bot challenge 与 signup 滥用控制
    en: Confirmed Opt-In, Bot Challenge, and Signup-Abuse Control
  description:
    paragraphs:
    - zh: 邮件列表/注册要求 confirmed opt-in、CAPTCHA/设备/速率约束、退订/abuse API 和异常 destination fan-out 限制。
      en: Require confirmed opt-in, CAPTCHA, device or rate controls, unsubscribe or abuse APIs, and anomalous destination
        fan-out limits for mailing lists and registrations.
  control_type: preventive
- key: recipient-fanin-campaign-cleanup
  name:
    zh: 收件人 fan-in 准入与 campaign 清理
    en: Recipient Fan-In Admission and Campaign Cleanup
  description:
    paragraphs:
    - zh: 按 recipient 聚合 authenticated sender/cluster/list/campaign，渐进隔离异常 fan-in、批量撤销订阅/规则并保留关键 sender exception。
      en: Aggregate authenticated senders, clusters, lists, and campaigns by recipient, progressively isolate anomalous
        fan-in, bulk-cancel subscriptions or rules, and preserve critical-sender exceptions.
  control_type: containment
- key: mailbox-limit-critical-channel
  name:
    zh: 接收限额韧性与关键通知独立通道
    en: Receive-Limit Resilience and Independent Critical Channels
  description:
    paragraphs:
    - zh: 监测 receive-limit/queue/NDR，保护关键邮箱与备用 recipient，关键安全/金融通知同时发到受控 portal/push/SMS 并跟踪 action SLA。
      en: Monitor receive limits, queues, and NDRs, protect critical mailboxes and alternate recipients, and send
        critical security or financial notices through governed portals, push, or SMS while tracking action SLAs.
  control_type: detective-support
applications:
- target_ref: NJT-0205
  use:
    paragraphs:
    - zh: 为高价值 recipient 建 fan-in/limit/transport 基线、campaign cleanup 和业务 health probe，发生洪泛时保留关键 sender/notification
        并隔离其余邮件。
      en: Build fan-in, limit, transport baselines, campaign cleanup, and business health probes for high-value recipients
        and preserve critical senders or notices while isolating other mail during flooding.
  expected_effect:
    paragraphs:
    - zh: 合法邮件可用性与业务连续性保留，邮箱/queue 限额更少被击穿，清理时间缩短。
      en: Legitimate-mail availability and business continuity are preserved, mailbox or queue limits are less likely
        to be exceeded, and cleanup time falls.
  limitations:
    paragraphs:
    - zh: 严格准入会隔离合法新 sender/活动，provider 控制有限，攻击者可分散到低量/多 tenant；用户客户端仍可能卡顿。
      en: Strict admission can isolate legitimate new senders or campaigns, provider control is limited, attackers
        can distribute low volume across tenants, and clients can still slow down.
- target_ref: NJS-0205-001
  use:
    paragraphs:
    - zh: 与第三方 list/provider 协作实施 confirmed opt-in/CAPTCHA/abuse API，按 recipient 检测多 authenticated sender fan-out
        并批量撤销可识别 registrations。
      en: Work with third-party lists and providers on confirmed opt-in, CAPTCHA, and abuse APIs, detect multi-authenticated-sender
        fan-out by recipient, and bulk-cancel identifiable registrations.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难利用众多合法发送者绕过单源过滤，异常 fan-out 可快速收敛到 campaign/list。
      en: Attackers have less ability to use many legitimate senders to bypass one-origin filtering, and anomalous
        fan-out is rapidly converged to campaigns or lists.
  limitations:
    paragraphs:
    - zh: 无法控制所有外部 list，confirmed opt-in 仍可被邮件地址持有者确认，campaign 归一化不完整。
      en: Not every external list is controllable, confirmed opt-in can still be confirmed by mailbox holders, and
        campaign normalization is incomplete.
- target_ref: NJS-0205-002
  use:
    paragraphs:
    - zh: 为密码、支付、安全和高影响变更建立 notification registry、独立 push/SMS/portal channel、priority routing 和 action/SLA escalation，不依赖
        inbox 可见性 alone。
      en: Create a notification registry, independent push, SMS, or portal channels, priority routing, and action
        or SLA escalation for password, payment, security, and high-impact changes rather than relying on inbox visibility
        alone.
  expected_effect:
    paragraphs:
    - zh: 关键后果消息即使在洪泛中埋没也会通过另一通道和 SLA 被发现/处理。
      en: Consequential messages are discovered and handled through another channel and SLA even if buried in flooding.
  limitations:
    paragraphs:
    - zh: 独立通道也可能受攻击或造成 alert fatigue，隐私/成本限制多通道，用户已读不等于理解。
      en: Independent channels can also be attacked or create alert fatigue, privacy or cost limits multichannel delivery,
        and read state does not equal understanding.
