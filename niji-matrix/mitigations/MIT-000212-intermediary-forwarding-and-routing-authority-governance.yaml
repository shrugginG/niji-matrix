schema_version: 2.0.0
type: mitigation
id: MIT-000212
name:
  zh: 中介转发与路由权威治理
  en: Intermediary Forwarding and Routing-Authority Governance
summary:
  zh: 限制未批准中介并使双侧转发、出口归属与共享边缘路由可验证。
  en: Restrict unauthorized intermediaries and make bilateral forwarding, egress provenance, and shared-edge routing
    verifiable.
description:
  paragraphs:
  - zh: 以批准的中介清单、双侧会话审计、边缘设备生命周期和跨层名称/账户一致性约束代理路径，保留重建所需的原始和转换后关系。
    en: Govern proxy paths through an approved-intermediary inventory, bilateral session audit, edge-device lifecycle
      controls, and cross-layer name and account congruence while retaining pre- and post-forwarding relationships needed
      for reconstruction.
domains:
- enterprise
measures:
- key: approved-relay-inventory-and-default-deny
  name:
    zh: 批准中介清单与默认拒绝
    en: Approved-Relay Inventory and Default Deny
  description:
    paragraphs:
    - zh: 按设备、签名进程、监听、调用身份、可达网络域、请求目的和有效期登记代理、堡垒机、服务网格和端口转发；阻断未登记的 FRP、SOCKS、Tor、PortProxy 与直接外部代理路线，并把拒绝保留到集中日志。
      en: Register proxies, bastions, service meshes, and port forwards by device, signed process, listener, calling
        identity, reachable network domain, requested destination, and validity period. Block unregistered FRP, SOCKS,
        Tor, PortProxy, and direct external-proxy routes and retain denials centrally.
  control_type: preventive
- key: bilateral-proxy-session-accounting
  name:
    zh: 代理双侧会话记账
    en: Bilateral Proxy Session Accounting
  description:
    paragraphs:
    - zh: 受管中介为每次请求生成稳定 session ID，记录认证客户端、原始五元组、请求目的、绑定地址、出站五元组、规则/配置版本、决定、开始结束和字节计数；日志实时送往不同权限存储。
      en: Have each managed intermediary generate a stable session ID and record authenticated client, original tuple,
        requested destination, bound address, outbound tuple, rule or configuration version, decision, start and end,
        and byte counters, forwarding the log in real time to differently authorized storage.
  control_type: detective-support
- key: edge-device-lifecycle-and-integrity
  name:
    zh: 边缘设备生命周期与完整性控制
    en: Edge-Device Lifecycle and Integrity Control
  description:
    paragraphs:
    - zh: 淘汰 EOL 路由器与 VPN/防火墙设备，关闭公网管理面，实施唯一管理身份、签名固件和配置基线，监控新监听、VPN/代理模块及异常设备间登录，并支持快速隔离和取证留存。
      en: Retire end-of-life routers and VPN or firewall devices, close public management, enforce unique administrative
        identity, signed firmware, and configuration baselines, monitor new listeners, VPN or proxy modules, and anomalous
        device-to-device logons, and support rapid isolation with forensic preservation.
  control_type: exposure-reduction
- key: routing-authority-congruence-enforcement
  name:
    zh: 路由权威一致性强制
    en: Routing-Authority Congruence Enforcement
  description:
    paragraphs:
    - zh: 在可解密出口或 CDN/Front Door 校验 SNI、Host/:authority、证书覆盖、租户/订阅、路由和源站，拒绝跨账户或未批准 mismatch，记录 421、SSLMismatchedSNI、OriginName/IP/URL
        与请求 ID。
      en: At a decrypting egress or CDN or Front Door, validate SNI, Host or :authority, certificate coverage, tenant
        or subscription, route, and origin; reject cross-account or unauthorized mismatches and record 421, SSLMismatchedSNI,
        OriginName, OriginIP, OriginURL, and request ID.
  control_type: preventive
applications:
- target_ref: NJT-0206
  use:
    paragraphs:
    - zh: 对所有批准中介实施限定范围、双侧会话 ID、配置版本和集中审计，对未登记转发默认拒绝并关联后继 C2 结果。
      en: Scope every approved intermediary, assign bilateral session IDs, retain configuration versions and centralized
        audit, deny unregistered forwarding by default, and join later C2 outcomes.
  expected_effect:
    paragraphs:
    - zh: 中介不再天然切断路径谱系，内部/外部代理均留下可连接的原始客户端、请求目的和出站关系。
      en: Intermediaries no longer inherently break path lineage, and both internal and external proxies retain joinable
        original-client, requested-destination, and outbound relationships.
  limitations:
    paragraphs:
    - zh: 外部公共或敌手控制中介不服从组织策略；严格默认拒绝会影响远程办公、供应商支持与复杂服务网格，需具体且限时的例外。
      en: Public or adversary-controlled external intermediaries do not follow organizational policy. Strict default
        deny can disrupt remote work, vendor support, and complex service meshes and requires specific time-bounded exceptions.
- target_ref: NJS-0206-001
  use:
    paragraphs:
    - zh: 淘汰 EOL 边缘设备、限制管理面、验证固件与代理模块，并让目标侧风险决策结合设备完整性和会话行为，不单靠地理/ASN 放行。
      en: Retire end-of-life edge devices, constrain management, verify firmware and proxy modules, and combine target-side
        risk decisions with device integrity and session behavior rather than allow solely by geography or ASN.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难廉价取得真实第三方出口，残余被控节点更易从所有者侧异常和目标流量恢复。
      en: The actor has greater difficulty cheaply acquiring genuine third-party egress, and residual compromised nodes
        become easier to recover from owner-side anomalies and target flows.
  limitations:
    paragraphs:
    - zh: 组织不能修补所有互联网 SOHO 设备；合法住宅代理、CGNAT 与共享网络仍会限制仅靠目标侧判断的精度。
      en: An organization cannot patch every Internet SOHO device, and legitimate residential proxies, CGNAT, and shared
        networks limit accuracy from target-side evidence alone.
- target_ref: NJS-0206-002
  use:
    paragraphs:
    - zh: 在端点限制未批准 Tor/代理组件，跨所有自有边界集中保留时间、五元组、字节和进程键，并对需使用匿名网络的业务采用专用受管出口与审计。
      en: Restrict unauthorized Tor or proxy components on endpoints, centrally retain time, tuple, byte, and process
        keys across every owned boundary, and route legitimate anonymity-network use through a dedicated managed egress
        with audit.
  expected_effect:
    paragraphs:
    - zh: 自有观察域中的链段可被合并，攻击者必须把更多关键关系移到不可见外部节点并承担更高维护和延迟成本。
      en: Path segments inside owned observation domains can be joined, forcing the actor to move more critical relationships
        into unseen external nodes and accept higher maintenance and latency cost.
  limitations:
    paragraphs:
    - zh: 无法强制外部 relay 留存，流量确认受背景流量、填充和时间扰动影响；封禁 Tor 还可能伤害合法隐私与研究用途。
      en: External relays cannot be forced to retain records, traffic confirmation is affected by background traffic,
        padding, and timing perturbation, and blocking Tor may harm legitimate privacy and research use.
- target_ref: NJS-0206-003
  use:
    paragraphs:
    - zh: 强制同会话 SNI、Host、证书与路由账户/订阅关系一致，批准的同账户 Host 重写须登记源站和有效期，所有 mismatch 保留请求 ID 和实际源站。
      en: Enforce congruence among same-session SNI, Host, certificate, and route account or subscription. Register approved
        same-account Host rewriting with origin and validity, and retain request ID and actual origin for every mismatch.
  expected_effect:
    paragraphs:
    - zh: 仅借公共前端名称不能把请求路由到攻击者后端，跨租户域前置被边缘直接拒绝并留下高质量证据。
      en: A public front name alone cannot route the request to an actor backend, and cross-tenant fronting is rejected
        at the edge with high-quality evidence.
  limitations:
    paragraphs:
    - zh: ECH、无 SNI 客户端、同租户滥用和合法多域路由需要额外上下文；企业若不能解密 TLS，主要依赖提供方执行和日志。
      en: ECH, no-SNI clients, same-tenant abuse, and legitimate multi-domain routing require more context. Enterprises
        unable to decrypt TLS depend mainly on provider enforcement and logs.
