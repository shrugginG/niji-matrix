schema_version: 2.0.0
type: mitigation
id: MIT-000213
name:
  zh: 低层协议出口与套接字能力最小化
  en: Lower-Layer Protocol Egress and Socket-Capability Minimization
summary:
  zh: 限制无应用事务的低层出口和 raw socket 能力，并保留归属。
  en: Constrain lower-layer egress and raw-socket capability without application transactions while retaining attribution.
description:
  paragraphs:
  - zh: '>- 按设备和进程角色控制 ICMP 类型、UDP 目的地与 raw socket 能力，同时保留必要诊断和业务协议的精确例外。'
    en: '>- Control ICMP types, UDP destinations, and raw-socket capabilities by device and process role while preserving
      precise exceptions for required diagnostics and business protocols.'
domains:
- enterprise
measures:
- key: packet-egress-policy
  name:
    zh: ('packet_egress_policy', 'packet_egress_policy')
    en: ('packet_egress_policy', 'packet_egress_policy')
  description:
    paragraphs:
    - zh: 在出口仅允许设备角色所需的 ICMP 类型/方向和 UDP 服务—目的地组合，阻断无法归属的外部无连接往返并记录拒绝。
      en: At egress, allow only ICMP types and directions and UDP service-to-destination pairs required by the device
        role, blocking and logging unattributed external connectionless exchanges.
  control_type: preventive
- key: raw-socket-privilege
  name:
    zh: ('raw_socket_privilege', 'raw_socket_privilege')
    en: ('raw_socket_privilege', 'raw_socket_privilege')
  description:
    paragraphs:
    - zh: 从普通服务账户和容器移除 CAP_NET_RAW/等效 raw socket 权限，并监控特权授予与 socket 系统调用。
      en: Remove CAP_NET_RAW or equivalent raw-socket privilege from ordinary service accounts and containers and monitor
        privilege grants and socket syscalls.
  control_type: exposure-reduction
applications:
- target_ref: NJT-0208
  use:
    paragraphs:
    - zh: 将没有批准应用事务的 TCP/UDP/ICMP 出口绑定到明确软件、目标和变更审批，并让未知流进入协议识别。
      en: Bind TCP, UDP, and ICMP egress without an approved application transaction to explicit software, destination,
        and change approval and route unknown flows to protocol identification.
  expected_effect:
    paragraphs:
    - zh: 减少可建立无应用事务 C2 的路径，并让剩余流量有进程与策略归属。
      en: Reduce paths available for applicationless C2 and give remaining traffic process and policy attribution.
  limitations:
    paragraphs:
    - zh: 不能简单封锁所有 ICMP/UDP；内核级植入、已获批高权限进程或主机栈旁路平面仍可规避。
      en: ICMP and UDP cannot simply be blocked wholesale; kernel implants, approved privileged processes, and host-stack-bypassing
        planes can still evade the control.
- target_ref: NJS-0208-001
  use:
    paragraphs:
    - zh: 对允许的 ICMP/UDP 按进程、设备角色与目的地限权，保留双向分组并限制普通进程 raw socket。
      en: Scope permitted ICMP and UDP by process, device role, and destination, retain bidirectional packets, and restrict
        raw sockets for ordinary processes.
  expected_effect:
    paragraphs:
    - zh: 阻断多数任意无连接控制路径，并把剩余会话压缩到可重建的批准集合。
      en: Block most arbitrary connectionless control paths and reduce remaining sessions to an approved set that can
        be reconstructed.
  limitations:
    paragraphs:
    - zh: 合法诊断、实时媒体和自定义设备协议需要例外；共享系统服务或被盗特权仍可承载恶意分组。
      en: Diagnostics, real-time media, and custom device protocols need exceptions; shared system services or stolen
        privilege can still carry malicious packets.
