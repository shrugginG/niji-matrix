schema_version: 2.0.0
type: mitigation
id: MIT-000214
name:
  zh: 替代控制平面缩减与完整性约束
  en: Alternate-Control-Plane Reduction and Integrity Enforcement
summary:
  zh: 关闭不需要的 VMCI/AMT 控制平面并为保留通道建立独立完整性审计。
  en: Disable unnecessary VMCI or AMT control planes and establish independent integrity audit for retained channels.
description:
  paragraphs:
  - zh: '>- 关闭不需要的 VMCI/vsock、AMT SOL 与类似管理通道，对保留平面限制主体和服务，并保护 hypervisor/固件组件完整性。'
    en: '>- Disable unnecessary VMCI or vsock, AMT SOL, and similar management channels, constrain principals and services
      on retained planes, and protect hypervisor and firmware-component integrity.'
domains:
- enterprise
measures:
- key: plane-inventory-and-disable
  name:
    zh: ('plane_inventory_and_disable', 'plane_inventory_and_disable')
    en: ('plane_inventory_and_disable', 'plane_inventory_and_disable')
  description:
    paragraphs:
    - zh: 盘点每台宿主/终端所需 VMCI 与 AMT 功能；不需要时停用，保留时记录 CID/port、SOL 管理员、控制台和维护用途。
      en: Inventory required VMCI and AMT features per host or endpoint; disable them when unnecessary and otherwise
        record CID and port, SOL administrators, consoles, and maintenance purpose.
  control_type: exposure-reduction
- key: hypervisor-integrity
  name:
    zh: ('hypervisor_integrity', 'hypervisor_integrity')
    en: ('hypervisor_integrity', 'hypervisor_integrity')
  description:
    paragraphs:
    - zh: 在支持的 ESXi 启用 Secure Boot，验证 VIB 签名与接受级别，审计安装及 `--force/--no-sig-check` 类绕过。
      en: Enable Secure Boot on supported ESXi, validate VIB signature and acceptance level, and audit installation and
        bypasses such as `--force` or `--no-sig-check`.
  control_type: preventive
- key: management-audit
  name:
    zh: ('management_audit', 'management_audit')
    en: ('management_audit', 'management_audit')
  description:
    paragraphs:
    - zh: 集中保存 VMCI/vsock 使用、AMT Access Monitor/Audit Log、SOL 1201/1202 及平台配置变更。
      en: Centrally retain VMCI or vsock use, AMT Access Monitor or Audit Log, SOL events 1201 and 1202, and platform-configuration
        changes.
  control_type: detective-support
applications:
- target_ref: NJS-0208-002
  use:
    paragraphs:
    - zh: 对集群和设备逐项批准替代地址族/管理会话，关闭未用功能并把平台审计与命令结果联查。
      en: Approve alternate address-family and management sessions per cluster and device, disable unused functions,
        and join platform audit with command outcomes.
  expected_effect:
    paragraphs:
    - zh: 减少主机网络传感器看不到的可用通道，并为保留通道建立独立可见性与完整性边界。
      en: Reduce channels invisible to host network sensors and create independent visibility and integrity boundaries
        for retained channels.
  limitations:
    paragraphs:
    - zh: 禁用 VMCI 或 SOL 可能破坏 VMware Tools、备份或远程运维；已获 root/hypervisor/管理控制台权限的攻击者可能篡改日志，Secure Boot 也不检测所有内存态滥用。
      en: Disabling VMCI or SOL can break VMware Tools, backup, or remote administration. An actor with root, hypervisor,
        or management-console control can tamper with logs, and Secure Boot does not detect every in-memory abuse.
evidence_refs:
