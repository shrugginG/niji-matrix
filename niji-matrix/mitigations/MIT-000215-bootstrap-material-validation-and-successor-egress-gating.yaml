schema_version: 2.0.0
type: mitigation
id: MIT-000215
name:
  zh: 引导材料验证与后继出口门控
  en: Bootstrap Material Validation and Successor-Egress Gating
summary:
  zh: 验证引导材料并在通道角色转换时重新执行代码与出口策略。
  en: Validate bootstrap material and reapply code and egress policy when channel roles change.
description:
  paragraphs:
  - zh: 对能下发地址、配置或后继代码的第一阶段建立来源/内容验证，并按进程谱系限制材料消费后的新目的地与新代码执行。
    en: Validate provenance and content for first stages that deliver addresses, configuration, or successor code, and
      restrict new destinations and new-code execution after consumption by process lineage.
domains:
- enterprise
measures:
- key: bootstrap-content-governance
  name:
    zh: ('bootstrap_content_governance', 'bootstrap_content_governance')
    en: ('bootstrap_content_governance', 'bootstrap_content_governance')
  description:
    paragraphs:
    - zh: 让受管代理/更新器只从签名清单和批准服务取得配置或代码，校验摘要/签名/产品版本，未知 selection/address 进入隔离。
      en: Require managed agents and updaters to obtain configuration or code only from signed manifests and approved
        services, validate digest, signature, and product version, and quarantine unknown selection or address material.
  control_type: preventive
- key: lineage-egress-gate
  name:
    zh: ('lineage_egress_gate', 'lineage_egress_gate')
    en: ('lineage_egress_gate', 'lineage_egress_gate')
  description:
    paragraphs:
    - zh: 按 ProcessUniqueId/签名软件角色限定引导进程及后继进程可访问的目的地，未登记的新端点需短时审批并记录触发材料。
      en: Constrain destinations available to bootstrap and successor processes by ProcessUniqueId or signed software
        role, requiring short-lived approval and trigger-material recording for unregistered new endpoints.
  control_type: exposure-reduction
- key: successor-code-control
  name:
    zh: ('successor_code_control', 'successor_code_control')
    en: ('successor_code_control', 'successor_code_control')
  description:
    paragraphs:
    - zh: 用应用控制阻止未批准后继二进制/脚本，保留下载来源、摘要和首次执行/联网。
      en: Use application control to stop unapproved successor binaries or scripts and retain download origin, digest,
        and first execution or network use.
  control_type: preventive
applications:
- target_ref: NJT-0210
  use:
    paragraphs:
    - zh: 对所有会改变 C2 角色的配置、地址和组件保留消费谱系，并在阶段转换时重新执行出口与代码策略。
      en: Retain consumption lineage for configuration, addresses, and components that change C2 role and reevaluate
        egress and code policy at each stage transition.
  expected_effect:
    paragraphs:
    - zh: 限制攻击者用低噪声通道任意授权新操作通道，并使交接材料成为可审计控制点。
      en: Limit an actor's ability to authorize arbitrary operational channels through a low-noise stage and turn handoff
        material into an auditable control point.
  limitations:
    paragraphs:
    - zh: TLS/内存配置和合法动态服务可能难以验证；过严门控会破坏更新器、远程管理和云代理，已被盗签名/管理端仍可通过策略。
      en: TLS or in-memory configuration and legitimate dynamic services can be difficult to validate. Overly strict
        gating can break updaters, remote management, and cloud agents, while stolen signing or management authority
        can satisfy policy.
- target_ref: NJS-0210-001
  use:
    paragraphs:
    - zh: 把第一阶段的选择/地址/组件与允许的第二阶段端点和软件摘要绑定；未匹配时阻断新连接或隔离后继进程。
      en: Bind first-stage selection, address, or component to permitted second-stage endpoints and software digests,
        blocking the new connection or isolating the successor process when unmatched.
  expected_effect:
    paragraphs:
    - zh: 缩小选择式第二阶段的可达集合并保留准确交接证据。
      en: Reduce the reachable set for selectively activated second stages and preserve precise handoff evidence.
  limitations:
    paragraphs:
    - zh: 同进程内存交接和共享 CDN 会降低绑定精度，紧急支持/灾备需受控例外。
      en: In-process memory handoff and shared CDNs reduce binding precision, and emergency support or disaster recovery
        needs controlled exceptions.
