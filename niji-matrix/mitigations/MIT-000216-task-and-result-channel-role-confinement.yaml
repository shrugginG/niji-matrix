schema_version: 2.0.0
type: mitigation
id: MIT-000216
name:
  zh: 任务与结果通道角色约束
  en: Task and Result Channel Role Confinement
summary:
  zh: 约束任务与结果服务角色，使取得、执行和回传保留共同授权上下文。
  en: Constrain task and result service roles so acquisition, execution, and return preserve common authorization context.
description:
  paragraphs:
  - zh: 为合法自动化/管理代理登记任务端、结果端和允许动作，限制跨角色传输并在结果通道执行内容与数据控制。
    en: Register task endpoints, result endpoints, and allowed actions for legitimate automation and management agents,
      constrain cross-role transfer, and enforce content and data controls on result channels.
domains:
- enterprise
measures:
- key: service-role-catalog
  name:
    zh: ('service_role_catalog', 'service_role_catalog')
    en: ('service_role_catalog', 'service_role_catalog')
  description:
    paragraphs:
    - zh: 为每个 agent 维护签名软件、设备组、任务服务、结果服务、victim/device ID、允许脚本类别、流量方向和周期。
      en: Maintain signed software, device group, task service, result service, victim or device ID, permitted script
        class, direction, and cadence for each agent.
  control_type: governance
- key: result-channel-controls
  name:
    zh: ('result_channel_controls', 'result_channel_controls')
    en: ('result_channel_controls', 'result_channel_controls')
  description:
    paragraphs:
    - zh: 对结果端点实施目的地允许、身份验证、DLP/大小与字段策略，并拒绝未知脚本进程向未登记服务回传。
      en: Enforce destination allow, authentication, DLP or size and field policy on result endpoints and reject result
        return from unknown script processes to unregistered services.
  control_type: preventive
- key: cross-channel-audit
  name:
    zh: ('cross_channel_audit', 'cross_channel_audit')
    en: ('cross_channel_audit', 'cross_channel_audit')
  description:
    paragraphs:
    - zh: 保存任务 ID、配置/组件摘要、本地执行和结果请求的统一 lineage，以便一个通道被阻断后仍能定位另一个。
      en: Retain unified lineage for task ID, configuration or component digest, local execution, and result request
        so the other channel remains discoverable after one is blocked.
  control_type: detective-support
applications:
- target_ref: NJS-0210-002
  use:
    paragraphs:
    - zh: 要求任务取得与结果回传匹配批准的同一产品角色和设备身份；不匹配时阻断结果端并隔离执行进程。
      en: Require task acquisition and result return to match an approved product role and device identity, blocking
        the result endpoint and isolating the executing process when they do not.
  expected_effect:
    paragraphs:
    - zh: 降低攻击者把恶意任务与结果拆到任意服务的自由度，并让回传端保留任务来源上下文。
      en: Reduce the actor's freedom to split malicious tasks and results across arbitrary services and preserve task-source
        context at the return channel.
  limitations:
    paragraphs:
    - zh: 合法 SaaS/代理可能使用不同供应商端点且内容加密；DLP 看不到端到端加密，进程注入可冒用批准 agent，严格限制会影响运维自动化。
      en: Legitimate SaaS or agents may use different provider endpoints with encrypted content. DLP cannot inspect end-to-end
        encryption, process injection can impersonate an approved agent, and strict restrictions can disrupt operational
        automation.
evidence_refs:
