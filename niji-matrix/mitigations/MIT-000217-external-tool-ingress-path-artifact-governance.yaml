schema_version: 2.0.0
type: mitigation
id: MIT-000217
name:
  zh: 外部工具入站路径与制品治理
  en: External Tool Ingress Path and Artifact Governance
summary:
  zh: 按设备角色限制外部文件取得、校验入站制品并保留网络到文件谱系。
  en: Restrict external file acquisition by device role, verify ingress artifacts, and retain network-to-file lineage.
description:
  paragraphs:
  - zh: 对外部文件取得按设备角色限定来源、客户端、内容和落点，先经受管检查/隔离并保留网络到文件谱系；与 MIT-000127 的内部共享治理共同覆盖复用后的 NJT-0130。
    en: Bound external file acquisition by device role, source, client, content, and destination, route it through managed
      inspection or quarantine, and retain network-to-file lineage. Together with MIT-000127 internal-share governance,
      this covers reused NJT-0130.
domains:
- enterprise
measures:
- key: role-bound-external-retrieval
  name:
    zh: 按角色限定外部文件取得
    en: Role-Bound External File Retrieval
  description:
    paragraphs:
    - zh: 服务器、工作站、网络设备与 ESXi 分别定义可用浏览器/下载器/包管理器、代理、源域/仓库、认证身份和目标路径；默认阻断未知直连与个人云同步，紧急例外有 owner、目的和到期。
      en: Define permitted browsers, downloaders, package managers, proxies, source domains or repositories, authentication
        identities, and destination paths separately for servers, workstations, network devices, and ESXi. Deny unknown
        direct retrieval and personal cloud sync by default, with owner, purpose, and expiry on emergency exceptions.
  control_type: preventive
- key: ingress-artifact-verification-quarantine
  name:
    zh: 入站制品校验与隔离
    en: Ingress Artifact Verification and Quarantine
  description:
    paragraphs:
    - zh: 对取得文件保存来源、签名/发布者、摘要、大小和批准记录，在执行前进行内容检查、沙箱或隔离；未知/不匹配制品不得因 writer 签名或来源域知名而放行。
      en: Retain source, signature or publisher, digest, size, and approval for acquired files and perform content inspection,
        sandboxing, or quarantine before execution. Unknown or mismatched artifacts are not allowed because the writer
        is signed or source domain is well known.
  control_type: preventive
- key: network-to-file-lineage-retention
  name:
    zh: 网络响应到文件谱系保留
    en: Network Response to File Lineage Retention
  description:
    paragraphs:
    - zh: 保留 endpoint process/network、代理 request/response、network file ID/hash、FileOrigin 和 file create/delete，并同步时钟；后台
        job/sync 记录 caller、job、最终 writer 和目标对象。
      en: Retain endpoint process and network, proxy request and response, network file ID and hash, FileOrigin, and
        file create and delete with synchronized clocks. Background jobs and sync record caller, job, final writer, and
        destination object.
  control_type: detective-support
- key: post-arrival-execution-control
  name:
    zh: 到达后执行控制
    en: Post-Arrival Execution Control
  description:
    paragraphs:
    - zh: 对用户/临时/缓存/新下载路径应用应用控制、脚本策略和最低权限，在完成来源与内容验证前阻止新文件执行或载入。
      en: Apply application control, script policy, and least privilege to user, temporary, cache, and newly downloaded
        paths, preventing execution or load until source and content validation completes.
  control_type: containment
applications:
- target_ref: NJT-0130
  use:
    paragraphs:
    - zh: 对 external ingress 强制经受管代理/仓库取得、登记 source/writer/artifact/path 并在文件到达后执行前隔离；内部 lateral 分支继续使用 MIT-000127。
      en: For external ingress, require managed proxy or repository retrieval, register source, writer, artifact, and
        path, and quarantine after arrival and before execution. The internal lateral branch continues to use MIT-000127.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以从任意外部端点把未知文件直接送入受控主机；已到达文件保留可审查来源并在执行前提供处置窗口。
      en: The actor has greater difficulty bringing an unknown file directly from any outside endpoint into a controlled
        host. Landed files retain reviewable provenance and create a response window before execution.
  limitations:
    paragraphs:
    - zh: 被攻陷批准仓库、内存直送、合法签名恶意包、加密内容和无法代理的网络设备通道仍可绕过；严格下载控制可能影响更新、构建与事件响应。
      en: Compromised approved repositories, memory-only streaming, malicious legitimately signed packages, encrypted
        content, and network-device channels that cannot be proxied can bypass controls. Strict retrieval policy may
        disrupt updates, builds, and incident response.
evidence_refs:
