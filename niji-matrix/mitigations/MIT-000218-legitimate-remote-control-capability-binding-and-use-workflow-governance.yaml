schema_version: 2.0.0
type: mitigation
id: MIT-000218
name:
  zh: 合法远控能力绑定与使用工作流治理
  en: Legitimate Remote-Control Capability Binding and Use-Workflow Governance
summary:
  zh: 把远控控制端、会话和批准工作流绑定到具体身份、设备与用途，并管理带外硬件。
  en: Bind remote-control controllers, sessions, and approved workflows to concrete identities, devices, and purposes
    while governing out-of-band hardware.
description:
  paragraphs:
  - zh: 把批准远控细化到 controller namespace、agent/tunnel/hardware ID、operator、target、mode、ticket/consent 和时限，保留 provider/endpoint/OOB
      审计并快速撤销未授权控制。
    en: Govern approved remote control at controller namespace, agent, tunnel, or hardware ID, operator, target, mode,
      ticket or consent, and time, retain provider, endpoint, and OOB audit, and rapidly revoke unauthorized control.
domains:
- enterprise
measures:
- key: controller-namespace-and-capability-inventory
  name:
    zh: 控制端命名空间与远控能力清单
    en: Controller Namespace and Remote-Control Capability Inventory
  description:
    paragraphs:
    - zh: 按 vendor tenant/org/account、agent/tunnel/device ID、target、software/hash/signer、service/extension 与 owner 建正向清单；禁用不需要的远控/IDE
        tunnel，Dev Tunnels 只允许批准 Entra tenant，portable/anonymous/consumer controller 默认阻断。
      en: Build a positive inventory by vendor tenant, organization, or account; agent, tunnel, or device ID; target;
        software, hash, and signer; service or extension; and owner. Disable unneeded remote control and IDE tunnels,
        allow Dev Tunnels only for approved Entra tenants, and deny portable, anonymous, or consumer controllers by default.
  control_type: preventive
- key: jit-session-approval-and-consent
  name:
    zh: 即时会话批准与同意
    en: JIT Session Approval and Consent
  description:
    paragraphs:
    - zh: 每次 session 绑定实名 operator、phishing-resistant MFA、ticket/change、target、purpose、access mode、start/end、approver
        和可核查 user consent；scope/mode/target 改变强制重批，emergency 有 owner/expiry/retrospective review。
      en: Bind every session to a named operator, phishing-resistant MFA, ticket or change, target, purpose, access mode,
        start and end, approver, and verifiable user consent. Scope, mode, or target change forces reapproval, while
        emergency access has owner, expiry, and retrospective review.
  control_type: preventive
- key: provider-endpoint-session-audit-export
  name:
    zh: Provider—Endpoint 会话审计导出
    en: Provider-to-Endpoint Session Audit Export
  description:
    paragraphs:
    - zh: 导出 controller identity/tenant/source、agent/tunnel/device、session、mode、action、file/terminal、start/end/result，并与
        endpoint agent lifecycle、process/file/network、identity sign-in 和 ticket 对齐；不把 signed agent 放入遥测排除。
      en: Export controller identity, tenant and source, agent, tunnel or device, session, mode, action, file or terminal,
        start and end, and result, aligning them with endpoint agent lifecycle, process, file, network, identity sign-in,
        and ticket. Do not exclude a signed agent from telemetry.
  control_type: detective-support
- key: out-of-band-hardware-custody-and-segmentation
  name:
    zh: 带外硬件保管与网络隔离
    en: Out-of-Band Hardware Custody and Network Segmentation
  description:
    paragraphs:
    - zh: 未需 KVM 的 endpoint 禁止相关 USB/video/HID 组合；批准设备记录 serial/fingerprint、MAC/IP、switch port、target、controller、位置、custody
        与时限，置于专用 OOB network、强 MFA/JIT、独立日志和 physical inspection。
      en: Prohibit KVM-related USB, video, and HID combinations on endpoints without need. Approved devices record serial
        or fingerprint, MAC and IP, switch port, target, controller, location, custody, and validity and reside on a
        dedicated OOB network with strong MFA, JIT, independent logs, and physical inspection.
  control_type: exposure-reduction
- key: rapid-remote-control-revocation
  name:
    zh: 远控能力快速撤销
    en: Rapid Remote-Control Revocation
  description:
    paragraphs:
    - zh: 发现 unapproved binding/session/device 时同时 terminate session、unregister/revoke agent/tunnel/token、disable controller
        account、isolate target 与 OOB device，并保留 provider/ticket/endpoint evidence；只杀本地进程不足。
      en: On unapproved binding, session, or device, terminate the session, unregister or revoke agent, tunnel, and token,
        disable controller account, isolate target and OOB device, and preserve provider, ticket, and endpoint evidence.
        Killing only the local process is insufficient.
  control_type: containment
applications:
- target_ref: NJT-0212
  use:
    paragraphs:
    - zh: 所有远控 capability 必须同时满足 inventory binding 与 per-session workflow，endpoint/software、provider/controller 和 OOB
        hardware 三平面至少保留可连接 ID。
      en: Every remote-control capability must satisfy both inventory binding and per-session workflow, with joinable
        IDs retained across endpoint or software, provider or controller, and OOB hardware planes.
  expected_effect:
    paragraphs:
    - zh: 合法工具身份不再等于任意操作者授权，新 enrollment、workflow mismatch 或 OOB device 会产生可处置差分。
      en: Legitimate tool identity no longer equals authorization for any operator, and new enrollment, workflow mismatch,
        or OOB device creates an actionable differential.
  limitations:
    paragraphs:
    - zh: vendor 不开放日志、外部 tenant、紧急支持、隐私和多 MSP 运营会限制精度；严格阻断可能妨碍支持和开发。
      en: Providers without audit, outside tenants, emergency support, privacy, and multi-MSP operations limit precision;
        strict blocking can impair support and development.
- target_ref: NJS-0212-001
  use:
    paragraphs:
    - zh: 只允许批准 tenant/org/controller 创建/注册 agent、IDE tunnel 或 device，首次 session 前验证 target/owner 并自动撤销未知 binding。
      en: Allow only approved tenants, organizations, or controllers to create or register agents, IDE tunnels, or devices,
        verify target and owner before first session, and automatically revoke unknown bindings.
  expected_effect:
    paragraphs:
    - zh: 攻击者难以仅凭合法 binary/vendor 建立其自有控制命名空间，registration 与 first use 都留痕。
      en: The actor cannot establish an owned controller namespace merely through a legitimate binary or vendor, and
        registration and first use both leave evidence.
  limitations:
    paragraphs:
    - zh: 被盗批准 controller 或 self-created tunnel 绕过弱政策，需 identity/device/outcome 补充。
      en: A stolen approved controller or self-created tunnel can bypass weak policy and needs identity, device, and
        outcome controls.
- target_ref: NJS-0212-002
  use:
    paragraphs:
    - zh: 每次 full-control/view/file/terminal session 按 exact operator/target/mode/window/ticket/consent 授权并记录，异常立即终止和调查后继动作。
      en: Authorize and record every full-control, view, file, or terminal session by exact operator, target, mode, window,
        ticket, and consent, terminating anomalies and investigating successor actions.
  expected_effect:
    paragraphs:
    - zh: 用户点击 Allow 或 signed agent 不再替代组织批准，帮助台仿冒和被盗 operator session 更早暴露。
      en: A user Allow click or signed agent no longer substitutes for organizational approval, exposing help-desk impersonation
        and stolen-operator sessions earlier.
  limitations:
    paragraphs:
    - zh: Quick Assist 等产品详细日志短缺，共享 operator 和紧急流程需要额外 endpoint/user evidence。
      en: Products such as Quick Assist lack detailed logs, and shared operators and emergency workflows need additional
        endpoint and user evidence.
- target_ref: NJS-0212-003
  use:
    paragraphs:
    - zh: 以 hardware fingerprint+MAC+port+custody+controller 管理 KVM，专用 OOB segment 禁止直达生产身份面，定期现场核查和撤销未知设备。
      en: Manage KVM through hardware fingerprint plus MAC, port, custody, and controller, prevent a dedicated OOB segment
        from directly reaching production identity planes, and periodically inspect and revoke unknown devices.
  expected_effect:
    paragraphs:
    - zh: 宿主 EDR 外的控制仍产生资产、网络、身份与保管差分，未知 KVM 可在远端操作前隔离。
      en: Control outside host EDR still creates asset, network, identity, and custody differentials, allowing an unknown
        KVM to be isolated before remote operation.
  limitations:
    paragraphs:
    - zh: HDMI 与仿真身份可对 host 隐形/伪造，facilitator 可隐藏物理设备；需要 NAC、switch 和实物核查。
      en: HDMI and emulated identities can be invisible or spoofed to the host and a facilitator can hide hardware, requiring
        NAC, switch, and physical inspection.
