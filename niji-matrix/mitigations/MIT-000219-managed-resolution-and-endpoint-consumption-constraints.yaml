schema_version: 2.0.0
type: mitigation
id: MIT-000219
name:
  zh: 受管解析与端点消费约束
  en: Managed Resolution and Endpoint-Consumption Constraints
summary:
  zh: 通过受管解析、应答历史和端点出口约束降低动态端点轮换与参数合成。
  en: Use managed resolution, answer history, and endpoint egress constraints to reduce dynamic endpoint rotation and
    parameter synthesis.
description:
  paragraphs:
  - zh: 强制工作负载经受管解析器，保留客户端—应答映射，并让 DNS 应答不能自动授权任意进程、地址或端口的后继外联。
    en: Force workloads through managed resolvers, retain client-to-answer mappings, and prevent a DNS answer from automatically
      authorizing successor egress by any process, address, or port.
domains:
- enterprise
measures:
- key: managed-resolver-path
  name:
    zh: managed_resolver_path
    en: managed_resolver_path
  description:
    paragraphs:
    - zh: 除批准 resolver/DoH 服务外阻断直接 DNS/DoT/DoH，集中记录 query/answer/TTL/rcode/client，并对高置信恶意域 sinkhole/block。
      en: Block direct DNS, DoT, and DoH except approved resolvers or DoH services, centrally record query, answer, TTL,
        rcode, and client, and sinkhole or block high-confidence malicious domains.
  control_type: preventive
- key: process-endpoint-binding
  name:
    zh: process_endpoint_binding
    en: process_endpoint_binding
  description:
    paragraphs:
    - zh: 以软件身份、设备角色、域/服务 owner、端口和短时解析关系控制外联；解析成功不自动把所有 answer IP/计算 port 加入长期允许。
      en: Control egress by software identity, device role, domain or service owner, port, and short-lived resolution
        relationship; successful resolution must not add every answer IP or calculated port to a durable allowlist.
  control_type: preventive
- key: versioned-resolution-lineage
  name:
    zh: versioned_resolution_lineage
    en: versioned_resolution_lineage
  description:
    paragraphs:
    - zh: 保存解析版本、端点连接、RDAP/被动 DNS/证书历史及阻断结果，能从当前 endpoint 追溯同一动态关系。
      en: Retain resolution versions, endpoint connections, RDAP, passive-DNS and certificate history, and block outcomes
        so a current endpoint can be traced across the same dynamic relationship.
  control_type: detective-support
applications:
- target_ref: NJT-0213
  use:
    paragraphs:
    - zh: 将所有运行时 locator 求值限制到受管解析/配置路径，并按进程验证得到 endpoint 的首次及后继连接。
      en: Confine runtime locator evaluation to managed resolution or configuration paths and validate first and successor
        connections to the derived endpoint by process.
  expected_effect:
    paragraphs:
    - zh: 减少未审计动态解析并使静态 IoC 变化仍保留跨版本谱系。
      en: Reduce unaudited dynamic resolution and retain cross-version lineage despite static-IoC changes.
  limitations:
    paragraphs:
    - zh: 外部应用可内置 DoH、合法 SaaS/CDN 高度动态，受管解析器被绕过或日志不含客户端时控制失效。
      en: Applications can embed DoH and legitimate SaaS or CDN services are highly dynamic; bypassed managed resolvers
        or logs without client identity defeat the control.
- target_ref: NJS-0213-001
  use:
    paragraphs:
    - zh: 对同一服务的 answer pool 绑定批准 provider/ASN/证书/进程，并在轮换时重新评估，而不是将旧域名信誉永久传递给所有新 IP。
      en: Bind an answer pool to approved provider, ASN, certificate, and process and reevaluate on rotation rather than
        permanently transferring old domain reputation to every new IP.
  expected_effect:
    paragraphs:
    - zh: 限制恶意轮换池通过单一域名持续获得信任，并保存每个已消费 IP。
      en: Prevent a malicious rotating pool from inheriting durable trust from one domain and retain every consumed IP.
  limitations:
    paragraphs:
    - zh: CDN/多云/灾备需要宽动态集合；证书/ECH/共享 IP 可能不能区分租户。
      en: CDN, multicloud, and disaster recovery require broad dynamic sets; certificates, ECH, and shared IPs may not
        distinguish tenants.
- target_ref: NJS-0213-003
  use:
    paragraphs:
    - zh: 进程外联仍须匹配批准服务的 destination/port 角色，DNS answer 或标准 resolver 成功不能授权计算出的未知 port/IP。
      en: Process egress must still match approved destination and port roles; a DNS answer or successful standard resolution
        must not authorize an unknown calculated port or IP.
  expected_effect:
    paragraphs:
    - zh: 阻断利用解析材料绕过端口/地址策略，并把异常 transform 输出暴露为策略差。
      en: Block use of resolver material to bypass address or port policy and expose anomalous transform output as a
        policy differential.
  limitations:
    paragraphs:
    - zh: 动态协商端口、媒体和服务发现需要细粒度例外；被盗批准进程或隧道仍可绕过。
      en: Dynamically negotiated ports, media, and service discovery need precise exceptions; a compromised approved
        process or tunnel can still bypass controls.
