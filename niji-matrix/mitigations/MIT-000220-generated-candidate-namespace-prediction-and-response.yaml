schema_version: 2.0.0
type: mitigation
id: MIT-000220
name:
  zh: 生成候选命名空间预测与处置
  en: Generated-Candidate Namespace Prediction and Response
summary:
  zh: 治理生成式 locator 命名空间、注册与证书生命周期，并阻断未批准候选族。
  en: Govern generated-locator namespaces, registration, and certificate lifecycle and block unapproved candidate families.
description:
  paragraphs:
  - zh: 从样本/内存恢复生成规则，在受控时间窗预测候选、阻断或 sinkhole 高置信集合，并通过注册/证书监控和 endpoint 消费确认处置效果。
    en: Recover generation rules from samples or memory, predict candidates for controlled periods, block or sinkhole
      high-confidence sets, and verify response through registration, certificate monitoring, and endpoint consumption.
domains:
- enterprise
measures:
- key: bounded-candidate-prediction
  name:
    zh: bounded_candidate_prediction
    en: bounded_candidate_prediction
  description:
    paragraphs:
    - zh: 版本化算法、seed/词表与时钟假设，生成有限前后窗口候选并记录碰撞/置信；不用词法模型替代逆向证据。
      en: Version algorithm, seed or word list, and clock assumptions, generate candidates for bounded past and future
        windows, and record collision and confidence; do not substitute a lexical model for reverse-engineering evidence.
  control_type: detective-support
- key: sinkhole-block-registration-coordination
  name:
    zh: sinkhole_block_registration_coordination
    en: sinkhole_block_registration_coordination
  description:
    paragraphs:
    - zh: 对高置信未注册/恶意候选执行到期阻断、sinkhole 或与 registrar/provider 协调；保存 sinkhole 请求及原始解析者。
      en: Apply expiring block or sinkhole or coordinate with registrar or provider for high-confidence unregistered
        or malicious candidates; retain sinkhole requests and original resolvers.
  control_type: containment
- key: registration-certificate-watch
  name:
    zh: registration_certificate_watch
    en: registration_certificate_watch
  description:
    paragraphs:
    - zh: 监控候选 RDAP 注册、NS 变化与 CT 证书，发现攻击者激活后立即与 endpoint query/connection 关联。
      en: Monitor candidate RDAP registration, nameserver changes, and CT certificates and immediately correlate actor
        activation with endpoint queries and connections.
  control_type: detective-support
applications:
- target_ref: NJS-0213-002
  use:
    paragraphs:
    - zh: 对已恢复的 generator 在每周期预测并处置候选，同时检查同进程是否仍消费未预测/变体 endpoint。
      en: Predict and handle candidates for each recovered generator period while checking whether the same process still
        consumes unpredicted or variant endpoints.
  expected_effect:
    paragraphs:
    - zh: 提前降低可用候选并把生成器从单域阻断问题转为版本化命名空间控制。
      en: Reduce available candidates in advance and turn the generator from a single-domain blocking problem into versioned
        namespace control.
  limitations:
    paragraphs:
    - zh: 预测和抢注存在法律/成本/碰撞风险；未知 seed、用户特定 key、快速变体和私有 resolver 会降低覆盖，sinkhole 本身需严格隔离。
      en: Prediction and pre-registration carry legal, cost, and collision risks. Unknown seeds, user-specific keys,
        rapid variants, and private resolvers reduce coverage, and sinkholes require strict isolation.
evidence_refs:
