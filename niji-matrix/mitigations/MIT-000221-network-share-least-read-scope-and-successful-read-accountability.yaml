schema_version: 2.0.0
type: mitigation
id: MIT-000221
name:
  zh: 网络共享最小读取范围与成功读取问责
  en: Network-Share Least Read Scope and Successful-Read Accountability
summary:
  zh: 以最小授权、对象范围和审计结果降低网络共享最小读取范围与成功读取问责相关风险。
  en: Reduce risk through least authorization, object scope, and auditable outcomes for Network-Share Least Read Scope and
    Successful-Read Accountability.
description:
  paragraphs:
  - zh: 以业务 owner、主体职责和内容敏感度缩小共享/文件系统读取权，清理不再需要的持久映射，并在高价值对象上验证成功读取审计与独立保留。控制同时维护备份、扫描、索引和迁移任务清单，使合法批量读取有明确来源、路径、目的和到期时间。
    en: Narrow share and filesystem read rights by business owner, principal duty, and content sensitivity, remove persistent
      mappings no longer required, and validate successful-read audit with independent retention on high-value objects. Maintain
      an inventory of backup, scanning, indexing, and migration jobs so legitimate bulk reads have explicit source, path,
      purpose, and expiry.
domains:
- enterprise
measures:
- key: least-share-and-object-read
  name:
    zh: 控制措施：least_share_and_object_read
    en: Least_Share_And_Object_Read
  description:
    paragraphs:
    - zh: 分别审查共享权限、NTFS/NFS ACL、export policy 和服务账户权限，使用户与工作负载只能读取职责所需路径；移除离职/转岗、临时项目和过期服务身份的宽泛访问，并用独立敏感标签标记重点对象。
      en: Review share permissions, NTFS or NFS ACLs, export policy, and service-account rights separately so users and workloads
        read only duty-required paths. Remove broad access for departed or transferred staff, temporary projects, and expired
        service identities, and mark priority objects through an independent sensitivity registry.
  control_type: exposure-reduction
- key: mapping-and-reader-inventory
  name:
    zh: 控制措施：mapping_and_reader_inventory
    en: Mapping_And_Reader_Inventory
  description:
    paragraphs:
    - zh: 清点 GPO、登录脚本、客户端和用户创建的持久映射，记录 owner、用户组、源设备范围、UNC/export 和有效期；同时登记备份、恢复、杀毒、DLP/分类、索引、电子发现与迁移 job 的进程、身份、路径及时间。
      en: Inventory persistent mappings created by Group Policy, logon scripts, clients, and users, recording owner, user
        group, source-device scope, UNC or export, and expiry. Also register process, identity, paths, and schedule for backup,
        restore, antimalware, DLP or classification, indexing, e-discovery, and migration jobs.
  control_type: governance
- key: targeted-successful-read-audit
  name:
    zh: 控制措施：targeted_successful_read_audit
    en: Targeted_Successful_Read_Audit
  description:
    paragraphs:
    - zh: 对少量高价值 Windows 共享配置 5145 和 ReadData SACL/4663，对 NAS/NFS 配置受支持的成功 READ 审计或 FPolicy；用测试读取验证字段与成功语义，监测日志容量、转换失败和丢失，并把日志写入共享管理员无法修改的存储。
      en: Configure 5145 plus ReadData SACL and 4663 for a small set of high-value Windows shares and supported successful-READ
        audit or FPolicy for NAS and NFS. Verify fields and success semantics with test reads, monitor capacity, conversion
        failures, and loss, and write logs to storage that share administrators cannot alter.
  control_type: detective-support
- key: administrative-bypass-path-control
  name:
    zh: 控制措施：administrative_bypass_path_control
    en: Administrative_Bypass_Path_Control
  description:
    paragraphs:
    - zh: 限制能通过存储管理 REST、快照、备份接口或管理员通道直接读取内容的主体与网络来源，使用独立管理身份和强认证，并为这些旁路建立单独控制面审计，避免把其覆盖误算为普通 NAS 文件审计。
      en: Restrict principals and network origins able to read content through storage-management REST, snapshot, backup,
        or administrative channels, use separate strongly authenticated management identities, and retain independent control-plane
        audit rather than assuming ordinary NAS file audit covers those bypasses.
  control_type: preventive
applications:
- target_ref: NJT-0216
  use:
    paragraphs:
    - zh: 对匿迹型网络共享内容获取，按业务职责缩小共享与对象读取范围，标记高敏路径，在服务器端验证成功读取审计，并把读取主体/客户端同批准备份、扫描、索引、迁移和用户工作流清单比较。
      en: For Stealth-Oriented Network Share Content Acquisition, narrow share and object reads by duty, label sensitive paths,
        validate server-side successful-read audit, and compare reader principal and client with approved backup, scanning,
        indexing, migration, and user workflows.
  expected_effect:
    paragraphs:
    - zh: 减少一个受陷身份可从共享取得的内容集合，并把允许访问但越出职责/任务范围的成功读取变成可关联事件；攻击者需要扩大权限、切换管理旁路或留下更多服务器与客户端痕迹。
      en: Reduce the content a compromised identity can obtain and make successful reads outside duty or job scope correlatable
        even when authorization succeeds. The adversary must broaden privileges, move to an administrative bypass, or leave
        more server and client traces.
  limitations:
    paragraphs:
    - zh: 已被攻陷且本来有广泛读取权的用户、备份代理或迁移身份仍可取数；精细 ACL 会增加运维成本，成功读取审计有容量与性能代价，且不能追回已复制内容或证明未监控路径安全。
      en: A compromised user, backup agent, or migration identity with legitimate broad read rights can still collect data.
        Fine-grained ACLs increase operational cost, successful-read audit consumes capacity and performance, and the control
        cannot retract copied content or establish safety on unmonitored paths.
- target_ref: NJS-0216-001
  use:
    paragraphs:
    - zh: 对既有映射共享语境复用，删除无业务必要或无 owner 的登录映射，把每个映射绑定用户组、设备组和 UNC/export；保留映射策略/状态与登录 LUID，并在高敏路径将成功读取回接客户端进程和批准任务。
      en: For Preexisting Mapped-Share Context Reuse, remove logon mappings without a business need or owner, bind each mapping
        to user group, device group, and UNC or export, retain mapping policy or state with logon LUID, and join successful
        reads on sensitive paths back to client process and approved work.
  expected_effect:
    paragraphs:
    - zh: 缩小恶意进程可直接继承的共享命名空间，并使复用正常身份但由异常进程触发的读取更容易与批准用户/任务分开；攻击者可能被迫建立新连接并增加映射或认证痕迹。
      en: Shrink the share namespace a malicious process can inherit and make reads under a normal identity but abnormal process
        easier to separate from approved users and jobs. The adversary may be forced to create a new connection and add mapping
        or authentication traces.
  limitations:
    paragraphs:
    - zh: 用户业务可能依赖持久映射，恶意代码若注入批准进程或同一备份代理仍可继承例外；许多环境无法可靠保留映射首次出现时间或 LUID，且直接 UNC 访问不受清理盘符本身阻止。
      en: Business workflows may depend on persistent mappings, and malware injected into an approved process or backup agent
        can inherit its exception. Many environments cannot reliably retain mapping first-seen time or LUID, and direct UNC
        access is not prevented merely by cleaning drive letters.
