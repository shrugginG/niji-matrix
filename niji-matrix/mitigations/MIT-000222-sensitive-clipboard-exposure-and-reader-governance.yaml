schema_version: 2.0.0
type: mitigation
id: MIT-000222
name:
  zh: 敏感剪贴板暴露与读取主体治理
  en: Sensitive-Clipboard Exposure and Reader Governance
summary:
  zh: 减少敏感内容进入或长驻剪贴板的机会，限制未批准监听与跨会话同步，并为合法读取主体建立精确授权边界。
  en: Reduce opportunities for sensitive content to enter or persist in clipboards, restrict unapproved listeners and cross-session
    synchronization, and define exact authorization boundaries for legitimate readers.
description:
  paragraphs:
  - zh: 剪贴板是大量业务流程依赖的共享会话能力，无法在所有终端整体禁用。本缓解先按数据敏感度和工作流减少暴露：优先使用与目标站点或应用绑定的密码管理器 autofill 或 passkey，关闭不必要的自动 TOTP 复制并设置短清理间隔；对受管敏感文件用
      Endpoint DLP 审计、阻断或经批准覆盖“复制到剪贴板”；由应用写入的敏感项按平台能力排除历史与云同步。清理、history 和 cloud 标志缩短或限制持久化与传播，但不能阻止内容在清理前被实时 listener 读取。
    en: The clipboard is a shared session capability required by many business workflows and cannot be disabled universally.
      This mitigation first reduces exposure by data sensitivity and workflow. Prefer password-manager autofill or passkeys
      bound to the destination site or app, disable unnecessary automatic TOTP copying, and set a short clear interval. Use
      Endpoint DLP to audit, block, or allow approved override of copy-to-clipboard from managed sensitive files. Where applications
      write sensitive items, use platform capabilities to exclude them from history and cloud synchronization. Clearing, history,
      and cloud flags shorten or limit persistence and propagation but do not stop a real-time listener before clearing.
  - zh: 其次盘点剪贴板历史、密码管理器、DLP、远程支持、RDP、虚拟化 guest tools、无障碍与自动化组件，按精确包哈希、版本、owner、用户或会话范围、允许格式、数据方向和目的地授权；通过应用控制、受管安装和到期工单限制未知后台
      listener。敏感远程桌面、VDI 与管理会话在无业务需要时禁用或按方向和类型收紧剪贴板重定向。对粘贴消费者进程内截获，应另由 MIT-000102 的最小跨进程访问、动态代码与模块来源完整性控制削弱注入前提。
    en: Next inventory clipboard history, password managers, DLP, remote support, RDP, virtualization guest tools, accessibility,
      and automation components, authorizing them by exact package hash, version, owner, user or session scope, allowed format,
      data direction, and destination. Use application control, managed installation, and expiring work orders to restrict
      unknown background listeners. Disable or directionally and type-restrict clipboard redirection in sensitive remote-desktop,
      VDI, and management sessions where no business need exists. For interception inside paste-consuming processes, separately
      apply MIT-000102's least cross-process access, dynamic-code, and module-provenance integrity controls to weaken injection
      prerequisites.
domains:
- enterprise
measures:
- key: sensitive-copy-minimization
  name:
    zh: 最小化敏感内容复制
    en: Minimize sensitive-content copying
  description:
    paragraphs:
    - zh: 对凭据与令牌优先部署目标绑定 autofill、passkey 或 broker 流程，关闭无必要的自动复制；对受管敏感文件配置 Endpoint DLP 的复制到剪贴板审计、阻断或经批准覆盖，并保留 policy、用户、源对象与结果。
      en: Prefer destination-bound autofill, passkeys, or brokered flows for credentials and tokens and disable unnecessary
        automatic copying. Configure Endpoint DLP copy-to-clipboard audit, block, or approved override for managed sensitive
        files and retain policy, user, source object, and result.
  control_type: exposure-reduction
- key: clipboard-residence-history-and-sync-control
  name:
    zh: 剪贴板驻留、历史与同步控制
    en: Clipboard residence, history, and synchronization control
  description:
    paragraphs:
    - zh: 为密码管理器和敏感业务应用设置最短可用清理时间，并在支持的平台上把敏感项排除出 clipboard history 与 cloud clipboard；在无业务需求的受管终端关闭历史或跨设备同步，并记录例外。
      en: Set the shortest usable clear interval for password managers and sensitive business apps, and exclude sensitive
        items from clipboard history and cloud clipboard where supported. Disable history or cross-device synchronization
        on managed endpoints without a business need and record exceptions.
  control_type: exposure-reduction
- key: approved-reader-and-listener-inventory
  name:
    zh: 精确登记读取与监听主体
    en: Precisely register readers and listeners
  description:
    paragraphs:
    - zh: 按 package/hash/version、owner、会话、允许格式、数据方向、输出目的地和到期窗口登记剪贴板管理器、DLP、远程支持、VM 工具与无障碍组件，通过受管安装或应用控制限制未批准后台 listener，签名或产品类别不能成为永久全局放行条件。
      en: Register clipboard managers, DLP, remote support, VM tools, and accessibility components by package or hash, version,
        owner, session, allowed format, data direction, output destination, and expiry. Restrict unapproved background listeners
        through managed installation or application control, and never use signature or product category as a permanent global
        allow condition.
  control_type: governance
- key: remote-session-clipboard-boundary
  name:
    zh: 约束远程会话剪贴板边界
    en: Constrain remote-session clipboard boundaries
  description:
    paragraphs:
    - zh: 对管理、VDI 与高敏远程会话按业务需要禁用、单向化或限制剪贴板重定向的数据类型，并把本地端、session host 与 host-pool 等多层策略的最终生效结果纳入验证。
      en: Disable, make one-way, or restrict clipboard-redirection data types for administrative, VDI, and sensitive remote
        sessions according to business need, and validate the resultant policy across local device, session host, and host-pool
        layers.
  control_type: preventive
applications:
- target_ref: NJT-0214
  use:
    paragraphs:
    - zh: 对敏感复制工作流采用 autofill/passkey、DLP copy 控制、短清理和 history/cloud 排除；对能够读取剪贴板的后台程序建立精确授权与结果目的地清单，并在远程会话收紧重定向。
      en: Apply autofill or passkeys, DLP copy controls, short clearing, and history or cloud exclusion to sensitive-copy
        workflows. Maintain exact authorization and outcome-destination inventories for background clipboard readers and tighten
        redirection in remote sessions.
  expected_effect:
    paragraphs:
    - zh: 减少高价值内容进入、长驻或跨设备传播的次数与时间，并缩小攻击者可伪装成合法 reader 的主体集合，使未批准读取更易区分。
      en: Reduce how often and how long high-value content enters, persists in, or propagates through clipboards, while narrowing
        the set of actors in which an adversary can masquerade as a legitimate reader and improving discrimination of unauthorized
        reads.
  limitations:
    paragraphs:
    - zh: 业务复制粘贴无法全部取消，清理发生前的实时读取仍可能成功；history/cloud 与 RDP 控制不限制同一会话中所有本地 API，DLP 也只覆盖已纳管数据、应用与平台。
      en: Business copy and paste cannot be eliminated, and real-time reading can succeed before clearing. History, cloud,
        and RDP controls do not constrain every local API in the same session, while DLP covers only managed data, apps, and
        platforms.
- target_ref: NJS-0214-001
  use:
    paragraphs:
    - zh: 将后台 listener 许可收紧到确切的剪贴板管理器、密码管理器、DLP、远程支持与虚拟化组件，记录其用户或会话范围、格式、输出和到期时间；对其他长期隐藏 listener 阻断或隔离，并减少敏感内容可被变化事件触发读取的驻留时间。
      en: Restrict background-listener permission to exact clipboard managers, password managers, DLP, remote-support, and
        virtualization components with recorded user or session scope, formats, outputs, and expiry. Block or isolate other
        long-lived hidden listeners and shorten the residence of sensitive content available to change-triggered reads.
  expected_effect:
    paragraphs:
    - zh: 减少未批准事件订阅者的执行机会，并让剩余变化后读取能够与有限的批准主体和目的地比较；短清理和 DLP 还降低 listener 命中高价值内容的概率。
      en: Reduce execution opportunities for unapproved event subscribers and make remaining post-change reads comparable
        to a small approved actor and destination set. Short clearing and DLP also lower the probability that a listener captures
        high-value content.
  limitations:
    paragraphs:
    - zh: 注入批准 listener、内核控制或自带消息窗口的已放行程序仍可读取；签名应用也可能被劫持，且严格阻断会影响剪贴板历史、远程支持、无障碍和生产力工具。
      en: Injection into an approved listener, kernel control, or an allowed program with its own message window can still
        read content. Signed apps can be hijacked, and strict blocking can disrupt clipboard history, remote support, accessibility,
        and productivity tools.
- target_ref: NJS-0214-002
  use:
    paragraphs:
    - zh: 用本缓解减少敏感内容进入剪贴板，并同时为正常粘贴消费者限定批准 reader 与输出；把防止进程内截获的代码写入、动态代码、模块来源和 callback 完整性措施交由 MIT-000102 的新增目标 Application
        实施。
      en: Use this mitigation to reduce sensitive content entering the clipboard and to constrain approved readers and outputs
        for normal paste consumers. Apply process-write, dynamic-code, module-provenance, and callback-integrity controls
        against in-process interception through a new target application under MIT-000102.
  expected_effect:
    paragraphs:
    - zh: 即使 hook 已进入消费者，攻击者可取得的高价值剪贴板内容更少；与 MIT-000102 联合实施时，还会提高进入并维持粘贴调用路径介入的成本。
      en: Even if a hook enters the consumer, less high-value clipboard content is available. Combined with MIT-000102, the
        control also raises the cost of entering and maintaining interposition on the paste call path.
  limitations:
    paragraphs:
    - zh: 本缓解本身不验证函数入口或阻止所有进程注入；业务必须复制的普通文本仍可被截获，且受信 DLP 或辅助组件与恶意 hook 仍需代码来源和结果关联区分。
      en: This mitigation does not itself validate function entries or block every injection path. Ordinary text required
        by business workflows remains interceptable, and trusted DLP or accessibility components still require code-provenance
        and outcome correlation to distinguish them from malicious hooks.
