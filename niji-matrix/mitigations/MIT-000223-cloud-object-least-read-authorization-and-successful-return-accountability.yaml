schema_version: 2.0.0
type: mitigation
id: MIT-000223
name:
  zh: 云对象最小读取授权与成功返回问责
  en: Cloud Object Least Read Authorization and Successful-Return Accountability
summary:
  zh: 以最小授权、对象范围和审计结果降低云对象最小读取授权与成功返回问责相关风险。
  en: Reduce risk through least authorization, object scope, and auditable outcomes for Cloud Object Least Read Authorization
    and Successful-Return Accountability.
description:
  paragraphs:
  - zh: 以对象敏感度、业务职责和工作负载目的分别治理列举、正文读取、公开权限、密钥与 bearer link，并为高价值存储验证服务端成功返回日志。控制保留正常同步、备份、ETL、迁移、电子发现和管理员工作的 owner、主体、客户端、对象范围、目的地和有效期，使合法大范围读取不成为永久盲区。
    en: Govern listing, body reads, public permission, keys, and bearer links separately by object sensitivity, business duty,
      and workload purpose, and validate provider-side successful-return logging for high-value storage. Retain owner, principal,
      client, object scope, destination, and validity for normal synchronization, backup, ETL, migration, e-discovery, and
      administrative work so broad legitimate reads do not become permanent blind spots.
domains:
- enterprise
measures:
- key: least-object-body-read
  name:
    zh: 控制措施：least_object_body_read
    en: Least_Object_Body_Read
  description:
    paragraphs:
    - zh: 将正文读取权限制到必要 account/project/tenant、container/drive、prefix/object 和时间；把 List/metadata 与 Get/download 权限分离，清理过宽 role、全账户
        storage key 权限和无 owner 的云盘共享，并以独立敏感标签维护重点对象。
      en: Scope body-read authority to necessary account, project, or tenant; container or drive; prefix or object; and time.
        Separate List and metadata from Get and download, remove overbroad roles, full-account storage-key authority, and
        ownerless cloud-drive shares, and maintain priority objects through an independent sensitivity catalog.
  control_type: exposure-reduction
- key: identity-bound-access-and-bearer-guardrails
  name:
    zh: 控制措施：identity_bound_access_and_bearer_guardrails
    en: Identity_Bound_Access_And_Bearer_Guardrails
  description:
    paragraphs:
    - zh: 优先使用可撤销、可审计且受条件访问约束的 identity-bound 授权；对 Azure 在兼容时禁用 Shared Key 并使用最小范围 user-delegation SAS，对 AWS 保持 Block Public
        Access 并以 signatureAge、source network 与精确 object 约束预签名 URL，对 GCP 执行 Public Access Prevention 并限制签名者、方法、对象和有效期。载体必须有
        owner、受众/来源、目的和到期。
      en: Prefer revocable, auditable, identity-bound authorization subject to conditional access. Disable Azure Shared Key
        where compatible and use minimally scoped user-delegation SAS; retain AWS Block Public Access and constrain presigned
        URLs by signatureAge, source network, and exact object; enforce GCP Public Access Prevention and restrict signer,
        method, object, and lifetime. Every carrier needs an owner, audience or origin, purpose, and expiry.
  control_type: preventive
- key: verified-data-plane-success-logging
  name:
    zh: 控制措施：verified_data_plane_success_logging
    en: Verified_Data_Plane_Success_Logging
  description:
    paragraphs:
    - zh: 对高价值对象用受控 200/206 正文读取和失败/metadata 对照验证 AWS CloudTrail data events+server access log、Azure StorageBlobLogs、GCP DATA_READ+usage
        logs 与 M365 FileDownloaded/FileSyncDownloadedFull；监测配置漂移、路由失败、延迟、重复和保留，日志写入存储管理员不可修改的位置。
      en: Use controlled 200 or 206 body reads plus failed and metadata controls to validate AWS CloudTrail data events and
        server access logs, Azure StorageBlobLogs, GCP DATA_READ and usage logs, and Microsoft 365 FileDownloaded or FileSyncDownloadedFull
        on high-value objects. Monitor configuration drift, routing failure, delay, duplication, and retention, and write
        logs where storage administrators cannot modify them.
  control_type: detective-support
- key: approved-reader-and-destination-registry
  name:
    zh: 控制措施：approved_reader_and_destination_registry
    en: Approved_Reader_And_Destination_Registry
  description:
    paragraphs:
    - zh: 登记同步、备份、恢复、ETL、分析、扫描、迁移、电子发现、DLP 和管理员读取的 principal/client、源网络、user agent、对象范围、调度、目的地、owner、工单与有效期；对 workload role、service
        principal、account key 和签名服务账户分别维护，不以“备份账号”全局放行。
      en: Register principal or client, source network, user agent, object scope, schedule, destination, owner, ticket, and
        validity for synchronization, backup, restore, ETL, analytics, scanning, migration, e-discovery, DLP, and administrative
        reads. Track workload roles, service principals, account keys, and signing service accounts separately rather than
        globally allowing a backup account.
  control_type: governance
- key: carrier-exposure-response
  name:
    zh: 控制措施：carrier_exposure_response
    en: Carrier_Exposure_Response
  description:
    paragraphs:
    - zh: 发现公开权限、storage key、SAS 或签名 URL 异常后，先保全策略/ACL、签发、listKeys、数据面读取和目的地证据，再撤销链接/公开权限、轮换密钥、禁用 Shared Key 或签名主体并核查读取对象与响应字节。撤销只能阻止未来访问，不能证明此前未下载，应按对象敏感度处置潜在泄露。
      en: On abnormal public permission, storage key, SAS, or signed URL, preserve policy or ACL, issuance, listKeys, data-plane
        read, and destination evidence before revoking links or public permission, rotating keys, disabling Shared Key or
        signer, and assessing read objects and response bytes. Revocation blocks future access but cannot prove no prior download,
        so respond to potential exposure by object sensitivity.
  control_type: containment
applications:
- target_ref: NJT-0217
  use:
    paragraphs:
    - zh: 对匿迹型云存储内容获取，分别收紧对象正文权限和列举权限，对高价值存储验证成功内容返回日志，并把每次读取同批准主体/客户端、对象职责范围、来源和后继结果比较。
      en: For Stealth-Oriented Cloud Storage Content Acquisition, constrain object-body and listing permissions separately,
        validate successful-content-return logging on high-value storage, and compare each read with approved principal or
        client, duty-bound object scope, origin, and successor outcome.
  expected_effect:
    paragraphs:
    - zh: 一个受陷身份可读取的对象集合缩小，且服务端实际返回内容会留下可验证状态、响应字节、主体/载体和对象谱系；攻击者须扩大权限、使用受控范围外载体或接受更多跨平面痕迹。
      en: The object set readable by one compromised identity shrinks, while provider-returned content leaves verifiable status,
        response bytes, principal or carrier, and object lineage. The adversary must broaden authority, use an out-of-policy
        carrier, or accept more cross-plane traces.
  limitations:
    paragraphs:
    - zh: 已获批准且本来具有广泛读取权的备份、同步、管理员或分析主体被控后仍可取数；数据面日志有成本、容量、延迟和平台盲区，成功返回也不能追回数据或证明客户端完整保存。
      en: A compromised approved backup, synchronization, administrator, or analytics principal with broad read authority
        can still acquire data. Data-plane logs have cost, capacity, latency, and platform blind spots, and a successful return
        neither recalls data nor proves complete client retention.
- target_ref: NJS-0217-001
  use:
    paragraphs:
    - zh: 对消费主体解绑读取，默认阻止公开访问与共享账户密钥，bearer link 采用最小对象/动作、短到期、来源约束和可追溯签发工作流；把 public/key/SAS/signed 使用连接到服务端成功返回，并在撤销后按对象范围调查既往访问。
      en: For consumer-identity-decoupled retrieval, block public access and shared account keys by default, constrain bearer
        links to exact object and action, short expiry, source, and traceable issuance workflow, join public, key, SAS, or
        signed use to successful provider return, and investigate prior access by object scope after revocation.
  expected_effect:
    paragraphs:
    - zh: 实际消费者更常被迫使用可解析且受条件访问约束的身份，必要 bearer 载体具有明确 owner、范围和到期；匿名或密钥型读取更容易表现为政策偏离并同签发/暴露事件关联。
      en: The actual consumer is more often forced to use a resolvable identity subject to conditional access, while necessary
        bearer carriers gain an owner, scope, and expiry. Anonymous or key-based reads become easier to identify as policy
        deviations and join to issuance or exposure events.
  limitations:
    paragraphs:
    - zh: CDN、客户门户、软件分发、跨组织协作和旧式应用可能必须使用公开或 bearer 访问；来源 IP 可共享或被代理，签名者仍不等于持有者，短期链接在撤销前仍可复制完整内容。
      en: CDNs, customer portals, software distribution, cross-organization collaboration, and legacy applications can require
        public or bearer access. Source IP can be shared or proxied, the signer is still not the holder, and a short-lived
        link can copy complete content before revocation.
