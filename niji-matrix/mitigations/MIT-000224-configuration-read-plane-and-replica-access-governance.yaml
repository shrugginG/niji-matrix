schema_version: 2.0.0
type: mitigation
id: MIT-000224
name:
  zh: 配置读取面与副本访问治理
  en: Configuration Read-Plane and Replica Access Governance
summary:
  zh: 以最小授权、对象范围和审计结果降低配置读取面与副本访问治理相关风险。
  en: Reduce risk through least authorization, object scope, and auditable outcomes for Configuration Read-Plane and Replica
    Access Governance.
description:
  paragraphs:
  - zh: 将设备管理读取权限、自动化作业身份、配置响应审计和配置副本存储作为同一敏感内容链治理，限制谁能从哪些管理来源读取哪些配置对象，并让成功返回、保存副本及后续读取具备独立可核查记录。
    en: Govern device-management read authority, automation-job identity, configuration-response audit, and configuration-copy
      storage as one sensitive-content chain. Restrict who can read which configuration objects from which manager sources
      and preserve independently verifiable records of successful returns, saved copies, and later reads.
domains:
- enterprise
measures:
- key: isolate-and-authenticate-management-plane
  name:
    zh: 隔离并强认证管理平面
    en: Isolate and Strongly Authenticate the Management Plane
  description:
    paragraphs:
    - zh: 将 SSH、HTTPS、NETCONF/RESTCONF、SNMP 和配置传输限制在专用 OOB/management VRF 与批准管理器；淘汰 Telnet、HTTP、FTP/TFTP 和 SNMPv1/v2c，优先 SNMPv3
        authPriv、SSH/SFTP/SCP 及设备支持的强双向认证，并限制外部与横向设备可达性。
      en: Restrict SSH, HTTPS, NETCONF or RESTCONF, SNMP, and configuration transfer to dedicated out-of-band or management
        VRFs and approved managers. Retire Telnet, HTTP, FTP or TFTP, and SNMPv1 or v2c; prefer SNMPv3 authPriv, SSH, SFTP
        or SCP, and strong mutual authentication where supported, while limiting external and device-to-device reachability.
  control_type: exposure-reduction
- key: scope-automation-identities-and-views
  name:
    zh: 按作业约束自动化身份与配置视图
    en: Scope Automation Identities and Configuration Views by Job
  description:
    paragraphs:
    - zh: 为监控、备份、合规和应急任务使用独立可归因身份与短期委派，分别限制设备清单、MIB VACM read view、YANG/NACM 数据树、CLI 命令和导出目标；禁用共享默认 community 与无边界服务账户，并对职责外读取实施重新授权。
      en: Use distinct attributable identities and time-bounded delegation for monitoring, backup, compliance, and emergency
        work. Separately constrain device inventory, MIB VACM read views, YANG or NACM data trees, CLI commands, and export
        destinations. Disable shared default communities and unbounded service accounts, requiring reauthorization for out-of-duty
        reads.
  control_type: preventive
- key: retain-request-response-and-job-lineage
  name:
    zh: 保留请求响应与管理作业谱系
    en: Retain Request Response and Management-job Lineage
  description:
    paragraphs:
    - zh: 远程保存设备认证、命令/API/RPC、完成状态与返回量，并与 NMS job_id、发起人、审批、对象范围、结果路径和哈希连接。对 CLI 记账不覆盖的 NETCONF/XML/gRPC 等接口，启用对应服务或管理客户端审计和流量元数据；定期以脱敏配置测试从请求到内容产物的可见性。
      en: Remotely retain device authentication, command, API or RPC, completion status, and returned quantity, joined to
        NMS job ID, initiator, approval, object scope, result path, and hash. For interfaces such as NETCONF, XML, or gRPC
        not covered by CLI accounting, enable matching service or manager-client audit and traffic metadata. Periodically
        test request-to-content visibility with redacted configuration.
  control_type: detective-support
- key: protect-and-audit-configuration-replicas
  name:
    zh: 保护并审计配置副本
    en: Protect and Audit Configuration Replicas
  description:
    paragraphs:
    - zh: 将配置归档、provider script 输出、版本库与备份对象按高敏数据加密、分权、最小读取、不可篡改审计和保留策略管理；保存 device/version/hash 映射，对含口令或共享秘密的配置执行安全迁移、轮换与必要脱敏，且不让备份服务身份自动获得人工
        checkout 权限。
      en: Treat configuration archives, provider-script output, version repositories, and backup objects as highly sensitive
        data with encryption, separation of duties, least read access, tamper-resistant audit, and retention policy. Preserve
        device, version, and hash mapping, securely migrate, rotate, and where appropriate redact passwords or shared secrets,
        and do not automatically grant human checkout authority to backup-service identities.
  control_type: exposure-reduction
applications:
- target_ref: NJT-0218
  use:
    paragraphs:
    - zh: 对所有能返回设备配置的接口和副本维护统一数据流清单，限制管理可达性与读取范围，远程记录请求、成功响应、输出对象及后续读取，并定期验证配置中弱口令或可逆秘密已轮换。
      en: Maintain one data-flow inventory for every interface and copy that can return device configuration. Restrict management
        reachability and read scope, remotely record requests, successful responses, output objects, and later reads, and
        periodically verify rotation of weak or reversible secrets present in configuration.
  expected_effect:
    paragraphs:
    - zh: 减少攻击者直接取得配置的入口，使尝试、成功返回和已验证内容可分级，并降低配置泄露后横向移动与凭据恢复价值。
      en: Reduce entry paths for direct configuration acquisition, separate attempt, successful return, and verified content,
        and lower the lateral-movement and credential-recovery value of disclosed configuration.
  limitations:
    paragraphs:
    - zh: 旧设备可能只支持弱协议或有限审计，紧急排障需要宽权限；已控制设备、NMS、身份与日志接收端的攻击者仍可伪造多层证据，必须以独立快照和重建恢复。
      en: Legacy devices may support only weak protocols or limited audit, and emergency troubleshooting needs broad authority.
        An adversary controlling the device, NMS, identity, and log receiver can still falsify multiple layers, requiring
        independent snapshots and rebuild for recovery.
- target_ref: NJS-0218-001
  use:
    paragraphs:
    - zh: 将备份、监控和合规身份按作业拆分，绑定特定管理节点、设备/对象范围、有效期和结果位置；服务身份本身不进入全局白名单，职责外目标需要新审批并触发高保真审计。
      en: Separate backup, monitoring, and compliance identities by job and bind each to a manager node, device and object
        scope, validity period, and result location. Never globally allowlist a service identity; out-of-duty targets require
        fresh approval and high-fidelity audit.
  expected_effect:
    paragraphs:
    - zh: 压缩攻击者借用正常身份与来源读取额外配置的空间，并把外观相同的合法与恶意任务转化为可比较的 job scope 差异。
      en: Constrain the adversary's ability to use an ordinary identity and source for extra configuration reads and turn
        visually similar legitimate and malicious work into a comparable job-scope difference.
  limitations:
    paragraphs:
    - zh: 某些 NMS 只能使用共享长期凭据，设备可能不支持细粒度 read view；攻击者控制真正批准的作业或审批系统时仍能保持语境一致，需要内容去向和独立操作员证据。
      en: Some NMS products require shared long-lived credentials and devices may lack fine-grained read views. An adversary
        controlling a genuinely approved job or approval system can preserve context and requires output-destination and independent-operator
        evidence.
- target_ref: NJS-0218-002
  use:
    paragraphs:
    - zh: 对配置归档与版本库分离生产者和消费者权限，禁止备份服务账户交互式读取全部历史，启用文件/对象 data event、仓库 clone 审计和 commit tree 展开，并把配置副本纳入凭据与敏感拓扑数据保护。
      en: Separate producer and consumer authority for configuration archives and version repositories. Prevent backup-service
        accounts from interactively reading all history, enable file or object data events and repository-clone audit with
        commit-tree expansion, and protect configuration copies as credential-bearing and topology-sensitive data.
  expected_effect:
    paragraphs:
    - zh: 降低不访问实时设备即可取得配置的机会，并让当前副本读取在版本/对象面形成可归因记录。
      en: Reduce opportunities to acquire configuration without touching live devices and make current replica reads attributable
        on the version or object plane.
  limitations:
    paragraphs:
    - zh: 文件读取审计可能带来性能和隐私成本，Git/CVS 常只提供仓库级事件；离线复制、管理员控制存储主机或在备份生成前已植入的攻击者仍会造成盲区。
      en: File-read audit can impose performance and privacy cost, and Git or CVS often supplies repository-level events only.
        Offline copy, administrator control of the storage host, or an adversary present before backup generation still creates
        blind spots.
