schema_version: 2.0.0
type: mitigation
id: MIT-000225
name:
  zh: 可移动介质读取授权与对象谱系治理
  en: Removable-Media Read Authorization and Object-Lineage Governance
summary:
  zh: 以文件级最小读取授权和接入对象谱系约束可移动介质内容获取。
  en: Constrain removable-media content acquisition through file-level least read authority and attachment-object lineage.
description:
  paragraphs:
  - zh: 按介质组、用户/服务、主机角色、签名进程、文件级操作和业务路径控制读取，并为每次接入保存稳定介质身份、批准作业和对象结果；正常导入、备份、取证和恢复使用有期限的细粒度例外。
    en: Control reads by media group, user or service, host role, signed process, file-level operation, and business path,
      retaining stable media identity, approved work, and object outcomes for every attachment, with time-bounded granular
      exceptions for import, backup, forensics, and recovery.
domains:
- enterprise
measures:
- key: file-read-least-authority
  name:
    zh: 文件级读取最小授权
    en: File-Level Read Least Authority
  description:
    paragraphs:
    - zh: 默认拒绝不需要介质读取的主机和非批准进程；以设备组、SID、签名发布者、File Read、路径/文件类型、网络位置、工单和到期时间共同授权。未知介质先隔离扫描，敏感主机优先用只读、方向固定或专用介质。
      en: Deny reads by default on hosts and processes without business need; authorize through device group, SID, signed
        publisher, File Read, path or file type, network location, ticket, and expiry. Quarantine-scan unknown media and prefer
        read-only, direction-fixed, or dedicated media on sensitive hosts.
  control_type: exposure-reduction
- key: attachment-object-lineage
  name:
    zh: 接入会话与对象读取谱系
    en: Attachment-Session and Object-Read Lineage
  description:
    paragraphs:
    - zh: 为每次接入记录 media_id、组织资产、保管人、来源、目的主机、mount/unmount、批准清单、读取主体/进程、对象路径和结果去向；对会返回的介质保留历史到业务轮转结束，并验证事件上限和隔离端补偿采集。
      en: Record media_id, asset, custodian, source, destination host, mount and unmount, approved manifest, reader, object
        path, and result destination for every attachment; retain returning-media history through the business cycle and validate
        event caps and isolated-endpoint compensating collection.
  control_type: detective-support
- key: managed-import-separation
  name:
    zh: 受管导入与输出分离
    en: Managed Import and Output Separation
  description:
    paragraphs:
    - zh: 只允许受管导入器把内容写入检疫区，验证恶意代码、文件类型、敏感标签和批准清单后再发布；阻止导入器及非批准读取者把内容直送隐藏目录、个人归档或外部网络。
      en: Permit managed importers to write into quarantine, validating malware, file type, sensitivity, and manifest before
        release; prevent importers and unapproved readers from sending content directly to hidden directories, personal archives,
        or external networks.
  control_type: preventive
applications:
- target_ref: NJT-0219
  use:
    paragraphs:
    - zh: 按主机角色配置文件级读取规则并启用 AuditAllowed/AuditDenied 与可移动存储对象访问审计；将批准导入、备份、杀毒、取证和恢复绑定到签名进程、介质组、用户、路径、工单和输出库。未知进程读取敏感介质时阻断或检疫，并保存进程—对象—结果谱系。
      en: Configure file-level read rules by host role and enable AuditAllowed, AuditDenied, and removable-storage object
        auditing. Bind approved import, backup, antimalware, forensics, and restore to signed process, media group, user,
        path, ticket, and output repository. Block or quarantine sensitive-media reads by unknown processes and preserve process-object-outcome
        lineage.
  expected_effect:
    paragraphs:
    - zh: 正常接入或认可设备不再自动授予无限读取权；允许读取可归因，未批准读取在暂存或外传前被阻断。
      en: Normal attachment or approved device no longer grants unlimited read authority; allowed reads are attributable and
        unapproved reads are blocked before staging or exfiltration.
  limitations:
    paragraphs:
    - zh: 获批进程被注入、用户先复制到内部存储、MTP 字段缺失和隔离端无代理仍可削弱控制；严格默认拒绝影响恢复、取证和旧设备，需先审计试运行。
      en: Injection into approved processes, user copying to internal storage, missing MTP fields, and agentless isolated
        endpoints weaken control; strict default denial affects restore, forensics, and legacy devices and needs audit-mode
        rollout.
