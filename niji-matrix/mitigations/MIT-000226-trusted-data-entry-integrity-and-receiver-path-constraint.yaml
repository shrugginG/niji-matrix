schema_version: 2.0.0
type: mitigation
id: MIT-000226
name:
  zh: 受信数据入口完整性与接收路径约束
  en: Trusted Data-Entry Integrity and Receiver-Path Constraint
summary:
  zh: 保护受信数据入口制品与接收路径，并以隐私安全方式核对实际输入流向。
  en: Protect trusted data-entry artifacts and receiver paths while verifying actual input flow with privacy-safe evidence.
description:
  paragraphs:
  - zh: 将数据入口发布制品、浏览器实际执行脚本、字段模式、表单与连接目标、服务端接收路由和第二输出作为一条受控数据流，减少未批准组件读取输入的机会，并在不记录真实字段值的前提下保留可核查谱系。
    en: Govern data-entry release artifacts, scripts actually executed by the browser, field schemas, form and connection
      destinations, server receiver routes, and second outputs as one controlled data flow, reducing opportunities for unapproved
      components to read input while preserving verifiable lineage without recording actual field values.
domains:
- enterprise
measures:
- key: externally-anchor-entry-artifacts
  name:
    zh: 外部锚定数据入口制品与字段模式
    en: Externally Anchor Data-Entry Artifacts and Field Schemas
  description:
    paragraphs:
    - zh: 从受保护 CI/CD 保存签名制品、脚本清单、模板/控制器哈希、form_id、字段模式摘要和批准接收路径，并从独立边缘或真实浏览器校验实际接收内容；生产服务器自身报告不能作为唯一黄金基线。
      en: Retain signed artifacts, script inventory, template or controller hashes, form IDs, field-schema digests, and approved
        receiver paths in protected CI or CD and validate what an independent edge or real browser receives. A production
        server's self-report cannot be the only golden baseline.
  control_type: preventive
- key: restrict-script-form-and-connect-targets
  name:
    zh: 约束脚本完整性、表单目标和浏览器连接目的
    en: Constrain Script Integrity Form Targets and Browser Connection Destinations
  description:
    paragraphs:
    - zh: 对可固定的外部资源使用 SRI/Integrity-Policy，对脚本来源、connect-src 与 form-action 建最小 CSP，并接收 report-only/violation 报告；内联和同源动态代码仍须结合
        nonce/hash、制品完整性和服务端控制，不能把 CSP 当作单一防线。
      en: Use SRI or Integrity-Policy for stable external resources, apply a minimal CSP to script sources, connect-src, and
        form-action, and collect report-only or violation reports. Inline and dynamic same-origin code still require nonces
        or hashes, artifact integrity, and server controls; CSP is not a sole defense.
  control_type: preventive
- key: authorize-monitor-payment-page-scripts
  name:
    zh: 授权盘点并监测敏感数据入口脚本
    en: Authorize Inventory and Monitor Sensitive Data-Entry Scripts
  description:
    paragraphs:
    - zh: 对支付、个人资料和高价值业务入口的每项脚本记录所有者、业务理由、字段分类、供应商、版本和到期时间，确保完整性并监测消费者浏览器实际接收的页面、脚本与安全相关响应头是否被未授权修改。
      en: For payment, profile, and high-value business entry surfaces, record owner, business justification, field classification,
        supplier, version, and expiry for every script, ensure integrity, and monitor the page, scripts, and security-relevant
        response headers as received by the consumer browser for unauthorized change.
  control_type: detective-support
- key: minimize-and-isolate-sensitive-entry
  name:
    zh: 最小化敏感字段并隔离高价值输入接收者
    en: Minimize Sensitive Fields and Isolate High-Value Input Receivers
  description:
    paragraphs:
    - zh: 只收集业务必需字段，并在可行时将支付或其他高价值输入置于独立治理的托管字段或隔离 origin；限制表单 action、服务端 route、应用身份和出站目的，验证请求模式但不在检测系统复制字段值。
      en: Collect only fields required for the business purpose and, where feasible, place payment or other high-value input
        in independently governed hosted fields or an isolated origin. Restrict form actions, server routes, application identities,
        and egress destinations and validate request schemas without copying field values into the detection system.
  control_type: exposure-reduction
applications:
- target_ref: NJT-0220
  use:
    paragraphs:
    - zh: 对所有会接收非认证敏感输入的端点与应用维护观察者、制品、字段模式和接收方清单，减少全局输入权限，保护数据入口发布链，并用脱敏测试验证从输入到批准接收者的谱系。
      en: Maintain inventories of observers, artifacts, field schemas, and receivers for endpoints and applications that accept
        non-authentication sensitive input, minimize global input authority, protect the data-entry release chain, and validate
        input-to-approved-receiver lineage with redacted tests.
  expected_effect:
    paragraphs:
    - zh: 缩小能读取交互输入的组件集合，使消费者外观察与受信来源介入分别在权限或制品面留下可比较前态，并减少不必要的敏感数据暴露。
      en: Reduce the set of components able to read interactive input, give consumer-external observation and trusted-origin
        interposition comparable pre-state on authority or artifacts, and reduce unnecessary sensitive-data exposure.
  limitations:
    paragraphs:
    - zh: 已控制内核、浏览器、应用服务器、构建系统和日志接收端的攻击者可能同时绕过多层控制；严格限制会影响无障碍、分析、支付和支持流程，且旧应用可能不能使用 CSP、SRI 或独立托管字段。
      en: An adversary controlling the kernel, browser, application server, build system, and log receiver can bypass several
        layers at once. Strict controls can affect accessibility, analytics, payment, and support workflows, and legacy applications
        may not support CSP, SRI, or independently hosted fields.
- target_ref: NJS-0220-002
  use:
    paragraphs:
    - zh: 对结账、客户资料和高价值业务表单外部保存批准制品与字段图，限制脚本、form action、connect 和同源接收路由，监测消费者实际页面与服务器第二输出，并把每项例外绑定数据合同、release 与有效期。
      en: For checkout, customer-profile, and high-value business forms, externally retain approved artifacts and field graphs;
        restrict scripts, form actions, connections, and same-origin receiver routes; monitor the actual consumer page and
        second server outputs; and bind each exception to a data contract, release, and expiry.
  expected_effect:
    paragraphs:
    - zh: 减少攻击者把恶意接收者藏入受信来源的路径，并使新增字段、脚本漂移、同源隐藏路由和未批准第二输出更早形成高质量差异。
      en: Reduce paths for hiding a malicious receiver in a trusted origin and make added fields, script drift, hidden same-origin
        routes, and unapproved second outputs produce earlier high-quality differences.
  limitations:
    paragraphs:
    - zh: 服务器自身失陷可返回带有效域名与 TLS 的恶意内容，同源请求可能通过严格 CSP；第三方脚本更新、A/B 测试和动态个性化会增加基线成本，必须以外部锚点和多会话探针补足。
      en: A compromised server can return malicious content under a valid domain and TLS, and same-origin requests can pass
        a strict CSP. Third-party updates, A/B tests, and dynamic personalization increase baseline cost and require external
        anchors and probes across multiple sessions.
