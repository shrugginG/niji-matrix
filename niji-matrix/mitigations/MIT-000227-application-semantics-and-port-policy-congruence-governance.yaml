schema_version: 2.0.0
type: mitigation
id: MIT-000227
name:
  zh: 应用语义与端口策略一致性治理
  en: Application Semantics and Port Policy Congruence Governance
summary: &id001
  zh: 用 application-aware policy、port-independent parsing 与正式 custom-service registry 取代粗粒度 port allowlist，并保留 mismatch 与
    C2 结果关联证据。
  en: Replace coarse port allowlists with application-aware policy, port-independent parsing, and a formal custom-service
    registry while retaining evidence that joins mismatch to C2 outcome.
description:
  paragraphs:
  - *id001
domains:
- enterprise
measures:
- key: application-aware-allow-policy
  name:
    zh: 应用感知放行策略
    en: Application-Aware Allow Policy
  description:
    paragraphs:
    - zh: 出站/入站 policy 按 source role、destination owner、actual App-ID/application 和 service default 定义，优先 application-default；未知或不匹配应用默认拒绝/重置。合法非默认服务只给
        exact source/destination/application/port 的限时 exception。
      en: Define ingress and egress policy by source role, destination owner, actual App-ID or application, and service default,
        preferring application-default. Deny or reset unknown and mismatched applications by default. Give legitimate nondefault
        services time-bounded exceptions for exact source, destination, application, and port.
  control_type: preventive
- key: port-independent-protocol-detection
  name:
    zh: 端口无关协议检测
    en: Port-Independent Protocol Detection
  description:
    paragraphs:
    - zh: 在关键边界启用 Zeek DPD、Suricata app-layer detection 或等价 DPI，记录 service/app_proto confirmation、violation、failed、directional
        mismatch、expected/orig fields，并与 flow/session ID 保持一致；对 parser coverage 运行 canary。
      en: Enable Zeek DPD, Suricata app-layer detection, or equivalent DPI at critical boundaries, recording service or app_proto
        confirmation, violation, failed, directional mismatch, and expected or original fields with stable flow or session
        IDs. Run canaries to test parser coverage.
  control_type: detective-support
- key: custom-service-registration
  name:
    zh: 自定义服务登记
    en: Custom Service Registration
  description:
    paragraphs:
    - zh: 为 internal/vendor custom services 登记 owner、source/destination roles、protocol semantics、port、parser/signature、authentication、purpose、release/version
        与 expiry；变更触发 policy/parser 更新，不使用永久“任意 TCP”例外。
      en: Register owner, source and destination roles, protocol semantics, port, parser or signature, authentication, purpose,
        release or version, and expiry for internal and vendor custom services. Changes trigger policy and parser updates
        and never receive a permanent any-TCP exception.
  control_type: governance
- key: endpoint-process-and-c2-outcome-correlation
  name:
    zh: 端点进程与 C2 结果关联
    en: Endpoint Process and C2 Outcome Correlation
  description:
    paragraphs:
    - zh: 将 mismatch flow 连接 endpoint process、listener、child/file/command/result 和 threat response；无法解析 payload 时仍按 process
        role、destination、bidirectionality 与 repeated timing 保留 candidate，不用 port 单独处置。
      en: Join mismatched flows to endpoint process, listener, child, file, command, result, and threat response. Where payload
        cannot be parsed, retain candidates by process role, destination, bidirectionality, and recurrence without enforcing
        on port alone.
  control_type: detective-support
applications:
- target_ref: NJT-0221
  use:
    paragraphs:
    - zh: 对所有允许 port 运行 content-aware application identification，将 actual application 与 local expected registry 比较；mismatch
        阻断或隔离，合法 custom service 用最小范围例外并持续复核。
      en: Run content-aware application identification on every allowed port and compare actual application with the local
        expected registry. Block or isolate mismatches, while legitimate custom services receive minimum-scope exceptions
        and continual review.
  expected_effect:
    paragraphs:
    - zh: 攻击者不能仅选择 443/53/允许高位 port 继承 Web/DNS/管理服务信任，parser/log 也能保留 actual/expected 差供检测。
      en: The actor cannot inherit Web, DNS, or management-service trust merely by selecting 443, 53, or an allowed high port,
        and parser and logs retain actual-versus-expected difference for detection.
  limitations:
    paragraphs:
    - zh: 加密/未知协议、性能、legacy/custom apps、误解析和 TLS inspection 限制会迫使 exception；严格 enforcement 可能中断业务，需 staged rollout 和 owner
        validation。
      en: Encryption or unknown protocols, performance, legacy or custom applications, misparsing, and TLS-inspection limits
        force exceptions. Strict enforcement can disrupt business and needs staged rollout with owner validation.
