schema_version: 2.0.0
type: mitigation
id: MIT-000229
name:
  zh: 端点明文边界与嵌套密码治理
  en: Endpoint Plaintext-Boundary and Nested-Cryptography Governance
summary: &id001
  zh: 对批准应用层加密建立 process/service/key owner 清单，在高风险端点于加密前/解密后采集最小化结果，并以应用控制和进程出口限制未批准 crypto C2。
  en: Inventory process, service, and key owners for approved application-layer encryption, collect minimized outcomes before
    encryption or after decryption on high-risk endpoints, and constrain unapproved cryptographic C2 with application control
    and process egress.
description:
  paragraphs:
  - *id001
domains:
- enterprise
measures:
- key: approved-crypto-inventory
  name:
    zh: 批准密码应用目录
    en: Approved Cryptographic Application Inventory
  description:
    paragraphs:
    - zh: 登记需要 nested/E2EE 的软件、模块、目的地、key owner、数据类别和诊断方式，未知进程不能仅凭 TLS 放行。
      en: Register software, module, destination, key owner, data class, and diagnostic method requiring nested or E2EE protection;
        unknown processes do not receive trust merely from TLS.
  control_type: governance
- key: minimized-endpoint-plaintext-telemetry
  name:
    zh: 最小化端点明文边界遥测
    en: Minimized Endpoint Plaintext-Boundary Telemetry
  description:
    paragraphs:
    - zh: 在授权场景记录 pre-encrypt/post-decrypt buffer digest/length、command class 与 outcome，不常态保存业务明文或 key。
      en: In authorized cases record pre-encryption or post-decryption buffer digest and length, command class, and outcome
        without routinely retaining business plaintext or keys.
  control_type: detective-support
- key: application-control-and-process-egress
  name:
    zh: 应用控制与进程出口约束
    en: Application Control and Process Egress Constraint
  description:
    paragraphs:
    - zh: 阻止未知二进制/脚本加载 crypto 模块并限制高价值设备上未批准 process 到外部 endpoint 的连接。
      en: Prevent unknown binaries or scripts from loading cryptographic modules and restrict unapproved processes from external
        endpoints on high-value devices.
  control_type: preventive
applications:
- target_ref: NJS-0223-003
  use:
    paragraphs:
    - zh: 将 TLS decrypt success 与 inner decrypt status 分开；未知 nested envelope 必须由批准 app inventory 或 endpoint outcome 解释，否则阻断/隔离。
      en: Separate TLS decrypt success from inner-decrypt status; require approved application inventory or endpoint outcome
        to explain an unknown nested envelope or block and isolate it.
  expected_effect:
    paragraphs:
    - zh: 消除“TLS 已解密即内容可见”的假设盲区，并在端点恢复 inner command 证据。
      en: Remove the assumption that TLS decryption makes content visible and recover inner-command evidence at the endpoint.
  limitations:
    paragraphs:
    - zh: 合法 E2EE/隐私数据限制采集，App Control 兼容性和被盗批准进程会降低效果；RFC keylog 不适合作为生产默认。
      en: Legitimate E2EE and privacy constrain collection, App Control compatibility and compromised approved processes reduce
        effect, and RFC key logging is unsuitable as a production default.
evidence_refs:
- REF-001148
- REF-001150
- REF-000772
