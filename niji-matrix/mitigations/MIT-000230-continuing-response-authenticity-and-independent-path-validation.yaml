schema_version: 2.0.0
type: mitigation
id: MIT-000230
name:
  zh: 持续响应真实性与独立路径验证
  en: Continuing Response Authenticity and Independent-Path Validation
summary: &id001
  zh: 让已受控端只接受可验证来源、会话状态和新鲜度的任务/载荷，并通过不受同一路径控制的出口或源站证据验证关键响应。
  en: Make compromised endpoints accept tasking or payloads only with verifiable origin, session state, and freshness and
    validate critical responses through an egress or origin evidence outside the same controlled path.
description:
  paragraphs:
  - *id001
domains:
- enterprise
measures:
- key: authenticated-task-and-result-objects
  name:
    zh: 认证任务与结果对象
    en: Authenticated Task and Result Objects
  description:
    paragraphs:
    - zh: 对管理、更新、代理和离线任务通道使用端到端 TLS/mTLS 或应用层签名，并把任务号、nonce、目标身份、到期与结果引用纳入签名验证；验证失败时不执行内容并保留证据。
      en: Use end-to-end TLS or mTLS and application-layer signatures for management, update, agent, and task channels, signing
        task number, nonce, target identity, expiry, and result reference. Do not execute content after validation failure
        and preserve evidence.
  control_type: preventive
- key: independent-path-and-origin-validation
  name:
    zh: 独立路径与源站验证
    en: Independent Path and Origin Validation
  description:
    paragraphs:
    - zh: 关键外联经受信 VPN/代理/resolver 离开本地高风险路径，或使用不同运营商/云探针与真实源站比较解析、证书、响应摘要和 receipt；禁止从互联网或未认证路径使用明文 SMB/HTTP 管理任务。
      en: Route critical egress through a trusted VPN, proxy, or resolver outside the local high-risk path, or compare resolution,
        certificate, response digest, and receipt through another carrier or cloud probe and the true origin. Prohibit plaintext
        SMB or HTTP management tasking from Internet or unauthenticated paths.
  control_type: exposure-reduction
- key: response-integrity-and-cycle-audit
  name:
    zh: 响应完整性与控制周期审计
    en: Response Integrity and Control-Cycle Audit
  description:
    paragraphs:
    - zh: 为每个任务/响应保留 request fingerprint、源站 receipt、目标响应摘要、验证结果、端点消费和结果对象，使用 canary/独立视点定期检测选择性注入，并覆盖最长合法轮询周期。
      en: Retain request fingerprint, origin receipt, target response digest, validation result, endpoint consumption, and
        result object for every task or response. Use canary or independent vantages to test selective injection and retain
        through the longest legitimate polling cycle.
  control_type: detective-support
applications:
- target_ref: NJT-0052
  use:
    paragraphs:
    - zh: 对已受控端的任务、插件和控制数据要求端到端来源验证与新鲜度，禁止把目的域/IP 或熟悉协议当作内容授权；关键路径同时保留独立视点和源站 receipt。首次入口仍并列使用 MIT-000050 的浏览器/TLS/SRI 控制。
      en: Require end-to-end origin and freshness validation for tasking, plug-ins, and control data on compromised endpoints
        and never treat destination domain or IP or a familiar protocol as content authorization. Retain independent-vantage
        and origin receipt for critical paths. Continue using MIT-000050 browser, TLS, and SRI controls for first entry.
  expected_effect:
    paragraphs:
    - zh: 路径设备即使能生成语法正确响应，也需伪造端到端任务身份或控制独立验证路径，注入内容在执行前可被拒绝并可审计。
      en: A path device generating syntactically valid responses must also forge end-to-end task identity or control the independent
        validation path; injected content can be rejected and audited before execution.
  limitations:
    paragraphs:
    - zh: 旧植入和通用协议可能没有签名机制，密钥或更新基础设施被控会失效；VPN、独立运营商和正文留存增加成本、隐私和可用性风险。
      en: Legacy implants and generic protocols may lack signatures, and compromise of keys or update infrastructure defeats
        validation. VPNs, independent carriers, and content retention add cost, privacy, and availability risk.
- target_ref: NJS-0052-001
  use:
    paragraphs:
    - zh: 用不同来源/路由的 canary 与目标群定期发起相同请求，比较响应摘要和源站 receipt；任务签名绑定 target ID 和 nonce，避免攻击者仅对命中目标生成可执行响应。
      en: Issue the same requests from canaries and target populations using different origins or routes, comparing response
        digests and origin receipts. Bind task signatures to target ID and nonce so the adversary cannot generate executable
        responses only for matched targets.
  expected_effect:
    paragraphs:
    - zh: 选择性门控不再让所有非目标视点保持无证据，目标专属内容与签名/发布清单不符时暴露。
      en: Selective gating no longer leaves every non-target vantage without evidence, and target-only content becomes visible
        when it conflicts with signatures or release manifests.
  limitations:
    paragraphs:
    - zh: 极短门控、对 canary 识别、合法个性化和区域 CDN 可能绕过或混淆比较；需要真实用户隐私保护和路由多样性。
      en: Very short gates, canary identification, legitimate personalization, and regional CDNs can evade or confuse comparison;
        real-user privacy protection and route diversity are required.
- target_ref: NJS-0052-002
  use:
    paragraphs:
    - zh: 强制使用正确验证的 TLS/QUIC 或消息签名，使先到但未认证的响应不可消费；在可见明文路径保存重复 seq/ack 异载荷和到达顺序，并在边界阻断无签名任务。
      en: Enforce correctly validated TLS or QUIC or message signatures so an earlier unauthenticated response cannot be consumed.
        On visible plaintext paths preserve different-payload duplicate sequence and acknowledgment state plus arrival order
        and block unsigned tasking at the boundary.
  expected_effect:
    paragraphs:
    - zh: 竞速优势不再等同内容接受，伪造响应必须同时突破会话真实性。
      en: Winning a race no longer means content acceptance because the forged response must also defeat session authenticity.
  limitations:
    paragraphs:
    - zh: 攻击者控制信任根、TLS 终止代理或端点时仍可签发/修改内容；UDP/旧协议可能没有内置真实性，公开 C2 竞速案例证据仍不足。
      en: An adversary controlling a trust root, TLS termination proxy, or endpoint can still issue or alter content. UDP
        and legacy protocols may lack native authenticity, and public C2 racing-case evidence remains insufficient.
- target_ref: NJS-0052-003
  use:
    paragraphs:
    - zh: 关键解析使用受管 resolver 与受信 VPN，服务端必须通过证书、应用签名或固定身份验证；把解析答案、路由、真正源站 receipt 与 SMB/HTTP 内容摘要绑定，禁止从开放互联网使用未认证 SMB 任务路径。
      en: Use managed resolvers and a trusted VPN for critical resolution and require service certificates, application signatures,
        or pinned identities. Bind resolution answer, route, true-origin receipt, and SMB or HTTP content digest and prohibit
        unauthenticated SMB task paths from the open Internet.
  expected_effect:
    paragraphs:
    - zh: 仅在目标路径存在的幻影服务无法凭可达性与熟悉协议获得信任，解析和内容必须通过独立身份验证。
      en: A phantom service existing only on the target path cannot gain trust through reachability and familiar protocol
        alone; resolution and content must pass independent identity validation.
  limitations:
    paragraphs:
    - zh: split DNS、私有服务、灾备和代理本来可能只在局部路径存在，需要按 owner 与变更清单建立基线；VPN 端或 resolver 被控仍会失败。
      en: Split DNS, private services, disaster recovery, and proxies can legitimately exist only on a local path and need
        owner and change baselines. Compromise of the VPN endpoint or resolver still defeats the control.
