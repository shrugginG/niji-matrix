schema_version: 2.0.0
type: mitigation
id: MIT-000231
name:
  zh: C2 暴露策略审计与基础设施处置
  en: C2 Exposure-Policy Audit and Infrastructure Enforcement
summary: &id001
  zh: hosting/CDN/WAF/provider 与企业 IR 联合保留请求—规则—origin 谱系，审计针对 scanner/security classes 或 implant-only predicates 的选择性规则，从授权多视点复现差分；对证据确认的恶意
    tenant/front/origin 暂停服务、隔离 origin、撤销 credential 并阻断受害端 egress，同时保存规则版本和请求证据。
  en: Hosting, CDN, WAF, and other providers cooperate with enterprise incident response to retain request-to-rule-to-origin
    lineage, audit selective rules targeting scanner or security classes or implant-only predicates, and reproduce differences
    from authorized multiple vantages. For evidence-confirmed malicious tenants, fronts, or origins, suspend service, isolate
    the origin, revoke credentials, and block victim egress while preserving rule versions and request evidence.
description:
  paragraphs:
  - *id001
domains:
- enterprise
measures:
- key: request-rule-origin-lineage
  name:
    zh: 请求、规则与 origin 谱系留存
    en: Request Rule and Origin Lineage Retention
  description:
    paragraphs:
    - zh: 在 edge/WAF/reverse proxy 记录不可重复 request ID、client class/IP/ASN/country、经脱敏的 path/header/cookie-name 或 feature hash、matched
        rule/version/action、edge response、origin target/status 和 tenant/account；policy audit 保留 condition expression、actor、before/after、validity
        与 change request。日志独立写入受限 SIEM/object lock，retention 覆盖调查窗口。
      en: At the edge, WAF, and reverse proxy, record a unique request ID, client class, IP, ASN and country, redacted path,
        header and cookie-name or feature hashes, matched rule, version and action, edge response, origin target and status,
        and tenant or account. Policy audit retains condition expression, actor, before and after values, validity, and change
        request. Write logs independently to a restricted SIEM or object-locked store and retain them across the investigation
        window.
  control_type: detective-support
- key: authorized-exposure-differential-validation
  name:
    zh: 授权暴露差复现
    en: Authorized Exposure Differential Validation
  description:
    paragraphs:
    - zh: 从 neutral、defender-class 与 victim-aligned 的批准视点，以固定 endpoint/protocol/time 的 safe probes 一次改变 request profile 或
        source class；比较 status/hash/redirect/reset、edge action 和 origin reach。使用 provider-side replay、合成/过期 token 和速率限制，不把
        active victim secret 发送出受控边界。
      en: From approved neutral, defender-class, and victim-aligned vantages, hold endpoint, protocol, and time stable and
        change one request profile or source class at a time with safe probes. Compare status, hash, redirect, reset, edge
        action, and origin reach. Use provider-side replay, synthetic or expired tokens, and rate limits and do not send active
        victim secrets outside controlled boundaries.
  control_type: detective-support
- key: malicious-selective-rule-review
  name:
    zh: 恶意选择规则审查
    en: Malicious Selective Rule Review
  description:
    paragraphs:
    - zh: provider 对新建/变更的 rules 评估是否仅针对 security/research ASNs、known scanner classes、secret implant paths/headers 或短时 listener
        activation，并与 tenant abuse、malware/C2 reports、origin reputation 和 victim success 关联。合法 anti-bot/DDoS/geo/mTLS rule
        绑定 owner/purpose/change ticket/expiry；无 owner 或与 C2 相连的 rule 进入人工 abuse review。
      en: Providers evaluate new or changed rules for targeting only security or research ASNs, known scanner classes, secret
        implant paths or headers, or short-lived listener activation and correlate them with tenant abuse, malware or C2 reports,
        origin reputation, and victim success. Legitimate anti-bot, DDoS, geographic, and mTLS rules bind owner, purpose,
        change ticket, and expiry. Ownerless rules or rules linked to C2 enter human abuse review.
  control_type: governance
- key: tenant-front-origin-containment
  name:
    zh: tenant、front 与 origin 联合处置
    en: Tenant Front and Origin Coordinated Containment
  description:
    paragraphs:
    - zh: 在 combined evidence 达阈值后，provider 保存 snapshot/log/rule history，暂停恶意 tenant/worker/edge route，移除 origin access、rotate
        provider credentials 并通知 registrar/hosting；受害组织按 destination+process+campaign 阻断 egress、隔离 endpoint 并继续收集 task/result。处置使用短时
        reversible quarantine 到人工确认，避免仅凭 404/差分误封共享服务。
      en: After combined evidence reaches threshold, the provider preserves snapshots, logs, and rule history, suspends the
        malicious tenant, worker, or edge route, removes origin access, rotates provider credentials, and coordinates with
        registrar or hosting. The victim organization blocks egress by destination, process, and campaign, isolates the endpoint,
        and continues task or result collection. Use short, reversible quarantine pending human confirmation to avoid blocking
        a shared service from a 404 or differential alone.
  control_type: containment
applications:
- target_ref: NJT-0224
  use:
    paragraphs:
    - zh: 对 candidate C2 先建立 victim-success，再从 edge/request/rule/origin 和 longitudinal listener 证明选择性暴露；provider 与受害 IR 共同处置
        tenant/front/origin 和 endpoint。
      en: Establish victim success for candidate C2 first, then prove selective exposure from edge, request, rule, origin,
        and longitudinal listener evidence. Provider and victim IR jointly contain the tenant, front, origin, and endpoint.
  expected_effect:
    paragraphs:
    - zh: request/vantage differential 不再停留在外部推测，攻击者须放弃 provider/front、频繁改 rule/origin 或承担 victim C2 中断与 rule audit 暴露。
      en: Request and vantage differences no longer remain external inference. The actor must abandon the provider or front,
        repeatedly change rules or origins, or accept victim C2 interruption and exposure in rule audit.
  limitations:
    paragraphs:
    - zh: victim 组织通常无 provider/origin 权限，跨组织共享和法律流程会延迟；one-time token、加密、短窗口和共享 CDN 增加误报/盲区，必须使用组合证据和渐进处置。
      en: Victim organizations usually lack provider and origin access, and cross-organization sharing and legal process can
        delay action. One-time tokens, encryption, short windows, and shared CDNs increase false positives and blind spots,
        requiring combined evidence and staged enforcement.
- target_ref: NJS-0224-001
  use:
    paragraphs:
    - zh: 在 provider-side replay 中恢复最小安全 request profile，审查 positive allow/route rule，撤销 tenant credential 并隔离 origin；victim
        侧同时阻断产生 qualified callback 的 process/destination。
      en: Recover the minimum safe request profile in provider-side replay, review positive allow and route rules, revoke
        tenant credentials, and isolate the origin while the victim blocks the process and destination generating qualified
        callbacks.
  expected_effect:
    paragraphs:
    - zh: 合格请求不能继续秘密到达 C2 origin，且规则、请求和 origin 的谱系可用于识别同 tenant/cluster 的替代 front。
      en: Qualified requests can no longer secretly reach the C2 origin, and rule, request, and origin lineage can identify
        replacement fronts in the same tenant or cluster.
  limitations:
    paragraphs:
    - zh: 无 sample/profile 或 provider log 时不能安全重放；泄漏 active token 可能触发 actor 轮换，必须先保存证据并使用合成/过期值。
      en: Safe replay may be impossible without a sample, profile, or provider logs. Leaking an active token may trigger actor
        rotation, so preserve evidence first and use synthetic or expired values.
- target_ref: NJS-0224-002
  use:
    paragraphs:
    - zh: 对 same-request cross-vantage 差连接 matched deny rule，审查针对 security/research sources 的 rule owner/purpose；确认恶意后暂停 tenant/listener
        并保留 blocklist/rule version。
      en: Join the same-request cross-vantage difference to a matched deny rule and review rule owner and purpose for security
        or research sources. After malicious confirmation, suspend the tenant or listener and preserve block-list and rule
        versions.
  expected_effect:
    paragraphs:
    - zh: 攻击者不能再靠识别固定 defender networks 让 C2 对研究者消失，distributed observation 和 provider audit 提高基础设施映射/处置率。
      en: The actor can no longer make C2 disappear to researchers merely by identifying fixed defender networks, and distributed
        observation plus provider audit improves mapping and containment.
  limitations:
    paragraphs:
    - zh: 普通 DDoS/anti-bot 也会屏蔽 data-center/scanner sources；没有 victim C2 与 rule linkage 时不得暂停 tenant。
      en: Ordinary DDoS and anti-bot controls also block data-center and scanner sources. Do not suspend a tenant without
        victim C2 and rule linkage.
