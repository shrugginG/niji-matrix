schema_version: 2.0.0
type: mitigation
id: MIT-000232
name:
  zh: 服务器扩展准入、来源验证与可信恢复
  en: Server-Extension Admission Provenance Validation and Trusted Recovery
summary:
  zh: 通过最小扩展面、分离的临时管理权限、来源绑定清单和可信重建，减少未批准服务器组件的持久接入与隐藏
  en: Reduce unauthorized persistent and hidden server components through minimized extension surfaces separated time-bound administration provenance-bound inventory and trusted rebuilding
description:
  paragraphs:
  - zh: 本缓解控制哪些服务器扩展面必须启用、谁能写入或注册组件、批准如何绑定精确内容和来源，以及发现后如何从可信状态恢复。它不把所有第三方 module、存储过程、Transport Agent 或 VIB 视为恶意，而要求每个组件由业务 owner、包事务、内容摘要、签名或发布来源、作用域和期限共同解释。
    en: This mitigation controls which server-extension surfaces remain enabled who can write or register components how approval binds exact content and provenance and how trusted state is restored after discovery. It does not treat every third-party module stored procedure Transport Agent or VIB as malicious and instead requires each component to be explained by business owner package transaction content digest signature or publisher scope and expiry.
  - zh: 控制同时保留取证与检测能力：安装、注册、加载、请求和结果应由不同授权边界记录；响应先保全 descriptor、package、signature、配置、writer 和匹配请求，再禁用组件、从可信包或映像重建并轮换其可能访问的凭据。只删除文件而不修复注册、管理身份和发布根不足以关闭入口。
    en: Controls preserve forensic and detection capability through differently authorized records for installation registration load request and outcome. Response preserves descriptor package signature configuration writer and matching requests before disabling the component rebuilding from trusted packages or images and rotating credentials it may have accessed. File deletion without repairing registration management identity and publisher roots does not close the entry.
domains: [enterprise]
measures:
- key: minimize-lock-extension-surfaces
  name: {zh: 最小化并锁定服务器扩展面, en: Minimize and Lock Server-Extension Surfaces}
  description:
    paragraphs:
    - zh: 禁用不需要的脚本、CLR、Transport Agent、IIS module、VIB 或插件安装能力，锁定 Web 与扩展目录、数据库启动过程、服务器配置层级和包后端，只保留业务必需作用域。
      en: Disable unnecessary scripting CLR Transport Agent IIS module VIB or plugin installation and lock web or extension directories database startup procedures server configuration hierarchy and package backends to business-required scope.
  control_type: exposure-reduction
- key: separated-jit-extension-authority
  name: {zh: 分离且临时的扩展管理权限, en: Separated Just-in-Time Extension Administration}
  description:
    paragraphs:
    - zh: 组件安装、签名策略或管理后端写入使用独立 JIT/PAM 角色、抗钓鱼 MFA、双人批准和受管终端；日常账户不得持续拥有跨服务器扩展写权，直接后端修改单独审计。
      en: Use separate JIT or PAM roles phishing-resistant MFA two-person approval and managed workstations for component installation signature policy or management-backend writes. Daily accounts do not retain fleet-wide extension authority and direct backend mutation is audited separately.
  control_type: preventive
- key: provenance-bound-component-inventory
  name: {zh: 来源绑定的组件清单与独立验证, en: Provenance-Bound Component Inventory and Independent Verification}
  description:
    paragraphs:
    - zh: 将批准绑定到 component ID、作用域、内容摘要、signature、publisher/vendor、version、包事务和 owner，并以独立验证核对声明 metadata；VIB 等包同时比较 descriptor acceptance 和 cryptographic signature result。
      en: Bind approval to component ID scope content digest signature publisher or vendor version package transaction and owner and compare declared metadata with independent verification. Packages such as VIBs compare descriptor acceptance with cryptographic signature results.
  control_type: detective-support
- key: preserve-disable-rebuild-rotate
  name: {zh: 保全、禁用、可信重建与凭据轮换, en: Preserve Disable Trusted Rebuild and Credential Rotation}
  description:
    paragraphs:
    - zh: 发现异常组件后先保全组件、配置、请求、运行与管理证据，再隔离或禁用；从已知良好包或映像恢复，验证旧组件和 selector 不再生效，并轮换服务器账户、应用秘密、证书和会话材料。
      en: Preserve component configuration request runtime and management evidence before isolation or disablement. Restore from known-good packages or images verify that the old component and selectors no longer operate and rotate server accounts application secrets certificates and session material.
  control_type: containment
applications:
- target_ref: NJT-0225
  use:
    paragraphs:
    - zh: 对服务器软件组件持久接入，把扩展面最小化、写权分离、版本化清单、独立签名/包验证和请求—结果审计作为一个控制包。每次安装或注册记录 writer、owner、精确内容、作用域、启动/请求绑定、批准和到期，并在服务/主机重启后验证实际加载状态。
      en: For Durable Server-Software Component Integration deploy extension-surface minimization separated write authority versioned inventory independent signature or package verification and request-to-outcome audit as one control package. Every installation or registration records writer owner exact content scope startup or request binding approval and expiry and verifies actual load after service or host reboot.
    - zh: 处置时不只删除文件：同时移除注册、禁用扩展能力、撤销失陷管理身份和发布密钥、从可信基线重建并监控首次后继请求。确认服务器不再加载旧版本、旧请求不能恢复访问且相关凭据已轮换后，才恢复业务。
      en: Response removes more than a file. It removes registration disables extension capability revokes compromised management identities and publisher keys rebuilds from trusted baselines and monitors the first successor request. Restore business only after the server no longer loads the old version old requests cannot restore access and related credentials are rotated.
  expected_effect:
    paragraphs:
    - zh: 普通代码执行或日常管理员更难把状态接入服务器长期加载路径，未经批准组件会在安装、独立验证、加载或结果任一阶段留下可行动差分。可信恢复同时降低单纯删除后由注册或管理根再次部署的风险。
      en: Ordinary code execution or daily administration is less able to integrate state into long-lived server load paths and unauthorized components produce actionable differentials at installation independent verification load or outcome. Trusted restoration also reduces redeployment through surviving registration or management roots after simple deletion.
  limitations:
    paragraphs:
    - zh: 服务器产品扩展模型和维护窗口差异大，严格锁定会影响更新、邮件过滤、数据库作业与虚拟化驱动。若软件供应链、管理平面和审计根同时失陷，组件仍可满足批准；必须保留独立结果监控和业务连续性计划。
      en: Server products differ widely in extension models and maintenance windows and strict locking can disrupt updates mail filtering database jobs and virtualization drivers. A component may still satisfy approval when software supply chain management plane and audit root are compromised together so independent outcome monitoring and continuity planning remain necessary.
- target_ref: NJS-0225-001
  use:
    paragraphs:
    - zh: 对请求资格化的选择性组件激活，保留服务器侧 request/message/transaction ID 和原始选择字段，把它们连接到精确组件版本、处理分支、响应与后继结果；加密服务从反向代理、邮件网关或数据库审计提供独立视角。合法管理 selector 必须绑定 owner、来源、字段结构、组件与期限。
      en: For Request-Qualified Selective Component Activation retain server-side request message or transaction IDs and original selector fields and join them to exact component version processing branch response and successor outcome. Encrypted services use reverse-proxy mail-gateway or database-audit independent vantages. Legitimate administrative selectors bind owner source field structure component and expiry.
  expected_effect:
    paragraphs:
    - zh: 攻击者不能只靠大多数正常请求掩盖少量控制事务；匹配与非匹配对照、持久组件状态和风险结果形成闭合链，稀少 selector 即使被日志改写也更可能由外部视角恢复。
      en: The adversary cannot rely only on mostly normal traffic to hide a small control set. Matching and nonmatching controls durable component state and risky outcomes form a closed chain and external vantages can recover rare selectors even when local logs are rewritten.
  limitations:
    paragraphs:
    - zh: TLS、邮件内容保护、高熵命令、无 request ID 与进程内执行会限制关联；健康检查、管理员 API、监控和反垃圾规则也使用低频字段。控制必须以结果和组件版本提升严重度，不能阻止全部稀有请求。
      en: TLS protected mail content high-entropy commands missing request IDs and in-process execution limit correlation while health checks administrative APIs monitoring and antispam rules use rare fields. Controls escalate through outcomes and component version rather than blocking every rare request.
- target_ref: NJS-0225-002
  use:
    paragraphs:
    - zh: 对服务器组件信任身份仿冒，不按名称、目录、vendor、version、acceptance 或 signer 单项放行。批准必须同时验证 descriptor、package digest、cryptographic signature、publisher、writer、安装事务与 server role，并把不一致保留到首次加载和结果调查。
      en: For Server-Component Trust-Identity Masquerade do not allow a component from name directory vendor version acceptance or signer alone. Approval jointly validates descriptor package digest cryptographic signature publisher writer installation transaction and server role and retains differentials through first load and outcome investigation.
  expected_effect:
    paragraphs:
    - zh: UNC3886 式声明 PartnerSupported 但签名不可用的 VIB 不再由常规清单获得信誉；攻击者需要同时控制声明 metadata、密码学证据、包事务和批准记录，提高伪装成本并缩短发现时间。
      en: A UNC3886-style VIB declaring PartnerSupported with an unavailable signature no longer gains trust from ordinary inventory. The adversary must control declared metadata cryptographic evidence package transaction and approval records together raising disguise cost and shortening discovery time.
  limitations:
    paragraphs:
    - zh: 遗留、迁移或社区支持组件可能合法缺少签名，更新也会改变内容与 version。严格签名策略可能破坏设备支持；差分必须结合批准、来源、首次加载和结果，而不能从一个警告直接归因。
      en: Legacy migrated or community-supported components may legitimately lack signatures and updates change content and version. Strict signature policy can break device support so differentials require approval provenance first load and outcome rather than attribution from one warning.
