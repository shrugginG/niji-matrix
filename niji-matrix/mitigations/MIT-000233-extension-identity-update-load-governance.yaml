schema_version: 2.0.0
type: mitigation
id: MIT-000233
name:
  zh: 扩展身份、更新与加载面治理
  en: Extension Identity Update and Load-Surface Governance
summary:
  zh: 以精确扩展命名空间、版本内容与更新完整性、最小宿主权限和全 profile 恢复降低恶意扩展持久化
  en: Reduce malicious extension persistence through exact extension namespaces version content and update integrity least host authority and recovery across every profile
description:
  paragraphs:
  - zh: 本缓解把扩展的 registry、publisher、ID、版本、内容、权限、更新来源、安装范围和业务 owner 作为一个批准对象，并限制公共市场、侧载、developer mode、CLI 和企业策略的使用。目标不是禁用所有扩展，而是防止显示名、官方市场、签名或宿主进程替代精确身份与内容验证。
    en: This mitigation treats extension registry publisher ID version content permissions update source installation scope and business owner as one approval object and constrains public marketplaces side-loading developer mode CLI and enterprise policy. The objective is not disabling all extensions but preventing display name official marketplace signature or host process from replacing exact identity and content validation.
  - zh: 控制覆盖发布、安装、更新、加载与恢复。发布方保护 uploader 和 signing key，企业分阶段批准版本；端点持续盘点所有用户 profile、本地/远程 extension host 并连接后继结果。处置移除包和注册状态、恢复已知良好版本、修复 publisher/管理平面并轮换可能暴露的会话、token 和开发凭据。
    en: Controls cover publication installation update load and recovery. Publishers protect uploader and signing keys and enterprises stage version approval. Endpoints continuously inventory every user profile and local or remote extension host and join successor outcomes. Response removes package and registration state restores a known-good version repairs publisher or management planes and rotates potentially exposed sessions tokens and developer credentials.
domains: [enterprise]
measures:
- key: exact-extension-namespace-control
  name: {zh: 精确扩展命名空间与安装来源控制, en: Exact Extension Namespace and Installation-Origin Control}
  description:
    paragraphs:
    - zh: 允许项绑定 registry、publisher、extension ID、安装范围、owner 和目标 host；限制公共市场、侧载、VSIX/CLI、developer mode 与未知 update URL，必要时使用私有市场和企业策略。
      en: Bind allowed extensions to registry publisher extension ID installation scope owner and target host. Restrict public marketplaces side-loading VSIX or CLI developer mode and unknown update URLs and use private marketplaces or enterprise policy where needed.
  control_type: preventive
- key: version-content-update-integrity
  name: {zh: 版本、内容与更新完整性, en: Version Content and Update Integrity}
  description:
    paragraphs:
    - zh: 分阶段批准 version、package hash、signature、permissions 与 update source，监控 publisher ownership 和上传身份变化；发布方采用最小 uploader 权限、独立 signing key 和 Verified CRX Upload 等二次验证。
      en: Stage approval for version package hash signature permissions and update source and monitor publisher ownership and upload-identity changes. Publishers use least uploader authority independent signing keys and second-factor controls such as Verified CRX Upload.
  control_type: preventive
- key: least-permission-runtime-constraint
  name: {zh: 最小扩展权限与宿主运行约束, en: Least Extension Permission and Host Runtime Constraint}
  description:
    paragraphs:
    - zh: 限制高风险 host/API/调试权限、外部进程启动、敏感站点范围和不必要外联，按扩展角色建立允许的 extension-host 行为；批准的宿主进程不自动放行 child process 或网络结果。
      en: Restrict high-risk host API and debug permissions external-process launch sensitive-site scope and unnecessary egress and baseline allowed extension-host behavior by role. An approved host process does not automatically allow child processes or network outcomes.
  control_type: exposure-reduction
- key: fleet-inventory-and-trusted-recovery
  name: {zh: 全 profile 清单与可信恢复, en: Fleet Profile Inventory and Trusted Recovery}
  description:
    paragraphs:
    - zh: 持续盘点所有用户 profile、企业策略、本地与远程 extension host；处置时保全包、配置、publisher 和结果证据，移除全部包与注册状态、恢复已知良好版本并轮换暴露的会话、token、Cookie 和开发凭据。
      en: Continuously inventory every user profile enterprise policy and local or remote extension host. During response preserve package configuration publisher and outcome evidence remove every package and registration state restore a known-good version and rotate exposed sessions tokens cookies and developer credentials.
  control_type: containment
applications:
- target_ref: NJT-0226
  use:
    paragraphs:
    - zh: 对宿主软件扩展持久化，把精确 identity allowlist、版本与更新审批、最小权限、配置 writer 审计和 host-load 结果监控作为统一控制包。每个扩展记录 registry/publisher/ID、package hash、version、permissions、update URL、安装范围、owner、writer 和批准期限，并在宿主重启或工作区重新打开后验证实际加载。
      en: For Host-Software Extension Persistence deploy exact identity allowlists version and update approval least privilege configuration-writer audit and host-load outcome monitoring as one control package. Each extension records registry publisher ID package hash version permissions update URL installation scope owner writer and approval expiry and verifies actual load after host restart or workspace reopen.
  expected_effect:
    paragraphs:
    - zh: 攻击者更难用相似名称、官方市场或宿主身份取得信任，也更难从文件或策略带外写入未审查状态。版本化历史与全 profile 恢复使恶意更新、重新注入和远程 extension host 残留更可见。
      en: Similar names official marketplaces or host identity provide less trust and out-of-band file or policy writes are less able to create unreviewed state. Versioned history and all-profile recovery make malicious updates reinjection and remote extension-host residue more visible.
  limitations:
    paragraphs:
    - zh: 版本固定会延迟安全修复，私有市场、侧载限制和权限收敛会影响开发、无障碍与安全工具。市场、publisher、企业管理平面和 signing key 同时失陷时单层批准可被绕过，仍需运行结果监控。
      en: Version pinning can delay security fixes and private marketplaces side-load restrictions and permission reduction can affect development accessibility and security tools. Simultaneous compromise of marketplace publisher enterprise management plane and signing key can bypass one approval layer and still requires runtime outcome monitoring.
- target_ref: NJS-0226-001
  use:
    paragraphs:
    - zh: 对受信扩展身份仿冒，以 `(registry, publisher ID, extension ID)` 为允许键，核对 publisher ownership、域验证、package hash、年龄、版本历史和真实仓库关系。显示名、说明、功能、安装量、rating 或“来自 Marketplace”只能作为外观，不得替代精确 identity。
      en: For Trusted-Extension Identity Impersonation use registry publisher ID and extension ID as allow keys and verify publisher ownership domain validation package hash age version history and real repository relation. Display name description function install count rating or Marketplace origin is appearance only and does not replace exact identity.
  expected_effect:
    paragraphs:
    - zh: Check Point 所见的近似命名和功能仿冒会在 exact identity、publisher 与包历史处产生差分，攻击者需要同时建立可信 publisher、内容和历史，而不再只靠市场 UI 取得安装。
      en: Naming and function impersonation observed by Check Point produces differentials in exact identity publisher and package history forcing the adversary to establish trusted publisher content and history instead of relying on marketplace UI for installation.
  limitations:
    paragraphs:
    - zh: 合法 fork、publisher 迁移、重命名和企业内部同名扩展会产生差分；新项目缺少历史并不等于恶意。审批需结合 owner、用途和内容审查，不能因年龄或安装量低就一刀切阻断。
      en: Legitimate forks publisher migration renaming and internal same-name extensions create differentials and a new project lacks history without being malicious. Approval combines owner purpose and content review and cannot blanket-block from low age or installation count.
- target_ref: NJS-0226-002
  use:
    paragraphs:
    - zh: 对带外扩展注册状态植入，限制 profile、policy、preference、Registry 和 extension directory 的 writer，记录 VSIX/CLI、developer mode 和 force-install，比较批准部署事件与配置变化；发现后移除所有 profile 和远程 host 状态并修复管理 writer。
      en: For Out-of-Band Extension Registration-State Implantation restrict writers to profiles policies preferences Registry and extension directories record VSIX or CLI developer mode and force-install and compare approved deployment events with configuration changes. After discovery remove state from every profile and remote host and repair the management writer.
  expected_effect:
    paragraphs:
    - zh: KREMLIN 式在浏览器关闭后写入 Secure Preferences、重建 hash 并由以后启动加载的链会在 writer—registration—load 三点留下差分；商店审计缺失不再等于无安装。
      en: KREMLIN-style writes to Secure Preferences after browser closure hash regeneration and later startup load leave writer-to-registration-to-load differentials and missing marketplace audit no longer means no installation.
  limitations:
    paragraphs:
    - zh: MDM、Group Policy、企业镜像、profile 漫游和开发者 CLI 合法使用同一路径。文件审计缺失、离线写入或管理平面失陷会隐藏 writer；控制必须按 change context 和后继结果调优。
      en: MDM Group Policy enterprise images profile roaming and developer CLI legitimately use the same paths. Missing file audit offline writes or compromised management planes hide writers and controls require change-context and successor-outcome tuning.
