schema_version: 2.0.0
type: mitigation
id: MIT-000234
name:
  zh: 认证证书签发授权与身份绑定
  en: Authentication-Certificate Enrollment Authority and Identity Binding
summary:
  zh: 限定认证签发的主体、模板与代理范围，并用当前支持的强映射验证身份绑定。
  en: Constrain subjects, templates, and delegation for authentication enrollment and validate identity binding with currently supported
    strong mappings.
description:
  paragraphs:
  - zh: 证书签发需要同时符合服务配置和组织批准。把模板、Enrollment Agent、被表示主体与请求来源分别授权，使用不同管理身份审批高风险变更，保留发生时的有效范围和签发结果。强映射约束证书到主体的绑定，但不能替代保护已经合法签发的私钥。
    en: Certificate enrollment must satisfy both service configuration and organizational approval. Authorize templates, Enrollment Agents,
      represented subjects, and request origins separately, approve high-risk changes with distinct administrative identities, and retain
      effective historical scope and issuance results. Strong mapping constrains certificate-to-principal binding but does not replace protection
      of legitimately issued private keys.
domains:
- enterprise
measures:
- key: subject-template-delegation-scope
  name:
    zh: 主体模板与代理范围限制
    en: Subject Template and Delegation Scope
  description:
    paragraphs:
    - zh: 仅对必要主体开放认证用途模板，限制请求者可提供的身份信息，并限定代理可代表的人群和模板。逐组合测试批准请求成功与越界请求拒绝。
      en: Expose authentication-capable templates only to necessary principals, constrain requester-supplied identity information, and limit
        the populations and templates available to agents. Test allowed and out-of-scope combinations separately.
  control_type: preventive
- key: independent-enrollment-approval
  name:
    zh: 独立签发与变更批准
    en: Independent Enrollment and Change Approval
  description:
    paragraphs:
    - zh: 将 CA 管理、模板管理、代理注册和审计职责分离，高风险签发与权限变更要求有限期批准，并验证实际有效权限。
      en: Separate CA administration, template administration, enrollment delegation, and audit roles, require bounded approval for high-risk
        issuance and authority changes, and verify effective rights.
  control_type: governance
- key: current-strong-mapping-validation
  name:
    zh: 当前强映射验证
    en: Current Strong-Mapping Validation
  description:
    paragraphs:
    - zh: 按支持的补丁与平台配置落实证书到主体强映射，验证正确 SID 或支持的强绑定，而非依赖可伪造的名称相似。对旧客户端兼容例外设置期限与替代控制。
      en: Apply supported certificate-to-principal strong mapping for the current platform and patch state, validating correct SIDs or supported
        strong bindings rather than spoofable name resemblance. Bound legacy compatibility exceptions and provide compensating controls.
  control_type: preventive
- key: independent-issuance-ledger
  name:
    zh: 独立签发账本
    en: Independent Issuance Ledger
  description:
    paragraphs:
    - zh: 把请求、解析证书、授权范围与审批记录按 CA 实例和 Request ID 留存在签发管理员不能独自修改的存储，验证审计过滤器与 OS 策略共同生效。
      en: Retain requests, parsed certificates, authority scope, and approvals by CA instance and request ID in storage not independently
        modifiable by issuance administrators, verifying both CA audit filters and OS policy.
  control_type: detective-support
applications:
- target_ref: NJT-0227
  use:
    paragraphs:
    - zh: 将认证证书签发列为身份凭据创建，按用途登记请求者、模板与主体绑定，调查异常时保留完整请求和输出谱系。
      en: Treat authentication enrollment as identity-credential creation, inventory requesters, templates, and subject bindings by purpose,
        and preserve request and output lineage during investigation.
  expected_effect:
    paragraphs:
    - zh: 缩小从可用请求身份转化成未批准认证能力的机会，并可区分真实签发、材料控制与后续使用。
      en: Reduce opportunities to turn a valid requesting identity into unapproved authentication capability while distinguishing issuance,
        material control, and subsequent use.
  limitations:
    paragraphs:
    - zh: 无法防止已签发私钥被窃取或完全失守 CA 的服务外签名；强绑定也不能阻止具有正确绑定的有效私钥被滥用。
      en: Does not prevent theft of issued keys or off-service signing after full CA compromise; strong binding also cannot prevent misuse
        of a valid key with the correct binding.
- target_ref: NJS-0227-001
  use:
    paragraphs:
    - zh: 按代理人群、模板、来源和批准窗口封闭可代表主体范围，清除不必要的任意身份供应并校验请求时的强映射。
      en: Constrain represented subjects by delegated population, template, origin, and approval window, remove unnecessary arbitrary identity
        supply, and validate strong mapping effective at request time.
  expected_effect:
    paragraphs:
    - zh: 技术上可签发但组织未批准的组合更难获得认证材料，合法代理和恶意控制的差异可回溯。
      en: Make technically issuable but unapproved combinations harder to convert into credentials and preserve distinctions between legitimate
        delegation and malicious control.
  limitations:
    paragraphs:
    - zh: 集中部署、旧客户端和灾备需要经验证的兼容流程；请求者自身已在批准范围内时，还需端点与中继路径控制。
      en: Centralized deployment, legacy clients, and recovery need validated compatibility workflows; approved requesters still require
        endpoint and relay-path controls.
