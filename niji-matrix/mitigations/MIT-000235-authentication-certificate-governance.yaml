schema_version: 2.0.0
type: mitigation
id: MIT-000235
name:
  zh: 认证私钥隔离与失守签发者恢复
  en: Authentication-Key Isolation and Compromised-Issuer Recovery
summary:
  zh: 保护私钥复制与调用边界，并从签发者信任层恢复无法完整枚举的服务外证书风险。
  en: Protect key-copy and invocation boundaries and recover at issuer-trust level when off-service certificates cannot be fully enumerated.
description:
  paragraphs:
  - zh: 终端与 CA 私钥需要按用途、运行身份和恢复权限隔离。对高价值密钥采用适用的硬件保护，同时约束被授权调用者；软件不可导出标志不能代表硬件隔离。签发密钥失守后，不应只重置口令或逐请求撤销，而要评估受影响签发者、信任链、已发证书和后继会话。
    en: Separate end-entity and CA keys by purpose, runtime identity, and recovery authority. Use applicable hardware protection for high-value
      keys while constraining authorized callers; a software non-exportable flag does not establish hardware isolation. After signing-key
      compromise, assess affected issuers, trust chains, issued certificates, and successor sessions rather than only resetting passwords
      or revoking individual requests.
domains:
- enterprise
measures:
- key: key-custody-and-call-authorization
  name:
    zh: 私钥保管与调用授权
    en: Key Custody and Invocation Authority
  description:
    paragraphs:
    - zh: 限定私钥容器与备份的访问者，对高价值签发密钥采用适用 HSM/TPM 或等价隔离，限制签名服务运行身份和调用批准。
      en: Restrict access to private-key containers and backups, use applicable HSM, TPM, or equivalent isolation for high-value signing
        keys, and constrain signing-service runtime identities and invocation approval.
  control_type: preventive
- key: split-backup-recovery-custody
  name:
    zh: 备份与恢复保管分离
    en: Separate Backup and Recovery Custody
  description:
    paragraphs:
    - zh: 将私钥备份、解密口令和恢复批准分离保管，限制在线恢复副本与维护身份，演练恢复且不把秘密放入检测日志。
      en: Separate key backups, decryption passwords, and recovery approvals, restrict online recovery copies and maintenance identities,
        and exercise recovery without placing secrets in detection logs.
  control_type: exposure-reduction
- key: issuer-trust-and-session-recovery
  name:
    zh: 签发者信任与会话恢复
    en: Issuer-Trust and Session Recovery
  description:
    paragraphs:
    - zh: 确认签发私钥失守后保全证据并按 PKI 事件流程评估换钥、撤信、重新签发与依赖方恢复；验证旧材料被拒绝，另行处置已签发票据与资源会话。
      en: After confirmed signing-key compromise, preserve evidence and use the PKI incident process to assess key replacement, trust withdrawal,
        reissuance, and relying-party recovery. Verify rejection of old material and separately handle issued tickets and resource sessions.
  control_type: containment
applications:
- target_ref: NJT-0227
  use:
    paragraphs:
    - zh: 将终端认证密钥与 CA 签名密钥分别登记并按角色保护，验证批准导出、不可导出和调用权限的实际边界；发现材料暴露后追溯具体证书与持有人。
      en: Inventory and protect end-entity authentication keys and CA-signing keys separately, validate actual export, non-exportability,
        and invocation boundaries, and trace specific certificates and holders after exposure.
  expected_effect:
    paragraphs:
    - zh: 减少可携私钥取得机会，并使材料泄露、签名能力失守与认证后果采用相应响应范围。
      en: Reduce portable-key acquisition opportunities and align response scope with material exposure, signing-capability compromise, and
        authentication consequences.
  limitations:
    paragraphs:
    - zh: 已控运行身份可能仍可调用硬件密钥；诊断与备份需要限期例外，没有材料证据时不能声称精确枚举全部受影响凭据。
      en: A compromised runtime identity may still invoke hardware keys. Diagnostics and backup need bounded exceptions, and absence of material
        evidence prevents claiming an exact inventory of every affected credential.
- target_ref: NJS-0227-002
  use:
    paragraphs:
    - zh: 隔离受信签发私钥的复制与签名调用权限，失守后按签发者和依赖方撤回或替换信任，重建独立库存，并检查旧材料与已建立会话。
      en: Isolate copying and signature-invocation authority for trusted issuer keys. After compromise, withdraw or replace trust by issuer
        and relying party, rebuild independent inventory, and examine old material and established sessions.
  expected_effect:
    paragraphs:
    - zh: 提高在服务外持续构造可信认证证书的成本，并使响应覆盖无法从正常 CA 请求库枚举的新材料。
      en: Increase the cost of continued off-service trusted certificate construction and extend response to material that cannot be enumerated
        from normal CA requests.
  limitations:
    paragraphs:
    - zh: 换钥与撤信可能影响大量设备和服务，需要分阶段恢复及拒绝验证；硬件防复制不能替代授权调用保护，未知证书不适合仅按已知序列号逐个撤销。
      en: Key replacement and trust withdrawal can affect many devices and services and require staged recovery and rejection testing. Hardware
        copy resistance does not replace invocation controls, and unknown certificates cannot be handled solely by revoking known serials.
