schema_version: 2.0.0
type: mitigation
id: MIT-000236
name:
  zh: Kerberos 可离线取材暴露收敛
  en: Kerberos Offline-Test Material Exposure Reduction
summary:
  zh: 恢复预认证、提高服务秘密强度并治理加密依赖，减少匿名取材机会与后继离线恢复收益。
  en: Restore preauthentication, strengthen service secrets, and govern encryption dependencies to reduce unauthenticated acquisition and
    subsequent offline-recovery value.
description:
  paragraphs:
  - zh: 此控制针对KDC合法协议所暴露的可离线测试材料。移除不必要的无预认证设置，使用可管理的高熵服务秘密与最低服务权限，并在兼容性验证后采用AES和收敛旧算法。取材速率或本机缓存路径改变后，这些配置仍作用于同一目标账户和密钥，降低已取得密文转化为可用秘密的概率。
    en: This control addresses offline-test material exposed through legitimate KDC protocols. Remove unnecessary no-preauthentication settings,
      use managed high-entropy service secrets and minimum service privileges, and adopt AES while reducing old algorithms after compatibility
      testing. These settings govern the same target accounts and keys even when acquisition cadence or local caching changes, reducing the
      likelihood that acquired ciphertext becomes a usable secret.
domains:
- enterprise
measures:
- key: require-preauthentication
  name:
    zh: 恢复必要预认证
    en: Require preauthentication
  description:
    paragraphs:
    - zh: 盘点DONT_REQ_PREAUTH，移除无业务必要的例外，例外绑定owner、依赖、期限与监控；监控该位非批准变更。
      en: Inventory DONT_REQ_PREAUTH, remove exceptions without business need, bind remaining exceptions to owner, dependency, expiry, and
        monitoring, and monitor unapproved changes to the bit.
  control_type: preventive
- key: high-entropy-service-secrets
  name:
    zh: 提高服务账户秘密强度
    en: Strengthen service-account secrets
  description:
    paragraphs:
    - zh: 对支持的工作负载使用gMSA或等价受管长随机秘密，限制可读取主体与服务权限，按依赖安全轮换；不要只依靠人选短口令和复杂度。
      en: Use gMSAs or equivalent managed long random secrets for supported workloads, restrict readers and service privileges, and rotate
        safely by dependency rather than relying on human-selected short passwords and complexity alone.
  control_type: cost-increasing
- key: encryption-dependency-governance
  name:
    zh: 治理加密依赖
    en: Govern encryption dependencies
  description:
    paragraphs:
    - zh: 先核对服务、客户端、DC及trust密钥和票据加密的真实协商，再逐步采用AES并收敛RC4等遗留算法，保留限时兼容例外。
      en: Validate actual negotiation and keys across services, clients, DCs, and trusts before adopting AES and reducing legacy algorithms
        such as RC4, retaining time-limited compatibility exceptions.
  control_type: cost-increasing
applications:
- target_ref: NJT-0228
  use:
    paragraphs:
    - zh: 对所有可返回离线测试材料的身份核对预认证、服务秘密、服务权限与算法依赖，优先清理高权可取材账户。
      en: Review preauthentication, service secrets, privileges, and algorithm dependencies for identities exposing offline-test material,
        prioritizing privileged targets.
  expected_effect:
    paragraphs:
    - zh: 减少未认证回复与弱秘密导致的恢复收益，不依赖抓住某次峰值。
      en: Reduce unauthenticated replies and recovery value caused by weak secrets without depending on catching a request burst.
  limitations:
    paragraphs:
    - zh: 有效域会话仍通常能请求服务票据；AES并不消除取材，且这些措施不撤销已窃取票据或已泄露krbtgt密钥。
      en: A valid domain session can normally still request service tickets. AES does not eliminate acquisition, and these measures revoke
        neither stolen tickets nor exposed krbtgt keys.
- target_ref: NJS-0228-001
  use:
    paragraphs:
    - zh: 对低密度取材可能涉及的账户实施相同预认证与秘密治理，并持续复核稀疏请求的新服务关系。
      en: Apply preauthentication and secret governance to accounts exposed to low-density acquisition and review new service relationships
        across sparse requests.
  expected_effect:
    paragraphs:
    - zh: 即使序列低于短时阈值，弱秘密和不必要预认证例外也被收敛。
      en: Reduce weak secrets and unnecessary preauthentication exceptions even when the sequence falls below short-window thresholds.
  limitations:
    paragraphs:
    - zh: 不能强制合法TGS请求形成峰值，也不能仅靠算法选择识别故意延迟。
      en: These controls neither force legitimate TGS requests into bursts nor identify deliberate delay through algorithm choice alone.
- target_ref: NJS-0228-002
  use:
    paragraphs:
    - zh: 对直接协议客户端请求的目标执行服务秘密、预认证和算法治理，不以是否填充本机缓存决定配置适用性。
      en: Govern service secrets, preauthentication, and algorithms for targets requested by direct-protocol clients regardless of local-cache
        population.
  expected_effect:
    paragraphs:
    - zh: 控制保持在权威账户和密钥面，避免缓存旁路同时绕过风险治理。
      en: Keep controls at authoritative account and key planes so cache bypass does not also bypass risk governance.
  limitations:
    paragraphs:
    - zh: 标准服务票据仍可返回；需要进程与材料输出监控补充识别，配置控制并不使直接客户端自动可信。
      en: Standard service tickets can still be returned. Process and material-output monitoring is needed for discrimination, and configuration
        controls do not make a direct client trustworthy.
