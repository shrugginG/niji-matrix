schema_version: 2.0.0
type: mitigation
id: MIT-000237
name:
  zh: Kerberos 缓存边界与保留治理
  en: Kerberos Cache Boundary and Retention Governance
summary:
  zh: 按实际backend隔离可用票据与会话密钥，约束reader和寿命，并保护复制与证据输出。
  en: Isolate usable tickets and session keys by actual cache backend, constrain readers and lifetime, and protect copied and forensic output.
description:
  paragraphs:
  - zh: 缓存是可用认证材料的持有面，不能只把一个常见/tmp路径当作全部范围。组织应盘点FILE、DIR、KCM、KEYRING、MEMORY及平台特有backend，将用户和服务隔离，限定读者与复制目的，并让任务结束后的材料保留与续期符合业务所需。控制目的在于减少既存材料落入其他控制域的机会。
    en: Caches hold usable authentication material, so one common /tmp path cannot represent the entire surface. Inventory FILE, DIR, KCM,
      KEYRING, MEMORY, and platform-specific backends, separate users and services, restrict readers and copy purposes, and align retention
      and renewal after tasks with business needs. The purpose is to reduce transfers of existing material into another control domain.
domains:
- enterprise
measures:
- key: backend-owner-isolation
  name:
    zh: 按backend与owner隔离
    en: Isolate by backend and owner
  description:
    paragraphs:
    - zh: 对FILE/DIR配置私有目录和最小读取权限，对KCM/KEYRING按实际实现验证UID与服务边界；分离高权管理身份和普通工作负载，避免共享可搬移缓存。
      en: Use private directories and minimum read permissions for FILE or DIR; validate UID and service boundaries for the deployed KCM
        or KEYRING implementation. Separate privileged administration from ordinary workloads and avoid shared portable caches.
  control_type: exposure-reduction
- key: bounded-cache-lifecycle
  name:
    zh: 限定缓存生命周期
    en: Bound cache lifecycle
  description:
    paragraphs:
    - zh: 按任务与会话需要配置最短可用寿命和续期范围，任务结束时由批准消费者清理缓存，备份、诊断与崩溃输出按认证材料保护并审计读取。
      en: Set minimum practical lifetimes and renewal scope for tasks and sessions, let approved consumers clear caches at task completion,
        and protect backups, diagnostics, and crash output as authentication material with read auditing.
  control_type: exposure-reduction
- key: reader-output-custody
  name:
    zh: 约束reader和输出保管
    en: Constrain readers and output custody
  description:
    paragraphs:
    - zh: 对批准缓存reader定义owner、对象与输出合同；审计意外读取和复制，集中保留摘要而非原始票据及会话密钥。
      en: Define owner, object, and output contracts for approved cache readers, audit unexpected reads and copies, and centralize digests
        instead of raw tickets and session keys.
  control_type: detective-support
applications:
- target_ref: NJT-0228
  use:
    paragraphs:
    - zh: 先识别每台主机实际backend、缓存名称与owner，再部署相应访问控制和生命周期策略；Windows认证运行态保护另复用MIT-000187，文件缓存不能代替API缓存治理。
      en: Identify each host's actual backend, cache name, and owner before deploying applicable access controls and lifecycle policy. Reuse
        MIT-000187 for Windows authentication-runtime protection, and do not substitute file-cache governance for API-cache controls.
  expected_effect:
    paragraphs:
    - zh: 减少跨用户缓存复制、无必要长期保留和诊断输出暴露，改善材料结果定位。
      en: Reduce cross-user cache copying, unnecessary long retention, and diagnostic-output exposure while improving material-outcome attribution.
  limitations:
    paragraphs:
    - zh: 同UID恶意代码、root/内核控制和已控制缓存服务仍可绕过；清理本机缓存不会自动撤销已复制材料，短寿命也有SSO与批处理代价。
      en: Malicious code under the same UID, root or kernel control, and compromised cache services can bypass these controls. Local cleanup
        does not revoke copied material, and short lifetimes impose SSO and batch costs.
evidence_refs:
