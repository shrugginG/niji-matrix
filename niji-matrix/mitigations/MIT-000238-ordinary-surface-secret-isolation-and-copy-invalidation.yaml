schema_version: 2.0.0
type: mitigation
id: MIT-000238
name:
  zh: 普通内容面秘密隔离与副本失效
  en: Ordinary-Surface Secret Isolation and Copy Invalidation
summary:
  zh: 减少普通内容中的认证秘密并分别治理副本读取与已暴露值的后继价值。
  en: Reduce authentication secrets in ordinary content and separately govern copy access and downstream value of exposed material.
description:
  paragraphs:
  - zh: 将秘密的现行供给面与历史、协作、日志和导出副本分别盘点，登记 owner、允许读者、保留期限、形成关系和轮换责任。普通配置尽可能只保存引用，必须存在的值由独立秘密边界、最小权限及短寿命机制保护；已生成副本不能依靠原件修正自动撤回。
    en: Inventory current secret-supply surfaces separately from history, collaboration, logs, and export copies, retaining owner, allowed
      readers, retention, creation relationships, and rotation responsibility. Ordinary configuration should carry references where possible,
      with necessary values protected by independent custody, least authority, and short lifetimes. Correcting an original does not retract
      existing copies.
domains:
- enterprise
measures:
- key: remove-ambient-secret-values
  name:
    zh: 移除普通内容中的秘密值
    en: Remove Secret Values from Ordinary Content
  description:
    paragraphs:
    - zh: 从现行脚本、配置、注册表自动登录值、普通清单和日志移除不必要秘密，用专用秘密引用和最小消费者范围代替；禁止把公开常量加密或 base64 视为保密边界。检查过滤后的历史与日志输出，避免将秘密迁入另一普通记录。
      en: Remove unnecessary secrets from active scripts, configuration, registry autologon values, ordinary manifests, and logs, using dedicated
        secret references and minimum consumer scope. Public-constant encryption and base64 are not confidentiality boundaries. Check filtered
        history and log output so migration does not create another ordinary record.
  control_type: exposure-reduction
- key: govern-secondary-records
  name:
    zh: 治理次生记录与读取
    en: Govern Secondary Records and Reads
  description:
    paragraphs:
    - zh: 盘点历史、共享消息、版本、备份和导出副本的对象身份与形成链，对仍必要记录设置最小读取、受控保留和内容脱敏，清理可控 clone 与引用并验证实际效果。使用经版本验证的历史敏感过滤和不含秘密的审计特征，兼顾调查记录要求。
      en: Inventory object identities and creation chains for history, shared messages, versions, backups, and exports. Apply least read
        authority, controlled retention, and redaction to necessary records; clean controlled clones and references and verify the outcome.
        Use version-tested sensitive-history filtering and value-free audit features while preserving investigation requirements.
  control_type: preventive
- key: invalidate-by-exposure-scope
  name:
    zh: 按暴露范围使材料失效
    en: Invalidate Material by Exposure Scope
  description:
    paragraphs:
    - zh: 保全必要证据后，按材料类别、身份、暴露版本和接收者轮换口令与密钥或撤销令牌，验证旧材料在授权测试中被拒绝。保留未知副本与无法删除的外部记录清单；仅删原文件、打补丁或重写历史不能代替失效处置。
      en: After preserving necessary evidence, rotate passwords and keys or revoke tokens by material class, identity, exposed version, and
        recipient, verifying rejection of old material in authorized tests. Retain an inventory of unknown copies and undeletable external
        records. Deleting originals, patching, or rewriting history does not substitute for invalidation.
  control_type: containment
applications:
- target_ref: NJT-0229
  use:
    paragraphs:
    - zh: 扫描现行配置、自动登录键、旧 GPP XML 和普通容器清单，先确认真实秘密承载再分配 owner 与允许读者。移除明文/公开可逆秘密并轮换已暴露值；GPP 更新后仍检查并删除旧含口令策略，正常保管库与工作负载凭据通过专用边界保护，而不通过全禁正常 API
        处理。
      en: Scan active configuration, autologon keys, old GPP XML, and ordinary container manifests, confirming real secret content before
        assigning owner and readers. Remove plaintext or publicly reversible secrets and rotate exposed values; after GPP updates still inspect
        and remove old password-bearing policies. Protect legitimate vault and workload credentials at their dedicated boundaries rather
        than disabling ordinary APIs wholesale.
  expected_effect:
    paragraphs:
    - zh: 可由普通内容读取获得的秘密数量与寿命下降，攻击者必须接触更受控的秘密面或承担额外取得成本。对象与读者清单还能使残余读取被关联为潜在秘密披露，而不只是一次无语义文件访问。
      en: Fewer and shorter-lived secrets remain obtainable through ordinary content, forcing contact with a more controlled secret surface
        or additional acquisition cost. Object and reader inventories also let residual reads be interpreted as potential disclosures instead
        of semantically empty file access.
  limitations:
    paragraphs:
    - zh: 受侵消费者仍可读取其业务所需秘密，老系统可能不支持引用或短寿命材料。迁移和轮换可中断服务，外部副本也无法保证删除；仍需监测内容读取，且材料有效性未知时不能只凭删除成功宣告恢复。
      en: A compromised consumer can still read secrets required for its job, and legacy systems may lack references or short-lived material.
        Migration and rotation can interrupt service and external copies cannot be guaranteed deleted. Read monitoring remains necessary,
        and successful deletion alone cannot establish recovery when validity is unknown.
- target_ref: NJS-0229-001
  use:
    paragraphs:
    - zh: 按命令记录、共享关系、版本差异或备份映射登记副本谱系；扫描范围包括历史 commit、受控 clone、协作导出和 history 文件，不能只检查当前文件。对可控记录执行最小读取与保留，对已暴露秘密先轮换或撤销，再协调清理 fork、缓存和备份，记录无法撤回的副本。
      en: Register copy lineage from command records, sharing relationships, version differences, or backup mappings. Scan historical commits,
        controlled clones, collaboration exports, and history files rather than only current files. Apply least reading and retention to
        controlled records, rotate or revoke exposed secrets first, then coordinate fork, cache, and backup cleanup and record copies that
        cannot be retracted.
  expected_effect:
    paragraphs:
    - zh: 攻击者绕过现行供给面从旧记录取得可用秘密的机会缩小；即使未知 clone 继续存在，旧值失效也降低后继风险。记录谱系与读取审计连接后，副本取得不再只依赖原保管库出现新事务才能被解释。
      en: Opportunities to recover usable secrets from old records without the current supply surface decrease. Even when unknown clones
        persist, invalidating old values reduces downstream risk. Linking record lineage and read audit makes copy acquisition interpretable
        without requiring a new original-custodian transaction.
  limitations:
    paragraphs:
    - zh: 组织不能清除他人的全部 clone 或已外传邮件，保留义务也可能禁止删除原始记录。历史过滤依赖版本和命令语义，简单关键词会漏记或误删调查信息；如果攻击者已持有新秘密或控制轮换流程，副本治理不能单独恢复信任。
      en: Organizations cannot erase every external clone or exfiltrated email, and retention duties may prohibit deleting original records.
        History filtering depends on version and command semantics, while simple keywords can miss secrets or remove investigative information.
        Copy governance alone cannot restore trust if the actor holds new secrets or controls rotation.
