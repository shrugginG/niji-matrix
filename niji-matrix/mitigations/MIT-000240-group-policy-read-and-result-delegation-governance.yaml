schema_version: 2.0.0
type: mitigation
id: MIT-000240
name:
  zh: 组策略读取授权与审计治理
  en: Group Policy Read Entitlement and Audit Governance
summary:
  zh: 减少非必要策略信息读取并建立可验证的读取问责，同时保留策略交付所需权限。
  en: Reduce unnecessary policy-information reads and establish verifiable read accountability while preserving rights required
    for policy delivery.
description:
  paragraphs:
  - zh: 组策略信息是客户端和管理员工作所需，不能通过全面禁止读取来可靠消除本技术。控制重点是审查额外读取与远端结果委派，登记批准诊断来源，并对重要 GPO 验证目录和文件读取审计。该控制减少额外暴露、提高识别和取证能力，不保证阻断已失陷合法客户端对必要策略的读取。
    en: Clients and administrators need Group Policy information, so a blanket read prohibition cannot reliably remove the
      behavior. Review unnecessary reads and remote-result delegation, register approved diagnostic origins, and validate
      directory and file read auditing for important GPOs. The control reduces additional exposure and improves identification
      and investigation without guaranteeing prevention of necessary reads by a compromised legitimate client.
domains:
- enterprise
measures:
- key: preserve-required-scope-review-extra-read
  name:
    zh: 保留必要读取并审查额外委派
    en: Preserve required reads and review extra delegation
  description:
    paragraphs:
    - zh: 在 GPMC 中审查策略和远端结果读取委派，移除过期支持身份或无业务必要的额外读取，变更前验证用户与计算机策略都能正常应用。不要把安全筛选中的 Apply Group Policy 与读取权混同；MS16-072 后用户策略交付会使用计算机安全上下文，不能为了减少信息暴露而直接删去必要的
        Authenticated Users 或 Domain Computers 读取路径。
      en: Review policy and remote-result read delegation in GPMC and remove expired support identities or unnecessary additional
        reads, validating normal user and computer policy application before changes. Do not conflate Apply Group Policy in
        security filtering with read rights. User-policy retrieval uses the computer security context after MS16-072, so required
        Authenticated Users or Domain Computers read paths must not simply be removed to reduce information exposure.
  control_type: exposure-reduction
- key: approved-diagnostic-source-inventory
  name:
    zh: 批准策略诊断来源清单
    en: Approved policy diagnostic origin inventory
  description:
    paragraphs:
    - zh: 为策略报表、GPMC 与远端结果查询记录 owner、身份、源设备、目标范围、脚本和有效时间，把临时支持访问设为有期限的委派。保留正常工单与作业记录，使合法诊断可以核实，也让复用受信工具的异常来源可被区分。
      en: Record owner, identity, origin device, target scope, script, and validity interval for policy reports, GPMC, and
        remote-result queries and make temporary support delegation expire. Retain tickets and job records so legitimate diagnostics
        can be verified and abnormal origins reusing trusted tools can be distinguished.
  control_type: governance
- key: targeted-policy-read-observation
  name:
    zh: 定向策略读取观察
    en: Targeted policy-read observation
  description:
    paragraphs:
    - zh: 为选定 GPO 目录对象与策略属性部署匹配的读取 SACL 和审计策略，为重点 SYSVOL 文件验证 5145 及 ReadData SACL/4663，将同服务器登录与客户端进程上下文独立保留。通过成功、拒绝和正常刷新测试核实事件语义，监测日志容量与丢失，不把策略写入日志当成读取覆盖。
      en: Deploy matching read SACLs and audit policy for selected GPO directory objects and policy attributes, validate 5145
        plus ReadData SACL and 4663 on priority SYSVOL files, and independently retain same-server logon and client process
        context. Verify event semantics through successful, denied, and normal-refresh tests, monitor capacity and loss, and
        do not count policy-write logs as read coverage.
  control_type: detective-support
applications:
- use:
    paragraphs:
    - zh: 对组策略发现，围绕实际域策略交付保留必要读取，同时收回无 owner 的报表与远端结果委派；将客户端策略处理和批准诊断任务同 GPO 目录、SYSVOL 与端点请求相连接。优先验证高价值 GPO 的观察覆盖，再根据负载扩展，避免全面审计拖垮域控制器。
      en: For Group Policy Discovery, preserve reads needed for actual domain policy delivery while removing ownerless reporting
        and remote-result delegation. Join client policy processing and approved diagnostics with GPO directory, SYSVOL, and
        endpoint requests. Validate visibility on high-value GPOs first and expand according to workload rather than overwhelming
        domain controllers with comprehensive auditing.
  expected_effect:
    paragraphs:
    - zh: 不必要的策略视图与跨端点报表访问减少，借用合法读取接口的异常来源更容易被归属。经验证的读取证据能将授权检查、目录读取和文件实际访问分层，为后续调查保留可解释上下文；这主要增加攻击者绕过职责与任务检查的成本。
      en: Unnecessary policy views and cross-endpoint report access are reduced, and abnormal origins reusing legitimate read
        interfaces become easier to attribute. Validated read evidence separates authorization checks, directory reads, and
        exercised file access while retaining interpretable context for investigation. This primarily increases the cost of
        bypassing role and work-context checks.
  limitations:
    paragraphs:
    - zh: 已失陷且依法需要读取策略的用户或计算机仍可调查必要设置，错误收紧权限会破坏策略交付。读取审计依赖预先配置并有容量代价，本地已有结果可能继续可读；控制不能撤回已取得的信息，也不能只凭未产生事件证明没有发现活动。
      en: Compromised users or computers legitimately requiring policy reads can still inspect necessary settings, and incorrectly
        tightened rights can break policy delivery. Read auditing requires advance configuration and consumes capacity, while
        existing local results may remain readable. The control cannot retract acquired information or establish absence of
        discovery merely from missing events.
  target_ref: NJT-0231
- target_ref: NJS-0239-001
  use:
    paragraphs:
    - zh: 对策略关系推导替代，在承载组映射的 GPO 和 SYSVOL 文件上实施已有策略读取治理措施：核查额外读取委派，保留用户与计算机策略交付所需权限，登记批准采集与审查来源，并验证针对组映射的目录或 ReadData 证据。核查聚焦关系推导所需文件及其作用域，不将普通策略刷新统一认定为调查。
      en: 'For Policy-Relationship Inference Substitution, apply existing policy-read governance to GPOs and SYSVOL files
        carrying group mappings: review excess read delegation, preserve rights required for user and computer policy delivery,
        register approved collection and review origins, and validate directory or ReadData evidence for group mappings. Focus
        on files and scope needed for relationship inference rather than treating ordinary policy refresh as surveying.'
  expected_effect:
    paragraphs:
    - zh: 该子项移至中央策略端的观察面获得有语义的读取与来源证据，额外策略暴露减少；只看成员主机枚举时的调查缺口可由中央读取问责弥补，但仍保留配置推论与现场关系的区别。
      en: The child's central-policy observation plane gains meaningful read and origin evidence while excess policy exposure
        decreases. Central-read accountability can address the survey gap in member-host-only monitoring while preserving
        the distinction between configuration inference and current relationships.
  limitations:
    paragraphs:
    - zh: 已受陷且需要读取策略的用户或计算机仍可推导合法可见的关系；错误删去必要读取会破坏策略应用。已有副本、未审计路径与被盗审查身份仍可被利用，审计只能证明访问层级而非解析出的完整成员图。
      en: Compromised users or computers requiring policy reads can still infer legitimately visible relationships, and removing
        necessary reads can break policy application. Existing copies, unaudited paths, and stolen review identities remain
        usable. Auditing establishes access-level facts rather than a complete parsed member graph.
