schema_version: 2.0.0
type: mitigation
id: MIT-000241
name:
  zh: 存储盘点执行约束与查询问责
  en: Storage-Inventory Execution Constraints and Query Accountability
summary:
  zh: 约束未批准代码与管理入口，并使存储盘点请求可同批准作业核验。
  en: Constrain unapproved code and management entry points and make storage-inventory requests verifiable against approved
    work.
description:
  paragraphs:
  - zh: 卷存在性和容量是安装、运行和维护需要的信息，不能普遍对已授权进程隐藏。控制通过应用与脚本信任减少不必要查询执行能力，并以批准作业、命令和会话证据减少原生工具外观带来的辨识困难；它不以隐藏盘符或文件内容加密充当存储发现阻断。
    en: Volume presence and capacity are needed for installation, runtime, and maintenance and cannot generally be hidden
      from authorized processes. Controls reduce unnecessary querying capability through application and script trust and
      reduce ambiguity from native-tool appearance using approved work, commands, and session evidence. Hiding drive letters
      or encrypting file content is not treated as blocking storage discovery.
domains:
- enterprise
measures:
- key: approved-inventory-execution
  name:
    zh: 批准盘点执行约束
    en: Approved inventory execution constraints
  description:
    paragraphs:
    - zh: 将盘点任务绑定管理身份、目标主机、脚本或二进制信任和时间范围；在支持环境用 App Control 和受限 PowerShell 约束未批准代码及直接互操作能力，保留必要的受控容量查询。
      en: Bind inventory jobs to management identity, target host, script or binary trust, and time scope. Where supported,
        use App Control and constrained PowerShell to limit unapproved code and direct interop while preserving necessary
        controlled capacity queries.
  control_type: exposure-reduction
- key: attributable-storage-query-audit
  name:
    zh: 可归属存储查询审计
    en: Attributable storage-query audit
  description:
    paragraphs:
    - zh: 开启并外部保留进程、受保护脚本块、经配置 Linux exec 和 ESXi auth/shell 记录，记录采集规则与缺口，验证同一测试查询能回溯到主体与会话；只在确有输出采集时保存返回属性并标注结果级别。
      en: Enable and externally retain process, protected script-block, configured Linux exec, and ESXi auth/shell records,
        documenting collection rules and gaps. Verify that a test query traces back to its principal and session. Retain returned
        attributes and label result evidence only when output collection actually exists.
  control_type: detective-support
applications:
- use:
    paragraphs:
    - zh: 对本地存储发现，登记资产和容量盘点、备份及维修的主体和查询范围，收紧无需执行任意脚本的入口，并将实际存储查询与登记作业比较。Windows 非文件系统 PSDrive、ESXi 路径列表和云提供方资源清单按各自边界分流，避免用泛化磁盘告警替代对象判断。
      en: For Local Storage Discovery, register principals and query scope for asset and capacity inventories, backup, and
        repair. Constrain entry points that do not need arbitrary scripts and compare observed storage queries with registered
        work. Route non-filesystem Windows PSDrives, ESXi path listings, and cloud-provider resource inventory according to
        their boundaries rather than replacing object analysis with a generic disk alert.
  expected_effect:
    paragraphs:
    - zh: 未批准代码取得查询执行能力的机会减少，原生盘点外观更容易与具体操作者和作业范围核对。即使部分容量接口仍可被调用，调查也可更可靠地保留请求语义，并区分未知结果与证实返回。
      en: Unapproved code has fewer opportunities to obtain querying capability, and native inventory appearance becomes easier
        to check against a concrete operator and work scope. Even when some capacity interfaces remain callable, investigation
        can retain request semantics more reliably and distinguish unknown results from confirmed returns.
  limitations:
    paragraphs:
    - zh: 已获准进程和普通用户仍可能读取基本容量，ConstrainedLanguage 也不等于禁止 Get-PSDrive 或全部 CIM 查询。受信脚本和管理身份被盗后仍会保留正常外观；API、GUI、非交互管理和未采集输出形成盲区。审计有事件量与敏感信息成本，须先验证兼容性并控制访问和保留。
      en: Authorized processes and ordinary users may still read basic capacity, and ConstrainedLanguage does not prohibit
        Get-PSDrive or every CIM query. Stolen trusted scripts or management identities can retain normal appearance. APIs,
        GUIs, noninteractive management, and absent output collection create gaps. Audit has volume and sensitive-information
        costs requiring compatibility validation and controlled access and retention.
  target_ref: NJT-0232
