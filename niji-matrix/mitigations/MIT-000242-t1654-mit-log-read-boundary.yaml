schema_version: 2.0.0
type: mitigation
id: MIT-000242
name:
  zh: 日志读取权限与检索问责
  en: Log Read Authorization and Query Accountability
summary:
  zh: 将日志与调查反馈限定于获批读取者，并验证检索审计及独立审查链。
  en: Restrict logs and investigation feedback to approved readers while validating query auditing and independent review.
description:
  paragraphs:
  - zh: 日志既支持防守也暴露身份关系和响应信息，因此读取权需要单独治理，不能仅保护写入与删除。对敏感通道、云事件历史、集中 workspace 和导出副本分别限定读取身份与工作范围，保留必要收集器的正常访问，并将查询审计与其审查权限分离。该控制减少攻击者利用既有记录了解环境和响应的机会，不以减少日志采集为代价。
    en: Logs support defense while exposing identity relationships and response information, so read access requires governance
      separate from write or delete protection. Limit reader identities and work scope across sensitive channels, cloud history,
      centralized workspaces, and exported copies while preserving required collector access and separating query-audit review
      authority. This reduces opportunities to learn the environment and response through existing records without sacrificing
      log collection.
domains:
- enterprise
measures:
- key: reader-scope
  name:
    zh: 最小日志读取范围
    en: Least Log Read Scope
  description:
    paragraphs:
    - zh: 盘点敏感通道、集中日志与导出副本的有效读者，按职责限制通道访问描述符、日志平台 RBAC 和云历史读取权限；对广域调查授权设置到期和任务依据，以真实收集器身份回归验证读取与转发仍有效。
      en: Inventory effective readers of sensitive channels, centralized logs, and exported copies. Restrict channel access
        descriptors, logging-platform RBAC, and cloud-history permissions by duties; make broad investigation grants expire
        against approved work and regression-test reads and forwarding under real collector identities.
  control_type: exposure-reduction
- key: query-accountability
  name:
    zh: 读取审计与独立审查
    en: Read Auditing and Independent Review
  description:
    paragraphs:
    - zh: 预先开启适用的进程与查询审计，使用成功、失败、空返回和聚合查询验证入口、身份与结果字段，将审计送至读取者不能任意管理的审查范围。按任务核对高价值记录的检索，并记录未覆盖入口；不能用记录的完整性校验替代读取审计。
      en: Enable applicable process and query auditing in advance and validate entry paths, identities, and outcome fields
        with successful, failed, empty, and aggregate queries. Deliver audit into a review scope that readers cannot freely
        administer, reconcile high-value searches with work items, and record uncovered entry paths. Log-integrity checks
        do not substitute for read auditing.
  control_type: detective-support
applications:
- use:
    paragraphs:
    - zh: 针对本项，核对 Windows 敏感通道实际访问描述符和必要 Event Log Readers，撤回无职责身份的 cloudtrail:LookupEvents，并按 workspace 或表职责配置 Azure 日志读权。同步检查导出文件和历史副本的继承权限，验证对应查询审计；调查期间以受控身份和管理端执行检索，使攻击者难以借被盗普通账户实时读取驱逐反馈。
      en: For this technique, inspect actual Windows sensitive-channel access descriptors and necessary Event Log Readers
        membership, remove cloudtrail:LookupEvents from identities without a corresponding duty, and scope Azure log reads
        by workspace or table duties. Check inherited rights on exports and historical copies and validate corresponding query
        audits. Use controlled identities and administration endpoints during investigations to make real-time eviction feedback
        harder to obtain through stolen ordinary accounts.
  expected_effect:
    paragraphs:
    - zh: 缩小可调查的来源与记录范围，减少响应反馈暴露，并使异常查询具有可核查主体和任务上下文。借用合法工具仍可发生，但合法外观不再自动对应广域读权；独立审查可补充区分调查目的所需的上下文。
      en: Reduce accessible source and record scope and exposure of response feedback while attaching verifiable principal
        and task context to unusual queries. Legitimate utilities remain usable, but their appearance no longer automatically
        carries broad read access; independent review supplies context needed to distinguish investigation purpose.
  limitations:
    paragraphs:
    - zh: 已控制高权限读者、日志服务或离线副本的攻击者仍可能取得记录；RBAC 模式、继承和必要运维授权需要逐平台验证。权限收紧不能撤回已取得内容，启用审计不能补采历史读取，也不能保证覆盖所有服务间和本地 API 路径。错误描述符可能破坏收集，必须保留回归和恢复路径。
      en: An adversary controlling privileged readers, the logging service, or offline copies can still obtain records. RBAC
        modes, inheritance, and necessary operations grants need platform-specific validation. Tightening access cannot recall
        acquired content, and new auditing cannot backfill historical reads or guarantee all service-to-service and local
        API paths. Incorrect descriptors can disrupt collection, requiring regression and recovery paths.
  target_ref: NJT-0233
