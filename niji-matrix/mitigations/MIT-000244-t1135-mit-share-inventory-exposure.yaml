schema_version: 2.0.0
type: mitigation
id: MIT-000244
name:
  zh: 共享清单暴露面与枚举来源约束
  en: Share Inventory Exposure and Enumeration-Origin Constraints
summary:
  zh: 收缩不必要的共享服务入口和匿名清单能力，并保留枚举发起者及返回范围的独立观察。
  en: Reduce unnecessary share-service entry points and anonymous listing capability while independently observing enumeration
    origin and returned scope.
description:
  paragraphs:
  - zh: 本控制针对共享清单可被查询的机会，先清点业务需要的共享服务器、客户端来源和管理查询，再以主机防火墙/网络分段限制不必要的 SMB 路径，并在适用成员系统上治理匿名共享枚举。对必须保留的查询增加客户端和结果遥测，避免把内容读取 ACL
      或目录 ABE 当作共享清单的完整保护。
    en: This control reduces opportunities to query share inventories by first inventorying required share servers, client
      origins, and management queries, then restricting unnecessary SMB paths through host firewalls or segmentation and governing
      anonymous enumeration on applicable member systems. Add client and result telemetry for necessary queries rather than
      assuming content-read ACLs or directory ABE fully protect the share inventory.
domains:
- enterprise
measures:
- key: inventory-scoped-smb-paths
  name:
    zh: 按业务清单限制 SMB 来源与目的地
    en: Restrict SMB origins and destinations to business inventory
  description:
    paragraphs:
    - zh: 清点需要提供共享及接受客户端访问的系统，在源与目标主机及网络边界将 SMB 限于批准服务器和业务客户端组；关闭没有业务用途的共享服务入口。先以日志和代表性客户端验证，再逐步执行规则，维护域控制器、文件服务、集群及迁移的显式例外。
      en: Inventory systems that must offer shares or receive client access and restrict SMB at source hosts, destination
        hosts, and network boundaries to approved servers and business client groups. Remove share-service entry points without
        a business purpose. Validate with logs and representative clients before enforcement and maintain explicit exceptions
        for domain controllers, file services, clustering, and migration.
  control_type: exposure-reduction
- key: applicable-anonymous-enumeration-policy
  name:
    zh: 验证适用系统的匿名共享枚举限制
    en: Validate anonymous share-enumeration restrictions on applicable systems
  description:
    paragraphs:
    - zh: 在适用 Windows 客户端和成员服务器启用禁止匿名枚举 SAM 账户及共享的安全选项，并测试匿名与认证身份的实际结果；审查显式 ANONYMOUS LOGON 授权和旧信任业务依赖。记录域控制器不受该设置影响，不能把此设置作为域控制器或已认证身份的通用清单阻断。
      en: Enable the security option restricting anonymous enumeration of SAM accounts and shares on applicable Windows clients
        and member servers and test actual anonymous and authenticated results. Review explicit ANONYMOUS LOGON grants and
        legacy trust dependencies. Record that domain controllers are unaffected; the setting is not a universal inventory
        block for domain controllers or authenticated principals.
  control_type: preventive
- key: enumeration-origin-and-result-observation
  name:
    zh: 保留枚举来源和结果观察
    en: Retain enumeration-origin and result observation
  description:
    paragraphs:
    - zh: 在共享管理端启用含参数的进程审计或受支持执行传感器，登记批准查询任务的 owner、目标范围和有效期；对重点服务器试点能够区分请求与响应的枚举观测。以成功、空结果、拒绝和分页测试校验字段，独立保留证据并监测事件丢失，不把 5140/5145
        的存在当成完整清单遥测。
      en: Enable process auditing with arguments or supported execution telemetry on share-management clients and register
        query-job owners, scope, and expiry. Pilot enumeration observation that distinguishes requests from responses on priority
        servers. Validate fields through successful, empty, denied, and paginated queries, retain evidence independently,
        and monitor event loss without equating events 5140 or 5145 with full inventory telemetry.
  control_type: detective-support
applications:
- use:
    paragraphs:
    - zh: 对网络共享发现，以共享服务器及来源职责清单压缩可查询的远端入口，在适用成员系统验证匿名清单限制，并把必须保留的枚举关联到客户端执行者和批准任务。对本地 net share 或 sharing 列表保留端点观察，因为远端 SMB
        分段不能阻止已在共享服务器上的本地配置查询。
      en: For Network Share Discovery, reduce remotely queryable entry points through server and origin-role inventories,
        validate anonymous listing restrictions on applicable member systems, and join necessary enumeration to client executors
        and approved work. Retain endpoint observation for local net share or sharing listings because remote SMB segmentation
        does not prevent local configuration queries on an already-compromised share server.
  expected_effect:
    paragraphs:
    - zh: 不必要的主机间路径被切断，适用系统的未认证清单机会减少；允许路径上的异常原生命令或返回清单能够与正常管理职责比较，攻击者可能需要另一个获准来源或有效身份。该控制降低发现机会并提高意图区分能力，不等于阻止所有共享名暴露或文件内容获取。
      en: Unnecessary inter-host paths are removed and unauthenticated listing opportunities shrink on applicable systems.
        Abnormal native queries or returned inventories on permitted paths become comparable with administrative duties, potentially
        requiring another permitted origin or valid identity. The control reduces discovery opportunities and improves intent
        classification without eliminating every exposure of share names or preventing content acquisition.
  limitations:
    paragraphs:
    - zh: 已认证且来自允许客户端的攻击者仍可使用其权限允许的查询；成员系统匿名选项对域控制器无效，并可能影响单向信任等旧业务。严格防火墙例外需要维护且会影响共享业务；加密和本地调用可失去网络结果观察。文件与目录权限负责后续访问，不能由本控制的成功替代验证。
      en: Authenticated adversaries on permitted clients can still issue queries allowed by their context. The member-system
        anonymous restriction does not affect domain controllers and can disrupt legacy one-way-trust workflows. Tight firewall
        exceptions require maintenance and can affect sharing; encryption and local calls can remove network result visibility.
        File and directory rights govern later access and require separate verification.
  target_ref: NJT-0235
