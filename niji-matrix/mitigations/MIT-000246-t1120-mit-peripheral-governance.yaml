schema_version: 2.0.0
type: mitigation
id: MIT-000246
name:
  zh: 外围设备发现调用与反馈接收治理
  en: Peripheral-Discovery Call and Feedback-Receiver Governance
summary:
  zh: 限制未批准设备盘点代码，并保留设备状态、查询和反馈接收者的不同证据层级。
  en: Constrain unapproved device-inventory code and retain distinct evidence levels for device state, queries, and feedback
    receivers.
description:
  paragraphs:
  - zh: 外设身份和变更反馈是正常应用需要的信息，无法通过禁用一种工具普遍隐藏。控制着重减少不必要的代码执行、为长期接收者建立责任主体，并验证状态日志与查询证据的连接。设备安装限制可以减少可利用外设，却不等于隐藏既有设备或阻断所有只读查询，因此不作为本控制的主要承诺。
    en: Peripheral identity and change feedback are necessary to ordinary applications and cannot generally be hidden by disabling
      one utility. Controls reduce unnecessary code execution, assign responsibility for long-lived receivers, and validate
      links between state logs and query evidence. Installation restrictions can reduce usable peripherals but do not hide
      existing devices or block every read query, so they are not this control's primary promise.
domains:
- enterprise
measures:
- key: approved-device-query-execution
  name:
    zh: 批准设备查询执行
    en: Approved device-query execution
  description:
    paragraphs:
    - zh: 使用应用和脚本信任规则约束未批准的设备盘点程序，为必要支持工具绑定主体、主机角色、查询设备范围和期限。签名或系统工具路径不是无限期授权；对受信应用内注入仍需另有执行完整性控制。
      en: Use application and script trust rules to constrain unapproved device-inventory programs and bind necessary support
        tools to principal, host role, device scope, and expiry. A signature or system-tool path is not indefinite authorization.
        Injection into trusted applications still requires separate execution-integrity controls.
  control_type: exposure-reduction
- key: receiver-lifetime-accountability
  name:
    zh: 反馈接收生命周期问责
    en: Feedback-receiver lifetime accountability
  description:
    paragraphs:
    - zh: 登记批准的长期设备监听服务、主体、设备职责和版本，保留启动、停止及授权变更；在需要进程内可见性的端点验证调用与消息采集，并在注销或遥测中断时更新状态。不将系统广播接收普遍禁止，也不以签名白名单覆盖调用来源异常。
      en: Register approved persistent device-listening services, principals, device roles, and versions and retain start,
        stop, and authorization changes. Validate call and message collection on endpoints requiring in-process visibility
        and update state on deregistration or trace interruption. Do not universally prohibit system-broadcast reception or
        let signature allowlists suppress anomalous call provenance.
  control_type: detective-support
- key: state-and-result-evidence-validation
  name:
    zh: 状态与结果证据验证
    en: State and result evidence validation
  description:
    paragraphs:
    - zh: 开启并验证必要的 PnP 活动和进程或 Linux 执行采集，分别标记设备识别、查询尝试、反馈收到和属性返回。用已知设备的接入、移除、查询及失败测试确认归属，外部保留最小化标识和采集健康；设备序列号与位置按敏感资产数据保护。
      en: Enable and validate necessary PnP activity and process or Linux execution collection, labeling recognition, query
        attempts, feedback reception, and property returns separately. Test known-device arrival, removal, queries, and failures
        for attribution, externally retaining minimized identifiers and collector health. Protect serial and location data
        as sensitive asset information.
  control_type: detective-support
applications:
- target_ref: NJT-0238
  use:
    paragraphs:
    - zh: 将设备资产、会议与外设支持查询绑定批准主体和实际参数范围，收紧无需盘点能力的任意脚本入口；同时保留在场、历史和启用接口状态的区别。显式工具命令与专用调用追踪各按真实覆盖启用，避免用驱动清单或 6416 代替设备查询证据。
      en: Bind device-asset, conferencing, and peripheral-support queries to approved principals and actual argument scope,
        constraining arbitrary-script entry points without inventory needs. Preserve distinctions among present, historical,
        and enabled-interface states. Enable explicit-command and dedicated-call collection according to verified coverage
        rather than substituting driver inventories or 6416 for query evidence.
  expected_effect:
    paragraphs:
    - zh: 未批准代码更难取得设备盘点执行机会，正常管理外观更易与实际职责核验；调查能够保留查询和设备结果等级，减少将历史记录或设备存在误解为内容获取的机会。
      en: Unapproved code has fewer opportunities to execute device inventories, and ordinary management appearance becomes
        easier to verify against actual responsibilities. Investigations retain query and device-result levels, reducing misinterpretation
        of historical records or device presence as content acquisition.
  limitations:
    paragraphs:
    - zh: 这些措施不能隐藏普通调用者可读的设备元数据，合法工具和受信进程仍可被滥用。专用追踪有兼容性、隐私与事件量成本，基本进程审计缺少返回值；禁用或移除外设会影响业务而不能阻止残留历史记录查询。
      en: These measures do not hide metadata readable by ordinary callers, and legitimate tools and trusted processes remain
        abusable. Dedicated tracing has compatibility, privacy, and event-volume costs, while basic process audit lacks returns.
        Disabling or removing peripherals can affect business without preventing queries of remaining historical records.
- target_ref: NJS-0238-001
  use:
    paragraphs:
    - zh: 将长期设备接收者按进程来源、主体、版本及设备职责登记，保留生命周期而非只统计重复命令；在高风险端点验证默认广播与显式注册两种接收路径。对未批准监听先保存接收和设备事实证据，再按响应策略隔离或停止异常进程，不通过停用全局 PnP
        服务阻断所有通知。
      en: Register persistent receivers by process provenance, principal, version, and device role, retaining lifetimes rather
        than counting repeated commands alone. Validate both default broadcasts and explicit registration on high-risk endpoints.
        Preserve receiving and device-fact evidence before isolating or stopping unauthorized listeners under response policy
        rather than disabling global PnP services to block all notifications.
  expected_effect:
    paragraphs:
    - zh: 将稀疏处理重新连接到持续接收上下文，降低跨长驻生命周期重构的成本，并缩小未批准通知驱动发现的执行空间。安静阶段也能保留已确认的接收状态，不依赖必须再次出现枚举峰值。
      en: Sparse handling reconnects to its persistent receiving context, reducing reconstruction cost across long lifetimes
        and narrowing execution space for unauthorized notification-driven discovery. Confirmed receiving state remains available
        during quiet periods without requiring a later enumeration peak.
  limitations:
    paragraphs:
    - zh: 默认广播通常不能按任意应用单独禁止，批准监听器内部的注入和进程间转交仍会弱化归属。生命周期中断后的状态必须未知；接收成功不保证取得设备属性，更不能证明取得内容。Linux 命令覆盖与 Windows 专用追踪均需在部署环境先验收。
      en: Default broadcasts usually cannot be prohibited per arbitrary application, while injection into approved listeners
        and interprocess handoff weaken attribution. State after trace interruption must remain unknown. Successful reception
        does not guarantee device properties or content. Both Linux command coverage and Windows dedicated tracing need acceptance
        in the deployment environment.
