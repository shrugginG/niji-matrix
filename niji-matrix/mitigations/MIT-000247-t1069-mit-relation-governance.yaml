schema_version: 2.0.0
type: mitigation
id: MIT-000247
name:
  zh: 组关系读取权限与调查来源治理
  en: Group Relationship Read Entitlement and Survey-Origin Governance
summary:
  zh: 限制非必要组关系读取和远程 SAM 暴露，并为合法治理身份建立按关系范围核验的读取问责。
  en: Limit unnecessary group-relationship reads and remote SAM exposure while establishing scope-verified read accountability
    for legitimate governance identities.
description:
  paragraphs:
  - zh: 组关系是系统运行需要的信息，控制重点是减少额外读取能力和远程调查入口，并使必要读取可以归属到 owner、来源和任务。SAMRPC 访问控制与云应用权限必须分别配置，不能把禁止成员变更或保护口令当作读取保护。该控制增加受陷身份扩大调查的成本，但不能消除所有正常可读关系。
    en: Systems need group relationships, so control focuses on excess reading capability and remote survey entry points while
      attributing necessary reads to owners, origins, and work. SAMRPC access control and cloud-application permissions require
      separate configuration; preventing membership changes or protecting passwords is not read protection. This control increases
      the cost of broader surveys by compromised identities without eliminating every legitimately readable relationship.
domains:
- enterprise
measures:
- key: version-aware-samrpc-scope
  name:
    zh: 按版本限制远程 SAM 调用主体
    en: Scope remote SAM callers by deployed version
  description:
    paragraphs:
    - zh: 盘点实际 Windows 版本与 DC/非 DC 角色，以 RestrictRemoteSam 审计模式核实 Exchange、身份传感器及其他必要服务后，配置允许的远程调用主体并测试业务。不要仅从旧接口文档的认证用户描述推定现有远程权限，也不要将该控制误认为
        LDAP 读取限制。
      en: Inventory deployed Windows versions and DC versus non-DC roles, use RestrictRemoteSam audit mode to verify Exchange,
        identity sensors, and other required services, then configure allowed remote callers and test operations. Do not infer
        current remote rights from old API remarks about authenticated users or treat the control as an LDAP-read restriction.
  control_type: exposure-reduction
- key: cloud-relationship-read-least-privilege
  name:
    zh: 审查云关系读取权限与有效期
    en: Review cloud relationship-read permissions and expiry
  description:
    paragraphs:
    - zh: 为需要列组、成员和角色分配的应用分别登记 owner、必要关系范围与凭据有效期，使用接口支持的最低读取权限并回收过宽或过期授权。隐藏成员等额外权限按实际业务审批；Graph 应用权限、委派用户角色与 IAM 请求授权分别验证，不能假定同名只读角色提供相同隔离。
      en: Register owners, required relationship scope, and credential expiry separately for applications listing groups,
        members, and role assignments. Use the API's supported least read privilege and remove broad or expired grants. Approve
        additional capabilities such as hidden-membership reads for actual business need, and validate Graph application permissions,
        delegated-user roles, and IAM authorization independently rather than assume identical isolation from similarly named
        read-only roles.
  control_type: exposure-reduction
- key: relationship-read-accountability
  name:
    zh: 验证关系读取审核与批准任务基线
    en: Validate relationship-read auditing and approved-work baselines
  description:
    paragraphs:
    - zh: 启用并测试所需 4798/4799 审核，对选定目录成员属性验证 SACL 与 4662，保留实际 Graph activity 和 IAM 读管理请求。把治理作业绑定身份、来源、关系范围、owner 和到期时间，监测日志缺口与容量，保持读取证据和成员变更证据分开。
      en: Enable and test the required 4798/4799 auditing, validate SACLs and 4662 for selected directory membership properties,
        and retain actual Graph activity and IAM read-management requests. Bind governance work to identity, origin, relationship
        scope, owner, and expiry; monitor log gaps and capacity while keeping read evidence separate from membership-change
        evidence.
  control_type: detective-support
applications:
- target_ref: NJT-0239
  use:
    paragraphs:
    - zh: 对权限组发现，先盘点实际组关系读取路径和业务必要主体，再分面收回额外远程 SAM 与云读取权，同时为高价值组的读取保留可核实来源和工单。目录和云的正常可读范围不可统一关闭，应从无 owner 的额外权限与管理来源开始整改。
      en: For Permission Groups Discovery, inventory actual relationship-read paths and necessary principals, then remove
        excess remote SAM and cloud read rights on their respective planes while preserving verifiable origins and work records
        for reads of valuable groups. Legitimately readable directory and cloud scope cannot be uniformly disabled; begin
        with ownerless excess permissions and management origins.
  expected_effect:
    paragraphs:
    - zh: 可供受陷低权身份直接远程调查的关系范围减少，借用治理身份和正常接口的异常读取更易归属。即使必须保留读取，按范围和有效任务核验也提高滥用长期只读应用或管理角色的识别能力。
      en: The relationship scope directly surveyable remotely by compromised low-privilege identities shrinks, and abnormal
        reads borrowing governance identities and ordinary interfaces become easier to attribute. Where reads must remain
        available, scope and current-work verification improve recognition of abuse of long-lived read applications or administrative
        roles.
  limitations:
    paragraphs:
    - zh: SAMRPC 限制不阻止 LDAP、本地令牌或中央策略读取，错误收紧会破坏传感器与业务；云低权限主体仍可能依法读取部分组关系。必要治理身份被盗、已有关系副本及未收集日志继续造成风险，控制不能追回已读信息或保证阻止后继访问。
      en: SAMRPC restrictions do not prevent LDAP, local-token, or central-policy reads, and overly restrictive settings can
        break sensors and operations. Low-privilege cloud principals can still legitimately read some relationships. Stolen
        necessary governance identities, existing copies, and uncollected logs remain risks, and the control cannot retract
        acquired information or guarantee prevention of later access.
