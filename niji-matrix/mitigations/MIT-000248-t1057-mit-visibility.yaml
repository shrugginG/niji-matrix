schema_version: 2.0.0
type: mitigation
id: MIT-000248
name:
  zh: 进程视图最小暴露与查询来源问责
  en: Least Process-View Exposure and Query-Origin Accountability
summary:
  zh: 收缩不必要的进程详情与管理读取权限，并把实际查询绑定准确主体、任务和进程生命周期。
  en: Reduce unnecessary process-detail and management-read authority and bind actual inquiries to exact principals, tasks,
    and process lifetimes.
description:
  paragraphs:
  - zh: 进程清单是系统诊断和安全产品依赖的基础事实，无法普遍向已获准代码隐藏。控制目标是在不破坏运行可观测性的前提下减少无关主体看到的详情，并使系统工具和驻留代理的查询均可追溯；限制读取、约束执行与改善观察分别发挥作用，不能相互冒充。
    en: Process inventory is a basic fact needed by diagnostics and security products and cannot be universally hidden from
      authorized code. Controls reduce details exposed to unrelated principals while making inquiries from utilities and resident
      agents traceable. Read restriction, execution constraints, and improved observation perform distinct roles and cannot
      substitute for one another.
  - zh: Windows重点核对进程查询权限、调试特权和WMI命名空间授权；Linux可在验证兼容性后使用procfs的hidepid和受控例外组。对驻留查询，查询层证据与长期进程身份的保留是直接控制面，而非仅阻断tasklist名称。
    en: On Windows, review process-query rights, debug privilege, and WMI namespace authorization. On Linux, validated procfs
      hidepid settings and controlled exception groups can reduce exposure. For resident inquiries, query-layer evidence and
      long-lived process identities are direct control surfaces rather than only blocking the tasklist name.
domains:
- enterprise
measures:
- key: limit-process-detail
  name:
    zh: 限制不必要的进程视图与详情权限
    en: Limit unnecessary process views and detailed authority
  description:
    paragraphs:
    - zh: 审计并撤销非必要SeDebugPrivilege和跨主体进程详情访问，按任务管理WMI命名空间读取与Remote Enable；Linux按角色评估hidepid=1或2及gid例外，不以默认全局进程可见性代替业务需求分析。先验证诊断、监控和安全代理兼容性。
      en: Audit and remove unnecessary SeDebugPrivilege and cross-principal process-detail access. Manage WMI namespace read
        and Remote Enable rights by task. On Linux, assess hidepid=1 or 2 and gid exceptions by role rather than assuming
        global process visibility is required. Validate diagnostics, monitoring, and security-agent compatibility first.
  control_type: exposure-reduction
- key: approved-inquiry-carriers
  name:
    zh: 约束批准的调查执行体
    en: Constrain approved inquiry carriers
  description:
    paragraphs:
    - zh: 登记盘点和支持任务的owner、主体、主机、可用脚本与查询范围；在适用Windows环境以系统应用控制约束未批准代码和脚本能力，核对驻留代理的扩展及管理入口。受信宿主或允许的脚本仍需按实际查询审查。
      en: Register inventory and support owners, principals, hosts, scripts, and query scopes. Where applicable, use system
        application control to constrain unapproved code and script capabilities, and review resident-agent extensions and
        management entry points. Trusted hosts and allowed scripts still require review of actual inquiries.
  control_type: exposure-reduction
- key: query-origin-lifetime-retention
  name:
    zh: 保留查询来源与进程生命周期
    en: Retain query origins and process lifetimes
  description:
    paragraphs:
    - zh: 预先部署含参数的进程审计与适用脚本日志，在重点Windows主机验证WMI Trace客户端字段和长生命周期关联。分别验证请求、拒绝、空集和部分结果，将证据送入查询者不能任意修改的保留范围；需要结果时另行部署经验证采集，不用授权事件充当结果。
      en: Predeploy process auditing with arguments and applicable script logs. On priority Windows hosts, validate WMI Trace
        client fields and long-lived process joins. Test requests, denial, empty sets, and partial results separately and
        retain evidence beyond the querier’s arbitrary modification. Deploy validated capture when results are needed rather
        than using authorization events as results.
  control_type: detective-support
applications:
- target_ref: NJT-0240
  use:
    paragraphs:
    - zh: 对进程发现，按主机职责保留必要监控，缩小不相关用户的进程详情和远程WMI读取范围，并登记支持查询的目标与期限。查询事件同批准作业比较时保留请求级别，未取得结果不推断全量进程暴露。
      en: For Process Discovery, preserve monitoring required by host duties while narrowing unrelated users’ process-detail
        and remote-WMI read scope. Register support targets and expiry. Compare inquiries with approved work at the request
        level, without inferring complete process exposure when results are unavailable.
  expected_effect:
    paragraphs:
    - zh: 不必要的跨用户进程细节和远程调查机会减少，借用系统工具的查询更容易与具体任务核验；Linux进程目录的可见范围可按配置实际收缩。
      en: Unnecessary cross-user process details and remote-survey opportunities decrease, and borrowed utility inquiries
        become easier to check against concrete work. Linux process-directory visibility can be reduced according to effective
        configuration.
  limitations:
    paragraphs:
    - zh: 普通用户和合法程序仍可能得到基础进程存在性，Windows详情权限不普遍阻断进程列表；hidepid也不能阻止同用户、特权主体或其他存在性侧信号。应用控制并不禁止所有Get-Process，审计还增加敏感参数与运维成本。
      en: Ordinary users and legitimate programs may still obtain basic process existence. Windows detail rights do not universally
        block lists, and hidepid does not stop same-user or privileged access or every existence side signal. Application
        control does not prohibit every Get-Process call, and auditing carries sensitive-argument and operational costs.
- target_ref: NJS-0240-001
  use:
    paragraphs:
    - zh: 对驻留上下文内联进程调查，不把“没有新工具启动”作为放行依据。将允许的驻留代理和扩展绑定实际职责，在Win32_Process读取面保留客户端主机、PID实例和操作标识，追溯本次查询来自哪项任务，并为长期运行体保留早期创建历史。
      en: For Resident-Context Inline Process Survey, do not use “no new utility launch” as an allow condition. Bind approved
        resident agents and extensions to actual duties. At the Win32_Process read surface, retain client host, PID instance,
        and operation identifiers to recover the task behind each inquiry, including earlier birth history for long-running
        agents.
  expected_effect:
    paragraphs:
    - zh: 防守观察从每任务执行器扩展到真实查询客户端，减少生命周期承载变化造成的归属断点。可验证结果采集能进一步确定暴露的字段和实例，使攻击者不能只靠省去工具进程让调查失去语义。
      en: Observation extends from per-task executors to actual query clients, reducing attribution gaps caused by carrier-lifetime
        choices. Validated result capture can establish exposed fields and instances, preventing omission of a utility process
        alone from stripping the inquiry of meaning.
  limitations:
    paragraphs:
    - zh: 这项应用主要改善识别与归属，不能保证阻止已控制的受信进程读取其获准视图，也不能让App Control自动检查任意BOF缓冲区。非WMIAPI、Trace缺失、跨机客户端不可归属或缺少结果采集仍是盲区；需要容量与隐私评估。
      en: This application chiefly improves identification and attribution. It cannot guarantee blocking an already controlled
        trusted process from its authorized view or make App Control inspect arbitrary BOF buffers automatically. Non-WMI
        APIs, missing Trace, unresolved remote clients, and absent result capture remain gaps, requiring capacity and privacy
        assessment.
