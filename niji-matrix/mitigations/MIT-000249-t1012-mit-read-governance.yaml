schema_version: 2.0.0
type: mitigation
id: MIT-000249
name:
  zh: Registry 读取暴露与独立观察治理
  en: Registry Read-Exposure and Independent-Observation Governance
summary:
  zh: 针对高价值配置收紧读取与副本暴露，校验远程访问需求，并让读取观察独立于命令工具启动。
  en: Constrain reads and copies of high-value configuration, verify remote-access needs, and observe reads independently
    of utility launches.
description:
  paragraphs:
  - zh: Registry 是系统与应用共享配置面，不能整体禁止读取。该控制按键 owner、角色和实际读取需求管理配置暴露，对可限制的分支及导出文件实行最小读取权，并明确远程 Registry 的批准用途。对业务必须广泛可读的配置，以验证过的审计和有界跟踪恢复观察，而不是承诺通过
      ACL 隐藏全部环境事实。
    en: The Registry is a shared configuration surface whose reads cannot be prohibited wholesale. This control manages exposure
      by key owner, role, and genuine read requirements, applying least-read authority to restrictable branches and exports
      while defining approved Remote Registry use. For configuration that must remain broadly readable, validated auditing
      and bounded tracing restore observation rather than promise that ACLs hide all environmental facts.
domains:
- enterprise
measures:
- key: scoped-read-authority
  name:
    zh: 按配置对象收紧读取与副本权
    en: Constrain read and copy authority by configuration object
  description:
    paragraphs:
    - zh: 为高价值的一般配置键记录 owner、业务读取者和继承关系，区分 QueryValue、EnumerateSubKeys 与写入权；在兼容性验证后只为需要者保留读取。导出、备份和镜像 hive 文件也按文件读取者及保存位置治理，因为取得可读离线文件后不能依赖原活动键的
        ACL 继续保护其内容。不得把所有 HKCU 或 HKLM 设为拒绝读取。
      en: Record owner, business readers, and inheritance for high-value general-configuration keys, separating QueryValue
        and EnumerateSubKeys from writes. After compatibility validation retain reads for necessary principals. Govern exported,
        backup, and image hives by file readers and storage location, since the original active-key ACL cannot be relied upon
        once a readable offline file is obtained. Do not deny reads across all of HKCU or HKLM.
  control_type: exposure-reduction
- key: remote-query-admission
  name:
    zh: 限定远程 Registry 的批准访问面
    en: Limit the approved Remote Registry access surface
  description:
    paragraphs:
    - zh: 清点依赖 Remote Registry 的管理任务，按主机角色、管理来源和身份保留必要可达性及服务使用；无业务需要时收缩该接口，变更前验证监控、备份和支持流程。服务不可用或远程调用失败只说明该路径受阻，不能说明本地、代理或副本读取被阻止。
      en: Inventory management tasks depending on Remote Registry and preserve necessary service use and reachability by host
        role, management source, and identity. Reduce the interface where unnecessary after validating monitoring, backup,
        and support dependencies. An unavailable service or failed remote call blocks that path rather than local, agent-mediated,
        or copy-based reads.
  control_type: exposure-reduction
- key: read-observation-independent-of-executor
  name:
    zh: 独立于查询执行器验证读取观察
    en: Validate read observation independently of the query executor
  description:
    paragraphs:
    - zh: 对选定分支部署匹配读取权限和主体的审核策略及 SACL，并用取值和枚举分别验证；事件远程保留并维护覆盖有效期。重点主机或响应阶段按预算增加操作跟踪，以真实进程实例关联读取。覆盖健康、丢失与不支持的结果层必须显式记录，不以写入日志或新
        reg.exe 缺失充当读取证据。
      en: Deploy audit policy and SACLs matching read rights and principals on selected branches, testing value reads and
        enumeration separately. Retain events remotely and maintain coverage validity. Add budgeted operation tracing on priority
        hosts or during response and associate reads with true process instances. Explicitly record health, loss, and unsupported
        result layers instead of substituting write logs or absent reg.exe for read evidence.
  control_type: detective-support
applications:
- target_ref: NJT-0241
  use:
    paragraphs:
    - zh: 对一般环境性 Registry 查询，先识别确需保护且业务可限制的配置分支，调整键读取 ACL 和副本文件读权，审核远程管理需求，再让命令意图与已审计的读取权限关联到批准任务。将专门的软件、身份和策略查询交给相应控制 owner，避免因路径重叠重复管控。
      en: For general environmental Registry queries, identify configuration branches needing protection where business permits
        restriction, adjust key-read ACLs and copied-file read authority, review remote-management needs, and associate command
        intent and audited read rights with approved tasks. Route dedicated software, identity, and policy queries to their
        control owners rather than duplicate controls because paths overlap.
  expected_effect:
    paragraphs:
    - zh: 不必要的读取者及可取得副本的主体减少，高价值配置探索更容易关联到具体身份和任务。无法限制的配置仍保持可用，但其异常读取获得明确的观察范围；攻击者必须使用仍被允许的主体或扩大权限，后续调查也能区分意图、访问权使用和内容取得。
      en: Fewer unnecessary readers and principals can obtain copies, and high-value configuration exploration becomes attributable
        to identities and work. Unrestrictable configuration remains available but gains a defined observation scope for unusual
        reads. An adversary must use an allowed principal or expand authority, and investigation can distinguish intent, exercised
        rights, and acquired content.
  limitations:
    paragraphs:
    - zh: 许多配置必须由普通用户和应用读取，严格 ACL 会破坏启动、兼容性或支持工具；攻击者控制合法读取者后仍可取得内容。离线副本受文件访问和采集路径控制，原键 SACL 不自动跟随；审核可能高噪声，且权限事件不能证明具体返回值。该控制不替代凭据保护，也不直接恢复持久状态或防御设置。
      en: Many configurations must remain readable to users and applications, and strict ACLs can break startup, compatibility,
        or support tools. Control of a legitimate reader still permits access. Offline copies depend on file-access and acquisition-path
        controls, without automatic inheritance of the original key's SACL. Auditing can be noisy, and rights events do not
        prove specific returned values. This control neither replaces credential protection nor directly repairs durable state
        or defensive settings.
- target_ref: NJS-0241-001
  use:
    paragraphs:
    - zh: 对进程内注册表查询，在相同令牌、键、值和视图下比较驻留内联与新工具路径，确认选定读取审计或专用 trace 两者都能关联到真实读取者；控制例外绑定承载进程的业务角色和对象范围。不要只拦截 reg.exe，读取权限制和原语观察须对进程内代码同样有效。
      en: For In-Process Registry Query, compare resident inline and new-utility paths under the same token, key, value, and
        view, verifying that selected read auditing or dedicated tracing associates both with the true reader. Bind exceptions
        to the carrier's business role and object scope. Restricting reg.exe alone is insufficient; read authority and primitive-level
        observation must apply equally to in-process code.
  expected_effect:
    paragraphs:
    - zh: 防守能力不再以每次查询创建新执行器为前提，省去命令进程只能减少一类痕迹，不能同时取消已验证的键读取记录。攻击者即使利用已有进程，也须面对同样的读取权限和按进程角色解释的访问轨迹。
      en: Defensive visibility no longer presupposes a new executor for each query. Omitting command processes reduces one
        trace class without removing validated key-read records. Even through an existing process, an adversary faces the
        same read rights and access traces interpreted against process role.
  limitations:
    paragraphs:
    - zh: 活动键审计覆盖不自动延伸到离线解析，承载进程本身合法且读权宽泛时只能靠上下文区分目的。专用跟踪增加性能、存储和运维成本；读取审计不直接识别 BOF、控制主体或返回内容。已控制的高权主体还可能影响传感器，应把覆盖异常作为调查对象而非假设审计永远完整。
      en: Active-key auditing does not automatically extend to offline parsing, and a legitimate carrier with broad read authority
        requires contextual purpose analysis. Dedicated tracing adds performance, storage, and operational cost. Read auditing
        does not directly identify a BOF, controller, or returned content. A compromised privileged principal may also affect
        sensors, making coverage anomalies investigative evidence rather than grounds to assume auditing is always complete.
