schema_version: 2.0.0
type: mitigation
id: MIT-000252
name:
  zh: 位置权限与释放审计
  en: Location Permission and Release Auditing
summary:
  zh: 按用途约束位置权限和结果保留，并审计实际位置数据释放。
  en: Constrain location permission and result retention by purpose and audit actual release of location data.
description:
  paragraphs:
  - zh: 本控制治理位置服务授权及其实际数据释放。组织应限制不必要位置权限，定期撤销授权，并以最少敏感数据保存请求、许可状态和结果阶段。普通语言或时区读取和外部控制端对已见地址的解释不受浏览器位置许可约束，须通过各自观察与通信控制处理。
    en: This control governs position-service permission and actual data release. Organizations should restrict unnecessary
      location permissions, revoke grants periodically, and retain minimal sensitive data for request, permission, and result
      stages. Ordinary language or time-zone reads and external controller interpretation of observed addresses are not governed
      by browser location permission and require their respective observation and communication controls.
domains:
- enterprise
measures:
- key: location-permission-scope
  name:
    zh: 收敛位置权限和保留
    en: Limit Location Permission and Retention
  description:
    paragraphs:
    - zh: 仅向明确业务来源授予浏览器或平台位置访问，定期撤销不再需要的授权，采用适当的会话有效期与 Permissions-Policy，并最小化位置结果保留。逐平台验证拒绝和撤销后的结果，不把这项权限控制套用到普通语言和时区读取。
      en: Grant browser or platform location access only to explicit business origins, revoke unneeded permissions, apply
        suitable session lifetimes and Permissions-Policy, and minimize retained results. Validate denial and revocation on
        each platform without extending these controls to ordinary language or time-zone reads.
  control_type: exposure-reduction
- key: location-release-accountability
  name:
    zh: 位置释放阶段审计
    en: Location Release Stage Auditing
  description:
    paragraphs:
    - zh: 为获授权的位置服务记录调用来源、权限状态、请求时间、服务状态与最小必要结果，按位置数据敏感性保护并限定保留。分别验证拒绝、撤销、超时、缓存和成功返回；不能从普通进程或 DNS 日志自动补出位置结果。
      en: For authorized position services record caller origin, permission state, request time, service state, and minimal
        necessary result with sensitivity-appropriate protection and retention. Validate denial, revocation, timeout, caching,
        and successful returns separately; ordinary process or DNS logs cannot supply missing location results.
  control_type: detective-support
applications:
- target_ref: NJT-0245
  use:
    paragraphs:
    - zh: 对确有设备位置需求的业务实行来源限定、最小授权和定期撤销，部署经过验证的许可与结果阶段审计。可疑调用结合来源、运行进程和实际用途调查；普通语言设置保持业务所需，不通过改动设置制造位置保护假象。
      en: For businesses that need device position, restrict origins, minimize permission, revoke grants periodically, and
        deploy validated permission and result-stage auditing. Investigate suspicious calls through origin, process, and actual
        purpose while retaining ordinary language settings for business rather than creating an appearance of protection through
        configuration changes.
  expected_effect:
    paragraphs:
    - zh: 减少非业务位置数据释放并区分拒绝、超时、缓存与实际返回，使位置授权和结果读取能够追责。
      en: Reduce nonbusiness location-data release, distinguish denial, timeout, cache, and actual returns, and make position
        permission and result access accountable.
  limitations:
    paragraphs:
    - zh: 浏览器位置权限不限制普通语言或时区读取，也不限制控制端使用已见公网地址查询 GeoIP。被用户误授予或被批准来源滥用的权限仍有风险，精确位置审计本身还需敏感数据最小化与受限保留。
      en: Browser location permission restricts neither ordinary language or time-zone reads nor controller GeoIP lookup using
        an already observed public address. Mistaken grants and abuse by approved origins remain risks, while precise-location
        auditing itself requires sensitive-data minimization and restricted retention.
