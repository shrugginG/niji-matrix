schema_version: 2.0.0
type: mitigation
id: MIT-000253
name:
  zh: 网络状态查询载体与视图治理
  en: Govern Network-State Query Carriers and Views
summary:
  zh: 约束网络状态调查代码来源和可见视图，并保留能够识别查询者的诊断证据。
  en: Constrain network-state inquiry code provenance and visible views while retaining diagnostic evidence identifying readers.
description:
  paragraphs:
  - zh: 接口配置与连接状态是合法诊断和网络软件需要的基础信息。本缓解分别治理允许执行的调查代码、具体诊断作业和工作负载可见网络视图，减少未知载体取得广域网络画像的机会，并通过受保护的请求审计保留真实查询者。配置与连接采用各自的参数、返回合同和目标应用；移除显示工具不能代替这些控制，也不阻止获准程序读取其可见状态。
    en: Interface configuration and connection state are basic information for legitimate diagnostics and networking software.
      This mitigation separately governs executable inquiry code, concrete diagnostic jobs, and workload-visible network views,
      reducing opportunities for unknown carriers to obtain broad network profiles while preserving actual readers through
      protected request auditing. Configuration and connection reads retain distinct parameters, return contracts, and target
      applications. Removing display utilities cannot substitute for these controls or prevent approved programs from reading
      their visible state.
domains:
- enterprise
measures:
- key: inquiry-code-and-job-provenance
  name:
    zh: 调查代码和作业来源约束
    en: Constrain inquiry code and job provenance
  description:
    paragraphs:
    - zh: 使用平台支持的应用控制限制未批准可执行文件、模块与脚本进入诊断工作流，批准项绑定实际代码身份、资产职责和有效期。保留批准排障入口而不全局信任签名工具；对高价值主机采用审计模式验证后再收敛执行权限。
      en: Use platform-supported application control to constrain unapproved executables, modules, and scripts in diagnostic
        workflows, binding approvals to actual code identity, asset duty, and validity. Preserve approved troubleshooting
        entry points without trusting signed utilities globally and validate in audit mode before tightening execution on
        high-value hosts.
  control_type: preventive
- key: workload-network-view
  name:
    zh: 工作负载网络状态视图隔离
    en: Isolate workload network-state views
  description:
    paragraphs:
    - zh: 在支持网络命名空间且业务允许的 Linux 环境，把不需要宿主网络全景的工作负载放入独立网络命名空间，核对实际 /proc/net 与 socket 视图，避免无业务需要的宿主网络共享和命名空间进入权限。此措施控制可见范围而非禁止本命名空间内的合法读取，部署前须验证连接、监控和支持路径。
      en: Where Linux supports network namespaces and workloads permit it, place workloads without a host-wide networking
        need in separate network namespaces, verify actual /proc/net and socket views, and avoid unnecessary host-network
        sharing and namespace-entry authority. This limits visible scope rather than prohibiting legitimate reads within a
        namespace and requires validation of connectivity, monitoring, and support paths before deployment.
  control_type: exposure-reduction
- key: reader-evidence-protection
  name:
    zh: 查询者证据与覆盖验证
    en: Protect reader evidence and validate coverage
  description:
    paragraphs:
    - zh: 集中保留完整命令行和执行审计，将批准诊断记录绑定事件时主体、设备与作业。对需要连接表调用观测的主机先验证专用采集合同和覆盖健康，再保护查询元数据与必要结果；不得把流量日志当作查询者日志，也不得从缺事件推断没有读取。
      en: Centrally retain complete command lines and execution audit and bind diagnostic approvals to event-time principals,
        devices, and jobs. On hosts needing table-call observation, validate dedicated collection contracts and coverage health
        before protecting query metadata and necessary results. Do not treat traffic logs as reader logs or infer no reading
        from absent events.
  control_type: detective-support
applications:
- target_ref: NJT-0247
  use:
    paragraphs:
    - zh: 为 netstat 与 ss 等诊断入口登记具体作业和批准载体，限制未批准代码进入调查流程，并在 Linux 工作负载中按业务需要收窄可见网络命名空间。保留原始参数和审计主体，区分连接显示与路由或统计用途；不能用工具禁用替代查询权限与工作流治理。
      en: Register concrete jobs and approved carriers for diagnostic entry points such as netstat and ss, constrain unapproved
        code, and scope Linux workload network namespaces by business need. Preserve raw arguments and audited principals
        to distinguish connection displays from route or statistical uses. Utility removal cannot replace query-authority
        and workflow governance.
  expected_effect:
    paragraphs:
    - zh: 未批准调查更容易在代码与作业来源上形成差异，隔离工作负载只能取得其可见视图，查询证据也更容易连接实际主体。措施减少调查机会并增强辨识，不保证已访问系统无法读取其自身连接。
      en: Unapproved inquiries are more likely to diverge in code and job provenance, isolated workloads obtain only their
        visible view, and query evidence is more readily attributable. The measures reduce opportunities and improve discrimination
        without guaranteeing that an accessed system cannot read its own connections.
  limitations:
    paragraphs:
    - zh: 普通连接读取往往无需高权限，被盗批准身份仍可查询；网络命名空间隔离仅适用于相应 Linux 部署，宿主共享和跨命名空间权限会削弱范围控制。应用控制存在兼容性成本，进程和流量日志不含完整结果。
      en: Ordinary connection reads often need no high privilege and stolen approved identities can still query. Namespace
        isolation applies only to relevant Linux deployments, while host sharing and cross-namespace authority weaken scoping.
        Application control has compatibility costs, and process or traffic logs omit complete results.
- target_ref: NJS-0247-001
  use:
    paragraphs:
    - zh: 对进程内连接状态查询，重点验证载体中实际实现查询的代码来源和模块完整性，并在需要时部署经测试的调用元数据采集，使本次读取能够连接载体和批准职责。不要只禁用 netstat，也不要因为 IP Helper DLL 或宿主进程已批准就允许任意内存代码查询。
      en: For In-Process Connection-State Query, verify provenance and integrity of the code actually implementing the inquiry
        and deploy tested call-metadata collection where needed to connect the read to its carrier and approved duty. Do not
        merely disable netstat or allow arbitrary memory-resident querying because IP Helper or the host process is approved.
  expected_effect:
    paragraphs:
    - zh: 限制未知查询代码进入既有载体，并为省去外部工具边界的读取补充直接调用证据，提高恶意载体维持正常诊断外观的成本。
      en: Restrict unknown query code entering executing carriers and supply direct invocation evidence for reads lacking
        an external-utility boundary, increasing the cost of maintaining ordinary diagnostic appearance.
  limitations:
    paragraphs:
    - zh: 可信代理被攻陷、内存注入或传感器不覆盖时仍可能读取；专用调用采集并非默认能力，需验证性能、权限和抗篡改。此应用不宣称单独阻断 GetExtendedTcpTable 或所有内部连接查询。
      en: Compromised trusted agents, memory injection, or sensor gaps may still permit reads. Dedicated call capture is not
        default functionality and needs performance, privilege, and tamper-resistance validation. This application does not
        claim standalone blocking of GetExtendedTcpTable or every internal connection inquiry.
- target_ref: NJT-0246
  use:
    paragraphs:
    - zh: 为网络配置调查登记合法诊断执行体及其接口、路由和接入读取职责，重点核对代理加载和远程命令入口。原生观测按实际 getter 验证，GetAdaptersInfo 与 GetAdaptersAddresses 分开解释，大小重试、地址族与非秘密无线配置返回分别留存；它们不能用来证明完整网络暴露或连接成功。
      en: Register legitimate diagnostic carriers and duties for interface, routing, and access reads, emphasizing agent loading
        and remote-command entries. Validate native observation per getter, interpret GetAdaptersInfo and GetAdaptersAddresses
        separately, and preserve size retries, address families, and nonsecret wireless returns. These do not establish complete
        network exposure or successful connectivity.
    - zh: 在业务允许且支持网络命名空间的 Linux 工作负载上，验证接口与路由仅属于其分配视图，避免无需求共享宿主网络或授予跨命名空间进入权。该范围措施不阻止本命名空间内读取，也不能直接套到 Windows 适配器 API。
      en: For Linux workloads supporting network namespaces where duties permit, verify that interfaces and routes belong
        only to the assigned view and avoid unnecessary host-network sharing or cross-namespace entry authority. Scoping does
        not prevent reads within the namespace and does not directly apply to Windows adapter APIs.
  expected_effect:
    paragraphs:
    - zh: 未批准代码获得稳定网络调查承载的机会减少，合法外观的读取也能与主体和任务核对。防守方可在没有新命令的情况下保留配置取得的有限证据，降低只凭工具签名和进程名作判断的依赖。
      en: Unapproved code has fewer opportunities for stable survey carriage, while ordinary-looking reads become comparable
        with principals and tasks. Defenders retain bounded evidence of configuration acquisition without a new command, reducing
        dependence on utility signatures and names.
  limitations:
    paragraphs:
    - zh: 基础配置仍可能对普通应用可见，已控制的批准载体与绕过观测的路径仍有机会读取。自定义接口采集有兼容性、性能和隐私成本，不能以覆盖少量 API 宣称阻止所有平台或全部 getter。
      en: Basic configuration can remain visible to ordinary applications, and compromised approved carriers or unobserved
        paths may still read it. Custom API capture has compatibility, performance, and privacy costs; a small API set does
        not block every platform or getter.
- target_ref: NJS-0246-001
  use:
    paragraphs:
    - zh: 对驻留内联网络配置调查，审查已获准驻留进程中的网络调查任务入口和可加载扩展，在预部署读取层覆盖实际 GetAdaptersInfo，并保留查询发生时该进程的原始实例与有效主体。先核验成功返回后再按 IP_ADAPTER_INFO
        解释适配器字段，避免用缺少 ipconfig 进程或 packet 标签触发文件规则作为放行和检测依据。
      en: For Resident Inline Network-Configuration Survey, review task entries and loadable extensions in approved resident
        processes, predeploy read-layer coverage of the actual GetAdaptersInfo entry, and retain the original process instance
        and effective principal at query time. Confirm successful returns before interpreting IP_ADAPTER_INFO fields. Neither
        absent ipconfig processes nor file rules based on packet labels provide reliable allow or detect conditions.
  expected_effect:
    paragraphs:
    - zh: 调查与每任务新执行器的对应关系消失后，读取仍可连接到真正长期载体和有限 IPv4 结果。攻击者不能只依靠复用既有进程就让配置调查完全脱离问责；未经批准的承载入口也可被收缩或撤销。
      en: When the per-task-executor relationship disappears, reads remain attributable to the real long-lived carrier and
        bounded IPv4 results. Reusing a process alone no longer removes survey accountability, and unapproved carriage entries
        can be reduced or revoked.
  limitations:
    paragraphs:
    - zh: 这些措施不能保证阻止已运行植入体读取其本来可见的适配器视图，应用控制也不自动检查任意内存指令。hook 绕过、旧 API 漏收、线程身份缺失和晚部署仍可留下盲区；是否识别该子项还需要正面任务承载证据，而不是仅见一次 getter。
      en: These measures do not guarantee preventing an existing implant from reading its visible adapter view, and application
        control does not inspect arbitrary memory instructions automatically. Hook bypass, missed legacy APIs, missing thread
        identity, and late deployment remain gaps. Identifying this child requires positive task-carrier evidence rather than
        one getter alone.
