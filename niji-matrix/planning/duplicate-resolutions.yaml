  reason_zh: 事件 4776 是权威计算机上的 NTLM credential validation，事件 4768 是 KDC TGT 请求；认证协议、事件字段和观察位置不同。
  reason_en: Event 4776 is NTLM credential validation at an authoritative computer, while event 4768 is a KDC TGT
