  reason_zh: 事件 4739 域策略变化与事件 4776 NTLM 凭据验证的事件 ID、字段、生成主机和分析用途不同。
  reason_en: Event 4739 domain-policy change and event 4776 NTLM credential validation differ in event ID, fields,
    emitting host, and analytic purpose.
- ids:
