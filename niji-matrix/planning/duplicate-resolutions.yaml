resolutions:
- ids:
  - REF-000020
  - REF-000023
  disposition: split
  reviewed: '2026-09-08'
  reason_zh: 两者标题因 Gather Victim ... Information 结构相似，但分别具有 ATT&CK T1592 和 T1591 稳定标识，信息对象为主机属性与组织属性，必须作为不同来源保留。
  reason_en: The titles share the Gather Victim ... Information pattern, but stable ATT&CK identifiers T1592 and
    T1591 and their host-versus-organization information objects require separate references.
- ids:
  - REF-000014
  - REF-000410
  disposition: split
  reviewed: '2026-09-20'
  reason_zh: 两者都描述 ATT&CK T1497，但 REF-000014 保留未锁定版本的滚动页面身份，并已作为跨批次能力研发边界来源使用；REF-000410 则以 versions/v19 稳定 URL
    锁定 Enterprise ATT&CK 19.1 基线，支持 TA0005 中 T1497 的固定版本准入与正式对象。两者快照身份与版本责任不同，因此保留为已审查 split。
  reason_en: Both references describe ATT&CK T1497, but REF-000014 preserves the rolling unversioned page identity
    and is already used across batches as a capability-development boundary source, whereas REF-000410 locks the
    Enterprise ATT&CK 19.1 baseline through a stable versions/v19 URL for T1497 admission and formal TA0005 objects.
    Their snapshot identities and version responsibilities differ, so they remain as a reviewed split.
- ids:
  - NJT-0078
  - NJT-0130
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: 软件部署工具与横向工具传输都可能让恶意内容到达其他主机，但 NJT-0078 以控制面 job、受管 agent 接收并首次执行为结果链；NJT-0130 以脱离受管任务语义的独立主机间文件到达为结果。共享载荷或
    SMB 媒介不足以合并；T1072 的 TA0008 映射直接复用 NJT-0078，不创建第三份同义对象。
  reason_en: Software Deployment Tools and Lateral Tool Transfer can both bring malicious content to another host,
    but NJT-0078 owns the control-plane job to managed-agent receipt to first execution chain, whereas NJT-0130
    owns independently evidenced host-to-host file arrival outside a managed-job transaction. A shared payload or
    SMB medium does not merge them. T1072's TA0008 mapping directly reuses NJT-0078 rather than creating a third
    synonym.
- ids:
  - REF-000621
  - REF-000622
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: 两篇 Microsoft 文档名称相似，但 REF-000621 定义 Windows Event 4778 会话重新连接，REF-000622 定义 Event 4779 会话断开；事件方向、事件
    ID 和规范 URL 不同，必须保留为两条来源。
  reason_en: The Microsoft titles are similar, but REF-000621 defines Windows Event 4778 session reconnection and
    REF-000622 defines Event 4779 session disconnection. Their event direction, stable event IDs, and canonical
    URLs differ, so the references remain separate.
- ids:
  - NJT-0133
  - NJT-0154
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: 两者都可能处理外传前后同一数据集，但 NJT-0133 的直接对象是源数据到归档容器或编码流的转换，NJT-0154 的直接对象是传输单元大小或短窗发送量。只有为控制外送单元而进行的分卷归后者；内容可检查性与出口计量需要不同防御。
  reason_en: Both may concern the same data set near exfiltration, but NJT-0133 owns conversion of source data into
    an archive or encoded stream, while NJT-0154 owns outbound unit size or sent volume per short window. A volume
    sized for delivery belongs to the latter; content inspectability and egress accounting require different defenses.
- ids:
  - DET-000087
  - DET-000172
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: DET-000087 以平台调度任务注册和执行结果为观察对象；DET-000172 以实际数据出站、周期释放及待发区变化为对象，应用内部计时器时可能不存在平台计划任务。仅共享时间概念不足以复用检测策略。
  reason_en: DET-000087 observes platform task registration and execution outcome, while DET-000172 observes actual
    data egress, recurrent release and pending-area change. An application timer may have no platform scheduled
    task, so a shared time concept does not make the strategies identical.
- ids:
  - DET-000171
  - DET-000172
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: DET-000171 重建分块对象与短窗限速下的累计发送量，需要请求长度或周期字节；DET-000172 核查待发积压与重复释放的时间关系，需要跨周期节律、进程及批准作业。规模与时机可以共存，但检测目的和关联键不同。
  reason_en: DET-000171 reconstructs totals across chunked objects and capped short-window sending from request
    lengths or periodic bytes. DET-000172 tests the time relation between pending data and recurrent release using
    cadence, process and approved-job context. Volume and timing can coexist, but the objectives and joins differ.
- ids:
  - MIT-000156
  - MIT-000157
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: 两项缓解均包含受管出口，但 MIT-000156 的特有措施是跨对象与长时间窗累计上传预算，MIT-000157 的特有措施是授权周期作业登记和下次释放前暂停。各自的逐目标应用、控制动作与限制不同，不能以共同标题合并。
  reason_en: Both mitigations include managed egress, but MIT-000156 uniquely accounts for upload budgets across
    objects and long windows, while MIT-000157 registers approved recurrent jobs and holds the next release. Their
    target applications, control actions and limitations differ and cannot be merged by a common title.
- ids:
  - NJT-0148
  - NJT-0150
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: 同一 ESET Gamaredon 报告描述共享文档注入和受陷邮箱内部发信，但前者改变共享对象的内容或导航绑定，后者改变内部消息的发件主体与收件者行动链。来源复用为 REF-000590，Case
    和 Claim 按操作分别保留，不因同一活动合并父技术。
  reason_en: The same ESET Gamaredon report describes shared-document injection and internal mail from a compromised
    mailbox, but the first changes shared-object content or navigation binding while the second changes the message
    sender and recipient action chain. REF-000590 is reused, with Cases and Claims kept to their separate operations
    rather than merging parents because of one campaign.
- ids:
  - NJT-0130
  - NJT-0148
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: NJT-0130 的完成点是可证的主机间工具文件到达；NJT-0148 的完成点是原有共享对象或导航入口被污染后由另一内部消费者触发并产生结果。文件可能先转移再污染，但独立到达不能证明共享对象语义改变或消费者执行。
  reason_en: NJT-0130 completes at verified host-to-host tool-file arrival. NJT-0148 completes when an established
    shared object or navigation entry is tainted and another internal consumer triggers a result. A file may move
    before tainting, but arrival alone cannot prove shared-object semantic change or consumer execution.
- ids:
  - NJT-0149
  - NJT-0151
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: NJT-0149 以内部远程服务漏洞输入到另一主机可控结果为因果入口；NJT-0151 则改变他人既有认证传输或交互会话的控制者。利用可为获得本地权限提供前提，但服务缺陷触发不等于接管一条已经存在的会话。
  reason_en: NJT-0149 enters through a vulnerability-triggering input to an internal remote service and a controlled
    result on another host. NJT-0151 changes the controller of another principal's existing authenticated transport
    or interactive session. Exploitation may supply local authority, but triggering a service flaw is not takeover
    of an already existing session.
- ids:
  - NJT-0111
  - NJT-0150
  disposition: split
  reviewed: '2026-09-22'
  reason_zh: Proofpoint 的按主题自动归档警示回复属于 NJT-0111 所有的默认视图枚举遗漏变量；NJT-0150 的直接对象是受陷内部发件身份、诱导消息、收件者动作和第二主体结果。两者可共现，但本批不在
    T1534 下复制 NJS-0111-001。
  reason_en: Proofpoint's subject-matched archiving of warning replies belongs to the default-view omission variable
    owned by NJT-0111. NJT-0150 directly models compromised internal sender identity, lure message, recipient action,
    and second-principal outcome. They can co-occur, but this batch does not copy NJS-0111-001 under T1534.
- ids:
  - REF-000747
  - REF-000752
  disposition: split
  reviewed: '2026-09-23'
  reason_zh: 两条 Microsoft 文档仅共享“Windows 安全事件”标题结构。REF-000747 定义事件 4739 的域策略变化字段，REF-000752 定义事件 4929 的目录复制来源 naming
    context 移除及 Source DRA/Address 字段；事件 ID、规范 URL、数据语义和检测用途不同，必须分别保留。
  reason_en: The Microsoft documents share only the Windows Security Event title pattern. REF-000747 defines domain-policy
    change fields for event 4739, while REF-000752 defines removal of a directory-replication source naming context
    plus Source DRA and Address fields for event 4929. Their event IDs, canonical URLs, data semantics, and detection
    uses differ and require separate references.
- ids:
  - REF-000200
  - REF-000772
  disposition: split
  reviewed: '2026-09-23'
  reason_zh: REF-000200 专门定义 PowerShell 在 App Control 下进入 ConstrainedLanguage 或被阻断的脚本能力语义；REF-000772 定义 App Control
    policy 的 early-boot enforcement、signed-policy 防篡改、HVCI 与独立 attestation。两者产品族相同，但 consumer、字段、控制动作和 T1553 验证器状态用途不同，必须分别保留。
  reason_en: REF-000200 specifically defines PowerShell script capability under App Control through ConstrainedLanguage
    or blocking. REF-000772 defines early-boot enforcement, signed-policy tamper resistance, HVCI, and independent
    attestation for App Control policy. They share a product family but differ in consumer, fields, control action,
    and T1553 verifier-state use and must remain separate.
- ids:
  - NJT-0055
  - NJT-0183
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJT-0055 处理外部远程服务首次/持续重入、已有 session/token 重放和用户地理/设备/时间风险情境；NJT-0183 处理已有内网立足点后的 source asset—destination—service—fresh
    session—target action。SMB/DCOM/WinRM 等无外部网关风险面且结果门与数据不同，因此拆分父项。
  reason_en: NJT-0055 models external remote-service first entry or reentry, existing session or token replay, and
    user geography, device, and time risk context. NJT-0183 models source asset to destination to service to fresh
    session to target action after an internal foothold. SMB, DCOM, and WinRM need no external gateway risk plane
    and have different result gates and data, so the parents remain split.
- ids:
  - NJS-0055-002
  - NJS-0183-001
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJS-0055-002 使外部来源地理、ASN/ISP、设备/客户端与时间贴合被冒用用户历史；NJS-0183-001 使内部主体、来源资产角色、目标角色、服务和时段贴合批准管理关系，并继续分析会话内动作。用户风险情境与资产关系图不是同一变量。
  reason_en: NJS-0055-002 aligns external geography, ASN or ISP, device or client, and time with an impersonated
    user history. NJS-0183-001 aligns internal principal, source asset role, destination role, service, and time
    with an approved management relationship while still inspecting in-session action. User risk context and an
    asset relationship graph are different variables.
- ids:
  - NJS-0168-002
  - NJS-0183-002
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJS-0168-002 要求 relay 形成批准 path graph 禁止或应受检查的跨域桥接；NJS-0183-002 可发生在批准堡垒/跳板路径上，变化是目标只见中继来源而未授权操作者被隐藏。禁止域对和来源归因是不同直接对象。
  reason_en: NJS-0168-002 requires a relay to bridge a domain pair prohibited by the approved path graph or subject
    to mandatory inspection. NJS-0183-002 can occur on an approved bastion or jump path and changes destination-visible
    origin so an unauthorized controller is hidden. A prohibited domain pair and origin attribution are different
    direct objects.
- ids:
  - NJS-0151-001
  - NJS-0183-002
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJS-0151-001 在他人已有认证 transport 内增设逻辑通道；NJS-0183-002 让中继向目标发起 fresh authentication 和新的远程服务会话。旧 transport
    内通道控制者变化与两条连接的来源间接化不能合并。
  reason_en: NJS-0151-001 adds a logical channel inside another principal existing authenticated transport. NJS-0183-002
    has an intermediary perform fresh authentication and establish a new destination remote-service session. Controller
    change inside an old transport is distinct from origin indirection across two connections.
- ids:
  - NJT-0178
  - NJT-0184
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJT-0178 以完整 access/refresh material 返回、读取或复制到攻击者接收者为完成点；NJT-0184 从材料被呈现并按既有规则验证开始。refresh redemption
    可分别记录输入使用和输出取得。
  reason_en: NJT-0178 completes when full access or refresh material reaches an adversary recipient; NJT-0184 begins
    at presentation and validation under existing rules. Refresh redemption can separately record input use and
    output acquisition.
- ids:
  - NJT-0166
  - NJT-0184
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJT-0166 拥有离权威构造的新认证 proof；NJT-0184 使用正规系统先前生成的原件。伪造与随后使用可共现，但构造证据不能替代呈现和接受证据。
  reason_en: NJT-0166 owns new authentication proof constructed outside authority, while NJT-0184 uses an original
    previously generated by the legitimate system. Forgery and later use can coexist, but construction evidence
    cannot replace presentation and acceptance.
- ids:
  - NJT-0061
  - NJT-0184
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJT-0061 拥有身份或会话被依赖方接受后的通用资源使用；NJT-0184 拥有替代材料的呈现和材料特定验证。接受结果可共映射，但两者直接对象及防御关联不同。
  reason_en: NJT-0061 owns general resource use after relying-party acceptance of identity or session; NJT-0184
    owns alternate-material presentation and material-specific validation. Acceptance outcomes can co-map, but the
    direct objects and defensive joins differ.
- ids:
  - NJT-0151
  - NJT-0184
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJT-0151 改变同一既有远程传输或交互会话的控制者；NJT-0184 用材料触发另一验证、派生或资源接受。账户相同不等于接管同一会话。
  reason_en: NJT-0151 changes the controller of the same existing remote transport or interactive session; NJT-0184
    uses material to trigger another validation, derivation, or resource acceptance. The same account does not imply
    takeover of the same session.
- ids:
  - NJS-0061-002
  - NJS-0184-001
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: NJS-0061-002 处理资源直接续用既有 Cookie/access token/session state 且没有当前完整验证链；NJS-0184-001 要求当前 verifier、KDC
    或 token endpoint 产生新 context/proof。两种观察拓扑需要不同检测策略。
  reason_en: NJS-0061-002 covers direct resource continuation of established cookie, access-token, or session state
    without a current complete verification chain. NJS-0184-001 requires a current verifier, KDC, or token endpoint
    to create fresh context or proof. The observation topologies require different detection strategies.
- ids:
