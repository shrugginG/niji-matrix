- ids:
  - REF-000854
  - REF-000855
  disposition: split
  reviewed: '2026-09-27'
  reason_zh: 事件 4768 记录 TGT 请求，事件 4769 记录服务票据请求；不同 Kerberos 阶段和字段承担原认证与目标 proof 的独立证据责任。
  reason_en: Event 4768 records a TGT request and event 4769 a service-ticket request. Different Kerberos stages
    and fields carry separate evidence duties for original authentication and target proof.
- ids:
  - NJT-0190
  - NJT-0155
  disposition: split
  reviewed: '2026-10-04'
  reason_zh: NJT-0190 以对象状态触发的跨组件交接或控制面复制为自动化观察差，NJT-0155 以时钟周期造成收集—释放错位；同一流水线可同时映射，但组件/复制与时间变量、防御关联键不同。
  reason_en: NJT-0190 uses object-state cross-component handoff or control-plane replication as its automation differential,
    while NJT-0155 uses clock cadence to displace collection from release. One pipeline may map to both, but component/replica
    and time variables require different joins and defenses.
- ids:
  - NJS-0190-002
  - NJT-0176
  disposition: split
  reviewed: '2026-10-04'
  reason_zh: 两者可复用镜像事件，但 NJS-0190-002 处理任意源流到独立 collector 的复制外传，NJT-0176 处理凭据流量被动嗅探及材料结果；数据对象、结果门和防御目标不同。
  reason_en: Both can use mirroring evidence, but NJS-0190-002 covers replication of any source flow to an independent
    collector, whereas NJT-0176 covers passive credential-traffic sniffing and material outcomes. Data subject,
    outcome gate, and defense objective differ.
- ids:
  - NJS-0191-002
  - NJT-0152
  disposition: split
  reviewed: '2026-10-04'
  reason_zh: NJS-0191-002 的主体是失窃数据在替代外传协议事务中的语义伪装，NJT-0152 的主体是 C2 指令与控制消息；外层协议可能相同，但战术结果、源数据谱系和检测结果门不同。
  reason_en: NJS-0191-002 concerns semantic camouflage of stolen data in alternative exfiltration transactions;
    NJT-0152 concerns command and control messages. The outer protocol may match, but tactic outcome, source-data
    lineage, and detection gate differ.
- ids:
  - NJT-0192
  - NJT-0160
  disposition: split
  reviewed: '2026-10-04'
  reason_zh: NJT-0160 建模应用会话如何维持控制关系，NJT-0192 建模失窃数据如何复用已存在的控制关系而不生成独立外传关系；同一会话可同时具有控制和外传事实，但字段基线、敏感读取关联和缓解处置不同。
  reason_en: NJT-0160 models how an application session sustains control; NJT-0192 models stolen data reusing that
    established relationship without a separate exfiltration relation. One session may satisfy both, but message
    baselines, sensitive-read joins, and mitigation actions differ.
- ids:
  - NJT-0193
  - NJT-0062
  disposition: split
  reviewed: '2026-10-04'
  reason_zh: NJT-0062 研究无线介质建立初始入口，NJT-0193 研究已有受控资产通过次要网络介质把数据送出；方向、前置控制、数据结果和防御目标相反，不能因共享 Wi-Fi/Bluetooth 字样合并。
  reason_en: NJT-0062 studies wireless media establishing initial entry, while NJT-0193 studies an already controlled
    asset sending data over a secondary network medium. Direction, prior control, data outcome, and defense objective
    are different despite shared Wi-Fi or Bluetooth terms.
- ids:
  - NJT-0194
  - NJT-0058
  disposition: split
  reviewed: '2026-10-04'
