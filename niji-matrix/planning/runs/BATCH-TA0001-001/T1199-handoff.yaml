candidate:
  source_type: attack
  source_attack_id: T1199
  name:
    zh: 受信关系入口
    en: Trusted Relationship Entry
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 利用伙伴既有连接或跨租户委托管理关系，以受信组织路径进入目标。 高隐蔽主体可通过所列稳定行为变量改变入口痕迹，因此保留。
      en: Enter a victim through trusted organizational paths by abusing partner connections or cross-tenant delegated administration. Stealth-oriented actors can change entry traces
        through the listed stable behavioral variables, so the candidate is retained.
proposed_content:
  summary:
    zh: 利用伙伴既有连接或跨租户委托管理关系，以受信组织路径进入目标。
    en: Enter a victim through trusted organizational paths by abusing partner connections or cross-tenant delegated administration.
  definition_and_concept:
    paragraphs:
    - zh: 利用伙伴既有连接或跨租户委托管理关系，以受信组织路径进入目标。受信关系入口以供应商、承包商、托管服务商或合作伙伴已有的连接、委托与授权路径为直接行为对象，目标是在初始入侵阶段取得第一个可执行、可认证或可通信立足点。该概念描述入口行为及其受控匿迹变量，不以工具、产品、媒介或 ATT&CK 子技术名称划界。
      en: Enter a victim through trusted organizational paths by abusing partner connections or cross-tenant delegated administration. Trusted Relationship Entry treats existing connection,
        delegation, and authorization paths of suppliers, contractors, managed-service providers, or partners as its direct behavioral object and seeks the first executable, authenticated,
        or communicating foothold during Initial Access. The concept describes the entry behavior and its controlled stealth variables rather than a tool, product, medium, or ATT&CK
        child name.
  stealth_characteristics:
    paragraphs:
    - zh: 受信关系入口通过子技术改变入口痕迹的外观、位置、密度或跨层关联，使受害方难以从单一事件区分攻击与正常访问。匿迹并不消除证据，入口前后跨层身份、网络、内容、设备或供应链痕迹仍会残留在受害方、服务提供方、身份平面、端点或供应方；拥有更长保留期和跨视角关联能力的防守方可以限制这种效果。
      en: 'Trusted Relationship Entry changes the appearance, location, density, or cross-layer linkage of entry traces through its children, making one event difficult to distinguish
        from normal access. Stealth does not erase evidence: cross-layer identity, network, content, device, or supply-chain traces around entry remain at the victim, service provider,
        identity plane, endpoint, or supplier, and defenders with longer retention and cross-vantage correlation can constrain the effect.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入攻击者有意利用供应商、承包商、托管服务商或合作伙伴已有的连接、委托与授权路径并改变首个入口痕迹的行为，截止于立足点建立。它排除后续执行、持久化、提权、横向移动与命令控制，也不按 ATT&CK 子技术、产品或介质直接拆分；相邻边界是访问资源的购买或准备属于资源开发，有效身份本身的使用属于有效身份入口。合法运维、个人化服务、兼容性行为或偶发故障只有在攻击者控制了稳定变量并产生对应观察差异时才可纳入。
      en: This technique includes adversary-controlled use of existing connection, delegation, and authorization paths of suppliers, contractors, managed-service providers, or partners
        that changes traces of the first entry and ends when the foothold is established. It excludes downstream execution, persistence, privilege escalation, lateral movement, and command
        and control and is not partitioned directly by ATT&CK children, product, or medium; its neighboring boundary is that purchase or preparation of access belongs to resource development,
        while use of the valid identity itself belongs to valid-identity entry. Legitimate administration, personalized service, compatibility behavior, or accidental failure qualifies
        only when an adversary controls a stable variable and produces the corresponding observation difference.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 本技术适用于攻击者在企业互联网、身份、端点、物理或供应生态中，借助供应商、承包商、托管服务商或合作伙伴已有的连接、委托与授权路径接近首个目标立足点并希望入口在建立前后保持低可区分性的场景。应用触发是首个入口条件已经可用且攻击者开始利用该条件；后续行动只能作为入口结果的证据，不能扩张本技术边界。
        en: This technique applies when an adversary uses existing connection, delegation, and authorization paths of suppliers, contractors, managed-service providers, or partners in
          enterprise Internet, identity, endpoint, physical, or supply ecosystems to approach the first victim foothold while keeping the entry difficult to distinguish before and immediately
          after establishment. The trigger is availability and use of the first-entry condition; downstream action may evidence the entry outcome but cannot expand this technique boundary.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须满足以下前提：对应入口面、身份、信任路径或载体可被攻击者利用。实施者还需控制供应商、承包商、托管服务商或合作伙伴已有的连接、委托与授权路径的关键条件、时点或上下文，并能够承受选择性交付、跨视角协调、长期等待、物理接近或供应关系维护中至少一项成本；失去控制、目标不匹配或提供方处置会削弱匿迹效果。
          en: 'The adversary must satisfy these prerequisites: the corresponding entry surface, identity, trust path, or carrier is exploitable. The operator must also control key conditions,
            timing, or context of existing connection, delegation, and authorization paths of suppliers, contractors, managed-service providers, or partners and bear at least one cost
            involving selective delivery, cross-vantage coordination, delay, physical proximity, or supply-relationship maintenance; loss of control, target mismatch, or provider enforcement
            weakens the stealth effect.'
      defender_model:
        paragraphs:
        - zh: 防守方可能观察到入口前后跨层身份、网络、内容、设备或供应链痕迹，但受害方、服务提供方、身份系统、端点、物理设施与供应商掌握的字段和保留期不同。可靠判断需要在授权范围内连接入口前后事件、验证真实主体与来源，并为合法相似行为建立基线；缺少任一关键视角时只能形成受限推断。
          en: Defenders may observe cross-layer identity, network, content, device, or supply-chain traces around entry, but victims, service providers, identity systems, endpoints,
            physical facilities, and suppliers hold different fields and retention periods. Reliable judgment requires authorized linkage of pre-entry and post-entry events, validation
            of the actual subject and provenance, and baselines for legitimate lookalikes; missing a critical vantage limits the inference.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 可信或常见入口特征替代显著恶意特征并削弱粗粒度区分
      en: Trusted or common entry features replace conspicuous malicious features and weaken coarse discrimination
    analysis:
      paragraphs:
      - zh: 受信关系入口的已证实子技术通过有意控制入口条件，使原本可以集中关联的入口前后跨层身份、网络、内容、设备或供应链痕迹发生位置、密度、外观或可见性变化。攻击者以合法、可信或常见入口特征替代显著恶意特征，使粗粒度规则难以区分；防守方必须恢复行为、身份与来源谱系，因而形成特征伪装效果。
        en: Supported children of Trusted Relationship Entry intentionally control entry conditions so that otherwise correlatable traces such as cross-layer identity, network, content,
          device, or supply-chain traces around entry change location, density, appearance, or visibility. The adversary substitutes legitimate, trusted, or common entry features for
          conspicuous malicious features, weakening coarse rules; defenders must recover behavioral, identity, and provenance lineage, producing a Feature Disguise effect.
    evidence_refs:
    - REF-000093
    - REF-000110
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 关键入口动作在单一观察面中呈现为正常低信号或观测空白
      en: Critical entry actions appear normal low-signal or absent within one observation vantage
    analysis:
      paragraphs:
      - zh: 受信关系入口的已证实子技术通过有意控制入口条件，使原本可以集中关联的入口前后跨层身份、网络、内容、设备或供应链痕迹发生位置、密度、外观或可见性变化。关键入口动作在单一观察模型中表现为空白、低信号或正常结果，使原有分析逻辑不触发；扩大观察面或关联前后结果仍可恢复差异，因而形成行为透明效果。
        en: Supported children of Trusted Relationship Entry intentionally control entry conditions so that otherwise correlatable traces such as cross-layer identity, network, content,
          device, or supply-chain traces around entry change location, density, appearance, or visibility. The critical entry action appears blank, low-signal, or normal under one observation
          model, preventing existing analytics from firing; broader vantage and correlation with preceding and subsequent outcomes can recover the difference, producing a Behavioral
          Transparency effect.
    evidence_refs:
    - REF-000093
    - REF-000110
    confidence: high
