research:
  limitations:
    paragraphs:
    - zh: 公开证据支持该 ATT&CK 父行为与至少一项稳定匿迹变量，但不能证明每个实例都具有相同主观意图、跨平台效果或提供方可见性。用户访问攻击者控制网站属于可信浏览触发入口，产品在交付前被污染属于供应链入口也可能在局部产生相似信号，因此结论必须限制在来源直接支持的入口行为、痕迹变化和观察模型内；新增子技术需要独立证据与防御差异。
      en: Public evidence supports the ATT&CK parent behavior and at least one stable stealth variable, but it does not establish identical intent, cross-platform effect, or provider
        visibility in every instance. The neighboring behaviors described above can also produce locally similar signals, so conclusions must remain within entry behavior, trace change,
        and observation models directly supported by sources; any additional child requires independent evidence and a defensive distinction.
  rejected_mechanisms: []
  open_questions: []
