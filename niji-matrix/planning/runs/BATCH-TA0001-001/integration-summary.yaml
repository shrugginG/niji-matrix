review_notes_zh: Initial Access 固定 ATT&CK 19.1 基线的 11 个父候选均已完成准入与 YAML-only 2.0 重开发，共形成 11 个父技术和 29 项 Niji 原生子技术。REF-000042、REF-000043、REF-000067、REF-000068、REF-000070、REF-000084 及 REF-000085
  至 REF-000114 按已存在身份复用；六类入口防御因检测目标、数据要求和控制动作不同于现有共享对象而新建 DET→NJA 与 MIT。正式内容与规划为 0 错误、0 警告，共享库为 0 个精确重复和 0 个待审可能重复；12 项基础设施测试、11 个 Bundle、Review Web 测试及全部新父子对象的中英文固定章节检查均通过，API issues
  为 0。全部正式对象保持 review，等待人工领域审查。
review_notes_en: All eleven parent candidates in the fixed ATT&CK 19.1 Initial Access baseline have admission decisions and YAML-only 2.0 redevelopment, producing eleven parent techniques
  and 29 Niji-native children. REF-000042, REF-000043, REF-000067, REF-000068, REF-000070, REF-000084, and REF-000085 through REF-000114 are reused under their existing identities; six
  entry-defense families receive new DET-to-NJA and MIT objects because their objectives, data requirements, and control actions differ from existing shared objects. Formal content and
  planning have zero errors and zero warnings, with zero exact or unresolved possible duplicates; all twelve infrastructure tests, eleven bundles, Review Web tests, and bilingual fixed-section
  checks for every new parent and child pass with zero API issues. All formal objects remain in review pending human domain review.
