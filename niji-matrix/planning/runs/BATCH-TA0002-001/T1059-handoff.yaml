research:
  limitations:
    paragraphs:
    - zh: 解释器存在和执行本身没有恶意性，内联执行也可能被完整脚本日志记录；分类必须依赖来源进程、主体、命令语义与后续结果，而不能按语言名单定性。
      en: Interpreter presence and execution are not malicious by themselves, and inline execution may be captured by full script logging. Classification must rely on source process,
        principal, command semantics, and subsequent outcome rather than a language list.
