handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-001
work_item_ref: WORK-TA0002-T1059
temporary_key_prefix: EX1-T1059
candidate:
  source_type: attack
  source_attack_id: T1059
  name:
    zh: 命令与脚本解释器
    en: Command and Scripting Interpreter
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 解释器通常是合法管理和应用工作流的一部分，内联指令还可减少独立脚本文件，但进程谱系、参数、脚本块或审计日志仍可能暴露意图，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: interpreters are commonly part of legitimate administration and application workflows, and inline instructions can reduce standalone
        script files, while process lineage, arguments, script blocks, or audit logs may still expose intent. It forms a stable stealth chain and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过调用目标环境已有或可用的命令、脚本与自动化解释器来解析并执行攻击者控制的指令，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: invoking command, scripting, or automation interpreters already present or available in the target environment to parse and execute
      adversary-controlled instructions. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化解释器执行是指调用目标环境已有或可用的命令、脚本与自动化解释器来解析并执行攻击者控制的指令。其直接目标是借助通用执行语义启动命令、脚本或二进制，并降低对专用加载器的依赖；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: Stealth-Conforming Interpreter Execution means invoking command, scripting, or automation interpreters already present or available in the target environment to parse and execute
        adversary-controlled instructions. Its direct objective is to launch commands, scripts, or binaries through general execution semantics while reducing dependence on a dedicated
        loader. Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than
        by tool, product, or file format.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化解释器执行的匿迹性来自解释器通常是合法管理和应用工作流的一部分，内联指令还可减少独立脚本文件，但进程谱系、参数、脚本块或审计日志仍可能暴露意图。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of Stealth-Conforming Interpreter Execution has the following basis: interpreters are commonly part of legitimate administration and application workflows, and
        inline instructions can reduce standalone script files, while process lineage, arguments, script blocks, or audit logs may still expose intent. This changes trace relationships
        involving execution provenance, timing, parent process, content visibility, or control layers, forcing defenders to recover intent across data domains. Control invocations, process
        outcomes, integrity differences, and temporal relationships remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由解释器直接解析的交互命令、内联代码、脚本和二进制调用；排除按 PowerShell、Python、Shell 或平台名称继承 ATT&CK 子项、纯代码混淆、原生 API 直接调用以及管理面特有命令服务。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes interactive commands, inline code, scripts, and binary invocations parsed directly by an interpreter and excludes ATT&CK child categories inherited
        by PowerShell, Python, shell, or platform name, pure code obfuscation, direct native-API calls, and management-plane-specific command services. Legitimate operations, software
        functions, user interaction, or automation can produce similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation
        and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已获得本地或远程命令入口，希望利用系统常见解释器完成发现、配置变更、载荷拉取或后续程序启动时使用。
        en: An adversary uses the technique after obtaining a local or remote command path and wants to use a common system interpreter for discovery, configuration changes, payload
          retrieval, or subsequent program launch.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要解释器可用、当前身份具备所需权限，并能构造目标运行时接受的命令；受限语言、应用控制和详细审计会限制效果。
          en: The adversary needs an available interpreter, sufficient current-identity privileges, and commands accepted by the target runtime; constrained language, application control,
            and detailed auditing limit effectiveness.
      defender_model:
        paragraphs:
        - zh: 防守方假定取得进程创建、父子谱系、命令行和部分脚本内容，但不同解释器的审计深度不一，且合法自动化形成高基线噪声。
          en: The defender is assumed to have process creation, parent-child lineage, command lines, and some script content, although audit depth differs across interpreters and legitimate
            automation creates a high-noise baseline.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用环境原生解释器和正常自动化谱系
      en: Borrow environment-native interpreters and legitimate automation lineage
    analysis:
      paragraphs:
      - zh: 该行为设计使恶意指令由受信二进制和常见运行时执行。恶意活动与合法实体共享可见特征，单点规则难以准确区分，因而形成特征伪装效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means malicious instructions execute through trusted binaries and common runtimes. The malicious activity shares visible features with legitimate entities,
          weakening point classification and producing a Feature Disguise effect. Residual observables still include control requests, process outcomes, integrity changes, or cross-layer
          timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000117
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 以内联与短暂指令减少独立载荷痕迹
      en: Reduce standalone payload traces through inline and transient instructions
    analysis:
      paragraphs:
      - zh: 该行为设计使文件视角可能没有持久脚本，关键语义只存在于参数、内存或短期审计通道。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means the file vantage may have no persistent script while critical semantics exist only in arguments, memory, or short-lived audit channels. Critical
          execution semantics fall outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency
          effect. Residual observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000117
    confidence: medium
proposed_subtechniques:
- canonical_ref: NJS-0065-001
  name:
    zh: 原生解释器工作流伪装
    en: Native-Interpreter Workflow Camouflage
  stable_variable:
    zh: 选择目标环境常用解释器并让父进程、主体和调用时间贴近合法管理或应用工作流
    en: selecting an interpreter common to the environment and aligning parent process, principal, and timing with legitimate administrative or application workflows
  evidence_refs:
  - REF-000117
  confidence: medium
- canonical_ref: NJS-0065-002
  name:
    zh: 短驻内联命令执行
    en: Transient Inline-Command Execution
  stable_variable:
    zh: 把主要逻辑直接放入命令参数、标准输入或短期运行时上下文，不落地独立脚本文件
    en: placing primary logic directly in command arguments, standard input, or a short-lived runtime context without a standalone script file
  evidence_refs:
  - REF-000117
  confidence: medium
