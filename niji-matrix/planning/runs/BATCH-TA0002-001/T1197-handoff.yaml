handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-001
work_item_ref: WORK-TA0002-T1197
temporary_key_prefix: EX1-T1197
candidate:
  source_type: attack
  source_attack_id: T1197
  name:
    zh: BITS 作业
    en: BITS Jobs
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
    - zh: 传输可随可用带宽在后台推进，作业状态主要保存在 BITS 数据库中，并可跨重启等待完成或错误回调，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: transfers can progress in the background according to available bandwidth, job state is held chiefly in the BITS database, and
        completion or error callbacks can survive reboots. It forms a stable stealth chain and is recommended for retain.'
proposed_content:
  summary:
    zh: 攻击者通过滥用 Windows 后台智能传输服务创建、修改或恢复异步作业，并在完成或错误回调中启动攻击者指定程序，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: abusing the Windows Background Intelligent Transfer Service to create, modify, or resume asynchronous jobs and launch an adversary-selected
      program from completion or error callbacks. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: BITS 后台作业执行是指滥用 Windows 后台智能传输服务创建、修改或恢复异步作业，并在完成或错误回调中启动攻击者指定程序。其直接目标是让载荷传输和执行进入操作系统长期管理的后台作业生命周期；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: BITS Background-Job Execution means abusing the Windows Background Intelligent Transfer Service to create, modify, or resume asynchronous jobs and launch an adversary-selected
        program from completion or error callbacks. Its direct objective is to place payload transfer and execution inside a long-lived operating-system-managed background-job lifecycle.
        Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool,
        product, or file format.
  stealth_characteristics:
    paragraphs:
    - zh: BITS 后台作业执行的匿迹性来自传输可随可用带宽在后台推进，作业状态主要保存在 BITS 数据库中，并可跨重启等待完成或错误回调。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of BITS Background-Job Execution has the following basis: transfers can progress in the background according to available bandwidth, job state is held chiefly
        in the BITS database, and completion or error callbacks can survive reboots. This changes trace relationships involving execution provenance, timing, parent process, content
        visibility, or control layers, forcing defenders to recover intent across data domains. Control invocations, process outcomes, integrity differences, and temporal relationships
        remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由 BITS 作业直接承载的传输、恢复、通知回调和随后的执行；排除只使用 BITS 传输文件但没有执行语义的活动、普通解释器执行，以及与 BITS 无关的服务控制。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes transfer, resumption, notification callbacks, and ensuing execution directly carried by a BITS job and excludes activity that only transfers a file
        through BITS without execution semantics, ordinary interpreter execution, and service control unrelated to BITS. Legitimate operations, software functions, user interaction,
        or automation can produce similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation and advance malicious
        activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已获得 Windows 用户上下文或能够远程调用 BITS 接口，希望在低干扰传输后启动下一阶段载荷，或让回调跨登录与重启继续等待时使用该技术。
        en: An adversary uses this technique after obtaining a Windows user context or remote access to the BITS interface and wants to start a next-stage payload after low-disruption
          transfer or leave a callback waiting across logons and reboots.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要创建或修改 BITS 作业的权限、可达的传输源以及对作业状态和通知命令的控制；其速度和触发时间受 BITS 调度、网络条件与作业策略约束。
          en: The adversary needs permission to create or modify BITS jobs, a reachable transfer source, and control of job state and notification commands; transfer speed and trigger
            timing remain constrained by BITS scheduling, network conditions, and job policy.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得 BITS-Client 事件、作业枚举、进程创建和网络连接，但短期端点查询可能看不到长期作业的创建—传输—回调全链。
          en: The defender is assumed to have BITS-Client events, job inventory, process creation, and network connections, although short endpoint queries may not retain the complete
            creation-to-transfer-to-callback chain of a long-lived job.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 作业数据库与系统服务承载关键执行链
      en: Job database and system service carry the critical execution chain
    analysis:
      paragraphs:
      - zh: 该行为设计使常规文件和注册表视图缺少完整作业状态，回调进程又由系统服务发起。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means ordinary file and registry views omit complete job state while the callback process is launched by a system service. Critical execution semantics
          fall outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency effect.
          Residual observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000115
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 后台调度与跨重启等待稀释事件关联
      en: Background scheduling and cross-reboot waiting dilute event correlation
    analysis:
      paragraphs:
      - zh: 该行为设计使创建、传输、完成和回调可被分散到不同时间窗口甚至不同启动周期。相关事件被分散到不同时间窗口或启动周期，局部阈值和短期查询只能看到片段，因而形成时空释痕效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means creation, transfer, completion, and callback can be separated across time windows and even boot cycles. Related events are distributed across observation
          windows or boot cycles, leaving local thresholds and short queries with fragments and producing a Spatiotemporal Trace Dilution effect. Residual observables still include control
          requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000115
    confidence: medium
