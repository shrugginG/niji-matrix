research:
  limitations:
    paragraphs:
    - zh: BITS 作业并非天然恶意，更新器和消息应用会产生相似后台流量；官方资料能直接支持作业特性与已知滥用，但对攻击者是否主动选择具体带宽状态的判断仍需结合现场遥测。
      en: BITS jobs are not inherently malicious, and updaters and messaging applications generate similar background traffic. Official material directly supports job properties and
        known abuse, but determining whether an adversary intentionally selected a particular bandwidth state still requires local telemetry.
