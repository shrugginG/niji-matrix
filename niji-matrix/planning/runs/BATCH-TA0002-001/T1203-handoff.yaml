handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-001
work_item_ref: WORK-TA0002-T1203
temporary_key_prefix: EX1-T1203
candidate:
  source_type: attack
  source_attack_id: T1203
  name:
    zh: 客户端执行利用
    en: Exploitation for Client Execution
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 利用可在普通浏览或打开文档时自动发生，并可只对兼容客户端激活；异常通常要从崩溃、文件写入、意外子进程和网络结果的因果链中恢复，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: exploitation can occur during ordinary browsing or document opening and activate only for compatible clients; the anomaly often
        must be recovered from a causal chain of crash, file write, unexpected child process, and network outcome. It forms a stable stealth chain and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过触发浏览器、办公应用、阅读器或其他客户端软件漏洞，使攻击者控制的代码在客户端进程或其后继进程中运行，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: triggering a vulnerability in a browser, office application, reader, or other client software so adversary-controlled code runs in
      the client process or a successor process. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: 情境门控型客户端利用执行是指触发浏览器、办公应用、阅读器或其他客户端软件漏洞，使攻击者控制的代码在客户端进程或其后继进程中运行。其直接目标是把正常内容处理转化为代码执行，并以客户端工作流作为触发入口；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: Context-Gated Client Exploit Execution means triggering a vulnerability in a browser, office application, reader, or other client software so adversary-controlled code runs
        in the client process or a successor process. Its direct objective is to turn normal content processing into code execution while using the client workflow as the trigger. Under
        the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool, product,
        or file format.
  stealth_characteristics:
    paragraphs:
    - zh: 情境门控型客户端利用执行的匿迹性来自利用可在普通浏览或打开文档时自动发生，并可只对兼容客户端激活；异常通常要从崩溃、文件写入、意外子进程和网络结果的因果链中恢复。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of Context-Gated Client Exploit Execution has the following basis: exploitation can occur during ordinary browsing or document opening and activate only for compatible
        clients; the anomaly often must be recovered from a causal chain of crash, file write, unexpected child process, and network outcome. This changes trace relationships involving
        execution provenance, timing, parent process, content visibility, or control layers, forcing defenders to recover intent across data domains. Control invocations, process outcomes,
        integrity differences, and temporal relationships remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入客户端漏洞从触发到攻击者代码首次运行的执行阶段；排除面向公开服务端的利用、只完成诱导或内容交付的入口、执行流劫持以及按浏览器或文档类型划分的子项。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes the execution phase from client-vulnerability trigger to the first running adversary-controlled code and excludes exploitation of public servers, entry
        that only delivers or lures, hijacked execution flow, and children partitioned by browser or document type. Legitimate operations, software functions, user interaction, or automation
        can produce similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已通过网页、链接、文档或第三方内容把利用材料送达目标客户端，希望在用户正常查看或最低交互下获得执行时使用。
        en: An adversary uses the technique after delivering exploit material through a webpage, link, document, or third-party content and wants execution during normal viewing or minimal
          user interaction.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要适用于目标客户端版本和防护配置的漏洞、可靠触发条件及载荷控制；补丁、沙箱、隔离和利用缓解会降低成功率。
          en: The adversary needs a vulnerability applicable to the target client version and protections, reliable trigger conditions, and payload control; patching, sandboxing, isolation,
            and exploit mitigations reduce success.
      defender_model:
        paragraphs:
        - zh: 防守方假定能观察客户端崩溃或异常、内容来源、文件写入、进程谱系和网络出口，但单一信号很可能与普通故障或用户活动相同。
          en: The defender is assumed to observe client crashes or anomalies, content provenance, file writes, process lineage, and network egress, although each signal alone may look
            like an ordinary fault or user activity.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 把恶意触发嵌入正常客户端内容处理
      en: Embed the malicious trigger in ordinary client content processing
    analysis:
      paragraphs:
      - zh: 该行为设计使浏览、预览或打开文档等常规动作成为漏洞执行的直接前序。恶意活动与合法实体共享可见特征，单点规则难以准确区分，因而形成特征伪装效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means routine browsing, preview, or document opening becomes the direct precursor to exploit execution. The malicious activity shares visible features
          with legitimate entities, weakening point classification and producing a Feature Disguise effect. Residual observables still include control requests, process outcomes, integrity
          changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000121
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 只在兼容客户端情境中激活执行链
      en: Activate the execution chain only in compatible client context
    analysis:
      paragraphs:
      - zh: 该行为设计使非目标访问可能只返回正常内容或失败，沙箱和不兼容观察点看不到相同结果。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means non-target visits may receive only normal content or failure, while sandboxes and incompatible vantages do not see the same outcome. Critical execution
          semantics fall outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency
          effect. Residual observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000121
    confidence: medium
