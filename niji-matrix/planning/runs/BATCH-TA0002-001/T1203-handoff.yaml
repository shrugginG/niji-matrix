research:
  limitations:
    paragraphs:
    - zh: 公开资料通常证明利用和代码执行，但不总能证明选择性门控的全部判断条件；客户端崩溃也不是必要结果，零日利用可能缺少已知漏洞或特征。
      en: Public material commonly establishes exploitation and code execution but does not always establish every selective-gating condition. A client crash is not required, and zero-day
        exploitation may lack known vulnerability or signature context.
