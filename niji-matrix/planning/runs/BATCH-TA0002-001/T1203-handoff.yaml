    zh: 客户端兼容性门控利用激活
    en: Client-Compatibility-Gated Exploit Activation
  stable_variable:
    zh: 依据版本、运行时、配置或环境反馈，仅在满足利用条件的客户端触发真实漏洞链
    en: triggering the real exploit chain only when version, runtime, configuration, or environment feedback satisfies exploit conditions
  evidence_refs:
  - REF-000121
  confidence: medium
- canonical_ref: NJS-0069-002
  name:
    zh: 良性客户端工作流耦合触发
    en: Benign Client-Workflow-Coupled Trigger
  stable_variable:
    zh: 把漏洞触发绑定到正常浏览、预览、打开或渲染动作，使执行前序与日常用户行为一致
    en: binding exploit triggering to ordinary browsing, preview, opening, or rendering so the precursor matches routine user behavior
  evidence_refs:
  - REF-000121
  confidence: medium
