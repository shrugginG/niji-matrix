research:
  limitations:
    paragraphs:
    - zh: IPC 广泛用于正常软件协调，端点名称或管道存在不能证明执行滥用；公开证据常描述接口和案例，但跨平台消息级遥测覆盖差异很大。
      en: IPC is pervasive in normal software coordination, and an endpoint name or pipe does not prove execution abuse. Public evidence describes interfaces and cases, but message-level
        telemetry coverage varies substantially across platforms.
