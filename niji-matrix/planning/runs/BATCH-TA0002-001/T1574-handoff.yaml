research:
  limitations:
    paragraphs:
    - zh: 软件安装、更新和调试会合法改变依赖与搜索路径；并非所有劫持都降低可见性，粗糙替换可能造成崩溃或明显完整性差异。
      en: Software installation, updates, and debugging legitimately change dependencies and search paths. Not every hijack reduces visibility, and crude replacement may cause crashes
        or conspicuous integrity differences.
