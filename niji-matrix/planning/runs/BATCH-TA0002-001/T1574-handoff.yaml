handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-001
work_item_ref: WORK-TA0002-T1574
temporary_key_prefix: EX1-T1574
candidate:
  source_type: attack
  source_attack_id: T1574
  name:
    zh: 劫持执行流
    en: Hijack Execution Flow
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
    - zh: 恶意载荷可沿合法程序的搜索和加载流程进入进程，父进程、签名外壳和启动时机因而保持正常；异常残留在路径优先级、依赖完整性、环境配置和模块来源，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: the payload can enter a process through a legitimate program''s search and load flow, preserving a normal parent, signed outer
        process, and trigger time; residual anomalies remain in path precedence, dependency integrity, environment configuration, and module provenance. It forms a stable stealth chain
        and is recommended for retain.'
proposed_content:
  summary:
    zh: 攻击者通过操纵操作系统或应用查找、加载或调用程序与共享代码的规则，使合法执行流转向攻击者载荷，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: manipulating rules by which an operating system or application locates, loads, or invokes programs and shared code so a legitimate
      execution flow is redirected to an adversary payload. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: 执行流劫持是指操纵操作系统或应用查找、加载或调用程序与共享代码的规则，使合法执行流转向攻击者载荷。其直接目标是让攻击者代码由既有程序、服务或加载器触发，并继承其执行情境；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: Hijack Execution Flow means manipulating rules by which an operating system or application locates, loads, or invokes programs and shared code so a legitimate execution flow
        is redirected to an adversary payload. Its direct objective is to have adversary code triggered by an existing program, service, or loader and inherit its execution context.
        Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool,
        product, or file format.
  stealth_characteristics:
    paragraphs:
    - zh: 执行流劫持的匿迹性来自恶意载荷可沿合法程序的搜索和加载流程进入进程，父进程、签名外壳和启动时机因而保持正常；异常残留在路径优先级、依赖完整性、环境配置和模块来源。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of Hijack Execution Flow has the following basis: the payload can enter a process through a legitimate program''s search and load flow, preserving a normal parent,
        signed outer process, and trigger time; residual anomalies remain in path precedence, dependency integrity, environment configuration, and module provenance. This changes trace
        relationships involving execution provenance, timing, parent process, content visibility, or control layers, forcing defenders to recover intent across data domains. Control
        invocations, process outcomes, integrity differences, and temporal relationships remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入通过路径优先级、依赖替换或加载配置改变而产生的执行流重定向；排除按 DLL、dylib、注册表或操作系统继承 ATT&CK 子项、纯客户端漏洞利用、直接进程注入和普通解释器调用。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes execution-flow redirection caused by path precedence, dependency replacement, or load-configuration change and excludes ATT&CK children inherited by
        DLL, dylib, registry, or operating system, pure client exploitation, direct process injection, and ordinary interpreter invocation. Legitimate operations, software functions,
        user interaction, or automation can produce similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation and
        advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已能写入搜索路径、依赖文件或加载配置，希望在受信应用、服务、安装器或运行时下一次启动时执行载荷时使用。
        en: An adversary uses the technique after gaining write access to a search path, dependency, or load configuration and wants a trusted application, service, installer, or runtime
          to execute the payload on a subsequent start.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要识别目标加载规则、可写位置和触发程序，并维持名称、架构和接口兼容；权限、完整性保护与安全搜索路径会限制其选择。
          en: The adversary needs knowledge of target load rules, a writable location, and a trigger program and must preserve name, architecture, and interface compatibility; permissions,
            integrity protection, and safe search paths constrain options.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够观察文件与配置变更、模块加载、进程启动和签名信息，但若只信任顶层进程或不保留加载路径，恶意依赖容易被忽略。
          en: The defender is assumed to observe file and configuration changes, module loads, process starts, and signing information, but malicious dependencies are easily missed when
            only the top-level process is trusted or load paths are not retained.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用合法程序和加载器的执行特征
      en: Borrow execution features of a legitimate program and loader
    analysis:
      paragraphs:
      - zh: 该行为设计使恶意代码在受信进程或服务启动链内被加载，顶层进程身份保持正常。恶意活动与合法实体共享可见特征，单点规则难以准确区分，因而形成特征伪装效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means malicious code loads inside a trusted process or service start chain while top-level process identity remains normal. The malicious activity shares
          visible features with legitimate entities, weakening point classification and producing a Feature Disguise effect. Residual observables still include control requests, process
          outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000122
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 利用依赖搜索和加载路径遥测缺口
      en: Exploit telemetry gaps in dependency search and load paths
    analysis:
      paragraphs:
      - zh: 该行为设计使防守方可能看见合法进程启动却没有记录它实际解析和选择了哪个依赖。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means the defender may see a legitimate process start without recording which dependency it resolved and selected. Critical execution semantics fall
          outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency effect. Residual
          observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000122
    confidence: medium
proposed_subtechniques:
- canonical_ref: NJS-0070-001
  name:
    zh: 受信加载器搜索优先级遮蔽
    en: Trusted-Loader Search-Precedence Shadowing
  stable_variable:
    zh: 在更高优先级可写位置放置兼容载荷，让加载器在合法依赖之前选中攻击者对象
    en: placing a compatible payload in a higher-priority writable location so the loader selects the adversary object before the legitimate dependency
  evidence_refs:
  - REF-000122
  confidence: medium
- canonical_ref: NJS-0070-002
  name:
    zh: 合法依赖完整性替换
    en: Legitimate-Dependency Integrity Substitution
  stable_variable:
    zh: 直接替换既有可执行文件、服务目标或共享依赖，同时维持预期路径和接口
    en: directly replacing an existing executable, service target, or shared dependency while preserving the expected path and interface
  evidence_refs:
  - REF-000122
  confidence: medium
