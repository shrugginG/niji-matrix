research:
  limitations:
    paragraphs:
    - zh: 故障排查和自动化会频繁使用相同 exec 接口；工作负载内出现 shell 不能单独证明攻击，且未启用运行时进程遥测的环境难以确认命令实际落地。
      en: Troubleshooting and automation frequently use the same exec interfaces. A shell inside a workload does not prove an attack by itself, and environments without runtime process
        telemetry may not confirm that a command materialized.
