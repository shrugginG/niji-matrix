work_item_ref: WORK-TA0002-T1609
temporary_key_prefix: EX1-T1609
candidate:
  source_type: attack
  source_attack_id: T1609
  name:
    zh: 容器管理命令
    en: Container Administration Command
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 管理命令可使用合法 API、工具和自动化身份，来宾进程又出现在既有工作负载中；控制面与容器运行时若不关联，来源和意图难以判断，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: management commands can use legitimate APIs, tools, and automation identities while the resulting process appears inside an existing
        workload; provenance and intent are difficult to judge when control-plane and container runtime telemetry are not correlated. It forms a stable stealth chain and is recommended
        for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过滥用 Docker、Kubernetes 或同类容器管理服务，在既有容器或 Pod 中远程运行攻击者命令，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: abusing Docker, Kubernetes, or equivalent container-management services to run adversary commands remotely inside an existing container
      or pod. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化容器管理命令执行是指滥用 Docker、Kubernetes 或同类容器管理服务，在既有容器或 Pod 中远程运行攻击者命令。其直接目标是从管理面把执行送入工作负载命名空间，并借用现有容器环境承载后续行为；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: Stealth-Conforming Container Administration Command Execution means abusing Docker, Kubernetes, or equivalent container-management services to run adversary commands remotely
        inside an existing container or pod. Its direct objective is to deliver execution from the management plane into a workload namespace and use an existing container environment
        for follow-on behavior. Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution
        path rather than by tool, product, or file format.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化容器管理命令执行的匿迹性来自管理命令可使用合法 API、工具和自动化身份，来宾进程又出现在既有工作负载中；控制面与容器运行时若不关联，来源和意图难以判断。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of Stealth-Conforming Container Administration Command Execution has the following basis: management commands can use legitimate APIs, tools, and automation identities
        while the resulting process appears inside an existing workload; provenance and intent are difficult to judge when control-plane and container runtime telemetry are not correlated.
        This changes trace relationships involving execution provenance, timing, parent process, content visibility, or control layers, forcing defenders to recover intent across data
        domains. Control invocations, process outcomes, integrity differences, and temporal relationships remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入通过容器管理服务对已运行容器执行命令或开启交互会话；排除新建容器部署、容器内与管理面无关的普通 shell，以及按 Docker 或 Kubernetes 产品名划分的子项。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes command execution or interactive sessions against an already running container through a container-management service and excludes new container deployment,
        ordinary in-container shells unrelated to the management plane, and child categories based on Docker or Kubernetes product names. Legitimate operations, software functions, user
        interaction, or automation can produce similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation and advance
        malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得容器 API、kubelet、编排身份或管理工作站权限后，希望在现有工作负载内运行发现、凭据获取或载荷启动命令时使用。
        en: An adversary uses the technique after obtaining container API, kubelet, orchestration-identity, or management-workstation access and wants to run discovery, credential-access,
          or payload-launch commands inside an existing workload.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要对 exec 类动作和目标工作负载具有权限，并知道容器身份、命名空间及可用程序；RBAC、API 网络限制和运行时最小权限会约束其操作。
          en: The adversary needs permission for exec-like actions against the target workload and knowledge of container identity, namespace, and available programs; RBAC, API network
            restrictions, and runtime least privilege constrain operations.
      defender_model:
        paragraphs:
        - zh: 防守方假定可见容器审计请求与运行时进程，但需要共同的用户、请求、Pod、容器与时间键才能区分合法故障排查和恶意执行。
          en: The defender is assumed to see container audit requests and runtime processes but needs common user, request, pod, container, and time keys to distinguish legitimate troubleshooting
            from malicious execution.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用既有工作负载和管理自动化的正常外观
      en: Borrow the normal appearance of an existing workload and management automation
    analysis:
      paragraphs:
      - zh: 该行为设计使命令由合法控制面接口发起并在已批准容器身份内形成进程。恶意活动与合法实体共享可见特征，单点规则难以准确区分，因而形成特征伪装效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means the command originates through a legitimate control-plane interface and creates a process inside an approved container identity. The malicious
          activity shares visible features with legitimate entities, weakening point classification and producing a Feature Disguise effect. Residual observables still include control
          requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000118
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 利用容器审计与运行时进程之间的关联缺口
      en: Exploit the correlation gap between container audit and runtime process telemetry
    analysis:
      paragraphs:
      - zh: 该行为设计使单一日志域无法同时说明谁发起管理请求以及容器内实际运行了什么。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means no single logging domain shows both who initiated the management request and what actually ran inside the container. Critical execution semantics
          fall outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency effect.
          Residual observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000118
    confidence: medium
