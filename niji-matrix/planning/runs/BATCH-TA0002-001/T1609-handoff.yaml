  confidence: medium
- canonical_ref: NJS-0066-002
  name:
    zh: 自动化身份执行合形
    en: Automation-Identity Exec Conformity
  stable_variable:
    zh: 使用常见自动化主体、管理源和目标集合发起 exec 请求，使控制面事件贴近正常运维基线
    en: issuing exec requests through a common automation principal, management origin, and target set so control-plane events conform to the operations baseline
  evidence_refs:
  - REF-000118
  confidence: medium
