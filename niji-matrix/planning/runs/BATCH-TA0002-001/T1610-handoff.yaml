research:
  limitations:
    paragraphs:
    - zh: 弹性扩缩、临时作业和持续部署会产生大量短命新容器；名称或公共镜像本身不能证明恶意，且镜像内静态检查无法覆盖启动后取得的内容。
      en: Autoscaling, ephemeral jobs, and continuous delivery create many short-lived containers. A name or public image does not prove maliciousness, and static image inspection cannot
        cover content retrieved after start.
