  confidence: medium
- canonical_ref: NJS-0067-002
  name:
    zh: 工作负载规格情境伪装
    en: Workload-Specification Context Camouflage
  stable_variable:
    zh: 让名称、标签、控制器、资源请求、服务账户和调度位置贴合目标命名空间的正常部署模式
    en: aligning name, labels, controller, resource requests, service account, and placement with normal deployment patterns in the target namespace
  evidence_refs:
  - REF-000119
  confidence: medium
