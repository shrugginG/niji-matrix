handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-001
work_item_ref: WORK-TA0002-T1610
temporary_key_prefix: EX1-T1610
candidate:
  source_type: attack
  source_attack_id: T1610
  name:
    zh: 部署容器
    en: Deploy Container
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 新工作负载可复用常见镜像、命名和部署对象，真实载荷还可在启动后取得；但创建审计、规格差异、镜像来源和首个进程或网络动作仍留下关联线索，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: a new workload can reuse common images, names, and deployment objects while retrieving the real payload after start, although
        creation audit, specification differences, image provenance, and first process or network action remain correlatable. It forms a stable stealth chain and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过在目标容器环境中创建并启动新的容器、Pod 或编排工作负载，使其镜像入口点或运行时命令执行攻击者代码，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: creating and starting a new container, pod, or orchestrated workload in the target environment so its image entrypoint or runtime
      command executes adversary code. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化容器部署执行是指在目标容器环境中创建并启动新的容器、Pod 或编排工作负载，使其镜像入口点或运行时命令执行攻击者代码。其直接目标是把攻击执行包装成正常工作负载部署，并利用容器配置获得所需网络、挂载或权限；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: Stealth-Conforming Container Deployment Execution means creating and starting a new container, pod, or orchestrated workload in the target environment so its image entrypoint
        or runtime command executes adversary code. Its direct objective is to package adversary execution as a normal workload deployment and obtain needed network, mount, or privilege
        settings through container configuration. Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its
        direct execution path rather than by tool, product, or file format.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化容器部署执行的匿迹性来自新工作负载可复用常见镜像、命名和部署对象，真实载荷还可在启动后取得；但创建审计、规格差异、镜像来源和首个进程或网络动作仍留下关联线索。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of Stealth-Conforming Container Deployment Execution has the following basis: a new workload can reuse common images, names, and deployment objects while retrieving
        the real payload after start, although creation audit, specification differences, image provenance, and first process or network action remain correlatable. This changes trace
        relationships involving execution provenance, timing, parent process, content visibility, or control layers, forcing defenders to recover intent across data domains. Control
        invocations, process outcomes, integrity differences, and temporal relationships remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入为承载攻击执行而创建或启动的新容器及其直接部署配置；排除在既有容器中执行命令、交付前污染镜像供应链以及仅按编排器或镜像类型划分的分类。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes a newly created or started container and its direct deployment configuration when used to carry adversary execution and excludes command execution inside
        an existing container, pre-delivery compromise of an image supply chain, and categories based only on orchestrator or image type. Legitimate operations, software functions, user
        interaction, or automation can produce similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation and advance
        malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得容器创建权限后，需要在集群中运行挖矿、发现、反向连接、主机逃逸准备或其他载荷，并希望部署对象看似普通业务变更时使用。
        en: An adversary uses the technique after gaining container-creation permission and needs to run mining, discovery, reverse-connection, host-escape preparation, or another payload
          while making the deployment resemble an ordinary business change.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要创建工作负载的 API 权限、可拉取或可引用的镜像以及对调度、网络和安全上下文的足够控制；准入策略和签名验证会限制可用配置。
          en: The adversary needs API permission to create workloads, a pullable or referenceable image, and sufficient control of scheduling, networking, and security context; admission
            policy and signature verification constrain usable specifications.
      defender_model:
        paragraphs:
        - zh: 防守方假定保留创建者、规格、镜像摘要、准入结果、运行时进程和网络遥测，并能把容器创建到首个行为放在短窗口内关联。
          en: The defender is assumed to retain creator, specification, image digest, admission result, runtime process, and network telemetry and to correlate container creation with
            first behavior in a short window.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 以普通工作负载规格和镜像外观包装载荷
      en: Wrap the payload in ordinary workload specification and image appearance
    analysis:
      paragraphs:
      - zh: 该行为设计使恶意容器在名称、控制器、基础镜像和部署接口上接近合法发布。恶意活动与合法实体共享可见特征，单点规则难以准确区分，因而形成特征伪装效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means the malicious container resembles a legitimate release in name, controller, base image, and deployment interface. The malicious activity shares
          visible features with legitimate entities, weakening point classification and producing a Feature Disguise effect. Residual observables still include control requests, process
          outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000119
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 把真实载荷取得推迟到容器启动后
      en: Delay acquisition of the real payload until after container start
    analysis:
      paragraphs:
      - zh: 该行为设计使创建时可检查的镜像和规格不包含完整执行内容，关键行为出现在运行时。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means the image and specification inspectable at creation do not contain complete execution content and critical behavior appears at runtime. Critical
          execution semantics fall outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency
          effect. Residual observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000119
    confidence: medium
