research:
  limitations:
    paragraphs:
    - zh: 维护、自动化和事件响应会产生相同命令服务事件；匿迹判断取决于主体、时间、目标集合和来宾结果的联合偏差，而不是云 API 的存在本身。
      en: Maintenance, automation, and incident response produce the same command-service events. Stealth assessment depends on combined deviations in principal, time, target set, and
        guest outcome rather than the mere presence of a cloud API call.
