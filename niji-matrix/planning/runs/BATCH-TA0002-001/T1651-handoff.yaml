candidate:
  source_type: attack
  source_attack_id: T1651
  name:
    zh: 云管理命令
    en: Cloud Administration Command
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 控制动作使用云平台原生 API、受权身份和常驻代理，控制平面调用与来宾进程又可能落在分离的日志域，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: control actions use cloud-native APIs, authorized identities, and resident agents while control-plane calls and guest processes
        may land in separate logging domains. It forms a stable stealth chain and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过滥用云管理服务和已安装的虚拟机代理，从控制平面向来宾系统下发并运行命令或脚本，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: abusing cloud management services and installed virtual-machine agents to dispatch and run commands or scripts from the control plane
      inside guest systems. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化云管理命令执行是指滥用云管理服务和已安装的虚拟机代理，从控制平面向来宾系统下发并运行命令或脚本。其直接目标是通过受信管理通道取得来宾内执行，而不建立传统入站远程会话；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: Stealth-Conforming Cloud Administration Command Execution means abusing cloud management services and installed virtual-machine agents to dispatch and run commands or scripts
        from the control plane inside guest systems. Its direct objective is to obtain in-guest execution through a trusted management channel without establishing a conventional inbound
        remote session. Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather
        than by tool, product, or file format.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化云管理命令执行的匿迹性来自控制动作使用云平台原生 API、受权身份和常驻代理，控制平面调用与来宾进程又可能落在分离的日志域。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of Stealth-Conforming Cloud Administration Command Execution has the following basis: control actions use cloud-native APIs, authorized identities, and resident
        agents while control-plane calls and guest processes may land in separate logging domains. This changes trace relationships involving execution provenance, timing, parent process,
        content visibility, or control layers, forcing defenders to recover intent across data domains. Control invocations, process outcomes, integrity differences, and temporal relationships
        remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由云管理面命令服务直接触发的来宾脚本、命令和程序执行；排除容器管理命令、一般 Cloud API 解释器调用、软件部署套件以及普通远程登录。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes guest script, command, and program execution directly triggered by a cloud-management command service and excludes container administration commands,
        generic Cloud API interpreter calls, software-deployment suites, and ordinary remote logons. Legitimate operations, software functions, user interaction, or automation can produce
        similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得云租户管理员、虚拟机贡献者、服务主体或委托管理权限后，希望从平台控制面跨多个来宾执行发现、载荷启动或破坏命令时使用。
        en: An adversary uses the technique after obtaining tenant administrator, virtual-machine contributor, service-principal, or delegated-management rights and wants to execute
          discovery, payload-launch, or destructive commands across guests from the platform control plane.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要可调用命令服务的云权限、目标来宾上的健康代理以及可接受的脚本或命令内容；最小权限、即时授权和代理状态会限制其覆盖。
          en: The adversary needs cloud permission to invoke the command service, a healthy agent in the target guest, and accepted script or command content; least privilege, just-in-time
            authorization, and agent state constrain coverage.
      defender_model:
        paragraphs:
        - zh: 防守方假定保留云审计、身份角色、请求 ID 和来宾进程遥测，但若控制面与端点团队分别观察，合法 API 调用和来宾执行可能无法自动拼接。
          en: The defender is assumed to retain cloud audit, identity-role, request-ID, and guest-process telemetry, but legitimate-looking API calls and guest execution may not be joined
            automatically when control-plane and endpoint teams observe separately.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 以原生管理动作和受权身份伪装执行来源
      en: Disguise execution provenance as native management activity by an authorized identity
    analysis:
      paragraphs:
      - zh: 该行为设计使控制事件具有与合法运维相同的服务、代理和 API 特征。恶意活动与合法实体共享可见特征，单点规则难以准确区分，因而形成特征伪装效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means control events carry the same service, agent, and API features as legitimate operations. The malicious activity shares visible features with legitimate
          entities, weakening point classification and producing a Feature Disguise effect. Residual observables still include control requests, process outcomes, integrity changes,
          or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000116
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 利用控制面与来宾遥测分离隐藏因果链
      en: Exploit separation between control-plane and guest telemetry to hide causality
    analysis:
      paragraphs:
      - zh: 该行为设计使一个视角只见管理请求，另一个视角只见代理或系统进程派生的命令。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means one vantage sees only a management request while another sees only a command spawned by an agent or system process. Critical execution semantics
          fall outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency effect.
          Residual observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000116
    confidence: medium
