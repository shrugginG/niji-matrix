research:
  limitations:
    paragraphs:
    - zh: 无障碍工具、宏、测试自动化和快速打字可产生相似信号；人类节奏只是环境相关推断，必须与新设备、异常焦点跳转、剪贴板内容和执行结果联合判断。
      en: Accessibility tools, macros, test automation, and fast typing can produce similar signals. Human cadence is an environment-dependent inference and must be assessed with new-device,
        unusual focus-change, clipboard, and execution outcomes.
