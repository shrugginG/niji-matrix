handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-001
work_item_ref: WORK-TA0002-T1674
temporary_key_prefix: EX1-T1674
candidate:
  source_type: attack
  source_attack_id: T1674
  name:
    zh: 输入注入
    en: Input Injection
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 输入事件可与真实用户操作共享会话、前台应用和交互接口，并可按当前页面或窗口条件触发；残余差异存在于设备枚举、输入速度、焦点变化和进程结果，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: input events can share a session, foreground application, and interaction interface with real user activity and can trigger on
        current page or window context; residual differences remain in device enumeration, input cadence, focus changes, and process outcomes. It forms a stable stealth chain and is
        recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过通过软件消息、自动化接口或物理 HID 模拟键盘、鼠标及 GUI 输入，使受害者活动会话代为启动命令或操作，并利用执行路径的正常外观或观察断点降低识别和归因概率。
    en: 'Adversaries perform the following behavior: simulating keyboard, mouse, or GUI input through software messages, automation interfaces, or a physical HID so an active victim
      session launches commands or actions on the adversary''s behalf. They exploit normal execution appearance or observation breaks to reduce detection and attribution.'
  definition_and_concept:
    paragraphs:
    - zh: 类用户输入注入执行是指通过软件消息、自动化接口或物理 HID 模拟键盘、鼠标及 GUI 输入，使受害者活动会话代为启动命令或操作。其直接目标是借用用户会话和界面路径完成执行，使动作看似来自本地交互；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、产品或文件格式界定对象。
      en: User-Mimetic Input Injection Execution means simulating keyboard, mouse, or GUI input through software messages, automation interfaces, or a physical HID so an active victim
        session launches commands or actions on the adversary's behalf. Its direct objective is to execute through a user session and interface path so actions appear to originate from
        local interaction. Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path
        rather than by tool, product, or file format.
  stealth_characteristics:
    paragraphs:
    - zh: 类用户输入注入执行的匿迹性来自输入事件可与真实用户操作共享会话、前台应用和交互接口，并可按当前页面或窗口条件触发；残余差异存在于设备枚举、输入速度、焦点变化和进程结果。这会改变执行来源、时间、父进程、内容可见性或控制层之间的痕迹关系，使防守方需要跨数据域恢复意图；相关控制调用、进程结果、完整性差异和时间关系仍是残余可观测线索。
      en: 'The stealth of User-Mimetic Input Injection Execution has the following basis: input events can share a session, foreground application, and interaction interface with real
        user activity and can trigger on current page or window context; residual differences remain in device enumeration, input cadence, focus changes, and process outcomes. This changes
        trace relationships involving execution provenance, timing, parent process, content visibility, or control layers, forcing defenders to recover intent across data domains. Control
        invocations, process outcomes, integrity differences, and temporal relationships remain residual observables.'
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由攻击者生成并由会话或应用解释为用户输入的执行触发；排除用户理解诱导后主动复制或运行命令、直接解释器或 API 调用，以及不产生执行结果的普通自动化测试。合法运维、软件功能、用户交互或自动化可能产生相似痕迹，只有攻击者有意利用相应执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes execution triggers generated by the adversary and interpreted by a session or application as user input and excludes a user voluntarily copying or running
        a command after understanding a lure, direct interpreter or API calls, and ordinary automation tests without an adversary execution outcome. Legitimate operations, software functions,
        user interaction, or automation can produce similar traces; the object applies only when the adversary intentionally uses the execution path to change defender observation and
        advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者控制恶意软件、远程交互通道或伪装 HID，希望在已登录桌面、浏览器或 GUI 应用中触发命令、脚本或交易篡改时使用。
        en: An adversary uses the technique through malware, a remote interaction path, or a disguised HID to trigger commands, scripts, or transaction manipulation in a logged-on desktop,
          browser, or GUI application.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要向活动会话注入输入、预测界面焦点或监测触发情境；锁屏、输入隔离、设备控制和界面差异会降低可靠性。
          en: The adversary needs to inject input into an active session, predict interface focus, or monitor trigger context; screen lock, input isolation, device control, and interface
            variation reduce reliability.
      defender_model:
        paragraphs:
        - zh: 防守方假定可见设备枚举、窗口焦点、输入节奏、剪贴板或消息事件及进程创建，但操作系统通常不会给每个输入保留可靠的人类或程序来源标签。
          en: The defender is assumed to see device enumeration, window focus, input cadence, clipboard or message events, and process creation, although operating systems often do not
            retain a reliable human-versus-program origin label for every input.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 让程序动作呈现为本地用户输入
      en: Make programmatic actions appear as local user input
    analysis:
      paragraphs:
      - zh: 该行为设计使命令启动前序是标准键盘、鼠标或 GUI 事件并发生在真实用户会话中。恶意活动与合法实体共享可见特征，单点规则难以准确区分，因而形成特征伪装效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means the command precursor consists of standard keyboard, mouse, or GUI events inside a real user session. The malicious activity shares visible features
          with legitimate entities, weakening point classification and producing a Feature Disguise effect. Residual observables still include control requests, process outcomes, integrity
          changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000123
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 利用输入来源归因不足隐藏自动化控制
      en: Exploit weak input-origin attribution to hide automated control
    analysis:
      paragraphs:
      - zh: 该行为设计使系统可能记录结果进程却不能可靠说明每个输入由人、软件还是外设生成。关键执行语义落在原有监控或关联逻辑之外，防守方虽可见局部结果却难以还原完整因果，因此形成行为透明效果。残余可观测线索仍包括控制请求、进程结果、完整性变化或跨层时间关系，扩大遥测范围可以削弱这种匿迹。
        en: This behavior design means the system may record the resulting process without reliably stating whether each input came from a person, software, or peripheral. Critical execution
          semantics fall outside existing monitoring or correlation logic. Defenders may see local outcomes but struggle to recover full causality, producing a Behavioral Transparency
          effect. Residual observables still include control requests, process outcomes, integrity changes, or cross-layer timing, so broader telemetry can weaken the stealth effect.
    evidence_refs:
    - REF-000123
    confidence: medium
proposed_subtechniques:
- canonical_ref: NJS-0071-001
  name:
    zh: 人类节奏输入模拟
    en: Human-Cadence Input Mimicry
  stable_variable:
    zh: 控制按键间隔、鼠标路径和操作停顿，使自动输入避开瞬时高频序列
    en: controlling key intervals, pointer paths, and action pauses so automated input avoids instantaneous high-rate sequences
  evidence_refs:
  - REF-000123
  confidence: medium
- canonical_ref: NJS-0071-002
  name:
    zh: 活动会话情境门控输入
    en: Active-Session Context-Gated Input
  stable_variable:
    zh: 仅在特定窗口、URL、应用状态或用户会话条件满足时注入后续输入
    en: injecting follow-on input only when a particular window, URL, application state, or user-session condition is present
  evidence_refs:
  - REF-000123
  confidence: medium
- canonical_ref: NJS-0071-003
  name:
    zh: 外设来源用户输入冒充
    en: Peripheral-Origin User-Input Impersonation
  stable_variable:
    zh: 让物理设备枚举为标准键盘或鼠标并生成执行序列，使输入从可信 HID 栈进入
    en: having a physical device enumerate as a standard keyboard or mouse and generate an execution sequence through the trusted HID stack
  evidence_refs:
  - REF-000123
  confidence: medium
