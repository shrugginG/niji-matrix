research:
  limitations:
    paragraphs:
    - zh: 备份、支持和自动化管理也会调用来宾操作；当前公开证据稳定支持的是单一 hypervisor-to-guest 通道变量，尚不足以按 API 方法、来宾系统或工具继续拆分 Niji 子技术。
      en: Backup, support, and automation also invoke guest operations. Current public evidence stably supports one hypervisor-to-guest channel variable and does not justify further
        Niji children by API method, guest operating system, or tool.
