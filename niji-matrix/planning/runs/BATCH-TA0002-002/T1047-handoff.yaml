research:
  limitations:
    paragraphs:
    - zh: 资产管理、运维脚本和安全工具会合法使用 WMI；父页面直接支持本地、远程及 provider-hosted 执行，但日常管理情境合形必须由环境基线而非通用规则验证。
      en: Asset management, operations scripts, and security tools legitimately use WMI. The parent page directly supports local, remote, and provider-hosted execution, but routine-administration
        conformity must be validated against environment baselines rather than universal rules.
