batch_ref: BATCH-TA0002-002
work_item_ref: WORK-TA0002-T1047
temporary_key_prefix: EX2-T1047
candidate:
  source_type: attack
  source_attack_id: T1047
  name:
    zh: Windows 管理规范
    en: Windows Management Instrumentation
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
    - zh: 目标进程可由 WMI provider 宿主派生而不直接显示远程请求者，攻击者还可让命名空间、方法、账户和时间贴合日常管理，使 DCOM 或 WinRM 请求与本地结果分处不同日志，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: the target process may be spawned by a WMI provider host without directly showing the remote requester, while namespace, method,
        account, and timing can conform to routine administration and DCOM or WinRM requests remain in logs separate from local outcomes. It forms a stable stealth chain and is recommended
        for retain.'
proposed_content:
  summary:
    zh: 攻击者通过通过 WMI/CIM 管理基础设施在本地或远程目标调用能够创建进程或执行载荷的方法，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: using WMI or CIM management infrastructure to invoke methods that create processes or execute payloads on local or remote targets.
      They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化 WMI 执行是指通过 WMI/CIM 管理基础设施在本地或远程目标调用能够创建进程或执行载荷的方法。其直接目标是借助 Windows 内建统一管理接口和 provider 宿主取得管理上下文中的执行；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Stealth-Conforming WMI Execution means using WMI or CIM management infrastructure to invoke methods that create processes or execute payloads on local or remote targets. Its
        direct objective is to obtain execution in a management context through the built-in Windows management interface and provider hosts. Under the Execution tactic, the object ends
        when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化 WMI 执行的匿迹性来自目标进程可由 WMI provider 宿主派生而不直接显示远程请求者，攻击者还可让命名空间、方法、账户和时间贴合日常管理，使 DCOM 或 WinRM 请求与本地结果分处不同日志。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Stealth-Conforming WMI Execution arises because the target process may be spawned by a WMI provider host without directly showing the remote requester, while
        namespace, method, account, and timing can conform to routine administration and DCOM or WinRM requests remain in logs separate from local outcomes. These properties change visible
        relationships in execution origin, timing, content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process
        or function outcomes, and network behavior remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由 WMI/CIM 方法调用直接产生本地或远程代码、命令或载荷执行的行为；排除只进行发现查询、通过 WMI 创建未来计划任务但未直接执行、一般远程服务会话、IPC 执行和不使用 WMI provider 的软件部署。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes behavior where a WMI or CIM method invocation directly causes local or remote code, command, or payload execution and excludes discovery-only queries,
        creating a future scheduled task through WMI without direct execution, general remote-service sessions, IPC execution, and software deployment that does not use a WMI provider.
        Legitimate operations, development, automation, or user activity may produce similar traces; the object applies only when the adversary deliberately uses the execution path to
        change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者拥有本地 WMI 权限或远程管理凭据，希望在目标上创建进程、运行脚本或调用管理操作，同时借用内建 provider 与管理员活动外观时使用该技术。
        en: An adversary uses this technique with local WMI permission or remote management credentials to create a process, run a script, or invoke a management operation while borrowing
          built-in provider and administrator activity appearance.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要 WMI 命名空间与方法权限、远程认证和网络可达性或本地 COM 访问，并理解 provider 行为；防火墙、UAC、命名空间 ACL 和协议限制会阻断路径。
          en: The adversary needs WMI namespace and method permission, remote authentication and reachability or local COM access, and knowledge of provider behavior; firewalls, UAC,
            namespace ACLs, and protocol restrictions can block the path.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得 WMI Activity、认证、DCOM 或 WinRM 网络、provider 宿主和进程谱系，但不同日志未必共享请求 ID，wmic.exe 的弃用也使仅监控单一客户端失效。
          en: The defender is assumed to collect WMI Activity, authentication, DCOM or WinRM network, provider-host, and process lineage, but logs may not share request IDs and deprecation
            of wmic.exe makes monitoring one client insufficient.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: Provider 宿主与跨主机日志遮断请求来源
      en: Provider hosts and cross-host logs obscure request origin
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使WMI 服务在目标侧由 provider 宿主执行方法并派生结果。由此，本地进程树显示 provider 为父级且不直接包含远程控制主体，而关键行为落在既有监控或分析理解之外，形成行为透明效果。不过，WMI Activity、认证、网络和 provider 操作仍可跨层关联；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the WMI service executes a method through a provider host on the target and spawns the outcome. As a result,
          the local process tree shows the provider as parent and does not directly contain the remote controlling principal. Critical behavior falls outside existing monitoring or analytic
          understanding, producing a Behavioral Transparency effect. However, WMI Activity, authentication, network, and provider operations remain cross-layer correlatable; cross-layer
          collection and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000134
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 方法与身份贴合正常管理基线
      en: Methods and identities conform to normal administration baselines
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使攻击者选择常用命名空间、方法、管理员或管理时段。由此，单个 WMI 调用或 provider 子进程难以与合法运维区分，而恶意实体与正常实体共享可见特征而难以区分，形成特征伪装效果。不过，来源主机、目标范围、参数和结果仍会形成行为偏差；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the adversary selects common namespaces, methods, administrators, or management windows. As a result, one WMI
          call or provider child process is difficult to distinguish from legitimate operations. The malicious entity shares visible features with normal entities and becomes difficult
          to distinguish, producing a Feature Disguise effect. However, source host, target scope, parameters, and outcomes still produce behavioral deviations; cross-layer collection
          and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000134
    confidence: medium
