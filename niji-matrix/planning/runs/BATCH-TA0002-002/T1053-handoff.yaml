  name:
    zh: 基线合形计划激活
    en: Baseline-Conforming Scheduled Activation
  stable_variable:
    zh: 让任务名称、执行账户、时间窗口和频率与目标环境的正常维护或业务计划一致
    en: aligning task name, execution account, time window, and frequency with normal maintenance or business schedules in the target environment
  evidence_refs:
  - REF-000127
  confidence: medium
- canonical_ref: NJS-0075-002
  name:
    zh: 长周期延期计划执行
    en: Long-Horizon Deferred Scheduled Execution
  stable_variable:
    zh: 把任务登记与第一次或关键执行安排在不同日志保留窗口、登录会话或启动周期
    en: placing task registration and its first or critical execution in different log-retention windows, login sessions, or boot cycles
  evidence_refs:
  - REF-000127
  confidence: medium
