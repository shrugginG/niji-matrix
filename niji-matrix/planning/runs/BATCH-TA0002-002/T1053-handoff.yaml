handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-002
work_item_ref: WORK-TA0002-T1053
temporary_key_prefix: EX2-T1053
candidate:
  source_type: attack
  source_attack_id: T1053
  name:
    zh: 计划任务/作业
    en: Scheduled Task/Job
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
    - zh: 任务创建与实际执行可以跨越监控窗口，调度器又以系统或指定账户启动进程，攻击者还可让名称、时间和频率贴合正常维护基线，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: task creation and actual execution can cross monitoring windows, the scheduler launches processes under system or specified accounts,
        and the adversary can align names, timing, and frequency with a normal maintenance baseline. It forms a stable stealth chain and is recommended for retain.'
proposed_content:
  summary:
    zh: 攻击者通过在操作系统、设备或编排平台的调度器中登记任务，并在指定时间、周期或条件满足时启动攻击者代码，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: registering a task with an operating-system, device, or orchestration scheduler so adversary code starts at a specified time, recurrence,
      or condition. They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化计划执行是指在操作系统、设备或编排平台的调度器中登记任务，并在指定时间、周期或条件满足时启动攻击者代码。其直接目标是把执行委托给受信调度器并控制激活时刻或重复节奏；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Stealth-Conforming Scheduled Execution means registering a task with an operating-system, device, or orchestration scheduler so adversary code starts at a specified time, recurrence,
        or condition. Its direct objective is to delegate execution to a trusted scheduler while controlling activation time or recurrence cadence. Under the Execution tactic, the object
        ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化计划执行的匿迹性来自任务创建与实际执行可以跨越监控窗口，调度器又以系统或指定账户启动进程，攻击者还可让名称、时间和频率贴合正常维护基线。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Stealth-Conforming Scheduled Execution arises because task creation and actual execution can cross monitoring windows, the scheduler launches processes under
        system or specified accounts, and the adversary can align names, timing, and frequency with a normal maintenance baseline. These properties change visible relationships in execution
        origin, timing, content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process or function outcomes, and
        network behavior remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入调度器保存未来触发条件并最终直接启动攻击者控制代码的单次或重复任务；排除BITS 专用作业、直接服务启动、无调度状态的 sleep 循环，以及只用于持久化但没有本批次执行语义的配置。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes one-time or recurring tasks whose future trigger state is retained by a scheduler and ultimately starts adversary-controlled code and excludes BITS-specific
        jobs, direct service starts, sleep loops without scheduler state, and configurations used only for persistence without execution semantics in this batch. Legitimate operations,
        development, automation, or user activity may produce similar traces; the object applies only when the adversary deliberately uses the execution path to change defender observation
        and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已取得创建任务的本地或远程权限，希望延迟载荷、在特定业务窗口运行，或让调度器以另一受权上下文启动程序时使用该技术。
        en: An adversary uses this technique after obtaining local or remote task-creation rights and wants to delay a payload, run within a selected business window, or have the scheduler
          launch a program under another authorized context.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要调度器写权限、有效载荷路径或内联命令以及对目标时间或条件的了解；远程调度和高权限账户通常要求额外认证。
          en: The adversary needs scheduler write permission, a payload path or inline command, and knowledge of target timing or conditions; remote scheduling and privileged accounts
            commonly require additional authentication.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得任务创建或修改事件、任务定义、账户与进程谱系，但短保留期、跨重启和多平台调度格式会切断创建—触发—结果关联。
          en: The defender is assumed to have task creation or modification events, task definitions, accounts, and process lineage, but short retention, reboots, and heterogeneous scheduler
            formats can break creation-to-trigger-to-outcome correlation.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 调度状态分离任务登记与真实执行
      en: Scheduler state separates task registration from actual execution
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使任务定义先被保存并在未来时间或条件满足时启动。由此，创建和执行落入不同窗口或启动周期，短查询只看到一端，而信号被分散到不同时间或位置而难以重建，形成时空释痕效果。不过，任务标识、定义版本、触发记录和后继进程仍可重建；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the task definition is retained and starts only at a future time or condition. As a result, creation and execution
          land in different windows or boot cycles so short queries see only one end. Signals are dispersed across time or location and become difficult to reconstruct, producing a Spatiotemporal
          Trace Dilution effect. However, task identifiers, definition versions, trigger records, and successor processes can still reconstruct the chain; cross-layer collection and
          causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000127
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 任务名称与节奏贴合正常维护基线
      en: Task names and cadence conform to maintenance baselines
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使攻击者选择与既有作业相似的名称、账户、窗口和频率。由此，可见任务难以由单点属性与合法自动化区分，而恶意实体与正常实体共享可见特征而难以区分，形成特征伪装效果。不过，创建来源、命令内容、异常目标和结果行为仍会产生差异；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the adversary chooses names, accounts, windows, and frequencies resembling existing jobs. As a result, the
          visible task cannot readily be separated from legitimate automation by a point attribute. The malicious entity shares visible features with normal entities and becomes difficult
          to distinguish, producing a Feature Disguise effect. However, creation origin, command content, unusual targets, and outcome behavior still create deviations; cross-layer collection
          and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000127
    confidence: medium
