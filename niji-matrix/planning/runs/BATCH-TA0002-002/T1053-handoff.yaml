research:
  limitations:
    paragraphs:
    - zh: 备份、更新、编排和用户自动化会产生大量相似任务；计划时间或系统父进程都不能单独证明攻击者意图，必须结合定义来源、变更主体和后继结果。
      en: Backup, update, orchestration, and user automation create many similar tasks. Scheduled time or a system parent process alone does not establish adversary intent and must be
        combined with definition provenance, modifying principal, and follow-on outcomes.
