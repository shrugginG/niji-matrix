    - zh: 正常补丁、配置和应急响应会产生相似批量执行；只有任务来源、批准状态、目标选择、制品完整性或结果行为偏离基线时，才能提高恶意判断置信度。
      en: Normal patching, configuration, and incident response produce similar fleet execution. Confidence rises only when task origin, approval state, target selection, artifact integrity,
        or outcome behavior deviates from baseline.
