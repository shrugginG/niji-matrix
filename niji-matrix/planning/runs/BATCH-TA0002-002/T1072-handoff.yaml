batch_ref: BATCH-TA0002-002
work_item_ref: WORK-TA0002-T1072
temporary_key_prefix: EX2-T1072
candidate:
  source_type: attack
  source_attack_id: T1072
  name:
    zh: 软件部署工具
    en: Software Deployment Tools
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
    - zh: 执行由常驻管理代理和高权限服务身份发起，任务可采用合法包名与维护窗口并分批下发，使控制面操作与终端进程分处不同日志域，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: execution originates from resident management agents and privileged service identities, tasks can use legitimate package names
        and maintenance windows and roll out in stages, and control-plane actions are separated from endpoint processes across logging domains. It forms a stable stealth chain and is
        recommended for retain.'
proposed_content:
  summary:
    zh: 攻击者通过滥用企业软件分发、配置管理、端点管理或网络设备管理套件向受管目标下发并执行包、脚本或命令，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: abusing enterprise software distribution, configuration management, endpoint management, or network-device management suites to dispatch
      and execute packages, scripts, or commands on managed targets. They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection
      and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 受信软件部署执行是指滥用企业软件分发、配置管理、端点管理或网络设备管理套件向受管目标下发并执行包、脚本或命令。其直接目标是借用集中管理平台的广泛信任和代理覆盖取得远程或批量执行；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Trusted Software-Deployment Execution means abusing enterprise software distribution, configuration management, endpoint management, or network-device management suites to
        dispatch and execute packages, scripts, or commands on managed targets. Its direct objective is to obtain remote or fleet-wide execution through the broad trust and agent coverage
        of a centralized management platform. Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct
        execution path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 受信软件部署执行的匿迹性来自执行由常驻管理代理和高权限服务身份发起，任务可采用合法包名与维护窗口并分批下发，使控制面操作与终端进程分处不同日志域。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Trusted Software-Deployment Execution arises because execution originates from resident management agents and privileged service identities, tasks can use legitimate
        package names and maintenance windows and roll out in stages, and control-plane actions are separated from endpoint processes across logging domains. These properties change
        visible relationships in execution origin, timing, content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences,
        process or function outcomes, and network behavior remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由集中部署或配置管理系统直接向已注册目标发起并最终运行的攻击任务；排除云虚拟机专用代理命令、CI/CD 构建步骤、普通远程会话、服务管理器直接执行和只分发不运行的文件传输。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes adversary tasks issued directly by centralized deployment or configuration-management systems to registered targets and ultimately executed there and
        excludes cloud-VM-specific agent commands, CI/CD build steps, ordinary remote sessions, direct service-manager execution, and file distribution without execution. Legitimate
        operations, development, automation, or user activity may produce similar traces; the object applies only when the adversary deliberately uses the execution path to change defender
        observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得部署控制台、管理服务器或其服务账户权限，希望从一个受信中心向多个终端、服务器或网络设备运行载荷时使用该技术。
        en: An adversary uses this technique after gaining control of a deployment console, management server, or service account and wants to execute a payload from one trusted center
          across endpoints, servers, or network devices.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要部署任务权限、受管目标覆盖和可接受的包或脚本，并了解审批、签名、维护窗口和代理状态；分段网络与双人审批会限制范围。
          en: The adversary needs deployment-task permission, coverage of managed targets, and an accepted package or script and must understand approval, signing, maintenance windows,
            and agent state; segmentation and dual approval limit reach.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得控制台审计、任务或包版本、代理结果和终端进程，但必须跨管理平台与终端关联同一部署 ID，且受信代理父进程会降低单点可疑度。
          en: The defender is assumed to collect console audit, task or package versions, agent results, and endpoint processes, but must correlate one deployment identifier across management
            and endpoint systems, while the trusted agent parent lowers point anomaly.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 部署任务借用受信代理与维护外观
      en: Deployment tasks borrow trusted agents and maintenance appearance
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使任务使用正常控制台、服务身份、包命名和维护窗口。由此，终端只看到受信代理派生进程，单点特征难以与合法部署区分，而恶意实体与正常实体共享可见特征而难以区分，形成特征伪装效果。不过，控制台主体、审批、包哈希和目标选择仍可比较；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that tasks use normal consoles, service identities, package names, and maintenance windows. As a result, endpoints
          see only trusted-agent child processes that point features cannot readily distinguish from legitimate deployment. The malicious entity shares visible features with normal entities
          and becomes difficult to distinguish, producing a Feature Disguise effect. However, console principals, approvals, package hashes, and target selection remain comparable; cross-layer
          collection and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000130
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 分批下发稀释集中终端异常
      en: Staged rollout dilutes fleet-wide endpoint anomalies
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使同一载荷按小批次、不同目标和延迟波次执行。由此，每个时间窗或网段的异常量低于大规模部署阈值，而信号被分散到不同时间或位置而难以重建，形成时空释痕效果。不过，共享任务 ID、包版本和控制台来源仍可跨波次聚合；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the same payload executes in small batches across different targets and delayed waves. As a result, anomaly
          volume in each time window or segment stays below a mass-deployment threshold. Signals are dispersed across time or location and become difficult to reconstruct, producing
          a Spatiotemporal Trace Dilution effect. However, shared task IDs, package versions, and console origin still aggregate across waves; cross-layer collection and causal correlation
          can weaken this stealth effect.
    evidence_refs:
    - REF-000130
    confidence: medium
