candidate:
  source_type: attack
  source_attack_id: T1106
  name:
    zh: 原生 API
    en: Native API
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 攻击者可绕过受监控的高层接口或在运行时解析调用目标，使用户态挂钩、静态导入表和命令行遥测只看到不完整的调用语义，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: an adversary can bypass monitored high-level interfaces or resolve call targets at runtime so that user-mode hooks, static import
        tables, and command-line telemetry expose only incomplete invocation semantics. It forms a stable stealth chain and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过直接或间接调用操作系统原生 API 来创建进程、线程、内存映射或其他促成代码运行的底层操作，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: directly or indirectly invoking native operating-system APIs for low-level operations that create processes, threads, memory mappings,
      or other code-execution effects. They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化原生 API 执行是指直接或间接调用操作系统原生 API 来创建进程、线程、内存映射或其他促成代码运行的底层操作。其直接目标是在不依赖明显解释器或高层执行外壳的情况下取得本机执行；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Stealth-Conforming Native API Execution means directly or indirectly invoking native operating-system APIs for low-level operations that create processes, threads, memory mappings,
        or other code-execution effects. Its direct objective is to obtain local execution without depending on a conspicuous interpreter or high-level execution wrapper. Under the Execution
        tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化原生 API 执行的匿迹性来自攻击者可绕过受监控的高层接口或在运行时解析调用目标，使用户态挂钩、静态导入表和命令行遥测只看到不完整的调用语义。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Stealth-Conforming Native API Execution arises because an adversary can bypass monitored high-level interfaces or resolve call targets at runtime so that user-mode
        hooks, static import tables, and command-line telemetry expose only incomplete invocation semantics. These properties change visible relationships in execution origin, timing,
        content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process or function outcomes, and network behavior
        remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入以原生 API 调用路径直接产生执行结果并有意降低接口或静态关系可见性的实现；排除普通业务软件的常规 API 使用、由解释器解析的命令、IPC 请求、模块搜索路径劫持以及以进程注入为直接对象的后续行为。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes implementations in which a native-API call path directly produces execution and is deliberately selected to reduce interface or static-relationship
        visibility and excludes routine API use by normal software, interpreter-parsed commands, IPC requests, module search-path hijacking, and follow-on behavior whose direct object
        is process injection. Legitimate operations, development, automation, or user activity may produce similar traces; the object applies only when the adversary deliberately uses
        the execution path to change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已在端点进程内获得代码执行，希望启动后继线程、进程或内存载荷，同时减少命令解释器、稳定导入符号或被挂钩高层 API 暴露的线索时使用该技术。
        en: An adversary uses this technique after gaining code execution inside an endpoint process and needs to start a successor thread, process, or memory payload while reducing
          clues exposed by command interpreters, stable import symbols, or hooked high-level APIs.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要理解目标操作系统的调用约定、版本差异和权限边界，并能控制调用路径或符号解析；直接系统调用在版本变化、内核防护或错误参数下可能失败。
          en: The adversary needs knowledge of operating-system calling conventions, version differences, and privilege boundaries, together with control of invocation or symbol resolution;
            direct system calls may fail under version changes, kernel protections, or incorrect parameters.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得进程、线程、内存和部分 API 或系统调用遥测，但用户态传感器可能位于被绕过的封装层，静态扫描也可能缺少运行时解析后的真实调用关系。
          en: The defender is assumed to collect process, thread, memory, and some API or system-call telemetry, but user-mode sensors may sit in a bypassed wrapper layer and static
            inspection may lack the true call relationships resolved at runtime.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 绕过高层监控接口保留不完整调用视图
      en: Bypass high-level monitored interfaces and leave an incomplete call view
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使调用直接进入更低层系统服务而不经过传感器所在封装。由此，缺少原始高层调用者、参数语义或挂钩事件，难以恢复执行意图，而关键行为落在既有监控或分析理解之外，形成行为透明效果。不过，内核事件、线程创建、内存权限变化和后继进程仍会残留；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the invocation enters a lower-level system service without traversing the instrumented wrapper. As a result,
          lacks the original high-level caller, parameter semantics, or hook event and therefore cannot readily recover execution intent. Critical behavior falls outside existing monitoring
          or analytic understanding, producing a Behavioral Transparency effect. However, kernel events, thread creation, memory-protection changes, and successor processes remain; cross-layer
          collection and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000125
    confidence: medium
  - mechanism_ref: NM-DO
    role: secondary
    summary:
      zh: 运行时解析削弱静态 API 身份可解释性
      en: Runtime resolution weakens static interpretability of API identity
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使API 名称与地址只在运行时解析而不形成稳定导入关系。由此，即使取得二进制也难以从静态导入直接理解其执行语义，而数据虽然存在却不能直接解释真实内容或意图，形成数据遮蔽效果。不过，解析循环、散列常量、调用栈和最终系统服务仍可关联；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that API names and addresses are resolved only at runtime instead of forming stable import relationships. As a result,
          cannot directly understand execution semantics from static imports even when the binary is available. The data exists but does not directly reveal true content or intent, producing
          a Data Obscuration effect. However, resolution loops, hash constants, call stacks, and final system services can still be correlated; cross-layer collection and causal correlation
          can weaken this stealth effect.
    evidence_refs:
    - REF-000125
    confidence: medium
