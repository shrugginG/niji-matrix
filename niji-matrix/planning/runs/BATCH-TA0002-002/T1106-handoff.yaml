research:
  limitations:
    paragraphs:
    - zh: 原生 API 广泛用于正常软件，单个调用不能证明恶意；固定基线直接支持系统调用绕过挂钩和动态解析实例，但跨平台调用链与传感器覆盖差异要求以中等置信度解释。
      en: Native APIs are ubiquitous in benign software, so one call does not establish maliciousness. The fixed baseline directly supports syscall-based hook bypass and dynamic-resolution
        examples, but cross-platform call paths and sensor coverage differences require medium-confidence interpretation.
