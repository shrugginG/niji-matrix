handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-002
work_item_ref: WORK-TA0002-T1127
temporary_key_prefix: EX2-T1127
candidate:
  source_type: attack
  source_attack_id: T1127
  name:
    zh: 受信开发者实用程序代理执行
    en: Trusted Developer Utilities Proxy Execution
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 恶意逻辑位于项目、配置、调试或内存输入中，而可见父进程保持受信签名与正常工具身份，某些实现还不产生独立可执行制品，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: malicious logic resides in project, configuration, debugging, or memory input while the visible parent retains a trusted signature
        and normal tool identity, and some implementations create no separate executable artifact. It forms a stable stealth chain and is recommended for retain.'
proposed_content:
  summary:
    zh: 攻击者通过向受信且常带有效签名的开发、构建、调试或部署实用程序提供攻击者控制输入，使其代理执行恶意代码，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: supplying adversary-controlled input to trusted and often validly signed development, build, debugging, or deployment utilities so
      they proxy malicious code execution. They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 受信开发实用程序代理执行是指向受信且常带有效签名的开发、构建、调试或部署实用程序提供攻击者控制输入，使其代理执行恶意代码。其直接目标是借用受信工具信誉和执行能力绕过只按签名、路径或程序身份实施的应用控制；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Trusted Developer-Utility Proxy Execution means supplying adversary-controlled input to trusted and often validly signed development, build, debugging, or deployment utilities
        so they proxy malicious code execution. Its direct objective is to borrow trusted-tool reputation and execution capability to bypass application controls based only on signature,
        path, or program identity. Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution
        path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 受信开发实用程序代理执行的匿迹性来自恶意逻辑位于项目、配置、调试或内存输入中，而可见父进程保持受信签名与正常工具身份，某些实现还不产生独立可执行制品。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Trusted Developer-Utility Proxy Execution arises because malicious logic resides in project, configuration, debugging, or memory input while the visible parent
        retains a trusted signature and normal tool identity, and some implementations create no separate executable artifact. These properties change visible relationships in execution
        origin, timing, content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process or function outcomes, and
        network behavior remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入受信开发实用程序直接解析攻击者输入并因此运行恶意代码的代理执行；排除普通解释器、共享模块加载、集中软件部署、仅编译但不运行攻击者代码的正常构建以及按具体工具名称继承的分类。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes proxy execution where a trusted developer utility directly parses adversary input and consequently runs malicious code and excludes ordinary interpreters,
        shared-module loading, centralized software deployment, normal builds that compile but do not run adversary code, and categories inherited by specific utility name. Legitimate
        operations, development, automation, or user activity may produce similar traces; the object applies only when the adversary deliberately uses the execution path to change defender
        observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者可在 Windows 端点运行已安装或可访问的开发实用程序，希望绕过应用允许列表、降低父进程可疑度或以内存方式执行输入时使用该技术。
        en: An adversary uses this technique on a Windows endpoint where an installed or accessible developer utility can run and wants to bypass application allowlisting, lower parent-process
          suspicion, or execute input in memory.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要可调用的受信实用程序、与其输入语法兼容的项目或配置以及足够的文件或命令权限；工具缺失、功能移除和行为控制会阻断路径。
          en: The adversary needs an invokable trusted utility, a project or configuration compatible with its input syntax, and sufficient file or command permission; utility absence,
            feature removal, and behavioral controls can block the path.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得进程谱系、签名、命令行、模块和文件事件，但若把受信签名视为最终结论，便会忽略工具输入和异常子进程或网络结果。
          en: The defender is assumed to collect process lineage, signatures, command lines, modules, and file events, but treating a trusted signature as a final conclusion causes utility
            inputs and anomalous child or network outcomes to be ignored.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 受信签名与工具身份掩饰恶意输入
      en: Trusted signatures and utility identity disguise malicious input
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使恶意逻辑由合法签名的开发实用程序解析和执行。由此，进程信誉和允许列表把可见父进程归为正常工具，而恶意实体与正常实体共享可见特征而难以区分，形成特征伪装效果。不过，命令行、项目输入、异常子进程和网络行为仍会偏离；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that malicious logic is parsed and executed by a legitimately signed developer utility. As a result, process reputation
          and allowlists classify the visible parent as a normal tool. The malicious entity shares visible features with normal entities and becomes difficult to distinguish, producing
          a Feature Disguise effect. However, command line, project input, unusual child processes, and network behavior still deviate; cross-layer collection and causal correlation
          can weaken this stealth effect.
    evidence_refs:
    - REF-000132
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 执行语义隐藏在工具输入与进程内部
      en: Execution semantics hide inside utility input and process
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使攻击代码作为项目、配置或内存输入进入工具而不以独立程序启动。由此，只观察程序身份或新可执行文件的检测缺少真实输入语义，而关键行为落在既有监控或分析理解之外，形成行为透明效果。不过，输入文件、内存映射、模块和结果链仍可采集；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that attack code enters the utility as project, configuration, or memory input rather than starting as a separate
          program. As a result, detections observing only program identity or new executables lack the true input semantics. Critical behavior falls outside existing monitoring or analytic
          understanding, producing a Behavioral Transparency effect. However, input files, memory mappings, modules, and outcome chains remain collectible; cross-layer collection and
          causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000132
    confidence: medium
