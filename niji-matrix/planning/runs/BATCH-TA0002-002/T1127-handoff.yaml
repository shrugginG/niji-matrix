research:
  limitations:
    paragraphs:
    - zh: 开发终端可能合法运行相同实用程序和复杂项目输入，阻断范围必须按角色与用途调优；ATT&CK 直接支持受信签名与应用控制绕过，但无独立制品分类仍为中等置信度推断。
      en: Developer endpoints may legitimately run the same utilities and complex project inputs, so blocking must be tuned by role and purpose. ATT&CK directly supports trusted signatures
        and application-control bypass, while the artifactless category remains a medium-confidence inference.
