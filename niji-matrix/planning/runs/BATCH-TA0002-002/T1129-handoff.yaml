research:
  limitations:
    paragraphs:
    - zh: 共享模块是正常软件架构的基础，加载事件本身误报率高；内存驻留与宿主借用边界来自公开实例的中等置信度归纳，必须以模块来源和后继行为校准。
      en: Shared modules are foundational to normal software architecture, so load events alone have a high false-positive rate. Memory residency and host borrowing are medium-confidence
        generalizations from public examples and must be calibrated with module provenance and follow-on behavior.
