batch_ref: BATCH-TA0002-002
work_item_ref: WORK-TA0002-T1129
temporary_key_prefix: EX2-T1129
candidate:
  source_type: attack
  source_attack_id: T1129
  name:
    zh: 共享模块
    en: Shared Modules
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 恶意逻辑可继承宿主进程身份且不产生独立进程，内存实例化还可减少可长期检查的模块文件、路径和静态加载关系，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: malicious logic can inherit the host process identity without a separate process, while memory instantiation can reduce durable
        module files, paths, and static load relationships available for inspection. It forms a stable stealth chain and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过通过受支持的模块加载接口把共享可执行模块装入进程，并调用其中入口或导出功能，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: loading a shared executable module into a process through supported loader interfaces and invoking an entry point or exported function.
      They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化共享模块执行是指通过受支持的模块加载接口把共享可执行模块装入进程，并调用其中入口或导出功能。其直接目标是在既有进程地址空间内执行可复用恶意功能而不必为每项能力启动独立程序；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Stealth-Conforming Shared-Module Execution means loading a shared executable module into a process through supported loader interfaces and invoking an entry point or exported
        function. Its direct objective is to execute reusable malicious functionality inside an existing process address space without starting a separate program for each capability.
        Under the Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool,
        platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化共享模块执行的匿迹性来自恶意逻辑可继承宿主进程身份且不产生独立进程，内存实例化还可减少可长期检查的模块文件、路径和静态加载关系。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Stealth-Conforming Shared-Module Execution arises because malicious logic can inherit the host process identity without a separate process, while memory instantiation
        can reduce durable module files, paths, and static load relationships available for inspection. These properties change visible relationships in execution origin, timing, content,
        or lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process or function outcomes, and network behavior remain residual
        observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由显式模块加载和函数调用直接执行恶意代码，并有意借用宿主进程或减少持久模块痕迹的实现；排除搜索顺序劫持、合法依赖替换、仅调用原生 API、IPC 请求以及没有执行入口的普通资源模块加载。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes implementations where explicit module loading and function invocation directly execute malicious code while deliberately borrowing a host process or
        reducing durable module traces and excludes search-order hijacking, legitimate-dependency substitution, native-API calls alone, IPC requests, and ordinary resource-module loads
        without an execution entry point. Legitimate operations, development, automation, or user activity may produce similar traces; the object applies only when the adversary deliberately
        uses the execution path to change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者控制一个加载器或可加载模块的进程，希望按需启用额外能力、复用宿主网络与权限情境，或减少独立载荷进程和落盘模块时使用该技术。
        en: An adversary uses this technique while controlling a loader or module-capable process and wants to enable additional capabilities on demand, reuse the host network and privilege
          context, or reduce separate payload processes and on-disk modules.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要与目标加载器兼容的模块或内存映像、调用入口知识和相应文件或进程访问；签名策略、加载器加固和架构不匹配会限制执行。
          en: The adversary needs a module or memory image compatible with the target loader, knowledge of callable entry points, and relevant file or process access; signing policy,
            loader hardening, and architecture mismatches constrain execution.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得模块加载、文件完整性和进程行为，但内存加载器可能没有标准模块事件，且宿主进程名称与签名不能解释其中模块的真实语义。
          en: The defender is assumed to collect module-load, file-integrity, and process behavior, but memory loaders may not emit standard module events and the host process name or
            signature does not explain the true semantics of loaded code.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 模块代码在既有宿主进程内运行
      en: Module code runs inside an existing host process
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使恶意能力被加载为进程内模块而非独立可执行进程。由此，进程创建视图缺少新的载荷节点且宿主身份遮断真实代码来源，而关键行为落在既有监控或分析理解之外，形成行为透明效果。不过，模块加载、内存映射、导出调用和异常后继行为仍可见；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that malicious capability is loaded as an in-process module instead of a separate executable process. As a result,
          process-creation views lack a new payload node and the host identity obscures the true code source. Critical behavior falls outside existing monitoring or analytic understanding,
          producing a Behavioral Transparency effect. However, module loads, memory mappings, export calls, and unusual follow-on behavior remain visible; cross-layer collection and
          causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000129
    confidence: medium
  - mechanism_ref: NM-DO
    role: secondary
    summary:
      zh: 内存实例化减少可解释的模块制品
      en: Memory instantiation reduces interpretable module artifacts
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使模块映像在内存中构造或反射加载而不保留标准落盘文件。由此，即使观察到内存区域也难以由路径、签名或文件哈希解释来源，而数据虽然存在却不能直接解释真实内容或意图，形成数据遮蔽效果。不过，映像头、内存权限、加载器行为和来源缓冲区仍可检查；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the module image is constructed or reflectively loaded in memory without a standard on-disk file. As a result,
          even an observed memory region cannot readily be explained by path, signature, or file hash. The data exists but does not directly reveal true content or intent, producing
          a Data Obscuration effect. However, image headers, memory permissions, loader behavior, and source buffers remain inspectable; cross-layer collection and causal correlation
          can weaken this stealth effect.
    evidence_refs:
    - REF-000129
    confidence: medium
