handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-002
work_item_ref: WORK-TA0002-T1204
temporary_key_prefix: EX2-T1204
candidate:
  source_type: attack
  source_attack_id: T1204
  name:
    zh: 用户执行
    en: User Execution
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 触发动作可贴合当前业务或支持工作流，诱导内容与最终进程又可能跨浏览器、文档、剪贴板、安装器和时间窗口分离，使单一表面只呈现正常用户活动，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: the trigger action can conform to an active business or support workflow while the lure and final process may be separated across
        browser, document, clipboard, installer, and time windows so each surface shows only ordinary user activity. It forms a stable stealth chain and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过诱导真实用户完成点击、打开、安装、复制粘贴或确认等动作，使攻击者代码开始运行，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: inducing a real user to click, open, install, copy and paste, confirm, or perform another action that starts adversary code. They
      exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 工作流合形用户执行是指诱导真实用户完成点击、打开、安装、复制粘贴或确认等动作，使攻击者代码开始运行。其直接目标是把最后执行触发交给已认证用户及其正常交互会话；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Workflow-Conforming User Execution means inducing a real user to click, open, install, copy and paste, confirm, or perform another action that starts adversary code. Its direct
        objective is to delegate the final execution trigger to an authenticated user and the user's normal interactive session. Under the Execution tactic, the object ends when adversary-controlled
        code, a command, or a task begins to run and is defined by its direct execution path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 工作流合形用户执行的匿迹性来自触发动作可贴合当前业务或支持工作流，诱导内容与最终进程又可能跨浏览器、文档、剪贴板、安装器和时间窗口分离，使单一表面只呈现正常用户活动。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Workflow-Conforming User Execution arises because the trigger action can conform to an active business or support workflow while the lure and final process may
        be separated across browser, document, clipboard, installer, and time windows so each surface shows only ordinary user activity. These properties change visible relationships
        in execution origin, timing, content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process or function outcomes,
        and network behavior remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入真实用户在攻击者诱导下主动完成最终触发动作且攻击者有意利用工作流相似性或因果分离降低识别的行为；排除伪造键鼠输入、客户端漏洞自动触发、钓鱼投递本身、没有代码执行结果的欺骗，以及按链接、文件、镜像或库类型继承的分类。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes behavior where a real user deliberately performs the final trigger under adversary influence and the adversary uses workflow similarity or causal separation
        to reduce recognition and excludes forged keyboard or mouse input, automatic client exploitation, phishing delivery itself, deception without a code-execution outcome, and categories
        inherited by link, file, image, or library type. Legitimate operations, development, automation, or user activity may produce similar traces; the object applies only when the
        adversary deliberately uses the execution path to change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已能向用户呈现可信内容或进入协作、支持、开发或共享资源情境，希望让用户的会话、权限与正常父进程代为启动载荷时使用该技术。
        en: An adversary uses this technique after being able to present trusted-looking content or enter a collaboration, support, development, or shared-resource context and wants
          the user's session, privileges, and normal parent process to launch the payload.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要接触用户、构造与当前任务相容的说明或制品，并预测用户权限和交互路径；培训、界面警告、内容隔离和用户拒绝会中断执行。
          en: The adversary needs access to the user, instructions or artifacts compatible with the current task, and knowledge of likely user privileges and interaction path; training,
            interface warnings, content isolation, and user refusal can interrupt execution.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得用户应用交互、内容来源、文件写入、剪贴板或安装事件和进程谱系，但隐私限制与跨应用标识缺失会妨碍从诱导到执行的关联。
          en: The defender is assumed to collect user-application interaction, content provenance, file writes, clipboard or installation events, and process lineage, but privacy limits
            and missing cross-application identifiers impede lure-to-execution correlation.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 诱导动作贴合用户当前工作流
      en: Induced actions conform to the user's current workflow
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使恶意请求采用与业务、支持或开发任务一致的界面和动作语义。由此，真实用户和常用应用产生的可见事件与合法操作高度相似，而恶意实体与正常实体共享可见特征而难以区分，形成特征伪装效果。不过，内容来源、异常指令、文件信誉和后继行为仍可比较；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the malicious request uses interface and action semantics consistent with business, support, or development
          tasks. As a result, visible events from a real user and common applications closely resemble legitimate operations. The malicious entity shares visible features with normal
          entities and becomes difficult to distinguish, producing a Feature Disguise effect. However, content provenance, unusual instructions, file reputation, and follow-on behavior
          remain comparable; cross-layer collection and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000133
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 多表面交互分离诱导与执行因果
      en: Multi-surface interaction separates lure and execution causality
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使呈现、复制、打开、确认和最终进程跨应用或时间发生。由此，每个日志域只看到一个正常动作而难以恢复完整链，而信号被分散到不同时间或位置而难以重建，形成时空释痕效果。不过，会话、内容哈希、剪贴板、下载来源和进程谱系仍可连接；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that presentation, copy, open, confirmation, and final process occur across applications or time. As a result, each
          logging domain sees one normal action and cannot readily recover the full chain. Signals are dispersed across time or location and become difficult to reconstruct, producing
          a Spatiotemporal Trace Dilution effect. However, session, content hash, clipboard, download origin, and process lineage can still connect the steps; cross-layer collection
          and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000133
    confidence: medium
