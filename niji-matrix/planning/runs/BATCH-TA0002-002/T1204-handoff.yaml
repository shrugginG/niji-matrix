research:
  limitations:
    paragraphs:
    - zh: 用户每天会执行大量合法点击、打开和安装操作，且遥测通常不能证明其心理状态；正式对象只判断可观察的诱导—动作—执行因果和攻击者设计，不把一般社会工程全部纳入。
      en: Users legitimately click, open, and install many items each day, and telemetry generally cannot prove mental state. The formal object evaluates observable lure-action-execution
        causality and adversary design rather than absorbing all social engineering.
