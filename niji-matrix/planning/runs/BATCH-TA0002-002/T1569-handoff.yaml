  stable_variable:
    zh: 快速创建、启动并删除临时服务，使服务状态只在极短窗口存在
    en: rapidly creating, starting, and deleting a temporary service so its state exists only in a very short window
  evidence_refs:
  - REF-000131
  confidence: medium
