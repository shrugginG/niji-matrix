candidate:
  source_type: attack
  source_attack_id: T1569
  name:
    zh: 系统服务
    en: System Services
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
    - zh: 进程可由受信服务管理器派生并继承服务身份，攻击者还可借用既有服务情境或快速压缩创建—启动—删除生命周期，削弱轮询盘点和父进程规则，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: processes may be spawned by a trusted service manager under service identity, while an adversary can borrow an existing service
        context or compress create-start-delete lifecycle to weaken polling inventory and parent-process rules. It forms a stable stealth chain and is recommended for retain.'
proposed_content:
  summary:
    zh: 攻击者通过与服务管理器或守护进程交互，创建、修改、启动或临时承载攻击者程序，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: interacting with a service manager or daemon to create, modify, start, or temporarily host an adversary program. They exploit trusted
      execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 匿迹化系统服务执行是指与服务管理器或守护进程交互，创建、修改、启动或临时承载攻击者程序。其直接目标是让高权限系统服务基础设施代理一次性或持续执行；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Stealth-Conforming System-Service Execution means interacting with a service manager or daemon to create, modify, start, or temporarily host an adversary program. Its direct
        objective is to have privileged system-service infrastructure broker one-time or continuing execution. Under the Execution tactic, the object ends when adversary-controlled code,
        a command, or a task begins to run and is defined by its direct execution path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹化系统服务执行的匿迹性来自进程可由受信服务管理器派生并继承服务身份，攻击者还可借用既有服务情境或快速压缩创建—启动—删除生命周期，削弱轮询盘点和父进程规则。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Stealth-Conforming System-Service Execution arises because processes may be spawned by a trusted service manager under service identity, while an adversary can
        borrow an existing service context or compress create-start-delete lifecycle to weaken polling inventory and parent-process rules. These properties change visible relationships
        in execution origin, timing, content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process or function outcomes,
        and network behavior remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由服务管理器或守护进程控制路径直接启动或承载攻击者代码的行为；排除服务文件或注册表路径劫持、未来调度任务、WMI 方法执行、普通解释器调用和没有运行代码的服务配置变化。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes behavior where a service-manager or daemon control path directly starts or hosts adversary code and excludes service file or registry path hijacking,
        future scheduled tasks, WMI method execution, ordinary interpreter calls, and service configuration changes that do not run code. Legitimate operations, development, automation,
        or user activity may produce similar traces; the object applies only when the adversary deliberately uses the execution path to change defender observation and advance malicious
        activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得本地或远程服务控制权限，希望以服务账户启动程序、在一次执行后清理服务对象，或借用已存在守护进程情境时使用该技术。
        en: An adversary uses this technique after obtaining local or remote service-control rights and wants to start a program under service identity, remove a service object after
          one execution, or borrow an existing daemon context.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要服务管理权限、可执行路径或参数控制，并理解服务账户、启动模式和平台控制接口；最小权限、完整性保护与服务策略会限制操作。
          en: The adversary needs service-management permission, control of executable path or arguments, and knowledge of service accounts, start modes, and platform control interfaces;
            least privilege, integrity protection, and service policy constrain the operation.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得服务创建修改事件、配置存储和进程谱系，但轮询式盘点可能错过短驻对象，受信服务管理器父进程也需要回溯到控制主体。
          en: The defender is assumed to collect service create or modify events, configuration stores, and process lineage, but polling inventory may miss short-lived objects and a
            trusted service-manager parent must be traced back to the controlling principal.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 服务管理器代理执行遮断原始主体
      en: Service-manager brokerage obscures the originating principal
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使攻击程序由系统服务管理器或守护进程派生或承载。由此，本地进程树把受信系统组件显示为父级而不直接呈现远程或先前控制者，而关键行为落在既有监控或分析理解之外，形成行为透明效果。不过，服务控制事件、配置来源、账户和二进制路径仍可关联；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the adversary program is spawned or hosted by a system service manager or daemon. As a result, the local process
          tree shows a trusted system component as parent without directly exposing the remote or earlier controller. Critical behavior falls outside existing monitoring or analytic
          understanding, producing a Behavioral Transparency effect. However, service-control events, configuration origin, account, and binary path remain correlatable; cross-layer
          collection and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000131
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 短驻服务压缩状态暴露时间
      en: Short-lived services compress state exposure time
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使服务对象在创建、启动和删除之间只存在很短时间。由此，定期盘点和短查询可能只看到进程结果或删除事件，而信号被分散到不同时间或位置而难以重建，形成时空释痕效果。不过，实时控制事件、注册表或配置日志和进程时间仍能重建；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the service object exists only briefly between creation, start, and deletion. As a result, periodic inventory
          and short queries may see only the process outcome or deletion. Signals are dispersed across time or location and become difficult to reconstruct, producing a Spatiotemporal
          Trace Dilution effect. However, real-time control events, registry or configuration logs, and process timing can reconstruct it; cross-layer collection and causal correlation
          can weaken this stealth effect.
    evidence_refs:
    - REF-000131
    confidence: medium
