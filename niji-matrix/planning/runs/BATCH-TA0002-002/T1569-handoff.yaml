research:
  limitations:
    paragraphs:
    - zh: 软件安装、更新和系统启动会产生大量合法服务变更；服务父进程、短寿命或高权限身份都不是独立恶意指标，必须结合创建来源、二进制完整性和结果。
      en: Software installation, updates, and system startup create many legitimate service changes. Service parentage, short lifetime, or privileged identity is not independently malicious
        and must be combined with creation origin, binary integrity, and outcomes.
