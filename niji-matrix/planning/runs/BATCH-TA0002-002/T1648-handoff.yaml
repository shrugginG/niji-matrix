research:
  limitations:
    paragraphs:
    - zh: 无服务器工作负载和事件自动化本来就具有短驻、弹性和高频特征；这些平台属性只有在攻击者有意利用它们削弱归因时才构成匿迹，服务商遥测差异会改变置信度。
      en: Serverless workloads and event automations are naturally ephemeral, elastic, and frequent. Those platform properties constitute stealth only when deliberately used to weaken
        attribution, and provider telemetry differences change confidence.
