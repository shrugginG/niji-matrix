candidate:
  source_type: attack
  source_attack_id: T1648
  name:
    zh: 无服务器执行
    en: Serverless Execution
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: 短驻实例没有稳定主机身份，函数配置、事件源、身份授权和运行结果又分散在控制面、服务日志与下游资源中，可让恶意调用混入正常自动化事件，能够形成稳定匿迹因果链；因此建议 adapt。
      en: 'The candidate has the following causal basis: short-lived instances lack a stable host identity while function configuration, event sources, identity grants, and outcomes
        are split across control-plane, service, and downstream-resource logs, allowing malicious invocations to blend into normal automation events. It forms a stable stealth chain
        and is recommended for adapt.'
proposed_content:
  summary:
    zh: 攻击者通过在云端函数、集成流或托管自动化服务中创建或修改代码，并由请求或云事件触发其运行，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: creating or modifying code in cloud functions, integration flows, or managed automation services and causing it to run on requests
      or cloud events. They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 痕迹分离型无服务器执行是指在云端函数、集成流或托管自动化服务中创建或修改代码，并由请求或云事件触发其运行。其直接目标是利用云提供方按需运行时和服务身份执行代码而不管理持续主机；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Trace-Separated Serverless Execution means creating or modifying code in cloud functions, integration flows, or managed automation services and causing it to run on requests
        or cloud events. Its direct objective is to execute code through provider-managed on-demand runtimes and service identities without managing a persistent host. Under the Execution
        tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool, platform, or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 痕迹分离型无服务器执行的匿迹性来自短驻实例没有稳定主机身份，函数配置、事件源、身份授权和运行结果又分散在控制面、服务日志与下游资源中，可让恶意调用混入正常自动化事件。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Trace-Separated Serverless Execution arises because short-lived instances lack a stable host identity while function configuration, event sources, identity grants,
        and outcomes are split across control-plane, service, and downstream-resource logs, allowing malicious invocations to blend into normal automation events. These properties change
        visible relationships in execution origin, timing, content, or lineage and force defenders to recover intent across data domains. Control requests, configuration differences,
        process or function outcomes, and network behavior remain residual observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入由云函数、SaaS 自动化或托管集成流直接执行攻击者代码，并有意利用短驻运行时或事件流改变可见性；排除虚拟机代理命令、容器命令或部署、CI/CD runner 执行，以及只创建云资源但没有代码运行的控制面活动。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes adversary code executed directly by cloud functions, SaaS automations, or managed integration flows with deliberate use of ephemeral runtime or event
        streams to change visibility and excludes virtual-machine agent commands, container commands or deployments, CI/CD runner execution, and control-plane activity that creates cloud
        resources without running code. Legitimate operations, development, automation, or user activity may produce similar traces; the object applies only when the adversary deliberately
        uses the execution path to change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得创建、修改或调用函数与自动化的云权限，希望在没有持续主机的情况下访问云数据、创建凭据、建立后继动作或执行资源滥用时使用该技术。
        en: An adversary uses this technique after obtaining cloud permission to create, modify, or invoke functions and automations and wants to access cloud data, create credentials,
          establish follow-on actions, or abuse resources without a persistent host.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要相应 IAM 或 SaaS 权限、可部署代码与可用触发源，并理解运行时限制、超时、角色继承和日志覆盖；无服务器配额与服务隔离会约束执行。
          en: The adversary needs applicable IAM or SaaS permissions, deployable code, and an available trigger source and must understand runtime limits, timeouts, role inheritance,
            and logging coverage; serverless quotas and service isolation constrain execution.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得控制面变更、函数版本、触发绑定、调用记录、IAM 与下游资源日志，但没有传统端点进程树，跨服务请求 ID 也可能缺失。
          en: The defender is assumed to collect control-plane changes, function versions, trigger bindings, invocation records, IAM, and downstream-resource logs, but there is no conventional
            endpoint process tree and cross-service request identifiers may be absent.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 无稳定主机的短驻运行时形成观察断点
      en: Ephemeral runtimes without stable hosts create observation breaks
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使代码在提供方按需实例中短暂运行并迅速回收。由此，端点传感器与传统进程谱系无法覆盖真实执行容器，而关键行为落在既有监控或分析理解之外，形成行为透明效果。不过，调用日志、函数版本、角色和下游 API 结果仍可见；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that code runs briefly in provider-created on-demand instances that are quickly reclaimed. As a result, endpoint
          sensors and conventional process lineage cannot cover the actual execution container. Critical behavior falls outside existing monitoring or analytic understanding, producing
          a Behavioral Transparency effect. However, invocation logs, function versions, roles, and downstream API outcomes remain visible; cross-layer collection and causal correlation
          can weaken this stealth effect.
    evidence_refs:
    - REF-000128
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 弹性实例与事件调用分散执行痕迹
      en: Elastic instances and event invocations disperse execution traces
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使同一逻辑跨多个短驻实例、区域或异步事件运行。由此，局部实例和短窗口只呈现零散调用而非完整操作，而信号被分散到不同时间或位置而难以重建，形成时空释痕效果。不过，函数版本、事件源、请求标识和角色可用于跨实例聚合；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that the same logic runs across multiple short-lived instances, regions, or asynchronous events. As a result, a
          local instance or short window shows isolated invocations rather than the full operation. Signals are dispersed across time or location and become difficult to reconstruct,
          producing a Spatiotemporal Trace Dilution effect. However, function version, event source, request identifier, and role can aggregate across instances; cross-layer collection
          and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000128
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 恶意调用混入正常自动化事件流
      en: Malicious invocations blend into normal automation event streams
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使触发器选择与高频业务事件相同的来源和服务身份。由此，单次调用在外观上难以与合法自动化区分，而恶意实体与正常实体共享可见特征而难以区分，形成特征伪装效果。不过，配置变化、异常参数和下游访问偏差仍会暴露差异；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that triggers use the same sources and service identities as high-volume business events. As a result, a single
          invocation is difficult to distinguish from legitimate automation by appearance. The malicious entity shares visible features with normal entities and becomes difficult to
          distinguish, producing a Feature Disguise effect. However, configuration changes, unusual parameters, and downstream-access deviations still expose differences; cross-layer
          collection and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000128
    confidence: medium
