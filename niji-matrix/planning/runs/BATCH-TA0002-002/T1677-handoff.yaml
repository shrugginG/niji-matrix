handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-002
work_item_ref: WORK-TA0002-T1677
temporary_key_prefix: EX2-T1677
candidate:
  source_type: attack
  source_attack_id: T1677
  name:
    zh: 投毒流水线执行
    en: Poisoned Pipeline Execution
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
    - zh: 执行由正常流水线身份、job 图和 runner 进程发起，恶意逻辑又可位于主配置之外或只在特定贡献情境满足时激活，能够形成稳定匿迹因果链；因此建议 retain。
      en: 'The candidate has the following causal basis: execution originates from normal pipeline identities, job graphs, and runner processes while malicious logic may reside outside
        the primary configuration or activate only in a selected contribution context. It forms a stable stealth chain and is recommended for retain.'
proposed_content:
  summary:
    zh: 攻击者通过把恶意代码注入 CI/CD 流水线定义、被引用构建输入或外部贡献触发路径，并由受信 runner 执行，并利用受信执行外观、内容不可见性或跨层因果断点降低识别与归因概率。
    en: 'Adversaries perform the following behavior: injecting malicious code into a CI/CD pipeline definition, referenced build input, or external-contribution trigger path so that
      a trusted runner executes it. They exploit trusted execution appearance, reduced content visibility, or cross-layer causal breaks to lower detection and attribution probability.'
  definition_and_concept:
    paragraphs:
    - zh: 流水线投毒执行是指把恶意代码注入 CI/CD 流水线定义、被引用构建输入或外部贡献触发路径，并由受信 runner 执行。其直接目标是借助组织既有自动化构建权限、秘密与网络位置运行攻击者逻辑；在攻击执行战术中，以攻击者控制的代码、命令或任务开始运行为完成点，并以直接执行路径而不是工具、平台或介质界定对象。
      en: Poisoned Pipeline Execution means injecting malicious code into a CI/CD pipeline definition, referenced build input, or external-contribution trigger path so that a trusted
        runner executes it. Its direct objective is to run adversary logic with the permissions, secrets, and network position of existing organizational build automation. Under the
        Execution tactic, the object ends when adversary-controlled code, a command, or a task begins to run and is defined by its direct execution path rather than by tool, platform,
        or medium.
  stealth_characteristics:
    paragraphs:
    - zh: 流水线投毒执行的匿迹性来自执行由正常流水线身份、job 图和 runner 进程发起，恶意逻辑又可位于主配置之外或只在特定贡献情境满足时激活。这些属性改变执行来源、时间、内容或父子谱系的可见关系，迫使防守方跨数据域恢复意图；控制请求、配置差异、进程或函数结果和网络行为仍是残余可观测线索。
      en: The stealth of Poisoned Pipeline Execution arises because execution originates from normal pipeline identities, job graphs, and runner processes while malicious logic may reside
        outside the primary configuration or activate only in a selected contribution context. These properties change visible relationships in execution origin, timing, content, or
        lineage and force defenders to recover intent across data domains. Control requests, configuration differences, process or function outcomes, and network behavior remain residual
        observables.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入在流水线执行图、其引用输入或攻击者可控触发元数据中植入最终由 CI/CD runner 执行的逻辑；排除交付前制品或依赖污染、仅使用软件部署平台执行终端命令、普通脚本执行以及不触发流水线运行的仓库修改。合法运维、开发、自动化或用户活动可能产生相似痕迹，只有攻击者有意利用该执行路径改变防守观察并推动恶意操作时才属于本对象。
      en: This technique includes logic planted in a pipeline execution graph, a referenced input, or adversary-controlled trigger metadata and ultimately executed by a CI/CD runner
        and excludes pre-delivery artifact or dependency compromise, endpoint command execution solely through software-deployment platforms, ordinary script execution, and repository
        changes that never trigger a pipeline run. Legitimate operations, development, automation, or user activity may produce similar traces; the object applies only when the adversary
        deliberately uses the execution path to change defender observation and advance malicious activity.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者获得仓库写权限、工作流修改能力或外部贡献入口，希望在构建、测试或发布过程中访问 runner 凭据、内部网络或制品权限时使用该技术。
        en: An adversary uses this technique after obtaining repository write access, workflow modification capability, or an external contribution path and wants to reach runner credentials,
          internal networks, or artifact privileges during build, test, or release activity.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要理解流水线触发语义、被引用文件和 runner 权限，并能修改至少一个受信输入；其行为受代码评审、分支保护、秘密隔离和 runner 沙箱约束。
          en: The adversary needs knowledge of pipeline trigger semantics, referenced files, and runner privileges and must control at least one trusted input; code review, branch protection,
            secret isolation, and runner sandboxing constrain the operation.
      defender_model:
        paragraphs:
        - zh: 防守方假定能够取得源代码管理审计、工作流版本、job 与 runner 日志、制品谱系和网络结果，但这些记录通常分属不同平台，单看成功构建不会暴露恶意意图。
          en: The defender is assumed to have source-control audit, workflow versions, job and runner logs, artifact lineage, and network outcomes, but those records commonly span platforms
            and a successful build alone does not expose malicious intent.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 恶意步骤由受信 runner 与自动化身份执行
      en: Malicious steps execute under trusted runners and automation identities
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使攻击代码进入既有 job 图并由 runner 进程承载。由此，端点视角只看到受信自动化父进程，仓库视角又未必记录间接输入语义，而关键行为落在既有监控或分析理解之外，形成行为透明效果。不过，工作流版本、runner job、秘密访问和网络结果仍可关联；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that attack code enters the existing job graph and is carried by runner processes. As a result, the endpoint sees
          only trusted automation parents while the repository view may omit indirect-input semantics. Critical behavior falls outside existing monitoring or analytic understanding,
          producing a Behavioral Transparency effect. However, workflow versions, runner jobs, secret access, and network outcomes remain correlatable; cross-layer collection and causal
          correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000126
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 投毒步骤贴合正常构建与测试结构
      en: Poisoned steps conform to normal build and test structure
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使恶意逻辑采用预期 job 名称、脚本位置和依赖调用方式。由此，评审者和规则难以从单一可见特征区分恶意构建输入，而恶意实体与正常实体共享可见特征而难以区分，形成特征伪装效果。不过，差异审查、作者身份、依赖来源和异常结果仍会留下偏差；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that malicious logic adopts expected job names, script locations, and dependency invocation patterns. As a result,
          reviewers and rules cannot readily distinguish the malicious build input from one visible feature. The malicious entity shares visible features with normal entities and becomes
          difficult to distinguish, producing a Feature Disguise effect. However, diff review, author identity, dependency provenance, and anomalous outcomes still leave deviations;
          cross-layer collection and causal correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000126
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 选择性触发把投毒与执行分散到不同事件
      en: Selective triggers separate poisoning from execution events
    analysis:
      paragraphs:
      - zh: 攻击者有意采用该行为设计，使修改、外部贡献和具权 runner 执行发生在不同主体与时间窗口。由此，短期仓库或 runner 查询只能看到攻击链片段，而信号被分散到不同时间或位置而难以重建，形成时空释痕效果。不过，提交、拉取请求、触发 ID 与 job 关联键仍可重建全链；跨层采集和因果关联能够削弱这种匿迹。
        en: The adversary deliberately adopts this behavior design so that modification, external contribution, and privileged runner execution occur under different principals and time
          windows. As a result, short repository or runner queries see only fragments of the attack chain. Signals are dispersed across time or location and become difficult to reconstruct,
          producing a Spatiotemporal Trace Dilution effect. However, commit, pull-request, trigger, and job identifiers can still reconstruct the chain; cross-layer collection and causal
          correlation can weaken this stealth effect.
    evidence_refs:
    - REF-000126
    confidence: medium
proposed_subtechniques:
- canonical_ref: NJS-0074-001
  name:
    zh: 受信流水线定义注入
    en: Trusted Pipeline-Definition Injection
  stable_variable:
    zh: 直接修改版本化流水线定义并把恶意命令登记为正常 job 或步骤
    en: directly modifying a versioned pipeline definition so a malicious command is registered as a normal job or step
  evidence_refs:
  - REF-000126
  confidence: medium
- canonical_ref: NJS-0074-002
  name:
    zh: 间接构建输入激活
    en: Indirect Build-Input Activation
  stable_variable:
    zh: 保持主流水线定义不变并把恶意逻辑放入其自动调用的测试、构建、检查或依赖输入
    en: leaving the primary pipeline definition unchanged while placing malicious logic in a test, build, check, or dependency input it automatically invokes
  evidence_refs:
  - REF-000126
  confidence: medium
- canonical_ref: NJS-0074-003
  name:
    zh: 外部贡献情境门控执行
    en: External-Contribution Context-Gated Execution
  stable_variable:
    zh: 构造 fork、拉取请求或元数据，仅在具权触发器检出该外部内容时激活恶意步骤
    en: crafting a fork, pull request, or metadata so a malicious step activates only when a privileged trigger checks out or consumes that external content
  evidence_refs:
  - REF-000126
  confidence: medium
