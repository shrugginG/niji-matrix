research:
  limitations:
    paragraphs:
    - zh: 流水线变更、外部贡献和测试脚本执行都是正常开发活动；父页面直接描述三类投毒位置和防御建议，但是否构成匿迹仍依赖攻击者对受信执行外观与触发条件的有意利用。
      en: Pipeline changes, external contributions, and test-script execution are normal development activity. The parent page directly describes three poisoning locations and defenses,
        but stealth still depends on deliberate exploitation of trusted execution appearance and trigger conditions.
