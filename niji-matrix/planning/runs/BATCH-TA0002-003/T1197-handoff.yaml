handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0002-003
work_item_ref: WORK-TA0002-T1197
temporary_key_prefix: EXR-T1197
candidate:
  source_type: attack
  source_attack_id: T1197
  name:
    zh: BITS 作业
    en: BITS Jobs
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: 固定 ATT&CK 19.1 父技术、Microsoft BITS 接口文档以及 UBoatRAT 和 Mandiant 现场案例共同确认，攻击者能够创建自包含的异步 BITS 作业、选择后台优先级、绑定 transferred 或 error 状态通知程序，并让 BITS
          在创建进程退出后继续管理传输或启动命令。该执行路径会把原始请求者、网络传输、持久作业状态和后继进程分散到不同观察面，因此保留为 TA0002 匿迹技术。
        en: The fixed ATT&CK 19.1 parent, Microsoft BITS interface documentation, and the UBoatRAT and Mandiant field cases jointly establish that an adversary can create self-contained
          asynchronous BITS jobs, select a background priority, bind a program to transferred or error notification, and let BITS continue managing the transfer or launch after the
          creating process exits. This path separates the original requester, network transfer, persistent job state, and successor process across observation surfaces, supporting
          retention under TA0002.
proposed_content:
  summary:
    zh: 攻击者把载荷取得和状态触发执行委托给持久化 BITS 作业，借用后台传输外观并分离创建、传输和回调痕迹。
    en: Adversaries delegate payload acquisition and state-triggered execution to persistent BITS jobs, borrowing background-transfer appearance while separating creation, transfer,
      and callback traces.
  definition_and_concept:
    paragraphs:
      - zh: 正式对象以 BITS 作业作为直接行为对象，覆盖作业创建、文件队列、传输状态、通知程序和实际执行结果；纯文件传输只有在与同一 BITS 执行链中的状态通知或明确后继执行耦合时才进入 TA0002。
        en: The formal object uses the BITS job as its direct behavior object and covers job creation, file queue, transfer state, notification program, and actual execution outcome. File
          transfer alone enters TA0002 only when coupled to state notification or explicit follow-on execution in the same BITS execution chain.
  stealth_characteristics:
    paragraphs:
      - zh: 匿迹效果来自 BITS 服务、QMGR 状态、后台带宽调节和用户上下文通知程序之间的痕迹分离，而不是 BITS 名称或系统签名本身。作业 GUID、所有者、优先级、URL、通知命令、状态转换和后继进程仍提供可恢复的残余链。
        en: The stealth effect comes from trace separation among the BITS service, QMGR state, background bandwidth adaptation, and user-context notification program rather than from the
          BITS name or system signature alone. Job GUID, owner, priority, URL, notification command, state transitions, and successor process remain as a recoverable residual
          chain.
  scope_boundary_definition:
    paragraphs:
      - zh: 范围排除没有执行语义的普通 BITS 传输、由 T1053 调度器保存的通用未来任务、由 T1569 服务管理器直接启动的程序和由 T1059 解释器本身完成的执行；合法更新与同步作业必须作为主要正常反例。
        en: Scope excludes ordinary BITS transfers without execution semantics, general future tasks retained by a T1053 scheduler, programs directly started by a T1569 service manager,
          and execution performed by a T1059 interpreter itself. Legitimate update and synchronization jobs remain the principal benign alternatives.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 典型场景包括以较低干扰取得载荷后由状态通知启动程序、以错误状态触发通知命令、在创建者退出或主机重启后继续等待，以及借用更新式 BITS 活动穿越只按请求进程或短时间窗口观察的防线。
          en: Typical scenarios include acquiring a payload with low foreground disruption before state notification launches a program, triggering a notify command through an error state,
            waiting after creator exit or host reboot, and borrowing update-like BITS activity against defenses limited to requester process or short windows.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者必须拥有创建或修改所属用户 BITS 作业的本地或远程会话能力，能够控制 URL、目标文件、优先级、重试属性、通知标志和程序参数，并接受登录状态、网络可用性、BITS 策略与用户权限的限制。
            en: The adversary must be able to create or modify a BITS job owned by the relevant user from a local or remote session, control URL, destination file, priority, retry properties,
              notification flags, and program arguments, and accept constraints from logon state, network availability, BITS policy, and user privilege.
      defender_model:
        paragraphs:
          - zh: 防守方需要同时覆盖命令或 COM 调用、BITS-Client Operational 日志、当前与已删除 QMGR 记录、网络连接和进程创建，并跨重启按作业 GUID、所有者、URL、通知程序和状态转换进行关联；缺失任一层都会降低因果恢复能力。
            en: The defender needs coverage of command or COM invocation, BITS-Client Operational events, active and deleted QMGR records, network connections, and process creation, with
              cross-reboot correlation by job GUID, owner, URL, notification program, and state transition. Missing any layer reduces causal recovery.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: BITS 服务与 QMGR 状态分离请求者和执行结果
        en: BITS service and QMGR state separate requester from execution outcome
      analysis:
        paragraphs:
          - zh: BITS 在服务宿主中管理作业，并把命令、文件和状态保存在 QMGR 数据库；通知程序又由 BITS 依据状态转换启动。仅观察创建工具、普通启动项或最终进程的防守方会缺少中间作业语义，因此形成行为透明。QMGR、BITS 事件和进程结果仍能恢复因果链。
            en: BITS manages jobs in a service host and stores command, file, and state information in the QMGR database; BITS then launches the notification program on a state transition. A
              defender observing only the creation tool, conventional autoruns, or final process lacks the intermediate job semantics, producing Behavioral Transparency. QMGR, BITS
              events, and process outcomes can still recover the chain.
      evidence_keys:
        - REF-000115
        - REF-000137
        - REF-000141
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary:
        zh: 异步状态与重试跨窗口分散创建传输和通知
        en: Asynchronous state and retry disperse creation transfer and notification across windows
      analysis:
        paragraphs:
          - zh: BITS 作业可在队列、连接、传输、瞬态错误、错误和 transferred 状态之间转换，并在网络或登录条件恢复后继续；未 Complete 或 Cancel 的作业还可长期保留。创建、网络活动和通知执行因此可能跨会话与重启出现，短期调查只看到片段，但作业 GUID 与时间戳仍支持长期重建。
            en: A BITS job can move through queued, connecting, transferring, transient-error, error, and transferred states and continue when network or logon conditions return; a job not
              completed or canceled can persist for an extended period. Creation, network activity, and notification execution may therefore cross sessions and reboots, leaving
              short investigations with fragments while job GUIDs and timestamps still support long-horizon reconstruction.
      evidence_keys:
        - REF-000115
        - REF-000136
        - REF-000138
        - REF-000140
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 后台优先级与更新式作业属性降低恶意可区分性
        en: Background priority and update-like job properties reduce malicious distinguishability
      analysis:
        paragraphs:
          - zh: 攻击者可以选择 normal 或 low 等后台优先级，让 BITS 随空闲带宽和网络成本调节传输，并可采用类似系统更新的作业名称。恶意作业因而与更新器和同步程序共享服务、流量节奏及元数据外观，单点特征难以区分；所有者、来源进程、URL、通知命令和后继行为仍会暴露差异。
            en: An adversary can select a background priority such as normal or low, allowing BITS to adapt transfer to idle bandwidth and network cost, and may adopt an update-like job name.
              The malicious job then shares service, traffic cadence, and metadata appearance with updaters and synchronization software, weakening point classification. Owner,
              creating process, URL, notification command, and follow-on behavior remain distinguishing evidence.
      evidence_keys:
        - REF-000135
        - REF-000139
        - REF-000141
      confidence: medium
proposed_subtechniques:
  - canonical_ref: NJS-0063-001
    name:
      zh: 活动感知型后台传输执行
      en: Activity-Aware Background Transfer Execution
    stable_variable:
      zh: 攻击者选择 background priority、网络成本策略和作业属性，使与状态触发执行耦合的传输随空闲带宽推进并贴近正常更新活动。
      en: The adversary selects background priority, network-cost policy, and job properties so a transfer coupled to state-triggered execution advances with idle bandwidth and resembles
        normal update activity.
    evidence_refs:
      - REF-000115
    evidence_keys:
      - REF-000135
      - REF-000139
      - REF-000141
    confidence: medium
  - canonical_ref: NJS-0063-002
    name:
      zh: 长驻作业延迟激活
      en: Long-Lived Job Deferred Activation
    stable_variable:
      zh: 攻击者把程序绑定到 transferred 或 error 状态，保留未完成作业并利用重试、登录恢复或重启后的作业寿命延迟和重复执行。
      en: The adversary binds a program to transferred or error state, leaves the job unfinalized, and uses retry, logon recovery, or post-reboot job lifetime to defer or repeat
        execution.
    evidence_refs:
      - REF-000115
    evidence_keys:
      - REF-000136
      - REF-000137
      - REF-000138
      - REF-000140
      - REF-000141
    confidence: high
