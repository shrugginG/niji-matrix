    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父技术与两个子技术已逐字段重写，定义、概念、范围、场景、攻防模型、机理和限制均完成 NJT-0001 问题覆盖对照；尚待机器、Bundle 与 Web 门禁。
      en: The parent and both children have been rewritten field by field. Definition, concept, scope, scenarios, attacker and defender models, mechanisms, and limitations complete the
        NJT-0001 question-coverage comparison; machine, bundle, and Web gates remain pending.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - 状态迁移
      - YAML 解析
      - ID 分配
      - Bundle 构建
      - 校验
  limitations:
    paragraphs:
      - zh: NJS-0063-001 由 Microsoft 接口能力、背景传输属性和 Mandiant 观测到的 normal-priority 恶意通知作业共同支持，但公开案例没有明确说明攻击者选择该优先级的主观目的，因此保持 medium。NJS-0063-002 有 Microsoft 通知语义、UBoatRAT 跨重启行为和 Mandiant
          错误触发案例，证据更强。
        en: NJS-0063-001 is jointly supported by Microsoft interface capability, background-transfer properties, and Mandiant's observed normal-priority malicious notification job, but
          public cases do not explicitly establish the adversary's subjective reason for choosing that priority, so confidence remains medium. NJS-0063-002 has stronger support
          from Microsoft notification semantics, UBoatRAT post-reboot behavior, and Mandiant's error-triggered case.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      rationale:
        zh: QMGR 采用专用数据库而非常规启动项，但其字段和已删除记录能够被 BITS 接口、事件和取证解析恢复；这里的主要问题是监控覆盖和因果关联，而不是取得数据后仍不可解释。
        en: QMGR uses a specialized database rather than conventional autoruns, but its fields and deleted records can be recovered through BITS interfaces, events, and forensic parsing.
          The primary issue is monitoring coverage and causal correlation, not data remaining uninterpretable after acquisition.
  open_questions: []
