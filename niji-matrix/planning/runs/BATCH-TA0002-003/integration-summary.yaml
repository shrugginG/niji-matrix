review_notes_zh: NJT-0063 及两项既有 Niji 子技术已在保留 ID 的前提下完成重新研究。父技术从一个 ATT&CK 来源和单一 Claim 扩展为九项直接来源、九项原子 Claim 与两项现场 Case；NJS-0063-001 收紧为攻击者选择后台优先级和作业属性的 medium 置信度变量，NJS-0063-002 收紧为状态通知、未完成作业与重试或跨重启寿命的 high 置信度变量。DET-000057、NJA-000031 和 MIT-000056 均已改为 BITS 特有的可实施逻辑。完整质量门禁、Bundle 和七项 Review Web 测试通过，试点保持 review，等待人工确认；后续批次未启动。
review_notes_en: NJT-0063 and its two existing Niji children have been re-researched while preserving their IDs. The parent expands from one ATT&CK source and one Claim to nine direct References, nine atomic Claims, and two field Cases. NJS-0063-001 is narrowed to the adversary's selection of background priority and job properties at medium confidence, while NJS-0063-002 is narrowed to state notification, unfinalized jobs, and retry or post-reboot lifetime at high confidence. DET-000057, NJA-000031, and MIT-000056 now contain BITS-specific implementable logic. Full quality gates, the bundle, and seven Review Web tests pass. The pilot remains in review pending human confirmation, and no later remediation batch has started.
