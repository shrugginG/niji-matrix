statement_zh: 长驻作业延迟激活以攻击者把程序绑定到 transferred 或 error 状态、保留未完成作业并利用 BITS 重试、登录恢复或跨重启寿命延迟或重复执行为稳定变量；Microsoft 接口语义、UBoatRAT 和 KEGTAP 现场案例共同证明其独立痕迹与防守观察差异。
statement_en: Long-Lived Job Deferred Activation uses a stable variable in which the adversary binds a program to transferred or error state, leaves the job unfinalized, and uses BITS retry, logon recovery, or post-reboot lifetime to defer or repeat execution. Microsoft interface semantics and the UBoatRAT and KEGTAP field cases jointly establish its distinct trace and defender-observation effects.
