type: detection-strategy
id: DET-000057
name:
  zh: BITS 作业生命周期与通知执行关联
  en: BITS Job-Lifecycle and Notification-Execution Correlation
summary:
  zh: 按作业 GUID 将 BITS 创建或修改、后台传输、状态转换、QMGR 持久状态和通知程序执行恢复为一条可审查因果链。
  en: Reconstruct BITS creation or modification, background transfer, state transition, persistent QMGR state, and notification-program execution as one reviewable causal chain keyed by job GUID.
description:
  paragraphs:
    - zh: 本策略检测攻击者把传输和执行委托给 BITS 作业的行为，而不是把 bitsadmin.exe、BITS 服务网络或任何长期作业单独视为恶意。策略从作业创建或修改开始，连接文件与 URL、所有者、优先级、代理与成本策略、重试属性、通知标志和命令、状态转换、服务宿主网络活动以及最终进程结果。统一的作业 GUID 和用户 SID 用于跨命令、PowerShell、COM、BITS-Client 事件、QMGR 数据库、网络和端点进程恢复因果。
      en: This strategy detects adversary delegation of transfer and execution to a BITS job rather than treating bitsadmin.exe, BITS service network activity, or any long-lived job as independently malicious. It begins with job creation or modification and connects files and URLs, owner, priority, proxy and cost policy, retry properties, notification flags and command, state transition, service-host network activity, and final process outcome. A common job GUID and user SID recover causality across command, PowerShell, COM, BITS-Client events, the QMGR database, network, and endpoint processes.
    - zh: NJA-000031 同时处理两个 Niji 子项。对于活动感知型后台传输执行，它把优先级和实际带宽节奏与相同用户、应用和资产角色的合法作业比较，并要求存在通知或明确后继执行；对于长驻作业延迟激活，它跨登录与重启保留作业身份，检查 transferred、error、重试和未 Complete 或 Cancel 的状态是否导致迟到或重复进程。两条分支都以组合证据评分，并把软件更新、同步、部署和管理员恢复保留为正常解释。
      en: NJA-000031 handles both Niji children. For Activity-Aware Background Transfer Execution, it compares priority and observed bandwidth cadence with legitimate jobs for the same user, application, and asset role and requires a notification or explicit follow-on execution. For Long-Lived Job Deferred Activation, it retains job identity across logon and reboot and tests whether transferred, error, retry, or an uncompleted or uncanceled state caused a delayed or repeated process. Both branches score combined evidence and retain software update, synchronization, deployment, and administrator recovery as benign explanations.
