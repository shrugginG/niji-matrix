schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0065-001
parent_ref: NJT-0065
name: {zh: 原生解释器工作流伪装, en: Native-Interpreter Workflow Camouflage}
summary: {zh: 攻击者从预期应用、管理代理或自动化入口启动已有解释器，使进程名、签名、父级、主体和时段接近合法工作流并削弱粗粒度分类。, en: Adversaries start an existing interpreter from an expected application management-agent or automation entry so process name signature parent principal and timing resemble legitimate workflow and weaken coarse classification.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 原生解释器工作流伪装固定攻击者可控的“入口上下文”变量：解释器不是仅因系统自带而归类，而是由攻击者从预期父进程、服务身份、管理会话、工作目录或业务时段调用，使执行落入组织已经容忍的解释器谱系。直接结果仍是解释器解析指令，独立匿迹效果来自入口与合法工作流特征重合。
    en: Native-Interpreter Workflow Camouflage fixes an adversary-controlled entry-context variable. An interpreter is not classified merely because it is built in; the adversary invokes it from an expected parent, service identity, management session, working directory, or business window so execution falls inside a tolerated lineage. The direct outcome remains instruction parsing, while the independent stealth effect comes from overlap with legitimate workflow features.
  - zh: “原生”表示环境已经批准或惯常使用，不要求操作系统预装。企业安装的构建运行时、应用托管脚本引擎和管理代理调用的 shell 均可满足；下载一个此前不存在的解释器再运行，则缺少既有基线借用条件。
    en: Native means already approved or routinely used in the environment and does not require operating-system preinstallation. An enterprise build runtime, application-hosted engine, or shell invoked by a management agent can qualify. Downloading and executing a previously absent interpreter lacks the existing-baseline borrowing condition.
stealth_characteristics:
  paragraphs:
  - zh: 防守方若按解释器名称、签名、直接父进程或管理员身份放行，攻击者复制其中若干上下文即可把恶意指令混入高容量基线。FIN8 使用 WMI 让 `wmiprvse.exe` 而非 Word 成为 cmd/PowerShell 祖先，说明入口谱系本身是可操纵变量。正常父级不删除命令、脚本块、网络或结果差异，只把分类从单点移到多维关联。
    en: If defenders allow by interpreter name, signature, direct parent, or administrator identity, an adversary can reproduce parts of that context to mix malicious instructions into a high-volume baseline. FIN8 used WMI so `wmiprvse.exe`, rather than Word, became the cmd and PowerShell ancestor, showing entry lineage is controllable. A normal parent does not remove command, script-block, network, or outcome differences; it moves classification from a point indicator to multidimensional correlation.
  - zh: 残余线索包括完整祖先进程、令牌与登录来源、工作目录、导入模块、脚本来源、目标资产职责以及执行后网络、文件和子进程。环境基线越细，攻击者维持全部维度一致的成本越高；若组织只保存直接父级，WMI、服务与代理等中介会切断真正发起者。
    en: Residual observables include full ancestry, token and sign-in origin, working directory, imported modules, script origin, target asset role, and subsequent network, file, and child processes. Finer local baselines increase the cost of matching all dimensions. If only direct parent is retained, intermediaries such as WMI, services, and agents break initiator attribution.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明攻击者控制了解释器入口上下文，并且与本地合法基线重合会削弱既有规则。仅使用签名解释器、在工作时间运行、由管理员执行或出现常见父级均不足以单独成立。主要语义是否落地文件不影响本子项；若独立效果只来自无脚本文件或短驻内容，则归 NJS-0065-002。
    en: Evidence must show adversary control of entry context and that overlap with the local legitimate baseline weakens an existing rule. A signed interpreter, business-hour execution, administrator identity, or common parent alone is insufficient. Whether semantics are file-backed does not affect this child; when the only independent effect is transient content or lack of a script file, classification belongs to NJS-0065-002.
  - zh: 计划任务、WMI、服务、云代理或容器 API 可作为上游入口并与本子技术并存；本对象不替代它们，而只描述解释器调用如何借用正常工作流特征。语言和产品不形成更低层子项。
    en: A scheduler, WMI, service, cloud agent, or container API may be an upstream entry and coexist with this child. This object does not replace those techniques; it describes only how interpreter invocation borrows normal workflow features. Language and product do not create lower-level children.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 常见场景包括 Office 或应用插件转交脚本、WMI/服务/运维代理启动 shell、CI runner 调用构建语言，以及管理员频繁使用 PowerShell 或 Unix shell 的服务器。攻击者选择与资产职责一致的入口，让恶意调用与批量合法任务共享外观。
      en: Common scenarios include Office or application plug-ins handing off scripts, WMI services or operations agents starting shells, CI runners invoking build languages, and administrator-heavy servers. The adversary chooses an entry consistent with asset role so malicious invocation shares appearance with high-volume legitimate jobs.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 攻击者需要了解允许的解释器、父级、身份、目录、模块和时间分布，并能控制相应入口。祖先进程、令牌来源、命令语义或后续行为任一明显偏离都可能暴露；应用控制与 JEA/受限会话会缩小可借用能力。
        en: The adversary needs knowledge of allowed interpreters, parents, identities, directories, modules, and timing and must control the corresponding entry. A clear deviation in ancestry, token origin, command semantics, or subsequent behavior can expose the operation. Application control and JEA or constrained sessions narrow usable capability.
    defender_model:
      paragraphs:
      - zh: 防守方应保存完整祖先链、调用主体与会话、目录、模块/脚本来源和结果行为，并按资产角色建立联合基线。允许项应绑定具体入口与预期动作，不能永久放行某一签名解释器或父级。
        en: Defenders should retain complete ancestry, invoking principal and session, directory, module or script origin, and outcome behavior and baseline them jointly by asset role. Allowances should bind a concrete entry to expected actions rather than permanently allowing a signed interpreter or parent.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 恶意调用借用合法解释器工作流的可见特征, en: A malicious invocation borrows visible features of legitimate interpreter workflow}
  analysis:
    paragraphs:
    - zh: 攻击者使二进制身份、父级、主体和时间接近批准工作流，恶意与合法实体共享分类特征，形成特征伪装。FIN8 的 WMI 父级改写直接支持攻击者控制；ATT&CK 和平台文档支持解释器具有普遍合法用途。残余仍可通过祖先、命令、脚本块、模块、网络与结果发现，因此机制针对分类混淆而非痕迹消失。
      en: The adversary aligns binary identity, parent, principal, and time with an approved workflow so malicious and legitimate entities share classification features, producing Feature Disguise. FIN8's WMI parent manipulation directly supports adversary control, while ATT&CK and platform documentation establish common legitimate use. Residual ancestry, commands, script blocks, modules, network, and outcomes remain, so the mechanism concerns classification confusion rather than trace removal.
  evidence_refs: [REF-000117, REF-000196, REF-000200]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000078]}, mitigations: {coverage: available, mitigation_refs: [MIT-000078]}}
evidence: {claim_refs: [CLM-000255, CLM-000389, CLM-000393], case_refs: [CASE-000067], reference_refs: [REF-000117, REF-000196, REF-000200]}
research:
  limitations:
    paragraphs:
    - zh: FIN8 直接证明一种 Windows 入口谱系操纵；向其他解释器推广仅限等价的已批准入口—解释器—结果结构，不假定相同进程名或字段。合法管理代理也可能产生罕见命令，故 high 表示变量存在证据强，不表示单个信号可高置信归因。
      en: FIN8 directly establishes one Windows entry-lineage manipulation. Generalization to other interpreters is limited to equivalent approved-entry-to-interpreter-to-outcome structure without assuming identical process names or fields. Legitimate management agents can also produce rare commands, so high denotes strong evidence that the variable exists, not that one signal gives high-confidence attribution.
