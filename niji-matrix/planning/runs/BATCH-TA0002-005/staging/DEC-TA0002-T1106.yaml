rationale_zh: 固定基线锚定原生 OS 服务执行。Rhadamanthys/Lumma 直接证明 syscall 路径绕过用户态 hook，SplatDropper 直接证明哈希运行时 API 解析；内核调用栈和动态目标提供可证伪残余，支持 high-confidence adapt。
rationale_en: The fixed baseline anchors execution through native OS services. Rhadamanthys and Lumma directly establish syscall-path bypass of user-mode hooks and SplatDropper directly establishes hashed runtime API resolution. Kernel call stacks and dynamic targets provide falsifiable residuals supporting high-confidence adaptation.
scope_notes_zh: 范围要求攻击者有意改变调用路径或解析时点并产生执行结果；API 名称、平台和功能目的不形成子项。解释器、执行流劫持、模块加载与结果技术保持相邻边界。
scope_notes_en: Scope requires deliberate change to call path or resolution time plus an execution outcome. API names platforms and function purposes do not form children. Interpreter execution-flow hijack module load and outcome techniques remain adjacent boundaries.
