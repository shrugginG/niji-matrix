- work_item_ref: WORK-TA0002-T1106
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: [Windows Native API and syscalls, Linux syscalls and libc, macOS native frameworks, process memory and thread outcomes]
  breadth_trigger: ordinary-open-search
  candidate_stealth_axes_examined:
  - {axis: direct-system-call-telemetry-layer-bypass, disposition: formal, trace_change: syscall instruction originates outside the expected native library path and bypasses user-mode API hooks, defender_effect: hook-only sensors lose the named API boundary while kernel outcome remains}
  - {axis: dynamically-resolved-native-invocation, disposition: formal, trace_change: API addresses and names are resolved from exports or hashes at runtime rather than represented in a stable import table, defender_effect: static import features and pre-execution classification lose intended call identity}
  - {axis: indirect-syscall-or-proxy-call, disposition: collapsed-to-direct-call-path-axis, trace_change: execution returns through a native-library syscall instruction while the true caller is nonstandard, defender_effect: the defense difference remains call-stack provenance rather than a third independent child}
  - {axis: API-family-partition, disposition: not-stealth-distinct, trace_change: memory process file and registry APIs produce different outcomes, defender_effect: function purpose does not independently change inspectability or attribution}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 2
  breadth_gap_explained: true
  reviewer_notes_zh: 无 ATT&CK 子项仍检索四个轴；直接/间接 syscall 统一由调用栈来源变量处理，运行时解析单独改变静态可检查性，API 功能类别不构成匿迹分类。
  reviewer_notes_en: Four axes were searched despite no ATT&CK children. Direct and indirect syscalls are unified by call-stack provenance, runtime resolution separately changes static inspectability, and API function categories do not form stealth taxonomy.
- work_item_ref: WORK-TA0002-T1559
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 3
  attack_subtechnique_ids: [T1559.001, T1559.002, T1559.003]
  represented_dimensions: [Windows COM, Windows DDE, macOS XPC Services]
  breadth_trigger: three-to-five-multi-axis-review
  coverage_resolutions:
  - {attack_ids: [T1559.001], resolution: COM server execution can contribute trusted-process brokerage and short-lived method requests without becoming a Niji product child}
  - {attack_ids: [T1559.002], resolution: DDE message exchange contributes transient request execution and may use an Office process as broker; protocol name remains implementation-only}
  - {attack_ids: [T1559.003], resolution: XPC privileged helpers contribute trusted broker provenance and request-lifetime control; macOS platform remains implementation-only}
  candidate_stealth_axes_examined:
  - {axis: trusted-process-execution-brokerage, disposition: formal, trace_change: a trusted or privileged server process performs the visible action after an attacker-controlled IPC client request, defender_effect: process-only observation attributes the result to the broker rather than the requesting process}
  - {axis: transient-ipc-request-execution, disposition: formal, trace_change: control semantics exist only in a message method invocation pipe buffer or short conversation and leave no durable task or script object, defender_effect: delayed artifact review sees the broker outcome without the initiating request}
  - {axis: remote-versus-local-ipc, disposition: adjacent-technique, trace_change: DCOM or remote pipes cross a host boundary, defender_effect: remote service and lateral-movement provenance is owned by adjacent techniques rather than a local IPC child}
  - {axis: protocol-specific-com-dde-xpc, disposition: not-stealth-distinct, trace_change: protocol and OS change field names, defender_effect: the same broker and request-lifetime variables remain}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 2
  breadth_gap_explained: true
  reviewer_notes_zh: 已检查两个独立匿迹轴，且逐项覆盖 COM/DDE/XPC；协议与平台不复制为 Niji 子项，远程 IPC 的跨主机属性交给相邻远程服务/横向移动对象。
  reviewer_notes_en: Two independent stealth axes were examined and COM DDE and XPC were covered. Protocol and platform do not become Niji children, while cross-host remote IPC belongs to adjacent remote-service or lateral-movement objects.
