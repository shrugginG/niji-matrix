schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0070-002
parent_ref: NJT-0070
name: {zh: 合法依赖完整性替换, en: Legitimate-Dependency Integrity Substitution}
summary: {zh: 攻击者覆盖或重定向既有可执行文件、服务目标或依赖，同时保留稳定路径、名称或接口，使下一次消费执行攻击者内容。, en: Adversaries overwrite or redirect an existing executable service target or dependency while retaining a stable path name or interface so the next consumption executes attacker content.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 合法依赖完整性替换固定“既有身份下的内容或目标改变”变量。攻击者利用文件、目录、服务注册或安装权限，覆盖原二进制/库、把稳定 service target 指向攻击者文件，或插入能够随后交还原功能的 wrapper；正常启动仍引用同一路径、名称、服务或接口，但实际内容/目的地已变化并执行攻击者逻辑。
    en: Legitimate-Dependency Integrity Substitution fixes changed content or target under an existing identity. The adversary uses file directory service-registry or installer permissions to overwrite an original binary or library redirect a stable service target to an attacker file or insert a wrapper that can hand off to original functionality. Normal startup still references the same path name service or interface while actual content or destination changes and executes attacker logic.
  - zh: 若原依赖未被修改、只是恶意同名候选在更早目录胜出，归 NJS-0070-001；若 host/依赖均完整而 runtime 激活配置加载新 manager，归 NJS-0070-003。对同一二进制的长期内容植入还可归 NJT-0087，但本子项要求该替换已经改变当前执行流。
    en: If the original dependency remains unchanged and only an earlier same-named candidate wins, classification belongs to NJS-0070-001. If host and dependencies remain intact while runtime activation loads a manager, it belongs to NJS-0070-003. Durable binary implantation can also instantiate NJT-0087, but this child requires the substitution to have changed current execution flow.
stealth_characteristics:
  paragraphs:
  - zh: 合法依赖完整性替换让路径、服务名、publisher 外观或原功能保持熟悉，基于名称和 inventory 的检查可能误认为对象未变。Industroyer 后门化 Notepad 先执行恶意代码再交还原程序，ThiefQuest wrapper 复制并启动合法内容，直接证明身份与功能可被保留。旧/new hash、签名、writer、ACL、服务/注册目标 diff、加载和原功能接力仍可恢复；强完整性基线会限制。
    en: Legitimate-Dependency Integrity Substitution keeps path service name publisher appearance or original function familiar so name and inventory checks may assume no change. Backdoored Industroyer Notepad executed malicious code before handing off to the original program and ThiefQuest wrappers copied and launched legitimate content, directly showing identity and function preservation. Old and new hashes signatures writer ACL service or registry target diffs load and original-function handoff remain recoverable. Strong integrity baselines constrain it.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明既有受信 identity 的内容或执行目标由攻击者改变、随后被正常 consumer 使用并产生执行结果。仅可写权限、待用恶意文件或合法软件更新不足；需有未批准 writer/审批差分和消费证据。覆盖、patch、重定向与 wrapper 是实现，不按文件类型或服务/应用拆分。
    en: Evidence must show adversary change to content or execution target under an existing trusted identity followed by normal consumer use and execution outcome. Writable permissions an unused malicious file or a legitimate update is insufficient and needs an unapproved writer or approval difference plus consumption evidence. Overwrite patch redirection and wrapper are implementations not partitions by file type service or application.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者发现用户可写安装/服务路径、宽松 service registry、升级器或可替换应用二进制后，在正常启动前修改目标；为降低用户和监控察觉可维持原导出、UI 或功能并在恶意前奏后交还控制。, en: The adversary finds a user-writable installation or service path permissive service registry updater or replaceable application binary and changes the target before normal start. To reduce user and monitoring suspicion it may preserve exports UI or function and hand control back after a malicious prelude.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要写权限、正确格式/架构/接口和触发时机，并可能保存原文件以接力/恢复。签名强制、受保护目录、服务 ACL、完整性监控、事务更新与受信恢复会限制；错误替换导致启动失败。, en: Requires write authority compatible format architecture or interface and trigger timing and may preserve the original for handoff or restoration. Signature enforcement protected directories service ACL integrity monitoring transactional updates and trusted recovery constrain it; bad substitutions cause start failure.}]}
    defender_model: {paragraphs: [{zh: 需保存批准 hash/signature/target、writer 和变更单，检测文件/注册路径差异并连接下一次启动/加载；只采集当前文件或只看服务名无法知道被替换历史。处置需保留恶意与原内容再恢复。, en: Defenders retain approved hash signature or target writer and change record and join file or registry differences to the next start or load. Current-file-only collection or service names cannot reveal substitution history. Response preserves malicious and original content before restoration.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 攻击者内容保留合法路径、服务或功能身份, en: Attacker content retains a legitimate path service or functional identity}
  analysis: {paragraphs: [{zh: 替换改变真实内容/目标但保留分类所见身份，恶意与合法对象共享路径、名称和界面特征，形成特征伪装。Industroyer/ThiefQuest 直接案例支持 high；版本化完整性和 writer—diff—load—outcome 链可恢复。, en: Substitution changes actual content or target while preserving classification identity so malicious and legitimate objects share path name and interface features producing Feature Disguise. Industroyer or ThiefQuest direct cases support high confidence; versioned integrity and writer-diff-load-outcome lineage recover it.}]}
  evidence_refs: [REF-000180]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000084]}, mitigations: {coverage: available, mitigation_refs: [MIT-000085]}}
evidence: {claim_refs: [CLM-000269, CLM-000431], case_refs: [CASE-000066], reference_refs: [REF-000180, REF-000200]}
research:
  limitations: {paragraphs: [{zh: CASE-000066 同时服务主机二进制内容破坏与本执行流子项，但此处只使用其“稳定身份下恶意前奏和原功能接力”事实。合法更新也替换内容，必须用 writer、审批、签名和结果；缺少旧基线时不能仅凭当前异常文件判定完整性替换。, en: CASE-000066 serves both host-binary content compromise and this execution-flow child but only its malicious-prelude and original-function handoff under stable identity is used here. Legitimate updates also replace content and require writer approval signature and outcome. Without an old baseline the current anomalous file alone cannot establish substitution.}]}
