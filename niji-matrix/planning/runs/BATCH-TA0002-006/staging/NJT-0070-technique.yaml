research:
  limitations:
    paragraphs:
    - zh: 证据最强地覆盖 Windows DLL/服务/.NET，固定基线中的 macOS dylib 和 Linux dynamic linker/PATH 只按等价解析/完整性变量覆盖，不假定相同日志字段。第三子项由 Blue Mockingbird 与 2026 AppDomainManager 定向活动直接支持，但 KernelCallbackTable 只作为同类 activation/callback 簇而未单独案例化。合法更新、插件和 profiler 与攻击同形；high 表示变量存在证据强，归因仍要求写入者、批准、加载与结果。
      en: Evidence is strongest for Windows DLL service and .NET. macOS dylib and Linux dynamic linker or PATH in the fixed baseline are covered only through equivalent resolution or integrity variables without assuming the same log fields. Blue Mockingbird and targeted 2026 AppDomainManager activity directly support the third child, while KernelCallbackTable remains in the same activation or callback cluster without its own case. Legitimate updates plug-ins and profilers share the shape. High confidence establishes the variables; attribution still requires writer approval load and outcome.
