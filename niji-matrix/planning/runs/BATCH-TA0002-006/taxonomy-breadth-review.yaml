reviewer_notes_zh: 第二轮把 12 个 ATT&CK 子项收敛为三个跨平台匿迹变量。新增运行时激活/回调重定向，因为 COR_PROFILER/AppDomainManager 等无需搜索优先级或替换现有 host，且检测依赖注册/环境/回调到运行时加载链，与既有两个子项不同。
reviewer_notes_en: The second pass converged twelve ATT&CK children into three cross-platform stealth variables. Runtime activation or callback redirection is added because COR_PROFILER and AppDomainManager need neither search precedence nor host replacement and require a distinct registration or environment-to-runtime-load defense chain.
