schema_version: 2.0.0
type: mitigation
id: MIT-000058
name:
  zh: 解释器、原生调用、模块与受信执行媒介加固
  en: Interpreter, Native-Call, Module, and Trusted Execution-Mediation Hardening
summary:
  zh: 收缩解释器、原生调用、模块、IPC 与受信实用程序执行面，并保护输入、依赖与完整执行谱系。
  en: Reduce interpreter, native-call, module, IPC, and trusted-utility execution surfaces while protecting inputs, dependencies, and complete execution lineage.
description:
  paragraphs:
    - zh: 本缓解将可复用控制与逐目标应用分开，通过收缩解释器和 IPC 执行面，保护加载路径与依赖完整性，并保留完整执行谱系。实施时同时保留检测所需审计，避免以单一信誉、签名或白名单替代最小权限和完整性验证。
      en: This mitigation separates reusable controls from per-target applications. It will reduce interpreter and IPC execution surfaces, protect load paths and dependency integrity, and retain complete execution lineage. Implementation also preserves audit required for detection and does not substitute a single reputation, signature, or allowlist for least privilege and integrity validation.
domains:
  - enterprise
measures:
  - key: execution-mediation-controls
    name:
      zh: 执行媒介控制与完整性保护
      en: Execution-Mediation Control and Integrity Protection
    description:
      paragraphs:
        - zh: 收缩解释器和 IPC 执行面，保护加载路径与依赖完整性，并保留完整执行谱系。
          en: Reduce interpreter and IPC execution surfaces, protect load paths and dependency integrity, and retain complete execution lineage.
    control_type: preventive
applications:
  - target_ref: NJT-0077
    use:
      paragraphs:
        - zh: 针对匿迹化共享模块执行，把本缓解应用于直接执行对象、控制接口和关键谱系：限制不必要权限与可调用面，验证定义、输入或制品完整性，保留触发前后的关联键，并把例外绑定到具体主体、目标、用途和有效期。
          en: "For Stealth-Conforming Shared-Module Execution, apply this mitigation to the direct execution object, control interface, and critical lineage: restrict unnecessary privileges and callable surfaces, verify definition, input, or artifact integrity, retain pre-trigger and post-trigger correlation keys, and bind exceptions to a concrete principal, target, purpose, and validity period."
    expected_effect:
      paragraphs:
        - zh: 该应用降低匿迹化共享模块执行借用受信服务、工具、工作负载、用户或管理路径的机会，提高攻击者维持权限、情境匹配和低差异痕迹的成本，并改善跨层归因。
          en: This application reduces opportunities for Stealth-Conforming Shared-Module Execution to borrow trusted services, tools, workloads, users, or management paths, raises the cost of maintaining privilege, contextual fit, and low-difference traces, and improves cross-layer attribution.
    limitations:
      paragraphs:
        - zh: 该控制不能消除所有匿迹化共享模块执行实例；合法管理、开发、软件更新、用户工作流和业务连续性可能要求保留部分接口。强制处置必须依赖组合证据，并评估可用性、隐私与跨团队日志权限。
          en: The control cannot eliminate every instance of Stealth-Conforming Shared-Module Execution; legitimate administration, development, software updates, user workflows, and business continuity may require retaining some interfaces. Enforcement must rely on combined evidence and account for availability, privacy, and cross-team logging authority.
