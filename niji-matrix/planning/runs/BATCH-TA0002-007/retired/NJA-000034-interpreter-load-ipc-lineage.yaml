schema_version: 2.0.0
type: detection-analytic
id: NJA-000034
strategy_ref: DET-000059
name:
  zh: 解释器、模块、实用程序与 IPC 执行谱系分析
  en: Interpreter, Module, Utility, and IPC Execution-Lineage Analytic
summary:
  zh: 按稳定关联键恢复解释器、加载与 IPC 执行谱系中的控制、执行与结果序列。
  en: Recover the control, execution, and outcome sequence for Interpreter, Load, and IPC Execution-Lineage through stable correlation keys.
domains:
- enterprise
platforms:
- Windows
- Linux
- macOS
logic:
  paragraphs:
  - zh: 分析先将各数据源时间、主体、目标和请求或进程标识规范化，再建立控制或触发事件、实际执行和后续结果的有向序列。仅在异常主体或情境与执行谱系、完整性变化或网络结果共同出现时提高风险；缺少任何一层时降低置信度而不是把单点信号直接定性。
    en: The analytic first normalizes time, principal, target, and request or process identifiers across data sources, then builds a directed sequence from control or trigger event through
      actual execution to follow-on outcome. Raise risk only when an anomalous principal or context co-occurs with execution lineage, integrity change, or network outcome; when a layer
      is missing, lower confidence rather than classifying a point signal by itself.
data_requirements:
- source_type: endpoint-process-command
  name:
    zh: 端点进程与命令审计
    en: Endpoint process and command audit
  channel: null
  required_fields:
  - timestamp
  - device_id
  - user_id
  - process_id
  - parent_process_id
  - image
  - command_line
  - script_content_hash
- source_type: module-file-integrity
  name:
    zh: 模块加载与文件完整性
    en: Module load and file integrity
  channel: null
  required_fields:
  - timestamp
  - device_id
  - process_id
  - module_path
  - module_hash
  - signature
  - writer_process_id
  - configuration_change
- source_type: ipc-activity
  name:
    zh: IPC 端点与请求活动
    en: IPC endpoint and request activity
  channel: null
  required_fields:
  - timestamp
  - device_id
  - ipc_type
  - endpoint
  - requester_process_id
  - receiver_process_id
  - operation
  - message_hash
observables:
- zh: 解释器由非常见父进程启动或以内联内容产生异常后继行为
  en: An interpreter starts from an uncommon parent or produces anomalous follow-on behavior from inline content
- zh: 受信进程从异常路径加载新依赖或在 IPC 请求后启动不符合基线的后继进程
  en: A trusted process loads a new dependency from an unusual path or launches an off-baseline child after an IPC request
- zh: 受信开发实用程序读取异常项目或配置后，在进程内执行代码、加载非常规模块或产生异常子进程与外联
  en: A trusted developer utility reads an unusual project or configuration and then executes code in process, loads an off-baseline module, or produces an anomalous child or network
    connection
correlation:
  window:
    zh: 窗口覆盖执行前一小时的文件或配置变化与执行后十五分钟的后继进程、模块和网络结果。
    en: The window covers file or configuration changes during the hour before execution and successor process, module, and network outcomes for fifteen minutes afterward.
  dimensions:
  - device
  - user
  - session
  - process
  - parent_process
  - module
  - resolved_path
  - ipc_endpoint
  - requester
  - command
  - time
false_positives:
- zh: 软件安装、开发构建、管理脚本、调试器、辅助功能和应用插件会产生类似解释器、模块和 IPC 谱系。
  en: Software installation, development builds, administrative scripts, debuggers, accessibility features, and application plugins can produce similar interpreter, module, and IPC lineage.
blind_spots:
- zh: 命令内容截断、模块加载未记录、IPC 消息不可见或攻击者仅使用内存态事务时会降低检测可靠性。
  en: Truncated command content, absent module-load records, invisible IPC messages, or memory-only transactions reduce detection reliability.
tuning_guidance:
  paragraphs:
  - zh: 按业务角色、管理来源、资产或命名空间、软件版本、变更窗口和正常父子谱系建立基线，并分别评分主体异常、控制差异、执行结果与完整性变化。白名单必须绑定具体主体、目标、用途和有效期，不能永久排除受信服务、签名进程、自动化身份或维护时段；对缺失数据明确降低置信度。
    en: Build baselines by business role, management origin, asset or namespace, software version, change window, and normal parent-child lineage, and score principal anomaly, control
      difference, execution outcome, and integrity change separately. Allowlists must bind a concrete principal, target, purpose, and validity period rather than permanently excluding
      trusted services, signed processes, automation identities, or maintenance periods; explicitly lower confidence for missing data.
