statement_zh: 共享模块执行把攻击者功能映射进已有进程，既可保留标准 loader/file-backed module 而隐藏独立进程，也可用反射映射消除正常模块对象；这些进程身份与对象可见性变化影响防守观察，支持在 TA0002 下适配为匿迹技术。
statement_en: Shared Modules maps adversary functionality into existing processes either preserving a standard loader and file-backed module while avoiding a standalone process or using reflective mapping to eliminate normal module objects. These process-identity and object-visibility changes affect defender observation and support adaptation as a stealth technique under TA0002.
