candidate: {source_type: attack, source_attack_id: T1127, source_attack_version: '19.1', name_en: Trusted Developer Utilities Proxy Execution, name_zh: 受信开发者实用程序代理执行}
decision: retain
rationale_zh: 固定基线三个 ATT&CK 子项按 MSBuild、ClickOnce、JamPlus 工具划分；跨工具共同匿迹变量是签名 utility 消费攻击者输入并代理执行，MSBuild 另有 inline task 在进程内编译执行的对象差异。Frankenstein 与 AkaiRyū 直接证明前者，Microsoft 文档证明后者能力但现场 artifactless 细节有限，因此两个 Niji 子项分别 high/medium。
rationale_en: Three fixed-baseline ATT&CK children partition MSBuild ClickOnce and JamPlus tools. Their shared stealth variable is signed utility consumption of adversary input to proxy execution while MSBuild adds an object-visibility difference through compiling and executing inline tasks in process. Frankenstein and AkaiRyū directly prove the former and Microsoft documentation proves the latter capability with limited field artifactless detail so Niji children are high and medium respectively.
scope_notes_zh: 正式范围要求受信开发 utility 解释 attacker-controlled project/manifest/build input 并实际启动、加载或进程内执行代码。普通编译、CI runner、后继注入和模块加载分别按真实对象处理；工具名称、输入来源和语言不形成 Niji 子项。
scope_notes_en: Formal scope requires a trusted developer utility to interpret attacker-controlled project manifest or build input and actually launch load or execute code in process. Ordinary builds CI runners downstream injection and module loading follow their actual objects and tool names input origin and language do not form Niji children.
