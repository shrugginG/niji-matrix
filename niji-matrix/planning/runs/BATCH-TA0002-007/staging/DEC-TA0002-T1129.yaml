decision: adapt
rationale_zh: 固定基线覆盖 LoadLibrary/dlopen 与恶意插件。Astaroth 证明借合法进程加载载荷，PipeMon 与 DOUBLEPULSAR/Microsoft 分析证明反射映射绕过磁盘和标准 module list。父级因此适配为“匿迹化共享模块执行”，按标准 loader 下的进程身份保持和自定义映射下的对象缺失划分两个 Niji 子项。
rationale_en: The fixed baseline covers LoadLibrary or dlopen and malicious plugins. Astaroth demonstrates payload loading through a legitimate process while PipeMon and DOUBLEPULSAR or Microsoft analysis demonstrate reflective mapping that bypasses disk and standard module lists. The parent is adapted as Stealth-Conforming Shared-Module Execution with Niji children for process-identity preservation under standard loaders and object absence under custom mapping.
scope_notes_zh: T1129 只负责模块在当前执行进程中被映射和调用；search-order 劫持、跨进程注入、动态 API 解析和工具具体功能分别归相邻对象。文件扩展名与平台不形成子项，module load 必须有恶意 payload 与观察变化证据。
scope_notes_en: T1129 owns module mapping and invocation in the current execution process. Search-order hijacking cross-process injection dynamic API resolution and tool-specific functionality belong to adjacent objects. File extension and platform do not form children and module loading needs evidence of malicious payload and observation change.
