schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0077-001
parent_ref: NJT-0077
name: {zh: 既有进程内模块承载, en: Existing-Process In-Module Payload Hosting}
summary: {zh: 攻击者用标准 loader 将恶意 file-backed 模块加入既有进程，使功能执行保留 host 进程身份而不产生独立程序, en: Adversaries use standard loaders to add malicious file-backed modules to existing processes so functionality retains host identity without a standalone program}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 既有进程内模块承载是当前进程通过 LoadLibrary/LoadLibraryEx、dlopen 或等价 loader 映射恶意模块并调用其入口/导出，module 仍有标准 loader 注册与 file backing，但功能不另建 executable process。稳定变量是 host process identity 保持，不是通过搜索顺序误加载候选，也不是向另一进程注入。, en: Existing-Process In-Module Payload Hosting has the current process map a malicious module through LoadLibrary or LoadLibraryEx dlopen or an equivalent loader and call its entry or exports. The module retains standard loader registration and file backing while functionality creates no standalone executable process. The stable variable is preserved host-process identity rather than search-order selection or injection into another process.}]}
stealth_characteristics: {paragraphs: [{zh: 既有进程内模块承载使进程名、用户、父进程与常规 host 一致，process-creation-only 检测看不到功能边界。Astaroth 借 ExtExport.exe 加载 payload 直接说明这种来源借用；module load、path/hash/signature、调用 stack 和异常网络仍残留。子项为 medium，因为普通 LoadLibrary 极常见且案例未披露全部 module 注册细节。, en: Existing-Process In-Module Payload Hosting preserves the process name user and parent of an ordinary host so process-creation-only detection misses the function boundary. Astaroth loading payload through ExtExport.exe directly demonstrates provenance borrowing while module load path hash signature call stacks and anomalous network remain. The child is medium because ordinary LoadLibrary is ubiquitous and the case does not disclose every module-registration detail.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入恶意 file-backed 模块由标准 loader 进入当前进程并因 host identity 降低识别的情况。合法插件、系统 DLL、search-order hijack、reflective private memory 和 cross-process injection 分别排除或归兄弟/相邻对象；必须以 module provenance 与结果证明恶意。, en: Include only malicious file-backed modules entering the current process through standard loaders where host identity reduces detection. Legitimate plugins system DLLs search-order hijacking reflective private memory and cross-process injection are excluded or assigned to sibling or adjacent objects and maliciousness requires module provenance and outcomes.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者让 loader、受信 utility、服务或 backdoor 进程加载 C2、收集或破坏模块，以复用已有进程权限和网络。模块可来自本地或网络路径，但远程来源本身不改变子项。, en: Adversaries have loader trusted utility service or backdoor processes load C2 collection or destructive modules to reuse existing privileges and network. Modules may come from local or network paths but remote origin does not change the child.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 攻击者需要当前进程执行、兼容 module/ABI 和可访问路径，并在签名、应用控制与 loader search policy 下完成加载；加载失败会留下错误或崩溃。, en: The adversary needs execution in the current process compatible modules and ABI and accessible paths and must load under signature application-control and loader-search policy while failure leaves errors or crashes.}]}
    defender_model: {paragraphs: [{zh: 防守方需要 module/image load、file provenance、host role、loader stack、export/entry 与后继网络，按 host—module 组合建立基线；没有 module telemetry 时只能从行为推断。, en: Defenders need module or image loads file provenance host roles loader stacks exports or entries and successor network and baseline host-to-module combinations. Without module telemetry only behavioral inference is possible.}]}
stealth_mechanisms: [{mechanism_ref: NM-BT, role: primary, summary: {zh: 模块功能不改变既有 Host 进程身份, en: Module functionality does not change existing host-process identity}, analysis: {paragraphs: [{zh: 标准 loader 让恶意代码作为 host 的一个 module 运行，进程级观察继续显示原名称和谱系，形成行为透明。Astaroth 案例支持；module provenance 和后继结果可破坏透明，普通 loader 的广泛合法使用限制置信度。, en: Standard loaders run malicious code as one module of the host while process-level observation keeps original identity and lineage creating Behavioral Transparency. Astaroth supports the chain while module provenance and outcomes break transparency and broad legitimate loader use limits confidence.}]}, evidence_refs: [REF-000279, REF-000282], confidence: medium}]
defense: {detections: {coverage: available, strategy_refs: [DET-000090]}, mitigations: {coverage: available, mitigation_refs: [MIT-000091]}}
evidence: {claim_refs: [CLM-000291, CLM-000487, CLM-000490, CLM-000492, CLM-000493, CLM-000494], case_refs: [CASE-000099], reference_refs: [REF-000129, REF-000279, REF-000282]}
research: {limitations: {paragraphs: [{zh: Astaroth 同时使用多个 fileless 与注入技术，公开报告不能把所有行为归因于标准 shared-module load；新案例必须确认 loader 注册、file backing 和当前进程边界，不能仅凭合法 host 名称映射。, en: Astaroth combines several fileless and injection techniques and public reporting cannot attribute every behavior to standard shared-module loading. New cases must confirm loader registration file backing and current-process boundaries rather than map from a legitimate host name alone.}]}}
