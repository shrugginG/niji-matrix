schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0080-001
parent_ref: NJT-0080
name: {zh: 受信实用程序输入代理执行, en: Trusted-Utility Input-Proxy Execution}
summary: {zh: 攻击者让签名开发工具解释恶意 Project、Manifest 或 Build 输入，使允许的 Utility 成为代码执行主体, en: Adversaries have signed developer tools interpret malicious projects manifests or build inputs so allowed utilities become code-execution principals}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 受信实用程序输入代理执行是攻击者向 MSBuild、ClickOnce、JamPlus 或等价签名开发工具提供 project、manifest、targets、response 或 build 输入，工具按设计编译、加载或启动其中代码。直接目标是借 utility publisher 和路径通过应用控制；稳定变量是 trusted utility—untrusted input—execution 链，而非工具名。, en: Trusted-Utility Input-Proxy Execution supplies MSBuild ClickOnce JamPlus or equivalent signed developer tools with projects manifests targets response files or build inputs that the tools compile load or launch by design. Its objective is crossing application control through utility publisher and path and the stable variable is the trusted-utility to untrusted-input to execution chain rather than tool name.}]}
stealth_characteristics: {paragraphs: [{zh: 受信实用程序输入代理执行让可见进程为 Microsoft/开发者签名工具，输入又像普通 XML/build 文件。Frankenstein 与 AkaiRyū 直接证明 MSBuild 代理。调用者、project origin/digest、host role、build error、child/module/network 仍可见；非开发主机或用户目录输入会削弱伪装。, en: Trusted-Utility Input-Proxy Execution exposes Microsoft or developer-signed tool processes and ordinary-looking XML or build inputs. Frankenstein and AkaiRyū directly prove MSBuild proxying. Caller project origin and digest host role build errors child modules and network remain while nondeveloper hosts or user-directory inputs weaken disguise.}]}
scope_boundary_definition: {paragraphs: [{zh: 纳入外部输入经受信 utility 实际执行代码；合法 build、未运行 project、utility 自身被替换和 downstream injection/module load 分别排除或共映射。inline code 若主要差异是无独立制品可同时归 NJS-0080-002。, en: Include external input actually executing code through a trusted utility. Legitimate builds unexecuted projects replaced utilities and downstream injection or module loading are excluded or co-mapped. Inline code may also map to NJS-0080-002 when missing standalone artifacts is material.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者经钓鱼、下载、远程 share 或 foothold 放置恶意 project，在应用白名单 Windows 主机调用已安装 utility 执行 loader/injector。, en: Adversaries place malicious projects through phishing downloads remote shares or footholds and invoke installed utilities on application-allowlisted Windows hosts to run loaders or injectors.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要输入写入和 utility 启动权限、正确 schema/runtime 及对控制策略的了解；缺少工具、WDAC block 和受控 project path 会阻断。, en: Input write and utility launch authority correct schemas and runtimes and control-policy knowledge are needed while absent tools WDAC blocks and controlled project paths stop execution.}]}
    defender_model: {paragraphs: [{zh: 需要 utility/caller、host role、file origin、project content、build/module/child/network 关联；publisher allow 单独不足。, en: Defenders need utility and caller host role file origin project content and build module child and network correlation and publisher allowance alone is insufficient.}]}
stealth_mechanisms: [{mechanism_ref: NM-BT, role: primary, summary: {zh: 签名 Utility 代理不可信输入成为执行主体, en: Signed utilities proxy untrusted input and become execution principals}, analysis: {paragraphs: [{zh: 攻击者让允许的开发工具按正常解析路径运行恶意输入，应用控制看到受信 publisher 而忽略 input semantics，形成行为透明。两个现场案例直接支持；输入 provenance 与结果链仍可检测。, en: The adversary has allowed developer tools run malicious input through normal parsing so application control sees trusted publishers and misses input semantics creating Behavioral Transparency. Two field cases directly support it while input provenance and outcome chains remain detectable.}]}, evidence_refs: [REF-000285, REF-000286, REF-000288], confidence: high}]
defense: {detections: {coverage: available, strategy_refs: [DET-000091]}, mitigations: {coverage: available, mitigation_refs: [MIT-000092]}}
evidence: {claim_refs: [CLM-000300, CLM-000495, CLM-000498, CLM-000499, CLM-000500, CLM-000501, CLM-000502], case_refs: [CASE-000101, CASE-000102], reference_refs: [REF-000132, REF-000285, REF-000286, REF-000287, REF-000288]}
research: {limitations: {paragraphs: [{zh: 现场证据为 MSBuild，不能自动推广所有 T1127 工具；开发者合法输入可产生相似 child/module，必须结合 host role、来源和审批。, en: Field evidence covers MSBuild and cannot automatically generalize to every T1127 utility. Legitimate developer input may create similar children or modules and requires host role provenance and approval context.}]}}
lifecycle: {status: review, version: 2.0.0, created: '2026-09-10', modified: '2026-09-12', contributors: [Niji Matrix Research], reviewers: []}
