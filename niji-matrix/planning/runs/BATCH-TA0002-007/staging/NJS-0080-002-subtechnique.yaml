schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0080-002
parent_ref: NJT-0080
name: {zh: 无独立制品实用程序内执行, en: Artifactless In-Utility Execution}
summary: {zh: 攻击者把内联源代码交给 Task Factory 编译为内存 Assembly 并在受信 Utility 内运行，减少独立载荷对象, en: Adversaries give inline source to task factories that compile in-memory assemblies and execute them inside trusted utilities reducing standalone payload objects}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 无独立制品实用程序内执行是 project 中的 UsingTask/Code 或等价内联源由开发 utility 的 task factory 编译为内存 assembly 并在 utility 进程内执行，不要求持久 standalone executable。稳定变量是输出对象缺失和 in-process execution；项目输入本身仍可存在，故“artifactless”不表示零文件。, en: Artifactless In-Utility Execution has UsingTask and Code or equivalent inline source in a project compiled by a utility task factory into an in-memory assembly and executed inside the utility process without requiring a durable standalone executable. The stable variable is missing output object and in-process execution while project input may remain so artifactless does not mean zero files.}]}
stealth_characteristics: {paragraphs: [{zh: 无独立制品实用程序内执行可绕过新 PE 文件和可疑 child 规则，只留下签名 utility、project 与 dynamic-code memory。Microsoft 明确记录 RoslynCodeTaskFactory 能力，AkaiRyū 与 XML C# 编译执行相符但未证明全程无制品，故 medium。UsingTask/TaskFactory/Code、memory assembly、module/network 仍可观察。, en: Artifactless In-Utility Execution can bypass new-PE and suspicious-child rules leaving a signed utility project and dynamic-code memory. Microsoft explicitly documents RoslynCodeTaskFactory capability and AkaiRyū is consistent with XML C sharp compilation but does not prove complete disklessness so confidence is medium. UsingTask TaskFactory Code memory assemblies modules and network remain visible.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入 utility 进程内由 inline source 产生且无独立持久载荷的执行。普通 project 编译出磁盘程序、外部 DLL load 或 downstream child 属 NJS-0080-001/相邻对象；JIT 开发行为需合法 repo 与 build context 排除。, en: Include only in-utility execution produced from inline source without a standalone durable payload. Ordinary projects producing disk programs external DLL loads or downstream children belong to NJS-0080-001 or adjacent objects and legitimate JIT development is excluded by repository and build context.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者在 MSBuild 可用且应用控制关注磁盘产物/child process 的主机，把 C#/VB 片段嵌入 project 以运行 loader、网络或内存动作。, en: Where MSBuild is available and application control focuses on disk output or child processes adversaries embed C sharp or Visual Basic fragments in projects to run loaders network or memory actions.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要兼容 TaskFactory/runtime、project 执行权限和 inline code；dynamic code security、工具阻断或 project 内容审查会限制。, en: Compatible task factories and runtimes project execution and inline code are required while dynamic-code security utility blocking and project review constrain it.}]}
    defender_model: {paragraphs: [{zh: 需要 project content、UsingTask/Code、MSBuild log、dynamic assembly/memory、module/network，而非仅 child/file；未保留输入时置信度下降。, en: Defenders need project content UsingTask or Code MSBuild logs dynamic assemblies or memory modules and network rather than only children or files and confidence drops when input is not retained.}]}
stealth_mechanisms: [{mechanism_ref: NM-DO, role: primary, summary: {zh: 内存 Task Assembly 替代独立可执行制品, en: In-memory task assemblies replace standalone executable artifacts}, analysis: {paragraphs: [{zh: TaskFactory 将 inline source 编译并在 utility 内执行，使输出 PE object 缺失并形成数据对象混淆。能力有官方证据，field artifactless 细节有限故 medium；project 与 dynamic-code 仍可检测。, en: Task factories compile inline source and execute it in the utility leaving no output PE object and creating Data Object Obfuscation. Official evidence establishes capability while field artifactless detail is limited so confidence is medium and projects plus dynamic code remain detectable.}]}, evidence_refs: [REF-000284], confidence: medium}]
defense: {detections: {coverage: available, strategy_refs: [DET-000091]}, mitigations: {coverage: available, mitigation_refs: [MIT-000092]}}
evidence: {claim_refs: [CLM-000301, CLM-000496, CLM-000499, CLM-000500, CLM-000501, CLM-000502], case_refs: [CASE-000102], reference_refs: [REF-000132, REF-000284, REF-000286, REF-000287, REF-000288]}
research: {limitations: {paragraphs: [{zh: AkaiRyū 证明 MSBuild 编译执行 XML 中 C#，但没有披露 task factory 与输出落盘细节；因此该案只能辅助能力映射，不能将全部攻击链认定为无制品。, en: AkaiRyū proves MSBuild compilation and execution of C sharp from XML but does not disclose task-factory and disk-output details so it supports capability mapping without proving the entire chain artifactless.}]}}
