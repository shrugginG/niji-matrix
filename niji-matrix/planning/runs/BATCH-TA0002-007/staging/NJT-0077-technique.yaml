schema_version: 2.0.0
type: technique
id: NJT-0077
name: {zh: 匿迹化共享模块执行, en: Stealth-Conforming Shared-Module Execution}
summary: {zh: 攻击者把恶意功能作为共享模块映射进现有进程，并通过保持进程身份或绕过标准模块对象降低识别与归因, en: Adversaries map malicious functionality as shared modules into existing processes and reduce detection and attribution by preserving process identity or bypassing standard module objects}
aliases: []
classification: {tactic_refs: [TA0002], origin: {kind: attack-adapted, source_attack_id: T1129, source_attack_version: '19.1'}, decision_ref: DEC-TA0002-T1129}
definition_and_concept:
  paragraphs:
    - {zh: 匿迹化共享模块执行是进程通过 Windows loader、dlopen/dlsym 或自定义映射器把攻击者 DLL、SO、dylib 或等价可执行模块实例化并调用的行为。直接目标是在已有进程地址空间增加 C2、收集、破坏或其他功能，避免为每个功能创建独立 executable process；“共享模块”描述可加载代码单元，不以扩展名、平台或插件功能划界。, en: Stealth-Conforming Shared-Module Execution is a process instantiating and invoking attacker DLL SO dylib or equivalent executable modules through the Windows loader dlopen or dlsym or a custom mapper. Its direct objective is to add C2 collection destructive or other functionality inside an existing address space without a standalone executable process for each function. Shared module describes a loadable code unit rather than extension platform or plugin function.}
    - {zh: 标准 loader 会建立 file-backed image、module list、引用计数和初始化语义；reflective/custom mapper 则自行分配内存、复制节、解析 import/relocation 并调用入口。两者都属于 T1129 的执行对象，但 search-order 候选操纵归 T1574，跨进程写入和线程启动归 T1055，动态 API 解析归 T1106。, en: Standard loaders establish file-backed images module lists reference counts and initialization semantics while reflective or custom mappers allocate memory copy sections resolve imports or relocations and call entries themselves. Both are T1129 execution objects while search-order candidate manipulation belongs to T1574 cross-process writes and thread starts to T1055 and dynamic API resolution to T1106.}
stealth_characteristics:
  paragraphs:
    - {zh: 标准模块承载不产生新的独立程序进程，端点仍看到合法或既有 host 的名称、用户与父子谱系；反射实例化进一步让代码缺少正常磁盘文件、image-load 和 PEB/loader module 记录，只表现为 private executable memory、动态 import 和线程行为。Astaroth 与 PipeMon 分别体现这两个观察断点。, en: Standard module hosting creates no standalone program process and endpoints retain the name user and lineage of a legitimate or existing host. Reflective instantiation further removes normal disk files image-load and PEB or loader module records leaving private executable memory dynamic imports and thread behavior. Astaroth and PipeMon respectively demonstrate the two observation breaks.}
    - {zh: 模块来源、path/hash/signature、host—module 组合、loader call stack、内存 protection change、PE header/section 结构、thread start、API 与网络结果仍可见。标准 loader 子项会被完整 module telemetry 揭示，reflective 子项会被 file-backed image 与 executable memory 差分揭示；只监控进程创建或磁盘扫描会同时失去覆盖。, en: Module origin path hash signature host-to-module combinations loader call stacks memory protection changes PE headers or sections thread starts APIs and network outcomes remain visible. Complete module telemetry exposes standard-loader behavior and file-backed-image-to-executable-memory differentials expose reflective behavior while process-creation-only or disk-only monitoring loses both.}
scope_boundary_definition:
  paragraphs:
    - {zh: 本技术要求恶意模块代码在进程中实际执行。合法插件、浏览器扩展、驱动与应用库不因动态加载自动纳入；必须有异常来源/内容或后继行为。若加载发生在攻击者通过 search-order 使错误候选胜出，T1574 是主要变量；若模块注入另一进程，T1055 共同负责；只调用系统 DLL API 不等同于恶意共享模块。, en: The technique requires malicious module code actually executing in a process. Legitimate plugins browser extensions drivers and application libraries do not qualify from dynamic loading alone and need anomalous provenance content or successor behavior. T1574 is primary when search-order manipulation selects the wrong candidate T1055 co-owns injection into another process and calling APIs from system DLLs is not itself a malicious shared module.}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者在 loader、backdoor、受信代理或被劫持进程中加载功能模块，以按需启用 C2、窃取、截图、破坏或工具扩展。磁盘模块适合借用 host 身份和合法路径，reflective 模块适合减少文件与 module-list 痕迹；网络或加密模块仍需落地/解密或内存传递。, en: Adversaries load function modules inside loaders backdoors trusted proxies or compromised processes to enable C2 theft capture destruction or tooling on demand. Disk modules borrow host identity and plausible paths while reflective modules reduce file and module-list traces and network-delivered or encrypted modules still require delivery decryption or memory transfer.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 攻击者需要在 host 进程获得代码执行并提供兼容架构、ABI、依赖与入口。标准加载受路径、签名和应用控制限制；reflective mapping 需自行处理节、重定位、import、TLS 与 protection，复杂度更高且容易留下异常 memory/thread。跨进程能力不由本技术自动假定。, en: The adversary needs code execution in the host process and compatible architecture ABI dependencies and entry points. Standard loading is constrained by paths signatures and application control while reflective mapping must handle sections relocations imports TLS and protections and adds anomalous memory or thread traces. Cross-process capability is not assumed by this technique.}]}
    defender_model: {paragraphs: [{zh: 防守方假定同时采集 process lineage、module/image load、file provenance、loader/API call stack、virtual memory region/protection、thread start 和后继网络。Linux/macOS/Windows 字段不同但需回答 module 是否 file-backed、是否在 loader inventory、由谁加载、入口如何执行；缺少内存或 call-stack telemetry 时 reflective 分支置信度下降。, en: Defenders are assumed to collect process lineage module or image loads file provenance loader or API call stacks virtual-memory regions and protections thread starts and successor network. Windows Linux and macOS fields differ but must answer whether a module is file-backed present in loader inventory who loaded it and how entry execution occurred. Missing memory or call-stack telemetry lowers reflective-branch confidence.}]}
stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: 模块功能继承既有进程身份和谱系, en: Module functionality inherits existing process identity and lineage}, analysis: {paragraphs: [{zh: 标准 loader 把恶意模块映射进现有进程，功能执行不产生新的 standalone process，进程级规则继续看到 host 的名称与信誉，形成行为透明。Astaroth 借 ExtExport.exe 加载 payload 支持该链；module path/hash、load call 和结果仍能恢复差异，直接匿迹意图未覆盖所有普通 LoadLibrary 场景，故为 medium。, en: A standard loader maps a malicious module into an existing process and function execution creates no standalone process so process-centric rules retain host identity and reputation creating Behavioral Transparency. Astaroth loading payload through ExtExport.exe supports the chain while module path hash load call and outcomes recover differences. Direct evasion intent does not cover every ordinary LoadLibrary scenario so confidence is medium.}]}, evidence_refs: [REF-000279, REF-000282], confidence: medium}
  - {mechanism_ref: NM-DO, role: primary, summary: {zh: 反射映射让执行内存缺少正常模块对象, en: Reflective mapping leaves executable memory without a normal module object}, analysis: {paragraphs: [{zh: 自定义 mapper 不经标准 loader 或磁盘文件完成模块映射，使 PEB/module list 和 file-backed image 缺失，形成数据对象混淆。PipeMon、Microsoft 与 DOUBLEPULSAR 分析直接支持；private executable region、PE-like structure、protection transition、import resolution 与 thread entry 仍可揭示实例。, en: A custom mapper completes module mapping without standard loaders or disk files so PEB or module lists and file-backed images are absent creating Data Object Obfuscation. PipeMon Microsoft and DOUBLEPULSAR analysis directly support the behavior while private executable regions PE-like structure protection transitions import resolution and thread entry still expose it.}]}, evidence_refs: [REF-000280, REF-000281, REF-000283], confidence: high}
subtechnique_taxonomy:
  narrative: {paragraphs: [{zh: 子技术按模块在进程中的可观察表示划分。既有进程内模块承载保留标准 loader 注册与 file backing，变量是进程身份不变；内存驻留模块实例化绕过正常 loader/file object，变量是 executable private memory。DLL/SO/dylib、插件功能、工具和网络来源不成项，search-order 与跨进程边界归相邻技术。, en: Children partition observable module representation inside a process. Existing-process hosting retains standard loader registration and file backing with unchanged process identity as the variable while memory-resident instantiation bypasses normal loader and file objects with executable private memory as the variable. DLL SO dylib plugin function tool and network origin do not form children and search-order or cross-process boundaries belong to adjacent techniques.}]}
  coverage: established
  subtechnique_refs: [NJS-0077-001, NJS-0077-002]
defense: {detections: {coverage: available, strategy_refs: [DET-000090]}, mitigations: {coverage: available, mitigation_refs: [MIT-000091]}}
evidence: {claim_refs: [CLM-000290, CLM-000291, CLM-000292, CLM-000487, CLM-000488, CLM-000489, CLM-000490, CLM-000491, CLM-000492, CLM-000493, CLM-000494], case_refs: [CASE-000099, CASE-000100], reference_refs: [REF-000129, REF-000240, REF-000279, REF-000280, REF-000281, REF-000282, REF-000283]}
research:
  limitations: {paragraphs: [{zh: Astaroth 报告证明合法进程加载和规避目的，但具体标准 module/file 细节不完整，因此第一子项 medium；PipeMon 和反射加载分析为第二子项提供更直接技术证据。标准模块加载是所有软件的基础行为，签名或 LoadLibrary 单点不能定性；非 Windows 的内存 loader telemetry 能力差异也限制统一实现。, en: Astaroth reporting proves legitimate-process loading and evasion purpose but lacks complete standard module or file detail so the first child is medium while PipeMon and reflective-loading analysis provide more direct support for the second. Standard module loading is foundational software behavior and signatures or LoadLibrary points cannot establish malice while non-Windows memory-loader telemetry differences limit uniform implementation.}]}
