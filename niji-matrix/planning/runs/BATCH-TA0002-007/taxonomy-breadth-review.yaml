batch_ref: BATCH-TA0002-007
work_items:
  - work_item_ref: WORK-TA0002-T1129
    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [Windows LoadLibrary and LoadLibraryEx, Linux or macOS dlopen and dlsym, plugin dispatchers, file-backed modules, reflective or custom in-memory mappers]
    breadth_trigger: ordinary-open-search
    candidate_stealth_axes_examined:
      - {axis: loader-process-identity-preserving-module-execution, disposition: formal-medium, trace_change: functionality is added as a module inside an existing loader process without a new standalone executable process, defender_effect: process-centric telemetry retains the host identity and needs module provenance and export-call context; direct stealth intent is incompletely reported}
      - {axis: memory-resident-module-instantiation, disposition: formal-high, trace_change: a custom or reflective mapper creates executable private memory without a normal file-backed image or standard loader registration, defender_effect: file and module inventory miss the code while memory allocation protection thread and import-resolution traces remain}
      - {axis: remote-or-unc-module-source, disposition: evidence-deferred, trace_change: standard loader obtains a module from a network path, defender_effect: source attribution changes but reviewed cases do not establish a stable independent stealth choice}
      - {axis: plugin-function-partition, disposition: not-stealth-distinct, trace_change: modules divide C2 collection or actions, defender_effect: malware architecture changes functionality rather than defender observation}
      - {axis: cross-process-reflective-loading, disposition: adjacent-technique, trace_change: module bytes or loader enter another process, defender_effect: Process Injection owns the cross-process boundary while this parent may co-map module execution}
      - {axis: search-order-or-side-loading, disposition: adjacent-technique, trace_change: legitimate loader resolves an attacker candidate by precedence, defender_effect: T1574 and NJT-0070 own resolver-candidate manipulation}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes_zh: 两个子项按标准 loader 注册的 file-backed 模块与自定义/reflective private executable memory 划分。第一轴有 Astaroth 等实例但直接匿迹意图不完整，保持 medium；PipeMon 和 Microsoft/F-Secure 分析直接支持反射加载规避磁盘与 loader 枚举，第二轴为 high。
    reviewer_notes_en: Two children partition standard loader-registered file-backed modules and custom or reflective private executable memory. Astaroth and similar examples support the first while direct stealth intent is incomplete so it remains medium. PipeMon and Microsoft or F-Secure analysis directly support reflective loading that evades disk and loader enumeration so the second is high.
  - work_item_ref: WORK-TA0002-T1127
    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1127.001, T1127.002, T1127.003]
    represented_dimensions: [MSBuild project and inline tasks, ClickOnce deployment manifests, JamPlus build descriptions]
    breadth_trigger: multi-axis-review
    coverage_resolutions:
      - {attack_ids: [T1127.001, T1127.002, T1127.003], resolution: niji-variable-candidate for trusted-utility input proxy because each signed developer utility consumes attacker-controlled build or deployment input and may spawn or load malicious outcomes}
      - {attack_ids: [T1127.001], resolution: niji-variable-candidate for in-utility inline execution because MSBuild RoslynCodeTaskFactory compiles an in-memory task assembly in the build process; tool label is not imported}
      - {attack_ids: [T1127.002, T1127.003], resolution: parent-core or trusted-input proxy because no conclusion-level evidence establishes an artifactless in-process boundary independent of input proxying}
    candidate_stealth_axes_examined:
      - {axis: trusted-utility-input-proxy-execution, disposition: formal-high, trace_change: a signed developer utility consumes adversary project manifest response or build input and becomes the visible parent or loader, defender_effect: publisher-based application control and process reputation permit execution unless input provenance and outcome chain are evaluated}
      - {axis: artifactless-in-utility-inline-execution, disposition: formal-medium, trace_change: inline source is compiled to an in-memory task assembly and executed in the utility process without a durable standalone payload artifact, defender_effect: child-process and file-creation rules may miss code while project UsingTask Code memory and network traces remain; field evidence is narrower than capability documentation}
      - {axis: remote-input-source, disposition: collapsed-to-input-proxy, trace_change: project or manifest comes from a share or URL, defender_effect: origin is a risk dimension but the stable proxy boundary remains the same}
      - {axis: utility-product-or-language, disposition: not-stealth-distinct, trace_change: MSBuild ClickOnce and JamPlus parse different formats, defender_effect: product-specific telemetry maps to the same two observation variables}
      - {axis: post-utility-process-injection, disposition: adjacent-technique, trace_change: compiled tool injects another process, defender_effect: T1055 owns the resulting cross-process execution while T1127 owns utility proxy}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes_zh: 三个 ATT&CK 工具子项收敛为跨工具的受信输入代理，MSBuild inline task 另形成 in-utility 变量。Frankenstein 与 AkaiRyū 直接支持前者 high；后者主要由 Microsoft 能力文档与相关攻击链推断，保持 medium。远程来源和工具名不独立成项。
    reviewer_notes_en: Three ATT&CK tool children converge on cross-tool trusted-input proxying while MSBuild inline tasks form a separate in-utility variable. Frankenstein and AkaiRyū directly support the former at high confidence while the latter relies mainly on Microsoft capability documentation and related attack chains and remains medium. Remote origin and tool names are not separate children.
