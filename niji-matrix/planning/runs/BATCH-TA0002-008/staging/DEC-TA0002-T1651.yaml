scope_notes_en: Scope requires a cloud command service actually producing guest execution through an agent. Portal CLI or SDK provider and script language do not form children. Container exec ESXi GuestOps ordinary remote logon and APIs only changing resource state are excluded or assigned to adjacent techniques.
