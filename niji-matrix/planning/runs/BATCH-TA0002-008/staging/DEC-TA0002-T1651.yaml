rationale_en: The fixed baseline anchors cloud management service and guest-agent execution. NOBELIUM and Azure Extension mining directly establish adversary use of remote principal agent outcome and maintenance appearance while Azure and AWS documentation supplies request instance agent and output residuals supporting two falsifiable stealth variables and high-confidence adaptation.
