decision: adapt
rationale_zh: VIRTUALPITA 与 UNC3886 现场调查直接证明 Guest Operations 将 ESXi 发起者与 vmtoolsd 来宾结果跨层分离，认证绕过还可移除默认来宾登录事件；Broadcom API 与 `vmware.log` 残余使链条可证伪，支持 high-confidence adapt。
rationale_en: VIRTUALPITA and UNC3886 field investigations directly establish Guest Operations separating the ESXi initiator from vmtoolsd guest outcomes with authentication bypass also removing default guest logon events. Broadcom API and `vmware.log` residuals make the chain falsifiable supporting high-confidence adaptation.
scope_notes_zh: 只纳入从 ESXi/vCenter 经 Guest Operations 实际在来宾启动命令或程序。API 方法、漏洞、凭据类型和来宾 OS 不形成子技术；认证缺失与 vmtoolsd 父级是同一通道的实现/观察端，zero-child 保持 none-justified。
scope_notes_en: Scope includes commands or programs actually started in guests through Guest Operations from ESXi or vCenter. API method vulnerability credential type and guest OS do not form children. Missing authentication and vmtoolsd parentage are implementations or vantages of one channel so zero-child remains none-justified.
