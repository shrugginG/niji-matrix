notes_zh: 直接确认 UNC3886 修改 `/bin/vmx` 认证类型并调用 Guest Operations，在 Windows、Linux 与 PhotonOS 来宾执行命令；成功利用不产生默认来宾认证事件。来源也记录公开披露后指标替换，支持使用跨层行为而非原子指标检测。
notes_en: Directly confirms UNC3886 modify `/bin/vmx` authentication type and invoke Guest Operations to execute commands in Windows Linux and PhotonOS guests with successful exploitation producing no default guest authentication event. It also documents indicator replacement after public reporting and supports cross-plane behavior rather than atomic indicators.
