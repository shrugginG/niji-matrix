- work_item_ref: WORK-TA0002-T1651
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: [cloud command service, tenant identity, guest agent, fleet targeting, guest process]
  breadth_trigger: ordinary-open-search
  candidate_stealth_axes_examined:
  - {axis: control-plane-to-guest-trace-separation, disposition: formal, trace_change: cloud request identity and agent-spawned guest process reside in different data planes, defender_effect: either plane alone loses end-to-end causality}
  - {axis: maintenance-context-command-camouflage, disposition: formal, trace_change: command action principal target set timing and document or script resemble an approved maintenance workflow, defender_effect: command-service presence and agent parent cease to discriminate}
  - {axis: fleet-fanout-dilution, disposition: collapsed-to-parent, trace_change: one control action targets many guests, defender_effect: scale changes cardinality but does not create a boundary independent from cross-plane correlation}
  - {axis: agent-local-privilege, disposition: rejected-as-stealth-axis, trace_change: guest agent may run with SYSTEM or root capability, defender_effect: privilege changes impact but not defender observation by itself}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 2
  breadth_gap_explained: true
  reviewer_notes_zh: 无 ATT&CK 子项仍检索四个轴；跨层痕迹分离和维护情境伪装互不包含，规模与代理权限不构成独立匿迹分类。
  reviewer_notes_en: Four axes were searched despite no ATT&CK children. Cross-plane trace separation and maintenance-context camouflage are independent; scale and agent privilege do not form separate stealth categories.
- work_item_ref: WORK-TA0002-T1675
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: [ESXi host, Guest Operations API, vmtoolsd, guest authentication, vmware.log, guest process]
  breadth_trigger: zero-child-explicit-gap-review
  candidate_stealth_axes_examined:
  - {axis: hypervisor-to-guest-observation-break, disposition: formal-at-parent, trace_change: remote initiator and Guest Operations request remain on ESXi while guest sees a vmtoolsd-descended process, defender_effect: endpoint-only or hypervisor-only review loses causality}
  - {axis: guest-authentication-event-suppression, disposition: collapsed-to-parent, trace_change: CVE-2023-20867 removes guest authentication events, defender_effect: this is one exploited implementation of the same management-to-guest observation break and does not cover credentialed Guest Operations}
  - {axis: trusted-vmtoolsd-parent, disposition: collapsed-to-parent, trace_change: command appears below a legitimate guest agent, defender_effect: the feature disguise is inseparable from the same Guest Operations channel}
  - {axis: vmci-backdoor-channel, disposition: excluded, trace_change: custom host or guest backdoor communicates over VMCI, defender_effect: direct backdoor C2 or lateral movement is not the ESXi administration-command object}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 0
  breadth_gap_explained: true
  reviewer_notes_zh: 公开证据稳定支持一个 hypervisor-to-guest 通道变量；认证绕过和 vmtoolsd 父级是该变量的实现与两个观察端，不应重复拆分，VMCI 后门则超出直接对象。
  reviewer_notes_en: Public evidence stably supports one hypervisor-to-guest channel variable. Authentication bypass and the vmtoolsd parent are implementations or opposite vantages of that variable and should not be duplicated; a VMCI backdoor is outside the direct object.
