schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0066-002
parent_ref: NJT-0066
name: {zh: 自动化身份执行一致性, en: Automation-Identity Exec Conformity}
summary: {zh: 攻击者通过服务账户、kubelet 或运维自动化身份对其历史目标调用 exec，使主体、subresource 与 workload 关系接近合法诊断。, en: Adversaries invoke exec through a service account kubelet or operations-automation identity against its historical targets so principal subresource and workload relation resemble legitimate diagnostics.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 自动化身份执行一致性固定“请求身份—目标关系”变量：攻击者取得 service account、kubelet client、CI/SRE 机器人或等价身份后，对该身份通常管理的 namespace、Pod 和 exec subresource 发起命令，使身份、verb 与目标符合现有允许规则。直接结果仍是容器内进程，独立匿迹效果来自恶意请求借用合法自动化特征。
    en: Automation-Identity Exec Conformity fixes a principal-to-target relation variable. After obtaining a service account kubelet client CI or SRE robot or equivalent identity the adversary invokes commands against namespaces Pods and exec subresources that identity normally manages so principal verb and target satisfy existing allowances. The direct outcome remains an in-container process while the independent stealth effect is malicious requests borrowing legitimate automation features.
  - zh: 匿名 kubelet、个人账户对陌生 namespace 的 exec 或明显越权不属于本子项，即使属于父技术。工作负载是否既有仍由父技术限定；本项不是所有 service-account API 滥用，而只处理 exec 请求的上下文一致性。
    en: Anonymous kubelet, a personal account exec against an unfamiliar namespace, or overtly excessive privilege does not qualify even when it instantiates the parent. The parent still requires an existing workload. This child is not all service-account API abuse but only contextual conformity of exec requests.
stealth_characteristics:
  paragraphs:
  - zh: 自动化身份执行一致性使基于主体、verb 或 namespace 的简单规则把恶意命令放入合法诊断基线。Kubernetes 授权明确按 user/group、resource、subresource 和 namespace 判断，Microsoft 说明默认 service-account token 与 kubeconfig 可被攻击者利用；这些资料证明能力和可见特征，但未直接证明现场攻击者有意匹配历史自动化模式，因此保持 medium。
    en: Automation-Identity Exec Conformity makes principal verb or namespace rules place malicious commands in a legitimate diagnostics baseline. Kubernetes authorization explicitly evaluates user or group resource subresource and namespace, and Microsoft documents adversary access to default service-account tokens and kubeconfig. This establishes capability and visible features but not a field adversary's deliberate matching of historical automation patterns, so confidence remains medium.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明身份通常具有对目标 exec 的合法用途，并有迹象表明攻击者控制该身份后沿其常规范围调用；仅凭 service account 名称或权限存在不足。内容、源地址、时间、token issuer/session、审批和 runtime 结果仍需形成差分。若只有 workload 不变而身份明显异常，则仅归 NJS-0066-001。
    en: Evidence must show the identity normally has legitimate exec use against the target and indication that adversary control followed its ordinary scope. Service-account name or permission alone is insufficient. Content source address time token issuer or session approval and runtime outcome still form the differential. If only the workload remains unchanged and identity is clearly anomalous classify NJS-0066-001 alone.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者从 Pod、CI runner、kubeconfig 或节点取得自动化令牌，随后在该身份历史管理的 namespace 对应用或系统 Pod 执行命令，使身份与目标关系不触发静态 RBAC/允许名单告警。, en: An adversary obtains an automation token from a Pod CI runner kubeconfig or node then executes commands in application or system Pods in namespaces historically managed by that identity so principal-to-target relation avoids static RBAC or allowlist alerts.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要窃取未过期 token/证书并了解身份正常范围；短期 token、audience 绑定、Pod 身份、最小 subresource 权限和源约束会限制。超出时间、源或命令基线会暴露。, en: Requires a valid stolen token or certificate and knowledge of normal identity scope. Short-lived tokens audience binding Pod identity least subresource authority and source constraints reduce it. Deviation in time source or command baseline can expose it.}]}
    defender_model: {paragraphs: [{zh: 需记录 token issuer/audience/session、源 workload/IP、user/groups/extra、目标与命令结果，并为自动化身份建立“谁—从哪—对谁—做什么”的联合基线；仅看 RBAC allow 决策不足。, en: Defenders record token issuer audience or session source workload or IP user groups and extra target and command outcome and baseline who from where against whom does what for automation identities. RBAC allow decisions alone are insufficient.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: 恶意 exec 请求借用合法自动化身份与目标关系, en: Malicious exec requests borrow legitimate automation identity-to-target relations}
  analysis: {paragraphs: [{zh: 攻击者使用预期身份、verb 和 namespace/Pod 关系，使恶意与合法诊断共享分类特征，符合特征伪装。能力与防守观察由 Kubernetes/Microsoft 资料支持，但攻击者意图仅强推断，保持 medium；token 来源、时间、内容、审批和 runtime 结果是残余。, en: The adversary uses an expected identity verb and namespace or Pod relation so malicious and legitimate diagnostics share classification features consistent with Feature Disguise. Kubernetes and Microsoft material supports capability and defender observation but adversary intent is strongly inferred so confidence remains medium. Token origin time content approval and runtime outcome are residuals.}]}
  evidence_refs: [REF-000212, REF-000216, REF-000217]
  confidence: medium
defense: {detections: {coverage: available, strategy_refs: [DET-000081]}, mitigations: {coverage: available, mitigation_refs: [MIT-000081]}}
evidence: {claim_refs: [CLM-000259, CLM-000407], case_refs: [], reference_refs: [REF-000212, REF-000216, REF-000217]}
research:
  limitations: {paragraphs: [{zh: 当前没有满足“现场攻击者有意沿历史自动化范围 exec”的直接案例，分类依赖明确权限语义和检测假设。若未来证据只证明 token 被盗而不证明上下文一致性，应合并回父级或延期，不以对称性维持。, en: No direct case currently satisfies a field adversary deliberately executing within historical automation scope. The category relies on explicit authorization semantics and detection hypotheses. If future evidence shows only stolen tokens without contextual conformity the child should merge into the parent or be deferred rather than preserved for symmetry.}]}
