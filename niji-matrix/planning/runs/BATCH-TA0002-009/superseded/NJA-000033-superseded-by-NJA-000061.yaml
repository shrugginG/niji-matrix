schema_version: 2.0.0
type: detection-analytic
id: NJA-000033
strategy_ref: DET-000058
name:
  zh: 容器创建—首个动作关联分析
  en: Container Creation-to-First-Action Correlation Analytic
summary:
  zh: 按稳定关联键恢复容器创建—首个动作关联中的控制、执行与结果序列。
  en: Recover the control, execution, and outcome sequence for Container Creation-to-First-Action Correlation through stable correlation keys.
domains:
- enterprise
platforms:
- Containers
logic:
  paragraphs:
  - zh: 分析先将各数据源时间、主体、目标和请求或进程标识规范化，再建立控制或触发事件、实际执行和后续结果的有向序列。仅在异常主体或情境与执行谱系、完整性变化或网络结果共同出现时提高风险；缺少任何一层时降低置信度而不是把单点信号直接定性。
    en: The analytic first normalizes time, principal, target, and request or process identifiers across data sources, then builds a directed sequence from control or trigger event through
      actual execution to follow-on outcome. Raise risk only when an anomalous principal or context co-occurs with execution lineage, integrity change, or network outcome; when a layer
      is missing, lower confidence rather than classifying a point signal by itself.
data_requirements:
- source_type: container-admission-audit
  name:
    zh: 容器创建与准入审计
    en: Container creation and admission audit
  channel: null
  required_fields:
  - timestamp
  - principal_id
  - request_id
  - cluster_id
  - namespace
  - workload_id
  - spec_hash
  - admission_result
- source_type: container-image-provenance
  name:
    zh: 镜像与发布谱系
    en: Image and release provenance
  channel: null
  required_fields:
  - timestamp
  - image_digest
  - registry
  - signature
  - build_id
  - release_id
  - deployer_id
- source_type: container-runtime-outcome
  name:
    zh: 容器运行时首个行为
    en: Container runtime first actions
  channel: null
  required_fields:
  - timestamp
  - workload_id
  - container_id
  - process
  - command_line
  - file_path
  - network_destination
  - privilege_flags
observables:
- zh: 非发布主体创建规格近似但缺少可信发布谱系的新工作负载
  en: A non-release principal creates a specification-conforming workload without trusted release lineage
- zh: 常见基础镜像启动后立即取得载荷、开启外连或执行异常工具
  en: A common base image retrieves a payload, opens egress, or runs an unusual tool immediately after start
correlation:
  window:
    zh: 窗口覆盖创建请求前十分钟至容器启动后三十分钟，短命作业不得因终止而提前丢弃事件。
    en: The window covers ten minutes before the creation request through thirty minutes after container start, and events for short-lived jobs are retained after termination.
  dimensions:
  - principal
  - request
  - cluster
  - namespace
  - workload
  - image_digest
  - service_account
  - node
  - process
  - network_destination
  - time
false_positives:
- zh: 持续部署、自动扩缩、临时运维作业和开发测试会频繁创建短命容器。
  en: Continuous delivery, autoscaling, temporary operations jobs, and development tests frequently create short-lived containers.
blind_spots:
- zh: 缺少不可变镜像摘要、准入请求主体或短命容器运行时遥测时，创建与真实内容无法可靠关联。
  en: Creation cannot be joined reliably to real content without immutable image digests, admission-request principals, or runtime telemetry for short-lived containers.
tuning_guidance:
  paragraphs:
  - zh: 按业务角色、管理来源、资产或命名空间、软件版本、变更窗口和正常父子谱系建立基线，并分别评分主体异常、控制差异、执行结果与完整性变化。白名单必须绑定具体主体、目标、用途和有效期，不能永久排除受信服务、签名进程、自动化身份或维护时段；对缺失数据明确降低置信度。
    en: Build baselines by business role, management origin, asset or namespace, software version, change window, and normal parent-child lineage, and score principal anomaly, control
      difference, execution outcome, and integrity change separately. Allowlists must bind a concrete principal, target, purpose, and validity period rather than permanently excluding
      trusted services, signed processes, automation identities, or maintenance periods; explicitly lower confidence for missing data.
evidence_refs:
- REF-000119
