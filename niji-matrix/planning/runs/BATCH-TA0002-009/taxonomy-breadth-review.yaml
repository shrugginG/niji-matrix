- work_item_ref: WORK-TA0002-T1609
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: [Kubernetes exec subresource, kubelet API, Docker exec, workload identity, runtime process]
  breadth_trigger: ordinary-open-search
  candidate_stealth_axes_examined:
  - {axis: existing-workload-exec-context-borrowing, disposition: formal, trace_change: adversary commands execute inside an already approved workload with unchanged image and deployment identity, defender_effect: deployment review and new-container alerts see no new object while runtime behavior inherits application context}
  - {axis: automation-identity-exec-conformity, disposition: formal-medium, trace_change: exec request uses a service account kubelet or automation identity whose access to the target workload is expected, defender_effect: identity-only and API-verb-only analytics lose discrimination}
  - {axis: interactive-tty, disposition: collapsed-to-parent, trace_change: exec request allocates a terminal, defender_effect: TTY is a parameter and not an independent stealth effect because both malicious and diagnostic sessions use it}
  - {axis: direct-kubelet-versus-apiserver, disposition: implementation-only, trace_change: request enters through different control endpoints, defender_effect: changes telemetry source but retains the same request-to-runtime causal object}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 2
  breadth_gap_explained: true
  reviewer_notes_zh: 既有工作负载上下文有两个外部攻击案例支持；自动化身份轴由权限模型和狩猎资料强推断，因缺少直接现场意图保持 medium。TTY 与入口端点不形成分类。
  reviewer_notes_en: Existing-workload context is supported by two external-attack cases. The automation-identity axis is strongly inferred from the permission model and hunting guidance and remains medium without direct field intent evidence. TTY and endpoint do not form categories.
- work_item_ref: WORK-TA0002-T1610
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: [workload create, image reference and digest, admission, security context, first runtime action]
  breadth_trigger: ordinary-open-search
  candidate_stealth_axes_examined:
  - {axis: benign-image-late-payload-bootstrap, disposition: formal, trace_change: a generic or approved base image passes image-time scrutiny and retrieves or constructs malicious code only after start, defender_effect: image scanning and digest trust do not contain runtime payload identity}
  - {axis: workload-specification-context-camouflage, disposition: formal, trace_change: image reference workload name namespace labels owner service account or resource profile resemble approved application context, defender_effect: specification-level classification groups the malicious deployment with legitimate workloads}
  - {axis: privileged-container-deployment, disposition: parent-or-impact-only, trace_change: security context requests host access or privilege, defender_effect: the field is highly observable and changes capability rather than independently producing stealth}
  - {axis: mutable-tag-time-of-check-use, disposition: deferred-to-image-lineage, trace_change: tag resolves to different digest between scan and pull, defender_effect: this is governed by NJT-0092 image identity-content-instance lineage rather than deployment-context taxonomy}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 2
  breadth_gap_explained: true
  reviewer_notes_zh: 良性镜像后置载荷改变镜像—运行时内容关系，规范情境伪装改变工作负载元数据—真实目的关系；两者互不包含。高权限字段归影响，tag TOCTOU 复用镜像谱系对象。
  reviewer_notes_en: Benign-image late bootstrap changes image-to-runtime content identity while specification-context camouflage changes workload metadata-to-purpose relation and neither contains the other. Privilege fields describe impact and tag TOCTOU reuses image-lineage governance.
