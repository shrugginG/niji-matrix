type: detection-strategy
id: DET-000058
name:
  zh: 管理面到工作负载执行关联
  en: Management-Plane-to-Workload Execution Correlation
summary:
  zh: 将云、容器和虚拟化管理请求与来宾或工作负载中的真实执行结果关联。
  en: Correlate cloud, container, and virtualization management requests with actual execution inside guests or workloads.
description:
  paragraphs:
    - zh: 本策略以跨层因果和执行谱系为检测目标，覆盖所列父技术与子技术。关联分析分别规范控制或触发事件、实际执行结果和上下文基线；只有多个同一关联键的信号共同出现时才提高风险，合法维护、自动化、软件更新和用户活动必须保留为替代解释。
      en: This strategy targets cross-layer causality and execution lineage across the listed parents and children. Its analytics normalize control or trigger events, actual execution outcomes, and contextual baselines. Risk increases only when multiple signals share correlation keys, while legitimate maintenance, automation, software updates, and user activity remain alternative explanations.
