schema_version: 2.0.0
type: mitigation
id: MIT-000057
name:
  zh: 特权管理面执行治理
  en: Privileged Management-Plane Execution Governance
summary:
  zh: 以最小权限、即时授权、受管来源和跨层审计约束云、容器与虚拟化管理执行。
  en: Constrain cloud, container, and virtualization management execution through least privilege, just-in-time authorization, managed origins, and cross-layer audit.
description:
  paragraphs:
    - zh: 本缓解将可复用控制与逐目标应用分开，通过以最小权限、即时授权、受管来源和跨层审计约束云、容器与虚拟化管理执行。实施时同时保留检测所需审计，避免以单一信誉、签名或白名单替代最小权限和完整性验证。
      en: This mitigation separates reusable controls from per-target applications. It will constrain cloud, container, and virtualization management execution through least privilege, just-in-time authorization, managed origins, and cross-layer audit. Implementation also preserves audit required for detection and does not substitute a single reputation, signature, or allowlist for least privilege and integrity validation.
domains:
  - enterprise
measures:
  - key: management-plane-least-privilege
    name:
      zh: 管理面最小权限与执行证据
      en: Management-Plane Least Privilege and Execution Evidence
    description:
      paragraphs:
        - zh: 以最小权限、即时授权、受管来源和跨层审计约束云、容器与虚拟化管理执行。
          en: Constrain cloud, container, and virtualization management execution through least privilege, just-in-time authorization, managed origins, and cross-layer audit.
    control_type: governance
applications:
  - target_ref: NJT-0076
    use:
      paragraphs:
        - zh: 针对痕迹分离型无服务器执行，把本缓解应用于直接执行对象、控制接口和关键谱系：限制不必要权限与可调用面，验证定义、输入或制品完整性，保留触发前后的关联键，并把例外绑定到具体主体、目标、用途和有效期。
          en: "For Trace-Separated Serverless Execution, apply this mitigation to the direct execution object, control interface, and critical lineage: restrict unnecessary privileges and callable surfaces, verify definition, input, or artifact integrity, retain pre-trigger and post-trigger correlation keys, and bind exceptions to a concrete principal, target, purpose, and validity period."
    expected_effect:
      paragraphs:
        - zh: 该应用降低痕迹分离型无服务器执行借用受信服务、工具、工作负载、用户或管理路径的机会，提高攻击者维持权限、情境匹配和低差异痕迹的成本，并改善跨层归因。
          en: This application reduces opportunities for Trace-Separated Serverless Execution to borrow trusted services, tools, workloads, users, or management paths, raises the cost of maintaining privilege, contextual fit, and low-difference traces, and improves cross-layer attribution.
    limitations:
      paragraphs:
        - zh: 该控制不能消除所有痕迹分离型无服务器执行实例；合法管理、开发、软件更新、用户工作流和业务连续性可能要求保留部分接口。强制处置必须依赖组合证据，并评估可用性、隐私与跨团队日志权限。
          en: The control cannot eliminate every instance of Trace-Separated Serverless Execution; legitimate administration, development, software updates, user workflows, and business continuity may require retaining some interfaces. Enforcement must rely on combined evidence and account for availability, privacy, and cross-team logging authority.
