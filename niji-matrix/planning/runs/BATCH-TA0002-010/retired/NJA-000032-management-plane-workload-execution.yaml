schema_version: 2.0.0
type: detection-analytic
id: NJA-000032
strategy_ref: DET-000058
name:
  zh: 管理面—工作负载执行关联分析
  en: Management-Plane-to-Workload Execution Correlation Analytic
summary:
  zh: 按稳定关联键恢复管理面—工作负载执行关联中的控制、执行与结果序列。
  en: Recover the control, execution, and outcome sequence for Management-Plane-to-Workload Execution Correlation through stable correlation keys.
domains:
- enterprise
platforms:
- IaaS
- Containers
- ESXi
- SaaS
- Windows
- Linux
- macOS
- Network Devices
logic:
  paragraphs:
  - zh: 分析先将各数据源时间、主体、目标和请求或进程标识规范化，再建立控制或触发事件、实际执行和后续结果的有向序列。仅在异常主体或情境与执行谱系、完整性变化或网络结果共同出现时提高风险；缺少任何一层时降低置信度而不是把单点信号直接定性。
    en: The analytic first normalizes time, principal, target, and request or process identifiers across data sources, then builds a directed sequence from control or trigger event through
      actual execution to follow-on outcome. Raise risk only when an anomalous principal or context co-occurs with execution lineage, integrity change, or network outcome; when a layer
      is missing, lower confidence rather than classifying a point signal by itself.
data_requirements:
- source_type: management-control-plane-audit
  name:
    zh: 云、容器与虚拟化管理审计
    en: Cloud, container, and virtualization management audit
  channel: null
  required_fields:
  - timestamp
  - principal_id
  - source
  - target_id
  - action
  - request_id
  - result
- source_type: workload-process-lineage
  name:
    zh: 来宾与容器进程谱系
    en: Guest and container process lineage
  channel: null
  required_fields:
  - timestamp
  - workload_id
  - agent_process
  - process_id
  - parent_process_id
  - image
  - command_line
- source_type: privileged-identity-context
  name:
    zh: 特权身份和变更情境
    en: Privileged identity and change context
  channel: null
  required_fields:
  - timestamp
  - principal_id
  - role
  - session_id
  - approval_id
  - maintenance_window
  - source
observables:
- zh: 非常用主体或来源调用远程命令、容器 exec 或 Guest Operations 动作
  en: An uncommon principal or source invokes remote command, container exec, or Guest Operations actions
- zh: 管理请求后工作负载内由常驻代理派生异常命令或工具
  en: An unusual command or tool is spawned by a resident agent inside the workload after a management request
- zh: 集中部署或配置管理任务由异常控制台主体发起，并由受信代理在多个目标产生非基线进程或网络结果
  en: A centralized deployment or configuration task originates from an unusual console principal and a trusted agent produces off-baseline process or network outcomes across targets
correlation:
  window:
    zh: 窗口从管理请求前十五分钟延伸到工作负载执行后一小时，并按代理队列或编排延迟调整。
    en: The window starts fifteen minutes before the management request and extends one hour after workload execution, adjusted for agent queueing or orchestration delay.
  dimensions:
  - principal
  - request
  - management_source
  - workload
  - agent
  - process
  - tenant
  - cluster
  - time
false_positives:
- zh: 获准维护、自动修复、备份和事件响应会跨管理面批量执行命令。
  en: Approved maintenance, automated remediation, backup, and incident response can execute commands in bulk through management planes.
blind_spots:
- zh: 控制面请求 ID 未进入工作负载、来宾或容器未采集进程以及跨租户日志不可用时会失去因果链。
  en: Causality is lost when control-plane request IDs do not reach workloads, guest or container process telemetry is absent, or cross-tenant logs are unavailable.
tuning_guidance:
  paragraphs:
  - zh: 按业务角色、管理来源、资产或命名空间、软件版本、变更窗口和正常父子谱系建立基线，并分别评分主体异常、控制差异、执行结果与完整性变化。白名单必须绑定具体主体、目标、用途和有效期，不能永久排除受信服务、签名进程、自动化身份或维护时段；对缺失数据明确降低置信度。
    en: Build baselines by business role, management origin, asset or namespace, software version, change window, and normal parent-child lineage, and score principal anomaly, control
      difference, execution outcome, and integrity change separately. Allowlists must bind a concrete principal, target, purpose, and validity period rather than permanently excluding
      trusted services, signed processes, automation identities, or maintenance periods; explicitly lower confidence for missing data.
