schema_version: 2.0.0
type: detection-analytic
id: NJA-000037
strategy_ref: DET-000058
name:
  zh: 无服务器控制—事件—结果谱系分析
  en: Serverless Control-Event-Outcome Lineage Analytic
summary:
  zh: 以稳定关联键恢复无服务器控制—事件—结果谱系中的控制、执行与结果序列。
  en: Recover the control, execution, and outcome sequence for Serverless Control-Event-Outcome Lineage through stable correlation keys.
domains:
- enterprise
platforms:
- IaaS
- Office Suite
- SaaS
logic:
  paragraphs:
  - zh: 分析先规范各数据源的时间、主体、目标和请求或进程标识，再建立控制或触发、真实执行和后继结果的有向序列。只有异常主体或情境与执行谱系、完整性变化或网络结果共同出现时才提高风险；任一层缺失时降低置信度而不把单点信号直接定性。
    en: The analytic first normalizes time, principal, target, and request or process identifiers across sources, then builds a directed sequence from control or trigger through actual
      execution to follow-on outcome. Risk rises only when an anomalous principal or context co-occurs with execution lineage, integrity change, or network outcome; a missing layer lowers
      confidence rather than turning a point signal into a conclusion.
data_requirements:
- source_type: serverless-control-plane-audit
  name:
    zh: 无服务器控制面审计
    en: Serverless control-plane audit
  channel: null
  required_fields:
  - timestamp
  - principal_id
  - service
  - function_id
  - action
  - version
  - role_id
  - request_id
- source_type: serverless-trigger-invocation
  name:
    zh: 函数触发与调用记录
    en: Function trigger and invocation records
  channel: null
  required_fields:
  - timestamp
  - function_id
  - version
  - event_source
  - invocation_id
  - region
  - duration
  - result
- source_type: cloud-resource-access
  name:
    zh: 云资源与 SaaS 操作审计
    en: Cloud-resource and SaaS operation audit
  channel: null
  required_fields:
  - timestamp
  - principal_id
  - role_id
  - resource_id
  - action
  - source_function
  - network_destination
  - result
observables:
- zh: 新建或修改函数在异常事件源触发后立即访问敏感资源或外部目的地
  en: A new or modified function accesses sensitive resources or external destinations immediately after an unusual event-source trigger
- zh: 同一函数版本跨短驻实例产生不符合该服务身份基线的 API 序列
  en: The same function version produces an API sequence outside the service-identity baseline across ephemeral instances
correlation:
  window:
    zh: 窗口从函数或触发器变更前一小时延伸到最后一次相关调用后二十四小时，并按异步事件重试策略调整。
    en: The window starts one hour before function or trigger modification and extends twenty-four hours after the last related invocation, adjusted for asynchronous retry policy.
  dimensions:
  - tenant
  - principal
  - function
  - version
  - trigger
  - invocation
  - role
  - resource
  - region
  - time
false_positives:
- zh: 新功能发布、自动修复、业务集成和灾难恢复会创建函数并产生新的下游 API 序列。
  en: New feature releases, automated remediation, business integrations, and disaster recovery can create functions and produce new downstream API sequences.
blind_spots:
- zh: 服务未记录代码版本、事件源不传递调用标识或下游 SaaS 审计不可用时，控制面与结果无法可靠连接。
  en: Control and outcome cannot be linked reliably when the service does not log code versions, event sources omit invocation identifiers, or downstream SaaS audit is unavailable.
tuning_guidance:
  paragraphs:
  - zh: 按业务角色、来源、资产、软件版本、变更窗口和正常执行谱系建立基线，并分别评分主体异常、控制差异与执行结果。白名单必须绑定具体主体、目标、用途和有效期，不能永久排除受信服务、签名进程、自动化身份或维护时段；对缺失数据明确降低置信度。
    en: Build baselines by business role, origin, asset, software version, change window, and normal execution lineage, and score principal anomaly, control difference, and outcome separately.
      Allowlists must bind a concrete principal, target, purpose, and validity period rather than permanently excluding trusted services, signed processes, automation identities, or
      maintenance periods; explicitly lower confidence for missing data.
evidence_refs:
