statement_zh: 无服务器执行把攻击者代码或自动化动作交给云提供商短驻实例或 SaaS 集成服务运行，使客户没有稳定主机可观察，并可由普通业务事件在服务身份下触发；这些控制面—运行时与事件—动作断点改变防守观察，支持在 TA0002 下适配为匿迹技术。
statement_en: Serverless Execution hands adversary code or automation actions to provider-managed short-lived instances or SaaS integration services leaving no stable customer host and allowing normal business events to trigger execution under service identities. These control-plane-to-runtime and event-to-action breaks change defender observation and support adaptation as a stealth technique under TA0002.
