statement_zh: 短驻函数实例执行以攻击者代码在无稳定客户主机、调用后运行态可能被回收的托管实例中执行为稳定变量，防御依赖代码版本、invocation 与 API/网络结果而非主机持续取证；Denonia 证明技术对象但未知部署路径限制置信度为 medium。
statement_en: Ephemeral Function-Instance Execution uses adversary code running in provider-managed instances without stable customer hosts and with runtime state reclaimed after invocation. Defense depends on code version invocation and API or network outcomes rather than durable host forensics. Denonia establishes the technical object but its unknown deployment path limits confidence to medium.
