statement_en: Benign Event-Stream-Coupled Execution uses malicious functions or flows activated only when normal mail file user queue or storage events arrive under an existing service identity. Detection requires flow or function version trigger execution identity and sensitive outcome correlation. DART proves malicious Flow automation but does not disclose the complete trigger so confidence is medium.
