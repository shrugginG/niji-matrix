statement_zh: Fleet 范围分布式执行以一个管理 job 通过目标 collection 和各 agent 的独立 check-in/队列扩展为多端点执行为稳定变量，防御需要按共同 operation/package 聚合而非逐主机定性；案例证明 fan-out 能力，但未证明攻击者刻意低慢分批，故置信度为 medium。
statement_en: Fleet-Scope Distributed Execution uses one management job fanning out through a target collection and independent agent check-ins or queues into multi-endpoint execution. Defense aggregates by common operation or package rather than classifying host by host. Cases prove fan-out capability but not deliberate low-and-slow staging so confidence is medium.
