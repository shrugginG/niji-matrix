decision: retain
rationale_zh: 固定基线定义通过 SCCM、Intune、ePO、PDQ、BigFix、SSM 等企业部署与配置管理套件远程执行。APT32、AvosLocker 和 Medusa 的现场报告直接证明攻击者可借受信 agent 和中央 fleet scope 推送恶意软件或加密载荷。原有“批准窗口伪装”和“分批低慢”缺乏直接意图证据，因此 taxonomy 重写为受信 agent 命令代理和 fleet 范围分布式执行，后者保持 medium。
rationale_en: The fixed baseline defines remote execution through enterprise deployment and configuration suites such as SCCM Intune ePO PDQ BigFix and SSM. Field reporting on APT32 AvosLocker and Medusa directly proves adversaries using trusted agents and central fleet scope to push malware or encryption payloads. Existing approved-window camouflage and low-and-slow staging lacked direct intent evidence so the taxonomy is rewritten as trusted-agent command brokerage and fleet-scope distributed execution with the latter remaining medium.
scope_notes_zh: 正式范围从已建立的企业管理控制面提交 package/script/command 开始，以受管 agent 在一个或多个端点产生进程或影响为执行点。普通远程 shell、只为单机交互临时安装的 RMM、云资源管理、CI/CD 流水线和本地安装排除；一个工具只有承担 fleet 部署/配置职责时才进入本对象。Niji 子项不按产品、操作系统或工具名划分。
scope_notes_en: Formal scope begins with package script or command submission through an established enterprise management control plane and reaches execution when managed agents produce processes or impact on one or more endpoints. Ordinary remote shell newly installed RMM used only for one-host interaction cloud resource administration CI/CD pipelines and local installation are excluded. A tool enters only when serving fleet deployment or configuration responsibilities and children are not partitioned by product operating system or tool name.
