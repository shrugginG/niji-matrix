candidate: {source_type: attack, source_attack_id: T1648, source_attack_version: '19.1', name_en: Serverless Execution, name_zh: 无服务器执行}
decision: adapt
rationale_zh: 固定基线把云函数、集成服务和办公自动化的代码/动作执行纳入同一父行为。Denonia 证明专门面向 Lambda 的恶意运行环境，Microsoft DART 证明攻击者在真实租户启用 Microsoft Flow 自动窃取结果；AWS 文档确认代码版本、角色、trigger 和 invocation 分属不同日志面。因此父级适配为“痕迹分离型无服务器执行”，保留短驻实例和良性事件耦合两个证据校准子项。
rationale_en: The fixed baseline groups code and action execution across cloud functions integration services and office automation. Denonia proves malware specifically targeting the Lambda runtime and Microsoft DART proves an attacker enabling Microsoft Flow to automate theft in a real tenant while AWS documentation shows code versions roles triggers and invocations across separate log planes. The parent is adapted as Trace-Separated Serverless Execution with two evidence-calibrated children for ephemeral instances and benign-event coupling.
scope_notes_zh: 正式范围要求云提供商或 SaaS 自动化服务实际执行攻击者控制代码或动作。只创建函数、赋予角色、建立 trigger 而未调用，不构成 Execution；IaaS VM 命令、容器 exec、CI runner 和本地 RPA 分别归相邻对象。短驻子项不能从“serverless 默认短命”自动推断攻击意图，事件耦合子项也需要证明正常业务事件与恶意动作的因果连接。
scope_notes_en: Formal scope requires a cloud provider or SaaS automation service to execute adversary-controlled code or actions. Function creation role assignment or trigger creation without invocation does not establish Execution and IaaS VM commands container exec CI runners and local RPA belong to adjacent objects. The ephemeral child cannot infer intent from serverless defaults alone and the event-coupled child requires a causal connection between normal business events and malicious actions.
