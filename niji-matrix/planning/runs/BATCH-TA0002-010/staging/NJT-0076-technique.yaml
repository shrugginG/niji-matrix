research:
  limitations:
    paragraphs:
      - zh: Denonia 证明样本为 Lambda 定向设计，但 Cado 未发现其部署路径，也没有证明攻击者在真实 Lambda 租户完成挖矿；因此短驻子项不能把样本来源强化为完整入侵。DART 案例确认 Microsoft Flow 被用于自动窃取，但公开材料没有 flow 定义与 trigger 字段，事件耦合机制只到 medium。两案平台差异也限制跨服务泛化。
        en: Denonia proves Lambda-targeted sample design but Cado did not identify deployment or prove completed mining in a real Lambda tenant so the ephemeral child cannot upgrade sample origin into a complete intrusion. DART confirms Microsoft Flow automated theft but publishes neither the flow definition nor trigger fields leaving the event-coupled mechanism at medium. Platform differences between the cases also limit generalization.
      - zh: 云函数短驻和业务事件触发都是正常架构属性，只有攻击者有意利用它们改变观察且实际产生恶意执行时才属于子项。提供商日志、字段默认值和保留会变化，正式 Analytic 的规范字段必须按租户验证。未来若直接运行时遥测变得可用，短驻性的防御差异可能缩小，taxonomy 应复审而不是永久固化。
        en: Ephemeral cloud functions and business-event triggers are normal architecture properties and qualify only when an adversary deliberately uses them to change observation and malicious execution actually occurs. Provider logs field defaults and retention change and canonical analytic fields require tenant validation. If direct runtime telemetry becomes available the defense difference from ephemerality may shrink and taxonomy should be reviewed rather than frozen.
