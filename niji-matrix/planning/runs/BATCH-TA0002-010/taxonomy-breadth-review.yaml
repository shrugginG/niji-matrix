batch_ref: BATCH-TA0002-010
work_items:
  - work_item_ref: WORK-TA0002-T1648
    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [cloud functions, integration and automation services, office-suite flows and scripts, event-source mappings, delegated execution roles]
    breadth_trigger: ordinary-open-search
    candidate_stealth_axes_examined:
      - {axis: ephemeral-function-instance-execution, disposition: formal-medium, trace_change: provider creates short-lived managed instances with no customer host and runtime state disappears after invocation, defender_effect: endpoint-centric telemetry and post-event host forensics cannot see execution while control-plane invocation logs and function output remain; Denonia deployment path is unknown}
      - {axis: benign-event-stream-coupled-execution, disposition: formal-medium, trace_change: malicious automation activates from ordinary user file mail identity or storage events under a service identity, defender_effect: trigger and sensitive action appear as separate legitimate SaaS records unless flow version trigger and outcome are joined}
      - {axis: delegated-execution-role-brokerage, disposition: parent-core-or-adjacent, trace_change: function executes under an assigned role rather than creator identity, defender_effect: creator-to-role-to-invocation is essential but PassRole or actAs primarily changes privilege and applies to both formal children}
      - {axis: package-versus-inline-code, disposition: not-stealth-distinct, trace_change: deployment artifact differs, defender_effect: packaging changes inspection mechanics but not a stable observation variable without ephemerality or event coupling}
      - {axis: provider-or-service-family, disposition: not-stealth-distinct, trace_change: API and log names differ, defender_effect: platform implementation does not create a Niji child}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes_zh: 两个既有子项保留但均按证据维持 medium。Denonia 证明 Lambda 定向恶意代码与短驻取证困难，却未证明部署路径；DART 证明攻击者使用 Microsoft Flow 自动化窃取，但公开材料未给出完整触发配置。执行角色是父级共同因果与潜在提权边界，不单列子项。
    reviewer_notes_en: Both existing children are retained at medium. Denonia proves Lambda-targeted malware and ephemeral forensic difficulty but not its deployment path. DART proves adversary use of Microsoft Flow for automated theft but does not publish the complete trigger configuration. Execution role is common parent causality and a possible privilege boundary rather than a separate child.
  - work_item_ref: WORK-TA0002-T1072
    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [SCCM and Intune, ePO and endpoint security management, PDQ and BigFix, cloud systems management, network-device deployment, SaaS RMM]
    breadth_trigger: ordinary-open-search
    candidate_stealth_axes_examined:
      - {axis: trusted-management-agent-command-brokerage, disposition: formal, trace_change: a central deployment request becomes a local SYSTEM or agent child process without a direct endpoint-local attacker session, defender_effect: endpoint telemetry attributes launch to a signed management agent unless control-plane operator job and package lineage are joined}
      - {axis: fleet-scope-distributed-execution, disposition: formal-medium, trace_change: one control-plane job fans out through many independent agent check-ins and endpoint clocks, defender_effect: per-host alerts look unrelated or normal while enterprise-level scope and common job identity reveal coordinated execution; explicit low-and-slow intent is not established}
      - {axis: approved-deployment-window-camouflage, disposition: evidence-deferred, trace_change: execution coincides with maintenance windows, defender_effect: timing baselines could reduce suspicion but reviewed incidents do not establish attacker selection of an approved window for evasion}
      - {axis: existing-package-or-job-substitution, disposition: collapsed-to-agent-brokerage, trace_change: a trusted deployment object carries changed payload, defender_effect: package digest and version are essential evidence but current cases establish management-agent execution rather than a stable separate reuse axis}
      - {axis: newly-installed-rmm, disposition: adjacent-technique-or-parent-core, trace_change: an attacker installs a remote tool rather than abusing an established enterprise deployment control plane, defender_effect: software installation and remote service coverage applies unless the tool manages fleet execution}
      - {axis: cloud-administration-command, disposition: adjacent-technique, trace_change: cloud API controls resources or guest agents, defender_effect: NJT-0064 owns direct cloud administration and NJT-0066/NJT-0068 own container or hypervisor-specific channels}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes_zh: 现有“批准窗口伪装”缺乏直接意图证据，NJS-0078-001 改为有 APT32/ePO 和 AvosLocker/PDQ 支持的受信 agent 代理；NJS-0078-002 从未证实的“分批低慢”收敛为 fleet scope fan-out，并因匿迹意图主要是分析推断保持 medium。
    reviewer_notes_en: Existing approved-window camouflage lacks direct intent evidence so NJS-0078-001 is rewritten as trusted-agent brokerage supported by APT32 ePO and AvosLocker PDQ. NJS-0078-002 drops unproven low-and-slow staging and converges on fleet-scope fan-out at medium because stealth intent remains primarily analytic inference.
