decision: retain
rationale_zh: 固定基线覆盖 at、cron、Windows Task Scheduler、systemd timer 与 Kubernetes CronJob 的未来或事件驱动执行。Tarrask、Nitrokod、Serpent 和 Guloader 调查进一步证明，攻击者能够分别控制任务枚举状态、延期、一次性生命周期和本机合形元数据，使调度行为不仅提供执行能力，还改变进程来源、时间关联和对象可见性。因此保留父行为，并以四个跨产品稳定匿迹变量重建 Niji taxonomy。
rationale_en: The fixed baseline covers future or event-driven execution through at cron Windows Task Scheduler systemd timers and Kubernetes CronJobs. Tarrask Nitrokod Serpent and Guloader investigations further demonstrate adversary control over enumeration state delay one-shot lifecycle and asset-conforming metadata so scheduling not only provides execution but changes process provenance temporal correlation and object visibility. The parent behavior is retained and its Niji taxonomy is rebuilt around four stable cross-product stealth variables.
scope_notes_zh: 正式范围要求调度器保存一个时间、事件、启动或控制面条件，并在条件满足时启动攻击者命令、脚本、程序或工作负载。单纯应用内部 sleep/timer、没有持久或事务调度对象的循环、只创建但从未执行的任务，以及只讨论 Persistence 或 Privilege Escalation 结果的记录均不进入 Execution 结论。五个 ATT&CK 子项只作为宽度先验，Niji 子项按特征、时间、枚举状态和生命周期划分。
scope_notes_en: Formal scope requires a scheduler to store a time event startup or control-plane condition and start an adversary command script program or workload when it is met. Application-internal sleep or timers loops without a durable or transactional scheduler object tasks never executed and records addressing only Persistence or Privilege Escalation outcomes do not establish the Execution conclusion. Five ATT&CK children are breadth context only and Niji children partition features time enumeration state and lifecycle.
