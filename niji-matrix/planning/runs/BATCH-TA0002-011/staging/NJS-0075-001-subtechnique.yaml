schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0075-001
parent_ref: NJT-0075
name: {zh: 基线合形计划激活, en: Baseline-Conforming Scheduled Activation}
summary: {zh: 攻击者让任务名称、动作、账户与节奏贴合目标资产的更新或维护对象，使清单与单点规则难以区分, en: Adversaries align task names actions accounts and cadence with update or maintenance objects on the target asset so inventory and point rules struggle to distinguish them}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
    - zh: 基线合形计划激活是攻击者有意选择与目标资产真实更新、备份、健康检查或业务批处理相近的任务名称、目录、作者、执行账户、动作程序、触发时段和频率，再由调度器运行恶意载荷。其直接目的不是让任务消失，而是使可枚举对象在本地清单中看似合理。稳定变量是相对于该资产和角色基线的语义贴合，不是使用某个常见字符串或系统账户本身。
      en: Baseline-Conforming Scheduled Activation deliberately selects task names folders authors execution principals action programs trigger windows and cadence close to genuine update backup health-check or business batch jobs on the target asset before the scheduler runs malicious payload. Its objective is not disappearance but a plausible enumerable object in local inventory. The stable variable is semantic conformity to the asset and role baseline rather than any common string or system account alone.
stealth_characteristics:
  paragraphs:
    - zh: 基线合形计划激活在标准 API、UI 和生命周期日志中都可见，但可见字段与邻近合法任务高度相似。攻击者可复制浏览器更新命名、在维护时段运行并使用 taskhost、cron 或 controller 的正常父级，使依赖名称信誉、签名父进程或全局稀有度的规则降低敏感度。Guloader 的 Firefox BackgroundUpdate 式任务说明“名称合理”与“资产上真实存在该软件”可以分离。
      en: Baseline-Conforming Scheduled Activation remains visible in standard APIs UI and lifecycle logs but its fields closely resemble legitimate peers. Adversaries may copy browser-update naming run in maintenance windows and use normal taskhost cron or controller parents reducing rules based on name reputation signed parentage or global rarity. Guloader's Firefox BackgroundUpdate-style task shows that a plausible name can diverge from software actually installed on the asset.
    - zh: 动作路径、参数、payload hash、创建者、安装软件、首次出现时间、执行账户和网络结果仍可产生差异；过于频繁的更新任务或合法产品从未使用的 regsvr32 也会暴露伪装。防守方必须按资产软件清单、任务角色和同名对象历史比较完整定义，而不能用全企业统一白名单放行常见名称。
      en: Action path arguments payload hash creator installed software first-seen time execution principal and network outcome still differ and an update task running too frequently or using regsvr32 when the product never does can expose the disguise. Defenders must compare complete definitions against asset software inventory task role and same-name history rather than allow common names globally.
scope_boundary_definition:
  paragraphs:
    - zh: 本轴只纳入攻击者有意使可枚举任务贴合本机或同角色节点基线并由此降低区分能力的行为。正常软件安装产生的新任务、统一运维批处理和标准 CronJob 不因外观常见而属于本轴。对象若从标准枚举消失归 NJS-0075-003，主要效果来自长延期归 NJS-0075-002，在短事务中删除归 NJS-0075-004；这些变量可以共同出现，但映射必须分别有证据。
      en: This axis includes only intentional adversary conformity of an enumerable task to local or peer-role baselines that reduces differentiation. New tasks from legitimate software installation centralized operations and standard CronJobs do not belong merely because they look common. Disappearance from standard enumeration belongs to NJS-0075-003 primary long delay to NJS-0075-002 and deletion in a short transaction to NJS-0075-004. Variables may co-occur but each mapping requires evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
      - zh: 攻击者在掌握目标软件清单、维护时段或现有任务模式后，用本轴维持 C2、启动 loader、执行矿工或周期收集。企业桌面上的浏览器/驱动更新、服务器上的备份/监控和集群中的常规 CronJob 都提供可模仿外观；攻击者倾向复用现有 task folder、service account 或相邻执行时间。
        en: Adversaries use the axis after learning software inventory maintenance windows or existing task patterns to sustain C2 start loaders run miners or collect periodically. Browser or driver updates on desktops backup or monitoring on servers and routine CronJobs in clusters offer appearances to imitate and attackers tend to reuse task folders service accounts or neighboring execution times.
  threat_model:
    attacker_model:
      paragraphs:
        - zh: 攻击者需要创建或改写任务的权限以及足够的本地知识来选择可信元数据。只复制知名名称而不了解软件是否安装、真实动作路径或正常节奏容易形成反而更强的异常；集中 task template、签名定义和变更审批会限制其选择空间。
          en: The adversary needs task create or modify authority and enough local knowledge to select credible metadata. Copying a famous name without knowing whether software is installed its real action path or normal cadence can create a stronger anomaly while centralized task templates signed definitions and change approval constrain choices.
    defender_model:
      paragraphs:
        - zh: 防守方假定持有当前与历史任务定义、软件/包清单、任务创建者和审批、执行进程与网络结果，并能按设备角色比较同名任务。只使用 IOC 名称列表或把 SYSTEM/taskhost 视为可信的环境无法可靠识别；基线需要保留合法版本迁移和紧急维护的有效期。
          en: Defenders are assumed to have current and historical task definitions software or package inventory creator and approval execution process and network outcome and compare same-name tasks by device role. Environments using only IOC name lists or trusting SYSTEM and taskhost cannot reliably detect the axis and baselines need validity periods for legitimate version migration and emergency maintenance.
stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 恶意任务复制资产上合法维护对象的可见特征, en: Malicious tasks copy visible features of legitimate maintenance objects on the asset}
    analysis:
      paragraphs:
        - zh: 攻击者保持任务可见，却让名称、作者、账户、时间和动作类别与合法对象相似，使清单浏览和简单稀有度规则难以区分，形成特征伪装。Guloader 使用 Firefox BackgroundUpdate 式名称但主机没有 Firefox，说明资产软件与动作语义能够恢复差异；因此全局白名单会放大匿迹，而局部完整定义基线会削弱它。
          en: The adversary keeps the task visible but aligns name author account time and action class with legitimate objects so inventory review and simple rarity rules cannot distinguish it creating Feature Disguise. Guloader used Firefox BackgroundUpdate-style naming where Firefox was absent showing that asset software and action semantics recover the difference. Global allowlists amplify stealth while local full-definition baselines weaken it.
    evidence_refs: [REF-000262, REF-000266]
    confidence: high
defense:
  detections: {coverage: available, strategy_refs: [DET-000087]}
  mitigations: {coverage: available, mitigation_refs: [MIT-000088]}
evidence:
  claim_refs: [CLM-000285, CLM-000459, CLM-000465, CLM-000469, CLM-000470]
  case_refs: [CASE-000090]
  reference_refs: [REF-000127, REF-000262, REF-000263, REF-000266]
research:
  limitations:
    paragraphs:
      - zh: Guloader 案例直接证明命名合形，但来源来自单起 DFIR 调查且置信度为 medium；不同产品可以合法采用相似更新名称，任务频率也会随策略变化。该子项的 high 机制置信来自案例与 Red Canary 大规模检测经验的组合，实际告警仍必须使用资产局部软件、动作和创建谱系，不能仅按名称定性。
        en: The Guloader case directly demonstrates naming conformity but comes from one DFIR investigation at medium source confidence and different products may legitimately use similar update names while cadence changes with policy. High mechanism confidence comes from the case combined with Red Canary operational detection experience but alerts still require asset-local software action and creation lineage and cannot classify by name alone.
