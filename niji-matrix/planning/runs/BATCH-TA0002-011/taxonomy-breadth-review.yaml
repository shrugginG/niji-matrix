    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 5
    attack_subtechnique_ids: [T1053.002, T1053.003, T1053.005, T1053.006, T1053.007]
    represented_dimensions: [at one-time jobs, cron tables, Windows Task Scheduler objects, systemd timer and service pairs, Kubernetes CronJob and Job resources]
    breadth_trigger: multi-axis-review-with-voluntary-second-pass
    coverage_resolutions:
      - {attack_ids: [T1053.002, T1053.003, T1053.006, T1053.007], resolution: parent-core because scheduler product platform and resource kind do not independently change defender observation; their names calendars principals and execution histories contribute contrast for cross-platform Niji axes}
      - {attack_ids: [T1053.005], resolution: niji-variable-candidate because direct field evidence supports baseline-conforming names delayed activation enumeration suppression and one-shot task brokerage; the variables remain Niji-native rather than Windows child imports}
      - {attack_ids: [T1053.002, T1053.003, T1053.005, T1053.006, T1053.007], resolution: niji-variable-candidate for baseline-conforming and observation-window-deferred scheduling when attacker-selected task metadata or trigger time changes differentiation or correlation regardless of scheduler}
    candidate_stealth_axes_examined:
      - {axis: baseline-conforming-scheduled-activation, disposition: formal, trace_change: task name path author principal command family and cadence imitate peer maintenance or update jobs, defender_effect: point-in-time inventory and simple novelty rules cannot distinguish the task without asset-local semantic baselines}
      - {axis: observation-window-deferred-activation, disposition: formal, trace_change: registration and payload execution are separated beyond sandbox SIEM or triage windows, defender_effect: the triggering process and eventual scheduler child no longer co-occur in short correlation or detonation time}
      - {axis: state-enumeration-suppressed-registration, disposition: formal, trace_change: attacker removes or corrupts metadata used by supported scheduler enumeration while retaining sufficient backing state for execution, defender_effect: management API and UI return no task although raw registry file or runtime traces remain}
      - {axis: ephemeral-one-shot-scheduled-brokerage, disposition: formal, trace_change: a task is created triggered and deleted within a short interval so the payload inherits a trusted scheduler parent without durable inventory state, defender_effect: state scans miss the object and process-only logic attributes execution to the signed scheduler unless audit history is correlated}
      - {axis: calendar-versus-event-trigger, disposition: not-stealth-distinct, trace_change: trigger representation differs, defender_effect: it contributes to delay or one-shot brokerage only when an attacker-controlled observation effect is present}
      - {axis: remote-scheduling, disposition: parent-core-or-adjacent, trace_change: registration originates from another host or control plane, defender_effect: remote provenance is useful correlation but the direct stealth variable remains identity cadence state suppression or ephemerality; lateral movement is adjacent}
      - {axis: scheduler-granted-privilege, disposition: adjacent-technique, trace_change: execution principal differs from creator, defender_effect: privilege escalation is a separate tactic consequence unless combined with one of the formal stealth variables}
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 4
    breadth_gap_explained: true
    reviewer_notes_zh: 五个 ATT&CK 子项按平台和调度器实现聚类，不作为 Niji 输出。第二轮用 Tarrask 的 SD 删除、Nitrokod 的 15 天延期、Serpent 的 one-event create/run/delete 和伪装更新任务案例将四个轴分别固定到特征、时间、枚举状态和生命周期；触发器类型、远程创建和提权结果未形成独立匿迹子项。
    reviewer_notes_en: Five ATT&CK children cluster by platform and scheduler implementation and are not Niji output. A second pass uses Tarrask SD deletion Nitrokod's fifteen-day delay Serpent's one-event create-run-delete chain and masqueraded update-task cases to fix four axes around features time enumeration state and lifecycle. Trigger type remote creation and privilege outcome do not form independent stealth children.
