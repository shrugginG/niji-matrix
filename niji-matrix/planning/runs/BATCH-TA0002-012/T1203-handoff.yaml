      - {zh: 开放检索将匿迹因果收敛为两个互斥变量：按真实设备与易受攻击版本选择性激活，以及把利用触发耦合到用户预期查看动作。两者分别改变投放可见性和触发语义，且均有直接现场案例与不同检测关联键。, en: Open research converged the stealth causality into two mutually exclusive variables: selective activation for real compatible devices and exploit triggering coupled to an expected user viewing action. They change delivery visibility and trigger semantics respectively and each has a direct field case and distinct detection join keys.}
