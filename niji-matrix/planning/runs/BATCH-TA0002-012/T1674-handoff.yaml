candidate: {source_type: attack, source_attack_id: T1674, name: {zh: 输入注入, en: Input Injection}}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
      - {zh: 开放检索保留三条可被独立观测和治理的输入匿迹变量：模仿人的节奏、只在目标会话上下文中激活，以及伪装为外设来源。后两项有直接现场案例；人类节奏模仿只有检测研究支撑，因此显式降为 medium。, en: Open research retained three independently observable and governable input-stealth variables: human-cadence mimicry activation only in the target session context and impersonation of peripheral-origin input. The latter two have direct field cases while human-cadence mimicry is supported only by detection research and is explicitly calibrated to medium.}
proposed_subtechniques:
  - {canonical_ref: NJS-0071-001, name: {zh: 人类节奏输入模仿, en: Human-Cadence Input Mimicry}, evidence_refs: [REF-000247, REF-000248, REF-000249, REF-000251], confidence: medium}
  - {canonical_ref: NJS-0071-002, name: {zh: 活跃会话上下文门控输入, en: Active-Session Context-Gated Input}, evidence_refs: [REF-000245, REF-000249, REF-000251], confidence: high}
  - {canonical_ref: NJS-0071-003, name: {zh: 外设来源用户输入冒充, en: Peripheral-Origin User-Input Impersonation}, evidence_refs: [REF-000246, REF-000247, REF-000250, REF-000251], confidence: high}
defense_candidates: {detection_strategies: [DET-000086], detection_analytics: [NJA-000036], mitigations: [MIT-000087]}
research:
  limitations:
    paragraphs:
      - {zh: 人类节奏轴尚无能证明攻击者以节奏模仿规避检测的现场案例，故不得提升为 high。操作系统对合成输入标志和外设身份的可见性并不一致，分析必须保留平台盲点。, en: The human-cadence axis lacks a field case proving adversarial use of timing mimicry to evade detection and therefore must not be raised to high. Operating systems expose synthetic-input flags and peripheral identity inconsistently so analytics must retain platform blind spots.}
  rejected_mechanisms: [mouse versus keyboard product children, automation tool names, generic input injection without a stealth variable]
  open_questions: [Whether a future field report directly attributes human-cadence mimicry to evasion intent]
