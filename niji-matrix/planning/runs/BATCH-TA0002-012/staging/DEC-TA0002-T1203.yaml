decision: adapt
rationale_zh: 固定基线锚定客户端漏洞执行。Google TAG 蒙古水坑直接证明真实设备/版本门控，WinRAR CVE-2023-38831 直接证明普通文件查看工作流触发；两项均有可重放残余和不同防御，支持 high-confidence adapt。
rationale_en: The fixed baseline anchors client-vulnerability execution. Google TAG's Mongolian watering hole directly establishes real-device or version gating and WinRAR CVE-2023-38831 directly establishes ordinary-file-view workflow triggering. Both have replayable residuals and distinct defenses supporting high-confidence adaptation.
scope_notes_zh: 范围要求 client 处理攻击者输入、漏洞成功并产生执行，且存在门控或工作流观察差异。漏洞/产品/文件类型/chain 长度不形成子项；无漏洞用户执行、纯 fingerprint 与 crash-only 排除或邻接。
scope_notes_en: Scope requires a client handling attacker input successful vulnerability exploitation and execution plus a gating or workflow observation difference. Vulnerability product file type and chain length do not form children. Nonvulnerability User Execution pure fingerprinting and crash-only behavior are excluded or adjacent.
