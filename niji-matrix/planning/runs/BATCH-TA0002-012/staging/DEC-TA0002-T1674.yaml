candidate: {source_type: attack, source_attack_id: T1674, source_attack_version: '19.1', name_en: Input Injection, name_zh: 输入注入}
decision: adapt
rationale_zh: 固定基线锚定合成输入执行。BackSwap 直接证明活动 session/window 门控，FBI FIN7 BadUSB 直接证明外设来源冒充；对抗研究证明 cadence 随机/减速可控但无野外意图，形成 high 父级与 high/high/medium 三子项校准。
rationale_en: The fixed baseline anchors synthetic-input execution. BackSwap directly establishes active-session or window gating and the FBI FIN7 BadUSB advisory directly establishes peripheral-origin impersonation. Adversarial research establishes controllable cadence randomization or slowdown without field intent producing a high-confidence parent and high high medium child calibration.
scope_notes_zh: 范围要求攻击者软件/设备生成输入并由目标应用产生命令/代码执行。用户本人输入、无执行 UI 变化和非输入型 USB 攻击排除；键鼠/clipboard、API、设备产品和 payload 不形成子项。
scope_notes_en: Scope requires attacker software or device generated input and command or code execution by the target application. User-authored input nonexecution UI change and noninput USB attacks are excluded. Key mouse or clipboard API device product and payload do not form children.
