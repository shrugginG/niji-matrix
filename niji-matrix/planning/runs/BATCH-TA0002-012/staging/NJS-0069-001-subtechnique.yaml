schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0069-001
parent_ref: NJT-0069
name: {zh: 客户端兼容性门控利用激活, en: Client-Compatibility-Gated Exploit Activation}
summary: {zh: 攻击者在浏览器、OS、版本、设备真实性或缓解指纹匹配后才投放/激活 exploit，使不匹配分析环境只见无害行为。, en: Adversaries deliver or activate an exploit only after browser OS version device-authenticity or mitigation fingerprints match so unmatched analysis environments see benign behavior.}
aliases: [Targeted Exploit Gating]
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 客户端兼容性门控利用激活固定“同一入口是否显露 exploit 由 client 情境决定”变量。攻击者先收集浏览器/OS build、架构、屏幕/CPU/GPU、真实设备/自动化、已安装补丁或缓解等信号，只有满足 exploit 可靠性和目标条件时才返回/运行漏洞链；其他访问获得空白、诱饵、错误或普通内容。
    en: Client-Compatibility-Gated Exploit Activation fixes whether the same entry reveals an exploit based on client context. The adversary first collects browser or OS build architecture screen CPU or GPU real-device or automation patch and mitigation signals and returns or runs the chain only when reliability and targeting conditions match. Other visits receive blank decoy error or ordinary content.
  - zh: 所有 exploit 都需要兼容版本，但本子项还要求攻击者控制门控并造成防守观察差异；硬编码只在目标版本正常运行而对其他版本崩溃不自动成立。一次性 token/目标身份若服务同一选择性，作为实现吸收而不另立子项。
    en: Every exploit needs a compatible version but this child additionally requires adversary-controlled gating that changes defender observation. An exploit merely working on one version and crashing elsewhere does not automatically qualify. One-time tokens or target identity serving the same selectivity are implementations rather than another child.
stealth_characteristics:
  paragraphs:
  - zh: 客户端兼容性门控利用激活让通用爬虫、虚拟沙箱、错误版本和已修补系统不收到 exploit 或不走相同代码路径，恶意行为从这些观察面消失。蒙古水坑确认真实 Chrome 设备并只攻击 121-123，直接证明变量。指纹脚本/请求、不同响应、版本范围、隐藏 iframe 与目标 client exploit 结果仍可关联；真实多版本环境和反自动化模拟会削弱。
    en: Client-Compatibility-Gated Exploit Activation withholds the exploit or code path from generic crawlers virtual sandboxes wrong versions and patched systems, removing malicious behavior from those vantages. The Mongolian watering hole validated real Chrome devices and targeted only 121 through 123, directly establishing the variable. Fingerprint scripts or requests response differences version range hidden iframe and target exploit outcome remain correlatable. Real multiversion environments and anti-automation simulation reduce it.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明攻击者主动收集/使用情境条件、匹配客户端发生 exploit 执行且不匹配客户端获得不同响应/行为。普通网站兼容性检测、广告 personalization、A/B test 或 exploit 自然兼容失败不足；需有门控到恶意结果。触发是否需要用户动作不影响本项，正常工作流外观由 NJS-0069-002 描述。
    en: Evidence must show adversary collection or use of context conditions exploit execution on matching clients and different response or behavior on mismatches. Ordinary site compatibility checks advertising personalization A or B tests and natural exploit incompatibility are insufficient and need a gate-to-malicious-outcome link. User action does not determine this child; normal-workflow appearance belongs to NJS-0069-002.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 定向水坑、一次性链接或 exploit server 面对未知访客时，攻击者先确认目标身份与易受攻击 build/真实设备，避免向研究员、扫描器和无效平台泄露昂贵 exploit，再向匹配 client 交付 renderer/沙箱链。, en: In targeted watering holes one-time links or exploit servers facing unknown visitors the adversary first validates target identity vulnerable build and real device to avoid exposing expensive exploits to researchers scanners and invalid platforms then delivers the renderer or sandbox chain to matching clients.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要可靠 fingerprint、目标条件、版本化 exploit 和反馈，能处理 UA 欺骗、client hints、虚拟化与补丁差异。指纹不足会漏投，误判沙箱会泄露；脚本阻断、隐私限制、快速补丁和多环境扫描限制。, en: Requires reliable fingerprints targeting conditions versioned exploits and feedback and handling of spoofed user agents client hints virtualization and patches. Weak fingerprints miss targets and sandbox misclassification exposes the chain. Script blocking privacy controls rapid patching and multienvironment scanning constrain it.}]}
    defender_model: {paragraphs: [{zh: 需在不同版本、补丁、硬件画像和自动化/真实环境重放相同输入，保留服务端响应、fingerprint 字段和 client 结果；单一 sandbox 只能证明一次未激活。实际用户 telemetry 可把门控请求和 exploit 结果配对。, en: Defenders replay the same input across versions patches hardware profiles and automated or real environments and retain server responses fingerprint fields and client outcomes. One sandbox proves only one nonactivation. Real-user telemetry can pair gating requests to exploit outcomes.}]}
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: 非目标与分析环境看不到只向匹配客户端激活的 exploit, en: Nontarget and analysis environments do not see the exploit activated only for matching clients}
  analysis: {paragraphs: [{zh: 门控把关键 exploit 行为保留在不匹配观察面之外，目标端执行而沙箱端无害，形成行为透明。蒙古水坑的真实设备与 Chrome 版本选择直接支持 high；多环境差分响应和目标结果可反证。, en: Gating keeps critical exploit behavior outside unmatched observation while target clients execute and sandboxes remain benign producing Behavioral Transparency. Real-device and Chrome-version selection in the Mongolian watering hole directly supports high confidence; multienvironment response differences and target outcomes disconfirm it.}]}
  evidence_refs: [REF-000100]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000085]}, mitigations: {coverage: available, mitigation_refs: [MIT-000086]}}
evidence: {claim_refs: [CLM-000265, CLM-000438, CLM-000442], case_refs: [CASE-000083], reference_refs: [REF-000100]}
research:
  limitations: {paragraphs: [{zh: 直接案例是一组浏览器水坑；向其他 client 推广只限于相同选择性输入—响应—执行结构。环境差异可能由 exploit 兼容性而非有意匿迹造成，必须有前置 fingerprint/条件逻辑和差分响应证据。, en: The direct case is one browser watering-hole family. Other clients generalize only through the same selective input-response-execution structure. Environment differences can arise from exploit compatibility rather than deliberate stealth and require prior fingerprint or conditional logic plus differential responses.}]}
