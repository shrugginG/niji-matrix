schema_version: "2.0.0"
type: evasion-subtechnique
id: NJS-0069-002
parent_ref: NJT-0069
name: {zh: 良性客户端工作流耦合触发, en: Benign-Client-Workflow-Coupled Trigger}
summary: {zh: 攻击者把漏洞激活嵌入正常 navigation、document open、file view、preview 或 parse，使触发动作与日常客户端使用共享外观。, en: Adversaries embed exploit activation in ordinary navigation document open file view preview or parse so the trigger shares the appearance of daily client use.}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept:
  paragraphs:
  - zh: 良性客户端工作流耦合触发固定“漏洞由正常使用动作消费恶意输入”变量。攻击者构造页面、文档、archive、图片/对象或其他内容，让 client 在用户导航、打开、查看、预览或自动解析时进入漏洞路径并执行代码；触发前没有独立脚本/可执行启动，行为看似用户在完成普通工作。
    en: Benign-Client-Workflow-Coupled Trigger fixes malicious input being consumed by an ordinary-use action. The adversary crafts a page document archive image or object or other content so client navigation open view preview or automatic parsing enters the vulnerable path and executes code. Before the trigger there is no independent script or executable start and activity resembles ordinary user work.
  - zh: “工作流耦合”不要求一定有用户点击，后台 preview/renderer parse 也可属于正常 client 工作流；关键是触发与合法功能不可从单点区分。若仅通过 social engineering 让用户运行正常命令且无漏洞，归 NJT-0081。客户端是否经过 fingerprint 门控与本项独立。
    en: Workflow coupling does not require a click and background preview or renderer parsing can be an ordinary client workflow. The key is a trigger indistinguishable from legitimate functionality at a point. Social engineering that causes a user to run a normal command without a vulnerability belongs to NJT-0081. Client fingerprint gating is independent.
stealth_characteristics:
  paragraphs:
  - zh: 良性客户端工作流耦合触发使 navigation/open/view/parse 与合法文档、图片或网页行为共享 process、UI、时间和文件类型特征，只有随后控制流异常、crash/sandbox、child/module、临时文件和网络结果暴露。WinRAR CVE-2023-38831 在用户查看普通 PNG 时执行 `.cmd`，直接证明触发外观。内容净化、Protected View、sandbox、及时补丁和 client child 限制会削弱。
    en: Benign-Client-Workflow-Coupled Trigger makes navigation open view or parse share process UI timing and file-type features with legitimate documents images or pages, leaving later control-flow anomaly crash or sandbox child or module temporary files and network outcomes to expose it. WinRAR CVE-2023-38831 executed a `.cmd` when the user viewed an ordinary PNG, directly establishing trigger appearance. Content sanitization Protected View sandboxing timely patching and client-child restrictions reduce it.
scope_boundary_definition:
  paragraphs:
  - zh: 必须证明正常 client 动作消费特制输入、触发漏洞并产生代码执行；文件打开本身、普通 crash 或用户点击链接不足。合法 parser bug/崩溃需排除，事件链应包含异常 control flow 或可靠后继结果。按浏览器/Office/reader、自动/手动触发或文件类型不拆分。
    en: Evidence must show an ordinary client action consuming crafted input triggering a vulnerability and producing code execution. File open alone a normal crash or link click is insufficient. Benign parser bugs or crashes must be excluded and the chain should include abnormal control flow or reliable successor outcomes. Browser Office or reader automatic versus manual trigger and file type do not partition the child.
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者通过水坑、附件、共享链接或 archive 提供与目标工作相符的网页/文档/图片，让 victim client 在查看或 preview 时自动进入 exploit，随后投放 loader、后门或 sandbox escape，而用户只感知普通打开/短暂卡顿。, en: The adversary supplies work-relevant pages documents images or archives through watering holes attachments or shared links so a victim client enters the exploit during view or preview and then delivers a loader backdoor or sandbox escape while the user perceives an ordinary open or brief pause.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要构造既能维持诱饵/文件外观又触发目标 parser 的输入，并控制用户/应用会消费的路径。格式净化、预览隔离、内存缓解和补丁限制；错误输入可能无法打开或 crash 而暴露。, en: Requires input preserving lure or file appearance while triggering the target parser and a path the user or application consumes. Format sanitization preview isolation memory mitigations and patches constrain it. Bad input may fail to open or crash and expose the attack.}]}
    defender_model: {paragraphs: [{zh: 需连接内容 hash/来源、client action/parse、crash/sandbox/control-flow、child/module、临时文件和网络，并与同版本良性文件比较。只看用户打开事件会高误报，只有后继结果会丢失原输入。, en: Defenders join content hash or origin client action or parse crash sandbox or control flow child or module temporary files and network and compare with benign files on the same version. Open events alone create false positives and outcome-only data loses the originating input.}]}
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  summary: {zh: exploit 触发共享正常 client 使用动作的可见特征, en: The exploit trigger shares visible features of ordinary client use}
  analysis: {paragraphs: [{zh: 恶意输入由正常功能处理，前置事件与良性查看/解析同形，使单点分类困难并形成特征伪装。WinRAR 真实利用直接支持 high；input—parse—control-flow—outcome 链可反证。, en: Malicious input is processed by ordinary functionality and preceding events match benign view or parse making point classification difficult and producing Feature Disguise. Real WinRAR exploitation directly supports high confidence; input-parse-control-flow-outcome lineage disconfirms it.}]}
  evidence_refs: [REF-000242]
  confidence: high
defense: {detections: {coverage: available, strategy_refs: [DET-000085]}, mitigations: {coverage: available, mitigation_refs: [MIT-000086]}}
evidence: {claim_refs: [CLM-000266, CLM-000439, CLM-000443], case_refs: [CASE-000084], reference_refs: [REF-000242, REF-000243, REF-000244]}
research:
  limitations: {paragraphs: [{zh: 直接案例为 WinRAR；浏览器/Office/其他 reader 只按等价正常 client action—vulnerability—execution 结构推广。合法文件查看极高频，必须保留内容与控制流/结果；没有漏洞成功证据时只能报告可疑输入或 crash。, en: The direct case is WinRAR while browsers Office and other readers generalize only through equivalent normal-client-action-vulnerability-execution structure. Legitimate file viewing is extremely frequent and needs content plus control-flow or outcome evidence. Without successful exploitation report only suspicious input or crash.}]}
