schema_version: "2.0.0"
type: technique
id: NJT-0069
name: {zh: 情境门控客户端利用执行, en: Context-Gated Client Exploit Execution}
summary: {zh: 攻击者通过浏览器、Office、reader 或其他客户端漏洞执行代码，并以版本/真实设备选择性激活或正常导航/文件查看工作流触发减少沙箱暴露和触发可疑度。, en: Adversaries execute code through browser Office reader or other client vulnerabilities and reduce sandbox exposure or trigger suspicion through selective version or real-device activation and ordinary navigation or file-view workflow triggers.}
aliases: [Exploitation for Client Execution]
classification:
  tactic_refs: [TA0002]
  origin: {kind: attack-adapted, source_attack_id: T1203, source_attack_version: '19.1'}
  decision_ref: DEC-TA0002-T1203
definition_and_concept:
  paragraphs:
  - zh: 情境门控客户端利用执行是攻击者向浏览器、Office、PDF/archive reader、媒体或其他终端客户端提供特制页面、文档、压缩包、对象或数据，触发内存安全、解析或逻辑漏洞并使攻击者代码在 client/renderer 或后继进程开始运行，同时有意控制何时、向谁及在何种正常使用动作下激活。直接目标是利用用户日常客户端入口获得 Execution，而非要求用户主动运行一个显式可执行载荷。
    en: Context-Gated Client Exploit Execution supplies a crafted page document archive object or data to a browser Office PDF or archive reader media client or other endpoint application, triggers a memory-safety parsing or logic vulnerability, and begins attacker code in the client renderer or successor process while deliberately controlling when for whom and under which ordinary-use action activation occurs. Its direct objective is Execution through a daily client entry rather than requiring the user to explicitly run an executable payload.
  - zh: 概念锚是“输入/导航—client parse/interaction—漏洞条件—控制流/逻辑偏转—代码执行结果”。漏洞编号、产品、文件类型和投递媒介不定义本技术；没有成功代码执行的 crash/解析异常只是线索。若用户只是被诱导执行正常功能而无漏洞归 NJT-0081 用户执行；投递链接/附件可同时属于钓鱼或 drive-by，但本对象从 client 处理恶意输入到 exploit 结果为止。
    en: The conceptual anchor is input or navigation, client parsing or interaction, vulnerability condition, control-flow or logic deviation, and code-execution outcome. Vulnerability ID product file type and delivery medium do not define the technique; a crash or parse anomaly without successful execution is only a lead. User persuasion to invoke normal functionality without a vulnerability belongs to NJT-0081 User Execution. Links or attachments can also be phishing or drive-by behavior, while this object runs from client handling of malicious input through exploit outcome.
stealth_characteristics:
  paragraphs:
  - zh: 核心匿迹矛盾是 exploit 必须满足严格版本、布局和缓解条件并引发异常执行，却希望扫描器、爬虫、沙箱和非目标用户只看到无害内容。蒙古水坑先验证屏幕、CPU、GPU、浏览器和真实设备，再只对 Chrome 121-123 激活 exploit chain，直接改变谁能观察恶意行为；选择性失败/无响应、版本差分、指纹请求和目标 payload 仍可通过多环境重放恢复。
    en: The central stealth tension is that an exploit must satisfy strict version layout and mitigation conditions and cause abnormal execution while scanners crawlers sandboxes and nontarget users see benign content. Mongolian watering holes validated screen CPU GPU browser and real-device properties and activated a chain only for Chrome 121 through 123, directly changing who could observe malicious behavior. Selective failure or no response version differentials fingerprint requests and target payload remain recoverable through multienvironment replay.
  - zh: 攻击者还可把触发嵌入正常 navigation、document open、image view、preview 或 client parse，使前置事件与用户日常活动相同。CVE-2023-38831 在用户查看压缩包内普通 PNG 时让 WinRAR/ShellExecute 执行 `.cmd`，只有临时展开、非规范路径、client child、内存/文件/网络结果暴露因果。client crash、sandbox violation、异常 child/module、文件写入和网络连接仍是残余；补丁、DEP/ASLR/CFG/ACG、sandbox 与 Site Isolation 限制成功与影响。
    en: An adversary can also embed triggering in ordinary navigation document open image view preview or client parsing so preceding events match daily activity. CVE-2023-38831 caused WinRAR and ShellExecute to run a `.cmd` when a user viewed an ordinary PNG in an archive, leaving temporary extraction nonnormalized path client child memory or file and network outcomes to expose causality. Client crash sandbox violations unusual children or modules file writes and network connections remain residuals. Patching DEP ASLR CFG ACG sandboxing and Site Isolation constrain success and impact.
scope_boundary_definition:
  paragraphs:
  - zh: 纳入攻击者控制输入被终端 client 处理、实际触发漏洞并产生代码执行，且攻击者通过兼容性/真实性门控或正常工作流耦合改变防守观察的行为。仅针对易受攻击版本但没有选择性观察差异只属于 T1203 父行为；仅 fingerprint 不投放 exploit 属侦察/门控前置；被阻断或只 crash 不确认 Execution。
    en: Scope includes attacker-controlled input handled by an endpoint client actually triggering a vulnerability and producing code execution while compatibility or authenticity gating or normal-workflow coupling changes defender observation. Targeting a vulnerable version without a selective observation difference is only T1203 parent behavior. Fingerprinting without exploit delivery is reconnaissance or gating preparation. A blocked input or crash alone does not confirm Execution.
  - zh: 正常软件崩溃、兼容性故障、文件预览和更新页面会产生相似事件，必须关联输入身份、版本、parse/crash、控制流、child/file/network。一次性链接/目标 token 若仅限制重放，吸收到兼容性门控而不另立子项；exploit chain 长度与 sandbox escape 是能力/结果，不定义匿迹分类。工作流触发不能用“用户打开文件”替代漏洞结果证据。
    en: Normal software crashes compatibility failures file previews and update pages create similar events and require input identity version parse or crash control flow child file and network joins. One-time links or target tokens that only constrain replay collapse into compatibility gating rather than another child. Exploit-chain length and sandbox escape describe capability or outcome and do not define stealth taxonomy. Workflow triggering cannot use user file-open as a substitute for vulnerability outcome evidence.
application_scenarios_and_threat_model:
  application_scenarios:
    paragraphs:
    - zh: 攻击者在水坑、定向链接、恶意附件或特制 archive 中部署 client exploit，先依据浏览器/OS/device 指纹选择可利用目标，或等待用户正常浏览、打开/查看工作文件时触发。后续代码可投放后门、窃取浏览器数据、逃逸 sandbox 或启动解释器；这些结果不改变以 client exploit 为直接对象。
      en: An adversary deploys a client exploit in watering holes targeted links malicious attachments or crafted archives, first selecting exploitable targets through browser OS or device fingerprints or waiting for ordinary browsing document open or file view. Later code can deliver a backdoor steal browser data escape a sandbox or launch an interpreter, but those outcomes do not change the client exploit as direct object.
  threat_model:
    attacker_model:
      paragraphs:
      - zh: 需要可利用漏洞、与 client build/架构/缓解兼容的 exploit、投递/触发输入和成功反馈。门控还需收集可靠 fingerprint 并处理版本谎报、沙箱和真实设备差异；工作流耦合需构造用户会自然执行且 client 按预期解析的内容。补丁、内存缓解、sandbox/site isolation、内容净化和无网络隔离会限制，失败可能 crash 并报警。
        en: The adversary needs an exploitable vulnerability an exploit compatible with client build architecture and mitigations a delivered trigger input and success feedback. Gating additionally needs reliable fingerprints and handling of spoofed versions sandboxes and real-device differences. Workflow coupling needs content the user naturally invokes and the client parses predictably. Patching memory mitigations sandbox or site isolation content sanitization and network isolation constrain it, while failure can crash and alert.
    defender_model:
      paragraphs:
      - zh: 防守方模型假定有 URL/document/archive hash 与来源、client/version/mitigation、navigation/open/parse、crash/sandbox、module/memory/child、file/network 和用户会话；并能在补丁/未补丁、真实/自动化、不同版本环境重放同一输入。单一沙箱或只看 client child 会漏掉选择性行为；没有 input-to-process 关联时正常 crash 与 exploit 难分。保留服务端响应差分和 client telemetry 是关键。
        en: The defender model assumes URL document or archive hash and origin client version and mitigation navigation open or parse crash or sandbox module memory or child file or network and user session, plus replay of one input across patched and unpatched real and automated and different-version environments. One sandbox or client-child-only data misses selective behavior, and normal crashes are hard to separate from exploits without input-to-process joins. Server response differentials and client telemetry are critical.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  summary: {zh: exploit 对非目标与分析环境保留而只在匹配客户端显现, en: The exploit is withheld from nontarget and analysis environments and appears only on matching clients}
  analysis:
    paragraphs:
    - zh: 指纹和兼容性验证使关键 exploit 行为不进入不匹配沙箱/爬虫的有效观察，而目标 client 发生执行，形成行为透明。蒙古水坑对真实设备和 Chrome 121-123 的直接门控支持 high；多版本重放、指纹请求和目标响应差分可反证。
      en: Fingerprinting and compatibility validation keep critical exploit behavior outside effective observation of unmatched sandboxes or crawlers while target clients execute, producing Behavioral Transparency. Direct real-device and Chrome 121 through 123 gating in the Mongolian watering hole supports high confidence. Multiversion replay fingerprint requests and target response differences can disconfirm it.
  evidence_refs: [REF-000100]
  confidence: high
- mechanism_ref: NM-FD
  role: secondary
  summary: {zh: 漏洞触发借用正常导航、文件打开或查看事件外观, en: Vulnerability triggering borrows the appearance of ordinary navigation file-open or view events}
  analysis:
    paragraphs:
    - zh: 恶意输入在正常 client 工作流被解析，触发前的用户/应用事件与合法文件查看共享特征，单点规则难以区分并形成特征伪装。WinRAR 普通 PNG 查看触发命令是直接案例，支持 high；临时文件、解析路径、client child 与结果链仍可恢复。
      en: Malicious input is parsed in an ordinary client workflow and preceding user or application events share features with legitimate file viewing, weakening point classification and producing Feature Disguise. The WinRAR ordinary-PNG-view command trigger is a direct case supporting high confidence. Temporary files parse path client child and outcome chain remain recoverable.
  evidence_refs: [REF-000242]
  confidence: high
subtechnique_taxonomy:
  narrative:
    paragraphs:
    - zh: NJS-0069-001 固定“谁能观察 exploit”变量：相同输入在版本/真实设备/指纹不匹配环境不激活，检测核心是差分重放。NJS-0069-002 固定“什么正常动作触发”变量：目标匹配后 exploit 可对所有目标激活，但触发嵌入 navigation/open/view/parse，检测核心是 input—client—outcome 因果。门控页面可无用户动作，工作流 exploit 可无 fingerprint，故互不包含。
      en: "NJS-0069-001 fixes who can observe the exploit: the same input does not activate in version device or fingerprint mismatches and detection centers on differential replay. NJS-0069-002 fixes which ordinary action triggers it: after targeting the exploit can activate broadly but is embedded in navigation open view or parse and detection centers on input-client-outcome causality. A gated page can require no user action and a workflow exploit can use no fingerprint, so neither contains the other."
    - zh: ATT&CK 无子项；开放搜索未按浏览器/Office/reader、漏洞类型、媒介或 chain 长度拆分。一次性/目标绑定投放若只改变选择性吸收到第一轴，sandbox escape/多级 exploit 是后续能力，避免重复分类。
      en: ATT&CK has no children and open search did not partition by browser Office or reader vulnerability type medium or chain length. One-time or target-bound delivery that only changes selectivity collapses into the first axis, while sandbox escape or multistage exploits are later capability and not duplicated.
  coverage: established
  subtechnique_refs: [NJS-0069-001, NJS-0069-002]
defense: {detections: {coverage: available, strategy_refs: [DET-000085]}, mitigations: {coverage: available, mitigation_refs: [MIT-000086]}}
evidence:
  claim_refs: [CLM-000264, CLM-000265, CLM-000266, CLM-000438, CLM-000439, CLM-000440, CLM-000441, CLM-000442, CLM-000443]
  case_refs: [CASE-000083, CASE-000084]
  reference_refs: [REF-000121, REF-000100, REF-000242, REF-000243, REF-000244]
research:
  limitations:
    paragraphs:
    - zh: 两个案例分别覆盖浏览器水坑和 archive reader，跨 Office/PDF/其他 client 只按等价 input—parse—execution 因果推广。蒙古活动的 fingerprint 明确用于真实设备/版本选择，WinRAR 活动明确在普通文件查看触发，支持 high；但正常网站也做兼容性检测、正常 client 也会 crash。没有多环境响应或控制流/结果时，不能仅凭 fingerprint 或 child process 归因。
      en: The cases cover a browser watering hole and an archive reader respectively, while Office PDF and other clients generalize only through equivalent input-parse-execution causality. The Mongolian fingerprint explicitly selected real devices and versions and WinRAR explicitly triggered on ordinary file viewing, supporting high confidence. Normal sites also perform compatibility checks and normal clients crash. Without multienvironment response or control-flow and outcome evidence fingerprinting or a child process alone cannot attribute exploitation.
