- work_item_ref: WORK-TA0002-T1203
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: [browser exploitation, Office documents, PDF and third-party client applications, user-open and zero-click triggers]
  breadth_trigger: ordinary-open-search
  candidate_stealth_axes_examined:
  - {axis: client-compatibility-gated-exploit-activation, disposition: formal, trace_change: exploit is delivered or fired only after browser OS device or mitigation fingerprint matches a vulnerable real target, defender_effect: sandboxes patched clients and broad crawlers receive benign or no behavior while selected clients expose the chain}
  - {axis: benign-client-workflow-coupled-trigger, disposition: formal, trace_change: exploit activation is embedded in an ordinary navigation document open file view preview or application parse event, defender_effect: the causal trigger resembles expected user and client activity until abnormal child memory file or network outcomes appear}
  - {axis: one-time-or-target-bound-delivery, disposition: collapsed-to-compatibility-gating, trace_change: URL token or target validation limits repeat retrieval, defender_effect: the defense difference remains selective activation and differential replay rather than a third independent client-execution variable}
  - {axis: exploit-chain-stage-count, disposition: not-stealth-distinct, trace_change: one or multiple vulnerabilities cross sandbox boundaries, defender_effect: stage count changes capability and telemetry volume but not a stable evasion category}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 2
  breadth_gap_explained: true
  reviewer_notes_zh: 无 ATT&CK 子项仍检查四个轴；Google TAG 版本/真实设备门控和 WinRAR 正常文件查看触发分别支持两个既有子项，一次性链接吸收到选择性激活，漏洞链长度不构成匿迹分类。
  reviewer_notes_en: Four axes were examined despite no ATT&CK children. Google TAG version or real-device gating and WinRAR normal-file-view triggering respectively support the two existing children. One-time links collapse into selective activation and exploit-chain length is not a stealth category.
- work_item_ref: WORK-TA0002-T1674
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  represented_dimensions: [software keyboard and mouse synthesis, Windows message input, active browser context, USB HID emulation]
  breadth_trigger: ordinary-open-search
  candidate_stealth_axes_examined:
  - {axis: human-cadence-input-mimicry, disposition: formal-medium, trace_change: attacker controls inter-event timing and variation to avoid machine-speed or regularity thresholds, defender_effect: timing-only human-versus-machine classification loses discriminating power; no field campaign intent evidence was found}
  - {axis: active-session-context-gated-input, disposition: formal, trace_change: input is withheld until a target window URL transaction or user session is active and then injected into the focused interface, defender_effect: injected actions inherit the user's live session and appear causally adjacent to legitimate interaction}
  - {axis: peripheral-origin-user-input-impersonation, disposition: formal, trace_change: a malicious USB HID enumerates as a standard keyboard and supplies input through the hardware device stack, defender_effect: software injected flags or process attribution may be absent while the OS trusts keyboard-origin events}
  - {axis: key-versus-mouse-versus-clipboard, disposition: not-stealth-distinct, trace_change: event type and fields differ, defender_effect: cadence context and origin variables remain the useful defense partitions}
  second_pass_required: false
  second_pass_completed: false
  proposed_niji_child_count: 3
  breadth_gap_explained: true
  reviewer_notes_zh: 三个轴分别改变时间、会话上下文和来源归因。BackSwap 与 FIN7 BadUSB 直接支持后两项 high；人类节奏仅由对抗检测研究证明可控与可规避，保持 medium 并设置未来合并条件。
  reviewer_notes_en: The three axes change timing session context and provenance. BackSwap and FIN7 BadUSB directly support the latter two at high confidence. Human cadence is supported only by adversarial detection research and remains medium with a future merger condition.
