statement_zh: 用户执行把攻击者内容转化为代码运行所需的最后授权动作交给人类完成，攻击者又可让请求贴合文档、开发、更新或支持工作流，或拆成多个应用间步骤；这些特征和因果分离改变防守观察，支持在 TA0002 下适配为匿迹技术。
statement_en: User Execution delegates the final authorizing action that turns adversary content into running code to a human while adversaries may align requests with document development update or support workflows or split them across applications. These feature and causal-separation effects change defender observation and support adaptation under TA0002.
