candidate: {source_type: attack, source_attack_id: T1204, source_attack_version: '19.1', name_en: User Execution, name_zh: 用户执行}
decision: adapt
rationale_zh: 固定基线五项子技术按 link、file、image、copy/paste 与 library 媒介划分。跨媒介研究显示稳定匿迹变量是让请求贴合用户真实工作流和用多个人工步骤打断自动因果。Contagious Interview/Raspberry Robin 支持前者，ClearFake/TA571 直接支持后者。因此适配为工作流合形用户执行，并保留两个 high Niji 子项，不导入媒介分类。
rationale_en: Five fixed-baseline children partition link file image copy or paste and library carriers. Cross-medium research shows stable stealth variables are aligning requests with genuine user workflows and breaking automatic causality through multiple human steps. Contagious Interview and Raspberry Robin support the former and ClearFake or TA571 directly support the latter. The parent is adapted as Workflow-Conforming User Execution with two high-confidence Niji children without importing carrier categories.
scope_notes_zh: 正式范围要求可归因用户动作实际导致首个恶意代码、脚本、镜像、库或远程工具执行。Phishing 负责投递，T1203 负责 exploit，T1059/容器/库/RMM 负责执行实现；zero-click/autorun 排除。共谋 insider 可记录用户动作但主要权限边界属于 Valid Accounts/Trusted Relationship。
scope_notes_en: Formal scope requires an attributable user action actually causing first malicious code script image library or remote-tool execution. Phishing owns delivery T1203 exploitation and T1059 containers libraries or RMM execution implementation while zero-click or autorun is excluded. Willing insiders may record a user action but primary authority boundaries belong to Valid Accounts or Trusted Relationship.
