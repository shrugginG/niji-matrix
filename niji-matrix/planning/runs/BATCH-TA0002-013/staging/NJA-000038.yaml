schema_version: 2.0.0
type: detection-analytic
id: NJA-000038
strategy_ref: DET-000060
name: {zh: 用户内容、跨应用动作与首个载荷关联分析, en: User Content Cross-Application Action and First-Payload Correlation Analytic}
summary: {zh: 从邮件、网页、USB、Repository 或支持身份追踪用户动作，并连接 Clipboard/Run/Terminal、Handler 和首个异常进程/网络, en: Trace user actions from mail web USB repositories or support identities and join clipboard Run or terminal handlers and first anomalous process or network outcomes}
domains: [enterprise]
platforms: [Windows, Linux, macOS, Containers, IaaS]
logic:
  paragraphs:
    - {zh: 工作流分支先固定 lure/content identity、delivery source、URL/file/LNK/image/library/repository digest、MOTW/quarantine、recruiter/helpdesk/support identity 与 user/asset role，再识别 click/open/install/run/approve、IDE/package manager/Explorer/browser/Office/container/cloud action。比较请求是否来自已验证身份和批准业务流程，并把用户动作连接到 helper、installer、interpreter、runtime、RMM 或 workload 的首个 process/file/API/network 结果。, en: The workflow branch fixes lure or content identity delivery source URL file LNK image library or repository digests MOTW or quarantine recruiter helpdesk or support identity and user or asset role before identifying click open install run or approve and IDE package manager Explorer browser Office container or cloud actions. It compares requests with verified identities and approved business processes and joins user actions to first process file API or network outcomes from helpers installers interpreters runtimes RMM or workloads.}
    - {zh: 多步分支识别页面/邮件给出的指令和 clipboard write，随后在同 user/session/device 的短窗口观察 foreground/focus 切换、Run/PowerShell/Terminal 打开、clipboard read/paste、full command 与 Enter/execute，再连接下载、script/installer、child/network。允许浏览器无 shell child；优先用 normalized command/content hash 匹配，若 clipboard 不可采集则用页面访问、Run/terminal start、命令相似度和 payload 结果标为推断。, en: The multi-step branch identifies page or mail instructions and clipboard writes then observes foreground or focus changes Run PowerShell or Terminal opening clipboard reads or paste full commands and Enter or execute in a short window for one user session and device before joining downloads scripts or installers children and network. Browsers need not be shell parents. Normalized command or content hashes take priority and when clipboard cannot be collected page access Run or terminal start command similarity and payload outcome produce an inferred chain.}
data_requirements:
  - {source_type: content-identity-provenance, name: {zh: 邮件、URL、招聘与支持身份来源, en: Mail URL recruiting and support identity provenance}, channel: null, required_fields: [timestamp, user_id, session_id, sender_or_actor_id, domain_or_tenant, url, content_id, authentication_state, reputation, support_case_id]}
  - {source_type: file-media-repository, name: {zh: 文件、USB、镜像、Library 与 Repository 来源, en: File USB image library and repository provenance}, channel: null, required_fields: [timestamp, device_id, user_id, content_id, path_or_uri, digest, origin, mark_of_the_web, signature, usb_device_id, repository_id, package_or_image_id]}
  - {source_type: user-application-action, name: {zh: 用户与前台应用动作, en: User and foreground-application actions}, channel: null, required_fields: [timestamp, device_id, user_id, session_id, application, window_title, foreground_state, action_type, content_id, target]}
  - {source_type: clipboard-interaction, name: {zh: 剪贴板内容指纹与读写, en: Clipboard content fingerprints and reads or writes}, channel: null, required_fields: [timestamp, device_id, user_id, session_id, writer_process_id, reader_process_id, content_hash, content_type, length]}
  - {source_type: run-terminal-history, name: {zh: Run、Shell 与 Terminal 命令, en: Run shell and terminal commands}, channel: null, required_fields: [timestamp, device_id, user_id, session_id, process_id, parent_process_id, shell_or_dialog, full_command, command_hash, execution_confirmed]}
  - {source_type: process-file-lineage, name: {zh: Handler、Helper、Installer 与载荷谱系, en: Handler helper installer and payload lineage}, channel: null, required_fields: [timestamp, device_id, user_id, process_id, parent_process_id, image, command_line, file_path, file_hash, package_script, container_or_instance_id]}
  - {source_type: network-cloud-outcome, name: {zh: 首个网络、API 与工作负载结果, en: First network API and workload outcomes}, channel: null, required_fields: [timestamp, device_id, user_id, process_or_workload_id, network_destination, download_uri, api_action, target_resource, bytes_out, result]}
observables:
  - {zh: 用户从未验证 recruiter repository 执行 npm install，package script 随即启动未知 Node/Python 和外部连接, en: A user runs npm install from an unverified recruiter repository and package scripts immediately start unknown Node or Python and external network}
  - {zh: USB brand/folder LNK 被 Explorer 点击后 cmd/msiexec 从同介质运行并外连, en: Explorer clicks a USB brand or folder LNK and cmd or msiexec runs from the same media and uses network}
  - {zh: 浏览器错误页写 clipboard 后同 user 打开 Run/PowerShell、粘贴匹配命令并下载执行 payload，浏览器无直接 child, en: A browser error page writes clipboard content before the same user opens Run or PowerShell pastes a matching command and downloads and executes payload without a direct browser child}
  - {zh: Helpdesk/remote-support identity未经验证却诱导安装或运行 RMM，随后外部 session 或 first privileged action 出现, en: An unverified helpdesk or remote-support identity induces RMM installation or execution followed by an external session or first privileged action}
correlation: {window: {zh: 直接 workflow 从内容/身份接触前一小时至首个恶意结果后两小时；clipboard 多步使用十分钟交互窗并保留内容/身份索引九十天。, en: Direct workflows span one hour before content or identity contact through two hours after first malicious outcome while clipboard multi-step uses a ten-minute interaction window and retains content and identity indexes for ninety days.}, dimensions: [user, session, device, sender_or_support_identity, content_digest, url_or_repository, usb, application, clipboard_hash, command_hash, process_or_workload, network_destination, time]}
false_positives: [{zh: 合法技术面试、开源项目 setup、开发 build、USB 内容、软件更新和 helpdesk 会要求相同工具与命令, en: Legitimate technical interviews open-source setup developer builds USB content software updates and helpdesk require the same tools and commands}, {zh: 用户日常复制管理员命令、Run/Terminal 操作与安全培训模拟会形成多步链, en: Routine copied administration commands Run or Terminal activity and security training simulations create multi-step chains}]
blind_spots: [{zh: Clipboard/窗口遥测因隐私禁用、浏览器内容加密、用户手工改命令或跨设备执行时多步关联受限, en: Multi-step correlation is limited when clipboard or window telemetry is disabled for privacy browser content is encrypted users edit commands or execution crosses devices}, {zh: SaaS recruiter/support 身份、Repository provenance、容器/云控制面与 endpoint user ID 无法规范化时因果断裂, en: Causality breaks when SaaS recruiter or support identities repository provenance container or cloud control planes and endpoint user IDs cannot be normalized}]
tuning_guidance:
  paragraphs:
    - {zh: 按 user role、asset type、approved recruiter/helpdesk、repository/package、software inventory 和常见 workflow 建基线。例外绑定 identity+content digest/source+user role+期限，不白名单浏览器、IDE、npm、PowerShell、msiexec 或真实用户。将 provenance、action 和 outcome 独立评分，至少两层相交才告警。, en: Baseline user roles asset types approved recruiters or helpdesks repositories or packages software inventory and common workflows. Bind exceptions to identity content digest or source user role and expiry and never allowlist browsers IDEs npm PowerShell msiexec or real users. Score provenance action and outcome independently and require intersection of at least two layers.}
    - {zh: Clipboard 只保留 hash/type/length 等最小元数据，敏感内容按策略不采集；用页面 command hash 与 shell normalized command 匹配。对 ASR/应用控制阻断保留“用户动作已发生但执行被阻止”状态，不把 blocked 当成功。开发/CI/云环境分别调优 first outcome。, en: Retain minimal clipboard metadata such as hash type and length and avoid sensitive content by policy while matching page command hashes to normalized shell commands. Preserve user-action occurred but execution blocked state for ASR or application-control prevention rather than treating blocked as success and tune first outcomes separately for developer CI and cloud environments.}
evidence_refs: [REF-000105, REF-000297, REF-000298, REF-000031, REF-000301, REF-000302]
