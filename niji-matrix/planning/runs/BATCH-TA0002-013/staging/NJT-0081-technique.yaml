schema_version: 2.0.0
type: technique
id: NJT-0081
name: {zh: 工作流合形用户执行, en: Workflow-Conforming User Execution}
summary: {zh: 攻击者让用户在看似正常的文档、开发、更新或支持工作流中完成执行动作，或将因果拆成跨应用多步交互，降低识别与关联, en: Adversaries have users complete execution within plausible document development update or support workflows or split causality across multi-application interactions to reduce detection and correlation}
aliases: []
classification: {tactic_refs: [TA0002], origin: {kind: attack-adapted, source_attack_id: T1204, source_attack_version: '19.1'}, decision_ref: DEC-TA0002-T1204}
definition_and_concept:
  paragraphs:
    - {zh: 工作流合形用户执行是攻击者诱导、说服、请求或依赖用户完成一个或多个动作，使链接、文件、镜像、库、命令或远程工具从内容状态转为实际代码执行，并有意让该动作贴合用户的文档阅读、USB 浏览、技术面试、软件更新、远程支持或云/容器部署工作流。直接目标是把操作系统和应用通常视为用户授权的执行边界交给受害者跨越。, en: Workflow-Conforming User Execution induces persuades requests or relies on a user to complete one or more actions that turn links files images libraries commands or remote tools from content into actual code execution while deliberately aligning the action with document reading USB browsing technical interviews software updates remote support or cloud and container deployment workflows. Its objective is to have the victim cross an execution boundary that operating systems and applications usually treat as user-authorized.}
    - {zh: “用户执行”要求可归因的人类动作与首个恶意结果之间存在因果，不等同于看到鼠标/键盘事件。T1204 媒介子项只说明载体，Niji 关注用户为什么觉得动作合理以及多个步骤如何切断自动谱系。Phishing 负责诱饵投递，客户端 exploit、解释器、容器、恶意库或 RMM 负责具体执行，zero-click 和 autorun 不属于本对象。, en: User Execution requires a causal relationship between an attributable human action and first malicious outcome rather than mere mouse or keyboard events. T1204 carrier children describe media while Niji focuses on why an action appears reasonable and how multiple steps break automatic lineage. Phishing owns lure delivery and client exploitation interpreters containers malicious libraries or RMM own implementation while zero-click and autorun are outside this object.}
stealth_characteristics:
  paragraphs:
    - {zh: 工作流合形让浏览器、Explorer、IDE/package manager、Office、terminal 或远程支持工具执行用户本来会使用的动作，process lineage 和身份记录都显示真实用户。多步 ClickFix 进一步把恶意链拆成页面提示、clipboard、Run/PowerShell 和 paste/Enter，使浏览器不直接 spawn shell，浏览器侧与端点侧各自只见一个局部正常步骤。结果是“用户做了什么”可见而“为什么做”和最初内容难以关联。, en: Workflow conformity makes browsers Explorer IDE or package managers Office terminals or remote-support tools perform actions users genuinely use and process lineage and identity records show a real user. Multi-step ClickFix further splits the chain across page prompt clipboard Run or PowerShell and paste or Enter so browsers do not directly spawn shells and browser and endpoint views each see one locally plausible step. What the user did is visible while why and which initial content caused it becomes difficult to correlate.}
    - {zh: URL/邮件/USB/repository provenance、MOTW/quarantine、download/file/LNK/package digest、clipboard write/read hash、foreground window/focus、user input、Run/terminal history、full command、helper/interpreter/installer process、first network/file/API 与身份/支持会话仍可形成链。用户可手工改动命令、clipboard 采集受隐私限制、浏览器与 shell 没有共同 ID；因此检测需多源时间/内容指纹而非只看父进程。, en: URL mail USB or repository provenance MOTW or quarantine download file LNK or package digests clipboard write and read hashes foreground window or focus user input Run or terminal history full commands helper interpreter or installer processes first network file or API and identity or support sessions still form lineage. Users may edit commands clipboard collection raises privacy limits and browsers and shells lack common IDs so detection needs multi-source timing and content fingerprints rather than parentage alone.}
scope_boundary_definition:
  paragraphs:
    - {zh: 纳入用户点击、打开、允许宏、运行镜像、安装 library、复制粘贴命令、安装 RMM 或批准其他动作后实际产生恶意执行的情况。正常用户错误、合法 helpdesk、开发 setup 和软件更新只有内容/身份/来源或结果异常时才纳入。用户仅查看诱饵、复制但未执行、审批但没有代码运行不满足 Execution 结果。, en: Include malicious execution actually produced after users click open enable macros run images install libraries copy and paste commands install RMM or approve other actions. Normal user mistakes legitimate helpdesk developer setup and software updates qualify only with anomalous content identity provenance or outcomes. Viewing a lure copying without execution or approving without code running does not establish the Execution outcome.}
    - {zh: T1204.001—.005 的 link/file/image/copy/library 是媒介和动作实现，可共同落入两个 Niji 变量而不导入。愿意收钱提供凭据的 insider 主要归 Valid Accounts/Trusted Relationship，RMM 建立后归 Remote Services，npm/package payload 归恶意库/供应链，exploit 归 T1203；本技术只保存人类授权因果边。, en: T1204.001 through .005 link file image copy or library are carrier and action implementations that may fall under either Niji variable without import. Willing insiders selling credentials primarily map to Valid Accounts or Trusted Relationship RMM after establishment to Remote Services npm or package payloads to malicious library or supply chain and exploits to T1203 while this technique retains the human authorization edge.}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者在钓鱼、被入侵网站、USB、招聘平台、技术支持、软件更新或开发 repository 中构造可信任务。ClearFake 让用户“修复”浏览器问题并自执行 PowerShell，Contagious Interview 让开发者运行 npm install，Raspberry Robin 让品牌化 LNK 看似 USB 内容；目标是执行 loader、stealer、RMM 或后续 payload。, en: Adversaries construct plausible tasks through phishing compromised sites USB recruiting platforms technical support software updates or developer repositories. ClearFake has users fix browser problems and self-execute PowerShell Contagious Interview has developers run npm install and Raspberry Robin makes branded LNKs look like USB content with loaders stealers RMM or later payloads as outcomes.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 攻击者需要可影响用户认知的内容与上下文、对目标角色/语言/工具的知识，并让步骤在权限和平台限制下可靠完成。工作流合形要求高质量身份/任务伪装；多步轴要求用户按顺序切换应用、clipboard 和确认。步骤越多成功率越低但自动因果越弱，培训、MOTW、ASR 和应用控制会阻断。, en: The adversary needs content and context that influence user judgment knowledge of target roles language and tools and reliable completion under permissions and platform controls. Workflow conformity needs credible identity and task disguise while multi-step behavior needs ordered application switching clipboard and confirmation. More steps lower success but weaken automatic causality and training MOTW ASR and application control interrupt the chain.}]}
    defender_model: {paragraphs: [{zh: 防守方需邮件/URL/identity/support、browser/Office/Explorer/IDE、download/USB/repository、clipboard/window、user action、shell/Run/terminal、process/file/network/cloud audit，并以 user/session/device/content hash/time 关联。隐私会限制 clipboard/keystroke，SaaS 与 endpoint 时钟/身份不一致，手工输入没有 parent ID；需分级采集并用强结果补偿。, en: Defenders need mail URL identity or support browser Office Explorer or IDE download USB or repository clipboard or window user action shell Run or terminal process file network and cloud audit correlated by user session device content hash and time. Privacy limits clipboard or keystrokes SaaS and endpoint clocks or identities differ and manual input lacks parent IDs so collection is tiered and strong outcomes compensate.}]}
stealth_mechanisms:
  - {mechanism_ref: NM-FD, role: primary, summary: {zh: 恶意请求贴合用户真实工作与支持流程, en: Malicious requests conform to genuine work and support workflows}, analysis: {paragraphs: [{zh: 攻击者让 repository clone/npm install、USB folder click、update/helpdesk action 等与用户角色一致，真实用户和合法工具共同产生特征伪装。Contagious Interview 与 Raspberry Robin 直接支持；内容/身份 provenance、MOTW 和 first outcome 可揭示。, en: The adversary aligns repository clone or npm install USB folder clicks and update or helpdesk actions with user roles so real users and legitimate tools create Feature Disguise. Contagious Interview and Raspberry Robin directly support it while content or identity provenance MOTW and first outcomes expose it.}]}, evidence_refs: [REF-000105, REF-000298, REF-000103, REF-000031], confidence: high}
  - {mechanism_ref: NM-ST, role: secondary, summary: {zh: 人工跨应用步骤打断自动父子和内容因果, en: Human cross-application steps break automatic parent and content causality}, analysis: {paragraphs: [{zh: ClickFix 把页面、clipboard、Run/PowerShell、paste/Enter 和下载分散到多个时间/应用，浏览器与 shell 无自动父子关系，形成时空释痕。Proofpoint 直接支持；clipboard/content hash、focus 和命令/网络仍能关联。, en: ClickFix disperses page clipboard Run or PowerShell paste or Enter and download across applications and time so browsers and shells lack automatic parentage creating Spatiotemporal Trace Dilution. Proofpoint directly supports it while clipboard or content hashes focus commands and network remain joinable.}]}, evidence_refs: [REF-000297, REF-000302], confidence: high}
subtechnique_taxonomy: {narrative: {paragraphs: [{zh: 子项按人类授权链的观察变量划分。工作流合形固定请求与用户真实任务/工具的特征相似，多步交互因果分离固定一次执行被拆成跨应用手工步骤。link/file/image/library/copy-paste 可实现任一轴；共谋身份、zero-click 和媒介类型不成项。, en: Children partition observation variables in the human authorization chain. Workflow conformity fixes feature similarity between requests and genuine user tasks or tools while multi-step causality fixes one execution split across manual application steps. Links files images libraries and copy or paste may implement either axis while willing identities zero-click behavior and carrier types do not form children.}]}, coverage: established, subtechnique_refs: [NJS-0081-001, NJS-0081-002]}
defense: {detections: {coverage: available, strategy_refs: [DET-000060]}, mitigations: {coverage: available, mitigation_refs: [MIT-000059]}}
evidence: {claim_refs: [CLM-000302, CLM-000303, CLM-000304, CLM-000519, CLM-000520, CLM-000521, CLM-000522, CLM-000523, CLM-000524, CLM-000525, CLM-000526], case_refs: [CASE-000107, CASE-000108, CASE-000109], reference_refs: [REF-000105, REF-000133, REF-000297, REF-000298, REF-000103, REF-000031, REF-000301, REF-000302]}
research: {limitations: {paragraphs: [{zh: ClearFake 多步证据强；Contagious Interview 与 Raspberry Robin 支持合形，但 Microsoft 对品牌 LNK 只称“可能鼓励”点击，不能强化用户心理。LAPSUS$ 中部分用户是共谋而非欺骗，主要用于范围边界。五个 ATT&CK 媒介没有一对一 Niji 子项，合法 workflow 高度多样导致检测必须保留隐私和误报限制。, en: ClearFake multi-step evidence is strong and Contagious Interview and Raspberry Robin support conformity while Microsoft says branded LNKs may encourage clicks and user psychology cannot be strengthened. Some LAPSUS users were willing accomplices rather than deceived and inform scope boundaries. Five ATT&CK carriers do not map one-to-one to Niji children and diverse legitimate workflows require privacy and false-positive limits.}]}}
