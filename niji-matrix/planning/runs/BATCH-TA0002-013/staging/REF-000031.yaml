notes_zh: 联合公告说明 Scattered Spider 使用公开信息、商业情报和泄露材料刻画高价值身份并针对企业 IT helpdesk 开展社会工程，随后借合法 RMM 与 allowlisted applications 活动；它同时支持外部身份富化、远程支持工作流边界以及应用控制、远程工具审计和 phishing-resistant MFA 缓解。
notes_en: The joint advisory describes Scattered Spider using public commercial and leaked information to profile high-value identities and socially engineer enterprise IT helpdesks before using legitimate RMM and allowlisted applications. It supports external identity enrichment remote-support workflow boundaries and mitigations including application control remote-tool auditing and phishing-resistant MFA.
