notes_zh: Microsoft 记录 DEV-0537/LAPSUS$ 选择接近目标地理位置的 VPN 并注册设备满足条件访问，也观察其招募员工或承包商提供凭据、批准 MFA 或在公司工作站安装 AnyDesk 等远程管理软件。来源支持身份/设备情境合形和用户动作边界；共谋身份的主要分类仍属于 Valid Accounts 或 Trusted Relationship。
notes_en: Microsoft documents DEV-0537 or LAPSUS$ choosing VPN egress near victims and registering devices for conditional access and recruiting employees or contractors to provide credentials approve MFA or install AnyDesk and other remote management software. The source supports identity or device context conformity and user-action boundaries while willing participation remains primarily Valid Accounts or Trusted Relationship.
