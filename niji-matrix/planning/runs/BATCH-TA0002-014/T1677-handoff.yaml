candidate: {source_type: attack, source_attack_id: T1677, name: {zh: 投毒流水线执行, en: Poisoned Pipeline Execution}}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - {zh: SUNSPOT、XZ 与 Shai-Hulud 分别证明间接构建源替换、release-only 构建触发和恶意 workflow 在受信构建或自动化身份下执行；GitHub 官方研究补足外部贡献到具权 runner 的数据流边界，因此父级保留并按三个稳定因果入口组织。, en: SUNSPOT XZ and Shai-Hulud respectively demonstrate indirect build-source substitution release-only build triggering and malicious workflows executing under trusted build or automation identities. GitHub research establishes the external-contribution data-flow boundary to privileged runners so the parent is retained and organized around three stable causal entry paths.}
proposed_subtechniques:
  - {canonical_ref: NJS-0074-001, name: {zh: 受信流水线定义注入, en: Trusted Pipeline-Definition Injection}, evidence_refs: [REF-000255], confidence: high}
  - {canonical_ref: NJS-0074-002, name: {zh: 间接构建输入激活, en: Indirect Build-Input Activation}, evidence_refs: [REF-000252, REF-000253], confidence: high}
  - {canonical_ref: NJS-0074-003, name: {zh: 外部贡献情境门控执行, en: External-Contribution Context-Gated Execution}, evidence_refs: [REF-000254, REF-000256, REF-000257], confidence: medium}
defense_candidates: {detection_strategies: [DET-000062], detection_analytics: [NJA-000040], mitigations: [MIT-000061]}
research:
  limitations:
    paragraphs:
      - {zh: 外部贡献轴目前主要由漏洞研究而非攻击者规避意图案例支持，因此保持 medium；平台对解析输入、跨 run 制品与短驻 runner 的可见性不一致。, en: The external-contribution axis is supported mainly by vulnerability research rather than a field case of adversarial evasion intent and remains medium. Platforms expose resolved inputs cross-run artifacts and ephemeral-runner runtime inconsistently.}
  rejected_mechanisms: [mutable tags as a separate child, artifact-only poisoning without runner execution, hosted versus self-hosted runner partition, runner ephemerality as an attacker execution child]
  open_questions: [Whether future field reporting directly establishes external-contribution event separation as an evasion choice]
