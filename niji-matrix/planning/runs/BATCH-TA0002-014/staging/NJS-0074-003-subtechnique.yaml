  claim_refs: [CLM-000283, CLM-000453, CLM-000457, CLM-000458]
  case_refs: []
  reference_refs: [REF-000126, REF-000254, REF-000256, REF-000257, REF-000258]
research:
  limitations:
    paragraphs:
      - zh: GitHub 的官方研究证明危险配置和数据流可造成任意 runner 执行，但公开材料多是漏洞发现、修复建议和实验路径，未充分证明攻击者在现场有意利用跨事件分离来规避检测。因此本子技术不能因技术可行性自动提升为 high；若后续案例只证明外部代码被构建而无权限或观察差异，也应合并回间接输入轴。
        en: GitHub research proves that dangerous configuration and data flow can cause arbitrary runner execution but public material consists largely of vulnerability discoveries remediation guidance and demonstration paths and does not sufficiently establish field adversary intent to use cross-event separation for evasion. Technical feasibility therefore cannot raise the child automatically to high. A future case showing only external code being built without an authority or observation difference should collapse into the indirect-input axis.
