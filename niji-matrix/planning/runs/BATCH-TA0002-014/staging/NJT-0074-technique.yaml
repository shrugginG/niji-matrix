research:
  limitations:
    paragraphs:
      - zh: SUNSPOT 与 XZ 对间接输入提供强直接证据，Shai-Hulud 对恶意 workflow 提供现场证据；外部贡献轴主要由 GitHub 漏洞研究和平台语义证明可行性，尚缺同等强度的攻击者规避意图案例，因此保持 medium。来源对具体 SaaS 的字段可见性不同，Analytic 中的规范字段需要在部署时映射而不能假定所有平台完整提供。
        en: SUNSPOT and XZ provide strong direct evidence for indirect inputs and Shai-Hulud provides a field example of a malicious workflow. The external-contribution axis is supported mainly by GitHub vulnerability research and platform semantics and lacks an equally strong case of adversarial evasion intent so it remains medium. Source visibility differs across SaaS platforms and canonical analytic fields must be mapped at deployment rather than assumed universally available.
      - zh: 成功构建、workflow 变更或新网络目的地本身都不能证明投毒。内部开发者可能合法调整 job，依赖安装可能首次联系新站点，reproducible build 也不能单独排除有意改变的源输入。若未来证据表明外部贡献与间接输入在控制和观察上无法稳定区分，应合并相关子项；若新型 agentic workflow 建立独立的权限与痕迹边界，则需要重新执行开放 taxonomy 审查。
        en: A successful build workflow change or new destination alone does not prove poisoning. Developers may legitimately revise jobs dependency installation may contact a new site and reproducible builds alone cannot exclude intentionally changed source inputs. If future evidence shows external contribution and indirect input cannot be stably distinguished in control or observation the children should merge. If agentic workflows establish a distinct authority and trace boundary open taxonomy review should be repeated.
