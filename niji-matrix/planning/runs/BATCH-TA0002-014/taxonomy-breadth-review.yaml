schema_version: 1.0.0
type: taxonomy-breadth-review
batch_ref: BATCH-TA0002-014
work_items:
  - work_item_ref: WORK-TA0002-T1677
    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [versioned workflow definitions, referenced build scripts and source inputs, external pull-request content and metadata, hosted and self-hosted runners]
    breadth_trigger: ordinary-open-search
    candidate_stealth_axes_examined:
      - {axis: trusted-pipeline-definition-injection, disposition: formal, trace_change: adversary commands become declared jobs or steps inside a versioned workflow and execute under its automation identity, defender_effect: runner process and job provenance look authorized unless the workflow mutation and later sensitive outcomes are joined}
      - {axis: indirect-build-input-activation, disposition: formal, trace_change: the visible pipeline definition remains stable while a referenced source build script test macro action or cache introduces executable behavior, defender_effect: definition-only review misses the causal input and must resolve the full dependency or source graph}
      - {axis: external-contribution-context-gated-execution, disposition: formal-medium, trace_change: attacker-controlled fork content or event metadata executes only when a privileged trigger or checkout pattern consumes it, defender_effect: low-trust contribution and high-trust runner activity appear under different actors and events; direct field intent evidence remains limited}
      - {axis: mutable-action-or-tag-redirection, disposition: collapsed-to-indirect-input, trace_change: a stable-looking action tag resolves to changed executable content, defender_effect: the observation difference is the same unresolved referenced-input lineage rather than a fourth sibling}
      - {axis: artifact-or-package-poisoning, disposition: adjacent-technique, trace_change: malicious output executes later at a downstream consumer rather than in the runner, defender_effect: downstream supply-chain execution belongs outside T1677 unless runner-side malicious code execution is also established}
      - {axis: ephemeral-runner-lifetime, disposition: defense-condition-not-child, trace_change: runner destruction shortens forensic retention, defender_effect: ephemerality changes evidence availability but is not by itself an attacker-selected poisoned-pipeline execution form}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes_zh: 无 ATT&CK 子项仍完成六轴开放检索。三个既有子项分别固定定义、间接输入和外部贡献三种不同因果入口；mutable tag 归并到间接输入，单纯制品投毒属于相邻供应链对象，runner 短驻属于防御条件。外部贡献轴因缺少足够现场意图证据维持 medium。
    reviewer_notes_en: Six axes were examined despite the absence of ATT&CK children. The three retained children fix definition indirect-input and external-contribution causal entry points. Mutable tags collapse into indirect inputs artifact-only poisoning is adjacent supply-chain behavior and runner ephemerality is a defense condition. The external-contribution axis remains medium because direct field intent evidence is limited.
