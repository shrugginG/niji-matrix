schema_version: 2.0.0
type: detection-analytic
id: NJA-000042
strategy_ref: DET-000063
name:
  zh: WMI 请求—Provider—结果关联分析
  en: WMI Request-Provider-Outcome Correlation Analytic
summary:
  zh: 以稳定关联键恢复WMI 请求—Provider—结果关联中的控制、执行与结果序列。
  en: Recover the control, execution, and outcome sequence for WMI Request-Provider-Outcome Correlation through stable correlation keys.
domains:
- enterprise
platforms:
- Windows
logic:
  paragraphs:
  - zh: 分析先规范各数据源的时间、主体、目标和请求或进程标识，再建立控制或触发、真实执行和后继结果的有向序列。只有异常主体或情境与执行谱系、完整性变化或网络结果共同出现时才提高风险；任一层缺失时降低置信度而不把单点信号直接定性。
    en: The analytic first normalizes time, principal, target, and request or process identifiers across sources, then builds a directed sequence from control or trigger through actual
      execution to follow-on outcome. Risk rises only when an anomalous principal or context co-occurs with execution lineage, integrity change, or network outcome; a missing layer lowers
      confidence rather than turning a point signal into a conclusion.
data_requirements:
- source_type: wmi-activity
  name:
    zh: WMI 活动审计
    en: WMI activity audit
  channel: null
  required_fields:
  - timestamp
  - device_id
  - user_id
  - client_process_id
  - namespace
  - class
  - method
  - operation_id
  - result
- source_type: remote-management-auth-network
  name:
    zh: 远程管理认证与网络
    en: Remote-management authentication and network
  channel: null
  required_fields:
  - timestamp
  - source_device
  - target_device
  - user_id
  - protocol
  - source_ip
  - destination_port
  - session_id
  - result
- source_type: provider-process-lineage
  name:
    zh: Provider 宿主与进程谱系
    en: Provider host and process lineage
  channel: null
  required_fields:
  - timestamp
  - device_id
  - operation_id
  - provider_process_id
  - process_id
  - parent_process_id
  - image
  - command_line
  - network_destination
observables:
- zh: 异常来源或账户调用能够执行的 WMI 方法后，provider 宿主派生解释器或未知程序
  en: An unusual source or account invokes an execution-capable WMI method and the provider host spawns an interpreter or unknown program
- zh: WMI 活动使用正常方法但目标集合、参数、时间或后继网络行为偏离该管理主体基线
  en: WMI activity uses a normal method but target set, parameters, timing, or follow-on network behavior deviates from the management-principal baseline
correlation:
  window:
    zh: 窗口从远程认证或本地客户端调用前五分钟延伸到 provider 结果和后继网络活动后三十分钟。
    en: The window starts five minutes before remote authentication or local client invocation and extends thirty minutes after provider outcomes and follow-on network activity.
  dimensions:
  - source_device
  - target_device
  - user
  - session
  - namespace
  - class
  - method
  - operation
  - provider
  - process
  - time
false_positives:
- zh: 资产盘点、配置管理、监控、安全扫描和管理员脚本会调用相同 WMI 方法并产生 provider 子进程。
  en: Asset inventory, configuration management, monitoring, security scanning, and administrator scripts may call the same WMI methods and produce provider child processes.
blind_spots:
- zh: WMI 操作日志未启用、DCOM 或 WinRM 请求无法映射到 operation ID、provider 内部执行无子进程时会失去部分因果。
  en: Causality is partially lost when WMI operation logs are disabled, DCOM or WinRM requests cannot map to operation IDs, or provider-internal execution creates no child process.
tuning_guidance:
  paragraphs:
  - zh: 按业务角色、来源、资产、软件版本、变更窗口和正常执行谱系建立基线，并分别评分主体异常、控制差异与执行结果。白名单必须绑定具体主体、目标、用途和有效期，不能永久排除受信服务、签名进程、自动化身份或维护时段；对缺失数据明确降低置信度。
    en: Build baselines by business role, origin, asset, software version, change window, and normal execution lineage, and score principal anomaly, control difference, and outcome separately.
      Allowlists must bind a concrete principal, target, purpose, and validity period rather than permanently excluding trusted services, signed processes, automation identities, or
      maintenance periods; explicitly lower confidence for missing data.
