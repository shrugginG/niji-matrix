statement_zh: 短驻服务生命周期压缩以一次执行所需 service 在 create→start→run→delete 事务中短暂存在、状态扫描可能遗漏而 payload 获得 manager parentage 为稳定变量；PsExec 链支持服务代理但删除细节有限，故为 medium。
statement_en: Ephemeral Service-Lifecycle Compression uses a one-execution service existing briefly in a create start run delete transaction so state scans may miss it while payloads gain manager parentage. PsExec supports service brokerage but public deletion detail is limited so confidence is medium.
