schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0079-001
parent_ref: NJT-0079
name: {zh: 既有服务情境借用, en: Existing-Service Context Borrowing}
summary: {zh: 攻击者启动或控制已登记服务承载恶意动作，避免新服务身份并继承受信管理器与账户, en: Adversaries start or control registered services to carry malicious actions avoiding new service identities and inheriting trusted managers and accounts}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 既有服务情境借用是攻击者调用已登记 service 的 start/control，或在执行前改变其动作后借同一 identity 启动载荷。Execution 子项固定“本次启动无新 service object”与已有 manager/name/account 来源；持久 definition 修改本身仍由 NJT-0089 负责。, en: Existing-Service Context Borrowing calls start or control on a registered service or changes its action before execution and starts payload under the same identity. This Execution child fixes no new service object for the run and established manager name and account provenance while durable definition modification remains with NJT-0089.}]}
stealth_characteristics: {paragraphs: [{zh: 既有服务情境借用不产生新建事件，process/module 由 services.exe/svchost、launchd 或 systemd 启动。Blue Mockingbird 借 wercplsupport 和近似 DLL 直接展示该差异。definition version、control actor、异常 target、child/network 仍可识别，故 creation-only 检测不足。, en: Existing-Service Context Borrowing creates no install event and processes or modules start from services.exe or svchost launchd or systemd. Blue Mockingbird borrowing wercplsupport and a similar DLL directly demonstrates it. Definition versions control actors anomalous targets and child or network outcomes remain detectable so creation-only detection is insufficient.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入已有 service 实际执行恶意动作且 identity/manager 来源降低观察的情况；正常 restart、未改动作和新建 service 排除。长期替换/隐藏 service 定义归 Persistence，module load 可共映射 T1129。, en: Include only existing services actually executing malicious actions where identity or manager provenance reduces observation. Normal restart unchanged actions and new services are excluded. Durable definition replacement or hiding belongs to Persistence and module loading may co-map T1129.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者取得 service control/definition 权限后借手动服务、更新或 support service 执行矿工、loader 或 shell，避免创建陌生名称。, en: After gaining service control or definition authority adversaries borrow manual update or support services for miners loaders or shells and avoid unfamiliar names.}]}
  threat_model: {attacker_model: {paragraphs: [{zh: 需要控制已有服务且保持启动兼容，错误修改可中断关键服务；强定义完整性和最小 control 权限增加成本。, en: Control of an existing service and start compatibility are required while mistakes may disrupt critical services and definition integrity plus least control rights raise cost.}]}, defender_model: {paragraphs: [{zh: 需要历史 definition、start/control、manager child/module 与结果，按 service identity 比较；没有版本历史时只见合法 manager。, en: Defenders need definition history start or control manager children or modules and outcomes compared by service identity and without version history see only legitimate managers.}]}}
stealth_mechanisms: [{mechanism_ref: NM-BT, role: primary, summary: {zh: 已有服务身份替代攻击者成为执行来源, en: Existing service identity replaces the adversary as execution provenance}, analysis: {paragraphs: [{zh: 已有 object 启动使进程继承 manager/system 信誉且无新建 signal，形成行为透明。Blue Mockingbird 直接支持；definition 与行为差分可破坏。, en: Starting an existing object gives processes manager and system reputation without creation signals creating Behavioral Transparency. Blue Mockingbird directly supports it while definition and behavior differentials break it.}]}, evidence_refs: [REF-000290, REF-000291], confidence: high}]
defense: {detections: {coverage: available, strategy_refs: [DET-000092]}, mitigations: {coverage: available, mitigation_refs: [MIT-000093]}}
evidence: {claim_refs: [CLM-000297, CLM-000503, CLM-000506, CLM-000508, CLM-000509, CLM-000510], case_refs: [CASE-000103], reference_refs: [REF-000131, REF-000290, REF-000291]}
research: {limitations: {paragraphs: [{zh: Blue Mockingbird 同时涉及持久 definition 修改，Execution 映射只覆盖启动/manager 来源；若无本次 start 或恶意结果不能仅凭历史定义映射本子项。, en: Blue Mockingbird also includes durable definition modification and the Execution mapping covers only start and manager provenance. Without a run or malicious outcome historical definition alone cannot map this child.}]}}
