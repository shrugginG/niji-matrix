schema_version: 2.0.0
type: evasion-subtechnique
id: NJS-0079-002
parent_ref: NJT-0079
name: {zh: 短驻服务生命周期压缩, en: Ephemeral Service-Lifecycle Compression}
summary: {zh: 攻击者为一次执行创建、启动并删除临时服务，使对象避开周期清单而载荷继承服务管理器父级, en: Adversaries create start and delete temporary services for one execution so objects evade periodic inventory while payloads inherit service-manager parentage}
aliases: []
lineage: {attck_subtechnique_inherited: false}
definition_and_concept: {paragraphs: [{zh: 短驻服务生命周期压缩是一次性 service 在 create→start→run→delete 事务中存在，目的在于让 manager 代理远程/本地执行并在后续状态盘点前移除对象。稳定变量是短生命周期和无持久 inventory，不是 service 新建或 PsExec 工具名本身。, en: Ephemeral Service-Lifecycle Compression uses a one-shot service existing through a create start run delete transaction to broker remote or local execution through the manager and remove state before later inventory. The stable variable is short lifetime and absent durable inventory rather than service creation or the PsExec name itself.}]}
stealth_characteristics: {paragraphs: [{zh: 短驻服务生命周期压缩把远程 ADMIN$/RPC 与目标 services.exe child 分到不同数据面，周期 service list 可能看不到对象。Microsoft PsExec 链证明代理路径但未逐例披露 delete，故 medium。4697/7045、SCM Operational、file/named pipe/process 和 delete/cleanup 仍可连接。, en: Ephemeral Service-Lifecycle Compression separates remote ADMIN share or RPC from target services.exe children and periodic service lists may miss objects. Microsoft's PsExec chain proves brokerage without per-instance delete detail so confidence is medium. 4697 or 7045 SCM Operational file named-pipe process and delete or cleanup evidence remains joinable.}]}
scope_boundary_definition: {paragraphs: [{zh: 只纳入一次执行后短期删除且利用状态缺口的 service；新建但长期存在归持久服务，已有服务归兄弟项，合法安装器临时服务需审批/package 排除。, en: Include one-execution services deleted quickly where state gaps are used. New durable services belong to persistence existing services to the sibling and legitimate installer temporary services are excluded by approval and package context.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者用 PsExec/SMBexec 类链、SCM API、systemd-run 或 launchctl 临时任务执行 shell、Cobalt Strike 或部署工具并清理对象。, en: Adversaries use PsExec or SMBexec-like chains SCM APIs systemd-run or launchctl temporary jobs for shells Cobalt Strike or tooling and clean the object.}]}
  threat_model: {attacker_model: {paragraphs: [{zh: 需要 create/start/delete 权限和可靠 payload，过早删除会失败、过晚会被盘点；远程链还需 SMB/RPC 与文件写入。, en: Create start and delete authority plus reliable payloads are needed and deleting too early fails while too late exposes state. Remote chains also need SMB or RPC and file writes.}]}, defender_model: {paragraphs: [{zh: 需要实时 lifecycle、remote session、file/named pipe 与 manager child，分钟级关联而非小时级快照；日志本地可删时盲区扩大。, en: Defenders need real-time lifecycle remote sessions files or named pipes and manager children with minute-scale correlation rather than hourly snapshots and locally deletable logs expand blind spots.}]}}
stealth_mechanisms: [{mechanism_ref: NM-ST, role: primary, summary: {zh: 一次性服务对象在盘点间短暂存在并跨主机分离链路, en: One-shot service objects exist between inventories and split lineage across hosts}, analysis: {paragraphs: [{zh: create/run/delete 压缩和 remote-to-local 分离使单面只见片段，形成时空释痕。PsExec 链支持但 delete 细节不足故 medium；集中生命周期与 operation correlation 可恢复。, en: Compressed create run delete and remote-to-local separation leave fragments in each plane creating Spatiotemporal Trace Dilution. PsExec supports the chain but delete detail is limited so confidence is medium and centralized lifecycle and operation correlation recover it.}]}, evidence_refs: [REF-000289, REF-000292], confidence: medium}]
defense: {detections: {coverage: available, strategy_refs: [DET-000092]}, mitigations: {coverage: available, mitigation_refs: [MIT-000093]}}
evidence: {claim_refs: [CLM-000298, CLM-000504, CLM-000507, CLM-000508, CLM-000509, CLM-000510], case_refs: [CASE-000104], reference_refs: [REF-000131, REF-000289, REF-000290, REF-000292]}
research: {limitations: {paragraphs: [{zh: Microsoft 案例直接证明远程 service creation/执行，却未逐一证明清理时点；如未来案例只见临时 service 但未证明删除或状态规避，应降低为父级而非强行映射。, en: Microsoft directly proves remote service creation and execution but not cleanup timing for every instance. Future cases with temporary services but no deletion or state-evasion evidence should map only to the parent.}]}}
