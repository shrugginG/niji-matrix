schema_version: 2.0.0
type: technique
id: NJT-0079
name: {zh: 匿迹化系统服务执行, en: Stealth-Conforming System-Service Execution}
summary: {zh: 攻击者借系统服务管理器启动已有或短驻服务，使载荷继承受信管理器与系统账户，并减少新对象或持久状态可见性, en: Adversaries use system-service managers to start existing or ephemeral services so payloads inherit trusted managers and system accounts while reducing new-object or durable-state visibility}
aliases: []
classification: {tactic_refs: [TA0002], origin: {kind: attack-retained, source_attack_id: T1569, source_attack_version: '19.1'}, decision_ref: DEC-TA0002-T1569}
definition_and_concept:
  paragraphs:
    - {zh: 匿迹化系统服务执行是攻击者调用 Windows Service Control Manager、launchd、systemd 或等价服务管理器，使已有或临时登记的 service/daemon 启动程序、DLL 或命令。直接目标是把一次或重复执行委托给高权限、长期受信的系统管理器，并取得服务账户、远程控制和后台运行能力；技术在 manager 实际产生攻击者动作时成立。, en: Stealth-Conforming System-Service Execution invokes Windows Service Control Manager launchd systemd or equivalent managers so existing or temporarily registered services or daemons start programs DLLs or commands. Its objective is delegation of one-time or repeated execution to trusted high-privilege system managers and use of service accounts remote control and background operation. The technique is established when the manager actually produces an adversary action.}
    - {zh: 本对象关注 Execution 事务而非 service definition 的持久治理。已有服务可以在无新对象情况下被启动或控制，短驻服务可在 create→start→run→delete 后消失；持久替换 service path/ACL/definition、启动项和隐藏枚举由 NJT-0089 等 Persistence 对象负责。launchctl、SCM 与 systemctl 是实现，不导入为子项。, en: This object focuses on the Execution transaction rather than durable governance of service definitions. Existing services may be started or controlled without new objects and ephemeral services may disappear after create start run and delete. Durable replacement of service paths ACLs or definitions startup persistence and hidden enumeration belong to NJT-0089 and other Persistence objects. Launchctl SCM and systemctl are implementations rather than imported children.}
stealth_characteristics:
  paragraphs:
    - {zh: 已有服务借用不产生 4697/7045 等新建信号，进程或 module 仍显示 services.exe、svchost、launchd 或 systemd 父级和系统账户。短驻服务则在周期盘点间完成生命周期，同时将远程 SMB/RPC 发起者与本地 service child 分开。Blue Mockingbird 和 PsExec 链分别展示两种断点；创建检测、当前清单或进程信誉任一单面都不完整。, en: Existing-service borrowing creates no new-install events such as 4697 or 7045 and processes or modules retain services.exe svchost launchd or systemd parentage and system accounts. Ephemeral services complete their lifecycle between periodic inventories and separate remote SMB or RPC initiators from local service children. Blue Mockingbird and PsExec chains demonstrate the two breaks and creation detection current inventory or process reputation alone is incomplete.}
    - {zh: control request、service identity 与 definition version、start/stop/create/delete、manager PID、child/module/driver、remote ADMIN$/RPC/named pipe、file hash 和 network outcome 仍可连接。已有服务在定义/动作与历史不符时暴露，短驻服务在集中生命周期日志中暴露；合法软件安装、更新和 incident response 会产生类似事件，需批准与 package 基线。, en: Control requests service identity and definition versions start stop create and delete manager PIDs children modules or drivers remote ADMIN share RPC or named pipes file hashes and network outcomes remain joinable. Existing services expose definition or action differences from history and ephemeral services expose centralized lifecycle transactions while legitimate installation updates and incident response require approval and package baselines.}
scope_boundary_definition: {paragraphs: [{zh: 纳入 service manager 实际执行恶意动作，要求 control/create/start 与 process/module/result 至少一条因果关系。合法 start/restart、新服务安装和 daemon 运维不自动纳入。已有 definition 被持久替换主要归 NJT-0089；service DLL 可与 T1129、远程 SMB/RPC 与 Remote Services 共映射；普通 shell 或 schedule 不因由 service 间接触发而改变各自边界。, en: Include malicious actions actually executed by service managers with at least one causal link among control create or start and process module or outcome. Legitimate start or restart new-service installation and daemon operations do not qualify automatically. Durable definition substitution belongs primarily to NJT-0089 service DLLs may co-map T1129 remote SMB or RPC Remote Services and ordinary shells or schedules retain their boundaries.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者在取得本地/远程管理员、SCM/systemctl/launchctl 权限后，启动被改写已有服务或临时创建 service 运行 Cobalt Strike、矿工、wiper、shell 与 loader。远程横向时常用 ADMIN$ 写入、RPC service create 和 named pipe 控制；本地隐蔽时可借已有手动启动服务。, en: After obtaining local or remote administrative SCM systemctl or launchctl authority adversaries start altered existing services or create temporary services for Cobalt Strike miners wipers shells and loaders. Remote lateral activity commonly uses ADMIN share writes RPC service creation and named-pipe control while local stealth may borrow existing manually started services.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要服务控制或创建权限、兼容的 binary/module 与账户，并理解 manager type、start semantics、dependencies 和 cleanup。已有服务轴需控制或可利用其定义/动作，短驻轴需协调生命周期；失败会留下 manager error、服务崩溃或明显新建记录。, en: The adversary needs service control or create authority compatible binaries or modules and accounts and knowledge of manager types start semantics dependencies and cleanup. Existing-service use requires control or abuse of its definition or action and ephemeral use requires lifecycle coordination while failure leaves manager errors crashes or conspicuous creation.}]}
    defender_model: {paragraphs: [{zh: 防守方需要管理 API/remote session、definition snapshot、生命周期日志、manager process/module、child command/file/network，并以 service ID、device、request/session 和 time 关联。未启用 audit、日志本地删除、launch/systemd journal 不持久或 agent 排除 services.exe child 时造成盲区。, en: Defenders need management APIs or remote sessions definition snapshots lifecycle logs manager processes or modules child commands files and network correlated by service ID device request or session and time. Disabled audit local log deletion nonpersistent launch or systemd journals or agent exclusions for services.exe children create blind spots.}]}
stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: 已有服务与系统管理器身份承载恶意动作, en: Existing service and system-manager identities carry malicious actions}, analysis: {paragraphs: [{zh: 攻击者控制已有 service start/action，使无新对象且载荷继承 manager/system identity，创建规则和父进程信誉形成行为透明。Blue Mockingbird 直接支持；definition diff 与 result 仍可揭示。, en: The adversary controls an existing service start or action leaving no new object and giving payload manager and system identity so creation rules and parent reputation create Behavioral Transparency. Blue Mockingbird directly supports it while definition differences and outcomes remain revealing.}]}, evidence_refs: [REF-000290, REF-000291], confidence: high}
  - {mechanism_ref: NM-ST, role: secondary, summary: {zh: 短驻服务事务把远程请求和本地执行分离, en: Ephemeral service transactions separate remote requests and local execution}, analysis: {paragraphs: [{zh: 一次性 service 在短窗口创建、运行和删除，状态盘点可能遗漏，远程控制与本地 manager child 又分处网络/主机数据面，形成时空释痕。PsExec 链支持代理但删除细节有限，故 medium；集中 lifecycle 与 request correlation 可恢复。, en: A one-shot service is created run and deleted in a short window so state inventory may miss it while remote control and local manager children lie in network and host planes creating Spatiotemporal Trace Dilution. PsExec supports brokerage but deletion detail is limited so confidence is medium and centralized lifecycle plus request correlation recovers it.}]}, evidence_refs: [REF-000289, REF-000292], confidence: medium}
subtechnique_taxonomy: {narrative: {paragraphs: [{zh: 子项按服务对象生命周期划分：已有服务情境借用不产生新 identity，短驻服务生命周期压缩只留下短事务而无持久 inventory。持久 definition substitution 归 NJT-0089；平台、service type 与载荷不成项。, en: Children partition service-object lifecycle. Existing-Service Context Borrowing creates no new identity while Ephemeral Service-Lifecycle Compression leaves a short transaction without durable inventory. Durable definition substitution belongs to NJT-0089 and platform service type and payload do not form children.}]}, coverage: established, subtechnique_refs: [NJS-0079-001, NJS-0079-002]}
defense: {detections: {coverage: available, strategy_refs: [DET-000092]}, mitigations: {coverage: available, mitigation_refs: [MIT-000093]}}
evidence: {claim_refs: [CLM-000296, CLM-000297, CLM-000298, CLM-000503, CLM-000504, CLM-000505, CLM-000506, CLM-000507, CLM-000508, CLM-000509, CLM-000510], case_refs: [CASE-000103, CASE-000104], reference_refs: [REF-000131, REF-000289, REF-000290, REF-000291, REF-000292]}
research: {limitations: {paragraphs: [{zh: 既有服务轴有直接规避案例；短驻轴的 Microsoft 事件证明远程 service creation/PsExec 三阶段，但未披露每个 service delete，故保持 medium。跨平台 launchctl/systemctl 主要由固定基线与服务语义覆盖，正式案例偏 Windows；合法安装和 incident response 需要强基线。, en: The existing-service axis has a direct evasion case while Microsoft proves remote service creation and PsExec stages without disclosing deletion for every service so the ephemeral axis remains medium. Cross-platform launchctl and systemctl coverage relies mainly on fixed-baseline service semantics while cases are Windows-heavy and legitimate installation and incident response require strong baselines.}]}}
