schema_version: 2.0.0
type: technique
id: NJT-0082
name: {zh: 匿迹化 WMI 执行, en: Stealth-Conforming WMI Execution}
summary: {zh: 攻击者通过 WMI Service 与 Provider 把本地或远程管理请求转换为 Wmiprvse 托管动作，并借常见管理语义削弱来源归因与区分, en: Adversaries use WMI services and providers to translate local or remote management requests into Wmiprvse-hosted actions and borrow common administration semantics to weaken provenance and differentiation}
aliases: []
classification: {tactic_refs: [TA0002], origin: {kind: attack-retained, source_attack_id: T1047, source_attack_version: '19.1'}, decision_ref: DEC-TA0002-T1047}
definition_and_concept:
  paragraphs:
    - {zh: 匿迹化 WMI 执行是本地或远程 WMI client 连接 namespace，调用 Win32_Process 或其他 execution-capable class/method，由 WMI service 将请求派给 provider，并在 Wmiprvse.exe 或自托管 provider 中启动命令、脚本或产生破坏动作。直接目标是借统一管理基础设施、provider 权限和 DCOM/WinRM 远程能力执行，而让目标端缺少原始攻击者进程父级。, en: Stealth-Conforming WMI Execution has a local or remote WMI client connect to a namespace and call Win32_Process or another execution-capable class or method. The WMI service dispatches the request to a provider and Wmiprvse.exe or a self-hosted provider starts commands scripts or destructive actions. Its objective is execution through uniform management infrastructure provider privileges and DCOM or WinRM remote capability while the target lacks the original adversary process as parent.}
    - {zh: WMI 同时支持 inventory、配置和事件，因此并非所有 query 都是 Execution。只有 method/query side effect 实际产生代码或动作才进入本技术；纯查询按 Discovery 目标归类，永久 event filter/consumer/binding 归 WMI Event Subscription。wmic.exe 弃用只改变 client 工具，PowerShell、COM、C++/.NET 和 wbemtool 仍使用同一 provider 模型。, en: WMI also supports inventory configuration and events so not every query is Execution. Only methods or query side effects producing code or actions enter this technique. Pure queries map to Discovery objectives and permanent event filters consumers and bindings to WMI Event Subscription. Deprecation of wmic.exe changes only the client tool while PowerShell COM C plus plus or .NET and wbemtool retain the same provider model.}
stealth_characteristics:
  paragraphs:
    - {zh: Provider 托管把 winword、脚本、Impacket 或远程 DCOM/WinRM client 的请求转换为目标端 Wmiprvse/provider child，本地 process tree 不显示原始发起者。TA551 直接用 WMI 打断 winword 谱系；AvosLocker 让 WMI Provider Host 执行编码 PowerShell。同时，namespace/class/method、管理账户和执行节奏可与 SCCM、监控和 IT 运维共享特征，增加区分难度。, en: Provider hosting translates requests from winword scripts Impacket or remote DCOM or WinRM clients into target-side Wmiprvse or provider children so local process trees omit the original initiator. TA551 directly used WMI to break winword lineage and AvosLocker had WMI Provider Host execute encoded PowerShell. Namespaces classes methods management accounts and cadence may also share features with SCCM monitoring and IT operations increasing differentiation difficulty.}
    - {zh: WMI-Activity/Trace 能记录 CorrelationId、OperationId、ClientMachine、User、ClientProcessId、namespace 与 ExecMethod，provider host PID、child command、module、network 和下游变化还能补全结果。只看 wmiprvse child 会误报合法管理并遗漏 remote identity；只看 client 网络则不知道 method 是否执行。来源合形在不常用 namespace、encoded command、异常 source/role 或敏感结果下会破裂。, en: WMI-Activity or Trace can record CorrelationId OperationId ClientMachine User ClientProcessId namespace and ExecMethod while provider-host PIDs child commands modules network and downstream changes complete outcomes. Wmiprvse children alone misclassify legitimate administration and omit remote identity while client network alone cannot show whether methods executed. Conformity breaks under unusual namespaces encoded commands anomalous sources or roles and sensitive outcomes.}
scope_boundary_definition: {paragraphs: [{zh: 纳入 WMI operation 实际产生恶意 process、script、file/service/configuration 或 destructive action，要求 client/operation/provider/outcome 可证明链。合法 inventory、监控和修复不自动纳入；纯 discovery、permanent subscription、普通 DCOM/WinRM session 和后继 PowerShell/服务分别保持相邻边界并可共映射。Provider DLL 被劫持时还需 T1574/T1129 证据。, en: Include WMI operations actually producing malicious processes scripts files services configuration or destructive actions with a demonstrable client operation provider and outcome chain. Legitimate inventory monitoring and remediation do not qualify automatically. Pure discovery permanent subscriptions ordinary DCOM or WinRM sessions and downstream PowerShell or services retain adjacent boundaries and may co-map. Hijacked provider DLLs also require T1574 or T1129 evidence.}]}
application_scenarios_and_threat_model:
  application_scenarios: {paragraphs: [{zh: 攻击者在获得本地/域凭据、DCOM/WinRM 到达性或代码执行后，用 WMI 创建进程、下载/运行 PowerShell、修改安全/恢复设置或跨主机执行。它适合把 Office/loader/remote tool 与目标 process 分离，并借企业管理 WMI 流量融入背景。, en: After obtaining local or domain credentials DCOM or WinRM reachability or code execution adversaries use WMI to create processes download or run PowerShell alter security or recovery settings or execute across hosts. It separates Office loader or remote tools from target processes and blends with enterprise WMI management traffic.}]}
  threat_model:
    attacker_model: {paragraphs: [{zh: 需要 namespace/method 权限、认证和防火墙可达性，并理解 provider hosting、impersonation 与 command escaping。远程 WMI 受 DCOM/WinRM、Kerberos/NTLM 和 UAC 限制；错误方法会产生日志错误。要合形还需知道组织常见 client、class 与节奏。, en: The adversary needs namespace and method authority authentication firewall reachability and knowledge of provider hosting impersonation and command escaping. Remote WMI is constrained by DCOM or WinRM Kerberos or NTLM and UAC and bad methods create errors. Conformity also requires knowledge of common organizational clients classes and cadence.}]}
    defender_model: {paragraphs: [{zh: 防守方需 WMI-Activity/Trace、DCOM/WinRM auth/network、client PID/image、namespace/class/method、provider host PID、child/module/file/network 和 asset-role baseline。日志未启用、client 结束后 PID 重用、跨主机时钟/ID 不一致或 EDR 排除 Wmiprvse 会失去因果；OperationId/CorrelationId 应优先于时间猜测。, en: Defenders need WMI-Activity or Trace DCOM or WinRM authentication and network client PID and image namespace class and method provider-host PID child module file and network plus asset-role baselines. Disabled logs PID reuse after client exit cross-host clock or ID mismatch and EDR exclusions for Wmiprvse lose causality and OperationId or CorrelationId should take precedence over time guesses.}]}
stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: WMI Provider Host 替代原始 Client 成为本地执行来源, en: WMI Provider Host replaces the original client as local execution provenance}, analysis: {paragraphs: [{zh: WMI service 把 client request 派给 provider，目标进程继承 Wmiprvse/服务身份，process-only 观察失去原始攻击者，形成行为透明。TA551 直接证明谱系打断；OperationId、client fields 与 child 可恢复。, en: WMI service dispatches client requests to providers so target processes inherit Wmiprvse or service identity and process-only observation loses the adversary creating Behavioral Transparency. TA551 directly proves lineage breaking while operation and client fields plus children recover it.}]}, evidence_refs: [REF-000293, REF-000294, REF-000296], confidence: high}
  - {mechanism_ref: NM-FD, role: secondary, summary: {zh: 恶意 WMI Operation 贴合日常管理方法与主体, en: Malicious WMI operations conform to routine administration methods and principals}, analysis: {paragraphs: [{zh: 攻击者使用常见 namespace/class/method 与管理身份，使局部 operation 与 inventory/修复相似，形成特征伪装。AvosLocker 与 operational data 支持滥用和基线需要，但直接合形意图有限，故 medium；encoded command 与敏感结果仍揭示。, en: The adversary uses common namespaces classes methods and management identities so local operations resemble inventory or remediation creating Feature Disguise. AvosLocker and operational data support abuse and baseline needs but direct conformity intent is limited so confidence is medium while encoded commands and sensitive outcomes remain revealing.}]}, evidence_refs: [REF-000274, REF-000295], confidence: medium}
subtechnique_taxonomy: {narrative: {paragraphs: [{zh: 子项按 WMI 因果链的主要观察断点划分：Provider 托管固定 client→service/provider→local outcome 的来源翻译；日常管理情境合形固定 namespace/class/method/principal/cadence 相似性。远程来源并入第一轴，纯 query 和 permanent subscription 按范围排除，client 工具名不成项。, en: Children partition the primary observation break in WMI causality. Provider hosting fixes provenance translation from client through service or provider to local outcome while routine-administration conformity fixes similarity in namespace class method principal and cadence. Remote origin belongs to the first pure queries and permanent subscriptions are excluded by scope and client-tool names do not form children.}]}, coverage: established, subtechnique_refs: [NJS-0082-001, NJS-0082-002]}
defense: {detections: {coverage: available, strategy_refs: [DET-000093]}, mitigations: {coverage: available, mitigation_refs: [MIT-000094]}}
evidence: {claim_refs: [CLM-000305, CLM-000306, CLM-000307, CLM-000511, CLM-000512, CLM-000513, CLM-000514, CLM-000515, CLM-000516, CLM-000517, CLM-000518], case_refs: [CASE-000105, CASE-000106], reference_refs: [REF-000134, REF-000274, REF-000293, REF-000294, REF-000295, REF-000296]}
research: {limitations: {paragraphs: [{zh: TA551 直接证明 WMI 被用于打断谱系，第一轴 high；AvosLocker 证明 provider 执行 encoded PowerShell 与管理操作，但没有证明攻击者刻意匹配本地正常 namespace/节奏，第二轴 medium。WMI 是广泛合法基础设施，单个 wmiprvse child、远程 port 或 WMIC 命令不足以定性。, en: TA551 directly proves WMI used to break lineage so the first axis is high. AvosLocker proves provider execution of encoded PowerShell and management operations but not deliberate matching of local namespace or cadence so the second is medium. WMI is broad legitimate infrastructure and one Wmiprvse child remote port or WMIC command is insufficient.}]}}
