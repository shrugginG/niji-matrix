schema_version: 1.0.0
type: taxonomy-breadth-review
batch_ref: BATCH-TA0002-015
work_items:
  - work_item_ref: WORK-TA0002-T1569
    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 3
    attack_subtechnique_ids: [T1569.001, T1569.002, T1569.003]
    represented_dimensions: [macOS launchctl, Windows Service Control Manager and PsExec-style services, Linux systemctl and transient services]
    breadth_trigger: multi-axis-review
    coverage_resolutions:
      - {attack_ids: [T1569.001, T1569.002, T1569.003], resolution: parent-core across platform-specific service managers; each may contribute existing-object control or ephemeral transaction evidence}
      - {attack_ids: [T1569.002], resolution: niji-variable-candidate because PsExec and service-control cases directly support trusted manager parentage and short-lived create-start-delete services}
    candidate_stealth_axes_examined:
      - {axis: existing-service-context-borrowing, disposition: formal, trace_change: attacker starts or controls an already registered service so execution inherits established service identity and manager lineage, defender_effect: creation-focused detection sees no new object and process reputation reflects the service manager}
      - {axis: ephemeral-service-lifecycle-compression, disposition: formal, trace_change: attacker creates starts and deletes a service within a short transaction, defender_effect: periodic state inventory misses the object while lifecycle audit and manager child remain}
      - {axis: durable-service-definition-substitution, disposition: adjacent-technique, trace_change: an established service definition or target is changed persistently, defender_effect: NJT-0089 and Persistence own the durable identity or enumeration variable}
      - {axis: launchctl-versus-scm-versus-systemctl, disposition: not-stealth-distinct, trace_change: API and object schemas differ, defender_effect: platform does not create a Niji child}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes_zh: 三个 ATT&CK 子项按服务管理器实现聚类，两个 Niji 子项按“已有对象无创建”和“短驻事务无持久状态”划分；持久定义替换留给 NJT-0089。
    reviewer_notes_en: Three ATT&CK children cluster by service-manager implementation while two Niji children partition no creation for existing objects and no durable state for ephemeral transactions and durable definition substitution remains with NJT-0089.
  - work_item_ref: WORK-TA0002-T1047
    attack_baseline: {domain: enterprise-attack, version: '19.1'}
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [local and remote WMI over DCOM or WinRM, WMIC PowerShell COM and programmatic clients, Win32_Process and other execution-capable methods, WMI Provider Host]
    breadth_trigger: ordinary-open-search
    candidate_stealth_axes_examined:
      - {axis: provider-hosted-execution-provenance-masking, disposition: formal, trace_change: client request becomes a local action or process under WmiPrvSE or provider service without a direct attacker parent, defender_effect: endpoint process lineage must be joined to WMI operation and remote session}
      - {axis: routine-administration-context-conformity, disposition: formal-medium, trace_change: namespace class method source and cadence resemble management or inventory activity, defender_effect: point rules cannot distinguish malicious method use without asset-role and caller baselines; direct evasion intent is limited}
      - {axis: remote-session-origin-separation, disposition: collapsed-to-provider-hosting, trace_change: remote DCOM or WinRM identity is translated into provider-local execution, defender_effect: the same client-operation-provider-outcome lineage is required}
      - {axis: query-versus-execution-method, disposition: parent-boundary, trace_change: discovery queries return data while execution methods create actions, defender_effect: only actual command or payload execution belongs to TA0002}
      - {axis: permanent-event-subscription, disposition: adjacent-technique, trace_change: filter consumer and binding persist in repository, defender_effect: WMI Event Subscription owns durable trigger execution}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes_zh: Provider 托管与管理语义合形分别改变来源归因和特征区分；远程来源并入 provider 链，纯查询与永久订阅按 Execution 边界排除。第二轴须按现场意图证据保持 medium。
    reviewer_notes_en: Provider hosting and administrative-context conformity respectively change provenance and feature differentiation. Remote origin collapses into provider lineage while queries and permanent subscriptions are excluded by the Execution boundary and the second axis remains medium for field-intent limits.
