research:
  evidence_coverage:
    parent_behavior_keys: [P3B001-T1098-REF-01, REF-000110]
    boundary_keys: [P3B001-T1098-REF-01, P3B001-T1098-REF-04]
    mechanism_support:
      - mechanism_ref: NM-BT
        evidence_keys: [REF-000110, P3B001-T1098-REF-03, P3B001-T1098-REF-05]
        evidence_mode: strongly-inferred
      - mechanism_ref: NM-FD
        evidence_keys: [P3B001-T1098-REF-02, REF-000110, P3B001-T1098-REF-03]
        evidence_mode: strongly-inferred
    child_existence_support:
      - child_key: P3B001-T1098-SUB-01
        evidence_keys: [P3B001-T1098-REF-02, REF-000110, P3B001-T1098-REF-03, P3B001-T1098-REF-04]
        evidence_mode: strongly-inferred
    unsupported_or_deferred:
      - 按云、本地、邮件、SSH、设备或容器划分子项会继承 ATT&CK 或按平台拆分，defer。
      - 休眠身份再激活可能改变基线，但现有资料主要给出 hunting query，尚不足以证明独立攻击者控制变量和兄弟边界，defer。
      - 将密码轮换节奏映射为 NM-ST 缺少攻击者有意稀释痕迹的直接证据，defer。
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已逐字段覆盖直接对象、Persistence 目的、残余痕迹、正常身份管理反例、攻击者写权限和防守方跨平面观察模型；没有复制 NJT-0001 的数量或段落。
      en: The draft covers the direct object, Persistence purpose, residual traces, legitimate identity-administration lookalikes, attacker write authority, and defender cross-plane observation model field by field without copying NJT-0001 counts or paragraphs.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [fixed-baseline XLSX extraction, library lookup, ID allocation, validation, bundle build]
  limitations:
    paragraphs:
      - zh: 现有最强证据来自 Entra 与云身份环境；ATT&CK 证明父行为跨平台存在，但不同系统对密钥标识、旧值、委托边和后续使用的可见性差异很大。来源直接证明新增凭据与角色、长期持久化及推荐关联，却不总能证明攻击者选择每个属性的主观匿迹理由，因此 NM-FD 与 Niji 子项保持 medium，休眠主体分类暂缓。
        en: The strongest evidence concerns Entra and cloud identity. ATT&CK establishes cross-platform parent behavior, but systems differ substantially in visibility into key identifiers, old values, delegation edges, and later use. Sources directly establish added credentials and roles, long-term persistence, and recommended correlation, but do not always establish the attacker's subjective stealth reason for every property. NM-FD and the Niji child therefore remain medium confidence, while a dormant-principal category is deferred.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason: Identity records are not shown to be intrinsically obscured; the supported weakness is missing cross-plane correlation.
    - mechanism_ref: NM-ST
      reason: Delayed use can occur, but current sources do not prove intentional temporal dilution as an independent stable variable.
  open_questions: []
