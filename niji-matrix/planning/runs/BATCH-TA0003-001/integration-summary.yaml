review_notes_zh: T1098 广度整改完成。固定 ATT&CK 19.1 的 7 项子技术作为检索和覆盖先验，不作为输出配额；经覆盖表与第二轮分类收敛为 3 项 Niji 原生子技术：NJS-0083-001 并行认证路径增补、NJS-0083-002 间接授权图增补、NJS-0083-003
  身份绑定设备信任附着。三者分别以认证器、授权边/传递图和 device ID/令牌声明为稳定键，DET-000064、NJA-000043 与 MIT-000063 已提供独立检测和恢复分支。新增 4 项去重后的官方来源、4 项结论和 1 项案例；设备信任有直接行为、规避用途和独立处置证据为
  high，其余两项保持 medium。完整质量门禁、Bundle、18 项 Web 测试和中英 DOM QA 重新通过，全部对象保持 review。
review_notes_en: 'T1098 breadth remediation is complete. The seven fixed ATT&CK 19.1 children served as search and coverage priors rather than
  an output quota. A coverage table and second taxonomy pass converged on three Niji-native children: NJS-0083-001 Parallel Authentication-Path
  Augmentation, NJS-0083-002 Indirect Authorization-Graph Augmentation, and NJS-0083-003 Identity-Bound Device-Trust Attachment. Their stable
  keys are respectively authenticator, authorization edge or transitive graph, and device ID or token claims, with independent branches in DET-000064,
  NJA-000043, and MIT-000063. Four deduplicated official sources, four claims, and one case were added. Device trust has direct behavior, evasion-purpose,
  and independent-response evidence at high confidence; the other two remain medium. Full quality gates, bundle, eighteen Web tests, and bilingual
  DOM QA passed again, and all objects remain in review.'
