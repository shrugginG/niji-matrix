review_schema_version: "1.0.0"
type: taxonomy-breadth-review
batch_ref: BATCH-TA0003-001
work_item_ref: WORK-TA0003-T1098
attack_baseline: {domain: enterprise-attack, version: "19.1"}
attack_subtechnique_count: 7
attack_subtechnique_ids: [T1098.001, T1098.002, T1098.003, T1098.004, T1098.005, T1098.006, T1098.007]
represented_dimensions:
  - credential and authentication-method additions
  - role, group, delegation, and policy authorization edges
  - registered-device and device-trust associations
  - cloud, email, host, container, and directory implementations
breadth_trigger: explicit-coverage-table-and-second-pass
coverage_resolutions:
  - attack_refs: [T1098.001, T1098.004]
    resolution: niji-variable-candidate
    rationale_zh: 云凭据和 SSH key 都是既有主体上的并行认证材料；合并为认证路径变量，避免按介质复制 ATT&CK。
    rationale_en: Cloud credentials and SSH keys are parallel authentication material on an existing principal and collapse into an authentication-path variable rather than media-specific ATT&CK copies.
  - attack_refs: [T1098.002, T1098.003, T1098.006, T1098.007]
    resolution: niji-variable-candidate
    rationale_zh: 邮件委托、云/容器角色和本地或域组都通过可传递授权边扩大有效权限，形成独立的授权图检测问题。
    rationale_en: Mail delegation, cloud or container roles, and local or domain groups expand effective privilege through transitive authorization edges and form a distinct authorization-graph detection problem.
  - attack_refs: [T1098.005]
    resolution: niji-variable-candidate
    rationale_zh: 设备注册持久写入设备身份与信任状态，后续令牌和条件访问使用设备键，不能并入凭据或角色边。
    rationale_en: Device registration durably writes device identity and trust state used by later tokens and Conditional Access, so it cannot collapse into credential or role edges.
candidate_stealth_axes_examined:
  - {axis: parallel-authentication-path-augmentation, resolution: formal, child_ref: NJS-0083-001}
  - {axis: indirect-authorization-graph-augmentation, resolution: formal, child_ref: NJS-0083-002}
  - {axis: identity-bound-device-trust-attachment, resolution: formal, child_ref: NJS-0083-003}
  - {axis: credential-lifetime-cycling, resolution: evidence-deferred}
  - {axis: account-specific-security-policy-exception, resolution: evidence-deferred}
second_pass_required: true
second_pass_completed: true
proposed_niji_child_count: 3
breadth_gap_explained: true
reviewer_notes:
  zh: 七项 ATT&CK 子项没有按产品、平台或凭据介质导入。三项正式 Niji 变量分别改变认证入口、有效授权推导和设备信任判定，具有不可互换的状态键、检测连接和恢复动作；其余两轴缺少同级公开证据，保持 defer。
  en: The seven ATT&CK children are not imported by product, platform, or credential medium. Three formal Niji variables respectively change authentication entry, effective-authorization derivation, and device-trust decision, with non-interchangeable state keys, detection joins, and recovery actions. Two additional axes lack peer-level public evidence and remain deferred.
