      zh: 现有重写后的 NJT-0063 已达到 NJT-0001 字段责任；本批只扩展需要明确双战术目的的定义、范围、场景和限制，不复制正文。
      en: The rewritten NJT-0063 already meets NJT-0001 field responsibility. This batch extends only definition, scope, scenarios, and limitations that must express dual-tactic purpose, without duplicating prose.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [library lookup, exact reviewed text replacement, validation, bundle build]
  limitations:
    paragraphs:
      - zh: 证据对长驻作业延迟激活为 high，但对后台优先级的主观匿迹目的仍为 medium；双战术复用不能把每个 BITS 执行都升级为持久化，也不能让所有子项自动具有相同 TA0003 证据强度。
        en: Evidence for long-lived deferred job activation is high, while subjective evasion purpose for background priority remains medium. Dual-tactic reuse cannot promote every BITS execution to Persistence or give every child identical TA0003 evidence strength.
