candidate:
  source_type: attack
  source_attack_id: T1197
  name:
    zh: BITS 作业
    en: BITS Jobs
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: ATT&CK 19.1 明确把 T1197 映射到 Persistence，并说明长驻 BITS 作业以及 transferred 或 error 通知能够跨重启执行程序。Microsoft 的作业生命周期和通知接口文档证明状态、重试、最终化与程序启动能力，UBoatRAT 和 KEGTAP/SINGLEMALT 现场资料直接观察到未完成作业、错误触发和跨重启执行。因此该候选在 TA0003 下 retain；其直接 BITS 作业对象与 TA0002 的 NJT-0063 完全相同，应扩展复用而非另建父技术。
        en: ATT&CK 19.1 explicitly maps T1197 to Persistence and states that long-lived BITS jobs and transferred- or error-state notification can execute programs across reboot. Microsoft's job-lifecycle and notification-interface documentation establishes state, retry, finalization, and program-launch behavior, while UBoatRAT and KEGTAP/SINGLEMALT field reporting directly observes unfinalized jobs, error-triggered execution, and execution across reboot. The candidate is therefore retained under TA0003. Its direct BITS job object is identical to NJT-0063 under TA0002 and should be extended and reused rather than duplicated.
proposed_content:
  summary:
    zh: 扩展 NJT-0063 的页头与关键字段，使其同时说明 BITS 作业如何委托代码执行，以及未最终化状态如何跨会话或重启保存未来激活能力。
    en: Extend the NJT-0063 header and key fields to explain both delegation of code execution to a BITS job and preservation of future activation across sessions or reboot by unfinalized state.
  definition_and_concept:
    paragraphs:
      - zh: 同一作业 GUID、文件队列、状态与通知配置既可承载 Execution，也可在攻击者故意保留非最终状态时承载 Persistence；战术目的不同但直接技术对象不变。
        en: The same job GUID, file queue, state, and notification configuration can carry Execution and, when the adversary deliberately preserves non-final state, Persistence. The tactic purpose changes without changing the direct technique object.
  stealth_characteristics:
    paragraphs:
      - zh: 既有 NJT-0063 已完整说明服务宿主、QMGR、网络传输与迟到进程之间的观察断点，以及作业 GUID、通知参数和状态历史等残余痕迹；无需为 TA0003 复制机制分析。
        en: Existing NJT-0063 already fully explains observation breaks among service hosting, QMGR, network transfer, and delayed processes and residual traces such as job GUID, notification arguments, and state history. TA0003 does not require duplicate mechanism prose.
  scope_boundary_definition:
    paragraphs:
      - zh: Persistence 适用性要求作业状态、通知或重试在当前会话之外保存未来执行或恢复能力；一次性完成且没有继续可用状态的 BITS 执行只属于 TA0002。
        en: Persistence applicability requires job state, notification, or retry to preserve future execution or recovery beyond the current session. One-shot BITS execution that finalizes without continuing usable state belongs only to TA0002.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 在创建者进程不应常驻、网络可能中断、用户会重新登录或主机会重启，而攻击者仍需恢复后门时，故意保留 BITS 作业状态。
          en: Deliberately retain BITS job state when the creator should not remain resident, connectivity may fail, the user may log on again, or the host may reboot while the adversary still needs to restore a backdoor.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 既有模型已经覆盖用户上下文、重试与超时、登录、重启和九十日 inactivity timeout；不新增未经来源支持的能力。
            en: The existing model already covers user context, retry and timeout, logon, reboot, and the ninety-day inactivity timeout; no unsupported capability is added.
      defender_model:
        paragraphs:
          - zh: 既有模型已经要求跨登录、重启和最长允许寿命保留并关联作业 GUID、用户、状态、通知和进程；该观察模型直接适用于 Persistence。
            en: The existing model already retains and correlates job GUID, user, state, notification, and process across logon, reboot, and the longest permitted lifetime; it directly applies to Persistence.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary:
        zh: 未最终化状态把创建与恢复执行分散到不同会话或重启周期
        en: Non-final state disperses creation and restored execution across sessions or reboot cycles
      analysis:
        paragraphs:
          - zh: 该 Persistence 因果链已由 NJT-0063 的 NM-ST 分析、CLM-000309、UBoatRAT 和 KEGTAP 案例直接覆盖，不新建或改强置信度。
            en: This Persistence causal chain is already covered directly by the NJT-0063 NM-ST analysis, CLM-000309, and the UBoatRAT and KEGTAP cases; no new mechanism or confidence increase is proposed.
      evidence_keys: [REF-000115, REF-000136, REF-000138, REF-000140, REF-000141]
      confidence: high
proposed_subtechniques:
  - existing_ref: NJS-0063-001
    resolution: reuse
    reason: 后台优先级和更新式属性是可与持久 BITS 作业组合的稳定传输外观变量，现有 medium 证据与防御边界不变。
  - existing_ref: NJS-0063-002
    resolution: reuse
    reason: 状态通知、未完成作业、重试和跨重启寿命直接保存未来激活，是 TA0003 的主要子项且已有 high 结论级证据。
