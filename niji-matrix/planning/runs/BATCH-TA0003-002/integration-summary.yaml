review_notes_zh: T1197 广度复核完成且无需新增对象。ATT&CK 无子技术；开放检索确认现有两项 Niji 子项已经分别覆盖活动感知后台传输（传输节奏/合法相似性）和长驻作业延迟激活（创建—激活时间与来源），两者有不同状态键、证据和防御需求。显示名称轴被前者覆盖，接口/状态名分类被拒绝。质量、Bundle、20
  项 Web 测试与中英 DOM QA 重新通过，复用对象继续保持 review。
review_notes_en: T1197 breadth review is complete without new objects. ATT&CK has no children. Open search confirms that the existing two Niji
  children separately cover activity-aware background transfer (transfer cadence or benign resemblance) and long-lived deferred activation (creation-to-activation
  timing and provenance), with different state keys, evidence, and defensive needs. Display-name variation is covered by the former, while interface
  or state-name partitions are rejected. Quality, bundle, twenty Web tests, and bilingual DOM QA passed again, and reused objects remain in review.
