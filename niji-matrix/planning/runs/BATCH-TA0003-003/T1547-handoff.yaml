handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0003-003
work_item_ref: WORK-TA0003-T1547
temporary_key_prefix: P3B003-T1547
candidate:
  source_type: attack
  source_attack_id: T1547
  name:
    zh: 启动或登录自启动执行
    en: Boot or Logon Autostart Execution
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: 固定 ATT&CK 19.1 将 T1547 定义为配置操作系统设置，使程序在启动或登录时自动运行以维持访问。Microsoft Run/RunOnce 文档直接证明持久配置到登录执行的系统行为，Sysinternals Autoruns 说明此类状态广泛分布且与大量合法启动项共存；Microsoft 现场调查又直接观察到攻击者创建更新主题 Run 值和启动文件夹快捷方式。因此该父行为在 TA0003 下 retain，并以启动/登录生命周期消费的持久激活映射为概念锚。
        en: Fixed ATT&CK 19.1 defines T1547 as configuring operating-system settings to run a program automatically at boot or logon and maintain access. Microsoft Run/RunOnce documentation directly establishes system behavior from durable configuration to logon execution, while Sysinternals Autoruns shows that such state is broadly distributed and coexists with many legitimate autostarts. Microsoft field investigations directly observe adversaries creating update-themed Run values and Startup-folder shortcuts. The parent is retained under TA0003 with the durable activation mapping consumed by boot or logon lifecycle as its conceptual anchor.
proposed_content:
  summary:
    zh: 攻击者建立或改变由系统启动或用户登录消费的持久激活映射，使代码在以后生命周期事件中自动恢复，并通过时间分离、系统托管来源或更新主题外观降低关联与区分能力。
    en: Adversaries establish or change a durable activation mapping consumed at system boot or user logon so code is restored at a later lifecycle event, reducing correlation and discrimination through temporal separation, system-hosted provenance, or update-themed appearance.
  definition_and_concept:
    paragraphs:
      - zh: 直接对象是把启动或登录触发与未来代码目标连接起来的持久配置、注册或描述符；服务定义、调度状态、事件订阅和初始化脚本内容分别属于相邻父对象。
        en: The direct object is a durable configuration, registration, or descriptor linking a boot or logon trigger to a future code target; service definitions, scheduler state, event subscriptions, and initialization-script content belong to neighboring parent objects.
  stealth_characteristics:
    paragraphs:
      - zh: 状态变更与执行可能跨会话或重启分离，后继进程由系统启动组件或用户 shell 发起，并与大量合法启动项共享存储与父体；更新主题名称进一步降低粗粒度区分，但配置差异、目标路径、签名、写入者和启动时进程谱系仍是残余痕迹。
        en: State mutation and execution can be separated across a session or reboot, the successor process originates from a system startup component or user shell, and the mapping shares stores and parents with many legitimate autostarts. Update-themed names further weaken coarse discrimination, while configuration differences, target path, signature, writer, and startup-time process lineage remain residual evidence.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入攻击者控制的持久启动/登录激活映射及其自动执行；排除初始化脚本内容 T1037、服务定义 T1543、其他事件订阅 T1546、日历调度 T1053 和模块搜索/加载劫持 T1574。
        en: Scope includes an adversary-controlled durable boot or logon activation mapping and its automatic execution, while excluding initialization-script content under T1037, service definitions under T1543, other event subscriptions under T1546, calendar scheduling under T1053, and module search or loading hijack under T1574.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者在获得写入用户或系统级自启动状态的权限后使用本技术，使载荷在当前进程退出、用户重新登录或主机重启后由正常生命周期恢复。
          en: An adversary uses the technique after obtaining authority to write user- or system-scoped autostart state so a normal lifecycle event restores the payload after the current process exits, the user signs in again, or the host reboots.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要写入至少一个实际被目标生命周期消费的配置位置，并保持目标、参数与依赖可用；权限、受保护配置、签名策略、启动失败和用户情境会限制效果。
            en: The adversary needs write access to at least one configuration location actually consumed by the target lifecycle and must keep the target, arguments, and dependencies available. Permission, protected configuration, signature policy, activation failure, and user context constrain effectiveness.
      defender_model:
        paragraphs:
          - zh: 防守方需要状态快照或变更审计、启动/登录边界、进程和模块谱系、文件完整性、签名与软件清单，并将写入和以后激活按稳定对象键连接；任一侧缺失只能看到配置异常或启动进程片段。
            en: The defender needs state snapshots or mutation audit, boot or logon boundaries, process and module lineage, file integrity, signatures, and software inventory and must join mutation to later activation on a stable object key. Missing either side leaves only a configuration anomaly or startup-process fragment.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary:
        zh: 持久启动状态把写入与实际激活分散到后续登录或重启
        en: Durable startup state disperses mutation and activation into a later logon or reboot
      analysis:
        paragraphs:
          - zh: 攻击者预先写入持久映射，执行只有在未来启动或登录时发生；短窗口进程监控无法看到创建来源，单次配置扫描又无法证明后续结果。Run/RunOnce 行为和 ATT&CK 检测策略直接支持这种跨生命周期关联需求，匿迹效果为中等置信度强推断。
            en: The adversary writes a durable mapping in advance and execution occurs only at a later boot or logon. Short process windows lose creator provenance, while one configuration scan cannot establish the later outcome. Run/RunOnce behavior and the ATT&CK detection strategy directly support this cross-lifecycle correlation requirement, with the evasion effect strongly inferred at medium confidence.
      evidence_keys: [P3B003-T1547-REF-01, P3B003-T1547-REF-02, P3B003-T1547-REF-06]
      confidence: medium
    - mechanism_ref: NM-BT
      role: secondary
      summary:
        zh: 系统启动组件执行目标并割裂配置写入者与后继进程来源
        en: System startup components execute the target and separate configuration writer from successor provenance
      analysis:
        paragraphs:
          - zh: 启动管理器、登录 shell 或注册组件读取状态并创建进程，进程侧父体属于正常系统生命周期而原始写入者只留在更早的配置审计。MITRE 明确把修改事件与启动时异常父子进程关联，支持 NM-BT；可用变更和谱系数据仍能恢复因果，保持 medium。
            en: A startup manager, logon shell, or registered component reads state and creates the process, leaving a normal lifecycle parent in process telemetry while the original writer exists only in earlier configuration audit. MITRE explicitly correlates mutation events with abnormal parent-child lineage at startup, supporting NM-BT. Available mutation and lineage data can still recover causality, so confidence remains medium.
      evidence_keys: [P3B003-T1547-REF-01, P3B003-T1547-REF-02, P3B003-T1547-REF-03, P3B003-T1547-REF-06]
      confidence: medium
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 更新主题描述符使恶意启动项接近常见软件维护外观
        en: Update-themed descriptors make malicious autostarts resemble routine software maintenance
      analysis:
        paragraphs:
          - zh: Microsoft 两项调查直接记录 EdgeUpdate 与 MsEdgeMsE 等更新或浏览器主题启动名称连接到恶意载荷；这些名称与合法软件维护语境相似，使仅依赖标签或目录信誉的规则失去区分力。主观匿迹目的为强推断，保留 medium。
            en: Two Microsoft investigations directly record update- or browser-themed autostart names such as EdgeUpdate and MsEdgeMsE connected to malicious payloads. The names resemble legitimate software-maintenance context and weaken rules that trust labels or directory reputation alone. Subjective evasion purpose is strongly inferred, so confidence remains medium.
      evidence_keys: [P3B003-T1547-REF-04, P3B003-T1547-REF-05]
      confidence: medium
proposed_subtechniques:
  - temporary_key: P3B003-T1547-SUB-01
    name:
      zh: 更新主题自启动描述符伪装
      en: Update-Themed Autostart Descriptor Camouflage
    distinguishing_variable:
      zh: 攻击者有意让启动项的可见名称、描述符或邻近路径采用更新或常见软件组件主题，而直接激活目标与该主题不一致。
      en: The adversary deliberately gives the autostart's visible name, descriptor, or adjacent path an update or common-software-component theme while the actual activation target is inconsistent with that theme.
    evidence_keys: [P3B003-T1547-REF-04, P3B003-T1547-REF-05]
    confidence: medium
defense_candidates:
  detection_strategies:
    - temporary_key: P3B003-T1547-DET-01
      decision: create
      objective: Join autostart state mutation to boot or logon activation and validate descriptor, target, signer, owner, and software inventory coherence.
  detection_analytics:
    - temporary_key: P3B003-T1547-NJA-01
      decision: create
      logic_identity: Normalize autostart mutation and snapshots, lifecycle boundaries, process/module lineage, file integrity, and approved-software records with exact descriptor-to-target correlation.
  mitigations:
    - temporary_key: P3B003-T1547-MIT-01
      decision: create
      control_identity: Limit autostart write authority, require attributable approved descriptors and trusted targets, retain diffs, and remove both mapping and payload during evidence-preserving recovery.
