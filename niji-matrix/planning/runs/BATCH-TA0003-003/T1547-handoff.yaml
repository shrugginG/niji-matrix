research:
  evidence_coverage:
    parent_behavior_keys: [P3B003-T1547-REF-01, P3B003-T1547-REF-02, P3B003-T1547-REF-04, P3B003-T1547-REF-05]
    boundary_keys: [P3B003-T1547-REF-01, P3B003-T1547-REF-06]
    mechanism_support:
      - {mechanism_ref: NM-ST, evidence_keys: [P3B003-T1547-REF-01, P3B003-T1547-REF-02, P3B003-T1547-REF-06], evidence_mode: strongly-inferred}
      - {mechanism_ref: NM-BT, evidence_keys: [P3B003-T1547-REF-01, P3B003-T1547-REF-03, P3B003-T1547-REF-06], evidence_mode: strongly-inferred}
      - {mechanism_ref: NM-FD, evidence_keys: [P3B003-T1547-REF-04, P3B003-T1547-REF-05], evidence_mode: strongly-inferred}
    child_existence_support:
      - {child_key: P3B003-T1547-SUB-01, evidence_keys: [P3B003-T1547-REF-04, P3B003-T1547-REF-05], evidence_mode: strongly-inferred}
    unsupported_or_deferred:
      - 既有自启动对象挪用缺少稳定证明顶层对象身份或数量被保留的现场证据，defer。
      - 按注册表、启动文件夹、plist、内核、用户或系统范围拆分会继承 ATT&CK 或按平台分类，defer。
      - 仅因启动位置罕见或系统父进程受信就宣称匿迹，不进入正式分类。
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级按启动状态、生命周期与后继进程的因果关系展开，子项只固定更新主题描述符变量；字段边界与 T1037/T1543/T1546/T1053/T1574 分别说明。
      en: The parent is developed around causality among startup state, lifecycle, and successor process, while the child fixes only the update-themed descriptor variable. Field boundaries separately address T1037, T1543, T1546, T1053, and T1574.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [fixed-baseline extraction, library lookup, ID allocation, validation, bundle build]
  limitations:
    paragraphs:
      - zh: 跨平台父行为由 ATT&CK 支持，但具体实现和现场证据主要集中在 Windows；更新主题子项的行为直接可见，攻击者主观匿迹意图与实际检测收益为强推断，因此保持 medium。未来若无法在其他平台找到同类描述符—真实目标不一致案例，不扩大子项平台结论。
        en: ATT&CK supports the cross-platform parent behavior, but implementation and field evidence are concentrated on Windows. Behavior for the update-themed child is directly visible, while subjective evasion intent and detection benefit are strongly inferred, so confidence remains medium. Without analogous descriptor-to-target mismatch cases on other platforms, the child's platform conclusion will not be broadened.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: Autostart configuration is not intrinsically obscured; the supported problem is correlation and feature disguise.}
  open_questions: []
integration:
  status: decision-ready
  resolutions:
    - Create a new parent, one evidence-calibrated Niji child, one Strategy, one Analytic, and one Mitigation.
    - Do not reuse draft MIT-000060 because its scheduler/service control object and generic applications do not match autostart-state integrity.
