review_notes_zh: T1547 广度整改完成。固定 ATT&CK 19.1 的 14 项子技术作为覆盖先验，经第二轮分类收敛为 3 项 Niji 原生子项：更新主题描述符伪装、既有自启动描述符目标替换、会话恢复队列注入。三者分别验证名称—软件一致性、同对象 old/new
  目标和前序会话—队列—下次登录恢复链；新增 3 项去重官方来源与 4 项结论，置信度均保持 medium。DET-000065、NJA-000044 与 MIT-000064 已加入独立检测和恢复分支。质量、Bundle、18 项 Web 测试和中英 DOM QA 重新通过，全部对象保持
  review。
review_notes_en: 'T1547 breadth remediation is complete. The fourteen fixed ATT&CK 19.1 children served as coverage priors and converged after
  a second pass into three Niji-native children: Update-Themed Descriptor Camouflage, Established Autostart Descriptor Target Substitution, and
  Session-Restoration Queue Injection. They respectively validate name-to-software coherence, same-object old and new target, and the prior-session-to-queue-to-next-logon
  restoration chain. Three deduplicated official sources and four claims were added, all at medium confidence. DET-000065, NJA-000044, and MIT-000064
  now include independent detection and recovery branches. Quality, bundle, eighteen Web tests, and bilingual DOM QA passed again, and every object
  remains in review.'
