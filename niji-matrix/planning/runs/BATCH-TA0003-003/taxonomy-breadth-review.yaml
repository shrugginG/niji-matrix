reviewer_notes:
  zh: 十四项 ATT&CK 子项没有按操作系统位置导入；三项 Niji 变量分别改变可见命名特征、既有描述符的目标一致性和会话恢复因果链。早期传感器抢跑与用户噪声混入缺少攻击者选择和效果的同级证据，保持 defer。
  en: The fourteen ATT&CK children are not imported by operating-system location. Three Niji variables respectively change visible naming features, target coherence of an established descriptor, and session-restoration causality. Pre-sensor placement and user-noise blending lack peer-level evidence of adversary choice and effect and remain deferred.
