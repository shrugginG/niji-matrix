    resolution: not-stealth-distinct
    rationale_zh: 这些项主要按注册表、提供程序、驱动、扩展、桌面或登录项实现划分，共享持久映射到生命周期消费的父变量；平台位置不直接成为 Niji 子项。
    rationale_en: These items primarily partition registry, provider, driver, extension, desktop, or login-item implementations and share the parent's durable-mapping-to-lifecycle-consumption variable; platform locations do not directly define Niji children.
  - attack_refs: [T1547.009]
    resolution: niji-variable-candidate
    rationale_zh: 修改既有快捷方式证明描述符身份可被保留而真实目标变化，产生同对象差异和恢复语义。
    rationale_en: Modification of an existing shortcut establishes that descriptor identity can remain while the actual target changes, producing same-object difference and restoration semantics.
  - attack_refs: [T1547.007]
    resolution: niji-variable-candidate
    rationale_zh: 重新打开应用使用会话恢复队列而非普通静态启动项，要求跨前序会话、队列与下次登录建立独立关联。
    rationale_en: Re-opened Applications uses a session-restoration queue rather than an ordinary static startup item and requires an independent join across prior session, queue, and next logon.
