handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0003-004
work_item_ref: WORK-TA0003-T1037
temporary_key_prefix: P3B004-T1037
candidate:
  source_type: attack
  source_attack_id: T1037
  name: {zh: 启动或登录初始化脚本, en: Boot or Logon Initialization Scripts}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
      - zh: ATT&CK 19.1 将 T1037 定义为利用启动或登录时自动执行的初始化脚本建立持久化，并记录 APT29 劫持合法应用启动脚本。Mandiant 与 Sygnia 分别直接观察到攻击者向 Fortinet `/etc/init.d/localnet` 和 F5 `/etc/rc.local` 的既有启动脚本加入命令或组件。直接对象是被生命周期调用的脚本正文或脚本钩子，区别于 NJT-0084 的描述符映射，因此 retain。
        en: ATT&CK 19.1 defines T1037 as establishing persistence through initialization scripts executed automatically at boot or logon and records APT29 hijacking legitimate application startup scripts. Mandiant and Sygnia directly observe adversaries adding commands or components to existing Fortinet `/etc/init.d/localnet` and F5 `/etc/rc.local` startup scripts. The direct object is lifecycle-invoked script content or script hook, distinct from the descriptor mapping in NJT-0084, so the candidate is retained.
proposed_content:
  summary: {zh: 攻击者创建或改变由启动/登录流程执行的脚本内容以恢复代码，并可把恶意命令嵌入既有合法脚本来降低新对象可见性和来源关联。, en: Adversaries create or change script content executed by boot or logon initialization to restore code and can embed malicious commands in an existing legitimate script to reduce new-object visibility and provenance linkage.}
  definition_and_concept:
    paragraphs:
      - {zh: 以自动执行的脚本正文、命令序列或脚本钩子为直接对象，目标是在当前会话之后由生命周期解释器恢复攻击者行为。, en: The direct object is an automatically executed script body, command sequence, or script hook, with the objective of restoring adversary behavior through a lifecycle interpreter after the current session.}
  stealth_characteristics:
    paragraphs:
      - {zh: 写入与以后执行跨生命周期分离，解释器或启动宿主隐藏原写入者；内联植入还保留合法路径和正常命令，但内容 diff、写入主体、异常命令与子进程仍可恢复。, en: Mutation and later execution are separated across lifecycle and the interpreter or startup host hides the original writer. Inline implantation also preserves legitimate path and normal commands, while content diff, writer, unusual commands, and child processes remain recoverable.}
  scope_boundary_definition:
    paragraphs:
      - {zh: 纳入脚本正文或钩子的持久攻击者变更；排除仅建立目标描述符 NJT-0084、服务定义 T1543、调度 T1053、其他事件订阅 T1546 和解释器本身。, en: Include durable adversary mutation of script body or hook; exclude descriptor-only mappings under NJT-0084, service definitions under T1543, scheduling under T1053, other event subscriptions under T1546, and the interpreter itself.}
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - {zh: 攻击者在能写入本地、域或设备启动/登录脚本后插入下载、启动、恢复或控制命令，并等待下次生命周期事件。, en: After gaining write access to a local, domain, or device boot or logon script, an adversary inserts download, launch, restoration, or control commands and waits for the next lifecycle event.}
    threat_model:
      attacker_model:
        paragraphs:
          - {zh: 需要脚本写权限、语法和执行上下文知识，并保持依赖在启动时可用；完整性保护、只读映像、签名与配置恢复会限制效果。, en: Requires script write authority, knowledge of syntax and execution context, and dependencies available at startup. Integrity protection, read-only images, signing, and configuration restore constrain effectiveness.}
      defender_model:
        paragraphs:
          - {zh: 需要逐版本脚本内容、写入审计、boot/logon ID、解释器命令与子进程，并区分批准运维变更；只有路径枚举无法发现内联差异。, en: Requires versioned script content, mutation audit, boot or logon ID, interpreter command and child processes, plus approved-administration context. Path inventory alone cannot reveal inline differences.}
  stealth_mechanisms:
    - {mechanism_ref: NM-ST, role: primary, summary: {zh: 脚本修改等待后续启动或登录才执行, en: Script mutation waits for a later boot or logon to execute}, analysis: {paragraphs: [{zh: 状态写入与执行分布在不同生命周期，短窗口丢失因果；DET0112 要求把文件修改与后续脚本执行关联，支持 medium 强推断。, en: State mutation and execution occupy different lifecycle windows and short retention loses causality. DET0112 joins file mutation to later script execution, supporting a medium-confidence strong inference.}]}, evidence_keys: [P3B004-T1037-REF-01, P3B004-T1037-REF-04], confidence: medium}
    - {mechanism_ref: NM-BT, role: secondary, summary: {zh: 启动解释器来源替代原始脚本写入者, en: Startup interpreter provenance replaces the original script writer}, analysis: {paragraphs: [{zh: 生命周期宿主解释脚本并产生子进程，进程侧不再显示较早写入者；文件审计和内容版本仍可恢复，保持 medium。, en: A lifecycle host interprets the script and creates child processes, so process telemetry no longer shows the earlier writer. File audit and content versions can recover the chain, leaving confidence at medium.}]}, evidence_keys: [P3B004-T1037-REF-01, P3B004-T1037-REF-04], confidence: medium}
    - {mechanism_ref: NM-FD, role: secondary, summary: {zh: 内联命令与合法初始化内容共享路径和脚本身份, en: Inline commands share path and script identity with legitimate initialization content}, analysis: {paragraphs: [{zh: UNC3886、Velvet Ant 与 APT29 资料支持在既有合法启动脚本内加入恶意内容；新脚本对象不出现，粗粒度路径清单失去区分力，但内容 diff 仍残留，保持 medium。, en: UNC3886, Velvet Ant, and APT29 material supports malicious content added inside existing legitimate startup scripts. No new script object appears and coarse path inventory loses discrimination, while content diff remains, supporting medium confidence.}]}, evidence_keys: [P3B004-T1037-REF-01, P3B004-T1037-REF-02, P3B004-T1037-REF-03], confidence: medium}
proposed_subtechniques:
  - temporary_key: P3B004-T1037-SUB-01
    name: {zh: 既有初始化脚本内联植入, en: Existing Initialization-Script Inline Implantation}
    distinguishing_variable: {zh: 保留正常生命周期调用的既有脚本路径与大部分合法内容，仅插入或拼接攻击者命令。, en: Preserve the existing script path and most legitimate content used by normal lifecycle while inserting or appending adversary commands.}
    evidence_keys: [P3B004-T1037-REF-01, P3B004-T1037-REF-02, P3B004-T1037-REF-03, P3B004-T1037-REF-04]
    confidence: medium
defense_candidates:
  detection_strategies: [{temporary_key: P3B004-T1037-DET-01, decision: create, objective: Join versioned script-content mutation to boot or logon interpretation and child-process results.}]
  detection_analytics: [{temporary_key: P3B004-T1037-NJA-01, decision: create, logic_identity: Diff approved script versions, attribute inserted commands, and correlate interpreter execution by script path, boot/logon ID, command, and child lineage.}]
  mitigations: [{temporary_key: P3B004-T1037-MIT-01, decision: create, control_identity: Protect initialization-script write paths, sign or baseline content, constrain interpreters and recover individual lines with evidence.}]
