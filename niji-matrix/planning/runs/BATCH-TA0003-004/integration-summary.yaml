review_notes_zh: T1037 广度整改完成。固定 ATT&CK 19.1 的 5 项子技术作为覆盖先验，收敛为 2 项 Niji 原生子项：既有初始化脚本内联植入与集中初始化脚本扇出。前者验证版本化内容 diff 和行级恢复；后者连接 GPO/共享脚本版本、目标范围、客户端应用版本与多端
  boot/logon 执行，并从中央回滚验证传播。新增 2 项去重官方来源和 2 项结论，置信度保持 medium。质量、Bundle、18 项 Web 测试及中英 DOM QA 重新通过，全部对象保持 review。
review_notes_en: 'T1037 breadth remediation is complete. The five fixed ATT&CK 19.1 children served as coverage priors and converged into two
  Niji-native children: Existing Initialization-Script Inline Implantation and Centralized Initialization-Script Fan-Out. The former validates
  versioned content difference and line-level recovery; the latter joins GPO or shared-script version, target scope, client-applied version, and
  multiple endpoint boot or logon executions, then verifies central rollback propagation. Two deduplicated official sources and two claims were
  added at medium confidence. Quality, bundle, eighteen Web tests, and bilingual DOM QA passed again, and all objects remain in review.'
