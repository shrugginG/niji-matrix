    rationale_zh: Windows 登录脚本、Login Hook、RC Scripts 与 Startup Items 主要按平台和钩子位置划分，共享脚本内容被生命周期解释的父变量。
    rationale_en: Windows logon scripts, Login Hook, RC Scripts, and Startup Items primarily partition platform and hook location and share the parent variable of lifecycle-interpreted script content.
  - attack_refs: [T1037.003]
    resolution: niji-variable-candidate
    rationale_zh: 网络登录脚本可由一个 GPO/共享脚本作用于多个系统，形成集中控制面与分布式登录执行的独立观测和恢复问题。
    rationale_en: A network logon script can apply from one GPO or shared script to multiple systems, creating an independent observation and recovery problem across centralized control and distributed logon execution.
