batch_ref: BATCH-TA0003-005
work_item_ref: WORK-TA0003-T1671
temporary_key_prefix: P3B005-T1671
candidate: {source_type: attack, source_attack_id: T1671, name: {zh: 云应用程序集成, en: Cloud Application Integration}}
recommendation:
  decision: retain
  confidence: high
  rationale: {paragraphs: [{zh: ATT&CK 19.1 直接定义以 OAuth 云应用集成维持访问；Microsoft 观察到恶意 OAuth 应用在初始账户丢失后继续访问，FBI 与 Google 直接观察 UNC6040 诱导授权恶意 Data Loader 版本。直接对象是应用集成与持续授权，不是既有身份状态边，故 retain。, en: ATT&CK 19.1 directly defines persistent access through OAuth cloud application integrations. Microsoft observed malicious OAuth apps retaining access after the initial account was lost, and the FBI and Google directly observed UNC6040 inducing authorization of a malicious Data Loader version. The direct object is the application integration and durable grant rather than an existing-identity state edge, so the candidate is retained.}]}
proposed_content:
  summary: {zh: 通过持久云应用集成和 OAuth 授权在原账户处置后继续访问，并利用正常应用流或受信集成拟态降低识别。, en: Persist through cloud application integration and OAuth grants after original-account remediation, using normal application flow or trusted-integration impersonation to reduce detection.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是应用注册/连接器、同意、权限与可持续 token 使用组成的集成关系。, en: The direct object is an integration relationship composed of application or connector registration, consent, permission, and durable token use.}]}
  stealth_characteristics: {paragraphs: [{zh: 配置与后续 app-only 活动跨控制面分离，provider-issued token 显示正常应用身份；真实 app ID、publisher、scope、consenter、token 和资源扇出仍残留。, en: Configuration and later app-only activity separate across control planes while provider-issued tokens show a normal application identity. Actual app ID, publisher, scope, consenter, token, and resource fan-out remain.}]}
  scope_boundary_definition: {paragraphs: [{zh: 纳入持续应用集成；T1098 负责既有身份访问边，T1546 负责事件触发，单次 API 授权排除。, en: Include durable application integration; T1098 owns existing-identity edges, T1546 owns event triggering, and one-time API authorization is excluded.}]}
  application_scenarios_and_threat_model: {application_scenarios: {paragraphs: [{zh: 攻击者取得可注册或同意应用的权限后创建、加入或挪用集成并长期调用数据。, en: After gaining application-registration or consent authority, an adversary creates, adds, or co-opts an integration and calls data over time.}]}, threat_model: {attacker_model: {paragraphs: [{zh: 需要应用与 consent 权限、可控凭据或 token 和目标 API 知识。, en: Requires application and consent authority, controlled credentials or tokens, and target API knowledge.}]}, defender_model: {paragraphs: [{zh: 需要应用注册、consent、permission、token、resource activity 与批准清单跨期关联。, en: Requires long-horizon correlation of application registration, consent, permission, token, resource activity, and approved inventory.}]}}}
  stealth_mechanisms:
    - {mechanism_ref: NM-BT, role: primary, summary: {zh: 应用授权与后续资源活动分布在不同云审计面, en: Application grant and later resource activity are distributed across cloud audit planes}, evidence_keys: [P3B005-T1671-REF-01, P3B005-T1671-REF-04, REF-000145, P3B005-T1671-REF-05], confidence: high}
    - {mechanism_ref: NM-FD, role: secondary, summary: {zh: provider token 和合法应用拟态使活动呈现受信集成外观, en: Provider tokens and legitimate-app mimicry make activity appear as a trusted integration}, evidence_keys: [P3B005-T1671-REF-02, P3B005-T1671-REF-03], confidence: high}
proposed_subtechniques:
  - {temporary_key: P3B005-T1671-SUB-01, name: {zh: 受信集成拟态, en: Trusted-Integration Impersonation}, distinguishing_variable: {zh: 恶意集成故意模仿既有合法集成的名称、用途或授权流程并使用平台签发 token。, en: A malicious integration deliberately imitates an established legitimate integration's name, purpose, or authorization flow and uses platform-issued tokens.}, evidence_keys: [P3B005-T1671-REF-02, P3B005-T1671-REF-03], confidence: high}
defense_candidates: {detection_strategies: [{temporary_key: P3B005-T1671-DET-01, decision: create}], detection_analytics: [{temporary_key: P3B005-T1671-NJA-01, decision: create}], mitigations: [{temporary_key: P3B005-T1671-MIT-01, decision: create}]}
