review_notes_zh: T1671 开放广度审查完成。虽然 ATT&CK 没有子技术，仍基于独立稳定键收敛为 3 项 Niji 子项：受信集成拟态（high）、休眠集成延迟激活（medium）、既有第三方集成控制挪用（high）。新增 2 项去重来源、4 项结论和 2 项案例；检测分别处理
  client 一致性、长窗口 first-use、vendor/token/跨客户关联，缓解分别处理 consent、休眠应用到期和逐连接供应商事件响应。质量、Bundle、18 项 Web 测试与中英 DOM QA 重新通过，全部对象保持 review。
review_notes_en: 'T1671 open breadth review is complete. Although ATT&CK has no children, independent stable keys converged into three Niji children:
  Trusted-Integration Impersonation (high), Dormant Integration Delayed Activation (medium), and Existing Third-Party Integration Control Co-option
  (high). Two deduplicated sources, four claims, and two cases were added. Detection separately handles client coherence, long-window first use,
  and vendor, token, or cross-customer correlation; mitigation separately handles consent, dormant-app expiry, and per-connection vendor incident
  response. Quality, bundle, eighteen Web tests, and bilingual DOM QA passed again, and all objects remain in review.'
