review_notes_en: 'T1554 open breadth remediation is complete. ATT&CK has no children, but sources support three mutually exclusive Niji variables:
  Low-Difference In-Place Binary Patching (medium), Whole-Image Path-Identity Substitution (high), and Behavior-Preserving Binary Wrapper Trojanization
  (high). Three deduplicated sources, four claims, and two cases were added. Detection branches by delta scale, complete package or signature,
  and malicious-prelude-to-original-function handoff, while mitigation supplies complete-package reinstall and wrapper or hidden-copy governance.
  Quality, bundle, twenty Web tests, and bilingual DOM QA passed, and all objects remain in review.'
