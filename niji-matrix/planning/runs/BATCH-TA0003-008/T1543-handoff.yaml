candidate:
  source_type: attack
  source_attack_id: T1543
  name: {zh: 创建或修改系统进程, en: Create or Modify System Process}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK 19.1 证明服务管理器保存的定义可重复启动攻击载荷；Niji 将范围固定为持久服务定义和可观察谱系，而不是一次进程创建，因此适配保留。
      en: ATT&CK 19.1 establishes that service-manager definitions can repeatedly start adversary payloads. Niji fixes scope on the durable service definition and observable lineage rather than one process creation, so the candidate is retained as adapted.
proposed_content:
  summary: {zh: 攻击者通过服务管理器保存持久进程定义，并以既有服务身份替换或受限枚举降低定义到执行的可辨识性。, en: Adversaries preserve a durable process definition in a service manager and reduce definition-to-execution distinguishability through established-service identity substitution or restricted enumeration.}
  definition_and_concept:
    paragraphs:
    - {zh: 直接对象是跨系统生命周期存在并能重复产生系统进程的服务定义。, en: The direct object is a service definition that survives system lifecycles and can repeatedly produce a system process.}
  stealth_characteristics:
    paragraphs:
    - {zh: 服务名称、管理器和正常启动上下文可保留，而目标或可枚举性被攻击者改变；定义、权限和进程谱系仍留下残余证据。, en: Service name, manager, and normal launch context can remain while the adversary changes the target or enumerability; definition, permissions, and process lineage remain as residual evidence.}
  scope_boundary_definition:
    paragraphs:
    - {zh: 纳入持久服务定义；排除一次服务执行、一般自启动映射、初始化脚本和加载流劫持。, en: Include durable service definitions; exclude one-time service execution, general autostart mappings, initialization scripts, and load-flow hijacking.}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 已有管理权限的攻击者建立或篡改后台服务，使其在启动、重启或管理器恢复时再次运行。, en: An adversary with administrative authority establishes or tampers with a background service so it runs again at boot, restart, or manager recovery.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要修改服务定义或对象权限并控制可执行目标；签名、最小权限和定义完整性会限制效果。, en: The adversary needs authority over a service definition or object permissions and control of an executable target; signing, least privilege, and definition integrity constrain the effect.}]}
      defender_model: {paragraphs: [{zh: 需要服务控制、配置完整性、对象权限和进程谱系，而不能只依赖名称清单或一次快照。, en: The defender needs service control, configuration integrity, object permissions, and process lineage rather than only a name inventory or point snapshot.}]}
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary: {zh: 保留既有服务身份并替换执行语义, en: Preserve established service identity while substituting execution semantics}
    analysis: {paragraphs: [{zh: 既有名称和宿主保持正常而执行目标改变，名称或父进程基线难以区分恶意目标，形成特征伪装。, en: The established name and host remain normal while the execution target changes, making name or parent-process baselines unable to distinguish the malicious target and producing Feature Disguise.}]}
    evidence_keys: [B3-008-T1543-REF-01]
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary: {zh: 限制标准服务枚举但保留底层注册与执行, en: Restrict standard service enumeration while retaining underlying registration and execution}
    analysis: {paragraphs: [{zh: 服务对象权限使常规管理查询看不到定义，而底层状态和执行继续存在，关键行为落在默认观察路径之外，形成行为透明。, en: Service-object permissions hide the definition from routine management queries while underlying state and execution persist, moving critical behavior outside the default observation path and producing Behavioral Transparency.}]}
    evidence_keys: [B3-008-T1543-REF-01]
    confidence: high
proposed_subtechniques:
- {temporary_key: B3-008-T1543-SUB-01, name_zh: 既有服务身份替换, name_en: Established-Service Identity Substitution, disposition: formal}
- {temporary_key: B3-008-T1543-SUB-02, name_zh: 受限枚举服务注册, name_en: Enumeration-Restricted Service Registration, disposition: formal}
