batch_ref: BATCH-TA0003-008
work_item_ref: WORK-TA0003-T1543
attack_baseline: {domain: enterprise-attack, version: '19.1'}
attack_subtechnique_count: 5
attack_subtechnique_ids: [T1543.001, T1543.002, T1543.003, T1543.004, T1543.005]
represented_dimensions:
- macOS user and system launchd definitions
- Linux systemd unit definitions
- Windows service definitions and service-object permissions
- container runtime and cluster node service definitions
breadth_trigger: multi-axis-review
coverage_resolutions:
- attack_refs: [T1543.001, T1543.004]
  resolution: parent-core
  rationale_zh: LaunchAgent 与 LaunchDaemon 是权限和生命周期不同的平台实现；名称拟态可支持既有服务身份轴，但平台本身不是稳定 Niji 边界。
  rationale_en: LaunchAgent and LaunchDaemon are platform implementations with different privilege and lifecycle; name disguise informs the established-service identity axis but platform is not a stable Niji boundary.
- attack_refs: [T1543.002]
  resolution: niji-variable-candidate
  rationale_zh: 修改既有 unit 的执行指令或通过符号链接改变其解析目标，支持保留服务身份而替换目标语义的变量。
  rationale_en: Modifying an existing unit command or changing its resolved target through a symlink supports preserving service identity while substituting target semantics.
- attack_refs: [T1543.003]
  resolution: niji-variable-candidate
  rationale_zh: 既有 ImagePath 替换支持身份替换变量，SDDL 隐藏服务支持标准枚举受限变量。
  rationale_en: Existing ImagePath replacement supports identity substitution, while SDDL-hidden services support restricted standard enumeration.
- attack_refs: [T1543.005]
  resolution: parent-core
  rationale_zh: restart policy、DaemonSet 和节点选择扩大持久服务范围，但没有单独证明独立于服务定义及其部署对象的匿迹变量。
  rationale_en: Restart policy, DaemonSet, and node selection broaden persistent service scope but do not independently establish a stealth variable separate from the service definition and deployment object.
candidate_stealth_axes_examined:
- axis: established-service-identity-substitution
  disposition: formal
  trace_change: an existing service name and manager context remain while executable or directive semantics change
  defender_effect: name and launch context baselines no longer identify the substituted target
- axis: enumeration-restricted-service-registration
  disposition: formal
  trace_change: service security permissions suppress ordinary management enumeration while underlying registration and execution persist
  defender_effect: management views omit an object that registry or service-control telemetry can still recover
- axis: distributed-service-fanout
  disposition: deferred
  trace_change: orchestration creates repeated objects across nodes
  defender_effect: distribution may dilute local events but current evidence does not separate persistence fanout from ordinary desired-state operation
second_pass_required: false
second_pass_completed: false
proposed_niji_child_count: 2
breadth_gap_explained: true
reviewer_notes_zh: 五项 ATT&CK 子项全部得到覆盖；两个正式变量跨平台实现，且分别需要定义—目标谱系和枚举差分检测。
reviewer_notes_en: All five ATT&CK children are covered; the two formal variables cross platform implementations and require distinct definition-to-target lineage and enumeration-differential detection.

