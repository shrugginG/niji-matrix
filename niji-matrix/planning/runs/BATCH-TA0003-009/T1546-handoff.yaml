candidate: {source_type: attack, source_attack_id: T1546, name: {zh: 事件触发执行, en: Event Triggered Execution}}
recommendation:
  decision: adapt
  confidence: high
  rationale: {paragraphs: [{zh: ATT&CK 19.1 直接记录持久事件订阅与回调执行；Niji 将对象适配为事件谓词、持久注册与动作执行的因果关系。, en: ATT&CK 19.1 directly records durable event subscriptions and callback execution; Niji adapts the object to causality among event predicate, persistent registration, and action execution.}]}
proposed_content:
  summary: {zh: 攻击者注册持久事件—动作关系，并以收窄谓词或受信 broker 来源分离降低激活的可见性和归因性。, en: Adversaries register a durable event-to-action relationship and reduce activation visibility and attribution through narrowed predicates or trusted-broker provenance separation.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是由环境事件满足谓词后调用动作的持久注册，而不是事件类型或宿主产品。, en: The direct object is a durable registration whose action is invoked when an environmental event satisfies a predicate, not the event class or host product.}]}
  stealth_characteristics: {paragraphs: [{zh: 注册与激活在时间和执行主体上分离，攻击者还能选择低频上下文；注册状态、事件、broker 与后继进程仍可恢复链条。, en: Registration and activation are separated in time and executing principal, and the adversary can select a sparse context; registration state, event, broker, and successor process can still recover the chain.}]}
  scope_boundary_definition: {paragraphs: [{zh: 纳入持久谓词—动作注册；排除纯时间调度、启动描述符、加载重定向和 Office 专属扩展状态。, en: Include durable predicate-to-action registration; exclude pure time scheduling, boot descriptors, load redirection, and Office-specific extension state.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者在 WMI、规则引擎、设备事件或应用生命周期中注册动作，等待目标相关事件自动恢复执行。, en: An adversary registers an action in WMI, a rule engine, a device event, or an application lifecycle and waits for a target-relevant event to restore execution automatically.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要修改注册状态并理解事件语义；错误谓词会不触发或高频触发。, en: The adversary needs authority over registration state and knowledge of event semantics; an incorrect predicate never fires or fires conspicuously often.}]}
      defender_model: {paragraphs: [{zh: 需要跨时间连接注册者、谓词、事件、broker 与后继结果，单看进程父级不足。, en: The defender needs long-horizon linkage among registrant, predicate, event, broker, and successor outcome; process parent alone is insufficient.}]}
  stealth_mechanisms:
  - {mechanism_ref: NM-ST, role: primary, summary: {zh: 收窄事件谓词减少激活频率和无关环境执行, en: Narrow event predicates reduce activation frequency and execution in irrelevant environments}, analysis: {paragraphs: [{zh: 只有特定事件上下文满足条件时才执行，使短窗口和通用测试只看到静态注册，形成时空释痕。, en: Execution occurs only when a specific event context satisfies the condition, leaving generic tests and short windows with only static registration and producing Spatiotemporal Trace Dilution.}]}, evidence_keys: [B3-009-T1546-REF-01], confidence: medium}
  - {mechanism_ref: NM-BT, role: secondary, summary: {zh: 受信事件 broker 隐去原始注册者来源, en: A trusted event broker masks the original registrant provenance}, analysis: {paragraphs: [{zh: 后继进程由正常 broker 发起而注册者留在早期控制事件中，进程单点观察无法恢复来源，形成行为透明。, en: A normal broker launches the successor while the registrant remains in an earlier control event, so point process observation cannot recover provenance, producing Behavioral Transparency.}]}, evidence_keys: [B3-009-T1546-REF-01], confidence: high}
