coverage_resolutions:
- attack_refs: [T1546.001, T1546.002, T1546.005]
  resolution: niji-variable-candidate
  rationale_zh: 文件类型、空闲状态和信号是不同事件来源，但都可由攻击者收窄为低频或特定上下文谓词。
  rationale_en: File type, idle state, and signals are different event sources, but each can be adversary-narrowed into a low-frequency or specific-context predicate.
- attack_refs: [T1546.003, T1546.014, T1546.017]
  resolution: niji-variable-candidate
  rationale_zh: WMI filter、Emond 规则和 udev match key 直接支持条件谓词，同时由受信事件 broker 执行动作。
  rationale_en: WMI filters, Emond rules, and udev match keys directly support conditional predicates while a trusted event broker executes the action.
- attack_refs: [T1546.004, T1546.013, T1546.018]
  resolution: parent-core
  rationale_zh: Shell、PowerShell 与 Python 启动钩子体现宿主生命周期回调；解释器类别不形成稳定匿迹边界，其受信宿主来源归 broker 轴。
  rationale_en: Shell, PowerShell, and Python startup hooks are host-lifecycle callbacks; interpreter class is not a stable stealth boundary, while trusted host provenance resolves to the broker axis.
- attack_refs: [T1546.006, T1546.009, T1546.010, T1546.011, T1546.012, T1546.015]
  resolution: adjacent-technique
  rationale_zh: 当直接对象是库、shim、调试器或 COM 解析重定向时由 T1574 负责；只有其持久事件注册与宿主回调部分留在父级。
  rationale_en: T1574 owns library, shim, debugger, or COM resolution redirection when that is the direct object; only persistent event registration and host callback remain parent core.
- attack_refs: [T1546.007, T1546.008, T1546.016]
  resolution: niji-variable-candidate
  rationale_zh: Netsh、辅助功能和安装器由正常受信宿主触发扩展动作，支持事件 broker 来源遮蔽，而产品或入口本身不成为子项。
  rationale_en: Netsh, accessibility features, and installers trigger extension actions through normal trusted hosts, supporting event-broker provenance masking without making a product or entry point a child.
candidate_stealth_axes_examined:
- {axis: context-narrowed-event-predicate-activation, disposition: formal, trace_change: execution occurs only under an attacker-selected low-frequency or target-relevant event predicate, defender_effect: generic replay and short-window monitoring do not observe activation}
- {axis: trusted-event-broker-provenance-masking, disposition: formal, trace_change: registration and initiating principal are separated from a later process launched by a trusted broker, defender_effect: process-only telemetry attributes execution to the broker rather than the registering actor}
- {axis: registration-to-activation-time-separation, disposition: parent-core, trace_change: durable registration precedes activation, defender_effect: requires long-horizon correlation but is inherent to the parent rather than a sibling discriminator}
- {axis: load-redirection-extension-point, disposition: adjacent-technique, trace_change: loader or object resolution is redirected, defender_effect: owned by T1574 when redirection is the direct object}
