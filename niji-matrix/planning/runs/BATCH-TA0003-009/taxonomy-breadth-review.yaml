second_pass_notes_zh: 第二轮从时间、谓词、来源、可检查性和宿主生命周期重新搜索；时间分离为父级固有属性，加载重定向归邻接技术，剩余两个轴通过稳定性、痕迹和防御差异门禁。
second_pass_notes_en: The second pass searched timing, predicates, provenance, inspectability, and host lifecycle. Time separation is parent-inherent, load redirection belongs to an adjacent technique, and the remaining two axes pass stability, trace, and defense-difference gates.
proposed_niji_child_count: 2
breadth_gap_explained: true
reviewer_notes_zh: 十八项实现分区收敛为两个跨平台观察变量；2 对 18 的数量差异来自平台/扩展点合并和邻接技术边界，不是证据缺失的机械压缩。
reviewer_notes_en: Eighteen implementation partitions converge into two cross-platform observation variables; the two-to-eighteen gap results from merging platform or extension points and enforcing adjacent-technique boundaries rather than mechanically compressing missing evidence.

