candidate: {source_type: attack, source_attack_id: T1668, name: {zh: 独占控制, en: Exclusive Control}}
recommendation:
  decision: adapt
  confidence: high
  rationale: {paragraphs: [{zh: ATT&CK 直接说明攻击者在保留自身访问时修补入口、停用服务、降权账户或移除其他恶意软件，以减少竞争与噪声；Niji 仅保留具有该意图和因果链的排他立足点控制。, en: ATT&CK directly states that adversaries preserve their own access while patching entry, disabling services, stripping account privilege, or removing other malware to reduce competition and noise; Niji retains only exclusive foothold control with that intent and causal chain.}]}
proposed_content:
  summary: {zh: 攻击者保留自身入口并关闭其他入侵面或清除竞争立足点，以减少多主体活动和暴露噪声。, en: Adversaries preserve their own entry while closing other ingress surfaces or evicting competing footholds to reduce multi-actor activity and exposure noise.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是自身立足点与被排除访问路径之间的不对称控制状态。, en: The direct object is an asymmetric control state between the adversary's own foothold and excluded access paths.}]}
  stealth_characteristics: {paragraphs: [{zh: 环境可能看似已修补或清理且多主体噪声下降，但变更来源、选择性和仍存自身入口构成残余证据。, en: The environment may appear remediated or cleaned and multi-actor noise declines, while change origin, selectivity, and the operator's surviving entry remain as residual evidence.}]}
  scope_boundary_definition: {paragraphs: [{zh: 只有同时证明攻击者控制变更、排除其他入口且保留自身访问才纳入；正常修复和一般防御破坏排除。, en: Include only when adversary control of the change, exclusion of other entry, and preservation of its own access are jointly established; ordinary remediation and general defense impairment are excluded.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 初始入侵后攻击者关闭已利用漏洞、竞争服务或其他恶意驻留，同时转移到自身替代入口。, en: After initial compromise, the adversary closes the exploited vulnerability, competing service, or other malicious persistence while moving to its own alternative entry.}]}
    threat_model:
      attacker_model: {paragraphs: [{zh: 需要识别竞争路径、具备修补或清除权限并确保自身入口不受影响。, en: The adversary needs to identify competing paths, hold patch or removal authority, and ensure its own entry is unaffected.}]}
      defender_model: {paragraphs: [{zh: 需要连接入侵前后暴露面、变更来源、被移除对象和仍存会话，单看“已修复”状态不足。, en: The defender must connect pre- and post-compromise exposure, change origin, removed objects, and surviving sessions; a “fixed” state alone is insufficient.}]}
  stealth_mechanisms:
  - {mechanism_ref: NM-ST, role: primary, summary: {zh: 排除竞争活动降低多主体噪声和重复入侵信号, en: Excluding competing activity reduces multi-actor noise and repeated-compromise signals}, analysis: {paragraphs: [{zh: 攻击者关闭其他进入与驻留路径后，后续恶意事件数量和冲突下降，自身入口留在更稀疏环境中，形成时空释痕。, en: After the adversary closes other entry and persistence paths, later malicious-event count and conflicts decline while its own entry remains in a sparser environment, producing Spatiotemporal Trace Dilution.}]}, evidence_keys: [B3-010-T1668-REF-01], confidence: high}
