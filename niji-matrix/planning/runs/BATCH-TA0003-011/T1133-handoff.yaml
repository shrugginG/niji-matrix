candidate: {source_type: attack, source_attack_id: T1133, name: {zh: 外部远程服务, en: External Remote Services}}
recommendation: {decision: adapt, confidence: high, rationale: {paragraphs: [{zh: ATT&CK 将同一远程服务行为映射到 Initial Access 与 Persistence；直接对象和两个匿迹变量均不随战术阶段改变，故扩展复用 NJT-0055。, en: ATT&CK maps the same remote-service behavior to Initial Access and Persistence. The direct object and two stealth variables do not change with tactic phase, so NJT-0055 is extended and reused.}]}}
proposed_content:
  summary: {zh: 外部远程服务以会话状态重放或风险情境拟态支持首次或持续重入。, en: External remote services support initial or continuing re-entry through session-state replay or risk-context mimicry.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是外部认证远程会话，Persistence 范围止于重入会话建立。, en: The direct object is an externally authenticated remote session and Persistence scope ends when the re-entry session is established.}]}
  stealth_characteristics: {paragraphs: [{zh: 新认证序列或风险偏离可被减少，但会话、设备、来源和资源结果仍可关联。, en: A new authentication sequence or risk deviation can be reduced while session device origin and resource outcomes remain correlatable.}]}
  scope_boundary_definition: {paragraphs: [{zh: 与首次入口共用行为对象，排除会话内动作并与有效账户、公开应用利用划界。, en: Reuse the first-entry behavior object while excluding in-session actions and separating Valid Accounts from public-application exploitation.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 原植入或会话失效后攻击者仍通过可用网关重新连接。, en: The adversary reconnects through an available gateway after the original implant or session fails.}]}
    threat_model: {attacker_model: {paragraphs: [{zh: 需要保留有效会话/身份状态与可接受风险情境。, en: The adversary must retain valid session or identity state and an acceptable risk context.}]}, defender_model: {paragraphs: [{zh: 需要长期连接身份、session、device、来源、服务和后继结果。, en: The defender needs long-term linkage of identity session device origin service and outcome.}]}}
  stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: 单一网关视角把持续重入显示为正常会话, en: A single gateway view presents continuing re-entry as a normal session}, analysis: {paragraphs: [{zh: 状态重放或情境贴合使关键来源落在网关局部观察之外，形成行为透明。, en: Session-state replay or context alignment leaves critical provenance outside the gateway's local view and produces Behavioral Transparency.}]}, evidence_keys: [REF-000088], confidence: high}
