candidate: {source_type: attack, source_attack_id: T1525, name: {zh: 在内部镜像中植入, en: Implant Internal Image}}
recommendation: {decision: adapt, confidence: high, rationale: {paragraphs: [{zh: ATT&CK 直接证明受害环境内部镜像被植入后可由以后置备反复产生后门实例；Niji 固定镜像身份—内容—部署谱系。, en: ATT&CK directly establishes that an implanted image inside the victim environment can repeatedly produce backdoored instances through later provisioning; Niji fixes image identity-content-deployment lineage.}]}}
proposed_content:
  summary: {zh: 攻击者篡改内部镜像，并通过可变引用替换或未来置备激活降低内容变化到运行结果的可见性。, en: Adversaries tamper with an internal image and reduce visibility from content change to runtime outcome through mutable-reference substitution or future-provisioning activation.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是内部 registry 中可被置备系统复用的镜像及其内容身份。, en: The direct object is an image and its content identity inside an internal registry that provisioning systems can reuse.}]}
  stealth_characteristics: {paragraphs: [{zh: workload 名称可不变且恶意内容延后到新实例运行；digest、push、manifest 和 instance 仍可恢复谱系。, en: Workload names can remain unchanged and malicious content runs only in a later instance; digest push manifest and instance data can recover lineage.}]}
  scope_boundary_definition: {paragraphs: [{zh: 纳入内部镜像内容变化到以后实例的链，排除外部供应链和单次上传。, en: Include internal image-content change through later instance lineage and exclude external supply chain and one-time upload.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者取得 registry 或镜像创建权限后替换常用 tag 或植入黄金镜像，等待扩缩容或重建。, en: After gaining registry or image-creation authority an adversary replaces a common tag or implants a golden image and waits for scaling or rebuild.}]}
    threat_model: {attacker_model: {paragraphs: [{zh: 需要修改镜像并使置备系统消费它。, en: The adversary must modify the image and cause provisioning systems to consume it.}]}, defender_model: {paragraphs: [{zh: 需要连接 registry、签名、digest、部署控制和运行结果。, en: The defender needs registry signature digest deployment-control and runtime-outcome linkage.}]}}
  stealth_mechanisms:
  - {mechanism_ref: NM-FD, role: primary, summary: {zh: 既有镜像引用指向被替换内容身份, en: An established image reference resolves to substituted content identity}, analysis: {paragraphs: [{zh: 工作负载仍显示熟悉 tag 而 digest 和内容改变，恶意实体借用既有镜像外观，形成特征伪装。, en: The workload still shows a familiar tag while digest and content change so the malicious entity borrows established image appearance and produces Feature Disguise.}]}, evidence_keys: [B3-012-T1525-REF-01, B3-012-T1525-REF-02], confidence: high}
proposed_subtechniques: [{temporary_key: B3-012-T1525-SUB-01, name_zh: 可变镜像引用替换, name_en: Mutable Image-Reference Substitution, disposition: formal}, {temporary_key: B3-012-T1525-SUB-02, name_zh: 未来置备镜像激活, name_en: Future-Provisioning Image Activation, disposition: formal}]
