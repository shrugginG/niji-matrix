candidate: {source_type: attack, source_attack_id: T1556, name: {zh: 修改认证过程, en: Modify Authentication Process}}
recommendation: {decision: adapt, confidence: high, rationale: {paragraphs: [{zh: ATT&CK 证明认证验证器和策略可被修改以持续接受未授权访问；Niji 聚焦未来认证结果路径而非凭据窃取。, en: ATT&CK establishes modification of authentication validators and policies to persistently accept unauthorized access; Niji focuses on future authentication-result paths rather than credential theft.}]}}
proposed_content:
  summary: {zh: 攻击者修改认证验证路径或范围化策略例外，使特定秘密或上下文持续通过而日常认证保持正常。, en: Adversaries modify authentication validation paths or scoped policy exceptions so selected secrets or contexts continue to pass while routine authentication remains normal.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是从认证输入到允许/拒绝结果的验证路径和附加策略。, en: The direct object is the validation path and additional policy from authentication input to allow or deny result.}]}
  stealth_characteristics: {paragraphs: [{zh: 普通输入和总体策略继续正常，仅选择性秘密或范围命中绕过；完整性、策略版本与结果差异仍可观察。, en: Ordinary input and overall policy remain normal while only a selected secret or scoped match bypasses controls; integrity policy version and outcome differential remain observable.}]}
  scope_boundary_definition: {paragraphs: [{zh: 纳入改变未来认证结果的持久路径，排除只窃取凭据、使用有效账户或修改账户自身状态。, en: Include durable paths that change future authentication outcomes and exclude credential theft valid-account use or mutation of the account itself.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者补丁验证器或添加窄信任例外，以便在正常用户认证并存时持续重入。, en: An adversary patches a validator or adds a narrow trust exception to continue re-entry alongside normal user authentication.}]}
    threat_model: {attacker_model: {paragraphs: [{zh: 需要认证组件或策略管理权限和稳定测试条件。, en: The adversary needs authentication-component or policy-management authority and stable test conditions.}]}, defender_model: {paragraphs: [{zh: 需要组件完整性、策略 diff、认证输入上下文和最终结果。, en: The defender needs component integrity policy diffs authentication input context and final outcomes.}]}}
  stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: 选择性输入或范围命中落在正常认证监控假设之外, en: Selected input or scoped matches fall outside normal authentication-monitoring assumptions}, analysis: {paragraphs: [{zh: 大多数认证保持正常而后门路径只对特定条件返回成功，健康检查和全局策略审查看不到关键分支，形成行为透明。, en: Most authentication remains normal while a backdoor path returns success only for selected conditions so health checks and global policy review miss the critical branch and produce Behavioral Transparency.}]}, evidence_keys: [B3-013-T1556-REF-01], confidence: high}
