coverage_resolutions:
- {attack_refs: [T1556.001, T1556.003, T1556.004, T1556.007], resolution: niji-variable-candidate, rationale_zh: 验证器或联合认证链可为特定秘密返回成功并把其他输入交给正常路径，支持选择性后门秘密轴。, rationale_en: A validator or federated authentication chain can accept a specific secret and pass other input through the normal path supporting the selective backdoor-secret axis.}
- {attack_refs: [T1556.006, T1556.009], resolution: niji-variable-candidate, rationale_zh: MFA 与条件访问可通过窄范围信任位置、设备、主体或资源例外保持总体策略外观，支持范围化策略例外。, rationale_en: MFA and conditional access can retain overall policy appearance while adding a narrow trusted-location device principal or resource exception supporting the scoped-policy-exception axis.}
- {attack_refs: [T1556.002, T1556.008], resolution: parent-core, rationale_zh: 密码过滤和网络 Provider 捕获凭据主要属于 Credential Access；只有同时改变未来认证结果时进入父级或选择性秘密轴。, rationale_en: Password filters and network providers primarily capture credentials under Credential Access and enter the parent or selective-secret axis only when they also change future authentication outcomes.}
- {attack_refs: [T1556.005], resolution: adjacent-technique, rationale_zh: 可逆加密改变凭据存储以便以后窃取，不独立产生认证通过路径，归 Credential Access/策略状态。, rationale_en: Reversible encryption changes credential storage for later theft and does not independently produce an authentication-success path so it remains adjacent Credential Access or policy state.}
candidate_stealth_axes_examined:
- {axis: selective-backdoor-secret-acceptance, disposition: formal, trace_change: only attacker-selected input bypasses normal validation while all ordinary credentials continue through the legitimate path, defender_effect: routine user authentication and health checks remain normal}
- {axis: scoped-authentication-policy-exception, disposition: formal, trace_change: a narrow location device principal resource or authentication-method exception bypasses an otherwise active policy, defender_effect: global policy inspection appears intact while selected sessions avoid controls}
- {axis: credential-interception, disposition: adjacent-technique, trace_change: plaintext or derived credentials are copied, defender_effect: owns Credential Access unless it also changes validation}
