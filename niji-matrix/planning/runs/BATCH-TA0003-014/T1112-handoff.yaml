proposed_content:
  summary: {zh: 攻击者在 Registry 保存持久状态，并可用 Win32 API 差分伪隐藏键避开标准盘点。, en: Adversaries preserve persistent state in the Registry and can use API-differential pseudo-hidden keys to evade standard inventory.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是以后由系统或应用消费的 registry 状态。, en: The direct object is registry state consumed later by a system or application.}]}
  stealth_characteristics: {paragraphs: [{zh: 标准工具可能忽略 null-prefixed key，native hive 和消费结果仍可见。, en: Standard tools may omit a null-prefixed key while native hive state and consumption outcomes remain visible.}]}
  scope_boundary_definition: {paragraphs: [{zh: 具体自启动、服务、Office 和认证语义归各自技术；本对象只处理 registry 状态与枚举差。, en: Specific autostart service Office and authentication semantics belong to their techniques and this object handles registry state and enumeration differential only.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者写入由载荷或系统以后读取的配置/命令并隐藏 key 于常规 Win32 查询。, en: An adversary writes configuration or commands read later and hides the key from common Win32 queries.}]}
    threat_model: {attacker_model: {paragraphs: [{zh: 需要 registry 写权限和 native API/格式知识。, en: The adversary needs Registry write authority and native API or format knowledge.}]}, defender_model: {paragraphs: [{zh: 需要事务日志、native hive 解析、标准枚举和消费结果差分。, en: The defender needs transaction logs native-hive parsing standard enumeration and consumption-outcome differential.}]}}
  stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: 标准 Win32 枚举遗漏 native 状态中的持久键, en: Standard Win32 enumeration omits a persistent key in native state}, analysis: {paragraphs: [{zh: null 字符使常用工具报错或忽略对象而实际状态和消费继续，关键行为落在默认观察外，形成行为透明。, en: A null character causes common tools to error or omit the object while state and consumption continue placing critical behavior outside default observation and producing Behavioral Transparency.}]}, evidence_keys: [B3-014-T1112-REF-01], confidence: high}
