review_notes_zh: 人工审查发现的单一 ATT&CK 证据越级、子技术攻防模型压缩和防御实现无来源问题已经关闭；FIN7 只支撑父级 consumer 链，Kovter/Sysinternals 支撑子项，检测明确同快照等价权限并将 ACL、扫描竞争与 parser 失败分开，保持 review 等待领域人工审查。
review_notes_en: Human-review findings covering blanket reliance on one ATT&CK source, compressed child threat models, and source-free defense implementation have been closed. FIN7 supports only the parent consumer chain, Kovter and Sysinternals support the child, and detection now requires same-snapshot equivalent privilege while separating ACL, scan races, and parser failures. The package remains in review pending domain human review.
