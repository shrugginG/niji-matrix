candidate: {source_type: attack, source_attack_id: T1137, name: {zh: Office 应用启动, en: Office Application Startup}}
recommendation: {decision: adapt, confidence: high, rationale: {paragraphs: [{zh: ATT&CK 直接证明 Office 持久扩展状态在应用启动或事件时重复加载；Niji 聚焦宿主认可的启动/信任面。, en: ATT&CK directly establishes durable Office extension state loaded repeatedly at application startup or events and Niji focuses on host-recognized startup and trust surfaces.}]}}
proposed_content:
  summary: {zh: 攻击者植入 Office 持久扩展状态，并借用预受信启动面在正常 Office 进程中自动加载。, en: Adversaries implant durable Office extension state and borrow a pretrusted startup surface for automatic loading inside a normal Office process.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是 Office/Outlook 自动加载的持久扩展配置与内容。, en: The direct object is durable extension configuration and content automatically loaded by Office or Outlook.}]}
  stealth_characteristics: {paragraphs: [{zh: Office 父进程和信任位置保持正常，内容 hash、manifest、writer 和子进程仍可观察。, en: Office parent processes and trusted locations remain normal while content hashes manifests writers and child processes remain observable.}]}
  scope_boundary_definition: {paragraphs: [{zh: 事件谓词归 T1546，加载劫持归 T1574，Registry 仅为介质。, en: Event predicates belong to T1546 load hijacking to T1574 and Registry is only a medium.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者替换模板或放置 add-in 到 Office startup/trusted surface，等待用户启动应用。, en: An adversary replaces a template or places an add-in on an Office startup or trusted surface and waits for application start.}]}
    threat_model: {attacker_model: {paragraphs: [{zh: 需要写入 Office 配置/内容和保持兼容。, en: The adversary needs Office configuration or content write access and compatibility.}]}, defender_model: {paragraphs: [{zh: 需要扩展清单、信任来源、内容完整性和 Office 执行结果。, en: The defender needs extension inventory trust origin content integrity and Office execution outcomes.}]}}
  stealth_mechanisms:
  - {mechanism_ref: NM-FD, role: primary, summary: {zh: 预受信 Office 启动面承载恶意扩展内容, en: A pretrusted Office startup surface carries malicious extension content}, analysis: {paragraphs: [{zh: Office 从正常位置以正常父进程加载攻击者内容，恶意实体借用受信扩展外观形成特征伪装。, en: Office loads adversary content from a normal location under a normal parent process so the malicious entity borrows trusted extension appearance and produces Feature Disguise.}]}, evidence_keys: [B3-015-T1137-REF-01, B3-015-T1137-REF-02], confidence: high}
proposed_subtechniques: [{temporary_key: B3-015-T1137-SUB-01, name_zh: 预受信 Office 启动面寄生, name_en: Pretrusted Office Startup-Surface Parasitism, disposition: formal}]
