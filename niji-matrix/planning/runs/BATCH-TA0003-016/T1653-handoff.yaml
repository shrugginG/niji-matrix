candidate: {source_type: attack, source_attack_id: T1653, name: {zh: 电源设置, en: Power Settings}}
recommendation: {decision: adapt, confidence: high, rationale: {paragraphs: [{zh: ATT&CK 直接证明阻止休眠/关机可延长本不能跨重启的恶意活动；Niji 适配为电源状态转移与易失入口寿命的因果。, en: ATT&CK directly establishes that preventing sleep or shutdown can extend malicious activity unable to survive reboot and Niji adapts this to causality between power-state transition and volatile-entry lifetime.}]}}
proposed_content:
  summary: {zh: 攻击者抑制休眠、关机或重启以维持易失性立足点，并减少为跨生命周期而新增落盘持久状态的需要。, en: Adversaries inhibit sleep shutdown or reboot to preserve a volatile foothold and reduce the need for additional on-disk state to cross lifecycles.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是电源状态转移及其对已感染会话/进程寿命的控制。, en: The direct object is power-state transition and its control over infected session or process lifetime.}]}
  stealth_characteristics: {paragraphs: [{zh: 主机持续运行使内存/会话存续且少留自启动痕迹，power settings/request、uptime 和进程仍可观察。, en: Continued host operation preserves memory or sessions with fewer autostart traces while power settings or requests uptime and processes remain observable.}]}
  scope_boundary_definition: {paragraphs: [{zh: 必须证明易失入口依赖状态抑制；普通电源策略、DoS 和调度唤醒排除。, en: Dependence of a volatile entry on state inhibition must be shown and ordinary power policy DoS and scheduled wake are excluded.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 不能跨重启的载荷修改 timeout、power request 或关机工具以保持主机和会话活跃。, en: A payload unable to survive reboot changes timeouts power requests or shutdown utilities to keep the host and session active.}]}
    threat_model: {attacker_model: {paragraphs: [{zh: 需要电源配置权限并承担异常 uptime/能耗暴露。, en: The adversary needs power-configuration authority and accepts exposure through anomalous uptime or energy use.}]}, defender_model: {paragraphs: [{zh: 需要 power change/request、uptime、用户活动、进程和重启能力遥测。, en: The defender needs power change or request uptime user activity process and reboot-capability telemetry.}]}}
  stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: 延长易失状态避免建立额外传统持久化对象, en: Extending volatile state avoids additional conventional persistence objects}, analysis: {paragraphs: [{zh: 主机不进入会终止载荷的状态，攻击者继续使用现有内存/会话而不新增自启动对象，传统持久化盘点看不到关键因果，形成行为透明。, en: The host does not enter a state that terminates the payload so the adversary keeps an existing memory or session foothold without adding autostart objects leaving critical causality outside conventional persistence inventory and producing Behavioral Transparency.}]}, evidence_keys: [B3-016-T1653-REF-01, B3-016-T1653-REF-02], confidence: medium}
