candidate: {source_type: attack, source_attack_id: T1542, name: {zh: 操作系统前启动, en: Pre-OS Boot}}
recommendation: {decision: adapt, confidence: high, rationale: {paragraphs: [{zh: ATT&CK 直接证明操作系统以下固件/启动流持久化可逃避主机软件防御；Niji 聚焦启动信任与观察边界。, en: ATT&CK directly establishes below-OS firmware or boot-flow persistence that evades host software defenses and Niji focuses on boot trust and observation boundaries.}]}}
proposed_content:
  summary: {zh: 攻击者控制 OS 前启动状态，并通过度量边界外固件放置或外部启动源重定向降低主机观察与来源关联。, en: Adversaries control pre-OS boot state and reduce host observation or provenance correlation through firmware placement outside an attestation boundary or external boot-source redirection.}
  definition_and_concept: {paragraphs: [{zh: 直接对象是 OS 接管前的持久启动代码、数据或来源配置。, en: The direct object is durable boot code data or source configuration before the OS takes control.}]}
  stealth_characteristics: {paragraphs: [{zh: 主机传感器启动后才运行，组件/网络来源可能又在测量范围外；firmware writes、measurements、boot variables 和网络取像仍可观察。, en: Host sensors start later and component or network sources may sit outside measurement scope while firmware writes measurements boot variables and network image retrieval remain observable.}]}
  scope_boundary_definition: {paragraphs: [{zh: 纳入 OS 前启动流，排除主机二进制、运行中系统镜像和 OS 自启动。, en: Include pre-OS boot flow and exclude host binaries running system images and OS autostart.}]}
  application_scenarios_and_threat_model:
    application_scenarios: {paragraphs: [{zh: 攻击者写入 UEFI/组件 firmware、boot sector/EFI 或 boot pointer，使每次启动先运行或加载恶意代码。, en: An adversary writes UEFI or component firmware boot sector or EFI state or a boot pointer so each boot runs or retrieves malicious code first.}]}
    threat_model: {attacker_model: {paragraphs: [{zh: 需要高权限 flash/raw disk/boot config 访问和兼容镜像。, en: The adversary needs privileged flash raw-disk or boot-configuration access and a compatible image.}]}, defender_model: {paragraphs: [{zh: 需要 OS 外 root of trust、firmware inventory、raw boot writes、measurements 与网络设备日志。, en: The defender needs an out-of-OS root of trust firmware inventory raw boot writes measurements and network-device logs.}]}}
  stealth_mechanisms:
  - {mechanism_ref: NM-BT, role: primary, summary: {zh: OS 前代码运行落在主机传感器与不完整度量范围外, en: Pre-OS code executes outside host sensors and incomplete measurement scope}, analysis: {paragraphs: [{zh: 攻击者把关键代码置于 OS 传感器启动前或 attestation 未覆盖位置，常规主机检测看不见，形成行为透明。, en: The adversary places critical code before host sensors start or outside attestation coverage so ordinary host detection cannot observe it producing Behavioral Transparency.}]}, evidence_keys: [B3-017-T1542-REF-01, B3-017-T1542-REF-02], confidence: high}
proposed_subtechniques: [{temporary_key: B3-017-T1542-SUB-01, name_zh: 度量边界外固件驻留, name_en: Attestation-Boundary Firmware Placement, disposition: formal}, {temporary_key: B3-017-T1542-SUB-02, name_zh: 外部启动源重定向, name_en: External Boot-Source Redirection, disposition: formal}]
