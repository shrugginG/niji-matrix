represented_dimensions: [platform firmware, peripheral component firmware, MBR VBR and EFI boot files, network-device ROM monitor firmware, external network boot]
breadth_trigger: multi-axis-review
coverage_resolutions:
- {attack_refs: [T1542.001, T1542.003, T1542.004], resolution: parent-core, rationale_zh: 固件、boot record 与 ROMMON 是不同实现层；其共同的 below-OS 执行是父级核心而非子项。, rationale_en: Firmware boot records and ROMMON are implementation layers whose shared below-OS execution is parent core rather than a child.}
- {attack_refs: [T1542.002], resolution: niji-variable-candidate, rationale_zh: 组件固件可能位于平台 root-of-trust 与主机完整性检查之外，支持度量边界外放置变量，而不是按组件类型分类。, rationale_en: Component firmware may sit outside the platform root of trust and host integrity checks supporting an attestation-boundary placement variable rather than component type.}
- {attack_refs: [T1542.005], resolution: niji-variable-candidate, rationale_zh: 修改 boot pointer 指向攻击者网络服务器，使控制配置、网络取得和运行镜像跨观察面，支持外部启动源重定向。, rationale_en: Changing a boot pointer to an adversary network server distributes control configuration network retrieval and running image across observation planes supporting external boot-source redirection.}
candidate_stealth_axes_examined:
- {axis: attestation-boundary-firmware-placement, disposition: formal, trace_change: adversary code resides in firmware or a component not covered by host software or the platform measurement set, defender_effect: OS and incomplete attestation report normal while code executes below them}
- {axis: external-boot-source-redirection, disposition: formal, trace_change: a local boot pointer remains while code identity is fetched from an external server at boot, defender_effect: device configuration and network image provenance are split}
- {axis: measured-boot-conforming-substitution, disposition: deferred, trace_change: malicious firmware would preserve expected measurements, defender_effect: no conclusion-level evidence for a stable general bypass}
