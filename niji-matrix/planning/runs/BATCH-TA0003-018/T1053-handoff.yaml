    - zh: ATT&CK 19.1、Tarrask 与 Nitrokod 共同证明保存的调度绑定可以跨创建进程、会话、重启或长观察窗口恢复攻击者控制的执行；TA0003 应复用 NJT-0075，而不创建重复父项。
