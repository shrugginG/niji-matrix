review_notes_zh: T1053 在 TA0003 下独立 retain，但不复制父项或 ATT&CK 子项。NJT-0075 复用四个按特征、时间、枚举状态和生命周期划分的 Niji 变量；跨会话、重启或中断后恢复是父级 Persistence 结果门。NJS-0075-004 只有另证跨中断恢复时才形成 TA0003 结论。现有专用 DET/NJA/MIT 已提供长窗、future-trigger、raw/API/runtime 差分和触发前撤销，无需名称替换式新对象。全部正式对象保持 review 等待人工领域评审。
review_notes_en: T1053 is independently retained under TA0003 without duplicating its parent or importing ATT&CK children. NJT-0075 reuses four Niji variables for features time enumeration state and lifecycle while restoration after a session reboot or interruption is the parent Persistence outcome gate. NJS-0075-004 establishes TA0003 only with separate post-interruption restoration evidence. Existing dedicated DET NJA and MIT objects already provide long windows future-trigger tracking raw-to-API-to-runtime differentials and pre-trigger revocation so no name-substitution defense object is created. All formal objects remain in review pending human domain approval.
