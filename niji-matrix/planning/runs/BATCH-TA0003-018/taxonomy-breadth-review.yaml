schema_version: 1.0.0
type: taxonomy-breadth-review
batch_ref: BATCH-TA0003-018
work_item_ref: WORK-TA0003-T1053
attack_baseline: {domain: enterprise-attack, version: '19.1'}
attack_subtechnique_count: 5
attack_subtechnique_ids: [T1053.002, T1053.003, T1053.005, T1053.006, T1053.007]
represented_dimensions: [at one-time jobs, cron user and system tables, Windows Task Scheduler objects, systemd timer and service pairs, Kubernetes CronJob Job and Pod resources]
breadth_trigger: multi-axis-review
coverage_resolutions:
- attack_refs: [T1053.002]
  resolution: parent-core
  rationale_zh: At 是一次性未来时间作业实现；只有跨观察窗口或短驻代理效果分别贡献给 NJS-0075-002 或 NJS-0075-004，命令本身不是变量。
  rationale_en: At is a one-time future-job implementation. It contributes to NJS-0075-002 or NJS-0075-004 only when delay or ephemeral brokerage changes observation and the command itself is not a variable.
- attack_refs: [T1053.003]
  resolution: parent-core
  rationale_zh: Cron 的 owner、周期与 @reboot 是平台语义，可承载合形或延期，但不按 cron 建立子项。
  rationale_en: Cron ownership cadence and at-reboot semantics can carry conformity or delay but do not define a Cron child.
- attack_refs: [T1053.005]
  resolution: niji-variable-candidate
  rationale_zh: Windows Task Scheduler 的直接案例分别支持合形、延期、枚举抑制与短驻代理四个既有 Niji 变量。
  rationale_en: Direct Windows Task Scheduler cases support the four existing Niji variables for conformity delay enumeration suppression and ephemeral brokerage.
- attack_refs: [T1053.006]
  resolution: parent-core
  rationale_zh: systemd timer 的 calendar、monotonic、Persistent 与 RandomizedDelay 提供跨平台对照；正常补跑与抖动不证明匿迹意图。
  rationale_en: Systemd timer calendar monotonic Persistent and RandomizedDelay semantics provide cross-platform contrast while ordinary catch-up and jitter do not prove stealth intent.
- attack_refs: [T1053.007]
  resolution: parent-core
  rationale_zh: CronJob→Job→Pod 与 history/TTL 贡献合形、延期和短驻对照；控制器正常清理不能自动映射短驻代理。
  rationale_en: CronJob-to-Job-to-Pod and history or TTL behavior contribute conformity delay and ephemerality contrast while ordinary controller cleanup does not automatically map brokerage.
candidate_stealth_axes_examined:
- {axis: baseline-conforming-scheduled-activation, disposition: formal-reuse, trace_change: task metadata and cadence imitate local maintenance peers, defender_effect: simple inventory and novelty rules lose differentiation}
- {axis: observation-window-deferred-activation, disposition: formal-reuse, trace_change: registration and successor execution cross session reboot or retention windows, defender_effect: short correlation cannot join creator to restored execution}
- {axis: state-enumeration-suppressed-registration, disposition: formal-reuse, trace_change: raw state and runtime remain while standard view omits the object, defender_effect: management inventory reports no task despite continuing execution}
- {axis: ephemeral-one-shot-scheduled-brokerage, disposition: formal-reuse-with-ta0003-result-gate, trace_change: create trigger run and delete occur in one short transaction with trusted scheduler parentage, defender_effect: snapshots and process-only logic lose object and initiator}
- {axis: resilient-reentry-through-retry-catch-up-or-redundancy, disposition: evidence-deferred, trace_change: scheduler paths retry catch up or rebuild one another, defender_effect: one removed or missed trigger does not end access, rationale: platform capability is documented but conclusion-level attacker-controlled stealth evidence and distinct defense are absent}
second_pass_required: false
second_pass_completed: true
proposed_niji_child_count: 4
new_niji_child_count: 0
breadth_gap_explained: true
reviewer_notes_zh: 五项 ATT&CK 实现全部决议。四项现有 Niji 变量在特征、时间、枚举状态与生命周期上具有稳定兄弟边界和不同防御；跨会话、重启或中断后的恢复是 TA0003 父级结果门，不是第五个痕迹变量。NJS-0075-004 只有在另证跨中断后继执行或访问恢复时才形成 TA0003 结论。
reviewer_notes_en: All five ATT&CK implementations received resolutions. Four existing Niji variables have stable sibling boundaries and different defenses across features time enumeration state and lifecycle. Restoration after a session reboot or interruption is the parent TA0003 outcome gate rather than a fifth trace variable. NJS-0075-004 establishes TA0003 only with separate evidence of successor execution or access restoration after interruption.
