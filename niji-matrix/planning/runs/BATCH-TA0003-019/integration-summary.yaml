review_notes_zh: 六项 ATT&CK 实现未导入。两项 Niji 变量分别固定攻击者选择的请求集合与服务器组件声明身份—可验证来源差分；运行时共驻、二进制替换、服务、事件、网络信号和内存执行返回相邻 owner。专用防御分别覆盖组件状态—加载—结果纵向链与请求匹配—非匹配差分。全部对象保持 review 等待人工领域评审。
review_notes_en: Six ATT&CK implementations were not imported. Two Niji variables fix attacker-selected request sets and the differential between declared server-component identity and verifiable provenance. Runtime co-residence binary replacement service event network signaling and memory execution return to adjacent owners. Dedicated defense separately covers component state-to-load-to-outcome lineage and matching-to-nonmatching request differentials. All objects remain in review pending human domain approval.
