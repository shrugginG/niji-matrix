coverage_resolutions:
- {attack_refs: [T1505.001], resolution: niji-variable-candidate-and-parent-core, rationale_zh: 过程名、参数或启动条件可支持请求资格化，数据库产品和存储生命周期保留父级。, rationale_en: Procedure names arguments or startup conditions can support request qualification while database product and storage lifecycle remain parent core.}
- {attack_refs: [T1505.002], resolution: niji-variable-candidate, rationale_zh: LightNeuron 按邮件字段和附件选择动作，直接支持请求资格化；进程内加载归相邻执行对象。, rationale_en: LightNeuron selects actions by mail fields and attachments directly supporting request qualification while in-process loading belongs to an adjacent execution object.}
- {attack_refs: [T1505.003], resolution: niji-variable-candidate, rationale_zh: 可请求脚本可用 URI、Header、Cookie 或秘密值选择激活；仅上传文件不满足结果门。, rationale_en: Request-addressable scripts can select activation through URI header cookie or secret values while file upload alone fails the outcome gate.}
- {attack_refs: [T1505.004], resolution: niji-variable-candidate, rationale_zh: IISpy 对特殊请求执行并忽略普通请求；IIS 产品不是边界。, rationale_en: IISpy executes on special requests and ignores ordinary requests while IIS product identity is not a boundary.}
- {attack_refs: [T1505.005], resolution: adjacent-technique, rationale_zh: 既有 DLL 内容替换归 NJT-0087，服务定义归 NJT-0089；只有独立服务器扩展对象留父级。, rationale_en: Existing DLL content replacement belongs to NJT-0087 and service definition to NJT-0089 while an independent server extension remains parent scope.}
- {attack_refs: [T1505.006], resolution: niji-variable-candidate-and-parent-core, rationale_zh: 恶意 VIB 的伪造 acceptance 直接支持信任身份轴，启动 payload 属父级生命周期。, rationale_en: Malicious VIB falsified acceptance directly supports trust identity while startup payload remains parent lifecycle.}
