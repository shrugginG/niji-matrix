reviewer_notes_zh: 六项 ATT&CK 子项按产品与实现划分。第二轮对时间、身份、运行面、安装面、作用域、事件、listener 与内存轴复核后，只有请求选择集合和组件信任身份同时具备稳定控制变量、结论级证据与差异化防御；其余为父级核心、相邻 owner、环境盲区或证据延期。
reviewer_notes_en: Six ATT&CK children are product and implementation partitions. A second pass across time identity runtime installation scope event listener and memory axes leaves only request selection set and component trust identity with stable control variables conclusion-level evidence and differentiated defense. The rest are parent core adjacent owners environmental blind spots or evidence-deferred.
