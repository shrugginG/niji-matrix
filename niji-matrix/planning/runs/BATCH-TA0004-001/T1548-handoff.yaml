handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0004-001
work_item_ref: WORK-TA0004-T1548
temporary_key_prefix: B4-001-T1548
candidate:
  source_type: attack
  source_attack_id: T1548
  name: {zh: 滥用权限提升控制机制, en: Abuse Elevation Control Mechanism}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK 19.1 直接证明攻击者可规避或滥用操作系统与云环境中的提权控制；该行为与 TA0004 直接相关。Niji 需要从实现清单适配为可跨平台讨论的控制路径、授权来源和权限窗口，同时明确排除漏洞利用、持久身份授权变更和普通高权限使用。
      en: ATT&CK 19.1 directly establishes that adversaries can circumvent or abuse elevation controls in operating systems and cloud environments, making the behavior directly relevant to TA0004. Niji should adapt the implementation inventory into cross-platform control-path, authorization-provenance, and privilege-window semantics while excluding vulnerability exploitation, durable identity-entitlement mutation, and ordinary use of already-effective privilege.
proposed_content:
  summary:
    zh: 攻击者操纵或选择权限提升控制路径，使低权限发起与高权限结果在来源、谱系或时间上分离，从而降低单点观察对真实提权因果的辨识能力。
    en: Adversaries manipulate or select an elevation-control path so that a low-privilege initiation and privileged outcome separate in provenance, lineage, or time, reducing the ability of any single observation point to resolve the true elevation cause.
  definition_and_concept:
    paragraphs:
    - zh: 直接对象是决定某个请求、进程或委派会话是否获得更高有效权限的授权控制路径，包括本地 consent/broker、执行身份转换、授权缓存以及云临时激活或身份模拟。技术成立需要低权限起点、可识别的控制路径选择或操纵，以及由此产生的更高权限结果；控制配置、提示和凭据只是实现条件。
      en: The direct object is the authorization control path that decides whether a request, process, or delegated session obtains higher effective privilege, including local consent or brokers, execution-identity transitions, authorization caches, and cloud temporary activation or impersonation. The technique requires a lower-privilege starting point, an identifiable selection or manipulation of the control path, and a resulting higher-privilege outcome; configuration, prompts, and credentials are implementation conditions.
  stealth_characteristics:
    paragraphs:
    - zh: 匿迹价值来自把发起者、授权动作、中介和高权限结果分散在不同主体、进程或时间事件中。单看受信父进程、正常 broker、合法服务主体或到期后的权限快照，可能得到看似正常的结论；中介和短寿命并不抹除痕迹，而是要求跨控制面、进程谱系和资源使用面重新连接。
      en: Stealth value comes from distributing the initiator, authorization action, intermediary, and privileged result across different principals, processes, or times. A trusted parent process, normal broker, legitimate service principal, or post-expiry entitlement snapshot can look benign in isolation. Intermediation and short lifetime do not erase traces; they require reconstruction across control-plane records, process lineage, and resource use.
  scope_boundary_definition:
    paragraphs:
    - zh: 软件漏洞直接产生提权时归 T1068；新增持久角色、组、凭据或委派边归 T1098/NJT-0083；Windows 访问令牌的创建、复制、伪装或替换归 T1134；仅用已经有效的管理员账户或执行普通高权限命令不成立。对 sudoers、UAC、TCC 或租户策略的持久改动只有在其控制提权因果时作为本技术上下文，不能按配置介质另建子技术。
      en: Elevation directly caused by a software flaw belongs to T1068; addition of a durable role, group, credential, or delegation edge belongs to T1098 and NJT-0083; creation, copying, impersonation, or replacement of a Windows access token belongs to T1134; merely using an already-privileged account or running an ordinary privileged command is insufficient. Durable changes to sudoers, UAC, TCC, or tenant policy are context only when they control the elevation cause and do not warrant subtechniques by configuration medium.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 场景包括把攻击者输入交给可自动提升的受信 Windows 组件、经 macOS 授权服务或已获 TCC 批准的应用完成受保护操作、在 sudo 缓存仍有效时执行高权限命令，以及激活或模拟短期云高权限身份后迅速访问目标资源。
        en: Scenarios include passing adversary-controlled input to a trusted auto-elevating Windows component, completing a protected action through macOS authorization services or an already TCC-approved application, executing privileged commands while a sudo cache remains valid, and rapidly accessing a target resource after activating or impersonating a temporary cloud-privileged identity.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者已在受限用户、进程或云主体上下文中执行，并能调用提权控制、影响其输入、利用现存授权缓存，或满足/绕过临时激活前提。其能力不必包含内核漏洞或持久管理员角色写入，但必须能选择控制路径，并在权限窗口内维持命令、会话或资源访问关联。
          en: The adversary already executes as a constrained user, process, or cloud principal and can invoke an elevation control, influence its input, exploit an existing authorization cache, or satisfy or bypass temporary-activation prerequisites. The capability need not include a kernel exploit or durable administrator-role write, but it must permit selection of the control path and maintenance of command, session, or resource-use linkage during the privileged interval.
      defender_model:
        paragraphs:
        - zh: 防守方至少能采集提权请求或控制状态、调用进程/主体、授权或同意结果、产生的高权限进程/令牌/会话和首个敏感操作，并拥有审批、维护窗口、软件签名与基线。若平台只记录高权限结果而不记录低权限请求、broker 事务 ID、委派链或激活有效期，检测只能作异常推断，不能证明提权因果。
          en: The defender can collect at least elevation request or control state, calling process or principal, authorization or consent result, resulting privileged process, token, or session, and the first sensitive action, together with approval, maintenance windows, signing, and baseline context. Where a platform records only the privileged result and omits the low-privilege request, broker transaction ID, delegation chain, or activation validity, detection can infer anomaly but cannot prove elevation causality.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary: {zh: 提权因果跨越控制平面、受信中介与高权限结果边界, en: Elevation causality crosses control-plane trusted-intermediary and privileged-outcome boundaries}
    analysis:
      paragraphs:
      - zh: 攻击者选择 broker、受信组件、已批准应用或委派身份承接提权请求，使低权限发起痕迹终止于中介，而高权限行为从另一个进程、服务或主体出现。防守方若分别监控请求侧与结果侧，受信中介会切断直接归因并产生边界穿越；只有按事务、父子/调用谱系、delegation chain 和资源结果连接后，才能恢复完整提权链并消除匿迹收益。
        en: The adversary selects a broker, trusted component, approved application, or delegated identity to carry the elevation request, causing the low-privilege trace to end at the intermediary while privileged behavior emerges from another process, service, or principal. Separate monitoring of request and outcome planes loses direct attribution at the trusted intermediary and produces Boundary Traversal. Joining transaction, parent-child or call lineage, delegation chain, and resource outcome restores the complete elevation chain and removes the stealth advantage.
    evidence_keys: [B4-001-T1548-REF-01, B4-001-T1548-REF-02, B4-001-T1548-REF-06, B4-001-T1548-REF-09]
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary: {zh: 短寿命权限状态把激活、使用与到期分散在不同时间点, en: Short-lived privilege state separates activation use and expiry across time}
    analysis:
      paragraphs:
      - zh: 攻击者把高权限动作安排在 sudo 缓存、JIT 激活或短期身份模拟凭据的有效区间内，使权限在使用前出现并在审查时可能已经消失。痕迹从持久授权边变为激活、令牌或时间戳、资源使用与失效的离散序列；仅靠定时权限快照的防守方会错过中间状态。构造精确有效区间并验证每次使用的审批、作用域和到期关系，才能抵消这种 Short-lived Trace 匿迹。
        en: The adversary schedules privileged action inside the validity interval of a sudo cache, JIT activation, or short-lived impersonation credential, so privilege appears before use and may already be gone at review time. The trace changes from a durable entitlement edge into a discrete sequence of activation, token or timestamp, resource use, and invalidation. Defenders relying on periodic entitlement snapshots can miss the intermediate state. Constructing the exact validity interval and validating approval, scope, and expiry for every use counters this Short-lived Trace stealth.
    evidence_keys: [B4-001-T1548-REF-04, B4-001-T1548-REF-05, B4-001-T1548-REF-06, B4-001-T1548-REF-07]
    confidence: high
