    - zh: 平台对 broker 事务、sudo 时间戳、TCC attribution、云委派链和令牌有效期的记录不一致；证据足以支持两个跨平台轴，但不支持把所有实现解释为主动匿迹，也不支持第三个最小作用域或状态伪装正式轴。
      en: Platform recording of broker transactions, sudo timestamps, TCC attribution, cloud delegation chains, and token validity is inconsistent. Evidence supports two cross-platform axes but does not justify treating every implementation as intentional stealth or formalizing a third minimum-scope or state-camouflage axis.
  rejected_mechanisms: [platform-specific control partition, prompt-only partition]
