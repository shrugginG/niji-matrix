shared_library_resolutions:
- library: references
  decision: create
  rationale_zh: 现有共享源没有 T1548 19.1、UAC、sudo 时间戳、PIM、服务账户模拟、TCC 授权与 Glupteba UAC 链的语义等价记录。
  rationale_en: The library lacks semantically equivalent records for T1548 19.1, UAC, sudo timestamps, PIM, service-account impersonation, TCC authorization, and the observed Glupteba UAC chain.
- library: claims
  decision: create
  rationale_zh: 父级准入、两个子技术成立性、检测与缓解结论均需原子化，不复用 T1098 的持久状态结论。
  rationale_en: Parent admission, both subtechnique-existence conclusions, detection, and mitigation require atomic claims and cannot reuse T1098 durable-state conclusions.
- library: cases
  decision: create
  rationale_zh: Glupteba 报告直接观察到受信 UAC 中介链，支持子项一；临时权限窗口未找到同等级独立活动案例，因此不制造第二案例。
  rationale_en: The Glupteba report directly observes a trusted UAC intermediary chain supporting the first child. No independent campaign case of equal quality was found for the temporary privilege window, so a second case will not be manufactured.
- library: detections
  decision: split
  compared_refs: [DET-000064, DET-000083, DET-000084]
  rationale_zh: DET-000064 关联持久身份变更，DET-000083 关联一般 IPC broker，DET-000084 关联执行选择状态；T1548 必须把提权请求、授权上下文、中介/有效窗口和高权限结果作为专有策略目标。
  rationale_en: DET-000064 correlates durable identity mutation, DET-000083 general IPC brokers, and DET-000084 execution-selection state. T1548 needs a dedicated strategy target joining elevation request, authorization context, intermediary or validity window, and privileged outcome.
- library: analytics
  decision: split
  compared_refs: [NJA-000043, NJA-000062, NJA-000063]
  rationale_zh: 既有 Analytic 缺少本地提权事务与云短期激活区间的字段和输出；创建宿主谱系与云时间窗两个可实施分析。
  rationale_en: Existing analytics lack fields and outputs for local elevation transactions and cloud temporary-activation intervals. Create separate implementable host-lineage and cloud-interval analytics.
- library: mitigations
  decision: split
  compared_refs: [MIT-000063, MIT-000084, MIT-000085]
  rationale_zh: MIT-000063 面向持久身份边，其他候选面向 IPC 或执行选择完整性；提权控制需要逐事务授权、控制状态完整性、短期权限约束和谱系遥测的目标特定应用。
  rationale_en: MIT-000063 addresses durable identity edges and the other candidates IPC or execution-selection integrity. Elevation controls need target-specific applications for per-transaction authorization, control-state integrity, temporary-privilege constraints, and lineage telemetry.
- library: relationships
  decision: defer
  rationale_zh: 本批次没有证据要求新增 ATT&CK/Niji 跨对象关系；相邻边界在决议与正文中表达，避免创建无方向性或无额外语义的 REL。
  rationale_en: No evidence in this batch requires a new ATT&CK or Niji cross-object relationship. Adjacent boundaries are expressed in the decision and prose rather than creating a directionless or semantically redundant REL.
