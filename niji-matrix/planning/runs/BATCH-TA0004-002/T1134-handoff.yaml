  limitations:
    paragraphs:
    - zh: Windows 提供稳定的令牌安全模型，但不同传感器并不一致暴露线程有效令牌、token ID、AuthenticationId、实际调用者、显示父级和权限前态。案例分别证明三种行为及其观察影响，却不能证明每次合法令牌 API 调用都具有匿迹意图；正式对象因此要求高权限结果与多源因果关联。
      en: Windows provides a stable token security model, but sensors do not consistently expose thread effective token, token ID, AuthenticationId, actual caller, displayed parent, and privilege prior state. The cases establish the three behaviors and observation effects separately but cannot show stealth intent for every legitimate token API call, so the formal object requires a privileged outcome and multi-source causal linkage.
    - zh: SID-History 在 ATT&CK 中属于 T1134，但其目录属性写入、寿命和恢复动作与已有 NJS-0083-002 相同；本批按直接对象把它标为 adjacent，而不是否认后续令牌影响。纯 PPID 欺骗同样只有在继承或获得更高上下文时才进入 TA0004 范围。
      en: ATT&CK places SID-History under T1134, but its directory-attribute write, lifetime, and recovery action are identical to existing NJS-0083-002; this batch marks it adjacent by direct object rather than denying its downstream token effect. PPID spoofing alone likewise enters TA0004 scope only when it inherits or obtains a higher context.
