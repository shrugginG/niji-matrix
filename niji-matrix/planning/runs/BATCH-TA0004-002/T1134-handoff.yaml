shared_library_resolutions:
- library: references
  decision: extend-and-create
  rationale_zh: 现有 REF-000252 和 REF-000281 分别覆盖 SUNSPOT 与 PipeMon，本批扩展其 locator 与令牌相关 notes 并复用；T1134 19.1、Windows 令牌/线程赋值/带令牌创建进程/显式父进程/权限调整语义以及 Lotus Blossom、DarkGate 和 4688 仍需新记录 REF-000326 至 REF-000335。未复制既有来源。
  rationale_en: Existing REF-000252 and REF-000281 cover SUNSPOT and PipeMon respectively and are reused after extending locator and token-specific notes. New records REF-000326 through REF-000335 are still required for T1134 19.1, Windows token, thread assignment, token-based process creation, explicit-parent and privilege-adjustment semantics, Lotus Blossom, DarkGate, and Event 4688. No existing source is duplicated.
- library: claims
  decision: create
  rationale_zh: 父级准入、与 SID-History 持久状态的边界、三个正式轴、检测和缓解均需要候选特定的原子结论。
  rationale_en: Parent admission, the boundary with durable SID-History state, all three formal axes, detection, and mitigation require candidate-specific atomic conclusions.
- library: cases
  decision: create
  rationale_zh: 三份原始威胁研究分别观察到另一进程令牌/权限用于启动、PPID 隐匿和同一进程令牌启用 SeDebugPrivilege；它们的事实范围不同，不合并成通用令牌案例。
  rationale_en: Three original threat studies separately observe another-process token or privilege use for launch, PPID concealment, and SeDebugPrivilege enablement in the same process token. Their factual scopes differ and are not collapsed into a generic token case.
- library: detections
  decision: split
  compared_refs: [DET-000064, DET-000083, DET-000095]
  rationale_zh: DET-000064 面向持久身份状态，DET-000083 面向一般 IPC broker，DET-000095 面向提权控制事务；T1134 需要专门连接令牌来源、承载体/创建谱系、权限状态和高权限结果。
  rationale_en: DET-000064 covers durable identity state, DET-000083 general IPC brokers, and DET-000095 elevation-control transactions. T1134 needs a dedicated join across token origin, carrier or creation lineage, privilege state, and privileged outcome.
- library: analytics
  decision: split
  compared_refs: [NJA-000043, NJA-000062, NJA-000072]
  rationale_zh: 既有分析没有线程有效令牌差异、创建者/目标主体/显示父级交叉校验或权限位前后态字段，因此建立三个不可互换的可实施分析。
  rationale_en: Existing analytics lack thread effective-token divergence, cross-validation of creator, target subject, and displayed parent, or privilege-bit before and after state, so three non-interchangeable implementable analytics are created.
- library: mitigations
  decision: split
  compared_refs: [MIT-000063, MIT-000083, MIT-000096]
  rationale_zh: 持久身份、IPC 与提权控制治理都不能独立覆盖 Windows 令牌句柄访问、模拟/替换用户权限、线程有效身份和权限位消费；建立专用令牌权威与谱系治理。
  rationale_en: Durable identity, IPC, and elevation-control governance do not independently cover Windows token-handle access, impersonation or replace-token user rights, thread effective identity, and privilege consumption. A dedicated token-authority and lineage mitigation is needed.
- library: relationships
  decision: defer
  rationale_zh: 与 NJT-0083、NJT-0098、T1055 和 T1068 的边界在决议和正文中已明确；本批没有证据支持新增具有方向和额外语义的 REL。
  rationale_en: Boundaries with NJT-0083, NJT-0098, T1055, and T1068 are explicit in the decision and prose; this batch has no evidence for a new directional REL with additional semantics.
