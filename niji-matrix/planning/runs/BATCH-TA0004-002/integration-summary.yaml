  why_not_more_en: Token origin, primary or impersonation type, impersonation level, API, tool, and privilege name are provenance, capability, or implementation parameters. NJS-0083-002 already owns SID-History's direct durable state, PPID-only tree breaking lacks a TA0004 authority result, and delayed use and minimum privilege sets lack conclusion-level evidence.
  why_not_fewer_zh: 现有线程的 TID 有效身份、新进程的创建权威谱系和同一 token 的权限位前后态具有不同稳定键、痕迹、反例、关联窗口与缓解动作；合并会丢失直接对象和可实施防御边界。
  why_not_fewer_en: TID effective identity in an existing process, new-process creation-authority lineage, and before-and-after privilege bits in one token have distinct stable keys, traces, counterexamples, correlation windows, and mitigations. Merging them would lose direct-object and implementable-defense boundaries.
