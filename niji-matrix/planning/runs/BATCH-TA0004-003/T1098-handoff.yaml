  name: {zh: 账户操纵, en: Account Manipulation}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1098 同时映射到 Persistence 与 Privilege Escalation，并明确说明凭据、权限组或其他既有账户状态变化既可维持访问，也可在新增角色、权限或更高权限 Valid Account 时提升权限。TA0004 因而独立准入。变更的直接对象与 TA0003 NJT-0083 完全相同，只有结果门槛不同：TA0003 要求跨会话可持续访问，TA0004 要求相对 pre-state 的有效权威增量。应扩展复用 NJT-0083，而不是创建重复技术。
      en: ATT&CK Enterprise 19.1 maps T1098 to both Persistence and Privilege Escalation and states that changes to credentials, permission groups, or other existing-account state can maintain access and can elevate it when they grant roles, permissions, or higher-privileged Valid Accounts. T1098 is therefore independently admitted under TA0004. Its direct object is identical to TA0003 NJT-0083, with a different outcome gate: TA0003 requires durable cross-session access, while TA0004 requires an effective-authority increase relative to pre-state. NJT-0083 should be extended and reused rather than duplicated.
