content_extension_plan:
  parent:
  - Add TA0004 to classification while preserving the existing TA0003 decision as canonical origin.
  - Add a bilingual definition paragraph separating durable-access effect from effective-authority delta and requiring pre-state mutation post-state and privileged outcome for TA0004.
  - Extend scope application attacker defender mechanism and limitations with authority-delta semantics without replacing Persistence prose.
  children:
  - {ref: NJS-0083-001, extension: require authentication by the added authenticator into a principal or application with authority exceeding pre-mutation context and distinguish equivalent-access persistence}
  - {ref: NJS-0083-002, extension: require graph-resolved before-to-after effective privilege and first privileged outcome; retain role group delegation and SID-History in one owner}
  - {ref: NJS-0083-003, extension: require device trust or claims to change policy authorization; distinguish mere enrollment persistence}
  defense:
  - Extend DET-000064 to produce separate correlated persistence-use and privilege-escalation-chain outputs.
  - Extend NJA-000043 with pre-state effective authority, post-state authority, authority delta, and first newly authorized outcome; do not create a second analytic for the same state keys.
  - Extend MIT-000063 parent application to state how least mutation authority, bounded scope, entitlement diff, and token refresh prevent or roll back authority gain.
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  confidence: medium
  causal_chain:
    zh: 攻击者先在身份控制面写入认证器、授权边或设备信任，再由既有主体取得 token/会话并完成新获准操作；痕迹被分散为 mutation audit、状态/图求值和后续使用；只看管理事件或只看熟悉主体的资源活动无法恢复 pre-state→变更→authority delta→结果；跨面谱系缺口让提权因果呈现为常规管理与正常账户使用。
    en: The adversary writes an authenticator, authorization edge, or device trust in the identity control plane and later uses the established principal to obtain a token or session and perform a newly authorized action. Traces split across mutation audit, state or graph evaluation, and subsequent use. Observing only administration or only resource activity by a familiar principal cannot reconstruct pre-state to mutation to authority delta to outcome, making elevation appear as routine management plus normal account use.
  evidence_refs: [REF-000143, REF-000110, REF-000145, REF-000146, REF-000147, REF-000168, REF-000169, REF-000170, REF-000171]
- mechanism_ref: NM-FD
  role: secondary
  confidence: medium
  causal_chain:
    zh: 攻击者把额外认证器、角色/组/委托边或设备信任附着到既有主体，同时保留名称、年龄、原凭据与合法活动；后续事件继续显示同一用户/服务主体以及看似合规设备；依赖新账户、密码替换、静态角色或主体风险的分类器无法区分新增权威来源；攻击者借用既有身份与信任特征隐藏 authority delta，残余线索是精确边、旧/新值、设备声明和首次新权限使用。
    en: The adversary attaches an additional authenticator, role or group or delegation edge, or device trust to an established principal while preserving name, age, original credentials, and legitimate activity. Later events continue to show the same user or service principal and possibly a compliant-looking device. Classifiers based on new accounts, password replacement, static roles, or principal risk cannot distinguish the added authority source, allowing established identity and trust features to disguise the authority delta. Exact edges, old and new values, device claims, and first newly privileged use remain residual evidence.
  evidence_refs: [REF-000144, REF-000110, REF-000145, REF-000146, REF-000168, REF-000169, REF-000170, REF-000171]
