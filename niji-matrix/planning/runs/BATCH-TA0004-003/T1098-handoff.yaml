research:
  limitations:
    paragraphs:
    - zh: ATT&CK 与 Microsoft 来源直接支持既有账户状态变化、角色/权限增量、设备信任与监控字段，但大多数公开案例没有提供完整 pre-state entitlement、精确 changed-edge 使用和 post-state privileged outcome 的逐事件序列。因此 TA0004 归类必须在遥测中额外证明 authority delta，不能从任何新凭据、角色或设备登记直接推断提权；NM-BT/NM-FD 的跨平面匿迹结论仍为中等置信度推断，设备绕过用途除外。
      en: ATT&CK and Microsoft sources directly support existing-account state changes, role or permission gain, device trust, and monitoring fields, but most public cases do not expose a complete event-level sequence of pre-state entitlement, exact changed-edge use, and post-state privileged outcome. TA0004 classification must therefore prove authority delta in telemetry rather than infer elevation from every new credential, role, or device registration. Cross-plane NM-BT and NM-FD conclusions remain medium-confidence inference except for documented device-control bypass.
    - zh: 不同 IAM、目录、SaaS、主机与容器平台对 key ID、旧/新值、嵌套图、设备声明和 token 刷新可见性差异很大。精确边不可见时只能作主体级推断；长寿命 token 还会让撤销后权限暂时继续。新建身份、未修改账户使用、全局策略、运行时令牌和临时提权事务仍归相邻 owner。
      en: IAM, directory, SaaS, host, and container platforms differ substantially in key IDs, old and new values, nested graphs, device claims, and token-refresh visibility. Only principal-level inference is possible when exact edges are hidden, and long-lived tokens can preserve authority briefly after revocation. New identities, unmodified-account use, global policy, runtime tokens, and temporary elevation transactions remain with adjacent owners.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [credential lifetime cycling as independent temporal stealth, an account-specific exception not reducible to authenticator or authorization graph]
