review_schema_version: 1.0.0
type: taxonomy-breadth-review
batch_ref: BATCH-TA0004-003
work_item_ref: WORK-TA0004-T1098
attack_baseline: {domain: enterprise-attack, version: '19.1'}
attack_subtechnique_count: 7
attack_subtechnique_ids: [T1098.001, T1098.002, T1098.003, T1098.004, T1098.005, T1098.006, T1098.007]
represented_dimensions:
- credential and authentication-method additions
- mail delegation and application permission edges
- cloud and container roles or policies
- host SSH authenticators
- registered-device and device-trust associations
- local and directory group membership
children:
- attack_id: T1098.001
  name_en: Additional Cloud Credentials
  dimension: additional secret key certificate app-password or temporary cloud credential on an existing cloud identity
  coverage_resolution: niji-variable-candidate
  niji_owner: NJS-0083-001
  ta0004_result_rule: The authenticator must enable the attacker to act as a principal or application whose effective roles permissions or policy bypass exceed the attacker's pre-mutation context.
  rationale_zh: 与 SSH key 一样，稳定直接对象是既有主体上新增且可独立认证的并行认证器；云产品和介质不构成新轴。TA0004 只在该路径取得更高有效权威时成立。
  rationale_en: As with an SSH key, the stable direct object is a newly added parallel authenticator able to establish an existing principal independently. Cloud product and medium do not create a new axis; TA0004 applies only when that path yields higher effective authority.
- attack_id: T1098.002
  name_en: Additional Email Delegate Permissions
  dimension: mailbox delegate or application permission edge
  coverage_resolution: niji-variable-candidate
  niji_owner: NJS-0083-002
  ta0004_result_rule: The new edge must authorize mail or tenant actions unavailable through the attacker's pre-mutation entitlement graph.
  rationale_zh: 委托是授权图中的有向边，其有效权限需从图求值；邮件介质不形成独立 Niji 子技术。
  rationale_en: Delegation is a directed authorization-graph edge whose effective privilege must be resolved from the graph; the mail medium does not form an independent Niji child.
- attack_id: T1098.003
  name_en: Additional Cloud Roles
  dimension: role policy or permission attachment to a cloud principal
  coverage_resolution: niji-variable-candidate
  niji_owner: NJS-0083-002
  ta0004_result_rule: Graph evaluation must show a before-to-after permission increase and a higher-privileged resource outcome.
  rationale_zh: 角色、policy attachment 与资源策略都改变既有主体的授权路径；直接/间接和云厂商只是图参数。
  rationale_en: Roles, policy attachments, and resource policies alter an existing principal's authorization path; directness and cloud vendor are graph parameters.
- attack_id: T1098.004
  name_en: SSH Authorized Keys
  dimension: additional public-key authenticator in an existing account authorization file or service state
  coverage_resolution: niji-variable-candidate
  niji_owner: NJS-0083-001
  ta0004_result_rule: The key must authenticate into an identity whose effective authority exceeds the attacker's prior context rather than merely preserve equivalent access.
  rationale_zh: SSH key 与云证书/secret 共用认证器 stable key、首次使用和逐项撤销语义，不按文件或协议拆分。
  rationale_en: SSH keys share authenticator stable keys, first-use semantics, and per-authenticator revocation with cloud certificates or secrets and are not split by file or protocol.
- attack_id: T1098.005
  name_en: Device Registration
  dimension: attacker-controlled device identity and device trust associated with an existing principal
  coverage_resolution: niji-variable-candidate
  niji_owner: NJS-0083-003
  ta0004_result_rule: Device claims or trust must satisfy a policy condition or bypass that grants access stronger than the attacker's pre-registration context.
  rationale_zh: device ID、注册/加入、PRT/令牌声明、合规与条件访问形成独立状态机；TA0004 要求设备信任改变授权结果。
  rationale_en: Device ID, registration or join, PRT or token claims, compliance, and Conditional Access form an independent state machine. TA0004 requires device trust to change the authorization result.
- attack_id: T1098.006
  name_en: Additional Container Cluster Roles
  dimension: container RBAC role or binding edge
  coverage_resolution: niji-variable-candidate
  niji_owner: NJS-0083-002
  ta0004_result_rule: Resolved cluster authorization must show a new effective permission and privileged API or workload outcome.
  rationale_zh: cluster role/binding 与云角色、组和委托共用授权图语义，不按 container 平台复制。
  rationale_en: Cluster roles and bindings share authorization-graph semantics with cloud roles, groups, and delegation and are not duplicated by container platform.
- attack_id: T1098.007
  name_en: Additional Local or Domain Groups
  dimension: local or directory group membership and inherited authorization
  coverage_resolution: niji-variable-candidate
  niji_owner: NJS-0083-002
  ta0004_result_rule: Nested group expansion or token refresh must demonstrate a higher effective permission and its first privileged use.
  rationale_zh: 本地/域组成员关系是可传递授权边；SID-History 亦按同一直接持久图对象归该 owner，而不是运行时 token 子技术。
  rationale_en: Local or domain group membership is a transitive authorization edge. SID-History belongs to the same direct durable graph object rather than a runtime-token child.
breadth_trigger: explicit-coverage-table-and-second-pass
candidate_stealth_axes_examined:
- axis: parallel-authentication-path-augmentation
  source: within ATT&CK credential and SSH categories
  result: formal
  formal_ref: NJS-0083-001
  reason_zh: 攻击者可控的额外认证器保留原路径与主体外观，改变认证器级痕迹、首次使用归因和恢复动作；TA0004 使用同一变量但增加 authority-delta 结果门槛。
  reason_en: An attacker-controlled additional authenticator preserves the original path and principal appearance and changes authenticator-level traces, first-use attribution, and recovery. TA0004 uses the same variable with an authority-delta outcome gate.
- axis: indirect-authorization-graph-augmentation
  source: within and across ATT&CK mail cloud container group and SID-History categories
  result: formal
  formal_ref: NJS-0083-002
  reason_zh: 角色、组、委托、策略与 SID-History 通过可传递边改变有效权限；图求值与撤销路径和认证器/设备不可互换。
  reason_en: Roles, groups, delegation, policies, and SID-History alter effective privilege through transitive edges; graph evaluation and revocation are non-interchangeable with authenticator or device controls.
- axis: identity-bound-device-trust-attachment
  source: within ATT&CK device registration and outside-category token or policy evaluation
  result: formal
  formal_ref: NJS-0083-003
  reason_zh: 设备身份和信任声明改变条件访问观察与授权结果，且要求独立 device key、资产/MDM 反例和令牌撤销。
  reason_en: Device identity and trust claims alter Conditional Access observation and authorization results and require independent device keys, asset or MDM counterexamples, and token revocation.
- axis: credential-lifetime-cycling
  source: ATT&CK parent outside child categories
  result: deferred
  reason_zh: 迭代密码更新时间可绕过 duration policy，但现有证据没有把它证明为同时改变痕迹、观察与 TA0004 权威结果的独立匿迹轴；寿命保留为认证器参数。
  reason_en: Iterative password timing can evade duration policy, but evidence does not establish an independent stealth axis that changes traces, observation, and a TA0004 authority result; lifetime remains an authenticator parameter.
- axis: account-specific-security-policy-exception
  source: ATT&CK parent and cross-classification search
  result: parent-core
  reason_zh: 单一主体的 MFA bypass、app assignment 或等价例外若形成访问边，归认证器或授权图；影响任意主体的全局认证/租户策略归 T1556/T1484，无法形成第四个稳定 owner。
  reason_en: A per-principal MFA bypass, app assignment, or equivalent exception belongs to authenticator or authorization graph when it creates an access edge. Global authentication or tenant policy affecting arbitrary principals belongs to T1556 or T1484, so no fourth stable owner emerges.
- axis: direct-versus-nested-role-grant
  source: cross-classification graph search
  result: parent-core
  reason_zh: 嵌套深度改变解析成本和匿迹收益，但 stable key、痕迹与缓解仍是同一授权边/有效权限图，不是兄弟子技术。
  reason_en: Nesting depth changes resolution cost and stealth benefit, but stable key, trace, and mitigation remain the same authorization edge and effective-permission graph rather than a sibling child.
- axis: immediate-versus-delayed-first-use
  source: outside ATT&CK classification temporal search
  result: parent-core
  reason_zh: 延迟改变 correlation window，不改变攻击者写入的直接状态对象或三类防御路径；无证据支持独立时间子项。
  reason_en: Delay changes the correlation window but not the direct state object written or the three defense paths, and evidence does not support an independent temporal child.
- axis: legitimate-owner-displacement
  source: outside ATT&CK classification identity lifecycle search
  result: adjacent
  reason_zh: 删除合法认证器或撤销所有者访问可能属于账户访问移除/Impact；本技术的匿迹变量是新增状态和后续使用，不以是否排斥所有者拆分。
  reason_en: Removing legitimate authenticators or owner access can belong to Account Access Removal or Impact. This technique's stealth variable is added state and subsequent use, not whether the owner is displaced.
- axis: platform-product-medium-partition
  source: rejected mechanical taxonomy
  result: rejected
  reason_zh: 云、邮件、SSH、容器、目录、角色名、日志字段和产品没有独立稳定匿迹边界，按此拆分会导入 ATT&CK 实现分类。
  reason_en: Cloud, mail, SSH, container, directory, role name, log field, and product do not create stable independent stealth boundaries; splitting them would import ATT&CK implementation taxonomy.
second_pass_required: true
second_pass_completed: true
second_pass_search_spaces: [per-principal policy exceptions, authorization nesting, immediate versus delayed use, owner displacement, device-claim authorization, SID-History ownership]
