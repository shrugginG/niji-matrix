breadth_gap_explained: true
why_not_more:
  zh: 所有七项 ATT&CK 实现和第二轮候选均被既有认证器、授权图、设备信任 owner 覆盖，或属于参数、相邻技术、deferred/rejected；没有证据支持第四个可控且防御独立的匿迹变量。
  en: All seven ATT&CK implementations and second-pass candidates are covered by existing authenticator, authorization-graph, or device-trust owners or are parameters, adjacent, deferred, or rejected. Evidence supports no fourth controllable stealth variable with an independent defense.
why_not_fewer:
  zh: 三项需要 authenticator/key、authorization edge/graph 与 device ID/claim 三类不同 stable key，分别连接认证、资源授权与条件访问，并具有不同反例和撤销动作；合并会破坏可执行检测与恢复。
  en: The three require distinct authenticator or key, authorization edge or graph, and device ID or claim stable keys, joined respectively to authentication, resource authorization, and Conditional Access with different counterexamples and revocation. Merging would break implementable detection and recovery.
retires_or_changes_existing_taxonomy: false
