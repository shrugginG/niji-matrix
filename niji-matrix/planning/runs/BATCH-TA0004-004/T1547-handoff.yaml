content_extension_plan:
  parent:
  - Add TA0004 to classification while preserving DEC-TA0003-T1547 as canonical origin.
  - Add paired paragraphs to definition, scope, scenarios, attacker/defender models, mechanisms, taxonomy, and limitations that distinguish lifecycle restoration from authority gain.
  - Require writer or pre-state authority, lifecycle consumer execution context, effective authority delta, and first newly authorized privileged outcome.
  children:
  - {ref: NJS-0084-001, extension: preserve descriptor-theme variable and require privileged activation outcome for TA0004 without claiming the cited user-level cases achieved elevation}
  - {ref: NJS-0084-002, extension: preserve same-object target continuity and compare old target or writer context with new target execution authority and privileged result}
  - {ref: NJS-0084-003, extension: preserve prior-session restoration causality and require evidence that restoration crossed an authority boundary rather than merely reopened user-context code}
  defense:
  - Extend DET-000065 with separate persistence-restoration and privilege-escalation-chain outputs.
  - Extend NJA-000044 with writer/pre-state authority, lifecycle consumer identity and token context, effective authority delta, and first newly authorized outcome.
  - Extend MIT-000064 with a writer-to-consumer authority gate and full rollback of descriptor, target, tokens or sessions, and privileged effects.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  confidence: medium
  causal_chain:
    zh: 攻击者先写入持久映射，随后退出或等待；状态写入与高权限激活跨登录/重启和进程分离；短窗口只看到低权限 writer 或后来的 privileged process，无法连接 authority delta；提权因果被稀释为旧配置与正常生命周期执行。描述符、boot/logon ID、consumer token 与结果仍可恢复链。
    en: The adversary writes a durable mapping and then exits or waits. State mutation and privileged activation separate across logon or reboot and processes. A short window sees either a lower-authority writer or the later privileged process and cannot connect the authority delta, diluting elevation causality into old configuration plus normal lifecycle execution. Descriptor, boot or logon ID, consumer token, and outcome can still recover the chain.
  evidence_refs: [REF-000148, REF-000149, REF-000153]
- mechanism_ref: NM-BT
  role: secondary
  confidence: medium
  causal_chain:
    zh: 启动管理器、shell、Winlogon、LSA、spooler 或其他注册宿主读取映射并创建进程/加载模块；进程侧显示正常且可能高权限的系统 consumer，原 writer 只在早先配置审计中；只审当前父子关系会把执行归因给系统宿主而遗漏攻击者控制的 descriptor；攻击者借 brokered provenance 隐藏提权来源。完整 writer—descriptor—consumer—token—outcome 谱系仍是反制键。
    en: A startup manager, shell, Winlogon, LSA, spooler, or another registered host reads the mapping and creates a process or loads a module. Process telemetry shows a normal and possibly privileged system consumer while the original writer exists only in earlier configuration audit. Reviewing only current parent-child lineage attributes execution to the system host and misses the adversary-controlled descriptor, letting brokered provenance conceal the elevation source. Complete writer-to-descriptor-to-consumer-to-token-to-outcome lineage remains the counter-key.
  evidence_refs: [REF-000148, REF-000150, REF-000153]
- mechanism_ref: NM-FD
  role: secondary
  confidence: medium
  causal_chain:
    zh: 攻击者选择更新或浏览器主题描述符并指向不一致目标；名称与大量合法维护项相似，而实际 consumer 权限和目标行为位于另一遥测层；依赖标签、目录或受信宿主的分类器既难区分恶意映射，也难识别 authority delta；主题借用与高权限系统来源共同降低观察区分。发布者、包、路径、签名、token 与新获准结果仍可揭示冲突。
    en: The adversary selects an update- or browser-themed descriptor that resolves to an inconsistent target. Its name resembles many legitimate maintenance entries while actual consumer authority and target behavior reside in another telemetry layer. Classifiers based on labels, directories, or trusted hosts struggle both to distinguish the malicious mapping and to identify authority delta, so borrowed theme plus privileged system provenance lowers discrimination. Publisher, package, path, signature, token, and newly authorized outcome still reveal conflict.
  evidence_refs: [REF-000151, REF-000152, REF-000148]
