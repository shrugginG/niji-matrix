research:
  limitations:
    paragraphs:
    - zh: ATT&CK 父页直接支持 TA0004 映射和“某些自启动以更高权限运行”的条件，但既有公开案例主要证明 Persistence 和匿迹变量，没有完整展示低权限 writer、特定 descriptor、高权限 consumer token 与首个新获准操作的逐事件序列。因此 TA0004 结果必须由本地遥测证明，三个 Niji 子项的匿迹效果继续保持 medium，不能从高权限位置、系统父体或更新主题名称直接推断提权。
      en: The ATT&CK parent directly supports TA0004 mapping and the condition that some autostarts run with higher privileges, but existing public cases primarily establish persistence and evasion variables and do not expose a complete event sequence from lower-authority writer through a specific descriptor and privileged consumer token to the first newly authorized operation. TA0004 outcome must therefore be proven in local telemetry. Evasion confidence for all three Niji children remains medium, and elevation cannot be inferred from privileged location, system parent, or update-themed name alone.
    - zh: 十四项实现的写权限、加载主体和 token 可见性跨平台差异很大；内核、LSA 或早期启动路径可能在传感器之前发生，普通用户恢复队列通常没有权限增量。精确 consumer token 或 pre-state 权限不可得时只能输出未批准自启动或 Persistence 链；加载劫持、服务、初始化脚本和调度仍归相邻对象。
      en: Write permission, loading principal, and token visibility differ widely across the fourteen implementations and platforms. Kernel, LSA, or early-boot paths may precede sensors, while ordinary user restoration queues usually provide no authority gain. Without exact consumer token or pre-state authority, output is limited to unapproved autostart or a Persistence chain. Load hijacking, services, initialization scripts, and scheduling remain with neighboring objects.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [early-boot pre-sensor placement as an independently attacker-controlled evasion variable]
