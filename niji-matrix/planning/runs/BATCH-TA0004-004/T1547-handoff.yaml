candidate:
  source_type: attack
  source_attack_id: T1547
  name: {zh: 启动或登录自启动执行, en: Boot or Logon Autostart Execution}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1547 同时映射到 Persistence 与 Privilege Escalation，明确说明某些启动或登录自启动程序以更高权限运行，攻击者可利用它们提权。T1547 因而在 TA0004 下独立准入，但不能把任意自启动等同提权：必须证明同一持久映射被生命周期消费者激活后，目标执行上下文相对 writer 或 pre-state 增加有效权限，并完成至少一个此前未获准的结果。
      en: ATT&CK Enterprise 19.1 maps T1547 to both Persistence and Privilege Escalation and explicitly states that some boot or logon autostart programs run with higher privileges that an adversary can leverage. T1547 is therefore independently admitted under TA0004, but not every autostart is elevation. The same durable mapping must be shown to activate a target whose effective execution authority exceeds the writer or pre-state and to produce at least one previously unauthorized outcome.
    - zh: 直接对象仍是 NJT-0084 已建模的启动/登录生命周期激活映射；TA0003 与 TA0004 只在结果门不同。创建第二个 NJT 会复制 descriptor、target、scope 与 lifecycle stable key，所以应扩展复用 NJT-0084、三个 NJS 以及 DET-000065/NJA-000044/MIT-000064，并由 DEC-TA0004-T1547 表达独立战术决议。
      en: The direct object remains the boot or logon lifecycle activation mapping already modeled by NJT-0084; TA0003 and TA0004 differ only in the outcome gate. A second NJT would duplicate descriptor, target, scope, and lifecycle stable keys, so NJT-0084, its three NJS objects, and DET-000065, NJA-000044, and MIT-000064 should be extended and reused, with DEC-TA0004-T1547 expressing the independent tactic decision.
