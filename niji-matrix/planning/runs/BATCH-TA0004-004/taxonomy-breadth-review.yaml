breadth_gap_explained: true
why_not_more:
  zh: 十四项 ATT&CK 实现逐项归入父级映射或两个已有正式轴，第二轮又确认第三个外部 taxonomy 轴；权限分离、作用域和 broker provenance 是父级条件，early-boot 保持 deferred，加载劫持 adjacent，平台/介质拆分 rejected。没有第四个同时改变 stable trace、观察结果和独立防御的变量。
  en: All fourteen ATT&CK implementations resolve to the parent mapping or two existing formal axes, while the second pass confirms the third axis discovered outside ATT&CK taxonomy. Authority separation, scope, and broker provenance are parent conditions; early boot remains deferred, load hijacking is adjacent, and platform or medium splits are rejected. No fourth variable changes stable trace, observation outcome, and independent defense together.
why_not_fewer:
  zh: descriptor theme、同对象 old/new target 与 restoration item/prior session 使用三套不同 stable key，分别改变特征一致性、对象连续性和因果来源；其反例、关联逻辑和恢复动作不同。合并会丢失名称—软件验证、可信基线恢复或会话队列来源。
  en: Descriptor theme, same-object old and new target, and restoration item or prior session use three different stable keys and respectively change feature consistency, object continuity, and causal provenance. Their counterexamples, joins, and recovery actions differ. Merging would lose name-to-software validation, trusted-baseline restoration, or restoration-queue provenance.

