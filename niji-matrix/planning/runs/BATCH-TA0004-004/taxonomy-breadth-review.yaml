breadth_trigger: complex-single-candidate-explicit-coverage-and-second-pass
coverage_resolutions:
- attack_refs: [T1547.001]
  resolution: parent-core
  rationale_zh: Run、RunOnce 与启动目录是生命周期目标映射的典型实现；用户/机器范围和注册表/文件介质只改变权限与消费条件。新描述符采用更新主题时可落入 NJS-0084-001，可信同对象目标被替换时可落入 NJS-0084-002，但 ATT&CK 项本身不是子技术 owner。
  rationale_en: Run, RunOnce, and Startup folders are representative lifecycle target mappings; user or machine scope and registry or file medium change permission and consumption conditions only. An update-themed new descriptor can qualify for NJS-0084-001 and trusted same-object target substitution for NJS-0084-002, but the ATT&CK item itself is not a child owner.
- attack_refs: [T1547.002, T1547.003, T1547.004, T1547.005, T1547.006, T1547.008, T1547.010, T1547.012, T1547.014, T1547.015]
  resolution: parent-core
  rationale_zh: 这些项按认证、时间、登录、内核、LSASS、打印或平台组件注册划分；共同直接对象仍是持久描述符被启动/登录消费者加载。consumer 权限可能使 TA0004 成立，但 privileged host、组件类型或位置不改变 stable stealth key，也没有形成独立检测/缓解 owner。
  rationale_en: These items partition authentication, time, logon, kernel, LSASS, print, or platform component registrations. Their direct object remains a durable descriptor loaded by a boot or logon consumer. Consumer authority can satisfy TA0004, but privileged host, component type, or location does not change the stable stealth key or create a separate detection and mitigation owner.
- attack_refs: [T1547.013]
  resolution: parent-core
  rationale_zh: XDG desktop 项提供另一平台的描述符实现；system-wide 与 per-user 作用域会改变写权限和执行主体，但只是父级参数。只有出现既有对象目标连续性或主题—真实目标不一致时才进入相应 Niji 轴。
  rationale_en: XDG desktop entries provide another platform implementation of the descriptor. System-wide versus per-user scope changes write authority and execution principal but remains a parent parameter. Only established-object target continuity or theme-to-target inconsistency can qualify for a corresponding Niji axis.
- attack_refs: [T1547.007]
  resolution: niji-variable-candidate
  final_resolution: formal
  child_ref: NJS-0084-003
  rationale_zh: 会话恢复队列以 prior session 和 restoration item 为 stable key，把原因放在用户体验状态而不是普通静态启动项中；它需要独立的前序活动、用户选择、队列差异和下次登录关联。TA0004 仍额外要求恢复结果比 pre-state 具有更高有效权限。
  rationale_en: A session-restoration queue uses prior session and restoration item as stable keys and places causality in user-experience state rather than an ordinary static startup item. It needs distinct prior-activity, user-choice, queue-difference, and next-logon joins. TA0004 additionally requires the restored outcome to have greater effective authority than pre-state.
- attack_refs: [T1547.009]
  resolution: niji-variable-candidate
  final_resolution: formal
  child_ref: NJS-0084-002
  rationale_zh: 修改既有快捷方式直接支持描述符身份连续而真实目标/参数变化的稳定变量；可信 old/new 与后继激活形成不同于新建条目的检测和恢复。TA0004 是否成立取决于执行权限增量，而不是快捷方式名称。
  rationale_en: Modification of an existing shortcut directly supports the stable variable of continuous descriptor identity with changed actual target or arguments. Trusted old and new state plus later activation require detection and recovery distinct from a new entry. TA0004 depends on execution-authority gain, not shortcut naming.
candidate_stealth_axes_examined:
- axis: update-themed-autostart-descriptor-camouflage
  discovery_source: outside-ATT&CK-taxonomy
  final_resolution: formal
  child_ref: NJS-0084-001
  reason_zh: 攻击者控制 descriptor theme，名称—发布者—包—真实目标不一致会改变特征并需要软件归属验证；TA0004 使用仍以高权限 activation result 为附加门槛。
  reason_en: The adversary controls descriptor theme; name-to-publisher-to-package-to-target inconsistency changes features and requires software-ownership validation. TA0004 use still has privileged activation outcome as an additional gate.
- axis: established-autostart-descriptor-target-substitution
  discovery_source: ATT&CK-T1547.009-and-cross-category-object-continuity
  final_resolution: formal
  child_ref: NJS-0084-002
  reason_zh: stable descriptor 不变而 target/arguments 改变，降低依赖“既有条目可信”的区分并要求 old/new 恢复。
  reason_en: A stable descriptor persists while target or arguments change, weakening classification that trusts established entries and requiring old/new recovery.
- axis: session-restoration-queue-injection
  discovery_source: ATT&CK-T1547.007-and-user-experience-state
  final_resolution: formal
  child_ref: NJS-0084-003
  reason_zh: 攻击者控制恢复队列项，使启动原因被解释为前序会话恢复；防守必须连接 prior activity、choice、queue 与 next logon。
  reason_en: The adversary controls a restoration item so execution is interpreted as prior-session recovery; defense must join prior activity, choice, queue, and next logon.
- axis: writer-to-lifecycle-consumer-authority-separation
  discovery_source: cross-tactic-TA0003-to-TA0004
  final_resolution: parent-core
  reason_zh: writer/pre-state 与 lifecycle consumer/result 的权限差是所有实现进入 TA0004 的统一结果门；它不改变描述符 stable key，也不与三个 sibling 形成互斥边界，单列会把战术条件误作子技术。
  reason_en: Authority separation between writer or pre-state and lifecycle consumer or result is the shared outcome gate for every implementation entering TA0004. It changes neither descriptor stable key nor mutually exclusive sibling boundaries, so a child would mistake a tactic condition for taxonomy.
- axis: system-scope-versus-user-scope
  discovery_source: cross-platform-configuration-scope
  final_resolution: parent-core
  reason_zh: 作用域改变写权限、consumer 主体和潜在 authority delta，但没有稳定匿迹机理或独立防御 owner；同一描述符轴可跨两种范围。
  reason_en: Scope changes write permission, consumer principal, and possible authority delta but provides no stable evasion mechanism or separate defense owner; the same descriptor axes span both scopes.
- axis: system-brokered-provenance
  discovery_source: cross-category-lifecycle-consumers
  final_resolution: parent-core
  reason_zh: 正常启动宿主割裂 writer 与后继执行来源，构成父级 NM-BT 因果链；所有子项共享，不能再按 winlogon、LSA、spooler、shell 或 launchd 拆分。
  reason_en: A normal lifecycle host separates writer from successor provenance and forms the parent NM-BT chain. All children share it, so it cannot be split again by Winlogon, LSA, spooler, shell, or launchd.
- axis: early-boot-pre-sensor-placement
  discovery_source: cross-category-temporal-observation
  final_resolution: deferred
  reason_zh: 传感器晚于内核或早期组件上线会造成 blind spot，但当前证据没有稳定证明攻击者对 sensor start 顺序的可控选择以及相对 sibling 的独立检测收益。
  reason_en: Sensor startup after kernel or early components creates a blind spot, but current evidence does not stably prove adversary control over sensor ordering or detection benefit independent of sibling variables.
- axis: trusted-component-loading
  discovery_source: cross-category-load-chain
  final_resolution: adjacent
  reason_zh: 如果攻击者只改变 DLL、模块搜索或加载解析而 autostart descriptor 未变，直接对象属于 T1574；若描述符也改变，可并列记录但不能把加载劫持吸收为 T1547 子项。
  reason_en: If only DLL, module-search, or load resolution changes while the autostart descriptor stays intact, the direct object belongs to T1574. Both may be recorded when the descriptor also changes, but load hijacking is not absorbed as a T1547 child.
- axis: platform-component-medium
  discovery_source: ATT&CK-internal
  final_resolution: rejected
  reason_zh: 按平台、注册表/文件、组件、driver/provider 类型或日志字段拆分只会机械复制 ATT&CK 实现分类，不能证明不同的可控匿迹变量。
  reason_en: Splitting by platform, registry or file medium, component, driver or provider type, or log field mechanically reproduces ATT&CK implementation categories without a distinct controllable evasion variable.
second_pass_required: true
