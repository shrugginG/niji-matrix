research:
  limitations:
    paragraphs:
    - zh: ATT&CK 父页直接支持 TA0004 映射和“某些脚本以更高权限运行”的可能性，Microsoft 文档直接说明 GPO startup script 以 Local System 运行；但现有公开事件没有完整给出较低权限 writer、具体脚本版本、高权限 interpreter token 与首个新获准操作的逐事件链。两项 Niji 子技术的匿迹机理继续为 medium，TA0004 结果必须由环境遥测证明。
      en: The ATT&CK parent directly supports TA0004 mapping and the possibility that some scripts run with higher privileges, and Microsoft directly documents Group Policy startup scripts running as Local System. Existing public incidents, however, do not provide a complete event chain from lower-authority writer through a specific script version and privileged interpreter token to the first newly authorized operation. Evasion mechanisms for both Niji children remain medium, and local telemetry must prove the TA0004 outcome.
    - zh: 五项实现的正常权限关系并不一致：网络登录脚本通常按被分配用户运行，RC 脚本通常要求 root 修改，Login Hook 创建本身要求管理员权限。没有 writer/pre-state 与实际 consumer/result 对照时只能确认脚本异常或 Persistence；中央多端扇出、root 父进程、系统路径和启动阶段都不能单独替代权限增量证明。
      en: Normal authority relationships differ across the five implementations. Network logon scripts commonly run as their assigned user, RC scripts commonly require root to modify, and creating a Login Hook itself requires administrator authority. Without comparison of writer or pre-state to actual consumer and result, only a script anomaly or Persistence can be confirmed. Central fan-out, a root parent, a system path, or boot timing alone cannot substitute for proof of authority gain.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [early-boot pre-sensor execution, conditional host or user branches, script path or name mimicry beyond inline identity]
