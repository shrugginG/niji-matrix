content_extension_plan:
  parent:
  - Add TA0004 to classification while preserving DEC-TA0003-T1037 as canonical origin.
  - Add paired paragraphs to all required fields, mechanism analyses, taxonomy, and limitations defining the authority-result gate and its negative cases.
  - Require writer or pre-state authority, actual interpreter token or security context, effective-authority delta, and first newly authorized outcome.
  children:
  - {ref: NJS-0085-001, extension: retain line-level established-content identity and require the executed changed line to cross an authority boundary; existing appliance incidents support inline persistence but not elevation}
  - {ref: NJS-0085-002, extension: retain central version-to-multiple-client topology and evaluate authority delta per client; network logon scripts commonly run with assigned-user privileges and fan-out alone is not elevation}
  defense:
  - Extend DET-000066 with distinct restored-execution and privilege-escalation-chain outputs.
  - Extend NJA-000045 with writer/pre-state authority, interpreter context, delta comparison, and first privileged outcome at each endpoint.
  - Extend MIT-000065 with explicit separation of script writer and privileged interpreter authority and rollback of resulting privileged effects.
stealth_mechanisms:
- mechanism_ref: NM-ST
  role: primary
  confidence: medium
  causal_chain:
    zh: 攻击者先改变持久脚本内容并离开，脚本在以后启动或登录才由高权限 interpreter 消费；写入、静置、权限转换和结果跨会话/重启分离；短窗口只见较早 writer 或后来的正常 privileged interpreter，无法计算 authority delta；提权链因而被稀释为旧文本变化和正常初始化。content version、boot/logon ID、token 与结果仍可恢复因果。
    en: The attacker changes durable script content and leaves before a later boot or logon consumes it under a privileged interpreter. Mutation, dormancy, authority transition, and outcome separate across sessions or reboots. A short window sees only the earlier writer or later normal privileged interpreter and cannot calculate authority delta, diluting the elevation chain into an old text change plus normal initialization. Content version, boot or logon ID, token, and outcome can still recover causality.
  evidence_refs: [REF-000154, REF-000157, REF-000176]
- mechanism_ref: NM-BT
  role: secondary
  confidence: medium
  causal_chain:
    zh: init、登录宿主或 GPO 客户端以自己的身份解释内容并创建子进程；执行侧来源显示正常系统或登录 consumer，原 writer 只在早先文件、配置或控制面审计中；只看当前进程谱系会把新获准操作归因给 trusted lifecycle host；brokered provenance 隐藏攻击者控制的脚本与权限转换。writer—version—consumer—token—outcome 关联仍可揭示。
    en: Init, a logon host, or a GPO client interprets content under its own identity and creates children. Execution provenance shows a normal system or logon consumer while the original writer remains in earlier file, configuration, or control-plane audit. Current process lineage alone attributes the newly authorized operation to a trusted lifecycle host, so brokered provenance hides adversary-controlled script and authority transition. A writer-to-version-to-consumer-to-token-to-outcome join can still reveal it.
  evidence_refs: [REF-000154, REF-000157, REF-000176]
- mechanism_ref: NM-FD
  role: secondary
  confidence: medium
  causal_chain:
    zh: 攻击者把少量命令放入既有合法脚本，保留路径、所有者与大部分正文；清单和信誉规则看不到新对象，而实际权限效果只在以后 interpreter token 与子进程结果中出现；内容身份借用与跨层权限信息使恶意行更难从正常初始化区分，形成特征伪装。逐行 diff、writer 与实际执行行仍能反制。
    en: The attacker places a small command difference in an established legitimate script while preserving path, owner, and most body. Inventory and reputation rules see no new object, while the authority effect appears only later in interpreter token and child outcome. Borrowed content identity plus cross-layer authority information makes the malicious line harder to distinguish from normal initialization, producing Feature Disguise. Line-level difference, writer, and actual executed line remain counter-keys.
  evidence_refs: [REF-000154, REF-000155, REF-000156, REF-000157]
