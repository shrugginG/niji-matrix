candidate:
  source_type: attack
  source_attack_id: T1037
  name: {zh: 启动或登录初始化脚本, en: Boot or Logon Initialization Scripts}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1037 映射到 Persistence 与 Privilege Escalation，并明确限定只有“某些”初始化脚本因以更高权限运行而可能提权。因此 T1037 在 TA0004 下独立准入，但只有攻击者控制的脚本内容或专用 hook 可由低于结果的 writer/pre-state 影响，随后被更高权限生命周期 interpreter 消费并完成首个新获准操作时，才能确认提权；同用户登录脚本、必须 root 写且以 root 执行的 RC 脚本或仅有高权限父进程均不足。
      en: ATT&CK Enterprise 19.1 maps T1037 to both Persistence and Privilege Escalation while expressly limiting elevation to some initialization scripts that run with higher privileges. T1037 is therefore independently admitted under TA0004, but elevation is confirmed only when adversary-controlled script content or a script-specific hook is influenceable by a writer or pre-state below the result, is later consumed by a higher-authority lifecycle interpreter, and completes the first newly authorized operation. A same-user logon script, an RC script that requires root to write and runs as root, or a privileged parent process alone is insufficient.
    - zh: 直接对象仍是 NJT-0085 已建模的生命周期脚本内容；TA0003 与 TA0004 的差别是恢复结果和权限增量结果，而不是脚本 stable key。复制 NJT 会产生同一 script path、content version、writer、boot/logon 和 interpreter 键，所以应扩展复用 NJT-0085、两项现有 NJS 与 DET-000066/NJA-000045/MIT-000065，并新建独立 DEC-TA0004-T1037。
      en: The direct object remains the lifecycle script content already modeled by NJT-0085. TA0003 and TA0004 differ in restored-execution versus authority-gain outcome, not in script stable keys. Duplicating the NJT would repeat script path, content version, writer, boot or logon, and interpreter keys, so NJT-0085, its two NJS objects, and DET-000066, NJA-000045, and MIT-000065 should be extended and reused with a new independent DEC-TA0004-T1037.
