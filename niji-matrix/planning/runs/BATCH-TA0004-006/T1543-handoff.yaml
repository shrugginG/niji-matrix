research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定父页直接支持 TA0004 映射和 administrator-created service 以 root/SYSTEM 执行的可能性；Microsoft 文档直接支持 SERVICE_CHANGE_CONFIG、对象 DACL、静默枚举遗漏与 LocalSystem 权限。但公开来源未提供一条跨平台、逐事件完整的 lower writer—definition version—manager token—first newly authorized outcome 链，因此 TA0004 成功必须由本地遥测证明，机理保持 medium。
      en: The fixed ATT&CK parent directly supports TA0004 mapping and the possibility that an administrator-created service runs as root or SYSTEM. Microsoft documentation directly supports SERVICE_CHANGE_CONFIG, object DACLs, silent enumeration omission, and LocalSystem authority. Public sources do not provide one complete cross-platform per-event chain from lower-authority writer through definition version and manager token to the first newly authorized outcome, so local telemetry must prove TA0004 success and mechanism confidence remains medium.
    - zh: 不同实现的正常权限关系不一致；修改 system service、LaunchDaemon 或 service DACL 常已需 root/admin，而 user unit、Launch Agent 与 rootless container 可能保持同权限或仅扩大持久性。没有 pre/post 授权集合和结果对照时只能确认服务异常或 Persistence；root/SYSTEM 字符串、容器 service、受信 manager 或重启执行均不是权限增量。
      en: Normal authority relationships differ across implementations. Changing a system service, LaunchDaemon, or service DACL often already requires root or administrator authority, while a user unit, Launch Agent, or rootless container can preserve the same authority and only increase durability. Without before-and-after authorization sets and an outcome comparison, only a service anomaly or Persistence can be confirmed. A root or SYSTEM string, container service, trusted manager, or reboot execution is not an authority gain.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [distributed desired-state fanout as a stealth-distinct child]
