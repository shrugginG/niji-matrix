candidate:
  source_type: attack
  source_attack_id: T1543
  name: {zh: 创建或修改系统进程, en: Create or Modify System Process}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1543 映射到 Privilege Escalation，并明确说明服务可由 administrator 创建而以 root/SYSTEM 运行。T1543 因此在 TA0004 下独立准入，但只有较低权限 writer 或 pre-state 能影响攻击者控制的精确 service definition，manager 随后以更高有效权限执行该版本并产生首个新获准操作时才确认提权；root/SYSTEM 名称、服务创建或高权限父进程均不能单独满足结果门。
      en: ATT&CK Enterprise 19.1 maps T1543 to Privilege Escalation and states that a service can be created with administrator authority and run as root or SYSTEM. T1543 is therefore independently admitted under TA0004, but elevation is confirmed only when a lower-authority writer or pre-state can influence the exact adversary-controlled service definition, the manager later executes that version with greater effective authority, and it produces the first newly authorized operation. A root or SYSTEM label, service creation, or privileged parent process alone cannot satisfy the outcome gate.
    - zh: 直接对象仍是 NJT-0089 的持久 service definition。TA0003 的恢复结果与 TA0004 的权限增量结果共享 object ID、definition version、writer、manager transaction、execution account/token 和进程键，因此扩展复用 NJT-0089、两项既有 NJS 与 DET-000063/NJA-000041/MIT-000060，并新建独立 DEC-TA0004-T1543；不复制技术或按 ATT&CK 子项导入。
      en: The direct object remains NJT-0089's durable service definition. TA0003 restoration and TA0004 authority gain share object ID, definition version, writer, manager transaction, execution account or token, and process keys. NJT-0089, its two existing NJS objects, and DET-000063, NJA-000041, and MIT-000060 should therefore be extended and reused with an independent DEC-TA0004-T1543 rather than duplicating a technique or importing ATT&CK children.
