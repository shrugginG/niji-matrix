content_extension_plan:
  parent:
  - Add TA0004 and paired candidate-specific paragraphs to all required fields while preserving the durable service-definition direct object and canonical TA0003 origin decision.
  - Add a strict writer or pre-state to exact definition version to manager execution context to positive effective-authority difference to first newly authorized outcome chain.
  - Add lifecycle time separation as a parent NM-ST mechanism without creating a timing child.
  children:
  - {ref: NJS-0089-001, extension: preserve the established-object identity-to-target difference and require the substituted version to cross an authority boundary; Blue Mockingbird supports identity borrowing but not the elevation outcome}
  - {ref: NJS-0089-002, extension: preserve the cross-principal enumeration differential and require a hidden definition to cause a positive authority result; service DACL modification may already require high authority and cannot itself prove elevation}
  defense:
  - Extend DET-000063 with separate durable-definition anomaly, Persistence restoration, and proven Privilege Escalation outputs.
  - Extend NJA-000041 with writer and pre-state authority, actual execution token or security context, before and after authorization sets, authority difference, and first newly authorized operation.
  - Extend MIT-000060 with a service-writer-to-runtime-account boundary measure and target-specific rollback of privileged results.
stealth_mechanisms:
- mechanism_ref: NM-FD
  role: primary
  confidence: medium
  causal_chain:
    zh: 攻击者保留同一 service ID、名称、manager、账户与启动条件，只替换 ImagePath/Exec/解析目标；definition diff 是局部变化而执行侧继续显示受信 manager 和既有身份；名称、账户或父进程规则不能区分被替换版本；恶意执行及其权限结果因此借用成熟服务特征。old/new definition、writer、解析目标、token 与结果仍可恢复链。
    en: The attacker preserves the same service ID, name, manager, account, and start condition while substituting ImagePath, Exec, or the resolved target. The definition difference is local while execution still shows a trusted manager and established identity. Name, account, or parent rules cannot distinguish the substituted version, allowing malicious execution and its authority result to borrow mature service features. Old and new definition, writer, resolved target, token, and outcome can recover the chain.
  evidence_refs: [REF-000182, REF-000291]
- mechanism_ref: NM-BT
  role: secondary
  confidence: medium
  causal_chain:
    zh: 攻击者改变同一 service object 的查询权限，使普通 EnumServicesStatusEx 或管理界面静默遗漏对象，而 SCM 仍读取定义并创建进程；默认 inventory 不把关键 service state 交给检测，执行侧又只见正常 manager；definition 和权限转换落在默认观察路径之外，形成行为透明。高权限 raw state、ACL old/new、writer 与进程结果仍可揭示。
    en: The attacker changes query rights on the same service object so ordinary EnumServicesStatusEx or management views silently omit it while SCM still reads the definition and creates a process. Default inventory does not deliver critical service state to detection and execution shows only a normal manager, moving definition and authority transition outside the default observation path and producing Behavioral Transparency. Privileged raw state, ACL old and new, writer, and process outcome can still expose it.
  evidence_refs: [B4-006-T1543-REF-01]
- mechanism_ref: NM-ST
  role: secondary
  confidence: medium
  causal_chain:
    zh: 攻击者先改变可持久保存的 service definition，再等待启动、重启、失败恢复或期望状态调和由 manager 消费；writer、definition mutation、权限转换和结果跨时间或会话分离；短窗口只看见较早配置变化或后来的正常高权限 service launch，无法连接权限差；提权链被稀释为旧配置和例行生命周期执行。object/version、manager transaction、token 与 outcome 仍可连接。
    en: The attacker changes a durable service definition and waits for a start, reboot, failure recovery, or desired-state reconciliation to make the manager consume it. Writer, definition mutation, authority transition, and outcome separate across time or sessions. A short window sees only an earlier configuration change or a later normal privileged service launch and cannot connect the authority difference, diluting the elevation chain into old configuration plus routine lifecycle execution. Object and version, manager transaction, token, and outcome can still join it.
  evidence_refs: [REF-000182, B4-006-T1543-REF-02]
