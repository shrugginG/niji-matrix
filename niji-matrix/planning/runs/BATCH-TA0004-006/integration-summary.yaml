  breadth_gap_explanation_zh: 五项实现已分别归父级或两个既有 Niji 轴。开放搜索还覆盖新服务命名、目标/参数、运行账户、延迟激活、分布式扇出、瞬时服务、目标正文/加载、权限前提和平台介质。目标替换在保留既有对象时由 NJS-0089-001 拥有，枚举权限差由 NJS-0089-002 拥有；权限结果和延迟为 parent-core，命名/瞬时执行/内容加载/权限修改 adjacent，扇出 deferred，平台介质 rejected。两项 formal 使用不同 stable key、痕迹、观察和恢复动作，不能减少；没有第三个防御独立且证据成熟的变量，不能增加。
  breadth_gap_explanation_en: The five implementations resolve to parent scope or the two existing Niji axes. Open search also covered new-service naming, target or arguments, runtime account, delayed activation, distributed fan-out, transient service use, target content or loading, access preconditions, and platform or medium. Target substitution under an established object belongs to NJS-0089-001 and enumeration-permission difference to NJS-0089-002. Authority outcome and delay are parent-level; naming, transient execution, content or loading, and permission modification are adjacent; fan-out is deferred; and platform or medium is rejected. The two formal axes use different stable keys, traces, observations, and recovery actions and cannot be reduced. No third defense-independent variable has mature evidence, so they cannot be increased.
