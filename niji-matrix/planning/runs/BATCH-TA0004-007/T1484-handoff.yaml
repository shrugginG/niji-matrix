research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定父页明确支持临时修改、执行动作并回退，但未列出一个含完整恶意 version interval、consumer、authorization delta 与 reversion 的公开案例。Microsoft 目录审计与 Entra 文档直接支持 old/new、发起者、目标和 federation change 可见性，GPO 文档支持 AD/SYSVOL 双组件与复制；这些足以建立机制可行性和防御差异，但具体“以匿迹为目的”及 TA0004 成功保持 medium，必须由本地链证明。
      en: The fixed ATT&CK parent explicitly supports temporary modification, action, and reversion but does not provide a public case with a complete malicious version interval, consumer, authority difference, and reversion. Microsoft directory-audit and Entra documentation directly supports old and new values, initiator, target, and federation-change visibility, while GPO documentation supports the AD and SYSVOL dual components and replication. This establishes mechanism feasibility and defense differences, but deliberate concealment and TA0004 success remain medium-confidence and require a local chain.
    - zh: Microsoft 2026 GPO 案例直接证明攻击者使用可信集中机制一次设置、由设备拉取并广泛执行，但目标是防御削弱与 ransomware distribution，且 GPO 被防守方阻断；它只支持 parent fanout/Boundary Traversal，不证明权限提升、回退子项或成功消费。Solorigate 信任案例证明恶意证书改变接受结果，但攻击者先有 Azure AD 管理权限，公开资料也未提供相对 pre-state 的完整权限集合，因此事件级 TA0004 仍需严格结果门。
      en: Microsoft's 2026 GPO case directly proves adversary use of a trusted central mechanism that is configured once and pulled and executed broadly by devices, but its goals were defense impairment and ransomware distribution and defenders blocked the GPO. It supports parent fan-out and Boundary Traversal only, not elevation, the reversion child, or successful consumption. The Solorigate trust case proves an added malicious certificate changed acceptance outcome, but the adversary already had Azure AD administrative authority and public reporting does not expose a complete authorization-set comparison relative to pre-state. Event-level TA0004 therefore still requires the strict outcome gate.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [narrow non-authentication GPO scope selected for concealment, cross-implementation precedence or inheritance concealment]
