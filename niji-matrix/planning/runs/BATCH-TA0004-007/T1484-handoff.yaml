privilege_result_gate:
  chain: lower-authority-writer-or-prestate -> exact-policy-or-trust-object-and-version -> propagation-or-evaluation -> exact-principal-session-or-token -> positive-effective-authority-difference -> first-newly-authorized-operation
  insufficient_indicators: [domain-admin-or-global-admin-label, policy-object-existence, GPO-applied, trust-established, group-membership-string, privileged-token-string, defense-only-impairment]
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  confidence: medium
  causal_chain:
    zh: 攻击者经正常 directory/federation API 改写集中策略或信任，平台随后由复制器、policy engine、client 或 trust evaluator 消费同一版本；痕迹从攻击者逐资源授权变成控制面写入与多个受信 consumer 的正常处理/执行，writer 和权限结果分处不同系统、主体与时间；只观察 endpoint、资源或正常管理进程时无法还原恶意来源与 effective policy；集中管理边界因此稀释归因并形成 Boundary Traversal。object/version、writer、scope、consumer evaluation、principal/session/token 与 outcome 可重建因果。
    en: The adversary rewrites centralized policy or trust through a normal directory or federation API, after which a replicator, policy engine, client, or trust evaluator consumes the version. The trace changes from adversary authorization at each resource into one control-plane write plus normal processing or execution by many trusted consumers, placing writer and authority result in different systems, principals, and times. Endpoint-, resource-, or normal-management-process-only observation cannot recover malicious origin and effective policy. The central administration boundary therefore dilutes attribution and creates Boundary Traversal stealth. Object and version, writer, scope, consumer evaluation, principal or session or token, and outcome can reconstruct causality.
  evidence_refs: [B4-007-T1484-REF-01, B4-007-T1484-REF-02, B4-007-T1484-REF-05]
- mechanism_ref: NM-ST
  role: secondary
  confidence: medium
  causal_chain:
    zh: 攻击者建立恶意 policy/trust version，等待它传播或被目标请求消费，完成新获准操作后再恢复先前状态；痕迹从持续异常变为 mutation、consumer use 与 reversion 的有界序列，之后的 current-state snapshot 重新正常；短保留或定期盘点只见正常终态，无法连接已经签发的 token/session 或已完成结果；异常窗口因此被压缩并形成 Short-lived Trace。不可变 old/new 历史、精确有效区间、consumer/request 键与恢复后的 token/session 撤销可恢复链。
    en: The adversary establishes a malicious policy or trust version, waits for propagation or target-request consumption, completes a newly authorized operation, and restores the prior state. The trace changes from a durable anomaly into a bounded mutation, consumer-use, and reversion sequence after which current-state snapshots look normal again. Short retention or periodic inventory sees the normal end state and cannot join already issued tokens or sessions or completed outcomes. The anomalous interval is compressed and creates Short-lived Trace. Immutable old-and-new history, an exact validity interval, consumer or request keys, and post-restoration token or session revocation can recover the chain.
  evidence_refs: [B4-007-T1484-REF-01, B4-007-T1484-REF-03, B4-007-T1484-REF-04]
