  name: {zh: 域或租户策略修改, en: Domain or Tenant Policy Modification}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1484 映射到 Privilege Escalation，并把 GPO 与域/租户 trust/federation modification 作为集中管理环境中的实现。Niji 适配为“集中策略与信任状态篡改”，将直接对象限定为能够由管理/身份控制面版本化、传播并由 consumer 评估的权威 policy 或 trust state。只有该版本使明确主体、会话或 token 相对 pre-state 获得正向有效权限差并完成首个新获准操作时，才确认 TA0004；仅有管理员身份、策略变更、trust established、GPO applied 或防御被关闭均不足。
      en: ATT&CK Enterprise 19.1 maps T1484 to Privilege Escalation and presents GPO and domain or tenant trust or federation modification as implementations in centrally managed environments. Niji adapts it as Central Policy and Trust-State Mutation and limits the direct object to authoritative policy or trust state that is versioned by an administration or identity control plane, propagated, and evaluated by consumers. TA0004 is confirmed only when that version gives an identified principal, session, or token a positive effective-authority difference relative to pre-state and causes the first newly authorized operation. An administrator identity, policy mutation, established trust, applied GPO, or impaired defense alone is insufficient.
    - zh: 两项 ATT&CK 子技术不被导入。开放搜索收敛出一个 Niji-native 子项：攻击者在恶意版本产生结果后恢复同一对象的先前状态，使异常只存在于一个可控区间并逃离 current-state inventory。认证 proof/策略例外和授权图已有 NJT-0093/NJS-0093-001/002 与 NJT-0083/NJS-0083-002 owner；集中扇出、传播和既有对象修改是父级。正式数量因此为 1，而不是 ATT&CK 子项数量的映射。
      en: Neither ATT&CK child is imported. Open search converges on one Niji-native child: the adversary restores the prior state of the same object after a malicious version produces its result, leaving the anomaly within a controlled interval and escaping current-state inventory. Authentication proofs or policy exceptions and authorization graphs already have owners in NJT-0093 or NJS-0093-001 or 002 and NJT-0083 or NJS-0083-002. Central fan-out, propagation, and existing-object modification remain parent scope. The formal count is therefore one rather than a mapping from the number of ATT&CK children.
