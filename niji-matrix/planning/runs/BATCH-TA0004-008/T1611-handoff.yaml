research:
  limitations:
    paragraphs:
    - zh: ATT&CK、Docker/Kubernetes 官方文档、Siloscape 与 TeamTNT 调查以及两项 provenance 研究共同证明越界行为、alias/Broker 痕迹拓扑和所需防御键，但公开事件通常没有同时发布 container pre-state authorization set、host post-state set 与每个 host result 的授权决定。正式对象因此可以高置信确认 taxonomy 和观察差异，却仍要求本地数据证明具体事件的 positive authority difference；`privileged: true`、UID 0 或 mount/socket 存在不能单独确认成功。
      en: ATT&CK, official Docker and Kubernetes documentation, Siloscape and TeamTNT investigations, and two provenance studies jointly establish boundary-crossing behavior, alias and broker trace topology, and required defensive keys. Public incidents rarely publish a container pre-state authorization set, host post-state set, and authorization decision for every host result together. The formal object can therefore establish taxonomy and observation differences with high confidence while still requiring local data to prove a positive authority difference in a specific event. `privileged: true`, UID 0, or mount or socket presence alone cannot confirm success.
    - zh: 资源别名的证据最强地覆盖 Linux mount/inode 与 Windows global symbolic link；registry、named object、block device 和 VM shared resource 的推广必须验证对应 canonical identity。Broker 证据最强地覆盖 Docker runtime socket 与 cgroup/runtime helper，kubelet、ESXi/hypervisor service 和其他 control plane 只能在保留原请求与有效执行上下文时类推。短暂清理和跨节点选择仍是假设，不进入正式子项。
      en: Resource-alias evidence is strongest for Linux mount and inode behavior and Windows global symbolic links; extension to registry, named objects, block devices, and VM shared resources requires validation of their canonical identity. Broker evidence is strongest for Docker runtime sockets and cgroup or runtime helpers; kubelet, ESXi or hypervisor services, and other control planes can be generalized only when the original request and effective execution context are preserved. Transient cleanup and cross-node selection remain hypotheses and do not enter formal children.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [transient post-outcome cleanup, deliberate cross-sensor node selection or multi-boundary chaining]
