privilege_result_gate:
  chain: container-or-guest-scoped-prestate -> exact-boundary-primitive-or-broker-request -> effective-host-context-or-canonical-host-resource -> positive-authority-difference -> first-host-only-authorized-outcome
  insufficient_indicators: [container-UID-0, privileged-label, hostPID-or-hostNetwork, hostPath-or-device-presence, runtime-process, shell-on-host-filesystem, CVE-hit, exploit-crash, host-credential-string-without-use]
stealth_mechanisms:
- mechanism_ref: NM-BT
  role: primary
  confidence: high
  causal_chain:
    zh: 攻击者从 container/guest context 穿越共享 kernel、runtime、host service 或 hypervisor boundary；痕迹不再停留在一个 telemetry domain，而被拆成 workload 内 primitive、host boundary event 与宿主资源/进程结果，且不同侧使用 container ID、namespace、inode/handle、broker request、host PID 或 VM identity 等不同键；只看 workload 或宿主任一侧时无法证明同一主体取得了正权限差；跨边界语义因而落在局部观察之外并形成 Boundary Traversal。统一时间、boundary identity、pre/post context 与 first host-only outcome 可恢复。
    en: The adversary crosses a shared-kernel, runtime, host-service, or hypervisor boundary from a container or guest context. The trace no longer remains in one telemetry domain and is split among an in-workload primitive, a host-boundary event, and a host-resource or process outcome, while each side uses different keys such as container ID, namespace, inode or handle, broker request, host PID, or VM identity. Workload-only or host-only observation cannot prove that the same actor obtained a positive authority difference. Cross-boundary semantics therefore fall outside local observation and create Boundary Traversal. Unified time, boundary identity, pre and post contexts, and the first host-only outcome can recover the chain.
  evidence_refs: [B4-008-T1611-REF-01, B4-008-T1611-REF-05, B4-008-T1611-REF-06]
- mechanism_ref: NM-BT
  role: secondary
  confidence: high
  causal_chain:
    zh: 在资源别名分支，攻击者让 container-visible path/handle 解析到 canonical host resource，使可见进程仍属容器而目标名称在不同 mount/object namespace 中重名；痕迹从显式宿主执行变成 container process 对普通路径/句柄的读写；缺少 container ID、mount namespace、inode/handle 与 host canonical mapping 的审计会把宿主 `/etc/passwd`、注册表或设备误当容器对象；资源归属因此跨命名空间边界不透明。映射版本、mount propagation、canonical identity 与 host effect 可反证。
    en: In the resource-alias branch, the adversary makes a container-visible path or handle resolve to a canonical host resource, leaving the visible process container-scoped while the target name is reused across mount or object namespaces. The trace changes from explicit host execution into a container process reading or writing an ordinary path or handle. Audit without container ID, mount namespace, inode or handle, and host-canonical mapping can mistake host `/etc/passwd`, registry, or device access for a container object. Resource ownership therefore becomes opaque across the namespace boundary. Mapping version, mount propagation, canonical identity, and host effect can disconfirm the concealment.
  evidence_refs: [B4-008-T1611-REF-03, B4-008-T1611-REF-04, B4-008-T1611-REF-05, B4-008-T1611-REF-07]
- mechanism_ref: NM-BT
  role: secondary
  confidence: medium
  causal_chain:
    zh: 在 Broker 分支，攻击者经 runtime socket/API 或 host-consumed callback 提交高权限动作，随后由 dockerd/containerd/kubelet/runc、kernel helper、hypervisor service 或新建 workload 在宿主侧完成；痕迹从原容器进程的直接宿主操作变成受信 Broker 的 transaction/process 和结果，原请求与结果分处不同进程、namespace 或时间；仅检查宿主进程父子关系会把结果归给正常基础设施，无法识别原 container principal；来源转换因而削弱关联和归因。control-channel event、request body/hash、broker transaction、effective context 与 outcome 可恢复。
    en: In the broker branch, the adversary submits a privileged action through a runtime socket or API or a host-consumed callback, after which dockerd, containerd, kubelet, runc, a kernel helper, a hypervisor service, or a newly created workload completes it on the host. The trace changes from direct host action by the originating container process into a trusted broker transaction or process and result, separating request and outcome across processes, namespaces, or time. Host-process-parentage-only analysis attributes the result to normal infrastructure and cannot identify the original container principal. Provenance translation therefore weakens correlation and attribution. Control-channel event, request body or hash, broker transaction, effective context, and outcome can recover it.
  evidence_refs: [B4-008-T1611-REF-01, B4-008-T1611-REF-02, B4-008-T1611-REF-06, B4-008-T1611-REF-08]
