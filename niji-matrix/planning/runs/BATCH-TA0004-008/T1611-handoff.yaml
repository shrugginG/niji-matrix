  source_attack_id: T1611
  name: {zh: 逃逸到主机, en: Escape to Host}
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1611 映射到 Privilege Escalation，描述从容器或虚拟化环境越过隔离边界进入底层宿主，并列出 host filesystem mount、privileged container、namespace/capability、runtime socket、Windows global symbolic link、kernel/runtime 与 ESXi 漏洞等实现。Niji 适配为“隔离工作负载至宿主权限逃逸”，把直接对象限定为原 container/guest authority context 与 host authority context 之间的边界转换。只有 pre-state 无权完成某项 host operation，经可定位 primitive 或 Broker path 产生 positive authority difference 并完成首个 host-only authorized outcome，才确认 TA0004。
      en: ATT&CK Enterprise 19.1 maps T1611 to Privilege Escalation and describes crossing from a container or virtualized environment into the underlying host, with implementations including host-filesystem mounts, privileged containers, namespaces or capabilities, runtime sockets, Windows global symbolic links, kernel or runtime vulnerabilities, and ESXi vulnerabilities. Niji adapts it as Isolated-Workload-to-Host Authority Escape and limits the direct object to a boundary transition between the original container or guest authority context and host authority context. TA0004 is confirmed only when the pre-state could not perform a host operation, a locatable primitive or broker path creates a positive authority difference, and the first host-only authorized outcome occurs.
    - zh: 固定 ATT&CK 无子项。开放搜索没有按平台、CVE、mount、socket 或 capability 拆分，而收敛出两个 Niji-native 痕迹拓扑：容器进程经别名直接触达宿主规范资源，以及容器请求经宿主侧 Broker 转换为 daemon/helper/new-workload 结果。前者改变“同路径属于哪个 namespace”的可观察性，后者改变结果的 visible initiator；二者关联主键和预防动作不同，故正式数量为 2。
      en: Fixed ATT&CK has no children. Open search does not partition by platform, CVE, mount, socket, or capability and instead converges on two Niji-native trace topologies: a container process directly reaches a canonical host resource through an alias, and a container request is translated by a host-side broker into a daemon, helper, or new-workload outcome. The former changes observability of which namespace owns a same-named path, while the latter changes the visible initiator of the result. Their correlation keys and preventive actions differ, so the formal count is two.
