  create_candidates: [B4-008-T1611-MIT-01]
  rationale: One boundary-governance object can apply different target-specific controls to parent alias and broker children, including user namespaces rootless or runtime isolation, admission, read-only canonical mappings, socket or API authority, callback control, patching, and host-effect recovery.
