  create_candidates: [B4-008-T1611-NJA-01, B4-008-T1611-NJA-02]
  rationale: Alias mapping uses container mount or object namespace plus inode handle and canonical host target, whereas broker translation uses request channel transaction host executor and outcome; incompatible primary keys justify two implementable analytics under one DET.
- library: mitigations
