  breadth_gap_explanation_zh: 固定 ATT&CK 零子项，开放搜索仍覆盖十一类维度。直接 kernel/namespace/hypervisor crossing、身份标签变化、边界层数和 capability/CVE 前提归 parent-core；重启/调度/镜像/服务定义有 adjacent owner；短暂回退和跨节点选择保持 hypothesis；资源、平台、产品、工具与字段分区 rejected。不能增加，因为没有第三个轴同时具备攻击者可控 stable key、独立痕迹拓扑、结论证据和不同防御 owner；不能减少，因为 alias 轴由原容器进程直接命中 canonical host resource，Broker 轴由宿主 daemon/helper/new workload 产生结果，visible actor、关联主键和控制动作互不相同。
  breadth_gap_explanation_en: Fixed ATT&CK has no children, yet open search covers eleven dimensions. Direct kernel, namespace, or hypervisor crossing, identity-label variation, boundary count, and capability or CVE prerequisites remain parent core. Restart, scheduling, image, and service-definition dimensions have adjacent owners. Transient reversion and cross-node selection remain hypotheses, while resource, platform, product, tool, and field partitions are rejected. The count cannot increase because no third axis combines an adversary-controlled stable key, independent trace topology, conclusion-level evidence, and a different defense owner. It cannot decrease because the alias axis has the original container process directly reach a canonical host resource, while the broker axis has a host daemon, helper, or new workload produce the result; their visible actors, correlation keys, and control actions differ.
