why_not_more:
  zh: ATT&CK 固定零子项但开放搜索覆盖十一类维度。直接 kernel/namespace/hypervisor crossing、身份标签变化、边界层数和能力/漏洞前提归 parent-core；重启/调度/镜像与服务定义有 adjacent owner；短暂回退缺少结论证据，保持 hypothesis；资源类型和产品字段分区 rejected。除“容器可见别名指向宿主规范资源”和“容器请求经宿主 Broker 转换为结果”外，没有第三个轴同时具备攻击者可控 stable key、互不包含的 trace topology、结论证据和独立检测/缓解 owner。
  en: ATT&CK has no fixed children, but open search covers eleven dimensions. Direct kernel, namespace, or hypervisor crossing, identity-label variation, boundary count, and capability or vulnerability prerequisites remain parent core. Restart, scheduling, image, and service-definition dimensions have adjacent owners. Transient reversion lacks conclusion-level evidence and remains a hypothesis. Resource-type and product or field partitions are rejected. Beyond a container-visible alias pointing to a canonical host resource and a container request translated by a host broker into an outcome, no third axis combines an adversary-controlled stable key, mutually distinct trace topology, conclusion-level evidence, and an independent detection or mitigation owner.
why_not_fewer:
  zh: 两个正式轴在结果出现时的 visible actor 与关键关联键相反且互不包含。alias 轴由同一容器进程直接访问宿主资源，必须解析 mount/object namespace、inode/handle 与 canonical host target；Broker 轴由宿主 daemon/helper 或新 workload 产生结果，必须连接原 container request、control channel、broker transaction 与 effective host context。Siloscape、TeamTNT、Docker/Kubernetes 官方语义与 provenance 研究分别证明这些痕迹与观察差异。合并会迫使一条泛化 analytic 同时用不相容的主键，减少为零则丢失两个攻击者可控且防御动作不同的匿迹变量。
  en: The two formal axes have opposite visible actors and different primary correlation keys at outcome time, and neither contains the other. The alias axis has the same container process directly access a host resource and requires resolution of mount or object namespace, inode or handle, and canonical host target. The broker axis has a host daemon or helper or a new workload produce the result and requires joining the original container request, control channel, broker transaction, and effective host context. Siloscape, TeamTNT, official Docker and Kubernetes semantics, and provenance research establish these trace and observation differences. Combining them would force one generic analytic to use incompatible primary keys, while reducing the count to zero would lose two adversary-controlled variables with different defensive actions.
residual_hypotheses:
- transient boundary crossing followed by complete mapping broker-state or host-process cleanup as an independent short-lived-trace child
- deliberate node selection or multi-boundary chaining used to exploit cross-sensor retention gaps rather than merely reach a vulnerable host
