recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1546 同时映射到 Persistence 与 Privilege Escalation，并明确事件触发 action 可由 SYSTEM 或 service account 等更高权限主体代理。现有 NJT-0090 已把直接对象收窄为 registrant—predicate—event—Broker—action 关系，完整覆盖固定十八项实现而不导入 ATT&CK 子项；该对象适合跨战术复用。TA0004 只在 writer/caller pre-state、被消费的 exact object/version、Broker effective context、正向权限差和首个原上下文无权执行而实际获准的结果完整时成立。
      en: ATT&CK Enterprise 19.1 maps T1546 to both Persistence and Privilege Escalation and states that an event-triggered action can be proxied by a higher-authority principal such as SYSTEM or a service account. Existing NJT-0090 narrows the direct object to a registrant-to-predicate-to-event-to-broker-to-action relationship, fully covering the eighteen fixed implementations without importing ATT&CK children, and is suitable for cross-tactic reuse. TA0004 holds only with writer or caller pre-state, the exact consumed object and version, broker effective context, a positive authority difference, and the first result that the original context could not perform but the post-state allows.
    - zh: 两个既有 Niji 子技术重新通过正式门禁。谓词轴控制 candidate/match set 与时间密度；Broker 轴控制结果侧 visible initiator 与来源断点。权限距离只是 TA0004 父级结果门，不能成为第三个匿迹子项；使用后回退仍缺结论级证据；加载/解析、脚本正文、启动描述符、服务和 scheduler 继续由相邻 owner 持有。因此 retain NJT-0090 与两个 NJS，并扩展同一 DET/NJA/MIT 的权限结果分支，不复制对象。
      en: Both existing Niji children pass the formal gates again. The predicate axis controls candidate or match set and temporal density, while the broker axis controls the result-side visible initiator and provenance break. Authority distance is a TA0004 parent outcome gate rather than a third evasion child. Post-use reversion still lacks conclusion-level evidence, and loading or resolution, script content, boot descriptors, services, and schedulers retain adjacent owners. NJT-0090 and its two NJS objects are therefore retained, and the same DET, NJA, and MIT gain an authority-outcome branch without duplication.
