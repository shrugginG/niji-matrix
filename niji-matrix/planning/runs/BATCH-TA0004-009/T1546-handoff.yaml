research:
  limitations:
    paragraphs:
    - zh: ATT&CK 固定父页直接锚定 TA0004 及 higher-permission proxy 的可能性，Microsoft 文档直接说明 WMI permanent subscription 的 CreatorSID/安全约束、LocalSystem 执行 consumer 和 provider hosting context；这些足以定义权限模型和所需字段，却不证明每个 T1546 实例或每个 WMI callback 都发生提权。具体事件必须以本地 pre/post authorization set 和 first newly authorized outcome 证实，root/SYSTEM、WmiPrvSE 或 action success 只能作为中间证据。
      en: The fixed ATT&CK parent directly anchors TA0004 and the possibility of a higher-permission proxy, while Microsoft documentation directly defines CreatorSID and security constraints for permanent WMI subscriptions, local-system consumer execution, and provider hosting context. This is sufficient to define the authority model and required fields but does not prove elevation for every T1546 implementation or WMI callback. A specific event requires local pre-state and post-state authorization plus the first newly authorized outcome; root or SYSTEM, WmiPrvSE, or action success is only intermediate evidence.
    - zh: CASE-000115 只证明 Solorigate 持久注册和 Broker 来源分离，公开报告未给出原 writer 权限、实际 consumer token 或首个新增权限结果，因此不扩展为 TA0004 案例。WMI 的 authority evidence 最强；将相同结论推广到 Emond、udev、installer、cloud/SaaS callback 或其他 Broker 时，必须解析各自 consumer identity、delegation policy 和资源授权结果。谓词匿迹意图仍为 medium，使用后回退与跨 host 选择保持 hypothesis。
      en: CASE-000115 establishes only Solorigate durable registration and broker provenance. The public report omits original-writer authority, actual consumer token, and first added-permission result, so it is not extended into a TA0004 case. Authority evidence is strongest for WMI. Applying the same conclusion to Emond, udev, installers, cloud or SaaS callbacks, or other brokers requires resolution of each consumer identity, delegation policy, and resource authorization outcome. Predicate stealth intent remains medium, while post-use reversion and cross-host selection remain hypotheses.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [post-use registration disable deletion or restoration, attacker-selected distributed scope exploiting cross-host retention gaps]
