  breadth_gap_explanation_en: All eighteen implementations are assigned individually to parent core, one of the two existing Niji variables, or an adjacent technique; the second pass also tests authority distance, registration-to-activation separation, post-use reversion, action indirection, state shape, cadence or fanout, and dimensions outside ATT&CK. The count cannot increase because authority difference is the TA0004 parent success gate, reversion and distributed scope lack conclusion-level evidence, loading, scripts, boot, services, and scheduling have adjacent owners, and platform, product, path, or tool partitions lack a stable evasion boundary. It cannot decrease because the predicate axis changes the match set and temporal density, while the broker axis changes the visible initiator and provenance continuity; their correlation keys and defensive actions differ.
