attack_subtechnique_ids: [T1546.001, T1546.002, T1546.003, T1546.004, T1546.005, T1546.006, T1546.007, T1546.008, T1546.009, T1546.010, T1546.011, T1546.012, T1546.013, T1546.014, T1546.015, T1546.016, T1546.017, T1546.018]
represented_dimensions: [file-open handler, idle-state callback, WMI query subscription, shell lifecycle hook, signal trap, Mach-O loader insertion, network-shell helper, accessibility launch surface, process-load DLL injection, application compatibility shim, debugger and exit-monitor redirection, interpreter profile, event-monitor rule, COM activation resolution, installer transaction, device-match rule, Python initialization hook]
breadth_trigger: complex-explicit-coverage-and-second-pass
coverage_resolutions:
- attack_ref: T1546.001
  attack_name: Change Default File Association
  implementation_or_behavior_dimension: file-extension open event selects a registered handler and command
  resolution: parent-core
  rationale_zh: 文件扩展名和 handler 是注册实现；只有攻击者进一步把触发集合收窄且证明匹配效果时才进入 NJS-0090-001，handler 名称不单独成项。
  rationale_en: File extension and handler are registration implementations. NJS-0090-001 applies only when the adversary further narrows the trigger set and establishes its match effect; handler names do not become children.
- attack_ref: T1546.002
  attack_name: Screensaver
  implementation_or_behavior_dimension: idle or user-state threshold invokes a configured screensaver action
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-001, NJS-0090-002]
  rationale_zh: 可控 idle/user-state 条件可实例化收窄谓词，系统屏保宿主与写入者分离时可实例化 Broker 来源；屏保产品本身不是变量。
  rationale_en: A controllable idle or user-state condition can instantiate the narrowed-predicate axis, and separation between the system screensaver host and writer can instantiate broker provenance; the screensaver product is not the variable.
- attack_ref: T1546.003
  attack_name: Windows Management Instrumentation Event Subscription
  implementation_or_behavior_dimension: persistent filter-consumer-binding with WQL event matching and WMI delivery
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-001, NJS-0090-002]
  rationale_zh: WQL Query 稳定控制匹配集合，filter/consumer/binding 又把 CreatorSID 与 Wmiprvse/consumer action 分离，直接覆盖两个正式轴。
  rationale_en: A WQL query stably controls the matching set, while filter, consumer, and binding separate CreatorSID from Wmiprvse or consumer action, directly covering both formal axes.
- attack_ref: T1546.004
  attack_name: Unix Shell Configuration Modification
  implementation_or_behavior_dimension: shell or session lifecycle reads persistent initialization and exit configuration
  resolution: parent-core
  rationale_zh: shell/session lifecycle 是持久回调实现；脚本正文由 T1037 相邻处理，只有额外可控谓词或不同执行主体才进入正式轴。
  rationale_en: Shell or session lifecycle is a durable callback implementation. T1037 owns script content, and a formal axis applies only with an additional controlled predicate or distinct executing principal.
- attack_ref: T1546.005
  attack_name: Trap
  implementation_or_behavior_dimension: a registered shell signal condition invokes an action
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-001]
  rationale_zh: 攻击者选择 signal 与 condition 时可稳定改变候选事件集合；单纯 trap 语法、shell 类型或故障不构成匿迹变量。
  rationale_en: Adversary selection of signal and condition can stably change the candidate-event set; trap syntax, shell type, or failure alone is not an evasion variable.
- attack_ref: T1546.006
  attack_name: LC_LOAD_DYLIB Addition
  implementation_or_behavior_dimension: Mach-O loader resolves an injected library at process load
  resolution: adjacent-technique
  adjacent_refs: [NJT-0070]
  rationale_zh: 直接对象是 loader/library resolution 时归 Hijack Execution Flow；只有另有持久 event predicate 与 callback lineage 时才并列 NJT-0090。
  rationale_en: Hijack Execution Flow owns the behavior when loader or library resolution is the direct object. NJT-0090 co-occurs only with a separate durable event predicate and callback lineage.
- attack_ref: T1546.007
  attack_name: Netsh Helper DLL
  implementation_or_behavior_dimension: a registered helper is loaded when the trusted netsh host invokes its extension path
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-002]
  rationale_zh: 注册者与以后 netsh 宿主动作分离可实例化 Broker 来源；helper DLL 名称、Registry 路径和网络命令不是 sibling 变量。
  rationale_en: Separation between registrant and later netsh-host action can instantiate broker provenance; helper-DLL name, Registry path, and network command are not sibling variables.
- attack_ref: T1546.008
  attack_name: Accessibility Features
  implementation_or_behavior_dimension: logon or accessibility interaction invokes a configured or substituted executable under a trusted host context
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-002]
  rationale_zh: 受信登录/辅助功能宿主与早期 writer 分离支持 Broker 轴；若直接对象是替换/解析劫持则由 NJT-0070 处理，SYSTEM 标签不自动证明提权。
  rationale_en: Separation between a trusted logon or accessibility host and the earlier writer supports the broker axis. NJT-0070 owns direct substitution or resolution hijacking, and a SYSTEM label does not automatically prove elevation.
- attack_ref: T1546.009
  attack_name: AppCert DLLs
  implementation_or_behavior_dimension: process creation and selected API paths load registered DLLs
  resolution: adjacent-technique
  adjacent_refs: [NJT-0070]
  rationale_zh: DLL load/解析重定向是直接对象时归 NJT-0070；进程类型与 Registry 介质不能形成 T1546 的 Niji 子项。
  rationale_en: NJT-0070 owns DLL-load or resolution redirection as the direct object; process class and Registry medium do not form T1546 Niji children.
- attack_ref: T1546.010
  attack_name: AppInit DLLs
  implementation_or_behavior_dimension: GUI processes loading User32 consume a registered DLL list
  resolution: adjacent-technique
  adjacent_refs: [NJT-0070]
  rationale_zh: 该维度以 loader consumption 为核心，归 NJT-0070；只有额外事件谓词或独立 Broker 谱系才与 NJT-0090 并列。
  rationale_en: Loader consumption is the core dimension and belongs to NJT-0070; NJT-0090 co-occurs only with an additional event predicate or independent broker lineage.
- attack_ref: T1546.011
  attack_name: Application Shimming
  implementation_or_behavior_dimension: application-compatibility state redirects or augments execution at process launch
  resolution: adjacent-technique
  adjacent_refs: [NJT-0070]
  rationale_zh: shim selection和执行流重定向由 NJT-0070 持有；兼容数据库、应用或平台不是新的匿迹变量。
  rationale_en: NJT-0070 owns shim selection and execution-flow redirection; compatibility database, application, or platform is not a new evasion variable.
- attack_ref: T1546.012
  attack_name: Image File Execution Options Injection
  implementation_or_behavior_dimension: process image launch or exit monitoring resolves a debugger or monitor action
  resolution: adjacent-technique
  adjacent_refs: [NJT-0070]
  rationale_zh: debugger/SilentProcessExit 解析关系作为直接对象时归 NJT-0070；目标 image 名称和 Registry 字段不拆子项。
  rationale_en: NJT-0070 owns debugger or SilentProcessExit resolution when it is the direct object; target-image name and Registry field do not split children.
- attack_ref: T1546.013
  attack_name: PowerShell Profile
  implementation_or_behavior_dimension: PowerShell startup consumes persistent profile content
  resolution: parent-core
  adjacent_refs: [T1037]
  rationale_zh: interpreter lifecycle callback 属父级实现，profile 正文的脚本内容与行级差异由 T1037 相邻负责；PowerShell 产品不成为子项。
  rationale_en: An interpreter-lifecycle callback is a parent implementation, while T1037 owns profile-script content and line-level differences; PowerShell is not a child.
- attack_ref: T1546.014
  attack_name: Emond
  implementation_or_behavior_dimension: event-monitor rules match events and invoke actions through a system broker
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-001, NJS-0090-002]
  rationale_zh: rule conditions控制匹配集合，emond 消费与执行又改变 visible initiator，可分别实例化两个正式轴。
  rationale_en: Rule conditions control the matching set, while emond consumption and execution change the visible initiator, separately instantiating both formal axes.
- attack_ref: T1546.015
  attack_name: Component Object Model Hijacking
  implementation_or_behavior_dimension: COM activation resolves a registered class or server implementation
  resolution: adjacent-technique
  adjacent_refs: [NJT-0070]
  rationale_zh: COM class/server 解析劫持由 NJT-0070 负责；只有另有持久谓词—事件—callback 关系时才并列本技术。
  rationale_en: NJT-0070 owns COM class or server resolution hijacking; this technique co-occurs only with a separate durable predicate-to-event-to-callback relationship.
- attack_ref: T1546.016
  attack_name: Installer Packages
  implementation_or_behavior_dimension: install repair or package events invoke registered actions through an installer service
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-002]
  rationale_zh: package author/writer 与 installer service action 分离可实例化 Broker 来源；合法 elevated install 由完整批准和权限结果反例校准。
  rationale_en: Separation between package author or writer and installer-service action can instantiate broker provenance; legitimate elevated installation is calibrated through complete approval and authority-outcome counterexamples.
- attack_ref: T1546.017
  attack_name: Udev Rules
  implementation_or_behavior_dimension: device attributes and actions are matched and invoked by the udev rule engine
  resolution: niji-variable-candidate
  niji_refs: [NJS-0090-001, NJS-0090-002]
  rationale_zh: match keys 可收窄设备事件，udev daemon/worker 又将 writer 与执行主体分离；设备类型和规则文件名不单独成项。
  rationale_en: Match keys can narrow device events, while the udev daemon or worker separates writer from executing principal; device type and rule filename do not become children.
- attack_ref: T1546.018
  attack_name: Python Startup Hooks
  implementation_or_behavior_dimension: Python initialization processes .pth and sitecustomize or usercustomize hooks
  resolution: parent-core
  adjacent_refs: [T1037, NJT-0070]
  rationale_zh: Python 启动消费是父级 lifecycle callback；脚本正文和 import resolution 分别由 T1037/NJT-0070 相邻处理，解释器或文件名不形成子项。
  rationale_en: Python-startup consumption is a parent lifecycle callback. T1037 and NJT-0070 respectively own script content and import resolution, while interpreter or filename does not form a child.
candidate_stealth_axes_examined:
- axis: context-narrowed-event-predicate-activation
  discovery_source: ATT&CK filters traps Emond udev and WMI plus Microsoft permanent-consumer and Mandiant uptime-condition evidence
  final_resolution: formal
  child_ref: NJS-0090-001
  reason_zh: 攻击者可稳定控制 predicate 与 candidate/match set，降低短窗口触发密度；检测需要规范化条件、候选事件基线、匹配率和长期首次结果。
  reason_en: The adversary can stably control predicate and candidate or matching set, reducing short-window activation density; detection needs normalized condition, candidate-event baseline, match rate, and long-horizon first outcome.
- axis: trusted-event-broker-provenance-masking
  discovery_source: WMI provider and consumer hosting Sysmon and WMI tracing plus Netsh installer and udev consumer contrast
  final_resolution: formal
  child_ref: NJS-0090-002
  reason_zh: 攻击者可选择由持久 Broker 消费 action，使结果侧主体从 writer 变为正常 provider/service；检测需要 object/binding/callback 与 writer→Broker→result 来源关联。
  reason_en: The adversary can select durable broker consumption of the action, changing the result-side actor from writer to a normal provider or service; detection requires object, binding, or callback and writer-to-broker-to-result provenance.
- axis: writer-to-consumer-authority-distance
  discovery_source: ATT&CK TA0004 parent statement and Microsoft WMI provider consumer security models
  final_resolution: parent-core
  reason_zh: 权限距离决定 TA0004 是否成立，而不是改变匿迹方式；两个子项在 TA0004 下都必须再通过 writer/pre-state→consumer context→正向权限差→首个新获准结果门。
  reason_en: Authority distance determines whether TA0004 holds rather than changing the evasion method. Under TA0004 both children must also pass the writer or pre-state to consumer context to positive difference to first newly authorized outcome gate.
- axis: registration-to-activation-time-separation
  discovery_source: all durable callback implementations
  final_resolution: parent-core
  reason_zh: 创建与使用跨时间是父级固有属性；长延迟只有攻击者控制窄谓词时由 NJS-0090-001 表达，不另建时间子项。
  reason_en: Creation-to-use separation is parent-inherent. Long delay is represented by NJS-0090-001 only when caused by an adversary-controlled narrow predicate and does not form another time child.
- axis: registration-use-disable-delete-restore-lifecycle
  discovery_source: state-version and post-use reversion search outside ATT&CK classifications
  final_resolution: hypothesis
  reason_zh: 攻击者可在使用后禁用/删除/恢复注册以缩短证据窗口，但现有 T1546 事件没有结论级的同对象版本—消费—回退链，且检测可先由父级版本保留承载，暂不正式化。
  reason_en: An adversary can disable, delete, or restore registration after use to shorten the evidence interval, but current T1546 material lacks a conclusion-level same-object version-to-consumption-to-reversion chain, and parent-level version retention can cover detection, so it remains a hypothesis.
- axis: action-payload-indirection-or-signed-host-execution
  discovery_source: cross-category proxy execution and loader comparison
  final_resolution: formal-only-when-broker-provenance-key-is-present-otherwise-adjacent
  child_refs: [NJS-0090-002]
  reason_zh: 受信 host 只有在持久注册者与结果主体分离时属于 Broker 轴；payload 类型、signed binary、script/DLL 和 command line 本身由相邻执行/加载对象处理。
  reason_en: A trusted host belongs to the broker axis only when durable registrant and result principal are separated. Payload type, signed binary, script or DLL, and command line otherwise belong to adjacent execution or loading objects.
- axis: registration-name-location-format-fragmentation-precedence-inheritance
  discovery_source: cross-category state-shape search
  final_resolution: adjacent-or-not-stealth-distinct
  reason_zh: 这些属性只有在改变触发集合时归谓词轴、改变执行主体来源时归 Broker 轴、改变 loader resolution 时归 NJT-0070；单独的路径/字段/格式变化没有独立检测 owner。
  reason_en: These properties belong to the predicate axis when they change trigger set, to the broker axis when they change executing-principal provenance, or to NJT-0070 when they change loader resolution. Path, field, or format changes alone lack an independent detection owner.
- axis: one-shot-versus-recurrent-trigger-and-fanout-scope
  discovery_source: lifecycle cadence and local fleet tenant search
  final_resolution: parent-core
  reason_zh: cadence、host 数和作用域改变调查窗口及数量，但不稳定改变匿迹语义；只有谓词或 Broker 键不同才进入子项。
  reason_en: Cadence, host count, and scope change investigation window and volume but do not stably change evasion semantics; a child applies only when predicate or broker keys differ.
- axis: load-debugger-shim-COM-or-import-resolution
  discovery_source: ATT&CK children .006 .009 .010 .011 .012 .015 and Python import comparison
  final_resolution: adjacent
  adjacent_refs: [NJT-0070]
  reason_zh: 直接对象为 loader/debugger/shim/COM/import 选择关系时归 Hijack Execution Flow；ATT&CK 把这些实现列在 T1546 不构成 Niji 重复拥有理由。
  reason_en: Hijack Execution Flow owns loader, debugger, shim, COM, or import selection as the direct object. ATT&CK listing these implementations under T1546 does not justify duplicate Niji ownership.
- axis: platform-product-child-name-registry-path-file-name-event-source-tool-medium-target-log-field
  discovery_source: ATT&CK-internal and open partition search
  final_resolution: rejected
  reason_zh: 这些分区只枚举实现或观测位置，不满足跨环境稳定键、sibling 边界、独立痕迹效果和差异化防御门禁。
  reason_en: These partitions enumerate implementation or telemetry location and fail cross-environment stable-key, sibling-boundary, independent-trace-effect, and differentiated-defense gates.
