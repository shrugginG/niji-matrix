why_not_more:
  zh: 十八项实现与十类第二轮轴均已覆盖。权限距离、注册—激活间隔、cadence/fanout 属 parent-core；loader/debugger/shim/COM/import 归 NJT-0070；脚本正文、启动描述符、scheduler 与 service 各有相邻 owner；使用后回退缺结论证据而保持 hypothesis；名称、平台、产品、路径、介质、目标和字段分区 rejected。除谓词匹配集合与 Broker 来源转换外，没有第三个轴同时具备攻击者可控 stable key、互不包含的痕迹变化、结论证据和独立防御 owner。
  en: All eighteen implementations and ten second-pass axes are covered. Authority distance, registration-to-activation separation, and cadence or fan-out remain parent core. Loader, debugger, shim, COM, and import resolution belong to NJT-0070. Script content, boot descriptors, schedulers, and services have adjacent owners. Post-use reversion lacks conclusion-level evidence and remains a hypothesis. Name, platform, product, path, medium, target, and field partitions are rejected. Beyond predicate match set and broker provenance translation, no third axis combines an adversary-controlled stable key, mutually distinct trace change, conclusion-level evidence, and an independent defense owner.
why_not_fewer:
  zh: NJS-0090-001 改变哪些事件会触发及触发密度，主键是 predicate、候选/匹配集合与长期时间；NJS-0090-002 改变结果侧显示谁发起动作，主键是 registrant、binding/callback、Broker identity 与 result。宽谓词仍可有 Broker 来源分离，原进程内 action 也可在窄谓词下没有主体转换；二者互不包含且检测与缓解动作不同，合并会产生泛化 analytic，减少会丢失已由独立官方结构和工程证据支持的稳定变量。
  en: NJS-0090-001 changes which events trigger and activation density, keyed by predicate, candidate or matched population, and long time. NJS-0090-002 changes whom the result side presents as initiator, keyed by registrant, binding or callback, broker identity, and result. A broad predicate can still have broker provenance separation, while an in-process action can use a narrow predicate without actor translation. Neither contains the other, and their detection and mitigation actions differ. Merging would create a generic analytic, while reducing the count would lose stable variables supported by independent official structure and engineering evidence.
residual_hypotheses: [post-use registration disable deletion or semantic restoration, attacker-selected distributed scope exploiting cross-host retention gaps]
