research:
  limitations:
    paragraphs:
    - zh: 固定 ATT&CK 页、Qualys PwnKit 与 Dirty Pipe 原始披露足以证明父级从低权限调用者经脆弱高权限组件或 kernel 到 root/高权限效果，但两个研究样本不代表现场攻击者匿迹意图。父级 mechanism 因而只断言正常授权事务缺失造成可见性缺口，不断言所有 exploit 都隐身、无 crash 或绕过 telemetry；具体事件仍需 exact version、触发链、pre/post authority 和 first result。
      en: Fixed ATT&CK plus the original Qualys PwnKit and Dirty Pipe disclosures establish a parent transition from a lower-authority caller through a vulnerable privileged component or kernel to root or privileged effect, but the two research examples do not establish field-adversary concealment intent. The parent mechanism therefore asserts only a visibility gap caused by absence of the normal authorization transaction, not that every exploit is invisible, crash-free, or telemetry-bypassing. A concrete event still requires exact version, trigger chain, pre-state and post-state authority, and first result.
    - zh: 预受信组件轴的结论证据集中在 Windows BYOVD：CrowdStrike 和 ESET 直接记录受信/签名脆弱驱动被攻击者带入并用于 kernel access/安全工具规避，Microsoft 直接定义危险接口与 block policy。向 Linux module、macOS extension、firmware 或 user-mode signed helper 推广必须重新证明 admission trust、脆弱接口和权限结果，不因“有签名”自动归类。blocklist 不完整且可能破坏合法设备，旧组件已加载后还需 reboot 和 kernel-integrity 响应。
      en: Conclusion-level evidence for the pretrusted-component axis concentrates on Windows BYOVD. CrowdStrike and ESET directly record trusted or signed vulnerable drivers brought by adversaries for kernel access and security-tool evasion, while Microsoft defines dangerous interfaces and block policy. Generalization to Linux modules, macOS extensions, firmware, or signed user-mode helpers requires renewed proof of admission trust, vulnerable interface, and authority result and never follows from signature alone. Blocklists are incomplete and can break legitimate devices, while already loaded components require reboot and kernel-integrity response.
