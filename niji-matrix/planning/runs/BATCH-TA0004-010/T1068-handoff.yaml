recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1068 定义为攻击者利用更高权限 program、service、OS component 或 kernel 的软件缺陷，从 lower-privileged process 跨越限制并取得 SYSTEM/root 等更高访问；该直接对象与正常授权控制滥用、token 操纵、process injection 和 container escape 不同。为 Niji 准入，正式对象收窄为 pre-state authority → exact vulnerable component/version → attacker-controlled trigger/interface → vulnerable transition → post-state effective authority → first newly authorized result；CVE 命中、attempt、crash、shell 或 root 标签均不替代结果门。
      en: ATT&CK Enterprise 19.1 defines T1068 as exploitation of a software flaw in a higher-authority program, service, OS component, or kernel to cross restrictions from a lower-privileged process and obtain higher access such as SYSTEM or root. This direct object differs from abuse of a normal authorization control, token manipulation, process injection, and container escape. For Niji admission, the formal object narrows to pre-state authority, exact vulnerable component and version, attacker-controlled trigger or interface, vulnerable transition, post-state effective authority, and first newly authorized result. A CVE match, attempt, crash, shell, or root label cannot replace the result gate.
    - zh: exploit 绕过正常授权路径的共同痕迹断裂形成父级 Data Obscuration：权限结果存在而普通 grant/approval 事务不存在，防守方必须从输入和脆弱状态重建因果。开放搜索仅保留一个正式子轴：攻击者把签名、publisher、allow decision 或系统角色仍受信的脆弱组件作为权限枢转，以受信组件来源遮蔽控制者并要求独立 vulnerable-version policy。版本门控、clean success 与回退保持 hypothesis/deferred，其余能力、结果载体和机械分区归 parent-core/adjacent/rejected，故 adapt 为新 NJT 与一个 Niji-native 子项。
      en: The common trace break in which exploitation bypasses the ordinary authorization path forms parent-level Data Obscuration: an authority result exists without the normal grant or approval transaction, requiring defenders to reconstruct causality from input and vulnerable state. Open search retains one formal child axis only: the adversary uses a vulnerable component still trusted by signature, publisher, allow decision, or system role as an authority pivot, masking the controller behind trusted-component provenance and requiring a separate vulnerable-version policy. Version gating, clean success, and reversion remain hypotheses or deferred, while other capability, result-carrier, and mechanical partitions are parent core, adjacent, or rejected. The candidate is therefore adapted into a new NJT with one Niji-native child.
