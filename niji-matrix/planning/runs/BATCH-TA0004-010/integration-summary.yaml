  breadth_gap_explanation_zh: 固定零子项不能作为零 Niji 子项结论；开放搜索检查漏洞语义、触发接口、版本/上下文门控、clean success、admission trust、结果载体、回退、平台/组件/漏洞类等内外部轴。最终只有 admission trust 轴同时通过攻击者稳定控制、持久边界、来源痕迹变化、观察与归因影响、明确场景、结论证据和差异化 block/allow 防御门，因此建立 NJS-0102-001。不能减少，因为它要求独立的 exact-version admission→load/interface→controller request→kernel effect 链；不能增加，因为版本门控与 clean success 仍是假设，普通 trigger/authority 属父级，token/injection/escape/loader/cleanup 有相邻 owner，CVE、driver、产品、平台、漏洞类、工具和字段均为机械分区。
  breadth_gap_explanation_en: A fixed zero-child classification cannot justify zero Niji children. Open search tested vulnerability semantics, trigger interface, version or context gating, clean success, admission trust, result carrier, reversion, platform, component, vulnerability class, and dimensions outside ATT&CK. Only admission trust passes stable adversary control, durable boundary, provenance-trace change, observation and attribution effect, explicit scenario, conclusion evidence, and differentiated block or allow defense, yielding NJS-0102-001. It cannot be removed because it requires an independent exact-version-admission-to-load-or-interface-to-controller-request-to-kernel-effect chain. It cannot be increased because version gating and clean success remain hypotheses, ordinary trigger and authority are parent core, token, injection, escape, loader, and cleanup have adjacent owners, and CVE, driver, product, platform, vulnerability class, tool, and field partitions are mechanical.
