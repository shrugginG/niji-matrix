work_items:
- work_item_ref: WORK-TA0004-T1068
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 0
  attack_subtechnique_ids: []
  attack_dimensions:
  - {dimension: vulnerable authority transition, coverage_decision: parent-core, rationale: T1068 spans a programming error in a higher-authority program service OS component or kernel through attacker-controlled execution and a positive authority result}
  - {dimension: adversary-supplied signed vulnerable driver, coverage_decision: niji-variable-candidate, rationale: fixed-baseline ATT&CK separately identifies BYOVD within the parent and field evidence establishes intentional use of pretrusted vulnerable components to cross kernel trust controls}
  breadth_trigger: ordinary-open-search
  candidate_stealth_axes_examined:
  - axis: pretrusted-vulnerable-component-authority-pivot
    discovery_scope: ATT&CK-parent-and-cross-classification
    disposition: formal
    attacker_control: The adversary selects, brings, stages, or activates a vulnerable component that retains a signature, publisher, existing allow decision, or trusted system role and then chooses its exposed request interface.
    sibling_boundary: It requires a preexisting admission or provenance signal that would allow the exact vulnerable version; exploitation of an already installed component without borrowed trust remains parent core, while a malicious or unsigned component blocked before admission does not qualify.
    trace_change: The visible path becomes component write or discovery, accepted load or service registration, device or privileged interface requests, and a kernel or higher-authority result under the trusted component identity rather than a directly untrusted kernel payload.
    defender_effect: Signature-, publisher-, allow-, or trusted-component-only filters admit or mis-rank the precursor and attribute later privileged effects to the component; detection must resolve exact version or hash and join controller-to-interface-to-effect.
    prerequisites_and_scenarios: The target must accept the vulnerable component or already contain an accepted vulnerable version, expose a reachable interface, and permit a caller to trigger the flaw; BYOVD campaigns are the strongest evidenced case.
    evidence_level: conclusion-level field and platform evidence
    evidence_refs: [B4-010-T1068-REF-01, B4-010-T1068-REF-04, B4-010-T1068-REF-05, B4-010-T1068-REF-06, B4-010-T1068-REF-07]
    defense_difference: Requires vulnerable-version inventories and block or allow policy plus write/load/service/device-request and authority-outcome correlation, distinct from generic patch status or post-exploit token/process monitoring.
  - axis: exploit-version-or-environment-gating
    discovery_scope: cross-classification-from-T1203
    disposition: hypothesis
    trace_change: Local exploit execution is withheld until OS build patch architecture configuration or runtime state matches.
    defender_effect: Nonmatching test hosts see no attempt or only a safe exit, reducing sandbox and canary exposure.
    rationale: Compatibility checks are common reliability prerequisites and available local-privilege sources do not establish a persistent adversary-controlled observation differential or concealment intent comparable to NJS-0069-001; retain as a hypothesis until a conclusion-level field case exposes gating logic and differential outcomes.
  - axis: ordinary-privileged-interface-carried-trigger
    discovery_scope: outside-ATTACK-taxonomy
    disposition: parent-core
    trace_change: Malformed arguments environment device requests syscalls or files enter a setuid program service driver or kernel through its normal interface before exploiting a flaw.
    defender_effect: Entry events can resemble legitimate use until abnormal state or authority results appear.
    rationale: Every exploit needs an input surface and PwnKit Dirty Pipe and driver exploits use incompatible keys; without a stable cross-implementation split this is the parent vulnerable-transition mechanism rather than a child.
  - axis: clean-or-fault-suppressed-exploitation
    discovery_scope: outside-ATTACK-taxonomy
    disposition: hypothesis
    trace_change: The adversary selects a reliable path retries selectively or suppresses crash and error artifacts before the first privileged result.
    defender_effect: Crash error and threshold detectors lose signals while the successful authority transition remains.
    rationale: Reliability and lack of a crash are observable outcomes but current sources do not prove a separately controlled stable variable across campaigns or a durable defense owner; crash-free success alone is never classified.
  - axis: exploit-chain-stage-count
    discovery_scope: within-parent
    disposition: rejected
    trace_change: One or multiple flaws cross user kernel broker sandbox or container boundaries.
    defender_effect: More stages change telemetry volume and prerequisites.
    rationale: Stage count is capability and complexity, not a stable evasion variable, and each actual boundary or post-exploit action retains its adjacent owner.
  - axis: same-thread-new-process-token-or-host-result
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: The privilege result may remain in a thread or process, create a new principal or process, mutate a token, or reach a host resource.
    defender_effect: Visible actor and authority carrier change.
    rationale: T1134 and NJT-0099 own token mutation, T1055 owns injection, NJT-0101 owns isolation crossing, and the T1068 parent only confirms the vulnerable transition and first new authority; result carrier does not duplicate those techniques.
  - axis: post-use-exploit-artifact-cleanup
    discovery_scope: outside-ATTACK-taxonomy
    disposition: deferred
    trace_change: Exploit binary vulnerable component service file device handle or crash artifact is removed after authority is obtained.
    defender_effect: Current-state inspection loses the precursor while privileged effects survive.
    rationale: Generic cleanup has adjacent Indicator Removal ownership; T1068-specific formalization needs evidence that exploit-state reversion has a unique persistent boundary and separate detection owner.
  - axis: memory-corruption-race-logic-driver-service-kernel
    discovery_scope: within-parent
    disposition: rejected
    trace_change: Vulnerability class and affected layer select different technical events.
    defender_effect: Sensors and exploit mitigations differ by implementation.
    rationale: These are vulnerability or component families and platform media, not Niji stealth variables; split only when another adversary-controlled observation property passes all gates.
  - axis: cve-product-platform-payload-tool-target-or-log-field
    discovery_scope: prohibited-mechanical-partitions
    disposition: rejected
    trace_change: Object labels and fields differ without a stable evasion causal variable.
    defender_effect: Product-specific rules may differ but taxonomy semantics do not.
    rationale: Prohibited mechanical partition with no enduring sibling boundary.
  second_pass_required: false
  second_pass_completed: true
  second_pass_notes:
  - Compared T1203 selective activation and workflow coupling; neither transfers automatically because local exploit compatibility and normal system interfaces lack the client-delivery observation differential.
  - Compared T1134 token carriers, T1055 process injection, T1611 boundary escape, NJT-0098 authorization controls, NJT-0070 trusted loading, and indicator cleanup; retained only the exploit-owned pretrusted vulnerable-component admission-to-interface-to-authority chain.
  - Searched outside ATT&CK for crash suppression, retry cadence, race shaping, target or CPU selection, in-memory-only effects, post-use reversion, and cross-sensor gaps; none except pretrusted vulnerable-component provenance passed evidence and defense gates.
  proposed_niji_child_count: 1
  final_formal_child_count: 1
  proposed_new_niji_child_count: 1
  why_not_more_zh: 版本/环境门控和故障抑制只有可靠性或缺失事件，尚无结论级现场证据证明攻击者控制了稳定观察差；普通接口承载和漏洞语义混淆是所有实现的父级核心；同线程/进程、token、host 与 container 结果有相邻 owner；chain 长度、漏洞类、CVE、产品、平台、payload、工具和字段只是能力或机械分区；清理归相邻对象并 deferred。因此没有第二个轴同时具备稳定控制键、独立边界、痕迹/观察改变、场景、证据及不同防御对象。
  why_not_more_en: Version or environment gating and fault suppression currently show only reliability or absent events, not conclusion-level field evidence of an adversary-controlled stable observation differential. Ordinary-interface carriage and vulnerability semantic confusion are parent core. Same-thread or process, token, host, and container outcomes have adjacent owners. Chain length, vulnerability class, CVE, product, platform, payload, tool, and fields are capability or mechanical partitions. Cleanup is adjacent and deferred. No second axis therefore combines a stable control key, independent boundary, trace and observation change, scenario, evidence, and distinct defense object.
  why_not_fewer_zh: 预受信脆弱组件轴不能降为普通父级利用：它要求 exact component/version 在利用前因签名、publisher、allow policy 或系统角色被接纳，攻击者有意选择并经其接口取得权限。该轴把可见来源、误判条件、关联主键和缓解从“修补任意漏洞”改变为“组件写入/发现—信任决议—load/service—request—kernel effect”以及版本化 block/allow policy；CrowdStrike、ESET、Microsoft 与固定 ATT&CK 均提供结论级支持。
  why_not_fewer_en: The pretrusted vulnerable-component axis cannot collapse into ordinary parent exploitation. It requires the exact component and version to be admitted before exploitation because of signature, publisher, allow policy, or system role, followed by adversary selection and use of its interface for authority. This changes visible provenance, counterexamples, correlation keys, and mitigation from patching arbitrary flaws to component write or discovery, trust decision, load or service, request, and kernel effect plus versioned block or allow policy. CrowdStrike, ESET, Microsoft, and fixed ATT&CK provide conclusion-level support.
  breadth_gap_explained: true
