recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1055 定义为攻击者把任意代码放入另一 live process 的地址空间并在该上下文执行，以掩藏在合法进程下且可能取得其更高权限。Niji 适配为“跨进程执行上下文嵌入”，把父级成立链固定为 identifiable source/control → target process instance → cross-process write/map or load request → execution dispatch → malicious instruction in target context；TA0004 还必须比较 source pre-state 与 target/post-state authority，并观察首个 source 原本无权完成的新资源结果。
      en: ATT&CK Enterprise 19.1 defines T1055 as placing arbitrary code into another live process address space and executing in that context to hide under a legitimate process and possibly obtain its higher authority. Niji adapts it as Cross-Process Execution-Context Embedding and fixes the parent qualification chain to identifiable source or control, target process instance, cross-process write, map, or load request, execution dispatch, and malicious instruction in the target context. TA0004 additionally requires comparison of source pre-state with target or post-state authority and the first resource result the source could not previously perform.
    - zh: 十二项 ATT&CK 子项只是实现宽度。逐项覆盖与第二轮搜索得到四个稳定观察变量：payload 是否缺正常 file/module backing、是否复用既有 thread/callback/message dispatch、process birth 的 file/image provenance 是否与执行内容分离、target role 是否与后继恶意动作贴合。四者分别改变载荷可检查性、启动可见性、创建身份可信度和行为基线，具备不同证据和防御；ptrace/procfs/DLL/PE/API/平台、权限高度、direct syscall、packing、清理与多进程数量不直接变成子项。
      en: The twelve ATT&CK children are breadth context only. Itemized coverage and the second search yield four stable observation variables: whether payload execution lacks normal file or module backing, whether an existing thread, callback, or message dispatch is reused, whether process-birth file and image provenance diverge from executed content, and whether the target role conforms to the downstream malicious action. These respectively change payload inspectability, start visibility, creation-identity trust, and behavior baselines and have different evidence and defense. Ptrace, procfs, DLL, PE, APIs, platforms, authority height, direct syscalls, packing, cleanup, and process count do not directly form children.
