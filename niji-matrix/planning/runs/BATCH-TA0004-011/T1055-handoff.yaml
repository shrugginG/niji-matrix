research:
  limitations:
    paragraphs:
    - zh: 结论级公开材料以 Windows 为主，能够验证无背衬内存、thread/callback、process birth image 和 target role 四种痕迹差异；Linux ptrace/procfs 与 Apple task/runtime 文档主要证明访问控制和防御前提，不能自动证明与 Windows 完全同形的现场匿迹意图。跨平台对象只在 source-target mutation、dispatch、target-context execution 和相应 trace property 都可验证时适用。
      en: Conclusion-level public material is dominated by Windows and validates unbacked memory, thread or callback, process-birth image, and target-role trace differences. Linux ptrace or procfs and Apple task or runtime documentation primarily establish access-control and defense prerequisites and do not automatically prove field concealment intent identical to Windows. Cross-platform classification applies only when source-target mutation, dispatch, target-context execution, and the relevant trace property are all verifiable.
    - zh: Ursnif、Dofoil 与 VEILEDSIGNAL 案例直接证明特定注入/规避链，却没有公开 source 与 target 权限快照或首个新增授权结果，因此只能支持 T1055 通用行为和子轴，不能单独把具体事件提升为 TA0004 成功。Windows MIC、Yama、SIP/Hardened Runtime 等也表明跨完整性级别的注入通常先需要权限或例外；必须把 access attempt、injection confirmed 与 elevation confirmed 分级。
      en: Ursnif, Dofoil, and VEILEDSIGNAL directly establish specific injection and evasion chains but do not publish source and target authority snapshots or a first newly authorized result. They support generic T1055 behavior and child axes, not a TA0004 success conclusion for each event. Windows MIC, Yama, and SIP or Hardened Runtime also show that injection across integrity boundaries normally requires authority or an exception first, so access attempt, injection confirmed, and elevation confirmed must remain tiered.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [long-lived process selection as an independent privilege-elevation observation axis, multi-process module segmentation with field-proven stable graph boundaries, post-use restoration or freeing of injection state]
