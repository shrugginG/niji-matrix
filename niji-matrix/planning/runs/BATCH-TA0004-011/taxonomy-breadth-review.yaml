schema_version: 1.0.0
type: taxonomy-breadth-review
batch_ref: BATCH-TA0004-011
work_items:
- work_item_ref: WORK-TA0004-T1055
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 12
  attack_subtechnique_ids: [T1055.001, T1055.002, T1055.003, T1055.004, T1055.005, T1055.008, T1055.009, T1055.011, T1055.012, T1055.013, T1055.014, T1055.015]
  attack_dimensions:
  - attack_id: T1055.001
    name_en: Dynamic-link Library Injection
    implementation_dimension: A source causes the target process to load a DLL path or map a DLL image and execute its entry under the target identity.
    coverage_decision: parent-core
    rationale: Standard loader-visible DLL injection exhibits the parent source-to-target write-or-request-to-target-context execution chain; a manually mapped DLL qualifies for the unbacked-memory axis only when normal file or module backing is absent.
  - attack_id: T1055.002
    name_en: Portable Executable Injection
    implementation_dimension: A PE image or shellcode representation is copied and relocated in another process and dispatched there.
    coverage_decision: niji-variable-candidate
    niji_axis: unbacked-payload-memory-embedding
    rationale: The stable stealth property is executable target memory lacking the expected file or loader-module backing, not the PE file format.
  - attack_id: T1055.003
    name_en: Thread Execution Hijacking
    implementation_dimension: An existing target thread is suspended and its instruction pointer or context is redirected to injected code.
    coverage_decision: niji-variable-candidate
    niji_axis: existing-flow-dispatch-substitution
    rationale: Reusing an existing thread replaces a new remote-thread event with a context or call-stack discontinuity and requires thread-state defense.
  - attack_id: T1055.004
    name_en: Asynchronous Procedure Call
    implementation_dimension: An execution address is queued to an alertable or initialization-stage target thread through APC semantics.
    coverage_decision: niji-variable-candidate
    niji_axis: existing-flow-dispatch-substitution
    rationale: APC changes the dispatch carrier and visibility but remains in the same existing-thread or lifecycle-callback axis.
  - attack_id: T1055.005
    name_en: Thread Local Storage
    implementation_dimension: A crafted TLS callback executes before the nominal PE entry point when an injected or hollowed process resumes.
    coverage_decision: niji-variable-candidate
    niji_axis: existing-flow-dispatch-substitution
    rationale: The evasion variable is callback-before-entry dispatch that misleads entrypoint-oriented tools; TLS as a Windows structure is not a Niji category.
  - attack_id: T1055.008
    name_en: Ptrace System Calls
    implementation_dimension: A Linux source attaches to a target and reads or changes registers memory or execution through ptrace requests.
    coverage_decision: parent-core
    rationale: Ptrace is a cross-process mutation medium with an explicit authorization relationship; final backing and dispatch properties determine any Niji child and syscall identity alone is not stealth-distinct.
  - attack_id: T1055.009
    name_en: Proc Memory
    implementation_dimension: A Linux source uses process maps and `/proc/[pid]/mem` to identify and overwrite target process memory.
    coverage_decision: parent-core
    rationale: Procfs is a write and discovery medium; an unbacked executable result can co-map the first Niji axis, while the path itself is not a stable evasion variable.
  - attack_id: T1055.011
    name_en: Extra Window Memory Injection
    implementation_dimension: A source changes window-associated memory or callback state and uses a target GUI thread or message path to execute.
    coverage_decision: niji-variable-candidate
    niji_axis: existing-flow-dispatch-substitution
    rationale: Window structures implement an existing callback and message flow that removes the ordinary remote-thread carrier; Win32 GUI objects do not define the child.
  - attack_id: T1055.012
    name_en: Process Hollowing
    implementation_dimension: A legitimate process is created suspended and its original image or entry is replaced before first normal execution.
    coverage_decision: niji-variable-candidate
    niji_axis: birth-time-image-provenance-divergence
    rationale: Creation-time path signature and process identity diverge from the executable memory that actually begins execution.
  - attack_id: T1055.013
    name_en: Process Doppelgänging
    implementation_dimension: A transient or transaction-backed image section creates a process after the original malicious file view is rolled back or removed.
    coverage_decision: niji-variable-candidate
    niji_axis: birth-time-image-provenance-divergence
    rationale: The stable axis is process birth from an image whose observable file provenance is transient or inconsistent, shared with hollowing or ghosting variants without importing their names.
  - attack_id: T1055.014
    name_en: VDSO Hijacking
    implementation_dimension: A Linux target's vDSO mapping and execution path are altered to execute injected instructions.
    coverage_decision: niji-variable-candidate
    niji_axis: existing-flow-dispatch-substitution
    rationale: The target's already expected runtime execution path is reused and redirected; vDSO and Linux are media, while executable-backing divergence may be co-mapped if independently established.
  - attack_id: T1055.015
    name_en: ListPlanting
    implementation_dimension: ListView data and callback or sort messages are manipulated so a target GUI process invokes attacker-selected code.
    coverage_decision: niji-variable-candidate
    niji_axis: existing-flow-dispatch-substitution
    rationale: The target's existing UI callback and message dispatch substitutes for a conventional remote-thread start and shares the same correlation and mitigation owner.
  breadth_trigger: high-breadth-explicit-coverage-and-second-pass
  candidate_stealth_axes_examined:
  - axis: unbacked-payload-memory-embedding
    discovery_scope: ATT&CK-cluster-and-cross-classification
    disposition: formal
    attacker_control: The adversary chooses raw shellcode a manually mapped image or overwritten executable region and avoids a normal file-backed loader registration for the payload that executes in the target.
    sibling_boundary: The target is already running or is not classified by a manipulated birth image; ordinary LoadLibrary with an inspectable module remains parent core, while process-birth image mismatch belongs to the birth-time axis.
    trace_change: Executable private or modified memory contains code with no corresponding image file module-list entry or expected bytes and often leaves only allocation protection and memory-write state.
    defender_effect: File scanners module inventories and hash or signer rules do not see the payload and delayed disk collection loses it; defenders need event-time virtual-memory backing content and execution joins.
    prerequisites_and_scenarios: The source needs target memory access or an equivalent primitive and a dispatch path; reflective or raw-PE and shellcode injection are conclusion-supported examples.
    evidence_level: conclusion-level platform and field evidence
    evidence_refs: [B4-011-T1055-REF-01, B4-011-T1055-REF-02, B4-011-T1055-REF-06]
    defense_difference: Requires private or modified executable-memory inventory content or header analysis and file or module backing differential in addition to source-target access.
  - axis: existing-flow-dispatch-substitution
    discovery_scope: ATT&CK-cluster
    disposition: formal
    attacker_control: The adversary selects an existing or lifecycle-created target thread callback message or shared runtime entry and redirects or queues execution instead of creating a conventional remote thread at the payload address.
    sibling_boundary: A new remote thread with an honest payload start address remains parent core; the child requires proof that thread context callback order APC message or equivalent existing flow was substituted.
    trace_change: Remote-thread creation can be absent or show an expected start trampoline while instruction pointer call stack callback target or message-consumer state leads to injected memory.
    defender_effect: Detectors bound to CreateRemoteThread or the nominal PE entry point miss or misplace the start; defenders must version thread context call stacks callback tables and dispatch events.
    prerequisites_and_scenarios: A reachable target thread or callback must enter the required state such as suspended alertable initializing or message-consuming; thread hijack APC TLS and ListPlanting are implementation examples.
    evidence_level: conclusion-level field and technical evidence
    evidence_refs: [B4-011-T1055-REF-02, B4-011-T1055-REF-04]
    defense_difference: Requires before-and-after thread context and stack or callback-message lineage rather than only new-thread notification and memory-write telemetry.
  - axis: birth-time-image-provenance-divergence
    discovery_scope: ATT&CK-cluster-and-outside-taxonomy
    disposition: formal
    attacker_control: The adversary creates or controls a process before its first normal instruction and substitutes an image section entry point or transient backing state while retaining a benign or incomplete creation identity.
    sibling_boundary: Injection into an independently running target is excluded; the process must be born from or resume into content inconsistent with its recorded image path section file or initial memory.
    trace_change: Process creation callbacks path signature and parent tree identify a legitimate or unscannable image while the executed main image entry or backing bytes are malicious altered or no longer present.
    defender_effect: Creation-time file scans and path or signer allow rules classify the process as benign or receive no malicious file to scan; detection requires creation properties and image-section-to-memory consistency.
    prerequisites_and_scenarios: The source must control suspended or legacy process creation image sections or entry state; Dofoil hollowing and doppelganging ghosting research provide conclusion evidence.
    evidence_level: conclusion-level field and platform evidence
    evidence_refs: [B4-011-T1055-REF-03, B4-011-T1055-REF-05, B4-011-T1055-REF-08]
    defense_difference: Requires process-birth file object image section entry bytes and resume sequencing plus tampering events, distinct from generic access and remote memory writes.
  - axis: role-conforming-target-context-selection
    discovery_scope: outside-ATTACK-subtechnique-taxonomy
    disposition: formal
    attacker_control: The adversary selects a host process whose normal role already performs the payload's intended resource or network action and executes the payload under that process identity.
    sibling_boundary: Merely choosing a legitimate or elevated process is parent core; this child requires evidence that expected role and downstream action are aligned, such as browser-hosted network communication or service-hosted access to LSASS.
    trace_change: The same target process name token service role and ordinary resource class remain visible while the hidden source and injected payload disappear from point behavior attribution.
    defender_effect: Per-process behavior and allow or reputation rules see an expected action by an expected process; detection must join unexpected cross-process mutation and payload provenance to role-specific outcomes.
    prerequisites_and_scenarios: A suitable target must be present reachable compatible and able to perform the desired action; Mandiant red-team research and VEILEDSIGNAL browser injection establish controllability and field use.
    evidence_level: conclusion-level controlled and field evidence
    evidence_refs: [B4-011-T1055-REF-06, B4-011-T1055-REF-07]
    defense_difference: Requires role baselines that bind approved module or code provenance and expected source relationships to behavior rather than allow the process name or action alone.
  - axis: privileged-target-selection
    discovery_scope: TA0004-specific
    disposition: parent-core
    trace_change: Code executes with a target context whose effective resources can exceed the source context.
    defender_effect: A target-side privileged result can look like the expected process acting.
    rationale: Positive authority difference and first newly authorized result are mandatory TA0004 success gates for the parent, not optional stealth children; target access controls also mean injection does not itself prove elevation.
  - axis: writer-runner-provenance-separation
    discovery_scope: within-parent
    disposition: parent-core
    trace_change: Source-side access and memory changes precede target-side execution and effects under a different PID or thread.
    defender_effect: Point process views lose the original writer.
    rationale: Every qualifying process injection crosses source and target provenance, so this is the parent Behavioral Transparency mechanism rather than a sibling split.
  - axis: long-lived-target-lifecycle-extension
    discovery_scope: outside-ATTACK-taxonomy
    disposition: hypothesis
    trace_change: Payload migrates from an unstable source or browser into a long-lived process to survive source termination and widen the observation gap.
    defender_effect: Source triage ends before later target actions and current-state memory may outlive the initiating process.
    rationale: Microsoft documents process migration into long-lived winlogon for persistence, but current evidence does not separate lifecycle selection from the target-selection axis with an independent TA0004 defense owner; retain as hypothesis.
  - axis: multi-process-module-segmentation
    discovery_scope: ATT&CK-parent-outside-children
    disposition: evidence-deferred
    trace_change: Multiple injected processes divide payload modules and communicate over IPC so each host exposes only part of functionality.
    defender_effect: Per-process inspection and short graphs see incomplete behavior.
    rationale: ATT&CK describes the possibility, but the parent page cannot alone establish child existence and current field sources do not prove a stable attacker-controlled segmentation plan with a distinct defense beyond graph-wide parent detection.
  - axis: post-use-memory-restoration-or-self-removal
    discovery_scope: outside-ATTACK-taxonomy
    disposition: deferred
    trace_change: Modified bytes thread state handles or payload pages are restored or freed after execution while effects continue elsewhere.
    defender_effect: Delayed memory inspection loses the injection state.
    rationale: Cleanup has adjacent ownership and current evidence does not establish a T1055-specific stable boundary and target-specific mitigation.
  - axis: target-continues-benign-work-concurrently
    discovery_scope: outside-ATTACK-taxonomy
    disposition: parent-core
    trace_change: The host can continue its expected activity around injected execution.
    defender_effect: Legitimate and malicious outcomes interleave under one identity.
    rationale: Concurrent normal work contributes to host-identity borrowing, but without deliberate role alignment or a distinct timing control it is the parent mechanism.
  - axis: direct-syscall-api-hook-bypass
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: Source invokes injection primitives below or outside monitored user-mode API paths.
    defender_effect: API-hook telemetry loses the named call while kernel state changes remain.
    rationale: T1106 and its direct-syscall child own call-path visibility; T1055 owns the resulting cross-process mutation and execution and can co-map without duplicating that taxonomy.
  - axis: payload-encryption-packing-or-string-obfuscation
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: Payload bytes are encoded before event-time decryption or mapping.
    defender_effect: Static signatures and pre-execution scans weaken.
    rationale: Obfuscation or encrypted-content objects own representation before injection; unbacked executable state is classified separately only after target memory execution is established.
  - axis: dll-pe-apc-tls-ptrace-proc-window-vdso-listplanting-api-platform-tool-or-log-field
    discovery_scope: prohibited-mechanical-partitions
    disposition: rejected
    trace_change: Implementation names APIs structures paths or fields differ.
    defender_effect: Sensors vary by platform but the four stable observation variables do not.
    rationale: ATT&CK names and product platform medium API tool and field partitions are not Niji-native stealth boundaries.
  second_pass_required: true
  second_pass_completed: true
  second_pass_notes:
  - Re-clustered all twelve ATT&CK children by target memory backing, execution-dispatch carrier, and birth-time image provenance; ptrace procfs DLL PE and GUI structures resolve into parent or one of those observable states rather than new names.
  - Searched outside ATT&CK children for target-role conformity, long-lived migration, module segmentation, post-use restoration, concurrent benign work, direct syscalls, packing, privilege distance, and source-target graph breaks; only role-conforming target selection independently passed every gate.
  - Compared NJT-0077 same-process module instantiation, NJT-0072 request-driven IPC brokerage, NJT-0099 token carriers, NJT-0102 vulnerable transitions, NJT-0101 isolation crossing, NJT-0070 loader selection, and T1106 call-path visibility and preserved their owners.
  proposed_niji_child_count: 4
  final_formal_child_count: 4
  proposed_new_niji_child_count: 4
  why_not_more_zh: 十二项 ATT&CK 实现已全部落入父级、三个 trace-structure 轴或相邻技术；第二轮新增的 role-conforming target 通过门禁。长寿命迁移仍缺独立 TA0004 防御 owner，多进程分段只有父页描述而缺结论级案例，回退/清理归相邻对象，权限高度和 writer-runner 分离是父级成立条件，direct syscall 与 payload obfuscation 有相邻 owner，API、介质、平台、工具和字段分区被拒绝。因此没有第五轴同时满足稳定控制、边界、痕迹/观察改变、场景、证据与差异化防御。
  why_not_more_en: All twelve ATT&CK implementations resolve to parent core, one of three trace-structure axes, or an adjacent technique, and the second pass adds role-conforming target selection after it passes all gates. Long-lived migration lacks an independent TA0004 defense owner, multi-process segmentation has only parent-page description without a conclusion-level case, restoration or cleanup is adjacent, authority height and writer-runner separation are parent qualification, direct syscalls and payload obfuscation have adjacent owners, and API, medium, platform, tool, and field partitions are rejected. No fifth axis combines stable control, boundary, trace and observation change, scenario, evidence, and differentiated defense.
  why_not_fewer_zh: 四轴不能互相合并：无背衬轴改变 payload 可检查性并要求 VAD/backing/content；既有流调度轴改变 remote-thread/entrypoint 可见性并要求 context/stack/callback；创建期来源轴改变 process creation/file/image 一致性并要求 birth-time section 与 resume；角色贴合轴改变后继行为基线和归因并要求目标 role—approved code—action 联合。它们的控制键、反例、关联数据和缓解措施均不同，且各有结论级来源。
  why_not_fewer_en: The four axes cannot collapse into each other. Unbacked memory changes payload inspectability and requires VAD, backing, and content. Existing-flow dispatch changes remote-thread and entrypoint visibility and requires context, stack, and callback state. Birth-time provenance changes process-creation, file, and image consistency and requires section and resume evidence. Role conformity changes outcome baselines and attribution and requires target role, approved code, and action joins. Their control keys, counterexamples, correlation data, and mitigations differ, and each has conclusion-level sources.
  breadth_gap_explained: true
