research:
  limitations:
    paragraphs:
    - zh: 公开平台文档能证明 submitter、task definition 与 runtime principal 可以分离，也明确低权限 caller 不能任意选择高权限账户；因此“计划任务即提权”并不成立。现有四个恶意案例证明匿迹轴，却不提供事件时 submitter authorization set、实际 task token/service account 权限和首个 expected-deny/observed-allow 结果。正式 TA0004 结论必须依赖本地 telemetry，证据不足时只报告 scheduler anomaly、execution confirmed 或 authority unresolved。
      en: Public platform documentation proves that submitter, task definition, and runtime principal can differ and also that lower-authority callers cannot arbitrarily select higher-authority accounts, so scheduled task does not mean elevation. The four existing malicious cases prove stealth axes but do not provide event-time submitter authorization, actual task token or service-account permissions, and a first expected-deny to observed-allow result. A formal TA0004 conclusion requires local telemetry and otherwise remains a scheduler anomaly, execution confirmed, or authority unresolved.
    - zh: Windows 对 task principal/run level 的证据最直接；cron、systemd 与 Kubernetes 的官方资料证明 owner/User/ServiceAccount 和触发—运行语义，但不同发行版、unit manager、容器 runtime 与集群 RBAC 会改变实际授权。跨平台正文使用共同语义，不声称字段完全同形；尤其普通 user crontab、user timer 或 default ServiceAccount 常无正权限差。
      en: Windows provides the most direct evidence for task principal and run level. Official cron, systemd, and Kubernetes material establishes owner, User, or ServiceAccount and trigger-to-runtime semantics, but distributions, unit managers, container runtimes, and cluster RBAC change effective authorization. Cross-platform prose uses common semantics without claiming identical fields, and ordinary user crontabs, user timers, or default ServiceAccounts often have no positive authority difference.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [stored credential or logon-type selection as a stable stealth variable, established-task identity substitution with conclusion-level field evidence, multi-object task-chain graph segmentation]
