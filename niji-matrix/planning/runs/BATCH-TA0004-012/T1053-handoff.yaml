  name: {zh: 计划任务/作业, en: Scheduled Task/Job}
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: Enterprise ATT&CK 19.1 把 T1053 映射到 Execution、Persistence 和 Privilege Escalation，并说明任务可由调度器以指定且可能更高权限的账户上下文运行。TA0004 下复用 NJT-0075 的同一直接对象，但将成立链明确为 submitter/pre-state authority → exact scheduler object and definition version → admission/trigger → actual runtime principal/token/capabilities/service account → first attacker-controlled action → positive authority difference → first newly authorized resource result。任务名、SYSTEM/root 或 scheduler parent 单独不足。
      en: Enterprise ATT&CK 19.1 maps T1053 to Execution, Persistence, and Privilege Escalation and states that a scheduler can run a task under a specified and potentially higher-authority account context. TA0004 reuses NJT-0075's same direct object but makes the qualification chain explicit: submitter or pre-state authority, exact scheduler object and definition version, admission and trigger, actual runtime principal, token, capabilities, or service account, first adversary-controlled action, positive authority difference, and first newly authorized resource result. A task name, SYSTEM or root, or scheduler parent alone is insufficient.
    - zh: 固定五项子技术只作为实现宽度。现有四个 Niji 子项继续分别固定任务的资产/角色合形、注册到关键运行的观察窗口距离、标准视图与后端/执行差分，以及短事务与调度器父级代理。TA0004 权限门在每个轴链尾统一追加，不按 Windows/cron/systemd/CronJob、账户类型或权限高度重拆 taxonomy。公开 Guloader、Nitrokod、Tarrask 和 Serpent 案例证明四个匿迹变量，但没有完整 source/runtime 权限快照和首个新增授权结果，故具体事件不能自动宣称提权。
      en: The five fixed children are implementation breadth only. The four existing Niji children continue to fix asset or role conformity, observation-window distance from registration to critical run, standard-view versus backend or execution differential, and short-transaction scheduler-parent brokerage. The TA0004 authority gate is appended to each axis chain and does not repartition taxonomy by Windows, cron, systemd, CronJob, account type, or authority height. Public Guloader, Nitrokod, Tarrask, and Serpent cases establish the four stealth variables but lack complete source and runtime authority snapshots and a first newly authorized result, so they do not automatically prove event-level elevation.
