schema_version: 1.0.0
type: taxonomy-breadth-review
batch_ref: BATCH-TA0004-012
work_items:
- work_item_ref: WORK-TA0004-T1053
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 5
  attack_subtechnique_ids: [T1053.002, T1053.003, T1053.005, T1053.006, T1053.007]
  attack_dimensions:
  - attack_id: T1053.002
    name_en: At
    implementation_dimension: A platform queue stores a one-time command for later execution under the submitting or configured account.
    coverage_decision: parent-core
    rationale: At is a scheduler implementation; it can evidence long-horizon deferral or ephemeral one-shot brokerage only when attacker-selected timing or lifecycle crosses the corresponding observation gate.
  - attack_id: T1053.003
    name_en: Cron
    implementation_dimension: User or system crontab state binds calendar fields to a command and execution identity, with system tables able to name a user.
    coverage_decision: parent-core
    rationale: Cron syntax and ownership define trigger and runtime authority but do not themselves create stealth. Asset-conforming metadata or deliberate delay can co-map existing Niji axes when independently proved.
  - attack_id: T1053.005
    name_en: Scheduled Task
    implementation_dimension: Windows Task Scheduler stores triggers actions principals logon types run levels object ACLs and lifecycle state and runs actions through the service.
    coverage_decision: niji-variable-candidate
    niji_axes: [baseline-conforming-scheduled-activation, observation-window-deferred-activation, state-enumeration-suppressed-scheduled-registration, ephemeral-one-shot-scheduled-brokerage]
    rationale: Conclusion-level cases establish all four observation variables on this implementation; platform fields remain evidence and join keys rather than child names.
  - attack_id: T1053.006
    name_en: Systemd Timers
    implementation_dimension: A timer unit stores calendar or monotonic conditions and activates a service whose unit defines execution credentials and sandbox controls.
    coverage_decision: parent-core
    rationale: Timer and service form the parent definition-to-trigger-to-runtime chain. Randomized delay catch-up and transient units map existing axes only with attacker control and observed defensive effect; systemd is not a child boundary.
  - attack_id: T1053.007
    name_en: Container Orchestration Job
    implementation_dimension: A CronJob controller creates Jobs and Pods from a stored template whose ServiceAccount and security context determine workload identity.
    coverage_decision: parent-core
    rationale: CronJob Job and Pod are implementation layers. Conforming metadata delayed schedules view differentials or short-lived controller cleanup map existing axes only when their full gates are met; normal RBAC or TTL is not evasion.
  breadth_trigger: medium-breadth-open-search
  candidate_stealth_axes_examined:
  - axis: baseline-conforming-scheduled-activation
    discovery_scope: existing-Niji-cross-tactic-review
    disposition: formal
    attacker_control: The adversary selects names folders authors principals actions and cadence that conform to real local maintenance or workload patterns.
    sibling_boundary: The task remains enumerable and the dominant differential is semantic conformity rather than delay disappearance or short lifetime.
    trace_change: Visible task features and scheduler-parent execution resemble approved update backup monitoring or CronJob objects.
    defender_effect: Name signer parent-account or global-rarity rules accept the object and later privileged outcome as routine scheduler activity.
    prerequisites_and_scenarios: Requires local inventory or role knowledge plus scheduler write authority; Guloader field evidence and operational detection guidance support the axis but not an event-specific authority gain.
    evidence_level: conclusion-level stealth evidence plus local authority gate
    evidence_refs: [REF-000127, REF-000262, REF-000266, B4-012-T1053-REF-01, B4-012-T1053-REF-02, B4-012-T1053-REF-03, B4-012-T1053-REF-04]
    defense_difference: Requires asset-role and approved-definition baselines joined to submitter pre-state runtime principal and first resource result.
  - axis: observation-window-deferred-activation
    discovery_scope: existing-Niji-cross-tactic-review
    disposition: formal
    attacker_control: The adversary selects a trigger or chain that places first critical execution beyond sandbox triage or routine correlation retention.
    sibling_boundary: The object can remain visible; the defining variable is intentional registration-to-critical-run distance rather than object appearance or deletion.
    trace_change: Submitter and definition occur in one window while scheduler runtime and any authority result appear after the original process session or alert closes.
    defender_effect: Short-window detection cannot join lower-authority writer to the later scheduler principal and protected-resource result.
    prerequisites_and_scenarios: Requires reliable scheduler state and tolerance for delay; Nitrokod directly demonstrates the observation-window effect but not TA0004 authority gain.
    evidence_level: conclusion-level stealth evidence plus local authority gate
    evidence_refs: [REF-000127, REF-000260, REF-000264, REF-000265, B4-012-T1053-REF-01, B4-012-T1053-REF-02, B4-012-T1053-REF-03, B4-012-T1053-REF-04]
    defense_difference: Requires future-run watchlists and retention through first result in addition to submitter runtime-principal authorization comparison.
  - axis: state-enumeration-suppressed-scheduled-registration
    discovery_scope: existing-Niji-cross-tactic-review
    disposition: formal
    attacker_control: The adversary changes metadata or permissions used by standard management views while preserving state consumed by the scheduler.
    sibling_boundary: The object remains runnable and can be found in independent raw state or runtime despite absence from the supported standard view.
    trace_change: Routine inventory reports no task while backend registration scheduler execution and a potentially privileged outcome continue.
    defender_effect: A defender trusting one API cannot join the hidden definition to runtime authority and first result.
    prerequisites_and_scenarios: Requires backend or ACL knowledge and sufficient authority; Tarrask directly proves the Windows view differential, while non-Windows inheritance needs local three-way evidence.
    evidence_level: conclusion-level stealth evidence plus local authority gate
    evidence_refs: [REF-000127, REF-000259, REF-000263, B4-012-T1053-REF-01]
    defense_difference: Requires independent privileged read-only enumeration and raw-state to runtime differential before the authority comparison.
  - axis: ephemeral-one-shot-scheduled-brokerage
    discovery_scope: existing-Niji-cross-tactic-review
    disposition: formal
    attacker_control: The adversary creates triggers runs and deletes a one-shot object within a short transaction and delegates launch to the scheduler.
    sibling_boundary: The object is actually removed after one run; durable hidden objects belong to enumeration suppression and long waits to deferred activation.
    trace_change: Later inventory has no object and process lineage starts at a trusted scheduler or controller rather than the original submitter.
    defender_effect: Snapshot and parent-process logic lose both registration and true initiator and can attribute a privileged result to a normal broker.
    prerequisites_and_scenarios: Requires create trigger and delete authority plus precise coordination; Serpent directly establishes detection-bypass intent while platform one-shot jobs show implementation semantics.
    evidence_level: conclusion-level stealth evidence plus local authority gate
    evidence_refs: [REF-000127, REF-000261, REF-000263, REF-000265, B4-012-T1053-REF-01, B4-012-T1053-REF-04]
    defense_difference: Requires minute-scale create-run-delete and scheduler-child correlation plus retention of deleted definitions and authority outcomes.
  - axis: execution-principal-or-service-account-selection
    discovery_scope: TA0004-specific
    disposition: parent-core
    trace_change: The scheduler runs the action under a configured account token capabilities namespace or ServiceAccount that can differ from the submitter.
    defender_effect: Resource logs see a normally authorized scheduled principal and can lose the lower-authority writer.
    rationale: A positive authority difference and first expected-deny observed-allow result are mandatory TA0004 gates for every child and the parent. Authority height is not optional stealth taxonomy; platform controls often prevent low-authority callers from selecting higher principals.
  - axis: scheduler-broker-parentage
    discovery_scope: within-parent
    disposition: parent-core
    trace_change: Runtime process or Pod descends from taskhost cron systemd or a controller instead of the original submitter.
    defender_effect: Point process trees attribute launch to a trusted scheduler.
    rationale: Every qualifying scheduled execution delegates launch, while NJS-0075-004 becomes distinct only when short lifetime and deliberate state-scan evasion are also proved.
  - axis: established-task-identity-substitution
    discovery_scope: outside-ATTACK-taxonomy
    disposition: evidence-deferred
    trace_change: An existing approved task ID name and schedule remain while its action or principal is replaced and later restored.
    defender_effect: New-object rules do not fire and runtime retains established identity.
    rationale: The variable could have an independent old-new definition defense, but current conclusion-level sources in this batch establish name conformity or object creation rather than a field case proving deliberate established-object substitution with stable boundaries; keep deferred rather than force it into baseline conformity.
  - axis: stored-credential-or-logon-type-selection
    discovery_scope: TA0004-and-platform-semantics
    disposition: hypothesis
    trace_change: Password S4U interactive token group or ServiceAccount token mode changes which credential material and logon artifacts appear.
    defender_effect: Some authentication events or credential stores differ while runtime authority can remain equal.
    rationale: Platform documentation proves controllability and constraints, but current evidence does not show a durable stealth boundary and target-specific defense independent of the parent authority gate and credential objects.
  - axis: randomized-jitter-catch-up-or-event-trigger-class
    discovery_scope: within-and-cross-classification
    disposition: parent-core
    trace_change: Trigger time varies or follows boot logon event or controller reconciliation.
    defender_effect: Fixed-time expectations weaken.
    rationale: Intentional timing outside observation windows maps NJS-0075-002 and role-conforming cadence maps NJS-0075-001; normal RandomizedDelay catch-up or event class is not independently stealth-distinct.
  - axis: remote-scheduled-submission
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: Definition writer and target scheduler exist on different systems or planes.
    defender_effect: Local target logs may show a management principal or scheduler only.
    rationale: Remote Services lateral movement and credential or management-plane objects own remote access; scheduler behavior co-maps without creating a new T1053 child.
  - axis: interpreter-proxy-or-workflow-action
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: The scheduled action uses an interpreter signed proxy WMI provider CI workflow or loader indirection.
    defender_effect: Action provenance can appear legitimate or add another broker.
    rationale: T1059 NJT-0072 T1218 T1677 and loader objects own the action path; the scheduler owns definition trigger runtime lineage.
  - axis: post-run-restoration-history-or-log-removal
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: Task definition history audit or payload is restored deleted or cleared after execution.
    defender_effect: Delayed investigation loses direct evidence.
    rationale: NJS-0075-004 owns rapid task deletion only as part of the create-run-delete broker transaction; generic log or indicator removal has a separate owner.
  - axis: at-cron-scheduled-task-systemd-cronjob-platform-product-command-field
    discovery_scope: prohibited-mechanical-partitions
    disposition: rejected
    trace_change: Scheduler names syntax APIs and telemetry fields differ.
    defender_effect: Sensors and normalization vary but the four observation variables remain stable.
    rationale: ATT&CK child names platform product API command target type and log-field partitions are not Niji-native stealth boundaries.
  second_pass_required: false
  second_pass_completed: true
  second_pass_notes:
  - Re-checked the five fixed ATT&CK children by stored definition trigger runtime identity and result rather than importing their platform names; all resolve to parent core or one or more of the existing four axes only when the full axis gate is proved.
  - Searched across classification and outside ATT&CK for execution-principal selection broker parentage established-task identity substitution credential or logon mode jitter catch-up remote submission action indirection multi-object chaining and post-run restoration; none supports a fifth formal child under present evidence.
  - Compared service definition NJT-0089 event-trigger NJT-0090 interpreter and broker objects workflow execution T1677 token/account objects and remote-service ownership, preserving their direct objects and allowing co-mapping.
  proposed_niji_child_count: 4
  final_formal_child_count: 4
  proposed_new_niji_child_count: 0
  why_not_more_zh: 既有任务身份替换缺结论级 field case，存储凭据/登录类型仍是 hypothesis；execution principal 是 TA0004 父级结果门，scheduler parentage 是父级共有机制，jitter/catch-up 收敛到合形或延期，remote submission、action proxy、credential/token 与 post-run cleanup 有相邻 owner，平台/API/命令/字段分区被拒绝。因此没有第五轴同时通过控制、持久边界、痕迹与观察改变、场景、结论证据和差异化防御门。
  why_not_more_en: Established-task identity substitution lacks a conclusion-level field case and stored credential or logon type remains a hypothesis. Execution principal is the TA0004 parent outcome gate, scheduler parentage is common parent mechanism, jitter and catch-up converge into conformity or delay, remote submission, action proxies, credentials or tokens, and post-run cleanup have adjacent owners, and platform, API, command, and field partitions are rejected. No fifth axis passes controllability, durable boundary, trace and observation change, scenario, conclusion evidence, and differentiated defense together.
  why_not_fewer_zh: 四轴不能合并：合形需要资产/角色完整定义基线；延期需要 future-trigger watchlist 与长保留；枚举抑制需要标准视图—原始状态—执行三方差分；短驻代理需要分钟级 create→trigger→run→delete 与调度器子进程关联。四者的控制键、反例、窗口和缓解不同，并各有结论级 stealth 来源；TA0004 只在每条链尾追加统一权限结果门，不消除这些差异。
  why_not_fewer_en: The four axes cannot collapse. Conformity requires asset and role full-definition baselines, delay requires future-trigger watchlists and long retention, enumeration suppression requires a three-way standard-view, raw-state, and execution differential, and ephemeral brokerage requires minute-scale create-to-trigger-to-run-to-delete and scheduler-child correlation. Their control keys, counterexamples, windows, and mitigations differ and each has conclusion-level stealth sources. TA0004 adds a common authority-result gate at each chain end without removing those differences.
  breadth_gap_explained: true
