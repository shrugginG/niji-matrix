  insufficient_indicators: [credential-possession-alone, successful-logon-alone, admin-root-or-privileged-label-alone, event-4672-alone, privileged-resource-event-without-controller-lineage, anomalous-origin-alone, unauthenticated-to-authenticated-initial-access, same-authority-principal-swap, account-or-authenticator-mutation-without-use]
  local_evidence_requirement: Formal TA0004 attribution requires local event-time pre-state and resulting authorization evidence plus attacker continuity; public campaign reports can establish valid-account behavior or architecture without automatically satisfying the event-level gate.
