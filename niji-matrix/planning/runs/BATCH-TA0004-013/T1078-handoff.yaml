research:
  limitations:
    paragraphs:
    - zh: 公开 ATT&CK 与平台资料证明有效身份可获得更高权限，并说明如何从登录、实际 token/privilege 到资源访问建立关联；Storm-0501 报告还给出从已控本地域账户到云端 Global Administrator 身份/会话的混合环境路径。但公开材料通常没有攻击者同一控制者的事件级连续标识、完整 pre-state authorization set 和首个 expected-deny/observed-allow 决议，因此具体事件必须依赖本地 telemetry，缺失时保持 valid_identity_use、authority_unresolved 或 initial_access_only。
      en: Public ATT&CK and platform material establishes that valid identities can yield higher access and shows how to join logon actual token or privilege and resource use. The Storm-0501 report also provides a hybrid path from a controlled on-premises domain account to a cloud Global Administrator identity or session. Public material usually lacks an event-level continuity identifier for the same adversary controller a complete pre-state authorization set and the first expected-deny to observed-allow decision so concrete events require local telemetry and otherwise remain valid_identity_use authority_unresolved or initial_access_only.
    - zh: 低反馈轴由 ATT&CK 对 inactive account 的父级描述与 Microsoft 对休眠敏感用户、休眠服务账户和缺少交互监控的高权 service account 指导共同支持；来源明确风险、静默/低监控效果与专门缓解，但未发布每次攻击者选择的内部意图。因此它作为正式稳定观察轴保留，结论和机制置信度为 medium；只有证明攻击者可选择该身份、其活动/所有者反馈确实较弱且账户仍具有效授权时才分类。
      en: The low-feedback axis is supported jointly by the ATT&CK parent treatment of inactive accounts and Microsoft guidance on dormant sensitive users stale service accounts and privileged service accounts lacking interactive monitoring. The sources establish risk quiet or weak-monitoring effect and specialized mitigation but do not publish the actor's internal intent for every selection. It remains a formal stable observation axis with medium confidence and is classified only when the adversary can select the identity its activity or owner feedback is demonstrably weak and the account still holds valid authorization.
  canonical_prose_bulk_generated: false
  unresolved_hypotheses: [role-conforming privileged operation selection, low-rate or business-hour valid-account use as an independent axis]
