recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: Enterprise ATT&CK 19.1 将 T1078 映射到 Privilege Escalation，并说明既有有效账户可能授予受限系统或网络区域的更高权限。TA0004 下复用 NJT-0061 的同一有效身份/会话直接对象，但把成立链限制为攻击者已控制的较低权限前态 → 未修改的精确有效凭据或已认证会话 → 认证或会话继续被接受 → 实际 resulting principal/session/token 与事件时授权集合 → 同一相关安全边界内正权限差 → 首个攻击者控制资源操作 → 对前态 expected-deny、对结果 observed-allow。仅从未认证状态成功登录属于 Initial Access；admin 标签、成功认证、敏感权限事件或高权资源事件均不能单独证明提权。
      en: Enterprise ATT&CK 19.1 maps T1078 to Privilege Escalation and states that an existing valid account can grant higher access to restricted systems or network areas. TA0004 reuses the same valid identity or session object in NJT-0061 but restricts qualification to an adversary-controlled lower-authority pre-state, the exact unchanged valid credential or authenticated session, accepted authentication or session continuation, the actual resulting principal session or token and event-time authorization set, a positive authority difference within the same relevant security boundary, the first adversary-controlled resource operation, and an expected-deny for the pre-state becoming observed-allow for the result. A successful logon from an unauthenticated state belongs to Initial Access; an admin label successful authentication sensitive-privilege event or privileged-resource event alone does not prove elevation.
    - zh: 固定四项 ATT&CK 子技术只提供账户实现宽度，不导入 taxonomy。现有“情境贴合的新登录”和“既有认证会话续用”分别改变风险情境与认证事件密度并继续保留；开放搜索另确认“低反馈身份选择”——选择休眠用户、无人值守服务或其他缺少活跃所有者反馈的有效身份——具有独立历史痕迹、观察效果和账户生命周期防御，故新增一个 Niji 子项并以 medium 置信度校准。角色贴合的高权操作和低速使用证据不足，分别 defer 与 hypothesis。
      en: The four fixed ATT&CK children provide account-implementation breadth only and are not imported into the taxonomy. Existing context-aligned new sign-in and established-session reuse remain because they separately change risk context and authentication-event density. Open search additionally confirms low-feedback identity selection: choosing a dormant user unattended service or another valid identity lacking active owner feedback. It has independent historical traces observation effects and account-lifecycle defenses so one Niji child is added with calibrated medium confidence. Role-conforming privileged operation and low-rate use lack sufficient evidence and remain deferred and hypothesis respectively.
