schema_version: 1.0.0
type: taxonomy-breadth-review
batch_ref: BATCH-TA0004-013
work_items:
- work_item_ref: WORK-TA0004-T1078
  attack_baseline: {domain: enterprise-attack, version: '19.1'}
  attack_subtechnique_count: 4
  attack_subtechnique_ids: [T1078.001, T1078.002, T1078.003, T1078.004]
  attack_dimensions:
  - attack_id: T1078.001
    name_en: Default Accounts
    implementation_dimension: Built-in or integration-created operating-system device application cloud root or workload accounts can retain preset names credentials or privileged access.
    coverage_decision: parent-core
    rationale: Default provenance is an account lifecycle and credential-management condition rather than a stealth boundary. It can co-map low-feedback selection only when the attacker deliberately selects an unused or unattended identity and the feedback differential is evidenced.
  - attack_id: T1078.002
    name_en: Domain Accounts
    implementation_dimension: Centrally managed directory identities authenticate across joined systems and may carry nested group delegated or administrative permissions.
    coverage_decision: parent-core
    rationale: Directory scope and account class define where the valid principal is accepted. Context alignment established-session reuse and low-feedback selection can each occur, but the Domain label alone changes neither trace semantics nor defensive effect.
  - attack_id: T1078.003
    name_en: Local Accounts
    implementation_dimension: A host or service local identity authenticates within its own security database, with credential reuse sometimes extending the same secret across systems.
    coverage_decision: parent-core
    rationale: Local scope and password reuse are implementation or credential conditions. A local account enters a Niji axis only through a proved context session or feedback variable; cross-host reuse also requires the relevant lateral-movement owner.
  - attack_id: T1078.004
    name_en: Cloud Accounts
    implementation_dimension: Human workload federated guest or managed cloud identities authenticate to provider control planes applications and resources through passwords keys certificates or tokens.
    coverage_decision: parent-core
    rationale: Cloud identity and credential forms are implementation breadth. Provider sign-in resource and session telemetry can prove the parent authority chain and one or more Niji axes without making Cloud Accounts a Niji child.
  breadth_trigger: medium-breadth-open-search
  candidate_stealth_axes_examined:
  - axis: context-aligned-identity-sign-in
    discovery_scope: existing-Niji-and-cross-provider-review
    disposition: formal
    attacker_control: The adversary chooses origin network geography client device and timing to fit the selected identity's historical access context.
    sibling_boundary: A new authentication chain remains observable; the defining variable is risk-context similarity rather than omission of authentication or absence of owner feedback.
    trace_change: Sign-in origin device client and time move toward the victim identity baseline and away from impossible-travel new-device or hosting-provider outliers.
    defender_effect: Single-event geography and reputation rules lose discrimination and require identity history provider-side risk and downstream resource correlation.
    prerequisites_and_scenarios: Requires usable credentials plus knowledge or control of victim-local network device or timing conditions; residential-proxy field reports directly establish the origin component.
    evidence_level: conclusion-level field evidence
    evidence_refs: [REF-000111, REF-000112]
    defense_difference: Requires per-identity context baselines and multi-signal origin device client time and resource joins rather than account-state or session-lineage controls.
  - axis: established-authenticated-session-reuse
    discovery_scope: existing-Niji-and-session-control-review
    disposition: formal
    attacker_control: The adversary possesses and reuses a still-accepted cookie access token refresh token or browser session state instead of starting a fresh primary-authentication chain.
    sibling_boundary: New credential authentication belongs to context alignment when shaped; this axis requires continuity of prior authenticated state and absence or reduction of new primary authentication or MFA.
    trace_change: Resource requests retain an existing session or token lineage while a fresh logon and MFA sequence is absent delayed or represented only by refresh.
    defender_effect: Authentication-only analytics can see no new sign-in and resource providers may attribute actions to an already accepted user session.
    prerequisites_and_scenarios: Requires valid unexpired or refreshable session material and a relying party that still accepts it; token-theft field evidence and platform session semantics establish the variable and its revocation limits.
    evidence_level: conclusion-level field and platform evidence
    evidence_refs: [REF-000070, REF-000067, B4-013-T1078-REF-05]
    defense_difference: Requires session token and resource lineage continuous evaluation device or token binding and full-session revocation rather than only sign-in anomaly scoring.
  - axis: low-feedback-identity-selection
    discovery_scope: outside-ATTACK-child-taxonomy
    disposition: formal
    attacker_control: The adversary deliberately selects a valid identity with no recent legitimate use or weak active-owner and interactive-monitoring feedback and preserves that condition until use.
    sibling_boundary: The origin may be anomalous and the request may use either a new sign-in or an existing session; classification depends on absent or weak ownership feedback and historical legitimate-use activity rather than source similarity or session continuity.
    trace_change: Malicious use appears after a long zero-use interval or inside unattended service activity without contemporaneous owner sessions reports or interaction conflicts.
    defender_effect: Defenses relying on user reporting active-peer comparison or routinely monitored interactive identities receive little corroboration and may leave standing sensitive access unchallenged.
    prerequisites_and_scenarios: Requires discovery and control of a stale sensitive user guest or service identity whose access remains enabled; official account-posture guidance explicitly identifies dormant and unattended privileged identities as quiet or discreet access paths.
    evidence_level: conclusion-level official guidance plus bounded inference about adversary selection
    evidence_refs: [REF-000094, B4-013-T1078-REF-06]
    defense_difference: Requires accountable ownership dormancy and dependency inventories first-use-after-silence detection removal of stale access and restrictions on service-account interactive use.
  - axis: authority-bearing-account-or-role-selection
    discovery_scope: TA0004-specific
    disposition: parent-core
    trace_change: The resulting accepted principal or session has a larger effective authorization set than the attacker's prior controlled state.
    defender_effect: Resource logs can show an ordinarily authorized privileged identity while hiding the continuity from the lower-authority controller.
    rationale: A positive effective-authority difference and first expected-deny to observed-allow result are mandatory TA0004 qualification gates for every child and the parent. Authority height is not an optional stealth partition.
  - axis: role-conforming-privileged-operation-selection
    discovery_scope: outside-ATTACK-taxonomy
    disposition: evidence-deferred
    trace_change: The adversary limits actions to resources and verbs expected for the selected privileged role so both identity and downstream behavior resemble normal work.
    defender_effect: Per-account behavior rules may accept the action and need role intent change or upstream controller evidence.
    rationale: The variable is plausible and attacker controllable but current T1078 sources establish valid identity use and authority outcomes without conclusion-level proof of a stable deliberate role-conformity plan or a defense boundary independent of the parent role-resource baseline.
  - axis: low-rate-or-business-hour-account-use
    discovery_scope: outside-ATTACK-taxonomy
    disposition: hypothesis
    trace_change: Requests are spread across time or scheduled inside expected user hours.
    defender_effect: Burst and off-hours rules weaken.
    rationale: Timing can combine with context alignment or NM-ST but present evidence does not establish a T1078-specific stable partition and distinct mitigation beyond identity-history correlation.
  - axis: credential-or-session-acquisition-method
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: Password cookie token certificate or key material is stolen guessed purchased phished or extracted before use.
    defender_effect: Acquisition telemetry appears in endpoint network or credential stores before authentication.
    rationale: Credential Access Resource Development and web-session-cookie owners classify acquisition. T1078 owns accepted use of an unchanged valid artifact and can co-map without duplicating how it was obtained.
  - axis: account-authenticator-or-permission-mutation
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: An existing account gains a new password key MFA method role group or delegated grant before use.
    defender_effect: Directory control-plane changes can expose the transition.
    rationale: NJT-0083 owns account-state and authorization mutation. T1078 begins when the resulting valid identity is actually used; the two can co-map.
  - axis: runtime-token-identity-manipulation
    discovery_scope: cross-classification
    disposition: adjacent
    trace_change: A process or thread token is duplicated impersonated filtered or otherwise altered after operating-system authentication.
    defender_effect: Runtime security-context lineage changes even if no new external sign-in occurs.
    rationale: NJT-0099 owns runtime token manipulation. Reusing an already authenticated remote or cloud session remains NJS-0061-002 only when its accepted session state is not itself modified.
  - axis: authentication-protocol-factor-or-strength
    discovery_scope: implementation-and-control-review
    disposition: parent-core
    trace_change: Password certificate key MFA legacy or federated authentication produces different fields and assurance.
    defender_effect: Sensors policy and bypass resistance vary.
    rationale: Authentication form is a prerequisite and mitigation dimension but not inherently a stealth variable. Manipulating the authentication process has an adjacent owner; ordinary differences do not define Niji children.
  - axis: default-domain-local-cloud-platform-product-protocol-account-target-or-log-field
    discovery_scope: prohibited-mechanical-partitions
    disposition: rejected
    trace_change: Account scope provider credential syntax and telemetry field names differ.
    defender_effect: Collection and normalization vary while the three formal observation variables remain stable.
    rationale: ATT&CK child names platform product protocol account class target type and log-field partitions are not Niji-native stealth boundaries.
  second_pass_required: false
  second_pass_completed: true
  second_pass_notes:
  - Re-checked all four fixed ATT&CK children by identity lifecycle authentication or session acceptance actual principal authorization and protected-resource result; all are implementation breadth or parent qualification rather than Niji child names.
  - Searched beyond the ATT&CK taxonomy for owner feedback dormancy unattended service identities role-conforming operations low-rate timing cross-environment authority overlap credential acquisition account mutation runtime-token manipulation and factor selection; only the feedback-state axis independently passes every formal gate.
  - Compared NJT-0083 account mutation NJT-0099 runtime token manipulation NJT-0098 temporary elevation remote-service and Credential Access owners and preserved their direct objects while allowing evidence-based co-mapping.
  proposed_niji_child_count: 3
  final_formal_child_count: 3
  proposed_new_niji_child_count: 1
  why_not_more_zh: 高权账户/角色选择与正权限差是 TA0004 父级成立门，不是可选匿迹轴；角色贴合操作缺少独立结论级 field evidence，低速/业务时段仍是 hypothesis；凭据取得、账户/认证器/权限变更和 runtime token 操纵有相邻 owner，认证因子是控制维度，四种 ATT&CK 账户范围以及产品、协议和字段分区均被拒绝。因此没有第四轴同时通过攻击者控制、稳定边界、痕迹与观察改变、场景、结论证据和差异化防御门。
  why_not_more_en: Privileged-account or role selection and a positive authority difference are TA0004 parent qualification rather than optional stealth axes. Role-conforming operation lacks independent conclusion-level field evidence and low-rate or business-hour use remains a hypothesis. Credential acquisition account authenticator or permission mutation and runtime-token manipulation have adjacent owners authentication factor is a control dimension and the four ATT&CK account scopes plus product protocol and field partitions are rejected. No fourth axis passes adversary control durable boundary trace and observation change scenario conclusion evidence and differentiated defense together.
  why_not_fewer_zh: 三轴不能合并：情境贴合改变新登录的来源/设备/时间风险并要求逐身份情境基线；会话续用省略或减少新认证链并要求 token/session/resource 连续谱系与撤销；低反馈身份选择改变合法使用历史和所有者/交互监控反馈并要求账户生命周期、责任人、依赖关系及首次复用控制。三者可组合但控制键、反例、残余痕迹、检测数据和缓解动作均不同，且分别有结论级或经校准的官方证据。
  why_not_fewer_en: The three axes cannot collapse. Context alignment changes source device and time risk on a new sign-in and requires per-identity context baselines. Session reuse omits or reduces a new authentication chain and requires token session and resource lineage plus revocation. Low-feedback identity selection changes legitimate-use history and owner or interactive-monitoring feedback and requires account lifecycle ownership dependencies and first-reuse controls. They can combine but have different control keys counterexamples residuals detection data and mitigation actions and each has conclusion-level or calibrated official support.
  breadth_gap_explained: true
