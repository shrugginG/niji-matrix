  name: {zh: 诱捕环境识别与规避, en: Deception-Environment Identification and Evasion}
recommendation:
  decision: add
  confidence: high
  rationale:
    paragraphs:
    - zh: 远程诱捕判真及其对能力暴露的影响直接改变防守方能否观察完整攻击链，且与普通侦察和主机内沙箱规避具有稳定边界。HoneyIoT 提供判真、拉黑或终止与载荷暴露之间的直接对照，IoT-BDA 支持反蜜罐行为并非单一实现。
      en: Remote deception assessment and its effect on capability exposure directly change whether defenders can observe
        the complete attack chain and have stable boundaries from ordinary reconnaissance and in-host sandbox evasion. HoneyIoT
        provides a direct contrast among assessment, blacklisting or termination, and payload exposure, while IoT-BDA shows
        that anti-honeypot behavior is not limited to one implementation.
