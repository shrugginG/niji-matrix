  limitations:
    paragraphs:
    - zh: 实证集中于物联网与智能电网环境，跨行业推广取决于攻击者是否掌握可靠领域基线。没有对照会话时，未见载荷不能单独证明条件化能力保留；缺少结论级攻击者证据时，纵向部署画像保持 hypothesis。
      en: Empirical evidence is concentrated in IoT and smart-grid environments, and cross-sector generalization depends on
        whether the adversary has a reliable domain baseline. Without comparable sessions, an absent payload alone does not
        establish conditional capability withholding; without conclusion-level adversary evidence, longitudinal deployment
        profiling remains a hypothesis.
