  explanation_zh: 旧前三项按技术表面拆分，现合并为会话内跨表面响应约束变量。第二项不再以来源数量和低频率定义，而收窄为相关节点与部署变更的纵向画像；其公开攻击者证据不足，因此明确保持 hypothesis。第三项收窄为真实性反馈后的终止、拒绝投递或关键能力不暴露，不再包含一般延迟、伪装或基础设施切换。三项分别由 DET-000101、DET-000120 和 DET-000121 直接覆盖。
  explanation_en: The first three historical surface partitions remain merged into a within-session cross-surface response-constraint
    variable. The second child no longer uses origin count or low frequency as its definition and is narrowed to longitudinal
    profiling across related nodes and deployment changes; it remains an explicit hypothesis because public adversary evidence
    is insufficient. The third child is narrowed to termination, refusal to deliver, or non-exposure of critical capability
    after authenticity feedback and no longer includes general delay, disguise, or infrastructure switching. DET-000101,
    DET-000120, and DET-000121 directly cover the three children respectively.
