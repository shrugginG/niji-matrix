    resolution: evidence-deferred
    reason_zh: 它们可能减少重复步骤或中间工件，但当前缺少攻击者结论级证据和独立缓解边界。
    reason_en: They may reduce repeated steps or intermediate artifacts, but conclusion-level adversary evidence and an independent
      mitigation boundary are lacking.
  - axis: 基础镜像与构建产品
    resolution: not-stealth-distinct
    reason_zh: 这些是载体与实现，不改变调用者至输出摘要和部署的观察链。
