  coverage:
  - axis: 直接 DASD、块设备、卷影副本、备份语义与网络设备存储命令
    resolution: parent-core
    reason_zh: Microsoft 句柄语义与 CISA 案例支持替代存储视图绕开活动文件路径；各实现均需连接视图、敏感对象映射与后继结果，防御变量可互换。
    reason_en: Microsoft handle semantics and the CISA case support alternative storage views bypassing the live-file path.
      Each implementation requires the same join among view, sensitive-object mapping, and successor outcome, so their defense
      variable is interchangeable.
  - axis: 未分配空间读取
    resolution: adjacent-technique
    reason_zh: 若不以绕过活动文件视图为目的，则属于取证恢复或数据收集；现有证据不支持单独匿迹边界。
    reason_en: Without the purpose of bypassing a live-file view, this is forensic recovery or data collection. Current evidence
      does not support a separate stealth boundary.
  - axis: 平台、工具、介质、目标文件与读写方向
    resolution: not-stealth-distinct
    reason_zh: 它们是父级链条的实现或对象差异，不改变检测所需的视图—对象—结果关系。
    reason_en: These are implementation or object differences within the parent chain and do not change the required view-to-object-to-outcome
      relationship.
