    reason_zh: EnvyScout 直接证明路径与用户代理属性匹配控制载荷投递，需要恢复比较并做匹配/失配后继差分。
    reason_en: EnvyScout directly establishes path and user-agent attribute matches controlling payload delivery, requiring
      comparison recovery and matched-versus-unmatched successor differential.
  - axis: 环境派生密码激活
    resolution: niji-variable-candidate
    target_ref: NJS-0109-002
    reason_zh: Gauss 直接证明环境值经过重复 MD5 派生 RC4 密钥并保护载荷区段，需要环境材料—派生—解密—后继谱系。
    reason_en: Gauss directly establishes environmental values passing through repeated MD5 to derive an RC4 key protecting
      payload sections, requiring environment-material-to-derivation-to-decryption-to-successor lineage.
  - axis: 通用互斥与单实例控制
    resolution: not-stealth-distinct
    reason_zh: 创建互斥并在已存在时退出通常只表达功能性单实例语义；缺少目标选择、能力保留与独立检测边界时不继承 T1480.002。
    reason_en: Creating a mutex and exiting when it already exists usually expresses functional single-instance semantics.
      T1480.002 is not inherited without target selection, capability withholding, and an independent detection boundary.
  - axis: 条件字段、平台、算法、客户端或服务端位置
    resolution: not-stealth-distinct
    reason_zh: 它们分别是两项正式变量的载体与实现，不各自形成兄弟边界。
    reason_en: These are carriers and implementations of the two formal variables and do not each form sibling boundaries.
