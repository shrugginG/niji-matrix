    attack_subtechnique_ids: [T1055.001, T1055.002, T1055.003, T1055.004, T1055.005, T1055.008, T1055.009, T1055.011, T1055.012, T1055.013, T1055.014, T1055.015]
    rationale_zh: 目标角色贴合是可与任一注入实现组合的正交选择变量，用于判断攻击者是否借用目标业务角色和网络基线，不替代前三项执行机制边界。
    rationale_en: Target-role conformity is an orthogonal selection variable that can combine with any injection implementation and determines whether the adversary borrows the target's business role and network baseline without replacing the first three execution-mechanism boundaries.
  breadth_gap_explanation_zh: 十二项实现均由 NJT-0103 四个既有变量覆盖，部分事件可同时属于执行机制子项和角色选择子项；无需在 TA0005 复制对象。
  breadth_gap_explanation_en: All twelve implementations are covered by four existing NJT-0103 variables. An event can belong to both an execution-mechanism child and the role-selection child, so no TA0005 duplicate is required.
