    attack_subtechnique_ids: [T1027.002, T1027.010, T1027.013, T1027.015, T1027.018]
    rationale_zh: 打包、命令混淆、加密/编码、压缩和不可见字符都可通过逐层逆变换恢复规范语义。
    rationale_en: Packing, command obfuscation, encrypted or encoded content, compression, and invisible characters recover canonical semantics through layered inverse transformation.
  - niji_child_ref: NJS-0115-002
    attack_subtechnique_ids: [T1027.001, T1027.005, T1027.008, T1027.014, T1027.016]
    rationale_zh: 填充、指标移除、符号剥离、多态和垃圾代码保持功能但改变静态结构与统计特征。
    rationale_en: Padding, indicator removal, stripped payloads, polymorphism, and junk code preserve function while changing static structure and statistical features.
  - niji_child_ref: NJS-0115-003
    attack_subtechnique_ids: [T1027.003, T1027.006, T1027.009, T1027.011, T1027.012, T1027.017]
    rationale_zh: 隐写、HTML/SVG 走私、嵌入载荷、LNK 图标和以载体承载的无文件存储都要求专用提取器与内外对象谱系；纯地址空间隐藏仍转交 NJT-0111。
    rationale_en: Steganography, HTML or SVG smuggling, embedded payloads, LNK icons, and carrier-encoded fileless storage require a specialized extractor and outer-to-inner object lineage. Pure address-space hiding remains assigned to NJT-0111.
  - niji_child_ref: NJS-0115-004
    attack_subtechnique_ids: [T1027.004, T1027.007]
    rationale_zh: 投递后编译和动态 API 解析让最终代码或调用只在运行时产生，需要生成输入到内存结果的关联。
    rationale_en: Compile after delivery and dynamic API resolution make final code or calls appear only at runtime and require correlation from generation input to memory result.
