    niji_ref: NJS-0111-003
    rationale_zh: 进程参数覆盖的稳定差分是同一对象的检查表示与真实启动状态，而非身份载体替代。
    rationale_en: Process-argument overwriting is stably defined by inspection representation diverging from real launch state in one object rather than by carrier identity substitution.
