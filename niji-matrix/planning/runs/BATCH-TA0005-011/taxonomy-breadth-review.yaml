  - niji_child_ref: NJS-0114-001
    attack_subtechnique_ids: [T1036.001, T1036.003, T1036.004, T1036.005, T1036.010]
    rationale_zh: 无效签名、合法名称/位置、任务或服务以及账户拟态都借用受信资源身份，验证依赖稳定对象来源而非载体。
    rationale_en: Invalid signing, legitimate name or location, task or service, and account masquerading all borrow a trusted resource identity and require stable object provenance rather than carrier-specific logic.
  - niji_child_ref: NJS-0114-002
    attack_subtechnique_ids: [T1036.002, T1036.006, T1036.007, T1036.008]
    rationale_zh: RLO、尾随空白、双扩展和文件类型呈现都产生渲染类型与规范格式差分。
    rationale_en: RLO, trailing whitespace, double extensions, and file-type presentation all create a differential between rendered type and canonical format.
  - niji_child_ref: NJS-0114-003
    attack_subtechnique_ids: [T1036.009]
    rationale_zh: 代理执行改变可见父子树，必须用 broker 控制面恢复真实请求者。
    rationale_en: Brokered execution changes the visible process tree and requires broker control-plane data to recover the real requester.
  - niji_child_ref: NJS-0114-004
    attack_subtechnique_ids: [T1036.012]
    rationale_zh: 浏览器与系统属性仿真需要把网络指纹、发起进程和真实会话比较。
    rationale_en: Browser and system-attribute discovery requires comparison among network fingerprint, originating process, and real session.
  adjacent_coverage:
