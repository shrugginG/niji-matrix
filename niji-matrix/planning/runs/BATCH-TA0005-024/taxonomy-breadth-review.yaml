  resulting_child_refs: [NJS-0080-001, NJS-0080-002]
  source_coverage:
  - niji_child_ref: NJS-0080-001
    attack_subtechnique_ids: [T1127.001, T1127.002, T1127.003]
    rationale_zh: MSBuild、ClickOnce 和 JamPlus 都由受信开发 utility 解释攻击者输入并成为可见执行主体，产品不形成稳定兄弟项。
    rationale_en: MSBuild, ClickOnce, and JamPlus all have a trusted developer utility interpret adversary input and become the visible execution principal; product does not form stable siblings.
  - niji_child_ref: NJS-0080-002
    attack_subtechnique_ids: [T1127.001]
    rationale_zh: 当前结论级证据只支持 MSBuild TaskFactory 将内联源编译为 utility 内内存 assembly；不把该特性无证据推广至 ClickOnce 与 JamPlus。
    rationale_en: Current conclusion-level evidence supports only MSBuild TaskFactory compiling inline source into an in-utility memory assembly. The property is not generalized to ClickOnce or JamPlus without evidence.
  breadth_gap_explanation_zh: 三个产品实现收敛为输入代理变量，另保留一个证据限定的内存表示变量；既有包满足 Stealth 直接结果和防御差异，本批不复制建项。
  breadth_gap_explanation_en: Three product implementations converge into an input-proxy variable, with one evidence-limited memory-representation variable retained. The existing package satisfies direct Stealth effect and defensive difference, so this batch does not duplicate it.
