  source_coverage:
  - niji_child_ref: NJS-0118-001
    attack_subtechnique_ids: [T1684.001]
    rationale_zh: 人员或组织冒充的事实源是关系历史、组织角色与独立确认，可跨聊天、语音和邮件介质。
    rationale_en: The source of truth for person or organization impersonation is relationship history, organizational role, and independent confirmation across chat, voice, and mail.
  - niji_child_ref: NJS-0118-002
    attack_subtechnique_ids: [T1684.002]
    rationale_zh: 邮件来源伪造具有独立的 SMTP 头、SPF、DKIM、DMARC、ARC 和消息追踪事实源与预防控制。
    rationale_en: Email-provenance forgery has independent SMTP header, SPF, DKIM, DMARC, ARC, and message-trace sources of truth and preventive controls.
  candidate_resolutions:
  - {axis: 通信介质, resolution: not-stealth-distinct, reason_zh: 关系冒充可跨邮件、聊天、语音与工单，介质不等于信任事实源。, reason_en: Relationship impersonation spans mail, chat, voice, and tickets, so medium is not the source of trust.}
  - {axis: 请求动作, resolution: parent-core, reason_zh: 执行、审批、支付和披露是后继结果，不定义伪造来源的方式。, reason_en: Execution, approval, payment, and disclosure are successor outcomes and do not define how provenance is forged.}
  breadth_gap_explanation_zh: 两项 ATT&CK 实现未被直接导入，而是因关系事实与邮件传输认证的防御不可互换性分别准入；通信介质和动作类型未成项。
  breadth_gap_explanation_en: The two ATT&CK implementations are not imported directly; they are independently admitted because relationship truth and mail-transport authentication have non-interchangeable defenses. Medium and action type do not form children.
