  second_pass: {required: false, completed: true}
  proposed_niji_child_count: 3
  resulting_child_refs: [NJS-0061-001, NJS-0061-002, NJS-0061-003]
  source_coverage:
  - niji_child_ref: NJS-0061-001
    attack_subtechnique_ids: [T1078.001, T1078.002, T1078.003, T1078.004]
    rationale_zh: 默认、域、本地与云账户都可在一次新认证中贴合网络、设备、客户端和时间情境；账户类型不改变该观察变量。
    rationale_en: Default, domain, local, and cloud accounts can all align network, device, client, and timing context during a fresh authentication; account type does not change the observation variable.
  - niji_child_ref: NJS-0061-002
    attack_subtechnique_ids: [T1078.001, T1078.002, T1078.003, T1078.004]
    rationale_zh: 四类身份都可能通过仍有效的本地或远程会话状态减少新的认证链，边界取决于会话连续性而非账户分类。
    rationale_en: All four identity classes can reduce fresh authentication through still-valid local or remote session state. The boundary follows session continuity rather than account classification.
  - niji_child_ref: NJS-0061-003
    attack_subtechnique_ids: [T1078.001, T1078.002, T1078.003, T1078.004]
    rationale_zh: 默认、域、本地与云身份都可能因休眠、缺少 owner 或低交互监督而形成反馈缺口；检测需要生命周期和所有权而非平台标签。
    rationale_en: Default, domain, local, and cloud identities can all create feedback gaps through dormancy, missing ownership, or weak interactive oversight. Detection requires lifecycle and ownership rather than platform labels.
  breadth_gap_explanation_zh: 四项 ATT&CK 子项按账户归属划分，而三个 Niji 子技术是可组合的观察变量；既有父子包字段、证据和防御闭环完整，本批跨战术复核后不新增对象。
  breadth_gap_explanation_en: The four ATT&CK children partition account provenance while the three Niji children are composable observation variables. The existing parent-child package has complete fields, evidence, and defense closure, so cross-tactic review adds no object.
