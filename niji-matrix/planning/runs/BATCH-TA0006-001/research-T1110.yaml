handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0006-001
work_item_ref: WORK-TA0006-T1110
temporary_key_prefix: TA0006-001-T1110
candidate:
  source_type: attack
  source_attack_id: T1110
  name: {zh: 候选秘密反复验证, en: "Repeated Candidate-Secret Verification"}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: ATT&CK Enterprise 19.1 将 T1110 置于 Credential Access，涵盖对在线认证服务或已取得的验证材料反复测试候选口令。该直接行为值得保留，但“暴力破解”本身不说明匿迹变量；Niji 父技术应改写为攻击者在未知秘密的验证过程中控制请求时间、验证分布或验证位置，使失败证据被稀释、分散或从服务端视野移出。准入并不把所有失败登录判为恶意，也不把获得哈希或取得有效账户本身判为本技术。
        en: ATT&CK Enterprise 19.1 places T1110 in Credential Access and covers repeated testing of candidate passwords against an online authentication service or already acquired verification material. The direct behavior merits inclusion, but the term brute force alone does not identify a stealth variable. The Niji parent should be adapted to attacker control of request timing, verification distribution, or verifier location so that failure evidence is diluted, dispersed, or removed from the service's view. Admission does not classify every failed sign-in as malicious, nor does it classify hash acquisition or later use of a valid account as this technique.
      - zh: 准入强度由固定基线父页、Microsoft 对低频分布式尝试的事件观察、NIST 对在线与离线验证差异的规范性分析共同支撑。三条 Niji 轴并不等同于 ATT&CK 的猜测、破解、喷洒、填充四个名称；同一候选来源可进入多个轴，而同一轴可以跨多种候选来源。最终子项边界与数量仍须由主 Agent 在与 T1557 及已有有效账户技术交叉审查后裁决。
        en: The admission is supported by the fixed-baseline parent page, Microsoft's observed low-rate distributed attempts, and NIST's analysis of online versus offline verification. The three Niji axes do not correspond to ATT&CK's four guessing, cracking, spraying, and stuffing labels; one candidate source can participate in several axes, and one axis can span several candidate sources. The primary agent must still settle child boundaries and count after cross-review with T1557 and existing valid-account techniques.
proposed_content:
  summary:
    zh: 攻击者反复验证未知秘密，并通过控制验证节奏、分布或位置降低异常认证轨迹的集中度与可见性。
    en: Adversaries repeatedly validate unknown secrets and control verification timing, distribution, or location to reduce the concentration and visibility of suspicious authentication traces.
  definition_and_concept:
    paragraphs:
      - zh: 候选秘密反复验证是指攻击者尚不知道可用秘密时，对多个候选口令或凭据组合进行迭代测试，以找出能通过验证的秘密或访问能力。在线实现把请求交给目标认证服务，离线实现则在先前取得哈希或其他可比对材料后由攻击者自行计算与比较。候选来源可以是字典、泄露的组合、环境推断或其他输入；来源类别本身不决定 Niji 分类。
        en: Repeated candidate-secret verification is iterative testing of passwords or credential combinations while the adversary does not yet know a usable secret, seeking a secret or access capability that passes verification. Online attempts submit requests to the target authentication service. Offline attempts compare candidates against previously obtained hashes or other verification material under adversary control. Candidate input may come from dictionaries, leaked pairs, environmental inference, or other sources; the input category does not define the Niji taxonomy.
      - zh: 在 Credential Access 中，本技术的直接成果是秘密被验证，或者至少缩小未知秘密空间；凭据资料的取得、认证路径操纵、会话创建及后续资源访问另有自己的行为边界。匿迹分析针对验证活动怎样进入防守方观察，而不把成功登录或“少量失败”本身当成匿迹证明。
        en: Within Credential Access, the direct result is validation of a secret or at least reduction of the unknown-secret space. Acquisition of credential material, manipulation of the authentication path, session creation, and later resource access have separate behavioral boundaries. Stealth analysis concerns how validation enters the defender's observation, not an assumption that success or a small failure count by itself proves evasion.
  stealth_characteristics:
    paragraphs:
      - zh: 在线验证通常在认证服务留下主体、时间、来源、应用、结果以及可能的挑战或锁定状态。攻击者若拉长尝试间隔、把尝试摊到多个账户和来源，单账户、单来源和短窗口的失败峰值会减弱，防守方必须跨更长时间和更多身份连接弱信号。Microsoft 对 Midnight Blizzard 的调查直接记录其低尝试数与住宅代理分布用于降低发现和阻断概率，但该案例不能证明所有低频尝试都具有同样目的。
        en: Online validation normally leaves principal, time, source, application, result, and sometimes challenge or lockout state at the authentication service. By spacing attempts or distributing them across accounts and sources, an adversary reduces peaks in per-account, per-source, and short-window failure counts, forcing defenders to connect weak signals over longer periods and more identities. Microsoft's Midnight Blizzard investigation directly records low attempt counts and residential proxy distribution used to reduce discovery and blocking, but that case does not show the same intent behind every low-rate attempt.
      - zh: 离线验证的关键变化是候选失败不再交给目标服务处理，因此目标服务没有与候选次数一一对应的失败事件。防守方仍可能看到验证材料的获取、外传、终端计算工具或随后使用所得秘密；这些残余痕迹属于不同观察面，不能从服务器缺乏失败日志推出“完全不可见”。强哈希存储、已暴露材料的控制和获得秘密后的额外认证因素改变这一收益。
        en: In offline validation, candidate failures are no longer processed by the target service, so that service has no failure event for each candidate tested. Defenders may still observe acquisition or exfiltration of verification material, cracking activity on a monitored endpoint, or later use of a recovered secret. Those residual traces occupy different observation surfaces, and missing server failures do not mean complete invisibility. Strong hash storage, control of exposed material, and additional authentication factors change the benefit.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入范围要求存在针对未知秘密的重复候选验证，并有可论证的节奏、分布或验证位置变化。用户偶发输错、批准的安全测试、批量密码重置与正常账户恢复可产生相似日志，应结合授权、目标、请求序列和结果排除。单次使用已知有效口令属于有效账户使用；仅收集用户名、密码策略或泄露清单属于前期身份侦查或凭据材料获取。
        en: Inclusion requires repeated candidate validation of an unknown secret and a defensible change in timing, distribution, or verifier location. Ordinary mistyping, authorized security tests, bulk password resets, and account recovery can resemble parts of the logs; authorization, targets, request sequence, and outcomes must be checked. One-time use of an already known valid password belongs to valid-account use. Merely collecting usernames, password policies, or leaked lists belongs to prior identity reconnaissance or credential-material acquisition.
      - zh: T1557 控制凭据承载通信的信任路径，T1110 控制对未知秘密的候选验证；通过中间人得到握手或哈希可以成为离线验证的前提，但路径介入和后续候选测试是两个可分事件。取得哈希本身不等于已破解，哈希的直接重放也不是候选秘密验证。在线失败之后的成功事件需要区分首因验证、MFA 阻断和真正获得资源访问。
        en: T1557 controls the trust path carrying credential exchanges, whereas T1110 controls candidate validation of an unknown secret. An intercepted handshake or hash may become a prerequisite for offline testing, but path intervention and subsequent candidate testing are separable events. Hash acquisition alone does not prove cracking, and direct replay of a hash is not candidate-secret verification. A success after online failures requires distinguishing a matched primary secret, an MFA block, and actual resource access.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 在外部身份提供者、VPN、远程服务或受害环境内的认证入口，攻击者可能已有账户清单，尝试以长期低量验证避开短窗锁定，也可能用多来源和多主体摊薄单点异常。目标若已有被盗哈希、口令数据库或挑战应答材料，攻击者还可在自己控制的计算面离线测试候选，随后才决定是否尝试登录。三个场景分别改变时间密度、关联拓扑和验证事件的存放位置。
          en: At an external identity provider, VPN, remote service, or internal authentication entry, an adversary with an account list may run low-volume tests over a long period to avoid short-window controls or spread tests over sources and principals to reduce local anomalies. If the adversary already holds stolen hashes, a password database, or challenge-response material, candidates can instead be tested on adversary-controlled compute before any login is attempted. The scenarios change temporal density, correlation topology, and the location where verification events exist.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 在线攻击者至少需要可达的认证入口、候选秘密与目标身份；时间展延需要较长操作窗口，跨来源分布还需要代理或其他可控来源以及对账户清单的维护。攻击者可能利用错误、挑战或成功响应调整后续尝试，但未必能看到明文服务端判定。离线模型还要求先取得可验证材料、知道其格式并有足够计算资源；复杂度、盐和工作因子决定可行性。这里不预设攻击者已拥有有效账户、MFA 因子或改变认证策略的权限。
            en: An online adversary needs a reachable authentication endpoint, candidate secrets, and target identities. Temporal spreading requires a longer operating period; source distribution also requires controllable egress and maintained account lists. The adversary may adapt to error, challenge, or success responses but may not see the service's internal decision. Offline testing additionally requires prior access to comparable verification material, knowledge of its format, and sufficient compute; algorithm cost, salt, and work factor determine feasibility. The model does not assume a valid account, MFA factor, or authority to change authentication policy.
      defender_model:
        paragraphs:
          - zh: 对在线入口，防守方至少能取得统一的认证结果流，并把主体 ID、事件时间、来源地址、应用、认证阶段和请求标识规范化；联合或混合身份环境需要从实际完成验证的 IdP 与前端服务共同收集，否则缺失失败事件。日志保留期和跨租户可见性限制决定低频分布活动是否可被重建。防守方通常不记录明文候选口令，因此不能仅靠普通登录日志判断多个请求使用同一口令。
            en: For online entry points, the defender is assumed to collect a normalized stream of authentication outcomes with principal ID, event time, source address, application, authentication stage, and request identifier. Federated or hybrid identity requires logs from the IdP that actually performs verification as well as the front end, or failures may be missing. Retention and cross-tenant visibility determine whether low-rate distributed activity can be reconstructed. Ordinary sign-in logs generally do not expose candidate passwords, so they cannot by themselves prove that requests used the same password.
          - zh: 对离线验证，目标认证服务只能观察材料被访问或导出以及可能的后续成功认证；只有在攻击者计算设备也受监控时，才可能直接观察破解进程和计算行为。由源系统缺乏失败事件只能推断验证可能发生在视野外，不能单独证明已还原秘密；材料泄露范围和后续认证结果需要独立证据。
            en: For offline validation, the target service can observe access or export of verification material and perhaps later successful authentication. Direct observation of cracking processes and compute is possible only if the adversary's compute host is monitored. Missing failure events at the source service supports at most the possibility of testing outside its view; it does not prove that a secret was recovered. Exposure scope and later authentication outcomes require independent evidence.
  stealth_mechanisms:
    - mechanism_ref: NM-ST
      role: primary
      summary: {zh: 跨时间与来源稀释验证失败, en: "Dilute validation failures across time and sources"}
      analysis:
        paragraphs:
          - zh: 攻击者将原本集中提交的在线候选分配到较长时间、多个主体或多处出口，使认证失败被拆成局部低计数事件。按单账户、单 IP 或短窗口触发的规则更难把这些请求连接为一次行动，尽管各验证器仍保留单次请求结果。Microsoft 对 Midnight Blizzard 的调查直接支持低尝试数与住宅代理的组合；其它平台是否产生同样效果仍取决于其日志覆盖和关联规则。
            en: The adversary distributes otherwise concentrated online candidates across longer time, multiple principals, or several egress points, splitting failures into locally low-count events. Rules keyed only to one account, IP, or short window are less likely to connect them as one operation, although each verifier can still retain individual outcomes. Microsoft's Midnight Blizzard investigation directly supports the combination of few attempts and residential proxies; equivalent effects elsewhere depend on logging coverage and correlation design.
      evidence_keys: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-DART]
      confidence: high
    - mechanism_ref: NM-BT
      role: secondary
      summary: {zh: 离线验证脱离服务端失败遥测, en: "Move offline validation outside server failure telemetry"}
      analysis:
        paragraphs:
          - zh: 攻击者在取得可比对的哈希或挑战材料后，在服务端之外计算候选并核对结果。因为每次尝试没有提交给原验证器，服务端的失败计数与锁定策略既看不到这些尝试，也不能限制其速率；防守机会转移到材料保护、取用链和后继凭据使用。NIST 对在线限速与离线攻击的区别支持这一机制，但它不保证材料一定能被破解，也不证明攻击者计算主机不可见。
            en: After obtaining comparable hashes or challenge material, the adversary computes and checks candidates outside the service. Because each trial is not submitted to the original verifier, its failure count and lockout policy neither see nor rate-limit those trials. Defensive opportunity shifts to material protection, access lineage, and subsequent secret use. NIST's distinction between online throttling and offline attack supports the mechanism, but it does not guarantee recovery of a secret or invisibility on the attacker's compute host.
      evidence_keys: [TA0006-001-T1110-REF-NIST, REF-000025]
      confidence: high
proposed_subtechniques:
  - temporary_key: TA0006-001-T1110-CHILD-TEMPORAL
    name: {zh: 时间展延式在线验证, en: "Temporally Diluted Online Validation"}
    summary: {zh: 攻击者拉开在线候选验证的时间间隔，使失败分散到常见检测短窗口之外。, en: "The adversary spaces online candidate validation so failures fall outside common short detection windows."}
    taxonomy_variable: {zh: 同一可关联验证序列的时间密度, en: "Temporal density of a linkable validation sequence"}
    definition_and_concept:
      paragraphs:
        - zh: 时间展延式在线验证是攻击者有意延长对未知秘密的在线验证序列，在数小时至数周内把本可密集提交的候选逐步送入认证入口。它仍依赖目标服务逐次判断，并不因每个窗口只出现少量失败就脱离反复验证的父行为。该划分针对节奏，而不限定候选来自字典、泄露组合还是环境推断。
          en: Temporally Diluted Online Validation intentionally stretches testing of an unknown secret over hours to weeks, sending candidates gradually to an authentication endpoint instead of in a burst. It still relies on the target service to judge each trial and remains repeated validation even when each short window has few failures. The partition concerns pacing, regardless of whether candidates come from a dictionary, leaked pairs, or environmental inference.
    stealth_characteristics:
      paragraphs:
        - zh: 时间展延式在线验证改变的是单位时间的失败密度和事件之间的距离。短窗口的单账户阈值可能不触发，而每个失败、挑战与后来可能的成功仍在认证日志中；只有保留足够久、能按稳定主体或认证上下文关联的防守方才能还原序列。正常用户多日输错也可能呈低频模式，恶意判断需要跨事件一致性和排除授权测试。
          en: Temporally Diluted Online Validation changes failure density per unit time and the distance between events. A short per-account threshold may not fire, while every failure, challenge, and possible later success still exists in authentication logs. Reconstruction requires sufficient retention and stable principal or authentication-context joins. Ordinary users can also make occasional mistakes over days, so malicious classification needs event consistency and exclusion of authorized testing.
    scope_boundary_definition:
      paragraphs:
        - zh: 归入本项必须看到攻击者有意控制在线尝试间隔，使检测窗口或锁定计数受到影响；自然低频、单次误输及仅改变来源而不改变节奏不属于本项。若同一行动同时使用多 IP 与多账户，可并列标注分布式子项，但本项的证据应独立证明时间展延；离线测试没有服务端请求节奏，属于另一观察面。
          en: Inclusion requires evidence that the adversary intentionally controlled spacing of online attempts to affect detection windows or lockout counts. Naturally infrequent mistakes, one-time mistyping, and source changes without pacing changes do not establish this child. A campaign may also use multiple IPs and accounts, but temporal evidence must independently support this child; offline testing has no server request cadence and belongs to another observation model.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 适用于外部 IdP、VPN 或远程服务允许长期接触认证入口且短期锁定与告警较敏感的情形。攻击者可在已有账户列表上每日或更稀疏地测试少量候选，再据反馈调整；其后续目标是确认可用秘密或进入账户，成功并非本项成立的前提。
            en: This child applies when an external IdP, VPN, or remote service remains reachable over time and short-period lockout or alerting is salient. An adversary can test a few candidates per day or less often against a known account set and adapt to feedback. The later aim is to confirm a usable secret or enter an account; success is not required to establish the behavior.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需要持续可达性、维护目标身份与候选状态的能力，并容忍长时间等待及账户密码变更造成的失效。此项无需多来源基础设施；同一来源也可实现时间展延，但如果平台累计限速跨长窗口有效，其收益下降。
              en: The adversary needs sustained reachability, state for target identities and candidates, and tolerance for long delays and password changes that invalidate guesses. Multiple egress points are unnecessary; one source can be paced, but the advantage declines if the platform enforces cumulative limits over long windows.
        defender_model:
          paragraphs:
            - zh: 防守方需要实际验证器的失败与挑战日志、稳定主体 ID、事件时间及保留期足够长的关联能力。若联合 IdP 仅将成功上报前端，前端日志会低估失败；跨天关联系统还必须处理正常输错、密码过期和批准测试的基线。
              en: Defenders need failure and challenge logs from the actual verifier, stable principal IDs, event time, and retention long enough for correlation. If a federated IdP reports only successes to the front end, front-end logs undercount failures. Multi-day correlation must baseline ordinary mistakes, expired passwords, and approved testing.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary: {zh: 拉长验证间隔降低局部失败峰值, en: "Stretch validation intervals to reduce local failure peaks"}
        analysis:
          paragraphs:
            - zh: 攻击者把连续候选测试拉开到短窗规则之外，单次请求的失败痕迹不消失，但相邻失败更难被局部计数规则合并。只有跨长窗口重建同一账户或认证上下文的序列，才能恢复原本被稀释的攻击形状；Microsoft 对低尝试数用于逃避发现的观察支撑此因果链。
              en: The adversary spaces consecutive candidates beyond short-window rules. Individual failures remain, but adjacent failures are less likely to be joined by local counters. Reconstructing a sequence over a long window for the same account or authentication context restores the diluted pattern; Microsoft's observed use of few attempts to avoid discovery supports the causal chain.
        evidence_keys: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-DART]
        confidence: high
    evidence_keys: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-DART, REF-000307]
    defense_keys: [TA0006-001-T1110-DET-ONLINE, TA0006-001-T1110-NJA-TEMPORAL, TA0006-001-T1110-MIT-ONLINE]
    limitations:
      paragraphs:
        - zh: 公开事件给出低尝试数和规避意图，但未公布每次请求的完整间隔、所有候选或各产品告警阈值；跨环境窗口须本地测定。仅凭两次相隔较远的失败无法可靠归因，长保留期也会增加正常噪声和隐私成本。
          en: Public cases describe few attempts and evasion intent but do not publish every interval, all candidates, or each product's alert threshold; windows require local calibration. Two widely spaced failures alone do not establish attribution, and long retention raises benign noise and privacy cost.
  - temporary_key: TA0006-001-T1110-CHILD-DISTRIBUTED
    name: {zh: 跨主体与来源分布验证, en: "Cross-Principal and Source Distributed Validation"}
    summary: {zh: 攻击者把在线候选测试分布到多账户和多出口，削弱单账户与单来源视图中的异常集中度。, en: "The adversary spreads online candidate testing over accounts and egress points, weakening anomalies in per-account and per-source views."}
    taxonomy_variable: {zh: 在线验证请求的主体与来源关联拓扑, en: "Principal and source correlation topology of online validation requests"}
    definition_and_concept:
      paragraphs:
        - zh: 跨主体与来源分布验证是攻击者有计划地把未知秘密的在线测试分派给多个目标身份、多个可控来源，或两者的组合，使每个局部观察点只承受少量尝试。它按验证事件的空间组织方式划界，候选可以为同一个口令、多个不同口令或泄露组合，因此不等同于 ATT&CK 的喷洒或填充名称。
          en: Cross-Principal and Source Distributed Validation deliberately assigns online tests of unknown secrets to multiple target principals, controllable sources, or both, so each local vantage sees few attempts. It is defined by the spatial organization of verification events. Candidates may be one password, several passwords, or leaked combinations, so the child is not a translation of ATT&CK spraying or stuffing labels.
    stealth_characteristics:
      paragraphs:
        - zh: 跨主体与来源分布验证把原本聚集于一个账户或 IP 的失败拆散到多对主体来源关系。单账户锁定和单 IP 速率阈值可能分别保持低计数，但全局身份提供者仍可观察到相似时间、应用、客户端或基础设施属性。住宅代理会增加源归因难度，却不会抹去每次认证事件；正常共享 NAT、企业代理和旅行用户也会制造相似聚合形态。
          en: Cross-Principal and Source Distributed Validation breaks failures that would cluster at one account or IP into many principal-source pairs. Per-account lockout and per-IP rate limits may each see low counts, while a global identity provider can still observe similarities in time, application, client, or infrastructure. Residential proxies complicate source attribution but do not erase each authentication event. Shared NAT, enterprise proxies, and travelling users can create related aggregate shapes.
    scope_boundary_definition:
      paragraphs:
        - zh: 本项需要可证明的多主体或多来源编排及其降低局部异常的效果；单个管理员从跳板机登录多个合法账户、同一用户漫游多个网络、单纯代理切换后的已知口令使用都不足以纳入。仅拉长一个账户的尝试间隔属于时间子项；在无服务器交互的离线环境分配计算任务不改变服务端观察面，属于验证器脱离子项或无独立匿迹意义。
          en: The child requires evidence of coordinated distribution over principals or sources and its effect on local anomaly concentration. A legitimate administrator signing into several accounts from a jump host, a user roaming networks, or proxy switching while using an already known password does not suffice. Merely spacing one account's tests belongs to the temporal child. Dividing offline compute without server interaction does not alter the service's view and belongs to verifier-detached testing or has no separate stealth significance.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 在云租户或面向互联网的认证入口拥有大量可枚举账户、而每账户锁定和每 IP 防护同时存在时，攻击者可能交叉安排账户与出口以维持低局部失败数。Microsoft 对 Midnight Blizzard 的调查记录了少量目标账户与分布式住宅代理的组合；Peach Sandstorm 来源记录大规模租户认证尝试，但不自动证明其每个请求都经跨来源编排。
            en: At cloud tenants or internet-facing authentication endpoints with an enumerable account pool and both per-account and per-IP controls, an adversary may coordinate accounts and egress points to keep local failures low. Microsoft's Midnight Blizzard investigation documents a limited target set combined with distributed residential proxies. The Peach Sandstorm source documents attempts across many environments but does not automatically prove source coordination for every request.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需维护身份集合、候选与出口池，并有办法避免多个工作节点重复尝试或过早触发锁定。来源池可来自租用代理、受控设备或其他出口，但本项不要求把代理本身误写为凭据获取结果。账户覆盖越广，误触高风险身份或触发全局风控的可能性也越高。
              en: The adversary must maintain a principal set, candidates, and an egress pool, coordinating workers to avoid duplicate trials or premature lockout. Egress may be rented proxies, controlled devices, or other paths, but the proxy itself is not a credential-access outcome. Broader account coverage also raises the chance of touching protected identities or triggering global risk controls.
        defender_model:
          paragraphs:
            - zh: 防守方应能从实际验证器获取跨应用的主体、来源、结果、时间及客户端元数据，并在至少租户范围内去重和关联。若只能看单应用或单租户，跨边界活动的总体规模可能被低估；若不同身份提供者未统一主体或结果语义，关联会混入大量正常代理流量。
              en: Defenders need principal, source, outcome, time, and client metadata from the actual verifiers, deduplicated and joined across applications at least within a tenant. Single-application or single-tenant visibility may undercount activity across boundaries. Without consistent principal and outcome semantics across IdPs, correlation can mix in substantial legitimate proxy traffic.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary: {zh: 将失败摊薄到多个主体来源对, en: "Spread failures across principal-source pairs"}
        analysis:
          paragraphs:
            - zh: 攻击者把候选请求交替分配到多个账户和出口，局部计数规则看到的失败密度下降；真正的痕迹仍是跨这些节点的认证结果图。只有把主体、来源、应用与时间共同聚合，才能恢复原行动的覆盖面。Microsoft 的住宅代理案例和 OWASP 对分布式凭据尝试的防御分析共同支撑这种观察差异。
              en: The adversary alternates candidate requests among accounts and egress points, reducing failure density visible to local counters. The residual trace is an authentication-result graph across those nodes. Joining principals, sources, applications, and time is needed to recover the operation's coverage. Microsoft's residential-proxy case and OWASP's analysis of distributed credential attempts support this observation difference.
        evidence_keys: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-OWASP-STUFF]
        confidence: high
    evidence_keys: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-OWASP-STUFF, REF-000461]
    defense_keys: [TA0006-001-T1110-DET-ONLINE, TA0006-001-T1110-NJA-DISTRIBUTED, TA0006-001-T1110-MIT-ONLINE]
    limitations:
      paragraphs:
        - zh: 普通登录日志通常没有候选口令明文，因而只能识别多主体多来源的协调形态，不能直接证明相同口令在各账户间复用。代理池、跨租户和客户端字段可被伪造或缺失，分析必须给出覆盖边界并对普通 NAT 或安全测试降权。
          en: Ordinary sign-in logs usually lack candidate plaintext, so analysis identifies coordinated multi-principal and multi-source patterns rather than proving password reuse across accounts. Proxy pools, cross-tenant boundaries, and spoofable or missing client fields limit inference; analysis must state coverage and down-weight ordinary NAT and authorized testing.
  - temporary_key: TA0006-001-T1110-CHILD-DETACHED
    name: {zh: 验证器脱离式候选测试, en: "Verifier-Detached Candidate Testing"}
    summary: {zh: 攻击者用已获验证材料在服务端之外测试候选，使各次失败不进入目标服务认证日志。, en: "The adversary tests candidates against acquired verification material outside the service, leaving no target-service failure for each trial."}
    taxonomy_variable: {zh: 候选判定的执行位置与遥测控制域, en: "Execution location and telemetry domain of candidate evaluation"}
    definition_and_concept:
      paragraphs:
        - zh: 验证器脱离式候选测试是攻击者先取得可核对的密码哈希或挑战材料，再在不向目标认证服务逐次请求的情况下计算候选与材料是否匹配。它是一种验证位置迁移：同样是未知秘密的反复候选测试，但验证环节从受害方服务端移到攻击者掌握的计算面。它不按哈希算法、提取工具、材料来源或破解软件命名。
          en: >-
            Verifier-Detached Candidate Testing begins after the adversary obtains comparable password hashes or challenge material and computes candidate matches without submitting each trial to the target authentication service. It is a migration of validation location: repeated testing of an unknown secret moves from the victim's service to attacker-controlled compute. The child is not named or partitioned by hash algorithm, extraction tool, material source, or cracking software.
    stealth_characteristics:
      paragraphs:
        - zh: 验证器脱离式候选测试消除了目标服务端与每次候选失败对应的事件及在线锁定计数，因此在线失败关联规则无法测量真实尝试规模。材料读取、复制、外传和后继认证仍可能留下高价值痕迹；若破解发生在受监控终端，还可有进程与计算资源证据。成功破解是否发生不能由“无失败登录”单独判定。
          en: Verifier-Detached Candidate Testing removes the target service event and lockout counter corresponding to each failed candidate, so online-failure correlation cannot measure the actual trial volume. Material access, copying, exfiltration, and later authentication can still leave strong evidence; a monitored cracking host may show process and compute traces. Lack of failed sign-ins alone cannot establish that a password was recovered.
    scope_boundary_definition:
      paragraphs:
        - zh: 归入本项必须有候选与已获验证材料本地比较的证据或充分支持的链条。仅窃取哈希、传输哈希、直接以哈希认证、仅猜测可能破解以及合法密码审计均不自动归入；后者还须核对授权。若攻击者把少量已推测出的候选重新提交在线服务验证，该在线阶段应按其自己的节奏或分布判断，而不能算成离线失败日志。
          en: Inclusion requires evidence of local comparison of candidates with acquired verification material or a sufficiently supported chain. Merely stealing or moving hashes, authenticating directly with a hash, speculating that cracking occurred, or performing authorized password audits does not automatically qualify; audit authorization must be checked. If a few recovered candidates are later submitted online, that online stage is assessed separately by its own pacing or distribution, not counted as offline failure logging.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 在域数据库、被动捕获的挑战应答或外泄应用数据库已落入攻击者手中后，攻击者可能将材料移出受害方服务，离线筛选可用秘密，再用其进入目标环境。CISA 关于 Volt Typhoon 的公告把 NTDS.dit 与 SYSTEM 的复制、外传及离线破解串成一个报告链；复制环节仍归材料获取，候选计算才属于本项。
            en: After a domain database, captured challenge-response material, or a leaked application database reaches the adversary, the material may be moved away from the victim service for offline candidate testing before any use of a recovered secret. CISA's Volt Typhoon advisory links copying NTDS.dit and SYSTEM, exfiltration, and offline cracking in one reported chain. Copying remains material acquisition; candidate computation is this child.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需要可比对材料、正确的算法或格式知识、候选生成能力和计算时间。强工作因子、唯一盐、长而不可预测的口令会压低成功率；攻击者不必控制目标认证服务，但若要利用恢复的秘密，仍可能面对 MFA、条件访问或口令变更。
              en: The adversary needs comparable material, correct algorithm or format knowledge, candidate generation, and compute time. Strong work factors, unique salts, and long unpredictable passwords reduce yield. Control of the target authentication service is unnecessary, but later use of a recovered secret may still face MFA, conditional access, or password rotation.
        defender_model:
          paragraphs:
            - zh: 受害方服务端可监控凭据库、域数据库或捕获材料的访问与传输，并能观察后续认证；它不能从自己的失败日志直接看见外部离线计算。若攻击者在受害环境内运行破解程序，终端进程、文件和资源遥测可补充观察，但这不是本项在所有案例中的前提。
              en: The victim can monitor access and transfer of credential stores, domain databases, or captured material and observe later authentication, but its own failure logs cannot show external offline computation. If cracking runs inside the victim environment, endpoint process, file, and resource telemetry can add visibility, but that is not assumed in every case.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary: {zh: 候选失败退出受害方验证器视野, en: "Remove candidate failures from the victim verifier's view"}
        analysis:
          paragraphs:
            - zh: 攻击者把验证函数和已获材料放在其控制的计算面执行，原服务端不处理各次猜测，因此既不生成失败事件，也不能以在线锁定限制尝试。该变化产生明确的观察盲区，却没有抹去材料获取及最终使用的事件；NIST 的在线与离线区别和 CISA 报告的离线破解链条提供基础。
              en: The adversary executes a validation function over acquired material on controlled compute. The original service processes none of the guesses, so it generates no corresponding failures and cannot enforce online lockout against them. This creates a specific observation gap without erasing acquisition or eventual-use events. NIST's online/offline distinction and CISA's reported offline-cracking chain provide the basis.
        evidence_keys: [TA0006-001-T1110-REF-NIST, REF-000025]
        confidence: high
    evidence_keys: [TA0006-001-T1110-REF-NIST, REF-000025, TA0006-001-T1110-REF-OWASP-STORAGE]
    defense_keys: [TA0006-001-T1110-DET-OFFLINE, TA0006-001-T1110-NJA-OFFLINE, TA0006-001-T1110-MIT-OFFLINE]
    limitations:
      paragraphs:
        - zh: 外部离线计算可能完全不在受害方传感器内；防守检测只能定位材料暴露和后继风险，不能估算真实候选次数或仅凭哈希被盗宣称口令已还原。不同哈希方案的抗离线能力差别很大，生产环境的有效暴露范围应逐库评估。
          en: External offline compute may be wholly outside victim sensors. Detection can identify material exposure and subsequent risk but cannot count actual candidates or claim recovery from hash theft alone. Offline resistance varies substantially by hashing scheme, so effective exposure must be assessed per store.
defense_candidates:
  detection_strategies:
    - temporary_key: TA0006-001-T1110-DET-ONLINE
      name: {zh: 长窗口认证失败关联, en: "Long-Horizon Authentication Failure Correlation"}
      objective:
        zh: 在真实验证器日志中连接低频、跨账户和跨来源的失败与随后挑战或成功，并区分时间展延和分布式验证。
        en: Join low-rate, cross-account, and cross-source failures with later challenges or successes in the actual verifier logs, distinguishing temporal dilution from distributed validation.
      covers: [TA0006-001-T1110-CHILD-TEMPORAL, TA0006-001-T1110-CHILD-DISTRIBUTED]
      domains: [enterprise]
      analytic_keys: [TA0006-001-T1110-NJA-TEMPORAL, TA0006-001-T1110-NJA-DISTRIBUTED]
      evidence_keys: [TA0006-001-T1110-REF-MS-PLAYBOOK, TA0006-001-T1110-REF-MIDNIGHT, REF-000307]
    - temporary_key: TA0006-001-T1110-DET-OFFLINE
      name: {zh: 验证材料暴露与后继身份风险, en: "Verification-Material Exposure and Subsequent Identity Risk"}
      objective:
        zh: 对可离线验证材料的异常读取、导出或外传建立链条，并监测受影响身份的后继认证，同时明确外部候选计算不能由服务端直接检测。
        en: Link abnormal access, export, or exfiltration of material usable for offline validation to later authentication by exposed identities, while stating that external candidate computation is not directly detectable at the service.
      covers: [TA0006-001-T1110-CHILD-DETACHED]
      domains: [enterprise]
      analytic_keys: [TA0006-001-T1110-NJA-OFFLINE]
      evidence_keys: [REF-000025, TA0006-001-T1110-REF-NIST]
  detection_analytics:
    - temporary_key: TA0006-001-T1110-NJA-TEMPORAL
      strategy_key: TA0006-001-T1110-DET-ONLINE
      name: {zh: 按身份重建低频失败序列, en: "Reconstruct Low-Rate Failure Sequences by Principal"}
      logic:
        zh: 将同一实际验证器的事件按 tenant_id、stable_user_id、application_id 规范化，去除同一 request_id 的重复事件。按 event_time 对每一身份滑动 7 至 30 天，计数不同日期的密码失败、失败至挑战或成功转换、来源和客户端变动；与该身份过去 30 至 90 天的正常失败基线比较。仅在跨日重复且无批准测试或密码过期解释时升高风险，MFA 拒绝标成已匹配主凭据但未获资源，而非成功入侵。
        en: Normalize events from the actual verifier by tenant_id, stable_user_id, and application_id, deduplicating repeated records by request_id. In a rolling 7 to 30 days per principal, count password failures across distinct days, failure-to-challenge or success transitions, and source and client changes; compare with that principal's 30 to 90 day normal-failure baseline. Raise risk only for repeated cross-day activity without authorized testing or password-expiry explanation. Mark MFA denial as possible primary-secret match without resource access, not successful intrusion.
      data_requirements:
        - {source_type: identity_signin, name: {zh: 实际验证器认证日志, en: "Actual-verifier sign-in logs"}, channel: Microsoft Entra SignInLogs or AD FS security logs, required_fields: [tenant_id, stable_user_id, application_id, event_time, request_id, source_ip, result_code, authentication_stage]}
      observables: [password_failure, challenge_after_failure, successful_primary_authentication, source_change]
      correlation: {window: 7-30 days rolling with 30-90 day baseline, dimensions: [tenant_id, stable_user_id, application_id, event_time, request_id]}
      false_positives: [{zh: 忘记口令、密码过期和经授权的红队长期测试可能产生跨日失败。, en: "Forgotten or expired passwords and authorized long-running red-team tests can create cross-day failures."}]
      blind_spots: [{zh: 联合 IdP 未导出失败、保留期不足、非交互入口和缺少稳定账户标识会截断序列。, en: "Missing federated-IdP failures, short retention, noninteractive entry points, or absent stable user IDs truncate the sequence."}]
      tuning_guidance:
        zh: 从真实身份提供者核对结果码和认证阶段；按账户历史失败分布及应用基线调窗口，不把全局阈值机械套到服务账户或共享终端。维护批准测试的时间、目标与操作者白名单，并保留其原始事件供追溯。
        en: Validate result-code and authentication-stage semantics at the actual IdP. Tune windows to account-history and application baselines rather than imposing one threshold on service accounts or shared endpoints. Keep scoped authorized-test allowlists with time, target, and operator while retaining raw events for audit.
      evidence_keys: [TA0006-001-T1110-REF-MS-PLAYBOOK, REF-000307, TA0006-001-T1110-REF-MIDNIGHT]
    - temporary_key: TA0006-001-T1110-NJA-DISTRIBUTED
      strategy_key: TA0006-001-T1110-DET-ONLINE
      name: {zh: 跨账户与出口认证图关联, en: "Cross-Account and Egress Authentication Graph Correlation"}
      logic:
        zh: 以去重后的失败和挑战记录构建 tenant_id 内的 source_ip 或 ASN、stable_user_id、application_id 二部关联图；在 24 小时及 7 天窗口分别计算每个来源触达的不同身份数、每个身份出现的不同来源数，以及共享客户端属性的失败群。对每个节点局部次数低而跨图覆盖大的簇标记异常，并将后续主凭据匹配、MFA 拒绝和真实资源访问分列。不要声称仅凭日志证明使用了相同口令。
        en: Build a bipartite graph from deduplicated failures and challenges within a tenant, linking source_ip or ASN, stable_user_id, and application_id. In 24-hour and seven-day windows, count distinct principals per source, sources per principal, and failure clusters sharing client attributes. Flag clusters with low local counts but broad graph coverage, separating later primary-secret matches, MFA denials, and real resource access. Do not claim the logs prove a common password was used.
      data_requirements:
        - {source_type: identity_signin, name: {zh: 跨应用认证结果流, en: "Cross-application authentication outcomes"}, channel: Microsoft Entra SignInLogs or equivalent IdP export, required_fields: [tenant_id, stable_user_id, application_id, event_time, request_id, source_ip, result_code, authentication_stage, client_app]}
        - {source_type: network_enrichment, name: {zh: 来源网络归属, en: "Source network attribution"}, channel: IP-to-ASN enrichment, required_fields: [source_ip, asn, asn_type]}
      observables: [many_principals_per_source, many_sources_per_principal, low_failures_per_pair, shared_client_context]
      correlation: {window: 24 hours and 7 days, dimensions: [tenant_id, stable_user_id, source_ip, asn, application_id, client_app]}
      false_positives: [{zh: 企业代理、统一出口、共享终端及大规模受控测试会自然形成多身份来源图。, en: "Enterprise proxies, shared egress, shared devices, and large authorized tests naturally create multi-principal source graphs."}]
      blind_spots: [{zh: 跨租户活动、来源快速轮换、代理用户混杂及可伪造客户端属性会降低图连接可靠性。, en: "Cross-tenant activity, rapid source rotation, mixed proxy users, and spoofable client attributes weaken graph joins."}]
      tuning_guidance:
        zh: 按企业出口与受控代理清单建立背景图，但不要直接忽略该来源的所有认证；对新 ASN、陌生设备及高风险身份提高权重。把匿名 IP 情报当辅助字段，不以其单独判定攻击；以实际 IdP 的登录语义区分密码失败、挑战和资源成功。
        en: Build background graphs for enterprise egress and sanctioned proxies without discarding all their sign-ins. Weight new ASNs, unfamiliar devices, and sensitive principals more heavily. Treat anonymous-IP intelligence as enrichment rather than a sole verdict, and use actual IdP semantics to separate password failure, challenge, and resource success.
      evidence_keys: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-OWASP-STUFF, TA0006-001-T1110-REF-MS-PLAYBOOK]
    - temporary_key: TA0006-001-T1110-NJA-OFFLINE
      strategy_key: TA0006-001-T1110-DET-OFFLINE
      name: {zh: 哈希材料取用与后继认证链, en: "Hash-Material Access and Subsequent Authentication Lineage"}
      logic:
        zh: 从域控制器或凭据库文件审计中定位未批准的批量读取、快照复制、导出与大容量外传，将 material_id、actor_id、host_id 和事件时间串联；生成受影响账户集合。针对该集合标记材料暴露后首次认证、异常来源、MFA 拒绝或重置前使用。若攻击者计算设备不受监控，输出为材料泄露及疑似后继利用风险，不输出“观察到离线破解成功”；只有可信终端遥测显示破解进程与材料输入时才增加直接计算证据。
        en: Find unauthorized bulk reads, shadow-copy access, export, and large transfers of domain-controller or credential-store material, joining material_id, actor_id, host_id, and event time; derive the affected account set. For those accounts, mark first post-exposure authentication, unusual source, MFA denial, or use before reset. If attacker compute is unmonitored, output material-exposure and possible follow-on-use risk, not observed successful cracking. Add direct computation evidence only when trusted endpoint telemetry shows a cracking process and input material.
      data_requirements:
        - {source_type: credential_material_audit, name: {zh: 凭据材料文件与快照审计, en: "Credential-material file and snapshot audit"}, channel: Domain controller file access and snapshot logs, required_fields: [event_time, actor_id, host_id, material_id, operation, result]}
        - {source_type: identity_signin, name: {zh: 受影响身份后继认证, en: "Later authentication of exposed identities"}, channel: IdP sign-in logs, required_fields: [event_time, stable_user_id, source_ip, result_code, authentication_stage]}
      observables: [credential_store_export, snapshot_copy, material_exfiltration, post_exposure_first_signin]
      correlation: {window: From exposure until confirmed credential reset or risk closure, dimensions: [material_id, actor_id, host_id, stable_user_id, event_time]}
      false_positives: [{zh: 域控制器备份、灾备演练及获批准的密码审计可能读取相同材料。, en: "Domain-controller backup, disaster-recovery drills, and approved password audits may access the same material."}]
      blind_spots: [{zh: 外部离线计算不可见，材料账号映射不全或哈希不对应可登录秘密时无法准确判断后继风险。, en: "External offline compute is invisible, and incomplete material-to-account mapping or hashes unrelated to a usable login secret prevent precise follow-on-risk assessment."}]
      tuning_guidance:
        zh: 以获批准的备份账户、时间、输出目标和变更单排除正常作业；只在能验证材料与账号映射时构建受影响集合，并在重置或撤销后终止风险窗口。把取用事实、离线破解推断与实际登录结果分开呈报。
        en: Use approved backup identities, schedules, destinations, and change tickets to exclude normal jobs. Build the affected set only when material-to-account mapping is verified, and close the risk window after reset or revocation. Report material access, inferred offline cracking, and actual sign-in outcomes separately.
      evidence_keys: [REF-000025, TA0006-001-T1110-REF-NIST, REF-000307]
  mitigations:
    - temporary_key: TA0006-001-T1110-MIT-ONLINE
      name: {zh: 在线认证速率与抗重放控制, en: "Online Authentication Rate and Replay-Resistance Controls"}
      measures:
        - {key: per_account_throttle, control_type: preventive, description: {zh: 在实际验证器按稳定账户累计失败并逐步延时，避免只按 IP 与账户组合建桶。, en: "Accumulate failures per stable account at the actual verifier and introduce progressive delay; do not use only a combined IP-account bucket."}}
        - {key: source_population_rate, control_type: cost-increasing, description: {zh: 对来源、ASN 和目标账户覆盖共同施加风险自适应速率控制与挑战，并保护正常用户免受批量锁定。, en: "Apply risk-adaptive throttling or challenge based on source, ASN, and covered account population while protecting legitimate users from mass lockouts."}}
        - {key: resistant_authentication, control_type: preventive, description: {zh: 为高价值账户配置抗钓鱼 MFA 或等效强认证，并淘汰不能执行这些控制的旧入口。, en: "Require phishing-resistant MFA or equivalent strong authentication for high-value accounts and retire legacy entry points that cannot enforce it."}}
      applications:
        - target_key: TA0006-001-T1110-CHILD-TEMPORAL
          use: {zh: 将失败限速与风险计数保留到超过常见攻击间隔的窗口，并校准账户历史及密码过期行为。, en: "Retain failed-attempt throttling and risk counters beyond common adversary spacing, calibrated to account history and password-expiry behavior."}
          expected_effect: {zh: 提高长期低频候选成本，并在最终秘密匹配后仍以强认证阻断资源访问。, en: "Raise the cost of long-running low-rate trials and block resource access with strong authentication even after a primary-secret match."}
          limitations: {zh: 过严锁定可被用来拒绝服务；MFA 不能阻止秘密被验证，长期计数也可能受到合规保留期约束。, en: "Overly strict lockout can be abused for denial of service; MFA does not prevent a secret from being validated, and long counters may be constrained by retention policy."}
        - target_key: TA0006-001-T1110-CHILD-DISTRIBUTED
          use: {zh: 对账户与来源分别限速，并依据跨账户覆盖面施加风险挑战，不因更换 IP 而重置账户风险。, en: "Rate-limit by account and source separately, adding risk challenge based on cross-account coverage rather than resetting account risk when IP changes."}
          expected_effect: {zh: 抑制把失败摊到多个主体来源对的收益，提高分布式验证的基础设施与时间成本。, en: "Reduce the benefit of spreading failures over principal-source pairs and increase the infrastructure and time cost of distributed validation."}
          limitations: {zh: 共享代理、跨租户分布和被盗住宅出口使来源分类不可靠，挑战与限速需避免误伤合法用户。, en: "Shared proxies, cross-tenant distribution, and compromised residential egress weaken source classification; challenges and throttles must avoid harming legitimate users."}
      evidence_keys: [TA0006-001-T1110-REF-NIST, TA0006-001-T1110-REF-OWASP-STUFF, TA0006-001-T1110-REF-MS-SMART]
    - temporary_key: TA0006-001-T1110-MIT-OFFLINE
      name: {zh: 验证材料抗离线恢复与暴露响应, en: "Verification-Material Offline Resistance and Exposure Response"}
      measures:
        - {key: hardened_password_verifier, control_type: preventive, description: {zh: 在可选的密码存储中采用逐用户盐与经校准的自适应哈希工作因子，保护数据库及导出权限。, en: "Use per-user salts and calibrated adaptive hash work factors in password stores where design permits, and protect database and export permissions."}}
        - {key: exposed_material_response, control_type: containment, description: {zh: 材料泄露后定位受影响身份并重置秘密、撤销相关会话，监测后继认证。, en: "On exposure, identify affected identities, reset secrets, revoke related sessions, and monitor subsequent authentication."}}
      applications:
        - target_key: TA0006-001-T1110-CHILD-DETACHED
          use: {zh: 限制域数据库和应用验证材料的批量读取与外传；对泄露材料按存储类型和账号映射评估离线破解可能性，再分批重置并强制后继认证。, en: "Restrict bulk access and export of domain or application verification material; assess offline recoverability by store type and account mapping, then rotate affected credentials and enforce strong subsequent authentication."}
          expected_effect: {zh: 减少可用离线材料或提高每个候选的计算成本，并在泄露后缩短已恢复秘密的可用期。, en: "Reduce availability of offline material or raise per-candidate compute cost, and shorten the usable life of any recovered secret after exposure."}
          limitations: {zh: 不能把通用应用哈希方案直接套到 NTDS.dit；已外流材料不可召回，重置前可能已经完成破解，强工作因子不消除弱口令风险。, en: "Generic application hash schemes cannot simply be imposed on NTDS.dit. Exfiltrated material cannot be recalled, cracking may have completed before reset, and strong work factors do not eliminate weak-password risk."}
      evidence_keys: [TA0006-001-T1110-REF-NIST, TA0006-001-T1110-REF-OWASP-STORAGE, REF-000025]
