research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids: [T1110.001, T1110.002, T1110.003, T1110.004]
    represented_dimensions:
      - {id: T1110.001, dimension: Candidate generation and repeated online guesses for one or more target accounts}
      - {id: T1110.002, dimension: Local computation against previously acquired password-verification material}
      - {id: T1110.003, dimension: Broad account population tested with a small candidate set}
      - {id: T1110.004, dimension: Reuse of preassembled account-secret pairs from another context}
    breadth_trigger: examine-at-least-two-axes
    coverage_resolutions:
      - attack_id: T1110.001
        resolution: niji-variable-candidate
        rationale:
          zh: 反复在线尝试为节奏变量提供研究材料；猜测所得候选本身属于父级核心。
          en: Repeated online attempts supply a basis for the pacing variable; guessed candidates themselves remain parent core.
      - attack_id: T1110.002
        resolution: niji-variable-candidate
        rationale:
          zh: 验证器位置和目标服务端缺少逐次失败事件构成原生变量；破解名称不被导入。
          en: Verifier location and absence of per-trial failures at the target service form the native variable; the cracking label is not imported.
      - attack_id: T1110.003
        resolution: niji-variable-candidate
        rationale:
          zh: 账户分布为关联拓扑提供证据；每账户使用一个口令的语义不是子项身份。
          en: Account distribution supplies evidence for correlation topology; one-password-per-account semantics do not define the child.
      - attack_id: T1110.004
        resolution: parent-core
        rationale:
          zh: 泄露的候选组合改变输入来源，但不必然改变节奏、验证位置或观察拓扑。
          en: Leaked candidate pairs change input provenance but do not necessarily change timing, verifier location, or observation topology.
    candidate_stealth_axes_examined:
      - {axis: temporal density, resolution: formal, trace_change: failures spread across longer event time, defender_difference: long-window per-principal reconstruction}
      - {axis: principal and source topology, resolution: formal, trace_change: local failures diluted across identity-egress pairs, defender_difference: tenant-wide authentication graph}
      - {axis: verifier location, resolution: formal, trace_change: no target-service event per offline candidate, defender_difference: material-exposure lineage and subsequent-use monitoring}
      - {axis: candidate provenance, resolution: parent-core, trace_change: no guaranteed trace change from dictionary versus leaked pair alone, defender_difference: none without another controlled variable}
      - {axis: protocol or target product, resolution: not-stealth-distinct, trace_change: implementation surface varies but not a stable cross-platform stealth axis, defender_difference: platform adapters rather than a new child}
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: 四项固定 ATT&CK 子项均已覆盖研究；三条正式建议按时间密度、认证图拓扑和验证位置划分。时间与拓扑可同时出现，分别需有独立证据和 Analytic；候选来源作为父级输入，不另生子项。
      en: All four fixed ATT&CK children have been covered in research. The three proposed Niji children partition timing density, authentication-graph topology, and verifier location. Timing and topology can coexist, but each needs independent evidence and analytics. Candidate provenance remains an input to the parent rather than a child.
  evidence_coverage:
    parent_behavior_keys: [TA0006-001-T1110-REF-ATTACK]
    boundary_keys: [TA0006-001-T1110-REF-ATTACK, TA0006-001-T1110-REF-NIST, REF-000025]
    mechanism_support:
      NM-ST: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-DART]
      NM-BT: [TA0006-001-T1110-REF-NIST, REF-000025]
    child_existence_support:
      TA0006-001-T1110-CHILD-TEMPORAL: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-DART]
      TA0006-001-T1110-CHILD-DISTRIBUTED: [TA0006-001-T1110-REF-MIDNIGHT, TA0006-001-T1110-REF-OWASP-STUFF]
      TA0006-001-T1110-CHILD-DETACHED: [TA0006-001-T1110-REF-NIST, REF-000025]
    unsupported_or_deferred:
      - Candidate password equality across different sign-ins cannot be proven from ordinary sign-in logs.
      - Peach Sandstorm REF-000461 is reusable for observed spray attempts, but CASE-000172 records later subscription use rather than this validation behavior.
      - External offline compute cannot be directly detected by target-service authentication logs.
      - Direct attribution of every low-rate or distributed failure to malicious intent requires context and is not claimed.
  shared_library_review:
    checked_types: [REF, CLM, CASE, DET, NJA, MIT, REL]
    exact_or_semantic_matches:
      - {type: REF, object_ref: REF-000461, resolution: reuse, note: "Same Microsoft Peach Sandstorm URL; extend locator or notes only if needed, preserving existing Azure-subscription use"}
      - {type: REF, object_ref: REF-000025, resolution: reuse, note: "CISA Volt Typhoon advisory directly reports material extraction and offline cracking purpose"}
      - {type: REF, object_ref: REF-000307, resolution: reuse, note: "Entra sign-in field and caveat documentation, not password candidate visibility"}
      - {type: CASE, object_ref: CASE-000141, resolution: extend, note: "Same Volt Typhoon event; verify subject-ref extension does not broaden reported facts"}
      - {type: CASE, object_ref: CASE-000172, resolution: defer, note: "Different central event, new subscription after compromise, not an identity for spray case"}
    no_reuse_after_review: [DET, NJA, MIT, REL]
    caution: Refresh catalog and reserved IDs before canonical writing; candidate keys here are not formal IDs
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级及三子项均分别讨论直接行为、变量、残余痕迹、正常反例、攻防前提与限制。离线项没有虚构服务端失败检测；在线两项的因果链与分析窗口不同。建议主 Agent 复核英文对应性及是否将离线项纳为正式 child。
      en: The parent and three children separately address direct behavior, controlled variables, residual traces, benign counterexamples, attacker and defender prerequisites, and limits. The offline child does not invent server-side failure detection; the two online children have distinct causal chains and analytic windows. The primary agent should review bilingual equivalence and decide whether to formalize the offline child.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML syntax validation after drafting]
  limitations:
    paragraphs:
      - zh: 固定 ATT&CK 19.1 父页只用于行为与广度锚定，不能替新 Niji 变量背书；当下 ATT&CK 在线页面可能已更新。Microsoft 案例支持低频与代理分布的具体事实，但未给出所有请求级数据。NIST 与 OWASP 支持原理和防御设计，不等于证明个案已成功规避控制。离线案例证明材料用于破解的报告链，不能推出恢复秘密的数目、时间或后继登录。正式集成应逐条保持这些证据层级。
        en: The fixed ATT&CK 19.1 parent page anchors behavior and breadth only, not the new Niji variables; the live ATT&CK page may have changed. Microsoft cases support specific low-rate and proxy-distribution facts but do not expose every request. NIST and OWASP support mechanisms and defensive design, not proof that a given incident evaded controls. The offline case reports a chain leading to cracking but does not establish the number or timing of recovered secrets or subsequent logins. Canonical integration should preserve those evidence levels claim by claim.
  rejected_mechanisms:
    - {mechanism_ref: NM-FD, reason: "Residential proxy or normal-looking client metadata may alter apparent source reputation, but this candidate lacks stable conclusion-level evidence that such disguise independently drives secret validation beyond the distribution axis"}
    - {mechanism_ref: NM-DO, reason: "Candidate plaintext is normally absent from ordinary login logs; this is a telemetry property, not evidence that the adversary intentionally obscured data content"}
  open_questions:
    - Whether a formal child for verifier-detached testing should remain under T1110 after the primary agent reconciles it with T1557 acquisition and T1003 material extraction.
    - Whether a case or source beyond Midnight Blizzard supports temporal and distribution axes on non-Entra verifiers at the same conclusion level.
    - Whether any existing mitigation controls are semantically identical after the primary agent refreshes the shared catalog.
