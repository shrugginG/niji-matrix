      - "No source here measures real-world alert reduction from selective DHCPv6 or DNS answering."
      - "No claim that a rogue AP or ARP change alone yields credentials."
      - "No extension of SMB/LDAP signing effectiveness to arbitrary web or wireless portals."
      - "CISA PDF needs canonical-access verification before REF creation."
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes: {zh: "父级和两个拟议子级分别写明定义、受控变量、残余痕迹、包含排除、场景、攻击者前提、分散遥测、机理因果与分层限制；未把样例的子项数量或文字套用到本对象。", en: "Parent and both proposed children separately address definition, controlled variable, residual trace, inclusion and exclusion, scenario, attacker prerequisites, distributed telemetry, causal mechanism, and evidence-tiered limitations without copying exemplar counts or prose."}
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML formatting only]
  limitations:
    paragraphs:
      - zh: 本研究的父行为来自固定 ATT&CK 范围，但浏览到的 ATT&CK 在线页面可能已继续更新，正式引用必须与本地 19.1 快照逐项核对。Microsoft 2022 案例证明 Web 代理取得口令与 Cookie，并不能代替 LAN 选择性投毒或跨目标 NTLM 中继的实地案例；mitm6 原作者材料证明工具能力而非真实对抗结果。网络路径异常、认证成功和保护拒绝各自处于不同证据层，不能相互升级。
        en: The parent behavior is anchored to the fixed ATT&CK scope, but the live ATT&CK pages viewed may have changed; canonical references must be checked against the local 19.1 snapshot. Microsoft's 2022 case establishes a web proxy that obtained passwords and cookies but is not a field case of selective LAN poisoning or cross-destination NTLM relay. The mitm6 author's materials establish tool capability, not an operational outcome. Path anomalies, authentication success, and protection rejection occupy different evidence levels and must not be promoted into each other.
      - zh: 正式检测依赖网络控制平面、终端与目标服务的联合留存。不同 Windows 版本的 NTLM/LDAP 审计字段和无线控制器日志并不一致；提出的 5 与 15 分钟窗口仅为可实施起点，需要按认证交互、时钟偏差和网络延迟校准。若主 Agent 无法验证某项数据要求或拟议子项的防守差异，应降低置信度、拆分分析或暂缓该子项，而不以填满分类为目标。
        en: The proposed detection depends on combined retention from network control plane, endpoint, and target service. NTLM and LDAP audit fields vary by Windows version, as do wireless-controller logs. The suggested five- and fifteen-minute windows are implementable starting points that need calibration for authentication interaction, clock skew, and network delay. If the primary agent cannot verify a data requirement or a proposed child's defensive distinction, it should lower confidence, split the analytic, or defer that child rather than seek to fill a taxonomy.
  rejected_mechanisms:
    - {mechanism_ref: NM-DO, reason: {zh: "未证实攻击者加密或遮蔽凭据数据本身；受信路径伪装与稀疏配置变化已解释可观察差异。", en: "No evidence that the actor obscures credential data itself; trusted-path mimicry and sparse configuration changes explain the observed differences."}}
    - {mechanism_ref: NM-BT, reason: {zh: "单侧观察盲点存在，但没有充分证据证明关键行为完全落在监测范围外，避免与 NM-FD 的正常外观重复计算。", en: "Single-vantage blind spots exist, but evidence is insufficient that the critical behavior lies wholly outside monitoring scope; do not double-count the ordinary appearance already explained by NM-FD."}}
  open_questions:
    - {zh: "主 Agent 能否从固定 19.1 快照确认 T1557 父页及四个子项的当时文本，并检查在线更新差异？", en: "Can the primary agent verify the T1557 parent and four child descriptions in the fixed 19.1 snapshot and check live-page drift?"}
    - {zh: "能否找到真实事件中按目标过滤的路径介入与凭据获取的端到端记录，以把选择性轴从工具能力提升到直接观察？", en: "Can an end-to-end incident establish filtered path intervention and credential acquisition, upgrading the selective axis from tool capability to direct observation?"}
    - {zh: "部署侧是否保存足够的原始目的地、NTLM 8004 与目标服务审计，以支持跨目标解析而非仅推测？", en: "Does the deployment retain intended destination, NTLM 8004, and target-service audit data to establish cross-destination relay rather than infer it?"}
