research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids: [T1557.001, T1557.002, T1557.003, T1557.004]
    represented_dimensions:
      - {zh: "名称权威伪答与 SMB/NTLM 中继", en: "Name-authority spoofing and SMB or NTLM relay"}
      - {zh: "ARP 邻居映射替换", en: "ARP neighbor-mapping replacement"}
      - {zh: "DHCP 网络配置权威替换", en: "DHCP network-configuration authority replacement"}
      - {zh: "无线接入点身份模仿", en: "Wireless access-point identity imitation"}
    breadth_trigger: examine_two_or_more_axes
    coverage_resolutions:
      - {attack_id: T1557.001, resolution: niji-variable-candidate, rationale: {zh: "名称伪答支持选择性路径轴，SMB 中继支持跨目标证明轴；原 ATT&CK 混合标签不能直接成为一个 NJS", en: "Name replies inform the selective-path axis and SMB relay informs cross-destination proof relay; the mixed ATT&CK label cannot become one NJS"}}
      - {attack_id: T1557.002, resolution: parent-core, rationale: {zh: "ARP 是更改邻居路径的实现，并非独立匿迹变量；若将来出现按目标短时替换的直接证据可归选择性路径轴", en: "ARP is an implementation of neighbor-path change, not a separate stealth variable; directly evidenced targeted brief replacement could instantiate the selective-path axis"}}
      - {attack_id: T1557.003, resolution: niji-variable-candidate, rationale: {zh: "DHCPv6 原作者工具提供按主机过滤及短驻留的直接实现证据，支持选择性路径轴；一般 DHCP 欺骗仍属父级", en: "First-party DHCPv6 tooling directly documents host filtering and short residence for the selective-path axis; ordinary DHCP spoofing remains parent core"}}
      - {attack_id: T1557.004, resolution: not-stealth-distinct, rationale: {zh: "相同 SSID/BSSID 的恶意 AP 是无线实现与身份模仿，不能仅凭介质成立独立 NJS；若只取得首个无线入口则归 TA0001 邻项", en: "A rogue AP using the same SSID or BSSID is a wireless implementation and identity imitation, not a child on medium alone; first wireless entry without credential acquisition belongs to adjacent TA0001 work"}}
    candidate_stealth_axes_examined:
      - {axis: selective-trust-direction, variable: "victim/name selection and path residence", trace_change: "sparse short-lived control-plane divergence", defender_difference: "per-endpoint path history and same-segment comparison", resolution: propose_formal_child, evidence_keys: [TA0006-001-T1557-REF-MITM6]}
      - {axis: cross-destination-proof-relay, variable: "proof's intended audience versus actual verifier", trace_change: "legitimate target authentication from intermediary source", defender_difference: "join endpoint requested name to target-side NTLM/SMB/LDAP result", resolution: propose_formal_child, evidence_keys: [TA0006-001-T1557-REF-RELAY, TA0006-001-T1557-REF-SMB, TA0006-001-T1557-REF-LDAP]}
      - {axis: live-idp-flow-continuity, variable: "real sign-in/MFA flow through a proxy", trace_change: "expected page and successful IdP login with proxy path", defender_difference: "URL and session-origin correlation", resolution: adjacent_existing_njs_0057_004, evidence_keys: [REF-000067, CLM-000213]}
      - {axis: protocol-or-medium-label, variable: "ARP versus DHCP versus wireless", trace_change: "implementation-specific packets without stable stealth contrast", defender_difference: "different sensors but not one invariant attacker stealth variable", resolution: reject_as_child}
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes: {zh: "四个 ATT&CK 子项已逐项覆盖；两个拟议 NJS 按受害集合/驻留时间和认证受众分离构成，不沿袭 ATT&CK 协议或介质。选择性轴的匿迹效果仍为可检验推论，正式审查应要求来源与机理置信度相称。", en: "All four ATT&CK children have coverage resolutions. The two proposed NJS objects separate victim-set and residence control from authentication-audience separation rather than inheriting protocol or medium labels. The selective axis's stealth effect remains a testable inference and canonical review should calibrate mechanism confidence accordingly."}
  evidence_coverage:
    parent_behavior_keys: [TA0006-001-T1557-REF-ATTACK, REF-000067, TA0006-001-T1557-REF-MITM6]
    boundary_keys: [TA0006-001-T1557-REF-ATTACK, REF-000067, REF-000090, TA0006-001-T1557-REF-SMB]
    mechanism_support:
      - {mechanism: NM-FD, evidence_keys: [REF-000067, TA0006-001-T1557-REF-RELAY, TA0006-001-T1557-REF-MITM6], level: observed_and_documented}
      - {mechanism: NM-ST, evidence_keys: [TA0006-001-T1557-REF-MITM6], level: documented_control_plus_inferred_defender_effect}
