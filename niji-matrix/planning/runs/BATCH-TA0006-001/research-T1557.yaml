handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0006-001
work_item_ref: WORK-TA0006-T1557
temporary_key_prefix: TA0006-001-T1557
candidate:
  source_type: attack
  source_attack_id: T1557
  name: {zh: "凭据路径中间介入", en: "Credential-Path Adversary-in-the-Middle"}
recommendation:
  decision: adapt
  confidence: moderate
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: 固定 ATT&CK Enterprise 19.1 的 T1557 横跨凭据获取与一般收集，且可仅为嗅探、传输篡改或拒绝服务建立中间位置。TA0006 的正式对象应保留其“攻击者介入通信信任路径”这一父行为，但限于有意将认证材料、认证交换或可复用会话置于攻击者可接触路径，并存在实际获取或可证实获取机会的情形。只看到伪造网络响应或链路异常而没有认证关联时，应记录为路径介入调查线索，不能宣称已取得凭据。
        en: Fixed ATT&CK Enterprise 19.1 T1557 spans credential access and general collection and may establish an intermediary position only for sniffing, transmitted-data manipulation, or denial of service. The TA0006 object should preserve deliberate intervention in a communication trust path, while limiting its scope to routing authentication material, an authentication exchange, or a reusable session through an adversary-accessible position with actual acquisition or a demonstrable acquisition opportunity. A forged network reply or path anomaly without an authentication link is a path-intervention lead, not proof that credentials were obtained.
      - zh: 准入采用 adapt，因为这一范围收窄保持 ATT&CK 父行为与战术关系，又使匿迹变量可围绕谁被重定向以及认证被送往何处来定义。无线、ARP、DHCP 和名称解析只是可承载这些变量的实现面；Web 钓鱼实时 IdP 代理已经由 TA0001 的 NJS-0057-004 覆盖首次入口，不应机械复制。正式写入前，主 Agent 应再核对 T1040、T1528、T1539 与 TA0112 结果类对象的边界及共享对象的最新状态。
        en: Adapt is appropriate because this narrower scope preserves the ATT&CK parent behavior and tactic relation while allowing stealth variables to be defined by who is redirected and where authentication is delivered. Wireless, ARP, DHCP, and name resolution are implementation surfaces for those variables. Real-time IdP proxying in a web phishing lure already belongs to NJS-0057-004 for first entry and must not be copied mechanically. Before canonical writing, the primary agent should recheck the boundaries with T1040, T1528, T1539, TA0112 outcome objects, and the current shared library.
proposed_content:
  summary:
    zh: 攻击者改变认证通信的受信指向或中继目标，在尽量保持正常连接外观的同时接触凭据材料或认证交换。
    en: An adversary changes the trusted direction or relay destination of authentication traffic to reach credential material or an authentication exchange while preserving a plausible connection appearance.
  definition_and_concept:
    paragraphs:
      - zh: 凭据路径中间介入指攻击者在终端与其预期服务之间插入自己可控制的解析响应、邻居或网关映射、接入点或代理路径，使认证相关流量先到达攻击者位置，或使受害者对一个目标发起的挑战应答被转送至另一个真实服务。直接目的是取得明文秘密、挑战应答、令牌或 Cookie，或利用被中继的证明获得认证能力；是否真的取得哪一类材料，必须由该会话与后继结果单独证明。
        en: Credential-path adversary-in-the-middle is deliberate placement of an adversary-controlled resolution answer, neighbor or gateway mapping, access point, or proxy between an endpoint and its intended service, so authentication traffic first reaches the adversary, or a challenge response intended for one destination is forwarded to another real service. Its immediate objective is plaintext secrets, challenge responses, tokens, cookies, or authentication capability through a relayed proof. The material actually acquired in a case must be established from that exchange and its outcome.
      - zh: 这个概念的核心是信任指向发生变化：用户、终端或服务仍依据看似正常的名称、地址、无线标识或成功登录结果行动，但这些外观与真实路径不一致。中间位置本身不等于凭据获取；只有凭据承载流进入攻击者可接触路径，并且认证材料或交换结果可被截取、转用或直接观察，才满足本战术下的范围。
        en: The defining change is in the trust direction. A user, endpoint, or service can still act on an apparently ordinary name, address, wireless identity, or successful sign-in result even though that appearance no longer matches the actual path. An intermediary position alone is insufficient for Credential Access. Authentication-bearing traffic must traverse an adversary-accessible position, with material or the exchange outcome exposed to capture, relay, or direct observation.
  stealth_characteristics:
    paragraphs:
      - zh: 攻击者可以选择只回答特定终端或名称的解析与配置请求，使多数主机继续使用正常路径，削弱按全网高频伪造响应或持续网关漂移告警的可见信号。另一方面，若中间位置把真实认证继续转发给合法服务，受害者可能得到预期页面或资源，服务端则记录一次表面合法的认证；两端单独看都可能低估路径中多出的参与者。这两种变化分别作用于控制平面事件的空间分布和认证结果的外观，不能合并为一个子项。
        en: The adversary can answer resolution or configuration requests only for selected hosts or names, leaving most clients on their normal paths and reducing the signal available to detectors based on network-wide forged replies or persistent gateway drift. If the intermediary continues a real authentication exchange with a legitimate service, the victim may receive the expected page or resource and the service may log an apparently valid authentication. Each endpoint can miss the additional participant when viewed alone. These changes affect the spatial distribution of control-plane events and the appearance of authentication outcomes respectively, so they are separate candidate variables.
      - zh: 残余痕迹并未消失。选择性介入仍留下同一请求的竞争回答、授权 DHCP/DNS 或无线清单与实际响应者不一致、短寿命配置变化，以及受害者到中间节点的连接。认证中继仍留下原始目的地与目标服务之间的来源差、异常 NTLM/LDAP/SMB 绑定或签名结果，以及身份会话在设备与网络来源之间的不连续。要主张匿迹有效，须证明攻击者控制这些变量以及局部视角确实遗漏了关系；工具支持过滤不等于真实入侵已因此避开检测。
        en: Residual traces remain, including competing answers to the same request, responder mismatches against authorized DHCP, DNS, or wireless inventories, short-lived configuration changes, and a client connection to the intermediary. Authentication relay can leave a divergence between the client's intended destination and the server's observed source, abnormal NTLM, LDAP, or SMB binding and signing outcomes, and identity-session discontinuities across devices or network origins. A stealth-effect claim requires evidence that the actor controlled these variables and that a local view missed the relationship. A tool's filtering feature alone does not show that an intrusion evaded detection.
  scope_boundary_definition:
    paragraphs:
      - zh: 本对象纳入以取得认证材料或认证能力为目的的主动路径指向替换及认证交换中继，包括局域网名称与地址层欺骗、恶意网络配置、伪接入点和应用层代理，只要认证流与中间位置有可验证的关系。T1040 拥有不改变路径或服务指向的被动流量嗅探；若同一事件在中间路径建立后又抓包，可分别标记路径介入与嗅探，但不能把抓包本身说成 T1557。T1528 与 T1539 分别描述已取得应用令牌或 Cookie 的具体结果，可与本对象并列但不替代路径证据。
        en: This object includes active replacement of a trusted path direction and relay of an authentication exchange for credential material or capability, whether implemented through local name or address spoofing, malicious network configuration, a counterfeit access point, or an application proxy, provided the authentication flow can be linked to the intermediary. T1040 owns passive sniffing that does not change path or service direction. Packet capture after path establishment may justify both labels, but packet capture itself is not T1557. T1528 and T1539 describe particular acquired token or cookie outcomes; they may coexist with this object without substituting for path evidence.
      - zh: 只有恶意 DNS/ARP/DHCP 或无线接入、流量可见性、服务降级、断线及拒绝服务而没有凭据承载交换的证据时，暂不判作 TA0006 凭据获取。T1689、T1600 等 TA0112 对象若描述的是保护机制被削弱或被绕过的结果，仍需与本对象的“凭据路径如何被介入”区分。正常企业代理、获授权红队、合法无线漫游和有审计记录的网络迁移可产生类似痕迹，须以授权关系、配置所有者、流量目的与认证结果排除。
        en: Rogue DNS, ARP, DHCP, or wireless behavior, traffic visibility, downgrade, outage, or denial of service without evidence of an authentication-bearing exchange does not yet establish TA0006 Credential Access. TA0112 objects such as T1689 and T1600 may describe a protection degradation or bypass outcome and remain distinct from how this object intervenes in the credential path. Authorized enterprise proxies, sanctioned tests, legitimate wireless roaming, and audited network migrations can produce similar traces and require exclusion through authorization, configuration ownership, traffic purpose, and authentication outcome.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 企业终端在名称解析失败、DHCP 更新、首次连接无线网络或访问受信内部资源时，会从周边网络接受对路径的指示；位于同一广播域、可控制相邻网络设备或能诱导访问代理入口的攻击者可能介入这些时刻。示例包括只对少数主机提供恶意 DNS/WPAD 指向并接收自动认证，以及把受害主机发出的 NTLM 证明中继到另一内部服务。Web 钓鱼链中的代理也属于 T1557 的宽泛行为背景，但其首次入口伪装已经另有正式子项，若在 TA0006 记录应侧重经验证的凭据路径或结果。
          en: Enterprise endpoints accept path instructions from their surroundings when resolving a name, renewing DHCP, joining a wireless network, or reaching a trusted internal resource. An actor on the same broadcast domain, controlling an adjacent network device, or able to draw a user to a proxy entry can intervene at those moments. Examples include giving malicious DNS or WPAD directions only to a few hosts and receiving automatic authentication, or relaying a victim's NTLM proof to a different internal service. Proxying in a web phishing chain is part of T1557's broad behavior, but first-entry disguise already has a formal child elsewhere; TA0006 analysis should focus on verified credential path or outcome.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要对认证路径中的一个信任指向拥有控制权，例如可发送被终端接受的解析或配置回答、部署使目标选择的无线接入点、控制网关或诱导访问反向代理。选择性替换还需要知道或推断目标主机名、服务名和响应时机；跨目标中继还需要可触发或接收认证、到达目标服务，并依赖目标协议未强制足以绑定服务身份、消息完整性或 TLS 通道的保护。攻击者不能仅凭监听权限完成本对象，也不能保证所有被引流的会话暴露可复用凭据。
            en: The actor needs control over a trust direction in the authentication path, such as an accepted resolution or configuration response, an access point the target selects, a gateway, or a reverse proxy that the victim visits. Selective replacement additionally requires knowledge or inference of host names, service names, and response timing. Cross-destination relay requires a way to solicit or receive authentication, reach the target service, and a target protocol that does not enforce adequate binding to service identity, message integrity, or the TLS channel. Listen-only access is insufficient, and redirecting traffic does not guarantee that reusable credentials are exposed.
      defender_model:
        paragraphs:
          - zh: 防守方可在交换机、无线控制器、DHCP/DNS 服务、端点网络配置、身份提供方及目标服务取得不同片段。网络管理员能确认哪个端口、BSSID、DHCP 服务器或 DNS 回答曾宣称权威，却未必看到加密后的认证内容；身份团队能看到成功登录、源 IP、设备、会话和签名或绑定错误，却未必知道受害终端原本访问的目的地。实施检测时需以设备、时间、事务、名称、网络连接及认证事件建立跨平面关联，并说明未覆盖个人设备、外部 Wi-Fi、加密 DNS 或缺少交换机遥测的盲区。
            en: Defenders hold different fragments in switch and wireless-controller logs, DHCP and DNS services, endpoint network configuration, identity providers, and target services. Network operators can establish which port, BSSID, DHCP server, or DNS answer claimed authority but may not see encrypted authentication content. Identity teams can see successful sign-ins, source IP, device, session, and signing or binding failures but may not know the destination the client intended. Detection needs cross-plane joins on device, time, transaction, name, connection, and authentication events, with explicit blind spots for personal devices, external Wi-Fi, encrypted DNS, and absent switch telemetry.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary: {zh: "伪装受信路径或延续真实认证结果", en: "Mimic a trusted path or continue a real authentication outcome"}
      analysis:
        paragraphs:
          - zh: 攻击者把自己控制的网络回答、接入标识或代理置于受信目的地之前，使终端仍沿熟悉的名称、SSID 或登录过程行动，或者把挑战应答转给真实服务以产生成功认证。可见特征因此更接近正常连接和正常登录，而真正改变的是响应者、实际路径或认证来源。单看服务成功日志和用户体验容易误判；把原始请求、实际回答者、目的地和目标服务认证拼接后仍可识别不一致。
            en: The actor puts an adversary-controlled network answer, access identity, or proxy ahead of the trusted destination. The endpoint continues under a familiar name, SSID, or login flow, or the challenge response is sent to a real service that records successful authentication. Visible features resemble an ordinary connection and sign-in while the responder, actual path, or authentication source changes. A service success log or user experience alone can mislead; joining the initial request, actual responder, destination, and target-service authentication can expose the mismatch.
      evidence_keys: [TA0006-001-T1557-REF-ATTACK, TA0006-001-T1557-REF-MITM6, REF-000067, TA0006-001-T1557-REF-RELAY]
      confidence: moderate
    - mechanism_ref: NM-ST
      role: secondary
      summary: {zh: "将伪造路径回答限定在少数主机和服务", en: "Limit forged path answers to selected hosts and services"}
      analysis:
        paragraphs:
          - zh: 可按主机和名称过滤的恶意 DHCPv6/DNS 回答让攻击者只改变与目标认证有关的少数路径，其他终端仍使用正常解析。短租期与短 DNS TTL 进一步缩短配置差异持续时间，降低全网快照碰到异常的机会；但该效果是由一手工具设计与检测逻辑推导，尚无独立入侵测量证明其告警下降幅度。保留逐设备历史、竞争回答和认证结果可恢复这些稀疏痕迹。
            en: Host- and name-filtered malicious DHCPv6 and DNS answers let the actor alter only a few paths relevant to a target authentication while other clients continue to resolve normally. Short leases and DNS TTLs also shorten configuration divergence and can reduce the chance that a network-wide snapshot catches it. That observation effect is inferred from the first-party tool design and detection logic; no independent intrusion measurement establishes a reduction in alert rate. Per-device history, competing answers, and authentication outcomes can recover the sparse traces.
      evidence_keys: [TA0006-001-T1557-REF-MITM6, TA0006-001-T1557-REF-CISCO]
      confidence: hypothesis
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
        - zh: 拟设两个 Niji 原生子项。第一个改变“哪些请求收到伪造指向及指向持续多久”，因此防守方需从稀疏控制平面痕迹恢复受害者集合。第二个改变“受害者发出的认证证明最终由哪个服务验证”，因此防守方需比较原始目的地、接受认证的目标和协议绑定。两者可以同时出现，但变量、直接痕迹和缓解控制不同。ARP、DHCP、LLMNR 与无线不是子项名称或数量依据；钓鱼 IdP 代理的首次入口分类已在 NJS-0057-004，不能再作为同名兄弟项。
          en: Two Niji-native children are proposed. The first changes which requests receive a forged direction and how long it persists, so the defender must reconstruct a victim set from sparse control-plane traces. The second changes which service ultimately validates a proof initiated by the victim, so the defender must compare the intended destination, the accepting target, and protocol binding. They can co-occur, but the controlled variable, immediate traces, and controls differ. ARP, DHCP, LLMNR, and wireless are neither child names nor a count target. First-entry classification of phishing IdP proxying already exists in NJS-0057-004 and must not be duplicated as a sibling here.
    child_temporary_keys: [TA0006-001-T1557-CH-SELECTIVE, TA0006-001-T1557-CH-RELAY]
proposed_subtechniques:
  - temporary_key: TA0006-001-T1557-CH-SELECTIVE
    name: {zh: "选择性信任指向替换", en: "Selective Trust-Direction Substitution"}
    confidence: moderate
    summary: {zh: "只对选定终端或服务提供短驻留的恶意网络指向，使凭据流改道而多数网络状态保持正常。", en: "Give selected endpoints or services short-lived malicious path directions, diverting authentication traffic while most network state remains ordinary."}
    definition_and_concept:
      paragraphs:
        - zh: 选择性信任指向替换是攻击者按受害主机、查询名称、服务或有限时段回应网络路径请求，令目标的认证流抵达攻击者位置，同时让未选中的请求继续得到正常处理。它控制的是伪造指向的适用集合与驻留时间，而不是 DNS、DHCP、ARP 或无线中的某个协议名称。仅有过滤功能而无与认证流的关联，不足以证明本子项已在事件中实施。
          en: Selective Trust-Direction Substitution means answering path requests only for chosen victims, queried names, services, or a bounded period, so their authentication traffic reaches the actor while other requests keep their normal handling. The variable is the set and residence time of forged directions, not a particular DNS, DHCP, ARP, or wireless protocol. A filter capability without an authentication-flow link does not establish this child in an incident.
    stealth_characteristics:
      paragraphs:
        - zh: 选择性信任指向替换使路径异常在主机和名称维度上呈稀疏分布。攻击者可只伪答目标需要的 WPAD 或内部资源名，并以较短租期和 TTL 让配置在停止后恢复；用全网平均、长驻留网关变化或持续大量应答作阈值的规则更易漏掉。仍可在被选中的主机上观察到短暂 DNS/DHCP 差异、非授权响应者和到攻击者节点的认证连接，所以应通过逐设备历史与多平面关联检验匿迹假说。
          en: Selective Trust-Direction Substitution makes path anomalies sparse by host and name. The actor can answer only a WPAD or internal-resource name needed by the target and use short leases and TTLs so configuration reverts after the attack stops. Rules based on network-wide averages, lasting gateway changes, or many continuous replies may miss this pattern. A selected host can still reveal brief DNS or DHCP divergence, an unauthorized responder, and an authentication connection to the actor node, so per-device history and cross-plane correlation are needed to test the stealth hypothesis.
    scope_boundary_definition:
      paragraphs:
        - zh: 本项要求有意限定受害集合或时间范围且该限定改变了防守观察；广泛持续投毒属于父级一般行为。若攻击者把一份认证挑战转给不同真实服务，应另看跨目标认证证明中继；两者并用可双标。合法的按客户端分流 DNS、短租期 DHCP、无线漫游或故障切换可产生局部差异，须核对授权配置、控制者和实际认证流。
          en: This child requires deliberate victim or time scoping that changes defender observation. Broad continuous poisoning remains parent-core behavior. Forwarding an authentication challenge to a different real service is assessed separately as cross-destination proof relay, and both may be present. Legitimate client-specific DNS, short DHCP leases, wireless roaming, and failover can create local differences, so authorization, controller identity, and the actual authentication flow must be checked.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 在企业 IPv6 未被充分监控而 Windows 终端仍接受 DHCPv6 配置的网络中，攻击者可只选择高价值主机和特定名称，诱导其请求代理或内部服务并向攻击者位置认证。相同变量原则也可出现在按查询过滤的名称解析伪答或仅短时启用的网关映射，但具体实现必须另有事件证据。
            en: In an enterprise where IPv6 is poorly monitored and Windows endpoints still accept DHCPv6 configuration, an actor can select high-value hosts and particular names, steering a proxy or internal-service request and its authentication toward the actor. The same variable could apply to query-filtered name replies or briefly enabled gateway mappings, but each concrete implementation needs its own incident evidence.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需处于能接收目标路径请求并送出可被接受的竞争回答的位置，掌握目标主机或服务命名规律，并维持足够时间接到认证流。过窄的目标条件会错失流量；过短的租期会造成重认证或配置摆动，且交换机、端点和 DNS 历史可能完整记录改道。
              en: The actor must receive the target's path requests and deliver a competing answer the endpoint accepts, know or infer host and service naming, and hold the diversion long enough for authentication. An overly narrow selector may miss traffic; an overly short lease may cause reauthentication or configuration churn, and switch, endpoint, and DNS histories may record the diversion.
        defender_model:
          paragraphs:
            - zh: 防守方需要保存每台终端的 DHCPv6 提供者、DNS 服务器与答案、邻居或无线连接变化及随后认证目的地，而不能只汇总某 VLAN 的异常响应总量。授权服务器清单和网络变更记录提供正常基线；当端点不受管或只收集防火墙汇总流时，短期单主机重定向可能不可见。
              en: The defender must retain DHCPv6 providers, DNS servers and answers, neighbor or wireless changes, and subsequent authentication destinations per endpoint rather than only total anomalous replies per VLAN. Authorized-server inventory and change records provide the normal baseline. A short, single-host diversion may remain unseen for unmanaged endpoints or when only aggregate firewall flows are collected.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary: {zh: "将伪造指向局限于少数请求和短时配置", en: "Confine forged direction to a few requests and brief configuration"}
        analysis:
          paragraphs:
            - zh: 主机和名称过滤令大多数网络请求没有变化，而目标终端的认证流被改道；短租期使差异只在有限观察窗口内出现。单一交换机或全网统计只见少量可疑事件，必须把目标终端的控制平面变更与后继认证连接串联才可重建。这是空间和时间上的痕迹稀释；具体规避效果仍需真实部署测量，不可由工具文档直接推成高置信结论。
              en: Host and name filters leave most network requests unchanged while diverting a target's authentication flow, and short leases confine the difference to a limited observation window. A single switch or network-wide statistic sees only a few suspect events; reconstructing the operation requires joining that endpoint's control-plane change to its later authentication connection. This is spatial and temporal trace dilution. Actual evasion effectiveness needs deployment measurement and cannot be elevated to high confidence from tool documentation alone.
        evidence_keys: [TA0006-001-T1557-REF-MITM6]
        confidence: hypothesis
    defense_candidate_keys: [TA0006-001-T1557-DET-PATH, TA0006-001-T1557-MIT-PATH]
    evidence_keys: [TA0006-001-T1557-REF-MITM6, TA0006-001-T1557-REF-CISCO]
    limitations:
      paragraphs:
        - zh: mitm6 原作者文档和代码证明可按主机、名称、短 TTL 控制伪答，尚未证明真实攻击活动使用该组合降低了多少告警。ARP 与无线能否以同一方式形成稳定选择性轴，需要独立实例；现阶段只按变量定义，不把所有协议实例视为已证。认证流仍须实证连接到中间位置。
          en: The mitm6 author's documentation and code establish host, name, and short-TTL control, but not how much any real intrusion reduced alerts with that combination. Whether ARP and wireless implementations realize the same stable selective axis needs separate cases; the variable is defined without claiming every protocol instance is proven. The authentication flow still has to be linked empirically to the intermediary.
  - temporary_key: TA0006-001-T1557-CH-RELAY
    name: {zh: "跨目标认证证明中继", en: "Cross-Destination Authentication-Proof Relay"}
    confidence: moderate
    summary: {zh: "将受害者面向诱导目标发出的认证证明转送给另一真实服务，使目标记录正常认证而原始目的地与实际验证者分离。", en: "Forward a proof offered by the victim to an induced destination into a different real service, separating the intended destination from the actual verifier while the latter records authentication."}
    definition_and_concept:
      paragraphs:
        - zh: 跨目标认证证明中继是攻击者在受害者与其认为正在访问的服务之间接收挑战应答，并实时把该证明送给另一可达服务验证，而不需要先破解或明文读取口令。稳定变量是认证证明的原始受众和最终验证者被分离；NTLM 到 SMB 或 LDAP 是已证实例，而不是分类定义。成功中继可取得对目标服务的认证能力，但必须通过目标服务记录和后继动作证明，不能把捕获到的握手等同于成功访问。
          en: Cross-Destination Authentication-Proof Relay receives a challenge response between a victim and the service it believes it is contacting, then forwards that proof in real time to a different reachable service without first cracking or reading the plaintext password. The stable variable is separation of the proof's intended audience from its eventual verifier. NTLM to SMB or LDAP is an evidenced instance, not the definition. Successful relay can yield authentication capability at the target service, but target-side records and follow-on actions must establish that outcome; capturing a handshake alone is insufficient.
    stealth_characteristics:
      paragraphs:
        - zh: 攻击者通过真实服务完成验证，因而目标服务可出现一次“正确账户、正确响应”的认证而非明显猜测失败；受害终端仍按原来的资源名或自动认证行为发送证明。两端日志各自看似合理，却没有说明为何认证来源、目标服务与终端原始目的地不一致。SMB 签名、LDAP 签名和通道绑定可暴露或阻断一部分中继，说明匿迹依赖受众绑定缺口，并非任何加密认证均可被中继。
          en: The adversary has a real service validate the proof, so the target may record an authentication with a correct account and response rather than conspicuous password-guessing failures; the victim still offers the proof under its original resource name or automatic-authentication behavior. Each side's log can appear plausible alone without explaining the mismatch among authentication source, target service, and the endpoint's intended destination. SMB signing, LDAP signing, and channel binding can expose or block particular relays, making this stealth dependent on an audience-binding gap rather than a property of all encrypted authentication.
    scope_boundary_definition:
      paragraphs:
        - zh: 本项纳入跨服务或跨终点实时转送认证证明并尝试让真实目标验证的行为；单纯收集 NetNTLM 哈希后离线破解归 T1110，窃取 Cookie 后重放的结果归 T1539，未改变目标的普通转发与被动监听不成立。Web 钓鱼中真实 IdP 页面代理和 MFA 续接属于已存在的 NJS-0057-004 的首次入口变量；若另在 TA0006 记录 T1557 父级，应聚焦凭据交换事实，不新增与其重复的 Niji 子项。
          en: This child includes real-time transfer of an authentication proof across services or endpoints so a real target is induced to verify it. Capturing a NetNTLM hash for later offline cracking belongs to T1110, a stolen cookie replay outcome belongs to T1539, and ordinary forwarding to the same endpoint or passive listening is insufficient. Proxying a real IdP page and continuing MFA during web phishing is already the first-entry variable of NJS-0057-004. If the event is also recorded under TA0006 T1557 parent, the credential exchange should be the focus without adding a duplicate Niji child.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 名称解析或 DHCPv6 指向被操纵后，Windows 终端可能向伪装的内部资源或 WPAD 端点自动提供 NTLM 证明；中间节点将握手转给允许这种认证的 SMB 或 LDAP 目标。该路径能与选择性伪答同时出现，但本项关注的是证明跨目标验证及由此产生的服务端成功记录，而不是选择了几台受害机。
            en: After name resolution or DHCPv6 direction is manipulated, a Windows endpoint may automatically offer an NTLM proof to a disguised internal resource or WPAD endpoint, and the intermediary forwards the exchange to an SMB or LDAP target that accepts it. This can co-occur with selective false answers, but this child concerns cross-destination verification and the resulting target-side success record, not how many victims were selected.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需要可诱发或截获认证的中间位置、面向目标服务的网络可达性、对挑战应答的实时处理能力以及未强制有效签名或通道绑定的目标。若受害者不发起认证、目标拒绝 NTLM、必须使用 Kerberos 服务身份或强制签名/绑定，则这条路径可能失败；不同协议的细节不能互相推定。
              en: The actor needs an intermediary position that solicits or receives authentication, network reachability to the target service, real-time handling of the challenge response, and a target without effective signing or channel binding enforcement. The path may fail if the victim never authenticates, the target rejects NTLM, a Kerberos service identity is required, or signing or binding is enforced. Details of one protocol cannot be presumed for another.
        defender_model:
          paragraphs:
            - zh: 防守方需把终端发起的原始名称解析及连接、NTLM 审计中的客户端和目标服务、SMB/LDAP 认证结果以及签名或绑定事件连接起来。只有域控成功认证或一条目标服务访问日志时，无法判定请求是否来自中继；缺少终端或交换机来源数据时应降低分类置信度。合法代理、服务账号、扫描器和多跳网络应用是必须排查的正常相似项。
              en: The defender must join the endpoint's original resolution and connection with client and target details from NTLM auditing, SMB or LDAP authentication outcomes, and signing or binding events. A domain-controller success event or a target access log alone cannot establish relay. Without endpoint or switch origin data, classification confidence should fall. Authorized proxies, service accounts, scanners, and multi-hop network applications are legitimate lookalikes to investigate.
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        summary: {zh: "借真实目标验证形成表面正常的认证结果", en: "Use real-target verification to produce an apparently normal authentication result"}
        analysis:
          paragraphs:
            - zh: 攻击者没有提交猜测口令，而是把受害者提供的有效挑战响应转给真实服务，使目标记录合法账户的一次认证。恶意性不在单条成功事件中，而在终端原始目的地、接收证明的中间节点和实际验证者之间的断裂。通过恢复该三方关系，防守方仍可发现伪装；在启用签名和通道绑定的目标上，中继机会本身会降低。
              en: Rather than submit guessed passwords, the actor forwards a victim-supplied valid challenge response to a real service, which records authentication for the legitimate account. The malicious fact is not the single success event but the break among the endpoint's intended destination, the intermediary that received the proof, and the actual verifier. Restoring that three-party relationship exposes the disguise; enforcing signing and channel binding at targets reduces relay opportunity.
        evidence_keys: [TA0006-001-T1557-REF-RELAY, TA0006-001-T1557-REF-SMB, TA0006-001-T1557-REF-LDAP]
        confidence: moderate
    defense_candidate_keys: [TA0006-001-T1557-DET-RELAY, TA0006-001-T1557-MIT-RELAY]
    evidence_keys: [TA0006-001-T1557-REF-RELAY, TA0006-001-T1557-REF-SMB, TA0006-001-T1557-REF-LDAP]
    limitations:
      paragraphs:
        - zh: 现有证据直接支持 Windows/NTLM 面向 SMB 或 LDAP 的中继及相应保护条件；它不能证明所有凭据协议可跨目标中继，也不能仅凭目标成功日志证明一次特定事件的前置路径被操纵。若没有客户端原始目的地、目标服务来源和协议保护状态三者的证据，应把“跨目标”降为假说。
          en: Current evidence directly supports Windows and NTLM relays into SMB or LDAP and the relevant protection conditions. It does not establish that every credential protocol permits cross-destination relay, nor does a target success log alone prove path manipulation in a particular incident. Without the client's intended destination, the target service's observed source, and protocol-protection state, the cross-destination conclusion should remain a hypothesis.
defense_candidates:
  detection_strategies:
    - temporary_key: TA0006-001-T1557-DET-PATH
      decision: create
      name: {zh: "认证路径信任指向差分", en: "Authentication-Path Trust-Direction Differential"}
      objective:
        zh: 将客户端实际接受的解析、配置、邻居或无线权威与授权清单和后继认证目的地对照，发现稀疏路径替换。
        en: Compare accepted resolution, configuration, neighbor, or wireless authority with the authorized inventory and later authentication destinations to find sparse path substitutions.
      subjects: [TA0006-001-T1557-PARENT, TA0006-001-T1557-CH-SELECTIVE]
      domains: [enterprise]
      analytics: [TA0006-001-T1557-NJA-PATH]
      evidence_keys: [TA0006-001-T1557-REF-MITM6, TA0006-001-T1557-REF-CISCO, TA0006-001-T1557-REF-ATTACK]
    - temporary_key: TA0006-001-T1557-DET-RELAY
      decision: create
      name: {zh: "原始目的地与认证验证者差分", en: "Intended-Destination-to-Authentication-Verifier Differential"}
      objective:
        zh: 比较终端发起认证的目的地、中间接收者和实际验证服务，并用签名、通道绑定与结果事件确认可疑中继。
        en: Compare the endpoint's intended authentication destination, the intermediary receiver, and the actual verifying service, using signing, channel-binding, and outcome events to assess relay.
      subjects: [TA0006-001-T1557-PARENT, TA0006-001-T1557-CH-RELAY]
      domains: [enterprise]
      analytics: [TA0006-001-T1557-NJA-RELAY]
      evidence_keys: [TA0006-001-T1557-REF-RELAY, TA0006-001-T1557-REF-SMB, TA0006-001-T1557-REF-LDAP, TA0006-001-T1557-REF-NTLM-AUDIT]
  detection_analytics:
    - temporary_key: TA0006-001-T1557-NJA-PATH
      decision: create
      strategy_key: TA0006-001-T1557-DET-PATH
      platforms: [Windows, macOS, Linux, Network Devices]
      logic:
        paragraphs:
          - zh: 对每台终端构建分钟级路径时间线，记录 DHCPv4/v6 提供者及网关/DNS 选项、DNS/LLMNR 回答者与答案、ARP 邻居映射、无线 SSID/BSSID 与安全配置，并按端口、VLAN、终端和请求名同批准清单及近期变更单比较。把首次不一致指向后 15 分钟内同终端到该地址或其代理服务的 SMB、HTTP、LDAP、IdP 认证流连接；只有出现认证流或服务端结果时升为 T1557/TA0006 候选。对短 TTL、短租期和只影响少数主机的响应优先用同 VLAN 对照，而非要求高频全网异常。
            en: Build a per-endpoint path timeline at minute granularity with DHCPv4/v6 providers and gateway or DNS options, DNS or LLMNR responders and answers, ARP neighbor mappings, wireless SSID/BSSID and security properties. Compare them by switch port, VLAN, endpoint, and requested name with approved inventories and recent change tickets. Join the first mismatching direction to that endpoint's SMB, HTTP, LDAP, or IdP authentication flow toward the address or proxy service within 15 minutes. Escalate to a T1557/TA0006 candidate only when an authentication flow or service-side outcome is present. For short TTLs, leases, and few-host responses, use same-VLAN peers as a contrast rather than requiring high network-wide volume.
      data_requirements:
        - {source_type: dhcpv6-packet, name: {zh: "DHCPv6 请求与回答", en: "DHCPv6 requests and answers"}, channel: null, required_fields: [event.timestamp, client.mac, client.fqdn, server.duid, dns.option, lease.seconds]}
        - {source_type: dns-answer, name: {zh: "DNS 查询与回答", en: "DNS queries and answers"}, channel: null, required_fields: [event.timestamp, client.ip, query.name, responder.ip, response.address, response.ttl]}
        - {source_type: endpoint-address-map, name: {zh: "终端地址映射", en: "Endpoint address mapping"}, channel: null, required_fields: [event.timestamp, endpoint.id, client.mac, client.ip]}
        - {source_type: endpoint-auth-flow, name: {zh: "终端认证网络流", en: "Endpoint authentication network flow"}, channel: null, required_fields: [event.timestamp, endpoint.id, destination.ip, destination.port, authentication.protocol]}
      observables:
        - {zh: "同 VLAN 少数终端接受非授权 DHCP/DNS 回答或短时网关映射后向回答地址发起认证", en: "Only a few endpoints on one VLAN accept an unauthorized DHCP or DNS answer or brief gateway mapping, then authenticate toward the answering address"}
        - {zh: "同一查询存在授权与非授权竞争回答，且受影响终端的后续认证路径与同网段对照终端不同", en: "Authorized and unauthorized answers compete for one query, and the affected endpoint's later authentication path differs from peers on the same segment"}
      correlation: {window: "15m after accepted direction; retain 24h path history for comparison", dimensions: [endpoint.id, vlan.id, switch.port, request.name, responder.ip, answer.address, destination.ip]}
      false_positives: [{zh: "经批准的故障切换、分流 DNS、短期 DHCP 配置、无线漫游、NAC 隔离与红队演练", en: "Approved failover, split-horizon DNS, short DHCP configuration, wireless roaming, NAC quarantine, and authorized exercises"}]
      blind_spots: [{zh: "未受管终端、外部无线网、无镜像/控制器日志、加密 DNS、随机 MAC 和 DHCPv6 请求缺少 FQDN", en: "Unmanaged endpoints, external Wi-Fi, absent packet or controller logs, encrypted DNS, randomized MACs, and DHCPv6 requests without FQDN"}]
      tuning_guidance:
        paragraphs:
          - zh: 维护带有效期和负责人信息的授权 DHCP、DNS、BSSID、网关及代理清单，按网段基线区别多租户与漫游环境；即便在批准来源上仍检查目标主机与实际认证目的地，避免白名单消掉供应链或配置失陷。先以认证连接确认优先级，再以竞争应答及配置漂移提高置信度，不把单个新 BSSID 或短 TTL 当成恶意结论。
            en: Maintain time-bound inventories with owners for approved DHCP, DNS, BSSID, gateway, and proxy infrastructure, and baseline segments separately for multi-tenant and roaming environments. Continue checking affected hosts and actual authentication destinations even for approved sources so allowlists do not erase compromised infrastructure. Prioritize cases with authentication connections and raise confidence through competing answers and configuration drift; a new BSSID or short TTL alone is not a malicious conclusion.
      evidence_keys: [TA0006-001-T1557-REF-MITM6, TA0006-001-T1557-REF-CISCO, TA0006-001-T1557-REF-CISA]
    - temporary_key: TA0006-001-T1557-NJA-RELAY
      decision: create
      strategy_key: TA0006-001-T1557-DET-RELAY
      platforms: [Windows]
      logic:
        paragraphs:
          - zh: 在终端记录原始名称请求与到首个接收者的 SMB/HTTP/LDAP 连接；在域控和目标服务保留 NTLM 8004、相关认证结果及 SMB/LDAP 签名或通道绑定状态。按账户、客户端主机、挑战事务或窄时间窗连接两侧，寻找终端声称的资源与真正接受证明的目标服务不同、目标服务记录的网络来源却是中间节点的序列。一次绑定失败只证明保护拒绝了不匹配，不证明凭据失窃；若目标成功并有后继资源操作，才提高已获认证能力的置信度。
            en: Record the endpoint's original name request and SMB, HTTP, or LDAP connection to the first receiver; retain NTLM 8004 on domain controllers, target-service authentication outcomes, and SMB or LDAP signing and channel-binding state. Join both sides by account, client host, challenge transaction where available, or a narrow time window. Look for a sequence in which the resource named by the endpoint differs from the service that actually accepts the proof and the target service sees the intermediary as its network source. A binding failure shows that protection rejected a mismatch, not that a credential was stolen. A target success followed by resource action raises confidence that authentication capability was acquired.
      data_requirements:
        - {source_type: endpoint-network-auth, name: {zh: "客户端原始请求与认证连接", en: "Client original request and authentication connection"}, channel: null, required_fields: [event.timestamp, endpoint.id, user.id, requested.name, connection.destination, authentication.protocol]}
        - {source_type: windows-ntlm-audit, name: {zh: "Windows NTLM 审计", en: "Windows NTLM audit"}, channel: "Microsoft-Windows-NTLM/Operational event 8004 on domain controllers", required_fields: [event.timestamp, user.id, client.name, accessed_server.name, authentication.result]}
        - {source_type: target-authentication, name: {zh: "目标服务认证结果", en: "Target-service authentication result"}, channel: null, required_fields: [event.timestamp, target.service, user.id, source.ip, authentication.result]}
        - {source_type: smb-ldap-protection, name: {zh: "SMB 或 LDAP 保护状态及拒绝事件", en: "SMB or LDAP protection state and rejection events"}, channel: null, required_fields: [event.timestamp, target.service, protection.type, protection.enforced, protection.result]}
      observables:
        - {zh: "终端访问名称 A 并向中间节点提交证明，短时间内目标 B 从中间节点收到同账户认证且 A 与 B 无批准代理关系", en: "An endpoint requests A and offers a proof to an intermediary, while B receives same-account authentication from that intermediary without an approved proxy relation"}
        - {zh: "与疑似中继序列相连的 SMB 签名拒绝或 LDAP 绑定不匹配及后续目标成功结果", en: "SMB signing rejection or LDAP binding mismatch linked to a suspected relay sequence, or a later target success"}
      correlation: {window: "5m around one authentication challenge and target result", dimensions: [user.id, endpoint.id, client.name, requested.name, connection.destination, accessed_server.name, source.ip]}
      false_positives: [{zh: "经批准的身份代理、跳板服务、负载均衡、服务账号和脆弱旧客户端迁移测试", en: "Authorized identity proxies, jump services, load balancers, service accounts, and migration tests with legacy clients"}]
      blind_spots: [{zh: "未启用 8004 或目标审计、终端原始目的地不可得、协议加密妨碍事务级匹配、同源 NAT 或代理混淆来源", en: "Missing 8004 or target auditing, absent endpoint intended destination, encryption that prevents transaction matching, and NAT or proxies that obscure source"}]
      tuning_guidance:
        paragraphs:
          - zh: 为批准中继器建立服务名、账号、网络来源和用途映射，保持签名/绑定错误与认证成功为不同信号。对高价值 LDAP/SMB 目标优先关联同账户的端点原始目的地和目标结果；没有两侧关联时只输出“异常认证来源”，不要自动定性中间人或材料已失窃。校准时按域控、服务和客户端版本核对事件字段可用性。
            en: Map each approved relay or proxy to service names, accounts, network origins, and purpose; keep signing or binding failures separate from successful authentication. Prioritize joining the endpoint's intended destination and the target outcome for high-value LDAP and SMB services. Without both sides, report an anomalous authentication source rather than automatically asserting an intermediary or stolen material. Validate event-field availability by domain controller, service, and client version during tuning.
      evidence_keys: [TA0006-001-T1557-REF-RELAY, TA0006-001-T1557-REF-NTLM-AUDIT, TA0006-001-T1557-REF-SMB, TA0006-001-T1557-REF-LDAP]
  mitigations:
    - temporary_key: TA0006-001-T1557-MIT-PATH
      decision: create
      name: {zh: "网络路径权威约束", en: "Network-Path Authority Enforcement"}
      description:
        paragraphs:
          - zh: 在接入层限制谁可发布地址、名称、网关与无线身份，并把授权控制面与终端实际采用的配置保留下来。措施应按网络段选择，而不是把关闭一个协议宣称为所有中间人场景的解法。
            en: Constrain who can announce address, name, gateway, and wireless identity at access layers and preserve both authorized control-plane state and what endpoints actually accepted. Select controls by segment rather than presenting one disabled protocol as a solution to every intermediary scenario.
      measures:
        - {key: authorized-dhcp-arp, control_type: preventive, name: {zh: "DHCP 与 ARP 权威约束", en: "DHCP and ARP authority enforcement"}, implementation: {zh: "在受管交换机启用 DHCP snooping 并标注可信端口，以绑定库支持动态 ARP 检查；对 DHCPv6 与 RA 采用单独的受管过滤和可用性验证。", en: "Enable DHCP snooping and trusted-port assignments on managed switches, use its binding database for Dynamic ARP Inspection, and separately validate managed DHCPv6 and RA controls."}}
        - {key: name-and-wireless-authority, control_type: preventive, name: {zh: "名称与无线权威约束", en: "Name and wireless authority enforcement"}, implementation: {zh: "不需要 LLMNR 时通过策略禁用，维护批准 DNS、WPAD 与 AP 清单，并对企业无线接入使用可验证的认证和 Rogue AP 监控。", en: "Disable LLMNR by policy when unnecessary, maintain approved DNS, WPAD, and AP inventories, and use verifiable enterprise wireless authentication and rogue-AP monitoring."}}
      applications:
        - target_key: TA0006-001-T1557-PARENT
          use: {zh: "对承载认证的网段记录每次权威来源变化，阻断非授权 DHCP/ARP 回答和恶意外部名称或无线接入；将实际认证目标同批准服务绑定。", en: "Record authority changes on authentication-bearing segments, block unauthorized DHCP or ARP replies and malicious external name or wireless access, and bind actual authentication destinations to approved services."}
          expected_effect: {zh: "缩小攻击者可插入路径的机会，并让残余改道有可核对的端口、设备和身份结果。", en: "Reduce opportunities to insert an intermediary and make residual diversion auditable through port, device, and identity outcomes."}
          limitations: {zh: "不覆盖攻击者已控制的受信网络设备或组织外部的无线网络；禁用旧协议和开启检查需评估兼容性。", en: "Does not cover a compromised trusted network device or wireless networks outside organizational control; disabling legacy protocols and enabling inspection require compatibility assessment."}
        - target_key: TA0006-001-T1557-CH-SELECTIVE
          use: {zh: "对少量主机的临时答案也执行来源验证和逐终端配置历史保留，不因整体网段异常率低而放行。", en: "Validate the source even for temporary answers affecting a few hosts and retain per-endpoint configuration history rather than allowing them on the basis of a low segment-wide anomaly rate."}
          expected_effect: {zh: "选择性与短驻留不再足以避开接入层阻断和事后路径还原。", en: "Selectivity and brief residence no longer suffice to avoid access-layer blocking and later path reconstruction."}
          limitations: {zh: "不受管交换机和个人设备缺少所需强制点；若批准权威被攻陷，仍需内容与认证结果差分。", en: "Unmanaged switches and personal devices lack required enforcement points; compromise of an authorized authority still requires answer and authentication-outcome comparison."}
      evidence_keys: [TA0006-001-T1557-REF-CISCO, TA0006-001-T1557-REF-LLMNR, TA0006-001-T1557-REF-CISA]
    - temporary_key: TA0006-001-T1557-MIT-RELAY
      decision: create
      name: {zh: "认证受众绑定与抗中继", en: "Authentication-Audience Binding and Relay Resistance"}
      description:
        paragraphs:
          - zh: 通过服务身份验证、消息完整性与通道绑定，使一个目标收到的证明不能被中间节点无感转送给另一目标，并保留不兼容客户端的审计证据。该控制与网络权威约束互补，因为授权路径仍可能发生身份中继。
            en: Require service identity verification, message integrity, and channel binding so a proof offered to one destination cannot be silently forwarded by an intermediary to another, while retaining audit evidence for incompatible clients. This complements network-path controls because authentication relay can still occur along an otherwise authorized path.
      measures:
        - {key: smb-mutual-auth-integrity, control_type: preventive, name: {zh: "SMB 互认与完整性", en: "SMB mutual authentication and integrity"}, implementation: {zh: "为高价值共享要求 SMB 签名或加密及 Kerberos 互认，针对 UNC 路径施加硬化策略，淘汰 SMB1 与不安全访客回退。", en: "Require SMB signing or encryption and Kerberos mutual authentication for high-value shares, apply UNC hardening to relevant paths, and remove SMB1 and insecure guest fallback."}}
        - {key: ldap-signing-binding, control_type: preventive, name: {zh: "LDAP 签名与通道绑定", en: "LDAP signing and channel binding"}, implementation: {zh: "先审计无签名绑定与 CBT 不兼容客户端，再对域控强制 LDAP 签名和适用 LDAPS 的通道绑定，并验证受影响应用。", en: "Audit unsigned binds and CBT-incompatible clients first, then enforce LDAP signing and channel binding where applicable to LDAPS on domain controllers and verify affected applications."}}
      applications:
        - target_key: TA0006-001-T1557-PARENT
          use: {zh: "逐服务识别认证材料可能经过的路径，优先对高权限 SMB、LDAP 与 Web 身份服务采用受众绑定，并为仍用 NTLM 的例外定义到期时间。", en: "Identify credential-bearing paths by service, prioritize audience binding for privileged SMB, LDAP, and web identity services, and set expiration for remaining NTLM exceptions."}
          expected_effect: {zh: "即使攻击者暂时取得中间路径，可被另一个目标接受的认证证明范围也缩小，拒绝事件可供溯源。", en: "Even if an intermediary path is briefly obtained, fewer proofs remain acceptable to a different target and rejection events support reconstruction."}
          limitations: {zh: "SMB 和 LDAP 控制不能直接防住恶意无线门户上的明文输入或已窃 Cookie；旧应用可能不支持强制签名与绑定。", en: "SMB and LDAP controls do not directly prevent plaintext entry into a malicious wireless portal or theft of a cookie; legacy clients may not support required signing and binding."}
        - target_key: TA0006-001-T1557-CH-RELAY
          use: {zh: "对中继目标清单上的 SMB 共享和 LDAP 服务强制签名、服务身份校验及通道绑定，持续审计拒绝与例外。", en: "Enforce signing, service identity validation, and channel binding on SMB shares and LDAP services in the relay target inventory, while auditing rejections and exceptions."}
          expected_effect: {zh: "跨目标转送的挑战响应无法在受保护服务上悄然完成验证，失败及异常来源成为可用信号。", en: "A cross-destination challenge response cannot silently authenticate to protected services; failures and anomalous origins become useful signals."}
          limitations: {zh: "仍允许 NTLM 的未受保护服务、其他未绑定协议和已取得明文秘密的攻击路径不受这组措施充分覆盖。", en: "Unprotected services that still accept NTLM, other unbound protocols, and paths where plaintext secrets have already been acquired remain outside this control's full coverage."}
      evidence_keys: [TA0006-001-T1557-REF-SMB, TA0006-001-T1557-REF-LDAP, TA0006-001-T1557-REF-RELAY]
