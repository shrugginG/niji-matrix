      - {child_key: TA0006-001-T1557-CH-RELAY, evidence_keys: [TA0006-001-T1557-REF-RELAY, TA0006-001-T1557-REF-SMB, TA0006-001-T1557-REF-LDAP], level: original_research_and_official_protection_model}
