research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 6
    attack_subtechnique_ids:
    - T1555.001
    - T1555.002
    - T1555.003
    - T1555.004
    - T1555.005
    - T1555.006
    represented_dimensions:
    - zh: 本机系统钥匙串与 Windows 凭据集的授权边界
      en: Local keychain and Windows credential-set authorization
    - zh: 浏览器及第三方管理器的密文文件和解锁运行态
      en: Encrypted files and unlocked runtime of browsers and third-party managers
    - zh: 云秘密服务的身份、资源权限和数据访问审计
      en: Cloud secret-service identity, resource rights, and data-access audit
    breadth_trigger: six-plus-second-pass
    coverage_resolutions:
    - attack_id: T1555.001
      resolution: niji-variable-candidate
      mapped_keys:
      - TA0006-002-T1555-CHILD-CONSUMER
      - TA0006-002-T1555-CHILD-COPY
      note_zh: Keychain 授权读取与受保护库复制是不同变量，平台名不是子项。
      note_en: Keychain authorized reads and protected-copy movement are different variables, not platform children.
    - attack_id: T1555.002
      resolution: niji-variable-candidate
      mapped_keys:
      - TA0006-002-T1555-CHILD-RUNTIME
      note_zh: securityd 只提供旧版内存路径证据，不成为平台子项。
      note_en: securityd provides legacy memory-path evidence, not a platform child.
    - attack_id: T1555.003
      resolution: niji-variable-candidate
      mapped_keys:
      - TA0006-002-T1555-CHILD-COPY
      - TA0006-002-T1555-CHILD-RUNTIME
      note_zh: 浏览器数据库复制与运行态取用也可跨其他保管库发生。
      note_en: Browser database copy and runtime retrieval can occur across other stores.
    - attack_id: T1555.004
      resolution: parent-core
      mapped_keys:
      - TA0006-002-T1555-REF-MICROSOFT-CREDREAD
      note_zh: CredRead 描述会话令牌下返回一个凭据，但不独立证明匿迹变量。
      note_en: CredRead explains a single credential return under a logon token but does not independently prove a stealth
        variable.
    - attack_id: T1555.005
      resolution: niji-variable-candidate
      mapped_keys:
      - TA0006-002-T1555-CHILD-CONSUMER
      - TA0006-002-T1555-CHILD-COPY
      - TA0006-002-T1555-CHILD-RUNTIME
      note_zh: 密文库、事件触发器与短暂明文分别为跨产品变量提供证据。
      note_en: Encrypted vaults, event triggers, and transient plaintext inform cross-product variables.
    - attack_id: T1555.006
      resolution: niji-variable-candidate
      mapped_keys:
      - TA0006-002-T1555-CHILD-CONSUMER
      note_zh: 云库角色可以呈现受信调用，但需要实际内容读取审计。
      note_en: A cloud role can present a trusted call, subject to actual content-read audit.
    candidate_stealth_axes_examined:
    - axis: trusted_consumer_authority
      disposition: formal
      why_zh: 可控消费身份改变合法外观，需配置和来源差分。
      why_en: Controllable consumer identity changes legitimate appearance and requires configuration and origin differentials.
    - axis: protected_copy_displacement
      disposition: conditional-defer
      why_zh: 副本改变逐项审计，但只有密文外传时尚不足以宣称可用凭据已获。
      why_en: Copy changes per-item audit, but ciphertext exfiltration alone does not prove a usable credential was acquired.
    - axis: unlocked_runtime_bypass
      disposition: formal-with-legacy-limit
      why_zh: 内存取用改变传感器和提示路径；旧版 macOS 证据不得泛化。
      why_en: Memory retrieval changes sensor and prompt path; legacy macOS evidence cannot be generalized.
    - axis: narrow_low_rate_api_reads
      disposition: deferred
      why_zh: 按条目 API 可用，却缺少攻击者刻意稀释及阈值失效的原始证据；并与受信身份轴交叉。
      why_en: Per-item APIs exist, but primary evidence lacks intentional dilution and threshold defeat; the axis overlaps
        trusted identity.
    - axis: cross_device_control_plane_separation
      disposition: deferred
      why_zh: 同步和跨云来源可改变归因，但没有足以固定兄弟边界与独立防御的结论级证据。
      why_en: Sync and cross-cloud origin can alter attribution, but conclusion-level evidence does not fix a sibling boundary
        or distinct defense.
    - axis: product_platform_partition
      disposition: rejected
      why_zh: Keychain、浏览器、Windows、第三方及云产品本身不是稳定匿迹变量。
      why_en: Keychain, browser, Windows, third-party, and cloud product labels are not stable stealth variables.
    second_pass_required: true
    second_pass_completed: true
    second_pass_method:
      zh: 第一轮逐项映射六个 ATT&CK 子项的实现和存储维度；第二轮舍弃其名称，从调用主体、解锁时点、材料状态、观测域、读取节奏、资源范围及跨设备来源重新搜索，每项测试攻击者控制、前后痕迹、传感器差异、证据与防御价值。
      en: Pass one mapped implementation and storage dimensions for all six ATT&CK children. Pass two discarded their names
        and searched caller identity, unlock timing, material state, observation domain, pacing, resource scope, and cross-device
        origin, testing control, before/after traces, sensor difference, evidence, and defense value.
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: 六项收敛为三条研究轴，原因是原子项的大部分差异为平台或实现，而非独立匿迹变量。密文副本轴仅条件建议：若主 Agent 无法把副本暴露与同一事件的成功解锁或秘密返回相连，应 defer，不为凑数正式化；这时正式子项可收敛为两项，广度缺口已由六项覆盖和第二轮搜索说明。
      en: Six ATT&CK items converge to three research axes because much of their diversity concerns platforms or implementations
        rather than independent stealth variables. Protected-copy displacement is conditional; absent same-incident successful
        unlock or secret-return evidence, the primary agent should defer it rather than formalize it for count. Formal children
        may then converge to two; the six-row coverage and second pass explain that breadth gap.
  evidence_coverage:
    parent_behavior_keys:
    - TA0006-002-T1555-REF-ATTACK
    - TA0006-002-T1555-REF-APPLE-RETURN
    - TA0006-002-T1555-REF-MICROSOFT-CREDREAD
    - TA0006-002-T1555-REF-AWS-CLOUDTRAIL
    boundary_keys:
    - TA0006-002-T1555-REF-KEEPASS-KEYS
    - TA0006-002-T1555-REF-GTIG-RANSOM
    - TA0006-002-T1555-REF-UNC1069
    mechanism_support:
    - mechanism: NM-FD
      keys:
      - TA0006-002-T1555-REF-MANDIANT-REDTEAM
      - TA0006-002-T1555-REF-APPLE-ACCESS
      - TA0006-002-T1555-REF-AWS-IAM
      limit: Direct KeePass experiment; API feasibility elsewhere
    - mechanism: NM-BT
      keys:
      - TA0006-002-T1555-REF-UNC1069
      - TA0006-002-T1555-REF-KEYDNAP
      - TA0006-002-T1555-REF-KEEPASS-SECURITY
      limit: Different incidents and product generations; do not merge into one event
    child_existence_support:
    - child_key: TA0006-002-T1555-CHILD-CONSUMER
      keys:
      - TA0006-002-T1555-REF-MANDIANT-REDTEAM
      - TA0006-002-T1555-REF-APPLE-ACCESS
      - TA0006-002-T1555-REF-AWS-IAM
    - child_key: TA0006-002-T1555-CHILD-COPY
      keys:
      - TA0006-002-T1555-REF-UNC1069
      - TA0006-002-T1555-REF-GTIG-RANSOM
      - TA0006-002-T1555-REF-KEEPASS-KEYS
      status: conditional-defer-without-unlock-proof
    - child_key: TA0006-002-T1555-CHILD-RUNTIME
      keys:
      - TA0006-002-T1555-REF-KEYDNAP
      - TA0006-002-T1555-REF-KEEPASS-SECURITY
    unsupported_or_deferred:
    - zh: 云 API 低频取用一定降低告警概率缺少阈值或原始案例支持。
      en: No threshold or original case shows low-rate cloud API reads necessarily reduce alerts.
    - zh: UNC1069 和 UNC2465 的库副本外传不能自动证明全部秘密已返回。
      en: UNC1069 and UNC2465 vault-copy exfiltration does not prove all secrets were returned.
    - zh: Chrome 127 App-Bound Encryption 公告先覆盖 Cookie，不能证明所有浏览器密码已获此保护。
      en: Chrome 127 App-Bound Encryption initially addressed cookies and does not prove all browser passwords gained it.
    - zh: 未核到适于跨部署使用的 Windows Credential Manager 5379 官方字段规范，故不以此支撑检测。
      en: No broadly usable official Windows Credential Manager 5379 field specification was verified, so detection does not
        rely on it.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父稿分别论证直接行为、观察变化、邻接技术、威胁前提和残余痕迹；三个子稿各有独立变量及检测、缓解意义。密文副本子项故意保留准入裁决点，不以字段完整掩盖证据缺口。
      en: The parent separately argues direct behavior, observation change, neighboring techniques, prerequisites, and residual
        traces. Each child has its own variable and detection/mitigation value. The copy child deliberately retains an admission
        decision point rather than hiding its evidence gap behind complete fields.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization and recursive structural audit only
  limitations:
    paragraphs:
    - zh: 一手资料的结论层级不同：厂商文档证明 API 与控制语义，Mandiant 红队实验证明一次 KeePass 明文导出，UNC1069 与 UNC2465 主要证明受保护副本外传，Keydnap 只证明旧版 securityd
        内存路径。不能把跨事件、跨产品的阶段拼成一条已观察到的完整攻击链；云 API 成功也不证明后继使用。正式对象置信度应随可证实的返回、解锁和受害方遥测调整。
      en: Primary sources support different conclusion levels. Vendor documents establish API and control semantics; Mandiant's
        red-team experiment proves one KeePass plaintext export; UNC1069 and UNC2465 mainly prove protected-copy exfiltration;
        and Keydnap proves a legacy securityd memory path. Stages from different incidents or products cannot be spliced into
        one observed chain. Cloud API success does not prove successor use. Formal confidence should track verified return,
        unlock, and victim telemetry.
    - zh: 端点逐项审计、云 Data Access 启用状态和自托管导出日志随部署而变，Analytic 必须先检查字段可用性。合法备份、同步、轮换和故障处置经常与恶意操作同形；规则精度依赖本地用途基线和有期限审批。若只有正常运维事件而无攻击者操控变量，应降低置信度或排除。
      en: Endpoint per-item audit, cloud Data Access enablement, and self-hosted export logs vary by deployment, so each analytic
        must first verify fields. Legitimate backup, sync, rotation, and incident response can resemble malicious operations.
        Precision depends on local purpose baselines and time-bounded approvals. If there is only ordinary operational activity
        and no attacker-controlled variable, lower confidence or exclude.
  rejected_mechanisms:
  - mechanism: NM-ST
    reason_zh: 无 T1555 原始资料证实刻意低频或多来源读取规避阈值。
    reason_en: No T1555-specific primary source establishes deliberate low-rate or distributed reads evading thresholds.
  - mechanism: NM-DO
    reason_zh: 静态密文是防护属性，不等于攻击者主动改变数据可见性。
    reason_en: Encryption at rest is a defense property, not necessarily attacker-controlled data obscuration.
  open_questions:
  - zh: 主 Agent 应裁定密文副本子项是否有足够同一事件的成功解锁证据，否则仅保留为研究或前置暴露阶段。
    en: The primary agent should seek same-incident unlock evidence for the copy child or retain it only as research or a
      precursor exposure stage.
  - zh: 本地目标产品能否提供逐项读取、解锁和导出字段，需要逐部署实测。
    en: Availability of per-item read, unlock, and export fields needs deployment-specific testing.
