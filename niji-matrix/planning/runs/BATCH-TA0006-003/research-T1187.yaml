    proposition_en: A lure or remote invocation, outbound connection, challenge-response arrival, subsequent relay, and offline cracking are distinct evidence stages, and a failed connection does not prove material acquisition.
    evidence_keys: [TA0006-003-T1187-REF-MS-CVE23397, TA0006-003-T1187-REF-MS-NLMP, TA0006-003-T1187-REF-MS-KB5005413]
  - temporary_key: TA0006-003-T1187-CLM-RESOLUTION
    resolution: create
    proposition_zh: 攻击者控制的后台资源属性可使受信应用在没有明确登录动作时以当前用户上下文发出认证交换，异常因此转移到对象来源和认证目的地。
    proposition_en: An adversary-controlled background resource property can make a trusted application emit authentication under the current user context without an explicit sign-in action, moving the anomaly to object provenance and destination.
    evidence_keys: [TA0006-003-T1187-REF-MS-CVE23397, REF-000439, TA0006-003-T1187-REF-ATTACK]
