handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-003
work_item_ref: WORK-TA0006-T1187
temporary_key_prefix: TA0006-003-T1187
candidate:
  source_type: attack
  source_attack_id: T1187
  name:
    zh: 诱发认证交换外发
    en: Induced Authentication-Exchange Emission
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 的 T1187 明确属于 Credential Access，并覆盖让用户终端或服务器向攻击者可观察位置发出认证材料的行为，因此父候选应保留；但固定页把文档、快捷方式、图标、SMB、WebDAV 与 EFSRPC 等诱因、载体和协议并列，还把材料捕获、离线破解与中继放在同一叙述中，这些实现名不能直接成为 Niji 子技术。建议把正式父范围改写为“攻击者控制触发条件，使受害主体或设备向其可观察目标实际发出挑战响应或等价认证材料”，并把诱因存在、连接尝试、材料到达、后继中继或破解分为独立证据阶段。
      en: ATT&CK Enterprise 19.1 places T1187 in Credential Access and covers causing a user endpoint or server to send authentication material to an adversary-observable location, so the parent candidate should be retained. The fixed page, however, mixes documents, shortcuts, icons, SMB, WebDAV, and EFSRPC as triggers, carriers, and protocols, then discusses capture, offline cracking, and relay in one narrative. Those implementation labels cannot become Niji children. The formal parent should be adapted to an adversary-controlled trigger that causes a victim principal or device to actually emit a challenge response or equivalent authentication material to an observable target, while trigger presence, connection attempt, material arrival, relay, and cracking remain separate evidentiary stages.
    - zh: 固定基线没有 ATT&CK 子项，开放搜索仍发现两个稳定且可跨产品出现的 Niji 变量。其一把恶意网络引用藏在会被应用、桌面或消息客户端后台解析的对象中，由当前用户上下文自动发起认证；其二通过可远程调用的服务控制面，让系统服务或机器身份向指定位置认证。两者在触发主体、账户语义、前后痕迹、检测连接键和缓解强制点上均不同。用户是否点击、使用 SMB 还是 HTTP、载体是文档还是图片、以及监听器产品都只是属性；后续中继归 NJT-0136/NJS-0136-002，离线候选验证归 NJT-0137/NJS-0137-003。
      en: Although the fixed baseline has no ATT&CK children, an open search found two stable cross-product Niji variables. One hides a network reference in an object that an application, shell, or messaging client resolves in the background, causing authentication under the current user context. The other invokes a remotely reachable service control plane so a system service or machine identity authenticates to a chosen location. They differ in initiating principal, account semantics, before-and-after traces, detection join keys, and mitigation enforcement points. User click state, SMB versus HTTP, document versus image carrier, and listener product remain attributes. Subsequent relay belongs to NJT-0136/NJS-0136-002, and offline candidate verification belongs to NJT-0137/NJS-0137-003.
proposed_content:
  summary:
    zh: 攻击者操纵资源解析或远程服务调用，使受害用户或设备在看似正常的应用与系统流程中向攻击者可观察目标发出认证交换。
    en: An adversary manipulates resource resolution or a remote service invocation so a victim user or device emits an authentication exchange to an adversary-observable target through an apparently ordinary application or system flow.
  definition_and_concept:
    paragraphs:
    - zh: 诱发认证交换外发是攻击者布置一个由受害端自动解析的网络引用，或调用一个会代表受害设备访问网络资源的服务操作，使受害用户、服务或机器账户向攻击者可观察位置产生认证挑战应答、协商消息或等价材料。其直接目的不是让受害者完成一次自己选择的登录，而是把已有身份上下文转化为攻击者可取得的认证证明。实现可以经过文件共享、Web 资源或远程管理协议，但协议和载体只决定传输与传感器，不决定技术身份。
      en: Induced Authentication-Exchange Emission occurs when an adversary plants a network reference that a victim endpoint resolves automatically, or invokes a service operation that accesses a network resource on behalf of the victim device, causing a user, service, or machine account to produce a challenge response, negotiation message, or equivalent material at an adversary-observable location. The immediate purpose is to turn an existing identity context into an authentication proof available to the adversary, rather than to complete a login chosen by the victim. File sharing, web resources, and remote-management protocols change transport and sensors, not technique identity.
    - zh: 证据链必须依次区分诱因被投递或远程调用被接受、目标设备实际发起连接、认证协议产生材料、攻击者端或中继节点确实观察到材料，以及材料被破解或被其他服务接受。Microsoft 对 CVE-2023-23397 的调查直接证明恶意消息属性可在无用户交互时触发 Net-NTLMv2 材料泄露，并明确指出失败的 SMBClient/WebDAV 痕迹只能证明外连尝试；EFSRPC 规范和 PetitPotam 实验则证明合法远程服务方法可被用来促使服务器向指定监听位置认证。任何阶段缺失都应降低结论，不可从 UNC 字符串或失败连接直接推断凭据已获。
      en: Evidence must separately establish delivery of a lure or acceptance of a remote invocation, an actual victim connection, production of authentication material, observation of that material at an adversary endpoint or relay, and later cracking or acceptance by another service. Microsoft's CVE-2023-23397 investigation directly establishes a malicious message property causing Net-NTLMv2 leakage without user interaction and explicitly warns that failed SMBClient or WebDAV artifacts prove only a connection attempt. The EFSRPC specification and PetitPotam experiment establish that a legitimate remote service method can be used to make a server authenticate to a chosen listener. Missing stages require lower confidence; a UNC string or failed connection cannot alone establish credential acquisition.
  stealth_characteristics:
    paragraphs:
    - zh: 诱发认证通常借用应用读取远程资源、桌面渲染图标、消息提醒处理或系统服务访问网络对象等正常功能，终端侧因此可能只看到受信进程或系统服务发起一次普通网络连接，认证材料则在远端被观察。Microsoft 说明 CVE-2023-23397 不需要用户打开消息，且传统端点取证痕迹很少；这使“用户没有登录动作”不能排除认证交换。异常辨识需要恢复谁控制了目标地址、哪个对象或调用触发连接、认证使用了哪个主体，以及远端是否收到挑战响应。
      en: Induced authentication commonly reuses ordinary functions such as application retrieval of a remote resource, shell icon rendering, reminder processing, or a system service accessing a network object. The endpoint may therefore show only a trusted process or system service making an ordinary connection while the material is observed remotely. Microsoft states that CVE-2023-23397 requires no message interaction and leaves few traditional endpoint forensic artifacts, so the absence of an explicit sign-in action does not exclude an authentication exchange. Discrimination requires reconstructing who controlled the destination, which object or invocation triggered the connection, which principal authenticated, and whether the remote side received a response.
    - zh: 攻击者还可把投递与认证触发分离，或把入站远程调用、受害机外连与后继中继分散到不同主机和时间。Outlook 恶意提醒属性可设置为未来触发；服务胁迫则由攻击者先连入 RPC 接口，再由服务进程以机器或服务身份连接另一目标。局部日志会分别呈现邮件或对象、合法服务调用和正常账户认证，只有跨对象哈希、消息属性、进程、RPC 接口、账户、目的地与窄时间窗关联后才形成完整链。延迟和分面不会抹除证据，但会削弱只看用户点击或单一服务器登录的规则。
      en: The adversary may separate delivery from authentication in time, or distribute an inbound remote invocation, victim egress, and later relay across different hosts. A malicious Outlook reminder property can be scheduled for a later time; service coercion begins with an inbound RPC call and continues when a service process connects elsewhere using a machine or service identity. Local logs separately resemble a message or object, a legitimate service call, and an ordinary account authentication. The complete chain emerges only through object hash, message property, process, RPC interface, account, destination, and narrow-window correlation. Delay and split observation do not erase evidence, but weaken rules limited to user clicks or one server's login log.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求攻击者对触发对象、远程调用或认证目的地至少具有一项可证明的控制，并且受害主体实际产生认证材料到达攻击者可观察目标。合法内网单点登录、企业文件共享、备份、打印、证书注册和获批远程管理可产生相同协议交换；必须以对象来源、调用授权、目标清单、账户用途和结果排除。只有诱因、可利用接口、漏洞存在、DNS/SMB 连接尝试或 WebDAV 回退而没有材料到达证据时，只能记录暴露或未决状态。
      en: Inclusion requires evidence that the adversary controlled at least one of the triggering object, remote invocation, or authentication destination, and that the victim principal actually produced authentication material that reached an adversary-observable target. Legitimate intranet single sign-on, enterprise shares, backup, printing, certificate enrollment, and authorized remote administration can produce the same protocol exchanges and require exclusion through object provenance, call authorization, destination inventory, account purpose, and outcome. A lure, reachable interface, vulnerability, DNS or SMB connection attempt, or WebDAV fallback without evidence of material arrival supports exposure or unresolved status only.
    - zh: NJT-0119/NJS-0119-002 解释文档外部引用如何把静态对象与运行时认证结果分离；文档模板既证明引用变量又证明认证材料到达时，可与本技术并列，文档或图片名称本身不得成为本技术子项。首次入口中的仿冒登录页和实时身份提供方代理归钓鱼及相应入口技术；NJT-0136 需要攻击者改变既有认证路径或把证明转给另一目标，本技术只解释为何受害端主动产生证明。捕获后的离线比较归 NJS-0137-003；密码成功破解、证明在目标服务被接受、Cookie 或令牌取得以及账户实际使用都必须另证。
      en: NJT-0119/NJS-0119-002 explains how a document external reference separates a static object from a runtime authentication outcome. A template event can carry both labels when it proves the reference variable and material arrival, but document or image labels cannot become children here. A counterfeit sign-in page or real-time identity-provider proxy at first entry belongs to phishing and its entry techniques. NJT-0136 requires alteration of an existing authentication path or forwarding a proof to another destination; this technique explains why the victim emitted the proof. Offline comparison after capture belongs to NJS-0137-003. Successful cracking, acceptance at a target service, cookie or token acquisition, and actual account use each require separate evidence.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在终端场景中，攻击者可投递含外部资源地址的消息、日历项、快捷对象或其他会被客户端后台解析的元数据，使应用或桌面组件以当前用户上下文访问监听端；CVE-2023-23397 证明提醒属性甚至可在用户不打开消息时触发。文档 attachedTemplate 弹出认证提示并把测试凭据发给服务端的 DarkHydrus/Phishery 事件属于文档专用重叠子集。载体换成图标、媒体或其他属性不改变“后台解析代替显式登录动作”的变量。
        en: In endpoint scenarios, an adversary can deliver a message, calendar item, shortcut-like object, or other metadata containing an external resource address that a client resolves in the background, causing an application or shell component to contact a listener under the current user context. CVE-2023-23397 proves that a reminder property can trigger without the user opening the message. The DarkHydrus and Phishery event in which an attachedTemplate produced an authentication prompt and sent test credentials to the server is a document-specific overlapping subset. Replacing the carrier with an icon, media reference, or another property does not change the variable of background resolution substituting for an explicit sign-in action.
      - zh: 在服务器场景中，拥有网络可达性及所需调用权限的攻击者可向 EFSRPC 或同类远程服务方法提供自己控制的资源位置，促使目标服务以机器或服务身份出站认证。PetitPotam 原始 PoC 与 Microsoft KB5005413 支持这种能力和 NTLM 中继风险；但公开资料不能证明每次调用都成功捕获材料，也不能把实验自动升级为在野攻击。若攻击者随后将证明中继到 AD CS、SMB 或 LDAP，后半段按目标服务的受众绑定与结果另行建模。
        en: In server scenarios, an adversary with network reachability and the required call authority can provide an adversary-controlled resource location to EFSRPC or a comparable remote service method, causing the target service to authenticate outbound under a machine or service identity. The original PetitPotam proof of concept and Microsoft KB5005413 support the capability and NTLM relay risk, but public evidence does not show that every invocation captures material and a laboratory capability is not an in-the-wild case. If the adversary later relays the proof to AD CS, SMB, or LDAP, that successor stage is modeled separately through target-service audience binding and outcome.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 后台解析分支要求攻击者能把一个指向可观察服务的资源地址写入目标会接收并解析的对象，还需受害应用、网络策略和认证区域允许自动或提示式认证。服务胁迫分支要求可访问相应远程接口、满足其调用认证或访问条件，并能让服务解释攻击者指定的网络名称。两者都需要控制监听位置并完成协议挑战；外发 SMB 阻断、NTLM 限制、受信区域边界、RPC 接口收窄、服务停用、签名和通道绑定会降低可用性。
          en: The background-resolution branch requires the adversary to write an observable-service address into an object the target will receive and resolve, while the victim application, network policy, and authentication zone must permit automatic or prompted authentication. The service-coercion branch requires access to the remote interface, satisfaction of its call authentication or access conditions, and the ability to make the service interpret an attacker-selected network name. Both require control of a listener and completion of a protocol challenge. Outbound SMB blocking, NTLM restriction, trusted-zone boundaries, narrower RPC exposure, service disablement, signing, and channel binding reduce feasibility.
        - zh: 攻击者不因收到一次连接就必然获得可复用口令。Net-NTLMv2 是绑定具体挑战的响应，后续可否离线求得口令取决于口令强度和计算资源，可否中继取决于目标协议、签名、EPA 或通道绑定。机器账户材料和用户材料的后继价值也不同；正式案例必须保留主体类型、挑战与响应是否完成、监听或目标结果，而不能把所有“哈希”统称为可直接重放的密码哈希。
          en: One connection does not necessarily yield a reusable password. Net-NTLMv2 is a response bound to a particular challenge; offline recovery depends on password strength and compute, while relay depends on target protocol, signing, EPA, or channel binding. Machine-account and user material also have different successor value. Formal cases must retain principal type, whether challenge and response completed, and listener or target outcome rather than calling every “hash” a directly replayable password hash.
      defender_model:
        paragraphs:
        - zh: 防守方假定可以从邮件或文件入口、端点进程与网络、Windows NTLM 审计、目标服务认证和 RPC/服务遥测中取得至少两个观察面。Sysmon Event 3 可按 ProcessGuid 连接进程与目的地址但默认关闭；Windows 事件 8004 可补充访问服务器线索；4624 在接收目标提供网络登录、账户和来源，但字段完整性依协议而变。分析必须明确哪个事件只证明连接、哪个证明挑战响应到达、哪个证明目标服务成功，并对未启用日志、加密 RPC、个人设备和攻击者监听端不可见列出盲区。
          en: The defender is assumed to obtain at least two observation planes from message or file ingress, endpoint process and network telemetry, Windows NTLM audit, target-service authentication, and RPC or service telemetry. Sysmon Event 3 links processes to destinations through ProcessGuid but is disabled by default. Windows event 8004 can add accessed-server clues, and 4624 supplies network-logon, account, and origin data on the receiving target, although fields vary by protocol. Analysis must state which event proves only a connection, which establishes response arrival, and which establishes target-service success, with blind spots for disabled logs, encrypted RPC, personal devices, and an invisible adversary listener.
        - zh: 防守基线应描述哪些应用和服务可使用集成认证、允许的目的地、正常账户类型、远程调用者和业务窗口。只对白名单进程放行会漏掉受信进程中的恶意属性；只按外部 445 告警会漏掉内部监听、Web 认证或服务胁迫；只看域控认证又无法恢复最初诱因。有效检测需要把触发来源、受害端外连与认证结果放在同一因果图中，同时对企业模板、内部共享、备份、打印和证书注册保留有期限的精确例外。
          en: The defender baseline should describe which applications and services may use integrated authentication, allowed destinations, expected principal types, remote callers, and business windows. Allowlisting a process misses malicious properties interpreted by a trusted application; alerting only on external port 445 misses internal listeners, web authentication, or service coercion; domain-controller authentication alone cannot recover the initial trigger. Effective detection joins trigger provenance, victim egress, and authentication outcome in one causal graph while keeping time-bounded precise exceptions for enterprise templates, internal shares, backup, printing, and certificate enrollment.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 受信应用与服务外观掩盖被诱发的认证
      en: Trusted application and service appearance masks induced authentication
    analysis:
      paragraphs:
      - zh: 攻击者不必部署一个明显的凭据读取进程，而是让 Outlook、桌面外壳或系统服务按原有功能访问网络资源并调用系统认证栈。进程名、签名、账户和协议都可与合法内网访问相同，恶意差异藏在对象属性、远程调用来源与未经批准的目的地。CVE-2023-23397 的无交互 Outlook 触发和 PetitPotam 的服务调用直接证明行为可以由受信组件完成；这种特征伪装不会消除外连和认证痕迹，要求防守方比较上下文而不是把进程身份当作合法意图。
        en: The adversary need not deploy an obvious credential-reading process. Outlook, a shell component, or a system service accesses a network resource through its ordinary function and invokes the system authentication stack. Process name, signature, account, and protocol can match legitimate intranet access, while the malicious difference lies in an object property, remote caller, or unapproved destination. The no-interaction Outlook trigger in CVE-2023-23397 and service invocation in PetitPotam directly establish execution by trusted components. This feature disguise does not remove connection and authentication traces; defenders must compare context rather than equating process identity with legitimate intent.
    evidence_keys:
    - TA0006-003-T1187-REF-MS-CVE23397
    - TA0006-003-T1187-REF-PETITPOTAM
    - TA0006-003-T1187-REF-WINDOWS-AUTH
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 投递调用与认证结果跨时间和观察面分离
      en: Delivery or invocation is separated from authentication across time and observation planes
    analysis:
      paragraphs:
      - zh: 恶意属性可先进入邮箱并在未来提醒时触发，远程服务胁迫则把入站调用、目标服务外连和攻击者端挑战响应分布到不同节点。单个短窗口分别看到邮件、RPC 或网络登录，难以直接重建同一操作；Microsoft 对未来提醒属性和有限传统取证痕迹的说明直接支持时间分离，EFSRPC 调用链支持控制面与外连面的空间分离。尚无跨环境量化告警下降研究，因此该机理对行为和重建负担为中等置信，不能宣称所有载体都具有延迟效果。
        en: A malicious property can enter a mailbox and trigger at a later reminder time, while remote service coercion distributes the inbound call, victim-service egress, and attacker-side challenge response across nodes. A short local window sees a message, RPC call, or network logon separately and may fail to reconstruct one operation. Microsoft's description of future reminder properties and scarce traditional artifacts directly supports temporal separation; the EFSRPC call chain supports control-plane-to-egress spatial separation. No cross-environment study quantifies alert reduction, so the behavior and reconstruction burden receive medium confidence and cannot be generalized as delay for every carrier.
    evidence_keys:
    - TA0006-003-T1187-REF-MS-CVE23397
    - TA0006-003-T1187-REF-MS-EFSR
    - TA0006-003-T1187-REF-PETITPOTAM
    confidence: medium
proposed_subtechniques:
- temporary_key: TA0006-003-T1187-CHILD-RESOLUTION
  name:
    zh: 后台资源解析认证引出
    en: Background-Resource Resolution Authentication Emission
  summary:
    zh: 攻击者把网络目标写入会被应用或桌面组件后台解析的对象，使当前用户上下文在没有明确登录动作时发出认证材料。
    en: An adversary places a network target in an object resolved by an application or shell component, causing the current user context to emit authentication material without an explicit sign-in action.
  taxonomy_variable:
    zh: 认证是否由对象后台解析而非用户选择的登录动作启动
    en: Whether authentication begins through background object resolution rather than a user-chosen sign-in action
  counterfactual_trace:
    zh: 正常显式登录具有用户导航、目标确认和认证事件；后台解析由消息、对象属性或渲染动作直接连接外部资源，用户交互可缺失，异常转移到对象来源和目的地。
    en: An ordinary explicit sign-in has user navigation, target confirmation, and an authentication event. Background resolution connects to a remote resource directly from a message, object property, or render action, potentially without interaction, moving the anomaly to object provenance and destination.
  definition_and_concept:
    paragraphs:
    - zh: 后台资源解析认证引出是攻击者控制一个会被邮件客户端、办公应用、桌面外壳或其他资源消费者自动读取的网络位置，使组件在预览、提醒、图标渲染、打开或枚举时调用当前用户的集成认证。稳定变量是“资源解析代表用户发起认证”，不是文档、图片、快捷方式、UNC 或 SMB 的名称。结果必须是挑战响应或等价材料到达攻击者可观察服务；只有属性存在或连接失败时仍属未决触发。
      en: Background-Resource Resolution Authentication Emission places an adversary-controlled network location in data automatically consumed by a mail client, office application, shell, or other resource resolver, causing integrated authentication under the current user during preview, reminder processing, icon rendering, open, or enumeration. The stable variable is resource resolution initiating authentication on the user's behalf, not the names document, image, shortcut, UNC, or SMB. A challenge response or equivalent material must reach an adversary-observable service; a property or failed connection alone remains an unresolved trigger.
  stealth_characteristics:
    paragraphs:
    - zh: 本子项把认证藏在用户认为是读取内容或系统后台处理的动作中，可没有登录页面、输入框或明显子进程。受信应用的网络连接和当前用户身份与合法模板、共享图标或内网资源相似，简单的“可疑进程读取凭据”规则不适用。残余痕迹包括原对象的外部地址、Mark-of-the-Web 或投递来源、资源解析进程、目的 IP/端口、NTLM 目标和失败/成功结果；Microsoft 强调 SMBClient 失败事件只证明尝试，因此检测必须标注结果层级。
      en: This child embeds authentication in an action the user perceives as content access or background processing, potentially without a sign-in page, input field, or conspicuous child process. A trusted application's connection under the current user can resemble a legitimate template, shared icon, or intranet resource, so rules for a suspicious process reading credentials do not apply. Residual traces include the external address in the source object, Mark-of-the-Web or delivery origin, resolver process, destination IP and port, NTLM target, and failed or successful outcome. Microsoft stresses that failed SMBClient events establish only an attempt, so detection must label outcome stage.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入对象属性或元数据由受害应用解析，并因此向攻击者可观察位置实际发出认证材料的行为；用户点击可以存在但不是分类轴。文档 attachedTemplate 场景的引用入口由 NJS-0119-002 解释，本子项只在认证交换到达也已证实时与其并列。普通网页登录、仿冒表单、用户主动输入密码和实时反向代理归钓鱼或首次入口；攻击者通过 DNS/ARP/WPAD 改变原本合法资源的路径归 NJT-0136。载体或协议变化不得单独建立兄弟项。
      en: Scope includes object properties or metadata resolved by a victim application that consequently emit authentication material to an adversary-observable location; a click may occur but is not the classification axis. NJS-0119-002 owns the external-reference entry for an attachedTemplate event, while this child can coexist only when arrival of the authentication exchange is also established. Ordinary web sign-in, counterfeit forms, user-entered passwords, and real-time reverse proxies belong to phishing or first entry. DNS, ARP, or WPAD changes to the path of an otherwise legitimate resource belong to NJT-0136. Carrier or protocol variation cannot create another sibling.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: Microsoft 在真实调查中确认 CVE-2023-23397 恶意 Outlook 消息用指向攻击者 SMB 共享的提醒声音属性触发 Net-NTLMv2 外发，用户无需打开消息，属性还可设定未来提醒时间。ATT&CK 固定页另记录快捷或外壳对象在图标渲染时加载外部资源的行为；这些实现共同支持后台解析轴。DarkHydrus 的远程模板提示并收到测试凭据说明文档引用的交互分支可产生同类结果，但该事件的载体检测继续复用文档专用对象。
        en: Microsoft confirmed in incident investigation that a malicious Outlook message using a reminder-sound property pointing to an adversary SMB share triggered Net-NTLMv2 emission without the user opening the message, and the property could schedule a later reminder. The fixed ATT&CK page also records shortcut or shell objects loading external resources during icon rendering. These implementations jointly support the background-resolution axis. DarkHydrus's remote template prompt and receipt of test credentials shows an interactive document-reference branch can produce the same outcome, while its carrier detection remains in the document-specific objects.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要把资源地址送入目标客户端会自动或半自动解析的字段，控制能提出认证挑战的服务，并使网络出口和认证策略允许交换。成功取决于应用版本、受信区域、协议回退、当前登录主体以及终端是否连到监听端；用户身份和收件身份可能不同。补丁、外部 SMB 阻断、应用网络隔离、NTLM 限制和只对批准域启用集成认证会阻断或降级本路径。
          en: The adversary needs to place a resource address in a field that the target client resolves automatically or with incidental interaction, control a service able to issue an authentication challenge, and encounter egress and authentication policy that permits the exchange. Success depends on application version, trust zone, protocol fallback, current signed-in principal, and connectivity to the listener; the authenticated principal can differ from the message recipient. Patching, external SMB blocking, application network isolation, NTLM restriction, and limiting integrated authentication to approved domains block or reduce this path.
      defender_model:
        paragraphs:
        - zh: 防守方需要保留原始消息或对象的属性及哈希、投递与解析时间、处理进程、DNS/网络目的地、SMBClient/NTLM 事件和可用的接收端结果。仅有邮件网关或端点任一侧时难以证明完整链；网络连接由系统服务代发时，进程到对象的关系也可能丢失。检测应先输出“恶意引用”“出站认证尝试”“材料到达”和“后继使用”等分级结果，再由证据提升置信度。
          en: Defenders need the original message or object properties and hash, delivery and resolution times, consuming process, DNS and network destination, SMBClient or NTLM events, and any available receiver result. A mail gateway or endpoint view alone may not prove the chain, and process-to-object lineage can be lost when a system service makes the connection. Detection should emit graded states such as malicious reference, outbound authentication attempt, material arrival, and successor use, then raise confidence as evidence accumulates.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 正常资源读取外观遮蔽认证材料外发
      en: Ordinary resource-resolution appearance masks authentication-material emission
    analysis:
      paragraphs:
      - zh: 恶意地址进入原本用于提醒、图标、模板或媒体的字段，受信消费者随后调用系统网络与认证功能。终端看到熟悉应用和正常资源访问语义，真正恶意特征在对象来源、地址权威和认证目的地。CVE-2023-23397 的无交互触发与 DarkHydrus 的模板实验分别证明静默和提示式分支；合法企业模板和内部共享说明为何单靠进程或协议不能定性。
        en: A malicious address occupies a field ordinarily used for reminders, icons, templates, or media, after which a trusted consumer invokes system networking and authentication. The endpoint sees a familiar app and ordinary resource-access semantics, while the malicious feature lies in object provenance, address authority, and authentication destination. CVE-2023-23397 and the DarkHydrus template experiment establish no-interaction and prompted branches respectively. Legitimate enterprise templates and internal shares show why process or protocol alone cannot decide intent.
    evidence_keys:
    - TA0006-003-T1187-REF-MS-CVE23397
    - REF-000439
    - TA0006-003-T1187-REF-ATTACK
    confidence: high
  evidence_keys:
  - TA0006-003-T1187-REF-MS-CVE23397
  - TA0006-003-T1187-REF-ATTACK
  - REF-000439
  - TA0006-003-T1187-REF-MS-NLMP
  defense_keys:
  - TA0006-003-T1187-DET-RESOLUTION
  - TA0006-003-T1187-NJA-RESOLUTION
  - TA0006-003-T1187-MIT-AUTH-BOUNDARY
  - DET-000116
  - NJA-000125
  - MIT-000117
  limitations:
    paragraphs:
    - zh: Microsoft 的 CVE-2023-23397 资料直接证明特定 Outlook 版本、属性和 SMB 路径，不能无条件推广到每种对象消费者；DarkHydrus 证明的是文档提示与测试凭据而非静默 Net-NTLMv2。ATT&CK 列举的其他载体需要逐事件确认材料确实到达。若只能看到外部 URI、进程外连或 WebDAV 回退，应保持尝试或暴露结论，不把它升级为捕获成功。
      en: Microsoft's CVE-2023-23397 evidence directly establishes particular Outlook versions, properties, and an SMB path and cannot be generalized to every object consumer. DarkHydrus establishes a document prompt and test credentials rather than silent Net-NTLMv2. Other carriers listed by ATT&CK require event-specific proof that material arrived. If evidence is limited to an external URI, process connection, or WebDAV fallback, retain an attempt or exposure conclusion rather than upgrading it to successful capture.
- temporary_key: TA0006-003-T1187-CHILD-SERVICE
  name:
    zh: 远程服务调用认证胁迫
    en: Remote-Service Invocation Authentication Coercion
  summary:
    zh: 攻击者调用可远程访问的服务操作并提供自己控制的网络位置，使服务或机器身份向该位置认证。
    en: An adversary invokes a remotely reachable service operation with an adversary-controlled network location, causing a service or machine identity to authenticate there.
  taxonomy_variable:
    zh: 认证是否由远程服务控制面代表非交互式服务或机器主体启动
    en: Whether a remote service control plane initiates authentication on behalf of a noninteractive service or machine principal
  counterfactual_trace:
    zh: 正常服务调用访问批准的备份、打印或管理目标；胁迫调用把攻击者来源、服务方法和出站认证目的地组成未批准三元组，并可能由机器账户而非交互用户认证。
    en: An ordinary service invocation accesses an approved backup, print, or management destination. A coercive invocation creates an unapproved tuple of remote caller, service method, and outbound authentication destination, often under a machine account rather than an interactive user.
  definition_and_concept:
    paragraphs:
    - zh: 远程服务调用认证胁迫是攻击者通过 RPC 或等价管理接口调用一个会解析网络路径或回连客户端的服务方法，使目标系统以服务、计算机或其他非交互主体向攻击者指定位置发起认证。稳定变量是“外部调用者借用服务控制面生成认证”，不是 EFSRPC、打印、备份或某个 PoC 名称。调用返回错误也可能说明路径被解析，但完整 Credential Access 结论仍要求监听端观察到挑战响应或等价材料。
      en: Remote-Service Invocation Authentication Coercion uses RPC or an equivalent management interface to invoke a service method that resolves a network path or calls back to a client, causing the target system to authenticate to an adversary-selected location as a service, computer, or other noninteractive principal. The stable variable is an external caller borrowing a service control plane to generate authentication, not EFSRPC, printing, backup, or a proof-of-concept name. An error return may show path resolution, but a completed Credential Access conclusion still requires the listener to observe a challenge response or equivalent material.
  stealth_characteristics:
    paragraphs:
    - zh: 本子项把外发认证归因到合法系统服务和机器账户，端点网络视图可能显示 lsass、服务宿主或 RPC 相关组件访问一个共享位置，而不是攻击者进程直接读取凭据。入站调用和出站认证还可能由不同进程、日志和网络方向记录，任一单侧都像普通管理或服务故障。差分证据是调用者、接口/方法、传入资源名、服务身份、出站目的地和认证结果之间缺少批准关系。
      en: This child attributes outbound authentication to a legitimate system service and machine account. Endpoint network telemetry may show lsass, a service host, or an RPC-related component reaching a share instead of an adversary process reading credentials. The inbound call and outbound authentication can also be recorded by different processes, logs, and network directions, with each side resembling administration or service failure. The differential is the absence of an approved relationship among caller, interface or method, supplied resource name, service identity, egress destination, and authentication outcome.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求攻击者控制远程调用及其中的回连位置，目标服务实际代表本机主体发出认证材料，且材料到达可观察端。一般 RPC 枚举、接口探测、服务崩溃、拒绝访问和无认证回连不满足完成结果。若攻击者先控制 DNS/网络路径让正常服务流量转向监听端，路径变化归 NJT-0136；若捕获后中继到另一服务，认证受众差归 NJS-0136-002；若破解响应，候选验证归 NJS-0137-003。
      en: Inclusion requires adversary control of the remote call and callback location, actual service emission of authentication material for a local principal, and arrival at an observable endpoint. RPC enumeration, interface probing, service crash, access denial, and callbacks without authentication do not establish a completed result. If the adversary first controls DNS or network path to redirect ordinary service traffic, the path change belongs to NJT-0136. Relay after capture belongs to NJS-0136-002 for the audience differential, and cracking belongs to NJS-0137-003 for candidate verification.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: EFSRPC 为加密对象的远程管理、备份和恢复提供方法；其 EfsRpcOpenFileRaw 接收文件名并在服务端打开对象。PetitPotam PoC 把监听位置写入此类参数，促使 Windows 主机认证到另一机器；Microsoft 随后将其作为可能攻击域控或服务器的经典 NTLM 中继入口说明。该证据直接支持服务控制面胁迫变量，但正式分类不依赖 EFSRPC：其他服务方法只有在同样满足远程调用、攻击者指定回连和材料到达三项时才进入。
        en: EFSRPC provides remote management, backup, and restore methods for encrypted objects, and EfsRpcOpenFileRaw accepts a file name for server-side access. The PetitPotam proof of concept places a listener location in such a parameter and causes a Windows host to authenticate to another machine; Microsoft subsequently described it as a classic NTLM relay entry point that can potentially attack domain controllers or servers. This evidence directly supports the service-control-plane coercion variable, but formal classification does not depend on EFSRPC. Other service methods enter only when they likewise satisfy remote invocation, adversary-selected callback, and material arrival.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要访问目标服务接口、满足必要的 RPC 绑定和调用权限、知道可促使服务解释网络路径的方法，并控制接收认证的监听端。匿名、低权域用户或已控账户能否调用取决于接口和系统版本；补丁可能封堵一个方法而保留其他路径。攻击者还需区分触发成功与后继中继成功：没有未绑定的目标服务、签名缺失或 EPA 缺口时，捕获材料仍可能无法换取权限。
          en: The adversary needs reachability to the service interface, the necessary RPC binding and call authority, knowledge of a method that makes the service interpret a network path, and control of the authentication listener. Whether anonymous, low-privilege domain, or compromised-account access suffices depends on interface and system version, and a patch can close one method while leaving another path. Trigger success must remain separate from relay success; without a target lacking signing, binding, or EPA, captured material may not yield access.
      defender_model:
        paragraphs:
        - zh: 防守方需要记录到关键服务器的入站 RPC 或管理调用，并把接口 UUID、方法、调用者、源地址和传入资源名连接到同一主机随后由服务或机器账户发起的网络认证。若只有防火墙流量，服务内部方法不可见；若只有 8004 或目标 4624，原始调用者可能丢失；加密 RPC、NAT 和服务宿主复用也会削弱关联。高价值机器账户的任何新出站认证目标应优先，但不能仅凭机器账户网络登录断言胁迫。
          en: Defenders need inbound RPC or management-call records for critical servers and must join interface UUID, method, caller, source address, and supplied resource name to subsequent network authentication from the same host under a service or machine account. Firewall telemetry alone may miss the service method; 8004 or target 4624 alone can lose the initiating caller; encrypted RPC, NAT, and shared service hosts weaken correlation. A new outbound destination for a high-value machine account deserves priority, but a machine-account network logon alone does not prove coercion.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 服务控制面把攻击者触发转换为系统主体外发
      en: Service control plane converts adversary input into system-principal egress
    analysis:
      paragraphs:
      - zh: 攻击者的可见动作停留在合法远程接口，真正的认证由目标服务在自己的进程和账户下发起。仅观察出站端的防守方看到的是系统主体访问网络资源，原始攻击者来源处于另一控制面；仅观察入站端又可能只见一次失败的备份或管理调用。EFSRPC 规范说明方法的合法目的，PetitPotam 直接实验说明攻击者如何控制资源名，二者共同支持从调用到归因转移的行为透明链。
        en: The adversary-visible action ends at a legitimate remote interface, while the target service initiates authentication under its own process and account. A defender observing only egress sees a system principal accessing a network resource, with the original adversary source in another control plane. A defender observing only ingress may see a failed backup or management call. The EFSRPC specification establishes the method's legitimate purpose, and the direct PetitPotam experiment shows adversary control of the resource name; together they support behavioral transparency from invocation to shifted attribution.
    evidence_keys:
    - TA0006-003-T1187-REF-MS-EFSR
    - TA0006-003-T1187-REF-PETITPOTAM
    - TA0006-003-T1187-REF-MS-KB5005413
    confidence: high
  evidence_keys:
  - TA0006-003-T1187-REF-MS-EFSR
  - TA0006-003-T1187-REF-PETITPOTAM
  - TA0006-003-T1187-REF-MS-KB5005413
  - TA0006-003-T1187-REF-MS-NLMP
  defense_keys:
  - TA0006-003-T1187-DET-SERVICE
  - TA0006-003-T1187-NJA-SERVICE
  - TA0006-003-T1187-MIT-SERVICE-SURFACE
  - TA0006-003-T1187-MIT-AUTH-BOUNDARY
  - MIT-000132
  limitations:
    paragraphs:
    - zh: PetitPotam 是公开 PoC，Microsoft KB 说明潜在攻击与 AD CS 中继缓解，但本批未找到可独立核验的在野案例同时公开原始 RPC 调用、监听端挑战响应和最终目标结果。接口可调用性随补丁、服务状态与权限变化，不能把端口开放或 EfsRpcOpenFileRaw 错误码等同材料已捕获。正式案例置信度应由监听端证据和受害端关联共同决定。
      en: PetitPotam is a public proof of concept, and Microsoft's KB describes potential attack and AD CS relay mitigation, but this batch found no independently verifiable in-the-wild case publishing the original RPC call, listener-side challenge response, and final target outcome together. Interface reachability changes with patches, service state, and authorization, so an open port or EfsRpcOpenFileRaw error code cannot be equated with captured material. Formal case confidence should depend on both listener evidence and victim-side correlation.
defense_candidates:
  detection_strategies:
  - temporary_key: TA0006-003-T1187-DET-RESOLUTION
    name:
      zh: 对象解析—出站认证—材料结果谱系
      en: Object Resolution–Outbound Authentication–Material Outcome Lineage
    objective:
      zh: 将不受信对象中的网络引用、受信应用解析、出站认证及材料到达分级关联，覆盖文档之外的消息、图标和元数据载体。
      en: Join an untrusted object's network reference, trusted-application resolution, outbound authentication, and graded material arrival across messages, icons, metadata, and document carriers.
    detects_keys: [TA0006-003-T1187-PARENT, TA0006-003-T1187-CHILD-RESOLUTION]
    analytic_keys: [TA0006-003-T1187-NJA-RESOLUTION]
  - temporary_key: TA0006-003-T1187-DET-SERVICE
    name:
      zh: 远程服务调用—机器认证回连差分
      en: Remote-Service Invocation–Machine Authentication Callback Differential
    objective:
      zh: 连接远程服务方法的调用者与目标主机随后向未经批准位置发出的服务或机器账户认证，并区分触发、材料到达和中继成功。
      en: Join a remote service-method caller to subsequent service or machine-account authentication from the target host to an unapproved location, separating trigger, material arrival, and relay success.
    detects_keys: [TA0006-003-T1187-PARENT, TA0006-003-T1187-CHILD-SERVICE]
    analytic_keys: [TA0006-003-T1187-NJA-SERVICE]
  detection_analytics:
  - temporary_key: TA0006-003-T1187-NJA-RESOLUTION
    strategy_key: TA0006-003-T1187-DET-RESOLUTION
    name:
      zh: 后台资源解析认证结果关联
      en: Background Resource Resolution Authentication Outcome Join
    logic:
      zh: 在入口解析消息、日历项、快捷对象、文档关系及其他可解析资源字段，保存对象哈希、属性键、规范化 URI、投递主体和计划触发时间；随后按对象与设备连接应用读取或渲染、进程网络连接、SMBClient 或 NTLM 审计和接收端结果。对象指向未批准目的地且同一设备或用户在解析后五分钟内发出 NTLM 或集成认证时输出 outbound_authentication_attempt；接收端或网络传感器确认挑战响应到达时升级为 material_observed；目标服务成功或离线破解另作后继结果。投递与解析可相隔三十天，但解析到认证保持窄窗；失败连接不得升级。
      en: At ingress, parse messages, calendar items, shortcut-like objects, document relationships, and other resolvable resource fields, retaining object hash, property key, normalized URI, delivery principal, and scheduled trigger time. Join later application read or render activity to process network connections, SMBClient or NTLM audit, and receiver outcomes by object and device. Emit outbound_authentication_attempt when an object points to an unapproved destination and the same device or user produces NTLM or integrated authentication within five minutes of resolution. Upgrade to material_observed only when receiver or network evidence confirms challenge-response arrival; target-service success or offline cracking remains a successor outcome. Delivery and resolution may be separated by thirty days, but resolution-to-authentication stays narrow. A failed connection never upgrades the state.
    data_requirements:
    - source_type: ingress_object_metadata
      channel: mail security, file analysis, collaboration audit, or content disarm pipeline
      required_fields: [event.timestamp, object.id, object.hash, object.type, property.name, property.value, resource.uri, delivery.source, delivery.recipient, trigger.scheduled_time]
    - source_type: endpoint_object_process
      channel: EDR, application audit, or OS file/object telemetry
      required_fields: [event.timestamp, asset.id, user.id, logon.id, object.id, object.hash, process.guid, parent_process.guid, process.image, operation]
    - source_type: endpoint_network_authentication
      channel: configured Sysmon Event 3, SMBClient Connectivity, NTLM Operational, or equivalent EDR
      required_fields: [event.timestamp, asset.id, user.id, logon.id, process.guid, network.destination.name, network.destination.ip, network.destination.port, network.protocol, authentication.protocol, authentication.target, connection.result]
    - source_type: receiver_authentication_outcome
      channel: managed decoy, network sensor, approved test receiver, or incident evidence
      required_fields: [event.timestamp, receiver.id, source.ip, victim.asset_id, principal.id, authentication.protocol, challenge.id, response.observed, authentication.result]
    observables: [untrusted_resolvable_property, trusted_process_background_resolution, integrated_authentication_to_unapproved_destination, challenge_response_observed, delayed_trigger_after_delivery]
    correlation:
      window: 30d-delivery-to-resolution-and-5m-resolution-to-authentication
      dimensions: [object.id, object.hash, asset.id, user.id, logon.id, process.guid, resource.uri, network.destination.ip, authentication.target, challenge.id]
    false_positives:
      zh: 合法企业模板、内部共享图标、日历提醒声音、文档协作插件、软件分发和获批渗透测试可产生同类解析与认证；必须核对发布者、签名、资源 owner、受信域和工单，而不能整体白名单化 Office 或外壳进程。
      en: Legitimate enterprise templates, shared icons, reminder sounds, collaboration plug-ins, software distribution, and authorized tests can produce similar resolution and authentication. Check publisher, signature, resource owner, trusted domain, and ticket rather than blanket allowlisting Office or shell processes.
    blind_spots:
      zh: 原对象已删除或服务器端属性不可导出、网络连接由系统代理代发、Sysmon Event 3 未启用、个人设备不受管、攻击者监听端不可见、加密 Web 流量和内部 NAT 会削弱对象到材料的连接；SMBClient 失败事件不能确认泄露。
      en: Deleted source objects, unavailable server-side properties, system-proxy connections, disabled Sysmon Event 3, unmanaged devices, invisible adversary listeners, encrypted web traffic, and internal NAT weaken object-to-material lineage. SMBClient failure events cannot confirm leakage.
    tuning_guidance:
      zh: 建立批准资源 URI 到发布者、应用、用户组和业务时段的精确映射；优先外部或新见目的地、高价值账户、无用户活动的解析及重复触发。对批准内部域降权仍保留原始属性与结果，按设备时钟误差校准五分钟窗口；把 attempt、material_observed 和 successor_use 分别告警。
      en: Map approved resource URIs precisely to publisher, application, user group, and business window. Prioritize external or first-seen destinations, high-value principals, resolution without user activity, and repeated triggers. Down-weight approved internal domains while retaining properties and outcomes, calibrate the five-minute window for clock skew, and alert separately on attempt, material_observed, and successor_use.
    evidence_keys: [TA0006-003-T1187-REF-MS-CVE23397, TA0006-003-T1187-REF-ATTACK, REF-000230, REF-000494, REF-000439]
  - temporary_key: TA0006-003-T1187-NJA-SERVICE
    strategy_key: TA0006-003-T1187-DET-SERVICE
    name:
      zh: 服务方法调用与机器账户外发认证联查
      en: Service Method Invocation and Machine-Account Outbound Authentication Join
    logic:
      zh: 对域控、证书服务、文件服务器和其他高价值主机记录入站 RPC 或管理会话，规范化调用者、接口 UUID、方法或 opnum、传入网络资源、调用结果和目标服务；在两分钟内查同一主机的服务进程网络连接、8004 或等效 NTLM 线索，以及监听或目标侧机器或服务账户认证。调用指向未批准资源且随后出现匹配外发认证时输出 coercion_attempt；只有接收端确认挑战响应才输出 material_observed。若另一个服务从监听或中继来源记录成功登录，则交给 NJS-0136-002 的目标受众差分析，不能合并为本 Analytic 的触发成功。
      en: For domain controllers, certificate services, file servers, and other high-value hosts, record inbound RPC or management sessions and normalize caller, interface UUID, method or opnum, supplied network resource, call result, and target service. Within two minutes, seek service-process network connections from the same host, event 8004 or equivalent NTLM clues, and listener or target authentication by a machine or service account. Emit coercion_attempt when the call names an unapproved resource and matching outbound authentication follows. Emit material_observed only when the receiver confirms a challenge response. If another service records successful authentication from a listener or relay source, pass it to NJS-0136-002 audience-differential analysis rather than folding relay success into this analytic.
    data_requirements:
    - source_type: remote_service_invocation
      channel: RPC firewall, ETW, service operational log, or network protocol sensor
      required_fields: [event.timestamp, target.asset_id, caller.account, caller.ip, transport, interface.uuid, method.name, method.opnum, supplied.resource_name, service.name, call.result]
    - source_type: target_endpoint_network
      channel: configured Sysmon Event 3, EDR, or host firewall
      required_fields: [event.timestamp, asset.id, process.guid, process.image, service.name, user.id, destination.name, destination.ip, destination.port, protocol, connection.result]
    - source_type: windows_ntlm_audit
      channel: Microsoft-Windows-NTLM/Operational event 8004 or equivalent
      required_fields: [event.timestamp, client.name, principal.id, accessed_server.name, authentication.result]
    - source_type: receiver_or_target_authentication
      channel: listener evidence or Windows Security 4624/4625 and service authentication logs
      required_fields: [event.timestamp, receiver.id, source.ip, principal.id, principal.type, logon.type, authentication.package, challenge.id, response.observed, authentication.result]
    - source_type: approved_service_relationships
      channel: CMDB, firewall policy, service inventory, and change management
      required_fields: [service.name, interface.uuid, caller.account, caller.network, allowed.destination, principal.id, approval.id, valid.from, valid.to]
    observables: [remote_method_with_network_resource, service_process_callback, machine_or_service_account_ntlm, unapproved_caller_destination_tuple, receiver_challenge_response]
    correlation:
      window: 2m-from-service-call-to-outbound-authentication
      dimensions: [target.asset_id, caller.ip, caller.account, interface.uuid, method.opnum, supplied.resource_name, service.name, principal.id, destination.ip, challenge.id]
    false_positives:
      zh: 备份和恢复、远程文件管理、打印通知、监控、证书注册、集群操作和故障排查会产生服务回连；需按接口、调用者、目的地、账户和变更窗口的完整组合确认，而不能仅对白名单网段或机器账户放行。
      en: Backup and restore, remote file management, print notification, monitoring, certificate enrollment, clustering, and troubleshooting can cause service callbacks. Validate the full interface, caller, destination, account, and change-window tuple instead of allowlisting a network or machine account alone.
    blind_spots:
      zh: 通用 Windows 日志未必记录 RPC 方法和传入参数；加密 RPC、服务宿主复用、同机监听、共享 NAT、缺少 8004 和攻击者端不可见会阻止事务级确认。4624 的网络字段随认证上下文和协议而缺失，不能假设每条成功登录均有源 IP。
      en: Generic Windows logs may not record RPC method and supplied parameters. Encrypted RPC, shared service hosts, a local listener, shared NAT, missing 8004, and invisible adversary infrastructure can prevent transaction-level confirmation. Event 4624 network fields vary by authentication context and protocol, so a source IP cannot be assumed for every successful logon.
    tuning_guidance:
      zh: 优先采集高价值服务器和已知可回连方法，为每项合法工作流登记调用者、接口、方法、目的地及机器账户；对新目的地、高权限机器主体、来自用户网段的调用和方法失败后紧随外连提高权重。分别保存调用失败、外连、材料到达和目标成功，按接口与系统版本做实验验证。
      en: Prioritize high-value servers and methods known to callback, registering caller, interface, method, destination, and machine principal for each legitimate workflow. Raise weight for first-seen destinations, privileged machine principals, callers from user networks, and egress immediately after a method error. Preserve call failure, egress, material arrival, and target success separately, and validate each interface and OS version experimentally.
    evidence_keys: [TA0006-003-T1187-REF-MS-EFSR, TA0006-003-T1187-REF-PETITPOTAM, TA0006-003-T1187-REF-MS-KB5005413, REF-000230, REF-000377, REF-000494]
  mitigations:
  - temporary_key: TA0006-003-T1187-MIT-AUTH-BOUNDARY
    name:
      zh: 自动认证目的地与出口边界
      en: Automatic Authentication Destination and Egress Boundary
    measures:
    - key: approved-integrated-auth-destinations
      control_type: preventive
      zh: 将 NTLM 与集成认证限制到有 owner 的批准服务集合，先审计再拒绝未知外发目标，并为远程办公与 VPN 分流路径实施相同策略。
      en: Restrict NTLM and integrated authentication to an owned approved service set, audit before denying unknown outbound destinations, and apply the same policy to remote-work and split-tunnel paths.
    - key: protocol-egress-control
      control_type: preventive
      zh: 在主机、防火墙和 VPN 出口阻断无业务必要的外部 SMB，并对 WebDAV 或可承载 Windows 认证的 HTTP 目的地使用精确允许清单，而非仅依赖边界端口。
      en: Block external SMB without a business requirement at host, firewall, and VPN egress, and use precise allowlists for WebDAV or HTTP destinations capable of Windows authentication rather than relying on perimeter ports alone.
    - key: material-exposure-response
      control_type: containment
      zh: 监听端或可靠网络证据确认挑战响应外泄后，按用户或机器主体、口令强度和可能中继目标分级处置，轮换高风险秘密并审查后继认证；失败连接不触发同等级轮换。
      en: After listener or reliable network evidence confirms response exposure, respond according to user or machine principal, password strength, and possible relay targets, rotating high-risk secrets and reviewing successor authentication. A failed connection alone does not trigger the same rotation level.
    applications:
    - target_key: TA0006-003-T1187-PARENT
      use:
        zh: 清点终端和服务器允许发起的自动认证协议与目的地，逐步移除 NTLM 依赖，对无法移除的例外绑定服务身份、来源和到期时间，并远程保留拒绝日志。
        en: Inventory automatic-authentication protocols and destinations allowed from endpoints and servers, progressively remove NTLM dependencies, and bind unavoidable exceptions to service identity, origin, and expiration while retaining rejection logs remotely.
      expected_effect:
        zh: 攻击者即使触发资源解析或服务回连，也更难使认证材料到达未经批准监听端，阻断事件可用于重建尝试。
        en: Even when resource resolution or a service callback is triggered, authentication material is less likely to reach an unapproved listener, and blocks become reconstruction evidence.
      limitations:
        zh: 旧应用、跨域管理和外部文件服务可能依赖 NTLM 或 WebDAV；错误的广泛例外会恢复暴露，控制也不能撤回已经泄露的响应。
        en: Legacy apps, cross-domain administration, and external file services may depend on NTLM or WebDAV. Broad exceptions restore exposure, and the control cannot retract a response already leaked.
    - target_key: TA0006-003-T1187-CHILD-RESOLUTION
      use:
        zh: 禁止邮件、办公、浏览和桌面组件向外部 SMB 或未批准集成认证域自动发送当前凭据，对少数业务模板按签名、固定域和用户组设置例外。
        en: Prevent mail, office, browser, and shell components from automatically sending current credentials to external SMB or unapproved integrated-authentication domains, with narrow exceptions by signature, fixed domain, and user group.
      expected_effect:
        zh: 恶意对象仍可能触发连接，但无法无声完成向任意目标的认证交换，例外具有可核对的业务所有者。
        en: A malicious object may still cause a connection, but cannot silently complete authentication to an arbitrary target, and each exception has an accountable business owner.
      limitations:
        zh: 被攻陷的批准域、用户主动输入秘密和未受管个人设备不受充分覆盖；端口 80/443 上的认证需应用层策略。
        en: Compromised approved domains, user-entered secrets, and unmanaged personal devices remain incompletely covered. Authentication over ports 80 and 443 requires application-layer policy.
    - target_key: TA0006-003-T1187-CHILD-SERVICE
      use:
        zh: 对服务器机器账户建立允许出站认证目标清单，拒绝面向用户网段或互联网的未知 SMB/HTTP 认证，并把拒绝同入站管理调用关联。
        en: Establish allowed outbound authentication destinations for server machine accounts, deny unknown SMB or HTTP authentication to user networks or the Internet, and join rejections to inbound management calls.
      expected_effect:
        zh: 远程方法即使被调用，也难以把机器证明送到攻击者监听端，异常回连留下高信号拒绝。
        en: Even if a remote method is invoked, machine proofs are less likely to reach an adversary listener, and anomalous callbacks leave high-signal denials.
      limitations:
        zh: 集群、备份和跨服务器管理需要精细例外；内部攻击者可能把监听器放在仍被允许的服务区。
        en: Clustering, backup, and cross-server management need precise exceptions, and an internal adversary may place a listener in an allowed service zone.
    evidence_keys: [TA0006-003-T1187-REF-MS-CVE23397, TA0006-003-T1187-REF-MS-KB5005413, REF-000494]
  - temporary_key: TA0006-003-T1187-MIT-SERVICE-SURFACE
    name:
      zh: 远程服务回连面收窄
      en: Remote Service Callback Surface Reduction
    measures:
    - key: patch-and-method-governance
      control_type: preventive
      zh: 保持服务补丁并维护可解释网络路径或回连的方法清单，删除不再需要的旧服务，不能停用时按接口与调用者限制访问。
      en: Keep services patched, inventory methods that interpret network paths or callback, remove obsolete services, and restrict interface and caller access where disablement is not possible.
    - key: rpc-call-boundary
      control_type: preventive
      zh: 在关键服务器上只允许命名管理主机和主体访问高风险 RPC 接口，按系统版本验证 RPC 过滤或防火墙规则，并保留拒绝记录。
      en: Permit only named management hosts and principals to reach high-risk RPC interfaces on critical servers, validate RPC filtering or firewall rules by OS version, and retain denials.
    - key: service-principal-segmentation
      control_type: exposure-reduction
      zh: 让备份、打印、证书和文件服务使用范围受限的主体与网络区段，避免高权限机器身份能够向任意工作站或互联网认证。
      en: Use scoped principals and network zones for backup, print, certificate, and file services so privileged machine identities cannot authenticate to arbitrary workstations or the Internet.
    applications:
    - target_key: TA0006-003-T1187-CHILD-SERVICE
      use:
        zh: 对 EFSRPC 及其他经测试会回连的方法核对业务依赖，应用供应商修复，限制调用者与目标网络；AD CS 等可能接受中继的服务同时应用 EPA、HTTPS、签名或通道绑定。
        en: Review business need for EFSRPC and other experimentally verified callback methods, apply vendor fixes, and restrict callers and destination networks. Services such as AD CS that may accept relayed proofs also require EPA, HTTPS, signing, or channel binding.
      expected_effect:
        zh: 降低攻击者触发系统主体回连的机会，并让残余调用局限在可审计的管理关系；后继中继目标也更难接受证明。
        en: Reduce opportunities to trigger a system-principal callback, confine remaining calls to auditable management relationships, and make successor relay targets less likely to accept the proof.
      limitations:
        zh: Windows 远程服务功能与权限随版本变化，封堵单一方法不证明不存在其他回连入口；严格过滤可能破坏备份和管理，必须逐版本实测。
        en: Windows remote-service behavior and permissions vary by version, and blocking one method does not prove every callback path is closed. Strict filtering can disrupt backup and administration and requires version-specific testing.
    evidence_keys: [TA0006-003-T1187-REF-MS-EFSR, TA0006-003-T1187-REF-PETITPOTAM, TA0006-003-T1187-REF-MS-KB5005413, REF-000492, REF-000493]
existing_library_reuse:
  reference_refs:
  - ref: REF-000230
    resolution: reuse
    note: Exact Sysmon official URL already covers Event 3 ProcessGuid, destination and default-disabled limitation; do not create a duplicate.
  - ref: REF-000377
    resolution: reuse
    note: Event 4624 supports target-side type-3 logon, principal, process and conditional network fields; success does not prove coercion.
  - ref: REF-000439
    resolution: reuse
    note: DarkHydrus/Phishery directly supports the document-template prompt-to-server credential subset, not all forced authentication.
  - ref: REF-000490
    resolution: reuse-boundary-only
    note: Direct NTLM relay experiment supports the successor audience-difference boundary; it does not prove the preceding trigger.
  - ref: REF-000492
    resolution: reuse
    note: SMB signing and service identity support relay-resistant target protection, not prevention of initial response emission.
  - ref: REF-000493
    resolution: reuse
    note: LDAP signing and channel binding support successor-target protection only.
  - ref: REF-000494
    resolution: reuse
    note: Event 8004 and collection prerequisites apply to both new analytics; one-sided 8004 cannot prove capture or coercion.
  claim_refs:
  - ref: CLM-000650
    resolution: reuse-and-extend-subject-subset
    note: Extend only to the background-resolution child for the document-reference subset; the claim remains document-specific.
  case_refs:
  - ref: CASE-000161
    resolution: reuse-and-extend-subject-subset
    note: Extend only to the background-resolution child when prompt, server receipt, and document overlap are retained; do not generalize to zero-click NTLM.
  strategy_refs:
  - ref: DET-000116
    resolution: reuse-and-extend-detects-subset
    note: Document references are one carrier-specific subset; the new general strategy is still required for messages, icons and other objects.
  analytic_refs:
  - ref: NJA-000125
    resolution: reuse-and-extend-subset
    note: Reuse for document relationship, prompt/automatic authentication and disclosure lineage only.
  mitigation_refs:
  - ref: MIT-000117
    resolution: reuse-and-extend-application-subset
    note: Add an application only for document external references; it cannot mitigate service coercion or every background resolver.
  - ref: MIT-000132
    resolution: reuse-and-extend-application
    note: Add a service-coercion application for relay-resistant targets while explicitly stating it does not stop initial challenge-response exposure.
  relationship_refs: []
