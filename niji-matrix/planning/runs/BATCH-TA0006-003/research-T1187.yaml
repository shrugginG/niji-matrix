    proposition_en: A legitimate remote service method can accept an adversary-selected network resource and cause a service or machine principal to authenticate there, requiring a cross-control-plane join from inbound call to outbound authentication.
    evidence_keys: [TA0006-003-T1187-REF-MS-EFSR, TA0006-003-T1187-REF-PETITPOTAM, TA0006-003-T1187-REF-MS-KB5005413]
  - temporary_key: TA0006-003-T1187-CLM-BOUNDARY
