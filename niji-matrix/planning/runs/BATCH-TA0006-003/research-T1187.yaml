    proposition_zh: 强制产生证明由本候选解释，改变既有路径和跨目标中继由 NJT-0136 解释，捕获后离线候选比较由 NJS-0137-003 解释，文档引用入口由 NJT-0119 解释。
    proposition_en: This candidate explains forced proof generation, NJT-0136 explains path alteration and cross-destination relay, NJS-0137-003 explains offline candidate comparison after capture, and NJT-0119 explains the document-reference entry.
    evidence_keys: [TA0006-003-T1187-REF-ATTACK, REF-000490, REF-000439]
  - temporary_key: TA0006-003-T1187-CLM-DEFENSE
    resolution: create
    proposition_zh: 可实施检测必须连接触发对象或服务调用、受害端出站认证和材料或目标结果，并按连接尝试、材料到达与目标成功分级。
    proposition_en: Implementable detection must join the triggering object or service invocation, victim outbound authentication, and material or target outcome, grading connection attempt, material arrival, and target success separately.
    evidence_keys: [TA0006-003-T1187-REF-MS-CVE23397, REF-000230, REF-000377, REF-000494]
  cases:
  - temporary_key: TA0006-003-T1187-CASE-CVE23397
    resolution: create
    event: Forest Blizzard and other observed CVE-2023-23397 targeting used malicious Outlook reminder properties to trigger Net-NTLMv2 leakage without message interaction, with Microsoft tracing potential exploitation to April 2022 and documenting relay outcomes in investigation
    evidence_keys: [TA0006-003-T1187-REF-MS-CVE23397]
    limit: Supports the Outlook reminder-property branch and observed leakage/relay chain; not every targeted message or failed connection leaked material
  detection_strategies:
  - temporary_key: TA0006-003-T1187-DET-RESOLUTION
    resolution: create
    distinction: Cross-carrier object provenance to background resolution, outbound authentication, and material outcome; DET-000116 remains document-specific
  - temporary_key: TA0006-003-T1187-DET-SERVICE
    resolution: create
    distinction: Remote service-method caller to same-host machine/service-account callback, with trigger and relay outcomes separate
  detection_analytics:
  - temporary_key: TA0006-003-T1187-NJA-RESOLUTION
    resolution: create
    distinction: Durable delivery-to-resolution mapping plus five-minute resolution-to-authentication and explicit attempt/material/success states
  - temporary_key: TA0006-003-T1187-NJA-SERVICE
    resolution: create
    distinction: Two-minute RPC or management call to service egress and receiver-result correlation using interface, method, resource and machine principal
  mitigations:
  - temporary_key: TA0006-003-T1187-MIT-AUTH-BOUNDARY
    resolution: create
    distinction: Automatic-auth destination inventory, outbound SMB/WebDAV/NTLM restriction, and evidence-calibrated exposure response across both children
  - temporary_key: TA0006-003-T1187-MIT-SERVICE-SURFACE
    resolution: create
    distinction: Remote callback-method patching, interface caller restriction, service-principal segmentation, and relay-target hardening for the service child
