research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - zh: 用户上下文中的对象、消息或界面资源由应用及桌面组件解析
      en: Object, message, or interface resources resolved by applications and shell components under a user context
    - zh: 非交互式服务或机器主体通过远程管理控制面解释网络资源
      en: Network resources interpreted by noninteractive service or machine principals through a remote-management control plane
    - zh: NTLM/SMB、Web 认证、文档、图标和具体工具是实现与载体差异，不是先验子项
      en: NTLM or SMB, web authentication, documents, icons, and named tools are implementation or carrier differences rather than prior children
    breadth_trigger: ordinary-zero-child-open-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: background_resource_resolution
      disposition: formal
      why_zh: 攻击者控制对象属性，受信客户端代表当前用户发起认证；前后痕迹、入口数据和出口控制与服务胁迫不同，且有真实调查及实验支持。
      why_en: The adversary controls an object property and a trusted client authenticates for the current user; traces, ingress data, and egress controls differ from service coercion, with incident and experimental support.
    - axis: remote_service_control_plane_coercion
      disposition: formal
      why_zh: 攻击者控制远程方法和回连资源，服务或机器账户产生认证；需 RPC 到外发的独立关联与接口控制，PoC、官方协议和厂商缓解共同支持。
      why_en: The adversary controls a remote method and callback resource and a service or machine account authenticates; the axis needs distinct RPC-to-egress correlation and interface controls, supported by a PoC, official protocol, and vendor mitigation.
    - axis: interactive_prompt_versus_silent_integrated_auth
      disposition: parent-core-and-adjacent
      why_zh: 用户交互会改变置信度和响应，但同一资源解析变量可同时产生提示或静默认证；普通仿冒表单归钓鱼，文档提示子集归 NJT-0119，故不建立兄弟项。
      why_en: Interaction changes confidence and response, but one resolution variable can produce prompted or silent authentication. Ordinary counterfeit forms belong to phishing and the document-prompt subset belongs to NJT-0119, so no sibling is created.
    - axis: carrier_or_protocol
      disposition: rejected
      why_zh: UNC、SMB、WebDAV、文档、图片、LNK 和邮件属性仅改变传输与传感器，没有稳定跨实现的独立匿迹因果。
      why_en: UNC, SMB, WebDAV, documents, images, LNK, and mail properties change transport and sensors without a stable independent stealth cause across implementations.
    - axis: user_versus_machine_principal
      disposition: absorbed-by-formal-trigger-locus
      why_zh: 主体差异与两个正式轴高度一致，但单独按账户类型分类会误收合法自动认证；触发控制面才是可操作边界。
      why_en: Principal type aligns closely with the two formal axes, but account-type partitioning alone would absorb legitimate automatic authentication; trigger control plane is the actionable boundary.
    - axis: delayed_or_repeated_trigger
      disposition: parent-mechanism-not-child
      why_zh: Outlook 资料证明未来提醒和重复触发可行，但证据集中于单一实现，防御仍复用对象解析谱系；作为 NM-ST 父机理保留而不建立产品化子项。
      why_en: Outlook evidence establishes future and repeated triggers, but support is concentrated in one implementation and defense reuses the object-resolution lineage. Retain it as a parent NM-ST mechanism rather than a product-shaped child.
    - axis: capture_crack_or_relay_outcome
      disposition: adjacent-technique
      why_zh: 材料到达定义本技术完成；离线比较归 NJS-0137-003，跨目标中继归 NJS-0136-002，目标成功和账户使用另证。
      why_en: Material arrival completes this technique; offline comparison belongs to NJS-0137-003, cross-destination relay to NJS-0136-002, and target success or account use needs separate evidence.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定基线虽无 ATT&CK 子项，研究没有在第一个可行变量处停止；从触发主体、用户交互、载体、协议、主体类型、时间、结果阶段和防御强制点开放搜索后，仅后台解析与远程服务控制面同时通过攻击者控制、痕迹变化、兄弟边界、证据和独立防御门禁。两个子项均跨产品，不复制 ATT&CK 实现枚举。
      en: Although the fixed baseline has no ATT&CK children, research did not stop at the first feasible variable. An open search across initiator, interaction, carrier, protocol, principal type, timing, outcome stage, and enforcement point left only background resolution and remote service control plane passing control, trace-change, sibling-boundary, evidence, and distinct-defense gates. Both children cross products and do not copy ATT&CK implementation lists.
  evidence_coverage:
    parent_behavior_keys: [TA0006-003-T1187-REF-ATTACK, TA0006-003-T1187-REF-MS-CVE23397, TA0006-003-T1187-REF-MS-EFSR, TA0006-003-T1187-REF-PETITPOTAM]
    boundary_keys: [REF-000439, REF-000490, TA0006-003-T1187-REF-MS-NLMP, TA0006-003-T1187-REF-MS-KB5005413]
    mechanism_support:
    - mechanism: NM-FD
      keys: [TA0006-003-T1187-REF-MS-CVE23397, TA0006-003-T1187-REF-PETITPOTAM, TA0006-003-T1187-REF-WINDOWS-AUTH]
      limit: Trusted-component execution is direct; generalized reduction in classifier accuracy is inferred from legitimate-function overlap
    - mechanism: NM-ST
      keys: [TA0006-003-T1187-REF-MS-CVE23397, TA0006-003-T1187-REF-MS-EFSR, TA0006-003-T1187-REF-PETITPOTAM]
      limit: Future trigger and split control planes are direct, but no cross-environment alert-rate measurement exists
    child_existence_support:
    - child_key: TA0006-003-T1187-CHILD-RESOLUTION
      keys: [TA0006-003-T1187-REF-MS-CVE23397, REF-000439, TA0006-003-T1187-REF-ATTACK]
      status: supported-with-carrier-specific-limits
    - child_key: TA0006-003-T1187-CHILD-SERVICE
      keys: [TA0006-003-T1187-REF-MS-EFSR, TA0006-003-T1187-REF-PETITPOTAM, TA0006-003-T1187-REF-MS-KB5005413]
      status: supported-by-protocol-and-direct-experiment-no-field-case
    unsupported_or_deferred:
    - zh: 失败 SMBClient 或 WebDAV 回退事件不能证明挑战响应已经到达攻击者。
      en: A failed SMBClient event or WebDAV fallback does not establish challenge-response arrival at the adversary.
    - zh: 没有在同一公开在野案例中核到 EFSRPC 原始调用、监听端材料和最终中继结果三者，因此服务子项案例置信度不得冒充实战闭环。
      en: No public in-the-wild case in this batch provides the EFSRPC call, listener material, and final relay result together, so the service child cannot claim a field-proven end-to-end case.
    - zh: Outlook 的未来提醒支持时间分离，但不能证明所有对象载体都有可控延迟或更低告警率。
      en: Outlook future reminders support temporal separation but do not establish controllable delay or lower alert rates for every carrier.
    - zh: 协议或载体枚举不证明独立 Niji 子项，主体类型也不能脱离攻击者控制的触发面单独分类。
      en: Protocol or carrier enumeration does not prove an independent Niji child, and principal type cannot be classified apart from the adversary-controlled trigger plane.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父稿分别覆盖行为定义、认证材料结果、合法自动认证反例、载体与相邻技术边界、真实端点和服务场景、攻防前提、两个支持机理及结论层级。两个子稿按不同触发控制面给出独立变量、反事实痕迹、检测字段、窗口、误报、盲区、调优和缓解应用；没有按 ATT&CK 列举的文档、图标、UNC、SMB、WebDAV 或 EFSRPC 建子项。
      en: The parent separately covers behavior, authentication-material outcome, legitimate automatic-authentication counterexamples, carrier and adjacent-technique boundaries, endpoint and service scenarios, attacker and defender assumptions, two supported mechanisms, and conclusion levels. Each child has its own control-plane variable, counterfactual trace, fields, windows, false positives, blind spots, tuning, and mitigation application. No child is named after ATT&CK-listed documents, icons, UNC, SMB, WebDAV, or EFSRPC.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization, URL duplicate search, recursive structural audit, bilingual-presence audit, and temporary-key resolution audit only
  limitations:
    paragraphs:
    - zh: 证据层级不对称。Microsoft 的 CVE-2023-23397 调查提供在野利用、材料泄露、无交互触发和检测局限，DarkHydrus 提供文档提示与服务端测试凭据；服务胁迫主要由官方协议、原始 PoC 和厂商缓解支撑，缺少本批可独立核验的完整在野链。不能把不同来源的调用、捕获和中继拼成一个已观察事件，正式对象应把服务分支案例置信度低于其能力置信度。
      en: Evidence levels are asymmetric. Microsoft's CVE-2023-23397 investigation provides observed exploitation, material leakage, no-interaction triggering, and detection limits, while DarkHydrus provides a document prompt and server-side test credentials. Service coercion rests mainly on an official protocol, original proof of concept, and vendor mitigation and lacks a fully verifiable in-the-wild chain in this batch. Calls, capture, and relay from different sources cannot be spliced into one observed event; the formal object should keep service-branch case confidence below capability confidence.
    - zh: 端点对象属性、RPC 方法参数、8004、Sysmon Event 3 和监听端结果在多数环境不会同时存在，实际 Analytic 必须先验证采集与字段保留。合法单点登录、模板、共享、备份、打印、监控和证书注册与恶意链高度同形；精度依赖目的地和调用关系清单。若只能证明触发或连接尝试，应保留 exposure/attempt，不得宣称凭据材料已经获取。
      en: Endpoint object properties, RPC method parameters, event 8004, Sysmon Event 3, and listener outcomes rarely coexist by default, so deployment must validate collection and field retention first. Legitimate single sign-on, templates, shares, backup, printing, monitoring, and certificate enrollment strongly resemble the malicious chain, making destination and call-relationship inventories essential. If evidence establishes only a trigger or connection attempt, retain exposure or attempt status rather than claiming credential material was acquired.
  rejected_mechanisms:
  - mechanism: NM-DO
    reason_zh: NTLM 挑战响应的密码学形态是协议属性，攻击者在本行为中没有主动改变数据内容或可解释性，不能据此宣称数据遮蔽。
    reason_en: The cryptographic form of an NTLM challenge response is a protocol property; the adversary does not alter data content or interpretability in this behavior, so Data Obscuration is unsupported.
  open_questions:
  - zh: 主 Agent 应决定是否把 CLM-000650、CASE-000161、DET-000116、NJA-000125 和 MIT-000117 的 subject/detects/application 扩展到后台解析子项；任何扩展都必须明确只覆盖文档引用子集。
    en: The primary agent should decide whether to extend CLM-000650, CASE-000161, DET-000116, NJA-000125, and MIT-000117 to the background-resolution child, with every extension explicitly limited to the document-reference subset.
  - zh: 目标 Windows 版本与传感器能否稳定提供 RPC 接口、方法、参数和同一事务的服务外发字段需要逐部署实测；缺失时服务 Analytic 只能给机器账户异常目的地而不能确证胁迫。
    en: Each deployment must test whether its Windows version and sensors reliably expose RPC interface, method, parameters, and same-transaction service egress. Without them, the service analytic can report an anomalous machine-account destination but cannot confirm coercion.
  - zh: 若主 Agent 找到同一在野事件同时证明服务调用、监听端响应和后继目标结果，可新增案例并提升服务子项的案例置信度；否则保持实验与潜在攻击表述。
    en: If the primary agent finds one field incident establishing the service call, listener response, and successor target outcome, a case can be added and service-child case confidence raised. Otherwise retain laboratory and potential-attack wording.
