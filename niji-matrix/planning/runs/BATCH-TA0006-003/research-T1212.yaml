research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - zh: ATT&CK 父项横跨凭据收集、认证绕过、票据伪造、重放和云令牌产生，但没有正式子项；这些行为差异用于边界检查，不作为 Niji 输出模板。
      en: The ATT&CK parent spans credential collection, authentication bypass, ticket forgery, replay, and cloud-token creation without formal children; these differences inform boundary review rather than a Niji output template.
    breadth_trigger: ordinary-open-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: sensitive_store_reader_identity
      disposition: formal-two-way-partition
      why_zh: 受害服务代理读取与攻击者控制低权上下文直读的可见主体、痕迹位置、误报和控制动作均不同，且分别有在野结果证据。
      why_en: Victim-service-mediated reads and direct reads by an attacker-controlled lower-authority context differ in visible subject, trace location, false positives, and control actions, with observed outcome evidence for each.
    - axis: request_response_coupling
      disposition: subsumed
      why_zh: 同事务返回是服务代理读取的结果特征，单独拆分会与读取主体轴重复；异步或分块响应不改变存储侧主体。
      why_en: Same-transaction return is a result property of service-mediated reading and would duplicate the reader-identity axis; asynchronous or chunked delivery does not change the store-side subject.
    - axis: material_encryption_state
      disposition: parent-core-result-grade
      why_zh: 明文、散列、密文和令牌影响可用性与响应优先级，但属于结果状态或相邻材料技术，不是稳定匿迹变量。
      why_en: Plaintext, hashes, ciphertext, and tokens affect usability and response priority but are result states or adjacent material techniques rather than stable stealth variables.
    - axis: target_version_or_input_selection
      disposition: parent-core
      why_zh: 精确版本和触发输入是所有漏洞利用的必要因果字段；没有独立证据证明特定 T1212 主体借选择性请求改变观察效果。
      why_en: Exact version and trigger input are required causal fields for all exploitation; no separate evidence establishes a T1212 actor changing observation through selective requests.
    - axis: low_rate_or_distributed_exploitation
      disposition: evidence-deferred
      why_zh: 公开 T1212 事件没有提供足以证明刻意低频或多来源规避检测阈值的原始时序和传感器结果。
      why_en: Public T1212 incidents do not provide original timing and sensor outcomes sufficient to establish deliberate low-rate or multi-source threshold evasion.
    - axis: crash_or_fault_suppression
      disposition: evidence-deferred
      why_zh: 成功信息泄露可能不产生崩溃，但当前来源没有证明攻击者控制故障抑制变量或相对痕迹差。
      why_en: Successful disclosure may avoid a crash, but current sources do not establish attacker control of fault suppression or a comparative trace difference.
    - axis: product_cve_vulnerability_class
      disposition: rejected
      why_zh: VPN、vCenter、路径穿越、错误权限、CVE 和平台是实现条件，不能形成 Niji 子技术身份。
      why_en: VPN, vCenter, path traversal, improper permission, CVE, and platform are implementation conditions and cannot define Niji child identity.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        固定 ATT&CK 子项为零，不触发数量型第二轮审查；开放搜索仍覆盖输入选择、请求与结果耦合、读取主体、材料状态、时序/来源分布、故障反馈和平台实现。只有读取主体轴同时通过稳定性、攻击者控制、痕迹变化、结论级证据、兄弟边界和防御差异门禁，因此收敛为两项正式候选。
      en: >-
        The fixed ATT&CK child count is zero, so the numerical second-pass trigger does not apply. The open search still covered input selection, request-result coupling, reader identity, material state, temporal and source distribution, fault feedback, and platform implementation. Only reader identity passes stability, attacker control, trace change, conclusion-level evidence, sibling boundary, and defensive-difference gates, converging to two formal candidates.
  evidence_coverage:
    parent_behavior_keys:
    - REF-000625
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-VMWARE
    - REF-000179
    boundary_keys:
    - REF-000391
    - REF-000469
    - REF-000355
    - REF-000542
    mechanism_support:
    - mechanism: NM-BT
      keys:
      - TA0006-003-T1212-REF-FORTINET-VULN
      - TA0006-003-T1212-REF-CISA-ROUTINELY
      - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
      - TA0006-003-T1212-REF-VMWARE
      - REF-000179
      limit: >-
        Directly supports bypass of normal read protection and credential results; telemetry distribution is a strong inference from service/file architecture and must not be generalized as total invisibility
    - mechanism: NM-FD
      keys:
      - TA0006-003-T1212-REF-FORTINET-VULN
      - TA0006-003-T1212-REF-VMWARE
      - REF-000179
      limit: >-
        Supports visible reader identity differing from the remote or controlling actor; subjective concealment intent is not established for every exploit
    child_existence_support:
    - child_key: TA0006-003-T1212-CHILD-SERVICE
      keys:
      - TA0006-003-T1212-REF-FORTINET-VULN
      - TA0006-003-T1212-REF-CISA-ROUTINELY
      - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
      evidence_mode: directly-observed-result
    - child_key: TA0006-003-T1212-CHILD-LOWAUTH
      keys:
      - TA0006-003-T1212-REF-VMWARE
      - REF-000179
      evidence_mode: directly-observed-result-with-encryption-limit
    unsupported_or_deferred:
    - zh: 认证绕过而没有凭据或读取能力结果不进入适配后的父项；票据、Web 凭据和令牌伪造分别归其直接技术。
      en: Authentication bypass without a credential or read-capability result is outside the adapted parent; ticket, web-credential, and token forgery remain with their direct techniques.
    - zh: CVE、异常请求、服务崩溃和当前漏洞状态都不单独证明凭据已获。
      en: A CVE, anomalous request, service crash, or current vulnerability state does not alone establish credential acquisition.
    - zh: 加密凭据的取得不证明已解锁或后继使用，UNC3886 来源的 further access 也不能映射到每条材料。
      en: Acquisition of encrypted credentials does not prove unlock or successor use, and UNC3886 reporting of further access cannot be mapped to every material item.
    - zh: 公开来源不足以正式化低频、多来源、目标条件门控或故障抑制子项。
      en: Public sources are insufficient to formalize low-rate, multi-source, target-state-gated, or fault-suppressed children.
    - zh: CASE-000072 与 REF-000053 聚焦 CVE-2023-20867 无来宾认证执行，不证明 T1212 凭据结果，禁止复用为本候选案例。
      en: CASE-000072 and REF-000053 concern unauthenticated guest execution through CVE-2023-20867 and do not prove a T1212 credential result; they must not be reused as this candidate's case.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父稿分别处理漏洞直接取密定义、证据阶段、观察迁移、邻接技术和攻防前提；两项子稿都给出存储侧读取主体变量、反事实痕迹、在野结果、独立 Analytic 和目标特定缓解应用。内容没有复制 NJT-0001 的子项数量或扫描结论。
      en: >-
        The parent separately addresses vulnerability-driven credential acquisition, evidence stages, observation shift, neighboring techniques, and attacker and defender prerequisites. Both children define a store-side reader variable, counterfactual trace, observed result, independent analytic, and target-specific mitigation application. The content does not copy NJT-0001's child count or scanning conclusions.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization and recursive structural or scalar-type audit only
  limitations:
    paragraphs:
    - zh: >-
        证据集中在两条高质量事件链：CVE-2018-13379 支持远端服务代理返回，CVE-2022-22948 与 UNC3886 支持低权上下文直读。它们能够证明分类轴存在，却不能代表所有操作系统、身份提供方、云服务或漏洞类别；服务内部文件访问、数据库查询、解密和后继登录字段在公开报告中并不完整。正式置信度必须按每个事件可恢复的前态、输入、对象和结果调整。
      en: >-
        Evidence concentrates on two high-quality incident chains: CVE-2018-13379 supports remote service-mediated return, while CVE-2022-22948 and UNC3886 support a direct lower-authority read. They establish that the taxonomy axes exist but do not represent every operating system, identity provider, cloud service, or vulnerability class. Public reporting does not fully expose service-internal file access, database queries, decryption, or later sign-in fields. Formal confidence must track the pre-state, input, object, and result recoverable in each event.
    - zh: >-
        漏洞利用并不天然具有匿迹意图或匿迹效果；本研究只把正常授权事务缺失、可见读取主体错位和监控平面迁移作为有证据的特性。加密材料、读取字节和成功响应都不能替代可用秘密结论，合法支持、备份和取证又可能产生相似访问。部署 Analytic 前需验证实际字段、时间同步、原始/规范化路径保留、对象分类和秘密不入日志要求。
      en: >-
        Exploitation does not inherently carry concealment intent or effect. This research supports only absence of ordinary authorization transactions, misalignment of visible reader and controller, and movement among monitoring planes. Encrypted material, bytes read, and a successful response do not substitute for a usable-secret conclusion, while legitimate support, backup, and forensics can produce similar accesses. Before deploying an analytic, validate actual fields, time synchronization, raw and canonical path retention, object classification, and the requirement that secrets never enter logs.
  rejected_mechanisms:
  - mechanism: NM-ST
    reason_zh: 没有 T1212 原始来源证明攻击者通过低频、延迟或多来源分布使本候选信号低于检测阈值。
    reason_en: No T1212 primary source establishes an adversary using low rate, delay, or distributed origins to move this candidate's signals below detection thresholds.
  - mechanism: NM-DO
    reason_zh: 凭据密文是材料状态或原系统保护，并非当前证据中的攻击者主动数据遮蔽变量；利用编码输入也未证明捕获后语义不可解释。
    reason_en: Credential ciphertext is a material state or original-system protection rather than an attacker-controlled data-obscuration variable in the current evidence, and encoded exploit input is not shown to remain semantically opaque after capture.
  open_questions:
  - zh: 主 Agent 应确认本批 T1606 的伪造凭据边界，避免将 ATT&CK T1212 原页中的票据或云令牌创建示例留在适配后的 T1212。
    en: The primary agent should reconcile the T1606 forgery boundary in this batch so ticket or cloud-token creation examples from the ATT&CK T1212 page do not remain in adapted T1212.
  - zh: 主 Agent 应检查 T1003 的后续正式范围；同一事件仅在漏洞直接造成操作系统认证材料读取且转储行为也被独立观察时才并列，不应预先吞并。
    en: The primary agent should review the later formal T1003 scope. Co-record the same event only when the flaw directly causes operating-system authentication-material access and dumping behavior is independently observed; do not preemptively absorb it.
  - zh: 如无法确认产品日志保留 raw_path 与 canonical_path 或成功文件读取，服务代理 Analytic 应在正式对象中把相应数据源标为部署前置，而不是假设默认存在。
    en: If product logs cannot be shown to retain raw_path and canonical_path or successful file reads, the formal service-mediated analytic should mark those data sources as deployment prerequisites rather than assume they exist by default.
