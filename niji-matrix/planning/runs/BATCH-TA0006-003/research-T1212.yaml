handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-003
work_item_ref: WORK-TA0006-T1212
temporary_key_prefix: TA0006-003-T1212
candidate:
  source_type: attack
  source_attack_id: T1212
  name:
    zh: 脆弱凭据读取边界利用
    en: Vulnerable Credential-Read Boundary Exploitation
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: >-
        ATT&CK Enterprise 19.1 的 T1212 把软件漏洞用于收集凭据、绕过认证、伪造票据、重放认证材料或在云身份系统中产生令牌等行为放在同一父项。Credential Access 中有必要保留“漏洞是取得凭据结果的直接机制”这一行为，但原范围会与 T1558 票据伪造、T1606 Web 凭据伪造、T1550 认证材料重放、T1556 认证过程修改和普通认证绕过重叠。建议适配为脆弱凭据读取边界利用：攻击者控制的输入必须到达事件时确切脆弱的组件或保护状态，并直接产生此前不可用的凭据、认证材料或可独立验证的读取能力。
      en: >-
        ATT&CK Enterprise 19.1 T1212 groups software exploitation used to collect credentials with authentication bypass, ticket forgery, replay of authentication material, and token creation in cloud identity systems. Credential Access still needs the behavior in which a vulnerability is the direct mechanism producing a credential result, but the original scope overlaps T1558 ticket forgery, T1606 web-credential forgery, T1550 authentication-material replay, T1556 authentication-process modification, and generic authentication bypass. Adapt the candidate as Vulnerable Credential-Read Boundary Exploitation: attacker-controlled input must reach an exact component or protection state that was vulnerable at the event time and directly produce credentials, authentication material, or an independently verified read capability that was unavailable beforehand.
    - zh: >-
        固定父项没有 ATT&CK 子技术，仍完成了开放 Niji 分类搜索。建议的两项子技术不按产品、CVE、漏洞类别或材料类型划分，而按敏感存储侧实际执行读取的主体划分：受害服务代理凭据返回中，服务进程替远端攻击者读取并通过既有响应返回材料；低权上下文越界凭据库读取中，攻击者控制的非管理员身份或进程直接读取原本受保护的文件或数据库。两者分别要求请求—服务读取—响应关联与调用者权限前态—存储读取—结果关联，具有稳定痕迹差和独立防御价值。
      en: >-
        The fixed parent has no ATT&CK sub-techniques, but the open Niji taxonomy search was still completed. The two proposed children are not divided by product, CVE, vulnerability class, or material type. They are divided by the subject that performs the read at the sensitive store. In Victim-Service-Mediated Credential Return, a service process reads for the remote adversary and returns material through its existing response. In Low-Authority Context Credential-Store Over-Read, an attacker-controlled nonadministrative identity or process directly reads a file or database that should be protected. The former requires request-to-service-read-to-response correlation; the latter requires caller authority pre-state-to-store-read-to-result correlation. Their traces and defensive value are materially different.
proposed_content:
  summary:
    zh: 攻击者利用软件缺陷直接越过凭据读取边界取得认证材料或可证实的读取能力，并把关键因果分散到漏洞输入、组件状态和秘密结果之间。
    en: Adversaries exploit a software flaw to cross a credential-read boundary and obtain authentication material or a verified read capability, distributing the critical causality across exploit input, component state, and secret result.
  definition_and_concept:
    paragraphs:
    - zh: >-
        脆弱凭据读取边界利用是攻击者向可定位的软件组件、服务接口、文件保护状态或数据库访问路径提供可控输入，利用编程错误、逻辑错误或错误权限，使原始身份或请求取得正常授权路径不会返回的口令、密钥、散列、令牌、加密凭据或等价认证材料。直接目标是跨越读取边界；漏洞编号、利用代码、受影响产品和材料格式只是实现条件，不决定技术身份。
      en: >-
        Vulnerable Credential-Read Boundary Exploitation occurs when an adversary supplies controlled input to an identifiable software component, service interface, file-protection state, or database access path and uses a programming, logic, or permission flaw so the originating identity or request obtains a password, key, hash, token, encrypted credential, or equivalent authentication material that the normal authorization path would not return. The direct objective is crossing the read boundary. A vulnerability identifier, exploit code, affected product, or material format is an implementation condition rather than the technique identity.
    - zh: >-
        研究和处置必须把脆弱版本存在、利用输入到达、漏洞转换发生、读取能力形成、材料实际返回、材料解锁以及后继身份使用分为不同证据阶段。一次扫描、PoC 文件、异常请求、服务崩溃或漏洞告警只支持暴露或尝试；可重复读取受保护对象支持读取能力；恢复的材料或受害方确认支持材料结果；成功登录或资源访问则是后继使用。不得把后一个阶段倒推给缺少因果证据的前一个阶段。
      en: >-
        Research and response must separate the presence of a vulnerable version, arrival of exploit input, occurrence of the vulnerable transition, establishment of read capability, actual return of material, unlock of that material, and later identity use. A scan, proof-of-concept file, anomalous request, service crash, or vulnerability alert supports exposure or attempt only. Repeatable access to a protected object supports read capability. Recovered material or victim confirmation supports a material result. Successful sign-in or resource access is a successor behavior. A later stage must not be projected backward onto an earlier stage that lacks causal evidence.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        正常凭据读取通常经过认证、保管库 API、文件权限、数据库授权或明确的权限授予。漏洞利用可以让受害服务代替攻击者读取，或让低权身份的直接文件或数据库读取被错误放行，因此与秘密结果对应的正常授权、解锁或提升事务可能不存在。服务侧记录可能只显示一个既有网络服务完成了读取，存储侧也可能把行为归给受信服务或表面低权的本地身份；只看身份登录、保管库 API 或高权进程的检测无法还原原始控制者。
      en: >-
        Ordinary credential reads pass through authentication, vault APIs, file permissions, database authorization, or an explicit authority grant. Exploitation can make a victim service read on the adversary's behalf or incorrectly allow a lower-authority identity to read a file or database directly, so the normal authorization, unlock, or elevation transaction corresponding to the secret result may not exist. Service-side records may show only an established network service performing the read, while the store may attribute the activity to a trusted service or an apparently lower-authority local identity. Detection limited to sign-ins, vault APIs, or privileged processes cannot recover the original controller.
    - zh: >-
        痕迹并未消失，而是转移到精确版本与补丁状态、异常请求或本地调用、服务进程的敏感对象访问、低权主体对文件或数据库的读取、响应大小与状态、输出文件、外传和暴露后的身份活动。CVE-2018-13379 的专门构造 HTTP 资源请求具有可检测特征，CVE-2022-22948 也要求非管理员访问与敏感信息结果；因此不能把所有 T1212 描述成无文件、无崩溃或不可见。匿迹收益仅在防守方没有连接这些分散观察面时成立。
      en: >-
        Traces remain but move to exact version and patch state, anomalous requests or local calls, sensitive-object access by a service process, file or database reads by a lower-authority subject, response status and size, output files, egress, and identity activity after exposure. The specially crafted HTTP resource request for CVE-2018-13379 has detectable features, while CVE-2022-22948 requires nonadministrative access and a sensitive-information result. T1212 therefore cannot be described universally as fileless, crashless, or invisible. Its stealth benefit exists only when defenders fail to join these distributed observation planes.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求四项因果要素同时可说明：事件时精确脆弱组件或保护状态、攻击者可控输入或读取动作、由缺陷造成的读取边界越过，以及凭据材料或可独立验证的新增读取能力。合法支持导出、备份、迁移、取证收集、漏洞扫描和补丁验证可能产生相似请求或文件读取，必须核对工单、所有者、调用者前态、目标对象、输出和时间。密文凭据可以构成取得的认证材料，但其是否可立即使用、是否已解密以及是否被后继使用须分别表述。
      en: >-
        Inclusion requires a causal account of four elements: the exact vulnerable component or protection state at event time, attacker-controlled input or read action, crossing of the read boundary because of the flaw, and credential material or an independently verified new read capability. Legitimate support export, backup, migration, forensic collection, vulnerability scanning, and patch validation can generate similar requests or file reads, so work order, owner, caller pre-state, target object, output, and timing must be checked. Encrypted credentials can be acquired authentication material, but immediate usability, decryption, and successor use must be stated separately.
    - zh: >-
        若漏洞只产生代码执行或首个入口，分别归客户端、公开应用或远程服务利用；若直接结果是正向权限差，归 T1068/NJT-0102；若直接结果是隐藏活动或绕开日志，归 T1211/NJT-0110；若直接损伤检测、日志或安全控制，归 TA0112 的 T1687/NJT-0129。T1003 负责操作系统认证材料转储，T1555/NJT-0147 负责受管理凭据库取用；当漏洞本身是绕过这些对象读取控制的直接机制时可以并列记录，但材料类型不能替代漏洞因果。仅认证绕过、票据或 Web 凭据伪造、认证材料重放、修改认证流程和使用已得凭据分别由相邻认证技术承担。
      en: >-
        When a flaw produces only code execution or an initial foothold, client, public-facing application, or remote-service exploitation owns that result. A positive authority difference belongs to T1068 and NJT-0102. Hiding activity or bypassing logging belongs to T1211 and NJT-0110. Direct degradation of detection, logging, or security controls belongs to TA0112 T1687 and NJT-0129. T1003 owns operating-system authentication-material dumping, while T1555 and NJT-0147 own managed credential-store retrieval. They may be recorded together when a vulnerability is the direct mechanism bypassing the object's read control, but material type does not replace exploit causality. Authentication bypass alone, ticket or web-credential forgery, authentication-material replay, authentication-process modification, and use of already acquired credentials remain with their neighboring authentication techniques.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          面向互联网的 VPN、身份设备或管理服务可能通过路径规范化、访问控制或响应构造缺陷，把包含凭据的系统文件作为正常协议响应返回；CVE-2018-13379 已造成未认证文件下载和大规模 SSL-VPN 凭据暴露。已取得本地非管理员访问的攻击者也可能利用错误文件权限直接读取管理平台的敏感数据库；Mandiant 观察 UNC3886 利用 CVE-2022-22948 从 vCenter postgresDB 取得加密凭据。两个场景都要求把漏洞入口、读取结果和后继使用分开，而不是以漏洞存在替代结果证据。
        en: >-
          An Internet-facing VPN, identity appliance, or management service can contain path-normalization, access-control, or response-construction flaws that return a credential-bearing system file through an ordinary protocol response. CVE-2018-13379 enabled unauthenticated file download and resulted in broad SSL-VPN credential exposure. An adversary with local nonadministrative access can instead exploit incorrect file permissions to read a management platform's sensitive database directly. Mandiant observed UNC3886 exploit CVE-2022-22948 to obtain encrypted credentials from the vCenter postgresDB. Both scenarios require exploit entry, read result, and successor use to remain separate rather than using vulnerability presence as a substitute for outcome evidence.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者必须能到达脆弱接口或在目标上拥有满足最低前提的身份，识别或推断组件版本与配置，构造能够触发读取缺陷的输入，并接收响应或访问输出。远端服务代理分支可能不需要已有账户，低权直读分支通常需要本地非管理员会话。补丁、接口隔离、正确路径规范化、最小化服务身份、严格文件或数据库权限以及短寿命材料会限制结果；错误版本或输入可能只产生拒绝、故障或告警。
          en: >-
            The adversary must reach the vulnerable interface or possess a target identity satisfying the minimum prerequisite, identify or infer component version and configuration, construct input that triggers the read flaw, and receive the response or access the output. The remote service-mediated branch may require no existing account, while the low-authority direct-read branch usually requires a local nonadministrative session. Patching, interface isolation, correct path canonicalization, a minimized service identity, strict file or database permissions, and short-lived material constrain the result. A mismatched version or input may produce only denial, fault, or alert.
        - zh: >-
            攻击者可选择一种使正常凭据 API、解锁提示或权限提升事务缺席的漏洞路径，但公开资料很少直接证明每次选择都以匿迹为主观目的。可证实的是观察差：同一秘密结果的原因被分散到远端请求、受害组件版本和敏感对象读取之间。目标探测、低频请求、故障抑制或清理只有在事件证据同时显示攻击者控制和痕迹变化时才可另行主张。
          en: >-
            An adversary can choose a vulnerable route that lacks ordinary credential APIs, unlock prompts, or elevation transactions, although public reporting rarely proves concealment as the subjective motive for every choice. The supported conclusion is an observation difference: causality for the same secret result is distributed across a remote request, victim component version, and sensitive-object read. Target probing, low-rate requests, fault suppression, or cleanup require separate incident evidence of attacker control and trace change before they can be claimed.
      defender_model:
        paragraphs:
        - zh: >-
            防守方假定能够保存可按事件时间恢复的软件版本、补丁和接口可达性，并至少拥有请求/响应元数据、服务或进程身份、敏感文件或数据库访问、主体权限前态及输出或外传中的一部分。事件必须分级为 exposure、attempt、read-capability-confirmed、material-recovered 和 successor-use；当前漏洞扫描结果不能重建历史状态，响应成功或字节量也不能证明凭据内容，后继登录更不能自动归因于本次漏洞。
          en: >-
            The defender is assumed to retain software version, patch state, and interface reachability reconstructable at event time, plus at least some request and response metadata, service or process identity, sensitive file or database access, caller authority pre-state, and output or egress evidence. Events must be tiered as exposure, attempt, read-capability-confirmed, material-recovered, and successor-use. A current vulnerability scan cannot reconstruct historical state. A successful response or byte count does not prove credential content, and a later sign-in cannot automatically be attributed to the exploit.
        - zh: >-
            边缘设备和封闭 appliance 往往不提供逐文件访问或完整请求日志，TLS 终止位置、路径解码差异与日志保留也会造成盲区；本地文件审计若未预先启用，就无法事后补出成功读取。检测系统不得保存秘密值，应用资产分类、对象标识、字节量、受害方验证和轮换范围表示结果。主机已被提权或防守损伤时，还需借助独立控制面、网络侧和离线证据校验。
          en: >-
            Edge devices and closed appliances often lack per-file access or complete request logs, while TLS termination, path-decoding differences, and retention create blind spots. Local file audit cannot reconstruct a successful read retroactively when it was not enabled. Detection systems must not store secret values; asset classification, object identifiers, byte counts, victim validation, and rotation scope represent outcomes. If the host was also elevated or defense was impaired, independent control-plane, network-side, and offline evidence are needed for validation.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 脆弱读取绕开正常凭据授权事务并把因果分散到输入、组件状态和秘密结果之间
      en: Vulnerable reads bypass normal credential authorization transactions and distribute causality across input component state and secret result
    analysis:
      paragraphs:
      - zh: >-
          攻击者把可控请求或读取交给存在缺陷的服务、权限检查或存储保护状态，软件缺陷使凭据材料在没有正常认证、保管库调用、文件授权或权限提升记录的情况下返回。防守方若只监测正常授权路径，就只能看到秘密结果的一部分或后继登录；把事件时精确版本、触发输入、敏感对象访问和结果分层关联，才能恢复漏洞因果。Fortinet 的文件下载说明、公开凭据暴露和 Mandiant 的 vCenter 调查共同支持这种观察面迁移，但不证明所有漏洞都无日志。
        en: >-
          The adversary submits a controlled request or read to a flawed service, permission check, or storage-protection state, causing credential material to be returned without the normal authentication, vault call, file authorization, or elevation record. A defender monitoring only ordinary authorization paths sees only part of the secret result or a later sign-in. Joining the exact event-time version, trigger input, sensitive-object access, and graded result recovers exploit causality. Fortinet's file-download description and public credential exposure, together with Mandiant's vCenter investigation, support this observation-plane shift without establishing that every vulnerability is logless.
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
    - REF-000179
    - TA0006-003-T1212-REF-VMWARE
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 受害服务或表面低权主体成为敏感读取的可见来源而遮蔽远端控制者
      en: A victim service or apparently low-authority subject becomes the visible source of a sensitive read and obscures the remote controller
    analysis:
      paragraphs:
      - zh: >-
          在服务代理分支，敏感对象侧可见的读取者是本来就能提供 VPN 或管理功能的服务进程，而攻击者只出现在远端请求；在低权直读分支，文件或数据库层可能把访问记录为普通非管理员主体，因为错误权限已将读取放行。两者都使单独按进程名称或名义权限分类的规则低估恶意性，但请求形态、对象偏离、版本状态和异常输出仍可区分。这里主张的是可见来源与真实控制者错位，不把服务签名或低权限标签本身视为恶意证据。
        en: >-
          In the service-mediated branch, the sensitive object shows a service process that ordinarily provides VPN or management functions as the reader, while the adversary appears only in the remote request. In the low-authority direct-read branch, file or database telemetry may record an ordinary nonadministrative subject because the faulty permissions allow the read. Both weaken rules that classify activity only by process name or nominal privilege, while request shape, object deviation, version state, and abnormal output remain distinguishing evidence. The supported claim is misalignment between visible source and true controller, not that a service signature or low-authority label is itself malicious.
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - REF-000179
    - TA0006-003-T1212-REF-VMWARE
    confidence: medium
proposed_subtechniques:
- temporary_key: TA0006-003-T1212-CHILD-SERVICE
  name:
    zh: 受害服务代理凭据返回
    en: Victim-Service-Mediated Credential Return
  summary:
    zh: 攻击者使脆弱服务进程替其读取敏感对象并在原协议响应中返回凭据材料，把存储侧来源留在受害服务。
    en: The adversary makes a vulnerable service process read a sensitive object and return credential material through the original protocol response, leaving the victim service as the store-side source.
  taxonomy_variable:
    zh: 敏感存储侧实际读取主体是否为响应远端请求的受害服务
    en: Whether the subject reading at the sensitive store is the victim service answering a remote request
  counterfactual_trace:
    zh: 攻击者直接读取通常需要本地进程或身份访问并在存储侧暴露该主体；服务代理后，敏感读取归因于既有服务，攻击者控制留在请求与响应之间。
    en: A direct adversary read normally requires local process or identity access visible at the store; after service mediation, the sensitive read is attributed to an established service and adversary control remains between request and response.
  definition_and_concept:
    paragraphs:
    - zh: >-
        受害服务代理凭据返回是攻击者向网络服务、身份设备或管理接口提交可控请求，利用路径解析、访问控制、对象引用或响应构造缺陷，使该服务以自身权限读取凭据承载对象，并把材料放入同一协议会话的响应。分类变量是“谁在敏感存储侧执行读取以及材料经何因果返回”，不是 HTTP、VPN、路径穿越或某一厂商。
      en: >-
        Victim-Service-Mediated Credential Return occurs when an adversary submits a controlled request to a network service, identity appliance, or management interface and exploits a path-resolution, access-control, object-reference, or response-construction flaw so the service reads a credential-bearing object under its own authority and places the material in the same protocol session's response. The variable is who performs the read at the sensitive store and how the material is causally returned, not HTTP, VPN, path traversal, or a vendor.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        受害服务代理凭据返回把攻击者的直接文件或保管库读取替换为服务进程的一次敏感对象访问和外观仍属于既有服务的响应。只查看端点新进程、用户登录或凭据 API 的防守方可能看不到原始控制者，存储审计也可能只记录服务身份。残余痕迹包括异常编码或规范化后的路径、罕见对象、响应状态和字节量、服务到敏感文件的读取、来源地址以及暴露后身份使用；应用或传感器若没有保留原始与规范化请求，识别会下降。
      en: >-
        Victim-Service-Mediated Credential Return replaces a direct file or vault read by the adversary with one sensitive-object access by a service process and a response that still belongs to the established service. Defenders watching only new endpoint processes, user sign-ins, or credential APIs may not see the original controller, and store audit may record only the service identity. Residual traces include unusual encoded or canonical paths, rare objects, response status and byte count, service access to sensitive files, source address, and identity use after exposure. Detection weakens when the application or sensor does not retain both raw and canonical request forms.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求远端请求、事件时脆弱服务、该服务对凭据对象的读取和材料响应之间存在可支持的因果链。普通静态文件下载、获批支持包、配置备份和用户自己的导出是反例；只见攻击 URI 或 200 状态仍是尝试。若攻击者在本地低权进程中直接读取数据库而没有服务代理，归低权上下文越界凭据库读取；若服务只产生 shell 或权限提升而后续另用工具取密，漏洞结果分别归入口或提权，凭据阶段另行记录。
      en: >-
        Inclusion requires a supported causal chain among a remote request, a service vulnerable at event time, the service's read of a credential object, and a material response. Ordinary static-file download, approved support bundles, configuration backup, and a user's own export are counterexamples. An exploit URI or status 200 alone remains an attempt. A direct database read by a local lower-authority process without service mediation belongs to Low-Authority Context Credential-Store Over-Read. If the service only produces a shell or elevation and a separate tool later retrieves secrets, the exploit result belongs to entry or elevation and the credential stage is recorded separately.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          CVE-2018-13379 允许未认证攻击者通过专门构造的 HTTP 资源请求下载 FortiOS 系统文件，政府资料进一步说明对 sslvpn_websession 的访问能够暴露明文用户名和口令；Fortinet 后续确认公开的 87,000 台设备 SSL-VPN 访问资料来自扫描时仍未修补的系统。这组来源直接支持服务代理文件读取与凭据结果，但不能证明每台受影响设备都保留同样日志字段。
        en: >-
          CVE-2018-13379 allowed an unauthenticated adversary to download FortiOS system files through specially crafted HTTP resource requests. Government reporting further explains that access to sslvpn_websession can expose cleartext usernames and passwords, and Fortinet later confirmed that disclosed SSL-VPN access data for 87,000 devices came from systems that remained unpatched when scanned. These sources directly support service-mediated file reading and a credential result, but they do not establish identical log fields on every affected device.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要从网络到达脆弱服务，知道或探测受影响版本和请求语法，并能接收足够完整的响应。目标文件还必须存在并含有可用或可进一步处理的认证材料。升级、关闭不必要接口、上游访问控制、路径规范化修复和减少 appliance 上长期保存的凭据会破坏链条；错误请求可能产生拒绝、IPS 命中或服务故障。
          en: >-
            The adversary needs network reachability to the vulnerable service, knowledge or discovery of the affected version and request syntax, and the ability to receive a sufficiently complete response. The target object must exist and contain usable or further-processable authentication material. Upgrade, disabling unnecessary interfaces, upstream access control, repaired path canonicalization, and reduced long-term credential retention on appliances break the chain. Incorrect requests may cause denial, an IPS match, or service fault.
      defender_model:
        paragraphs:
        - zh: >-
            防守方可在反向代理、WAF、NDR、服务日志或 appliance 遥测中保存原始请求、规范化路径、来源、请求标识、响应状态和字节量，并在可用时把同一请求关联到服务进程的敏感文件访问。高置信仍需要受害方确认、暴露对象清单或取证恢复，不能在 SIEM 中保存口令内容。TLS 直接终止于封闭设备、日志只保留解码后路径或设备不提供文件审计时，只能依赖网络签名、版本状态和暴露响应进行分级。
          en: >-
            Defenders can retain raw requests, canonical paths, source, request identifier, response status, and byte count in reverse proxies, WAF, NDR, service logs, or appliance telemetry, and join the same request to sensitive file access by the service process where available. High confidence still requires victim confirmation, an exposure inventory, or forensic recovery; password contents must not be stored in the SIEM. When TLS terminates directly on a closed appliance, logs retain only a decoded path, or file audit is unavailable, defenders must grade the event through network signatures, version state, and exposure response.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 服务响应承载秘密而不经过正常凭据读取日志
      en: A service response carries secrets without ordinary credential-read records
    analysis:
      paragraphs:
      - zh: >-
          攻击者让脆弱服务将本应受保护的文件内容作为请求结果读取并返回，因而正常保管库调用、用户解锁或攻击者本地文件打开可以全部缺席。痕迹从“谁读取了哪项凭据”迁到“哪个请求使服务读取并返回了哪个敏感对象”。Fortinet 与 CISA 资料支持这一因果，但服务请求、文件读取和实际材料结果仍须分级，不能由 URI 命中直接推断所有凭据泄露。
        en: >-
          The adversary causes a vulnerable service to read protected file content as a request result and return it, so an ordinary vault call, user unlock, or local file open by the adversary may all be absent. Evidence moves from who read which credential to which request caused a service to read and return which sensitive object. Fortinet and CISA reporting support this causality, while service request, file read, and actual material result still require separate grades; a URI match does not establish that every credential leaked.
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-CISA-ROUTINELY
    - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 既有服务身份承载敏感读取并削弱对远端控制者的归因
      en: An established service identity carries the sensitive read and weakens attribution to the remote controller
    analysis:
      paragraphs:
      - zh: >-
          敏感文件侧看到的是原本就有服务职责的进程，网络侧看到的是该服务的现有协议；恶意控制变量藏在路径解析和对象选择中。单独信任服务签名、端口或成功响应会把攻击行为归于正常组件。原始与规范化路径差、罕见对象、服务敏感读取和异常响应范围可恢复区别，因此本项是来源错位而非完全不可见。
        en: >-
          The sensitive file sees a process already responsible for the service, while the network sees its existing protocol. The malicious control variable resides in path resolution and object selection. Trusting only service signature, port, or a successful response attributes the action to a normal component. Differences between raw and canonical paths, rare objects, sensitive reads by the service, and abnormal response scope recover discrimination, making this a provenance mismatch rather than total invisibility.
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-CISA-ROUTINELY
    confidence: medium
  evidence_keys:
  - TA0006-003-T1212-REF-FORTINET-VULN
  - TA0006-003-T1212-REF-CISA-ROUTINELY
  - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
  defense_keys:
  - TA0006-003-T1212-DET-RESULT-LINEAGE
  - TA0006-003-T1212-NJA-SERVICE-RETURN
  - MIT-000100
  - TA0006-003-T1212-MIT-CREDENTIAL-EXPOSURE
  limitations:
    paragraphs:
    - zh: >-
        CVE-2018-13379 提供强事件证据，但它不能证明所有网络服务的凭据泄露都采用同样路径语法、同样响应形态或同样日志。Fortinet 的 87,000 台设备说明材料被取得，却没有逐设备公开请求、文件访问和具体账户使用的完整谱系；正式内容必须把规模事实与单设备确认标准分开。
      en: >-
        CVE-2018-13379 provides strong incident evidence, but it does not establish the same path syntax, response shape, or logging for every network-service credential disclosure. Fortinet's report of 87,000 devices establishes acquisition of access data but does not publish a complete per-device lineage of request, file access, and specific account use. Formal content must separate the scale fact from the confirmation standard for one device.
- temporary_key: TA0006-003-T1212-CHILD-LOWAUTH
  name:
    zh: 低权上下文越界凭据库读取
    en: Low-Authority Context Credential-Store Over-Read
  summary:
    zh: 攻击者利用错误权限或保护检查，使其低权本地身份或进程直接读取凭据文件或数据库，而不产生正常授权提升或保管库事务。
    en: The adversary exploits faulty permissions or protection checks so a lower-authority local identity or process directly reads a credential file or database without a normal authority grant or vault transaction.
  taxonomy_variable:
    zh: 敏感存储侧实际读取主体是否为原本无权的攻击者控制低权上下文
    en: Whether the subject reading at the sensitive store is an attacker-controlled lower-authority context that should lack access
  counterfactual_trace:
    zh: 正常路径会拒绝低权读取或留下权限授予、提升及获准消费者记录；漏洞状态下可直接成功读取，差异落在权限前态与敏感对象结果之间。
    en: The normal path denies the lower-authority read or records an authority grant, elevation, and permitted consumer; in the vulnerable state, the read succeeds directly and the difference lies between caller pre-state and sensitive-object result.
  definition_and_concept:
    paragraphs:
    - zh: >-
        低权上下文越界凭据库读取是已取得本地非管理员身份、进程或会话的攻击者，利用错误文件权限、数据库保护或等价访问检查，直接读取该上下文本不应访问的凭据承载对象。分类变量是敏感存储侧的实际读取者和其事件时权限前态；本项不以 vCenter、PostgreSQL、Linux、CVE 或“加密凭据”命名。
      en: >-
        Low-Authority Context Credential-Store Over-Read occurs when an adversary controlling a local nonadministrative identity, process, or session exploits incorrect file permission, database protection, or an equivalent access check to read a credential-bearing object that the context should not access. The variable is the actual store-side reader and its event-time authority pre-state. The child is not named for vCenter, PostgreSQL, Linux, a CVE, or encrypted credentials.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        低权上下文越界凭据库读取不需要出现 root/SYSTEM 子进程、角色授予、sudo、解锁提示或正常凭据 API；文件或数据库事件可能表现为低权主体的一次成功读取。若检测只查高权进程或权限提升，它会漏掉缺陷产生的正向访问差。残余证据包括事件时 ACL 与拥有者、精确版本、主体 UID/身份、对象分类、读取字节量、复制或查询输出及后继外传。低权标签本身不能证明恶意，必须证明该读取与正确保护策略不一致。
      en: >-
        Low-Authority Context Credential-Store Over-Read need not create a root or SYSTEM child, role grant, sudo event, unlock prompt, or ordinary credential API call. A file or database event may appear simply as a successful read by a lower-authority subject. Detection limited to privileged processes or elevation misses the positive access difference caused by the flaw. Residual evidence includes event-time ACL and owner, exact version, subject UID or identity, object classification, bytes read, copy or query output, and later egress. A low-authority label is not itself malicious; the read must be shown inconsistent with the correct protection policy.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求攻击者控制的低权上下文直接访问凭据承载对象，并由漏洞使原本应拒绝的读取成功。普通数据库管理员查询、支持包、备份代理、文件权限迁移和取证镜像是反例；只有错误 ACL 而没有读取只支持暴露，只有读取而不知道对象是否含认证材料只支持敏感访问。若先利用漏洞取得 root 再以 root 运行独立转储工具，T1068 与 T1003/T1555 分别记录；本项只在漏洞直接决定低权读取结果时成立。
      en: >-
        Inclusion requires an attacker-controlled lower-authority context to access a credential-bearing object directly, with a vulnerability causing a read that should have been denied to succeed. Ordinary database-administrator queries, support bundles, backup agents, permission migration, and forensic imaging are counterexamples. An incorrect ACL without a read supports exposure only, while a read without evidence that the object contains authentication material supports only sensitive access. If exploitation first obtains root and a separate dumping tool then runs as root, T1068 and T1003 or T1555 record those stages. This child applies only when the vulnerability directly determines the lower-authority read result.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          VMware 公告说明 CVE-2022-22948 源于文件权限不当，具有 vCenter 非管理员访问的恶意主体可取得敏感信息；Mandiant 随后观察 UNC3886 利用该漏洞从 vCenter postgresDB 取得加密凭据以供进一步访问。这一案例同时给出低权前态、脆弱保护和实际凭据结果，但公开报告没有逐条披露命令、文件路径、ACL、数据库查询或解密过程。
        en: >-
          VMware's advisory states that CVE-2022-22948 arose from improper file permissions and allowed a malicious actor with nonadministrative vCenter access to obtain sensitive information. Mandiant later observed UNC3886 exploit it to obtain encrypted credentials from the vCenter postgresDB for further access. The case provides a lower-authority pre-state, vulnerable protection, and an actual credential result, but public reporting does not disclose every command, file path, ACL, database query, or decryption step.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要先有能够接触本地对象或数据库路径的非管理员访问，知道或定位凭据承载对象，并在受影响版本与权限状态下读取和保存结果。它不必先获得 root，但若材料为密文，还需系统持有的解密条件、另一漏洞或离线处理才能转化为可用秘密。正确 ACL、将凭据移出低权可达路径、数据库最小权限、短寿命凭据和及时修补会收窄或消除结果。
          en: >-
            The adversary first needs nonadministrative access able to reach a local object or database path, knowledge or discovery of the credential-bearing object, and the ability to read and retain the result under an affected version and permission state. Root is not a prerequisite. If the material is encrypted, system-held decryption conditions, another flaw, or offline processing may still be needed to obtain a usable secret. Correct ACLs, moving credentials outside lower-authority reach, database least privilege, short-lived credentials, and timely patching narrow or remove the result.
      defender_model:
        paragraphs:
        - zh: >-
            防守方应保存主体 UID/身份、组与角色前态、文件拥有者与 ACL、对象路径或稳定标识、进程谱系、数据库客户端与查询对象、读取结果和输出去向，并把这些信息与事件时版本和补丁状态关联。并非所有系统默认记录成功文件读取，数据库审计也可能只记录查询而不标明结果内容；检测应使用对象敏感级别与受害方验证表示结果，不采集秘密值。合法支持和备份需要绑定确切服务身份、工单、目标和期限。
          en: >-
            Defenders should retain subject UID or identity, group and role pre-state, file owner and ACL, object path or stable identifier, process lineage, database client and queried object, read result, and output destination, then join these with event-time version and patch state. Successful file reads are not logged by default on every system, and database audit may record a query without result contents. Detection should represent outcomes through object sensitivity and victim validation rather than collect secret values. Legitimate support and backup need binding to an exact service identity, work order, target, and expiry.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 错误保护状态允许低权读取而不产生正常授予或提升记录
      en: A faulty protection state permits a lower-authority read without a normal grant or elevation record
    analysis:
      paragraphs:
      - zh: >-
          攻击者在原低权上下文中直接打开或查询凭据承载对象，错误权限使存储层返回数据，却没有对应的角色变更、sudo、保管库授权或高权进程创建。仅监测提升和凭据 API 的系统会遗漏这个转换；保存调用者前态、正确策略、事件时实际 ACL、对象读取和输出能够证明“本应拒绝却成功”的差值。VMware 公告与 UNC3886 调查直接支持该链，但没有证明所有错误权限都被实际利用。
        en: >-
          The adversary opens or queries a credential-bearing object directly from the original lower-authority context. Faulty permissions cause the storage layer to return data without a corresponding role change, sudo event, vault authorization, or privileged process creation. Systems monitoring only elevation and credential APIs miss the transition. Retaining caller pre-state, correct policy, actual event-time ACL, object read, and output establishes the difference between should deny and did succeed. VMware's advisory and the UNC3886 investigation directly support this chain without showing that every faulty permission was exploited.
    evidence_keys:
    - TA0006-003-T1212-REF-VMWARE
    - REF-000179
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 非管理员读取外观削弱按高权主体筛选的恶意判别
      en: A nonadministrative read appearance weakens malicious classification based on privileged subjects
    analysis:
      paragraphs:
      - zh: >-
          错误权限把越界读取呈现为操作系统或数据库已经允许的低权访问，防守规则若把高权令牌、管理员角色或专用转储工具当作必要条件，就会将其视为普通读取。真正差异不在主体标签，而在该主体对目标对象的正确权限应为拒绝。把策略前态、对象敏感性和实际成功结果比较，能够去除低权外观造成的误导。
        en: >-
          Faulty permissions present the over-read as an operating-system or database access already allowed to a lower-authority subject. A defensive rule that requires a privileged token, administrator role, or dedicated dumping tool can classify it as ordinary. The meaningful difference is not the subject label but that correct policy should deny that subject access to the target object. Comparing policy pre-state, object sensitivity, and the actual success result removes the misleading low-authority appearance.
    evidence_keys:
    - TA0006-003-T1212-REF-VMWARE
    - REF-000179
    confidence: medium
  evidence_keys:
  - TA0006-003-T1212-REF-VMWARE
  - REF-000179
  defense_keys:
  - TA0006-003-T1212-DET-RESULT-LINEAGE
  - TA0006-003-T1212-NJA-LOWAUTH-READ
  - MIT-000100
  - TA0006-003-T1212-MIT-CREDENTIAL-EXPOSURE
  limitations:
    paragraphs:
    - zh: >-
        VMware 公告和 Mandiant 事件共同证明一条实际低权读取链，但没有公开完整的文件、数据库与解密遥测，不能从案例推导通用查询签名。取得加密凭据也不等于取得明文或证明每个后继登录；正式检测应把 material-recovered 与 usable-secret-confirmed 分开，并在没有事件时 ACL 快照时降低结论强度。
      en: >-
        VMware's advisory and Mandiant's incident together establish one actual lower-authority read chain but do not publish complete file, database, and decryption telemetry, so a universal query signature cannot be derived from the case. Obtaining encrypted credentials does not equal obtaining plaintext or prove every later sign-in. Formal detection should separate material-recovered from usable-secret-confirmed and lower confidence when an event-time ACL snapshot is unavailable.
defense_candidates:
  detection_strategies:
  - temporary_key: TA0006-003-T1212-DET-RESULT-LINEAGE
    name:
      zh: 漏洞输入—凭据读取结果谱系
      en: Exploit Input to Credential-Read Result Lineage
    summary:
      zh: 把事件时脆弱状态与攻击者输入、敏感对象读取和分级凭据结果关联，区分暴露、尝试、读取能力、材料恢复和后继使用。
      en: Join event-time vulnerable state to attacker input, sensitive-object access, and graded credential results, separating exposure, attempt, read capability, material recovery, and successor use.
    description:
      paragraphs:
      - zh: >-
          本策略只检测漏洞直接造成的凭据读取边界越过。NJA-SERVICE-RETURN 处理远端请求驱动受害服务读取并响应敏感对象的链；NJA-LOWAUTH-READ 处理非管理员主体因错误保护状态直接读取文件或数据库的链。两个分析共享事件时版本和结果分级，但不会用一个通用“CVE 加敏感文件”规则替代不同读取主体、数据字段和误报模型。
        en: >-
          This strategy detects only a vulnerability directly crossing a credential-read boundary. NJA-SERVICE-RETURN covers a remote request causing a victim service to read and return a sensitive object. NJA-LOWAUTH-READ covers a nonadministrative subject directly reading a file or database because of a faulty protection state. The analytics share event-time version and result grading but do not replace different reader identities, data fields, and false-positive models with a generic CVE-plus-sensitive-file rule.
      - zh: >-
          分级输出为 exposure、attempt、read-capability-confirmed、material-recovered 和 successor-use-linked。只有当前漏洞清单时仍为 exposure；请求或读取命中但无敏感结果为 attempt；重复读取或本地调查证明保护绕过为 read-capability-confirmed；受害方或取证证明取得认证材料为 material-recovered；只有独立身份日志与同一材料或轮换范围可关联时才增加 successor-use-linked。任何层级都不得把秘密值写入检测平台。
        en: >-
          Outputs are graded as exposure, attempt, read-capability-confirmed, material-recovered, and successor-use-linked. Current vulnerability inventory alone remains exposure. A matched request or read without a sensitive result is an attempt. Repeatable access or local investigation proving protection bypass is read-capability-confirmed. Victim or forensic proof of authentication material is material-recovered. Successor-use-linked is added only when independent identity telemetry can be associated with the same material or rotation scope. No grade stores secret values in the detection platform.
    detects_keys:
    - TA0006-003-T1212-PARENT
    - TA0006-003-T1212-CHILD-SERVICE
    - TA0006-003-T1212-CHILD-LOWAUTH
    domains:
    - enterprise
    analytic_keys:
    - TA0006-003-T1212-NJA-SERVICE-RETURN
    - TA0006-003-T1212-NJA-LOWAUTH-READ
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-CISA-ROUTINELY
    - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
    - TA0006-003-T1212-REF-VMWARE
    - REF-000179
    - REF-000605
  detection_analytics:
  - temporary_key: TA0006-003-T1212-NJA-SERVICE-RETURN
    strategy_key: TA0006-003-T1212-DET-RESULT-LINEAGE
    name:
      zh: 异常服务请求—敏感对象读取—响应结果关联
      en: Anomalous Service Request to Sensitive-Object Read and Response Correlation
    summary:
      zh: 将远端请求的原始与规范化形态、事件时脆弱版本、服务敏感读取和响应范围连接为分级凭据泄露结果。
      en: Join raw and canonical forms of a remote request, event-time vulnerable version, sensitive read by the service, and response scope into a graded credential-disclosure result.
    domains:
    - enterprise
    platforms:
    - Network Devices
    - Linux
    - Windows
    logic:
      paragraphs:
      - zh: >-
          先用事件时资产快照确认目标服务的精确产品、版本、运行映像、补丁与外部可达性。按 request_id、源目标和五分钟窗口，把 WAF、NDR 或服务日志中的利用签名、异常编码、目录穿越、规范化前后路径差或罕见资源请求，与服务进程对登记敏感对象的成功读取及响应状态、字节量连接。只见脆弱版本输出 exposure；只见请求输出 attempt；请求与敏感读取或可重复对象返回输出 read-capability-confirmed；只有取证、受害方确认或暴露清单证明认证材料时输出 material-recovered。后继登录是独立加权信号，不用来填补缺失的读取结果。
        en: >-
          First use an event-time asset snapshot to confirm exact product, version, running image, patch, and external reachability for the target service. By request identifier, source and destination, and a five-minute window, join an exploit signature, anomalous encoding, traversal, raw-to-canonical path difference, or rare resource request in WAF, NDR, or service telemetry to a successful read of an inventoried sensitive object by the service process and the response status and byte count. A vulnerable version alone emits exposure. A request alone emits attempt. A request with a sensitive read or repeatable object return emits read-capability-confirmed. Material-recovered requires forensics, victim confirmation, or an exposure inventory proving authentication material. Later sign-ins are separate weighted evidence and do not fill a missing read result.
      - zh: >-
          规则不能采集响应中的秘密正文；只保留对象分类、稳定对象标识、响应大小、受害方验证状态和轮换批次。若设备没有逐文件日志，可用精确利用签名加脆弱版本形成 attempt，并由独立取证升级。对批准扫描、厂商健康检查、支持包和配置备份按来源、工单、目标与到期时间降权，仍保留原始请求以便发现范围漂移。
        en: >-
          The rule must not collect secret response content. Retain only object class, stable object identifier, response size, victim-validation state, and rotation batch. When the appliance lacks per-file telemetry, an exact exploit signature plus vulnerable version can establish attempt and independent forensics can upgrade it. Down-weight approved scanning, vendor health checks, support bundles, and configuration backup by source, work order, target, and expiry, while retaining raw requests to detect scope drift.
    data_requirements:
    - source_type: service-request-response
      name:
        zh: 服务请求与响应元数据
        en: Service Request and Response Metadata
      channel: null
      required_fields:
      - event.timestamp
      - device.id
      - src.ip
      - dst.ip
      - service.name
      - request.id
      - request.method
      - request.raw_path
      - request.canonical_path
      - response.status
      - response.bytes
    - source_type: service-sensitive-object-access
      name:
        zh: 服务进程敏感对象访问
        en: Service Process Sensitive-Object Access
      channel: configured EDR file audit or appliance audit
      required_fields:
      - event.timestamp
      - device.id
      - process.id
      - process.image
      - process.user_id
      - object.id
      - object.path
      - object.sensitivity
      - operation
      - result
    - source_type: vulnerability-state-history
      name:
        zh: 软件版本、补丁与可达性历史
        en: Software Version Patch and Reachability History
      channel: CMDB and retained vulnerability snapshots
      required_fields:
      - device.id
      - product.name
      - product.version
      - component.hash
      - cve.id
      - patch.id
      - state.valid_from
      - state.valid_to
      - interface.reachable_from
    - source_type: credential-exposure-investigation
      name:
        zh: 凭据暴露调查与轮换记录
        en: Credential Exposure Investigation and Rotation Record
      channel: incident-response case system
      required_fields:
      - case.id
      - device.id
      - object.id
      - material.type
      - material.recovery_status
      - affected_identity_set_id
      - validation.timestamp
      - rotation.batch_id
    observables:
    - zh: 原始与规范化路径显著不同，或请求命中精确脆弱资源访问形态。
      en: Raw and canonical paths differ materially or the request matches an exact vulnerable resource-access form.
    - zh: 同一请求附近，服务进程读取登记的凭据承载对象并返回异常范围的成功响应。
      en: Near the same request, the service process reads an inventoried credential-bearing object and returns a successful response of abnormal scope.
    - zh: 取证或受害方暴露清单确认材料类别与受影响身份集合，而不记录秘密值。
      en: Forensics or a victim exposure inventory confirms material class and affected identity set without recording secret values.
    correlation:
      window:
        zh: 请求前后五分钟连接服务读取与响应；暴露确认和身份使用在独立案件窗内关联，不回填请求级结果。
        en: Join service read and response within five minutes around the request; associate exposure confirmation and identity use in a separate case window without backfilling the request-level result.
      dimensions:
      - device.id
      - service.name
      - request.id
      - src.ip
      - dst.ip
      - process.id
      - object.id
      - cve.id
      - case.id
    false_positives:
    - zh: 获批漏洞扫描、厂商支持、配置导出、备份和诊断下载可能产生异常路径、较大响应或敏感读取，应核对确切工单、服务身份、对象和目的地。
      en: Approved vulnerability scanning, vendor support, configuration export, backup, and diagnostic download can produce unusual paths, large responses, or sensitive reads; check exact work order, service identity, object, and destination.
    blind_spots:
    - zh: TLS 直接终止在封闭 appliance、路径在日志前被改写、设备不提供文件访问或响应字节、以及事件时版本历史缺失时，只能形成较低置信度的尝试线索。
      en: TLS terminating directly on a closed appliance, path rewriting before logging, absent file-access or response-byte telemetry, and missing event-time version history leave only lower-confidence attempt leads.
    - zh: 响应成功和字节量不证明内容为凭据，秘密正文又不应进入 SIEM；material-recovered 依赖受控取证或受害方确认。
      en: Response success and byte count do not prove credential content, while secret content must not enter the SIEM; material-recovered depends on controlled forensics or victim confirmation.
    tuning_guidance:
      paragraphs:
      - zh: >-
          为每项对外服务保存允许资源与响应大小基线、已批准扫描源、支持窗口和敏感对象清单。使用 raw_path 与 canonical_path 的差分而不是只匹配一个编码串，对 exact vulnerable build 提高优先级但不把补丁状态当成功证据。例外必须绑定来源、工单、对象范围和到期时间；不得永久白名单服务进程或整个管理网段。
        en: >-
          Maintain allowed resources and response-size baselines, approved scanner sources, support windows, and sensitive-object inventory for each exposed service. Compare raw and canonical paths rather than match one encoded string. Raise priority for an exact vulnerable build without treating patch state as success evidence. Exceptions bind source, work order, object scope, and expiry; never permanently allowlist the service process or an entire management network.
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-CISA-ROUTINELY
    - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
    - REF-000605
  - temporary_key: TA0006-003-T1212-NJA-LOWAUTH-READ
    strategy_key: TA0006-003-T1212-DET-RESULT-LINEAGE
    name:
      zh: 低权前态—凭据库成功读取差分
      en: Lower-Authority Pre-State to Successful Credential-Store Read Differential
    summary:
      zh: 比较主体事件时权限与正确保护策略，将本应拒绝却成功的凭据文件或数据库读取关联到精确脆弱状态和结果。
      en: Compare event-time subject authority with correct protection policy and join a credential file or database read that should have been denied to the exact vulnerable state and result.
    domains:
    - enterprise
    platforms:
    - Linux
    - Windows
    - macOS
    logic:
      paragraphs:
      - zh: >-
          为登记的凭据文件、数据库和敏感表保存正确 owner、ACL、允许主体、对象类别与策略版本；按事件时间恢复读取主体的 UID、组、角色、会话和进程谱系，并与实际 ACL、产品版本和补丁快照比较。当不在允许集合且无授权变更的低权主体成功读取、复制或查询目标对象时输出 attempt；若本地复核证明错误保护使同一主体可重复取得对象，输出 read-capability-confirmed；只有取证或受害方确认取得认证材料时输出 material-recovered。当前 ACL 或当前补丁状态若无法还原事件时状态，只能降低为 exposure 或 unresolved。
        en: >-
          For inventoried credential files, databases, and sensitive tables, retain correct owner, ACL, allowed subjects, object class, and policy version. Reconstruct the reader's UID, groups, roles, session, and process lineage at event time, then compare them with actual ACL, product version, and patch snapshot. Emit attempt when a lower-authority subject outside the allowed set and without an authorization change successfully reads, copies, or queries the target object. Emit read-capability-confirmed when local review shows the faulty protection let the same subject obtain the object repeatably. Emit material-recovered only when forensics or the victim confirms authentication material. If current ACL or patch state cannot reconstruct the event-time state, downgrade to exposure or unresolved.
      - zh: >-
          输出文件、归档或网络传输用于提高优先级而不是证明解密；加密凭据保持 material-recovered-encrypted，直到另有可用秘密证据。支持、备份、升级和取证主体按精确二进制、服务账户、工单、对象范围、目的地和期限降权。规则不能把所有非管理员读取标为恶意，也不能通过生产重放漏洞验证。
        en: >-
          Output files, archives, or network transfer raise priority rather than prove decryption. Encrypted credentials remain material-recovered-encrypted until separate evidence establishes a usable secret. Support, backup, upgrade, and forensic subjects are down-weighted by exact binary, service account, work order, object scope, destination, and expiry. The rule must not label every nonadministrative read malicious or replay the exploit in production for validation.
    data_requirements:
    - source_type: identity-authority-history
      name:
        zh: 主体权限与授权变更历史
        en: Subject Authority and Authorization Change History
      channel: identity and host policy telemetry
      required_fields:
      - event.timestamp
      - device.id
      - principal.id
      - session.id
      - user.uid
      - group.ids
      - role.ids
      - authorization.change_id
      - state.valid_from
      - state.valid_to
    - source_type: sensitive-file-database-access
      name:
        zh: 敏感文件与数据库读取审计
        en: Sensitive File and Database Read Audit
      channel: configured OS file audit or database audit
      required_fields:
      - event.timestamp
      - device.id
      - principal.id
      - process.id
      - process.image
      - object.id
      - object.path_or_relation
      - object.sensitivity
      - operation
      - bytes_read
      - result
    - source_type: protection-policy-history
      name:
        zh: 对象正确策略与实际 ACL 历史
        en: Correct Object Policy and Actual ACL History
      channel: configuration and integrity management
      required_fields:
      - object.id
      - object.owner
      - policy.version
      - allowed_principal_ids
      - actual.acl
      - state.valid_from
      - state.valid_to
    - source_type: vulnerability-state-history
      name:
        zh: 软件版本与补丁历史
        en: Software Version and Patch History
      channel: CMDB and retained vulnerability snapshots
      required_fields:
      - device.id
      - product.name
      - product.version
      - cve.id
      - patch.id
      - state.valid_from
      - state.valid_to
    - source_type: output-and-investigation
      name:
        zh: 输出、外传与凭据暴露调查
        en: Output Egress and Credential Exposure Investigation
      channel: EDR network telemetry and incident-response case system
      required_fields:
      - event.timestamp
      - device.id
      - process.id
      - output.object_id
      - destination.id
      - case.id
      - material.type
      - material.recovery_status
      - affected_identity_set_id
    observables:
    - zh: 事件时低权主体无授权变更，却成功读取正确策略应拒绝的凭据承载对象。
      en: At event time a lower-authority subject without an authorization change successfully reads a credential-bearing object that correct policy should deny.
    - zh: 实际 ACL 或组件版本与正确策略存在可定位差异，且读取之后出现相关输出、复制或外传。
      en: Actual ACL or component version differs from correct policy in an identifiable way and related output, copy, or egress follows the read.
    - zh: 受控调查确认所得为加密或明文认证材料，并保持可用性结论分层。
      en: Controlled investigation confirms encrypted or plaintext authentication material while keeping usability as a separate grade.
    correlation:
      window:
        zh: 在敏感读取前后三十分钟关联主体前态、策略差、版本状态和输出；后继解密或身份使用进入独立案件窗。
        en: Join subject pre-state, policy difference, version state, and output within thirty minutes around the sensitive read; later decryption or identity use belongs to a separate case window.
      dimensions:
      - device.id
      - principal.id
      - session.id
      - process.id
      - object.id
      - policy.version
      - cve.id
      - case.id
    false_positives:
    - zh: 备份、支持收集、升级、数据库维护、权限迁移和取证可能由低权入口触发敏感读取，应验证实际服务身份、受控提权、工单、对象集合和输出目的地。
      en: Backup, support collection, upgrade, database maintenance, permission migration, and forensics can initiate sensitive reads from a lower-authority entry; verify actual service identity, controlled elevation, work order, object set, and output destination.
    blind_spots:
    - zh: 未预先启用成功文件读取或数据库审计、缺少事件时 ACL 与组成员历史、应用内部读取不暴露对象标识，以及攻击者已获得高权后篡改本机日志都会削弱差分。
      en: The differential weakens when successful file-read or database audit was not enabled, event-time ACL and group history are missing, application-internal reads expose no object identifier, or an adversary gained higher authority and altered local logs.
    - zh: 文件或表读取不能证明具体字段被返回，加密材料也不能证明解锁成功；这些结果需要受控调查而非日志内容采集。
      en: A file or table read does not prove which fields were returned, and encrypted material does not prove successful unlock; controlled investigation rather than log-content collection is required.
    tuning_guidance:
      paragraphs:
      - zh: >-
          按对象而不是目录根维护敏感清单，为每个对象保存允许主体与正确策略。只对精确服务身份加任务 ID 加时间窗加目的地的组合降权，保留新进程、交互式会话、计划外读取和未记录的 ACL 偏差。周期性用非破坏 canary 验证低权主体仍被拒绝，并确认传感器确实记录成功与失败，不在生产运行 exploit。
        en: >-
          Maintain sensitive inventory by object rather than directory root, with allowed subjects and correct policy for each object. Down-weight only an exact service identity plus job identifier plus time window plus destination, retaining new processes, interactive sessions, unscheduled reads, and undocumented ACL differences. Periodically use a nondestructive canary to verify lower-authority denial and that sensors record successes and failures; do not run an exploit in production.
    evidence_keys:
    - TA0006-003-T1212-REF-VMWARE
    - REF-000179
    - REF-000605
  mitigations:
  - existing_ref: MIT-000100
    resolution: extend
    name:
      zh: 脆弱转换与组件信任治理
      en: Vulnerable-Transition and Component-Trust Governance
    applications:
    - target_key: TA0006-003-T1212-PARENT
      use:
        paragraphs:
        - zh: >-
            对脆弱凭据读取边界利用，按事件时间清点所有可触达且能读取凭据承载对象的服务、组件和本地路径，绑定精确版本、补丁、运行身份、接口、敏感对象与允许调用者；快速修补或移除脆弱版本，无法更新时关闭外部接口、隔离管理面、收紧服务身份与文件/数据库 ACL。远程保留 caller pre-state、请求、组件、保护状态、敏感读取和首个材料结果；确认暴露后停止接口、轮换受影响秘密并验证原低权路径恢复为拒绝。
          en: >-
            For Vulnerable Credential-Read Boundary Exploitation, inventory every reachable service, component, and local path able to read credential-bearing objects at event time, binding exact version, patch, runtime identity, interface, sensitive objects, and allowed callers. Patch or retire vulnerable versions quickly. When updates are unavailable, close external interfaces, isolate the management plane, and tighten service identity and file or database ACLs. Remotely retain caller pre-state, request, component, protection state, sensitive read, and first material result. After confirmed exposure, stop the interface, rotate affected secrets, and verify that the original lower-authority path is denied again.
      expected_effect:
        paragraphs:
        - zh: >-
            修补与可达面收缩移除漏洞前提，最小权限和对象 ACL 减少一次成功利用可返回的材料，谱系留存把缺失正常授权事务的结果重新连接到攻击者输入。攻击者必须额外绕过版本治理、接口限制和独立记录；暴露、尝试、读取能力与材料结果也不再由单一 CVE 或文件读取直接下结论。
          en: >-
            Patching and reachability reduction remove exploit prerequisites. Least privilege and object ACLs reduce material available to one successful exploit. Lineage retention reconnects a result lacking a normal authorization transaction to attacker input. The adversary must additionally defeat version governance, interface restrictions, and independent records, while exposure, attempt, read capability, and material result are no longer concluded from a single CVE or file read.
      limitations:
        paragraphs:
        - zh: >-
            零日和停服困难的 appliance 可能无法及时修补，封闭设备可能不提供文件访问遥测，接口隔离与降权也可能影响远程接入和运维。补丁只能阻止后续利用，不能撤回已泄露材料；缺少事件时状态或宿主证据已受损时，需要网络侧、控制面和离线调查，且不得用生产 exploit 证明恢复。
          en: >-
            Zero-days and appliances that are difficult to take offline may not be patched promptly. Closed devices may lack file-access telemetry, while interface isolation and reduced authority can disrupt remote access and operations. A patch prevents later exploitation but cannot retract exposed material. Missing event-time state or compromised host evidence requires network-side, control-plane, and offline investigation, and a production exploit must not be used to prove recovery.
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
    - TA0006-003-T1212-REF-VMWARE
    - REF-000179
  - temporary_key: TA0006-003-T1212-MIT-CREDENTIAL-EXPOSURE
    resolution: create
    name:
      zh: 脆弱服务凭据最小化与暴露响应
      en: Vulnerable-Service Credential Minimization and Exposure Response
    summary:
      zh: 减少服务和管理平台可读取的长期认证材料，固化正确对象权限，并在漏洞读取证实时按暴露范围轮换和撤销。
      en: Reduce long-lived authentication material readable by services and management platforms, enforce correct object permissions, and rotate or revoke by exposure scope after a vulnerable read is confirmed.
    description:
      paragraphs:
      - zh: >-
          本缓解处理“修补以后仍需处置已经暴露的凭据”以及“服务本不应长期持有什么材料”两个问题。组织应把 VPN、身份和管理平台中的凭据承载对象映射到业务身份，减少明文、可逆口令、长期会话和广域管理凭据的驻留，用独立秘密服务或设备绑定保护必须保留的材料；同时用对象级 ACL 与非破坏 canary 验证服务身份和低权主体只能访问必要集合。漏洞读取得到确认后，应保存证据、停用脆弱入口、按对象与身份集合轮换口令和密钥、撤销令牌与会话，并追查暴露窗口内的后继使用。
        en: >-
          This mitigation addresses both credentials that remain exposed after patching and material a service should not retain long term. Map credential-bearing objects in VPN, identity, and management platforms to business identities, minimize resident plaintext, reversible passwords, long-lived sessions, and broadly privileged management credentials, and protect required material through an independent secret service or device binding. Enforce object-level ACLs and use nondestructive canaries to verify that service identities and lower-authority subjects reach only necessary sets. After confirming a vulnerable read, preserve evidence, disable the vulnerable entry, rotate passwords and keys by object and affected identity set, revoke tokens and sessions, and investigate successor use during the exposure window.
    domains:
    - enterprise
    measures:
    - key: credential-bearing-object-inventory-and-minimization
      name:
        zh: 凭据承载对象清单与材料最小化
        en: Credential-Bearing Object Inventory and Material Minimization
      description:
        paragraphs:
        - zh: >-
            为服务、appliance、管理数据库和本地文件登记对象标识、材料类型、关联身份、存储期限、运行时读取者和轮换负责人；移除不再需要的明文、可逆或长期材料，优先使用短寿命、最小范围和设备绑定的认证材料。
          en: >-
            Register object identifier, material type, related identities, retention, runtime readers, and rotation owner for services, appliances, management databases, and local files. Remove unnecessary plaintext, reversible, or long-lived material and prefer short-lived, narrowly scoped, device-bound authentication material.
      control_type: exposure-reduction
    - key: object-policy-and-reader-canary
      name:
        zh: 对象权限策略与读取 canary
        en: Object Permission Policy and Read Canary
      description:
        paragraphs:
        - zh: >-
            对每个凭据承载对象定义正确 owner、ACL、服务身份和允许调用者，阻止 Web/VPN 服务读取无业务需要的系统文件，阻止低权主体直接读取管理数据库；版本化保存策略，并用不含真实秘密的 canary 周期性验证未授权路径仍被拒绝和审计有效。
          en: >-
            Define correct owner, ACL, service identity, and allowed callers for each credential-bearing object. Prevent web or VPN services from reading system files outside business need and lower-authority subjects from reading management databases directly. Version the policy and periodically use a canary containing no real secret to verify unauthorized paths remain denied and audit remains effective.
      control_type: preventive
    - key: exposure-scoped-rotation-and-session-revocation
      name:
        zh: 按暴露范围轮换与会话撤销
        en: Exposure-Scoped Rotation and Session Revocation
      description:
        paragraphs:
        - zh: >-
            确认漏洞读取后，根据对象版本、暴露窗口、关联身份和材料类别建立轮换批次，重置口令、替换密钥或证书、撤销令牌与会话并审查后继登录；补丁完成不能替代凭据处置，密文材料则按解锁可能性与权限价值确定优先级。
          en: >-
            After a vulnerable read is confirmed, create rotation batches from object version, exposure window, related identities, and material class. Reset passwords, replace keys or certificates, revoke tokens and sessions, and review later sign-ins. Completed patching does not replace credential response, while encrypted material is prioritized by unlock feasibility and authority value.
      control_type: containment
    applications:
    - target_key: TA0006-003-T1212-PARENT
      use:
        paragraphs:
        - zh: >-
            将所有可能由脆弱组件返回的凭据对象纳入清单，缩短长期材料驻留，并在 read-capability-confirmed 时保全证据和限制入口，在 material-recovered 时按身份集合执行轮换、撤销和后继使用调查。
          en: >-
            Inventory every credential object a vulnerable component could return, shorten long-lived material residency, preserve evidence and constrain the entry at read-capability-confirmed, and perform identity-set rotation, revocation, and successor-use investigation at material-recovered.
      expected_effect:
        paragraphs:
        - zh: >-
            即使漏洞被成功触发，可取得的材料数量、权限和有效期也会下降；对象级映射让响应从整域重置收敛到可解释范围，并使缺失正常凭据审计的读取仍可通过 canary 与轮换记录调查。
          en: >-
            Even after successful exploitation, available material count, authority, and lifetime are reduced. Object-level mapping narrows response from domain-wide resets to an explainable scope and makes a read lacking ordinary credential audit investigable through canary and rotation records.
      limitations:
        paragraphs:
        - zh: >-
            老旧 appliance 可能必须保存本地材料，设备绑定或短寿命机制未必受支持，轮换大量服务身份也会造成停机。未知的对象内容和暴露窗口会迫使扩大响应范围；最小化降低后果但不阻止漏洞触发。
          en: >-
            Legacy appliances may require local material and may not support device binding or short-lived mechanisms, while rotating many service identities can cause outages. Unknown object contents and exposure windows force a broader response. Minimization reduces impact but does not prevent exploitation.
    - target_key: TA0006-003-T1212-CHILD-SERVICE
      use:
        paragraphs:
        - zh: >-
            限制面向网络服务的运行身份只能读取业务必要文件，把会话与凭据材料移出可由静态资源处理器或支持下载路径访问的位置，并验证原始与规范化路径均不能取回 canary；出现材料响应后立即轮换对应 VPN 或管理身份并撤销会话。
          en: >-
            Restrict the network-facing service identity to business-required files, move session and credential material beyond static-resource handlers or support-download paths, and verify that neither raw nor canonical paths can retrieve the canary. After a material response, immediately rotate related VPN or management identities and revoke sessions.
      expected_effect:
        paragraphs:
        - zh: >-
            受害服务即使处理恶意请求也缺少读取高价值凭据对象的权限，路径修复与 canary 同时降低成功率并提供非破坏验证；暴露后的凭据有效窗口被缩短。
          en: >-
            Even when processing a malicious request, the victim service lacks authority to read high-value credential objects. Path repair and a canary reduce success and provide nondestructive validation, while post-exposure credential lifetime is shortened.
      limitations:
        paragraphs:
        - zh: >-
            一些一体化 appliance 把 Web、认证和配置功能置于同一高权进程，无法彻底分离文件权限；上游 WAF 也可能与设备路径解码不同。必须升级受影响版本，且不能用 canary 通过代替历史暴露调查。
          en: >-
            Some integrated appliances place web, authentication, and configuration functions in one privileged process and cannot fully separate file authority. An upstream WAF may decode paths differently from the device. Affected versions still require upgrade, and a passing canary does not replace historical exposure investigation.
    - target_key: TA0006-003-T1212-CHILD-LOWAUTH
      use:
        paragraphs:
        - zh: >-
            将管理数据库和凭据文件的正确 owner、ACL、数据库角色与允许进程固化为策略，移除低权读取和继承权限，在升级后以不含真实秘密的对象验证原主体被拒绝；已发生读取时识别数据库所含身份和密钥并按可解锁性轮换。
          en: >-
            Encode correct owner, ACL, database roles, and allowed processes for management databases and credential files, remove lower-authority reads and inherited permissions, and after upgrade verify the original subject is denied using an object containing no real secret. When a read occurred, identify identities and keys represented in the database and rotate according to unlock feasibility.
      expected_effect:
        paragraphs:
        - zh: >-
            错误保护状态被纠正，低权主体无法直接读取；版本化策略和 canary 让配置漂移可见，材料轮换限制已复制密文或明文的后续价值。
          en: >-
            Faulty protection is corrected and lower-authority subjects cannot read directly. Versioned policy and canaries expose drift, while rotation limits the later value of copied encrypted or plaintext material.
      limitations:
        paragraphs:
        - zh: >-
            应用升级可能重新创建文件或恢复默认 ACL，数据库维护和支持账户需要受控例外；加密材料的真实可用性可能未知。仅修正当前权限不能确定历史上谁读取过对象，必须依赖保留日志和调查。
          en: >-
            Application upgrades may recreate files or restore default ACLs, while database maintenance and support accounts require controlled exceptions. Actual usability of encrypted material may remain unknown. Correcting current permissions cannot determine who read the object historically and requires retained telemetry and investigation.
    evidence_keys:
    - TA0006-003-T1212-REF-FORTINET-VULN
    - TA0006-003-T1212-REF-CISA-ROUTINELY
    - TA0006-003-T1212-REF-FORTINET-DISCLOSURE
    - TA0006-003-T1212-REF-VMWARE
    - REF-000179
