  claims:
    - temporary_key: TA0006-003-T1606-CLM-STAGES
      resolution: create
      proposition_zh: Web 认证材料构造、依赖方接受、会话建立和后继资源使用是不同证据阶段，任一阶段不能自动证明其余阶段。
      proposition_en: Web authentication material construction, relying-party acceptance, session creation, and downstream resource use are distinct evidentiary stages, and no one stage automatically proves the others.
      evidence_keys:
        - TA0006-003-T1606-REF-ATTACK
        - TA0006-003-T1606-REF-MANDIANT-DPAPI-SAML
        - TA0006-003-T1606-REF-ZIMBRA-PREAUTH
    - temporary_key: TA0006-003-T1606-CLM-OFFCHAIN
      resolution: create
      proposition_zh: 活动受信 signer 可在身份权威正常签发链之外生成被依赖方接受的 SAML 断言，使依赖方成功记录缺少对应 IdP 认证和签发事务。
      proposition_en: An active trusted signer can create a SAML assertion outside the identity authority's normal issuance chain that a relying party accepts, leaving acceptance without the corresponding IdP authentication and issuance transaction.
      evidence_keys:
        - REF-000304
        - TA0006-003-T1606-REF-MANDIANT-DPAPI-SAML
        - TA0006-003-T1606-REF-MICROSOFT-ADFS-AUDIT
    - temporary_key: TA0006-003-T1606-CLM-CONSTRAINTS
      resolution: create
      proposition_zh: 可信签名不足以独立证明合法来源，依赖方还应校验 Recipient、Audience、时限、请求绑定和重放状态，并将接受事件回连签发事务。
      proposition_en: A trusted signature alone does not establish legitimate origin; relying parties should also validate Recipient, Audience, lifetime, request binding, and replay state and join acceptance to issuance.
      evidence_keys:
        - TA0006-003-T1606-REF-OASIS-SAML-PROFILE
        - TA0006-003-T1606-REF-MANDIANT-DPAPI-SAML
    - temporary_key: TA0006-003-T1606-CLM-AUXSTATE
      resolution: create
      proposition_zh: 泄露的应用集成秘密可使攻击者在真实主认证之后计算被本地应用接受的 MFA 辅状态，而外部 MFA 权威没有对应认证事件。
      proposition_en: A compromised application-integration secret can let an adversary compute locally accepted MFA auxiliary state after genuine primary authentication while the external MFA authority has no corresponding authentication event.
      evidence_keys:
        - REF-000509
    - temporary_key: TA0006-003-T1606-CLM-API-BOUNDARY
      resolution: create
      proposition_zh: 调用 AWS STS 等权威 API 后由平台签发的新临时凭据具有正式请求与响应链，不应仅因材料为新生成而归入权威外伪造。
      proposition_en: New temporary credentials issued by an authoritative platform after an AWS STS or equivalent API call have an official request and response chain and are not off-authority forgery merely because they are newly generated.
      evidence_keys:
        - TA0006-003-T1606-REF-AWS-STS
  cases:
    - temporary_key: TA0006-003-T1606-CASE-SOLORIGATE-SIGNER
      resolution: split-from-CASE-000111
      event: Microsoft observed the Solorigate chain obtain AD FS signing capability through certificate theft or federation trust and create SAML tokens for chosen identities that were accepted for cloud access
      evidence_keys:
        - REF-000304
      limit: Existing CASE-000111 centers trust-state mutation; this case would center material construction and must not imply every victim used both paths or expose unpublished assertion details
    - temporary_key: TA0006-003-T1606-CASE-DARKHALO-DUO
      resolution: create
      event: Dark Halo used normal OWA username and password authentication plus a duo-sid value computed from the compromised Duo integration secret; Duo recorded no authentication attempt and OWA accepted the session
      evidence_keys:
        - REF-000509
      limit: Legacy Duo and OWA integration; do not generalize akey or duo-sid fields to current SDK deployments
  detection_strategies:
    - temporary_key: TA0006-003-T1606-DET-ISSUANCE
      resolution: create
      distinction: Cross-plane authority issuance to relying-party acceptance, with key exposure and trust mutation retained as precursor tiers rather than proof of construction
    - temporary_key: TA0006-003-T1606-DET-COMPOSED
      resolution: create
      distinction: Authentication-step completeness across application primary auth, MFA provider transaction, callback state or code exchange, and final session
  detection_analytics:
    - temporary_key: TA0006-003-T1606-NJA-ISSUANCE-GAP
      resolution: create
      distinction: Exact assertion/request/session linkage and explicit telemetry-gap state; does not reuse authentication-state mutation analytic NJA-000052
    - temporary_key: TA0006-003-T1606-NJA-SIGNER-LINEAGE
      resolution: create
      distinction: Tiered key or trust capability exposure joined to later accepted material and issuance absence without equating a file access with forged-token success
    - temporary_key: TA0006-003-T1606-NJA-COMPOSED-GAP
      resolution: create
      distinction: Per-session required-step state machine distinguishing forged auxiliary completion from replay, fail-open, remembered device, and policy bypass
  mitigations:
    - temporary_key: TA0006-003-T1606-MIT-VERIFIER
      resolution: create
      distinction: Strict web-proof constraints, cross-plane issuance lineage, per-session auxiliary-state binding, and relying-party denial verification; complements rather than duplicates MIT-000073 signing-key and trust governance
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
      - T1606.001
      - T1606.002
    represented_dimensions:
      - zh: Web Cookie、自包含会话值、预认证证明与应用本地校验实现
        en: Web cookies, self-contained session values, preauthentication proofs, and application-local validation implementations
      - zh: SAML 联合断言、签名证书、声明与依赖方信任实现
        en: SAML federation assertions, signing certificates, claims, and relying-party trust implementations
    breadth_trigger: ordinary
    coverage_resolutions:
      - attack_id: T1606.001
        resolution: niji-variable-candidate
        mapped_keys:
          - TA0006-003-T1606-CHILD-OFFCHAIN
          - TA0006-003-T1606-CHILD-AUXSTATE
        note_zh: Cookie 既可承载完整链外签名证明，也可只承载组合认证的辅状态；媒介名称不能成为 Niji 边界。
        note_en: A cookie can carry a complete off-chain signed proof or only auxiliary state in composed authentication, so the medium name is not a Niji boundary.
      - attack_id: T1606.002
        resolution: niji-variable-candidate
        mapped_keys:
          - TA0006-003-T1606-CHILD-OFFCHAIN
        note_zh: SAML 提供 signer、issuer、claim 与受众/时间约束的实现证据，正式子项按签发来源差分而不是协议命名。
        note_en: SAML provides implementation evidence for signer, issuer, claims, and audience or time constraints; the formal child is partitioned by issuance-source differential rather than protocol name.
    candidate_stealth_axes_examined:
      - axis: signing_authority_and_issuance_origin
        disposition: formal
        why_zh: 攻击者可控 signer 与构造位置，前后痕迹从 IdP 认证加签发加接受变为仅接受及密钥/信任残余，需要跨平面检测与密钥治理。
        why_en: The adversary controls signer and construction location; traces change from IdP authentication plus issuance plus acceptance to acceptance with key or trust residuals, requiring cross-plane detection and key governance.
      - axis: composed_authentication_auxiliary_state
        disposition: formal
        why_zh: 真实主认证与伪造辅状态产生不同于完整链外铸造的步骤缺口，检测需 MFA 事务状态机，缓解需每会话 state 和授权码交换。
        why_en: Genuine primary authentication plus forged auxiliary state creates a step gap distinct from full off-chain minting, requiring an MFA transaction state machine and per-session state or authorization-code exchange.
      - axis: identity_privilege_claim_shaping
        disposition: folded-into-offchain-child
        why_zh: 现有资料证明攻击者可选择身份与声明，但没有公开事件把声明取值选择独立证明为稳定匿迹变量；其最强防守价值仍是发行差分和目录/角色一致性。
        why_en: Sources establish that an adversary can choose identities and claims but do not independently prove claim-value selection as a stable stealth variable; its strongest defense remains issuance differential and directory or role consistency.
      - axis: audience_recipient_request_time_binding
        disposition: parent-core
        why_zh: 这些字段是材料可被接受的协议约束和检测维度；满足约束本身不证明独立匿迹意图，故写入验证器分析与缓解而不拆子项。
        why_en: These fields are protocol acceptance constraints and detection dimensions. Satisfying them does not by itself prove an independent stealth intent, so they remain in verifier analytics and mitigation rather than a child.
      - axis: stolen_signer_versus_added_signer
        disposition: adjacent-technique
        why_zh: 这是签名权取得或联合信任修改方式，由 T1649、T1556、NJT-0093/NJT-0100 等对象拥有；本技术从新材料构造开始。
        why_en: This is acquisition of signing authority or federation-trust mutation owned by T1649, T1556, NJT-0093, NJT-0100, or related objects; this technique begins with new-material construction.
      - axis: authoritative_broker_api_issuance
        disposition: rejected
        why_zh: AWS STS 等服务实际执行签发并记录请求与响应，不是权威外伪造；应按 API 权限滥用、临时权限或令牌获取处理。
        why_en: Services such as AWS STS perform authoritative issuance and record the request and response, so the behavior is not off-authority forgery and belongs to API authority abuse, temporary privilege, or token acquisition.
      - axis: server_side_session_store_insertion
        disposition: evidence-deferred
        why_zh: 理论上直接写会话存储可构造匹配 Cookie，但本批未找到足以固定攻击者控制、接受结果和独立防御的第一方事件证据。
        why_en: Direct session-store writes can theoretically construct a matching cookie, but this batch found no first-party event evidence sufficient to establish attacker control, acceptance, and distinct defense.
      - axis: delayed_or_context_aligned_use
        disposition: adjacent-technique
        why_zh: 构造后延迟、来源或设备拟态改变的是材料使用和入口情境，归 Valid Accounts、NJT-0061 或会话风险对象，不改变构造技术身份。
        why_en: Delayed use and origin or device mimicry change material use and entry context and belong to Valid Accounts, NJT-0061, or session-risk objects rather than changing construction identity.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        两个 Niji 子项不是 T1606.001/.002 的翻译：Web Cookie 可落入完整链外证明或组合辅状态，SAML 只为前者提供强实现证据。声明与受众/时间轴经过独立测试后收敛为子项内部约束，因为当前一手资料不能证明其独立匿迹意图与兄弟边界。主 Agent 应在跨技术收敛时继续核对 T1556 和 NJT-0093/NJT-0100，只把材料生成而非信任修改写入本父技术。
      en: >-
        The two Niji children do not translate T1606.001 and T1606.002. A web cookie can belong to complete off-chain proof or composed auxiliary state, while SAML provides strong implementation evidence for the first. Claims and audience or time axes were independently tested and converged as internal constraints because current primary sources do not establish distinct stealth intent and sibling boundaries. During cross-technique convergence, the primary agent should recheck T1556 and NJT-0093 or NJT-0100 and keep material generation, rather than trust mutation, in this parent.
  evidence_coverage:
    parent_behavior_keys:
      - TA0006-003-T1606-REF-ATTACK
      - REF-000304
      - REF-000509
      - TA0006-003-T1606-REF-ZIMBRA-PREAUTH
    boundary_keys:
      - TA0006-003-T1606-REF-AWS-STS
      - TA0006-003-T1606-REF-OASIS-SAML-PROFILE
      - REF-000343
      - REF-000304
    mechanism_support:
      - mechanism: NM-BT
        keys:
          - TA0006-003-T1606-REF-MANDIANT-DPAPI-SAML
          - TA0006-003-T1606-REF-MICROSOFT-ADFS-AUDIT
          - REF-000509
        limit: Direct controlled SAML acceptance plus direct Dark Halo incident; cross-product log fields still vary
      - mechanism: NM-FD
        keys:
          - REF-000304
          - REF-000509
          - TA0006-003-T1606-REF-OASIS-SAML-PROFILE
          - TA0006-003-T1606-REF-ZIMBRA-PREAUTH
        limit: Trusted-signature and accepted-cookie appearance are direct; deliberate tuning of every claim to local baselines is not published
    child_existence_support:
      - child_key: TA0006-003-T1606-CHILD-OFFCHAIN
        keys:
          - REF-000304
          - TA0006-003-T1606-REF-MANDIANT-DPAPI-SAML
          - TA0006-003-T1606-REF-ZIMBRA-PREAUTH
      - child_key: TA0006-003-T1606-CHILD-AUXSTATE
        keys:
          - REF-000509
          - TA0006-003-T1606-REF-DUO-WEBSDK
    unsupported_or_deferred:
      - zh: 公开 Solorigate 资料没有逐受害者发布完整 assertion、claim、Audience、lifetime 与对应 AD FS/依赖方日志，不能声称每项字段均被刻意仿形。
        en: Public Solorigate reporting does not publish complete per-victim assertions, claims, audiences, lifetimes, and paired AD FS or relying-party logs, so deliberate shaping of every field cannot be claimed.
      - zh: Mandiant 的机器 DPAPI 路径是受控评估，AD FS replication 文章明确说当时未观察到该具体提取路径在野使用。
        en: Mandiant's machine-DPAPI path is a controlled assessment, and the AD FS replication article explicitly said that specific extraction path had not then been observed in the wild.
      - zh: 仅有依赖方登录或缺少 IdP 事件不能排除日志关闭、IdP 发起、续期、窃取或重放，必须输出覆盖状态并降级。
        en: Relying-party sign-in or missing IdP events alone cannot exclude disabled logging, IdP initiation, renewal, theft, or replay and requires an explicit coverage state and lower confidence.
      - zh: 服务器端 session store 直接写入尚缺少本批可复用的一手事件证据，不建议正式化。
        en: Direct server-side session-store insertion lacks reusable first-party incident evidence in this batch and should remain deferred.
      - zh: AWS AssumeRole/GetFederationToken 的正式服务签发不纳入适配后定义，不能用 ATT&CK 父页示例扩张 Niji 范围。
        en: Authoritative service issuance through AWS AssumeRole or GetFederationToken is outside the adapted definition and cannot be used to expand Niji scope from the ATT&CK parent example.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父稿分别定义权威外构造、三阶段证据、密码学有效与来源合法的差异、相邻技术边界、攻击者构造约束和跨平面防守模型。两个子稿用不同的前后痕迹、传感器、误报和缓解措施证明兄弟边界；防御不把密钥访问、登录成功或日志缺失直接升级为完整伪造链。段落深度按 NJT-0001 的问题覆盖对照，未复制其对象数量或措辞。
      en: >-
        The parent separately defines off-authority construction, three evidence stages, cryptographic validity versus legitimate origin, adjacent boundaries, adversary construction constraints, and a cross-plane defender model. The two children establish sibling boundaries through different before-and-after traces, sensors, false positives, and mitigations. Defense does not promote key access, sign-in success, or missing logs directly into a complete forgery chain. Paragraph depth was compared with NJT-0001 by question coverage without copying its object counts or wording.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - YAML serialization and recursive structural audit only
  limitations:
    paragraphs:
      - zh: >-
          证据层级跨协议且不均衡。Microsoft 的 Solorigate 调查提供在野签名能力取得、攻击者创建 SAML 和云访问链；Volexity 提供同一事件中主认证、Duo 零事件、Cookie 与集成秘密；Mandiant 2026 是受控签发密钥恢复与接受实验；OASIS、Zimbra、Duo 和 AWS 是协议或产品语义。不得把受控实验和能力文档升级为在野频率，也不得把不同来源阶段拼成同一受害者完整链。
        en: >-
          Evidence strength differs across protocols. Microsoft Solorigate reporting provides an in-the-wild chain from acquisition of signing capability to attacker-created SAML and cloud access. Volexity provides primary authentication, no Duo event, a cookie, and an integration secret in one incident. Mandiant 2026 is a controlled key-recovery and acceptance assessment. OASIS, Zimbra, Duo, and AWS provide protocol or product semantics. Controlled experiments and capability documentation do not establish field prevalence, and stages from different sources cannot be spliced into one victim's complete chain.
      - zh: >-
          日志缺口检测高度依赖本地配置。AD FS 审计可能未启用，SaaS 不一定导出 assertion 或 signer，合法 IdP 发起 SSO 和续期也可能缺主认证；旧应用则可能只记录最终 allow。正式 Analytic 应先报告 coverage_state，再按精确 ID、弱关联和资源结果分级。轮换 signer、共享秘密与全局会话可能造成业务中断，必须在保全证据后按厂商程序执行并验证旧材料在所有依赖方失效。
        en: >-
          Gap detection depends heavily on local configuration. AD FS audit may be disabled, SaaS services may omit assertion or signer data, legitimate IdP-initiated SSO and renewal may lack fresh authentication, and legacy applications may record only final allow. A formal analytic should report coverage_state first and tier exact identifiers, weak joins, and resource outcomes. Rotating signers, shared secrets, and all sessions can disrupt business and must follow vendor procedures after evidence preservation, with old material tested for denial at every relying party.
  rejected_mechanisms:
    - mechanism: NM-ST
      reason_zh: 签名密钥可长期有效且材料可延迟使用，但本批一手事件没有独立证明攻击者以时间或空间分散规避阈值；延迟主要属于后继使用情境。
      reason_en: Signing keys can remain valid and material can be used later, but primary incident evidence in this batch does not independently establish deliberate temporal or spatial dilution to evade thresholds; delay mainly belongs to successor-use context.
    - mechanism: NM-DO
      reason_zh: SAML、Cookie 或 HMAC 的密码学编码是验证格式，并不自动使已采集数据不可解释；本批匿迹效果来自可信外观和签发观察缺口。
      reason_en: Cryptographic encoding of SAML, cookies, or HMACs is a validation format and does not automatically make collected data uninterpretable; the supported stealth effects are trusted appearance and issuance-observation gaps.
  open_questions:
    - zh: 主 Agent 应裁定 CASE-000111 仅扩展 subject_refs，还是把 Solorigate 的签名证书窃取路径拆成新的材料构造案例；两者不能重复叙述同一 trust-modification 中心事实。
      en: The primary agent should decide whether to extend CASE-000111 subject_refs only or split the stolen-signing-certificate path into a new material-construction case; the same trust-mutation central fact must not be duplicated.
    - zh: 主 Agent 应核对本批 T1606 与后续 T1556 的正式父边界，尤其是“新增 signer”只归验证/信任状态变化，而具体新断言可与本项并列。
      en: The primary agent should recheck the formal boundary between this T1606 candidate and later T1556, especially that adding a signer belongs only to validation or trust-state mutation while a specific new assertion can be co-mapped here.
    - zh: 若目标 Web 应用无法输出稳定 session/request ID 或辅状态摘要，应把 DET-COMPOSED 的部署状态标为受限，而不是用 IP 加五分钟的弱匹配制造高置信度告警。
      en: If a target web application cannot export stable session or request identifiers or auxiliary-state digests, mark DET-COMPOSED deployment as limited rather than creating high-confidence alerts from an IP plus five-minute weak join.
