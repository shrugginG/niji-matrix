research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids: [T1056.004, T1056.002, T1056.001, T1056.003]
    represented_dimensions:
    - zh: 凭据敏感函数或认证进程中的调用截获位置
      en: Interception position in credential-sensitive functions or authentication processes
    - zh: 本地仿冒图形界面与用户主动输入
      en: Local impersonated graphical interfaces and user-entered input
    - zh: 操作系统或设备层的按键事件流
      en: Operating-system or device-level key event streams
    - zh: 真实或仿冒 Web 登录页的表单接收位置
      en: Form receivers in genuine or impersonated web login pages
    breadth_trigger: three-to-five-multi-axis-review
    coverage_resolutions:
    - attack_id: T1056.004
      resolution: niji-variable-candidate
      mapped_keys: [TA0006-004-T1056-CHILD-GENUINE]
      note_zh: API Hook 只在真实认证消费者内部形成第二输入接收路径且有内容结果时支撑该原生轴；Hook 类型和操作系统不成为子项。
      note_en: API hooking informs the native axis only when it creates a second input receiver inside a genuine authentication consumer with a content result; hook type and operating system do not define a child.
    - attack_id: T1056.002
      resolution: niji-variable-candidate
      mapped_keys: [TA0006-004-T1056-CHILD-IMPERSONATED]
      note_zh: GUI 只提供仿冒消费者证据，稳定变量是展示身份与真实控制者错配，而非对话框或平台。
      note_en: GUI behavior supplies impersonated-consumer evidence; the stable variable is mismatch between presented identity and true controller, not dialog or platform.
    - attack_id: T1056.001
      resolution: niji-variable-candidate
      mapped_keys: [TA0006-004-T1056-CHILD-PRECONSUMER, NJS-0132-001]
      note_zh: 事件流读取支撑消费者前位置；按窗口选择何时记录属于既有窗口门控轴，不能在本父级复制。
      note_en: Event-stream reads support the pre-consumer position, while choosing when to record by window belongs to the existing window-gating axis and is not duplicated here.
    - attack_id: T1056.003
      resolution: niji-variable-candidate
      mapped_keys: [TA0006-004-T1056-CHILD-GENUINE, TA0006-004-T1056-CHILD-IMPERSONATED]
      note_zh: Web 门户可以是真实页面被修改，也可以是攻击者仿冒来源；门户介质本身不构成子项。
      note_en: A web portal may be a modified genuine page or an attacker-controlled impersonated origin; the portal medium itself does not define a child.
    candidate_stealth_axes_examined:
    - axis: pre_consumer_capture_position
      disposition: formal
      why_zh: 输入副本在消费者之前形成，使应用审计与端点输入面承担不同检测责任。
      why_en: The input copy forms before the consumer, separating application audit from endpoint input-surface detection.
    - axis: genuine_consumer_internal_receiver
      disposition: formal
      why_zh: 原消费者身份与正常反馈可保留，防御需要静态和运行态完整性及第二输出关联。
      why_en: Original consumer identity and normal feedback can remain, requiring static and runtime integrity plus secondary-output correlation.
    - axis: impersonated_consumer_identity
      disposition: formal
      why_zh: 展示身份与真实接收者错配，防御依赖进程或 origin 真实性和 IdP 事务差分。
      why_en: Presented identity and true receiver diverge, requiring process or origin authenticity and IdP-transaction differential.
    - axis: context_gated_capture
      disposition: adjacent-existing
      why_zh: 窗口、焦点或页面条件决定后继捕获何时出现的变量已由 NJS-0132-001 拥有；T1056 只补充实际输入结果。
      why_en: NJS-0132-001 already owns the variable in which window, focus, or page context decides when later capture appears; T1056 adds the actual input result.
    - axis: buffered_or_encrypted_output
      disposition: deferred-successor
      why_zh: 缓冲、混淆或分批发送改变捕获后的存储与传输，缺少作为输入截获兄弟边界的独立证据。
      why_en: Buffering, obscuration, or batched sending changes post-capture storage and transport and lacks independent evidence as an input-interception sibling boundary.
    - axis: platform_api_or_input_medium
      disposition: rejected
      why_zh: Windows、Linux、macOS、键盘、GUI、Web、API 和产品名称是实现或介质，不是稳定匿迹变量。
      why_en: Windows, Linux, macOS, keyboard, GUI, web, API, and product names are implementations or media rather than stable stealth variables.
    second_pass_required: false
    second_pass_completed: true
    second_pass_method:
      zh: 第一轮逐项解析四个 ATT&CK 子项的介入位置、消费者身份和可见痕迹；第二轮放弃其名称，从输入信任路径、捕获相对时点、消费者控制归属、用户反馈连续性、采集位置和遥测面重新测试攻击者控制、反事实痕迹、证据和防御差异。
      en: Pass one resolved the four ATT&CK children by intervention position, consumer identity, and visible traces. Pass two discarded their labels and retested input trust path, relative capture time, consumer control, user-feedback continuity, acquisition location, and telemetry surface for attacker control, counterfactual trace, evidence, and defense difference.
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: 三项正式子项不是 .001 至 .004 的翻译或合并；每项跨多个实现，且分别需要输入权限和设备遥测、消费者完整性与第二输出、界面身份和 IdP 事务差分。四项广度均已解析，窗口门控与输出处理没有为凑数重复正式化。
      en: The three formal children are neither translations nor mechanical merges of .001 through .004. Each crosses implementations and respectively requires input-authority and device telemetry, consumer integrity and secondary output, or interface identity and IdP-transaction differential. All four breadth items are resolved, while window gating and output handling are not duplicated to fill count.
  evidence_coverage:
    parent_behavior_keys: [TA0006-004-T1056-REF-ATTACK, TA0006-004-T1056-REF-VOLEXITY-IVANTI, TA0006-004-T1056-REF-LUMEN-VERSA, TA0006-004-T1056-REF-MANDIANT-APT42]
    boundary_keys: [TA0006-004-T1056-REF-ATTACK, TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL, TA0006-004-T1056-REF-APPLE-INPUT, REF-000499]
    mechanism_support:
    - mechanism: NM-BT
      keys: [TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL, TA0006-004-T1056-REF-APPLE-INPUT, TA0006-004-T1056-REF-VOLEXITY-IVANTI, TA0006-004-T1056-REF-LUMEN-VERSA]
      limit: Capability and two appliance incidents support observation-surface shift; no source measures general alert reduction
    - mechanism: NM-FD
      keys: [TA0006-004-T1056-REF-VOLEXITY-IVANTI, TA0006-004-T1056-REF-LUMEN-VERSA, TA0006-004-T1056-REF-MANDIANT-APT42, TA0006-004-T1056-REF-UNIT42-KOI]
      limit: Separate genuine and impersonated receiver incidents; do not combine them into one observed chain
    child_existence_support:
    - child_key: TA0006-004-T1056-CHILD-PRECONSUMER
      keys: [TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL, TA0006-004-T1056-REF-APPLE-INPUT, TA0006-004-T1056-REF-TRENDMICRO-DRBCONTROL]
    - child_key: TA0006-004-T1056-CHILD-GENUINE
      keys: [TA0006-004-T1056-REF-VOLEXITY-IVANTI, TA0006-004-T1056-REF-LUMEN-VERSA]
    - child_key: TA0006-004-T1056-CHILD-IMPERSONATED
      keys: [TA0006-004-T1056-REF-MANDIANT-APT42, TA0006-004-T1056-REF-UNIT42-KOI]
    unsupported_or_deferred:
    - zh: 没有来源量化三项路径相对传统规则的检出率或误报率，匿迹效果只能按观察面差异校准。
      en: No source quantifies detection or false-positive rates for the three paths relative to traditional rules; stealth effects are calibrated to observation-surface differences.
    - zh: 窗口或页面条件门控由 NJS-0132-001 拥有，当前没有独立 T1056 子项。
      en: Window or page context gating is owned by NJS-0132-001 and does not create an independent T1056 child.
    - zh: Hook、提示或登录资产变化未连接到输入结果时，只证明暴露或准备，不能提升为已获凭据。
      en: A hook, prompt, or login-asset change without an input result proves exposure or preparation, not acquired credentials.
    - zh: 加密、缓冲、暂存或分批外传属于取得后处理，未证明输入捕获本身存在独立 NM-DO 或 NM-ST 轴。
      en: Encryption, buffering, staging, or batched egress is post-acquisition handling and does not establish an independent NM-DO or NM-ST axis for input capture itself.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父稿分别固定完成点、证据阶段、观察面、相邻技术和隐私约束；三个子稿分别按捕获相对位置、真实消费者内部接收路径和仿冒消费者身份展开，具有独立威胁前提、残余痕迹、Analytic 与 Mitigation。没有按键盘、GUI、Web、API、平台或产品建立子项。
      en: The parent separately fixes completion, evidence stages, observation surfaces, neighboring techniques, and privacy constraints. The three children separately develop relative capture position, an internal receiver in the genuine consumer, and impersonated consumer identity, with distinct prerequisites, residual traces, analytics, and mitigations. No child is defined by keyboard, GUI, web, API, platform, or product.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization, recursive parse, bilingual-pair audit, temporary-key reference audit, and punctuation checks only
  limitations:
    paragraphs:
    - zh: 证据层级不同：平台文档证明输入观察能力与权限，DRBControl 证明独立键盘记录输出，Ivanti 与 Versa 证明真实消费者内第二接收路径，APT42 与 Koi Stealer 证明仿冒消费者及输入结果。不能把不同操作系统、设备和活动阶段拼成一条通用入侵链，也不能从捕获能力反推某个受害者已输入正确秘密或后继登录成功。
      en: Evidence levels differ. Platform documentation establishes input-observation capability and authority, DRBControl establishes independent keylogging output, Ivanti and Versa establish a second receiver inside a genuine consumer, and APT42 and Koi Stealer establish impersonated consumers and input results. Different operating systems, appliances, and campaign stages cannot be spliced into one universal intrusion chain, and capture capability cannot prove that a victim entered a correct secret or that later sign-in succeeded.
    - zh: 端点输入 API、窗口安全上下文、浏览器表单目标、设备运行态和 IdP transaction_id 的可用性随传感器与隐私政策变化。正式 Analytic 必须先在目标版本实测字段，并只保留权限、来源、时序与结果元数据；大规模记录按键或表单内容既不必要，也会制造新的敏感数据风险。合法无障碍、输入法、远程支持、自动填充、测试和监控代理须按精确身份与任务排除。
      en: Availability of endpoint input APIs, window security context, browser form targets, appliance runtime data, and IdP transaction_id varies by sensor and privacy policy. A formal analytic must pilot fields on target versions and retain only authority, provenance, timing, and outcome metadata. Pervasive recording of keys or form contents is unnecessary and creates new sensitive-data risk. Accessibility, input methods, remote support, autofill, testing, and monitoring agents require exclusion by exact identity and task.
  rejected_mechanisms:
  - mechanism: NM-ST
    reason_zh: 条件化或低频输入捕获的时间变量已与 NJS-0132-001 重叠，且没有 T1056 一手资料量化阈值规避；不在本父级重复。
    reason_en: Conditional or low-rate input-capture timing overlaps NJS-0132-001 and lacks T1056-specific primary evidence quantifying threshold evasion, so it is not duplicated here.
  - mechanism: NM-DO
    reason_zh: 捕获后对日志或凭据输出加密只改变结果可检查性，当前证据未证明它是输入截获本身的稳定兄弟变量。
    reason_en: Encrypting logs or credential output after capture changes result inspectability, but current evidence does not establish it as a stable sibling variable of input interception itself.
  open_questions:
  - zh: 主 Agent 应在正式写入前确认 TA0009 后续 T1056 候选是否复用或另建 Collection 收窄对象；本交接只建议 TA0006 的认证输入范围，不提前修改另一战术计划。
    en: Before canonical writing, the primary agent should decide whether the later TA0009 T1056 candidate reuses or creates a Collection-scoped object. This handoff recommends only the TA0006 authentication-input scope and does not preempt another tactic plan.
  - zh: 正式防御对象应按目标部署选择可验证的平台分支；若无法导出 Hook、输入权限、资产或运行态字段，应把该分支标为 blind spot，而不是编造统一日志通道。
    en: Formal defense objects should select platform branches whose fields can be validated in the target deployment. If hook, input-authority, asset, or runtime fields cannot be exported, record a blind spot rather than inventing a universal log channel.
