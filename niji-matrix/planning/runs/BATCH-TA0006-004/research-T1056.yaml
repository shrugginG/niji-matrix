handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-004
work_item_ref: WORK-TA0006-T1056
temporary_key_prefix: TA0006-004-T1056
candidate:
  source_type: attack
  source_attack_id: T1056
  name:
    zh: 认证输入路径截获
    en: Authentication-Input Path Interception
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 的 T1056 同时面向 Collection 与 Credential Access，父级把透明截获和欺骗用户输入放在同一行为中。TA0006 应保留“攻击者实际取得用户正在提交的认证输入”这一直接目标，但把正式范围收窄到可证明的口令、验证码或同类认证秘密，并要求存在攻击者可控的输入信任路径、捕获位置或消费者身份差异。只安装 Hook、取得输入权限、显示提示框或修改登录页而未证明输入内容进入攻击者可读缓冲区，不达到完成点。
      en: ATT&CK Enterprise 19.1 T1056 spans Collection and Credential Access and groups transparent interception with deceptive elicitation. The TA0006 object should preserve the direct objective of actually obtaining authentication input as the user submits it, while narrowing formal scope to passwords, verification codes, or comparable authentication secrets and requiring a supported attacker-controlled difference in input trust path, capture position, or consumer identity. Installing a hook, gaining input permission, showing a prompt, or changing a login page without proof that input content reached an attacker-readable buffer does not reach completion.
    - zh: 建议 adapt，而非照搬四个 ATT&CK 子项，因为键盘、GUI、Web 和 API 只是输入介质或实现位置。逐项覆盖与第二轮原生轴审查收敛出三项跨实现分类：消费者解析前输入流旁路、真实消费者内提交镜像和仿冒消费者诱导取密。窗口或页面条件门控已经由 NJS-0132-001 拥有；缓存、加密或分批发送是取得后的输出处理；它们都不在本父级重复建子项。
      en: >-
        Adaptation is recommended rather than copying the four ATT&CK children because keyboard, GUI, web, and API labels describe media or implementation positions. Item-by-item coverage and a second native-axis review converge on three cross-implementation classes: pre-consumer input-stream bypass, genuine-consumer submission shadowing, and impersonated-consumer credential elicitation. Window or page gating is already owned by NJS-0132-001, while buffering, encryption, or batched transmission is post-capture output handling; none is duplicated as a child here.
proposed_content:
  summary:
    zh: 攻击者在认证输入被提交时复制其内容，并通过绕到消费者之前、寄生真实消费者或仿冒接收者改变防守方能够关联的取密痕迹。
    en: Adversaries copy authentication input as it is submitted and change defender-visible acquisition traces by observing before the intended consumer, parasitizing the genuine consumer, or impersonating the receiver.
  definition_and_concept:
    paragraphs:
    - zh: 认证输入路径截获是攻击者在用户或受控进程输入口令、验证码或其他认证秘密的过程中，使内容在到达预期验证者之前或同时进入攻击者可读位置。直接目的在于取得用户此刻提供的秘密，而不是读取已经保存在保管库中的条目，也不是在提交完成后偷取 Cookie 或访问令牌。输入可以经键盘事件、粘贴、图形提示、浏览器表单或认证函数传递；这些介质改变实现和传感器，不改变父技术身份。
      en: Authentication-Input Path Interception occurs when an adversary causes a password, verification code, or other authentication secret being entered by a user or controlled process to reach an attacker-readable location before or while it reaches the intended verifier. The immediate objective is the secret being supplied at that moment, rather than an item already stored in a vault or a cookie or access token stolen after submission. Input may travel through key events, paste, a graphical prompt, a browser form, or an authentication function; these media change implementation and sensors, not the parent identity.
    - zh: 证据必须区分输入观察权限或组件改动、实际内容复制、攻击者保留或外传、以及后继身份使用。Microsoft 文档说明低层键盘 Hook 在事件进入线程输入队列之前被调用，但这一能力本身不证明恶意进程保存了字符；Volexity 和 Lumen 的事件分析则分别把真实登录页 JavaScript、认证方法 Hook 与凭据输出相连。正式判断至少需要内容进入恶意缓冲区、文件、请求或等价结果的证据，后继登录仍单独证明。
      en: Evidence must distinguish input-observation authority or component change, actual content copying, attacker retention or egress, and later identity use. Microsoft documents that a low-level keyboard hook is called before an event enters a thread input queue, but that capability alone does not prove a malicious process saved characters. Volexity and Lumen incident analyses respectively connect genuine login-page JavaScript and an authentication-method hook to credential output. A formal conclusion requires evidence that content entered a malicious buffer, file, request, or equivalent result; later sign-in remains a separate proposition.
  stealth_characteristics:
    paragraphs:
    - zh: 当截获点位于预期消费者之前，真实应用和身份服务仍只看到正常输入与正常认证结果，输入副本不会自动出现在应用审计中；关键痕迹转移到全局 Hook、输入设备读取、Input Monitoring 权限、缓冲文件或发起进程外联。若攻击代码位于真实登录组件内部，用户仍可看到正确域名、界面和反馈，而服务端请求也可能保持正常主体外观，异常缩小为登录资产差异、运行态改写和第二输出目的地。
      en: When interception sits before the intended consumer, the genuine app and identity service still see ordinary input and an ordinary authentication result, while the copied input does not automatically appear in application audit. Evidence moves to global hooks, input-device reads, Input Monitoring authority, buffers, or egress from the observing process. When malicious code resides inside a genuine login component, the user can retain the correct domain, interface, and feedback and the server request can retain a normal principal appearance, narrowing the anomaly to login-asset differences, runtime modification, and a second output destination.
    - zh: 仿冒消费者则保留预期品牌、对话框或云托管外观，却把输入实际交给攻击者控制的进程或来源。防守方若只看截图、窗口标题或 TLS 存在，可能把外观当作身份；仍可观察的差异包括进程谱系、secure desktop 状态、页面 origin、证书和域名、表单提交目标及身份提供方是否出现对应事务。三条路径均不会让行为不可见，其收益取决于端点、浏览器、服务和身份日志能否以同一用户、会话、进程和时间连接。
      en: An impersonated consumer preserves expected branding, dialog, or cloud-hosted appearance while delivering input to an attacker-controlled process or origin. A defender relying on a screenshot, window title, or the presence of TLS can mistake appearance for identity. Residual differences include process lineage, secure-desktop state, page origin, certificate and domain, form-submission destination, and whether the identity provider recorded a corresponding transaction. None of the three paths is invisible; the advantage depends on whether endpoint, browser, service, and identity records can be joined by user, session, process, and time.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求同时存在认证输入、攻击者驱动的截获路径、实际内容结果和可说明匿迹收益的观察差。合法无障碍、输入法、远程支持、密码管理器自动填充、软件测试、DLP 或遥测代理可能取得相似权限或读取相同界面；必须核对批准身份、签名、版本、会话、目标应用、工单和结果去向。只看到 SetWindowsHookEx、/dev/input 打开、TCC 授权、脚本提示或登录页变更是调查线索，不能单独断言秘密已获。
      en: Inclusion requires authentication input, an attacker-driven interception path, an actual content result, and an observation difference that explains stealth value. Accessibility, input methods, remote support, password-manager autofill, testing, DLP, and telemetry agents can hold similar authority or read the same interface. Assessment must check approved identity, signature, version, session, target app, ticket, and result destination. SetWindowsHookEx use, a /dev/input open, TCC authority, a scripted prompt, or a login-page change is an investigative lead and cannot alone establish secret acquisition.
    - zh: 屏幕像素归 T1113/NJT-0158，浏览器已经显示或返回的页面内容归 NJT-0145，麦克风或通话音频归 T1123，摄像头和视频帧归 T1125。受管理保管库中已存秘密归 NJT-0147/T1555，散落文件或配置中的秘密归 T1552；提交后形成的应用令牌和 Web 会话 Cookie 分别归 T1528 和 T1539。若 Hook 改变认证决定或持久接受条件而非只复制输入，T1556 拥有该改变；同一事件可在各直接对象都有独立证据时并列标记。
      en: Display pixels belong to T1113/NJT-0158, page content already rendered or returned in a browser belongs to NJT-0145, microphone or call audio belongs to T1123, and camera or video frames belong to T1125. Existing secrets in managed stores belong to NJT-0147/T1555 and loose secrets in files or configuration to T1552. Application tokens and web session cookies created after submission belong to T1528 and T1539 respectively. If a hook changes the authentication decision or durable acceptance condition rather than merely copying input, T1556 owns that change; an event may carry both labels only with evidence for each direct object.
    - zh: 恶意中间路径若改变终端与服务之间的信任指向，NJT-0136/T1557 可描述路径介入；本技术只在用户输入内容又被实际捕获时成立。诱饵邮件、恶意链接和页面投递属于相邻的初始访问行为，不能代替表单内容已交给攻击者的证据。输入被捕获后再压缩、加密、暂存或分批外传属于各自后继动作，不按文件格式、平台、产品或输入字段类别拆分子项。
      en: When a malicious intermediary changes trust direction between endpoint and service, NJT-0136/T1557 can describe the path intervention; this technique applies only when user input content is also actually captured. Lure email, malicious links, and page delivery are adjacent initial-access behavior and do not substitute for proof that form content reached the attacker. Compression, encryption, staging, or batched egress after capture is successor behavior and does not create children by file format, platform, product, or input-field category.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在已控工作站上，攻击者可用低层 Hook、事件 tap、输入设备读取或辅助功能权限复制用户向真实应用提供的认证输入；在 VPN、SSO 或管理设备上，攻击者可修改真实登录脚本或在认证服务运行态插入处理逻辑，使原登录继续而把输入另送到文件或远端。另一分支通过伪装成系统授权框、软件更新、Google 或 Microsoft 登录页的界面诱导输入，并在显示错误、跳转到真实内容或继续原流程前保存秘密。
        en: On a compromised workstation, an adversary can use a low-level hook, event tap, input-device read, or accessibility authority to copy authentication input supplied to a genuine app. On a VPN, SSO, or management appliance, the adversary can change a genuine login script or insert runtime logic into the authentication service so the original sign-in continues while input is sent to a file or remote destination. Another branch elicits input through an interface impersonating an operating-system authorization dialog, software update, or Google or Microsoft sign-in page, then saves the secret before showing an error, redirecting to real content, or continuing the expected flow.
      - zh: Credential Access 场景的后继目的包括登录邮件与云租户、进入 VPN、提升管理设备访问或绕过恢复流程，但本对象在秘密进入攻击者可读结果时完成。实际成功认证、会话建立和资源访问需要身份提供方、目标服务或受害环境的独立记录，不能从捕获能力反推。
        en: Credential Access successors include signing into mail or cloud tenants, entering a VPN, gaining management-appliance access, or abusing recovery flows, but this object completes when the secret reaches an attacker-readable result. Successful authentication, session creation, and resource access require independent identity-provider, target-service, or victim-environment records and cannot be inferred from capture capability.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少需要在目标交互会话中运行代码、读取系统输入面、修改或寄生真实认证消费者，或控制一个能令用户信任的仿冒界面。消费者前路径要求足够的桌面、设备、TCC/辅助功能或驱动权限；真实消费者内路径要求登录资产写权限、进程注入、Java instrumentation 或等价运行态控制；仿冒路径要求可信投递、品牌知识及接收输入的来源。攻击者还需把字符或字段与用户、窗口或会话关联，并承担用户未输入、布局差异和二次确认带来的失败。
          en: The adversary needs at least code in the target interactive session, access to a system input surface, authority to modify or inhabit a genuine authentication consumer, or control of an impersonated interface the user may trust. The pre-consumer path needs sufficient desktop, device, TCC or accessibility, or driver authority. The genuine-consumer path needs login-asset write access, process injection, Java instrumentation, or equivalent runtime control. The impersonation path needs credible delivery, brand knowledge, and an origin that receives input. The actor must also associate characters or fields with a user, window, or session and tolerate failure from absent input, layout differences, and independent confirmation.
        - zh: 强制代码签名、受保护进程、secure desktop、只读或签名登录资产、受限服务外联、最小化 Input Monitoring 与设备权限、以及验证者绑定的抗钓鱼认证都会限制相应分支。获得管理员权限并不自动保证能读所有安全桌面、硬件认证器或受隔离应用的输入，恶意提示也不能保证用户提交正确秘密。
          en: Enforced code signing, protected processes, secure desktop, read-only or signed login assets, constrained service egress, minimized Input Monitoring and device authority, and verifier-bound phishing-resistant authentication constrain the respective branches. Administrator authority does not automatically provide access to every secure desktop, hardware authenticator, or isolated app input, and a malicious prompt does not guarantee that the user supplies a correct secret.
      defender_model:
        paragraphs:
        - zh: 防守方假定可集中一部分端点进程与模块、输入权限或设备访问、文件完整性、浏览器来源与网络、Web 部署、认证服务和身份提供方日志，并维护获批辅助功能、输入法、远程支持、密码管理器、测试工具和登录资产清单。Windows 默认日志不记录每次键盘 Hook 调用，Sysmon Event 7 需显式启用且只证明模块加载；macOS Input Monitoring 表示权限而非捕获结果；Linux auditd 只能在已配置规则时看到设备打开或系统调用。
          en: The defender is assumed to centralize some endpoint process and module data, input authority or device access, file integrity, browser origin and network data, web deployment records, authentication-service logs, and identity-provider transactions, with inventories of approved accessibility, input methods, remote support, password managers, test tools, and login assets. Default Windows logs do not record every keyboard-hook call, Sysmon Event 7 must be enabled and proves only a module load, macOS Input Monitoring represents authority rather than a capture result, and Linux auditd sees device opens or syscalls only when relevant rules are configured.
        - zh: 检测必须把截获入口与输出结果连接，而不采集或集中保存真实口令。可行关联键包括设备、用户、登录会话、进程 GUID、浏览器 profile、页面 origin、认证事务、登录资产版本、目标服务和时间。若端点只保留进程创建而没有 API/设备/权限遥测，认证设备没有外部完整性基线，或用户位于未受管浏览器，防守方只能报告风险入口，不能证明输入已被复制。
          en: Detection must connect the interception entry to an output result without collecting or centrally retaining actual passwords. Useful join keys include device, user, logon session, process GUID, browser profile, page origin, authentication transaction, login-asset version, target service, and time. If an endpoint retains only process creation without API, device, or permission telemetry, an appliance lacks an external integrity baseline, or the user operates an unmanaged browser, the defender can report an exposure path but cannot prove that input was copied.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 截获点离开预期消费者审计面使输入副本不进入常规认证记录
      en: Interception outside intended-consumer audit keeps the input copy out of routine authentication records
    analysis:
      paragraphs:
      - zh: 攻击者在输入事件到达应用前读取事件流，或在登录消费者内部增加不受原审计理解的第二输出，使真实验证者仍处理一次普通提交。行为设计把“秘密被复制”与“认证请求被处理”分置在不同观察面；应用或身份日志因此只能证明正常事务，无法单独看到副本。Microsoft、Apple 与 ATT&CK 检测材料支持输入面能力和传感器差异，Volexity 与 Lumen 则证明登录资产或运行态可产生额外输出；它们没有给出普遍检出率，故父级置信度为 medium。
        en: The adversary reads the event stream before it reaches the app or adds a second output inside the login consumer that the original audit model does not understand, while the genuine verifier handles an ordinary submission. This design separates the copied secret from the processed authentication request across observation surfaces, so application or identity logs alone establish only the normal transaction. Microsoft, Apple, and ATT&CK detection material support input-surface capability and sensor differences, while Volexity and Lumen establish extra output from login assets or runtime. None provides a general detection-rate estimate, so parent confidence is medium.
    evidence_keys:
    - TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL
    - TA0006-004-T1056-REF-APPLE-INPUT
    - TA0006-004-T1056-REF-VOLEXITY-IVANTI
    - TA0006-004-T1056-REF-LUMEN-VERSA
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 真实或仿冒消费者外观掩盖输入接收者的控制归属
      en: Genuine or impersonated consumer appearance masks who controls the input receiver
    analysis:
      paragraphs:
      - zh: 攻击代码可以寄生真实登录页或认证方法，使正确域名与正常反馈继续存在，也可以复制品牌、原生对话框和云托管页面，使攻击者控制的来源看起来像预期消费者。可见实体没有消失，而是其品牌、进程或路径特征与真实控制者不一致，降低仅按界面外观和成功反馈判断的区分力。Volexity、Lumen、Mandiant 与 Unit 42 分别提供真实消费者和仿冒消费者案例，但不同事件不能拼成一条统一攻击链。
        en: Malicious code can inhabit a genuine login page or authentication method so the correct domain and normal feedback remain, or copy branding, a native dialog, and cloud-hosted page so an attacker-controlled origin resembles the intended consumer. The visible entity remains, but its brand, process, or path features no longer match the true controller, weakening decisions based only on appearance and successful feedback. Volexity, Lumen, Mandiant, and Unit 42 provide genuine-consumer and impersonated-consumer cases, but separate incidents cannot be spliced into one attack chain.
    evidence_keys:
    - TA0006-004-T1056-REF-VOLEXITY-IVANTI
    - TA0006-004-T1056-REF-LUMEN-VERSA
    - TA0006-004-T1056-REF-MANDIANT-APT42
    - TA0006-004-T1056-REF-UNIT42-KOI
    confidence: high
proposed_subtechniques:
- temporary_key: TA0006-004-T1056-CHILD-PRECONSUMER
  name:
    zh: 消费者前输入流旁路
    en: Pre-Consumer Input-Stream Bypass
  summary:
    zh: 攻击者在输入进入预期应用或验证者之前复制事件或字符，使真实消费者继续正常处理而应用审计缺少副本记录。
    en: The adversary copies events or characters before input reaches the intended app or verifier, allowing the genuine consumer to continue normally without an application record of the copy.
  taxonomy_variable:
    zh: 输入内容是否在预期消费者解析之前从系统或会话输入面被复制
    en: Whether content is copied from the system or session input surface before intended-consumer interpretation
  counterfactual_trace:
    zh: 在消费者内取得字段会留下登录资产、模块或请求差异；提前旁路后真实消费者可完全不变，异常转移到 Hook、设备读取、输入权限、缓冲和外联。
    en: Field capture inside the consumer leaves login-asset, module, or request differences; pre-consumer bypass can leave the genuine consumer unchanged and moves anomalies to hooks, device reads, input authority, buffers, and egress.
  definition_and_concept:
    paragraphs:
    - zh: 消费者前输入流旁路是在认证输入尚未被目标应用、浏览器字段或验证函数解释时，攻击者从操作系统事件链、输入设备、事件 tap、全局 Hook、输入法或等价会话面复制字符或操作序列。直接目标是取得能够重建认证秘密的输入，同时让原事件继续交给真实消费者。键盘、鼠标、粘贴和平台 API 是载体；只有实际输入内容或可还原结果被复制才成立。
      en: Pre-Consumer Input-Stream Bypass copies characters or action sequences from an operating-system event chain, input device, event tap, global hook, input method, or equivalent session surface before authentication input is interpreted by the target app, browser field, or verification function. Its direct objective is input that can reconstruct an authentication secret while the original event continues to the genuine consumer. Keyboard, mouse, paste, and platform APIs are carriers; the child requires copied content or a reconstructable result.
  stealth_characteristics:
    paragraphs:
    - zh: 消费者前输入流旁路使真实应用、页面和身份服务无需被修改，认证记录也不必包含读取者。短窗只检查登录页完整性或异常认证结果时，副本可能落在观察范围之外。残余痕迹包括新输入监控授权、非批准进程访问 /dev/input、低层 Hook 或事件 tap、字符缓冲文件以及观察进程的网络连接；合法输入法、辅助功能与远程支持会产生强反例。
      en: Pre-Consumer Input-Stream Bypass can leave the genuine app, page, and identity service unchanged, and authentication records need not identify the observer. A short window limited to login-page integrity or anomalous authentication outcomes may miss the copy. Residual traces include new input-monitoring authority, an unapproved process accessing /dev/input, a low-level hook or event tap, character-buffer files, and network connections from the observing process. Legitimate input methods, accessibility, and remote support are strong counterexamples.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入必须证明观察点先于预期消费者并有认证内容结果。安装 Hook、轮询按键状态、取得 TCC 权限或读取设备句柄但没有字符、字段或可验证缓冲结果时，仅是能力。屏幕 OCR 归 T1113，读取剪贴板中长期保存的秘密可能归 T1552；只有粘贴作为当前认证输入且复制与提交事件可关联时才纳入。窗口条件若决定何时开始观察，由 NJS-0132-001 记录该门控，不在这里形成兄弟项。
      en: Inclusion requires an observation point before the intended consumer and an authentication-content result. Hook installation, key-state polling, TCC authority, or an input-device handle without characters, fields, or a verifiable buffer is capability only. Screen OCR belongs to T1113, and reading a secret long resident on the clipboard may belong to T1552; paste is included only when it is current authentication input and the copy can be joined to submission. If window state decides when observation begins, NJS-0132-001 records that gate and it does not form a sibling here.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者在登录用户的终端驻留，等待用户向 VPN、密码管理器、管理员工具或云门户输入秘密，并由低层键盘 Hook、macOS event tap 或 Linux 输入设备读取复制内容。DRBControl 在 RDP 会话运行键盘记录线程并把窗口和进程上下文写入混淆文件，说明输入事件、上下文和输出可以在真实应用之外形成独立采集链。
        en: An adversary resident on a logged-in endpoint waits for a user to enter a secret into a VPN, password manager, administrative tool, or cloud portal, then copies it through a low-level keyboard hook, macOS event tap, or Linux input-device read. DRBControl ran a keylogging thread in RDP sessions and wrote window and process context to an obfuscated file, showing that input events, context, and output can form a separate acquisition chain outside the genuine app.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要访问目标交互会话或全局输入面，并能够把事件转换为正确布局下的字符、识别认证上下文并保存结果。输入权限、会话隔离、secure desktop、驱动保护、应用沙箱和用户未输入秘密都会限制结果；长时间观察增加驻留与输出痕迹。
          en: The attacker needs access to the target interactive session or global input surface and must translate events into characters under the correct layout, identify authentication context, and preserve the result. Input permissions, session isolation, secure desktop, driver protection, app sandboxing, and the user's failure to enter a secret constrain results; prolonged observation increases dwell and output traces.
      defender_model:
        paragraphs:
        - zh: 防守方需要经过实测的 API、设备或权限遥测和进程输出数据。Windows 的常规 Sysmon 不能直接证明 SetWindowsHookEx 调用；macOS TCC 只说明授权；Linux auditd 需预置 /dev/input 规则。只有把输入面访问与同进程缓冲或外联关联，才能从暴露升级为捕获结论。
          en: The defender needs pilot-validated API, device, or permission telemetry plus process-output data. Routine Sysmon does not directly establish SetWindowsHookEx calls, macOS TCC establishes authority only, and Linux auditd needs preconfigured /dev/input rules. Only a join between input-surface access and a same-process buffer or egress can elevate exposure to a capture conclusion.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 输入副本形成在真实消费者之外并避开其审计语义
      en: The input copy forms outside the genuine consumer and its audit semantics
    analysis:
      paragraphs:
      - zh: 攻击者把观察点放在事件进入消费者之前，真实应用仍接收相同输入并生成相同认证事务，但无法从自身日志解释另一个进程已经复制内容。关键行为从应用审计移到端点输入权限、API 或设备面；若这些面未采集，捕获不进入常规观察。Microsoft 与 Apple 文档证明观察能力和授权边界，DRBControl 证明独立键盘记录输出；资料未量化告警降低。
        en: The adversary places observation before the event reaches the consumer. The genuine app receives the same input and creates the same authentication transaction, but its logs cannot explain that another process copied content. The critical behavior moves from application audit to endpoint input authority, API, or device surfaces; without those sensors, capture remains outside routine observation. Microsoft and Apple document observation capability and authority boundaries, while DRBControl establishes separate keylogging output; the sources do not quantify alert reduction.
    evidence_keys:
    - TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL
    - TA0006-004-T1056-REF-APPLE-INPUT
    - TA0006-004-T1056-REF-TRENDMICRO-DRBCONTROL
    confidence: medium
  evidence_keys:
  - TA0006-004-T1056-REF-ATTACK
  - TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL
  - TA0006-004-T1056-REF-APPLE-INPUT
  - TA0006-004-T1056-REF-TRENDMICRO-DRBCONTROL
  defense_keys:
  - TA0006-004-T1056-DET-STREAM
  - TA0006-004-T1056-NJA-STREAM
  - TA0006-004-T1056-MIT-INPUT-AUTHORITY
  limitations:
    paragraphs:
    - zh: 公开案例通常证明键盘记录能力、文件或输出，不公开真实秘密内容和每次成功率。Hook、事件 tap 与设备读取在平台上可由合法软件使用，API 调用也可能没有默认日志。正式结论必须按部署验证传感器，并避免为了检测而集中记录用户输入。
      en: Public cases commonly establish keylogging capability, files, or output without disclosing actual secrets or per-attempt success. Hooks, event taps, and device reads have legitimate uses, and API calls may lack default logs. Formal conclusions must validate sensors in the deployment and avoid centrally recording user input for detection.
- temporary_key: TA0006-004-T1056-CHILD-GENUINE
  name:
    zh: 真实消费者内提交镜像
    en: Genuine-Consumer Submission Shadowing
  summary:
    zh: 攻击代码寄生真实登录组件，在正常提交继续的同时复制认证字段，使正确来源与反馈掩盖额外接收者。
    en: Malicious code inhabits a genuine login component and copies authentication fields while normal submission continues, allowing the correct origin and feedback to mask an extra receiver.
  taxonomy_variable:
    zh: 输入副本是否由真实消费者内部新增的第二读取或输出路径产生
    en: Whether the input copy is produced by an added read or output path inside the genuine consumer
  counterfactual_trace:
    zh: 外部观察输入会留下独立观察进程或设备访问；消费者内镜像把读取者藏在原登录资产或进程身份下，异常集中于完整性、运行态与第二输出。
    en: External observation leaves a separate observer process or device access; in-consumer shadowing places the reader under the original login asset or process identity and concentrates anomalies in integrity, runtime, and secondary output.
  definition_and_concept:
    paragraphs:
    - zh: 真实消费者内提交镜像是攻击者修改、注入或动态改写用户本来就应信任的登录页、浏览器组件、VPN 门户或认证服务，使输入字段在沿原路径提交的同时被复制到第二缓冲区或目的地。稳定变量是“真实消费者身份未变但内部出现额外接收路径”，不是 Web、JavaScript、API Hook 或产品名称。只有实际字段或明文进入第二结果才成立。
      en: Genuine-Consumer Submission Shadowing modifies, injects into, or dynamically rewrites a login page, browser component, VPN portal, or authentication service the user is already supposed to trust, copying fields to a second buffer or destination while submission follows the original path. The stable variable is an unchanged genuine-consumer identity with an added internal receiver, not web, JavaScript, API hooking, or a product name. The child requires actual fields or plaintext entering the second result.
  stealth_characteristics:
    paragraphs:
    - zh: 真实消费者内提交镜像保留正确域名、证书、品牌、用户动作和常见成功反馈，服务端也可能记录正常认证，因此基于仿冒域名或失败登录的规则可能完全不触发。残余差异存在于登录资源哈希和部署来源、异常模块或 instrumentation、认证进程内存变化、第二网络目的地和凭据缓冲文件。Lumen 的 VersaMem 以内存方式改写方法且不修改 Java 文件，说明只做磁盘完整性检查仍可能失去关键路径。
      en: Genuine-Consumer Submission Shadowing preserves the correct domain, certificate, brand, user action, and common success feedback, while the server may record a normal authentication, so rules based on lookalike domains or failed sign-ins can remain silent. Residual differences lie in login-resource hashes and deployment provenance, anomalous modules or instrumentation, authentication-process memory changes, a second network destination, and credential-buffer files. Lumen's VersaMem rewrote a method in memory without changing Java files, showing that disk-only integrity checks can miss the critical path.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入需要真实登录消费者、未经批准的内部改动、实际认证输入副本和第二输出链。读取用户已登录后查看的页面内容归 NJT-0145；修改认证判定、增加万能口令或持久接受条件归 T1556；窃取结果 Cookie 或令牌归 T1539/T1528。正常 APM、反欺诈、DLP、密码管理器和批准的页面分析也可在消费者内观察字段或请求，必须核对数据最小化、部署签名、批准目的和输出接收方。
      en: Inclusion requires a genuine login consumer, an unauthorized internal change, an actual authentication-input copy, and a second output chain. Reading page content viewed after sign-in belongs to NJT-0145; changing the authentication decision, adding a master password, or creating a durable acceptance condition belongs to T1556; stealing the resulting cookie or token belongs to T1539 or T1528. Approved APM, antifraud, DLP, password managers, and page analytics can also observe fields or requests inside a consumer, requiring checks of data minimization, deployment signature, approved purpose, and output recipient.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: Volexity 观察到攻击者修改 Ivanti Connect Secure 真实登录页加载的 JavaScript，使 Login 函数把用户名和口令另送攻击者域；Lumen 分析的 VersaMem 动态改写 Versa 认证服务的 setUserPassword 方法，截获明文、加密后写入临时文件。这两项分别展示客户端登录资产与服务端运行态，但共同变量是原消费者内部形成第二接收路径。
        en: Volexity observed an attacker modify JavaScript loaded by a genuine Ivanti Connect Secure login page so the Login function sent usernames and passwords to an attacker domain. Lumen analyzed VersaMem dynamically rewriting the Versa authentication service's setUserPassword method, intercepting plaintext, encrypting it, and writing a temporary file. These show client login assets and server runtime respectively, but share the internal second receiver within the original consumer.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要登录资产写权限、Web 根或部署链控制、认证进程附着或字节码 instrumentation，并理解字段、方法和正常流程，避免破坏登录。只取得设备管理权但不能进入消费者代码或输出字段不足；更新、重启、外部完整性检查、只读系统分区和受限服务外联会缩短驻留或暴露第二路径。
          en: The attacker needs login-asset write authority, web-root or deployment-chain control, authentication-process attachment or bytecode instrumentation, and enough knowledge of fields, methods, and normal flow to avoid breaking sign-in. Appliance administration without consumer-code or field-output access is insufficient. Updates, restarts, external integrity checks, read-only system partitions, and constrained service egress can shorten residence or expose the second path.
      defender_model:
        paragraphs:
        - zh: 防守方需要来自可信构建或厂商镜像的登录资产清单、部署身份与哈希，以及认证进程模块、内存改写、临时文件和外联数据。内置完整性检查若可被同一设备管理员修改，不能成为唯一权威；只见一次正常登录也不能排除副本。应在外部控制面保存基线并把资产或运行态差异连接到同次提交的第二输出。
          en: The defender needs a login-asset inventory, deployment identity, and hashes from a trusted build or vendor image, plus authentication-process module, memory modification, temporary-file, and egress data. An integrity checker alterable by the same appliance administrator cannot be the sole authority, and one normal sign-in does not exclude a copy. Baselines should be retained in an external control plane and asset or runtime differences joined to a second output around the same submission.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 恶意接收路径寄生真实登录消费者身份
      en: A malicious receiver inhabits the genuine login consumer identity
    analysis:
      paragraphs:
      - zh: 攻击者不替换用户选择的站点或程序，而是在真实消费者内部增加复制逻辑。用户、浏览器和身份服务继续看到预期来源与结果，恶意实体借用原组件的品牌、证书、进程和网络位置而难以与正常提交区分。Volexity 的登录脚本改动与 Lumen 的内存方法改写直接支持两种实现；它们留下不同完整性痕迹，因此检测必须同时覆盖静态资产和运行态。
        en: The adversary does not replace the site or program selected by the user, but adds copy logic inside the genuine consumer. The user, browser, and identity service continue to see the expected origin and result, while the malicious entity borrows the component's brand, certificate, process, and network location. Volexity's login-script change and Lumen's in-memory method rewrite directly support two implementations; they leave different integrity traces, so detection must cover both static assets and runtime.
    evidence_keys:
    - TA0006-004-T1056-REF-VOLEXITY-IVANTI
    - TA0006-004-T1056-REF-LUMEN-VERSA
    confidence: high
  evidence_keys:
  - TA0006-004-T1056-REF-ATTACK
  - TA0006-004-T1056-REF-VOLEXITY-IVANTI
  - TA0006-004-T1056-REF-LUMEN-VERSA
  defense_keys:
  - TA0006-004-T1056-DET-GENUINE
  - TA0006-004-T1056-NJA-ASSET
  - TA0006-004-T1056-NJA-RUNTIME
  - TA0006-004-T1056-MIT-CONSUMER-INTEGRITY
  limitations:
    paragraphs:
    - zh: Ivanti 与 Versa 证据来自特定设备和实现，不能推断所有门户都有同一目录、方法或传感器。正常登录成功不能证明输入未被复制，资产差异也不能单独证明字段已外流。正式案例应保留恶意改动、输入结果和第二输出之间的同事件链。
      en: Ivanti and Versa evidence concerns specific appliances and implementations and cannot establish the same directories, methods, or sensors for every portal. A successful normal sign-in does not prove input was not copied, while an asset difference alone does not prove fields left. A formal case should preserve a same-event chain among malicious change, input result, and second output.
- temporary_key: TA0006-004-T1056-CHILD-IMPERSONATED
  name:
    zh: 仿冒消费者诱导取密
    en: Impersonated-Consumer Credential Elicitation
  summary:
    zh: 攻击者用仿冒系统提示或登录来源接收用户主动输入，使品牌和界面相似性掩盖接收者身份差异。
    en: The adversary receives user-entered secrets through an impersonated system prompt or login origin, allowing brand and interface similarity to mask receiver identity.
  taxonomy_variable:
    zh: 呈现给用户的消费者身份是否由攻击者控制并冒充预期接收者
    en: Whether the consumer identity presented to the user is attacker-controlled and impersonates the intended receiver
  counterfactual_trace:
    zh: 真实消费者内镜像保留真正 origin 或进程但改变其内部；仿冒消费者保留外观却改变进程、secure desktop、域名、证书或表单提交归属。
    en: Genuine-consumer shadowing retains the true origin or process but changes its interior; impersonation retains appearance while changing process, secure desktop, domain, certificate, or form-submission ownership.
  definition_and_concept:
    paragraphs:
    - zh: 仿冒消费者诱导取密是攻击者呈现看似属于操作系统、安装器、浏览器、身份提供方或业务服务的输入界面，并把用户提交的认证秘密交给攻击者控制的进程、页面或服务。直接目标是通过接收者身份伪装让用户主动产生输入。原生对话框、HTML、云托管和 TLS 都只是外观材料；稳定边界是展示身份与真实控制者不一致并有实际内容结果。
      en: Impersonated-Consumer Credential Elicitation presents an input interface that appears to belong to an operating system, installer, browser, identity provider, or business service while delivering the submitted authentication secret to an attacker-controlled process, page, or service. Its direct objective is user-generated input under disguised receiver identity. A native dialog, HTML, cloud hosting, and TLS are appearance materials only; the stable boundary is a mismatch between presented identity and true controller with an actual content result.
  stealth_characteristics:
    paragraphs:
    - zh: 仿冒消费者诱导取密让恶意页面或提示继承熟悉品牌、图标、措辞和工作流，有时使用合法云托管或原生脚本接口，降低用户和仅看外观的审查者区分能力。残余差异包括非标准父进程、缺少 secure desktop、未批准脚本解释器、异常域名或重定向链、证书主体、表单目标和身份提供方没有对应认证事务。页面漂亮、使用 HTTPS 或用户输入正确口令均不证明接收者合法。
      en: Impersonated-Consumer Credential Elicitation gives a malicious page or prompt familiar branding, icons, wording, and workflow, sometimes through legitimate cloud hosting or native scripting interfaces, reducing discrimination by the user or a reviewer focused on appearance. Residual differences include a nonstandard parent process, absence of secure desktop, an unapproved script interpreter, anomalous domain or redirect chain, certificate subject, form destination, and no corresponding identity-provider transaction. A polished page, HTTPS, or a correct password does not establish a legitimate receiver.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入需要仿冒身份、用户实际输入、攻击者控制的接收结果和 Credential Access 目的。只发送钓鱼链接、显示品牌页面或弹出空提示而没有提交结果仍属前置行为。真实企业 SSO 重定向、管理员授权框、软件安装、远程支持、密码管理器自动填充和安全意识演练可能相似；需检查来源、工单、应用签名、表单目标和身份事务。实时代理若还改变认证通信路径可并列 NJT-0136，但本项仍需输入被攻击者接收。
      en: Inclusion requires an impersonated identity, actual user input, an attacker-controlled receiving result, and a Credential Access purpose. Sending a phishing link, displaying branded content, or showing an empty prompt without a submission result remains precursor behavior. Genuine enterprise SSO redirects, administrator authorization dialogs, software installation, remote support, password-manager autofill, and awareness exercises can look similar; origin, ticket, app signature, form target, and identity transaction must be checked. A real-time proxy that also changes the authentication communication path may additionally qualify for NJT-0136, but this child still requires attacker receipt of input.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: Mandiant 观察到 APT42 以假 Google、Microsoft、Yahoo 和 Google Meet 页面收集输入，部分页面借 Google Sites 增强可信外观并把凭据送往攻击者域。Unit 42 分析的 Koi Stealer 使用 AppleScript 风格对话框冒充 Visual Studio 更新，反复要求 root 口令并把取得的用户名和口令送往 C2。两者跨 Web 和本地 GUI，共同变量是消费者身份伪装。
        en: Mandiant observed APT42 collect input with fake Google, Microsoft, Yahoo, and Google Meet pages, including pages hosted on Google Sites to improve credibility while sending credentials to attacker infrastructure. Unit 42 analyzed Koi Stealer using an AppleScript-style dialog impersonating a Visual Studio update, repeatedly requesting a root password and sending the obtained username and password to C2. These span web and local GUI but share consumer-identity impersonation.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要把界面呈现给目标、复现足够可信的品牌与工作流并控制提交接收端。本地分支需要执行脚本或应用并处理输入；Web 分支需要域名、托管、重定向或受信平台内容。密码管理器不在错误 origin 自动填充、WebAuthn 验证者绑定、secure desktop、浏览器告警和用户独立核验会降低成功率。
          en: The attacker must present the interface to the target, reproduce sufficiently credible branding and workflow, and control the submission receiver. The local branch needs script or app execution and input handling; the web branch needs a domain, hosting, redirect, or content on a trusted platform. Password managers refusing autofill on the wrong origin, WebAuthn verifier binding, secure desktop, browser warnings, and independent user verification reduce success.
      defender_model:
        paragraphs:
        - zh: 防守方可关联进程与脚本、窗口安全上下文、浏览器导航、DNS 和证书、表单提交元数据以及 IdP 事务，但不应记录字段值。受管浏览器外、端到端加密且没有端点传感器、合法云托管多租户和新建业务域会削弱归因。检测结论应说明是仿冒入口、疑似提交还是已证实攻击者接收。
          en: The defender can join process and script lineage, window security context, browser navigation, DNS and certificate data, form-submission metadata, and IdP transactions without recording field values. Unmanaged browsers, end-to-end encryption without endpoint sensors, legitimate multitenant cloud hosting, and newly created business domains weaken attribution. Detection output should distinguish an impersonated entry, suspected submission, and confirmed attacker receipt.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 品牌与原生界面特征伪装攻击者控制的输入接收者
      en: Brand and native-interface features disguise an attacker-controlled input receiver
    analysis:
      paragraphs:
      - zh: 攻击者复制用户用于判断接收者的视觉与工作流特征，却把提交绑定到另一个进程或 origin。防守方能够看到提示或页面，但若未验证进程谱系、secure desktop、origin 和 IdP 对应事务，难以把相似外观准确归为恶意。APT42 与 Koi Stealer 分别直接证明 Web 与本地界面的仿冒及输入结果；它们不证明所有用户都会受骗。
        en: The adversary copies visual and workflow features the user uses to identify a receiver while binding submission to another process or origin. The prompt or page remains visible, but without process lineage, secure-desktop, origin, and corresponding IdP-transaction checks, defenders can struggle to classify the similar appearance as malicious. APT42 and Koi Stealer directly establish web and local interface impersonation plus input results; they do not show every user will be deceived.
    evidence_keys:
    - TA0006-004-T1056-REF-MANDIANT-APT42
    - TA0006-004-T1056-REF-UNIT42-KOI
    confidence: high
  evidence_keys:
  - TA0006-004-T1056-REF-ATTACK
  - TA0006-004-T1056-REF-MANDIANT-APT42
  - TA0006-004-T1056-REF-UNIT42-KOI
  - REF-000499
  defense_keys:
  - TA0006-004-T1056-DET-IMPERSONATED
  - TA0006-004-T1056-NJA-LOCAL-PROMPT
  - TA0006-004-T1056-NJA-WEB-ORIGIN
  - TA0006-004-T1056-MIT-VERIFIED-SURFACE
  limitations:
    paragraphs:
    - zh: 公开报告通常展示页面、对话框、域名和样本输出，不提供完整用户群基线或误报率。合法 IdP 重定向、云托管应用和脚本化管理提示具有相似外观；没有提交结果时不能从诱饵存在推断秘密已获。抗钓鱼认证降低可重放秘密价值，但不能阻止端点恶意代码读取其他输入。
      en: Public reports commonly show pages, dialogs, domains, and sample output without a complete user-population baseline or false-positive rate. Legitimate IdP redirects, cloud-hosted apps, and scripted administration prompts can look similar. A lure does not establish secret acquisition without a submission result. Phishing-resistant authentication reduces reusable-secret value but does not stop endpoint malware from reading other input.
defense_candidates:
  detection_strategies:
  - temporary_key: TA0006-004-T1056-DET-STREAM
    name:
      zh: 输入观察权限到捕获输出关联
      en: Input Observation Authority to Capture Output Correlation
    objective:
      zh: 将未批准的全局输入观察、设备读取或事件 Hook 与同进程缓冲和外联连接，区分能力、暴露与实际捕获。
      en: Join unapproved global input observation, device reads, or event hooks to same-process buffers and egress, distinguishing capability, exposure, and actual capture.
    detects_keys:
    - TA0006-004-T1056-CHILD-PRECONSUMER
    analytic_keys:
    - TA0006-004-T1056-NJA-STREAM
  - temporary_key: TA0006-004-T1056-DET-GENUINE
    name:
      zh: 登录消费者完整性与第二输出关联
      en: Login Consumer Integrity and Secondary Output Correlation
    objective:
      zh: 同时检查登录资产与认证运行态，并把未批准差异连接到同次提交附近的第二文件或网络输出。
      en: Check both login assets and authentication runtime and join unauthorized differences to a secondary file or network output around the same submission.
    detects_keys:
    - TA0006-004-T1056-CHILD-GENUINE
    analytic_keys:
    - TA0006-004-T1056-NJA-ASSET
    - TA0006-004-T1056-NJA-RUNTIME
  - temporary_key: TA0006-004-T1056-DET-IMPERSONATED
    name:
      zh: 输入界面身份与真实接收者差分
      en: Input Interface Identity and True Receiver Differential
    objective:
      zh: 对比本地提示或 Web 登录的呈现身份、进程或 origin、提交目标和权威身份事务，识别仿冒接收者。
      en: Compare the presented identity, process or origin, submission target, and authoritative identity transaction for local prompts and web sign-ins to identify an impersonated receiver.
    detects_keys:
    - TA0006-004-T1056-CHILD-IMPERSONATED
    analytic_keys:
    - TA0006-004-T1056-NJA-LOCAL-PROMPT
    - TA0006-004-T1056-NJA-WEB-ORIGIN
  detection_analytics:
  - temporary_key: TA0006-004-T1056-NJA-STREAM
    strategy_key: TA0006-004-T1056-DET-STREAM
    name:
      zh: 全局输入观察与输出链分析
      en: Global Input Observation and Output-Chain Analytic
    platforms: [Windows, Linux, macOS]
    logic:
      zh: 以 host、user、session 和 process 为键，识别首次或未批准的全局键盘/鼠标 Hook、event tap、Input Monitoring 授权、/dev/input open/read 或等效输入观察；在三十分钟内关联同进程或子进程的字符缓冲文件、重复小写入、剪贴板/窗口上下文读取和新外联。只有出现输入内容结果或经实验验证的捕获输出才标为 capture；单独权限或 API 调用标为 exposure。Windows API 分支要求 EDR 已验证提供调用及参数，不能用 Sysmon Event 10 冒充 Hook 日志。
      en: Join host, user, session, and process to identify first-seen or unapproved global keyboard or mouse hooks, event taps, Input Monitoring authority, /dev/input open or read activity, or equivalent observation. Within thirty minutes, correlate same-process or child-process character buffers, repeated small writes, clipboard or window-context reads, and new egress. Label capture only with an input-content result or lab-validated capture output; permission or an API call alone is exposure. The Windows API branch requires EDR-validated call and parameter telemetry and must not treat Sysmon Event 10 as a hook log.
    data_requirements:
    - source_type: endpoint_input_observation
      name:
        zh: 端点输入观察与权限事件
        en: Endpoint input observation and authority events
      channel: validated EDR API telemetry, macOS TCC/unified log, or Linux auditd input-device rules
      required_fields: [timestamp, host_id, user_id, session_id, process_guid, image_path, signer, operation, target_surface, result]
    - source_type: endpoint_file_network
      name:
        zh: 观察进程文件与网络结果
        en: Observer process file and network outcomes
      channel: EDR file and network telemetry
      required_fields: [timestamp, host_id, process_guid, parent_process_guid, file_path, bytes_written, destination, bytes_out]
    - source_type: approved_input_software_inventory
      name:
        zh: 获批输入软件与用途清单
        en: Approved input software and purpose inventory
      channel: endpoint management or CMDB
      required_fields: [image_path, signer, version, approved_scope, owner, expiry]
    observables: [unapproved_global_input_observer, input_device_read, new_input_monitoring_grant, character_buffer_output, observer_process_egress]
    correlation:
      window: 30m
      dimensions: [host_id, user_id, session_id, process_guid, signer, target_surface, destination]
    false_positives:
      zh: 输入法、屏幕阅读器、远程支持、游戏覆盖层、自动化测试、密码管理器和安全代理可合法观察输入；必须核对精确签名、版本、会话、目标范围、工单与期限，不能按产品名整体放行。
      en: Input methods, screen readers, remote support, game overlays, automation tests, password managers, and security agents can legitimately observe input. Check exact signer, version, session, target scope, ticket, and expiry rather than allowlisting a product name.
    blind_spots:
      zh: Windows 默认日志不记录低层 Hook，内核或同进程路径可绕开 API 传感器；TCC 只表示授权，auditd 未预置规则就没有历史事件；内存缓冲且随正常进程外传时可能没有文件。
      en: Default Windows logs do not record low-level hooks, and kernel or in-process paths can bypass API sensors. TCC shows authority only, auditd has no historical event without prior rules, and an in-memory buffer leaving with a normal process may create no file.
    tuning_guidance:
      zh: 先在试点验证每个平台的 operation 与 process 字段，再按用户、session 和目标应用建立批准图；对新签名、无工单授权、后台服务观察交互会话及观察后外联提高权重，同时保留最小化且不含真实按键内容的元数据。
      en: Pilot-validate operation and process fields per platform, then baseline approved users, sessions, and target apps. Raise weight for new signers, unticketed grants, background services observing interactive sessions, and post-observation egress, while retaining only minimized metadata without actual keystroke content.
    evidence_keys:
    - TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL
    - TA0006-004-T1056-REF-APPLE-INPUT
    - TA0006-004-T1056-REF-TRENDMICRO-DRBCONTROL
    - TA0006-004-T1056-REF-ATTACK-DET-INPUT
  - temporary_key: TA0006-004-T1056-NJA-ASSET
    strategy_key: TA0006-004-T1056-DET-GENUINE
    name:
      zh: 登录资产变更与第二提交目标关联
      en: Login-Asset Change and Secondary Submission-Target Correlation
    platforms: [Linux, Network Devices, Windows]
    logic:
      zh: 从外部可信仓库取得 VPN、SSO、Webmail 和管理门户登录脚本、模板与静态资源的版本和哈希，检测非批准写入、部署者或 bundle 差异；在变更后二十四小时内关联登录请求时浏览器到非批准域的第二连接、Web 进程新文件或异常服务外联。只见差异标 integrity failure；与第二输出同现才标 suspected capture，字段值不得进入日志。
      en: Obtain versions and hashes for VPN, SSO, webmail, and administration-portal login scripts, templates, and static resources from an externally trusted repository. Detect unauthorized writes, deployers, or bundle differences, then within twenty-four hours join a second browser connection to an unapproved domain during sign-in, a new file from the web process, or anomalous service egress. A difference alone is an integrity failure; co-occurrence with a second output is suspected capture, and field values must not enter logs.
    data_requirements:
    - source_type: login_asset_integrity
      name:
        zh: 登录资产版本与完整性
        en: Login asset version and integrity
      channel: external deployment inventory and file integrity monitor
      required_fields: [timestamp, appliance_id, asset_path, expected_hash, observed_hash, deployment_id, writer_identity, result]
    - source_type: web_authentication_flow
      name:
        zh: Web 登录事务与网络元数据
        en: Web sign-in transaction and network metadata
      channel: reverse proxy, browser, or appliance network telemetry
      required_fields: [timestamp, appliance_id, client_session_id, origin, request_path, destination_domain, process_id, bytes_out]
    observables: [login_asset_hash_drift, unapproved_login_asset_write, secondary_form_destination, web_process_output_after_signin]
    correlation:
      window: 24h-after-change-and-15m-around-signin
      dimensions: [appliance_id, asset_path, deployment_id, client_session_id, process_id, destination_domain]
    false_positives:
      zh: 紧急补丁、品牌定制、A/B 测试、CDN 更新和批准的反欺诈脚本会改变登录资产或增加连接；须核对签名制品、变更单、内容安全策略和接收方数据合同。
      en: Emergency patches, branding, A/B tests, CDN updates, and approved antifraud scripts can change login assets or add connections. Check signed artifacts, change records, content-security policy, and recipient data contracts.
    blind_spots:
      zh: 内置检查器可被同一高权攻击者篡改；运行态改写不改变文件，TLS 或浏览器端脚本可能隐藏提交内容；没有外部黄金基线就无法可靠判定设备自身报告。
      en: A built-in checker can be altered by the same privileged attacker, runtime rewriting changes no file, and TLS or browser-local scripts can conceal submission content. Device self-report is unreliable without an external golden baseline.
    tuning_guidance:
      zh: 对资产路径、设备版本和批准部署 ID 建严格允许图，外部保存黄金哈希；对变更后首次登录、跨域第二目的地和 Web 进程新输出提高权重，不能把所有厂商目录或 CDN 整体白名单化。
      en: Build a strict allow graph for asset path, appliance version, and approved deployment ID and retain golden hashes externally. Prioritize first sign-ins after change, cross-origin secondary destinations, and new web-process output without globally allowlisting vendor directories or CDNs.
    evidence_keys:
    - TA0006-004-T1056-REF-VOLEXITY-IVANTI
    - TA0006-004-T1056-REF-ATTACK-DET-PORTAL
  - temporary_key: TA0006-004-T1056-NJA-RUNTIME
    strategy_key: TA0006-004-T1056-DET-GENUINE
    name:
      zh: 认证运行态改写与凭据缓冲结果关联
      en: Authentication Runtime Rewrite and Credential-Buffer Outcome Correlation
    platforms: [Linux, Windows, macOS]
    logic:
      zh: 对登记的认证进程建立模块、agent、类转换器、可执行映射和启动参数基线，识别未批准附着、远程线程、库预加载、Java instrumentation 或代码段差异；在六十分钟内关联认证进程或其子进程创建的隐藏临时文件、重复加密小记录或非业务外联。进程访问或模块变化本身只标 runtime exposure，需输出链才升级。
      en: Baseline modules, agents, class transformers, executable mappings, and launch arguments for registered authentication processes. Identify unapproved attachment, remote thread, library preload, Java instrumentation, or code-segment difference, then within sixty minutes join hidden temporary files, repeated small encrypted records, or nonbusiness egress from the authentication process or child. Process access or module change alone is runtime exposure and requires an output chain for elevation.
    data_requirements:
    - source_type: authentication_process_integrity
      name:
        zh: 认证进程运行态完整性
        en: Authentication process runtime integrity
      channel: EDR module, process-access, memory-map, or application-runtime telemetry
      required_fields: [timestamp, host_id, process_guid, process_image, signer, module_or_agent, operation, source_process_guid, code_hash]
    - source_type: authentication_process_output
      name:
        zh: 认证进程文件与外联输出
        en: Authentication process file and egress output
      channel: EDR file and network telemetry
      required_fields: [timestamp, host_id, process_guid, child_process_guid, file_path, file_size, destination, bytes_out]
    observables: [unapproved_auth_process_instrumentation, authentication_code_hash_drift, hidden_repeated_buffer, authentication_service_new_egress]
    correlation:
      window: 60m
      dimensions: [host_id, process_guid, source_process_guid, module_or_agent, file_path, destination]
    false_positives:
      zh: APM、热补丁、诊断、性能分析、合法安全 agent 与应用升级会改变认证运行态；应核对签名、维护窗、部署来源和预期输出，而非仅按进程名抑制。
      en: APM, hot patching, diagnostics, profiling, approved security agents, and app upgrades change authentication runtime. Check signer, maintenance window, deployment origin, and expected output rather than suppressing by process name.
    blind_spots:
      zh: 同进程内存改写可能没有模块加载或外部句柄；Sysmon Event 7 默认关闭，Event 10 高噪声且不证明读到字段；加密临时记录无法仅凭内容确认是凭据。
      en: In-process memory rewriting may have no module load or external handle. Sysmon Event 7 is disabled by default, Event 10 is noisy and does not prove field reads, and encrypted temporary records cannot be identified as credentials from content alone.
    tuning_guidance:
      zh: 按精确认证进程版本和批准 agent 建运行态清单，先在实验环境验证可见字段；对无部署记录的 instrumentation、认证时间附近的新隐藏文件和首次目的地提高权重，并把正常 APM 例外限定到版本和期限。
      en: Inventory exact authentication-process versions and approved agents and validate visible fields in a lab. Prioritize undocumented instrumentation, new hidden files around authentication, and first destinations, and constrain normal APM exceptions by version and expiry.
    evidence_keys:
    - TA0006-004-T1056-REF-LUMEN-VERSA
    - REF-000366
    - TA0006-004-T1056-REF-ATTACK-DET-HOOK
  - temporary_key: TA0006-004-T1056-NJA-LOCAL-PROMPT
    strategy_key: TA0006-004-T1056-DET-IMPERSONATED
    name:
      zh: 本地凭据提示来源与安全上下文差分
      en: Local Credential-Prompt Origin and Security-Context Differential
    platforms: [Windows, Linux, macOS]
    logic:
      zh: 识别由 PowerShell、AppleScript/osascript、shell、zenity/kdialog、未批准应用或异常父进程产生的凭据样式提示，记录窗口所属进程、签名、session、secure desktop 或等价安全上下文；在十五分钟内关联同进程文件写入或外联。提示存在只标 impersonation lead，需用户提交后的结果链才标 suspected capture，禁止记录输入值。
      en: Identify credential-like prompts generated by PowerShell, AppleScript or osascript, shell, zenity or kdialog, an unapproved app, or an anomalous parent. Record owning process, signer, session, and secure desktop or equivalent security context, then within fifteen minutes join same-process file writes or egress. A prompt alone is an impersonation lead; a post-submission outcome is required for suspected capture, and input values must not be logged.
    data_requirements:
    - source_type: endpoint_process_script_window
      name:
        zh: 进程、脚本与窗口来源
        en: Process, script, and window origin
      channel: EDR process/script telemetry and validated window metadata
      required_fields: [timestamp, host_id, user_id, session_id, process_guid, parent_process_guid, image_path, signer, script_interpreter, window_security_context]
    - source_type: endpoint_file_network
      name:
        zh: 提示进程的文件与网络结果
        en: Prompt-process file and network outcomes
      channel: EDR file and network telemetry
      required_fields: [timestamp, host_id, process_guid, file_path, destination, bytes_out]
    observables: [credential_like_prompt_from_unapproved_origin, prompt_outside_secure_context, prompt_process_output, prompt_process_egress]
    correlation:
      window: 15m
      dimensions: [host_id, user_id, session_id, process_guid, parent_process_guid, destination]
    false_positives:
      zh: 安装器、管理员工具、密钥串解锁、远程支持、企业脚本和无障碍流程会合法显示认证提示；须核对工单、签名、预期安全上下文及目标应用。
      en: Installers, administration tools, keychain unlock, remote support, enterprise scripts, and accessibility workflows legitimately display authentication prompts. Check ticket, signer, expected security context, and target app.
    blind_spots:
      zh: 通用端点日志通常不记录窗口内容或 secure desktop；恶意代码可寄生已批准进程，同进程内存外传可能没有子进程或文件。
      en: General endpoint logs often lack window content or secure-desktop state. Malicious code can inhabit an approved process, and in-process memory egress may have no child or file.
    tuning_guidance:
      zh: 为会显示凭据提示的精确二进制、父链、脚本哈希和维护时段建到期清单；优先处理后台脚本、无工单提示、非安全桌面和提示后首次外联，不以标题关键词单独阻断。
      en: Maintain an expiring inventory of exact binaries, parent chains, script hashes, and maintenance windows allowed to show credential prompts. Prioritize background scripts, unticketed prompts, nonsecure desktop, and first egress after a prompt, and do not block on title keywords alone.
    evidence_keys:
    - TA0006-004-T1056-REF-UNIT42-KOI
    - TA0006-004-T1056-REF-ATTACK-DET-GUI
  - temporary_key: TA0006-004-T1056-NJA-WEB-ORIGIN
    strategy_key: TA0006-004-T1056-DET-IMPERSONATED
    name:
      zh: 登录页面 Origin、提交目标与 IdP 事务差分
      en: Login Page Origin, Submission Target, and IdP Transaction Differential
    platforms: [Windows, Linux, macOS]
    logic:
      zh: 对受管浏览器的登录导航建立品牌与权威 IdP origin 清单，关联重定向链、证书、页面 origin、表单提交目标和十五分钟内的 IdP transaction_id。若页面声称某企业或 IdP 身份却把提交送往未授权 origin，或没有对应 IdP 请求而出现表单提交元数据，则标 impersonated receiver；不采集字段值。合法多租户回调必须以租户和应用注册验证。
      en: Maintain a brand-to-authoritative-IdP origin inventory for managed-browser sign-in navigation and join redirect chain, certificate, page origin, form destination, and IdP transaction_id within fifteen minutes. If a page claims an enterprise or IdP identity but sends submission to an unauthorized origin, or form-submission metadata appears without a corresponding IdP request, label an impersonated receiver without collecting field values. Validate legitimate multitenant callbacks against tenant and app registration.
    data_requirements:
    - source_type: browser_navigation_submission
      name:
        zh: 浏览器导航与表单提交元数据
        en: Browser navigation and form-submission metadata
      channel: managed browser, secure web gateway, or endpoint browser telemetry
      required_fields: [timestamp, device_id, user_id, browser_profile, page_origin, redirect_chain, certificate_subject, form_destination, request_method]
    - source_type: identity_provider_transaction
      name:
        zh: 权威身份提供方事务
        en: Authoritative identity-provider transaction
      channel: IdP sign-in and application registration logs
      required_fields: [timestamp, user_id, transaction_id, relying_party, redirect_uri, authentication_method, result]
    observables: [brand_origin_mismatch, unauthorized_form_destination, login_form_without_idp_transaction, cloud_hosted_credential_lure]
    correlation:
      window: 15m
      dimensions: [device_id, user_id, browser_profile, page_origin, form_destination, relying_party, transaction_id]
    false_positives:
      zh: 新 SSO 应用、合法代理、区域域名、测试租户、品牌外包和 IdP 故障页可能造成来源差；须核对应用注册、变更单、租户所有者和 redirect URI。
      en: New SSO apps, legitimate proxies, regional domains, test tenants, outsourced branding, and IdP error pages can create origin differences. Check app registration, change record, tenant owner, and redirect URI.
    blind_spots:
      zh: 未受管浏览器、缺少表单目标遥测、TLS 检查受限和攻击者使用已攻陷合法域会降低区分力；实时代理可能产生真实 IdP 事务，需要 NJT-0136 的路径关联。
      en: Unmanaged browsers, absent form-target telemetry, constrained TLS inspection, and compromised legitimate domains reduce discrimination. A real-time proxy may create a genuine IdP transaction and requires NJT-0136 path correlation.
    tuning_guidance:
      zh: 从 IdP 应用注册自动生成 origin 与 redirect URI 允许图，按租户和环境版本化；对新注册和维护期降权但保留原始链，优先处理无对应事务、提交到新域和密码管理器拒绝自动填充的页面。
      en: Generate a versioned origin and redirect-URI allow graph from IdP app registrations by tenant and environment. Down-weight approved new registrations and maintenance while retaining the raw chain, and prioritize pages with no corresponding transaction, submission to a new domain, or refused password-manager autofill.
    evidence_keys:
    - TA0006-004-T1056-REF-MANDIANT-APT42
    - TA0006-004-T1056-REF-ATTACK-DET-INPUT
    - REF-000499
  mitigations:
  - temporary_key: TA0006-004-T1056-MIT-INPUT-AUTHORITY
    name:
      zh: 输入观察权限最小化与隐私安全审计
      en: Input Observation Least Authority and Privacy-Safe Audit
    measures:
    - key: input-observer-allowlist
      control_type: preventive
      zh: 按签名、版本、所有者、目标应用和会话批准 Input Monitoring、辅助功能、全局 Hook 与输入设备访问，并设置到期复核。
      en: Approve Input Monitoring, accessibility, global hooks, and input-device access by signer, version, owner, target app, and session with expiry review.
    - key: secure-input-boundary
      control_type: exposure-reduction
      zh: 对高价值认证使用 secure desktop、受保护输入或等价隔离，限制普通进程、驱动和后台服务观察。
      en: Use secure desktop, protected input, or equivalent isolation for high-value authentication to limit observation by ordinary processes, drivers, and background services.
    - key: metadata-only-audit
      control_type: detective-support
      zh: 远程保留授权、API 或设备访问、进程和结果元数据，不集中保存真实按键或口令。
      en: Remotely retain authority, API or device access, process, and outcome metadata without centrally storing actual keystrokes or passwords.
    applications:
    - target_key: TA0006-004-T1056-CHILD-PRECONSUMER
      use:
        zh: 清点并最小化全局输入观察者，对新授权和设备读取连接进程输出；对 VPN、管理员入口和密码管理器解锁优先采用隔离输入面。
        en: Inventory and minimize global input observers, join new grants and device reads to process output, and prioritize isolated input surfaces for VPN, administration entry, and password-manager unlock.
      expected_effect:
        zh: 缩小可在消费者之前看到认证输入的主体集合，并为剩余观察者保留可追查来源。
        en: Reduce the set of principals able to see authentication input before the consumer and preserve attributable provenance for remaining observers.
      limitations:
        zh: 内核控制、已批准工具失陷或同一安全上下文内恶意代码仍可观察；严格限制会影响辅助功能、输入法和支持业务。
        en: Kernel control, compromise of an approved tool, or malicious code in the same security context can still observe input. Strict controls can disrupt accessibility, input methods, and support workflows.
    evidence_keys:
    - TA0006-004-T1056-REF-APPLE-INPUT
    - TA0006-004-T1056-REF-MICROSOFT-LOWLEVEL
    - TA0006-004-T1056-REF-ATTACK-DET-INPUT
  - temporary_key: TA0006-004-T1056-MIT-CONSUMER-INTEGRITY
    name:
      zh: 认证消费者静态与运行态完整性治理
      en: Authentication Consumer Static and Runtime Integrity Governance
    measures:
    - key: signed-login-assets
      control_type: preventive
      zh: 登录脚本、模板、组件和设备镜像只接受签名部署，限制 Web 根写入并在外部保存黄金哈希。
      en: Accept only signed deployment of login scripts, templates, components, and appliance images, restrict web-root writes, and retain golden hashes externally.
    - key: runtime-agent-control
      control_type: cost-increasing
      zh: 限制认证进程调试、附着、库预加载、instrumentation 和 agent 加载，登记精确版本并监测运行态差异。
      en: Restrict debugging, attachment, library preload, instrumentation, and agent loading for authentication processes, inventory exact versions, and monitor runtime differences.
    - key: auth-service-egress
      control_type: exposure-reduction
      zh: 将认证服务外联和可写临时位置限制到业务必要集合，禁止登录字段进入 APM、错误日志或第三方分析。
      en: Constrain authentication-service egress and writable temporary locations to business need and prevent login fields from entering APM, error logs, or third-party analytics.
    - key: external-integrity-response
      control_type: containment
      zh: 从外部控制面运行完整性检查；发现差异时隔离设备、恢复可信镜像并轮换在暴露窗口提交的凭据和会话。
      en: Run integrity checks from an external control plane; on a difference isolate the appliance, restore a trusted image, and rotate credentials and sessions submitted during the exposure window.
    applications:
    - target_key: TA0006-004-T1056-CHILD-GENUINE
      use:
        zh: 对 VPN、SSO、Webmail 和管理门户同时保护登录资产与认证进程，连接每次未批准变化到第二输出，并按暴露时间窗执行凭据响应。
        en: Protect both login assets and authentication processes for VPN, SSO, webmail, and administration portals, join every unauthorized change to secondary output, and perform credential response for the exposure window.
      expected_effect:
        zh: 提高在真实消费者内加入第二接收路径的成本，使静态或内存寄生更可能留下独立可验证差异，并限制结果外送。
        en: Raise the cost of adding a second receiver inside a genuine consumer, make static or memory residence more likely to leave an independently verifiable difference, and constrain result egress.
      limitations:
        zh: 同一供应链、签名身份或外部基线被攻陷会削弱控制；无重启运行态和合法 APM 需要精细例外，完整性差异仍不等于已获秘密。
        en: Compromise of the same supply chain, signing identity, or external baseline weakens the control. Long-lived runtime and legitimate APM need precise exceptions, and an integrity difference still does not equal an acquired secret.
    evidence_keys:
    - TA0006-004-T1056-REF-VOLEXITY-IVANTI
    - TA0006-004-T1056-REF-LUMEN-VERSA
    - REF-000366
  - temporary_key: TA0006-004-T1056-MIT-VERIFIED-SURFACE
    name:
      zh: 验证者绑定认证与可信输入界面
      en: Verifier-Bound Authentication and Trusted Input Surfaces
    measures:
    - key: phishing-resistant-authentication
      control_type: exposure-reduction
      zh: 对高价值账户使用基于通道或验证者名称绑定的抗钓鱼加密认证，减少可手工输入和重放的共享秘密。
      en: Use channel-bound or verifier-name-bound phishing-resistant cryptographic authentication for high-value accounts to reduce manually entered reusable shared secrets.
    - key: authoritative-origin-and-secure-prompt
      control_type: preventive
      zh: 维护 IdP origin、redirect URI 和本地安全提示实现清单，对系统级凭据请求使用 secure desktop 或等价可信路径。
      en: Maintain inventories of IdP origins, redirect URIs, and local secure-prompt implementations and use secure desktop or an equivalent trusted path for system credential requests.
    - key: origin-aware-autofill-and-reporting
      control_type: detective-support
      zh: 使用按 origin 自动填充的密码管理器、浏览器防钓鱼和用户一键上报，将拒绝自动填充或异常提示作为线索而非单独定罪。
      en: Use origin-aware password-manager autofill, browser anti-phishing, and one-action user reporting, treating refused autofill or an unusual prompt as a lead rather than proof.
    applications:
    - target_key: TA0006-004-T1056-CHILD-IMPERSONATED
      use:
        zh: 将企业登录收敛到登记 IdP 与本地可信提示，优先淘汰可在任意页面手工输入的口令和 OTP；对偏离 origin 或安全上下文的提示阻断或要求独立核验。
        en: Converge enterprise sign-in on registered IdPs and trusted local prompts, prioritize retiring passwords and OTPs manually enterable on any page, and block or independently verify prompts that depart from approved origin or security context.
      expected_effect:
        zh: 使仿冒页面无法为真实验证者生成可用的验证者绑定证明，并提高仿冒本地提示与可信系统路径的可区分性。
        en: Prevent an impersonated page from producing verifier-bound proof usable by the genuine verifier and improve distinction between an impersonated local prompt and a trusted system path.
      limitations:
        zh: 仍保留口令的旧系统、账户恢复和 OTP 会继续暴露；真实消费者被攻陷、端点会话被控制或用户输入其他敏感数据时，验证者绑定不能消除全部风险。
        en: Legacy systems, account recovery, and OTPs that retain manually entered secrets remain exposed. Verifier binding does not eliminate risk when the genuine consumer is compromised, the endpoint session is controlled, or the user enters other sensitive data.
    evidence_keys:
    - REF-000499
    - TA0006-004-T1056-REF-MANDIANT-APT42
    - TA0006-004-T1056-REF-UNIT42-KOI
