library_candidates:
  references:
    - temporary_key: TA0006-005-T1556-REF-MANDIANT-PTASPY
      resolution: create
      url: https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors
      locator: Mandiant-observed AADInternals use, PTA interception, cleartext PTASpy.csv, rogue PTA registration, credential harvesting, log and remediation guidance
      limit: Combines observed methodology with tool explanation; not every described path is tied to one disclosed victim
    - temporary_key: TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER
      resolution: create
      url: https://go.crowdstrike.com/rs/281-OBQ-266/images/report-crowdstrike-2023-threat-hunting-report.pdf
      locator: Pages 17-18, multiple Network Provider DLL intrusions, registry and DLL chain, mpnotify credential delivery, password write to disk, Exchange targeting
      limit: Aggregated hunting report omits victim identities and full per-event telemetry
    - temporary_key: TA0006-005-T1556-REF-MS-PASSWORDFILTER
      resolution: create
      url: https://learn.microsoft.com/en-us/windows/win32/api/ntsecapi/nc-ntsecapi-psam_password_filter_routine
      locator: PasswordFilter callback receives AccountName and new plaintext Password; all filters must accept before change succeeds; secure memory handling requirement
      limit: API semantics only; does not establish malicious deployment or telemetry availability
    - temporary_key: TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
      resolution: create
      url: https://learn.microsoft.com/en-us/windows/win32/api/npapi/nf-npapi-nplogonnotify
      locator: Credential manager DLL callback, session ID, authentication information from successful primary authentication, station and prior-authentication fields
      limit: Deprecated Windows API semantics; actual credential structure and audit detail vary by authenticator and version
    - temporary_key: TA0006-005-T1556-REF-LINUX-PAM-AUTHTOK
      resolution: create
      url: https://man7.org/linux/man-pages/man3/pam_get_authtok.3.html
      locator: PAM service modules can receive cached current or previous authentication tokens and reuse stacked-module tokens
      limit: Upstream API semantics only; does not prove a malicious PAM incident
    - temporary_key: TA0006-005-T1556-REF-MS-REVERSIBLE
      resolution: create
      url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption
      locator: Reversible passwords can be decrypted, setting is disabled by default, CHAP and Digest compatibility, existing passwords remain reversible after disable until changed
      limit: Product policy documentation; does not prove an in-the-wild adversary completed recovery
    - temporary_key: TA0006-005-T1556-REF-MS-EVENT4739
      resolution: create
      url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4739
      locator: Domain Policy change event fields and Password Properties bit values showing reversible password encryption enabled or disabled
      limit: Domain-level event only; fine-grained and account policy require additional sources, and the event does not prove material creation or recovery
  claims:
    - temporary_key: TA0006-005-T1556-CLM-TA0006
      resolution: create
      proposition_zh: 修改受信认证组件或保护策略可以在正常认证继续时直接造成秘密旁路复制或后续可恢复材料，因此 T1556 在 TA0006 下应复用并扩展 NJT-0093，而不是复制父技术。
      proposition_en: Modifying a trusted authentication component or protection policy can directly cause secret side copies or later recoverable material while normal authentication continues, so T1556 under TA0006 should reuse and extend NJT-0093 rather than duplicate the parent.
      evidence_keys: [REF-000187, TA0006-005-T1556-REF-MANDIANT-PTASPY, TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER, TA0006-005-T1556-REF-MS-REVERSIBLE]
    - temporary_key: TA0006-005-T1556-CLM-SIDECOPY
      resolution: create
      proposition_zh: 受信认证回调和代理可在保持原认证结果的同时把明文或等价秘密交给恶意第二接收者，形成独立于输入界面捕获和凭据库读取的材料结果。
      proposition_en: Trusted authentication callbacks and agents can deliver plaintext or equivalent secrets to a malicious second recipient while preserving the original authentication result, producing a material outcome distinct from interface input capture and credential-store reads.
      evidence_keys: [TA0006-005-T1556-REF-MANDIANT-PTASPY, TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER, TA0006-005-T1556-REF-MS-PASSWORDFILTER, TA0006-005-T1556-REF-MS-NPLOGONNOTIFY]
    - temporary_key: TA0006-005-T1556-CLM-RECOVERABLE
      resolution: create
      proposition_zh: 可逆密码保护策略只有在对目标生效并发生后续密码变化后才产生新增可恢复材料，恢复安全策略不会自动消除弱化窗口内已生成的材料。
      proposition_en: Reversible password-protection policy creates new recoverable material only after becoming effective for a target and a later password change, and restoring secure policy does not automatically remove material created during the weakening interval.
      evidence_keys: [REF-000187, TA0006-005-T1556-REF-MS-REVERSIBLE, TA0006-005-T1556-REF-MS-EVENT4739]
    - temporary_key: TA0006-005-T1556-CLM-STAGES
