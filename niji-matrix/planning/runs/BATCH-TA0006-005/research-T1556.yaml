  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级重写分别回答双战术结果、秘密痕迹、相邻边界、攻防前提和证据阶段；两项新子项各有不同变量、谱系、反例与恢复。防御对象不记录秘密值，也不把状态变化升级为材料结果。
      en: The parent rewrite separately covers dual tactic outcomes, secret traces, adjacent boundaries, attacker and defender prerequisites, and evidence stages. Each new child has a distinct variable, lineage, counterexamples, and recovery. Defense objects never record secret values or promote state change into material outcome.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization, recursive semantic audit]
  limitations:
    paragraphs:
      - zh: >-
          旁路复制证据最强，Mandiant 与 CrowdStrike 提供在野收集结果，Microsoft/Linux 文档解释合法调用语义；但跨平台输出字段和模块归因不统一。可恢复化主要由 ATT&CK 与 Microsoft 产品语义支持，没有完整公开事件链，因此必须保留 medium 并坚持 exposure、material-created 和 recovered 分层。
        en: >-
          Side-copy evidence is strongest: Mandiant and CrowdStrike provide in-the-wild collection results while Microsoft and Linux documentation explains legitimate callback semantics, although output fields and module attribution are not uniform across platforms. Recoverability relies mainly on ATT&CK and Microsoft product semantics without a complete public incident chain, so medium confidence and separation of exposure, material-created, and recovered must remain.
      - zh: >-
          认证系统通常不应记录秘密值，部分平台也不暴露调用模块、逐事务 ID 或材料形态。正式分析只能使用元数据、隔离 canary、调查确认和轮换范围；若攻击者控制构建、策略、目录与日志出口，单一视角不足。NJT-0093 改名与多战术扩展会影响既有 Bundle 和 Web 导航，主 Agent 必须在正式写入后执行全局引用、页面和双语回归。
        en: >-
          Authentication systems generally must not log secret values, and some platforms omit invoked module, transaction ID, or material form. Formal analytics must use metadata, isolated canaries, investigation confirmation, and rotation scope. One view is insufficient when the adversary controls build, policy, directory, and log export. Renaming and multi-tactic extension of NJT-0093 affect existing bundles and Web navigation, so the primary agent must run global reference, page, and bilingual regression after canonical writes.
  rejected_mechanisms:
    - mechanism: NM-ST
      reason_zh: 高价值主体可能低频登录、可恢复化也有时间延迟，但现有一手资料没有独立证明攻击者以时间/空间稀释规避阈值；这些是场景与窗口要求。
      reason_en: High-value principals may sign in sparsely and recoverability has delay, but primary sources do not independently establish deliberate temporal or spatial dilution to evade thresholds; these remain scenario and window requirements.
    - mechanism: NM-DO
      reason_zh: 密码或可逆密文的保密性不是数据不可解释机理；已授权组件能处理材料，支持的匿迹效果来自受信路径和合法外观。
      reason_en: Password confidentiality or reversible ciphertext is not Data Obfuscation because authorized components can interpret the material; supported stealth comes from trusted path and legitimate appearance.
  open_questions:
    - zh: 主 Agent 应在正式集成时确认 schema/Web 对多战术父级下战术专属子项的展示行为；若 UI 无法区分，正文和战术页必须明确现有两项属于持久结果、新两项属于凭据结果。
      en: During canonical integration, the primary agent should verify schema and Web behavior for tactic-specific children under a multi-tactic parent. If UI cannot distinguish them, prose and tactic pages must explicitly state that the existing pair owns persistence outcomes and the new pair credential outcomes.
    - zh: 若人工领域评审认为没有公开恢复事件不足以正式化 Policy-Induced Future-Secret Recoverability，应将该子项 defer，但父级 TA0006 准入、旁路复制子项和专属防御仍成立；不得以此恢复为第二个同义父技术。
      en: If human domain review finds the absence of a public recovery incident insufficient for formal Policy-Induced Future-Secret Recoverability, defer that child while retaining parent TA0006 admission, the side-copy child, and TA0006-specific defense; do not replace it with a second synonymous parent.
