research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 9
    attack_subtechnique_ids: [T1556.009, T1556.001, T1556.007, T1556.006, T1556.004, T1556.008, T1556.002, T1556.003, T1556.005]
    represented_dimensions:
      - {zh: 域控制器与网络设备验证器中的额外允许分支, en: Added allow branches in domain-controller and network-device validators}
      - {zh: 密码过滤器、Network Provider 与 PAM 等认证回调/模块, en: Authentication callbacks and modules such as password filters, Network Providers, and PAM}
      - {zh: 混合身份代理、联合链与云/本地跨平面处理, en: Hybrid-identity agents, federation chains, and cloud/on-premises cross-plane handling}
      - {zh: MFA 与 Conditional Access 的认证策略与作用域, en: MFA and Conditional Access authentication policy and scope}
      - {zh: 可逆保护和后继秘密材料生成, en: Reversible protection and later secret-material creation}
    breadth_trigger: second-pass
    coverage_resolutions:
      - attack_id: T1556.009
        resolution: adjacent-technique
        mapped_refs: [NJS-0093-002, NJT-0125]
        note_zh: Conditional Access 改变认证/防御结果；没有秘密材料结果时不形成 TA0006 子项。
        note_en: Conditional Access changes authentication or defensive outcomes and does not form a TA0006 child without a secret-material result.
      - attack_id: T1556.001
        resolution: adjacent-technique
        mapped_refs: [NJS-0093-001]
        note_zh: Skeleton Key 的稳定结果是额外证明被接受；固定资料没有证明其复制受害者秘密。
        note_en: Skeleton Key's stable result is acceptance of added proof; fixed evidence does not establish copying victim secrets.
      - attack_id: T1556.007
        resolution: niji-variable-candidate
        mapped_keys: [TA0006-005-T1556-CHILD-SIDECOPY]
        mapped_refs: [NJS-0093-001]
        note_zh: PTA Spy 直接支持旁路复制；授权错误口令和联合令牌生成分别归现有持久子项与 T1606。
        note_en: PTA Spy directly supports side copy; wrong-password authorization and federation-token construction belong to the existing persistence child and T1606 respectively.
      - attack_id: T1556.006
        resolution: adjacent-technique
        mapped_refs: [NJS-0093-002, NJT-0083, NJT-0125]
        note_zh: MFA 禁用、例外或账户方法注册本身不产生秘密；若组件另行复制因素材料，按实际结果进入旁路复制。
        note_en: MFA disablement, exception, or account-method registration does not itself produce a secret; a component separately copying factor material enters side copy only by demonstrated result.
      - attack_id: T1556.004
        resolution: adjacent-technique
        mapped_refs: [NJS-0093-001]
        note_zh: 网络设备硬编码口令改变最终 decision，属于选择性后门秘密接受；没有凭据获取结果。
        note_en: A network-device hardcoded password changes final decision and belongs to Selective Backdoor-Secret Acceptance without a credential-acquisition result.
      - attack_id: T1556.008
        resolution: niji-variable-candidate
        mapped_keys: [TA0006-005-T1556-CHILD-SIDECOPY]
        note_zh: Network Provider 在成功登录通知中接收认证信息并被观察用于写盘收集，直接支持第二接收者变量。
        note_en: Network Providers receive authentication information in successful-logon notification and were observed writing it to disk, directly supporting the second-recipient variable.
      - attack_id: T1556.002
        resolution: niji-variable-candidate
        mapped_keys: [TA0006-005-T1556-CHILD-SIDECOPY]
        note_zh: PasswordFilter 对新明文密码的合法回调能力支持同一变量；平台标签不形成子项。
        note_en: PasswordFilter's legitimate callback access to new plaintext passwords supports the same variable; the platform label does not form a child.
      - attack_id: T1556.003
        resolution: niji-variable-candidate
        mapped_keys: [TA0006-005-T1556-CHILD-SIDECOPY]
        mapped_refs: [NJS-0093-001]
        note_zh: PAM 可读取 token 或改变验证；秘密复制和异常允许按不同结果拆分，PAM 本身不是边界。
        note_en: PAM can read tokens or change validation; secret copy and anomalous allow split by result, while PAM itself is not the boundary.
      - attack_id: T1556.005
        resolution: niji-variable-candidate
        mapped_keys: [TA0006-005-T1556-CHILD-RECOVERABLE]
        note_zh: 可逆策略、后继密码变化和材料存在形成独立时间谱系，支持未来秘密可恢复化。
        note_en: Reversible policy, later password change, and material presence form a distinct temporal lineage supporting future-secret recoverability.
    candidate_stealth_axes_examined:
      - axis: trusted_transaction_secret_second_recipient
        disposition: formal
        why_zh: 攻击者控制接收者集合，保持 decision 而增加输出；需要组件—事务—输出检测和按事务轮换。
        why_en: The adversary controls the recipient set, preserves the decision, and adds output; defense requires component-transaction-output detection and transaction-scoped rotation.
      - axis: policy_induced_future_secret_recoverability
        disposition: formal-medium-confidence
        why_zh: 攻击者控制保护策略和有效窗口，痕迹从单向材料变为后继可恢复材料；需要策略—变化—材料检测和窗口内全体重置。
        why_en: The adversary controls protection policy and effective window, changing traces from one-way material to later recoverable material; defense requires policy-change-material detection and reset of every principal in the interval.
      - axis: selective_adversary_proof_acceptance
        disposition: existing-formal
        owner_ref: NJS-0093-001
        why_zh: 改变 decision 而非秘密获取，已有稳定子项和防御链。
        why_en: It changes decision rather than acquiring a secret and already has a stable child and defense chain.
      - axis: scoped_authentication_policy_exception
        disposition: existing-formal
        owner_ref: NJS-0093-002
        why_zh: 改变作用域 decision 而非秘密材料，已有稳定子项。
        why_en: It changes scoped decision rather than secret material and already has a stable child.
      - axis: input_interface_interception
        disposition: adjacent-technique
        owner: T1056
        why_zh: 直接对象是提交前/界面输入，而不是受信认证消费者的持久变化。
        why_en: The direct object is pre-submission or interface input rather than durable change to a trusted authentication consumer.
      - axis: forged_token_or_ticket
        disposition: adjacent-technique
        owner: T1606-or-T1558
        why_zh: 新认证材料构造改变的是签发来源，不是秘密接收者或保护策略。
        why_en: New authentication-material construction changes issuance origin rather than secret recipient or protection policy.
      - axis: account_authenticator_or_device_attachment
        disposition: adjacent-technique
        owner: T1098-and-NJT-0083
        why_zh: 改变单一身份访问状态，未改变跨主体认证处理路径。
        why_en: It changes one identity's access state rather than a cross-principal authentication-processing path.
      - axis: central_defense_weakening
        disposition: adjacent-technique
        owner: TA0112
        why_zh: 只降低防护、MFA 或策略效果而无秘密材料/异常允许结果时由 Defense Impairment 所有。
        why_en: Defense Impairment owns reduced protection, MFA, or policy effect without a secret-material or anomalous-allow result.
      - axis: file_vs_memory_vs_network_output
        disposition: folded-into-sidecopy
        why_zh: 输出介质改变传感器但未证明稳定攻击者变量，仍需同一事务—第二接收者谱系。
        why_en: Output medium changes sensors but is not established as a stable adversary variable and still uses the same transaction-to-second-recipient lineage.
      - axis: high_value_node_placement
        disposition: parent-core
        why_zh: 域控、Exchange、VPN 或连接器是目标选择和规模变量，不独立改变技术身份。
        why_en: Domain controllers, Exchange, VPN, or connectors are target and scale choices rather than independent technique identity.
    second_pass_required: true
    second_pass_completed: true
    second_pass_notes_zh: 第二轮跨九项搜索了 decision、秘密接收者、保护状态、生成时点、输出介质、跨平面代理、账户状态和防御结果；只新增两项具有稳定痕迹与防御差异的 TA0006 变量，复用两个现有持久化变量，其余归相邻技术或父级实现。
    second_pass_notes_en: The second pass searched decision, secret recipient, protection state, creation time, output medium, cross-plane agent, account state, and defensive outcome across all nine children. It adds only two TA0006 variables with stable trace and defense differences, reuses two existing persistence variables, and assigns the remainder to adjacent techniques or parent implementation.
    proposed_niji_child_count_total: 4
    proposed_new_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 九项 ATT&CK 子项按平台、组件与结果混合划分。四项 Niji 子项横跨这些实现并按 decision、scope、第二接收者和未来可恢复性划分；9 对 4 的差异来自平台合并和 T1056/T1098/T1606/T1558/TA0112 边界，不是减少研究广度。
      en: The nine ATT&CK children mix platform, component, and outcome partitions. Four Niji children cross those implementations and partition decision, scope, second recipient, and future recoverability. The nine-to-four gap follows platform convergence and T1056, T1098, T1606, T1558, and TA0112 boundaries rather than reduced research breadth.
  evidence_coverage:
    parent_behavior_keys: [REF-000187, TA0006-005-T1556-REF-MANDIANT-PTASPY, TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER, TA0006-005-T1556-REF-MS-REVERSIBLE]
    boundary_keys: [TA0006-005-T1556-REF-MS-PASSWORDFILTER, TA0006-005-T1556-REF-MS-NPLOGONNOTIFY, TA0006-005-T1556-REF-LINUX-PAM-AUTHTOK, TA0006-005-T1556-REF-MS-EVENT4739]
    mechanism_support:
      - mechanism: NM-BT
        keys: [TA0006-005-T1556-REF-MANDIANT-PTASPY, TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER, TA0006-005-T1556-REF-MS-PASSWORDFILTER, TA0006-005-T1556-REF-MS-NPLOGONNOTIFY]
        limit: Direct incident and API support for side copy; telemetry fields remain platform-specific
      - mechanism: NM-FD
        keys: [TA0006-005-T1556-REF-MS-REVERSIBLE, TA0006-005-T1556-REF-MS-EVENT4739, TA0006-005-T1556-REF-MS-PASSWORDFILTER]
        limit: Legitimate-looking policy and callback semantics are direct; attacker intent to mimic every environment remains inferred
    child_existence_support:
      - child_key: TA0006-005-T1556-CHILD-SIDECOPY
        keys: [TA0006-005-T1556-REF-MANDIANT-PTASPY, TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER, TA0006-005-T1556-REF-MS-PASSWORDFILTER, TA0006-005-T1556-REF-MS-NPLOGONNOTIFY]
      - child_key: TA0006-005-T1556-CHILD-RECOVERABLE
        keys: [REF-000187, TA0006-005-T1556-REF-MS-REVERSIBLE, TA0006-005-T1556-REF-MS-EVENT4739]
    unsupported_or_deferred:
      - {zh: 未找到公开事件同时证明恶意可逆策略 writer、目标密码变化、全部恢复组件和实际明文恢复，故第二新增子项保持 medium。, en: No public event was found that simultaneously establishes a malicious reversible-policy writer, target password change, all recovery components, and actual plaintext recovery, so the second new child remains medium confidence.}
      - {zh: 文件、内存和网络输出尚不足以拆成独立子项。, en: File, memory, and network outputs do not yet justify separate children.}
