      proposition_en: Authentication component or policy change, real transaction traversal, material creation, material recovery, and successor use are distinct evidentiary stages, and none automatically proves the others.
      evidence_keys: [TA0006-005-T1556-REF-MANDIANT-PTASPY, TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER, TA0006-005-T1556-REF-MS-REVERSIBLE]
