handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-005
work_item_ref: WORK-TA0006-T1556
temporary_key_prefix: TA0006-005-T1556
candidate:
  source_type: attack
  source_attack_id: T1556
  source_attack_version: "19.1"
  name:
    zh: 修改认证过程
    en: Modify Authentication Process
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  canonical_action: reuse-and-extend
  resulting_technique_ref: NJT-0093
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 将认证机制和流程的恶意修改同时映射到 Credential Access、Persistence 与 Defense Impairment，并明确其组件负责收集、存储和验证凭据。TA0006 因而应保留“修改认证路径后直接取得认证秘密或使其形成可恢复暴露状态”的行为；但现有 NJT-0093 已拥有同一父行为及其持久异常允许结果，另建同义父技术会按战术重复计数。建议适配准入并复用 NJT-0093，增加 TA0006 战术引用，将父级名称与正文扩展为同时覆盖认证结果和秘密处理的改变。
        en: >-
          ATT&CK Enterprise 19.1 maps malicious modification of authentication mechanisms and processes to Credential Access, Persistence, and Defense Impairment and states that those components gather, store, and validate credentials. TA0006 should therefore retain behavior in which modifying the authentication path directly obtains authentication secrets or causes them to enter a recoverable exposed state. NJT-0093 already owns the same parent behavior and its durable anomalous-allow outcome, so a synonymous parent would duplicate the behavior by tactic. Admit the candidate as adapted, reuse NJT-0093, add TA0006 to its tactic references, and extend the parent name and prose to cover changes to authentication outcomes and secret handling together.
      - zh: >-
          Credential Access 的完成门槛不是存在恶意模块、策略开关或失败开放路径，而是认证组件、回调、提供者、联合代理或保护策略的攻击者控制变化与凭据材料结果之间形成因果连接。认证事务内旁路复制需要证明受信认证路径把明文或等价秘密额外交给恶意消费者；未来秘密可恢复化需要证明弱化策略已生效、后续凭据变化产生可恢复材料，并至少有材料存在或恢复能力证据。选择性异常允许与范围化策略例外若只改变后续 decision，继续由 NJS-0093-001/-002 所有；单纯防御功能下降由 TA0112 所有。
        en: >-
          Credential Access is complete only when an adversary-controlled change to an authentication component, callback, provider, federation agent, or protection policy is causally joined to a credential-material result, rather than from the mere presence of a malicious module, policy switch, or fail-open path. An in-transaction side copy requires evidence that a trusted authentication path additionally delivered plaintext or equivalent secret to a malicious consumer. Future-secret recoverability requires an effective weakened policy, a later credential change that produced recoverable material, and evidence of material existence or recovery capability. Selective anomalous allow and scoped policy exceptions that only change later decisions remain owned by NJS-0093-001 and NJS-0093-002; defense-function decline alone remains owned by TA0112.
  reuse_extend_split:
    parent:
      disposition: reuse-and-extend
      ref: NJT-0093
      reason_zh: T1556 的稳定父行为仍是攻击者改变认证路径；战术差异来自直接结果，不构成第二个父技术身份。
      reason_en: The stable T1556 parent behavior remains adversary change to an authentication path; tactic differences arise from direct outcomes and do not create a second parent identity.
    existing_children:
      - ref: NJS-0093-001
        disposition: reuse-unchanged-boundary
        reason_zh: 继续拥有额外接受攻击者证明的持久认证结果，不因同一实现顺带取密而改写为 Credential Access 子项。
        reason_en: It continues to own the durable authentication outcome of additionally accepting adversary proof and is not rewritten as a Credential Access child merely because one implementation also captures secrets.
      - ref: NJS-0093-002
        disposition: reuse-unchanged-boundary
        reason_zh: 继续拥有总体策略仍启用时的窄范围认证例外；没有秘密材料结果时不进入 TA0006。
        reason_en: It continues to own a narrow authentication exception under an otherwise enabled policy and does not enter TA0006 without a secret-material result.
    defense:
      detection_strategy: split
      detection_analytic: split
      mitigation: split
      reason_zh: DET-000073/NJA-000052 的身份是异常允许路径差分，MIT-000073 的中心是持久认证入口治理；凭据输出与可恢复材料需要不同数据、结果门槛和轮换范围，故保留既有对象并新建 TA0006 专属对象。
      reason_en: DET-000073 and NJA-000052 identify anomalous allow paths, while MIT-000073 governs durable authentication entries. Credential output and recoverable material require different data, completion gates, and rotation scope, so existing objects remain and TA0006-specific defense objects should be created.
proposed_content:
  identity_update:
    name:
      zh: 认证路径结果与秘密操纵
      en: Authentication-Path Outcome and Secret Manipulation
    aliases_add:
      - Authentication-Path Persistence Manipulation
      - Modify Authentication Process
    classification_tactic_refs:
      - TA0003
      - TA0006
    classification_decision_note_zh: classification.decision_ref 继续以 DEC-TA0003-T1556 为规范来源；新的 DEC-TA0006-T1556 反向指向 NJT-0093 并记录跨战术复用。
    classification_decision_note_en: classification.decision_ref remains anchored to canonical DEC-TA0003-T1556; new DEC-TA0006-T1556 points back to NJT-0093 and records cross-tactic reuse.
  summary:
    zh: 攻击者修改认证验证器、受信消费者、联合链或策略，使选定证明持续获得异常允许，或使经过认证路径的秘密被额外复制、以可恢复形式保存，同时让普通认证外观保持正常。
    en: Adversaries modify an authentication validator, trusted consumer, federation chain, or policy so selected proof continues to receive anomalous allow or secrets traversing the path are additionally copied or stored recoverably while ordinary authentication appearance remains normal.
  definition_and_concept:
    paragraphs:
      - zh: >-
          认证路径结果与秘密操纵是攻击者改变从认证输入、凭据变化或身份声明进入系统，到秘密收集、存储、验证及最终允许/拒绝之间的组件、加载模块、回调、联合代理、信任或附加策略，使以后认证产生攻击者选择的异常结果或凭据材料结果的技术。在 Persistence 下，直接目标是建立可反复调用的异常允许入口；在 Credential Access 下，直接目标是让秘密在正常验证过程中被额外复制，或让后续凭据以攻击者可恢复的保护状态生成。
        en: >-
          Authentication-Path Outcome and Secret Manipulation changes a component, loaded module, callback, federation agent, trust, or additional policy between authentication input, credential change, or identity assertion and secret collection, storage, validation, and final allow or deny so later authentication produces an adversary-selected decision or credential-material result. Under Persistence, the direct objective is a repeatable anomalous allow entry. Under Credential Access, it is an added copy of a secret during ordinary validation or creation of later credentials in a protection state the adversary can recover.
      - zh: >-
          概念锚是“认证路径的受信处理语义被持久改变”，不是 DLL、PAM、网络设备、云租户或密码介质。相同恶意 PTA 模块可以同时记录口令并授权错误口令，前者属于 TA0006 新子项，后者属于 NJS-0093-001，两项只有各自结果得到证明时才并列。只截获界面输入而未改变受信认证消费者归 T1056；只增加账户认证器归 T1098/NJT-0083；只构造令牌或票据归 T1606/T1558；只降低安全控制而没有秘密或异常允许结果归 TA0112。
        en: >-
          The conceptual anchor is a durable change to trusted authentication-path processing semantics, not a DLL, PAM, network device, cloud tenant, or password medium. One malicious PTA module can both record passwords and authorize wrong passwords; the former belongs to a new TA0006 child and the latter to NJS-0093-001, and they are co-mapped only when each outcome is evidenced. Intercepting interface input without changing a trusted authentication consumer belongs to T1056, adding an account authenticator to T1098 and NJT-0083, constructing tokens or tickets to T1606 or T1558, and reducing a security control without a secret or anomalous-allow result to TA0112.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          认证路径结果与秘密操纵借用合法认证事务、受信服务身份和正常成功或失败结果。旁路复制可以让原验证结果、用户提示和会话完全不变，仅由已被系统授权接触秘密的过滤器、提供者、PAM 或 PTA 代理把材料写入第二目的地；可恢复化可以让密码变化和后续登录继续成功，只在策略保护和目录材料形态上出现差异。只监控失败率、LSASS 转储、键盘钩子、保管库 API 或新账户的防守方可能看不到秘密是在认证内部被复制或在未来变化时变得可恢复。
        en: >-
          Authentication-Path Outcome and Secret Manipulation borrows legitimate authentication transactions, trusted service identities, and normal success or failure outcomes. A side copy can leave validation result, user feedback, and session unchanged while a filter, provider, PAM, or PTA agent already authorized to handle the secret writes it to a second destination. Recoverability can leave password change and later sign-in successful while changing only protection policy and directory material form. Defenders watching failure rates, LSASS dumping, keyboard hooks, vault APIs, or new accounts may miss that a secret was copied inside authentication or made recoverable on a later change.
      - zh: >-
          匿迹仍有残余。组件与配置 old/new、模块 hash 与 signer、加载顺序、注册 writer、认证事务 ID、密码变化时间、策略有效作用域、秘密输出文件或网络连接、敏感目录属性的存在与读取、以及后继轮换或使用可以恢复谱系。合法密码同步、凭据管理器、兼容性 PAM、CHAP/Digest、灾难恢复和受控代理也会接触或保存秘密；缺少攻击者控制、非批准第二目的地或材料结果时，只能报告认证路径风险状态，不能断言凭据已取得。
        en: >-
          Residue remains in component and configuration old and new values, module hash and signer, load order, registration writer, authentication transaction ID, password-change time, effective policy scope, secret-output file or network connection, presence and reads of sensitive directory attributes, and later rotation or use. Legitimate password synchronization, credential managers, compatibility PAM, CHAP or Digest, disaster recovery, and controlled agents also handle or store secrets. Without adversary control, an unapproved second destination, or a material result, defenders can report authentication-path risk state but cannot assert credential acquisition.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          本技术纳入攻击者持久修改认证组件、回调、提供者、联合代理、信任或保护策略，并使该差异直接产生异常允许或凭据材料结果。Credential Access 分支至少要求定位改变对象和未经批准的 writer，证明一次真实认证或密码变化命中改变后的路径，并连接秘密旁路输出、可恢复材料生成、受控恢复能力或经调查确认的暴露。模块存在、策略启用或认证成功分别只是状态、条件或后继结果。
        en: >-
          This technique includes durable adversary modification of an authentication component, callback, provider, federation agent, trust, or protection policy when the difference directly produces anomalous allow or a credential-material result. The Credential Access branch requires at minimum the changed object and unapproved writer, a real authentication or password change that traversed the changed path, and a joined secret side output, recoverable-material creation, controlled recovery capability, or investigation-confirmed exposure. Module presence, policy enablement, and authentication success alone are state, condition, and successor outcome respectively.
      - zh: >-
          T1056 以用户或进程正在提交的输入事件为直接对象；本技术以受信认证消费者、回调或保护语义被持久修改为直接对象。恶意网页、键盘钩子或任意 Credential API hook 即使取得同样口令，也不因材料相同进入本项；若攻击者同时注册恶意认证模块并在其中读取已提交秘密，可并列记录两项，但不得用一个结果填补另一项的组件或输入证据。T1555/NJT-0147 负责从受管理保管库取用既存秘密，本项只负责改变认证路径而创造第二输出或未来可恢复状态。
        en: >-
          T1056 directly concerns an input event being submitted by a user or process; this technique directly concerns durable modification of a trusted authentication consumer, callback, or protection semantics. A malicious webpage, keylogger, or arbitrary Credential API hook does not enter this object merely because it obtains the same password. If an adversary also registers a malicious authentication module and reads a submitted secret inside it, both may be recorded, but one result cannot fill the other's component or input evidence. T1555 and NJT-0147 own retrieval of existing secrets from managed stores; this object owns only an authentication-path change that creates a second output or future recoverable state.
      - zh: >-
          账户级密码、MFA 方法、密钥或设备信任增补属于 T1098/NJT-0083；联合或 Web 材料的新构造属于 T1606，Kerberos 票据的窃取或伪造属于 T1558。中心策略或认证防御被削弱但尚未产生凭据材料时归 TA0112；可逆策略变化与后续材料生成可在结果分别证明时与 TA0112 并列。合法升级、同步、兼容性和恢复必须具有 owner、批准、最小作用域、预期寿命、受保护输出和回滚记录。
        en: >-
          Account-level password, MFA method, key, or device-trust augmentation belongs to T1098 and NJT-0083. New federation or web-material construction belongs to T1606, and Kerberos ticket theft or forgery to T1558. Central policy or authentication-defense weakening without credential material belongs to TA0112; a reversible-policy change and later material creation can be co-mapped when each outcome is independently shown. Legitimate upgrade, synchronization, compatibility, and recovery require an owner, approval, minimum scope, intended lifetime, protected output, and rollback record.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            攻击者在取得域控制器、身份连接器、VPN/网络设备、本地认证服务或策略管理权限后，可以注册接收明文口令变化的过滤器或网络提供者，在 PAM 或 PTA 链中加入额外消费者，或把秘密保护策略改为可逆。其后不需要主动诱导大量失败；管理员、服务或高价值用户的正常登录和密码变化即可把材料交给恶意路径。Mandiant 的 PTA Spy 分析和 CrowdStrike 的 Network Provider 入侵均直接展示认证正常进行时的口令收集。
          en: >-
            After gaining authority over a domain controller, identity connector, VPN or network device, local authentication service, or policy plane, an adversary can register a filter or network provider that receives plaintext password changes, add another consumer to PAM or PTA, or make secret-protection policy reversible. The adversary need not generate many failures afterward; ordinary sign-ins and password changes by administrators, services, or high-value users deliver material to the malicious path. Mandiant's PTA Spy analysis and CrowdStrike's Network Provider intrusions directly demonstrate password collection while authentication proceeds normally.
        - zh: >-
            可恢复化适合能够改变域或账户密码策略、但无法立即取得现有明文的操作者。策略生效后只有新设或变化的凭据进入较弱形态，攻击者需要等待目标轮换、恢复或创建，再读取所需目录与 LSA 材料并恢复秘密。该时间链必须分级记录；只启用策略是暴露，密码变化后出现可恢复材料才是材料结果，实际解密与使用是更高证据阶段。
          en: >-
            Recoverability suits an operator able to change domain or account password policy but unable to obtain current plaintext immediately. Only credentials created or changed after the policy becomes effective enter the weaker form, so the adversary waits for rotation, recovery, or account creation, then reads the needed directory and LSA material and recovers the secret. This timeline must be tiered: policy enablement is exposure, creation of recoverable material after a password change is a material result, and actual decryption and use are stronger later stages.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              旁路复制要求攻击者具有注册、替换或加载认证模块/提供者/代理的管理员权限，理解调用顺序、秘密对象寿命、进程保护和失败处理，并能选择不会破坏正常认证的第二输出。为了获得有价值材料，植入还必须留存到目标实际登录或更改密码；签名限制、受保护进程、只读系统面、独立构建、最小化认证插件和隔离身份连接器会提高成本。错误模块、阻塞回调、明文文件权限过宽或异常出站连接会暴露行动。
            en: >-
              Side-copy behavior requires administrative authority to register, replace, or load an authentication module, provider, or agent; knowledge of call order, secret-object lifetime, process protection, and failure handling; and a second output that does not disrupt ordinary authentication. The implant must remain until a valuable principal signs in or changes a password. Signing restrictions, protected processes, read-only system surfaces, independent builds, minimized authentication plug-ins, and isolated identity connectors raise cost. A faulty module, blocking callback, broadly readable plaintext file, or anomalous outbound connection exposes the operation.
          - zh: >-
              未来可恢复化要求策略写权、对生效与继承作用域的理解、等待凭据变化的时间容忍度，以及随后读取目录秘密与恢复材料的能力。单纯打开开关不会改变既有密码；攻击者还需让新值写入并取得足够恢复组件。强制禁用可逆存储、细粒度策略审计、密码变化后的保护状态验证、目录属性访问限制和立即轮换受影响凭据会破坏链条。
            en: >-
              Future recoverability requires policy-write authority, understanding of effective and inherited scope, patience for a later credential change, and the ability to read directory secrets and recovery material afterward. Merely enabling a switch does not change existing passwords; the adversary must also cause or await a new value and obtain sufficient recovery components. Enforced prohibition of reversible storage, fine-grained policy audit, protection-state verification after password changes, restricted directory-attribute access, and immediate rotation of affected credentials break the chain.
      defender_model:
        paragraphs:
          - zh: >-
              防守方需要独立保存认证组件和配置版本、注册与加载来源、signer/hash、writer 和批准，并把它们与认证或密码变化事务、调用组件链、结果、进程/线程、文件/网络输出和后继使用连接。不得采集真实秘密值；可使用事务 ID、主体伪名、模块 ID、输出对象 ID、字节量、敏感分类和调查确认。只有组件差异与真实事务及非批准输出三者连接时，才能从植入风险提高为旁路复制。
            en: >-
              Defenders need independent versions of authentication components and configuration, registration and load provenance, signer or hash, writer, and approval, joined to authentication or password-change transaction, invoked component chain, outcome, process or thread, file or network output, and later use. Real secret values must not be collected; transaction ID, pseudonymous principal, module ID, output-object ID, byte count, sensitivity classification, and investigation confirmation are sufficient. Only a component difference joined to a real transaction and an unapproved output can elevate implant risk to side copy.
          - zh: >-
              对保护策略，防守方需要 old/new、有效作用域、优先级、writer、审批和生效时间，以及每次密码设置/变化、受影响主体、材料形态指示、敏感属性读取、复制调用和轮换结果。观察窗口从最后可信策略开始，持续到弱化状态撤销且期间所有受影响凭据重新安全设置。只保留当前策略、没有密码变化键或让同一管理员控制策略、目录和日志出口都会削弱结论。
            en: >-
              For protection policy, defenders need old and new state, effective scope, precedence, writer, approval, and effective time, plus every password set or change, affected principal, material-form indicator, sensitive-attribute read, replication call, and rotation outcome. The observation window begins with the last trusted policy and continues until the weak state is removed and every affected credential is safely reset. Current-state-only retention, absence of password-change keys, or allowing one administrator to control policy, directory, and log export weakens the conclusion.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 受信认证事务完成时秘密副本落在正常结果日志之外
        en: Secret copies created by trusted authentication transactions fall outside normal outcome logs
      analysis:
        paragraphs:
          - zh: >-
              攻击者把秘密消费者嵌入已被系统授权处理口令的过滤器、Provider、PAM 或 PTA 代理，认证请求仍由熟悉服务完成并返回预期结果；额外文件写入、内存复制或网络输出不属于标准登录 decision。Mandiant 记录 PTA Spy 截获并保存每次口令尝试，CrowdStrike 观察恶意 Network Provider 把用户名和口令写盘，而常见凭据检测重点仍是 LSASS/SAM 转储。关键获取行为因而没有进入只解释登录结果或传统转储的默认逻辑，形成行为透明。
            en: >-
              The adversary embeds a secret consumer in a filter, provider, PAM, or PTA agent already authorized to process passwords. A familiar service completes the authentication request and returns its expected outcome, while an added file write, memory copy, or network output is absent from standard sign-in decisions. Mandiant documented PTA Spy intercepting and storing each password attempt, and CrowdStrike observed malicious Network Providers writing usernames and passwords to disk while common credential detection focused on LSASS or SAM dumping. The decisive acquisition behavior therefore falls outside logic that interprets only login outcomes or traditional dumping, producing Behavioral Transparency.
      evidence_keys:
        - TA0006-005-T1556-REF-MANDIANT-PTASPY
        - TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER
        - TA0006-005-T1556-REF-MS-PASSWORDFILTER
        - TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 正常认证与合法兼容策略外观包裹秘密保护差异
        en: Normal authentication and legitimate compatibility policy appearance wrap secret-protection differences
      analysis:
        paragraphs:
          - zh: >-
              恶意认证消费者使用受信服务、正常回调和已登记模块身份，可与密码同步、网络凭据管理或合法 PAM 共享特征；可逆存储又可表现为一个有效且为旧协议保留的策略。用户密码变化和登录均可成功，粗粒度审查难以仅凭服务名称、策略存在或成功结果区分恶意秘密路径。模块签名/来源、批准目的、输出保护、策略 old/new、受影响主体和材料读取仍能恢复差异，因此伪装并非无痕。
            en: >-
              A malicious authentication consumer uses a trusted service, normal callback, and registered-module identity and can share features with password synchronization, network credential management, or legitimate PAM. Reversible storage can also appear as a valid policy retained for a legacy protocol. Password changes and sign-ins can succeed, so coarse review cannot distinguish the malicious secret path from service name, policy presence, or success alone. Module signature and provenance, approved purpose, output protection, policy old and new state, affected principal, and material reads can still recover the difference, so the disguise is not trace-free.
      evidence_keys:
        - TA0006-005-T1556-REF-MS-PASSWORDFILTER
        - TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
        - TA0006-005-T1556-REF-MS-REVERSIBLE
        - TA0006-005-T1556-REF-MS-EVENT4739
      confidence: medium
  subtechnique_taxonomy_update:
    coverage: established
    retained_refs:
      - NJS-0093-001
      - NJS-0093-002
    proposed_temporary_keys:
      - TA0006-005-T1556-CHILD-SIDECOPY
      - TA0006-005-T1556-CHILD-RECOVERABLE
    narrative:
      paragraphs:
        - zh: >-
            扩展后的父级形成四项按稳定结果变量划分的 Niji 子技术。既有“选择性后门秘密接受”改变选定证明的最终 decision，“范围化认证策略例外”改变选定情境的策略 decision；新增“认证事务内秘密旁路复制”保持原 decision 但增加秘密接收者，“策略诱导的未来秘密可恢复化”先改变保护语义，再使后续凭据变化产生可恢复材料。四项分别要求输入—结果差分、策略作用域—结果差分、事务—第二输出谱系和策略—凭据变化—材料谱系，检测与恢复动作不可互换。
          en: >-
            The extended parent has four Niji children partitioned by stable outcome variables. Existing Selective Backdoor-Secret Acceptance changes the final decision for selected proof, and Scoped Authentication-Policy Exception changes the policy decision for selected context. New In-Transaction Secret Side Copy preserves the original decision but adds a secret recipient, while Policy-Induced Future-Secret Recoverability first changes protection semantics and then causes later credential change to create recoverable material. The four respectively require input-to-outcome differential, policy-scope-to-outcome differential, transaction-to-second-output lineage, and policy-to-credential-change-to-material lineage, with non-interchangeable detection and recovery.
        - zh: >-
            DLL、PAM、PTA、网络设备、MFA、云或本地不是兄弟边界。密码过滤器、Network Provider、PAM 与混合身份代理只有在旁路秘密结果可证时进入第一新增子项；可逆加密只有在策略生效并产生新材料时进入第二新增子项。模块既记录口令又异常允许时可并列两个子项，但必须分别证明输出和 decision。输入界面捕获、令牌/票据构造、账户认证器增补和防御削弱继续由相邻技术拥有。
          en: >-
            DLL, PAM, PTA, network device, MFA, cloud, and on-premises are not sibling boundaries. Password filters, Network Providers, PAM, and hybrid-identity agents enter the first new child only when a side secret result is evidenced. Reversible encryption enters the second only after effective policy produces new material. A module that both records a password and anomalously allows access can map to two children only with separate proof of output and decision. Interface input capture, token or ticket construction, account-authenticator augmentation, and defense impairment remain with adjacent techniques.
proposed_subtechniques:
  - temporary_key: TA0006-005-T1556-CHILD-SIDECOPY
    name:
      zh: 认证事务内秘密旁路复制
      en: In-Transaction Secret Side Copy
    disposition: formal
    confidence: high
    taxonomy_variable:
      zh: 受信认证事务是否在保持原 decision 的同时增加一个未经批准的秘密接收者
      en: Whether a trusted authentication transaction adds an unapproved secret recipient while preserving its original decision
    counterfactual_trace:
      zh: 正常事务只把秘密交给登记的验证或同步目的地；旁路复制在同一事务中产生额外文件、内存、IPC 或网络输出，而用户反馈和认证结果可保持不变。
      en: A normal transaction delivers the secret only to registered validation or synchronization destinations; a side copy creates an additional file, memory, IPC, or network output in the same transaction while user feedback and authentication outcome can remain unchanged.
    summary:
      zh: 攻击者把未经批准的秘密消费者嵌入受信认证链，使正常登录或密码变化在维持原结果时额外复制明文或等价认证材料。
      en: Adversaries embed an unapproved secret consumer in a trusted authentication chain so ordinary sign-in or password change additionally copies plaintext or equivalent authentication material while preserving the original result.
    definition_and_concept:
      paragraphs:
        - zh: >-
            认证事务内秘密旁路复制是攻击者注册、替换或植入一个由受信认证服务调用的过滤器、Provider、PAM、PTA 代理或等价消费者，使登录、密码设置或密码变化事务把明文、认证令牌或足以复现秘密的材料额外交给攻击者控制的输出，而原验证、同步和用户提示继续完成的匿迹子技术。直接目标是从真实认证流取得材料，不是用植入本身建立异常允许。
          en: >-
            In-Transaction Secret Side Copy registers, replaces, or implants a filter, provider, PAM, PTA agent, or equivalent consumer invoked by a trusted authentication service so sign-in, password-set, or password-change transactions additionally deliver plaintext, an authentication token, or material sufficient to reproduce the secret to an adversary-controlled output while original validation, synchronization, and user feedback continue. Its direct objective is material acquisition from real authentication flow, not anomalous allow created by the implant itself.
        - zh: >-
            区分变量是事务的秘密接收者集合出现第二条未经批准的边，不是实现平台或输出介质。PasswordFilter 收到新明文密码、NPLogonNotify 收到成功登录使用的认证信息、PAM 模块读取缓存 token、PTA 代理处理云登录口令都可以承载同一变量。文件暂存、内存队列和直接网络发送只是输出实现，除非未来证据证明它们产生稳定且不同的防守观察边界。
          en: >-
            The distinguishing variable is a second unapproved edge in the transaction's set of secret recipients, not implementation platform or output medium. PasswordFilter receiving a new plaintext password, NPLogonNotify receiving authentication information used for successful sign-in, a PAM module reading a cached token, and a PTA agent processing a cloud sign-in password can carry the same variable. File staging, memory queue, and direct network transmission are output implementations unless future evidence establishes stable and distinct defender-observation boundaries.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            认证事务内秘密旁路复制让受害者看到预期登录或密码变化结果，身份平台也可以记录普通成功、失败或同步；恶意消费者沿合法调用链运行，进程主语仍是 LSA、Winlogon/mpnotify、sshd/PAM 或身份连接器。防守方若只按进程名、成功率或传统凭据转储 API 检测，第二接收者不会出现在决策日志中，且高价值秘密可随正常管理员登录低频到达。
          en: >-
            In-Transaction Secret Side Copy gives the victim the expected sign-in or password-change result, and the identity platform can record an ordinary success, failure, or synchronization. The malicious consumer runs in the legitimate call chain, leaving LSA, Winlogon or mpnotify, sshd or PAM, or an identity connector as the process subject. Detection based only on process name, success rate, or traditional credential-dumping APIs omits the second recipient from decision logs, and high-value secrets can arrive sparsely with normal administrator sign-ins.
        - zh: >-
            旁路仍留下注册项、加载模块、hash/signer、服务/PAM 栈顺序、writer、进程映像与内存差异，以及认证事务附近的新文件、敏感对象写入、IPC 或网络连接。合法密码同步和凭据管理器也会接收材料，因此非批准输出、异常目的地、所有者/工单缺口和调查确认必须参与判定。真实秘密不得进入分析平台，使用对象标识与敏感分类即可证明输出。
          en: >-
            The side path still leaves registration state, loaded module, hash or signer, service or PAM stack order, writer, process-image or memory differences, and a new file, sensitive-object write, IPC, or network connection near an authentication transaction. Legitimate password synchronization and credential managers also receive material, so unapproved output, anomalous destination, owner or change-record gap, and investigation confirmation must participate in classification. Real secret values must never enter the analytic platform; object identifiers and sensitivity classification can establish output.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求识别受信认证链中的攻击者控制变化、一个真实登录/密码变化事务命中该变化，以及额外秘密输出或经调查确认的收集结果。只注册模块但尚无事务为 implant_present；只有事务没有第二输出为 traversed_no_material；只有文件或网络写入但不知道是否承载认证材料为 suspicious_output。材料确认不要求记录秘密值，可以依靠受害方调查、受控 canary、文件格式或轮换范围。
          en: >-
            Inclusion requires an adversary-controlled change in a trusted authentication chain, a real sign-in or password-change transaction traversing the change, and an added secret output or investigation-confirmed collection result. Registration without a transaction is implant_present; a transaction without a second output is traversed_no_material; a file or network write whose authentication-material content is unknown is suspicious_output. Confirmation does not require recording the secret value and can rely on victim investigation, controlled canary, file format, or rotation scope.
        - zh: >-
            用户输入在到达受信认证消费者前被网页、键盘、GUI 或任意 API hook 截获归 T1056；从既存保管库或内存存储读取秘密归 T1555/T1003；仅让错误秘密通过归 NJS-0093-001。合法 password sync、Network Provider、PAM、SSO 与远程支持必须有明确业务消费者、受保护目的地、最小权限、保留期和删除证据。相同植入同时旁路验证时可以并列，但一条文件写入不能证明异常允许，一次成功登录也不能证明秘密复制。
          en: >-
            Web, keyboard, GUI, or arbitrary API interception before input reaches a trusted authentication consumer belongs to T1056. Reading an existing vault or memory store belongs to T1555 or T1003, and merely allowing a wrong secret belongs to NJS-0093-001. Legitimate password synchronization, Network Provider, PAM, SSO, and remote support require an identified business consumer, protected destination, least privilege, retention, and deletion evidence. One implant can be co-mapped when it also bypasses validation, but a file write cannot prove anomalous allow and a successful sign-in cannot prove secret copying.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              攻击者可以在 Exchange 或高登录量服务器注册恶意 Network Provider，把后续成功登录的用户名和口令写盘；也可以控制 PTA/AAD Connect 服务器或注册恶意代理，截取发送给本地验证的云登录口令。密码过滤器更偏向密码设置和变化事务，PAM 植入可覆盖使用相应服务栈的交互登录。攻击者通常选择能看到管理员或大量主体的认证节点，并在收集后离线转移或复用材料。
            en: >-
              An adversary can register a malicious Network Provider on Exchange or another high-logon server and write usernames and passwords from later successful sign-ins to disk, or control a PTA or AAD Connect server or register a rogue agent to intercept cloud sign-in passwords sent for local validation. Password filters emphasize password-set and password-change transactions, while PAM implants cover interactive services using that stack. Adversaries usually choose authentication nodes seeing administrators or many principals and later remove or reuse the collected material.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要改变认证组件注册、服务配置、受保护文件/内存或身份代理，并理解何时可取得秘密及如何不阻塞事务。收集价值取决于后续真实认证量和目标主体；错误路径、模块签名不匹配、服务崩溃、显著明文文件和持续网络连接都会增大暴露。只拥有普通账户或只有一次已提交输入而无认证路径写权不满足本子项。
              en: >-
                The adversary needs authority to change authentication-component registration, service configuration, protected file or memory, or identity agent, plus knowledge of when a secret is available and how to avoid blocking the transaction. Collection value depends on later real authentication volume and target principals. A bad path, module-signature mismatch, service crash, conspicuous plaintext file, or persistent network connection raises exposure. An ordinary account or one submitted input without authentication-path write authority does not satisfy this child.
        defender_model:
          paragraphs:
            - zh: >-
                防守方需要组件和配置基线、加载遥测、writer/审批、认证或密码变化事务，以及同一进程/线程/事务附近的文件、IPC 和网络输出。精确事务键不可用时可以按主机、服务、主体伪名和短窗口关联，但必须降低置信度。受控 canary 只能在隔离账户使用且不得具备生产访问；真实秘密内容不得写入日志。主机自报完整性若被同一高权攻击者控制，需要离线度量或独立构建来源。
              en: >-
                Defenders need component and configuration baselines, load telemetry, writer and approval, authentication or password-change transactions, and file, IPC, and network outputs near the same process, thread, or transaction. When exact transaction keys are unavailable, host, service, pseudonymous principal, and a short window can be used at lower confidence. Controlled canaries must use isolated accounts without production access, and real secret content must never be logged. Host-reported integrity controlled by the same privileged adversary requires offline measurement or independent build provenance.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 第二秘密接收者不改变正常认证 decision
          en: A second secret recipient does not change the normal authentication decision
        analysis:
          paragraphs:
            - zh: >-
                系统按正常顺序把凭据交给已登记消费者并返回预期结果，攻击者仅在其中加入第二输出。登录和密码变化数据描述主体、方法与 decision，却不描述每个模块如何处理秘密；旁路副本因此超出默认决策分析。Mandiant PTA Spy 和 CrowdStrike Network Provider 事件直接证明记录口令且认证链继续运行，Microsoft API 文档证明回调可合法收到明文或认证信息。独立组件与输出谱系能够恢复差异。
              en: >-
                The system delivers credentials to registered consumers in normal order and returns the expected result while the adversary adds only a second output. Sign-in and password-change data describe principal, method, and decision but not how every module handles the secret, leaving the side copy outside default decision analytics. Mandiant PTA Spy and CrowdStrike Network Provider reporting directly establish password recording while the authentication chain continues, and Microsoft API documentation establishes that callbacks legitimately receive plaintext or authentication information. Independent component and output lineage can recover the difference.
        evidence_keys:
          - TA0006-005-T1556-REF-MANDIANT-PTASPY
          - TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER
          - TA0006-005-T1556-REF-MS-PASSWORDFILTER
          - TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
        confidence: high
    defense:
      detection_strategy_keys:
        - TA0006-005-T1556-DET-SECRET-OUTPUT
      mitigation_keys:
        - TA0006-005-T1556-MIT-SECRET-HANDLING
    evidence_keys:
      - REF-000187
      - TA0006-005-T1556-REF-MANDIANT-PTASPY
      - TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER
      - TA0006-005-T1556-REF-MS-PASSWORDFILTER
      - TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
      - TA0006-005-T1556-REF-LINUX-PAM-AUTHTOK
    limitations:
      paragraphs:
        - zh: >-
            Mandiant 与 CrowdStrike 提供在野方法和结果证据，但没有公开每个受害者的完整模块 hash、所有收集主体或逐事务文件关联。Microsoft 与 Linux-PAM 文档证明合法数据流能力，不证明恶意使用。不同认证系统对模块归因和秘密输出的可见性差异很大；没有结果调查时，组件差异只能形成风险状态。
          en: >-
            Mandiant and CrowdStrike provide in-the-wild method and result evidence but do not publish every victim's complete module hashes, all collected principals, or transaction-level file joins. Microsoft and Linux-PAM documentation establishes legitimate data-flow capability rather than malicious use. Authentication systems differ greatly in module attribution and secret-output visibility; without outcome investigation, a component difference remains a risk state.
  - temporary_key: TA0006-005-T1556-CHILD-RECOVERABLE
    name:
      zh: 策略诱导的未来秘密可恢复化
      en: Policy-Induced Future-Secret Recoverability
    disposition: formal
    confidence: medium
    taxonomy_variable:
      zh: 攻击者是否先改变秘密保护策略，使后续凭据变化产生原本不会存在的可恢复材料
      en: Whether the adversary first changes secret-protection policy so later credential changes create recoverable material that otherwise would not exist
    counterfactual_trace:
      zh: 正常强保护下密码变化只留下单向验证材料；弱化后，同一变化在有效作用域内生成可解密或等价可恢复状态，形成策略版本、变化事务和材料形态的时间链。
      en: Under normal strong protection, password change leaves only one-way verifier material; after weakening, the same change creates decryptable or equivalently recoverable state in effective scope, forming a timeline across policy version, change transaction, and material form.
    summary:
      zh: 攻击者先弱化凭据存储保护，使以后新设或变化的秘密进入可恢复形态，并在正常认证继续工作的外观下等待材料生成和取用。
      en: Adversaries first weaken credential-storage protection so secrets later created or changed enter a recoverable form, then wait for material generation and retrieval while ordinary authentication continues to work.
    definition_and_concept:
      paragraphs:
        - zh: >-
            策略诱导的未来秘密可恢复化是攻击者改变域、账户或等价认证存储策略，使策略生效后新设或变化的密码及认证材料以可逆加密或其他攻击者可恢复形态生成的匿迹子技术。直接对象是保护语义变化造成的新材料结果；只存在一个宽松设置但没有后续凭据变化，仍是暴露状态而非完成的 Credential Access。
          en: >-
            Policy-Induced Future-Secret Recoverability changes domain, account, or equivalent authentication-storage policy so passwords or authentication material created or changed after policy becomes effective are generated under reversible encryption or another adversary-recoverable form. Its direct object is new material caused by changed protection semantics. A permissive setting without a later credential change remains exposure rather than completed Credential Access.
        - zh: >-
            区分变量是弱化前后材料的可恢复性与生成时序，不是 Group Policy、AD 属性、CHAP、Digest 或某一加密字段。攻击者需要把策略变化、有效作用域、后继秘密变化和材料存在连接起来；实际读取、解密和使用可以作为更强结果另行分级。普通策略修改若只降低防御强度归 TA0112，读取既存密码库归 T1555/T1003。
          en: >-
            The distinguishing variable is material recoverability and generation timing before and after weakening, not Group Policy, an AD attribute, CHAP, Digest, or one encryption field. Classification joins policy mutation, effective scope, later secret change, and material existence; actual read, decryption, and use are stronger later tiers. Ordinary policy modification that only reduces defense belongs to TA0112, while reading an existing password store belongs to T1555 or T1003.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            策略诱导的未来秘密可恢复化不必造成登录失败、账户变更提示或新进程。策略可作为合法兼容设置存在，真正的材料结果在数小时或数周后的正常密码轮换中产生；当前状态审查可能只看到一个有效策略或已恢复的安全值，而看不到弱化窗口内哪些主体已经写入较弱材料。攻击者因此把控制变化、材料生成和后续读取分散到不同时间和日志面。
          en: >-
            Policy-Induced Future-Secret Recoverability need not cause sign-in failures, account-change prompts, or new processes. The policy can exist as a legitimate compatibility setting, while the material result appears hours or weeks later during ordinary password rotation. Current-state review may show only a valid policy or a restored secure value without revealing which principals wrote weaker material during the window. The adversary thus separates control mutation, material generation, and later read across time and log planes.
        - zh: >-
            残余包括 4739 或等价策略 old/new、账户或细粒度策略属性、有效优先级与作用域、密码设置/变化时间、目录材料形态指示、敏感属性和 LSA 秘密读取、复制来源及后续密码轮换。合法 CHAP、Digest 与旧系统兼容确实可能需要该设置；只有未经批准 writer、异常作用域、材料生成和恢复/读取证据连接时才能提高置信度。
          en: >-
            Residue includes event 4739 or equivalent policy old and new values, account or fine-grained policy attributes, effective precedence and scope, password-set or change time, directory material-form indicators, sensitive-attribute and LSA-secret reads, replication origin, and later password rotation. Legitimate CHAP, Digest, and legacy compatibility can require the setting. Confidence rises only when an unapproved writer, anomalous scope, material creation, and recovery or read evidence are joined.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入至少要求：攻击者控制或未经批准的保护策略变化；策略在目标主体变化时有效；变化后产生可恢复材料或由受控调查证明恢复能力。只启用设置为 exposure，只有后继密码变化但没有材料可见性为 at-risk-change，材料存在为 material-created，实际恢复或经确认暴露为 recovered。各层不能相互替代。
          en: >-
            Inclusion requires at least an adversary-controlled or unapproved protection-policy change, policy effectiveness when a target principal changes credentials, and recoverable material creation or controlled-investigation proof of recovery capability. Enablement alone is exposure; a later password change without material visibility is at-risk-change; material presence is material-created; and actual recovery or confirmed exposure is recovered. Tiers cannot substitute for one another.
        - zh: >-
            已经存在的明文或弱保护秘密归 T1552，直接从操作系统认证材料读取归 T1003，从受管理保管库取用归 T1555。修改 MFA 或 Conditional Access 使会话绕过控制但未产生秘密，分别由 NJS-0093-002 与 TA0112 处理。合法兼容例外必须最小化主体、自动到期、监控每次密码变化，并在关闭设置后重新设置期间产生的全部凭据；仅把策略恢复为 Disabled 不会自动消除既有可恢复材料。
          en: >-
            Existing plaintext or weakly protected secrets belong to T1552, direct operating-system authentication-material reads to T1003, and managed-vault retrieval to T1555. MFA or Conditional Access change that bypasses a control without producing a secret belongs to NJS-0093-002 and TA0112 as applicable. Legitimate compatibility exceptions must minimize principals, expire automatically, monitor each password change, and reset every credential created during the interval after disabling the setting. Restoring Disabled alone does not remove existing recoverable material.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              攻击者取得域密码策略、细粒度密码策略或账户属性写权后，将选定用户、组或整个域置于可逆保护状态，并等待例行轮换、帮助台重置或新账户创建。随后攻击者通过目录复制、属性读取和相关系统秘密取得恢复组件。高价值但定期轮换的服务或管理员账户是潜在目标；直接结果必须按材料生成而不是按开关时间统计。
            en: >-
              After obtaining write authority over domain password policy, fine-grained password policy, or account attributes, an adversary places selected users, groups, or the whole domain under reversible protection and waits for routine rotation, help-desk reset, or account creation. The adversary later obtains recovery components through directory replication, attribute reads, and related system secrets. High-value service or administrator accounts that rotate periodically are plausible targets, and the direct result must be counted from material creation rather than switch time.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要修改有效策略或主体属性的权限，理解继承与优先级，并能让策略维持到目标秘密变化。完成恢复还需要读取相应目录字段、系统秘密或等价密钥。策略变更审计、双人审批、禁止可逆存储、短时例外、对象级读取限制和自动识别弱化窗口内主体会提高成本。目标未变化密码、策略未生效或恢复组件不足都会使攻击链停在暴露或尝试。
              en: >-
                The adversary needs authority to change effective policy or principal attributes, knowledge of inheritance and precedence, and ability to keep the policy in place until a target secret changes. Recovery additionally requires relevant directory fields, system secrets, or equivalent keys. Policy-change audit, two-person approval, prohibition of reversible storage, short exceptions, object-level read restrictions, and automatic identification of principals changed during the window raise cost. An unchanged target password, ineffective policy, or missing recovery components leaves the chain at exposure or attempt.
        defender_model:
          paragraphs:
            - zh: >-
                防守方需要版本化域/细粒度/账户策略和有效解析、4739 或等价变化事件、密码设置/重置审计、材料形态元数据、目录读取/复制和响应轮换记录。观察必须覆盖从最后可信策略、弱化生效、每个密码变化，到策略撤销后受影响秘密安全重置。不得把可恢复字段内容送入分析系统；只使用存在性、版本、对象 ID 和调查结果。
              en: >-
                Defenders need versioned domain, fine-grained, and account policy with effective resolution; event 4739 or equivalent change events; password-set or reset audit; material-form metadata; directory read or replication; and response rotation records. Observation must cover last trusted policy, effective weakening, each password change, and secure reset of affected secrets after policy removal. Recoverable field contents must never be sent to the analytic system; presence, version, object ID, and investigation result suffice.
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        summary:
          zh: 合法兼容策略外观隐藏后续材料保护降级
          en: Legitimate compatibility policy appearance hides later material-protection downgrade
        analysis:
          paragraphs:
            - zh: >-
                攻击者使用系统支持的策略和值，不必部署新的秘密读取进程；正常密码变化和登录继续成功，且 CHAP/Digest 等合法兼容需求提供相似解释。真正差异存在于未经批准的 effective scope、弱化窗口和变化后材料形态，粗粒度“策略有效”“密码已更新”检查无法区分，形成特征伪装。Microsoft 明确说明可逆存储可被解密且禁用后既有密码仍保持可逆直至再次变化；事件 4739 提供策略差分，但不自动证明材料恢复。
              en: >-
                The adversary uses a supported policy and value without deploying a new secret-reading process. Ordinary password changes and sign-ins continue to succeed, and legitimate CHAP or Digest compatibility provides a similar explanation. The discriminating evidence lies in unapproved effective scope, weakening interval, and post-change material form, so coarse checks that policy is valid and password updated cannot distinguish the state, producing Feature Disguise. Microsoft states that reversibly stored passwords can be decrypted and that disabling the policy leaves existing passwords reversible until changed again. Event 4739 supplies policy differential but does not prove recovery by itself.
        evidence_keys:
          - REF-000187
          - TA0006-005-T1556-REF-MS-REVERSIBLE
          - TA0006-005-T1556-REF-MS-EVENT4739
        confidence: medium
    defense:
      detection_strategy_keys:
        - TA0006-005-T1556-DET-SECRET-OUTPUT
      mitigation_keys:
        - TA0006-005-T1556-MIT-SECRET-HANDLING
    evidence_keys:
      - REF-000187
      - TA0006-005-T1556-REF-MS-REVERSIBLE
      - TA0006-005-T1556-REF-MS-EVENT4739
    limitations:
      paragraphs:
        - zh: >-
            Microsoft 文档直接证明设置语义、未来密码变化和关闭设置后的残余风险，ATT&CK 19.1 提供攻击者使用路径；本批未找到公开事件同时披露恶意 writer、目标后继密码变化、全部恢复组件和实际明文恢复。因此子项按稳定变量正式提出，但存在性和机理保持 medium，具体事件没有 material-created 或 recovered 证据时不得宣称凭据取得。
          en: >-
            Microsoft documentation directly establishes setting semantics, later password changes, and residual risk after disabling, while ATT&CK 19.1 supplies the adversary-use path. This batch found no public incident publishing malicious writer, a target's later password change, all recovery components, and actual plaintext recovery together. The child is formally proposed for its stable variable, but existence and mechanism remain medium confidence, and an event cannot claim credential acquisition without material-created or recovered evidence.
defense_candidates:
  detection_strategies:
    - temporary_key: TA0006-005-T1556-DET-SECRET-OUTPUT
      resolution: create
      name:
        zh: 认证路径变化—秘密材料结果谱系
        en: Authentication-Path Change to Secret-Material Outcome Lineage
      summary:
        zh: 将认证消费者或保护策略的未经批准变化分别连接到事务内第二输出或后继可恢复材料，分级识别认证路径造成的凭据取得。
        en: Join unapproved authentication-consumer or protection-policy changes to an in-transaction second output or later recoverable material and tier credential acquisition caused by the authentication path.
      description:
        paragraphs:
          - zh: >-
              本策略检测“认证路径变化直接产生秘密材料结果”，不把模块注册、密码变化、策略启用、敏感文件写入或后继登录单独视为完成。第一条 Analytic 为每个认证或密码变化事务恢复组件链和允许的秘密接收者，将未批准模块及其文件、IPC 或网络第二输出连接到事务；第二条 Analytic 版本化保护策略，计算有效作用域，并把弱化窗口中的密码变化连接到可恢复材料和后继读取。
            en: >-
              This strategy detects an authentication-path change directly producing a secret-material result and does not treat module registration, password change, policy enablement, sensitive-file write, or successor sign-in alone as completion. The first Analytic reconstructs the component chain and allowed secret recipients for each authentication or password-change transaction, joining an unapproved module and its file, IPC, or network second output to that transaction. The second versions protection policy, computes effective scope, and joins password changes inside a weakening interval to recoverable material and later reads.
          - zh: >-
              输出分为 change-only、transaction-traversed、suspicious-output、material-created、recovered 与 successor-use-linked。任何阶段不得记录真实秘密；由对象 ID、组件/策略版本、事务、敏感分类、调查确认和轮换范围证明。合法同步、凭据管理、PAM、CHAP/Digest 和迁移是强反例，必须用 owner、批准、作用域、受保护目的地、寿命和删除/轮换证据排除。
            en: >-
              Outputs are change-only, transaction-traversed, suspicious-output, material-created, recovered, and successor-use-linked. No stage records actual secrets; object IDs, component or policy version, transaction, sensitivity classification, investigation confirmation, and rotation scope establish evidence. Legitimate synchronization, credential management, PAM, CHAP or Digest, and migration are strong counterexamples and require owner, approval, scope, protected destination, lifetime, and deletion or rotation evidence.
      detects_keys:
        - NJT-0093-after-extension
        - TA0006-005-T1556-CHILD-SIDECOPY
        - TA0006-005-T1556-CHILD-RECOVERABLE
      domains:
        - enterprise
      analytic_keys:
        - TA0006-005-T1556-NJA-SIDECOPY
        - TA0006-005-T1556-NJA-RECOVERABLE
      evidence_keys:
        - TA0006-005-T1556-REF-MANDIANT-PTASPY
        - TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER
        - TA0006-005-T1556-REF-MS-PASSWORDFILTER
        - TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
        - TA0006-005-T1556-REF-MS-REVERSIBLE
        - TA0006-005-T1556-REF-MS-EVENT4739
  detection_analytics:
    - temporary_key: TA0006-005-T1556-NJA-SIDECOPY
      resolution: create
      strategy_key: TA0006-005-T1556-DET-SECRET-OUTPUT
      name:
        zh: 认证消费者—事务—秘密第二输出关联
        en: Authentication Consumer-Transaction-Secret Second-Output Correlation
      summary:
        zh: 恢复认证组件和允许消费者基线，把真实认证事务与未批准消费者及其敏感第二输出连接并分级。
        en: Reconstruct authentication-component and allowed-consumer baselines, then join real transactions to unapproved consumers and their sensitive second outputs with tiered results.
      domains: [enterprise]
      platforms: [Windows, Linux, macOS, Network Devices, Identity Provider, IaaS, SaaS]
      logic:
        paragraphs:
          - zh: >-
              为每个认证节点建立可信组件图：服务/进程、模块或代理 ID、路径与内存区域、hash/signer、注册或 PAM 栈顺序、加载时间、writer、更新事务、业务 owner、允许接收的秘密类别和批准目的地。把当前状态与同版本黄金映像、签名清单和前一可信快照比较；新增、替换、顺序变化、异常 signer 或无批准消费者输出 change-only，并保留合法升级与同步配置作为反例。
            en: >-
              Build a trusted component graph per authentication node containing service or process, module or agent ID, path and memory region, hash or signer, registration or PAM-stack order, load time, writer, update transaction, business owner, allowed secret class, and approved destination. Compare current state with a same-version golden image, signer inventory, and prior trusted snapshot. New or replaced consumers, order change, unexpected signer, or missing approval emits change-only while approved upgrade and synchronization remain counterexamples.
          - zh: >-
              将每次登录、密码设置或变化规范为 transaction ID、节点、主体伪名、事务类型、调用消费者、方法和 decision；在同一进程/线程、事务 ID 或十秒窗口内连接文件创建/追加、敏感对象写入、IPC、socket 和网络会话。只有改变组件被真实事务调用输出 transaction-traversed；未批准消费者产生新目的地但内容未知输出 suspicious-output；受控 canary、文件格式、受害方调查或轮换范围确认认证材料时输出 material-created；外传或后继身份使用只提高后续层级。
            en: >-
              Normalize each sign-in, password set, or password change into transaction ID, node, pseudonymous principal, transaction type, invoked consumers, method, and decision. Join file creation or append, sensitive-object write, IPC, socket, and network session by process or thread, transaction ID, or a ten-second window. A changed component invoked by a real transaction emits transaction-traversed. An unapproved consumer creating a new destination with unknown content emits suspicious-output. A controlled canary, file format, victim investigation, or rotation scope confirming authentication material emits material-created. Exfiltration or later identity use raises only successor tiers.
          - zh: >-
              对 PTA 等跨平面代理，把云 sign-in/correlation ID、代理 ID、节点 IP、转发时间、本地验证请求和代理输出连接。对 Network Provider、PasswordFilter 或 PAM，优先使用组件加载/注册键、认证服务进程、密码变化或登录事务和输出对象。任何分析不得采集、hash 或比对真实口令；跨主体同一秘密判断只允许在隔离 canary 环境完成。
            en: >-
              For cross-plane agents such as PTA, join cloud sign-in or correlation ID, agent ID, node IP, forward time, local validation request, and agent output. For Network Provider, PasswordFilter, or PAM, prefer component load or registration key, authentication-service process, password-change or sign-in transaction, and output object. The analytic must never collect, hash, or compare real passwords; same-secret testing across principals is permitted only with isolated canaries.
      data_requirements:
        - source_type: authentication-component-state
          name: {zh: 认证组件、模块、代理与注册状态, en: Authentication component, module, agent, and registration state}
          channel: null
          required_fields: [timestamp, node_id, service_or_process_id, component_or_agent_id, path_or_memory_region, hash_or_signer, registration_or_stack_order, load_state, writer_id, update_transaction_id, approval_id, owner_id]
        - source_type: authentication-transaction
          name: {zh: 登录与密码变化事务, en: Sign-in and password-change transactions}
          channel: null
          required_fields: [timestamp, node_or_tenant_id, transaction_id, principal_pseudonym, transaction_type, invoked_component_ids, authentication_methods, final_decision, process_or_service_id]
        - source_type: authentication-consumer-output
          name: {zh: 认证消费者文件、IPC 与网络输出, en: Authentication-consumer file, IPC, and network output}
          channel: null
          required_fields: [timestamp, node_id, process_or_thread_id, component_id, output_type, output_object_or_destination_id, bytes_written, sensitivity_class, transaction_id, outcome]
        - source_type: credential-exposure-investigation
          name: {zh: 凭据暴露调查与轮换范围, en: Credential-exposure investigation and rotation scope}
          channel: null
          required_fields: [investigation_id, finding_time, affected_node_or_tenant, material_class, affected_principal_scope, evidence_object_ids, first_possible_exposure, last_possible_exposure, rotation_status]
      observables:
        - zh: 未批准或异常 signer 的认证消费者被注册/加载，随后同一消费者在真实认证事务附近创建新敏感文件、IPC 或外连。
          en: An unapproved authentication consumer or one with an unexpected signer is registered or loaded and then creates a new sensitive file, IPC, or outbound connection near a real authentication transaction.
        - zh: PTA/身份代理注册或映像异常，云登录经该代理转发后本地出现非标准材料输出或经调查确认的口令仓库。
          en: A PTA or identity agent has anomalous registration or image state, and cloud sign-ins forwarded through it are followed by nonstandard local material output or an investigation-confirmed password repository.
        - zh: Network Provider、PasswordFilter 或 PAM 栈变化与后续管理员登录/密码变化及同一服务进程写盘形成链条。
          en: A Network Provider, PasswordFilter, or PAM-stack change forms lineage with later administrator sign-in or password change and a disk write by the same service process.
      correlation:
        window:
          zh: 组件变化从前一可信快照持续到可信恢复和期间秘密轮换；事务至第二输出默认十秒，代理跨平面允许五分钟，后继使用覆盖暴露材料完整有效期。
          en: Component change begins at the prior trusted snapshot and continues through trusted recovery and rotation of secrets exposed during the interval. Use ten seconds from transaction to second output by default, five minutes for cross-plane agents, and the full exposed-material lifetime for successor use.
        dimensions: [node_or_tenant, component_or_agent, component_version, registration_key_or_stack, writer, transaction, principal_pseudonym, process_or_thread, output_object_or_destination, approval, time]
      false_positives:
        - zh: 批准的密码同步、网络凭据管理、SSO/PTA、PAM 集成和帮助台迁移会注册消费者并处理真实秘密。
          en: Approved password synchronization, network credential management, SSO or PTA, PAM integration, and help-desk migration register consumers and handle real secrets.
        - zh: 认证软件升级、热补丁、灾难恢复和测试 canary 会产生组件与短时输出差异。
          en: Authentication-software upgrade, hot patch, disaster recovery, and test canaries create component and short-lived output differences.
      blind_spots:
        - zh: 平台不记录调用模块、事务 ID 或输出归属时，只能做进程与时间弱关联。
          en: Platforms omitting invoked modules, transaction IDs, or output attribution permit only weak process and time correlation.
        - zh: 纯内存副本、内核下层篡改或同一管理员控制黄金映像和日志出口会掩盖状态与输出。
          en: Memory-only copies, compromise below the kernel, or one administrator controlling golden images and log export can hide state and output.
      tuning_guidance:
        paragraphs:
          - zh: >-
              白名单必须绑定具体组件 hash/signer、注册键或栈位置、业务 owner、允许的秘密类别、受保护目的地、部署窗口和到期，不得永久放行 LSA、sshd、mpnotify、身份连接器或管理员组。先对 change-only 与 transaction-traversed 建立资产覆盖，再仅在第二输出和调查证据存在时提高到材料结果；敏感值一律字段级丢弃。
            en: >-
              Allowances must bind a concrete component hash or signer, registration key or stack position, business owner, permitted secret class, protected destination, deployment window, and expiry rather than permanently allowing LSA, sshd, mpnotify, identity connectors, or administrator groups. Establish asset coverage for change-only and transaction-traversed first, and raise to material outcome only with second-output and investigation evidence. Drop sensitive values at field level.
      evidence_keys:
        - TA0006-005-T1556-REF-MANDIANT-PTASPY
        - TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER
        - TA0006-005-T1556-REF-MS-PASSWORDFILTER
        - TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
        - TA0006-005-T1556-REF-LINUX-PAM-AUTHTOK
    - temporary_key: TA0006-005-T1556-NJA-RECOVERABLE
      resolution: create
      strategy_key: TA0006-005-T1556-DET-SECRET-OUTPUT
      name:
        zh: 保护策略—凭据变化—可恢复材料谱系
        en: Protection Policy-Credential Change-Recoverable Material Lineage
      summary:
        zh: 解析有效秘密保护策略，将弱化窗口内密码变化连接到材料形态、敏感读取和处置轮换。
        en: Resolve effective secret-protection policy and join password changes within a weakening interval to material form, sensitive reads, and remediation rotation.
      domains: [enterprise]
      platforms: [Windows, Identity Provider]
      logic:
        paragraphs:
          - zh: >-
              版本化域、细粒度和账户级密码保护设置，保存 policy/object ID、old/new、可逆标志、include/exclude、优先级、writer、来源、审批、生效与到期；按主体和事件时间解析实际 effective state。未经批准从强保护转为可恢复、作用域异常扩大或无到期设置输出 exposure；只有当前设置而无历史时标记 visibility-degraded。
            en: >-
              Version domain, fine-grained, and account password-protection settings with policy or object ID, old and new values, reversible flag, include and exclude, precedence, writer, origin, approval, effective time, and expiry. Resolve actual effective state per principal at event time. An unapproved strong-to-recoverable transition, anomalously expanded scope, or unbounded setting emits exposure. Current state without history is visibility-degraded.
          - zh: >-
              把弱化窗口内的账户创建、密码设置与变化连接到主体有效策略和材料形态元数据。策略已生效且密码变化输出 at-risk-change；目录或受控调查确认相应可恢复对象存在输出 material-created；随后未批准的敏感属性、目录复制或恢复组件读取输出 recovery-access；实际恢复或受害方确认输出 recovered。禁用策略后追踪每个受影响主体的新安全密码变化，全部完成才关闭窗口。
            en: >-
              Join account creation, password set, and password change inside the weakening interval to principal effective policy and material-form metadata. Effective policy plus password change emits at-risk-change. Directory state or controlled investigation confirming the corresponding recoverable object emits material-created. A later unapproved sensitive-attribute, directory-replication, or recovery-component read emits recovery-access. Actual recovery or victim confirmation emits recovered. After disabling the policy, track a new secure password change for every affected principal and close the interval only when all are complete.
      data_requirements:
        - source_type: credential-protection-policy-version
          name: {zh: 域、细粒度和账户秘密保护策略版本, en: Domain, fine-grained, and account secret-protection policy versions}
          channel: null
          required_fields: [timestamp, directory_or_system_id, policy_or_object_id, version, reversible_or_recoverable_state, include_scope, exclude_scope, precedence, old_value, new_value, initiating_principal_id, approval_id, effective_at, valid_until]
        - source_type: credential-change-transaction
          name: {zh: 账户创建与密码设置/变化事务, en: Account creation and password-set or change transactions}
          channel: null
          required_fields: [timestamp, directory_or_system_id, principal_id, transaction_id, change_type, initiating_principal_id, effective_policy_id, outcome]
        - source_type: recoverable-material-state
          name: {zh: 可恢复认证材料存在性与版本元数据, en: Recoverable authentication-material presence and version metadata}
          channel: null
          required_fields: [timestamp, directory_or_system_id, principal_id, material_object_id, material_form, created_or_updated_at, source_transaction_id, presence_state]
        - source_type: sensitive-directory-read
          name: {zh: 敏感目录属性、复制与恢复组件读取, en: Sensitive directory attribute, replication, and recovery-component reads}
          channel: null
          required_fields: [timestamp, directory_or_system_id, requesting_principal_id, source_host, operation, object_or_attribute_id, material_object_id, request_id, authorization_result]
        - source_type: credential-remediation
          name: {zh: 受影响凭据轮换和材料清除, en: Affected-credential rotation and material clearance}
          channel: null
          required_fields: [remediation_id, principal_id, policy_secure_at, secure_reset_at, old_material_invalidated, token_or_session_revocation_status, verification_result]
      observables:
        - zh: 密码保护策略从禁用可逆变为启用，缺少批准或异常扩大作用域，之后作用域内主体发生密码变化。
          en: Password-protection policy moves from reversible disabled to enabled without approval or with anomalously expanded scope, followed by password change for an in-scope principal.
        - zh: 弱化窗口内的密码变化产生可恢复材料存在性指示，随后同一对象或恢复组件被异常目录复制或读取。
          en: A password change inside the weakening interval produces a recoverable-material presence indicator, followed by anomalous directory replication or read of the same object or recovery components.
        - zh: 策略恢复安全值后，弱化窗口内主体没有重新设置密码，残余材料风险持续存在。
          en: After policy returns to a secure value, principals changed during the weakening interval have not reset passwords and residual material risk persists.
      correlation:
        window:
          zh: 从最后可信策略版本到弱化生效，持续到策略恢复且所有受影响主体完成安全密码变化和相关会话撤销；精确 policy/principal/material ID 优先，默认至少保留一年以覆盖低频轮换。
          en: Begin at the last trusted policy version and continue from effective weakening until policy restoration, secure password change for every affected principal, and related session revocation. Prefer exact policy, principal, and material IDs and retain at least one year by default for infrequent rotation.
        dimensions: [directory_or_system, policy_or_object, effective_scope, writer, principal, password_change_transaction, material_object, read_request, approval, time]
      false_positives:
        - zh: 经批准的 CHAP、Digest、旧应用兼容、迁移和灾难恢复可能短时要求可逆保护。
          en: Approved CHAP, Digest, legacy-application compatibility, migration, and disaster recovery can temporarily require reversible protection.
        - zh: 帮助台批量重置和目录恢复会在相同窗口产生大量密码变化与属性读取。
          en: Help-desk bulk reset and directory recovery can create many password changes and attribute reads in the same interval.
      blind_spots:
        - zh: 只保留当前策略、无法解析细粒度优先级或没有材料存在性元数据时，无法证明 material-created。
          en: Current-state-only policy, unresolved fine-grained precedence, or missing material-presence metadata prevents proof of material-created.
        - zh: 目录复制日志不列属性、读取来自受信域控或攻击者控制审批和日志时，恢复访问可能不可见。
          en: Recovery access may be invisible when directory-replication logs omit attributes, reads originate from trusted domain controllers, or the adversary controls approval and logs.
      tuning_guidance:
        paragraphs:
          - zh: >-
              对默认禁用建立强制基线；任何例外必须绑定协议依赖、最小主体、owner、双人批准、自动到期和受影响主体队列。事件 4739 只证明域策略变化，还需解析账户/细粒度策略和实际密码变化。告警不得读取材料值；按 exposure、at-risk-change、material-created、recovery-access 和 recovered 分层，关闭前验证全部受影响凭据已在安全策略下重新设置。
            en: >-
              Enforce disabled as baseline. Every exception must bind protocol dependency, minimum principals, owner, two-person approval, automatic expiry, and an affected-principal queue. Event 4739 proves only a domain-policy change and must be combined with account or fine-grained policy and actual password changes. Alerts must not read material values. Tier exposure, at-risk-change, material-created, recovery-access, and recovered, and verify every affected credential was reset under secure policy before closure.
      evidence_keys:
        - REF-000187
        - TA0006-005-T1556-REF-MS-REVERSIBLE
        - TA0006-005-T1556-REF-MS-EVENT4739
  mitigations:
    - temporary_key: TA0006-005-T1556-MIT-SECRET-HANDLING
      resolution: create
      name:
        zh: 认证秘密消费者与可恢复性治理
        en: Authentication Secret-Consumer and Recoverability Governance
      summary:
        zh: 以最小认证消费者、受保护输出、禁止可逆存储和按暴露窗口轮换，减少认证路径变化产生秘密副本或可恢复材料的机会。
        en: Reduce authentication-path secret copies and recoverable material through minimized secret consumers, protected outputs, prohibited reversible storage, and exposure-window rotation.
      description:
        paragraphs:
          - zh: >-
              本缓解把能够接触认证秘密的组件和策略视为独立高价值面。组织应登记每个过滤器、Provider、PAM、PTA/SSO 代理及同步消费者的 signer/hash、调用位置、业务 owner、允许材料、目的地和寿命；限制注册、加载和策略写权，使用受保护进程、只读或度量启动、签名模块、隔离更新和双人批准。默认禁止可逆秘密存储，只有无法淘汰的协议依赖才能获得最小、限时例外。
            en: >-
              This mitigation treats components and policy able to handle authentication secrets as a separate high-value surface. Inventory signer or hash, invocation point, business owner, allowed material, destination, and lifetime for every filter, provider, PAM, PTA or SSO agent, and synchronization consumer. Restrict registration, load, and policy-write authority and use protected processes, read-only or measured boot, signed modules, isolated update, and two-person approval. Prohibit reversible secret storage by default, allowing only minimum time-bounded exceptions for protocol dependencies that cannot yet be removed.
          - zh: >-
              发现可疑消费者或弱化策略后，先保全组件、配置、策略、事务和输出对象证据，再停止第二输出、从可信介质恢复组件、撤销代理与策略例外，并按从植入/弱化开始到可信恢复期间真实登录或变化的主体计算轮换范围。真实秘密不得用于检测 canary；应使用无生产权限的隔离账户。只删除 DLL、恢复策略开关或重置最初被攻陷管理员都不足以处置已经复制或可恢复的秘密。
            en: >-
              After discovering a suspicious consumer or weakened policy, preserve component, configuration, policy, transaction, and output-object evidence before stopping the second output, restoring components from trusted media, revoking agents and policy exceptions, and calculating rotation scope from principals that actually signed in or changed credentials between implantation or weakening and trusted recovery. Detection canaries must use isolated accounts with no production access. Deleting a DLL, restoring a policy switch, or resetting only the initially compromised administrator is insufficient for secrets already copied or made recoverable.
      domains: [enterprise]
      measures:
        - key: secret-consumer-inventory-allowlist
          name: {zh: 认证秘密消费者清单与最小化, en: Authentication Secret-Consumer Inventory and Minimization}
          description:
            paragraphs:
              - zh: >-
                  枚举认证服务调用的全部过滤器、Provider、PAM、代理和同步组件，固定 signer/hash、注册/栈位置、owner、用途、输入类别和受保护目的地；删除未知、重复和过期消费者。变更仅通过隔离管理面、签名包、双人批准和可回滚部署，运行态与磁盘态分别度量。
                en: >-
                  Enumerate every filter, provider, PAM, agent, and synchronization component invoked by authentication services, binding signer or hash, registration or stack position, owner, purpose, input class, and protected destination. Remove unknown, duplicate, and expired consumers. Permit changes only through isolated administration, signed packages, two-person approval, and recoverable deployment, measuring runtime separately from disk state.
          control_type: preventive
        - key: secret-output-containment
          name: {zh: 秘密输出限制与无值遥测, en: Secret-Output Containment and Value-Free Telemetry}
          description:
            paragraphs:
              - zh: >-
                  禁止认证组件向普通文件、用户可写目录或任意网络目的地输出秘密；合法同步使用专用身份、加密通道、硬件或隔离密钥面、最小 ACL、短保留和可审计删除。遥测仅记录事务、消费者、目的地对象和敏感分类，不记录、hash 或采样真实口令。
                en: >-
                  Prohibit authentication components from writing secrets to ordinary files, user-writable directories, or arbitrary network destinations. Legitimate synchronization uses dedicated identity, encrypted channel, hardware or isolated key plane, minimum ACLs, short retention, and auditable deletion. Telemetry records transaction, consumer, destination object, and sensitivity class without recording, hashing, or sampling real passwords.
          control_type: exposure-reduction
        - key: nonrecoverable-policy-enforcement
          name: {zh: 不可恢复存储强制与兼容例外退出, en: Nonrecoverable Storage Enforcement and Compatibility-Exception Exit}
          description:
            paragraphs:
              - zh: >-
                  对域、细粒度和账户级策略强制禁止可逆秘密存储，持续解析有效作用域并告警任何偏离。确需 CHAP、Digest 或旧系统时，将例外限制到最少主体，指定 owner、替代计划、自动到期、变化监控和每次复核；迁移到不需要可恢复密码的协议后删除例外。
                en: >-
                  Enforce nonrecoverable secret storage across domain, fine-grained, and account policy, continuously resolving effective scope and alerting on deviation. Where CHAP, Digest, or a legacy system is unavoidable, restrict the exception to minimum principals with an owner, replacement plan, automatic expiry, change monitoring, and review on every use, then remove it after migration to a protocol that does not require recoverable passwords.
          control_type: preventive
        - key: exposure-window-recovery
          name: {zh: 按认证事务与弱化窗口恢复, en: Authentication-Transaction and Weakening-Window Recovery}
          description:
            paragraphs:
              - zh: >-
                  保留组件/策略历史与认证事务索引，事件处置时枚举植入后经过恶意消费者或在弱化策略下变化的全部主体，轮换密码、密钥和相关认证材料，撤销令牌与会话，清除输出和可恢复对象，并验证旧材料拒绝。恢复前保全证据，恢复后监控旧组件、代理、策略和值重新出现。
                en: >-
                  Retain component and policy history plus authentication-transaction indexes. During response, enumerate every principal whose transaction traversed the malicious consumer or whose secret changed under weakened policy, rotate passwords, keys, and related authentication material, revoke tokens and sessions, clear outputs and recoverable objects, and verify old material is rejected. Preserve evidence before recovery and monitor afterward for reappearance of old components, agents, policies, and values.
          control_type: containment
      applications:
        - target_key: NJT-0093-after-extension
          use:
            paragraphs:
              - zh: >-
                  对扩展后的父技术，在既有 MIT-000073 的验证结果完整性治理之外，建立每个秘密消费者和保护策略的独立清单，禁止非批准第二输出与可逆存储，并按具体认证事务和密码变化确定暴露主体。父级恢复同时处理异常允许路径和秘密结果，但不能假定一方的清除自动覆盖另一方。
                en: >-
                  For the extended parent, add an independent inventory of every secret consumer and protection policy to existing MIT-000073 authentication-outcome integrity controls, prohibit unapproved second outputs and reversible storage, and determine exposed principals from actual authentication transactions and password changes. Parent recovery handles anomalous allow paths and secret outcomes together without assuming cleanup of one automatically covers the other.
          expected_effect:
            paragraphs:
              - zh: >-
                  攻击者必须突破更小且可度量的组件/策略写面、伪造批准与独立清单，或把秘密输出藏过对象级监控；事件发生后，事务索引把轮换范围从猜测变为可审查集合。
                en: >-
                  The adversary must breach a smaller measured component and policy write surface, forge approval and independent inventory, or hide secret output from object-level monitoring. After an event, transaction indexes turn rotation scope from guesswork into a reviewable set.
          limitations:
            paragraphs:
              - zh: >-
                  旧设备和封闭身份平台可能无法输出模块归因或材料形态，严格禁用兼容设置也可能中断 CHAP/Digest 或同步。若攻击者同时控制构建、策略、目录和保留面，需要离线度量、职责分离和跨域调查。
                en: >-
                  Legacy devices and closed identity platforms may omit module attribution or material form, while strict compatibility disablement can interrupt CHAP, Digest, or synchronization. An adversary controlling build, policy, directory, and retention together requires offline measurement, separation of duties, and cross-domain investigation.
        - target_key: TA0006-005-T1556-CHILD-SIDECOPY
          use:
            paragraphs:
              - zh: >-
                  将每个合法认证消费者绑定具体 signer/hash、栈位置、owner、允许事务与受保护目的地，拒绝未知消费者和普通文件/任意外连。发现植入后按其有效期内真实经过节点的主体轮换，而不是只重置部署者。
                en: >-
                  Bind every legitimate authentication consumer to a specific signer or hash, stack position, owner, allowed transactions, and protected destination, rejecting unknown consumers and ordinary files or arbitrary egress. After finding an implant, rotate principals whose real transactions traversed the node during its lifetime rather than only resetting the deployer.
          expected_effect:
            paragraphs:
              - zh: >-
                  第二秘密接收者会同时产生未批准组件和目的地差异，攻击者难以仅借受信服务身份隐藏；事务级范围缩短响应遗漏与过度轮换。
                en: >-
                  A second secret recipient produces both unapproved-component and destination differences, making trusted service identity alone insufficient for concealment. Transaction-level scope reduces missed and excessive rotation.
          limitations:
            paragraphs:
              - zh: >-
                  合法消费者也处理明文且部分输出只在内存存在；模块白名单不能证明没有运行时补丁，输出阻断也不能追回已外传材料。需要运行度量、调查和后继身份监控共同完成。
                en: >-
                  Legitimate consumers also handle plaintext and some outputs exist only in memory. Module allowlists cannot prove absence of runtime patching, and output blocking cannot retrieve material already exfiltrated. Runtime measurement, investigation, and successor identity monitoring remain necessary.
        - target_key: TA0006-005-T1556-CHILD-RECOVERABLE
          use:
            paragraphs:
              - zh: >-
                  强制域、细粒度和账户策略默认不可恢复；兼容例外按主体和期限登记。若发生弱化，枚举有效窗口内所有创建、设置或变化密码的主体，在安全策略恢复后重新设置其密码，并限制和审计目录敏感材料及恢复组件读取。
                en: >-
                  Enforce nonrecoverable defaults for domain, fine-grained, and account policy and register compatibility exceptions by principal and expiry. After weakening, enumerate all principals whose passwords were created, set, or changed in the effective window, reset them after secure policy restoration, and restrict and audit reads of sensitive directory material and recovery components.
          expected_effect:
            paragraphs:
              - zh: >-
                  政策写入不再能静默等待未来轮换产生长期可恢复材料；即使短时弱化成功，主体队列和强制重新设置也缩短材料寿命并产生可核验关闭条件。
                en: >-
                  A policy write can no longer silently wait for future rotation to create long-lived recoverable material. Even after brief weakening, the principal queue and forced reset shorten material lifetime and provide a verifiable closure condition.
          limitations:
            paragraphs:
              - zh: >-
                  依赖旧协议的环境可能无法立即禁用，且当前策略恢复不改变旧材料；目录日志可能无法显示属性级读取。组织必须接受迁移成本并保留足以覆盖低频密码轮换的历史。
                en: >-
                  Environments depending on legacy protocols may not disable the setting immediately, and restoring current policy does not change old material. Directory logs may omit attribute-level reads. Organizations must accept migration cost and retain history long enough to cover infrequent password rotation.
      evidence_keys:
        - TA0006-005-T1556-REF-MANDIANT-PTASPY
        - TA0006-005-T1556-REF-CROWDSTRIKE-NETPROVIDER
        - TA0006-005-T1556-REF-MS-PASSWORDFILTER
        - TA0006-005-T1556-REF-MS-NPLOGONNOTIFY
        - TA0006-005-T1556-REF-MS-REVERSIBLE
        - TA0006-005-T1556-REF-MS-EVENT4739
