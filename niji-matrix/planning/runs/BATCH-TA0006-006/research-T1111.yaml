handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-006
work_item_ref: WORK-TA0006-T1111
temporary_key_prefix: TA0006-006-T1111
candidate:
  source_type: attack
  source_attack_id: T1111
  name:
    zh: 多因素认证证明截获
    en: Multi-Factor Authentication Proof Interception
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 的 T1111 属于 Credential Access，覆盖一次性验证码、软件令牌状态、认证服务内记录和智能卡代理等行为，但也把“截获材料”“通过受控端调用绑定认证器”和“诱导用户批准攻击者请求”等不同结果并置。TA0006 应保留攻击者取得 MFA 证明或持续证明生成能力这一直接目标，同时要求证明材料实际进入攻击者控制面且在到达时仍可能被验证者接受。只发现钓鱼页、读取权限、令牌文件、远程控制能力或 MFA 请求，不等于取得可用证明。
      en: ATT&CK Enterprise 19.1 T1111 belongs to Credential Access and spans one-time codes, software-token state, logging inside authentication services, and smart-card proxying, but it also places intercepted material, invocation of a bound authenticator through a controlled endpoint, and user approval of an attacker request beside one another. The TA0006 object should preserve the direct objective of obtaining an MFA proof or durable proof-generation capability while requiring evidence that material actually entered adversary control and could still be accepted by the verifier at arrival. A phishing page, read permission, token file, remote-control capability, or MFA request alone does not establish a usable proof.
    - zh: 建议 adapt，因为固定父行为值得保留，但 Niji 范围必须区分能力、材料到达、可重放或可生成、验证者接受和后继登录。零个 ATT&CK 子项只表示没有既有实现分区，不免除原生轴搜索。研究收敛出两项有结论级证据且防御观察不同的子项：短时单次证明截获，以及认证证明生成状态复制。智能卡驻留代理只有高质量样本能力分析，缺少同一在野事件中未导出秘密、实际调用绑定认证器并取得被接受证明的完整链，故保持 evidence-deferred，不为数量正式化。
      en: >-
        Adaptation is appropriate because the fixed parent behavior should remain, while Niji scope must distinguish capability, material arrival, replay or generation capability, verifier acceptance, and later sign-in. Zero ATT&CK children means only that no implementation partition exists; it does not remove the native-axis search obligation. Research converges on two children with conclusion-level evidence and distinct defensive observation: ephemeral single-proof capture and authentication proof-generator state replication. Resident smart-card proxying has high-quality malware capability analysis but lacks a complete same-incident field chain from non-exported secret through actual bound-authenticator invocation to an accepted proof, so it remains evidence-deferred rather than being formalized to fill a count.
proposed_content:
  summary:
    zh: 攻击者取得仍在有效期内的单次 MFA 证明或复制能够持续生成证明的认证器状态，使后续认证呈现为正常第二因素结果而隐藏材料控制者的变化。
    en: Adversaries obtain a still-valid single MFA proof or copy authenticator state capable of generating future proofs, allowing later authentication to present a normal second-factor result while hiding the change in material controller.
  definition_and_concept:
    paragraphs:
    - zh: 多因素认证证明截获是攻击者使验证者可接受的第二因素输出或其生成状态进入攻击者控制面。单次证明可以是短时验证码、一次性口令或等价手工认证输出；生成状态可以是软件令牌 seed、令牌容器或足以复现未来证明的材料。直接目的在于取得满足 MFA 验证步骤的能力，而不是只取得主口令、触发一次请求或偷到认证完成后的 Cookie 与会话令牌。
      en: Multi-Factor Authentication Proof Interception occurs when an adversary gains control of a verifier-acceptable second-factor output or the state that generates such outputs. A single proof may be a short-lived verification code, one-time password, or comparable manually transferable authenticator output. Generator state may be a software-token seed, token container, or material sufficient to reproduce future proofs. The immediate objective is capability to satisfy an MFA verification step, rather than merely obtaining a primary password, triggering a request, or stealing a cookie or session token after authentication.
    - zh: 证据按五级保存：捕获或读取能力、材料实际到达攻击者、材料在目标与时间上下文中可用、验证者接受、以及认证后身份或会话使用。Okta 对 Scatter Swine 的调查能够把 Twilio 控制台搜索、五分钟 OTP 有效期和一次成功测试分开；Fox-IT 则区分 actor 窃取软件令牌、研究者确定最可能路径、补丁后生成有效 token 与后继 VPN 账户使用。任何较低级证据都不得自动升级成下一层。
      en: >-
        Evidence is preserved in five tiers: capture or read capability, actual material arrival to the adversary, usability for the target and time context, verifier acceptance, and post-authentication identity or session use. Okta's Scatter Swine investigation separates Twilio-console searches, a five-minute OTP lifetime, and one successful test. Fox-IT separately distinguishes actor theft of a software token, researchers' assessment of the most likely path, valid token generation after a patch, and later VPN-account use. No lower tier automatically establishes the next.
  stealth_characteristics:
    paragraphs:
    - zh: 一次性证明由真实验证者签发或真实认证器生成，攻击者若在到期前先消费，身份平台可只看到正确格式、正确账户和一次成功 MFA；材料副本位于消息服务、仿冒输入面或被植入认证组件的事实不一定进入 IdP 决策日志。防守方需要把签发、投递、消息或组件访问、提交来源和消费结果连接，才能看到证明从预期持有者转向另一控制者。
      en: A one-time proof is issued by the genuine verifier or generated by a genuine authenticator. If the adversary consumes it first before expiry, the identity platform may see only correct format, the correct account, and a successful MFA step. The copy in a messaging service, impersonated input surface, or implanted authentication component need not appear in the IdP decision log. Defenders must join issuance, delivery, message or component access, submission origin, and consumption result to observe that control moved away from the intended holder.
    - zh: 生成状态复制把短时截获转成较长的证明生成能力。后续代码由相同 seed 与算法生成，验证者可得到与原软件令牌相同的数学结果，而没有每次投递或钓鱼事件；异常转移到 seed 容器读取、导出或导入、设备绑定绕过、同一认证器在不一致设备情境中的使用和暴露后的持续成功。可见结果仍是合法算法输出，材料来源和设备谱系才是区分点。
      en: Generator-state replication turns a short interception opportunity into longer-lived proof generation. Later codes come from the same seed and algorithm, so the verifier can receive the same mathematical result as from the original software token without a new delivery or phishing event each time. Anomalies move to seed-container read, export or import, device-binding bypass, use of one authenticator across inconsistent device contexts, and continuing success after exposure. The visible result remains a legitimate algorithm output; material provenance and device lineage carry the distinction.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求识别 MFA 对象、攻击者控制的取得路径、实际材料或生成状态结果，以及到达时的有效性或经验证的生成能力。只看到 SMS、邮件或认证器应用，只有消息服务控制台权限、仿冒页面、Hook、软件令牌文件名或智能卡 API，不足以证明材料到达。过期代码、已被先行消费的 OTP 或无法导入也无法生成有效证明的容器，只支持暴露或失败状态。
      en: Inclusion requires an MFA object, an attacker-controlled acquisition path, an actual material or generator-state result, and either validity at arrival or demonstrated generation capability. Merely observing SMS, email, an authenticator app, messaging-console authority, an impersonated page, a hook, a software-token filename, or a smart-card API does not prove material arrival. An expired code, an OTP already consumed first, or a container that cannot be imported or generate a valid proof supports exposure or failure only.
    - zh: NJT-0169/T1056 负责用户输入如何在键盘、仿冒界面或真实消费者中被复制；NJS-0093-003 负责受信认证事务怎样产生第二秘密输出。只有复制结果是仍可满足 MFA 的证明时，本技术才与它们并列。NJT-0165/T1187 负责受害主体为何主动发出认证交换，NJT-0136/T1557 负责信任路径改变或跨目标证明中继；它们不能替代证明材料到达攻击者的证据。
      en: NJT-0169/T1056 owns how user input is copied through a keyboard, impersonated interface, or genuine consumer. NJS-0093-003 owns how a trusted authentication transaction creates a second secret output. This technique coexists with them only when the copied result is a proof still capable of satisfying MFA. NJT-0165/T1187 owns why a victim principal emits an authentication exchange, and NJT-0136/T1557 owns trust-path alteration or cross-destination proof relay. Neither substitutes for evidence that proof material reached the adversary.
    - zh: T1621 负责攻击者生成 MFA 请求以及疲劳、误导或简单批准形成的认证结果；用户批准了攻击者自己的 push 请求并不表示攻击者截获了证明。认证方法新增、替换电话或绑定新设备的状态变化归 T1098 等身份状态操纵，本技术只在该变化又使证明实际到达时并列。验证者已接受证明后的账户进入与资源操作归 NJT-0061/Valid Accounts，Cookie、应用 token 或会话状态归 T1539/T1528 或相应会话对象。
      en: T1621 owns adversary generation of MFA requests and authentication outcomes caused by fatigue, deception, or simple approval. A user approving the adversary's own push does not mean the adversary intercepted a proof. Adding an authentication method, replacing a phone number, or binding a new device belongs to identity-state manipulation such as T1098; this technique coexists only when that change also causes actual proof delivery. Account entry and resource operations after verifier acceptance belong to NJT-0061/Valid Accounts, while cookies, application tokens, or session state belong to T1539/T1528 or the corresponding session object.
    - zh: 正常 MFA 流程会产生签发、投递、恢复、设备迁移、备用因子、共享设备和远程智能卡记录。判定必须核对用户意图、已登记认证器、变更审批、设备与 session、证明寿命、提交来源和结果。管理员为用户合法重绑令牌、灾难恢复导入和受管 VDI 智能卡重定向都是强反例，不因跨设备或控制台访问自动归类。
      en: Normal MFA produces issuance, delivery, recovery, device migration, backup-factor, shared-device, and remote-smart-card records. Assessment must check user intent, registered authenticator, change approval, device and session, proof lifetime, submission origin, and result. Legitimate administrator rebinding, disaster-recovery import, and managed VDI smart-card redirection are strong counterexamples and are not classified automatically from cross-device or console access.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者在取得主口令后触发一次短信或邮件 MFA，借已攻陷消息服务控制台、被植入的 VPN 认证组件或仿冒验证者读取尚未到期的证明，并在用户或系统先消费前提交。Scatter Swine 事件显示攻击者搜索被触发挑战对应的 OTP，并对一个账户成功测试；SLOWPULSE 则把 ACE-2FA 流中的用户名和密码写入文件，同时正常控制流继续。
        en: After obtaining a primary password, an adversary may trigger an SMS or email MFA challenge and read the still-valid proof through a compromised messaging-service console, an implanted VPN authentication component, or an impostor verifier, then submit it before the user or system consumes it first. The Scatter Swine incident shows searches for OTPs corresponding to triggered challenges and one successful account test. SLOWPULSE wrote usernames and passwords from the ACE-2FA flow to a file while normal control flow continued.
      - zh: 在软件令牌场景中，攻击者可从已控终端窃取 token seed 或容器，在另一系统绕过导入绑定后生成后续验证码。Operation Wocao 的受害环境中发现 actor 窃取 RSA SecurID software token；Fox-IT 的逆向实验确认补丁一个设备检查即可用该 token 生成有效两因素代码，但没有公开逐次后继登录与具体生成代码的对应关系。
        en: In a software-token scenario, an adversary may steal a token seed or container from a controlled endpoint and generate later codes on another system after bypassing import binding. Operation Wocao found the actor stealing an RSA SecurID software token in a victim environment. Fox-IT reverse engineering confirmed that patching one device check allowed the token to generate valid two-factor codes, but the report does not publish a per-code linkage to later sign-ins.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 单次证明截获要求攻击者先触发或预测正确挑战，控制证明经过的页面、认证组件、终端或服务提供者，并在短有效期和一次使用约束内把材料关联到正确账户、租户与请求。生成状态复制要求读取 seed 或令牌容器、理解格式与算法，并突破设备绑定、加密或导入限制。错误请求、时钟漂移、先行消费、number matching、来源绑定和验证者绑定都会降低可用性。
          en: Ephemeral proof capture requires the adversary to trigger or predict the correct challenge, control a page, authentication component, endpoint, or service provider traversed by the proof, and map material to the right account, tenant, and request within a short lifetime and one-use constraint. Generator-state replication requires reading a seed or token container, understanding its format and algorithm, and defeating device binding, encryption, or import restrictions. A wrong request, clock drift, prior consumption, number matching, origin binding, and verifier binding reduce usability.
        - zh: 本技术不假定攻击者已经登录。即使材料到达，攻击者仍可能缺少主因素、目标应用、请求上下文或允许来源；验证者也可能因风险策略、设备要求或重复使用拒绝证明。后继会话建立必须单独记录，生成状态复制也不能从“文件被复制”直接推断成功 token。
          en: This technique does not assume the adversary has already signed in. Even after material arrival, the actor may lack the primary factor, target app, request context, or permitted origin, and the verifier may reject the proof because of risk policy, device requirements, or duplicate use. Later session creation must be recorded separately, and generator-state replication cannot be inferred directly from a copied file.
      defender_model:
        paragraphs:
        - zh: 防守方可能分别拥有 IdP challenge 与 sign-in、短信或邮件提供者、认证器生命周期、端点文件与进程、认证设备完整性、帮助台和资源访问记录。可用字段包括 user、tenant、challenge/request/correlation ID、认证方法与 authenticator ID、签发与到期时间、destination hash、provider console actor、source IP、device/session、result 及后继 session。真实 OTP 或 seed 不得进入分析平台。
          en: Defenders may separately hold IdP challenge and sign-in data, SMS or email provider data, authenticator lifecycle, endpoint file and process telemetry, authentication-appliance integrity, help-desk, and resource-access records. Useful fields include user, tenant, challenge, request or correlation ID, authentication method and authenticator ID, issue and expiry time, destination hash, provider-console actor, source IP, device or session, result, and successor session. Actual OTPs and seeds must never enter the analytic platform.
        - zh: 不同平台通常缺少跨服务 challenge ID，短信运营商可能不给逐消息访问日志，OTP 验证者也未必暴露 seed 或 authenticator instance。缺少稳定关联时，只能按账户、方法、短时间窗和来源做较弱判断。共享家庭电话、合法设备迁移、漫游、VDI、恢复和帮助台操作会制造同形信号，必须保留 owner、审批与用户确认。
          en: Platforms often lack a challenge ID that crosses services, SMS carriers may not provide per-message access logs, and an OTP verifier may not expose a seed or authenticator instance. Without stable linkage, only weaker joins by account, method, short time window, and origin are possible. Shared family phones, legitimate device migration, roaming, VDI, recovery, and help-desk actions create equivalent signals and require owner, approval, and user confirmation.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 证明材料控制者变化不进入验证者的常规 MFA 决策记录
      en: Change in proof-material controller remains outside routine MFA decision records
    analysis:
      paragraphs:
      - zh: 验证者通常记录方法、请求和成功或失败，却不记录短信控制台谁查看了消息、认证组件是否生成第二输出或 seed 容器是否被复制。攻击者在这些外部观察面取得证明后，提交仍沿正常验证流程，关键控制变化因而落在默认决策分析之外。Scatter Swine 的提供者日志关联和 SLOWPULSE 的第二输出直接证明这种视角分离；跨服务字段不足会限制恢复能力。
        en: A verifier normally records method, request, and success or failure but not who viewed a message in an SMS console, whether an authentication component created a second output, or whether a seed container was copied. After the adversary acquires proof on those external surfaces, submission follows the normal verification flow, leaving the critical controller change outside default decision analytics. Scatter Swine provider-log correlation and SLOWPULSE's second output directly establish this separation of vantages; missing cross-service fields limit reconstruction.
    evidence_keys:
    - TA0006-006-T1111-REF-OKTA-SCATTER
    - TA0006-006-T1111-REF-MANDIANT-PULSE
    - REF-000307
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 真实认证器生成的有效证明掩盖提交者与原持有者不一致
      en: Valid proof from a genuine authenticator masks mismatch between submitter and original holder
    analysis:
      paragraphs:
      - zh: 被截获 OTP 或复制 seed 生成的代码仍满足真实验证者的格式、算法、时间或计数器规则，局部日志呈现为正常第二因素。恶意性不在证明外观，而在生成状态或短时输出的控制者已变化。NIST 说明 OTP 的 seed、nonce、一次接受和有效期语义，Fox-IT 证明被窃软件 token 在绕过导入检查后生成有效代码；来源没有量化这种外观降低了多少告警。
        en: An intercepted OTP or code generated from a copied seed still satisfies the genuine verifier's format, algorithm, time, or counter rules, so a local log presents an ordinary second factor. Malice lies not in proof appearance but in changed control of generator state or a short-lived output. NIST defines OTP seed, nonce, one-time acceptance, and validity semantics, while Fox-IT shows a stolen software token generating valid codes after an import check was bypassed. The sources do not quantify how much this appearance reduces alerts.
    evidence_keys:
    - REF-000499
    - TA0006-006-T1111-REF-FOXIT-WOCAO
    confidence: medium
proposed_subtechniques:
- temporary_key: TA0006-006-T1111-CHILD-EPHEMERAL
  name:
    zh: 短时单次证明截获
    en: Ephemeral Single-Proof Capture
  summary:
    zh: 攻击者取得一个仍在有效期且尚可被接受的 MFA 输出，在一次使用或过期前把它用于对应挑战，而不控制长期生成状态。
    en: The adversary obtains one still-valid and acceptable MFA output and uses it for the corresponding challenge before one-time consumption or expiry without controlling long-term generator state.
  taxonomy_variable:
    zh: 攻击者控制的是一个受有效期与一次接受约束的具体证明，而非生成该证明的长期状态
    en: Adversary control is limited to one proof constrained by validity and one-time acceptance rather than its long-term generator state
  counterfactual_trace:
    zh: 未截获时，签发、投递和消费由同一预期持有者与请求连接；截获后，消息或认证组件访问与 MFA 消费出现在不同主体、来源、设备或 session，而代码本身仍正常。
    en: Without interception, issuance, delivery, and consumption join to the intended holder and request; after interception, message or authentication-component access and MFA consumption occur under different actors, origins, devices, or sessions while the code itself remains normal.
  definition_and_concept:
    paragraphs:
    - zh: 短时单次证明截获是攻击者取得一个由真实验证者签发或真实认证器生成、尚未过期且尚未被先行消费的 MFA 输出，并获得在对应账户和请求上下文中提交它的机会。对象由“单个证明及其短寿命”界定，可经仿冒输入面、消息服务控制台、邮件访问、端点观察或认证组件第二输出实现；媒介不形成兄弟边界。
      en: Ephemeral Single-Proof Capture occurs when an adversary obtains one MFA output issued by the genuine verifier or generated by a genuine authenticator while it remains unexpired and unconsumed, gaining an opportunity to submit it for the corresponding account and request context. The object is defined by one proof and its short lifetime and may be implemented through an impersonated input surface, messaging-service console, mailbox access, endpoint observation, or a second output from an authentication component. The medium does not define siblings.
    - zh: 本子项在材料实际到达且当时可能被接受时完成；后继验证成功和 session 建立仍是更高证据层。提供者界面中“可查看”但没有 actor 访问，只是 exposure；actor 搜索对应消息证明材料到达控制面；验证者成功测试证明接受；资源动作再归有效账户使用。不得把这些阶段压成一个二元结论。
      en: This child completes when material actually arrives and could be accepted at that time; later verifier success and session creation remain higher evidence tiers. A provider interface in which a message was merely viewable establishes exposure, an actor search for the corresponding message establishes arrival to the control plane, a successful verifier test establishes acceptance, and resource activity then belongs to valid-identity use. These stages must not be collapsed into a binary conclusion.
  stealth_characteristics:
    paragraphs:
    - zh: 短时单次证明截获让攻击者提交真实 challenge 对应的正确输出，IdP 可只记录一次常见 MFA 方法成功；短信、邮件或认证消费者中的第二读者不在该记录中。若攻击者先消费，合法用户可能只看到重复或失败，也可能在未尝试登录时收到通知。残余差异存在于签发与消费来源、provider console 查询、表单或组件第二输出、重复使用拒绝、设备与 session 不连续及用户否认。
      en: Ephemeral Single-Proof Capture lets the adversary submit the correct output for a genuine challenge, so the IdP may record only one successful use of a common MFA method. A second reader in SMS, email, or an authentication consumer is absent from that record. If the adversary consumes first, the legitimate user may see only a duplicate or failure, or may receive a notification without attempting sign-in. Residual differences lie in issuance-versus-consumption origin, provider-console queries, a form or component second output, duplicate-use rejection, device and session discontinuity, and user denial.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入必须证明具体 MFA 输出、攻击者控制的读取或接收、材料到达时间及其有效状态。假登录页存在、SMS 投递、邮箱登录、控制台访问或认证组件改动没有对应证明结果时不成立。用户在仿冒页面输入 OTP 可同时归 NJS-0169-003，真实认证组件额外记录 token 可同时归 NJS-0093-003；本子项只拥有“可用的一次性 MFA 证明结果”。
      en: Inclusion requires a specific MFA output, adversary-controlled read or receipt, material-arrival time, and validity state. A fake login page, SMS delivery, mailbox sign-in, console access, or authentication-component change without the corresponding proof result is insufficient. A user entering an OTP into an impersonated page may also qualify for NJS-0169-003, and a genuine authentication component recording a token may also qualify for NJS-0093-003. This child owns only the usable one-time MFA-proof result.
    - zh: 攻击者发起 push 且用户批准由 T1621 负责，因为没有证明被截获；AiTM 或反向代理只转送挑战和响应由 NJT-0136 负责，只有攻击者还取得可独立提交的一次证明时才并列。验证码验证后返回的 Cookie 或 token 归 T1539/T1528，成功账户进入归 NJT-0061。正常共享电话、批准的帮助台查看、测试挑战和用户设备迁移需以审批和所有者确认排除。
      en: T1621 owns an adversary-triggered push that the user approves because no proof was intercepted. NJT-0136 owns an AiTM or reverse proxy that only forwards challenge and response; this child coexists only if the adversary also obtains a single proof it can submit. Cookies or tokens returned after code verification belong to T1539/T1528, and successful account entry belongs to NJT-0061. Normal shared phones, approved help-desk viewing, test challenges, and user-device migration require exclusion through approval and owner confirmation.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: Scatter Swine 使用已盗主口令触发短信挑战，再从被攻陷的 Twilio 控制台搜索对应 OTP；Okta 证明五分钟有效期、38 个定向号码查询及一个成功测试，并明确区分偶然可见号码和没有使用证据的消息。另一场景中，SLOWPULSE 在真实 Pulse Secure ACE-2FA 认证函数内把用户名与密码写盘后返回正常控制流，形成事务内第二输出。
        en: Scatter Swine used stolen primary passwords to trigger SMS challenges and searched the compromised Twilio console for corresponding OTPs. Okta establishes a five-minute lifetime, searches for 38 targeted numbers, and one successful test, while explicitly separating incidentally visible numbers and messages without evidence of use. In another scenario, SLOWPULSE wrote username and password from the genuine Pulse Secure ACE-2FA function to disk and returned to normal control flow, creating an in-transaction second output.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要主因素或触发挑战的其他条件、能读取证明的控制点、账户与 challenge 对应关系以及低于有效期的操作延迟。一次使用、短 TTL、number matching、交易上下文、设备或通道绑定、速率与风险策略限制成功；误触发错误账户或由合法用户先消费会使材料失效。
          en: The adversary needs a primary factor or other condition that triggers a challenge, a control point that reads the proof, a mapping between account and challenge, and operational latency below the validity period. One-time use, short TTL, number matching, transaction context, device or channel binding, rate controls, and risk policy constrain success. Triggering the wrong account or legitimate consumption first invalidates the material.
      defender_model:
        paragraphs:
        - zh: 防守方需要 IdP challenge/sign-in、投递提供者或邮箱访问、仿冒页面或认证组件检测、设备/session 和用户反馈。理想关联使用 challenge/request/correlation ID；缺失时按 user、method、destination hash、签发与消费时间、source IP、device 和 session 做弱关联。内容隐私要求只保存 message/proof ID 与敏感分类，不保存 OTP 值。
          en: The defender needs IdP challenge and sign-in data, delivery-provider or mailbox access, impersonated-page or authentication-component detection, device or session context, and user feedback. Ideal correlation uses a challenge, request, or correlation ID. When absent, weaker joins use user, method, destination hash, issue and consumption time, source IP, device, and session. Content privacy requires retaining only message or proof IDs and sensitivity class, never the OTP value.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: MFA 决策记录证明有效却不记录短时输出的第二控制者
      en: MFA decision records proof validity without the second controller of its short-lived output
    analysis:
      paragraphs:
      - zh: 攻击者从投递、输入或认证组件观察面取得证明，再向真实验证者提交；IdP 的成功记录说明代码有效，却没有说明谁从提供者控制台读取、谁收到了仿冒表单或哪个模块产生第二文件。材料控制变化落在决策日志之外，需要跨服务恢复。Okta 和 Mandiant 分别提供 provider console 与认证组件第二输出证据，均支持该因果链。
        en: The adversary obtains proof on a delivery, input, or authentication-component surface and submits it to the genuine verifier. IdP success establishes code validity but not who read a provider console, who received an impersonated form, or which module created a second file. The controller change remains outside decision logs and requires cross-service reconstruction. Okta and Mandiant provide provider-console and authentication-component second-output evidence respectively, supporting this causal chain.
    evidence_keys:
    - TA0006-006-T1111-REF-OKTA-SCATTER
    - TA0006-006-T1111-REF-MANDIANT-PULSE
    confidence: high
  evidence_keys:
  - TA0006-006-T1111-REF-ATTACK
  - TA0006-006-T1111-REF-OKTA-SCATTER
  - TA0006-006-T1111-REF-MANDIANT-PULSE
  - REF-000731
  - REF-000499
  defense_keys:
  - TA0006-006-T1111-DET-PROOF-LIFECYCLE
  - TA0006-006-T1111-NJA-EPHEMERAL
  - TA0006-006-T1111-MIT-PROOF-LIFECYCLE
  - DET-000194
  - DET-000197
  - MIT-000175
  - MIT-000180
  limitations:
    paragraphs:
    - zh: SLOWPULSE 明确证明认证函数记录材料，但公开报告没有逐项披露哪些 ACE 值仍有效或之后被使用。Okta 证明定向搜索和一次成功测试，也说明多数偶然可见消息没有使用迹象。APT42 来源中克隆站点捕获 MFA token 的一次尝试失败，另一 SMS token 捕获仅为 likely，不能用来提高所有 Web 案例的置信度。
      en: SLOWPULSE clearly establishes material logging inside an authentication function, but the public report does not enumerate which ACE values remained valid or were later used. Okta establishes targeted searches and one successful test while showing that most incidentally visible messages lacked use evidence. In the APT42 source, one cloned-site MFA-token capture attempt failed and a different SMS-token capture is only assessed as likely, so it cannot raise confidence for all web cases.
- temporary_key: TA0006-006-T1111-CHILD-GENERATOR
  name:
    zh: 认证证明生成状态复制
    en: Authentication Proof-Generator State Replication
  summary:
    zh: 攻击者复制软件认证器的 seed 或等价状态并绕过导入限制，使其能在另一控制面持续生成未来 MFA 证明。
    en: The adversary copies a software authenticator's seed or equivalent state and bypasses import restrictions, enabling continued generation of future MFA proofs from another control plane.
  taxonomy_variable:
    zh: 攻击者取得的是能够跨多个挑战持续派生证明的生成状态，而非一个短时输出
    en: The adversary obtains generator state that derives proofs across multiple challenges rather than one short-lived output
  counterfactual_trace:
    zh: 单次截获需要每次签发或投递事件；生成状态复制后，攻击者无需继续读取消息即可产生正确输出，异常转移到 seed 容器访问、导入绑定绕过和同一认证器的跨设备使用。
    en: Single-proof capture requires each issuance or delivery event; after generator-state replication, the adversary produces correct outputs without continued message access, moving anomalies to seed-container access, import-binding bypass, and cross-device use of one authenticator.
  definition_and_concept:
    paragraphs:
    - zh: 认证证明生成状态复制是攻击者取得软件 OTP 认证器的长期 secret、seed、token container 或等价派生状态，并在攻击者控制的另一进程或设备上恢复生成能力。直接结果不是一个验证码，而是能按时间或计数器持续输出目标验证者接受格式的证明。软件产品、移动端或桌面端不是分类基础；生成状态的持久性与跨挑战能力才是稳定变量。
      en: Authentication Proof-Generator State Replication occurs when an adversary obtains the long-term secret, seed, token container, or equivalent derivation state of a software OTP authenticator and restores generation on another adversary-controlled process or device. The direct result is not one code but sustained ability to output proofs in the format accepted by the target verifier under time or counter rules. Software product, mobile versus desktop, and platform do not define the child; persistence of generator state across challenges is the stable variable.
    - zh: 文件或数据库复制仅证明暴露，必须进一步证明容器包含生成状态且能导入、解密或绕过绑定后生成有效 token。Fox-IT 在 Operation Wocao 中观察到 actor 窃取受害者 software token，并通过逆向验证补丁设备检查即可生成有效两因素代码；报告把 actor 的真实取得和研究者确定的最可能实现分开，因此正式置信度保持 medium。
      en: A file or database copy establishes exposure only. Evidence must further show that the container holds generator state and can be imported, decrypted, or used after binding bypass to produce a valid token. In Operation Wocao, Fox-IT observed actor theft of a victim software token and verified through reverse engineering that patching the device check produced valid two-factor codes. The report separates real actor acquisition from the researchers' most likely implementation path, so formal confidence remains medium.
  stealth_characteristics:
    paragraphs:
    - zh: 认证证明生成状态复制消除了对每次消息投递或用户输入的依赖。复制端生成的 OTP 与原认证器共享 seed 和算法，验证者通常只判断代码、时间或计数器，不知道输出由哪台设备计算。若登录来源又接近用户基线，成功 MFA 在局部视图中与正常软件令牌相同；残余痕迹集中在 token 容器读取、异常导入或补丁、同一 authenticator 的设备不一致、计数器竞争和暴露后持续使用。
      en: Authentication Proof-Generator State Replication removes dependence on each message delivery or user input. OTPs generated by the copy share the original seed and algorithm, while the verifier typically evaluates code, time, or counter without knowing which device computed it. If sign-in origin also resembles the user's baseline, a successful MFA step appears identical to ordinary software-token use locally. Residual traces concentrate in token-container reads, anomalous import or patching, device inconsistency for one authenticator, counter competition, and continued use after exposure.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入必须证明生成状态被攻击者取得，并有有效代码生成、可验证导入或同等结论级结果。只复制加密 token 文件、浏览配置、列出认证器或观察进程不成立。从保管库读取 seed 的路径可同时归 T1555/NJT-0147，本子项只拥有由该材料恢复的未来 MFA 证明生成能力。直接伪造 SAML、Cookie 或其他 Web 凭据归 T1606，生成后的账户使用归 NJT-0061。
      en: Inclusion requires adversary acquisition of generator state plus valid code generation, verified import, or an equivalent conclusion-level result. Merely copying an encrypted token file, browsing configuration, listing authenticators, or observing a process is insufficient. Retrieval of a seed from a managed store may also qualify for T1555/NJT-0147; this child owns only the restored ability to generate future MFA proofs. Direct forging of SAML, cookies, or other web credentials belongs to T1606, and account use after generation belongs to NJT-0061.
    - zh: 合法设备迁移、受控备份、灾难恢复与同步认证器可能复制状态，但应伴随用户或管理员确认、受保护迁移、旧实例失效、审计和已登记新设备。若攻击者只向账户新增自己的认证器，状态变化归 T1098；本子项要求原生成状态被复制或恢复，而不是一次新绑定。
      en: Legitimate device migration, managed backup, disaster recovery, and syncable authenticators may copy state but should include user or administrator confirmation, protected migration, invalidation of the old instance, audit, and a registered new device. If the adversary merely adds its own authenticator to the account, the state change belongs to T1098. This child requires copying or restoration of the original generator state rather than a new binding.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在受害者终端运行的软件 SecurID、TOTP 或同类认证器保存生成所需 seed 与配置。攻击者控制终端后复制 token container，破解、解密或绕过设备导入检查，在另一系统生成未来代码并配合已获主口令使用。Operation Wocao 直接观察 actor 窃取 RSA software token，研究证明该版本设备检查与实际 seed 派生分离。
        en: Software SecurID, TOTP, or comparable authenticators on a victim endpoint retain seed and configuration required for generation. After controlling the endpoint, an adversary copies the token container and cracks, decrypts, or bypasses device import checks to generate future codes on another system for use with an acquired primary password. Operation Wocao directly observed actor theft of an RSA software token, and research established that the version's device check was separate from actual seed derivation.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要读取认证器存储、取得解密或导入能力、保持时间或计数器同步并知道目标账户和验证者。硬件不可导出 secret、硬件支持的密钥存储、应用完整性、设备证明、用户验证和迁移时旧实例失效会限制复制。错误补丁或不同 token 版本可能只产生无效代码并暴露操作。
          en: The adversary needs read access to authenticator storage, decryption or import capability, time or counter synchronization, and knowledge of the target account and verifier. Hardware non-exportable secrets, hardware-backed key storage, app integrity, device attestation, user verification, and invalidation of old instances during migration constrain replication. A wrong patch or different token version may produce only invalid codes and expose the operation.
      defender_model:
        paragraphs:
        - zh: 防守方需要端点 token container 访问与进程、认证器绑定和迁移审计、设备或 app instance 标识、IdP 认证方法详情及后继登录来源。许多 OTP 验证者不记录生成设备，且代码值不能采集；因此只有在平台暴露 authenticator/device binding 或端点证据时才能高置信关联，否则需依赖暴露调查、重绑定历史和来源不连续。
          en: The defender needs endpoint token-container access and process data, authenticator binding and migration audit, device or app-instance identifiers, IdP authentication-method details, and later sign-in origin. Many OTP verifiers do not record the generating device and code values must not be collected. High-confidence correlation therefore requires platform authenticator or device-binding fields or endpoint evidence; otherwise it relies on exposure investigation, rebinding history, and origin discontinuity.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 复制 seed 生成的合法算法输出延续原认证器外观
      en: Legitimate algorithm output from a copied seed preserves the original authenticator appearance
    analysis:
      paragraphs:
      - zh: 复制端使用与原软件认证器相同的长期状态和算法，输出通过真实验证者的时间或计数器检查。证明本身没有伪造格式特征，异常只存在于 seed 来源、设备和进程谱系，依赖代码正确性的规则难以区分。Fox-IT 直接证明补丁导入检查后被窃 token 能生成有效代码，但没有逐次验证者接受记录，故机理置信度为 medium。
        en: The copied instance uses the same long-term state and algorithm as the original software authenticator, producing output that passes the genuine verifier's time or counter checks. The proof has no malformed feature; the anomaly lies in seed provenance, device, and process lineage, so rules based on code correctness struggle to distinguish it. Fox-IT directly shows a stolen token producing valid codes after its import check was patched but does not provide per-use verifier acceptance records, keeping mechanism confidence at medium.
    evidence_keys:
    - TA0006-006-T1111-REF-FOXIT-WOCAO
    - REF-000499
    confidence: medium
  evidence_keys:
  - TA0006-006-T1111-REF-ATTACK
  - TA0006-006-T1111-REF-FOXIT-WOCAO
  - REF-000499
  - REF-000146
  - REF-000307
  defense_keys:
  - TA0006-006-T1111-DET-PROOF-LIFECYCLE
  - TA0006-006-T1111-NJA-GENERATOR
  - TA0006-006-T1111-MIT-PROOF-LIFECYCLE
  limitations:
    paragraphs:
    - zh: Operation Wocao 证明 actor 在真实环境窃取 software token，Fox-IT 实验又证明有效代码生成，但报告明确称生成路径是研究者判断的“最可能”方法，未把每个后继 VPN 登录连接到特定复制实例。其他认证器的存储、设备绑定和同步设计可能完全不同，不能从 RSA 案例泛化。
      en: Operation Wocao establishes actor theft of a software token in a real environment, and Fox-IT experimentation establishes valid code generation, but the report explicitly calls the generation path the researchers' most likely method and does not connect each later VPN sign-in to a particular copied instance. Storage, device binding, and synchronization can differ completely in other authenticators, so the RSA case cannot be generalized.
defense_candidates:
  detection_strategies:
  - temporary_key: TA0006-006-T1111-DET-PROOF-LIFECYCLE
    name:
      zh: MFA 证明签发、控制与使用谱系
      en: MFA Proof Issuance, Control, and Use Lineage
    objective:
      zh: 把单次证明的签发、投递或第二输出、攻击者读取与消费结果连接，并把认证器生成状态访问、迁移或复制连接到后续跨设备证明使用，同时保留证据层级。
      en: Join issuance, delivery or second output, adversary read, and consumption result for a single proof, and connect authenticator generator-state access, migration, or copying to later cross-device proof use while preserving evidence tiers.
    detects_keys:
    - TA0006-006-T1111-CHILD-EPHEMERAL
    - TA0006-006-T1111-CHILD-GENERATOR
    analytic_keys:
    - TA0006-006-T1111-NJA-EPHEMERAL
    - TA0006-006-T1111-NJA-GENERATOR
  detection_analytics:
  - temporary_key: TA0006-006-T1111-NJA-EPHEMERAL
    strategy_key: TA0006-006-T1111-DET-PROOF-LIFECYCLE
    name:
      zh: 单次证明签发—读取—消费关联
      en: Single-Proof Issuance-Read-Consumption Correlation
    platforms: [Identity Provider, SaaS, IaaS, Network Devices, Windows, Linux, macOS]
    logic:
      zh: 将每个 MFA challenge 规范为 tenant、user、challenge/request/correlation ID、method、authenticator ID、destination hash、issued_at、expires_at 和 expected device/session。连接投递 provider 或邮箱的 message ID、console actor、source IP、view/search/read operation 与时间，再连接 IdP 的 proof consumption、source IP、device、session、result 和 successor session。输出 exposure、material-reached、usable-window、accepted、session-created 五级；不得采集证明值。没有跨服务 ID 时，仅在短于证明 TTL 的窗口按 user、method、destination 与来源做低置信关联。
      en: Normalize each MFA challenge into tenant, user, challenge, request or correlation ID, method, authenticator ID, destination hash, issued_at, expires_at, and expected device or session. Join delivery-provider or mailbox message ID, console actor, source IP, view, search, or read operation and time, then join IdP proof consumption, source IP, device, session, result, and successor session. Emit exposure, material-reached, usable-window, accepted, and session-created tiers without collecting proof values. Without a cross-service ID, use lower-confidence joins by user, method, destination, and origin within a window shorter than the proof TTL.
    data_requirements:
    - source_type: idp_mfa_challenge_and_signin
      name:
        zh: IdP MFA 挑战与登录详情
        en: IdP MFA challenge and sign-in details
      channel: identity provider challenge and sign-in logs
      required_fields: [timestamp, tenant_id, user_id, challenge_id, request_or_correlation_id, authentication_method, authenticator_id, issued_at, expires_at, source_ip, device_id, session_id, result]
    - source_type: proof_delivery_or_consumer_access
      name:
        zh: 证明投递或认证消费者访问
        en: Proof delivery or authentication-consumer access
      channel: SMS or email provider audit, mailbox audit, or authentication-component output telemetry
      required_fields: [timestamp, provider_or_node_id, message_or_output_id, destination_hash, actor_id, actor_source_ip, operation, delivery_status, challenge_or_transaction_id]
    - source_type: identity_session_outcome
      name:
        zh: 认证后会话结果
        en: Post-authentication session outcome
      channel: IdP and relying-party session logs
      required_fields: [timestamp, user_id, request_or_correlation_id, session_id, resource_id, source_ip, device_id, authentication_method, result]
    observables: [proof_delivery_viewed_by_unexpected_actor, provider_search_followed_by_mfa_success, proof_consumed_from_unexpected_device_or_session, duplicate_or_already_used_proof, user_denied_challenge]
    correlation:
      window: proof-validity-window-plus-15m
      dimensions: [tenant_id, user_id, challenge_id, request_or_correlation_id, authentication_method, authenticator_id, destination_hash, device_id, session_id, source_ip]
    false_positives:
      zh: 提供者支持、获批帮助台排障、共享家庭电话、用户漫游、代理出口、恢复测试和企业消息归档可能产生查看与来源差异；必须核对工单、provider role、用户确认和是否存在对应合法请求。
      en: Provider support, approved help-desk troubleshooting, shared family phones, user roaming, proxy egress, recovery testing, and enterprise message archiving can create view and origin differences. Check ticket, provider role, user confirmation, and the corresponding legitimate request.
    blind_spots:
      zh: 运营商不提供逐消息访问、IdP 与提供者没有共同 ID、端到端加密邮箱或攻击者删除 provider 审计时无法高置信连接；真实认证组件第二输出可能只在内存存在，成功 MFA 也不证明攻击者看过代码。
      en: High-confidence linkage is unavailable when carriers omit per-message access, IdP and provider lack a shared ID, mail is end-to-end encrypted, or the adversary deletes provider audit. A second output inside a genuine authentication component may remain only in memory, and successful MFA does not prove the adversary viewed a code.
    tuning_guidance:
      zh: 按 method 配置真实 TTL 与一次使用规则，优先使用稳定 challenge/correlation ID；provider 例外必须绑定精确角色、工单、message scope 和期限。将“无对应用户请求”“控制台搜索后异源成功”“重复使用拒绝”和“用户否认”提高权重，不以 SMS 或邮件方法本身告警。
      en: Configure actual TTL and one-use semantics by method and prefer stable challenge or correlation IDs. Provider exceptions bind exact role, ticket, message scope, and expiry. Raise weight for no corresponding user request, different-origin success after console search, duplicate-use rejection, and user denial rather than alerting on SMS or email as methods.
    evidence_keys:
    - TA0006-006-T1111-REF-OKTA-SCATTER
    - TA0006-006-T1111-REF-MANDIANT-PULSE
    - REF-000307
    - TA0006-006-T1111-REF-ATTACK-DET
  - temporary_key: TA0006-006-T1111-NJA-GENERATOR
    strategy_key: TA0006-006-T1111-DET-PROOF-LIFECYCLE
    name:
      zh: 认证器状态访问—跨设备证明使用关联
      en: Authenticator-State Access to Cross-Device Proof-Use Correlation
    platforms: [Windows, Linux, macOS, Identity Provider, SaaS]
    logic:
      zh: 对软件认证器建立 user、authenticator ID、app instance、device binding、seed container object、version、migration/export policy 和 owner 清单。检测非批准进程读取、复制或导出 token container、调试或补丁导入检查，并关联三十日内无正式 rebind/migration 的同 authenticator MFA 成功、新设备或来源、原设备仍活跃、计数器竞争或暴露后持续成功。文件读取只输出 state-exposure；验证过的导入或有效代码生成输出 generator-replicated；后继 IdP 接受另列 accepted。
      en: Inventory user, authenticator ID, app instance, device binding, seed-container object, version, migration or export policy, and owner for software authenticators. Detect unapproved process reads, copies, or exports of token containers and debugging or patching of import checks, then correlate within thirty days to MFA success by the same authenticator without a formal rebind or migration, a new device or origin, simultaneous activity on the original device, counter competition, or continuing success after exposure. File access alone emits state-exposure, verified import or valid code generation emits generator-replicated, and later IdP acceptance is a separate accepted tier.
    data_requirements:
    - source_type: authenticator_state_inventory_and_access
      name:
        zh: 软件认证器状态清单与访问
        en: Software-authenticator state inventory and access
      channel: endpoint application inventory, EDR file/process telemetry, or authenticator administration
      required_fields: [timestamp, host_id, user_id, authenticator_id, app_instance_id, device_binding_id, token_object_id, process_guid, image_path, signer, operation, result]
    - source_type: authenticator_lifecycle_audit
      name:
        zh: 认证器绑定、迁移、导出与撤销审计
        en: Authenticator binding, migration, export, and revocation audit
      channel: identity provider authentication-method audit
      required_fields: [timestamp, tenant_id, user_id, authenticator_id, event_type, old_device_id, new_device_id, initiator_id, approval_id, result]
    - source_type: idp_authentication_method_use
      name:
        zh: IdP 认证方法与设备使用
        en: IdP authentication method and device use
      channel: identity provider sign-in details
      required_fields: [timestamp, tenant_id, user_id, request_or_correlation_id, authenticator_id, authentication_method, device_id, source_ip, session_id, result]
    observables: [unapproved_token_container_read, token_import_check_patch, authenticator_use_from_unregistered_device, same_authenticator_concurrent_device_use, mfa_success_after_seed_exposure_without_rebind]
    correlation:
      window: 30d-after-state-exposure
      dimensions: [tenant_id, user_id, authenticator_id, app_instance_id, device_binding_id, token_object_id, device_id, process_guid, source_ip]
    false_positives:
      zh: 受管设备迁移、备份恢复、厂商同步认证器、VDI 重建、应用升级和取证采集会读取或复制 token object；须核对迁移事件、旧实例失效、批准设备、签名和 owner。
      en: Managed device migration, backup recovery, vendor syncable authenticators, VDI rebuild, app upgrade, and forensic collection read or copy token objects. Check migration events, invalidation of old instances, approved devices, signer, and owner.
    blind_spots:
      zh: 许多 OTP IdP 不暴露 authenticator instance 或生成设备，应用可能把 seed 放在硬件安全区而端点只见外壳文件；攻击者在原设备内生成代码时不会产生跨设备差异，端点日志被控也会掩盖复制。
      en: Many OTP IdPs do not expose authenticator instance or generating device, and an app may keep the seed in a hardware enclave while the endpoint sees only a wrapper file. Generation on the original device creates no cross-device difference, and compromised endpoint logs can hide copying.
    tuning_guidance:
      zh: 仅对明确保存生成状态的对象启用敏感路径审计，避免把所有应用文件视为 seed；合法迁移必须有 lifecycle event、批准新设备和旧实例失效。缺少 authenticator ID 时降低到 exposure，不用新 IP 或设备单独宣称复制成功。
      en: Enable sensitive-path audit only for objects confirmed to contain generator state rather than treating every app file as a seed. Legitimate migration requires a lifecycle event, approved new device, and invalidated old instance. When authenticator ID is absent, remain at exposure and do not claim successful replication from a new IP or device alone.
    evidence_keys:
    - TA0006-006-T1111-REF-FOXIT-WOCAO
    - REF-000146
    - REF-000307
    - REF-000499
  mitigations:
  - temporary_key: TA0006-006-T1111-MIT-PROOF-LIFECYCLE
    name:
      zh: MFA 证明与认证器状态生命周期保护
      en: MFA Proof and Authenticator-State Lifecycle Protection
    measures:
    - key: proof-delivery-least-exposure
      control_type: exposure-reduction
      zh: 缩短信件或 OTP 有效期并强制一次接受，限制消息提供者和帮助台查看正文，按 message scope 赋予到期权限并保留无值访问审计。
      en: Shorten message or OTP validity and enforce one-time acceptance, restrict provider and help-desk visibility into message bodies, grant expiring message-scoped authority, and retain value-free access audit.
    - key: generator-state-nonexportability
      control_type: preventive
      zh: 优先使用硬件支持或不可导出的认证器状态；软件 token 禁止普通备份或导出，绑定设备与应用完整性，迁移时使旧实例失效。
      en: Prefer hardware-backed or non-exportable authenticator state. Exclude software tokens from ordinary backup or export, bind them to device and app integrity, and invalidate old instances during migration.
    - key: authenticator-lifecycle-audit
      control_type: detective-support
      zh: 记录绑定、恢复、迁移、导出、设备变化、撤销和认证方法使用，向用户通知并为高价值身份要求独立批准。
      en: Record binding, recovery, migration, export, device change, revocation, and authentication-method use, notify the user, and require independent approval for high-value identities.
    - key: proof-exposure-response
      control_type: containment
      zh: 发现短时证明暴露时立即使挑战失效、撤销其建立的 session 并调查同窗登录；发现 seed 或 token state 暴露时撤销整个认证器、重新绑定并验证旧状态拒绝。
      en: On ephemeral proof exposure, invalidate the challenge, revoke sessions it established, and investigate sign-ins in the window. On seed or token-state exposure, revoke the entire authenticator, rebind, and verify rejection of old state.
    applications:
    - target_key: TA0006-006-T1111-CHILD-EPHEMERAL
      use:
        zh: 对可手工转移的 OTP 或 out-of-band 证明实施短 TTL、一次接受、provider console 最小权限和跨服务 challenge 关联；高价值账户逐步改用验证者绑定的抗钓鱼方法。
        en: Apply short TTL, one-time acceptance, least provider-console privilege, and cross-service challenge correlation to manually transferable OTP or out-of-band proofs, and migrate high-value accounts toward verifier-bound phishing-resistant methods.
      expected_effect:
        zh: 缩短被截获证明的可用窗口，使第二读者和异源消费更可追查，并减少仿冒验证者可取得的可重放输出。
        en: Shorten the useful window of an intercepted proof, make second readers and different-origin consumption more traceable, and reduce replayable outputs obtainable by an impostor verifier.
      limitations:
        zh: 短 TTL 不能阻止实时攻击者，provider 或真实认证组件被控时仍可能同步读取；恢复、离线场景和无障碍需求可能要求可转移因子。
        en: Short TTL does not stop a real-time adversary, and a compromised provider or genuine authentication component can still read synchronously. Recovery, offline settings, and accessibility needs may require transferable factors.
    - target_key: TA0006-006-T1111-CHILD-GENERATOR
      use:
        zh: 把软件 token container 置于硬件支持存储并禁止普通导出，迁移使用经批准绑定流程且撤销旧实例；暴露后轮换 seed 或整个认证器，而不是只等待当前 OTP 过期。
        en: Place software-token containers in hardware-backed storage and prohibit ordinary export, use approved binding workflows for migration with old-instance revocation, and rotate the seed or whole authenticator after exposure rather than waiting for the current OTP to expire.
      expected_effect:
        zh: 提高复制生成状态和在另一设备恢复的成本，并把合法迁移与未经批准复制区分为可审计生命周期事件。
        en: Raise the cost of copying generator state and restoring it on another device, and separate legitimate migration from unauthorized replication through auditable lifecycle events.
      limitations:
        zh: 已控原设备可代替复制直接生成代码，厂商同步认证器有意允许多设备状态，硬件支持实现仍依赖供应链与本地解锁安全。
        en: A compromised original device can generate codes without copying, vendor syncable authenticators intentionally permit multi-device state, and hardware-backed implementations still depend on supply-chain and local-unlock security.
    evidence_keys:
    - REF-000499
    - TA0006-006-T1111-REF-OKTA-SCATTER
    - TA0006-006-T1111-REF-FOXIT-WOCAO
    - REF-000146
