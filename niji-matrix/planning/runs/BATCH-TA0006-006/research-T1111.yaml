    unsupported_or_deferred:
    - zh: Sykipot 缺少同一在野事件中绑定认证器代理调用、目标接受与后继访问的完整链，驻留代理不正式化。
      en: Sykipot lacks a complete same-incident field chain of bound-authenticator proxy invocation, target acceptance, and later access, so resident proxying is not formalized.
    - zh: APT42 克隆 MFA 页面的一次捕获尝试失败，另一次短信 token 捕获为 likely；只作边界和补充证据。
      en: One APT42 cloned MFA-page capture attempt failed and a separate SMS-token capture is assessed as likely; the source is boundary and supplemental evidence only.
    - zh: provider console 可查看消息不等于 actor 实际查看，文件被复制不等于 seed 成功恢复，MFA success 不等于后继资源使用。
      en: Provider-console message visibility does not equal actor viewing, file copying does not equal successful seed restoration, and MFA success does not equal later resource use.
    - zh: push fatigue 与用户批准归 T1621，不以 ATT&CK T1111 中的历史 procedure mapping 扩大本对象。
      en: Push fatigue and user approval belong to T1621 and do not expand this object because of a historical T1111 procedure mapping.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父稿固定 MFA 证明对象、五级证据、邻接技术与正常流程；两个子稿分别以短时单次输出和跨挑战生成状态为稳定变量，具有不同完成点、痕迹、威胁前提、检测窗口和响应对象。智能卡代理因结论级证据不足明确暂缓。
      en: The parent fixes the MFA-proof object, five evidence tiers, neighboring techniques, and normal workflow. The two children use a short-lived single output and cross-challenge generator state as stable variables with different completion points, traces, prerequisites, detection windows, and response objects. Smart-card proxying is explicitly deferred for insufficient conclusion-level evidence.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization, recursive parse, bilingual-pair audit, temporary-key reference audit, and mechanism-summary punctuation checks only
  limitations:
    paragraphs:
    - zh: 公开来源对结果层级的支持不一致。Okta 能把可见消息、定向搜索和一次成功测试分开；Mandiant 证明 ACE-2FA 事务内写盘但没有逐 token 后继使用；Fox-IT 证明真实 token 窃取及实验生成，却把 actor 的具体生成方法标为最可能；SANS 只支持 Sykipot 样本能力。正式对象必须保留这些差别，不能把能力、实验与在野成功拼成同一链。
      en: Public sources support different outcome tiers. Okta separates visible messages, targeted searches, and one successful test. Mandiant establishes disk output inside an ACE-2FA transaction without per-token successor use. Fox-IT establishes real token theft and experimental generation but labels the actor's exact generation method most likely. SANS supports Sykipot sample capability only. Formal objects must preserve these differences and cannot splice capability, experiment, and field success into one chain.
    - zh: IdP、短信/邮件提供者、认证器应用和端点之间通常没有共享 challenge ID；隐私要求也禁止采集 OTP 或 seed 内容。Analytic 的时间窗、authenticator ID、device binding 与 provider operation 字段必须逐部署验证。若只能看到 MFA 成功而没有材料来源，最多报告身份风险；若只能看到文件或消息暴露而无法证明可用性，应停留在 exposure。
      en: IdPs, SMS or email providers, authenticator apps, and endpoints often lack a shared challenge ID, and privacy requirements prohibit collecting OTP or seed contents. Analytic windows, authenticator ID, device binding, and provider-operation fields require deployment-specific validation. MFA success without material provenance supports identity risk at most, while file or message exposure without usability remains exposure.
  rejected_mechanisms:
  - mechanism: NM-ST
    reason_zh: 短 TTL 是证明安全属性和攻击约束，不表示攻击者把行为在时空上稀释；现有来源也没有证明低频截获规避阈值。
    reason_en: A short TTL is a proof security property and attacker constraint rather than adversary dilution across time or space, and sources do not establish low-rate interception defeating thresholds.
  - mechanism: NM-DO
    reason_zh: OTP 或 token container 的加密属于认证器设计或捕获后存储，未证明攻击者主动改变数据可解释性形成独立轴。
    reason_en: Encryption of an OTP or token container belongs to authenticator design or post-capture storage and does not establish an attacker-controlled independent data-obscuration axis.
  open_questions:
  - zh: 若未来取得同一在野事件中非导出认证器被远程代理调用、验证者接受和后继访问的完整证据，应重新审查驻留绑定认证器代理轴；在此之前仅保留能力研究。
    en: If future evidence provides a complete same-incident chain of remote proxy invocation of a non-exported authenticator, verifier acceptance, and later access, re-review the resident bound-authenticator proxy axis. Until then it remains capability research.
  - zh: 主 Agent 应与 T1621 研究统一 push approval 边界，并确保“用户批准攻击者请求”只在证明材料另被复制时才与 T1111 并列。
    en: The primary agent should converge the push-approval boundary with T1621 research and allow coexistence with T1111 only when proof material is separately copied.
