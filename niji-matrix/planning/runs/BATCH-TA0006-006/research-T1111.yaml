research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - zh: ATT&CK 19.1 无子项；父页实施广度覆盖一次性证明、软件令牌状态、消息服务和智能卡代理
      en: ATT&CK 19.1 has no children; parent implementation breadth spans single proofs, software-token state, messaging services, and smart-card proxying
    breadth_trigger: ordinary-zero-child-native-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: single_proof_validity_window
      disposition: formal
      why_zh: 单次证明受到期与一次接受约束，需签发—读取—消费短窗关联和 proof-specific response。
      why_en: A single proof is constrained by expiry and one-time acceptance, requiring short-window issuance-read-consumption correlation and proof-specific response.
    - axis: proof_generator_state_persistence
      disposition: formal-medium-confidence
      why_zh: seed 或 token state 可跨多个挑战持续生成证明，防御需状态保护、迁移审计与整认证器撤销。
      why_en: A seed or token state generates proofs across challenges, requiring state protection, migration audit, and whole-authenticator revocation.
    - axis: resident_bound_authenticator_proxy
      disposition: evidence-deferred
      why_zh: Sykipot 证明样本能力，但缺少同一在野事件的未导出秘密、实际调用、证明接受和后继结果链，不能正式化。
      why_en: Sykipot establishes sample capability but lacks a same-incident field chain of non-exported secret, actual invocation, proof acceptance, and successor result, so it is not formalized.
    - axis: delivery_copy_versus_recipient_substitution
      disposition: collapsed-with-adjacent-state-change
      why_zh: 两者都产生短时单次证明；收件人或认证方法变更本身归 T1098，T1111 防御仍按实际证明到达和消费关联。
      why_en: Both produce a short-lived single proof; recipient or authentication-method change itself belongs to T1098, while T1111 defense still joins actual proof arrival and consumption.
    - axis: live_proof_relay
      disposition: adjacent-technique
      why_zh: 只改变信任路径或跨目标转发证明由 NJT-0136/NJS-0136-002 拥有；只有独立可提交材料到达才与本技术并列。
      why_en: NJT-0136/NJS-0136-002 owns trust-path change or cross-destination forwarding; this technique coexists only with independently submitable material arrival.
    - axis: push_request_and_approval
      disposition: adjacent-technique
      why_zh: 攻击者生成请求、疲劳与用户批准归 T1621；没有被截获的证明材料。
      why_en: Adversary-generated requests, fatigue, and user approval belong to T1621 and contain no intercepted proof material.
    - axis: channel_platform_vendor_partition
      disposition: rejected
      why_zh: SMS、邮件、推送、电话、浏览器、操作系统、认证器产品和提供者只是载体或实现。
      why_en: SMS, email, push, voice, browser, operating system, authenticator product, and provider are carriers or implementations.
    second_pass_required: false
    second_pass_completed: true
    second_pass_method:
      zh: 在零 ATT&CK 子项条件下，先按 proof object、生成状态、绑定位置、有效期和验证者语义展开广度，再按攻击者控制、反事实痕迹、材料结果、证据层级和独立防御差异逐项筛选；智能卡代理未因父页提及而降低证据门槛。
      en: With zero ATT&CK children, the review first expanded proof object, generator state, binding location, lifetime, and verifier semantics, then filtered each by attacker control, counterfactual trace, material outcome, evidence tier, and independent defense difference. Smart-card proxying did not receive a lower evidence bar merely because the parent mentions it.
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两项正式子项按证明控制的持续性划分，并非按投递通道或平台。单次证明的检测窗口与处置对象是 challenge/session；生成状态的检测窗口与处置对象是 token container、binding 和整个 authenticator。驻留代理保持 deferred，避免以能力证据凑第三项。
      en: The two formal children divide persistence of proof control rather than delivery channel or platform. The single-proof detection window and response object are the challenge and session, while generator-state detection and response cover token container, binding, and the entire authenticator. Resident proxying remains deferred rather than using capability evidence to fill a third child.
  evidence_coverage:
    parent_behavior_keys: [TA0006-006-T1111-REF-ATTACK, TA0006-006-T1111-REF-OKTA-SCATTER, TA0006-006-T1111-REF-MANDIANT-PULSE, TA0006-006-T1111-REF-FOXIT-WOCAO]
    boundary_keys: [REF-000499, REF-000307, REF-000146, REF-000731, TA0006-006-T1111-REF-SANS-SYKIPOT]
    mechanism_support:
    - mechanism: NM-BT
      keys: [TA0006-006-T1111-REF-OKTA-SCATTER, TA0006-006-T1111-REF-MANDIANT-PULSE, REF-000307]
      limit: Cross-vantage separation is directly supported; no general alert-reduction rate is published
