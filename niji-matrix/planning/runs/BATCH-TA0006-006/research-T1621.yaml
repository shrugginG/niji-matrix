handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-006
work_item_ref: WORK-TA0006-T1621
temporary_key_prefix: TA0006-006-T1621
candidate:
  source_type: attack
  source_attack_id: T1621
  name:
    zh: 攻击者驱动的多因素认证挑战生成
    en: Adversary-Driven Multi-Factor Authentication Challenge Generation
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: >-
        ATT&CK Enterprise 19.1 的 T1621 明确属于 Credential Access，并以攻击者触发发送给受害用户的 MFA 请求来推进账户访问，因此父候选应保留。固定页把有效口令登录、无口令认证、SSPR、推送、短信、电话、持续轰炸与用户最终批准混在同一行为描述中；这些前提、传输介质和结果不能直接成为 Niji 子项。建议适配为攻击者驱动的 MFA 挑战生成：攻击者控制一笔认证或恢复事务，使权威身份系统为受害者登记的因素创建并投递挑战。挑战已生成是直接技术结果；用户拒绝、超时、报告欺诈、批准、令牌或会话签发及资源访问必须分层记录。
      en: >-
        ATT&CK Enterprise 19.1 places T1621 in Credential Access and centers it on adversary-triggered MFA requests delivered to a victim user to advance account access, so the parent candidate should be retained. The fixed page combines valid-password sign-in, passwordless authentication, SSPR, push, SMS, calls, continuous bombing, and eventual user approval in one description. These prerequisites, transports, and outcomes cannot become Niji children. Adapt the object as Adversary-Driven Multi-Factor Authentication Challenge Generation: the adversary controls an authentication or recovery transaction that causes the authoritative identity system to create and deliver a challenge to a factor registered for the victim. Challenge generation is the direct technique result; denial, timeout, fraud report, approval, token or session issuance, and resource access remain graded evidence stages.
    - zh: >-
        固定基线没有 ATT&CK 子项，开放搜索仍检查了请求次数、时间分布、传输方式、身份提供商、认证设备、用户动作、登录来源、请求显示情境和外部沟通。建议的两项 Niji 子技术不按推送、电话、云厂商或设备划分：一项利用由真实身份系统签发的重复挑战制造决策压力，使每个局部事件保持合法外观；另一项把支持、安保或其他可信叙事放在独立通信信道，并与攻击者认证事务同步，使少量挑战看起来有合理来由。前者依赖序列检测与限流，后者依赖跨信道来源、事务情境与独立确认，具有不可互换的观察和防御要求。
      en: >-
        Although the fixed baseline has no ATT&CK children, the open search examined request count, temporal distribution, transport, identity provider, authenticator device, user action, sign-in origin, displayed request context, and external communication. The two proposed Niji children are not split by push, phone, cloud vendor, or device. One applies repeated challenges issued by the genuine identity system to create decision pressure while each local event retains legitimate appearance. The other synchronizes a support, security, or comparable trusted narrative in a separate communication channel with the adversary's authentication transaction so a small number of challenges appears to have a reason. The former needs sequence detection and throttling; the latter needs cross-channel provenance, transaction context, and independent confirmation, creating non-interchangeable observation and defensive requirements.
proposed_content:
  summary:
    zh: 攻击者控制登录、无口令或恢复事务，使权威身份系统向受害者的已登记因素生成挑战，并利用真实请求外观、重复压力或跨信道情境提高被批准的机会。
    en: An adversary controls a sign-in, passwordless, or recovery transaction so the authoritative identity system generates a challenge for the victim's registered factor, using genuine-request appearance, repetition pressure, or cross-channel context to increase the chance of approval.
  definition_and_concept:
    paragraphs:
    - zh: >-
        攻击者驱动的多因素认证挑战生成是攻击者向身份提供商、应用登录入口、无口令认证或账户恢复流程发起一笔针对受害身份的事务，使系统创建并尝试投递需要该身份登记因素响应的 MFA 挑战。请求可要求确认、数字匹配、输入验证码、接听电话或执行等价动作，但传输和界面不改变父对象。直接目的在于把攻击者的认证事务带到用户决策点，使缺少第二因素的攻击者有机会得到权威系统认可的响应。
      en: >-
        Adversary-Driven Multi-Factor Authentication Challenge Generation occurs when an adversary initiates a transaction against a victim identity through an identity provider, application sign-in, passwordless authentication, or account recovery flow, causing the system to create and attempt delivery of an MFA challenge that requires a registered factor to respond. The request may ask for confirmation, number matching, code entry, a phone response, or an equivalent action, but transport and interface do not change the parent object. The direct purpose is to bring the adversary's transaction to a user decision point, giving an actor without the second factor an opportunity to obtain an authoritative response.
    - zh: >-
        证据链应区分六个阶段：攻击者是否掌握或绕过了主认证前提，身份系统是否创建挑战，挑战是否实际到达登记因素，用户如何响应，身份系统是否接受响应并签发令牌或会话，以及该会话是否访问资源。Uber 的公司披露直接记录重复登录、每次产生双因素批准请求、用户最终接受和攻击者成功登录；Microsoft 的 Midnight Blizzard 调查记录攻击者生成数字、用户在 Authenticator 输入、随后签发令牌。相比之下，只看到异常登录来源、移动通知截图或用户口述，不能自动证明权威挑战、批准和会话三者均已发生。
      en: >-
        Evidence should separate six stages: whether the adversary possessed or bypassed a primary-authentication prerequisite, whether the identity system created a challenge, whether it reached a registered factor, how the user responded, whether the identity system accepted the response and issued a token or session, and whether that session accessed resources. Uber's company disclosure directly records repeated sign-ins, a two-factor approval request on each attempt, eventual user acceptance, and successful adversary login. Microsoft's Midnight Blizzard investigation records an adversary-generated number, user entry in Authenticator, and subsequent token issuance. An anomalous sign-in origin, mobile-notification screenshot, or user recollection alone cannot establish that authoritative challenge, approval, and session all occurred.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        本行为使用组织自己的身份系统、登记因素和正常通知或验证界面。单次事件中的 issuer、品牌、TLS、应用名称、用户身份和挑战格式都可以完全真实；恶意差异位于谁启动了底层事务、来源设备和网络、请求节奏以及用户是否预期该挑战。只按通知真伪或身份提供商域名分类的防守方会把攻击者发起的真实挑战与合法登录混同。真实通道外观不会消除身份日志，request/correlation ID、来源、设备、应用、认证步骤和结果仍可恢复因果。
      en: >-
        The behavior uses the organization's own identity system, registered factor, and normal notification or verification interface. Issuer, branding, TLS, application name, user identity, and challenge format can all be genuine in an individual event. The malicious difference lies in who initiated the underlying transaction, source device and network, request cadence, and whether the user expected the challenge. A defender classifying only notification authenticity or identity-provider domain can conflate an adversary-initiated genuine challenge with a legitimate sign-in. Genuine-channel appearance does not remove identity logs; request or correlation identifiers, origin, device, application, authentication step, and outcome can recover causality.
    - zh: >-
        重复压力与跨信道情境产生不同痕迹。重复压力留下同一用户短窗内多个 challenge、拒绝、超时或未响应，最终可能出现一次批准；序列本身通常高可见，匿迹收益仅在每个请求都带有真实 issuer 外观，不能声称轰炸降低事件量。跨信道情境可用一次或少量请求配合电话、聊天或服务台叙事，把发起者线索留在通信系统，把 challenge 和 token 留在身份系统，两侧各自看似普通。Cisco 与 Microsoft 的事件证明这种分面，防守方需按用户、时间、声明角色、应用与认证事务连接。
      en: >-
        Repetition pressure and cross-channel context leave different traces. Repetition produces multiple challenges, denials, timeouts, or nonresponses for one user in a short window and may end with one approval. The sequence is usually conspicuous; its stealth benefit is limited to every request carrying a genuine issuer appearance, and bombing must not be described as reducing event volume. Cross-channel context can pair one or a few requests with a call, chat, or help-desk narrative, leaving initiator clues in communication systems and challenge or token evidence in identity systems, where each side can look ordinary. Cisco and Microsoft incidents establish this split, requiring joins by user, time, claimed role, application, and authentication transaction.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求攻击者控制目标身份的认证或恢复事务，并有权威身份系统生成面向其已登记因素的 MFA 挑战证据。攻击者可以使用已得口令、无口令入口、SSPR 或其他允许生成挑战的前置路径；前提不决定分类。用户拒绝或超时仍可证明请求生成，但不能证明 MFA 已绕过。只有用户批准而缺少发起事务、应用、来源或 token 对应关系时，应保留为异常批准，不可直接归因攻击者；合法 VPN 重连、应用重新认证、设备迁移、用户主动恢复和服务台协助是必要反例。
      en: >-
        Inclusion requires adversary control of an authentication or recovery transaction for the target identity and evidence that the authoritative identity system generated an MFA challenge for a registered factor. The adversary may use an acquired password, passwordless entry, SSPR, or another prerequisite path that permits challenge generation; the prerequisite does not define classification. User denial or timeout can establish request generation but not MFA bypass. An approval without corresponding initiating transaction, application, source, or token should remain an anomalous approval rather than automatic adversary attribution. Legitimate VPN reconnect, application reauthentication, device migration, user-initiated recovery, and help-desk assistance are necessary counterexamples.
    - zh: >-
        T1111 处理攻击者截获或取得 MFA 证明、验证码或响应；本技术让权威系统把挑战送到真实登记因素并等待用户动作，不要求攻击者读取第二因素内容。NJT-0165/T1187 促使受害端向攻击者可观察监听目标外发认证交换，而本技术由权威身份系统向受害因素投递挑战。NJT-0169/T1056 在秘密或代码输入路径中复制内容；如果用户把 MFA 代码输入攻击者控制页面，可与本技术并列，但挑战生成不能代替输入已被捕获的证据。批准后的有效账户登录、token 或 session 使用属于后继身份使用；添加攻击者认证器、电话或设备属于 T1098/NJT-0083；修改验证流程或策略属于 T1556/NJT-0093；没有 MFA 事务的普通帮助台社工归 NJT-0118 或相应初始访问对象。
      en: >-
        T1111 covers interception or acquisition of an MFA proof, code, or response. This technique makes the authoritative system send a challenge to the genuine registered factor and wait for user action without requiring the adversary to read second-factor content. NJT-0165/T1187 causes a victim endpoint to emit an authentication exchange toward an adversary-observable listener, whereas this technique has the authoritative identity system deliver a challenge to the victim factor. NJT-0169/T1056 copies a secret or code along the input path; if a user enters an MFA code into an adversary-controlled page, both may apply, but challenge generation cannot substitute for proof of captured input. Valid-account login, token, or session use after approval is a successor identity-use event. Adding an adversary authenticator, phone, or device belongs to T1098/NJT-0083; changing verification flow or policy belongs to T1556/NJT-0093; ordinary help-desk social engineering without an MFA transaction belongs to NJT-0118 or the relevant initial-access object.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          在重复压力场景中，攻击者以已得主口令或其他可触发入口反复尝试登录，使真实身份系统连续向同一用户发出请求。Uber 披露承包商最初多次阻止这些请求，后来接受一次，攻击者成功登录；NCSC 记录 SVR 反复推送直至受害者接受。此场景的前半段可在无成功会话时成立，后半段需要 challenge 结果、token 或 sign-in 成功独立证明。
        en: >-
          In repetition-pressure scenarios, an adversary repeatedly attempts sign-in with an acquired primary password or another challenge-capable entry point, causing the genuine identity system to send requests to the same user. Uber disclosed that a contractor initially blocked the requests, later accepted one, and the adversary signed in successfully. The NCSC reports the SVR repeatedly pushing requests until a victim accepts. The first stage exists without a successful session, while the latter requires independent challenge outcome, token, or sign-in-success evidence.
      - zh: >-
          在跨信道情境场景中，攻击者先发起一笔会显示数字或批准提示的认证事务，再通过电话、聊天或服务台身份解释为何用户应完成它。Cisco 记录攻击者以多个可信支持组织为幌子持续语音钓鱼并最终得到推送批准；Midnight Blizzard 使用失陷租户中的外部 Teams 身份冒充支持，指导目标输入攻击者事务显示的数字并获得 token。通信介质不是子项，稳定变量是事务解释权由身份系统之外的攻击者信道提供。
        en: >-
          In cross-channel-context scenarios, the adversary starts an authentication transaction that displays a number or approval prompt, then explains through a call, chat, or help-desk identity why the user should complete it. Cisco records repeated voice phishing under several trusted-support pretexts that ultimately obtained push approval. Midnight Blizzard used an external Teams identity from a compromised tenant to impersonate support, instructed the target to enter the number shown by the adversary transaction, and received a token. The communication medium does not define the child; the stable variable is that the transaction's explanation comes from an adversary-controlled channel outside the identity system.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者至少需要目标身份标识和一个可使身份系统进入 MFA 阶段的路径。某些流程要求正确主口令，另一些无口令或 SSPR 流程可能只要求账户信息和可用入口；正式案例必须记录具体前提。重复压力要求持续发起事务且未被限流、风险策略或用户欺诈报告封锁；跨信道情境要求能联系用户、构造可信角色或关系并同步 challenge 的有效期、应用和数字。攻击者不能保证通知送达、用户响应、响应被接受或最终 session 可用。
          en: >-
            The adversary needs at least a target identity and a path that brings the identity system to an MFA stage. Some flows require a correct primary password, while passwordless or SSPR flows can require only account information and an available entry point; formal cases must record the actual prerequisite. Repetition pressure requires continued transaction initiation without rate limiting, risk policy, or a user fraud report blocking it. Cross-channel context requires user contact, a credible role or relationship, and synchronization with challenge lifetime, application, and number. The adversary cannot guarantee delivery, user response, acceptance, or a usable final session.
        - zh: >-
            数字匹配和应用或地理情境会增加用户核对信息，但 Midnight Blizzard 案例说明攻击者可直接告诉用户输入其事务数字；因此这些控制降低偶然盲批，不替代抗钓鱼认证、独立确认和风险阻断。攻击者若已经控制服务台、真实通信账户或用户设备，外部标签和关系历史也可能失效。已获 token 的生命周期、设备绑定和资源权限决定后继价值，不应从一次批准反推所有应用均已失守。
          en: >-
            Number matching and application or geographic context give the user more information, but the Midnight Blizzard case shows an adversary can instruct the user to enter the adversary transaction's number. These controls reduce accidental blind approval but do not replace phishing-resistant authentication, independent confirmation, or risk blocking. External labels and relationship history can also fail when the adversary controls the help desk, a genuine communication account, or the user's device. Token lifetime, device binding, and resource entitlement determine successor value, so one approval cannot imply every application was compromised.
      defender_model:
        paragraphs:
        - zh: >-
            防守方假定能取得身份提供商的 primary-auth、challenge、认证步骤、结果、应用、来源、设备、Conditional Access 与 token 或 session 数据，并以 request、correlation、transaction 或 root-session ID 连接。Microsoft 登录详情可给认证方法序列和结果，但聚合字段可能延迟或暂时不完整；Duo 日志可提供应用、用户、factor、result、reason、来源与 txid。用户设备是否真正显示通知常缺少独立回执，因此“generated”“delivered”“responded”必须按平台能力分开。
          en: >-
            The defender is assumed to obtain identity-provider primary-authentication, challenge, authentication-step, result, application, origin, device, Conditional Access, and token or session data and join them through request, correlation, transaction, or root-session identifiers. Microsoft sign-in details can expose authentication-method sequence and outcome, while aggregated fields can be delayed or temporarily incomplete. Duo logs can provide application, user, factor, result, reason, origin, and transaction identifier. Independent proof that a user device displayed a notification is often unavailable, so generated, delivered, and responded states must remain platform-specific.
        - zh: >-
            跨信道场景还要求通信、服务台或通话元数据，包括发送者、租户或号码、外部标记、声明角色、thread/case ID、请求动作和独立确认状态。个人电话、加密聊天和未受管设备可能完全不可见；即使通信可见，也通常没有与 IdP challenge 共用的事务 ID，只能按用户、时间、应用和动作做概率关联。检测与响应不得采集 OTP、完整 token 或其他可复用秘密，应保存安全摘要和结果状态。
          en: >-
            Cross-channel scenarios also require communication, help-desk, or call metadata including sender, tenant or number, external label, claimed role, thread or case ID, requested action, and independent-confirmation state. Personal phones, encrypted chats, and unmanaged devices may be completely invisible. Even visible communications usually lack a transaction identifier shared with the IdP challenge and allow only probabilistic joins by user, time, application, and action. Detection and response must not collect OTPs, full tokens, or other reusable secrets and should retain safe digests and outcome state instead.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 权威身份系统的真实挑战外观掩盖恶意发起者
      en: Genuine challenge appearance from the authoritative identity system masks the malicious initiator
    analysis:
      paragraphs:
      - zh: >-
          攻击者通过正常登录、无口令或恢复入口使真实 IdP 和已登记认证器生成 challenge。用户与单点传感器看到熟悉品牌、应用和账户，以及密码学上真实的请求；被替换的是事务发起者和目的，而不是界面真伪。Uber、Cisco 和 Microsoft 事件直接证明真实 MFA 请求可由攻击者发起并最终获批。request/correlation ID、源 IP、设备、应用、用户预期和后继 session 仍能破坏伪装，故机理不等于请求不可见。
        en: >-
          The adversary uses a normal sign-in, passwordless, or recovery entry so the genuine IdP and registered authenticator generate the challenge. The user and a local sensor see familiar branding, application, account, and a cryptographically genuine request; transaction initiator and purpose change while interface authenticity does not. Uber, Cisco, and Microsoft incidents directly establish genuine MFA requests initiated by an adversary and eventually approved. Request or correlation ID, source IP, device, application, user expectation, and successor session can still break the disguise, so the mechanism does not make requests invisible.
    evidence_keys: [TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-CISCO, REF-000436]
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 外部信任叙事与 MFA 事务分布在不同信道和审计面
      en: External trust narrative and MFA transaction are distributed across separate channels and audit planes
    analysis:
      paragraphs:
      - zh: >-
          跨信道攻击把冒充支持或安保的叙事放在聊天、语音或服务流程，把 challenge、批准和 token 放在身份系统。任何单一审计面只看到一次看似普通的沟通或一次真实认证动作；只有把发送者关系、声明角色、用户、时间、应用和 IdP 事务连接后才能还原因果。Cisco 和 Midnight Blizzard 提供直接事件证据，但个人通信经常不可采集，公开资料也没有量化普遍告警下降幅度，因此保持 medium。
        en: >-
          Cross-channel attacks place the support or security impersonation narrative in chat, voice, or a service workflow, while challenge, approval, and token remain in the identity system. Any one audit plane sees an apparently ordinary communication or genuine authentication action. Causality emerges only after joining sender relationship, claimed role, user, time, application, and IdP transaction. Cisco and Midnight Blizzard provide direct incident evidence, but personal communication is often unavailable and public evidence does not quantify general alert reduction, so confidence remains medium.
    evidence_keys: [TA0006-006-T1621-REF-CISCO, REF-000436, CLM-000611]
    confidence: medium
proposed_subtechniques:
- temporary_key: TA0006-006-T1621-CHILD-REPETITION
  name:
    zh: 受信挑战重复压力
    en: Trusted-Challenge Repetition Pressure
  summary:
    zh: 攻击者连续生成真实 MFA 挑战，以拒绝、超时和未响应的累积压力提高用户最终批准其中一次的机会。
    en: An adversary repeatedly generates genuine MFA challenges so accumulated denial, timeout, and nonresponse pressure increases the chance that a user eventually approves one.
  taxonomy_variable:
    zh: 攻击者控制的 challenge 生成节奏是否被用于改变用户决策压力
    en: Whether adversary-controlled challenge cadence is used to alter user decision pressure
  counterfactual_trace:
    zh: 合法交互通常由一次用户发起事务产生少量连续步骤；重复压力形成同一主体在窄窗内多个真实 challenge、拒绝或超时，最终批准可来自同一或相邻攻击者事务。
    en: A legitimate interaction usually produces a small sequence from one user-initiated transaction; repetition pressure creates multiple genuine challenges, denials, or timeouts for one principal in a narrow window, with eventual approval from the same or a neighboring adversary transaction.
  definition_and_concept:
    paragraphs:
    - zh: >-
        受信挑战重复压力是攻击者反复启动针对同一身份的认证或恢复事务，使权威身份系统连续生成 challenge，以打断、困惑或疲劳用户并促使其批准。稳定变量是攻击者操纵的请求节奏与用户决策负担，不是推送、短信、电话、应用或厂商。子项在多个 challenge 已由身份系统生成时成立；用户是否最终接受决定结果等级，不决定行为是否发生。
      en: >-
        Trusted-Challenge Repetition Pressure repeatedly starts authentication or recovery transactions for one identity, causing the authoritative identity system to generate challenges that interrupt, confuse, or fatigue the user and encourage approval. The stable variable is adversary-controlled request cadence and user decision burden, not push, SMS, calls, application, or vendor. The child exists when the identity system has generated multiple challenges. Eventual acceptance determines outcome level rather than whether the behavior occurred.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        受信挑战重复压力让单个 challenge 的 issuer、应用与账户都保持真实，因而局部分类可能视为普通重试；恶意性质只在跨 transaction 聚合后出现。请求集中并不会减少痕迹，反而产生高频序列，所以本子项的匿迹特性严格限于“每个事件借用权威外观”，不把轰炸误写成时空释痕。可观察差异包括每用户和应用的挑战率、拒绝/超时链、来源与登记设备位置差、没有对应用户发起活动及最后一次批准后的 session。
      en: >-
        Trusted-Challenge Repetition Pressure keeps the issuer, application, and account of each challenge genuine, so local classification can treat it as an ordinary retry. Malice appears only after aggregation across transactions. Concentrated requests increase traces rather than dilute them, so the stealth property is strictly that each event borrows authoritative appearance; bombing is not mislabeled as Spatiotemporal Trace Dilution. Observable differences include per-user and per-application challenge rate, denial or timeout chain, divergence between origin and registered-device location, absence of matching user initiation, and a session after the final approval.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求同一目标身份收到多笔由攻击者事务生成的权威 challenge，并有节奏控制或连续尝试证据。一次用户误批、普通验证码重发、推送服务重复投递、客户端重连循环和身份提供商故障不自动属于本项；必须比较 transaction ID、来源、应用和用户意图。密码猜测归 T1110，但正确口令之后反复触发 MFA 可同时满足两项的不同阶段。用户批准、token 签发和资源访问作为后继结果另行记录。
      en: >-
        Inclusion requires multiple authoritative challenges for one target identity generated by adversary transactions, with evidence of cadence control or repeated attempts. One accidental approval, ordinary code resend, duplicate push delivery, client reconnect loop, and IdP outage do not automatically qualify and require comparison of transaction ID, origin, application, and user intent. Password guessing belongs to T1110, while repeated MFA generation after a correct password can satisfy both objects at different stages. User approval, token issuance, and resource access remain successor outcomes.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          Uber 2022 年披露攻击者反复尝试登录承包商账户，每次产生双因素批准请求，用户起初阻止，后来接受一次并让攻击者成功登录。NCSC 记录 SVR 反复推送 MFA 请求直到受害者接受；Cisco 同时观察高量请求和多日语音钓鱼。前两份资料直接支持重复节奏，Cisco 说明重复压力可与兄弟项的外部情境并用，但不能把三个事件拼成一个统一攻击链。
        en: >-
          Uber disclosed in 2022 that an adversary repeatedly attempted a contractor account, producing a two-factor approval request each time; the user initially blocked access, later accepted one, and enabled successful sign-in. The NCSC records the SVR repeatedly pushing MFA requests until a victim accepts, while Cisco observed high-volume requests together with voice phishing over several days. The first two directly support repetition cadence, and Cisco shows repetition can coexist with the sibling's external context, but the three incidents cannot be spliced into one chain.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要持续触发 challenge、知道目标身份，并在请求速率、账户锁定、风险评分、challenge 生命周期和用户上报之间维持操作。正确主口令会提高进入 MFA 阶段的稳定性，但 SSPR 或无口令入口可能改变前提。限流、连续拒绝后的临时阻断、欺诈报告、风险 Conditional Access 和抗钓鱼认证会减少机会；请求过密也可能迅速引发用户或 SOC 注意。
          en: >-
            The adversary needs sustained challenge generation, target identity knowledge, and operational continuity across request-rate controls, account lockout, risk scoring, challenge lifetime, and user reporting. A correct primary password makes reaching the MFA stage more reliable, while SSPR or passwordless entry can change prerequisites. Rate limiting, temporary blocks after repeated denial, fraud reporting, risk-based Conditional Access, and phishing-resistant authentication reduce opportunity, while excessive density can quickly attract user or SOC attention.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需要按 user、application、source、device、request/correlation ID 和 challenge result 聚合，而不是只看最终 sign-in。应区分 IdP 创建的独立挑战与同一 challenge 的通知重投，记录 denied、timeout、no-response、fraud 和 approved；对批准后 token/session 使用建立后继关联。若平台只保留最终成功或把多个步骤折叠为一条登录记录，重复压力会被低估。
          en: >-
            Defenders need aggregation by user, application, source, device, request or correlation identifier, and challenge result rather than final sign-in alone. They must distinguish independent IdP-created challenges from redelivery of one challenge, retain denied, timeout, no-response, fraud, and approved states, and join token or session use after approval. A platform retaining only final success or folding several steps into one sign-in record undercounts repetition pressure.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 每次重复均保留权威 challenge 的真实身份外观
      en: Every repetition preserves the genuine identity appearance of an authoritative challenge
    analysis:
      paragraphs:
      - zh: >-
          攻击者不伪造通知，而是让真实 IdP 为真实用户生成请求。每个事件单独看都有正常 issuer、factor 和应用字段，只有跨事务的节奏、来源与用户意图显示恶意。Uber、NCSC 与 Cisco 直接支持重复真实请求到批准或访问的链；高频本身容易检测，因此机理收益依赖防守方是否只判断单个事件而不聚合序列。
        en: >-
          The adversary does not forge a notification and instead makes the genuine IdP generate a request for the real user. Each event separately has normal issuer, factor, and application fields, while cadence, origin, and user intent across transactions reveal malice. Uber, NCSC, and Cisco directly support chains from repeated genuine requests to approval or access. High frequency is readily detectable, so the mechanism benefits only when defenders classify isolated events without sequence aggregation.
    evidence_keys: [TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-NCSC-SVR, TA0006-006-T1621-REF-CISCO]
    confidence: high
  evidence_keys: [TA0006-006-T1621-REF-ATTACK, TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-NCSC-SVR, TA0006-006-T1621-REF-CISCO]
  defense_keys: [TA0006-006-T1621-DET-REQUEST-OUTCOME, TA0006-006-T1621-NJA-SEQUENCE, TA0006-006-T1621-MIT-CHALLENGE-CONTROL]
  limitations:
    paragraphs:
    - zh: >-
        Uber、Cisco 与 NCSC 公告公开了重复请求、用户批准和访问结果，但没有发布可逐事件复核的完整 challenge ID、推送送达回执或全部失败次数。身份提供商也可能把通知重投与新事务记录为相似事件。正式实现应以本地日志验证“多笔独立挑战”，并把经验阈值作为调优起点，而不是把任意两次重试自动定性为攻击。
      en: >-
        Uber, Cisco, and NCSC reporting discloses repeated requests, user approval, and access outcomes but does not publish complete per-event challenge identifiers, delivery receipts, or every failed attempt. Identity providers can also record notification redelivery similarly to a new transaction. Formal implementation should verify multiple independent challenges in local logs and treat empirical thresholds as tuning starts rather than automatically classifying any two retries as an attack.
- temporary_key: TA0006-006-T1621-CHILD-CONTEXT
  name:
    zh: 跨信道请求情境同步
    en: Cross-Channel Request-Context Synchronization
  summary:
    zh: 攻击者在独立通信或服务流程中提供可信叙事，并与其 MFA 事务同步，使用户把少量恶意 challenge 解释为预期动作。
    en: An adversary supplies a trusted narrative through a separate communication or service workflow and synchronizes it with an MFA transaction so the user interprets a small number of malicious challenges as expected action.
  taxonomy_variable:
    zh: MFA 请求的解释情境是否由身份系统之外的攻击者控制信道同步提供
    en: Whether the MFA request's explanatory context is synchronously supplied by an adversary-controlled channel outside the identity system
  counterfactual_trace:
    zh: 无外部情境时，未主动登录的用户更可能拒绝陌生 challenge；同步后，通信侧出现支持或安保请求，身份侧出现少量真实 challenge 和批准，两侧缺少共同事务键。
    en: Without external context, a user who did not initiate sign-in is more likely to reject an unfamiliar challenge. After synchronization, the communication plane shows a support or security request while the identity plane shows a small number of genuine challenges and approval, often without a shared transaction key.
  definition_and_concept:
    paragraphs:
    - zh: >-
        跨信道请求情境同步是攻击者在聊天、语音、邮件、服务台或等价关系信道中冒充可信人员或职能权威，并把叙事时间、目标应用和用户动作与攻击者发起的 MFA challenge 对齐，使用户把该 challenge 视为支持、修复、安保验证或其他合理流程。稳定变量是外部情境替代真实事务发起者解释权，不是通信产品、云厂商、号码或设备。请求生成与情境同步必须分别有证据；只有社工而没有 MFA challenge 归相邻技术。
      en: >-
        Cross-Channel Request-Context Synchronization impersonates a trusted person or functional authority through chat, voice, mail, help desk, or an equivalent relationship channel and aligns narrative timing, target application, and requested user action with an adversary-initiated MFA challenge. The user then interprets the challenge as support, remediation, security verification, or another plausible workflow. The stable variable is external context replacing the true transaction initiator's explanation, not communication product, cloud vendor, phone number, or device. Request generation and context synchronization each need evidence; social engineering without an MFA challenge belongs to adjacent techniques.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        跨信道请求情境同步可以只生成一次或少量请求，避开依赖高频轰炸的阈值。通信系统看到一个支持或安保对话，IdP 看到一次真实 challenge、用户批准和正常 token，单侧均可能缺少恶意特征。异常位于发送者与权威目录不一致、外部或新关系、缺少独立确认、登录来源与用户设备不一致，以及通信请求动作与 IdP 事务在窄窗内对齐。真实支持账户被攻陷时，来源差分会进一步缩小。
      en: >-
        Cross-Channel Request-Context Synchronization can generate only one or a few requests and avoid thresholds dependent on high-volume bombing. A communication system sees a support or security conversation, while the IdP sees a genuine challenge, user approval, and ordinary token; either side alone can lack a malicious feature. The anomaly lies in sender divergence from an authoritative directory, an external or new relationship, missing independent confirmation, mismatch between sign-in origin and user device, and alignment of the communication request with the IdP transaction in a narrow window. Compromise of a real support account further narrows provenance differences.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求攻击者控制外部叙事、发起对应 MFA challenge，并使用户收到或处理两者；用户批准与 token 结果用于提高置信度但不是请求生成的必要条件。纯粹 MFA 轰炸无外部叙事归兄弟项；普通帮助台身份冒充无 MFA challenge 归 NJT-0118；用户把代码输入仿冒页面且被攻击者读取时另归 NJT-0169 或 T1111；帮助台合法指导 MFA 重注册、设备更换和恢复必须由工单、已知联系人、批准与身份事务解释。
      en: >-
        Inclusion requires adversary control of the external narrative, initiation of a corresponding MFA challenge, and victim receipt or handling of both. User approval and token outcome increase confidence but are not required to establish request generation. Pure MFA bombing without an external narrative belongs to the sibling. Help-desk impersonation without an MFA challenge belongs to NJT-0118. If a user enters a code into an impersonated page and the adversary reads it, NJT-0169 or T1111 applies separately. Legitimate help-desk guidance for MFA reregistration, device replacement, and recovery requires a ticket, known contact, approval, and identity-transaction explanation.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          Cisco 调查确认攻击者在取得员工口令后，以多个受信支持组织为幌子进行多日语音钓鱼，试图让用户接受攻击者发起的 MFA 推送，并最终成功取得 VPN 访问。Microsoft 记录 Midnight Blizzard 使用失陷小企业租户和安全主题域名在 Teams 中冒充技术支持，要求目标把攻击者认证流显示的数字输入 Authenticator；用户完成后攻击者获得 token 并访问 Microsoft 365。两案跨不同信道和界面，却共享外部叙事与权威 challenge 同步的变量。
        en: >-
          Cisco confirmed that after acquiring an employee password, the adversary conducted voice phishing over several days under the guise of several trusted support organizations, attempted to make the user accept adversary-initiated MFA pushes, and ultimately gained VPN access. Microsoft records Midnight Blizzard using compromised small-business tenants and security-themed domains to impersonate technical support in Teams and ask targets to enter the number displayed by the adversary's authentication flow into Authenticator. After completion, the adversary obtained a token and accessed Microsoft 365. The incidents span different channels and interfaces while sharing synchronization of external narrative with an authoritative challenge.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要能发起目标 MFA 事务、在 challenge 有效期内联系用户，并掌握足以构造可信角色、应用和故障叙事的组织知识。控制真实合作方、支持账户或已失陷租户会增强可信度；只用同形域名或陌生号码仍可能被外部标记暴露。数字匹配会迫使攻击者实时同步具体数字，但不会阻止已建立沟通的攻击者告诉用户输入该值。独立回呼、抗钓鱼认证和禁止支持人员索要 MFA 动作会削弱此路径。
          en: >-
            The adversary must initiate the target MFA transaction, contact the user within challenge lifetime, and know enough organizational context to construct a credible role, application, and failure narrative. Control of a real partner, support account, or compromised tenant improves credibility, while a lookalike domain or unfamiliar number can be exposed by external labeling. Number matching forces real-time synchronization of a specific number but does not prevent an established communicator from telling the user to enter it. Independent callback, phishing-resistant authentication, and a policy that support personnel never request MFA action weaken this path.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需将发送者/呼叫者身份、租户、外部标签、thread 或 case、声明角色、请求动作和确认状态，与 IdP 的 user、application、source、device、request/correlation ID、challenge 结果和 token/session 连接。通信与身份平台通常没有共同 ID，建议在合法支持流程中生成不可复用的工单引用并让 IdP 或支持工具记录其安全摘要。个人通信不可见时，只能依赖用户报告、异常 challenge 情境和后继 sign-in，归因强度应降低。
          en: >-
            Defenders need to join sender or caller identity, tenant, external label, thread or case, claimed role, requested action, and confirmation status to IdP user, application, source, device, request or correlation identifier, challenge outcome, and token or session. Communication and identity platforms rarely share an identifier. Legitimate support workflows should generate a nonreusable case reference and let the IdP or support tool retain its safe digest. When personal communication is invisible, defenders rely on user reporting, anomalous challenge context, and successor sign-in and must lower attribution strength.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 信任叙事与认证结果跨信道分离使单侧事件难以重建
      en: Separation of trust narrative and authentication outcome across channels impedes one-sided reconstruction
    analysis:
      paragraphs:
      - zh: >-
          攻击者在通信面建立支持或安保理由，在身份面生成 challenge 并取得用户动作。发送者关系和声明角色不进入普通 IdP 记录，request ID 与 token 也不进入通话或聊天日志；短窗口或单平台分析因此只能看到半条链。Cisco 与 Midnight Blizzard 直接证明这种分布，现有 DET-000115/NJA-000103 能解释关系权威侧，新专用 Analytic 仍需加入 challenge 与 token 阶段。
        en: >-
          The adversary establishes a support or security reason in the communication plane and generates a challenge plus user action in the identity plane. Sender relationship and claimed role do not enter ordinary IdP logs, while request ID and token do not enter call or chat records. A short-window or single-platform analysis therefore sees half the chain. Cisco and Midnight Blizzard directly establish this distribution. Existing DET-000115 and NJA-000103 explain the relational-authority side, while the new specialized analytic must add challenge and token stages.
    evidence_keys: [TA0006-006-T1621-REF-CISCO, REF-000436, CLM-000611]
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 可信职能叙事为真实 challenge 借用预期业务外观
      en: A trusted functional narrative lends expected business appearance to a genuine challenge
    analysis:
      paragraphs:
      - zh: >-
          攻击者把真实 MFA challenge 解释为服务台、安保或恢复流程的一部分，使用户用熟悉的组织角色和工作情境判断请求，而不是核对真正的登录发起者。Cisco 的可信支持幌子和 Midnight Blizzard 的安全主题租户直接支持这一特征替代；外部标签、权威目录、已知回呼号码、工单和应用/位置情境仍可揭示不一致。
        en: >-
          The adversary explains a genuine MFA challenge as part of help-desk, security, or recovery work, causing the user to judge the request through a familiar organizational role and business context rather than verify the true sign-in initiator. Cisco's trusted-support pretexts and Midnight Blizzard's security-themed tenants directly support the feature substitution. External labels, authoritative directories, known callback numbers, cases, and application or location context can still expose mismatch.
    evidence_keys: [TA0006-006-T1621-REF-CISCO, REF-000436, CLM-000647]
    confidence: high
  evidence_keys: [TA0006-006-T1621-REF-CISCO, REF-000436, CASE-000158, CLM-000611, CLM-000647]
  defense_keys: [TA0006-006-T1621-DET-REQUEST-OUTCOME, TA0006-006-T1621-NJA-CROSS-CHANNEL, TA0006-006-T1621-MIT-CHALLENGE-CONTROL, DET-000115, NJA-000103, MIT-000116]
  limitations:
    paragraphs:
    - zh: >-
        Cisco 和 Microsoft 提供完整的叙事、用户动作和访问或 token 结果，但没有公开通话或 Teams 事件与 IdP challenge 的原始共同键；正式检测只能按用户、时间和应用近似关联。真实支持账户或租户被攻陷时，来源异常也可能消失。数字匹配及额外情境提高验证成本却不是确定性阻断，需与抗钓鱼认证、独立确认和自动风险响应组合。
      en: >-
        Cisco and Microsoft provide complete narrative, user-action, and access or token outcomes but do not publish a raw common identifier between call or Teams events and IdP challenges. Formal detection can only approximate joins by user, time, and application. Compromise of a genuine support account or tenant can also remove provenance anomalies. Number matching and additional context increase verification cost but are not deterministic blocks and require phishing-resistant authentication, independent confirmation, and automated risk response.
defense_candidates:
  detection_strategies:
  - temporary_key: TA0006-006-T1621-DET-REQUEST-OUTCOME
    name:
      zh: MFA 挑战发起—用户响应—会话结果谱系
      en: MFA Challenge Initiation–User Response–Session Outcome Lineage
    objective:
      zh: 将攻击者可疑登录或恢复来源、权威 challenge、用户拒绝/超时/批准、外部解释情境和 token/session 结果分层连接。
      en: Join suspicious sign-in or recovery origin, authoritative challenge, user denial, timeout, or approval, external explanatory context, and token or session outcome as graded stages.
    detects_keys: [TA0006-006-T1621-PARENT, TA0006-006-T1621-CHILD-REPETITION, TA0006-006-T1621-CHILD-CONTEXT]
    analytic_keys: [TA0006-006-T1621-NJA-SEQUENCE, TA0006-006-T1621-NJA-CROSS-CHANNEL]
  detection_analytics:
  - temporary_key: TA0006-006-T1621-NJA-SEQUENCE
    strategy_key: TA0006-006-T1621-DET-REQUEST-OUTCOME
    name:
      zh: 多挑战响应序列与会话升级分析
      en: Multi-Challenge Response Sequence and Session Escalation Analytic
    logic:
      zh: >-
        对每个 user 建立 challenge 状态机，将主认证或恢复入口、challenge 创建、投递状态、factor、用户 denied/timeout/no-response/fraud/approved、token/session 签发和首个资源访问连接。默认调查条件为十分钟内至少三笔独立 request/correlation ID，或数量超过该用户—应用三十日基线第 99 百分位；任一 fraud report 立即高优先级。若 denied/timeout 序列后五分钟内从相同或近邻来源出现 approved 并签发 session，输出 approval_after_pressure；只有重复生成无批准时输出 challenge_pressure_attempt；approval 但无 session 输出 approved_unissued；资源访问是单独最高结果。阈值必须按应用重试语义校准，不能把通知重投当新挑战。
      en: >-
        Build a per-user challenge state machine joining primary authentication or recovery entry, challenge creation, delivery state, factor, user denial, timeout, nonresponse, fraud report, or approval, token or session issuance, and first resource access. A default investigation condition is at least three independent request or correlation identifiers within ten minutes, or volume above the user-application 99th percentile over thirty days. Any fraud report is immediately high priority. If a denial or timeout sequence is followed within five minutes by approval and session issuance from the same or a neighboring origin, emit approval_after_pressure. Repeated generation without approval emits challenge_pressure_attempt; approval without a session emits approved_unissued; resource access is a separate highest outcome. Calibrate thresholds by application retry semantics and do not count notification redelivery as a new challenge.
    data_requirements:
    - source_type: identity_authentication_transaction
      channel: IdP sign-in, authentication details, SSO, VPN, PAM, or recovery audit
      required_fields: [event.timestamp, tenant.id, user.id, application.id, resource.id, request.id, correlation.id, root_session.id, transaction.id, flow.type, source.ip, source.geo, client.type, user_agent, device.id, device.compliant, primary_auth.result]
    - source_type: mfa_challenge_event
      channel: MFA provider challenge and authentication log
      required_fields: [event.timestamp, tenant.id, user.id, application.id, challenge.id, request.id, factor.type, authenticator.device_id, challenge.creation_result, challenge.delivery_status, response.result, response.reason, response.timestamp, fraud.reported]
    - source_type: token_session_outcome
      channel: IdP token, relying-party session, Conditional Access, and resource audit
      required_fields: [event.timestamp, tenant.id, user.id, application.id, resource.id, request.id, correlation.id, session.id, token.safe_hash, token.issued, conditional_access.result, sign_in.result, first_resource_action]
    - source_type: user_application_baseline
      channel: identity behavior baseline and approved workflow inventory
      required_fields: [user.id, application.id, expected.source_range, expected.device_id, normal.challenge_count, normal.response_distribution, baseline.window, workflow.owner]
    observables: [independent_challenge_burst, repeated_denied_or_timed_out, user_reported_fraud, approval_after_denial_sequence, source_authenticator_location_mismatch, token_or_session_after_approval]
    correlation:
      window: 10m-sequence-with-5m-approval-to-session-and-30d-baseline
      dimensions: [tenant.id, user.id, application.id, resource.id, request.id, correlation.id, root_session.id, transaction.id, challenge.id, source.ip, device.id, authenticator.device_id, session.id]
    false_positives:
      zh: >-
        VPN 或桌面客户端重连、用户多次点击登录、移动通知延迟、同一 challenge 重投、应用 token 刷新故障、SSPR、设备更换、身份提供商故障和获批测试会形成重复事件。必须核对独立事务 ID、应用 owner、用户主动行为、变更窗口和平台送达语义；合法用户在弱网络中先超时后成功尤其常见。
      en: >-
        VPN or desktop-client reconnect, repeated user clicks, delayed mobile notifications, redelivery of one challenge, application token-refresh faults, SSPR, device replacement, IdP outage, and authorized testing can create repeated events. Check independent transaction identifiers, application owner, user initiation, change window, and platform delivery semantics. A legitimate user who times out on a weak network before succeeding is especially common.
    blind_spots:
      zh: >-
        某些平台只记录最终登录、不记录 challenge 创建或投递；聚合日志可能延迟并把多步骤折叠；跨 SaaS 缺少共同 correlation ID；电话和短信送达状态可能由外部提供商持有；攻击者也可用低频单次情境诱导避开序列阈值。记住设备或已有 MFA claim 的会话可能不产生新 challenge。
      en: >-
        Some platforms record only final sign-in and omit challenge creation or delivery. Aggregated logs can be delayed and collapse multiple steps. SaaS boundaries may lack a common correlation identifier. Telephony and SMS delivery state can remain with an external provider. An adversary can also use one low-volume context-assisted request to evade sequence thresholds. Remembered devices or sessions carrying an existing MFA claim may generate no new challenge.
    tuning_guidance:
      zh: >-
        先按应用和 flow 区分新 challenge、重投和步骤重试，再按用户群与工作时段建立 30 日分位数。对高权限用户、外部或新见来源、设备不合规、无对应用户发起活动、连续拒绝后批准和 fraud 报告提升权重；对精确工单、批准测试和已知故障限时降权。保留 generated、delivered、responded、approved、session_issued 与 resource_used 分级，缺失阶段标为 unknown 而非默认成功。
      en: >-
        First distinguish new challenges, redelivery, and step retry by application and flow, then build thirty-day percentiles by user cohort and work period. Raise weight for privileged users, external or first-seen origins, noncompliant devices, absence of corresponding user initiation, approval after consecutive denials, and fraud reports. Down-weight exact cases, authorized tests, and known incidents for bounded periods. Retain generated, delivered, responded, approved, session_issued, and resource_used grades, marking missing stages unknown instead of successful.
    recovery_guidance:
      zh: >-
        generated_only 或 denied 序列触发临时 challenge 限流、风险调查和用户通知；fraud 或 approved 未签发 session 时阻断新认证并核实主凭据暴露。若 session/token 已签发，立即阻断账户新登录、撤销 refresh token 与应用 session、重置可能泄露的主凭据，核对是否新增认证方法或设备，并检查批准后资源访问。恢复后用已知安全设备重新建立因素，验证旧 session 被拒绝，再解除风险状态。
      en: >-
        A generated_only or denied sequence triggers temporary challenge throttling, risk investigation, and user notification. A fraud report or approval without session issuance blocks new authentication while primary-credential exposure is verified. If a session or token was issued, immediately block new sign-ins, revoke refresh tokens and application sessions, reset potentially exposed primary credentials, check for added authentication methods or devices, and review post-approval resource access. Reestablish factors from a known-safe device, verify old sessions are rejected, and only then clear risk state.
    evidence_keys: [TA0006-006-T1621-REF-ATTACK, TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-NCSC-SVR, TA0006-006-T1621-REF-DUO-ADMIN, REF-000307, TA0006-006-T1621-REF-MS-MFA-SETTINGS, TA0006-006-T1621-REF-MS-REVOKE]
  - temporary_key: TA0006-006-T1621-NJA-CROSS-CHANNEL
    strategy_key: TA0006-006-T1621-DET-REQUEST-OUTCOME
    name:
      zh: 外部信任请求与 MFA 事务情境联查
      en: External Trust Request and MFA Transaction Context Join
    logic:
      zh: >-
        规范聊天、通话、邮件或服务台事件的 user、sender/caller、tenant/number、external label、thread/case、claimed role、requested action 与 independent_confirmation；在前后十五分钟连接同一 user 的 IdP challenge、application、source、device、显示情境、批准和 token/session。若外部或新关系声称支持/安保角色、要求完成 MFA，而没有登记工单或已知回呼确认，并与异常来源的 challenge 对齐，输出 cross_channel_mfa_context。challenge 与通信存在但用户拒绝时标为 interrupted；批准后 session 签发升级为 successful_context_brokerage。只有通信或只有 challenge 时输出一侧线索，不能自动补全另一侧。
      en: >-
        Normalize user, sender or caller, tenant or number, external label, thread or case, claimed role, requested action, and independent_confirmation from chat, call, mail, or help-desk events. Within fifteen minutes on either side, join the same user's IdP challenge, application, origin, device, displayed context, approval, and token or session. Emit cross_channel_mfa_context when an external or new relationship claims a support or security role, asks for MFA completion without a registered case or known callback confirmation, and aligns with a challenge from an anomalous origin. Mark a paired communication and challenge with user denial as interrupted, and upgrade approval followed by session issuance to successful_context_brokerage. Communication-only or challenge-only evidence remains one-sided and cannot fill the missing side automatically.
    data_requirements:
    - source_type: communication_or_support_request
      channel: enterprise chat, telephony metadata, mail, help-desk, or support workflow
      required_fields: [event.timestamp, user.id, channel.type, sender_or_caller.id, sender.tenant_id, sender.external_label, sender.number, thread.id, case.id, claimed.role, requested.action, independent_confirmation.status]
    - source_type: authoritative_relationship_inventory
      channel: directory, support roster, partner inventory, and approved-contact workflow
      required_fields: [principal.id, organization.id, role, known.contact, support.queue, relationship.valid_from, relationship.valid_to, workflow.owner]
    - source_type: mfa_transaction_context
      channel: IdP sign-in and MFA provider audit
      required_fields: [event.timestamp, tenant.id, user.id, application.id, request.id, correlation.id, challenge.id, source.ip, source.geo, device.id, displayed.application, displayed.location, response.result, response.timestamp]
    - source_type: token_session_outcome
      channel: IdP and relying-party session or resource audit
      required_fields: [event.timestamp, user.id, application.id, correlation.id, session.id, token.issued, sign_in.result, resource.action]
    observables: [external_support_pretext, no_registered_case, missing_independent_callback, communication_challenge_temporal_alignment, source_context_mismatch, approval_and_session_after_request]
    correlation:
      window: 15m-before-and-after-challenge-with-30d-relationship-history
      dimensions: [user.id, sender_or_caller.id, sender.tenant_id, thread.id, case.id, application.id, request.id, correlation.id, challenge.id, source.ip, device.id, session.id]
    false_positives:
      zh: >-
        合法服务台远程支持、MFA 注册或恢复、设备更换、入职培训、身份平台故障通知和获批红队会同时产生沟通与 challenge。要求工单、已知联系信息、实际支持队列、批准人、限定时段和用户主动请求；新外包商或收购后的新租户需要先更新权威关系清单，而不是永久白名单。
      en: >-
        Legitimate help-desk support, MFA registration or recovery, device replacement, onboarding, identity-platform outage notification, and authorized red teaming can produce both communication and challenge. Require a case, known contact, actual support queue, approver, bounded window, and user initiation. New vendors or post-acquisition tenants require updates to the authoritative relationship inventory rather than permanent allowlisting.
    blind_spots:
      zh: >-
        个人手机、端到端加密消息、面对面交谈和不受管邮箱可能没有企业遥测；真实支持账户或租户被攻陷会通过来源核验；通话内容缺失时 claimed role 与 requested action 只能来自用户报告。跨平台没有共同 ID 时，十五分钟关联只是强推断，时钟误差和批量日志延迟会破坏次序。
      en: >-
        Personal phones, end-to-end encrypted messages, face-to-face conversation, and unmanaged mail may have no enterprise telemetry. A compromised genuine support account or tenant passes provenance checks. Without call content, claimed role and requested action may exist only in user reporting. A fifteen-minute join without a cross-platform common identifier is strong inference rather than proof, and clock skew or batch-log delay can break ordering.
    tuning_guidance:
      zh: >-
        为支持、安保、身份恢复和外部合作建立权威联系人、队列与禁止事项，要求任何 MFA 协助带可核验工单，并把外部标签、关系新鲜度和缺少独立确认作为权重而非单独定罪。优先高权限用户、与 challenge 同时出现的即时消息、登录地与认证器地理不一致及批准后敏感资源访问；不在日志中保存 MFA 数字或 OTP 正文。
      en: >-
        Maintain authoritative contacts, queues, and prohibited requests for support, security, identity recovery, and external partners. Require any MFA assistance to carry a verifiable case and use external labeling, relationship novelty, and missing independent confirmation as weights rather than standalone verdicts. Prioritize privileged users, messages coincident with a challenge, divergence between sign-in and authenticator geography, and sensitive access after approval. Do not store MFA numbers or OTP content in logs.
    recovery_guidance:
      zh: >-
        用户拒绝或及时报告时，封锁发起来源、暂停 challenge 并保全通信与 IdP 记录；用户已批准时按 session 已签发处理，撤销 token/session、重置主凭据、核对认证器和设备变更并调查资源访问。若支持账户或租户被攻陷，除目标用户处置外还要吊销该通信主体、验证其他对话与工单，并恢复权威联系人目录。
      en: >-
        On user denial or timely reporting, block the initiating origin, pause challenges, and preserve communication and IdP records. After approval, treat the incident as potentially session-issued, revoke tokens and sessions, reset the primary credential, check authenticator and device changes, and investigate resource access. If a support account or tenant was compromised, revoke that communication principal, validate other conversations and cases, and restore the authoritative contact directory in addition to remediating the target user.
    evidence_keys: [TA0006-006-T1621-REF-CISCO, REF-000436, REF-000307, TA0006-006-T1621-REF-MS-CONTEXT, TA0006-006-T1621-REF-MS-NUMBER, DET-000115, NJA-000103]
  mitigations:
  - temporary_key: TA0006-006-T1621-MIT-CHALLENGE-CONTROL
    name:
      zh: MFA 挑战发放、事务绑定与风险恢复治理
      en: MFA Challenge Issuance, Transaction Binding, and Risk Recovery Governance
    measures:
    - key: challenge-rate-and-state-control
      control_type: preventive
      zh: >-
        按 user、application、source 与独立 transaction 限制 challenge 生成；连续拒绝、超时、无响应或欺诈报告后暂停新请求并进入风险流程，避免只限制某一种推送介质。
      en: >-
        Limit challenge generation by user, application, origin, and independent transaction. Pause new requests and enter a risk workflow after consecutive denial, timeout, nonresponse, or fraud report, without limiting controls to one push transport.
    - key: transaction-bound-user-confirmation
      control_type: preventive
      zh: >-
        对仍需用户交互的 MFA 显示应用、来源和位置并要求数字或等价事务匹配，把用户确认绑定到具体 transaction；验证者绑定的抗钓鱼认证继续由 MIT-000175 提供。
      en: >-
        For MFA that still needs user interaction, show application, origin, and location and require number or equivalent transaction matching, binding user confirmation to a specific transaction. MIT-000175 continues to provide verifier-bound phishing-resistant authentication.
    - key: suspicious-request-report-and-containment
      control_type: detective-support
      zh: >-
        让用户一键拒绝并报告未知 challenge，把报告写入 sign-in、audit 与 risk 数据，自动提高用户风险、阻断新登录或要求安全恢复；不得依赖用户另行寻找服务台号码。
      en: >-
        Let users deny and report an unknown challenge in one action, write the report to sign-in, audit, and risk data, and automatically raise user risk, block new sign-ins, or require secure remediation rather than making the user find a help-desk number separately.
    - key: approved-challenge-recovery
      control_type: containment
      zh: >-
        确认恶意 challenge 被批准后，阻断新登录、撤销 refresh token 和应用 session、重置暴露的主凭据、检查并移除攻击者认证方法或设备、复核后继资源操作，并用安全设备验证旧会话和旧因素已失效。
      en: >-
        After confirming approval of a malicious challenge, block new sign-ins, revoke refresh tokens and application sessions, reset exposed primary credentials, inspect and remove adversary authentication methods or devices, review successor resource actions, and verify from a safe device that old sessions and factors no longer work.
    applications:
    - target_key: TA0006-006-T1621-PARENT
      use:
        zh: >-
          对所有可生成 MFA challenge 的登录、无口令和 SSPR 入口登记 owner、factor、速率、显示情境、风险策略和日志字段；先审计合法重试，再启用限流、欺诈报告、风险阻断和 session 级恢复演练。
        en: >-
          Inventory owner, factor, rate, displayed context, risk policy, and log fields for every sign-in, passwordless, and SSPR entry capable of generating an MFA challenge. Audit legitimate retry behavior before enabling throttling, fraud reporting, risk blocking, and session-level recovery exercises.
      expected_effect:
        zh: >-
          缩小攻击者可任意生成请求的次数与范围，让未知 challenge 更易被用户和身份系统标记，并在批准后快速阻断 token 和会话后继价值。
        en: >-
          Reduce the number and scope of requests an adversary can generate, make unexpected challenges easier for users and identity systems to mark, and rapidly remove token and session value after approval.
      limitations:
        zh: >-
          旧版 VPN、RADIUS、NPS、电话和恢复流程可能不支持完整情境或 transaction 匹配；过严限流会影响真实故障恢复，session 撤销在不同应用传播速度不同。
        en: >-
          Legacy VPN, RADIUS, NPS, phone, and recovery flows may not support full context or transaction matching. Aggressive throttling can impair real recovery, and session revocation propagates at different speeds across applications.
    - target_key: TA0006-006-T1621-CHILD-REPETITION
      use:
        zh: >-
          为每用户—应用定义独立 challenge 速率与连续拒绝状态机；达到阈值或收到 fraud 时暂停请求、通知 SOC 和用户，并要求从已知安全设备重新发起，而不是继续向同一因素轰炸。
        en: >-
          Define an independent-challenge rate and consecutive-denial state machine per user and application. At threshold or fraud report, pause requests, notify the SOC and user, and require a restart from a known-safe device instead of continuing to bombard the same factor.
      expected_effect:
        zh: >-
          重复压力在形成长序列前被限制，拒绝和报告成为阻断信号；攻击者难以无限试验直至偶然批准。
        en: >-
          Repetition pressure is constrained before a long sequence forms, and denial or reporting becomes a blocking signal, preventing indefinite retries until accidental approval.
      limitations:
        zh: >-
          分布在多个应用或恢复入口的请求可能规避单集成限额，合法网络故障也会触发；需要租户级 user 聚合和受控例外。
        en: >-
          Requests distributed across applications or recovery entries can evade per-integration limits, and legitimate network failures can trigger controls. Tenant-wide user aggregation and controlled exceptions are required.
    - target_key: TA0006-006-T1621-CHILD-CONTEXT
      use:
        zh: >-
          让 challenge 显示应用和来源并绑定 transaction，对外部通信与 challenge 同时出现的高权限用户自动提升风险；已知目录回呼与支持流程由 MIT-000116 提供，抗钓鱼认证由 MIT-000175 提供。
        en: >-
          Display application and origin and bind the challenge to its transaction, automatically raising risk when external communication and a challenge coincide for a privileged user. MIT-000116 provides known-directory callback and support workflow, while MIT-000175 provides phishing-resistant authentication.
      expected_effect:
        zh: >-
          challenge 显示情境与实际 transaction 对齐，外部通信同时出现时触发风险处置；结合复用对象后，攻击者叙事更难单独驱动批准。
        en: >-
          Displayed challenge context aligns with the actual transaction and coincident external communication triggers risk handling. Combined with the reused controls, the adversary narrative is less able to drive approval by itself.
      limitations:
        zh: >-
          数字匹配可被实时社工转述，真实支持渠道同时失陷会绕过关系核验；抗钓鱼方法的覆盖必须包括恢复和旧应用，否则攻击者会转向最弱入口。
        en: >-
          A real-time social engineer can relay number matching, and simultaneous compromise of a genuine support channel can bypass relationship checks. Phishing-resistant coverage must include recovery and legacy applications or the adversary shifts to the weakest entry.
    evidence_keys: [TA0006-006-T1621-REF-MS-NUMBER, TA0006-006-T1621-REF-MS-CONTEXT, TA0006-006-T1621-REF-MS-MFA-SETTINGS, TA0006-006-T1621-REF-MS-REVOKE, TA0006-006-T1621-REF-CISCO, REF-000436]
existing_library_reuse:
  reference_refs:
  - ref: REF-000307
    resolution: reuse
    note: Exact Microsoft Entra sign-in detail reference already covers request and correlation identifiers, authentication method sequence, device and policy context, result semantics, aggregation delay, and incomplete-field limits.
  - ref: REF-000436
    resolution: reuse-and-extend-subject
    note: Exact Midnight Blizzard Teams source directly supports challenge generation, external support pretext, user code action, token issuance, and post-compromise access; extend only to the cross-channel child while retaining NJT-0118 use.
  claim_refs:
  - ref: CLM-000611
    resolution: reuse-and-extend-subject-subset
    note: The proposition about trusted-person or organization context hiding user-mediated approval applies unchanged to the cross-channel child, not to repetition-only pressure.
  - ref: CLM-000647
    resolution: reuse-and-extend-subject-subset
    note: The relational-authority boundary applies to the communication half of the cross-channel child and must not substitute for proof of an IdP challenge.
  case_refs:
  - ref: CASE-000158
    resolution: reuse-and-extend-subject
    note: Add the cross-channel T1621 child because the same observed event proves attacker authentication-flow initiation, victim Authenticator action, token issuance, and Microsoft 365 access; retain NJT-0118 subjects for the social context.
  strategy_refs:
  - ref: DET-000115
    resolution: reuse-and-extend-detects-subset
    note: Reuse for communication provenance and user-action outcome in the cross-channel child; the new T1621 strategy still needs challenge, response, and session states.
  analytic_refs:
  - ref: NJA-000103
    resolution: reuse-and-extend-subset
    note: Reuse relational-authority request-to-user-action logic for the cross-channel child; it lacks IdP transaction and token stages, so the specialized analytic remains distinct.
  mitigation_refs:
  - ref: MIT-000116
    resolution: reuse-and-extend-application
    note: Add a cross-channel-child application for known-directory callback and support policy; avoid duplicating independent-confirmation measures in the new MFA transaction mitigation.
  - ref: MIT-000175
    resolution: reuse-and-extend-application
    note: Extend phishing-resistant verifier-bound authentication and one-action reporting to the parent and cross-channel child; the new mitigation remains limited to challenge issuance rate, displayed transaction context, risk state, and recovery.
  relationship_refs: []
library_candidates:
  references:
  - temporary_key: TA0006-006-T1621-REF-ATTACK
    resolution: create
    url: https://attack.mitre.org/versions/v19/techniques/T1621/
    locator: Fixed Enterprise 19.1 parent behavior, zero ATT&CK children, implementation breadth, procedure examples, detection and mitigation context
    limit: Anchors parent behavior and fixed breadth but does not prove Niji-native child stealth effects or per-event challenge delivery and approval
