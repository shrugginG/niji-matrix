    limit: Revocation propagation depends on token type, application reevaluation and Continuous Access Evaluation support
  claims:
  - temporary_key: TA0006-006-T1621-CLM-STAGES
    resolution: create
    proposition_zh: MFA 主认证前提、challenge 创建、因素投递、用户响应、token/session 签发及资源访问是不同证据阶段，任一阶段不能自动证明后续阶段。
    proposition_en: MFA primary-authentication prerequisite, challenge creation, factor delivery, user response, token or session issuance, and resource access are distinct evidence stages, none of which automatically proves a later stage.
    evidence_keys: [TA0006-006-T1621-REF-UBER, REF-000436, REF-000307, TA0006-006-T1621-REF-DUO-ADMIN]
  - temporary_key: TA0006-006-T1621-CLM-PARENT
    resolution: create
    proposition_zh: 攻击者可通过登录、无口令或恢复入口让权威身份系统为受害因素生成真实 challenge，恶意差异位于事务发起者和目的而非请求真伪。
    proposition_en: An adversary can use sign-in, passwordless, or recovery entry to make the authoritative identity system generate a genuine challenge for the victim factor, with the malicious difference in transaction initiator and purpose rather than request authenticity.
    evidence_keys: [TA0006-006-T1621-REF-ATTACK, TA0006-006-T1621-REF-UBER, REF-000436]
  - temporary_key: TA0006-006-T1621-CLM-REPETITION
    resolution: create
    proposition_zh: 同一用户的多笔独立真实 challenge、拒绝或超时后批准及随后的 session 构成重复压力链，但高频本身增加痕迹而非形成时空释痕。
    proposition_en: Multiple independent genuine challenges for one user, approval after denials or timeouts, and a subsequent session form a repetition-pressure chain, while high volume increases traces rather than constituting Spatiotemporal Trace Dilution.
    evidence_keys: [TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-NCSC-SVR, TA0006-006-T1621-REF-CISCO]
  - temporary_key: TA0006-006-T1621-CLM-CONTEXT
    resolution: create
    proposition_zh: 攻击者把可信支持或安保叙事放在独立信道并与真实 MFA challenge 同步，可让少量请求获得合理外观并把关键因果分散到通信与身份审计面。
    proposition_en: Synchronizing a trusted support or security narrative in a separate channel with a genuine MFA challenge can give a small number of requests plausible appearance and distribute causality across communication and identity audit planes.
    evidence_keys: [TA0006-006-T1621-REF-CISCO, REF-000436, CLM-000611]
  - temporary_key: TA0006-006-T1621-CLM-DEFENSE
    resolution: create
    proposition_zh: 有效防御需要按 user 和事务连接 challenge 节奏、响应、显示情境、通信来源与 session 结果，并在欺诈报告或恶意批准后执行限流、阻断、凭据重置和会话撤销。
    proposition_en: Effective defense joins challenge cadence, response, displayed context, communication provenance, and session outcome by user and transaction, then throttles, blocks, resets credentials, and revokes sessions after fraud report or malicious approval.
    evidence_keys: [REF-000307, TA0006-006-T1621-REF-DUO-ADMIN, TA0006-006-T1621-REF-MS-MFA-SETTINGS, TA0006-006-T1621-REF-MS-REVOKE]
  cases:
  - temporary_key: TA0006-006-T1621-CASE-UBER
    resolution: create
    event: Uber's September 2022 incident in which a contractor received a two-factor approval request for each repeated attacker login, initially blocked them, eventually accepted one, and enabled successful attacker login and internal-system access
    evidence_keys: [TA0006-006-T1621-REF-UBER]
    limit: First-party summary does not publish raw event identifiers or the exact request count and does not by itself prove a separate social-pretext step
  - temporary_key: TA0006-006-T1621-CASE-CISCO
    resolution: create
    event: Cisco's May 2022 incident in which an actor with compromised credentials combined high-volume MFA pushes and multi-day voice phishing under trusted-support pretexts, gained push acceptance and VPN access, then enrolled new MFA devices
    evidence_keys: [TA0006-006-T1621-REF-CISCO]
    limit: One incident supports both children and successor account manipulation but must retain those stages separately
  - temporary_key: TA0006-006-T1621-CASE-SVR
    resolution: create
    event: Government-partner reporting that SVR actors repeatedly sent MFA requests until victim acceptance provided cloud-account access, followed in some incidents by device registration
    evidence_keys: [TA0006-006-T1621-REF-NCSC-SVR]
    limit: Campaign-level public reporting without per-victim raw authentication records
  detection_strategies:
  - temporary_key: TA0006-006-T1621-DET-REQUEST-OUTCOME
    resolution: create
    distinction: Authoritative challenge generation through response and session outcome, with separate sequence and cross-channel analytics; existing DET-000115 supplies only communication provenance
  detection_analytics:
  - temporary_key: TA0006-006-T1621-NJA-SEQUENCE
    resolution: create
    distinction: Independent challenge identifiers and response-state sequence with ten-minute triage, five-minute approval-to-session window, thirty-day baseline, graded results and recovery
  - temporary_key: TA0006-006-T1621-NJA-CROSS-CHANNEL
    resolution: create
    distinction: Fifteen-minute relationship-provenance and MFA-transaction join with ticket/callback counterevidence and explicit one-sided status
  mitigations:
  - temporary_key: TA0006-006-T1621-MIT-CHALLENGE-CONTROL
    resolution: create
    distinction: Challenge issuance rate, number/context binding, integrated fraud-risk response, and approved-challenge recovery; independent callback belongs to MIT-000116 and verifier-bound authentication belongs to MIT-000175
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - zh: 正确主口令、无口令登录与 SSPR 是进入 challenge 阶段的前提差异
      en: Correct primary password, passwordless sign-in, and SSPR are prerequisite differences for reaching the challenge stage
    - zh: 推送、短信、语音、代码和设备是 challenge 传输与交互实现
      en: Push, SMS, voice, code, and device are challenge transport and interaction implementations
    - zh: 请求生成、用户响应、session 签发和资源访问是证据阶段
      en: Request generation, user response, session issuance, and resource access are evidence stages
    breadth_trigger: ordinary-zero-child-open-search
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: authoritative_challenge_repetition_pressure
      disposition: formal
      why_zh: 攻击者可控节奏改变用户决策负担，每个事件保留真实 issuer 外观；序列检测、限流和拒绝状态机具有独立防御价值，三份一手或政府事件资料支持。
      why_en: Adversary-controlled cadence changes user decision burden while every event retains genuine issuer appearance; sequence detection, throttling, and denial state machines have distinct defensive value and are supported by three first-party or government incident sources.
    - axis: cross_channel_request_context_synchronization
      disposition: formal
      why_zh: 攻击者在身份系统之外控制解释情境并与 challenge 同步，造成通信与身份审计分面；跨信道来源、工单和独立确认不同于频率检测，Cisco 与 Midnight Blizzard 直接支持。
      why_en: The adversary controls explanatory context outside the identity system and synchronizes it with a challenge, splitting communication and identity audit. Cross-channel provenance, cases, and independent confirmation differ from rate detection and are directly supported by Cisco and Midnight Blizzard.
    - axis: request_transport_or_vendor
      disposition: rejected
      why_zh: 推送、短信、电话、Authenticator、Duo、Okta 和具体云厂商只改变传输、字段与兼容性，没有稳定独立的匿迹因果。
      why_en: Push, SMS, calls, Authenticator, Duo, Okta, and named cloud vendors change transport, fields, and compatibility without a stable independent stealth cause.
    - axis: authenticator_device_or_factor
      disposition: rejected
      why_zh: 手机、硬件令牌和注册设备属于因素实现；新增或替换因素另归 NJT-0083，不能按设备建本候选子项。
      why_en: Phones, hardware tokens, and registered devices are factor implementations; adding or replacing a factor belongs to NJT-0083 and cannot form children here.
    - axis: approval_token_and_resource_outcomes
      disposition: evidence-stages
      why_zh: 拒绝、批准、token/session 与资源访问提升成功等级，但不是可互换的子技术变量；有效账户或 token 使用拥有后继对象。
      why_en: Denial, approval, token or session, and resource access raise outcome grade but are not interchangeable child variables; valid-account or token use owns successor behavior.
    - axis: low_volume_expected_activity_timing
      disposition: evidence-deferred
      why_zh: 把单次 challenge 安排在用户真实登录附近可能降低怀疑，但本批未找到能把该 timing 与攻击者控制及独立防御效果同时固定的一手事件。
      why_en: Timing one challenge near a real user sign-in could reduce suspicion, but this batch found no primary incident fixing attacker control and an independent defense effect for that timing axis.
    - axis: cross_application_request_distribution
      disposition: evidence-deferred
      why_zh: 跨应用生成请求可能绕过单集成限额，但公开来源未证明真实攻击者以此规避阈值，也与统一 user 级限流直接重叠。
      why_en: Cross-application generation could evade per-integration limits, but public sources do not establish field use to evade thresholds and the axis overlaps tenant-wide user throttling.
    - axis: passwordless_sspr_or_primary_password_entry
      disposition: parent-core
      why_zh: 不同入口改变前提和数据源，却都以权威 challenge 生成为直接行为，不能按 flow 名称拆分。
      why_en: Different entries change prerequisites and data sources while retaining authoritative challenge generation as the direct behavior, so flow names do not define children.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        固定基线无 ATT&CK 子项，但研究从节奏、时间、来源、显示情境、外部通信、应用分布、入口、factor、设备和结果阶段开放搜索。只有重复压力与跨信道情境同时通过攻击者控制、痕迹变化、观察差、案例证据和独立防御门禁。两个子项可在 Cisco 等事件中并列，但不得因共现合并；传输、厂商、设备和结果阶段均不成为 NJS。
      en: >-
        The fixed baseline has no ATT&CK children, but research openly searched cadence, timing, origin, displayed context, external communication, application distribution, entry flow, factor, device, and outcome stages. Only repetition pressure and cross-channel context passed attacker-control, trace-change, observation-difference, case-evidence, and distinct-defense gates. The children can coexist in incidents such as Cisco without being merged merely because they co-occur. Transport, vendor, device, and outcome stages do not become NJS objects.
  evidence_coverage:
    parent_behavior_keys: [TA0006-006-T1621-REF-ATTACK, TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-CISCO, TA0006-006-T1621-REF-NCSC-SVR, REF-000436]
    boundary_keys: [REF-000436, CASE-000158, REF-000307, TA0006-006-T1621-REF-MS-NUMBER, TA0006-006-T1621-REF-MS-REVOKE]
    mechanism_support:
    - mechanism: NM-FD
      keys: [TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-CISCO, REF-000436]
      limit: Genuine IdP challenge appearance and adversary initiation are directly observed; generalized classifier degradation depends on local context and telemetry
    - mechanism: NM-ST
      keys: [TA0006-006-T1621-REF-CISCO, REF-000436, CLM-000611]
      limit: Cross-channel event separation is directly observed, while availability of communication telemetry and alert-rate reduction varies by environment
    child_existence_support:
    - child_key: TA0006-006-T1621-CHILD-REPETITION
      keys: [TA0006-006-T1621-REF-UBER, TA0006-006-T1621-REF-NCSC-SVR, TA0006-006-T1621-REF-CISCO]
      status: directly-observed-across-independent-incidents
    - child_key: TA0006-006-T1621-CHILD-CONTEXT
      keys: [TA0006-006-T1621-REF-CISCO, REF-000436, CASE-000158]
      status: directly-observed-across-voice-and-chat-channels
    unsupported_or_deferred:
    - zh: challenge 创建日志不自动证明移动设备已显示通知，通知送达需按供应商字段单独验证。
      en: A challenge-creation log does not automatically prove that a mobile device displayed a notification; delivery needs provider-specific evidence.
    - zh: 用户批准不自动证明 token/session 已签发或资源已访问，所有后继阶段须独立连接。
      en: User approval does not automatically prove token or session issuance or resource access; each successor stage requires a separate join.
    - zh: 数字匹配和应用/位置情境会减少盲批，但 Midnight Blizzard 证明实时社工仍可让用户完成攻击者事务，不能宣称确定性阻断。
      en: Number matching and application or location context reduce blind approval, but Midnight Blizzard shows real-time social engineering can still make a user complete the adversary transaction, so deterministic prevention is unsupported.
    - zh: 公开案例没有提供可用于普遍阈值的完整 challenge 数量和重投语义，十分钟三笔仅为部署起点。
      en: Public incidents do not provide complete challenge counts and redelivery semantics for a universal threshold; three in ten minutes is a deployment starting point only.
    - zh: 本批没有足够一手证据把低频预期时机或跨应用分布正式化为独立子项。
      en: This batch lacks sufficient primary evidence to formalize low-volume expected timing or cross-application distribution as independent children.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父稿分别说明 challenge 生成行为、六阶段证据链、真实 issuer 外观、合法反例、T1111/NJT-0165/NJT-0169/有效账户/NJT-0083/NJT-0118 边界、攻击与防守前提以及两项机理。两个子稿各有稳定变量、反事实痕迹、跨案例证据和独立检测或缓解价值；专用 Analytic 给出字段、窗口、维度、阈值起点、反例、盲区、调优和恢复，不按推送、电话、厂商、设备或产品拆分。
      en: >-
        The parent separately explains challenge-generation behavior, six-stage evidence chain, genuine issuer appearance, legitimate counterexamples, boundaries with T1111, NJT-0165, NJT-0169, valid-account use, NJT-0083, and NJT-0118, attacker and defender prerequisites, and two mechanisms. Each child has a stable variable, counterfactual trace, cross-case evidence, and distinct detection or mitigation value. Specialized analytics include fields, windows, dimensions, threshold starting point, counterexamples, blind spots, tuning, and recovery without splitting by push, calls, vendor, device, or product.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization, exact-URL duplicate search, temporary-key resolution, recursive bilingual and paragraph audit, and line-hygiene checks only
  limitations:
    paragraphs:
    - zh: >-
        一手证据公开粒度不一致。Uber 提供重复请求到成功登录的公司披露；Cisco 提供口令、请求、语音社工、批准、VPN 和认证器新增的事件链；Microsoft 提供数字匹配式跨信道社工到 token 的链；NCSC 提供 SVR campaign-level 结论。它们足以支持父行为和两个变量，却都没有发布可拼接的原始 challenge、移动送达、通信和 token 全量数据。不同事件不得组合成一笔“完整观测”，具体案例的阶段置信度应随原始日志调整。
      en: >-
        Primary evidence has uneven public granularity. Uber provides a company disclosure from repeated requests through successful login. Cisco supplies an incident chain across password, requests, voice social engineering, approval, VPN, and authenticator addition. Microsoft supplies a number-matching cross-channel chain through token issuance. NCSC provides a campaign-level SVR conclusion. Together they support parent behavior and both variables, but none publishes complete raw challenge, mobile delivery, communication, and token data that can be joined. Separate incidents cannot be combined into one complete observation, and stage confidence in a specific case should follow its original logs.
    - zh: >-
        IdP、MFA 供应商、VPN 与 SaaS 对 request、challenge、送达、响应和 session 的字段与保留不同；某些日志是延迟聚合，某些只记录最终 allow/deny。跨信道通信经常位于个人设备，无法集中采集。检测在缺少共同 ID 时只能强推断，必须明确 unknown 阶段；恢复也需验证第三方应用 session 是否真正撤销，不能只相信 IdP 控制台显示。
      en: >-
        IdPs, MFA providers, VPNs, and SaaS platforms differ in request, challenge, delivery, response, session fields, and retention. Some logs are delayed aggregates and some record only final allow or deny. Cross-channel communication often occurs on personal devices and cannot be centrally collected. Detection without a common identifier is strong inference and must preserve unknown stages. Recovery must verify that third-party application sessions were actually revoked rather than trusting the IdP console alone.
  rejected_mechanisms:
  - mechanism: NM-DO
    reason_zh: challenge 和响应的密码学内容由协议定义，攻击者在本行为中没有主动改变数据形态或可解释性，不能据此认定数据遮蔽。
    reason_en: Challenge and response cryptographic content is defined by protocol; the adversary does not alter data form or interpretability in this behavior, so Data Obscuration is unsupported.
  - mechanism: NM-ST-for-repetition
    reason_zh: 集中轰炸增加短窗事件量，不是时空释痕；NM-ST 仅用于跨信道情境把叙事和认证结果分置观察面。
    reason_en: Concentrated bombing increases short-window event volume and is not Spatiotemporal Trace Dilution; NM-ST applies only to cross-channel context that separates narrative and authentication outcome across observation planes.
  open_questions:
  - zh: >-
        主 Agent 应与 T1111 研究统一“challenge 生成、用户动作、证明被攻击者取得”边界；若验证码或响应被攻击者实际读取，T1111 可并列，但 T1621 不能仅凭批准推断截获。
    en: >-
        The primary agent should converge with T1111 research on boundaries among challenge generation, user action, and adversary acquisition of a proof. T1111 can coexist when a code or response is actually read by the adversary, while T1621 cannot infer interception from approval alone.
  - zh: >-
        主 Agent 应裁定 CLM-000611、CLM-000647、CASE-000158、DET-000115、NJA-000103、MIT-000116 与 MIT-000175 的扩展；通信对象只覆盖跨信道子集，不能替代专用 MFA 事务对象。
    en: >-
        The primary agent should decide extensions for CLM-000611, CLM-000647, CASE-000158, DET-000115, NJA-000103, MIT-000116, and MIT-000175. Communication objects cover only the cross-channel subset and cannot replace specialized MFA transaction objects.
  - zh: >-
        本地部署必须确认哪些字段区分新 challenge、通知重投和用户重试，并验证 session 撤销到各依赖应用的传播；未实测前不得把通用字段名直接映射到所有供应商。
    en: >-
        Local deployment must establish which fields distinguish a new challenge, notification redelivery, and user retry and test session-revocation propagation to each relying application. Generic field names cannot be mapped to every vendor without validation.
integration:
  status: review
  resolutions:
  - central admission and Niji-native taxonomy adjudicated
  - canonical IDs synchronized and shared-library extensions applied
  - quality, bundle, and Web gates passed
