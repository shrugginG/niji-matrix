recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1040 同时映射 Credential Access 与 Discovery，并把被动接口捕获、SPAN、云流量镜像和网络设备原生抓包放在同一父行为内。TA0006 应保留“不改变通信原定目的地而观察在途数据”这一行为锚点，但把正式范围收紧为已经取得明文秘密、挑战应答、可恢复的认证交换或等价认证材料的捕获。仅看到地址、服务、版本、VLAN 或一般通信内容属于 Discovery 或 Collection 结果；只启动抓包而未证明认证流进入观察面，则是暴露或尝试，不能宣称凭据获取完成。
        en: >-
          ATT&CK Enterprise 19.1 maps T1040 to both Credential Access and Discovery and places passive interface capture, SPAN, cloud traffic mirroring, and native network-device capture under the same parent behavior. For TA0006, preserve the anchor of observing data in transit without changing its intended destination, but narrow formal scope to captures that acquire plaintext secrets, challenge responses, recoverable authentication exchanges, or equivalent authentication material. Addresses, services, versions, VLANs, and general communications content are Discovery or Collection outcomes. Starting a capture without showing that authentication traffic entered the observation surface establishes exposure or attempt, not completed credential acquisition.
      - zh: >-
          直接事件证据支持这一收窄。Mandiant 在 UNC3886 入侵的 TACACS+ 服务器上恢复并分析了 LOOKOVER：该 libpcap 嗅探器筛选认证报文、使用服务器共享秘密解混淆并准备写出提取结果；但样本在写盘前发生崩溃，因此它直接证明部署、材料处理逻辑和端点观察位置，不能证明全部凭据被持久保存或使用。2025 年 CISA 等机构联合通告直接记录国家支持行为者在受侵路由器上收集原生 PCAP，并观察到 SPAN/RSPAN/ERSPAN 镜像及指向认证流量的抓包文件；通告对具体 TACACS+ 凭据解密和后继使用仍使用推断措辞。准入置信度据此为 medium，而不是把工具能力或镜像配置自动提升为成功凭据获取。
        en: >-
          Direct incident evidence supports this narrowing. On a TACACS+ server compromised by UNC3886, Mandiant recovered and analyzed LOOKOVER, a libpcap sniffer that selected authentication packets, used the server's shared secret to de-obfuscate them, and prepared extracted results for output. The sample crashed before completing its disk write, so the evidence directly establishes deployment, material-processing logic, and an endpoint observation position, but not durable collection or use of every credential. A 2025 joint advisory led by CISA directly documents state-sponsored actors collecting native PCAPs on compromised routers and observed SPAN, RSPAN, or ERSPAN mirroring and authentication-focused capture files. The advisory remains inferential about decryption of particular TACACS+ credentials and successor use. Admission is therefore medium confidence rather than treating tool capability or mirror configuration as successful credential acquisition.
  admission_gate:
    required_evidence:
      - adversary_controlled_observation_surface
      - authentication_bearing_flow_observed_at_that_surface
      - credential_material_present_or_recoverable
      - capture_or_material_result_linked_by_session_flow_artifact_or_forensic_state
    insufficient_alone:
      - packet_capture_tool_execution
      - promiscuous_mode_or_raw_socket_without_authentication_flow
      - mirror_session_without_collector_receipt
      - network_metadata_or_discovery_only
      - encrypted_payload_without_key_or_termination_boundary
      - lawful_monitoring_without_adversary_control
    successful_account_use_required: false
proposed_content:
  name:
    zh: 凭据流量被动嗅探
    en: Passive Credential-Traffic Sniffing
  summary:
    zh: 攻击者在不改变认证通信原定目的地的情况下，从端点、既有转发路径或复制观察面捕获可用认证材料，并利用观察行为与正常流量诊断相似且不产生受害端交互的特点降低可见性。
    en: An adversary captures usable authentication material at an endpoint, an existing transit path, or a replicated observation plane without changing the communication's intended destination, reducing visibility because observation generates no victim-facing exchange and resembles ordinary traffic diagnostics.
  definition_and_concept:
    paragraphs:
      - zh: >-
          凭据流量被动嗅探是攻击者控制一个能够看见原始认证流或其副本的观察位置，读取并保存其中的口令、挑战应答、会话证明、共享秘密可解开的认证正文或其他可用于后继认证的材料。直接目标是从已经发生的通信中取得认证材料；捕获可位于认证端点、原有转发节点或另建的复制观察面，但不要求攻击者向通信双方注入报文，也不改变原定服务指向。
        en: >-
          Passive Credential-Traffic Sniffing occurs when an adversary controls an observation position that can see an original authentication flow or its copy and reads or retains passwords, challenge responses, session proofs, authentication bodies recoverable with a shared secret, or other material usable for follow-on authentication. Its direct objective is authentication material from communications already occurring. Capture may reside at an authentication endpoint, an existing forwarding node, or a replicated observation plane, but does not require injecting packets toward either party or changing the intended service direction.
      - zh: >-
          本概念以观察关系和材料结果为核心，不以 tcpdump、libpcap、Pktmon、嵌入式抓包、SPAN、某个接口或协议名称定义边界。报文已被保存也不自动等于取得凭据：防守方须区分明文秘密、弱保护且已具备恢复条件的交换、只可离线猜测的证明、不可解密密文和纯元数据。成功登录、离线破解或中继是可能的后继结果，需要另证。
        en: >-
          The concept is defined by the observation relationship and material outcome, not by tcpdump, libpcap, Pktmon, embedded capture, SPAN, an interface, or a protocol name. Saving packets does not automatically equal credential acquisition. Defenders must distinguish plaintext secrets, weakly protected exchanges with demonstrated recovery conditions, proofs suitable only for offline guessing, undecryptable ciphertext, and metadata. Successful sign-in, offline cracking, or relay are possible successor outcomes that require separate evidence.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          被动嗅探不需要制造新的认证请求、竞争响应或路径漂移。原始会话可正常完成，发送方和接收方日志也不必出现额外参与者；攻击者的主要痕迹集中在观察位置的抓包权限、套接字或捕获驱动、过滤条件、缓冲区、镜像状态、输出文件和导出连接中。只查看认证服务器成功日志或原始流量路径的防守方因此可能完全看不到复制或读取动作。
        en: >-
          Passive sniffing need not generate a new authentication request, competing response, or path drift. The original session may complete normally and endpoint logs need not record an additional participant. Most residue accumulates at the observation position in capture privileges, packet sockets or drivers, filters, buffers, mirror state, output files, and export connections. A defender looking only at successful authentication logs or the original traffic path may therefore miss the copying or reading action entirely.
      - zh: >-
          攻击者还可以借用运维人员本来就用于故障诊断、性能分析和安全监测的原生能力，并用短时、窄过滤器只选取认证端口或目标接口。该相似性提高恶意与合法抓包的区分成本，但不会消除控制面和产物痕迹。端到端加密会降低路径外观察面的材料可见性；如果捕获发生在终止点、认证服务器掌握共享秘密，或攻击者另行取得解密材料，网络上“已加密”的外观仍不能排除凭据暴露。
        en: >-
          The adversary can also borrow native functions used for troubleshooting, performance analysis, and security monitoring, with short-lived narrow filters that select authentication ports or interfaces. This similarity raises the cost of separating malicious from authorized capture but does not erase control-plane and artifact residue. End-to-end encryption reduces material visibility at observation points outside the boundary. When capture occurs at a termination point, an authentication server holds the shared secret, or the adversary separately obtains decryption material, an encrypted wire appearance does not rule out credential exposure.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求攻击者没有通过名称、网关、无线接入点、代理或路由修改把认证流主动导向新目的地，而是在原端点、原路径或不影响原交付的复制分支上观察它。NJT-0136/T1557 拥有受信路径或服务指向被主动替换和证明被跨目标中继的行为；同一事件若先建立恶意路径再抓包，可分别记录路径介入与嗅探，但两者证据不能互相替代。T1187/NJT-0165 拥有攻击者诱使受害主体新产生认证交换的因果起点；如果诱发后的交换又在独立观察面被捕获，可双重标注。
        en: >-
          Inclusion requires observation at an original endpoint, the original path, or a copy branch that does not affect original delivery, rather than active redirection through a changed name, gateway, wireless access point, proxy, or route. NJT-0136/T1557 owns deliberate replacement of a trusted path or service direction and cross-destination relay of a proof. An event that first establishes an adversarial path and then captures packets may carry both labels, but evidence for one cannot substitute for the other. T1187/NJT-0165 owns the causal trigger that makes a victim emit a new authentication exchange. An induced exchange later captured on a separately established observation surface may also carry both labels.
      - zh: >-
          T1111 以多因素证明或一次性值被截获这一材料结果为直接对象，而本对象要求网络观察位置及报文捕获证据；经网络抓取到 OTP 时可并列，但短信服务端窃取、键盘记录或伪页面收集只归 T1111 或相应输入对象。仅从抓包获知主机、端口、服务和拓扑属于 TA0007 Discovery；获取普通正文属于相应 Collection 技术。获授权的 NDR、故障诊断、事件响应、性能分析与依法实施的监测可产生完全相同的命令、镜像和 PCAP，必须以批准主体、工单、范围、过滤器、保留期、输出目的地和业务所有者排除。
        en: >-
          T1111 directly concerns interception of an MFA proof or one-time value, whereas this object requires a network observation position and packet-capture evidence. A network capture that acquires an OTP may carry both labels, but theft at an SMS provider, keylogging, or collection through an imitation page belongs to T1111 or the relevant input technique. Learning hosts, ports, services, and topology from a capture belongs to TA0007 Discovery; obtaining ordinary content belongs to the applicable Collection technique. Authorized NDR, troubleshooting, incident response, performance analysis, and lawful monitoring can produce identical commands, mirrors, and PCAPs and must be excluded through the approved principal, ticket, scope, filter, retention, output destination, and business owner.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在认证服务器或应用端点被攻陷后，攻击者可在处理认证流的主机上建立包套接字或调用捕获库，利用该端点持有的共享秘密或位于加密终止后的观察位置恢复材料。UNC3886 将 LOOKOVER 部署到 TACACS+ 服务器、按 TCP/49 筛选并使用 TKEY 解混淆，说明端点位置能把单纯密文捕获转化为可解释的认证正文。
          en: >-
            After compromising an authentication server or application endpoint, an adversary can create packet sockets or invoke a capture library on the host processing the authentication flow, using a shared secret held by that endpoint or an observation position beyond transport termination to recover material. UNC3886's deployment of LOOKOVER on a TACACS+ server, its TCP/49 filter, and its use of TKEY for de-obfuscation show how an endpoint position can turn packet capture into interpretable authentication content.
        - zh: >-
            在受侵路由器、交换机或云网络控制面上，攻击者可使用已有转发节点的原生抓包功能，或创建 SPAN、RSPAN、ERSPAN 与虚拟网络镜像，把经过关键接口、子网或负载均衡终止区的流复制给收集器。原通信仍到达合法目标，使业务故障和服务端异常保持较低；攻击者随后可在设备闪存、收集实例或远端位置筛选认证材料。
          en: >-
            On a compromised router, switch, or cloud network control plane, an adversary may use native capture on an existing forwarding node or create SPAN, RSPAN, ERSPAN, or virtual-network mirroring that copies flows crossing a critical interface, subnet, or load-balancer termination zone to a collector. Original communications still reach the legitimate target, keeping service disruption and endpoint anomalies low, while the adversary later filters authentication material in device storage, a collector instance, or a remote location.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者需要控制至少一个对目标流量有真实可见性的主机、网络设备、共享介质位置或镜像控制面，并具备相应抓包权限，例如 Linux CAP_NET_RAW、管理员级捕获驱动、网络设备特权 CLI 或创建流量镜像的云 IAM 权限。观察位置必须覆盖认证交换；交换若受强端到端保护，攻击者还需处于终止边界内、控制终止组件、获得共享秘密或利用可恢复的认证设计。只拥有接口名称或抓包工具不会保证看到交换机上其他端口，也不会保证密文可用。
            en: >-
              The adversary needs control of at least one host, network device, shared-medium position, or mirror control plane with real visibility into the target flow, together with the relevant capture authority such as Linux CAP_NET_RAW, an administrator-level capture driver, privileged network-device CLI, or cloud IAM permission to create traffic mirrors. The position must cover the authentication exchange. If the exchange has strong end-to-end protection, the actor must also reside inside the termination boundary, control a terminating component, possess a shared secret, or exploit a recoverable authentication design. An interface name or capture tool alone does not make other switch ports visible and does not make ciphertext usable.
      defender_model:
        paragraphs:
          - zh: >-
              防守方假定可在观察位置附近取得至少一种控制面或主机遥测，并在认证系统侧维护哪些流量可能含何类材料的目录。端点可提供进程、原始包套接字、驱动、接口状态与文件创建；网络设备可提供 AAA 命令记账、抓包对象、缓冲区和文件导出；云平台可提供镜像 create、patch、delete 的 Admin Activity。认证日志通常只能证明正常交换发生，不能证明它是否被复制，因此分析必须把捕获生命周期与同一设备、接口、流和时间的认证材料评估连接起来。
            en: >-
              The defender is assumed to obtain at least one control-plane or host telemetry source near the observation position and maintain an authentication-system inventory describing which flows may carry which material classes. Endpoints may provide process, raw packet socket, driver, interface-state, and file-creation evidence. Network devices may provide AAA command accounting, capture objects, buffers, and file exports. Cloud platforms may provide Admin Activity for mirror create, patch, and delete operations. Authentication logs normally establish that an exchange occurred, not whether it was copied, so analysis must join capture lifecycle to the same device, interface, flow, time, and a credential-material assessment.
          - zh: >-
              防守方不应把原始口令或完整 PCAP广泛送入 SIEM。材料确认可以由受限取证流程输出 artifact hash、协议/材料类别、是否含明文或可恢复证明、加密边界和审查者，而不保存秘密值。NIST SP 800-150 指出 PCAP 可含认证凭据、PII 与敏感组织信息，并建议按会话、时间、端口或协议过滤及去除不相关正文；这一隐私约束同时限制检测覆盖和数据共享方式。
            en: >-
              The defender should not send raw passwords or complete PCAPs broadly into a SIEM. A restricted forensic workflow can emit artifact hash, protocol or material class, whether plaintext or a recoverable proof was present, the encryption boundary, and the reviewer without retaining the secret value. NIST SP 800-150 notes that PCAPs can contain authentication credentials, PII, and sensitive organizational information and recommends filtering by conversation, time, port, or protocol and redacting irrelevant payload. This privacy constraint limits both detection coverage and how evidence can be shared.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 在认证双方之外静默复制既有交换而不产生新的受害端交互
        en: Silently copy an existing exchange outside the authenticating parties without generating a new victim-facing interaction
      analysis:
        paragraphs:
          - zh: >-
              行为设计把读取动作放在包套接字、既有转发设备或复制分支中，原认证流的源、目标和结果可以保持不变。痕迹因而从认证日志和业务路径移到抓包权限、观察面配置及输出产物；如果这些位置没有纳入 EDR、AAA 记账或云审计，关键读取行为不会进入常规告警视野。CISA 对受侵路由器原生 PCAP 与镜像的观察以及 Mandiant 对认证服务器内 LOOKOVER 的分析支持这种跨观察面差异，但不能证明所有网络都缺少相应遥测。
            en: >-
              The behavior places reading in a packet socket, an existing forwarding device, or a copy branch, leaving the original authentication flow's source, destination, and result unchanged. Traces move from authentication logs and the business path into capture authority, observation-plane configuration, and output artifacts. Where EDR, AAA accounting, or cloud audit does not cover those positions, the critical read never enters routine alerting. CISA's observation of native PCAP and mirroring on compromised routers and Mandiant's analysis of LOOKOVER inside an authentication server support this cross-plane difference, but do not establish that every network lacks such telemetry.
      evidence_keys:
        - TMP-TA0006-007-T1040-REF-ATTACK
        - TMP-TA0006-007-T1040-REF-CISA-AA25-239A
        - REF-000179
      confidence: medium
    - mechanism_ref: NM-FD
      role: secondary
      summary:
        zh: 借用原生诊断和监测能力使恶意抓包接近合法运维外观
        en: Borrow native diagnostic and monitoring functions so malicious capture resembles authorized operations
      analysis:
        paragraphs:
          - zh: >-
              攻击者使用 monitor capture、SPAN 或云 Packet Mirroring 等原生能力时，命令、资源类型和输出格式与故障诊断或 NDR 部署相同，并可用窄过滤器和短持续时间降低异常规模。恶意差异存在于主体是否获批、被观察资产、材料类别、收集器目的地和产物处置，而不是工具名称。Cisco 与 Google 官方文档证明这些控制与审计字段可以实施，CISA 事件证明攻击者实际滥用过相同能力；合法运维的高基数使特征相似性成立，但具体告警下降幅度没有公开测量。
            en: >-
              When an adversary uses native functions such as monitor capture, SPAN, or cloud Packet Mirroring, commands, resource types, and output formats match troubleshooting or NDR deployment, and narrow filters with short duration can reduce anomaly size. The malicious difference lies in approval, observed assets, material class, collector destination, and artifact handling rather than the tool name. Cisco and Google documentation establish the available controls and audit fields, while the CISA incident shows adversary abuse of the same capabilities. High volumes of legitimate administration support feature similarity, but no public measurement quantifies alert reduction.
      evidence_keys:
        - TMP-TA0006-007-T1040-REF-CISA-AA25-239A
        - TMP-TA0006-007-T1040-REF-CISCO-EPC
        - TMP-TA0006-007-T1040-REF-GCP-MIRROR-AUDIT
      confidence: medium
  subtechnique_taxonomy:
    proposed_coverage: established
    proposed_child_count: 3
    narrative:
      paragraphs:
        - zh: >-
            建议建立三项 Niji 原生子技术，并以取得观察的位置及新增痕迹拓扑互斥划分。认证端点共驻抓取发生在发送、接收或验证认证交换的主机上，可能位于加密终止内或可直接取得解密秘密；既有转发路径抓取发生在原本就在转发该流量的节点上，不改变原路径也不建立独立复制目标；复制观察面抓取则创建从原流到另一收集器的镜像分支。若同一转发设备把流量镜像到外部收集器，以新增复制分支为主归第三项；仅在本机缓冲原流则归第二项。
          en: >-
            Propose three Niji-native children separated exclusively by acquisition position and newly created trace topology. Authentication-Endpoint Co-resident Capture occurs on a host that sends, receives, or verifies the exchange and may lie inside transport termination or directly hold the recovery secret. Existing-Transit-Path Capture occurs on a node already forwarding the original flow, without changing that path or creating a separate collector destination. Replicated-Observation-Plane Capture creates a mirror branch from the original flow to another collector. When a forwarding device mirrors traffic to an external collector, the new copy branch takes precedence and the event belongs to the third child; buffering the original flow locally on that device belongs to the second.
        - zh: >-
            接口、协议、工具、云或本地位置和产品名称均不定义兄弟项。共享介质上的第三方纯被动接收可能具有独立观察位置，但现有高质量事件证据常与恶意接入点、主动名称响应或未证明的材料结果混合，本批将其保留为 evidence-deferred，不为补齐“被动嗅探”外观而强建第四项。三项正式子技术均要求凭据材料结果；只取得网络事实则转入 Discovery 范围。
          en: >-
            Interfaces, protocols, tools, cloud versus on-premises placement, and product names do not define siblings. A third party listening on a shared medium may represent another observation position, but available high-quality event evidence often mixes it with a rogue access point, active name response, or an unproven material result. This batch keeps that axis evidence-deferred rather than forcing a fourth child to mirror the phrase passive sniffing. Every formal child still requires a credential-material outcome; network facts alone move to Discovery scope.
