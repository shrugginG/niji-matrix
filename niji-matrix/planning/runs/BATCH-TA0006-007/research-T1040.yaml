      resolution: create
      proposition:
        zh: 已在原路径转发认证流的受侵设备可用本地原生抓包保持端点与路径结果不变；其稳定残余是设备命令、抓包对象、缓冲/PCAP 与导出，而非端点 raw socket 或镜像资源。
        en: A compromised device already forwarding an authentication flow can use local native capture while preserving endpoint and path outcomes; its stable residue is device commands, capture objects, buffers or PCAPs, and exports rather than endpoint raw sockets or mirror resources.
      evidence_keys: [TMP-TA0006-007-T1040-REF-CISA-AA25-239A, TMP-TA0006-007-T1040-REF-CISCO-EPC]
      evidence_mode: direct incident and official implementation
    - temporary_key: TMP-TA0006-007-T1040-CLM-REPLICA-AXIS
      resolution: create
      proposition:
        zh: 流量镜像新增到独立收集器的复制边而不替换原路径，因此需要 event-time 镜像资源、collector receipt 和认证流材料的三方关联，形成独立 Niji 子项。
        en: Traffic mirroring adds a copy edge to an independent collector without replacing the original path, requiring a three-way join across event-time mirror resource, collector receipt, and authentication-flow material and thereby supporting an independent Niji child.
      evidence_keys: [TMP-TA0006-007-T1040-REF-CISA-AA25-239A, TMP-TA0006-007-T1040-REF-GCP-MIRROR-AUDIT]
      evidence_mode: observed actor behavior plus official audit capability
    - temporary_key: TMP-TA0006-007-T1040-CLM-PRIVACY
      resolution: create
      proposition:
        zh: PCAP 可同时含认证凭据、PII 和组织敏感信息；T1040 检测应集中处理元数据和材料类别，把原始正文留在受限证据库并对共享副本过滤、脱敏。
        en: PCAP can contain authentication credentials, PII, and sensitive organizational information; T1040 detection should centralize metadata and material class while retaining raw payload in a restricted evidence store and filtering or sanitizing shared copies.
      evidence_keys: [TMP-TA0006-007-T1040-REF-NIST-PCAP-PRIVACY]
      evidence_mode: direct official handling guidance applied to analytic design
  cases:
    - temporary_key: TMP-TA0006-007-T1040-CASE-UNC3886-LOOKOVER
      resolution: create
      name:
        zh: UNC3886 在 TACACS+ 服务器部署 LOOKOVER 嗅探器
        en: UNC3886 Deployment of LOOKOVER on a TACACS+ Server
      actor_or_campaign: UNC3886
      time_range: activity described by Mandiant in 2024 reporting
      target: compromised TACACS+ authentication server
      central_observed_facts:
        zh: Mandiant 恢复了伪装路径下的 LOOKOVER，确认其使用 libpcap 过滤 TACACS+ 认证报文、以 TKEY 解混淆并准备把提取结果写入指定文件；core dump 显示程序在加密提取凭据并写盘时崩溃。
        en: Mandiant recovered LOOKOVER from a disguised path, confirmed libpcap filtering of TACACS+ authentication packets, TKEY-based de-obfuscation, and preparation to write extracted results to a specified file; a core dump showed the program crashing while encrypting extracted credentials for disk output.
      not_established:
        zh: 未证明全部捕获材料成功写盘、具体凭据值、成功登录或后继账户使用；不可与同服务器的后门 tac_plus 二进制替换合并为一个案例。
        en: The source does not establish durable output of all captured material, specific credential values, successful authentication, or successor account use, and this event must not be merged with replacement of the tac_plus binary on the same server.
      evidence_keys: [REF-000179]
      confidence: medium
    - temporary_key: TMP-TA0006-007-T1040-CASE-PRC-ROUTER-PCAP
      resolution: create
      name:
        zh: 国家支持行为者滥用受侵路由器 PCAP 与镜像能力
        en: State-Sponsored Abuse of Compromised-Router PCAP and Mirroring
      actor_or_campaign: PRC state-sponsored actors summarized in AA25-239A
      time_range: activity since at least 2021, advisory published 2025-08-27
      target: enterprise, telecommunications, government, transportation, lodging, and military network infrastructure
      central_observed_facts:
        zh: 联合机构观察到行为者在受侵网络设备上配置原生 PCAP 和 SPAN/RSPAN/ERSPAN，发现 `mycap.pcap`、`tac.pcap` 等产物及协助导出的命令；至少一案的设备配置以可逆 Type 7 形式保存 TACACS+ 共享秘密。
        en: The joint agencies observed actors configuring native PCAP and SPAN, RSPAN, or ERSPAN on compromised network devices and identified artifacts such as `mycap.pcap` and `tac.pcap` plus commands used for export. In at least one case, the device configuration stored a TACACS+ shared secret in reversible Type 7 form.
      not_established:
        zh: 通告将捕获 TACACS+ 和使用恢复秘密离线解密表述为主要目标或可行结果，没有证明每个 PCAP/镜像都含凭据、具体秘密已被解密或账户已被使用。
        en: The advisory describes TACACS+ capture and offline decryption with the recovered secret as a primary objective or feasible result and does not establish that every PCAP or mirror contained credentials, that a particular secret was decrypted, or that an account was used.
      evidence_keys: [TMP-TA0006-007-T1040-REF-CISA-AA25-239A]
      confidence: medium
