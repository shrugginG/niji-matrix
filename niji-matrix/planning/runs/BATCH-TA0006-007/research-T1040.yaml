  reviewed_nonreuse:
    - object_ref: CASE-000065
      resolution: split
      reason: >-
        CASE-000065 records replacement of the TACACS+ daemon and direct application-function credential logging. LOOKOVER is a separate packet-sniffing attempt, with a different executable, data path, artifact, and conclusion level; sharing actor and server does not preserve case identity.
    - object_ref: MIT-000132
      resolution: defer
      reason: >-
        Authentication-audience binding limits cross-destination relay but does not govern passive capture authority or protect plaintext material already visible on the authorized path.
    - object_ref: MIT-000168
      resolution: defer
      reason: >-
        Automatic-authentication destination control addresses induced outbound material. T1040 may observe a fully authorized destination and needs capture-plane privilege, encryption-boundary, and PCAP handling measures.
    - object_ref: DET-000186
      resolution: split
      reason: >-
        DET-000186 starts at an untrusted object's resource reference and induced outbound authentication. T1040 starts at an observation surface over an already occurring flow and requires capture lifecycle and material-artifact data.
