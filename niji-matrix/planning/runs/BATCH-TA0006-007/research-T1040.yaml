      resolution: defer
      reason: Boundary prose with NJT-0136, NJT-0165, T1111, and TA0007 is sufficient unless the primary agent confirms a canonical relationship type and a matrix-wide need for an explicit edge.
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
      - passive interface capture
      - promiscuous shared-medium observation
      - SPAN and traffic mirroring
      - cloud mirror services
      - native network-device capture
      - credential and discovery outcomes
    breadth_trigger: ordinary
    coverage_resolutions:
      - source_cluster: endpoint packet interface and local capture utility
        resolution: niji-variable-candidate
        result: TMP-TA0006-007-T1040-CHILD-ENDPOINT
        reason: Authentication-role co-residence changes material visibility, host residue, and defense requirements independently of tool or OS.
      - source_cluster: network-device native capture on an existing forwarding path
        resolution: niji-variable-candidate
        result: TMP-TA0006-007-T1040-CHILD-TRANSIT
        reason: Original-path device-local buffering preserves endpoint view and creates command, buffer, file, and export traces.
      - source_cluster: SPAN, RSPAN, ERSPAN, and virtual network mirroring
        resolution: niji-variable-candidate
        result: TMP-TA0006-007-T1040-CHILD-REPLICA
        reason: A separate copy edge and collector require control-plane lifecycle plus collector-receipt correlation.
      - source_cluster: shared-medium third-party passive observation
        resolution: evidence-deferred
        reason: Available high-quality event sources do not isolate successful credential-material capture from rogue-access, active poisoning, or capability-only evidence strongly enough for a formal sibling.
      - source_cluster: network metadata and topology learned from capture
        resolution: adjacent-technique
        reason: Discovery-only result belongs to the TA0007 T1040 candidate and cannot establish TA0006 Credential Access.
      - source_cluster: active redirection, relay, or induced authentication
        resolution: adjacent-technique
        reason: Path change belongs to NJT-0136 and induced emission belongs to NJT-0165; passive capture may co-occur but needs independent evidence.
    candidate_stealth_axes_examined:
      - axis: observation position relative to authentication endpoint and crypto termination
        result: formal
        children: [TMP-TA0006-007-T1040-CHILD-ENDPOINT, TMP-TA0006-007-T1040-CHILD-TRANSIT]
      - axis: original-flow versus replicated-flow trace topology
        result: formal
        children: [TMP-TA0006-007-T1040-CHILD-TRANSIT, TMP-TA0006-007-T1040-CHILD-REPLICA]
      - axis: visible plaintext, recoverable proof, and undecryptable ciphertext
        result: parent-admission-gate
        reason: Material visibility determines whether Credential Access completes but can vary within every observation position, so it is not a sibling partition.
      - axis: tool, interface, protocol, cloud/on-premises, product, or vendor
        result: rejected
        reason: These are implementations without stable independent trace topology.
      - axis: capture timing or filter narrowness
        result: parent-characteristic
        reason: Short duration and narrow filters can increase stealth but evidence does not establish a stable sibling with unique defense across positions.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        ATT&CK 无子项不降低开放 taxonomy 搜索责任。本轮从父描述与一手事件分别检查端点、既有转发、复制分支、共享介质、加密材料和主动路径变化；前三项通过稳定变量、痕迹和防守差门槛，共享介质因事件证据混杂暂缓，材料可见性作为全部子项的 TA0006 结果门槛而非第四子项。
      en: >-
        ATT&CK's lack of children does not reduce the open taxonomy search obligation. This pass separately examined endpoint, existing transit, copy branch, shared medium, encrypted material, and active path change using parent text and first-party incidents. The first three pass stable-variable, trace, and defense-difference gates. Shared-medium evidence remains mixed and deferred, while material visibility is the TA0006 outcome gate across all children rather than a fourth child.
  evidence_coverage:
    parent_behavior_keys:
      - TMP-TA0006-007-T1040-REF-ATTACK
      - TMP-TA0006-007-T1040-REF-APT33-SNIFFPASS
      - TMP-TA0006-007-T1040-REF-CISA-AA25-239A
      - REF-000179
    boundary_keys:
      - TMP-TA0006-007-T1040-REF-ATTACK
      - TMP-TA0006-007-T1040-REF-RFC8907
      - TMP-TA0006-007-T1040-REF-NIST-PCAP-PRIVACY
    mechanism_support:
      - mechanism_ref: NM-BT
        evidence_keys: [TMP-TA0006-007-T1040-REF-ATTACK, TMP-TA0006-007-T1040-REF-CISA-AA25-239A, REF-000179]
        confidence: medium
      - mechanism_ref: NM-FD
        evidence_keys: [TMP-TA0006-007-T1040-REF-CISA-AA25-239A, TMP-TA0006-007-T1040-REF-CISCO-EPC, TMP-TA0006-007-T1040-REF-GCP-MIRROR-AUDIT]
        confidence: medium
    child_existence_support:
      - child_key: TMP-TA0006-007-T1040-CHILD-ENDPOINT
        evidence_keys: [REF-000179, TMP-TA0006-007-T1040-REF-LINUX-PACKET, TMP-TA0006-007-T1040-REF-MS-PKTMON]
      - child_key: TMP-TA0006-007-T1040-CHILD-TRANSIT
        evidence_keys: [TMP-TA0006-007-T1040-REF-CISA-AA25-239A, TMP-TA0006-007-T1040-REF-CISCO-EPC]
      - child_key: TMP-TA0006-007-T1040-CHILD-REPLICA
        evidence_keys: [TMP-TA0006-007-T1040-REF-CISA-AA25-239A, TMP-TA0006-007-T1040-REF-GCP-MIRROR-AUDIT]
    unsupported_or_deferred:
      - successful_use_of_credentials_from_every_cited_capture
      - exact_credentials_recovered_from_CISA_router_PCAPPs
      - every_SPAN_or_cloud_mirror_contained_authentication_material
      - shared_medium_passive_capture_as_a_formal_child
      - quantitative_alert_reduction_from_short_or_narrow_capture
      - encrypted_wire_traffic_equals_protected_material_at_a_compromised_terminator
  evidence_stage_review:
    - source_key: TMP-TA0006-007-T1040-REF-ATTACK
      direct: fixed-baseline behavior, tactic mappings, implementation breadth, no ATT&CK children
      inference_limit: no automatic Niji taxonomy or case outcome
    - source_key: REF-000179
      direct: LOOKOVER deployment, libpcap filtering, TKEY use, protocol processing, output path, crash evidence
      inference_limit: no proof that every credential was durably written or later used
    - source_key: TMP-TA0006-007-T1040-REF-CISA-AA25-239A
      direct: actor capture and mirror behavior, observed commands and filenames, one reversibly stored TACACS+ secret
      inference_limit: intended credential target and offline recovery do not prove every captured credential or successor authentication
    - source_key: TMP-TA0006-007-T1040-REF-GCP-MIRROR-AUDIT
      direct: mirror lifecycle operations, audit type, method names, and permissions
      inference_limit: no malicious event or guarantee that exported logs retain every resource field
    - source_key: TMP-TA0006-007-T1040-REF-NIST-PCAP-PRIVACY
      direct: PCAP sensitivity and sanitization guidance
      inference_limit: no malicious-detection threshold
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级研究稿分别承担行为和 Credential Access 结果定义、无交互与原生运维相似性的匿迹特性、相邻技术和合法监控边界、场景、攻击者能力、可见遥测与隐私限制。三个子项均给出准确名称起始的匿迹特性、位置变量、残余痕迹、前提、独立检测数据与限制；没有按接口、协议、工具、平台或产品复制 ATT&CK 实现。
      en: >-
        The parent research separately covers behavior and Credential Access outcome, the stealth properties of no victim-facing exchange and native-operation similarity, adjacent and lawful-monitoring boundaries, scenarios, attacker capability, defender telemetry, and privacy limits. Each child has exact-name-led stealth prose, a position variable, residual traces, prerequisites, distinct detection data, and limitations. None copies ATT&CK implementations by interface, protocol, tool, platform, or product.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - YAML parsing
      - recursive key inspection
      - temporary-key referential audit
  limitations:
    paragraphs:
      - zh: >-
          证据层级不对称。CISA 联合通告对路由器抓包、文件名、命令和镜像行为具有直接观察，但对具体 TACACS+ 材料的成功解密多为“主要目标”“可实现”或“可能包含”的分析；Mandiant 对 LOOKOVER 的代码与运行残留分析很强，却记录了写出阶段崩溃。APT33 来源证明 SniffPass 被行为者采用并以窃取口令为设计目标，但缺少具体观察位置、会话与后继使用。正式对象必须保留 deployment、capture、material-present、recoverable 和 used 五个证据阶段，不能用工具功能补齐缺失阶段。
        en: >-
          Evidence levels are asymmetric. The joint CISA advisory directly observes router capture, filenames, commands, and mirroring, but frames successful decryption of particular TACACS+ material as a primary objective, feasibility, or possible content. Mandiant provides strong code and runtime-residue analysis of LOOKOVER but records a crash during output. The APT33 source establishes actor adoption of SniffPass and its password-theft purpose but lacks a specific observation position, session, and successor use. Formal content must preserve deployment, capture, material-present, recoverable, and used as five separate evidence stages rather than filling gaps from tool capability.
      - zh: >-
          检测字段跨平台差异明显。Linux packet(7) 证明 CAP_NET_RAW、AF_PACKET、interface index 与 promiscuous membership 的能力，不保证系统默认审计这些字段；Windows Pktmon 证明原生捕获、ETL 与 pcapng 产物，不保证每次 API 调用可归因；网络设备和云平台也可能缺少完整 request body。Analytic 部署前必须用良性抓包实验验证字段，并在不能取得 artifact 或材料评估时把结论降为观察面风险。
        en: >-
          Detection fields differ substantially across platforms. Linux packet(7) establishes CAP_NET_RAW, AF_PACKET, interface index, and promiscuous membership capability but not default auditing of those fields. Windows Pktmon establishes native capture plus ETL and pcapng artifacts but not attribution for every API call. Network devices and cloud platforms may also omit complete request bodies. Before deployment, benign capture tests must validate fields, and findings without artifact or material assessment must remain observation-surface risk.
      - zh: >-
          凭据检测本身会扩大敏感数据处理面。为了证明材料结果而广泛解码或集中完整 PCAP，会重新制造本技术所利用的风险；受限取证、最少字段、短保留、去标识化与访问审计是分析前提。隐私限制可能使组织只能高置信检测未授权抓包而不能自动确认具体秘密，此时不得用推断替代证据。
        en: >-
          Credential detection itself can enlarge the sensitive-data surface. Broad decoding or centralization of full PCAP to prove material outcome recreates the risk this technique exploits. Restricted forensics, minimum fields, short retention, de-identification, and access audit are analytic prerequisites. Privacy constraints may let an organization detect unauthorized capture with high confidence without automatically confirming a specific secret; inference must not replace evidence in that case.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: 网络加密或攻击者对 PCAP 的后续封装会影响内容可解释性，但它们不是本候选被动观察行为本身的稳定匿迹因果；若记录应由相应保护退化、数据遮蔽或后续处理对象承担。
        en: Network encryption or adversary packaging of a PCAP affects content interpretability but is not the stable stealth causality of passive observation itself; applicable protection-impairment, data-obscuration, or follow-on handling objects should own it.
    - mechanism_ref: NM-ST
      reason:
        zh: 短时或窄过滤抓包可能降低局部信号，但现有事件没有证明时间/空间稀释是跨位置稳定变量或量化告警下降；本批把它保留为父级特性。
        en: Short-lived or narrow-filter capture may reduce local signal, but available incidents do not establish temporal or spatial dilution as a stable cross-position variable or quantify alert reduction; it remains a parent characteristic.
  open_questions:
    - 是否能取得一个高质量在野来源，直接证明共享介质第三方在未改变路径、未充当恶意接入点的情况下捕获并恢复了凭据材料？
    - CISA AA25-239A 背后的个案是否能公开确认某个 `tac.pcap` 的材料存在、共享秘密恢复和后继认证三阶段？
    - 主 Agent 是否将 endpoint-local packet capture 与 NJT-0169/NJS-0093-003 的应用内秘密旁路复制按数据来源严格拆分，并对同一进程双重行为允许并列标注？
    - 现有共享缓解对象是否会在后续批次形成通用“网络设备原生敏感功能治理”，从而使本批 MIT 候选需要 split 或 extend，而不是独立创建？
