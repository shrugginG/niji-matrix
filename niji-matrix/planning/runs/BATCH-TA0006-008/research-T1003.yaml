      mapped_keys: [TA0006-008-T1003-CHILD-READER]
      note_zh: 可信 reader 转用形成正式变量；普通外部 reader 属父级核心，LSASS 名称不成为子项。
      note_en: Trusted-reader repurposing forms the variable; an ordinary external reader remains parent core and LSASS name is not a child.
    - attack_id: T1003.002
      material_location: SAM with SYSTEM or boot-key dependencies
      protection_surface: hive ACL, file lock, registry and storage authority
      reading_subject: local privileged reader, backup component or offline parser
      state: live-store-or-inactive-copy
      unlock_or_parse: paired SYSTEM data and SAM format parsing
      audit_surface: registry or file object access, copy control plane and output
      result_gate: identifiable local-account password material
      resolution: parent-core-and-niji-variable-candidate
      mapped_keys: [TA0006-008-T1003-CHILD-INACTIVE, TA0006-008-T1003-CHILD-READER]
      note_zh: 活动 hive 读取属父级；副本视图和受信 reader 分别按观察变量进入子项。
      note_en: Live-hive read is parent core; copy view and trusted reader enter children only by their observation variables.
    - attack_id: T1003.003
      material_location: Active Directory database plus SYSTEM or domain key dependencies
      protection_surface: DC file lock, database ACL, backup or volume authority and directory service
      reading_subject: local DC reader, backup reader, raw-view reader or directory replication client
      state: live-store-inactive-copy-or-authoritative-service
      unlock_or_parse: database and boot-key parsing or server-side replication response
      audit_surface: file/process, storage copy, or DRS control plane
      result_gate: identifiable domain password, key or history material
      resolution: niji-variable-candidate
      mapped_keys: [TA0006-008-T1003-CHILD-INACTIVE, TA0006-008-T1003-CHILD-REPLICATION, TA0006-008-T1003-CHILD-READER]
      note_zh: 一个实现簇可贡献多个独立 Niji 变量，但 NTDS 本身不被复制成子项。
      note_en: One implementation cluster can inform several independent Niji variables, while NTDS itself is not copied as a child.
    - attack_id: T1003.004
      material_location: LSA protected secrets in SECURITY or runtime state with SYSTEM dependency
      protection_surface: LSA policy authority, hive ACL, process protection and cryptographic dependencies
      reading_subject: local privileged reader, trusted security context or offline parser
      state: live-runtime-live-store-or-inactive-copy
      unlock_or_parse: SYSTEM and SECURITY pairing or runtime parsing
      audit_surface: process/object access, reader provenance, copy control plane and output
      result_gate: identifiable service, machine, DPAPI or other LSA-maintained authentication material
      resolution: parent-core-and-niji-variable-candidate
      mapped_keys: [TA0006-008-T1003-CHILD-READER, TA0006-008-T1003-CHILD-INACTIVE]
      note_zh: 材料类别保持父级，reader 或 view 变化才形成子项。
      note_en: Material class remains parent core; a reader or view change forms a child.
    - attack_id: T1003.005
      material_location: cached domain logon verifier material in protected local security state
      protection_surface: hive ACL, SYSTEM dependency and local administrative authority
      reading_subject: privileged local reader, trusted reader or offline parser
      state: live-store-or-inactive-copy
      unlock_or_parse: cache format and paired key material
      audit_surface: object read, copy view, output and later offline testing
      result_gate: identifiable cached-domain verifier records
      resolution: parent-core-and-niji-variable-candidate
      mapped_keys: [TA0006-008-T1003-CHILD-READER, TA0006-008-T1003-CHILD-INACTIVE]
      note_zh: 后继候选测试归 NJS-0137-003，不按缓存格式建子项。
      note_en: Later candidate testing belongs to NJS-0137-003 and cache format does not define a child.
    - attack_id: T1003.006
      material_location: authoritative directory-service replication response
      protection_surface: DRS authentication, domain replication extended rights and network reachability
      reading_subject: remote replication client represented by caller account and source host
      state: live-authoritative-service
      unlock_or_parse: server-side access check and response parsing; no local database unlock required
      audit_surface: RPC or DRS, directory access, MDI, rights history and caller output
      result_gate: successful secret-bearing response and preserved account material
      resolution: niji-variable-candidate
      mapped_keys: [TA0006-008-T1003-CHILD-REPLICATION]
      note_zh: 复制控制面和本地数据库读取不可互换，形成正式子项；DCSync 名称只作实现证据。
      note_en: Replication control plane and local database read are non-interchangeable and form a child; DCSync name is implementation evidence only.
    - attack_id: T1003.007
      material_location: Linux process runtime exposed through procfs or related process-read interfaces
      protection_surface: UID, ptrace mode, CAP_SYS_PTRACE, procfs mount and LSM policy
      reading_subject: root or capable process, debugger, diagnostic or injected trusted process
      state: live-runtime
      unlock_or_parse: target-specific environment, memory or map interpretation
      audit_surface: syscall or audit, ptrace, target PID, reader provenance and output
      result_gate: identifiable authentication secret from a target process
      resolution: parent-core-and-niji-variable-candidate
      mapped_keys: [TA0006-008-T1003-CHILD-READER]
      note_zh: procfs 是接口而非子项；可信 reader 变量可跨 Windows 与 Linux。
      note_en: Procfs is an interface rather than a child; trusted-reader provenance can cross Windows and Linux.
    - attack_id: T1003.008
      material_location: /etc/passwd and protected /etc/shadow account verification records
      protection_surface: file ownership, mode, root or capability, MAC and filesystem or backup authority
      reading_subject: direct privileged process, trusted maintenance reader or offline copy reader
      state: live-file-or-inactive-copy
      unlock_or_parse: shadow format parsing; password recovery remains a later candidate test
      audit_surface: file syscall/audit, copy control plane, output and egress
      result_gate: copied account records containing password verifiers or equivalent system authentication material
      resolution: parent-core-and-niji-variable-candidate
      mapped_keys: [TA0006-008-T1003-CHILD-INACTIVE, TA0006-008-T1003-CHILD-READER]
      note_zh: 活动 shadow 直接读取属于父级，非活动副本或受信 reader 按各自变量进入子项。
      note_en: Direct live-shadow reading is parent core, while inactive copy or trusted reader enters its respective variable child.
    candidate_stealth_axes_examined:
    - axis: trusted_reader_provenance_repurposing
      disposition: formal
      why_zh: 攻击者可控 reader 选择改变进程/动作特征和检测数据，需要注入/完整性/output contract，DueDLLigence 直接支持。
      why_en: Attacker-controlled reader selection changes process and action features and detection data, requiring injection or integrity plus output contract, directly supported by DueDLLigence.
    - axis: inactive_storage_view_displacement
      disposition: formal
      why_zh: 读取离开活动对象审计，需 storage copy 和 object mapping，CASE-000141 直接支持并与 NJT-0108 介质层并列。
      why_en: Reading leaves live-object audit and requires storage-copy and object mapping, directly supported by CASE-000141 and coexisting with NJT-0108 at the medium layer.
    - axis: authoritative_directory_replication_export
      disposition: formal
      why_zh: 服务端权威响应替代本地读取，caller/host/rights/naming context 与文件传感器完全不同，协议规范和直接实验支持。
      why_en: Authoritative server response replaces local reading, with caller, host, rights, naming context, and sensors distinct from file access and supported by protocol specification and direct experiment.
    - axis: runtime_versus_static_location
      disposition: parent-core
      why_zh: 位置改变数据源但没有独立攻击者匿迹变量；运行态和静态对象均可被直接读取、reader 转用或副本迁移。
      why_en: Location changes data source without an independent attacker stealth variable; runtime and static objects can each be read directly, reader-repurposed, or copy-displaced.
    - axis: material_type_or_platform
      disposition: rejected
      why_zh: LSASS、SAM、NTDS、LSA、cache、proc、passwd/shadow 和 Windows/Linux 是材料或平台实现，不是稳定匿迹边界。
      why_en: LSASS, SAM, NTDS, LSA, cache, proc, passwd or shadow, and Windows or Linux are material or platform implementations rather than stable stealth boundaries.
    - axis: low_volume_or_selective_account_scope
      disposition: evidence-deferred
      why_zh: 工具可选单账户或小范围输出，但本批没有一手事件证明攻击者为规避阈值而稳定控制范围并产生不可互换防御。
      why_en: Tools can select one account or a narrow output scope, but this batch lacks a primary incident establishing stable attacker control for threshold evasion and non-interchangeable defense.
    - axis: encryption_or_obfuscation_of_dump
      disposition: adjacent-or-postprocessing
      why_zh: 提取后压缩、加密或编码属于后继数据处理；保护材料本身的加密是防守属性，均不构成本候选子项。
      why_en: Compression, encryption, or encoding after extraction is successor data handling, while encryption protecting the material is a defender property; neither forms a child here.
    - axis: offline_unlock_or_candidate_testing
      disposition: adjacent-technique
      why_zh: 数据库解析与必要依赖恢复可属于完成材料输出，未知口令的反复候选比较归 NJS-0137-003，不能合并。
      why_en: Database parsing and recovery of required dependencies can complete material output, while repeated candidate comparison for an unknown password belongs to NJS-0137-003 and cannot be merged.
    second_pass_required: true
    second_pass_completed: true
    second_pass_method:
      zh: >-
        第一轮逐项记录八个固定子项的材料位置、保护面、读取主体、活动/副本/服务状态、解锁依赖、审计面和结果门槛。第二轮完全移除 ATT&CK 名称，从 reader provenance、storage view、authoritative exporter、状态、范围、输出处理和验证位置重新聚类，并对每轴测试攻击者控制、反事实痕迹、防守观察差、跨实现稳定性、直接证据和独立控制。三项通过；位置、材料、平台、低量、输出加密和离线猜测分别收敛到父级、defer 或邻接技术。
      en: >-
        Pass one recorded material location, protection surface, reader, live, copy, or service state, unlock dependencies, audit plane, and result gate for all eight fixed children. Pass two removed ATT&CK names entirely and reclustered by reader provenance, storage view, authoritative exporter, state, scope, output handling, and validation location, testing attacker control, counterfactual trace, defender observation difference, cross-implementation stability, direct evidence, and independent control for each axis. Three passed. Location, material, platform, low volume, output encryption, and offline guessing converged to parent core, defer, or adjacent techniques.
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        八项实现收敛为三项 Niji 变量不是机械合并：同一 ATT&CK 子项可按 reader、view 或 exporter 贡献多个观察变量，多个平台位置也可共享一项变量。普通活动对象读取保留父级；若将 LSASS、SAM、NTDS、DCSync、proc 或 shadow 翻译为 NJS 将违反 taxonomy。第二轮已解释五项数量差，主 Agent 仍应复核 T1111/T1555/T1552 与 T1056/T1556 的最终跨技术边界。
      en: >-
        Eight implementations converge to three Niji variables without mechanical merging. One ATT&CK child can contribute reader, view, or exporter observation variables, while several platform locations can share one variable. Ordinary live-object reading remains parent core. Translating LSASS, SAM, NTDS, DCSync, proc, or shadow into NJS would violate taxonomy. The second pass explains the five-item numerical gap, while the primary agent should still review final boundaries with T1111, T1555, T1552, T1056, and T1556.
  evidence_coverage:
    parent_behavior_keys: [TA0006-008-T1003-REF-ATTACK, TA0006-008-T1003-REF-MS-CREDENTIAL-GUARD, TA0006-008-T1003-REF-LINUX-PROC, TA0006-008-T1003-REF-LINUX-SHADOW, REF-000025, REF-000749]
    boundary_keys: [REF-000025, CLM-000588, CLM-000704, REF-000367, TA0006-008-T1003-REF-MS-DRS-METHOD, MIT-000134]
    mechanism_support:
    - mechanism: NM-BT
      keys: [REF-000025, CLM-000588, TA0006-008-T1003-REF-LINUX-PROC, TA0006-008-T1003-REF-MS-DRS-METHOD]
      limit: Observation-plane changes are direct or protocol-grounded; exact sensor loss requires deployment validation
    - mechanism: NM-FD
      keys: [REF-000367, CASE-000134, REF-000749, TA0006-008-T1003-REF-DCSYNC-EXPERIMENT, REF-000750]
      limit: Reader role and authorized replication appearance are directly supported; field prevalence and universal detector degradation are not measured
    child_existence_support:
    - child_key: TA0006-008-T1003-CHILD-READER
      keys: [REF-000367, CASE-000134, REF-000366]
      status: direct-controlled-observation-with-field-prevalence-limit
    - child_key: TA0006-008-T1003-CHILD-INACTIVE
      keys: [REF-000025, CASE-000141, CLM-000588, CLM-000704]
      status: directly-observed-field-case
    - child_key: TA0006-008-T1003-CHILD-REPLICATION
      keys: [REF-000749, REF-000750, TA0006-008-T1003-REF-MS-DRS-METHOD, TA0006-008-T1003-REF-DCSYNC-EXPERIMENT]
      status: protocol-and-controlled-experiment-no-complete-field-case
    unsupported_or_deferred:
    - zh: >-
        ProcessAccess、ptrace、文件打开、snapshot 或 DRS 连接均不单独证明认证材料已复制或解析。
      en: >-
        ProcessAccess, ptrace, file open, snapshot, or DRS connectivity alone does not prove authentication material was copied or parsed.
    - zh: >-
        复制 NTDS、SAM、SECURITY 或 shadow 不自动证明依赖齐备、所有账户可恢复或后继破解成功。
      en: >-
        Copying NTDS, SAM, SECURITY, or shadow does not automatically prove dependencies are complete, every account is recoverable, or later cracking succeeded.
    - zh: >-
        DCSync 子项缺少公开在野事件的完整 caller—secret response—output—use 链，不能把官方 alert 或实验冒充现场闭环。
      en: >-
        The DCSync child lacks a public in-the-wild caller-to-secret-response-to-output-to-use chain and cannot present an official alert or experiment as a field-closed case.
    - zh: >-
        低量单账户导出、跨主机分批读取和 dump 加密可能影响检测，但缺少稳定控制变量与结论级直接证据，暂不 formalize。
      en: >-
        Low-volume single-account export, cross-host staged reading, and dump encryption can affect detection but lack a stable controlled variable and conclusion-level direct evidence and remain deferred.
    - zh: >-
        Credential Guard、PPL、hidepid 和 shadow 权限不会保护所有材料，也不能从控制已启用推断提取失败。
      en: >-
        Credential Guard, PPL, hidepid, and shadow permissions do not protect every material class, and enabled control does not prove extraction failed.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父稿覆盖材料定义、结果门槛、合法反例、相邻技术、端点/域/Linux 场景、攻击与防守前提及两项机理。三项子稿分别给出 reader、view 与 exporter 变量、反事实痕迹、证据、边界和独立防御。八项固定子技术逐项记录七类覆盖字段，并完成第二轮去名重聚类；检测给出实际字段、30m、15m/30m、复制 cycle/5m/90d 窗口、维度、误报、盲区、调优和分级恢复。
      en: >-
        The parent covers material definition, result gate, legitimate counterexamples, adjacent techniques, endpoint, domain, and Linux scenarios, attacker and defender assumptions, and two mechanisms. The three child drafts separately define reader, view, and exporter variables, counterfactual traces, evidence, boundaries, and distinct defense. Every fixed child records seven coverage dimensions followed by a name-free second-pass reclustering. Detection includes actual fields, thirty-minute, fifteen and thirty-minute, and replication-cycle, five-minute, and ninety-day windows, dimensions, false positives, blind spots, tuning, and graded recovery.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization, exact-URL and canonical-ID duplicate checks, recursive bilingual and paragraph audit, temporary-key resolution, and line-hygiene checks only
  limitations:
    paragraphs:
    - zh: >-
        证据层级不均。Volt Typhoon 公告提供在野副本—对象—外传—离线目的链；DueDLLigence 提供受控 reader 观察实验；DCSync 由协议规范、直接实验和官方检测语义支持，但缺少公开现场完整链；Linux proc 与 shadow 主要为接口和格式文档。不能把跨来源阶段拼成一个事件，也不能从工具能力推断实际材料范围。父行为置信度高，DCSync 现场案例置信度低于能力置信度。
      en: >-
        Evidence levels differ. The Volt Typhoon advisory provides a field copy-to-object-to-exfiltration-to-offline-purpose chain. DueDLLigence provides a controlled reader-observation study. DCSync has protocol, direct experimental, and official detection support but lacks a complete public field chain. Linux proc and shadow evidence primarily documents interface and format. Stages from different sources cannot be spliced into one event, and tool capability cannot establish actual material scope. Parent behavior confidence is high, while DCSync field-case confidence remains below capability confidence.
    - zh: >-
        端点、Linux audit、块/副本、DRS 和内容解析字段不会在多数环境同时存在。原始凭据材料本身不应进入集中日志，内容确认需要隔离取证和安全摘要。合法安全、备份、域复制与恢复活动同形，准确性依赖版本化 reader、copy、replicator 与审批清单。材料外流后不可召回，恢复必须验证轮换传播、旧 session/ticket 拒绝及攻击者写权已清除。
      en: >-
        Endpoint, Linux audit, block or copy, DRS, and content-parsing fields rarely coexist by default. Raw credential material should never enter centralized logs; content confirmation needs isolated forensics and safe digests. Legitimate security, backup, domain replication, and recovery look similar, making versioned reader, copy, replicator, and approval inventories essential. Exfiltrated material cannot be recalled, and recovery must verify rotation propagation, rejection of old sessions or tickets, and removal of adversary write authority.
  rejected_mechanisms:
  - mechanism: NM-DO
    reason_zh: OS 对材料的加密、散列或隔离是防守属性，攻击者在提取行为中没有据此主动改变数据可解释性；后继 dump 加密属于相邻输出处理。
    reason_en: Encryption, hashing, or isolation of OS material is a defender property and does not mean the adversary changes interpretability during extraction; later dump encryption is adjacent output handling.
  - mechanism: NM-ST
    reason_zh: 本批没有一手证据证明真实 T1003 操作者通过低频、跨主机或时间展延把读取稳定稀释到阈值以下；这些轴保持 deferred。
    reason_en: This batch lacks primary evidence that real T1003 operators stably dilute reads below thresholds through low rate, cross-host distribution, or temporal spreading, so those axes remain deferred.
  open_questions:
  - zh: >-
        主 Agent 应裁定 REF-000750 的标题和 locator 是否扩展到同一官方页面中的 DCSync alert，避免重复 URL；若不适合，应只把它作为 detection-page 边界证据并另找不同规范来源。
    en: >-
        The primary agent should decide whether REF-000750 title and locator can be extended to the DCSync alert on the same official page, avoiding a duplicate URL. If unsuitable, use it only as detection-page boundary evidence and seek a distinct canonical source.
  - zh: >-
        主 Agent 应与 T1111 研究确认从 OS 运行态取得 OTP、票据或 MFA 证明时的直接对象；只有证明是 MFA factor/proof 的截获才并列 T1111，普通密码散列或票据密钥保持 T1003/T1558 边界。
    en: >-
        The primary agent should converge with T1111 research when OS runtime output contains OTP, ticket, or MFA proof. T1111 coexists only when interception of an MFA factor or proof is established, while ordinary password hashes or ticket keys retain T1003 or T1558 boundaries.
  - zh: >-
        若主 Agent 找到公开在野 DCSync 事件的 caller、secret response、output 和后继使用，应建立独立 case；否则保持受控实验并在正式研究限制中明确现场缺口。
    en: >-
        If the primary agent finds a public DCSync field incident with caller, secret response, output, and later use, create a separate case. Otherwise retain the controlled experiment and state the field gap in formal limitations.
integration:
  status: review
  resolutions:
  - eight ATT&CK implementations covered and second-pass native taxonomy completed
  - three canonical NJS integrated with shared view and recovery objects
  - IDs synchronized and quality, bundle, and Web gates passed
