    limit: Protection semantics and deployment guidance rather than evidence that a particular read returned credentials
  - temporary_key: TA0006-008-T1003-REF-MS-CREDENTIAL-GUARD
    resolution: create
    url: https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/how-it-works
