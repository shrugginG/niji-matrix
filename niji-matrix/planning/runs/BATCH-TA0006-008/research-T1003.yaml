    locator: Security-breach forest recovery, administrative and user credential reset planning, gMSA replacement, replication validation, DC account and krbtgt reset sequence
    limit: Full forest-recovery guidance must be adapted to incident scope and tested; extraction evidence alone does not always require full forest rebuild
  claims:
  - temporary_key: TA0006-008-T1003-CLM-STAGES
    resolution: create
    proposition_zh: OS 凭据提取的权限、对象打开、读取、材料复制、解锁或解析、输出保存与后继使用是不同证据阶段，任何前态都不能自动证明可用秘密已获。
    proposition_en: Authority, object open, read, material copy, unlock or parsing, output preservation, and later use in OS credential extraction are distinct evidence stages, and no precursor automatically proves a usable secret was obtained.
    evidence_keys: [TA0006-008-T1003-REF-ATTACK, REF-000366, REF-000379, TA0006-008-T1003-REF-MS-DRS-METHOD, REF-000025]
  - temporary_key: TA0006-008-T1003-CLM-PARENT
    resolution: create
    proposition_zh: 运行态、系统账户存储和目录复制响应只有在实际输出操作系统认证材料时共同归入父技术，位置和平台本身不构成子项。
    proposition_en: Runtime state, system account stores, and directory replication responses share the parent only when they actually output operating-system authentication material; location and platform do not themselves define children.
    evidence_keys: [TA0006-008-T1003-REF-ATTACK, TA0006-008-T1003-REF-MS-CREDENTIAL-GUARD, TA0006-008-T1003-REF-LINUX-SHADOW, REF-000749]
  - temporary_key: TA0006-008-T1003-CLM-READER
    resolution: create
    proposition_zh: 把提取逻辑迁入正常会访问认证目标的 reader 可保留预期进程—动作外观，并把异常转移到代码来源与输出，因此需要 reader-target-output 谱系而非 image 白名单。
    proposition_en: Moving extraction logic into a reader normally expected to access the authentication target preserves expected process-action appearance and moves anomalies to code provenance and output, requiring reader-target-output lineage rather than image allowlisting.
    evidence_keys: [REF-000367, CASE-000134, REF-000366]
  - temporary_key: TA0006-008-T1003-CLM-INACTIVE
    resolution: create
    proposition_zh: 从底层派生非活动视图复制认证存储可使活动对象缺少同等读取，但必须连接 copy、对象、依赖和材料结果，后继离线破解另行判断。
    proposition_en: Copying an authentication store from an underlying inactive view can leave the live object without an equivalent read, but copy, object, dependencies, and material outcome must be joined and later offline cracking assessed separately.
    evidence_keys: [REF-000025, CASE-000141, CLM-000588, CLM-000704]
  - temporary_key: TA0006-008-T1003-CLM-REPLICATION
    resolution: create
    proposition_zh: 具有适当复制权限的非 DC caller 可用 GetNCChanges 让权威域控返回账户秘密而不读取 DC 上的 NTDS 文件，检测应比较 caller/host 与批准复制关系和响应范围。
    proposition_en: A non-DC caller with appropriate replication rights can use GetNCChanges to make an authoritative domain controller return account secrets without reading NTDS on the DC, so detection compares caller or host to approved replication relationships and response scope.
    evidence_keys: [REF-000749, TA0006-008-T1003-REF-MS-DRS-METHOD, TA0006-008-T1003-REF-DCSYNC-EXPERIMENT, REF-000750]
  - temporary_key: TA0006-008-T1003-CLM-RECOVERY
    resolution: create
    proposition_zh: 提取后响应必须按材料类型与账户范围轮换秘密和撤销会话；广泛 NTDS 或 krbtgt 暴露需要在可信复制状态下执行域级恢复，而不能只重置一个账户。
    proposition_en: Post-extraction response must rotate secrets and revoke sessions according to material class and account scope; broad NTDS or krbtgt exposure requires domain-level recovery from trusted replication state rather than one account reset.
    evidence_keys: [REF-000025, MIT-000134, TA0006-008-T1003-REF-MS-FOREST-RECOVERY]
  cases:
  - temporary_key: TA0006-008-T1003-CASE-DCSYNC-CONTROLLED
    resolution: create
    event: Sean Metcalf's controlled DCSync experiment used a replication-authorized account from a non-DC context to invoke GetNCChanges and retrieve current and historical account password material without copying NTDS.dit
    evidence_keys: [TA0006-008-T1003-REF-DCSYNC-EXPERIMENT, TA0006-008-T1003-REF-MS-DRS-METHOD]
