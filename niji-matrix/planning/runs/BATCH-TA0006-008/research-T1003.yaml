handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-008
work_item_ref: WORK-TA0006-T1003
temporary_key_prefix: TA0006-008-T1003
candidate:
  source_type: attack
  source_attack_id: T1003
  name:
    zh: 操作系统认证材料提取
    en: Operating-System Authentication-Material Extraction
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: >-
        ATT&CK Enterprise 19.1 的 T1003 明确属于 Credential Access，并覆盖从操作系统缓存、内存、目录数据库和账户结构中取得口令、散列、密钥或等价认证材料，因此父候选应保留。但固定父项的八个子技术主要按 Windows 组件、Linux 路径、目录服务方法和存储位置划分，混合了材料位置、读取协议、活动或离线状态以及后继破解；这些名称不能直接复制成 Niji 子项。建议适配为操作系统认证材料提取：攻击者跨越操作系统认证权威、受保护存储或目录复制权限，实际读出并保存可用于验证、票据构造或后继认证的材料。能力、权限、对象打开、材料复制、解锁或恢复和后继使用必须分层。
      en: >-
        ATT&CK Enterprise 19.1 places T1003 in Credential Access and covers obtaining passwords, hashes, keys, or equivalent authentication material from operating-system caches, memory, directory databases, and account structures, so the parent candidate should be retained. Its eight fixed children are primarily divided by Windows component, Linux path, directory-service method, and storage location, mixing material location, read protocol, live or offline state, and later cracking. Those names cannot be copied into Niji children. Adapt the parent as Operating-System Authentication-Material Extraction: the adversary crosses operating-system authentication authority, protected storage, or directory-replication rights and actually reads and preserves material usable for verification, ticket construction, or later authentication. Capability, authority, object open, material copy, unlock or recovery, and later use remain separate stages.
    - zh: >-
        第一轮逐项覆盖八个 ATT&CK 子项后，第二轮丢弃 LSASS、SAM、NTDS、LSA、DCSync、proc 和 shadow 等名称，从读取主体、活动状态、存储视图、控制面、审计归属与输出重新聚类。正式建议三项跨实现变量：攻击者把读取迁入本来就可接近认证材料的可信进程或角色，改变 reader provenance；攻击者使用快照、备份或原始派生视图取出非活动认证存储，改变活动对象审计；攻击者借合法目录复制协议让域控制器导出秘密，改变文件或进程读取为复制事务。普通高权进程直接读活动存储是父级核心，运行态对静态位置本身只是材料状态，不单独成为 NJS。
      en: >-
        After the first pass covered all eight ATT&CK children, the second discarded names such as LSASS, SAM, NTDS, LSA, DCSync, proc, and shadow and reclustered by reader, live state, storage view, control plane, audit ownership, and output. Three cross-implementation variables remain formal candidates. The adversary can move reading into a trusted process or role already expected near authentication material, changing reader provenance; use a snapshot, backup, or raw-derived view to remove an inactive authentication store, changing live-object audit; or use legitimate directory replication so a domain controller exports secrets, replacing file or process reads with a replication transaction. Direct high-authority reading of a live store remains parent core, and runtime versus static location alone is material state rather than an NJS boundary.
proposed_content:
  summary:
    zh: 攻击者从操作系统的认证运行态、受保护账户存储或目录复制服务实际提取认证材料，并可通过可信读取主体、替代存储视图或合法复制控制面改变防守方看到的取用痕迹。
    en: An adversary extracts authentication material from operating-system runtime state, protected account stores, or directory replication services and can change defender-visible retrieval traces through a trusted reader, alternative storage view, or legitimate replication control plane.
  definition_and_concept:
    paragraphs:
    - zh: >-
        操作系统认证材料提取是攻击者针对操作系统或目录服务用于验证本地、域或服务身份的口令派生值、散列、票据密钥、缓存证明、受保护秘密或短时明文，跨越其访问保护并取得攻击者可保存的材料。材料可以位于认证进程内存、内核暴露的进程视图、注册表配置单元、账户数据库、目录数据库、Unix 账户文件或复制响应；位置决定实现和传感器，不决定父技术身份。直接结果是可识别的认证材料已经离开原保护边界并进入攻击者可用输出，而不是仅有工具、权限或读取尝试。
      en: >-
        Operating-System Authentication-Material Extraction targets password-derived values, hashes, ticket keys, cached proofs, protected secrets, or transient plaintext used by an operating system or directory service to validate local, domain, or service identities. The adversary crosses the relevant access protection and obtains material that can be preserved. Material can reside in authentication-process memory, a kernel-exposed process view, registry hives, account databases, directory databases, Unix account files, or replication responses. Location changes implementation and sensors rather than parent identity. The direct result is identifiable authentication material leaving its protection boundary into an adversary-usable output, not merely a tool, privilege, or read attempt.
    - zh: >-
        证据链必须至少区分具备权限或加载能力、打开目标对象、读取字节或属性、识别并复制认证材料、对加密或格式化材料完成解锁或解析、将输出保存在文件或网络响应，以及后继破解、票据构造或登录。Sysmon ProcessAccess 只证明句柄与访问权，Windows 4663 只在 SACL 配置后证明某些对象访问，DRSGetNCChanges 证明复制请求与响应语义；它们均不能单独证明秘密已被恢复。CISA 的 Volt Typhoon 事件把影子副本、NTDS.dit 与 SYSTEM 复制、外传及离线破解目的连接起来，但离线候选计算仍归 NJS-0137-003。
      en: >-
        Evidence must distinguish at least possession of authority or load capability, target-object open, byte or attribute read, identification and copy of authentication material, unlock or parsing of encrypted or formatted material, preservation in a file or network response, and later cracking, ticket construction, or sign-in. Sysmon ProcessAccess proves a handle and access rights only, Windows 4663 proves selected object access only when SACLs are configured, and DRSGetNCChanges establishes replication request and response semantics. None alone proves secret recovery. The CISA Volt Typhoon event connects a shadow copy, copying NTDS.dit and SYSTEM, exfiltration, and offline-cracking intent, but offline candidate computation still belongs to NJS-0137-003.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        操作系统认证材料通常被合法安全、备份、复制、诊断和身份服务接触。攻击者若把读取置于 svchost 等角色贴合进程、使用备份或快照视图，或以具有复制权限的账户调用 DRS，局部传感器会看到熟悉主体、标准协议或正常管理对象，而真正差异转移到代码来源、调用者与目标关系、读取视图、输出和用途。Mandiant DueDLLigence 研究直接演示将 Mimikatz shellcode 移入经常访问 LSASS 的 svchost，使 EDR 看到预期 subject/action；该受控研究证明观察效应，不代表在野普遍性。
      en: >-
        Legitimate security, backup, replication, diagnostics, and identity services routinely approach operating-system authentication material. If an adversary places reading in a role-conforming process such as svchost, uses a backup or snapshot view, or invokes DRS with an account holding replication rights, a local sensor can see a familiar subject, standard protocol, or ordinary management object. The distinguishing evidence shifts to code provenance, caller-to-target relationship, read view, output, and purpose. Mandiant's DueDLLigence research directly demonstrates moving Mimikatz shellcode into svchost, which commonly accesses LSASS, so an EDR sees an expected subject and action. The controlled study proves the observation effect rather than field prevalence.
    - zh: >-
        三种观察迁移留下不同残余。可信 reader 转用仍有注入、无背衬内存、异常父链、访问权与 dump 输出；非活动视图仍有卷或快照控制面、备份权限、敏感对象映射、暂存和外传；目录复制仍有来源主机、调用账户、复制权限、naming context、GetNCChanges 请求和响应量。直接读取 /etc/shadow、SAM 或活动配置单元不自动获得这些匿迹收益，只能作为父行为。防守方必须把能力、读取和结果连接，不能从“没有登录失败”或“没有活动文件打开”反推提取成功。
      en: >-
        The three observation shifts leave different residuals. Trusted-reader repurposing retains injection, unbacked memory, anomalous ancestry, access rights, and dump output. An inactive view retains volume or snapshot control-plane activity, backup authority, sensitive-object mapping, staging, and exfiltration. Directory replication retains source host, caller account, replication rights, naming context, GetNCChanges requests, and response volume. Direct reads of /etc/shadow, SAM, or a live hive do not automatically gain these stealth properties and remain parent behavior. Defenders must join capability, read, and outcome rather than infer extraction success from absent sign-in failures or absent live-file opens.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求对象是操作系统或目录认证权威维护的认证材料，攻击者驱动了越权或非预期取用，并有材料内容、可识别输出或权威响应证据。仅加载 Mimikatz、获得 SeDebugPrivilege、打开 LSASS、复制加密数据库、列出目录对象、取得 DRS 权限或读取 /proc/maps 都是能力或前置阶段；没有材料结果时不能完成父技术。合法 EDR、反恶意软件、崩溃诊断、备份、域复制、密码轮换、灾备和取证可产生同类事件，必须核对 owner、工单、签名、来源、对象范围、输出和时间。
      en: >-
        Inclusion requires authentication material maintained by an operating-system or directory authentication authority, adversary-driven unauthorized or unintended retrieval, and evidence of material content, identifiable output, or an authoritative response. Loading Mimikatz, obtaining SeDebugPrivilege, opening LSASS, copying an encrypted database, listing directory objects, obtaining DRS rights, or reading /proc/maps is capability or preparation only. The parent is incomplete without a material result. Legitimate EDR, antimalware, crash diagnostics, backup, domain replication, password rotation, disaster recovery, and forensics can produce similar events and require comparison of owner, case, signature, origin, object scope, output, and time.
    - zh: >-
        NJT-0147/T1555 处理操作系统、浏览器、密码管理器或云服务所维护的普通凭据保管条目及已解锁消费路径；本技术处理操作系统认证权威本身的登录材料、账户数据库和域验证材料。T1552 处理散落在普通文件、历史、配置或消息中的未受保护秘密，/etc/shadow 因其系统账户验证角色和受限读取属于本技术。NJT-0169/T1056 在用户提交前或提交时复制输入；NJT-0093/T1556 改变认证过程或增加秘密旁路；本技术只读取既有状态。NJS-0137-003 在材料取得后测试未知候选；NJT-0108 拥有原始卷或副本视图绕过，二者在同一事件分别证明介质与认证材料结果时并列。一般内存采集若未证明认证材料内容，不进入本技术。
      en: >-
        NJT-0147/T1555 covers ordinary credential-vault items and unlocked consumer paths maintained by operating systems, browsers, password managers, or cloud services. This technique covers login material, account databases, and domain verification material belonging to the operating-system authentication authority itself. T1552 covers unprotected secrets scattered in ordinary files, history, configuration, or messages; /etc/shadow belongs here because of its system-account verification role and restricted read. NJT-0169/T1056 copies input before or during submission. NJT-0093/T1556 changes the authentication process or adds a secret side output; this technique reads existing state. NJS-0137-003 tests unknown candidates after material acquisition. NJT-0108 owns raw-volume or copy-view bypass; both apply to one event only when medium and authentication-material outcomes are each proven. Generic memory acquisition without authentication-material content does not enter this technique.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          在端点上，具备调试、SYSTEM、root、ptrace 或等价权限的攻击者可读取认证进程运行态、SAM/SECURITY 配置单元、缓存域材料、/proc 进程视图或 /etc/shadow，并解析出散列、密钥或短时明文。在域环境，攻击者可从活动或副本 NTDS 及 SYSTEM 组合中恢复材料，也可让域控制器通过复制协议返回指定账户秘密。输出可用于离线破解、Pass-the-Hash、票据构造或后继登录，但这些用途需分别记录。
        en: >-
          On an endpoint, an adversary with debugging, SYSTEM, root, ptrace, or equivalent authority can read authentication-process runtime state, SAM or SECURITY hives, cached domain material, /proc process views, or /etc/shadow and parse hashes, keys, or transient plaintext. In a domain, the adversary can recover material from live or copied NTDS and SYSTEM combinations or make a domain controller return selected account secrets through the replication protocol. Output can support offline cracking, Pass-the-Hash, ticket construction, or later sign-in, but each use needs separate recording.
      - zh: >-
          匿迹变量决定同一目标的观察路径。攻击者可以把 LSASS 读取代码注入预期 reader；从卷影副本或备份读取锁定数据库而避开活动路径；或从非域控主机使用获授权账户发起目录复制。直接用未受信进程读取活动 hive、cat /etc/shadow 或 ptrace 目标进程仍属于父级，但没有自动获得正式子项的观察变化。
        en: >-
          The stealth variable determines the observation path for the same target. An adversary can inject LSASS-reading code into an expected reader, read a locked database from a volume shadow copy or backup rather than the live path, or initiate directory replication from a non-domain-controller host using an authorized account. Directly reading a live hive with an untrusted process, reading /etc/shadow, or attaching to a target process remains parent behavior without automatically gaining the formal children’s observation shifts.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            本地提取通常要求管理员、SYSTEM、root、CAP_SYS_PTRACE、备份/恢复、原始卷或目标对象 ACL 权限，并要求理解材料格式、加密依赖和正确输出窗口。LSA protection、Credential Guard、VBS、受保护进程、Linux ptrace 与 hidepid、磁盘加密、SACL 以及独立备份身份会缩小可用路径。目录复制要求 DRS 可达、复制扩展权限和足以定位 naming context 或目标账户的知识；获得权限本身不保证 secret response 成功。
          en: >-
            Local extraction commonly requires administrator, SYSTEM, root, CAP_SYS_PTRACE, backup or restore, raw-volume, or target-object ACL authority and knowledge of material format, cryptographic dependencies, and the correct output window. LSA protection, Credential Guard, VBS, protected processes, Linux ptrace and hidepid, disk encryption, SACLs, and separate backup identities reduce available paths. Directory replication requires DRS reachability, replication extended rights, and knowledge sufficient to identify a naming context or target account. Possession of rights does not guarantee a successful secret response.
        - zh: >-
            可信 reader 转用还要求代码注入、模块加载或控制受信工具的导出行为；非活动视图要求创建或读取快照/备份并取得解密依赖；复制式导出要求调用方通过访问检查。攻击者可能只得到损坏文件、无法解析的内存或不可离线恢复的材料。后继认证还会受口令轮换、MFA、设备条件、签名和 ticket 生命周期限制。
          en: >-
            Trusted-reader repurposing additionally requires injection, module loading, or control of a trusted tool’s export behavior. An inactive view requires creation or access to a snapshot or backup and acquisition of decryption dependencies. Replication export requires the caller to pass access checks. The adversary can receive a damaged file, unparsable memory, or material that cannot be recovered offline. Later authentication remains constrained by credential rotation, MFA, device conditions, signing, and ticket lifetime.
      defender_model:
        paragraphs:
        - zh: >-
            防守方假定可集中一部分进程访问与注入、对象/注册表读取、Linux syscall 或 audit、卷与备份控制面、目录复制网络/身份活动、输出文件、外传和身份使用数据。关键连接键包括 host、user/logon ID、source/target process GUID、access mask、object path 或 hive、PID、copy/volume ID、caller account、source IP、naming context、request/correlation ID、output hash 和账户映射。只有进程创建或最终登录而缺少中间读取时，只能形成弱推断。
          en: >-
            The defender is assumed to centralize some process access and injection, object or registry read, Linux syscall or audit, volume and backup control-plane, directory-replication network or identity activity, output file, exfiltration, and identity-use data. Key joins include host, user or logon ID, source and target process GUID, access mask, object path or hive, PID, copy or volume ID, caller account, source IP, naming context, request or correlation ID, output hash, and account mapping. Process creation or final sign-in without the intermediate read supports only weak inference.
        - zh: >-
            Windows Event 4663 依赖目标 SACL，Sysmon Event 10 噪声高且只证明 ProcessAccess；Linux procfs 和 shadow 读取需要预先配置 audit 才可能得到目标路径与 syscall；加密 DRS 流量或缺少目录传感器时可能只见 RPC 连接。内核级攻击者、受信 reader 内执行、已批准域控失陷、离线副本外流和短暂明文均形成盲区。响应必须按材料类型和范围分级，不能从一个 dump 文件名推断全域秘密均已恢复。
          en: >-
            Windows Event 4663 depends on a target SACL, and Sysmon Event 10 is noisy and proves only ProcessAccess. Linux procfs and shadow reads need preconfigured audit to expose path and syscall. Encrypted DRS traffic or absent directory sensors can leave only an RPC connection. Kernel-level adversaries, execution inside a trusted reader, compromise of an approved domain controller, off-host copies, and transient plaintext all create blind spots. Response must be graded by material type and scope rather than infer that a dump filename means every domain secret was recovered.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 取用跨越活动认证与对象审计面后才出现材料结果
      en: Retrieval crosses live authentication and object-audit planes before material appears
    analysis:
      paragraphs:
      - zh: >-
          攻击者可从运行态内存、替代存储视图或复制响应取得材料，而目标认证服务不处理一次新的用户登录，活动文件或逐对象审计也可能没有相同语义。防守方分别看到进程访问、块/副本操作或 DRS 请求，材料在输出文件或网络响应中才显现；缺少跨平面连接时，关键提取落在既有认证监控之外。CISA 的副本链、Microsoft proc/LSA/DRS 语义和 Mandiant reader 研究共同支持观察边界，具体传感器覆盖仍随部署变化。
        en: >-
          An adversary can obtain material from runtime memory, an alternative storage view, or a replication response without the target authentication service processing a new user sign-in, and the live-file or per-object audit can lack equivalent semantics. Defenders separately see process access, block or copy operations, or a DRS request, while material becomes apparent only in an output file or network response. Without cross-plane joins, critical extraction remains outside established authentication monitoring. The CISA copy chain, Microsoft proc, LSA, and DRS semantics, and Mandiant reader research jointly support the observation boundary, while sensor coverage remains deployment-specific.
    evidence_keys: [REF-000025, REF-000367, TA0006-008-T1003-REF-MS-DRS-METHOD, TA0006-008-T1003-REF-LINUX-PROC]
    confidence: high
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 可信 reader 与复制协议为恶意材料读取借用正常身份
      en: Trusted readers and replication protocol lend normal identity to malicious material reads
    analysis:
      paragraphs:
      - zh: >-
          角色贴合进程、备份服务或获授权复制账户可以使用与正常安全、恢复或域复制相同的主体和接口，恶意与合法活动在 image、account 或 protocol 字段上相似。真正差异位于代码来源、批准关系、源主机、对象范围、输出和后继用途。DueDLLigence 直接证明 reader role 选择改变 EDR 所见特征；DCSync 实验和 Microsoft DRS 访问检查说明合法协议可返回秘密。签名、账户或协议单字段因此不能等同合法目的。
        en: >-
          A role-conforming process, backup service, or authorized replication account can use the same subject and interface as legitimate security, recovery, or domain replication, making malicious and legitimate activity similar in image, account, or protocol fields. The distinguishing evidence lies in code provenance, approved relationship, source host, object scope, output, and successor use. DueDLLigence directly establishes that reader-role selection changes EDR-visible features. DCSync experimentation and Microsoft DRS access checks show a legitimate protocol can return secrets. A signature, account, or protocol field cannot therefore be equated with legitimate purpose.
    evidence_keys: [REF-000367, REF-000749, TA0006-008-T1003-REF-DCSYNC-EXPERIMENT, REF-000750]
    confidence: high
proposed_subtechniques:
- temporary_key: TA0006-008-T1003-CHILD-READER
  name:
    zh: 可信凭据读取上下文转用
    en: Trusted Credential-Reader Context Repurposing
  summary:
    zh: 攻击者把认证材料读取代码或导出动作置于正常会接近目标的受信进程、服务或工具中，使 reader 身份看起来符合角色。
    en: An adversary places authentication-material read code or export behavior inside a trusted process, service, or tool normally expected near the target, making reader identity appear role-conforming.
  taxonomy_variable:
    zh: 防守方观察到的 reader 身份是否与实际控制者和代码来源一致
    en: Whether the reader identity observed by defenders matches the actual controller and code provenance
  counterfactual_trace:
    zh: 未受信进程直接读取会形成新 image、异常父链与敏感访问组合；转用后目标访问由熟悉 reader 发出，异常迁移到注入、模块、内存 backing、调用者和输出。
    en: A direct read by an untrusted process creates a new image, anomalous ancestry, and sensitive-access combination; after repurposing, a familiar reader issues the target access and the anomaly moves to injection, module, memory backing, caller, and output.
  definition_and_concept:
    paragraphs:
    - zh: >-
        可信凭据读取上下文转用是攻击者把读取认证进程、账户存储或安全配置的代码注入、加载或驱动到一个正常职责中已接近该对象的进程、服务、签名工具或备份组件，使敏感 read 以该受信 reader 的身份发生。稳定变量是 reader provenance 与真实控制者分离，不是 Mimikatz、svchost、comsvcs、dump 工具或操作系统名称。只有材料输出已经证实时完成本子项；注入或 ProcessAccess 本身仍是前置。
      en: >-
        Trusted Credential-Reader Context Repurposing injects, loads, or drives code that reads an authentication process, account store, or security configuration inside a process, service, signed tool, or backup component whose normal role already approaches that object. The sensitive read then occurs under the trusted reader's identity. The stable variable is separation of reader provenance from actual controller, not Mimikatz, svchost, comsvcs, a dump tool, or operating-system name. The child completes only when material output is established; injection or ProcessAccess alone remains preparation.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        可信凭据读取上下文转用保留受信 image、签名、服务账户或预期 target-access 组合，削弱按“未知进程访问 LSASS/安全存储”分类的规则。Mandiant 明确举例把 Mimikatz shellcode 放入常访问 LSASS 的 svchost，使 EDR 看到预期主体与动作。残余差异包括 remote thread/APC、可执行私有内存、异常模块或 call trace、父进程、加载时间、access rights、dump 文件和网络输出；受信 reader 不是免审计白名单。
      en: >-
        Trusted Credential-Reader Context Repurposing preserves a trusted image, signature, service account, or expected target-access combination, weakening rules that classify an unknown process accessing LSASS or a security store. Mandiant explicitly illustrates placing Mimikatz shellcode in svchost, which commonly accesses LSASS, so the EDR sees an expected subject and action. Residual differences include a remote thread or APC, executable private memory, anomalous module or call trace, parent process, load time, access rights, dump file, and network output. A trusted reader is not an audit exemption.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求 attacker-controlled code 或操作进入受信 reader、该 reader 实际读取 OS 认证材料，并产生材料输出。合法 EDR、AV、SSP、备份、崩溃诊断与管理员转储按代码签名、配置、工单、目标、输出目的和时段排除。一般进程注入由 NJT-0103 等相邻对象解释执行上下文，本子项只在认证材料结果独立证明时并列。若攻击者直接以自己进程读取或仅使用高权限，不满足 reader 转用变量但仍可属于父技术。
      en: >-
        Inclusion requires attacker-controlled code or operation inside a trusted reader, an actual read of operating-system authentication material by that reader, and material output. Legitimate EDR, antimalware, SSP, backup, crash diagnostics, and administrative dumps require exclusion by code signature, configuration, case, target, output destination, and time. Adjacent objects such as NJT-0103 explain general process-injection execution context; this child coexists only when the authentication-material result is independently established. A direct read from the adversary's own process or use of privilege alone does not satisfy reader repurposing, though it can remain parent behavior.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          攻击者可把 LSASS 解析代码注入角色贴合的系统进程、利用受信诊断或转储组件生成认证进程副本，或控制获批准备份/安全代理导出 OS 账户材料。实现跨运行态与存储对象，但共同点是防守日志首先归因给熟悉 reader。DueDLLigence 是直接受控证据；其他工具或场景需要逐案证明 reader 被控制和材料输出。
        en: >-
          An adversary can inject LSASS parsing code into a role-conforming system process, use a trusted diagnostic or dump component to create an authentication-process copy, or control an approved backup or security agent to export operating-system account material. Implementations span runtime and stored objects, but defenders initially attribute them to a familiar reader. DueDLLigence is direct controlled evidence; other tools or scenarios need event-specific proof of reader control and material output.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要控制目标 reader 的代码、调用或配置，并仍具备读取目标所需完整性级别、句柄权、ptrace/capability 或备份权限。PPL、Credential Guard、代码完整性、受保护服务、模块允许清单和输出限制会阻断部分路径；错误注入可能崩溃关键认证服务。签名工具能打开对象也不保证能解析或导出材料。
          en: >-
            The adversary needs control of the target reader's code, invocation, or configuration and still requires the integrity level, handle rights, ptrace capability, or backup authority needed to read the target. PPL, Credential Guard, code integrity, protected services, module allowlists, and output restrictions block some paths, while faulty injection can crash a critical authentication service. A signed tool's ability to open an object does not guarantee material parsing or export.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需要把 reader image/signature、启动与父链、模块和内存区、注入事件、target process/object、access mask/call trace、用户和 logon ID、输出文件及外联连接。只对 image 建白名单会直接遗漏变量；只见注入而无材料输出只能报告上下文风险。内核注入、同进程扩展、签名组件被替换和传感器自保护失效会形成盲区。
          en: >-
            Defenders need joins across reader image and signature, start and ancestry, module and memory region, injection event, target process or object, access mask or call trace, user and logon ID, output file, and egress. Image allowlisting alone directly misses the variable. Injection without material output supports context risk only. Kernel injection, in-process extensions, replacement of a signed component, and sensor self-protection failure create blind spots.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 角色贴合 reader 身份掩盖攻击者控制的敏感读取
      en: Role-conforming reader identity masks attacker-controlled sensitive access
    analysis:
      paragraphs:
      - zh: >-
          攻击者选择一个本来会接近目标的 reader 承载提取逻辑，让进程与动作的局部组合符合防守基线。真正改变的是 reader 内代码来源与输出，而不是 target read 的表面。REF-000367 和 CASE-000134 直接证明这一控制变量及反制残余；来源是授权红队研究，故子项存在性高，但在野普遍性不外推。
        en: >-
          The adversary selects a reader already expected near the target to carry extraction logic, keeping the local process-and-action combination inside defender baselines. What changes is code provenance and output inside the reader rather than the visible target read. REF-000367 and CASE-000134 directly establish the controlled variable and counter-signals. The source is authorized red-team research, so child existence is high confidence without extrapolating field prevalence.
    evidence_keys: [REF-000367, CASE-000134, REF-000366]
    confidence: high
  evidence_keys: [REF-000367, CASE-000134, REF-000366, TA0006-008-T1003-REF-MS-LSA-PROTECTION]
  defense_keys: [TA0006-008-T1003-DET-LOCAL, TA0006-008-T1003-NJA-READER, TA0006-008-T1003-MIT-ISOLATION]
  limitations:
    paragraphs:
    - zh: >-
        现有直接观察效应主要来自 DueDLLigence 授权研究，不能推断所有攻击者都会注入角色贴合 reader。合法 EDR 和诊断组件可能产生相同注入、ProcessAccess 或 dump 痕迹；反之，签名被盗或内核执行可能不留下用户态残余。正式案例必须同时证明 reader 控制、认证目标和材料结果。
      en: >-
        Direct observation-effect evidence is concentrated in the authorized DueDLLigence study and cannot establish that every adversary injects a role-conforming reader. Legitimate EDR and diagnostics can produce similar injection, ProcessAccess, or dump traces, while stolen signing or kernel execution may omit user-mode residuals. A formal case must establish reader control, authentication target, and material result together.
- temporary_key: TA0006-008-T1003-CHILD-INACTIVE
  name:
    zh: 非活动认证存储视图提取
    en: Inactive Authentication-Store View Extraction
  summary:
    zh: 攻击者从快照、备份、原始卷派生或其他非活动视图复制 OS 认证存储，使读取离开活动对象锁与文件审计。
    en: An adversary copies an operating-system authentication store from a snapshot, backup, raw-derived, or other inactive view, moving reads outside live-object locks and file audit.
  taxonomy_variable:
    zh: 认证存储读取发生在活动对象视图还是派生非活动视图
    en: Whether the authentication store is read through its live object view or a derived inactive view
  counterfactual_trace:
    zh: 活动读取留下敏感文件/数据库句柄和锁冲突；非活动视图留下副本创建、卷或备份权限、copy ID 与输出，而原活动对象可能没有对应 read。
    en: Live reads leave sensitive file or database handles and lock conflicts; an inactive view leaves copy creation, volume or backup authority, copy identifier, and output while the live object can lack a corresponding read.
  definition_and_concept:
    paragraphs:
    - zh: >-
        非活动认证存储视图提取是攻击者创建或取得一个从底层存储状态派生、与活动认证数据库或 hive 分离的快照、备份、原始卷映射或等价副本，再从中复制 OS 认证材料及必要解锁依赖。稳定变量是读取视图与活动对象审计分离，不是卷影副本、NTDS、SAM、备份产品或命令名称。只有副本中可识别认证存储和必要依赖已经输出时完成；只创建 snapshot 或复制不可用密文是暴露前态。
      en: >-
        Inactive Authentication-Store View Extraction creates or obtains a snapshot, backup, raw-volume mapping, or equivalent copy derived from underlying storage state and separated from a live authentication database or hive, then copies operating-system authentication material and required unlock dependencies from it. The stable variable is separation of the read view from live-object audit, not volume shadow copy, NTDS, SAM, backup product, or command name. The child completes when an identifiable authentication store and necessary dependencies are output. Creating a snapshot or copying unusable ciphertext is exposure preparation only.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        非活动认证存储视图提取使活动文件或数据库过滤器看不到同等读取，原对象可继续被认证服务锁定并正常工作。异常转移到 vss/backup/volume 控制面、副本路径、备份权限和暂存；只监控活动 NTDS、SAM 或 hive 文件打开的规则会缺失目标语义。NJT-0108 已证明相同介质层观察边界，本子项增加 OS 认证材料、依赖配对与结果门槛，不重新发明原始存储技术。
      en: >-
        Inactive Authentication-Store View Extraction can leave live-file or database filters without an equivalent read while the original object remains locked and operational under its authentication service. The anomaly moves to the volume-shadow, backup, or volume control plane, copy path, backup authority, and staging. Rules watching only live NTDS, SAM, or hive opens lose target semantics. NJT-0108 already establishes the same medium-level observation boundary. This child adds the operating-system authentication material, dependency pairing, and outcome gate rather than reinventing raw storage behavior.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求替代存储视图、OS 认证对象映射、材料复制结果三者相连。合法备份、灾备、取证、DC system-state 维护和获批 snapshot 是反例。若攻击者用原始卷或副本绕开活动路径，同时标记 NJT-0108；如果随后离线猜测口令，NJS-0137-003 单独成立。普通复制活动文件、未包含系统验证材料的内存镜像、或只外传不可解锁数据库不满足完成结果。
      en: >-
        Inclusion requires a join among alternative storage view, operating-system authentication-object mapping, and material-copy result. Legitimate backup, disaster recovery, forensics, domain-controller system-state maintenance, and approved snapshots are counterexamples. Raw-volume or copy-view bypass also receives NJT-0108, while later offline password guessing separately satisfies NJS-0137-003. Ordinary copying of a live file, a memory image without system verification material, or exfiltration of an unlockable database does not establish the completed result.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          Volt Typhoon 使用域管理员进入 DC，以 vssadmin 创建卷影副本，再通过 WMIC 和 ntdsutil 从副本复制活动中通常锁定的 NTDS.dit 与 SYSTEM，随后外传并用于离线破解。相同变量可出现于备份、system-state、副本卷或 raw image，只要活动对象读取被替代且认证材料结果已证明。数据库名称不是分类边界。
        en: >-
          Volt Typhoon used a domain administrator account on a domain controller, created a volume shadow copy with vssadmin, and then used WMIC and ntdsutil to copy the normally live-locked NTDS.dit and SYSTEM from the copy before exfiltration for offline cracking. The same variable can occur through backup, system-state, copied volume, or raw image when live-object reading is replaced and an authentication-material result is established. Database name is not the boundary.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要 snapshot、backup、restore 或 raw-volume 权限、足够磁盘空间和文件系统知识，并知道恢复材料所需数据库、SYSTEM/SECURITY hive、boot key 或等价依赖。磁盘加密、独立备份凭据、不可变副本、备份网络隔离和最小权限会限制路径。取得副本不保证格式完整、密钥齐备或可以恢复所有账户。
          en: >-
            The adversary needs snapshot, backup, restore, or raw-volume authority, sufficient storage, file-system knowledge, and awareness of databases, SYSTEM or SECURITY hives, boot keys, or equivalent dependencies needed to recover material. Disk encryption, separate backup credentials, immutable copies, backup-network isolation, and least privilege constrain the path. Obtaining a copy does not guarantee complete format, required keys, or recovery of every account.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需要副本创建者、源卷、copy ID、暴露路径、读取进程、备份权限、对象映射、输出 hash/size、归档、外传及账户范围。活动文件 SACL 可能无事件，因而必须保留存储控制面和块到对象映射。合法备份量大、云快照跨账户复制、脱机介质和外部破解是盲区；若只有 snapshot 命令或 NTDS 文件名，应报告候选链而非确认材料已恢复。
          en: >-
            Defenders need copy creator, source volume, copy identifier, exposed path, reading process, backup authority, object mapping, output hash and size, archive, exfiltration, and account scope. A live-file SACL can have no event, making storage-control-plane and block-to-object mapping necessary. High-volume legitimate backup, cross-account cloud snapshots, offline media, and external cracking create blind spots. A snapshot command or NTDS filename alone supports a candidate chain rather than confirmed recovery.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 非活动视图把认证存储读取移出活动对象审计
      en: An inactive view moves authentication-store reading outside live-object audit
    analysis:
      paragraphs:
      - zh: >-
          攻击者先取得底层派生副本，再从副本读取受保护数据库和解锁依赖，原活动对象不出现同等 read 或锁冲突。痕迹转为存储控制面、副本路径与输出。REF-000025、CASE-000141、CLM-000588 和 NJA-000090 直接支持此链及映射要求；后继破解仍另归 NJS-0137-003。
        en: >-
          The adversary first obtains an underlying derived copy and then reads the protected database and unlock dependencies from it, leaving the live object without an equivalent read or lock conflict. Traces become storage-control-plane, copy-path, and output activity. REF-000025, CASE-000141, CLM-000588, and NJA-000090 directly support the chain and mapping requirement. Later cracking remains NJS-0137-003.
    evidence_keys: [REF-000025, CASE-000141, CLM-000588]
    confidence: high
  evidence_keys: [REF-000025, CASE-000141, CLM-000588, CLM-000704]
  defense_keys: [DET-000105, NJA-000090, MIT-000107, TA0006-008-T1003-DET-LOCAL, TA0006-008-T1003-NJA-LOCAL, TA0006-008-T1003-MIT-ISOLATION, MIT-000134]
  limitations:
    paragraphs:
    - zh: >-
        Volt Typhoon 案例直接证明 NTDS.dit 与 SYSTEM 从卷影副本复制、外传和离线破解目的，但不公开逐账户恢复率或由恢复秘密造成的特定登录。NJA-000090 的块和副本字段并非所有平台默认具备。正式结论应把 store_exposed、dependencies_present、material_parsed 和 secret_recovered 分级，不能从副本文件自动跳到域全面失守。
      en: >-
        The Volt Typhoon case directly establishes NTDS.dit and SYSTEM copying from a shadow view, exfiltration, and offline-cracking intent but does not publish per-account recovery yield or a specific sign-in caused by a recovered secret. NJA-000090 block and copy fields are not available by default on every platform. Formal conclusions should grade store_exposed, dependencies_present, material_parsed, and secret_recovered rather than jump from a copied file to complete domain compromise.
- temporary_key: TA0006-008-T1003-CHILD-REPLICATION
  name:
    zh: 目录复制式认证材料导出
    en: Directory-Replication Authentication-Material Export
  summary:
    zh: 攻击者使用获授权的目录复制协议让域控制器返回账户秘密，使材料离开本地数据库和进程读取观察面。
    en: An adversary uses an authorized directory-replication protocol to make a domain controller return account secrets, moving material outside local database and process-read observation.
  taxonomy_variable:
    zh: 认证材料由存储 reader 读取还是由权威目录服务通过复制事务导出
    en: Whether authentication material is read by a storage reader or exported by the authoritative directory service through replication
  counterfactual_trace:
    zh: 本地数据库提取留下 DC 上的文件、卷或进程读取；复制式导出留下远程来源、调用账户、DRS request、naming context 和 response，而 DC 可无相同文件访问。
    en: Local database extraction leaves file, volume, or process reads on a domain controller; replication export leaves remote origin, caller account, DRS request, naming context, and response while the domain controller can lack an equivalent file access.
  definition_and_concept:
    paragraphs:
    - zh: >-
        目录复制式认证材料导出是攻击者控制具有目录复制扩展权限的身份或主机，调用权威目录服务的 GetNCChanges 或等价复制读取，使域控制器按正常协议返回指定账户或 naming context 中的密码散列、历史、Kerberos 密钥或等价秘密。稳定变量是“服务端权威导出替代数据库读取”，不是 DCSync、Mimikatz、Impacket、账户名或目标 hash。权限授予和 RPC 连接只是前提，响应中出现认证材料才完成。
      en: >-
        Directory-Replication Authentication-Material Export controls an identity or host with directory-replication extended rights and invokes GetNCChanges or an equivalent replication read against the authoritative directory service, causing a domain controller to return password hashes, history, Kerberos keys, or equivalent secrets for selected accounts or a naming context through the normal protocol. The stable variable is authoritative server export replacing database read, not DCSync, Mimikatz, Impacket, account name, or target hash. Rights and an RPC connection are prerequisites; the child completes when authentication material appears in the response.
  stealth_characteristics:
    paragraphs:
    - zh: >-
        目录复制式认证材料导出使用合法 DRS 接口、通过访问检查的账户和域控制器响应，不要求在 DC 上运行 dump 程序或打开 NTDS.dit。只监控文件与 LSASS 的防守方会缺少材料取得事件，域控可能把请求视为复制。异常位于来源主机不在批准 DC/同步清单、账户权限和业务用途不符、请求对象或响应范围异常以及后继输出。若批准域控本身被控制，来源 allowlist 也会失效。
      en: >-
        Directory-Replication Authentication-Material Export uses the legitimate DRS interface, an account that passes access checks, and a domain-controller response without running a dump program or opening NTDS.dit on the DC. Defenders watching only files and LSASS lose the material-acquisition event, and the domain controller can treat the request as replication. The anomaly lies in a source host outside approved DC or synchronization inventory, rights inconsistent with purpose, unusual requested object or response scope, and successor output. Compromise of an approved domain controller can also defeat a source allowlist.
  scope_boundary_definition:
    paragraphs:
    - zh: >-
        纳入要求未批准或被攻击者控制的 caller、实际 DRS secret-bearing request/response 和材料输出。正常 DC 复制、Entra/身份同步、灾备、迁移及获批目录审计按 host/GUID、账户、权限、naming context、owner、工单和时段排除。T1207/NJT-0171 负责伪造或注册复制来源并向合法 DC 推送目录变化；本子项从合法 DC 拉取秘密。仅枚举复制元数据、取得 Replicating Directory Changes 权限或触发被拒请求不完成结果。
      en: >-
        Inclusion requires an unapproved or adversary-controlled caller, an actual DRS request and response carrying secrets, and material output. Normal domain-controller replication, Entra or identity synchronization, disaster recovery, migration, and approved directory audit require exclusion through host or GUID, account, rights, naming context, owner, case, and time. T1207/NJT-0171 owns forged or registered replication origins pushing directory changes to a legitimate DC. This child pulls secrets from a legitimate DC. Enumerating replication metadata, obtaining Replicating Directory Changes rights, or triggering a denied request does not complete the result.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: >-
          具有 Replicating Directory Changes 及读取 secret 所需权利的攻击者可从成员主机请求 krbtgt、管理员或批量账户材料，而无需交互登录 DC 或复制 NTDS.dit。Sean Metcalf 的直接实验记录 Mimikatz DCSync 调用 GetNCChanges、所需权限和返回当前及历史散列；Microsoft 开放规范说明服务端访问检查与 replication response。该实验不是在野案例，但足以支持能力和观察差。
        en: >-
          An adversary holding Replicating Directory Changes and the rights needed for secret data can request krbtgt, administrator, or bulk account material from a member host without interactive domain-controller logon or copying NTDS.dit. Sean Metcalf's direct experiment records Mimikatz DCSync invoking GetNCChanges, required rights, and return of current and historical hashes, while Microsoft's open specification defines server access checks and replication response. The experiment is not an in-the-wild case but supports capability and observation difference.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: >-
            攻击者需要可认证到域控、调用 DRSUAPI、拥有域级复制 secret 权限，并知道域、DC 与目标账户或 naming context。防火墙、分层管理、最小复制 ACL、只允许批准 DC/同步主机、凭据保护和权限监控会限制路径。只拥有全局目录复制权而无 secret 权限时可能得不到敏感值；网络中断和版本差异也会导致不完整响应。
          en: >-
            The adversary needs authentication to a domain controller, DRSUAPI reachability, domain-level rights to replicate secret data, and knowledge of domain, DC, and target account or naming context. Firewalls, administrative tiering, minimal replication ACLs, approved-DC or synchronization-host restrictions, credential protection, and rights monitoring constrain the path. Global-catalog replication rights without secret authority can omit sensitive values, while network interruption and version differences can produce incomplete responses.
      defender_model:
        paragraphs:
        - zh: >-
            防守方需要批准 DC/同步主机清单、账户复制权限历史、RPC/DRS 方法与来源、naming context、目标对象或属性类别、response count/bytes/result、Windows Directory Service Access 或 MDI 活动以及后继文件/网络输出。加密 RPC 可能隐藏属性内容，但来源、会话和流量方向仍可用。缺少 DC 传感器、共享 NAT、被攻陷批准主机和服务账户用途漂移是主要盲区。
          en: >-
            Defenders need approved domain-controller and synchronization-host inventory, account replication-rights history, RPC or DRS method and origin, naming context, target object or attribute class, response count, bytes, and result, Windows Directory Service Access or MDI activity, and successor file or network output. Encrypted RPC can hide attribute content while origin, session, and flow direction remain available. Missing DC sensors, shared NAT, a compromised approved host, and service-account purpose drift are major blind spots.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 合法复制协议与获授权账户掩盖秘密导出目的
      en: Legitimate replication protocol and authorized account mask secret-export purpose
    analysis:
      paragraphs:
      - zh: >-
          攻击者让域控通过标准 GetNCChanges 返回材料，传感器看到的 protocol、server 与 caller authentication 均可合法；差异是来源和对象范围没有批准的复制关系。REF-000749 与 Microsoft 方法规范支持正常语义，DCSync 实验直接证明账户材料可返回，REF-000750 所在官方警报文档描述从 IP 检测 DCSync。高置信仅用于行为与观察差，不把产品警报当作普遍覆盖。
        en: >-
          The adversary makes a domain controller return material through standard GetNCChanges, leaving protocol, server, and caller authentication potentially legitimate. The difference is that origin and object scope lack an approved replication relationship. REF-000749 and the Microsoft method specification support normal semantics, the DCSync experiment directly establishes returned account material, and the official alert documentation represented by REF-000750 describes detecting DCSync from an IP address. High confidence applies to behavior and observation difference rather than universal product coverage.
    evidence_keys: [REF-000749, REF-000750, TA0006-008-T1003-REF-MS-DRS-METHOD, TA0006-008-T1003-REF-DCSYNC-EXPERIMENT]
    confidence: high
  evidence_keys: [REF-000749, REF-000750, TA0006-008-T1003-REF-MS-DRS-METHOD, TA0006-008-T1003-REF-DCSYNC-EXPERIMENT]
  defense_keys: [TA0006-008-T1003-DET-REPLICATION, TA0006-008-T1003-NJA-REPLICATION, TA0006-008-T1003-MIT-ISOLATION, MIT-000134]
  limitations:
    paragraphs:
    - zh: >-
        DCSync 直接证据主要来自研究实验和官方产品警报语义，本批未找到公开在野事件同时给出 caller、GetNCChanges secret response、输出文件和后继身份使用。批准同步器与域控的合法响应可高度相似，属性级内容也常因加密不可见。正式案例必须保留 caller/host、权限前态、response 结果和材料范围，不能从 135/445/RPC 流量或单一 MDI 告警自动断言全域散列已提取。
      en: >-
        Direct DCSync evidence is concentrated in research experimentation and official product-alert semantics. This batch found no public field incident simultaneously publishing caller, GetNCChanges secret response, output file, and later identity use. Legitimate responses to approved synchronizers and domain controllers can look highly similar, and attribute content is often hidden by encryption. A formal case must retain caller or host, prior rights, response result, and material scope rather than infer extraction of every domain hash from RPC traffic or one MDI alert.
defense_candidates:
  detection_strategies:
  - temporary_key: TA0006-008-T1003-DET-LOCAL
    name:
      zh: 本地认证状态读取—材料输出谱系
      en: Local Authentication-State Read–Material Output Lineage
    objective:
      zh: 将敏感进程、hive、账户数据库、procfs 或 shadow 读取与 reader provenance、输出和材料结果连接，区分能力、访问和完成提取。
      en: Join sensitive process, hive, account-database, procfs, or shadow reads to reader provenance, output, and material outcome, separating capability, access, and completed extraction.
    detects_keys: [TA0006-008-T1003-PARENT, TA0006-008-T1003-CHILD-READER, TA0006-008-T1003-CHILD-INACTIVE]
    analytic_keys: [TA0006-008-T1003-NJA-LOCAL, TA0006-008-T1003-NJA-READER]
  - temporary_key: TA0006-008-T1003-DET-REPLICATION
    name:
      zh: 复制调用来源—秘密响应—材料输出差分
      en: Replication Caller–Secret Response–Material Output Differential
    objective:
      zh: 将 DRS 调用者、批准复制关系、secret-bearing response 和后继输出连接，识别合法协议中的未批准材料导出。
      en: Join DRS caller, approved replication relationship, secret-bearing response, and later output to identify unapproved material export through a legitimate protocol.
    detects_keys: [TA0006-008-T1003-PARENT, TA0006-008-T1003-CHILD-REPLICATION]
    analytic_keys: [TA0006-008-T1003-NJA-REPLICATION]
  detection_analytics:
  - temporary_key: TA0006-008-T1003-NJA-LOCAL
    strategy_key: TA0006-008-T1003-DET-LOCAL
    name:
      zh: OS 认证对象访问与输出结果联查
      en: OS Authentication-Object Access and Output Outcome Join
    logic:
      zh: >-
        维护 credential_target_inventory，登记 Windows 认证进程、SAM/SECURITY/SYSTEM/NTDS 对象和 Linux 认证服务进程、/proc 入口、/etc/shadow 及配对依赖。对 Windows 连接 ProcessAccess、object/registry access、privilege、reader image/signature/call trace 与 dump/file/network output；对 Linux 连接 open/openat/pread、ptrace/process_vm_readv、PID、capability、uid、path/inode 与 output。目标被未批准 reader 读取后，三十分钟内出现可识别 dump、hive/database copy、hash/key record、archive 或 egress 时输出 material_extraction_candidate；只有内容解析或可信工具验证确认认证材料时升级为 material_confirmed。权限、句柄或文件名分别输出 capability_only、object_read 和 store_copied，不能自动升级。
      en: >-
        Maintain a credential_target_inventory of Windows authentication processes, SAM, SECURITY, SYSTEM, and NTDS objects and Linux authentication-service processes, /proc entries, /etc/shadow, and paired dependencies. On Windows, join ProcessAccess, object or registry access, privilege, reader image, signature, or call trace to dump, file, or network output. On Linux, join open, openat, pread, ptrace, process_vm_readv, PID, capability, UID, path or inode, and output. Emit material_extraction_candidate when an unapproved reader accesses a target and an identifiable dump, hive or database copy, hash or key record, archive, or egress follows within thirty minutes. Upgrade to material_confirmed only when content parsing or a trusted validation tool establishes authentication material. Privilege, handle, or filename alone respectively emits capability_only, object_read, or store_copied and cannot auto-upgrade.
    data_requirements:
    - source_type: windows_process_and_object_access
      channel: configured Sysmon Event 10, EDR, Security 4656/4663, registry or file audit
      required_fields: [event.timestamp, host.id, user.id, logon.id, source_process.guid, source_process.image, source_process.signer, source_process.parent_guid, target_process.guid, target_process.image, object.path, object.type, access.mask, call_trace, privilege, result]
    - source_type: linux_process_and_file_access
      channel: auditd, eBPF, EDR, procfs or LSM telemetry
      required_fields: [event.timestamp, host.id, uid, auid, session.id, process.pid, process.start_time, process.exe, process.hash, syscall, target.pid, target.path, target.inode, capability, ptrace.mode, open.flags, bytes.read, result]
    - source_type: material_output
      channel: EDR file, process, memory-analysis, archive and network telemetry
      required_fields: [event.timestamp, host.id, process.guid_or_pid, output.path, output.hash, output.size, output.format, material.class, material.account_scope, parser.tool, parser.result, destination, bytes.out]
    - source_type: credential_target_inventory
      channel: asset, authentication-service, file-integrity and protected-object inventory
      required_fields: [host.id, platform, target.process_or_path, target.material_class, protection.expected, allowed_reader, allowed_rights, dependency.object, owner, approval.id, valid.from, valid.to]
    observables: [sensitive_process_read, protected_hive_or_database_read, proc_mem_or_ptrace_access, shadow_file_read, paired_store_dependency_copy, credential_dump_output, hash_or_key_records, archive_or_egress]
    correlation:
      window: 30m-read-to-output-with-same-transaction-when-available
      dimensions: [host.id, user.id, logon.id, source_process.guid, process.pid, target_process.guid, target.pid, object.path, target.inode, access.mask, output.hash, material.class, destination]
    false_positives:
      zh: >-
        EDR/AV、LSA 或 PAM 组件、密码轮换、备份、系统状态维护、崩溃转储、调试、取证、迁移、目录维护和合规扫描会访问同类对象。必须绑定 reader 签名与版本、精确 target、rights、任务 owner、工单、输出目录、保留和目的；不能对白名单工具或 root/SYSTEM 全局放行。
      en: >-
        EDR, antimalware, LSA or PAM components, password rotation, backup, system-state maintenance, crash dump, debugging, forensics, migration, directory maintenance, and compliance scanning can access the same objects. Bind reader signature and version, exact target, rights, task owner, case, output directory, retention, and destination. Never globally allowlist a tool or root or SYSTEM identity.
    blind_spots:
      zh: >-
        Sysmon Event 10 可被过滤且不证明读取内容，4663 依赖 SACL，Linux audit 需预配规则；内核读取、驱动、同进程恶意扩展、短暂内存、传感器受损和脱机介质可绕过。加密/压缩输出可能无法在线识别 material.class，数据库副本也可能在外部解析。只见外传而无源对象映射时范围不确定。
      en: >-
        Sysmon Event 10 can be filtered and does not prove read content, Event 4663 depends on SACLs, and Linux audit requires preconfigured rules. Kernel reads, drivers, malicious in-process extensions, transient memory, sensor impairment, and offline media can bypass coverage. Encrypted or compressed output can hide material class, and a database copy can be parsed externally. Scope remains unknown when egress lacks source-object mapping.
    tuning_guidance:
      zh: >-
        以目标敏感度和危险 rights 筛选，而不是匹配工具名；Windows 优先 LSASS/LSAIso、SAM/SECURITY/SYSTEM、NTDS 和 paired copy，Linux 优先认证服务 /proc/PID/mem/environ、ptrace/process_vm_readv 与 /etc/shadow。按 reader-target-role 建允许图并保留首次偏离，对 output parser 只记录材料类型和账户范围，不集中原始秘密。定期用授权测试验证 process/object 与 output 关联。
      en: >-
        Filter by target sensitivity and dangerous rights rather than tool name. Prioritize LSASS or LSAIso, SAM, SECURITY, SYSTEM, NTDS, and paired copies on Windows and authentication-service /proc/PID/mem or environ, ptrace or process_vm_readv, and /etc/shadow on Linux. Build an allowed reader-target-role graph and retain first deviation. Record material class and account scope from parsers without centralizing raw secrets. Regularly validate process or object-to-output joins with authorized tests.
    recovery_guidance:
      zh: >-
        capability_only 或 object_read 先隔离 reader、保全内存与日志并核实授权；store_copied 立即限制文件/备份出口并评估依赖是否齐备。material_confirmed 时隔离主机、阻断攻击者会话、按 material.class 定位本地、服务、域或 ticket 签名账户，重置或轮换受影响秘密并撤销相关 session。若 NTDS、krbtgt 或广泛域材料可能暴露，进入经批准的域恢复计划，验证复制健康后按官方顺序轮换 krbtgt 与高权/用户/gMSA/信任材料，并证明旧票据和会话失效。
      en: >-
        For capability_only or object_read, isolate the reader, preserve memory and logs, and verify authorization. For store_copied, immediately constrain file and backup egress and assess whether dependencies are complete. On material_confirmed, isolate the host, block adversary sessions, map local, service, domain, or ticket-signing accounts from material class, rotate affected secrets, and revoke related sessions. If NTDS, krbtgt, or broad domain material may be exposed, enter an approved domain-recovery plan, verify replication health, rotate krbtgt and privileged, user, gMSA, and trust material in the official sequence, and prove old tickets and sessions no longer work.
    evidence_keys: [TA0006-008-T1003-REF-ATTACK, REF-000366, REF-000379, TA0006-008-T1003-REF-MS-LSA-PROTECTION, TA0006-008-T1003-REF-MS-CREDENTIAL-GUARD, TA0006-008-T1003-REF-LINUX-PROC, TA0006-008-T1003-REF-LINUX-SHADOW, REF-000025, TA0006-008-T1003-REF-MS-FOREST-RECOVERY]
  - temporary_key: TA0006-008-T1003-NJA-READER
    strategy_key: TA0006-008-T1003-DET-LOCAL
    name:
      zh: 可信 reader 来源与认证材料输出差分
      en: Trusted Reader Provenance and Authentication-Material Output Differential
    logic:
      zh: >-
        对 credential_target_inventory 中的每个 allowed_reader 建立预期 binary hash、signer、service config、modules、memory backing、parent/caller、user、target、rights 和 output contract。受信 reader 接近敏感目标时，向前十五分钟查 remote thread/APC、process tampering、unsigned or novel module、private executable region、binary/config change 或异常调用者，向后三十分钟查 dump、hive copy、archive 与 egress。reader 身份正常但 provenance 或 output contract 偏离时输出 trusted_reader_deviation；只有输出被确认含认证材料时升级为 repurposed_reader_extraction。没有前置注入遥测时保留 output-led 推断。
      en: >-
        For every allowed_reader in the credential target inventory, baseline expected binary hash, signer, service configuration, modules, memory backing, parent or caller, user, target, rights, and output contract. When a trusted reader approaches a sensitive target, look back fifteen minutes for a remote thread or APC, process tampering, unsigned or novel module, private executable region, binary or configuration change, or anomalous caller and look forward thirty minutes for a dump, hive copy, archive, and egress. Emit trusted_reader_deviation when reader identity is normal but provenance or output contract differs. Upgrade to repurposed_reader_extraction only when output is confirmed to contain authentication material. Preserve an output-led inference when precursor injection telemetry is absent.
    data_requirements:
    - source_type: process_provenance_and_injection
      channel: Sysmon 1/7/8/10/25, EDR memory and module telemetry, service or application control
      required_fields: [event.timestamp, host.id, process.guid, process.image, process.hash, signer, parent.guid, caller.guid, module.path, module.hash, module.signer, memory.region_type, memory.protection, injection.technique, service.name, configuration.version]
    - source_type: sensitive_target_access
      channel: EDR or OS process/object access
      required_fields: [event.timestamp, host.id, source_process.guid, target_process.guid, object.path, access.mask, call_trace, user.id, logon.id, result]
    - source_type: reader_output_contract
      channel: CMDB, security-tool inventory, backup workflow and change records
      required_fields: [reader.id, allowed.target, allowed.rights, allowed.output_path, allowed.destination, owner, approval.id, valid.from, valid.to]
    - source_type: material_output
      channel: EDR file and network plus trusted content classifier
      required_fields: [event.timestamp, host.id, process.guid, output.path, output.hash, material.class, account.scope, destination, bytes.out, parser.result]
    observables: [trusted_reader_sensitive_access, injection_or_private_executable_memory, novel_module_or_binary_change, output_contract_violation, credential_material_output]
    correlation:
      window: 15m-provenance-before-access-and-30m-output-after-access
      dimensions: [host.id, process.guid, process.hash, signer, parent.guid, caller.guid, module.hash, target_process.guid, object.path, user.id, logon.id, output.hash, destination]
    false_positives:
      zh: >-
        EDR 内容更新、诊断插件、受控红队、崩溃处理器、软件升级、备份代理和供应商支持可改变模块、内存与输出。只有准确版本、发布签名、批准变更、reader-target-output 三元组和限定窗口能降权；签名正常不能单独排除。
      en: >-
        EDR content updates, diagnostic plug-ins, authorized red teaming, crash handlers, software upgrades, backup agents, and vendor support can change modules, memory, and output. Down-weight only an exact version, publisher signature, approved change, reader-target-output tuple, and bounded window. A valid signature alone cannot exclude.
    blind_spots:
      zh: >-
        同进程漏洞利用、内核/驱动执行、传感器信任链被攻陷、反射加载无模块事件和极短驻留可能没有前置线索。调用栈采集会受性能和隐私限制，供应商工具自身可能产生加密 dump。若只见可信 reader 和输出而无法证明控制，只能保持 strongly-inferred。
      en: >-
        In-process exploitation, kernel or driver execution, compromised sensor trust, reflective loading without a module event, and very brief residence can omit precursor evidence. Call-stack collection has performance and privacy limits, and a vendor tool can create encrypted dumps. A trusted reader plus output without proof of control remains strongly inferred.
    tuning_guidance:
      zh: >-
        不按 svchost、EDR 或签名工具全局放行；按每个 reader 的正常 target、rights、caller、module 和 output 建图。优先首次私有可执行区、未知 module、异常服务配置、危险 LSASS rights 和未登记 output。生产环境用经过批准的模拟验证告警，并将材料分类器放在隔离响应工作流中。
      en: >-
        Never globally allow svchost, an EDR, or a signed utility. Graph normal target, rights, caller, module, and output for each reader. Prioritize first private executable region, unknown module, anomalous service configuration, dangerous LSASS rights, and unregistered output. Validate alerts with authorized simulation and keep material classification inside an isolated response workflow.
    recovery_guidance:
      zh: >-
        立即隔离受信 reader 所在主机并停止相关服务的非必要输出，保全内存、模块、二进制与配置后再重建可信版本。按确认材料范围轮换凭据和撤销 session；若 reader 属于 EDR、备份或身份基础设施，还需轮换其管理密钥、检查同类节点和更新供应链信任。恢复后验证旧 binary/module 被拒绝且 reader-output contract 已恢复。
      en: >-
        Isolate the trusted reader's host and stop unnecessary service output, preserving memory, module, binary, and configuration before rebuilding a trusted version. Rotate credentials and revoke sessions according to confirmed material scope. If the reader belongs to EDR, backup, or identity infrastructure, also rotate management keys, inspect peer nodes, and restore supply-chain trust. Verify old binaries or modules are rejected and the reader-output contract is restored before closure.
    evidence_keys: [REF-000367, CASE-000134, REF-000366, TA0006-008-T1003-REF-MS-LSA-PROTECTION]
  - temporary_key: TA0006-008-T1003-NJA-REPLICATION
    strategy_key: TA0006-008-T1003-DET-REPLICATION
    name:
      zh: 未批准 DRS 来源与秘密响应联查
      en: Unapproved DRS Origin and Secret Response Join
    logic:
      zh: >-
        建立 approved_replication_inventory，包含 forest/domain/site、DC 与同步主机 GUID/host/IP、caller account/SID、DRS rights、naming contexts、owner、工单与有效期。对每个 DRSBind/GetNCChanges cycle 记录 source host/IP、account、authentication session、target DC、request flags、naming context、target object/attribute class、result、response object/value count 与 bytes；连接 4662/MDI 活动和 caller 权限前态。来源或账户不在批准关系、请求 secret-bearing scope 且 response 成功时输出 unapproved_secret_replication；若只能看到 DRS 连接或被拒请求，分别输出 drs_connection 或 replication_denied。五分钟内的输出文件、archive 或 egress 提高 material_preserved 置信度。
      en: >-
        Build an approved_replication_inventory containing forest, domain, site, domain-controller and synchronization-host GUID, host, IP, caller account or SID, DRS rights, naming contexts, owner, case, and validity. For every DRSBind or GetNCChanges cycle, record source host or IP, account, authentication session, target DC, request flags, naming context, target object or attribute class, result, response object or value count, and bytes, joining Event 4662 or MDI activity and caller-rights prior state. Emit unapproved_secret_replication when origin or account lacks an approved relation, the request has secret-bearing scope, and the response succeeds. DRS connectivity or a denied request respectively emits drs_connection or replication_denied. An output file, archive, or egress within five minutes raises confidence that material was preserved.
    data_requirements:
    - source_type: drs_rpc_replication
      channel: domain-controller network sensor, ETW/RPC, MDI, or equivalent identity sensor
      required_fields: [event.timestamp, forest.id, domain.id, source.host, source.guid, source.ip, caller.account, caller.sid, authentication.session_id, target_dc.host, target_dc.guid, rpc.interface_uuid, drs.method, request.flags, naming_context, target.object_id, target.attribute_class, response.object_count, response.value_count, response.bytes, result]
    - source_type: directory_service_access
      channel: Windows Security 4662 or equivalent directory audit
      required_fields: [event.timestamp, domain.id, caller.sid, subject.logon_id, object.name, object.type, operation.type, properties.guid, access.mask, result]
    - source_type: replication_authority_state
      channel: directory ACL snapshots and approval inventory
      required_fields: [domain.id, principal.sid, right.name, right.guid, granted_by, grant.timestamp, source.host_or_guid, allowed.naming_context, owner, approval.id, valid.from, valid.to]
    - source_type: material_output
      channel: endpoint file/process/network telemetry on caller host
      required_fields: [event.timestamp, source.host, process.guid, caller.sid, output.path, output.hash, output.size, material.class, target.account_scope, destination, bytes.out]
    observables: [non_dc_getncchanges, unapproved_replication_account, secret_bearing_scope, successful_replication_response, replication_rights_change, credential_material_output]
    correlation:
      window: one-replication-cycle-with-5m-output-followup-and-90d-rights-history
      dimensions: [forest.id, domain.id, source.guid, source.ip, caller.sid, authentication.session_id, target_dc.guid, rpc.interface_uuid, naming_context, target.object_id, subject.logon_id, output.hash]
    false_positives:
      zh: >-
        正常 DC 复制、Entra Connect/身份同步、迁移、灾备、目录评估、密码过滤/同步和获批红队可产生 GetNCChanges。必须核对准确 host/GUID、账户、rights、naming context、对象范围、owner、工单与时段；不要按服务账户名、DC 子网或 RPC 端口全局放行。
      en: >-
        Normal domain-controller replication, Entra Connect or identity synchronization, migration, disaster recovery, directory assessment, password filtering or synchronization, and authorized red teaming can invoke GetNCChanges. Check exact host or GUID, account, rights, naming context, object scope, owner, case, and time. Never globally allow a service-account name, domain-controller subnet, or RPC port.
    blind_spots:
      zh: >-
        加密 RPC 可能隐藏方法参数与属性，4662 依赖审计配置，MDI 需要 DC 传感器；获批准 DC 或同步主机失陷会通过来源清单，NAT 与多宿主会混淆 IP。若平台只给 DCSync alert 而无 response fields，能证明可疑行为但不能量化返回账户。输出可能只驻留内存或直接经网络流走。
      en: >-
        Encrypted RPC can hide method parameters and attributes, Event 4662 depends on audit configuration, and MDI requires domain-controller sensors. Compromise of an approved DC or synchronization host passes origin inventory, while NAT and multihoming confuse IP. A DCSync alert without response fields proves suspicious behavior but cannot quantify returned accounts. Output can remain only in memory or flow directly over the network.
    tuning_guidance:
      zh: >-
        以历史 host GUID 和授权关系为主，IP 仅作辅助；逐账户复核 DS-Replication-Get-Changes、All 与 Filtered Set，监控新增、扩大和首次使用。高优先级包括非 DC 来源、工作站/用户网段、krbtgt 或管理员目标、全 naming context、异常 response 量及随后 archive/egress。按系统版本用授权测试验证传感器可见 method 和 response 字段。
      en: >-
        Center on historical host GUID and approved relationship, using IP only as support. Review DS-Replication-Get-Changes, All, and Filtered Set per account and monitor grants, expansion, and first use. High-priority conditions include non-DC origin, workstation or user segment, krbtgt or administrator target, full naming context, unusual response volume, and subsequent archive or egress. Validate method and response fields through authorized testing for each OS and sensor version.
    recovery_guidance:
      zh: >-
        对被拒请求先撤销异常来源连接并审查复制权限；成功 secret response 视为域材料潜在暴露，隔离 caller 与相关 DC、撤销非法 DRS rights、保全网络/目录证据并确定账户范围。若 krbtgt、管理员或广泛 naming context 被返回，启动域级身份恢复：验证可信 DC 与复制状态，轮换特权、用户、gMSA、trust 和 krbtgt 材料，撤销 session/ticket，并监控旧材料后继使用。不得在攻击者仍有目录写权时只做密码重置。
      en: >-
        For denied requests, revoke anomalous origin access and review replication rights. Treat a successful secret response as potential domain-material exposure, isolate the caller and related DC, remove illegitimate DRS rights, preserve network and directory evidence, and determine account scope. If krbtgt, administrator, or a broad naming context was returned, initiate domain-level identity recovery by validating trusted DCs and replication, rotating privileged, user, gMSA, trust, and krbtgt material, revoking sessions and tickets, and monitoring use of old material. Do not reset passwords alone while the adversary retains directory write authority.
    evidence_keys: [REF-000749, REF-000750, TA0006-008-T1003-REF-MS-DRS-METHOD, TA0006-008-T1003-REF-DCSYNC-EXPERIMENT, TA0006-008-T1003-REF-MS-FOREST-RECOVERY]
  mitigations:
  - temporary_key: TA0006-008-T1003-MIT-ISOLATION
    name:
      zh: OS 认证材料隔离与提取权限治理
      en: OS Authentication-Material Isolation and Extraction-Authority Governance
    measures:
    - key: runtime-authentication-isolation
      control_type: preventive
      zh: >-
        对 Windows 启用适用的 LSA protection、Credential Guard/VBS 与受保护进程策略，限制调试、驱动与危险句柄权；对 Linux 收紧 ptrace、CAP_SYS_PTRACE、procfs hidepid、root 使用和认证服务调试。
      en: >-
        Enable applicable LSA protection, Credential Guard or VBS, and protected-process policy on Windows while restricting debugging, drivers, and dangerous handle rights. On Linux, constrain ptrace, CAP_SYS_PTRACE, procfs hidepid, root use, and debugging of authentication services.
    - key: credential-store-and-backup-authority
      control_type: preventive
      zh: >-
        对 SAM/SECURITY/SYSTEM、NTDS、shadow、system-state、raw volume 与备份副本使用最小读取/导出权限、隔离备份身份与网络、静态加密和不可变审计；批准 reader 绑定版本、target 和 output contract。
      en: >-
        Apply least read and export authority, separate backup identities and networks, encryption at rest, and immutable audit to SAM, SECURITY, SYSTEM, NTDS, shadow, system state, raw volumes, and backup copies. Bind approved readers to version, target, and output contract.
    - key: directory-replication-authority
      control_type: preventive
      zh: >-
        将目录复制扩展权仅授予批准 DC 与必要同步主体，持续版本化 ACL、host GUID、naming context、owner 与期限；网络上限制可调用 DRS 的来源，并对新增或首次使用复制权独立审批。
      en: >-
        Grant directory-replication extended rights only to approved DCs and necessary synchronization principals, continuously versioning ACL, host GUID, naming context, owner, and expiry. Restrict network origins that can invoke DRS and separately approve new or first use of replication rights.
    - key: sensitive-read-and-output-lineage
      control_type: detective-support
      zh: >-
        对认证目标启用可承受的进程/对象/复制审计，把 reader、view、request 与安全摘要化 output 关联；不得在集中日志保存原始口令、散列、密钥或完整 dump。
      en: >-
        Enable sustainable process, object, and replication audit for authentication targets and join reader, view, and request to safely digested output. Never store raw passwords, hashes, keys, or full dumps in centralized logs.
    applications:
    - target_key: TA0006-008-T1003-PARENT
      use:
        zh: >-
          盘点所有 OS 认证材料、依赖、合法 reader/replicator、保护和审计面，按运行态、活动存储、副本与复制路径分别最小化权限并验证材料暴露响应；离线验证材料恢复继续复用 MIT-000134。
        en: >-
          Inventory every operating-system authentication material class, dependency, legitimate reader or replicator, protection, and audit plane. Minimize authority separately for runtime, live store, copy, and replication paths and validate material-exposure response. Continue to reuse MIT-000134 for recovery from exposed offline-verifier material.
      expected_effect:
        zh: >-
          减少可读取或导出材料的主体与视图，使成功访问留下可映射到对象、输出和账户范围的证据，并为范围化轮换提供依据。
        en: >-
          Reduce subjects and views capable of reading or exporting material, make successful access map to object, output, and account scope, and support scoped rotation decisions.
      limitations:
        zh: >-
          高权限认证、备份、安全和目录服务仍需合法访问；PPL、Credential Guard、hidepid 与 ACL 不覆盖所有材料或内核攻击，审计具有性能和秘密处理成本。
        en: >-
          Privileged authentication, backup, security, and directory services still need legitimate access. PPL, Credential Guard, hidepid, and ACLs do not cover every material class or kernel attack, and audit has performance and secret-handling cost.
    - target_key: TA0006-008-T1003-CHILD-READER
      use:
        zh: >-
          为敏感目标建立 reader-target-output 合同，限制可加载模块与注入权，校验二进制和配置完整性，并让受信 reader 的危险访问接受与未知进程相同的结果关联。
        en: >-
          Establish a reader-target-output contract for sensitive targets, constrain loadable modules and injection authority, validate binary and configuration integrity, and subject dangerous access by trusted readers to the same outcome correlation as unknown processes.
      expected_effect:
        zh: >-
          角色贴合 image 不再形成白名单旁路，代码来源和异常输出成为阻断或调查条件。
        en: >-
          A role-conforming image no longer creates an allowlist bypass, and code provenance plus anomalous output becomes a blocking or investigative condition.
      limitations:
        zh: >-
          内核控制、签名供应链失陷、同进程漏洞和传感器被篡改仍可避开；合法 EDR 与诊断需要严格限时例外。
        en: >-
          Kernel control, compromised signing supply chain, in-process vulnerabilities, and sensor tampering can still evade, while legitimate EDR and diagnostics need tightly bounded exceptions.
    - target_key: TA0006-008-T1003-CHILD-INACTIVE
      use:
        zh: >-
          对系统状态、快照、备份和 raw volume 使用隔离主体与网络，阻止普通管理员随意创建或导出，并把 copy ID 映射到敏感认证对象；介质控制继续复用 MIT-000107，离线材料响应复用 MIT-000134。
        en: >-
          Use isolated principals and networks for system state, snapshots, backups, and raw volumes, prevent arbitrary creation or export by ordinary administrators, and map copy identifiers to sensitive authentication objects. Continue to reuse MIT-000107 for medium controls and MIT-000134 for offline-material response.
      expected_effect:
        zh: >-
          降低活动路径外取得完整存储与依赖的机会，并让副本读取具有可追踪来源、对象和目的地。
        en: >-
          Reduce opportunities to obtain a complete store and dependencies outside the live path and make copy reads traceable to source, object, and destination.
      limitations:
        zh: >-
          备份系统本身需要广泛权限，脱机介质和被攻陷备份控制面可绕过主机治理；副本加密取决于密钥分离。
        en: >-
          Backup systems themselves need broad authority, offline media and a compromised backup control plane can bypass host governance, and copy encryption depends on key separation.
    - target_key: TA0006-008-T1003-CHILD-REPLICATION
      use:
        zh: >-
          清点并收敛 replication extended rights，限制 DRS 来源到批准 host/GUID，监控 ACL 首次使用与 secret-bearing scope，并把同步主体与普通管理员分离；材料暴露后按域恢复计划和 MIT-000134 处置。
        en: >-
          Inventory and minimize replication extended rights, restrict DRS origins to approved hosts or GUIDs, monitor first use of ACLs and secret-bearing scope, and separate synchronization principals from ordinary administrators. Handle material exposure through a domain-recovery plan and MIT-000134.
      expected_effect:
        zh: >-
          未批准主机或账户难以让 DC 导出秘密，残余成功请求可按来源、权限、范围和 output 调查。
        en: >-
          Unapproved hosts or accounts have greater difficulty making a DC export secrets, and residual successful requests are investigable by origin, rights, scope, and output.
      limitations:
        zh: >-
          获批准 DC 或同步主体失陷仍会通过来源控制，加密 RPC 可能限制内容检查；复制业务中断风险要求分阶段部署。
        en: >-
          Compromise of an approved DC or synchronization principal still passes origin controls, encrypted RPC can limit content inspection, and replication outage risk requires staged deployment.
    evidence_keys: [TA0006-008-T1003-REF-MS-LSA-PROTECTION, TA0006-008-T1003-REF-MS-CREDENTIAL-GUARD, TA0006-008-T1003-REF-LINUX-PROC, TA0006-008-T1003-REF-LINUX-SHADOW, REF-000025, REF-000749, REF-000750, TA0006-008-T1003-REF-MS-FOREST-RECOVERY]
existing_library_reuse:
  reference_refs:
  - ref: REF-000025
    resolution: reuse
    note: Exact CISA joint advisory directly supports shadow-copy creation, NTDS.dit and SYSTEM copy, exfiltration, and offline-cracking purpose; reuse for the inactive-view child without broadening per-account recovery claims.
  - ref: REF-000366
    resolution: reuse
    note: Exact Sysmon reference covers ProcessAccess and injection-related events plus their noise and semantic limits; access never proves credential content.
  - ref: REF-000367
    resolution: reuse-and-extend-subject
    note: Exact DueDLLigence source directly supports attacker-controlled reader-role selection for LSASS access; extend to the trusted-reader child while retaining execution-context subjects.
  - ref: REF-000379
    resolution: reuse
    note: Exact Event 4663 reference supports subject, Logon ID, object, process and exercised rights when SACLs exist; it does not establish extracted content.
  - ref: REF-000749
    resolution: reuse
    note: Exact MS-DRSR replication-cycle source defines legitimate client/server and GetNCChanges semantics for the replication child.
  - ref: REF-000750
    resolution: reuse-and-extend-locator
    note: The exact Defender for Identity alerts URL now also contains the DCSync attack alert with source IP and extraction interpretation; extend the canonical locator and title carefully rather than create a duplicate URL.
  claim_refs:
  - ref: CLM-000588
    resolution: reuse-and-extend-subject
    note: The alternative-view-to-sensitive-object proposition applies unchanged to the inactive-view child when the mapped object is an OS authentication store.
  - ref: CLM-000589
    resolution: reuse-boundary-only
    note: Preserve the conclusion that snapshot, raw, backup, and device media do not form separate children; the T1003 child adds authentication-material outcome, not a new medium split.
  - ref: CLM-000704
    resolution: reuse-and-extend-subject
    note: Extend the exact Volt Typhoon case-attribution proposition to the T1003 parent and inactive-view child while retaining the lack of recovery-yield or later-login proof.
  case_refs:
  - ref: CASE-000134
    resolution: reuse-and-extend-subject
    note: Extend the controlled DueDLLigence event to the trusted-reader child; preserve its authorized-study and no-field-prevalence limit.
  - ref: CASE-000141
    resolution: reuse-and-extend-subject
    note: Extend the same Volt Typhoon event to the T1003 parent and inactive-view child; retain NJT-0108 and NJS-0137-003 subjects for medium and later cracking.
  strategy_refs:
  - ref: DET-000105
    resolution: reuse-and-extend-detects
    note: Extend the alternative-storage strategy to the inactive-view child; its objective and NJA-000090 remain exact for copy-view mapping.
  analytic_refs:
  - ref: NJA-000090
    resolution: reuse
    note: Exact copy-control-plane, source volume, copy ID, mapping and successor-output logic applies to the inactive-view child without changing fields.
  mitigation_refs:
  - ref: MIT-000107
    resolution: reuse-and-extend-application
    note: Add the inactive-view child for raw, snapshot and backup authority; it controls the medium and not credential-specific recovery.
  - ref: MIT-000134
    resolution: reuse-and-extend-application
    note: Add the parent plus inactive-view and replication children for verifier-material exposure response and later offline risk; do not imply cracking success from extraction alone.
