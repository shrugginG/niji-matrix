      url: https://www.rfc-editor.org/rfc/rfc9700.html
      locator: Exact redirect and PKCE; implicit response leakage; sender-constrained access tokens with mTLS or DPoP; refresh-token rotation or constraint; audience/scope restriction; refresh family compromise response
      evidence_stage: preventive control and post-acquisition usability limitation
      limitations: Standards guidance does not prove deployment, successful acquisition, or provider revocation propagation.
  claims:
    - temporary_key: TMP-TA0006-009-T1528-CLM-ADMISSION
      resolution: create
      proposition:
        zh: T1528 在完整应用 access/refresh material 实际返回、读取或复制到攻击者控制接收者时完成；注册、同意、签发线索、路径发现、失败读取和后继资源活动均不能单独替代这一结果。
        en: T1528 completes when complete application access or refresh material is actually returned, read, or copied into an adversary-controlled recipient; registration, consent, issuance clues, path discovery, failed reads, and downstream resource activity cannot individually substitute for that result.
      evidence_keys: [TMP-TA0006-009-T1528-REF-ATTACK, TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, REF-000178]
      evidence_mode: parent anchor plus direct incidents and calibrated inference
    - temporary_key: TMP-TA0006-009-T1528-CLM-STAGES
      resolution: create
      proposition:
        zh: Token 位置暴露、read/return 成功、材料取得、取得时可用性、呈现、依赖方接受和资源访问是七个证据阶段，后继成功可证明 possession 但不能说明具体取得路径。
        en: Token-location exposure, successful read or return, material acquisition, usability at acquisition, presentation, relying-party acceptance, and resource access are seven evidence stages; successor success can establish possession but not the specific acquisition path.
      evidence_keys: [REF-000070, REF-000178, TMP-TA0006-009-T1528-REF-RFC6749]
      evidence_mode: direct source facts plus evidence-model inference
    - temporary_key: TMP-TA0006-009-T1528-CLM-BOUNDARY
      resolution: create
      proposition:
        zh: 正规 issuer 返回的原 token 被攻击者取得归 T1528，离权威新构造归 NJT-0166，token 呈现归 T1550.001，依赖方接受入口归 NJT-0061，Cookie 会话材料归 T1539，输入前秘密截获归 NJT-0169。
        en: Acquisition of an original token returned by a legitimate issuer belongs to T1528, off-authority construction to NJT-0166, token presentation to T1550.001, relying-party entry acceptance to NJT-0061, cookie session material to T1539, and pre-token input interception to NJT-0169.
      evidence_keys: [TMP-TA0006-009-T1528-REF-ATTACK, TMP-TA0006-009-T1528-REF-RFC6749]
      evidence_mode: taxonomy boundary inference reviewed against canonical adjacent objects
    - temporary_key: TMP-TA0006-009-T1528-CLM-RETURN
      resolution: create
      proposition:
        zh: Token 在正规 authority 当前事务中新返回到攻击者控制 workload/client/redirect 时，取得痕迹由 request、issuance、response 和 recipient 组成，区别于旧 token 文件或 memory read。
        en: When a legitimate authority returns a fresh token in the current transaction to an adversary-controlled workload, client, or redirect, acquisition residue consists of request, issuance, response, and recipient rather than an existing token file or memory read.
      evidence_keys: [TMP-TA0006-009-T1528-REF-AZURE-IMDS, TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, TMP-TA0006-009-T1528-REF-RFC6749]
      evidence_mode: incident plus official implementation and standard
    - temporary_key: TMP-TA0006-009-T1528-CLM-ARTIFACT
      resolution: create
      proposition:
        zh: Token 在攻击动作前已作为文件、Secret、投影卷、仓库或持久 cache 存在时，完整值向非批准 reader 的成功 object read 构成独立取得路径，并需要对象级读取与复制产物检测。
        en: When a token exists before adversary action as a file, Secret, projected volume, repository object, or durable cache, successful object read of the complete value by an unapproved reader forms an independent acquisition path requiring object-read and copied-artifact detection.
      evidence_keys: [TMP-TA0006-009-T1528-REF-K8S-SA, TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, TMP-TA0006-009-T1528-REF-GITHUB-RUNNER]
      evidence_mode: official platform behavior plus direct incident
    - temporary_key: TMP-TA0006-009-T1528-CLM-RUNTIME
      resolution: create
      proposition:
        zh: 只在 process/job 易失状态中存在的 token 可被同 job 恶意代码或跨进程 memory/env/IPC 读取提取，且需要 runtime provenance 与第二输出检测，不能由持久对象清单覆盖。
        en: A token existing only in volatile process or job state can be extracted by malicious code in the same job or cross-process memory, environment, or IPC reads and requires runtime provenance plus second-output detection rather than persisted-object inventory.
      evidence_keys: [TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, TMP-TA0006-009-T1528-REF-GITHUB-RUNNER]
      evidence_mode: direct incident and official platform warning
    - temporary_key: TMP-TA0006-009-T1528-CLM-DELEGATION
      resolution: create
      proposition:
        zh: 正常委派与 T1528 的差异不在 token 是否由正规平台签发，而在 recipient/client/workload 是否由批准 owner 控制并符合 redirect、scope、用途和代码 Provenance；供应商集成被控时还需分别记录关系控制转移和 token 材料取得。
        en: Legitimate delegation differs from T1528 through whether an approved owner controls the recipient, client, or workload and whether redirect, scope, purpose, and code provenance match, not through whether a legitimate platform issued the token. Compromise of a vendor integration additionally requires separate records for relationship-control transfer and token-material acquisition.
      evidence_keys: [REF-000178, TMP-TA0006-009-T1528-REF-RFC6749]
      evidence_mode: direct integration incident plus boundary inference
    - temporary_key: TMP-TA0006-009-T1528-CLM-REVOCATION
      resolution: create
      proposition:
        zh: 完整处置需同时撤销 access/refresh family、grant/consent、client/workload credential 和关联 session，并在每个 audience 验证旧状态实际被拒绝；控制面 revoke 成功或密码重置不是传播完成证据。
        en: Complete containment revokes access and refresh families, grant or consent, client or workload credentials, and linked sessions and verifies actual denial of old state at every audience; control-plane revoke success or password reset is not proof of propagation completion.
      evidence_keys: [REF-000070, REF-000178, TMP-TA0006-009-T1528-REF-RFC9700]
      evidence_mode: direct response guidance and standards applied to T1528
  cases:
    - temporary_key: TMP-TA0006-009-T1528-CASE-TEAMPCP
      resolution: create
      name:
        zh: TeamPCP 在受信 CI/CD 流程中多路径收获 Token
        en: TeamPCP Multi-Path Token Harvesting in Trusted CI/CD Workflows
      actor_or_campaign: TeamPCP
      time_range: late February through March 2026
      target: Trivy, Checkmarx KICS, LiteLLM, Telnyx, and downstream CI/CD consumers
      central_observed_facts:
        zh: Unit 42 记录 TeamPCP 恶意代码在受侵端点经 IMDS 收集云凭据，直接读取 runner.worker 的 `/proc/<pid>/mem` 提取明文 token，在合法扫描继续并返回正常结果时把材料加密外传，并使用收获的 npm/GitHub token 扩展供应链攻击。
        en: Unit 42 records TeamPCP malicious code harvesting cloud credentials through IMDS on compromised endpoints, reading runner.worker through `/proc/<pid>/mem` to extract plaintext tokens, encrypting and exfiltrating material while legitimate scans continued and returned normal results, and using harvested npm and GitHub tokens to extend the supply-chain attack.
      not_established:
        zh: 报告未逐个公开 token 值、所有 object path、每次 issuer response、取得时有效期或全部受害者；不同波次不能拼成每台主机都经历的统一链，第三方的总规模估计也不能当作 Unit 42 直接观察。
        en: The report does not publish each token value, every object path, every issuer response, acquisition-time validity, or every victim. Separate waves cannot be combined into a universal per-host chain, and third-party scale estimates are not direct Unit 42 observation.
      evidence_keys: [TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP]
      confidence: high
  detection_strategies:
    - TMP-TA0006-009-T1528-DET-ACQUISITION-LINEAGE
  detection_analytics:
    - TMP-TA0006-009-T1528-NJA-RETURN
    - TMP-TA0006-009-T1528-NJA-ARTIFACT
    - TMP-TA0006-009-T1528-NJA-RUNTIME
    - TMP-TA0006-009-T1528-NJA-REVOCATION
  mitigations:
    - TMP-TA0006-009-T1528-MIT-EXPOSURE-CONTROL
    - MIT-000052
    - MIT-000066
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
      - container service-account token
      - CI/CD and repository tokens
      - cloud managed identity and IMDS return
      - malicious OAuth application and consent
      - access and refresh token lifetime
    breadth_trigger: ordinary
    coverage_resolutions:
      - source_cluster: managed identity, metadata service, token endpoint, malicious application, and redirect return
        resolution: niji-variable-candidate
        result: TMP-TA0006-009-T1528-CHILD-RETURN
        reason: Fresh authority return has issuer/request/recipient traces without an existing token-object read.
      - source_cluster: service-account volume, Secret, repository, workspace, file, and persistent cache
        resolution: niji-variable-candidate
        result: TMP-TA0006-009-T1528-CHILD-ARTIFACT
        reason: Existing object read has stable reader, object version, mount, bytes, and copy-artifact telemetry.
      - source_cluster: process memory, environment, generated script, token broker, and job state
        resolution: niji-variable-candidate
        result: TMP-TA0006-009-T1528-CHILD-RUNTIME
        reason: Volatile state requires process or job provenance, memory or IPC access, and second-output detection.
      - source_cluster: OAuth, cloud provider, container platform, device, application, API, product, and token format
        resolution: not-stealth-distinct
        reason: Implementations span the three stable material positions and do not independently determine trace topology.
      - source_cluster: token presentation, relying-party acceptance, and resource activity
        resolution: adjacent-technique
        reason: T1550.001 and NJT-0061 own use and accepted entry; they corroborate possession but do not define acquisition path.
      - source_cluster: browser cookie session state
        resolution: adjacent-technique
        reason: T1539 owns cookie-semantic session material unless an independently evidenced API access-token role exists.
    candidate_stealth_axes_examined:
      - axis: authority return versus preexisting material
        result: formal
        children: [TMP-TA0006-009-T1528-CHILD-RETURN, TMP-TA0006-009-T1528-CHILD-ARTIFACT, TMP-TA0006-009-T1528-CHILD-RUNTIME]
      - axis: persisted object versus volatile runtime
        result: formal
        children: [TMP-TA0006-009-T1528-CHILD-ARTIFACT, TMP-TA0006-009-T1528-CHILD-RUNTIME]
      - axis: material validity, refreshability, audience/scope, and sender constraint
        result: parent-outcome-grade
        reason: These change risk and response but can occur in every acquisition position and do not produce exclusive siblings.
      - axis: delayed or context-aligned token use
        result: adjacent
        reason: Changes successor-use observation and belongs to T1550/NJT-0061 rather than acquisition.
      - axis: vendor, product, protocol, token syntax, and platform
        result: rejected
        reason: No stable independent stealth boundary.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 3
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        ATT&CK 零子项不设配额。本轮从 authority return、持久对象、易失 runtime、材料有效性、后继 use 和合法 delegation 开放搜索；前三项通过稳定位置、痕迹和防守差门槛，validity 作为跨子项结果等级，use/acceptance 让给相邻对象。三个子项均不得用后继 API 成功替代取得路径证据。
      en: >-
        ATT&CK's zero-child inventory sets no quota. Open search covered authority return, persisted object, volatile runtime, material usability, successor use, and legitimate delegation. The first three pass stable-location, trace, and defense-difference gates. Validity remains a cross-child outcome grade, while use and acceptance belong to adjacent objects. No child may use later API success as a substitute for acquisition-path evidence.
  evidence_coverage:
    parent_behavior_keys: [TMP-TA0006-009-T1528-REF-ATTACK, TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, REF-000178]
    boundary_keys: [TMP-TA0006-009-T1528-REF-RFC6749, REF-000070, REF-000178]
    mechanism_support:
      - mechanism_ref: NM-BT
        evidence_keys: [TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, TMP-TA0006-009-T1528-REF-GITHUB-RUNNER]
        confidence: medium
      - mechanism_ref: NM-FD
        evidence_keys: [TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, REF-000178]
        confidence: medium
    child_existence_support:
      - child_key: TMP-TA0006-009-T1528-CHILD-RETURN
        evidence_keys: [TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, TMP-TA0006-009-T1528-REF-AZURE-IMDS, TMP-TA0006-009-T1528-REF-RFC6749]
      - child_key: TMP-TA0006-009-T1528-CHILD-ARTIFACT
        evidence_keys: [TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, TMP-TA0006-009-T1528-REF-K8S-SA, TMP-TA0006-009-T1528-REF-GITHUB-RUNNER]
      - child_key: TMP-TA0006-009-T1528-CHILD-RUNTIME
        evidence_keys: [TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP, TMP-TA0006-009-T1528-REF-GITHUB-RUNNER]
    unsupported_or_deferred:
      - exact_initial_acquisition_path_for_CASE-000064
      - every_token_value_or_victim_in_TeamPCP_reporting
      - generic_cross-platform_process_memory_audit_fields
      - token_use_as_substitute_for_acquisition
      - automatic_assumption_that_a_valid_issuer_means_legitimate_recipient
      - guarantee_of_immediate_revocation_at_every_third_party_audience
  evidence_stage_review:
    - source_key: TMP-TA0006-009-T1528-REF-ATTACK
      direct: fixed parent behavior, no sub-techniques, implementation breadth, Credential Access mapping
      inference_limit: no automatic Niji taxonomy or event completion
    - source_key: TMP-TA0006-009-T1528-REF-UNIT42-TEAMPCP
      direct: IMDS credential harvesting, runner.worker plaintext token extraction, normal workflow continuation, exfiltration, and some successor token use
      inference_limit: not every token instance, path, issuer response, validity, or victim is public
    - source_key: REF-000178
      direct: compromised Drift OAuth tokens under attacker control, resource activity, access/refresh revocation and integration disablement
      inference_limit: initial acquisition path and token storage/runtime location are undisclosed
    - source_key: REF-000070
      direct: observed token theft/replay patterns and revocation propagation limitations in Microsoft environments
      inference_limit: cookie examples and later use cannot by themselves prove application-token acquisition path
    - source_key: TMP-TA0006-009-T1528-REF-RFC9700
      direct: standards controls for leakage, sender constraint, scope, refresh rotation, and family compromise
      inference_limit: no deployment or incident proof
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级研究稿分别回答 token 材料和完成点、取得与可用/使用分层、正规 token 外观和观察面分离、相邻材料对象、合法委派、场景、攻击者前提、防守字段与隐私。三个子项均按取得前材料位置和 path 建立，并提供独立检测字段、误报、盲区、缓解应用和证据限制；未按 OAuth、厂商、容器、设备、API 或产品拆分。
      en: >-
        The parent research separately addresses token material and completion, acquisition versus usability and use, legitimate token appearance and separated observation planes, adjacent material objects, legitimate delegation, scenarios, attacker prerequisites, defender fields, and privacy. Each child is based on material location immediately before acquisition and acquisition path, with distinct detection fields, false positives, blind spots, mitigation applications, and evidence limits. None is divided by OAuth, vendor, container, device, API, or product.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
      - YAML parsing
      - duplicate-key inspection
      - bilingual paragraph inspection
      - temporary-key referential audit
      - DET/NJA reciprocity and mitigation-target audit
  limitations:
    paragraphs:
      - zh: >-
          公开来源最强的是 TeamPCP 的 CI/CD 多路径取得和 UNC6395 的 token 已受损/被使用结果，两者证据问题不同。前者公开 IMDS、memory、部分 file/secret 行为但没有逐 token 完整清单；后者确认 token control 和撤销，却不披露最初取得位置。不能把后者资源查询反推为特定 cache 或 memory theft，也不能把前者不同波次和目标拼成每台受害主机的一条完整链。
        en: >-
          Public evidence is strongest for TeamPCP's multi-path CI/CD acquisition and UNC6395's compromised-and-used token result, but they answer different questions. The former exposes IMDS, memory, and some file or secret behavior without a complete per-token inventory. The latter confirms token control and revocation without disclosing initial material location. Its resource queries cannot be reverse-inferred as a specific cache or memory theft, and TeamPCP's waves and targets cannot be spliced into one chain for every victim host.
      - zh: >-
          许多 issuer、SaaS 和 runtime 不记录可安全关联的 token ID；opaque token 不能解码，JWT jti 也不一定存在或唯一。通用日志禁止保存 raw token，HMAC fingerprint 又要求在受限本地边界生成。字段缺失时，防守方可能分别证明未授权 read、异常 issuance 或后继 use，却无法证明它们属于同一 token 实例；结论应显式降级。
        en: >-
          Many issuers, SaaS providers, and runtimes do not expose a safely joinable token ID. Opaque tokens cannot be decoded, and JWT jti may be missing or nonunique. General logs must not retain raw tokens, while HMAC fingerprints must be generated within a restricted local boundary. With missing fields, defenders may separately establish an unauthorized read, anomalous issuance, or successor use without proving they refer to one token instance, and conclusions must explicitly downgrade.
      - zh: >-
          撤销语义随 access/refresh token、Cookie、workload credential、Kubernetes TokenRequest 和第三方集成而异。Microsoft 说明 refresh revoke 后 access token 可持续到期，Kubernetes bound token 依 Pod 删除失效，供应商集成还需跨客户和各 connected system 处理。固定窗口只能是实施起点；正式 Analytic 必须按 provider SLA、最大 TTL、cache 和 audience 能力校准，并避免用真实被盗 token 做破坏性测试。
        en: >-
          Revocation semantics differ across access and refresh tokens, cookies, workload credentials, Kubernetes TokenRequest, and third-party integrations. Microsoft notes that access tokens may remain valid until expiry after refresh revocation. Kubernetes bound tokens expire with Pod deletion, and vendor integrations require action across customers and connected systems. Fixed windows are implementation starting points only. Formal analytics must calibrate provider SLA, maximum TTL, cache, and audience capability and avoid destructive testing with real stolen tokens.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason:
        zh: Token 可能是 opaque、JWT 或被归档加密，但材料格式或后续封装不构成取得行为本身的稳定匿迹因果；本批只记录观察面分离与正规实体外观。
        en: A token may be opaque, a JWT, or placed in an encrypted archive, but material format or follow-on packaging is not stable stealth causality of acquisition itself; this batch records observation-plane separation and legitimate-entity appearance.
    - mechanism_ref: NM-ST
      reason:
        zh: 延迟使用、分批外传和短寿 token 会影响窗口，却属于后继使用/传输或材料属性；现有来源没有证明取得动作通过时间或空间稀释形成独立变量。
        en: Delayed use, batched exfiltration, and short-lived tokens affect windows but belong to successor use or transfer or material properties. Available sources do not establish temporal or spatial dilution of acquisition as an independent variable.
  open_questions:
    - 能否获得 CASE-000064 对应供应商事件的结论级材料，明确 Drift token 最初从持久 store、运行态还是签发/refresh 返回面离开控制？
    - 目标 IdP、SaaS、IMDS 与 CI/CD 是否提供可安全连接 request、token family/reference 和 recipient process 的字段，而无需保存 raw token？
    - 哪些 relying party 支持 provider introspection、continuous access evaluation 或 sender-constrained token，撤销预期生效时间如何按 audience 记录？
    - 主 Agent 是否接受 MIT-000066 只扩展到 CHILD-RETURN 的 connected-app 子集，或因应用对整个子项覆盖不完整而仅保留 planning 建议？
