    statement_zh: 受信签发上下文挟持以真实控制者与请求身份、代表权限及批准意图脱节为稳定变量，保留正常签发外观而把区分信息移到来源和授权关联。
    statement_en: Trusted Enrollment-Context Hijacking separates the real controller from request identity, delegated authority, and approval
      intent, preserving normal issuance appearance while shifting discriminating evidence to provenance and authorization correlation.
    subject_refs:
    - TMP1649-P
    - TMP1649-S1
    evidence_refs:
