    statement_zh: 公开证书读取不等于私钥控制；导出命令或容器存在也不能代替可用私钥与输出控制证据。
    statement_en: Reading a public certificate does not establish private-key control, and an export invocation or container cannot replace
      evidence of a usable private key and output control.
    subject_refs:
    - TMP1649-P
    evidence_refs:
    - TMP1649-export
    - TMP1649-paper
    evidence_mode: strongly-inferred
    confidence: high
    temporary_key: TMP1649-CLM2
