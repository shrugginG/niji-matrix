  cases:
  - schema_version: 1.0.0
    type: case
    name_zh: 微软调查的 ESC1 与 ESC8 认证证书取得
    name_en: Microsoft-Investigated ESC1 and ESC8 Authentication-Certificate Acquisition
    actor_or_campaign: null
    subject_refs:
    - TMP1649-P
    - TMP1649-S1
    description_zh: 微软 2026-10-30 原始调查报告记录两条未归因入侵链：一条通过宽模板取得高权账户认证证书，另一条把域控 NTLM 中继到 Web Enrollment，取得域控证书并以 PKINIT 获得 TGT。后者支持可用私钥证明能力，不证明公开私钥字节、特定
      PFX 导出或服务外构造。报告明确存在检测、自动阻断和客户隔离，不能作为无告警匿迹效果证明。
    description_en: 'Microsoft''s original report of 2026-10-30 describes two unattributed intrusions: one acquired privileged-account certificates
      through an overly permissive template; the other relayed domain-controller NTLM to Web Enrollment, obtained a DC certificate, and used
      PKINIT to obtain a TGT. The latter supports usable private-key proof capability, not disclosure of key bytes, a particular PFX export,
      or off-service construction. Detection, automated disruption, and customer isolation were reported, so the case does not establish
      alert-free evasion.'
    time_range: null
