handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-010
work_item_ref: WORK-TA0006-T1649
temporary_key_prefix: TMP1649
candidate:
  source_type: attack
  source_attack_id: T1649
  name:
    zh: 认证证书控制取得与构造
    en: Authentication-Certificate Control Acquisition and Construction
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: 固定父行为符合凭据获取，原始技术研究和真实事件支持认证证书与私钥控制的取得。适配明确公开证书、私钥控制、可信签发、服务外构造、认证接受与资源访问的独立证据责任，并以控制者和签发生命周期的关系建立原生分类，避免按产品、容器或工具照搬。可信签发子项有真实事件，服务外构造主要由实现与实验支持，机理置信度保持
        medium。
      en: The fixed parent fits Credential Access, with original research and incidents supporting acquisition of authentication certificates
        and private-key control. Adaptation separates evidence for public certificates, key control, trusted issuance, off-service construction,
        acceptance, and resource access. Native taxonomy follows controller and issuance-lifecycle relationships rather than products, containers,
        or tools. Trusted enrollment has incident support, while off-service construction relies chiefly on implementation and experiments,
        keeping mechanism confidence medium.
proposed_content:
  summary:
    zh: 攻击者取得认证证书对应的私钥控制，或通过受信签发与签名能力获得可冒充主体的证书，改变材料来源与认证证据的关联。
    en: Adversaries acquire control of authentication-certificate private keys or obtain impersonating certificates through trusted enrollment
      or signing capability, changing the link between provenance and authentication evidence.
  definition_and_concept:
    paragraphs:
    - zh: 认证证书控制取得与构造是攻击者获得可代表用户、设备或服务完成证书认证的材料与控制能力，或构造可能被既有信任关系接受的认证证书。直接目标包括既有终端证书的相应私钥和受信签发上下文返回的证书结果；受信签名能力还可用于服务外构造新的主体证书。证书载有公钥和身份声明，通常可公开分发；身份冒充依赖相应私钥控制、被接受的身份绑定和依赖方验证条件。
      en: Authentication-Certificate Control Acquisition and Construction obtains the material and control needed to authenticate as a user,
        device, or service, or constructs certificates potentially accepted under existing trust. Immediate targets include private keys
        for existing end-entity certificates and results returned through trusted enrollment contexts. Trusted signing capability can also
        construct new subject certificates outside the service. Certificates contain public keys and identity statements and are ordinarily
        public; impersonation depends on corresponding private-key control, accepted identity binding, and relying-party verification.
    - zh: 材料发现、私钥控制、签发或构造、私钥证明、认证接受和资源访问是独立阶段。发现证书文件不证明秘密取得，密钥读取事件不证明导出，签发成功不证明攻击者持有私钥，成功 PKINIT 也不解释材料来源。只有 CA 私钥暴露而没有新主体证书形成时，尚不足以证明服务外构造；将这些阶段分开才能避免把前置能力和后继结果拼成未观察到的完整链。
      en: Material discovery, private-key control, issuance or construction, proof of possession, authentication acceptance, and resource
        access are separate stages. Finding a certificate does not establish secret acquisition, a key read does not prove export, issuance
        does not establish adversary key possession, and successful PKINIT does not explain provenance. CA-key exposure without a new subject
        certificate is insufficient to establish off-service construction. Separating these stages prevents assembling prerequisites and
        successor results into an unobserved complete chain.
  stealth_characteristics:
    paragraphs:
    - zh: 认证证书控制取得与构造的核心矛盾是，依赖方可正确验证签名和密钥证明，却仍无法仅从这一结果识别实际操作者或组织批准意图。既有证书私钥被借用时保留原身份外观；被挟持的注册上下文仍可留下正常批准与签发记录；服务外签名则使依赖方可能接受的新材料缺少对应权威事务。
      en: The central tension in Authentication-Certificate Control Acquisition and Construction is that correct signature and key-proof
        verification need not identify the actual operator or organizational approval. Borrowing an existing certificate key preserves its
        original identity appearance. Hijacked enrollment can retain ordinary approval and issuance records, while off-service signing can
        create potentially accepted material without an authority transaction.
    - zh: 密钥访问、请求来源、模板与授权状态、证书指纹、主体映射和认证结果仍是残余痕迹。只观察签名有效、签发成功或登录成功的局部规则难以恢复材料来源，需要跨保管、签发和接受面理解。原始技术研究支持这种观察差异，真实事件支持签发滥用，但两者都不能证明通用规避率或所有平台上的无告警效果。
      en: Residual traces include key access, request origin, template and authority state, fingerprints, subject mappings, and authentication
        outcomes. Local rules observing only valid signatures, successful issuance, or successful sign-ins have difficulty recovering provenance
        and require custody, issuance, and acceptance context. Original research supports this observation difference and incidents support
        enrollment abuse, but neither establishes universal evasion rates or alert-free operation across platforms.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入既有认证证书私钥控制的取得、通过不符合组织批准意图的受信上下文取得认证证书，以及使用受信签名能力构造认证证书。证据应支持认证用途、对应私钥控制或可用构造结果；仅有公开证书、弱模板、管理员权限、导出调用或一次成功登录不足以证明取得。合法备份、迁移、自动注册、代理代办和恢复会产生相似痕迹，需核对所有者、请求控制、目标身份、批准范围和输出保管。
      en: Include acquisition of private-key control for existing authentication certificates, acquisition through trusted enrollment inconsistent
        with organizational approval, and construction using trusted signing capability. Evidence must support authentication purpose and
        corresponding key control or a usable construction result. A public certificate, weak template, administrative privilege, export
        invocation, or successful sign-in alone is insufficient. Legitimate backup, migration, autoenrollment, delegation, and recovery require
        checks of ownership, request control, subject, approved scope, and output custody.
    - zh: 受管理保管库取用、OS 认证秘密提取和未保护文件中的秘密暴露各有相邻对象；存储路径结果与认证证书材料结果可以分别举证。应用令牌取得、Web 或联合断言构造、认证组件修改、账户认证器增补和有效身份使用不由证书格式统一接管。KDC 在正常 PKINIT 中签发
        TGT 不等于 Kerberos 票据伪造。
      en: Managed-store retrieval, OS authentication-secret extraction, and unprotected-file exposure are neighboring behaviors; storage-path
        and certificate-material outcomes can be independently supported. Application-token acquisition, web or federation assertion construction,
        authentication-component changes, account-authenticator additions, and valid-identity use do not transfer ownership merely because
        certificates are involved. Normal KDC issuance of a TGT during PKINIT is not Kerberos ticket forgery.
    - zh: 仅用于 C2 加密、服务器 TLS、内容签名或根信任安装的证书行为不属于本项。借用公开 CA 证书但未掌握签名私钥不能构造可信身份材料；仅调用已有不可导出密钥完成一次认证也不能自动证明独立的凭据取得路径。
      en: Certificate behavior solely for C2 encryption, server TLS, content signing, or root installation is outside scope. Borrowing a
        public CA certificate without its signing key does not enable trusted identity construction, and invoking an existing non-exportable
        key for an authentication does not automatically establish an independent acquisition path.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已控制用户或服务上下文后可能寻找认证密钥权限，利用过宽模板或被中继身份获取新证书，或在签发者失守后离开原 CA 主机继续构造身份材料。用户、设备、服务和工作负载只是认证主体。证书在口令变化后可能仍有效，使取得结果能服务于后继身份冒充，但是否持续访问必须另证。
        en: After compromising a user or service context, an adversary may examine authentication-key permissions, obtain certificates through
          broad templates or relayed identities, or continue constructing identity material away from a compromised CA. Users, devices, services,
          and workloads are subjects rather than partitions. Certificates can remain valid after password changes and support successor impersonation,
          while continued access requires separate evidence.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少需访问现有私钥、控制有用的注册身份或代理权限，或获得被目标认可的签名能力；知道证书内容不足。用户解锁、服务 ACL、DPAPI、硬件隔离和操作授权限制私钥访问，模板用途、审批、EPA 与主体强映射限制签发。
          en: The adversary needs access to an existing private key, useful enrollment identity or delegation, or signing capability recognized
            by the target; certificate contents alone are insufficient. Unlock state, service ACLs, DPAPI, hardware isolation, and operation
            authority constrain key access, while usage, approval, EPA, and strong mapping constrain issuance.
        - zh: 服务外构造还须满足目标实际执行的链、用途、主体、期限和撤销验证。软件不可导出标志不等同硬件保证，硬件防复制也不代表已获准调用者不会滥用；本对象不预设已证明任意远程硬件调用或任意主体成功。
          en: Off-service construction must also satisfy actual chain, usage, subject, validity, and revocation checks. Software non-exportability
            is not hardware assurance, and copy-resistant hardware does not prevent all misuse by an authorized caller. The technique assumes
            neither proven arbitrary remote hardware invocation nor arbitrary-subject success.
      defender_model:
        paragraphs:
        - zh: 防守方需要分开观察密钥保管、签发服务、目录授权、认证接受和资源使用。CA 请求事件提供事务线索，模板、SAN、EKU、指纹与完整身份绑定往往需要 CA 数据库及证书解析。认证侧可保留证书标识和结果，但这些字段并非所有认证路径都具有。
          en: Defenders need separate visibility into key custody, enrollment services, directory authority, authentication acceptance, and
            resource use. CA request events provide transaction leads, while templates, SANs, EKUs, fingerprints, and complete identity binding
            often require database and certificate enrichment. Authentication can preserve certificate identifiers and outcomes, but not
            every path exposes them.
        - zh: KSP 日志受 Provider、调用路径与审计配置约束，无法覆盖全部原始文件复制、离线快照、第三方硬件或远程签名。历史签发清单、批准范围和采集完整性必须足够长久且独立保留，否则看不到签发对应项只说明观察不足。
          en: KSP logs depend on providers, access paths, and audit configuration and cannot cover all raw copies, offline snapshots, third-party
            hardware, or remote signing. Historical issuance, approval scope, and collection completeness need durable independent retention;
            otherwise an absent issuance counterpart establishes only insufficient observation.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 受信身份与签名借用正常认证凭据外观
      en: Trusted identities and signatures borrow ordinary credential appearance
    analysis:
      paragraphs:
      - zh: 攻击者沿受信注册路径取得材料或借用已有签名信任，使证书满足局部格式和密码学验证。传感器看到正常身份或有效签名时，真实操作者与批准用途的差异落在请求来源、代理范围和主体绑定中。事件与原始实现支持这种合法特征借用，不能据此量化通用检测收益。
        en: Adversaries acquire material through trusted enrollment or borrow existing signing trust so certificates satisfy local formatting
          and cryptographic checks. When sensors see familiar identities or valid signatures, differences in actual operator and approved
          purpose reside in request origin, delegation scope, and subject binding. Incidents and original implementations support borrowing
          these legitimate features without quantifying a universal detection benefit.
    confidence: medium
    evidence_keys:
    - TMP1649-incident
    - TMP1649-forge
    - TMP1649-processing
    - TMP1649-mapping
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 服务外构造省略正常权威签发事务
      en: Off-service construction omits normal authority issuance transactions
    analysis:
      paragraphs:
      - zh: 受信签名能力可在权威服务之外生成新证书，不经历正常请求接收、策略判断与数据库发布。仅监控签发端的规则因此看不到这次构造，而接受端仍可能记录证书认证。该差异由原始实现与正常服务语义共同支持；缺日志仍需排除采集、迁移和保留问题。
        en: Trusted signing capability can generate new certificates outside the authority without normal reception, policy evaluation, and
          database publication. Issuer-only rules consequently cannot observe that construction even though acceptance-side authentication
          may remain visible. Original implementation and normal-service semantics support the difference, while absent logs still require
          ruling out collection, migration, and retention problems.
    confidence: medium
    evidence_keys:
    - TMP1649-forge
    - TMP1649-processing
    - REF-000854
proposed_subtechniques:
- schema_version: 2.0.0
  type: evasion-subtechnique
  parent_ref: TMP1649-P
  name:
    zh: 受信签发上下文挟持
    en: Trusted Enrollment-Context Hijacking
  summary:
    zh: 借用被签发服务接受的身份或代表权限取得认证证书，使正常签发记录不足以识别实际控制者及批准用途。
    en: Obtain authentication certificates through accepted identities or delegated authority, making normal issuance records insufficient
      to establish the actual controller and approved purpose.
  aliases: []
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 受信签发上下文挟持通过攻击者控制的请求路径、被借用身份或越过批准范围的代表权限，让 CA 正常返回可用于目标主体认证的证书。服务可依自身配置正确签名并记录，却未可靠绑定实际控制者、被表示身份与组织授权意图。取得结果还须对应攻击者可控制的私钥证明能力，而非仅有公开证书副本。
      en: Trusted Enrollment-Context Hijacking uses an adversary-controlled request path, borrowed identity, or delegated authority outside
        approval to make a CA return a certificate usable for a target subject. The service may correctly sign and record under its configuration
        while failing to bind the real controller, represented identity, and organizational intent. Acquisition also requires corresponding
        key-proof capability under adversary control rather than only a public certificate copy.
    - zh: 不同实现可以改变请求主体、代理人群或所声称身份，但都保留真实的权威签发事务。模板滥用、认证中继和越界代理注册因此是同一稳定变量的实现参考；具体工具、产品和模板名称不决定子技术身份。
      en: Implementations can change request identity, delegated population, or claimed subject while retaining a genuine authority transaction.
        Template abuse, authentication relay, and out-of-scope delegation are implementations of this variable; tools, products, and template
        names do not define the child.
  stealth_characteristics:
    paragraphs:
    - zh: 受信签发上下文挟持保留真实签发者、有效证书和成功记录，使只检查证书链或签发结果的观察与正常注册相容。真正的区别转移到来源路径、代表关系、主体声明、模板范围与批准记录，需要跨面解释，而非把成功事件当成安全结论。
      en: Trusted Enrollment-Context Hijacking retains a real issuer, valid certificate, and success record, making chain or issuance-result
        checks compatible with ordinary enrollment. Discriminating evidence moves to ingress provenance, delegation, subject claims, template
        scope, and approval records and requires cross-plane interpretation rather than treating success as a benign verdict.
    - zh: 请求身份、网络来源、返回材料和后继认证仍可能留下关联证据。公开事件包含检测、自动阻断与隔离，支持实际滥用而不证明攻击者完全避开监测；强化主体映射和受众绑定也可能在材料返回前阻止某些实现。
      en: Request identity, network origin, returned material, and successor authentication can remain correlatable. Public incidents include
        detection, disruption, and isolation, supporting actual abuse without establishing complete evasion. Stronger subject mapping and
        audience binding can also stop some implementations before material return.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入须连接被滥用上下文、真实请求、已返回认证证书和相应私钥控制能力。弱模板、代理权限、一次中继连接或成功 HTTP 响应仅是线索。正常自动注册、集中部署、批准 Enrollment Agent 和灾备也可有请求者与主体不同的现象，应以获准人群、模板、来源、输出保管与批准期限排除。
      en: Inclusion connects an abused context, actual request, returned authentication certificate, and corresponding key control. A weak
        template, delegation right, relay connection, or successful HTTP response is only a lead. Autoenrollment, deployment, approved Enrollment
        Agents, and recovery can also differ in requester and subject and require checks of allowed populations, templates, origins, custody,
        and approval periods.
    - zh: 材料在权威服务之外新构造时归兄弟项；只改变模板、目录映射或认证组件而尚未产生材料结果，属于前置状态变化。取得后提交证书和使用被接受身份是独立阶段，不能由后继资源访问反推某种请求路径。
      en: New material constructed outside the authority belongs to the sibling. Template, directory-mapping, or authentication-component
        changes without material outcomes remain antecedent state changes. Certificate presentation and use of accepted identity are separate
        stages, and resource access cannot backfill a particular enrollment path.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 已控低权身份可能接触过宽注册模板，被迫或被截获的认证上下文可能被转向签发端点，受信代理也可能为越界主体代办。三类情形的共同点是权威服务实际签发，而真实请求控制与批准目的偏离；这不同于单纯观察模板权限或拥有管理员账户。
        en: A compromised low-privilege identity may reach an overly broad template, coerced or intercepted authentication may be redirected
          to an enrollment endpoint, or a trusted agent may enroll an out-of-scope subject. Each requires actual authority issuance with
          request control departing from approval, unlike merely observing template permissions or possessing an administrator account.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需具有可接受的请求身份、代理能力或中继条件，以及提交与取得结果的路径，并控制返回证书对应私钥或可用证明能力。身份来源、用途、审批、代理范围、EPA 和当前强映射限制可利用组合。攻击者不因知道证书 SAN 或拿到公钥证书就自动具有认证能力。
          en: The adversary needs an accepted requesting identity, delegation, or relay condition; a submission and retrieval path; and control
            of the returned certificate key or usable proof capability. Identity sources, usage, approval, agent scope, EPA, and current
            strong mapping constrain combinations. Knowing a SAN or obtaining the public certificate does not automatically grant authentication
            capability.
      defender_model:
        paragraphs:
        - zh: 防守方需分别保留请求者、被表示主体、代理授权、真实接入来源和批准目的，通过 CA 实例和 Request ID 连接请求、数据库与证书。旧事件可能缺少模板、SAN 或指纹，代理与 NAT 也影响来源解释。后继成功认证增强可用性证据，却不能代替对请求上下文被挟持的调查。
          en: Defenders need requester, represented subject, delegation, real ingress origin, and approval purpose separately, joining requests,
            databases, and certificates by CA instance and request ID. Older events can omit templates, SANs, or fingerprints, while proxies
            and NAT complicate origin interpretation. Later success strengthens usability evidence without replacing investigation of hijacked
            enrollment context.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 正常签发身份保留合法注册外观
      en: Normal issuer identities retain legitimate enrollment appearance
    analysis:
      paragraphs:
      - zh: 攻击者让服务按其可接受身份与权限产生真实证书，熟悉请求者和签发成功因此遮住真实控制与批准范围的偏离。差异仍存在于接入来源、代表关系和主体绑定中。正常服务语义与实际入侵共同支持此观察影响，而合法代理的相同表象要求结合业务批准解释。
        en: The adversary makes the service issue genuine certificates under an acceptable identity and authority, so a familiar requester
          and issuance success conceal differences in actual control and approved scope. Differences remain in ingress origin, delegation,
          and subject binding. Normal-service semantics and incidents support this observation effect, while identical appearances from legitimate
          agents require business-approval context.
    evidence_refs:
    - TMP1649-processing
    - TMP1649-incident
    - TMP1649-administration
    - TMP1649-mapping
    - REF-000708
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1649-DET1
    mitigations:
      coverage: available
      mitigation_refs:
      - TMP1649-MIT1
      - MIT-000132
  evidence:
    claim_refs:
    - TMP1649-CLM3
    - TMP1649-CLM5
    - TMP1649-CLM10
    case_refs:
    - TMP1649-CASE1
    reference_refs:
    - TMP1649-processing
    - TMP1649-incident
    - TMP1649-administration
    - TMP1649-mapping
    - REF-000708
    - TMP1649-forge
  research:
    limitations:
      paragraphs:
      - zh: 真实事件支持弱模板或中继导致证书取得，并以 PKINIT 支持可用私钥证明，但未公开全部私钥字节、输出容器或代理调用细节。不同签发实现不能仅凭最终认证成功互相替代；案例未证明整个行动无告警或该变量在各产品中有相同规避效果。
        en: Incidents support acquisition through weak templates or relay and usable key proof through PKINIT without disclosing all key
          bytes, output containers, or delegation details. Final authentication cannot substitute one issuance path for another, and the
          cases establish neither an alert-free chain nor equal evasion across products.
      - zh: 可实施分析主要针对 AD CS，依赖请求历史、授权快照与可解析证书。集中注册与来源代理会产生正常身份差，强映射补丁也改变历史方法的可用性；其他 PKI 若不提供等价请求与批准链，不应直接照搬数据假设。
        en: Implementable analysis principally targets AD CS and depends on request history, authority snapshots, and parsed certificates.
          Centralized enrollment and origin proxies create benign identity differences, and strong-mapping patches change historical feasibility.
          Other PKIs without equivalent request and approval lineage require revised data assumptions.
  temporary_key: TMP1649-S1
- schema_version: 2.0.0
  type: evasion-subtechnique
  parent_ref: TMP1649-P
  name:
    zh: 脱离签发链的认证证书构造
    en: Off-Issuance-Chain Authentication-Certificate Construction
  summary:
    zh: 在权威服务之外用受信签名能力构造认证证书，使材料生成不进入正常请求与签发记录链。
    en: Use trusted signing capability outside the authority service to construct authentication certificates whose generation bypasses normal
      request and issuance records.
  aliases: []
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 脱离签发链的认证证书构造利用已受信签发者的私钥或等价签名能力，不调用该服务正常请求与审批流程而形成新的主体认证证书。技术身份是新材料在权威服务之外产生，而非证书格式、签名算法或程序名称；只有窃取已有终端证书不是新证书构造。
      en: Off-Issuance-Chain Authentication-Certificate Construction uses a trusted issuer's key or equivalent signing capability to form
        a new subject certificate without the service's normal request and approval flow. Its identity is off-authority generation rather
        than certificate format, algorithm, or program name. Theft of an existing end-entity certificate is not construction of a new one.
    - zh: 拥有 CA 私钥只是条件，形成的材料能否用于认证还取决于目标的链、用途、主体映射、有效期与撤销验证。独立构造证据与实际接受需要分开保留；没有正常签发记录的登录不能独自说明证书来自哪里。
      en: Possession of a CA key is a prerequisite, while authentication usability depends on chain, purpose, subject mapping, validity,
        and revocation checks. Independent construction evidence and actual acceptance must be retained separately; a sign-in without a located
        issuance record does not by itself establish provenance.
  stealth_characteristics:
    paragraphs:
    - zh: 脱离签发链的认证证书构造保留可能被依赖方认可的签名，却把关键生成行为放在正常 CA 请求接收、策略判断与数据库记录之外。只监控签发端的规则因此看不到这次构造，认证端则可能仍产生带证书标识的请求。
      en: Off-Issuance-Chain Authentication-Certificate Construction retains a potentially accepted signature while moving generation outside
        normal CA reception, policy checks, and database recording. Issuer-only rules therefore miss that construction, while authentication
        can still record a certificate-bearing request.
    - zh: 关键残余差异是证书接受与完整历史签发库存之间的连续性，而非最近是否有一条签发事件。签发者身份、序列号、指纹、源主机与密钥暴露可支持调查；库存迁移、保留和采集不完整会产生同样缺失，必须保留这一限制。
      en: The critical residual difference is continuity between certificate acceptance and complete historical issuance rather than whether
        a recent issuance event exists. Issuer identity, serial, fingerprint, source host, and key exposure can support investigation, while
        migration, retention, and collection gaps can create the same absence and must remain explicit limitations.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求有新证书形成和受信签名来源的证据；只有密钥访问或缺少签发对应项的认证仍为线索。合法离线 CA 经批准签发、受控恢复、外部签发者与迁移前历史不能因本机无记录而归类。该项不要求删除任何原始日志，构造从未经过正常服务即可产生观察差。
      en: 'Inclusion requires evidence of a newly formed certificate and trusted signing provenance; key access or authentication without
        a located issuance counterpart remains a lead. Approved offline-CA issuance, recovery, external authorities, and pre-migration history
        are not included merely because local records are absent. Log deletion is unnecessary: bypassing the normal service itself creates
        the observation difference.'
    - zh: 正常 CA 服务内的恶意注册属于兄弟项；终端私钥取得属于父级核心；Web 断言签名、账户公钥登记和根信任变更各有相邻对象。CA 私钥暴露本身并不证明此项，也不预设所有硬件保护密钥均可被复制或远程调用。
      en: Malicious enrollment inside the normal CA belongs to the sibling; end-entity key acquisition is parent core; web-assertion signing,
        account-public-key registration, and root-trust changes are neighboring behaviors. CA-key exposure alone does not establish this
        child, which assumes neither copyability nor remote invocation of every hardware-protected key.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 高信任签发能力失守后，攻击者可能离开原 CA 主机，在自己控制的环境中形成新的主体证书。构造与使用可跨越较长时间，失守后的权威服务可能仍正常运行；原始实现支持这一能力，本研究没有独立验证使用该精确子项的真实恶意事件。
        en: After trusted signing capability is compromised, an adversary may form new subject certificates away from the original CA. Construction
          and use can be separated substantially while the authority continues operating normally. Original implementation supports the capability,
          but this research has not independently verified a malicious incident demonstrating this exact child.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需掌握目标信任的签名能力，并形成满足目标身份绑定和验证条件的证书及相应私钥证明。公开 CA 证书不足，历史工具演示也不能保证当前强映射下成功。硬件保护可以阻止密钥复制；若另有签名接口滥用，需对其授权和输出独立举证。
          en: The adversary needs signing capability trusted by the target and a certificate and key proof satisfying its identity binding
            and validation. A public CA certificate is insufficient, and historical demonstrations do not guarantee current strong-mapping
            success. Hardware can prevent copying; any separate signing-interface abuse requires independent authority and output evidence.
      defender_model:
        paragraphs:
        - zh: 防守方需持久保存独立签发库存与签发者密钥身份，理解退休、迁移、外部或离线 CA 及数据库清理范围。4768 可提供部分 PKINIT 证书标识，其他依赖方可能没有等价字段。同名签发者不能直接合并，序列号和指纹算法必须与原始证书一致。
          en: Defenders need durable independent issuance inventory and issuer-key identity with known retirement, migration, external or
            offline authorities, and database-pruning scope. Event 4768 provides identifiers for some PKINIT use; other relying parties may
            lack equivalents. Same-named issuers must not be merged blindly, and serial representations and fingerprint algorithms must match
            raw certificates.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 新证书生成不进入正常签发观察面
      en: New certificate generation bypasses normal issuance observation
    analysis:
      paragraphs:
      - zh: 服务外签名不调用正常请求与数据库发布，因此签发端的成功、拒绝和审批监控没有相应事务。接受端若仍信任该签名，其证书请求与完整库存间的缺口成为残余观察。原始实现直接支持记录差异；检测仍须先排除库存不全，不能把缺日志本身强化为已经伪造。
        en: Off-service signing invokes no normal request or database publication, leaving issuer-side success, denial, and approval monitoring
          without a transaction. If acceptance still trusts the signature, the difference against complete inventory becomes residual evidence.
          Original implementation directly supports the record difference, but analysis must exclude incomplete inventory before treating
          absence as construction.
    evidence_refs:
    - TMP1649-forge
    - TMP1649-processing
    - REF-000854
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 受信签名延续证书的合法验证外观
      en: Trusted signatures preserve ordinary certificate-validation appearance
    analysis:
      paragraphs:
      - zh: 新材料借用仍被目标认可的签发密钥，使局部签名验证与正常证书相似。区别在真实签发授权和材料谱系，而不在简单的密码学有效/无效二分。当前强映射、用途和撤销可以拒绝构造材料，因此合法签名外观不是无条件的认证成功。
        en: New material borrows an issuer key still recognized by the target, resembling ordinary certificates under local signature checks.
          Differences concern issuance authority and provenance rather than a simple valid-or-invalid cryptographic split. Current mapping,
          usage, and revocation can reject the material, so legitimate signature appearance does not imply unconditional authentication success.
    evidence_refs:
    - TMP1649-forge
    - TMP1649-mapping
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1649-DET2
    mitigations:
      coverage: available
      mitigation_refs:
      - TMP1649-MIT2
  evidence:
    claim_refs:
    - TMP1649-CLM4
    - TMP1649-CLM5
    - TMP1649-CLM6
    - TMP1649-CLM9
    - TMP1649-CLM10
    case_refs: []
    reference_refs:
    - TMP1649-forge
    - TMP1649-processing
    - REF-000854
    - TMP1649-certutil
    - TMP1649-mapping
    - TMP1649-incident
    - TMP1649-administration
    - TMP1649-ca
    - REF-000499
  research:
    limitations:
      paragraphs:
      - zh: 本子项成立性主要来自原始实现与实验，未独立核实对应的恶意在野事件，因此不以兄弟项的真实签发案例为其背书。可构造、可被接受和真实获得资源是不同结论，缺少后两者时不应扩写为全面认证绕过。
        en: The child is supported principally by original implementation and experiments, without independently verified matching malicious
          incidents. The sibling's real enrollment cases do not support it. Constructibility, acceptance, and actual resource access are
          different conclusions; absence of the latter two does not justify a universal authentication-bypass claim.
      - zh: 未知证书未必可从正常 CA 请求库逐一枚举，响应要评估失守签发者与依赖方信任，不能宣称绝对不可撤销。库存不完整、未观测认证路径、受信签名者同时控制监控及历史配置差异都会限制调查；检测效能尚无统一公开测量。
        en: Unknown certificates may not be enumerable from normal CA requests, requiring response at compromised-issuer and relying-party
          trust boundaries without claiming absolute irrevocability. Incomplete inventory, unobserved authentication paths, monitoring compromise
          by the signer, and historical configuration differences limit investigation. No universal public detection measurement is established.
  temporary_key: TMP1649-S2
defense_candidates:
  detection_strategies:
  - schema_version: 2.0.0
    type: detection-strategy
    name:
      zh: 签发身份主体与批准意图关联
      en: Enrollment Identity Subject and Approval-Intent Correlation
    summary:
      zh: 识别正常签发事务中请求者、目标身份与批准用途的脱节。
      en: Identify differences among requesters, represented identities, and approved purpose within normal issuance.
    description:
      paragraphs:
      - zh: 该策略连接真实请求、签发数据库、解析证书与历史授权范围，关注 CA 技术上接受请求却不符合组织批准意图的情形。后继证书认证只增强可用性判断，不代替对请求控制者与授权的核查。
        en: This strategy joins actual requests, issuance databases, parsed certificates, and historical authority to identify enrollment
          accepted technically by a CA but inconsistent with organizational approval. Successor certificate authentication strengthens usability
          assessment without replacing investigation of request control and authorization.
    detects_refs:
    - TMP1649-P
    - TMP1649-S1
    domains:
    - enterprise
    analytic_refs:
    - TMP1649-NJA1
    evidence_refs:
    - TMP1649-processing
    - TMP1649-incident
    - TMP1649-administration
    - TMP1649-certutil
    - TMP1649-mapping
    - REF-000708
    - REF-000854
    temporary_key: TMP1649-DET1
  - schema_version: 2.0.0
    type: detection-strategy
    name:
      zh: 认证接受与完整签发谱系差分
      en: Authentication Acceptance and Complete Issuance-Lineage Differential
    summary:
      zh: 将证书认证与长期可信签发库存比较，保留不明谱系与采集缺口的区别。
      en: Compare certificate authentication with durable trusted issuance inventory while separating unexplained lineage from collection
        gaps.
    description:
      paragraphs:
      - zh: 该策略把依赖方已经观察到的证书回连完整签发历史。它针对服务外构造可能造成的记录断裂，但不把找不到日志直接当成伪造；库存完整性、外部签发者和迁移历史是结论成立的条件。
        en: This strategy links a certificate observed by a relying party to complete issuance history. It addresses discontinuity potentially
          caused by off-service construction without treating a missing log as forgery; inventory completeness, external issuers, and migration
          history are conditions of the conclusion.
    detects_refs:
    - TMP1649-P
    - TMP1649-S2
    domains:
    - enterprise
    analytic_refs:
    - TMP1649-NJA2
    evidence_refs:
    - TMP1649-forge
    - TMP1649-processing
    - REF-000854
    - TMP1649-certutil
    temporary_key: TMP1649-DET2
  - schema_version: 2.0.0
    type: detection-strategy
    name:
      zh: 认证私钥操作与材料结果分级
      en: Authentication Private-Key Operations and Material-Outcome Grading
    summary:
      zh: 区分密钥访问线索、可携材料形成、攻击者控制与后继认证。
      en: Separate key-access leads, portable-material creation, adversary control, and successor authentication.
    description:
      paragraphs:
      - zh: 该策略直接覆盖既有终端认证私钥的取得，并把 CA 私钥暴露保留为构造能力线索。KSP 成功事件只证明相应操作，材料内容与实际控制必须由输出验证或受控调查补齐，不能由进程名或 PFX 后缀替代。
        en: This strategy directly covers acquisition of existing end-entity authentication keys and retains CA-key exposure as a construction-capability
          lead. A successful KSP event establishes its operation only; output validation or controlled investigation must establish material
          content and actual control rather than a process name or PFX suffix.
    detects_refs:
    - TMP1649-P
    domains:
    - enterprise
    analytic_refs:
    - TMP1649-NJA3
    evidence_refs:
    - TMP1649-migration
    - TMP1649-keyfile
    - TMP1649-crypto
    - TMP1649-export
    - TMP1649-paper
    temporary_key: TMP1649-DET3
  detection_analytics:
  - schema_version: 2.0.0
    type: detection-analytic
    strategy_ref: TMP1649-DET1
    name:
      zh: 批准范围外认证证书签发关联
      en: Out-of-Approval-Scope Authentication-Certificate Issuance Correlation
    summary:
      zh: 把认证证书签发结果与请求控制、主体绑定和历史批准范围关联，分开记录材料与认证结果。
      en: Join authentication-certificate issuance to request control, subject binding, and historical approval scope while preserving separate
        material and authentication outcomes.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 以 CA 实例标识和 Request ID 连接 4886/4887、只读 CA 数据库记录与返回证书。由原始证书解析用途、SAN、EKU、序列号和规范指纹，并按请求时有效的映射规则解析目标主体。对照请求者或 Enrollment Agent 获准主体人群、模板、来源和批准单，标记配置允许但组织未批准的组合。旧版事件字段不足时依赖数据库补齐，不假设所有
          4887 原生含模板、SAN 或序列号。
        en: Join events 4886/4887, read-only CA database records, and returned certificates by CA instance and request ID. Parse purpose,
          SAN, EKU, serial number, and normalized fingerprint from the raw certificate and resolve the target principal under mappings effective
          at request time. Compare requester or Enrollment Agent authority over subjects, templates, origins, and approval records to identify
          combinations technically allowed but organizationally unapproved. Enrich older events from the database rather than assuming every
          4887 contains a template, SAN, or serial number.
      - zh: 中继分支补充已验证的 Web Enrollment 接入来源与认证身份；CSR 自报主机不当作可信来源，IIS 无精确 Request ID 时仅保留带置信度的时间/身份关联。请求或弱模板只产生 preparation_only；已签发证书产生 issuance_anomaly；材料返回与对应私钥控制有独立证据后才为
          acquisition_supported；匹配的成功 4768 另记 authentication_accepted，资源访问仍需后继日志。分析本身提出调查线索，不仅凭请求者与 SAN 不同就判定恶意。
        en: For relay, add verified enrollment ingress origin and authenticated identity. Do not trust a host name self-reported in a CSR;
          without an exact request ID in IIS, retain time-and-identity correlation with its confidence. A request or weak template emits
          preparation_only; an issued certificate emits issuance_anomaly; independent evidence of return and corresponding key control is
          required for acquisition_supported. A matching successful 4768 separately records authentication_accepted, while resource access
          requires successor logs. The analytic produces investigative leads and does not classify differing requester and SAN alone as malicious.
    data_requirements:
    - source_type: ca-request-audit
      name:
        zh: CA 请求与签发事件
        en: CA Request and Issuance Events
      channel: Windows Security 4886/4887; locally verified XML normalization
      required_fields:
      - event_time
      - event_id
      - ca_instance_id
      - request_id
    - source_type: ca-request-certificate-inventory
      name:
        zh: CA 数据库与证书解析补充
        en: CA Database and Certificate Parsing Enrichment
      channel: Validated read-only CA database collector and DER certificate parser
      required_fields:
      - ca_instance_id
      - request_id
      - requester_name
      - disposition
      - raw_certificate
      - certificate_fingerprint
      - fingerprint_algorithm
      - issuer_identity
      - serial_number
      - subject
      - san
      - eku
      - not_before
      - not_after
    - source_type: enrollment-authority-history
      name:
        zh: 历史注册批准与代理范围
        en: Historical Enrollment Approval and Delegation Scope
      channel: null
      required_fields:
      - requester_or_agent
      - allowed_subject_population
      - allowed_template
      - approved_source
      - approval_id
      - effective_from
      - effective_to
    observables:
    - zh: 签发主体超出请求者或代理批准范围
      en: Issued subject exceeds requester or agent approval scope
    - zh: 被中继身份与已验证接入来源不符
      en: Relayed identity differs from verified ingress provenance
    - zh: 认证材料结果与后继证书接受分别成立
      en: Material outcome and successor certificate acceptance are separately supported
    correlation:
      window:
        zh: 请求至首次使用先以 24 小时作本地演练起点，按审批/自动注册延迟调整；历史授权按请求发生时间查证，该数值不是通用检测阈值。
        en: Use 24 hours from request to initial use as a locally tested starting point, adjusted for approval and autoenrollment delay;
          evaluate authority at request time. This is not a universal detection threshold.
      dimensions:
      - ca_instance_id
      - request_id
      - requester_name
      - certificate_fingerprint
      - fingerprint_algorithm
      - issuer_identity
      - serial_number
      - subject
    false_positives:
    - zh: 合法代理注册、集中设备部署、自动续期、灾备和迁移可使请求者与主体不同；核对精确代理人群、来源和批准窗口。
      en: Authorized delegation, centralized deployment, renewal, recovery, and migration can use different requester and subject identities;
        validate exact delegated populations, origins, and approval windows.
    blind_spots:
    - zh: CA 或批准库存失守、数据库清理、缺少原始证书及旧事件缺字段会限制关联；NAT/代理与 IIS 无 Request ID 可使来源仅有弱相关性。
      en: Compromised CA or approval inventory, database pruning, absent raw certificates, and older event fields limit correlation; NAT,
        proxies, and missing IIS request IDs can leave only weak origin correlation.
    - zh: 当前强映射、模板和补丁状态可能拒绝历史演示组合；单次签发或成功 HTTP 响应不证明攻击者持有对应私钥。
      en: Current strong mapping, template, and patch state can reject historical demonstrations; issuance or an HTTP success alone does
        not establish adversary control of the corresponding private key.
    tuning_guidance:
      paragraphs:
      - zh: 先在测试 CA 验证审计策略与 CA audit filter 同时生效，并逐字段记录原生列与补充来源。按请求者、模板、目标人群、源主机和审批期限组合降权，不全局豁免管理员或常见工具。使用无生产权限的受控签发和拒绝样本验证身份映射，显式保存材料结果等级而不记录私钥。
        en: Verify both audit policy and the CA audit filter on a test CA and document native columns and enrichment sources field by field.
          Down-weight combinations of requester, template, subject population, source host, and approval period rather than globally exempting
          administrators or familiar tools. Validate mappings with controlled allowed and denied requests having no production authority
          and retain material evidence grades without logging private keys.
    evidence_refs:
    - TMP1649-processing
    - TMP1649-incident
    - TMP1649-administration
    - TMP1649-certutil
    - TMP1649-mapping
    - REF-000708
    - REF-000854
    temporary_key: TMP1649-NJA1
  - schema_version: 2.0.0
    type: detection-analytic
    strategy_ref: TMP1649-DET2
    name:
      zh: PKINIT 证书与历史权威签发库存差分
      en: PKINIT Certificate and Historical Authority-Issuance Inventory Differential
    summary:
      zh: 识别证书接受中的不明签发谱系，要求库存完整性与构造证据独立成立。
      en: Identify unexplained issuance lineage in certificate acceptance while requiring independent inventory completeness and construction
        evidence.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 选择实际含证书信息的 4768，区分成功和失败，保留事件版本及原始 CertIssuerName、CertSerialNumber、CertThumbprint。按实际指纹算法与 CA 库存 DER 计算结果比较，不能把 SHA-1 事件指纹与 SHA-256
          摘要直接连接。指纹不足时只有经验证的签发者密钥身份与序列号组合才能回退匹配，签发者显示名称不等于唯一 CA。
        en: Select 4768 records that actually contain certificate information, separate success from failure, and preserve event version
          and raw CertIssuerName, CertSerialNumber, and CertThumbprint. Compare actual fingerprint algorithms against DER-derived inventory
          values; a SHA-1 event thumbprint must not be joined directly to a SHA-256 digest. Fall back only to validated issuer-key identity
          and serial-number combinations when fingerprints are insufficient; an issuer display name does not uniquely identify a CA.
      - zh: 将证书接受与覆盖整个有效生命周期的库存比较，纳入退休 CA、合法离线 CA、外部签发者及迁移前记录，并等待本地已验证的最大同步延迟。库存缺口只生成 coverage_gap；库存已解释但证书未匹配时生成 unexplained_issuance_lineage，并附覆盖范围、同步时间和例外。只有另有服务外构造或受信签名来源调查证据，才升级
          suspected_offservice_construction。过去短窗口没有 4887、认证成功或私钥访问本身都不足以完成该升级。
        en: Compare acceptance with inventory spanning the certificate lifetime, including retired authorities, authorized offline or external
          issuers, and pre-migration records, and wait for the locally validated maximum synchronization delay. Inventory gaps emit coverage_gap.
          An unmatched certificate under explained coverage emits unexplained_issuance_lineage with scope, synchronization times, and exceptions.
          Escalate to suspected_offservice_construction only with independent construction or trusted-signing provenance evidence. Missing
          a recent 4887, successful authentication, or key access alone cannot justify escalation.
    data_requirements:
    - source_type: pkinit-authentication-events
      name:
        zh: PKINIT 认证证书标识
        en: PKINIT Authentication Certificate Identifiers
      channel: Windows Security 4768 on domain controllers; version-aware normalization
      required_fields:
      - event_time
      - host_id
      - event_version
      - event_record_id
      - target_principal
      - status
      - preauth_type
      - source_ip
      - cert_issuer_name
      - cert_serial_number
      - cert_thumbprint
    - source_type: historical-certificate-issuance-inventory
      name:
        zh: 历史证书签发库存
        en: Historical Certificate Issuance Inventory
      channel: Integrity-protected read-only CA inventory plus DER parser
      required_fields:
      - ca_instance_id
      - issuer_key_identity
      - certificate_fingerprint
      - fingerprint_algorithm
      - serial_number
      - request_id
      - issuance_time
      - not_after
      - inventory_coverage
      - last_successful_sync
    - source_type: pki-trust-and-migration-history
      name:
        zh: PKI 信任与迁移历史
        en: PKI Trust and Migration History
      channel: null
      required_fields:
      - issuer_key_identity
      - approved_scope
      - migration_period
      - external_issuer_scope
      - revocation_state
    observables:
    - zh: 成功 PKINIT 中证书标识在完整库存无匹配
      en: A successful PKINIT certificate identifier has no match in complete inventory
    - zh: 库存同步或历史覆盖缺口
      en: Inventory synchronization or historical coverage gap
    correlation:
      window:
        zh: 签发匹配覆盖证书整个有效生命周期及迁移历史；缺失判定等待实测库存同步 SLA，不以短时无签发事件设阈值。
        en: Match across the full certificate lifetime and migration history; defer absence judgments until measured inventory synchronization
          SLAs have elapsed rather than using a short issuance-event window.
      dimensions:
      - issuer_key_identity
      - certificate_fingerprint
      - fingerprint_algorithm
      - serial_number
      - target_principal
      - source_ip
      - event_time
    false_positives:
    - zh: 合法外部或离线 CA、旧证书导入、迁移、数据库裁剪与库存延迟都会形成无匹配，应分别保留批准范围和历史证据。
      en: Authorized external or offline CAs, imported certificates, migrations, database pruning, and inventory delays create unmatched
        records and need separate approved scope and historical evidence.
    blind_spots:
    - zh: 无证书标识的认证路径、被伪造库存、错误序列号规范化和未知指纹算法会破坏匹配；既有合法证书私钥被窃时仍能正常匹配库存。
      en: Authentication paths without certificate identifiers, forged inventories, incorrect serial normalization, and unknown fingerprint
        algorithms break matching; theft of an existing legitimate certificate key can still match normally.
    tuning_guidance:
      paragraphs:
      - zh: 分别测试序列号前导零、字节表示和指纹算法，保留原值及规范值。允许名单绑定具体签发者密钥、序列范围、有效期、迁移和 owner；不因 CA 曾合法而放行全部未知证书。用已知签发、受控导入和故意停采样本验证正常匹配、不明谱系与 coverage_gap
          三种结果。
        en: Test leading zeros, serial representations, and fingerprint algorithms separately and retain original and normalized values.
          Bind exceptions to issuer keys, serial ranges, validity, migrations, and owners rather than allowing every unknown certificate
          from a historically legitimate CA. Validate normal matching, unexplained lineage, and coverage_gap with known-issued, controlled-import,
          and deliberately interrupted collection samples.
    evidence_refs:
    - TMP1649-forge
    - TMP1649-processing
    - REF-000854
    - TMP1649-certutil
    temporary_key: TMP1649-NJA2
  - schema_version: 2.0.0
    type: detection-analytic
    strategy_ref: TMP1649-DET3
    name:
      zh: 私钥操作与可携材料控制证据关联
      en: Private-Key Operations and Portable-Material Control Evidence Correlation
    summary:
      zh: 以受信密钥清单连接 KSP 操作、经验证的调用者和材料结果，避免将读取事件升级为窃取成功。
      en: Join KSP operations, validated callers, and material outcomes through trusted key inventory without promoting a read event into
        successful theft.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 用已验证清单连接主机、ProviderName、KeyName 与认证或 CA 签名证书。按主体、Logon ID、容器、操作和时间关联 5058/5059/5061，对批准备份、续期与服务启动之外的操作产生 key_operation_observed。5059
          的 export 类事件也可能来自普通读取；成功 ReturnCode、文件扩展名及 System.Execution.ProcessID 均不单独证明材料输出、真实调用者或攻击者控制。
        en: Map hosts, ProviderName, and KeyName to authentication or CA-signing certificates through verified inventory. Correlate 5058/5059/5061
          by subject, logon ID, container, operation, and time, emitting key_operation_observed outside approved backup, renewal, and service-start
          activity. An export-class 5059 may accompany an ordinary read. A successful ReturnCode, filename extension, or System.Execution.ProcessID
          alone establishes neither material output, the business caller, nor adversary control.
      - zh: 由实际可提供调用链的 EDR 或受控取证补充业务进程、输出哈希和保管主体，只在确认输出包含可用私钥或经批准的证明验证后标记 private_key_material_supported，再以实际恶意控制证据升级 adversary_control_supported。对应证书后续使用另记
          authentication_supported；CA 私钥暴露仍只是服务外构造的前提，必须另证新主体证书形成。不向检测日志写入私钥字节或解密口令。
        en: Use EDR that actually exposes the call chain or controlled forensics to add the business process, output hash, and custodian.
          Mark private_key_material_supported only after establishing usable key-bearing output or approved proof validation, then escalate
          to adversary_control_supported using actual control evidence. Separately record authentication_supported for successor use. CA-key
          exposure remains a prerequisite for off-service construction and requires separate evidence of a new subject certificate. Do not
          place key bytes or decryption passwords in detection logs.
    data_requirements:
    - source_type: ksp-key-operation-audit
      name:
        zh: KSP 密钥操作审计
        en: KSP Key-Operation Audit
      channel: Windows Security 5058/5059/5061 for documented Software/Smart Card KSP paths
      required_fields:
      - event_time
      - event_id
      - event_version
      - host_id
      - subject_sid
      - subject_logon_id
      - provider_name
      - key_name
      - operation
      - return_code
    - source_type: authentication-key-inventory
      name:
        zh: 认证密钥与批准任务清单
        en: Authentication-Key and Approved-Job Inventory
      channel: null
      required_fields:
      - host_id
      - provider_name
      - key_name
      - certificate_fingerprint
      - purpose
      - owner
      - export_policy
      - approved_job
    - source_type: controlled-material-assessment
      name:
        zh: EDR 与受控材料验证结论
        en: EDR and Controlled Material-Assessment Findings
      channel: Product-validated caller telemetry or authorized forensic assessment; no secret values
      required_fields:
      - host_id
      - operation_time
      - process_identity
      - output_hash
      - material_validation_result
      - custody_assessment
    observables:
    - zh: 未经批准的密钥访问或迁移操作
      en: Unapproved key access or migration operation
    - zh: 输出材料的私钥存在性与控制主体被分别验证
      en: Key-bearing output and its controller are separately validated
    correlation:
      window:
        zh: 同一密钥操作链先以 10 分钟作演练起点，按备份和异步任务延迟调整；后继认证关联保留完整材料有效期。
        en: Start exercises with 10 minutes for one key-operation chain, adjusting for backup and asynchronous delays; retain the material
          lifetime for successor-authentication correlation.
      dimensions:
      - host_id
      - subject_sid
      - subject_logon_id
      - provider_name
      - key_name
      - operation_time
      - output_hash
      - certificate_fingerprint
    false_positives:
    - zh: 证书续期、服务启动、批准的密钥备份、迁移与诊断会正常读用密钥；按确切密钥、调用者和工单期限验证。
      en: Renewal, service start, approved key backup, migration, and diagnostics legitimately access keys; validate exact keys, callers,
        and ticket periods.
    blind_spots:
    - zh: 指定 KSP 之外、直接或原始磁盘复制、离线快照、第三方 Provider 与远程硬件可能没有相应事件；现有事件也不保证能定位业务调用者。
      en: Paths outside the documented KSPs, direct or raw-disk copying, offline snapshots, third-party providers, and remote hardware may
        lack these events; available events need not identify the business caller.
    tuning_guidance:
      paragraphs:
      - zh: 在目标 Provider 上用无生产用途密钥验证普通读取、正常导出、失败操作与材料验证四种样本，记录事件实际覆盖。只允许具体密钥/任务/主机/期限，不能豁免全部系统主体；对不能取得内容结果的读取保留线索等级，不用软件名或新建 PFX 替代调查。
        en: Exercise ordinary reads, legitimate exports, failures, and material validation with nonproduction keys on each target provider
          and document actual coverage. Allow only specific key, job, host, and period combinations rather than all system subjects. Retain
          reads without content outcomes as leads instead of substituting a software name or newly created PFX for investigation.
    evidence_refs:
    - TMP1649-migration
    - TMP1649-keyfile
    - TMP1649-crypto
    - TMP1649-export
    - TMP1649-paper
    temporary_key: TMP1649-NJA3
  mitigations:
  - schema_version: 2.0.0
    type: mitigation
    name:
      zh: 认证证书签发授权与身份绑定
      en: Authentication-Certificate Enrollment Authority and Identity Binding
    summary:
      zh: 限定认证签发的主体、模板与代理范围，并用当前支持的强映射验证身份绑定。
      en: Constrain subjects, templates, and delegation for authentication enrollment and validate identity binding with currently supported
        strong mappings.
    description:
      paragraphs:
      - zh: 证书签发需要同时符合服务配置和组织批准。把模板、Enrollment Agent、被表示主体与请求来源分别授权，使用不同管理身份审批高风险变更，保留发生时的有效范围和签发结果。强映射约束证书到主体的绑定，但不能替代保护已经合法签发的私钥。
        en: Certificate enrollment must satisfy both service configuration and organizational approval. Authorize templates, Enrollment Agents,
          represented subjects, and request origins separately, approve high-risk changes with distinct administrative identities, and retain
          effective historical scope and issuance results. Strong mapping constrains certificate-to-principal binding but does not replace
          protection of legitimately issued private keys.
    domains:
    - enterprise
    measures:
    - key: subject-template-delegation-scope
      name:
        zh: 主体模板与代理范围限制
        en: Subject Template and Delegation Scope
      description:
        paragraphs:
        - zh: 仅对必要主体开放认证用途模板，限制请求者可提供的身份信息，并限定代理可代表的人群和模板。逐组合测试批准请求成功与越界请求拒绝。
          en: Expose authentication-capable templates only to necessary principals, constrain requester-supplied identity information, and
            limit the populations and templates available to agents. Test allowed and out-of-scope combinations separately.
      control_type: preventive
    - key: independent-enrollment-approval
      name:
        zh: 独立签发与变更批准
        en: Independent Enrollment and Change Approval
      description:
        paragraphs:
        - zh: 将 CA 管理、模板管理、代理注册和审计职责分离，高风险签发与权限变更要求有限期批准，并验证实际有效权限。
          en: Separate CA administration, template administration, enrollment delegation, and audit roles, require bounded approval for high-risk
            issuance and authority changes, and verify effective rights.
      control_type: governance
    - key: current-strong-mapping-validation
      name:
        zh: 当前强映射验证
        en: Current Strong-Mapping Validation
      description:
        paragraphs:
        - zh: 按支持的补丁与平台配置落实证书到主体强映射，验证正确 SID 或支持的强绑定，而非依赖可伪造的名称相似。对旧客户端兼容例外设置期限与替代控制。
          en: Apply supported certificate-to-principal strong mapping for the current platform and patch state, validating correct SIDs or
            supported strong bindings rather than spoofable name resemblance. Bound legacy compatibility exceptions and provide compensating
            controls.
      control_type: preventive
    - key: independent-issuance-ledger
      name:
        zh: 独立签发账本
        en: Independent Issuance Ledger
      description:
        paragraphs:
        - zh: 把请求、解析证书、授权范围与审批记录按 CA 实例和 Request ID 留存在签发管理员不能独自修改的存储，验证审计过滤器与 OS 策略共同生效。
          en: Retain requests, parsed certificates, authority scope, and approvals by CA instance and request ID in storage not independently
            modifiable by issuance administrators, verifying both CA audit filters and OS policy.
      control_type: detective-support
    applications:
    - target_ref: TMP1649-P
      use:
        paragraphs:
        - zh: 将认证证书签发列为身份凭据创建，按用途登记请求者、模板与主体绑定，调查异常时保留完整请求和输出谱系。
          en: Treat authentication enrollment as identity-credential creation, inventory requesters, templates, and subject bindings by purpose,
            and preserve request and output lineage during investigation.
      expected_effect:
        paragraphs:
        - zh: 缩小从可用请求身份转化成未批准认证能力的机会，并可区分真实签发、材料控制与后续使用。
          en: Reduce opportunities to turn a valid requesting identity into unapproved authentication capability while distinguishing issuance,
            material control, and subsequent use.
      limitations:
        paragraphs:
        - zh: 无法防止已签发私钥被窃取或完全失守 CA 的服务外签名；强绑定也不能阻止具有正确绑定的有效私钥被滥用。
          en: Does not prevent theft of issued keys or off-service signing after full CA compromise; strong binding also cannot prevent misuse
            of a valid key with the correct binding.
    - target_ref: TMP1649-S1
      use:
        paragraphs:
        - zh: 按代理人群、模板、来源和批准窗口封闭可代表主体范围，清除不必要的任意身份供应并校验请求时的强映射。
          en: Constrain represented subjects by delegated population, template, origin, and approval window, remove unnecessary arbitrary
            identity supply, and validate strong mapping effective at request time.
      expected_effect:
        paragraphs:
        - zh: 技术上可签发但组织未批准的组合更难获得认证材料，合法代理和恶意控制的差异可回溯。
          en: Make technically issuable but unapproved combinations harder to convert into credentials and preserve distinctions between
            legitimate delegation and malicious control.
      limitations:
        paragraphs:
        - zh: 集中部署、旧客户端和灾备需要经验证的兼容流程；请求者自身已在批准范围内时，还需端点与中继路径控制。
          en: Centralized deployment, legacy clients, and recovery need validated compatibility workflows; approved requesters still require
            endpoint and relay-path controls.
    evidence_refs:
    - TMP1649-incident
    - TMP1649-administration
    - TMP1649-mapping
    temporary_key: TMP1649-MIT1
  - schema_version: 2.0.0
    type: mitigation
    name:
      zh: 认证私钥隔离与失守签发者恢复
      en: Authentication-Key Isolation and Compromised-Issuer Recovery
    summary:
      zh: 保护私钥复制与调用边界，并从签发者信任层恢复无法完整枚举的服务外证书风险。
      en: Protect key-copy and invocation boundaries and recover at issuer-trust level when off-service certificates cannot be fully enumerated.
    description:
      paragraphs:
      - zh: 终端与 CA 私钥需要按用途、运行身份和恢复权限隔离。对高价值密钥采用适用的硬件保护，同时约束被授权调用者；软件不可导出标志不能代表硬件隔离。签发密钥失守后，不应只重置口令或逐请求撤销，而要评估受影响签发者、信任链、已发证书和后继会话。
        en: Separate end-entity and CA keys by purpose, runtime identity, and recovery authority. Use applicable hardware protection for
          high-value keys while constraining authorized callers; a software non-exportable flag does not establish hardware isolation. After
          signing-key compromise, assess affected issuers, trust chains, issued certificates, and successor sessions rather than only resetting
          passwords or revoking individual requests.
    domains:
    - enterprise
    measures:
    - key: key-custody-and-call-authorization
      name:
        zh: 私钥保管与调用授权
        en: Key Custody and Invocation Authority
      description:
        paragraphs:
        - zh: 限定私钥容器与备份的访问者，对高价值签发密钥采用适用 HSM/TPM 或等价隔离，限制签名服务运行身份和调用批准。
          en: Restrict access to private-key containers and backups, use applicable HSM, TPM, or equivalent isolation for high-value signing
            keys, and constrain signing-service runtime identities and invocation approval.
      control_type: preventive
    - key: split-backup-recovery-custody
      name:
        zh: 备份与恢复保管分离
        en: Separate Backup and Recovery Custody
      description:
        paragraphs:
        - zh: 将私钥备份、解密口令和恢复批准分离保管，限制在线恢复副本与维护身份，演练恢复且不把秘密放入检测日志。
          en: Separate key backups, decryption passwords, and recovery approvals, restrict online recovery copies and maintenance identities,
            and exercise recovery without placing secrets in detection logs.
      control_type: exposure-reduction
    - key: issuer-trust-and-session-recovery
      name:
        zh: 签发者信任与会话恢复
        en: Issuer-Trust and Session Recovery
      description:
        paragraphs:
        - zh: 确认签发私钥失守后保全证据并按 PKI 事件流程评估换钥、撤信、重新签发与依赖方恢复；验证旧材料被拒绝，另行处置已签发票据与资源会话。
          en: After confirmed signing-key compromise, preserve evidence and use the PKI incident process to assess key replacement, trust
            withdrawal, reissuance, and relying-party recovery. Verify rejection of old material and separately handle issued tickets and
            resource sessions.
      control_type: containment
    applications:
    - target_ref: TMP1649-P
      use:
        paragraphs:
        - zh: 将终端认证密钥与 CA 签名密钥分别登记并按角色保护，验证批准导出、不可导出和调用权限的实际边界；发现材料暴露后追溯具体证书与持有人。
          en: Inventory and protect end-entity authentication keys and CA-signing keys separately, validate actual export, non-exportability,
            and invocation boundaries, and trace specific certificates and holders after exposure.
      expected_effect:
        paragraphs:
        - zh: 减少可携私钥取得机会，并使材料泄露、签名能力失守与认证后果采用相应响应范围。
          en: Reduce portable-key acquisition opportunities and align response scope with material exposure, signing-capability compromise,
            and authentication consequences.
      limitations:
        paragraphs:
        - zh: 已控运行身份可能仍可调用硬件密钥；诊断与备份需要限期例外，没有材料证据时不能声称精确枚举全部受影响凭据。
          en: A compromised runtime identity may still invoke hardware keys. Diagnostics and backup need bounded exceptions, and absence
            of material evidence prevents claiming an exact inventory of every affected credential.
    - target_ref: TMP1649-S2
      use:
        paragraphs:
        - zh: 隔离受信签发私钥的复制与签名调用权限，失守后按签发者和依赖方撤回或替换信任，重建独立库存，并检查旧材料与已建立会话。
          en: Isolate copying and signature-invocation authority for trusted issuer keys. After compromise, withdraw or replace trust by
            issuer and relying party, rebuild independent inventory, and examine old material and established sessions.
      expected_effect:
        paragraphs:
        - zh: 提高在服务外持续构造可信认证证书的成本，并使响应覆盖无法从正常 CA 请求库枚举的新材料。
          en: Increase the cost of continued off-service trusted certificate construction and extend response to material that cannot be
            enumerated from normal CA requests.
      limitations:
        paragraphs:
        - zh: 换钥与撤信可能影响大量设备和服务，需要分阶段恢复及拒绝验证；硬件防复制不能替代授权调用保护，未知证书不适合仅按已知序列号逐个撤销。
          en: Key replacement and trust withdrawal can affect many devices and services and require staged recovery and rejection testing.
            Hardware copy resistance does not replace invocation controls, and unknown certificates cannot be handled solely by revoking
            known serials.
