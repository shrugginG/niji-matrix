  claims:
  - schema_version: 1.0.0
    type: claim
    claim_type: technique-relevance
    statement_zh: 认证证书对应私钥控制、正常签发结果取得及服务外构造均属于凭据获取，但材料取得与后继身份使用需要分别证明。
    statement_en: Private-key control for authentication certificates, acquisition through normal issuance, and off-service construction
      belong to Credential Access, while acquisition and successor identity use require separate evidence.
    subject_refs:
    - TMP1649-P
    evidence_refs:
    - TMP1649-paper
    - TMP1649-incident
    - REF-000625
    evidence_mode: strongly-inferred
    confidence: high
    temporary_key: TMP1649-CLM1
  - schema_version: 1.0.0
    type: claim
