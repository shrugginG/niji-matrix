  detection_strategies:
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1558-DET-MATERIAL
    name:
      zh: Kerberos 取材与构造结果谱系
      en: Kerberos Acquisition and Construction Outcome Lineage
    summary:
      zh: 把KDC请求、具体缓存读取或构造输入连接到实际材料结果，并将异常线索与完成行为分级。
      en: Connect KDC requests, specific cache reads, or construction inputs to actual material outcomes, distinguishing anomaly leads from completed behavior.
    description:
      paragraphs:
      - zh: 策略以材料结果为共同目标，分别从请求回复、既存缓存和构造输入进入。请求分析兼顾长期稀疏序列与直接协议输出，缓存分析核对真正读取的对象和输出，构造分析检验票据对象与授权谱系。资源侧登录只作独立后继证据，不能替代取得或修改结果。
        en: The common objective is a material outcome reached through request and reply, an existing cache, or a construction input. Request analysis covers
          long sparse sequences and direct protocol outputs, cache analysis validates actual read objects and outputs, and construction analysis tests ticket-object
          and authorization lineage. Resource logons are independent successor evidence and cannot replace acquisition or modification results.
    detects_refs:
    - TMP1558-PARENT
    - TMP1558-CHILD-TIME
    - TMP1558-CHILD-CACHE
    - TMP1558-CHILD-TEMPLATE
    domains:
    - enterprise
    analytic_refs:
    - TMP1558-NJA-REQUEST
    - TMP1558-NJA-CACHE
    - TMP1558-NJA-CONSTRUCTION
    evidence_refs:
    - REF-000854
    - REF-000855
    - REF-000230
    - REF-001042
    - TMP1558-REF-RUBEUS
    - TMP1558-REF-REVISIT
    - TMP1558-REF-ASREP
    - TMP1558-REF-RFC4120
    - TMP1558-REF-CCACHE
    - TMP1558-REF-DIAMOND
    - TMP1558-REF-PAC
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  detection_analytics:
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1558-NJA-REQUEST
    strategy_ref: TMP1558-DET-MATERIAL
    name:
      zh: 跨窗口取材请求与直接协议输出关联
      en: Cross-Window Acquisition Requests and Direct-Protocol Output Correlation
    summary:
      zh: 识别持续的新服务目标、无预认证成功回复或异常进程直接取材，并以材料输出决定是否确认取得。
      en: Identify persistent new service targets, successful replies without preauthentication, or unusual direct acquisition by a process, using material
        output to determine acquisition confirmation.
    domains:
    - enterprise
    platforms:
    - Windows
    - Active Directory
    logic:
      paragraphs:
      - zh: 集中成功4769并按realm、TargetUserName/TargetDomainName、规范化IpAddress和ServiceSid/ServiceName累积目标关系。在一小时、二十四小时与七日窗口对照三十日同角色基线，检验新服务目标覆盖、连续稀疏请求与加密选择变化；阈值由环境回放确定，不要求高峰或RC4。4768分支关注Status=0且PreAuthType=0的回复，并连接当时的DONT_REQ_PREAUTH配置；初始无预认证探测后正常挑战与失败请求不算成功取材。ServiceName通常是服务账户名称，不应直接当完整SPN，精确SPN需协议遥测或版本化目录映射。
        en: Centralize successful 4769 and accumulate target relationships by realm, TargetUserName or TargetDomainName, normalized IpAddress, and ServiceSid
          or ServiceName. Compare one-hour, twenty-four-hour, and seven-day windows with a thirty-day peer-role baseline for new-service coverage, persistent
          sparse requests, and encryption-choice changes. Set thresholds by local replay rather than requiring a burst or RC4. The 4768 branch considers
          Status zero and PreAuthType zero joined to the contemporaneous DONT_REQ_PREAUTH setting. Initial unauthenticated probes followed by a normal challenge,
          and failed requests, do not establish successful acquisition. ServiceName is commonly the service-account name rather than a complete SPN; exact
          SPNs require protocol telemetry or versioned directory mapping.
      - zh: 将候选连接到源端Sysmon 1/3或等价EDR的ProcessGuid、User、SourceIp和KDC地址；检查实际配置的日志是否保留源端口和DC事件中的IpPort，不能只以同一NAT地址绑定进程。非预期进程直接连接88、可识别回复输出或经授权内存/文件检验可加强直接取材分支。缓存快照差异只作可选佐证，不把缺少klist条目视为旁路证明。成功回复与陌生服务关系输出request_material_candidate；只有对应返回密文或票据凭据被检查并归于攻击者控制进程/接收者时，升级confirmed_material_acquisition；低密度与缓存旁路分类还须各自实施证据。
        en: Join candidates to source Sysmon 1 and 3 or equivalent EDR using ProcessGuid, User, SourceIp, and KDC address. Check whether configured telemetry
          retains source ports and the DC event IpPort; a shared NAT address cannot identify a process. An unexpected process connecting directly to port
          88, recognizable reply output, or authorized memory or file inspection strengthens the direct-acquisition branch. Cache-snapshot differences are
          optional corroboration, and missing klist entries do not prove bypass. Successful replies and unfamiliar service relationships yield request_material_candidate.
          Upgrade to confirmed_material_acquisition only when corresponding reply ciphertext or ticket credentials are inspected and attributed to an adversary-controlled
          process or recipient. Low-density and cache-bypass classification each need their own implementation evidence.
    data_requirements:
    - source_type: kdc-service-ticket-events
      name:
        zh: KDC 服务票据请求
        en: KDC service-ticket requests
      channel: Security/4769; success audit required
      required_fields:
      - system.timecreated
      - system.computer
      - system.version
      - targetusername
      - targetdomainname
      - servicename
      - servicesid
      - ipaddress
      - ipport
      - ticketencryptiontype
      - status
    - source_type: kdc-as-ticket-events
      name:
        zh: KDC AS 回复审计
        en: KDC AS-reply audit
      channel: Security/4768; success audit required
      required_fields:
      - system.timecreated
      - system.computer
      - system.version
      - targetusername
      - targetdomainname
      - ipaddress
      - preauthtype
      - ticketencryptiontype
      - status
    - source_type: directory-service-configuration
      name:
        zh: 身份和服务目标配置快照
        en: Identity and service-target configuration snapshots
      channel: versioned AD inventory
      required_fields:
      - valid_from
      - valid_to
      - objectsid
      - samaccountname
      - serviceprincipalname
      - useraccountcontrol
      - msds-supportedencryptiontypes
      - owner
      - approved_client_hosts
    - source_type: endpoint-process-network
      name:
        zh: 源端进程网络事件
        en: Source process-network events
      channel: configured Sysmon Operational/1,3 or validated EDR equivalent
      required_fields:
      - utctime
      - computer
      - processguid
      - processid
      - image
      - user
      - sourceip
      - sourceport
      - destinationip
      - destinationport
    - source_type: controlled-material-inspection
      name:
        zh: 经授权材料输出检验
        en: Authorized material-output inspection
      channel: controlled incident/lab artifact inspection; not native 4769 or Sysmon content
      required_fields:
      - inspection_time
      - host_id
      - process_start_key
      - artifact_id
      - artifact_digest
      - material_class
      - principal
      - realm
      - service_or_reply_type
      - format_validation_result
      - custody_or_recipient
    observables:
    - zh: 同一身份跨多个窗口持续请求此前未用过的服务账户，即使每个短窗口数量很低。
      en: One identity persistently requests previously unused service accounts across windows despite low short-window counts.
    - zh: 意外进程直接与KDC交互，且其输出经检验包含相应Kerberos回复密文，缓存数量并不反映目标范围。
      en: An unexpected process exchanges directly with a KDC and produces inspected Kerberos reply ciphertext while cache counts do not represent the target
        scope.
    - zh: 无预认证账户收到成功AS回复，且返回加密部分被复制到非批准接收者。
      en: A no-preauthentication account receives a successful AS reply whose encrypted part is copied to an unapproved recipient.
    correlation:
      window:
        zh: 请求到源端输出默认五分钟，窗口统计为一小时、二十四小时和七日；角色与服务关系基线三十日，批处理周期和取材间隔用回放调优。
        en: Default five minutes from request to source output; aggregate one-hour, twenty-four-hour, and seven-day windows with a thirty-day role and service-relationship
          baseline, tuned by replay to batch schedules and acquisition intervals.
      dimensions:
      - realm
      - principal
      - service_account_sid
      - service_spn_if_available
      - source_device
      - client_address
      - client_port_if_available
      - domain_controller
      - process_guid
      - artifact_digest
    false_positives:
    - zh: 新应用上线、合法多服务SSO、资产扫描、获批安全评估和批量任务会产生新服务覆盖；遗留无预认证账户可合法请求回复。
      en: New applications, legitimate multi-service SSO, inventory scanning, approved assessment, and batch tasks create new-service coverage. Legacy accounts
        without preauthentication can request replies legitimately.
    - zh: Java、Linux互操作、测试客户端或自带协议栈的服务可合法从非lsass进程连接88端口。
      en: Java, Linux interoperability, test clients, and services with their own stacks can legitimately connect to port 88 outside lsass.
    blind_spots:
    - zh: 4768/4769不提供材料输出、明文PAC或离线猜测结果。加密类型只是背景；AES也能产生可测试材料。独立主机或纯内存输出缺少端点数据时无法确认取得。
      en: 4768 and 4769 do not provide material output, plaintext PACs, or offline-guessing outcomes. Encryption type is context, and AES can also yield
        testable material. An independent host or memory-only output without endpoint data prevents acquisition confirmation.
    - zh: 不完整DC采集、跨域referral、IP复用、端口缺失和高延迟可破坏关联。Sysmon网络事件需显式启用，不能假定总有ProcessGuid与请求一一映射。
      en: Incomplete DC collection, cross-realm referrals, reused IPs, missing ports, and delay can break joins. Sysmon network events require explicit
        enablement; a one-to-one request-to-ProcessGuid mapping cannot be assumed.
    tuning_guidance:
      paragraphs:
      - zh: 按用户、计算机与服务身份、服务角色、批准客户端及任务周期分别建基线。核对事件版本、ServiceSid解析和加密字段含义，再使用三十日回放设置阈值；不要通过排除全部服务账户、所有AES或签名进程消除误报。无法取得材料输出时保留候选级别，缓存旁路与低密度意图只由独立实施证据提升。
        en: Baseline user, computer, and service identities separately by service role, approved clients, and schedule. Validate event versions, ServiceSid
          resolution, and encryption-field semantics before setting thresholds through thirty-day replay. Do not remove false positives by excluding all
          service accounts, every AES request, or signed processes. Retain candidate status when material output is unavailable, and elevate cache-bypass
          or low-density intent only through independent implementation evidence.
    evidence_refs:
    - REF-000854
    - REF-000855
    - REF-000230
    - TMP1558-REF-RUBEUS
    - TMP1558-REF-REVISIT
    - TMP1558-REF-ASREP
    - TMP1558-REF-RFC4120
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1558-NJA-CACHE
    strategy_ref: TMP1558-DET-MATERIAL
    name:
      zh: 文件缓存读取到票据凭据输出关联
      en: File-Cache Read to Ticket-Credential Output Correlation
    summary:
      zh: 对已识别的FILE/DIR缓存关联实际读取、调用进程与安全检验输出，区分打开缓存与已取得票据。
      en: For identified FILE or DIR caches, join actual reads, caller processes, and safely inspected output to distinguish cache opening from acquired
        tickets.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 先按主机实际krb5配置、运行态缓存名称和owner建立FILE/DIR缓存清单，不把/tmp/krb5cc固定为唯一位置。对这些路径预配置Linux Audit读取规则，按同一audit事件序列连接SYSCALL、PATH与PROCTITLE，保留success、pid/ppid、auid、uid/euid、exe、name和inode。以进程启动记录消除PID复用，按对象owner与批准服务角色识别越权或不符用途的读取。只读打开或access检查先输出cache_read_candidate，不证明完整内容返回。
        en: Build a FILE or DIR inventory from actual krb5 configuration, runtime cache names, and owners rather than assuming /tmp/krb5cc is the only location.
          Preconfigure Linux Audit read rules for these paths and join SYSCALL, PATH, and PROCTITLE records by audit event serial, retaining success, pid
          or ppid, auid, uid or euid, exe, name, and inode. Use process-start records to disambiguate reused PIDs and compare object ownership with approved
          service roles to detect unauthorized or inconsistent reads. A read-only open or access check initially yields cache_read_candidate, without proving
          full content return.
      - zh: 再关联同进程或明确派生进程的复制文件、外送对象或取证内存，在受限检验环境确认ccache/KRB-CRED结构及principal、realm、服务、寿命与会话密钥存在性，仅保存安全摘要。原对象和输出对应且接收者受攻击者控制时输出confirmed_ticket_acquisition；只含无法用于认证的票据密文时标记ciphertext_only，不能声称已可Pass-the-Ticket。KCM、KEYRING、MEMORY和macOS
          API读取须另部署传感器，本分析不以文件读规则假装覆盖它们。
        en: Then join copied files, transferred objects, or forensic memory from the same process or an explicitly linked child. In a restricted inspection
          environment, validate ccache or KRB-CRED structure, principal, realm, service, lifetime, and session-key presence while retaining only safe digests.
          Matching source and output with an adversary-controlled recipient yields confirmed_ticket_acquisition. Label ciphertext_only when the output contains
          ticket ciphertext insufficient for authentication, without claiming readiness for Pass-the-Ticket. KCM, KEYRING, MEMORY, and macOS API reads need
          separate sensors; file-read rules do not cover them.
    data_requirements:
    - source_type: linux-file-cache-inventory
      name:
        zh: 实际文件缓存清单
        en: Actual file-cache inventory
      channel: krb5 configuration and approved runtime inventory
      required_fields:
      - host_id
      - cache_backend
      - cache_name
      - path
      - owner_uid
      - device
      - inode
      - valid_from
      - valid_to
    - source_type: linux-audit-cache-read
      name:
        zh: Linux 缓存读取审计
        en: Linux cache-read audit
      channel: 'auditd preconfigured file read rules: SYSCALL/PATH/PROCTITLE'
      required_fields:
      - audit_timestamp
      - audit_serial
      - success
      - syscall
      - pid
      - ppid
      - auid
      - uid
      - euid
      - exe
      - name
      - inode
      - proctitle
    - source_type: linux-process-start
      name:
        zh: Linux 进程启动身份
        en: Linux process-start identity
      channel: auditd EXECVE/SYSCALL or validated endpoint process sensor
      required_fields:
      - timestamp
      - host_id
      - pid
      - process_start_time
      - ppid
      - exe
      - uid
    - source_type: controlled-cache-output-inspection
      name:
        zh: 受限缓存输出检验
        en: Restricted cache-output inspection
      channel: controlled incident/lab artifact inspection
      required_fields:
      - inspection_time
      - host_id
      - process_start_key
      - source_object_id
      - output_artifact_id
      - output_digest
      - cache_format
      - principal
      - realm
      - service
      - ticket_lifetime
      - session_key_present
      - recipient_control
    observables:
    - zh: 非批准reader成功读取其他UID的FILE/DIR缓存并产生可映射的票据凭据输出。
      en: An unapproved reader successfully reads another UID FILE or DIR cache and produces a mapped ticket-credential output.
    - zh: 会话缓存被复制到不符合其owner、生命周期和用途的暂存对象，且内容结构和会话密钥存在性得到确认。
      en: A session cache is copied to a staging object inconsistent with its owner, lifecycle, and purpose, with format and session-key presence confirmed.
    correlation:
      window:
        zh: 读取到本机输出默认十分钟，到外送默认三十分钟；对象保留原生命周期及配置变更时间，进程按启动时刻而非只按PID关联。
        en: Default ten minutes from read to local output and thirty minutes to transfer; retain object lifecycle and configuration-change times and join
          processes by start time rather than PID alone.
      dimensions:
      - host_id
      - audit_serial
      - uid
      - auid
      - process_start_key
      - cache_name
      - device
      - inode
      - principal
      - realm
      - output_digest
    false_positives:
    - zh: 合法klist、kinit、SSO消费者、备份、故障排查、迁移与取证可读取或复制缓存；部分授权运维由root执行。
      en: Legitimate klist, kinit, SSO consumers, backup, troubleshooting, migration, and forensics read or copy caches; some authorized operations run
        as root.
    blind_spots:
    - zh: Audit规则未预配、记录丢失、同进程恶意代码、root/内核控制、离线磁盘和非FILE backend可避开。文件事件不暴露读取字节，单纯success只说明系统调用成功。
      en: Missing prior audit rules, dropped records, malicious code in an approved process, root or kernel control, offline disks, and non-FILE backends
        can evade. File events do not expose bytes read, and success alone only establishes syscall success.
    - zh: 压缩或加密暂存、纯内存复制和无法取得输出时只能报告读取风险；已有票据不一定仍有效。
      en: Compressed or encrypted staging, memory-only copying, and unavailable output limit the result to read risk. An existing ticket need not remain
        valid.
    tuning_guidance:
      paragraphs:
      - zh: 以真实backend与owner界定审计目标，先在测试主机验证规则能覆盖openat/read并正确拼接PATH。允许例外须绑定reader版本、owner、工单、范围与输出保管，不能永久放行root或所有Kerberos工具。集中平台保留摘要与会话密钥存在性标记，完整票据及密钥留在受限证据环境。
        en: Scope audit targets by actual backend and owner, and first verify on test hosts that rules cover openat or read and join PATH correctly. Bind
          exceptions to reader version, owner, approval, scope, and output custody rather than permanently allowing root or all Kerberos tools. Centralize
          digests and session-key-presence flags while keeping complete tickets and keys in restricted evidence storage.
    evidence_refs:
    - REF-001042
    - TMP1558-REF-CCACHE
    - TMP1558-REF-RFC4120
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1558-NJA-CONSTRUCTION
    strategy_ref: TMP1558-DET-MATERIAL
    name:
      zh: 票据构造输出与签发对象连续性检验
      en: Ticket Construction Output and Issued-Object Continuity Analysis
    summary:
      zh: 把确切票据对象、构造输入输出及授权状态连接，以分级判断伪造与模板承袭，而不是由缺少短时签发事件下结论。
      en: Join exact ticket objects, construction inputs and outputs, and authorization state to grade forgery and template inheritance without treating
        missing recent issuance as proof.
    domains:
    - enterprise
    platforms:
    - Windows
    - Active Directory
    logic:
      paragraphs:
      - zh: 收集全部相关realm/DC的成功4768/4769、票据续期与跨域路径，并记录审计策略、事件版本、丢失与保留情况。Windows Server 2016及以后在2025-01-14或之后累计更新下才使用经本地验证的新字段分支：4768样例XML是ResponseTicket，文字称response
          ticket hash；4769为RequestTicketHash/ResponseTicketHash。按安全规范化哈希比较4768发出的TGT与4769提交对象，只对确知相同计算口径且不为N/A的数据作强键。缺少匹配只输出ticket_lineage_gap，须排除已有缓存、续期、跨域、离线签发、采集缺口和超出保留的原始请求。
        en: 'Collect successful 4768 and 4769 from all relevant realms and DCs, renewal and cross-realm paths, and audit policy, event version, loss, and
          retention state. Enable the new-field branch only for Windows Server 2016 or later with January 14, 2025 or later cumulative updates and locally
          validated fields: the 4768 XML sample uses ResponseTicket while its prose calls it a response ticket hash; 4769 uses RequestTicketHash and ResponseTicketHash.
          Compare issued TGTs with objects submitted in 4769 using safely normalized hashes only when calculation semantics match and values are not N/A.
          A missing match yields only ticket_lineage_gap, accounting for cached tickets, renewal, cross-realm paths, offline issuance, collection gaps,
          and original requests outside retention.'
      - zh: 构造确认分支需受限取证检验：把输入票据、输出票据、构造进程和实际密钥使用证据关联，确认输出是有效格式且存在攻击者控制的身份或授权语义变化。若输入确为正规签发且不需改变的字段被保留，可确认模板承袭；仅有正常时限或先行4768不足以分类。可用的后继服务事件用于核对目标principal与授权结果，并明确归NJT-0184/NJT-0061。标准事件不暴露PAC组时不得凭空比较组字段；服务端没有对应4769也不能单独证明服务票据伪造，PAC验证路径与补丁可能另有域控交互。
        en: Construction confirmation requires restricted forensic inspection joining input ticket, output ticket, construction process, and actual key-use
          evidence, establishing a valid-format output and adversary-controlled identity or authorization changes. A genuinely issued input with retained
          unmodified fields can establish template inheritance; normal lifetimes or a prior 4768 alone cannot classify it. Available successor service events
          validate target principal and authorization outcome and remain attributed to NJT-0184 or NJT-0061. Do not invent PAC group comparisons when standard
          events omit those groups. A service event lacking matching 4769 cannot alone prove service-ticket forgery, and PAC validation paths or patches
          can cause other DC interactions.
    data_requirements:
    - source_type: kdc-issuance-coverage
      name:
        zh: 签发审计与覆盖清单
        en: Issuance audit and coverage inventory
      channel: Security/4768,4769; version-gated extended fields
      required_fields:
      - system.timecreated
      - system.computer
      - system.version
      - targetusername
      - targetdomainname
      - servicename
      - ipaddress
      - status
      - coverage_start
      - coverage_end
      - audit_enabled
      - collector_loss_state
    - source_type: ticket-hash-capability-gated
      name:
        zh: 经验证的扩展票据标识
        en: Validated extended ticket identifiers
      channel: 4768 v2 ResponseTicket and 4769 updated RequestTicketHash/ResponseTicketHash; conditional branch
      required_fields:
      - event_version
      - raw_xml_field_name
      - normalized_ticket_digest
      - digest_semantics_validated
      - value_available
    - source_type: construction-artifact-inspection
      name:
        zh: 构造输入输出与语义检验
        en: Construction input-output and semantic inspection
      channel: restricted incident/lab ticket parsing, endpoint evidence; not ordinary Security log
      required_fields:
      - inspection_time
      - construction_host
      - process_start_key
      - input_artifact_id
      - input_ticket_digest
      - output_artifact_id
      - output_ticket_digest
      - principal_and_realm
      - service
      - semantic_changes
      - retained_fields
      - key_use_evidence
      - format_validation_result
      - custody
    - source_type: historical-authorization-state
      name:
        zh: 历史身份授权与验证配置
        en: Historical identity authorization and verifier configuration
      channel: versioned directory and service policy inventory
      required_fields:
      - valid_from
      - valid_to
      - identity_sid
      - group_or_authorization_state
      - service_account
      - trust_path
      - pac_validation_state
      - os_build
      - patch_state
    observables:
    - zh: 构造进程读取真实签发输入后产生不同票据对象，检验确认身份或授权内容改变且其他模板字段保留。
      en: A construction process reads a genuinely issued input and produces a different ticket object with inspected identity or authorization changes
        and retained template fields.
    - zh: 经验证的扩展票据标识不能连接签发与提交对象，但此信号仍只是谱系缺口。
      en: Validated extended ticket identifiers fail to link issuance and submission, which remains only a lineage gap.
    correlation:
      window:
        zh: 构造输入到输出默认十五分钟，签发谱系回看至少覆盖实际最大票据及renew-till寿命并保留采集延迟；后继使用独立回看一小时，不以任意五分钟缺口定伪造。
        en: Default fifteen minutes from construction input to output; look back over at least actual maximum ticket and renew-till lifetimes plus collection
          delay. Inspect successor use independently over one hour, without treating an arbitrary five-minute gap as forgery.
      dimensions:
      - realm
      - issuing_dc
      - event_version
      - normalized_ticket_digest
      - principal
      - service
      - construction_host
      - process_start_key
      - input_artifact_id
      - output_artifact_id
      - authorization_validity_interval
    false_positives:
    - zh: 票据续期、跨域referral、负载均衡、正常缓存使用、审计丢失或版本差异会造成签发缺口；故障排查与获批研究也会产生票据解析和重编码。
      en: Renewal, cross-realm referrals, load balancing, normal cached use, missing audit, and version differences cause issuance gaps. Troubleshooting
        and approved research can also parse and re-encode tickets.
    blind_spots:
    - zh: 持有全部密钥的攻击者可构造符合检查的字段，且离线构造主机可能无传感器。标准日志不含完整PAC；不能借时间与账户相同代替确切票据对象。
      en: An adversary holding all keys can construct conforming fields on an uninstrumented offline host. Standard logs omit full PACs; matching account
        and time cannot replace exact ticket-object identity.
    - zh: 旧版或未更新DC没有扩展哈希，官方文档中的ResponseTicket命名也需解析器验证。密钥轮换、RODC与跨域验证增加对象连续性的解释成本。
      en: Older or unpatched DCs lack extended hashes, and the documented ResponseTicket naming needs parser validation. Key rotation, RODCs, and cross-realm
        validation add continuity ambiguity.
    tuning_guidance:
      paragraphs:
      - zh: 先用批准测试取得原始XML并验证事件版本、哈希生成对象、规范化及跨DC一致性。所有缺口先走数据质量与票据生命周期检查，不以存在一次4768自动排除模板构造。构造确认依赖语义变化和控制证据，重编码但语义未改变保持正常或未定；对PAC验证更新按实际OS build记录，避免套用历史Silver行为。
        en: First obtain raw XML through approved testing to validate event versions, hashed objects, normalization, and cross-DC consistency. Route gaps
          through data-quality and ticket-lifecycle checks, and do not clear template construction merely because a 4768 exists. Construction confirmation
          depends on semantic changes and control evidence; re-encoding without semantic changes remains legitimate or unresolved. Record PAC validation
          updates by actual OS build rather than applying historical Silver behavior universally.
    evidence_refs:
    - REF-000854
    - REF-000855
    - TMP1558-REF-DIAMOND
    - TMP1558-REF-RFC4120
    - TMP1558-REF-PAC
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  mitigations:
  - schema_version: 2.0.0
    type: mitigation
    id: TMP1558-MIT-REQUEST
    name:
      zh: Kerberos 可离线取材暴露收敛
      en: Kerberos Offline-Test Material Exposure Reduction
    summary:
      zh: 恢复预认证、提高服务秘密强度并治理加密依赖，减少匿名取材机会与后继离线恢复收益。
      en: Restore preauthentication, strengthen service secrets, and govern encryption dependencies to reduce unauthenticated acquisition and subsequent
        offline-recovery value.
    description:
      paragraphs:
      - zh: 此控制针对KDC合法协议所暴露的可离线测试材料。移除不必要的无预认证设置，使用可管理的高熵服务秘密与最低服务权限，并在兼容性验证后采用AES和收敛旧算法。取材速率或本机缓存路径改变后，这些配置仍作用于同一目标账户和密钥，降低已取得密文转化为可用秘密的概率。
        en: This control addresses offline-test material exposed through legitimate KDC protocols. Remove unnecessary no-preauthentication settings, use
          managed high-entropy service secrets and minimum service privileges, and adopt AES while reducing old algorithms after compatibility testing.
          These settings govern the same target accounts and keys even when acquisition cadence or local caching changes, reducing the likelihood that acquired
          ciphertext becomes a usable secret.
    domains:
    - enterprise
    measures:
    - key: require-preauthentication
      name:
        zh: 恢复必要预认证
        en: Require preauthentication
      description:
        paragraphs:
        - zh: 盘点DONT_REQ_PREAUTH，移除无业务必要的例外，例外绑定owner、依赖、期限与监控；监控该位非批准变更。
          en: Inventory DONT_REQ_PREAUTH, remove exceptions without business need, bind remaining exceptions to owner, dependency, expiry, and monitoring,
            and monitor unapproved changes to the bit.
      control_type: preventive
    - key: high-entropy-service-secrets
      name:
        zh: 提高服务账户秘密强度
        en: Strengthen service-account secrets
      description:
        paragraphs:
        - zh: 对支持的工作负载使用gMSA或等价受管长随机秘密，限制可读取主体与服务权限，按依赖安全轮换；不要只依靠人选短口令和复杂度。
          en: Use gMSAs or equivalent managed long random secrets for supported workloads, restrict readers and service privileges, and rotate safely by
            dependency rather than relying on human-selected short passwords and complexity alone.
      control_type: cost-increasing
    - key: encryption-dependency-governance
      name:
        zh: 治理加密依赖
        en: Govern encryption dependencies
      description:
        paragraphs:
        - zh: 先核对服务、客户端、DC及trust密钥和票据加密的真实协商，再逐步采用AES并收敛RC4等遗留算法，保留限时兼容例外。
          en: Validate actual negotiation and keys across services, clients, DCs, and trusts before adopting AES and reducing legacy algorithms such as
            RC4, retaining time-limited compatibility exceptions.
      control_type: cost-increasing
    applications:
    - target_ref: TMP1558-PARENT
      use:
        paragraphs:
        - zh: 对所有可返回离线测试材料的身份核对预认证、服务秘密、服务权限与算法依赖，优先清理高权可取材账户。
          en: Review preauthentication, service secrets, privileges, and algorithm dependencies for identities exposing offline-test material, prioritizing
            privileged targets.
      expected_effect:
        paragraphs:
        - zh: 减少未认证回复与弱秘密导致的恢复收益，不依赖抓住某次峰值。
          en: Reduce unauthenticated replies and recovery value caused by weak secrets without depending on catching a request burst.
      limitations:
        paragraphs:
        - zh: 有效域会话仍通常能请求服务票据；AES并不消除取材，且这些措施不撤销已窃取票据或已泄露krbtgt密钥。
          en: A valid domain session can normally still request service tickets. AES does not eliminate acquisition, and these measures revoke neither stolen
            tickets nor exposed krbtgt keys.
    - target_ref: TMP1558-CHILD-TIME
      use:
        paragraphs:
        - zh: 对低密度取材可能涉及的账户实施相同预认证与秘密治理，并持续复核稀疏请求的新服务关系。
          en: Apply preauthentication and secret governance to accounts exposed to low-density acquisition and review new service relationships across sparse
            requests.
      expected_effect:
        paragraphs:
        - zh: 即使序列低于短时阈值，弱秘密和不必要预认证例外也被收敛。
          en: Reduce weak secrets and unnecessary preauthentication exceptions even when the sequence falls below short-window thresholds.
      limitations:
        paragraphs:
        - zh: 不能强制合法TGS请求形成峰值，也不能仅靠算法选择识别故意延迟。
          en: These controls neither force legitimate TGS requests into bursts nor identify deliberate delay through algorithm choice alone.
    - target_ref: TMP1558-CHILD-CACHE
      use:
        paragraphs:
        - zh: 对直接协议客户端请求的目标执行服务秘密、预认证和算法治理，不以是否填充本机缓存决定配置适用性。
          en: Govern service secrets, preauthentication, and algorithms for targets requested by direct-protocol clients regardless of local-cache population.
      expected_effect:
        paragraphs:
        - zh: 控制保持在权威账户和密钥面，避免缓存旁路同时绕过风险治理。
          en: Keep controls at authoritative account and key planes so cache bypass does not also bypass risk governance.
      limitations:
        paragraphs:
        - zh: 标准服务票据仍可返回；需要进程与材料输出监控补充识别，配置控制并不使直接客户端自动可信。
          en: Standard service tickets can still be returned. Process and material-output monitoring is needed for discrimination, and configuration controls
            do not make a direct client trustworthy.
