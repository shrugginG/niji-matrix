handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-011
work_item_ref: WORK-TA0006-T1558
temporary_key_prefix: TMP1558
candidate:
  source_type: attack
  source_attack_id: T1558
  name:
    zh: 窃取或伪造 Kerberos 票据
    en: Steal or Forge Kerberos Tickets
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: 保留Kerberos票据窃取与伪造的凭据访问核心，并将父级明确适配为票据材料取得与构造。固定五项实现跨越可用票据、协议离线测试密文与构造结果，若不显式分级会把取得回复写成口令恢复，或把材料后继使用写成取得证明。
      en: Retain the credential-access core of Kerberos ticket theft and forgery while explicitly adapting the parent to ticket-material acquisition and
        construction. The five fixed-baseline implementations span usable tickets, protocol ciphertext for offline testing, and constructed outputs. Without
        explicit tiering, receipt can be mistaken for password recovery and later use for acquisition evidence.
    - zh: 三个候选匿迹子项分别改变时间密度、端点缓存落点与构造模板来源，具有不同残余痕迹和防御要求。它们来自原始实现与实验，不继承ATT&CK五名称；缓存窃取和普通从零构造仍有父级覆盖，不能因此宣称每次取得都具备匿迹设计。
      en: Three proposed children separately change temporal density, endpoint cache destination, and construction-template origin, with different residual
        traces and defensive requirements. They derive from original implementations and experiments rather than the five ATT&CK labels. Cache theft and
        ordinary construction from scratch remain parent-core, without claiming that every acquisition intentionally implements stealth.
proposed_content:
  summary:
    zh: 取得既有 Kerberos 票据、票据协议可离线测试密文或构造新票据，并改变请求密度、缓存路径或签发外观以降低材料取得和伪造的可识别性。
    en: Acquire existing Kerberos tickets or protocol ciphertext for offline testing, or construct new tickets, while changing request density, cache paths,
      or issuance appearance to reduce recognition of acquisition and forgery.
  definition_and_concept:
    paragraphs:
    - zh: Kerberos 票据材料取得与构造是攻击者实际取得既有票据及其使用所需关联材料、取得可检验未知秘密的 Kerberos 协议密文，或者利用已控制的签名与加密能力构造未经相应正规签发的新票据的凭据访问行为。材料可以来自会话缓存、认证组件、协议回复或捕获流量；完成条件是材料进入攻击者控制，而不是只发现一个
        SPN、缓存位置、读取权限或可利用配置。
      en: Kerberos Ticket-Material Acquisition and Construction is credential access in which an adversary actually obtains existing tickets and the associated
        material needed to use them, obtains Kerberos protocol ciphertext that permits testing unknown secrets, or uses controlled signing and encryption
        capability to construct a ticket without the corresponding legitimate issuance. Material may come from session caches, authentication components,
        protocol replies, or captured traffic. Completion requires adversary control of material, rather than discovery of an SPN, cache path, read permission,
        or exploitable configuration.
    - zh: 可离线测试的密文与可直接呈现的凭据须分别标识。服务票据的加密部分可以作为服务账户秘密的测试材料；无预认证 AS 回复中可测试的是客户端密钥保护的回复加密部分，而其中 TGT 仍由 krbtgt 等服务密钥保护。取得这种回复不表示已得到口令或能使用 TGT。对未知候选的计算验证属于 NJT-0137，票据提交与兑换属于
        NJT-0184，服务按票据接受身份并授权资源属于 NJT-0061。
      en: Ciphertext for offline testing and credentials ready for presentation must be labeled separately. A service ticket encrypted part can support
        testing a service-account secret. In an AS reply without preauthentication, the testable object is the reply encrypted part protected by the client
        key; its TGT remains protected by a service key such as krbtgt. Receiving that reply establishes neither password recovery nor usable TGT control.
        Computing tests of unknown candidates belongs to NJT-0137, ticket presentation and redemption to NJT-0184, and service acceptance and resource authorization
        to NJT-0061.
  stealth_characteristics:
    paragraphs:
    - zh: Kerberos 票据材料取得与构造借用组织本来就允许的缓存、签发和票据语法。单次成功回复或正确签名票据不携带攻击者意图；有意拉长服务票据请求间隔会削弱短时突发规则，直接处理回复可减少本机缓存增长，承袭真实签发票据再修改则可保留自然时限等外观。三种变化分别改变时间密度、端点留痕位置与构造材料的可见特征。
      en: Kerberos Ticket-Material Acquisition and Construction borrows caches, issuance, and ticket syntax already permitted by the organization. One successful
        reply or correctly signed ticket does not convey adversary intent. Deliberately spacing service-ticket requests weakens short-window burst rules,
        processing replies directly can reduce local-cache growth, and modifying an issued ticket can preserve natural lifetime features. These changes
        separately affect temporal density, endpoint trace location, and visible construction features.
    - zh: 匿迹效果依赖防守观察面。协议取材仍留下 KDC 请求和成功或失败记录；绕过本机票据缓存不等于绕过域控。离线构造可以不产生对应签发事务，但密钥取得、构造输出和后继验证仍可能留痕；模板承袭反而有真实先行签发。完整票据哈希、长期身份与服务关系以及端点材料输出能够提高区分能力，但缺失短时 4768
        不能证明伪造。
      en: Stealth depends on the defensive vantage point. Protocol acquisition still leaves KDC requests and success or failure records; bypassing a local
        ticket cache does not bypass the domain controller. Offline construction may lack corresponding issuance, while key acquisition, construction output,
        and subsequent validation can remain observable. Template inheritance instead includes genuine prior issuance. Complete ticket hashes, long-term
        identity-to-service relationships, and endpoint material outputs can improve discrimination, but a missing recent 4768 event does not prove forgery.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入实际复制的 TGT 或服务票据、可验证关联会话密钥的缓存材料、成功返回的 Kerberos 离线测试密文，以及有格式与密钥语义支撑的新票据或票据修改结果。发现 ccache 文件、执行 klist、请求失败、仅有 krbtgt 暴露或一次 Kerberos 登录都不足以证明本项完成。正常
        SSO、kinit、委派、缓存续期、备份、故障排查和获批安全评估须以身份所有者、进程、请求目标、工单、输出保管与寿命区分。
      en: Include actually copied TGTs or service tickets, cache material with verifiable associated session keys, successfully returned Kerberos ciphertext
        for offline testing, and new or modified ticket outputs supported by format and key semantics. Discovering a ccache file, running klist, a failed
        request, krbtgt exposure alone, or one Kerberos logon does not complete this object. Distinguish normal SSO, kinit, delegation, cache renewal, backup,
        troubleshooting, and authorized assessment using identity ownership, process, requested targets, approval, output custody, and lifetime.
    - zh: NJT-0177 拥有 OS 认证权威读取路径，NJT-0147 拥有保管库取用边界，T1552 拥有普通文件等未保护秘密路径；取得的对象确为 Kerberos 材料时，路径与材料可分别举证，但文件扩展名不决定归属。NJT-0169 截获输入，NJT-0093 改变认证过程，NJT-0178
        取得应用令牌，NJT-0166 构造 Web 认证材料，NJT-0227 取得或构造认证证书。KDC 正常 PKINIT 签发 TGT 不属于票据伪造；只有之后独立证明的票据复制或离权威修改才进入本项。
      en: NJT-0177 owns reads of OS authentication authorities, NJT-0147 managed-vault retrieval, and T1552 unprotected-secret paths such as ordinary files.
        When the actual object is Kerberos material, path and material outcomes may be independently evidenced; file extension does not determine ownership.
        NJT-0169 intercepts input, NJT-0093 changes authentication processes, NJT-0178 acquires application tokens, NJT-0166 constructs web authentication
        material, and NJT-0227 acquires or constructs authentication certificates. Normal KDC issuance of a TGT through PKINIT is not ticket forgery. Only
        separately proven subsequent ticket copying or off-authority modification enters this object.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得域内会话后，可对可到达 KDC 的服务目标收集密文，或从受侵工作站及 Linux/macOS 票据缓存复制现存材料；无预认证配置允许在不先证明目标用户秘密时取得特定 AS 回复。控制 krbtgt、服务或相应其他密钥后，可在构造位置生成或修改票据，为后继冒用与权限扩张准备材料。构造或取得完成不以实际横向访问为前提。
        en: After obtaining a domain session, an adversary can collect ciphertext for services reachable through a KDC or copy existing material from compromised
          workstations and Linux or macOS caches. A no-preauthentication configuration can expose a particular AS reply before the requester proves the
          target user secret. Control of krbtgt, service, or other applicable keys permits ticket generation or modification at a construction location
          for later impersonation or privilege expansion. Actual lateral access is not a prerequisite for completing construction or acquisition.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须具备与路径相符的读取或请求能力，而非默认域管理员。服务票据取材通常需要有效 TGT 或可得到响应的协议条件；无预认证取材依赖目标设置；缓存窃取依赖对应用户、进程、文件或缓存服务权限。伪造须掌握对应密钥及身份、realm、SPN、授权数据和签名格式知识；服务密钥不保证能通过当前全部
            PAC 检查。时间稀释还需容忍更长取材周期。
          en: The adversary needs read or request capability appropriate to the path, rather than assumed domain-admin access. Service-ticket acquisition
            normally requires a valid TGT or other protocol conditions that yield a response. AS acquisition without preauthentication depends on target
            configuration. Cache theft depends on user, process, file, or cache-service authority. Forgery requires applicable keys and knowledge of identity,
            realm, SPN, authorization data, and signature formats; a service key does not guarantee success against all current PAC checks. Temporal dilution
            also requires tolerating a longer collection period.
      defender_model:
        paragraphs:
        - zh: 防守方可集中接收各 DC 的 4768/4769、维护身份与服务账户配置快照，并结合端点进程、网络、对象读取和安全摘要化材料输出。Linux 文件审计须提前配置，KCM、KEYRING 和 macOS API 缓存需要各自传感器；Windows 票据缓存快照并非 KDC 日志字段。更新后的部分
            DC 可给出票据哈希，但旧版、缺失事件、跨域签发与采集延迟会破坏连续谱系，且普通事件不提供明文 PAC、全部组或完整票据。
          en: Defenders may centralize 4768 and 4769 from every DC, maintain identity and service-account configuration snapshots, and combine endpoint
            process, network, object-read, and safely digested material-output evidence. Linux file audit needs prior configuration; KCM, KEYRING, and macOS
            API caches require their own sensors. Windows cache snapshots are not KDC log fields. Some updated DCs expose ticket hashes, while older versions,
            missing events, cross-realm issuance, and collection delay disrupt lineage. Ordinary events do not expose plaintext PACs, all groups, or entire
            tickets.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 把取材或构造放在本机缓存指标和正规签发事务之外
      en: Place acquisition or construction outside local cache indicators and ordinary issuance transactions
    analysis:
      paragraphs:
      - zh: 攻击者直接处理协议回复而不把每个目标票据写入本机登录缓存，或离线构造不经对应签发事务的新票据，令只检查缓存增长或签发请求的传感器缺少关键动作。前者仍有域控请求，后者仍可有密钥与输出痕迹；可证明的是观察面分离，而非全面不可见。
        en: Direct processing of protocol replies avoids adding each target ticket to the local logon cache, while offline construction produces new tickets
          outside the corresponding issuance transaction. Sensors limited to cache growth or issuance requests then miss the critical operation. The first
          path still has DC requests, and the second can expose key and output traces. The supported effect is separation of observation planes, not universal
          invisibility.
    evidence_refs:
    - TMP1558-REF-REVISIT
    - TMP1558-REF-DIAMOND
    - REF-000625
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 承袭真实签发外观以降低构造材料的异常可区分性
      en: Inherit genuine issuance features to reduce the distinguishability of constructed material
    analysis:
      paragraphs:
      - zh: 先取得真实票据再只改变所需身份或授权内容，可保留符合环境的时限等签发特征，并产生一次真实先行请求。与固定值从零构造相比，局部字段和简单签发存在性规则较难区分；完整票据标识、授权一致性和构造端证据仍可能揭示变化。
        en: Obtaining a genuine ticket before changing only required identity or authorization content can preserve environment-conforming lifetime features
          and creates a real prior request. Local fields and simple issuance-existence rules become less discriminating than for construction from fixed
          defaults. Complete ticket identifiers, authorization consistency, and construction-end evidence can still reveal modification.
    evidence_refs:
    - TMP1558-REF-DIAMOND
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 延长取材间隔以削弱短窗口服务票据请求聚集
      en: Extend acquisition intervals to weaken short-window service-ticket request clustering
    analysis:
      paragraphs:
      - zh: 有意在服务票据请求间增加延迟和抖动，把同一取材序列铺开，使按单账户短窗口数量判定的规则更难看到突发。每次成功回复仍留在域控；长期服务关系和材料输出能保留信号，因此这只是对限定规则的因果推断，尚无通用规避率。
        en: Deliberate delay and jitter spread a service-ticket acquisition sequence so account-based short-window count rules see less of a burst. Every
          successful reply remains visible at the DC. Long-horizon service relationships and material output preserve signals, so the effect is a causal
          inference for bounded rules without a universal measured evasion rate.
    evidence_refs:
    - TMP1558-REF-RUBEUS
    - REF-000855
    confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
      - zh: 子项分别以服务票据取材的时间密度、原始回复是否进入本机常规缓存，以及构造结果是否承袭真实签发模板为变量。前两项可组合，第三项用于票据构造；它们不按工具、操作系统、票据名称或 Golden、Silver 等业界标签分组。普通缓存复制和一般离线构造保留在父级，不能只因其对象不同增设匿迹分类。
        en: Children use the temporal density of service-ticket acquisition, whether raw replies enter the ordinary local cache, and whether construction
          inherits a genuinely issued template as independent variables. The first two may combine; the third applies to construction. They do not partition
          by tool, operating system, ticket name, or industry labels such as Golden or Silver. Ordinary cache copying and general offline construction remain
          parent-core rather than becoming evasion classes merely because their objects differ.
    coverage: established
    subtechnique_refs:
    - TMP1558-CHILD-TIME
    - TMP1558-CHILD-CACHE
    - TMP1558-CHILD-TEMPLATE
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1558-DET-MATERIAL
    mitigations:
      coverage: available
      mitigation_refs:
      - TMP1558-MIT-REQUEST
      - TMP1558-MIT-CACHE
      - MIT-000187
  evidence:
    claim_refs:
    - TMP1558-CLM-SCOPE
    - TMP1558-CLM-ASREP
    - TMP1558-CLM-TIME
    - TMP1558-CLM-CACHE
    - TMP1558-CLM-TEMPLATE
    - TMP1558-CLM-DETECTION
    case_refs:
    - TMP1558-CASE-CHP-DIAMOND
    reference_refs:
    - REF-000625
    - REF-000852
    - REF-000854
    - REF-000855
    - REF-000435
    - REF-000303
    - REF-000860
    - TMP1558-REF-RUBEUS
    - TMP1558-REF-DIAMOND
    - TMP1558-REF-REVISIT
    - TMP1558-REF-ASREP
    - TMP1558-REF-RFC4120
    - TMP1558-REF-CCACHE
    - TMP1558-REF-BIFROST
    - TMP1558-REF-PAC
    - TMP1558-REF-KRBTGT-RESET
  research:
    limitations:
      paragraphs:
      - zh: 平台规范支持协议和字段语义，原始工具与实验支持实现能力及局部痕迹变化，事件报告仅支持其明确记录的行为。这三种证据不能相互替代。延迟取材尚缺公开的对照告警率，2019年缓存旁路实验需在当前客户端复验，2022年模板实验也不是对所有当前 PAC 与跨域策略的承诺。
        en: Platform specifications support protocol and field semantics, original tooling and experiments support implementation capability and local trace
          changes, and incident reports support only the behaviors explicitly recorded. These evidence types are not interchangeable. Delayed acquisition
          lacks public comparative alert rates, the 2019 cache-bypass experiment needs replication on current clients, and the 2022 template experiment
          makes no promise for every current PAC or cross-realm policy.
      - zh: CERT Polska 在 CHP 早期活动中记录了 Diamond Ticket 构造，但未公开精确票据字段、密钥取得链、服务接受证据或该构造的规避结果，也未完全确认早期与十二月活动属于同一攻击者。材料分类应保留完整票据凭据、仅有票据密文和离线测试密文的区别；后继使用不能倒推出缺失的取得方式。
        en: CERT Polska records Diamond Ticket construction during early CHP activity without publishing exact ticket fields, a key-acquisition chain, service
          acceptance, or evasion outcomes for that construction. It does not fully confirm the same actor across early and December activity. Material classification
          must retain the distinction among complete ticket credentials, ticket ciphertext alone, and ciphertext for offline testing. Subsequent use cannot
          reconstruct an unobserved acquisition path.
proposed_subtechniques:
- schema_version: 2.0.0
  type: evasion-subtechnique
  id: TMP1558-CHILD-TIME
  name:
    zh: 低密度服务票据取材
    en: Low-Density Service-Ticket Material Acquisition
  summary:
    zh: 有意延长和扰动服务票据请求间隔，使取材序列在短时间窗内不形成明显峰值。
    en: Deliberately extend and vary service-ticket request intervals so acquisition does not form a prominent short-window spike.
  aliases: []
  parent_ref: TMP1558-PARENT
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 低密度服务票据取材是在实际取得服务票据协议密文的过程中，由攻击者控制请求间隔和节奏，把原本可集中完成的请求分散到更长周期。其直接目的仍是取得材料供离线测试或后继使用，匿迹变量是同一取材活动的时间密度。
      en: Low-Density Service-Ticket Material Acquisition deliberately controls request intervals and cadence while actually acquiring service-ticket protocol
        ciphertext, spreading requests that could otherwise be concentrated across a longer horizon. Its immediate purpose remains material acquisition
        for offline testing or later use; the evasion variable is the temporal density of the same acquisition activity.
    - zh: 延迟与抖动是可实现的节奏控制，指定单个SPN本身只说明目标选择。必须有取材结果以及有意调整节奏的实施证据或足够序列证据，不能把任何低量服务访问都解释为本项。
      en: Delay and jitter implement cadence control, while specifying one SPN merely describes target selection. Inclusion requires acquisition results
        and implementation or sufficient sequence evidence of deliberate cadence adjustment. Low-volume service access alone does not establish this child.
  stealth_characteristics:
    paragraphs:
    - zh: 低密度服务票据取材把请求计数从单一短窗口分散出去，降低突发量和固定周期的可区分性。只按五分钟账户请求数告警的规则可能保留每个事件却无法聚合完整取材序列。
      en: Low-Density Service-Ticket Material Acquisition disperses request counts beyond one short window and reduces the distinguishability of bursts
        or fixed cadence. A rule limited to five-minute per-account counts may retain every event but fail to aggregate the acquisition sequence.
    - zh: 域控仍可观察目标服务、账户、来源和回复结果。延长保留并按首次服务关系、目标敏感性和端点输出关联，可弥补峰值信号的损失；极少目标或较长间隔也会限制防守方复原意图的把握。
      en: The DC still observes service targets, account, origin, and response status. Longer retention and correlation of first-seen service relationships,
        target sensitivity, and endpoint output can compensate for the lost peak signal. Very few targets or long intervals also limit confidence in reconstructing
        intent.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有意延迟或扰动且已取得材料的服务票据请求；排除仅有枚举、统计、失败请求和普通单目标取材。缓存是否被写入不决定本项，与本地缓存旁路取材可分别成立。
      en: Include deliberately delayed or varied service-ticket requests that yielded material. Exclude enumeration, statistics, failed requests, and ordinary
        single-target acquisition alone. Cache population does not determine this child, which can coexist with Local-Cache-Bypassing Material Acquisition.
    - zh: 任务调度、用户零散访问、重试退避、链路迟延、批处理和负载均衡都可能形成稀疏序列，须结合进程控制、调度参数、目标与输出判断；不能只靠低速推断恶意。它不改变构造票据的内容，不属于签发模板承袭构造。
      en: Scheduling, sporadic user access, retry backoff, network latency, batch work, and load balancing can all produce sparse sequences. Assess process
        control, scheduling parameters, targets, and outputs rather than inferring malice from low rate. This child does not modify constructed ticket content
        and differs from Issuance-Template-Inheriting Construction.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 适用于攻击者能够持续访问KDC、愿意延长取材时间且担心域控侧短时突发检测的域内活动；它可以与直接协议处理或正常API取材组合。
        en: This applies when an adversary can maintain KDC reachability, tolerates a longer acquisition period, and expects short-burst detection at the
          DC. It can combine with direct protocol handling or ordinary API acquisition.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需能控制请求发送节奏并接收成功回复，有足够会话寿命或续期能力完成计划。抖动不赋予身份权限，也不保证取得的密文可以在现实成本内破解。
          en: The adversary must control request timing and receive successful replies, with enough session lifetime or renewal capability to finish the
            plan. Jitter confers no identity authority and does not guarantee that acquired ciphertext can be cracked at practical cost.
      defender_model:
        paragraphs:
        - zh: 防守观察模型以集中KDC事件和历史服务关系为主；短窗口计数容易丢失聚集度，长窗口仍可累计目标覆盖。IP变化、NAT和多DC采集差异会影响同一序列归并。
          en: The observation model centers on centralized KDC events and historical service relationships. Short-window counts lose clustering while long
            windows preserve cumulative target coverage. IP changes, NAT, and collection differences among DCs affect sequence joins.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 延长取材间隔以削弱短窗口服务票据请求聚集
      en: Extend acquisition intervals to weaken short-window service-ticket request clustering
    analysis:
      paragraphs:
      - zh: 有意在服务票据请求间增加延迟和抖动，把同一取材序列铺开，使按单账户短窗口数量判定的规则更难看到突发。每次成功回复仍留在域控；长期服务关系和材料输出能保留信号，因此这只是对限定规则的因果推断，尚无通用规避率。
        en: Deliberate delay and jitter spread a service-ticket acquisition sequence so account-based short-window count rules see less of a burst. Every
          successful reply remains visible at the DC. Long-horizon service relationships and material output preserve signals, so the effect is a causal
          inference for bounded rules without a universal measured evasion rate.
    evidence_refs:
    - TMP1558-REF-RUBEUS
    - REF-000855
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1558-DET-MATERIAL
    mitigations:
      coverage: available
      mitigation_refs:
      - TMP1558-MIT-REQUEST
  evidence:
    claim_refs:
    - TMP1558-CLM-TIME
    case_refs: []
    reference_refs:
    - TMP1558-REF-RUBEUS
    - REF-000855
    - REF-000854
    - TMP1558-REF-RFC4120
  research:
    limitations:
      paragraphs:
      - zh: 原始实现证明延迟与抖动可被选择，短窗口峰值减弱是对检测逻辑的明确推断，没有公开统一的最优间隔或规避率。正常稀疏访问与恶意序列重叠，正式应用应把候选告警与确认取材区分。
        en: The original implementation establishes selectable delay and jitter. Reduced short-window peaks are an explicit inference about detection logic,
          without a public universal optimum interval or evasion rate. Legitimate sparse access overlaps with malicious sequences, so operational use must
          distinguish candidate alerts from confirmed acquisition.
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
- schema_version: 2.0.0
  type: evasion-subtechnique
  id: TMP1558-CHILD-CACHE
  name:
    zh: 本地缓存旁路取材
    en: Local-Cache-Bypassing Material Acquisition
  summary:
    zh: 直接构造并处理 Kerberos 回复材料，避免将每个目标服务票据加入本机常规登录缓存。
    en: Construct and process Kerberos response material directly, avoiding addition of every target service ticket to the ordinary local logon cache.
  aliases: []
  parent_ref: TMP1558-PARENT
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 本地缓存旁路取材是攻击者直接发送和解析Kerberos协议交互，把返回材料交给自身输出或内存处理路径，而不让每个目标服务票据进入本机常规认证缓存。它改变材料取得后的落点，使本机票据缓存增长不再完整表示取材范围。
      en: Local-Cache-Bypassing Material Acquisition sends and parses Kerberos exchanges directly, routing returned material into adversary-controlled output
        or memory rather than adding every target service ticket to the ordinary authentication cache. It changes the acquisition destination so local ticket-cache
        growth no longer represents the full acquisition scope.
    - zh: 其边界由是否有意绕开常规缓存填充决定，而非工具名称或文件格式。协议回复可以仍由正规KDC产生；攻击者取得原始密文无需伪造票据，也无需进行离线口令猜测。
      en: The boundary is intentional bypass of ordinary cache population rather than tool name or file format. Replies can still be produced by the legitimate
        KDC. Acquiring their raw ciphertext requires neither ticket forgery nor offline password guessing.
  stealth_characteristics:
    paragraphs:
    - zh: 本地缓存旁路取材使防守方在缓存中看不到与目标请求数量相称的服务票据增长。原始Windows实验对比标准API取材与手工TGS交互，说明后者可只留下少量辅助缓存痕迹，削弱以大量缓存条目为依据的主机指标。
      en: Local-Cache-Bypassing Material Acquisition prevents local caches from growing in proportion to target requests. The original Windows experiment
        compares standard API acquisition with manual TGS exchanges and shows that the latter can leave only limited auxiliary cache traces, weakening a
        host indicator based on numerous cached entries.
    - zh: KDC仍接收请求并可生成4769，来源进程也可能直接连接88端口并产生材料输出。匿迹效果只针对缓存观察面；启用域控与进程网络遥测后，异常客户端行为仍可被观察，缓存缺少条目不能自行证明旁路。
      en: The KDC still receives requests and may generate 4769, while the source process may connect directly to port 88 and produce material output. The
        effect is confined to cache observation. DC and process-network telemetry can still observe unusual client behavior, and missing cache entries do
        not independently prove bypass.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有直接协议处理和材料输出证据的常规缓存旁路；仅把既有缓存导出、从磁盘复制ccache或离线构造票据都不满足本项。请求密度可以高或低，与低密度服务票据取材是可组合的独立变量。
      en: Include bypass supported by direct protocol handling and material-output evidence. Exporting an existing cache, copying ccache from disk, or offline
        ticket construction does not satisfy this child. Request density may be high or low, making it independently composable with Low-Density Service-Ticket
        Material Acquisition.
    - zh: 合法非Windows客户端、自带Kerberos栈的服务、测试程序、容器和内存缓存都可能不填充Windows登录缓存。必须核对批准客户端、实际backend、进程所有者和输出，不得把没有klist条目或非lsass网络连接直接判成恶意。
      en: Legitimate non-Windows clients, services with their own Kerberos stacks, test programs, containers, and memory caches may not populate a Windows
        logon cache. Check approved clients, actual backend, process ownership, and output rather than treating missing klist entries or a non-lsass connection
        as malicious.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 适用于攻击者在受侵端点收集多服务材料，并预期主机侧会检查票据缓存规模的场景。手工协议实现也可从独立主机发送请求，但缺少本机缓存观测的场景不能据此声称获得额外规避。
        en: This applies when an adversary collects material for multiple services on a compromised endpoint and expects host-side inspection of ticket-cache
          size. Manual protocol implementations can also operate from an independent host, but additional evasion cannot be claimed where local-cache observation
          was absent to begin with.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须能发起合法格式的Kerberos交互并解析返回的加密部分，通常持有有效TGT或另一可满足协议的取材条件。它可能免去对其他用户LSASS的直接读取，但并不普遍免除所用TGT或会话密钥的取得条件。
          en: The adversary must initiate validly formatted Kerberos exchanges and parse returned encrypted parts, normally holding a valid TGT or another
            condition satisfying the exchange. The path may avoid directly reading another user LSASS context but does not universally remove acquisition
            prerequisites for its TGT or session key.
      defender_model:
        paragraphs:
        - zh: 防守方能观察进程网络连接、KDC事务和输出文件或内存取证，但必须额外采集本机缓存快照才能比较缓存差异。常规Sysmon并不记录票据内容，KDC事件也不标记客户端是否填充缓存；两端按设备、进程、身份、服务与时间连接后才有意义。
          en: Defenders may observe process-network connections, KDC transactions, and output files or memory evidence, but need additional local-cache
            snapshots to compare cache behavior. Ordinary Sysmon does not record ticket contents, and KDC events do not say whether the client populated
            its cache. Joining device, process, identity, service, and time across both sides is necessary.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 在直接协议处理路径取得材料而避开本机缓存增长指标
      en: Acquire through direct protocol handling outside local cache-growth indicators
    analysis:
      paragraphs:
      - zh: 直接解析回复并输出材料改变了常规缓存消费者路径，使每个目标服务票据不必写入登录缓存。缓存计数看不到完整取材图像，但4769、进程连接与输出仍存在，故影响是对特定端点观察的旁路。
        en: Direct reply parsing and material output replace the ordinary cache-consumer path, so every target service ticket need not enter the logon cache.
          Cache counts miss the full acquisition picture while 4769, process connections, and output remain. The effect is bypass of a specific endpoint
          observation.
    evidence_refs:
    - TMP1558-REF-REVISIT
    - TMP1558-REF-RUBEUS
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1558-DET-MATERIAL
    mitigations:
      coverage: available
      mitigation_refs:
      - TMP1558-MIT-REQUEST
  evidence:
    claim_refs:
    - TMP1558-CLM-CACHE
    case_refs: []
    reference_refs:
    - TMP1558-REF-REVISIT
    - TMP1558-REF-RUBEUS
    - REF-000854
    - REF-000855
    - TMP1558-REF-RFC4120
  research:
    limitations:
      paragraphs:
      - zh: 支持性实验针对2019年Windows与相应实现，不能推定所有操作系统的缓存语义相同。未观察到缓存增长可能源于传感器、backend、会话切换或清理；没有直接回复与输出关联时只能保留候选。
        en: The supporting experiment concerns Windows and implementations in 2019; cache semantics cannot be generalized across all operating systems.
          Missing cache growth may result from sensors, backend choice, session changes, or cleanup. Without correlation of direct replies and output, the
          result remains a candidate.
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
- schema_version: 2.0.0
  type: evasion-subtechnique
  id: TMP1558-CHILD-TEMPLATE
  name:
    zh: 签发模板承袭构造
    en: Issuance-Template-Inheriting Construction
  summary:
    zh: 取得真实签发票据后修改所需身份或授权内容，保留自然签发特征以降低伪造外观。
    en: Modify required identity or authorization content in a genuinely issued ticket while retaining natural issuance features to reduce signs of forgery.
  aliases: []
  parent_ref: TMP1558-PARENT
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 签发模板承袭构造以真实签发的Kerberos票据作为构造基础，使用已控制密钥解密，改变所需身份或授权内容，重新计算适用签名并加密输出。攻击者取得的是未经该次正规授权的新材料，同时保留模板中不需改变的时限、格式或其他自然字段。
      en: Issuance-Template-Inheriting Construction uses a genuinely issued Kerberos ticket as the construction basis, decrypts it with controlled keys,
        changes required identity or authorization content, and recalculates applicable signatures before encrypting the output. The adversary obtains new
        material lacking the corresponding legitimate authorization while preserving unmodified template lifetime, format, or other natural fields.
    - zh: 原始Diamond Ticket实验提供此变量的具体实现，分类不以Diamond名称为条件。完整重放原票据没有构造结果；使用证书、密码或已有秘密向KDC正常请求一个未修改TGT也没有本项所需的离权威修改。
      en: The original Diamond Ticket experiment implements this variable, but classification does not depend on the Diamond label. Replaying an unchanged
        ticket creates no construction result. Using a certificate, password, or existing secret to request an unmodified TGT from the KDC also lacks the
        required off-authority modification.
  stealth_characteristics:
    paragraphs:
    - zh: 签发模板承袭构造把真实签发的外观带入未经授权的材料，减少从零构造时常见的固定时限或字段偏差。先行真实AS请求也使仅检查是否存在某次签发的规则更难区分修改后的票据。
      en: Issuance-Template-Inheriting Construction carries genuine issuance features into unauthorized material, reducing fixed lifetime or field errors
        associated with construction from scratch. A real preceding AS request also makes a rule checking only for some prior issuance less able to distinguish
        the modified ticket.
    - zh: 被修改的票据密文字节及哈希一般会改变，身份或授权内容仍可能与原请求、目录状态或权限历史不一致。原始实验并未令构造进程、密钥控制和后继使用不可见；完整标识与授权一致性观察可以保留判别力。
      en: Modified ticket ciphertext bytes and hashes generally change, and identity or authorization content can disagree with the original request, directory
        state, or permission history. The original experiment did not make the construction process, key control, or subsequent use invisible. Complete
        identifiers and authorization-consistency observations can preserve discrimination.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入已证明真实票据输入与离权威修改输出之间联系的构造；从零构造、只手工选择正常字段、普通票据续期或原样重放均不满足本项。是否绕过本机缓存和请求节奏都不是本项判定变量。
      en: Include construction with a proven link between a genuinely issued ticket input and an off-authority modified output. Construction from scratch,
        manually selecting normal-looking fields alone, normal renewal, and unchanged replay do not meet this child. Local-cache bypass and request cadence
        do not determine this variable.
    - zh: 合法KDC签发、授权委派、票据续期、管理员故障排查和研究实验均可包含读取与编码票据，不能只凭解析或重新序列化认定伪造。须证明攻击者控制的语义改变及所需密钥；服务接受只是后继证据，不能代替构造谱系。
      en: Legitimate KDC issuance, authorized delegation, renewal, administrator troubleshooting, and research can involve reading and encoding tickets.
        Parsing or reserialization alone does not establish forgery. Adversary-controlled semantic changes and required key capability must be established.
        Service acceptance is subsequent evidence and cannot replace construction lineage.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 适用于攻击者已控制相应签名与加密密钥，但希望减少固定模板异常的环境。其可从低权限真实身份取得模板后修改授权内容；这种高前提行为通常发生在域秘密已暴露之后，而非通过单次普通低权请求自动获得伪造能力。
        en: This applies when an adversary already controls applicable signing and encryption keys and seeks to reduce fixed-template anomalies. A genuine
          lower-privilege identity can supply a template before authorization content is modified. Such demanding prerequisites normally follow domain-secret
          exposure; an ordinary low-privilege request does not itself grant forgery capability.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需控制可用真实票据、对应解密与签名密钥以及目标realm和身份信息。修改必须满足部署版本的PAC签名、授权和跨域规则，持有服务账户密钥不等于掌握所有验证所需秘密。
          en: The adversary needs a usable genuine ticket, applicable decryption and signing keys, and target realm and identity information. Modifications
            must satisfy deployed PAC signature, authorization, and cross-realm rules. Possession of a service-account key does not imply control of every
            secret required for validation.
      defender_model:
        paragraphs:
        - zh: 防守方可能看见真实签发记录和后继票据请求，但标准4768/4769不会暴露整个PAC。新版本安全票据哈希有助于检查确切对象连续性，授权差异则需经批准的票据检验、目录历史和目标会话证据；没有这些数据时只可判断谱系风险。
          en: Defenders may see genuine issuance and later requests, but standard 4768 and 4769 do not expose the entire PAC. Newer safe ticket hashes can
            test exact-object continuity, while authorization differences require approved ticket inspection, directory history, and target-session evidence.
            Without them, the result is a lineage risk rather than confirmed modification.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 承袭真实签发外观以降低构造材料的异常可区分性
      en: Inherit genuine issuance features to reduce the distinguishability of constructed material
    analysis:
      paragraphs:
      - zh: 先取得真实票据再只改变所需身份或授权内容，可保留符合环境的时限等签发特征，并产生一次真实先行请求。与固定值从零构造相比，局部字段和简单签发存在性规则较难区分；完整票据标识、授权一致性和构造端证据仍可能揭示变化。
        en: Obtaining a genuine ticket before changing only required identity or authorization content can preserve environment-conforming lifetime features
          and creates a real prior request. Local fields and simple issuance-existence rules become less discriminating than for construction from fixed
          defaults. Complete ticket identifiers, authorization consistency, and construction-end evidence can still reveal modification.
    evidence_refs:
    - TMP1558-REF-DIAMOND
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1558-DET-MATERIAL
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000187
  evidence:
    claim_refs:
    - TMP1558-CLM-TEMPLATE
    - TMP1558-CLM-CASE
    case_refs:
    - TMP1558-CASE-CHP-DIAMOND
    reference_refs:
    - TMP1558-REF-DIAMOND
    - REF-000854
    - REF-000855
    - TMP1558-REF-RFC4120
    - REF-000435
  research:
    limitations:
      paragraphs:
      - zh: 原始实验支持构造、正常字段承袭及局部检测弱化，当前平台更新会改变接受条件。公开事件只说明Diamond构造，未给出模板字段或规避成效；因此子项成立性与实际事件匿迹效果必须分开校准。
        en: The original experiment supports construction, inheritance of normal fields, and weakened local detection. Current platform updates alter acceptance
          conditions. The public incident establishes Diamond construction without template fields or evasion outcomes, so existence of the child and real-incident
          stealth effectiveness require separate calibration.
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
defense_candidates:
  detection_strategies:
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1558-DET-MATERIAL
    name:
      zh: Kerberos 取材与构造结果谱系
      en: Kerberos Acquisition and Construction Outcome Lineage
    summary:
      zh: 把KDC请求、具体缓存读取或构造输入连接到实际材料结果，并将异常线索与完成行为分级。
      en: Connect KDC requests, specific cache reads, or construction inputs to actual material outcomes, distinguishing anomaly leads from completed behavior.
    description:
      paragraphs:
      - zh: 策略以材料结果为共同目标，分别从请求回复、既存缓存和构造输入进入。请求分析兼顾长期稀疏序列与直接协议输出，缓存分析核对真正读取的对象和输出，构造分析检验票据对象与授权谱系。资源侧登录只作独立后继证据，不能替代取得或修改结果。
        en: The common objective is a material outcome reached through request and reply, an existing cache, or a construction input. Request analysis covers
          long sparse sequences and direct protocol outputs, cache analysis validates actual read objects and outputs, and construction analysis tests ticket-object
          and authorization lineage. Resource logons are independent successor evidence and cannot replace acquisition or modification results.
    detects_refs:
    - TMP1558-PARENT
    - TMP1558-CHILD-TIME
    - TMP1558-CHILD-CACHE
    - TMP1558-CHILD-TEMPLATE
    domains:
    - enterprise
    analytic_refs:
    - TMP1558-NJA-REQUEST
    - TMP1558-NJA-CACHE
    - TMP1558-NJA-CONSTRUCTION
    evidence_refs:
    - REF-000854
    - REF-000855
    - REF-000230
    - REF-001042
    - TMP1558-REF-RUBEUS
    - TMP1558-REF-REVISIT
    - TMP1558-REF-ASREP
    - TMP1558-REF-RFC4120
    - TMP1558-REF-CCACHE
    - TMP1558-REF-DIAMOND
    - TMP1558-REF-PAC
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  detection_analytics:
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1558-NJA-REQUEST
    strategy_ref: TMP1558-DET-MATERIAL
    name:
      zh: 跨窗口取材请求与直接协议输出关联
      en: Cross-Window Acquisition Requests and Direct-Protocol Output Correlation
    summary:
      zh: 识别持续的新服务目标、无预认证成功回复或异常进程直接取材，并以材料输出决定是否确认取得。
      en: Identify persistent new service targets, successful replies without preauthentication, or unusual direct acquisition by a process, using material
        output to determine acquisition confirmation.
    domains:
    - enterprise
    platforms:
    - Windows
    - Active Directory
    logic:
      paragraphs:
      - zh: 集中成功4769并按realm、TargetUserName/TargetDomainName、规范化IpAddress和ServiceSid/ServiceName累积目标关系。在一小时、二十四小时与七日窗口对照三十日同角色基线，检验新服务目标覆盖、连续稀疏请求与加密选择变化；阈值由环境回放确定，不要求高峰或RC4。4768分支关注Status=0且PreAuthType=0的回复，并连接当时的DONT_REQ_PREAUTH配置；初始无预认证探测后正常挑战与失败请求不算成功取材。ServiceName通常是服务账户名称，不应直接当完整SPN，精确SPN需协议遥测或版本化目录映射。
        en: Centralize successful 4769 and accumulate target relationships by realm, TargetUserName or TargetDomainName, normalized IpAddress, and ServiceSid
          or ServiceName. Compare one-hour, twenty-four-hour, and seven-day windows with a thirty-day peer-role baseline for new-service coverage, persistent
          sparse requests, and encryption-choice changes. Set thresholds by local replay rather than requiring a burst or RC4. The 4768 branch considers
          Status zero and PreAuthType zero joined to the contemporaneous DONT_REQ_PREAUTH setting. Initial unauthenticated probes followed by a normal challenge,
          and failed requests, do not establish successful acquisition. ServiceName is commonly the service-account name rather than a complete SPN; exact
          SPNs require protocol telemetry or versioned directory mapping.
      - zh: 将候选连接到源端Sysmon 1/3或等价EDR的ProcessGuid、User、SourceIp和KDC地址；检查实际配置的日志是否保留源端口和DC事件中的IpPort，不能只以同一NAT地址绑定进程。非预期进程直接连接88、可识别回复输出或经授权内存/文件检验可加强直接取材分支。缓存快照差异只作可选佐证，不把缺少klist条目视为旁路证明。成功回复与陌生服务关系输出request_material_candidate；只有对应返回密文或票据凭据被检查并归于攻击者控制进程/接收者时，升级confirmed_material_acquisition；低密度与缓存旁路分类还须各自实施证据。
        en: Join candidates to source Sysmon 1 and 3 or equivalent EDR using ProcessGuid, User, SourceIp, and KDC address. Check whether configured telemetry
          retains source ports and the DC event IpPort; a shared NAT address cannot identify a process. An unexpected process connecting directly to port
          88, recognizable reply output, or authorized memory or file inspection strengthens the direct-acquisition branch. Cache-snapshot differences are
          optional corroboration, and missing klist entries do not prove bypass. Successful replies and unfamiliar service relationships yield request_material_candidate.
          Upgrade to confirmed_material_acquisition only when corresponding reply ciphertext or ticket credentials are inspected and attributed to an adversary-controlled
          process or recipient. Low-density and cache-bypass classification each need their own implementation evidence.
    data_requirements:
    - source_type: kdc-service-ticket-events
      name:
        zh: KDC 服务票据请求
        en: KDC service-ticket requests
      channel: Security/4769; success audit required
      required_fields:
      - system.timecreated
      - system.computer
      - system.version
      - targetusername
      - targetdomainname
      - servicename
      - servicesid
      - ipaddress
      - ipport
      - ticketencryptiontype
      - status
    - source_type: kdc-as-ticket-events
      name:
        zh: KDC AS 回复审计
        en: KDC AS-reply audit
      channel: Security/4768; success audit required
      required_fields:
      - system.timecreated
      - system.computer
      - system.version
      - targetusername
      - targetdomainname
      - ipaddress
      - preauthtype
      - ticketencryptiontype
      - status
    - source_type: directory-service-configuration
      name:
        zh: 身份和服务目标配置快照
        en: Identity and service-target configuration snapshots
      channel: versioned AD inventory
      required_fields:
      - valid_from
      - valid_to
      - objectsid
      - samaccountname
      - serviceprincipalname
      - useraccountcontrol
      - msds-supportedencryptiontypes
      - owner
      - approved_client_hosts
    - source_type: endpoint-process-network
      name:
        zh: 源端进程网络事件
        en: Source process-network events
      channel: configured Sysmon Operational/1,3 or validated EDR equivalent
      required_fields:
      - utctime
      - computer
      - processguid
      - processid
      - image
      - user
      - sourceip
      - sourceport
      - destinationip
      - destinationport
    - source_type: controlled-material-inspection
      name:
        zh: 经授权材料输出检验
        en: Authorized material-output inspection
      channel: controlled incident/lab artifact inspection; not native 4769 or Sysmon content
      required_fields:
      - inspection_time
      - host_id
      - process_start_key
      - artifact_id
      - artifact_digest
      - material_class
      - principal
      - realm
      - service_or_reply_type
      - format_validation_result
      - custody_or_recipient
    observables:
    - zh: 同一身份跨多个窗口持续请求此前未用过的服务账户，即使每个短窗口数量很低。
      en: One identity persistently requests previously unused service accounts across windows despite low short-window counts.
    - zh: 意外进程直接与KDC交互，且其输出经检验包含相应Kerberos回复密文，缓存数量并不反映目标范围。
      en: An unexpected process exchanges directly with a KDC and produces inspected Kerberos reply ciphertext while cache counts do not represent the target
        scope.
    - zh: 无预认证账户收到成功AS回复，且返回加密部分被复制到非批准接收者。
      en: A no-preauthentication account receives a successful AS reply whose encrypted part is copied to an unapproved recipient.
    correlation:
      window:
        zh: 请求到源端输出默认五分钟，窗口统计为一小时、二十四小时和七日；角色与服务关系基线三十日，批处理周期和取材间隔用回放调优。
        en: Default five minutes from request to source output; aggregate one-hour, twenty-four-hour, and seven-day windows with a thirty-day role and service-relationship
          baseline, tuned by replay to batch schedules and acquisition intervals.
      dimensions:
      - realm
      - principal
      - service_account_sid
      - service_spn_if_available
      - source_device
      - client_address
      - client_port_if_available
      - domain_controller
      - process_guid
      - artifact_digest
    false_positives:
    - zh: 新应用上线、合法多服务SSO、资产扫描、获批安全评估和批量任务会产生新服务覆盖；遗留无预认证账户可合法请求回复。
      en: New applications, legitimate multi-service SSO, inventory scanning, approved assessment, and batch tasks create new-service coverage. Legacy accounts
        without preauthentication can request replies legitimately.
    - zh: Java、Linux互操作、测试客户端或自带协议栈的服务可合法从非lsass进程连接88端口。
      en: Java, Linux interoperability, test clients, and services with their own stacks can legitimately connect to port 88 outside lsass.
    blind_spots:
    - zh: 4768/4769不提供材料输出、明文PAC或离线猜测结果。加密类型只是背景；AES也能产生可测试材料。独立主机或纯内存输出缺少端点数据时无法确认取得。
      en: 4768 and 4769 do not provide material output, plaintext PACs, or offline-guessing outcomes. Encryption type is context, and AES can also yield
        testable material. An independent host or memory-only output without endpoint data prevents acquisition confirmation.
    - zh: 不完整DC采集、跨域referral、IP复用、端口缺失和高延迟可破坏关联。Sysmon网络事件需显式启用，不能假定总有ProcessGuid与请求一一映射。
      en: Incomplete DC collection, cross-realm referrals, reused IPs, missing ports, and delay can break joins. Sysmon network events require explicit
        enablement; a one-to-one request-to-ProcessGuid mapping cannot be assumed.
    tuning_guidance:
      paragraphs:
      - zh: 按用户、计算机与服务身份、服务角色、批准客户端及任务周期分别建基线。核对事件版本、ServiceSid解析和加密字段含义，再使用三十日回放设置阈值；不要通过排除全部服务账户、所有AES或签名进程消除误报。无法取得材料输出时保留候选级别，缓存旁路与低密度意图只由独立实施证据提升。
        en: Baseline user, computer, and service identities separately by service role, approved clients, and schedule. Validate event versions, ServiceSid
          resolution, and encryption-field semantics before setting thresholds through thirty-day replay. Do not remove false positives by excluding all
          service accounts, every AES request, or signed processes. Retain candidate status when material output is unavailable, and elevate cache-bypass
          or low-density intent only through independent implementation evidence.
    evidence_refs:
    - REF-000854
    - REF-000855
    - REF-000230
    - TMP1558-REF-RUBEUS
    - TMP1558-REF-REVISIT
    - TMP1558-REF-ASREP
    - TMP1558-REF-RFC4120
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1558-NJA-CACHE
    strategy_ref: TMP1558-DET-MATERIAL
    name:
      zh: 文件缓存读取到票据凭据输出关联
      en: File-Cache Read to Ticket-Credential Output Correlation
    summary:
      zh: 对已识别的FILE/DIR缓存关联实际读取、调用进程与安全检验输出，区分打开缓存与已取得票据。
      en: For identified FILE or DIR caches, join actual reads, caller processes, and safely inspected output to distinguish cache opening from acquired
        tickets.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 先按主机实际krb5配置、运行态缓存名称和owner建立FILE/DIR缓存清单，不把/tmp/krb5cc固定为唯一位置。对这些路径预配置Linux Audit读取规则，按同一audit事件序列连接SYSCALL、PATH与PROCTITLE，保留success、pid/ppid、auid、uid/euid、exe、name和inode。以进程启动记录消除PID复用，按对象owner与批准服务角色识别越权或不符用途的读取。只读打开或access检查先输出cache_read_candidate，不证明完整内容返回。
        en: Build a FILE or DIR inventory from actual krb5 configuration, runtime cache names, and owners rather than assuming /tmp/krb5cc is the only location.
          Preconfigure Linux Audit read rules for these paths and join SYSCALL, PATH, and PROCTITLE records by audit event serial, retaining success, pid
          or ppid, auid, uid or euid, exe, name, and inode. Use process-start records to disambiguate reused PIDs and compare object ownership with approved
          service roles to detect unauthorized or inconsistent reads. A read-only open or access check initially yields cache_read_candidate, without proving
          full content return.
      - zh: 再关联同进程或明确派生进程的复制文件、外送对象或取证内存，在受限检验环境确认ccache/KRB-CRED结构及principal、realm、服务、寿命与会话密钥存在性，仅保存安全摘要。原对象和输出对应且接收者受攻击者控制时输出confirmed_ticket_acquisition；只含无法用于认证的票据密文时标记ciphertext_only，不能声称已可Pass-the-Ticket。KCM、KEYRING、MEMORY和macOS
          API读取须另部署传感器，本分析不以文件读规则假装覆盖它们。
        en: Then join copied files, transferred objects, or forensic memory from the same process or an explicitly linked child. In a restricted inspection
          environment, validate ccache or KRB-CRED structure, principal, realm, service, lifetime, and session-key presence while retaining only safe digests.
          Matching source and output with an adversary-controlled recipient yields confirmed_ticket_acquisition. Label ciphertext_only when the output contains
          ticket ciphertext insufficient for authentication, without claiming readiness for Pass-the-Ticket. KCM, KEYRING, MEMORY, and macOS API reads need
          separate sensors; file-read rules do not cover them.
    data_requirements:
    - source_type: linux-file-cache-inventory
      name:
        zh: 实际文件缓存清单
        en: Actual file-cache inventory
      channel: krb5 configuration and approved runtime inventory
      required_fields:
      - host_id
      - cache_backend
      - cache_name
      - path
      - owner_uid
      - device
      - inode
      - valid_from
      - valid_to
    - source_type: linux-audit-cache-read
      name:
        zh: Linux 缓存读取审计
        en: Linux cache-read audit
      channel: 'auditd preconfigured file read rules: SYSCALL/PATH/PROCTITLE'
      required_fields:
      - audit_timestamp
      - audit_serial
      - success
      - syscall
      - pid
      - ppid
      - auid
      - uid
      - euid
      - exe
      - name
      - inode
      - proctitle
    - source_type: linux-process-start
      name:
        zh: Linux 进程启动身份
        en: Linux process-start identity
      channel: auditd EXECVE/SYSCALL or validated endpoint process sensor
      required_fields:
      - timestamp
      - host_id
      - pid
      - process_start_time
      - ppid
      - exe
      - uid
    - source_type: controlled-cache-output-inspection
      name:
        zh: 受限缓存输出检验
        en: Restricted cache-output inspection
      channel: controlled incident/lab artifact inspection
      required_fields:
      - inspection_time
      - host_id
      - process_start_key
      - source_object_id
      - output_artifact_id
      - output_digest
      - cache_format
      - principal
      - realm
      - service
      - ticket_lifetime
      - session_key_present
      - recipient_control
    observables:
    - zh: 非批准reader成功读取其他UID的FILE/DIR缓存并产生可映射的票据凭据输出。
      en: An unapproved reader successfully reads another UID FILE or DIR cache and produces a mapped ticket-credential output.
    - zh: 会话缓存被复制到不符合其owner、生命周期和用途的暂存对象，且内容结构和会话密钥存在性得到确认。
      en: A session cache is copied to a staging object inconsistent with its owner, lifecycle, and purpose, with format and session-key presence confirmed.
    correlation:
      window:
        zh: 读取到本机输出默认十分钟，到外送默认三十分钟；对象保留原生命周期及配置变更时间，进程按启动时刻而非只按PID关联。
        en: Default ten minutes from read to local output and thirty minutes to transfer; retain object lifecycle and configuration-change times and join
          processes by start time rather than PID alone.
      dimensions:
      - host_id
      - audit_serial
      - uid
      - auid
      - process_start_key
      - cache_name
      - device
      - inode
      - principal
      - realm
      - output_digest
    false_positives:
    - zh: 合法klist、kinit、SSO消费者、备份、故障排查、迁移与取证可读取或复制缓存；部分授权运维由root执行。
      en: Legitimate klist, kinit, SSO consumers, backup, troubleshooting, migration, and forensics read or copy caches; some authorized operations run
        as root.
    blind_spots:
    - zh: Audit规则未预配、记录丢失、同进程恶意代码、root/内核控制、离线磁盘和非FILE backend可避开。文件事件不暴露读取字节，单纯success只说明系统调用成功。
      en: Missing prior audit rules, dropped records, malicious code in an approved process, root or kernel control, offline disks, and non-FILE backends
        can evade. File events do not expose bytes read, and success alone only establishes syscall success.
    - zh: 压缩或加密暂存、纯内存复制和无法取得输出时只能报告读取风险；已有票据不一定仍有效。
      en: Compressed or encrypted staging, memory-only copying, and unavailable output limit the result to read risk. An existing ticket need not remain
        valid.
    tuning_guidance:
      paragraphs:
      - zh: 以真实backend与owner界定审计目标，先在测试主机验证规则能覆盖openat/read并正确拼接PATH。允许例外须绑定reader版本、owner、工单、范围与输出保管，不能永久放行root或所有Kerberos工具。集中平台保留摘要与会话密钥存在性标记，完整票据及密钥留在受限证据环境。
        en: Scope audit targets by actual backend and owner, and first verify on test hosts that rules cover openat or read and join PATH correctly. Bind
          exceptions to reader version, owner, approval, scope, and output custody rather than permanently allowing root or all Kerberos tools. Centralize
          digests and session-key-presence flags while keeping complete tickets and keys in restricted evidence storage.
    evidence_refs:
    - REF-001042
    - TMP1558-REF-CCACHE
    - TMP1558-REF-RFC4120
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1558-NJA-CONSTRUCTION
    strategy_ref: TMP1558-DET-MATERIAL
    name:
      zh: 票据构造输出与签发对象连续性检验
      en: Ticket Construction Output and Issued-Object Continuity Analysis
    summary:
      zh: 把确切票据对象、构造输入输出及授权状态连接，以分级判断伪造与模板承袭，而不是由缺少短时签发事件下结论。
      en: Join exact ticket objects, construction inputs and outputs, and authorization state to grade forgery and template inheritance without treating
        missing recent issuance as proof.
    domains:
    - enterprise
    platforms:
    - Windows
    - Active Directory
    logic:
      paragraphs:
      - zh: 收集全部相关realm/DC的成功4768/4769、票据续期与跨域路径，并记录审计策略、事件版本、丢失与保留情况。Windows Server 2016及以后在2025-01-14或之后累计更新下才使用经本地验证的新字段分支：4768样例XML是ResponseTicket，文字称response
          ticket hash；4769为RequestTicketHash/ResponseTicketHash。按安全规范化哈希比较4768发出的TGT与4769提交对象，只对确知相同计算口径且不为N/A的数据作强键。缺少匹配只输出ticket_lineage_gap，须排除已有缓存、续期、跨域、离线签发、采集缺口和超出保留的原始请求。
        en: 'Collect successful 4768 and 4769 from all relevant realms and DCs, renewal and cross-realm paths, and audit policy, event version, loss, and
          retention state. Enable the new-field branch only for Windows Server 2016 or later with January 14, 2025 or later cumulative updates and locally
          validated fields: the 4768 XML sample uses ResponseTicket while its prose calls it a response ticket hash; 4769 uses RequestTicketHash and ResponseTicketHash.
          Compare issued TGTs with objects submitted in 4769 using safely normalized hashes only when calculation semantics match and values are not N/A.
          A missing match yields only ticket_lineage_gap, accounting for cached tickets, renewal, cross-realm paths, offline issuance, collection gaps,
          and original requests outside retention.'
      - zh: 构造确认分支需受限取证检验：把输入票据、输出票据、构造进程和实际密钥使用证据关联，确认输出是有效格式且存在攻击者控制的身份或授权语义变化。若输入确为正规签发且不需改变的字段被保留，可确认模板承袭；仅有正常时限或先行4768不足以分类。可用的后继服务事件用于核对目标principal与授权结果，并明确归NJT-0184/NJT-0061。标准事件不暴露PAC组时不得凭空比较组字段；服务端没有对应4769也不能单独证明服务票据伪造，PAC验证路径与补丁可能另有域控交互。
        en: Construction confirmation requires restricted forensic inspection joining input ticket, output ticket, construction process, and actual key-use
          evidence, establishing a valid-format output and adversary-controlled identity or authorization changes. A genuinely issued input with retained
          unmodified fields can establish template inheritance; normal lifetimes or a prior 4768 alone cannot classify it. Available successor service events
          validate target principal and authorization outcome and remain attributed to NJT-0184 or NJT-0061. Do not invent PAC group comparisons when standard
          events omit those groups. A service event lacking matching 4769 cannot alone prove service-ticket forgery, and PAC validation paths or patches
          can cause other DC interactions.
    data_requirements:
    - source_type: kdc-issuance-coverage
      name:
        zh: 签发审计与覆盖清单
        en: Issuance audit and coverage inventory
      channel: Security/4768,4769; version-gated extended fields
      required_fields:
      - system.timecreated
      - system.computer
      - system.version
      - targetusername
      - targetdomainname
      - servicename
      - ipaddress
      - status
      - coverage_start
      - coverage_end
      - audit_enabled
      - collector_loss_state
    - source_type: ticket-hash-capability-gated
      name:
        zh: 经验证的扩展票据标识
        en: Validated extended ticket identifiers
      channel: 4768 v2 ResponseTicket and 4769 updated RequestTicketHash/ResponseTicketHash; conditional branch
      required_fields:
      - event_version
      - raw_xml_field_name
      - normalized_ticket_digest
      - digest_semantics_validated
      - value_available
    - source_type: construction-artifact-inspection
      name:
        zh: 构造输入输出与语义检验
        en: Construction input-output and semantic inspection
      channel: restricted incident/lab ticket parsing, endpoint evidence; not ordinary Security log
      required_fields:
      - inspection_time
      - construction_host
      - process_start_key
      - input_artifact_id
      - input_ticket_digest
      - output_artifact_id
      - output_ticket_digest
      - principal_and_realm
      - service
      - semantic_changes
      - retained_fields
      - key_use_evidence
      - format_validation_result
      - custody
    - source_type: historical-authorization-state
      name:
        zh: 历史身份授权与验证配置
        en: Historical identity authorization and verifier configuration
      channel: versioned directory and service policy inventory
      required_fields:
      - valid_from
      - valid_to
      - identity_sid
      - group_or_authorization_state
      - service_account
      - trust_path
      - pac_validation_state
      - os_build
      - patch_state
    observables:
    - zh: 构造进程读取真实签发输入后产生不同票据对象，检验确认身份或授权内容改变且其他模板字段保留。
      en: A construction process reads a genuinely issued input and produces a different ticket object with inspected identity or authorization changes
        and retained template fields.
    - zh: 经验证的扩展票据标识不能连接签发与提交对象，但此信号仍只是谱系缺口。
      en: Validated extended ticket identifiers fail to link issuance and submission, which remains only a lineage gap.
    correlation:
      window:
        zh: 构造输入到输出默认十五分钟，签发谱系回看至少覆盖实际最大票据及renew-till寿命并保留采集延迟；后继使用独立回看一小时，不以任意五分钟缺口定伪造。
        en: Default fifteen minutes from construction input to output; look back over at least actual maximum ticket and renew-till lifetimes plus collection
          delay. Inspect successor use independently over one hour, without treating an arbitrary five-minute gap as forgery.
      dimensions:
      - realm
      - issuing_dc
      - event_version
      - normalized_ticket_digest
      - principal
      - service
      - construction_host
      - process_start_key
      - input_artifact_id
      - output_artifact_id
      - authorization_validity_interval
    false_positives:
    - zh: 票据续期、跨域referral、负载均衡、正常缓存使用、审计丢失或版本差异会造成签发缺口；故障排查与获批研究也会产生票据解析和重编码。
      en: Renewal, cross-realm referrals, load balancing, normal cached use, missing audit, and version differences cause issuance gaps. Troubleshooting
        and approved research can also parse and re-encode tickets.
    blind_spots:
    - zh: 持有全部密钥的攻击者可构造符合检查的字段，且离线构造主机可能无传感器。标准日志不含完整PAC；不能借时间与账户相同代替确切票据对象。
      en: An adversary holding all keys can construct conforming fields on an uninstrumented offline host. Standard logs omit full PACs; matching account
        and time cannot replace exact ticket-object identity.
    - zh: 旧版或未更新DC没有扩展哈希，官方文档中的ResponseTicket命名也需解析器验证。密钥轮换、RODC与跨域验证增加对象连续性的解释成本。
      en: Older or unpatched DCs lack extended hashes, and the documented ResponseTicket naming needs parser validation. Key rotation, RODCs, and cross-realm
        validation add continuity ambiguity.
    tuning_guidance:
      paragraphs:
      - zh: 先用批准测试取得原始XML并验证事件版本、哈希生成对象、规范化及跨DC一致性。所有缺口先走数据质量与票据生命周期检查，不以存在一次4768自动排除模板构造。构造确认依赖语义变化和控制证据，重编码但语义未改变保持正常或未定；对PAC验证更新按实际OS build记录，避免套用历史Silver行为。
        en: First obtain raw XML through approved testing to validate event versions, hashed objects, normalization, and cross-DC consistency. Route gaps
          through data-quality and ticket-lifecycle checks, and do not clear template construction merely because a 4768 exists. Construction confirmation
          depends on semantic changes and control evidence; re-encoding without semantic changes remains legitimate or unresolved. Record PAC validation
          updates by actual OS build rather than applying historical Silver behavior universally.
    evidence_refs:
    - REF-000854
    - REF-000855
    - TMP1558-REF-DIAMOND
    - TMP1558-REF-RFC4120
    - TMP1558-REF-PAC
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  mitigations:
  - schema_version: 2.0.0
    type: mitigation
    id: TMP1558-MIT-REQUEST
    name:
      zh: Kerberos 可离线取材暴露收敛
      en: Kerberos Offline-Test Material Exposure Reduction
    summary:
      zh: 恢复预认证、提高服务秘密强度并治理加密依赖，减少匿名取材机会与后继离线恢复收益。
      en: Restore preauthentication, strengthen service secrets, and govern encryption dependencies to reduce unauthenticated acquisition and subsequent
        offline-recovery value.
    description:
      paragraphs:
      - zh: 此控制针对KDC合法协议所暴露的可离线测试材料。移除不必要的无预认证设置，使用可管理的高熵服务秘密与最低服务权限，并在兼容性验证后采用AES和收敛旧算法。取材速率或本机缓存路径改变后，这些配置仍作用于同一目标账户和密钥，降低已取得密文转化为可用秘密的概率。
        en: This control addresses offline-test material exposed through legitimate KDC protocols. Remove unnecessary no-preauthentication settings, use
          managed high-entropy service secrets and minimum service privileges, and adopt AES while reducing old algorithms after compatibility testing.
          These settings govern the same target accounts and keys even when acquisition cadence or local caching changes, reducing the likelihood that acquired
          ciphertext becomes a usable secret.
    domains:
    - enterprise
    measures:
    - key: require-preauthentication
      name:
        zh: 恢复必要预认证
        en: Require preauthentication
      description:
        paragraphs:
        - zh: 盘点DONT_REQ_PREAUTH，移除无业务必要的例外，例外绑定owner、依赖、期限与监控；监控该位非批准变更。
          en: Inventory DONT_REQ_PREAUTH, remove exceptions without business need, bind remaining exceptions to owner, dependency, expiry, and monitoring,
            and monitor unapproved changes to the bit.
      control_type: preventive
    - key: high-entropy-service-secrets
      name:
        zh: 提高服务账户秘密强度
        en: Strengthen service-account secrets
      description:
        paragraphs:
        - zh: 对支持的工作负载使用gMSA或等价受管长随机秘密，限制可读取主体与服务权限，按依赖安全轮换；不要只依靠人选短口令和复杂度。
          en: Use gMSAs or equivalent managed long random secrets for supported workloads, restrict readers and service privileges, and rotate safely by
            dependency rather than relying on human-selected short passwords and complexity alone.
      control_type: cost-increasing
    - key: encryption-dependency-governance
      name:
        zh: 治理加密依赖
        en: Govern encryption dependencies
      description:
        paragraphs:
        - zh: 先核对服务、客户端、DC及trust密钥和票据加密的真实协商，再逐步采用AES并收敛RC4等遗留算法，保留限时兼容例外。
          en: Validate actual negotiation and keys across services, clients, DCs, and trusts before adopting AES and reducing legacy algorithms such as
            RC4, retaining time-limited compatibility exceptions.
      control_type: cost-increasing
    applications:
    - target_ref: TMP1558-PARENT
      use:
        paragraphs:
        - zh: 对所有可返回离线测试材料的身份核对预认证、服务秘密、服务权限与算法依赖，优先清理高权可取材账户。
          en: Review preauthentication, service secrets, privileges, and algorithm dependencies for identities exposing offline-test material, prioritizing
            privileged targets.
      expected_effect:
        paragraphs:
        - zh: 减少未认证回复与弱秘密导致的恢复收益，不依赖抓住某次峰值。
          en: Reduce unauthenticated replies and recovery value caused by weak secrets without depending on catching a request burst.
      limitations:
        paragraphs:
        - zh: 有效域会话仍通常能请求服务票据；AES并不消除取材，且这些措施不撤销已窃取票据或已泄露krbtgt密钥。
          en: A valid domain session can normally still request service tickets. AES does not eliminate acquisition, and these measures revoke neither stolen
            tickets nor exposed krbtgt keys.
    - target_ref: TMP1558-CHILD-TIME
      use:
        paragraphs:
        - zh: 对低密度取材可能涉及的账户实施相同预认证与秘密治理，并持续复核稀疏请求的新服务关系。
          en: Apply preauthentication and secret governance to accounts exposed to low-density acquisition and review new service relationships across sparse
            requests.
      expected_effect:
        paragraphs:
        - zh: 即使序列低于短时阈值，弱秘密和不必要预认证例外也被收敛。
          en: Reduce weak secrets and unnecessary preauthentication exceptions even when the sequence falls below short-window thresholds.
      limitations:
        paragraphs:
        - zh: 不能强制合法TGS请求形成峰值，也不能仅靠算法选择识别故意延迟。
          en: These controls neither force legitimate TGS requests into bursts nor identify deliberate delay through algorithm choice alone.
    - target_ref: TMP1558-CHILD-CACHE
      use:
        paragraphs:
        - zh: 对直接协议客户端请求的目标执行服务秘密、预认证和算法治理，不以是否填充本机缓存决定配置适用性。
          en: Govern service secrets, preauthentication, and algorithms for targets requested by direct-protocol clients regardless of local-cache population.
      expected_effect:
        paragraphs:
        - zh: 控制保持在权威账户和密钥面，避免缓存旁路同时绕过风险治理。
          en: Keep controls at authoritative account and key planes so cache bypass does not also bypass risk governance.
      limitations:
        paragraphs:
        - zh: 标准服务票据仍可返回；需要进程与材料输出监控补充识别，配置控制并不使直接客户端自动可信。
          en: Standard service tickets can still be returned. Process and material-output monitoring is needed for discrimination, and configuration controls
            do not make a direct client trustworthy.
    evidence_refs:
    - REF-000303
    - REF-000854
    - TMP1558-REF-ASREP
    - TMP1558-REF-REVISIT
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: mitigation
    id: TMP1558-MIT-CACHE
    name:
      zh: Kerberos 缓存边界与保留治理
      en: Kerberos Cache Boundary and Retention Governance
    summary:
      zh: 按实际backend隔离可用票据与会话密钥，约束reader和寿命，并保护复制与证据输出。
      en: Isolate usable tickets and session keys by actual cache backend, constrain readers and lifetime, and protect copied and forensic output.
    description:
      paragraphs:
      - zh: 缓存是可用认证材料的持有面，不能只把一个常见/tmp路径当作全部范围。组织应盘点FILE、DIR、KCM、KEYRING、MEMORY及平台特有backend，将用户和服务隔离，限定读者与复制目的，并让任务结束后的材料保留与续期符合业务所需。控制目的在于减少既存材料落入其他控制域的机会。
        en: Caches hold usable authentication material, so one common /tmp path cannot represent the entire surface. Inventory FILE, DIR, KCM, KEYRING,
          MEMORY, and platform-specific backends, separate users and services, restrict readers and copy purposes, and align retention and renewal after
          tasks with business needs. The purpose is to reduce transfers of existing material into another control domain.
    domains:
    - enterprise
    measures:
    - key: backend-owner-isolation
      name:
        zh: 按backend与owner隔离
        en: Isolate by backend and owner
      description:
        paragraphs:
        - zh: 对FILE/DIR配置私有目录和最小读取权限，对KCM/KEYRING按实际实现验证UID与服务边界；分离高权管理身份和普通工作负载，避免共享可搬移缓存。
          en: Use private directories and minimum read permissions for FILE or DIR; validate UID and service boundaries for the deployed KCM or KEYRING
            implementation. Separate privileged administration from ordinary workloads and avoid shared portable caches.
      control_type: exposure-reduction
    - key: bounded-cache-lifecycle
      name:
        zh: 限定缓存生命周期
        en: Bound cache lifecycle
      description:
        paragraphs:
        - zh: 按任务与会话需要配置最短可用寿命和续期范围，任务结束时由批准消费者清理缓存，备份、诊断与崩溃输出按认证材料保护并审计读取。
          en: Set minimum practical lifetimes and renewal scope for tasks and sessions, let approved consumers clear caches at task completion, and protect
            backups, diagnostics, and crash output as authentication material with read auditing.
      control_type: exposure-reduction
    - key: reader-output-custody
      name:
        zh: 约束reader和输出保管
        en: Constrain readers and output custody
      description:
        paragraphs:
        - zh: 对批准缓存reader定义owner、对象与输出合同；审计意外读取和复制，集中保留摘要而非原始票据及会话密钥。
          en: Define owner, object, and output contracts for approved cache readers, audit unexpected reads and copies, and centralize digests instead of
            raw tickets and session keys.
      control_type: detective-support
    applications:
    - target_ref: TMP1558-PARENT
      use:
        paragraphs:
        - zh: 先识别每台主机实际backend、缓存名称与owner，再部署相应访问控制和生命周期策略；Windows认证运行态保护另复用MIT-000187，文件缓存不能代替API缓存治理。
          en: Identify each host actual backend, cache name, and owner before deploying applicable access controls and lifecycle policy. Reuse MIT-000187
            for Windows authentication-runtime protection, and do not substitute file-cache governance for API-cache controls.
      expected_effect:
        paragraphs:
        - zh: 减少跨用户缓存复制、无必要长期保留和诊断输出暴露，改善材料结果定位。
          en: Reduce cross-user cache copying, unnecessary long retention, and diagnostic-output exposure while improving material-outcome attribution.
      limitations:
        paragraphs:
        - zh: 同UID恶意代码、root/内核控制和已控制缓存服务仍可绕过；清理本机缓存不会自动撤销已复制材料，短寿命也有SSO与批处理代价。
          en: Malicious code under the same UID, root or kernel control, and compromised cache services can bypass these controls. Local cleanup does not
            revoke copied material, and short lifetimes impose SSO and batch costs.
    evidence_refs:
    - TMP1558-REF-CCACHE
    - TMP1558-REF-RFC4120
    - REF-000860
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - type: mitigation-extension
    id: MIT-000187
    applications:
    - target_ref: TMP1558-PARENT
      use:
        paragraphs:
        - zh: 对票据构造所需krbtgt、服务、trust或相关密钥的OS存储、复制权与备份读取执行既有隔离措施；发生泄露后结合票据作用域做受控身份恢复。
          en: Apply existing isolation measures to OS stores, replication rights, and backup reads exposing krbtgt, service, trust, or related keys required
            for construction, followed by controlled identity recovery scoped to affected tickets.
      expected_effect:
        paragraphs:
        - zh: 降低伪造所需秘密取得机会，并在可信恢复后让旧材料不再通过适用验证。
          en: Reduce opportunities to acquire construction secrets and cause old material to fail applicable validation after trusted recovery.
      limitations:
        paragraphs:
        - zh: 措施保护密钥取得面，不能证明构造尚未发生。krbtgt双次重置须遵守复制与实际最大票据寿命，RODC另行处理；服务密钥和既有会话也需按范围处置。
          en: These measures protect key acquisition and do not establish that construction has not occurred. Two krbtgt resets must respect replication
            and actual maximum ticket lifetime, with separate RODC handling; service keys and existing sessions also require scoped response.
    - target_ref: TMP1558-CHILD-TEMPLATE
      use:
        paragraphs:
        - zh: 对真实模板构造所需密钥沿用运行态、存储与复制最小权限，限制域级秘密的reader；确认模板构造后保全输入输出，并在清除攻击者控制后执行适用密钥轮换。
          en: Apply runtime, store, and replication least privilege to keys needed for template-based construction, restricting readers of domain secrets.
            After confirmation, preserve input and output and rotate applicable keys after removing adversary control.
      expected_effect:
        paragraphs:
        - zh: 即使模板字段正常，构造仍受密钥控制面限制；恢复范围围绕实际密钥而非票据外观。
          en: Even when template fields look normal, construction remains constrained by key control. Recovery is scoped to actual keys rather than ticket
            appearance.
      limitations:
        paragraphs:
        - zh: 已掌握全部所需密钥的攻击者仍可产生正确签名；PAC更新应另按部署验证，不能把漏洞修复当作密钥泄露补救。
          en: An adversary with all required keys can still produce correct signatures. Validate PAC updates separately by deployment rather than treating
            vulnerability fixes as remediation for key exposure.
    evidence_refs:
    - REF-000809
    - REF-000860
    - TMP1558-REF-KRBTGT-RESET
    - TMP1558-REF-DIAMOND
    - TMP1558-REF-PAC
    reason: Existing measures already govern runtime/store/replication readers; extend target-specific applications only. MIT-000193 focuses presentation
      and derived-proof use, so it is not the acquisition-control identity.
