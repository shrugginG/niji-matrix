    - attack_subtechnique_id: T1558.001
      represented_dimension: Off-authority TGT construction using domain signing/encryption material
      resolution: parent-core
      contribution: Parent construction; TEMPLATE is independently derived from genuine-input modification rather than importing Golden Ticket. NJT-0177
        owns secret extraction and NJT-0184 owns subsequent presentation.
    - attack_subtechnique_id: T1558.002
      represented_dimension: Service-ticket construction and service acceptance boundary
      resolution: parent-core
      contribution: Parent construction; service-key scope and current PAC enforcement alter feasibility. No KDC issuance is not a new child by itself and
        is never inferred solely from a missing 4769.
    - attack_subtechnique_id: T1558.003
      represented_dimension: TGS ciphertext acquisition via standard API, direct exchange or passive capture
      resolution: niji-variable-candidate
      contribution: TIME and CACHE have independent implementation and trace evidence. Target selection and encryption-type downgrade alone remain parent-core
        or adjacent; offline candidate testing belongs to NJT-0137.
    - attack_subtechnique_id: T1558.004
      represented_dimension: AS reply encrypted part exposed without target-secret preauthentication
      resolution: parent-core
      contribution: Exact reply enc-part acquired, not user-password-encrypted TGT. Unsupported extrapolation of TIME to AS requests is deferred; password
        recovery belongs to NJT-0137.
    - attack_subtechnique_id: T1558.005
      represented_dimension: Existing session material in FILE/DIR/API/KCM/KEYRING and other caches
      resolution: parent-core
      contribution: Material-object outcome is covered. Backend and platform alone are not stealth variables. Source-path extraction and unprotected-file
        retrieval need independent evidence and cross-parent convergence.
    candidate_stealth_axes_examined:
    - key: TMP1558-AXIS-TIME
      variable: Attacker-controlled request cadence
      decision: formal-proposed
      child_ref: TMP1558-CHILD-TIME
      trace_change: Delayed/jittered service requests weaken local short-window clustering; all DC request records remain.
      defender_difference: Long-horizon new service relationships plus material-output correlation; no RC4-only detector.
      evidence_refs:
      - TMP1558-REF-RUBEUS
      - REF-000855
      confidence: medium
    - key: TMP1558-AXIS-CACHE
      variable: Whether directly received material populates the ordinary local logon cache
      decision: formal-proposed
      child_ref: TMP1558-CHILD-CACHE
      trace_change: Raw TGS handling avoids per-target native-cache growth while preserving KDC requests, process egress and output.
      defender_difference: Join KDC and source process/output evidence rather than relying on cache size.
      evidence_refs:
      - TMP1558-REF-REVISIT
      - TMP1558-REF-RUBEUS
      - REF-000855
      confidence: medium
    - key: TMP1558-AXIS-TEMPLATE
      variable: Genuinely issued template versus independent construction
      decision: formal-proposed
      child_ref: TMP1558-CHILD-TEMPLATE
      trace_change: Preserves natural fields and creates real prior issuance; output bytes and authorization semantics may differ.
      defender_difference: Exact-object continuity and construction input/output semantics rather than mere existence of 4768.
      evidence_refs:
      - TMP1558-REF-DIAMOND
      - REF-000435
      confidence: medium
    - key: TMP1558-AXIS-KDC-BYPASS
      variable: Service versus TGT construction without corresponding issuance
      decision: parent-core
      reason: A stable parent construction property, but a proposed child merely reproduces ticket type and consumer differences; current PAC behavior is
        conditional and alone does not supply intentional extra trace design.
      evidence_refs:
      - REF-000625
      - TMP1558-REF-PAC
      - TMP1558-REF-RFC4120
    - key: TMP1558-AXIS-ENCRYPTION
      variable: AES versus RC4 choice and encryption advertisement
      decision: parent-core
      reason: Material recoverability cost and client-feature context; not inherently stealth. A general deliberate downgrade is adjacent T1689. AES-only
        evasion claims need independent deployment evidence.
      evidence_refs:
      - TMP1558-REF-REVISIT
      - REF-000855
    - key: TMP1558-AXIS-BACKEND
      variable: FILE, KCM, KEYRING, OS or tool choice
      decision: not-stealth-distinct
      reason: Storage/backend partitions do not alone establish intentional change to defender observation; ordinary cache theft remains parent covered.
      evidence_refs:
      - TMP1558-REF-CCACHE
      - TMP1558-REF-BIFROST
    - key: TMP1558-AXIS-SAPPHIRE
      variable: Genuine authorization-data grafting beyond the Diamond experiment
      decision: evidence-deferred
      reason: Do not extrapolate source-specific TEMPLATE existence to every named ticket family without primary construction and current-feasibility evidence.
      evidence_refs: []
