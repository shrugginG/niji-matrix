    repeated_prose_reviewed: true
    notes:
      zh: 已阅读实际NJT-0001父项与子项、字段合同和防御规范。父子定义、匿迹、范围各以双段承担职责，场景与双方模型逐对象撰写；相同机理摘要只在父级聚合与相应子级语义相同时复用。主审与双语Web门禁尚未执行。
      en: The actual NJT-0001 parent and child, field contract, and defense specification were read. Parent and child definition, stealth, and scope use
        paired paragraphs to discharge their responsibilities; scenarios and both threat models were written per object. A mechanism summary is reused only
        where the parent aggregation and child have the same meaning. Primary review and bilingual Web gates remain pending.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - Serialize manually authored bilingual literal objects to YAML
    - Lowercase required-field names while retaining raw XML mapping in analytic prose
    - Read existing reference identity into proposal only
    - Validate research proposal structure without writing canonical objects
  limitations:
    paragraphs:
    - zh: 平台规范支持协议和字段语义，原始工具与实验支持实现能力及局部痕迹变化，事件报告仅支持其明确记录的行为。这三种证据不能相互替代。延迟取材尚缺公开的对照告警率，2019年缓存旁路实验需在当前客户端复验，2022年模板实验也不是对所有当前 PAC 与跨域策略的承诺。
      en: Platform specifications support protocol and field semantics, original tooling and experiments support implementation capability and local trace
        changes, and incident reports support only the behaviors explicitly recorded. These evidence types are not interchangeable. Delayed acquisition
        lacks public comparative alert rates, the 2019 cache-bypass experiment needs replication on current clients, and the 2022 template experiment makes
        no promise for every current PAC or cross-realm policy.
    - zh: CERT Polska 在 CHP 早期活动中记录了 Diamond Ticket 构造，但未公开精确票据字段、密钥取得链、服务接受证据或该构造的规避结果，也未完全确认早期与十二月活动属于同一攻击者。材料分类应保留完整票据凭据、仅有票据密文和离线测试密文的区别；后继使用不能倒推出缺失的取得方式。
      en: CERT Polska records Diamond Ticket construction during early CHP activity without publishing exact ticket fields, a key-acquisition chain, service
        acceptance, or evasion outcomes for that construction. It does not fully confirm the same actor across early and December activity. Material classification
        must retain the distinction among complete ticket credentials, ticket ciphertext alone, and ciphertext for offline testing. Subsequent use cannot
        reconstruct an unobserved acquisition path.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason:
      zh: Kerberos原生加密本身不是攻击者为匿迹改变材料形态的证据，不能只因票据不透明就认定数据遮蔽。
      en: Native Kerberos encryption alone is not evidence of an adversary changing material form for stealth, so opacity by itself does not establish Data
        Obscuration.
  open_questions:
  - Primary cross-review of T1552 and T1539 material/path boundaries after all three handoffs.
  - Before operational deployment, validate direct-cache behavior and extended-event mapping on the actual versions. A new AD lab is not a prerequisite
    for preserving the explicitly historical capability evidence.
  adjacent_boundaries:
  - neighbor_ref: NJT-0137
    ownership: Unknown candidate testing after ciphertext acquisition; encrypted output is not recovered password.
  - neighbor_ref: NJT-0147
    ownership: Managed vault read/unlock path; exact Kerberos material outcome may coexist only with independent result evidence.
  - neighbor_ref: NJT-0169
    ownership: Input interception before/at submission; no automatic ownership of later ticket return.
  - neighbor_ref: NJT-0093
    ownership: Authentication-process mutation or secret side output; plain ticket read/construct does not modify the validator.
  - neighbor_ref: NJT-0177
    ownership: OS authority extraction path and signing-secret acquisition; ticket/material outcome separately evidenced.
  - neighbor_ref: NJT-0178
    ownership: Application API token acquisition; Kerberos tickets and reply ciphertext remain this material family.
  - neighbor_ref: NJT-0166
    ownership: Off-authority web/federated authentication material construction; ticket object separates T1558.
  - neighbor_ref: NJT-0227
    ownership: Authentication certificate/private-key acquisition or construction; normal PKINIT issuance is not ticket forgery.
  - neighbor_ref: NJT-0061
    ownership: Actual relying-party acceptance and resource authorization; successor result cannot backfill acquisition.
  - neighbor_ref: NJT-0184
    ownership: Presentation or redemption of acquired alternate proof; same TGT may produce later legitimate KDC-issued TGS without being a fresh forgery.
  - neighbor_ref: T1552
    ownership: Unprotected-secret location and read path, not automatic reassignment of a specifically proven ccache material object.
  - neighbor_ref: T1689
    ownership: Deliberate downgrade behavior may coexist when independently proven; encryption type by itself is not a T1558 evasion child.
  - neighbor_ref: TA0011
    ownership: C2 transports carrying requests or output remain adjacent; no tactic-plan reopening.
  source_assessments:
  - reference_ref: TMP1558-REF-RUBEUS
    locator: 'README: Ticket Forgery > diamond; Roasting > kerberoast, /delay:MILLISECONDS, /jitter:1-100, /spn and kerberoasting opsec; version banner
      2.3.3 at access date'
    support_and_limits:
      zh: 原始项目文档记录可控延迟与抖动、直接协议处理和Diamond构造能力；工具能力及实验输出不证明部署频率、实测规避率或当前所有PAC配置下的接受。
      en: Original project documentation records controllable delay and jitter, direct protocol handling, and Diamond construction. Tool capability and
        examples do not establish deployment frequency, measured evasion, or acceptance under every current PAC configuration.
  - reference_ref: TMP1558-REF-DIAMOND
    locator: Golden Ticket vs Diamond Ticket; Weaponizing Rubeus; OPSEC advantages; Detection guidance; demonstrated request-decrypt-modify-sign-reencrypt
      sequence
    support_and_limits:
      zh: 原始实验支持真实签发后修改、承袭自然字段和限定签发存在性检测的弱化；2022年实验不保证当前所有补丁与策略下规避。TrustedSec共发版本属于同一研究，不是独立复验。
      en: The original experiment supports post-issuance modification, inheritance of natural fields, and weakened bounded issuance-existence detection.
        The 2022 experiment does not guarantee evasion under every current patch and policy. The TrustedSec co-publication is the same research rather than
        an independent replication.
  - reference_ref: TMP1558-REF-REVISIT
    locator: Trying to Build a Better Kerberoast; paragraph beginning Another advantage of the /tgtdeleg approach; encryption and opsec comparison
    support_and_limits:
      zh: 原始Windows实验明确手工TGS交互可避免每个目标票据进入登录缓存，KDC仍接收请求。历史加密协商和缓存行为需在当前客户端复验，缓存缺失不独立证明恶意。
      en: The original Windows experiment explicitly shows manual TGS exchanges avoiding addition of every target ticket to the logon cache while the KDC
        still receives requests. Historical encryption negotiation and caching behavior need replication on current clients, and missing cache entries do
        not independently prove malice.
  - reference_ref: TMP1558-REF-ASREP
    locator: Background; ASREPRoast; distinction between ticket protected by service/krbtgt key and AS-REP enc-part protected by client key
    support_and_limits:
      zh: 原始研究区分由krbtgt保护的TGT与客户端密钥保护的AS回复enc-part，并实现无预认证取材；回复取得不证明离线破解成功或可直接使用TGT。
      en: The original research distinguishes the krbtgt-protected TGT from the client-key-protected AS reply enc-part and implements acquisition without
        preauthentication. Receiving a reply establishes neither successful offline recovery nor directly usable TGT control.
  - reference_ref: TMP1558-REF-RFC4120
    locator: 'Sections 3.1.1–3.1.3, 3.2.1–3.2.3, 3.6 and 5.3: KDC response, Ticket, authenticator and KRB-CRED session-key roles'
    support_and_limits:
      zh: 协议规范支持票据、回复加密部分、会话密钥和后继呈现的对象边界；不证明恶意意图、部署传感器覆盖或当前AD的PAC验证行为。
      en: The protocol specification supports object boundaries among tickets, reply encrypted parts, session keys, and subsequent presentation. It does
        not establish malicious intent, deployed sensor coverage, or current AD PAC validation behavior.
  - reference_ref: TMP1558-REF-CCACHE
    locator: ccache types; Default ccache name; documentation release 1.22.2; FILE, DIR, KCM, KEYRING, MEMORY, MSLSA distinctions
    support_and_limits:
      zh: MIT Kerberos 1.22.2文档区分FILE、DIR、KCM、KEYRING、MEMORY等缓存与位置配置；backend类型不证明成功窃取，也不保证能抵御同用户或root控制。
      en: MIT Kerberos 1.22.2 documentation distinguishes FILE, DIR, KCM, KEYRING, MEMORY, and other caches and location configuration. Backend type establishes
        neither successful theft nor resistance to the same user or root control.
  - reference_ref: TMP1558-REF-BIFROST
    locator: Bifrost capability overview; Working with Tickets; Defensive Considerations
    support_and_limits:
      zh: 原始研究支持macOS低层API票据取得和部分框架、进程连接观察；历史调试与ESF建议不代表现代Unified Log默认记录每次票据提取。
      en: The original research supports low-level API ticket acquisition on macOS and some framework and process-network observations. Historical debugging
        and ESF suggestions do not imply that modern Unified Log records every extraction by default.
  - reference_ref: TMP1558-REF-PAC
    locator: KB5037754; Background; April 2025 Enforcement phase; workstation Netlogon Network Ticket Logon path
    support_and_limits:
      zh: KB5037754说明PAC验证与2025年强制阶段改变部分伪造可接受性；这些漏洞修复不阻止掌握所有必要签名密钥者构造正确票据，也不使所有自包含服务都必然调用DC。
      en: KB5037754 explains PAC validation and the 2025 enforcement phases affecting acceptance of some forgeries. These fixes do not prevent correctly
        signed construction with all necessary keys and do not make every self-contained service contact a DC.
  - reference_ref: TMP1558-REF-KRBTGT-RESET
    locator: 'Reset the krbtgt password; Important and Note: writable DC scope, two resets, default 10-hour wait adjusted to configured maximum ticket lifetime;
      RODC exception'
    support_and_limits:
      zh: 官方过程要求对可写DC的krbtgt执行双次重置并遵守实际票据寿命与恢复约束；不是立即两次重置或统一覆盖RODC的指令，也不证明所有既存会话即刻失效。
      en: The official procedure calls for two krbtgt resets on writable DCs subject to actual ticket lifetime and recovery constraints. It is not an instruction
        for two immediate resets or uniform RODC handling and does not establish immediate invalidation of every existing session.
  - reference_ref: REF-000435
    locator: PDF pages 12–13, Early Activity / Privilege Escalation within the Infrastructure
    support_and_limits:
      zh: 事件明确记录Rubeus构造Diamond Ticket；不证明具体模板字段、票据接受或规避成效，且不与制造业LazyWiper案例混并。
      en: The incident explicitly records Rubeus Diamond Ticket construction, without proving exact template fields, ticket acceptance, or evasion; it must
        not be merged with the manufacturing LazyWiper case.
  - reference_ref: REF-000625
    locator: Enterprise 19.1 T1558 and T1558.001–.005; local attack-baseline-inventory.yaml
    support_and_limits:
      zh: 只锚定固定父行为、战术与五项广度清单；当前在线页面不是版本替代。
      en: Anchors fixed parent behavior, tactic, and the five-child breadth inventory only; the current online page is not a substitute baseline.
  - reference_ref: REF-000854
    locator: 4768 Event Description; Updated Event Version 2 XML and PreAuthType; Windows Server 2016+ after January 14, 2025 cumulative update
    support_and_limits:
      zh: 样例XML的票据哈希名称为ResponseTicket，必须在本地验证；文档字段不证明全量采集或伪造。
      en: The XML sample names the ticket-hash value ResponseTicket, requiring local validation. Documented fields establish neither complete collection
        nor forgery.
  - reference_ref: REF-000855
    locator: 4769 updated XML; RequestTicketHash/ResponseTicketHash, ServiceSid/ServiceName, Status, IpAddress; version and update prerequisites
    support_and_limits:
      zh: 提供KDC请求及可选对象哈希；ServiceName不应直接假定为完整SPN，不暴露全部PAC或客户端缓存落点。
      en: Provides KDC requests and optional object hashes. ServiceName is not assumed to be a complete SPN, and the event omits full PACs and the client
        cache destination.
  - reference_ref: REF-000303
    locator: Kerberoasting, AS-REP Roasting, Golden Ticket, Silver Ticket mitigation sections
    support_and_limits:
      zh: 官方联合指南支持预认证、强服务秘密、AES和域秘密恢复方向；部分图示将AS回复与TGT简写，精确加密对象以RFC4120校准。
      en: The joint official guidance supports preauthentication, strong service secrets, AES, and domain-secret recovery. Some diagrams abbreviate AS replies
        and TGTs; precise encrypted objects are calibrated against RFC 4120.
  - reference_ref: REF-001042
    locator: 'RHEL7 Security Guide: Understanding Audit Log Files; SYSCALL/PATH/PROCTITLE record linkage'
    support_and_limits:
      zh: 官方同章/de路由本轮成功返回英文正文，核实SYSCALL/PATH/PROCTITLE共享时间与序列、auid/uid/euid、exe、name、inode及成功状态；原/en路由曾503。读取调用仍不等于取得全部字节。
      en: The official chapter through its /de route successfully served English content in this pass, validating shared timestamps and serials for SYSCALL/PATH/PROCTITLE,
        auid/uid/euid, exe, name, inode, and success. The /en route returned 503 earlier. A read call still does not establish that all bytes were acquired.
    verified_url: https://docs.redhat.com/de/documentation/red_hat_enterprise_linux/7/html/security_guide/sec-understanding_audit_log_files
  - reference_ref: REF-000230
    locator: Sysmon Event 1 Process Create and Event 3 Network Connection; configured collection
    support_and_limits:
      zh: 支持进程与网络字段关联；网络事件需启用，不提供票据内容或请求目的。
      en: Supports process and network joins with configured collection. Network events need enablement and expose neither ticket content nor request intent.
  - reference_ref: REF-000860
    locator: Credential Guard VBS isolation and limitations for Kerberos TGT material
    support_and_limits:
      zh: 保护支持平台的取得面，不撤销已外传材料，也不普遍隔离服务票据。
      en: Protects acquisition on supported platforms without revoking exported material or universally isolating service tickets.
  - reference_ref: REF-000809
    locator: Forest recovery security-breach response, replication trust, credential reset sequence
    support_and_limits:
      zh: 提供可信恢复框架；具体krbtgt等待与RODC限制另以专门官方过程为准。
      en: Provides trusted recovery context; exact krbtgt waiting and RODC constraints follow the dedicated official procedure.
