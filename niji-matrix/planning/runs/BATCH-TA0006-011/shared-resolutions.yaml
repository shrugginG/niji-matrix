extensions:
- id: REF-000435
  set:
    title_zh: 波兰能源行业事件报告：2025年12月29日
    title_en: Energy Sector Incident Report – 29 December
    locator: 'CHP early activity pages 12–13: Rubeus Diamond Ticket construction; early/late cluster attribution limitation; existing LazyWiper
      analysis pages 32–35 retained'
    notes_zh: 同一报告分别记录CHP早期入侵中的Diamond Ticket构造和制造业LazyWiper行为；两者是不同案例。早期构造未披露精确字段、服务接受或规避结果，且早期与年底活动未完全确认同一攻击者。
    notes_en: The same report separately documents Diamond Ticket construction during early CHP intrusion and manufacturing-sector LazyWiper
      behavior; these are distinct cases. Early construction lacks exact fields, service acceptance, or evasion outcomes, and one actor across
      early and late activity is not fully confirmed.
    accessed: '2026-11-05'
- id: MIT-000187
  append_unique:
    applications:
    - target_ref: TMP1558-PARENT
      use:
        paragraphs:
        - zh: 对票据构造所需krbtgt、服务、trust或相关密钥的OS存储、复制权与备份读取执行既有隔离措施；发生泄露后结合票据作用域做受控身份恢复。
          en: Apply existing isolation measures to OS stores, replication rights, and backup reads exposing krbtgt, service, trust, or related
            keys required for construction, followed by controlled identity recovery scoped to affected tickets.
      expected_effect:
        paragraphs:
        - zh: 降低伪造所需秘密取得机会，并在可信恢复后让旧材料不再通过适用验证。
          en: Reduce opportunities to acquire construction secrets and cause old material to fail applicable validation after trusted recovery.
      limitations:
        paragraphs:
        - zh: 措施保护密钥取得面，不能证明构造尚未发生。krbtgt双次重置须遵守复制与实际最大票据寿命，RODC另行处理；服务密钥和既有会话也需按范围处置。
          en: These measures protect key acquisition and do not establish that construction has not occurred. Two krbtgt resets must respect
            replication and actual maximum ticket lifetime, with separate RODC handling; service keys and existing sessions also require
            scoped response.
    - target_ref: TMP1558-CHILD-TEMPLATE
      use:
        paragraphs:
        - zh: 对真实模板构造所需密钥沿用运行态、存储与复制最小权限，限制域级秘密的reader；确认模板构造后保全输入输出，并在清除攻击者控制后执行适用密钥轮换。
          en: Apply runtime, store, and replication least privilege to keys needed for template-based construction, restricting readers of
            domain secrets. After confirmation, preserve input and output and rotate applicable keys after removing adversary control.
      expected_effect:
        paragraphs:
        - zh: 即使模板字段正常，构造仍受密钥控制面限制；恢复范围围绕实际密钥而非票据外观。
          en: Even when template fields look normal, construction remains constrained by key control. Recovery is scoped to actual keys rather
            than ticket appearance.
      limitations:
        paragraphs:
        - zh: 已掌握全部所需密钥的攻击者仍可产生正确签名；PAC更新应另按部署验证，不能把漏洞修复当作密钥泄露补救。
          en: An adversary with all required keys can still produce correct signatures. Validate PAC updates separately by deployment rather
            than treating vulnerability fixes as remediation for key exposure.
    evidence_refs:
    - REF-000809
    - REF-000860
    - TMP1558-REF-KRBTGT-RESET
    - TMP1558-REF-DIAMOND
    - TMP1558-REF-PAC
