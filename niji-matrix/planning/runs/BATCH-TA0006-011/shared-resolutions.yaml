split_or_defer:
- object_ref: MIT-000193
  resolution: defer
  reason: Existing identity is presentation, fresh-proof derivation and lateral scope. Do not extend merely because it names Credential Guard;
    acquisition controls use MIT-000187 and new Kerberos-specific controls.
- object_ref: DET-000212
  resolution: split
  reason: Existing objective requires proof presentation/fresh context/lateral outcome. New DET stops at material acquisition/construction
    and uses different inputs and outputs.
- object_ref: NJA-000259
  resolution: defer
  reason: Reuse only as adjacent downstream evidence. Its validation-to-logon logic cannot confirm acquisition or off-authority construction.
- object_ref: NJA-000242
  resolution: split
  reason: Existing OS-store read/output analytic overlaps broad endpoint paths, but FILE/DIR ticket/session-key content classification and
    backend limits differ. New scoped analytic is explicit rather than silently broadening the old identity.
- object_ref: CASE-000157
  resolution: split
  reason: Manufacturing LazyWiper/DC preservation differs in victim and central event from early CHP Diamond construction, despite sharing
    the report.
