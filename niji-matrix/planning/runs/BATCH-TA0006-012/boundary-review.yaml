batch_ref: BATCH-TA0006-012
candidate_ref: TMP1552-PARENT
rule:
  zh: 先确认材料对象，再确认本次取得路径；每条路径和材料结果分别举证。后继认证或访问不得补写未观察的取得，未知材料先不作双重归类。
  en: Establish the material object and then the current acquisition path with independent evidence for each. Subsequent authentication or access cannot backfill unobserved acquisition and unknown material does not justify co-classification.
comparisons:
- adjacent_ref: NJT-0147
  adjacent_behavior: {zh: 受管理秘密保管或解锁边界的取得, en: Acquisition through managed secret custody or an unlock boundary}
  included_example: {zh: 从已导出的普通.env或明文Secret清单取回真实值，且有导出对象和当前读取结果, en: Retrieve actual values from an already exported ordinary env file or plaintext Secret manifest with export identity and current receipt}
  excluded_example: {zh: 获批工作负载正常GetSecretValue或正常受权Secret读取；只有API名称不证明未保护, en: Approved workload GetSecretValue or authorized Secret retrieval with no separate evidence of unprotected exposure}
  evidence_needed: {zh: 保管边界、导出谱系、对象ACL、读者职责、实际返回值和接收者，不能只比较是否有API, en: Custody boundary export lineage object ACL reader duty returned value and recipient rather than API presence}
  evidence_refs: [REF-000547, TMP1552-REF-K8S]
- adjacent_ref: NJT-0177
  adjacent_behavior: {zh: OS认证材料提取, en: OS Authentication Material Extraction}
  included_example: {zh: Winlogon普通DefaultPassword明文值被不当查询并实际取得, en: Inappropriate query and actual receipt of an ordinary plaintext Winlogon DefaultPassword value}
  excluded_example: {zh: 从LSA secret、SAM、NTDS或其离线副本提取认证材料；位于注册表不改变所有权, en: Extraction from LSA secrets SAM NTDS or their offline copies regardless of registry storage}
  evidence_needed: {zh: 确认值的存储角色与来源；不能用NTDS卷影复制案例证明普通文件秘密或次生记录子项, en: Establish the value's storage role and provenance without borrowing NTDS-shadow-copy cases for ordinary-file secrets or the secondary-record child}
  evidence_refs: [TMP1552-REF-AUTOLOGON, REF-000625]
- adjacent_ref: NJT-0178
  adjacent_behavior: {zh: 应用访问令牌取得, en: Application Access Token Acquisition}
  included_example: {zh: 普通日志或配置副本中完整API访问token进入攻击者控制，同时可证明不当内容读取, en: A complete API access token enters adversary control from an ordinary log or configuration copy with independently established inappropriate content retrieval}
  excluded_example: {zh: 正常attached role自动刷新或OAuth授权返回不因返回token而成为T1552；IMDS会话token不等同角色/API材料, en: Normal attached-role refresh or OAuth returns are not T1552 merely because they return tokens and IMDS session tokens differ from role or API material}
  evidence_needed: {zh: token格式与issuer/audience/scope或等价API语义，以及读取对象/响应/接收者；角色后继API活动不能代替响应取得证据, en: Token format and issuer audience scope or equivalent API semantics plus read object response and recipient; later role API activity does not replace response-acquisition evidence}
  evidence_refs: [TMP1552-REF-IMDS, REF-000719]
- adjacent_ref: NJT-0227
  adjacent_behavior: {zh: 认证证书控制取得与构造, en: Authentication-Certificate Control Acquisition and Construction}
  included_example: {zh: 普通可读PFX/PEM里实际包含认证用途证书与其私钥，秘密控制另行证实；仅复制强加密PFX停留加密工件等级, en: An ordinary readable PFX or PEM actually contains an authentication certificate and its key with separately established secret control; copying strongly encrypted PFX remains encrypted-artifact-only}
  excluded_example: {zh: 只下载公开证书、.cer扩展名或看到导出调用；SSH裸密钥也不自动是证书认证材料, en: Only downloading a public certificate observing a cer suffix or an export call; a bare SSH key is not automatically certificate-authentication material}
  evidence_needed: {zh: 私钥存在、解锁/控制状态、认证用途、对应证书关系与读取路径；签发或登录成功不能补证, en: Private-key presence unlock or control state authentication purpose certificate relationship and read path without backfilling from issuance or sign-in}
  evidence_refs: [TMP1552-REF-SSH, REF-000625]
- adjacent_attack_id: T1539
  adjacent_behavior: {zh: Web会话Cookie取得, en: Web Session Cookie Acquisition}
  included_example: {zh: 含Cookie语义的完整会话值从普通未保护导出日志取回，材料和不当日志读取分别成立, en: A complete session value with cookie semantics is retrieved from an ordinary unprotected export log with separately established material and inappropriate log retrieval}
  excluded_example: {zh: 文本出现session/token或一次API调用不证明Cookie；正常浏览器读取自身受管理Cookie store先审其具体边界, en: The words session or token or an API call do not prove cookie material; normal browser reads of its own managed cookie store require boundary review}
  evidence_needed: {zh: domain/path或Cookie投递及Web依赖方语义、完整值、接收控制与来源，不从文件名反推, en: Domain path or Cookie delivery and Web relying-party semantics complete value recipient control and source rather than filenames}
  evidence_refs: [REF-000625]
- adjacent_attack_id: T1558
  adjacent_behavior: {zh: Kerberos票据取得与构造, en: Kerberos Ticket Acquisition and Construction}
  included_example: {zh: 未保护普通工件确含可解析票据材料并实际进入攻击者控制时，可分别审查票据材料与普通暴露路径, en: Independently review ticket material and ordinary exposure when a readable ordinary artifact contains parseable ticket material that actually enters adversary control}
  excluded_example: {zh: 配置中域账户口令不等于Kerberos票据；正常PKINIT签发TGT不等于伪造；cache读取不因文件形式改变材料所有权, en: A domain password in configuration is not a Kerberos ticket normal PKINIT issuance is not forgery and file-form cache reads do not change material ownership}
  evidence_needed: {zh: 票据格式、材料完整性、具体cache/导出对象和接收者；由T1558研究主流程裁决其子边界, en: Ticket format completeness concrete cache or export object and recipient with fine boundaries adjudicated alongside T1558 research}
  evidence_refs: [REF-000625]
- adjacent_ref: NJT-0137
  adjacent_behavior: {zh: 候选秘密反复验证, en: Repeated Candidate Secret Verification}
  included_example: {zh: 先取得公开常量可逆GPP值并确定性恢复口令由本父描述；后续对独立口令加密密钥反复离线测试候选另归验证行为, en: Acquisition and deterministic recovery of a GPP value reversible with a public constant belongs here while repeated offline testing of an independently protected key passphrase is a separate verification behavior}
  excluded_example: {zh: 复制加密私钥不等于破解成功，公开常量解码也不等于搜索候选空间, en: Copying an encrypted key is not successful cracking and decoding with a public constant is not searching candidate space}
  evidence_needed: {zh: 分开保留工件、恢复操作、候选验证过程与实际明文结果, en: Preserve artifact recovery action candidate-testing process and actual plaintext outcome separately}
  evidence_refs: [TMP1552-REF-SSH, TMP1552-REF-GPP]
- adjacent_ref: NJT-0169
  adjacent_behavior: {zh: 认证输入截获, en: Authentication Input Interception}
  included_example: {zh: 事后读已落盘history中的完整参数秘密，源角色与当前读取单独举证, en: Later read of a complete argument secret in persisted history with source role and current read evidenced}
  excluded_example: {zh: 键盘或表单输入实时截获及专门植入输入记录器由输入路径拥有, en: Live keyboard or form interception and purpose-built input recorders belong to the input path}
  evidence_needed: {zh: 记录生成时刻与当前读取时刻、持久历史内容和接收结果, en: Record creation and current-read times persisted history content and receipt}
  evidence_refs: [TMP1552-REF-PSREADLINE]
- adjacent_ref: NJT-0093
  adjacent_behavior: {zh: 认证过程秘密旁路, en: Authentication-Process Secret Bypass}
  included_example: {zh: 已存在的不当输出被后继读取者取得时，可另证普通秘密读取，但不能从输出推定谁植入, en: A later reader can independently acquire an existing inappropriate output but output alone does not establish who implanted its producer}
  excluded_example: {zh: 篡改认证组件或新增秘密消费者并生成旁路输出是另一行为, en: Modifying authentication components or adding a secret consumer to produce a side output is a separate behavior}
  evidence_needed: {zh: 分开认证过程改动、输出生成与当前秘密取得，不拼接未观察链, en: Separate authentication changes output creation and current acquisition without assembling an unobserved chain}
  evidence_refs: [REF-000625]
- adjacent_ref: NJT-0166
  adjacent_behavior: {zh: 认证材料构造, en: Authentication Material Construction}
  included_example: {zh: 从普通文件取回既有完整token可按读取路径评估, en: Retrieval of an existing complete token from an ordinary file can be reviewed by path}
  excluded_example: {zh: 在权威签发链外新造JWT或断言并非秘密读取, en: Creating a new JWT or assertion outside authoritative issuance is not secret reading}
  evidence_needed: {zh: 既有对象与读取结果不能用新构造成功替代, en: Existing object and read result cannot be replaced by successful new construction}
  evidence_refs: [REF-000625]
- adjacent_ref: NJT-0061
  adjacent_behavior: {zh: 有效身份接受, en: Valid Identity Acceptance}
  included_example: {zh: 本对象完成于秘密内容进入控制而无需登录成功, en: This object completes at control of secret content without requiring successful sign-in}
  excluded_example: {zh: 仅成功登录不解释秘密是从文件、输入、保管库或供应商获得, en: Successful sign-in alone does not identify acquisition through a file input vault or supplier}
  evidence_needed: {zh: 取得、T1550材料呈现和依赖方接受分开保留证据, en: Preserve separate evidence for acquisition T1550 presentation and relying-party acceptance}
