    - TMP1552-CLM-AUDIT
    - TMP1552-CLM-CONTROL
    case_refs:
    - TMP1552-CASE-MSRC
    reference_refs:
    - REF-000625
    - REF-000379
    - REF-000230
    - REF-000211
    - REF-000547
    - REF-000719
    - REF-000524
    - REF-000942
    - REF-000822
    - TMP1552-REF-GPP
    - TMP1552-REF-NDSS
    - TMP1552-REF-MSRC
    - TMP1552-REF-PSREADLINE
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-AUTOLOGON
    - TMP1552-REF-SSH
    - TMP1552-REF-IMDS
    - TMP1552-REF-IMDSV2
    - TMP1552-REF-K8S
    - TMP1552-REF-GH-ACCESS
    - TMP1552-REF-SLACK
  research:
    limitations:
      paragraphs:
      - zh: 原始平台材料主要证明可读面、保护条件和日志语义；它们不证明所有读者都是攻击者。NDSS 研究的秘密检测与验证不能转化为全部样本可登录的保证，微软邮件披露也没有列出逐项材料与搜索路径。对普通配置或接口没有结论级恶意使用证据的变体，父行为与条件性机理可成立，具体案例保持空缺。
        en: Original platform sources primarily establish readable surfaces, protection conditions, and log semantics, not malicious
          intent of every reader. NDSS secret detection and validation does not guarantee that every sample enables sign-in, and Microsoft's
          email disclosure does not enumerate individual materials or search paths. Variants without conclusion-level evidence of malicious
          use can support parent behavior and a conditional mechanism while leaving specific cases absent.
      - zh: 次生副本的一个正式子项需要主审确认记录角色和遥测差异足够稳定。历史日期、备份后缀、Git 承载或未出现保管库事件都不能单独证明该角色；若复制谱系不可核对，应保留父级。提案的检测窗口与基线是可验证工程起点，尚未在目标环境测量准确率；正式身份、共享库扩展及双语
          Web 门禁仍由主流程完成。
        en: The single formal secondary-copy child requires primary confirmation that its record role and telemetry distinction are
          stable. Age, a backup suffix, Git hosting, or absent vault events alone cannot establish that role; unverifiable lineage remains
          parent-level. Analytic windows and baselines are testable engineering starting points without measured accuracy in the target
          environment. Canonical identity, shared-library extensions, and bilingual Web gates remain primary integration work.
