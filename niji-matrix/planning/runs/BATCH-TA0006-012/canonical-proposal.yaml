claims:
- schema_version: 1.0.0
  type: claim
  id: TMP1552-CLM-RELEVANCE
  claim_type: technique-relevance
  statement_zh: 普通代码、配置和协作记录能够暴露认证秘密，GPP 的公开固定密钥恢复和微软披露的邮件秘密发现分别支持未保护秘密取得作为独立 TA0006 行为。
  statement_en: Ordinary code, configuration, and collaboration records can expose authentication secrets; GPP recovery with a public
    fixed key and Microsoft's disclosure of secrets found in email support unprotected-secret acquisition as a distinct TA0006 behavior.
  subject_refs:
  - TMP1552-PARENT
  evidence_refs:
  - REF-000625
  - TMP1552-REF-GPP
  - TMP1552-REF-NDSS
