analytics:
- schema_version: 2.0.0
  type: detection-analytic
  id: TMP1552-NJA-READ
  strategy_ref: TMP1552-DET-READ
  name:
    zh: 已审计秘密工件实际读取分析
    en: Audited Secret-Artifact Exercised-Read Analytic
  summary:
    zh: 对照秘密承载清单识别职责外读取，并保留证据强度。
    en: Identify out-of-duty reads against a carrier inventory while preserving evidence strength.
  domains:
  - enterprise
  platforms:
  - Windows
  logic:
    paragraphs:
    - zh: 对已盘点的配置文件、GPP XML、PSReadLine 历史和 Winlogon 秘密值所在键启用相应对象审计及 SACL，先以无生产权限测试内容验证 4663 能记录读取。按 Computer、ObjectType 和规范化 ObjectName
        连接最近一次受限扫描，区分文件 ReadData 与目录 ListDirectory、注册表 Query key value；只查询键时不推断某个值已完整返回。以 SubjectLogonId 与 ProcessId 在同一主机进程生命周期内关联读者和作业许可，避免
        PID 复用。
      en: Enable the required object audit and SACL on inventoried configuration, GPP XML, PSReadLine history, and keys containing Winlogon
        secret values, first testing 4663 read coverage with material lacking production authority. Join Computer, ObjectType, and normalized
        ObjectName to the latest restricted scan. Distinguish file ReadData from directory ListDirectory and registry Query key value;
        a key query alone does not establish a particular value's complete return. Correlate SubjectLogonId and ProcessId within the
        same host process lifetime to reader and job approval, avoiding PID reuse.
    - zh: 不符合配置所有者登记的读者、工单范围或历史使用模式时输出 suspicious-read，包含对象、分类、进程和批准差异。只有受限调查中确认返回值、复制产物或内容映射时才输出 secret-material-recovered；4663 本身不含秘密值、返回字节或全部文件内容。历史文件另需记录其历史格式或生成事务，未知谱系保留父级；远程
        SYSVOL 服务器侧进程可能为系统服务，不能冒充客户端进程归因。
      en: Emit suspicious-read when the reader, work-order scope, or historical pattern conflicts with the configuration owner's approval,
        retaining object, classification, process, and approval difference. Emit secret-material-recovered only after restricted investigation
        confirms returned values, copy output, or content mapping; 4663 itself lacks secret values, returned bytes, and complete file
        content. History additionally needs record-format or creating-transaction evidence, with unknown lineage kept parent-level.
        A server-side SYSVOL process can be a system service and must not be treated as the remote client process.
  data_requirements:
  - source_type: windows-exercised-object-access
    name:
      zh: Windows 已使用对象访问权
      en: Windows Exercised Object Access
    channel: Windows Security Event 4663; normalized computer=Computer time_created=TimeCreated object_type=ObjectType object_name=ObjectName
      access_mask=AccessMask subject_user_sid=SubjectUserSid subject_logon_id=SubjectLogonId process_id=ProcessId process_name=ProcessName
    required_fields:
    - computer
    - time_created
    - object_type
    - object_name
    - access_mask
    - subject_user_sid
    - subject_logon_id
    - process_id
    - process_name
  - source_type: secret-carrier-inventory
    name:
      zh: 受限秘密承载扫描清单
      en: Restricted Secret-Carrier Scan Inventory
    channel: Defender-operated content scanner and configuration inventory
    required_fields:
    - host_id
    - object_path
    - object_type
    - scan_time
    - material_class
    - carrier_role
    - lineage_evidence_id
    - owner
    - approved_reader_scope
  - source_type: approved-read-job
    name:
      zh: 配置与历史读取批准记录
      en: Approved Configuration and History Read Jobs
    channel: Change and incident work-order system
    required_fields:
    - job_id
    - principal_id
    - host_id
    - object_scope
    - valid_from
    - valid_until
    - purpose
  observables:
  - zh: 对已确认秘密承载文件实际使用读取权，且读者或用途不在批准范围
    en: Exercised read rights on a confirmed secret-bearing file by a reader or purpose outside approved scope
  - zh: 对含自动登录值的键发生职责外查询，但仍需值级结果核实
    en: An out-of-duty query of a key containing autologon values requiring value-level result confirmation
  - zh: 具有可核对记录角色的命令历史被非预期进程读取
    en: A history record with verifiable role is read by an unexpected process
  correlation:
    window:
      zh: 读取前后十五分钟核对作业与进程，保留三十日同角色基线；扫描版本必须覆盖读取时内容，窗口需在本地测试。
      en: Reconcile jobs and processes within fifteen minutes of the read with a thirty-day role baseline; the scan must represent content
        at read time and windows require local testing.
    dimensions:
    - computer
    - object_name
    - object_type
    - subject_user_sid
    - subject_logon_id
    - process_id
    - job_id
    - time
  false_positives:
  - zh: 备份、安全扫描、桌面故障排查和获批历史恢复
    en: Backup security scanning desktop troubleshooting and approved history recovery
  - zh: 正常组策略客户端周期读取与部署账户配置维护
    en: Periodic normal Group Policy reads and deployment-account configuration maintenance
  blind_spots:
  - zh: 没有 SACL、审计未启用、离线磁盘或本地管理员破坏日志
    en: Missing SACL disabled audit offline media or local-administrator log interference
  - zh: 4663 不提供值级内容或完整返回证明；Sysmon 12–14 是注册表修改而非读取补充
    en: 4663 lacks value-level content or complete-return proof and Sysmon 12–14 registry modifications are not supplemental read telemetry
  - zh: 扫描之后内容变化、符号路径差异与远程文件服务弱客户端归因
    en: Content changes after scanning path aliasing and weak client attribution at remote file services
  tuning_guidance:
    paragraphs:
    - zh: 以配置 owner、对象范围和有期限作业建立允许组合，不全局放行 powershell.exe、备份身份或域用户。用不含有效秘密的文件和测试键验证读取触发、PID/登录关联及正常部署不误报；每次调优同时复测未批准读者仍能生成候选。扫描只保留材料类别和证据指针，不把真实口令复制到
        SIEM。
      en: Allow combinations of configuration owner, object scope, and time-bounded jobs rather than globally permitting PowerShell,
        backup identities, or domain users. Use nonproduction test files and keys to verify read triggering, process and logon correlation,
        and normal deployment behavior. Recheck an unapproved reader after each tuning change. Scanning retains material class and evidence
        pointers without copying passwords into the SIEM.
  evidence_refs:
  - REF-000379
  - REF-000230
  - TMP1552-REF-AUTOLOGON
  - TMP1552-REF-GPP
  - TMP1552-REF-PSREADLINE
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
- schema_version: 2.0.0
  type: detection-analytic
  id: TMP1552-NJA-COPY
  strategy_ref: TMP1552-DET-COPY
  name:
    zh: 仓库秘密版本与取回范围分析
    en: Repository Secret Version and Retrieval-Scope Analytic
  summary:
    zh: 将仓库级传输事件提升为需核对具体秘密版本的调查候选。
    en: Turn repository-level transfer events into investigation candidates requiring concrete secret-version reconciliation.
  domains:
  - enterprise
  platforms:
  - GitHub Enterprise Cloud
  logic:
    paragraphs:
    - zh: 在受控扫描环境解析允许仓库的历史对象，记录 repository_id、commit_oid、blob_oid、path、material_class、record_role、introduced_commit、removed_commit 与证据引用，秘密正文留在受限证据库。将
        git.clone 与 git.fetch 的 actor、repository_id、时间和 hashed_token 连接该暴露清单及批准任务；无版本对象范围的服务事件只输出 repository-exposure-candidate。
      en: Parse authorized repository history in a controlled scanner, retaining repository ID, commit and blob OIDs, path, material
        class, record role, introducing and removing commits, and evidence reference; keep secret content in restricted evidence storage.
        Join clone and fetch actor, repository ID, time, and hashed token to the exposure inventory and approved work. A service event
        lacking transferred-object scope yields only repository-exposure-candidate.
    - zh: 用调查中保全的客户端仓库对象清单、受控传输清单或实际输出检查具体 blob 是否进入接收者控制；深度 clone、分支范围和 fetch 不一定覆盖全历史。确认取得含秘密的历史 blob 并核对删除提交或复制关系后，才能标注次生副本。没有客户端证据时不臆造文件读取事件，也不因仓库含秘密就声称每次
        clone 都取得它；后续登录只作为独立风险信号。
      en: Use preserved client-repository objects, a controlled transfer manifest, or actual output to determine whether the particular
        blob entered recipient control. Shallow clones, branch selection, and fetches need not cover all history. Only confirmed receipt
        of a secret-bearing historical blob plus a removal commit or copy relationship establishes the child. Without client evidence,
        do not invent file-read events or assert that every clone acquired a secret merely because the repository contains one; subsequent
        sign-in is an independent risk signal.
  data_requirements:
  - source_type: github-git-transfer-audit
    name:
      zh: GitHub Git 传输审计
      en: GitHub Git Transfer Audit
    channel: GitHub Enterprise Cloud audit streaming or REST audit API include=git; timestamp maps native @timestamp
    required_fields:
    - timestamp
    - action
    - actor
    - repository_id
    - hashed_token
    - transport_protocol
  - source_type: historical-secret-object-inventory
    name:
      zh: 防守方生成的秘密历史对象索引
      en: Defender-Generated Historical Secret Object Index
    channel: Authorized repository scanner output
    required_fields:
    - repository_id
    - commit_oid
    - blob_oid
    - path
    - material_class
    - record_role
    - lineage_evidence_id
    - scan_time
  - source_type: investigated-transfer-object-manifest
    name:
      zh: 调查取得的客户端或传输对象清单
      en: Investigated Client or Transfer Object Manifest
    channel: Preserved client repository or controlled transfer evidence; not a native clone-log field
    required_fields:
    - evidence_id
    - recipient_id
    - repository_id
    - observed_time
    - received_blob_oids
    - completeness
  - source_type: approved-repository-reader
    name:
      zh: 仓库批准读者与任务
      en: Approved Repository Readers and Jobs
    channel: Repository ownership and CI job inventory
    required_fields:
    - actor
    - repository_id
    - job_id
    - purpose
    - valid_from
    - valid_until
    - allowed_history_scope
  observables:
  - zh: 含暴露历史对象的仓库被职责外主体 clone 或 fetch
    en: Clone or fetch of a repository with exposed historical objects by an out-of-duty reader
  - zh: 接收对象清单实际包含已确认秘密 blob 且可核对次生记录关系
    en: A received-object manifest actually contains a confirmed secret blob with verifiable secondary-record lineage
  correlation:
    window:
      zh: 将一次传输前后六十分钟与作业关联，保留至少九十日事件基线；历史对象索引覆盖秘密暴露窗口且记录完整性。
      en: Correlate a transfer with jobs within sixty minutes and retain at least a ninety-day event baseline; history indexing covers
        the exposure window and records completeness.
    dimensions:
    - repository_id
    - actor
    - hashed_token
    - commit_oid
    - blob_oid
    - recipient_id
    - job_id
    - time
  false_positives:
  - zh: 新开发者全量 clone、镜像、合规扫描和事故保全
    en: New-developer full clones mirroring compliance scans and incident preservation
  - zh: 合法构建从浅 clone 改为全量历史或执行签名验证
    en: Legitimate builds changing from shallow clones to complete history or signature verification
  blind_spots:
  - zh: 服务端 Git 事件没有逐文件读取或传输 blob 清单，缺少客户端证据时不能确证秘密取得
    en: Server Git events lack per-file reads and transferred-blob manifests so acquisition cannot be confirmed without client evidence
  - zh: 已外传 clone 的后续离线搜索、公开匿名访问与未覆盖的 web/API 下载
    en: Later offline searches of exfiltrated clones public anonymous access and uncovered web or API downloads
  - zh: Git 事件仅短期留存且 streaming 启用前不会补记
    en: Short Git-event retention and no backfill before streaming is enabled
  tuning_guidance:
    paragraphs:
    - zh: 提前开启并验证 Git 事件外送，按仓库与作业约束 CI 例外，不把 token 或开发者身份永久全局放行。以含无权限测试字符串的历史提交验证全量与浅 clone、指定分支和增量 fetch 的分级结果，要求缺少对象清单时保持候选。用这些实验调整窗口，确保撤销秘密仍保留暴露记录而不持续制造高危有效性断言。
      en: Enable and validate Git-event export in advance, scoping CI exceptions by repository and job rather than globally allowing
        tokens or developer identities. Use historical commits containing nonprivileged test strings to verify grading for full and
        shallow clones, selected branches, and incremental fetches; absent object manifests must remain candidates. Tune windows with
        those experiments and preserve exposure records after revocation without repeatedly asserting high-risk validity.
  evidence_refs:
  - REF-000942
  - TMP1552-REF-GH-ACCESS
  - TMP1552-REF-GH-REMOVE
  - TMP1552-REF-NDSS
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
- schema_version: 2.0.0
  type: detection-analytic
  id: TMP1552-NJA-CONFIG
  strategy_ref: TMP1552-DET-CONFIG
  name:
    zh: Kubernetes 普通配置秘密响应分析
    en: Kubernetes Ordinary-Configuration Secret-Response Analytic
  summary:
    zh: 用资源版本暴露清单解释职责外 Pod 或 ConfigMap 读取。
    en: Interpret out-of-duty Pod or ConfigMap reads with a versioned exposure inventory.
  domains:
  - enterprise
  platforms:
  - Kubernetes
  logic:
    paragraphs:
    - zh: 受控扫描批准的 Pod 与 ConfigMap，标记实际明文认证秘密所在字段及 resourceVersion，排除仅有 secretKeyRef、模板变量、示例和掩码的对象。以 auditID 合并同次 API 请求，选择 get/list
        的 ResponseComplete 与成功 responseStatus，将 user.username、sourceIPs、objectRef 和 requestURI 连接资源清单与工作负载/运维职责。对 list 必须核对实际返回集合，不能只用
        namespace 推断所有对象均返回。
      en: Scan authorized Pods and ConfigMaps in a controlled environment, marking actual plaintext authentication-secret fields and
        resource versions while excluding secretKeyRef-only objects, placeholders, examples, and masks. Merge stages by auditID and
        select successful get or list ResponseComplete events. Join user, source IPs, object reference, and request URI to resource
        inventory and workload or administrative duty. For list, reconcile the actual returned set rather than inferring that every
        object in the namespace was returned.
    - zh: Metadata 级别只能形成 configured-secret-read-candidate；要确认某值返回，需要受保护的 RequestResponse 证据或客户端产物，核对资源版本和含值字段。该内容只能在隔离解析器处理，告警输出对象、字段类别和证据指针，避免普通日志成为新秘密副本。正常
        Secret 资源读取转交受管理保管边界审查，不能为扩大本分析覆盖而自动标作未保护。
      en: Metadata audit yields only configured-secret-read-candidate. Confirming a returned value requires protected RequestResponse
        evidence or client output matching resource version and secret-bearing field. Process content only in an isolated parser and
        emit object, field class, and evidence pointer so ordinary logs do not become new secret copies. Direct Secret-resource reads
        go to managed-custody boundary review rather than being automatically labeled unprotected to expand coverage.
  data_requirements:
  - source_type: kubernetes-api-audit
    name:
      zh: Kubernetes API 审计
      en: Kubernetes API Audit
    channel: kube-apiserver audit.k8s.io/v1; audit_id=auditID request_received_timestamp=requestReceivedTimestamp source_ips=sourceIPs
      request_uri=requestURI object_ref=objectRef response_status.code=responseStatus.code
    required_fields:
    - audit_id
    - stage
    - request_received_timestamp
    - verb
    - user.username
    - source_ips
    - request_uri
    - object_ref
    - response_status.code
  - source_type: ordinary-config-secret-inventory
    name:
      zh: 普通配置秘密版本清单
      en: Ordinary-Configuration Secret Version Inventory
    channel: Authorized configuration scanner output; resource_version maps native metadata.resourceVersion
    required_fields:
    - cluster_id
    - namespace
    - kind
    - name
    - resource_version
    - field_path
    - material_class
    - scan_time
    - owner
    - approved_reader_scope
  - source_type: protected-api-response-evidence
    name:
      zh: 受保护响应证据
      en: Protected Response Evidence
    channel: Selective RequestResponse audit or preserved client output in restricted evidence storage
    required_fields:
    - evidence_id
    - audit_id
    - cluster_id
    - returned_object_set
    - resource_versions
    - secret_field_classification
    - completeness
  observables:
  - zh: 职责外主体成功读取已确认含明文秘密的普通配置对象
    en: Successful out-of-duty reads of ordinary configuration confirmed to contain plaintext secrets
  - zh: 完整响应或客户端产物确认具体含值字段进入接收面
    en: Complete responses or client output confirming particular secret-bearing fields entered the recipient surface
  correlation:
    window:
      zh: 按 auditID 关联整个事务，前后十五分钟核对工作负载与工单；内容版本必须对应响应时刻。
      en: Join the full transaction by auditID and reconcile workload and work-order context within fifteen minutes; content version
        must match response time.
    dimensions:
    - cluster_id
    - audit_id
    - namespace
    - object_ref.name
    - user.username
    - source_ips
    - resource_version
    - time
  false_positives:
  - zh: 合法控制器 reconcile、运维排障、灾备导出和秘密修复扫描
    en: Legitimate controller reconciliation troubleshooting recovery export and secret-remediation scans
  blind_spots:
  - zh: 未配置审计、只留 Metadata、响应被截断或扫描版本与读取时内容不一致
    en: Missing audit Metadata-only retention truncated responses or scan versions inconsistent with read-time content
  - zh: Pod 内直接读取环境或日志、Docker API 与非 Kubernetes 接口不在本分析覆盖
    en: Direct in-Pod environment or log reads Docker APIs and other non-Kubernetes interfaces are outside this analytic
  tuning_guidance:
    paragraphs:
    - zh: 先用无权限测试秘密分别验证 get、带 selector 的 list、分页和 Metadata/RequestResponse 分级，确认不会把 secretKeyRef 当作值。允许规则绑定控制器身份、namespace、对象类型及工作负载职责，不永久放行所有
        service account。部署前评估正文审计的保密和成本，只把最小必要证据送入隔离库；无正文时保持候选并通过调查补证。
      en: Test get, selector-based list, pagination, and Metadata versus RequestResponse grading with nonprivileged secrets, ensuring
        secretKeyRef is never treated as a value. Bind allow rules to controller, namespace, resource type, and workload duty rather
        than all service accounts. Assess confidentiality and cost before response auditing, send only necessary evidence to isolated
        storage, and retain candidate status when content needs investigation.
  evidence_refs:
  - REF-000211
  - TMP1552-REF-K8S
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
mitigations:
- schema_version: 2.0.0
  type: mitigation
  id: TMP1552-MIT-CUSTODY
  name:
    zh: 普通内容面秘密隔离与副本失效
    en: Ordinary-Surface Secret Isolation and Copy Invalidation
  summary:
    zh: 减少普通内容中的认证秘密并分别治理副本读取与已暴露值的后继价值。
    en: Reduce authentication secrets in ordinary content and separately govern copy access and downstream value of exposed material.
  description:
    paragraphs:
    - zh: 将秘密的现行供给面与历史、协作、日志和导出副本分别盘点，登记 owner、允许读者、保留期限、形成关系和轮换责任。普通配置尽可能只保存引用，必须存在的值由独立秘密边界、最小权限及短寿命机制保护；已生成副本不能依靠原件修正自动撤回。
      en: Inventory current secret-supply surfaces separately from history, collaboration, logs, and export copies, retaining owner,
        allowed readers, retention, creation relationships, and rotation responsibility. Ordinary configuration should carry references
        where possible, with necessary values protected by independent custody, least authority, and short lifetimes. Correcting an
        original does not retract existing copies.
  domains:
  - enterprise
  measures:
  - key: remove-ambient-secret-values
    name:
      zh: 移除普通内容中的秘密值
      en: Remove Secret Values from Ordinary Content
    description:
      paragraphs:
      - zh: 从现行脚本、配置、注册表自动登录值、普通清单和日志移除不必要秘密，用专用秘密引用和最小消费者范围代替；禁止把公开常量加密或 base64 视为保密边界。检查过滤后的历史与日志输出，避免将秘密迁入另一普通记录。
        en: Remove unnecessary secrets from active scripts, configuration, registry autologon values, ordinary manifests, and logs,
          using dedicated secret references and minimum consumer scope. Public-constant encryption and base64 are not confidentiality
          boundaries. Check filtered history and log output so migration does not create another ordinary record.
    control_type: exposure-reduction
  - key: govern-secondary-records
    name:
      zh: 治理次生记录与读取
      en: Govern Secondary Records and Reads
    description:
      paragraphs:
      - zh: 盘点历史、共享消息、版本、备份和导出副本的对象身份与形成链，对仍必要记录设置最小读取、受控保留和内容脱敏，清理可控 clone 与引用并验证实际效果。使用经版本验证的历史敏感过滤和不含秘密的审计特征，兼顾调查记录要求。
        en: Inventory object identities and creation chains for history, shared messages, versions, backups, and exports. Apply least
          read authority, controlled retention, and redaction to necessary records; clean controlled clones and references and verify
          the outcome. Use version-tested sensitive-history filtering and value-free audit features while preserving investigation requirements.
    control_type: preventive
  - key: invalidate-by-exposure-scope
    name:
      zh: 按暴露范围使材料失效
      en: Invalidate Material by Exposure Scope
    description:
      paragraphs:
      - zh: 保全必要证据后，按材料类别、身份、暴露版本和接收者轮换口令与密钥或撤销令牌，验证旧材料在授权测试中被拒绝。保留未知副本与无法删除的外部记录清单；仅删原文件、打补丁或重写历史不能代替失效处置。
        en: After preserving necessary evidence, rotate passwords and keys or revoke tokens by material class, identity, exposed version,
          and recipient, verifying rejection of old material in authorized tests. Retain an inventory of unknown copies and undeletable
          external records. Deleting originals, patching, or rewriting history does not substitute for invalidation.
    control_type: containment
  applications:
  - target_ref: TMP1552-PARENT
    use:
      paragraphs:
      - zh: 扫描现行配置、自动登录键、旧 GPP XML 和普通容器清单，先确认真实秘密承载再分配 owner 与允许读者。移除明文/公开可逆秘密并轮换已暴露值；GPP 更新后仍检查并删除旧含口令策略，正常保管库与工作负载凭据通过专用边界保护，而不通过全禁正常
          API 处理。
        en: Scan active configuration, autologon keys, old GPP XML, and ordinary container manifests, confirming real secret content
          before assigning owner and readers. Remove plaintext or publicly reversible secrets and rotate exposed values; after GPP updates
          still inspect and remove old password-bearing policies. Protect legitimate vault and workload credentials at their dedicated
          boundaries rather than disabling ordinary APIs wholesale.
    expected_effect:
      paragraphs:
      - zh: 可由普通内容读取获得的秘密数量与寿命下降，攻击者必须接触更受控的秘密面或承担额外取得成本。对象与读者清单还能使残余读取被关联为潜在秘密披露，而不只是一次无语义文件访问。
        en: Fewer and shorter-lived secrets remain obtainable through ordinary content, forcing contact with a more controlled secret
          surface or additional acquisition cost. Object and reader inventories also let residual reads be interpreted as potential
          disclosures instead of semantically empty file access.
    limitations:
      paragraphs:
      - zh: 受侵消费者仍可读取其业务所需秘密，老系统可能不支持引用或短寿命材料。迁移和轮换可中断服务，外部副本也无法保证删除；仍需监测内容读取，且材料有效性未知时不能只凭删除成功宣告恢复。
        en: A compromised consumer can still read secrets required for its job, and legacy systems may lack references or short-lived
          material. Migration and rotation can interrupt service and external copies cannot be guaranteed deleted. Read monitoring remains
          necessary, and successful deletion alone cannot establish recovery when validity is unknown.
  - target_ref: TMP1552-CHILD-COPY
    use:
      paragraphs:
      - zh: 按命令记录、共享关系、版本差异或备份映射登记副本谱系；扫描范围包括历史 commit、受控 clone、协作导出和 history 文件，不能只检查当前文件。对可控记录执行最小读取与保留，对已暴露秘密先轮换或撤销，再协调清理 fork、缓存和备份，记录无法撤回的副本。
        en: Register copy lineage from command records, sharing relationships, version differences, or backup mappings. Scan historical
          commits, controlled clones, collaboration exports, and history files rather than only current files. Apply least reading and
          retention to controlled records, rotate or revoke exposed secrets first, then coordinate fork, cache, and backup cleanup and
          record copies that cannot be retracted.
    expected_effect:
      paragraphs:
      - zh: 攻击者绕过现行供给面从旧记录取得可用秘密的机会缩小；即使未知 clone 继续存在，旧值失效也降低后继风险。记录谱系与读取审计连接后，副本取得不再只依赖原保管库出现新事务才能被解释。
        en: Opportunities to recover usable secrets from old records without the current supply surface decrease. Even when unknown
          clones persist, invalidating old values reduces downstream risk. Linking record lineage and read audit makes copy acquisition
          interpretable without requiring a new original-custodian transaction.
    limitations:
      paragraphs:
      - zh: 组织不能清除他人的全部 clone 或已外传邮件，保留义务也可能禁止删除原始记录。历史过滤依赖版本和命令语义，简单关键词会漏记或误删调查信息；如果攻击者已持有新秘密或控制轮换流程，副本治理不能单独恢复信任。
        en: Organizations cannot erase every external clone or exfiltrated email, and retention duties may prohibit deleting original
          records. History filtering depends on version and command semantics, while simple keywords can miss secrets or remove investigative
          information. Copy governance alone cannot restore trust if the actor holds new secrets or controls rotation.
  evidence_refs:
  - TMP1552-REF-GPP
  - TMP1552-REF-GH-REMOVE
  - TMP1552-REF-PSREADLINE
  - TMP1552-REF-K8S
  - TMP1552-REF-IMDSV2
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
