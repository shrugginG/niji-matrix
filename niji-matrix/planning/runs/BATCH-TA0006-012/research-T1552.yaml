  detection_strategies:
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1552-DET-READ
    name:
      zh: 秘密承载对象读取与职责关联
      en: Secret-Bearing Object Read and Duty Correlation
    summary:
      zh: 将实际对象读取连接到秘密承载清单与批准读者职责。
      en: Join exercised object reads to a secret-carrier inventory and approved reader duties.
    description:
      paragraphs:
      - zh: 监测已确认秘密承载文件、注册表值所在键和交互历史的实际读取，并区分现行配置与有形成链的次生记录。关联分析解释读取主体、进程和批准职责，输出可疑读取与已验证材料取得两个结果层级。
        en: Monitor exercised reads of confirmed secret-bearing files, registry keys containing secret values, and interactive history,
          distinguishing current configuration from secondary records with creation lineage. The analytic explains reader, process,
          and approved duty and separates suspicious reads from verified material acquisition.
    detects_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    domains:
    - enterprise
    analytic_refs:
    - TMP1552-NJA-READ
    evidence_refs:
    - REF-000379
    - REF-000230
    - TMP1552-REF-AUTOLOGON
    - TMP1552-REF-GPP
    - TMP1552-REF-PSREADLINE
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1552-DET-COPY
    name:
      zh: 秘密副本版本与取回范围核对
      en: Secret-Copy Version and Retrieval-Scope Reconciliation
    summary:
      zh: 按历史对象和传输范围审查含秘密副本的取回。
      en: Review retrieval of secret-bearing copies using historical objects and transfer scope.
    description:
      paragraphs:
      - zh: 用版本化秘密暴露清单解释仓库 clone/fetch，避免只根据仓库名称认定秘密外流。分析将已知含值版本、接收者与获批用途连接，并明确仓库级事件不能提供的对象范围；本策略直接覆盖次生副本，也辅助父级中的普通仓库配置调查。
        en: Interpret clone or fetch activity with a versioned exposure inventory rather than treating a repository name as proof of
          disclosure. The analytic joins known secret-bearing versions, recipient, and approved purpose while identifying object scope
          absent from repository-level events. It directly covers secondary copies and supports investigation of ordinary repository
          configuration at the parent level.
    detects_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    domains:
    - enterprise
    analytic_refs:
    - TMP1552-NJA-COPY
    evidence_refs:
    - REF-000942
    - TMP1552-REF-GH-ACCESS
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-NDSS
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1552-DET-CONFIG
    name:
      zh: 普通配置 API 秘密披露与接收者核对
      en: Ordinary Configuration API Secret Disclosure and Recipient Reconciliation
    summary:
      zh: 识别普通配置读取把已确认秘密交给职责外接收者的情况。
      en: Identify ordinary configuration reads exposing confirmed secrets to recipients outside approved duty.
    description:
      paragraphs:
      - zh: 策略关注 Pod 与 ConfigMap 等普通配置对象里的实际秘密披露，不把 Secret 资源名或成功 API 请求当作结论。分析将资源版本暴露清单、成功响应与主体职责关联，并保留响应正文不可见时的候选等级。
        en: Focus on actual secret disclosure in ordinary configuration objects such as Pods and ConfigMaps, without treating a Secret
          resource name or successful API call as conclusive. The analytic joins versioned exposure findings, successful responses,
          and reader duty and retains candidate grading when response content is unavailable.
    detects_refs:
    - TMP1552-PARENT
    domains:
    - enterprise
    analytic_refs:
    - TMP1552-NJA-CONFIG
    evidence_refs:
    - REF-000211
    - TMP1552-REF-K8S
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  detection_analytics:
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1552-NJA-READ
    strategy_ref: TMP1552-DET-READ
    name:
      zh: 已审计秘密工件实际读取分析
      en: Audited Secret-Artifact Exercised-Read Analytic
    summary:
      zh: 对照秘密承载清单识别职责外读取，并保留证据强度。
      en: Identify out-of-duty reads against a carrier inventory while preserving evidence strength.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 对已盘点的配置文件、GPP XML、PSReadLine 历史和 Winlogon 秘密值所在键启用相应对象审计及 SACL，先以无生产权限测试内容验证 4663 能记录读取。按 Computer、ObjectType 和规范化 ObjectName
          连接最近一次受限扫描，区分文件 ReadData 与目录 ListDirectory、注册表 Query key value；只查询键时不推断某个值已完整返回。以 SubjectLogonId 与 ProcessId 在同一主机进程生命周期内关联读者和作业许可，避免
          PID 复用。
        en: Enable the required object audit and SACL on inventoried configuration, GPP XML, PSReadLine history, and keys containing
          Winlogon secret values, first testing 4663 read coverage with material lacking production authority. Join Computer, ObjectType,
          and normalized ObjectName to the latest restricted scan. Distinguish file ReadData from directory ListDirectory and registry
          Query key value; a key query alone does not establish a particular value's complete return. Correlate SubjectLogonId and ProcessId
          within the same host process lifetime to reader and job approval, avoiding PID reuse.
      - zh: 不符合配置所有者登记的读者、工单范围或历史使用模式时输出 suspicious-read，包含对象、分类、进程和批准差异。只有受限调查中确认返回值、复制产物或内容映射时才输出 secret-material-recovered；4663 本身不含秘密值、返回字节或全部文件内容。历史文件另需记录其历史格式或生成事务，未知谱系保留父级；远程
          SYSVOL 服务器侧进程可能为系统服务，不能冒充客户端进程归因。
        en: Emit suspicious-read when the reader, work-order scope, or historical pattern conflicts with the configuration owner's approval,
          retaining object, classification, process, and approval difference. Emit secret-material-recovered only after restricted investigation
          confirms returned values, copy output, or content mapping; 4663 itself lacks secret values, returned bytes, and complete file
          content. History additionally needs record-format or creating-transaction evidence, with unknown lineage kept parent-level.
          A server-side SYSVOL process can be a system service and must not be treated as the remote client process.
    data_requirements:
    - source_type: windows-exercised-object-access
      name:
        zh: Windows 已使用对象访问权
        en: Windows Exercised Object Access
      channel: Windows Security Event 4663; normalized computer=Computer time_created=TimeCreated object_type=ObjectType object_name=ObjectName
        access_mask=AccessMask subject_user_sid=SubjectUserSid subject_logon_id=SubjectLogonId process_id=ProcessId process_name=ProcessName
      required_fields:
      - computer
      - time_created
      - object_type
      - object_name
      - access_mask
      - subject_user_sid
      - subject_logon_id
      - process_id
      - process_name
    - source_type: secret-carrier-inventory
      name:
        zh: 受限秘密承载扫描清单
        en: Restricted Secret-Carrier Scan Inventory
      channel: Defender-operated content scanner and configuration inventory
      required_fields:
      - host_id
      - object_path
      - object_type
      - scan_time
      - material_class
      - carrier_role
      - lineage_evidence_id
      - owner
      - approved_reader_scope
    - source_type: approved-read-job
      name:
        zh: 配置与历史读取批准记录
        en: Approved Configuration and History Read Jobs
      channel: Change and incident work-order system
      required_fields:
      - job_id
      - principal_id
      - host_id
      - object_scope
      - valid_from
      - valid_until
      - purpose
    observables:
    - zh: 对已确认秘密承载文件实际使用读取权，且读者或用途不在批准范围
      en: Exercised read rights on a confirmed secret-bearing file by a reader or purpose outside approved scope
    - zh: 对含自动登录值的键发生职责外查询，但仍需值级结果核实
      en: An out-of-duty query of a key containing autologon values requiring value-level result confirmation
    - zh: 具有可核对记录角色的命令历史被非预期进程读取
      en: A history record with verifiable role is read by an unexpected process
    correlation:
      window:
        zh: 读取前后十五分钟核对作业与进程，保留三十日同角色基线；扫描版本必须覆盖读取时内容，窗口需在本地测试。
        en: Reconcile jobs and processes within fifteen minutes of the read with a thirty-day role baseline; the scan must represent
          content at read time and windows require local testing.
      dimensions:
      - computer
      - object_name
      - object_type
      - subject_user_sid
      - subject_logon_id
      - process_id
      - job_id
      - time
    false_positives:
    - zh: 备份、安全扫描、桌面故障排查和获批历史恢复
      en: Backup security scanning desktop troubleshooting and approved history recovery
    - zh: 正常组策略客户端周期读取与部署账户配置维护
      en: Periodic normal Group Policy reads and deployment-account configuration maintenance
    blind_spots:
    - zh: 没有 SACL、审计未启用、离线磁盘或本地管理员破坏日志
      en: Missing SACL disabled audit offline media or local-administrator log interference
    - zh: 4663 不提供值级内容或完整返回证明；Sysmon 12–14 是注册表修改而非读取补充
      en: 4663 lacks value-level content or complete-return proof and Sysmon 12–14 registry modifications are not supplemental read
        telemetry
    - zh: 扫描之后内容变化、符号路径差异与远程文件服务弱客户端归因
      en: Content changes after scanning path aliasing and weak client attribution at remote file services
    tuning_guidance:
      paragraphs:
      - zh: 以配置 owner、对象范围和有期限作业建立允许组合，不全局放行 powershell.exe、备份身份或域用户。用不含有效秘密的文件和测试键验证读取触发、PID/登录关联及正常部署不误报；每次调优同时复测未批准读者仍能生成候选。扫描只保留材料类别和证据指针，不把真实口令复制到
          SIEM。
        en: Allow combinations of configuration owner, object scope, and time-bounded jobs rather than globally permitting PowerShell,
          backup identities, or domain users. Use nonproduction test files and keys to verify read triggering, process and logon correlation,
          and normal deployment behavior. Recheck an unapproved reader after each tuning change. Scanning retains material class and
          evidence pointers without copying passwords into the SIEM.
    evidence_refs:
    - REF-000379
    - REF-000230
    - TMP1552-REF-AUTOLOGON
    - TMP1552-REF-GPP
    - TMP1552-REF-PSREADLINE
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1552-NJA-COPY
    strategy_ref: TMP1552-DET-COPY
    name:
      zh: 仓库秘密版本与取回范围分析
      en: Repository Secret Version and Retrieval-Scope Analytic
    summary:
      zh: 将仓库级传输事件提升为需核对具体秘密版本的调查候选。
      en: Turn repository-level transfer events into investigation candidates requiring concrete secret-version reconciliation.
    domains:
    - enterprise
    platforms:
    - GitHub Enterprise Cloud
    logic:
      paragraphs:
      - zh: 在受控扫描环境解析允许仓库的历史对象，记录 repository_id、commit_oid、blob_oid、path、material_class、record_role、introduced_commit、removed_commit
          与证据引用，秘密正文留在受限证据库。将 git.clone 与 git.fetch 的 actor、repository_id、时间和 hashed_token 连接该暴露清单及批准任务；无版本对象范围的服务事件只输出 repository-exposure-candidate。
        en: Parse authorized repository history in a controlled scanner, retaining repository ID, commit and blob OIDs, path, material
          class, record role, introducing and removing commits, and evidence reference; keep secret content in restricted evidence storage.
          Join clone and fetch actor, repository ID, time, and hashed token to the exposure inventory and approved work. A service event
          lacking transferred-object scope yields only repository-exposure-candidate.
      - zh: 用调查中保全的客户端仓库对象清单、受控传输清单或实际输出检查具体 blob 是否进入接收者控制；深度 clone、分支范围和 fetch 不一定覆盖全历史。确认取得含秘密的历史 blob 并核对删除提交或复制关系后，才能标注次生副本。没有客户端证据时不臆造文件读取事件，也不因仓库含秘密就声称每次
          clone 都取得它；后续登录只作为独立风险信号。
        en: Use preserved client-repository objects, a controlled transfer manifest, or actual output to determine whether the particular
          blob entered recipient control. Shallow clones, branch selection, and fetches need not cover all history. Only confirmed receipt
          of a secret-bearing historical blob plus a removal commit or copy relationship establishes the child. Without client evidence,
          do not invent file-read events or assert that every clone acquired a secret merely because the repository contains one; subsequent
          sign-in is an independent risk signal.
    data_requirements:
    - source_type: github-git-transfer-audit
      name:
        zh: GitHub Git 传输审计
        en: GitHub Git Transfer Audit
      channel: GitHub Enterprise Cloud audit streaming or REST audit API include=git; timestamp maps native @timestamp
      required_fields:
      - timestamp
      - action
      - actor
      - repository_id
      - hashed_token
      - transport_protocol
    - source_type: historical-secret-object-inventory
      name:
        zh: 防守方生成的秘密历史对象索引
        en: Defender-Generated Historical Secret Object Index
      channel: Authorized repository scanner output
      required_fields:
      - repository_id
      - commit_oid
      - blob_oid
      - path
      - material_class
      - record_role
      - lineage_evidence_id
      - scan_time
    - source_type: investigated-transfer-object-manifest
      name:
        zh: 调查取得的客户端或传输对象清单
        en: Investigated Client or Transfer Object Manifest
      channel: Preserved client repository or controlled transfer evidence; not a native clone-log field
      required_fields:
      - evidence_id
      - recipient_id
      - repository_id
      - observed_time
      - received_blob_oids
      - completeness
    - source_type: approved-repository-reader
      name:
        zh: 仓库批准读者与任务
        en: Approved Repository Readers and Jobs
      channel: Repository ownership and CI job inventory
      required_fields:
      - actor
      - repository_id
      - job_id
      - purpose
      - valid_from
      - valid_until
      - allowed_history_scope
    observables:
    - zh: 含暴露历史对象的仓库被职责外主体 clone 或 fetch
      en: Clone or fetch of a repository with exposed historical objects by an out-of-duty reader
    - zh: 接收对象清单实际包含已确认秘密 blob 且可核对次生记录关系
      en: A received-object manifest actually contains a confirmed secret blob with verifiable secondary-record lineage
    correlation:
      window:
        zh: 将一次传输前后六十分钟与作业关联，保留至少九十日事件基线；历史对象索引覆盖秘密暴露窗口且记录完整性。
        en: Correlate a transfer with jobs within sixty minutes and retain at least a ninety-day event baseline; history indexing covers
          the exposure window and records completeness.
      dimensions:
      - repository_id
      - actor
      - hashed_token
      - commit_oid
      - blob_oid
      - recipient_id
      - job_id
      - time
    false_positives:
    - zh: 新开发者全量 clone、镜像、合规扫描和事故保全
      en: New-developer full clones mirroring compliance scans and incident preservation
    - zh: 合法构建从浅 clone 改为全量历史或执行签名验证
      en: Legitimate builds changing from shallow clones to complete history or signature verification
    blind_spots:
    - zh: 服务端 Git 事件没有逐文件读取或传输 blob 清单，缺少客户端证据时不能确证秘密取得
      en: Server Git events lack per-file reads and transferred-blob manifests so acquisition cannot be confirmed without client evidence
    - zh: 已外传 clone 的后续离线搜索、公开匿名访问与未覆盖的 web/API 下载
      en: Later offline searches of exfiltrated clones public anonymous access and uncovered web or API downloads
    - zh: Git 事件仅短期留存且 streaming 启用前不会补记
      en: Short Git-event retention and no backfill before streaming is enabled
    tuning_guidance:
      paragraphs:
      - zh: 提前开启并验证 Git 事件外送，按仓库与作业约束 CI 例外，不把 token 或开发者身份永久全局放行。以含无权限测试字符串的历史提交验证全量与浅 clone、指定分支和增量 fetch 的分级结果，要求缺少对象清单时保持候选。用这些实验调整窗口，确保撤销秘密仍保留暴露记录而不持续制造高危有效性断言。
        en: Enable and validate Git-event export in advance, scoping CI exceptions by repository and job rather than globally allowing
          tokens or developer identities. Use historical commits containing nonprivileged test strings to verify grading for full and
          shallow clones, selected branches, and incremental fetches; absent object manifests must remain candidates. Tune windows with
          those experiments and preserve exposure records after revocation without repeatedly asserting high-risk validity.
    evidence_refs:
    - REF-000942
    - TMP1552-REF-GH-ACCESS
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-NDSS
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1552-NJA-CONFIG
    strategy_ref: TMP1552-DET-CONFIG
    name:
      zh: Kubernetes 普通配置秘密响应分析
      en: Kubernetes Ordinary-Configuration Secret-Response Analytic
    summary:
      zh: 用资源版本暴露清单解释职责外 Pod 或 ConfigMap 读取。
      en: Interpret out-of-duty Pod or ConfigMap reads with a versioned exposure inventory.
    domains:
    - enterprise
    platforms:
    - Kubernetes
    logic:
      paragraphs:
      - zh: 受控扫描批准的 Pod 与 ConfigMap，标记实际明文认证秘密所在字段及 resourceVersion，排除仅有 secretKeyRef、模板变量、示例和掩码的对象。以 auditID 合并同次 API 请求，选择 get/list
          的 ResponseComplete 与成功 responseStatus，将 user.username、sourceIPs、objectRef 和 requestURI 连接资源清单与工作负载/运维职责。对 list 必须核对实际返回集合，不能只用
          namespace 推断所有对象均返回。
        en: Scan authorized Pods and ConfigMaps in a controlled environment, marking actual plaintext authentication-secret fields and
          resource versions while excluding secretKeyRef-only objects, placeholders, examples, and masks. Merge stages by auditID and
          select successful get or list ResponseComplete events. Join user, source IPs, object reference, and request URI to resource
          inventory and workload or administrative duty. For list, reconcile the actual returned set rather than inferring that every
          object in the namespace was returned.
      - zh: Metadata 级别只能形成 configured-secret-read-candidate；要确认某值返回，需要受保护的 RequestResponse 证据或客户端产物，核对资源版本和含值字段。该内容只能在隔离解析器处理，告警输出对象、字段类别和证据指针，避免普通日志成为新秘密副本。正常
          Secret 资源读取转交受管理保管边界审查，不能为扩大本分析覆盖而自动标作未保护。
        en: Metadata audit yields only configured-secret-read-candidate. Confirming a returned value requires protected RequestResponse
          evidence or client output matching resource version and secret-bearing field. Process content only in an isolated parser and
          emit object, field class, and evidence pointer so ordinary logs do not become new secret copies. Direct Secret-resource reads
          go to managed-custody boundary review rather than being automatically labeled unprotected to expand coverage.
    data_requirements:
    - source_type: kubernetes-api-audit
      name:
        zh: Kubernetes API 审计
        en: Kubernetes API Audit
      channel: kube-apiserver audit.k8s.io/v1; audit_id=auditID request_received_timestamp=requestReceivedTimestamp source_ips=sourceIPs
        request_uri=requestURI object_ref=objectRef response_status.code=responseStatus.code
      required_fields:
      - audit_id
      - stage
      - request_received_timestamp
      - verb
      - user.username
      - source_ips
      - request_uri
      - object_ref
      - response_status.code
    - source_type: ordinary-config-secret-inventory
      name:
        zh: 普通配置秘密版本清单
        en: Ordinary-Configuration Secret Version Inventory
      channel: Authorized configuration scanner output; resource_version maps native metadata.resourceVersion
      required_fields:
      - cluster_id
      - namespace
      - kind
      - name
      - resource_version
      - field_path
      - material_class
      - scan_time
      - owner
      - approved_reader_scope
    - source_type: protected-api-response-evidence
      name:
        zh: 受保护响应证据
        en: Protected Response Evidence
      channel: Selective RequestResponse audit or preserved client output in restricted evidence storage
      required_fields:
      - evidence_id
      - audit_id
      - cluster_id
      - returned_object_set
      - resource_versions
      - secret_field_classification
      - completeness
    observables:
    - zh: 职责外主体成功读取已确认含明文秘密的普通配置对象
      en: Successful out-of-duty reads of ordinary configuration confirmed to contain plaintext secrets
    - zh: 完整响应或客户端产物确认具体含值字段进入接收面
      en: Complete responses or client output confirming particular secret-bearing fields entered the recipient surface
    correlation:
      window:
        zh: 按 auditID 关联整个事务，前后十五分钟核对工作负载与工单；内容版本必须对应响应时刻。
        en: Join the full transaction by auditID and reconcile workload and work-order context within fifteen minutes; content version
          must match response time.
      dimensions:
      - cluster_id
      - audit_id
      - namespace
      - object_ref.name
      - user.username
      - source_ips
      - resource_version
      - time
    false_positives:
    - zh: 合法控制器 reconcile、运维排障、灾备导出和秘密修复扫描
      en: Legitimate controller reconciliation troubleshooting recovery export and secret-remediation scans
    blind_spots:
    - zh: 未配置审计、只留 Metadata、响应被截断或扫描版本与读取时内容不一致
      en: Missing audit Metadata-only retention truncated responses or scan versions inconsistent with read-time content
    - zh: Pod 内直接读取环境或日志、Docker API 与非 Kubernetes 接口不在本分析覆盖
      en: Direct in-Pod environment or log reads Docker APIs and other non-Kubernetes interfaces are outside this analytic
    tuning_guidance:
      paragraphs:
      - zh: 先用无权限测试秘密分别验证 get、带 selector 的 list、分页和 Metadata/RequestResponse 分级，确认不会把 secretKeyRef 当作值。允许规则绑定控制器身份、namespace、对象类型及工作负载职责，不永久放行所有
          service account。部署前评估正文审计的保密和成本，只把最小必要证据送入隔离库；无正文时保持候选并通过调查补证。
        en: Test get, selector-based list, pagination, and Metadata versus RequestResponse grading with nonprivileged secrets, ensuring
          secretKeyRef is never treated as a value. Bind allow rules to controller, namespace, resource type, and workload duty rather
          than all service accounts. Assess confidentiality and cost before response auditing, send only necessary evidence to isolated
          storage, and retain candidate status when content needs investigation.
    evidence_refs:
    - REF-000211
    - TMP1552-REF-K8S
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  mitigations:
  - schema_version: 2.0.0
    type: mitigation
    id: TMP1552-MIT-CUSTODY
    name:
      zh: 普通内容面秘密隔离与副本失效
      en: Ordinary-Surface Secret Isolation and Copy Invalidation
    summary:
      zh: 减少普通内容中的认证秘密并分别治理副本读取与已暴露值的后继价值。
      en: Reduce authentication secrets in ordinary content and separately govern copy access and downstream value of exposed material.
    description:
      paragraphs:
      - zh: 将秘密的现行供给面与历史、协作、日志和导出副本分别盘点，登记 owner、允许读者、保留期限、形成关系和轮换责任。普通配置尽可能只保存引用，必须存在的值由独立秘密边界、最小权限及短寿命机制保护；已生成副本不能依靠原件修正自动撤回。
        en: Inventory current secret-supply surfaces separately from history, collaboration, logs, and export copies, retaining owner,
          allowed readers, retention, creation relationships, and rotation responsibility. Ordinary configuration should carry references
          where possible, with necessary values protected by independent custody, least authority, and short lifetimes. Correcting an
          original does not retract existing copies.
    domains:
    - enterprise
    measures:
    - key: remove-ambient-secret-values
      name:
        zh: 移除普通内容中的秘密值
        en: Remove Secret Values from Ordinary Content
      description:
        paragraphs:
        - zh: 从现行脚本、配置、注册表自动登录值、普通清单和日志移除不必要秘密，用专用秘密引用和最小消费者范围代替；禁止把公开常量加密或 base64 视为保密边界。检查过滤后的历史与日志输出，避免将秘密迁入另一普通记录。
          en: Remove unnecessary secrets from active scripts, configuration, registry autologon values, ordinary manifests, and logs,
            using dedicated secret references and minimum consumer scope. Public-constant encryption and base64 are not confidentiality
            boundaries. Check filtered history and log output so migration does not create another ordinary record.
      control_type: exposure-reduction
    - key: govern-secondary-records
      name:
        zh: 治理次生记录与读取
        en: Govern Secondary Records and Reads
      description:
        paragraphs:
        - zh: 盘点历史、共享消息、版本、备份和导出副本的对象身份与形成链，对仍必要记录设置最小读取、受控保留和内容脱敏，清理可控 clone 与引用并验证实际效果。使用经版本验证的历史敏感过滤和不含秘密的审计特征，兼顾调查记录要求。
          en: Inventory object identities and creation chains for history, shared messages, versions, backups, and exports. Apply least
            read authority, controlled retention, and redaction to necessary records; clean controlled clones and references and verify
            the outcome. Use version-tested sensitive-history filtering and value-free audit features while preserving investigation
            requirements.
      control_type: preventive
    - key: invalidate-by-exposure-scope
      name:
        zh: 按暴露范围使材料失效
        en: Invalidate Material by Exposure Scope
      description:
        paragraphs:
        - zh: 保全必要证据后，按材料类别、身份、暴露版本和接收者轮换口令与密钥或撤销令牌，验证旧材料在授权测试中被拒绝。保留未知副本与无法删除的外部记录清单；仅删原文件、打补丁或重写历史不能代替失效处置。
          en: After preserving necessary evidence, rotate passwords and keys or revoke tokens by material class, identity, exposed version,
            and recipient, verifying rejection of old material in authorized tests. Retain an inventory of unknown copies and undeletable
            external records. Deleting originals, patching, or rewriting history does not substitute for invalidation.
      control_type: containment
    applications:
    - target_ref: TMP1552-PARENT
      use:
        paragraphs:
        - zh: 扫描现行配置、自动登录键、旧 GPP XML 和普通容器清单，先确认真实秘密承载再分配 owner 与允许读者。移除明文/公开可逆秘密并轮换已暴露值；GPP 更新后仍检查并删除旧含口令策略，正常保管库与工作负载凭据通过专用边界保护，而不通过全禁正常
            API 处理。
          en: Scan active configuration, autologon keys, old GPP XML, and ordinary container manifests, confirming real secret content
            before assigning owner and readers. Remove plaintext or publicly reversible secrets and rotate exposed values; after GPP
            updates still inspect and remove old password-bearing policies. Protect legitimate vault and workload credentials at their
            dedicated boundaries rather than disabling ordinary APIs wholesale.
      expected_effect:
        paragraphs:
        - zh: 可由普通内容读取获得的秘密数量与寿命下降，攻击者必须接触更受控的秘密面或承担额外取得成本。对象与读者清单还能使残余读取被关联为潜在秘密披露，而不只是一次无语义文件访问。
          en: Fewer and shorter-lived secrets remain obtainable through ordinary content, forcing contact with a more controlled secret
            surface or additional acquisition cost. Object and reader inventories also let residual reads be interpreted as potential
            disclosures instead of semantically empty file access.
      limitations:
        paragraphs:
        - zh: 受侵消费者仍可读取其业务所需秘密，老系统可能不支持引用或短寿命材料。迁移和轮换可中断服务，外部副本也无法保证删除；仍需监测内容读取，且材料有效性未知时不能只凭删除成功宣告恢复。
          en: A compromised consumer can still read secrets required for its job, and legacy systems may lack references or short-lived
            material. Migration and rotation can interrupt service and external copies cannot be guaranteed deleted. Read monitoring
            remains necessary, and successful deletion alone cannot establish recovery when validity is unknown.
    - target_ref: TMP1552-CHILD-COPY
      use:
        paragraphs:
        - zh: 按命令记录、共享关系、版本差异或备份映射登记副本谱系；扫描范围包括历史 commit、受控 clone、协作导出和 history 文件，不能只检查当前文件。对可控记录执行最小读取与保留，对已暴露秘密先轮换或撤销，再协调清理 fork、缓存和备份，记录无法撤回的副本。
          en: Register copy lineage from command records, sharing relationships, version differences, or backup mappings. Scan historical
            commits, controlled clones, collaboration exports, and history files rather than only current files. Apply least reading
            and retention to controlled records, rotate or revoke exposed secrets first, then coordinate fork, cache, and backup cleanup
            and record copies that cannot be retracted.
      expected_effect:
        paragraphs:
        - zh: 攻击者绕过现行供给面从旧记录取得可用秘密的机会缩小；即使未知 clone 继续存在，旧值失效也降低后继风险。记录谱系与读取审计连接后，副本取得不再只依赖原保管库出现新事务才能被解释。
          en: Opportunities to recover usable secrets from old records without the current supply surface decrease. Even when unknown
            clones persist, invalidating old values reduces downstream risk. Linking record lineage and read audit makes copy acquisition
            interpretable without requiring a new original-custodian transaction.
      limitations:
        paragraphs:
        - zh: 组织不能清除他人的全部 clone 或已外传邮件，保留义务也可能禁止删除原始记录。历史过滤依赖版本和命令语义，简单关键词会漏记或误删调查信息；如果攻击者已持有新秘密或控制轮换流程，副本治理不能单独恢复信任。
          en: Organizations cannot erase every external clone or exfiltrated email, and retention duties may prohibit deleting original
            records. History filtering depends on version and command semantics, while simple keywords can miss secrets or remove investigative
            information. Copy governance alone cannot restore trust if the actor holds new secrets or controls rotation.
    evidence_refs:
    - TMP1552-REF-GPP
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-PSREADLINE
    - TMP1552-REF-K8S
    - TMP1552-REF-IMDSV2
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 8
    attack_subtechnique_ids:
    - T1552.001
    - T1552.002
    - T1552.003
    - T1552.004
    - T1552.005
    - T1552.006
    - T1552.007
    - T1552.008
    represented_dimensions:
    - zh: 普通持久工件中的静态值与可逆残留
      en: Static values and reversible residue in ordinary persisted artifacts
    - zh: 交互记录与协作记录形成的次生内容
      en: Secondary content created by interactive and collaborative records
    - zh: 自动交付与配置响应中的接收者边界
      en: Recipient boundaries in automatic delivery and configuration responses
    - zh: 私钥等特定认证材料与读取路径的交叉
      en: Intersections between particular authentication materials and read paths
    breadth_trigger: six-or-more-explicit-coverage-and-second-pass
    coverage_resolutions:
    - attack_id: T1552.001
      name:
        zh: 文件中的凭据
        en: Credentials in Files
      resolution: parent-core
      material_and_path:
        zh: 代码或配置中的完整口令/API秘密由普通文件、版本或下载读取；文件不是材料类型，JWT、Cookie、PKCS12仍须分别解析。
        en: Complete passwords or API secrets in code or configuration are read through ordinary files, versions, or downloads; a file
          is not a material type and JWT cookies or PKCS12 still need separate parsing.
      controlled_variable:
        zh: 选择现行运行配置还是有复制谱系的历史/导出对象；仅选择扩展名不成立匿迹变量。
        en: Select current operational configuration versus a historical or exported object with copy lineage; choosing an extension
          alone is not a stealth variable.
      trace_difference:
        zh: 当前配置留下内容读取；确定为旧版本时痕迹转移到版本/副本面，可能没有对应原服务事务。
        en: Current configuration leaves a content read; confirmed old-version selection moves evidence to a version or copy surface
          without necessarily creating an original-service transaction.
      observation_difference:
        zh: 秘密服务日志无法代替文件结果，仓库clone也不含逐秘密读取；须用内容和版本映射判断。
        en: Secret-service logs cannot replace file outcomes and clone logs lack per-secret reads; content and version mapping are required.
      normal_counterexample:
        zh: 经批准构建读取当前配置、示例配置下载或合规扫描不证明秘密取得或恶意。
        en: Approved builds reading current configuration example downloads and compliance scans do not establish secret acquisition
          or malice.
      defense_difference:
        zh: 文件实际读取审计与受限秘密扫描；若证实副本链再使用历史对象取回分析，不能只扫描当前分支。
        en: Exercised file-read audit and restricted secret scans; confirmed copy chains additionally require historical-object retrieval
          analysis rather than current-branch scans alone.
      evidence_refs:
      - TMP1552-REF-NDSS
      - TMP1552-REF-GH-REMOVE
      - REF-000379
      - REF-000942
      child_condition: TMP1552-CHILD-COPY only when secondary-record lineage and actual secret receipt are established
    - attack_id: T1552.002
      name:
        zh: 注册表中的凭据
        en: Credentials in Registry
      resolution: parent-core
      material_and_path:
        zh: Winlogon DefaultPassword是普通明文值；从LSA secret提取同一用途口令归NJT-0177，不能按注册表路径混合。
        en: Winlogon DefaultPassword is an ordinary plaintext value; extracting an LSA secret belongs to NJT-0177 even for the same
          purpose and must not be merged by registry location.
      controlled_variable:
        zh: 选择普通可读值还是系统秘密边界；这决定父级边界，不构成按容器独立子项。
        en: Select an ordinary readable value versus an OS-secret boundary; this determines parent ownership rather than a carrier-based
          child.
      trace_difference:
        zh: 普通值查询不必产生LSA提取痕迹；4663受SACL约束，Sysmon修改事件不补充查询覆盖。
        en: An ordinary value query need not create LSA-extraction traces; 4663 depends on SACL and Sysmon modifications do not supply
          query coverage.
      observation_difference:
        zh: 只看注册表写入或系统凭据提取会漏过值读取；查询键不证明特定值完整返回。
        en: Watching registry writes or OS credential extraction can miss reads; querying a key does not prove a complete particular
          value was returned.
      normal_counterexample:
        zh: 获批kiosk自动登录与管理员排障可产生相同值查询，需查读者和接收者用途。
        en: Approved kiosk autologon and administrative troubleshooting can produce identical queries and require duty and recipient
          checks.
      defense_difference:
        zh: 移除不必要DefaultPassword，验证Audit Registry与读取SACL，对实际值级结果分级；LSA路径转邻接分析。
        en: Remove unnecessary DefaultPassword values and verify Audit Registry and read SACLs with value-level result grading; route
          LSA paths to neighboring analytics.
      evidence_refs:
      - TMP1552-REF-AUTOLOGON
      - REF-000379
      - REF-000230
      child_condition: No child solely because the carrier is a registry key; an exported key copy requires independent lineage
    - attack_id: T1552.003
      name:
        zh: Shell历史
        en: Shell History
      resolution: niji-variable-candidate
      material_and_path:
        zh: 先前命令参数实际写入的认证秘密经持久历史文件读取；只保存取令牌命令不等于保存运行返回值。
        en: Authentication secrets actually retained from earlier command arguments are read from persisted history; recording a token-fetch
          command is not recording its runtime return.
      controlled_variable:
        zh: 选择可证由先前交互生成的历史记录替代原输入或当前供给面。
        en: Select a record demonstrably generated by earlier interaction instead of the original input or current supply surface.
      trace_difference:
        zh: 当前只需history读取，无需重现原输入或秘密服务请求；仍保留文件与进程证据。
        en: The current action needs only a history read without repeating input or secret-service requests; file and process evidence
          remains.
      observation_difference:
        zh: 原输入传感器不能代替后来副本读取；历史过滤版本决定是否有值，不能从命令字样推定秘密。
        en: Original-input sensors cannot replace later-copy read evidence; filtering versions determine value retention and command
          text alone is insufficient.
      normal_counterexample:
        zh: 用户回看自己的历史、调查员保全记录或仅含安全变量引用的命令均不证明秘密取得。
        en: Personal-history review investigative preservation and commands containing only safe variable references do not establish
          secret acquisition.
      defense_difference:
        zh: 监测历史文件职责外读取、版本验证敏感过滤并保留不含值的审计，不能为保全历史而创建新秘密副本。
        en: Monitor out-of-duty history reads and version-test sensitive filtering with value-free audit rather than creating new secret
          copies for history preservation.
      evidence_refs:
      - TMP1552-REF-PSREADLINE
      - REF-000379
      child_condition: Require actual secret in history and current receipt plus history-format or creating-operation evidence
    - attack_id: T1552.004
      name:
        zh: 私钥
        en: Private Keys
      resolution: adjacent-technique
      material_and_path:
        zh: SSH认证私钥可由普通文件读取；认证证书对应私钥另审NJT-0227，签名/解密专用私钥不能只凭扩展名归凭据。公钥与证书公开部分不是秘密。
        en: SSH authentication private keys may be read from ordinary files; certificate-authentication keys additionally require NJT-0227
          review, and signing-only or decryption-only keys are not credentials by extension. Public keys and public certificate parts
          are not secrets.
      controlled_variable:
        zh: 选择可读原密钥或有谱系的复制工件；材料类型本身不是匿迹变量，强口令加密形成独立恢复门。
        en: Select an original key or a copy with lineage; material class is not itself a stealth variable and strong passphrase encryption
          creates a separate recovery gate.
      trace_difference:
        zh: 文件取得不等于密钥导出、解锁或服务器私钥证明；后续离线候选验证会产生另一阶段行为。
        en: File acquisition differs from key export unlocking or server proof of possession; later offline candidate verification is
          another stage.
      observation_difference:
        zh: 文件名和读取日志看不到完整私钥、口令或认证接受；材料解析与接收者证据必须独立保全。
        en: Filenames and read logs do not show a complete key passphrase or authentication acceptance; material parsing and recipient
          evidence must be preserved separately.
      normal_counterexample:
        zh: 正常SSH客户端读取自有私钥、备份公钥或空口令host key本身均不足认定恶意暴露。
        en: A normal SSH client reading its own key public-key backup or an empty-passphrase host key alone is insufficient to establish
          malicious exposure.
      defense_difference:
        zh: 核对私钥用途与读取ACL，必要时用独立口令/硬件边界，暴露后撤销对应信任；仅复制加密工件保留artifact-only等级，破解归NJT-0137。
        en: Verify key purpose and read ACLs with independent passphrase or hardware boundaries where appropriate; revoke corresponding
          trust after exposure. Copying ciphertext remains artifact-only and cracking belongs to NJT-0137.
      evidence_refs:
      - TMP1552-REF-SSH
      - REF-000625
      child_condition: T1552 ordinary-path coverage may coexist with NJT-0227 material evidence; no private-key-named child
    - attack_id: T1552.005
      name:
        zh: 云实例元数据API
        en: Cloud Instance Metadata API
      resolution: adjacent-technique
      material_and_path:
        zh: AWS角色返回AccessKeyId/SecretAccessKey/Token/Expiration或其他云访问令牌；IMDSv2本地会话token与这些材料不同。正常自动交付先归NJT-0178材料返回面。
        en: AWS role delivery returns AccessKeyId SecretAccessKey Token and Expiration or other cloud access tokens; the local IMDSv2
          session token is distinct. Normal automatic delivery first belongs to NJT-0178's material-return surface.
      controlled_variable:
        zh: 攻击者可操纵中介请求的目标或接收者使本不应获得响应者取得值；只有实证越界才有T1552路径，不能以调用IMDS为准。
        en: An adversary may redirect an intermediary's request target or recipient so an unintended recipient obtains the response;
          only demonstrated crossing establishes a T1552 path, not the IMDS call alone.
      trace_difference:
        zh: 响应可由实例/代理路径流出，常规SDK也有相同本地请求；CloudTrail不保证记录本地IMDS读取。
        en: Responses can leave through instance or proxy paths while normal SDKs issue similar local requests; CloudTrail is not guaranteed
          to record local IMDS reads.
      observation_difference:
        zh: 角色API后继使用不能补证取得路径；需请求控制、实例身份、响应与接收者关系，元数据会话日志也不证明角色密钥已返回。
        en: Later role API use cannot backfill acquisition provenance; request control instance identity response and recipient relationships
          are needed, and session-token evidence does not prove role-key delivery.
      normal_counterexample:
        zh: AWS SDK为附加角色刷新临时凭据是正常功能，即使无需显式AssumeRole也不说明未保护。
        en: SDK refresh of attached-role credentials is normal even without explicit AssumeRole and does not establish unprotected exposure.
      defense_difference:
        zh: IMDSv2、转发/跳数限制和最小工作负载角色约束实际接收边界；已有本机进程控制仍可读取所需值。专用NJS暂不成立，先解决NJT-0178重叠。
        en: IMDSv2 forwarding or hop limits and least workload roles constrain recipient boundaries; a controlled local process may
          still read necessary values. No dedicated child is established before resolving NJT-0178 overlap.
      evidence_refs:
      - TMP1552-REF-IMDS
      - TMP1552-REF-IMDSV2
      - REF-000719
      - REF-000524
      child_condition: Parent path only with inappropriate recipient disclosure; automatic-return child deferred as overlapping and
        insufficiently generalized
    - attack_id: T1552.006
      name:
        zh: 组策略首选项
        en: Group Policy Preferences
      resolution: parent-core
      material_and_path:
        zh: SYSVOL中旧XML的cpassword可用公开固定AES密钥恢复口令；这是普通配置共享与公开可逆保护，不是SAM/LSA提取或独立保管库解锁。
        en: Legacy cpassword in SYSVOL XML can be recovered with a public fixed AES key; this is ordinary configuration sharing with
          publicly reversible protection rather than SAM or LSA extraction or independent vault unlocking.
      controlled_variable:
        zh: 选择已有弱保护分发工件及对应恢复路径；读取现行策略本身不证明有次生副本角色。
        en: Select an existing weakly protected distribution artifact and its recovery path; reading current policy does not itself
          establish a secondary-copy role.
      trace_difference:
        zh: 攻击者只需普通共享读取及本地恢复，不必向秘密权威请求导出；恢复步骤未必在域服务端有事件。
        en: Ordinary share reads and local recovery avoid requesting export from a secret authority; recovery need not create a domain-server
          event.
      observation_difference:
        zh: 正常GPP客户端也周期读取SYSVOL，只有共享访问并不能识别具体恢复口令；需内容、读者与结果检查。
        en: Normal GPP clients periodically read SYSVOL so share access alone cannot identify particular recovered passwords; content
          reader and outcome checks are needed.
      normal_counterexample:
        zh: 正常域计算机更新策略或管理员执行Enum-SettingsWithCpassword是合法维护，不能直接判作窃取。
        en: Normal domain-computer policy refresh and administrative Enum-SettingsWithCpassword are legitimate maintenance rather than
          automatic theft findings.
      defense_difference:
        zh: 删除旧含口令策略、轮换涉及账户并监测职责外读取；只安装MS14-025不清除现存值。无需为公开常量恢复新建按产品子项。
        en: Remove old password-bearing policies rotate affected accounts and monitor out-of-duty reads; installing MS14-025 alone does
          not remove existing values. Public-constant recovery does not justify a product child.
      evidence_refs:
      - TMP1552-REF-GPP
      - REF-000379
      child_condition: Archived GPP backup needs separate copy-lineage evidence; active SYSVOL policy remains parent-core
    - attack_id: T1552.007
      name:
        zh: 容器API
        en: Container API
      resolution: parent-core
      material_and_path:
        zh: Docker inspect Config.Env或普通Pod/ConfigMap可返回实际明文值；secretKeyRef不是值，受授权Secret API读取先审NJT-0147，返回的应用token另审NJT-0178。
        en: Docker inspect Config.Env and ordinary Pod or ConfigMap content can return actual plaintext values; secretKeyRef is not
          the value, authorized Secret API reads first require NJT-0147 review, and returned application tokens additionally require
          NJT-0178.
      controlled_variable:
        zh: 选择读取普通配置的响应面而非专用秘密面，或选择已有导出清单；资源/API名称不构成变量。
        en: Select ordinary configuration responses rather than dedicated secret custody, or select an existing exported manifest; resource
          or API names are not the variable.
      trace_difference:
        zh: API只读成功可能在工作负载审计留下get/list与对象，内容依审计级别可见；进程环境本地读取与API响应是不同路径。
        en: Successful reads may leave get or list and object evidence in workload audit with content depending on level; local environment
          reads and API responses are different paths.
      observation_difference:
        zh: Metadata没有响应正文，list权限范围不等于所有对象实际返回；需版本与返回集合核对，不能从200推出秘密。
        en: Metadata lacks response content and list authority is not proof every object was returned; versions and returned sets require
          reconciliation rather than inferring secrets from status 200.
      normal_counterexample:
        zh: 受权控制器读取Secret、kubectl排障和只有引用的Pod读取是正常情况。
        en: Authorized controllers reading Secrets kubectl troubleshooting and reading reference-only Pods are normal cases.
      defense_difference:
        zh: 把普通配置中的值改为受治理引用，收窄get/list范围，验证API审计与受控响应证据；不要把完整秘密正文复制进普通SIEM。
        en: Replace ordinary configuration values with governed references narrow get or list scope and verify audit plus protected
          response evidence; avoid copying secret bodies into an ordinary SIEM.
      evidence_refs:
      - REF-000822
      - REF-000211
      - TMP1552-REF-K8S
      child_condition: Exported manifest can enter the copy child only when its prior creation and secret content are established
    - attack_id: T1552.008
      name:
        zh: 聊天消息
        en: Chat Messages
      resolution: niji-variable-candidate
      material_and_path:
        zh: 先前共享秘密的消息或导出可经内容搜索返回完整值；Slack search.messages需要相应用户scope与可见内容，不是匿名读取，也不能从查询命中数推断秘密。
        en: Messages or exports containing previously shared secrets can return complete values through content search; Slack search.messages
          needs an appropriate user scope and visible content rather than anonymous access, and hit counts do not prove secrets.
      controlled_variable:
        zh: 选择可证先前共享的通信记录作为来源，控制查询只是定位手段；没有共享/记录角色证据留父级。
        en: Select demonstrably previously shared communication as the source; query control merely locates it and absent record-role
          evidence remains parent-level.
      trace_difference:
        zh: 当前读取在协作面，不必访问原秘密供给面；内容事件与导出粒度依服务许可/配置而变。
        en: Current reading occurs on the collaboration surface without necessarily accessing original secret supply; event and export
          granularity depend on service plan and configuration.
      observation_difference:
        zh: 搜索调用、批次邮箱访问或会话审计不能替代具体消息内容进入控制的证明，既有账号正常外观也非独立伪装结论。
        en: Search calls batch mailbox access and session audit cannot replace evidence of particular message content entering control;
          ordinary account appearance is not an independent disguise conclusion.
      normal_counterexample:
        zh: 支持工单秘密修复搜索、合规导出或不含秘密的链接搜索是正常活动。
        en: Support remediation searches compliance exports and searches for nonsecret links are normal activity.
      defense_difference:
        zh: 治理消息秘密分享和导出保留，先使暴露值失效；内容级确认依受限证据不假设平台总有逐项读取日志。
        en: Govern sharing and export retention and invalidate exposed values first; content confirmation needs restricted evidence
          without assuming universal item-read logs.
      evidence_refs:
      - TMP1552-REF-SLACK
      - TMP1552-REF-MSRC
      child_condition: MSRC case establishes shared email record use; not a Slack case or proof of a specific secret class
    candidate_stealth_axes_examined:
    - key: TMP1552-AXIS-STATIC
      variable:
        zh: 选择既存普通残留而非受保护保管边界
        en: Select existing ordinary residue instead of a protected custodian boundary
      resolution: parent-core
      failed_or_passed_gates:
        zh: 可控、痕迹差与防御差成立，但覆盖父定义本身；独立分项没有兄弟排他边界，失败于非父级核心门。
        en: Control trace and defense differences pass but restate the parent definition; no independent sibling boundary exists so
          the non-parent-core gate fails.
    - key: TMP1552-AXIS-COPY
      variable:
        zh: 选择可核对先前交互/共享/复制产生的次生记录
        en: Select a verifiable record produced by earlier interaction sharing or copying
      resolution: formal
      resulting_child_ref: TMP1552-CHILD-COPY
      failed_or_passed_gates:
        zh: 可控记录选择、与当前供给配置的来源门、原供给面无对应新事务的条件性观察差异、独立历史/协作/版本审计及清理控制均成立。微软事件和平台语义提供中等置信度支持，来源不明旧文件排除。
        en: Controlled record selection a source-role gate against current supply conditional absence of a new supply transaction and
          distinct historical collaborative version audit and cleanup controls pass. Microsoft incident and platform semantics support
          medium confidence while old files of unknown provenance are excluded.
    - key: TMP1552-AXIS-AUTODELIVERY
      variable:
        zh: 将受信自动交付响应转向不当接收者
        en: Redirect trusted automatic-delivery responses to an inappropriate recipient
      resolution: deferred
      failed_or_passed_gates:
        zh: AWS平台证据支持接收边界与缓解差异，但正常角色交付不属于未保护；真正越界通常还需SSRF/代理能力，返回应用材料已被NJT-0178覆盖。未找到足够独立、跨接口的窄结论证明其作为本父NJS比邻接对象更稳定，失败于兄弟归属与泛化证据门。
        en: AWS platform evidence supports recipient boundaries and mitigation differences but normal role delivery is not unprotected.
          Crossing generally needs SSRF or proxy capability and returned application material already falls under NJT-0178. Insufficient
          independent cross-interface conclusion-level support exists for a stable child under this parent so ownership and generalization
          gates fail.
    - key: TMP1552-AXIS-BUSINESS
      variable:
        zh: 借用正常权限或业务读取外观
        en: Borrow normal authority or business-read appearance
      resolution: parent-core
      failed_or_passed_gates:
        zh: 普通账号或工具常是先决条件；未证明攻击者额外选择、构造或挟持具体批准作业来改变痕迹。只观察API允许/业务名称不能建立意图，失败于独立可控变量、因果证据和检测差异门。
        en: An ordinary account or tool is often a prerequisite. No independent manipulation of an approved job is established to change
          traces. API allowance and a business name cannot establish intention so independent control causal evidence and detection-difference
          gates fail.
    - key: TMP1552-AXIS-REVERSIBLE
      variable:
        zh: 选择明文/编码/公开常量可逆表示
        en: Select plaintext encoding or public-constant reversible representation
      resolution: parent-core
      failed_or_passed_gates:
        zh: 表示与恢复步骤影响内容检查，但GPP公开密钥不是秘密隔离；攻击者选择脆弱材料不等于改变记录观察变量。未证明稳定独立子项边界，不能由一个产品补出数据遮蔽机理。
        en: Representation and recovery affect content checks but a public GPP key is not secret isolation. Choosing weak material is
          not a changed record-observation variable and lacks a stable independent child boundary; one product cannot establish data
          obscuration.
    - key: TMP1552-AXIS-MATERIAL
      variable:
        zh: 按口令/私钥/token/cookie/票据划分
        en: Partition by password private key token cookie or ticket
      resolution: adjacent
      failed_or_passed_gates:
        zh: 具有重要材料与响应差异但不属于匿迹变量；已有材料父技术拥有其结果。只在普通不当读取路径得到独立证据时并列，失败于原生匿迹划分门。
        en: Material and response differences matter but are not stealth variables and existing parents own the outcomes. Co-record
          only with independent inappropriate ordinary-read evidence so the native-stealth partition gate fails.
    - key: TMP1552-AXIS-TIME
      variable:
        zh: 降低检索频率或分散多账户读取
        en: Reduce query rate or distribute reads across accounts
      resolution: evidence-deferred
      failed_or_passed_gates:
        zh: 工程上可能改变关联但当前来源不证明用于本候选的真实实现或防御观察效果；记录很旧不等于攻击者稀释取得时间。失败于结论级证据门，不登记NM-ST。
        en: Could change correlation in principle but current sources do not establish an implementation or observation effect for this
          candidate. Old records do not mean the actor diluted acquisition over time. Conclusion-level evidence fails and NM-ST is not
          assigned.
    second_pass_required: true
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 八个ATT&CK子项主要按承载面、平台与材料分组；这些差异分别进入三种具体NJA和缓解应用。去名后，静态残留重述父核心，材料类型归邻接，自动交付只有越界时才纳入且其独立子项归属未解决，业务外观/表示/频率没有独立充分证据。仅次生记录角色同时通过可控性、来源边界、条件性痕迹差和防御差门；一个子项并不声称覆盖全部八类变体，未分项行为仍由父级覆盖。
      en: The eight ATT&CK children primarily partition carriers platforms and material. Their differences inform three concrete analytics
        and mitigation applications. After removing labels static residue restates the parent material classes are adjacent automatic
        delivery enters only with crossing and has unresolved child ownership and business appearance representation and frequency lack
        independent support. Only secondary-record role passes control provenance conditional trace and defense gates. One child does
        not claim to partition every variant; unpartitioned behavior remains parent-covered.
    primary_review_recorded: false
    detail_artifact: taxonomy-coverage.yaml
  evidence_coverage:
    parent_behavior_keys:
    - TMP1552-CLM-RELEVANCE
    boundary_keys:
    - TMP1552-CLM-PROOF
    - TMP1552-CLM-BOUNDARY
    mechanism_support:
    - subject_ref: TMP1552-PARENT
      claim_key: TMP1552-CLM-MECHANISM
      mechanism_ref: NM-BT
      mode: conditional inference with medium confidence
    - subject_ref: TMP1552-CHILD-COPY
      claim_key: TMP1552-CLM-MECHANISM
      mechanism_ref: NM-BT
      mode: conditional inference; no measured evasion claim
    child_existence_support:
    - subject_ref: TMP1552-CHILD-COPY
      claim_key: TMP1552-CLM-COPY
      case_key: TMP1552-CASE-MSRC
      constraint: Verifiable secondary-record role and current receipt; no claim that every old artifact is a copy
    unsupported_or_deferred:
    - Automatic-delivery child independent of NJT-0178
    - Business-appearance child without independently controlled job context
    - NM-ST from record age or low query count
    - Slack incident attribution
    - Per-secret validity or particular secret format in Microsoft email case
    - Generic registry read from Sysmon modifications
    - Plaintext control inferred from encrypted PFX or private-key file copy
    boundary_artifact: boundary-review.yaml
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已读实际NJT-0001父子对象。父子定义、匿迹和范围各至少两段，分别解释完成点、条件性观察、纳入排除和正常反例；场景与攻防模型独立，限制区分平台能力、案例、路径与有效性。三项NJA使用不同实际来源与结果等级，不靠统一模板或字数达标；形式结构检查不能替代主审。
      en: Read actual NJT-0001 parent and child. Definitions stealth and scope each have at least two paragraphs addressing completion
        conditional observation inclusion exclusion and normal counterexamples. Scenarios threat models and limitations independently
        distinguish capability case path and validity. Three analytics use different actual sources and result grades rather than word-count
        or template completion; structural checking does not replace primary review.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML serialization of manually authored objects
    - Native-to-normalized analytic field mapping
    - Contract shape validation allowing only TMP1552 identity patterns
    - Reference closure and handoff assembly from the manual canonical proposal
  limitations:
    paragraphs:
    - zh: 原始平台材料主要证明可读面、保护条件和日志语义；它们不证明所有读者都是攻击者。NDSS 研究的秘密检测与验证不能转化为全部样本可登录的保证，微软邮件披露也没有列出逐项材料与搜索路径。对普通配置或接口没有结论级恶意使用证据的变体，父行为与条件性机理可成立，具体案例保持空缺。
      en: Original platform sources primarily establish readable surfaces, protection conditions, and log semantics, not malicious intent
        of every reader. NDSS secret detection and validation does not guarantee that every sample enables sign-in, and Microsoft's
        email disclosure does not enumerate individual materials or search paths. Variants without conclusion-level evidence of malicious
        use can support parent behavior and a conditional mechanism while leaving specific cases absent.
    - zh: 次生副本的一个正式子项需要主审确认记录角色和遥测差异足够稳定。历史日期、备份后缀、Git 承载或未出现保管库事件都不能单独证明该角色；若复制谱系不可核对，应保留父级。提案的检测窗口与基线是可验证工程起点，尚未在目标环境测量准确率；正式身份、共享库扩展及双语
        Web 门禁仍由主流程完成。
      en: The single formal secondary-copy child requires primary confirmation that its record role and telemetry distinction are stable.
        Age, a backup suffix, Git hosting, or absent vault events alone cannot establish that role; unverifiable lineage remains parent-level.
        Analytic windows and baselines are testable engineering starting points without measured accuracy in the target environment.
        Canonical identity, shared-library extensions, and bilingual Web gates remain primary integration work.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    zh: base64或公开常量可逆保护不是攻击者改变数据可检查性的独立因果证据；强加密私钥文件也不证明取得明文秘密。
    en: Base64 or public-constant reversal does not independently establish adversary-controlled data inspectability and strongly encrypted
      keys do not establish plaintext acquisition.
  - mechanism_ref: NM-FD
    zh: 正常用户、脚本名和API成功只是背景，没有独立构造或挟持业务语境的证据。
    en: Ordinary users script names and API success are context without independent construction or hijacking of business context.
  - mechanism_ref: NM-ST
    zh: 记录生成很早不说明攻击者将当前取得稀释到更长时间或多个来源。
    en: Old record creation does not establish dilution of current acquisition across time or sources.
  open_questions:
  - zh: 主审确认8→1广度差与次生记录角色可判定性；来源不明文件留父级。
    en: Primary review must confirm the eight-to-one gap and determinable secondary-record role; unknown-provenance files remain parent-level.
  - zh: 与T1558和T1539完整交接统一材料结果和读取路径；IMDS/OAuth返回首先核对NJT-0178，受管理Secret首先核对NJT-0147。
    en: Converge material results and read paths with full T1558 and T1539 handoffs; check IMDS/OAuth returns first against NJT-0178
      and managed Secrets against NJT-0147.
  - zh: 共享对象需主流程最终目录查重；建议新建而非泛化NJA-000338或MIT-000224。现有REF可复用但记录本次精确locator。
    en: Primary catalog duplicate resolution remains required; propose new objects rather than generalizing NJA-000338 or MIT-000224
      and record precise new usage locators for reused references.
  - zh: 所有正式ID、双向对象写入、quality、Bundle、Web和人工领域review均未在研究代理阶段执行。
    en: Canonical allocation bidirectional writes quality bundle Web and human domain review have not been performed in the research
      stage.
  admission_comparison:
  - decision: retain
    result: rejected
    zh: 原名未加保护容易把产品/API清单直接当范围，需明确秘密材料取得、接收者失配与相邻保管边界，因此不用原语义不加限定地保留。
    en: Unqualified retention risks treating product or API inventories as scope; explicit acquisition recipient-mismatch and custody
      boundaries require adaptation.
  - decision: adapt
    result: recommended
    zh: 保留从不适当可读面取得既有认证秘密的父行为，限制完成点与材料/路径的并列证据，次生记录另有稳定观察差异。
    en: Preserve acquisition of existing authentication secrets from inappropriate readable surfaces with a bounded completion point
      and independent material/path evidence; secondary records have a stable observation distinction.
  - decision: exclude
    result: rejected
    zh: 公开常量可恢复GPP、原始泄露研究和受害方邮件秘密披露支持父行为，不能因相邻令牌或保管库范围存在就排除整个候选。
    en: Recoverable GPP original leakage research and first-party email-secret disclosure support the parent; neighboring token and
      vault scopes do not justify excluding the entire candidate.
  source_verification:
    new_reference_count: 12
    primary_sources_only: true
    dates: Publication dates where stated; update dates explicitly labeled; unknown dates null
    docker_openapi: Fetched official v1.40 YAML and verified ContainerInspect /containers/{id}/json 200 plus ContainerConfig.properties.Env
      VAR=value; existing REF-000822 reused
    negative_case_decisions:
    - Do not use Uber shared-script reporting without matching first-party confirmation
    - Do not infer a precise Capital One metadata acquisition chain from a general firewall account
    - Do not convert NDSS secret-quality validation into exhaustive authenticated login success
    - Do not fabricate a dated GPP incident from aggregate vendor observation
    citation_details: canonical-proposal.yaml references include canonical URL author publisher date exact locator and proof limits
