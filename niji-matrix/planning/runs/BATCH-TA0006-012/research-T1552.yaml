handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0006-012
work_item_ref: WORK-TA0006-T1552
temporary_key_prefix: TMP1552-
candidate:
  source_type: attack
  source_attack_id: T1552
  name:
    zh: 未加保护的凭据
    en: Unsecured Credentials
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: 以未保护的认证秘密取得保留该候选，强调攻击者实际读取或恢复处于不适当可读面上的秘密，而不是把任何配置、API、保管库或下载行为一律称为凭据窃取。公开研究、微软对 GPP 的原始分析及邮件入侵披露分别支持散落秘密、公开常量可逆保护和协作副本路径；其匿迹价值在于读取可能发生于凭据专用审计之外。准入不要求秘密已被接受或仍然有效，也不把低权限、正常
        API 或旧副本本身当作恶意意图证据。
      en: Adapt the candidate as Unprotected Authentication Secret Acquisition, requiring actual reading or recovery of secrets exposed
        through an inappropriate readable surface rather than labeling every configuration, API, vault, or download as credential theft.
        Original research, Microsoft's original GPP analysis, and its email-intrusion disclosure support loose secrets, protection reversible
        with a public constant, and collaboration copies respectively. The stealth value is retrieval outside credential-specific audit.
        Admission does not require acceptance or continuing validity, and low privilege, ordinary APIs, or old copies alone do not establish
        malicious intent.
proposed_content:
  summary:
    zh: 从不适当可读的工件、次生记录或披露接口取得认证秘密，使取得行为可能落在凭据专用保管与审计之外。
    en: Acquire authentication secrets from inappropriately readable artifacts, secondary records, or disclosure interfaces, potentially
      placing retrieval outside credential-specific custody and audit.
  definition_and_concept:
    paragraphs:
    - zh: 未保护的认证秘密取得是攻击者从普通内容面取得口令、认证私钥或等价秘密的行为；该内容面把秘密以明文、可直接解码形式或不具有效秘密隔离的可逆形式暴露给不符合组织批准用途的读取者。它包括配置中的口令、交互历史中的参数、协作消息中的共享秘密，以及实际返回这些值的配置接口。这里的未保护是秘密与读者边界失配，不要求对象对全世界公开；需要普通文件权限或一个有效账户仍可能存在这种失配。
      en: Unprotected Authentication Secret Acquisition obtains passwords, authentication private keys, or equivalent secrets from an
        ordinary content surface that exposes them in plaintext, directly decodable form, or a reversible form without effective secret
        isolation to a reader inconsistent with organizational purpose. Examples include passwords in configuration, arguments retained
        in interactive history, secrets shared in collaboration messages, and configuration interfaces actually returning such values.
        Unprotected means a mismatch between secret sensitivity and the reader boundary, not universal public access; ordinary file
        permissions or an authenticated account can coexist with that mismatch.
    - zh: 完成点是具体秘密值或秘密材料进入攻击者可读、可保留的控制面。路径枚举、文件扩展名、配置下载成功和关键词命中只证明候选承载面；掩码、示例值或只有公钥的证书不证明秘密取得。秘密取得、受口令保护私钥的解锁、身份接受和资源访问分别判断，已过期或撤销材料也不能凭一次后继失败抹去已经发生的复制。
      en: Completion requires a concrete secret value or secret material to enter an adversary-readable or retainable control surface.
        Path enumeration, extensions, successful configuration downloads, and keyword matches identify possible carriers only; masks,
        examples, and public-key-only certificates do not establish secret acquisition. Acquisition, unlocking a passphrase-protected
        private key, identity acceptance, and resource access are separate judgments. Expiry or revocation and a subsequent failure
        do not undo an observed copy.
  stealth_characteristics:
    paragraphs:
    - zh: 这种取得可以只留下文件或注册表读取、仓库取回、消息检索和配置响应，而不产生口令导出、保管库解锁或认证失败事件。攻击者主动选择一个已经含秘密的普通内容面，减少与秘密权威服务交互的需求；原保管面没有新事件并不意味着整个组织没有读取痕迹。微软 GPP
        文档直接说明认证用户可读取含可恢复口令的 SYSVOL 文件，平台文档则说明历史和副本会保留敏感内容。
      en: Retrieval may leave only file or registry reads, repository transfers, message searches, and configuration responses without
        password export, vault unlock, or authentication-failure events. Selecting an ordinary surface that already contains a secret
        reduces the need to interact with its authority. No new event at the original custodian does not imply no read evidence elsewhere.
        Microsoft's GPP documentation directly establishes authenticated access to recoverable SYSVOL passwords, while platform documentation
        establishes sensitive content retained in history and copies.
    - zh: 匿迹结论依赖观察条件。未配置对象访问审计的主机、只监测秘密服务的 SOC 或只保留仓库级事件的服务可能无法识别具体秘密流出；已部署读审计、源版本清单和受控内容检查时，这些读取仍可暴露。普通业务表象只是需要解释的背景，不能从一次合法工具调用直接推断特征伪装；本对象也不声称低频、无告警或无法检测。
      en: The stealth conclusion depends on observation conditions. A host without object-read audit, a SOC monitoring only secret services,
        or a service retaining repository-level events may fail to identify the concrete disclosure. Read audit, source-version inventories,
        and controlled content inspection can expose it. Ordinary business appearance is context requiring explanation, not sufficient
        proof of feature disguise from one legitimate tool invocation. This object makes no claim of low rate, alert-free execution,
        or undetectability.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入普通配置、默认口令值、交互与协作记录、可读秘密清单及确实越过预期接收者边界的内容披露。GPP 使用公开固定 AES 密钥的可逆保护不构成独立秘密保管边界；有口令的私钥文件被复制时仅登记加密工件取得，解锁前不称为明文私钥取得或可用密钥控制。正常备份、排障、构建与获批秘密扫描会产生相似读取，需验证读者职责、数据分类、作业范围和实际接收者。
      en: Include ordinary configuration, default-password values, interactive or collaborative records, readable secret manifests,
        and content disclosure demonstrably crossing the intended recipient boundary. GPP encryption with a public fixed AES key is
        not an independent secret-custody boundary. Copying a passphrase-protected key is graded only as encrypted-artifact acquisition;
        before unlocking, it is not plaintext-key acquisition or usable key control. Legitimate backup, troubleshooting, builds, and
        approved secret scanning produce similar reads and require checks of reader duty, classification, job scope, and actual recipient.
    - zh: NJT-0147 拥有受管理保管库或解锁边界读取，NJT-0177 拥有 SAM、NTDS、LSA 等 OS 认证材料提取；即使底层都是文件或注册表也不改归本对象。正常 Secrets Manager GetSecretValue 与受授权的
        Kubernetes Secret 读取不是本对象的充分证据；其保管边界应先按 NJT-0147 审查。相反，从导出的普通清单、明文 Pod 配置或日志副本中取回已暴露值，可以独立证明本读取路径。
      en: NJT-0147 owns managed-custody or unlock-boundary retrieval, and NJT-0177 owns extraction of OS authentication material such
        as SAM, NTDS, or LSA secrets, even when implemented as files or registry data. Ordinary Secrets Manager GetSecretValue and authorized
        Kubernetes Secret reads are insufficient evidence here and first require review under NJT-0147. Retrieval from an exported ordinary
        manifest, plaintext Pod configuration, or log copy can independently establish this path.
    - zh: 应用令牌、认证证书私钥、Web Cookie 与 Kerberos 票据有各自材料语义，分别对照 NJT-0178、NJT-0227、T1539 和 T1558。同一证据可以支持秘密暴露路径和特定材料取得，但只有文件名或后继登录不能支持双重标注。输入截获归
        NJT-0169，候选反复离线验证归 NJT-0137，材料呈现与身份接受分别属于 T1550 和 NJT-0061；元数据返回正常工作负载凭据不自动说明任何未保护边界已经被跨越。
      en: Application tokens, authentication-certificate keys, Web cookies, and Kerberos tickets have distinct material semantics reviewed
        under NJT-0178, NJT-0227, T1539, and T1558. The same evidence can establish an exposure path and material acquisition, but filenames
        or later sign-ins cannot support both. Input interception belongs to NJT-0169, repeated offline candidate verification to NJT-0137,
        and material presentation and identity acceptance to T1550 and NJT-0061. Normal delivery of workload credentials by metadata
        does not itself establish an unprotected boundary crossing.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在开发、部署和管理环境中，口令可能留在运行配置、自动登录值或旧 GPP XML。攻击者已有普通用户、服务或共享读取能力时，可以在不请求认证服务导出的情况下读取秘密。认证用途和内容须由配置结构、受限证据检查或密钥解析确认，不能因目录常见而省略材料判断。
        en: Development, deployment, and administration environments may retain passwords in active configuration, autologon values,
          or legacy GPP XML. An adversary with ordinary user, service, or share access can read them without asking an authentication
          service to export secrets. Configuration structure, restricted evidence inspection, or key parsing must establish authentication
          purpose and content; a familiar directory is insufficient.
      - zh: 历史与协作环境还可形成不同于运行配置的次生取得路径。微软在 2024 年披露攻击者从外传邮件中发现不同秘密并尝试使用，其中一部分曾由客户与微软通过邮件共享。该事件支持协作记录中的秘密再取得，不说明每一种秘密的格式、有效性、具体搜索命令或原保管库状态。
        en: History and collaboration can create secondary acquisition paths distinct from active configuration. Microsoft's 2024 disclosure
          describes an actor finding and attempting to use different secrets in exfiltrated email, some previously shared between customers
          and Microsoft. It supports recovery from collaboration records without identifying every secret's format, validity, search
          command, or original vault state.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要能读取至少一个具体承载面，或控制能把含秘密响应交给自己的请求。所需权限由该承载面的 ACL、共享范围、应用 scope 或接口访问约束决定，既不统一要求管理员，也不假定匿名可达。攻击者可选择读取现行配置、历史记录或旧版本，但不能只凭这种选择假定已取得有效身份；不含完整值的响应、受独立口令保护的密钥和接收者绑定都会限制结果。
          en: The adversary needs read access to a concrete carrier or control of a request returning secret-bearing content to a controlled
            recipient. Its ACL, sharing scope, application scope, or interface policy determines required authority; neither administrator
            access nor anonymous reachability is assumed. The adversary can choose current configuration, history, or an earlier version,
            but that choice alone does not establish a usable identity. Incomplete responses, independent key passphrases, and recipient
            binding limit results.
      defender_model:
        paragraphs:
        - zh: 防守方可能拥有对象审计、进程与登录事件、仓库和 Kubernetes API 日志，以及受限的秘密暴露扫描结果。Windows 4663 在相应 SACL 和审计策略生效时可记录实际使用的读取权、对象和进程；Sysmon 注册表修改事件不提供等价读取覆盖。仓库
            clone 事件不枚举秘密文件，Kubernetes Metadata 级别不含响应正文，因此都需要承载面清单与结果分级。
          en: Defenders may have object audit, process and logon events, repository and Kubernetes API logs, and restricted exposure-scanner
            findings. With the required SACL and audit policy, Windows 4663 records exercised read rights, objects, and processes; Sysmon
            registry-modification events do not provide equivalent read coverage. Repository clone events do not enumerate secret files,
            and Kubernetes Metadata audit omits response bodies, requiring carrier inventories and graded outcomes.
        - zh: 关键盲区是原秘密保管面与普通内容面不共享对象身份、版本和读者关系，或读取发生于无传感器的本地副本。授权作业和攻击者可能使用相同身份，因此观察模型还要保留批准范围、接收进程和数据去向。若日志只证明访问或对象下载，防守方应保留候选状态，不把未见后继使用解释成没有暴露。
          en: A critical gap occurs when the original custodian and ordinary content surface do not share object identity, version,
            and reader relationships, or reading occurs in an uninstrumented local copy. Approved work and adversary activity can use
            the same identity, so visibility also needs approved scope, recipient process, and destination. If logs establish only access
            or an object download, retain a candidate outcome; absence of later use does not establish absence of exposure.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 选择已含秘密的普通读取面使取得可能落在凭据专用审计之外
      en: Select an ordinary secret-bearing read surface outside credential-specific audit
    analysis:
      paragraphs:
      - zh: 攻击者直接读取可恢复口令或秘密副本，使本应被秘密服务审计描述的取得变为一般内容读取。痕迹转移到对象、版本、消息或工作负载接口；若防守方只看解锁、导出或认证失败，就缺少识别此次秘密取得的事件语义。GPP、历史文件和协作邮件证据支持这些读取面存在；由其推导的条件性审计缺口为中等置信度，不等于来源测量了规避率。
        en: Reading a recoverable password or secret copy turns acquisition that secret-service audit might describe into a general
          content read. Evidence moves to an object, version, message, or workload interface. A defender observing only unlocks, exports,
          or authentication failures lacks the semantics to identify this acquisition. GPP, history-file, and collaboration-email evidence
          establishes those surfaces; the conditional audit gap inferred from them has medium confidence and is not a measured evasion
          rate.
    evidence_refs:
    - TMP1552-REF-GPP
    - TMP1552-REF-PSREADLINE
    - TMP1552-REF-MSRC
    - REF-000379
    - REF-000211
    confidence: medium
proposed_subtechniques:
- schema_version: 2.0.0
  type: evasion-subtechnique
  id: TMP1552-CHILD-COPY
  parent_ref: TMP1552-PARENT
  name:
    zh: 次生副本秘密取回
    en: Secondary-Copy Secret Retrieval
  summary:
    zh: 选择由先前操作、沟通或复制形成的秘密记录取得材料，使当前读取脱离原秘密供给面的事务。
    en: Retrieve secrets from records produced by earlier operations, communication, or copying, separating the current read from the
      original secret-supply transaction.
  aliases: []
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 次生副本秘密取回以攻击者选择记录角色为变量：从历史、沟通或复制产物中取得已存在的认证秘密，而不是访问当前承担秘密供给职责的运行配置或保管库。须能证明记录形成于某次先前交互或复制，例如历史条目的命令来源、邮件中的共享关系、父提交与删除提交的对应差异，或原对象与备份版本的内容映射。
      en: Secondary-Copy Secret Retrieval uses the selected record role as its variable. It obtains an existing authentication secret
        from history, communication, or copy output rather than the operational configuration or vault currently serving secrets. Evidence
        must link the record to an earlier interaction or copy, such as a history entry's command origin, a sharing relationship in
        email, a parent-to-removal commit difference, or content mapping between an original and a backup version.
    - zh: 当前读取可以在原操作结束、现行文件被修正或共享会话结束后发生；取得不要求原秘密服务再提供一次响应。副本中的值仍须实际进入攻击者控制，且有效性独立判断。一个文件由软件生成、位于 Git 或名为 backup 并不够，因为所有运行配置也有生成过程，不能因此把父技术所有秘密都改称副本。
      en: 'The current read can occur after the original operation, correction of the current file, or end of a sharing session, without
        a new response from the original secret service. The copied value must still enter adversary control and its validity is assessed
        separately. Software generation, Git storage, or a backup filename alone is insufficient: all operational configurations have
        origins, so those properties cannot turn every parent secret into a secondary copy.'
  stealth_characteristics:
    paragraphs:
    - zh: 次生副本秘密取回把可见取得从原秘密供给面移至记录保管面。当前可见的是 history 文件读取、邮件或消息内容返回、旧 commit 或备份对象取回，原凭据服务可能没有对应新事务。防守方如果按现行配置与保管库日志判断秘密是否外流，就可能遗漏这个来源；需要沿记录身份和形成链解释读取。
      en: Secondary-Copy Secret Retrieval moves visible acquisition from the original secret-supply surface to the record custodian.
        Current evidence consists of history-file reads, returned mail or message content, or retrieval of an old commit or backup object;
        the credential service may have no corresponding new transaction. Defenders judging exposure only from current configuration
        and vault logs can miss this source and need record identity and creation lineage to interpret the read.
    - zh: 版本、消息、命令和对象痕迹仍然存在。原文件删除并不撤回 clone、fork 或历史引用，秘密撤销则可以降低其后继使用价值；两者控制对象不同。平台能力与微软邮件事件支持这种路径，但并未证明攻击者在该事件中选择旧版本、压低频率或绕过某一具体告警，所以不附加时空释痕或特征伪装机理。
      en: Version, message, command, and object evidence remains. Deleting the original does not retract clones, forks, or historical
        references, whereas revocation can reduce the secret's subsequent value; the controls act on different objects. Platform capabilities
        and Microsoft's email incident support this path but do not establish old-version selection, rate reduction, or bypass of a
        specific alert in that incident. Spatiotemporal dilution and feature disguise are therefore not added.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入必须同时具备秘密内容、可判定的次生记录角色和当前取得结果。真实命令历史保留先前传入的口令、共享邮件包含先前发送的秘密，以及能够映射到已修改原件的旧版本，都是可审查实例。原对象不可访问不是必要条件；决定因素是攻击者实际选择并取得了次生记录，而不是从没有观察到原对象读取反推使用副本。
      en: Inclusion requires secret content, an identifiable secondary-record role, and a current acquisition outcome. Genuine history
        retaining a previously supplied password, shared mail containing a previously sent secret, and an old version mapped to a modified
        original are reviewable examples. The original need not be inaccessible. The decisive fact is actual selection and acquisition
        of the secondary record, not an inference from absent original-read evidence.
    - zh: 当前应用唯一读取的配置、无法核对复制来源的旧文件、正常回看自己的历史和获批备份恢复不自动属于本子项。直接读取 SAM 或 NTDS 副本依旧归 NJT-0177 的不活动视图，不因有副本角色就迁入本对象；受管理保管库备份若仍维持独立解锁边界，应先审查
        NJT-0147。协作导出的令牌、Cookie 和证书私钥还必须分别证明材料类型。
      en: The configuration currently used as an application's sole supply, an old file without verifiable copy provenance, normal personal-history
        review, and approved restore work do not automatically qualify. SAM or NTDS copies remain NJT-0177 inactive-store views rather
        than moving here because they are copies. Vault backups retaining an independent unlock boundary first require NJT-0147 review.
        Tokens, cookies, and certificate keys in collaboration exports additionally require evidence of their material types.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 运维人员在终端参数中输入口令后，历史机制可留下持久记录；攻击者读取该记录时不必截获原输入。同样，修正仓库当前分支仍可能留下历史引用与外部 clone，攻击者可以取回相应历史对象。二者共同改变来源角色，但其路径审计分别依赖主机读取与版本对象清单。
        en: A password supplied as a terminal argument may persist in history, allowing later retrieval without intercepting the original
          input. Correcting a repository's current branch can likewise leave historical references and external clones from which the
          corresponding object can be retrieved. Both change source role, while their path evidence depends respectively on host reads
          and version-object inventories.
      - zh: 在协作记录场景中，被侵账户能够访问包含先前共享秘密的邮件或消息。微软 2024 年披露直接支持外传邮件中的秘密被发现并尝试使用；是否为某种应用令牌、是否来自 Slack 及每项秘密是否有效均未披露，不能补写为已观察结论。
        en: In collaboration-record scenarios, a compromised account can access mail or messages containing previously shared secrets.
          Microsoft's 2024 disclosure directly supports finding and attempting to use secrets in exfiltrated email. It does not identify
          particular application-token types, Slack use, or the validity of every secret, so those conclusions remain unobserved.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要可读历史、版本或协作记录，能够定位具体秘密并控制读取结果；可能使用普通账户或已经外传的本地记录。选择旧版本需要相关引用仍可达，选择历史条目需要记录未被过滤，选择共享消息需要访问范围覆盖其内容。攻击者不必控制原保管库，但也不能凭不控制它就假定副本中保存了完整、现行或未绑定秘密。
          en: The adversary needs readable history, version, or collaboration records, a way to locate concrete secrets, and control
            of the read result, potentially through an ordinary account or already exfiltrated local records. Old-version selection
            needs reachable references, history selection needs retained unfiltered entries, and shared-message selection needs content
            access. Control of the original vault is unnecessary, but its absence does not establish that a copy contains complete,
            current, or unbound secrets.
      defender_model:
        paragraphs:
        - zh: 防守方能把记录类型、产生事务、对象版本和内容分类映射到当前读事件时，可区分本子项与普通配置读取。仓库只有 clone 日志时，仍需检查取回范围是否覆盖特定 commit，不能把仓库名称当作秘密返回证据。共享邮件和命令历史可能不保留原始密钥权威标识，离线
            clone 的后续搜索更可能完全不进入组织日志。
          en: Defenders can distinguish this child from ordinary configuration reads when record type, creating transaction, object
            version, and classification map to the current read. A repository clone log still requires checking whether the transfer
            covered a particular commit; its name is not proof that the secret was returned. Mail and history may lack an original authority
            identifier, while later searches of an offline clone may never enter organizational logs.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 从可核对的次生记录取得秘密使原供给面不产生对应新事务
      en: Retrieve secrets from verifiable secondary records without a new original-supply transaction
    analysis:
      paragraphs:
      - zh: 攻击者选择一个已经由交互或复制形成的记录，当前秘密读取因此只经过记录保管面。若原保管库是唯一被监测的取得渠道，邮件、历史或版本读取没有被映射为凭据取得，关键行为便落出有效观察。微软披露证明了共享邮件秘密路径，GitHub 和 PSReadLine
          说明记录保留条件；条件性防守缺口是基于这些语义的推断，不是个案无告警事实。
        en: Selecting a record already created by an interaction or copy routes the current secret read only through the record custodian.
          If the original vault is the sole monitored acquisition channel and mail, history, or version reads are not mapped to credential
          acquisition, the activity falls outside effective observation. Microsoft establishes the shared-mail secret path, and GitHub
          and PSReadLine establish record-retention conditions. The conditional defensive gap is inferred from those semantics rather
          than an incident-specific absence of alerts.
    evidence_refs:
    - TMP1552-REF-MSRC
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-PSREADLINE
    - REF-000942
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1552-DET-READ
      - TMP1552-DET-COPY
    mitigations:
      coverage: available
      mitigation_refs:
      - TMP1552-MIT-CUSTODY
  evidence:
    claim_refs:
    - TMP1552-CLM-COPY
    - TMP1552-CLM-PROOF
    - TMP1552-CLM-MECHANISM
    - TMP1552-CLM-AUDIT
    - TMP1552-CLM-CONTROL
    case_refs:
    - TMP1552-CASE-MSRC
    reference_refs:
    - TMP1552-REF-MSRC
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-PSREADLINE
    - TMP1552-REF-NDSS
    - REF-000379
    - REF-000942
    - TMP1552-REF-GH-ACCESS
  research:
    limitations:
      paragraphs:
      - zh: 微软邮件事件证明共享记录中秘密被发现与尝试使用，没有给出每个值、准确查询或逐项有效性，也不能代表所有版本与历史路径。平台文档证明副本可持续存在，不能单独证明攻击者有意用它规避审计。子技术以来源角色及条件性观察差异成立，中等置信度不外推实测规避效果。
        en: Microsoft's email incident establishes discovery and attempted use of secrets in shared records, without individual values,
          exact queries, or per-secret validity, and does not represent every version or history path. Platform documents establish
          persistence of copies without independently proving deliberate audit evasion. The child rests on source role and conditional
          observation differences, with medium confidence and no extrapolated measured evasion.
      - zh: 将没有复制谱系的散落文件留在父级是必要约束。优先通过记录格式、版本差异、共享元数据或备份清单审查来源；若只能确认老日期或文件名，子项不成立。秘密已撤销降低后继风险但不改变复制事实，只有候选文本而没有完整秘密则仍不能认定取得。
        en: Keeping loose files without copy lineage at the parent is a necessary constraint. Review provenance through record format,
          version differences, sharing metadata, or backup catalogs; age or filename alone does not establish the child. Revocation
          lowers downstream risk without undoing copying, whereas candidate text without the complete secret remains insufficient for
          acquisition.
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
defense_candidates:
  detection_strategies:
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1552-DET-READ
    name:
      zh: 秘密承载对象读取与职责关联
      en: Secret-Bearing Object Read and Duty Correlation
    summary:
      zh: 将实际对象读取连接到秘密承载清单与批准读者职责。
      en: Join exercised object reads to a secret-carrier inventory and approved reader duties.
    description:
      paragraphs:
      - zh: 监测已确认秘密承载文件、注册表值所在键和交互历史的实际读取，并区分现行配置与有形成链的次生记录。关联分析解释读取主体、进程和批准职责，输出可疑读取与已验证材料取得两个结果层级。
        en: Monitor exercised reads of confirmed secret-bearing files, registry keys containing secret values, and interactive history,
          distinguishing current configuration from secondary records with creation lineage. The analytic explains reader, process,
          and approved duty and separates suspicious reads from verified material acquisition.
    detects_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    domains:
    - enterprise
    analytic_refs:
    - TMP1552-NJA-READ
    evidence_refs:
    - REF-000379
    - REF-000230
    - TMP1552-REF-AUTOLOGON
    - TMP1552-REF-GPP
    - TMP1552-REF-PSREADLINE
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1552-DET-COPY
    name:
      zh: 秘密副本版本与取回范围核对
      en: Secret-Copy Version and Retrieval-Scope Reconciliation
    summary:
      zh: 按历史对象和传输范围审查含秘密副本的取回。
      en: Review retrieval of secret-bearing copies using historical objects and transfer scope.
    description:
      paragraphs:
      - zh: 用版本化秘密暴露清单解释仓库 clone/fetch，避免只根据仓库名称认定秘密外流。分析将已知含值版本、接收者与获批用途连接，并明确仓库级事件不能提供的对象范围；本策略直接覆盖次生副本，也辅助父级中的普通仓库配置调查。
        en: Interpret clone or fetch activity with a versioned exposure inventory rather than treating a repository name as proof of
          disclosure. The analytic joins known secret-bearing versions, recipient, and approved purpose while identifying object scope
          absent from repository-level events. It directly covers secondary copies and supports investigation of ordinary repository
          configuration at the parent level.
    detects_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    domains:
    - enterprise
    analytic_refs:
    - TMP1552-NJA-COPY
    evidence_refs:
    - REF-000942
    - TMP1552-REF-GH-ACCESS
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-NDSS
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1552-DET-CONFIG
    name:
      zh: 普通配置 API 秘密披露与接收者核对
      en: Ordinary Configuration API Secret Disclosure and Recipient Reconciliation
    summary:
      zh: 识别普通配置读取把已确认秘密交给职责外接收者的情况。
      en: Identify ordinary configuration reads exposing confirmed secrets to recipients outside approved duty.
    description:
      paragraphs:
      - zh: 策略关注 Pod 与 ConfigMap 等普通配置对象里的实际秘密披露，不把 Secret 资源名或成功 API 请求当作结论。分析将资源版本暴露清单、成功响应与主体职责关联，并保留响应正文不可见时的候选等级。
        en: Focus on actual secret disclosure in ordinary configuration objects such as Pods and ConfigMaps, without treating a Secret
          resource name or successful API call as conclusive. The analytic joins versioned exposure findings, successful responses,
          and reader duty and retains candidate grading when response content is unavailable.
    detects_refs:
    - TMP1552-PARENT
    domains:
    - enterprise
    analytic_refs:
    - TMP1552-NJA-CONFIG
    evidence_refs:
    - REF-000211
    - TMP1552-REF-K8S
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  detection_analytics:
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1552-NJA-READ
    strategy_ref: TMP1552-DET-READ
    name:
      zh: 已审计秘密工件实际读取分析
      en: Audited Secret-Artifact Exercised-Read Analytic
    summary:
      zh: 对照秘密承载清单识别职责外读取，并保留证据强度。
      en: Identify out-of-duty reads against a carrier inventory while preserving evidence strength.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 对已盘点的配置文件、GPP XML、PSReadLine 历史和 Winlogon 秘密值所在键启用相应对象审计及 SACL，先以无生产权限测试内容验证 4663 能记录读取。按 Computer、ObjectType 和规范化 ObjectName
          连接最近一次受限扫描，区分文件 ReadData 与目录 ListDirectory、注册表 Query key value；只查询键时不推断某个值已完整返回。以 SubjectLogonId 与 ProcessId 在同一主机进程生命周期内关联读者和作业许可，避免
          PID 复用。
        en: Enable the required object audit and SACL on inventoried configuration, GPP XML, PSReadLine history, and keys containing
          Winlogon secret values, first testing 4663 read coverage with material lacking production authority. Join Computer, ObjectType,
          and normalized ObjectName to the latest restricted scan. Distinguish file ReadData from directory ListDirectory and registry
          Query key value; a key query alone does not establish a particular value's complete return. Correlate SubjectLogonId and ProcessId
          within the same host process lifetime to reader and job approval, avoiding PID reuse.
      - zh: 不符合配置所有者登记的读者、工单范围或历史使用模式时输出 suspicious-read，包含对象、分类、进程和批准差异。只有受限调查中确认返回值、复制产物或内容映射时才输出 secret-material-recovered；4663 本身不含秘密值、返回字节或全部文件内容。历史文件另需记录其历史格式或生成事务，未知谱系保留父级；远程
          SYSVOL 服务器侧进程可能为系统服务，不能冒充客户端进程归因。
        en: Emit suspicious-read when the reader, work-order scope, or historical pattern conflicts with the configuration owner's approval,
          retaining object, classification, process, and approval difference. Emit secret-material-recovered only after restricted investigation
          confirms returned values, copy output, or content mapping; 4663 itself lacks secret values, returned bytes, and complete file
          content. History additionally needs record-format or creating-transaction evidence, with unknown lineage kept parent-level.
          A server-side SYSVOL process can be a system service and must not be treated as the remote client process.
    data_requirements:
    - source_type: windows-exercised-object-access
      name:
        zh: Windows 已使用对象访问权
        en: Windows Exercised Object Access
      channel: Windows Security Event 4663; normalized computer=Computer time_created=TimeCreated object_type=ObjectType object_name=ObjectName
        access_mask=AccessMask subject_user_sid=SubjectUserSid subject_logon_id=SubjectLogonId process_id=ProcessId process_name=ProcessName
      required_fields:
      - computer
      - time_created
      - object_type
      - object_name
      - access_mask
      - subject_user_sid
      - subject_logon_id
      - process_id
      - process_name
    - source_type: secret-carrier-inventory
      name:
        zh: 受限秘密承载扫描清单
        en: Restricted Secret-Carrier Scan Inventory
      channel: Defender-operated content scanner and configuration inventory
      required_fields:
      - host_id
      - object_path
      - object_type
      - scan_time
      - material_class
      - carrier_role
      - lineage_evidence_id
      - owner
      - approved_reader_scope
    - source_type: approved-read-job
      name:
        zh: 配置与历史读取批准记录
        en: Approved Configuration and History Read Jobs
      channel: Change and incident work-order system
      required_fields:
      - job_id
      - principal_id
      - host_id
      - object_scope
      - valid_from
      - valid_until
      - purpose
    observables:
    - zh: 对已确认秘密承载文件实际使用读取权，且读者或用途不在批准范围
      en: Exercised read rights on a confirmed secret-bearing file by a reader or purpose outside approved scope
    - zh: 对含自动登录值的键发生职责外查询，但仍需值级结果核实
      en: An out-of-duty query of a key containing autologon values requiring value-level result confirmation
    - zh: 具有可核对记录角色的命令历史被非预期进程读取
      en: A history record with verifiable role is read by an unexpected process
    correlation:
      window:
        zh: 读取前后十五分钟核对作业与进程，保留三十日同角色基线；扫描版本必须覆盖读取时内容，窗口需在本地测试。
        en: Reconcile jobs and processes within fifteen minutes of the read with a thirty-day role baseline; the scan must represent
          content at read time and windows require local testing.
      dimensions:
      - computer
      - object_name
      - object_type
      - subject_user_sid
      - subject_logon_id
      - process_id
      - job_id
      - time
    false_positives:
    - zh: 备份、安全扫描、桌面故障排查和获批历史恢复
      en: Backup security scanning desktop troubleshooting and approved history recovery
    - zh: 正常组策略客户端周期读取与部署账户配置维护
      en: Periodic normal Group Policy reads and deployment-account configuration maintenance
    blind_spots:
    - zh: 没有 SACL、审计未启用、离线磁盘或本地管理员破坏日志
      en: Missing SACL disabled audit offline media or local-administrator log interference
    - zh: 4663 不提供值级内容或完整返回证明；Sysmon 12–14 是注册表修改而非读取补充
      en: 4663 lacks value-level content or complete-return proof and Sysmon 12–14 registry modifications are not supplemental read
        telemetry
    - zh: 扫描之后内容变化、符号路径差异与远程文件服务弱客户端归因
      en: Content changes after scanning path aliasing and weak client attribution at remote file services
    tuning_guidance:
      paragraphs:
      - zh: 以配置 owner、对象范围和有期限作业建立允许组合，不全局放行 powershell.exe、备份身份或域用户。用不含有效秘密的文件和测试键验证读取触发、PID/登录关联及正常部署不误报；每次调优同时复测未批准读者仍能生成候选。扫描只保留材料类别和证据指针，不把真实口令复制到
          SIEM。
        en: Allow combinations of configuration owner, object scope, and time-bounded jobs rather than globally permitting PowerShell,
          backup identities, or domain users. Use nonproduction test files and keys to verify read triggering, process and logon correlation,
          and normal deployment behavior. Recheck an unapproved reader after each tuning change. Scanning retains material class and
          evidence pointers without copying passwords into the SIEM.
    evidence_refs:
    - REF-000379
    - REF-000230
    - TMP1552-REF-AUTOLOGON
    - TMP1552-REF-GPP
    - TMP1552-REF-PSREADLINE
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1552-NJA-COPY
    strategy_ref: TMP1552-DET-COPY
    name:
      zh: 仓库秘密版本与取回范围分析
      en: Repository Secret Version and Retrieval-Scope Analytic
    summary:
      zh: 将仓库级传输事件提升为需核对具体秘密版本的调查候选。
      en: Turn repository-level transfer events into investigation candidates requiring concrete secret-version reconciliation.
    domains:
    - enterprise
    platforms:
    - GitHub Enterprise Cloud
    logic:
      paragraphs:
      - zh: 在受控扫描环境解析允许仓库的历史对象，记录 repository_id、commit_oid、blob_oid、path、material_class、record_role、introduced_commit、removed_commit
          与证据引用，秘密正文留在受限证据库。将 git.clone 与 git.fetch 的 actor、repository_id、时间和 hashed_token 连接该暴露清单及批准任务；无版本对象范围的服务事件只输出 repository-exposure-candidate。
        en: Parse authorized repository history in a controlled scanner, retaining repository ID, commit and blob OIDs, path, material
          class, record role, introducing and removing commits, and evidence reference; keep secret content in restricted evidence storage.
          Join clone and fetch actor, repository ID, time, and hashed token to the exposure inventory and approved work. A service event
          lacking transferred-object scope yields only repository-exposure-candidate.
      - zh: 用调查中保全的客户端仓库对象清单、受控传输清单或实际输出检查具体 blob 是否进入接收者控制；深度 clone、分支范围和 fetch 不一定覆盖全历史。确认取得含秘密的历史 blob 并核对删除提交或复制关系后，才能标注次生副本。没有客户端证据时不臆造文件读取事件，也不因仓库含秘密就声称每次
          clone 都取得它；后续登录只作为独立风险信号。
        en: Use preserved client-repository objects, a controlled transfer manifest, or actual output to determine whether the particular
          blob entered recipient control. Shallow clones, branch selection, and fetches need not cover all history. Only confirmed receipt
          of a secret-bearing historical blob plus a removal commit or copy relationship establishes the child. Without client evidence,
          do not invent file-read events or assert that every clone acquired a secret merely because the repository contains one; subsequent
          sign-in is an independent risk signal.
    data_requirements:
    - source_type: github-git-transfer-audit
      name:
        zh: GitHub Git 传输审计
        en: GitHub Git Transfer Audit
      channel: GitHub Enterprise Cloud audit streaming or REST audit API include=git; timestamp maps native @timestamp
      required_fields:
      - timestamp
      - action
      - actor
      - repository_id
      - hashed_token
      - transport_protocol
    - source_type: historical-secret-object-inventory
      name:
        zh: 防守方生成的秘密历史对象索引
        en: Defender-Generated Historical Secret Object Index
      channel: Authorized repository scanner output
      required_fields:
      - repository_id
      - commit_oid
      - blob_oid
      - path
      - material_class
      - record_role
      - lineage_evidence_id
      - scan_time
    - source_type: investigated-transfer-object-manifest
      name:
        zh: 调查取得的客户端或传输对象清单
        en: Investigated Client or Transfer Object Manifest
      channel: Preserved client repository or controlled transfer evidence; not a native clone-log field
      required_fields:
      - evidence_id
      - recipient_id
      - repository_id
      - observed_time
      - received_blob_oids
      - completeness
    - source_type: approved-repository-reader
      name:
        zh: 仓库批准读者与任务
        en: Approved Repository Readers and Jobs
      channel: Repository ownership and CI job inventory
      required_fields:
      - actor
      - repository_id
      - job_id
      - purpose
      - valid_from
      - valid_until
      - allowed_history_scope
    observables:
    - zh: 含暴露历史对象的仓库被职责外主体 clone 或 fetch
      en: Clone or fetch of a repository with exposed historical objects by an out-of-duty reader
    - zh: 接收对象清单实际包含已确认秘密 blob 且可核对次生记录关系
      en: A received-object manifest actually contains a confirmed secret blob with verifiable secondary-record lineage
    correlation:
      window:
        zh: 将一次传输前后六十分钟与作业关联，保留至少九十日事件基线；历史对象索引覆盖秘密暴露窗口且记录完整性。
        en: Correlate a transfer with jobs within sixty minutes and retain at least a ninety-day event baseline; history indexing covers
          the exposure window and records completeness.
      dimensions:
      - repository_id
      - actor
      - hashed_token
      - commit_oid
      - blob_oid
      - recipient_id
      - job_id
      - time
    false_positives:
    - zh: 新开发者全量 clone、镜像、合规扫描和事故保全
      en: New-developer full clones mirroring compliance scans and incident preservation
    - zh: 合法构建从浅 clone 改为全量历史或执行签名验证
      en: Legitimate builds changing from shallow clones to complete history or signature verification
    blind_spots:
    - zh: 服务端 Git 事件没有逐文件读取或传输 blob 清单，缺少客户端证据时不能确证秘密取得
      en: Server Git events lack per-file reads and transferred-blob manifests so acquisition cannot be confirmed without client evidence
    - zh: 已外传 clone 的后续离线搜索、公开匿名访问与未覆盖的 web/API 下载
      en: Later offline searches of exfiltrated clones public anonymous access and uncovered web or API downloads
    - zh: Git 事件仅短期留存且 streaming 启用前不会补记
      en: Short Git-event retention and no backfill before streaming is enabled
    tuning_guidance:
      paragraphs:
      - zh: 提前开启并验证 Git 事件外送，按仓库与作业约束 CI 例外，不把 token 或开发者身份永久全局放行。以含无权限测试字符串的历史提交验证全量与浅 clone、指定分支和增量 fetch 的分级结果，要求缺少对象清单时保持候选。用这些实验调整窗口，确保撤销秘密仍保留暴露记录而不持续制造高危有效性断言。
        en: Enable and validate Git-event export in advance, scoping CI exceptions by repository and job rather than globally allowing
          tokens or developer identities. Use historical commits containing nonprivileged test strings to verify grading for full and
          shallow clones, selected branches, and incremental fetches; absent object manifests must remain candidates. Tune windows with
          those experiments and preserve exposure records after revocation without repeatedly asserting high-risk validity.
    evidence_refs:
    - REF-000942
    - TMP1552-REF-GH-ACCESS
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-NDSS
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1552-NJA-CONFIG
    strategy_ref: TMP1552-DET-CONFIG
    name:
      zh: Kubernetes 普通配置秘密响应分析
      en: Kubernetes Ordinary-Configuration Secret-Response Analytic
    summary:
      zh: 用资源版本暴露清单解释职责外 Pod 或 ConfigMap 读取。
      en: Interpret out-of-duty Pod or ConfigMap reads with a versioned exposure inventory.
    domains:
    - enterprise
    platforms:
    - Kubernetes
    logic:
      paragraphs:
      - zh: 受控扫描批准的 Pod 与 ConfigMap，标记实际明文认证秘密所在字段及 resourceVersion，排除仅有 secretKeyRef、模板变量、示例和掩码的对象。以 auditID 合并同次 API 请求，选择 get/list
          的 ResponseComplete 与成功 responseStatus，将 user.username、sourceIPs、objectRef 和 requestURI 连接资源清单与工作负载/运维职责。对 list 必须核对实际返回集合，不能只用
          namespace 推断所有对象均返回。
        en: Scan authorized Pods and ConfigMaps in a controlled environment, marking actual plaintext authentication-secret fields and
          resource versions while excluding secretKeyRef-only objects, placeholders, examples, and masks. Merge stages by auditID and
          select successful get or list ResponseComplete events. Join user, source IPs, object reference, and request URI to resource
          inventory and workload or administrative duty. For list, reconcile the actual returned set rather than inferring that every
          object in the namespace was returned.
      - zh: Metadata 级别只能形成 configured-secret-read-candidate；要确认某值返回，需要受保护的 RequestResponse 证据或客户端产物，核对资源版本和含值字段。该内容只能在隔离解析器处理，告警输出对象、字段类别和证据指针，避免普通日志成为新秘密副本。正常
          Secret 资源读取转交受管理保管边界审查，不能为扩大本分析覆盖而自动标作未保护。
        en: Metadata audit yields only configured-secret-read-candidate. Confirming a returned value requires protected RequestResponse
          evidence or client output matching resource version and secret-bearing field. Process content only in an isolated parser and
          emit object, field class, and evidence pointer so ordinary logs do not become new secret copies. Direct Secret-resource reads
          go to managed-custody boundary review rather than being automatically labeled unprotected to expand coverage.
    data_requirements:
    - source_type: kubernetes-api-audit
      name:
        zh: Kubernetes API 审计
        en: Kubernetes API Audit
      channel: kube-apiserver audit.k8s.io/v1; audit_id=auditID request_received_timestamp=requestReceivedTimestamp source_ips=sourceIPs
        request_uri=requestURI object_ref=objectRef response_status.code=responseStatus.code
      required_fields:
      - audit_id
      - stage
      - request_received_timestamp
      - verb
      - user.username
      - source_ips
      - request_uri
      - object_ref
      - response_status.code
    - source_type: ordinary-config-secret-inventory
      name:
        zh: 普通配置秘密版本清单
        en: Ordinary-Configuration Secret Version Inventory
      channel: Authorized configuration scanner output; resource_version maps native metadata.resourceVersion
      required_fields:
      - cluster_id
      - namespace
      - kind
      - name
      - resource_version
      - field_path
      - material_class
      - scan_time
      - owner
      - approved_reader_scope
    - source_type: protected-api-response-evidence
      name:
        zh: 受保护响应证据
        en: Protected Response Evidence
      channel: Selective RequestResponse audit or preserved client output in restricted evidence storage
      required_fields:
      - evidence_id
      - audit_id
      - cluster_id
      - returned_object_set
      - resource_versions
      - secret_field_classification
      - completeness
    observables:
    - zh: 职责外主体成功读取已确认含明文秘密的普通配置对象
      en: Successful out-of-duty reads of ordinary configuration confirmed to contain plaintext secrets
    - zh: 完整响应或客户端产物确认具体含值字段进入接收面
      en: Complete responses or client output confirming particular secret-bearing fields entered the recipient surface
    correlation:
      window:
        zh: 按 auditID 关联整个事务，前后十五分钟核对工作负载与工单；内容版本必须对应响应时刻。
        en: Join the full transaction by auditID and reconcile workload and work-order context within fifteen minutes; content version
          must match response time.
      dimensions:
      - cluster_id
      - audit_id
      - namespace
      - object_ref.name
      - user.username
      - source_ips
      - resource_version
      - time
    false_positives:
    - zh: 合法控制器 reconcile、运维排障、灾备导出和秘密修复扫描
      en: Legitimate controller reconciliation troubleshooting recovery export and secret-remediation scans
    blind_spots:
    - zh: 未配置审计、只留 Metadata、响应被截断或扫描版本与读取时内容不一致
      en: Missing audit Metadata-only retention truncated responses or scan versions inconsistent with read-time content
    - zh: Pod 内直接读取环境或日志、Docker API 与非 Kubernetes 接口不在本分析覆盖
      en: Direct in-Pod environment or log reads Docker APIs and other non-Kubernetes interfaces are outside this analytic
    tuning_guidance:
      paragraphs:
      - zh: 先用无权限测试秘密分别验证 get、带 selector 的 list、分页和 Metadata/RequestResponse 分级，确认不会把 secretKeyRef 当作值。允许规则绑定控制器身份、namespace、对象类型及工作负载职责，不永久放行所有
          service account。部署前评估正文审计的保密和成本，只把最小必要证据送入隔离库；无正文时保持候选并通过调查补证。
        en: Test get, selector-based list, pagination, and Metadata versus RequestResponse grading with nonprivileged secrets, ensuring
          secretKeyRef is never treated as a value. Bind allow rules to controller, namespace, resource type, and workload duty rather
          than all service accounts. Assess confidentiality and cost before response auditing, send only necessary evidence to isolated
          storage, and retain candidate status when content needs investigation.
    evidence_refs:
    - REF-000211
    - TMP1552-REF-K8S
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  mitigations:
  - schema_version: 2.0.0
    type: mitigation
    id: TMP1552-MIT-CUSTODY
    name:
      zh: 普通内容面秘密隔离与副本失效
      en: Ordinary-Surface Secret Isolation and Copy Invalidation
    summary:
      zh: 减少普通内容中的认证秘密并分别治理副本读取与已暴露值的后继价值。
      en: Reduce authentication secrets in ordinary content and separately govern copy access and downstream value of exposed material.
    description:
      paragraphs:
      - zh: 将秘密的现行供给面与历史、协作、日志和导出副本分别盘点，登记 owner、允许读者、保留期限、形成关系和轮换责任。普通配置尽可能只保存引用，必须存在的值由独立秘密边界、最小权限及短寿命机制保护；已生成副本不能依靠原件修正自动撤回。
        en: Inventory current secret-supply surfaces separately from history, collaboration, logs, and export copies, retaining owner,
          allowed readers, retention, creation relationships, and rotation responsibility. Ordinary configuration should carry references
          where possible, with necessary values protected by independent custody, least authority, and short lifetimes. Correcting an
          original does not retract existing copies.
    domains:
    - enterprise
    measures:
    - key: remove-ambient-secret-values
      name:
        zh: 移除普通内容中的秘密值
        en: Remove Secret Values from Ordinary Content
      description:
        paragraphs:
        - zh: 从现行脚本、配置、注册表自动登录值、普通清单和日志移除不必要秘密，用专用秘密引用和最小消费者范围代替；禁止把公开常量加密或 base64 视为保密边界。检查过滤后的历史与日志输出，避免将秘密迁入另一普通记录。
          en: Remove unnecessary secrets from active scripts, configuration, registry autologon values, ordinary manifests, and logs,
            using dedicated secret references and minimum consumer scope. Public-constant encryption and base64 are not confidentiality
            boundaries. Check filtered history and log output so migration does not create another ordinary record.
      control_type: exposure-reduction
    - key: govern-secondary-records
      name:
        zh: 治理次生记录与读取
        en: Govern Secondary Records and Reads
      description:
        paragraphs:
        - zh: 盘点历史、共享消息、版本、备份和导出副本的对象身份与形成链，对仍必要记录设置最小读取、受控保留和内容脱敏，清理可控 clone 与引用并验证实际效果。使用经版本验证的历史敏感过滤和不含秘密的审计特征，兼顾调查记录要求。
          en: Inventory object identities and creation chains for history, shared messages, versions, backups, and exports. Apply least
            read authority, controlled retention, and redaction to necessary records; clean controlled clones and references and verify
            the outcome. Use version-tested sensitive-history filtering and value-free audit features while preserving investigation
            requirements.
      control_type: preventive
    - key: invalidate-by-exposure-scope
      name:
        zh: 按暴露范围使材料失效
        en: Invalidate Material by Exposure Scope
      description:
        paragraphs:
        - zh: 保全必要证据后，按材料类别、身份、暴露版本和接收者轮换口令与密钥或撤销令牌，验证旧材料在授权测试中被拒绝。保留未知副本与无法删除的外部记录清单；仅删原文件、打补丁或重写历史不能代替失效处置。
          en: After preserving necessary evidence, rotate passwords and keys or revoke tokens by material class, identity, exposed version,
            and recipient, verifying rejection of old material in authorized tests. Retain an inventory of unknown copies and undeletable
            external records. Deleting originals, patching, or rewriting history does not substitute for invalidation.
      control_type: containment
    applications:
    - target_ref: TMP1552-PARENT
      use:
        paragraphs:
        - zh: 扫描现行配置、自动登录键、旧 GPP XML 和普通容器清单，先确认真实秘密承载再分配 owner 与允许读者。移除明文/公开可逆秘密并轮换已暴露值；GPP 更新后仍检查并删除旧含口令策略，正常保管库与工作负载凭据通过专用边界保护，而不通过全禁正常
            API 处理。
          en: Scan active configuration, autologon keys, old GPP XML, and ordinary container manifests, confirming real secret content
            before assigning owner and readers. Remove plaintext or publicly reversible secrets and rotate exposed values; after GPP
            updates still inspect and remove old password-bearing policies. Protect legitimate vault and workload credentials at their
            dedicated boundaries rather than disabling ordinary APIs wholesale.
      expected_effect:
        paragraphs:
        - zh: 可由普通内容读取获得的秘密数量与寿命下降，攻击者必须接触更受控的秘密面或承担额外取得成本。对象与读者清单还能使残余读取被关联为潜在秘密披露，而不只是一次无语义文件访问。
          en: Fewer and shorter-lived secrets remain obtainable through ordinary content, forcing contact with a more controlled secret
            surface or additional acquisition cost. Object and reader inventories also let residual reads be interpreted as potential
            disclosures instead of semantically empty file access.
      limitations:
        paragraphs:
        - zh: 受侵消费者仍可读取其业务所需秘密，老系统可能不支持引用或短寿命材料。迁移和轮换可中断服务，外部副本也无法保证删除；仍需监测内容读取，且材料有效性未知时不能只凭删除成功宣告恢复。
          en: A compromised consumer can still read secrets required for its job, and legacy systems may lack references or short-lived
            material. Migration and rotation can interrupt service and external copies cannot be guaranteed deleted. Read monitoring
            remains necessary, and successful deletion alone cannot establish recovery when validity is unknown.
    - target_ref: TMP1552-CHILD-COPY
      use:
        paragraphs:
        - zh: 按命令记录、共享关系、版本差异或备份映射登记副本谱系；扫描范围包括历史 commit、受控 clone、协作导出和 history 文件，不能只检查当前文件。对可控记录执行最小读取与保留，对已暴露秘密先轮换或撤销，再协调清理 fork、缓存和备份，记录无法撤回的副本。
          en: Register copy lineage from command records, sharing relationships, version differences, or backup mappings. Scan historical
            commits, controlled clones, collaboration exports, and history files rather than only current files. Apply least reading
            and retention to controlled records, rotate or revoke exposed secrets first, then coordinate fork, cache, and backup cleanup
            and record copies that cannot be retracted.
      expected_effect:
        paragraphs:
        - zh: 攻击者绕过现行供给面从旧记录取得可用秘密的机会缩小；即使未知 clone 继续存在，旧值失效也降低后继风险。记录谱系与读取审计连接后，副本取得不再只依赖原保管库出现新事务才能被解释。
          en: Opportunities to recover usable secrets from old records without the current supply surface decrease. Even when unknown
            clones persist, invalidating old values reduces downstream risk. Linking record lineage and read audit makes copy acquisition
            interpretable without requiring a new original-custodian transaction.
      limitations:
        paragraphs:
        - zh: 组织不能清除他人的全部 clone 或已外传邮件，保留义务也可能禁止删除原始记录。历史过滤依赖版本和命令语义，简单关键词会漏记或误删调查信息；如果攻击者已持有新秘密或控制轮换流程，副本治理不能单独恢复信任。
          en: Organizations cannot erase every external clone or exfiltrated email, and retention duties may prohibit deleting original
            records. History filtering depends on version and command semantics, while simple keywords can miss secrets or remove investigative
            information. Copy governance alone cannot restore trust if the actor holds new secrets or controls rotation.
    evidence_refs:
    - TMP1552-REF-GPP
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-PSREADLINE
    - TMP1552-REF-K8S
    - TMP1552-REF-IMDSV2
