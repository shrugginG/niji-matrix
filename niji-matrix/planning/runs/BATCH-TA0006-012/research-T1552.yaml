  claims:
  - schema_version: 1.0.0
    type: claim
    id: TMP1552-CLM-RELEVANCE
    claim_type: technique-relevance
    statement_zh: 普通代码、配置和协作记录能够暴露认证秘密，GPP 的公开固定密钥恢复和微软披露的邮件秘密发现分别支持未保护秘密取得作为独立 TA0006 行为。
    statement_en: Ordinary code, configuration, and collaboration records can expose authentication secrets; GPP recovery with a public
      fixed key and Microsoft's disclosure of secrets found in email support unprotected-secret acquisition as a distinct TA0006 behavior.
    subject_refs:
    - TMP1552-PARENT
    evidence_refs:
    - REF-000625
    - TMP1552-REF-GPP
    - TMP1552-REF-NDSS
    - TMP1552-REF-MSRC
    evidence_mode: directly-observed
    confidence: high
    status: draft
  - schema_version: 1.0.0
    type: claim
    id: TMP1552-CLM-PROOF
    claim_type: technique-boundary
    statement_zh: 对象返回、秘密材料取得、加密私钥解锁与身份接受应分别举证，公开证书、掩码、示例或一次仓库 clone 不能单独证明取得可用认证秘密。
    statement_en: Object return, secret-material acquisition, encrypted-key unlocking, and identity acceptance require separate evidence;
      public certificates, masks, examples, or a repository clone alone do not establish acquisition of a usable authentication secret.
    subject_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    evidence_refs:
    - TMP1552-REF-SSH
    - TMP1552-REF-GH-ACCESS
    - REF-000942
    - TMP1552-REF-IMDS
    evidence_mode: strongly-inferred
    confidence: high
    status: draft
  - schema_version: 1.0.0
    type: claim
    id: TMP1552-CLM-BOUNDARY
    claim_type: technique-boundary
    statement_zh: 材料类型与取得路径是独立判断，正常保管库或工作负载凭据交付不自动成为未保护秘密取得；普通配置中的散落值与受管理秘密边界必须以实际内容和接收者授权区分。
    statement_en: Material type and acquisition path are independent judgments; normal vault or workload credential delivery does not
      automatically constitute unprotected-secret acquisition, and loose configuration values must be distinguished from managed-secret
      boundaries through content and recipient authority.
    subject_refs:
    - TMP1552-PARENT
    evidence_refs:
    - REF-000547
    - REF-000719
    - TMP1552-REF-IMDS
    - TMP1552-REF-K8S
    - TMP1552-REF-AUTOLOGON
    evidence_mode: strongly-inferred
    confidence: high
    status: draft
  - schema_version: 1.0.0
    type: claim
    id: TMP1552-CLM-MECHANISM
    claim_type: mechanism-mapping
    statement_zh: 选择已含秘密的普通或次生内容面可使当前取得只留下该面的读取事务，只有监测原秘密权威或凭据导出的防守方可能因此遗漏取得语义；这是有条件的行为透明推断而非已测量规避率。
    statement_en: Selecting an ordinary or secondary secret-bearing surface can leave only that surface's read transaction, allowing
      a defender observing only the original authority or credential export to miss acquisition semantics; this is a conditional behavioral-transparency
      inference rather than a measured evasion rate.
    subject_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    evidence_refs:
    - TMP1552-REF-GPP
    - TMP1552-REF-MSRC
    - TMP1552-REF-GH-REMOVE
    - REF-000379
    - REF-000211
    evidence_mode: strongly-inferred
    confidence: medium
    status: draft
  - schema_version: 1.0.0
    type: claim
    id: TMP1552-CLM-COPY
    claim_type: subtechnique-existence
    statement_zh: 以先前交互、共享或复制形成的记录为当前秘密取得来源，具备可核对形成链时构成次生副本秘密取回；区别于当前秘密供给配置，其审计与清理依赖历史、协作或版本保管面。
    statement_en: Using a record created by earlier interaction, sharing, or copying as the current secret source establishes Secondary-Copy
      Secret Retrieval when its creation chain is verifiable; unlike current secret-supply configuration, its audit and cleanup depend
      on history, collaboration, or version custody.
    subject_refs:
    - TMP1552-CHILD-COPY
    evidence_refs:
    - TMP1552-REF-MSRC
    - TMP1552-REF-PSREADLINE
    - TMP1552-REF-GH-REMOVE
    evidence_mode: strongly-inferred
    confidence: medium
    status: draft
  - schema_version: 1.0.0
    type: claim
    id: TMP1552-CLM-AUDIT
    claim_type: detection
    statement_zh: 已配置 SACL 的 4663、仓库 clone/fetch 和 Kubernetes 审计提供不同粒度读取证据；只有结合秘密承载清单及具体返回内容，才能把访问候选提升为秘密取得，单个事件本身没有完整秘密语义。
    statement_en: SACL-configured 4663, repository clone or fetch events, and Kubernetes audit provide different granularities of read
      evidence; exposure inventories and concrete returned content are needed to promote an access candidate to secret acquisition because
      an individual event lacks full secret semantics.
    subject_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    evidence_refs:
    - REF-000379
    - REF-000942
    - REF-000211
    - TMP1552-REF-GH-ACCESS
    evidence_mode: strongly-inferred
    confidence: high
    status: draft
  - schema_version: 1.0.0
    type: claim
    id: TMP1552-CLM-CONTROL
    claim_type: mitigation
    statement_zh: 秘密撤销或轮换改变已暴露值的后继价值，副本清理和最小读取改变继续取得机会，两者不能互相替代；GPP 更新不自动移除旧含口令策略，仓库历史重写也不自动撤回外部 clone。
    statement_en: Revocation or rotation changes downstream value, while copy cleanup and least read authority change continuing acquisition
      opportunities; neither substitutes for the other. GPP updates do not automatically remove old password-bearing policies, and history
      rewriting does not retract external clones.
    subject_refs:
    - TMP1552-PARENT
    - TMP1552-CHILD-COPY
    evidence_refs:
    - TMP1552-REF-GPP
    - TMP1552-REF-GH-REMOVE
    - TMP1552-REF-K8S
    evidence_mode: directly-observed
    confidence: high
    status: draft
