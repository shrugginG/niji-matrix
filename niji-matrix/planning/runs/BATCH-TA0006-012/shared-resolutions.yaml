  reason_zh: 与配置副本读取目标相邻，但本候选需要秘密承载判定、特定材料结果分级和次生记录来源门。NJA-000338 以设备配置与管理作业为身份且假设通用 bytes_returned 等字段，本提案使用真实 4663、Git 和 Kubernetes 的不同粒度，不能扩展主体而保持原逻辑不变。
