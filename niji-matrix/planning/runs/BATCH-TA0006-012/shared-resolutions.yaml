  resolution: split
  compared_refs:
  - MIT-000224
  - MIT-000167
  - MIT-000176
  - MIT-000142
  - MIT-000188
  reason_zh: 既有对象分别治理设备管理配置、脆弱服务、历史审计完整性、保管库消费者和令牌材料。本控制统一普通内容秘密隔离、次生记录清理和按暴露失效；措施身份存在实质差别，不能仅增加 Application 就假装同一控制。
  reason_en: Existing controls govern device-management configuration, vulnerable services, history-audit integrity, vault consumers, and
    token material. This control combines ordinary-surface isolation, secondary-record cleanup, and exposure-scoped invalidation; the measure
    identities differ materially and cannot be reused by adding an Application alone.
