batch_ref: BATCH-TA0006-012
candidate: T1552
fixed_baseline:
  domain: enterprise-attack
  version: '19.1'
  source_ref: REF-000625
attack_subtechnique_count: 8
attack_subtechnique_ids:
- T1552.001
- T1552.002
- T1552.003
- T1552.004
- T1552.005
- T1552.006
- T1552.007
- T1552.008
original_attack_subtechniques_imported: false
coverage_pass:
  represented_dimensions:
  - zh: 普通持久工件中的静态值与可逆残留
    en: Static values and reversible residue in ordinary persisted artifacts
  - zh: 交互记录与协作记录形成的次生内容
    en: Secondary content created by interactive and collaborative records
  - zh: 自动交付与配置响应中的接收者边界
    en: Recipient boundaries in automatic delivery and configuration responses
  - zh: 私钥等特定认证材料与读取路径的交叉
    en: Intersections between particular authentication materials and read paths
  rows:
  - attack_id: T1552.001
    name:
      zh: 文件中的凭据
      en: Credentials in Files
    resolution: parent-core
    material_and_path:
      zh: 代码或配置中的完整口令/API秘密由普通文件、版本或下载读取；文件不是材料类型，JWT、Cookie、PKCS12仍须分别解析。
      en: Complete passwords or API secrets in code or configuration are read through ordinary files, versions, or downloads; a file is not
        a material type and JWT cookies or PKCS12 still need separate parsing.
    controlled_variable:
      zh: 选择现行运行配置还是有复制谱系的历史/导出对象；仅选择扩展名不成立匿迹变量。
      en: Select current operational configuration versus a historical or exported object with copy lineage; choosing an extension alone
        is not a stealth variable.
    trace_difference:
      zh: 当前配置留下内容读取；确定为旧版本时痕迹转移到版本/副本面，可能没有对应原服务事务。
      en: Current configuration leaves a content read; confirmed old-version selection moves evidence to a version or copy surface without
        necessarily creating an original-service transaction.
    observation_difference:
      zh: 秘密服务日志无法代替文件结果，仓库clone也不含逐秘密读取；须用内容和版本映射判断。
      en: Secret-service logs cannot replace file outcomes and clone logs lack per-secret reads; content and version mapping are required.
    normal_counterexample:
      zh: 经批准构建读取当前配置、示例配置下载或合规扫描不证明秘密取得或恶意。
      en: Approved builds reading current configuration example downloads and compliance scans do not establish secret acquisition or malice.
    defense_difference:
      zh: 文件实际读取审计与受限秘密扫描；若证实副本链再使用历史对象取回分析，不能只扫描当前分支。
      en: Exercised file-read audit and restricted secret scans; confirmed copy chains additionally require historical-object retrieval analysis
        rather than current-branch scans alone.
    evidence_refs:
    - TMP1552-REF-NDSS
    - TMP1552-REF-GH-REMOVE
    - REF-000379
    - REF-000942
    child_condition: TMP1552-CHILD-COPY only when secondary-record lineage and actual secret receipt are established
  - attack_id: T1552.002
    name:
      zh: 注册表中的凭据
      en: Credentials in Registry
    resolution: parent-core
    material_and_path:
      zh: Winlogon DefaultPassword是普通明文值；从LSA secret提取同一用途口令归NJT-0177，不能按注册表路径混合。
      en: Winlogon DefaultPassword is an ordinary plaintext value; extracting an LSA secret belongs to NJT-0177 even for the same purpose
        and must not be merged by registry location.
    controlled_variable:
      zh: 选择普通可读值还是系统秘密边界；这决定父级边界，不构成按容器独立子项。
      en: Select an ordinary readable value versus an OS-secret boundary; this determines parent ownership rather than a carrier-based child.
    trace_difference:
      zh: 普通值查询不必产生LSA提取痕迹；4663受SACL约束，Sysmon修改事件不补充查询覆盖。
      en: An ordinary value query need not create LSA-extraction traces; 4663 depends on SACL and Sysmon modifications do not supply query
        coverage.
    observation_difference:
      zh: 只看注册表写入或系统凭据提取会漏过值读取；查询键不证明特定值完整返回。
      en: Watching registry writes or OS credential extraction can miss reads; querying a key does not prove a complete particular value
        was returned.
    normal_counterexample:
      zh: 获批kiosk自动登录与管理员排障可产生相同值查询，需查读者和接收者用途。
      en: Approved kiosk autologon and administrative troubleshooting can produce identical queries and require duty and recipient checks.
    defense_difference:
      zh: 移除不必要DefaultPassword，验证Audit Registry与读取SACL，对实际值级结果分级；LSA路径转邻接分析。
      en: Remove unnecessary DefaultPassword values and verify Audit Registry and read SACLs with value-level result grading; route LSA paths
        to neighboring analytics.
    evidence_refs:
    - TMP1552-REF-AUTOLOGON
    - REF-000379
    - REF-000230
    child_condition: No child solely because the carrier is a registry key; an exported key copy requires independent lineage
  - attack_id: T1552.003
    name:
      zh: Shell历史
      en: Shell History
    resolution: niji-variable-candidate
    material_and_path:
      zh: 先前命令参数实际写入的认证秘密经持久历史文件读取；只保存取令牌命令不等于保存运行返回值。
      en: Authentication secrets actually retained from earlier command arguments are read from persisted history; recording a token-fetch
        command is not recording its runtime return.
    controlled_variable:
      zh: 选择可证由先前交互生成的历史记录替代原输入或当前供给面。
      en: Select a record demonstrably generated by earlier interaction instead of the original input or current supply surface.
    trace_difference:
      zh: 当前只需history读取，无需重现原输入或秘密服务请求；仍保留文件与进程证据。
      en: The current action needs only a history read without repeating input or secret-service requests; file and process evidence remains.
    observation_difference:
      zh: 原输入传感器不能代替后来副本读取；历史过滤版本决定是否有值，不能从命令字样推定秘密。
      en: Original-input sensors cannot replace later-copy read evidence; filtering versions determine value retention and command text alone
        is insufficient.
    normal_counterexample:
      zh: 用户回看自己的历史、调查员保全记录或仅含安全变量引用的命令均不证明秘密取得。
      en: Personal-history review investigative preservation and commands containing only safe variable references do not establish secret
        acquisition.
    defense_difference:
      zh: 监测历史文件职责外读取、版本验证敏感过滤并保留不含值的审计，不能为保全历史而创建新秘密副本。
      en: Monitor out-of-duty history reads and version-test sensitive filtering with value-free audit rather than creating new secret copies
        for history preservation.
    evidence_refs:
    - TMP1552-REF-PSREADLINE
    - REF-000379
    child_condition: Require actual secret in history and current receipt plus history-format or creating-operation evidence
  - attack_id: T1552.004
    name:
      zh: 私钥
      en: Private Keys
    resolution: adjacent-technique
    material_and_path:
      zh: SSH认证私钥可由普通文件读取；认证证书对应私钥另审NJT-0227，签名/解密专用私钥不能只凭扩展名归凭据。公钥与证书公开部分不是秘密。
      en: SSH authentication private keys may be read from ordinary files; certificate-authentication keys additionally require NJT-0227
        review, and signing-only or decryption-only keys are not credentials by extension. Public keys and public certificate parts are not
        secrets.
    controlled_variable:
      zh: 选择可读原密钥或有谱系的复制工件；材料类型本身不是匿迹变量，强口令加密形成独立恢复门。
      en: Select an original key or a copy with lineage; material class is not itself a stealth variable and strong passphrase encryption
        creates a separate recovery gate.
    trace_difference:
      zh: 文件取得不等于密钥导出、解锁或服务器私钥证明；后续离线候选验证会产生另一阶段行为。
      en: File acquisition differs from key export unlocking or server proof of possession; later offline candidate verification is another
        stage.
    observation_difference:
      zh: 文件名和读取日志看不到完整私钥、口令或认证接受；材料解析与接收者证据必须独立保全。
      en: Filenames and read logs do not show a complete key passphrase or authentication acceptance; material parsing and recipient evidence
        must be preserved separately.
    normal_counterexample:
      zh: 正常SSH客户端读取自有私钥、备份公钥或空口令host key本身均不足认定恶意暴露。
      en: A normal SSH client reading its own key public-key backup or an empty-passphrase host key alone is insufficient to establish malicious
        exposure.
    defense_difference:
      zh: 核对私钥用途与读取ACL，必要时用独立口令/硬件边界，暴露后撤销对应信任；仅复制加密工件保留artifact-only等级，破解归NJT-0137。
      en: Verify key purpose and read ACLs with independent passphrase or hardware boundaries where appropriate; revoke corresponding trust
        after exposure. Copying ciphertext remains artifact-only and cracking belongs to NJT-0137.
    evidence_refs:
    - TMP1552-REF-SSH
    - REF-000625
    child_condition: T1552 ordinary-path coverage may coexist with NJT-0227 material evidence; no private-key-named child
  - attack_id: T1552.005
    name:
      zh: 云实例元数据API
      en: Cloud Instance Metadata API
    resolution: adjacent-technique
    material_and_path:
      zh: AWS角色返回AccessKeyId/SecretAccessKey/Token/Expiration或其他云访问令牌；IMDSv2本地会话token与这些材料不同。正常自动交付先归NJT-0178材料返回面。
      en: AWS role delivery returns AccessKeyId SecretAccessKey Token and Expiration or other cloud access tokens; the local IMDSv2 session
        token is distinct. Normal automatic delivery first belongs to NJT-0178's material-return surface.
    controlled_variable:
      zh: 攻击者可操纵中介请求的目标或接收者使本不应获得响应者取得值；只有实证越界才有T1552路径，不能以调用IMDS为准。
      en: An adversary may redirect an intermediary's request target or recipient so an unintended recipient obtains the response; only demonstrated
        crossing establishes a T1552 path, not the IMDS call alone.
    trace_difference:
      zh: 响应可由实例/代理路径流出，常规SDK也有相同本地请求；CloudTrail不保证记录本地IMDS读取。
      en: Responses can leave through instance or proxy paths while normal SDKs issue similar local requests; CloudTrail is not guaranteed
        to record local IMDS reads.
    observation_difference:
      zh: 角色API后继使用不能补证取得路径；需请求控制、实例身份、响应与接收者关系，元数据会话日志也不证明角色密钥已返回。
      en: Later role API use cannot backfill acquisition provenance; request control instance identity response and recipient relationships
        are needed, and session-token evidence does not prove role-key delivery.
    normal_counterexample:
      zh: AWS SDK为附加角色刷新临时凭据是正常功能，即使无需显式AssumeRole也不说明未保护。
      en: SDK refresh of attached-role credentials is normal even without explicit AssumeRole and does not establish unprotected exposure.
    defense_difference:
      zh: IMDSv2、转发/跳数限制和最小工作负载角色约束实际接收边界；已有本机进程控制仍可读取所需值。专用NJS暂不成立，先解决NJT-0178重叠。
      en: IMDSv2 forwarding or hop limits and least workload roles constrain recipient boundaries; a controlled local process may still read
        necessary values. No dedicated child is established before resolving NJT-0178 overlap.
    evidence_refs:
    - TMP1552-REF-IMDS
    - TMP1552-REF-IMDSV2
    - REF-000719
    - REF-000524
    child_condition: Parent path only with inappropriate recipient disclosure; automatic-return child deferred as overlapping and insufficiently
      generalized
  - attack_id: T1552.006
    name:
      zh: 组策略首选项
      en: Group Policy Preferences
    resolution: parent-core
    material_and_path:
      zh: SYSVOL中旧XML的cpassword可用公开固定AES密钥恢复口令；这是普通配置共享与公开可逆保护，不是SAM/LSA提取或独立保管库解锁。
      en: Legacy cpassword in SYSVOL XML can be recovered with a public fixed AES key; this is ordinary configuration sharing with publicly
        reversible protection rather than SAM or LSA extraction or independent vault unlocking.
    controlled_variable:
      zh: 选择已有弱保护分发工件及对应恢复路径；读取现行策略本身不证明有次生副本角色。
      en: Select an existing weakly protected distribution artifact and its recovery path; reading current policy does not itself establish
        a secondary-copy role.
    trace_difference:
      zh: 攻击者只需普通共享读取及本地恢复，不必向秘密权威请求导出；恢复步骤未必在域服务端有事件。
      en: Ordinary share reads and local recovery avoid requesting export from a secret authority; recovery need not create a domain-server
        event.
    observation_difference:
      zh: 正常GPP客户端也周期读取SYSVOL，只有共享访问并不能识别具体恢复口令；需内容、读者与结果检查。
      en: Normal GPP clients periodically read SYSVOL so share access alone cannot identify particular recovered passwords; content reader
        and outcome checks are needed.
    normal_counterexample:
      zh: 正常域计算机更新策略或管理员执行Enum-SettingsWithCpassword是合法维护，不能直接判作窃取。
      en: Normal domain-computer policy refresh and administrative Enum-SettingsWithCpassword are legitimate maintenance rather than automatic
        theft findings.
    defense_difference:
      zh: 删除旧含口令策略、轮换涉及账户并监测职责外读取；只安装MS14-025不清除现存值。无需为公开常量恢复新建按产品子项。
      en: Remove old password-bearing policies rotate affected accounts and monitor out-of-duty reads; installing MS14-025 alone does not
        remove existing values. Public-constant recovery does not justify a product child.
    evidence_refs:
    - TMP1552-REF-GPP
    - REF-000379
    child_condition: Archived GPP backup needs separate copy-lineage evidence; active SYSVOL policy remains parent-core
  - attack_id: T1552.007
    name:
      zh: 容器API
      en: Container API
    resolution: parent-core
    material_and_path:
      zh: Docker inspect Config.Env或普通Pod/ConfigMap可返回实际明文值；secretKeyRef不是值，受授权Secret API读取先审NJT-0147，返回的应用token另审NJT-0178。
      en: Docker inspect Config.Env and ordinary Pod or ConfigMap content can return actual plaintext values; secretKeyRef is not the value,
        authorized Secret API reads first require NJT-0147 review, and returned application tokens additionally require NJT-0178.
    controlled_variable:
      zh: 选择读取普通配置的响应面而非专用秘密面，或选择已有导出清单；资源/API名称不构成变量。
      en: Select ordinary configuration responses rather than dedicated secret custody, or select an existing exported manifest; resource
        or API names are not the variable.
    trace_difference:
      zh: API只读成功可能在工作负载审计留下get/list与对象，内容依审计级别可见；进程环境本地读取与API响应是不同路径。
      en: Successful reads may leave get or list and object evidence in workload audit with content depending on level; local environment
        reads and API responses are different paths.
    observation_difference:
      zh: Metadata没有响应正文，list权限范围不等于所有对象实际返回；需版本与返回集合核对，不能从200推出秘密。
      en: Metadata lacks response content and list authority is not proof every object was returned; versions and returned sets require reconciliation
        rather than inferring secrets from status 200.
    normal_counterexample:
      zh: 受权控制器读取Secret、kubectl排障和只有引用的Pod读取是正常情况。
      en: Authorized controllers reading Secrets kubectl troubleshooting and reading reference-only Pods are normal cases.
    defense_difference:
      zh: 把普通配置中的值改为受治理引用，收窄get/list范围，验证API审计与受控响应证据；不要把完整秘密正文复制进普通SIEM。
      en: Replace ordinary configuration values with governed references narrow get or list scope and verify audit plus protected response
        evidence; avoid copying secret bodies into an ordinary SIEM.
    evidence_refs:
    - REF-000822
    - REF-000211
    - TMP1552-REF-K8S
    child_condition: Exported manifest can enter the copy child only when its prior creation and secret content are established
  - attack_id: T1552.008
    name:
      zh: 聊天消息
      en: Chat Messages
    resolution: niji-variable-candidate
    material_and_path:
      zh: 先前共享秘密的消息或导出可经内容搜索返回完整值；Slack search.messages需要相应用户scope与可见内容，不是匿名读取，也不能从查询命中数推断秘密。
      en: Messages or exports containing previously shared secrets can return complete values through content search; Slack search.messages
        needs an appropriate user scope and visible content rather than anonymous access, and hit counts do not prove secrets.
    controlled_variable:
      zh: 选择可证先前共享的通信记录作为来源，控制查询只是定位手段；没有共享/记录角色证据留父级。
      en: Select demonstrably previously shared communication as the source; query control merely locates it and absent record-role evidence
        remains parent-level.
    trace_difference:
      zh: 当前读取在协作面，不必访问原秘密供给面；内容事件与导出粒度依服务许可/配置而变。
      en: Current reading occurs on the collaboration surface without necessarily accessing original secret supply; event and export granularity
        depend on service plan and configuration.
    observation_difference:
      zh: 搜索调用、批次邮箱访问或会话审计不能替代具体消息内容进入控制的证明，既有账号正常外观也非独立伪装结论。
      en: Search calls batch mailbox access and session audit cannot replace evidence of particular message content entering control; ordinary
        account appearance is not an independent disguise conclusion.
    normal_counterexample:
      zh: 支持工单秘密修复搜索、合规导出或不含秘密的链接搜索是正常活动。
      en: Support remediation searches compliance exports and searches for nonsecret links are normal activity.
    defense_difference:
      zh: 治理消息秘密分享和导出保留，先使暴露值失效；内容级确认依受限证据不假设平台总有逐项读取日志。
      en: Govern sharing and export retention and invalidate exposed values first; content confirmation needs restricted evidence without
        assuming universal item-read logs.
    evidence_refs:
    - TMP1552-REF-SLACK
    - TMP1552-REF-MSRC
    child_condition: MSRC case establishes shared email record use; not a Slack case or proof of a specific secret class
second_taxonomy_pass:
  required: true
  completed: true
  method:
    zh: 去掉文件、注册表、Shell、私钥、IMDS、GPP、容器和聊天名称，按攻击者控制变量、痕迹差、观察模型、正常反例与实际防御差异重新比较，不从八行机械合并命名。
    en: Remove the labels file registry shell private key IMDS GPP container and chat and compare attacker control traces observation normal
      counterexamples and defense differences without mechanically merging the eight rows into names.
  axes:
  - key: TMP1552-AXIS-STATIC
    variable:
      zh: 选择既存普通残留而非受保护保管边界
      en: Select existing ordinary residue instead of a protected custodian boundary
    resolution: parent-core
    failed_or_passed_gates:
      zh: 可控、痕迹差与防御差成立，但覆盖父定义本身；独立分项没有兄弟排他边界，失败于非父级核心门。
      en: Control trace and defense differences pass but restate the parent definition; no independent sibling boundary exists so the non-parent-core
        gate fails.
  - key: TMP1552-AXIS-COPY
    variable:
      zh: 选择可核对先前交互/共享/复制产生的次生记录
      en: Select a verifiable record produced by earlier interaction sharing or copying
    resolution: formal
    resulting_child_ref: TMP1552-CHILD-COPY
    failed_or_passed_gates:
      zh: 可控记录选择、与当前供给配置的来源门、原供给面无对应新事务的条件性观察差异、独立历史/协作/版本审计及清理控制均成立。微软事件和平台语义提供中等置信度支持，来源不明旧文件排除。
      en: Controlled record selection a source-role gate against current supply conditional absence of a new supply transaction and distinct
        historical collaborative version audit and cleanup controls pass. Microsoft incident and platform semantics support medium confidence
        while old files of unknown provenance are excluded.
  - key: TMP1552-AXIS-AUTODELIVERY
    variable:
      zh: 将受信自动交付响应转向不当接收者
      en: Redirect trusted automatic-delivery responses to an inappropriate recipient
    resolution: deferred
    failed_or_passed_gates:
      zh: AWS平台证据支持接收边界与缓解差异，但正常角色交付不属于未保护；真正越界通常还需SSRF/代理能力，返回应用材料已被NJT-0178覆盖。未找到足够独立、跨接口的窄结论证明其作为本父NJS比邻接对象更稳定，失败于兄弟归属与泛化证据门。
      en: AWS platform evidence supports recipient boundaries and mitigation differences but normal role delivery is not unprotected. Crossing
        generally needs SSRF or proxy capability and returned application material already falls under NJT-0178. Insufficient independent
        cross-interface conclusion-level support exists for a stable child under this parent so ownership and generalization gates fail.
  - key: TMP1552-AXIS-BUSINESS
    variable:
      zh: 借用正常权限或业务读取外观
      en: Borrow normal authority or business-read appearance
    resolution: parent-core
    failed_or_passed_gates:
      zh: 普通账号或工具常是先决条件；未证明攻击者额外选择、构造或挟持具体批准作业来改变痕迹。只观察API允许/业务名称不能建立意图，失败于独立可控变量、因果证据和检测差异门。
      en: An ordinary account or tool is often a prerequisite. No independent manipulation of an approved job is established to change traces.
        API allowance and a business name cannot establish intention so independent control causal evidence and detection-difference gates
        fail.
  - key: TMP1552-AXIS-REVERSIBLE
    variable:
      zh: 选择明文/编码/公开常量可逆表示
      en: Select plaintext encoding or public-constant reversible representation
    resolution: parent-core
    failed_or_passed_gates:
      zh: 表示与恢复步骤影响内容检查，但GPP公开密钥不是秘密隔离；攻击者选择脆弱材料不等于改变记录观察变量。未证明稳定独立子项边界，不能由一个产品补出数据遮蔽机理。
      en: Representation and recovery affect content checks but a public GPP key is not secret isolation. Choosing weak material is not a
        changed record-observation variable and lacks a stable independent child boundary; one product cannot establish data obscuration.
  - key: TMP1552-AXIS-MATERIAL
    variable:
      zh: 按口令/私钥/token/cookie/票据划分
      en: Partition by password private key token cookie or ticket
    resolution: adjacent
    failed_or_passed_gates:
      zh: 具有重要材料与响应差异但不属于匿迹变量；已有材料父技术拥有其结果。只在普通不当读取路径得到独立证据时并列，失败于原生匿迹划分门。
      en: Material and response differences matter but are not stealth variables and existing parents own the outcomes. Co-record only with
        independent inappropriate ordinary-read evidence so the native-stealth partition gate fails.
  - key: TMP1552-AXIS-TIME
    variable:
      zh: 降低检索频率或分散多账户读取
      en: Reduce query rate or distribute reads across accounts
    resolution: evidence-deferred
    failed_or_passed_gates:
      zh: 工程上可能改变关联但当前来源不证明用于本候选的真实实现或防御观察效果；记录很旧不等于攻击者稀释取得时间。失败于结论级证据门，不登记NM-ST。
      en: Could change correlation in principle but current sources do not establish an implementation or observation effect for this candidate.
        Old records do not mean the actor diluted acquisition over time. Conclusion-level evidence fails and NM-ST is not assigned.
breadth_convergence:
  proposed_niji_child_count: 1
  breadth_gap_explained: true
  explanation:
    zh: 八个ATT&CK子项主要按承载面、平台与材料分组；这些差异分别进入三种具体NJA和缓解应用。去名后，静态残留重述父核心，材料类型归邻接，自动交付只有越界时才纳入且其独立子项归属未解决，业务外观/表示/频率没有独立充分证据。仅次生记录角色同时通过可控性、来源边界、条件性痕迹差和防御差门；一个子项并不声称覆盖全部八类变体，未分项行为仍由父级覆盖。
    en: The eight ATT&CK children primarily partition carriers platforms and material. Their differences inform three concrete analytics
      and mitigation applications. After removing labels static residue restates the parent material classes are adjacent automatic delivery
      enters only with crossing and has unresolved child ownership and business appearance representation and frequency lack independent
      support. Only secondary-record role passes control provenance conditional trace and defense gates. One child does not claim to partition
      every variant; unpartitioned behavior remains parent-covered.
  research_reviewer: T1552 research agent
  primary_review_recorded: true
  primary_review_required:
    zh: 主审逐行核对来源角色及8→1差距，并与T1558/T1539和NJT-0178合并审查后才可正式建立分类。
    en: Primary review must check source role and the eight-to-one gap row by row and converge T1558 T1539 and NJT-0178 boundaries before
      canonical taxonomy is established.
  primary_review_notes:
    zh: 主 Agent 已逐行核对八项并审阅七轴失败门。只有可证明形成于先前交互/共享/复制链的记录角色通过边界；现行供给配置、来源不明旧文件、正常自动交付与材料名称不补子项。8→1差距接受，单项不宣称划分全部变体。
    en: The primary agent reviewed all eight rows and seven axis gates. Only a record demonstrably created by prior interaction, sharing,
      or copying passes the provenance boundary; current supply, unknown old files, normal automatic delivery, and material names add no
      children. The breadth gap is accepted without claiming an exhaustive variant partition.
