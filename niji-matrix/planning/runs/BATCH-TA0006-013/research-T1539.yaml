    - REF-000366
    - REF-000379
    - TMP1539-REF-api
    evidence_mode: strongly-inferred
    confidence: high
    status: draft
  cases:
  - schema_version: 1.0.0
    type: case
    id: TMP1539-CASE-aitm
    name_zh: 微软记录的 AiTM 认证流 Cookie 截获
    name_en: Microsoft-Observed Cookie Interception in an AiTM Authentication Flow
    actor_or_campaign: Microsoft-observed AiTM phishing campaign
    subject_refs:
    - TMP1539-PARENT
    description_zh: 微软调查记录，代理站点在真实认证流中取得 Cookie，攻击者随后用窃取的会话材料访问 Outlook Online。这里只把来源直接记录的 Cookie 截获作为父级取得事实；后继邮箱访问不反向证明每次提取的具体实现，也不作为可信客户端代取子项案例。
    description_en: Microsoft records a proxy site obtaining cookies during genuine authentication and an actor later accessing Outlook Online
      with stolen session material. This case uses only the directly reported interception as the parent's acquisition fact; later mailbox access
      does not identify the implementation of every extraction and does not support the trusted-client child.
    time_range: Activity since September 2021; reported 2022-07-12
    target_sectors_zh:
    - Office 365 组织用户
    target_sectors_en:
    - Organizational Office 365 users
    evidence_refs:
    - REF-000067
    confidence: high
    status: draft
  detection_strategies: *id001
  detection_analytics: *id002
  mitigations: *id003
  relationships: []
research:
  fixed_baseline:
    domain: enterprise-attack
    version: '19.1'
    inventory_file: planning/runs/BATCH-TA0006-013/attack-baseline-inventory.yaml
    source_ref: REF-000625
    original_attack_subtechniques_imported: false
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - zh: 原始父描述涵盖磁盘、浏览器及其他客户端内存、真实网络流、JavaScript 和恶意代理，但没有 ATT&CK 子项。
      en: The original parent description spans disk, browser and other-client memory, actual network traffic, JavaScript, and malicious proxies,
        with no ATT&CK children.
    breadth_trigger: ordinary
    coverage_resolutions:
    - dimension: persisted-cookie-artifact
      resolution: parent-core
      rationale_zh: 有精确 CookieMiner 复制上传样本证据，构成父级取得路径；现有证据未证明仅位置变化就是独立匿迹设计，不把 Safari、Chrome、SQLite 或 Cookie 文件作为 NJS。
      rationale_en: Precise CookieMiner copy-and-upload sample evidence establishes a parent acquisition path; location alone is not independently
        established as a stealth design, so Safari, Chrome, SQLite, and cookie files do not define children.
      evidence_refs:
      - REF-001078
    - dimension: foreign-process-volatile-read
      resolution: parent-core
      rationale_zh: 固定父行为包含运行态取得。绕过磁盘读取可改变观察面，但当前原始材料没有支持普遍的无工件或低告警收益；进程句柄也不证明值读取，不独立立项。
      rationale_en: The fixed parent includes runtime acquisition. Avoiding disk reads can change visibility, but the primary material does not
        establish generally artifact-free or low-alert benefit; process handles do not prove value reads, so no separate child is established.
      evidence_refs:
      - REF-000625
      - REF-000366
    - dimension: original-trusted-client-material-return
      resolution: niji-variable-candidate
      proposed_child_ref: TMP1539-CH-client
      rationale_zh: 主动选择材料处理身份，让原客户端承担读取和解密、受控收件者取得返回，改变文件读取归因与防御观察点。Google 官方攻击类别观察与活动客户端作者实验支持可行性，规避收益仅作条件推断。
      rationale_en: Deliberately selecting the material-handler identity lets the original client read or decrypt and a controlled recipient receive
        the return, changing file-read attribution and defensive vantage point. Google's category observation and the live-client author experiment
        support feasibility, with evasion benefit only conditionally inferred.
      evidence_refs:
      - TMP1539-REF-debug
      - TMP1539-REF-api
      - TMP1539-REF-client
    - dimension: genuine-authentication-flow-side-copy
      resolution: parent-core
      rationale_zh: 微软事件直接支持实际 Cookie 截获；材料阶段由本父拥有，路径中介变量由 NJT-0136 和既有钓鱼入口对象拥有，不仅因 Cookie 正在返回就另建子项。新材料已由真实服务形成，区别于 NJT-0166 离权威构造。
      rationale_en: Microsoft's incident directly supports actual cookie interception. This parent owns the material result, while NJT-0136 and
        existing phishing-entry objects own interposition variables. A cookie being returned does not justify another child; a genuine service
        has already formed it, unlike NJT-0166 off-authority construction.
      evidence_refs:
      - REF-000067
    - dimension: browser-session-operation-without-export
      resolution: adjacent-technique
      adjacent_refs:
      - NJT-0145
      rationale_zh: 操作原浏览器、读页面或代理已认证请求，没有实际 Cookie 返回时不达本对象完成点。作者将 cookies dump 与 browser-takeover 分列，不能以后一能力补前一结果。
      rationale_en: Operating the original browser, reading pages, or proxying authenticated requests without cookie returns does not meet this
        object's completion gate. The author distinguishes cookies dump from browser-takeover, and the latter capability cannot prove the former
        result.
      evidence_refs:
      - TMP1539-REF-client
    candidate_stealth_axes_examined:
    - axis: material-handler-identity-and-output-boundary
      attacker_control_zh: 选择由原有权客户端实际取值并将返回交给受控接收者。
      attacker_control_en: Select actual retrieval by the original authorized client with return to a controlled recipient.
      trace_change_zh: 外部读库或独立解密转为浏览器内部读取，加上控制调用与返回通道。
      trace_change_en: External database access or independent decryption becomes browser-internal reads plus control calls and a return channel.
      defender_effect_zh: 仅按外部 reader 检测失去覆盖，需要浏览器控制与值承载输出关联。
      defender_effect_en: External-reader-only rules lose coverage, requiring browser-control and value-output correlation.
      sibling_boundary_zh: 父核心外进程读工件或内存不纳入；单纯借浏览器访问资源归 NJT-0145。
      sibling_boundary_en: Parent-core foreign-process artifact or memory reads are excluded, as is resource access merely borrowed through a
        browser under NJT-0145.
      normal_counterexample_zh: 批准的开发调试、用户导出、企业扩展和自动化测试。
      normal_counterexample_en: Approved debugging, user exports, enterprise extensions, and automation tests.
      defense_difference_zh: 优先控制 host/cookies/debugger 权限及配置隔离，而非只保护数据库文件或解密键。
      defense_difference_en: Prioritize host, cookies, and debugger permissions and profile isolation rather than database files or decryption
        keys alone.
      resolution: formal-proposed
      confidence: medium
    - axis: persisted-versus-volatile-location
      resolution: parent-core
      gate_not_met: stealth-distinct-evidence
      notes_zh: 两者需要不同传感器但位置不自动证明匿迹。内存可能由系统分页、崩溃或工具输出形成工件，不能称普遍无盘；也不机械复制 NJT-0178 子项。
      notes_en: Different sensors are needed, but location does not establish stealth. Paging, crashes, or tool output may produce artifacts from
        memory; neither universally diskless behavior nor a copy of NJT-0178's children is justified.
    - axis: live-transmission-versus-stored-copy
      resolution: adjacent-and-parent-core
      gate_not_met: independent-sibling-boundary
      notes_zh: 材料取得由本父覆盖，已建立路径控制变量由 NJT-0136 拥有；证据不足以再拆“返回截获”。TLS 流量可见性不等于 Cookie 内容可见性。
      notes_en: This parent covers material acquisition and NJT-0136 owns the established path-control variable; another return-interception child
        lacks an independent boundary. TLS flow visibility is not cookie-content visibility.
    - axis: selective-domain-and-cookie-filtering
      resolution: evidence-deferred
      gate_not_met: observation-effect-evidence
      notes_zh: CookieMiner 的目标过滤说明选择目标，但没有证明过滤独立降低监测、事件量或归因。暂不把选择高价值站点本身写成匿迹子项。
      notes_en: CookieMiner's filtering shows target selection without proving independently reduced monitoring, event volume, or attribution.
        Selection of valuable sites alone is not an evasion child.
    - axis: cookie-format-browser-and-platform
      resolution: not-stealth-distinct
      gate_not_met: stable-attacker-controlled-stealth-variable
      notes_zh: 浏览器、操作系统、JWT 样式、SQLite、文本导出及字段格式决定实现，不决定稳定观察差。
      notes_en: Browser, OS, JWT-like style, SQLite, text export, and field format determine implementation rather than a stable visibility difference.
    - axis: valid-expired-revoked-and-device-constrained
      resolution: cross-cutting-outcome
      gate_not_met: acquisition-variable
      notes_zh: 这些状态影响取得后风险，横跨全部路径。攻击者可能选择时机，但当前证据不足以据此建立时序稀释或规避子项。
      notes_en: These states affect post-acquisition risk across paths. Although an actor can select timing, current evidence does not establish
        a temporal-dilution or evasion child.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零 ATT&CK 子项不限制开放搜索。主动比较了处理身份、持久位置、运行态、真实传递、选择性、格式和有效性；只保留一个具备控制变量、痕迹因果、正常反例与独立防御差的候选。第二次自审用于检查 NJT-0178、NJT-0145 与 NJT-0136 的重复风险，不等于独立主审已通过。
      en: Zero ATT&CK children did not limit open search. Handler identity, persistence, runtime, actual transmission, selectivity, format, and
        usability were examined, leaving one candidate with control, trace causality, normal counterexamples, and a defense distinction. The second
        self-review checked duplication with NJT-0178, NJT-0145, and NJT-0136 and does not represent independent primary-review approval.
  phase_model:
  - phase: opportunity
    sufficient_zh: 文件或进程访问权限、调试端点、扩展权限、流量终结能力。
    sufficient_en: File or process access authority, debugger exposure, extension permission, or traffic-termination capability.
    does_not_establish_zh: Cookie 已返回或已进入控制。
    does_not_establish_en: A cookie return or material control.
  - phase: ciphertext-or-key-access
    sufficient_zh: 密文副本或解密键读取被取证确认。
    sufficient_en: Forensically confirmed access to a ciphertext copy or decryption key.
    does_not_establish_zh: 未执行或失败的解密不能证明完整会话材料。
    does_not_establish_en: Unperformed or failed decryption does not establish complete session material.
  - phase: material-control
    sufficient_zh: 完整可读或可呈现 Cookie 材料与攻击者受控接收者相连；不要求已外传至远端。
    sufficient_en: Complete readable or presentable cookie material is connected to an adversary-controlled recipient; remote exfiltration is
      not required.
    does_not_establish_zh: 当前有效、没有其他呈现约束或可被服务接受。
    does_not_establish_en: Current validity, absence of other presentation constraints, or service acceptance.
  - phase: usability
    sufficient_zh: 独立核实服务端会话、有效期、撤销、绑定和必要配套材料；不对真实生产会话自动试用。
    sufficient_en: Independently establish server session, lifetime, revocation, binding, and required companion material without automatically
      testing real production sessions.
    does_not_establish_zh: 攻击者已呈现或完成资源操作。
    does_not_establish_en: Adversary presentation or resource action.
  - phase: successor-presentation-and-acceptance
    sufficient_zh: 材料提交归 T1550，对身份或会话的实际接受和访问归 NJT-0061；页面读取可归 NJT-0145。
    sufficient_en: Material submission belongs to T1550, actual identity or session acceptance and access to NJT-0061, and browser content reads
      may belong to NJT-0145.
    does_not_establish_zh: 后继结果不能倒填本批未观察到的取值路径。
    does_not_establish_en: Later outcomes cannot backfill an unobserved acquisition path.
  protection_effects:
  - control: HttpOnly
    supported_effect_zh: 限制网页的非 HTTP 脚本接口读取。
    supported_effect_en: Restricts web non-HTTP script-interface reads.
    limits_zh: 不限制底层文件、内存或具备 Cookie 权限的浏览器 API；不阻止脚本驱动浏览器发送其本应附带的 Cookie。
    limits_en: Does not constrain underlying files, memory, or a permitted cookie API and does not prevent script-driven browser requests from
      carrying normally attached cookies.
    evidence_refs:
    - TMP1539-REF-rfc
    - TMP1539-REF-api
  - control: Secure
    supported_effect_zh: 限制 Cookie 经安全通道传递。
    supported_effect_en: Restricts cookie transmission to secure channels.
    limits_zh: 不是静态加密、API 隔离或恶意可信 TLS 终结点防护。
    limits_en: Is not at-rest encryption, API isolation, or protection against a malicious trusted TLS terminator.
    evidence_refs:
    - TMP1539-REF-rfc
    - REF-000067
  - control: SameSite
    supported_effect_zh: 限制跨站请求附带 Cookie，降低部分跨站请求风险。
    supported_effect_en: Restricts cookie attachment to cross-site requests and reduces some cross-site request risks.
    limits_zh: 不是秘密读取控制或已获材料的普遍重放防护；需按业务流程和用户代理实现验证。
    limits_en: Is not secret-read control or general replay protection for acquired material; verify against application flows and user-agent
      behavior.
    evidence_refs:
    - TMP1539-REF-bis
  - control: local-app-bound-encryption
    supported_effect_zh: 把静态材料解密与应用身份、机器和相应服务边界绑定，提高外部同用户程序的读取成本。
    supported_effect_en: Binds at-rest material decryption to application identity, machine, and corresponding service boundaries, raising cost
      for an external same-user program.
    limits_zh: 不等同发送者或设备续期绑定。提权、原浏览器进程控制或配置不支持会改变保护；257 只反映失败验证。
    limits_en: Is distinct from sender or device renewal binding. Elevation, original-browser process control, or unsupported configuration changes
      protection; event 257 reflects failed verification only.
    evidence_refs:
    - TMP1539-REF-abe
    - TMP1539-REF-debug
  - control: DBSC-and-sender-device-binding
    supported_effect_zh: 本提案核实的 DBSC 在短期 Cookie 续期时要求设备私钥持有证明，使独立复制者难以持续续用。
    supported_effect_en: DBSC verified in this proposal requires device-private-key proof for short-lived-cookie renewal, hindering continued
      use by an independent copier.
    limits_zh: DBSC 不是每次 Cookie 请求的 sender constraint，不能保证短寿值到期前无法使用，也不保证材料无法读取。应用必须强制短寿 Cookie；兼容回退、密钥注册阶段受控及原客户端持续控制仍重要。其他每请求 PoP 需要具体协议证据，当前不作泛化。
    limits_en: DBSC is not a sender constraint on every cookie request, does not guarantee unusability before expiry, and does not make material
      unreadable. Applications must require short-lived cookies; compatibility fallback, compromise during key registration, and persistent original-client
      control still matter. Other per-request proof mechanisms require specific protocol evidence and are not generalized here.
    evidence_refs:
    - TMP1539-REF-dbsc
    - TMP1539-REF-client
  telemetry_mapping:
  - source: Windows Security 4663
    normalized_fields:
      timestamp: TimeCreated
      device_id: Computer
      subject_logon_id: SubjectLogonId
      process_id: ProcessId normalized from hexadecimal
      process_name: ProcessName
      object_type: ObjectType
      object_path: ObjectName
      access_mask: AccessMask
    prerequisites_zh: 启用相应对象审计并为确切 Cookie 文件设置 SACL；ReadData 为文件读取语义，不能把目录 ListDirectory 同值误作 Cookie 读取。
    prerequisites_en: Enable the relevant object auditing and SACL on exact cookie files; ReadData is file-read semantics and the same-valued
      directory ListDirectory must not be treated as a cookie read.
  - source: Sysmon Operational Event 1
    normalized_fields:
      timestamp: UtcTime
      device_id: Computer
      process_guid: ProcessGuid
      process_id: ProcessId
      image_path: Image
      command_line: CommandLine
      parent_process_guid: ParentProcessGuid
      user: User
    prerequisites_zh: 按当前部署配置采集，保留进程谱系；Event 5 只能补结束时间，不要求它提供 ParentProcessGuid。
    prerequisites_en: Collect under the deployed configuration and retain lineage; Event 5 can enrich termination time and is not required to
      supply ParentProcessGuid.
  - source: Sysmon Operational Event 3
    normalized_fields:
      timestamp: UtcTime
      device_id: Computer
      process_guid: ProcessGuid
      image_path: Image
      source_ip: SourceIp
      source_port: SourcePort
      destination_ip: DestinationIp
      destination_port: DestinationPort
    prerequisites_zh: 网络连接采集非默认启用，loopback 和本地控制连接必须先实测；不记录 Cookie 或 CDP 正文。
    prerequisites_en: Network collection is not enabled by default; validate loopback and local controller connections first. It does not record
      cookie or CDP bodies.
  - source: Sysmon Operational Event 10
    normalized_fields:
      timestamp: UtcTime
      device_id: Computer
      source_process_guid: SourceProcessGUID
      target_process_guid: TargetProcessGUID
      source_image: SourceImage
      target_image: TargetImage
      granted_access: GrantedAccess
    prerequisites_zh: 需要配置目标浏览器与预期访问过滤。可读权限不等于实际读取了 Cookie，Event 8 仅为可选注入线索。
    prerequisites_en: Configure target-browser and expected-access filters. Readable rights do not establish actual cookie reads; Event 8 is optional
      injection evidence.
  - source: Explicit incident-response evidence records
    normalized_fields:
      evidence_id: Restricted evidence store identifier
      complete_value_present: Analyst verified complete material; boolean
      material_match_result: Restricted comparison or HMAC equality result
      recipient_control: Evidence-backed control assessment
      authorization_result: Approved task and owner review
    prerequisites_zh: 这是明确部署的调查记录而不是任何浏览器默认 API 审计；原始值受限保存，普通告警只保留结论和关联键。
    prerequisites_en: This is an explicitly deployed investigation record rather than any browser's default API audit; restrict raw values and
      retain conclusions and join keys in ordinary alerts.
  evidence_coverage:
    parent_behavior_keys:
    - REF-000625
    - REF-000067
    - REF-001078
    boundary_keys:
    - TMP1539-CLM-stage
    - TMP1539-CLM-boundary
    - CLM-000886
    mechanism_support:
    - subject_ref: TMP1539-PARENT
      mechanism_ref: NM-BT
      evidence_keys:
      - REF-000067
      - REF-001078
      - TMP1539-REF-debug
      strength: conditional-observation-inference
    - subject_ref: TMP1539-CH-client
      mechanism_ref: NM-BT
      evidence_keys:
      - TMP1539-REF-debug
      - TMP1539-REF-api
      - TMP1539-REF-client
      strength: official-category-observation-plus-author-experiment-and-scoped-inference
    child_existence_support:
    - child_ref: TMP1539-CH-client
      evidence_keys:
      - TMP1539-REF-debug
      - TMP1539-REF-api
      - TMP1539-REF-client
      confidence: medium
      case_attribution: none
    unsupported_or_deferred:
    - zh: 不主张所有 Cookie 窃取都会绕过 MFA、所有新版 Chrome 能直接读取默认会话、或浏览器进程受控就证明 Cookie 已返回。
      en: No claim that all cookie theft bypasses MFA, every new Chrome can directly read default-profile sessions, or browser control proves
        a cookie return.
    - zh: 未证明材料位置本身、目标域过滤或使用合法 API 可普遍降低实测告警率；未把备份、内存句柄或密文副本升级为完整值控制。
      en: No proof that material location, domain filtering, or legitimate API use generally reduces measured alert rates; backups, memory handles,
        and ciphertext copies are not upgraded to complete-value control.
  source_audit:
    searched_on: '2026-11-05'
    source_selection_zh: 以 Google 平台文档、IETF Cookie 标准及草案、Microsoft 与 Unit42 原始调查和 SpecterOps 作者实验为证据。搜索中看到的媒体转述、社区帖子和 Cookie 数量统计没有用作结论支持。
    source_selection_en: Evidence uses Google platform documentation, IETF cookie standards and a working draft, original Microsoft and Unit42
      investigations, and a SpecterOps author experiment. Media summaries, community posts, and cookie-volume statistics found in search do not
      support conclusions.
    primary_queries:
    - site:security.googleblog.com app bound encryption cookies
    - site:developer.chrome.com remote debugging cookie theft
    - site:microsoft.com cookie theft AiTM session cookie
    - browser memory cookie extraction original research
    - site:unit42.paloaltonetworks.com CookieMiner
    - site:developer.chrome.com device bound session credentials
    existing_source_rechecks:
    - reference_ref: REF-000067
      accessed: '2026-11-05'
      locator: How AiTM phishing works; first Post-breach BEC paragraphs; report date 2022-07-12
      proves_zh: 真实认证流 Cookie 截获及该活动的后继 Outlook Online 使用。
      proves_en: Cookie interception in a genuine authentication flow and later Outlook Online use in that campaign.
      does_not_prove_zh: 可信客户端代取子项、全部站点的 MFA 绕过或任意端点提取实现。
      does_not_prove_en: The trusted-client child, universal MFA bypass, or an arbitrary endpoint-extraction implementation.
    - reference_ref: REF-001078
      accessed: '2026-11-05'
      locator: Stealing Cookies; Figure 1 shell-script copy and curldrop upload; Conclusion
      publication_date: null
      proves_zh: 被分析 CookieMiner 样本的 Cookie 工件复制与上传能力。
      proves_en: Cookie-artifact copy and upload capability in the analyzed CookieMiner sample.
      does_not_prove_zh: 每个受害者上成功恢复有效 Cookie、资金被取走、或作者关于 MFA 的条件猜测已经发生。
      does_not_prove_en: Recovery of valid cookies on every victim, fund withdrawal, or realization of the author's conditional MFA outcome.
    - reference_ref: REF-000366
      accessed: '2026-11-05'
      verified_url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
      locator: Event 1, 3, 5, 8, 10 and 11; configuration and enabled-event caveats
      proves_zh: 事件存在和具体语义，不提供 Cookie 值或完整注入覆盖保证。
      proves_en: Event existence and semantics, not cookie values or a guarantee of complete injection coverage.
    - reference_ref: REF-000379
      accessed: '2026-11-05'
      verified_url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663
      locator: Event XML; Object and Process Information; ReadData and AccessMask; SACL prerequisite
      proves_zh: 文件访问权被使用及可提供字段，不证明被读字节内容。
      proves_en: Exercised file access and available fields, not the bytes read.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已对照实际 NJT-0001 父、时间稀释子项及 DET/NJA/MIT 范例。父子定义、匿迹、范围均逐段承担具体职责，范围含正常反例和相邻对象，攻防模型分离。父与子各用证据支持的 NM-BT，不照抄范例机理或数量。研究和正式提案共用正文是交接序列化，未跨候选替换名称生成。
      en: Compared against the actual NJT-0001 parent, temporal-dilution child, and DET/NJA/MIT examples. Parent and child definition, stealth,
        and scope paragraphs answer their specific responsibilities, including normal counterexamples and adjacent boundaries, with separate threat
        models. Each uses supported NM-BT without copying exemplar mechanisms or counts. Shared prose between this handoff and its proposal is
        serialization for transfer, not cross-candidate name substitution.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML scalar quoting and canonical lowercase telemetry-field normalization
    - Copy manually authored proposal objects into the handoff template
    - Schema checks with temporary research-ID patterns allowed; no ID allocation
  limitations:
    paragraphs:
    - zh: 这是完整研究交接，不是通过正式门禁的矩阵对象。源材料分别证明平台能力、样本代码、实际活动及本提案的有条件推断；不能相互拼接成每一取得路径都在同一事件出现的链。新增子项没有适格的逐事件恶意现场案例，case_refs 保持空数组。
      en: This is a complete research handoff, not a matrix object that passed formal gates. Sources separately establish platform capability,
        sample code, actual activity, and conditional proposal inference; they cannot be spliced into a chain where every path occurred in the
        same incident. The new child has no suitable per-incident malicious field case and keeps an empty case_refs array.
    - zh: 两项 NJA 是基于实际可得事件与明确调查工件的分析设计，未在目标环境实测准确率、loopback 覆盖或时间窗。只有端点元数据时应保留疑似层级；真实认证代理路径若无内容证据仍是当前检测空白。父级 available 表示有直接适用防御，不表示所有路径均覆盖。
      en: The two analytics are designs using available events and explicit investigation artifacts, without target-environment validation of
        accuracy, loopback coverage, or windows. Endpoint metadata alone supports suspicion; genuine proxy paths without content evidence remain
        a detection gap. Parent available coverage means applicable defense exists rather than every path being covered.
  rejected_mechanisms:
  - mechanism_ref: NM-FD
    reason_zh: Cookie 的合法外观或后继会话连续性主要属于呈现和使用；取得阶段的客户端身份归因差已用 NM-BT 表达，未有独立证据证明额外特征伪装，避免重复机理。
    reason_en: Legitimate cookie appearance and later session continuity chiefly concern presentation and use. NM-BT already models the acquisition-stage
      client-identity visibility gap, with no independent evidence of additional feature disguise, so a duplicate mechanism is avoided.
  - mechanism_ref: NM-DO
    reason_zh: TLS、静态加密和 Cookie 编码不是本次有证据的攻击者遮蔽设计，不能仅因值不透明就映射。
    reason_en: TLS, at-rest encryption, and cookie encoding are not evidenced adversary obscuration designs here, and opacity alone does not justify
      mapping.
  - mechanism_ref: NM-ST
    reason_zh: 没有取得阶段低频、跨时或跨源稀释的结论级证据。
    reason_en: There is no conclusion-level evidence of rate, temporal, or source dilution during acquisition.
  open_questions:
  - zh: 主流程须裁决是否接纳一个按处理身份划分的子项；如果认为与 NJT-0145 重复，仍应保留 Cookie 返回完成点并明确证据缺口，不改成浏览器受控即取得。
    en: The primary flow must decide whether to admit the handler-identity child. If considered duplicative of NJT-0145, retain the cookie-return
      completion gate and explicit evidence gap rather than equating browser control with acquisition.
  - zh: 主流程须按共享身份复核微软同一活动的临时 CASE；与 CASE-000043 的中心事实不同，建议 split，但不要求为凑案例保留。
    en: The primary flow must review the temporary Microsoft-campaign case against shared identity. Its central facts differ from CASE-000043,
      supporting split, but it need not be retained to fill case counts.
  - zh: MIT-000147 拟加父子应用与来源；新材料边界缓解中的 DBSC 属续期风险降低而非取得阻断，正式编辑不可将其合并成“防止所有 Cookie 窃取”。
    en: MIT-000147 proposes parent and child applications and sources. DBSC in the new boundary mitigation reduces renewal risk rather than blocking
      acquisition and must not be edited into prevention of all cookie theft.
integration:
  status: pending
  resolutions:
  - candidate: REF-000625
    resolution: reuse
    rationale_zh: 固定 Enterprise 19.1 的 T1539 父行为及零子项已由本批工作簿快照核实；仅补定位，不创建同 URL 来源。
    rationale_en: The batch workbook snapshot verifies T1539 parent behavior and zero children at fixed Enterprise 19.1; update the locator only
      rather than duplicate the URL.
    proposed_locator_addition: Enterprise 19.1 T1539 Steal Web Session Cookie parent description and zero active sub-techniques; BATCH-TA0006-013/attack-baseline-inventory.yaml
  - candidate: REF-000067
    resolution: extend
    rationale_zh: 复用同一微软原始报告；现有定位偏后继 BEC，补充精确 Cookie 段落与2026-11-05重新访问日期，不改来源身份。
    rationale_en: Reuse the same original Microsoft report; its current locator emphasizes later BEC, so add exact cookie passages and a 2026-11-05
      access date without changing identity.
    proposed_locator_addition: How AiTM phishing works; Tracking an AiTM phishing campaign; Post-breach BEC first paragraphs; session interception
      versus later Outlook Online acceptance
  - candidate: REF-001078
    resolution: extend
    rationale_zh: 复用 Unit42 同 URL 样本分析，补 Stealing Cookies/Figure 1 与准确证明边界；网页本次未展示可靠发布日期，保持 null，不推测日期或作者。
    rationale_en: Reuse the Unit42 analysis at the same URL and add Stealing Cookies/Figure 1 plus exact evidentiary limits. The page did not
      expose a reliable publication date in this retrieval, so retain null without guessing author or date.
    proposed_locator_addition: Stealing Cookies and Figure 1 copy-and-upload script; Technical Details; Conclusion states conditional MFA outcome
      rather than confirmed exchange compromise
  - candidate: REF-000366
    resolution: reuse
    rationale_zh: Sysmon 事件字段和噪声约束身份相同；补 1、3、5、11 的官方事件定位可由主流程统一处理，不创建新的 Sysmon 来源。
    rationale_en: Sysmon field semantics and noise constraints have the same identity; the primary flow can add official locators for Events 1,
      3, 5, and 11 without a new Sysmon reference.
    proposed_locator_addition: Sysinternals Sysmon documentation Events 1 Process creation, 3 Network connection, 5 Process terminated, 8 CreateRemoteThread,
      10 ProcessAccess, 11 FileCreate; https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - candidate: REF-000379
    resolution: reuse
    rationale_zh: 4663 ReadData、进程和对象关联语义不变，直接复用。
    rationale_en: Reuse unchanged 4663 ReadData, process, and object-correlation semantics.
  - candidate: CLM-000886
    resolution: extend
    additional_subject_refs:
    - TMP1539-PARENT
    rationale_zh: 已有应用令牌与 Cookie、输入、伪造和后继使用边界结论可扩展主体，但新 Cookie 取得完成点及 NJT-0145 边界仍以本提案原子结论补充。
    rationale_en: The existing application-token, cookie, input, forgery, and successor boundary claim can extend subject coverage, with the new
      cookie completion gate and NJT-0145 boundary retained in this proposal's separate atomic claims.
  - candidate: CASE-000043
    resolution: split
    resulting_temporary_ref: TMP1539-CASE-aitm
    rationale_zh: 同一活动来源，但现有案例中心是接管后历史选择；取得阶段对象、时间及证据不同。新案例只保留 Cookie 截获，不复制财务线程选择或为可信客户端子项补证。
    rationale_en: 'The same campaign source has a different central event: the existing case is post-takeover history selection, whereas the proposed
      case is acquisition with distinct stage and facts. It retains only cookie interception, without duplicating finance-thread selection or
      supporting the trusted-client child.'
  - candidate: MIT-000147
    resolution: extend
    rationale_zh: 既有扩展来源、host/debugger 权限、浏览器进程写权限及会话寿命措施原义不变；增加 Cookie 取得主体应用。ABE 与 DBSC 不并入原 Measures，以新缓解对象单独承担其不同边界。
    rationale_en: Existing extension origin, host/debugger permission, browser-process write, and session-lifetime measures keep their identity;
      add cookie-acquisition applications. ABE and DBSC remain separate because their control boundaries differ from the original measures.
    additional_evidence_refs:
    - TMP1539-REF-debug
    - TMP1539-REF-api
    - TMP1539-REF-client
    additional_applications:
    - target_ref: TMP1539-PARENT
      use:
        paragraphs:
        - zh: 在高价值会话的浏览器配置禁止未批准扩展来源、敏感 host 和 debugger 权限，限制外部进程写入或调试，例外绑定具体版本、任务与期限。收到疑似取得告警后，先保全控制与返回证据，再隔离控制点并撤销目标应用会话。
          en: On profiles holding valuable sessions, prohibit unapproved extension origins, sensitive-host and debugger permissions, and external
            process writes or debugging. Bind exceptions to version, task, and expiry. On suspected acquisition, preserve control and return evidence,
            isolate the controller, and revoke target application sessions.
      expected_effect:
        paragraphs:
        - zh: 缩小能够把原会话 Cookie 返回给非批准接收者的客户端控制面，并减少材料取得后仍保持有效的会话窗口。
          en: Narrow client control capable of returning original session cookies to unapproved recipients and reduce the valid-session window
            after acquisition.
      limitations:
        paragraphs:
        - zh: 不能阻断已具备权限的外部工件读取或真实认证代理，批准扩展失陷仍需版本和结果监测；撤销效用取决于目标应用的实际传播。
          en: This does not block already-authorized external artifact reads or genuine authentication proxies, and compromised approved extensions
            still need version and outcome monitoring. Revocation depends on actual target-application propagation.
    - target_ref: TMP1539-CH-client
      use:
        paragraphs:
        - zh: 将开发调试隔离到无生产会话的专用配置，清点能读取目标域 Cookie 的扩展并移除无需求权限；监测活动浏览器被跨进程控制而非只匹配启动开关。例外须包含控制程序、配置和 Cookie 导出用途。
          en: Isolate developer debugging in dedicated profiles without production sessions, inventory extensions able to read target-domain cookies,
            and remove unnecessary permissions. Monitor cross-process control of live browsers rather than matching launch flags alone. Exceptions
            specify controller, profile, and cookie-export purpose.
      expected_effect:
        paragraphs:
        - zh: 把 Cookie 代取迫使到更明确的未批准权限或进程控制动作，并使合法调试配置不会自然携带生产会话。
          en: Force retrieval toward clearer unauthorized-permission or process-control actions and prevent legitimate debugger profiles from
            naturally carrying production sessions.
      limitations:
        paragraphs:
        - zh: 既有浏览器进程或获批扩展持续被控时仍可能返回值；Chrome 136 的默认目录开关限制不覆盖全部活动进程控制方法，必须按实际版本验证。
          en: A persistently controlled browser or approved extension may still return values. Chrome 136's default-directory switch restriction
            does not cover every live-process control method and must be validated by actual version.
  - candidate: DET-000159
    resolution: split
    resulting_temporary_ref: TMP1539-DET-acquisition
    rationale_zh: 原检测目标是同页内容读取，本策略目标为 Cookie 材料输出；不能把页面内容关联的 NJA-000170 扩展成 Cookie 已取得。
    rationale_en: The existing objective is co-viewed content reading, whereas this strategy targets cookie-material output; NJA-000170's page-content
      correlation cannot be extended into proof of cookie acquisition.
  - candidate: DET-000160
    resolution: defer
    rationale_zh: 浏览器代理与额外站点访问属于 NJT-0145；没有 Cookie 返回就不引用为本技术确认防御。
    rationale_en: Browser proxying and extra site access belong to NJT-0145 and are not referenced as confirmation defense here without cookie
      returns.
