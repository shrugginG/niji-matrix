    reference_refs:
    - REF-000625
    - REF-000067
    - REF-001078
    - REF-000366
    - REF-000379
    - TMP1539-REF-rfc
    - TMP1539-REF-bis
    - TMP1539-REF-abe
    - TMP1539-REF-debug
    - TMP1539-REF-api
    - TMP1539-REF-client
    - TMP1539-REF-dbsc
proposed_subtechniques:
- schema_version: 2.0.0
  type: evasion-subtechnique
  id: TMP1539-CH-client
  name:
    zh: 可信客户端会话 Cookie 代取
    en: Trusted-Client Session Cookie Retrieval
  summary:
    zh: 攻击者使持有会话的原可信客户端通过其 Cookie 服务返回完整值，将外部提取转为客户端内部读取和受控返回。
    en: An adversary makes the original trusted session client return complete values through its cookie facilities, converting external extraction
      into client-internal reads and controlled returns.
  aliases: []
  parent_ref: TMP1539-PARENT
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 可信客户端会话 Cookie 代取是攻击者控制浏览器内代码、具备适当权限的扩展或调试调用，使原本合法持有 Cookie 的客户端负责读取并返回完整值。关键变量是材料处理由有权访问正常会话的原客户端执行，攻击者控制调用或接收面；不是浏览器产品、某条调试命令或文件所在位置。
      en: Trusted-Client Session Cookie Retrieval controls in-browser code, an appropriately permitted extension, or debugger calls so the client
        legitimately holding cookies reads and returns complete values. The defining variable is execution of material handling by the original
        client authorized for the normal session, with the adversary controlling the request or recipient, rather than a browser product, particular
        debugger command, or file location.
    - zh: 这一路径可以让浏览器照常解密或从活动 Cookie 服务取值，攻击者不必先在独立进程实现每一层解密。客户端须实际返回值，且接收者须受控；只开启调试端口、取得扩展 cookies 权限、注入成功或列出 Cookie 名称都只是前提。使用伪装程序单独解密密钥，或外进程直接读取浏览器内存，不因目标是浏览器而成为代取。
      en: The browser may perform its normal decryption or read active cookie services, avoiding an independent decryptor implementing every layer
        first. The client must actually return values to a controlled recipient. A debugger port, extension cookies permission, successful injection,
        or cookie-name inventory is only a prerequisite. A disguised standalone key decryptor or foreign-process memory read is not trusted-client
        retrieval merely because it targets a browser.
  stealth_characteristics:
    paragraphs:
    - zh: 可信客户端会话 Cookie 代取把关键材料读取保留在正常浏览器进程中，外部观察可能只看到调试、扩展通信或一个本地控制连接。若规则只警戒其他进程读 Cookie 数据库或调用解密函数，就可能漏掉由浏览器自身完成的读取；客户端签名、正常文件访问和已有登录不能替接收者授权背书。
      en: Trusted-Client Session Cookie Retrieval keeps the critical material read within a normal browser process, while external visibility
        may show only debugging, extension communication, or a local control connection. Rules focused on another process reading the cookie database
        or calling a decryptor may miss browser-performed reads; client signatures, normal file access, and an existing login do not authorize
        the recipient.
    - zh: 代取仍留下控制面痕迹，且版本条件十分重要。Google 限制 Chrome 136 起通过开关调试默认数据目录，因此带新目录的普通启动不等于能读取旧会话。作者在活动进程启用调试的实验说明另一路径能力，却需要额外进程控制，不能据此声称所有新版、所有配置可直接提取。额外访问、端口、进程访问和输出都是剩余观察点。
      en: Retrieval still leaves control-plane residue, with important version conditions. Google's Chrome 136 change restricts switch-based debugging
        of the default data directory, so ordinary startup with a new directory does not imply access to old sessions. An author's experiment
        enabling debugging inside a live process demonstrates another capability requiring additional process control, not direct extraction on
        every new version or configuration. Extra access, ports, process access, and output remain observable.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入需同时证明原客户端处理既有会话材料、攻击者控制调用或收件者，以及完整 Cookie 值实际返回。扩展 Cookie API 与浏览器调试接口是实现实例，可共享这个边界；网页 document.cookie 仅在其确实读取可访问的会话值时纳入，不推定可读 HttpOnly。外部内存扫描、直接数据库解密和取得但未使用的
        ABE 键只在父级或相邻取用技术中评价。
      en: Inclusion requires the original client handling established session material, adversary control of a request or recipient, and actual
        return of complete cookie values. Extension-cookie APIs and browser debugger interfaces are implementations sharing this boundary; document.cookie
        applies only when it actually reads an accessible session value, without presuming HttpOnly visibility. External memory scanning, direct
        database decryption, and an acquired but unused ABE key are assessed at parent level or under adjacent retrieval techniques.
    - zh: 与 NJT-0145 的区别是取得对象和完成结果：驱动浏览器访问页面、读邮件或借设备身份请求资源没有把 Cookie 返回时，属于会话内内容介入而不是本子项。NJT-0147 的授权或解锁边界被越过可独立并列，但客户端 API 的存在本身不证明保管库越界。批准的开发调试、用户导出和具备相同权限的企业扩展是正常反例，须按发布来源、版本、具体配置和目的核对。
      en: 'The distinction from NJT-0145 is the acquired object and completion result: driving page access, reading mail, or requesting resources
        under the device identity without returning cookies is browser-session content interposition rather than this child. A separately evidenced
        crossing of NJT-0147''s authorization or unlock boundary can coexist, but a client API''s presence does not itself prove a vault crossing.
        Approved debugging, user exports, and enterprise extensions with identical permissions are normal counterexamples requiring provenance,
        version, configuration, and purpose checks.'
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在受管 Windows 工作站上，攻击者有终端执行或已侵入扩展的能力，但独立进程读取密文受应用绑定阻碍时，可能转向浏览器已有取值功能。目标用户需有相应会话，且调用能触达实际保存它的配置；全新测试配置或空 Cookie 存储没有目标材料。返回后是否转移到其他机器使用，仍是独立阶段。
        en: On a managed Windows workstation, an actor with endpoint execution or a compromised extension may turn to existing browser retrieval
          facilities when application binding obstructs independent ciphertext reads. The user needs the relevant session and the call must reach
          the profile holding it; a fresh test profile or empty cookie store has no target material. Subsequent transfer for use on another machine
          remains a separate stage.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要被允许的扩展与目标 host 权限、可访问的调试端点，或足以改变活动浏览器执行的能力，并须控制材料接收者。应用绑定加密、默认配置的调试限制和普通账户的进程写权限约束会提高前提；不假设单凭网络接近或任何已签名进程即可获取。
          en: The actor needs an extension with permitted target-host access, a reachable debugger endpoint, or authority sufficient to alter
            live browser execution, plus control over the material recipient. Application-bound encryption, default-profile debugger restrictions,
            and limits on ordinary-account process writes raise prerequisites; network proximity or any signed process alone is not assumed sufficient.
      defender_model:
        paragraphs:
        - zh: 防守方可见浏览器进程启动参数、版本和配置路径、扩展清单以及部分跨进程或网络事件，但通常没有默认生成的每次 Cookie API 返回审计。只有调试连接与注入迹象时，可证明未批准控制或高风险机会；需要取证返回、受控测试记录或可验证输出才可确认材料控制。服务端同设备会话连续性不填补这个端点证据缺口。
          en: The defender can observe browser startup arguments, version and profile path, extension inventory, and some cross-process or network
            events, but normally lacks a default audit of every cookie-API return. Debugger connections and injection indications establish unauthorized
            control or high-risk opportunity; forensic returns, controlled-test records, or verifiable output are needed to confirm material control.
            Server-side same-device continuity does not fill this endpoint evidence gap.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 内部取值避开外部读取规则
      en: Internal retrieval bypasses external-reader rules
    analysis:
      paragraphs:
      - zh: 攻击者选择由原客户端取值，再把返回交给自己，而不是以另一程序直接读取受保护 Cookie 工件。数据库和正常解密操作可能仍归属于浏览器，防守方若没有控制调用及输出的可见性，就无法从文件访问主体推断非法收件者。匿迹收益来自检测观察面的偏移；调试或进程控制事件存在时仍可发现前提，材料本身的取得必须另证。
        en: The actor selects retrieval by the original client and takes its return instead of having another program directly read protected
          cookie artifacts. Database access and ordinary decryption may remain attributed to the browser; without request-control and output visibility,
          a defender cannot infer an unauthorized recipient from the file-reader identity. The stealth benefit is a shift in the detection vantage
          point. Debugger or process-control events can still reveal prerequisites, while material acquisition requires separate evidence.
    evidence_refs:
    - TMP1539-REF-debug
    - TMP1539-REF-api
    - TMP1539-REF-client
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_refs:
      - TMP1539-DET-acquisition
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000147
      - TMP1539-MIT-boundaries
  evidence:
    claim_refs:
    - TMP1539-CLM-client
    - TMP1539-CLM-stage
    - TMP1539-CLM-debuglimit
    - TMP1539-CLM-telemetry
    case_refs: []
    reference_refs:
    - TMP1539-REF-debug
    - TMP1539-REF-api
    - TMP1539-REF-client
    - TMP1539-REF-abe
    - REF-000366
    - REF-000379
    - TMP1539-REF-dbsc
  research:
    limitations:
      paragraphs:
      - zh: Google 官方只报告此类攻击增加，未公布逐事件工件和检测率；活动进程实验是作者能力演示，不是受害者案例。因此子项存在与受限观察差有证据，普遍降低告警率或对全部版本有效没有证据。未附加恶意案例以填补这个缺口。
        en: Google reports growth in this attack category without per-incident artifacts or detection rates; the live-process experiment is an
          author's capability demonstration rather than a victim case. Evidence therefore supports existence and a scoped visibility difference,
          not generally reduced alert rates or effectiveness on every version. No malicious case is added to fill that gap.
      - zh: 能在原浏览器上持续操作的攻击者可能无需导出 Cookie 就取得页面内容；那种行为由 NJT-0145 单独建模。可用的 API 返回捕获取决于测试和调查部署，常规端点日志仍只形成疑似链。对原始值的验证须在受限证据环境进行，告警仅保留匹配结论和受控指纹。
        en: An actor persistently operating the original browser may obtain page content without exporting cookies; NJT-0145 models that behavior
          separately. API-return capture depends on test and investigation deployment, while routine endpoint logs may yield only a suspected
          chain. Raw-value verification belongs in a restricted evidence environment; alerts retain only the match conclusion and controlled fingerprint.
  lifecycle:
    status: draft
    version: 0.1.0
    created: '2026-11-05'
    modified: '2026-11-05'
    contributors:
    - Niji Matrix Research
    reviewers: []
defense_candidates:
  detection_strategies: &id001
  - schema_version: 2.0.0
    type: detection-strategy
    id: TMP1539-DET-acquisition
    name:
      zh: Cookie 取得路径与材料输出关联
      en: Cookie Acquisition Path to Material Output Correlation
    summary:
      zh: 将外部读取或可信浏览器控制接到值承载输出，并区分疑似机会与实际材料控制。
      en: Connect external reads or trusted-browser control to value-bearing output and distinguish suspected opportunity from material control.
    description:
      paragraphs:
      - zh: 外部读取分析针对文件与进程访问，客户端返回分析针对调试与浏览器内部取值；二者按取得路径分工，不把进程名、读取事件或调试能力当成取得结果。只有独立保存的返回或输出证据把完整材料连到未批准收件者时，才能提升为确认取得。真实代理流在没有内容证据时属于本策略盲区，需要认证路径调查配合。
        en: The external-read analytic covers file and process access, while the client-return analytic covers debugging and browser-internal
          retrieval. They divide acquisition paths without treating a process name, read event, or debugger capability as an acquisition result.
          Only independently retained return or output evidence connecting complete material to an unauthorized recipient supports confirmation.
          Real proxy flows without content evidence remain a blind spot requiring authentication-path investigation.
    detects_refs:
    - TMP1539-PARENT
    - TMP1539-CH-client
    domains:
    - enterprise
    analytic_refs:
    - TMP1539-NJA-external
    - TMP1539-NJA-client
    evidence_refs:
    - REF-000366
    - REF-000379
    - REF-001078
    - TMP1539-REF-debug
    - TMP1539-REF-api
    - TMP1539-REF-client
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  detection_analytics: &id002
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1539-NJA-external
    strategy_ref: TMP1539-DET-acquisition
    name:
      zh: 外部 Cookie 工件或运行态读取与输出分级
      en: External Cookie Artifact or Runtime Read and Output Grading
    summary:
      zh: 从敏感对象或浏览器进程访问建立疑似链，仅在值承载输出和收件者控制确认后报告取得。
      en: Build a suspected chain from sensitive-object or browser-process access and report acquisition only after confirming value-bearing output
        and recipient control.
    domains:
    - enterprise
    platforms:
    - windows
    logic:
      paragraphs:
      - zh: 按设备和实际用户配置路径维护 Cookie 工件清单，在配置审计策略与文件 SACL 后筛选 4663 的文件 ReadData 位，排除仅目录枚举及 ReadAttributes。把十六进制 ProcessId 规范化，以主机、PID 与进程开始和结束范围连接
          Sysmon 1；不能仅按 PID 跨重启连接。另从 Sysmon 10 提取对目标浏览器的访问，按 GrantedAccess 区分查询与可读内存权限，但保留“访问能力”结论。将未批准读取连接同一进程谱系后续输出文件创建或出站连接，形成疑似材料获取告警。
        en: Inventory cookie artifacts by device and actual user-profile path. With audit policy and file SACLs configured, select the file ReadData
          bit in 4663, excluding directory enumeration and ReadAttributes alone. Normalize hexadecimal ProcessId and join Sysmon 1 by host, PID,
          and process start-to-end interval rather than across restarts. Separately select Sysmon 10 access to target browsers and distinguish
          query-only from memory-readable rights using GrantedAccess while retaining an access-capability conclusion. Join unapproved access to
          later output-file creation or egress in the same process lineage to produce a suspected-acquisition alert.
      - zh: 只有事件响应保全的输出实际包含完整会话材料，并在受限环境与相应配置的会话材料建立值匹配或受控 HMAC 匹配，且接收者控制和业务未批准已确认时，才标为取得。密文数据库备份、解密键、掩码值或导出格式名称不足。没有独立输出工件时明确保持疑似，即使同时有外连；有效性和后继资源接受另记，不自动在生产会话上试用材料。
        en: Mark acquisition only when preserved incident output contains complete session material, matches the appropriate profile's material
          directly or through a controlled HMAC in a restricted environment, and recipient control plus lack of authorization are established.
          An encrypted database backup, decryption key, masked value, or export-format name is insufficient. Without independent output evidence,
          retain suspected status even with egress. Record usability and later resource acceptance separately without automatically testing material
          on production sessions.
    data_requirements:
    - source_type: windows-object-access
      name:
        zh: 配置审计后的文件对象访问
        en: Audited File Object Access
      channel: Windows Security Event 4663
      required_fields:
      - timestamp
      - device_id
      - subject_logon_id
      - process_id
      - process_name
      - object_type
      - object_path
      - access_mask
    - source_type: process-lineage
      name:
        zh: 进程创建与结束
        en: Process Creation and Termination
      channel: Microsoft-Windows-Sysmon/Operational Event 1; Event 5 optionally provides process-end time
      required_fields:
      - timestamp
      - device_id
      - process_guid
      - process_id
      - image_path
      - user
      - parent_process_guid
    - source_type: process-access
      name:
        zh: 对浏览器进程的访问
        en: Access to Browser Processes
      channel: Microsoft-Windows-Sysmon/Operational Event 10
      required_fields:
      - timestamp
      - device_id
      - source_process_guid
      - target_process_guid
      - source_image
      - target_image
      - granted_access
    - source_type: output-artifact-creation
      name:
        zh: 输出创建或写入线索
        en: Output Creation or Overwrite Leads
      channel: Microsoft-Windows-Sysmon/Operational Event 11
      required_fields:
      - timestamp
      - device_id
      - process_guid
      - image_path
      - target_filename
    - source_type: process-egress
      name:
        zh: 读取进程的出站连接
        en: Reader Process Egress
      channel: Microsoft-Windows-Sysmon/Operational Event 3; enable configured collection
      required_fields:
      - timestamp
      - device_id
      - process_guid
      - image_path
      - source_ip
      - source_port
      - destination_ip
      - destination_port
    - source_type: restricted-forensic-output
      name:
        zh: 受限取证材料验证记录
        en: Restricted Forensic Material Verification Record
      channel: Explicit incident-response evidence worksheet; not a native Windows event
      required_fields:
      - evidence_id
      - device_id
      - process_guid
      - observed_at
      - recipient_control
      - authorization_result
      - material_kind
      - complete_value_present
      - source_profile_id
      - material_match_result
    observables:
    - zh: 非批准进程对确切 Cookie 文件使用 ReadData 权限
      en: An unapproved process exercises ReadData on a specific cookie file
    - zh: 对浏览器的可读内存权限访问和同谱系输出线索
      en: Memory-readable access to a browser and output leads in the same lineage
    - zh: 受限工件中完整值与源配置匹配且接收者受控
      en: Complete values in restricted evidence match the source profile and reach a controlled recipient
    correlation:
      window:
        zh: 初始读取到输出采用十分钟工程起点，并在同一登录会话内保留进程生命周期；按本地测试调整，不视为来源给出的实测阈值。
        en: Use ten minutes from initial read to output as an engineering starting point and retain process lifetimes within the logon session;
          tune through local testing rather than treating this as a measured source threshold.
      dimensions:
      - device_id
      - process_guid
      - parent_process_guid
      - subject_logon_id
      - source_profile_id
      - object_path
      - evidence_id
    false_positives:
    - zh: 批准的浏览器迁移、备份、取证和用户导出
      en: Approved browser migration, backup, forensics, and user export
    - zh: 辅助功能、安全产品或诊断工具合法访问浏览器进程
      en: Legitimate browser-process access by accessibility, security, or diagnostic tools
    blind_spots:
    - zh: 未配置 SACL、用户数据在未受管设备、或数据经原始卷绕过文件审计
      en: Missing SACLs, unmanaged devices, or raw-volume reads bypassing file auditing
    - zh: Sysmon 10 不给内存返回内容，Sysmon 11 不记录普通文件读取，缺少保全工件则无法确认值控制
      en: Sysmon 10 lacks returned memory content and Event 11 lacks ordinary reads; without preserved artifacts value control cannot be confirmed
    - zh: 浏览器内部取值与真实 TLS 代理流可能没有外部文件读取
      en: Browser-internal retrieval and real TLS proxy flows may have no external file read
    tuning_guidance:
      paragraphs:
      - zh: 用无生产权限的测试会话验证 4663 ReadData、进程 PID 归并及输出取证流程，比较备份、正常浏览和授权提取。白名单绑定签名、版本、用途与目标路径，不永久允许整个浏览器目录或同用户名。报警中保留材料阶段和缺失证据，确认所需原始值只进入受控证据库；更改浏览器版本或审计配置后复核覆盖。
        en: Validate 4663 ReadData, PID joins, and output-forensics workflow with non-production test sessions against backups, ordinary browsing,
          and authorized extraction. Allow rules bind signature, version, purpose, and target path rather than whole browser directories or usernames.
          Preserve material stage and missing evidence in alerts, keep raw confirmation values only in a controlled evidence store, and reassess
          coverage after browser or audit-configuration changes.
    evidence_refs:
    - REF-000366
    - REF-000379
    - REF-001078
    - TMP1539-REF-abe
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  - schema_version: 2.0.0
    type: detection-analytic
    id: TMP1539-NJA-client
    strategy_ref: TMP1539-DET-acquisition
    name:
      zh: 可信浏览器控制与 Cookie 返回证据关联
      en: Trusted Browser Control to Cookie Return Evidence Correlation
    summary:
      zh: 关联未批准调试或进程控制与实际 Cookie 返回，只有控制机会时保留疑似状态。
      en: Join unapproved debugging or process control to an actual cookie return, retaining suspected status when only a control opportunity
        is visible.
    domains:
    - enterprise
    platforms:
    - windows
    logic:
      paragraphs:
      - zh: 用 Sysmon 1 找浏览器调试端口或管道启动，解析实际 user-data-dir 并连接受管版本清单，避免把 Chrome 136 以后新目录启动当作旧会话可读。对没有开关的活动浏览器，另用 Sysmon 10 和可得的 8 标记未批准进程控制；不能要求所有注入都产生远程线程。连接
          Sysmon 3 中同设备、同进程生命周期的控制端连接，但先验证部署确实记录 loopback；端口监听或连接只说明机会，不说明 API 已被调用；缺乏端口到目标进程的实际归属证据时，不把同机 loopback 连接自动接到浏览器。
        en: Use Sysmon 1 to find browser debugger-port or pipe launches, parse the actual user-data-dir, and join managed version inventory to
          avoid treating a new-directory launch after Chrome 136 as access to old sessions. For a live browser without flags, separately use Sysmon
          10 and available Event 8 to identify unapproved process control without requiring a remote thread for all injection. Join control connections
          in Sysmon 3 by device and process lifetime after validating that the deployment records loopback. A listener or connection proves opportunity
          rather than an API call. Without actual port-to-process attribution, do not automatically join a same-host loopback connection to the
          browser.
      - zh: 在事件取证或批准的验证环境内，从实际控制端通信、输出文件或调用记录保全 Cookie 返回。验证请求 ID 与响应、完整值存在、实际配置、受控收件者和未批准用途；仅列标签页、截图、代理浏览或空 getCookies 返回不能确认。常规端点事件没有 API 正文时输出“疑似可信客户端取值”，只有该值承载链闭合才输出“已确认
          Cookie 材料取得”。扩展 API 路径同样需要实际返回证据，不以权限清单代替调用结果。
        en: During incident forensics or approved validation, preserve cookie returns from actual controller communications, output files, or
          call records. Verify request-to-response identity, complete-value presence, actual profile, controlled recipient, and unauthorized purpose.
          Tab listing, screenshots, proxy browsing, or an empty getCookies return does not confirm acquisition. Without API bodies, routine endpoint
          events yield suspected trusted-client retrieval; only closure of the value-bearing chain yields confirmed cookie-material acquisition.
          Extension API paths equally require actual return evidence rather than a permission inventory.
    data_requirements:
    - source_type: browser-process-start
      name:
        zh: 浏览器启动与父进程
        en: Browser Launch and Parent Process
      channel: Microsoft-Windows-Sysmon/Operational Event 1
      required_fields:
      - timestamp
      - device_id
      - process_guid
      - process_id
      - image_path
      - command_line
      - parent_process_guid
      - user
    - source_type: browser-process-control
      name:
        zh: 浏览器进程访问
        en: Browser Process Access
      channel: Microsoft-Windows-Sysmon/Operational Event 10
      required_fields:
      - timestamp
      - device_id
      - source_process_guid
      - target_process_guid
      - source_image
      - target_image
      - granted_access
    - source_type: browser-controller-connection
      name:
        zh: 控制端到浏览器连接
        en: Controller to Browser Connection
      channel: Microsoft-Windows-Sysmon/Operational Event 3; verify local and loopback capture before deployment
      required_fields:
      - timestamp
      - device_id
      - process_guid
      - image_path
      - source_ip
      - source_port
      - destination_ip
      - destination_port
    - source_type: managed-browser-inventory
      name:
        zh: 受管浏览器版本及批准配置
        en: Managed Browser Version and Approved Configuration
      channel: Enterprise software inventory with explicitly collected profile and debugger approvals
      required_fields:
      - device_id
      - image_path
      - browser_version
      - profile_path
      - approved_controller
      - approval_id
      - collected_at
    - source_type: restricted-cookie-return-evidence
      name:
        zh: 实际 Cookie 返回取证记录
        en: Actual Cookie Return Forensic Record
      channel: Preserved controller response or output; derived evidence fields, not default browser logging
      required_fields:
      - evidence_id
      - observed_at
      - device_id
      - browser_process_id
      - profile_id
      - request_id
      - response_id
      - method
      - complete_value_present
      - cookie_count
      - recipient_control
      - authorization_result
    observables:
    - zh: 未批准的浏览器调试启动或活动进程控制
      en: Unapproved browser debugging launch or live-process control
    - zh: 与该浏览器配置关联的真实 Cookie 值返回
      en: An actual cookie-value return associated with that browser profile
    - zh: 完整材料与攻击者控制收件者形成可验证链
      en: A verifiable chain from complete material to an adversary-controlled recipient
    correlation:
      window:
        zh: 调试或进程控制后十五分钟作为起始窗口，按进程生命周期保持配置关联；长驻扩展按安装版本和实际调用时间连接，窗口需本地验证。
        en: Start with fifteen minutes after debugging or process control and preserve profile association by process lifetime; join long-lived
          extensions by installed version and actual call time. Validate the window locally.
      dimensions:
      - device_id
      - browser_process_guid
      - controller_process_guid
      - profile_id
      - request_id
      - response_id
      - evidence_id
    false_positives:
    - zh: VSCode 调试、Chrome for Testing 和受批准的浏览器自动化
      en: VSCode debugging, Chrome for Testing, and approved browser automation
    - zh: 用户主动导出、Cookie 管理扩展与远程支持
      en: User-initiated exports, cookie-management extensions, and remote support
    blind_spots:
    - zh: 默认没有 Cookie API 正文审计，只有连接元数据不能确认返回
      en: Cookie API bodies are not audited by default and connection metadata cannot confirm a return
    - zh: 内存启用调试没有启动开关，替代注入可能没有 Event 8，loopback 记录可能不完整
      en: In-memory debugger enablement lacks launch flags, alternative injection may lack Event 8, and loopback records may be incomplete
    - zh: 已批准扩展失陷与浏览器内调用可能只有普通浏览器外连
      en: Compromised approved extensions and in-browser calls may leave only ordinary browser egress
    tuning_guidance:
      paragraphs:
      - zh: 在当前浏览器版本与配置上用专用测试账户验证三种负例：仅开启调试、只截图或代理访问、以及空 Cookie 存储；均不得输出已取得。再用授权的含值返回验证确认分支及证据权限。审批清单绑定控制程序、配置、目标域和期限，不仅按浏览器签名或端口放行；将未具备正文捕获的部署明确标为机会检测。
        en: 'With a dedicated test account on current versions and profiles, verify three negative cases: debugging alone, screenshot or proxy
          access alone, and an empty cookie store. None may yield acquired status. Then use an authorized value-bearing return to validate confirmation
          and evidence permissions. Approval binds controller, profile, target domain, and expiry rather than browser signature or port alone;
          label deployments without body capture as opportunity detection.'
    evidence_refs:
    - REF-000366
    - TMP1539-REF-debug
    - TMP1539-REF-api
    - TMP1539-REF-client
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-05'
      modified: '2026-11-05'
      contributors:
      - Niji Matrix Research
      reviewers: []
  mitigations: &id003
  - schema_version: 2.0.0
    type: mitigation
    id: TMP1539-MIT-boundaries
    name:
      zh: Cookie 材料保护与会话续期约束
      en: Cookie Material Protection and Session Renewal Constraints
    summary:
      zh: 分别保护 Cookie 本地解密、网页与传递路径，并以短寿材料和绑定续期限制取得后的风险。
      en: Protect local cookie decryption, web and transmission paths separately, and limit post-acquisition risk with short-lived material and
        bound renewal.
    description:
      paragraphs:
      - zh: 本缓解把保护目标分为值的暴露和后继续用。受管浏览器保留应用绑定加密及最小端点权限，目标应用设置适当 Cookie 属性和 TLS，支持的 Web 应用再部署短寿会话与设备持钥续期。每项只承担其实际边界，不能把一个开关描述为防止所有窃取。
        en: This mitigation separates value exposure from later continuation. Managed browsers retain application-bound encryption and least endpoint
          privilege, target applications configure appropriate cookie attributes and TLS, and supported web applications add short-lived sessions
          and device-key renewal. Each control owns its actual boundary rather than one switch being described as preventing all theft.
    domains:
    - enterprise
    measures:
    - key: local-cookie-material-protection
      name:
        zh: 本地 Cookie 材料保护
        en: Local Cookie Material Protection
      control_type: cost-increasing
      description:
        paragraphs:
        - zh: 在支持的受管 Windows Chrome 配置保留应用绑定加密，更新浏览器并限制普通用户提权和浏览器进程写入；对漫游配置和策略例外单独核对保护实际启用状态。失败验证事件只作诊断线索，不能作为完整成功审计。
          en: Retain application-bound encryption on supported managed Windows Chrome configurations, update browsers, and restrict user elevation
            and browser-process writes. Verify actual protection separately for roaming profiles and policy exceptions. Failed-verification events
            are diagnostic leads rather than a complete successful-read audit.
    - key: web-cookie-path-hardening
      name:
        zh: 网页与 Cookie 传递约束
        en: Web and Cookie Transfer Constraints
      control_type: preventive
      description:
        paragraphs:
        - zh: 目标应用为认证 Cookie 设置 HttpOnly、Secure 和与业务相容的 SameSite，使用正确验证的 HTTPS，并收窄 Domain 及非必要跨站使用。HttpOnly 保护网页脚本读取面，Secure 保护通道，SameSite 减少跨站附带；不把它们当作本机内存或授权扩展
            API 的隔离。
          en: Configure authentication cookies with HttpOnly, Secure, and business-compatible SameSite, use correctly validated HTTPS, and minimize
            Domain scope and unnecessary cross-site use. HttpOnly protects web-script reads, Secure the channel, and SameSite cross-site attachment;
            none is a local-memory or authorized-extension-API isolation control.
    - key: short-lived-bound-renewal
      name:
        zh: 短寿会话与绑定续期
        en: Short-Lived Sessions and Bound Renewal
      control_type: exposure-reduction
      description:
        paragraphs:
        - zh: 支持 DBSC 的应用实现注册和刷新端点、服务端公钥关联与持钥证明验证，并使敏感资源实际要求短期 Cookie。记录回退和过期处理，避免长寿兼容 Cookie 独自满足同一敏感访问；一般 sender constraint 必须落实为具体协议验证，不因设备标签相同就视为绑定。
          en: Applications supporting DBSC implement registration and refresh endpoints, server-side public-key association, and proof-of-possession
            verification, with sensitive resources actually requiring short-lived cookies. Record fallback and expiry handling so a long-lived
            compatibility cookie alone cannot authorize the same sensitive access. General sender constraints require concrete protocol verification
            rather than a matching device label.
    applications:
    - target_ref: TMP1539-PARENT
      use:
        paragraphs:
        - zh: 对企业自建邮件或管理门户，分别验证脚本读值被 HttpOnly 拒绝、非安全通道不发送认证 Cookie、跨站策略符合流程，并核对受管浏览器的本地材料保护。若部署 DBSC，使用独立测试会话验证没有相应设备私钥时不能完成续期，同时记录到期前短期 Cookie
            的剩余窗口。
          en: For an enterprise webmail or administration portal, verify separately that HttpOnly blocks script reads, authentication cookies
            are not sent over insecure channels, cross-site policy fits the workflow, and managed browsers protect local material. If DBSC is
            deployed, use a separate test session to verify renewal fails without the device key while recording the residual validity window
            before short-lived cookies expire.
      expected_effect:
        paragraphs:
        - zh: 减少网页和传递路径的非必要暴露，提高独立解密的成本；即使材料已被复制，缩短能在其他控制面续用的时间。控制效用按取得前保护与取得后风险分别报告。
          en: Reduce unnecessary web and transmission exposure and raise independent-decryption cost; if material is copied, shorten continuation
            from another control plane. Report pre-acquisition protection and post-acquisition risk reduction separately.
      limitations:
        paragraphs:
        - zh: 终端提权、浏览器内部代取或受信 TLS 终结点仍可能看到值；TLS 不排除被信任的恶意代理。DBSC 需要应用和客户端支持，兼容回退、设备被控和剩余短期 Cookie 不能忽略；普通 MFA 不能阻止端点上已经建立的会话值被复制。
          en: Elevation, browser-internal retrieval, or a trusted TLS termination point may still expose values; TLS does not exclude a trusted
            malicious proxy. DBSC needs application and client support, with compatibility fallback, device compromise, and remaining short-lived-cookie
            validity still relevant. Ordinary MFA does not prevent copying a value from an already established endpoint session.
    - target_ref: TMP1539-CH-client
      use:
        paragraphs:
        - zh: 在敏感浏览器配置保留应用绑定并限制进程写权限，但将主要预防与 MIT-000147 的扩展及调试治理配合；应用侧短寿和绑定刷新用于减轻返回材料被转移后的风险。验证用例须包括原浏览器内部返回和仅导出到另一设备，分别检查控制效果。
          en: Retain application binding and restrict process writes on sensitive profiles while pairing prevention with MIT-000147's extension
            and debugger governance. Application-side short lifetimes and bound refresh reduce risk after returned material is transferred. Test
            both an internal return from the original browser and export to a separate device as distinct control cases.
      expected_effect:
        paragraphs:
        - zh: 独立密文读取的收益下降，攻击者更需突破客户端控制边界；被导出的 Cookie 难以在没有设备私钥时持续续期，但返回动作仍需端点检测。
          en: Independent ciphertext reads become less useful and the actor increasingly needs to defeat client-control boundaries. Exported cookies
            become harder to renew without the device key, while endpoint detection is still needed for the return itself.
      limitations:
        paragraphs:
        - zh: 原客户端有权取得并使用值，应用绑定无法把所有代取排除；控制浏览器的攻击者可继续在该设备访问资源，那属于 NJT-0145 或后继使用。对已有设备标签、IP 条件或浏览器签名的检查不等于私钥持有证明。
          en: The original client is authorized to obtain and use values, so application binding cannot exclude every delegated retrieval. A browser
            controller may keep accessing resources on that device under NJT-0145 or later use. Checks of device labels, IP conditions, or browser
            signatures are not private-key possession proofs.
    evidence_refs:
    - TMP1539-REF-rfc
    - TMP1539-REF-bis
    - TMP1539-REF-abe
    - TMP1539-REF-dbsc
    - TMP1539-REF-client
    - REF-000067
