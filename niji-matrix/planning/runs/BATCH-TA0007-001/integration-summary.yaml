review_notes_en: T1087 was adapted as NJT-0131 with one native child for preexisting identity-view reuse; T1010 was retained
  as NJT-0132 with one native child for window-context gating of follow-on activity. Oldrea OAB-file access and audit-evasion
  motive remain inferred, and window detection requires a validated GUI sensor. Formal content and planning have zero errors
  or warnings, the shared library has zero duplicates, 12 infrastructure tests and 73 Web tests pass, both bundles build,
  and bilingual API QA passes. Objects remain in review pending human domain review. The formal TA0007 matrix has 2 completed
  techniques; 32 TA0007 parent candidates still await admission, so the eventual formal total is undetermined.
