review_notes_en: 'The batch completed five independent admissions: T1217 and T1526 were adapted, T1580 and T1619 retained,
  and T1538 excluded because GUI is a path rather than a distinct stealth object. Four bilingual NJTs were added; all four
  native-child axes remain deferred for lack of independent conclusion-level evidence, so no NJS was added. Four target-specific
  DET→NJA and MIT sets, calibrated case evidence, ID sync, bundles, global quality (zero content/planning errors or warnings,
  zero duplicates, 12 infrastructure tests), 89 Web tests, and actual bilingual rendering pass. T1526''s mechanism remains
  a hypothesis and ordinary-bucket S3 V2 audit needs deployment testing. All objects stay in review pending human domain review.
  TA0007 now has six formal techniques, with 27 parent candidates still awaiting admission.'
