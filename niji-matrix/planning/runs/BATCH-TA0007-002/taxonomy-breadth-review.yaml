    defender_effect: No malicious same-case access to a synchronized copy.
  - axis: history-time-or-batched-filtering
    disposition: evidence-deferred
    trace_change: API ability and a 500-entry cap do not prove adversarial temporal selection.
    defender_effect: API ability and a 500-entry cap do not prove adversarial temporal selection.
  - axis: in-browser-extension-read
    disposition: evidence-deferred
    trace_change: No sample-level proof of a separate extension provenance effect.
    defender_effect: No sample-level proof of a separate extension provenance effect.
