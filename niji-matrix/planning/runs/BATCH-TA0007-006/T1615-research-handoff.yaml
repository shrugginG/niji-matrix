    candidate_stealth_axes_examined:
      - key: preexisting-local-result-or-cache-reuse
        resolution: evidence-deferred
        stable_variable: Deliberately acquire already resident policy information instead of generating a fresh domain-policy read
        trace_change: Would relocate acquisition evidence from current DC directory and SYSVOL reads to local result or cache access if demonstrated
        observation_difference: DC-centric detection would need endpoint result or file-read visibility
        prerequisites: Existing readable results or cache, sufficient local authorization, validated no-refresh path and acceptable staleness
        evidence_keys: [B006-T1615-REF-GPRESULT, B006-T1615-REF-RESULTS, B006-T1615-REF-CACHE, REF-001049]
        failed_gates: [intentional-selection-evidence, exact-access-path, same-operation-trace-comparison]
        notes:
          zh: "本机 gpresult 与可配置缓存均确实存在，但来源没有证明 Turla 选择它们以规避域侧监测。缓存使用还可能联系域控制器检查链路，因此禁止声称天然离线或零远端事件。"
          en: "Local gpresult and configurable caches exist, but the sources do not show Turla choosing them to avoid DC monitoring. Cache use can still contact a domain controller to check the link, so claims of inherently offline behavior or zero remote events are prohibited."
      - key: directory-only-versus-template-content
        resolution: parent-core
        stable_variable: Requested information plane
        trace_change: LDAP attribute reads and file-content reads expose different objects and protocols
        observation_difference: Directory and share audits have distinct scope and semantics
        prerequisites: Applicable read rights and information sufficient in the selected plane
        evidence_keys: [B006-T1615-REF-PROTOCOL, B006-T1615-REF-SOM, B006-T1615-REF-4662, REF-000474]
        failed_gates: [independent-stealth-choice, comparable-information-result]
        notes:
          zh: "读取面和返回信息不同是父行为的实现与可观察性事实，不自动形成同一任务下的规避变量，不能按 LDAP/SMB 名称分 NJS。"
          en: "Different read planes and returned information are implementation and observation facts of the parent, not automatically an evasion variable for an equivalent task; LDAP and SMB names must not become NJS boundaries."
      - key: scoped-object-and-attribute-minimization
        resolution: evidence-deferred
        stable_variable: Intentional restriction of queried objects or attributes to lower anomalous coverage
        trace_change: Could reduce query breadth, property accesses or template fetches
        observation_difference: Broad-enumeration heuristics could require content-sensitive or role-sensitive correlation
        prerequisites: Prior knowledge of useful GPOs and query API control
        evidence_keys: [B006-T1615-REF-SOM, B006-T1615-REF-PROTOCOL]
        failed_gates: [adversary-use-evidence, measured-trace-difference, distinct-child-boundary]
        notes:
          zh: "正常客户端已经按作用范围选择 GPO，窄读取本身不能证明匿迹。缺乏攻击者主动收窄以规避检测的直接材料。"
          en: "Normal clients already select GPOs by application scope, so narrow reads alone do not establish stealth. No direct evidence shows deliberate adversarial narrowing to avoid detection."
      - key: processing-window-and-client-provenance
        resolution: evidence-deferred
        stable_variable: Deliberately synchronize a survey with legitimate policy processing or reuse its client origin
        trace_change: Would alter timing or apparent request origin within normal client patterns
        observation_difference: Requires process attribution and processing-context joins rather than source identity alone
        prerequisites: Control over schedule or client process plus relevant policy scope
        evidence_keys: [REF-000341, B006-T1615-REF-PROTOCOL, B006-T1615-REF-MS16-072]
        failed_gates: [policy-query-specific-adversary-evidence, causal-separation-from-normal-refresh]
        notes:
          zh: "正常刷新和计算机上下文是平台事实，不是已观察到的 T1615 匿迹设计；通用工作时间或活跃周期不作为本候选子项证据。"
          en: "Normal refresh and computer context are platform facts rather than observed T1615 stealth designs; generic working hours or activity cycles are not child evidence for this candidate."
      - key: avoid-persistent-report-output
        resolution: not-stealth-distinct
        stable_variable: Output destination
        trace_change: Console output can avoid creating a particular HTML or XML report file
        observation_difference: A file-creation-only detector would miss console reporting but process evidence remains
        prerequisites: Ability to consume standard output without a persistent report
        evidence_keys: [B006-T1615-REF-GPRESULT, REF-001049]
        failed_gates: [evasion-intent, stable-sibling-boundary, nontrivial-defense-difference]
        notes:
          zh: "输出选项不等于独立匿迹技术；当前证据没有证明攻击者通过特定选项减少取证工件。"
