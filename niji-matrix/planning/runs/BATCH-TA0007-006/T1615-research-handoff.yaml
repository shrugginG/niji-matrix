  limitations:
    paragraphs:
      - zh: "公开恶意活动证据最明确地支持使用合法 gpresult 进行策略调查，不能由命令存在推断完整返回内容、规避动机或检测失效。Microsoft 文档支持能力、协议与审计语义；本研究将这些事实用于分析外观重叠，而没有把平台能力自动升级为已观察攻击或子技术存在证据。"
        en: "Public adversarial evidence most clearly supports policy surveying through legitimate gpresult, but command presence does not establish complete returned contents, evasion motive, or failed detection. Microsoft documents capability, protocol, and audit semantics; this research uses those facts to analyze appearance overlap without automatically upgrading platform capability to observed attack or child-existence evidence."
      - zh: "缓存、结果策略和域中已配置策略有不同范围与时效。缓存存在不证明任意用户可读或完全离线；结果查询也不保证所有扩展都能提供相同信息。未对真实 Windows 域运行实验，因此所有关联窗口、任务基线和异常优先级都是可实施设计建议，仍需按部署版本、权限和日志负载验证。"
        en: "Caches, resultant policy, and configured domain policy differ in scope and freshness. Cache existence does not establish arbitrary readability or wholly offline operation, and result queries do not guarantee equivalent information from every extension. No live Windows-domain experiment was performed, so correlation windows, work baselines, and anomaly priorities are implementable design proposals that still require validation against deployed versions, rights, and logging workloads."
      - zh: "研究中 v19/v19.1 ATT&CK 网页和 CISA 通告无法读取，固定基线事实取自仓库内 19.1 工作簿机械摘录；当前网页只作交叉检查。事件文档并不保证部署环境已启用读取审计，传感器缺失不能作为行为透明或零痕迹的证据。"
        en: "The v19/v19.1 ATT&CK pages and CISA advisory could not be retrieved. Fixed-baseline facts come from the repository's mechanical extraction of the 19.1 workbook, with the current page used only for cross-checking. Event documentation does not guarantee that read auditing is enabled in a deployment, and missing sensors are not evidence of Behavioral Transparency or zero traces."
  rejected_mechanisms:
    - mechanism_ref: NM-BT
      reason:
        zh: "缺乏针对当前调查行为主动选择读取盲区的证据；配置不全或缺少读取事件本身不足以成立该机理。"
        en: "Evidence does not establish deliberate selection of a read-observation blind spot for this survey behavior; incomplete configuration or absent read events alone does not establish the mechanism."
    - mechanism_ref: NM-ST
      reason:
        zh: "未发现对 T1615 有结论级支持的时间稀释、来源分散或短暂痕迹设计；普通后台刷新周期不能替代攻击者设计证据。"
        en: "No conclusion-level T1615 evidence establishes temporal dilution, distributed origins, or transient-trace design; ordinary background-refresh cadence is not evidence of adversarial design."
    - mechanism_ref: NM-DO
      reason:
        zh: "未发现攻击者为本行为主动改变可检查性、编码或加密表示的证据；正常协议保护不能自动映射该机理。"
        en: "No evidence establishes adversarial alteration of inspectability, encoding, or encrypted representation for this behavior; ordinary protocol protection does not automatically establish this mechanism."
  open_questions:
    - Can a future case or controlled experiment establish intentional local-result substitution plus endpoint/DC event comparison without conflating cache processing and information reads?
    - Which GPO attribute SACLs and client-process sensor fields are supported by the deployment used for implementation validation?
