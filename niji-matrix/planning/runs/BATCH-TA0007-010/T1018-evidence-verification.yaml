type: research-evidence-verification
candidate: T1018
batch_ref: BATCH-TA0007-010
verified_on: '2026-11-07'
method: Original publications and authoritative API/manual pages opened using the web tool; no live adversary tool execution or packet capture.
entries:
- key: B010-T1018-REF-KINSING
  url: https://www.aquasec.com/blog/threat-alert-kinsing-malware-container-vulnerability/
  locator: Discovery and Lateral Movement, paragraphs beginning with the downloaded spre.sh script and ending before the SSH command
  supports: Observed local-material candidate gathering, absence of identified additional active scanning in the analyzed material, and later SSH attempts as a separate stage.
  does_not_support: Every Kinsing variant, validity of all candidates, universal absence of network traffic, or a measured detector outcome.
- key: REF-000988
  url: https://www.welivesecurity.com/2022/03/01/isaacwiper-hermeticwizard-wiper-worm-targeting-ukraine/
  locator: HermeticWizard section, known-local-IP function list and immediately following connection and optional scanning paragraphs
  supports: Sequential known-address gathering and active validation; GetIpNetTable is explicitly listed.
  does_not_support: Treating the entire function list as local-only, network-free implementation; this publication's existing HermeticWiper case remains distinct.
- key: B010-T1018-REF-GETIPNETTABLE
  url: https://learn.microsoft.com/en-us/windows/win32/api/iphlpapi/nf-iphlpapi-getipnettable
  locator: Summary, Return value ERROR_NO_DATA, and Remarks
  supports: Existing local IPv4-to-physical mapping table; successful calls may have no entries.
- key: B010-T1018-REF-USINGARP
  url: https://learn.microsoft.com/en-us/windows/win32/iphlp/using-the-address-resolution-protocol
  locator: GetIpNetTable and SendARP distinction
  supports: Documented separation between obtaining the table and transmitting an ARP request.
- key: B010-T1018-REF-GETIPNETTABLE2
  url: https://learn.microsoft.com/en-us/windows/win32/api/netioapi/nf-netioapi-getipnettable2
  locator: Summary, Family, ERROR_NOT_FOUND, Remarks
  supports: Local IPv4/IPv6 neighbor-table retrieval and successful-empty result.
- key: B010-T1018-REF-NEIGHBOR-ROW
  url: https://learn.microsoft.com/en-us/windows/win32/api/netioapi/ns-netioapi-mib_ipnet_row2
  locator: State members, especially NlnsStale and NlnsIncomplete
  supports: A stored neighbor record need not establish current reachability; stale state need not actively validate until traffic is sent.
- key: B010-T1018-REF-RESOLVEIPNETENTRY2
  url: https://learn.microsoft.com/en-us/windows/win32/api/netioapi/nf-netioapi-resolveipnetentry2
  locator: Remarks first paragraphs
  supports: Flush and active ARP or IPv6 solicitation, excluding this operation from a read-only-table assertion.
- key: B010-T1018-REF-DNSCLIENTCACHE
  url: https://learn.microsoft.com/en-us/powershell/module/dnsclient/get-dnsclientcache
  locator: Description, CimSession, Status, TimeToLive
  supports: Default local cache retrieval; optional remote session changes location; cache includes status and lifetime concepts.
  does_not_support: Undocumented DNSGetCacheDataTable cross-version behavior or a guarantee of zero operating-system background traffic.
- key: B010-T1018-REF-DNS-CONSTANTS
  url: https://learn.microsoft.com/en-us/windows/win32/dns/dns-constants
  locator: DNS query options NO_WIRE_QUERY, BYPASS_CACHE, WIRE_ONLY
  supports: Cache-only and network-resolution controls differ.
- key: B010-T1018-REF-IPCONFIG
  url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/ipconfig
  locator: Parameters /displaydns, /registerdns, /flushdns
  supports: Display existing resolver-cache contents, distinguish displayed records from explicit updates.
- key: B010-T1018-REF-ARP
  url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/arp
  locator: -a, -g, -v, -s and -d parameters
  supports: Display versus modification; verbose entries can include invalid or loopback records.
- key: B010-T1018-REF-SSH
  url: https://man.openbsd.org/ssh.1
  locator: AUTHENTICATION host database and FILES ~/.ssh, ~/.ssh/config, ~/.ssh/known_hosts
  supports: Stored host-key knowledge and user-private directory permission recommendation.
- key: REF-000614
  url: https://man.openbsd.org/ssh_config.5
  locator: HashKnownHosts, Host and Hostname
  supports: Hashed identifiers do not visually reveal names, old entries are not automatically converted, and configuration names can include patterns.
- key: REF-000230
  url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  locator: Events 1, 3 and 22
  supports: Process-command context, disabled-by-default TCP/UDP connections, and cached-or-uncached DNS query events.
  does_not_support: Arbitrary cache-read API output, file-content reads, or success of system discovery.
- key: REF-001042
  url: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/7/html/security_guide/sec-understanding_audit_log_files
  locator: SYSCALL/PATH sample and field explanations
  supports: Audit timestamp/serial grouping and syscall, result, identity, executable, and path fields.
- key: REF-000201
  url: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/auditing-the-system_security-hardening
  locator: Understanding Audit log files; Using auditctl; Defining persistent Audit rules
  supports: Configured read-access rules and persistent collection.
- key: REF-000840
  url: https://man7.org/linux/man-pages/man8/auditctl.8.html
  locator: Rule options, filesystem read permissions, performance tips, lost and backlog status, and mount constraints
  supports: Explicit rule and health prerequisites; read-permission rules use relevant syscall arguments and are not byte-result logging.
additional_research_not_proposed_as_new_canonical_sources:
- url: https://nmap.org/book/host-discovery-controls.html
  locator: List Scan and reverse-DNS discussion
  conclusion: Listing supplied targets alone does not demonstrate a new remote-system fact; default DNS enrichment and target liveness remain different outcomes.
- url: https://learn.microsoft.com/en-us/windows/win32/api/windns/nf-windns-dnsquery_w
  locator: Remarks DNS_QUERY_STANDARD
  conclusion: Ordinary DNS resolution can use cache or network; potential cache hits alone do not establish a cache-enumeration child.
- url: https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adcomputer
  locator: Description and example retrieving all computer accounts
  conclusion: Directory computer-object facts can be parent behavior, but a separate native child is deferred here.
- url: https://man.openbsd.org/ssh-keygen.1
  locator: -F searches a hostname, including hashed records; -H hashes known-host entries
  conclusion: Hashing should be described as raising direct-enumeration cost, not preventing tests of already guessed candidates.
strength_separation:
  tool_capability: Official interface and manual semantics.
  adversarial_adoption: The two original incident analyses, each restricted to its reported path and stage.
  observation_change: Conditional reasoning from local read versus fresh target interaction.
  measured_effect: None claimed; no packet-capture experiment or detector evaluation performed.
canonical_write_status: No formal IDs allocated; no canonical matrix, shared library, tactic plan, or reservation modified by researcher.
