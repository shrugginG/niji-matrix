  name:
    zh: 远程系统发现
    en: Remote System Discovery
recommendation:
  decision: retain
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 保留 T1018 的直接信息对象，即在已访问环境取得其他系统的名称、地址或逻辑标识。其范围既包括主动确认，也包括读取既存的远端系统记录。Kinsing 原始分析记录了从本地配置和历史记录提取候选且未发现额外主动扫描；HermeticWizard
        原始分析把读取已知 IP 与后续连接验证分开。它们使不依赖新鲜存活探测的发现路径具有具体恶意采用证据，也使只看网络扫描的观察模型存在可解释缺口，因而无需把父技术重写为其他信息对象。
      en: 'Retain T1018''s direct information object: names, addresses, or logical identifiers of other systems within an accessed environment.
        This encompasses active confirmation and reading preexisting remote-system records. The original Kinsing analysis records candidate
        extraction from local configuration and history without identified additional active scanning. The original HermeticWizard analysis
        separates gathering known IP addresses from subsequent connection validation. These provide concrete evidence of adversarial
        discovery without fresh liveness probes and explain a gap in scan-only observation, without rewriting the parent around a different
        information object.'
  scope_notes:
    paragraphs:
    - zh: 记录、当前可达性、监听服务和横向访问是不同结论。保留父项不表示每次运行 ping、读取 ARP 表或查询目录都具有匿迹目的；正文仅将经证据支持的痕迹变化映射为机理。读取本机地址配置和连接状态仍分别属于 T1016 与 T1049；从这些材料提取远端系统标识才是这里讨论的直接成果。
      en: A record, current reachability, listening services, and lateral access are different conclusions. Retention does not mean
        every ping, ARP-table read, or directory query has stealth intent; only supported trace changes receive mechanism mappings.
        Local address configuration and connection state remain T1016 and T1049 respectively. Extracted identifiers of other systems
        are the direct result considered here.
  evidence_keys:
  - REF-000625
  - B010-T1018-REF-KINSING
  - REF-000988
  - B010-T1018-REF-GETIPNETTABLE
proposed_content:
  summary:
    zh: 在已访问环境取得其他系统的标识或存在迹象，并可复用既存主机知识，减少为形成初始候选而新增的网络探测。
    en: Obtain identifiers or indications of other systems in an accessed environment, potentially reusing existing host knowledge to
      reduce new network probing for initial candidates.
  definition_and_concept:
    paragraphs:
    - zh: 远程系统发现是攻击者在已经获得访问的环境内，取得其他计算机、网络设备或系统的主机名、网络地址或其他逻辑标识，以形成后续调查与横向访问候选的行为。主动请求的应答、目录中登记的计算机对象，以及本机已经保存的远端主机记录，都可能提供这种知识。直接成果可以只是一个待核实名称或地址，而非已证明在线的目标。
      en: Remote System Discovery obtains hostnames, network addresses, or other logical identifiers of other computers, network devices,
        or systems within an environment already accessed, forming candidates for later investigation and lateral access. Active-request
        responses, registered directory computer objects, and locally stored remote-host records can all provide this knowledge. The
        immediate result may be an unverified name or address rather than a demonstrated live target.
    - zh: 本技术按所取得的系统事实界定，既不以运行某个命令为完成条件，也不以某种协议或文件格式为边界。同一操作可能同时返回本机配置、连接对端和远端候选；只有相应结果获得证据时，才能分别归入对应发现行为。将候选地址传给服务探测、认证或远程执行属于后续动作，不能反过来证明初始枚举取得完整、准确的系统清单。
      en: The technique is defined by the system facts acquired, not completion of a particular command or use of a protocol or file
        format. One operation can expose local configuration, connection peers, and remote candidates; corresponding evidence is needed
        before assigning each discovery behavior. Passing a candidate address into service probing, authentication, or remote execution
        is a later action and cannot retrospectively establish that initial enumeration produced a complete, accurate system inventory.
  stealth_characteristics:
    paragraphs:
    - zh: 远程系统发现的可见性取决于攻击者从哪里取得初始主机知识。逐目标确认会增加网络请求，而读取现有本地记录可以先形成候选而不为这些候选新发存活或服务探测。只统计 ICMP 扫描、连接扇出或失败端口的防守逻辑因此可能漏掉候选形成阶段；记录中的系统未被验证，是这种痕迹减少所付出的信息质量代价。
      en: Visibility depends on where the adversary acquires initial host knowledge. Per-target confirmation adds network requests,
        whereas existing local records can yield candidates before fresh liveness or service probes are sent for them. Detection limited
        to ICMP scans, connection fan-out, or failed ports can therefore miss candidate formation. Unverified system records are the
        information-quality cost of that trace reduction.
    - zh: 本地读取仍可能留下进程、命令行、文件访问、脚本或已部署 API 传感器记录，后续名称解析与目标验证也会增加痕迹。缓存命中的 DNS 查询仍可产生 Sysmon Event 22；读取表与调用解析刷新接口也必须区分。大量主动扫描并不会因为使用系统命令就自动隐蔽，现有案例也未量化此路径的检测漏失率，匿迹效果只在明确的防守观察条件下成立。
      en: Local reads can still leave process, command-line, file-access, script, or deployed API-sensor records; later name resolution
        and target validation add traces. DNS queries answered from cache can still generate Sysmon Event 22, and table retrieval must
        be distinguished from resolution or refresh calls. Broad active scanning does not become inconspicuous merely by using system
        commands. The cases do not quantify detection miss rates, so stealth effects are conditional on the stated observation model.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入在已访问环境为取得其他系统标识而进行的目标确认、计算机目录查询，以及从已有本地映射、缓存或配置提取远端系统候选。目录对象证明登记事实；ARP 或邻居表记录保存的地址映射与状态；名称缓存和主机文件提供名称与记录数据。它们均不单独证明实时可达、服务开放、凭证有效或横移成功。管理员排障、资产盘点和日常客户端维护同样会读取这些材料，恶意解释需要访问来源、用途与后继行为支持。
      en: Include target confirmation, computer-directory queries, and extraction of remote-system candidates from existing local mappings,
        caches, or configuration within an accessed environment. A directory object establishes registration; ARP or neighbor tables
        contain recorded mappings and states; name caches and host files supply names and record data. None alone establishes current
        reachability, open services, valid credentials, or successful lateral movement. Administrators, inventory tools, and ordinary
        clients read the same materials, so a malicious interpretation requires access provenance, purpose, and subsequent behavior.
    - zh: 直接目标为远端服务端点或协议事实时归 NJT-0234，为共享名称和清单时归 NJT-0235，捕获既有报文时归 NJT-0236，枚举日志时归 NJT-0233。本机地址配置和本机连接状态分别保留 T1016、T1049 边界；云提供方资源与容器资源清单仍归
        NJT-0139、NJT-0179。读取已存记录不等于网络嗅探，取得内部访问前的外部探测也不属于本项。
      en: Remote service endpoints or protocol facts belong to NJT-0234, share names and inventories to NJT-0235, capture of existing
        packets to NJT-0236, and log enumeration to NJT-0233. Local address configuration and local connection state retain the T1016
        and T1049 boundaries. Cloud-provider and container-resource inventories remain NJT-0139 and NJT-0179. Reading stored records
        is not packet sniffing, and pre-access external probing is outside this technique.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者取得终端、管理节点、容器或网络设备访问后，可能需要寻找下一台可调查系统，而尚不知道地址范围或不愿先做广泛探测。已有远端主机记录可以提供有限的初始候选；目录或管理视图则可能提供授权范围内的登记系统。结果可用于选择后续确认、服务调查或横向访问目标，但并不替代那些动作的独立证据。
        en: After accessing an endpoint, management node, container, or network device, an adversary may need another system to investigate
          without knowing the address range or first conducting broad probing. Existing remote-host records can provide limited initial
          candidates; directory or management views may expose registered systems within authorized scope. Results can guide later confirmation,
          service investigation, or lateral targeting but do not replace separate evidence for those actions.
      - zh: Kinsing 分析中的脚本从 SSH 配置、历史和已知主机资料取得候选后再尝试 SSH。HermeticWizard 则收集已知 IP 后连接验证，并可另外扩展探测范围。这些例子展示候选形成与目标接触可以分阶段发生；不能把整个活动描述成无网络，也不能从后续传播尝试推断每条旧记录都有效。
        en: In the Kinsing analysis, a script obtained candidates from SSH configuration, history, and known-host material before attempting
          SSH. HermeticWizard gathered known IP addresses before connection validation and could additionally expand probing scope.
          These examples separate candidate formation from target contact; they do not make the whole operation network-silent or establish
          that every stored record remained valid.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要在已访问环境读取有关其他系统的信息，或发起查询并接收响应。普通用户可读的本地资料不当然要求管理员权限，但其他用户的配置、受限目录、设备管理视图和专用接口可能另有权限要求。记录内容由先前通信、管理员配置和保存期限约束，不能仅凭一次本地命令假定企业范围的可见性。
          en: The adversary needs access to information about other systems or the ability to query and receive responses within the
            accessed environment. Ordinary user-readable material does not inherently require administration, while other users' configuration,
            restricted directories, device views, and special interfaces may. Contents depend on prior communication, administrative
            configuration, and retention; a local command does not imply enterprise-wide visibility.
        - zh: 复用既存知识要求攻击者识别哪些字段确实指向远端系统，并容忍过期、别名、空表和不可读资料。若再做解析、刷新或连接确认，其请求必须独立计算；操作系统后台维护也可能同时产生网络流量。攻击者无须控制这些后台事件，且不能据读取 API 的存在假定其取到了非空结果。
          en: Reusing existing knowledge requires recognizing fields that actually identify remote systems and tolerating stale records,
            aliases, empty tables, and inaccessible material. Resolution, refresh, or connection confirmation must be accounted for
            separately; operating-system maintenance can also create concurrent traffic. The adversary need not control those background
            events, and an available read API does not establish a nonempty result.
      defender_model:
        paragraphs:
        - zh: 防守方可能具有进程与会话来源、目标连接和网络应答、目录查询、文件访问及资产台账。进程命令说明请求意图，网络应答支持特定时点的接触结果，目录或缓存内容支持所保存事实，三者不能互换。只保存跨段流量或扫描告警时，本地候选提取缺少对应网络事件，主机侧记录因而成为必要补充。
          en: Defenders may have process and session provenance, destination connections and responses, directory queries, file access,
            and asset records. Commands indicate requested behavior, responses support contemporaneous contact, and directory or cache
            contents establish stored facts; these are not interchangeable. Cross-segment traffic or scan alerts alone lack corresponding
            network events for local candidate extraction, making endpoint evidence a necessary complement.
        - zh: Sysmon 进程创建事件不包含 API 返回表，Event 3 默认关闭且仅覆盖其声明的 TCP/UDP 连接；Event 22 的缓存 DNS 事件也不是任意缓存枚举审计。文件读取审计需要实际规则与成功采集，仍通常不保存读取内容。没有命令输出、返回值或其他独立结果证据时，应报告发现尝试或资料访问，保留取得了哪些系统候选的未知状态。
          en: Sysmon process creation does not include API result tables; Event 3 is disabled by default and covers its documented TCP/UDP
            connections. Cached DNS events in Event 22 are not arbitrary cache-enumeration auditing. File-read auditing needs actual
            rules and successful collection and generally does not retain read contents. Without command output, return values, or independent
            result evidence, report a discovery attempt or material access and preserve uncertainty about acquired candidates.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 从本地既存主机知识形成候选使初始发现离开仅观察新增网络探测的检测面
      en: Form initial candidates from existing local host knowledge outside detection limited to fresh network probes
    analysis:
      paragraphs:
      - zh: 攻击者选择读取已经保存的主机标识，代替为取得初始候选先逐目标询问。GetIpNetTable 获取已有 IPv4 映射表，官方将其与发 ARP 的操作分开；Kinsing 的原始分析记录了本地资料提取且未发现用于识别额外目标的主动扫描。这使候选提取表现为本机资料访问，而不是扫描规则预期的目标扇出。效果来源于观察面的差异，并不表示端点无法记录读取、旧记录真实可靠或后续目标不被接触。文档支持痕迹差，事件研究支持恶意采用，对具体漏检效果仍为有条件推断。
        en: The adversary reads already stored host identifiers instead of first asking each target for initial candidates. GetIpNetTable
          retrieves an existing IPv4 mapping table, distinguished in official documentation from operations sending ARP. Original Kinsing
          reporting records local-material extraction without identified active scanning to discover additional targets. Candidate extraction
          therefore appears as local access rather than the target fan-out expected by scan rules. The effect is an observation-surface
          difference, not inability to record reads, reliability of old records, or absence of later target contact. Documentation supports
          the trace distinction and incident analysis supports adversarial use; detector impact remains a conditional inference.
    evidence_keys:
    - B010-T1018-REF-KINSING
    - B010-T1018-REF-GETIPNETTABLE
    - B010-T1018-REF-USINGARP
    - REF-000230
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 本项提出本地既存主机知识复用这一原生子技术，变量是在取得初始远端系统候选时，选择只读取已经留在本机的主机知识，暂不为形成这些候选新增目标验证。它改变证据产生的位置和检测所需的读取上下文；ARP、DNS、SSH 或主机文件只是可能实现，不作为分类名称，也不要求同时读取多种来源。
        en: The proposed native child is Local Host-Knowledge Reuse. Its variable is choosing host knowledge already present locally
          to obtain initial remote-system candidates, without adding target validation to form those candidates. It changes where evidence
          arises and the read context detection needs. ARP, DNS, SSH, and host files are possible implementations, not taxonomy labels,
          and multiple sources need not be read together.
      - zh: 目录或资产视图代查、驻留载体执行、目标范围收敛以及时间和来源分布均已另行搜索。目录查询可属于父级行为，但尚未形成与本地复用清楚分离且证据完整的原生子项；驻留工具本身也不证明独立匿迹变量。扫描时序与来源控制不从 NJT-0001 机械复制。被动报文、服务公告、日志与云或容器资源则按直接信息对象保留相邻技术边界。
        en: Directory or inventory lookup, resident carriers, narrowed target scope, timing, and source distribution were examined separately.
          Directory queries can be parent behavior but have not established an independently evidenced native child distinct from local
          reuse. Resident tools alone do not prove a stealth variable, and scan timing and source control are not mechanically copied
          from NJT-0001. Passive packets, service advertisements, logs, and cloud or container resources retain adjacent boundaries
          by direct information object.
    subtechnique_keys:
    - B010-T1018-CHILD-LOCAL-KNOWLEDGE
proposed_subtechniques:
- temporary_key: B010-T1018-CHILD-LOCAL-KNOWLEDGE
  lineage:
    attck_subtechnique_inherited: false
  name:
    zh: 本地既存主机知识复用
    en: Local Host-Knowledge Reuse
  summary:
    zh: 读取本机已经保存的远端系统知识形成初始候选，避免为候选形成阶段新增逐目标验证，并将关键调查痕迹转为本地访问。
    en: Read remote-system knowledge already stored locally to form initial candidates without fresh per-target validation at that stage,
      moving key surveying traces to local access.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 本地既存主机知识复用是攻击者从当前已访问系统上已经存在的地址映射、名称记录或连接配置中提取远端系统标识，在不为这些初始候选新增目标存活或服务验证的阶段完成候选形成。它复用先前通信或管理配置留下的知识，并不主动创造新的远端观测事实。
      en: Local Host-Knowledge Reuse extracts remote-system identifiers from address mappings, name records, or connection configuration
        already present on the accessed system, forming initial candidates without fresh target-liveness or service validation at that
        stage. It reuses knowledge left by previous communication or administration rather than actively creating new observations of
        remote systems.
    - zh: 变量是候选知识的取得方式，而不是某种缓存、文件、命令或平台。读取 GetIpNetTable 返回的已有映射和解析 SSH 已知主机资料可以具有相同变量；清空缓存后主动重建、向目标发 ARP 或邻居请求、以及后续连接确认不属于这段复用行为。后继验证可以与本项组合，但必须分开记录。
      en: The variable is how candidate knowledge is obtained, not a cache, file, command, or platform. Reading existing mappings returned
        by GetIpNetTable and parsing SSH known-host material can share the variable. Flushing and actively repopulating a cache, sending
        ARP or neighbor requests, and later connection confirmation are outside this reuse stage. Later validation can coexist with
        it but must be recorded separately.
  stealth_characteristics:
    paragraphs:
    - zh: 本地既存主机知识复用把初始候选形成的痕迹从逐目标网络交互转为本机数据读取。仅依靠扫描扇出、拒绝连接或目标服务日志的防守方，没有预期的新增目标接触序列可以用来还原这段调查；需要进程、文件或特定接口观察来识别谁在消费已有知识。该效果不要求读取工具的名称与正常工具相似，也不证明它已绕过所有检测。
      en: Local Host-Knowledge Reuse changes initial candidate formation from per-target interaction into local data access. A defender
        relying only on scan fan-out, rejected connections, or target-service logs lacks the expected fresh contact sequence for reconstructing
        this stage and needs process, file, or interface-specific observation of who consumes existing knowledge. The effect does not
        require a tool name resembling benign software and does not prove bypass of all detection.
    - zh: 代价是知识受当前系统历史与保存状态限制。旧名称、静态配置、无效映射和哈希标识都可能使结果不足以直接使用；普通 DNS 解析又可能转而产生网络请求或缓存命中遥测。读取命令、审计记录和后续精确目标连接仍可暴露活动。没有结果内容时，防守方只能确认资料访问或命令意图，不能声称已经恢复攻击者的候选集合。
      en: Knowledge is limited by the system's history and stored state. Old names, static configuration, invalid mappings, and hashed
        identifiers can make results unusable directly, while ordinary DNS resolution can introduce network requests or cached-query
        telemetry. Read commands, audit records, and later connections to selected targets remain revealing. Without result content,
        defenders can establish material access or command intent but cannot claim recovery of the adversary's candidate set.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入对既存本地主机知识的读取和候选提取，前提是该阶段没有为形成这些候选新发目标验证。Windows 的 GetIpNetTable 与 GetIpNetTable2 是表读取；ResolveIpNetEntry2 则会清除匹配邻居项并发送 ARP
        或 IPv6 邻居请求，不能视为同一种只读行为。Get-DnsClientCache 默认读取本机缓存，但远程 CimSession 会改变访问位置；普通解析调用也不因可能命中缓存而自动归本项。
      en: Include reading existing local host knowledge and extracting candidates when no fresh target validation is added to form them
        at that stage. Windows GetIpNetTable and GetIpNetTable2 retrieve tables; ResolveIpNetEntry2 instead flushes a matching entry
        and sends ARP or IPv6 neighbor solicitation, so it is not the same read-only behavior. Get-DnsClientCache defaults to the local
        cache, but a remote CimSession changes access location. Ordinary resolution does not qualify merely because it might hit cache.
    - zh: 本项不覆盖被动捕获正在流动的报文、查询远端目录、列举服务公告或解析日志。读取本机配置只得到本机地址时也不够；必须取得指向其他系统的标识或有明确提取意图。SSH known_hosts 可含哈希、通配或历史项，ARP 表可空或含无效项，均不能直接解释为当前在线主机。故障排查、备份与客户端正常读取是重要正常反例。
      en: This child excludes passive capture of packets in transit, remote-directory queries, service-advertisement enumeration, and
        log parsing. Local configuration yielding only the local address is insufficient; identifiers of other systems or explicit extraction
        intent are required. SSH known_hosts can contain hashed, pattern-based, or historical entries, and ARP tables can be empty or
        contain invalid entries; these are not directly interpreted as currently live systems. Troubleshooting, backup, and routine
        client reads are important benign counterparts.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 本项适用于已访问系统留有先前远端交互记录而攻击者希望先缩小调查范围的阶段。管理工作站可能留有服务器别名，容器或被侵账户可能留有 SSH 连接资料，普通终端可能保存已解析地址。攻击者可以先得到少量候选再决定是否验证；缺少这些既存记录时，本项无法凭空生成系统知识。
        en: This child applies when an accessed system retains earlier remote-interaction knowledge and the adversary first wants to
          narrow investigation. Management workstations may retain server aliases, containers or compromised accounts may retain SSH
          connection material, and endpoints may hold resolved addresses. A small candidate set can precede a validation decision; absent
          existing records, the child cannot generate system knowledge from nothing.
      - zh: Kinsing 案例支持从本地 SSH 与历史资料提取目标而未识别到额外主动扫描。HermeticWizard 支持先使用本地已知 IP 的阶段，但它混用了其他枚举 API 并继续主动连接，不能作为整个发现过程零网络的案例。两种案例只支持各自报告的资料来源和阶段，不证明攻击者因避免某项告警而作出选择。
        en: Kinsing supports extracting targets from local SSH and history material without identified additional active scanning. HermeticWizard
          supports a stage using locally known IP addresses, but mixes other enumeration APIs and proceeds to active connections; it
          does not demonstrate an entirely network-silent discovery process. The cases support their reported materials and stages,
          not a decision specifically made to avoid a particular alert.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须能以当前身份读取某种已有记录，并理解其中哪些值代表其他系统。可用范围不超过账户权限、挂载视图、缓存内容与记录可解析程度；获取其他用户资料可能需要额外权限。哈希已知主机名不是可直接还原的名称，空表也不是成功取得候选。初始候选阶段无需逐目标回包，但后续行动通常需要另行解决地址和访问条件。
          en: The adversary must read existing records under its current identity and identify values representing other systems. Scope
            is limited by account authority, mount views, cache contents, and parseable records; other users' material can need additional
            privilege. Hashed known-host names are not directly recovered names, and an empty table is not successful candidate acquisition.
            Per-target responses are unnecessary at the initial stage, but later action usually requires separate address and access
            resolution.
        - zh: 攻击者可以接受不完整和过期候选，也可以在读取后继续主动确认；其选择的阶段边界应以实际操作为依据。不能假定调用未公开 DNS 枚举函数在所有 Windows 版本上语义相同，也不能把 WNetOpenEnumW、NetServerEnum
            等同于不会联网的本地读取。没有实现或抓包证据时，保留这些具体路径的未知状态。
          en: The adversary may tolerate incomplete, stale candidates and may actively confirm them after reading; stage boundaries
            follow actual operations. Undocumented DNS-enumeration functions cannot be assumed semantically identical across Windows
            versions, and WNetOpenEnumW or NetServerEnum cannot be treated as network-free local reads. Without implementation or capture
            evidence, those particular paths remain uncertain.
      defender_model:
        paragraphs:
        - zh: 本项针对只看目标交互的观察缺口，防守方仍可能在当前系统看到读取进程、命令参数、审计路径和会话身份。Linux Audit 的已配置读访问规则可记录相关系统调用及路径，但成功打开可读文件不证明完整内容已被读走。Windows 文件系统审计同样需要成功审核与匹配
            SACL；两者均不是任意内存缓存 API 的返回结果遥测。
          en: The child addresses a gap in target-interaction observation, while defenders may still see the reading process, arguments,
            audited path, and session identity on the current system. Configured Linux Audit read-access rules record related syscalls
            and paths, but successful read-capable opening does not prove complete content consumption. Windows file-system auditing
            likewise needs success auditing and a matching SACL. Neither provides return-result telemetry for arbitrary in-memory cache
            APIs.
        - zh: 进程及会话基线可以区分已批准排障与从异常载体消费主机知识的情形，后续目标连接可以补充调查，但不能反推出未保存的读取结果。DNS 缓存查询可能触发 Event 22，系统后台维护也可能与读取并发。跨这几个观察面关联时，应区分本次读取、后台流量和后继验证，并对缺失数据保留明确盲区。
          en: Process and session baselines can distinguish approved troubleshooting from host-knowledge consumption by an unusual carrier.
            Later destination connections strengthen investigation but cannot recover unstored read results by inference. Cached DNS
            queries can trigger Event 22, and operating-system maintenance can coincide with reads. Correlation across these surfaces
            must separate the read, background traffic, and later validation and preserve explicit gaps where data is absent.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 以已有记录读取替代初始目标验证使发现留在网络扫描逻辑之外
      en: Substitute existing-record reads for initial target validation outside network-scan logic
    analysis:
      paragraphs:
      - zh: 读取当前系统已经持有的远端系统标识，可以形成候选而不在这一步新发逐目标存活或服务确认。原本用于发现目标的网络接触序列被本地读取替代，使只观察扫描请求的防守方缺少该阶段的事件。官方表读取与主动解析接口提供明确的操作对照，Kinsing 记录提供实际恶意采用；端点审计仍能覆盖一部分读取，所以这是一种特定观察模型下的缺口，而非彻底无痕。具体告警规避意图和检测率未经实测，置信度为中等。
        en: Reading remote-system identifiers already held by the current system can form candidates without fresh per-target liveness
          or service confirmation at that step. Local access replaces the contact sequence that would otherwise acquire candidates,
          leaving scan-request-only observers without events for this stage. Official table-read versus active-resolution semantics
          provide an operational contrast and Kinsing establishes adversarial use. Endpoint auditing still covers some reads, so this
          is a gap in a particular observation model rather than absence of all traces. Specific alert-evasion intent and detection
          rates are unmeasured, supporting medium confidence.
    evidence_keys:
    - B010-T1018-REF-KINSING
    - B010-T1018-REF-GETIPNETTABLE
    - B010-T1018-REF-USINGARP
    - B010-T1018-REF-RESOLVEIPNETENTRY2
    - REF-000230
    confidence: medium
  defense:
    detection_strategy_keys:
    - B010-T1018-DET-COMMAND-CONTEXT
    - B010-T1018-DET-LOCAL-MATERIAL
    mitigation_keys:
    - B010-T1018-MIT-HOST-KNOWLEDGE
  evidence:
    claim_keys:
    - B010-T1018-CLM-LOCAL-READ
    - B010-T1018-CLM-KINSING
    - B010-T1018-CLM-CANDIDATE-NOT-LIVE
    - B010-T1018-CLM-OBSERVATION-GAP
    case_keys:
    - B010-T1018-CASE-KINSING
    - B010-T1018-CASE-HERMETICWIZARD
    reference_keys:
    - B010-T1018-REF-KINSING
    - REF-000988
    - B010-T1018-REF-GETIPNETTABLE
    - B010-T1018-REF-USINGARP
    - B010-T1018-REF-GETIPNETTABLE2
    - B010-T1018-REF-NEIGHBOR-ROW
    - B010-T1018-REF-RESOLVEIPNETENTRY2
    - B010-T1018-REF-DNSCLIENTCACHE
    - B010-T1018-REF-DNS-CONSTANTS
    - B010-T1018-REF-IPCONFIG
    - B010-T1018-REF-SSH
    - REF-000614
    - REF-000230
    - REF-001042
    - REF-000201
  research:
    limitations:
      paragraphs:
      - zh: Kinsing 资料是对特定脚本和受控运行的分析，其未发现额外主动扫描不能推广为所有变种均无扫描。HermeticWizard 的多个 API 中仅有已核实的表读取路径用于说明本地复用；DNSGetCacheDataTable 缺少这里可依赖的稳定公开接口合同，其他枚举函数也可能联网，因此不据整个
          API 清单作零网络结论。
        en: Kinsing reporting analyzes a particular script and controlled execution; absence of identified additional scanning does
          not establish scan-free behavior in every variant. Only verified table-retrieval paths in HermeticWizard's API set illustrate
          local reuse. DNSGetCacheDataTable lacks a stable public contract relied on here, and other enumeration functions can contact
          the network, so the full API list does not support a network-free conclusion.
      - zh: 官方文档支持读取与主动刷新在操作语义上的差异，未提供对目标检测系统的漏检实验。过期、无效和哈希记录限制候选可用性，本机高权限攻击者又可读取用户私有资料或削弱审计。未来需要带实际返回结果与前后网络捕获的实验，才能提高特定接口路径和量化匿迹效果的置信度。
        en: Official documentation establishes operational differences between reading and active refresh, not miss-rate experiments
          against a target detector. Stale, invalid, and hashed records limit candidate usefulness, while locally privileged adversaries
          can read private material or weaken auditing. Experiments retaining actual results and before-and-after network captures are
          needed to increase confidence in particular interface paths and quantified stealth effects.
defense_candidates:
  detection_strategies:
  - temporary_key: B010-T1018-DET-COMMAND-CONTEXT
    name:
      zh: 远端主机调查命令与会话上下文关联
      en: Remote-Host Survey Commands and Session Context
    summary:
      zh: 识别执行上下文异常的主机枚举与本地缓存读取请求，并区分命令意图与实际发现结果。
      en: Identify host-enumeration and local-cache read requests in anomalous execution contexts while separating command intent from
        discovery results.
    description:
      paragraphs:
      - zh: 本策略以执行请求而非扫描成功为对象，覆盖系统工具发起的远端系统调查与现有缓存读取。关联进程父链、用户和会话内相邻命令，发现与批准排障或盘点不同的用途。分析不会从命令创建事件推断非空返回、在线主机或成功横移；直接 API 枚举和未记录的脚本内调用保留为覆盖限制。
        en: This strategy detects execution requests rather than successful scanning, covering system-tool requests for remote systems
          and existing cache reads. Process ancestry, users, and neighboring commands within a session distinguish activity from approved
          troubleshooting or inventory. Process creation does not establish nonempty results, live hosts, or successful lateral movement;
          direct API enumeration and unrecorded in-process script calls remain coverage limits.
    detects_keys:
    - B010-T1018-PARENT
    - B010-T1018-CHILD-LOCAL-KNOWLEDGE
    domains:
    - enterprise
    analytic_keys:
    - B010-T1018-NJA-WINDOWS-COMMANDS
    evidence_keys:
    - REF-000230
    - B010-T1018-REF-ARP
    - B010-T1018-REF-IPCONFIG
    - B010-T1018-REF-KINSING
    - REF-000625
  - temporary_key: B010-T1018-DET-LOCAL-MATERIAL
    name:
      zh: 既存主机资料异常读取调查
      en: Investigate Anomalous Reads of Existing Host Material
    summary:
      zh: 从已配置的文件读访问审计识别异常进程对远端主机资料的消费请求，补足网络扫描观察缺口。
      en: Use configured file read-access auditing to identify unusual processes requesting remote-host material and complement network-scan
        observation.
    description:
      paragraphs:
      - zh: 本策略关注当前系统上的候选知识读取，使用已验证可采集的路径、执行主体和系统调用结果来识别异常消费者。它与命令策略分工：前者观察实际文件访问，后者观察显式命令意图。两者不把成功打开解释为完整读取，也不声称覆盖任意内存缓存 API；需用环境中的正常客户端、备份和排障用途约束解释。
        en: 'This strategy addresses candidate-knowledge access on the current system using verified paths, principals, and syscall
          outcomes to identify unusual consumers. It complements command detection: one observes file access and the other explicit
          command intent. Neither equates successful opening with complete reading or covers arbitrary in-memory cache APIs, and interpretation
          depends on the environment''s normal client, backup, and troubleshooting uses.'
    detects_keys:
    - B010-T1018-PARENT
    - B010-T1018-CHILD-LOCAL-KNOWLEDGE
    domains:
    - enterprise
    analytic_keys:
    - B010-T1018-NJA-LINUX-READS
    evidence_keys:
    - B010-T1018-REF-KINSING
    - REF-001042
    - REF-000201
    - B010-T1018-REF-SSH
    - REF-000840
  detection_analytics:
  - temporary_key: B010-T1018-NJA-WINDOWS-COMMANDS
    strategy_key: B010-T1018-DET-COMMAND-CONTEXT
    name:
      zh: Windows 远端系统调查与缓存显示命令分析
      en: Windows Remote-System Survey and Cache-Display Command Analysis
    summary:
      zh: 对主机枚举或缓存显示命令按进程父链、用户与会话分组，输出待调查的发现尝试。
      en: Group host-enumeration or cache-display commands by ancestry, user, and session to report discovery attempts requiring investigation.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在启用 Sysmon Event 1 的主机保留完整命令行、进程和父进程 GUID、用户、LogonGuid 与时间。解析命令参数而非只匹配映像名称，将 arp 的显示参数 -a 或 -g 以及 ipconfig 的 /displaydns
          标记为本地已有知识读取请求，将面向远端名称或地址的 ping 和没有目标主机参数的 net view 等标记为主机调查候选；仅显示本机配置的 ipconfig 不纳入主机枚举。net view 带目标主机参数返回共享的情形路由至网络共享发现，无法判断直接对象时保留歧义。
        en: 'On hosts collecting Sysmon Event 1, retain full command lines, process and parent GUIDs, users, LogonGuid, and time. Parse
          arguments rather than image names: arp display options -a or -g and ipconfig /displaydns are requests to read existing local
          knowledge, while ping of remote names or addresses and host-oriented net view without a target-host argument are host-survey
          candidates. Plain ipconfig showing only local configuration is excluded. Route net view with a target-host argument returning
          shares to share discovery and retain ambiguity when the direct object is unclear.'
      - zh: 先在同一主机和 LogonGuid 内以十分钟建立调查序列，再用 ProcessGuid 与 ParentProcessGuid 恢复载体关系。相对于该用户和机器角色基线，异常父进程、未经批准的调查或同会话多种主机资料读取可提高优先级，单次正常排障保留较低优先级。输出明确标为命令级发现尝试，列出所用证据；本分析不要求
          Event 3 或 Event 22，也不从它们的缺席推断无网络或成功隐蔽。
        en: Start with a ten-minute sequence within the same device and LogonGuid, then use ProcessGuid and ParentProcessGuid to reconstruct
          execution ancestry. Raise priority for unusual parents, unapproved surveying, or multiple host-knowledge reads relative to
          the user's and device role's baseline, while ordinary isolated troubleshooting remains lower priority. Label output explicitly
          as command-level discovery attempts with evidence. Event 3 and Event 22 are not required, and their absence is not interpreted
          as network silence or successful evasion.
      - zh: 批准台账与身份映射是需要部署方维护的分析输入，不是 Sysmon 或 Audit 自动给出的结论。按事件时间把 Computer 或 node 映射到 device_ref，将 Windows User 或 Linux auid/uid 映射到稳定
          principal_key，再核对动作、路径、父链范围和批准期限；缺少映射或台账时输出上下文未知，不能直接认定未批准。此分析不依赖命令输出或 API 返回结果；可选结果证据仅用于人工调查，缺失时不补推候选清单。
        en: Approval and identity mapping are deployment-maintained analytic inputs, not conclusions emitted automatically by Sysmon
          or Audit. At event time, map Computer or node to device_ref and Windows User or Linux auid/uid to a stable principal_key,
          then check action, path, parent scope, and approval validity. Missing mappings or register entries yield unknown context rather
          than automatic unauthorized status. The analytic does not depend on command output or API results; optional result evidence
          is only for investigation, and missing evidence is not replaced by an inferred candidate inventory.
    data_requirements:
    - source_type: windows-sysmon-process-create
      name:
        zh: Sysmon 进程创建事件
        en: Sysmon process-creation events
      channel: Microsoft-Windows-Sysmon/Operational Event ID 1
      required_fields:
      - Computer
      - UtcTime
      - ProcessGuid
      - ParentProcessGuid
      - Image
      - CommandLine
      - User
      - LogonGuid
    - source_type: analyst-approved-discovery-baseline
      name:
        zh: 分析人员维护的资产职责与批准调查台账
        en: Analyst-maintained asset-role and approved-survey register
      channel: null
      required_fields:
      - device_ref
      - principal_key
      - device_role
      - approved_action
      - approved_path_scope
      - approved_parent_context
      - valid_from
      - valid_until
      - approval_ref
    - source_type: time-scoped-identity-map
      name:
        zh: 带生效时间的设备和账户标识映射
        en: Time-scoped device and principal identity map
      channel: null
      required_fields:
      - device_ref
      - native_device_name
      - platform
      - native_principal_key
      - principal_key
      - valid_from
      - valid_until
    observables:
    - zh: 带显示参数的 arp 或 DNS 缓存显示请求，且执行主体或父链偏离该主机用途
      en: ARP display or DNS-cache display requests whose principal or ancestry departs from the host's role
    - zh: 同一会话中面向远端系统的调查请求与多类本地主机资料读取相邻出现
      en: Remote-system survey requests adjacent to multiple local host-material reads within a session
    correlation:
      window:
        zh: 十分钟用于初始会话内关联，调查时按真实会话延长；这是部署起点而非经过验证的规避阈值。
        en: Ten minutes for initial session correlation, extended to the real session during investigation; this is a deployment starting
          point rather than a validated evasion threshold.
      dimensions:
      - Computer
      - LogonGuid
      - User
      - ProcessGuid
      - ParentProcessGuid
      - UtcTime
    false_positives:
    - zh: 服务台排障、已批准的资产盘点、网络部署和管理员维护会执行相同命令。
      en: Help-desk troubleshooting, approved inventory, network deployment, and administration run the same commands.
    blind_spots:
    - zh: 直接 API、本地内存读取和未出现在进程命令行中的脚本语义不可见；Event 1 不记录输出或枚举结果。
      en: Direct APIs, local-memory reads, and script semantics absent from process arguments are invisible; Event 1 does not contain
        output or enumeration results.
    - zh: 过滤掉短命进程或失去进程父链时不能完整恢复调查序列，命令变形也需要语义解析。
      en: Filtering short-lived processes or losing ancestry prevents full reconstruction, and altered command forms need semantic parsing.
    tuning_guidance:
      paragraphs:
      - zh: 按设备职责、用户、批准工单和实际参数建立基线，避免仅按微软签名、进程路径或管理员组永久放行。先用实际排障记录确认解析分支，再验证模拟命令能进入采集链路；不以命中率或固定数量阈值宣称恶意。对高权限受侵会话保留单次命令，以免稀少本地读取被最低频次规则消除。
        en: Baseline device roles, users, approved work, and actual arguments rather than permanently allowing Microsoft signatures,
          paths, or administrator groups. Validate parsing against real troubleshooting and verify simulated commands reach collection
          before use. Do not equate match rates or a fixed count with maliciousness. Retain isolated commands from compromised privileged
          sessions so minimum-frequency rules do not erase sparse local reads.
    evidence_keys:
    - REF-000230
    - B010-T1018-REF-ARP
    - B010-T1018-REF-IPCONFIG
    - REF-000625
  - temporary_key: B010-T1018-NJA-LINUX-READS
    strategy_key: B010-T1018-DET-LOCAL-MATERIAL
    name:
      zh: Linux 既存远端主机资料读访问关联
      en: Linux Read-Access Correlation for Existing Remote-Host Material
    summary:
      zh: 关联已审计 SSH 与主机资料的读取请求及调用进程，识别异常账户、载体或跨用户范围。
      en: Correlate audited read-access requests to SSH and host material with calling processes to identify anomalous accounts, carriers,
        or cross-user scope.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 在实际需要保护的 SSH config、known_hosts、历史文件及特定主机映射文件上配置 Linux Audit 读访问规则，使用持久规则和稳定 key，并验证重启、文件替换和用户目录变化后的覆盖。将同一 audit 时间戳及事件序号的
          SYSCALL、PATH 和可用 PROCTITLE 记录合并，取路径、syscall、success、exit、pid、ppid、auid、uid、exe 和 comm。对于 open 或 openat，结合已解码的访问模式识别成功的可读打开；不要把该事件命名为已读完文件，也不要假定所有被审计操作都返回内容。
        en: Configure Linux Audit read-access rules for the SSH config, known_hosts, history, and particular host-mapping files that
          need protection. Persist rules with stable keys and validate coverage after reboot, file replacement, and user-directory changes.
          Merge SYSCALL, PATH, and available PROCTITLE records sharing the audit timestamp and serial, extracting path, syscall, success,
          exit, pid, ppid, auid, uid, exe, and comm. For open or openat, decode access modes to identify successful read-capable opens;
          do not name the event complete-file reading or assume every audited operation returns contents.
      - zh: 在同一主机、登录身份和pid、ppid 与 ses 上下文中以五分钟聚合相关资料访问，优先调查不常读取此类资料的下载载体、异常解释器、跨用户范围和与已知受侵会话关联的单次读取。普通 SSH 客户端、解析器、备份和已批准排障按用途与路径进行解释，不能仅因读取
          hosts 就报警。没有保存文件内容或独立结果时，告警只声称主机资料访问及候选提取嫌疑，不输出已发现 IP 清单或假定后续 SSH 成功。
        en: Aggregate relevant material access over five minutes by host, login identity, and pid, ppid, and ses context, prioritizing
          downloaded carriers, unusual interpreters, cross-user scope, and isolated reads linked to a known compromised session. Interpret
          ordinary SSH clients, resolvers, backups, and approved troubleshooting by purpose and path rather than alerting on every hosts
          read. Without retained contents or independent results, report host-material access and suspected candidate extraction, not
          a discovered-IP list or assumed successful SSH.
      - zh: 批准台账与身份映射是需要部署方维护的分析输入，不是 Sysmon 或 Audit 自动给出的结论。按事件时间把 Computer 或 node 映射到 device_ref，将 Windows User 或 Linux auid/uid 映射到稳定
          principal_key，再核对动作、路径、父链范围和批准期限；缺少映射或台账时输出上下文未知，不能直接认定未批准。此分析不依赖命令输出或 API 返回结果；可选结果证据仅用于人工调查，缺失时不补推候选清单。
        en: Approval and identity mapping are deployment-maintained analytic inputs, not conclusions emitted automatically by Sysmon
          or Audit. At event time, map Computer or node to device_ref and Windows User or Linux auid/uid to a stable principal_key,
          then check action, path, parent scope, and approval validity. Missing mappings or register entries yield unknown context rather
          than automatic unauthorized status. The analytic does not depend on command output or API results; optional result evidence
          is only for investigation, and missing evidence is not replaced by an inferred candidate inventory.
    data_requirements:
    - source_type: linux-audit-file-read-access
      name:
        zh: Linux Audit 目标文件读访问规则记录
        en: Linux Audit targeted file read-access rule records
      channel: /var/log/audit/audit.log
      required_fields:
      - node
      - audit_timestamp
      - audit_serial
      - type
      - syscall
      - success
      - exit
      - pid
      - ppid
      - auid
      - uid
      - exe
      - comm
      - name
      - key
      - ses
      - a0
      - a1
      - a2
      - a3
      - arch
    - source_type: analyst-approved-discovery-baseline
      name:
        zh: 分析人员维护的资产职责与批准调查台账
        en: Analyst-maintained asset-role and approved-survey register
      channel: null
      required_fields:
      - device_ref
      - principal_key
      - device_role
      - approved_action
      - approved_path_scope
      - approved_parent_context
      - valid_from
      - valid_until
      - approval_ref
    - source_type: time-scoped-identity-map
      name:
        zh: 带生效时间的设备和账户标识映射
        en: Time-scoped device and principal identity map
      channel: null
      required_fields:
      - device_ref
      - native_device_name
      - platform
      - native_principal_key
      - principal_key
      - valid_from
      - valid_until
    - source_type: linux-audit-collection-health
      name:
        zh: Linux Audit 规则和采集健康状态
        en: Linux Audit rule and collection-health status
      channel: auditctl -s and auditctl -l, collected by the deployed audit health agent
      required_fields:
      - device_ref
      - timestamp
      - enabled
      - lost
      - backlog
      - loaded_rule_key
      - loaded_rule_path
      - collector_node_name
    observables:
    - zh: 不符合进程职责的 SSH 主机资料可读打开或其他经规则记录的读访问
      en: Read-capable opens or other rule-recorded read accesses to SSH host material inconsistent with process purpose
    - zh: 同一载体短时访问多种远端主机资料或跨越多个用户目录
      en: One carrier accesses multiple remote-host materials or user directories within a short interval
    correlation:
      window:
        zh: 五分钟用于合并连续提取行为，进程生存期和真实登录会话用于调查扩展；不以此作为已验证检测率边界。
        en: Five minutes merges consecutive extraction behavior, with process lifetimes and real login sessions extending investigation;
          this does not establish a validated detection-rate boundary.
      dimensions:
      - node
      - auid
      - uid
      - pid
      - ppid
      - audit_timestamp
      - audit_serial
      - name
    false_positives:
    - zh: SSH 正常启动、备份、同步、配置管理、DNS 排障和安全审计会读取相同文件。
      en: Ordinary SSH startup, backup, synchronization, configuration management, DNS troubleshooting, and security audits read the
        same files.
    blind_spots:
    - zh: 未配置规则、用户路径变化、丢失审计事件、已打开描述符与内存中的缓存 API 不在本分析保证覆盖内；成功打开也不证明内容被消费。
      en: Missing rules, changed user paths, lost audit records, already-open descriptors, and in-memory cache APIs are outside guaranteed
        coverage; successful opening also does not prove content consumption.
    - zh: 容器挂载命名空间会改变路径解释，高权限主体可影响审计；缺少节点标识时不能跨主机使用 PID 关联。
      en: Container mount namespaces change path interpretation, privileged principals can affect auditing, and missing node identity
        prevents cross-host PID correlation.
    - zh: PID 与 PPID 不包含稳定进程生存期；当 PID 重用或 ses 未设置时，不自动重建确定的进程树，只保留同次系统调用和路径的关联。node 需由采集器配置或来源元数据补齐，不能假定每条原始审计记录都有节点字段。
      en: PID and PPID do not encode stable process lifetimes. With PID reuse or an unset ses, do not reconstruct a definitive process
        tree; retain correlation of the syscall and path within the same audit event. Configure node through the collector or source
        metadata rather than assuming every raw record contains it.
    tuning_guidance:
      paragraphs:
      - zh: 先以受控可读打开验证规则、字段合并、权限解码及节点标识，再按主机角色与访问者职责调优。高频公共 hosts 文件可降低权重，跨用户读取私有 SSH 资料提高权重；白名单应绑定用途、身份与路径，不能将整个解释器或备份账户永久豁免。监控 audit
          lost 与 backlog，明确缺失事件时的覆盖中断。
        en: First validate rules, record merging, permission decoding, and node identity through controlled read-capable opens, then
          tune for host roles and reader purpose. Down-weight frequent public hosts access and raise priority for cross-user private
          SSH material. Bind allowances to purpose, identity, and path rather than permanently exempting an interpreter or backup account.
          Monitor audit lost and backlog and mark coverage interruptions when records are missing.
    evidence_keys:
    - REF-001042
    - REF-000201
    - B010-T1018-REF-KINSING
    - B010-T1018-REF-SSH
    - REF-000840
  mitigations:
  - temporary_key: B010-T1018-MIT-HOST-KNOWLEDGE
    name:
      zh: 既存主机知识暴露与读取治理
      en: Existing Host-Knowledge Exposure and Read Governance
    summary:
      zh: 缩小账户和工作负载可读取的远端主机知识，并为必要资料读取保留可核实的上下文。
      en: Limit remote-host knowledge readable by accounts and workloads and preserve verifiable context for necessary access.
    description:
      paragraphs:
      - zh: 本缓解治理本机保存的连接知识，而不是禁用所有名称缓存或正常主机发现。将私有管理配置保存在其账户与用途所需范围内，避免把管理者主目录或完整连接资料复制给普通工作负载；对必须保留的资料部署有针对性的读取审计。对公开或业务必需的记录，预期效果是减少额外暴露并提高调查能力，不能承诺让受侵账户忘记其本来可读的目标。
        en: This mitigation governs locally stored connection knowledge rather than disabling all name caching or normal discovery.
          Keep private management configuration within its required account and purpose, avoid copying administrator home directories
          or complete connection material into ordinary workloads, and target read auditing at necessary material. For public or business-required
          records, the effect is reduced additional exposure and better investigation, not making a compromised account forget targets
          it could already read.
    domains:
    - enterprise
    measures:
    - key: scope-private-connection-material
      name:
        zh: 约束私有连接资料的账户与挂载范围
        en: Scope Private Connection Material by Account and Mount
      description:
        paragraphs:
        - zh: 按实际运维用途检查账户主目录、SSH 配置和已知主机资料的权限与工作负载挂载，采用用户私有目录权限，移除无业务用途的跨账户读取和包含管理连接资料的镜像或副本。保留客户端正常校验主机身份所需内容，不删除可信主机校验来减少枚举。
          en: Review account home directories, SSH configuration, known-host permissions, and workload mounts against operational purpose.
            Use user-private directory permissions and remove unnecessary cross-account reads, images, or copies containing management
            connection material. Preserve data required for normal host-identity verification rather than disabling verification to
            reduce enumeration.
      control_type: exposure-reduction
    - key: reduce-plain-hostname-disclosure
      name:
        zh: 降低已知主机资料的明文标识暴露
        en: Reduce Plaintext Identifier Disclosure in Known-Host Material
      description:
        paragraphs:
        - zh: 在支持且符合运维流程的 OpenSSH 客户端使用 HashKnownHosts，并按变更流程处理已有明文条目；该设置不会自动转换原有文件。核实备份和同步副本同样采用预期格式，避免把哈希误当作对未知低熵主机名的强保密保证。
          en: Use HashKnownHosts on supported OpenSSH clients where operational workflows permit and handle existing plaintext entries
            through change control; the setting does not automatically convert old files. Verify expected formats in backups and synchronized
            copies and do not treat hashing as strong confidentiality for unknown low-entropy hostnames.
      control_type: cost-increasing
    - key: targeted-read-provenance
      name:
        zh: 保留目标资料读取来源
        en: Retain Provenance of Targeted Material Reads
      description:
        paragraphs:
        - zh: 对优先保护资料配置并验证文件读访问审计，保留进程、身份、路径与规则健康信息，外送至受侵账户不能同时删除的存储。控制采集范围以减少普通客户端读取噪声，并定期验证规则随路径和文件更新继续生效。
          en: Configure and validate file read-access auditing for prioritized material, retaining process, identity, path, and rule-health
            information in storage the compromised account cannot delete together. Scope collection to control ordinary-client noise
            and periodically verify rules after path and file changes.
      control_type: detective-support
    applications:
    - target_key: B010-T1018-PARENT
      use:
        paragraphs:
        - zh: 在常被用作调查起点的管理终端、服务器与工作负载检查连接资料可见范围，移除无用途的跨用户主目录访问与管理资料副本，对保留资料部署读取来源审计。将记录知识与实际网络可达性分开治理，必要的目录查询和实时探测仍由对应访问控制和网络措施承担。
          en: Review connection-material visibility on management endpoints, servers, and workloads likely to become surveying footholds.
            Remove unnecessary cross-user home access and management-material copies and audit the provenance of retained reads. Govern
            recorded knowledge separately from actual reachability; required directory queries and fresh probing remain subject to their
            own access and network controls.
      expected_effect:
        paragraphs:
        - zh: 单个受侵身份更难从不必要的本地副本扩大远端候选集合，仍需保留的主机知识读取具有更好的来源证据。
          en: A compromised identity has greater difficulty expanding its candidate set through unnecessary local copies, while reads
            of retained host knowledge have better provenance evidence.
      limitations:
        paragraphs:
        - zh: 不能阻止读取当前账户本来需要的资料、公开映射、远端目录或新鲜主动发现；限制权限与挂载需要测试排障和自动化兼容性，缓存不应被一概禁用。
          en: This does not prevent reading material the current account legitimately needs, public mappings, remote directories, or
            fresh active discovery. Permission and mount changes require troubleshooting and automation compatibility testing, and caches
            should not be disabled indiscriminately.
    - target_key: B010-T1018-CHILD-LOCAL-KNOWLEDGE
      use:
        paragraphs:
        - zh: 优先保护用户私有 SSH 与连接配置，避免其被挂载进不相关容器或复制进通用镜像，支持时减少 known_hosts 明文标识，并验证相关读访问审计。对内存邻居与 DNS 缓存不假设文件审计覆盖，需要结合该平台实际接口可见性记录剩余风险。
          en: Prioritize private SSH and connection configuration, keep it out of unrelated container mounts and general images, reduce
            plaintext known_hosts identifiers where supported, and validate read-access auditing. Do not assume file auditing covers
            in-memory neighbor or DNS caches; record residual risk using the platform's actual interface visibility.
      expected_effect:
        paragraphs:
        - zh: 减少可直接解析的多账户主机知识和额外副本，增加无需探测即可形成候选的成本，同时让文件型复用路径留下可调查的本地来源。
          en: Reduce directly parseable multi-account host knowledge and extra copies, increase the cost of candidate formation without
            probing, and leave investigable local provenance for file-based reuse.
      limitations:
        paragraphs:
        - zh: 攻击者控制目标用户或本机高权限后仍可读取其资料或影响审计；哈希不保护其他配置中的同一名称，也不阻止已知候选的验证。审计成功打开不能证明读走完整文件，访问治理也不使已有缓存失效。
          en: Control of the target user or local privilege can still expose material or affect auditing. Hashing does not protect the
            same names in other configuration or prevent testing known candidates. Audited opening does not prove full-file consumption,
            and access governance does not invalidate existing caches.
    evidence_keys:
    - B010-T1018-REF-SSH
    - REF-000614
    - REF-001042
    - REF-000201
    - B010-T1018-REF-KINSING
