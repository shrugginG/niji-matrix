research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions:
    - source_cluster: T1018 parent behavior only; fixed workbook has no children
      resolution: parent-core
      rationale: Preserve remote-system identifier acquisition without importing a child inventory.
    candidate_stealth_axes_examined:
    - variable: Initial candidate acquisition from knowledge already local, without fresh target confirmation
      resolution: formal
      proposed_key: B010-T1018-CHILD-LOCAL-KNOWLEDGE
      trace_change: Local material access replaces fresh per-target candidate validation at that stage.
      evidence: Kinsing original analysis plus Microsoft table/read and active-resolution semantics.
      defense_difference: Requires command and local-file/API context; scan-only rules do not receive the replaced event sequence.
    - variable: Directory or inventory queries substituting for per-target contact
      resolution: evidence-deferred
      rationale: Computer queries are parent behavior; a stable native child requires same-path actor use, independently verified query/results
        semantics, and a defense distinction beyond local-read reuse. Event 1644 is thresholded rather than exhaustive.
    - variable: Resident-carrier execution without a new enumeration process
      resolution: evidence-deferred
      rationale: HermeticWizard calls APIs, but API use alone does not establish intended process-creation suppression or a distinct
        supported defense variable.
    - variable: Narrowed target set selected from prior records
      resolution: parent-core
      rationale: Candidate-set quality and size alone are not an independently supported child; local reuse can lead to later wide probing
        as in HermeticWizard.
    - variable: Temporal dilution of host-confirmation probes
      resolution: evidence-deferred
      rationale: Kinsing's comment concerns later SSH attempts, and HermeticWizard randomizes service ports; neither proves a separate
        host-discovery cadence child.
    - variable: Distribution across real sources or source-attribution relays
      resolution: evidence-deferred
      rationale: No conclusion-level T1018-specific case and defense distinction in this delivery; do not import NJT-0001 children.
    - variable: DNS list scanning and reverse-name enrichment
      resolution: evidence-deferred
      rationale: Nmap -sL -n merely expands supplied targets. Default reverse DNS may obtain names but does not establish host liveness;
        a separate native class is not justified here.
    - variable: Passive packet learning
      resolution: adjacent-technique
      rationale: NJT-0236 owns capture and interpretation of existing traffic; reading a saved mapping is not packet capture.
    - variable: Service-advertisement lookup
      resolution: adjacent-technique
      rationale: NJT-0234 and NJS-0234-001 own service-instance and endpoint facts; this child yields system candidates, not advertised
        services.
    - variable: Log-derived endpoints or cloud/container inventory
      resolution: adjacent-technique
      rationale: Preserve NJT-0233, NJT-0139 and NJT-0179 direct-object boundaries.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零个 ATT&CK 子项没有被当作停止搜索理由。已检查本地复用、远端索引代查、载体、目标选择、时间、来源与邻近信息对象；只建议一项由稳定取得方式、痕迹变化和防御需求共同支持的原生子项，其余保留具体未成立原因。
      en: Zero ATT&CK children did not terminate the search. Local reuse, remote-index lookup, carriers, target selection, time, sources,
        and adjacent information objects were examined. Only one native child is proposed from a stable acquisition variable, trace
        difference, and defensive need; specific reasons for the remaining resolutions are retained.
  evidence_coverage:
    parent_behavior_keys:
    - REF-000625
    - B010-T1018-REF-KINSING
    - REF-000988
    boundary_keys:
    - B010-T1018-REF-GETIPNETTABLE
    - B010-T1018-REF-GETIPNETTABLE2
    - B010-T1018-REF-NEIGHBOR-ROW
    - B010-T1018-REF-RESOLVEIPNETENTRY2
    - REF-000614
    mechanism_support:
    - mechanism_ref: NM-BT
      keys:
      - B010-T1018-CLM-OBSERVATION-GAP
      strength: Conditional inference from directly documented local candidate acquisition and read-versus-probe semantics; no measured
        detector outcome.
    child_existence_support:
    - child_key: B010-T1018-CHILD-LOCAL-KNOWLEDGE
      keys:
      - B010-T1018-CLM-KINSING
      - B010-T1018-CLM-LOCAL-READ
      - B010-T1018-CLM-CANDIDATE-NOT-LIVE
    unsupported_or_deferred:
    - DNSGetCacheDataTable cross-version public API semantics and generic result telemetry are not established.
    - Not all HermeticWizard APIs are local reads; no zero-network conclusion for the full routine.
    - No packet-capture experiment or detector miss-rate measurement performed in this research.
    - Directory querying remains parent-core behavior and a deferred native taxonomy axis.
    - Windows Event 1 and Linux read-capable opens do not prove returned identifiers or complete content consumption.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已阅读 NJT-0001 实际父正文和规范文档，逐项分开定义、痕迹特性、范围、场景、攻击者能力、防守观察、机理与限制；父子均为完整双语段落。类比仅用于结构与信息责任，未复用扫描子分类或证据。主审仍须检查事实和双语强度，尤其目录行为与本地复用边界。
      en: The actual NJT-0001 parent and specifications were read. Definition, trace properties, scope, scenarios, attacker capabilities,
        defender observation, mechanism, and limitations are separated in complete paired paragraphs for parent and child. The exemplar
        informed structure and responsibilities, without copying scan children or evidence. Primary review still needs to assess factual
        and bilingual strength, especially directory versus local-reuse boundaries.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - Read-only library lookup
    - exact source and object searches
    - YAML syntax verification
  limitations:
    paragraphs:
    - zh: 一手事件分析支持真实恶意资料读取，但未证明主机知识复用的特定检测规避意图或量化效果。官方接口资料提供操作语义，不保证每个版本、包装器和后台状态的具体网络行为。关键结论应保持中等机理置信度，并将实验缺口与行为采用分别记录。
      en: Firsthand incident analyses support adversarial material reads but not a specific detection-evasion intent or quantified effect
        for host-knowledge reuse. Official APIs establish operational semantics without guaranteeing every version, wrapper, and background
        state's exact network behavior. Mechanism confidence should remain medium, with experimental gaps separated from observed adoption.
  rejected_mechanisms:
  - mechanism_ref: NM-FD
    rationale: Normal command and file usage alone do not show intentional outward-feature disguise at this candidate's evidence level.
  - mechanism_ref: NM-ST
    rationale: Fewer fresh probes from knowledge reuse is not demonstrated temporal or spatial trace distribution; later SSH pacing
      is not host-candidate discovery evidence.
  - mechanism_ref: NM-DO
    rationale: HashKnownHosts is a defensive control here, not evidence that adversaries obscure their discovery data; no supported
      fragmentation or payload-obscuration variable.
  open_questions:
  - Obtain paired API-result and packet-capture experiments for specified local-read implementations, distinguishing background maintenance
    from explicit refresh.
  - Determine whether future original incidents establish a distinct directory/index-substitution child with server-side query evidence
    and defensible telemetry.
  - Validate exact Sysmon Event 1 deployment schema and Linux Audit node normalization before deploying proposed analytics; neither
    has been run as a production detector.
  telemetry_contracts:
    approval_and_identity_inputs:
      status: deployment-maintained contract; not native OS telemetry
      required: true
      absence_handling: Unknown context; absence is not evidence of malicious intent or lack of approval.
    optional_result_evidence:
      status: Not consumed by the proposed baseline analytics; deployment and validation required before use
      fields:
      - device_ref
      - process_instance_or_audit_event_ref
      - capture_time
      - source_operation
      - return_status
      - returned_record_count
      - returned_record_identifiers
      - content_hash
      - provenance_ref
      acquisition: Deliberately configured command-output capture, instrumented API-result capture, or separately acquired forensic
        artifact. No claim that Sysmon or generic audit provides this.
      interpretation: Nonempty identifiers support record acquisition only. A mapping or name remains distinct from liveness, service,
        authentication, or lateral movement.
    custom_api_sensor:
      proposed: false
      reason: No native or generic API-result sensor established; future instrumentation must validate actual invocation/results and
        packet effects.
    linux_host_identity:
      required: Collector-configured node or trusted collector envelope; mapping to device_ref at event time
      pid_reuse: No definitive process-tree or process-instance identity inferred from PID alone.
