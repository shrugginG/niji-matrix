  decisions:
  - existing_ref: REF-000625
    resolution: reuse
    rationale: Fixed Enterprise 19.1 T1018 behavior anchor only; use the batch workbook extract for version identity.
  - existing_ref: REF-000988
    resolution: extend
    rationale: Same ESET publication; replace the repost URL with the verified original publication, add 2022-03-01 date and HermeticWizard
      locator while preserving HermeticWiper block-write facts.
  - existing_ref: REF-000230
    resolution: extend
    rationale: Same Microsoft Sysmon publication identity already includes Sysinternals URL; add explicit Events 1, 3, and 22 locators,
      not a duplicate source.
  - existing_ref: REF-001042
    resolution: reuse
    rationale: RHEL 7 Audit record definitions supply the fields required by the file-access analytic.
  - existing_ref: REF-000201
    resolution: extend
    rationale: RHEL 9 Auditing the system already covers persistent rules; verify current chapter read-watch semantics and add locator
      instead of duplicating chapter.
  - existing_ref: CASE-000287
    resolution: split
    rationale: Existing HermeticWiper case is block-level destructive activity. HermeticWizard host-candidate gathering has a different
      central behavior; retain publication reuse but propose a separate case.
  - existing_ref: MIT-000244
    resolution: split
    rationale: Shared-resource enumeration restrictions are not local host-knowledge exposure or private SSH material controls.
  - existing_ref: MIT-000172
    resolution: defer
    rationale: Network segmentation and relay governance can constrain later contact but does not prevent reading local candidate records;
      do not extend merely for a broad network-control title.
  - existing_ref: REF-000840
    resolution: extend
    rationale: Same auditctl manual; add read-access rules, performance, mount constraints, and lost/backlog status locators for this
      analytic.
  - existing_ref: REF-000614
    resolution: extend
    rationale: OpenBSD ssh_config and ssh_config.5 resolve to the same manual. Preserve ControlMaster facts and extend HashKnownHosts/Host/Hostname
      locator rather than duplicating publication.
