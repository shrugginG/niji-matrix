review_notes_zh: T1018 retain 形成 NJT-0242 远程系统发现及 NJS-0242-001 本地既存主机知识复用，父子均采用中等置信 NM-BT。两项阶段限定案例与操作语义支持本地候选形成，未宣称所有记录在线或整个活动无网络。Windows
  命令与 Linux 文件访问分别具有可实施分析及显式盲区，缓解保留正常主机验证。最终机器、Bundle 和双语 Web 状态由验收脚本依据实际结果填充；完成人工领域审查前保持 review，TA0007 不关闭。
review_notes_en: Retaining T1018 yields NJT-0242 Remote System Discovery and NJS-0242-001 Local Host-Knowledge Reuse, both
  with medium-confidence NM-BT. Two stage-limited cases and operational semantics support local candidate formation without
  claiming all records are live or the whole operation is network-silent. Windows commands and Linux material access have
  separate implementable analytics and explicit blind spots, while mitigation preserves normal host verification. The acceptance
  script fills final machine, bundle and bilingual Web states from actual results. Keep review pending human domain approval
  and leave TA0007 open.
