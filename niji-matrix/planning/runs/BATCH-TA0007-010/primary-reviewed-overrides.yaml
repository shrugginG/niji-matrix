type: primary-reviewed-content-overrides
candidate: T1018
date: '2026-11-07'
parent_taxonomy:
  narrative:
    paragraphs:
    - zh: 本技术以本地既存主机知识复用划分一项匿迹子技术。其稳定变量是在形成初始远端系统候选时，选择读取当前系统已经持有的记录，而不是先为这些候选新增目标确认。分类对应观察位置从目标交互转向本地读取的变化；地址映射、名称缓存和连接配置是可能载体，不分别构成子项。
      en: This technique defines Local Host-Knowledge Reuse as one evasion sub-technique. Its stable variable is reading records already held by the current system to form initial remote-system candidates instead of first adding target confirmation. The partition corresponds to observation moving from target interaction to local access; address mappings, name caches, and connection configuration are possible carriers rather than separate children.
    - zh: 主动确认、目录中的计算机查询与其他有证据支持的系统标识获取仍属于父技术范围。目标数量、查询工具和驻留载体本身不足以建立独立匿迹分类；时间或来源分散需要自己的行为控制与观察差异证据。后续验证可以与本地复用组合，不能由此把整个活动称为无网络，也不能将被动报文、服务公告、日志或资源清单所拥有的相邻对象合并进本分类。
      en: Active confirmation, directory computer queries, and other evidenced acquisition of system identifiers remain within the parent. Target counts, query tools, and resident carriers alone do not establish independent evasion classes; timing or source distribution needs its own control and observation evidence. Later validation can coexist with local reuse without making the entire operation network-silent or absorbing adjacent packet, service-advertisement, log, or resource-inventory objects.
parent_limitations:
  paragraphs:
  - zh: Kinsing 与 HermeticWizard 的原始分析分别支持特定资料提取和已知地址收集阶段，不能代表所有变种，也不能把报告中混合使用的全部接口解释为本地只读。记录和目录中的名称可能过期、为别名、缺乏当前解析或不对应可达的独立主机；空表、无效项和哈希名称进一步限制结果。后续认证、服务接触或传播不能补证初始清单完整性。
    en: The original Kinsing and HermeticWizard analyses support particular material-extraction and known-address stages, not every variant or an interpretation of every listed interface as a local read. Recorded and directory names can be stale aliases, lack current resolution, or fail to identify a reachable distinct host; empty tables, invalid entries, and hashed names further constrain results. Later authentication, service contact, or propagation cannot establish completeness of the initial inventory.
  - zh: 匿迹结论来自本地读取与新增目标交互之间的观察差异，尚无针对具体检测器的漏检率实验。现有检测分别覆盖 Windows 显式命令和经配置的 Linux 文件访问；直接内存缓存 API、未记录的应用内查询以及未启用的审计仍是盲区。官方接口与事件文档支持能力和字段合同，实际部署需要验证采集、身份映射、时钟和正常用途基线，不能由机器校验通过推断检测已经在真实环境生效。
    en: The stealth conclusion follows from the observation difference between local reads and fresh target interaction, without measured miss rates against a particular detector. The provided analytics cover explicit Windows commands and configured Linux file access. Direct in-memory cache APIs, unrecorded in-application queries, and disabled auditing remain blind spots. Official APIs and event documentation support capabilities and field contracts; deployment must validate collection, identity mapping, clocks, and normal-purpose baselines rather than infer operational detection from machine validation.
windows_logic:
  paragraphs:
  - zh: 在启用 Sysmon Event 1 的主机读取完整命令行、进程和父进程 GUID、用户、LogonGuid 与时间。按参数语义识别 arp -a 或 -g 以及 ipconfig /displaydns 的本地知识显示请求；单纯 ipconfig 属于本机配置。没有目标主机参数的 net view，以及指定 /domain:名称的计算机列表请求，可标记为主机调查尝试；仅 /domain 返回域列表，不能当成计算机清单。带目标主机参数的 net view 查询共享，路由至网络共享发现。ping 必须有远端目标，排除明确的 localhost、环回地址及能够核实的本机名称；无法确定目标或选项语义时保留歧义，不从映像名称推断调查对象。
    en: On hosts collecting Sysmon Event 1, read full command lines, process and parent GUIDs, users, LogonGuid, and time. Parse arp -a or -g and ipconfig /displaydns as requests to display local knowledge; plain ipconfig concerns local configuration. Bare net view without a target-host argument and computer-list requests with /domain:name can indicate host-survey attempts. A bare /domain lists domains rather than computers. Net view with a target-host argument requests shares and belongs to share discovery. Ping requires a remote target; exclude explicit localhost, loopback addresses, and verifiable local names. Preserve uncertainty about target or option semantics rather than infer the information object from image names.
  - zh: 先在同一设备和有效 LogonGuid 内以十分钟关联相邻调查请求，再由 ProcessGuid 与 ParentProcessGuid 关联已记录父链。空、全零或无法解析的会话 GUID 不作为可合并的公共会话；此时只保留进程 GUID 关联并标记会话未知。用事件时间有效的账户映射和设备职责、批准台账比较所请求动作与父链上下文；异常父进程、越出批准范围的调查及同会话多种资料显示请求提高调查优先级，但单次请求也保留。台账缺失或关联失败表示上下文未知，不能据此认定未批准。
    en: Initially correlate neighboring survey requests over ten minutes within the same device and valid LogonGuid, using ProcessGuid and ParentProcessGuid for recorded ancestry. Empty, zero, or unparseable session GUIDs must not become a shared session key; retain process-GUID associations with unknown session instead. Compare requested actions and ancestry with event-time account mapping, device roles, and approval records. Unusual parents, surveying outside approved scope, and multiple material-display requests raise investigative priority without discarding isolated requests. Missing registers or failed joins mean unknown context rather than unauthorized activity.
  - zh: 身份映射应保留 Computer、User 原值及映射生效期，不能用今天的资产归属替换事件时的设备或账户。批准数据只约束用途，不是恶意判据。本分析输出命令级发现尝试及所依据的事件，不消费命令输出或 API 返回值，也不要求 Event 3、Event 22 或后续连接。没有独立结果证据时不输出非空主机清单，不把事件缺席解释为无网络或已成功规避。
    en: Preserve native Computer and User values and mapping validity, without replacing event-time device or account ownership with today's inventory. Approval data describes purpose rather than establishing maliciousness. This analytic reports command-level discovery attempts and supporting events, consumes no command output or API returns, and requires neither Event 3, Event 22, nor later connections. Without independent result evidence, it produces no nonempty host inventory and does not interpret missing events as network silence or successful evasion.
windows_normalization:
  zh: 数据要求使用规范字段 computer、utc_time、process_guid、parent_process_guid、image、command_line、user、logon_guid 和 parent_image，依次对应 Sysmon 原始 Computer、UtcTime、ProcessGuid、ParentProcessGuid、Image、CommandLine、User、LogonGuid 和 ParentImage；Computer 来自事件系统头，其余值按部署版本的事件数据提取。规范化只改变键名，保留原值、时间精度和缺失状态，不把不存在的 GUID 或父链填为有效身份。
  en: The required canonical fields computer, utc_time, process_guid, parent_process_guid, image, command_line, user, logon_guid, and parent_image map respectively to native Sysmon Computer, UtcTime, ProcessGuid, ParentProcessGuid, Image, CommandLine, User, LogonGuid, and ParentImage. Computer comes from the event system header; extract the other values from event data for the deployed version. Normalization changes keys only, preserving values, time precision, and missing states rather than inventing valid GUIDs or ancestry.
linux_logic:
  paragraphs:
  - zh: 对需要保护的 SSH config、known_hosts、历史及特定主机映射文件部署持久 Linux Audit 读访问规则，使用稳定 key，并验证文件替换、用户目录和挂载变化后的覆盖。按采集器提供的主机标识、启动实例、audit 时间戳和事件序号合并 SYSCALL 与 PATH；name、syscall、success、exit、pid、ppid、auid、uid、ses、exe、comm、arch 和 a0-a3 均取自相应记录。路径和系统调用记录未配齐时，保留记录缺失而非拼接邻近进程的访问。
    en: Deploy persistent Linux Audit read-access rules with stable keys for protected SSH config, known_hosts, history, and particular host-mapping files, validating coverage after file replacement, user-directory changes, and mount changes. Join SYSCALL and PATH by collector host identity, boot instance, audit timestamp, and event serial. Obtain name, syscall, success, exit, pid, ppid, auid, uid, ses, exe, comm, arch, and a0-a3 from their respective records. Missing path or syscall records remain incomplete rather than being filled from a nearby process's access.
  - zh: 根据 arch 解码系统调用号及参数；open 的标志位来自 a1，openat 来自 a2，再结合 success 与 exit 区分成功的可读打开和失败尝试。openat2 的参数包含指向结构的指针，原始 a0-a3 不能直接提供其访问模式；只有经过验证的规则语义或额外解析证据才可补充，否则保留模式未知。成功的可读打开不等于返回了文件正文，更不等于解析出了哪些主机；既有文件描述符及内存缓存读取也不因本规则存在就被完整覆盖。
    en: Decode syscall numbers and arguments using arch; open flags are in a1 and openat flags in a2. Combine mode, success, and exit to separate successful read-capable opens from failed attempts. Openat2 includes a pointer to an argument structure, so raw a0-a3 do not directly supply its access mode. Only validated rule semantics or additional parsing evidence can supplement it; otherwise retain unknown mode. A successful read-capable open does not establish returned file contents or parsed hosts, and these rules do not guarantee coverage of existing descriptors or in-memory cache reads.
  - zh: 以五分钟汇总同一设备和有效登录身份的相关资料访问，结合采集器的启动实例与事件时身份映射保留 auid、uid、ses 的不同含义。未设置的 auid 或 ses 不与其他未知会话合并；PID、PPID 只支持候选关联，没有独立进程生存期时不重建确定进程树。按批准台账中的动作、路径、用途和有效期识别职责偏离；缺少台账或身份映射时保留上下文未知，普通 SSH、备份、解析器及排障读取是正常反例。已知受侵会话的一次读取也可调查，不设置排除稀少操作的最低频次。
    en: Aggregate related access over five minutes within a device and valid login context, preserving the distinct meanings of auid, uid, and ses through boot-scoped collector identity and event-time mapping. Unset auid or ses values must not merge unknown sessions. PID and PPID support tentative associations rather than a definitive process tree without independent lifetime evidence. Compare actions, paths, purpose, and validity with approval records, retaining unknown context if registers or identity joins are absent. Ordinary SSH, backups, resolvers, and troubleshooting are benign counterparts. An isolated read in a compromised session remains investigable without a minimum-frequency exclusion.
  - zh: auditctl -l 的规则清单与 auditctl -s 的 enabled、lost、backlog 由采集健康代理按时间送入，主机标识和启动实例来自采集器元数据，不能假定原始记录总有 node。lost 增长、规则缺失或持续积压表示对应时段覆盖受损；容器路径必须结合实际挂载视图解释，无法映射时保留路径范围未知。告警仅声明资料访问或候选提取嫌疑，不依赖保存正文，也不补推 IP 清单、跨主机主体或 SSH 成功。
    en: A collection-health agent supplies time-stamped auditctl -l rules and auditctl -s enabled, lost, and backlog values. Collector metadata supplies host identity and boot instance; native records do not always contain node. Increasing lost counts, missing rules, or sustained backlog indicate impaired coverage for that interval. Interpret container paths using the actual mount view and retain unknown path scope when it cannot be mapped. Report material access or suspected candidate extraction without requiring retained contents or inferring IP inventories, cross-host actors, or successful SSH.
