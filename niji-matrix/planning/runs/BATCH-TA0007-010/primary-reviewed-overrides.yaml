  - B010-T1018-CHILD-LOCAL-KNOWLEDGE
  - B010-T1018-DET-COMMAND-CONTEXT
  - B010-T1018-NJA-WINDOWS-COMMANDS
  statement:
    zh: Sysmon 进程创建记录提供调查命令上下文而非返回主机清单；net view 的裸命令、仅 /domain 与目标主机参数分别对应计算机、域及共享等不同直接对象，不能仅按映像名判断。
    en: Sysmon process creation supplies survey-command context rather than returned host inventories. Bare net view, a bare /domain, and a target-host argument address computers, domains, and shares respectively, so image names alone cannot identify the information object.
  evidence_keys:
  - REF-000230
  - REF-001250
- temporary_key: B010-T1018-CLM-READ-EVIDENCE
  claim_type: detection
  evidence_mode: strongly-inferred
  confidence: high
  subject_keys:
  - B010-T1018-PARENT
  - B010-T1018-CHILD-LOCAL-KNOWLEDGE
  - B010-T1018-DET-LOCAL-MATERIAL
  - B010-T1018-NJA-LINUX-READS
  statement:
    zh: 经配置的 Linux Audit 规则可将相关 SYSCALL 和 PATH 记录关联到文件读访问请求及结果，但成功的可读打开不证明文件内容被消费；主机和进程归属还依赖采集器标识、时间范围与完整记录。
    en: Configured Linux Audit rules can join SYSCALL and PATH records for file read-access requests and outcomes, but a successful read-capable open does not establish content consumption. Host and process attribution additionally depend on collector identity, time scope, and complete records.
  evidence_keys:
  - REF-001042
  - REF-000201
  - REF-000840
  - B010-T1018-REF-OPEN
  - B010-T1018-REF-OPENAT2
- temporary_key: B010-T1018-CLM-HOSTNAME-EXPOSURE
