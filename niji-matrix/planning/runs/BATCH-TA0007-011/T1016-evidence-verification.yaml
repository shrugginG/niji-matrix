verification_schema_version: 1.0.0
batch_ref: BATCH-TA0007-011
candidate_attack_id: T1016
verified_on: '2026-11-07'
researcher_scope: research-only
canonical_ids_allocated: false
canonical_files_modified: false
recommendation:
  admission: retain
  mechanism_ref: NM-FD
  mechanism_confidence: medium
  formal_child_count: 1
  taxonomy_coverage: established
  rationale:
    zh: 固定父行为与恶意采用成立；补充独立核验的 Metador 命令 63 后，既有内存载体、适配器 getter 与结果回传形成正面链，足以建议一项驻留内联网络配置调查。子项的当前依据为实现能力，不是逐受害输出或实测匿迹效果。
    en: The fixed parent and adversarial use are established. Independent verification of Metador command 63 supplies a positive
      chain of existing in-memory carrier, adapter getter, and result return, supporting one Resident Inline Network-Configuration
      Survey child. Its evidence concerns implementation capability rather than per-victim returns or measured stealth.
  mechanism_refs:
  - NM-BT
  - NM-FD
source_archive:
  directory: evidence/T1016
  manifest: evidence/T1016/download-manifest.json
  hash_algorithm: sha256
  notes:
    zh: 所有成功下载逐项记录请求地址、重定向结果、字节数和散列。AA24-038A 的 FBI PDF 可经 Web 工具读取并做第 34 页截图核验，但 Python 请求被 403 拒绝，保留失败记录，不伪称本地已存 PDF。
    en: Every successful download records the requested URL, resolved URL, size, and hash. The FBI PDF of AA24-038A was read through
      the Web tool and checked with a screenshot of printed page 34, while Python received 403. The failure is retained rather
      than claiming a local PDF archive.
primary_source_checks:
- key: fixed-baseline
  source_identity: B011-T1016-REF-BASELINE
  source_url: https://attack.mitre.org/techniques/T1016/
  evidence_file: fixed-baseline-T1016.json
  verification_route: local-pinned-workbook-extract-and-current-primary-page
  exact_locator: enterprise-attack-v19.1-techniques.xlsx, techniques sheet, T1016/T1016.001/T1016.002
  finding:
    zh: 本地固定版本为 Enterprise 19.1，父对象是接口、地址、路由与网络设置，两个参考子项分别涉及连接能力与无线网络。v19 归档页通过 Web 工具不可达；当前父页仅旁证内容，未改变本批版本范围。
    en: The local fixed version is Enterprise 19.1. The parent concerns interfaces, addresses, routes, and network settings, with
      reference children for connectivity and wireless networks. The v19 archive page was inaccessible through the Web tool. The
      current parent page corroborates content without changing this delivery's version scope.
  conclusion_level: parent-scope-only
- key: volt-advisory
  source_identity: REF-000025
  source_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-038a
  official_distribution_url: https://www.fbi.gov/file-repository/cyber-alerts/prc-state-sponsored-actors-compromise-and-maintain-persistent-access-to-u-s-critical-infrastructure.pdf
  verification_route: web-primary-pdf-text-and-page-screenshot
  exact_locator: Appendix A observed commands, printed page 34 of 45, ipconfig row; adjacent netstat -ano row remains separate
  finding:
    zh: 直接观测命令表列出 ipconfig。仅支持恶意操作者使用该配置诊断实现，不提供参数、各台主机返回值、查询时刻或成功规避检测。CISA 网页与 FBI 分发 PDF 是同一出版物，不建立第二来源身份。
    en: The observed-command table explicitly lists ipconfig. It establishes adversarial use of that configuration diagnostic,
      not arguments, per-host returns, timing, or successful evasion. The CISA page and FBI-distributed PDF are one publication
      rather than two source identities.
  conclusion_level: observed-adversarial-command-use
- key: volt-intent
  source_identity: REF-000073
  source_url: https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/
  evidence_file: evidence/T1016/volt-microsoft.html
  exact_locator: Opening campaign description and emphasis on stealth; post-compromise activity
  finding:
    zh: 原始调查明示 Volt Typhoon 强调隐蔽并几乎完全依靠就地取材与人工命令。与具体 ipconfig 观察和正常工具合同结合可支持父级特征伪装推断，但一般动机不能证明每个配置读取的特殊规避设计。
    en: The original investigation explicitly describes emphasis on stealth and near-exclusive reliance on living off the land
      and hands-on-keyboard commands. Combined with the specific ipconfig observation and normal utility contract, it supports
      the parent-level Feature Disguise inference. General motive does not establish a special evasion design for every configuration
      read.
  conclusion_level: campaign-intent-not-per-query-effect
- key: lunar-config
  source_identity: REF-000639
  source_url: https://www.welivesecurity.com/en/eset-research/moon-backdoors-lunar-landing-diplomatic-missions/
  evidence_file: evidence/T1016/lunar.html
  exact_locator: LunarWeb command handling and recovered command-package paragraph; ATT&CK table network-adapter row
  finding:
    zh: ESET 恢复的 shell 命令包含网络配置及连接侦察，其作者技术映射另说明适配器信息取得。仅据文章不能补写具体 ipconfig 参数或逐命令输出，也不能确认这些查询采用驻留 API 而不是恢复包中的 shell 承载。
    en: ESET's recovered shell-command package includes configuration and connection reconnaissance, and the authors' mapping additionally
      describes adapter-information acquisition. The article alone does not supply particular ipconfig arguments or per-command
      returns, nor establish resident API execution instead of the recovered package's shell carrier.
  conclusion_level: recovered-task-and-reported-capability
- key: sunburst-dns
  source_identity: REF-000626
  source_url: https://cloud.google.com/blog/topics/threat-intelligence/sunburst-additional-technical-details/
  evidence_file: evidence/T1016/sunburst.html
  exact_locator: Anti-Analysis Environment Checks, final paragraph before blocklists
  finding:
    zh: 原始逆向将 api.solarwinds.com 解析作为样本的连通性检查，并描述失败后的停止和后续重试。本交接只保留其实际输入及结果层级负面对照；解析成功不是任意互联网或某业务服务成功，也不把后继门控复制为 NJS。
    en: Original reverse engineering identifies resolution of api.solarwinds.com as the sample's connectivity check and describes
      stopping and retrying after failure. This handoff retains the actual input and its result-level negative control. Resolution
      success does not establish arbitrary Internet or business-service success, and later gating is not copied as an NJS.
  conclusion_level: sample-design-and-result-boundary
- key: emotet-wifi
  source_identity: B011-T1016-REF-EMOTET
  source_url: https://binarydefense.com/resources/blog/emotet-evolves-with-new-wi-fi-spreader
  evidence_file: evidence/T1016/emotet-wifi.html
  exact_locator: Operation of Worm.exe; Worm Information Gathering; Worm Connection Brute-Forcing
  finding:
    zh: 原始样本分析记录 WlanEnumInterfaces 后以首个可用接口调用 WlanGetAvailableNetworkList，并处理 SSID、信号与认证属性。其 WlanRegisterNotification 回调处理后继连接尝试结果，不是已经证明的事件代替周期调查。缺无线硬件时没有传播行为被作者视为可能非预期后果，不能归成有意反沙箱。
    en: The original sample analysis records WlanEnumInterfaces followed by WlanGetAvailableNetworkList on the first available
      interface, processing SSID, signal, and authentication attributes. WlanRegisterNotification handles later connection-attempt
      outcomes rather than establishing event-driven replacement of periodic surveys. Missing spreading behavior without wireless
      hardware is described as possibly unintended, not demonstrated anti-sandboxing.
  conclusion_level: analyzed-sample-behavior-not-universal-victim-observation
- key: ipconfig-contract
  source_identity: REF-001331
  source_url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/ipconfig
  evidence_file: evidence/T1016/ipconfig.html
  exact_locator: Opening description; /all; /displaydns; /renew; /release; /registerdns
  finding:
    zh: 无参数展示地址、掩码和默认网关，/all 展示完整 TCP/IP 配置。已有来源身份原先主要定位缓存，应扩展定位而不是复制。配置展示、缓存展示和改变地址或注册状态需要按参数分流。
    en: Bare invocation displays addresses, masks, and default gateways, while /all displays full TCP/IP configuration. Extend
      the existing source's cache-focused locator rather than duplicating the manual. Separate configuration display, cache display,
      address changes, and registration through arguments.
  conclusion_level: official-capability-contract
- key: adapters-contract
  source_identity: B011-T1016-REF-ADAPTERS
  source_url: https://learn.microsoft.com/en-us/windows/win32/api/iphlpapi/nf-iphlpapi-getadaptersaddresses
  evidence_file: evidence/T1016/adapters.html
  exact_locator: Family; Flags; AdapterAddresses; SizePointer; Return value and Remarks
  finding:
    zh: 成功缓冲区包含本地适配器关联地址，Family 和 Flags 选择视图。ERROR_BUFFER_OVERFLOW 可以只是询问大小，所需大小还可在重试间变化；ERROR_NO_DATA 是请求条件下无数据。GAA_FLAG_INCLUDE_ALL_COMPARTMENTS
      当前不受支持并保留，不等于全分区读取成功。
    en: The successful buffer contains addresses associated with local adapters, selected through Family and Flags. ERROR_BUFFER_OVERFLOW
      can be a size inquiry, and required size may change between retries. ERROR_NO_DATA means no data under requested conditions.
      GAA_FLAG_INCLUDE_ALL_COMPARTMENTS is unsupported and reserved, not proof of successful all-compartment acquisition.
  conclusion_level: official-result-contract-not-incident
- key: netstat-contract
  source_identity: B011-T1016-REF-NETSTAT
  source_url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netstat
  evidence_file: evidence/T1016/netstat.html
  exact_locator: Parameters -r, -a, -o and -q
  finding:
    zh: -r 展示路由表且等价于 route print；其他参数可以返回连接、监听、绑定端口或统计。名称本身不能确定直接对象，本候选只能把路由结果归为配置。
    en: -r displays routing and equals route print. Other options can expose connections, listeners, bound ports, or statistics.
      The name alone cannot determine the direct object; this candidate attributes routing results to configuration.
  conclusion_level: official-boundary-contract
- key: route-contract
  source_identity: B011-T1016-REF-ROUTE
  source_url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/route_ws2008
  evidence_file: evidence/T1016/route.html
  exact_locator: Command values and /f; print examples
  finding:
    zh: print 读取本地路由表，而 add、change、delete 和 /f 改变状态，不能用同一个工具名把这些行为混合。路由存在只是配置，不是主动验证目的地。
    en: print reads local routing, while add, change, delete, and /f mutate state and cannot be merged by utility name. A route
      is configuration rather than an active destination check.
  conclusion_level: official-boundary-contract
- key: wlan-profile-contract
  source_identity: B011-T1016-REF-WLAN-PROFILE
  source_url: https://learn.microsoft.com/en-us/windows/win32/api/wlanapi/nf-wlanapi-wlangetprofile
  evidence_file: evidence/T1016/wlan-profile.html
  exact_locator: Return value; all-user profile read rights; plaintext-key permission and no-error encrypted fallback
  finding:
    zh: 成功返回 XML；all-user 读取需要相应访问权。明文 key 请求有单独权限，缺少该权限时仍可无错误地返回加密 keyMaterial；因此 return_code=0 不足以证明明文密码，分析不采集原始 key。
    en: Success returns XML, with appropriate authority required for all-user reads. Plaintext keys have separate permission, and
      absent permission can yield encrypted keyMaterial without error. return_code=0 therefore does not establish a plaintext password,
      and the analytic does not collect raw keys.
  conclusion_level: official-permission-and-result-contract
- key: wlan-list-contract
  source_identity: B011-T1016-REF-WLAN-NETWORKS
  source_url: https://learn.microsoft.com/en-us/windows/win32/api/wlanapi/nf-wlanapi-wlangetavailablenetworklist
  evidence_file: evidence/T1016/wlan-networks.html
  exact_locator: InterfaceGuid, Flags, returned list and errors; platform/location notice
  finding:
    zh: API 返回指定无线接口及 flags 下的网络列表，某些 flags 可包含不可见配置；无线电关闭、参数无效与不同版本权限均限制结果。列表不是关联成功或密码取得，现场部署需验证系统实际版本。
    en: The API returns a list for a wireless interface and flags, some of which include nonvisible profiles. Radio-off, invalid
      parameters, and version-dependent permissions constrain results. A list is neither successful association nor password acquisition;
      validate the deployed build.
  conclusion_level: official-result-contract
- key: wlan-notification-axis
  source_identity: planning-only-source
  source_url: https://learn.microsoft.com/en-us/windows/win32/api/wlanapi/nf-wlanapi-wlanregisternotification
  evidence_file: evidence/T1016/wlan-notifications.html
  exact_locator: Registered sources, callback and flags; version and device-capability limits
  finding:
    zh: 官方文档确认接口通知能力，只支持潜在轴的实现可能性。与 Emotet 原始行为合读仍只建立连接反馈，不满足独立配置获取子项；本次不为此单独分配正式 REF。
    en: Official documentation establishes interface notification capability, supporting only implementation possibility for a
      candidate axis. Combined with Emotet behavior it still establishes connection feedback rather than a configuration-acquisition
      child, so no separate canonical REF is requested for this planning-only source.
  conclusion_level: capability-only-deferred-axis
- key: netipconfig-contract
  source_identity: B011-T1016-REF-NETIPCONFIG
  source_url: https://learn.microsoft.com/en-us/powershell/module/nettcpip/get-netipconfiguration
  evidence_file: evidence/T1016/netipconfiguration.html
  exact_locator: Description; -All, -AllCompartments, -CompartmentId, -CimSession
  finding:
    zh: 默认只查询非虚拟已连接接口，All 扩大到虚拟、回环与断开接口；compartment 与 CimSession 参数选择视图和目标。该 cmdlet 的 AllCompartments 合同不能移植到 GetAdaptersAddresses
      的保留标志上。
    en: Defaults cover nonvirtual connected interfaces, while All includes virtual, loopback, and disconnected interfaces. Compartment
      and CimSession parameters select view and target. The cmdlet's AllCompartments contract cannot be transplanted onto the reserved
      GetAdaptersAddresses flag.
  conclusion_level: official-query-scope-contract
- key: sysmon-contract
  source_identity: REF-000230
  source_url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  evidence_file: evidence/T1016/sysmon.html
  exact_locator: Events 1, 3, 5 and 22
  finding:
    zh: Event 1 提供进程参数与 GUID，Event 5 支持终止时间，Event 3 为默认关闭的 TCP/UDP 连接，Event 22 可记录缓存或未缓存 DNS 查询。没有任意 API 返回、命令输出或完整 ICMP/ARP 报文保证，不能把网络事件缺失当作本地查询缺失。
    en: Event 1 supplies process arguments and GUIDs, Event 5 termination time, Event 3 disabled-by-default TCP/UDP connections,
      and Event 22 cached or uncached DNS queries. It guarantees neither arbitrary API returns, command output, nor complete ICMP/ARP
      packets. Missing network events do not establish missing local queries.
  conclusion_level: official-event-semantics
- key: powershell-contract
  source_identity: REF-000463
  source_url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging?view=powershell-5.1
  evidence_file: evidence/T1016/powershell-logging.html
  exact_locator: Windows PowerShell Operational Event 4104 and enabling script-block logging
  finding:
    zh: 4104 需要启用，记录处理过的脚本块内容，不是每个表达式成功执行或 cmdlet 返回记录。日志可能含敏感数据，需要受保护保留；本交接的 Windows 路径仅声明该通道，不借用 PowerShellCore 通道混为同一来源。
    en: Event 4104 needs enabling and records processed script blocks rather than successful execution of every expression or returned
      cmdlet data. Logs can contain sensitive information and need protected retention. The Windows path declares this channel
      rather than silently conflating PowerShellCore events.
  conclusion_level: official-event-semantics
- key: powershell-appcontrol-contract
  source_identity: REF-000200
  source_url: https://learn.microsoft.com/en-us/powershell/scripting/security/app-control/application-control
  evidence_file: evidence/T1016/powershell-appcontrol.html
  exact_locator: App Control policy enforcement and constrained-language behavior
  finding:
    zh: 现有来源支持受信与未受信脚本的能力控制，不意味着所有 Get-NetIPConfiguration 调用都被禁止。此处只作 MIT-000078 现有措施的应用依据，未建议改写其 measures。
    en: The existing source supports capability control for trusted and untrusted scripts rather than a ban on every Get-NetIPConfiguration
      call. It supports an application of MIT-000078's existing measures without proposing measure changes.
  conclusion_level: official-control-capability
- key: jea-contract
  source_identity: B011-T1016-REF-JEA
  source_url: https://learn.microsoft.com/en-us/powershell/scripting/security/remoting/jea/overview
  evidence_file: evidence/T1016/jea.html
  exact_locator: Command/function/external-command restrictions, delegated administration and session logging
  finding:
    zh: JEA 可限制受治理入口允许的命令、函数和外部命令，并提供会话记录；未经过该入口的代码不受其自动约束。网络接口和 CimSession 范围需要通过批准包装函数及角色配置实施并验证，不能依赖名称级白名单。
    en: JEA can limit allowed commands, functions, and external programs at governed entries and provide session records. Code
      outside those entries is not automatically constrained. Interface and CimSession limits require approved wrappers and role
      configuration with validation rather than name-only allowances.
  conclusion_level: official-control-capability-and-target-specific-design
- key: metador-resident-adapter
  source_identity: B011-T1049-REF-METADOR
  source_url: https://app-us-east-1.t-cdn.net/5e4d58fc0700dd552882e71c/posts/6331cdc54b5dcaa38fd15d1b/99345_SentinelLabs_APT-Metador-Targeting-Telecoms-ISPs-Univ_TLPCLEAR.pdf
  evidence_file: evidence/T1049/metador.pdf
  verification_route: local-primary-pdf-text-plus-independent-page-image
  exact_locator: Printed pages 6, 13-16; memory-resident Mafalda, backdoor dispatch and command 63
  finding:
    zh: 已独立阅读原始 PDF 文本并目视第 16 页。适配器查询与内存植入体命令分发及结果 packet 形成具体能力链，修正首轮仅凭 API 不足以立子的结论。共享 B011-T1049-CASE-MAFALDA，须加 T1016 父/子 subject；不补现场日期、输出字段值或本地文件。
    en: Original PDF text was read and printed page 16 independently viewed. The adapter query, in-memory implant dispatch, and
      result packet form a concrete capability chain, revising the initial API-only taxonomy result. Share B011-T1049-CASE-MAFALDA
      with T1016 parent and child subjects, without adding field dates, returned values, or local files.
  conclusion_level: specific-reverse-engineered-command-capability
- key: legacy-adapter-contract
  source_identity: B011-T1016-REF-GETADAPTERSINFO
  source_url: https://learn.microsoft.com/en-us/windows/win32/api/iphlpapi/nf-iphlpapi-getadaptersinfo
  evidence_file: evidence/T1016/getadaptersinfo.html
  exact_locator: AdapterInfo and SizePointer; returns; Remarks IPv4-only, no IPv4 loopback and unspecified ordering
  finding:
    zh: GetAdaptersInfo 返回本地 IPv4 适配器链表，不含 IPv4 loopback；大小请求或不足可只反馈大小。分析已覆盖实际样本 API 而非用 GetAdaptersAddresses 替代，不把省略 IPv6/loopback
      当成匿迹。
    en: GetAdaptersInfo returns a local IPv4 adapter list without IPv4 loopback, while size requests or insufficient buffers may
      return only size. The analytic now covers the actual sample API rather than substituting GetAdaptersAddresses, and does not
      treat omitted IPv6 or loopback as evasion.
  conclusion_level: actual-sample-api-result-contract
- key: legacy-adapter-layout
  source_identity: B011-T1016-REF-IPADAPTERINFO
  source_url: https://learn.microsoft.com/en-us/windows/win32/api/iptypes/ns-iptypes-ip_adapter_info
  evidence_file: evidence/T1016/ip-adapter-info.html
  exact_locator: AddressLength; Index; IpAddressList and GatewayList; DHCP and WINS member validity
  finding:
    zh: 链表可能含多个适配器和每项多个地址/网关，硬件地址按长度解释，Index 可在接口重新启用后变化。DHCP 和 WINS 字段仅在对应状态有效；没有把文档所有字段当成原报告已回传字段值。
    en: Lists can contain several adapters with several addresses or gateways each. Hardware addresses require length interpretation
      and Index can change after re-enablement. DHCP and WINS members have validity conditions. No documented field is presented
      as a value actually returned in the incident report.
  conclusion_level: bounded-legacy-buffer-layout
- key: custom-instrumentation-grounding
  source_identity: B011-T1049-REF-DETOURS
  source_url: https://github.com/microsoft/Detours/wiki/Using-Detours
  evidence_file: evidence/T1016/detours.html
  exact_locator: Equal signatures and calling conventions; wrapper around original function; attach transaction and thread enrollment
  finding:
    zh: 官方实现文档支持带相同签名和调用约定的入口与返回包装，但不自动实现配置缓冲区解析、调用时线程身份、长期进程关联或抗篡改。上述字段由本交接明确声明为另行验证的自定义合同，未部署或测性能。
    en: Official implementation documentation supports equal-signature and calling-convention wrappers around calls, without automatically
      implementing configuration decoding, effective thread identity, long-lived joins, or tamper resistance. These fields remain
      explicit custom contracts needing validation, without deployment or performance measurements.
  conclusion_level: instrumentation-capability-not-default-product-feed
- key: shared-network-view-control
  source_identity: B011-T1049-REF-NETNS
  source_url: https://man7.org/linux/man-pages/man7/network_namespaces.7.html
  evidence_file: evidence/T1049/network-namespaces.html
  exact_locator: DESCRIPTION network devices, IPv4/IPv6 stacks, IP routing tables, /proc/net and /sys/class/net
  finding:
    zh: 官方 Linux man-pages 支持接口、路由与网络视图的条件性隔离。与 T1049 的三项共享措施共同阅读后，T1016 仅提交自己的父/子应用，不重写原措施；Windows 旧接口子项不声称获得 Linux namespace
      的控制效果。
    en: The Linux man-pages source supports conditional isolation of interfaces, routing, and network views. After reading T1049's
      three shared measures, T1016 proposes only its own parent and child applications without rewriting those measures. The Windows
      legacy-API child does not claim Linux namespace effects.
  conclusion_level: conditional-control-applicability
