  - canonical_field: timestamp
    native_field: UtcTime
    source_type: windows-process-creation
  - canonical_field: asset_id
    native_field: Computer
    source_type: windows-process-creation
    transformation: Retain the exact enrolled-host identity or validated Computer identity consistently across the approval register;
      do not merge renamed assets without explicit identity history.
  - canonical_field: process_guid
    native_field: ProcessGuid
    source_type: windows-process-creation
  - canonical_field: process_id
    native_field: ProcessId
    source_type: windows-process-creation
  - canonical_field: image
    native_field: Image
    source_type: windows-process-creation
  - canonical_field: command_line
    native_field: CommandLine
    source_type: windows-process-creation
  - canonical_field: parent_process_guid
    native_field: ParentProcessGuid
    source_type: windows-process-creation
  - canonical_field: parent_image
    native_field: ParentImage
    source_type: windows-process-creation
  - canonical_field: account_name
    native_field: User
    source_type: windows-process-creation
  - canonical_field: logon_guid
    native_field: LogonGuid
    source_type: windows-process-creation
  - canonical_field: image_hashes
    native_field: Hashes
    source_type: windows-process-creation
    transformation: Retain algorithm-qualified entries; absence of SHA-256 is unknown when comparing hash-bound approvals.
  script_path:
  - canonical_field: timestamp
    native_field: System.TimeCreated.SystemTime
    source_type: windows-powershell-scriptblock
  - canonical_field: asset_id
    native_field: System.Computer
    source_type: windows-powershell-scriptblock
  - canonical_field: process_id
    native_field: System.Execution.ProcessID
    source_type: windows-powershell-scriptblock
  - canonical_field: scriptblock_id
    native_field: EventData.ScriptBlockId
    source_type: windows-powershell-scriptblock
  - canonical_field: message_number
    native_field: EventData.MessageNumber
    source_type: windows-powershell-scriptblock
  - canonical_field: message_total
    native_field: EventData.MessageTotal
    source_type: windows-powershell-scriptblock
  - canonical_field: scriptblock_text
    native_field: EventData.ScriptBlockText
    source_type: windows-powershell-scriptblock
  lifecycle_path:
  - canonical_field: process_start_time
    native_field: Event 1 UtcTime
    source_type: process-instance-lifetime-map
  - canonical_field: process_end_time
    native_field: Event 5 UtcTime
    source_type: process-instance-lifetime-map
    transformation: Missing termination is an open lifetime, not proof of continued execution; report ambiguity when a PID cannot
      be uniquely resolved.
  - canonical_field: mapping_status
    native_field: Organization-generated join status
    source_type: process-instance-lifetime-map
    transformation: Set resolved, missing, or ambiguous from asset, PID, start, end, and GUID; never substitute current PID ownership.
  identity_path:
  - canonical_field: principal_sid
    native_field: Organization-maintained account-to-SID history
    source_type: event-time-identity-map
    transformation: Resolve account_name on the asset and event time within valid_from/valid_to; unknown or ambiguous mappings
      remain unknown.
  custom_api_path:
  - canonical_field: request_id
    native_field: Collector-generated per-invocation identity
    source_type: custom-native-network-query-observation
    transformation: Unique across entry/return and nested calls; preserve retry-chain links without merging separate invocations.
  - canonical_field: address_family
    native_field: GetAdaptersAddresses Family
    source_type: custom-native-network-query-observation
    transformation: 'GetAdaptersAddresses preserves requested AF value; WLAN APIs use null. GetAdaptersInfo has no Family input:
      mark result family as IPv4-only from the API contract without inventing a requested family.'
  - canonical_field: request_flags
    native_field: GetAdaptersAddresses Flags; WlanGetAvailableNetworkList dwFlags; WlanGetProfile input pdwFlags
    source_type: custom-native-network-query-observation
    transformation: Preserve API-qualified input bits separately from output pdwFlags; null for GetAdaptersInfo, which has no Flags
      input.
  - canonical_field: interface_guid
    native_field: WLAN pInterfaceGuid
    source_type: custom-native-network-query-observation
    transformation: WLAN input pInterfaceGuid only; null for both adapter functions, which do not select one input interface GUID.
  - canonical_field: profile_name
    native_field: WlanGetProfile strProfileName
    source_type: custom-native-network-query-observation
    transformation: Null for other APIs; redact or tokenize consistently if needed for local privacy policy.
  - canonical_field: return_code
    native_field: Function return DWORD or ULONG
    source_type: custom-native-network-query-observation
    transformation: Preserve API and raw numeric status, distinguishing success from size inquiry, empty results, and errors.
  - canonical_field: result_count
    native_field: GetAdaptersAddresses returned linked-list entries; WLAN_AVAILABLE_NETWORK_LIST dwNumberOfItems; successful profile
      XML object count
    source_type: custom-native-network-query-observation
    transformation: Count only validated successful output; absent capture is null, not zero.
  - canonical_field: result_metadata
    native_field: Parsed nonsecret successful output fields
    source_type: custom-native-network-query-observation
    transformation: Record API-specific nonsecret decoded scope. For IP_ADAPTER_INFO preserve AdapterName, Index as observation-local,
      AddressLength, actual IpAddressList/GatewayList counts, and validity conditions. Do not merge Index across time, invent interface
      GUIDs or assume every documented member was returned by a sample.
  - canonical_field: key_material_state
    native_field: WlanGetProfile output XML sharedKey.protected and availability of keyMaterial
    source_type: custom-native-network-query-observation
    transformation: Use absent, encrypted, plaintext-observed, or unknown only after validated parsing; never store the key, and
      do not infer plaintext from return success or requested flags.
  - canonical_field: result_status
    native_field: Collector-generated interpretation of return and capture state
    source_type: custom-native-network-query-observation
    transformation: Preserve attempted, failed, empty, returned, or unknown; an entry without exit is not an empty result.
  - canonical_field: effective_principal_sid
    native_field: Collector-validated effective thread token SID at invocation
    source_type: custom-native-network-query-observation
    transformation: Declare process-token fallback separately and retain unknown when impersonation is unresolved; Sysmon User
      is not a universal thread-token substitute.
  - canonical_field: effective_logon_id
    native_field: Collector-validated effective-token authentication identifier
    source_type: custom-native-network-query-observation
    transformation: Keep asset and observation time with the local LUID; do not equate LUIDs across hosts or with Sysmon LogonGuid.
  - canonical_field: process_start_time
    native_field: Collector-validated process creation time
    source_type: custom-native-network-query-observation
    transformation: Match to the retained PID/GUID lifetime and reject later PID reuse.
  - canonical_field: collector_id
    native_field: Deployment-assigned collector identity
    source_type: native-query-collector-deployment-state
  - canonical_field: coverage_validation_status
    native_field: Organization-run per-build and per-API validation result
    source_type: native-query-collector-deployment-state
    transformation: Must be valid for the observed build, API, and time interval before claiming API coverage; unsupported paths
      remain unknown.
  - canonical_field: input_buffer_present
    native_field: GetAdaptersInfo AdapterInfo != NULL
    source_type: custom-native-network-query-observation
  - canonical_field: input_buffer_size
    native_field: GetAdaptersInfo SizePointer before invocation
    source_type: custom-native-network-query-observation
  - canonical_field: returned_size_value
    native_field: GetAdaptersInfo SizePointer after return
    source_type: custom-native-network-query-observation
    transformation: Size semantics only; not bytes of successfully acquired configuration.
  - canonical_field: captured_entry_count
    native_field: Collector-counted fully decoded successful IP_ADAPTER_INFO entries
    source_type: custom-native-network-query-observation
    transformation: Only after return success and bounds validation; null if uncaptured or invalid.
  - canonical_field: capture_truncated
    native_field: Collector-generated buffer/list coverage status
    source_type: custom-native-network-query-observation
  - canonical_field: decode_status
    native_field: Collector-generated layout/bounds parsing status
    source_type: custom-native-network-query-observation
    transformation: Validate API, architecture, available bytes, list traversal and safe lifetime; unresolved decoding remains
      unknown.
  - canonical_field: result_kind
    native_field: Collector-generated API-qualified result category
    source_type: custom-native-network-query-observation
    transformation: GetAdaptersInfo uses ipv4-adapter-view, not connectivity, peer liveness or credentials; other APIs keep separate
      categories.
