content_edits:
- pointer: /research/limitations/paragraphs/2
  value:
    zh: 所提分析中的批准台账、身份历史、进程生存期和自定义 API 结果采集都是需要实际部署的数据合同。缺失字段只能降低结论层级，不能用当前资产状态、provider PID 或静态导入追填。解释器入口治理只缩小受治理路径的滥用面，不能让基础网络配置对全部已获准代码不可见。
    en: The proposed analytics' approval register, identity history, process lifetimes, and custom API results are deployment contracts. Missing fields only lower the conclusion level and cannot be backfilled from current inventory, provider PIDs, or static imports. Interpreter-entry governance reduces abuse of governed paths rather than hiding basic configuration from every authorized program.
