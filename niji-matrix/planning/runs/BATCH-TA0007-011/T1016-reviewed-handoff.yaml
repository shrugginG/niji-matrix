proposed_subtechniques:
- temporary_key: B011-T1016-NJS-RESIDENT-CONFIG
  parent_key: B011-T1016-PARENT
  lineage:
    attck_subtechnique_inherited: false
  name:
    zh: 驻留内联网络配置调查
    en: Resident Inline Network-Configuration Survey
  summary:
    zh: 在既有受控任务载体内直接读取网络配置并处理结果，减少每次调查对新诊断命令进程的依赖。
    en: Read network configuration and handle its result inside an existing controlled task carrier, reducing dependence on
      a new diagnostic command process for each survey.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 驻留内联网络配置调查把接口与接入配置的读取实现放在既有受控进程或植入体的任务处理内部，直接调用配置接口并将结果交给同一载体处理，而不为本次调查另外启动网络诊断程序。稳定变量是配置取得与任务承载的关系，不是调用了哪个 API，也不是所取数据仅含某一种地址。
      en: Resident Inline Network-Configuration Survey implements interface and access-configuration reads inside an existing
        controlled process or implant task handler, invokes configuration interfaces directly, and gives the result to the
        same carrier rather than launching another network diagnostic program for the inquiry. The stable variable is the
        relationship between configuration acquisition and task carriage rather than a particular API or one address type.
    - zh: Metador 报告中的 Mafalda 命令 63 为该实现提供正面能力证据：已描述的内存植入体调用 GetAdaptersInfo 读取运行平台的适配器信息，再把取得的信息放入带 misc/ifconfig 时间标签的控制端
        packet。这里的标签描述传回对象，不是本地文件名；同一命令的 TCP 表和邻居映射有不同直接对象，不能用适配器一词吞并。报告确认实现能力，不提供逐次受害输出。
      en: Mafalda command 63 in the Metador report supplies positive capability evidence. The described in-memory implant
        calls GetAdaptersInfo for adapters on its execution platform and places the retrieved information in a controller-bound
        packet labeled with misc/ifconfig and time components. That label describes a transmitted object rather than a local
        filename. The same command's TCP table and neighbor mapping have different direct objects and are not absorbed into
        adapter information. The report establishes implementation capability rather than per-victim returns.
  stealth_characteristics:
    paragraphs:
    - zh: 驻留内联网络配置调查省去了本次读取与新 ipconfig、route 或 shell 进程的一一对应关系，使只围绕新诊断执行器建规则的观察失去预期入口。命令由已有载体接收，参数和配置结果留在其调用与缓冲区语义中；早期进程创建本身不会重放后续发生的接口调查。该差异来自已确认的任务内读取设计，而不是从缺少日志反推。
      en: Resident Inline Network-Configuration Survey removes a one-to-one relationship between this read and a new ipconfig,
        route, or shell process, depriving detection centered on new diagnostic executors of its expected entry. The existing
        carrier receives the task, leaving arguments and results in its calls and buffers. Earlier process creation does not
        replay a later interface inquiry. This difference follows a confirmed task-internal read design rather than inference
        from missing logs.
    - zh: 这种优势针对依赖命令进程的观察模型，不消除适配器 API、调用线程、宿主内存或结果传递的痕迹。一个普通程序也可执行相同 getter，因而单个 API 命中既不证明恶意，也不证明此子项；仍需具体任务、长期载体与实际取得的配置语义。传感器若预先覆盖原生调用及返回，本项相对新工具规则的优势会缩小。
      en: The advantage concerns observation dependent on command processes and does not remove adapter APIs, calling threads,
        host memory, or result transfer. Ordinary software can use the same getter, so an API hit alone establishes neither
        malice nor this child. Concrete tasks, the existing carrier, and actually acquired configuration semantics still matter.
        Predeployed observation of native calls and returns reduces the advantage over new-utility rules.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有直接实现证据表明网络配置读取及结果处理由已有受控任务载体完成的调查，普通命令执行保留在父级。静态导入、仅加载 iphlpapi.dll、进程运行时间较长或没有新工具事件都不足以单独成立。现有正面锚点是 GetAdaptersInfo
        的本地 IPv4 适配器视图；它不返回 IPv4 loopback，也不等同于支持 IPv6 的 GetAdaptersAddresses，不能由该样本推广为全接口、全路由或无线秘密读取。
      en: Include surveys with direct implementation evidence that an existing controlled task carrier performs configuration
        reads and result handling. Ordinary command execution stays at the parent. Static imports, loading iphlpapi.dll, a
        long-running process, or absent new-utility events are individually insufficient. The present positive anchor is GetAdaptersInfo's
        local IPv4 adapter view. It omits IPv4 loopback and differs from IPv6-capable GetAdaptersAddresses, so the sample
        does not establish every interface, every route, or wireless-secret acquisition.
    - zh: 该承载变量可以出现在其他发现行为，但直接结果必须分开：当前 socket 关系归系统网络连接发现，邻居记录中的远端候选归 NJT-0242，进程实例归 NJT-0240，配置被用于执行门控还需要额外结果。合法 VPN、连接管理、支持代理和应用初始化也常以内联调用取得配置；只有可核验的受控任务设计才属于此项，不能把这些正常活动本身当作匿迹。
      en: This carrier variable can recur in other discovery behavior, but direct results remain separate. Current socket
        relationships belong to System Network Connections Discovery, remote candidates in neighbor records to NJT-0242, process
        instances to NJT-0240, and execution gating needs an additional outcome. VPNs, connection managers, support agents,
        and application initialization also obtain configuration through inline calls. This child requires a verifiable controlled
        task design rather than classifying normal activity itself as evasion.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在已有植入体能够接收远程命令时，操作者可把网络配置调查作为一次内部任务执行，在准备选择通信路径或后续目标前取得当前适配器视图。新诊断程序可能受独立监测、但植入体已能直接调用所需接口的环境中，这种任务承载减少额外执行器痕迹。Mafalda
          命令 63 支持这一能力场景，不证明每次现场都曾采用或取得完整返回。
        en: When an existing implant accepts remote commands, an operator can run a configuration survey as an internal task
          to obtain the current adapter view before choosing communication paths or later targets. Where new diagnostics receive
          separate monitoring while the implant already reaches the required interfaces, task-internal carriage reduces extra
          executor traces. Mafalda command 63 supports this capability scenario without establishing its use or complete returns
          in every incident.
      - zh: 合法代理执行相同调查是必要对照，不能因它驻留而默认允许或阻断。调查者实际来源、资产职责、查询发生时点和返回对象须一起审查；既有载体若只通过 shell 启动 ipconfig，则仍是父行为而不符合本项直接承载边界。
        en: Legitimate agents performing the same survey are necessary controls and should not be allowed or blocked solely
          because they are resident. Review actual origin, asset duty, inquiry time, and returned object together. An existing
          carrier merely launching ipconfig through a shell remains parent behavior and does not meet this child's direct-carriage
          boundary.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须已控制可长期接收或执行任务的进程、植入体或扩展，并能在该上下文中调用配置接口和消费缓冲区。该前提高于仅能提交一个诊断命令，不自动意味着管理员权限、代码注入或可修改内核。当前证据展示的是内存植入体自带命令处理能力，不能假定任意被盗账户都具备相同承载。
          en: The attacker must control a process, implant, or extension that can receive or execute tasks over time and invoke
            configuration interfaces and consume buffers in that context. This exceeds the ability merely to submit a diagnostic
            command and does not inherently imply administration, injection, or kernel modification. Present evidence concerns
            an in-memory implant's own command handler rather than equivalent carriage for every stolen account.
        - zh: 可见配置仍受宿主权限、接口状态和 API 合同约束。GetAdaptersInfo 的成功链表只提供限定 IPv4 适配器事实，缓冲区不足需要重试；AddressLength 控制硬件地址长度，Index 还可能在接口变化后改变。取得这些字段不等于对端存在、MAC
            所属主体可信、外网可达或无线密码可用，攻击者必须另行验证后续前提。
          en: Visible configuration remains constrained by host authority, interface state, and API contracts. A successful
            GetAdaptersInfo list supplies bounded IPv4 adapter facts, with retries needed for insufficient buffers. AddressLength
            governs hardware-address length, and Index can change with interface state. These fields do not establish peer
            existence, trusted MAC ownership, Internet access, or available wireless passwords. Follow-on prerequisites require
            separate verification.
      defender_model:
        paragraphs:
        - zh: 防守方若只保存进程创建，可看到载体较早的启动而无法还原后来发生的配置调用。预先部署的 GetAdaptersInfo 入口与返回观测可暴露请求、大小重试、成功链表和真实调用进程，配合长期 PID/GUID 生存期及线程有效主体才能避免把提供方或复用
            PID 当作操作者。此类观测是验证过的自定义部署，不是 Sysmon 的默认 API 结果流。
          en: Process-creation-only observation can show an earlier carrier launch without reconstructing later configuration
            calls. Predeployed GetAdaptersInfo entry-and-return observation can expose requests, size retries, successful
            lists, and the real caller. Long-lived PID/GUID histories and effective thread identities prevent confusing a
            provider or reused PID with the operator. Such observation is a validated custom deployment rather than a default
            Sysmon API-result feed.
        - zh: 原生读取和结果 packet 回传可分处不同传感器，packet 名称不保证本地写盘，网络加密也会限制内容检查。本项检测因此不依赖寻找名为 ifconfig 的文件，而以实际调用、有限结果和载体职责核验为主。采集晚于任务、hook
            未覆盖旧接口或宿主已被信任来源攻陷时，结果与来源仍可能未知。
          en: Native reads and result-packet transfer can appear in different sensors. Packet labels do not guarantee disk
            writes, and network encryption limits inspection. Detection therefore does not depend on an ifconfig-named file;
            it verifies actual calls, bounded returns, and carrier duties. Collection beginning after the task, hooks missing
            the legacy API, or compromise of a trusted source can leave result and origin unknown.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 将网络配置读取放入既有任务载体，省去每次新诊断执行器的观察点
      en: Place configuration reads inside an existing task carrier and remove per-query diagnostic-executor observation points
    analysis:
      paragraphs:
      - zh: Mafalda 的内存载体、交互分发和命令 63 的 GetAdaptersInfo 及结果 packet 共同说明配置取得并非只有一个未使用导入，而是一个能在植入体内部完成并返回信息的具体任务。与为此启动网络诊断进程相比，该设计不需要新的诊断执行器及其参数事件，使依赖这些入口的规则缺少触发对象；读取仍发生在宿主的接口调用与返回语义中。该因果链为能力层面的行为透明提供中等置信支持，没有声称该
          API 查询专属的现场检测率或每次成功匿迹。
        en: Mafalda's memory-resident carrier, interactive dispatch, and command 63's GetAdaptersInfo and result packet establish
          a concrete implant-internal task that obtains and returns configuration rather than an unused import. Compared with
          launching a network diagnostic for the inquiry, the design needs no new diagnostic executor or argument event, leaving
          entry-dependent rules without their trigger. Reads remain in host API and return semantics. This supports medium-confidence
          capability-level Behavioral Transparency without a query-specific field detection rate or successful evasion on
          every execution.
