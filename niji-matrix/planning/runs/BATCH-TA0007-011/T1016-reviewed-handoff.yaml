    description_zh: 联合公告 AA24-038A 的附录 A 观测命令表在印刷页 34 明确列出 ipconfig 并解释其网络配置用途。本案例只确认该诊断实现被攻击者使用，不补充参数、受害主机返回值、精确时间线或成功规避检测。相邻列出的
      netstat -ano、拼写错误命令和其他操作属于各自直接对象，不混入本例的中心事实。
    description_en: Appendix A's observed-command table in joint advisory AA24-038A explicitly lists ipconfig on printed page
      34 and describes its configuration purpose. This case establishes adversarial use of that diagnostic implementation
      without supplying arguments, per-victim returns, an exact timeline, or successful detection evasion. Adjacent netstat
      -ano, mistyped commands, and other operations keep their own direct objects rather than becoming this case's central
      facts.
