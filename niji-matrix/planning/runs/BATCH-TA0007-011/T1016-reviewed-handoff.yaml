  detection_analytics:
  - temporary_key: B011-T1016-NJA-COMMAND-SEMANTICS
    strategy_key: B011-T1016-DET-CONFIG-CONTEXT
    name:
      zh: 网络诊断命令语义与批准任务关联
      en: Network-Diagnostic Command Semantics and Approved-Work Correlation
    summary:
      zh: 按参数识别接口和路由调查并与真实执行上下文核对，输出请求级调查线索。
      en: Identify interface and routing surveys through arguments and verify actual execution context, yielding request-level
        investigation leads.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在预先启用且验证的 Sysmon Event 1 中解析 Image 与 CommandLine，将 ipconfig 无参数和 /all、netstat -r、route print 标记为配置或路由调查。不得仅匹配二进制名称：ipconfig
          /displaydns 转交远端主机知识复用语境，/renew、/release、/flushdns、/registerdns 及 route add/change/delete 分别作为不同操作；netstat -ano
          的连接事实归连接发现。对启用的 Windows PowerShell 4104，按 ScriptBlockId 与 MessageNumber/MessageTotal 还原内容，识别实际 Get-NetIPConfiguration
          表达式并保留 InterfaceIndex、All、CompartmentId、AllCompartments 和 CimSession 参数；残片或仅字符串常量不确认调用。
        en: Parse Image and CommandLine from pre-enabled and validated Sysmon Event 1, tagging bare ipconfig and /all, netstat
          -r, and route print as configuration or routing surveys. Do not match only the binary name. Transfer ipconfig /displaydns
          to the remote-host-knowledge context; keep /renew, /release, /flushdns, /registerdns, and route add/change/delete
          as different operations. Connection facts from netstat -ano belong to connection discovery. Reassemble enabled Windows
          PowerShell 4104 content by ScriptBlockId and MessageNumber/MessageTotal, identify actual Get-NetIPConfiguration
          expressions, and preserve InterfaceIndex, All, CompartmentId, AllCompartments, and CimSession arguments. Fragments
          or string constants alone do not establish invocation.
      - zh: 以 asset_id 和 process_guid 连接进程实例与父级，将进程 User 或事件用户映射为事件时间有效的 principal_sid；PowerShell 的执行 PID 必须通过进程生存期映射到 GUID。再与批准台账中的主体、主机、查询种类、范围、模块或命令身份、入口及有效期核对。窗口内出现不符合职责的配置调查组合，或单次调查的实际入口和批准范围不符时，生成含偏差理由的待调查事件；身份或审批状态缺失时记录未知而非自动恶意。Event
          1 与 4104 不含返回配置，此路径始终输出请求级结论，不消费未声明的网络或输出证据。
        en: Join process instances and ancestry through asset_id and process_guid, map process User or event user to a principal_sid
          valid at event time, and map PowerShell execution PIDs to GUIDs through process lifetimes. Compare the approved
          register's principal, asset, query kind, scope, module or command identity, entry, and validity. Produce an investigable
          event with deviation reasons for a survey combination inconsistent with duties or a single query whose entry and
          scope differ from approval. Missing identity or approval remains unknown rather than automatically malicious. Event
          1 and 4104 do not include returned configuration; this path stays at request level and consumes no undeclared network
          or output evidence.
