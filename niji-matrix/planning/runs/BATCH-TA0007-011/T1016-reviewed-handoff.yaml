  mitigations:
  - existing_ref: MIT-000078
    resolution: extend
    measures_unchanged: true
    proposed_application:
      target_key: B011-T1016-PARENT
      use:
        paragraphs:
        - zh: 对通过 PowerShell 提供的网络配置支持入口，使用现有解释器入口治理、应用控制与 JEA 将允许命令绑定批准的 Get-NetIPConfiguration 包装函数、脚本或模块、主体、目标主机及期限。按任务限制接口、compartment
            与 CimSession 范围，避免给仅需本地诊断的支持身份开放任意远程命令和任意代码能力。保存实际参数与脚本内容，并在需要确认暴露字段时另行验证结果采集。
          en: For network-configuration support exposed through PowerShell, apply existing interpreter-entry governance, application
            control, and JEA to bind permitted commands to approved Get-NetIPConfiguration wrappers, scripts or modules, principals,
            target hosts, and validity. Restrict interface, compartment, and CimSession scope by task instead of giving local-diagnostic
            support arbitrary remote commands or code capability. Preserve actual arguments and script content, separately
            validating result capture when exposed fields must be confirmed.
      expected_effect:
        paragraphs:
        - zh: 攻击者借用支持身份与正常脚本外观发起任意接口画像或跨主机调查的机会减少，偏离批准入口与参数的请求更容易核验。该应用控制的是可治理的解释器执行面与调查问责，不把受限语言当成所有网络查询的禁止开关；启用日志改善请求证据，只有独立结果采集才改善具体返回证据。
          en: The opportunity to borrow support identities and ordinary script appearance for arbitrary interface profiling
            or cross-host surveys decreases, while requests outside approved entries and parameters become easier to verify.
            This application controls governable interpreter execution and inquiry accountability rather than treating constrained
            language as a universal network-query ban. Logging improves request evidence; only independent result capture
            improves evidence of particular returns.
      limitations:
        paragraphs:
        - zh: 普通本地应用、ipconfig 和原生 getter 仍可能读取基础配置，JEA 不能约束未通过该入口执行的进程。已控制的批准模块或代理也可能产生一致元数据；配置读取、DNS 成功和端到端可达性仍须分开。过窄的接口与远程会话允许项会影响排障，应先验证兼容性、保留有期限的支持例外，并保护可能含网络详情的日志。
          en: Ordinary local applications, ipconfig, and native getters may still read basic configuration, and JEA does not
            constrain processes outside its entry. Compromised approved modules or agents can produce consistent metadata.
            Configuration reads, DNS success, and end-to-end reachability remain separate. Narrow interface and remote-session
            allowances can impair troubleshooting, requiring compatibility validation, expiring support exceptions, and protection
            of logs containing network details.
    evidence_keys:
    - REF-000200
    - REF-000463
    - B011-T1016-REF-JEA
    - B011-T1016-REF-NETIPCONFIG
  - existing_temporary_key: B011-T1049-MIT-STATE-READ
    resolution: extend
    measures_unchanged: true
    proposed_applications:
    - target_key: B011-T1016-PARENT
      use:
        paragraphs:
        - zh: 为网络配置调查登记合法诊断执行体及其接口、路由和接入读取职责，重点核对代理加载和远程命令入口。原生观测按实际 getter 验证，GetAdaptersInfo 与 GetAdaptersAddresses 分开解释，大小重试、地址族与非秘密无线配置返回分别留存；它们不能用来证明完整网络暴露或连接成功。
          en: Register legitimate diagnostic carriers and duties for interface, routing, and access reads, emphasizing agent
            loading and remote-command entries. Validate native observation per getter, interpret GetAdaptersInfo and GetAdaptersAddresses
            separately, and preserve size retries, address families, and nonsecret wireless returns. These do not establish
            complete network exposure or successful connectivity.
        - zh: 在业务允许且支持网络命名空间的 Linux 工作负载上，验证接口与路由仅属于其分配视图，避免无需求共享宿主网络或授予跨命名空间进入权。该范围措施不阻止本命名空间内读取，也不能直接套到 Windows 适配器 API。
          en: For Linux workloads supporting network namespaces where duties permit, verify that interfaces and routes belong
            only to the assigned view and avoid unnecessary host-network sharing or cross-namespace entry authority. Scoping
            does not prevent reads within the namespace and does not directly apply to Windows adapter APIs.
      expected_effect:
        paragraphs:
        - zh: 未批准代码获得稳定网络调查承载的机会减少，合法外观的读取也能与主体和任务核对。防守方可在没有新命令的情况下保留配置取得的有限证据，降低只凭工具签名和进程名作判断的依赖。
          en: Unapproved code has fewer opportunities for stable survey carriage, while ordinary-looking reads become comparable
            with principals and tasks. Defenders retain bounded evidence of configuration acquisition without a new command,
            reducing dependence on utility signatures and names.
      limitations:
        paragraphs:
        - zh: 基础配置仍可能对普通应用可见，已控制的批准载体与绕过观测的路径仍有机会读取。自定义接口采集有兼容性、性能和隐私成本，不能以覆盖少量 API 宣称阻止所有平台或全部 getter。
          en: Basic configuration can remain visible to ordinary applications, and compromised approved carriers or unobserved
            paths may still read it. Custom API capture has compatibility, performance, and privacy costs; a small API set
            does not block every platform or getter.
    - target_key: B011-T1016-NJS-RESIDENT-CONFIG
      use:
        paragraphs:
        - zh: 对驻留内联网络配置调查，审查已获准驻留进程中的网络调查任务入口和可加载扩展，在预部署读取层覆盖实际 GetAdaptersInfo，并保留查询发生时该进程的原始实例与有效主体。先核验成功返回后再按 IP_ADAPTER_INFO
            解释适配器字段，避免用缺少 ipconfig 进程或 packet 标签触发文件规则作为放行和检测依据。
          en: For Resident Inline Network-Configuration Survey, review task entries and loadable extensions in approved resident
            processes, predeploy read-layer coverage of the actual GetAdaptersInfo entry, and retain the original process
            instance and effective principal at query time. Confirm successful returns before interpreting IP_ADAPTER_INFO
            fields. Neither absent ipconfig processes nor file rules based on packet labels provide reliable allow or detect
            conditions.
      expected_effect:
        paragraphs:
        - zh: 调查与每任务新执行器的对应关系消失后，读取仍可连接到真正长期载体和有限 IPv4 结果。攻击者不能只依靠复用既有进程就让配置调查完全脱离问责；未经批准的承载入口也可被收缩或撤销。
          en: When the per-task-executor relationship disappears, reads remain attributable to the real long-lived carrier
            and bounded IPv4 results. Reusing a process alone no longer removes survey accountability, and unapproved carriage
            entries can be reduced or revoked.
      limitations:
        paragraphs:
        - zh: 这些措施不能保证阻止已运行植入体读取其本来可见的适配器视图，应用控制也不自动检查任意内存指令。hook 绕过、旧 API 漏收、线程身份缺失和晚部署仍可留下盲区；是否识别该子项还需要正面任务承载证据，而不是仅见一次
            getter。
          en: These measures do not guarantee preventing an existing implant from reading its visible adapter view, and application
            control does not inspect arbitrary memory instructions automatically. Hook bypass, missed legacy APIs, missing
            thread identity, and late deployment remain gaps. Identifying this child requires positive task-carrier evidence
            rather than one getter alone.
