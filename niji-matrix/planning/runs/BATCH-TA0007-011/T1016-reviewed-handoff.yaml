  research:
    limitations:
      paragraphs:
      - zh: 子项成立性来自原始逆向的明确命令能力、内存载体与回传链，未获得该命令每次在野执行的返回数据或新进程检测与接口检测的对照实验。报告把同一命令的其他表概括为网络调查，不授权将它们全部解释为适配器信息。GetAdaptersInfo
          的 IPv4 与非 loopback 限制也意味着该实现不能证明完整现代网络配置。
        en: Existence follows an explicit reverse-engineered command capability, in-memory carrier, and result-transfer chain.
          Per-execution field returns and comparative experiments between new-process and API detection are unavailable. The
          report's network-survey grouping does not turn other tables from the same command into adapter information. GetAdaptersInfo's
          IPv4 and nonloopback limits also prevent this implementation from establishing complete modern network configuration.
      - zh: 其他原生 getter、平台或驻留框架只有同时证明配置取得与承载关系时才能归入，不以 API 名称或工具说明直接扩展。检测所需原生观测、批准代理和长期身份必须实际部署，缺少结果、线程身份或有效进程生存期时只输出有限调查线索。此项不会消除全部残余痕迹，也不把合法驻留网络管理误认为恶意。
        en: Other native getters, platforms, or resident frameworks qualify only with joint evidence of configuration acquisition
          and carrier relationship rather than expansion by API name or tool description. Native observations, approved-agent
          context, and long-lived identities require real deployment. Missing results, thread identity, or valid lifetimes
          yields only bounded leads. The child removes neither every residual trace nor the need to distinguish legitimate
          resident network management.
defense_candidates:
  detection_strategies:
  - temporary_key: B011-T1016-DET-CONFIG-CONTEXT
    name:
      zh: 网络配置读取与诊断上下文核验
      en: Network-Configuration Read and Diagnostic-Context Verification
    summary:
      zh: 识别偏离批准用途的接口、路由与无线配置调查，并区分读取意图与成功结果。
      en: Identify interface, routing, and wireless-configuration surveys departing from approved use while distinguishing
        read intent from successful results.
    description:
      paragraphs:
      - zh: 本策略把显式诊断命令和程序内网络配置读取分为两条分析路径。命令路径按参数恢复配置调查意图，并排除路由修改、地址续租和当前 socket 清单；原生路径依靠预部署且验证的入口与返回观测，覆盖实际有证据的 GetAdaptersInfo
          以及另外声明的配置 getter，核验调用者及有限返回。子项由原生读取路径直接覆盖，命令路径只覆盖父级；仅见 getter 的事件仍作为调查线索，不自动确认为驻留匿迹。
        en: This strategy separates explicit diagnostic commands from in-process configuration reads. The command path reconstructs
          intent through arguments while separating routing changes, address renewal, and current socket inventories. The
          native path uses predeployed and validated entry-and-return capture for the evidenced GetAdaptersInfo and other
          declared getters, verifying caller and bounded returns. The native path directly covers the child while the command
          path covers the parent. A getter event alone remains an inquiry lead rather than automatic confirmation of resident
          evasion.
      - zh: 该策略具体覆盖已声明的 Windows 查询入口。互联网连通性测试、所有设备 CLI、Linux 命名空间读取及无线链路报文不因此获得同等覆盖；DNS 成功也不是最终通信成功。策略输出应保留意图、失败、空结果、部分结果和有效返回的层级，防止调查将诊断命令升级为完整网络画像或凭据泄露。
        en: Coverage is specific to the declared Windows query entries. Internet connectivity tests, all appliance CLIs, Linux
          namespace reads, and wireless frames do not receive equivalent coverage, nor does DNS success establish final communication.
          Preserve the levels of intent, failure, empty results, partial results, and valid returns so investigations do not
          upgrade a diagnostic invocation into a complete network profile or credential disclosure.
