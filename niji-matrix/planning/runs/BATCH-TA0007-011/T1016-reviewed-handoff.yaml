      en: No detection-rate difference for diagnostic appearance or successful evasion by a particular query was measured.
    - zh: 采集器合同可以按参数与返回语义实施，但本批未部署 API 跟踪、验证性能或测量误报。
      en: The collector contract is implementable against parameter and return semantics, but this delivery did not deploy
        API tracing or measure performance or false positives.
    - zh: 定义覆盖固定平台，当前具体检测仅覆盖明确声明的 Windows 实现，不能外推其他系统具有相同日志与权限。
      en: The definition spans fixed platforms, while concrete detection currently covers declared Windows implementations
        rather than implying equivalent logging or authorization elsewhere.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已读实际 NJT-0001 及防御对象，父与新子项分别回答信息对象、承载变量、残余痕迹、正常反例和攻防观察前提。Metador 新证据引发候选级重写，不复制相邻连接或进程发现正文；原生分析新增实际 GetAdaptersInfo
        及其专有布局限制。共享 MIT 仅补配置特定应用，主体措施由主审跨候选收敛。
      en: The actual NJT-0001 and defense objects were read. Parent and new child independently cover information object,
        carrier variable, residual traces, normal counterexamples, and observation prerequisites. New Metador evidence triggered
        candidate-level revision rather than copying neighboring connection or process prose. The native analytic adds the
        actual GetAdaptersInfo and its layout limits. Shared MIT receives only configuration-specific applications, with measure
        identity converged by the primary.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - Primary-source downloads and SHA-256 manifests
    - YAML serialization and recursive bilingual-key checks
    - Fixed-baseline inventory read
  limitations:
    paragraphs:
    - zh: 原始报告确认配置调查或样本能力，却未给出逐主机网络配置输出、查询顺序、成功率或专属规避实验。LunarWeb 的恢复命令包不能补出每项命令都成功返回，Emotet 的无线硬件依赖也不能推定为有意反沙箱。特征伪装为多源事实支持的推断，置信度保持中等。
      en: Original reports establish configuration surveys or sample capability without per-host configuration output, query
        order, success rates, or dedicated evasion experiments. LunarWeb's recovered package does not establish successful
        returns from every command, and Emotet's dependency on wireless hardware does not imply deliberate anti-sandboxing.
        Feature Disguise remains a medium-confidence inference supported by several source facts.
    - zh: 配置和测试结果受观察时点、权限、接口状态、NAT、代理、命名空间与远程会话位置限制。不同适配器 API 具有不同地址族和返回范围，DNS 成功也可能来自缓存而非外部通信，配置返回不能单独认定明文 secret。唯一正式子项建议来自命令能力而非逐受害返回，其他采集轴和跨平台完整观测仍待补证据。
      en: Configuration and test results depend on time, authority, interface state, NAT, proxies, namespaces, and remote-session
        location. Adapter APIs have distinct family and return scope. DNS success can come from cache rather than external
        communication, and configuration returns do not establish plaintext secrets. The sole proposed child follows command
        capability rather than per-victim returns; other acquisition axes and complete cross-platform observation need further
        evidence.
    - zh: 所提分析中的批准台账、身份历史、进程生存期和自定义 API 结果采集都是需要实际部署的数据合同。缺失字段只能降低结论层级，不能用当前资产状态、provider PID 或静态导入追填。解释器入口治理只缩小受治理路径的滥用面，不能让基础网络配置对全部已获准代码不可见。
      en: The proposed analytics' approval register, identity history, process lifetimes, and custom API results are deployment
        contracts. Missing fields only lower the conclusion level and cannot be backfilled from current inventory, provider
        PIDs, or static imports. Interpreter-entry governance reduces abuse of governed paths rather than hiding basic configuration
        from every authorized program.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    rationale:
      zh: 未找到候选特定的有意时序或真实来源分散设计，重试与不同查询对象本身不满足此机理。
      en: No candidate-specific deliberate timing or real-source distribution design was established. Retries and different
        query objects do not satisfy this mechanism.
  - mechanism_ref: NM-DO
    rationale:
      zh: 无线 keyMaterial 的系统默认加密是返回权限与数据语义，不是该配置发现行为有意遮蔽恶意内容的证据。
      en: Default encryption of wireless keyMaterial concerns return authority and data semantics rather than deliberate obscuration
        of malicious content by configuration discovery.
  open_questions:
  - zh: 能否取得 Mafalda 命令 63 在具体主机和时刻的成功返回及相对执行痕迹，以区分实现能力、实际采用与实测匿迹效果？
    en: Can successful Mafalda command-63 returns and comparative execution traces at particular hosts and times separate
      capability, actual adoption, and measured stealth effect?
  - zh: 是否有把配置变化通知实际用作调查输入、并以事件替代轮询的证据，而非仅消费连接尝试结果？
    en: Is there evidence of configuration-change notifications used as survey inputs that replace polling rather than merely
      reporting connection-attempt outcomes?
