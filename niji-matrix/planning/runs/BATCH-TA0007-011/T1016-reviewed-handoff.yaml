    observables:
    - zh: 指定地址族或 flags 的适配器读取，以及指定无线接口或 profile 的配置请求。
      en: Adapter reads with explicit address family or flags and configuration requests for particular wireless interfaces
        or profiles.
    - zh: 可核验的成功返回、大小重试、空结果、失败或未知解析状态。
      en: Verifiable successful returns, size retries, empty results, failures, or unknown parse states.
    - zh: 调用时有效主体、真实进程实例或返回视图与批准任务的偏差。
      en: Differences between effective caller, real process instance, or returned view and approved work.
    - zh: GetAdaptersInfo 成功缓冲区中的有限 IPv4 适配器结果，及其大小反馈、截断或未知解析状态。
      en: Bounded IPv4 adapter results in a successful GetAdaptersInfo buffer, with size feedback, truncation, or unknown
        decode states.
    correlation:
      window:
        zh: 在单次调用及其重试链内关联入口与返回，以 10 分钟窗口组合相关配置请求，并保留调用进程的完整生存期和采集器覆盖区间；超时值必须按实际实现验证。
        en: Join entries and returns within each call and retry chain, combine related configuration requests over 10 minutes,
          and retain complete caller lifetimes and collector-coverage intervals. Validate timeouts against the actual implementation.
      dimensions:
      - asset_id
      - request_id
      - process_guid
      - thread_id
      - effective_principal_sid
      - effective_logon_id
      - api_name
      - address_family
      - request_flags
      - interface_guid
      - result_kind
      - timestamp
    false_positives:
    - zh: 网络管理代理、VPN 客户端、应用启动、自适应连接与合法无线诊断。
      en: Network-management agents, VPN clients, application initialization, adaptive connectivity, and legitimate wireless
        diagnostics.
    - zh: 地址变化或接口热插拔导致的正常缓冲区重试和重复读取。
      en: Ordinary buffer retries and repeated reads caused by address changes or interface hotplug.
    blind_spots:
    - zh: 未部署或未经验证的采集不能提供此覆盖，直接系统调用、其他 getter、设备 CLI 与其他操作系统不在本合同内。
      en: Absent or unvalidated deployment provides no such coverage. Direct syscalls, other getters, appliance CLIs, and
        other operating systems are outside this contract.
    - zh: 已控制的采集器或受信客户端、线程冒用身份缺失、PID 生存期丢失和返回缓冲区竞态会削弱归属或结果解析。
      en: Compromised collectors or trusted clients, missing impersonation identity, lost PID lifetimes, and return-buffer
        races weaken attribution or parsing.
    tuning_guidance:
      paragraphs:
      - zh: 先用批准网络工具验证成功、失败、空集、大小重试、IPv4/IPv6、断开接口和受限无线权限各分支，记录哪些字段实际可采。以实际产品版本、进程身份、API 集、接口范围和任务期限建立例外；不把合法模块加载或 API 名称作为调查完成证据。高频连接管理应按职责单列，但仍保留异常返回范围和有效线程主体的偏差，避免固定频率阈值掩盖单次调查。
        en: Validate success, failure, empty sets, size retries, IPv4/IPv6, disconnected interfaces, and restricted wireless
          permissions with approved tools, documenting fields actually captured. Bind exceptions to product version, process
          identity, API set, interface scope, and work validity. Module loading or an API name is not evidence of completed
          investigation. Baseline high-frequency connection management by duty while preserving deviations in returned scope
          and effective thread identity, rather than hiding one-off surveys behind fixed-frequency thresholds.
      - zh: 额外用 GetAdaptersInfo 验证多地址、多网关、不同 AddressLength、接口重新启用后的 Index 变化与链表截断分支。对每种 API 分别声明 address_family、request_flags
          和 interface_guid 的适用性，不为旧接口伪造不存在的输入参数。API 调用来源可明确为进程但未知内部任务，须保留这种归属层级。
        en: Additionally validate multiple addresses and gateways, different AddressLength values, Index changes after interface
          re-enablement, and truncated lists for GetAdaptersInfo. Declare address_family, request_flags, and interface_guid
          applicability per API rather than inventing inputs for the legacy call. Attribution can identify a process while
          leaving its internal task unknown; preserve that distinction.
