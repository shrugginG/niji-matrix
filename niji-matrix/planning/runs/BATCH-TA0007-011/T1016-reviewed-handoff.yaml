candidate:
  source_type: attack
  source_attack_id: T1016
  source_attack_version: '19.1'
  fixed_baseline_artifact: fixed-baseline-T1016.json
  name:
    zh: 系统网络配置发现
    en: System Network Configuration Discovery
recommendation:
  decision: retain
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 保留 T1016 的直接信息对象，即已访问系统的接口、IP 与 MAC 配置、路由、接入条件、连接能力及无线网络配置。AA24-038A 的观测命令表明确包含 ipconfig，ESET 恢复的 LunarWeb 命令包包含网络配置侦察，Binary
        Defense 的原始样本分析记录了对无线接口和可用网络的枚举。上述行为支持环境测绘父级；Microsoft 对 Volt Typhoon 的调查另提供有意借用就地取材外观维持隐蔽的动机证据，支持中等置信度的特征伪装解释。
      en: Retain T1016's direct information object of interfaces, IP and MAC configuration, routes, access conditions, connectivity,
        and wireless configuration on accessed systems. The observed-command table in AA24-038A explicitly includes ipconfig,
        ESET's recovered LunarWeb command package includes network-configuration reconnaissance, and Binary Defense's original
        sample analysis records wireless-interface and available-network enumeration. These behaviors support the Discovery
        parent. Microsoft's Volt Typhoon investigation separately supplies evidence of an intent to maintain stealth through
        living-off-the-land appearance, supporting a medium-confidence Feature Disguise interpretation.
    - zh: Metador 原始报告另把明确 GetAdaptersInfo 查询、既有内存植入体命令分发和结果 packet 回传连接起来，为驻留内联网络配置调查提供独立的能力层证据。该新证据使承载轴达到正式子项建议门槛；仍不把实现能力当成每次现场成功取数。
      en: The original Metador report additionally connects a specific GetAdaptersInfo query, existing in-memory implant command
        dispatch, and return of a result packet, providing independent capability-level evidence for Resident Inline Network-Configuration
        Survey. This evidence meets the proposal gate for the carrier axis without treating implementation capability as successful
        acquisition on every field execution.
  scope_notes:
    paragraphs:
    - zh: 网络配置事实不等于已发现远端主机、远端服务、当前连接或无线密码，连通性检查仅支持所测对象、协议与时刻。固定 ATT&CK 子项只作覆盖参考；唯一建议子项按有正面实现证据的任务承载变量划分。Metador 同一命令的适配器、TCP
        与邻居表结果按直接对象分流，共用能力案例而不重复虚构现场事件。
      en: Configuration facts do not establish remote hosts, remote services, current connections, or wireless passwords,
        and connectivity checks support only the tested object, protocol, and time. Fixed ATT&CK children are coverage references
        only. The sole proposed child follows a task-carriage variable with positive implementation evidence. Adapter, TCP,
        and neighbor results from the same Metador command are separated by direct object while sharing one capability case
        rather than fabricated field events.
  evidence_keys:
  - B011-T1016-REF-BASELINE
  - REF-000025
  - REF-000073
  - REF-000639
  - B011-T1016-REF-EMOTET
  - B011-T1049-REF-METADOR
proposed_content:
  summary:
    zh: 在已访问环境取得接口、地址、路由、接入与连通性事实，借用正常网络诊断和配置读取外观增加恶意环境画像的辨识难度。
    en: Obtain interface, address, routing, access, and connectivity facts in an accessed environment, making malicious environmental
      profiling harder to distinguish through ordinary network-diagnostic and configuration-read appearance.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 系统网络配置发现是攻击者在已取得的端点、虚拟化主机或网络设备访问内，读取接口及其地址、掩码、网关、DNS 与路由配置，获取无线接入配置，或测试特定连接能力，以理解该系统接入网络的方式和后续通信条件。直接结果是当前观察位置可得到的配置或测试事实，可用于选择通信路径、识别本地接入限制以及准备后继发现与移动。
      en: System Network Configuration Discovery reads interfaces and their addresses, masks, gateways, DNS and routing configuration,
        obtains wireless access configuration, or tests particular connectivity through already obtained endpoint, hypervisor,
        or network-device access. It establishes how that system attaches to networks and the conditions for later communication.
        The direct result is a configuration or test fact available from the observation point, supporting path selection,
        identification of local access constraints, and preparation for later discovery and movement.
    - zh: 配置记录、接口状态和实际通信结果属于不同证据层级。一个默认路由不证明目的服务可达，一个 DNS 解析结果不证明任意互联网通信成功，读取无线配置也不证明已关联到该网络。系统工具、管理会话和程序内接口都能承载读取，分类取决于所取事实和行为目的，而不是命令、字段或平台名称。
      en: Configuration records, interface state, and actual communication outcomes occupy different evidentiary levels. A
        default route does not establish destination-service reachability, a DNS result does not establish arbitrary Internet
        communication, and reading wireless configuration does not establish association with that network. Utilities, management
        sessions, and in-process interfaces can all carry reads; classification follows acquired facts and behavioral purpose
        rather than command, field, or platform names.
  stealth_characteristics:
    paragraphs:
    - zh: 系统网络配置发现复用管理员和应用日常执行的接口调查、路由诊断与接入检查。攻击者使用 ipconfig 或正常管理查询时，工具身份和读取语义可以与支持工单、VPN 排障或资产盘点一致，使防守方难以仅凭单次诊断事件判断画像的恶意用途。已记录的恶意采用及来源报告的就地取材意图支持这种外观重叠，但普通只读查询本身不自动构成匿迹。
      en: System Network Configuration Discovery reuses interface surveys, route diagnostics, and access checks routinely
        performed by administrators and applications. An adversary using ipconfig or ordinary management queries can present
        the same tool identity and read semantics as support work, VPN troubleshooting, or inventory, making hostile profiling
        difficult to determine from a single diagnostic event. Recorded adversarial use and reported living-off-the-land intent
        support this overlap, without making every read-only query evasive.
    - zh: 本地配置读取可以不发起逐远端主机或逐服务的主动探测，但仍留下命令、脚本、接口调用和可能的返回数据痕迹；这一观察差不能单凭缺少网络流量推定。DNS、HTTP、ICMP 或无线连接检查会引入各自的交互痕迹，其结果也可能受缓存、代理、NAT、网络命名空间和策略影响。保留实际查询者、观察位置与结果层级，可以缩小正常外观带来的判断困难。
      en: Reading local configuration can avoid initiating per-host or per-service probes, while leaving command, script,
        API, and potentially result traces. Missing network traffic alone does not establish that observation difference.
        DNS, HTTP, ICMP, or wireless connectivity checks introduce their own interactions, and outcomes can depend on caches,
        proxies, NAT, network namespaces, and policy. Preserving the real querier, observation point, and result level reduces
        ambiguity caused by ordinary appearance.
    - zh: 在已确认的驻留命令实现中，配置读取和结果处理还可以由同一既有载体完成，不需要每次启动新的网络诊断执行器。Mafalda 命令 63 将适配器 getter 与内存植入体内部任务直接相连，支持这种观察边界变化；普通 API 存在或没有看到新进程仍不足以证明它。原生调用、有限结果和宿主内存提供残余可见性。
      en: In a confirmed resident command implementation, the same existing carrier can perform configuration reads and result
        handling without launching a network diagnostic executor for each task. Mafalda command 63 directly connects the adapter
        getter to an in-memory implant task, supporting this observation-boundary change. API availability or absence of a
        new process alone remains insufficient. Native calls, bounded returns, and host memory retain visibility.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入以理解已访问系统的网络接入与通信条件为直接目的的配置读取和限定连通性检查。GetAdaptersAddresses 的地址族与 flags 决定所请求视图，缓冲区大小查询、ERROR_BUFFER_OVERFLOW 与
        ERROR_NO_DATA 不能当作成功返回清单，其保留的 all-compartments 标志也不保证读取所有路由分区。Get-NetIPConfiguration 默认仅返回非虚拟且已连接接口，其他选项及 CimSession
        会改变范围；这些差异是结果解释条件，不是独立匿迹分类。
      en: Include configuration reads and bounded connectivity checks whose immediate purpose is to understand network attachment
        and communication conditions of an accessed system. Address family and flags select the GetAdaptersAddresses view.
        Size queries, ERROR_BUFFER_OVERFLOW, and ERROR_NO_DATA are not successful inventories, and its reserved all-compartments
        flag does not guarantee every routing compartment. Get-NetIPConfiguration defaults to nonvirtual connected interfaces,
        while options and CimSession change scope. These differences constrain results rather than independently defining
        evasion categories.
    - zh: 远端主机候选由 NJT-0242 处理，当前 socket 与端点关系由系统网络连接发现处理，远端服务探测归 NJT-0234，报文抓取归 NJT-0236。应按实际参数和结果区分同名工具的行为：netstat -r 是路由表读取，不能归成当前连接清单；ipconfig
        /renew、路由修改及无线关联改变系统状态，不能仅作为只读发现认定。一次工具运行包含可区分的不同直接结果时可以分别记录，不能因介质或命令名重复计数。
      en: 'Remote-host candidates belong to NJT-0242, current socket and endpoint relationships to System Network Connections
        Discovery, remote-service probes to NJT-0234, and packet capture to NJT-0236. Interpret a shared utility through actual
        parameters and results: netstat -r reads routing rather than current connections, while ipconfig /renew, route modification,
        and wireless association change state and cannot be treated solely as read-only discovery. Distinguishable direct
        results from one run can be recorded separately without counting the same fact again by carrier or command name.'
    - zh: 无线接口、网络名称和认证配置可以属于本技术；请求或实际取得明文密码需要另按凭据访问判断。WlanGetProfile 成功返回的 keyMaterial 默认可以仍为加密内容，缺少明文权限甚至不返回错误，因此成功状态或 key=clear
        参数均不能单独证明得到密码。合法网络初始化、健康监测、故障排查和经过批准的支持任务可产生相同行为，权限拒绝、接口关闭、环境兼容与过期配置也不能反向证明有意匿迹。
      en: Wireless interfaces, network names, and authentication configuration can belong here; requesting or acquiring plaintext
        passwords additionally requires credential-access analysis. A successful WlanGetProfile can still return encrypted
        keyMaterial by default, and missing plaintext permission may not produce an error. Neither success nor a key=clear
        argument alone establishes password acquisition. Network initialization, health monitoring, troubleshooting, and approved
        support can produce the same behavior. Denied access, disabled interfaces, compatibility conditions, and stale configuration
        do not establish deliberate evasion.
    - zh: 驻留内联实现的现有证据使用 GetAdaptersInfo，必须遵守其本地 IPv4、排除 IPv4 loopback 与返回链表合同。IP_ADAPTER_INFO 的地址和网关可有多项，硬件地址按 AddressLength
        解释，Index 不是持久身份；成功读取不保证链表完整采集。不能以 GetAdaptersAddresses 的地址族、flags 或 IPv6 能力补造此实现的行为。
      en: The evidenced resident implementation uses GetAdaptersInfo and follows its local-IPv4, IPv4-loopback-exclusion,
        and returned-list contract. IP_ADAPTER_INFO can contain multiple addresses and gateways, its hardware address requires
        AddressLength, and Index is not persistent identity. Successful reads do not guarantee complete captured lists. GetAdaptersAddresses
        family, flags, or IPv6 capability cannot supply unreported behavior for this implementation.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在初始访问后或进入新管理会话时，攻击者可先调查接口和路由，理解地址范围、默认出口、VPN 与虚拟接口，再决定将何种后继通信发送到何处。LunarWeb 恢复的侦察命令包和 Volt Typhoon 的 ipconfig
          观察为这类用途提供实际行为锚点，但没有公开每台受害主机的完整输出、顺序与读取成功率。
        en: After initial access or entry into a new management session, an adversary can inspect interfaces and routing to
          understand address ranges, default egress, VPNs, and virtual interfaces before deciding where to send later communication.
          LunarWeb's recovered reconnaissance package and the observed Volt Typhoon ipconfig command anchor such behavior
          without publishing complete per-victim output, ordering, or acquisition success rates.
      - zh: 驻留样本也可能在连接控制端之前做有限检查，或在具备无线接口的端点调查可用接入网络。SUNBURST 对 api.solarwinds.com 的解析只表明其采用了一个连通性输入；Emotet 的无线模块先取得接口及可用网络属性，再进行连接尝试。后继命令控制、密码猜测和传播须依据各自行为另行判断，不能由前置配置调查直接推定。
        en: A resident sample may perform a bounded check before contacting its controller or survey available wireless access
          from a Wi-Fi-equipped endpoint. SUNBURST's resolution of api.solarwinds.com establishes a connectivity input, while
          Emotet's wireless module acquires interface and available-network attributes before connection attempts. Later command
          and control, password guessing, and propagation require their own behavioral evidence rather than following automatically
          from the preceding configuration survey.
      - zh: 在已有植入体支持交互任务时，操作者可直接请求内部配置调查并收回有限适配器结果，而不通过新诊断命令。Metador 报告为这种能力提供具体命令锚点，但不公开逐受害返回内容；报告的 misc/ifconfig 标签是传输 packet
          身份，不是可假定存在的本地结果文件。
        en: When an existing implant supports interactive tasks, an operator can request an internal configuration survey
          and receive bounded adapter results without a new diagnostic command. Metador supplies a specific command anchor
          for this capability but no per-victim returns. Its misc/ifconfig label identifies a transmitted packet rather than
          an assumed local result file.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要可执行诊断或调用查询接口的本地进程、会话或设备管理身份，并能读取返回或输出。基础接口与地址信息通常是正常应用依赖的能力，不默认要求管理员；远程 CimSession、网络设备命令、受限无线配置和其他主体视图仍受认证、服务状态、授权与平台版本限制。能打开句柄或调用入口不代表已取得其全部数据。
          en: The adversary needs a local process, session, or device-management identity able to run diagnostics or invoke
            queries and consume their output. Basic interface and address information is a capability needed by normal applications
            and does not inherently require administration. Remote CimSession, appliance commands, restricted wireless profiles,
            and other-principal views remain constrained by authentication, service state, authorization, and platform version.
            Reaching an entry or opening a handle does not establish acquisition of all its data.
        - zh: 攻击者可以选择查询对象、接口和测试目的地，却不能假定当前视图覆盖全部物理网络或未来路径。容器与命名空间可能只暴露其自身配置；代理与 NAT 改变出口观察；远程管理客户端、本机执行器和实际被查询主机也可能不同。配置变化、地址更新与缓冲区重试会使不同轮次结果不一致，后继行动需要接受这些时效与反馈限制。
          en: The adversary may choose query objects, interfaces, and test destinations without assuming that one view covers
            every physical network or future path. Containers and namespaces can expose their own configuration, proxies and
            NAT alter egress observation, and a management client, local executor, and queried host may differ. Configuration
            changes, address updates, and buffer retries can make successive results inconsistent, imposing freshness and
            feedback limits on follow-on action.
        - zh: 驻留内联变体另要求控制能执行实际 getter 和处理结果的既有任务载体。内存植入体具备该能力不意味着所有远程会话都具备，亦不自动证明代码注入、管理员权限或网络策略修改。读取可见适配器配置和获得有效跨网通信能力仍是不同前提。
          en: The resident variant additionally requires an existing task carrier able to execute the actual getter and process
            results. An in-memory implant having this capability does not give it to every remote session or establish injection,
            administration, or network-policy modification. Reading visible adapter configuration and obtaining effective
            cross-network communication remain separate prerequisites.
      defender_model:
        paragraphs:
        - zh: 防守方可以保有含命令行的进程创建记录、启用后的脚本块日志、管理会话与受控接口查询观测，并维护批准诊断任务、身份和资产职责。Sysmon Event 1 说明创建和参数而不包含输出，PowerShell 4104 说明处理过的脚本而不包含返回配置；WMI
            5858 也不是完整成功查询审计。进程名称、签名或当前资产库不能补出攻击时刻的配置结果。
          en: The defender may retain process creation with command lines, enabled script-block logs, management sessions,
            and controlled interface-query observations, together with approved diagnostic work, identities, and asset roles.
            Sysmon Event 1 records creation and arguments rather than output. PowerShell 4104 records processed scripts rather
            than returned configuration, and WMI 5858 is not comprehensive successful-query auditing. Process names, signatures,
            or current inventory cannot reconstruct the configuration returned at attack time.
        - zh: 对程序内查询，只有另行部署并验证的采集器才能保证看到具体 API、请求参数、返回码与结果元数据。此类部署要声明可覆盖的系统版本、接口、线程身份、进程生存期、丢失状态和隐私约束；PID 复用或缺少调用时有效主体时，归属必须保持未知。Sysmon
            Event 3 默认关闭且描述 TCP/UDP 连接，不能作为 ICMP、ARP 或无线链路报文的完整记录；即使缺少对应流量，也不能推出系统未执行本地调查。
          en: Only separately deployed and validated collection can guarantee visibility into particular in-process APIs,
            request parameters, return codes, and result metadata. Such deployment must declare covered builds and interfaces,
            thread identity, process lifetimes, loss state, and privacy controls. PID reuse or missing effective caller identity
            requires unknown attribution. Sysmon Event 3 is disabled by default and describes TCP/UDP connections rather than
            a complete ICMP, ARP, or wireless-frame record. Missing corresponding traffic does not establish absence of local
            investigation.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 将网络配置读取放入既有任务载体，省去每次新诊断执行器的观察点
      en: Place configuration reads inside an existing task carrier and remove per-query diagnostic-executor observation points
    analysis:
      paragraphs:
      - zh: 已确认的 Mafalda 内存植入体通过内部命令 63 调用 GetAdaptersInfo 并组织适配器结果 packet，把配置调查与一个新诊断进程的出现拆开。相对于依赖 ipconfig 或 shell 创建事件的观察，任务内实现省去其预期执行器与参数入口，使防守方必须在真实载体的读取层恢复语义。该能力链支持中等置信行为透明，不证明默认日志缺失由攻击者造成，也不证明原生读取或结果传输本身不可见。
        en: The confirmed in-memory Mafalda implant calls GetAdaptersInfo and packages adapter results through internal command
          63, separating configuration surveys from the appearance of a new diagnostic process. Relative to observation dependent
          on ipconfig or shell creation, the task-internal implementation removes expected executor and argument entries,
          requiring recovery at the real carrier read layer. This capability chain supports medium-confidence Behavioral Transparency
          without attributing missing default logs to the attacker or making native reads and result transfers invisible.
    evidence_keys:
    - B011-T1049-REF-METADOR
    - B011-T1016-REF-GETADAPTERSINFO
    - B011-T1016-REF-IPADAPTERINFO
    - REF-000230
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 借用正常网络诊断与配置读取外观掩护接入画像
      en: Borrow ordinary network-diagnostic and configuration-read appearance for access profiling
    analysis:
      paragraphs:
      - zh: 攻击者使用系统自带的 ipconfig 等诊断功能取得接口和地址事实，使可见执行器、读取语义和输出类别与网络支持工作重叠。联合公告直接记录 Volt Typhoon 的 ipconfig 使用，官方命令合同说明它的正常配置展示功能，Microsoft
          对该主体的调查则说明其有意依赖就地取材保持隐蔽。三类证据共同支持“借用正常诊断形式→局部特征接近运维→单事件难以区分恶意画像”的因果链；这不是对每次调用动机或规避成功的直接测量，故保持中等置信。
        en: An adversary uses built-in diagnostics such as ipconfig to acquire interface and address facts, making the visible
          executor, read semantics, and output category overlap with network support. The joint advisory directly records
          Volt Typhoon's ipconfig use, the command contract establishes normal configuration display, and Microsoft's investigation
          describes deliberate reliance on living off the land for stealth. Together they support the chain of borrowing diagnostic
          form, resemblance to operations in local features, and weaker discrimination of malicious profiling from one event.
          This is not direct measurement of motive or successful evasion for each invocation, so confidence remains medium.
    evidence_keys:
    - REF-000025
    - REF-000073
    - REF-001331
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    subtechnique_keys:
    - B011-T1016-NJS-RESIDENT-CONFIG
    narrative:
      paragraphs:
      - zh: 本技术建立驻留内联网络配置调查，以配置取得和结果处理是否由既有受控任务载体直接完成为稳定变量。该实现省去每次新的诊断执行器观察点，要求防守方连接原生配置读取与实际长期进程。当前证据锚定于内存植入体的适配器查询能力，普通工具运行仍归父级，不要求为它建立一个反向子项。
        en: This technique establishes Resident Inline Network-Configuration Survey using whether an existing controlled task
          carrier directly performs acquisition and result handling as the stable variable. The implementation removes a per-query
          diagnostic-executor observation point and requires linking native reads to the real long-lived process. Current
          evidence anchors an in-memory implant adapter-query capability. Ordinary utility runs remain at the parent without
          requiring an opposite child.
      - zh: 接口字段、地址族、Wi-Fi 标签、配置与连通性对象不单独定义匿迹分类。既存状态替代新探测、事件驱动获取和时序控制仍需各自的有意选择与痕迹差证据；无线连接反馈不等于以事件替代周期调查。相同载体变量可用于其他直接对象，但当前连接、远端候选和进程信息须保持独立语义及防御合同。
        en: Interface fields, address families, Wi-Fi labels, and configuration or connectivity objects do not independently
          define evasion categories. Existing-state substitution for new probes, event-driven acquisition, and timing control
          still require evidence of deliberate selection and trace differences. Wireless connection feedback is not event-driven
          replacement of surveys. The carrier variable can recur for other direct objects, but current connections, remote
          candidates, and process information retain independent semantics and defense contracts.
