research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
    - T1016.001
    - T1016.002
    represented_dimensions:
    - zh: 通过限定网络请求或检查取得连接能力输入。
      en: Obtain connectivity inputs through bounded network requests or checks.
    - zh: 调查无线接口、可用网络和已有接入配置；秘密内容另有凭据语义。
      en: Survey wireless interfaces, available networks, and stored access configuration, with separate credential semantics
        for secret content.
    breadth_trigger: ordinary
    coverage_resolutions:
    - attack_id: T1016.001
      resolution: parent-core
      rationale:
        zh: 连通性检查是父行为范围，SUNBURST 的 DNS 输入有原始逆向证据；具体探测对象或协议不是稳定匿迹变量，后继执行门控另属已有技术。
        en: Connectivity checks remain parent behavior, with original reverse-engineering evidence for SUNBURST's DNS input.
          A tested object or protocol is not a stable evasion variable, and later execution gating has existing ownership.
    - attack_id: T1016.002
      resolution: parent-core
      rationale:
        zh: Emotet 的接口与可用网络调查支持父行为，不证明独立 Wi-Fi 匿迹分类；请求或取得无线秘密的行为另需凭据访问判断。
        en: Emotet's interface and available-network survey supports parent behavior rather than a Wi-Fi evasion category.
          Requests or acquisition of wireless secrets additionally require credential-access classification.
    candidate_stealth_axes_examined:
    - key: local-state-substitution
      resolution: evidence-deferred
      rationale:
        zh: 本地接口与路由读取能力成立，但尚无选定资料直接建立有意替代新探测的选择及相对观察差；不能把 NJT-0242 主机候选缓存子项更换名词复用。
        en: Local interface and route reads are supported, but selected sources do not directly establish a deliberate choice
          replacing new probes and its relative observation difference. NJT-0242's host-candidate cache child cannot be reused
          by changing nouns.
    - key: event-driven-configuration-acquisition
      resolution: evidence-deferred
      rationale:
        zh: 官方 WlanRegisterNotification 支持通知能力，Emotet 也实际注册回调，但已分析用途是连接猜测结果反馈，缺少以通知代替周期配置读取的因果链；不复制 NJT-0238 设备通知分类。
        en: WlanRegisterNotification supports notifications, and Emotet registers callbacks, but the analyzed use is connection-guessing
          feedback. Evidence does not connect notifications to replacement of periodic configuration reads, and NJT-0238's
          device-notification taxonomy is not copied.
    - key: resident-inline-carrier
      resolution: niji-variable-candidate
      rationale:
        zh: 跨候选定点重审发现 Metador 原始报告同时给出内存载体、明确 GetAdaptersInfo、内部命令 63 及结果回传，补足原先仅凭 Lunar shell 或 Emotet getter 不能成立的承载链。不同信息对象保留独立合同，当前建议正式建立一个子项，能力证据置信度为中等。
        en: Cross-candidate review found that the original Metador report jointly supplies an in-memory carrier, specific
          GetAdaptersInfo, internal command 63, and result return, filling the carrier-chain gap left by Lunar shells or Emotet
          getters alone. Different information objects retain independent contracts. One child is now proposed at medium confidence
          from capability evidence.
      proposed_child_key: B011-T1016-NJS-RESIDENT-CONFIG
    - key: query-view-filtering
      resolution: not-stealth-distinct
      rationale:
        zh: 地址族、flags、接口和 compartment 改变请求范围，但正常兼容性与最小查询同样需要这些参数，现有证据不建立匿迹意图或独立防守差异。
        en: Family, flags, interfaces, and compartments change requested scope, but compatibility and ordinary scoped queries
          use the same parameters. Current evidence establishes neither evasion intent nor a distinct defensive difference.
    - key: timing-and-sampling
      resolution: evidence-deferred
      rationale:
        zh: 未发现候选特定的有意稀释、抖动或抽样设计；网络初始化重试、接口变化和 SUNBURST 更广泛休眠策略不能代替该证据。
        en: No candidate-specific deliberate dilution, jitter, or sampling design was established. Initialization retries,
          interface changes, and SUNBURST's broader dormancy strategy do not substitute for that evidence.
    - key: environment-conditioned-successor
      resolution: adjacent-technique
      rationale:
        zh: SUNBURST 对解析失败后的退出或重试是可区分后继控制；MAC 厂商、无线硬件存在性等分析环境判断由 NJT-0122 或 NJT-0109 的额外行为证据约束，不复制为 Discovery 子项。
        en: SUNBURST's exit or retry after resolution failure is distinguishable successor control. Analysis-environment decisions
          involving MAC vendors or Wi-Fi hardware require the additional evidence of NJT-0122 or NJT-0109 rather than copied
          Discovery children.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两个固定子项的覆盖及来源、通知、承载、过滤、时序与后继条件轴均已审查。首轮分类为零子项，后续主审提供 Metador 定点原始证据后独立复核，只有驻留承载轴补足正面实现链而收敛为一项；其余轴保持原决议，不为并行或数量降低要求。
      en: Coverage of both fixed children and source, notification, carrier, filtering, timing, and successor axes was reviewed.
        Initial research proposed zero children. After the primary supplied targeted Metador evidence, independent review
        found that only the carrier axis gained the missing positive implementation chain, converging to one child. Other
        axes retain their decisions without lowering standards for concurrency or counts.
