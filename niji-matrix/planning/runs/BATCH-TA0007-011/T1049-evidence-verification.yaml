    inspected_fact: Original JFMBackdoor command table specifies GetExtendedTcpTable and GetExtendedUdpTable for
      command 0x20 subcommand 0x0.
    disposition: Not required for the formal proposal because Metador provides stronger shared carrier and result
      semantics; do not infer actual task execution from another capability table.
  - url: https://github.com/BishopFox/sliver
    inspected_fact: Searched tool implementation leads and current handlers source, but no complete verified netstat
