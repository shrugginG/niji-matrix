    disposition: Not used as a mechanism or child source; partial source retrieval and package documentation do
      not replace the completed Metador path.
  - url: https://www.bitdefender.com/files/News/CaseStudies/study/401/Bitdefender-PR-Whitepaper-FIN8-creat5619-en-EN.pdf
    inspected_fact: Search returned Sardonic external netstat command output capability.
    disposition: Not promoted beyond a lead; external execution is already represented and does not prove the in-process
      child.
