candidate: T1049
content_edits:
- pointer: /defense_candidates/detection_analytics/1/logic/paragraphs/0
  value:
    zh: 按 audit_event_id 合并 SYSCALL 与 EXECVE 记录。timestamp 来自 msg=audit 的事件时间；pid、ppid、auid、uid、euid、exe 与 success 来自 SYSCALL，uid 是真实 UID，euid 才是有效 UID。syscall 与 arch 确定实际 ABI 的 execve 或 execveat，argv 由 EXECVE 的 argc 与 a0 至 aN 恢复。经认证的采集器元数据提供 device_id，不采信进程自行报告的主机名。识别 ss 默认 socket 显示、TCP/UDP 选择、监听显示和状态过滤，排除纯帮助、版本与仅汇总请求。保留原始 argv 与过滤表达式，不把全部状态标为 established。
    en: Merge SYSCALL and EXECVE records by audit_event_id. timestamp comes from the msg=audit event time; pid, ppid, auid, uid, euid, exe, and success come from SYSCALL. uid is the real UID and euid is the effective UID. syscall and arch identify the actual ABI's execve or execveat operation, while argv is recovered from EXECVE argc and a0 through aN. Authenticated collector metadata supplies device_id rather than accepting process-reported hostnames. Identify ss default socket displays, TCP/UDP selection, listener displays, and state filters, excluding pure help, version, and summary-only requests. Preserve original argv and filters without labeling every state established.
- pointer: /defense_candidates/detection_analytics/1/logic/paragraphs/1
  value:
    zh: 将成功启动的调查按 device_id 与 auid 在十分钟内分组，分别把 exe、argv 和 euid 与诊断台账的 executable、argument_constraint、effective_uid、device_scope 和有效期核对，auid 对照 audit_principal，uid 保留为真实身份上下文。auid 未设置、共享账户或主体映射不确定时保留未知操作者，不能以有效 UID 填写登录身份。PID 只标识本次审计事件，不跨生存期复用。输出查询尝试与批准差异，不读取 /proc 结果，也不隐式补充 socket inode、命名空间、表项或后继流。success 仅说明执行系统调用结果，不代表 ss 查询成功。
    en: Group successfully started inquiries within ten minutes by device_id and auid. Compare exe, argv, and euid separately with the diagnostic register's executable, argument_constraint, effective_uid, device_scope, and validity, compare auid with audit_principal, and retain uid as real-identity context. Unset auid, shared accounts, and unresolved principal mappings preserve unknown operators rather than filling login identity from effective UID. PID identifies this audited event and is not reused across lifetimes. Output inquiry attempts and approval differences without reading /proc results or silently adding socket inodes, namespaces, rows, or later flows. success denotes the execution syscall outcome rather than successful ss querying.
- pointer: /defense_candidates/detection_analytics/1/data_requirements/0/required_fields
  value: [device_id, timestamp, audit_event_id, pid, ppid, auid, uid, euid, exe, argv, success, syscall, arch]
