  research:
    limitations:
      paragraphs:
      - zh: 联合公告公开了具体 netstat 请求而没有逐行输出，LunarWeb 仅公开恢复命令包的连接调查类别。Mafalda 原始逆向较明确地说明进程内命令能力和结果组织，但没有给出每台受害主机上命令 63 的动态调用证据、完整缓冲区、检测率或执行器对照。本技术因此区分恶意活动、样本能力和匿迹推断，不用总体隐蔽性评价替代本查询的量化证据。
        en: The joint advisory publishes a particular netstat request without row-level output, and LunarWeb reporting identifies
          connection inquiries only as a category in a recovered command package. Original Mafalda reversing more specifically
          establishes in-process command capability and result packaging, but supplies no per-victim dynamic command-63 invocation,
          complete buffer, detection rate, or executor comparison. The technique therefore distinguishes malicious activity,
          sample capability, and stealth inference rather than substituting overall stealth assessments for query-specific
          measurements.
      - zh: 防御实现的主要可部署部分是显式命令的执行上下文关联，进程内分析依赖单独部署和验证的调用级采集合同。现有证据没有证明默认 EDR 捕获连接表返回，也没有为 macOS、ESXi、云管理面或所有设备 CLI 给出同等实案与字段覆盖。表视图、丢失与截断、动态状态和批准身份被盗都限制结论；未来需要带返回状态、载体、结果完整性与观察面配置的受控对照来提高置信度。
        en: The main directly deployable defensive component is execution-context correlation for explicit commands. In-process
          analysis depends on a separately deployed and validated call-collection contract. The evidence does not establish
          default EDR capture of returned connection tables or equivalent incident and field coverage for macOS, ESXi, cloud
          management, or every appliance CLI. Views, loss and truncation, changing state, and stolen approved identities constrain
          conclusions. Controlled comparisons retaining return status, carrier, result integrity, and observation configuration
          are needed to increase confidence.
proposed_subtechniques:
- temporary_key: B011-T1049-CHILD-INPROCESS
  name:
    zh: 进程内连接状态查询
    en: In-Process Connection-State Query
  summary:
    zh: 将本次连接状态调查放在已有执行载体的查询代码内，省去独立外部诊断工具的任务创建边界。
    en: Carry a connection-state inquiry in query code within an executing carrier, removing the task-creation boundary of
      a separate external diagnostic utility.
  aliases: []
  parent_key: B011-T1049-PARENT
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 进程内连接状态查询是攻击者把某次 socket 或通信关系调查交给已经运行的客户端或模块中的查询实现，而非为该任务启动独立的外部诊断工具。请求仍然指向操作系统或管理接口提供的连接状态，直接结果仍是网络端点与会话关系；改变的是任务承载位置以及查询与新进程事件的关系，不是获取到的信息种类。
      en: In-Process Connection-State Query places a particular socket or communication-relationship inquiry in query-implementing
        code within an already executing client or module instead of starting a separate external diagnostic utility for the
        task. The request still targets connection state exposed by operating-system or management interfaces and yields endpoint
        and session relationships. The controlled variable is task-carrier position and its relationship to new-process events
        rather than the kind of information obtained.
    - zh: Mafalda 命令 63 将 GetExtendedTcpTable 取得的 TCP 信息组织为带 misc/netstat 时间标签的传输包，为本项提供具体实现依据。该字符串是发给控制端的包名，原始说明不证明同名本地文件。仅发现
        IP Helper 导入、合法库加载或缺少 netstat 记录均不足以满足边界，必须把具体连接查询与载体中的实现路径关联。
      en: Mafalda command 63 packages TCP information obtained through GetExtendedTcpTable as a transmitted packet with a
        timestamped misc/netstat label, providing a concrete implementation. That string names a packet sent to the controller,
        not a proven local file. An IP Helper import, legitimate library load, or absence of netstat records is insufficient;
        a particular connection query must be associated with its implementation path inside the carrier.
  stealth_characteristics:
    paragraphs:
    - zh: 进程内连接状态查询把发现任务的开始与诊断工具进程的开始分离，使只匹配 netstat 创建的规则无法自然取得这次查询入口。载体可以在多种控制任务之间连续运行，连接读取与其他行为共用进程身份，因而单一进程命令行往往不能说明哪一时刻取得了连接状态。被省去的是独立工具的任务痕迹，而非载体本身的执行、内存和通信痕迹。
      en: In-Process Connection-State Query separates the start of a discovery task from the start of a diagnostic-utility
        process, depriving netstat-creation rules of their natural entry for the inquiry. A carrier may continue across different
        control tasks, sharing process identity between a connection read and other behavior, so its process command line
        often cannot identify when connection state was acquired. The removed trace is the separate utility's task boundary
        rather than execution, memory, or communication traces of the carrier itself.
    - zh: 该差异只对缺少调用语义的观察面有利。若防守方记录查询入口、返回状态与真实调用位置，进程内行为仍可被归属；已知诊断代理也会合法采用同样设计。一次成功函数返回并不自动说明攻击者取得完整表，表内 PID 更不能反推查询者，因此需要结果完整性和载体证据共同约束解释。
      en: The difference benefits the adversary only where observation lacks invocation semantics. Recording the query entry,
        return status, and actual call site can still attribute the in-process behavior, and legitimate diagnostic agents
        use the same design. A successful return does not automatically prove complete table acquisition, and PIDs inside
        the table cannot identify the reader. Result integrity and carrier evidence must jointly constrain interpretation.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有正面实现或运行证据的连接查询：任务由既有载体中实现状态读取的代码执行，没有单独外部查询工具的任务边界。控制程序仅启动 netstat、ss 或外部脚本进程并收取输出仍属于父级普通工具路径；netstat 自身内部调用
        API 也不因实现细节成为本项。Mafalda 的具体命令路径能够支持能力结论，未公开的现场调用仍保持未知。
      en: Include connection inquiries supported by positive implementation or execution evidence where code in an executing
        carrier implements state acquisition without a separate external-query-utility task boundary. A controller that merely
        launches netstat, ss, or an external script process and reads output remains on the parent's ordinary utility path.
        netstat internally calling APIs does not itself qualify. Mafalda's particular command path establishes capability,
        while unpublished field invocations remain unknown.
    - zh: 本项不由 API 名称、内存加载方式、进程年龄或无日志外观定义。适配器与路由读取、进程清单和注册表探索由各自技术承担，不因相同载体重复归类。调用者身份与 socket 所属身份分开，失败和大小查询不升级为连接结果；正常监控、终端诊断和应用自检是相似行为，须按具体查询与批准职责审查。
      en: The child is not defined by API names, memory-loading technique, process age, or an appearance of missing logs.
        Adapter and route reads, process lists, and Registry exploration retain their own techniques even in the same carrier.
        Caller identity is separate from socket ownership, and failure or size inquiries do not become connection results.
        Monitoring, endpoint diagnostics, and application self-checks are benign counterparts requiring review of the particular
        query and authorized duty.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 已部署的交互植入体在控制端请求通信画像时，可以用自身命令处理器取得状态并传回结果，省去临时诊断工具和其独立参数。该方式适用于载体可直接调用相应状态接口、且现有连接足以提供线索的主机。Mafalda 的原始研究给出命令能力和传回对象标签，但未证明所有部署都触发这项命令，也未证明操作者为了某条规则特意选择它。
        en: When a controller requests a communication profile, a deployed interactive implant can obtain state through its
          own command handler and return results without a temporary diagnostic utility and separate arguments. The approach
          fits hosts where the carrier can invoke the state interface directly and existing relationships provide useful clues.
          Original Mafalda research establishes command capability and a returned-object label without proving use in every
          deployment or deliberate selection against a particular rule.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须控制已有执行载体中的查询代码，或者能够调度其中已经实现的功能，并能读取对应接口返回。不能仅凭控制某个进程就假定拥有代码注入、管理员权限或任意模块加载能力；这些能力如被采用，应另有证据。可见范围仍受表类别、地址族、权限与系统视图限制，失败、空表和状态变化可能使查询缺乏价值。
          en: The attacker must control query code within an executing carrier or dispatch an already implemented feature
            and receive the interface result. Controlling a process does not automatically confer code injection, administrator
            authority, or arbitrary module loading; those capabilities require separate evidence if used. Table class, address
            family, permissions, and system view still constrain scope, and failures, empty tables, or changing state can
            make the inquiry uninformative.
      defender_model:
        paragraphs:
        - zh: 本项以进程创建为主要任务入口而缺少调用级记录的防守方为观察模型。此时仍能看到载体和可能的控制流量，却不能从它们单独恢复本次状态读取。更强观察需要经验证的调用采集、调用位置与进程生存期映射；一般模块加载、Event 3、静态导入和流量记录不足以替代这些证据。结果缓冲区属于额外敏感数据，应在有需要和实际采集成功时才参与分析。
          en: The observation model is a defender using process creation as the main task entry without call-level records.
            The carrier and possible control traffic remain visible but do not independently reconstruct the particular state
            read. Stronger observation needs validated call capture, call-site attribution, and process-lifetime mapping.
            General module loads, Event 3, static imports, and flow records cannot substitute. Return buffers are additional
            sensitive data and should participate only when needed and successfully captured.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 以载体内查询替代单独诊断任务使连接调查越过进程创建规则入口
      en: Replace a separate diagnostic task with a carrier-local query outside the entry of process-creation rules
    analysis:
      paragraphs:
      - zh: 攻击者将本次状态读取放入载体命令处理路径，减少了原本可从独立 netstat 启动获得的任务识别事件；规则若仅围绕该启动构建便缺少发现入口。Mafalda 的进程内命令与 TCP 结果组织提供正面依据，官方接口说明其仍是状态读取，Sysmon
          文档则限定进程事件能够提供的层次。查询调用与调用位置仍可被专门采集，所以本机理不等于读取无法观测；未见具体检测器对照或动态逐机记录，置信度为中等。
        en: The adversary puts a particular state read in the carrier's command path, removing the task-identification event
          otherwise supplied by a separate netstat launch. Rules built only around that launch lack an inquiry entry. Mafalda's
          in-process command and TCP-result packaging supply positive evidence, official interfaces establish state-read semantics,
          and Sysmon documentation bounds the observation supplied by process events. Dedicated capture can still observe
          invocation and call site, so the mechanism is not unobservable reading. Without a particular-detector comparison
          or per-host dynamic records, confidence remains medium.
    evidence_keys:
    - B011-T1049-REF-METADOR
    - B011-T1049-REF-TCPAPI
    - REF-000230
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B011-T1049-DET-INPROCESS
    mitigations:
      coverage: available
      mitigation_keys:
      - B011-T1049-MIT-STATE-READ
  evidence:
    claim_keys:
    - B011-T1049-CLM-INPROCESS
    - B011-T1049-CLM-BT
    - B011-T1049-CLM-TABLE-SEMANTICS
    - B011-T1049-CLM-OWNER
    - B011-T1049-CLM-CALL-DETECTION
    - B011-T1049-CLM-MITIGATION
    case_keys:
    - B011-T1049-CASE-MAFALDA
    reference_keys:
    - B011-T1049-REF-METADOR
    - B011-T1049-REF-TCPAPI
    - B011-T1049-REF-TCPROW
    - B011-T1049-REF-TCP6ROW
    - REF-000230
    - B011-T1049-REF-DETOURS
    - B011-T1049-REF-APPCONTROL
  research:
    limitations:
      paragraphs:
      - zh: 子项的核心证据来自原始逆向公开的命令实现，不是本研究执行过的样本，也不是受害主机逐次调用日志。报告中的内存承载说明载体条件，命令 63 的 API 与结果描述才说明本次查询路径，两者不能互相替代。传输包标签不证明本地写文件；编译时间不作为真实执行时间。
        en: The child's core evidence is the command implementation published through original reversing, not a sample executed
          in this research or per-invocation victim logs. Memory residence establishes carrier conditions, while command 63's
          API and result description establishes the query path; neither substitutes for the other. A transmission-packet
          label does not establish a local file write, and compilation timestamps are not execution dates.
      - zh: 调用仪器化是需另行验证的部署设计，目前没有默认 EDR 兼容性、采集开销和抗规避测试结果。合法代理同样可以进程内查询，被攻陷的批准载体可能匹配正常基线。后续需同时保留具体调用路径、成功与失败返回、结果完整性和独立执行器对照，才能量化其观察影响。
        en: Call instrumentation is a deployment design requiring separate validation; default EDR compatibility, collection
          overhead, and evasion resistance have not been tested. Legitimate agents also query in process, and compromised
          approved carriers may match benign baselines. Quantifying observation effects requires particular call paths, success
          and failure returns, result integrity, and comparison with an independent diagnostic executor.
defense_candidates:
  detection_strategies:
  - temporary_key: B011-T1049-DET-COMMAND
    name:
      zh: 连接状态显示请求与执行上下文关联
      en: Correlate Connection-State Display Requests with Execution Context
    summary:
      zh: 识别偏离批准诊断工作的显式连接调查请求，保留请求与结果的区别。
      en: Identify explicit connection inquiries diverging from approved diagnostics while separating requests from results.
    description:
      paragraphs:
      - zh: 策略以系统工具请求读取连接状态的行为为对象，分别利用 Windows 进程事件和 Linux 执行审计恢复参数、主体与上下文。它按参数语义排除路由、接口统计和帮助命令，并使用具体诊断作业而非工具签名判断批准情况。该策略不恢复未采集的表行，也不覆盖全部进程内接口路径。
        en: The strategy detects system-tool requests for connection state, using Windows process events and Linux execution
          audit to reconstruct arguments, principals, and context. Argument semantics exclude routes, interface statistics,
          and help, while concrete diagnostic jobs rather than utility signatures determine approval. It neither recovers
          uncaptured table rows nor covers all in-process interfaces.
    detects_keys:
    - B011-T1049-PARENT
    domains:
    - enterprise
    analytic_keys:
    - B011-T1049-NJA-WINDOWS-COMMAND
    - B011-T1049-NJA-LINUX-COMMAND
    evidence_keys:
    - REF-000025
    - B011-T1049-REF-NETSTAT
    - B011-T1049-REF-SS
    - REF-000230
    - REF-000201
    - REF-001042
    - REF-000840
  - temporary_key: B011-T1049-DET-INPROCESS
    name:
      zh: 连接表调用与实际查询载体归属
      en: Attribute Connection-Table Calls to Their Actual Query Carrier
    summary:
      zh: 在已部署并验证的调用级观测中识别既有载体发起的连接表调查。
      en: Identify connection-table inquiries by executing carriers through deployed and validated call-level observation.
    description:
      paragraphs:
      - zh: 本策略补充进程创建观察面，以具体表查询和实现查询的载体代码为对象。关联调用入口、调用位置、进程生存期和批准诊断职责，避免把表内 socket 所属 PID 当作读取者。返回状态与可选结果用于区分大小询问、失败、空表和实际返回；调用仪器化不是假定存在的默认
          EDR 数据源，缺少部署验证时此策略尚不能运行。
        en: This strategy complements process-creation observation by detecting particular table inquiries and the carrier
          code implementing them. Call entry, call site, process lifetime, and approved diagnostic duties identify the reader
          without confusing it with socket-owner PIDs in the table. Return status and optional results distinguish size inquiries,
          failure, empty tables, and actual returns. Instrumentation is not an assumed default EDR source; the strategy is
          unavailable operationally until deployment is validated.
    detects_keys:
    - B011-T1049-PARENT
    - B011-T1049-CHILD-INPROCESS
    domains:
    - enterprise
    analytic_keys:
    - B011-T1049-NJA-CALL
    evidence_keys:
    - B011-T1049-REF-METADOR
    - B011-T1049-REF-TCPAPI
    - B011-T1049-REF-TCPROW
    - B011-T1049-REF-TCP6ROW
    - B011-T1049-REF-DETOURS
    - REF-000230
  detection_analytics:
  - temporary_key: B011-T1049-NJA-WINDOWS-COMMAND
    strategy_key: B011-T1049-DET-COMMAND
    name:
      zh: Windows 连接显示参数与批准会话差异
      en: Windows Connection-Display Arguments and Approved-Session Differences
    summary:
      zh: 从 netstat 的实际参数和执行会话输出待调查连接查询尝试。
      en: Report netstat connection-query attempts requiring investigation from actual arguments and execution sessions.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在已启用且保留完整命令行的 Sysmon Event 1 中，用 device_id 映射 System/Computer，timestamp 映射 UtcTime，process_guid、parent_process_guid、image、command_line、user、logon_guid
          分别映射同名原生 ProcessGuid、ParentProcessGuid、Image、CommandLine、User、LogonGuid。解析参数而非仅按映像匹配，将默认连接显示以及 -a、-n、-o、-b、-q 和协议选择参数中的连接显示组合识别为查询请求；只显示
          -r 路由、-e 接口计数、-s 协议统计或帮助的请求排除。混合参数同时包含连接显示与统计时保留两种语义，未知或截断命令行标记未决，不猜测完整参数。
        en: On Sysmon Event 1 deployments retaining complete command lines, map device_id to System/Computer and timestamp
          to UtcTime, and map process_guid, parent_process_guid, image, command_line, user, and logon_guid to native ProcessGuid,
          ParentProcessGuid, Image, CommandLine, User, and LogonGuid. Parse arguments rather than matching the image alone.
          Identify default connection display and combinations of -a, -n, -o, -b, -q, and protocol-selection arguments that
          request connection display. Exclude requests displaying only -r routes, -e interface counters, -s protocol statistics,
          or help. Mixed arguments retain both display and statistical semantics; unknown or truncated command lines remain
          unresolved rather than reconstructed by guesswork.
      - zh: 以同一 device_id 与 logon_guid 的十分钟窗口组织请求，以 process_guid 和 parent_process_guid恢复实际父链。把 user、image、父链和时间与诊断批准台账的 principal、image、ancestor_constraint、device_scope、valid_from、valid_until、job_id
          对照，无法解析台账或主体时输出未知批准状态。未匹配作业、异常父链或同会话重复连接调查提高调查优先级，已批准的单次排障可降级。结果只标记命令级查询尝试，不从 Event 1 推断返回值、TCP 状态、对端可达性或进程内子项，也不以
          Event 3 缺席推断无网络。
        en: Group requests in a ten-minute window by device_id and logon_guid, using process_guid and parent_process_guid
          for actual ancestry. Compare user, image, ancestry, and event time with the diagnostic register's principal, image,
          ancestor_constraint, device_scope, valid_from, valid_until, and job_id; unresolved registers or principals produce
          unknown approval. Unmatched jobs, abnormal ancestry, or repeated connection inquiries in one session raise investigation
          priority, while approved isolated troubleshooting can be downgraded. Output is a command-level inquiry attempt.
          Event 1 does not establish return values, TCP states, peer reachability, or the in-process child, and absent Event
          3 is not evidence of no network.
    data_requirements:
    - source_type: sysmon-process-create
      name:
        zh: 已配置完整命令行的 Sysmon Event 1
        en: Sysmon Event 1 configured for complete command lines
      channel: Microsoft-Windows-Sysmon/Operational
      required_fields:
      - device_id
      - timestamp
      - process_guid
      - parent_process_guid
      - image
      - command_line
      - user
      - logon_guid
    - source_type: approved-diagnostic-job-register
      name:
        zh: 由运维维护的事件时诊断批准台账
        en: Event-time diagnostic approval register maintained by operations
      channel: null
      required_fields:
      - job_id
      - principal
      - image
      - ancestor_constraint
      - device_scope
      - valid_from
      - valid_until
    - source_type: collection-health-register
      name:
        zh: 采集器提供的 Sysmon 配置与完整性记录
        en: Collector-provided Sysmon configuration and integrity record
      channel: null
      required_fields:
      - device_id
      - timestamp
      - source_name
      - configuration_version
      - collection_status
      - command_line_complete
    observables:
    - zh: 经参数解析确认的连接显示请求及其进程 GUID 和会话
      en: Argument-confirmed connection-display requests with process GUID and session
    - zh: 请求主体、父链、资产和时间与批准诊断作业不一致
      en: Principal, ancestry, asset, or time inconsistent with an approved diagnostic job
    correlation:
      window:
        zh: 同一设备与登录会话内十分钟；批准有效期按事件时刻精确核对。
        en: Ten minutes within one device and logon session, with approval validity checked at event time.
      dimensions:
      - device_id
      - logon_guid
      - process_guid
      - parent_process_guid
      - user
      - job_id
    false_positives:
    - zh: 网络排障、安全响应和支持人员的交互连接检查。
      en: Interactive connection checks by troubleshooters, responders, and support personnel.
    - zh: 监控代理或诊断作业改版，尚未同步到批准台账。
      en: Monitoring or diagnostic-job revisions not yet synchronized with the approval register.
    blind_spots:
    - zh: 进程内 API、脚本内调用、缺失或截断命令行以及收集前已发生的任务没有同等覆盖。
      en: In-process APIs, internal script calls, missing or truncated command lines, and tasks predating collection lack
        equivalent coverage.
    - zh: 批准身份或载体被攻陷时可能匹配台账；事件不含查询结果。
      en: Compromised approved identities or carriers may match the register; events omit query results.
    tuning_guidance:
      paragraphs:
      - zh: 先按设备角色和批准作业维护常见父链与使用频度，用异常上下文调整优先级而非硬设次数阈值。不要全局放行 netstat 或管理员；未知批准保持调查信号，日志配置和完整性异常单独报覆盖缺口。十分钟是初始关联参数，需用环境中的合法诊断与受控查询验证，不代表已实测最佳阈值。
        en: Baseline common ancestry and frequency by device role and approved job, using anomalous context for priority rather
          than a universal count threshold. Do not globally allow netstat or administrators. Unknown approval remains a signal,
          and collection failures separately report coverage gaps. Ten minutes is an initial correlation parameter to validate
          against legitimate diagnostics and controlled inquiries, not a measured optimum.
    evidence_keys:
    - REF-000025
    - B011-T1049-REF-NETSTAT
    - REF-000230
  - temporary_key: B011-T1049-NJA-LINUX-COMMAND
    strategy_key: B011-T1049-DET-COMMAND
    name:
      zh: Linux socket 调查命令与审计主体关联
      en: Linux Socket-Inquiry Commands and Audited Principal Correlation
    summary:
      zh: 从已配置执行审计识别 ss 的 socket 查询请求并保存查询者上下文。
      en: Identify ss socket-query requests from configured execution auditing while preserving reader context.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 按 audit_event_id 合并 SYSCALL 与 EXECVE 记录。timestamp 来自 msg=audit 的事件时间；pid、ppid、auid、uid、euid、exe 与 success 来自 SYSCALL，uid
          是真实 UID，euid 才是有效 UID。syscall 与 arch 确定实际 ABI 的 execve 或 execveat，argv 由 EXECVE 的 argc 与 a0 至 aN 恢复。经认证的采集器元数据提供
          device_id，不采信进程自行报告的主机名。识别 ss 默认 socket 显示、TCP/UDP 选择、监听显示和状态过滤，排除纯帮助、版本与仅汇总请求。保留原始 argv 与过滤表达式，不把全部状态标为 established。
        en: Merge SYSCALL and EXECVE records by audit_event_id. timestamp comes from the msg=audit event time; pid, ppid,
          auid, uid, euid, exe, and success come from SYSCALL. uid is the real UID and euid is the effective UID. syscall
          and arch identify the actual ABI's execve or execveat operation, while argv is recovered from EXECVE argc and a0
          through aN. Authenticated collector metadata supplies device_id rather than accepting process-reported hostnames.
          Identify ss default socket displays, TCP/UDP selection, listener displays, and state filters, excluding pure help,
          version, and summary-only requests. Preserve original argv and filters without labeling every state established.
      - zh: 将成功启动的调查按 device_id 与 auid 在十分钟内分组，分别把 exe、argv 和 euid 与诊断台账的 executable、argument_constraint、effective_uid、device_scope
          和有效期核对，auid 对照 audit_principal，uid 保留为真实身份上下文。auid 未设置、共享账户或主体映射不确定时保留未知操作者，不能以有效 UID 填写登录身份。PID 只标识本次审计事件，不跨生存期复用。输出查询尝试与批准差异，不读取
          /proc 结果，也不隐式补充 socket inode、命名空间、表项或后继流。success 仅说明执行系统调用结果，不代表 ss 查询成功。
        en: Group successfully started inquiries within ten minutes by device_id and auid. Compare exe, argv, and euid separately
          with the diagnostic register's executable, argument_constraint, effective_uid, device_scope, and validity, compare
          auid with audit_principal, and retain uid as real-identity context. Unset auid, shared accounts, and unresolved
          principal mappings preserve unknown operators rather than filling login identity from effective UID. PID identifies
          this audited event and is not reused across lifetimes. Output inquiry attempts and approval differences without
          reading /proc results or silently adding socket inodes, namespaces, rows, or later flows. success denotes the execution
          syscall outcome rather than successful ss querying.
    data_requirements:
    - source_type: linux-audit-execution
      name:
        zh: 按序列号合并的 Linux Audit SYSCALL 与 EXECVE
        en: Linux Audit SYSCALL and EXECVE joined by event serial
      channel: auditd
      required_fields:
      - device_id
      - timestamp
      - audit_event_id
      - pid
      - ppid
      - auid
      - uid
      - euid
      - exe
      - argv
      - success
      - syscall
      - arch
    - source_type: approved-diagnostic-job-register
      name:
        zh: 由运维维护的 Linux 诊断批准记录
        en: Operations-maintained Linux diagnostic approval records
      channel: null
      required_fields:
      - job_id
      - audit_principal
      - effective_uid
      - executable
      - argument_constraint
      - device_scope
      - valid_from
      - valid_until
    - source_type: collection-health-register
      name:
        zh: 采集器与 auditctl 状态及规则证据
        en: Collector and auditctl status and rule evidence
      channel: null
      required_fields:
      - device_id
      - timestamp
      - source_name
      - collector_identity
      - configuration_version
      - collection_status
      - audit_enabled
      - audit_lost
      - audit_backlog
      - rule_scope
      - argv_complete
    observables:
    - zh: ss 的 socket 调查参数、状态选择与被审计执行主体。
      en: ss socket-inquiry arguments, state selection, and audited executor.
    - zh: 与具体批准作业不匹配的 socket 调查请求。
      en: Socket-inquiry requests not matching a concrete approved job.
    correlation:
      window:
        zh: 先按同一审计事件序列合并记录，再在同设备与 auid 内关联十分钟。
        en: First join one audit-event serial, then correlate ten minutes within the same device and auid.
      dimensions:
      - device_id
      - audit_event_id
      - auid
      - uid
      - job_id
    false_positives:
    - zh: 管理员临时诊断、服务健康检查和事件响应。
      en: Ad hoc administrator diagnostics, service-health checks, and incident response.
    blind_spots:
    - zh: 未预配置执行规则、审计丢失、参数截断和没有新执行边界的程序内查询。
      en: Missing execution rules, audit loss, truncated arguments, and in-process queries without a new execution boundary.
    - zh: 命令事件没有结果或事件时网络命名空间；不能判断返回哪些端点。
      en: Command events omit results and event-time network namespace, preventing determination of returned endpoints.
    tuning_guidance:
      paragraphs:
      - zh: 在受控环境确认对应架构的 execve 和 execveat 审计规则、argv 合并与丢失状态，按服务角色建立 ss 用法基线。对 unset auid 保留未知值并依赖独立调查，不把 root 永久放行；不将摘要查询混入
          socket 关系结果。此分析只覆盖 ss 请求，netstat、lsof、设备和 macOS 路径应各自验证后再扩展，不能套用相同参数语义。
        en: Validate architecture-specific execve and execveat rules, argv joining, and loss status in a controlled environment,
          then baseline ss use by service role. Preserve unknown unset auid for independent investigation and do not permanently
          allow root. Keep summary queries separate from socket-relationship output. This analytic covers ss requests only.
          Validate netstat, lsof, appliance, and macOS paths before extending coverage rather than copying parameter semantics.
    evidence_keys:
    - B011-T1049-REF-SS
    - REF-000201
    - REF-001042
    - REF-000840
  - temporary_key: B011-T1049-NJA-CALL
    strategy_key: B011-T1049-DET-INPROCESS
    name:
      zh: 经验证的 TCP 表调用载体与返回类别分析
      en: Validated TCP-Table Call Carrier and Return-Category Analysis
    summary:
      zh: 以明确部署合同关联实际 TCP 表查询者与调用位置，分开记录请求、返回和可选表行。
      en: Attribute actual TCP-table readers and call sites under an explicit deployment contract, separating requests, returns,
        and optional rows.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 本分析须先部署并验证专用调用仪器化；它不是默认 EDR 规则。包装 GetExtendedTcpTable 真实入口和返回，生成 call_id 和 call_start_time、call_end_time，记录实际调用进程、线程、调用位置和自带的进程创建时间。以
          api_name 记录函数名，address_family 映射 ulAf，table_class 映射 TableClass，input_buffer_present 表示 pTcpTable 是否非空，return_status
          为 DWORD 返回码；返回大小值只作大小语义，不能当作表行数。以 process_instance_id 绑定 device_id、caller_pid 与 process_create_time，通过同期调用位置和模块/内存映射识别实现查询的载体代码。不能从返回表中的
          dwOwningPid 获得查询者。
        en: Deploy and validate dedicated call instrumentation before enabling this analytic; it is not a default EDR rule.
          Wrap the real GetExtendedTcpTable entry and return, generate call_id with call_start_time and call_end_time, and
          record the actual calling process, thread, call site, and process creation time. api_name records the function;
          address_family maps ulAf; table_class maps TableClass; input_buffer_present indicates nonnull pTcpTable; and return_status
          is the DWORD return code. Returned size values retain size semantics and are not row counts. Bind device_id, caller_pid,
          and process_create_time to process_instance_id, using contemporaneous call-site and module/memory mappings to identify
          the code implementing the inquiry. dwOwningPid in returned tables does not identify the reader.
      - zh: 按 call_id 区分大小询问、错误和有缓冲区的 NO_ERROR 返回；只有布局与地址族及表类别一致且成功解码时才标记表返回。本分析仅解码 OWNER_PID 的 ALL、CONNECTIONS 和 LISTENER
          类别，其他类别保留调用元数据与未支持解码状态，不套用 PID 行布局。有权限启用可选结果采集时，以同一 call_id 保存 table_entry_count、captured_entry_count、capture_truncated
          和 rows；IPv4 行映射 dwLocalAddr、dwLocalPort、dwRemoteAddr、dwRemotePort、dwState、dwOwningPid，IPv6 行另外映射 ucLocalAddr、ucRemoteAddr
          与 dwLocalScopeId、dwRemoteScopeId。将端口和 IPv6 scope 按文档的网络字节序规范化，保留原始值，LISTEN 的远端字段标记无语义；空表与未捕获不同，截断时不能声称完整表。ESTABLISHED
          只表示该返回时刻的 TCP 状态，不证明数据交付或之后可达。
        en: Separate size inquiries, errors, and buffered NO_ERROR returns by call_id. Mark a table return only after successful
          decoding with a layout matching address family and table class. This analytic decodes only OWNER_PID ALL, CONNECTIONS,
          and LISTENER classes; other classes retain call metadata and unsupported-decode status rather than receiving PID-row
          layouts. Where authorized optional result capture is enabled, retain table_entry_count, captured_entry_count, capture_truncated,
          and rows under the same call_id. IPv4 rows map dwLocalAddr, dwLocalPort, dwRemoteAddr, dwRemotePort, dwState, and
          dwOwningPid. IPv6 rows additionally map ucLocalAddr, ucRemoteAddr, dwLocalScopeId, and dwRemoteScopeId. Normalize
          ports and IPv6 scopes according to documented network byte order while preserving raw values, and mark LISTEN remote
          fields semantically invalid. Empty and uncaptured tables differ, and truncation prevents a completeness claim. ESTABLISHED
          denotes TCP state at return time rather than application delivery or later reachability.
      - zh: 将查询代码的 image、caller_module、caller_memory_type 和职责与批准诊断台账比对，标记未批准载体代码、异常内存来源或偏离批准任务的查询。只有正面调用位置说明查询由既有载体内实现、而非独立诊断工具承担时，才给出子项候选；缺少
          netstat 日志不参与证明。输出附带证据类别、返回分类、采集状态与未知批准，单次正常 API 不自动定性。结果行不是告警必要条件，缺少结果时仅报告已观测调用，不反推其他端点。
        en: Compare image, caller_module, caller_memory_type, and duty of the querying code with the diagnostic register,
          flagging unapproved carrier code, unusual memory provenance, or inquiries outside approved work. Propose the child
          only when positive call-site evidence places the query implementation within an executing carrier rather than a
          separate diagnostic utility. Missing netstat logs are not proof. Outputs retain evidence type, return category,
          capture status, and unknown approval; one ordinary API call is not inherently malicious. Rows are not required for
          an alert, and absent results produce an observed-call report without inferred endpoints.
    data_requirements:
    - source_type: custom-validated-tcp-table-instrumentation
      name:
        zh: 须验证部署的 GetExtendedTcpTable 调用入口与返回采集
        en: GetExtendedTcpTable entry and return capture requiring validated deployment
      channel: null
      required_fields:
      - device_id
      - timestamp
      - call_id
      - call_start_time
      - call_end_time
      - api_name
      - caller_pid
      - caller_tid
      - process_create_time
      - process_instance_id
      - image
      - callsite_address
      - caller_module
      - caller_memory_type
      - address_family
      - table_class
      - input_buffer_present
      - return_status
      - returned_size_value
      - decode_status
    - source_type: optional-custom-tcp-table-result-capture
      name:
        zh: 经授权启用时的可选结果缓冲区采集
        en: Optional result-buffer capture when authorized and enabled
      channel: null
      required_fields:
      - device_id
      - timestamp
      - call_id
      - address_family
      - table_class
      - table_entry_count
      - captured_entry_count
      - capture_truncated
      - rows
      - local_address
      - local_port
      - remote_address
      - remote_port
      - tcp_state
      - socket_owner_pid
      - local_scope_id
      - remote_scope_id
      - raw_field_values
    - source_type: instrumented-process-lifetime-and-mapping
      name:
        zh: 仪器化同步采集的进程生存期和地址映射
        en: Process lifetimes and address mappings captured with instrumentation
      channel: null
      required_fields:
      - device_id
      - timestamp
      - process_instance_id
      - caller_pid
      - process_create_time
      - process_end_time
      - image
      - mapping_start
      - mapping_end
      - module_path
      - memory_type
      - mapping_valid_from
      - mapping_valid_until
    - source_type: approved-diagnostic-job-register
      name:
        zh: 由运维维护的查询载体与代码职责批准台账
        en: Operations-maintained approval register for query carriers and code duties
      channel: null
      required_fields:
      - job_id
      - image
      - caller_module
      - caller_memory_type
      - api_name
      - device_scope
      - valid_from
      - valid_until
    - source_type: custom-instrumentation-health
      name:
        zh: 专用采集器配置和覆盖完整性
        en: Dedicated collector configuration and coverage integrity
      channel: null
      required_fields:
      - device_id
      - timestamp
      - collector_version
      - sensor_configuration
      - hooked_api
      - coverage_status
      - capture_enabled
      - dropped_events
      - result_capture_enabled
      - capture_limit
    observables:
    - zh: 由具体调用位置和进程生存期归属的 TCP 表查询。
      en: TCP-table inquiries attributed through a concrete call site and process lifetime.
    - zh: 大小询问、错误、空表、非空返回与截断的不同结果类别。
      en: Distinct result categories for size inquiries, errors, empty tables, nonempty returns, and truncation.
    - zh: 实现连接查询的载体代码与批准诊断职责不一致。
      en: Query-implementing carrier code inconsistent with approved diagnostic duties.
    correlation:
      window:
        zh: 同一 call_id 的入口到返回；进程与地址映射仅在各自事件时有效期内关联，诊断任务比较先采用十分钟窗口。
        en: Entry through return under one call_id; join process and address mappings only within event-time validity, with
          an initial ten-minute diagnostic-task comparison.
      dimensions:
      - device_id
      - process_instance_id
      - call_id
      - caller_module
      - address_family
      - table_class
      - job_id
    false_positives:
    - zh: 终端诊断、资产代理、防火墙和安全产品自身的连接表查询。
      en: Connection-table queries by endpoint diagnostics, inventory agents, firewalls, and security products.
    - zh: JIT、插件或产品升级改变调用位置和内存映射。
      en: JIT, plugins, or product upgrades changing call sites and memory mappings.
    blind_spots:
    - zh: 未覆盖进程、替代接口、未注入成功或传感器被篡改时没有可靠调用观测。
      en: Uncovered processes, alternate interfaces, failed instrumentation, or sensor tampering remove reliable invocation
        observation.
    - zh: 未捕获返回内容时不能确认表行；结果截断、错误布局与地址映射失效会限制语义。
      en: Uncaptured returns cannot confirm rows; truncation, wrong layouts, and stale address mappings constrain semantics.
    - zh: 此部署设计未完成性能、跨位数、受保护进程和抗规避验证，不应被描述为当前已有全量产品能力。
      en: This deployment design lacks performance, cross-bitness, protected-process, and evasion-resistance validation and
        is not an existing complete product capability.
    tuning_guidance:
      paragraphs:
      - zh: 先以受控正常调用验证 IPv4 与 IPv6、不同表类别、大小询问、失败、空表、截断与监听行，确认调用者和 socket 所属 PID 分离。仪器化应保留原函数签名、调用约定和错误行为，并按位数与进程类型评估安全加载；实际部署失败时关闭该分析并报告覆盖缺口。优先保留调用元数据，敏感结果行按最小范围、加密与权限采集，禁止因
          DLL 合法或命令行普通而全局放行。
        en: Validate IPv4 and IPv6, table classes, size inquiries, failure, empty tables, truncation, and listeners using
          controlled benign calls, verifying separation of reader and socket-owner PIDs. Instrumentation must preserve signatures,
          calling conventions, and error behavior and assess safe loading by bitness and process type. Disable the analytic
          and report a coverage gap when deployment fails. Prefer call metadata, minimize and protect sensitive result rows,
          and do not globally allow a legitimate DLL or ordinary command line.
    evidence_keys:
    - B011-T1049-REF-METADOR
    - B011-T1049-REF-TCPAPI
    - B011-T1049-REF-TCPROW
    - B011-T1049-REF-TCP6ROW
    - B011-T1049-REF-DETOURS
    - REF-000230
  mitigations:
  - temporary_key: B011-T1049-MIT-STATE-READ
    name:
      zh: 网络状态查询载体与视图治理
      en: Govern Network-State Query Carriers and Views
    summary:
      zh: 约束连接调查代码来源和可见网络视图，并保护能够识别查询者的诊断证据。
      en: Constrain connection-inquiry code provenance and visible network views while protecting diagnostic evidence identifying
        readers.
    description:
      paragraphs:
      - zh: 连接状态是正常诊断和网络软件需要的基础功能，不应把关闭所有显示工具当作完整控制。本缓解将允许执行的调查代码、具体诊断作业和工作负载可见网络视图分别治理，降低未知载体读取关系和广域横向画像的机会，并通过受保护的请求审计保留实际查询者。
        en: Connection state is basic functionality for legitimate diagnostics and networking software, so removing display
          tools is not a complete control. This mitigation separately governs executable inquiry code, concrete diagnostic
          jobs, and workload-visible network views, reducing opportunities for unknown carriers and broad lateral profiling
          while preserving actual readers through protected request auditing.
    domains:
    - enterprise
    measures:
    - key: inquiry-code-and-job-provenance
      name:
        zh: 调查代码和作业来源约束
        en: Constrain inquiry code and job provenance
      description:
        paragraphs:
        - zh: 使用平台支持的应用控制限制未批准可执行文件、模块与脚本进入诊断工作流，批准项绑定实际代码身份、资产职责和有效期。保留批准排障入口而不全局信任签名工具；对高价值主机采用审计模式验证后再收敛执行权限。
          en: Use platform-supported application control to constrain unapproved executables, modules, and scripts in diagnostic
            workflows, binding approvals to actual code identity, asset duty, and validity. Preserve approved troubleshooting
            entry points without trusting signed utilities globally and validate in audit mode before tightening execution
            on high-value hosts.
      control_type: preventive
    - key: workload-network-view
      name:
        zh: 工作负载网络状态视图隔离
        en: Isolate workload network-state views
      description:
        paragraphs:
        - zh: 在支持网络命名空间且业务允许的 Linux 环境，把不需要宿主网络全景的工作负载放入独立网络命名空间，核对实际 /proc/net 与 socket 视图，避免无业务需要的宿主网络共享和命名空间进入权限。此措施控制可见范围而非禁止本命名空间内的合法读取，部署前须验证连接、监控和支持路径。
          en: Where Linux supports network namespaces and workloads permit it, place workloads without a host-wide networking
            need in separate network namespaces, verify actual /proc/net and socket views, and avoid unnecessary host-network
            sharing and namespace-entry authority. This limits visible scope rather than prohibiting legitimate reads within
            a namespace and requires validation of connectivity, monitoring, and support paths before deployment.
      control_type: exposure-reduction
    - key: reader-evidence-protection
      name:
        zh: 查询者证据与覆盖验证
        en: Protect reader evidence and validate coverage
      description:
        paragraphs:
        - zh: 集中保留完整命令行和执行审计，将批准诊断记录绑定事件时主体、设备与作业。对需要连接表调用观测的主机先验证专用采集合同和覆盖健康，再保护查询元数据与必要结果；不得把流量日志当作查询者日志，也不得从缺事件推断没有读取。
          en: Centrally retain complete command lines and execution audit and bind diagnostic approvals to event-time principals,
            devices, and jobs. On hosts needing table-call observation, validate dedicated collection contracts and coverage
            health before protecting query metadata and necessary results. Do not treat traffic logs as reader logs or infer
            no reading from absent events.
      control_type: detective-support
    applications:
    - target_key: B011-T1049-PARENT
      use:
        paragraphs:
        - zh: 为 netstat 与 ss 等诊断入口登记具体作业和批准载体，限制未批准代码进入调查流程，并在 Linux 工作负载中按业务需要收窄可见网络命名空间。保留原始参数和审计主体，区分连接显示与路由或统计用途；不能用工具禁用替代查询权限与工作流治理。
          en: Register concrete jobs and approved carriers for diagnostic entry points such as netstat and ss, constrain unapproved
            code, and scope Linux workload network namespaces by business need. Preserve raw arguments and audited principals
            to distinguish connection displays from route or statistical uses. Utility removal cannot replace query-authority
            and workflow governance.
      expected_effect:
        paragraphs:
        - zh: 未批准调查更容易在代码与作业来源上形成差异，隔离工作负载只能取得其可见视图，查询证据也更容易连接实际主体。措施减少调查机会并增强辨识，不保证已访问系统无法读取其自身连接。
          en: Unapproved inquiries are more likely to diverge in code and job provenance, isolated workloads obtain only their
            visible view, and query evidence is more readily attributable. The measures reduce opportunities and improve discrimination
            without guaranteeing that an accessed system cannot read its own connections.
      limitations:
        paragraphs:
        - zh: 普通连接读取往往无需高权限，被盗批准身份仍可查询；网络命名空间隔离仅适用于相应 Linux 部署，宿主共享和跨命名空间权限会削弱范围控制。应用控制存在兼容性成本，进程和流量日志不含完整结果。
          en: Ordinary connection reads often need no high privilege and stolen approved identities can still query. Namespace
            isolation applies only to relevant Linux deployments, while host sharing and cross-namespace authority weaken
            scoping. Application control has compatibility costs, and process or traffic logs omit complete results.
    - target_key: B011-T1049-CHILD-INPROCESS
      use:
        paragraphs:
        - zh: 对进程内连接状态查询，重点验证载体中实际实现查询的代码来源和模块完整性，并在需要时部署经测试的调用元数据采集，使本次读取能够连接载体和批准职责。不要只禁用 netstat，也不要因为 IP Helper DLL 或宿主进程已批准就允许任意内存代码查询。
          en: For In-Process Connection-State Query, verify provenance and integrity of the code actually implementing the
            inquiry and deploy tested call-metadata collection where needed to connect the read to its carrier and approved
            duty. Do not merely disable netstat or allow arbitrary memory-resident querying because IP Helper or the host
            process is approved.
      expected_effect:
        paragraphs:
        - zh: 限制未知查询代码进入既有载体，并为省去外部工具边界的读取补充直接调用证据，提高恶意载体维持正常诊断外观的成本。
          en: Restrict unknown query code entering executing carriers and supply direct invocation evidence for reads lacking
            an external-utility boundary, increasing the cost of maintaining ordinary diagnostic appearance.
      limitations:
        paragraphs:
        - zh: 可信代理被攻陷、内存注入或传感器不覆盖时仍可能读取；专用调用采集并非默认能力，需验证性能、权限和抗篡改。此应用不宣称单独阻断 GetExtendedTcpTable 或所有内部连接查询。
          en: Compromised trusted agents, memory injection, or sensor gaps may still permit reads. Dedicated call capture
            is not default functionality and needs performance, privilege, and tamper-resistance validation. This application
            does not claim standalone blocking of GetExtendedTcpTable or every internal connection inquiry.
