    description_zh: SentinelLabs 原始研究记录了由 metaMain 承载的 Mafalda 植入体及其命令处理，并在完整报告第 16 页说明命令 63 分别调用 GetAdaptersInfo 取得适配器信息、GetExtendedTcpTable
      取得 TCP 信息、GetIpNetTable 取得 IPv4 与物理地址映射；对应结果以 misc/ifconfig、misc/netstat 和 misc/arp 加时间标签的包发给控制端。此案例统一保存同次综合命令的逆向能力事实，同时区分配置、连接与邻居映射的直接对象，不把传输标签解释为本地落盘。报告未公开逐受害机调用、完整表行或检测器对照，因此不宣称命令在所有部署中已执行，也不量化匿迹收益。
    description_en: Original SentinelLabs research describes the Mafalda implant carried by metaMain and its command processing.
      Page 16 of the full report explains command 63 calling GetAdaptersInfo for adapter information, GetExtendedTcpTable
      for TCP information, and GetIpNetTable for IPv4-to-physical-address mappings. Corresponding results are sent to the
      controller as timestamp-labeled misc/ifconfig, misc/netstat, and misc/arp packets. This case unifies reverse-engineered
      capability facts for the same composite command while distinguishing configuration, connection, and neighbor-mapping
      objects, without interpreting transmission labels as local writes. The report publishes no per-victim invocations, complete
      rows, or detector comparison, so execution in every deployment and quantified stealth benefits are not claimed.
    time_range: null
    target_sectors_zh: []
    target_sectors_en: []
    evidence_keys:
    - B011-T1049-REF-METADOR
    confidence: high
    status: review
  detection_strategies: []
  detection_analytics: []
  mitigations: []
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - current_socket_state
    - network_session_relationships
    - local_and_managed_views
    breadth_trigger: ordinary
    coverage_resolutions:
    - dimension: existing_connection_and_session_state
      resolution: parent-core
      reason:
        zh: 固定父项没有 ATT&CK 子项；对现存状态和关系的查询是直接信息对象，不把表字段与平台自动划成 Niji 子项。
        en: The fixed parent has no ATT&CK children. Existing-state and relationship queries are the direct information object,
          not automatic Niji partitions by field or platform.
    candidate_stealth_axes_examined:
    - axis: existing_state_instead_of_new_probes
      resolution: parent-core
      evidence_keys:
      - B011-T1049-REF-NETSTAT
      - B011-T1049-REF-TCPAPI
      - B011-T1049-REF-PROC-TCP
      reason:
        zh: 本候选的直接对象本来就是系统现存状态；只因本地读取便立子项会复制父核心并与 NJT-0242 既存主机知识复用混淆。主动探测是另一信息获取行为，不是需要另建的反向兄弟项。
        en: Existing system state is already the parent's direct object. A child defined merely by local reading duplicates
          the parent core and confuses NJT-0242's host-knowledge reuse; active probing is another acquisition behavior rather
          than a required opposite sibling.
    - axis: query_carrier_relative_to_external_diagnostic_task
      resolution: niji-variable-candidate
      proposed_child_key: B011-T1049-CHILD-INPROCESS
      evidence_keys:
      - B011-T1049-REF-METADOR
      - B011-T1049-REF-TCPAPI
      - REF-000230
      reason:
        zh: Mafalda 命令 63 同时给出实际连接对象、既有植入体承载和结果组织，支持独立工具任务边界被省去及调用来源防御差异。普通 API 导入和通用内存加载均不作替代证据。
        en: Mafalda command 63 supplies the actual connection object, executing implant carrier, and result packaging, supporting
          removal of an external utility task boundary and different call-provenance defenses. Generic imports and memory
          loading do not substitute for that evidence.
    - axis: auxiliary_name_resolution_control
      resolution: evidence-deferred
      evidence_keys:
      - B011-T1049-REF-NETSTAT
      - B011-T1049-REF-SS
      - REF-000025
      reason:
        zh: Windows netstat -n 明确不尝试名称解析，ss 的数值和地址解析参数也有具体语义；恶意 netstat -ano 提供采用该组合的请求事实，但未给出有意规避辅助解析、实际请求差与独立防御需要的本候选证据。不能从常用选项机械复制
          NJT-0236 名称补全抑制子项。
        en: Windows netstat -n explicitly avoids name resolution, and ss numeric and address-resolution options have specific
          semantics. Malicious netstat -ano establishes use of the combination but lacks candidate-specific evidence of deliberate
          auxiliary-resolution suppression, actual request differences, and independent defensive need. It does not mechanically
          duplicate NJT-0236's name-completion suppression child.
    - axis: state_protocol_or_row_filtering
      resolution: not-stealth-distinct
      evidence_keys:
      - B011-T1049-REF-TCPAPI
      - B011-T1049-REF-SS
      - B011-T1049-REF-TCPROW
      reason:
        zh: 地址族、协议、PID 和状态过滤改变结果范围，当前来源没有证明其被有意用于改变查询痕迹并产生独立防守观察差异。字段选择不是匿迹分类。
        en: Family, protocol, PID, and state filters change result scope, but the sources do not show deliberate control of
          query traces with a distinct defensive observation effect. Field selection is not an evasion taxonomy.
    - axis: query_cadence_and_event_driven_sampling
      resolution: evidence-deferred
      evidence_keys:
      - B011-T1049-REF-NETSTAT
      - B011-T1049-REF-SS
      - B011-T1049-REF-METADOR
      reason:
        zh: 工具可重复显示，植入体可受控调度，但能力不证明为规避观测而设计采样周期。未找到同时满足故意变量、痕迹因果和专属防御的本次证据，不从频率低或命令时刻缺失推断子项。
        en: Utilities can repeat displays and implants can schedule tasks, but capability does not establish sampling designed
          to evade observation. No evidence here satisfies deliberate control, trace causality, and dedicated defense, and
          low frequency or missing command times does not establish a child.
    - axis: remote_observation_and_cloud_topology
      resolution: adjacent-technique
      evidence_keys:
      - B011-T1049-REF-BASELINE
      reason:
        zh: 远程会话显示在直接对象为 socket 或连接关系时仍由父项覆盖，管理来源本身不是新变量；云资源图由 NJT-0139、远端候选由 NJT-0242、配置由 T1016 负责，缺少连接状态证据时不混入。
        en: Remote session displays remain in the parent when their direct object is sockets or connection relationships;
          management origin alone is not a new variable. NJT-0139 owns cloud graphs, NJT-0242 remote candidates, and T1016
          configuration, excluding them where connection-state evidence is absent.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 无 ATT&CK 子项不免除搜索。已跨获取来源、载体、解析、过滤、时序和观察位置进行两轮思考，只有带本候选正面实现与防御差异的进程内轴建议正式化；其余分别归父核心、邻接技术或证据暂缓，不能为凑数量降低门槛。
      en: Absence of ATT&CK children does not excuse searching. Two research passes considered sources, carriers, resolution,
        filtering, timing, and observation position. Only the in-process axis has candidate-specific positive implementation
        and defensive differences sufficient for a formal proposal; other axes resolve to parent core, neighbors, or deferred
        evidence rather than meeting a numerical target.
  evidence_coverage:
    parent_behavior_keys:
    - B011-T1049-REF-BASELINE
    - REF-000025
    - REF-000639
    - B011-T1049-REF-METADOR
    boundary_keys:
    - B011-T1049-REF-NETSTAT
    - B011-T1049-REF-SS
    - B011-T1049-REF-TCPAPI
    - B011-T1049-REF-TCPROW
    - B011-T1049-REF-TCP6ROW
    - B011-T1049-REF-PROC-TCP
