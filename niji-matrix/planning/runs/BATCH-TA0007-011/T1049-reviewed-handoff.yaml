    mechanism_support:
    - mechanism_ref: NM-FD
      evidence_keys:
      - REF-000025
      - B011-T1049-REF-NETSTAT
      evidence_level: malicious_request_plus_legitimate_capability_with_inferred_discrimination_effect
      confidence: medium
    - mechanism_ref: NM-BT
      evidence_keys:
      - B011-T1049-REF-METADOR
      - B011-T1049-REF-TCPAPI
      - REF-000230
      evidence_level: specific_sample_query_and_carrier_plus_observation_model_inference
      confidence: medium
    child_existence_support:
    - child_key: B011-T1049-CHILD-INPROCESS
      evidence_keys:
      - B011-T1049-REF-METADOR
      - B011-T1049-REF-TCPAPI
      evidence_level: reverse_engineered_command_capability_not_per_victim_execution
    unsupported_or_deferred:
    - Universal stealth motive or detector miss rate for netstat or API calls
    - Per-victim invocation dates or actual command-63 table rows
    - Local file creation inferred from misc/netstat transmission-packet label
    - Default EDR returning API buffers or Event 3 providing all socket states
    - Deliberate numeric-resolution suppression or low-cadence evasion taxonomy
    - Windows-level semantic and sensor equivalence for other platforms
  telemetry_contracts:
    windows_process:
      source: REF-000230
      canonical_to_native:
        device_id: System/Computer
        timestamp: EventData/UtcTime
        process_guid: EventData/ProcessGuid
        parent_process_guid: EventData/ParentProcessGuid
        image: EventData/Image
        command_line: EventData/CommandLine
        user: EventData/User
        logon_guid: EventData/LogonGuid
      output_available: false
    linux_execution:
      sources:
      - REF-000201
      - REF-001042
      - REF-000840
      canonical_to_native:
        device_id: authenticated_collector_device_identity
        timestamp: msg=audit event_time
        audit_event_id: msg=audit serial joined with device_id
        pid: SYSCALL/pid
        ppid: SYSCALL/ppid
        auid: SYSCALL/auid
        uid: SYSCALL/uid
        exe: SYSCALL/exe
        success: SYSCALL/success for execve or execveat
        syscall: SYSCALL/syscall interpreted with arch
        arch: SYSCALL/arch
        argv: EXECVE/argc and a0 through aN
      output_available: false
      namespace_available: false
      pid_cross_lifetime_join_permitted: false
    custom_tcp_table_capture:
      default_product_feed: false
      deployment_status: proposed_requires_validation
      implementation_grounding: B011-T1049-REF-DETOURS
      callback_metadata: Collector supplies call_id call_start_time call_end_time device_id wallclock timestamp actual caller
        PID TID process creation time callsite memory mapping and health under an explicit tested contract
      api_mapping:
        api_name: GetExtendedTcpTable
        address_family: ulAf
        table_class: TableClass
        input_buffer_present: pTcpTable != NULL
        return_status: DWORD function return
        returned_size_value: pdwSize after return with size semantics only
        table_entry_count: dwNumEntries only after valid successful layout decode
      optional_row_mapping:
        local_address: dwLocalAddr for IPv4 or ucLocalAddr for IPv6
        local_port: dwLocalPort normalized from network byte order with raw preserved
        remote_address: dwRemoteAddr or ucRemoteAddr; semantically invalid for LISTEN
        remote_port: dwRemotePort normalized from network byte order; semantically invalid for LISTEN
        tcp_state: dwState
        socket_owner_pid: dwOwningPid; never reader identity
        local_scope_id: dwLocalScopeId for IPv6; null for IPv4
        remote_scope_id: dwRemoteScopeId for IPv6; null for IPv4
      derived_metadata: captured_entry_count capture_truncated decode_status caller_memory_type mapping_validity collection_health
        require collector implementation and controlled validation
      process_lifetime_source: Dedicated collector captures Windows process creation time at query time and process end or
        unknown; no current PID-only backfill
      module_mapping_source: Dedicated collector captures contemporaneous image memory ranges and backing provenance; unresolved
        maps stay unknown
      approval_source: Operations-owned explicit image module memory-type API asset-scope and validity records; not inferred
        from signed binaries
      optional_results: Absent when disabled or failed; null and empty distinguish unknown from successfully decoded zero
        rows; no network-namespace assumption in the Windows analytic
      prerequisites_to_enable: Validate preserved calling convention signatures return codes layouts architecture coverage
        collection health safe instrumentation load and privacy controls
  shared_identity_review:
    catalog_checked: dist/catalogs/library-catalog.json
    canonical_searches:
    - Lunar
    - netstat
    - Metador
    - Mafalda
    - JFMBackdoor
    - Lamassu
    - GetExtendedTcpTable
    - proc_net_tcp
    - socket
    - application control
    - network_namespaces
    conclusions:
    - REF-000025 remains the existing AA24-038A publication including FBI and IC3 PDF distribution aliases; proposed netstat
      case differs from existing reg-query and process-discovery cases by central fact
    - REF-000639 remains the existing Lunar publication; extend locator for recovered connection-inquiry category without
      duplicating exfiltration or shared-resource cases
    - Reuse REF-000230 for all Sysmon semantics; do not duplicate differently titled same-URL entries
    - REF-000201 REF-001042 REF-000840 retain their exact audit-document identities
    - No existing Metador publication or socket-reader strategy matched the current catalog and canonical text search; primary
      must recheck all five handoffs before canonical allocation
    - B011-T1049-REF-METADOR and B011-T1049-CASE-MAFALDA are shared with T1016 after the primary identified GetAdaptersInfo
      in the same command; do not create a second publication or same-command capability case
    - B011-T1049-REF-DETOURS is shared with the T1016 instrumentation proposal; the existing network-view measure also applies
      to configuration views but T1016-specific mitigation applications require its own authored paragraphs
    - New mitigation purpose is connection-state query provenance and view scoping; MIT-000083 native-callpath memory governance
      and MIT-000078 interpreter governance have different overall measures and are not extended wholesale
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已阅读实际 NJT-0001，按定义、变量、残余痕迹、边界反例、攻防前提、因果机理和证据限制检查父与子；不复制其长度、机理数和子项数。查询者与端点所属者、请求与返回、状态与数据交付均在读者正文和防御逻辑自然展开，主审仍须独立复核与完成机器和
        Web 门禁。
      en: Read actual NJT-0001 and checked parent and child for definition, variable, residual traces, boundary counterexamples,
        attacker and defender assumptions, causal mechanisms, and evidence limits without copying length or object counts.
        Reader versus endpoint owner, request versus return, and state versus delivery are developed in reader prose and defense
        logic. The primary still must independently review and complete machine and Web gates.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - fixed_baseline_read
    - source_download_and_hash
    - pdf_text_and_page_render
    - library_lookup
    - yaml_parse_and_reference_integrity_checks
  limitations:
    paragraphs:
    - zh: 研究未运行恶意样本或实现调用传感器。Mafalda 的正面依据是原始研究的命令实现，正式检测设计中自定义采集仍为待验证合同；不能将它记为已经测试的传感器或当前全平台覆盖。未取得结果的请求和没有公开逐机证据的能力始终与现场成功取数分开。
      en: This research did not execute malware or implement the invocation sensor. Mafalda's positive support is the command
        implementation in original research, and custom capture in the proposed defense remains a contract requiring validation
        rather than a tested sensor or all-platform coverage. Requests without results and capabilities without public per-host
        records remain distinct from successful field acquisition.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason:
      zh: 查询可调度或低频并不证明有意时间稀释；没有本候选的受控变量与观察效果证据。
      en: Schedulability or low frequency does not establish deliberate temporal dilution without candidate-specific controlled-variable
        and observation-effect evidence.
  - mechanism_ref: NM-DO
    reason:
      zh: 控制端包名和一般植入体加密不是连接查询语义被遮蔽的独立证据；不从通用载体加密外推本查询机理。
      en: Controller-packet labels and general implant encryption do not independently establish obscured connection-query
        semantics; generic carrier encryption is not projected onto this inquiry.
  open_questions:
  - Can a validated sensor collect the particular table call and carrier provenance safely across required Windows bitness
    and protected-process boundaries
  - Can future dynamic evidence distinguish particular command-63 invocation result and operator selection from sample capability
    alone
  - Can candidate-specific evidence support numeric auxiliary-resolution suppression or cadence as a separate stable variable
    rather than ordinary diagnostic settings
