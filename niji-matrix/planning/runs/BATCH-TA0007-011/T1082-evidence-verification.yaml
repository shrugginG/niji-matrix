verification_schema_version: 1.0.0
type: candidate-evidence-verification
batch_ref: BATCH-TA0007-011
candidate_attack_id: T1082
verified_on: '2026-11-07'
verification_scope: Independent research only; no formal ID allocation or canonical writes
source_inventory:
- key: B011-T1082-REF-BASELINE
  method: Read fixed-baseline-T1082.json extracted from the frozen Enterprise 19.1 workbook
  verified: true
  locator: techniques row T1082; version 3.0; modified 2026-05-12
  facts: OS, hardware, architecture and patch scope; Discovery; Windows/Linux/macOS/ESXi/IaaS/network-device scope; zero
    ATT&CK children
  boundaries: Versioned web URL was inaccessible through the browser tool. No live page or third-party mirror replaces
    the frozen row.
- key: B011-T1082-REF-VOLT-CSA
  method: Browser opened partner-agency authoritative PDF
  verified: true
  url: https://www.ic3.gov/CSA/2023/230524.pdf
  publication_identity: AA23-144A / U/OO/156893-23 / PP-23-1143; June 2023 version 1.1 of 2023-05-24 advisory
  locator: Printed pp 1-2, 11-12 and 14
  facts: Actor-used systeminfo and wmic baseboard list full; normal administration overlap; explicit logging enablement
    requirement
  boundaries: Commands do not supply per-victim returned attributes, exact query times, or per-query detection outcomes.
    Mirror PDF and CISA advisory share one reference identity.
- key: REF-000626
  method: Browser opened original Mandiant publication and inspected command table
  verified: true
  url: https://cloud.google.com/blog/topics/threat-intelligence/sunburst-additional-technical-details
  locator: 2020-12-24, command table CollectSystemDescription ID 3
  facts: Trojanized Orion plugin sample contains OS-version profiling capability
  boundaries: Capability is not per-victim execution. User/MAC/IP/DHCP facts in the same command retain separate object
    boundaries; C2 disguise and anti-analysis delays do not prove a T1082 child.
- key: B011-T1082-REF-KGB
  method: Browser opened original article; downloaded and visually inspected Figures 10 and 17
  verified: true
  url: https://www.group-ib.com/blog/kgb-rat-windows-fud-trojan/
  authors:
  - Alpomish Asadov
  - Razvan Raducu
  published: '2026-10-14'
  locator: Dynamic Analysis / System reconnaissance via WMI; C2 Beacon with System Fingerprint
  facts: Positive runtime Win32_OperatingSystem query in Figure 10; original authors attribute the query to the malware's
    own process and contrast creation-only monitoring; Figure 17 contains a reported OS-profile string
  local_artifacts:
  - T1082/kgb-figure10-wmi.png
  - T1082/kgb-figure17-beacon.png
  boundaries: Instrumented detonation only. The reported string is not physical/guest attestation. No field-campaign
    query date or sector is inferred, and the FUD marketing label is not a finding of undetectability. Baseboard query
    does not establish all values returned. AV, process, location and sleep observations remain outside this child's
    result.
- key: B011-T1082-REF-SYSTEMINFO
  method: Browser opened official command reference
  verified: true
  url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/systeminfo
  locator: Description, syntax and /s /u /p /fo /nh parameters; updated 2023-02-03
  facts: Local default or named remote system; specified or current caller rights; OS/hardware diagnostic capability
  boundaries: Does not promise no privilege requirement for every remote target, all error cases, or default output auditing.
- key: B011-T1082-REF-GETVERSION
  method: Browser opened official API reference
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/api/sysinfoapi/nf-sysinfoapi-getversionexa
  locator: Windows 8.1 manifest behavior, compatibility mode and Return value
  facts: Manifest/compatibility-dependent version; BOOL success/failure; invalid structure size and GetLastError
  boundaries: Returned version is not unqualified proof of installed OS; static import is not invocation.
- key: B011-T1082-REF-GETSYSTEMINFO
  method: Browser opened official API reference
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/api/sysinfoapi/nf-sysinfoapi-getsysteminfo
  locator: SYSTEM_INFO output pointer; VOID return; WOW64 note
  facts: Caller receives structure output; there is no BOOL success flag
  boundaries: Does not establish malicious use or returned values in a specific process; no generic assumption of silence.
- key: B011-T1082-REF-GETNATIVE
  method: Browser opened official API reference
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/api/sysinfoapi/nf-sysinfoapi-getnativesysteminfo
  locator: Current system, WOW64 and non-Intel64/x64 emulation; return value None
  facts: On certain emulated ARM64 paths results can describe x86/x64 support rather than unrestricted physical-processor
    facts; IsWow64Process2 guidance
  boundaries: Native in the function name does not attest actual physical hardware. ARM64 behavior is not generalized
    from historical x64 examples.
- key: B011-T1082-REF-WIN32OS
  method: Browser opened official class reference and OSArchitecture property
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-operatingsystem
  locator: Version, BuildNumber and OSArchitecture
  facts: OSArchitecture is OS architecture rather than processor architecture and may be localized
  boundaries: No complete physical hardware or patch-state inference from this class alone.
- key: B011-T1082-REF-BASEBOARD
  method: Browser opened official class reference
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-baseboard
  locator: Description; Product, Manufacturer, SerialNumber read-only properties
  facts: Class represents a baseboard and exposes hardware-identification fields
  boundaries: Class capability does not establish returned values, truthfulness of virtual firmware, or successful malicious
    reads.
- key: B011-T1082-REF-PROCESSOR
  method: Browser opened official class reference
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-processor
  locator: Description; AddressWidth, Architecture, DataWidth and processor properties
  facts: OS-visible processor class has explicit property semantics
  boundaries: Not equated with Win32_OperatingSystem.OSArchitecture or unqualified physical attestation.
- key: B011-T1082-REF-QFE
  method: Browser opened official class reference
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-quickfixengineering
  locator: Opening CBS-only update scope; HotFixID and InstalledOn
  facts: Only documented CBS updates are returned; MSI and Windows-update-site categories are not returned by this class
  boundaries: Empty or missing HotFixID does not establish unpatched or exploitable state.
- key: B011-T1082-REF-UNAME
  method: Browser opened maintained Linux kernel/userspace interface manual
  verified: true
  url: https://man7.org/linux/man-pages/man2/uname.2.html
  version: Linux man-pages 6.19; 2026-02-08 page
  facts: utsname field meanings; zero success, minus-one error and EFAULT; kernel declared fields and administrator-configured
    names
  boundaries: Neither command launch nor syscall audit contains returned buffer; uname is not a complete patch inventory.
- key: B011-T1082-REF-UTS
  method: Browser opened maintained namespace manual
  verified: true
  url: https://man7.org/linux/man-pages/man7/uts_namespaces.7.html
  version: Linux man-pages 6.19; 2026-02-08 page
  facts: Hostname and NIS domain-name isolation under CONFIG_UTS_NS
  boundaries: Does not isolate every uname field or independently prove a separate guest OS, VM, geography or actual
    physical host.
- key: B011-T1082-REF-APPLE
  method: Browser opened official version-specific guide after unversioned route returned 429
  verified: true
  url: https://support.apple.com/guide/mac-help/get-system-information-about-your-mac-syspr35536/26/mac/26
  version: macOS Tahoe 26 guide
  facts: System Report provides OS and hardware information and can be saved
  boundaries: Normal capability only; no verified malicious saved-report reuse, complete field permission contract or
    operational analytic is claimed.
- key: B011-T1082-REF-CISCO
  method: Official Cisco PDF search extract inspected
  verified: true
  url: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/Cisco_IOS_Configuration_Fundamentals_Command_Reference.pdf
  locator: Printed p1312 show version
  facts: IOS show version exposes loaded software and hardware/device attributes with platform-dependent modes
  boundaries: Not generalized to CBS220 or every appliance. Command execution and output were not tested; source is platform
    capability rather than a case.
- key: B011-T1082-REF-ESXCLI
  method: Browser opened official system namespace reference
  verified: true
  url: https://developer.broadcom.com/xapis/esxcli-command-reference/latest/namespace/esxcli_system.html
  locator: system version get and --alternate; system hostname get
  facts: Product name/version/build output and optional alternate-bootbank image version
  boundaries: Latest interface reference does not migrate fixed ATT&CK 19.1. Alternate image is not necessarily the running
    image. No role-level success result or default audit is inferred.
- key: REF-000525
  method: Browser opened official API and compared canonical source identity
  verified: true
  url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeInstances.html
  facts: IDs/filters, authorization DryRun result, invalid IDs, unowned-instance omission, pagination, terminated records
    and eventual consistency
  boundaries: DryRun checks permissions without an actual describe result; ordinary command success and incomplete pages
    are not complete instance profiles.
- key: B011-T1082-REF-AWS-INSTANCE
  method: Browser opened official Instance schema
  verified: true
  url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_Instance.html
  facts: architecture means image architecture; hypervisor xen can indicate Xen or Nitro; platform and many other attributes
    are optional
  boundaries: Not current guest kernel/patch or physical-hardware attestation; no field truth inferred from CloudTrail-only
    events.
- key: REF-000230
  method: Browser opened original Sysmon manual
  verified: true
  url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  facts: Event1 process/command metadata and ProcessGuid; Event5 termination; configuration-dependent collection
  boundaries: No command-output or WMI return-property feed. Registry modification events are not read events, and absent
    creation events are not acquisition evidence.
- key: REF-000463
  method: Canonical Windows PowerShell5.1 source read; official logging documentation cross-checked
  verified: true
  url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging?view=powershell-5.1
  facts: Policy-controlled Script Block Logging and Event4104 channel
  boundaries: Proposed implementation is Windows PowerShell5.1, not an unverified assumption that all PowerShell hosts
    or versions use the same source. Scripts provide request semantics rather than command results.
- key: REF-000840
  method: Browser opened auditctl manual
  verified: true
  url: https://man7.org/linux/man-pages/man8/auditctl.8.html
  facts: Architecture-qualified syscall exit rules, never-task concern, rule status and lost/backlog inspection
  boundaries: Audit must be configured beforehand; syscall argument pointers do not provide attribute buffers. No rule
    was installed in this workspace.
- key: REF-001042
  method: Browser opened exact RHEL7 canonical manual; current RHEL8 chapter inspected only as auxiliary
  verified: true
  url: https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/7/html/security_guide/sec-understanding_audit_log_files
  facts: audit timestamp/serial, syscall, success, exit, pid, ppid, auid, uid, euid, ses, exe and key; same-event grouping
  boundaries: uid and euid differ. Login identity remains separate; no process-start/namespace or output buffer is claimed
    from these records.
- key: REF-001306
  method: Browser opened exact official ExecQuery page
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/api/wbemcli/nf-wbemcli-iwbemservices-execquery
  facts: Query text and flags; returned enumerator; zero-instance result is not an error; remote failures and quota errors
  boundaries: Enumerator creation is not object consumption or nonempty results. Prototype flag does not execute the
    query.
- key: REF-001307
  method: Browser opened exact official enumerator Next page
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/api/wbemcli/nf-wbemcli-ienumwbemclassobject-next
  facts: puReturned and apObjects; WBEM_S_FALSE can accompany valid objects; timeout does not prove empty enumeration
  boundaries: No query completeness or acquired property values from one HRESULT alone.
- key: REF-001309
  method: Browser opened exact official WMI troubleshooting source and XML examples
  verified: true
  url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/system-management-components/troubleshoot-wmi-high-cpu-issues
  locator: Review the WMI trace files, Event11 Operation_New and Event12 Operation_Provider_Info_New XML examples
  facts: ExecQuery text, ClientMachine, ClientProcessId, ClientProcessCreationTime, User, NamespaceName and operation
    IDs; provider HostId is separate
  boundaries: Namespace is taken from XML or correctly parsed Operation, not the rendered example's mislabeled numeric
    value. Event12 may lack OperationId and client fields. Enable/version validation is required. No complete return
    output is present.
- key: REF-001310
  method: Browser opened exact namespace-access source
  verified: true
  url: https://learn.microsoft.com/en-us/windows/win32/wmisdk/access-to-wmi-namespaces
  facts: Namespace DACL and caller token, provider impersonation, remote-access limits; SACL audit not on by default;
    4662 audits namespace access rather than provider-operation result
  boundaries: Enable Account/instance read differs from Execute Methods; successful authorization is not returned attributes.
    Namespace auditing changes need elevated authority.
- key: REF-000200
  method: Browser opened official App Control PowerShell source and read canonical identity
  verified: true
  url: https://learn.microsoft.com/en-us/powershell/scripting/security/app-control/application-control
  facts: App Control enforces trusted/untrusted script-language differences; feature behavior varies across versions
  boundaries: No claim that constrained language blocks all CIM commands or basic getters; only interpreter-capability
    path mitigation.
- key: REF-000523
  method: Canonical source and its exact scope read from shared YAML
  verified: true
  url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-management-events-with-cloudtrail.html
  facts: Read-management selection and central read coverage support exact MIT-000139 application extension
  boundaries: No universal default logging assumption. Not used to assert acquired guest attributes.
- key: REF-000524
  method: Canonical source and exact read-response limitation read from shared YAML
  verified: true
  url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
  facts: Event identity/method/Region/request metadata and incomplete read-response content
  boundaries: Request logs cannot restore complete returned system-attribute profiles.
search_log:
- purpose: Parent malicious use and normal diagnostic overlap
  queries:
  - site.microsoft.com security Solorigate GetOSVersionInfo system information December 2020 Sunburst
  - site.mandiant.com SUNBURST CollectSystemDescription GetOSVersion
  - site.cisa.gov systeminfo whoami Volt Typhoon May 2023
  outcome: Original Mandiant sample capability and partner joint advisory command adoption selected; broad Microsoft
    storage/process statement not misused as specific OS-return evidence.
- purpose: Open-ended native-axis search
  queries:
  - malware "system information" "cached" report discovery
  - malware "operating system" "event" "Win32_OperatingSystem" discovery
  - malware "system information" "GetSystemInfo" "process"
  - malware "system information" "filter" "DescribeInstances"
  outcome: Original Group-IB runtime source found and promoted after positive query/carrier/profile verification. No
    accepted malicious saved-report, event-triggered or filter-selected trace contrast found. Search results alone are
    not admitted evidence.
- purpose: Alternative API sample and neighboring boundaries
  queries:
  - site.elastic.co security Pikabot 2024 system information GetNativeSystemInfo
  - site.zscaler.com pikabot system information GetVersion
  - site.cisa.gov malware system information GetSystemInfo GetVersionEx
  outcome: Results were not elevated into a second child or case without stronger query/carrier/trace support. Anti-analysis
    CPU and locale comparisons retain neighboring ownership.
- purpose: Canonical-library identity and semantic lookup
  local_inputs:
  - dist/catalogs/library-catalog.json
  - references
  - claims
  - cases
  - detections
  - analytics
  - mitigations
  search_terms:
  - System Information Discovery
  - systeminfo
  - GetNativeSystemInfo
  - GetVersionEx
  - uname
  - SUNBURST
  - KGB RAT
  - DescribeInstances
  - WMI query
  - host profile
  outcome: Reuse thirteen confirmed reference identities; propose seventeen new references. Reuse no existing DET/NJA
    unchanged. Split C2-centered SUNBURST case and resident process-query claim semantics. Propose exact applications-only
    extensions for MIT-000078, MIT-000139 and MIT-000094.
rejected_shortcuts:
- No current ATT&CK site data replaces Enterprise19.1 scope.
- No static import, Sysmon absence, provider load, namespace permission or successful ExecQuery alone confirms a specific
  attribute return.
- No AV, process, geolocation, sleep or execution-gating fact from the same sample is copied into the system-attribute
  child.
- No default EDR source is invented for getter or return-buffer observation; proposed analytics consume request metadata
  and syscall status only.
- No measured stealth, detector-miss or detection-rate claim is made.
