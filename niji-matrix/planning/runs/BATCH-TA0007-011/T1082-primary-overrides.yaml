- pointer: /defense_candidates/detection_analytics/2/logic/paragraphs/3
  append: true
  value:
    zh: 原生字段按实际 schema 映射：System/Computer 是 native_target_host，System/TimeCreated 是 event_time；ClientMachine、ClientProcessId、User、NamespaceName、GroupOperationId 和 OperationId 分别保留客户端、主体、命名空间与操作身份，query_text 从 Operation 内的 ExecQuery 文本提取。目标主机与客户端分别映射，不能把 System/Computer 当 ClientMachine。ProviderName 与 HostId 只标识 provider；provider 事件缺少 OperationId 时仅按目标主机、boot_id 与 GroupOperationId 连接，缺失客户端字段保持未知。若实际版本提供 ClientProcessCreationTime，须验证其编码，FILETIME 按 1601 年起的 100 纳秒间隔转换为 UTC 后才与生存期比较；不得直接当 Unix 毫秒。以上字段的缺失和模式差异进入 parser_state 与覆盖报告，不补造成功结果。
    en: Map native fields against the actual schema. System/Computer supplies native_target_host and System/TimeCreated supplies event_time. Preserve ClientMachine, ClientProcessId, User, NamespaceName, GroupOperationId, and OperationId for client, principal, namespace, and operation identity, extracting query_text from ExecQuery text in Operation. Resolve target and client hosts separately rather than treating System/Computer as ClientMachine. ProviderName and HostId identify only the provider. A provider event lacking OperationId joins only by target host, boot_id, and GroupOperationId, with missing client fields left unknown. If the deployed version provides ClientProcessCreationTime, validate its encoding; convert FILETIME from 100-nanosecond intervals since 1601 to UTC before comparing lifetimes, never treating it as Unix milliseconds. Missing fields and schema differences enter parser_state and coverage reporting rather than generating successful results.
