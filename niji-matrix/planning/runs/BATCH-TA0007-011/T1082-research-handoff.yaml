research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - OS/version/build/patch and architecture attributes
    - Processor/memory/firmware and system hardware attributes
    - Host-local, managed-device, hypervisor and authenticated provider-description observation positions
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: Fixed parent OS/hardware/patch attributes and authoritative implementation surfaces
      resolution: parent-core
      evidence_keys:
      - B011-T1082-REF-BASELINE
      - B011-T1082-REF-SYSTEMINFO
      - B011-T1082-REF-WIN32OS
      - B011-T1082-REF-QFE
    - cluster: OS/API/platform/vendor/attribute-field partitions
      resolution: not-stealth-distinct
      evidence_keys:
      - B011-T1082-REF-GETVERSION
      - B011-T1082-REF-GETNATIVE
      - B011-T1082-REF-APPLE
      - B011-T1082-REF-CISCO
      - B011-T1082-REF-ESXCLI
    candidate_stealth_axes_examined:
    - axis: In-process system-attribute querying relative to a separate diagnostic executor
      stable_variable: Carrier position of the particular query in the existing client
      positive_evidence: Group-IB runtime Figure 10 captures Win32_OperatingSystem WQL and describes its in-process client;
        Figure 17 and the text connect reported OS profiling. Official WMI semantics separate client, provider, request
        and enumerator.
      evidence_keys:
      - B011-T1082-REF-KGB
      - REF-001306
      - REF-001309
      resolution: niji-variable-candidate
      reason: Promote one child because this source links a particular query and carrier to the creation-only observation
        difference. Do not promote generic API availability, absent logs, all getters, or a requirement for a trusted
        resident carrier.
      useful_defense_difference: A new WMI-query client-lineage analytic observes actual requests without requiring utility
        launch and explicitly lacks returned values.
    - axis: Resident legitimate management carrier
      stable_variable: Provenance and normal duties of a long-lived query carrier
      positive_evidence: SUNBURST is a trojanized Orion plugin with command 3 OS-version profiling.
      evidence_keys:
      - REF-000626
      resolution: evidence-deferred
      reason: The source links a carrier and sample capability, but lacks this command's invocation/result trace and
        a query-specific observation contrast. Its C2 telemetry emulation is already owned by NJT-0152 and is not imported
        as a Discovery child.
      useful_defense_difference: Would need module provenance plus query/result lineage; a signed carrier alone is not
        a child boundary.
    - axis: Preexisting system report or configuration snapshot reuse
      stable_variable: Source freshness and reuse instead of fresh collection
      positive_evidence: Apple documents saving System Reports; uname kernel data are declared or configured attributes.
      evidence_keys:
      - B011-T1082-REF-APPLE
      - B011-T1082-REF-UNAME
      resolution: evidence-deferred
      reason: Normal snapshot capability is established, but no verified malicious T1082 case selects an existing report
        to change collection traces. A stale record alone is not an intentional stealth variable.
      useful_defense_difference: Would shift to source-read provenance and report freshness; no child admitted without
        malicious-use evidence.
    - axis: Narrow attribute selection or filtered provider query
      stable_variable: Requested attribute and target scope
      positive_evidence: DescribeInstances supports filters and target IDs; management classes expose selected OS fields.
      evidence_keys:
      - REF-000525
      - B011-T1082-REF-WIN32OS
      resolution: not-stealth-distinct
      reason: Filtering also serves normal query efficiency and permission scope; no supported trace or observation change
        separates a stable evasion family from ordinary request semantics.
      useful_defense_difference: Request scope is retained as parent analytic context rather than a child taxonomy.
    - axis: Timing dilution and intermittent profiling
      stable_variable: Query cadence and observation window
      positive_evidence: SUNBURST contains delays, but the source does not tie a profiling-query cadence to those delay
        routines.
      evidence_keys:
      - REF-000626
      resolution: evidence-deferred
      reason: Delays belonging to C2 or anti-analysis cannot be assigned to T1082 without a specific query sequence.
        A low event count does not establish intentional dilution.
      useful_defense_difference: Long-horizon profiling would need actual timed query evidence; no timing child admitted.
    - axis: Event-driven or refresh-triggered acquisition
      stable_variable: Trigger or notification instead of polling
      positive_evidence: No positive malicious T1082 query-and-trigger source was established after targeted search;
        normal management/provider APIs remain capabilities only.
      evidence_keys:
      - B011-T1082-REF-WIN32OS
      - REF-000525
      resolution: evidence-deferred
      reason: A management interface or reported OS field does not prove event subscription, returned changes, or a polling-avoidance
        effect.
      useful_defense_difference: Would require actual subscription and returned-attribute records before registration-focused
        defenses could justify a child.
    - axis: Provider control-plane rather than guest execution
      stable_variable: Query observation position and authorization plane
      positive_evidence: DescribeInstances returns provider-declared Instance fields and does not require guest execution.
      evidence_keys:
      - REF-000525
      - B011-T1082-REF-AWS-INSTANCE
      resolution: parent-core
      reason: Fixed parent explicitly includes authenticated IaaS descriptions. It is a real observation distinction
        but there is no independent adversarial query/return trace and intentional evasion contrast for a T1082 child.
        Resource-graph listing remains NJT-0139.
      useful_defense_difference: IaaS read-scope/audit mitigation application added; no assumed guest-kernel knowledge.
    - axis: Attribute-conditioned behavior and virtualized/analysis classification
      stable_variable: Comparison or decision after attributes are acquired
      positive_evidence: SUNBURST has anti-analysis checks independently from command 3; fixed T1082 says facts may shape
        follow-on behavior.
      evidence_keys:
      - REF-000626
      - B011-T1082-REF-BASELINE
      resolution: adjacent-technique
      reason: NJT-0122 owns analysis-environment-conditioned differences and NJT-0109 owns target-conditioned activation.
        Attribute reading alone does not establish either decision/result relationship.
      useful_defense_difference: Differential successor experiments belong to those existing objects and are not duplicated
        here.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定父项无 ATT&CK 子项，仍独立检查八条轴。第二轮找到并核验 KGB RAT 原始动态查询与画像证据，进程内承载轴因此提升为一项原生子项；它不要求受信或长期驻留客户端，不把 provider 放入同进程。其余七轴各有明确相邻或证据收敛理由，保留未来扩展研究而不增加无证据子项。
      en: The fixed parent has no ATT&CK children, but eight independent axes were examined. A second pass found and
        verified original KGB RAT dynamic query/profiling evidence, promoting in-process carriage to one native child.
        It requires neither a trusted nor long-lived resident client and does not place the provider in that process.
        Each other axis has explicit neighboring or evidentiary resolution, preserving further research without unsupported
        children.
