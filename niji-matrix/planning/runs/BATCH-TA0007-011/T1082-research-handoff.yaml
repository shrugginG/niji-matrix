  - temporary_key: B011-T1082-NJA-LINUX-UNAME
    strategy_key: B011-T1082-DET-PROFILE-REQUEST
    name:
      zh: Linux uname 调用与画像职责分析
      en: Linux uname Invocation and Profiling-Duty Analytic
    summary:
      zh: 以预先配置的系统调用审计识别异常上下文的 uname 调用，区分调用成功与实际属性值。
      en: Use preconfigured syscall auditing to identify uname calls in unusual contexts, separating successful invocation
        from actual attribute values.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 在支持 Linux Audit 的目标按实际 ABI 配置 uname 的 syscall exit 规则，并确认没有 never,task 等规则使其失效；原型为 -a always,exit -F arch=b64
          -S uname -k host_profile_query，存在兼容 ABI 时单独核验其 syscall 名称与规则。按同一 audit_event_id 合并 SYSCALL 记录并保留 success、exit、pid、ppid、auid、uid、ses
          与 exe。success=yes 且 exit=0 只输出 observed_successful_uname_call，失败输出 observed_failed_call；缓冲区指针、PROCTITLE 或进程名不提供返回属性内容。
        en: On Linux Audit targets, configure uname syscall-exit rules for the actual ABI and verify that rules such
          as never,task do not disable them. A prototype is -a always,exit -F arch=b64 -S uname -k host_profile_query;
          verify syscall names and rules separately for any compatibility ABI. Merge SYSCALL records by audit_event_id
          and retain success, exit, pid, ppid, auid, uid, ses, and exe. success=yes with exit=0 emits only observed_successful_uname_call;
          failure emits observed_failed_call. A buffer pointer, PROCTITLE, or process name does not reveal returned attributes.
      - zh: 由采集器 enrollment 将 native_node 映射为 host_id，按事件时间将 effective_uid 映射为调用有效主体 principal_id，并分别保留 real_uid、audit_login_uid
          与 audit_session_id；unset auid 不回填为实际登录操作者。先按 host_id、audit_event_id 与事件时间形成自足调用记录，再按主机、审计会话和已解析有效主体在五分钟内比较请求与批准
          query_scope。仅在已部署的进程生存期映射给出唯一匹配时加入 process_key 与父链；同 PID 跨重启、跨生存期或命名空间映射不明时不得合并。批准台账缺失时输出 context_unknown。
        en: Map native_node to host_id through collector enrollment and effective_uid to the event-time effective principal_id,
          retaining real_uid, audit_login_uid, and audit_session_id separately. Do not fill unset auid with an assumed
          login operator. First form self-contained call records by host_id, audit_event_id, and event time, then compare
          calls with approved query_scope over five minutes by host, audit session, and resolved effective principal.
          Add process_key and ancestry only when a deployed process-lifetime map supplies a unique match; never merge
          a reused PID across boots, lifetimes, or unresolved namespaces. Missing approval records yield context_unknown.
      - zh: 对不承担画像职责的应用出现 uname 调用、同一已解析会话中的未登记画像请求，或批准范围明显不符的调用输出调查项，同时保留原始事件与规则版本。此分析不读取调用者缓冲区，不消费 /proc 内容、命令输出或资产库结果，不能报告实际内核字符串或物理机身份。采集健康不完整、lost
          增长或相关 ABI 未覆盖时标记 coverage_incomplete，缺少事件不能作为没有查询的证据。
        en: Report calls requiring investigation when an application without profiling duties invokes uname, an identified
          session makes unregistered profiling requests, or a call clearly departs from approved scope, retaining raw-event
          and rule-version references. The analytic does not read caller buffers or consume /proc contents, command output,
          or inventory results and cannot report actual kernel strings or physical-machine identity. Mark coverage_incomplete
          when health is incomplete, lost counts rise, or a relevant ABI is uncovered; missing events do not establish
          absence of querying.
    data_requirements:
    - source_type: linux-audit-uname-syscall
      name:
        zh: 预先配置的 Linux uname 系统调用审计
        en: Preconfigured Linux uname syscall audit
      channel: audit.log SYSCALL events selected by deployed uname exit rules
      required_fields:
      - native_node
      - event_time
      - audit_event_id
      - arch
      - syscall
      - success
      - exit_code
      - process_id
      - parent_process_id
