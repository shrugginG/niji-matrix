          是否在目标系统实际可用；不能按 Microsoft 签名、PowerShell 或 systeminfo 名称整体过滤。
        en: Maintain query_scope baselines separately for support, installation, deployment, and ordinary endpoints,
          using expiring and attributable job allowances. Treat missing approval as outside scope only when the register
          is complete, and preserve temporary troubleshooting as a verifiable exception. Check script-fragment reconstruction,
          command escaping, and actual WMIC availability on the target system. Do not filter wholesale by Microsoft signatures,
          PowerShell, or the systeminfo name.
