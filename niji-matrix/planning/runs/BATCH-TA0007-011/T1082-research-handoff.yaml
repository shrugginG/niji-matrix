  - existing_ref: REF-000626
    resolution: extend
    rationale: Same canonical SUNBURST publication; extend locator to command 3 CollectSystemDescription and OS-version
      sample capability without borrowing C2-message case identity.
  - existing_ref: REF-000525
    resolution: reuse
    rationale: Same DescribeInstances API contract; request scope, pagination, errors and eventual consistency already
      share one source identity.
  - existing_ref: REF-000230
    resolution: reuse
    rationale: Sysmon Event 1/5 semantics and limitations are unchanged; do not create a second source for the download/manual
      URL.
  - existing_ref: REF-000463
    resolution: reuse
    rationale: Windows PowerShell 5.1 Script Block Logging policy and Event 4104 source identity remain unchanged; no
      separate PowerShell 7 source is needed by this analytic.
  - existing_ref: REF-000840
    resolution: extend
    rationale: Same auditctl manual; add uname syscall exit rule and ABI/never-task/health locators, without inventing
      return-buffer visibility.
  - existing_ref: REF-001042
    resolution: reuse
    rationale: Existing RHEL 7 audit-record-field manual supports the SYSCALL fields; do not create a duplicate source
      for the current RHEL 8 chapter alias.
  - existing_ref: MIT-000078
    resolution: extend
    rationale: Existing measures for interpreter entry, capability/trust, protected transient audit and response remain
      unchanged; add only a system-profile-specific application.
  - existing_ref: MIT-000139
    resolution: extend
    rationale: Existing scoped Describe authority and organization management-read audit measures remain unchanged; add
      only a system-description-specific application.
  - existing_ref: DET-000150
    resolution: defer
    rationale: Its objective and NJA-000158 require a cross-service resource graph and successor operations; a single
      system-description request has different semantics and cannot be covered by title similarity. No existing analytic
      is proposed for direct reuse.
  - existing_ref: CASE-000199
    resolution: split
    rationale: Existing center is C2-message disguise; SUNBURST host OS-version capability requires a separate bounded
      sample case rather than extending the old case beyond its observed center.
  - existing_ref: MIT-000241
    resolution: defer
    rationale: Its measures explicitly bind storage/capacity queries and multi-platform storage audit; extending it would
      require broadening measures or noun replacement rather than exact application reuse.
  - existing_ref: REF-001306
    resolution: reuse
    rationale: Same ExecQuery contract and empty-enumerator semantics; process and system-attribute queries share the
      interface source without sharing analytic identity.
  - existing_ref: REF-001307
    resolution: reuse
    rationale: Same enumerator Next count/status contract; no new source for another queried class.
  - existing_ref: REF-001309
    resolution: reuse
    rationale: Same version-validated WMI ExecQuery Trace and original-client attribution source. The new analytic parses
      different direct objects and cannot reuse the process-query analytic unchanged.
  - existing_ref: REF-001310
    resolution: reuse
    rationale: Same WMI namespace DACL/SACL/read/remote-authorization and provider-result limitation source.
  - existing_ref: MIT-000094
    resolution: extend
    rationale: Keep existing namespace authority, managed remote origins and operation-lineage measures unchanged; add
      two read-query applications with explicit ExecMethod/read distinction and no provider-result claim.
  - existing_ref: CLM-001231
    resolution: split
    rationale: Existing resident-query proposition is evidenced for process inquiry in a task-capable agent. This subject
      uses independent KGB system-attribute runtime evidence and a client-carriage rather than per-task resident-agent
      scope; preserve separate atomic causal context.
