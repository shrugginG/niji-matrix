    - source_type: wmi-trace-collection-health
      name:
        zh: WMI Trace 采集健康与版本合同
        en: WMI trace health and version contract
      channel: Trace deployment and collector configuration records
      required_fields:
      - host_id
      - event_time
      - boot_id
      - windows_build
      - trace_policy_id
      - event_schema_version
      - covered_query_paths
      - trace_start_time
      - events_lost
