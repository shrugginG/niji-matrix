  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 实读 NJT-0001 与既有 NJS-0240-001，逐字段比较后独立撰写父子正文。T1082 的画像声明与真实属性、命名空间授权与查询结果、客户端与 provider 以及独立诊断进程边界均有专门责任；新子项凭
        KGB 原始证据成立，不沿用进程调查案例。三条分析按命令语义、uname状态和WMI客户端谱系分工，未使用名称替换的通用防御。
      en: The actual NJT-0001 and existing NJS-0240-001 were read and compared field by field before independently writing
        parent and child content. T1082 separately handles profile declarations versus actual attributes, namespace authorization
        versus query results, clients versus providers, and diagnostic-process boundaries. The new child rests on original
        KGB evidence rather than a process-survey case. Three analytics divide command semantics, uname status, and WMI
        client lineage without name-substitution defenses.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - Local fixed-baseline extract read, catalog identity queries, YAML serialization/parsing and field-shape checks
      only.
  limitations:
    paragraphs:
    - zh: 联合公告记录系统画像命令的恶意采用但没有输出和逐主机执行时间；SUNBURST 资料证明样本中 OS 版本画像能力，不能证明所有受害者执行。KGB RAT 的原始仪器化沙箱另提供进程内 OS 查询与画像消息，但消息中的声明字符串并不鉴定真实
        OS 或物理硬件，也不能把其他 AV、进程和地域事实转入本项。正常诊断外观与客户端承载差支持中等机理置信，尚未进行检测率或对照实测。
      en: The joint advisory records adversarial profiling commands without their output or per-host execution times.
        SUNBURST reporting establishes sample OS-version profiling rather than execution on every victim. KGB RAT's original
        instrumented detonation separately provides an in-process OS query and profile message, but a declared string
        does not attest the actual OS or physical hardware, and AV, process, or geographic facts are not assigned here.
        Diagnostic appearance and client-carriage differences support medium mechanism confidence without detection-rate
        or controlled experiments.
    - zh: 官方资料说明返回语义而不保证查询完整或真实反映物理环境，版本字符串、CBS 更新集、虚拟硬件和提供方声明各有限制。提出的 Windows 命令、WMI Trace 与 Linux 分析尚未部署验证，依赖明确维护的身份、进程生存期、审批和采集健康输入；它们均不采集返回内容。非
        WMI getter 与其他平台仍有覆盖缺口，具体调用与返回记录、正常基线和同案差分可改变分类与防御置信度。
      en: Official sources define return semantics without guaranteeing complete or physical-environment truth. Version
        strings, CBS update sets, virtual hardware, and provider declarations each have limits. Proposed Windows-command,
        WMI-trace, and Linux analytics are not deployed or validated and rely on explicitly maintained identity, lifetime,
        approval, and collection-health inputs. None collects return content. Non-WMI getters and other platforms retain
        gaps; concrete calls and returns, normal baselines, and same-case comparisons could change taxonomy and defense
        confidence.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason: No supported timed or distributed system-attribute query sequence. SUNBURST delays belong to separately evidenced
      control/analysis behavior.
  - mechanism_ref: NM-DO
    reason: No evidence that T1082 query or returned attribute meaning is deliberately made uninspectable. C2 encoding
      is owned by communication objects.
  open_questions:
  - Seek additional independent implementations and cross-environment query/client/result comparisons for the admitted
    in-process child; a trusted resident-carrier or cached-report child still needs its own evidence.
  - Validate syscall rules across deployed ABIs and verify exact Windows PowerShell event fragmentation/lifetime joins
    before operational use.
  - Resolve broad macOS, ESXi, appliance and IaaS attribute-query analytics with actual deployed sensor contracts; do
    not treat current coverage as universal.
