  detection_analytics:
  - temporary_key: B011-T1082-NJA-WINDOWS-PROFILE
    strategy_key: B011-T1082-DET-PROFILE-REQUEST
    name:
      zh: Windows 系统画像请求与批准用途分析
      en: Windows System-Profile Request and Approved-Use Analytic
    summary:
      zh: 从诊断命令和完整脚本块识别 OS、硬件与修补属性请求，并依据执行来源和批准任务输出调查项。
      en: Recognize OS, hardware, and patch requests in diagnostic commands and complete script blocks, reporting them
        against execution origin and approved work.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 收集已启用的 Sysmon Event 1，并在启用 Script Block Logging 的 Windows PowerShell 5.1 环境按 script_block_id 和 message_total
          重组 Event 4104。解析 systeminfo 的实际执行而排除 /?，从 wmic os、baseboard、cpu 或 Get-CimInstance/Get-WmiObject 对 Win32_OperatingSystem、Win32_BaseBoard、Win32_Processor、Win32_QuickFixEngineering
          的读取恢复请求对象；排除 Create、Reboot、Set 等改变状态的方法。仅匹配字符串、脚本内容被截断或动态构造未解析时保留待解释状态，不把命令名称当作成功返回。
        en: Collect enabled Sysmon Event 1 and, on Windows PowerShell 5.1 with Script Block Logging, reassemble Event
          4104 by script_block_id and message_total. Parse actual systeminfo execution excluding /?, and recover request
          objects from wmic os, baseboard, or cpu and Get-CimInstance/Get-WmiObject reads of Win32_OperatingSystem, Win32_BaseBoard,
          Win32_Processor, or Win32_QuickFixEngineering. Exclude state-changing methods such as Create, Reboot, and Set.
          String-only matches, truncated scripts, or unresolved dynamic construction remain uninterpreted candidates,
          and command names are not successful returns.
      - zh: 按事件时间把原生设备和 User 映射为 host_id 与 principal_id；4104 的 event_process_id 只能在同主机且 process_start_time 至 process_end_time
          区间内映射到 process_guid，缺少终止时间时受最大已验证生存期限制，候选多于一个则保持 process_unresolved。以同一 process_guid、父 GUID 与 logon_guid 在初始十五分钟内组合属性请求，并与台账中的主体、主机、query_scope、允许父进程及有效期核验。明确不匹配且台账对该范围完整时可标记
          outside_approved_profile；身份、台账或父链缺失则为 context_unknown，不能自动作未批准结论。
        en: Resolve native device and User to host_id and principal_id at event time. Map Event 4104 event_process_id
          to process_guid only on the same host within process_start_time and process_end_time, bounded by a validated
          maximum lifetime when termination is missing; multiple candidates remain process_unresolved. Combine attribute
          requests by process_guid, parent GUID, and logon_guid in an initial fifteen-minute window, and check principal,
          host, query_scope, permitted parent, and validity against the register. A definite mismatch with a complete
          register for that scope can yield outside_approved_profile. Missing identity, register, or ancestry yields
          context_unknown rather than automatic unauthorized status.
      - zh: 输出 query_attempt 并保留请求字段类别、上下文状态和原始事件定位。此分析不消费命令输出、API 返回值、网络事件、文件读取或当前资产库属性，因此不输出已取得的 OS 版本、硬件型号、补丁清单或后继门控结论。进程内
          Win32/.NET getter 和未接入的远程 WMI 查询是明确盲区；签名与常见系统路径不构成豁免。
        en: Emit query_attempt with requested field categories, context state, and raw-event locations. This analytic
          consumes no command output, API returns, network events, file reads, or current inventory attributes and therefore
          emits no acquired OS version, hardware model, patch list, or successor-gating conclusion. In-process Win32/.NET
          getters and unintegrated remote WMI queries are explicit gaps. A signature or common system path does not grant
          exemption.
    data_requirements:
    - source_type: windows-sysmon-process-create
      name:
        zh: 已配置的 Sysmon 进程创建
        en: Configured Sysmon process creation
      channel: Microsoft-Windows-Sysmon/Operational Event ID 1
