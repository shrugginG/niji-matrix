      - collector_version
    observables:
    - zh: 已归属客户端直接提交 OS 或硬件实例查询，客户端职责或字段范围与批准任务不符。
      en: An attributed client directly submits OS or hardware-instance queries inconsistent with its approved duties
        or field scope.
    - zh: 请求由既有客户端归属而非独立诊断工具定位，且保留 provider 与 operation 的原始连接证据。
      en: A request is located through existing-client attribution rather than a separate diagnostic utility, with original
        provider and operation joins retained.
    correlation:
      window:
        zh: 同次操作按实际事件序列关联，初始五分钟容忍日志路由延迟；客户端匹配严格受生存期、重启和时钟误差边界限制，未验证检测率。
        en: Join an operation by its actual event sequence with an initial five-minute routing-delay allowance. Client
          matching remains constrained by lifetimes, boots, and clock error; no detection rate is validated.
      dimensions:
      - target_host_id
      - client_host_id
      - client_process_guid
      - principal_id
      - namespace
      - query_class
      - group_operation_id
      - operation_id
      - provider_host_id
      - event_time
      - policy_version
    false_positives:
    - zh: 软件部署、兼容性组件、OEM 工具和监控代理会在进程内查询相同类，动态请求也可能来自批准排障。
      en: Deployment software, compatibility components, OEM tools, and monitors query the same classes in-process, and
        dynamic requests can come from approved troubleshooting.
    blind_spots:
    - zh: Trace 未启用、只收错误/加载、模式变化、远程客户端生存期缺失或事件丢失会使归属不完整；非WMI getter 和返回内容不在此合同内。
      en: Disabled tracing, error/load-only feeds, schema changes, absent remote-client lifetimes, or lost events degrade
        attribution. Non-WMI getters and return content are outside the contract.
    tuning_guidance:
      paragraphs:
      - zh: 先用本地及需要支持的远程成功、空与失败查询验证原始字段、WQL解析和客户端映射，不把某版事件ID推广到所有Windows。按应用和作业实际职责建立字段与类范围允许项，保留未知主体及失配状态；避免永久放行WmiPrvSE、System.Management或已签名客户端。采集器只能在已验证覆盖时把无事件解释为该路径未观察到，不证明查询不存在。
        en: Validate raw fields, WQL parsing, and client mapping using local and required remote success, empty, and
          failure queries, without generalizing one version's event IDs to all Windows. Base class/property allowances
          on actual application and job duties, retaining unknown identities and mismatches. Avoid permanent exemptions
          for WmiPrvSE, System.Management, or signed clients. Only validated coverage can support a statement that a
          path was not observed; it cannot establish that querying did not occur.
    evidence_keys:
    - B011-T1082-REF-KGB
    - B011-T1082-REF-WIN32OS
    - B011-T1082-REF-BASEBOARD
    - B011-T1082-REF-PROCESSOR
    - B011-T1082-REF-QFE
    - REF-001306
    - REF-001307
    - REF-001309
    - REF-001310
    - REF-000230
    native_field_mapping:
      native_target_host: Event System/Computer
      event_time: Event System/TimeCreated/@SystemTime
      client_machine: Trace ClientMachine
      client_process_id: Trace ClientProcessId
      native_principal: Trace User
      namespace: NamespaceName or parsed Operation namespace, per validated schema
      query_text: Parsed ExecQuery query text within Trace Operation
      operation: Trace Operation
      group_operation_id: Trace GroupOperationId
      operation_id: Trace OperationId
      provider_name: Trace ProviderName when present; explicit unknown otherwise
      provider_host_id: Trace HostId/provider PID when present; never the client identity
      client_process_creation_time: Trace ClientProcessCreationTime when present; explicit unknown otherwise, validated
        against same-host lifecycle map
    deployment_contract_notes:
    - No default EDR API feed or custom return instrumentation is assumed. This analytic uses a configured and version-validated
      WMI Trace path plus separate lifecycle, identity, approval and health inputs.
    - Provider fields may be absent or unresolved and must retain that state. Client attribution is grounded in query
      start events and lifetimes rather than provider-load presence.
    - No optional result source is consumed. A future returned-object branch must separately declare enumerator/call/property
      provenance and revise this analytic.
    - Resolve native_target_host to target_host_id separately from client_machine to client_host_id. GroupOperationId
      is target-host/boot scoped; provider-only Event12 may omit OperationId and must join through GroupOperationId without
      inventing client fields.
    proposed_resolution: create
  mitigations:
  - existing_ref: MIT-000078
    resolution: extend
    measures_changed: false
    applications:
    - target_key: B011-T1082-PARENT
      use:
        paragraphs:
        - zh: 对通过解释器执行的系统信息发现，把 OS、主板、处理器与有限补丁查询限定在有职责的支持和部署身份、具体脚本与主机范围内；对未批准脚本保留受限能力，并采集受保护的查询语义。台账区分 OSArchitecture、处理器和修补来源，避免把允许一种诊断任务扩展为任意主机画像权限。
          en: For interpreter-mediated System Information Discovery, bind OS, baseboard, processor, and limited patch
            queries to responsible support or deployment identities, concrete scripts, and host scope. Retain constrained
            capabilities for unapproved scripts and protected query-semantics auditing. Distinguish OSArchitecture, processor
            facts, and patch sources in the register so approval for one diagnostic task does not become authority for
            arbitrary host profiling.
      expected_effect:
        paragraphs:
        - zh: 减少攻击者可借用的任意解释执行入口，并使看似正常的属性查询更易同真实作业核验。直接互操作能力被限制时，攻击者需要转用仍可调用的受控命令、其他执行路径或已被攻陷的批准脚本；这些变化可产生额外策略或调查证据。
          en: Reduce arbitrary interpreter entries available to the adversary and make ordinary-looking attribute queries
            easier to verify against real work. When direct interop is constrained, the adversary must use still-callable
            controlled commands, another execution path, or a compromised approved script, potentially producing additional
            policy or investigative evidence.
      limitations:
        paragraphs:
        - zh: 该应用只约束解释器路径，不阻止普通程序的基本系统 getter，也不保证 ConstrainedLanguage 禁止 CIM 或全部诊断命令。合法安装和修复依赖系统属性，批准身份或签名脚本被盗仍可查询；日志不含返回缓冲区，部署必须测试兼容性并保护可能包含敏感参数的内容。
          en: This application constrains interpreter paths rather than basic system getters in ordinary programs, and
            ConstrainedLanguage is not assumed to block CIM or all diagnostics. Legitimate installation and repair need
            system attributes, and stolen approved identities or signed scripts can still query. Logs lack return buffers,
            and deployment must test compatibility and protect content that can contain sensitive parameters.
    evidence_keys:
    - REF-000200
    - REF-000463
    - B011-T1082-REF-SYSTEMINFO
    - B011-T1082-REF-WIN32OS
  - existing_ref: MIT-000139
    resolution: extend
    measures_changed: false
    applications:
    - target_key: B011-T1082-PARENT
      use:
        paragraphs:
        - zh: 对 IaaS 系统描述读取，按职责复核 Describe 权限、账户与区域范围，并在组织读审计中保留查询身份与参数，以同批准兼容性或主机画像作业比较。把返回的镜像架构、实例类型和平台声明标注为提供方视图，客体内核、实际补丁与物理处理器结论仍需对应来源。
          en: For IaaS system-description reads, review Describe authority and account/Region scope by duty and retain
            identity and request parameters in organization read auditing for comparison with approved compatibility
            or profiling jobs. Label image architecture, instance type, and platform declarations as provider views;
            guest kernels, actual patches, and physical-processor conclusions still require their own sources.
      expected_effect:
        paragraphs:
        - zh: 收敛不必要的实例描述读取机会，并让借用合法管理接口的画像请求可以按主体、区域和作业范围问责。保留读事件可支持请求级调查，即使无法从日志还原完整属性返回。
          en: Reduce unnecessary opportunities to read instance descriptions and make profiling through legitimate management
            interfaces accountable by principal, Region, and job scope. Retained read events support request-level investigation
            even when logs cannot reconstruct complete attribute returns.
      limitations:
        paragraphs:
        - zh: 有些 Describe action 无法逐实例收窄资源权限，合法盘点也可能需要广域读取，必须逐 action 核验 IAM 条件。被盗批准身份、未纳入日志的账户或区域仍有盲区；CloudTrail 事件不提供完整返回画像，提供方声明也可能因最终一致性而滞后。
          en: Some Describe actions cannot be scoped to individual resources, and legitimate inventory may need broad
            reads, requiring action-by-action verification of IAM conditions. Stolen approved identities and uncovered
            accounts or Regions remain gaps. CloudTrail events do not provide complete returned profiles, and provider
            declarations can lag through eventual consistency.
    evidence_keys:
    - REF-000523
    - REF-000524
    - REF-000525
    - B011-T1082-REF-AWS-INSTANCE
  - existing_ref: MIT-000094
    resolution: extend
    measures_changed: false
    applications:
    - target_key: B011-T1082-PARENT
      use:
        paragraphs:
        - zh: 对系统信息发现的 WMI 路径，按职责复核命名空间连接和实例读权限，保留必要的本地诊断，限制无需要的远程来源，并集中启用可归属的查询 operation Trace。把 OS、主板与修补类查询同批准客户端核验；执行方法和
            provider 变更仍作为单独高权限面约束，不能替代读查询授权判断。
          en: For the WMI path of System Information Discovery, review namespace connection and instance-read authority
            by duty, retain necessary local diagnostics, restrict unnecessary remote origins, and centralize attributable
            query-operation tracing. Check OS, baseboard, and patch-class queries against approved clients. Constrain
            execution methods and provider changes as separate privileged surfaces rather than substituting them for
            read-query authorization.
      expected_effect:
        paragraphs:
        - zh: 减少不必要的远程查询机会，并使来自正常管理接口的系统画像可以回溯到原始客户端和职责，补充仅有工具启动的观察。它提升请求问责而不声称隐藏所有系统属性。
          en: Reduce unnecessary remote-query opportunities and make profiling through ordinary management interfaces
            traceable to original clients and duties, supplementing utility-launch observation. It improves request accountability
            without claiming to hide every system attribute.
      limitations:
        paragraphs:
        - zh: 普通用户与合法组件仍可能需要实例读取，过度收紧 namespace 可破坏安装与监控；阻止 ExecMethod 不会自动阻止 ExecQuery。SACL 4662 审核的是命名空间访问而非 provider
            结果，Trace 需要启用与版本验证且不含完整属性值，其他 getter 不受本应用覆盖。
          en: Ordinary users and legitimate components may still need instance reads, and excessive namespace restrictions
            can break installation and monitoring. Blocking ExecMethod does not automatically block ExecQuery. SACL 4662
            audits namespace access rather than provider results, tracing requires enablement and version validation
            without complete attribute values, and other getters remain outside this application.
    - target_key: B011-T1082-CHILD-INPROCESS
      use:
        paragraphs:
        - zh: 对进程内系统属性查询，将 operation Trace 与客户端生存期结合，按查询类、字段、调用主体和客户端职责保留来源链；即使没有新诊断进程也核验具体请求。收敛客户端不需要的 WMI 读与远程能力，保留受控诊断，并把异常请求交给能够保全原始客户端证据的响应流程。
          en: For In-Process System-Attribute Query, join operation tracing to client lifetimes and retain provenance
            by query class, properties, principal, and client duty, verifying particular requests even without a new
            diagnostic process. Reduce unneeded WMI read and remote authority while preserving controlled diagnostics,
            and route anomalous requests to response that preserves original-client evidence.
      expected_effect:
        paragraphs:
        - zh: 查询任务不再因缺少 systeminfo 或 wmic 子进程而失去归属，攻击者直接借用程序内接口的观察优势缩小。允许范围与实际请求的差异可独立保留，不依赖将 WmiPrvSE 的正常身份当作风险豁免。
          en: Inquiry attribution no longer depends on systeminfo or wmic children, reducing the observation advantage
            of direct programmatic interfaces. Differences between allowed scope and actual requests remain independently
            available without treating normal WmiPrvSE identity as a risk exemption.
      limitations:
        paragraphs:
        - zh: 该应用只覆盖 WMI 方式，不禁止普通进程的其他系统 getter。Trace 或生存期不完整会丢失客户端，批准代理被攻陷仍可匹配职责；命名空间审核不证明属性读取成功，结果与稳定性代价须另行评估，无法承诺预防所有进程内画像。
          en: This application covers WMI rather than other system getters in ordinary processes. Incomplete tracing
            or lifetimes can lose client identity, and a compromised approved agent can match expected duties. Namespace
            auditing does not establish successful attribute acquisition. Results and stability costs need separate assessment,
            with no promise to prevent all in-process profiling.
    evidence_keys:
    - REF-001310
    - REF-001309
    - REF-001306
    - B011-T1082-REF-KGB
