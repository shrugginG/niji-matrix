    unsupported_or_deferred:
    - Trusted long-lived management-carrier selection beyond the observed in-process client remains unproven; the formal
      child does not require it.
    - Existing-report reuse lacks a verified malicious T1082 example selected for trace change.
    - Neither actual guest kernel/patch state nor physical hardware is inferred from provider or compatibility-dependent
      declarations.
