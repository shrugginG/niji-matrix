  name:
    zh: 系统信息发现
    en: System Information Discovery
recommendation:
  decision: retain
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 保留 T1082 在已访问环境取得操作系统、体系结构、硬件、构建与修补属性的直接信息对象。联合 Volt Typhoon 公告直接记录 systeminfo 与 wmic baseboard list full，Mandiant
        对 SUNBURST 的原始逆向则记录 CollectSystemDescription 取得 OS version。这些行为为环境测绘提供系统事实，同时借用正常诊断和兼容性检查所需的读取功能，支持保留父级而无需改写为分析环境判断或后继执行门控。
      en: Retain T1082's direct information object of operating-system, architecture, hardware, build, and patch attributes
        within an accessed environment. The joint Volt Typhoon advisory directly records systeminfo and wmic baseboard
        list full, while Mandiant's original SUNBURST analysis records OS-version acquisition by CollectSystemDescription.
        These behaviors supply system facts for discovery while borrowing read functionality needed for diagnostics and
        compatibility checks, supporting parent retention without rewriting it as analysis-environment classification
        or successor-execution gating.
  scope_notes:
    paragraphs:
    - zh: 属性记录、当前实际硬件、完整补丁状态和攻击者依据属性采取的后继行为是不同结论。系统信息工具可能一次返回存储、接口、用户与位置线索，必须按实际直接对象分流。保留父项不意味着每次只读查询都具有匿迹目的，也不意味着任何
        API 调用自动形成正式子项。
      en: An attribute record, current physical hardware, complete patch state, and successor behavior based on attributes
        are different conclusions. A system-information tool may return storage, interface, user, and location clues
        together, requiring separation by the actual direct object. Retention neither gives every read a stealth purpose
        nor makes an API call an automatic formal child.
  evidence_keys:
  - B011-T1082-REF-BASELINE
  - B011-T1082-REF-VOLT-CSA
  - REF-000626
  - B011-T1082-REF-SYSTEMINFO
  - B011-T1082-REF-KGB
proposed_content:
  summary:
    zh: 在已访问环境取得操作系统、硬件、体系结构与修补属性，使用正常诊断与兼容性查询的外观增加恶意主机画像的辨识难度。
    en: Obtain operating-system, hardware, architecture, and patch attributes in an accessed environment, making malicious
      host profiling harder to distinguish through the appearance of ordinary diagnostics and compatibility queries.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 系统信息发现是攻击者在已取得的主机会话、设备管理入口或云管理权限内，读取某个系统的操作系统名称与版本、构建、体系结构、处理器和内存属性、硬件标识或修补记录，以理解当前执行环境的行为。这些事实可用于选择兼容组件、判断后继操作前提和组织主机画像，直接结果是系统属性，尚不是属性所触发的执行、利用或破坏结果。
      en: System Information Discovery reads a system's operating-system name and version, build, architecture, processor
        and memory attributes, hardware identifiers, or patch records through an already obtained host session, device-management
        entry, or cloud-management authority. These facts support compatible-component selection, assessment of follow-on
        prerequisites, and host profiling. The immediate result is a system attribute rather than the execution, exploitation,
        or destructive outcome later triggered by it.
    - zh: 系统属性可以由诊断命令、管理类、程序内接口、已有报告或提供方实例描述返回，但其含义取决于观察位置。操作系统声明的体系结构不是物理处理器鉴定，镜像架构和实例配置也不是客体当前内核与补丁实测。命令启动、静态导入或一段查询字符串只证明请求或能力线索；确认取得具体属性必须有相应返回、输出或可核验的样本行为。
      en: Diagnostic commands, management classes, in-process interfaces, existing reports, or provider instance descriptions
        can expose system attributes, but their meaning depends on the observation point. An operating system's stated
        architecture is not physical-processor attestation, and image architecture or instance configuration is not a
        measurement of the guest's current kernel and patches. A launched command, static import, or query string establishes
        a request or capability clue; confirming acquisition of particular attributes requires corresponding returns,
        output, or verifiable sample behavior.
  stealth_characteristics:
    paragraphs:
    - zh: 系统信息发现与安装、兼容性检查、资产维护和故障诊断共享高频出现的主机画像功能。systeminfo 或硬件管理类的正常请求外观既可支持维修，也可支持攻击者选择载荷；只凭系统工具签名和查询字段，防守方难以区分两种用途。已记录的恶意采用与官方诊断用途支持这种外观重叠，但不证明所有调用者有意规避检测。
      en: System Information Discovery shares frequently used host-profiling functionality with installation, compatibility
        checking, asset maintenance, and troubleshooting. The ordinary appearance of systeminfo or hardware-management
        requests can support either repairs or adversary payload selection, making purpose difficult to distinguish from
        utility signatures and requested fields alone. Documented adversarial use and official diagnostic purposes support
        this overlap without establishing deliberate evasion by every caller.
    - zh: 查询仍可留下命令行、脚本、进程内调用、管理认证或读取既存报告的痕迹，关键差异是这些痕迹能否与发起主体和真实属性结果连接。进程创建不会包含命令输出，Sysmon 的注册表写入事件也不能替代注册表读取证据。版本兼容层、模拟执行、客体虚拟硬件与提供方视图还会限制返回值的解释；低噪声或正常外观并不提高所获属性的真实性。
      en: Queries can still leave command-line, script, in-process invocation, management-authentication, or existing-report
        access traces. The important distinction is whether those traces connect the initiating principal to actual attribute
        results. Process creation does not include command output, and Sysmon Registry-write events do not substitute
        for Registry-read evidence. Version compatibility layers, emulation, virtual guest hardware, and provider views
        further constrain interpretation; low noise or ordinary appearance does not make acquired attributes more truthful.
    - zh: 进程内系统属性查询进一步把本次画像与新诊断工具创建分离。KGB RAT 的仪器化执行提供具体 WMI 请求、既有客户端与画像消息的关联，说明只看 systeminfo 或 wmic 启动会缺少查询入口；WMI 客户端、provider
        与操作痕迹仍存在，原始作者也实际观察到了它。此差异不等于程序无痕或无法检测。
      en: In-process system-attribute queries further separate an inquiry from creation of a new diagnostic utility.
        Instrumented KGB RAT execution connects particular WMI requests, an existing client, and a profile message, showing
        why systeminfo- or wmic-launch-only monitoring lacks its expected entry. WMI clients, providers, and operation
        traces remain, and the original researchers observed the behavior. This difference does not make the program
        traceless or undetectable.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入直接取得本机或被管理系统的操作系统、构建、处理器、内存、固件与修补属性，包括客体内读取和带认证的提供方系统描述。对于一份综合报告，只按有证据的字段确认相应信息对象；Win32_OperatingSystem.OSArchitecture
        表示操作系统架构，Win32_QuickFixEngineering 仅返回其文档限定的 CBS 更新，均不能升级为完整硬件或补丁证明。仅有调用时记录为发现尝试，空返回和失败状态保持独立。
      en: Include direct acquisition of operating-system, build, processor, memory, firmware, and patch attributes for
        a local or managed system, including guest reads and authenticated provider system descriptions. Confirm information
        objects in a composite report only for evidenced fields. Win32_OperatingSystem.OSArchitecture describes operating-system
        architecture, while Win32_QuickFixEngineering returns only its documented CBS update subset; neither becomes
        complete hardware or patch attestation. An invocation alone remains a discovery attempt, with empty returns and
        failures preserved separately.
    - zh: 驱动器、磁盘与卷属性归 NJT-0232，软件清单归 T1518，当前进程归 NJT-0240，接口配置和连接关系分别归 T1016 与 T1049，当前用户归 T1033。把属性用于地理推断归 T1614，把属性组合用于识别分析环境或控制后继执行分别需要
        NJT-0122、NJT-0109 的额外证据；读取同一注册表值不应因介质重复建项。云资源存在性和资源图由 NJT-0139 处理，系统描述中的 OS、镜像与架构属性可另有本技术事实。安装兼容性、支持工单、健康检查和批准盘点是正常反例，须凭使用上下文判断意图。
      en: Drive, disk, and volume attributes belong to NJT-0232; software inventories to T1518; current processes to
        NJT-0240; interface configuration and connection relationships to T1016 and T1049; and the current user to T1033.
        Geographic inference belongs to T1614. Analysis-environment classification or successor-execution control based
        on attributes requires the additional evidence of NJT-0122 or NJT-0109 respectively. Reading the same Registry
        value does not justify another object by medium. NJT-0139 owns cloud-resource existence and resource graphs,
        while OS, image, and architecture attributes in a system description can independently establish this technique.
        Installation compatibility checks, support tickets, health checks, and approved inventories remain normal counterexamples
        requiring contextual interpretation.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 获得端点执行或远程管理权限后，攻击者可在投入平台特定组件前确认 OS 与体系结构，在准备利用时检查构建与有限修补记录，或将基本硬件和主机属性加入控制端画像。联合公告记录的 systeminfo 与主板查询提供真实活动锚点；SUNBURST
          的 OS version 画像功能提供样本能力锚点，不能据此补出每台受害主机的返回值或调用时刻。
        en: After endpoint execution or remote-management access, an adversary can check OS and architecture before deploying
          a platform-specific component, examine builds and limited patch records when preparing exploitation, or add
          hardware and host attributes to a controller's profile. The joint advisory's systeminfo and baseboard queries
          anchor real activity. SUNBURST's OS-version profiling anchors sample capability without supplying per-victim
          results or invocation times.
      - zh: 云管理身份也可读取实例或虚拟机描述，从提供方声明的镜像与配置推断组件适配条件；设备和虚拟化主机的版本诊断入口有类似用途。此类管理面查询不要求客体内运行新命令，却需要相应读权限，并可能保留管理读事件。一个平台的案例不为其他平台提供同等实案强度，后继攻击是否发生仍需分别核验。
        en: A cloud-management identity can also read instance or virtual-machine descriptions and use provider-declared
          images and configuration to infer component compatibility. Version-diagnostic entries on appliances and hypervisor
          hosts serve related purposes. Such management-plane queries need not run a new guest command, but require corresponding
          read authority and can leave management-read events. One platform's case does not give other platforms equal
          incident support, and follow-on attacks require separate verification.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要能执行查询并取得结果的进程、会话或管理身份。基本版本与体系结构接口可能由普通进程调用，不默认要求管理员；远程系统查询、设备 CLI 和云描述接口则受到目标认证、管理角色与服务状态限制。攻击者可选择查询入口和属性范围，但不能假设可控制系统返回值、读取全部固件或绕过提供方权限。
          en: The attacker needs a process, session, or management identity able to query and obtain results. Basic version
            and architecture interfaces may be available to ordinary processes, so administrator access is not assumed.
            Remote queries, device CLIs, and cloud-description interfaces remain constrained by target authentication,
            management roles, and service state. The attacker may select an entry and attribute scope without automatically
            controlling returned values, reading all firmware, or bypassing provider permissions.
        - zh: 可用知识受调用者视图和时效限制。GetVersionEx 的结果可依赖应用 manifest 或兼容模式，GetNativeSystemInfo 在非 Intel64/x64 系统上的模拟环境有专门返回语义，Linux
            UTS 命名空间仅隔离主机名和 NIS 域名而不能被笼统理解为独立客体 OS。攻击者如依赖已有报告或提供方描述，还必须接受过期、缺字段、分页、错误与最终一致性带来的不确定性。
          en: Available knowledge is constrained by caller view and freshness. GetVersionEx can depend on application
            manifests or compatibility mode. GetNativeSystemInfo has specific emulation semantics on systems outside
            Intel64/x64. Linux UTS namespaces isolate only hostname and NIS domain name and cannot be treated generically
            as independent guest operating systems. Existing reports and provider descriptions further introduce stale
            data, missing fields, pagination, errors, and eventual consistency.
      defender_model:
        paragraphs:
        - zh: 防守方可拥有经配置的 Sysmon 进程创建、PowerShell 脚本块、Linux 系统调用审计以及设备或云管理日志，并维护资产职责、身份映射与批准盘点台账。这些观测面可识别谁在何时请求哪些属性，但通常不能恢复返回缓冲区和完整属性集。Windows
            程序内查询、未开启审计的路径以及被盗批准身份均会限制基于工具和作业外观的判断。
          en: The defender may have configured Sysmon process creation, PowerShell script blocks, Linux syscall auditing,
            and appliance or cloud-management logs, together with asset roles, identity mappings, and approved-inventory
            registers. These views can identify who requested which attributes and when, but usually cannot reconstruct
            return buffers or complete attribute sets. Windows in-process queries, unaudited paths, and stolen approved
            identities constrain decisions based on utility and job appearance.
        - zh: 可靠关联需要在事件时间解析设备和主体，在进程生存期内连接 PID、GUID 与会话，保留采集配置和丢失状态。只读管理事件不含完整返回属性，成功 uname 调用也不公开其缓冲区内容；只有额外部署且经验证的结果采集能确认具体字符串和字段。未知、失败与空结果应显式保留，不能用当前资产库值追填攻击时刻的返回值。
          en: Reliable correlation resolves devices and principals at event time, joins PID, GUID, and session within
            process lifetimes, and retains collection configuration and loss state. Read-management events do not contain
            full returned attributes, and a successful uname call does not expose its buffer. Only separately deployed
            and validated result collection can confirm particular strings and fields. Preserve unknown, failed, and
            empty outcomes rather than backfilling attack-time returns from current inventory values.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用正常主机诊断与兼容性读取的请求外观掩护系统画像
      en: Borrow ordinary host-diagnostic and compatibility-read appearance for system profiling
    analysis:
      paragraphs:
      - zh: 攻击者使用系统自带诊断入口取得 OS、主板或构建属性，使请求在工具身份、只读语义和字段选择上接近正常主机维护。联合公告直接列出恶意 systeminfo 与主板查询，官方文档解释这些功能的正常用途，二者支持恶意画像与维护请求难以仅凭局部外观区分。防守方需要把实际操作者、运行来源与批准任务连接起来才能改善判断，而不是把签名诊断程序整体视为可信。证据没有给出该查询专属的检测率、明确规避参数或对照实验，因此这一机理保持中等置信。
        en: An adversary obtains OS, baseboard, or build attributes through system diagnostic entries, bringing tool
          identity, read semantics, and selected fields close to ordinary host maintenance. The joint advisory directly
          lists malicious systeminfo and baseboard queries, while official documentation explains legitimate diagnostic
          functions. Together they support difficulty distinguishing hostile profiling from maintenance through local
          appearance alone. Improving that distinction requires joining the actual operator and execution origin to approved
          work rather than trusting a signed diagnostic program wholesale. The evidence provides no query-specific detection
          rate, explicit evasion parameters, or controlled comparison, so this mechanism remains medium-confidence.
    evidence_keys:
    - B011-T1082-REF-VOLT-CSA
    - B011-T1082-REF-SYSTEMINFO
    - B011-T1082-REF-WIN32OS
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 省去本次系统画像的独立诊断工具创建边界
      en: Remove the separate diagnostic-tool creation boundary for a system-profile inquiry
    analysis:
      paragraphs:
      - zh: 攻击者将特定 OS 或硬件请求放入已经执行的客户端代码，使仅以新诊断进程为入口的检测缺少对应任务事件。KGB RAT 的仪器化 WMI 查询与画像记录提供正面实现证据，官方 Trace 则说明可以在更细的请求和客户端观察面恢复归属。这只支持独立工具边界被省去，既不消除
          WMI provider 或服务痕迹，也不证明任何产品普遍漏报；样本观察不能替代跨环境测量，因此保持中等置信。
        en: The adversary places a particular OS or hardware request inside executing client code, depriving detection
          keyed only to a new diagnostic process of its expected task event. Instrumented KGB RAT WMI queries and profiling
          provide positive implementation evidence, while official tracing explains recovery through finer-grained request
          and client observation. This supports removal of a separate-utility boundary without removing WMI provider/service
          traces or establishing universal misses. Sample observation does not replace cross-environment measurement,
          so confidence remains medium.
    evidence_keys:
    - B011-T1082-REF-KGB
    - REF-001309
    - REF-000230
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    subtechnique_keys:
    - B011-T1082-CHILD-INPROCESS
    narrative:
      paragraphs:
      - zh: 本技术建立进程内系统属性查询一项子技术，按本次属性请求相对于独立诊断执行器的承载位置划分。它要求具体查询与既有客户端的正面关联；查询客户端内联不意味着 WMI provider 与服务也在同进程。普通外部工具查询仍由父级覆盖，多种属性和接口可以同时存在而不改变这一变量。
        en: The technique establishes In-Process System-Attribute Query, partitioned by where a particular attribute
          request is carried relative to a separate diagnostic executor. It requires positive association of the inquiry
          with an existing client. An inline query client does not put WMI providers and services in the same process.
          Ordinary external-utility queries remain in the parent, and multiple attributes or interfaces can coexist without
          changing the variable.
      - zh: API、操作系统、硬件厂商和版本字段本身不作为子项；仅有静态导入或缺少新工具日志也不能满足边界。地域推断、分析环境识别、执行门控与其他直接信息对象由各自技术负责，不能把同一综合画像拆成按字段命名的匿迹分类。
        en: APIs, operating systems, hardware vendors, and version fields do not define children. Static imports or missing
          utility logs do not meet the boundary. Geographic inference, analysis-environment classification, execution
          gating, and other direct information objects retain their own owners rather than turning one composite profile
          into field-named stealth categories.
