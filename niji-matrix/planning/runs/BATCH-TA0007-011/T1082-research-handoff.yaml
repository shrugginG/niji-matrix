    observables:
    - zh: 不承担系统画像职责的执行文件或会话发起 uname，且核验后不在批准范围。
      en: An executable or session without profiling duties invokes uname outside a verified approved scope.
    - zh: 原始系统调用记录明确返回成功，但实际属性内容仍未知。
      en: A raw syscall record explicitly reports success while actual attribute content remains unknown.
    correlation:
      window:
        zh: 五分钟组合初始调用，身份和作业按事件时刻生效，进程关联受生存期与重启边界限制；此窗口未作性能验证。
        en: Five minutes for initial call grouping, with event-time identity and job validity and process joins constrained
          by lifetime and boot boundaries. The window has no performance validation.
      dimensions:
      - host_id
      - audit_event_id
      - audit_session_id
      - principal_id
      - process_key
      - boot_id
      - executable
      - query_scope
      - event_time
      - policy_version
    false_positives:
    - zh: libc 初始化、兼容性库、编译器、软件安装与诊断代理经常合法调用 uname，即使没有命令行工具。
      en: libc initialization, compatibility libraries, compilers, installers, and diagnostic agents frequently call
        uname legitimately without a command-line utility.
    blind_spots:
    - zh: 规则未生效、兼容 ABI 漏采、Audit 丢失或被关闭、主机 PID 与容器 PID 未对齐会破坏判断；读取 /proc 或已有文件不在此分析内，uname 也不返回完整修补记录。
      en: Ineffective rules, uncovered compatibility ABIs, Audit loss or disabling, and unaligned host/container PIDs
        break interpretation. /proc or existing-file reads are outside this analytic, and uname does not return a complete
        patch record.
    tuning_guidance:
      paragraphs:
      - zh: 先用已知成功与失败调用验证 syscall 名称、exit 与 success 的规范化，再按应用职责而非 uname 二进制名称建立基线。采集进程生存期的产品和命名空间映射必须由部署方实际验证；缺少时只保留自足调用，不把
          PPID 自动解释为可信父链。控制审计成本并持续检查 lost/backlog，避免为压低事件量而豁免所有已签名或常驻应用。
        en: Validate syscall naming and normalization of exit and success with known successful and failed calls before
          baselining by application duty rather than the uname binary name. Deployers must validate their actual process-lifecycle
          product and namespace mapping. Without those, retain self-contained calls and do not turn PPID automatically
          into trusted ancestry. Control audit cost and monitor lost/backlog without reducing volume by exempting every
          signed or resident application.
    evidence_keys:
    - B011-T1082-REF-UNAME
    - B011-T1082-REF-UTS
    - REF-000840
    - REF-001042
    native_field_mapping:
      native_node: Audit node when configured, otherwise collector enrollment source identity with explicit unresolved
        state
      event_time: audit(seconds.milliseconds:serial) timestamp
      audit_event_id: audit serial scoped to host boot and event time
      arch: SYSCALL arch interpreted against deployed ABI map
      syscall: SYSCALL syscall resolved against arch
      success: SYSCALL success
      exit_code: SYSCALL exit
      process_id: SYSCALL pid
      parent_process_id: SYSCALL ppid
      audit_login_uid: SYSCALL auid
      effective_uid: SYSCALL euid
      audit_session_id: SYSCALL ses
      executable: SYSCALL exe
      audit_rule_key: SYSCALL key
      real_uid: SYSCALL uid
    deployment_contract_notes:
    - The lifecycle collector is an explicit product-independent deployment contract that must be validated before process_key
      ancestry joins; Linux Audit alone is not claimed to supply process start/end or PID-namespace identity.
    - Linux Audit records return status rather than uname output. No optional output source is consumed.
    - uname may be generated through libc or direct syscall. No distinction between these forms is inferred from syscall
      audit alone.
    proposed_resolution: create
  - temporary_key: B011-T1082-NJA-WMI-INPROCESS
    strategy_key: B011-T1082-DET-INPROCESS
    name:
      zh: WMI 系统属性查询客户端谱系分析
      en: WMI System-Attribute Query Client-Lineage Analytic
    summary:
      zh: 将明确的 OS 与硬件类查询归属到实际客户端并核对批准职责，不从 provider 或错误事件推断返回。
      en: Attribute explicit OS and hardware-class queries to actual clients and verify approved duties without inferring
        returns from providers or errors.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在目标版本验证并开启 Microsoft-Windows-WMI-Activity/Trace，保留包含 ExecQuery 文本、ClientMachine、ClientProcessId、User、GroupOperationId
          与 OperationId 的实际事件。解析 WQL 的 FROM 类与属性集合，将 Win32_OperatingSystem、Win32_BaseBoard、Win32_Processor 和 Win32_QuickFixEngineering
          的实例读取标为系统属性请求；类架构查询、ExecMethod、事件订阅与 Win32_Process 等其他直接对象分别分流。只消费错误5858或加载5857的环境不满足此合同，WMI provider HostId
          不能代替原始 client PID。
        en: Validate and enable Microsoft-Windows-WMI-Activity/Trace on the target version, retaining actual events containing
          ExecQuery text, ClientMachine, ClientProcessId, User, GroupOperationId, and OperationId. Parse WQL FROM classes
          and selected properties, labeling instance reads of Win32_OperatingSystem, Win32_BaseBoard, Win32_Processor,
          and Win32_QuickFixEngineering as system-attribute requests. Route class-schema requests, ExecMethod, event
          subscriptions, and other direct objects such as Win32_Process separately. An environment consuming only error
          5858 or load 5857 records does not meet the contract, and a WMI provider HostId cannot substitute for the original
          client PID.
      - zh: 按事件时间把 client_machine 映射为 client_host_id，再用同机进程生存期将 client_process_id 唯一连接到 client_process_guid；进程创建早于查询、且查询在结束前的事实仅说明客户端归属，不单独证明本子项的恶意承载选择。以
          host、group_operation_id、operation_id 合并同次请求与 provider 事件，不跨重启或把操作ID当全域唯一。远程客户端映射或生存期缺失时保留 client_unresolved，不能错误关联到目标上同PID进程。
        en: Resolve client_machine to client_host_id at event time, then uniquely join client_process_id to client_process_guid
          using same-host process lifetimes. Creation before a query and a query before termination establish client
          attribution only, not independently the child's adversarial carrier choice. Join request and provider events
          by host, group_operation_id, and operation_id without crossing boots or treating operation IDs as globally
          unique. Missing remote-client mapping or lifetime yields client_unresolved rather than a join to an unrelated
          same-PID target process.
      - zh: 与台账中的 namespace、query_class、selected_properties、客户端映像、主体、主机和批准时间核对，输出 attributed_profile_query、outside_approved_profile
          或 context_unknown，并附可核验的请求定位。每次查询都保留原始 WQL 与解析状态，合法通用监控不能按产品名整体豁免。本分析不消费返回缓冲区、网络画像或自定义 API hook；即使 Trace 有成功状态，也不能提升为取得具体属性、非空结果或完整枚举。ExecQuery
          成功可以产生空枚举器，枚举器状态和实际对象需另外采集后才能形成结果级分析。
        en: Check namespace, query_class, selected_properties, client image, principal, host, and approved time against
          the register, emitting attributed_profile_query, outside_approved_profile, or context_unknown with verifiable
          request locations. Preserve raw WQL and parser state for each request rather than exempting legitimate generic
          monitors by product name. The analytic consumes no return buffers, network profiles, or custom API hooks. Even
          a trace success state does not establish particular attributes, nonempty results, or complete enumeration.
          Successful ExecQuery can produce an empty enumerator; enumerator state and actual objects require separately
          declared collection before result-level analysis.
    data_requirements:
    - source_type: windows-wmi-query-trace
      name:
        zh: 已验证的 WMI 查询 Trace
        en: Validated WMI query trace
      channel: Microsoft-Windows-WMI-Activity/Trace, version-verified query start/provider events
      required_fields:
      - native_target_host
      - event_time
      - client_machine
      - client_process_id
      - native_principal
      - namespace
      - query_text
      - operation
      - group_operation_id
      - operation_id
      - provider_name
      - provider_host_id
      - parser_state
      - client_process_creation_time
    - source_type: windows-client-process-lifetime-map
      name:
        zh: 查询客户端的进程生存期
        en: Query-client process lifetimes
      channel: Sysmon Event 1/5 joined on the client host
      required_fields:
      - client_host_id
      - process_id
      - process_guid
      - image
      - parent_process_guid
      - native_principal
      - process_start_time
      - process_end_time
      - mapping_completeness
    - source_type: event-time-wmi-identity-map
      name:
        zh: WMI 事件时间设备与主体映射
        en: WMI event-time device and principal map
      channel: Deployment-maintained device enrollment and directory map
      required_fields:
      - native_host_name
      - host_id
      - native_principal
      - principal_id
      - valid_from
