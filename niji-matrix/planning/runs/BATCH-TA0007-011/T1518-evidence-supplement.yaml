implementation_sources:
- reference_ref: REF-001306
  url: https://learn.microsoft.com/en-us/windows/win32/api/wbemcli/nf-wbemcli-iwbemservices-execquery
  rechecked: Browser original method documentation
  supported_facts:
  - ExecQuery supplies an enumerator and can yield a zero-instance result set without an error.
  - PROTOTYPE can return a prototype without executing the query, so an imported interface or prototype request is not an
    acquired software fact.
  retained_limit: Capability semantics do not establish KGB's exact native-call sequence or default result telemetry.
- reference_ref: REF-001307
  url: https://learn.microsoft.com/en-us/windows/win32/api/wbemcli/nf-wbemcli-ienumwbemclassobject-next
  rechecked: Browser original method documentation
  supported_facts:
  - Returned-object count and enumeration status jointly bound actual objects; an end status can coexist with returned objects
    and timeout is not proof of absence.
  retained_limit: No result branch or enumeration buffers are added to the proposed production analytic.
- reference_ref: REF-001309
  resolution: Reuse the previously inspected exact WMI client/query Trace source and existing local evidence/T1518/wmi-trace.html.
  supported_scope: Original-client identity and request semantics remain separate from provider identity and returned products.
- reference_ref: REF-001310
  resolution: Reuse the previously verified namespace access and auditing source.
  supported_scope: Query permission, remote access, and namespace authorization remain distinct from provider success and
    results.
- reference_ref: REF-000230
  resolution: Reuse the previously inspected exact Sysmon source and existing local evidence/T1518/sysmon.html.
  supported_scope: Process lifetime can attribute request events; process creation and termination do not capture arbitrary
    software inventory contents.
child_admission_reassessment:
  former_resolution: Evidence-deferred in-process software inquiry because the original source set lacked a positive software-specific
    client/task contrast
  new_resolution: Admit one native child after primary convergence
  child_key: B011-T1518-CHILD-INPROCESS
  name:
    zh: 进程内软件清单查询
    en: In-Process Software-Inventory Query
  controlled_variable: Carriage of this software-inquiry task inside already executing client code instead of a separately
    launched inventory executor
  positive_information_object: AntiVirusProduct software inquiry
  positive_carrier: The original authors attribute the runtime query to the malware's own programmatic client code
  trace_change: No separate query-utility command or process entry for this inquiry
  defender_difference: A utility-creation entry disappears while client-level query semantics and attribution remain available
    through appropriate instrumentation
  prerequisites: Existing executable client code and applicable read authority; no signature, trust, injection, or residence-duration
    requirement
  normal_counterexamples: Software managers, compatibility libraries, and support clients can issue identical requests; behavior
    alone is not malicious intent
  separation_from_neighbors:
  - Running-process inquiries from the same client remain owned by NJT-0240.
  - OS and hardware requests remain T1082 even when co-occurring in the shared experiment.
  - Generic Registry reading remains distinct from direct software inventories and from this software-query carrier variable.
  - Analysis-environment gating, execution conditions, and effective defense modification are not inferred from software product
    reads.
  admitted_mechanism: NM-BT
  mechanism_confidence: medium
  mechanism_effect_not_claimed:
  - No universal invisibility or demonstrated FUD status
  - No measured alert reduction or guaranteed miss by a named product
  - No disappearance of the original client, WMI provider, or all child processes created for unrelated work
  scope_not_expanded_by_category: ATT&CK security and backup product partitions remain parent-core research metadata rather
    than copied children
