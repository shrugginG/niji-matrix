  facts:
  - Runtime query list includes AntiVirusProduct, making the new evidence specific to this software information object rather
    than borrowed OS-query evidence.
  - The original authors explicitly attribute the listed queries to programmatic code inside the malicious client and contrast
    the absence of a separate inquiry command or child process with creation-only monitoring.
  - The beacon image contains a repeated Windows Defender name string, supplying reported-product evidence in the same experiment
    without decoding an unprovided product-state schema.
  retained_limits:
  - Figure 10 alone provides query strings rather than full returned objects, namespace visibility, or an isolated event timestamp.
  - The authors' client-attribution and trace contrast are original research observations, not a controlled replay performed
    by this researcher.
  - Figure 17 supplies a reported product string. Repetitions do not prove multiple products or distinct successful property
    reads.
  - Neither image establishes that the product was running, enabled, disabled, healthy, bypassed, or complete inventory was
    returned.
  - Other process, OS, geographic, delay, and marketing statements in the report are not software-child result evidence.
  - The source's broad description of all AV/EDR inventory is not generalized into a guarantee for every provider or Windows
    Server deployment.
