  approved_register:
    origin: Explicit independent owner-maintained deployment contract, not Windows or EDR default data
    required_fields: [work_id, owner, host_key, user_name, image_path, query_scope, target_scope, valid_from, valid_until]
    missing_behavior: Authorization unknown; retain request without automatic maliciousness or allowlisting
  alias_map:
    origin: Verified directory or asset-management mapping with owner and validity, only if alias conversion is enabled
    required_fields: [observed_host, canonical_host_key, observed_user, canonical_user_name, valid_from, valid_until, owner]
    missing_behavior: Do not merge aliases or same-name local principals; leave client unresolved when needed
  lifecycle:
    origin: Configured Sysmon Events 1 and 5
    missing_behavior: Missing end remains null with incomplete identity; do not join remote client PID to observer-local process
