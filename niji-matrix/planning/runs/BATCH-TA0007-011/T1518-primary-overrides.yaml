content_edits:
- pointer: /proposed_content/subtechnique_taxonomy/narrative/paragraphs/0
  value:
    zh: 软件产品类别、安装与健康状态、查询介质及工具可以改变信息内容和实现条件，但不独立构成稳定的匿迹分类。软件发现保留这些语义差异，以免把登记误解为正在运行或有效防护；这些差异本身不足以形成边界稳定且具有独立防守观察价值的子技术。
    en: Product categories, installation and health states, query carriers, and tools change information content and implementation
      conditions without independently forming stable evasion classes. Software Discovery preserves these semantic differences
      to avoid confusing registration with execution or effective protection; these differences alone do not establish stable
      child boundaries and independent defensive observation value.
