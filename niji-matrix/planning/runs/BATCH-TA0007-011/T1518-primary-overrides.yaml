- pointer: /library_candidates/cases/0/description_zh
  value: ESET 在 LunarWeb 入侵研究中记录了软件与安全产品调查及恢复的命令包。本案例仅保留软件信息请求这一中心事实，不从同一出版物的外传行为推断查询结果，也不宣称每台服务器都有可用 SecurityCenter2 提供方、具体返回产品或成功规避告警。报告总体受害行业没有逐查询对应关系，因此不绑定本次请求的行业或日期；Turla
    归因保持来源给出的中等置信度。
- pointer: /library_candidates/cases/0/description_en
  value: ESET records software and security-product inquiries and a recovered command package in its LunarWeb intrusion research.
    This case retains software-information requests as its central fact without deriving query results from exfiltration in
    the same publication, a working SecurityCenter2 provider on every server, particular returned products, or successful
    alert evasion. Aggregate victim sectors are not mapped to individual inquiries, so this request has no assigned sector
    or date; Turla attribution remains the source's medium-confidence assessment.
