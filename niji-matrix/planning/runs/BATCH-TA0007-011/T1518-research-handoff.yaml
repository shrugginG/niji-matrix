recommendation:
  decision: retain
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: 保留 T1518 对软件存在性、版本和配置的直接调查范围，包括安全软件与备份软件。ESET 的 LunarWeb 分析记录安装程序及安全产品调查，Mandiant 的 FIN12 报告另记录对安全和备份软件的收集；这些是恶意采用父行为的独立一手依据。合法软件资产管理使用相同库存接口，故查询目的和授权语境是区分恶意调查的必要条件，不能因为工具正常就排除本候选。
        en: Retain T1518's direct survey of software presence, versions, and configuration, including security and backup software. ESET's LunarWeb analysis records installed-program and security-product inquiries, while Mandiant's FIN12 report independently records collection of security and backup software. These are independent primary observations of malicious use of the parent behavior. Legitimate software asset management uses the same inventory interfaces, making purpose and authorization context necessary to distinguish malicious surveying; an ordinary utility does not justify excluding the candidate.
      - zh: 本次不把任一软件发现实现自动判为匿迹。正式机理仅讨论借用资产盘点接口所形成的可见行为相似性，置信度保持中等；没有公开检测率对照。父项保留软件事实而不重写为分析环境判断、执行护栏或防御削弱，也不导入 ATT&CK 的产品类别子项。
        en: No software-discovery implementation is automatically treated as evasive. The proposed mechanism concerns visible similarity produced by borrowing inventory interfaces and remains medium-confidence without a published detection-rate comparison. The parent preserves software facts rather than becoming analysis-environment classification, execution guardrails, or defense impairment, and imports no ATT&CK product-category children.
  scope_notes:
    paragraphs:
      - zh: 安装登记、产品版本、运行实例、防护健康和配置有效性是不同事实。一次查询、一个已打开键或一个命令成功退出都不证明软件正在运行或防护已经关闭。对软件清单的定向 Registry 读取归本信息对象；通用 Registry 探索由 NJT-0241 负责，同一读取不重复陈述为两个独立成果。
        en: Installation registration, product version, running instances, protection health, and effective configuration are different facts. A request, an opened key, or a successful process exit does not establish running software or disabled protection. A Registry read specifically directed at inventory belongs to this information object; general Registry exploration belongs to NJT-0241, without restating one read as two independent outcomes.
  evidence_keys: [B011-T1518-REF-ATTACK, REF-000639, B011-T1518-REF-FIN12, B011-T1518-REF-INVENTORY]
proposed_content:
  name: {zh: 软件发现, en: Software Discovery}
  summary:
    zh: 调查已访问系统或管理环境中的软件存在性、版本与配置，为后继行动取得环境事实，并可能借用正常资产盘点的接口与外观降低调查目的的可区分性。
    en: Survey software presence, versions, and configuration in an accessed system or management environment to inform later actions, potentially borrowing ordinary inventory interfaces and appearance to reduce the distinguishability of the inquiry's purpose.
  aliases: []
  definition_and_concept:
    paragraphs:
      - zh: 软件发现是攻击者在取得主机或相应管理接口访问后，询问或读取已安装、已登记或可用软件及其版本、产品身份和可得配置的环境测绘行为。直接成果是关于软件部署的事实或待验证线索，供其选择后继调查、兼容实现或攻击路径；取得这些线索不赋予安装、卸载、停用或利用软件的能力。
        en: Software Discovery is environmental mapping in which an adversary with host or relevant management-interface access queries or reads installed, registered, or available software, including versions, product identities, and accessible configuration. Its direct result is a deployment fact or a lead requiring validation, used to select later inquiries, compatible implementations, or attack paths. Obtaining a lead grants no capability to install, uninstall, disable, or exploit software.
      - zh: Windows 的卸载登记、MSI 库存和安全产品提供方视图都是可能的取得路径，但各自报告不同覆盖范围。安装登记不等同于当前执行，版本字符串不证明组件完整或可利用，安全产品名称不证明实时保护正在生效。分类依据是实际调查的软件信息对象，而非某个命令、产品名称、文件扩展名或后继攻击目的。
        en: Windows uninstall registration, MSI inventory, and security-product provider views are possible acquisition paths with different coverage. Registration does not establish current execution, a version string does not establish component integrity or exploitability, and a security-product name does not establish effective real-time protection. Classification follows the software information actually surveyed rather than a command, product name, extension, or later attack objective.
  stealth_characteristics:
    paragraphs:
      - zh: 软件发现借用与补丁评估、许可核查、兼容性检查和支持工作相同的软件清单查询。恶意操作者可以选择已有的管理命令或脚本接口，使目标侧看到的程序、查询类和字段接近日常资产盘点；仅按合法签名、系统路径或一次读取放行，会保留活动却丢失其调查意图。命令参数、原始调用者、请求范围及对应工作授权仍可提供区分依据。
        en: Software Discovery borrows inventory queries also needed for patch assessment, licensing, compatibility, and support. An adversarial operator can choose existing administrative commands or script interfaces so that visible programs, query classes, and fields resemble routine asset inventory. Allowing activity solely because of a legitimate signature, system path, or read operation preserves events while losing investigative intent. Arguments, the original caller, request scope, and corresponding work authorization remain distinguishing context.
      - zh: 不同接口会留下不同残余，不能将软件发现统一描述为无副作用或不留痕。Win32_Product 查询可能触发 MSI 一致性检查和修复，并产生安装程序事件；读取卸载登记则可能漏掉便携程序、其他用户或另一位数视图中的软件。较少返回列、只查安全产品或在进程中直接调用接口，都不单独证明攻击者有意降低可观察性，更不能由未出现命令进程推断查询未发生。
        en: Interfaces leave different residue, so software discovery cannot be described uniformly as side-effect-free or traceless. Win32_Product queries can trigger MSI consistency checks and repair, with installer events, while uninstall-registration reads can miss portable applications, other users, or another registry view. Fewer returned columns, security-product targeting, or an in-process interface call does not independently establish deliberate reduction of observability, and absence of a command process does not establish absence of an inquiry.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入直接获取软件部署、产品身份、版本和可得配置的清单或定向查询，包括软件资产登记、安全产品与备份产品的相关信息。判断返回值时保留系统、用户或租户范围、接口、时间、权限与结果完整性；历史登记和失败请求均不能升级为当前有效安装。健康接口的汇总状态也不能替代每个产品的工作状态。
        en: Include inventory and targeted inquiries that directly acquire deployment, product identity, version, or available configuration, including software registration and security- or backup-product information. Interpret returns with their system, user or tenant scope, interface, time, permissions, and completeness; historical registration and failed requests do not establish a current effective installation. Aggregate health from a health interface does not substitute for each product's operating state.
      - zh: 只查询运行实例归 NJT-0240 进程发现，驱动包或加载驱动归 NJT-0180，服务注册和服务状态归系统服务发现。只有把这些线索明确解析为软件产品事实时，才具有本技术的信息成果。单纯读取目录或 Registry 任意键不能自动证明软件清单；针对卸载登记的读取以软件信息对象为准，与 NJT-0241 的通用 Registry 探索区分。
        en: Running-instance inquiries belong to NJT-0240 Process Discovery, driver packages or loaded drivers to NJT-0180, and service registration or state to System Service Discovery. They yield this technique's information only when explicitly resolved into software-product facts. An arbitrary directory or Registry read does not establish an inventory. Reads aimed at uninstall registration follow the software information object and remain distinct from NJT-0241's general Registry exploration.
      - zh: 根据软件线索认定分析环境并改变载荷行为归 NJT-0122，调试器专门判断归 NJT-0106，目标条件匹配或环境密钥派生归 NJT-0109。停止安全组件、修改排除项、删除备份或利用已发现版本均须另证相应后继动作。正常部署代理、取证、安全巡检和支持脚本是强反例，产品类别和常见工具本身不构成匿迹子技术。
        en: Software-based analysis-environment classification followed by changed payload behavior belongs to NJT-0122, dedicated debugger checks to NJT-0106, and target-condition matching or environmental key derivation to NJT-0109. Stopping security components, changing exclusions, deleting backups, or exploiting a discovered version each requires evidence of the corresponding later action. Deployment agents, forensics, security checks, and support scripts are strong benign counterexamples; product categories and common utilities do not constitute evasion children.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 在获得服务器或用户终端的初始访问后，操作者可了解业务组件、远程管理软件及安全产品，再决定是否进行更深入的版本核验或选择其他行动。LunarWeb 研究中的软件与安全产品调查说明此类事实能进入恶意主机画像，但来源未公开每条返回记录，也未证明某次后继操作由哪一产品结果决定。
          en: After initial access to a server or user endpoint, an operator may identify business components, remote-management software, and security products before choosing deeper version validation or another action. Software and security-product inquiries in the LunarWeb research show such facts entering adversarial host profiling, but the report does not disclose each returned record or establish which product result determined a later action.
        - zh: 在勒索活动的横向调查阶段，安全和备份软件的清单可能帮助操作者理解保护与恢复条件。FIN12 使用的 Get-DataInfo.ps1 被记录收集这两类软件并归档结果；它支持父级软件发现，不能据此推断已获得备份管理权限、成功停用防护或使用某种独立的匿迹查询模式。
          en: During lateral surveying in ransomware operations, security and backup inventories may help operators understand protection and recovery conditions. FIN12's Get-DataInfo.ps1 is documented collecting both categories and archiving the results. This supports the parent behavior without establishing backup-management authority, successful defense disablement, or a distinct evasive inquiry mode.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者需要执行查询命令或代码、读取相应登记或连接获准的管理接口，并能消费实际返回。普通账户通常可读部分本地软件元数据，但远程 WMI、其他用户的配置和受保护产品状态受身份、命名空间、版本和部署方式约束。没有权限、提供方缺失或空返回应保持未知，不推断无安全产品。
            en: The adversary needs to execute inquiry commands or code, read relevant registration, or connect to an authorized management interface, and consume actual returns. Ordinary accounts can often read some local software metadata, but remote WMI, another user's configuration, and protected product state depend on identity, namespace, version, and deployment. Denied access, a missing provider, or an empty return remains unknown rather than proving no security product exists.
          - zh: 借用资产盘点外观还要求操作者能选择工具、脚本或执行身份；这不要求攻陷库存提供方，也不让系统工具自动获得新的权限。操作者必须承担结果陈旧、产品名称不唯一和查询触发修复等限制，不能假设同一查询能完整覆盖客户端、服务器、云与其他操作系统。
            en: Borrowing an inventory appearance additionally requires control over a tool, script, or execution identity, without requiring compromise of the inventory provider or granting a system utility new privileges. The operator faces stale results, nonunique product names, and query-triggered repair, and cannot assume identical coverage across clients, servers, cloud environments, and other operating systems.
      defender_model:
        paragraphs:
          - zh: 防守方可拥有带完整参数的进程创建、已启用的脚本块内容、经过本地验证的 WMI Trace 和独立的软件资产资料。前两者显示工具或脚本意图，Trace 可显示查询对象及原始客户端；这些通常不包含实际产品清单。Sysmon 的 Registry 修改和 WMI 持久订阅事件不能代替任意 Registry 读取或 WQL 查询结果。
            en: Defenders may have process creation with full arguments, enabled script-block content, locally validated WMI Trace, and independent software-asset records. The first two expose tool or script intent, while Trace can expose the queried object and original client; they ordinarily do not contain actual product inventories. Sysmon Registry-change and persistent-WMI-subscription events do not substitute for arbitrary Registry reads or WQL query results.
          - zh: 可靠归属依赖客户端主机、查询时点与进程生命周期，不能把 WmiPrvse 的 PID 当成发起者，或把远端客户端 PID 关联到本机进程。资产登记只描述某个时点和视图，批准台账也必须另行维护；别名、缺失创建事件和被盗运维身份都会降低解释力。只有另经验证的结果采集才能证明具体名称、版本或状态被返回。
            en: Reliable attribution depends on the client host, inquiry time, and process lifetime; WmiPrvse's PID is not the initiating client, and a remote client's PID cannot be joined to a local process. Asset records describe a particular time and view, and work authorization requires a separately maintained register. Aliases, missing creation events, and stolen administrative identities weaken interpretation. Concrete returned names, versions, or states require independently validated result capture.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 借用软件资产管理的查询接口和工具外观降低恶意盘点的可区分性
        en: Borrow software-asset inquiry interfaces and utility appearance to reduce the distinguishability of malicious inventory
      analysis:
        paragraphs:
          - zh: 操作者以正常管理工具或脚本请求软件登记、安装产品和安全软件信息，保留与资产清查相同的可见程序及查询形状；这种设计不消除请求，而是让单个合法工具事件难以表达未经授权的软件画像意图。恶意采用由 LunarWeb 和 FIN12 研究支持，合法查询形状由 Microsoft 库存文档支持；把查询范围、原始主体与批准任务结合才能改善区分。来源没有证明每次查询均出于匿迹动机或测量漏报，因此本机理只对借用该外观的实施成立，置信度为中等。
            en: The operator requests registration, installed-product, and security-software information through ordinary administrative tools or scripts, retaining the visible programs and inquiry shape of asset inventory. This design leaves requests present but makes one legitimate-utility event poorly express an unauthorized profiling purpose. LunarWeb and FIN12 establish malicious use, while Microsoft inventory documentation establishes legitimate query shapes; joining scope, original principal, and approved work improves distinction. The sources neither establish a stealth motive for every inquiry nor measure missed detections, so the mechanism applies only to implementations borrowing that appearance and remains medium-confidence.
      evidence_keys: [REF-000639, B011-T1518-REF-FIN12, B011-T1518-REF-INVENTORY]
      confidence: medium
  subtechnique_taxonomy:
    coverage: deferred
    subtechnique_keys: []
    narrative:
      paragraphs:
        - zh: 软件产品类别、安装与健康状态、查询介质及工具可以改变信息内容和实现条件，但不独立构成稳定的匿迹分类。软件发现保留这些语义差异，以免把登记误解为正在运行或有效防护；它们并不自然产生一组互斥且具有独立防守观察差异的子技术。
          en: Product categories, installation and health states, query carriers, and tools change information content and implementation conditions without independently forming stable evasion classes. Software Discovery preserves these semantic differences to avoid confusing registration with execution or effective protection; they do not inherently produce a set of distinct children with independent observation effects.
        - zh: 驻留内联查询、既存资料复用、低频调查和事件触发取得仍可能改变痕迹，但现有一手证据没有充分分离其在软件事实获取中的有意控制、痕迹对照和独立防御价值。当前保留父级而暂缓子技术分类；软件结果引起的分析环境规避、执行护栏或安全削弱仍由各自技术界定。
          en: Resident inline queries, reuse of prior records, infrequent surveying, and event-triggered acquisition can potentially alter traces, but current primary evidence does not sufficiently isolate intentional control, trace contrasts, and independent defensive value for software-fact acquisition. Retain the parent while deferring child taxonomy; software-result-driven analysis evasion, execution guardrails, and defense impairment retain their own boundaries.
  defense:
    detections: {coverage: available, strategy_keys: [B011-T1518-DET-INVENTORY]}
    mitigations: {coverage: available, mitigation_keys: [B011-T1518-MIT-INVENTORY]}
  evidence:
    claim_keys: [B011-T1518-CLM-LUNAR, B011-T1518-CLM-FIN12, B011-T1518-CLM-SCOPE, B011-T1518-CLM-FD, B011-T1518-CLM-INCOMPLETE, B011-T1518-CLM-MSI, B011-T1518-CLM-HEALTH, B011-T1518-CLM-TRACE, B011-T1518-CLM-MITIGATION]
    case_keys: [B011-T1518-CASE-LUNAR, B011-T1518-CASE-FIN12]
    reference_keys: [B011-T1518-REF-ATTACK, REF-000639, B011-T1518-REF-FIN12, B011-T1518-REF-INVENTORY, B011-T1518-REF-MSI, B011-T1518-REF-WSC-LIST, B011-T1518-REF-WSC-HEALTH, REF-001309, REF-001310, REF-001312, REF-000230, REF-000463, REF-000200]
proposed_subtechniques: []
defense_candidates:
  detection_strategies:
    - key: B011-T1518-DET-INVENTORY
      schema_version: "2.0.0"
      type: detection-strategy
      name: {zh: 软件清单调查的调用者与工作范围核验, en: Caller and Work-Scope Validation for Software Inventory}
      summary:
        zh: 恢复软件调查的具体信息范围与原始调用者，识别偏离批准资产或支持任务的请求。
        en: Recover software-inquiry scope and the original caller to identify requests departing from approved inventory or support work.
      description:
        paragraphs:
          - zh: 本策略直接覆盖可见命令、脚本和 WMI 软件清单请求。命令分析恢复卸载登记、软件类和目标条件，WMI 分析从提供方观察恢复实际客户端；二者分别保留请求证据，不从进程成功、命名空间授权或库存基线推断返回产品与防护状态。策略不以安全厂商名单或工具名称单独判断恶意。
            en: This strategy directly covers visible command, script, and WMI software-inventory requests. The command analytic recovers uninstall-registration, software-class, and target conditions, while the WMI analytic restores the client from provider-side observations. Both preserve request-level evidence rather than inferring returned products or protection state from process success, namespace authorization, or asset baselines. Vendor lists and utility names alone do not establish maliciousness.
      detects_keys: [B011-T1518-PARENT]
      domains: [enterprise]
      analytic_keys: [B011-T1518-NJA-COMMAND, B011-T1518-NJA-WMI]
      evidence_keys: [REF-000639, B011-T1518-REF-FIN12, B011-T1518-REF-INVENTORY, B011-T1518-REF-MSI, REF-001309, REF-001310, REF-000230, REF-000463]
  detection_analytics:
    - key: B011-T1518-NJA-COMMAND
      schema_version: "2.0.0"
      type: detection-analytic
      strategy_key: B011-T1518-DET-INVENTORY
      name: {zh: 软件清单命令语义与授权范围关联, en: Software-Inventory Command Semantics and Authorization-Scope Correlation}
      summary:
        zh: 保留软件登记、版本或安全产品查询条件，输出可核验的未登记或越界软件调查线索。
        en: Preserve registration, version, or security-product inquiry conditions and produce verifiable leads for unregistered or out-of-scope software surveying.
      domains: [enterprise]
      platforms: [Windows]
      logic:
        paragraphs:
          - zh: 从 Sysmon Event 1 的完整参数中恢复 reg query 对卸载登记路径的读取、wmic 对 Win32_Product 或已验证软件库存类的 get 查询、以及 root\SecurityCenter2 的 AntiVirusProduct 请求；只有软件信息对象明确时才生成 software_inventory_request。恢复参数中的远端目标、用户和 Registry 位数选择。帮助、元数据说明、任意 Registry 键、进程与服务清单不自动命中；call Uninstall、删除键和终止动作分流为后继修改。对 Windows PowerShell 5.1 的可选脚本分支，先重组脚本块并确认实际 Get-CimInstance/Get-WmiObject 类或卸载登记读取语义；仅见 powershell.exe 或脚本文件名时保留未知。
            en: Recover reg query reads of uninstall-registration paths, wmic get requests for Win32_Product or validated software-inventory classes, and root\SecurityCenter2 AntiVirusProduct requests from full Sysmon Event 1 arguments. Emit software_inventory_request only for an explicit software information object. Preserve remote targets, users, and registry-view selections in arguments. Exclude help, metadata descriptions, arbitrary keys, and process or service inventories; route call Uninstall, key deletion, and termination to later modification behaviors. The optional Windows PowerShell 5.1 branch first reassembles script blocks and resolves actual Get-CimInstance/Get-WmiObject classes or uninstall-registration read semantics; a powershell.exe launch or script filename alone remains unknown.
          - zh: 将 Event 1 的 System/Computer、UtcTime、ProcessGuid、ProcessId、Image、CommandLine、User、ParentProcessGuid 分别映射 host_key、timestamp、process_guid、process_id、image_path、command_line、user_name、parent_process_guid；process_start 取该创建事件的 UtcTime。用于脚本生命周期关联的 Event 5 把 UtcTime 记作 process_end。4104 的 System/Computer、TimeCreated/SystemTime、Execution/ProcessID、ScriptBlockId、MessageNumber、MessageTotal、ScriptBlockText 分别映射 host_key、timestamp、process_id、script_block_id、message_number、message_total、script_block_text。按主机、进程生命周期和 ScriptBlockId 重组，丢段不补造内容。命令中解析的 query_scope 与 target_scope 是派生字段，保留原文供复核。
            en: Map Event 1 System/Computer, UtcTime, ProcessGuid, ProcessId, Image, CommandLine, User, and ParentProcessGuid to host_key, timestamp, process_guid, process_id, image_path, command_line, user_name, and parent_process_guid; process_start is that creation event's UtcTime. For script-lifetime joins, Event 5 UtcTime becomes process_end. Map 4104 System/Computer, TimeCreated/SystemTime, Execution/ProcessID, ScriptBlockId, MessageNumber, MessageTotal, and ScriptBlockText to host_key, timestamp, process_id, script_block_id, message_number, message_total, and script_block_text. Reassemble by host, process lifetime, and ScriptBlockId without inventing missing fragments. Parsed query_scope and target_scope are derived fields with retained raw text.
          - zh: 将调用者、执行主机、映像与实际软件信息范围同独立批准台账比较。台账必须由工作负责人明确登记 work_id、owner、host_key、user_name、image_path、query_scope、target_scope、valid_from 和 valid_until，不能从观察到的命令反向自动批准。仅接受相同规范主机名与账户表示；需要别名转换时须另有经核验身份映射，缺少它就保留未解析，不把两个同名本地账户合并。执行主机或查询范围越过登记任务时输出待核验线索，缺台账标为授权未知，均不直接认定恶意。
            en: Compare caller, execution host, image, and actual software scope with an independently maintained authorization register. A work owner must explicitly register work_id, owner, host_key, user_name, image_path, query_scope, target_scope, valid_from, and valid_until; observed commands cannot authorize themselves. Accept matching canonical hostname and account representations only. Alias conversion requires a separately verified identity map; without it retain unresolved identities rather than merging same-name local accounts. Emit a review lead when the host or query scope exceeds registered work, and label absent register information as authorization unknown rather than malicious.
          - zh: 以十分钟初始关联窗口合并同一进程或完整脚本中的盘点请求；该窗口用于去重和任务联系，不是恶意阈值。安全或备份产品定向请求的优先级取决于任务职责与入侵上下文，不由产品字符串单独决定。输出限定为 software_inventory_request，保留解析置信度；本分析没有部署结果采集合同，不能因重定向文件创建、工具正常退出或清单基线存在而升级为软件已安装、运行、启用或关闭。
            en: Use an initial ten-minute window to group inventory requests from one process or complete script, for deduplication and task association rather than a maliciousness threshold. Prioritize security- or backup-targeted inquiries according to work duties and intrusion context, not product strings alone. Limit output to software_inventory_request with parsing confidence. This analytic deploys no result-capture contract, so redirected file creation, successful exit, or baseline inventory cannot establish installed, running, enabled, or disabled software.
      data_requirements:
        - source_type: sysmon-process-lifecycle
          name: {zh: 已配置的 Sysmon 进程创建与终止, en: Configured Sysmon process creation and termination}
          channel: Microsoft-Windows-Sysmon/Operational
          required_fields: [host_key, timestamp, event_id, process_guid, process_id, process_start, process_end, image_path, command_line, user_name, parent_process_guid]
        - source_type: optional-powershell-script-block
          name: {zh: 可选且已启用的 Windows PowerShell 5.1 脚本块, en: Optional enabled Windows PowerShell 5.1 script blocks}
          channel: Microsoft-Windows-PowerShell/Operational
          required_fields: [host_key, timestamp, process_id, script_block_id, message_number, message_total, script_block_text]
        - source_type: approved-software-inventory-work
          name: {zh: 由负责人独立维护的软件盘点与支持批准台账, en: Independently owner-maintained software-inventory and support register}
          channel: null
          required_fields: [work_id, owner, host_key, user_name, image_path, query_scope, target_scope, valid_from, valid_until]
        - source_type: conditional-verified-identity-map
          name: {zh: 仅在别名转换时使用的经核验身份映射合同, en: Verified identity-map contract used only for alias conversion}
          channel: null
          required_fields: [observed_host, canonical_host_key, observed_user, canonical_user_name, valid_from, valid_until, owner]
      observables:
        - {zh: 明确请求软件登记、版本或安全产品信息的命令或完整脚本, en: Commands or complete scripts explicitly requesting registration, versions, or security-product information}
        - {zh: 实际查询对象与有效批准任务的主机、主体或范围差异, en: Differences between actual inquiry objects and valid authorized host, principal, or scope}
      correlation:
        window: {zh: 十分钟初始任务关联并保留覆盖客户端全生命周期的进程创建与终止；依据本地任务时长调整, en: Initial ten-minute task association with process creation and termination retained over the client's full lifetime; tune to local task duration}
        dimensions: [host_key, process_guid, user_name, query_scope, target_scope]
      false_positives:
        - {zh: 补丁与许可盘点、部署核对及经授权远程支持, en: Patch and licensing inventory, deployment checks, and authorized remote support}
        - {zh: 安全代理健康检查、应急取证和备份兼容性核验, en: Security-agent health checks, incident forensics, and backup-compatibility validation}
      blind_spots:
        - {zh: 仅在内存运行的查询、非 WMI API、丢失的参数和未启用脚本块不一定留下本分支可解析命令, en: In-memory inquiries, non-WMI APIs, missing arguments, and disabled script logging may leave no parseable command for this branch}
        - {zh: 4104 内容不保证所有分支已经执行；命令与脚本均不提供完整产品结果, en: 4104 content does not establish execution of every branch; neither commands nor scripts provide complete product results}
        - {zh: 缺失创建或终止、同名账户、时间漂移及被盗批准身份降低归属与任务解释力, en: Missing creation or termination, same-name accounts, clock drift, and stolen approved identities weaken attribution and task interpretation}
      tuning_guidance:
        paragraphs:
          - zh: 验证正常卸载清单、仅软件版本查询、帮助请求、失败远端查询和 Win32_Product 调用的解析差异；副作用测试应在受控系统进行，不能在生产重复执行来“确认”请求。Event 5 未到达时 process_end 保持 null 并记录生命周期不完整；event_id 来自 System/EventID。身份映射是目录或资产系统维护的有效期记录，并非默认日志字段；没有该记录就禁用别名合并。批准台账绑定具体范围与期限，不永久放行 reg、wmic、PowerShell 或整个运维账户。没有 4104 时运行命令分支并标注脚本盲区，PowerShell 7 需单独验证通道和结构。
            en: Validate parsing differences for a normal uninstall inventory, a version-only inquiry, help, failed remote inquiries, and Win32_Product calls. Side-effect tests belong on controlled systems; do not repeat production queries to confirm a request. Keep process_end null with an incomplete-lifetime flag when Event 5 is absent; event_id comes from System/EventID. Identity maps are validity-bounded directory or asset records, not default log fields, and absent maps disable alias merging. Bind authorization to exact scope and expiry instead of permanently allowing reg, wmic, PowerShell, or administrative accounts. Without 4104, run the command branch with an explicit script gap; PowerShell 7 needs independently validated channels and structure.
      evidence_keys: [REF-000639, B011-T1518-REF-FIN12, B011-T1518-REF-INVENTORY, B011-T1518-REF-MSI, REF-000230, REF-000463]
    - key: B011-T1518-NJA-WMI
      schema_version: "2.0.0"
      type: detection-analytic
      strategy_key: B011-T1518-DET-INVENTORY
      name: {zh: 软件库存 WMI 请求的提供方与客户端分离关联, en: Provider and Client Separation for Software-Inventory WMI Requests}
      summary:
        zh: 从已验证 WMI Trace 恢复软件查询语义与发起者，避免把提供方或授权成功当成软件结果。
        en: Recover software-query semantics and the initiator from validated WMI Trace without treating the provider or successful authorization as software results.
      domains: [enterprise]
      platforms: [Windows]
      logic:
        paragraphs:
          - zh: 在目标 Windows build 预先启用并验证 Microsoft-Windows-WMI-Activity/Trace。从客户端 ExecQuery 或 CreateInstanceEnum 中解析 Win32_Product、已验证的软件库存类，或 root\SecurityCenter2 下 AntiVirusProduct 的实例请求，保留属性投影与筛选条件。不要把 provider 启动、类元数据浏览、WMI 持久订阅事件或单独命名空间访问当成软件调查；Uninstall 等 ExecMethod 修改另行处理。Win32_Product 的 where 条件可能仍触发全量 MSI 枚举与修复，少量匹配结果不能证明提供方只读取少量产品。
            en: Pre-enable and validate Microsoft-Windows-WMI-Activity/Trace on the target Windows build. Parse client ExecQuery or CreateInstanceEnum instance requests for Win32_Product, validated software-inventory classes, or root\SecurityCenter2 AntiVirusProduct, preserving projection and predicates. Provider startup, class metadata browsing, persistent-WMI-subscription events, and namespace access alone do not establish software surveying; route modifying ExecMethod operations such as Uninstall separately. A Win32_Product where predicate can still cause full MSI enumeration and repair, so few matches do not establish a narrow provider read.
          - zh: 以原始 XML 的 System/Computer 和 TimeCreated/SystemTime 映射 observer_host_key 与 timestamp；ClientMachineFQDN 或 ClientMachine、ClientProcessId、ClientProcessCreationTime、User、NamespaceName、Operation、OperationId、GroupOperationId、IsLocal 映射 client_machine、client_process_id、client_process_start、user_name、namespace_name、operation_text、operation_id、group_operation_id、is_local。creation time 按文件时间语义转换，字段缺失为 null；不从格式错误的渲染文本补造命名空间。字段是否存在取决于本地事件版本。provider HostId 即便可见也不是客户端标识，结果状态或产品返回行没有在本数据源中声明。
            en: Map raw XML System/Computer and TimeCreated/SystemTime to observer_host_key and timestamp. Map ClientMachineFQDN or ClientMachine, ClientProcessId, ClientProcessCreationTime, User, NamespaceName, Operation, OperationId, GroupOperationId, and IsLocal to client_machine, client_process_id, client_process_start, user_name, namespace_name, operation_text, operation_id, group_operation_id, and is_local. Convert creation time according to FILETIME semantics and retain missing values as null; do not reconstruct namespaces from malformed rendered text. Field availability depends on the locally validated event version. A visible provider HostId is not the client identity, and this source declares neither outcome state nor returned product rows.
          - zh: 只在客户端主机得到相同规范名称确认后，按客户端 PID 与覆盖查询时刻的生命周期连接 Sysmon 创建/终止记录；同时具备 ClientProcessCreationTime 时核对创建时间。远端客户端只可连接远端主机实际采集的生命周期，不能使用观察主机的同号 PID。无法解析的主机或用户名保持未知；如需别名转换，使用明确登记 observed_host、canonical_host_key、observed_user、canonical_user_name、valid_from、valid_until、owner 的受控映射，保留来源与有效期，缺失则不跨别名连接。
            en: Join the client PID to Sysmon creation and termination only after confirming the client host's canonical name and a lifetime containing the inquiry time, also checking ClientProcessCreationTime when available. A remote client can join only to lifecycle data actually collected on that remote host, never a same-number PID on the observer. Preserve unresolved hosts and users. Alias conversion requires a controlled map explicitly registering observed_host, canonical_host_key, observed_user, canonical_user_name, valid_from, valid_until, and owner, with provenance and validity retained; absent maps forbid alias-crossing joins.
          - zh: 将软件查询对象、客户端映像、主体和目标范围与同一批准台账比较，按十分钟窗口聚合重复请求并输出 software_inventory_request、client_resolved 或 client_unknown 的证据等级。台账字段合同同命令分支，需有效负责人、范围与期限。未登记软件定向读取或偏离批准资产任务应供人工核验，单个低频查询不直接判恶意。命名空间 4662 成功只支持授权，Trace 只支持请求；没有单独结果采集时，软件安装、版本值、启用和关闭状态都保持未证实。
            en: Compare software objects, client image, principal, and target scope with the same authorization register, grouping repeated requests over ten minutes and emitting software_inventory_request with client_resolved or client_unknown evidence levels. The register uses the command branch's explicit owner, scope, and validity contract. Unregistered targeted reads or departures from approved inventory work require review; one infrequent inquiry does not prove maliciousness. Namespace event 4662 supports authorization and Trace supports requests. Without separate result capture, installed software, version values, and enabled or disabled state remain unestablished.
      data_requirements:
        - source_type: validated-wmi-client-trace
          name: {zh: 已启用且逐版本验证的 WMI 客户端 Trace, en: Enabled WMI client Trace validated per version}
          channel: Microsoft-Windows-WMI-Activity/Trace
          required_fields: [observer_host_key, timestamp, client_machine, client_process_id, client_process_start, user_name, namespace_name, operation_text, operation_id, group_operation_id, is_local]
        - source_type: sysmon-client-process-lifecycle
          name: {zh: 客户端所在主机的 Sysmon 进程生命周期, en: Sysmon process lifetimes on the actual client host}
          channel: Microsoft-Windows-Sysmon/Operational
          required_fields: [host_key, timestamp, event_id, process_guid, process_id, process_start, process_end, image_path, user_name]
        - source_type: approved-software-inventory-work
          name: {zh: 由负责人独立维护的软件盘点与支持批准台账, en: Independently owner-maintained software-inventory and support register}
          channel: null
          required_fields: [work_id, owner, host_key, user_name, image_path, query_scope, target_scope, valid_from, valid_until]
        - source_type: conditional-verified-identity-map
          name: {zh: 仅在别名转换时使用的经核验身份映射合同, en: Verified identity-map contract used only for alias conversion}
          channel: null
          required_fields: [observed_host, canonical_host_key, observed_user, canonical_user_name, valid_from, valid_until, owner]
      observables:
        - {zh: 具有真实类、命名空间和筛选语义的软件实例查询, en: Software-instance inquiries with actual class, namespace, and predicate semantics}
        - {zh: 与进程生命周期匹配的本地或远端客户端请求及其批准工作偏差, en: Local or remote client requests matched to process lifetimes and departures from approved work}
      correlation:
        window: {zh: 十分钟初始请求聚合；客户端生命周期留存必须覆盖长驻进程及实际远端查询时点, en: Initial ten-minute request aggregation; lifecycle retention must cover resident clients and actual remote inquiry times}
        dimensions: [observer_host_key, client_machine, client_process_id, client_process_start, operation_id, group_operation_id, namespace_name, user_name]
      false_positives:
        - {zh: SCCM 与其他部署、许可、补丁或安全健康代理进行软件库存查询, en: SCCM and other deployment, licensing, patch, or security-health agents querying software inventory}
        - {zh: 经授权的资产清查、远程支持及 WMI 性能诊断, en: Authorized asset inventory, remote support, and WMI performance diagnosis}
      blind_spots:
        - {zh: Trace 未启用、字段版本不同、事件丢失或采集从客户端启动后才开始，可能失去请求或归属, en: Disabled Trace, version-dependent fields, event loss, or collection starting after client launch may lose the request or attribution}
        - {zh: 直接 Registry/API、非 WMI 管理接口与云端软件视图不在本分析的数据覆盖内, en: Direct Registry or API reads, non-WMI management interfaces, and cloud software views lie outside this analytic's data coverage}
        - {zh: 本源没有产品结果；健康或安装结论不能从 WMI 授权、查询启动或 provider 状态推导, en: These sources contain no product results; WMI authorization, query start, or provider state cannot establish health or installation}
      tuning_guidance:
        paragraphs:
          - zh: 在受控主机验证普通 MSI 请求、带谓词请求、SecurityCenter2 可用与不可用、远端客户端、PID 重用、缺客户端创建事件及错误命名空间；不要求每种系统都实现安全产品提供方。Sysmon 字段按命令分支映射，终止事件缺失保留 null 与身份不确定性。部署时从原始 XML 校验 Operation 与 NamespaceName，不直接采用示例渲染字段错误；保留事件版本和采集损失记录。台账与别名表为独立部署合同而非 Windows 默认提供，缺失时只输出请求与未知授权，不能静默白名单。窗口和范围以当地管理作业校准，不能以 Win32_Product 的 where 谓词保证查询低噪或无副作用。
            en: On controlled hosts validate ordinary and predicated MSI requests, available and unavailable SecurityCenter2, remote clients, PID reuse, missing client creation, and erroneous namespaces without requiring every system to implement security-product providers. Map Sysmon fields as in the command branch, retaining null termination and identity uncertainty. Validate Operation and NamespaceName from raw XML rather than copying rendered example errors, and retain event versions and loss records. Registers and alias maps are separate deployment contracts rather than Windows defaults; when absent, emit request and unknown authorization instead of silently allowlisting. Calibrate windows and scope to local work, without treating a Win32_Product where predicate as a guarantee of quiet or side-effect-free querying.
      evidence_keys: [REF-001309, REF-001310, REF-000230, B011-T1518-REF-MSI, B011-T1518-REF-INVENTORY, REF-000639]
  mitigations:
    - key: B011-T1518-MIT-INVENTORY
      schema_version: "2.0.0"
      type: mitigation
      name: {zh: 软件库存读取与盘点任务治理, en: Software-Inventory Read and Task Governance}
      summary:
        zh: 收敛不必要的软件库存读取与远端盘点入口，并使必要的软件调查可归属到受控任务。
        en: Reduce unnecessary software-inventory reads and remote inventory entry points while attributing necessary inquiries to controlled work.
      description:
        paragraphs:
          - zh: 软件部署元数据是兼容性、支持和安全维护所需事实，无法在不影响正常管理的情况下全部隐藏。本措施管理谁可通过哪些库存接口调查何种范围，并保留验证请求的证据。重点是远程命名空间与专用库存资料的读取、受控脚本的任务边界及软件状态语义，不能以隐藏产品名称代替保护安全与备份组件。
            en: Deployment metadata is needed for compatibility, support, and security maintenance and cannot be completely hidden without affecting legitimate management. This mitigation governs who can survey which scope through which inventory interfaces and retains evidence for request validation. It focuses on remote namespaces, dedicated inventory records, controlled-script work boundaries, and software-state semantics; hiding product names does not protect security or backup components.
      domains: [enterprise]
      measures:
        - key: inventory-access-scope
          name: {zh: 收敛专用库存与远程读取, en: Limit dedicated-inventory and remote read scope}
          description:
            paragraphs:
              - zh: 审查软件库存资料与 WMI 命名空间的实际 DACL、Enable Account 和 Remote Enable，撤销不必要远程或跨角色读取；专用软件清单和产品配置副本使用最小读取权限。保持必要本地系统与代理访问，先验证补丁、许可、安全与备份运维兼容性，不全局封锁系统软件登记。
                en: Review actual DACLs, Enable Account, and Remote Enable on software-inventory records and WMI namespaces, removing unnecessary remote or cross-role reads. Apply minimal read access to dedicated inventories and configuration copies, retain necessary system and agent access, and validate patch, licensing, security, and backup operations rather than globally blocking system registration.
          control_type: exposure-reduction
        - key: registered-inventory-jobs
          name: {zh: 将盘点绑定负责人及明确范围, en: Bind inventory jobs to owners and explicit scope}
          description:
            paragraphs:
              - zh: 为软件清查脚本、身份、主机和产品信息范围登记负责人、用途及有效期，按业务需求使用受控脚本和适用的应用控制；先审计并测试限制，再进入强制模式。统一记录卸载登记、MSI 与安全提供方各自的覆盖和副作用，避免通过重复高代价查询核验日常任务。
                en: Register owners, purpose, and validity for inventory scripts, identities, hosts, and product-information scope. Use controlled scripts and applicable application controls according to operational need, auditing and testing restrictions before enforcement. Record the coverage and side effects of uninstall registration, MSI, and security providers so routine work is not validated by repeatedly issuing expensive inquiries.
          control_type: governance
        - key: query-and-caller-retention
          name: {zh: 保留软件请求与原始客户端证据, en: Retain software requests and original-client evidence}
          description:
            paragraphs:
              - zh: 预先部署含参数的进程审计、适用的脚本日志与经验证 WMI Trace，保留客户端主机和生命周期，并送入查询者不能任意修改的保留范围。审核授权、请求、返回与安装程序副作用是不同等级；只有另行验证的结果采集才用于具体产品状态结论。
                en: Predeploy process auditing with arguments, applicable script logging, and validated WMI Trace. Preserve client hosts and lifetimes in retention that the querying principal cannot arbitrarily modify. Treat authorization, requests, returns, and installer side effects as different evidence levels; use only separately validated result capture for product-state conclusions.
          control_type: detective-support
      applications:
        - target_key: B011-T1518-PARENT
          use:
            paragraphs:
              - zh: 对软件发现，优先审查可远程读取的软件清单与提供方、过宽的软件配置副本及无人负责的盘点脚本；缩小不必要读取范围，并把安全或备份软件调查与明确任务核验。保持受支持系统组件的正常访问，对 MSI 查询副作用另做容量与兼容性验证，不把少返回行当成低代价证明。
                en: For Software Discovery, prioritize remotely readable inventories and providers, overly broad configuration copies, and unowned inventory scripts. Reduce unnecessary read scope and validate security- or backup-software inquiries against explicit work. Preserve supported system access, validate MSI side effects for capacity and compatibility, and do not treat few returned rows as evidence of low cost.
          expected_effect:
            paragraphs:
              - zh: 不必要的跨角色与远程软件画像机会减少，借用日常盘点工具的查询更容易关联到实际负责人及范围，原始客户端与请求语义也更容易留存。其主要收益是减少暴露并改善区分，不是保证隐藏已部署产品或阻止所有本地读取。
                en: Unnecessary cross-role and remote profiling opportunities shrink, inquiries borrowing normal inventory tools become easier to associate with actual owners and scope, and original-client and request semantics are better retained. The principal benefits are exposure reduction and improved distinction rather than guaranteed concealment of deployed products or prevention of every local read.
          limitations:
            paragraphs:
              - zh: 已控制的获准代理和普通本地元数据仍可泄露软件事实；应用控制不自动阻止所有 WMI 命令或任意进程内读取，也不能证明防护有效。错误收紧库存或安全命名空间可能破坏部署、健康监控与备份支持。丢失 Trace、远端生命周期或独立台账时检测收益下降，控制必须按主机角色验证。
                en: A compromised approved agent and ordinary local metadata can still expose software facts. Application controls do not automatically block all WMI commands or arbitrary in-process reads and do not establish effective protection. Incorrect inventory or security-namespace restrictions can break deployment, health monitoring, and backup support. Missing Trace, remote lifetimes, or independent work registers reduce detection benefits, so validate controls by host role.
      evidence_keys: [REF-001310, REF-001312, REF-000200, REF-000230, REF-000463, REF-001309, B011-T1518-REF-INVENTORY, B011-T1518-REF-MSI]
