research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids: [T1518.001, T1518.002]
    represented_dimensions:
      - {zh: 安全产品、传感器及其可得配置, en: Security products, sensors, and their available configuration}
      - {zh: 备份产品及恢复相关配置, en: Backup products and recovery-related configuration}
    breadth_trigger: ordinary
    coverage_resolutions:
      - attack_ids: [T1518.001]
        resolution: parent-core
        rationale: Security-product facts belong to the parent. Product category is not a controlled trace variable; explicit process, driver, service, guardrail, and impairment actions remain adjacent.
        evidence_keys: [REF-000639, B011-T1518-REF-FIN12, B011-T1518-REF-WSC-LIST, B011-T1518-REF-WSC-HEALTH]
      - attack_ids: [T1518.002]
        resolution: parent-core
        rationale: FIN12 independently supports malicious backup inventory. Recovery relevance changes purpose and queried data, not independently supported stealth trace topology.
        evidence_keys: [B011-T1518-REF-FIN12]
    candidate_stealth_axes_examined:
      - axis: product-category-and-state
        resolution: parent-core
        reason: Security, backup, management, version, installation, and health categories alter facts and consequences but have no stable independent stealth variable or sibling boundary.
      - axis: source-and-observation-position
        resolution: evidence-deferred
        reason: WMI, uninstall registration, MSI, file metadata, WSC, and management APIs have different visibility. The reviewed cases do not isolate intentional software-specific provider selection and controlled trace comparisons; tools or platforms alone do not justify children.
      - axis: resident-inline-carriage
        resolution: evidence-deferred
        reason: In-process access could omit a new utility boundary, but reviewed software cases do not establish this contrast at conclusion level. Do not borrow NJT-0240's resident process-survey evidence or NJT-0241's generic Registry child as software-specific existence support.
      - axis: preexisting-view-and-cache-reuse
        resolution: evidence-deferred
        reason: Software inventories naturally represent preexisting registrations. No reviewed case distinguishes deliberately reusing an already obtained software result from simply issuing a fresh inventory query or proves avoided provider work; unlike NJT-0242 local host knowledge, no explicit no-probe contrast was established.
      - axis: timing-and-event-driven-acquisition
        resolution: evidence-deferred
        reason: No primary software-specific evidence of deliberately sparse timing, notification-driven acquisition, or request suppression with a distinct defender effect; periodic legitimate inventory remains a counterexample.
      - axis: predicate-and-output-filtering
        resolution: not-stealth-distinct
        reason: Fewer columns or matching products is not necessarily reduced provider work. Win32_Product can enumerate and repair all MSI packages despite filtering; no measured stealth contrast supports a child.
      - axis: caller-provenance-and-management-appearance
        resolution: parent-core
        reason: Borrowed inventory tooling supports a medium-confidence parent feature-disguise mechanism; the source does not establish a stable software-specific carrier taxonomy beyond the parent.
      - axis: downstream-conditional-behavior
        resolution: adjacent-technique
        reason: Analysis classification is NJT-0122, debugger evasion NJT-0106, target conditions/environmental keys NJT-0109; defense changes and backup destruction require separate observed actions.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 虽只有两个 ATT&CK 产品类别，仍进行了来源、时序、既存视图、驻留承载、过滤和后继行为的独立第二轮检查。零子项不代表认为所有路径完全等价，而是当前证据不能把其差异升级为软件发现下稳定的匿迹分类；父级 taxonomy 建议 deferred，等待主审与后续证据。
      en: Despite only two ATT&CK product categories, an independent second pass covered sources, timing, prior views, resident carriage, filtering, and downstream behavior. Zero children does not assert equivalence of every path; current evidence does not elevate their differences into stable software-discovery evasion classes. Recommend deferred parent taxonomy pending primary review and further evidence.
  evidence_coverage:
    parent_behavior_keys: [B011-T1518-REF-ATTACK, REF-000639, B011-T1518-REF-FIN12]
    boundary_keys: [B011-T1518-REF-INVENTORY, B011-T1518-REF-MSI, B011-T1518-REF-WSC-LIST, B011-T1518-REF-WSC-HEALTH, REF-001310, REF-001312]
    mechanism_support:
      - mechanism_ref: NM-FD
        evidence_keys: [REF-000639, B011-T1518-REF-FIN12, B011-T1518-REF-INVENTORY]
        evidence_level: Malicious use plus legitimate implementation overlap; observation-effect inference only, no measured misses
    child_existence_support: []
    unsupported_or_deferred:
      - Measured detection-rate changes, universal stealth intent, and success against any named EDR
      - Software-specific resident or cached-result child with controlled trace contrast
      - Guaranteed SecurityCenter2 availability or complete inventory on Windows Server
      - Per-host returned names, versions, enabled state, or disabled state in the two proposed cases
      - Equivalent implementation and telemetry semantics on Linux, macOS, ESXi, and IaaS
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已读 NJT-0001 实际父与时间稀释子项。定义分离软件事实和能力，匿迹说明普通资产外观与 MSI 残余，范围处理进程/服务/驱动及环境门控，威胁模型限定库存视图与原始客户端，防御分别处理命令和提供方查询，不按段数模仿范例。没有正式子项，故不复制父文或以产品名补齐结构。
      en: Read the actual NJT-0001 parent and temporal-dilution child. Definitions separate software facts from capability; stealth explains inventory appearance and MSI residue; boundaries handle process, service, driver, and environment gating; models constrain views and original clients; defenses distinguish commands from provider inquiries. The exemplar's paragraph counts are not copied, and no product-named or duplicated-prose child is created.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [Fixed-baseline reading, catalog searches, public evidence download and SHA-256 manifest, YAML parse and key checks]
  limitations:
    paragraphs:
      - zh: 正式证据主要支持 Windows 软件清单路径。LunarWeb 的研究混合了恢复命令和样本能力，SecurityCenter2 查询出现在调查材料中不保证它在每台服务器成功；FIN12 的脚本记录没有逐主机返回和具体日期。两者均不证明安全产品关闭、备份已破坏或某个 Niji 子项已经采用。
        en: Formal evidence primarily supports Windows inventory paths. LunarWeb reporting combines recovered commands and sample capabilities, and a documented SecurityCenter2 request need not succeed on every server. FIN12's script observation lacks per-host returns and a specific date. Neither establishes disabled security, destroyed backups, or adoption of a Niji child.
      - zh: 父级特征伪装来自恶意采用与正常库存接口的对照推断，没有实测告警率。软件登记可能不完整或陈旧，WSC 汇总健康不表示逐产品防护，Win32_Product 还可能触发修复。防御方案只确认已声明来源提供的请求及身份；结果确认、非 WMI 进程内 API、云与其他平台仍需独立传感器、数据合同和实验。
        en: Parent feature disguise is inferred from malicious use compared with legitimate inventory interfaces, without measured alert rates. Registration can be incomplete or stale, WSC aggregate health is not per-product protection, and Win32_Product can trigger repair. Defenses confirm only requests and identities supported by declared sources. Result confirmation, non-WMI in-process APIs, cloud, and other platforms require independent sensors, data contracts, and experiments.
  rejected_mechanisms:
    - mechanism_ref: NM-ST
      reason: Sparse output or product filtering is not evidence of temporally or spatially diluted work, and Win32_Product provides a concrete counterexample.
    - mechanism_ref: NM-DO
      reason: Inventory access and documented result limitations are not evidence of encryption or obscuration of the discovery content.
    - mechanism_ref: NM-BT
      reason: Query-level coverage gaps exist, but reviewed cases do not establish a separately supported software-specific bypass of observation; no copy of process/Registry resident evidence is admitted.
  open_questions:
    - Primary reviewer must converge shared REF identities across all five handoffs, including future Lunar and Microsoft overlaps.
    - Validate declared Sysmon and WMI XML fields on the deployment version before implementing analytics; no runtime sensor experiment was performed here.
