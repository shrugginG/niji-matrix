defense_candidates:
  detection_strategies:
  - key: B011-T1518-DET-INVENTORY
    schema_version: 2.0.0
    type: detection-strategy
    name:
      zh: 软件清单调查的调用者与工作范围核验
      en: Caller and Work-Scope Validation for Software Inventory
    summary:
      zh: 恢复软件调查的具体信息范围与原始调用者，识别偏离批准资产或支持任务的请求。
      en: Recover software-inquiry scope and the original caller to identify requests departing from approved inventory or
        support work.
    description:
      paragraphs:
      - zh: 本策略直接覆盖可见命令、脚本和 WMI 软件清单请求。命令分析恢复卸载登记、软件类和目标条件，WMI 分析从提供方观察恢复实际客户端；二者分别保留请求证据，不从进程成功、命名空间授权或库存基线推断返回产品与防护状态。策略不以安全厂商名单或工具名称单独判断恶意。
        en: This strategy directly covers visible command, script, and WMI software-inventory requests. The command analytic
          recovers uninstall-registration, software-class, and target conditions, while the WMI analytic restores the client
          from provider-side observations. Both preserve request-level evidence rather than inferring returned products or
          protection state from process success, namespace authorization, or asset baselines. Vendor lists and utility names
          alone do not establish maliciousness.
      - zh: 对进程内软件清单查询，WMI 分析直接从真实软件请求入手，不要求新建库存工具。命令分析负责独立工具路径的父级覆盖；WMI 分析恢复客户端与请求但不凭缺少工具事件自动认定子项，也不把研究中的画像结果当作默认生产遥测。
        en: For In-Process Software-Inventory Query, the WMI analytic starts directly from an actual software request without
          requiring a newly launched inventory utility. The command analytic supplies parent coverage for separate-utility
          paths. WMI restores clients and requests without classifying the child solely from missing utility events or treating
          research profile results as default production telemetry.
    detects_keys:
