  detection_analytics:
  - key: B011-T1518-NJA-COMMAND
    schema_version: 2.0.0
    type: detection-analytic
    strategy_key: B011-T1518-DET-INVENTORY
    name:
      zh: 软件清单命令语义与授权范围关联
      en: Software-Inventory Command Semantics and Authorization-Scope Correlation
    summary:
      zh: 保留软件登记、版本或安全产品查询条件，输出可核验的未登记或越界软件调查线索。
      en: Preserve registration, version, or security-product inquiry conditions and produce verifiable leads for unregistered
        or out-of-scope software surveying.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 从 Sysmon Event 1 的完整参数中恢复 reg query 对卸载登记路径的读取、wmic 对 Win32_Product 或已验证软件库存类的 get 查询、以及 root\SecurityCenter2
          的 AntiVirusProduct 请求；只有软件信息对象明确时才生成 software_inventory_request。恢复参数中的远端目标、用户和 Registry 位数选择。帮助、元数据说明、任意 Registry
          键、进程与服务清单不自动命中；call Uninstall、删除键和终止动作分流为后继修改。对 Windows PowerShell 5.1 的可选脚本分支，先重组脚本块并确认实际 Get-CimInstance/Get-WmiObject
          类或卸载登记读取语义；仅见 powershell.exe 或脚本文件名时保留未知。
        en: Recover reg query reads of uninstall-registration paths, wmic get requests for Win32_Product or validated software-inventory
          classes, and root\SecurityCenter2 AntiVirusProduct requests from full Sysmon Event 1 arguments. Emit software_inventory_request
          only for an explicit software information object. Preserve remote targets, users, and registry-view selections in
          arguments. Exclude help, metadata descriptions, arbitrary keys, and process or service inventories; route call Uninstall,
          key deletion, and termination to later modification behaviors. The optional Windows PowerShell 5.1 branch first
          reassembles script blocks and resolves actual Get-CimInstance/Get-WmiObject classes or uninstall-registration read
          semantics; a powershell.exe launch or script filename alone remains unknown.
      - zh: 将 Event 1 的 System/Computer、UtcTime、ProcessGuid、ProcessId、Image、CommandLine、User、ParentProcessGuid 分别映射 host_key、timestamp、process_guid、process_id、image_path、command_line、user_name、parent_process_guid；process_start
          取该创建事件的 UtcTime。用于脚本生命周期关联的 Event 5 把 UtcTime 记作 process_end。4104 的 System/Computer、TimeCreated/SystemTime、Execution/ProcessID、ScriptBlockId、MessageNumber、MessageTotal、ScriptBlockText
          分别映射 host_key、timestamp、process_id、script_block_id、message_number、message_total、script_block_text。按主机、进程生命周期和 ScriptBlockId
          重组，丢段不补造内容。命令中解析的 query_scope 与 target_scope 是派生字段，保留原文供复核。
        en: Map Event 1 System/Computer, UtcTime, ProcessGuid, ProcessId, Image, CommandLine, User, and ParentProcessGuid
          to host_key, timestamp, process_guid, process_id, image_path, command_line, user_name, and parent_process_guid;
          process_start is that creation event's UtcTime. For script-lifetime joins, Event 5 UtcTime becomes process_end.
          Map 4104 System/Computer, TimeCreated/SystemTime, Execution/ProcessID, ScriptBlockId, MessageNumber, MessageTotal,
          and ScriptBlockText to host_key, timestamp, process_id, script_block_id, message_number, message_total, and script_block_text.
          Reassemble by host, process lifetime, and ScriptBlockId without inventing missing fragments. Parsed query_scope
          and target_scope are derived fields with retained raw text.
      - zh: 将调用者、执行主机、映像与实际软件信息范围同独立批准台账比较。台账必须由工作负责人明确登记 work_id、owner、host_key、user_name、image_path、query_scope、target_scope、valid_from
          和 valid_until，不能从观察到的命令反向自动批准。仅接受相同规范主机名与账户表示；需要别名转换时须另有经核验身份映射，缺少它就保留未解析，不把两个同名本地账户合并。执行主机或查询范围越过登记任务时输出待核验线索，缺台账标为授权未知，均不直接认定恶意。
        en: Compare caller, execution host, image, and actual software scope with an independently maintained authorization
          register. A work owner must explicitly register work_id, owner, host_key, user_name, image_path, query_scope, target_scope,
          valid_from, and valid_until; observed commands cannot authorize themselves. Accept matching canonical hostname and
          account representations only. Alias conversion requires a separately verified identity map; without it retain unresolved
          identities rather than merging same-name local accounts. Emit a review lead when the host or query scope exceeds
          registered work, and label absent register information as authorization unknown rather than malicious.
      - zh: 以十分钟初始关联窗口合并同一进程或完整脚本中的盘点请求；该窗口用于去重和任务联系，不是恶意阈值。安全或备份产品定向请求的优先级取决于任务职责与入侵上下文，不由产品字符串单独决定。输出限定为 software_inventory_request，保留解析置信度；本分析没有部署结果采集合同，不能因重定向文件创建、工具正常退出或清单基线存在而升级为软件已安装、运行、启用或关闭。
        en: Use an initial ten-minute window to group inventory requests from one process or complete script, for deduplication
          and task association rather than a maliciousness threshold. Prioritize security- or backup-targeted inquiries according
          to work duties and intrusion context, not product strings alone. Limit output to software_inventory_request with
          parsing confidence. This analytic deploys no result-capture contract, so redirected file creation, successful exit,
          or baseline inventory cannot establish installed, running, enabled, or disabled software.
    data_requirements:
    - source_type: sysmon-process-lifecycle
      name:
