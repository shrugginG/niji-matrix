    - source_type: approved-software-inventory-work
      name:
        zh: 由负责人独立维护的软件盘点与支持批准台账
        en: Independently owner-maintained software-inventory and support register
      channel: null
      required_fields:
      - work_id
      - owner
      - host_key
      - user_name
      - image_path
      - query_scope
      - target_scope
      - valid_from
      - valid_until
    - source_type: conditional-verified-identity-map
      name:
        zh: 仅在别名转换时使用的经核验身份映射合同
        en: Verified identity-map contract used only for alias conversion
      channel: null
      required_fields:
      - observed_host
      - canonical_host_key
      - observed_user
      - canonical_user_name
      - valid_from
      - valid_until
      - owner
    observables:
    - zh: 具有真实类、命名空间和筛选语义的软件实例查询
      en: Software-instance inquiries with actual class, namespace, and predicate semantics
    - zh: 与进程生命周期匹配的本地或远端客户端请求及其批准工作偏差
      en: Local or remote client requests matched to process lifetimes and departures from approved work
    correlation:
      window:
        zh: 十分钟初始请求聚合；客户端生命周期留存必须覆盖长驻进程及实际远端查询时点
        en: Initial ten-minute request aggregation; lifecycle retention must cover resident clients and actual remote inquiry
          times
      dimensions:
      - observer_host_key
      - client_machine
      - client_process_id
      - client_process_start
      - operation_id
      - group_operation_id
      - namespace_name
      - user_name
    false_positives:
    - zh: SCCM 与其他部署、许可、补丁或安全健康代理进行软件库存查询
      en: SCCM and other deployment, licensing, patch, or security-health agents querying software inventory
    - zh: 经授权的资产清查、远程支持及 WMI 性能诊断
      en: Authorized asset inventory, remote support, and WMI performance diagnosis
    blind_spots:
    - zh: Trace 未启用、字段版本不同、事件丢失或采集从客户端启动后才开始，可能失去请求或归属
      en: Disabled Trace, version-dependent fields, event loss, or collection starting after client launch may lose the request
        or attribution
    - zh: 直接 Registry/API、非 WMI 管理接口与云端软件视图不在本分析的数据覆盖内
      en: Direct Registry or API reads, non-WMI management interfaces, and cloud software views lie outside this analytic's
        data coverage
    - zh: 本源没有产品结果；健康或安装结论不能从 WMI 授权、查询启动或 provider 状态推导
      en: These sources contain no product results; WMI authorization, query start, or provider state cannot establish health
        or installation
    tuning_guidance:
      paragraphs:
      - zh: 在受控主机验证普通 MSI 请求、带谓词请求、SecurityCenter2 可用与不可用、远端客户端、PID 重用、缺客户端创建事件及错误命名空间；不要求每种系统都实现安全产品提供方。Sysmon 字段按命令分支映射，终止事件缺失保留
          null 与身份不确定性。部署时从原始 XML 校验 Operation 与 NamespaceName，不直接采用示例渲染字段错误；保留事件版本和采集损失记录。台账与别名表为独立部署合同而非 Windows 默认提供，缺失时只输出请求与未知授权，不能静默白名单。窗口和范围以当地管理作业校准，不能以
          Win32_Product 的 where 谓词保证查询低噪或无副作用。
        en: On controlled hosts validate ordinary and predicated MSI requests, available and unavailable SecurityCenter2,
          remote clients, PID reuse, missing client creation, and erroneous namespaces without requiring every system to implement
          security-product providers. Map Sysmon fields as in the command branch, retaining null termination and identity
          uncertainty. Validate Operation and NamespaceName from raw XML rather than copying rendered example errors, and
          retain event versions and loss records. Registers and alias maps are separate deployment contracts rather than Windows
          defaults; when absent, emit request and unknown authorization instead of silently allowlisting. Calibrate windows
          and scope to local work, without treating a Win32_Product where predicate as a guarantee of quiet or side-effect-free
          querying.
      - zh: 为本子项补做两个受控样例：测试客户端内部发起一条软件查询，以及由它另起库存工具发起等价查询；核对原始客户端与查询归属的差异。该建议是上线前验证合同，未声称本研究已经实施。即使客户端刚开始执行也不得漏掉其直接查询；不要按运行时长、签名或仅看
          WmiPrvse 来代理任务承载判断。不增加结果采集、C2 解析或样本代码来源作为未声明输入。
        en: For this child, issue a software query inside a test client, then have that client launch an inventory utility
          for an equivalent inquiry, comparing original clients and query attribution as two controlled deployment samples.
          This is a predeployment validation contract rather than an experiment already performed here. Retain direct inquiries
          even from newly executing clients. Client age, signatures, and WmiPrvse visibility do not substitute for task-carriage
          evidence. Add no undeclared result capture, C2 parsing, or sample-code-origin inputs.
