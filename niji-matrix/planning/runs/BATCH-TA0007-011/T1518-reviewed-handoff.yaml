  mitigations:
  - key: B011-T1518-MIT-INVENTORY
    schema_version: 2.0.0
    type: mitigation
    name:
      zh: 软件库存读取与盘点任务治理
      en: Software-Inventory Read and Task Governance
    summary:
      zh: 收敛不必要的软件库存读取与远端盘点入口，并使必要的软件调查可归属到受控任务。
      en: Reduce unnecessary software-inventory reads and remote inventory entry points while attributing necessary inquiries
        to controlled work.
    description:
      paragraphs:
      - zh: 软件部署元数据是兼容性、支持和安全维护所需事实，无法在不影响正常管理的情况下全部隐藏。本措施管理谁可通过哪些库存接口调查何种范围，并保留验证请求的证据。重点是远程命名空间与专用库存资料的读取、受控脚本的任务边界及软件状态语义，不能以隐藏产品名称代替保护安全与备份组件。
        en: Deployment metadata is needed for compatibility, support, and security maintenance and cannot be completely hidden
          without affecting legitimate management. This mitigation governs who can survey which scope through which inventory
          interfaces and retains evidence for request validation. It focuses on remote namespaces, dedicated inventory records,
          controlled-script work boundaries, and software-state semantics; hiding product names does not protect security
          or backup components.
    domains:
    - enterprise
    measures:
    - key: inventory-access-scope
      name:
        zh: 收敛专用库存与远程读取
        en: Limit dedicated-inventory and remote read scope
      description:
        paragraphs:
        - zh: 审查软件库存资料与 WMI 命名空间的实际 DACL、Enable Account 和 Remote Enable，撤销不必要远程或跨角色读取；专用软件清单和产品配置副本使用最小读取权限。保持必要本地系统与代理访问，先验证补丁、许可、安全与备份运维兼容性，不全局封锁系统软件登记。
          en: Review actual DACLs, Enable Account, and Remote Enable on software-inventory records and WMI namespaces, removing
            unnecessary remote or cross-role reads. Apply minimal read access to dedicated inventories and configuration copies,
            retain necessary system and agent access, and validate patch, licensing, security, and backup operations rather
            than globally blocking system registration.
      control_type: exposure-reduction
    - key: registered-inventory-jobs
      name:
        zh: 将盘点绑定负责人及明确范围
        en: Bind inventory jobs to owners and explicit scope
      description:
        paragraphs:
        - zh: 为软件清查脚本、身份、主机和产品信息范围登记负责人、用途及有效期，按业务需求使用受控脚本和适用的应用控制；先审计并测试限制，再进入强制模式。统一记录卸载登记、MSI 与安全提供方各自的覆盖和副作用，避免通过重复高代价查询核验日常任务。
          en: Register owners, purpose, and validity for inventory scripts, identities, hosts, and product-information scope.
            Use controlled scripts and applicable application controls according to operational need, auditing and testing
            restrictions before enforcement. Record the coverage and side effects of uninstall registration, MSI, and security
            providers so routine work is not validated by repeatedly issuing expensive inquiries.
      control_type: governance
    - key: query-and-caller-retention
      name:
        zh: 保留软件请求与原始客户端证据
        en: Retain software requests and original-client evidence
      description:
        paragraphs:
        - zh: 预先部署含参数的进程审计、适用的脚本日志与经验证 WMI Trace，保留客户端主机和生命周期，并送入查询者不能任意修改的保留范围。审核授权、请求、返回与安装程序副作用是不同等级；只有另行验证的结果采集才用于具体产品状态结论。
          en: Predeploy process auditing with arguments, applicable script logging, and validated WMI Trace. Preserve client
            hosts and lifetimes in retention that the querying principal cannot arbitrarily modify. Treat authorization, requests,
            returns, and installer side effects as different evidence levels; use only separately validated result capture
            for product-state conclusions.
      control_type: detective-support
    applications:
    - target_key: B011-T1518-PARENT
      use:
        paragraphs:
        - zh: 对软件发现，优先审查可远程读取的软件清单与提供方、过宽的软件配置副本及无人负责的盘点脚本；缩小不必要读取范围，并把安全或备份软件调查与明确任务核验。保持受支持系统组件的正常访问，对 MSI 查询副作用另做容量与兼容性验证，不把少返回行当成低代价证明。
          en: For Software Discovery, prioritize remotely readable inventories and providers, overly broad configuration copies,
            and unowned inventory scripts. Reduce unnecessary read scope and validate security- or backup-software inquiries
            against explicit work. Preserve supported system access, validate MSI side effects for capacity and compatibility,
            and do not treat few returned rows as evidence of low cost.
      expected_effect:
        paragraphs:
        - zh: 不必要的跨角色与远程软件画像机会减少，借用日常盘点工具的查询更容易关联到实际负责人及范围，原始客户端与请求语义也更容易留存。其主要收益是减少暴露并改善区分，不是保证隐藏已部署产品或阻止所有本地读取。
          en: Unnecessary cross-role and remote profiling opportunities shrink, inquiries borrowing normal inventory tools
            become easier to associate with actual owners and scope, and original-client and request semantics are better
            retained. The principal benefits are exposure reduction and improved distinction rather than guaranteed concealment
            of deployed products or prevention of every local read.
      limitations:
        paragraphs:
        - zh: 已控制的获准代理和普通本地元数据仍可泄露软件事实；应用控制不自动阻止所有 WMI 命令或任意进程内读取，也不能证明防护有效。错误收紧库存或安全命名空间可能破坏部署、健康监控与备份支持。丢失 Trace、远端生命周期或独立台账时检测收益下降，控制必须按主机角色验证。
          en: A compromised approved agent and ordinary local metadata can still expose software facts. Application controls
            do not automatically block all WMI commands or arbitrary in-process reads and do not establish effective protection.
            Incorrect inventory or security-namespace restrictions can break deployment, health monitoring, and backup support.
            Missing Trace, remote lifetimes, or independent work registers reduce detection benefits, so validate controls
            by host role.
    - target_key: B011-T1518-CHILD-INPROCESS
      use:
        paragraphs:
        - zh: 对进程内软件清单查询，优先验证客户端级 WMI 请求采集、同机生命周期与软件查询范围，并把必要管理客户端绑定批准任务。收敛不必要的远程命名空间与专用库存读取，同时保持正常软件维护；对本地已获准客户端，避免仅阻止 wmic
            或 reg 名称而宣称已经限制其代码直接读取。
          en: For In-Process Software-Inventory Query, prioritize client-level WMI request capture, same-host lifetimes, and
            software-query scope, binding necessary management clients to approved work. Reduce unnecessary remote namespace
            and dedicated-inventory reads while preserving maintenance. For an authorized local client, blocking wmic or reg
            names alone does not constrain its direct code reads.
      expected_effect:
        paragraphs:
        - zh: 软件调查即使没有独立工具入口，也更可能留下可归属请求，正常客户端与任务范围外读取之间更容易比较；部分远程与专用库存机会可被压缩。效果主要是补齐软件查询观察和授权语境，不是让产品元数据不可读或强迫所有程序创建查询工具。
          en: Inventory inquiries can leave attributable requests even without separate utility entries, improving comparisons
            between ordinary clients and reads outside their work scope. Some remote and dedicated-inventory opportunities
            can be reduced. The main effect is improved software-query observation and authorization context rather than unreadable
            product metadata or forcing every program to create a query utility.
      limitations:
        paragraphs:
        - zh: 已控制的获准客户端仍可读取其获准视图，Trace 缺失、非 WMI 接口和无法映射的远端客户端仍是盲区；脚本与应用控制不自动检查每个客户端内部的软件查询。过度限制命名空间可能破坏安全健康和部署工作，缺少结果时不能据请求日志确认某个产品状态。
          en: A compromised authorized client can still read its allowed view. Missing Trace, non-WMI interfaces, and unresolved
            remote clients remain gaps, and script or application controls do not automatically inspect each internal inquiry.
            Excessive namespace restrictions can break health and deployment work, and request logs without results cannot
            establish product state.
