  - key: B011-T1518-NJA-WMI
    schema_version: 2.0.0
    type: detection-analytic
    strategy_key: B011-T1518-DET-INVENTORY
    name:
      zh: 软件库存 WMI 请求的提供方与客户端分离关联
      en: Provider and Client Separation for Software-Inventory WMI Requests
    summary:
      zh: 从已验证 WMI Trace 恢复软件查询语义与发起者，避免把提供方或授权成功当成软件结果。
      en: Recover software-query semantics and the initiator from validated WMI Trace without treating the provider or successful
        authorization as software results.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在目标 Windows build 预先启用并验证 Microsoft-Windows-WMI-Activity/Trace。从客户端 ExecQuery 或 CreateInstanceEnum 中解析 Win32_Product、已验证的软件库存类，或
          root\SecurityCenter2 下 AntiVirusProduct 的实例请求，保留属性投影与筛选条件。不要把 provider 启动、类元数据浏览、WMI 持久订阅事件或单独命名空间访问当成软件调查；Uninstall
          等 ExecMethod 修改另行处理。Win32_Product 的 where 条件可能仍触发全量 MSI 枚举与修复，少量匹配结果不能证明提供方只读取少量产品。
        en: Pre-enable and validate Microsoft-Windows-WMI-Activity/Trace on the target Windows build. Parse client ExecQuery
          or CreateInstanceEnum instance requests for Win32_Product, validated software-inventory classes, or root\SecurityCenter2
          AntiVirusProduct, preserving projection and predicates. Provider startup, class metadata browsing, persistent-WMI-subscription
          events, and namespace access alone do not establish software surveying; route modifying ExecMethod operations such
          as Uninstall separately. A Win32_Product where predicate can still cause full MSI enumeration and repair, so few
          matches do not establish a narrow provider read.
      - zh: 以原始 XML 的 System/Computer 和 TimeCreated/SystemTime 映射 observer_host_key 与 timestamp；ClientMachineFQDN 或 ClientMachine、ClientProcessId、ClientProcessCreationTime、User、NamespaceName、Operation、OperationId、GroupOperationId、IsLocal
          映射 client_machine、client_process_id、client_process_start、user_name、namespace_name、operation_text、operation_id、group_operation_id、is_local。creation
          time 按文件时间语义转换，字段缺失为 null；不从格式错误的渲染文本补造命名空间。字段是否存在取决于本地事件版本。provider HostId 即便可见也不是客户端标识，结果状态或产品返回行没有在本数据源中声明。
        en: Map raw XML System/Computer and TimeCreated/SystemTime to observer_host_key and timestamp. Map ClientMachineFQDN
          or ClientMachine, ClientProcessId, ClientProcessCreationTime, User, NamespaceName, Operation, OperationId, GroupOperationId,
          and IsLocal to client_machine, client_process_id, client_process_start, user_name, namespace_name, operation_text,
          operation_id, group_operation_id, and is_local. Convert creation time according to FILETIME semantics and retain
          missing values as null; do not reconstruct namespaces from malformed rendered text. Field availability depends on
          the locally validated event version. A visible provider HostId is not the client identity, and this source declares
          neither outcome state nor returned product rows.
      - zh: 只在客户端主机得到相同规范名称确认后，按客户端 PID 与覆盖查询时刻的生命周期连接 Sysmon 创建/终止记录；同时具备 ClientProcessCreationTime 时核对创建时间。远端客户端只可连接远端主机实际采集的生命周期，不能使用观察主机的同号
          PID。无法解析的主机或用户名保持未知；如需别名转换，使用明确登记 observed_host、canonical_host_key、observed_user、canonical_user_name、valid_from、valid_until、owner
          的受控映射，保留来源与有效期，缺失则不跨别名连接。
        en: Join the client PID to Sysmon creation and termination only after confirming the client host's canonical name
          and a lifetime containing the inquiry time, also checking ClientProcessCreationTime when available. A remote client
          can join only to lifecycle data actually collected on that remote host, never a same-number PID on the observer.
          Preserve unresolved hosts and users. Alias conversion requires a controlled map explicitly registering observed_host,
          canonical_host_key, observed_user, canonical_user_name, valid_from, valid_until, and owner, with provenance and
          validity retained; absent maps forbid alias-crossing joins.
      - zh: 将软件查询对象、客户端映像、主体和目标范围与独立批准台账比较，按十分钟窗口聚合重复请求并输出 software_inventory_request、client_resolved 或 client_unknown 的证据等级。台账字段合同仍是有效负责人、明确范围与期限。实际客户端的软件请求可直接揭示进程内实施，不要求出现新库存工具；但仅归属到一个进程或未见新工具，不能自动证明任务没有另起执行器，子项归类仍需具体承载证据。没有独立结果采集时，安装、版本值、启用和关闭均保持未证实；研究画像不能升级本分析的生产结果能力。
        en: Compare software objects, client image, principal, and target scope with the independent authorization register,
          grouping repeated requests over ten minutes and emitting software_inventory_request with client_resolved or client_unknown
          evidence levels. The register still requires valid owners, explicit scope, and expiry. An actual client's software
          request can directly expose an in-process implementation without a new utility, but attribution to a process or
          absent utility events alone does not prove that no separate executor carried the task; child classification still
          needs specific carriage evidence. Without independent result capture, installation, version values, enablement,
          and disablement remain unestablished. A research profile does not expand this analytic's production result capability.
    data_requirements:
    - source_type: validated-wmi-client-trace
      name:
        zh: 已启用且逐版本验证的 WMI 客户端 Trace
        en: Enabled WMI client Trace validated per version
      channel: Microsoft-Windows-WMI-Activity/Trace
      required_fields:
      - observer_host_key
