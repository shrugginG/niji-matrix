proposed_subtechniques:
- key: B011-T1518-CHILD-INPROCESS
  schema_version: 2.0.0
  type: evasion-subtechnique
  parent_key: B011-T1518-PARENT
  name:
    zh: 进程内软件清单查询
    en: In-Process Software-Inventory Query
  summary:
    zh: 将本次软件信息调查直接放入已经执行的客户端代码，省去独立清单工具任务，并使检测转向实际请求与原始调用者。
    en: Carry this software-information inquiry directly in already executing client code without a separate inventory-utility
      task, shifting detection toward actual requests and the original caller.
  aliases: []
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 进程内软件清单查询是攻击者通过已经执行的客户端代码，程序化请求软件存在性、产品身份、版本或可得配置，而不为该次调查另起独立清单执行器的实现。它的直接目的是取得软件事实；稳定的匿迹变量是本次任务的承载位置，软件名称、查询字段和具体接口只是取得路径或信息内容。
      en: In-Process Software-Inventory Query programmatically requests software presence, product identity, versions, or
        available configuration through already executing client code without launching a separate inventory executor for
        that inquiry. Its immediate purpose is to obtain software facts. The stable evasion variable is the task's carriage
        position, while software names, requested fields, and interfaces are acquisition paths or information content.
    - zh: 进程内只描述发起请求的客户端，不能把 WMI 服务、提供方和全部计算结果放进同一进程。KGB RAT 的原始动态记录将 AntiVirusProduct 查询归于恶意客户端，并在同次画像消息中显示安全产品字符串，为软件调查提供独立的正面采用证据。成功构造请求或取得枚举器与读取具体产品值仍须分开，画像中的名称也不证明实时防护状态。
      en: In-process describes the requesting client rather than placing WMI services, providers, and all result computation
        in that process. KGB RAT's original dynamic record attributes an AntiVirusProduct inquiry to the malicious client
        and shows a security-product string in the same profiling experiment, supplying independent positive evidence for
        this software inquiry. Constructing a request or obtaining an enumerator remains distinct from reading a product value,
        and a reported name does not establish real-time protection state.
  stealth_characteristics:
    paragraphs:
    - zh: 进程内软件清单查询使一次软件画像不再以新启动 wmic 或其他库存工具的形式出现。只用这些工具创建事件标记软件调查的规则失去该任务入口，原始恶意进程却仍可被创建日志或其他传感器观察；该变化不使其身份合法，也不意味着客户端从未产生别的子进程。
      en: In-Process Software-Inventory Query prevents this profiling task from appearing as a newly launched wmic or another
        inventory utility. Rules using those creation events to mark software inquiries lose that task entry, while creation
        logs or other sensors can still observe the original malicious process. The change grants no legitimate identity and
        does not mean the client never creates children for other work.
    - zh: 软件类、命名空间、原始客户端和返回处理仍是正面痕迹。仪器化研究能够观察到该查询，说明匿迹效果针对依赖独立工具入口的模型；经验证的 WMI Trace 也可恢复请求和客户端。若防守方只有提供方加载、命名空间授权或不完整进程寿命，查询与调用者之间的关联就可能丢失；这些事件本身仍不提供实际安装清单。
      en: Software classes, namespaces, the original client, and return handling remain positive traces. Instrumentation observed
        the inquiry, so the effect concerns models dependent on separate utility entries. Validated WMI tracing can also recover
        requests and clients. Provider loads, namespace authorization, and incomplete lifetimes can leave the inquiry/caller
        association unresolved, and none independently supplies an installed-software inventory.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入需要正面证明某个软件请求由当前客户端代码承载，并有证据区分它与另起清单执行器的任务路径。静态字符串或导入、WmiPrvse 存在、程序长期运行、签名合法或没有新工具事件均不足以单独纳入。一个专为查询而新建的独立脚本或命令执行器仍是不同承载方式，不能因它内部也调用
        WMI 就自动归入。
      en: Inclusion requires positive evidence that current client code carries a particular software request and distinguishes
        that path from a separately launched inventory executor. Static strings or imports, WmiPrvse's presence, long uptime,
        legitimate signatures, and absent utility events are insufficient individually. A separate script or command executor
        launched for the inquiry remains different carriage even though it internally calls WMI.
    - zh: 查询者可以是刚开始执行的恶意程序或受控组件，不要求受信宿主、长期驻留、注入或提供方被攻陷。提供方可在其他进程中处理请求，这不改变客户端承载变量。只有直接调查软件产品时归本子项；同一客户端调查运行实例、系统属性、接口配置或网络连接仍归各自技术。
      en: The requester may be newly executing malware or a controlled component without a trusted host, long residence, injection,
        or a compromised provider. Providers can process requests in other processes without changing the client-carriage
        variable. The child concerns direct software-product inquiry; running instances, system attributes, interface configuration,
        and network connections queried by the same client retain their own technique ownership.
    - zh: 读取安全产品名称不证明其已启用、停用或被规避，读取备份登记不等于获取备份权限。按这些结果改变载荷、停用组件或破坏恢复能力属于需要独立证据的后继动作。正常的软件管理代理、兼容性库和支持应用可以采用同形程序化查询，单次接口调用不能独立证明恶意目的。
      en: Reading a security-product name establishes neither enablement, disablement, nor bypass, and reading backup registration
        does not confer backup authority. Result-conditioned payload changes, component disablement, and recovery destruction
        are later actions requiring independent evidence. Software-management agents, compatibility libraries, and support
        applications can use identical programmatic requests, so one interface call alone does not establish malicious intent.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在恶意客户端初始注册或任务准备时，操作者可使客户端自行获取部署软件线索，而不安排一次额外库存工具执行。原始 KGB RAT 实验支持针对安全产品的这种实现，但没有记录某个后继操作确由该结果触发；其恶意软件营销承诺不作为匿迹成效证据。
        en: During client registration or task preparation, an operator can have the client obtain deployment clues itself
          without arranging an extra inventory-utility execution. The original KGB RAT experiment supports this implementation
          for security products without recording a later action caused by that result. The malware's marketing promises are
          not evidence of evasion effectiveness.
      - zh: 这种选择适用于已有代码能够发起管理请求而独立诊断工具启动易受监控的环境。实际收益取决于防守观察是否停留在工具创建；有客户端级请求语义时，省去工具仍不会省去调查内容。现有实证没有覆盖所有软件种类、查询接口或操作系统，不能把概念适用范围当作全部路径均已验证。
        en: The choice applies where existing code can issue management requests and separate diagnostic launches are monitored.
          Its benefit depends on whether observation stops at utility creation; client-level request semantics preserve inquiry
          content despite removal of the utility. Current empirical evidence covers neither every software category, interface,
          nor operating system, and conceptual applicability is not validation of every path.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要控制可运行查询的客户端代码、执行身份和返回处理。WMI 路径仍受命名空间 DACL、调用令牌、客户端版本和提供方可用性限制；省去工具并不取得更广视图，也不保证在服务器上存在安全中心产品类。查询可以发生在刚启动的客户端内，不要求持续控制很久。
          en: The adversary needs control of executable query code, its identity, and return handling. WMI remains limited
            by namespace DACLs, caller tokens, client versions, and provider availability. Removing a utility grants no broader
            view or guarantee that security-center product classes exist on servers. An inquiry may occur in a newly started
            client without prolonged control.
        - zh: 客户端必须正确处理错误、枚举超时、空结果和不同软件登记范围。即使请求仅返回少量匹配项，提供方仍可能执行更广工作；采用 Win32_Product 还会承担修复副作用。实现过程的异常和阻塞可能损害原有恶意任务，因而不能把进程内承载理解为无成本的查询隐身。
          en: The client must handle errors, enumeration timeouts, empty results, and different registration coverage. Few
            matches can still entail broader provider work, and Win32_Product carries repair side effects. Exceptions or blocking
            can disrupt the client's other malicious tasks, so in-process carriage is not cost-free invisible querying.
      defender_model:
        paragraphs:
        - zh: 目标观察模型能够记录进程创建，却主要靠独立清单程序识别软件调查。补充预先启用且验证版本的 WMI Trace 与客户端所在主机的创建和终止记录后，可直接识别 AntiVirusProduct 等软件请求并恢复调用者；不能将提供方
            PID 或其父进程当作客户端，也不能把远端 PID 连到观察主机的同号进程。
          en: The target observation model records process creation but identifies software surveys chiefly through separate
            inventory programs. Pre-enabled, version-validated WMI tracing plus creation and termination on the actual client
            host can identify requests such as AntiVirusProduct and recover callers. Provider PIDs or their parents are not
            clients, and remote PIDs cannot join to same-number processes on the observer.
        - zh: 请求级遥测通常不提供产品返回行；KGB RAT 的画像字符串来自研究专用观测，不能假定为默认 EDR 字段。本批 WMI 分析仅输出请求和归属等级，运维台账与别名映射还须独立部署。查询内容覆盖充分时，独立工具入口被省去的相对优势下降；采集缺失不能反证查询没有发生。
          en: Request telemetry usually contains no returned product rows. KGB RAT's reported string comes from research instrumentation
            and is not an assumed default EDR field. This delivery's WMI analytic emits request and attribution levels only,
            with work registers and alias maps separately deployed. Better content visibility reduces the relative advantage
            of removing a utility entry, and collection gaps do not establish absence of an inquiry.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 省去独立软件查询执行器使工具创建规则缺少本次调查入口
      en: Remove a separate software-query executor so utility-creation rules lack this inquiry's entry
    analysis:
      paragraphs:
      - zh: 攻击者让已执行客户端直接请求软件清单，省去以独立命令或脚本执行器承载这次调查的步骤。结果是软件调查仍发生，但不再对应那一次预期库存工具创建；仅靠该入口的规则无法由新进程事件重建任务。原始动态研究对软件类和程序化承载给出正面观察，官方
          WMI 与 Trace 文档则界定仍然存在的请求、客户端和枚举语义，因此这里成立的是特定监控入口的缺口。
        en: The adversary has an executing client directly request inventory instead of assigning this inquiry to a separate
          command or script executor. Software surveying still occurs but lacks the expected inventory-utility creation, so
          rules dependent on that entry cannot reconstruct the task from new-process events. Original dynamic research positively
          observes the software class and programmatic carriage, while official WMI and Trace documentation bounds the remaining
          request, client, and enumeration semantics. The supported effect is a gap in one monitoring entry.
      - zh: 该因果链不要求客户端可信、存在很久或提供方也在同一进程，更不说明产品列表被加密或所有传感器无法检测。研究者已捕获查询和报告字符串，却未进行独立工具对照实验或测量漏报；真实平台差异与正常软件同形查询继续限制结论，机理置信度保持中等。
        en: This chain requires neither a trusted or long-lived client nor a provider in the same process, and establishes
          neither encrypted inventories nor inability of every sensor to detect the behavior. Researchers captured requests
          and a reported string without a controlled utility comparison or measured misses. Platform differences and similar
          benign inquiries continue to limit the conclusion, keeping mechanism confidence medium.
    evidence_keys:
    - B011-T1082-REF-KGB
    - REF-001306
    - REF-001309
    - REF-000230
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B011-T1518-DET-INVENTORY
    mitigations:
      coverage: available
      mitigation_keys:
      - B011-T1518-MIT-INVENTORY
  evidence:
    claim_keys:
    - B011-T1518-CLM-INPROCESS-EXISTENCE
    - B011-T1518-CLM-INPROCESS-BT
    - B011-T1518-CLM-KGB-REPORT
    - B011-T1518-CLM-INPROCESS-DEFENSE
    case_keys:
    - B011-T1082-CASE-KGB
    reference_keys:
    - B011-T1082-REF-KGB
    - REF-001306
    - REF-001307
    - REF-001309
    - REF-001310
    - REF-000230
    - B011-T1518-REF-INVENTORY
    - B011-T1518-REF-MSI
  research:
    limitations:
      paragraphs:
      - zh: 恶意采用的直接证据来自一个样本族的原始仪器化执行，实证信息对象是安全产品而非所有软件库存。画像字符串只确认样本报告了名称；重复值不证明三个产品，产品存在也不证明运行、启用或防护有效。查询日期、受害行业和野外使用率不能从报告其他行为的时间戳或整体讨论中补造。
        en: Direct adversarial-use evidence comes from original instrumented execution of one sample family, empirically concerning
          security products rather than every inventory type. A profile string confirms a reported name; repeated values do
          not establish three products, and presence does not establish execution, enablement, or effective protection. Inquiry
          dates, victim sectors, and field prevalence cannot be supplied from timestamps or general discussion of other behavior.
      - zh: 未取得独立工具路径与进程内路径的受控对照或实测检测率。当前直接防御仅覆盖经验证 WMI 请求与客户端归属，不覆盖所有进程内读取接口。Trace、授权与进程生命周期都不是结果日志；未来其他平台和结果仪器化必须另外声明来源与字段，并验证权限、提供方范围和副作用。
        en: There is no controlled comparison of separate-utility and in-process paths or measured detection rate. Current
          direct defense covers validated WMI requests and client attribution rather than every in-process interface. Trace,
          authorization, and process lifetimes are not result logs. Other platforms and result instrumentation require separately
          declared sources and fields plus validation of permissions, provider scope, and side effects.
