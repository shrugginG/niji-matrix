    - source_type: sysmon-client-process-lifecycle
      name:
        zh: 客户端所在主机的 Sysmon 进程生命周期
        en: Sysmon process lifetimes on the actual client host
      channel: Microsoft-Windows-Sysmon/Operational
      required_fields:
      - host_key
      - timestamp
      - event_id
      - process_guid
      - process_id
      - process_start
      - process_end
