research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
    - T1518.001
    - T1518.002
    represented_dimensions:
    - zh: 安全产品、传感器及其可得配置
      en: Security products, sensors, and their available configuration
    - zh: 备份产品及恢复相关配置
      en: Backup products and recovery-related configuration
    breadth_trigger: ordinary
    coverage_resolutions:
    - attack_ids:
      - T1518.001
      resolution: parent-core
      rationale: Security-product facts belong to the parent. Product category is not a controlled trace variable; explicit
        process, driver, service, guardrail, and impairment actions remain adjacent.
      evidence_keys:
      - REF-000639
      - B011-T1518-REF-FIN12
      - B011-T1518-REF-WSC-LIST
      - B011-T1518-REF-WSC-HEALTH
    - attack_ids:
      - T1518.002
      resolution: parent-core
      rationale: FIN12 independently supports malicious backup inventory. Recovery relevance changes purpose and queried data,
        not independently supported stealth trace topology.
      evidence_keys:
      - B011-T1518-REF-FIN12
    candidate_stealth_axes_examined:
    - axis: product-category-and-state
      resolution: parent-core
      reason: Security, backup, management, version, installation, and health categories alter facts and consequences but
        have no stable independent stealth variable or sibling boundary.
      supplement_resolution: parent-core
    - axis: source-and-observation-position
      resolution: evidence-deferred
      reason: WMI, uninstall registration, MSI, file metadata, WSC, and management APIs have different visibility. The reviewed
        cases do not isolate intentional software-specific provider selection and controlled trace comparisons; tools or platforms
        alone do not justify children.
      supplement_resolution: Evidence for in-process WMI carriage is admitted; different provider, Registry, API, and platform
        categories remain insufficient by themselves.
    - axis: resident-inline-carriage
      resolution: formal
      reason: Positive software-specific query, own-client attribution, and a stated separate-query-task trace contrast are
        now established by original dynamic analysis. Client trust and residence duration are not variables.
      revised_axis_name: in-process-task-carriage
      temporary_child_key: B011-T1518-CHILD-INPROCESS
      evidence_keys: &id001
      - B011-T1082-REF-KGB
      - REF-001306
      - REF-001309
    - axis: preexisting-view-and-cache-reuse
      resolution: evidence-deferred
      reason: Software inventories naturally represent preexisting registrations. No reviewed case distinguishes deliberately
        reusing an already obtained software result from simply issuing a fresh inventory query or proves avoided provider
        work; unlike NJT-0242 local host knowledge, no explicit no-probe contrast was established.
      supplement_resolution: evidence-deferred
    - axis: timing-and-event-driven-acquisition
      resolution: evidence-deferred
      reason: No primary software-specific evidence of deliberately sparse timing, notification-driven acquisition, or request
        suppression with a distinct defender effect; periodic legitimate inventory remains a counterexample.
      supplement_resolution: evidence-deferred
    - axis: predicate-and-output-filtering
      resolution: not-stealth-distinct
      reason: Fewer columns or matching products is not necessarily reduced provider work. Win32_Product can enumerate and
        repair all MSI packages despite filtering; no measured stealth contrast supports a child.
      supplement_resolution: not-stealth-distinct
    - axis: caller-provenance-and-management-appearance
      resolution: parent-core
      reason: Borrowed inventory tooling supports a medium-confidence parent feature-disguise mechanism; the source does not
        establish a stable software-specific carrier taxonomy beyond the parent.
      supplement_resolution: parent-core
    - axis: downstream-conditional-behavior
      resolution: adjacent-technique
      reason: Analysis classification is NJT-0122, debugger evasion NJT-0106, target conditions/environmental keys NJT-0109;
        defense changes and backup destruction require separate observed actions.
      supplement_resolution: adjacent-technique
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 原始软件类别及其他候选轴的边界检查继续有效。补审以独立软件请求、客户端承载和工具创建观察差完成第二轮证据核验，原先暂缓的承载轴现建立一项子技术；其余证据不足的轴不升级，产品类别不复制为子项。
      en: The original product-category and other-axis boundary reviews remain applicable. Supplemental review independently
        verifies a software request, client carriage, and the utility-creation observation contrast, establishing one child
        on the previously deferred carrier axis. Other insufficiently evidenced axes remain unpromoted, and product categories
        are not copied as children.
    supplement: &id002
      attack_subtechnique_count: 2
      attack_subtechnique_ids:
      - T1518.001
      - T1518.002
      imported: false
      coverage_resolutions_unchanged: Both product-category children remain parent-core; the new child comes from independently
        verified client-carriage contrast.
      independent_second_pass_completed: true
      proposed_niji_child_count: 1
      breadth_gap_explained: true
  evidence_coverage:
    parent_behavior_keys:
    - B011-T1518-REF-ATTACK
    - REF-000639
    - B011-T1518-REF-FIN12
    boundary_keys:
    - B011-T1518-REF-INVENTORY
    - B011-T1518-REF-MSI
    - B011-T1518-REF-WSC-LIST
    - B011-T1518-REF-WSC-HEALTH
    - REF-001310
    - REF-001312
    mechanism_support:
    - mechanism_ref: NM-FD
      evidence_keys:
      - REF-000639
      - B011-T1518-REF-FIN12
      - B011-T1518-REF-INVENTORY
      evidence_level: Malicious use plus legitimate implementation overlap; observation-effect inference only, no measured
        misses
    child_existence_support: []
    unsupported_or_deferred:
    - Measured detection-rate changes, universal stealth intent, and success against any named EDR
    - Software-specific resident or cached-result child with controlled trace contrast
    - Guaranteed SecurityCenter2 availability or complete inventory on Windows Server
    - Per-host returned names, versions, enabled state, or disabled state in the two proposed cases
    - Equivalent implementation and telemetry semantics on Linux, macOS, ESXi, and IaaS
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已读 NJT-0001 实际父与时间稀释子项。定义分离软件事实和能力，匿迹说明普通资产外观与 MSI 残余，范围处理进程/服务/驱动及环境门控，威胁模型限定库存视图与原始客户端，防御分别处理命令和提供方查询，不按段数模仿范例。没有正式子项，故不复制父文或以产品名补齐结构。
      en: Read the actual NJT-0001 parent and temporal-dilution child. Definitions separate software facts from capability;
        stealth explains inventory appearance and MSI residue; boundaries handle process, service, driver, and environment
        gating; models constrain views and original clients; defenses distinguish commands from provider inquiries. The exemplar's
        paragraph counts are not copied, and no product-named or duplicated-prose child is created.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - Fixed-baseline reading
    - catalog searches
    - public evidence download and SHA-256 manifest
    - YAML parse and key checks
  limitations:
    paragraphs:
    - zh: 软件发现的正式实现证据仍以 Windows 为主。LunarWeb 的命令与 FIN12 的脚本没有逐主机输出和查询发生日期；新增 KGB RAT 来自原始作者的仪器化样本执行，不能推广到所有野外部署。画像消息出现安全产品字符串，仅支持样本报告该值，不能证明产品正在运行、处于启用状态、配置有效或返回了三个独立产品。
      en: Formal implementation evidence for Software Discovery remains primarily Windows-based. LunarWeb commands and FIN12's
        script lack per-host outputs and inquiry dates, while new KGB RAT evidence comes from the original authors' instrumented
        sample execution rather than all field deployments. A security-product string in a profile message shows what the
        sample reported, not a running or enabled product, effective configuration, or three independent returned products.
    - zh: 父级外观相似与进程内工具入口省去是不同机理，二者均无实测检测率或跨产品对照。进程内子项并不隐藏客户端或 WMI 提供方，也不赋予额外读取权限；软件登记不完整、Win32_Product 副作用和健康状态语义限制继续适用。本批防御只消费请求和归属，结果确认、其他查询接口及其他平台仍需要独立数据合同与实验。
      en: Parent appearance similarity and removal of an in-process inquiry's utility entry are different mechanisms, neither
        supported by measured detection rates or cross-product comparisons. The in-process child hides neither clients nor
        WMI providers and grants no extra read rights. Incomplete registration, Win32_Product side effects, and health-state
        limits still apply. This delivery's defenses consume requests and attribution only; result confirmation, other inquiry
        interfaces, and other platforms require separate data contracts and experiments.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason: Sparse output or product filtering is not evidence of temporally or spatially diluted work, and Win32_Product
      provides a concrete counterexample.
  - mechanism_ref: NM-DO
    reason: Inventory access and documented result limitations are not evidence of encryption or obscuration of the discovery
      content.
  open_questions:
  - Primary reviewer must converge shared REF identities across all five handoffs, including future Lunar and Microsoft overlaps.
  - Validate declared Sysmon and WMI XML fields on the deployment version before implementing analytics; no runtime sensor
    experiment was performed here.
  supplement_review:
    taxonomy_axis_resolution:
      axis: resident-inline-carriage
      resolution: formal
      revised_axis_name: in-process-task-carriage
      temporary_child_key: B011-T1518-CHILD-INPROCESS
      reason: Positive software-specific query, own-client attribution, and a stated separate-query-task trace contrast are
        now established by original dynamic analysis. Client trust and residence duration are not variables.
      evidence_keys: *id001
    remaining_axes:
      product-category-and-state: parent-core
      source-and-observation-position: Evidence for in-process WMI carriage is admitted; different provider, Registry, API,
        and platform categories remain insufficient by themselves.
      preexisting-view-and-cache-reuse: evidence-deferred
      timing-and-event-driven-acquisition: evidence-deferred
      predicate-and-output-filtering: not-stealth-distinct
      caller-provenance-and-management-appearance: parent-core
      downstream-conditional-behavior: adjacent-technique
    rejected_mechanism_update:
      remove_rejection: NM-BT
      reason: Earlier rejection was scoped to evidence then available; the new positive software-specific client and trace
        contrast supersedes it.
      preserve_rejections:
      - NM-ST
      - NM-DO
    breadth_review: *id002
    content_depth_review:
      compared_with_njt_0001: true
      complete_paired_child_fields: true
      candidate_specific_argumentation: true
      neighboring_text_not_name_substituted: true
      note: Software-registration and protection-state boundaries, MSI side effects, inventory authorization, and absence
        of default product results independently shape this child; system-attribute case prose is not copied.
    automation_review:
      canonical_prose_bulk_generated: false
      mechanical_uses:
      - Source and image identity checks
      - Duplicate-key rejecting YAML parse
      - Recursive strict bilingual-key and lowercase-field checks
    evidence_limitations:
    - Instrumented sample-family use rather than per-victim field prevalence
    - No independent utility-versus-inline experiment or measured detection rate
    - No guarantee of complete product inventory or effective protection
    - WMI-only direct analytic coverage without a default result feed
