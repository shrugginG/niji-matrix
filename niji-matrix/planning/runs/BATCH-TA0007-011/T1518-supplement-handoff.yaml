recommendation:
  decision: retain
  admission_confidence: high
  proposed_niji_child_count: 1
  taxonomy_coverage: established
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: 本次补审改变先前对子技术的暂缓结论。Group-IB 的 KGB RAT 原始动态研究将 AntiVirusProduct 请求明确归于恶意程序自己的查询代码，并说明该次调查没有对应独立查询命令或子进程；仪器化记录同时保留查询语义与画像消息中的安全产品字符串。这不再只是接口存在或日志缺失，而是软件信息对象、客户端承载与独立工具观察差的正面关联，足以建立一项以查询任务承载位置为变量的原生子技术。
        en: This supplement changes the earlier deferred-child conclusion. Group-IB's original KGB RAT dynamic research explicitly attributes AntiVirusProduct requests to the malware's query code and states that the inquiry has no corresponding separate query command or child process. Instrumentation preserves query semantics and a security-product string in the profile message. This positively associates the software information object, client carriage, and separate-tool observation difference rather than merely showing interface availability or missing logs, supporting one native child partitioned by inquiry-task carriage.
      - zh: 父级仍保留软件存在、版本和可得配置的范围。新子项不按安全软件类别划分，也不要求查询者合法签名、受信或长期驻留；它只约束这次调查由已执行的客户端直接承载而省去独立查询执行器。来源和画像案例精确复用 T1082 研究中的同一出版物与同一实验，避免将一次观察复制成两个案例。NM-BT 的观察差保持中等置信，防护启用、运行和实际规避率仍未被证明。
        en: The parent retains software presence, versions, and available configuration. The child is not partitioned by the security-software category and requires neither a legitimate signature, trust, nor long residence. It concerns direct carriage of this inquiry by an executing client without a separate query executor. Reuse the exact publication and experiment case from T1082 rather than duplicating one observation into two cases. The NM-BT observation difference remains medium-confidence, while enabled protection, execution state, and actual evasion rates remain unestablished.
parent_revisions:
  summary:
    zh: 调查已访问环境的软件存在性、版本与配置，并可借用资产盘点外观或在既有客户端内直接查询，降低调查目的与任务入口的可识别性。
    en: Survey software presence, versions, and configuration in an accessed environment, potentially borrowing inventory appearance or querying directly within an existing client to reduce recognition of the inquiry's purpose and task entry point.
  stealth_characteristics:
    paragraphs:
      - zh: 软件发现使用补丁核查、兼容性评估和支持工作也需要的软件清单接口。恶意操作者借用相同工具、软件类和请求字段时，单个正常工具事件难以解释其未经授权的调查目的；工具签名与系统路径不能代替工作授权。参数中的实际信息范围、原始主体和对应任务仍可用于区分。
        en: Software Discovery uses inventory interfaces also needed for patch checks, compatibility assessment, and support. When adversarial operators borrow the same tools, software classes, and fields, one ordinary-utility event poorly expresses an unauthorized inquiry's purpose. Signatures and system paths do not replace work authorization. Actual information scope in arguments, the original principal, and the corresponding work remain distinguishing context.
      - zh: 软件清单还可直接由已经执行的客户端代码取得，使一次调查不另形成 wmic 或其他清单工具的启动事件。KGB RAT 的原始动态研究为这种承载方式提供具体软件查询证据：被省去的是独立查询任务入口，而非原始恶意进程本身。WMI 查询内容、客户端身份、提供方活动和结果处理仍可能被仪器化或经配置的 Trace 观察；提供方可以位于另外的进程。
        en: Inventory can also be acquired directly by already executing client code, without a new launch event for wmic or another inventory utility for that inquiry. KGB RAT's original dynamic study supplies software-query evidence for this carriage. What is removed is a separate query-task entry point, not the original malicious process. WMI content, client identity, provider activity, and result handling remain observable through instrumentation or configured tracing, and a provider can reside in another process.
      - zh: 以上特性不意味着所有软件查询都低噪或无副作用。Win32_Product 即使带筛选也可能触发 MSI 产品枚举及一致性修复，卸载登记又可能遗漏其他用户、其他视图或便携程序。查询内容少、目标是安全产品或未见独立工具事件，都不能单独证明匿迹；需要正面客户端与请求证据，并按接口保留结果与副作用的限制。
        en: These properties do not make every inquiry quiet or side-effect-free. Win32_Product can enumerate MSI products and trigger consistency repair despite predicates, while uninstall registration can omit other users, views, or portable applications. Small requests, security-product targeting, and absence of a separate utility event do not independently establish evasion. Positive client/request evidence is needed, with interface-specific limits on results and side effects retained.
  scope_boundary_append:
    zh: 进程内软件清单查询按本次软件调查相对独立工具任务的承载位置划分。仅静态导入 WMI 类、解析 API、存在 WmiPrvse 或没有 wmic 启动不满足其准入；普通程序最终调用系统接口也不足以自动归类。软件查询、运行进程查询、硬件画像和后继环境门控即使由同一客户端连续执行，仍按各自直接信息对象与实际动作分别界定。
    en: In-Process Software-Inventory Query is partitioned by where this software inquiry is carried relative to a separate utility task. Static WMI-class imports, API resolution, the presence of WmiPrvse, and absent wmic launches are insufficient, as is the fact that ordinary programs ultimately call system interfaces. Software inquiries, running-process inquiries, hardware profiling, and later environment gating retain their own information-object and action boundaries even when one client performs them consecutively.
  application_scenarios_append:
    zh: 自动化恶意客户端还可在初始注册前自行形成软件画像，以减少为此项调查另起清单工具的步骤。KGB RAT 的仪器化执行记录支持进程内安全产品请求与画像字符串的关联，但没有证明后继载荷按某个产品结果改变行为；其对系统属性的同时调查不转作软件版本、运行或防护状态证据。
    en: An automated malicious client can assemble a software profile before registration without launching another inventory utility for that task. KGB RAT's instrumented execution links an in-process security-product request with a reported profile string, without establishing that a later payload changes behavior in response to a particular product. Simultaneous system-attribute inquiries do not establish software versions, execution, or protection state.
  attacker_model_append:
    zh: 对进程内实现，攻击者还须控制能构造请求并处理返回的客户端代码。该能力可以存在于刚开始执行的恶意程序中，不依赖长期驻留、受信宿主或注入；它不会改变命名空间权限和提供方可用性。选择不另起查询执行器可以省去对应工具边界，但仍需处理枚举、空集、超时和调用线程异常。
    en: An in-process implementation additionally requires control of client code that constructs requests and handles returns. This can exist in newly executing malware without long residence, a trusted host, or injection, and it changes neither namespace rights nor provider availability. Avoiding a separate query executor removes that utility boundary but still requires handling enumeration, empty sets, timeouts, and calling-thread faults.
  add_stealth_mechanism:
    mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 在既有客户端内承载软件查询而省去独立清单工具的观察入口
      en: Carry software inquiries inside an existing client to remove the separate-inventory-utility observation entry
    analysis:
      paragraphs:
        - zh: 攻击者把实际软件清单请求放入正在执行的客户端代码，使这次调查没有一个可由独立工具创建规则直接定位的查询进程。KGB RAT 的动态记录给出软件类、程序化调用和该工具边界未产生的具体对照，因此因果链指向查询任务入口的省去，而非笼统地把正常 API 当成匿迹。只看新工具启动的观察面可能无法恢复本次软件画像；实际请求和客户端仍存在，部署经验证的 WMI Trace 与同机生命周期关联后可恢复其归属。
          en: The adversary places an actual inventory request in executing client code, leaving this inquiry without a separate query process that a utility-creation rule can directly locate. KGB RAT's dynamic record supplies the software class, programmatic invocation, and specific contrast with an absent utility boundary. The causal chain therefore concerns removal of the query-task entry rather than treating normal APIs generally as evasive. A new-utility-only view can miss this profiling task, while requests and clients remain and can be attributed using validated WMI tracing and same-host lifetimes.
    evidence_keys:
      - B011-T1082-REF-KGB
      - REF-001306
      - REF-001309
      - REF-000230
    confidence: medium
  existing_mechanism_role_changes:
    - mechanism_ref: NM-FD
      role: secondary
      note: Preserve the reviewed parent FD causal paragraph and its existing source set; do not assign FD to the new child merely because the client uses WMI.
  subtechnique_taxonomy:
    coverage: established
    subtechnique_keys:
      - B011-T1518-CHILD-INPROCESS
    narrative:
      paragraphs:
        - zh: 本技术建立进程内软件清单查询一项匿迹子技术，稳定变量是本次软件调查由已执行的客户端直接承载，还是另起独立的清单工具任务。其观察差在于是否形成可直接标记调查的新工具入口；该划分不按安全、备份或其他产品类别，也不按某个 API 名称、合法签名或客户端运行时长成立。
          en: This technique establishes In-Process Software-Inventory Query. Its stable variable is direct carriage of this inventory task by an executing client versus launching a separate utility task. The observation difference concerns creation of a new utility entry that directly marks the inquiry. The partition is not based on security, backup, or other product categories, an API name, a legitimate signature, or client age.
        - zh: 软件登记、版本和健康状态仍是父级信息语义，不能直接变为匿迹子项。既存结果复用、低频与事件触发的取得方式仍缺少软件特定的正面痕迹对照，保持研究暂缓。查询结果引起的分析环境判断、执行护栏和防御修改由相邻技术承担；组合使用不把这些后继动作并入本次清单查询。
          en: Registration, versions, and health remain parent information semantics rather than evasion children. Reuse of prior results, sparse acquisition, and event-triggered inquiry still lack software-specific positive trace contrasts and remain deferred research. Analysis-environment judgments, execution guardrails, and defense changes based on results belong to adjacent techniques and are not absorbed into this inventory task when combined.
  append_evidence:
    claim_keys:
      - B011-T1518-CLM-INPROCESS-EXISTENCE
      - B011-T1518-CLM-INPROCESS-BT
      - B011-T1518-CLM-KGB-REPORT
      - B011-T1518-CLM-INPROCESS-DEFENSE
    case_keys:
      - B011-T1082-CASE-KGB
    reference_keys:
      - B011-T1082-REF-KGB
      - REF-001306
      - REF-001307
  research_limitations:
    paragraphs:
      - zh: 软件发现的正式实现证据仍以 Windows 为主。LunarWeb 的命令与 FIN12 的脚本没有逐主机输出和查询发生日期；新增 KGB RAT 来自原始作者的仪器化样本执行，不能推广到所有野外部署。画像消息出现安全产品字符串，仅支持样本报告该值，不能证明产品正在运行、处于启用状态、配置有效或返回了三个独立产品。
        en: Formal implementation evidence for Software Discovery remains primarily Windows-based. LunarWeb commands and FIN12's script lack per-host outputs and inquiry dates, while new KGB RAT evidence comes from the original authors' instrumented sample execution rather than all field deployments. A security-product string in a profile message shows what the sample reported, not a running or enabled product, effective configuration, or three independent returned products.
      - zh: 父级外观相似与进程内工具入口省去是不同机理，二者均无实测检测率或跨产品对照。进程内子项并不隐藏客户端或 WMI 提供方，也不赋予额外读取权限；软件登记不完整、Win32_Product 副作用和健康状态语义限制继续适用。本批防御只消费请求和归属，结果确认、其他查询接口及其他平台仍需要独立数据合同与实验。
        en: Parent appearance similarity and removal of an in-process inquiry's utility entry are different mechanisms, neither supported by measured detection rates or cross-product comparisons. The in-process child hides neither clients nor WMI providers and grants no extra read rights. Incomplete registration, Win32_Product side effects, and health-state limits still apply. This delivery's defenses consume requests and attribution only; result confirmation, other inquiry interfaces, and other platforms require separate data contracts and experiments.
proposed_subtechniques:
  - key: B011-T1518-CHILD-INPROCESS
    schema_version: "2.0.0"
    type: evasion-subtechnique
    parent_key: B011-T1518-PARENT
    name:
      zh: 进程内软件清单查询
      en: In-Process Software-Inventory Query
    summary:
      zh: 将本次软件信息调查直接放入已经执行的客户端代码，省去独立清单工具任务，并使检测转向实际请求与原始调用者。
      en: Carry this software-information inquiry directly in already executing client code without a separate inventory-utility task, shifting detection toward actual requests and the original caller.
    aliases: []
    lineage:
      attck_subtechnique_inherited: false
    definition_and_concept:
      paragraphs:
        - zh: 进程内软件清单查询是攻击者通过已经执行的客户端代码，程序化请求软件存在性、产品身份、版本或可得配置，而不为该次调查另起独立清单执行器的实现。它的直接目的是取得软件事实；稳定的匿迹变量是本次任务的承载位置，软件名称、查询字段和具体接口只是取得路径或信息内容。
          en: In-Process Software-Inventory Query programmatically requests software presence, product identity, versions, or available configuration through already executing client code without launching a separate inventory executor for that inquiry. Its immediate purpose is to obtain software facts. The stable evasion variable is the task's carriage position, while software names, requested fields, and interfaces are acquisition paths or information content.
        - zh: 进程内只描述发起请求的客户端，不能把 WMI 服务、提供方和全部计算结果放进同一进程。KGB RAT 的原始动态记录将 AntiVirusProduct 查询归于恶意客户端，并在同次画像消息中显示安全产品字符串，为软件调查提供独立的正面采用证据。成功构造请求或取得枚举器与读取具体产品值仍须分开，画像中的名称也不证明实时防护状态。
          en: In-process describes the requesting client rather than placing WMI services, providers, and all result computation in that process. KGB RAT's original dynamic record attributes an AntiVirusProduct inquiry to the malicious client and shows a security-product string in the same profiling experiment, supplying independent positive evidence for this software inquiry. Constructing a request or obtaining an enumerator remains distinct from reading a product value, and a reported name does not establish real-time protection state.
    stealth_characteristics:
      paragraphs:
        - zh: 进程内软件清单查询使一次软件画像不再以新启动 wmic 或其他库存工具的形式出现。只用这些工具创建事件标记软件调查的规则失去该任务入口，原始恶意进程却仍可被创建日志或其他传感器观察；该变化不使其身份合法，也不意味着客户端从未产生别的子进程。
          en: In-Process Software-Inventory Query prevents this profiling task from appearing as a newly launched wmic or another inventory utility. Rules using those creation events to mark software inquiries lose that task entry, while creation logs or other sensors can still observe the original malicious process. The change grants no legitimate identity and does not mean the client never creates children for other work.
        - zh: 软件类、命名空间、原始客户端和返回处理仍是正面痕迹。仪器化研究能够观察到该查询，说明匿迹效果针对依赖独立工具入口的模型；经验证的 WMI Trace 也可恢复请求和客户端。若防守方只有提供方加载、命名空间授权或不完整进程寿命，查询与调用者之间的关联就可能丢失；这些事件本身仍不提供实际安装清单。
          en: Software classes, namespaces, the original client, and return handling remain positive traces. Instrumentation observed the inquiry, so the effect concerns models dependent on separate utility entries. Validated WMI tracing can also recover requests and clients. Provider loads, namespace authorization, and incomplete lifetimes can leave the inquiry/caller association unresolved, and none independently supplies an installed-software inventory.
    scope_boundary_definition:
      paragraphs:
        - zh: 纳入需要正面证明某个软件请求由当前客户端代码承载，并有证据区分它与另起清单执行器的任务路径。静态字符串或导入、WmiPrvse 存在、程序长期运行、签名合法或没有新工具事件均不足以单独纳入。一个专为查询而新建的独立脚本或命令执行器仍是不同承载方式，不能因它内部也调用 WMI 就自动归入。
          en: Inclusion requires positive evidence that current client code carries a particular software request and distinguishes that path from a separately launched inventory executor. Static strings or imports, WmiPrvse's presence, long uptime, legitimate signatures, and absent utility events are insufficient individually. A separate script or command executor launched for the inquiry remains different carriage even though it internally calls WMI.
        - zh: 查询者可以是刚开始执行的恶意程序或受控组件，不要求受信宿主、长期驻留、注入或提供方被攻陷。提供方可在其他进程中处理请求，这不改变客户端承载变量。只有直接调查软件产品时归本子项；同一客户端调查运行实例、系统属性、接口配置或网络连接仍归各自技术。
          en: The requester may be newly executing malware or a controlled component without a trusted host, long residence, injection, or a compromised provider. Providers can process requests in other processes without changing the client-carriage variable. The child concerns direct software-product inquiry; running instances, system attributes, interface configuration, and network connections queried by the same client retain their own technique ownership.
        - zh: 读取安全产品名称不证明其已启用、停用或被规避，读取备份登记不等于获取备份权限。按这些结果改变载荷、停用组件或破坏恢复能力属于需要独立证据的后继动作。正常的软件管理代理、兼容性库和支持应用可以采用同形程序化查询，单次接口调用不能独立证明恶意目的。
          en: Reading a security-product name establishes neither enablement, disablement, nor bypass, and reading backup registration does not confer backup authority. Result-conditioned payload changes, component disablement, and recovery destruction are later actions requiring independent evidence. Software-management agents, compatibility libraries, and support applications can use identical programmatic requests, so one interface call alone does not establish malicious intent.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: 在恶意客户端初始注册或任务准备时，操作者可使客户端自行获取部署软件线索，而不安排一次额外库存工具执行。原始 KGB RAT 实验支持针对安全产品的这种实现，但没有记录某个后继操作确由该结果触发；其恶意软件营销承诺不作为匿迹成效证据。
            en: During client registration or task preparation, an operator can have the client obtain deployment clues itself without arranging an extra inventory-utility execution. The original KGB RAT experiment supports this implementation for security products without recording a later action caused by that result. The malware's marketing promises are not evidence of evasion effectiveness.
          - zh: 这种选择适用于已有代码能够发起管理请求而独立诊断工具启动易受监控的环境。实际收益取决于防守观察是否停留在工具创建；有客户端级请求语义时，省去工具仍不会省去调查内容。现有实证没有覆盖所有软件种类、查询接口或操作系统，不能把概念适用范围当作全部路径均已验证。
            en: The choice applies where existing code can issue management requests and separate diagnostic launches are monitored. Its benefit depends on whether observation stops at utility creation; client-level request semantics preserve inquiry content despite removal of the utility. Current empirical evidence covers neither every software category, interface, nor operating system, and conceptual applicability is not validation of every path.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: 攻击者需要控制可运行查询的客户端代码、执行身份和返回处理。WMI 路径仍受命名空间 DACL、调用令牌、客户端版本和提供方可用性限制；省去工具并不取得更广视图，也不保证在服务器上存在安全中心产品类。查询可以发生在刚启动的客户端内，不要求持续控制很久。
              en: The adversary needs control of executable query code, its identity, and return handling. WMI remains limited by namespace DACLs, caller tokens, client versions, and provider availability. Removing a utility grants no broader view or guarantee that security-center product classes exist on servers. An inquiry may occur in a newly started client without prolonged control.
            - zh: 客户端必须正确处理错误、枚举超时、空结果和不同软件登记范围。即使请求仅返回少量匹配项，提供方仍可能执行更广工作；采用 Win32_Product 还会承担修复副作用。实现过程的异常和阻塞可能损害原有恶意任务，因而不能把进程内承载理解为无成本的查询隐身。
              en: The client must handle errors, enumeration timeouts, empty results, and different registration coverage. Few matches can still entail broader provider work, and Win32_Product carries repair side effects. Exceptions or blocking can disrupt the client's other malicious tasks, so in-process carriage is not cost-free invisible querying.
        defender_model:
          paragraphs:
            - zh: 目标观察模型能够记录进程创建，却主要靠独立清单程序识别软件调查。补充预先启用且验证版本的 WMI Trace 与客户端所在主机的创建和终止记录后，可直接识别 AntiVirusProduct 等软件请求并恢复调用者；不能将提供方 PID 或其父进程当作客户端，也不能把远端 PID 连到观察主机的同号进程。
              en: The target observation model records process creation but identifies software surveys chiefly through separate inventory programs. Pre-enabled, version-validated WMI tracing plus creation and termination on the actual client host can identify requests such as AntiVirusProduct and recover callers. Provider PIDs or their parents are not clients, and remote PIDs cannot join to same-number processes on the observer.
            - zh: 请求级遥测通常不提供产品返回行；KGB RAT 的画像字符串来自研究专用观测，不能假定为默认 EDR 字段。本批 WMI 分析仅输出请求和归属等级，运维台账与别名映射还须独立部署。查询内容覆盖充分时，独立工具入口被省去的相对优势下降；采集缺失不能反证查询没有发生。
              en: Request telemetry usually contains no returned product rows. KGB RAT's reported string comes from research instrumentation and is not an assumed default EDR field. This delivery's WMI analytic emits request and attribution levels only, with work registers and alias maps separately deployed. Better content visibility reduces the relative advantage of removing a utility entry, and collection gaps do not establish absence of an inquiry.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 省去独立软件查询执行器使工具创建规则缺少本次调查入口
          en: Remove a separate software-query executor so utility-creation rules lack this inquiry's entry
        analysis:
          paragraphs:
            - zh: 攻击者让已执行客户端直接请求软件清单，省去以独立命令或脚本执行器承载这次调查的步骤。结果是软件调查仍发生，但不再对应那一次预期库存工具创建；仅靠该入口的规则无法由新进程事件重建任务。原始动态研究对软件类和程序化承载给出正面观察，官方 WMI 与 Trace 文档则界定仍然存在的请求、客户端和枚举语义，因此这里成立的是特定监控入口的缺口。
              en: The adversary has an executing client directly request inventory instead of assigning this inquiry to a separate command or script executor. Software surveying still occurs but lacks the expected inventory-utility creation, so rules dependent on that entry cannot reconstruct the task from new-process events. Original dynamic research positively observes the software class and programmatic carriage, while official WMI and Trace documentation bounds the remaining request, client, and enumeration semantics. The supported effect is a gap in one monitoring entry.
            - zh: 该因果链不要求客户端可信、存在很久或提供方也在同一进程，更不说明产品列表被加密或所有传感器无法检测。研究者已捕获查询和报告字符串，却未进行独立工具对照实验或测量漏报；真实平台差异与正常软件同形查询继续限制结论，机理置信度保持中等。
              en: This chain requires neither a trusted or long-lived client nor a provider in the same process, and establishes neither encrypted inventories nor inability of every sensor to detect the behavior. Researchers captured requests and a reported string without a controlled utility comparison or measured misses. Platform differences and similar benign inquiries continue to limit the conclusion, keeping mechanism confidence medium.
        evidence_keys:
          - B011-T1082-REF-KGB
          - REF-001306
          - REF-001309
          - REF-000230
        confidence: medium
    defense:
      detections:
        coverage: available
        strategy_keys:
          - B011-T1518-DET-INVENTORY
      mitigations:
        coverage: available
        mitigation_keys:
          - B011-T1518-MIT-INVENTORY
    evidence:
      claim_keys:
        - B011-T1518-CLM-INPROCESS-EXISTENCE
        - B011-T1518-CLM-INPROCESS-BT
        - B011-T1518-CLM-KGB-REPORT
        - B011-T1518-CLM-INPROCESS-DEFENSE
      case_keys:
        - B011-T1082-CASE-KGB
      reference_keys:
        - B011-T1082-REF-KGB
        - REF-001306
        - REF-001307
        - REF-001309
        - REF-001310
        - REF-000230
        - B011-T1518-REF-INVENTORY
        - B011-T1518-REF-MSI
    research:
      limitations:
        paragraphs:
          - zh: 恶意采用的直接证据来自一个样本族的原始仪器化执行，实证信息对象是安全产品而非所有软件库存。画像字符串只确认样本报告了名称；重复值不证明三个产品，产品存在也不证明运行、启用或防护有效。查询日期、受害行业和野外使用率不能从报告其他行为的时间戳或整体讨论中补造。
            en: Direct adversarial-use evidence comes from original instrumented execution of one sample family, empirically concerning security products rather than every inventory type. A profile string confirms a reported name; repeated values do not establish three products, and presence does not establish execution, enablement, or effective protection. Inquiry dates, victim sectors, and field prevalence cannot be supplied from timestamps or general discussion of other behavior.
          - zh: 未取得独立工具路径与进程内路径的受控对照或实测检测率。当前直接防御仅覆盖经验证 WMI 请求与客户端归属，不覆盖所有进程内读取接口。Trace、授权与进程生命周期都不是结果日志；未来其他平台和结果仪器化必须另外声明来源与字段，并验证权限、提供方范围和副作用。
            en: There is no controlled comparison of separate-utility and in-process paths or measured detection rate. Current direct defense covers validated WMI requests and client attribution rather than every in-process interface. Trace, authorization, and process lifetimes are not result logs. Other platforms and result instrumentation require separately declared sources and fields plus validation of permissions, provider scope, and side effects.
    lifecycle:
      status: draft
      version: "0.1.0"
      created: "2026-11-07"
      modified: "2026-11-07"
      contributors:
        - Niji Matrix Research
      reviewers: []
defense_extensions:
  detection_strategies:
    - existing_key: B011-T1518-DET-INVENTORY
      resolution: extend
      add_detects_keys:
        - B011-T1518-CHILD-INPROCESS
      add_evidence_keys:
        - B011-T1082-REF-KGB
        - REF-001306
        - REF-001307
      description_append:
        zh: 对进程内软件清单查询，WMI 分析直接从真实软件请求入手，不要求新建库存工具。命令分析负责独立工具路径的父级覆盖；WMI 分析恢复客户端与请求但不凭缺少工具事件自动认定子项，也不把研究中的画像结果当作默认生产遥测。
        en: For In-Process Software-Inventory Query, the WMI analytic starts directly from an actual software request without requiring a newly launched inventory utility. The command analytic supplies parent coverage for separate-utility paths. WMI restores clients and requests without classifying the child solely from missing utility events or treating research profile results as default production telemetry.
  detection_analytics:
    - existing_key: B011-T1518-NJA-WMI
      resolution: extend
      data_requirements_changed: false
      add_evidence_keys:
        - B011-T1082-REF-KGB
        - REF-001306
        - REF-001307
      logic_paragraph_4_replacement:
        zh: 将软件查询对象、客户端映像、主体和目标范围与独立批准台账比较，按十分钟窗口聚合重复请求并输出 software_inventory_request、client_resolved 或 client_unknown 的证据等级。台账字段合同仍是有效负责人、明确范围与期限。实际客户端的软件请求可直接揭示进程内实施，不要求出现新库存工具；但仅归属到一个进程或未见新工具，不能自动证明任务没有另起执行器，子项归类仍需具体承载证据。没有独立结果采集时，安装、版本值、启用和关闭均保持未证实；研究画像不能升级本分析的生产结果能力。
        en: Compare software objects, client image, principal, and target scope with the independent authorization register, grouping repeated requests over ten minutes and emitting software_inventory_request with client_resolved or client_unknown evidence levels. The register still requires valid owners, explicit scope, and expiry. An actual client's software request can directly expose an in-process implementation without a new utility, but attribution to a process or absent utility events alone does not prove that no separate executor carried the task; child classification still needs specific carriage evidence. Without independent result capture, installation, version values, enablement, and disablement remain unestablished. A research profile does not expand this analytic's production result capability.
      tuning_guidance_append:
        zh: 为本子项补做两个受控样例：测试客户端内部发起一条软件查询，以及由它另起库存工具发起等价查询；核对原始客户端与查询归属的差异。该建议是上线前验证合同，未声称本研究已经实施。即使客户端刚开始执行也不得漏掉其直接查询；不要按运行时长、签名或仅看 WmiPrvse 来代理任务承载判断。不增加结果采集、C2 解析或样本代码来源作为未声明输入。
        en: For this child, issue a software query inside a test client, then have that client launch an inventory utility for an equivalent inquiry, comparing original clients and query attribution as two controlled deployment samples. This is a predeployment validation contract rather than an experiment already performed here. Retain direct inquiries even from newly executing clients. Client age, signatures, and WmiPrvse visibility do not substitute for task-carriage evidence. Add no undeclared result capture, C2 parsing, or sample-code-origin inputs.
  mitigations:
    - existing_key: B011-T1518-MIT-INVENTORY
      resolution: extend
      measures_changed: false
      add_evidence_keys:
        - B011-T1082-REF-KGB
        - REF-001306
      applications:
        - target_key: B011-T1518-CHILD-INPROCESS
          use:
            paragraphs:
              - zh: 对进程内软件清单查询，优先验证客户端级 WMI 请求采集、同机生命周期与软件查询范围，并把必要管理客户端绑定批准任务。收敛不必要的远程命名空间与专用库存读取，同时保持正常软件维护；对本地已获准客户端，避免仅阻止 wmic 或 reg 名称而宣称已经限制其代码直接读取。
                en: For In-Process Software-Inventory Query, prioritize client-level WMI request capture, same-host lifetimes, and software-query scope, binding necessary management clients to approved work. Reduce unnecessary remote namespace and dedicated-inventory reads while preserving maintenance. For an authorized local client, blocking wmic or reg names alone does not constrain its direct code reads.
          expected_effect:
            paragraphs:
              - zh: 软件调查即使没有独立工具入口，也更可能留下可归属请求，正常客户端与任务范围外读取之间更容易比较；部分远程与专用库存机会可被压缩。效果主要是补齐软件查询观察和授权语境，不是让产品元数据不可读或强迫所有程序创建查询工具。
                en: Inventory inquiries can leave attributable requests even without separate utility entries, improving comparisons between ordinary clients and reads outside their work scope. Some remote and dedicated-inventory opportunities can be reduced. The main effect is improved software-query observation and authorization context rather than unreadable product metadata or forcing every program to create a query utility.
          limitations:
            paragraphs:
              - zh: 已控制的获准客户端仍可读取其获准视图，Trace 缺失、非 WMI 接口和无法映射的远端客户端仍是盲区；脚本与应用控制不自动检查每个客户端内部的软件查询。过度限制命名空间可能破坏安全健康和部署工作，缺少结果时不能据请求日志确认某个产品状态。
                en: A compromised authorized client can still read its allowed view. Missing Trace, non-WMI interfaces, and unresolved remote clients remain gaps, and script or application controls do not automatically inspect each internal inquiry. Excessive namespace restrictions can break health and deployment work, and request logs without results cannot establish product state.
