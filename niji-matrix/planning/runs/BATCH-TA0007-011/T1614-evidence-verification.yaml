- key: B011-T1614-REF-CRIMSON
  canonical_url: https://securelist.com/transparent-tribe-part-1/98127/
  verified: true
  published: '2020-08-20'
  locator: Crimson Server version A; Main panel
  supported_fact: The controller submits the victim remote IP to the XML location endpoint and displays geographical information.
  inference_strength: Direct reverse-engineered architecture and behavior; observation-plane effect is a separate inference.
  cannot_establish: Every field lookup's response, actual device coordinates, cache lifetime, or the author's evasive design
    motive.
- key: B011-T1614-REF-CYMRU
  canonical_url: https://www.team-cymru.com/post/transparent-tribe-apt-infrastructure-mapping-1
  verified: true
  published: '2021-04-16'
  locator: C2 172.245.87.12 IP-API.COM usage
  separate_evidence_layers:
    code_analysis: Automatic IP lookup when a new victim calls into the controller; results cached; later address change can
      cause another lookup.
    network_observation: C2 172.245.87.12 connected to the location service on port 80 between 2020-12-12 and 2021-03-06.
    interpretation: Timing provides a useful new-victim clue subject to the report's traffic coverage limits.
  cannot_establish: Per-request query body or response, all bot compromise times, perfect one-query-per-device identity, indefinite
    cache validity, or reduction in detection rates.
- key: B011-T1614-REF-LOCALE
  canonical_url: https://learn.microsoft.com/en-us/windows/win32/api/winnls/nf-winnls-getlocaleinfow
  verified: true
  locator: Parameters; Return value; modern Ex API recommendation
  supported_fact: Explicit Locale and LCType select the configuration information. cchData zero is only a size query, successful
    value returns are distinct, and failure returns zero.
  version_constraint: Microsoft recommends GetLocaleInfoEx for applications on Windows Vista and later; legacy function remains
    documented.
  cannot_establish: Coordinates, physical country, caller intent, default collection, or that a call returned any value.
- key: B011-T1614-REF-UILANGUAGE
  canonical_url: https://learn.microsoft.com/en-us/windows/win32/api/winnls/nf-winnls-getuserdefaultuilanguage
  verified: true
  locator: Return value and Remarks
  supported_fact: Returns the current user's UI language identifier with documented preferred/system install-language fallback.
  version_constraint: Minimum Windows 2000 and legacy MUI behavior are explicitly documented; validate the target version.
  cannot_establish: Actual geography, current keyboard, or a successful region-specific inference.
- key: B011-T1614-REF-KEYBOARD
  canonical_url: https://learn.microsoft.com/en-us/windows/win32/api/winuser/nf-winuser-getkeyboardlayoutlist
  verified: true
  locator: Input locale identifiers; Return value
  supported_fact: Returns a current set of input-locale identifiers or a required count for nBuff zero, not device geography
    or proof of the active input language.
  cannot_establish: Physical keyboard, exact user language, national identity, or coordinates.
- key: B011-T1614-REF-TIMEZONE
  canonical_url: https://learn.microsoft.com/en-us/windows/win32/api/timezoneapi/nf-timezoneapi-getdynamictimezoneinformation
  verified: true
  locator: Return codes and configuration description
  supported_fact: Returns time-zone and dynamic daylight-saving configuration; TIME_ZONE_ID_UNKNOWN zero is a valid success
    and TIME_ZONE_ID_INVALID indicates failure.
  cannot_establish: Country, physical device position, or that every zero is a failure.
- key: B011-T1614-REF-IPAPI
  canonical_url: https://ip-api.com/docs/api:xml
  verified: true
  locator: Query, result fields, SSL, and usage limits
  supported_fact: Explicit query accepts an address or domain; omitted query uses the service-observed requester IP; query
    and status are separate returned fields; failure and rate limits exist.
  current_contract_limits: Free XML endpoint uses HTTP rather than free-tier HTTPS; 45 requests per minute; current contract
    is not evidence of actual historical response.
  cannot_establish: Actual location accuracy, actual 2020 results, or service success from an HTTP connection or HTTP 200
    alone.
- key: B011-T1614-REF-MAXMIND
  canonical_url: https://support.maxmind.com/knowledge-base/articles/maxmind-geolocation-accuracy
  rejected_alias: https://support.maxmind.com/hc/en-us/articles/4407630607131-Geolocation-Accuracy
  verified: true
  locator: Limitations to IP geolocation
  supported_fact: IP geolocation has variable accuracy and can locate a proxy or VPN server instead of the end user; it is
    not precise household or street location.
  cannot_establish: ip-api's specific accuracy, field results, or equivalence of the two providers.
- key: B011-T1614-REF-GEOAPI
  canonical_url: https://www.w3.org/TR/2024/REC-geolocation-20240614/
  verified: true
  published: '2024-06-14'
  locator: Permission; secure context; Permissions-Policy; error paths; PositionOptions maximumAge; coordinates accuracy
  supported_fact: Browser API is permission-gated, can fail, and can return a cache entry when age criteria permit. Position
    includes timestamp and accuracy semantics.
  source_internal_caution: Non-normative cache overview says default cache use, but normative PositionOptions has maximumAge
    zero; do not claim every default request reuses cache.
  cannot_establish: Malware adoption, permission bypass, native language API permission equivalence, or exact coordinates
    from any attempted call.
- key: B011-T1614-REF-INSTANCE
  canonical_url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-identity-documents.html
  verified: true
  locator: Identity-document creation, IMDS access, region and availabilityZone fields
  supported_fact: Instance identity documents expose hosting region and availability zone when retrieved via the instance
    metadata service.
  caution: The documentation's availabilityZone example resembles a region string; formal content avoids reproducing that
    example and retains distinct field semantics.
  cannot_establish: User physical location, exact data-center coordinates, permission bypass, or malicious field adoption.
- key: B011-T1614-REF-FRIDA
