- key: REF-000230
  canonical_url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  verified: true
  catalog_and_yaml_checked: true
  resolution: reuse
  locator: Sysmon v15.22; Events 1, 3, 5, 22; process GUID; configured network-event coverage
  supported_fact: Process creation, termination, connection and DNS stages can be recorded; process GUID helps avoid PID reuse;
    connection events require enablement; DNS event may occur for a cache result.
  cannot_establish: Arbitrary locale or getenv results, process stdout, successful HTTP service return, or C2 semantics.
  alias_rule: REF-000366 includes this URL only as an ancillary locator but has a different canonical URL. Reuse REF-000230
