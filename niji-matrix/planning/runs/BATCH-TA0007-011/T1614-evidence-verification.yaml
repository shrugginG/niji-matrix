- key: B011-T1614-REF-CUCKOO
  canonical_url: https://www.iru.com/blog/malware-cuckoo-infostealer-spyware
  aliases:
  - https://blog.kandji.io/malware-cuckoo-infostealer-spyware
  verified: true
  published: '2024-04-30'
  primary_source_authors:
  - Adam Kohler
  - Christopher Lopez
  locator: Locale Check and original 2024-04-24 sample-discovery introduction
  supported_fact: Original reverse engineering shows getenv called with LANG and later string truncation and comparison.
  inference_strength: Direct sample-behavior observation; locality of input acquisition strongly inferred from the documented
