mechanism_review:
  admitted_proposal:
    mechanism_ref: NM-BT
    confidence: medium
    evidence_mode: strongly-inferred
    causal_chain: Controller lookup of an already observed bot address places request and result outside victim endpoint collection;
      local function acquisition can also lack a separate process event; endpoint-only command or location-domain rules cannot
      reconstruct that semantic stage.
    direct_behavior_evidence:
    - B011-T1614-REF-CUCKOO
    - B011-T1614-REF-CRIMSON
    - B011-T1614-REF-CYMRU
    observation_contract_evidence:
    - REF-000230
    - B011-T1614-REF-FRIDA
    limitation: No measured detection change and no direct proof that evasion motivated the implementation.
  rejected:
    NM-ST: Separate endpoint and controller nodes do not by themselves establish dispersed weak signals, cadence dilution
      or threshold evasion; caching alone is not sufficient.
    NM-FD: Shared legitimate APIs or services do not establish intentional feature disguise.
    NM-DO: Encoded sample strings or HTTPS availability do not establish a content-obscuration mechanism for location acquisition.
taxonomy_review:
  formal_child_proposed: B011-T1614-CHILD-REMOTE
  control_variable: Location of inference relative to the defender's observation plane
  intentional_control_supported: Attacker controls the receiver/controller and implementation can perform address lookup there;
    evasive motivation remains unproven.
  trace_change: Victim-side direct GeoIP request absent for this controller lookup; corresponding request/result exist at
    the controller or service.
  defender_difference: Direct confirmation requires lawful remote artifacts or controlled simulation; enterprise endpoint
    collection alone remains indirect.
  prerequisite: Bot access/session already exists and lookup input is linked to that bot.
  independent_implementation_evidence:
  - B011-T1614-REF-CRIMSON
  - B011-T1614-REF-CYMRU
  formal_niji_child_count: 1
  not_imported_from_attack_child: true
  neighboring_ownership:
    NJT-0109: Comparing acquired geographical input to expected values and controlling core payload execution.
    NJT-0122: Classifying analysis environments and contracting or withholding malicious behavior.
    NJT-0106: Debugger observation or response.
    NJT-0241: General Registry carrier; dedicated geographical information acquisition belongs to the current direct information
      object.
  deferred_axes:
  - Cache lifetime and deliberate refresh cadence lack independent stealth evidence.
  - Location-source switching and coordinates reuse have capability but insufficient malicious stealth evidence.
  - Input fusion improves inference but lacks supported observation-difference taxonomy.
  - Tool, API, language, time zone, country, and platform are not stable stealth-variable children.
data_contracts:
  general:
    lowercase_required: true
    native_field_names_preserved_in_mapping: true
    unknowns: All expected schema keys must be present, but unavailable or inapplicable values are null with an explicit stage
      or identity state; no event family is assumed to populate fields from another family.
    clock: timestamp is collector-normalized UTC event time with source ordering preserved; five-minute/two-minute windows
      are proposed retrieval defaults, not evidence-derived malicious thresholds.
    process_identity: Use ProcessGuid where actually available. Otherwise a controlled-launch or validated process-lifetime
      producer must bind a fresh process_instance_id to host, PID and observed start, closing or marking unknown the end.
      PID alone is never a lifetime key.
    identities: user_id preserves a verified native domain-qualified user identity; no SID is invented from a display name.
      identity_valid_from/to and register valid_from/to must overlap event time; missing or ambiguous identities remain unknown.
    collection_health: Collector or parser health is a generated deployment contract, not an OS event. Unknown/failed health
      prevents absence-based conclusions. Validate all fields before enabling an analytic.
    provenance: Custom contracts are analytical implementation designs supported in feasibility by primary API documentation;
      none has been deployed in this research.
  sources:
    custom-regional-api-result:
      supporting_refs:
      - B011-T1614-REF-LOCALE
      - B011-T1614-REF-UILANGUAGE
      - B011-T1614-REF-KEYBOARD
      - B011-T1614-REF-TIMEZONE
      - B011-T1614-REF-CUCKOO
      - B011-T1614-REF-ENV
      - B011-T1614-REF-FRIDA
      deployment: Function-specific argument/return instrumentation on explicitly selected processes, with ABI and target-version
        validation.
      field_mapping:
        host_id: Collector-configured asset identity, not supplied by function return.
        process_instance_id: Validated process-lifetime producer join key, not PID.
        timestamp: Collector timestamp for the call stage.
        invocation_id: Collector-generated per-call key saved across entry and exit.
        api_name: Actual resolved target function name.
        input_kind: Function-specific normalized classification ui-language, input-locales, locale-property, time-zone, or
          inherited-environment.
        input_parameters: Original Locale/LCType/cchData, nBuff, pointer presence, or getenv name retained as nested lowercase
          fields with native parameter labels in the collector dictionary.
        return_code: Raw function return with function-specific parsing; do not apply generic zero-failure assumptions.
        result_state: Generated stage size-only, value-returned, undefined, failed, unreadable, or unknown, based on the exact
          ABI contract.
        result_value: Actual copied output buffer or returned value, never process stdout or reconstructed configuration;
          null when not returned.
        collector_version: Collector build/configuration and ABI adapter version generated by deployment.
        collector_health: Validated hook/sink/parse health generated by deployment.
      abi_notes:
        GetLocaleInfoW: cchData=0 is size-only. Parse output only after nonzero-size successful call. Preserve Locale and
          LCType because a caller-specified locale is not automatically the current user locale.
        GetUserDefaultUILanguage: Return value is LANGID with documented default/fallback semantics.
        GetKeyboardLayoutList: nBuff=0 returns required element count only; successful nonzero buffer contains current input-locale
          identifiers, not proof of active layout.
        GetDynamicTimeZoneInformation: Zero may be TIME_ZONE_ID_UNKNOWN success. TIME_ZONE_ID_INVALID is failure; output struct
          carries settings, not physical position.
        getenv: Capture allowed name and return string immediately if pointer is readable; undefined yields null. A copied
          or directly accessed environment value may bypass the hook.
    process-lifetime-map:
      supporting_refs:
      - REF-000230
      - B011-T1614-REF-FRIDA
      deployment: Windows can use validated Sysmon process GUID and creation/termination. Other platforms require controlled
        launch or validated local identity collection; Frida Process.id alone supplies only PID.
      field_mapping:
        host_id: Collector-managed asset identity.
        process_instance_id: Producer-assigned lifetime identity; Windows native ProcessGuid when available.
        process_id: Native ProcessId or Frida Process.id; never used alone as key.
        image: Native Image or a validated process image captured by the controlled-launch producer.
        user_id: Verified execution identity from native User or controlled-launch manifest; unknown if not verified.
        start_time: Observed creation time from Event 1 UtcTime or validated launch.
        end_time: Event 5 UtcTime or validated exit; null when still alive or unobserved.
        identity_valid_from: Producer's beginning of validated identity interval, not a guessed start.
        identity_valid_to: Producer's end of validated identity interval, null if open; identity gaps remain unknown.
    regional-read-purpose-register:
      supporting_refs:
      - B011-T1614-REF-GEOAPI
      - B011-T1614-REF-FRIDA
      deployment: Organization-maintained business-purpose and authorization source; a normative deployment requirement rather
        than telemetry promised by these sources.
      field_mapping:
        host_id: Registered applicable asset identity or explicit scoped asset group expanded by the producer.
        image: Exact registered application identity under the same normalization as the process producer.
        user_id: Registered domain-qualified caller identity under the same normalization as runtime mapping.
        allowed_input_kind: Explicit approved input class or endpoint-location service role; no all-APIs wildcard by signer.
        business_purpose: Maintained business role explanation owned by the organization.
        valid_from: Authorization start, inclusive.
        valid_to: Authorization expiry, exclusive; no implicit permanent allowance.
      matching: Exact host/image/user/input-kind scope with event time inside validity; absent or expired records do not become
        a successful match.
    sysmon-process-lifetime:
      supporting_refs:
      - REF-000230
      channel: Microsoft-Windows-Sysmon/Operational
      field_mapping:
        host_id: Event System Computer reconciled to managed asset identity.
        event_id: Event System EventID 1 or 5.
        timestamp: EventData UtcTime.
        process_instance_id: EventData ProcessGuid.
        image: EventData Image, primarily creation context.
        user_id: EventData User on applicable event; preserve verified creation identity on the same ProcessGuid and mark
          unknown when unavailable.
        start_time: UtcTime on Event 1, assembled into a lifetime record.
        end_time: UtcTime on Event 5, null if not observed; no end synthesized from a reused PID.
    sysmon-network-connection:
      supporting_refs:
      - REF-000230
      channel: Microsoft-Windows-Sysmon/Operational
      deployment: Explicitly enable and validate Event 3, which is disabled by default.
      field_mapping:
        host_id: Event System Computer reconciled to asset.
        timestamp: EventData UtcTime.
        process_instance_id: EventData ProcessGuid.
        destination_ip: EventData DestinationIp.
        destination_port: EventData DestinationPort.
      supported_stage: Connection only; neither URL nor service return.
    sysmon-dns-query:
      supporting_refs:
      - REF-000230
      channel: Microsoft-Windows-Sysmon/Operational
      field_mapping:
        host_id: Event System Computer reconciled to asset.
        timestamp: EventData UtcTime.
        process_instance_id: EventData ProcessGuid.
        query_name: EventData QueryName.
        query_status: EventData QueryStatus.
      supported_stage: DNS query only, including cached and failed paths; never HTTP or actual location acquisition.
    custom-geolocation-http-results:
      supporting_refs:
      - B011-T1614-REF-IPAPI
      - B011-T1614-REF-FRIDA
      deployment: Application instrumentation or authorized process-attributed proxy adapter that sees full request and response.
        A normal firewall or DNS feed cannot provide this contract.
      field_mapping:
        host_id: Collector asset identity.
        process_instance_id: Validated local process binding; an unattributed proxy request stays unknown.
        timestamp: Collector-observed request or return stage time.
        request_id: Collector-generated request/response key, not assumed present in public API.
        url: Observed actual HTTP request URL; absent for opaque transport.
        queried_ip: Explicit XML path input or a later actual response query field when omitted; unknown beforehand.
        http_status: Actual HTTP response status, null before response.
        service_status: XML status field success or fail; distinct from HTTP status.
        result_state: Generated resolution, connection, requested, failed, returned, or unknown based on actually observed
          stages.
        returned_query_ip: Actual XML query value, null if absent.
        returned_region: Minimal actual countryCode/region or other deployment-selected geographical output, with original
          field name retained; no physical-device interpretation.
        collector_version: Collector and parser build/configuration identity.
        collector_health: Generated deployment health signal.
      input_note: A domain-name query and self-IP omission require explicit adapter semantics; no speculative address substitution.
    lawful-controller-session-artifact:
      supporting_refs:
      - B011-T1614-REF-CRIMSON
      - B011-T1614-REF-CYMRU
      - B011-T1614-REF-FRIDA
      deployment: Lawfully seized artifacts or an authorized controlled receiver. Published reports prove feasibility, not
        availability of these raw fields in a victim enterprise.
      field_mapping:
        controller_id: Analyst-assigned identity of a preserved controller or controlled receiver instance.
        controller_version: Preserved sample version/hash or controlled receiver build; unknown when unavailable.
        bot_session_id: Proven actual receiver session identifier or generated parser key tied to its raw session artifacts;
          no fabricated bot identity.
        timestamp: Preserved session event time normalized with documented source ordering.
        observed_peer_ip: Actual receiver-observed connection peer, which may be shared or proxied.
        binding_valid_from: Observed start of session-address binding.
        binding_valid_to: Observed end of binding or unknown; never carry a stale binding across address reassignment.
        evidence_origin: Lawful acquisition category or controlled-simulation label.
        custody_id: Case/collection provenance key controlled by the investigator.
        artifact_digest: Digest of preserved raw artifact under that custody record.
        parser_version: Parser build/configuration identity.
        collector_health: Known extraction/recording status; missing raw stages remain missing.
    lawful-controller-geolocation-result:
      supporting_refs:
      - B011-T1614-REF-CRIMSON
      - B011-T1614-REF-CYMRU
      - B011-T1614-REF-IPAPI
      - B011-T1614-REF-FRIDA
      deployment: Controller call/result instrumentation or preserved request, response, or cache artifact, available only
        through lawful visibility or simulation.
      field_mapping:
        controller_id: Same preserved controller identity as session source.
        bot_session_id: Direct raw association or generated parser join proven by the preserved call/session chain; null if
          only a free-standing lookup exists.
        lookup_id: Generated per-request key linking preserved request and response, or unique cache-origin key.
        timestamp: Preserved request/return/cache-use event time.
        queried_ip: Observed explicit address in XML path, not inferred from timing alone.
        http_status: Actual preserved response status or null.
        service_status: Actual XML status or preserved equivalent; unknown when absent.
        result_state: Requested, returned, failed, cached, or unknown from preserved stages.
        returned_query_ip: Actual response query value or preserved origin response; null if unavailable.
        returned_region: Minimal preserved actual geographical result with original field mapping.
        cache_state: Actual hit/miss/unknown indicated by controller artifacts or validated instrumentation; no absence-based
          inference.
        result_generated_at: Original response generation/acquisition time when recoverable; unknown is never replaced by
          cache-read time.
        evidence_origin: Lawful acquisition category or controlled-simulation label.
        custody_id: Investigator provenance key.
        artifact_digest: Digest of preserved request/response/cache artifact.
        parser_version: Extractor build/configuration identity.
        collector_health: Extraction/recording status and coverage.
    optional-time-bounded-egress-attribution:
      supporting_refs:
      - B011-T1614-REF-MAXMIND
      - B011-T1614-REF-CYMRU
      deployment: Optional organizational NAT/proxy mapping or a controlled experiment manifest, joined to a session by validated
        observation. Native NAT logs do not contain bot_session_id; the mapping producer must generate and prove that join.
      field_mapping:
        asset_id: Known managed asset or explicit set of candidate assets; unknown if unresolved.
        observed_peer_ip: Actual public exit address seen for that mapping.
        bot_session_id: Proven joined session key from the lawful receiver or experiment, not invented from IP alone.
        valid_from: Observed beginning of mapping validity.
        valid_to: Observed expiry/reassignment boundary.
        attribution_state: Unique, shared, ambiguous, or unknown; retain sets for shared mapping.
      absent_behavior: The remote analytic can still report bot-session/address stages but cannot assign a unique enterprise
        asset.
mitigation_reuse:
  MIT-000162:
    canonical_yaml_read: true
    proposed_resolution: extend
    unchanged_measures:
    - role-bound-service-egress
    - intermediary-route-export
    - path-linked-response
    added_application_target: B011-T1614-CHILD-REMOTE
    controlled_surface: Enterprise callback and context-release routes only.
    cannot_claim: Control over adversary GeoIP accounts, concealment of all required source addresses, revocation of old addresses/results,
      or prevention of every external inference.
  B011-T1614-MIT-EXPOSURE:
    proposed_resolution: create
    purpose: Location permission and release auditing, separate from existing egress governance.
    native_surface: Browser position permission and result release only; plain locale inputs and controller lookups bypass
      that permission surface.
