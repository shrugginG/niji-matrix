- pointer: /proposed_content/stealth_mechanisms/0/analysis/paragraphs/1
  value:
    zh: Cuckoo 的 getenv(LANG) 与 CrimsonRAT 的控制端查询分别提供具体读取实现和恶意采用依据；其检测影响来自这些操作位置与事件合同的对照推断。查询仍可能被函数结果采集或控制端证据记录，来源并未测量目标检测器的漏报率或证明特定规避动机。地域输入怎样控制后继执行保持独立边界，不能用后继分支替代本次获取阶段的痕迹证据。
    en: Cuckoo's getenv(LANG) and CrimsonRAT's controller lookup provide concrete read implementations and evidence of malicious use. Detection implications are inferred by comparing those operation positions with event contracts. Function-result collection or controller evidence can still record the lookup, and the sources measure neither detector misses nor a particular evasion motive. How regional inputs control later execution remains a separate boundary and cannot replace trace evidence for this acquisition stage.
- pointer: /library_candidates/cases/0/time_range
  value: null
- pointer: /library_candidates/cases/0/description_zh
  value: Kandji 的 macOS Cuckoo 研究记录样本通过 getenv 读取 LANG、截取区域字符串并比较。报告于 2024 年 4 月发现样本，但没有给这次具体读取提供可独立确认的操作时间，因此本案例不把发现日期写成执行日期。该观察支持语言输入读取实现，既不证明设备物理位置，也不证明此路径的检测率；随后地区条件分支保持执行护栏的独立边界。
- pointer: /library_candidates/cases/0/description_en
  value: Kandji's macOS Cuckoo analysis records a sample reading LANG through getenv, truncating the regional string and comparing it. The sample was discovered in April 2024, but the specific read has no independently established operation time, so this case does not turn discovery date into execution date. The observation supports a language-input read implementation rather than physical device position or detector performance; the subsequent regional condition retains its separate execution-guardrail boundary.
- pointer: /defense_candidates/detection_analytics/0/logic/paragraphs/2
  append: true
  value:
    zh: 返回解码必须按函数和参数执行。GetLocaleInfoW 的 LCType 含 LOCALE_RETURN_NUMBER 时，缓冲区承载数值而不是可直接解释的语言字符串；只有成功调用且缓冲区有效时读取对应类型。GetDynamicTimeZoneInformation 的零返回可表示 TIME_ZONE_ID_UNKNOWN，不能按通用零值失败处理；TIME_ZONE_ID_INVALID 才是该接口的失败值。保留这些原始参数和返回码，不能把采集器生成的 result_state 当作未经验证的系统事件。
    en: Decode returns by function and parameters. GetLocaleInfoW with LOCALE_RETURN_NUMBER in LCType returns a numeric value rather than a directly interpretable language string; copy the appropriate type only after a successful call with a valid buffer. A zero GetDynamicTimeZoneInformation return can mean TIME_ZONE_ID_UNKNOWN and must not be treated as generic zero-value failure; TIME_ZONE_ID_INVALID is that interface's failure value. Preserve raw parameters and codes rather than treating collector-generated result_state as an unvalidated native event.
