      en: A new process accessing an identified location interface with explicit address input
    - zh: 服务成功或失败与实际返回地区字段
      en: Service success or failure and actually returned regional fields
    correlation:
      window:
        zh: 请求结果按 request_id 配对，进程上下文默认前后两分钟并延伸至其寿命边界。
        en: Pair request and result by request_id, using two minutes around process context by default and extending to its
          lifetime boundaries.
      dimensions:
      - host_id
      - process_instance_id
      - request_id
      - queried_ip
      - timestamp
    false_positives:
    - zh: 合法网络诊断、欺诈防护、地区内容与服务监控使用地址定位服务。
      en: Legitimate diagnostics, fraud prevention, regional content, and service monitoring use address-location services.
    blind_spots:
    - zh: 证书固定、未受管流量和不可见响应使分析只能停留在连接或请求阶段；控制端定位不在此覆盖。
      en: Certificate pinning, unmanaged traffic, and unavailable responses restrict output to connection or request stages;
        controller lookup is outside this coverage.
    tuning_guidance:
      paragraphs:
      - zh: 分别验证无 query、私网输入、空字段、HTTP 429、服务 fail 与代理出口。定位服务是共享正常基础设施，不能仅凭服务域阻断或认定恶意。用途登记采用有时限的精确调用角色，缺失数据必须输出覆盖不足；不要把未观察到响应替换为失败或成功。
        en: Validate omitted queries, private inputs, empty fields, HTTP 429, service failure, and proxy egress separately.
          Location services are shared legitimate infrastructure, so their domain alone establishes neither maliciousness
          nor a universal blocking rule. Use time-bounded caller roles in the purpose register and emit insufficient coverage
          when data is absent; an unobserved response is neither failure nor success.
    evidence_keys:
    - REF-000230
    - B011-T1614-REF-IPAPI
    - B011-T1614-REF-MAXMIND
    - B011-T1614-REF-FRIDA
  - temporary_key: B011-T1614-NJA-REMOTE
    strategy_key: B011-T1614-DET-REMOTE
    name:
      zh: bot 会话输入到控制端定位结果的归属分析
      en: Attribution from Bot Session Input to Controller Location Result
    summary:
      zh: 在合法取得的远端证据或受控模拟中确认卸载阶段，并保留请求未返回与缓存复用状态。
      en: Confirm offloading stages in lawfully obtained remote evidence or controlled simulation while preserving unreturned
        requests and cache reuse.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 此分析不是企业默认传感器。部署前明确证据来源为合法取得的 Crimson 类控制端工件、获授权的服务日志或隔离模拟接收器，以 evidence_origin 与 custody_id 保留来源链。会话采集产生 controller_id、bot_session_id、observed_peer_ip
          和时间；请求采集用 lookup_id 连接实际 query 地址。按控制端版本验证字段抽取器，并使用具有有效时间的会话地址绑定，不能仅按同秒出现的流量连接归因。
        en: This is not a default enterprise sensor. Before deployment, restrict evidence to lawfully obtained Crimson-like
          controller artifacts, authorized service logs, or an isolated simulated receiver, preserving provenance through
          evidence_origin and custody_id. Session collection supplies controller_id, bot_session_id, observed_peer_ip, and
          time; request collection uses lookup_id to connect the actual query address. Validate field extractors for the controller
          version and use time-bounded session-address bindings rather than attributing flows solely because they occur in
          the same second.
      - zh: 仅当 observed_peer_ip 与 queried_ip 一致且处于同一有效绑定时，输出控制端定位请求阶段；返回侧还须以 lookup_id 或保全的响应关联，证明 service_status=success、returned_query_ip
          与输入一致和实际地区字段，才能提升为地址定位结果取得。解析器若有缓存命中，则必须记录原结果的 result_generated_at、原 queried_ip 及 bot 绑定，缺少这些仅标记缓存候选。HTTP 状态、无正文外部流量和企业端回连分别保留较低证据等级，不补造返回。
        en: Report controller lookup-request stage only when observed_peer_ip equals queried_ip within the same valid binding.
          Promote it to address-location result acquisition only with a lookup_id-linked or preserved response establishing
          service_status success, returned_query_ip matching the input, and actual regional fields. A cache hit requires the
          original result_generated_at, queried_ip, and bot binding; otherwise it remains a cache candidate. HTTP status,
          content-free external flow, and enterprise callback evidence retain lower evidential stages without invented returns.
      - zh: 归属结果以地址、控制端和会话表达，不以地区标签识别唯一受害设备。共享出口产生多个 bot 时保留多重身份；若需要回连到企业资产，必须另有带 valid_from 和 valid_to 的 NAT、代理或受控实验映射，没有映射就保持
          bot 会话级。五分钟只是检索相关工件的起点，缓存读取可以跨越该窗口，不以无新请求排除本项。
        en: Express attribution by address, controller, and session, not a unique victim device identified by a region label.
          Preserve multiple identities for bots sharing an exit. Linking back to enterprise assets additionally requires time-bounded
          NAT, proxy, or controlled-experiment mappings with valid_from and valid_to; otherwise remain at bot-session level.
          Five minutes is only a starting point for artifact retrieval. Cache reads can cross that window, and absence of
          a fresh request does not exclude the behavior.
    data_requirements:
    - source_type: lawful-controller-session-artifact
      name:
        zh: 合法控制端或受控模拟会话工件
        en: Lawful Controller or Controlled-Simulation Session Artifact
      channel: null
      required_fields:
      - controller_id
      - controller_version
      - bot_session_id
      - timestamp
      - observed_peer_ip
      - binding_valid_from
      - binding_valid_to
      - evidence_origin
      - custody_id
      - artifact_digest
      - parser_version
      - collector_health
    - source_type: lawful-controller-geolocation-result
      name:
        zh: 合法控制端定位请求结果及缓存工件
        en: Lawful Controller Location Request Result and Cache Artifact
      channel: null
      required_fields:
      - controller_id
      - bot_session_id
      - lookup_id
      - timestamp
      - queried_ip
      - http_status
      - service_status
      - result_state
      - returned_query_ip
      - returned_region
      - cache_state
      - result_generated_at
      - evidence_origin
      - custody_id
      - artifact_digest
      - parser_version
      - collector_health
    - source_type: optional-time-bounded-egress-attribution
      name:
        zh: 可选的有效时间出口归属映射
        en: Optional Time-Bounded Egress Attribution Mapping
      channel: null
      required_fields:
      - asset_id
      - observed_peer_ip
      - bot_session_id
      - valid_from
      - valid_to
      - attribution_state
    observables:
    - zh: 同一 bot 会话的已见地址被提交到控制端定位请求
      en: An observed address from a bot session submitted in a controller location request
    - zh: 有查询键和生成时间的返回地区或缓存结果
      en: A returned or cached region with a lookup key and generation time
    - zh: 无返回、未知身份、共享地址和过期绑定
      en: Missing returns, unknown identities, shared addresses, and expired bindings
    correlation:
      window:
        zh: 默认五分钟检索新会话关联请求；结果以 lookup_id 配对，缓存以原生成时间与有效绑定扩展。
        en: Retrieve new-session related requests within five minutes by default; pair results by lookup_id and extend caches
          using original generation time and valid binding.
      dimensions:
      - controller_id
      - bot_session_id
      - lookup_id
      - queried_ip
      - timestamp
    false_positives:
    - zh: 获授权的远程管理、网络资产地区显示与受控研究接收器具有相同关联形态。
      en: Authorized remote management, geographical asset displays, and controlled research receivers can have the same correlation
        shape.
    blind_spots:
    - zh: 仅有企业侧端点数据不能执行直接阶段确认；不可见服务响应或未保全缓存不能证明结果取得。
      en: Enterprise endpoint data alone cannot directly confirm the stage; unavailable service responses or unpreserved cache
        cannot establish result acquisition.
    - zh: 仅按 IP 的绑定无法区分共享出口和地址重分配，缺少时间合同应降级为地址级线索。
      en: IP-only binding cannot distinguish shared egress or reassignment; missing time contracts require downgrade to address-level
        leads.
    tuning_guidance:
      paragraphs:
      - zh: 在隔离环境用自有合成 bot 地址、合法模拟响应和显式缓存复用测试解析器，包含两个 bot 共用出口、地址切换、查询失败、过期结果与工件缺失。受控测试结果不得称为在野测量；保留原始工件摘要和解析器版本。没有远端合法可见性时，将该分析标记未部署，并保留企业侧入侵调查而不声称确认卸载。
        en: Test parsers in isolation using owned synthetic bot addresses, lawful simulated responses, and explicit cache
          reuse, covering two bots sharing egress, address changes, failed queries, expired results, and missing artifacts.
          Controlled tests are not field measurements. Preserve artifact digests and parser versions. Without lawful remote
          visibility, mark this analytic undeployed and retain enterprise intrusion investigation without claiming confirmed
          offloading.
    evidence_keys:
    - B011-T1614-REF-CRIMSON
    - B011-T1614-REF-CYMRU
    - B011-T1614-REF-IPAPI
    - B011-T1614-REF-MAXMIND
    - B011-T1614-REF-FRIDA
  mitigations:
  - temporary_key: B011-T1614-MIT-EXPOSURE
    name:
      zh: 位置权限与释放审计
      en: Location Permission and Release Auditing
    summary:
      zh: 按用途约束位置权限和结果保留，并审计实际位置数据释放。
      en: Constrain location permission and result retention by purpose and audit actual release of location data.
    description:
      paragraphs:
      - zh: 本控制治理位置服务授权及其实际数据释放。组织应限制不必要位置权限，定期撤销授权，并以最少敏感数据保存请求、许可状态和结果阶段。普通语言或时区读取和外部控制端对已见地址的解释不受浏览器位置许可约束，须通过各自观察与通信控制处理。
        en: This control governs position-service permission and actual data release. Organizations should restrict unnecessary
          location permissions, revoke grants periodically, and retain minimal sensitive data for request, permission, and
          result stages. Ordinary language or time-zone reads and external controller interpretation of observed addresses
          are not governed by browser location permission and require their respective observation and communication controls.
    domains:
    - enterprise
    measures:
    - key: location-permission-scope
      name:
        zh: 收敛位置权限和保留
        en: Limit Location Permission and Retention
      description:
        paragraphs:
        - zh: 仅向明确业务来源授予浏览器或平台位置访问，定期撤销不再需要的授权，采用适当的会话有效期与 Permissions-Policy，并最小化位置结果保留。逐平台验证拒绝和撤销后的结果，不把这项权限控制套用到普通语言和时区读取。
          en: Grant browser or platform location access only to explicit business origins, revoke unneeded permissions, apply
            suitable session lifetimes and Permissions-Policy, and minimize retained results. Validate denial and revocation
            on each platform without extending these controls to ordinary language or time-zone reads.
      control_type: exposure-reduction
    - key: location-release-accountability
      name:
        zh: 位置释放阶段审计
        en: Location Release Stage Auditing
      description:
        paragraphs:
        - zh: 为获授权的位置服务记录调用来源、权限状态、请求时间、服务状态与最小必要结果，按位置数据敏感性保护并限定保留。分别验证拒绝、撤销、超时、缓存和成功返回；不能从普通进程或 DNS 日志自动补出位置结果。
          en: For authorized position services record caller origin, permission state, request time, service state, and minimal
            necessary result with sensitivity-appropriate protection and retention. Validate denial, revocation, timeout,
            caching, and successful returns separately; ordinary process or DNS logs cannot supply missing location results.
      control_type: detective-support
    applications:
    - target_key: B011-T1614-PARENT
      use:
        paragraphs:
        - zh: 对确有设备位置需求的业务实行来源限定、最小授权和定期撤销，部署经过验证的许可与结果阶段审计。可疑调用结合来源、运行进程和实际用途调查；普通语言设置保持业务所需，不通过改动设置制造位置保护假象。
          en: For businesses that need device position, restrict origins, minimize permission, revoke grants periodically,
            and deploy validated permission and result-stage auditing. Investigate suspicious calls through origin, process,
            and actual purpose while retaining ordinary language settings for business rather than creating an appearance
            of protection through configuration changes.
      expected_effect:
        paragraphs:
        - zh: 减少非业务位置数据释放并区分拒绝、超时、缓存与实际返回，使位置授权和结果读取能够追责。
          en: Reduce nonbusiness location-data release, distinguish denial, timeout, cache, and actual returns, and make position
            permission and result access accountable.
      limitations:
        paragraphs:
        - zh: 浏览器位置权限不限制普通语言或时区读取，也不限制控制端使用已见公网地址查询 GeoIP。被用户误授予或被批准来源滥用的权限仍有风险，精确位置审计本身还需敏感数据最小化与受限保留。
          en: Browser location permission restricts neither ordinary language or time-zone reads nor controller GeoIP lookup
            using an already observed public address. Mistaken grants and abuse by approved origins remain risks, while precise-location
            auditing itself requires sensitive-data minimization and restricted retention.
    evidence_keys:
    - B011-T1614-REF-GEOAPI
    - REF-000230
    - B011-T1614-REF-IPAPI
    - B011-T1614-REF-FRIDA
