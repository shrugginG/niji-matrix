        paragraphs:
        - zh: 优先限制植入和非业务远控回连，在发现后隔离会话以减少新的 bot 地址释放；保存当时有效的出口映射，并在合法控制端调查或模拟中绑定输入与结果。企业端定位域阻断只覆盖端点主动路径，不作为卸载控制已经生效的证明。
          en: Prioritize restrictions on implant and nonbusiness remote-control callbacks and isolate discovered sessions
            to reduce fresh bot-address release. Preserve the egress mappings valid at the time and link inputs to results
            in lawful controller investigation or simulation. Enterprise location-domain blocking covers only endpoint-initiated
            paths and does not prove offloading control effectiveness.
      expected_effect:
        paragraphs:
        - zh: 降低控制端取得新地址与持续刷新定位的机会，并使合法取得的远端证据能够关联至具体会话，而不把共享出口误当唯一受害者。
          en: Reduce opportunities for the controller to obtain new addresses or refresh location and allow lawfully acquired
            remote evidence to be linked to sessions without treating shared egress as one unique victim.
      limitations:
        paragraphs:
        - zh: 已被控制端观察的地址和保存结果不能被撤回，攻击者可从企业之外继续查询。没有合法远端可见性时只能减少通信并保留间接证据，不能声称检测或阻止了每次控制端地域推断。
          en: Addresses already observed and results saved by the controller cannot be retracted, and the adversary can continue
            lookup outside the enterprise. Without lawful remote visibility, controls reduce communication and preserve indirect
            evidence but cannot claim detection or prevention of every controller inference.
