  research:
    limitations:
      paragraphs:
      - zh: 本地设置与地理位置只有间接联系，可能被用户修改或由镜像、远程会话及进程环境继承。输入读取和报告中的国家意图不能证明主机物理位置。外部服务可能返回错误、陈旧记录或代理出口；资料没有给出本研究场景的准确率、漏检率或误报率，不能引用服务商一般营销数字替代验证。
        en: Local settings relate only indirectly to geographical position and can be modified by users or inherited from
          images, remote sessions, and process environments. Reading inputs and a report's description of country intent do
          not establish physical host location. External services can return errors, stale records, or proxy egress. Sources
          provide no accuracy, miss-rate, or false-positive measurements for this research scenario, and general service marketing
          figures cannot substitute for validation.
      - zh: 恶意采用证据集中于特定样本与控制面板版本；不能推及所有 Cuckoo、CrimsonRAT 或所有定位接口。本次没有运行样本、搭建控制端或部署函数采集，检测合同是可实施设计，仍需按版本、权限、缓存、空返回和采集故障进行实测。没有远端可见性时，企业侧对卸载子项只有间接线索。
        en: Evidence of malicious use concerns particular samples and controller versions and does not generalize to every
          Cuckoo or CrimsonRAT variant or every location interface. This research did not execute samples, operate a controller,
          or deploy function collection. The analytics are implementable designs requiring validation for version, permission,
          cache, empty-return, and collector-failure conditions. Without remote visibility, enterprise observations provide
          only indirect leads for the offloading child.
proposed_subtechniques:
- temporary_key: B011-T1614-CHILD-REMOTE
  name:
    zh: 控制端地理推断卸载
    en: Controller-Side Geographical Inference Offloading
  summary:
    zh: 在 bot 已建立访问后，由控制端对其已见地址执行地理定位，使定位请求与结果位于企业端点观察面之外。
    en: After bot access exists, perform geolocation on its observed address at the controller, placing the lookup request
      and result outside the enterprise endpoint observation plane.
  aliases: []
  parent_key: B011-T1614-PARENT
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 控制端地理推断卸载是把被访问系统的位置推断计算放到攻击者控制端，并以 bot 回连时已见的地址或已取得的地域输入形成位置知识。受害系统仍参与建立访问或提供原始输入，但关键的地址到地域查询及结果解释不在该端点执行。Crimson
        Server version A 对 bot 的远端 IP 请求外部定位服务，提供了这一行为边界的具体实现。
      en: Controller-Side Geographical Inference Offloading places location-inference computation for an accessed system at
        the adversary's controller, using the address observed during a bot callback or previously acquired regional inputs.
        The victim still participates in access or supplies raw input, but the address-to-region lookup and interpretation
        do not run on that endpoint. Crimson Server version A provides a concrete implementation by submitting a bot's remote
        IP to an external location service.
    - zh: 划分变量是推断所处的观察位置，不是定位服务、报文格式或地区字段。端点直接向外部 GeoIP 服务请求属于父级常规路径；只有证明控制端代表已被访问系统执行推断，才纳入本子项。一个可疑回连、控制端访问定位网站或企业端没有定位流量，单独均不能证明该阶段成立。
      en: The variable is the observation position of inference, not the service, message format, or geographical field. An
        endpoint directly querying an external GeoIP service remains a parent-level path. This child requires evidence that
        a controller performs inference for an already accessed system. A suspicious callback, a controller visit to a location
        site, or absence of enterprise-side location traffic alone establishes no such stage.
  stealth_characteristics:
    paragraphs:
    - zh: 控制端地理推断卸载使受害企业的端点日志与出口记录不再包含定位计算的完整语义链。防守方可能看到 bot 连接，却看不到控制端随后向服务提交哪个受害地址以及得到什么地区结果。仅阻断端点访问已知定位域名或检索地区命令无法覆盖这个观察位置差异。
      en: Controller-Side Geographical Inference Offloading removes the complete semantic chain of location computation from
        victim-enterprise endpoint and egress records. Defenders may see a bot connection without seeing which victim address
        the controller later submits to a service or which regional result it receives. Blocking endpoint access to known
        location domains or searching for regional commands does not cover that observation-position difference.
    - zh: 控制端仍留下可调查的请求、结果或缓存；外部流量研究也可能建立时序关系。只有将这些远端证据与 bot 输入绑定，才可把该知识获取从普通 C2 通信中区分。现有资料证明实现和采用，但未证明有意规避的设计动机或检测效果，因此匿迹解释保持中等置信，不宣称无网络或无法检测。
      en: The controller still leaves investigable requests, results, or cache entries, and external traffic research may
        establish timing relationships. Only linking remote evidence to bot inputs distinguishes this knowledge acquisition
        from ordinary C2 communication. Available sources establish implementation and use but not evasive design intent or
        detection effectiveness, so the stealth interpretation remains medium-confidence and claims neither network silence
        nor undetectability.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入 bot 会话形成后由控制端或其定位组件对该 bot 输入执行的地域推断。控制端复用其保存结果可属于同一实现，但必须保存输入、结果生成时间和适用关系；普通缓存优化本身不另立子项。入侵前根据网页访问者地址地域投放不满足本子项的已获访问条件。
      en: The scope includes regional inference performed by a controller or its location component on a bot's input after
        the bot session exists. Reuse of a saved controller result can belong to the same implementation but requires preservation
        of the input, result-generation time, and applicability. Routine caching does not define another child. Pre-compromise
        geographical website delivery does not satisfy the access prerequisite.
    - zh: 显示国家标签不证明设备物理位置，也不证明其后的载荷门控。共享公网地址、代理和重分配使多个设备可能对应同一输入；缺少有效时间或会话映射时只能得出地址级结果，不能回填唯一终端或用户。分析环境识别与地域执行条件保持相邻技术归属。
      en: A displayed country label proves neither physical device position nor subsequent payload gating. Shared public addresses,
        proxies, and reassignment can associate multiple devices with one input. Without a valid-time or session mapping,
        the conclusion remains address-level and cannot be assigned to a unique endpoint or user. Analysis-environment classification
        and geographical execution conditions remain adjacent techniques.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 远程控制面板可在新 bot 注册时定位已见源地址，把地区信息加入目标列表，后续再由操作者决定任务。控制端具备位置查询和存储能力是前提；受害主机不必自己运行定位命令，也不必有浏览器位置服务授权。已见地址可为代理出口，因此该场景取得的仍是地址相关地域知识。
        en: A remote-control panel can locate the observed source address during new-bot registration and add geographical
          information to its target list before an operator decides later tasking. A controller capable of lookup and storage
          is required. The victim need not run a location command or hold browser location-service authorization. The observed
          address may be a proxy exit, so the knowledge remains geography associated with an address.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者控制 bot 接收端并能从会话取得对端地址，或已取得与该系统相关的输入，再向位置服务请求结果。它可选择在控制端解析和缓存，但不能由此保证服务可达、输入未被代理改变或数据仍新鲜。取得位置结果之后的任务选择不是本子项的必要步骤。
          en: The adversary controls the bot receiver and can obtain the peer address from its session or already possesses
            an input associated with the system, then requests a location result. It can choose controller-side parsing and
            caching but cannot thereby guarantee service reachability, an input unaffected by proxying, or fresh data. Task
            selection after the result is not a necessary part of this child.
      defender_model:
        paragraphs:
        - zh: 直接检测要求合法可见的控制端或受控样本接收器记录 bot 会话输入，并有对应 HTTP 请求、解析结果或缓存证据。只有企业端通信记录时不能补造远端事件。外部流量可建立连接和时间线，但在看不到请求正文或结果时须标为请求候选；时间相关不能替代地址匹配，NAT
            和动态地址须保留多重映射。
          en: Direct detection requires a lawfully visible controller or controlled-sample receiver recording bot-session
            input, together with corresponding HTTP requests, parsed results, or cache evidence. Enterprise communication
            records alone cannot supply missing remote events. External flow visibility can establish connections and timing
            but remains a request candidate without payload or result visibility. Timing correlation cannot replace address
            matching, and NAT or dynamic addresses require preservation of multiple mappings.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 在控制端执行地域查询使关键获取阶段位于企业端点直接观察范围之外
      en: Execute the regional lookup at the controller beyond direct enterprise endpoint observation
    analysis:
      paragraphs:
      - zh: 控制端利用已建立 bot 会话的地址发起定位，受害端只留下该会话的本地痕迹；查询和结果存在于另一观察域。端点侧定位服务规则因此不能重构该阶段，需要远端记录或受控重放恢复因果链。该效果直接来自观察覆盖缺口，故采用行为透明；不因端点和控制端分属两个节点就推导时空释痕。
        en: The controller initiates location lookup using the established bot session's address, leaving the victim with
          local traces of that session while lookup and result exist in another observation domain. Endpoint location-service
          rules cannot reconstruct this stage without remote records or controlled replay. The effect follows from a coverage
          gap and maps to Behavioral Transparency; two separate nodes alone do not establish Spatiotemporal Trace Dilution.
    evidence_keys:
    - B011-T1614-REF-CRIMSON
    - B011-T1614-REF-CYMRU
    - B011-T1614-REF-IPAPI
    - REF-000230
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B011-T1614-DET-REMOTE
    mitigations:
      coverage: available
      mitigation_keys:
      - MIT-000162
  evidence:
    claim_keys:
    - B011-T1614-CLM-REMOTE
    - B011-T1614-CLM-CACHE
    - B011-T1614-CLM-GEOIP
    - B011-T1614-CLM-MECHANISM
    - B011-T1614-CLM-REMOTE-DETECTION
    case_keys:
    - B011-T1614-CASE-CRIMSON
    reference_keys:
    - B011-T1614-REF-CRIMSON
    - B011-T1614-REF-CYMRU
    - B011-T1614-REF-IPAPI
    - B011-T1614-REF-MAXMIND
    - B011-T1614-REF-FRIDA
    - REF-000230
  research:
    limitations:
      paragraphs:
      - zh: 证据来自 Crimson Server version A 与特定研究窗口的外部网络观察，不证明所有控制面板均采用此路径。源 IP 关联和地区结果不是终端坐标；请求发出和流量相关不是服务成功。缓存虽有原始代码分析支持，但未公开足以普遍推定的过期规则，不能据此声称无限期有效或永远不再查询。
        en: Evidence concerns Crimson Server version A and external network observations in a specific research window, not
          all controllers. Source-IP association and regional results are not endpoint coordinates, and submitted requests
          or correlated flows are not service success. Original code analysis supports caching but publishes no generally
          applicable expiry rule, so indefinite validity or permanent absence of repeat queries cannot be claimed.
      - zh: 本次未取得在野控制端原始日志、逐请求返回或可重放样本，因此直接检测合同仍需受控验证。企业缺少远端可见性时不能独立确认本子项；这一限制应保留在检测输出，不应通过把所有未知 C2 或所有定位域访问升级为卸载来消除。
        en: This research obtained no raw field-controller logs, per-request results, or replayed sample, so the direct analytic
          contract still requires controlled validation. An enterprise without remote visibility cannot independently confirm
          this child. That limit belongs in the analytic output and must not be erased by labeling every unknown C2 connection
          or location-domain visit as offloading.
defense_candidates:
  detection_strategies:
  - temporary_key: B011-T1614-DET-LOCAL
    name:
      zh: 地域输入与定位结果获取归属
      en: Attribution of Regional-Input and Location-Result Acquisition
    summary:
      zh: 把本地地区属性读取与端点定位请求归属到具体进程，并区分尝试、返回和地理结论。
      en: Attribute local regional-property reads and endpoint location requests to processes while distinguishing attempts,
        returns, and geographical conclusions.
    description:
      paragraphs:
      - zh: 该策略分别覆盖进程内配置输入与端点直接请求外部位置服务两条路径。函数结果分析提供语言、时区和输入区域读取的语义，外联分析提供请求及位置结果的阶段证据；二者均以进程身份、批准用途和返回状态约束结论。单次普通配置读取只形成调查线索，不能直接认定恶意或真实位置。
        en: This strategy separates in-process configuration inputs from endpoint requests to an external location service.
          Function-result analysis supplies language, time-zone, and input-locale semantics, while egress analysis supplies
          request and result-stage evidence. Both constrain conclusions by process identity, approved use, and return status.
          A routine property read creates an investigation lead, not a direct finding of malice or physical location.
    detects_keys:
    - B011-T1614-PARENT
    domains:
    - enterprise
    analytic_keys:
    - B011-T1614-NJA-LOCAL
    - B011-T1614-NJA-EGRESS
    evidence_keys:
    - B011-T1614-REF-CUCKOO
    - B011-T1614-REF-LOCALE
    - B011-T1614-REF-UILANGUAGE
    - B011-T1614-REF-KEYBOARD
    - B011-T1614-REF-TIMEZONE
    - B011-T1614-REF-IPAPI
    - B011-T1614-REF-FRIDA
    - REF-000230
    - B011-T1614-REF-ENV
  - temporary_key: B011-T1614-DET-REMOTE
    name:
      zh: 控制端 bot 地址与地域查询阶段重构
      en: Reconstruction of Controller Bot-Address and Regional-Lookup Stages
    summary:
      zh: 在合法远端可见性或受控模拟中，将 bot 会话地址、定位请求及返回或缓存绑定起来。
      en: Under lawful remote visibility or controlled simulation, link bot-session addresses to location requests and returned
        or cached results.
    description:
      paragraphs:
      - zh: 该策略覆盖控制端卸载的直接证据链，而不是以企业侧缺少定位访问作为证明。分析要求 bot 会话与定位输入的实际对应关系，再分别输出请求和结果阶段；只有端点回连或外部流量时保存为间接线索。其部署适用于合法取得的控制端调查或隔离实验接收器，不假设企业可以访问攻击者服务端。
        en: This strategy covers the direct evidence chain of controller offloading rather than treating missing enterprise-side
          location access as proof. It requires an actual relationship between bot session and lookup input, then reports
          request and result stages separately. Endpoint callbacks or external flows alone remain indirect leads. Deployment
          applies to lawful controller investigation or an isolated experimental receiver and assumes no enterprise access
          to adversary servers.
    detects_keys:
    - B011-T1614-PARENT
    - B011-T1614-CHILD-REMOTE
    domains:
    - enterprise
    analytic_keys:
    - B011-T1614-NJA-REMOTE
    evidence_keys:
    - B011-T1614-REF-CRIMSON
    - B011-T1614-REF-CYMRU
    - B011-T1614-REF-IPAPI
    - B011-T1614-REF-MAXMIND
    - B011-T1614-REF-FRIDA
  detection_analytics:
  - temporary_key: B011-T1614-NJA-LOCAL
    strategy_key: B011-T1614-DET-LOCAL
    name:
      zh: 进程内地区输入返回与用途核对
      en: In-Process Regional-Input Returns and Purpose Checking
    summary:
      zh: 对部署验证过的地区函数采集核对返回内容及运行身份，输出地区输入取得线索。
      en: Check returns and execution identity from validated regional-function collection to produce regional-input acquisition
        leads.
    domains:
    - enterprise
    platforms:
    - Windows
    - Linux
    - macOS
    logic:
      paragraphs:
      - zh: 先在受控进程验证函数入口与退出采集合同。Windows 采集 GetLocaleInfoW 的 Locale、LCType、cchData、返回计数和有效输出，以及 GetUserDefaultUILanguage、GetKeyboardLayoutList
          和 GetDynamicTimeZoneInformation 的真实返回；macOS/Linux 对 getenv 只采集参数为 LANG、LC_ALL、LC_MESSAGES 或 TZ 的调用及可读取返回值。Frida
          Interceptor 的参数和返回钩子是可行实现依据，不是默认 EDR 事件；采集器必须自行产生调用键、单调时序、版本和健康信息，禁止记录无关环境秘密。
        en: First validate entry and exit collection in controlled processes. On Windows collect the actual Locale, LCType,
          cchData, return count, and valid output of GetLocaleInfoW, together with actual returns from GetUserDefaultUILanguage,
          GetKeyboardLayoutList, and GetDynamicTimeZoneInformation. On macOS and Linux, collect getenv only for LANG, LC_ALL,
          LC_MESSAGES, or TZ and readable returned values. Frida Interceptor argument and return hooks establish an implementation
          option, not default EDR events. The collector must generate invocation keys, monotonic ordering, version, and health
          records while excluding unrelated environment secrets.
      - zh: 以 host_id 与 process_instance_id 连接运行身份和有有效期的业务用途登记。相同进程五分钟内取得多个地区输入或职责外读取时输出调查候选，但只把 result_state 为 value-returned
          的记录标为已取得该输入；GetLocaleInfoW 的 cchData=0、键盘列表 nBuff=0、失败和不可读指针分别标为大小查询、失败或未知。业务用途匹配只降低优先级，不删除原始事件；不存在匹配或身份过期时保留未知。位置推断与实际物理位置不得由此自动填入。
        en: Join execution identity and a time-bounded business-purpose register using host_id and process_instance_id. Return
          an investigation candidate when one process obtains several regional inputs within five minutes or reads outside
          its recorded role. Mark an input acquired only for result_state value-returned. Treat GetLocaleInfoW cchData=0,
          keyboard-list nBuff=0, failures, and unreadable pointers as size-only, failed, or unknown stages. A business-purpose
          match lowers priority without deleting original events; missing or expired identity remains unknown. Infer neither
          geographical determination nor physical location automatically.
    data_requirements:
    - source_type: custom-regional-api-result
      name:
        zh: 经部署验证的地区函数调用结果采集
        en: Deployment-Validated Regional Function Result Collection
      channel: null
      required_fields:
      - host_id
      - process_instance_id
      - timestamp
      - invocation_id
      - api_name
      - input_kind
      - input_parameters
      - return_code
      - result_state
      - result_value
      - collector_version
      - collector_health
    - source_type: process-lifetime-map
      name:
        zh: 进程寿命与身份映射
        en: Process Lifetime and Identity Mapping
      channel: null
      required_fields:
      - host_id
      - process_instance_id
      - process_id
      - image
      - user_id
      - start_time
      - end_time
      - identity_valid_from
      - identity_valid_to
    - source_type: regional-read-purpose-register
      name:
        zh: 地区输入读取用途与有效期登记
        en: Regional-Input Read Purpose and Validity Register
      channel: null
      required_fields:
      - host_id
      - image
      - user_id
      - allowed_input_kind
      - business_purpose
      - valid_from
      - valid_to
    observables:
    - zh: 带有效输出的地区属性调用及其读取进程
      en: Regional-property calls with valid output and the reading process
    - zh: 大小探测、失败、空返回与未部署采集的区别
      en: Distinction among size probes, failures, empty returns, and absent collection
    - zh: 同一进程取得的多类地区输入与职责外读取
      en: Several regional-input classes acquired by one process and reads outside its role
    correlation:
      window:
        zh: 默认五分钟聚合输入并保留完整进程寿命；该窗口是待验证的部署起点。
        en: Aggregate inputs over five minutes by default and preserve full process lifetime; the window is a deployment starting
          point requiring validation.
      dimensions:
      - host_id
      - process_instance_id
      - invocation_id
      - input_kind
      - timestamp
    false_positives:
    - zh: 国际化界面、安装程序、时区诊断和企业管理代理正常读取。
      en: Legitimate reads by internationalized interfaces, installers, time-zone diagnostics, and management agents.
    blind_spots:
    - zh: 直接内存访问、未挂钩函数、继承值复制或采集失效不会产生该合同记录。
      en: Direct memory access, unhooked functions, copied inherited values, and collector failure produce no records under
        this contract.
    - zh: 本地读取不能单独表明地理意图，分支语境不完整时保持候选。
      en: Local reads alone do not establish geographical intent; incomplete branch context remains a candidate.
    tuning_guidance:
      paragraphs:
      - zh: 用合法多语言软件与受控样本分别验证用户默认值、多个键盘、时区返回零但成功、空环境、大小调用及采集故障。用途登记按映像、身份、输入类型和有效期约束，不按签名或解释器名称全局放行。输入值最小化保存；五分钟并非恶意阈值，也不能屏蔽单次高价值可疑读取。
        en: Validate user defaults, multiple keyboards, successful zero-valued time-zone returns, empty environments, size-only
          calls, and collection failures using legitimate multilingual software and controlled samples. Bound purpose records
          by image, identity, input kind, and validity rather than globally allowing a signer or interpreter. Minimize stored
          input values. Five minutes is not a maliciousness threshold and must not suppress a single high-value suspicious
          read.
    evidence_keys:
    - B011-T1614-REF-CUCKOO
    - B011-T1614-REF-LOCALE
    - B011-T1614-REF-UILANGUAGE
    - B011-T1614-REF-KEYBOARD
    - B011-T1614-REF-TIMEZONE
    - B011-T1614-REF-FRIDA
    - REF-000230
    - B011-T1614-REF-ENV
  - temporary_key: B011-T1614-NJA-EGRESS
    strategy_key: B011-T1614-DET-LOCAL
    name:
      zh: 端点地址定位请求与语义结果分级
      en: Staging of Endpoint Address-Location Requests and Semantic Results
    summary:
      zh: 区分定位域解析、连接、HTTP 请求和成功解析结果，避免把外联等同于取得位置。
      en: Separate location-domain resolution, connection, HTTP request, and parsed result rather than equating egress with
        acquired location.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在已启用 Sysmon Event 1、3、5、22 的 Windows 主机上，以 ProcessGuid 规范化 process_instance_id 并连接相应进程寿命。定位域 DNS 事件只输出解析阶段，Event
          3 只输出连接阶段；不能以域名或端口断定调用了定位接口。需要部署验证的应用代理或函数结果采集，用 request_id 关联 URL、请求地址输入、HTTP 状态、服务状态和有限的解析结果。没有 URL、正文或进程归属时维持较低阶段和未知身份。
        en: On Windows hosts with Sysmon Events 1, 3, 5, and 22 enabled, normalize ProcessGuid as process_instance_id and
          join the process lifetime. A location-domain DNS event yields only the resolution stage and Event 3 only the connection
          stage; domain or port does not establish a location-API request. A deployment-validated application proxy or function-result
          collector must correlate URL, address input, HTTP status, service status, and minimal parsed result using request_id.
          Missing URL, content, or process attribution retains a lower stage and unknown identity.
      - zh: 对已识别地址定位端点解析显式 query 参数；省略地址时记录 queried_ip 未知，只有服务响应的 query 才能补充。仅当实际服务状态为 success 且返回所需地区字段时输出地址定位结果取得；HTTP 200、DNS
          成功、TCP 连接、服务 fail 和限速分开保存。地区结果仅关联 queried_ip，并以用途登记检查调用进程是否超出角色，不能把 country、lat 或 lon 改写成终端实际位置。
        en: For an identified address-location endpoint, parse an explicit query input. When omitted, keep queried_ip unknown
          unless the response query value supplies it. Report address-location result acquisition only when actual service
          status is success and the required regional fields return. Preserve HTTP 200, DNS success, TCP connection, service
          failure, and throttling separately. Associate results only with queried_ip and check the caller against its purpose
          register; do not rewrite country, lat, or lon as actual endpoint position.
    data_requirements:
    - source_type: sysmon-process-lifetime
      name:
        zh: 已启用的 Sysmon 进程创建与终止事件
        en: Enabled Sysmon Process Creation and Termination Events
      channel: Microsoft-Windows-Sysmon/Operational
      required_fields:
      - host_id
      - event_id
      - timestamp
      - process_instance_id
      - image
      - user_id
      - start_time
      - end_time
    - source_type: sysmon-network-connection
      name:
        zh: 已启用的 Sysmon 网络连接事件
        en: Enabled Sysmon Network Connection Events
      channel: Microsoft-Windows-Sysmon/Operational
      required_fields:
      - host_id
      - timestamp
      - process_instance_id
      - destination_ip
      - destination_port
    - source_type: sysmon-dns-query
      name:
        zh: 已启用的 Sysmon DNS 查询事件
        en: Enabled Sysmon DNS Query Events
      channel: Microsoft-Windows-Sysmon/Operational
      required_fields:
      - host_id
      - timestamp
      - process_instance_id
      - query_name
      - query_status
    - source_type: custom-geolocation-http-results
      name:
        zh: 自定义定位 HTTP 请求与结果采集
        en: Custom Location HTTP Request and Result Collection
      channel: null
      required_fields:
      - host_id
      - process_instance_id
      - timestamp
      - request_id
      - url
      - queried_ip
