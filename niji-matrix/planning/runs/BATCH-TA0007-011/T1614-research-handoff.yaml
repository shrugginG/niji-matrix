research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 1
    attack_subtechnique_ids:
    - T1614.001
    represented_dimensions:
    - system-language-and-input-locale-as-geographical-proxies
    breadth_trigger: ordinary
    coverage_resolutions:
    - attack_subtechnique_id: T1614.001
      resolution: parent-core
      reason:
        zh: 系统语言是位置推断输入类别，不能仅按其字段或 API 复制子项；其后条件执行由 NJT-0109 负责。
        en: System language is a location-input class, not a child defined by a field or API; subsequent conditional execution
          belongs to NJT-0109.
    candidate_stealth_axes_examined:
    - axis: acquisition-observation-position
      resolution: formal-proposed
      temporary_key: B011-T1614-CHILD-REMOTE
      evidence_keys:
      - B011-T1614-REF-CRIMSON
      - B011-T1614-REF-CYMRU
      reason: Controller execution changes which observation plane contains the query and return, with independent evidence
        and a dedicated remote-artifact analytic.
    - axis: inherited-local-input-versus-live-position
      resolution: parent-core
      evidence_keys:
      - B011-T1614-REF-CUCKOO
      - B011-T1614-REF-LOCALE
      - B011-T1614-REF-GEOAPI
      reason: Different input semantics and permissions require parent explanation, but no independent evidence establishes
        a deliberate source-switching stealth child with stable sibling boundaries.
    - axis: result-cache-lifetime-and-refresh-timing
      resolution: evidence-deferred
      evidence_keys:
      - B011-T1614-REF-CYMRU
      - B011-T1614-REF-GEOAPI
      reason: Controller caching is established but no general expiry or intentional cadence-evasion behavior is published;
        browser cache capability is not malicious adoption evidence.
    - axis: process-or-tool-carrier
      resolution: not-stealth-distinct
      evidence_keys:
      - B011-T1614-REF-CUCKOO
      reason: In-process reading matters to the parent visibility contract, but API, shell, interpreter, and platform labels
        alone do not establish a stable child.
    - axis: geographical-result-fusion
      resolution: evidence-deferred
      evidence_keys:
      - B011-T1614-REF-BASELINE
      reason: No first-party evidence establishes a location-fusion child that intentionally changes defender observation
        rather than improving inference.
    - axis: location-conditioned-payload-contraction
      resolution: adjacent-technique
      evidence_keys:
      - B011-T1614-REF-CUCKOO
      adjacent_refs:
      - NJT-0109
      - NJT-0122
      - NJT-0106
      reason: Execution guardrails, analysis-environment branches, and debugger responses retain their independent ownership
        after acquisition.
    - axis: pre-compromise-server-geotargeting
      resolution: adjacent-technique
      evidence_keys:
      - B011-T1614-REF-BASELINE
      reason: No accessed bot exists in ordinary visitor screening; this is a timing and scope boundary, not a Discovery child.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 即使原 ATT&CK 仅有一项也搜索了来源、观察位置、缓存和时间、执行载体、融合及后继条件；唯一正式建议来自独立控制端证据，不是翻译 T1614.001。额外复核后 NM-ST 被拒绝，NM-BT 最符合观察面缺口。主 Agent
        仍须统一准入及子项成立性。
      en: Despite one ATT&CK child, research examined source, observation position, cache and timing, execution carrier, fusion,
        and downstream conditions. The only formal proposal comes from independent controller evidence rather than translation
        of T1614.001. An additional pass rejected NM-ST and favored NM-BT for the coverage gap. The primary must still converge
        admission and child validity.
