  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父子项分别覆盖直接对象、位置证据层级、读取和控制端语义、业务反例、已获访问前提、权限和缓存、两类防守观察面及未实测限制。防御的本地函数、端点 HTTP 和合法远端链分别制定数据合同，未以名称替换复用正文。此为研究深度自检，不代替主
        Agent 统一审查。
      en: Parent and child independently cover direct object, location-evidence levels, reading and controller semantics,
        legitimate counterexamples, access prerequisite, permission and cache, two defender planes, and unmeasured limits.
        Local-function, endpoint-HTTP, and lawful-remote analytics have separate data contracts rather than name-substituted
        prose. This is research self-review, not primary integration review.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - read-only catalog lookup
    - literal YAML handoff serialization
    - YAML parse verification
  limitations:
    paragraphs:
    - zh: 仅研究交接已完成，未分配正式身份、未运行恶意样本、未部署任何防御采集，也未修改正式库。所有部署字段和关联阈值是需实测的设计合同；正式对象在机器、Web 与人工评审完成前不得被本交接宣称发布。
      en: This completes research handoff only, with no canonical identities allocated, malware executed, defensive collection
        deployed, or canonical library modified. Deployment fields and correlation thresholds are design contracts requiring
        validation. This handoff does not declare publication before machine, Web, and human review.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason_zh: 存在两个执行节点或一次缓存复用不足以建立时空弱信号分散；没有本候选低速、跨源协同或长期阈值规避的直接证据。
    reason_en: Two execution nodes or cache reuse alone do not establish weak-signal dilution; no direct evidence establishes
      slow cadence, source coordination, or long-horizon threshold evasion here.
  - mechanism_ref: NM-FD
    reason_zh: 普通国际化读取和共享服务访问具有正常反例，但没有足够证据证明特征伪装设计。
    reason_en: Internationalization reads and shared-service access have legitimate counterparts, but evidence does not establish
      deliberate feature disguise.
  - mechanism_ref: NM-DO
    reason_zh: 没有证据把地区输入读取或控制端定位的隐蔽效果归于内容遮蔽，编码字符串也不自动证明本项获取机理。
    reason_en: Evidence does not attribute acquisition stealth to obscured content; encoded strings do not automatically establish
      this acquisition mechanism.
