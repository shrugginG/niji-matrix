extensions:
- id: REF-000625
  locator: BATCH-TA0007-011 fixed Enterprise 19.1 workbook extraction for T1518 (2 children), T1082 (0), T1614 (1), T1016 (2), and T1049 (0); see fixed-baseline-inventory.json and individual row extractions.
  notes_zh: 本批只支持五个父行为及固定清单，不支持新原生分类、机理效果或检测数据能力；不同 rolling/v19 页面建议未新增为正式来源。
  notes_en: This delivery uses the fixed publication only for the five parent behaviors and inventory, not novel native taxonomy, mechanism effects, or telemetry capabilities; distinct rolling/v19 page proposals were not added as canonical sources.
- id: REF-000025
  locator: AA24-038A Appendix A, printed page 34, observed ipconfig and netstat -ano; mistyped netstta -ano retained separately, without return tables or per-query timestamps.
  notes_zh: 新增配置与连接请求定位，不扩张既有其他阶段案例；命令表不证明同机连续执行、非空结果或进程内承载。
  notes_en: Adds configuration and connection request locators without broadening existing other-stage cases; the command table establishes neither consecutive same-host execution, nonempty results, nor in-process carriage.
- id: REF-000639
  title_zh: 往返月球的后门：Lunar 在外交使团落地
  title_en: "To the Moon and back(doors): Lunar landing in diplomatic missions"
  locator: Information collection and recovered reconnaissance package, software/security-product requests, network-adapter and connection inquiries; retain prior shared-resource and chunked-exfiltration locators.
  notes_zh: 同一原始出版物扩大书目标题和调查定位，保留既有外传等事实；命令与能力不自动证明具体返回或逐主机查询日期，Turla 归因保持来源中等置信。
  notes_en: Broadens the bibliography and inquiry locators within the same original publication while preserving earlier exfiltration facts; commands and capabilities do not establish particular returns or per-host query dates, and Turla attribution retains the source's medium confidence.
- id: REF-000626
  locator: Command 3 CollectSystemDescription OS-version capability; Anti-Analysis Environment Checks DNS resolution of api.solarwinds.com; preserve earlier C2 message and transport locators.
  notes_zh: 补充画像能力与 DNS 输入的阶段边界，不将 DNS 成功解释为任意 Internet 可达，也不复用旧消息伪装案例证明属性读取。
  notes_en: Adds profile-capability and DNS-input boundaries without treating DNS success as arbitrary Internet reachability or using an older message-disguise case to establish attribute reads.
- id: REF-000840
  locator: ABI-specific uname syscall-exit rules, execve/execveat execution collection, never-task exclusions, enabled/lost/backlog and rule-scope validation; existing file-read guidance retained.
  notes_zh: uname 成功只到系统调用层，不含返回缓冲区；执行成功不等于查询成功，uid、euid 和 auid 分别保留。
  notes_en: Successful uname reaches only the syscall level without return buffers; successful execution is not successful inquiry, and uid, euid, and auid remain distinct.
- id: REF-001331
  locator: Default ipconfig display and /all adapter configuration; preserve /displaydns, /registerdns and existing cache semantics.
  notes_zh: 扩充同一命令手册的配置展示用途；创建事件不提供返回地址，/renew 和 /release 等改变状态，不能仅归为读取。
  notes_en: Extends the same command manual to configuration display; creation events lack returned addresses, while /renew and /release change state rather than merely reading.
- id: REF-000230
  locator: Events 1 and 5 for process lifetime, 3 for configured connections, and 22 for DNS; no arbitrary API-return or inventory-result contract.
  notes_zh: 本批区分查询工具入口、WMI 原始客户端、连接所属进程与读取者，Sysmon 不补造查询返回内容；缺事件不证明读取不存在。
  notes_en: This delivery separates query-utility entry, original WMI client, socket owner, and reader; Sysmon does not supply missing query returns, and absent events do not establish absent reads.
