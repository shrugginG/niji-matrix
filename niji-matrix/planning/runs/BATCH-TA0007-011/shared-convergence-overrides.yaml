shared_object_edits:
- temporary_key: B011-T1049-MIT-STATE-READ
  fields:
    summary:
      zh: 约束网络状态调查代码来源和可见视图，并保留能够识别查询者的诊断证据。
      en: Constrain network-state inquiry code provenance and visible views while retaining diagnostic evidence identifying readers.
    description:
      paragraphs:
      - zh: 接口配置与连接状态是合法诊断和网络软件需要的基础信息。本缓解分别治理允许执行的调查代码、具体诊断作业和工作负载可见网络视图，减少未知载体取得广域网络画像的机会，并通过受保护的请求审计保留真实查询者。配置与连接采用各自的参数、返回合同和目标应用；移除显示工具不能代替这些控制，也不阻止获准程序读取其可见状态。
        en: Interface configuration and connection state are basic information for legitimate diagnostics and networking software. This mitigation separately governs executable inquiry code, concrete diagnostic jobs, and workload-visible network views, reducing opportunities for unknown carriers to obtain broad network profiles while preserving actual readers through protected request auditing. Configuration and connection reads retain distinct parameters, return contracts, and target applications. Removing display utilities cannot substitute for these controls or prevent approved programs from reading their visible state.
shared_cases:
- temporary_key: B011-T1016-CASE-VOLT-IPCONFIG
  alias_keys: [B011-T1049-CASE-VOLT]
  name_zh: Volt Typhoon 公告中的配置与连接调查请求
  name_en: Configuration and Connection Inquiry Requests in the Volt Typhoon Advisory
  actor_or_campaign: Volt Typhoon
  subject_keys: [B011-T1016-PARENT, B011-T1049-PARENT]
  description_zh: 联合公告 AA24-038A 的附录 A 在印刷页 34 列出 ipconfig 与 netstat -ano，并单独保留误拼的 netstta -ano。此案例统一保存该命令表中的网络配置与连接调查请求事实，各命令仍按直接信息对象分别归属；公告没有证明它们在同一主机或同一次会话连续执行。错误命令不当作成功，未公开的返回状态、表行、精确查询时间和受害行业保持未知，不从这些请求推出非空结果、持续对端可达性、进程内承载或成功规避检测。其他存储、身份、注册表和流量操作不并入本案例。
  description_en: Appendix A on printed page 34 of joint advisory AA24-038A lists ipconfig and netstat -ano, separately retaining the mistyped netstta -ano. This case unifies network-configuration and connection-inquiry request facts from that command table while assigning each command by its direct information object. The advisory does not establish consecutive execution on one host or in one session. The typo is not treated as success. Unpublished return status, table rows, exact query times, and victim sectors remain unknown, and the requests establish neither nonempty results, continuing peer reachability, in-process carriage, nor successful detection evasion. Storage, identity, Registry, and traffic operations remain outside this case.
  time_range: null
  target_sectors_zh: []
  target_sectors_en: []
  evidence_keys: [REF-000025]
  confidence: high
