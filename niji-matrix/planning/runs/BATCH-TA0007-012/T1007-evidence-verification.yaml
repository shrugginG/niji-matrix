  - SA.cna
  - sc_query-entry.c
  locator: Commit fd96c4dcd88fd00eea902bebb20d0736e48f5f61; SA/SA.cna L984-1016; src/SA/sc_query/entry.c L12-15, L41-77, L80-165,
    L168-203 and L206-240.
  facts:
    zh: alias通过beacon_inline_execute把sc_query交给go。枚举选SERVICE_WIN32/STATE_ALL，另一分支打开指定服务读取QueryServiceStatusEx，随后格式化返回；支持缺省本地和显式远端。
    en: The alias passes sc_query to go through beacon_inline_execute. Enumeration selects SERVICE_WIN32/STATE_ALL; another
      branch opens one service for QueryServiceStatusEx and formats returns. Local-default and explicit-remote paths exist.
  limits:
    zh: 同固定repo身份已用于tasklist和whoami，不能复制REF。仅静态核验：枚举不循环resume，错误路径可能失去部分结果；EServiceStatus只分配索引0至6而PAUSED为7，打印有边界问题，未执行验证。不能宣称所有状态健壮输出、完整库存、恶意采用或漏报率。
    en: 'The same pinned repository identity is already used for tasklist and whoami and must not be duplicated. Static verification
      only: enumeration does not loop over resume and error paths can lose partial data. EServiceStatus allocates indices0–6
      while PAUSED is7, creating a printing boundary that was not executed. Do not claim robust all-state output, complete
      inventories, malicious adoption, or miss rates.'
  supports:
  - B012-T1007-CLM-INLINE
  - B012-T1007-CLM-BT
  - B012-T1007-CLM-NATIVE
  quotation: null
