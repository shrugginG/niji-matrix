source_attack_version: '19.1'
verified_on: '2026-11-08'
verification_method:
  zh: 独立打开原始厂商报告、官方接口和项目手册，并下载固定源码逐行核对。共享REF按实际URL和出版身份复核，未将已有CLM或CASE替代原始证据。源码没有编译、加载或执行；插桩和分析只提供待部署验证的实施合同。
  en: Independently opened original vendor research, official interfaces, and project manuals, downloading and reading pinned
    source line by line. Shared references were checked by actual URLs and publication identities rather than substituting
    prior claims or cases. No code was compiled, loaded, or executed; instrumentation and analytics are implementation contracts
    requiring deployment validation.
