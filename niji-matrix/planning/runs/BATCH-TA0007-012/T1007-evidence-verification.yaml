defense_input_contract_review:
  windows:
    zh: Sysmon1/5与独立批准/健康表是全部输入，只请求不含stdout；/p先遮蔽，driver分流，混合请求不强制普通服务归属。
    en: Sysmon1/5 plus independent approval/health registers are complete inputs. Requests lack stdout; redact /p, route drivers
      separately, and do not force mixed requests into ordinary services.
  linux:
    zh: 预配置ABI执行审计、完整argv、采集器host/boot、外部批准与规则健康分开声明；success仅执行调用，PID不是永久身份。
    en: Declare configured ABI execution audits, complete argv, collector host/boot, external approvals, and rule health separately.
      Success is the execution call only, and PIDs are not permanent identity.
  wmi:
    zh: 请求Trace、客户端Sysmon生存期、时点资产别名、外部批准与健康都声明；原始XML不误认provider，结果始终未知。
    en: Declare request tracing, client Sysmon lifetimes, event-time asset aliases, external approvals, and health. Raw XML
      avoids provider confusion, with results always unknown.
  inline:
    zh: 任务入口和因果键、SCM句柄代次、API入参及即时返回、Sysmon、外部批准和插桩健康均为明确输入。生成task/call/chain键不冒称原生日志；空、错、部分与成功按实际结构/权限视图判定，未见有效token则批准未知。
    en: Explicit inputs include task entries/causal keys, SCM handle generations, API arguments/immediate returns, Sysmon,
      external approvals, and instrumentation health. Generated task/call/chain keys are not native logs. Empty, failed, partial,
      and successful states follow actual structures/authority views; without effective tokens principal-dependent approval
      remains unknown.
  mitigation_identity_review:
    zh: 独立读过MIT000093、MIT000094、MIT000251与T1033新MIT全部措施；服务执行、WMI执行、软件库存和身份句柄均不足以原样覆盖SCM/任务DACL/cron读面。本次新建更窄读视图治理，未改旧措施；T1673尚未冻结，主Agent仍需最后跨候选比较。
    en: Independently read all measures of MIT000093, MIT000094, MIT000251, and the new T1033 MIT. Service execution, WMI
      execution, software inventory, and identity handles do not cover SCM/task-DACL/cron reads unchanged. Propose a narrower
      read-view object without modifying old measures. T1673 was not yet frozen, so the primary must complete cross-candidate
      comparison.
