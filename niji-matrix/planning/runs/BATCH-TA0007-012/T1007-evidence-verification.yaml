conclusion_levels:
  capability:
    zh: GOSAR原始报告与固定sc_query代码分别支持父级恶意样本能力及内联工具设计能力，二者不能互换借证。
    en: Original GOSAR reporting and pinned sc_query code independently establish malware-parent and inline-tool design capabilities
      without transferring proof between them.
  observed_malicious_use:
    zh: 没有本候选的逐次查询结果或内联服务野外使用证据；Case只记录被分析样本的读取能力。
    en: No per-invocation results or field use of inline service inquiry were established; the case records analyzed sample
      capabilities only.
  inferred_stealth:
