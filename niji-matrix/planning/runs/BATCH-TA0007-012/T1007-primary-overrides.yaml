- pointer: /defense_candidates/detection_analytics/1/logic/paragraphs/0
  value:
    zh: 预先按实际32/64位ABI部署execve/execveat审计，确认没有never-task等规则排除。将采集器同一host_id/boot_id与msg=audit(epoch:serial)的SYSCALL、EXECVE、PROCTITLE按事件ID组合；epoch按秒转换UTC，串行号不作时间，arch、exe、pid、ppid、auid、uid、euid、ses、success和exit原样保留，EXECVE的argc/a0至aN组成argv。host_id与boot_id由采集器主机和启动元数据提供，不能由PID猜测；PROCTITLE需要按编码解码且不替代缺失参数。审计成功只说明执行系统调用成功，不含后继查询退出码和stdout。
      host_id与boot_id由采集器已认证的宿主/启动登记附加到审计记录；node可能未配置，只保留其原始可选值，不用它作为权威设备标识或补造同名主机。
    en: Preconfigure execve/execveat auditing for actual 32/64-bit ABIs and verify exclusions such as never-task. Join SYSCALL,
      EXECVE, and PROCTITLE by collector host_id/boot_id and msg=audit(epoch:serial). Convert epoch seconds to UTC without
      treating the serial as time. Retain arch, exe, pid, ppid, auid, uid, euid, ses, success, and exit; construct argv from
      EXECVE argc and a0 through aN. Supply host_id and boot_id through collector host/boot metadata rather than guessing
      from a PID. Decode PROCTITLE according to encoding without replacing missing arguments. Audit success establishes execution-syscall
      success, not the later inquiry exit code or stdout. Attach host_id and boot_id to audit records from the collector’s
      authenticated host/boot registration. node may be unconfigured; preserve it only as optional raw context rather than
      an authoritative device identity or a reason to invent a same-named host.
