recommendation:
  decision: retain
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 保留系统服务发现，因为固定19.1同时纳入服务库存和计划任务、cron库存，直接目的都是从已有运行管理登记中取得环境事实。Elastic对GOSAR的原始分析独立记录Win32_Service查询与schtasks查询能力，并把start/stop列为另一个命令；官方管理接口也将读取和变更权限分开。这足以支持父行为与边界，不能把每个被启动的命令都视为成功获得清单。
      en: Retain System Service Discovery because the fixed 19.1 scope includes service inventories together with scheduled-task
        and cron inventories, whose immediate purpose is to obtain environment facts from existing execution-management registrations.
        Elastic's original GOSAR analysis independently records Win32_Service and schtasks inquiry capabilities while listing
        start/stop as a separate command. Official management interfaces likewise distinguish read and mutation authority.
        This supports the parent behavior and boundary without treating every launched command as a successfully acquired
        inventory.
    - zh: 一个原生子项按查询任务承载位置成立：固定TrustedSec集成入口明确把具体服务查询交给既有Beacon内执行，源码连接服务API与返回格式，官方BOF文档解释省去每任务执行器的观察差。此处依据是可复核工具能力和条件化因果推断，未找到同层级野外采用或实测检测率；原生工具与常规维护的外观相似另作为父级次要机理。
      en: One native child is supported by inquiry-task carriage. Pinned TrustedSec integration explicitly executes the particular
        service inquiry inside an existing Beacon, implementation code connects service APIs with output formatting, and official
        BOF documentation explains the observation difference from per-task executors. This rests on inspectable tool capability
        and conditional causal inference, without equivalent field-adoption or measured-detection evidence. Similarity to
        ordinary maintenance utilities is a separate secondary parent mechanism.
  scope_notes:
    paragraphs:
    - zh: 包含服务注册、状态和可读配置以及Windows任务、Linux/macOS cron库存；不把服务启动、停止、修改、删除或任务执行、持久化建设置为读取。直接调查driver注册或实例归既有NJT-0180；SCM载体不改变直接对象，type=all按实际条目与消费目的分开，driver登记也不证明已加载。tasklist
        /svc的服务映射与普通进程列表分开。子项只证明具体服务查询，不自动覆盖scheduler读取或WMI客户端方式。
      en: Include service registration, status, readable configuration, Windows task inventory, and Linux/macOS cron inventory.
        Do not turn service start, stop, modification, deletion, task execution, or persistence construction into reads. Direct
        inquiries into driver registrations or instances belong to existing NJT-0180. SCM carriage does not change the direct
        object; separate type=all by actual entries and consumption purpose, without treating driver registration as loaded
        state. Separate tasklist /svc service mappings from ordinary process lists. The child establishes a particular service
        inquiry and does not automatically cover scheduler reads or WMI client carriage.
proposed_content:
  temporary_key: B012-T1007-PARENT
  name:
    zh: 系统服务发现
    en: System Service Discovery
  summary:
    zh: 读取服务及计划执行登记以调查环境，可借用维护工具外观或把服务查询留在既有任务宿主中，增加目的区分与任务归属难度。
    en: Read service and scheduled-execution registrations to survey an environment, potentially borrowing maintenance-tool
      appearance or retaining service inquiries in an existing task carrier to complicate purpose distinction and task attribution.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 系统服务发现是攻击者在取得主机或相应管理接口访问后，调查已登记服务的名称、状态、类型和可得配置，以及计划任务或cron登记的环境测绘行为。直接成果是关于可管理运行组件和计划执行安排的事实或线索，供后续选择兼容组件、调查安全工具或规划行动；查询本身不启动、停用或创建这些组件。
      en: System Service Discovery surveys registered service names, states, types, and accessible configuration, together
        with scheduled-task or cron registrations, after an adversary obtains host or relevant management-interface access.
        The direct product is a fact or lead about managed runtime components and scheduled execution, supporting later component
        compatibility, security-tool inquiries, or operational planning. The inquiry itself does not start, disable, or create
        those components.
    - zh: 服务和计划任务均通过管理视图公开登记，但登记不等于当前执行。服务可以停止、共享进程或被权限过滤，任务可以禁用或尚未触发；systemctl的已加载unit、已安装unit文件与cron的单用户表也不构成同一清单。分类依据是实际调查的服务或计划执行对象，不以工具名、服务名称中的产品字符串或后继目的代替对象语义。
      en: Services and scheduled tasks expose registrations through management views, but registration is not current execution.
        A service may be stopped, share a process, or be permission-filtered; a task may be disabled or untriggered. Loaded
        systemctl units, installed unit files, and a single user's cron table are different inventories. Classification follows
        the actual service or scheduled-execution object, rather than a tool name, a product string in a service name, or
        a later purpose.
  stealth_characteristics:
    paragraphs:
    - zh: 系统服务发现与故障诊断、补丁核查和调度维护使用相同的管理请求。选择sc、tasklist /svc、schtasks或既有管理库时，工具路径和接口外观可以与正常检查一致，使单个请求难以说明调查目的。请求类型、目标、读取范围和工作授权仍是残余区别，系统签名不使一次查询自动获得批准。
      en: System Service Discovery uses management requests also needed by troubleshooting, patch checks, and scheduling maintenance.
        Choosing sc, tasklist /svc, schtasks, or existing management libraries can make tool paths and interface appearance
        match normal checks, leaving an isolated request ambiguous about purpose. Request type, target, read scope, and work
        authorization remain distinguishing traces; a system signature does not approve an inquiry automatically.
    - zh: 把具体服务查询作为既有宿主的内联任务，会省去为此次调查创建独立服务诊断工具的边界。只观察新启动sc进程的规则因此缺少预期入口，但宿主、任务代码、SCM或WMI请求及远程管理路径仍可见。此效果针对每任务工具创建这一观察模型，不代表服务管理器无日志或查询者不可识别。
      en: Carrying a particular service inquiry as an inline task in an existing carrier removes the boundary at which a separate
        service-diagnostic utility is created for that inquiry. Rules watching newly launched sc processes consequently lose
        their expected entry, while the carrier, task code, SCM or WMI requests, and remote-management paths remain observable.
        This effect concerns per-task utility creation rather than a traceless service manager or an unidentifiable querier.
    - zh: 读取的低破坏性和返回量小不能证明匿迹成功。权限、state/type过滤、文件夹或用户范围会自然缩小清单，服务状态还可能在读取期间改变。防守方拥有查询语义与原始客户端关联时，外观相似和宿主生命周期借用的收益都会缩小；缺少输出只意味着取得结果未知。
      en: A read's limited disruption or small output does not establish successful stealth. Permissions, state/type filters,
        folder scope, and user scope naturally narrow inventories, and service states can change during a read. Query semantics
        and original-client attribution reduce the benefit of both appearance similarity and borrowed carrier lifetimes. Missing
        output means acquired results are unknown.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入对本地或有权访问的远端服务数据库、服务类和计划执行登记的只读调查，包括sc query、tasklist /svc中的服务映射、Win32_Service实例查询、systemctl服务视图、schtasks /query与crontab
        -l。远端输入目标不证明远端查询已经完成；所见登记和状态只能在其权限、manager、文件夹、用户及采集时点范围内解释。
      en: Include read-only inquiries into local or authorized remote service databases, service classes, and scheduled-execution
        registrations, including sc query, service mappings in tasklist /svc, Win32_Service instance queries, systemctl service
        views, schtasks /query, and crontab -l. A remote input target does not establish completed remote access. Interpret
        registrations and states only within their authority, manager, folder, user, and observation-time scope.
    - zh: sc的service/driver过滤与SCM服务类型必须保留。以driver注册或实例为直接对象的查询归设备驱动程序发现NJT-0180，即使经SCM取得也不重计为普通Win32服务发现；type=all混合输出按实际条目与被消费的信息目标区分。driver登记仍不能升级成驱动已加载、内核模块执行或设备属性结论。tasklist不带服务语义时归进程发现，卸载库存归软件发现，网络监听与连接状态保留各自边界。某个安全产品服务存在，也不证明该产品正在保护系统。
      en: Preserve sc service/driver filters and SCM service types. Inquiries whose direct objects are driver registrations
        or instances belong to Device Driver Discovery NJT-0180, even through SCM, rather than being counted again as ordinary
        Win32-service discovery. Separate mixed type=all output by actual entries and consumed information targets. Driver
        registration still establishes neither loaded drivers, kernel-module execution, nor device attributes. Tasklist without
        service semantics belongs to Process Discovery; uninstall inventories belong to Software Discovery, while network
        listeners and connections retain their own boundaries. A security product's service presence does not establish effective
        protection.
    - zh: 创建、删除、修改、启动、停止服务或任务，以及crontab安装、编辑和删除，属于独立变更或执行行为。服务检查后有条件地停用工具、选择目标或识别分析环境时，查询与后继动作分别判断，不能凭相邻发生就把读取升级成门控。合法监控、支持和调度审计是正常反例，过滤与权限造成的缺项也不是攻击者隐藏库存的证据。
      en: Creating, deleting, modifying, starting, or stopping services or tasks, together with crontab installation, editing,
        and removal, are separate mutation or execution actions. When a service check precedes conditional tool disabling,
        targeting, or analysis-environment identification, evaluate the inquiry and successor separately; adjacency alone
        does not establish gating. Legitimate monitoring, support, and schedule audits are normal counterexamples, and omissions
        caused by filters or permissions are not evidence that an adversary concealed inventory.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在已访问Windows主机上，操作者可以先调查服务与计划任务，以了解运行组件及既有调度。Elastic对GOSAR的样本分析记录了服务WMI查询和任务列表命令，说明一个后门可以同时具备两种读取能力，但未给出每个受害主机的查询触发或完整返回。需要将这些能力与实际发生的查询区分。
        en: On an accessed Windows host, an operator may first survey services and scheduled tasks to understand runtime components
          and existing schedules. Elastic's GOSAR sample analysis records a service WMI query and a task-listing command,
          showing that one backdoor can possess both capabilities without reporting each victim's query trigger or complete
          returns. These capabilities must remain separate from actually occurring inquiries.
      - zh: 对Linux服务管理或cron维护环境，攻击者可能使用已有管理命令调查服务和调度；system manager与user manager、已加载unit与已安装文件、当前用户与其他用户cron表决定可见范围。远端管理需要额外权限和可达路径。本地读取并不意味着取得跨主机库存，也不代表cron覆盖所有平台调度器。
        en: In Linux service-management or cron environments, an adversary may use existing utilities to survey services and
          schedules. System versus user managers, loaded units versus installed files, and current-user versus other-user
          cron tables determine visibility. Remote management requires additional authority and reachable paths. A local read
          establishes neither cross-host inventory nor cron coverage of every platform scheduler.
      - zh: 已有任务代理并允许短时内联代码的环境支持把服务读取留在原宿主。固定开源实现提供这一路径的可复核能力，适合解释不依赖独立诊断进程的请求观察；它不是恶意主体实际使用该实现的案例，也不要求宿主具备可信签名或长时间驻留。
        en: Environments with an existing task agent and short inline-code execution can retain service reads in the original
          carrier. The pinned open implementation supplies inspectable capability for understanding request observation without
          a separate diagnostic process. It is not a case of a malicious actor using that implementation and requires neither
          a trusted signature nor a long-lived carrier.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少需要执行查询客户端或读取可达管理视图的能力，并受到调用身份和对象权限约束。Windows SCM枚举权与逐服务状态查询权不同，命名空间读取也不等于执行方法权；计划任务读取受任务DACL影响。能执行sc或一个内联任务，并不自动获得管理员、远端全部服务或他人cron表。
          en: The adversary needs at least a query client or access to a reachable management view and remains constrained
            by caller identity and object authority. SCM enumeration and individual service-status rights differ, and namespace
            reads are not execution-method authority. Task DACLs constrain scheduled-task reading. Running sc or an inline
            task does not confer administration, every remote service, or another user's cron table automatically.
        - zh: 内联实现需要控制任务代码、分派入口和返回处理，并承担查询阻塞、内存错误或宿主崩溃的成本。固定sc_query代码只有有限缓冲重试，没有完整续页循环，不能把工具返回当作健壮全库存保证。攻击者可以按目标或状态过滤，但这种选择单独不足以建立新的匿迹分类。
          en: Inline implementations require control of task code, dispatch, and result handling and bear blocking, memory-error,
            and carrier-crash costs. The pinned sc_query code has a limited buffer retry rather than a complete continuation
            loop, so tool output is not a robust whole-inventory guarantee. An adversary may filter targets or states, but
            that choice alone does not establish another evasion partition.
      defender_model:
        paragraphs:
        - zh: 防守方可能看到含参数的进程创建、Linux审计执行记录、已启用WMI Trace及所选查询客户端的额外插桩。进程创建解释请求意图，Trace连接管理操作与客户端，只有明确的结果采集才解释实际取得的条目。服务管理器或provider的身份、服务所属PID与读取客户端必须分开，跨机PID也不能直接等同。
          en: Defenders may observe argument-bearing process creation, Linux audited execution, enabled WMI tracing, and additional
            instrumentation of selected query clients. Creation explains request intent, tracing connects management operations
            to clients, and only explicit result capture explains acquired entries. Manager or provider identity, a service's
            owning PID, and the reading client must remain distinct, as must PIDs across hosts.
        - zh: 观察需要实际作业台账、客户端生存期和采集健康才能解释正常维护与未找到批准依据的请求。只留服务状态变化、任务注册或provider加载事件不会覆盖只读查询；未配置审计、丢页、权限静默省略和未观测的宿主任务都限制结论。没有事件不能证明没有查询，也不能把未找到批准记录直接判为恶意。
          en: Actual work registers, client lifetimes, and collection health are needed to interpret ordinary maintenance
            and requests without located approval. Service-state changes, task registration, or provider-loading events alone
            do not cover read-only inquiries. Unconfigured auditing, lost pages, silent permission omissions, and unobserved
            carrier tasks limit conclusions. Missing events establish neither absent inquiries nor maliciousness from missing
            approval records.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 将服务读取交给既有内联宿主省去每任务诊断工具入口
      en: Give service reads to an existing inline carrier to remove the per-task diagnostic-tool entry
    analysis:
      paragraphs:
      - zh: 当操作者把一次服务读取作为既有宿主中的内联任务，具体API调用和返回处理不再对应新建sc执行器。固定集成入口、具体服务API与官方BOF生命周期说明组成正面能力链，支持相对每任务进程创建观察的入口省去。SCM调用、宿主代码和返回仍在，读取权限也不增加；没有野外部署或检测率对照，因此该条件化收益为中等置信。
        en: When an operator performs a service read as an inline task in an existing carrier, its API calls and result handling
          no longer correspond to a newly created sc executor. Pinned integration, concrete service APIs, and the official
          BOF lifecycle form a positive capability chain supporting removal of an entry relative to per-task process-creation
          observation. SCM calls, carrier code, and returns remain, and read authority does not increase. Without field deployment
          or detection-rate comparisons, the conditional benefit is medium-confidence.
    evidence_keys:
    - REF-001305
    - REF-001303
    - B012-T1007-REF-ENUM
    - B012-T1007-REF-QUERYSTATUS
    - REF-000230
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 借用服务与调度维护请求外观降低局部目的可区分性
      en: Borrow service and schedule-maintenance request appearance to reduce local purpose distinction
    analysis:
      paragraphs:
      - zh: 恶意软件能够使用正常管理接口调查服务和计划执行登记，官方工具文档又说明这些接口用于受支持的库存与状态检查。选择相同请求语义时，正常工具或WMI类名不包含完整工作目的，使依赖名称信任的观察难以区分调查与维护。此处收益是根据接口重合与样本能力作出的因果推断，不把每次正常请求都视为有意伪装，也没有对误报或漏报率的测量。
        en: Malware can use ordinary management interfaces to survey services and scheduled registrations, while official
          utility documentation establishes supported inventory and status uses. Selecting the same request semantics leaves
          tool or WMI class names without complete work purpose, weakening observations that trust names to distinguish inquiry
          from maintenance. This causal inference rests on interface overlap and sample capability, not an assertion that
          every normal request intentionally camouflages activity or a measurement of false positives or misses.
    evidence_keys:
    - B012-T1007-REF-GOSAR
    - B012-T1007-REF-SC
    - B012-T1007-REF-SCHTASKS
    - B012-T1007-REF-SYSTEMCTL
    - REF-001296
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    subtechnique_keys:
    - B012-T1007-CHILD-INLINE
    narrative:
      paragraphs:
      - zh: 当前建立驻留内联服务查询，按一次服务读取相对独立诊断执行器的任务承载位置划分。子项要求具体查询、既有宿主与内联任务的正面联系；普通API导入、WMI类名、低进程数量或宿主长期运行都不足以判定。一个独立工具内部自然调用服务API仍是父行为，不能自动升级为该子项。
        en: The current taxonomy establishes Resident Inline Service Inquiry by the carriage of one service read relative
          to a separate diagnostic executor. The child requires a positive link among the concrete inquiry, existing carrier,
          and inline task. API imports, WMI class names, few processes, or long carrier lifetime are insufficient. An independent
          utility naturally calling service APIs remains parent behavior rather than qualifying automatically.
      - zh: 服务、任务、cron、平台和状态字段描述信息对象或视图，不据此产生兄弟项。已存清单复用、时间分散与定向过滤的独立匿迹效果仍需更窄证据；变更、隐藏服务登记及分析环境条件门控各有独立边界。新的子项必须证明额外可控变量、痕迹变化与防守观察差，而不能补齐工具清单。
        en: Services, tasks, cron, platforms, and status fields describe information objects or views rather than siblings.
          Independent stealth effects of prior-inventory reuse, temporal spreading, and targeted filtering need narrower evidence.
          Mutation, hidden service registration, and analysis-conditioned gating retain separate boundaries. A new child must
          establish an additional controllable variable, trace change, and defender-observation difference rather than fill
          a utility list.
