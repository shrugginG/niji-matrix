research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - zh: 固定父级横跨服务状态/注册、计划任务/cron与Windows/Linux/macOS，而无ATT&CK子项。
      en: The fixed parent spans service state/registration, scheduled tasks/cron, and Windows/Linux/macOS without ATT&CK
        children.
    breadth_trigger: ordinary
    coverage_resolutions:
    - dimension: service-status-registration
      resolution: parent-core
      rationale:
        zh: 服务状态、类型与可读配置构成直接信息对象，不按字段或工具分子项。
        en: Service states, types, and readable configuration define direct information objects rather than field/tool children.
    - dimension: scheduled-task-cron-inventory
      resolution: parent-core
      rationale:
        zh: 固定范围保留任务与cron读取，不能因名称叫服务而剔除，也不因对象不同自动形成匿迹分类。
        en: Preserve task and cron reads in fixed scope rather than dropping them because the name says services or treating
          different objects as evasion partitions.
    - dimension: resident-task-carriage
      resolution: niji-variable-candidate
      rationale:
        zh: 具体服务API与内联分派链独立支持任务承载边界。
        en: Particular service APIs and inline dispatch independently support a task-carriage boundary.
    - dimension: service-task-mutation-and-execution
      resolution: adjacent-technique
      rationale:
        zh: start/stop、注册与任务执行独立于查询，服务隐藏和分析条件后继另行归属。
        en: Start/stop, registration, and task execution are distinct from inquiries, with service hiding and analysis-conditioned
          successors separately owned.
    candidate_stealth_axes_examined:
    - axis: task-carriage-boundary
      result: formal
      proposed_key: B012-T1007-CHILD-INLINE
      evidence_keys:
      - REF-001305
      - REF-001303
      rationale:
        zh: 同一固定源码给出具体服务读取、内联入口和输出链，官方模型给出与每任务执行器的观察差，防御需任务级SCM合同。
        en: One pinned implementation provides particular service reads, inline entry, and output, while the official model
          supplies the per-task-executor contrast and defense needs task-level SCM contracts.
    - axis: management-tool-appearance
      result: parent-core
      evidence_keys:
      - B012-T1007-REF-GOSAR
      - B012-T1007-REF-SC
      - B012-T1007-REF-SCHTASKS
      rationale:
        zh: 接口与维护外观重合支持父级条件化FD，不足以按工具或平台形成稳定兄弟项。
        en: Interface/maintenance appearance overlap supports conditional parent FD rather than stable tool/platform siblings.
    - axis: prior-inventory-reuse
      result: evidence-deferred
      evidence_keys: []
      rationale:
        zh: 可读库存副本存在并不证明攻击者有意替代当次管理查询及其观察差，未找到结论层级正证。
        en: Readable inventory copies do not establish deliberate substitution for a current management query or its observation
          effect; conclusion-level positive evidence was not found.
    - axis: temporal-spreading-and-target-filtering
      result: not-stealth-distinct
      evidence_keys:
      - B012-T1007-REF-SC
      - B012-T1007-REF-SYSTEMCTL
      - B012-T1007-REF-CRONTAB
      rationale:
        zh: 少量、定向、用户或状态过滤可以来自正常职责或权限，当前无独立有意时间/空间变量与测得观察差。
        en: Small, targeted, user-filtered, or state-filtered views can reflect duties or authority, without a separately
          established intentional temporal/spatial variable and observation effect.
    - axis: remote-control-plane-separation
      result: parent-core
      evidence_keys:
      - B012-T1007-REF-SCHTASKS
      - REF-001309
      - REF-000336
      rationale:
        zh: 远端管理是来源与权限维度，单纯跨机不证明新的匿迹设计，明确客户端归属比另建工具子项更有依据。
        en: Remote management is an origin/authority dimension; crossing hosts alone does not establish new stealth design,
          and explicit client attribution is better supported than another tool child.
    - axis: analysis-conditioned-service-gating
      result: adjacent-technique
      evidence_keys:
      - REF-000625
      rationale:
        zh: 后继行为差异需要T1497或相关门控证据，单纯服务读取不占有该对象。
        en: Successor differences need T1497 or related gating evidence; a service read alone does not own that object.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零ATT&CK子项没有缩减研究压力；额外复查任务/cron、缓存、节奏/过滤和远端来源。仅任务承载有完整正证，其余按父核心、邻接或延后保留，没有补齐一工具一子项。
      en: Zero ATT&CK children did not reduce inquiry. Task/cron, cached data, cadence/filters, and remote origins received
        another check. Only task carriage has a complete positive chain; other axes remain parent-core, adjacent, or deferred
        without one-child-per-tool expansion.
  evidence_coverage:
    parent_behavior_keys:
    - REF-000625
    - B012-T1007-REF-GOSAR
    - B012-T1007-CLM-SCOPE
    - B012-T1007-CLM-GOSAR
    boundary_keys:
    - B012-T1007-CLM-SCMVIEW
    - B012-T1007-CLM-SCHEDULER
    - B012-T1007-CLM-LINUXVIEW
    - B012-T1007-CLM-OBJECTBOUNDARY
    mechanism_support:
    - mechanism_ref: NM-BT
      claim_keys:
      - B012-T1007-CLM-BT
      conclusion_level: capability-and-conditional-observation-inference
    - mechanism_ref: NM-FD
      claim_keys:
      - B012-T1007-CLM-FD
      conclusion_level: interface-overlap-and-conditional-purpose-distinction
    child_existence_support:
    - child_key: B012-T1007-CHILD-INLINE
      claim_keys:
      - B012-T1007-CLM-INLINE
      - B012-T1007-CLM-BT
      evidence_keys:
      - REF-001305
      - REF-001303
      - B012-T1007-REF-ENUM
      - B012-T1007-REF-QUERYSTATUS
      conclusion_level: pinned-capability-not-field-adoption
    unsupported_or_deferred:
    - all-platform-complete-inventory
    - per-victim-gosar-query-results
    - gosar-in-process-wmi-client
    - cache-reuse-stealth
    - measured-evasion-effectiveness
    - default-edr-arbitrary-api-and-output-telemetry
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已读实际NJT-0001父包和字段规范。定义区分登记与执行，匿迹特性解释工具外观与任务入口差，边界保留固定scheduler/cron并澄清driver/PID/权限，攻防模型分别覆盖查询授权、宿主成本、传感器与结果限制；子项独立解释正面任务链。四项NJA各有平台原生映射、批准/健康输入及成功/未知合同，MIT按SCM、任务DACL与cron实际控制面编写，未套用基准的数量或扫描结论。
      en: Read the actual NJT-0001 parent and field specification. Definition separates registration and execution; stealth
        properties explain utility appearance and task entry; boundaries retain fixed scheduler/cron scope and clarify drivers,
        PIDs, and authority. Separate threat models cover query permissions, carrier costs, sensors, and result limits, while
        the child independently explains its positive task chain. Four analytics each have platform-native mappings, approval/health
        inputs, and success/unknown contracts. The MIT addresses actual SCM, task-DACL, and cron controls without borrowing
        exemplar counts or scan conclusions.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - source-download
    - html-text-extraction
    - yaml-serialization-check
    - reference-resolution-check
    - hash-calculation
  limitations:
    paragraphs:
    - zh: 恶意软件证据来自GOSAR原始样本能力表，没有逐主机查询、返回值和发生日期，不能把出版日期当作读取时间。内联子项来自固定开源工具与官方执行模型，未编译或执行，也没有野外采用、完整分页或PAUSED状态输出实测。macOS属于固定父范围，但本批实现和检测论证主要为Windows及Linux/Cronie，不能推广为所有launchd或平台调度器覆盖。
      en: Malware evidence comes from the original GOSAR capability table rather than per-host inquiries, returns, or execution
        dates; publication is not inquiry time. The inline child rests on pinned open tools and an official model without
        compilation, execution, field adoption, or testing of full continuation or PAUSED output. MacOS remains within fixed
        parent scope, but implementation/detection reasoning chiefly covers Windows and Linux/Cronie rather than all launchd
        or platform schedulers.
    - zh: 两种机理均是特定观察模型下的条件化推断，没有测得检测率。权限、过滤和状态变化限制取得的视图，注册或服务PID不证明当前执行与有效保护。命令与WMI分析只消费请求，原生结果分析需要显式额外插桩；批准、身份、句柄或健康缺失时保持未知。未来实际调用链、正常工作基线、跨版本ABI和返回采集对照将改变覆盖与置信度。
      en: Both mechanisms are conditional inferences under particular observation models, without measured detection rates.
        Authority, filters, and state changes constrain acquired views; registrations or service PIDs do not establish current
        execution or effective protection. Command/WMI analytics consume requests only, while native-result analysis needs
        explicit additional instrumentation. Missing approval, identity, handles, or health remains unknown. Actual call chains,
        normal-work baselines, cross-version ABIs, and result-capture comparisons could change coverage and confidence.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason:
      zh: 远端管理、少量返回或状态过滤不能单独证明刻意时间/真实来源稀释，没有结论层级证据。
      en: Remote management, few returns, or state filtering alone do not establish deliberate temporal/real-origin dilution;
        conclusion-level evidence is absent.
  - mechanism_ref: NM-DO
    reason:
      zh: 本研究没有证明查询内容不可检查或刻意结构遮蔽；未知遥测不等于数据混淆。
      en: No deliberate structural obscuring or uninspectable query content was established; unknown telemetry is not data
        obfuscation.
  open_questions:
  - zh: 独立现场证据是否支持服务内联任务实际采用，且能测量其相对每任务工具创建的观察收益？
    en: Can independent field evidence establish adoption of inline service tasks and measure observation benefits relative
      to per-task utility creation?
  - zh: macOS原生服务和调度读取、其他Linux调度器与缓存复用是否具备不同稳定匿迹变量？
    en: Do native macOS service/schedule reads, other Linux schedulers, or inventory-cache reuse have different stable stealth
      variables?
