defense_candidates:
  detection_strategies:
  - temporary_key: B012-T1007-DET-INQUIRY
    name:
      zh: 服务与计划执行库存查询归属
      en: Service and Scheduled-Execution Inventory Inquiry Attribution
    summary:
      zh: 将服务或调度库存读取请求归属到实际客户端和任务范围，并独立保留取得结果的证据等级。
      en: Attribute service or schedule-inventory requests to actual clients and task scope while preserving acquired-result
        evidence levels separately.
    description:
      paragraphs:
      - zh: 策略从管理语义辨认服务或计划执行库存查询，而不将管理工具、服务宿主或provider名称视为批准依据。Windows工具、Linux服务与cron命令、WMI请求分别提供不同观察面；前三项分析仅确认请求，不把状态变化或任务注册事件替代只读记录。
        en: The strategy recognizes service or scheduled-inventory inquiries through management semantics rather than treating
          utility, service-carrier, or provider names as approval. Windows tools, Linux service and cron commands, and WMI
          requests offer different surfaces. The first three analytics confirm requests only and do not substitute state changes
          or task registration for read records.
      - zh: 内联分析另外要求所选宿主任务入口、句柄来源和SCM调用返回的自定义采集，使没有独立诊断工具时仍能保留正面查询链。所有分析显式声明批准和健康输入，区分未找到批准、来源未知及恶意判断；插桩可选部署但对内联分析本身是必需输入，未部署不能声称覆盖。
        en: The inline analytic additionally requires custom capture of selected carriers' task entries, handle provenance,
          and SCM call returns to preserve positive inquiry chains without separate utilities. All analytics declare approval
          and health inputs, distinguishing absent located approval, unknown origins, and maliciousness. Instrumentation is
          an optional deployment choice but a required input for the inline analytic; undeployed instrumentation cannot claim
          coverage.
