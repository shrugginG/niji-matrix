identity_semantics_review:
- identity_kind: calling-thread-name
  key: B012-T1033-REF-NAMEEX
  conclusion:
    zh: 模拟时可能是客户，与进程TokenUser分开。
    en: Can concern an impersonated client and remains separate from process TokenUser.
- identity_kind: process-token-user
  key: B012-T1033-REF-TOKENUSER
  conclusion:
    zh: 来自明确令牌句柄的SID，不是人类操作者。
    en: A SID from a specific token handle rather than a human operator.
- identity_kind: real-versus-effective-uid
  key: B012-T1033-REF-UID
  conclusion:
    zh: 两种进程身份，真实UID不表示现实身份。
    en: Two process identity kinds; real UID does not mean real-world identity.
- identity_kind: logon-session
  key: B012-T1033-REF-WTS
  conclusion:
    zh: 目标服务器与会话决定视图，控制台用户不替代全部远程会话。
    en: Target server and session determine the view; a console user does not represent all remote sessions.
- identity_kind: environment-assertion
  key: B012-T1033-REF-GETENV
  conclusion:
    zh: 进程保存且可修改的字符串，不是令牌认证。
    en: A stored and mutable process string rather than token authentication.
- identity_kind: object-owner
  key: B012-T1033-REF-STAT
  conclusion:
    zh: owner是对象属性，不能证明作者、当前用户或操作者。
    en: Owner is an object property rather than proof of author, current user, or operator.
