verification_method:
  zh: 独立打开原始发布者页面与权威伙伴PDF，再下载原文、读取固定源码、核对官方接口语义；未以已有CLM或CASE替代原始事实核验。下载清单中的哈希只证明所存快照身份，不证明页面未来不变。
  en: Independently opened original publisher pages and an authoritative partner PDF, downloaded originals, read pinned code,
    and checked official interface semantics rather than substituting prior CLM or CASE objects for original facts. Download
    hashes identify saved snapshots without implying immutable future pages.
original_sources_examined:
- source_key: REF-000625
  artifacts:
  - ../../fixed-baseline-T1033.json
  locator: Fixed local 19.1 workbook extraction, T1033 row and attack_subtechnique_count.
  facts:
    zh: 特定系统主要、当前、常用或活动用户，来源可为进程或文件owner、会话、日志与环境变量；固定子项数量零。
    en: Covers primary, current, frequent, or active users of a system through process or file ownership, sessions, logs,
      and environments; fixed child count is zero.
  limits:
    zh: 不证明原生子项、恶意事件返回或检测效果。
    en: Does not establish native children, incident returns, or detection effectiveness.
  supports:
  - B012-T1033-CLM-SCOPE
  quotation: null
- source_key: REF-001341
  artifacts:
  - volt-advisory.pdf
  - volt-advisory.txt
  locator: Authoritative IC3-hosted AA23-144A version 1.1, printed p11 whoami, p13 remote wmic cmd /c whoami, pp1-3 native-tool
    ambiguity, p14 logging.
  facts:
    zh: 原生环境枚举命令包含whoami，另列远端wmic调用；原生命令也可能来自正常活动，需要配置进程、WMI与PowerShell日志。
    en: Native environment-enumeration commands include whoami and a separate remote wmic invocation. Native commands can
      also be benign, and process, WMI, and PowerShell logging needs configuration.
  limits:
    zh: 无用户名返回、身份检查专属漏报率、确切任务时间或内联任务链；PDF与CISA网页是同公告身份。
    en: No username return, identity-check-specific miss rate, exact task time, or inline-task chain. The PDF and CISA page
      are one advisory identity.
  supports:
  - B012-T1033-CLM-ADOPTION
  - B012-T1033-CLM-FD
  - B012-T1033-CASE-VOLT
  quotation: whoami
- source_key: REF-001305
  artifacts:
  - trustedsec-whoami.c
  - trustedsec-SA.cna
  locator: Commit fd96c4dcd88fd00eea902bebb20d0736e48f5f61; SA.cna L674-682; whoami entry.c L24-38, L41-90, L94-132, L320-334.
  facts:
    zh: whoami别名显式调用beacon_inline_execute，注册说明避免cmd.exe。具体实现打开当前进程令牌两阶段查询TokenUser，再独立取NameSamCompatible名称并打印；BOF go调用这些函数和printoutput。
    en: The whoami alias explicitly calls beacon_inline_execute and its registration describes avoiding cmd.exe. The implementation
      opens the current process token for a two-stage TokenUser query, separately obtains a NameSamCompatible name, and prints
      both. BOF go calls these functions and printoutput.
  limits:
    zh: 仅静态能力；没有编译或执行。不能因同一输出行合并线程名与进程SID，不能继承tasklist的实案或WMI结果。
    en: Static capability only, without compilation or execution. A shared output row cannot merge thread name and process
      SID or inherit tasklist cases or WMI results.
  supports:
  - B012-T1033-CLM-INLINE
  - B012-T1033-CLM-TOKEN
  quotation: without starting cmd.exe
- source_key: REF-001303
  artifacts:
  - bof-official.html
  - bof-official.txt
  locator: Advantages, execution model, disadvantages; footer 4.13 | 202609280255 | September 2026.
  facts:
    zh: 官方比较每任务fork-and-run创建与注入足迹和Beacon内执行；短时单线程BOF可能阻塞或导致代理崩溃。
    en: Officially contrasts per-task fork-and-run creation and injection with execution inside Beacon. Short single-threaded
      BOFs can block or crash the agent.
  limits:
    zh: 通用框架文档须与本次具体身份实现连接；不证明恶意采用、所有API无日志或逃逸率。
    en: Generic framework documentation must be joined to the concrete identity implementation and proves no malicious adoption,
      universal absent API logging, or evasion rate.
  supports:
  - B012-T1033-CLM-INLINE
  quotation: null
- source_key: B012-T1033-REF-NAMEEX
  artifacts:
  - getusernameex.html
  - getusernameex.txt
  locator: Calling thread and impersonated client; NameFormat; nSize; errors and A/W remarks.
  facts:
    zh: 名称属于调用线程或被模拟客户；成功长度不含终止符，失败有缓冲、域与格式错误。
    en: The name belongs to the calling thread or impersonated client. Successful length excludes the terminator and failures
      include buffer, domain, and format errors.
  limits:
    zh: 官方失败大小文字存在TCHAR、Unicode字符和表格bytes混用，保留原始长度与实际变体并要求本地验证；不从失败缓冲区恢复身份。
    en: Official failure-size wording mixes TCHARs, Unicode characters, and bytes in the table. Preserve raw size and actual
      variant and require local validation rather than recovering identity from failed buffers.
  supports:
  - B012-T1033-CLM-NAME
  - B012-T1033-CLM-TOKEN
  - B012-T1033-NJA-INLINE
  quotation: null
