type: individually-reviewed-handoff-overrides
candidate: T1033
content_edits:
- pointer: /proposed_content/scope_boundary_definition/paragraphs/2
  value:
    zh: 正常登录脚本、软件安装、帮助台、终端服务管理与安全检查均可产生相似痕迹。选择某API、一次空结果、低请求量或没有新进程事件不能单独证明匿迹设计。Windows的Win32_ComputerSystem.UserName在终端服务情形指控制台用户而非当前远程会话，WTS查询必须保留目标服务器和会话ID；既有登录记录也不能证明当下有自然的人类交互。
    en: Logon scripts, installers, help desks, terminal-service management, and security checks can produce similar traces.
      An API choice, an empty result, low request volume, or missing process-creation events alone does not establish an evasion
      design. Win32_ComputerSystem.UserName identifies the console user in a terminal-services setting rather than the current
      remote-session user, and WTS queries must retain target server and session ID. Existing logon records also do not establish
      present natural human interaction.
- pointer: /proposed_subtechniques/0/stealth_mechanisms/0/analysis/paragraphs/0
  value:
    zh: SA.cna中的whoami别名明确内联调用，任务代码的TokenUser查询、线程名称读取与printoutput证明行为并非仅加载一个无关模块。与官方每任务fork&run足迹相比，观察变化是没有单独的命令工具或每任务执行器入口，因此按工具创建识别身份调查的逻辑缺失一个关键输入。正面的任务与调用插桩能恢复这一行为，而单纯缺少日志不能反向证明它发生；来源支持设计能力，不支持量化实战规避。
    en: The SA.cna whoami alias explicitly invokes inline execution, while its TokenUser query, thread-name read, and print
      output demonstrate actual identity functionality rather than merely loading an unrelated module. Compared with the documented
      per-task fork-and-run footprint, the changed observation is loss of a separate utility or task-executor entry, removing
      an input from utility-creation-based identification. Positive task and call instrumentation can recover the behavior,
      whereas absent logs cannot establish it retrospectively. Sources support design capability rather than quantified operational
      evasion.
- pointer: /defense_candidates/detection_analytics/1/logic/paragraphs/3
  value:
    zh: 将同线程调用序列和task_id连接到明确出生的进程实例，并按任务进入至退出的区间核对批准代码哈希、宿主、主体与有效期。调用进入未见返回时保留request_only，取得SID或名称时分别标记result_observed，承载已证实且无对应批准时提出内联身份调查核查线索；批准未知不是恶意结论。采集器健康记录需给出hook与任务覆盖版本、架构、启用区间、时钟与单调序列映射、丢失和截断计数，缺口影响的句柄与任务均降为未知。每个输入的UTC时间用于跨源展示，单调序列用于同进程先后关系；不能用名称变化推断身份切换，也不能以无事件证明查询未发生。host_id来自采集器部署标识，boot_instance记录启动实例，process_instance由host_id、boot_instance、PID与process_birth_time共同确定。
    en: Join same-thread call sequences and task_id to a positively identified process birth instance, checking approved code
      hash, host, principal, and validity over actual task entry-to-exit intervals. Entry without return remains request_only;
      captured SID and name independently become result_observed. Proven carriage outside matched approval produces an inline
      identity-inquiry lead, while unknown approval does not establish maliciousness. Collector health must state hook and
      task-coverage version, architecture, enabled intervals, clock-to-monotonic mapping, loss, and truncation. Affected handles
      and tasks degrade to unknown. UTC instants support cross-source display and monotonic sequences order in-process events.
      A changed name does not prove identity transition, and absent events do not prove no inquiry. host_id comes from collector
      enrollment, boot_instance identifies a boot, and host_id, boot_instance, PID, and process_birth_time together determine
      process_instance.
- pointer: /defense_candidates/detection_analytics/0/logic/paragraphs/0
  value:
    zh: 在已部署Sysmon的主机上收集Operational通道事件1与5。将System.Computer映射host_id，UtcTime映射UTC event_time，ProcessGuid映射process_guid，ProcessId映射十进制process_id，Image、CommandLine、User与ParentProcessGuid分别映射image、command_line、process_account和parent_process_guid；事件5只结束对应实例。解析实际命令标记和引用关系，匹配whoami无参数或/user、/all、/upn、/fqdn、/logonid及query.exe
      user或query.exe session语义，排除帮助文本、仅/groups或/priv的独立请求。保留命令中的远端/server目标为target_host，缺省为记录主机；该输入目标不是已证实访问结果。 仅对已核验的实际whoami/query执行入口和脚本表达式应用这些解析语义，不把其他工具参数中的引用字符串自动当成本地身份查询。包含/node或process
      call create的WMIC远程启动包装不在本分析解析合同内，不能将其内部whoami字符串默认归属为日志宿主上的实际查询。
    en: On hosts with Sysmon deployed, collect Operational events 1 and 5. Map System.Computer to host_id, UtcTime to UTC
      event_time, ProcessGuid to process_guid, ProcessId to decimal process_id, and Image, CommandLine, User, and ParentProcessGuid
      to image, command_line, process_account, and parent_process_guid. Event 5 closes only that instance. Parse actual command
      tokens and quoting to match whoami without arguments or with /user, /all, /upn, /fqdn, or /logonid, plus query.exe user
      or query.exe session semantics. Exclude help and isolated /groups or /priv requests. Preserve a /server target as target_host,
      defaulting to the logged host; an input target is not a proven access result. Apply these semantics only to validated
      actual whoami/query execution entries and script expressions, without treating quoted strings in other tools as local
      identity inquiries. WMIC remote-launch wrappers containing /node or process call create are outside this parser contract;
      their embedded whoami text must not default to an actual inquiry on the logging host.
- pointer: /defense_candidates/detection_analytics/0/blind_spots/2
  append: true
  value:
    zh: WMIC远程启动包装和其他未验收的管理入口需要独立参数解析与目标归属，单凭内部whoami字样不能覆盖。
    en: WMIC remote-launch wrappers and other unvalidated management entries need separate argument parsing and target attribution;
      embedded whoami text alone supplies no coverage.
