defense_candidates:
  detection_strategies:
  - temporary_key: B012-T1033-DET-IDENTITY
    schema_version: 2.0.0
    type: detection-strategy
    name:
      zh: 身份调查请求与来源恢复
      en: Identity-Inquiry Request and Origin Recovery
    summary:
      zh: 识别身份与会话调查请求，并在额外插桩可用时恢复驻留任务的实际身份来源与返回。
      en: Identify identity and session-inquiry requests and recover resident-task identity provenance and returns when additional
        instrumentation is available.
    description:
      paragraphs:
      - zh: 本策略将工具与脚本中可见的身份请求同需要专门采集的进程内读取分开。第一条分析保留请求语义与执行实例，不能声称命令已返回用户名；第二条分析要求任务、句柄和调用返回的正面证据，以恢复没有独立工具入口的身份任务。两者均把查询者账户、所查身份与实际人类操作者分开。
        en: The strategy separates identity requests visible in utilities and scripts from in-process reads requiring dedicated
          collection. The first analytic preserves request semantics and execution instances without claiming returned usernames.
          The second requires positive task, handle, and call-return evidence to recover identity tasks lacking a separate
          utility entry. Both separate the querier account, queried identity, and actual human operator.
    detects_keys:
    - B012-T1033-PARENT
    - B012-T1033-CHILD-INLINE
    domains:
    - enterprise
    analytic_keys:
    - B012-T1033-NJA-REQUEST
    - B012-T1033-NJA-INLINE
    evidence_keys:
    - REF-001341
    - REF-001293
    - REF-000366
    - REF-000463
    - REF-001303
    - REF-001305
    - B012-T1033-REF-QUERYUSER
    - B012-T1033-REF-NAMEEX
    - B012-T1033-REF-TOKENINFO
    - B012-T1033-REF-TOKENUSER
    lifecycle:
      status: draft
      version: 0.1.0
      created: '2026-11-08'
      modified: '2026-11-08'
      contributors:
      - Niji Matrix Research
      reviewers: []
  detection_analytics:
  - temporary_key: B012-T1033-NJA-REQUEST
    schema_version: 2.0.0
    type: detection-analytic
    strategy_key: B012-T1033-DET-IDENTITY
    name:
      zh: Windows身份命令与脚本请求分析
      en: Windows Identity Command and Script Request Analysis
    summary:
      zh: 从已记录命令和脚本语义识别身份或会话调查请求，结合实际作业范围输出可核验线索。
      en: Identify identity or session-inquiry requests in recorded commands and script semantics and produce leads checked
        against actual work scope.
    domains:
    - enterprise
    platforms:
    - windows
    logic:
      paragraphs:
      - zh: 在已部署Sysmon的主机上收集Operational通道事件1与5。将System.Computer映射host_id，UtcTime映射UTC event_time，ProcessGuid映射process_guid，ProcessId映射十进制process_id，Image、CommandLine、User与ParentProcessGuid分别映射image、command_line、process_account和parent_process_guid；事件5只结束对应实例。解析实际命令标记和引用关系，匹配whoami无参数或/user、/all、/upn、/fqdn、/logonid及query.exe
          user或query.exe session语义，排除帮助文本、仅/groups或/priv的独立请求。保留命令中的远端/server目标为target_host，缺省为记录主机；该输入目标不是已证实访问结果。
        en: On hosts with Sysmon deployed, collect Operational events 1 and 5. Map System.Computer to host_id, UtcTime to
          UTC event_time, ProcessGuid to process_guid, ProcessId to decimal process_id, and Image, CommandLine, User, and
          ParentProcessGuid to image, command_line, process_account, and parent_process_guid. Event 5 closes only that instance.
          Parse actual command tokens and quoting to match whoami without arguments or with /user, /all, /upn, /fqdn, or /logonid,
          plus query.exe user or query.exe session semantics. Exclude help and isolated /groups or /priv requests. Preserve
          a /server target as target_host, defaulting to the logged host; an input target is not a proven access result.
      - zh: Windows PowerShell 5.1需预先启用脚本块日志。4104的System.Computer、TimeCreated.SystemTime和Execution.ProcessID映射主机、UTC时间和本地十进制PID，ScriptBlockId、MessageNumber、MessageTotal、ScriptBlockText分别映射script_block_id、part_number、part_total、script_text。按主机、PID和脚本块ID组装全部片段，再同事件时间覆盖该PID的唯一Sysmon实例连接；保留WindowsIdentity.GetCurrent().Name、Environment.UserName、用户名环境读取及明确的会话命令语义。代码中存在表达式只证明脚本块被处理，既不保证该分支执行，也不保证返回；片段缺失、加密内容未解密或PID实例不唯一则标为部分或来源未知。
        en: Windows PowerShell 5.1 requires script-block logging enabled in advance. For 4104, map System.Computer, TimeCreated.SystemTime,
          and Execution.ProcessID to host, UTC time, and local decimal PID; map ScriptBlockId, MessageNumber, MessageTotal,
          and ScriptBlockText to script_block_id, part_number, part_total, and script_text. Reassemble every part by host,
          PID, and script-block ID, then join to the unique Sysmon instance covering that PID and time. Retain WindowsIdentity.GetCurrent().Name,
          Environment.UserName, username-environment reads, and explicit session-command semantics. An expression in a processed
          block guarantees neither branch execution nor a return. Missing fragments, undecrypted protected content, or ambiguous
          PID lifetimes produce partial or origin-unknown states.
      - zh: 对每项请求查询独立维护的批准作业台账，精确比较host_id、完整域账户、image或批准脚本身份、查询语义、target_host与有效UTC区间。台账版本和owner必须可追溯，缺少条目只表示未找到批准依据；台账离线或账户缺域时标为批准未知，不直接归为恶意。保留同一实例或父实例五分钟内重复身份与会话检查作为可选排序信号，不把该窗口或次数当作恶意阈值，也不消费未声明的凭据访问或网络事件。
        en: For each request, query a separately maintained approved-work register and compare host_id, fully qualified account,
          image or approved script identity, inquiry semantics, target_host, and valid UTC interval. Register version and
          owner must be traceable. No matching entry means approval was not found; an unavailable register or unqualified
          account makes approval unknown rather than malicious. Repeated identity and session checks within five minutes for
          one instance or its parent are an optional ranking signal, not a maliciousness threshold. No undeclared credential-access
          or network events are consumed.
      - zh: 输出request_observed、result_unknown和来源或批准状态，明确区分进程账户与请求要读取的身份。本分析不解析标准输出，不存在“空用户名”“无登录用户”或调用成功的结论；启动成功和脚本处理都不能提供API状态。采集健康台账必须声明通道启用区间、版本、时钟偏差上界、丢失与截断计数和最后心跳；记录不完整时保留命中但降低归属，不从无事件推断无行为。原始TimeCreated与UtcTime均为时间点而非持续时间，五分钟只用于事件时间排序。
        en: Emit request_observed, result_unknown, and origin or approval states, separating process account from the requested
          identity. This analytic parses no stdout and makes no conclusion of an empty username, no logged-on users, or call
          success; a successful launch and a processed block supply no API status. A collection-health register must state
          enabled-channel intervals, versions, maximum clock skew, loss and truncation counts, and last heartbeat. Incomplete
          collection retains hits with degraded attribution and cannot establish absence from missing events. TimeCreated
          and UtcTime are time instants rather than durations; five minutes is only an event-time ranking window.
    data_requirements:
    - source_type: sysmon-process-lifecycle
      name:
        zh: 已部署Sysmon的进程创建与终止
        en: Deployed Sysmon process creation and termination
      channel: Microsoft-Windows-Sysmon/Operational
      required_fields:
      - host_id
      - event_time
      - event_id
      - process_guid
      - process_id
      - image
      - command_line
      - process_account
      - parent_process_guid
    - source_type: powershell-scriptblock
      name:
        zh: 经策略启用的Windows PowerShell 5.1脚本块
        en: Policy-enabled Windows PowerShell 5.1 script blocks
      channel: Microsoft-Windows-PowerShell/Operational
      required_fields:
      - host_id
      - event_time
      - process_id
      - script_block_id
      - part_number
      - part_total
      - script_text
    - source_type: approved-identity-work-register
      name:
