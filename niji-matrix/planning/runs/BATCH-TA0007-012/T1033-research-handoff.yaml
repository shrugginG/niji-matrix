research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - current-execution-identity
    - logon-and-activity-context
    - object-owner-and-system-log-clues
    - process-environment-assertions
    breadth_trigger: ordinary
    coverage_resolutions:
    - dimension: fixed-parent-current-user-and-session-context
      resolution: parent-core
      rationale:
        zh: 固定父项没有原始子项，身份来源广度仍要求独立搜索。
        en: The fixed parent has no original children, but breadth of identity sources still requires independent inquiry.
    - dimension: token-real-uid-session-environment-owner
      resolution: not-stealth-distinct
      rationale:
        zh: 来源决定事实语义与可信度，本身不是稳定匿迹变量。
        en: Sources determine fact semantics and trust rather than independently defining stable evasion variables.
    candidate_stealth_axes_examined:
    - axis: task-carrier-lifecycle
      resolution: niji-variable-candidate
      proposed_key: B012-T1033-CHILD-INLINE
      evidence_keys:
      - REF-001305
      - REF-001303
      rationale:
        zh: 具体whoami读取、内联分派与创建足迹对照完整，能力级成立。
        en: Concrete whoami reads, inline dispatch, and creation-footprint comparison form a complete capability-level chain.
    - axis: preexisting-environment-or-owner-view-versus-fresh-session-authority
      resolution: evidence-deferred
      rationale:
        zh: 环境与owner可作身份线索，但现有资料没有证明为本行为刻意选择副本以移出特定权威观察面；账户总体副本另有NJT-0131。
        en: Environments and owners supply clues, but evidence does not establish deliberate copy selection to leave a particular
          authority surface for this behavior; NJT-0131 separately covers account-set copies.
    - axis: selective-user-filtering-and-output-minimization
      resolution: not-stealth-distinct
      rationale:
        zh: 查询特定会话或减少字段可出于职责和性能，未找到本行为的独立匿迹观察对照。
        en: Selecting sessions or fewer fields can serve duty or performance; no independent evasion-observation comparison
          was established for this behavior.
    - axis: polling-notification-and-event-gating
      resolution: evidence-deferred
      rationale:
        zh: 周期、登录事件或空闲状态本身不证明规避；缺少本行为的时间足迹变化与防御差证据。
        en: Cadence, logon events, and idle state do not establish evasion without evidence of temporal trace change and defensive
          difference for this behavior.
    - axis: username-or-activity-conditioned-successor
      resolution: adjacent-technique
      rationale:
        zh: 分析环境分类与后继动作差由NJT-0122主持，必须另证；单纯目标筛选不是独立子项。
        en: NJT-0122 owns analysis-environment classification with successor differences, which requires separate proof; ordinary
          target selection is no independent child.
    - axis: identity-source-confusion-or-impersonation
      resolution: not-stealth-distinct
      rationale:
        zh: 不一致是必须保留的语义限制，尚无证据证明攻击者专为混淆归属安排该身份查询；模拟令牌动作本身属于相邻行为。
        en: Disagreement is a semantic limit to preserve, without evidence of an inquiry deliberately arranged to confuse
          attribution; token impersonation itself remains adjacent.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 普通广度门槛之外再次检查六轴，未按零ATT&CK子项推定零Niji子项；只保留承载对照完整的能力级子项，其他轴不为凑数正式化，待主Agent收敛。
      en: A further six-axis review went beyond the ordinary trigger without assuming zero Niji children from zero ATT&CK
        children. Only the complete carrier-comparison capability becomes a child; other axes are not formalized to meet a
        count and await primary convergence.
  evidence_coverage:
    parent_behavior_keys:
    - B012-T1033-CLM-SCOPE
    - B012-T1033-CLM-ADOPTION
    - B012-T1033-CLM-LUNAR
    boundary_keys:
    - B012-T1033-CLM-NAME
    - B012-T1033-CLM-TOKEN
    - B012-T1033-CLM-UID
    - B012-T1033-CLM-ENV
    - B012-T1033-CLM-SESSION
    - B012-T1033-CLM-OWNER
    - B012-T1033-CLM-PROFILE-LIMIT
    mechanism_support:
