recommendation:
  decision: retain
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 固定19.1基线以特定系统的当前、主要或常用用户及活动状态为直接信息目标，足以与取得账户总体清单区分。联合公告明确记录Volt Typhoon使用whoami，ESET恢复的LunarWeb命令包包含用户信息调查，支持本行为在入侵后的实际相关性。保留父语义，不把“用户”重新定义成恶意进程的真实人类操作者，也不把凭据获取或分析环境门控并入身份读取。
      en: The fixed 19.1 baseline directly concerns current, primary, or frequent users and activity context of a particular
        system, distinguishable from an account inventory. The joint advisory explicitly records Volt Typhoon using whoami,
        and ESET recovered a LunarWeb command package containing user-information inquiries, establishing post-compromise
        relevance. Retain the parent semantics without redefining a user as the actual human controlling a malicious process
        or folding credential acquisition and analysis-environment gating into identity reads.
    - zh: 原生分类独立收敛为一项驻留上下文内联身份查询。其能力证据是固定源码中的身份读取、明确的内联任务入口与官方的每任务创建和注入足迹对照，而不是API名称或缺少创建日志。其他身份来源、轮询、过滤和用户活动分支已经检查，尚不足以形成额外稳定子项；具体查询的恶意采用和规避收益不从工具能力反推。
      en: The independent native taxonomy converges on one child, Resident-Context Inline Identity Inquiry. Capability evidence
        joins identity-reading code, an explicit inline task entry, and the official comparison with per-task creation and
        injection footprints, rather than an API name or missing creation logs. Other identity sources, polling, filtering,
        and activity-dependent branches were examined without establishing additional stable children. Tool capability does
        not retrospectively establish malicious adoption or evasion benefit for a particular inquiry.
  scope_notes:
    paragraphs:
    - zh: 有效令牌主体、进程真实UID、登录会话用户、进程环境自报和文件或进程owner保留各自来源与时点。账户或组集合、凭据、运行进程存在性与分析条件化后继动作分别交给相邻对象；同一复合命令可依据实际消费字段共同映射。平台范围保留Windows、Linux、macOS与网络设备，当前检测实现只承诺明确声明的Windows观察面。
      en: Preserve provenance and time separately for effective-token principals, process real UIDs, logon-session users,
        process-environment assertions, and file or process ownership. Account or group sets, credentials, running-process
        existence, and analysis-conditioned successor actions retain their adjacent owners; a composite command can co-map
        according to consumed fields. Parent scope retains Windows, Linux, macOS, and network devices, while current detection
        implementations claim only their explicitly declared Windows observation surfaces.
proposed_content:
  temporary_key: B012-T1033-PARENT
  schema_version: 2.0.0
  type: technique
  name:
    zh: 系统所有者与用户发现
    en: System Owner/User Discovery
  summary:
    zh: 读取特定系统的执行身份、登录会话或使用者线索以理解当前访问与目标上下文，并可借用日常身份检查外观或驻留任务承载降低独立可辨识度。
    en: Read execution identities, logon sessions, or user clues for a particular system to understand access and target context,
      potentially borrowing ordinary identity-check appearance or resident task carriage to reduce separate visibility.
  aliases: []
  classification:
    tactic_refs:
    - TA0007
    origin:
      kind: attack-retained
      source_attack_id: T1033
      source_attack_version: '19.1'
  definition_and_concept:
    paragraphs:
    - zh: 系统所有者与用户发现是在取得主机、会话或设备管理访问后，调查当前执行体代表哪个账户、有哪些登录会话及其活动或空闲线索，或哪些既有工件提示系统的主要与常用使用者的行为。直接产物是带来源的身份与使用上下文，供操作者理解立足点、筛选目标或安排后继操作；返回一个用户名既不证明取得其密码，也不证明此人正在操作终端。
      en: System Owner/User Discovery investigates which account an execution context represents, which sessions are logged
        on and their activity or idle clues, or which existing artifacts suggest a system's primary or frequent users after
        host, session, or device-management access. Its direct product is identity and usage context with provenance, helping
        an operator understand a foothold, select targets, or arrange follow-on work. A returned username establishes neither
        acquisition of its password nor that the named person is operating the terminal.
    - zh: 本技术以特定系统与使用者的关系为概念锚点，而不是把所有带用户名的数据都归为同一事实。Windows线程名称查询可反映被模拟的客户，进程令牌的TokenUser标识该令牌账户；Linux的getuid和geteuid分别返回真实与有效UID，getlogin依赖控制终端的登录记录。环境变量则是进程保存的字符串，文件owner属于对象元数据。只有保留这些区别，才可能判断调查究竟获得了哪一种身份线索。
      en: The conceptual anchor is the relationship between a particular system and its users, rather than treating every
        username-bearing datum as the same fact. A Windows thread-name query can reflect an impersonated client, whereas TokenUser
        identifies the account of its token. Linux getuid and geteuid return real and effective UIDs, and getlogin depends
        on the controlling terminal's login record. Environment variables are strings held by a process, while file ownership
        is object metadata. Preserving these distinctions is necessary to state which identity clue an inquiry actually acquired.
  stealth_characteristics:
    paragraphs:
    - zh: 系统所有者与用户发现的只读操作与支持人员确认“以谁的权限运行”、查看远程桌面会话和排查用户环境高度重叠。攻击者选用whoami或常见脚本后，局部可见特征仍可以是正常管理检查；恶意意图需要结合发起者、调用谱系和批准任务解释。联合公告证实这种命令被攻击者采用，但没有对单次身份查询给出漏报率或与合法检查的对照实验。
      en: Read-only System Owner/User Discovery overlaps closely with support checks of execution identity, Remote Desktop
        sessions, and user environments. Selecting whoami or familiar scripts leaves local features resembling ordinary administration,
        requiring initiator, call lineage, and approved-work context to interpret intent. The joint advisory establishes adversarial
        command adoption without a missed-detection rate or controlled comparison for individual identity inquiries.
    - zh: 把具体身份查询作为既有受控进程中的任务执行，可以省去为该任务另起命令工具的生命周期入口，使只识别新工具启动的观察面缺少此次调查的语义。固定whoami实现同时说明匿迹不等于身份准确：打印在同一行的线程名称和进程令牌SID可能来自不同主体。令牌打开、查询调用、任务代码、返回缓冲区与输出仍有残余证据，名称解析还可能依赖其他服务，不能宣称完全离线或无痕。
      en: 'Executing a particular identity inquiry as a task inside an existing controlled process can remove a separate command-tool
        lifecycle entry, depriving a tool-launch-only observer of the inquiry''s meaning. The pinned whoami implementation
        also shows that stealth does not ensure identity accuracy: a printed thread name and process-token SID on the same
        row can concern different principals. Token opens, query calls, task code, return buffers, and output remain evidence,
        and name resolution can depend on other services; complete offline or traceless operation is not established.'
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入当前身份、系统主要或近期使用者和已有登录上下文的调查，包括从令牌、会话、环境、对象owner或系统日志提取相关线索。判定依赖直接信息目标与实际消费字段；读进程清单寻找运行实例由NJT-0240主持，若进一步消费owner来推断系统使用者，可共同记录本行为。文件owner不证明文件作者、当前登录者或真实人类，服务账户与共享账户尤其不能单独作为操作者归因。
      en: Include inquiries into current identity, primary or recent system users, and existing logon context, including clues
        extracted from tokens, sessions, environments, object owners, or system logs. Classification follows the direct information
        objective and consumed fields. NJT-0240 owns process inventories used to locate running instances; consuming owners
        to infer system users can additionally establish this behavior. File ownership does not identify an author, current
        login, or actual human, and service or shared accounts especially cannot independently attribute an operator.
    - zh: 面向多账户的总体清单归NJT-0131，组成员与授权关系归组发现；whoami /all可同时暴露当前用户、组和权限，不能以工具名排除共同映射。读取用户名不是凭据转储、窃取令牌或使用有效凭据。读取会话状态、idle线索或用户名也不自动成立NJT-0122：只有存在分析环境判断且实际改变后继动作，才另记条件化规避；纯粹按业务目标筛选不证明分析规避。
      en: NJT-0131 owns multi-account inventories, while group discovery owns group membership and authorization relations.
        whoami /all can expose the current user, groups, and privileges and cannot preclude co-mapping merely because of its
        tool name. Reading a username is distinct from credential dumping, token theft, and valid-credential use. Session
        state, idle clues, or usernames do not automatically establish NJT-0122; analysis-environment classification and an
        actual successor difference must separately support conditioned evasion, while business-target selection alone does
        not establish it.
    - zh: 正常登录脚本、软件安装、帮助台、终端服务管理与安全检查均可产生相似痕迹。选择某API、一次空结果、低请求量或没有新进程事件不能单独证明匿迹设计。Windows的Win32_ComputerSystem.UserName在终端服务情形指控制台用户而非当前远程会话，WTS查询必须保留目标服务器和会话ID；既有登录记录也不能证明当下有自然的人类交互。
      en: Logon scripts, installers, help desks, terminal-service management, and security checks can produce similar traces.
        An API choice, an empty result, low request volume, or missing process-creation events independently proves no evasion
        design. Win32_ComputerSystem.UserName identifies the console user in a terminal-services setting rather than the current
        remote-session user, and WTS queries must retain target server and session ID. Existing logon records also do not
        establish present natural human interaction.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 初始立足、远程命令成功启动或执行上下文变化后，操作者可检查当前账户，避免把服务身份误当桌面用户，并决定后续调查范围。联合公告中whoami与远端wmic调用是已观察的命令采用，ESET的恢复包包含用户信息请求；公开资料没有给出逐主机返回值或成功取得某一人类身份的证据，案例保持在请求层。
        en: After an initial foothold, a remote command launch, or an execution-context change, operators may inspect the
          current account, avoid confusing a service identity with a desktop user, and select further inquiries. The joint
          advisory's whoami and remote wmic invocation establish command adoption, while ESET's recovered package contains
          user-information requests. Public reporting provides neither per-host returns nor successful identification of a
          particular human, so these cases remain at the request level.
      - zh: 自动化植入体可把用户名放入系统画像，或在执行任务前重新确认所处身份。SUNBURST的CollectSystemDescription具备用户名画像能力，但该命令能力不证明其在任意具体机器执行。驻留内联方案适合已有可调度执行体和短时身份检查；身份查询不是获取更高权限的动作，结果仍受所用令牌、线程模拟与会话范围约束。
        en: Automated implants may place usernames in system profiles or recheck their identity before a task. SUNBURST's
          CollectSystemDescription supports username profiling, but that capability does not establish invocation on any particular
          host. Resident inline carriage suits an existing dispatchable agent and a short identity check. The inquiry itself
          grants no additional authority, and results remain constrained by token selection, thread impersonation, and session
          scope.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要执行命令、代码或管理读取，并能消费实际返回。读取自身身份通常不要求管理员，但其他用户会话与对象详情受到接口授权限制；已有令牌查询需要相应句柄权限。读取Linux真实UID并不取得现实身份，受控进程还可能继承陈旧或任意设置的USER与LOGNAME，攻击者必须容忍这些来源不一致。
          en: The adversary needs command, code, or management-read execution and access to actual returns. Self-identity
            commonly requires no administrator, while other-user sessions and object details depend on interface authorization,
            and token queries require suitable handle rights. A Linux real UID does not establish a real-world identity, and
            a controlled process can inherit stale or arbitrarily set USER and LOGNAME values. The adversary must tolerate
            disagreement among sources.
        - zh: 原生子项额外要求能够在既有受控进程中分派本次查询，保持线程、句柄与输出路径的有效性。固定BOF是短时单线程任务，阻塞或崩溃可影响整个代理；它既不要求创建新身份，也不保证线程名称与进程令牌属于同一人，更不能假设解析身份名不产生辅助网络访问。
          en: The native child additionally requires dispatching this inquiry within an existing controlled process and maintaining
            valid thread, handle, and output paths. The pinned BOF is a short single-threaded task whose blocking or crash
            can affect the agent. It requires no new identity and guarantees neither that thread name and process token concern
            the same person nor absence of auxiliary network access for name resolution.
      defender_model:
        paragraphs:
        - zh: 防守方可能具备经部署的Sysmon进程创建与终止记录以及Windows PowerShell 5.1脚本块日志，能够观察命令参数和部分代码语义；这些日志不提供命令标准输出、TokenUser或任意API返回。进程事件的User是创建时的进程账户，不能代替之后被模拟的线程身份或被查询会话用户。WMI的provider主体也不等于发起调查的客户。
          en: Defenders may deploy Sysmon process-creation and termination events and Windows PowerShell 5.1 script-block
            logging to observe arguments and some code semantics. These logs supply neither command stdout, TokenUser, nor
            arbitrary API returns. A process event's User is its account at creation rather than later thread impersonation
            or a queried session user. A WMI provider principal is also distinct from the initiating client.
        - zh: 要恢复内联任务与身份值，需要额外的、经版本和覆盖验证的调用与任务插桩，记录输入、返回、令牌句柄来源和代码执行位置，并与进程生命周期关联。此采集不是默认EDR能力，缺少健康或生命周期记录只能降低覆盖，不能把无事件判为无调查；本次仅提出可实施契约，未部署此采集或运行恶意软件实验。
          en: Recovering inline tasks and identity values requires additional call and task instrumentation validated for
            version and coverage, preserving inputs, returns, token-handle provenance, and code execution location alongside
            process lifetimes. This is not a default EDR capability. Missing health or lifecycle records reduce coverage rather
            than establish absence of an inquiry. This work proposes an implementable contract without deploying the collector
            or executing malware.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用日常身份与会话检查外观增加目的辨识所需语境
      en: Borrow routine identity and session-check appearance to increase the context needed to distinguish intent
    analysis:
      paragraphs:
      - zh: 攻击者选择与管理员确认账户相同的whoami检查，使局部痕迹保留正常命令的名称、参数与只读目的外观。联合公告直接记录采用并指出原生工具命令可能来自正常活动，因而需要批准任务与调用来源才能区分恶意调查。这里的观察影响是可区分性下降，而非事件消失；不把整个行动的长期隐蔽评价复制成单次查询的实测效果，机理保持中等置信度。
        en: Selecting the same whoami check used by administrators preserves the name, arguments, and read-only appearance
          of an ordinary account check. The joint advisory records adoption and warns that native-tool command lines can arise
          from benign activity, requiring approved-work and invocation context to distinguish adversarial inquiry. The observation
          effect is reduced distinguishability rather than missing events. Campaign-level stealth is not recast as measured
          effectiveness for one query, so mechanism confidence remains medium.
    evidence_keys:
    - REF-001341
    - REF-001293
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 用既有执行体承载具体身份任务使按工具启动识别的观察面缺少独立入口
      en: Carry a concrete identity task in an existing executor so tool-launch monitoring lacks a separate entry
    analysis:
      paragraphs:
      - zh: 固定SA.cna把whoami任务送入beacon_inline_execute，源码在该入口读取进程TokenUser和线程名称后输出。官方BOF文档明确以每任务新进程与注入为对照，因此可将“该身份任务不再另起工具”的设计连接到只监视工具创建时缺少本次查询输入的结果。调用、句柄、代码与输出仍可被更深观察恢复；该能力链不能证明野外采用、全部身份来源都具备同样效果或现场告警被绕过。
        en: The pinned SA.cna dispatches whoami through beacon_inline_execute, whose code reads process TokenUser and a thread
          name before producing output. Official BOF documentation explicitly contrasts per-task process creation and injection,
          connecting this task's omission of a separate utility to loss of an input for utility-creation-only monitoring.
          Calls, handles, code, and output remain recoverable through deeper observation. The capability chain establishes
          neither field adoption, an identical effect for every identity source, nor a bypassed operational alert.
    evidence_keys:
    - REF-001305
    - REF-001303
    - B012-T1033-REF-TOKENINFO
    - B012-T1033-REF-NAMEEX
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    subtechnique_keys:
    - B012-T1033-CHILD-INLINE
    narrative:
      paragraphs:
      - zh: 当前建立驻留上下文内联身份查询一项，以本次身份调查是否由既有受控执行体直接承载、相对于另起命令工具或每任务执行器的生命周期差分为稳定变量。需要身份读取的正面语义、任务到执行位置的链路以及明确承载对照；不从“没有whoami.exe”或单个令牌API调用推出该子项。
        en: The taxonomy establishes Resident-Context Inline Identity Inquiry, using whether an existing controlled executor
          directly carries this identity task, compared with a separate command utility or per-task executor, as the stable
          lifecycle variable. Positive identity-reading semantics, task-to-execution linkage, and an explicit carrier comparison
          are required. Neither an absent whoami.exe nor one token API call establishes the child.
      - zh: 令牌、真实UID、会话、环境与对象owner是事实来源，平台与工具是实现维度，均不各自充当匿迹子项。既存数据复用、选择性查询、事件通知和低频刷新虽已检查，现有资料没有把这些选择与本行为独立观察差连接；用户活动门控由NJT-0122负责，账户缓存集合由NJT-0131负责。若未来出现结论层级匹配的证据，应重新检查这些轴而非按来源名称扩项。
        en: Tokens, real UIDs, sessions, environments, and object owners are fact sources; platforms and tools are implementation
          dimensions, not separate evasion children. Preexisting-data reuse, selective inquiry, notifications, and low-frequency
          refresh were examined without evidence connecting these choices to independent observation differences for this
          behavior. NJT-0122 owns human-activity gating and NJT-0131 owns cached account sets. Conclusion-level evidence would
          warrant reassessing these axes rather than adding children by source name.
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B012-T1033-DET-IDENTITY
    mitigations:
      coverage: available
      mitigation_keys:
