  research:
    limitations:
      paragraphs:
      - zh: 入侵资料主要支持命令请求或画像能力，不公开逐主机返回。SUNBURST命令3的username和命令6的进程owner是不同事实，OIP消息的userId还是机器标识而非账户；KGB报文中的username只有样本报告值，已展示的其他WMI查询不能证明其获取方法。Lunar的用户信息命令包没有公开该字段的精确getter，不能补成whoami实测。
        en: Incident material primarily supports requests or profiling capability without public per-host returns. SUNBURST
          command 3's username and command 6's process owner are different facts, while OIP userId is a machine identifier
          rather than an account. KGB's beacon username is only a sample-reported value, and shown WMI inquiries for other
          facts do not establish its acquisition method. Lunar's user-information package does not disclose that field's exact
          getter and cannot be embellished into a measured whoami run.
      - zh: 源码支持内联身份能力与足迹对照，不支持实际恶意任务案例或量化逃逸；固定实现将进程SID与线程名称并列，模拟情形可能不一致。所提自定义采集需要句柄与任务插桩、版本验证、数据保护和容量评估；未完成这些部署时只能使用请求级检测，不能宣称识别所有进程内身份读取。
        en: Source code supports inline identity capability and a footprint comparison, not a malicious task case or quantified
          evasion. The pinned implementation prints a process SID alongside a thread name, which can diverge under impersonation.
          Proposed custom collection requires handle and task instrumentation, version validation, data protection, and capacity
          assessment. Without deployment, only request-level detection is available, not coverage of all in-process identity
          reads.
      - zh: 空字段、缓冲区不足、无控制终端、会话授权拒绝或部分捕获分别表示未知或失败，不证明无人、账户不存在或分析环境。macOS与网络设备保留固定父范围，本次未建立等效检测契约；没有执行恶意样本、性能对照或端点告警测试，检测窗口与缓解收益均为待本地校准的工程建议。
        en: Empty fields, insufficient buffers, no controlling terminal, denied session authorization, and partial capture
          separately indicate unknown or failure, not no human, nonexistent accounts, or an analysis environment. macOS and
          network devices remain in fixed parent scope without equivalent analytic contracts here. No malware execution, performance
          comparison, or endpoint-alert test was performed; detection windows and mitigation benefits remain engineering proposals
          requiring local calibration.
