    observables:
    - zh: 具体TokenUser查询返回带已验证来源的SID，或GetUserNameEx返回独立的线程名称。
      en: A concrete TokenUser query returns a SID with validated provenance, or GetUserNameEx independently returns a thread
        name.
    - zh: 同一task_id在既有受控执行实例的正面入口证据，不能用缺失工具事件代替。
      en: Positive task_id entry evidence inside an existing controlled instance, without substituting missing utility events.
    - zh: 句柄来源、返回状态或采集完整性不足时明确保留未知，而不是自动补成宿主身份。
      en: Incomplete handle origin, return status, or capture stays unknown instead of being filled with the host account.
    correlation:
      window:
        zh: 以实际任务进入至退出和句柄打开至关闭区间关联；失去退出或关闭时只保留已证实前缀，不以固定超时认定完整。
        en: Correlate over actual task entry-to-exit and handle open-to-close intervals; missing exit or close preserves only
          the proven prefix, not completeness inferred from a timeout.
      dimensions:
      - host_id
      - process_instance
      - thread_id
      - task_id
      - call_id
      - handle_value
      - handle_generation
      - monotonic_sequence
    false_positives:
    - zh: 合法认证组件、远程支持代理、插件及授权代码在现有宿主中读取身份。
      en: Legitimate authentication components, support agents, plugins, and authorization code read identity inside existing
        hosts.
    - zh: 受控红队或分析环境故意运行已批准内联身份任务。
      en: Authorized red teams and analysis environments deliberately run approved inline identity tasks.
    blind_spots:
    - zh: 没有该额外采集器时本分析不可用；未覆盖接口、架构或任务分派器不应自动归为阴性。
      en: The analytic is unavailable without the additional collector; uncovered interfaces, architectures, and dispatchers
        are not negative results.
    - zh: 句柄映射丢失、直接读取缓存、采集器被干扰或返回脱敏会使结果及来源不可解释。
      en: Lost handle lineage, direct cache reads, collector interference, and redacted returns can make results or provenance
        uninterpretable.
    tuning_guidance:
      paragraphs:
      - zh: 先用合法自身份查询验证成功、长度探测、缓冲区不足、进程与线程令牌、模拟名称差异、句柄重用和丢事件的状态机，明确支持的架构与getter范围。保留精确任务代码批准与到期例外，不能整体放行长寿命代理或将所有TokenUser调用判恶意。该验收是部署要求，本次仅静态核查文档与源码，未进行插桩、模拟或端点测试。
        en: First validate the state model with benign self-identity checks covering success, sizing probes, insufficiency,
          process and thread tokens, impersonated-name differences, handle reuse, and event loss. State supported architectures
          and getters explicitly. Preserve exact task-code approval and expiring exceptions rather than allowing all long-lived
          agents or flagging every TokenUser call. This is a deployment requirement; this research statically inspected documentation
          and code without instrumentation, impersonation, or endpoint testing.
