      subject_keys:
      - B012-T1033-PARENT
      claim_keys:
      - B012-T1033-CLM-FD
      conclusion_level: inferred-distinguishability
    - mechanism_ref: NM-BT
      subject_keys:
      - B012-T1033-PARENT
      - B012-T1033-CHILD-INLINE
      claim_keys:
      - B012-T1033-CLM-INLINE
      conclusion_level: capability-with-explicit-carrier-comparison
    child_existence_support:
    - child_key: B012-T1033-CHILD-INLINE
      claim_keys:
      - B012-T1033-CLM-INLINE
      - B012-T1033-CLM-TOKEN
      malicious_case_keys: []
    unsupported_or_deferred:
    - measured-evasion-or-alert-rate
    - field-adoption-of-pinned-inline-identity-task
    - kgb-username-acquisition-api
    - human-operator-attribution
    - universal-cross-platform-api-telemetry
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    actual_exemplar_path: matrix/tactics/TA0043-reconnaissance/techniques/NJT-0001-active-scanning/technique.yaml
    notes:
      zh: 逐字段对照实际NJT-0001而非近邻：定义分开直接目标与身份概念，匿迹分开工具外观与任务入口，三段范围保留正常反例与跨技术边界；场景、攻击者与防守方分别展开，父限制三段区分请求、能力和返回。子项独立解释任务承载、身份混合与插桩要求，首段准确以子项名称开头。DET分工、两条NJA的原生字段和每项自定义输入、MIT每目标用途效果限制均独立写作，未借近邻替换名称。
      en: Compared field by field with actual NJT-0001 rather than a neighboring package. Definition separates direct purpose
        from identity concepts; stealth separates tool appearance and task entry; three boundary paragraphs preserve benign
        counterexamples and adjacent owners. Scenarios and attacker/defender models are distinct, while three parent limitation
        paragraphs separate requests, capability, and returns. The child independently explains carriage, mixed identities,
        and instrumentation, opening its stealth section with its exact name. DET division, two NJA native mappings and custom
        inputs, and each MIT target's use/effect/limits were independently authored without neighbor-name substitution.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - fixed-baseline-extraction-read
    - original-source-download-and-hash
    - static-source-locator-extraction
    - yaml-serialization-and-validation
  limitations:
    paragraphs:
    - zh: 本研究为候选级静态文献与源码核查，未运行恶意样本、BOF、线程模拟或自定义采集器。形式校验通过不代表检测运行有效，生命周期保持draft直到主Agent完成统一集成门禁，人工领域审查仍独立。
      en: This candidate research statically checks publications and code without running malware, BOFs, thread impersonation,
        or the custom collector. Structural validation does not establish detection effectiveness. Lifecycle remains draft
        pending primary integration gates, with human domain review separate.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason:
      zh: 无法从一次查询、低频或已有会话推导蓄意稀释身份发现痕迹。
      en: A single inquiry, low frequency, or existing session does not establish deliberate dilution of identity-discovery
        traces.
  - mechanism_ref: NM-DO
    reason:
      zh: 本次身份读取没有独立的数据遮蔽证据，C2混淆与字符串加密属于另外的行为。
      en: The identity reads have no independent data-obscuration evidence; C2 obfuscation and string encryption are separate
        behaviors.
  open_questions:
  - question:
      zh: 是否有野外任务记录把具体身份读取与驻留内联承载直接连接？
      en: Does a field-task record directly connect a specific identity read with resident inline carriage?
    effect: recalibrate-child-adoption-confidence
  - question:
      zh: 本地部署能否可靠采集任务入口、TokenUser句柄来源及A/W名称失败状态？
      en: Can local deployment reliably capture task entry, TokenUser handle provenance, and A/W name failure states?
    effect: deployment-acceptance-before-result-level-coverage
