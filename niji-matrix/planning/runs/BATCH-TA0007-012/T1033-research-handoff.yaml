  mitigations:
  - temporary_key: B012-T1033-MIT-ORIGIN
    schema_version: 2.0.0
    type: mitigation
    name:
      zh: 身份查询来源与结果问责
      en: Identity-Inquiry Origin and Result Accountability
    summary:
      zh: 将身份读取绑定实际任务与来源，保留可核验的请求、身份语义和结果证据。
      en: Bind identity reads to actual tasks and origins while preserving verifiable requests, identity semantics, and result
        evidence.
    description:
      paragraphs:
      - zh: 基础自身份读取是认证、安装与支持工作的正常需要，难以普遍向已执行代码隐藏。本控制以调查来源、任务授权和证据解释为控制面，使普通工具外观或省去工具入口均不能自动充当放行依据；它主要支持发现与调查，不承诺禁止所有身份getter。
        en: Basic self-identity reads are needed by authentication, installation, and support and cannot generally be hidden
          from executing code. This control addresses inquiry origin, task authorization, and evidence interpretation so an
          ordinary tool appearance or omitted utility entry cannot automatically justify allowance. It chiefly supports detection
          and investigation rather than banning every identity getter.
    domains:
    - enterprise
    measures:
    - key: approved-identity-task-origin
      name:
        zh: 登记具体身份任务与来源
        en: Register concrete identity tasks and origins
      description:
        paragraphs:
        - zh: 对身份与会话调查登记owner、主体、目标、代码或脚本身份和有效期，按实际用途维护允许范围；在适用解释器入口验证应用控制的内容信任与能力限制，不以签名工具名替代任务授权。
          en: Register owners, principals, targets, code or script identity, and validity for identity and session inquiries,
            maintaining allowed scope by actual purpose. At applicable interpreter entries, validate application-control content
            trust and capability constraints rather than treating a signed utility name as task approval.
      control_type: governance
    - key: source-aware-identity-capture
      name:
        zh: 验证分来源身份采集
        en: Validate source-aware identity capture
      description:
        paragraphs:
        - zh: 对所需观察面分别验证工具参数、脚本语义、任务入口、令牌句柄与返回采集，记录接口、身份种类、目标会话和状态。进程账户、线程名称、对象owner、环境自报与结果保持独立；需要深层返回时先验证额外采集器及健康条件。
          en: Validate utility arguments, script semantics, task entry, token handles, and return capture for each required
            surface, recording interface, identity kind, target session, and status. Keep process account, thread name, object
            owner, environment assertion, and result independent; validate an additional collector and its health before relying
            on deep returns.
      control_type: detective-support
    - key: protected-identity-evidence-retention
      name:
        zh: 保护身份调查证据与完整性状态
        en: Protect identity-inquiry evidence and completeness state
      description:
        paragraphs:
        - zh: 将请求与可用返回、生命周期、健康和批准版本送入查询者不能任意修改的集中保留范围，按字段授权并保护敏感脚本或身份原文。拒绝、空值、部分与未知分别保留，审计记录不作为数据读取结果。
          en: Centrally retain requests and available returns, lifetimes, health, and approval versions beyond arbitrary modification
            by the querier, using field-level access and protection for sensitive script and identity content. Preserve denial,
            empty, partial, and unknown states separately; an audit record is not a data-read result.
      control_type: detective-support
    applications:
    - target_key: B012-T1033-PARENT
      use:
        paragraphs:
        - zh: 对系统用户调查，将帮助台和会话管理的身份检查绑定具体目标与有效期，记录whoami、会话命令和脚本所请求的事实种类。验证采集不会把Sysmon的进程User、终端服务的控制台UserName或USER变量混成正在使用该系统的人；需要确认取得结果时单独启用并验证对应返回采集。
          en: For system-user inquiries, bind help-desk and session-management checks to concrete targets and validity, recording
            the fact kinds requested by whoami, session commands, and scripts. Verify that capture does not merge Sysmon process
            User, terminal-services console UserName, and USER variables into a person using the system. Separately enable
            and validate relevant return capture when acquired results must be established.
      expected_effect:
        paragraphs:
        - zh: 日常工具外观获得可核对的作业语境，身份读取的来源与置信度更清楚，减少恶意查询借正常检查外观逃过目的核验的机会。受保护保留改善事后重建，结果未知时也不会把请求升级成身份已暴露。
          en: Routine utility appearance gains checkable work context and identity reads gain clearer provenance and confidence,
            reducing opportunities to avoid purpose checks through a normal-check appearance. Protected retention improves
            reconstruction without upgrading requests to exposed identities when results are unknown.
      limitations:
        paragraphs:
        - zh: 本应用不能阻止普通程序读取自身身份，也不阻止已控制的批准脚本或服务账户查询其获准会话。账户标识不等于人类归因，完整采集涉及隐私与容量成本；日志开启本身不证明检测有效或返回已被消费。
          en: This application does not prevent ordinary programs reading their own identity or compromised approved scripts
            and service accounts querying permitted sessions. Account identifiers do not attribute humans, and complete capture
            carries privacy and capacity costs. Logging alone proves neither detection effectiveness nor result consumption.
    - target_key: B012-T1033-CHILD-INLINE
      use:
        paragraphs:
        - zh: 对驻留内联任务，把批准范围绑定实际代码哈希与分派入口，并在所选宿主验证TokenUser与GetUserNameEx的句柄、线程和返回链。长期宿主的创建账户仅作来源线索；缺少任务入口或句柄来源时保留未知，不能因没有新工具启动而放行。
          en: For resident inline tasks, bind approval to actual code hash and dispatch entry, validating handle, thread,
            and return chains for TokenUser and GetUserNameEx in selected hosts. The long-lived host's creation account is
            only an origin clue. Missing task entry or handle provenance remains unknown, and absence of a utility launch
            is not an allow condition.
      expected_effect:
        paragraphs:
        - zh: 观察从每任务工具创建移到实际身份任务与返回，使借用宿主生命周期不再自动失去查询语义；分开进程SID和线程名称还可避免由混合输出造成的错误归属。受保护的句柄与任务前缀可以在部分丢失时保留已证实事实。
          en: Observation moves from per-task utility creation to actual identity tasks and returns, preserving inquiry meaning
            despite borrowed host lifetimes. Separating process SIDs and thread names also avoids misattribution from mixed
            output. Protected handle and task prefixes preserve established facts under partial loss.
      limitations:
        paragraphs:
        - zh: 额外插桩需要明确覆盖，普通进程日志不能替代。未覆盖getter、句柄复制缺口、直接缓存读取和采集器干扰仍会失去语义，应用控制不保证检查任意BOF缓冲区。这里的预期收益是工程推断，尚无本地部署或漏报率对照。
          en: Additional instrumentation needs explicit coverage and cannot be replaced by ordinary process logs. Uncovered
            getters, missing handle duplication, direct cache reads, and collector interference still lose semantics, and
            application control does not automatically inspect arbitrary BOF buffers. Expected benefits are engineering inferences
            without local deployment or a missed-detection comparison.
