- pointer: /defense_candidates/detection_analytics/0/false_positives/0
  value:
    zh: 支持人员的时区与 NTP 偏移排障、正常安装脚本和应用构建日期处理。
    en: Support troubleshooting of time zones and NTP offsets, legitimate installers, and application build-date processing.
- pointer: /defense_candidates/detection_analytics/1/false_positives/0
  value:
    zh: 日志、超时管理、性能测试、动画与安全软件的正常高频计时。
    en: Ordinary frequent timekeeping by logging, timeout management, benchmarking, animation, and security software.
- pointer: /defense_candidates/detection_analytics/1/false_positives/1
  value:
    zh: 系统刚启动、挂起恢复、ABI 差异和计数回绕形成的小读数或不连续输出。
    en: Small or discontinuous readings caused by fresh startup, suspend/resume, ABI differences, or counter wrap.
- pointer: /defense_candidates/mitigations/0/applications/0/use/paragraphs/0
  value:
    zh: 对通过解释器提供的时间支持功能，把 Get-Date、time /t 或经批准的 w32tm 读取包装限定到具体主体、脚本或入口、参数、远端目标和有效期，并保留受保护的内容审计。将给定日期格式转换、当前读数、远端偏移诊断和改时任务分开审批，避免一次常规时间查询授权扩展为任意代码或时钟修改能力。
    en: For interpreter-exposed time support, bind Get-Date, time /t, or approved w32tm read wrappers to concrete principals,
      scripts or entry points, parameters, remote targets, and validity periods, retaining protected content audit. Approve
      supplied-date conversion, current readings, remote-offset diagnostics, and clock modification separately so one routine
      inquiry does not confer arbitrary code or clock-setting capability.
- pointer: /defense_candidates/mitigations/0/applications/0/expected_effect/paragraphs/0
  value:
    zh: 缩小可借用的任意解释执行面，并使看似普通的时间诊断可与真实任务核对。受控入口之外的表达式、目标或能力使用可产生策略与调查证据；内容审计改善请求解释，但只有另行验证的输出采集才能证明具体读数。
    en: Narrow arbitrary interpreter execution available for borrowing and make ordinary-looking time diagnostics verifiable
      against actual work. Expressions, targets, or capabilities outside controlled entries can produce policy and investigative
      evidence. Content auditing improves request interpretation, while particular readings require separately validated output
      collection.
- pointer: /library_candidates/claims/0/statement_en
  value: Acquisition of system time, time-zone settings, and uptime after access provides environmental facts; original NerbianRAT
    and DazzleSpy studies separately support current-time acquisition paths.
- pointer: /library_candidates/claims/2/statement_en
  value: ESET DazzleSpy info and getSystemDate decompilation support date-time acquisition and Asia/Shanghai reporting display.
    timeIntervalSinceNow is relative to a date object rather than an unconditional Unix timestamp, and the display zone establishes
    neither victim zone nor location.
- pointer: /library_candidates/claims/3/statement_en
  value: UTC calendar values, FILETIME, Unix seconds, uptime, and performance counts require explicit types, epochs, widths,
    and sources; numeric or format similarity does not make them interchangeable.
- pointer: /library_candidates/claims/5/statement_en
  value: Temporal reading remains separate from analysis-environment gating. Uptime acquisition, a threshold branch, and a
    changed outcome after defensive rewriting form the original Upatre gate; an arbitrary GetTickCount call or wait does not
    establish that chain.
- pointer: /library_candidates/claims/7/statement_en
  value: Command analysis must distinguish current readings, supplied-date formatting, and modification. Process or exec success
    does not establish output, and particular returns require separate instance-bound collection.
- pointer: /library_candidates/claims/8/statement_en
  value: Validated entry-exit collection can recover selected time getters’ raw returns and bounded output by ABI while handling
    void returns, zero values, errors, pointers, wraparound, and coverage gaps. It assumes neither default EDR results nor
    a successor inferred from a read.
- pointer: /library_candidates/claims/9/statement_en
  value: Governing interpreter temporal work by principal, entry point, parameters, target, and validity period can narrow
    arbitrary execution and improve request accountability without blocking basic local getters or replacing reading collection.
- pointer: /library_candidates/claims/10/statement_en
  value: Joint advisory Appendix A records net time /dom and publishes logins.ps1 subtracting one day from Get-Date to bound
    later login-history queries. The literal request and scripted consumption are established, but actual dates, individual
    executions, and clock-change outcomes are not disclosed.
