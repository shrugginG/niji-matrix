    - source_type: command-result-capture-optional
      name:
        zh: 另行部署并绑定实例的命令输出采集
        en: Separately deployed instance-bound command-output collection
      channel: null
      required_fields:
      - host_id
      - boot_id
      - command_instance_id
      - process_identity
      - capture_start
      - capture_end
