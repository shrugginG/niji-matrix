    applications:
    - target_key: B012-T1124-PARENT
      use:
        paragraphs:
        - zh: 对通过解释器提供的时间支持功能，把 Get-Date、time /t 或经批准的 w32tm 读取包装限定到具体主体、脚本或入口、参数、远端目标和有效期，并保留受保护的内容审计。将给定日期格式转换、当前读数、远端偏移诊断和改时任务分开审批，避免一次常规时间查询授权扩展为任意代码或时钟修改能力。
          en: For interpreter-exposed time support, bind Get-Date time /t or approved w32tm read wrappers to concrete principals
            scripts or entries parameters remote targets and validity, retaining protected content audit. Approve supplied-date
            conversion current readings remote-offset diagnostics and clock modification separately so one routine inquiry
            does not confer arbitrary code or clock-setting capability.
      expected_effect:
        paragraphs:
        - zh: 缩小可借用的任意解释执行面，并使看似普通的时间诊断可与真实任务核对。受控入口之外的表达式、目标或能力使用可产生策略与调查证据；内容审计改善请求解释，但只有另行验证的输出采集才能证明具体读数。
          en: Narrow arbitrary interpreter execution available for borrowing and make ordinary-looking temporal diagnostics
            verifiable against actual work. Expressions targets or capabilities outside controlled entries can produce policy
            and investigative evidence. Content audit improves request interpretation while particular readings still require
            separately validated output collection.
      limitations:
        paragraphs:
        - zh: 该应用不阻止普通程序读取本地时钟，也不承诺受限语言禁止 Get-Date 或全部时间接口；原生 getter 与 vDSO 不受此解释器入口约束。批准身份或脚本被盗仍可读取，过窄控制会损害排障，故先验证兼容性并保留有期限例外。不能为掩藏时间而破坏正常同步或改写生产时钟。
          en: This application does not prevent ordinary programs reading local clocks or promise that constrained language
            blocks Get-Date or all temporal interfaces; native getters and vDSO paths are outside its interpreter-entry control.
            Stolen approved identities or scripts can still read and narrow controls can impair support, requiring compatibility
            validation and expiring exceptions. Do not disrupt synchronization or alter production clocks to conceal time.
