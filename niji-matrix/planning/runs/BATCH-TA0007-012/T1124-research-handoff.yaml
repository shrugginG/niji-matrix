  detection_strategies:
  - temporary_key: B012-T1124-DET-TIME
    name:
      zh: 时间调查的请求语义与读数来源核验
      en: Request-Semantics and Reading-Provenance Validation for Temporal Inquiry
    summary:
      zh: 将时间读取请求与来源明确的结果分层，核验调用者及批准工作，避免把常规计时或输出格式误认作恶意调查成果。
      en: Separate temporal requests from source-defined readings and verify callers and approved work without treating routine
        timing or output format as a malicious acquisition result.
    description:
      paragraphs:
      - zh: 本策略将命令与脚本请求分析同定制函数结果分析分开。前者恢复具体读取、目标与参数并核验授权语境，后者在已部署和验证的观察范围内解码本地时钟与运行时长。分析输出区分请求、取得、失败及未知，不把时间读取直接升级为环境门控，也不推断未被采集的远端返回。
        en: This strategy separates command and script request analysis from custom function-result analysis. The former restores
          reads, targets, and parameters with work context; the latter decodes local clocks and uptime within deployed and
          validated coverage. Outputs distinguish request, acquisition, failure, and unknown without upgrading reads into
          environmental gates or inferring uncaptured remote returns.
