    - zh: 有进入退出关联且按实际 ABI 验证的完整时间缓冲区或原始计数返回。
      en: Complete temporal buffers or raw counter returns joined across entry and exit and validated for the actual ABI.
    - zh: 读数类型、clock_id、单位、纪元或采集完整性与解释结论不一致。
      en: A conclusion inconsistent with reading type clock_id units epoch or capture completeness.
    - zh: 可归属到具体进程的时间读取与其记录任务或批准接口范围存在偏离。
      en: Attributable process time reads departing from a recorded task or approved interface scope.
    correlation:
      window:
        zh: 在同一主机启动和进程寿命内按线程、调用 ID 及进入退出边界关联；只在部署覆盖段内作结果结论。无可信时钟时用采集序号保留局部顺序，不推定跨主机先后。
        en: Join thread call ID and entry-exit boundaries within one host boot and process lifetime and assert results only
          inside deployment coverage. Preserve local order by collection sequence without a trusted clock and do not infer
          cross-host ordering.
      dimensions:
      - host_id
      - boot_id
      - process_identity
      - tid
      - call_id
      - parent_call_id
      - sequence
      - module_identity
      - symbol
      - clock_id
      - task_id
    false_positives:
    - zh: 日志、超时管理、性能测试、动画与安全软件的正常高频计时。
      en: Ordinary frequent timekeeping by logging timeout management benchmarking animation and security software.
    - zh: 系统刚启动、挂起恢复、ABI 差异和计数回绕形成的小读数或不连续输出。
      en: Small or discontinuous readings from fresh startup suspend and resume ABI differences and counter wrap.
    blind_spots:
    - zh: 未覆盖的 vDSO、直接共享内存或指令读取、被修改模块和未挂接进程使观察不完整；单个库函数挂接不能补全。
      en: Uncovered vDSO direct shared-memory or instruction reads modified modules and unhooked processes leave incomplete
        coverage that a single library hook cannot fill.
    - zh: 挂接会改变时序，恶意或正常程序都可能感知；无控制流和结果消费证据时不能认定环境判断或后继改变。
      en: Instrumentation changes timing and can be sensed by malicious or benign programs; without control-flow and consumption
        evidence no environmental decision or successor change is established.
    tuning_guidance:
      paragraphs:
      - zh: 在隔离的已知正常程序上验证 void、零返回、错误、不可读指针、32/64 位 ABI、回绕及 vDSO 路径，形成按版本的覆盖表，不运行恶意样本作为前提。采集白名单只限定研究或调查范围，不把白名单以外的缺失解释为无读取。保留原始类型与结果状态，再按真实任务核验；缩减采样会降低顺序与完整性，必须显式记录，不能用固定低
          uptime 阈值替代语境。
        en: Validate void and zero returns errors unreadable pointers 32/64-bit ABIs wrap and vDSO paths with known benign
          programs in isolation and maintain version-specific coverage without requiring malware execution. Collection allowlists
          define investigation scope rather than absence of reads outside it. Preserve raw types and result state before task-based
          validation. Sampling reduces sequence and completeness and must be explicit; a fixed low-uptime threshold cannot
          replace context.
