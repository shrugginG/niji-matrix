  limitations:
    paragraphs:
    - zh: 公开证据主要是原始样本反编译、行为分析与公告中的命令/脚本内容，未公开每个受害会话的时间读数。NerbianRAT 和 DazzleSpy 支持父行为，但不能证明特定匿迹动机或实际检测效果；原生诊断与管理脚本表面的机理仅为指定观察模型下的中等置信推断。DazzleSpy
        的 timeIntervalSinceNow 是日期对象相对 now 的间隔，随后构造日期和显示转换须分别解释，不能当成 Unix 秒或受害者本地时区。
      en: Public evidence is chiefly original decompilation behavioral analysis and advisory command/script content without
        individual victim readings. NerbianRAT and DazzleSpy support the parent rather than particular evasion motives or
        measured effectiveness. Native diagnostic and administrative-script surfaces support only a medium-confidence inference
        for the specified observer. DazzleSpy timeIntervalSinceNow is an interval relative to now; later date construction
        and display conversion require separate interpretation rather than Unix seconds or victim local zone.
    - zh: 时间读取具有大量合法用途，低 uptime、高频计时、沉默或时区名称均不足以判断恶意或分析环境。计数宽度、频率、挂起、回绕、时钟校正、远端往返与来源可信度都会影响解释；未经绑定的读数不能构成统一时间轴。更强结论需要真实任务语义、完整结果和后继消费证据；支持的当前分类为空，不将未验证缓存或低频假说包装成正式子项。
      en: Time reads have extensive legitimate uses and low uptime frequent timing silence or a zone name is insufficient
        for maliciousness or analysis-environment judgment. Width frequency suspend wrap clock correction remote round trips
        and source trust affect interpretation, and unbound readings form no unified timeline. Stronger conclusions need actual
        task semantics complete results and successor consumption. The present supported taxonomy is empty without promoting
        unverified caching or sparse-read hypotheses to formal children.
    - zh: 防御设计没有在本任务中部署或运行验证。命令分析只覆盖已声明 Windows/Linux 来源，函数分析只覆盖经 ABI 验证的选定 getter，不声称默认 EDR 返回、所有 vDSO/指令读取或 macOS、网络设备及
        ESXi 完整结果覆盖。生产应用前须验证采集与解析、身份寿命、错误、丢失、时钟偏差和输出绑定，并保护可能含主机与用户信息的脚本/会话记录。
      en: The defense designs were not deployed or runtime-validated in this task. Command analysis covers only declared Windows/Linux
        sources and function analysis only selected ABI-validated getters, not default EDR returns all vDSO/instruction reads
        or complete macOS network-device and ESXi result coverage. Before production validate collection decoding identity
        lifetimes errors loss clock skew and output binding, and protect script/session records that can contain host or user
        information.
