      - receive_time
    observables:
    - zh: 参数明确指向当前时间、时区、来源或远端偏移的命令或脚本请求。
      en: Command or script requests whose arguments specify current time, time zone, source, or remote offset.
    - zh: 具体入口、主体、目标或有效期与对应批准工作不一致。
      en: An entry principal target or validity that departs from the associated approved work.
    - zh: 经实例绑定且未截断的可解析输出，或明确的错误与部分捕获状态。
      en: Instance-bound untruncated parseable output or explicit error and partial-capture state.
    correlation:
      window:
        zh: 按一次进程、脚本块或 Audit exec 组的真实边界关联；可选输出只在已记录的该命令执行边界内绑定。跨主机关联须先验证偏差界限，缺失时不使用统一时间窗口补全身份。
        en: Correlate within actual process script-block or Audit exec-group boundaries; optional output binds only within
          the recorded execution boundary of that command. Validate skew bounds before cross-host joins and do not use a universal
          window to complete missing identity.
      dimensions:
      - host_id
      - boot_id
      - process_guid
      - process_id
      - script_block_id
      - audit_serial
      - command_instance_id
      - principal
      - source_target
      - authorization_id
    false_positives:
    - zh: 支持人员的时区与 NTP 偏移排障、正常安装脚本和应用构建日期处理。
      en: Support troubleshooting of time zones and NTP offsets legitimate installers and application build-date processing.
    - zh: 运维台账未及时登记的合法临时查询与自动化参数变更。
      en: Legitimate ad hoc inquiries and changed automation parameters not yet reflected in the work register.
    blind_spots:
    - zh: 原生进程内 getter、未记录的 shell 内建、未启用的脚本块审计或不完整参数不会被命令分析完整覆盖。
      en: Native in-process getters unrecorded shell built-ins disabled script-block auditing and incomplete arguments escape
        complete command coverage.
    - zh: 进程创建、exec 成功和网络连接不含时间输出；被盗批准脚本或身份可能满足现有允许条件。
      en: Process creation exec success and network connection lack temporal output while stolen approved scripts or identities
        may satisfy allowances.
    tuning_guidance:
      paragraphs:
      - zh: 分别验证每个受支持版本的读取、转换、修改、帮助和错误样例，台账以入口、具体参数、目标和期限收敛。对高频正常计时不设置通用恶意阈值，也不为减少告警而永久放行整个解释器。采集健康、输出截断与解析失败应独立呈现，保留 request-observed，避免把未知结果降成无活动。
        en: Validate read conversion modification help and error examples separately for each supported version and constrain
          the register by entry concrete parameters target and validity. Apply no universal malicious threshold to frequent
          ordinary timing and do not permanently allow an interpreter to reduce alerts. Present collection health output truncation
          and parse failure separately, retaining request-observed rather than turning an unknown result into no activity.
    evidence_keys:
    - REF-000230
    - REF-000463
    - REF-000201
    - REF-001042
    - B012-T1124-REF-CMDTIME
    - B012-T1124-REF-GETDATE
    - B012-T1124-REF-GNUDATE
    - B012-T1124-REF-W32TM
    - REF-000025
    - B012-T1124-REF-NETTIME
  - temporary_key: B012-T1124-NJA-GETTER
    strategy_key: B012-T1124-DET-TIME
    name:
      zh: 定制时间读取的类型与结果归属分析
      en: Typed-Result and Attribution Analytic for Instrumented Time Reads
    summary:
      zh: 在明确部署的函数观察范围内保留原始时间类型、状态与采集边界，核验结果确被读取而不将正常计时直接判为规避。
      en: Within explicitly deployed function coverage preserve raw temporal types status and capture boundaries to verify
        acquisition without directly classifying ordinary timing as evasion.
    domains:
    - enterprise
    platforms:
    - Windows
    - Linux
    logic:
      paragraphs:
      - zh: 此分析要求单独部署的自定义函数进入/退出采集，可通过验证过的 Frida Interceptor 或等价观察器实现，不假设 EDR 默认提供。只分析部署清单明确验证的 GetSystemTime、GetSystemTimeAsFileTime、GetTickCount、libc
          time 和 clock_gettime；清单记录 OS/用户 ABI、实际解析模块和符号、函数签名、结构布局、进程范围、挂接方式与时间段。进入时保存调用 ID、线程、参数和输出指针，退出时有界读取本次输出；地址不可读、只有进入、异常终止或采集丢失均保持
          unknown，不以空值代表零时刻。采集器在事件发生时登记主机、启动实例和进程创建身份，PID 不能跨寿命单独关联。 raw_errno 对没有此合同的 void/计数函数为空，result_state、位宽、单位和纪元由已验证解码器产生，并非
          API 原生字段。
        en: This analytic requires separately deployed custom function-entry and exit collection through a validated Frida
          Interceptor or equivalent observer, not a default EDR feed. Analyze only deployment-validated GetSystemTime, GetSystemTimeAsFileTime,
          GetTickCount, libc time, and clock_gettime. The manifest records OS/user ABI, actually resolved module and symbol,
          signature, layouts, process scope, hook method, and coverage interval. Retain call ID, thread, arguments, and output
          pointer on entry and bounded output on return. Unreadable pointers, entry-only calls, exceptional termination, and
          collection loss remain unknown rather than zero time. The collector records host boot and process-creation identity
          at the event, and PID alone never joins across lifetimes. raw_errno is null for void or counter functions without
          that contract; result_state width units and epoch are validated decoder metadata rather than native API fields.
      - zh: GetSystemTime 与 GetSystemTimeAsFileTime 返回 void，不构造 BOOL 成功值，也不将随手读取的 LastError 当作状态。前者按目标 ABI 读取完整 SYSTEMTIME
          的wYear、wMonth、wDayOfWeek、wDay、wHour、wMinute、wSecond、wMilliseconds 八个 16 位字段并验证日历范围，UTC 由接口合同给出；后者从输出 FILETIME 的
          dwHighDateTime 和 dwLowDateTime 组成无符号 64 位数，单位为自 1601-01-01 UTC 起的 100 纳秒，不能当作 Unix 秒。返回后的有效缓冲区采集才支持 result-observed，未读到完整结构只保留调用。GetTickCount
          的 DWORD 本身是 32 位毫秒读数，零值可以有效，约 49.7 天回绕；不从小值断言新启动设备，也不把一个计数直接转换成 UTC 日期。
        en: 'GetSystemTime and GetSystemTimeAsFileTime return void: invent no BOOL success value and do not treat an incidental
          LastError read as status. Decode all eight 16-bit SYSTEMTIME fields wYear wMonth wDayOfWeek wDay wHour wMinute wSecond
          and wMilliseconds for the target ABI and validate calendar ranges, deriving UTC from the interface contract. Combine
          output FILETIME dwHighDateTime and dwLowDateTime into an unsigned 64-bit value of 100-nanosecond intervals since
          1601-01-01 UTC rather than Unix seconds. Valid post-return buffer capture supports result-observed; incomplete structures
          establish only a call. GetTickCount directly returns a 32-bit DWORD millisecond reading, with valid zero and approximately
          49.7-day wrap. A small value proves neither a fresh boot nor a UTC date.'
      - zh: Linux time 读取按用户 ABI 的 time_t 位宽和符号解释，保持 1970-01-01 UTC 纪元秒及原始值；-1 的错误/纪元前表示存在歧义，未确认接口和错误合同不强判有效读数。clock_gettime
          只在返回 0 且完整 timespec 可读时解码 tv_sec 与 tv_nsec，纳秒字段须在 0 到 999999999；返回 -1 时保存当次原始 errno，而非消费残留缓冲区。clock_id 必须保留：CLOCK_REALTIME
          是可调整日历，Linux CLOCK_MONOTONIC 不计系统挂起时长，CLOCK_BOOTTIME 计入挂起，CPU-time clocks 则不是开机时长。libc/vDSO 路径按实际模块和架构验证；只挂 syscall、单一
          libc 符号或一条指令不能声称捕获所有读取，重复挂接亦须用调用链去重。 32 位进程若采用 64 位 time_t，必须验证完整 ABI 返回寄存器或采用等价完整返回采集，不能把指针宽度的单个 Frida retval 当作完整
          64 位值。
        en: 'Decode Linux time using the user ABI''s time_t width and signedness, retaining raw seconds since 1970-01-01 UTC.
          A -1 value can be ambiguous between error and a pre-epoch reading; establish no valid result without the interface
          and error contract. Decode clock_gettime tv_sec and tv_nsec only after return 0 and complete readable timespec,
          requiring nanoseconds from 0 through 999999999. On return -1 retain that call''s raw errno rather than stale buffer
          contents. Preserve clock_id: CLOCK_REALTIME is adjustable calendar time, Linux CLOCK_MONOTONIC excludes suspend,
          CLOCK_BOOTTIME includes it, and CPU-time clocks are not uptime. Validate actual libc/vDSO modules and architecture;
          syscall-only observation, one libc symbol, or one instruction cannot establish complete read coverage. Deduplicate
          multiple hooks by call chain. A 32-bit process using 64-bit time_t requires validated full ABI return-register capture
          or an equivalent complete result path; a single pointer-width Frida retval does not establish the full 64-bit value.'
      - zh: 将类型明确的结果与同进程的已记录任务或批准工作核验，但没有任务证据时只输出 temporal-read-observed，不从频率、低 uptime 或查询后的静默推断恶意及门控。事件接收时间、线程内顺序和采集序号用于还原调用，返回的
          wall clock 不能作为唯一关联基准；没有同来源边界的两个计数不能相减。QPC 与 CPU 周期不在本分析的解码范围；它们不具有自动的 UTC 含义，性能计数换算还需已绑定频率。结果证据不自动证明程序已上报或依该值改变后继，后者须另采控制流或通信证据。
        en: Compare typed results with a recorded task or approved work in that process, but without task evidence emit only
          temporal-read-observed. Frequency, low uptime, and subsequent silence establish neither maliciousness nor gating.
          Reconstruct calls with receive time, within-thread order, and collection sequence rather than returned wall clock
          alone, and never subtract counters lacking shared source boundaries. QPC and CPU cycles are outside this analytic's
          decoding coverage; they have no automatic UTC meaning and performance-count conversion requires bound frequency.
          Result evidence does not establish reporting or a value-conditioned successor, which needs separate control-flow
          or communication evidence.
