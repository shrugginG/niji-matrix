recommendation:
  decision: retain
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 保留 T1124 对本地或远端系统时间、时区设置和运行时长的直接采集范围。Check Point 对 Linux NerbianRAT 初始化的原始分析明确记录当前时间采集，ESET 的 DazzleSpy 原文及反编译图则记录当前日期时间取得和上报前的显示时区转换。二者为父行为提供独立的一手样本依据，不要求把时间读取改写为反沙箱判断或执行延迟。
      en: Retain T1124's direct acquisition of local or remote system time, time-zone settings, and uptime. Check Point's
        original analysis explicitly records current-time collection during Linux NerbianRAT initialization, while ESET's
        DazzleSpy report and decompilation document date-time acquisition and a reporting-time-zone conversion. These independently
        support the parent behavior without rewriting time reading as sandbox classification or execution delay.
    - zh: 仅将借用原生时间诊断和管理脚本外观映射到特征伪装，置信度中等。联合公告的具体时间命令与 logins.ps1 中 Get-Date 的实际采用，配合官方正常用途合同，支持这一有限观察模型；普通时间 API、NerbianRAT
        整体评价和 DazzleSpy 的显示时区均不证明该机理。未发现独立成立的时间采集匿迹变量，故不为补齐数量设立子项。
      en: Map only borrowing native temporal diagnostics and administrative-script appearance to medium-confidence Feature
        Disguise. Actual temporal commands and Get-Date in logins.ps1 from the joint advisory paired with official legitimate-use
        contracts support this bounded observation model. Routine time APIs overall NerbianRAT descriptions and DazzleSpy
        reporting zone establish no such mechanism. No independent temporal-acquisition evasion variable was established so
        no child is created to fill a count.
  scope_notes:
    paragraphs:
    - zh: 时间源、读数单位、纪元、时区转换和采集位置必须保留。UTC 日历、可调整的 wall clock、运行时长、单调计数与性能计数不是同一事实；格式化成某地区时间不能证明受害机设置或物理位置。读取后才发生的分析环境判断、目标护栏、调度、等待和修改各自需要后继证据，不在本项重复分类。
      en: Preserve time source, units, epoch, zone conversion, and acquisition location. UTC calendar time, adjustable wall
        clock, uptime, monotonic counts, and performance counts are different facts; formatting a value in a regional zone
        establishes neither victim settings nor physical location. Subsequent analysis-environment decisions, target guardrails,
        scheduling, waiting, and modification require their own successor evidence and are not duplicated here.
