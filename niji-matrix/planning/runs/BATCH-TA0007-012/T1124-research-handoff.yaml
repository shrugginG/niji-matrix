  detection_analytics:
  - temporary_key: B012-T1124-NJA-COMMAND
    strategy_key: B012-T1124-DET-TIME
    name:
      zh: 时间命令请求与工作范围分析
      en: Temporal Command Request and Work-Scope Analytic
    summary:
      zh: 按真实参数区分当前时间读取、给定日期格式化及修改，并保留本地或远端请求的调用者与批准范围。
      en: Use actual parameters to distinguish current-time reads, supplied-date formatting, and modification while preserving
        caller and work scope for local or remote requests.
    domains:
    - enterprise
    platforms:
    - Windows
    - Linux
    logic:
      paragraphs:
      - zh: Windows 从 Sysmon Event 1 的 Computer、UtcTime、ProcessGuid、ProcessId、Image、CommandLine、User、ParentProcessGuid 规范化为主机、事件时间和进程请求，Event
          5 仅补充该 ProcessGuid 的结束；事件时间不是被查询时钟的返回。Windows PowerShell 5.1 已启用 4104 时，按 Computer、Execution ProcessID、ScriptBlockId
          和 MessageNumber/MessageTotal 重组 ScriptBlockText；部分片段保留 partial。只有 PID 的脚本事件须与同主机唯一已知生命周期相交，缺少结束或同号复用不能跨空缺强行归属。Linux
          Audit 按 node、启动实例及 msg=audit 的时间/序列聚合 SYSCALL、EXECVE 和 PROCTITLE，记录 arch、syscall、success、pid、ppid、auid、uid、euid、exe
          及 argc/argv；按本机 ABI 解码 syscall 与十六进制内容，参数不完整则不声称完整请求。Audit 事件组建立此次 exec 身份，不假设另有完整 Linux 进程树。 boot_id、接收时间和参数完整性是采集器元数据，不能伪称
          Sysmon 或 Audit 的原生字段；Event 5 不提供的命令内容按事件类型留空。
        en: On Windows, normalize Sysmon Event 1 Computer, UtcTime, ProcessGuid, ProcessId, Image, CommandLine, User, and
          ParentProcessGuid into host, event time, and process request; Event 5 supplies only that ProcessGuid's end. Event
          time is not the queried clock's return. Where Windows PowerShell 5.1 Event 4104 is enabled, assemble ScriptBlockText
          by Computer, Execution ProcessID, ScriptBlockId, and MessageNumber/MessageTotal, retaining incomplete blocks as
          partial. PID-only script events require a unique intersecting lifetime on the same host; missing termination or
          reuse cannot justify joins across gaps. On Linux, group Audit SYSCALL, EXECVE, and PROCTITLE by node, boot instance,
          and msg=audit time/serial, retaining arch, syscall, success, pid, ppid, auid, uid, euid, exe, and argc/argv. Decode
          syscall and hexadecimal content for the local ABI and do not assert a complete request from incomplete arguments.
          The Audit event group identifies that exec, without presuming a complete Linux process tree. boot_id receive time
          and argument completeness are collector metadata rather than native Sysmon or Audit fields; command fields absent
          from Event 5 remain null by event type.
      - zh: 对 cmd 的 time /t、无指定日期的 Get-Date、w32tm /tz、/query 或 /stripchart，以及不带给定输入的 GNU date，按版本语法恢复实际信息对象与目标。time 为 shell
          内建，不要求出现 time.exe；PowerShell 无新进程时由已采集的脚本语义给出请求。Get-Date -Date 或显式年月日字段、date --date/--reference、帮助及纯格式转换不自动归为当前时间读取；date
          -s/--set 与设置操作数、time 的设置参数、w32tm /config、/resync 或 /unregister 进入修改或混合动作待独立核验。date -u 和输出格式是呈现条件，不能当作机器时区；/query
          的配置、来源、状态与 /stripchart 的远端偏移也须分开。无法解析的别名、动态表达式或缺失参数保持 unknown，不凭工具名称补全。 对 net time 保留完整远端名、/domain 与 /set 等参数；/set
          同步调用端时钟而不是远端服务器。公告原样 /dom 作为观察到的请求保存，只有按部署版本验证其缩写语法后才解析为 /domain；无 /set 不推断改时，仍不能从请求推出返回成功。
        en: 'Restore information object and target using version-specific grammar for cmd time /t, Get-Date without a supplied
          date, w32tm /tz, /query or /stripchart, and GNU date without supplied input. time is a shell built-in and needs
          no time.exe; collected script semantics can establish a PowerShell request without a new process. Get-Date -Date
          or explicit calendar fields, date --date/--reference, help, and pure format conversion do not automatically constitute
          current-time reads. date -s/--set or setting operands, time setting arguments, and w32tm /config, /resync or /unregister
          require separate modification or mixed-action validation. date -u and output formats are presentation conditions
          rather than machine-zone evidence; /query configuration, source and status also differ from /stripchart remote offset.
          Unresolved aliases, dynamic expressions, and missing arguments remain unknown rather than being completed from utility
          names. Preserve complete remote names and /domain or /set for net time: /set synchronizes the calling clock rather
          than changing the remote server. Retain the advisory exact /dom as an observed request and parse it as /domain only
          after deployed-version abbreviation validation. Absence of /set establishes no clock change and the request still
          proves no successful return.'
      - zh: 将可解析请求与另行维护的工作台账核对，台账须给出主体、入口或脚本指纹、允许的命令/参数形状、目标、目的和有效期；不按用户名、签名或系统工具永久放行。偏离台账产生未经解释的时间调查线索，不能仅由台账缺失判为恶意。默认结果级别为
          request-observed；进程成功退出和 Audit success 只分别表示执行状态或 exec 成功，不证明输出。只有另行部署的会话输出采集明确绑定命令实例、主机/启动实例、真实进程身份、流和执行边界，并给出原始文本、语言/版本、截断及解析状态时，才记录具体
          returned-reading；错误文本、格式化给定日期和部分捕获不升级为取得当前时间。
        en: 'Compare parseable requests with a separately maintained work register containing principal, entry or script fingerprint,
          permitted command/argument shape, target, purpose, and validity. Do not permanently allow by username, signature,
          or system utility. Deviations yield unexplained inquiry leads, not maliciousness from a missing record alone. The
          default level is request-observed: successful process exit and Audit success describe execution state or exec success
          rather than output. Record a returned-reading only where separately deployed session-output collection binds command
          instance, host/boot, real process identity, stream, and execution boundaries and supplies raw text, language/version,
          truncation, and parse state. Error text, supplied-date formatting, and partial capture do not establish current-time
          acquisition.'
      - zh: 保留源日志时间、接收时间、序列号和经过验证的时钟偏差界限，不将疑似主机读数作为自身关联时钟。w32tm 的远端目标只是请求所指来源，/stripchart 返回偏移不是远端绝对日期；没有绑定输出时不能声称响应内容，网络连接也不能代替它。以命令实例和脚本/exec
          组为最小单元关联，不用统一跨主机时间阈值推定批量调查；采集健康显示缺日志、丢包或规则未启用时降低覆盖声明，而非据此判定规避。 source_clock_offset_bound 的单位为毫秒，可为未知；缺少可信界限时不假设日志源已同步。
        en: Preserve source-log time, receive time, sequence, and validated skew bounds without using the suspected host's
          returned reading as its own correlation clock. A w32tm remote target identifies the requested source, and a /stripchart
          offset is not its absolute date. Without bound output, neither response contents nor acquisition can be asserted
          from a network connection. Correlate at command-instance and script/exec-group granularity, without a universal
          cross-host window implying a campaign. Missing logs, loss, or disabled rules in collection health reduce the coverage
          claim rather than establish evasion. source_clock_offset_bound is in milliseconds and may be unknown; absent a trusted
          bound do not assume the log source is synchronized.
