      - collector.id
      - collector.coverage
      - collector.drop_count
      - collector.last_heartbeat_host_ns
    - source_type: sample-native-call-and-controlflow-capture
      name:
        zh: 专门部署的参数返回与可选执行块采集
        en: Deployed parameter and return capture with optional executed blocks
      channel: custom Frida Interceptor and optional Stalker export; not default EDR
      required_fields:
      - run.id
      - event.id
