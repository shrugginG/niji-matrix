    false_positives:
    - zh: 基准测试、许可、真实启动、休眠恢复、时间同步和低性能可产生时间分支，仍需分析判断与恶意后继上下文。
      en: Benchmarks, licensing, real boot, resume, synchronization, and slow systems produce timing branches and require
        analysis-judgment and malicious-successor context.
    blind_spots:
    - zh: 未控硬件/外部源、无频率或回绕解码、条件数据流未知、测量扰动、非确定、超时和无效校准会破坏因果；纯延迟即使暴露载荷仍不满足此分析。
      en: Uncontrolled hardware/external sources, missing frequency or wrap decoding, unknown condition dataflow, disturbance,
        nondeterminism, timeout, and invalid calibration break attribution. Pure delay does not satisfy this analytic even
        if it exposes a payload.
    tuning_guidance:
      paragraphs:
      - zh: 只改变样本实际消费且已校准的时间输入，保留原整数比较、条件证据、主机经过时间及未控源；按样本恢复阈值，不设通用秒数。加速仅在覆盖已验证时称一致，只hook Sleep不能如此声称。
        en: Change only calibrated time inputs consumed by the sample, retaining integer comparisons, condition evidence,
          host elapsed time, and uncontrolled sources. Recover sample-specific thresholds instead of universal seconds. Call
          acceleration coherent only for validated coverage; hooking Sleep alone is insufficient.
    evidence_refs:
