proposed_content:
  schema_version: 2.0.0
  type: technique
  id: NJT-0122
  name:
    zh: 本地分析环境条件化规避
    en: Local Analysis-Environment Conditioned Evasion
  summary:
    zh: 攻击者发现本地分析环境证据，并由判断控制退出、诱饵或核心功能释放，使分析获得条件化路径。
    en: Adversaries discover local analysis-environment evidence and use their judgment to control exit, decoy behavior, or
      core-function release, exposing a conditional path to analysis.
  aliases:
  - Virtualization/Sandbox Evasion
  - T1497
  classification:
    tactic_refs:
    - TA0005
    - TA0007
    origin:
      kind: attack-adapted
      source_attack_id: T1497
      source_attack_version: '19.1'
    decision_ref: DEC-TA0005-T1497
  definition_and_concept:
    paragraphs:
    - zh: 本地分析环境条件化规避是已经在主机或来宾执行的程序采集本地系统工件、人类活动或时间证据，判断当前环境是否为自动分析、沙箱或短生命周期测试，并让判断控制退出、诱饵、等待、解码或核心载荷释放。它通过发现当前执行环境来选择后继行为，使分析者获得的路径少于满足放行条件时的路径，因此同时具有发现与匿迹意义。
      en: Local Analysis-Environment Conditioned Evasion is behavior in which a program already executing on a host or guest
        collects local system artifacts, human-activity evidence, or timing evidence, judges whether it is in automated analysis,
        a sandbox, or a short-lived test, and uses that judgment to control exit, decoy behavior, waiting, decoding, or core-payload
        release. Discovery of the current execution environment selects successor behavior and exposes a narrower path to
        analysis than under release conditions, serving both Discovery and Stealth.
    - zh: 概念锚是证据读取、分析环境判断与后继行为之间可核验的因果链。系统属性、用户信息和时钟读取只是可能的输入，不能凭一次API、没有子进程或没有联网推断门控。相同检查可以由命令、脚本或程序内接口实现；这些承载方式、操作系统和沙箱品牌不构成另一项父技术。
      en: The conceptual anchor is a verifiable causal chain from an evidence read through analysis-environment judgment to
        successor behavior. System attributes, user information, and clock reads are possible inputs; one API call, absent
        children, or absent networking does not establish gating. Commands, scripts, and in-process interfaces can implement
        the same check. These carriers, operating systems, and sandbox brands do not define another parent technique.
  stealth_characteristics:
    paragraphs:
    - zh: 本地分析环境条件化规避把完整执行改造成条件化可见路径：相同样本可能在疑似分析条件下早退、等待或保留下一阶段，而在放行条件下继续。系统工件组合、活动是否充分，以及运行时间或时间关系分别改变分类依据；企业VM、离席用户和刚重启终端也可满足相同条件，因此差分不自动证明恶意或物理主机身份。
      en: 'Local Analysis-Environment Conditioned Evasion converts complete execution into a conditionally visible path: the
        same sample may exit, wait, or withhold a next stage under suspected analysis conditions and continue under release
        conditions. System-artifact combinations, activity sufficiency, and uptime or timing relationships provide distinct
        classification evidence. Enterprise VMs, absent users, and recently restarted endpoints can satisfy the same conditions,
        so a differential does not automatically establish malice or physical-host identity.'
    - zh: 环境读取、返回值、比较位置、替代分支和后继工件仍可能留下痕迹。任意API返回、执行块、解码缓冲区及所有时钟需要专门部署并验证的采集器。受控重跑能加强因果判断，但插桩、外部响应、随机性及同时变化的环境条件会混淆结果，不能保证恢复全部能力。
      en: Environment reads, returned values, comparison locations, alternate paths, and successor artifacts can leave traces.
        Arbitrary API returns, executed blocks, decoded buffers, and all clock sources require specifically deployed and validated
        collectors. Controlled reruns can strengthen causal attribution, but instrumentation, external responses, randomness,
        and co-varying conditions can confound results and prevent recovery of hidden capability.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有意用本地证据识别分析环境，并由判断实际改变核心后继行为的情形。来源直接记录的检查—比较—退出或释放链可以成立；实验判断需同样本和启动条件的受控对照、采集完整性与可重复差分。请求、成功返回、空结果、失败和未采集分开；只看到查询仍按直接信息对象记录发现或尝试。
      en: Include deliberate use of local evidence to identify an analysis environment where judgment changes core successor
        behavior. A directly documented check, comparison, and exit-or-release chain can establish the behavior; experimental
        attribution needs controlled same-sample and launch conditions, capture completeness, and reproducible differentials.
        Requests, successful returns, empty results, failures, and uncaptured data remain separate. Queries alone retain their
        direct discovery object or attempt status.
    - zh: 受管VM清单和虚拟化基础设施事实属于T1673，不能替代程序对自身执行环境的沙箱判断；云资源图归NJT-0139，系统属性、进程、软件、注册表、当前用户及时间事实各有相邻发现范围。读取与门控均有独立证据时可分别记录，不能因返回含虚拟化字符串就重复建立父项。
      en: Managed-VM inventories and virtualization-infrastructure facts belong to T1673 and do not establish self-sandbox
        judgment. Cloud-resource graphs belong to NJT-0139, while system attributes, processes, software, Registry, current-user,
        and time facts retain neighboring discovery scopes. Record acquisition and gating separately only when each is evidenced;
        a virtualization string does not justify another parent.
    - zh: 调试器专用状态与观察通道归NJT-0106；仅消耗时间而未判断环境归NJT-0107，包括单纯timer/message或RDTSC等待循环；匹配预期目标或派生目标密钥归NJT-0109。合法许可、兼容性、性能校准、辅助功能及无人值守业务会产生相似行为。点击或文档关闭若只是普通执行触发，不证明分析环境判断。
      en: Debugger-specific state and observation channels belong to NJT-0106. Time consumption without environment judgment
        belongs to NJT-0107, including timer/message or RDTSC waits. Intended-target matching or key derivation belongs to
        NJT-0109. Licensing, compatibility, performance calibration, accessibility, and unattended workloads produce similarities.
        A click or document close that merely triggers execution does not establish analysis-environment judgment.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 样本取得本地执行后，可在下一阶段投递前检查系统工件，在文档事件后判断活动是否充分，或用运行时间判断短生命周期环境。IRONGATE的dropper检查后不部署.NET文件，放行路径的部署也不等于载荷已运行；Upatre的uptime比较和早退由原始分析直接记录。活动门控有运营观察，不据此虚构每种交互的归因活动。
        en: After obtaining local execution, samples can inspect system artifacts before next-stage delivery, assess activity
          after document events, or use uptime to judge short-lived environments. IRONGATE droppers withheld a .NET file;
          delivery on the release path did not establish execution. Original analysis records Upatre uptime comparison and
          exit. Operational observations support activity gating without establishing an attributed operation for every interaction
          pattern.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者已能执行本地程序或文档代码，读取权限内环境事实并选择后继路径，无需拥有虚拟化管理权。它需了解欲识别的工件或活动分布并容忍企业VM、无人值守服务和真实重启；组合条件可能降低某些误判，也增加维护、兼容性及可检测查询成本。
          en: The adversary can execute local program or document code, read permitted environmental facts, and choose successors
            without virtualization-management authority. It needs knowledge of the artifacts or activity distributions being
            assessed and must tolerate enterprise VMs, unattended services, and real reboots. Combined conditions may reduce
            some false assessments while adding maintenance, compatibility, and detectable-query costs.
      defender_model:
        paragraphs:
        - zh: 常规端点记录只提供明确配置的进程、文件或网络结果；实验平台另需运行清单、参数/返回采集、进程生命周期映射、环境变更及健康状态。执行块、内存、输入回放和时间加速均是单独启用能力，缺少时保留未知。
          en: Ordinary endpoint records provide only configured process, file, or network outcomes. Experiments additionally
            need run manifests, parameter-and-return capture, process-lifetime maps, environment changes, and health state.
            Executed blocks, memory, input replay, and acceleration are separately enabled capabilities and remain unknown
            when absent.
        - zh: 同样本实验保留镜像、参数、实际输入、外部重放、主机独立时间和预算，逐项改变条件并重复对照。外部依赖不能重放、样本非确定、插桩被识别或多变量共变时，结果只能保留候选关联或不完整实验。
          en: Same-sample experiments retain images, arguments, actual inputs, external replay, independent host time, and
            budgets, varying conditions and repeating controls. Unreplayable dependencies, nondeterminism, detected instrumentation,
            or co-varying features limit results to candidate associations or incomplete experiments.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 用分析环境判断限制当前条件下的核心路径暴露
      en: Use analysis-environment judgment to limit core-path exposure under current conditions
    analysis:
      paragraphs:
      - zh: 攻击者把本地返回证据送入环境判断，再让结果选择早退、诱饵或保留。与放行路径相比，检查路径仍有查询与判断，却减少后继能力的可见执行，动态报告可能低估能力；IRONGATE条件化不部署和Upatre条件化早退支持行为透明因果链。
        en: The adversary feeds returned evidence into environment judgment and selects exit, decoy, or withholding. Compared
          with release, the checking path retains queries and assessment while reducing visible successor capability, so dynamic
          reports may underestimate the sample. IRONGATE conditional non-deployment and Upatre conditional exit support this
          Behavioral Transparency chain.
      - zh: 效果依赖样本能区分分析与放行条件，并不抹除代码、读取或替代分支。受控差分、静态路径和工件能补证；只有查询、纯等待或执行错误尚未证明该机理。
        en: The effect depends on distinguishing analysis and release conditions and does not erase code, reads, or alternate
          paths. Controlled differentials, static paths, and artifacts can add evidence; queries, pure waits, or execution
          errors alone do not establish the mechanism.
    evidence_refs:
    - REF-000443
    - REF-000444
    - REF-000445
    confidence: high
  subtechnique_taxonomy:
    narrative:
      paragraphs:
      - zh: 三项按攻击者门控所用的真实性变量与可证伪对照划分：系统工件组合需要特征变体，活动充分性需要有效会话动作，时间真实性需要uptime或时间关系的环境判别。变量能组合，但受控面、正常反例、痕迹和防御合同不同；数量和主题与ATT相似不是保留它们的理由。
        en: 'The three children partition attacker-controlled realism variables and falsifiable controls: system-artifact
          combinations need feature variants, activity sufficiency needs valid session actions, and temporal realism needs
          environment judgment from uptime or timing relationships. Variables can combine but differ in control surfaces,
          benign counterexamples, traces, and defense contracts; numerical or thematic similarity to ATT is not the reason
          for retaining them.'
      - zh: 最近输入时间用于活动充分性时归NJS-0122-002人类活动充分性门控；uptime用于环境寿命判断时归NJS-0122-003时间真实性校验，不因原报告称pocket litter而重复归类。浏览历史等作为使用活动证据归活动项；已知分析产品目录匹配归NJS-0122-001系统指纹分析环境判别。纯等待和正常用户执行触发均不自动纳入。
        en: Last-input timing used for activity sufficiency belongs to NJS-0122-002 Human-Activity Sufficiency Gating. Uptime
          used for environment-age judgment belongs to NJS-0122-003 Temporal Realism Verification regardless of a source calling
          it pocket litter. Browser history used as activity evidence belongs to the activity child, while known analysis-product
          directory matches belong to NJS-0122-001 System-Fingerprint Analysis Classification. Pure waiting and ordinary user-execution
          triggers do not automatically qualify.
    coverage: established
    subtechnique_refs:
    - NJS-0122-001
    - NJS-0122-002
    - NJS-0122-003
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000119
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000120
  evidence:
    claim_refs:
    - CLM-000619
    - CLM-000620
    - CLM-000655
    - CLM-000656
    - CLM-000657
    case_refs:
    - CASE-000164
    - CASE-000165
    reference_refs:
    - REF-000410
    - REF-000443
    - REF-000444
    - REF-000445
    - REF-000625
    - REF-000907
    - B012-T1497-REF-TICKCOUNT
    - B012-T1497-REF-HRTIME
  research:
    limitations:
      paragraphs:
      - zh: 原始样本支持父行为；三分Niji分类是基于不同变量与验证方法的高置信推断，并非来源直接发布的分类。IRONGATE可能为测试、PoC或研究，感染途径、触发和行动归属未知；Upatre阈值和结果限于报告样本。活动项没有每种模式的归因案例或通用自然度要求。
        en: Original samples support the parent behavior. The three-way Niji taxonomy is a high-confidence inference from
          distinct variables and validation methods, not a taxonomy directly published by sources. IRONGATE may be testing,
          a PoC, or research, with unknown infection route, trigger, and attribution. Upatre thresholds and outcomes concern
          the reported sample. Activity gating lacks attributed cases for every pattern or a universal naturalness requirement.
      - zh: 固定19.1由REF-000625及本批提取锚定，REF-000410网页此次标示v19.2，只作行为辅助。查询、时间消耗和结果缺失不能独立证明规避。防御是待部署验证的实验合同，非默认EDR能力或实测检测率；Linux/macOS适配仍待验证。本研究未执行恶意样本实验。
        en: REF-000625 and this batch extraction anchor fixed 19.1; REF-000410 currently labels its page v19.2 and only corroborates
          behavior. Queries, time consumption, and missing outcomes do not independently establish evasion. Defenses are experiment
          contracts requiring deployment validation, not default EDR capability or measured detection rates. Linux/macOS adapters
          require validation. No malware experiment was performed.
  lifecycle:
    status: review
    version: 0.2.0
    created: '2026-09-20'
    modified: '2026-09-21'
