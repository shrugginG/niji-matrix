  - pointer: /gap_statement_en
    value: Reuse existing NJT-0122 and its three native children. This batch independently reviews admission, taxonomy, and
      defenses before extending TA0007 without duplicate objects. Preserve system-artifact, activity-sufficiency, and temporal-judgment
      boundaries while retaining ordinary discovery and pure delay in neighboring scopes.
  - pointer: /evidence_refs
    value:
    - REF-000410
    - REF-000443
    - REF-000444
    - REF-000445
    - REF-000625
reviewed_existing_package:
  NJT-0122:
    schema_version: 2.0.0
    type: technique
    id: NJT-0122
    name:
      zh: 本地分析环境条件化规避
      en: Local Analysis-Environment Conditioned Evasion
    summary:
      zh: 攻击者发现本地分析环境证据，并由判断控制退出、诱饵或核心功能释放，使分析获得条件化路径。
      en: Adversaries discover local analysis-environment evidence and use their judgment to control exit, decoy behavior,
        or core-function release, exposing a conditional path to analysis.
    aliases:
    - Virtualization/Sandbox Evasion
    - T1497
    classification:
      tactic_refs:
      - TA0005
      - TA0007
      origin:
        kind: attack-adapted
        source_attack_id: T1497
        source_attack_version: '19.1'
      decision_ref: DEC-TA0005-T1497
    definition_and_concept:
      paragraphs:
      - zh: 本地分析环境条件化规避是已经在主机或来宾执行的程序采集本地系统工件、人类活动或时间证据，判断当前环境是否为自动分析、沙箱或短生命周期测试，并让判断控制退出、诱饵、等待、解码或核心载荷释放。它通过发现当前执行环境来选择后继行为，使分析者获得的路径少于满足放行条件时的路径，因此同时具有发现与匿迹意义。
        en: Local Analysis-Environment Conditioned Evasion is behavior in which a program already executing on a host or guest
          collects local system artifacts, human-activity evidence, or timing evidence, judges whether it is in automated
          analysis, a sandbox, or a short-lived test, and uses that judgment to control exit, decoy behavior, waiting, decoding,
          or core-payload release. Discovery of the current execution environment selects successor behavior and exposes a
          narrower path to analysis than under release conditions, serving both Discovery and Stealth.
      - zh: 概念锚是证据读取、分析环境判断与后继行为之间可核验的因果链。系统属性、用户信息和时钟读取只是可能的输入，不能凭一次API、没有子进程或没有联网推断门控。相同检查可以由命令、脚本或程序内接口实现；这些承载方式、操作系统和沙箱品牌不构成另一项父技术。
        en: The conceptual anchor is a verifiable causal chain from an evidence read through analysis-environment judgment
          to successor behavior. System attributes, user information, and clock reads are possible inputs; one API call, absent
          children, or absent networking does not establish gating. Commands, scripts, and in-process interfaces can implement
          the same check. These carriers, operating systems, and sandbox brands do not define another parent technique.
    stealth_characteristics:
      paragraphs:
      - zh: 本地分析环境条件化规避把完整执行改造成条件化可见路径：相同样本可能在疑似分析条件下早退、等待或保留下一阶段，而在放行条件下继续。系统工件组合、活动是否充分，以及运行时间或时间关系分别改变分类依据；企业VM、离席用户和刚重启终端也可满足相同条件，因此差分不自动证明恶意或物理主机身份。
        en: 'Local Analysis-Environment Conditioned Evasion converts complete execution into a conditionally visible path:
          the same sample may exit, wait, or withhold a next stage under suspected analysis conditions and continue under
          release conditions. System-artifact combinations, activity sufficiency, and uptime or timing relationships provide
          distinct classification evidence. Enterprise VMs, absent users, and recently restarted endpoints can satisfy the
          same conditions, so a differential does not automatically establish malice or physical-host identity.'
      - zh: 环境读取、返回值、比较位置、替代分支和后继工件仍可能留下痕迹。任意API返回、执行块、解码缓冲区及所有时钟需要专门部署并验证的采集器。受控重跑能加强因果判断，但插桩、外部响应、随机性及同时变化的环境条件会混淆结果，不能保证恢复全部能力。
        en: Environment reads, returned values, comparison locations, alternate paths, and successor artifacts can leave traces.
          Arbitrary API returns, executed blocks, decoded buffers, and all clock sources require specifically deployed and
          validated collectors. Controlled reruns can strengthen causal attribution, but instrumentation, external responses,
          randomness, and co-varying conditions can confound results and prevent recovery of hidden capability.
    scope_boundary_definition:
      paragraphs:
      - zh: 纳入有意用本地证据识别分析环境，并由判断实际改变核心后继行为的情形。来源直接记录的检查—比较—退出或释放链可以成立；实验判断需同样本和启动条件的受控对照、采集完整性与可重复差分。请求、成功返回、空结果、失败和未采集分开；只看到查询仍按直接信息对象记录发现或尝试。
        en: Include deliberate use of local evidence to identify an analysis environment where judgment changes core successor
          behavior. A directly documented check, comparison, and exit-or-release chain can establish the behavior; experimental
          attribution needs controlled same-sample and launch conditions, capture completeness, and reproducible differentials.
          Requests, successful returns, empty results, failures, and uncaptured data remain separate. Queries alone retain
          their direct discovery object or attempt status.
      - zh: 受管VM清单和虚拟化基础设施事实属于T1673，不能替代程序对自身执行环境的沙箱判断；云资源图归NJT-0139，系统属性、进程、软件、注册表、当前用户及时间事实各有相邻发现范围。读取与门控均有独立证据时可分别记录，不能因返回含虚拟化字符串就重复建立父项。
        en: Managed-VM inventories and virtualization-infrastructure facts belong to T1673 and do not establish self-sandbox
          judgment. Cloud-resource graphs belong to NJT-0139, while system attributes, processes, software, Registry, current-user,
          and time facts retain neighboring discovery scopes. Record acquisition and gating separately only when each is evidenced;
          a virtualization string does not justify another parent.
      - zh: 调试器专用状态与观察通道归NJT-0106；仅消耗时间而未判断环境归NJT-0107，包括单纯timer/message或RDTSC等待循环；匹配预期目标或派生目标密钥归NJT-0109。合法许可、兼容性、性能校准、辅助功能及无人值守业务会产生相似行为。点击或文档关闭若只是普通执行触发，不证明分析环境判断。
        en: Debugger-specific state and observation channels belong to NJT-0106. Time consumption without environment judgment
          belongs to NJT-0107, including timer/message or RDTSC waits. Intended-target matching or key derivation belongs
          to NJT-0109. Licensing, compatibility, performance calibration, accessibility, and unattended workloads produce
          similarities. A click or document close that merely triggers execution does not establish analysis-environment judgment.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: 样本取得本地执行后，可在下一阶段投递前检查系统工件，在文档事件后判断活动是否充分，或用运行时间判断短生命周期环境。IRONGATE的dropper检查后不部署.NET文件，放行路径的部署也不等于载荷已运行；Upatre的uptime比较和早退由原始分析直接记录。活动门控有运营观察，不据此虚构每种交互的归因活动。
          en: After obtaining local execution, samples can inspect system artifacts before next-stage delivery, assess activity
            after document events, or use uptime to judge short-lived environments. IRONGATE droppers withheld a .NET file;
            delivery on the release path did not establish execution. Original analysis records Upatre uptime comparison and
            exit. Operational observations support activity gating without establishing an attributed operation for every
            interaction pattern.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者已能执行本地程序或文档代码，读取权限内环境事实并选择后继路径，无需拥有虚拟化管理权。它需了解欲识别的工件或活动分布并容忍企业VM、无人值守服务和真实重启；组合条件可能降低某些误判，也增加维护、兼容性及可检测查询成本。
            en: The adversary can execute local program or document code, read permitted environmental facts, and choose successors
              without virtualization-management authority. It needs knowledge of the artifacts or activity distributions being
              assessed and must tolerate enterprise VMs, unattended services, and real reboots. Combined conditions may reduce
              some false assessments while adding maintenance, compatibility, and detectable-query costs.
        defender_model:
          paragraphs:
          - zh: 常规端点记录只提供明确配置的进程、文件或网络结果；实验平台另需运行清单、参数/返回采集、进程生命周期映射、环境变更及健康状态。执行块、内存、输入回放和时间加速均是单独启用能力，缺少时保留未知。
            en: Ordinary endpoint records provide only configured process, file, or network outcomes. Experiments additionally
              need run manifests, parameter-and-return capture, process-lifetime maps, environment changes, and health state.
              Executed blocks, memory, input replay, and acceleration are separately enabled capabilities and remain unknown
              when absent.
          - zh: 同样本实验保留镜像、参数、实际输入、外部重放、主机独立时间和预算，逐项改变条件并重复对照。外部依赖不能重放、样本非确定、插桩被识别或多变量共变时，结果只能保留候选关联或不完整实验。
            en: Same-sample experiments retain images, arguments, actual inputs, external replay, independent host time, and
              budgets, varying conditions and repeating controls. Unreplayable dependencies, nondeterminism, detected instrumentation,
              or co-varying features limit results to candidate associations or incomplete experiments.
    stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 用分析环境判断限制当前条件下的核心路径暴露
        en: Use analysis-environment judgment to limit core-path exposure under current conditions
      analysis:
        paragraphs:
        - zh: 攻击者把本地返回证据送入环境判断，再让结果选择早退、诱饵或保留。与放行路径相比，检查路径仍有查询与判断，却减少后继能力的可见执行，动态报告可能低估能力；IRONGATE条件化不部署和Upatre条件化早退支持行为透明因果链。
          en: The adversary feeds returned evidence into environment judgment and selects exit, decoy, or withholding. Compared
            with release, the checking path retains queries and assessment while reducing visible successor capability, so
            dynamic reports may underestimate the sample. IRONGATE conditional non-deployment and Upatre conditional exit
            support this Behavioral Transparency chain.
        - zh: 效果依赖样本能区分分析与放行条件，并不抹除代码、读取或替代分支。受控差分、静态路径和工件能补证；只有查询、纯等待或执行错误尚未证明该机理。
          en: The effect depends on distinguishing analysis and release conditions and does not erase code, reads, or alternate
            paths. Controlled differentials, static paths, and artifacts can add evidence; queries, pure waits, or execution
            errors alone do not establish the mechanism.
      evidence_refs:
      - REF-000443
      - REF-000444
      - REF-000445
      confidence: high
    subtechnique_taxonomy:
      narrative:
        paragraphs:
        - zh: 三项按攻击者门控所用的真实性变量与可证伪对照划分：系统工件组合需要特征变体，活动充分性需要有效会话动作，时间真实性需要uptime或时间关系的环境判别。变量能组合，但受控面、正常反例、痕迹和防御合同不同；数量和主题与ATT相似不是保留它们的理由。
          en: 'The three children partition attacker-controlled realism variables and falsifiable controls: system-artifact
            combinations need feature variants, activity sufficiency needs valid session actions, and temporal realism needs
            environment judgment from uptime or timing relationships. Variables can combine but differ in control surfaces,
            benign counterexamples, traces, and defense contracts; numerical or thematic similarity to ATT is not the reason
            for retaining them.'
        - zh: 最近输入时间用于活动充分性时归NJS-0122-002人类活动充分性门控；uptime用于环境寿命判断时归NJS-0122-003时间真实性校验，不因原报告称pocket litter而重复归类。浏览历史等作为使用活动证据归活动项；已知分析产品目录匹配归NJS-0122-001系统指纹分析环境判别。纯等待和正常用户执行触发均不自动纳入。
          en: Last-input timing used for activity sufficiency belongs to NJS-0122-002 Human-Activity Sufficiency Gating. Uptime
            used for environment-age judgment belongs to NJS-0122-003 Temporal Realism Verification regardless of a source
            calling it pocket litter. Browser history used as activity evidence belongs to the activity child, while known
            analysis-product directory matches belong to NJS-0122-001 System-Fingerprint Analysis Classification. Pure waiting
            and ordinary user-execution triggers do not automatically qualify.
      coverage: established
      subtechnique_refs:
      - NJS-0122-001
      - NJS-0122-002
      - NJS-0122-003
    defense:
      detections:
        coverage: available
        strategy_refs:
        - DET-000119
      mitigations:
        coverage: available
        mitigation_refs:
        - MIT-000120
    evidence:
      claim_refs:
      - CLM-000619
      - CLM-000620
      - CLM-000655
      - CLM-000656
      - CLM-000657
      case_refs:
      - CASE-000164
      - CASE-000165
      reference_refs:
      - REF-000410
      - REF-000443
      - REF-000444
      - REF-000445
      - REF-000625
      - REF-000907
      - B012-T1497-REF-TICKCOUNT
      - B012-T1497-REF-HRTIME
    research:
      limitations:
        paragraphs:
        - zh: 原始样本支持父行为；三分Niji分类是基于不同变量与验证方法的高置信推断，并非来源直接发布的分类。IRONGATE可能为测试、PoC或研究，感染途径、触发和行动归属未知；Upatre阈值和结果限于报告样本。活动项没有每种模式的归因案例或通用自然度要求。
          en: Original samples support the parent behavior. The three-way Niji taxonomy is a high-confidence inference from
            distinct variables and validation methods, not a taxonomy directly published by sources. IRONGATE may be testing,
            a PoC, or research, with unknown infection route, trigger, and attribution. Upatre thresholds and outcomes concern
            the reported sample. Activity gating lacks attributed cases for every pattern or a universal naturalness requirement.
        - zh: 固定19.1由REF-000625及本批提取锚定，REF-000410网页此次标示v19.2，只作行为辅助。查询、时间消耗和结果缺失不能独立证明规避。防御是待部署验证的实验合同，非默认EDR能力或实测检测率；Linux/macOS适配仍待验证。本研究未执行恶意样本实验。
          en: REF-000625 and this batch extraction anchor fixed 19.1; REF-000410 currently labels its page v19.2 and only
            corroborates behavior. Queries, time consumption, and missing outcomes do not independently establish evasion.
            Defenses are experiment contracts requiring deployment validation, not default EDR capability or measured detection
            rates. Linux/macOS adapters require validation. No malware experiment was performed.
    lifecycle:
      status: review
      version: 0.2.0
      created: '2026-09-20'
      modified: '2026-09-21'
      contributors:
      - Niji Matrix Research
      reviewers: []
  NJS-0122-001:
    schema_version: 2.0.0
    type: evasion-subtechnique
    id: NJS-0122-001
    name:
      zh: 系统指纹分析环境判别
      en: System-Fingerprint Analysis Classification
    summary:
      zh: 攻击者把本地系统工件组合用于分析环境判断，并让匹配结果控制核心后继。
      en: Adversaries use local system-artifact combinations to judge an analysis environment and let matches control core
        successors.
    aliases: []
    parent_ref: NJT-0122
    lineage:
      attck_subtechnique_inherited: false
    definition_and_concept:
      paragraphs:
      - zh: 系统指纹分析环境判别是攻击者采集硬件、固件、虚拟设备、驱动、进程、服务、文件、Registry或分析产品工件，形成对本地执行环境的分类，再控制退出、诱饵或部署。直接目的是让可识别的分析环境看不到核心路径，稳定变量是系统特征组合而非某个产品或API。
        en: System-Fingerprint Analysis Classification collects hardware, firmware, virtual-device, driver, process, service,
          file, Registry, or analysis-product artifacts, classifies the local execution environment, and controls exit, decoy
          behavior, or deployment. Its purpose is to withhold the core path from recognizable analysis environments; the stable
          variable is a system-feature combination rather than a product or API.
    stealth_characteristics:
      paragraphs:
      - zh: 系统指纹分析环境判别使具有命中特征的运行早退或不部署，而在放行条件下继续。查询、比较和部署工件仍可观察；企业VM与合法兼容性检查具有相似痕迹，多模板或裸机实验也可能同时改变多个变量，不能自动恢复单项因果。
        en: System-Fingerprint Analysis Classification makes matching runs exit or withhold deployment and allows continuation
          under release conditions. Queries, comparisons, and deployment artifacts remain observable. Enterprise VMs and compatibility
          checks have similar traces, while multi-template or bare-metal experiments can co-vary features and do not automatically
          establish individual-feature causality.
    scope_boundary_definition:
      paragraphs:
      - zh: 只纳入系统工件进入分析判断并控制后继的情形，普通VM型号、进程或驱动读取仍是发现；T1673受管VM清单不证明自身沙箱判断。许可、兼容性、性能及虚拟化管理是反例。活动归NJS-0122-002人类活动充分性门控，uptime或时间关系的环境判断归NJS-0122-003时间真实性校验，调试器专用检查归NJT-0106。
        en: Include only system artifacts entering analysis judgment and successor control; ordinary VM-model, process, or
          driver reads remain discovery. T1673 managed-VM inventories do not establish self-sandbox judgment. Licensing, compatibility,
          performance, and virtualization management are counterexamples. Activity belongs to NJS-0122-002 Human-Activity
          Sufficiency Gating, environment judgment from uptime or timing relationships to NJS-0122-003 Temporal Realism Verification,
          and debugger-specific checks to NJT-0106.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: IRONGATE部分dropper在匹配Cuckoo目录组合或VMware Registry/驱动工件后不部署scada.exe；放行后仍需特定网络资源路径，且不自动执行搬移文件。案例证明指纹控制部署，不证明每个变体使用全部工件或在野ICS影响。
          en: Some IRONGATE droppers withheld scada.exe after matching Cuckoo directory combinations or VMware Registry/driver
            artifacts. Release still required a particular network-resource path and did not automatically execute the relocated
            file. This establishes fingerprint-conditioned deployment, not every artifact in every variant or operational
            ICS impact.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者已能本地执行、读取权限内工件并控制后继，不需hypervisor管理权。它需了解模板，承担列表漂移、企业VM误判及组合检查维护成本；多项查询和硬编码特征仍可能被识别。
            en: The adversary can execute locally, read permitted artifacts, and control successors without hypervisor administration.
              It needs template knowledge and bears artifact drift, enterprise-VM false assessments, and combined-check maintenance.
              Query sequences and hard-coded features remain detectable.
        defender_model:
          paragraphs:
          - zh: 防守方需部署返回采集、环境清单与工件归因。执行块是单独启用能力；缺少时保留未知，可用静态检查链及独立结果补证。裸机/VM整体差异仅作探索，受控变体和重复对照才能加强特征归因。
            en: Defenders need deployed return capture, environment manifests, and artifact attribution. Executed blocks are
              separately enabled; missing coverage remains unknown, with static check chains and independent outcomes supplying
              additional evidence. Whole bare-metal/VM differences are exploratory; controlled variants and repeated controls
              strengthen feature attribution.
    stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 系统工件判断把部署隔离在命中特征的分析运行之外
        en: System-artifact judgment withholds deployment from matching analysis runs
      analysis:
        paragraphs:
        - zh: 攻击者用返回工件选择不部署或退出分支，分析环境留下查询和比较而缺少放行工件，使单次报告不完整。IRONGATE直接支持这一链。变体实验只能在其他条件受控、后继可归因及结果可重复时加强因果，查询本身仍不足。
          en: Returned artifacts select non-deployment or exit, leaving queries and comparisons without release artifacts
            and producing an incomplete report. IRONGATE directly supports this chain. Variant experiments strengthen attribution
            only with controlled conditions, attributable successors, and reproducible outcomes; queries alone remain insufficient.
      evidence_refs:
      - REF-000443
      - REF-000444
      confidence: high
    defense:
      detections:
        coverage: available
        strategy_refs:
        - DET-000119
      mitigations:
        coverage: available
        mitigation_refs:
        - MIT-000120
    evidence:
      claim_refs:
      - CLM-000655
      case_refs:
      - CASE-000164
      reference_refs:
      - REF-000410
      - REF-000443
      - REF-000444
      - REF-000625
    research:
      limitations:
        paragraphs:
        - zh: IRONGATE可能是PoC或研究，不能支持在野归因。工件匹配不证明物理主机身份，企业VM和合法软件会重叠；部署与执行必须分开。采集未覆盖、环境多变量共变及外部条件未重放时，只能保留未知或候选关联。
          en: IRONGATE may be a PoC or research and cannot establish field attribution. Artifact matches do not establish
            physical-host identity and overlap with enterprise VMs and legitimate software. Deployment and execution remain
            separate. Missing capture, co-varying features, and unreplayed external conditions limit results to unknown state
            or candidate association.
    lifecycle:
      status: review
      version: 0.1.0
      created: '2026-09-21'
      modified: '2026-09-21'
      contributors:
      - Niji Matrix Research
      reviewers: []
  NJS-0122-002:
    schema_version: 2.0.0
    type: evasion-subtechnique
    id: NJS-0122-002
    name:
      zh: 人类活动充分性门控
      en: Human-Activity Sufficiency Gating
    summary:
      zh: 攻击者把本地活动存在、近期性或动作条件作为环境真实性证据，在条件满足后才释放核心功能。
      en: Adversaries treat local activity presence, recency, or action conditions as environment-realism evidence and release
        core functionality only when the condition is satisfied.
    aliases: []
    parent_ref: NJT-0122
    lineage:
      attck_subtechnique_inherited: false
    definition_and_concept:
      paragraphs:
      - zh: 人类活动充分性门控把近期输入、鼠标或按键序列、窗口和文档动作，或现存使用痕迹当作有人操作的证据，并要求活动条件满足后才继续核心功能。条件可以只检查存在，也可以检查节奏、位置或多步骤动作；自然度不是所有实现的必要条件。稳定变量是供分析环境判断使用的活动充分性，而非具体控件或API。
        en: Human-Activity Sufficiency Gating treats recent input, mouse or keystroke sequences, window and document actions,
          or existing usage traces as evidence of human operation and requires an activity condition before core functionality
          continues. Conditions may test presence alone or assess cadence, position, or multistep actions; naturalness is
          not required in every implementation. The stable variable is activity sufficiency used for analysis-environment
          judgment rather than a control or API.
    stealth_characteristics:
      paragraphs:
      - zh: 人类活动充分性门控使没有满足所测条件的自动分析停留在等待、退出或保留分支。某些样本只需要一次动作，另一些会分析机械输入分布；随机点击未触发并不单独证明自然度检测。读取、实际输入、作用会话、比较位置和后继工件仍可观察，无人值守业务、离席用户和辅助输入也会产生正常相似结果。
        en: Human-Activity Sufficiency Gating leaves automated analysis that fails the tested condition waiting, exiting,
          or withholding release. Some samples need one action while others assess mechanical input distributions; failed
          random clicking alone does not establish naturalness detection. Reads, actual inputs, affected sessions, comparison
          locations, and successor artifacts remain observable. Unattended workloads, absent users, and assisted input produce
          benign similarities.
    scope_boundary_definition:
      paragraphs:
      - zh: 只有活动存在性、近期性或动作条件被当作分析环境真实性证据并控制核心路径时纳入。点击、文档关闭或宏事件若只是普通用户执行触发，不足以成立；合法确认、空闲策略、屏幕锁定和可用性检查是反例。最近输入时间仍属活动证据，不因读时钟转归NJS-0122-003时间真实性校验；uptime自身用于环境寿命判断才归该时间项，系统产品工件匹配归NJS-0122-001系统指纹分析环境判别。
        en: Include activity presence, recency, or action conditions only when treated as analysis-environment realism evidence
          controlling the core path. A click, document close, or macro event that merely triggers ordinary user execution
          is insufficient; legitimate confirmation, idle policy, screen locking, and usability checks are counterexamples.
          Last-input time remains activity evidence despite reading a clock. Uptime used for environment-age judgment belongs
          to NJS-0122-003 Temporal Realism Verification, while system-product artifact matches belong to NJS-0122-001 System-Fingerprint
          Analysis Classification.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: 文档或dropper可能检查最近输入，要求已识别的滚动、单元格导航或点击条件后才继续，以排除无人分析。Unit 42运营研究描述此类条件及部分位置/节奏检查；这支持类别存在，不支持把所有互动文档视为规避或为每种动作建立归因案例。
          en: Documents or droppers may inspect recent input or require an identified scrolling, cell-navigation, or click
            condition before continuing, to exclude unattended analysis. Unit 42 operational research describes such conditions
            and some position/cadence checks. This supports the behavior class without classifying every interactive document
            as evasion or establishing an attributed case for every action.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者能在程序或文档上下文读取活动状态或处理事件，并控制核心功能放行。最近输入时间不提供按键内容或操作者身份。它需容忍远程桌面、辅助功能、触屏和无人值守差异；提高门槛会损失真实目标，规则也可能被分析平台重放。
            en: The adversary can read activity state or handle events in a program or document context and control core-function
              release. Last-input timing provides neither keystroke content nor operator identity. Remote desktop, accessibility,
              touch, and unattended differences require tolerance. Higher thresholds lose real targets, and analysis platforms
              can replay known rules.
        defender_model:
          paragraphs:
          - zh: 防守方需有会话/桌面映射、实际回放日志、样本参数/返回和后继记录。SendInput插入数量不等于目标动作完成，GetLastInputInfo只覆盖调用会话；焦点、完整性和桌面状态可使回放无效。脚本版本、健康状态和可核验动作回执用于区分未触发与输入未到达。
            en: Defenders need session/desktop maps, actual replay logs, sample parameters/returns, and successor records.
              SendInput insertion counts do not establish target-action completion, and GetLastInputInfo covers only the calling
              session. Focus, integrity, and desktop state can invalidate replay. Script versions, health, and verifiable
              action acknowledgments distinguish non-triggering from undelivered input.
    stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 活动条件把核心功能保留在未满足交互证据的分析运行之外
        en: Activity conditions withhold core functionality from analysis runs lacking required interaction evidence
      analysis:
        paragraphs:
        - zh: 攻击者把核心路径放在活动判断后，不满足条件的自动分析只记录检查与替代路径，无法据此报告放行能力。运营观察支持这一行为收缩，但普通用户执行也可同形；只有核验活动被当作真实性证据、输入实际生效及后继稳定变化，才能加强规避因果。
          en: The adversary places the core path after activity judgment, leaving unsatisfied automated analysis with checks
            and an alternate path that cannot expose release capability. Operational observations support this contraction,
            while ordinary user execution can look similar. Evasion attribution strengthens only after verifying that activity
            serves as realism evidence, input actually takes effect, and successors change reproducibly.
      evidence_refs:
      - REF-000443
      confidence: high
    defense:
      detections:
        coverage: available
        strategy_refs:
        - DET-000119
      mitigations:
        coverage: available
        mitigation_refs:
        - MIT-000120
    evidence:
      claim_refs:
      - CLM-000656
      case_refs: []
      reference_refs:
      - REF-000410
      - REF-000443
      - REF-000625
      - REF-000907
      - REF-000249
      - B012-T1497-REF-LASTINPUTINFO
      - B012-T1497-REF-CURSORPOS
      - B012-T1497-REF-TICKCOUNT
    research:
      limitations:
        paragraphs:
        - zh: 来源没有每种动作的归因案例或通用自然度阈值。GetLastInputInfo返回调用会话的最近输入时间，DWORD值不保证递增且可受软件注入影响。改变交互后触发也可能来自正常执行或焦点改变，必须核验读取条件、有效回放和后继目的，不能单凭差分认定分析意图。
          en: Sources provide neither an attributed case for every action nor a universal naturalness threshold. GetLastInputInfo
            returns calling-session last-input time; its DWORD value need not increase and can be affected by software injection.
            Triggering after changed interaction can reflect ordinary execution or focus changes. Reads, valid replay, and
            successor purpose require verification; a differential alone does not establish anti-analysis intent.
    lifecycle:
      status: review
      version: 0.1.0
      created: '2026-09-21'
      modified: '2026-09-21'
      contributors:
      - Niji Matrix Research
      reviewers: []
  NJS-0122-003:
    schema_version: 2.0.0
    type: evasion-subtechnique
    id: NJS-0122-003
    name:
      zh: 时间真实性校验
      en: Temporal Realism Verification
    summary:
      zh: 攻击者用uptime或时间关系判断分析环境，并由判断决定早退、保留或放行核心路径。
      en: Adversaries judge an analysis environment from uptime or timing relationships and use that judgment to exit, withhold,
        or release the core path.
    aliases: []
    parent_ref: NJT-0122
    lineage:
      attck_subtechnique_inherited: false
    definition_and_concept:
      paragraphs:
      - zh: 时间真实性校验把运行时间或测得时间关系用于判断当前环境是否像短生命周期或时间被操纵的分析环境，再控制退出或核心路径。最小实例可以只比较一次uptime；多时钟一致性或指令耗时是其他可能实现，需另证比较及后继链。稳定变量是时间证据参与环境判断，不是延迟API、时钟数量或固定秒数。
        en: Temporal Realism Verification uses uptime or a measured timing relationship to judge whether an environment resembles
          short-lived or time-manipulated analysis and controls exit or the core path. A minimal instance can compare uptime
          once. Multiclock consistency or instruction timing are other possible implementations requiring their own comparison
          and successor evidence. The stable variable is timing evidence used for environment judgment rather than a delay
          API, clock count, or fixed duration.
    stealth_characteristics:
      paragraphs:
      - zh: 时间真实性校验可让短uptime运行提前结束，或在已证明的时间关系异常后保留核心路径，使分析只见检查与早退。时钟读取、位宽单位、比较、退出和放行工件仍可观察。长uptime不保证全部路径出现；真实启动、计数回绕、休眠和测量扰动也可能产生相同值或差异。
        en: Temporal Realism Verification can end short-uptime runs or withhold the core path after an established timing
          anomaly, leaving analysis with checks and exit. Reads, widths and units, comparisons, exits, and release artifacts
          remain observable. Longer uptime does not guarantee every path; real boot, counter wrap, suspend behavior, and measurement
          disturbance can produce the same values or differences.
    scope_boundary_definition:
      paragraphs:
      - zh: 只纳入时间证据进入分析环境判断并改变后继的情形。sleep、timer/message计数或RDTSC循环若只等待固定条件完成，即使为越过沙箱窗口，也归NJT-0107；必须另有uptime或时间关系的环境判断才入本项。最近输入充分性归NJS-0122-002人类活动充分性门控；正常调度、许可、基准测试和同步故障是反例。uptime不因被称pocket
          litter重复归NJS-0122-001系统指纹分析环境判别。
        en: Include timing evidence only when it enters analysis-environment judgment and changes successors. Sleep, timer/message
          counting, or RDTSC loops that merely complete a fixed wait belong to NJT-0107 even if intended to outlast sandbox
          observation. This child additionally requires environment judgment from uptime or timing relationships. Last-input
          sufficiency belongs to NJS-0122-002 Human-Activity Sufficiency Gating; scheduling, licensing, benchmarks, and synchronization
          faults are counterexamples. Calling uptime pocket litter does not duplicate it under NJS-0122-001 System-Fingerprint
          Analysis Classification.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
        - zh: Upatre报告样本把GetTickCount与0xAFE74，即720500毫秒比较，低于阈值时退出；改变返回uptime后继续恶意例程。这不是通用十二分钟规则，也不证明该样本使用多时钟或sleep加速检测。其他实现须有自己的时间类型、比较和后继证据。
          en: The reported Upatre sample compared GetTickCount with 0xAFE74, or 720500 milliseconds, and exited below it.
            Changed returned uptime permitted its malicious routine. This is not a universal twelve-minute rule and does not
            establish multiclock or sleep-acceleration detection in that sample. Other implementations need their own time-type,
            comparison, and successor evidence.
      threat_model:
        attacker_model:
          paragraphs:
          - zh: 攻击者可本地执行、读取可用时间源、比较阈值和选择后继，无需修改系统时钟权限。它需容忍真实重启、回绕、休眠和硬件差异；多时钟或指令计时增加兼容成本，插桩开销也会扰动测量。
            en: The adversary can execute locally, read available clocks, compare thresholds, and choose successors without
              permission to change the system clock. It must tolerate real reboots, wrap, suspend behavior, and hardware differences.
              Multiclock or instruction timing adds compatibility costs, and instrumentation overhead can disturb measurements.
        defender_model:
          paragraphs:
          - zh: 防守方需专门采集样本实际读取的时间源、原始返回、单位和比较位置，另用不随来宾加速的主机单调时钟测量。GetTickCount是32位毫秒且约49.7天回绕；QPC需本机频率转换，TSC不是毫秒。未采集硬件或外部源保留未知，hook
              Sleep不证明全部时间源一致。
            en: Defenders need specialized capture of clocks actually read, raw values, units, and comparison locations, with
              independent host-monotonic measurement unaffected by guest acceleration. GetTickCount is 32-bit milliseconds
              wrapping after about 49.7 days. QPC needs local frequency conversion, and TSC is not milliseconds. Uncaptured
              hardware or external sources remain unknown; hooking Sleep does not establish coherence of every source.
    stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary:
        zh: 时间环境判断在特定运行条件下抑制核心路径
        en: Temporal environment judgment suppresses the core path under selected run conditions
      analysis:
        paragraphs:
        - zh: 攻击者让时间条件比较决定是否进入核心路径，短uptime分支只留下检查与早退，而改变条件后的放行出现恶意例程。Upatre支持这种行为透明链，纯等待不支持。时钟返回与比较仍可检查，干预实验只有在时间解码有效、其他条件受控及结果可复现时才加强因果，不能保证恢复全部隐藏功能。
          en: The adversary lets a timing comparison decide entry to the core path. A short-uptime branch leaves checks and
            exit, while changed conditions permit a malicious routine. Upatre supports this Behavioral Transparency chain;
            pure waiting does not. Returns and comparisons remain inspectable. Interventions strengthen attribution only with
            valid time decoding, controlled conditions, and reproducible outcomes, without guaranteeing recovery of every
            hidden function.
      evidence_refs:
      - REF-000445
      confidence: high
    defense:
      detections:
        coverage: available
        strategy_refs:
        - DET-000119
      mitigations:
        coverage: available
        mitigation_refs:
        - MIT-000120
    evidence:
      claim_refs:
      - CLM-000657
      case_refs:
      - CASE-000165
      reference_refs:
      - REF-000410
      - REF-000443
      - REF-000445
      - REF-000625
      - B012-T1497-REF-TICKCOUNT
      - B012-T1497-REF-HRTIME
    research:
      limitations:
        paragraphs:
        - zh: Upatre支持报告样本的比较、早退与修改后继续，不证明所有版本、准确率或通用阈值。DWORD回绕可使长寿命系统出现小值，真实启动也会如此。REF-000443的timer/RDTSC等待例子只证明延迟，不证明多时钟比较后判定时间造假。实验还需排除插桩、外部响应和预算差异，本研究未运行恶意样本。
          en: Upatre establishes comparison, exit, and changed-return continuation for the reported sample, not every version,
            accuracy, or universal threshold. DWORD wrap can produce small values on long-running systems, as can real boot.
            REF-000443 timer/RDTSC waits establish delay, not a multiclock comparison judging fabricated time. Experiments
            must exclude instrumentation, external-response, and budget differences. No malware was executed in this research.
    lifecycle:
      status: review
      version: 0.1.0
      created: '2026-09-21'
      modified: '2026-09-21'
      contributors:
      - Niji Matrix Research
      reviewers: []
  DEC-TA0005-T1497:
    schema_version: 1.0.0
    type: technique-decision
    id: DEC-TA0005-T1497
    tactic_ref: TA0005
    candidate:
      source_type: attack
      source_attack_id: T1497
      source_attack_version: '19.1'
      name_en: Virtualization or Sandbox Evasion
      name_zh: 虚拟化或沙箱规避
    decision: adapt
    rationale_zh: T1497 在本地执行环境内检查虚拟化、用户活动或时间证据，并据此隐藏或终止核心功能，直接改变动态分析可见路径。Niji 适配为“本地分析环境条件化规避”。
    rationale_en: T1497 checks virtualization, user-activity, or timing evidence inside the local execution environment and
      consequently hides or terminates core functionality, directly changing the path visible to dynamic analysis. Niji adapts
      it as Local Analysis-Environment Conditioned Evasion.
    scope_notes_zh: 要求本地环境检查与后继行为差异相连；远程诱捕识别、调试器专用检查和普通环境发现归相邻对象。
    scope_notes_en: Requires local-environment checks to connect to a successor behavior difference. Remote deception identification,
      debugger-specific checks, and ordinary environment discovery belong to adjacent objects.
    gap_statement_zh: 既有NJT-0122及三个原生子项继续复用；本批独立复核准入、分类和防御后扩展TA0007归属，不复制父子。系统工件、活动充分性和时间判别边界保留，普通发现与纯延迟仍属相邻范围。
    gap_statement_en: Reuse existing NJT-0122 and its three native children. This batch independently reviews admission, taxonomy,
      and defenses before extending TA0007 without duplicate objects. Preserve system-artifact, activity-sufficiency, and
      temporal-judgment boundaries while retaining ordinary discovery and pure delay in neighboring scopes.
    original_attack_subtechniques_imported: false
    resulting_technique_ref: NJT-0122
    evidence_refs:
    - REF-000410
    - REF-000443
    - REF-000444
    - REF-000445
    - REF-000625
    confidence: high
    review:
      status: review
      authors:
      - Niji Matrix Research
      reviewers: []
      review_notes_zh: 三项固定基线覆盖、三个子技术、证据、实验型防御、质量、Bundle 与 Web 门禁均通过，等待人工领域审查。
      review_notes_en: Coverage of all three fixed-baseline items, three children, evidence, experiment-oriented defense,
        quality, bundle, and Web gates passed; awaiting human domain review.
  DET-000119:
    schema_version: 2.0.0
    type: detection-strategy
    id: DET-000119
    name:
      zh: 分析环境—行为差分
      en: Analysis-Environment–Behavior Differential
    summary:
      zh: 比较同一样本在不同虚拟化、用户活动与时间条件下的查询和后继行为。
      en: Compare queries and successor behavior of one sample under different virtualization, user-activity, and timing conditions.
    description:
      paragraphs:
      - zh: 本策略寻找本地环境证据、分析判断与核心后继差分的联系。NJA-000107负责系统工件变体，NJA-000128负责有效会话活动，NJA-000129负责时间输入与比较；纯查询、纯延迟及未采集结果不足以定性。三项均需明确条件审阅证据及部署验证，现原生合同限定Windows，不代表普通EDR具有API返回、比较语义、控制流或内存能力。
        en: This strategy seeks relationships among local evidence, analysis judgment, and core-successor differentials. NJA-000107
          handles system-artifact variants, NJA-000128 valid session activity, and NJA-000129 timing inputs and comparisons.
          Queries, pure delay, and uncaptured outcomes are insufficient. All three need explicit condition-review evidence
          and deployment validation. Current native contracts cover Windows rather than ordinary EDR API-return, comparison-semantics,
          control-flow, or memory capability.
    detects_refs:
    - NJT-0122
    - NJS-0122-001
    - NJS-0122-002
    - NJS-0122-003
    domains:
    - enterprise
    analytic_refs:
    - NJA-000107
    - NJA-000128
    - NJA-000129
    evidence_refs:
    - REF-000410
    - REF-000625
    - REF-000443
