      reviewers: []
  NJA-000129:
    schema_version: 2.0.0
    type: detection-analytic
    id: NJA-000129
    strategy_ref: DET-000119
    name:
      zh: 时间真实性—载荷结果差分
      en: Temporal-Realism–Payload Outcome Differential
    summary:
      zh: 将原生时间返回和经审阅的环境比较与受控干预后的早退、保留或放行差分关联。
      en: Relate native timing returns and reviewed environment comparisons to exit, withholding, or release differentials
        after controlled interventions.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 这是需显式部署验证的受控样本实验，字段均为研究数据合同。编排器分配run.id与同样本run.pair_id，保存样本/入口哈希、镜像、参数、工作目录、文档、输入/网络重放、插桩配置和独立主机单调纳秒预算；PID、启动时间、父键及会话组成run内生命周期映射。Frida
          Interceptor只提供已配置函数的参数/原始返回，Stalker只在启用后提供执行块，两者不天然提供比较语义。分析员条件审阅登记另按样本、模块哈希和RVA保存比较指令、数据流证据、操作数来源、选中边的证据定位、作者、版本与校验状态；静态常量、调用输出和动态操作数明确分开。动态操作数只有比较点callout适配器已验证且采集成功时使用，保存配置与证据；无法解释的条件保持unknown并仅输出候选。
        en: This controlled sample experiment requires explicit deployment validation; all fields are research data contracts.
          The orchestrator assigns run.id and same-sample run.pair_id and retains sample/entry hashes, image, arguments, working
          directory, document, input/network replay, instrumentation configuration, and an independent host-monotonic nanosecond
          budget. PID, start time, parent key, and session define per-run process-lifetime maps. Frida Interceptor supplies
          configured arguments/raw returns and enabled Stalker supplies executed blocks; neither inherently supplies comparison
          semantics. A separate analyst condition-review register retains sample and module hashes plus RVA, comparison instructions,
          dataflow evidence, operand origins, selected-edge evidence, author, revision, and validation state. Static constants,
          call outputs, and dynamic operands remain distinct. Use dynamic operands only after validating a comparison-point
          callout adapter and successful capture, retaining configuration and evidence. Unexplained conditions remain unknown
          and yield candidates only.
      - zh: 只采集已配置验证的源。GetTickCount返回32位毫秒，约49.7天回绕，零是有效原值；保留DWORD比较语义，不把低值等同刚启动。QPC与QueryPerformanceFrequency均区分BOOL状态和输出LARGE_INTEGER，成功后以本机counts-per-second频率转换差值；频率缺失不转换。TSC保留cycles或未知频率，不硬比毫秒。Sleep请求是毫秒且无返回值，以主机单调纳秒另测经过时间；调度和分辨率会改变实际等待。未部署墙钟、硬件或外部源明确unknown，不声称全源一致。
        en: Capture only configured, validated sources. GetTickCount returns 32-bit milliseconds, wraps after about 49.7 days,
          and can validly return zero. Preserve DWORD comparison semantics without equating low values with recent boot. QPC
          and QueryPerformanceFrequency distinguish BOOL status from output LARGE_INTEGER; convert successful count differences
          using the local counts-per-second frequency and never convert without frequency. TSC remains cycles or unknown frequency,
          not milliseconds. Sleep requests milliseconds and returns no value; independently measure elapsed host-monotonic
          nanoseconds, allowing scheduling and resolution effects. Undeployed wall, hardware, or external sources remain unknown
          without universal-coherence claims.
      - zh: 先保留原速无干预基线，再只改变样本消费的uptime或已界定时间关系，记录生效值、校准及未控源。条件审阅需定位时间输出、阈值或跨源比较的数据流、原整数操作和选中边；动态数值仅由已验证比较点适配器提供，不从时钟API或block推断。Upatre的720500毫秒仅为报告样本线索。只有已校验时间环境比较及可重复后继差分才输出temporal_realism_verification；纯sleep缩短、计数或循环完成输出延迟候选。插桩、调度、漂移、非确定、预算不等或校准失败时停止因果定性。
        en: Retain a real-time no-intervention baseline, then change only sample-consumed uptime or a defined timing relationship,
          recording effective values, calibration, and uncontrolled sources. Condition reviews locate time-output, threshold,
          or cross-source comparison dataflow, native integer operations, and selected edges. Dynamic values require a validated
          comparison-point adapter and are not inferred from clock APIs or blocks. Upatre’s 720500 milliseconds is a clue
          for the reported sample only. Emit temporal_realism_verification only for validated temporal environment comparisons
          and reproducible successors; pure shortened sleep or completed counting/loops yield delay candidates. Instrumentation,
          scheduling, drift, nondeterminism, unequal budgets, or failed calibration prevent causal classification.
      - zh: 仅比较采集健康、同样本且可复现的对照，一次改变一个可解释条件，保持其他条件和主机预算一致并重复基线/变体。后继标记预先登记工件或调用位置，状态区分observed、not-observed-with-complete-capture、error、timeout、uncaptured及nonreproducible。可选执行块、网络、内存、CPU和动态操作数均携带启用/采集状态，未启用值置空，不把缺失当未发生；内存另定义地址、长度和时点。来宾原始时间保留类型、单位和映射，主机时间不随来宾加速。缺少选中边或条件校验时最多输出候选，除非静态检查链和独立受控后继已足以证明；插桩扰动与重放失败均削弱因果。
        en: Compare only healthy, reproducible same-sample controls, changing one interpretable condition while holding other
          conditions and host budgets constant and repeating baseline and variant. Pre-register successor artifacts or call
          locations and distinguish observed, not-observed-with-complete-capture, error, timeout, uncaptured, and nonreproducible.
          Optional blocks, network, memory, CPU, and dynamic operands carry enablement/capture state; disabled values are
          null, never absence evidence. Memory separately defines addresses, lengths, and timing. Guest clocks retain raw
          type, unit, and mapping, while host time does not follow guest acceleration. Missing selected edges or unvalidated
          conditions yield candidates unless static check chains and independent controlled successors suffice. Instrumentation
          disturbance and replay failure weaken causality.
    data_requirements:
    - source_type: controlled-analysis-run-register
      name:
        zh: 分析平台运行身份与对照登记
        en: Analysis-platform run identity and control register
