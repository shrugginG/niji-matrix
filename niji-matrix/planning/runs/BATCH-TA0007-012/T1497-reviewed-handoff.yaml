      en: Interactive installation, macros, accessibility, and security confirmation can legitimately continue after input;
        activity correlation alone does not establish analysis-environment judgment.
    blind_spots:
    - zh: 插入失败、错误会话/桌面、焦点漂移、安全桌面、动作或条件未核验、物理输入及非确定UI使无结果失去判定力；API未采集不等于未读取。
      en: Failed insertion, wrong session/desktop, focus drift, secure desktops, unverified actions or conditions, physical
        input, and nondeterministic UI invalidate absent-outcome conclusions; uncaptured APIs do not establish absent reads.
    tuning_guidance:
      paragraphs:
      - zh: 围绕实际条件构造最小动作对照，仅在条件审阅证明样本比较节奏或位置时测试自然度。分别核验插入、目标动作和样本消费，保持文档、窗口、网络和时间一致，不把未采集键盘内容纳入评分。
        en: Build minimal action controls around actual conditions and test naturalness only when condition review establishes
          cadence/position comparisons. Separately verify insertion, target action, and sample consumption while holding document,
          window, network, and time constant; do not score uncaptured keystroke content.
    evidence_refs:
    - REF-000625
    - REF-000443
    - REF-001368
    - REF-000907
    - REF-000249
    - B012-T1497-REF-LASTINPUTINFO
    - B012-T1497-REF-CURSORPOS
    - B012-T1497-REF-TICKCOUNT
    lifecycle:
      status: review
      version: 0.1.0
