    paragraphs:
    - zh: 原始样本支持父行为；三分Niji分类是基于不同变量与验证方法的高置信推断，并非来源直接发布的分类。IRONGATE可能为测试、PoC或研究，感染途径、触发和行动归属未知；Upatre阈值和结果限于报告样本。活动项没有每种模式的归因案例或通用自然度要求。
      en: Original samples support the parent behavior. The three-way Niji taxonomy is a high-confidence inference from distinct
        variables and validation methods, not a taxonomy directly published by sources. IRONGATE may be testing, a PoC, or
        research, with unknown infection route, trigger, and attribution. Upatre thresholds and outcomes concern the reported
        sample. Activity gating lacks attributed cases for every pattern or a universal naturalness requirement.
    - zh: 固定19.1由REF-000625及本批提取锚定，REF-000410网页此次标示v19.2，只作行为辅助。查询、时间消耗和结果缺失不能独立证明规避。防御是待部署验证的实验合同，非默认EDR能力或实测检测率；Linux/macOS适配仍待验证。本研究未执行恶意样本实验。
