  rationale:
    paragraphs:
    - zh: 固定T1497通过发现自身当前执行环境并据此改变后继路径服务Discovery。IRONGATE和Upatre原始分析分别支持系统工件、运行时间的检查—判断—后继链，沙箱运营研究支持活动门控。既有NJT-0122可扩展TA0007归属，但身份存在不替代准入、分类和防御审查；证据与数据合同修订是复用前提。
      en: Fixed T1497 serves Discovery by learning its current execution environment and selecting successor behavior. Original
        IRONGATE and Upatre analyses support system-artifact and uptime check–judgment–successor chains, while sandbox operational
        research supports activity gating. Existing NJT-0122 can extend to TA0007, but existing identity does not replace
        admission, taxonomy, or defense review; evidence and data-contract repairs are prerequisites for reuse.
  scope_notes:
    paragraphs:
    - zh: 复用同一父项及三个既有原生子项，不复制对象。普通属性、当前用户、时间读取与受管VM枚举各保留直接对象；只有分析环境判断实际改变核心后继时才成立本项。专用调试器、纯延迟和正向目标护栏保留相邻边界。
      en: Reuse the same parent and three existing native children without duplicates. Ordinary attribute, current-user, and
        time reads and managed-VM enumeration retain their direct objects; this technique additionally requires analysis-environment
        judgment changing core successors. Dedicated debugger checks, pure delay, and positive target guardrails retain adjacent
        boundaries.
