  reference_key: REF-001223
  locator: Article 321910; auth.log examples; Session opened; shell[64386] join
  facts:
    zh: Accepted消息包含账号及客户端，Session opened消息给出shell World ID及终端，shell消息按对应World ID连接；不能将sshd监听父PID直接等于shell World
      ID。
    en: Accepted messages contain account and client, Session opened supplies shell World ID and terminal, and shell
      messages join on the corresponding World ID. The listening sshd parent PID is not directly the shell World
      ID.
