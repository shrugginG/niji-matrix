native_contract_review:
  shell_join:
    zh: 沿Accepted→Session opened→shell[world]明确链，独立保留host启动代际；sshd PID、shell World ID和VM World ID不可混同。
    en: Join the explicit Accepted-to-Session-opened-to-shell[world] chain with host boot generation; sshd PID,
      shell World ID, and VM World ID are distinct.
  views_and_paths:
    zh: 运行World ID与注册VMID分离；CSV用表头，名称含空格需版本解析，datastore方括号定位不是臆造绝对路径。可选stdout字段映射需实际部署样例验收。
    en: Separate running World IDs and registered VMIDs. Use CSV headers and version-aware spaced-name parsing;
      bracketed datastore locators are not invented absolute paths. Optional stdout mappings require actual deployment
      examples.
  api_mapping:
    zh: _this→collector_object_ref，specSet/type/pathSet→请求范围，ObjectContent.obj→类型与引用，propSet→名值，missingSet→属性fault，UserSession.key/userName/ipAddress→独立会话字段。PropertySpec.all和pathSet保留原生语义，按对象类型合并适用集合；只取引用时属性状态为not_requested。
    en: Map _this to collector_object_ref, specSet/type/pathSet to request scope, ObjectContent.obj to type/reference,
      propSet to pairs, missingSet to property faults, and UserSession.key/userName/ipAddress to distinct session
      fields. Preserve PropertySpec.all/pathSet semantics, union applicable sets by object type, and use not_requested
      for reference-only property state.
  completeness:
    zh: capture_state、page_state和property_state分别计算；token耗尽不清除missingSet。all=true属性集合无法展开时不宣称全部属性完成；空结果只说明当次权限可见过滤范围。
    en: Compute capture_state, page_state, and property_state separately. Token exhaustion does not remove missingSet.
      Do not declare all properties complete when an all=true scope cannot be expanded; empty results apply only
      to that permission-visible filtered request.
  input_contracts:
    zh: NJA声明了原始日志、会话映射、批准登记、可选返回、采集支持与健康。API事务为自定义已验收输入，不是默认EDR或hostd结果流；缺失或截断须降级。
    en: Analytics declare raw logs, session mappings, approval registers, optional results, capabilities, and health.
      API transactions are custom accepted inputs rather than a default EDR/hostd result stream; missing or truncated
      data reduces conclusions.
