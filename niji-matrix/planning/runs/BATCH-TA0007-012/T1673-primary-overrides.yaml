    {
      "pointer": "/proposed_content/summary",
      "value": {
        "zh": "通过已取得访问的宿主或管理面枚举受管虚拟机，并可借用正常盘点入口，使单次查询的攻击意图难以仅凭命令外观辨识。",
        "en": "Enumerate managed virtual machines through an accessed host or management plane, potentially borrowing ordinary inventory entry points so an isolated command poorly distinguishes adversarial intent."
      }
    },
    {
      "pointer": "/proposed_content/stealth_mechanisms/0/analysis/paragraphs/1",
      "value": {
        "zh": "来源直接证明正常用途与恶意采用的重合，尚未证明选择工具的主观伪装动机，也没有比较自定义枚举器和原生命令的检测率。机理因此保持中等置信的观察模型推断：工具来源与语法本身的判别力有限，而会话、批准作业与实际请求范围仍能揭示误用。这不表示所有虚拟机发现都隐蔽或无法检测。",
        "en": "The sources directly establish legitimate-use and malicious-use overlap without establishing a subjective camouflage motive or comparing detection rates for custom enumerators and native commands. The mapping therefore remains a medium-confidence inference about observation: tool provenance and syntax alone have limited discriminatory value, while sessions, approved work, and actual request scope can still expose misuse. It does not make every VM inquiry covert or undetectable."
      }
    },
    {
      "pointer": "/proposed_content/research/limitations/paragraphs/2",
      "value": {
        "zh": "完整API事务、输出、会话映射、批准登记与采集健康均需部署验收，本研究未执行hypervisor或恶意样本实验。管理隔离与最小可见权限能够减少暴露，但不能保证阻止持有批准会话或root权限的主体。分析时间窗是实施起点，仍需在实际ESXi版本、管理API和合法作业中验证字段覆盖、归属及误报。",
        "en": "Full API transactions, output, session mappings, approval registers, and collection health require deployment acceptance; no hypervisor or malware experiment was performed. Management isolation and least visibility can reduce exposure without guaranteeing prevention against approved sessions or root authority. Analytic windows are starting points requiring field-coverage, attribution, and false-positive validation against actual ESXi versions, management APIs, and legitimate work."
      }
    }
  ]
}
