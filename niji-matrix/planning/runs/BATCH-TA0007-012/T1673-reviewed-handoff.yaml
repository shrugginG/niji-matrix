research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - host-or-hypervisor-managed-vm-inventory
    breadth_trigger: ordinary
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    proposed_coverage: deferred
    breadth_gap_explained: true
    coverage_resolutions:
    - dimension: fixed-parent-inventory
      resolution: parent-core
      rationale:
        zh: 基线无子项；管理权域VM清单是父级核心。
        en: The baseline has no children; management-authority VM inventory is parent core.
    candidate_stealth_axes_examined:
    - axis: running-versus-registered-view
      resolution: not-stealth-distinct
      positive_contrast: Official KB separates VMID registration and World ID execution; malicious reports use each.
      failed_gate: Object-state and identity semantics do not independently establish stealth causality.
    - axis: shell-versus-api-or-gui
      resolution: parent-core
      positive_contrast: Official management paths exist; direct malicious evidence is strongest for shell.
      failed_gate: Entry-point partition and inherent parent observation position do not establish an independent variable.
    - axis: preexisting-inventory-substitution
      resolution: evidence-deferred
      positive_contrast: No examined incident shows cached inventory replacing a fresh query with a trace comparison.
      failed_gate: Missing malicious adoption and positive trace contrast.
    - axis: session-borrowing-or-proxy-attribution
      resolution: evidence-deferred
      positive_contrast: Session fields exist but no deliberate reuse or proxy trace comparison is established.
      failed_gate: Missing design and defender-effect evidence.
    - axis: filtering-and-minimal-properties
      resolution: not-stealth-distinct
      positive_contrast: REvix selects WorldID and DisplayName; official filters restrict data.
      failed_gate: Task parameter selection lacks demonstrated detection-reduction design.
    - axis: repeated-confirmation-versus-low-rate-enumeration
      resolution: parent-core
      positive_contrast: VIKING SPIDER repeats the list; no rate comparison is supplied.
      failed_gate: Ordinary recheck semantics and unsupported temporal evasion.
    - axis: event-driven-updates
      resolution: evidence-deferred
      positive_contrast: PropertyCollector supports updates without examined malicious stealth subscription.
      failed_gate: Capability does not establish malicious stealth adoption.
    reviewer_notes:
      zh: 零项源于多轴研究而非基线零项。第二次反证移除固有管理位置构成子项或NM-BT机理的推断。旧清单、会话借用和事件订阅仍存在待证候选变量，因此分类覆盖为deferred，不以零个已成立项推断none-justified；不按产品、API、平台或命令拆项。
      en: Zero follows multiaxis research rather than the baseline's zero. A second counterexample pass rejected children
        or NM-BT based on inherent management position. Existing inventories, session borrowing, and event subscriptions retain
        unresolved candidate variables, so taxonomy coverage is deferred rather than inferring none-justified from zero established
        children. Products, APIs, platforms, and commands are not partitions.
  evidence_coverage:
    parent_behavior_keys:
    - B012-T1673-CLM-PARENT
    boundary_keys:
    - B012-T1673-CLM-VIEWS
    - B012-T1673-CLM-BOUNDARY
    mechanism_support:
    - mechanism_ref: NM-FD
      claim_key: B012-T1673-CLM-MECHANISM
      evidence_keys:
      - B012-T1673-REF-KB-VIEWS
      - B012-T1673-REF-CROWDSTRIKE
      - B012-T1673-REF-TREND
      level: conditional-strong-inference
    child_existence_support: []
    unsupported_or_deferred:
    - measured-miss-rate
    - intentional-camouflage-motive
    - cached-inventory-substitution
    - low-rate-evasion
    - proxy-attribution-evasion
    - default-hostd-full-request-and-result
    - non-esxi-native-telemetry
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已读实际NJT-0001并按责任对照：对象与完成、正常用途重合与正面残迹、云图谱/属性/门控/后继结果边界、权限与观察前提、样本/事件/API/采集证据层级均独立展开；未照搬机理或子项数量。两项NJA分别交代会话连接、原生标识、请求与结果、采集健康，API进一步分离页链与属性状态。
      en: The actual NJT-0001 was compared by responsibility. Acquired object and completion, legitimate overlap and positive
        traces, cloud/attribute/gating/successor boundaries, access/observation prerequisites, and sample/incident/API/capture
        evidence levels were independently developed without copying mechanism or child counts. Both analytics specify session
        joins, native identifiers, requests versus returns, and health; the API analytic additionally separates page and property
        states.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - download-and-hash
    - utf8-html-text-extraction
    - reviewed-yaml-serialization
    - strict-yaml-and-reference-validation
  shared_library_review:
    catalog_searches:
    - virtual-machine
    - hypervisor-jackpotting
    - play-ransomware
    - propertycollector
    - exact-source-urls
    - management-inventory-controls
    existing_objects_examined:
    - REF-000625
    - REF-001223
    - REF-000981
    - REF-000982
    - CASE-000284
    - MIT-000139
    - MIT-000241
    - MIT-000080
    - MIT-000207
    dispositions:
    - object_ref: REF-001223
      decision: reuse
      reason: Exact Broadcom audit publication and native authentication-to-shell join contract.
    - object_ref: REF-000982
      decision: defer
      reason: Different VMware publication; not CrowdStrike Hypervisor Jackpotting Part 2 or CISA evidence for CASE-000284.
    - object_ref: CASE-000284
      decision: defer
      reason: Center is Play control-plane poweroff with REF-000981. CISA returned 403; metadata uses advisory year and platform
        as sector. Do not extend unverified metadata or use poweroff to prove returned inventory.
    - object_ref: MIT-000139
      decision: split
      reason: IaaS and CloudTrail controls differ materially from host and vCenter permissions plus lockdown and ESXi session
        audit.
    - object_ref: MIT-000241
      decision: split
      reason: Storage inventory and App Control measures are not unchanged controls for hypervisor visibility.
    - object_ref: MIT-000080
      decision: split
      reason: GuestOps patching and execution authority have a different identity from VM inventory visibility.
    - object_ref: MIT-000207
      decision: split
      reason: Power lifecycle authority does not cover read visibility and must not imply inventory prevention.
    exact_url_aliases:
    - reference_key: B012-T1673-REF-TREND
      canonical_url: https://www.trendaisecurity.com/en/resources-insights/trendai-security-blog/new-play-ransomware-linux-variant-targets-esxi-shows-ties-with-p
      alias_url: https://www.trendmicro.com/en_us/research/24/g/new-play-ransomware-linux-variant-targets-esxi-shows-ties-with-p.html
      disposition: one-publication-identity
    - reference_key: B012-T1673-REF-KB-VIEWS
      canonical_url: https://knowledge.broadcom.com/external/article?legacyId=1004340
      stable_article_identity: broadcom-308457
      disposition: one-publication-identity
  limitations:
    paragraphs:
    - zh: 本交接只交付研究候选，不分配正式身份。父级准入强于匿迹效果证据，NM-FD保留中等置信推断，NM-BT已因缺乏可比设计对照而移除。分类维持deferred，不能以零项产出宣告所有候选轴已闭合。
      en: This handoff delivers research candidates without formal identities. Admission is better supported than stealth
        effectiveness. NM-FD remains a medium-confidence inference, while NM-BT was removed for lacking a comparable design
        contrast. Taxonomy remains deferred; zero established children does not close every candidate axis.
    - zh: 未执行hypervisor或恶意样本实验；解析器、返回采集、批准和健康为需部署验收的数据合同。机器检查只证明交接结构与引用自洽，正式查重、准入收敛、质量及Web验收由主Agent后续完成。
      en: No hypervisor or malware experiments were performed. Parsers, returns, approval, and health are contracts requiring
        deployment acceptance. Machine checks establish handoff structure and reference consistency only; formal duplicate
        review, admission convergence, quality, and Web acceptance remain with the primary agent.
  rejected_mechanisms:
  - mechanism_ref: NM-BT
    disposition: evidence-deferred
    reason:
      zh: 管理面在guest外是父级固有位置，未证实攻击者改变可比路径的观察位置；guest无枚举进程不够建立匿迹设计。
      en: Management position outside guests is inherent to the parent. No changed observation position between comparable
        paths is established; absent guest processes do not establish stealth design.
  - mechanism_ref: NM-ST
    disposition: evidence-deferred
    reason:
      zh: 重复确认或集中查询不证明有意稀释、分布式任务或跨节点分散。
      en: Rechecking or central queries do not establish deliberate dilution, distributed tasks, or cross-node dispersion.
  - mechanism_ref: NM-DO
    disposition: not-supported
    reason:
      zh: CSV、过滤及原生格式没有内容遮蔽或解释分歧证据。
      en: CSV, filtering, and native formats lack content-obscuration or interpretation-divergence evidence.
  open_questions:
  - Independently accept or reject conditional NM-FD without substituting weak NM-BT to satisfy a mechanism count.
  - Validate command and API result collectors before claiming result-level coverage.
  - Audit CASE-000284 metadata separately before any future extension.
  - Revisit cached inventory, session borrowing and subscriptions only with conclusion-level trace comparisons.
