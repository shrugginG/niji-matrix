  - temporary_key: B012-T1673-NJA-API-INVENTORY
    schema_version: 2.0.0
    type: detection-analytic
    strategy_key: B012-T1673-DET-MANAGEMENT-INVENTORY
    name:
      zh: vSphere对象清单请求与分页返回核验
      en: vSphere Object-Inventory Requests and Paginated Return Verification
    summary:
      zh: 对实际部署的管理请求采集核验VM过滤范围、会话、返回对象、分页及属性取得状态。
      en: Verify VM filter scope, sessions, returned objects, pagination, and property acquisition in deployed management-request
        capture.
    domains:
    - enterprise
    platforms:
    - VMware vSphere
    logic:
      paragraphs:
      - zh: 仅在SDK包装器或授权管理边界已部署并验收请求/返回采集时启用；普通TLS、hostd连接和默认EDR不满足。选择RetrievePropertiesEx及同会话ContinueRetrievePropertiesEx，保留_this的collector、specSet、对象/遍历过滤、type、all及pathSet，并按对象类型合并适用PropertySpec的属性路径集合且保留原过滤关联。过滤语义或已返回managed
          object type明确为VirtualMachine才归类，泛PropertyCollector请求不够。按authority_id及UserSession.key或经采集器确认的认证会话归组；原生userName、ipAddress、userAgent按实际提供保留，ipAddress可为pipe，缺失为空，不能据账号或地址猜人类操作者。
        en: Enable only with deployed and accepted SDK-wrapper or authorized management-boundary request/response capture;
          ordinary TLS, hostd connections, and default EDR are insufficient. Select RetrievePropertiesEx and same-session
          ContinueRetrievePropertiesEx, retaining _this collector, specSet, object/traversal filters, type, all, and pathSet,
          retaining filter associations and combining applicable PropertySpec paths by object type. Classify only when filter
          semantics or returned managed-object type explicitly identifies VirtualMachine; a generic PropertyCollector request
          is insufficient. Group by authority_id and UserSession.key or collector-validated authentication session. Retain
          supplied native userName, ipAddress, and userAgent, allowing pipes and nulls without inferring a human from an account
          or address.
      - zh: 将方法返回或SOAP fault映射return_status和fault_type；授权允许或入口的System.Anonymous不等于成功返回，对象可见性仍单独评估。将returnval.objects的ObjectContent.obj映射object_type及managed_object_ref，propSet名值保留property_pairs，missingSet保留属性及fault。只声明实际值，不从pathSet补齐，不合并缺失、null与fault。只取引用能证明引用取得，不能声称未返回名称、路径或状态；每个对象分别保存取得值与缺失属性。PropertySpec的all为true时忽略pathSet；明确仅请求对象引用而不请求属性时，property_state置为not_requested，不能用空路径集合宣称全部属性取得。
        en: Map method returns or SOAP faults to return_status and fault_type. Authorization allowance or entry-level System.Anonymous
          does not establish successful returns because object visibility is independently evaluated. Map ObjectContent.obj
          in returnval.objects to object_type and managed_object_ref; retain propSet pairs as property_pairs and missingSet
          properties/faults. Declare actual values only without filling from pathSet or merging missing, null, and fault.
          Reference-only acquisition establishes the reference rather than an unreturned name, path, or state; preserve acquired
          values and missing properties separately for every object. PropertySpec all=true ignores pathSet. For an explicit
          reference-only request, set property_state to not_requested rather than interpreting an empty path set as acquisition
          of every property.
      - zh: 返回token保存不可逆摘要，同会话同collector连接下一请求token摘要。分别输出capture_state、page_state与property_state：丢包、截断或未采到返回使capture_state为partial或not_captured；只有确认采集完整、已见续页连续且token未设置，才把page_state置为complete_for_visible_request。token未耗尽或续页fault使page_state为partial。即使页链完整，missingSet有fault或明确请求路径未解析为值时仍输出property_state=partial，不能宣称全部请求属性取得；仅在具体pathSet均已核对且无缺失fault时输出complete_for_explicit_paths，all=true或无法展开属性范围时为not_fully_assessable。成功零对象为empty_visible_result，无返回为inventory_request_observed，有fault为inventory_request_failed；任何complete标签都不超越过滤、权限与时间范围，且不证明电源变化或加密。
        en: Retain irreversible token digests and join the next request digest within the same session and collector. Output
          capture_state, page_state, and property_state separately. Loss, truncation, or uncaptured returns make capture_state
          partial or not_captured. Set page_state to complete_for_visible_request only with complete capture, a continuous
          observed continuation chain, and an unset token. An unexhausted token or continuation fault makes page_state partial.
          Even with a complete page chain, missingSet faults or unresolved explicitly requested paths make property_state
          partial rather than establishing all requested properties. Use complete_for_explicit_paths only after reconciling
          concrete pathSet values without missing faults; all=true or unexpandable property scope remains not_fully_assessable.
          Successful zero objects produce empty_visible_result, absent returns inventory_request_observed, and faults inventory_request_failed.
          Every complete label remains bounded by filters, access, and time and establishes neither power changes nor encryption.
      - zh: 将请求及已证返回同登记权域、主体、来源、对象、属性和时间比较，保留scope_mismatch或approval_unknown。身份与collector键来自声明输入，不从显示名或时间猜测。健康登记包括采集位置、支持方法、明文取得方式、请求返回覆盖、解析版本、丢失与时钟误差；方法不支持或返回失效降为请求级或coverage_unknown。API恶意采用证据弱于命令分支，这是待部署验证设计而非测得效果。
        en: Compare requests and confirmed returns with registered authority, principal, origin, objects, properties, and
          time, retaining scope_mismatch or approval_unknown. Identity and collector keys derive from declared inputs rather
          than names or time guesses. Health registers include position, supported methods, plaintext access, request/response
          coverage, parser version, loss, and clock uncertainty. Unsupported methods or failed returns reduce conclusions
          to request-level or coverage_unknown. Evidence for malicious API adoption is weaker than for commands; this is a
          design requiring deployment validation rather than measured effectiveness.
    data_requirements:
    - source_type: validated-vsphere-inventory-transactions
      name:
        zh: 经验证的vSphere清单原生事务采集
        en: Validated vSphere Native Inventory Transaction Capture
      channel: custom SDK wrapper or authorized plaintext management boundary; not default hostd or EDR
      required_fields:
