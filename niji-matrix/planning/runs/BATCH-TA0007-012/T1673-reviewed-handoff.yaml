    - source_type: esxi-collection-health
      name:
        zh: ESXi采集覆盖与完整性登记
        en: ESXi Collection Coverage and Integrity Register
      channel: external collector and asset lifecycle metadata
      required_fields:
      - host_id
      - boot_generation
      - stream
      - collector_id
      - capture_scope
      - parser_version
      - heartbeat_interval_seconds
      - last_arrival
      - loss_or_rotation_state
      - truncation_state
      - parse_status
      - clock_offset_seconds
      - clock_uncertainty_seconds
    observables:
    - zh: shell消息明确包含运行或注册清单命令、管线及选列。
      en: Shell messages explicitly contain running or registered inventory commands, pipelines, and field selection.
    - zh: 可验证认证链使请求可同批准账号、来源、视图和作业比较。
      en: Verifiable authentication chains make requests comparable with approved accounts, origins, views, and jobs.
    - zh: 专用采集实际取得World ID或VMID；没有采集时只保留请求。
      en: Dedicated capture actually acquires World IDs or VMIDs; absent capture retains only requests.
    correlation:
      window:
        zh: 以会话明确开始到结束和宿主启动代际为边界；同command_key输出默认六十秒内连接，长查询按明确键延伸。批准窗口使用登记时间，时间规范为UTC并保留原时区及秒级误差。二十分钟序列只辅助调查，不能用邻近代替会话证据。
        en: Bound correlation by explicit session start/end and host boot generation. Join output on the same command_key
          within sixty seconds by default, extending long queries by explicit keys. Use registered approval windows, normalize
          to UTC, and preserve original zones and uncertainty in seconds. A twenty-minute sequence aids investigation but
          proximity does not replace session evidence.
      dimensions:
      - host_id
      - boot_generation
      - session_key
      - shell_world_id
      - command_key
      - authority_id
      - inventory_view
      - job_id
      - collector_id
    false_positives:
    - zh: 故障排查、备份、迁移与资产盘点使用相同命令，须核验具体作业。
      en: Troubleshooting, backup, migration, and asset inventory use the same commands and require job-specific review.
    blind_spots:
    - zh: 非交互、内部子进程、其他管理入口、root删改和未转发stream可逃离本路径。
      en: Noninteractive execution, internal children, other management paths, root modification, and unforwarded streams
        can escape this path.
    - zh: 缺失Session opened、输出采集或版本解析支持限制归属及返回；API与GUI需要独立覆盖。
      en: Missing Session opened records, output capture, or parser-version support limit attribution and returns; APIs and
        GUIs need separate coverage.
    tuning_guidance:
      paragraphs:
      - zh: 用本环境日志核对auth父子进程与shell World ID，按启动代际处理标识复用。验收文本、CSV、空、权限错、invalid和截断样例，字段只在真实存在时映射。例外绑定账号、来源、权域、作业、视图和到期，不能永久放行root或所有维护流量。返回缺失仍保持请求检测，不要求高数量或后继破坏。
        en: Validate auth parent/child and shell World ID relationships locally, handling identifier reuse by boot generation.
          Accept text, CSV, empty, denied, invalid, and truncated examples, mapping only present fields. Bind exceptions to
          account, origin, authority, job, view, and expiry rather than permanently allowing root or all maintenance. Retain
          request detection without returns and without requiring high counts or later destruction.
