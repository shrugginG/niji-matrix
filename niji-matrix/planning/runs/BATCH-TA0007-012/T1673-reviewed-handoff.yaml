proposed_content:
  temporary_key: B012-T1673-PARENT
  schema_version: 2.0.0
  type: technique
  name:
    zh: 虚拟机发现
    en: Virtual Machine Discovery
  summary:
    zh: 通过已取得访问的宿主或管理面枚举受管虚拟机，并可借用正常盘点入口，使单次查询的攻击意图难以仅凭命令外观辨识。
    en: Enumerate managed virtual machines through an accessed host or management plane, potentially borrowing ordinary inventory
      entry points so an isolated command poorly distinguishes adversarial intent.
  aliases: []
  classification:
    tactic_refs:
    - TA0007
    origin:
      kind: attack-retained
      source_attack_id: T1673
      source_attack_version: '19.1'
  definition_and_concept:
    paragraphs:
    - zh: 虚拟机发现是攻击者取得宿主、hypervisor或管理服务访问后，读取该权域可见的虚拟机清单、VM标识以及宿主或配置位置关联，回答有哪些VM可成为下一步目标。清单可由本地管理命令、远程管理API或管理界面取得；行为发生在管理视图，通常不要求在每个被列VM内执行发现进程。
      en: Virtual Machine Discovery is the adversary's reading of VM inventories, identifiers, and host or configuration-location
        associations after access to a host, hypervisor, or management service. It answers which VMs can become subsequent
        targets. Local administration commands, remote management APIs, or management interfaces supply the inventory. The
        behavior occurs in a management view and usually does not require a discovery process inside every listed VM.
    - zh: 发现完成需要清单或属性实际取得；只有命令或请求记录时只能确认尝试。运行清单给出当前VM执行实例的World ID，注册清单给出管理对象VMID。同名VM、重注册、迁移和重启可改变关联。路径是配置定位线索，不等于已读虚拟磁盘内容。后继电源操作、停止与加密需要各自请求、状态或内容结果证据。
      en: Completion requires actual acquisition of inventory or properties; a command or request record alone establishes
        an attempt. Running inventories supply World IDs for current VM execution instances, while registered inventories
        supply management-object VMIDs. Duplicate names, reregistration, migration, and restart can change associations. Paths
        locate configuration rather than establish virtual-disk content reads. Later power operations, stopping, and encryption
        require their own request, state, or content-outcome evidence.
  stealth_characteristics:
    paragraphs:
    - zh: 原生VM清单命令具有真实的正常管理用途。官方故障排查流程和恶意操作记录出现相同的list/getallvms命令及原生标识，使单次命令的工具来源、语法和输出对象无法单独区别业务盘点与攻击准备。可控选择是借用已安装管理查询入口；其可观察效果是恶意查询保留正常管理特征，而不是已证明攻击者以伪装为主观目的或测得漏检率。
      en: Native VM-inventory commands have genuine administrative uses. Official troubleshooting procedures and malicious
        operations contain the same list/getallvms commands and native identifiers, so tool provenance, syntax, and returned
        object types alone cannot distinguish business inventory from attack preparation. The controllable choice is reuse
        of an installed administration query path. Its observation effect is retention of normal administrative features,
        rather than proof that camouflage was the adversary's subjective purpose or that a miss rate was measured.
    - zh: 查询位于管理面是本父级的固有特征，guest缺少枚举进程不单独构成匿迹机理。宿主认证、shell命令、管理会话、经验证API请求、可选返回与批准作业仍是正面痕迹。账号、来源、请求范围及任务上下文可打破正常外观重合；root或管理服务被控制时，本地记录完整性及远程采集健康也必须核验。
      en: Management-plane query position is inherent to this parent, and missing guest enumeration processes do not independently
        establish a stealth mechanism. Host authentication, shell commands, management sessions, validated API requests, optional
        returns, and approved work remain positive traces. Accounts, origins, request scope, and task context can distinguish
        otherwise overlapping administrative appearance. If root or the management service is compromised, local record integrity
        and remote collection health must also be verified.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入管理权域内列举运行VM、注册VM或权限可见VM对象，取得其原生标识、名称、配置定位或明确请求的关联属性。运行视图不能替代注册清单，注册视图不能证明每项正在运行或已经停止。API完整分页也只说明这次权限可见且受过滤请求的响应范围已遍历，不证明全部基础设施可见；对象的missingSet仍可能说明某些请求属性未取得。
      en: Include running, registered, or permission-visible VM enumeration within a management authority, acquiring native
        identifiers, names, configuration locations, or explicitly requested related properties. A running view cannot replace
        a registered inventory, and registration proves neither running nor stopped state. Complete API pagination establishes
        traversal of the permission-visible filtered response rather than visibility over all infrastructure; an object's
        missingSet can still show requested properties that were not acquired.
    - zh: NJT-0139按云账户或项目取得实例、网络、卷等资源图；这里按宿主或hypervisor权域取得VM对象。混合返回按直接问题及用途归属，不因字段含VM重复标注。NJT-0244取得当前系统OS、硬件和版本，读取ESXi版本或guest虚拟化指纹本身不属于本条。只有本地环境判断实际改变核心后继路径才进入NJT-0122，VM清单不能替代门控证据。
      en: NJT-0139 acquires instance, network, volume, and other resource graphs under a cloud account or project; this technique
        acquires VM objects under host or hypervisor authority. Assign mixed returns by direct question and use rather than
        duplicating labels because a field mentions a VM. NJT-0244 acquires current-system OS, hardware, and version properties;
        ESXi version reads or guest virtualization fingerprints alone are outside this entry. NJT-0122 requires a local environment
        judgment actually changing a core successor path, and inventory cannot replace gating evidence.
    - zh: 正常资产盘点和恢复操作是反例。目录寻找vmdk、读取磁盘字节、注册创建VM、迁移、guest远程执行和改变电源状态各有不同对象或结果。即使来源描述完整勒索链，本条只记录已证明的VM发现阶段；VMID、World ID和配置路径不能证明VM已遭停止、访问或加密。
      en: Legitimate asset inventories and recovery operations are counterexamples. Directory searches for vmdk files, disk-byte
        reads, VM registration or creation, migration, guest execution, and power-state changes have different objects or
        outcomes. Even in a complete ransomware chain, this entry records only demonstrated VM discovery. VMIDs, World IDs,
        and configuration paths do not establish stopping, access, or encryption of VMs.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 控制ESXi入口后，攻击者可用运行清单确定执行实例，再把World ID传入独立电源动作。CrowdStrike所述VIKING SPIDER先列运行VM、逐项处理、再查询；最后一次查询也是新的发现事实，意义受当时请求、完整输出与采集条件限制。
        en: After controlling an ESXi entry point, an adversary can identify execution instances through a running inventory
          and pass World IDs to separate power actions. CrowdStrike's VIKING SPIDER sequence lists, acts on entries, and queries
          again. The last query is a new discovery fact whose meaning depends on its request, complete output, and capture
          conditions.
      - zh: Trend Micro展示Play把注册清单首列VMID送入循环，但没有给出所有受害环境的逐次返回。vCenter界面或API可取得相应管理对象视图，适用于宿主目标选择；本研究对该实现面的支持来自官方合同与固定基线，不能冒充另一个实测恶意案例。
        en: Trend Micro shows Play feeding first-column VMIDs from a registered inventory into a loop without providing every
          victim environment's returns. A vCenter interface or API can provide a corresponding management-object view for
          host-scoped target selection. Support for this implementation comes from official contracts and the fixed baseline
          rather than a separately measured malicious case.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需进入宿主shell、hypervisor服务或授权管理会话，并掌握清单入口与标识。所核ESXi操作示例使用root，但不能推广为所有VM读取都需root；vCenter对象权限、继承范围与会话可见性决定返回。普通guest访问且无管理路径不意味着可看见同宿主其他VM。
          en: The adversary needs a host shell, hypervisor service, or authorized management session and knowledge of inventory
            paths and identifiers. The examined ESXi examples use root, but this is not a universal requirement for VM reads.
            vCenter object permissions, inheritance, and session visibility determine returns. Ordinary guest access without
            a management path does not imply visibility into other VMs on the host.
        - zh: 攻击者可选择运行或注册视图、过滤结果、集中或重复查询，并将标识用于其他动作。这些选择影响返回范围与数量，但资料未证明低频、旧清单复用或事件订阅形成独立匿迹变量。重启、迁移与注册变更会使World ID、VMID和路径关联失效。
          en: The adversary can choose running or registered views, filter results, query centrally or repeatedly, and use
            identifiers in other actions. These choices affect scope and volume, but the material does not establish low-rate
            querying, cached inventory, or event subscription as independent stealth variables. Restart, migration, and registration
            changes can invalidate World ID, VMID, and path associations.
      defender_model:
        paragraphs:
        - zh: 防守方需宿主auth.log、shell.log、会话边界及正常作业登记。auth的sshd进程号不自动等于shell World ID，应沿Session opened记录连接。shell.log不承诺stdout、退出码或所有非交互子进程；hostd的一般任务、事件与SDK连接说明不保证每次只读调用完整参数和清单。
          en: Defenders need host auth.log, shell.log, session boundaries, and normal-work registration. An sshd PID is not
            automatically a shell World ID; join through Session opened records. shell.log does not promise stdout, exit codes,
            or all noninteractive children, and general hostd task, event, and SDK-connection documentation does not guarantee
            full parameters and inventory for each read-only call.
        - zh: API分析需另行验收的客户端或管理边界采集，保留会话、过滤器、对象类型、分页及原生fault，不是默认EDR功能。返回、批准登记或映射缺失时分别降为请求可见、作业未知或归属未解析。日志中断、截断、解析失败和时钟误差是覆盖问题；guest遥测只可补充后继结果。
          en: API analysis needs separately accepted client or management-boundary capture retaining sessions, filters, object
            types, paging, and native faults; it is not default EDR. Missing returns, approval registration, or mappings reduce
            conclusions to request visibility, unknown work, or unresolved attribution respectively. Interruptions, truncation,
            parse failures, and clock uncertainty are coverage problems; guest telemetry only supplements successor outcomes.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用正常管理查询使VM枚举保留业务盘点的原生特征
      en: Reusing administrative queries retains native features of operational VM inventory
    analysis:
      paragraphs:
      - zh: 攻击者选择已有esxcli或vim-cmd清单入口获取VM，而官方故障排查也使用同一入口及World ID或VMID。对照两类正面记录，恶意请求的可执行来源、查询语法与原生标识没有天然恶意专属特征，单条工具签名或命令语法因此难以区分意图。这个借用正常查询表面的设计符合特征伪装的有条件解释；其防守差异要求加入来源、会话、对象范围和批准任务，而不是期待一个恶意专用枚举标记。
        en: The adversary selects existing esxcli or vim-cmd inventory paths, while official troubleshooting uses the same
          paths and World IDs or VMIDs. Comparing these positive records shows no inherently malicious-only executable provenance,
          query syntax, or native identifiers in the malicious request, limiting intent classification from an isolated tool
          signature or command. Borrowing the normal query surface supports a conditional Feature Disguise interpretation.
          Its defense distinction requires origin, session, object scope, and approved-work context rather than an expected
          malicious-only enumeration marker.
      - zh: 来源直接证明正常用途与恶意采用的重合，尚未证明选择工具的主观伪装动机，也没有比较自定义枚举器和原生命令的检测率。机理因此保持中等置信的观察模型推断：工具来源与语法本身的判别力有限，而会话、批准作业与实际请求范围仍能揭示误用。这不表示所有虚拟机发现都隐蔽或无法检测。
        en: 'The sources directly establish legitimate-use and malicious-use overlap without establishing a subjective camouflage
          motive or comparing detection rates for custom enumerators and native commands. The mapping therefore remains a
          medium-confidence inference about observation: tool provenance and syntax alone have limited discriminatory value,
          while sessions, approved work, and actual request scope can still expose misuse. It does not make every VM inquiry
          covert or undetectable.'
    evidence_keys:
    - B012-T1673-REF-KB-VIEWS
    - B012-T1673-REF-ESXCLI
    - B012-T1673-REF-CROWDSTRIKE
    - B012-T1673-REF-TREND
    confidence: medium
  subtechnique_taxonomy:
    coverage: deferred
    subtechnique_keys: []
    narrative:
      paragraphs:
      - zh: 本轮没有建立原生子技术。运行与注册改变对象和标识，命令、GUI与API改变入口，没有单独证明稳定匿迹设计及兄弟边界。管理面相对guest的位置是父级核心，不能复制为覆盖整个父级的子项。
        en: No native children are established in this review. Running and registered views change objects and identifiers;
          commands, GUIs, and APIs change entry points without independently establishing stable stealth designs and sibling
          boundaries. Management position relative to guests is parent core and cannot be duplicated as a child covering the
          whole parent.
      - zh: 预存清单替代、会话借用与事件订阅仍是有意义但缺乏结论层证据的候选变量，因此分类覆盖保留deferred，而不是宣称研究已排除一切稳定分项。已知恶意来源证明清单取得和标识使用，尚未证明这些轴有意改变痕迹及产生独立防御差异。零个已成立子项是本轮产出，不能等同已证明无可成立分类。
        en: Existing-inventory substitution, session borrowing, and event subscription remain meaningful candidate variables
          lacking conclusion-level evidence. Taxonomy coverage therefore remains deferred rather than claiming research has
          excluded every stable partition. Known malicious sources establish inventory and identifier use without establishing
          deliberate trace changes and independent defense differences on these axes. Zero established children is this review's
          output, not proof that no useful taxonomy can exist.
