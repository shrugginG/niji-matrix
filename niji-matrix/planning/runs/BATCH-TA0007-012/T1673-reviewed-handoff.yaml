defense_candidates:
  detection_strategies:
  - temporary_key: B012-T1673-DET-MANAGEMENT-INVENTORY
    schema_version: 2.0.0
    type: detection-strategy
    name:
      zh: 受管VM清单请求与返回问责
      en: Managed-VM Inventory Request and Return Accountability
    summary:
      zh: 识别管理权域内与批准工作不符的VM清单请求，并按证据区分尝试、部分取得和有界完整取得。
      en: Identify VM-inventory requests inconsistent with approved work within a management authority and distinguish attempts,
        partial acquisition, and bounded complete acquisition by evidence.
    description:
      paragraphs:
      - zh: 策略从宿主交互命令和经验证管理API两侧观察清单读取，不把guest缺少进程作为恶意判据。命令分析连接auth、shell和批准作业，只在实际捕获输出时声明返回；API分析要求部署请求、会话及返回采集，分别解释响应分页完整性及属性取得状态。两者保留身份不明、授权范围未知和采集不全，不用hostd连接或方法权限代替数据取得。
        en: The strategy observes inventory through host interactive commands and validated management APIs without treating
          missing guest processes as malicious. Command analysis joins auth, shell, and approved work and declares returns
          only with captured output. API analysis requires deployed request, session, and response capture and separately
          interprets page completeness and property acquisition. Both retain unresolved attribution, unknown authorization
          scope, and incomplete capture rather than substituting hostd connections or method privileges for acquisition.
    detects_keys:
    - B012-T1673-PARENT
    analytic_keys:
