    - source_type: vsphere-approved-inventory-jobs
      name:
        zh: vSphere批准清单作业登记
        en: vSphere Approved Inventory Job Register
      channel: administrator-maintained job and scope register
      required_fields:
      - authority_id
      - approved_principal
      - source_scope
      - object_scope
      - property_scope
      - job_id
      - owner
      - valid_from
      - valid_to
      - register_version
    - source_type: vsphere-transaction-capture-health
      name:
        zh: vSphere事务采集支持与健康
        en: vSphere Transaction Capture Support and Health
      channel: independent collector capability and heartbeat registry
      required_fields:
      - authority_id
      - collector_id
      - capture_position
      - supported_methods
      - plaintext_capture_method
      - request_capture_enabled
      - response_capture_enabled
      - parser_version
      - heartbeat_interval_seconds
      - last_arrival
      - loss_state
      - parse_status
      - clock_offset_seconds
      - clock_uncertainty_seconds
    observables:
    - zh: 请求过滤或返回对象类型明确为VirtualMachine的属性检索。
      en: Property retrieval with request filters or returned object types explicitly identifying VirtualMachine.
    - zh: 同会话collector的token链、ObjectContent引用、属性名值与缺失fault分别形成页链及属性状态。
      en: Same-session collector token chains, ObjectContent references, property pairs, and missing faults separately establish
        page and property states.
    - zh: 请求或返回范围与批准主体、来源、对象、属性或窗口不符。
      en: Request or return scope inconsistent with approved principal, origin, objects, properties, or window.
    correlation:
      window:
        zh: 同session及collector从首请求到token耗尽或明确失败，默认三十分钟调查窗；长作业按token与request_id延伸，不合并同用户名。native dateTime转UTC并保留精度和秒级误差。
        en: Maintain the same-session collector chain from initial request to token exhaustion or explicit failure, starting
          with thirty minutes. Extend by tokens and request_id rather than merging usernames. Normalize native dateTime to
          UTC while preserving precision and uncertainty in seconds.
      dimensions:
      - authority_id
      - authenticated_session_key
      - collector_object_ref
      - request_id
      - request_token_digest
      - returned_token_digest
      - managed_object_ref
      - job_id
      - collector_id
    false_positives:
    - zh: vSphere客户端、备份、合规及资产工具正常遍历，完整分页或大量对象不直接恶意。
      en: vSphere clients, backup, compliance, and asset tools legitimately traverse; full pagination or many objects are
        not directly malicious.
    blind_spots:
    - zh: 未包装客户端、host shell、GUI缓存和其他API不在采集路径；TLS只证明连接。
      en: Unwrapped clients, host shells, GUI caches, and other APIs are outside capture; TLS proves only a connection.
    - zh: 会话劫持、采集器控制、过滤解析不足和丢页限制归属及完整性，hostd不能自动补齐。
      en: Hijacking, collector compromise, weak filter parsing, and missing pages limit attribution and completeness; hostd
        cannot automatically fill gaps.
    tuning_guidance:
      paragraphs:
      - zh: 上线前用获批查询验收过滤、对象权限差异、只取引用、空返回、missingSet、fault和多页链，确认请求及返回均采到；专门测试token耗尽但某属性仍有missingSet的情况，确认page_state完整而property_state部分。原始结构保留大小写，规范字段小写，不保存可复用会话凭据或明文token。例外按具体作业对象与属性，不永久放行ReadOnly或备份账号；批准缺失需调查，不自动判恶。
        en: Before enabling, accept filters, object-access differences, references only, empty returns, missingSet, faults,
          and multipage chains using approved queries and confirm both requests and responses. Explicitly test token exhaustion
          with a missingSet property fault, ensuring complete page_state but partial property_state. Preserve native casing
          in raw structures while normalizing field names to lowercase, without reusable session credentials or plaintext
          tokens. Scope exceptions by job objects and properties rather than permanently allowing ReadOnly or backup accounts.
          Missing approval warrants investigation rather than automatic malicious classification.
