  mitigations:
  - temporary_key: B012-T1673-MIT-MANAGEMENT-VISIBILITY
    schema_version: 2.0.0
    type: mitigation
    name:
      zh: 虚拟化管理可见权域与清单问责
      en: Virtualization Management Visibility Scope and Inventory Accountability
    summary:
      zh: 限制不必要宿主及管理面访问，保留可核验VM清单请求和授权范围。
      en: Restrict unnecessary host and management access and retain verifiable VM-inventory requests and authorized scope.
    description:
      paragraphs:
      - zh: 清单是运维必需信息，目标是减少谁能看到哪些VM及从哪里查询，并让原生外观与实际作业核对。宿主直接权限和vCenter权限分别审查；隔离网络、限制shell和lockdown减少暴露，批准及外部审计恢复发现行为。只限制电源或加密写入不能当作阻止清单读取。
        en: Inventory is operationally necessary. Reduce who sees which VMs and from where, and compare native appearance
          with actual work. Review direct-host and vCenter permissions separately. Isolation, restricted shells, and lockdown
          reduce exposure; approval and external audit recover discovery. Controls only restricting power or encryption writes
          do not prevent inventory reads.
    domains:
    - enterprise
    measures:
    - key: bounded-management-visibility
      name:
        zh: 约束管理入口与对象可见权域
        en: Bound Management Entry Points and Object Visibility
      description:
        paragraphs:
        - zh: 在受控管理网络部署hypervisor和管理服务，按职责分配宿主/vCenter账号及对象范围。关闭不需SSH，必要访问经MFA及审计入口。适用时从vCenter配置lockdown，逐项审查例外、dcui、vpxuser和应急路径，验证备份与恢复兼容性。
          en: Place hypervisors and management services on controlled networks and assign host/vCenter accounts and object
            scope by duty. Disable unnecessary SSH and route required access through MFA and audited entry points. Where applicable
            configure lockdown via vCenter, review exceptions, dcui, vpxuser, and recovery paths individually, and verify
            backup/recovery compatibility.
      control_type: exposure-reduction
    - key: attributable-inventory-approval-and-audit
      name:
        zh: 清单作业批准与可归属审计
        en: Inventory Work Approval and Attributable Audit
      description:
        paragraphs:
        - zh: 登记作业账号、来源、权域、对象属性范围和到期，远程保留auth/shell并验收会话连接。API和输出采集另行部署测试，不用一般hostd保证完整返回。独立记录支持能力、心跳、截断和解析失败，约束清单与日志敏感信息访问及保留。
          en: Register job accounts, origins, authorities, object/property scope, and expiry; remotely retain auth/shell and
            accept session joins. Deploy and test API/output capture separately without promising complete returns from general
            hostd. Independently record capabilities, heartbeats, truncation, and parser failures, restricting sensitive inventory/log
            access and retention.
      control_type: detective-support
    applications:
    - target_key: B012-T1673-PARENT
      use:
        paragraphs:
        - zh: 分别验证运行、注册及权限过滤清单的必要消费者和范围，移除guest管理员不需的宿主/vCenter访问。枚举回溯明确会话、作业与视图；异常时保留请求及已有返回，隔离或撤销管理会话，并调查暴露权域内其他可见VM。
          en: Independently validate consumers and scope for running, registered, and permission-filtered inventories, removing
            host/vCenter access unnecessary for guest administrators. Trace enumeration to session, job, and view. On anomaly
            preserve requests and available returns, isolate or revoke sessions, and investigate other visible VMs under the
            exposed authority.
      expected_effect:
        paragraphs:
        - zh: 跨VM清单入口与范围减少，正常管理外观更易核对具体作业。即使仍允许查询，远程会话及请求证据减少guest以外盲区，有界返回确定暴露标识而不夸大后继损害。
          en: Cross-VM inventory entry points and scope shrink, and native appearance becomes easier to compare with concrete
            work. Even permitted queries leave remotely retained session/request evidence that reduces gaps outside guests.
            Bounded returns identify exposed references without overstating successor damage.
      limitations:
        paragraphs:
        - zh: 批准账号、vCenter会话、lockdown例外和root仍可能读清单；直接宿主限制不撤销vCenter权限。过窄权限影响备份恢复，root能改本地日志。未采集API或非交互路径仍有盲区；审计批准无法阻止已取得数据，也不证明停止或加密。
          en: Approved accounts, vCenter sessions, lockdown exceptions, and root can retain reads; direct-host restrictions
            do not revoke vCenter rights. Narrow permissions can impair recovery, and root can modify local logs. Uncollected
            API/noninteractive paths remain gaps. Audit and approval cannot prevent completed acquisition or establish stopping
            or encryption.
