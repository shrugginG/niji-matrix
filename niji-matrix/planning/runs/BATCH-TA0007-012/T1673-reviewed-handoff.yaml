  research:
    limitations:
      paragraphs:
      - zh: 原始研究支持ESXi恶意枚举和标识后继使用，固定基线更广平台在本轮没有等价字段和案例核验。不同家族不可合成一次事件，Play样本实验不等于所有受害环境操作时间、行业及返回。NM-FD只是正常用途重合的中等置信推断，既无主观伪装动机也无测量漏检率。
        en: Original research supports malicious ESXi inventory and subsequent identifier use; broader baseline platforms
          lack equivalent field and case verification here. Different families cannot become one event, and Play sample analysis
          does not establish every victim's operation times, sectors, or returns. NM-FD is only a medium-confidence inference
          from legitimate-use overlap, without a proven subjective camouflage motive or measured miss rate.
      - zh: 命令不保证成功、完整或非空返回。World ID、VMID、managed object reference和显示名必须按权域与时间使用。续页不全、missingSet fault、配置不可用或截断只能声明已取得部分；页链完整与请求属性全部取得是两个层次，必须分别记录。空结果也可能受权限与过滤影响，不能推出无VM或全部已停止。
        en: Commands do not guarantee successful, complete, or nonempty returns. World IDs, VMIDs, managed-object references,
          and names require authority and time scope. Incomplete pages, missingSet faults, unavailable configuration, or truncation
          support only acquired portions. A complete page chain and acquisition of every requested property are distinct levels
          and must be recorded separately. Empty results can reflect access or filters and prove neither absence of VMs nor
          that all stopped.
      - zh: 完整API事务、输出、会话映射、批准登记与采集健康均需部署验收，本研究未执行hypervisor或恶意样本实验。管理隔离与最小可见权限能够减少暴露，但不能保证阻止持有批准会话或root权限的主体。分析时间窗是实施起点，仍需在实际ESXi版本、管理API和合法作业中验证字段覆盖、归属及误报。
        en: Full API transactions, output, session mappings, approval registers, and collection health require deployment
          acceptance; no hypervisor or malware experiment was performed. Management isolation and least visibility can reduce
          exposure without guaranteeing prevention against approved sessions or root authority. Analytic windows are starting
          points requiring field-coverage, attribution, and false-positive validation against actual ESXi versions, management
          APIs, and legitimate work.
