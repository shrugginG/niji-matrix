  detection_analytics:
  - temporary_key: B012-T1673-NJA-CLI-INVENTORY
    schema_version: 2.0.0
    type: detection-analytic
    strategy_key: B012-T1673-DET-MANAGEMENT-INVENTORY
    name:
      zh: ESXi交互清单命令与认证会话关联
      en: ESXi Interactive Inventory Commands and Authentication Sessions
    summary:
      zh: 将ESXi清单命令归属至宿主shell会话和批准工作，输出请求级与可选返回级事实。
      en: Attribute ESXi inventory commands to host shell sessions and approved work, producing request-level and optional
        return-level facts.
    domains:
    - enterprise
    platforms:
    - ESXi
    logic:
      paragraphs:
      - zh: 在已验证转发auth.log和shell.log的宿主保留原始消息。以host_id、boot_generation、shell[world]及message_id派生命令command_key，CLI的authority_id取同一宿主稳定host_id。解析完整命令内esxcli
          vm process list或vim-cmd vmsvc/getallvms，保留formatter、管线和重定向；kill、power.off、版本读取和文件搜索单独处理。Accepted认证消息给出用户及客户端，Session
          opened给出终端和shell World ID；沿明确父子会话链连接，不能直接令监听sshd PID等于shell World ID。无法建立链保留unresolved_session，不猜操作者。
        en: Retain raw messages on hosts with validated auth.log and shell.log forwarding. Derive command_key from host_id,
          boot_generation, shell[world], and message_id; CLI authority_id is the same stable host_id. Parse esxcli vm process
          list or vim-cmd vmsvc/getallvms in complete text, retaining formatters, pipelines, and redirection. Handle kill,
          power.off, version reads, and file searches separately. Accepted auth messages supply user and client; Session opened
          supplies terminal and shell World ID. Join through the explicit parent/child session chain rather than equating
          a listening sshd PID with a shell World ID. Retain unresolved_session when the chain is unavailable instead of guessing
          the operator.
      - zh: 将请求同批准登记的权域、账号、来源、清单视图、作业和有效时间比较，越界输出inventory_request_outside_approved_scope，登记缺失输出approval_unknown，符合登记仍保留请求。单条命令即可核验，不要求高频。仅当独立输出采集同command_key连接并提供stdout、stderr、退出状态、完整与截断状态时解释结果，否则result_not_captured。shell.log不提供可假定的stdout或退出码，非交互程序及内部子进程也不保证逐命令出现。
        en: Compare requests with registered authority, account, origin, inventory view, job, and valid time. Emit inventory_request_outside_approved_scope
          for mismatches and approval_unknown for absent registration, retaining approved request facts too. One command can
          trigger review without high frequency. Interpret results only when separate output capture links to command_key
          and supplies stdout, stderr, exit status, completeness, and truncation; otherwise use result_not_captured. shell.log
          has no assumed stdout or exit feed, and noninteractive programs or internal children are not guaranteed to appear
          command by command.
      - zh: 按部署版本真实样例验收解析器。运行文本把实际存在的World ID、Display Name、UUID和Config File映射为world_id、display_name、reported_uuid和config_path；CSV按返回表头及选列解析，不固定列号，未选字段为null。注册文本按实际Vmid、Name、File等表头映射vmid、display_name、config_locator，保留方括号datastore定位而不臆造绝对路径，名称含空格时不用通用空白切分。非零退出、stderr错误、Skipping
          invalid VM、残缺或截断标为失败或部分。成功完整零项只表示此次视图为空，不证明全部停止；VMID、运行World ID和shell会话World ID分开，未有独立映射不得跨表连接。
        en: Accept parsers against real examples from the deployed version. Map actually present World ID, Display Name, UUID,
          and Config File in running text to world_id, display_name, reported_uuid, and config_path. Parse CSV by returned
          headers and selected fields rather than fixed column positions, leaving unselected fields null. Parse actual Vmid,
          Name, and File headers into vmid, display_name, and config_locator, retaining bracketed datastore locators without
          inventing absolute paths and avoiding generic whitespace splitting of spaced names. Nonzero exits, stderr errors,
          Skipping invalid VM, incomplete records, and truncation indicate failure or partial capture. Complete successful
          zero entries mean only an empty view at that time, not all VMs stopped. Keep VMIDs, running World IDs, and shell-session
          World IDs distinct without independent mappings.
      - zh: 每条结论携带请求、归属、批准、视图和质量状态。健康输入包括宿主启动代际、stream、采集范围、解析版本、最后到达、轮转丢失、截断及秒级校时误差；超过批准心跳间隔两倍未到或解析失败另发coverage_unknown，不用缺失事件证明无发现。未部署输出采集只支持请求级分析。先用获批无害查询验收归属器和结果解析器，本研究未执行该验收。
        en: Attach request, attribution, approval, view, and quality state to each conclusion. Health inputs include host
          boot generation, stream, capture scope, parser version, last arrival, rotation or loss, truncation, and clock uncertainty
          in seconds. Delivery exceeding twice the approved heartbeat interval or parse failures separately produce coverage_unknown;
          missing events do not prove no discovery. Without output capture, support request-level analysis only. Accept attribution
          and result parsers with approved harmless queries; this research did not perform that acceptance.
    data_requirements:
    - source_type: esxi-auth-shell-messages
      name:
        zh: ESXi原始认证与交互shell消息
        en: ESXi Raw Authentication and Interactive Shell Messages
      channel: /var/log/auth.log and /var/log/shell.log remotely retained
      required_fields:
      - timestamp
      - host_id
      - native_logger
      - native_process_or_world_id
      - raw_message
      - message_id
    - source_type: validated-esxi-session-map
      name:
        zh: 经验证的ESXi认证到shell会话映射
        en: Validated ESXi Authentication-to-Shell Session Mapping
      channel: custom parser derived from explicit auth and shell session records
      required_fields:
      - host_id
      - boot_generation
      - session_key
      - auth_process_id
      - shell_world_id
      - principal
      - client_address
