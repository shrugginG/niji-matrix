statement_zh: 操作系统、API 和沙箱产品不构成子技术；系统指纹、人类活动与时间真实性分别需要特征环境变体、自然交互实验和一致时间加速，三类证据与防御实验不可互换，因此形成三个 Niji 子技术。
statement_en: Operating system, API, and sandbox product do not define children. System fingerprints, human activity, and temporal realism respectively require feature-environment variants, natural-interaction experiments, and coherent time acceleration. Their evidence and defensive experiments are non-interchangeable and therefore form three Niji children.
