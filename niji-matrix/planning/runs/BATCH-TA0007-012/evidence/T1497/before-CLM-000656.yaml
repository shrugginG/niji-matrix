id: CLM-000656
claim_type: technique-boundary
statement_zh: 程序可要求自然鼠标、键盘、窗口、文档导航或近期输入达到活动充分条件后才释放核心功能；检测需要交互事件语义与受控用户行为实验，形成不同于静态系统指纹的人类活动充分性门控边界。
statement_en: A program can require natural mouse, keyboard, window, document-navigation, or recent-input evidence to satisfy an activity condition before releasing core functionality. Detection requires interaction-event semantics and controlled user-behavior experiments, forming a Human-Activity Sufficiency Gating boundary distinct from static system fingerprints.
