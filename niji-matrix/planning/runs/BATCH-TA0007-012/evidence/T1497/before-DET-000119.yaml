  - zh: Analytic 记录环境查询和分支，并在受控环境变体中比较载荷、网络与进程结果。只有检查与稳定行为收敛相连时定性。
    en: The analytic records environment queries and branches and compares payload, network, and process outcomes across controlled
      environment variants. Classification requires checks to connect to stable behavioral contraction.
