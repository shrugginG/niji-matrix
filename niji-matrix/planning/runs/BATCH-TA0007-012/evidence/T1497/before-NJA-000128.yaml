schema_version: 2.0.0
type: detection-analytic
id: NJA-000128
strategy_ref: DET-000119
name: {zh: 人类交互充分性—载荷结果差分, en: Human-Interaction Sufficiency–Payload Outcome Differential}
summary: {zh: 输出交互读取、自然或机械事件序列和核心载荷释放之间的差分关系。, en: Produce differential relationships among interaction reads natural or mechanical event sequences and core payload release.}
domains: [enterprise]
platforms: [Windows, Linux, macOS]
logic:
  paragraphs:
  - zh: 记录样本对最近输入、鼠标位置、按键、窗口、对话框和文档导航的读取与分支，在无交互、随机点击、固定节奏和自然化多步骤交互条件下重执行。只有自然交互满足后出现解码、子进程或网络，而机械/无交互停留在诱饵或退出分支时，输出 human_activity_sufficiency_gating。
    en: Record sample reads and branches for recent input, mouse position, keystrokes, windows, dialogs, and document navigation and rerun under no interaction, random clicks, fixed cadence, and naturalized multistep interaction. Emit human_activity_sufficiency_gating when decoding, child processes, or networking appears only after natural interaction satisfies the condition while mechanical or no interaction remains in a decoy or exit branch.
data_requirements:
- source_type: sandbox-interaction-and-outcome
  name: {zh: 沙箱交互事件与载荷结果, en: Sandbox interaction events and payload outcome}
  channel: null
  required_fields: [event.timestamp, sample.hash, environment.id, interaction.type, interaction.source, interaction.position, interaction.cadence, window.id, document.action, query.api, branch.id, payload.stage, child.start_key, network.destination, outcome]
observables:
- {zh: 样本反复读取近期输入或鼠标轨迹并在无活动环境退出, en: A sample repeatedly reads recent input or mouse paths and exits in an inactive environment}
- {zh: 自然滚动、单元格导航或多步骤点击后才出现核心载荷, en: Core payload appears only after natural scrolling cell navigation or multistep clicking}
correlation:
  window: {zh: 覆盖一次完整样本运行和交互脚本，并在至少两种交互条件下比较结果；具体期限依据工作流和分析上限设定。, en: Cover one complete sample run and interaction script and compare outcomes under at least two interaction conditions. Set the concrete limit from workflow and analysis ceiling.}
  dimensions: [sample.hash, environment.id, interaction.source, interaction.type, branch.id, payload.stage]
false_positives: [{zh: 合法交互式安装、辅助功能、游戏反作弊、演示软件和需要用户确认的安全操作, en: Legitimate interactive installers accessibility software game anti-cheat demos and security actions requiring user confirmation}]
blind_spots: [{zh: 安全桌面或远程会话事件不可见、UI 随机化、外部物理输入要求或分析无法重复, en: Invisible secure-desktop or remote-session events randomized UI external physical-input requirements or inability to rerun analysis}]
tuning_guidance:
  paragraphs:
  - zh: 使用多种自然节奏、位置、窗口和文档操作并逐项改变条件，按签名和产品基线排除合法交互软件。严重度依赖交互读取、分支与恶意载荷差分，不按一个鼠标 API 告警。
    en: Use varied natural cadence, position, window, and document actions and change conditions one at a time, excluding legitimate interactive software by signing and product baseline. Base severity on interaction reads, branch, and malicious-payload differential rather than one mouse API.
evidence_refs: [REF-000410, REF-000443]
lifecycle: {status: review, version: 0.1.0, created: '2026-09-21', modified: '2026-09-21', contributors: [Niji Matrix Research], reviewers: []}
