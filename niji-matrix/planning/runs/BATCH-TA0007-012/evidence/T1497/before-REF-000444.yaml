notes_zh: Mandiant 对 IRONGATE 样本的分析确认，部分 dropper 在 VMware 或 Cuckoo 环境中不运行，用系统/分析产品指纹控制后继载荷。来源同时明确该样本可能是测试、PoC 或研究活动且无法归因，因此只支持行为与边界，不支持在野攻击归因。
notes_en: Mandiant's IRONGATE analysis establishes some droppers refusing to run under VMware or Cuckoo and using system or analysis-product fingerprints to control successor payloads. The source explicitly states the sample may be a test, proof of concept, or research activity and cannot be attributed, so it supports behavior and boundary but not an in-the-wild campaign attribution.
