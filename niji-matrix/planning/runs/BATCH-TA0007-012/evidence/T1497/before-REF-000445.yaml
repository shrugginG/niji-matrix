notes_zh: Unit 42 观察 Upatre 调用 GetTickCount 并在系统运行不足约十二分钟时退出，使典型短生命周期沙箱将样本判为良性；WildFire 修改运行时间后样本继续恶意流程。来源直接支持时间真实性校验及受控时间差分实验。
notes_en: Unit 42 observed Upatre calling GetTickCount and exiting when system uptime was below roughly twelve minutes, causing a typical short-lived sandbox to judge the sample benign. After WildFire changed the apparent uptime, the sample continued its malicious routine. The source directly supports temporal-realism verification and controlled timing-differential experiments.
