- id: NJT-0232
  name:
    zh: 本地存储发现
    en: Local Storage Discovery
  attack_id: T1680
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000274
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000241
  limitations:
    paragraphs:
    - zh: 目前真实恶意行为主要由 Microsoft 对 Volt Typhoon 的一手调查支撑，未公开逐主机返回容量、完整工具参数、成功或失败状态和查询时刻的检测结果。官方文档证明接口能力与正常需求，不证明攻击者选择接口是为了匿迹；Linux、macOS
        和 ESXi 的平台范围也不能由一个 Windows 活动案例自动获得同等实案强度。
      en: Real adversarial behavior is presently anchored mainly in Microsoft's firsthand Volt Typhoon investigation, which
        does not disclose per-host capacities, complete utility arguments, success or failure status, or detection outcomes
        at query time. Official documentation establishes interfaces and legitimate needs rather than attacker choice for
        stealth. The Linux, macOS, and ESXi scope does not automatically receive equal incident support from one Windows campaign.
    - zh: 防御方案的字段和通道有文档依据，尚未在域端点、Linux 审计和 ESXi 主机部署验证。进程、脚本与命令日志缺返回内容，原生 API、GUI、配额和命名空间差异仍限制判断；macOS 的独立分析待验证实际传感器合同。未证明的实现、时间和来源变量保留为
        deferred，未来同案调用与返回记录、正常基线和观察差分可改变分类与置信度。
      en: Defense fields and channels have documentary support but have not been deployed on domain endpoints, Linux audit,
        or ESXi hosts. Process, script, and command records lack return content, while native APIs, GUIs, quotas, and namespace
        differences constrain interpretation; a macOS-specific analytic awaits a verified sensor contract. Unproved implementation,
        timing, and origin variables remain deferred. Same-incident invocation and return records, legitimate baselines, and
        observation differentials could change taxonomy and confidence.
- id: NJT-0244
  name:
    zh: 系统信息发现
    en: System Information Discovery
  attack_id: T1082
  taxonomy: established
  children:
  - NJS-0244-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000293
      - DET-000294
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000078
      - MIT-000139
      - MIT-000094
  limitations:
    paragraphs:
    - zh: 联合公告记录系统画像命令的恶意采用但没有输出和逐主机执行时间；SUNBURST 资料证明样本中 OS 版本画像能力，不能证明所有受害者执行。KGB RAT 的原始仪器化沙箱另提供进程内 OS 查询与画像消息，但消息中的声明字符串并不鉴定真实
        OS 或物理硬件，也不能把其他 AV、进程和地域事实转入本项。正常诊断外观与客户端承载差支持中等机理置信，尚未进行检测率或对照实测。
      en: The joint advisory records adversarial profiling commands without their output or per-host execution times. SUNBURST
        reporting establishes sample OS-version profiling rather than execution on every victim. KGB RAT's original instrumented
        detonation separately provides an in-process OS query and profile message, but a declared string does not attest the
        actual OS or physical hardware, and AV, process, or geographic facts are not assigned here. Diagnostic appearance
        and client-carriage differences support medium mechanism confidence without detection-rate or controlled experiments.
    - zh: 官方资料说明返回语义而不保证查询完整或真实反映物理环境，版本字符串、CBS 更新集、虚拟硬件和提供方声明各有限制。提出的 Windows 命令、WMI Trace 与 Linux 分析尚未部署验证，依赖明确维护的身份、进程生存期、审批和采集健康输入；它们均不采集返回内容。非
        WMI getter 与其他平台仍有覆盖缺口，具体调用与返回记录、正常基线和同案差分可改变分类与防御置信度。
      en: Official sources define return semantics without guaranteeing complete or physical-environment truth. Version strings,
        CBS update sets, virtual hardware, and provider declarations each have limits. Proposed Windows-command, WMI-trace,
        and Linux analytics are not deployed or validated and rely on explicitly maintained identity, lifetime, approval,
        and collection-health inputs. None collects return content. Non-WMI getters and other platforms retain gaps; concrete
        calls and returns, normal baselines, and same-case comparisons could change taxonomy and defense confidence.
- id: NJT-0141
  name:
    zh: 云存储对象发现
    en: Cloud Storage Object Discovery
  attack_id: T1619
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000152
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000141
  limitations:
    paragraphs:
    - zh: Unit 42 受害环境没有对象数据日志，不能从 S3 Browser 的受控实验推定攻击者在受害桶触发哪一种 ListObjects 事件；同案缺完整对象清单和主观避审意图。AWS 当前文档在普通 S3 对象资源行列 ListObjects，却未列
        ListObjectsV2，V2 出现在其他资源类型行；这只是表格覆盖差，不证明普通桶 V2 必定不记，正式部署必须受控验证。
      en: Unit 42’s victim lacked object-data logs, so its controlled S3 Browser experiment cannot establish which ListObjects
        event the attacker triggered in the victim bucket. The same incident lacks a complete key inventory and audit-evasion
        motive. AWS’s current table lists ListObjects under ordinary S3 object resources but not ListObjectsV2, which appears
        under other resource types. That table difference does not prove ordinary-bucket V2 is never logged; a controlled
        deployment test is required.
    - zh: S3 server access log 按尽力交付，Azure 数据面诊断和 GCP DATA_READ 需要配置；共享键、SAS、公开访问与跨账户读取还会削弱身份归因。已有 Inventory 报告转读只是一项待证假设，不能以厂商提供报表的能力替代实际恶意案例。
      en: S3 server access logs are best effort, and Azure data-plane diagnostics and GCP DATA_READ require configuration.
        Shared keys, SAS, public access, and cross-account reads weaken identity attribution. Retrieving a stored Inventory
        report remains an unproven hypothesis; provider report capability cannot substitute for an adversarial case.
- id: NJT-0180
  name:
    zh: 设备驱动程序发现
    en: Device Driver Discovery
  attack_id: T1652
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000208
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000190
  limitations:
    paragraphs:
    - zh: 恶意资料没有完整父进程、输出、频率与后继时间线。Medusa 的 driverquery 不能证明输出准确；HOPLIGHT、INC 和 Remsec 的 ATT&CK 过程示例各自只支持一种路径或目的，不足以拆分子项。
      en: Adversarial reporting lacks complete parents, output, frequency, and successor timelines. Medusa driverquery does
        not establish output accuracy. ATT&CK procedure examples for HOPLIGHT, INC, and Remsec each support one path or purpose
        and are insufficient for child partitions.
    - zh: 当前正式证据主要支持 Windows。PnPUtil 只说明第三方驱动包，EnumDeviceDrivers 的 24H2 权限条件只适用于特定结果，不能无证扩展到 Linux/macOS 或其他接口。发现目的不能从一次查询自动推断。
      en: Current formal evidence primarily supports Windows. PnPUtil establishes third-party packages and the 24H2 privilege
        condition applies to a particular EnumDeviceDrivers result. Neither can be generalized without evidence to Linux,
        macOS, or other interfaces, and discovery purpose cannot be inferred automatically from one query.
- id: NJT-0235
  name:
    zh: 网络共享发现
    en: Network Share Discovery
  attack_id: T1135
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000278
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000244
  limitations:
    paragraphs:
    - zh: WithSecure 直接记录 No Pineapple 使用 net share，ESET 记录 LunarWeb 命令包中的共享资源侦察，但公开资料不提供逐服务器返回共享、这次共享调用的完整参数、查询身份、分页轨迹或有效访问结果。合法接口外观造成区分困难是结合平台语义的有界推断，尚无受控告警率或攻击者规避选择测量；因此不能将父级案例提升为时间、来源或加密子项。
      en: WithSecure directly records net share use in No Pineapple and ESET records shared-resource reconnaissance in a LunarWeb
        command package, but public material does not provide per-server returned shares, complete share-call arguments, caller
        identity, pagination traces, or effective-access results. Classification ambiguity from legitimate interfaces is a
        bounded inference from platform semantics without controlled alert-rate or adversarial selection measurements. The
        parent cases therefore cannot be promoted into timing, origin, or encryption children.
    - zh: 网络侧结果确认依赖可解码且完整的 RPC 请求/响应，普通进程、连接和 5140/5145 不提供完整清单。Windows 级别与非交互权限具有版本差异，动态清单跨页可能重复或遗漏；Apple 的共享列表手册是历史资料，目标
        macOS 版本与传感器字段仍需部署验证。本文分析初始窗口及例外模型尚未在真实企业共享环境测量效果。
      en: Network result confirmation requires decodable complete RPC exchanges; ordinary process, connection, and 5140 or
        5145 events do not expose the inventory. Windows information levels and noninteractive privileges vary by version,
        and live lists can duplicate or omit entries across pages. Apple's listing manual is historical, requiring target-version
        and sensor-field validation. Initial analytic windows and exception models have not been evaluated in a real enterprise
        share environment.
- id: NJT-0243
  name:
    zh: 软件发现
    en: Software Discovery
  attack_id: T1518
  taxonomy: established
  children:
  - NJS-0243-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000292
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000251
  limitations:
    paragraphs:
    - zh: 软件发现的正式实现证据仍以 Windows 为主。LunarWeb 的命令与 FIN12 的脚本没有逐主机输出和查询发生日期；新增 KGB RAT 来自原始作者的仪器化样本执行，不能推广到所有野外部署。画像消息出现安全产品字符串，仅支持样本报告该值，不能证明产品正在运行、处于启用状态、配置有效或返回了三个独立产品。
      en: Formal implementation evidence for Software Discovery remains primarily Windows-based. LunarWeb commands and FIN12's
        script lack per-host outputs and inquiry dates, while new KGB RAT evidence comes from the original authors' instrumented
        sample execution rather than all field deployments. A security-product string in a profile message shows what the
        sample reported, not a running or enabled product, effective configuration, or three independent returned products.
    - zh: 父级外观相似与进程内工具入口省去是不同机理，二者均无实测检测率或跨产品对照。进程内子项并不隐藏客户端或 WMI 提供方，也不赋予额外读取权限；软件登记不完整、Win32_Product 副作用和健康状态语义限制继续适用。本批防御只消费请求和归属，结果确认、其他查询接口及其他平台仍需要独立数据合同与实验。
      en: Parent appearance similarity and removal of an in-process inquiry's utility entry are different mechanisms, neither
        supported by measured detection rates or cross-product comparisons. The in-process child hides neither clients nor
        WMI providers and grants no extra read rights. Incomplete registration, Win32_Product side effects, and health-state
        limits still apply. This delivery's defenses consume requests and attribution only; result confirmation, other inquiry
        interfaces, and other platforms require separate data contracts and experiments.
- id: NJT-0131
  name:
    zh: 账户发现
    en: Account Discovery
  attack_id: T1087
  taxonomy: established
  children:
  - NJS-0131-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000140
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000129
  limitations:
    paragraphs:
    - zh: 现有入侵报告直接证明 Oldrea 取用 Outlook 地址簿，却没有端点取证证明它读取特定 OAB 文件，也没有对同一事件的目录查询缺席作实测。正式机理是对产品架构与已观察取用的中等置信推断，不能推广为所有邮箱或所有账户发现均避开权威日志。
      en: Incident reporting directly establishes Oldrea’s use of an Outlook address book but provides neither endpoint forensics
        proving a particular OAB-file read nor measurement of absent directory queries in that event. The formal mechanism
        is a medium-confidence inference from architecture and observed use, not a claim that all mail or account discovery
        avoids authority logs.
    - zh: 正常 Outlook 同步、地址簿重建、合法导出及备份会造成相似端点痕迹；对象访问事件需要针对目标路径配置 SACL，应用内接口还可能绕开文件审计。未来若获得同案文件与查询遥测或操作指令，应重校子项置信度与边界。
      en: Normal Outlook sync, address-book rebuilds, authorized exports, and backups create similar endpoint traces. Object-access
        events require SACLs on relevant paths, and in-app interfaces may bypass file auditing. Same-event file and query
        telemetry or operator instructions would justify recalibrating the child’s confidence and boundary.
- id: NJT-0240
  name:
    zh: 进程发现
    en: Process Discovery
  attack_id: T1057
  taxonomy: established
  children:
  - NJS-0240-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000286
      - DET-000287
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000248
  limitations:
    paragraphs:
    - zh: 现场报告证明有进程调查而不提供每次完整输出或查询方案对照。内联子项由官方设计文档与可核验源码支持，未在所列恶意事件中定位到该实现，故不把Volt Typhoon或No Pineapple归为该子项，也不报告其降低告警概率。TrustedSec文章的独立COFFLoader演示与真正内联集成需要区分。
      en: Incident reports establish process surveying without complete per-request output or comparative query implementations.
        The inline child is supported by official design documentation and verifiable source, but that implementation was
        not identified in the listed malicious incidents. Volt Typhoon and No Pineapple therefore are not mapped to the child,
        and no alert-probability reduction is reported. TrustedSec’s standalone COFFLoader demonstration must remain distinct
        from actual inline integration.
    - zh: 进程视图随时间、用户、权限、命名空间及传感器而变，空返回和缺字段可能来自访问拒绝、过滤或竞态。一次枚举不会证明所有对象已取得，也不会使同名进程或重用PID自动成为同一实例。本批没有执行恶意样本或生产环境覆盖测试；查询Trace、结果采集和缓解效应仍需目标环境验证。
      en: Process views vary by time, user, permission, namespace, and sensor. Empty returns or missing fields can result
        from denial, filtering, or races. One enumeration does not establish acquisition of every object or make repeated
        names and reused PIDs the same instance. This delivery did not run malicious samples or test production coverage.
        Query tracing, result capture, and mitigation effects require validation in the target environment.
- id: NJT-0237
  name:
    zh: 密码策略发现
    en: Password Policy Discovery
  attack_id: T1201
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000281
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000245
  limitations:
    paragraphs:
    - zh: ESET 的公开命令清单支持真实对抗性调查，但没有逐命令执行日、完整输出、针对用户的有效策略或当时的告警结果。官方文档说明接口和规则视图，不证明攻击者有意选择某个实现降低观察，也不能证明一次规则查询随后导致了成功猜解。父级机理保持中等置信度，具体调用链、匿名上下文及时间变量尚未达到正式子技术的证据要求。
      en: ESET's public command list supports real adversarial surveying but omits per-command dates, complete output, target-specific
        resultant policies, and contemporaneous alert outcomes. Official documentation establishes interfaces and rule views
        rather than an adversary deliberately selecting an implementation to reduce observation; neither does it show that
        a rule query subsequently enabled successful guessing. The parent mechanism remains medium-confidence, while specific
        call-chain, anonymous-context, and timing variables have not met the evidence gate for formal children.
    - zh: 防御实现具有文档依据，但尚未在 Windows 域、Linux PAM 栈及 AWS 账号内实测字段完整性与误报。返回内容、外部身份规则、有效策略的优先级以及加密 RPC 都可能使视图不完整。新增证据应同时记录查询来源、目标、结果视图和正常对照，分别提高行为、意图与匿迹效果的置信度，而不是从缺日志直接推断成功隐蔽。
      en: Defense implementations have documentary support but have not been deployed to validate field completeness or false
        positives in a Windows domain, Linux PAM stack, or AWS account. Missing response contents, external identity rules,
        resultant-policy precedence, and encrypted RPC can leave views incomplete. New evidence should retain query origin,
        target, result scope, and benign comparators, improving confidence in behavior, intent, and evasion effects separately
        rather than inferring successful concealment from missing logs.
- id: NJT-0182
  name:
    zh: 文件与目录发现
    en: File and Directory Discovery
  attack_id: T1083
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000210
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000192
  limitations:
    paragraphs:
    - zh: 公开案例通常不提供完整命令输出、成功范围、权限失败、对象数量或发现到后继读取的逐文件时间线。Mimic 证明 Everything 查询能力及后继使用，却不证明真实受害环境的索引 query 记录、目录事件减少、规避动机或检测漏报。
      en: Public cases generally lack complete command output, successful scope, permission failure, object counts, or file-by-file
        timelines from discovery to later reads. Mimic establishes Everything query capability and later use, not victim index-query
        logs, reduced directory events, evasion motive, or missed detections.
    - zh: 4663/5145、PowerShell 和 Linux audit 的可用性依赖策略、SACL/rule、版本、保留与事件量，返回名称通常不在日志中。索引、窄范围和时间/来源分散轴需同案 trace 对照后才能提升。
      en: Availability of 4663, 5145, PowerShell, and Linux audit depends on policy, SACL or rule, version, retention, and
        event volume, while returned names are usually absent. Indexed, scoped, and temporal or origin-distributed axes require
        same-case trace comparison before promotion.
- id: NJT-0231
  name:
    zh: 组策略发现
    en: Group Policy Discovery
  attack_id: T1615
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000273
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000240
  limitations:
    paragraphs:
    - zh: 公开恶意活动证据最明确地支持使用合法 gpresult 进行策略调查，不能由命令存在推断完整返回内容、规避动机或检测失效。Microsoft 文档支持能力、协议与审计语义；本研究将这些事实用于分析外观重叠，而没有把平台能力自动升级为已观察攻击或子技术存在证据。
      en: Public adversarial evidence most clearly supports policy surveying through legitimate gpresult, but command presence
        does not establish complete returned contents, evasion motive, or failed detection. Microsoft documents capability,
        protocol, and audit semantics; this research uses those facts to analyze appearance overlap without automatically
        upgrading platform capability to observed attack or child-existence evidence.
    - zh: 缓存、结果策略和域中已配置策略有不同范围与时效。缓存存在不证明任意用户可读或完全离线；结果查询也不保证所有扩展都能提供相同信息。未对真实 Windows 域运行实验，因此所有关联窗口、任务基线和异常优先级都是可实施设计建议，仍需按部署版本、权限和日志负载验证。
      en: Caches, resultant policy, and configured domain policy differ in scope and freshness. Cache existence does not establish
        arbitrary readability or wholly offline operation, and result queries do not guarantee equivalent information from
        every extension. No live Windows-domain experiment was performed, so correlation windows, work baselines, and anomaly
        priorities are implementable design proposals that still require validation against deployed versions, rights, and
        logging workloads.
    - zh: 研究中 v19/v19.1 ATT&CK 网页和 CISA 通告无法读取，固定基线事实取自仓库内 19.1 工作簿机械摘录；当前网页只作交叉检查。事件文档并不保证部署环境已启用读取审计，传感器缺失不能作为行为透明或零痕迹的证据。
      en: The v19/v19.1 ATT&CK pages and CISA advisory could not be retrieved. Fixed-baseline facts come from the repository's
        mechanical extraction of the 19.1 workbook, with the current page used only for cross-checking. Event documentation
        does not guarantee that read auditing is enabled in a deployment, and missing sensors are not evidence of Behavioral
        Transparency or zero traces.
- id: NJT-0139
  name:
    zh: 云基础设施发现
    en: Cloud Infrastructure Discovery
  attack_id: T1580
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000150
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000139
  limitations:
    paragraphs:
    - zh: Expel 的报告没有请求级过滤参数、跨访问键互补任务或攻击者规避指令，也没有逐查询检测率。它对启动停止实例所用 API 的一句描述与 AWS 接口定义存在疑点，本条技术不将那一句提升为已确证状态转换；后继行为只在报告可直接支持的粒度记录。
      en: Expel provides neither request-level filters, complementary tasks across keys, an evasion instruction, nor per-query
        detection rates. One statement about the API used to start a stopped instance is questionable against AWS API semantics,
        so this technique does not elevate it into a verified state transition; successors are recorded only at the granularity
        directly supported by the report.
    - zh: 云文档证明日志类别和接口能力，不证明受害租户已收集所有区域、账户与历史读事件。CSPM、IaC、灾备与安全调查可产生同形资源图，且被盗的批准盘点身份可能保持正常表象；未来同案跨账户查询时间线、state 读取取证和作业台账可改变子项与机理置信度。
      en: Cloud documentation establishes event classes and interface capability, not complete read collection across the
        victim’s Regions, accounts, or history. CSPM, IaC, recovery, and security investigations can produce similar resource
        graphs, and a stolen approved inventory identity may still look routine. Same-case cross-account query timelines,
        state-read forensics, and job records could change child or mechanism confidence.
- id: NJT-0179
  name:
    zh: 容器与资源发现
    en: Container and Resource Discovery
  attack_id: T1613
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000207
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000189
  limitations:
    paragraphs:
    - zh: Hildegard 提供 kubelet 发现与后继活动的直接事件证据，Peirates 只证明工具能力。公开资料没有将同一样本在 kubelet、kube-apiserver 和 Docker 通道中的完整请求、返回范围和告警结果并列，因此不能证明节点局部、限域或分页轴的实际规避效果。
      en: Hildegard supplies direct event evidence for kubelet discovery and later activity, while Peirates establishes tool
        capability only. Public sources do not align one sample’s complete requests, returned scope, and alert outcomes across
        kubelet, kube-apiserver, and Docker channels, so node-local, scoped, or paged axes lack demonstrated evasion effect.
    - zh: Kubernetes audit 的 level、policy、backend 和留存决定可见字段；Docker System Events 不是完整的只读请求日志。合法控制器可能使用广域 list/watch，被盗 ServiceAccount
        也保持正常身份，因此检测阈值和 scope 必须本地回放校准。
      en: Kubernetes audit level, policy, backend, and retention determine visible fields, while Docker System Events are
        not complete read-request logs. Legitimate controllers may use broad list or watch and stolen ServiceAccounts retain
        normal identity, so thresholds and scope require local replay calibration.
- id: NJT-0138
  name:
    zh: 浏览器信息发现
    en: Browser Information Discovery
  attack_id: T1217
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000149
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000138
  limitations:
    paragraphs:
    - zh: 公开资料支持书签和历史被恶意读取，却没有同一端点的文件读、网页代理和同步时间线联结，也没有规避成功率。3CX 样本的 500 条输出上限不能证明按最近时间筛选；BeagleBoyz 通告汇集多案，不能据其单独建立一次离散读取案例。
      en: Public sources support adversarial bookmark and history reads but do not join same-endpoint file, proxy, and sync
        timelines or measure evasion success. The 3CX sample’s 500-entry output limit does not prove recency filtering. The
        BeagleBoyz advisory aggregates incidents and cannot by itself define one discrete read case.
    - zh: Windows 4663 依赖已启用的对象 SACL，浏览器产品路径和正常同步方式也会变化；若只看到后续外传，无法从中还原所有被读取的 URL。历史保留策略会损失用户恢复或标签同步能力，不能把减少历史当作没有代价的全面防护。
      en: Windows 4663 depends on enabled object SACLs, while browser paths and ordinary sync behavior change. Later exfiltration
        alone cannot reconstruct every URL read. History-retention policy can impair user recovery or tab sync and is not
        a cost-free universal protection.
- id: NJT-0132
  name:
    zh: 应用窗口发现
    en: Application Window Discovery
  attack_id: T1010
  taxonomy: established
  children:
  - NJS-0132-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000141
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000130
  limitations:
    paragraphs:
    - zh: Grandoreiro 研究直接证明窗口匹配控制 C2 启动，Attor 研究证明截图选择可使用标题或进程名；两者没有量化检测率，也不证明所有窗口发现都会改变网络或收集痕迹。把条件门控的匿迹收益描述为可关联时段缩短，是基于已观察行为的防守推断。
      en: Grandoreiro directly establishes window-match control of C2 initiation, and Attor establishes screenshot selection
        by title or process name. Neither quantifies detection rates or proves that all window discovery changes network or
        collection traces. The stealth benefit of a shorter correlatable period is a defensive inference from observed behavior.
    - zh: 默认进程与 Sysmon 记录不保证 GUI API 可见，专门传感器也须验证调用者、窗口值和会话的归属。标题可能快速变化或包含敏感信息；合法辅助功能、RPA 和远程协助在相同观察面上形成强反例，部署检测须保留隐私与业务基线。
      en: Default process and Sysmon records do not guarantee GUI API visibility, and a dedicated sensor must validate caller,
        window value, and session attribution. Titles can change quickly or contain sensitive information. Legitimate accessibility,
        RPA, and remote support are strong counterexamples on the same observation surface, requiring privacy controls and
        operational baselines.
- id: NJT-0238
  name:
    zh: 外围设备发现
    en: Peripheral Device Discovery
  attack_id: T1120
  taxonomy: established
  children:
  - NJS-0238-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000282
      - DET-000283
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000246
  limitations:
    paragraphs:
    - zh: 恶意行为证据来自设备监视插件和蠕虫模块的公开逆向，不能代表全部目标、设备种类或平台。Attor 资料中的状态、身份和文件信息须分层归属；Trellix 对监听减少轮询噪声的解释未提供相同配置下的告警率，且其接口类注册与卷广播叙述存在需要按官方合同拆开的细节。不能把
        WM_DEVICECHANGE 的消息值当作 Windows 事件日志 ID。
      en: Adversarial evidence comes from public reverse engineering of a device-monitor plug-in and a worm module, not all
        targets, device types, or platforms. Attor's state, identity, and file information requires separate attribution.
        Trellix's explanation of reduced polling noise has no matched alert-rate comparison, and its interface-registration
        and volume-broadcast details require separation using official contracts. The WM_DEVICECHANGE message value is not
        a Windows Event Log ID.
    - zh: 官方文档证明接口和字段而非敌对动机，通知监听在正常应用中也很常见。提出的专用调用追踪和 Linux 审计尚未部署验证，进程日志不保留全部结果，macOS 的专用分析仍待传感器合同核验。当前中等置信度的匿迹结论应随同源订阅—反馈—结果记录、正常基线和检测对照而调整；没有通知或设备事件并不能排除持续监视。
      en: Official documentation establishes interfaces and fields rather than hostile intent, and notification listeners
        are common in ordinary applications. Proposed dedicated call tracing and Linux audit have not been deployment-validated,
        process logs lack complete results, and a macOS-specific analytic awaits sensor-contract verification. The medium-confidence
        stealth conclusions should change with same-context subscription, feedback, and result records, legitimate baselines,
        and detection comparisons. Absent notification or device events do not exclude ongoing monitoring.
- id: NJT-0239
  name:
    zh: 权限组发现
    en: Permission Groups Discovery
  attack_id: T1069
  taxonomy: established
  children:
  - NJS-0239-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000284
      - DET-000285
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000247
      - MIT-000240
  limitations:
    paragraphs:
    - zh: ComRAT 的组命令是实际恶意父行为证据，未公开完整输出、每次查询权限或对具体后继访问的因果链。策略替代有作者明确的匿迹能力说明及接口路径对照，但没有本轮可验证的恶意现场采用案例和测量结果；因此该子项及观察面推论保持中等置信，不能借用
        ComRAT 的归因或总体规避动机提高其等级。
      en: ComRAT group commands are evidence of actual malicious parent behavior without published complete outputs, per-query
        rights, or a causal chain to particular subsequent access. Policy substitution has an explicit author-described stealth
        capability and interface-path comparison, but this review has no verified malicious field-use case or measurements.
        The child and observation-plane inference therefore remain medium-confidence and must not inherit ComRAT attribution
        or general evasion intent to increase their strength.
    - zh: 组配置、嵌套结果、动态成员、令牌组状态与资源授权有不同时间和执行边界；任何单一视图都可能遗漏关系或错误暗示已生效。检测窗口和基线是工程建议，尚未在实际 Windows 域、Graph 租户或 AWS 账户验证。审计文档只说明配置后可得的事件语义，不能证明部署已收齐全部读取，缺少事件也不能证明已发生路径替代。
      en: Group configuration, nested results, dynamic membership, token group state, and resource authorization have different
        temporal and execution boundaries; a single view can omit relationships or wrongly suggest applied state. Analytic
        windows and baselines are engineering proposals not validated in a live Windows domain, Graph tenant, or AWS account.
        Audit documentation describes event semantics when configured rather than complete deployed read coverage, and missing
        events do not establish path substitution.
- id: NJT-0236
  name:
    zh: 网络流量被动测绘
    en: Passive Network-Traffic Mapping
  attack_id: T1040
  taxonomy: established
  children:
  - NJS-0236-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000279
      - DET-000280
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000186
  limitations:
    paragraphs:
    - zh: 公开资料支持被动测绘能力与相应观察差异，但本批没有找到可确认某个受害者环境事实从嗅探返回的合格案例。DarkVishnya 报告将环境调查归于主动扫描，将嗅探对象写为登录数据；VPNFilter 报告的逆向分析支持嗅探和协议识别能力而非特定受害者资产结果，CISA
        通告的原生 PCAP 重点是认证流。这些来源不能互相拼接成一次环境信息获取事务。
      en: Public sources support passive-mapping capability and corresponding observation differences, but this batch found
        no qualifying case confirming environmental facts returned through sniffing from a specific victim. DarkVishnya assigns
        environmental surveying to active scanning and describes sniffing login data. VPNFilter reverse engineering supports
        sniffing and protocol-recognition capability rather than a victim-specific asset result, while the CISA native-PCAP
        discussion focuses on authentication flows. These sources cannot be joined into one environmental-acquisition transaction.
    - zh: 尚未开展真实主机、网络设备或云环境实验。检测窗口、审批模型、结果溯源字段和调优是实施设计，需验证部署版本和保留能力；镜像资源、计数增长或 PCAP 存在均不证明攻击者已解释内容。被动知识有时间和位置偏差，加密也不能保证隐藏全部网络事实。名称补全子项有明确能力和匿迹用途证据，仍缺实际恶意采用、相对事务数量和结果返回测量。
      en: No live host, network-device, or cloud experiment was conducted. Windows, approval models, result-provenance fields,
        and tuning are implementation designs requiring deployed-version and retention validation; mirror resources, increasing
        counters, or PCAP existence do not establish adversary interpretation. Passive knowledge is time- and location-biased,
        and encryption does not hide every network fact. The name-enrichment child has explicit capability and stealth-purpose
        support but lacks malicious field adoption, relative transaction counts, and fact-return measurements.
- id: NJT-0140
  name:
    zh: 云服务发现
    en: Cloud Service Discovery
  attack_id: T1526
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000151
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000140
  limitations:
    paragraphs:
    - zh: Storm-0501 的防护状态测绘和后续删除尝试是直接事件事实，但报告没有逐次读取请求或审计缺口，因此不能把 GCP ListServices 或 Azure Activity Log 的通道性质归给该案。官方无日志方法证明观察能力差，却不证明攻击者主观规避动机或检测成功率；假设机理需要未来在野调用记录或受控攻防对照提升置信度。
      en: Storm-0501’s protective-state mapping and later deletion attempts are direct incident facts, but the report has
        no per-read request or audit-gap record, so GCP ListServices or Azure Activity Log channel behavior cannot be attributed
        to that case. An officially unlogged method proves an observation difference, not adversarial motive or detection
        efficacy. The hypothesized mechanism needs future in-the-wild calls or controlled adversarial comparisons for stronger
        confidence.
    - zh: AWS GuardDuty 分析仅覆盖实际启用 CloudTrail 管理事件的账户和区域；ListDetectors 返回 ID 并不证明功能状态，GetDetector 的完整响应也不保证在日志中可得。GCP 的方法性无日志不能通过简单开启
        Data Access 补救；没有受控管理端点的代理或会话遥测时，对该分支必须公开承认检测盲区。
      en: The AWS GuardDuty analytic covers only accounts and Regions where management events are retained. ListDetectors
        IDs do not establish feature state, and GetDetector’s full response is not guaranteed in logs. GCP’s method-level
        absence cannot be repaired by simply enabling Data Access. Without validated proxy or session telemetry on managed
        administration endpoints, that branch remains an explicit detection blind spot.
- id: NJT-0233
  name:
    zh: 日志枚举
    en: Log Enumeration
  attack_id: T1654
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000275
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000242
  limitations:
    paragraphs:
    - zh: 公开报告能够证明选定日志调查与反馈目的，但未提供各查询的完整输出、统一的查询到决策时间线或匿迹效果的对照测量。No Pineapple 的导出命令不能证明全部匹配记录已经取得，ComRAT 的安全日志外传不能证明每次结果都触发行动调整，GUI-vil
        的调查结论也不能泛化为所有 CloudTrail 查询均为规避。正常响应者可出现相同读取模式。
      en: Public reports establish selected log investigation and feedback purposes without complete query outputs, a unified
        query-to-decision timeline, or comparative stealth measurements. The No Pineapple export command does not establish
        recovery of every matching record, ComRAT's security-log exfiltration does not establish adaptation after every result,
        and GUI-vil's investigative conclusion does not make every CloudTrail query evasive. Legitimate responders can produce
        the same read patterns.
    - zh: 本轮实现设计重点覆盖 Windows 命令调查、AWS 历史查询和 Azure 已验证用户检索入口，并不声称覆盖每一种 ESXi、Linux、macOS 或 SIEM 实现。查询审计启用前的活动、服务间检索、直接文件读取及被注入进程可能缺失；返回行数、文件大小和
        API 成功也不等于完整记录集。所有关联窗口和任务基线都是部署建议，尚未经真实环境验证。
      en: The implementation designs focus on Windows utility investigation, AWS history lookups, and validated Azure user-query
        entry paths, without claiming every ESXi, Linux, macOS, or SIEM implementation. Activity before query auditing, service-to-service
        queries, direct file reads, and injected processes can be absent. Returned-row count, file size, and API success do
        not establish a complete record set. Correlation windows and task baselines are deployment proposals that have not
        been validated in a production environment.
- id: NJT-0234
  name:
    zh: 网络服务发现
    en: Network Service Discovery
  attack_id: T1046
  taxonomy: established
  children:
  - NJS-0234-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000276
      - DET-000277
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000243
  limitations:
    paragraphs:
    - zh: Bradley 提供入侵中使用服务浏览命令及其查找目标的一手记录，但未提供完整查询输出、每个解析端点、监听验证、检测漏失率或明确规避指令；不能把报告的无端口扫描解释为整个入侵从未执行其他扫描。Hildegard 说明内部搜索与后继容器操作，不证明使用了公告替代或特定低速、分布式策略。
      en: Bradley provides firsthand reporting of a browse command and its intended discovery target, not complete query output,
        every resolved endpoint, listener validation, detection miss rates, or an explicit evasion instruction. The reported
        absence of port scanning in that operation cannot establish that the entire intrusion involved no other scans. Hildegard
        establishes internal search and subsequent container operations, not advertisement substitution or a particular slow
        or distributed strategy.
    - zh: 服务公告和端口结果都可能过期、被伪造或受到观察点限制。本文检测阈值与窗口是部署起点，没有真实网络上的准确率验证；对子网、IPv6、mDNS 网关和进程归因的覆盖必须实测。新的同案输出、完整监听流与防守事件对照，可能改变子项置信度或进一步拆分管理查询与存量视图路径。
      en: Advertisements and port observations can be stale, spoofed, or limited by vantage point. Detection thresholds and
        windows are deployment starting points without real-network accuracy validation. Subnet, IPv6, mDNS-gateway, and process-attribution
        coverage must be tested. Same-case outputs, complete listener flows, and defensive-event comparisons could change
        child confidence or justify later separation of management queries and stored views.
- id: NJT-0241
  name:
    zh: 注册表查询
    en: Query Registry
  attack_id: T1012
  taxonomy: established
  children:
  - NJS-0241-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000288
      - DET-000289
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000249
  limitations:
    paragraphs:
    - zh: 现场报告公开了工具使用和调查背景，未公开逐查询路径、返回值或检测对照；InvisiMole 命令表只证明逆向确认的能力。进程内子项依赖明确的开发者合同和 Registry 查询能力，保持中等置信度，不等同于现场采用率或实测匿迹效果。判断个案时仍须证明该读取用于环境知识，并排除读取自身载荷配置、合法初始化和相邻的信息对象。
      en: Field reporting provides utility use and investigative context without per-query paths, returned values, or detection
        comparisons. InvisiMole's command table establishes a reverse-engineered capability. The in-process child relies on
        an explicit developer contract and Registry-query capability, with medium confidence rather than an asserted field
        prevalence or measured evasion effect. A case still requires proof of environmental purpose and exclusion of payload-configuration
        consumption, legitimate initialization, and adjacent information objects.
    - zh: 查询视图、权限、虚拟化与副本时点会改变结果；4663 不保存返回内容，4656 不证明实际使用权限。本文的防御是可实施设计，尚未在本研究工作区对 Windows 版本、SACL 与专用跟踪进行实测。缺失事件只能形成覆盖不明，不能作为攻击未发生或已隐身的证明；任何上线阈值和保留窗口仍需本地验证。
      en: Query view, rights, virtualization, and snapshot time can change results. Event 4663 does not preserve returned
        content, and 4656 does not establish exercised rights. The defenses are implementable designs without Windows-version,
        SACL, or dedicated-tracing experiments in this research workspace. Missing events leave coverage uncertain rather
        than proving absence or successful concealment. Deployment thresholds and retention windows require local validation.
- id: NJT-0245
  name:
    zh: 系统位置发现
    en: System Location Discovery
  attack_id: T1614
  taxonomy: established
  children:
  - NJS-0245-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000295
      - DET-000296
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000252
      - MIT-000162
  limitations:
    paragraphs:
    - zh: 本地设置与地理位置只有间接联系，可能被用户修改或由镜像、远程会话及进程环境继承。输入读取和报告中的国家意图不能证明主机物理位置。外部服务可能返回错误、陈旧记录或代理出口；资料没有给出本研究场景的准确率、漏检率或误报率，不能引用服务商一般营销数字替代验证。
      en: Local settings relate only indirectly to geographical position and can be modified by users or inherited from images,
        remote sessions, and process environments. Reading inputs and a report's description of country intent do not establish
        physical host location. External services can return errors, stale records, or proxy egress. Sources provide no accuracy,
        miss-rate, or false-positive measurements for this research scenario, and general service marketing figures cannot
        substitute for validation.
    - zh: 恶意采用证据集中于特定样本与控制面板版本；不能推及所有 Cuckoo、CrimsonRAT 或所有定位接口。本次没有运行样本、搭建控制端或部署函数采集，检测合同是可实施设计，仍需按版本、权限、缓存、空返回和采集故障进行实测。没有远端可见性时，企业侧对卸载子项只有间接线索。
      en: Evidence of malicious use concerns particular samples and controller versions and does not generalize to every Cuckoo
        or CrimsonRAT variant or every location interface. This research did not execute samples, operate a controller, or
        deploy function collection. The analytics are implementable designs requiring validation for version, permission,
        cache, empty-return, and collector-failure conditions. Without remote visibility, enterprise observations provide
        only indirect leads for the offloading child.
- id: NJT-0242
  name:
    zh: 远程系统发现
    en: Remote System Discovery
  attack_id: T1018
  taxonomy: established
  children:
  - NJS-0242-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000290
      - DET-000291
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000250
  limitations:
    paragraphs:
    - zh: Kinsing 与 HermeticWizard 的原始分析分别支持特定资料提取和已知地址收集阶段，不能代表所有变种，也不能把报告中混合使用的全部接口解释为本地只读。记录和目录中的名称可能过期、为别名、缺乏当前解析或不对应可达的独立主机；空表、无效项和哈希名称进一步限制结果。后续认证、服务接触或传播不能补证初始清单完整性。
      en: The original Kinsing and HermeticWizard analyses support particular material-extraction and known-address stages,
        not every variant or an interpretation of every listed interface as a local read. Recorded and directory names can
        be stale aliases, lack current resolution, or fail to identify a reachable distinct host; empty tables, invalid entries,
        and hashed names further constrain results. Later authentication, service contact, or propagation cannot establish
        completeness of the initial inventory.
    - zh: 匿迹结论来自本地读取与新增目标交互之间的观察差异，尚无针对具体检测器的漏检率实验。现有检测分别覆盖 Windows 显式命令和经配置的 Linux 文件访问；直接内存缓存 API、未记录的应用内查询以及未启用的审计仍是盲区。官方接口与事件文档支持能力和字段合同，实际部署需要验证采集、身份映射、时钟和正常用途基线，不能由机器校验通过推断检测已经在真实环境生效。
      en: The stealth conclusion follows from the observation difference between local reads and fresh target interaction,
        without measured miss rates against a particular detector. The provided analytics cover explicit Windows commands
        and configured Linux file access. Direct in-memory cache APIs, unrecorded in-application queries, and disabled auditing
        remain blind spots. Official APIs and event documentation support capabilities and field contracts; deployment must
        validate collection, identity mapping, clocks, and normal-purpose baselines rather than infer operational detection
        from machine validation.
- id: NJT-0247
  name:
    zh: 系统网络连接发现
    en: System Network Connections Discovery
  attack_id: T1049
  taxonomy: established
  children:
  - NJS-0247-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000298
      - DET-000299
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000253
  limitations:
    paragraphs:
    - zh: 联合公告公开了具体 netstat 请求而没有逐行输出，LunarWeb 仅公开恢复命令包的连接调查类别。Mafalda 原始逆向较明确地说明进程内命令能力和结果组织，但没有给出每台受害主机上命令 63 的动态调用证据、完整缓冲区、检测率或执行器对照。本技术因此区分恶意活动、样本能力和匿迹推断，不用总体隐蔽性评价替代本查询的量化证据。
      en: The joint advisory publishes a particular netstat request without row-level output, and LunarWeb reporting identifies
        connection inquiries only as a category in a recovered command package. Original Mafalda reversing more specifically
        establishes in-process command capability and result packaging, but supplies no per-victim dynamic command-63 invocation,
        complete buffer, detection rate, or executor comparison. The technique therefore distinguishes malicious activity,
        sample capability, and stealth inference rather than substituting overall stealth assessments for query-specific measurements.
    - zh: 防御实现的主要可部署部分是显式命令的执行上下文关联，进程内分析依赖单独部署和验证的调用级采集合同。现有证据没有证明默认 EDR 捕获连接表返回，也没有为 macOS、ESXi、云管理面或所有设备 CLI 给出同等实案与字段覆盖。表视图、丢失与截断、动态状态和批准身份被盗都限制结论；未来需要带返回状态、载体、结果完整性与观察面配置的受控对照来提高置信度。
      en: The main directly deployable defensive component is execution-context correlation for explicit commands. In-process
        analysis depends on a separately deployed and validated call-collection contract. The evidence does not establish
        default EDR capture of returned connection tables or equivalent incident and field coverage for macOS, ESXi, cloud
        management, or every appliance CLI. Views, loss and truncation, changing state, and stolen approved identities constrain
        conclusions. Controlled comparisons retaining return status, carrier, result integrity, and observation configuration
        are needed to increase confidence.
- id: NJT-0246
  name:
    zh: 系统网络配置发现
    en: System Network Configuration Discovery
  attack_id: T1016
  taxonomy: established
  children:
  - NJS-0246-001
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000297
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000253
  limitations:
    paragraphs:
    - zh: 原始报告确认配置调查或样本能力，却未给出逐主机网络配置输出、查询顺序、成功率或专属规避实验。LunarWeb 的恢复命令包不能补出每项命令都成功返回，Emotet 的无线硬件依赖也不能推定为有意反沙箱。特征伪装为多源事实支持的推断，置信度保持中等。
      en: Original reports establish configuration surveys or sample capability without per-host configuration output, query
        order, success rates, or dedicated evasion experiments. LunarWeb's recovered package does not establish successful
        returns from every command, and Emotet's dependency on wireless hardware does not imply deliberate anti-sandboxing.
        Feature Disguise remains a medium-confidence inference supported by several source facts.
    - zh: 配置和测试结果受观察时点、权限、接口状态、NAT、代理、命名空间与远程会话位置限制。不同适配器 API 具有不同地址族和返回范围，DNS 成功也可能来自缓存而非外部通信，配置返回不能单独认定明文 secret。唯一正式子项建议来自命令能力而非逐受害返回，其他采集轴和跨平台完整观测仍待补证据。
      en: Configuration and test results depend on time, authority, interface state, NAT, proxies, namespaces, and remote-session
        location. Adapter APIs have distinct family and return scope. DNS success can come from cache rather than external
        communication, and configuration returns do not establish plaintext secrets. The sole proposed child follows command
        capability rather than per-victim returns; other acquisition axes and complete cross-platform observation need further
        evidence.
    - zh: 所提分析中的批准台账、身份历史、进程生存期和自定义 API 结果采集都是需要实际部署的数据合同。缺失字段只能降低结论层级，不能用当前资产状态、provider PID 或静态导入追填。解释器入口治理只缩小受治理路径的滥用面，不能让基础网络配置对全部已获准代码不可见。
      en: The proposed analytics' approval register, identity history, process lifetimes, and custom API results are deployment
        contracts. Missing fields only lower the conclusion level and cannot be backfilled from current inventory, provider
        PIDs, or static imports. Interpreter-entry governance reduces abuse of governed paths rather than hiding basic configuration
        from every authorized program.
- id: NJT-0181
  name:
    zh: 身份信任拓扑发现
    en: Identity Trust-Topology Discovery
  attack_id: T1482
  taxonomy: deferred
  children: []
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000209
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000191
  limitations:
    paragraphs:
    - zh: 公开案例证明攻击者查询域/林信任，但没有把命令、目录请求、返回边、缓存命中、告警结果和后继路径完整联结。跨租户分支只有权限、接口和日志能力，没有第一方恶意 partner-policy 读取案例。
      en: Public cases prove adversarial domain or forest trust queries without joining commands, directory requests, returned
        edges, cache hits, alert outcomes, and later paths. The cross-tenant branch has authorization, interface, and logging
        capability but no firsthand malicious partner-policy read case.
    - zh: IdentityQueryEvents 与 Graph activity 的可用性取决于许可、诊断设置和保留；缓存、限域、低速与多源轴均没有同案痕迹对照或可重复测量。阈值和窗口只能作为本地工程起点。
      en: Availability of IdentityQueryEvents and Graph activity depends on licensing, diagnostics, and retention. Cache,
        scope, low-rate, and distributed axes lack same-case trace comparisons or repeatable measurements. Thresholds and
        windows are local engineering starting points only.
- id: NJT-0106
  name:
    zh: 调试器规避
    en: Debugger Evasion
  attack_id: T1622
  taxonomy: established
  children:
  - NJS-0106-001
  - NJS-0106-002
  defense:
    detections:
      coverage: available
      strategy_refs:
      - DET-000103
      - DET-000122
    mitigations:
      coverage: available
      mitigation_refs:
      - MIT-000105
  limitations:
    paragraphs:
    - zh: Microsoft 文档证明调试状态查询可驱动行为变化，P2PInfect 案例直接记录 TracerPid 检查后在 strace 条件下退出，因此 NJS-0106-001 为高置信。实证仍集中于 Windows 和 Linux
        样本，且很多合法反篡改、反作弊与 DRM 产品也会读取同类状态；没有调试开关与后续结果差分时，不得由 API 调用推断恶意目的。
      en: Microsoft documentation establishes that debugger-state queries can drive behavior change, and the P2PInfect case
        directly records exit under strace after a TracerPid check, giving NJS-0106-001 high confidence. Evidence remains
        concentrated on Windows and Linux samples, and legitimate anti-tamper, anti-cheat, and DRM products read similar state.
        Malicious purpose must not be inferred from an API call without debugger-on/off successor-outcome differential.
    - zh: Dridex 案例直接证明约两亿次 OutputDebugStringW 循环会淹没调试日志，因此 NJS-0106-002 为高置信。但事件密度的影响取决于调试器、日志管线、存储、采样和分析预算；若通道能在限速时保留计数、丢失和核心状态转折，匿迹效果会降低。
      en: The Dridex case directly establishes that a loop of roughly 200 million OutputDebugStringW calls can overwhelm the
        debug log, giving NJS-0106-002 high confidence. The impact of event density depends on debugger, logging pipeline,
        storage, sampling, and analyst budget. If rate limiting preserves counts, loss, and core state transitions, the stealth
        effect falls.
