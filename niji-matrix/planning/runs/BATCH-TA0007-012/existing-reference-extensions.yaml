- id: REF-001368
  locator: Interceptor.attach onEnter/onLeave, retained arguments and raw retval; typed NativePointer reads; Process and Module
    maps; Stalker follow/transform and architecture-specific callouts requiring explicit validation.
  notes_zh: 补充身份、服务、时间和环境判断实验的自定义采集可行性定位；线程、任务、句柄、ABI、比较语义和后继映射均需独立实现及验收，普通安装或默认EDR不自动提供这些事件。
  notes_en: Adds feasibility locators for custom identity, service, time, and environment-condition experiments. Thread, task,
    handle, ABI, comparison, and successor mapping each require implementation and acceptance; ordinary installation or default
    EDR does not automatically supply those events.
