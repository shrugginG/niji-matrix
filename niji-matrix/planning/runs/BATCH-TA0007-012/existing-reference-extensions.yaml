extensions:
- id: REF-001305
  locator: Same commit fd96c4dcd88fd00eea902bebb20d0736e48f5f61; SA/SA.cna L674-682 whoami dispatch and explicit cmd.exe contrast;
    src/SA/whoami/entry.c L24-38, L41-90, L94-132, L320-334; preserve tasklist and shared WMI locators. Same pinned commit;
    SA/SA.cna L984-1016; src/SA/sc_query/entry.c L12-15, L41-77, L80-165, L168-203, L206-240.
  notes_zh: 同一固定出版物的身份读取证据，扩定位而不另建别名REF。TokenUser来自OpenProcessToken(GetCurrentProcess)，名称来自GetUserNameExA，模拟时不保证一致；代码能力不证明野外采用。
    同版本sc_query入口显式beacon_inline_execute并调用go；枚举SERVICE_WIN32/STATE_ALL或读取指定服务，随后组织返回。源码是静态能力，未执行，枚举不循环续页且状态文字表未覆盖PAUSED索引，不能保证健壮完整输出。保留原tasklist和本批whoami定位及限制。
  notes_en: Identity-reading evidence from the same pinned publication extends locators without a duplicate alias REF. TokenUser
    comes from OpenProcessToken(GetCurrentProcess), while the name comes from GetUserNameExA and can differ under impersonation.
    Code capability does not establish field adoption. The same-version sc_query entry explicitly invokes beacon_inline_execute
    and go, enumerates SERVICE_WIN32/STATE_ALL or reads one service, then formats returns. This is unexecuted static capability;
    enumeration lacks continuation looping and the status-text table omits the PAUSED index, so robust complete output is
    not guaranteed. Preserve original tasklist and this batch's whoami locators and limits.
  title_zh: TrustedSec态势感知BOF固定版本源码
  title_en: TrustedSec Situational-Awareness BOF Pinned Source
- id: REF-001341
  locator: Same AA23-144A authoritative IC3 PDF version 1.1; printed p11 whoami in environment enumeration; printed p13 remote
    wmic cmd /c whoami; pp1-3 native-tool ambiguity; preserve prior system-attribute and logging locators.
  notes_zh: 同一公告具体记录本地与远端whoami命令采用，不公开该命令返回、真实操作者或身份读取专属逃逸率。
  notes_en: The same advisory records local and remote whoami adoption without public command returns, actual human operators,
    or identity-inquiry-specific evasion rates.
- id: REF-000639
  locator: Recovered LunarWeb reconnaissance package, command type 1; user information alongside distinct Kerberos sessions
    and local groups; preserve prior collection, software, network, and exfiltration locators.
  notes_zh: 用户信息请求是命令包中单独的中心事实，不证明具体getter、输出值或查询日期；同文其他发现事实不自动成为同一CASE。
  notes_en: The user-information request is a separate central fact in the command package without an exact getter, return
    value, or query date. Other discovery facts in the publication do not automatically form the same CASE.
