child:
  key: B015-T1040-NJS-NO-ACTIVE-ENRICHMENT
  name:
    zh: 主动名称补全抑制
    en: Active Name-Enrichment Suppression
  summary:
    zh: 在被动报文观察和解释中主动禁用外部名称补全，保留包中可得事实，并减少观察器为所见地址派生的解析事务。
    en: Deliberately disable external name enrichment while observing and interpreting packets, preserving packet-derived facts while reducing resolution transactions generated by the observer for encountered addresses.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 主动名称补全抑制是攻击者在已建立的被动报文观察关系中，关闭解释所见地址时本可发起的外部名称解析，以数字端点和报文本身携带的信息继续形成环境事实的行为。稳定变量是观察器是否主动补全名称，不是是否具有网卡权限、是否使用镜像，或结果文件是否采用某个格式。它控制的是采集与解释过程中另行产生的查询，而不改变已被观察的原始业务通信。
      en: Active Name-Enrichment Suppression deliberately disables external resolution that could otherwise occur when interpreting addresses within an established passive packet-observation relationship. Numeric endpoints and information already carried by packets remain available for environmental mapping. The stable variable is active name enrichment by the observer, rather than capture authority, mirroring, or an output format. It controls supplementary queries generated during acquisition and interpretation without changing the original business communications being observed.
    - zh: NIST 明确把关闭域名查找与隐蔽嗅探联系起来。tcpdump 4.99.5 的 -n 提供禁止地址和端口名称转换的具体控制，而 -N 仅缩短主机域名的打印形式；端口名称转换可能只查本地表，不能把每次转换都当作 DNS。该实现支持可有意选择的能力，但不证明某个攻击者实际使用或因此逃过告警。数值显示本身也不足以证明主动解析曾被抑制。
      en: NIST explicitly connects disabling domain-name lookup with stealthy sniffing. The pinned tcpdump 4.99.5 manual provides concrete control through -n, which disables address and port-name conversion, while -N only shortens printed host-domain qualification. Port-name conversion can use a local table and must not be equated with DNS. This establishes an intentionally selectable capability without proving adoption or alert evasion by a particular adversary. Numeric presentation alone likewise does not establish suppressed active resolution.
  stealth_characteristics:
    paragraphs:
    - zh: 主动名称补全抑制可移除观察器因解释许多所见地址而发起的外部解析边，使只看 DNS 或反向查询的防守方难以将旁听主体同其关注端点连接。原始报文、数字地址、端口、时序和通信关系仍可保留，报文内已经携带的名称也不会消失。变化发生在辅助解释步骤，因而不同于父级仅仅避免逐台主动探测的被动观察关系。
      en: Active Name-Enrichment Suppression can remove external resolution edges generated as the observer interprets encountered addresses, weakening DNS-only reconstruction of the listener and its endpoints of interest. Packets, numeric addresses, ports, timing, and communication relationships can remain, as can names already carried within packets. The change concerns auxiliary interpretation and differs from the parent's passive-observation relationship that avoids querying each target.
    - zh: 只有默认解释路径确会访问外部解析时，关闭补全才会减少相应网络事务。缓存、hosts 静态映射和原本不解析的实现可能使两种配置均不产生查询；命名过滤器的预先解析、其他进程和后台 DNS 也可能继续存在。捕获进程、有效选项、权限、接口、结果和去向仍是可观察痕迹，不能把该能力描述为整机零 DNS 或天然不可检测。
      en: Network transactions decrease only where the ordinary interpretation path would actually consult external resolution. Caches, static hosts mappings, and implementations that never enrich names can leave both configurations query-free. Upfront resolution of named filters, other processes, and background DNS can also persist. Capture processes, effective options, authority, interfaces, results, and destinations remain observable; the capability does not mean zero DNS from the host or inherent undetectability.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入需要同时说明真实捕获或独立观察关系、具有主动补全语义的解释阶段，以及关闭该阶段的设置或等效实现。tcpdump 仅写原始报文而不解析打印时，即使带 -n 也不能据此证明抑制了原本会执行的补全。单独查看已有文件、显示数字、使用 -N 缩短域名、解析失败或缺少 DNS 事件均不单独成立；离线处理只有在已独立证明其属于本次观察与测绘链时才可评价。
      en: Inclusion requires an established capture or independent observation relationship, an interpretation stage capable of active enrichment, and a setting or equivalent implementation disabling that stage. With tcpdump saving raw packets without parsed printing, -n alone does not establish suppression of enrichment that would otherwise run. A standalone file read, numeric display, -N domain shortening, failed resolution, or missing DNS events is insufficient. Offline processing is assessed only when independently linked to the qualifying observation and mapping chain.
    - zh: 主动询问服务公告属于网络服务发现，其正常响应不因被接收就成为旁听；报文中其他客户端已经产生的 DNS 或服务名称仍可作为被动事实。正常诊断常为性能、可复现性或避免解析干扰而禁用名称补全，所以该设置不是恶意判据。是否属于敌对活动需要独立的主体控制、批准范围或入侵上下文，不能从一个选项反推意图。
      en: Active service-advertisement queries belong to Network Service Discovery, and receiving their normal replies does not create a listening relationship. DNS or service names already emitted by other clients can remain passive facts. Authorized diagnostics commonly disable enrichment for performance, reproducibility, or to avoid resolution interference, so the setting is not a maliciousness verdict. Hostile activity requires independent principal-control, authorization-scope, or intrusion evidence rather than intent inferred from one option.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在已有流量观察位置上，操作者可以先按数字地址和实际通信关系整理候选，再决定是否在其他位置进一步查询名称。该选择适合不希望采集器因解释所见地址额外接触解析设施、且能够接受名称信息不完整的环境。现有证据直接支持这种可实施设计与匿迹用途，尚不支持某个受害网络中已完成的恶意使用案例。
        en: At an existing traffic-observation position, an operator can first organize candidates through numeric addresses and actual communication relationships and decide separately whether to enrich names elsewhere. This suits situations where the collector should not make supplementary contacts with resolution infrastructure and incomplete names are acceptable. Current evidence supports the implementable design and stealth purpose, rather than a completed malicious-use case in a particular victim network.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要有权且实际能够接收相关报文，能够控制解释程序的有效补全设置，并取得至少相应的数字事实。普通进程启动或抓包权限不能替代真实流量可见性；仅有 -n 也不能证明程序进入了解析阶段。关闭补全通常牺牲通过外部反向解析取得的名称，但不会自动删除报文内名称，也不保证后续另一进程不会再次解析。
          en: The adversary needs both authority and actual visibility for relevant packets, control of the interpreter's effective enrichment settings, and access to at least the corresponding numeric facts. Process creation or capture authority does not establish traffic visibility, and -n does not establish entry into parsed interpretation. Suppression generally sacrifices externally resolved names without deleting packet-carried names or preventing later resolution by another process.
      defender_model:
        paragraphs:
        - zh: 防守方需要把捕获会话同实际工具版本、完整且区分大小写的参数、有效解析设置、输入输出模式和有限的结果溯源连接。普通执行审计提供参数，不默认记录运行配置、包正文或结果；自定义采集器需要单独验证。按进程归属的解析遥测可作一致性检查，但不能以没有 DNS 来代替这些正面证据，也不能把抓包文件里的 DNS 流量当作采集器主动发出的查询。
          en: Defenders must connect capture sessions with the actual tool version, complete case-sensitive arguments, effective enrichment settings, input and output mode, and bounded result provenance. Ordinary execution auditing supplies arguments rather than runtime configuration, packet contents, or results, and custom collectors require separate validation. Process-attributed resolution can corroborate consistency, but absent DNS cannot replace positive evidence, and DNS packets inside a capture are not necessarily queries generated by the collector.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 抑制观察器派生名称查询以减少解析日志中的测绘关联边
      en: Suppress observer-generated name queries to remove mapping edges from resolution logs
    analysis:
      paragraphs:
      - zh: 攻击者关闭解释已捕获地址时的主动名称补全，在本会调用外部解析的路径上减少采集器自身发出的查询。只依据这些解析事务推断调查主体和关注端点的规则因此失去关联输入，需要补充采集器配置、捕获范围和结果证据。NIST 的明确匿迹说明与固定版本选项规范共同支持这一有条件因果关系；未证明现场采用、每地址减少一条查询或具体漏报比例，故保持中等置信度。
        en: Disabling active enrichment reduces collector-generated queries on interpretation paths that would otherwise consult external resolution. Rules inferring the survey actor and endpoints of interest from those transactions lose an input and need collector configuration, capture scope, and result evidence. NIST's explicit stealth rationale and the pinned option specification jointly support this conditional causal chain. Field adoption, one fewer query per address, and particular miss rates remain unproven, so confidence is medium.
    evidence_keys: [B015-T1040-REF-NIST115, B015-T1040-REF-TCPDUMP4995]
    confidence: medium
  defense:
    strategy_keys: [B015-T1040-DET-ENRICHMENT-STATE]
    mitigation_keys: [MIT-000186]
  evidence:
    claim_keys: [B015-T1040-CLM-NAME-SUPPRESSION, B015-T1040-CLM-NAME-SUPPRESSION-EVIDENCE]
    case_keys: []
    reference_keys: [B015-T1040-REF-NIST115, B015-T1040-REF-TCPDUMP4995, REF-000796, REF-000840, B015-T1680-REF-AUSEARCH]
  research:
    limitations:
      paragraphs:
      - zh: 本子项由权威评估指南与工具能力规范支持，没有合格恶意现场案例、实际解析事务对照或测绘结果返回测量。NIST 的评估语境不能被改写为特定攻击者已经采用；固定 tcpdump 版本的选项也不能直接推广到所有采集器。后续证据应分别证明有效设置、实际观察、结果与相对解析行为。
        en: This child is supported by an authoritative assessment guide and tool capability specification without a qualifying malicious field case, measured resolution comparison, or mapping-result return. NIST's assessment context must not be rewritten as adoption by a particular adversary, and one pinned tcpdump version cannot establish every collector's option semantics. Further evidence must separately establish effective settings, actual observation, results, and relative resolution behavior.
      - zh: 保存原始包、离线打印、解析器缓存、静态名称和命名过滤器会使相同参数产生不同网络行为。批准采集器本来就常用数字输出；禁止该选项或强制开启 DNS 不构成可靠缓解。现有检测设计还需在目标版本验证参数解析、日志字段和结果关联，不能以 DNS 缺席计算成功匿迹。
        en: Raw saving, offline printing, resolver caches, static names, and named filters can give the same arguments different network effects. Approved collectors commonly use numeric output, and banning the option or forcing DNS is not a reliable mitigation. The analytic design still needs target-version validation of argument parsing, fields, and result joins; absent DNS cannot quantify successful stealth.
claims:
- key: B015-T1040-CLM-NAME-SUPPRESSION
  claim_type: subtechnique-existence
  statement_zh: NIST 明确说明关闭名称查找可服务于隐蔽嗅探，tcpdump 4.99.5 规定可控制的禁止名称转换选项；二者支持以能力证据建立主动名称补全抑制子项，而不证明特定恶意采用或现场规避成功。
  statement_en: NIST explicitly links disabled name lookup with stealthy sniffing, and tcpdump 4.99.5 specifies controllable suppression of name conversion. Together they support a capability-evidenced Active Name-Enrichment Suppression child without establishing particular malicious adoption or field evasion success.
  subject_keys: [B015-T1040-PARENT, B015-T1040-NJS-NO-ACTIVE-ENRICHMENT]
  evidence_keys: [B015-T1040-REF-NIST115, B015-T1040-REF-TCPDUMP4995]
  evidence_mode: strongly-inferred
  confidence: medium
- key: B015-T1040-CLM-NAME-SUPPRESSION-EVIDENCE
  claim_type: detection
  statement_zh: 该子项需要正面的有效补全设置和真实观察证据；数值显示、DNS 缺席、-N 或纯写包模式均不足以单独成立，事实返回还需与捕获相连的结果溯源。
  statement_en: The child requires positive effective-setting and actual-observation evidence. Numeric display, absent DNS, -N, and raw-save-only mode are individually insufficient, and fact return requires capture-linked result provenance.
  subject_keys: [B015-T1040-PARENT, B015-T1040-NJS-NO-ACTIVE-ENRICHMENT, B015-T1040-DET-ENRICHMENT-STATE, B015-T1040-NJA-ENRICHMENT-STATE]
  evidence_keys: [B015-T1040-REF-NIST115, B015-T1040-REF-TCPDUMP4995, REF-000840, B015-T1680-REF-AUSEARCH]
  evidence_mode: strongly-inferred
  confidence: medium
strategy:
  key: B015-T1040-DET-ENRICHMENT-STATE
  name:
    zh: 观察器名称补全设置与事实结果核对
    en: Observer Name-Enrichment Settings and Fact-Result Reconciliation
  summary:
    zh: 在真实报文观察关系中核实主动补全抑制设置与批准范围，保留配置证据和事实返回的区别。
    en: Verify active-enrichment suppression settings and approval scope within a real packet-observation relationship while separating configured behavior from fact return.
  description:
    paragraphs:
    - zh: 本策略将捕获主体的解释设置加入父级的权限和生命周期观察，确认采集器是否主动禁用本可执行的外部补全。它依赖有效选项、输入输出模式和实际观察记录，不从缺少 DNS 推断行为；分析进一步连接数字事实结果与批准任务，但设置存在、结果可见和攻击者已经取得结果仍分级记录。
      en: This strategy adds the collector's interpretation settings to the parent's authority and lifecycle observations to establish deliberate disabling of external enrichment. It requires effective options, input and output modes, and actual observation, without inferring behavior from absent DNS. The analytic further joins numeric facts and approved work while retaining separate grades for configured behavior, exposed results, and adversary-acquired results.
  detects_keys: [B015-T1040-PARENT, B015-T1040-NJS-NO-ACTIVE-ENRICHMENT]
  domains: [enterprise]
  analytic_keys: [B015-T1040-NJA-ENRICHMENT-STATE]
  evidence_keys: [B015-T1040-REF-NIST115, B015-T1040-REF-TCPDUMP4995, REF-000796, REF-000840, B015-T1680-REF-AUSEARCH]
analytic:
  key: B015-T1040-NJA-ENRICHMENT-STATE
  strategy_key: B015-T1040-DET-ENRICHMENT-STATE
  name:
    zh: 捕获解释模式与主动名称补全抑制证据关联
    en: Capture Interpretation Mode and Active Name-Enrichment Suppression Evidence Correlation
  summary:
    zh: 以完整参数、有效模式和捕获结果识别关闭主动补全的观察配置，避免把合法数字输出或 DNS 缺席直接判恶。
    en: Identify observation settings that disable active enrichment through complete arguments, effective mode, and capture results without treating legitimate numeric output or absent DNS as malicious.
  domains: [enterprise]
  platforms: [Linux, macOS]
  logic:
    paragraphs:
    - zh: 先由父级逻辑证明真实捕获或独立观察关系，再从已部署执行传感器恢复主机、进程开始键、可核查工具版本或 hash、完整 argv、输入模式和输出模式。对已验证的 tcpdump 4.99.5 参数模型区分大小写的 -n 与 -N，并判断实际是否进行解析打印；-w 纯保存且没有解析打印不能提升为本会发生的补全被抑制，单独 -r 也需既有捕获关系。命名过滤器的预先解析和其他程序查询分开记录。
      en: First establish a real capture or independent observation relationship through the parent logic. Recover host, process-start key, verifiable tool version or hash, complete argv, and input and output mode from deployed execution telemetry. Under the validated tcpdump 4.99.5 option model distinguish case-sensitive -n from -N and determine whether parsed printing actually occurs. Raw saving with -w and no parsed printing does not establish suppression of otherwise occurring enrichment, and -r alone still needs the capture relationship. Keep upfront named-filter resolution and other programs' queries separate.
    - zh: 将正面的有效补全设置与同会话捕获范围、包记录和批准的采集策略连接，输出 enrichment_suppression_configured；不能确认模式时保留 interpretation_unknown。受限分析员从捕获解码出数字端点仅为 facts-exposed，只有攻击者输出或等效结果证据含有对应事实时才为 fact-return-confirmed。对未批准主体、范围或结果去向提高调查优先级，但 -n 或没有 DNS 都不能单独成为恶意条件；若有按进程归属的解析遥测，仅用于一致性核对。
      en: Join positive effective-enrichment settings to same-session capture scope, packet records, and approved capture policy, emitting enrichment_suppression_configured. Retain interpretation_unknown when the mode cannot be verified. Restricted analyst decoding of numeric endpoints establishes facts-exposed only; matching adversary output or equivalent result evidence is required for fact-return-confirmed. Prioritize unapproved principals, scope, or result destinations, without making -n or absent DNS an independent malicious condition. Use process-attributed resolution only to corroborate consistency where available.
  data_requirements:
  - source_type: capture-execution-and-effective-configuration
    name:
      zh: 已部署采集器执行及有效解释配置
      en: Deployed collector execution and effective interpretation configuration
    channel: Linux audit exec records or validated macOS execution collector plus versioned capture configuration
    required_fields: [timestamp, host_id, process_start_key, principal_id, tool_version_or_hash, argument_vector, effective_enrichment_setting, input_mode, output_mode, parent_process]
  - source_type: capture-linked-fact-provenance
    name:
      zh: 捕获关联事实和返回证据
      en: Capture-linked facts and return evidence
    channel: Restricted capture/runtime store and separately preserved result evidence
    required_fields: [capture_session_id, process_start_key, capture_interval, source_artifact_hash, result_locator, observed_numeric_endpoints, fact_class, inference_level, result_origin, return_evidence_locator]
  - source_type: approved-capture-and-enrichment-policy
    name:
      zh: 获批捕获与名称补全策略
      en: Approved capture and name-enrichment policy
    channel: Diagnostic job and configuration registry
    required_fields: [ticket_id, owner, principal_id, asset_scope, allowed_capture_and_enrichment_settings, output_destination, valid_from, valid_to]
  observables:
  - zh: 已证实捕获关系中的明确主动补全禁用设置及解析模式
    en: Explicit active-enrichment suppression and interpretation mode within an established capture relationship
  - zh: 与捕获会话关联的数字事实和可区分来源的返回证据
    en: Numeric facts linked to capture sessions with distinguishable return-evidence origins
  correlation:
    window:
      zh: 以进程开始键与完整捕获会话为主关联范围，初始容忍两分钟配置时差，结果产物按 hash 和会话保留七日后续关联；时窗须本地验证。
      en: Join primarily by process-start key and capture lifetime, initially allowing two minutes of configuration timing tolerance and seven days for hash- and session-linked result artifacts; validate windows locally.
    dimensions: [host_id, principal_id, process_start_key, capture_session_id, tool_version_or_hash, input_mode, output_mode, source_artifact_hash, ticket_id, time]
  false_positives:
  - zh: 获批数字输出用于性能、可复现性、隐私和避免解析干扰，运维默认参数也可能包含 -n。
    en: Approved numeric output serves performance, reproducibility, privacy, and avoidance of resolution interference; operational defaults can contain -n.
  blind_spots:
  - zh: 自定义实现、进程注入、代理解析、未记录的有效模式和无持久结果会降低归属；普通 audit 不自动提供配置或结果正文，缓存及静态映射也会使 DNS 对照失效。
    en: Custom implementations, injection, brokered resolution, unrecorded effective modes, and nonpersistent results weaken attribution. Ordinary audit does not automatically supply configuration or result content, and caches or static mappings can invalidate DNS comparisons.
  tuning_guidance:
    paragraphs:
    - zh: 用目标版本的解析打印、纯写包、-n、-N、静态名称、缓存和空流量分别验证分级。先确认完整 argv 与运行配置的采集能力，缺失则降级；将批准绑定主体、源范围、解析模式、目的地和到期时间。不强制采集器开启 DNS，也不将捕获文件里的 DNS 报文当成采集器自身补全。
      en: Validate grading against target-version parsed printing, raw saving, -n, -N, static names, caches, and no traffic. Confirm complete argv and runtime-configuration collection first and downgrade when absent. Scope approval to principal, source range, interpretation mode, destination, and expiry. Do not force DNS on collectors or treat DNS inside a capture as enrichment generated by the collector.
  evidence_keys: [B015-T1040-REF-NIST115, B015-T1040-REF-TCPDUMP4995, REF-000796, REF-000840, B015-T1680-REF-AUSEARCH]
mitigation_application:
  target_key: B015-T1040-NJS-NO-ACTIVE-ENRICHMENT
  use:
    paragraphs:
    - zh: 将允许采集器的名称补全设置、输入输出模式、观察源范围和结果去向写入有期限的批准记录，结合最小抓包权限与独立生命周期审计核对实际配置。对数字输出的合法需求保留明确例外；处置未授权捕获时先保全模式、接口、结果和版本证据。
      en: Record permitted collectors' name-enrichment settings, input and output modes, observed source scope, and result destinations in expiring approvals, and reconcile effective configuration through least capture authority and independent lifecycle audit. Preserve explicit allowances for legitimate numeric output and retain mode, interface, result, and version evidence before responding to unauthorized capture.
  expected_effect:
    paragraphs:
    - zh: 使依赖辅助解析日志的调查能够转向可核查的采集器设置与捕获证据，减少未授权观察能力及结果访问，同时保留正常无解析诊断的业务用途。收益不依赖强行生成名称查询，也不保证已获准采集器无法被劫持。
      en: Let investigations relying on auxiliary resolution logs move to verifiable collector settings and capture evidence, reducing unauthorized observation and result access while preserving legitimate diagnostics without enrichment. The benefit does not depend on forcing name queries and does not guarantee that approved collectors cannot be hijacked.
  limitations:
    paragraphs:
    - zh: 已控制合法采集器、内核或固件的攻击者仍可能绕过配置审计；静态映射、缓存与自定义解析需要版本化验证。强制启用 DNS 会增加负载或暴露调查兴趣，并非阻止被动测绘的可靠办法；配置存在也不能证明哪些环境事实已返回。
      en: An adversary controlling an approved collector, kernel, or firmware can bypass configuration auditing; static mappings, caches, and custom interpretation require versioned validation. Forced DNS adds load or exposes investigative interests without reliably preventing passive mapping. A configuration alone does not establish which environmental facts returned.
