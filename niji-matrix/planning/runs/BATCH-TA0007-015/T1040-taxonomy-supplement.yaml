type: supplemental-taxonomy-review
batch_ref: BATCH-TA0007-015
candidate_ref: T1040
review_date: '2026-11-05'
source_handoff: T1040-research-handoff.yaml
scope: Bounded second review of the no-active-name-enrichment axis only
recommendation:
  prior_disposition: evidence-deferred
  revised_disposition: niji-variable-candidate
  propose_formal_child: true
  proposed_temporary_key: B015-T1040-NJS-NO-ACTIVE-ENRICHMENT
  confidence: medium
  evidence_level: documented capability and explicit stealth rationale, without an observed malicious procedure case
  name:
    zh: 主动名称补全抑制
    en: Active Name-Enrichment Suppression
  rationale:
    zh: NIST 不仅说明查找能力，还明确把禁用域名查找与隐蔽嗅探联系起来；tcpdump 上游固定版本手册进一步证明用户可通过选项控制这一行为。因此，该轴具有可有意控制的稳定变量、独立的观察器派生查询痕迹和防守价值，不应仅因缺少现场案例而暂缓。此前把恶意采用与结果级案例当作建项前置条件过于严格，建议改为能力证据支持的中等置信度子项，现场采用仍保持未证实。
    en: NIST explicitly connects disabling domain-name lookups with stealthy sniffing rather than merely documenting a lookup
      capability, and the pinned upstream tcpdump manual independently establishes user control through an option. The axis
      therefore has an intentional stable variable, a distinct observer-generated query trace, and defensive value and should
      not be deferred solely for lacking a field case. The previous disposition was too strict in treating observed malicious
      adoption and an outcome case as prerequisites. Recommend a medium-confidence capability-evidenced child while leaving
      field adoption unproven.
primary_evidence:
- key: B015-T1040-REF-NIST115
  resolution: reuse-proposed-source
  url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-115.pdf
  locator: Section 3.5 footnote 10, printed page 3-4, PDF page 21
  supported_conclusion:
    zh: 采集器可能为所见流量发起域名查找，禁用该查找可服务于隐蔽嗅探。
    en: A sniffer can generate domain lookups for observed traffic, and disabling that lookup can serve stealthy sniffing.
- key: B015-T1040-REF-TCPDUMP4995
  resolution: create
  title_zh: tcpdump 4.99.5 上游手册
  title_en: tcpdump 4.99.5 Upstream Manual
  source_type: official-documentation
  authors:
  - The Tcpdump Group
  publisher: The Tcpdump Group
  published: null
  url: https://raw.githubusercontent.com/the-tcpdump-group/tcpdump/tcpdump-4.99.5/tcpdump.1.in
  locator: OPTIONS -n and -N; DESCRIPTION and --print for parsing-versus-save-only distinction
  accessed: '2026-11-05'
  identifiers:
    doi: null
    rfc: null
    arxiv: null
    attack_id: null
    other:
    - tcpdump-4.99.5 manual source
  credibility: high
  supported_conclusion:
    zh: 固定版本手册规定 -n 禁止将地址及端口等转换为名称，-N 仅缩短显示的主机域名，二者不同。手册也区分解析打印与仅写原始报文。
    en: The pinned manual specifies that -n disables address and port-to-name conversion whereas -N only shortens printed
      host-domain qualification. It also distinguishes parsed printing from saving raw packets alone.
  limits:
    zh: 地址反向解析可能产生网络查询，端口名转换也可能只是本地表查找。手册不证明每次转换都会发 DNS，不证明所有平台实现相同，也不证明恶意采用。
    en: Address reverse resolution can generate network queries, while port-name conversion can be a local-table lookup. The
      manual does not establish a DNS query for every conversion, identical platform behavior, or malicious adoption.
  retrieval_note: tcpdump.org rendered manual was robots-blocked; used the project's own pinned-tag source, not a third-party
    mirror
child_admission_gates:
  intentional_control:
    result: pass-at-capability-level
    explanation:
      zh: 设置在解析所见地址时抑制本会执行的主动名称补全。偶然没有查询、缓存命中、网络不通或工具本来不做补全均不足以证明该子项；必须有设置或等效实现证据。
      en: Configure suppression of active name enrichment that would otherwise occur when interpreting observed addresses.
        Missing queries, cache hits, failed connectivity, or a tool that never enriches names do not establish this child;
        require a setting or equivalent implementation evidence.
  stable_variable:
    result: pass
    explanation:
      zh: 变量是观察器是否对包中地址执行主动外部补全，与观察位置、协议、工具名、目标类别和是否镜像独立。
      en: The variable is whether the observer actively enriches packet addresses through external resolution, independently
        of capture position, protocol, tool name, target type, or mirroring.
  trace_change:
    result: pass-with-conditions
    explanation:
      zh: 抑制由观察器解释已捕获地址而派生的解析事务，同时保留原始报文、数字地址和会话关系。该效果以对应补全确会调用外部解析为条件，不能扩写为整机或全会话零 DNS。 缓存、hosts 静态映射或解析器实现均可能使默认路径不发网络查询，所以不能承诺每个地址都减少一条
        DNS。
      en: Suppress resolution transactions generated by the observer's interpretation of captured addresses while retaining
        packets, numeric addresses, and session relationships. This requires that enrichment would call external resolution
        and does not imply zero DNS from the host or session. Caches, static hosts mappings, and resolver implementation can
        keep the default path from issuing network queries, so do not promise one fewer DNS query per address.
  defender_observation:
    result: pass
    explanation:
      zh: 解析日志不再一定包含观察器对许多所见地址的反向查询，因此仅按 DNS 推断测绘主体与兴趣目标的逻辑失去这条关联边。捕获权限、接口和控制面痕迹仍在。
      en: Resolution logs need not contain observer-generated reverse lookups for observed addresses, removing an association
        edge from DNS-only mapper and target-interest reconstruction. Capture authority, interface, and control-plane residue
        remain.
  sibling_boundary:
    result: pass
    explanation:
      zh: 父级核心是被动取得报文事实，本子项改变取得之后的辅助解释行为。保留自动补全的旁听仍属于父级；纯粹数值显示、本地服务名省略或 -N 域名缩写不自动属于本项。 单独离线读取既有文件不成立，除非已独立建立与本对象相符的捕获或观察关系；命名过滤器的预先解析与其他后台
        DNS 也不由该显示选项保证消除。
      en: The parent concerns passive packet-derived facts; this child changes auxiliary interpretation after acquisition.
        Listening with automatic enrichment remains parent-core. Numeric presentation alone, omitted local service names,
        or -N domain shortening do not automatically establish this child. A standalone offline file read is excluded unless
        a qualifying capture or observation relationship is independently established; the display option also does not guarantee
        removal of upfront named-filter resolution or other background DNS.
  returned_knowledge:
    result: pass-with-tradeoff
    explanation:
      zh: 数字地址、端口、时序和通信关系仍可返回，但由外部反向解析额外补全的名称会缺失。报文本来携带的 DNS 名称或应用名称不因此消失；后续在另一位置补全需要独立证据且可能重新产生痕迹。仅有 -n 选项仍不证明测绘事实已返回。
      en: Numeric addresses, ports, timing, and communication relationships can still return, but names added through external
        reverse resolution are absent. Names already carried in DNS or application packets remain available. Later enrichment
        elsewhere requires separate evidence and can create new traces. An -n option alone does not establish returned mapping
        facts.
  prerequisite_and_scenario:
    result: pass
    explanation:
      zh: 需要真实观察关系和可解析包，以及可配置的主动补全阶段。适用于先用数字端点和通信关系定位内部调查目标、避免观察器为每个所见地址另发查询的场景。
      en: Requires a real observation relationship, interpretable packets, and a configurable active-enrichment stage. It
        suits initial target selection using numeric endpoints and relationships while avoiding observer-generated queries
        for observed addresses.
  evidence_limit:
    result: capability-medium
    explanation:
      zh: 不要求为能力型子项制造恶意 Case。来源证明可实施控制与匿迹因果设计，未证明特定攻击者采用、告警减少比例或成功返回事实，应在正式限制中直说。
      en: Do not manufacture a malicious case for a capability-evidenced child. Sources establish implementable control and
        stealth causality, not adoption by a particular adversary, quantified alert reduction, or successful fact return;
        formal limitations must say so.
  defense_difference:
    result: pass
    explanation:
      zh: 需要保留并解释采集进程的解析设置，且不能要求每个所见地址都有对应 DNS。该分析对象超出父级的捕获权限与生命周期模型，提供了具体的新数据要求与失效条件。
      en: Defenders must preserve and interpret the capture process's enrichment settings and must not require DNS for each
        observed address. This exceeds the parent's authority and lifecycle model through specific additional data requirements
        and failure conditions.
mechanism:
  mechanism_ref: NM-BT
  role: primary
  confidence: medium
  summary:
    zh: 抑制观察器派生名称查询以减少解析日志中的测绘关联边
    en: Suppress observer-generated name queries to remove mapping edges from resolution logs
  causal_chain:
    zh: 选择禁用主动补全的解析设置，减少解释所见地址时由采集器发起的外部查询，使 DNS 侧观察缺少把监听主体与所见端点连接起来的痕迹，从而提高只依赖解析遥测的测绘识别成本；捕获侧监控仍能看到操作。
    en: Choosing no-active-enrichment interpretation reduces external queries initiated by the collector for observed addresses,
      depriving DNS-side observation of traces connecting the listener with observed endpoints and increasing mapping-identification
      cost for resolution-only monitoring; capture-side telemetry remains available.
  excluded_mechanisms:
  - NM-ST
  - NM-DO
  - NM-FD
  exclusion_reason:
    zh: 抑制辅助查询不是时间或空间分散，也不是遮蔽结果数据或模仿合法外观，不能因同一父级存在其他机理便继承。
    en: Suppressing auxiliary queries is neither temporal or spatial dispersion, result-data obscuration, nor feature imitation,
      and other parent mechanisms must not be inherited automatically.
defense_value:
  proposed_analytic_key: B015-T1040-NJA-ENRICHMENT-STATE
  objective:
    zh: 在已证实包观察关系中识别有意关闭主动名称补全的配置，并与数字事实返回相连接；不以 DNS 缺席作为恶意判据。
    en: Identify deliberate disabling of active name enrichment within an established packet-observation relationship and
      join it to numeric fact return without treating missing DNS as maliciousness.
  data_requirements:
  - source_type: capture-process-execution-and-configuration
    required_fields:
    - timestamp
    - host_id
    - process_start_key
    - tool_version_or_hash
    - argument_vector
    - effective_enrichment_setting
    - input_mode
    - output_mode
    - parent_process
  - source_type: observer-result-provenance
    required_fields:
    - capture_session_id
    - process_start_key
    - source_artifact_hash
    - result_locator
    - observed_numeric_endpoints
    - fact_class
    - inference_level
    - result_origin
  - source_type: capture-approval-and-policy
    required_fields:
    - ticket_id
    - owner
    - principal_id
    - asset_scope
    - allowed_capture_and_enrichment_settings
    - output_destination
    - valid_from
    - valid_to
  implementation:
    zh: 先通过父级逻辑建立捕获或独立观察关系，再按实际工具版本解释有效解析设置。对 tcpdump 固定版本区分 -n、-N、仅写包与解析打印；仅保存原始包而不解析时，-n 不能证明本来会发生的补全被抑制。将明确的数值解析设置连接到攻击者返回的数字端点结果并核对批准。进程级解析遥测若存在，可作一致性验证，缺少查询、缓存命中或解析器故障均不单独构成该子项。
    en: Establish capture or independent observation through parent logic, then interpret the effective enrichment setting
      for the actual tool version. For the pinned tcpdump version distinguish -n, -N, save-only operation, and parsed printing;
      -n in raw-save-only mode does not establish suppression of otherwise occurring enrichment. Join explicit numeric interpretation
      to numeric endpoint results returned to the adversary and compare approval. Process-attributed resolution telemetry
      can corroborate consistency when available, but missing queries, cache hits, or resolver failure do not independently
      establish the child.
  false_positives:
    zh: 数值输出是合法诊断中常见的性能、可复现性和避免解析干扰设置，不能单独告警为恶意。
    en: Numeric output is common legitimate practice for performance, reproducibility, and avoiding resolution interference
      and cannot alone justify a maliciousness alert.
  blind_spots:
    zh: 自定义实现无参数、进程注入、解析通过服务代理、配置未记录、批准工具被劫持或结果不可得。不得假定标准 auditd 自动记录有效配置与结果正文。
    en: Custom implementations without arguments, injection, brokered resolution, unrecorded settings, hijacked approved tools,
      and unavailable results. Standard auditd must not be assumed to record effective configuration or result contents automatically.
  mitigation_application:
    existing_candidate_ref: MIT-000186
    explanation:
      zh: 保留已批准采集器的解析设置、源范围和结果审计，使诊断授权覆盖是否进行主动补全；保持最小捕获权限与独立生命周期审计。不要强制所有采集器开启 DNS 作为安全措施，因为这会增加负载、泄露调查兴趣且不能保证阻止被动测绘。
      en: 'Retain approved collectors'' enrichment settings, source scope, and result audit so authorization covers active
        enrichment, alongside least capture authority and independent lifecycle audit. Do not force every collector to enable
        DNS as a security measure: it adds load, can disclose investigative interests, and does not reliably prevent passive
        mapping.'
primary_acceptance_notes:
  zh: 建议主 Agent 将原交接的本轴暂缓结论替换为一项中等置信度的能力型子项，并为该子项完整编写双语字段、原子 Claim 和直接适用的检测及缓解应用。其余五条轴不受此次有限补充改变；仍无合格环境结果 Case。正式 ID 与最终数量由主
    Agent 统一决定。
  en: Recommend replacing the original deferred disposition for this axis with one medium-confidence capability-evidenced
    child and authoring its complete bilingual fields, atomic claim, directly applicable analytic, and mitigation application.
    The other five axes are unchanged by this bounded supplement, and no qualifying environmental-outcome case has been found.
    The primary agent retains official ID and final-count decisions.
