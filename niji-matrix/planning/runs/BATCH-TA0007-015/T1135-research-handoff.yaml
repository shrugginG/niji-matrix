  detection_analytics:
  - key: B015-T1135-NJA-WINDOWS-CLI
    action: create
    strategy_key: B015-T1135-DET-ENUMERATION-CONTEXT
    name:
      zh: Windows 共享查询参数与执行职责差异
      en: Windows Share Query Arguments and Execution-Role Difference
    summary:
      zh: 从完整命令参数筛出查询共享资源的 Windows 原生命令，按发起进程和职责输出查询线索。
      en: Select Windows native share-resource queries from complete arguments and emit query leads based on initiating process
        and operational role.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 收集启用命令行策略后的客户端 4688，将记录主机、进程开始时间和 NewProcessId 联结为进程实例，保留 Creator 与可用的 Target Subject。解析 net.exe/net1.exe 的参数：view
          必须带明确的双反斜线目标主机，share 只纳入无修改参数或只带已知共享名的只读查询。bare view、/domain 仅列主机、help、带等号的共享创建及 /delete 等变更不匹配本分析。按十五分钟聚合同一进程树与身份查询的目标，和资产管理、备份预检、迁移任务的身份、父进程及批准目标集合比较；陌生执行链访问职责外服务器或正常运维进程突然扩展查询范围时产生
          share_query_intent 线索。
        en: 'Collect client event 4688 with command-line auditing enabled and identify process instances by logging host,
          start time, and NewProcessId, retaining Creator and available Target Subject context. Parse net.exe or net1.exe
          arguments: view must have an explicit double-backslash target host, while share must be read-only, with no mutation
          arguments or only a known share name. Bare view, domain-only host listings, help, share creation containing an equals
          sign, and removal operations do not match. Aggregate targets over fifteen minutes by process tree and identity and
          compare them with approved inventory, backup-precheck, and migration identities, parents, and target sets. Emit
          a share_query_intent lead for unfamiliar execution querying servers outside its duties or an administrative process
          unexpectedly widening its scope.'
      - zh: 单一敏感服务器上的职责外查询也可产生线索，不要求先达到横向多目标阈值。命令创建日志不含返回正文，退出成功也不保证存在非空清单；缺少后续结果传感器时结论保持查询意图。服务器访问审计只能补充请求来源，不可用其系统 PID 回填客户端进程。
        en: An out-of-role query against one sensitive server can qualify without crossing a multi-target threshold. Process
          creation contains no returned inventory, and a successful exit does not guarantee a nonempty result. Without a result
          sensor, retain query intent. Server share auditing can enrich requester context but its system PID must not be substituted
          for the client process.
    data_requirements:
    - source_type: windows_process_creation
      name:
        zh: 已启用参数的客户端进程创建审计
        en: Client process creation auditing with arguments enabled
      channel: Security event 4688 on the initiating client
      required_fields:
      - TimeCreated
      - Computer
      - NewProcessId
      - NewProcessName
      - ProcessId
      - CommandLine
      - SubjectUserSid
      - SubjectLogonId
    - source_type: approved_share_query_jobs
      name:
        zh: 批准共享查询任务与服务器职责清单
        en: Approved share-query jobs and server-role inventory
      channel: null
      required_fields:
      - job_owner
      - source_asset
      - principal
      - parent_process
      - target_servers
      - valid_from
      - valid_until
    observables:
    - zh: 带明确服务器的 net view 和只读 net share 参数
      en: Explicit-server net view and read-only net share arguments
    - zh: 查询目标与进程身份、父进程或批准任务范围的差异
      en: Differences between query targets and approved identity, parent, or job scope
    correlation:
      window:
        zh: 同进程查询聚合十五分钟，按三十天职责基线比较；阈值为需试点的分析初值。
        en: Aggregate queries for 15m and compare against a 30d role baseline; these are initial values requiring pilot validation.
      dimensions:
      - client_asset
      - process_start_time
      - process_id
      - parent_process_id
      - subject_logon_id
      - principal
      - target_server
    false_positives:
    - zh: 文件服务器故障排查、共享资产盘点、部署预检和批准迁移均可使用这些参数。
      en: File-server troubleshooting, share inventories, deployment checks, and approved migrations can issue these arguments.
    blind_spots:
    - zh: 未开启命令行策略、截断参数或内存内 API 调用可失去查询意图；4688 不证明返回结果，PID 还需开始时间避免重用。
      en: Missing command-line policy, truncated arguments, and in-memory API calls hide query intent. Event 4688 does not
        establish results, and PID reuse requires process-start disambiguation.
    tuning_guidance:
      paragraphs:
      - zh: 在试点机验证 view 的目标解析与 share 的只读/写入分流，对运维任务仅按身份、父进程、目标集合和期限建立例外，不能永久放行 net.exe 或管理员。将单目标敏感查询与多目标扩展分别评分，保留查询线索与结果确认的分层输出。
        en: Pilot target parsing for view and read-versus-mutation routing for share. Scope administrative exceptions by identity,
          parent, target set, and expiry instead of permanently allowing net.exe or administrators. Score sensitive single-target
          queries separately from expansion across targets, retaining separate query-lead and result-confirmation outputs.
    evidence_keys:
    - B015-T1135-REF-NETVIEW
    - B015-T1135-REF-NETSHARE
    - REF-000334
    - REF-000623
  - key: B015-T1135-NJA-UNIX-CLI
    action: create
    strategy_key: B015-T1135-DET-ENUMERATION-CONTEXT
    name:
      zh: Unix 与 macOS 共享列表命令语义判定
      en: Unix and macOS Share-Listing Command Semantics
    summary:
      zh: 区分远端 smbclient 清单请求与本地 sharing 只读配置枚举，并按执行上下文识别异常。
      en: Distinguish remote smbclient inventory requests from local sharing configuration listing and identify abnormal execution
        context.
    domains:
    - enterprise
    platforms:
    - Linux
    - macOS
    logic:
      paragraphs:
      - zh: Linux 预配置 execve/execveat 审计或等价进程传感器，按同一 audit serial 合并 SYSCALL、EXECVE 与 PATH 取得程序、参数和身份；macOS 使用已授权并订阅执行事件的
          Endpoint Security 客户端，从 exec target 与参数 helper 提取进程和 argv。解析 smbclient 的 -L/--list 及其目标，只将其分类为远程共享列表请求；直接连接 //server/share
          后执行 ls 是已知共享内目录发现，get/mget 是读取。对 macOS 的系统 sharing，只纳入 -l 列表请求，排除 -a、-e、-r 等配置变更；本地列表不要求存在出站网络连接。
        en: On Linux, preconfigure execve or execveat auditing or equivalent process telemetry and combine SYSCALL, EXECVE,
          and PATH records by audit serial to recover executable, arguments, and identity. On macOS, use an authorized Endpoint
          Security client subscribed to execution events and extract exec target and argv through the argument helpers. Parse
          smbclient -L or --list and its target as a remote share-list request. A direct //server/share connection followed
          by ls is directory discovery inside a known share, while get or mget is reading. For the macOS system sharing utility,
          match -l listing and exclude configuration changes such as -a, -e, or -r; the local list does not require outbound
          traffic.
      - zh: 将命令与执行用户、父进程、主机角色和批准的共享维护任务比较；非共享管理主机或由不相关业务进程触发的列表请求输出 share_query_intent。可关联远端 SRVSVC 响应或明确保存的命令输出提升结果等级，但 audit
          exec 成功和 Endpoint Security EXEC 本身只证明程序执行。Apple 历史手册验证 sharing 列表语义，部署前仍须在目标 macOS 版本核对路径、参数及输出，不能将旧服务器手册外推为现代默认审计保证。
        en: Compare the command with user, parent, host role, and approved share-maintenance work. Emit share_query_intent
          for listing from a host without share-management duties or an unrelated business-process ancestry. A decoded remote
          response or explicitly captured command output can improve result evidence, but successful audit exec and Endpoint
          Security EXEC establish execution only. Apple's historical manual verifies sharing list semantics; verify path,
          arguments, and output on the deployed macOS version rather than treating the old server manual as a modern default-auditing
          guarantee.
    data_requirements:
    - source_type: unix_process_execution
      name:
        zh: Linux 审计或 macOS Endpoint Security 的规范化执行事件
        en: Normalized Linux audit or macOS Endpoint Security execution events
      channel: Linux audit SYSCALL/EXECVE/PATH or macOS Endpoint Security EXEC after sensor deployment
      required_fields:
      - event_time
      - host
      - event_id
      - process_id
      - parent_process_id
      - executable
      - argv
      - execution_identity
    - source_type: approved_share_maintenance
      name:
        zh: 已批准共享维护工作上下文
        en: Approved share-maintenance work context
      channel: null
      required_fields:
      - owner
      - host_role
      - principal
      - executable
      - parent_context
      - target_scope
      - valid_until
    observables:
    - zh: smbclient -L/--list 目标与 sharing -l 本地列表
      en: smbclient -L or --list targets and local sharing -l listings
    - zh: 列表命令与业务进程祖先、执行身份及主机职责不匹配
      en: Listing commands inconsistent with business-process ancestry, identity, or host role
    correlation:
      window:
        zh: 同主机与身份十五分钟，职责基线三十天；在执行开始时关联任务窗口。
        en: Group by host and identity for 15m against a 30d role baseline and join job windows at execution start.
      dimensions:
      - host
      - event_id
      - process_id
      - parent_process_id
      - execution_identity
      - target_server
      - job_owner
    false_positives:
    - zh: Linux 运维、文件共享诊断、Mac 文件服务器管理和合规资产盘点会执行相同命令。
      en: Linux operations, share diagnostics, Mac file-server administration, and compliance inventories use the same commands.
    blind_spots:
    - zh: 未预配置审计、传感器丢事件、参数缺失、直接库调用及替代客户端会失去覆盖；执行事件不含返回列表，现代 sharing 参数需按版本验证。
      en: Unconfigured auditing, sensor loss, missing argv, direct library calls, and alternate clients reduce coverage. Execution
        events omit returned inventories, and modern sharing arguments require version validation.
    tuning_guidance:
      paragraphs:
      - zh: 使用测试列表、读取和共享变更分别验证解析分流及日志字段；记录 Linux audit backlog/lost 与 macOS 传感器健康。只为登记的管理员任务建立带范围与期限的例外，不以 smbclient 是系统安装软件或
          sharing 具有 Apple 签名消除覆盖。
        en: Test listing, reading, and share modification separately to validate routing and fields, and retain Linux audit
          backlog or lost-event counters and macOS sensor health. Scope exceptions to registered administrative work with
          expiry rather than excluding smbclient because it is installed or sharing because it is Apple signed.
    evidence_keys:
    - B015-T1135-REF-SMBCLIENT
    - B015-T1135-REF-APPLE-SHARING
    - B015-T1135-REF-APPLE-EXEC
    - REF-000840
  - key: B015-T1135-NJA-SRVS-RETURN
    action: create
    strategy_key: B015-T1135-DET-ENUMERATION-CONTEXT
    name:
      zh: SRVSVC 共享枚举请求与结果分页判定
      en: SRVSVC Share Enumeration Request and Result-Page Grading
    summary:
      zh: 将可解码的 NetrShareEnum 请求关联返回状态和条目，分开记录尝试、空结果、部分清单和已返回共享。
      en: Join decodable NetrShareEnum requests to status and entries, separating attempts, empty results, partial inventories,
        and returned shares.
    domains:
    - enterprise
    platforms:
    - Windows
    - Linux
    - macOS
    logic:
      paragraphs:
      - zh: 仅在经过验证能够重组 RPC 请求与响应的网络或端点协议传感器上启用本分析。识别 SRVSVC 接口的 NetrShareEnum 操作号 15，以连接/绑定、call ID、目标服务器和时间配对请求响应，提取 Level、返回状态、实际条目及续取信息。只见请求输出
          enumeration_attempt；拒绝和无效级别保留各自错误。NERR_Success 且无条目输出 enumeration_empty；NERR_Success 或 ERROR_MORE_DATA 且返回可解析共享条目时输出
          shares_returned，同时在后者标记 partial。不得用 TotalEntries 代替实际条目数，也不得把 ERROR_MORE_DATA 当作没有取得任何结果。
        en: Enable this analytic only on a network or endpoint protocol sensor validated to reassemble RPC requests and responses.
          Identify NetrShareEnum operation 15 on the SRVSVC interface and pair requests and responses by connection or binding,
          call ID, target server, and time. Extract level, status, actual entries, and continuation information. A request
          alone emits enumeration_attempt; preserve denial and invalid-level errors separately. NERR_Success with no entries
          emits enumeration_empty. NERR_Success or ERROR_MORE_DATA with parsed share entries emits shares_returned, with partial
          set for the latter. Never substitute TotalEntries for actual entry count or interpret ERROR_MORE_DATA as obtaining
          no result.
      - zh: 对同一客户端、有效调用身份、服务器及级别追踪 ResumeHandle 链，去重返回共享并标记未续取、缺失响应或共享状态变化的完整性限制；最终成功只表示该调用上下文的返回完成，不证明所有时期或权限上下文的全局清单。再把查询来源与批准资产盘点范围比较，优先处置陌生身份/主机组合、非批准多服务器枚举及敏感单服务器查询。IPC$、5140、5145、映射盘条目或后继文件读均不能补充成缺失的枚举返回；需要客户端进程归因时另外关联客户端进程连接，不能使用服务器系统
          PID。共享名称已返回也不等于 caller 可打开共享或已读取正文。
        en: Track ResumeHandle chains by client, effective caller, server, and level, deduplicate share identities, and flag
          incompleteness from uncontinued pages, missing responses, or changing share state. Final success completes the returned
          sequence for that call context, not a global inventory across time or permissions. Compare query origin with approved
          inventory scope, prioritizing unfamiliar principal and host combinations, unapproved multi-server enumeration, and
          sensitive single-server queries. IPC$, events 5140 or 5145, mapped-drive entries, and subsequent file reads cannot
          reconstruct a missing enumeration response. Attribute a client process through separate client process and connection
          data rather than a server system PID. Returned names do not establish that the caller can open a share or has read
          content.
    data_requirements:
    - source_type: decoded_srvsvc_request_response
      name:
        zh: 经部署验证的 SRVSVC 请求和响应解码
        en: Deployment-validated SRVSVC request and response decoding
      channel: Custom RPC-capable protocol sensor; not a default Windows audit event
      required_fields:
      - event_time
      - client_address
      - server_address
      - connection_id
      - rpc_binding_id
      - rpc_call_id
      - rpc_interface
      - rpc_opnum
      - information_level
      - response_status
      - returned_entries
      - resume_handle
    - source_type: approved_share_inventory_origins
      name:
        zh: 授权枚举来源与服务器范围清单
        en: Authorized enumeration origins and server-scope inventory
      channel: null
      required_fields:
      - owner
      - source_asset
      - target_server
      - permitted_query_scope
      - valid_until
    observables:
    - zh: SRVSVC 操作号 15 的请求、状态和实际共享条目
      en: SRVSVC operation 15 requests, statuses, and actual share entries
    - zh: ERROR_MORE_DATA、ResumeHandle 续取与同一上下文返回范围
      en: ERROR_MORE_DATA, ResumeHandle continuation, and returned scope within one context
    correlation:
      window:
        zh: RPC 请求响应初始配对六十秒，续取链十五分钟，来源范围比较二十四小时；均需按延迟和任务调整。
        en: Start with 60s RPC pairing, 15m continuation chains, and 24h origin-scope comparison, adapting all windows to
          latency and jobs.
      dimensions:
      - client_address
      - server_address
      - connection_id
      - rpc_binding_id
      - rpc_call_id
      - information_level
      - resume_handle
    false_positives:
    - zh: ShareEnum、安全审计、资产管理和共享故障排查会产生相同协议返回，分页也是正常结果处理。
      en: ShareEnum, security audits, asset management, and share troubleshooting produce identical protocol returns; pagination
        is normal result handling.
    blind_spots:
    - zh: SMB 加密或 RPC 保护、只见单向流量、缺包、解码器不支持、经代理来源折叠和本地调用会限制配对。协议传感器未记录有效身份时只能归因到连接；多页期间共享变化可使结果重复或遗漏。
      en: SMB encryption or protected RPC, one-way visibility, packet loss, unsupported decoding, proxy origin collapse, and
        local calls limit pairing. Without effective-identity telemetry, attribution is connection-only. Share changes during
        pagination can duplicate or omit entries.
    tuning_guidance:
      paragraphs:
      - zh: 用已知非空、空清单、无权限和强制小缓冲续取测试验证解码器的实际字段与状态，初期限制到重点文件服务器；无法读取响应的部署输出请求层级线索。批准扫描器例外必须固定 owner、来源、身份可用性、目标集合和期限，避免把所有 IPC$
          或管理员访问视为良性，也避免把其视为清单成功。
        en: Validate decoder fields and states with known nonempty, empty, denied, and deliberately small-buffer continuation
          tests, initially on priority file servers. Deployments without readable responses emit request-level leads. Scanner
          exceptions must specify owner, origin, identity availability, target set, and expiry, without treating all IPC$
          or administrator activity as benign or as successful inventories.
    evidence_keys:
    - B015-T1135-REF-SRVS
    - B015-T1135-REF-NETSHAREENUM
    - B015-T1135-REF-SHAREENUM
    - REF-000474
  mitigations:
  - key: B015-T1135-MIT-SHARE-INVENTORY-EXPOSURE
    action: create
    name:
      zh: 共享清单暴露面与枚举来源约束
      en: Share Inventory Exposure and Enumeration-Origin Constraints
    summary:
      zh: 收缩不必要的共享服务入口和匿名清单能力，并保留枚举发起者及返回范围的独立观察。
      en: Reduce unnecessary share-service entry points and anonymous listing capability while independently observing enumeration
        origin and returned scope.
    description:
      paragraphs:
      - zh: 本控制针对共享清单可被查询的机会，先清点业务需要的共享服务器、客户端来源和管理查询，再以主机防火墙/网络分段限制不必要的 SMB 路径，并在适用成员系统上治理匿名共享枚举。对必须保留的查询增加客户端和结果遥测，避免把内容读取
          ACL 或目录 ABE 当作共享清单的完整保护。
        en: This control reduces opportunities to query share inventories by first inventorying required share servers, client
          origins, and management queries, then restricting unnecessary SMB paths through host firewalls or segmentation and
          governing anonymous enumeration on applicable member systems. Add client and result telemetry for necessary queries
          rather than assuming content-read ACLs or directory ABE fully protect the share inventory.
    domains:
    - enterprise
    measures:
    - key: inventory-scoped-smb-paths
      name:
        zh: 按业务清单限制 SMB 来源与目的地
        en: Restrict SMB origins and destinations to business inventory
      description:
        paragraphs:
        - zh: 清点需要提供共享及接受客户端访问的系统，在源与目标主机及网络边界将 SMB 限于批准服务器和业务客户端组；关闭没有业务用途的共享服务入口。先以日志和代表性客户端验证，再逐步执行规则，维护域控制器、文件服务、集群及迁移的显式例外。
          en: Inventory systems that must offer shares or receive client access and restrict SMB at source hosts, destination
            hosts, and network boundaries to approved servers and business client groups. Remove share-service entry points
            without a business purpose. Validate with logs and representative clients before enforcement and maintain explicit
            exceptions for domain controllers, file services, clustering, and migration.
      control_type: exposure-reduction
    - key: applicable-anonymous-enumeration-policy
      name:
        zh: 验证适用系统的匿名共享枚举限制
        en: Validate anonymous share-enumeration restrictions on applicable systems
      description:
        paragraphs:
        - zh: 在适用 Windows 客户端和成员服务器启用禁止匿名枚举 SAM 账户及共享的安全选项，并测试匿名与认证身份的实际结果；审查显式 ANONYMOUS LOGON 授权和旧信任业务依赖。记录域控制器不受该设置影响，不能把此设置作为域控制器或已认证身份的通用清单阻断。
          en: Enable the security option restricting anonymous enumeration of SAM accounts and shares on applicable Windows
            clients and member servers and test actual anonymous and authenticated results. Review explicit ANONYMOUS LOGON
            grants and legacy trust dependencies. Record that domain controllers are unaffected; the setting is not a universal
            inventory block for domain controllers or authenticated principals.
      control_type: preventive
    - key: enumeration-origin-and-result-observation
      name:
        zh: 保留枚举来源和结果观察
        en: Retain enumeration-origin and result observation
      description:
        paragraphs:
        - zh: 在共享管理端启用含参数的进程审计或受支持执行传感器，登记批准查询任务的 owner、目标范围和有效期；对重点服务器试点能够区分请求与响应的枚举观测。以成功、空结果、拒绝和分页测试校验字段，独立保留证据并监测事件丢失，不把
            5140/5145 的存在当成完整清单遥测。
          en: Enable process auditing with arguments or supported execution telemetry on share-management clients and register
            query-job owners, scope, and expiry. Pilot enumeration observation that distinguishes requests from responses
            on priority servers. Validate fields through successful, empty, denied, and paginated queries, retain evidence
            independently, and monitor event loss without equating events 5140 or 5145 with full inventory telemetry.
      control_type: detective-support
    applications:
    - target_key: B015-T1135-PARENT
      use:
        paragraphs:
        - zh: 对网络共享发现，以共享服务器及来源职责清单压缩可查询的远端入口，在适用成员系统验证匿名清单限制，并把必须保留的枚举关联到客户端执行者和批准任务。对本地 net share 或 sharing 列表保留端点观察，因为远端
            SMB 分段不能阻止已在共享服务器上的本地配置查询。
          en: For Network Share Discovery, reduce remotely queryable entry points through server and origin-role inventories,
            validate anonymous listing restrictions on applicable member systems, and join necessary enumeration to client
            executors and approved work. Retain endpoint observation for local net share or sharing listings because remote
            SMB segmentation does not prevent local configuration queries on an already-compromised share server.
      expected_effect:
        paragraphs:
        - zh: 不必要的主机间路径被切断，适用系统的未认证清单机会减少；允许路径上的异常原生命令或返回清单能够与正常管理职责比较，攻击者可能需要另一个获准来源或有效身份。该控制降低发现机会并提高意图区分能力，不等于阻止所有共享名暴露或文件内容获取。
          en: Unnecessary inter-host paths are removed and unauthenticated listing opportunities shrink on applicable systems.
            Abnormal native queries or returned inventories on permitted paths become comparable with administrative duties,
            potentially requiring another permitted origin or valid identity. The control reduces discovery opportunities
            and improves intent classification without eliminating every exposure of share names or preventing content acquisition.
      limitations:
        paragraphs:
        - zh: 已认证且来自允许客户端的攻击者仍可使用其权限允许的查询；成员系统匿名选项对域控制器无效，并可能影响单向信任等旧业务。严格防火墙例外需要维护且会影响共享业务；加密和本地调用可失去网络结果观察。文件与目录权限负责后续访问，不能由本控制的成功替代验证。
          en: Authenticated adversaries on permitted clients can still issue queries allowed by their context. The member-system
            anonymous restriction does not affect domain controllers and can disrupt legacy one-way-trust workflows. Tight
            firewall exceptions require maintenance and can affect sharing; encryption and local calls can remove network
            result visibility. File and directory rights govern later access and require separate verification.
