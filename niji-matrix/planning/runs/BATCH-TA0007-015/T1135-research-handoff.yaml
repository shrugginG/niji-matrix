defense_candidates:
  detection_strategies:
  - key: B015-T1135-DET-ENUMERATION-CONTEXT
    action: create
    name:
      zh: 共享清单查询与返回语义关联
      en: Share Inventory Query and Return Semantics Correlation
    summary:
      zh: 识别偏离职责的共享配置和清单查询，保留命令、协议请求及返回结果之间的证据等级。
      en: Identify share-configuration and inventory queries outside operational duties while preserving evidence levels across
        commands, protocol requests, and returned results.
    description:
      paragraphs:
      - zh: 本策略检测用于筛选后继目标的共享发现，分别观察 Windows 命令、Unix/macOS 命令和可解码的远程共享枚举。前两类在进程上下文中识别查询意图，后一类验证实际请求及返回范围；三者可关联，但不能把工具启动、IPC$
          访问或共享权限检查直接升级为已返回共享名称。
        en: This strategy detects share discovery used to select later targets through Windows commands, Unix or macOS commands,
          and decodable remote share enumeration. The command analytics identify query intent in process context; the protocol
          analytic verifies requests and returned scope. Their evidence can be joined without promoting tool launch, IPC$
          access, or share authorization checks into returned share identities.
