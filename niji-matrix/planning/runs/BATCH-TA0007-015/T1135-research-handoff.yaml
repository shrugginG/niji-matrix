research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - local_share_configuration
    - remote_share_inventory
    - native_command_and_api_queries
    - share_name_and_metadata_results
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: Fixed parent has no ATT&CK children
      disposition: parent-core
      explanation: Parent behavior includes local/remote share discovery. This absence does not constrain Niji taxonomy count.
    candidate_stealth_axes_examined:
    - axis: Native administrative query appearance
      attacker_control: Select native commands or system interfaces used for share administration.
      trace_change: Familiar executable and normal protocol semantics rather than unfamiliar discovery binary.
      defender_effect: Reduces intent distinction for defenses keyed to tool novelty or anomalous protocol.
      prerequisites: Query execution and accepted server identity context.
      evidence_keys:
      - B015-T1135-REF-NETVIEW
      - B015-T1135-REF-NETSHARE
      - B015-T1135-REF-SHAREENUM
      - REF-000639
      - B015-T1654-REF-NOPINEAPPLE
      disposition: parent-core
      reason: Supports parent NM-FD inference; insufficient sibling partition beyond a broad property common to available
        implementations.
      defense_difference: Role-aware command and protocol analytics, already parent coverage.
    - axis: Reuse of an existing mapped-share relationship
      attacker_control: Query or use a selected preexisting client mapping.
      trace_change: May avoid creating a fresh mapping; does not return the server inventory.
      defender_effect: Mapping provenance can obscure which process selected later content, but that is not share-list result
        semantics.
      prerequisites: Existing mapping in an accessible logon context.
      evidence_keys:
      - NJS-0216-001
      - NJT-0216
      disposition: adjacent-technique
      reason: Existing relation/drive visibility or content collection depending on actual result. Do not relabel the collection
        child as discovery.
      defense_difference: Mapping and successful-read lineage already belongs to DET-000250.
    - axis: Local configuration query versus remote enumeration
      attacker_control: Run query on compromised server or query it from another host.
      trace_change: Endpoint execution/configuration visibility versus a remotely observable RPC exchange.
      defender_effect: Different sensor entry points, without evidence of deliberate adversarial route selection to evade
        a particular observer.
      prerequisites: Local execution or remote service access, respectively.
      evidence_keys:
      - B015-T1135-REF-NETSHARE
      - B015-T1135-REF-NETSHAREENUM
      - B015-T1135-REF-APPLE-SHARING
      disposition: not-stealth-distinct
      reason: Location and interface partition are insufficient to establish an intentional stealth variable. Keep local coverage
        in parent.
      defense_difference: Endpoint and RPC analytics are implementation coverage, not a child proof.
    - axis: Result pagination and temporal dilution
      attacker_control: Information level, preferred buffer length and inter-query delay.
      trace_change: More result pages or longer intervals; protocol pagination itself does not imply intentional concealment.
      defender_effect: Could require longer correlation, but no observed share-enumeration evasion comparison is available.
      prerequisites: Remote interface with continuation and enough time for the query sequence.
      evidence_keys:
      - B015-T1135-REF-NETSHAREENUM
      - B015-T1135-REF-SRVS
      disposition: evidence-deferred
      reason: Normal buffer handling, retries and mutable server state explain the observed mechanics. Need deliberate adversarial
        choice and trace comparison.
      defense_difference: Pagination state tracking is needed for result correctness irrespective of malicious timing.
    - axis: Distribution across real originating clients
      attacker_control: Delegate complementary server queries to multiple controlled hosts.
      trace_change: Reduced per-origin host coverage if actually implemented.
      defender_effect: Could increase cross-origin aggregation cost.
      prerequisites: Multiple controlled reachable clients and coordination.
      evidence_keys: []
      disposition: evidence-deferred
      reason: No conclusion-level firsthand share-enumeration example or validated implementation establishes the stable variable
        in this candidate.
      defense_difference: Potential cross-client result aggregation remains a research direction, not a formal child.
    - axis: Encrypted or protected query transport
      attacker_control: Potentially choose a supported encrypted path, subject to policy and server support.
      trace_change: Network payload inspection may be unavailable while endpoints retain query and result semantics.
      defender_effect: Could change network inspectability but not automatically hide endpoint execution.
      prerequisites: Supported transport and negotiation/context.
      evidence_keys:
      - REF-000476
      disposition: evidence-deferred
      reason: Security transport capability and sensor blind spots do not establish adversarial share-enumeration selection
        for evasion. No NM-DO inference from encryption alone.
      defense_difference: Endpoint coverage remains necessary; insufficient evidence for a child.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零 ATT&CK 子技术的普通广度审查仍覆盖六个独立候选轴。没有轴同时通过攻击者稳定选择、观察差异、证据和兄弟边界门禁，因此建议父项保留，子技术分类 deferred。主 Agent 应复核协议结果与内容收集边界后决定正式数量。
      en: The ordinary breadth review for a zero-child ATT&CK parent nevertheless examined six independent axes. None passes
        stable attacker selection, observation difference, evidence, and sibling-boundary gates together. Retain the parent
        with deferred child taxonomy and let the primary reviewer converge protocol-result and content-acquisition boundaries
        before allocation.
  causal_chain_review:
  - mechanism_ref: NM-FD
    steps:
      behavior_design: Borrow native share-management commands or interfaces for reconnaissance.
      trace_change: Normal executable provenance and ordinary query semantics.
      observer_condition: Defender relies on novelty or isolated protocol/process signals without role or task context.
      observation_effect: Reduced distinction between administrative and malicious queries.
      stealth_effect: More contextual correlation is needed to recognize adversarial purpose; no measured invisibility or
        alert reduction asserted.
      evidence_calibration: Official implementation and legitimate-use documentation plus firsthand explicit malicious net
