    - REF-000639
    - B015-T1654-REF-NOPINEAPPLE
    confidence: medium
  subtechnique_taxonomy:
    coverage: deferred
    subtechnique_refs: []
    narrative:
      paragraphs:
      - zh: 已独立检查正常管理外观、既有关系复用、结果页与查询节奏、真实来源分散及传输可检查性。正常管理外观属于父级现象；已有映射事实不等于服务器清单，并与已有正文收集子项有明确边界。分页和缓冲长度由接口完整性要求解释，缺少有意拆分活动以改变防守关联的结论级证据。
        en: Ordinary administrative appearance, reuse of existing relationships, result-page and timing control, distribution
          of real origins, and transport inspectability were examined independently. Administrative appearance remains a parent-level
          property. A known mapping is not a server inventory and has a clear boundary from the existing content-acquisition
          child. Pagination and buffer limits are explained by interface completeness requirements, without conclusion-level
          evidence of intentional splitting to change defensive correlation.
      - zh: 来源分散和加密通道可能影响观察，但当前资料未建立恶意共享枚举中的稳定选择、实际痕迹对照和独立防御差异。因而正式子项保持为空、分类为 deferred；不按 net、API、SMB、操作系统、共享类别或本地/远端位置创建子项。
        en: Distributed origins and encrypted channels can affect observation, but available material does not establish stable
          adversarial selection, actual trace comparison, and independent defensive differences for share enumeration. The
          formal child set therefore remains empty with deferred taxonomy. Commands, APIs, SMB, operating systems, share types,
          and local versus remote location do not define children.
