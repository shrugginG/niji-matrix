research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [source inventory, historical record queries, filtered exports, centralized/cloud log search, feedback use]
    breadth_trigger: ordinary
    coverage_resolutions:
      - dimension: log source and channel enumeration versus content lookup
        resolution: parent-core
        reason: Different information-result levels, not independently demonstrated stealth variables.
      - dimension: Windows versus cloud/SIEM versus Unix service logs
        resolution: not-stealth-distinct
        reason: Product and platform partitions require different analytics but do not by themselves establish intentional stealth causality.
      - dimension: log destruction or collection suppression
        resolution: adjacent-technique
        reason: Owned by selective trace contraction and defense impairment; an adjacent action does not redefine read discovery.
    candidate_stealth_axes_examined:
      - axis: predicate and time-window minimization
        variable: Requested record scope and volume
        evidence_keys: [B015-T1654-REF-WEVTUTIL, B015-T1654-REF-NOPINEAPPLE, B015-T1654-REF-LOOKUP]
        trace_change: Filters can reduce selected returned records and export volume.
        defender_effect: Potentially less output material, but query text and request remain observable.
        prerequisites: Read permission and valid filter with relevant retained records.
        defense_difference: Retain predicates and result tiers instead of relying on bulk volume.
        disposition: evidence-deferred
        reason: Observed filter serves targeted discovery; sources do not demonstrate intentional lowering of acquisition traces or a stable stealth contrast.
      - axis: existing-record investigation instead of fresh target interaction
        variable: Obtain host or identity facts from historical records rather than new direct probes
        evidence_keys: [B015-T1654-REF-NOPINEAPPLE, B015-T1654-REF-GUIVIL]
        trace_change: Query can avoid a new probe to every historical counterpart but creates a log-read trace.
        defender_effect: Probe-centric monitoring may miss knowledge acquisition; log-source monitoring remains possible.
        prerequisites: Sufficiently current and relevant records plus read authority.
        defense_difference: Read-request correlation rather than only network probes.
        disposition: evidence-deferred
        reason: Incident reports do not establish the unperformed alternative, intended probe substitution, or comparative stealth gain. This is also broadly parent-core acquisition semantics.
      - axis: centralized-observation displacement
        variable: Read aggregate log service instead of each originating host
        evidence_keys: [B015-T1654-REF-AZURE-QUERY-AUDIT, B015-T1654-REF-AZURE-QUERY-SCHEMA, B015-T1654-REF-GUIVIL]
        trace_change: Queries appear at central reader and platform rather than necessarily as a new query on every source host.
        defender_effect: Host-only investigation misses central query context.
        prerequisites: Central service read rights, ingested records, and corresponding target coverage.
        defense_difference: Query audits and workspace/identity joins.
        disposition: evidence-deferred
        reason: Technical availability and audit-placement difference are documented, but intentional surface displacement is not independently shown; platform-only child would violate taxonomy.
      - axis: defense-feedback-guided action selection
        variable: Selection of later action from security detections or eviction records
        evidence_keys: [REF-001049, B015-T1654-REF-GUIVIL]
        trace_change: Sources show feedback use but do not isolate a stable acquisition-side change in timing, scope, or appearance.
        defender_effect: Potential response exposure and adaptive persistence, not a demonstrated separate log-read stealth signature.
        prerequisites: Relevant records obtained and understood before later decisions.
        defense_difference: Protect response feedback; correlate record access with independent response timeline.
        disposition: evidence-deferred
        reason: Purpose and broad adaptation are supported; paired returns, action choice and observation contrast remain incomplete. No child allocated.
      - axis: audit-poor source or interface selection
        variable: Choose query entry path lacking read telemetry
        evidence_keys: [B015-T1654-REF-AZURE-QUERY-AUDIT, B015-T1654-REF-SENTINEL-AUDIT]
        trace_change: Documented coverage gaps can omit an audit event.
        defender_effect: Local query audit may be absent.
        prerequisites: Access through an excluded or unconfigured path.
        defense_difference: Entry-path validation and compensating telemetry.
        disposition: evidence-deferred
        reason: An auditing gap is not evidence that adversaries intentionally selected it; no such selection is established by the examined cases.
      - axis: encrypted or deleted outputs and injected caller
        variable: Hide exported content or its caller after discovery
        evidence_keys: [B015-T1654-REF-NOPINEAPPLE]
        trace_change: Changes output inspectability or later artifact presence rather than the log-discovery query itself.
        defender_effect: Depends on separate concealment behavior.
        prerequisites: Additional transformation, deletion, or process-control capability.
        defense_difference: Hand to relevant collection, stealth, or execution owners.
        disposition: adjacent-technique
        reason: No separate log-enumeration NJS justified by borrowing an unrelated concealment act.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定清单没有 ATT&CK 子项，仍完成六个原生轴的独立检索及结果语义复核。反馈用途证据较强，但用途与采集侧匿迹变量未形成同一结论；分类 deferred 优于以工具、平台或目标字段补造子项。主 Agent 应复核跨技术边界后确认。
      en: The fixed inventory has no ATT&CK children, but six native axes received independent searches and outcome-semantic review. Evidence for feedback purpose is stronger than evidence for a matching acquisition-side stealth variable; deferred taxonomy is preferable to invented utility, platform, or field-based children. Primary cross-technique review remains required.
  evidence_coverage:
    parent_behavior_keys: [B015-T1654-REF-ATTACK, B015-T1654-REF-NOPINEAPPLE, REF-001049, B015-T1654-REF-GUIVIL]
    boundary_keys: [B015-T1654-REF-WEVTUTIL, B015-T1654-REF-EVTQUERY, B015-T1654-REF-EVTNEXT, B015-T1654-REF-LOOKUP]
    mechanism_support:
      - mechanism: NM-FD
        keys: [B015-T1654-REF-WEVTUTIL, B015-T1654-REF-NOPINEAPPLE]
        mode: Technical normal-purpose capability plus firsthand observed adversarial use; distinguishability inference medium, no measured evasion.
    child_existence_support: []
    unsupported_or_deferred: [Intentional audit-poor query selection, query-volume stealth gain, independent feedback NJS, full exported-record recovery in No Pineapple, full query outputs in GUI-vil, universal cross-platform query audit]
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 定义两段区分来源与记录，匿迹段说明合法诊断重叠与残余结果差异，边界覆盖删改、凭据提取和正常响应，攻防模型分别讨论读权限与查询审计限制。三个分析以平台实际语义拆分，分别处理操作码、历史筛选和聚合行数，未复用同名通用检测。
      en: Two definition paragraphs separate sources and records; stealth prose addresses diagnostic overlap and residual outcome differences; boundaries cover mutation, credential extraction, and legitimate response; models separately address reader authority and query-audit limits. Three analytics split actual platform semantics into operation codes, historical selectors, and aggregate result counts rather than renaming generic detection.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML parsing and shape inspection only]
  limitations:
    paragraphs:
      - zh: 该交接是研究提案，不包含正式 ID、生产部署测量或人工领域验收。固定 ATT&CK 页面网络读取失败，准入锚点采用本批固定工作簿；其余主要来源已通过网络检索和页面读取核实，参考文献仍需由主 Agent 在跨候选查重后统一收敛。
        en: This handoff is a research proposal without canonical IDs, production measurements, or human domain acceptance. The fixed ATT&CK page could not be fetched, so the batch's pinned workbook anchors admission. Other primary sources were checked through search and page inspection; references still require primary cross-candidate duplicate convergence.
  rejected_mechanisms:
    - mechanism: NM-BT
      reason: Documented audit gaps do not establish deliberate attacker selection; no blanket claim that log reads are invisible.
    - mechanism: NM-ST
      reason: Regular or repeated feedback queries do not establish intentional temporal dilution or cross-source dispersion.
    - mechanism: NM-DO
      reason: Confidential logs, protected event content and encrypted export transport are not automatically query-content obscuration by this parent.
  open_questions:
    - Need a case with acquired log feedback, paired action selection and comparative acquisition traces before formal feedback NJS.
    - Validate each actual Azure portal/API entry path against the different current Microsoft coverage descriptions before operational deployment.
  shared_library_identity_review:
    - subject: REF-001049
      resolution: reuse
      reason: Same ESET article/PDF publication; extend locator/notes for security-log paragraph only if useful, preserve existing Gmail and GPO meanings.
    - subject: CASE-000307 and CASE-000356
      resolution: create
      replacement_candidate: B015-T1654-CASE-COMRAT-LOG-FEEDBACK
      reason: Existing cases concern Gmail C2 and GPO queries; security-log feedback is a different central observed event in the same report.
    - subject: REF-000623
      resolution: reuse
      reason: Exact canonical command-line-process-auditing URL; note actual optional command-line prerequisites.
    - subject: REF-000523
      resolution: reuse
      reason: Exact management-event selector documentation; no meaning extension needed.
    - subject: DET-000151 and NJA-000159
      resolution: split
      reason: Existing cloud protection-state inquiry examines service configuration, not historical records; keep it independent.
    - subject: MIT-000164
      resolution: split
      reason: Security-artifact permission continuity protects defender consumer function against permission mutation; proposed log-reader least access has a different control purpose.
    - subject: MIT-000139
      resolution: split
      reason: IaaS resource-inventory read scope is not equivalent to security-log content access and feedback exposure.
    - subject: exact new source search
      resolution: create
      reason: rg over canonical references found no wevtutil, EvtQuery/EvtNext, Get-WinEvent, No Pineapple, GUI-vil, LAQueryLogs, channel-access or LookupEvents source identity. Recheck generated catalog immediately before allocation.
