  name: {zh: 日志枚举, en: Log Enumeration}
recommendation:
  decision: retain
  confidence: medium
  rationale:
    paragraphs:
      - zh: 保留以日志来源和记录为信息对象的环境测绘父行为。固定基线 T1654 同时覆盖日志来源调查、记录查询与从记录理解环境，不能收缩为 Windows 事件导出，也不能扩大为所有日志篡改。WithSecure 直接记录攻击者使用 wevtutil 过滤导出 RDP 事件，ESET 记录 Turla 为了解样本是否被检测而定期外传安全日志，Permiso 记录 GUI-vil 读取 CloudTrail 以观察驱逐行动。它们支持恶意日志调查及其对正常诊断外观的借用；并未测量查询的漏报率，因此机理维持中等置信度。
        en: Retain the discovery parent whose information objects are log sources and records. Fixed-baseline T1654 covers investigation of sources, record queries, and learning about the environment from records; it must neither collapse into Windows event export nor expand into every form of log tampering. WithSecure directly records filtered RDP-event export through wevtutil, ESET reports Turla regularly exfiltrating security logs to assess sample detection, and Permiso records GUI-vil reading CloudTrail to observe eviction activity. These support malicious log investigation and its reuse of ordinary diagnostic appearances without measuring query detection failures, so the mechanism remains medium confidence.
  proposed_scope_notes:
    paragraphs:
      - zh: 将日志名、来源配置、查询请求、返回记录、导出工件与后续行动分别分级。建议一个父技术、零个正式子技术，分类状态 deferred。已独立调查查询范围缩减、既有记录替代新探测、集中日志观察面与反馈驱动调整，证据尚不足以把这些候选稳定地写成 NJS。
        en: Grade log names, source configuration, query requests, returned records, export artifacts, and subsequent actions separately. Propose one parent and no formal child, with taxonomy deferred. Query-scope reduction, existing records replacing fresh probes, centralized observation surfaces, and feedback-driven adaptation were independently examined; their evidence does not yet support stable formal NJS boundaries.
  original_attack_subtechniques_imported: false
proposed_content:
  name: {zh: 日志枚举, en: Log Enumeration}
  summary:
    zh: 调查系统或服务日志的来源与记录以理解身份、主机和防守活动，并借用正常诊断及审计读取路径降低调查目的的可区分性。
    en: Investigate system or service log sources and records to understand identities, hosts, and defensive activity while reusing normal diagnostic and audit-reading paths that make the investigation's purpose harder to distinguish.
  aliases: []
  definition_and_concept:
    paragraphs:
      - zh: 日志枚举是攻击者在已取得访问的环境中识别可用日志来源、查询其记录或取得日志内容，以了解身份活动、系统关系、服务运行和防守行动的环境测绘行为。日志保存的是其他活动留下的历史或持续记录；攻击者可从这些记录提取网络与身份线索，或判断自身活动在安全产品中留下了什么反馈。直接成果是来源清单或从记录得到的环境知识，不是删除记录、关闭记录功能或取得认证秘密。
        en: Log Enumeration is discovery in an accessed environment through identification of available log sources, queries of their records, or acquisition of log content to understand identity activity, system relationships, service operation, and defensive actions. Logs preserve historical or ongoing records of other activity. An adversary can extract network and identity clues or learn what feedback its own activity produced in security products. The direct result is a source inventory or environmental knowledge from records rather than record deletion, disabled logging, or acquired authentication secrets.
      - zh: 来源枚举与内容调查回答不同问题。列出通道只证明来源名称可得，发起查询只证明调查尝试，返回记录才支持具体环境事实；导出命令和新建文件也不自动证明文件含有匹配事件或已经被操作者读到。Windows 事件工具、系统日志读取器、云历史 API 与集中检索界面是不同实现，分类依据应是实际调查对象与结果，不能依工具名称或文件扩展名决定。
        en: Source enumeration and content investigation answer different questions. Listing channels establishes available names, a submitted query establishes an attempt, and returned records support concrete environmental facts. An export command and a newly created file do not automatically establish matching events inside the file or operator access to them. Windows event utilities, system-log readers, cloud history APIs, and centralized search interfaces are implementations; classification follows the actual information object and result rather than a utility name or filename extension.
  stealth_characteristics:
    paragraphs:
      - zh: 日志枚举可以把恶意调查表现为获准读取历史记录、故障排查或安全审计。wevtutil 的查询和导出同时服务于合法诊断；攻击者借用这些现成路径时，单次进程创建或查询成功通常不能说明为何要查看该通道、用户或时间段。改变的是调查请求的可见外观与正常工作之间的重叠，而不是日志读取必然不产生痕迹。
        en: Log Enumeration can present adversarial investigation as authorized historical access, troubleshooting, or security auditing. The query and export operations in wevtutil also serve legitimate diagnostics. When adversaries reuse these paths, one process-creation event or successful query usually does not explain why a particular channel, user, or interval was inspected. The affected property is overlap between the request's visible appearance and legitimate work rather than any inherent absence of read traces.
      - zh: 残余证据可能包括进程谱系与完整参数、检索主体、查询文本、时间范围、返回行数和导出工件。它们分布在端点、日志平台与身份面，含义也不同；例如集中检索的成功状态不必然含有原始记录，聚合查询的一行结果可能概括许多事件。读取安全日志以了解检测或响应只证明取得反馈的目的，不能据此断言已成功绕过告警或有意选择了无审计路径。
        en: Residual evidence can include process lineage and arguments, the querying principal, query text, time range, returned-row count, and export artifacts. These reside across endpoint, logging-platform, and identity planes with different meanings. A successful centralized query need not return raw records, and one aggregate result can summarize many events. Reading security logs to understand detection or response establishes a feedback purpose without establishing successful alert evasion or deliberate selection of an unaudited path.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入可用日志来源、通道与相关元数据的调查，以及为理解环境而查询或取得系统、应用、安全和服务日志记录。读取既有事件可能揭示账户、远程系统或服务线索，但只有来源名或路径列表时不得声称取得记录内容；一般目录列表仍需与 NJT-0182 文件与目录发现区分。只调查日志功能是否启用和保护状态、并未调查来源或记录时，应与 NJT-0140 云服务发现等配置发现对象对照。
        en: Include investigation of available log sources, channels, and related metadata together with queries or acquisition of system, application, security, and service records for environmental understanding. Existing events may reveal accounts, remote systems, or service clues, but names or paths alone do not establish content recovery; general directory listings remain distinct from NJT-0182 File and Directory Discovery. An inquiry limited to whether logging is enabled or to protection state, without investigating sources or records, should be compared with configuration-discovery objects such as NJT-0140 Cloud Service Discovery.
      - zh: 清除、删改和抑制日志属于痕迹收缩或防御削弱；仅因同一个 wevtutil 同时支持 clear-log 与 query-events，不能合并这些行为。日志中的口令、令牌或认证秘密被实际提取时需另外判断凭据访问，日志被打包和传输还涉及收集与外传边界。正常响应、支持、合规核查和容量分析会产生相同读取，必须结合主体职责、获批任务及入侵上下文；日志敏感或工具受信都不足以单独决定恶意性质。
        en: Clearing, altering, deleting, or suppressing logs belongs to trace contraction or defense impairment. The fact that wevtutil supports both clear-log and query-events does not merge those behaviors. Actual extraction of passwords, tokens, or authentication secrets requires a separate credential-access assessment, and packaging or transfer of logs also crosses collection or exfiltration boundaries. Incident response, support, compliance reviews, and capacity analysis generate similar reads, requiring principal duties, approved work, and intrusion context. Neither log sensitivity nor a trusted utility alone establishes malicious intent.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者取得主机或日志平台读取权后，可回顾认证和远程访问记录，筛选潜在账户或主机并理解先前活动。WithSecure 的 No Pineapple 调查记录针对 RDP 通道及事件 1149 的 wevtutil 导出命令；这证明具备明确对象和过滤条件的调查尝试，公开材料没有给出完整导出内容、匹配事件数量或每条记录的最终利用。
          en: After acquiring host or logging-platform read access, an adversary can review authentication and remote-access records to identify accounts or hosts and understand earlier activity. WithSecure's No Pineapple investigation records a wevtutil export directed at an RDP channel and event 1149. This establishes an investigation attempt with a specific target and filter; the public material does not provide complete exported contents, matching-event counts, or the eventual use of each record.
        - zh: 在持续控制或驱逐期间，安全记录还可能成为攻击者的反馈源。ESET 记录 Turla 定期外传安全相关日志以了解样本是否已被检测；Permiso 记录 GUI-vil 观察 CloudTrail 中的驱逐变更并据此调整持久控制。前者没有公开逐次查询与后续决策配对，后者没有把每项持久控制变化归因于某条返回事件，因此两者用于父级场景，而不直接建立反馈匿迹子项。
          en: During continued access or eviction, security records can also become an adversary feedback source. ESET reports Turla regularly exfiltrating security-related logs to assess sample detection, while Permiso reports GUI-vil watching eviction changes in CloudTrail and adapting persistence. The former does not publish paired queries and subsequent decisions, and the latter does not attribute each persistence change to one returned event. Both therefore support parent-level scenarios without directly establishing a feedback evasion child.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者控制能够读取至少一个日志来源的进程或身份，能够运行查询或下载已授权内容。来源权限、日志保留与记录范围决定其可得事实，不能假设普通用户能读取所有安全事件、跨租户平台或全部历史。远程查询还需要可达端点和对应授权；已获准的云或安全平台身份也只提供其权限和上下文允许的视图。
            en: The adversary controls a process or identity capable of reading at least one source and can execute queries or retrieve authorized content. Source permissions, retention, and recorded scope determine available facts; access to every security event, tenant, or historical interval is not assumed for an ordinary user. Remote queries also require reachable endpoints and authorization, while an authorized cloud or security-platform identity supplies only the view permitted by its rights and context.
          - zh: 攻击者可选择通道、条件、时间范围和输出方式，并可在权限允许时反复读取新记录。这些控制不等于关闭审计、控制日志服务或保证记录真实完整。云事件历史受区域、事件类别、分页与保留期约束；错误、空结果和截断都可能使推断失真。声称反馈驱动的下一步规避，还需证明结果确实被取得及其与行动选择的联系。
            en: The adversary can choose channels, predicates, intervals, and output methods and can repeatedly read new records where authorized. These controls do not imply disabled auditing, control of the logging service, or complete and authentic records. Cloud history is constrained by Region, event class, pagination, and retention, while errors, empty results, and truncation can distort inference. A claim of feedback-driven subsequent evasion additionally needs evidence of acquired results and their link to action selection.
      defender_model:
        paragraphs:
          - zh: 防守方可具备启用命令行字段的 Windows 进程审计、按版本配置的 PowerShell 内容日志，以及日志平台的查询审计。4688 记录进程创建而不是查询结果，已采集脚本也不能自动证明返回内容；编译程序内部的事件 API 调用需要额外验证的观测，基础进程日志不保证覆盖。导出文件的创建事件仅提供工件存在性，实际记录需要解析或由可信结果遥测确认。
            en: Defenders may have Windows process auditing with command-line capture, version-specific PowerShell content logging, and query auditing on the logging platform. Event 4688 records process creation rather than query results, and captured script content does not automatically establish returned content. Event APIs called inside compiled programs require additional validated visibility that ordinary process logging does not guarantee. Export-file creation establishes an artifact's existence; actual records require parsing or trusted result telemetry.
          - zh: 集中观察还可保留查询身份、目标、文本、时间范围与返回计数，但必须验证具体入口。Azure LAQueryLogs 需要预先启用诊断审计，用户上下文、服务间调用与各门户入口的覆盖存在限制；CloudTrail 读取事件需保留对应管理读事件，并区分查询自身与其筛选的历史事件。跨面关联需要稳定身份、目标资源和时间键，登录会话和进程 ID 不能在不同主机间直接等同。
            en: Centralized visibility may preserve query identity, target, text, interval, and result counts, but the particular entry path requires validation. Azure LAQueryLogs requires diagnostic auditing in advance and has limits across user contexts, service-to-service calls, and portal entry paths. CloudTrail read events require retention of the relevant management reads and separation of the lookup operation from the historical events it selects. Cross-plane joins need stable identities, target resources, and time keys; logon sessions and process IDs are not directly interchangeable between hosts.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 借用正常日志诊断和审计读取外观掩盖环境调查目的
        en: Reuse ordinary log diagnostics and audit-reading appearances to obscure environmental investigation intent
      analysis:
        paragraphs:
          - zh: 攻击者使用本来用于查询与导出事件的系统诊断路径，令调查请求保留合法读取的工具、操作和授权外观。Microsoft 说明这些操作的正常用途，WithSecure 则直接记录攻击者以相同工具过滤 RDP 记录；其重叠使单次进程或读请求难以区分例行诊断和敌对调查。该因果判断是对可见语义重叠的推断，未测量检测失败。命令条件、操作者职责、父进程和获批任务仍能提供区分，删除日志或后续持久控制不属于此机理的前提。
            en: The adversary uses system diagnostic paths intended for event queries and export, preserving the utility, operation, and authorization appearance of legitimate reads. Microsoft documents these normal operations, and WithSecure directly records an adversary filtering RDP records through the same utility. The overlap makes one process event or read request difficult to distinguish as routine diagnostics or hostile investigation. This is an inference from visible semantic overlap rather than a measured detection failure. Predicates, operator duties, process ancestry, and approved work can still distinguish intent; log deletion and subsequent persistence are not prerequisites of this mechanism.
      evidence_keys: [B015-T1654-REF-WEVTUTIL, B015-T1654-REF-NOPINEAPPLE]
      confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
        - zh: 本轮未建立正式子技术。查询条件、日志类型、操作系统和工具名称可改变实现或调查内容，但尚未证明其分别构成稳定且有意的匿迹变量。对既有记录的间接调查、查询范围缩减、集中检索与反馈驱动选择分别开展了检索；公开证据没有同时给出独立边界、读取侧痕迹变化及相应防守差异。
          en: No formal child is established in this round. Query predicates, log types, operating systems, and utility names alter implementation or survey content without yet establishing independently stable and intentional stealth variables. Existing-record indirect investigation, query-scope reduction, centralized search, and feedback-driven selection were searched separately. The public evidence does not jointly establish independent boundaries, acquisition-side trace changes, and corresponding defensive differences.
        - zh: 日志反馈在恶意活动中的用途已得到记录，仍不能仅以用途命名子技术。后续研究需把读取内容、反馈时点、下一步行为和防守观察对照连接起来，并区分资料原有的不可见性与攻击者主动造成的变化。分类保持 deferred，不能把零个 ATT&CK 子项解释为无需原生分类研究，也不能按产品补足数量。
          en: Adversarial use of log feedback is documented, but purpose alone does not define a child. Further research must connect acquired content, feedback timing, subsequent behavior, and comparative defender observations, separating pre-existing visibility limits from adversary-induced changes. Taxonomy remains deferred. Zero ATT&CK children does not remove the native-taxonomy research obligation, and product divisions must not be used to fill a count.
    coverage: deferred
    subtechnique_refs: []
  defense:
    detections: {coverage: available, strategy_keys: [B015-T1654-DET-LOG-READ-INTENT]}
    mitigations: {coverage: available, mitigation_keys: [B015-T1654-MIT-LOG-READ-BOUNDARY]}
  evidence:
    claim_keys: [B015-T1654-CLM-PARENT, B015-T1654-CLM-RESULT-GRADING, B015-T1654-CLM-FD, B015-T1654-CLM-FEEDBACK, B015-T1654-CLM-AZURE-AUDIT]
    case_keys: [B015-T1654-CASE-NOPINEAPPLE-LOG-QUERY, B015-T1654-CASE-COMRAT-LOG-FEEDBACK, B015-T1654-CASE-GUIVIL-LOG-FEEDBACK]
    reference_keys: [B015-T1654-REF-ATTACK, B015-T1654-REF-WEVTUTIL, B015-T1654-REF-GETWINEVENT, B015-T1654-REF-EVTQUERY, B015-T1654-REF-EVTNEXT, B015-T1654-REF-NOPINEAPPLE, REF-001049, B015-T1654-REF-GUIVIL, REF-000623, REF-000523, B015-T1654-REF-AZURE-QUERY-AUDIT, B015-T1654-REF-AZURE-QUERY-SCHEMA, B015-T1654-REF-SENTINEL-AUDIT, B015-T1654-REF-LOOKUP, B015-T1654-REF-CHANNEL-ACCESS, B015-T1654-REF-AZURE-ACCESS, B015-T1654-REF-AWS-FAQ]
  research:
    limitations:
      paragraphs:
        - zh: 公开报告能够证明选定日志调查与反馈目的，但未提供各查询的完整输出、统一的查询到决策时间线或匿迹效果的对照测量。No Pineapple 的导出命令不能证明全部匹配记录已经取得，ComRAT 的安全日志外传不能证明每次结果都触发行动调整，GUI-vil 的调查结论也不能泛化为所有 CloudTrail 查询均为规避。正常响应者可出现相同读取模式。
          en: Public reports establish selected log investigation and feedback purposes without complete query outputs, a unified query-to-decision timeline, or comparative stealth measurements. The No Pineapple export command does not establish recovery of every matching record, ComRAT's security-log exfiltration does not establish adaptation after every result, and GUI-vil's investigative conclusion does not make every CloudTrail query evasive. Legitimate responders can produce the same read patterns.
        - zh: 本轮实现设计重点覆盖 Windows 命令调查、AWS 历史查询和 Azure 已验证用户检索入口，并不声称覆盖每一种 ESXi、Linux、macOS 或 SIEM 实现。查询审计启用前的活动、服务间检索、直接文件读取及被注入进程可能缺失；返回行数、文件大小和 API 成功也不等于完整记录集。所有关联窗口和任务基线都是部署建议，尚未经真实环境验证。
          en: The implementation designs focus on Windows utility investigation, AWS history lookups, and validated Azure user-query entry paths, without claiming every ESXi, Linux, macOS, or SIEM implementation. Activity before query auditing, service-to-service queries, direct file reads, and injected processes can be absent. Returned-row count, file size, and API success do not establish a complete record set. Correlation windows and task baselines are deployment proposals that have not been validated in a production environment.
proposed_subtechniques: []
defense_candidates:
  detection_strategies:
    - temporary_key: B015-T1654-DET-LOG-READ-INTENT
      resolution: create
      name: {zh: 日志调查请求与用途关联, en: Log Investigation Request and Purpose Correlation}
      summary: {zh: 将日志来源枚举和记录查询与主体职责及获批调查关联，并分别报告请求、结果与后续行为。, en: Correlate source enumeration and record queries with principal duties and approved investigations while reporting requests, results, and subsequent behavior separately.}
      description:
        paragraphs:
          - zh: 本策略以读取者和调查对象为中心，判断为何某个主体枚举日志来源、查询认证记录或查看防守变更。Windows 分析区分只列通道、查询与导出命令；AWS 分析审查历史 API 查询及其筛选范围；Azure 分析使用已启用的查询审计核对文本、返回行数与职责。它们不共享结果语义，也不把缺少审批自动视为成功窃取。
            en: This strategy centers the reader and information object to assess why a principal enumerates sources, queries authentication history, or reviews defensive changes. The Windows analytic separates channel listings, queries, and export commands; the AWS analytic examines history API queries and their selectors; the Azure analytic uses enabled query auditing to compare text, returned rows, and duties. Their outcome semantics remain separate, and missing approval is not automatically successful theft.
      detects_keys: [B015-T1654-PARENT]
      domains: [enterprise]
      analytic_keys: [B015-T1654-NJA-WINDOWS-OPERATION-GRADE, B015-T1654-NJA-AWS-HISTORY-QUERY, B015-T1654-NJA-AZURE-LOG-QUERY]
      evidence_keys: [B015-T1654-REF-WEVTUTIL, B015-T1654-REF-GETWINEVENT, B015-T1654-REF-NOPINEAPPLE, REF-000623, B015-T1654-REF-GUIVIL, B015-T1654-REF-LOOKUP, REF-000523, B015-T1654-REF-AZURE-QUERY-AUDIT, B015-T1654-REF-AZURE-QUERY-SCHEMA]
  detection_analytics:
    - temporary_key: B015-T1654-NJA-WINDOWS-OPERATION-GRADE
      resolution: create
      strategy_key: B015-T1654-DET-LOG-READ-INTENT
      name: {zh: Windows 日志命令操作分级与任务关联, en: Windows Log Command Operation Grading and Task Correlation}
      summary: {zh: 识别日志来源枚举、记录查询与导出尝试，并按调用来源和批准调查范围确定优先级。, en: Identify source enumeration, record queries, and export attempts, then prioritize by caller provenance and authorized investigation scope.}
      domains: [enterprise]
      platforms: [Windows]
      logic:
        paragraphs:
          - zh: 先验证 Audit Process Creation 与命令行策略，采集 Security 4688 的 Computer、TimeCreated、SubjectUserSid、SubjectLogonId、NewProcessId、NewProcessName、ProcessId 和 CommandLine。规范化映像与参数，识别 wevtutil 的 el、enum-logs、ep、gl、gli 为 source_inventory_attempt，qe、query-events 为 record_query_attempt，epl、export-log 为 log_export_attempt；cl 和 sl 输出相邻清除或配置行为，不能算作本项读取成功。对 Get-WinEvent 的可见参数分别识别 ListLog/ListProvider 和 LogName/Path/FilterHashtable/FilterXPath/FilterXml，进程记录不足以还原交互脚本时标记 visibility_gap。
            en: Validate Audit Process Creation and command-line policy, then collect Security 4688 Computer, TimeCreated, SubjectUserSid, SubjectLogonId, NewProcessId, NewProcessName, ProcessId, and CommandLine. Normalize the image and arguments. Grade wevtutil el, enum-logs, ep, gl, and gli as source_inventory_attempt; qe and query-events as record_query_attempt; and epl and export-log as log_export_attempt. Route cl and sl to adjacent clearing or configuration behavior rather than read success. For visible Get-WinEvent arguments, distinguish ListLog or ListProvider from LogName, Path, FilterHashtable, FilterXPath, and FilterXml. Mark visibility_gap when process records cannot recover interactive script content.
          - zh: 以同机主体、登录上下文、进程及十分钟窗口连接批准诊断记录，比较通道、事件条件和目标主机是否在授权范围；罕见进程祖先、非职责主体、跨多个高价值通道及已知入侵会话提高优先级。导出路径仅作为工件定位线索；若另有可信内容采集，只有成功解析出匹配事件才升级 records_recovered，并保留事件计数和查询范围，不能从文件存在、零退出状态或进程创建直接升级。编译程序的 API 调查在本分析覆盖之外。
            en: Join approved diagnostics by same-host principal, logon context, process, and a ten-minute window, comparing channels, event predicates, and target hosts with authorized scope. Raise priority for rare ancestry, principals outside duties, multiple high-value channels, and known compromised sessions. Treat an export path only as an artifact locator. If trusted content capture exists separately, upgrade to records_recovered only after parsing matching events, retaining record counts and query scope; file existence, zero exit status, and process creation do not independently qualify. Compiled in-process API investigation is outside this analytic's coverage.
      data_requirements:
        - source_type: windows-security-process-creation
          name: {zh: 已启用命令行的进程创建审计, en: Process Creation Audit with Command Line Enabled}
          channel: Security / 4688
          required_fields: [Computer, TimeCreated, SubjectUserSid, SubjectLogonId, NewProcessId, NewProcessName, ProcessId, CommandLine]
        - source_type: approved-log-diagnostic-work
          name: {zh: 已批准日志调查任务, en: Approved Log Investigation Work}
          channel: null
          required_fields: [principal_id, host_id, approved_start, approved_end, allowed_channels, allowed_targets]
      observables:
        - {zh: 日志来源枚举或查询导出参数及其目标通道与过滤条件, en: Source-listing or query and export arguments with target channels and predicates}
        - {zh: 相同主机主体和进程上下文中的职责与任务范围差异, en: Duty and task-scope differences within the same host principal and process context}
      correlation:
        window: {zh: 命令与任务默认十分钟；罕见主体和通道基线三十天。, en: Default command-to-task join 10m; principal and channel rarity baseline 30d.}
        dimensions: [host_id, principal_id, logon_id, process_id, channel_name, target_host]
      false_positives:
        - {zh: 获批事件导出、远程支持、取证收集、审计及日志容量诊断。, en: Approved event export, remote support, forensic collection, auditing, and log-capacity diagnostics.}
      blind_spots:
        - {zh: 未开启命令行、交互脚本、编译程序 API、进程注入和不受管主机可能没有可解析请求；4688 不提供返回事件。, en: Disabled command-line capture, interactive scripts, compiled APIs, injection, and unmanaged hosts may lack parseable requests; 4688 does not supply returned events.}
      tuning_guidance:
        paragraphs:
          - zh: 以批准收集器的签名、身份、目标和有效时间共同设置例外，不能永久放行 wevtutil 或管理员。对来源列表、内容查询和导出分别建基线，并用空日志、无权限、合法收集和非职责查询对照验证分级；十分钟不是恶意阈值。
            en: Scope exceptions jointly by approved collector signature, identity, target, and validity rather than permanently trusting wevtutil or administrators. Baseline source listing, content queries, and export separately, and test grading against empty logs, access denial, legitimate collection, and out-of-duty queries. Ten minutes is not a maliciousness threshold.
      evidence_keys: [REF-000623, B015-T1654-REF-WEVTUTIL, B015-T1654-REF-GETWINEVENT, B015-T1654-REF-NOPINEAPPLE]
    - temporary_key: B015-T1654-NJA-AWS-HISTORY-QUERY
      resolution: create
      strategy_key: B015-T1654-DET-LOG-READ-INTENT
      name: {zh: AWS 历史查询范围与驱逐上下文关联, en: AWS History Query Scope and Eviction Context Correlation}
      summary: {zh: 识别非职责主体的 LookupEvents 调查，并将历史筛选条件与独立的驱逐行动分开关联。, en: Identify LookupEvents investigation outside principal duties and correlate historical selectors separately with independent eviction actions.}
      domains: [enterprise]
      platforms: [IaaS]
      logic:
        paragraphs:
          - zh: 在已验证保留 LookupEvents 管理读事件的账户和区域，筛选 eventSource=cloudtrail.amazonaws.com、eventName=LookupEvents，提取 eventTime、eventID、awsRegion、recipientAccountId、userIdentity、sourceIPAddress、userAgent、requestParameters 与 errorCode。按账户、区域、principalId、accessKeyId 或会话连接请求及分页；保留 startTime/endTime、lookupAttributes 和 nextToken，缺少时间条件表示该接口允许的历史范围，不能写成无限历史。requestParameters 中 ReadOnly=false 表示筛选修改类历史记录，不是 LookupEvents 请求本身变成写操作。
            en: In accounts and Regions where retention of LookupEvents management reads has been verified, select eventSource=cloudtrail.amazonaws.com and eventName=LookupEvents, extracting eventTime, eventID, awsRegion, recipientAccountId, userIdentity, sourceIPAddress, userAgent, requestParameters, and errorCode. Join requests and pages by account, Region, principalId, accessKeyId, or session. Retain startTime, endTime, lookupAttributes, and nextToken. An omitted time predicate means the interface's permitted history, not unlimited history. ReadOnly=false within requestParameters selects mutation history; it does not turn the LookupEvents request into a write.
          - zh: 与批准的 SOC 和运维查询角色比较主体及来源，在独立驱逐时间线前后各三十分钟检查非响应者是否查询变更记录；继续按同一身份或可证明的控制关联观察后续访问和权限变更。仅把有错误的请求记为 denied_or_failed_lookup，无错误时记 successful_lookup_candidate，CloudTrail 没有完整 Events 响应时不声称返回条数或所有记录；没有独立证据证明操作者已取得反馈并据此选择行为时，后续变更只输出关联候选。账户、区域和事件类别超出 LookupEvents 覆盖时不推断没有调查。
            en: Compare identities and origins with approved SOC and operations query roles. Around an independently recorded eviction timeline, examine a thirty-minute interval on each side for mutation-history lookups by nonresponders, then inspect later access and privilege changes under the same identity or demonstrably linked control. Grade errored requests denied_or_failed_lookup and error-free requests successful_lookup_candidate. Without a full Events response, do not claim returned counts or all records. Later changes remain correlation candidates unless independent evidence establishes acquired feedback and action selection. Do not infer absent investigation outside the API's account, Region, or event-class coverage.
      data_requirements:
        - source_type: aws-cloudtrail-management-read
          name: {zh: 已验证的 CloudTrail LookupEvents 审计, en: Validated CloudTrail LookupEvents Audit}
          channel: CloudTrail management read events
          required_fields: [eventTime, eventID, eventSource, eventName, awsRegion, recipientAccountId, userIdentity, sourceIPAddress, userAgent, requestParameters]
        - source_type: authorized-cloud-query-and-response-timeline
          name: {zh: 云查询授权与驱逐时间线, en: Cloud Query Authorization and Eviction Timeline}
          channel: null
          required_fields: [account_id, principal_id, role, approved_start, approved_end, action_time, affected_identity]
      observables:
        - {zh: LookupEvents 调用及所选历史属性与区域, en: LookupEvents invocation with selected historical attributes and Region}
        - {zh: 非响应者在驱逐前后查询修改类历史并出现后续访问变化, en: A nonresponder querying mutation history around eviction with subsequent access changes}
      correlation:
        window: {zh: 查询序列三十分钟；驱逐前后各三十分钟；身份职责基线三十天。, en: Query episode 30m; 30m before and after eviction; identity-duty baseline 30d.}
        dimensions: [account_id, aws_region, principal_id, access_key_id, source_ip, query_filter]
      false_positives:
        - {zh: 正常响应、IAM 审计、变更回溯、账单与资源排障。, en: Legitimate response, IAM audits, change review, billing, and resource troubleshooting.}
      blind_spots:
        - {zh: 未保留管理读事件、区域遗漏、被盗响应者身份、延迟投递以及通过 S3 等其他路径读取日志；成功 API 不保证日志里保存完整返回事件。, en: Missing management-read retention, omitted Regions, stolen responder identities, delayed delivery, and alternative paths such as S3 log reads; API success does not ensure complete returned events are retained.}
      tuning_guidance:
        paragraphs:
          - zh: 用已知调用验证本地事件类型和读选择器，保留拒绝与空结果对照；响应者放行需绑定设备、时段和任务。ReadOnly=false 仅作为历史调查主题，不单独提高为恶意。根据投递延迟扩大关联窗口，并按账户与区域去重 eventID 后保留分页请求数量。
            en: Validate local event type and read selectors with known calls, retaining denial and empty-result controls. Responder exceptions must be scoped to device, interval, and work item. ReadOnly=false identifies the history topic and does not independently imply maliciousness. Widen joins for delivery delay and deduplicate eventID within account and Region while preserving page-request counts.
      evidence_keys: [B015-T1654-REF-GUIVIL, B015-T1654-REF-LOOKUP, REF-000523]
    - temporary_key: B015-T1654-NJA-AZURE-LOG-QUERY
      resolution: create
      strategy_key: B015-T1654-DET-LOG-READ-INTENT
      name: {zh: Azure 日志检索内容与返回级别关联, en: Azure Log Query Content and Return-Level Correlation}
      summary: {zh: 从已启用的用户查询审计识别非职责日志调查，区分失败、空结果、聚合结果与记录返回候选。, en: Use enabled user-query auditing to identify out-of-duty log investigation while distinguishing failed, empty, aggregate, and record-return candidates.}
      domains: [enterprise]
      platforms: [IaaS]
      logic:
        paragraphs:
          - zh: 在目标 Log Analytics workspace 预先启用 Audit 诊断，并对实际使用的用户入口执行受控查询以验证 LAQueryLogs。按 TimeGenerated、AADTenantId、AADObjectId、AADClientId、RequestTarget、RequestContext、QueryText、ResponseCode、ResponseRowCount 和 CorrelationId 建立检索序列；结合资产内已登记的安全和认证表、身份或主机筛选词判断调查对象，不用任意敏感关键字单独定性。将非 200、200 且零行、200 且有行分别标记为 failed_query、empty_query 和 returned_result_rows。
            en: Enable Audit diagnostics on the target Log Analytics workspace in advance and validate LAQueryLogs with controlled queries through the user entry paths actually used. Build query sequences from TimeGenerated, AADTenantId, AADObjectId, AADClientId, RequestTarget, RequestContext, QueryText, ResponseCode, ResponseRowCount, and CorrelationId. Determine investigated objects from registered security and authentication tables plus identity or host predicates, rather than arbitrary sensitive keywords alone. Grade non-200, 200 with zero rows, and 200 with rows as failed_query, empty_query, and returned_result_rows respectively.
          - zh: 按主体、workspace 与十五分钟窗口连接获批工作；对非职责来源读取认证历史、自身活动或安全调查表加权，并保留查询的实际投影和聚合语义。summarize、count 等一行聚合不能升级为原始事件恢复，返回行也不证明客户端持久保存。LAQueryLogs 不覆盖所有服务间执行，Sentinel 各门户和调查入口的公开覆盖说明存在差异；未经入口验证的部分标记 outside_validated_coverage，不能用缺少事件排除读取。
            en: Join approved work by principal, workspace, and a fifteen-minute window. Weight out-of-duty access to authentication history, the principal's own activity, or security-investigation tables while retaining actual projection and aggregation semantics. One-row summarize or count results do not establish raw-event recovery, and returned rows do not establish client retention. LAQueryLogs does not cover all service-to-service execution, and public descriptions of Sentinel portal and investigation-entry coverage differ. Mark unvalidated entry paths outside_validated_coverage rather than excluding reads because an audit event is absent.
      data_requirements:
        - source_type: azure-laquerylogs
          name: {zh: 预先启用的 Log Analytics 查询审计, en: Previously Enabled Log Analytics Query Audit}
          channel: LAQueryLogs
          required_fields: [TimeGenerated, AADTenantId, AADObjectId, AADClientId, RequestTarget, RequestContext, QueryText, ResponseCode, ResponseRowCount, CorrelationId]
        - source_type: approved-log-workspace-query-scope
          name: {zh: 已批准 workspace 与查询职责范围, en: Approved Workspace and Query-Duty Scope}
          channel: null
          required_fields: [principal_id, workspace_id, approved_start, approved_end, permitted_tables, validated_entry_path]
      observables:
        - {zh: 查询正文与目标资源、主体、返回状态和行数, en: Query text and target resources with principal, response status, and returned-row count}
        - {zh: 查询覆盖验证状态与主体职责或批准任务的偏差, en: Query-coverage validation state and deviation from principal duties or approved work}
      correlation:
        window: {zh: 查询与批准任务十五分钟；职责及表访问基线三十天。, en: Query-to-approved-work join 15m; duty and table-access baseline 30d.}
        dimensions: [aad_tenant_id, aad_object_id, workspace_id, aad_client_id, correlation_id, query_thumbprint]
      false_positives:
        - {zh: 威胁狩猎、管理员自查、调查自身工单和跨 workspace 正常响应。, en: Threat hunting, administrator self-review, investigation of one's own tickets, and legitimate cross-workspace response.}
      blind_spots:
        - {zh: 未启用审计、服务间查询、未验证的门户入口、混淆字符串、查询别名和审计投递缺失。, en: Disabled auditing, service-to-service queries, unvalidated portal entry paths, obfuscated strings, query aliases, and missing audit delivery.}
      tuning_guidance:
        paragraphs:
          - zh: 按真实表结构、workspace 权限模式和入口测试维护覆盖表；对相同主体的正常工作保留按任务到期的例外，不永久排除安全团队。对别名和查询函数进行语义展开，保留不可展开状态，不把行数阈值视为数据泄露证明。
            en: Maintain a coverage table based on actual schemas, workspace access mode, and entry-path tests. Retain task-expiring exceptions for a principal's legitimate work rather than excluding the security team permanently. Resolve aliases and query functions semantically where possible, retain unresolved states, and never treat a row-count threshold as proof of disclosure.
      evidence_keys: [B015-T1654-REF-AZURE-QUERY-AUDIT, B015-T1654-REF-AZURE-QUERY-SCHEMA, B015-T1654-REF-SENTINEL-AUDIT]
  mitigations:
    - temporary_key: B015-T1654-MIT-LOG-READ-BOUNDARY
      resolution: create
      name: {zh: 日志读取权限与检索问责, en: Log Read Authorization and Query Accountability}
      summary: {zh: 将日志与调查反馈限定于获批读取者，并验证检索审计及独立审查链。, en: Restrict logs and investigation feedback to approved readers while validating query auditing and independent review.}
      description:
        paragraphs:
          - zh: 日志既支持防守也暴露身份关系和响应信息，因此读取权需要单独治理，不能仅保护写入与删除。对敏感通道、云事件历史、集中 workspace 和导出副本分别限定读取身份与工作范围，保留必要收集器的正常访问，并将查询审计与其审查权限分离。该控制减少攻击者利用既有记录了解环境和响应的机会，不以减少日志采集为代价。
            en: Logs support defense while exposing identity relationships and response information, so read access requires governance separate from write or delete protection. Limit reader identities and work scope across sensitive channels, cloud history, centralized workspaces, and exported copies while preserving required collector access and separating query-audit review authority. This reduces opportunities to learn the environment and response through existing records without sacrificing log collection.
      domains: [enterprise]
      measures:
        - key: reader-scope
          name: {zh: 最小日志读取范围, en: Least Log Read Scope}
          description:
            paragraphs:
              - zh: 盘点敏感通道、集中日志与导出副本的有效读者，按职责限制通道访问描述符、日志平台 RBAC 和云历史读取权限；对广域调查授权设置到期和任务依据，以真实收集器身份回归验证读取与转发仍有效。
                en: Inventory effective readers of sensitive channels, centralized logs, and exported copies. Restrict channel access descriptors, logging-platform RBAC, and cloud-history permissions by duties; make broad investigation grants expire against approved work and regression-test reads and forwarding under real collector identities.
          control_type: exposure-reduction
        - key: query-accountability
          name: {zh: 读取审计与独立审查, en: Read Auditing and Independent Review}
          description:
            paragraphs:
              - zh: 预先开启适用的进程与查询审计，使用成功、失败、空返回和聚合查询验证入口、身份与结果字段，将审计送至读取者不能任意管理的审查范围。按任务核对高价值记录的检索，并记录未覆盖入口；不能用记录的完整性校验替代读取审计。
                en: Enable applicable process and query auditing in advance and validate entry paths, identities, and outcome fields with successful, failed, empty, and aggregate queries. Deliver audit into a review scope that readers cannot freely administer, reconcile high-value searches with work items, and record uncovered entry paths. Log-integrity checks do not substitute for read auditing.
          control_type: detective-support
      applications:
        - target_key: B015-T1654-PARENT
          use:
            paragraphs:
              - zh: 针对本项，核对 Windows 敏感通道实际访问描述符和必要 Event Log Readers，撤回无职责身份的 cloudtrail:LookupEvents，并按 workspace 或表职责配置 Azure 日志读权。同步检查导出文件和历史副本的继承权限，验证对应查询审计；调查期间以受控身份和管理端执行检索，使攻击者难以借被盗普通账户实时读取驱逐反馈。
                en: For this technique, inspect actual Windows sensitive-channel access descriptors and necessary Event Log Readers membership, remove cloudtrail:LookupEvents from identities without a corresponding duty, and scope Azure log reads by workspace or table duties. Check inherited rights on exports and historical copies and validate corresponding query audits. Use controlled identities and administration endpoints during investigations to make real-time eviction feedback harder to obtain through stolen ordinary accounts.
          expected_effect:
            paragraphs:
              - zh: 缩小可调查的来源与记录范围，减少响应反馈暴露，并使异常查询具有可核查主体和任务上下文。借用合法工具仍可发生，但合法外观不再自动对应广域读权；独立审查可补充区分调查目的所需的上下文。
                en: Reduce accessible source and record scope and exposure of response feedback while attaching verifiable principal and task context to unusual queries. Legitimate utilities remain usable, but their appearance no longer automatically carries broad read access; independent review supplies context needed to distinguish investigation purpose.
          limitations:
            paragraphs:
              - zh: 已控制高权限读者、日志服务或离线副本的攻击者仍可能取得记录；RBAC 模式、继承和必要运维授权需要逐平台验证。权限收紧不能撤回已取得内容，启用审计不能补采历史读取，也不能保证覆盖所有服务间和本地 API 路径。错误描述符可能破坏收集，必须保留回归和恢复路径。
                en: An adversary controlling privileged readers, the logging service, or offline copies can still obtain records. RBAC modes, inheritance, and necessary operations grants need platform-specific validation. Tightening access cannot recall acquired content, and new auditing cannot backfill historical reads or guarantee all service-to-service and local API paths. Incorrect descriptors can disrupt collection, requiring regression and recovery paths.
      evidence_keys: [B015-T1654-REF-CHANNEL-ACCESS, B015-T1654-REF-AZURE-ACCESS, B015-T1654-REF-AWS-FAQ, B015-T1654-REF-AZURE-QUERY-AUDIT, B015-T1654-REF-SENTINEL-AUDIT, REF-000623]
