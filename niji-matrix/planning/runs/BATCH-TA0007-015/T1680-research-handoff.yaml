  result_evidence_ladder:
    - level: launched_or_processed
      supported_by: Process creation, shell command entry or script-block processing
      does_not_establish: Query executed to completion, valid storage objects or returned attributes
    - level: query_attempted
      supported_by: Runtime or management-operation evidence specifically identifying a storage query
      does_not_establish: Success, returned values, full host coverage or harmful use
    - level: query_success_indicated
      supported_by: Actual interface status or verified command completion
      does_not_establish: Full returned object set if content is not retained; execve success is not command completion
    - level: valid_storage_result
      supported_by: Matching output or result record with actual drive/disk/volume identity and requested attributes
      does_not_establish: Remote share-set enumeration, file-content acquisition, raw-view bypass, encryption or destruction
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: "定义分开存储对象与其结果，匿迹特性保留普通盘点冲突和结果日志缺口，范围显式处理主机与云资源、映射与共享、路径与卷、发现与原始读取。威胁模型不默认管理员，防御不假设进程日志带返回值；限制保留平台和实案差异。未套用 NJT-0001 的机理或子项数量，正文需由主 Agent 再审。"
      en: "Definition separates storage objects and results; stealth characteristics preserve normal-inventory ambiguity and missing result logs; boundaries explicitly distinguish host state from cloud resources, mappings from shares, paths from volumes, and discovery from raw reads. The threat model does not assume administrator rights and defenses do not invent return values in process logs. Limitations retain platform and incident-evidence differences. NJT-0001 mechanism or child counts were not copied; the primary agent must review the prose again."
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [read-only catalog searches, YAML serialization and parse checking of this handoff]
  limitations:
    paragraphs:
      - zh: "目前真实恶意行为主要由 Microsoft 对 Volt Typhoon 的一手调查支撑，未公开逐主机返回容量、完整工具参数、成功或失败状态和查询时刻的检测结果。官方文档证明接口能力与正常需求，不证明攻击者选择接口是为了匿迹；Linux、macOS 和 ESXi 的平台范围也不能由一个 Windows 活动案例自动获得同等实案强度。"
        en: "Real adversarial behavior is presently anchored mainly in Microsoft's firsthand Volt Typhoon investigation, which does not disclose per-host capacities, complete utility arguments, success or failure status, or detection outcomes at query time. Official documentation establishes interfaces and legitimate needs rather than attacker choice for stealth. The Linux, macOS, and ESXi scope does not automatically receive equal incident support from one Windows campaign."
      - zh: "防御方案的字段和通道有文档依据，尚未在域端点、Linux 审计和 ESXi 主机部署验证。进程、脚本与命令日志缺返回内容，原生 API、GUI、配额和命名空间差异仍限制判断；macOS 的独立分析待验证实际传感器合同。未证明的实现、时间和来源变量保留为 deferred，未来同案调用与返回记录、正常基线和观察差分可改变分类与置信度。"
        en: "Defense fields and channels have documentary support but have not been deployed on domain endpoints, Linux audit, or ESXi hosts. Process, script, and command records lack return content, while native APIs, GUIs, quotas, and namespace differences constrain interpretation; a macOS-specific analytic awaits a verified sensor contract. Unproved implementation, timing, and origin variables remain deferred. Same-incident invocation and return records, legitimate baselines, and observation differentials could change taxonomy and confidence."
  rejected_mechanisms:
    - mechanism_ref: NM-BT
      reason: In-process APIs and missing default audit are observation gaps, but examined evidence does not establish attacker-designed exploitation of the gap or a particular path selected for evasion.
    - mechanism_ref: NM-ST
      reason: No storage-specific intentional timing or complementary source partition evidence; routine monitoring cadence is insufficient.
    - mechanism_ref: NM-DO
      reason: No supported concealment of storage-query payload, return values or query syntax; encrypted downstream traffic is a separate object.
  open_questions:
    - Obtain an incident trace showing deliberate in-process or cached storage discovery with a comparator and output.
    - Validate Windows 4104 fragment schema and Linux audit normalization in deployed collectors.
    - Validate ESXi World ID joins and read-only esxcli coverage on installed versions; all SDK calls remain outside shell-only coverage.
    - Add a macOS-specific analytic only after inspecting an actual endpoint execution/session data contract.
