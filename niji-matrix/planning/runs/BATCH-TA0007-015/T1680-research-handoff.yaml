        en: "Microsoft observed discovery of filesystem types, drive names, capacity, and free space during Volt Typhoon investigations."
      evidence_keys: [REF-000073]
      evidence_mode: observed-adversarial-use
      confidence: high
      limitation: No command-by-command return data, storage-specific evasion choice or measured detection effect is supplied.
    - key: B015-T1680-CLM-BOUNDARY
