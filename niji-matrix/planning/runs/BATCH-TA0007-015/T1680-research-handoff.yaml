  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: [host_drive_disk_partition_volume_attributes, windows_logical_and_mapped_drives, linux_block_and_filesystem_state, macos_disks, esxi_storage, provider_volume_resources]
    breadth_trigger: ordinary
    coverage_resolutions:
      - {cluster: Host storage identities and attributes, disposition: parent-core}
      - {cluster: Platforms and command/API interfaces, disposition: not-stealth-distinct}
      - {cluster: Provider-provisioned volume inventory, disposition: adjacent-technique, target_ref: NJT-0139}
      - {cluster: .vmdk paths or arbitrary directory PSDrives, disposition: adjacent-technique, target_ref: NJT-0182}
      - {cluster: Raw sensitive-content reads, disposition: adjacent-technique, target_ref: NJT-0108}
    candidate_stealth_axes_examined:
      - key: in-process-query-placement
        variable: Attacker chooses storage-query code inside an already running process instead of a separate utility.
        prerequisites: Controlled code execution and compatible storage API; no assumption of administrator rights for every API.
        trace_change: May remove a separate child-process command line while leaving API invocation and results within the existing process.
        defender_effect: Process-launch-only detection can miss query semantics; runtime/API instrumentation would differ.
        evidence: Official GetDriveType/GetDiskFreeSpaceEx/GetVolumeInformation capabilities; Microsoft case establishes storage discovery without this implementation.
        disposition: evidence-deferred
        reason: No same-incident evidence of intentional in-process selection, relative trace comparison or observed evasion. API versus CLI alone is an interface split, so no NJS.
      - key: reuse-existing-storage-view
        variable: Read an existing host storage database or cached view rather than trigger fresh block-device probing.
        prerequisites: Readable, sufficiently fresh view and matching object scope.
        trace_change: lsblk normally reads sysfs and udev; direct labels/types probing occurs under documented fallback conditions.
        defender_effect: Device-probe observations and catalog/view-read observations differ; returned facts can be stale.
        evidence: REF-000994 documents capability and fallback, not attacker preference.
        disposition: evidence-deferred
        reason: A default implementation and legitimate cache use do not prove attacker-controlled evasion. No adversarial source/output/trace comparison.
      - key: query-scope-minimization
        variable: Select only necessary devices or attributes rather than broad inventory.
        prerequisites: Prior target knowledge and sufficient feedback.
        trace_change: Fewer requested targets/fields, but event density and API request count are not guaranteed to decrease.
        defender_effect: A narrow query can resemble ordinary free-space checks; role and target context become more useful.
        evidence: lsblk explicit devices/columns and Microsoft API individual-root queries are documented; adversarial controlled comparison absent.
        disposition: evidence-deferred
        reason: Functional request scoping is not by itself a stable stealth child; legitimate capacity checks are strong counterexamples.
      - key: temporal-query-dilution
        variable: Spread independent storage questions over longer intervals.
        prerequisites: Time tolerance and storage facts remaining useful.
        trace_change: Hypothesized lower short-window density.
        defender_effect: Would require longer session or principal correlation if deliberately implemented.
        evidence: No candidate-specific observed implementation, schedule or evasion measurement found in examined primary sources.
        disposition: evidence-deferred
        reason: Do not import NJT-0001 timing children into host storage discovery or infer evasion from ordinary monitoring intervals.
      - key: cross-principal-query-partition
        variable: Partition complementary host-storage questions across controlled sessions or identities.
        prerequisites: Multiple controlled principals and a shared result-aggregation path.
        trace_change: Hypothesized fragmentation of one inventory across identities.
        defender_effect: Would require identity-independent host/object joins.
        evidence: No storage-specific multi-principal complementarity or aggregation evidence found.
        disposition: evidence-deferred
        reason: Multiple administrators, host roles or mappings are ordinary conditions and cannot establish deliberate partitioning.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: "零个 ATT&CK 子项未阻止开放研究，五种独立匿迹轴已分别检查。当前证据足以支持父行为及共享正常接口的中等机理，不足以把某个实现分裂成稳定、防御有别的子项；保留 deferred 而非宣称永远无子技术。"
      en: "Zero ATT&CK children did not stop open-ended inquiry; five distinct stealth axes were examined. Evidence supports the parent behavior and a medium-confidence normal-interface overlap mechanism but does not justify splitting an implementation into a stable child with distinct defense requirements. Keep deferred rather than claiming no future taxonomy."
  six_step_causal_review:
    - step: Behavior and direct purpose
      finding: Acquire host-visible storage facts for environmental knowledge; Microsoft provides observed hostile discovery.
    - step: Attacker-controlled design
      finding: Query interface, subject/session and target attributes can be selected, but the case does not demonstrate a particular evasion instruction.
    - step: Trace change
      finding: Reuse of legitimate query interfaces produces ordinary inventory-like command/method appearance; in-process or cached variants remain deferred.
    - step: Defender observation effect
      finding: Single-event classification cannot reliably distinguish maintenance and adversarial targeting; request telemetry generally lacks returned facts.
    - step: Stealth effect and competing explanation
      finding: Reduced distinguishability is a reasoned medium-confidence consequence; normal monitoring/repair strongly competes, and no event-loss or measured miss claim is made.
    - step: Evidence, defense and limits
      finding: Combine Microsoft incident evidence with implementation and telemetry sources. Recover caller/request lineage and job context; result confirmation and independent child existence remain separate gates.
  evidence_coverage:
    parent_behavior_keys: [REF-000073, B015-T1680-REF-LOGICALDISK, REF-000994, B015-T1680-REF-ESXCLI, B015-T1680-REF-APPLE]
    boundary_keys: [B015-T1680-REF-PSDRIVE, B015-T1680-REF-DRIVETYPE, B015-T1680-REF-FREESPACE, B015-T1680-REF-VOLUMEINFO]
    mechanism_support:
