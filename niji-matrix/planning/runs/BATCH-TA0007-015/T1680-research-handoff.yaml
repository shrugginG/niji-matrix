      proposition:
        zh: "驱动器或卷属性与文件命名空间、远端共享集合和云资源清单是不同直接结果；Get-PSDrive 还可能返回非存储 provider。"
        en: "Drive or volume attributes differ from file namespaces, remotely available share sets, and cloud resource inventories; Get-PSDrive can also return non-storage providers."
      evidence_keys: [B015-T1680-REF-LOGICALDISK, B015-T1680-REF-PSDRIVE, B015-T1680-REF-DRIVETYPE, REF-000994]
      evidence_mode: documented-capability-and-boundary-analysis
      confidence: high
    - key: B015-T1680-CLM-FEATURE-OVERLAP
      disposition: create
      proposition:
        zh: "恶意存储测绘可使用正常盘点和容量维护接口；单次工具或查询外观不足以区分控制者意图，但未证明检测下降幅度。"
        en: "Adversarial storage mapping can use normal inventory and capacity-maintenance interfaces; one utility or query appearance is insufficient to distinguish controller intent, without proving the magnitude of detection reduction."
      evidence_keys: [REF-000073, B015-T1680-REF-LOGICALDISK, B015-T1680-REF-FREESPACE, REF-000994, B015-T1680-REF-APPLE]
      evidence_mode: observational-inference
      confidence: medium
    - key: B015-T1680-CLM-DEFENSE-LEVELS
      disposition: create
      proposition:
        zh: "进程、脚本块、执行审计和 ESXi shell 记录可恢复请求和主体，但不能普遍证明返回的存储属性；查询结果需额外输出证据。"
        en: "Process, script-block, execution-audit, and ESXi shell records can recover requests and principals but do not universally establish returned storage attributes; query results require additional output evidence."
      evidence_keys: [REF-000598, REF-000463, B015-T1680-REF-AUDITCTL, B015-T1680-REF-AUSEARCH, B015-T1680-REF-ESXI-AUDIT]
      evidence_mode: documented-telemetry-analysis
      confidence: high
