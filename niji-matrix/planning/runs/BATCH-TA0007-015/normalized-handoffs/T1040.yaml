  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 保留 T1040 在环境测绘中的被动观察核心，将正式对象限定为从实际可见的既有报文取得主机、地址、通信关系或服务线索。该对象的区别在于信息从未向目标发起测绘请求的观察面返回，目标侧成功认证和请求日志不必增加测绘事务。ATT&CK
        Enterprise 19.1 工作簿与 NIST 的被动发现说明支持父级相关性，操作系统和设备文档支持可实施观察面，但没有公开量化本对象的告警下降幅度。
      en: Preserve T1040's passive-observation core within Discovery and bound the formal object to host, address, communication-relationship,
        or service clues derived from packets actually visible at an observation point. Its distinction is that information
        returns through an observation surface without directing a discovery request to the target, so target authentication
        and request logs need not contain an additional mapping transaction. The ATT&CK Enterprise 19.1 workbook and NIST's
        treatment of passive discovery support parent relevance, while operating-system and device documentation establish
        implementable observation surfaces. Public evidence does not quantify alert reduction for this object.
    - zh: 建议单独建对象，而非给 NJT-0176 增加战术标签。NJT-0176 及其三个子项明确要求认证材料结果，并将纯主机、端口、服务和拓扑信息导向 Discovery；其材料评估、凭据恢复和轮换门禁应保持原义。本对象则要求说明事实来自哪个报文或解析结果，不要求得到任何凭据。相同抓包若独立证明两种结果可同时标注，不能以其中一种结果代替另一种。
      en: Create a separately bounded object rather than adding a tactic tag to NJT-0176. NJT-0176 and its three children
        explicitly require an authentication-material outcome and route host, port, service, and topology information to Discovery;
        their material-assessment, recovery, and rotation gates should retain their meanings. This object instead requires
        provenance for facts in packets or parsed results and does not require credentials. A capture can carry both labels
        when each outcome is independently supported, but one outcome cannot substitute for the other.
proposed_content:
  name:
    zh: 网络流量被动测绘
    en: Passive Network-Traffic Mapping
  summary:
    zh: 攻击者从已能观察的网络报文提取主机、通信关系和服务线索，以减少向目标主动查询产生的痕迹；事实范围受观察位置、流量出现时间和可解释字段限制。
    en: An adversary extracts host, communication-relationship, and service clues from network packets already visible to
      it, reducing traces from active target queries; knowledge remains limited by vantage point, traffic timing, and interpretable
      fields.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 网络流量被动测绘是攻击者在受控主机、既有转发节点或流量副本上观察已经发生的通信，将可见报文中的地址、名称、协议和会话关系转换为环境知识。直接目标是了解哪些主体在通信、通信方向和可能的服务角色，为选择后续查询、横向路径或目标提供依据；不以产生新的目标响应作为测绘的必要条件。
      en: Passive Network-Traffic Mapping observes communications already occurring at an adversary-controlled host, existing
        forwarding node, or traffic copy and converts visible packet addresses, names, protocols, and session relationships
        into environmental knowledge. Its immediate purpose is to learn which entities communicate, in which direction, and
        with which possible service roles to inform subsequent queries, lateral paths, or target selection. Creating a new
        target response is not a necessary part of the mapping.
    - zh: 该概念由信息取得关系和结果定义，不由抓包工具、接口、PCAP 扩展名或云厂商定义。包捕获权限、开始命令和镜像配置只说明具备或请求观察能力；有效会话、实际接收报文和已解释的环境事实是不同证据阶段。端口号只能直接证明某次报文所带端口，不能单独证明服务实现、软件版本、可访问性或漏洞；这些结论必须保留协议证据和推断等级。
      en: The concept is defined by the acquisition relationship and information outcome rather than a capture tool, interface,
        PCAP extension, or cloud provider. Capture authority, a start command, and a mirror configuration establish capability
        or a request to observe. An active session, actual packet receipt, and interpreted environmental facts are separate
        evidentiary stages. A port number directly establishes only the port in that packet; service implementation, software
        version, accessibility, or vulnerability conclusions require protocol evidence and an explicit inference level.
  stealth_characteristics:
    paragraphs:
    - zh: 网络流量被动测绘可使测绘读取发生在目标请求日志之外：原会话的源、目的和业务结果可以保持不变，而攻击者在另一个进程、设备缓冲或收集器中得到信息。只按新连接、端口扫描和目标侧查询频率监测的防守方可能无法识别这一读取动作，主要残余转为捕获主体、接口与过滤条件、镜像复制边、缓冲或解析产物及其去向。
      en: Passive Network-Traffic Mapping can place the discovery read outside target request logs. Original session endpoints
        and business results can remain unchanged while information reaches another process, device buffer, or collector.
        Monitoring based only on new connections, port scans, or target query frequency can miss that read. Principal residue
        instead appears in the capture principal, interface and filter, mirror copy edge, buffer or parsed artifact, and its
        destination.
    - zh: 原生诊断和监测能力的使用还会使采集动作与故障诊断、资产测量和安全监控相似，工具名与抓包格式因而难以区分意图。观察并不等于零网络活动：名称补全、远程管理、镜像传输或产物导出均可能产生独立连接。端到端加密限制正文解释，但地址、时序和部分头部等环境线索仍可能可见；静默主机、不可见交换端口和未覆盖时段也限制知识完整度。
      en: 'Native diagnostic and monitoring functions can make acquisition resemble troubleshooting, asset measurement, and
        security monitoring, so tool names and capture formats poorly distinguish intent. Observation does not imply zero
        network activity: name enrichment, remote administration, mirror transport, and artifact export can generate separate
        connections. End-to-end encryption limits payload interpretation while addresses, timing, and some headers can remain
        visible. Quiet hosts, unseen switch ports, and uncovered periods also limit knowledge completeness.'
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入从原端点、原有路径或不改变原交付的复制分支读取既有报文，并由这些报文取得环境事实的行为。普通网卡并不天然看见交换网络的全部流量，混杂模式也不能穿透未送达该端口的流量。主动服务探测和协议查询由 T1046 对应对象或 NJT-0001
        等主动交互对象承接；从日志、配置存储或云资产 API 读取历史记录不因内容涉及网络就成为报文嗅探。
      en: Include reading existing packets at an original endpoint, original path, or copy branch that does not change original
        delivery and deriving environmental facts from those packets. An ordinary network interface does not inherently see
        all switched-network traffic, and promiscuous mode cannot expose traffic never delivered to that port. Active service
        probes and protocol queries belong to the T1046 object or active-interaction objects such as NJT-0001. Reading historical
        logs, configuration stores, or cloud inventory APIs is not packet sniffing merely because the information concerns
        a network.
    - zh: 主动修改名称、网关、路由或代理以改变服务指向的行为由 NJT-0136 承接，诱使受害者新产生认证交换由 NJT-0165 承接；后续独立的被动观察结果可另行记录。认证材料获取归 NJT-0176，普通正文获取归相关 Collection
        对象。单一事件中的地址事实、可恢复凭据、正文和后续账户使用必须分别举证。合法诊断、NDR、事件响应和容量分析使用同样采集能力，需按主体、用途、源范围、输出目的地、期限及批准记录区分。
      en: Active changes to names, gateways, routes, or proxies that replace service direction belong to NJT-0136, and inducing
        a victim to emit a new authentication exchange belongs to NJT-0165; a separately supported passive-observation result
        can also be recorded. Authentication-material acquisition belongs to NJT-0176, and ordinary content acquisition to
        the applicable Collection object. Address facts, recoverable credentials, content, and later account use in the same
        event each require their own evidence. Authorized diagnostics, NDR, incident response, and capacity analysis use the
        same acquisition capabilities and require distinction by principal, purpose, source scope, destination, duration,
        and approval.
    - zh: 主动查询已发布的服务公告并读取自己的正常响应，属于主动发现关系，由 T1046 对应对象承接；不能只因信息经过网络返回就称为嗅探。只有另行建立的包捕获或观察关系，从预先存在或其他客户端产生的公告流量取得环境事实，才属于本对象；同一事务的查询响应和独立旁听证据必须分开。
      en: Actively querying published service advertisements and reading the normal response to one's own query is an active
        discovery relationship covered by the T1046 object, not sniffing merely because information returns over a network.
        This object requires a separately established packet-capture or observation relationship deriving facts from preexisting
        advertisements or traffic generated by other clients. Query-response evidence and independent listening evidence must
        remain separate even within one transaction.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在取得内部观察位置后，攻击者可等待普通业务或广播、组播通信出现，整理实际交谈的地址和名称，并在无需逐台主动询问的条件下选择后续调查目标。适用于允许较长观察时间且目标会产生可见流量的环境；只看到客户端连接某端口仍不足以证明服务可从攻击者位置访问。
        en: After obtaining an internal vantage point, the adversary can wait for business or broadcast and multicast traffic,
          organize addresses and names actually communicating, and select further investigation targets without actively querying
          every host. This suits environments that permit longer observation and where relevant targets produce visible traffic.
          Seeing a client contact a port still does not establish that the service is reachable from the adversary's position.
      - zh: 既有网络设备或合法监控收集器失陷时，攻击者可能利用这些位置已经拥有的流量可见性，按接口和时间提取通信关系。Talos 对 VPNFilter 插件的逆向分析证明原始套接字嗅探与 Modbus 流量识别能力存在；该资料用于说明实现能力，不证明某受害网络的资产清单已返回，也不把工业目标另立为子技术。
        en: When an existing network device or authorized monitoring collector is compromised, an adversary may use visibility
          already held there to derive communication relationships by interface and time. Talos's reverse engineering of a
          VPNFilter plugin establishes raw-socket sniffing and Modbus traffic-recognition capability. This supports implementation
          feasibility, not a claim that an asset inventory was returned from a particular victim, and does not make industrial
          targets a separate child.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须控制一个实际可接收目标报文的观察位置，并具备该位置要求的权限，例如 Linux CAP_NET_RAW、管理员抓包权限、网络设备特权命令或云镜像创建权限。权限与可见性不能互相替代；要跨未覆盖网段观察，必须另行取得转发、镜像或物理接入条件，不能假定一次混杂模式设置即可覆盖全部内部网络。
          en: The adversary must control a vantage point that actually receives relevant packets and possess the authority
            required there, such as Linux CAP_NET_RAW, administrative capture rights, privileged network-device commands,
            or cloud mirror-creation permissions. Authority and visibility do not substitute for one another. Observing uncovered
            segments requires separately established forwarding, mirroring, or physical-access conditions rather than assuming
            one promiscuous-mode setting covers the entire internal network.
        - zh: 攻击者还需能解释所见协议或元数据，并容忍等待目标通信；对加密正文的解释另需终止位置或解密条件。即使没有完整 PCAP，实时解析也可能产出事实，因此保存文件不是必要前提。静默目标、丢包、采样、封装、NAT 和过期地址映射会降低知识质量，后续验证可能需要另一个主动技术。
          en: The adversary also needs to interpret observed protocols or metadata and tolerate waiting for target communications;
            encrypted payload interpretation separately requires termination access or decryption conditions. Real-time parsing
            can produce facts without a complete PCAP, so file retention is not necessary. Quiet targets, loss, sampling,
            encapsulation, NAT, and stale address mappings reduce knowledge quality, and subsequent validation may require
            a separate active technique.
      defender_model:
        paragraphs:
        - zh: 防守方假定可以取得至少一种观察面生命周期证据，并以资产角色和合法诊断任务建立授权关系。端点可提供进程与抓包输出，设备可提供命令记账和运行缓冲状态，镜像控制面可提供资源变更及收集器记录。目标服务日志通常不记录谁旁听了报文；采集器接收计数只证明接收，环境事实确认还依赖受限的解析或取证证据。
          en: The defender is assumed to obtain at least one observation-surface lifecycle source and maintain authorization
            relationships using asset roles and legitimate diagnostic tasks. Endpoints can provide process and capture output,
            devices command accounting and buffer state, and mirror control planes resource changes and collector records.
            Target service logs normally do not identify packet listeners. Collector receipt counters establish receipt only;
            confirmed environmental facts additionally require restricted parsing or forensic evidence.
        - zh: 防守方应保存事件时资源版本、接口或组件映射和有限的结果溯源，而非将完整报文正文广泛汇入 SIEM。确认记录可包含产物 hash、帧号或记录号、所见事实类别、观察时间、解析器和推断等级。设备未启用审计、合法收集器被劫持、内存内解析以及物理接收器可能超出该观察模型；无法取得结果时应保留较低阶段的异常而不推断已取得环境知识。
          en: Retain event-time resource versions, interface or component mappings, and bounded result provenance rather than
            broadly centralizing full packet payloads in a SIEM. Confirmation can record artifact hash, frame or record number,
            fact class, observation time, parser, and inference level. Unaudited devices, hijacked authorized collectors,
            memory-only parsing, and physical receivers may fall outside this model. When results are unavailable, retain
            the lower-stage anomaly without asserting acquired environmental knowledge.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 从既有流量取得环境线索使读取动作落在目标查询日志之外
      en: Derive environmental clues from existing traffic outside target query logs
    analysis:
      paragraphs:
      - zh: 攻击者选择可接收既有报文的观察位置而不必向目标发起新的发现请求，原会话仍可正常完成。测绘痕迹因而从目标查询事件移向捕获进程、设备缓冲和复制控制面，依赖扫描频率或目标请求日志的监测难以直接看到旁听读取。NIST 对被动发现的说明和包捕获接口支持这一因果关系；匿迹效果只相对于缺少观察面遥测的防守模型成立，不能据此宣称抓包天然不可检测。
        en: The adversary chooses a position receiving existing packets without needing to send a new discovery request, and
          original sessions can complete normally. Mapping residue moves from target query events into capture processes,
          device buffers, and copy control planes. Monitoring based on scan frequency or target request logs cannot directly
          see the listening read. NIST's passive-discovery treatment and packet-capture interfaces support this chain, whose
          stealth effect is conditional on missing observation-surface coverage rather than inherent undetectability.
    evidence_keys:
    - B015-T1040-REF-NIST115
    - REF-000796
    - REF-000794
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 借用合法流量诊断外观增加未授权测绘与正常监控的区分成本
      en: Borrow legitimate traffic-diagnostic features to complicate distinction from authorized monitoring
    analysis:
      paragraphs:
      - zh: 使用原生抓包和镜像能力时，采集命令、过滤器、资源类型和输出格式与合法诊断相同，恶意与正常差异主要体现在主体授权、观察范围和结果处置。防守方即使发现采集也不能仅凭工具名判断目的，需要连接工单、业务所有者和输出去向。官方实现文档支持外观重叠，联合通告证明原生抓包能力确被攻击者滥用，但通告的凭据案例不证明本对象的环境结果，且没有测量这种相似性带来的检测下降。
        en: Native capture and mirroring use commands, filters, resource types, and output formats also used by authorized
          diagnostics. The main malicious distinctions concern principal authorization, observed scope, and result handling.
          Even visible acquisition requires approval, business-owner, and destination context to interpret purpose. Implementation
          documentation establishes the feature overlap, and the joint advisory establishes adversary abuse of native capture.
          Its credential-focused cases do not establish this object's environmental outcomes, and no measurement quantifies
          a resulting detection reduction.
    evidence_keys:
    - REF-000794
    - REF-000797
    - REF-000795
    - REF-000792
    confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
      - zh: 已分别审查观察位置与复制拓扑、禁止主动名称补全、窄过滤与截短报文、短时或环形缓冲、实时解析替代持久文件等变量。观察位置可以改变痕迹所在平面，但本批环境结果证据不足以把 NJT-0176 的认证端点、转发路径和复制面三个子项改名复用；其原有材料门禁与本对象不同。其他变量虽有能力文档，尚未取得有意选择、事实保持和防守观察差异的完整对照。
        en: The review separately examined observation position and copy topology, suppression of active name enrichment,
          narrow filters and packet truncation, short or circular buffering, and real-time parsing in place of persistent
          files. Position can change the trace plane, but environmental-outcome evidence here does not justify renaming NJT-0176's
          authentication-endpoint, transit-path, and replicated-plane children, whose material gates differ. Other variables
          have capability documentation without a complete comparison of intentional selection, retained facts, and defender
          observation.
      - zh: 当前子技术分类暂缓，正式子项为空。被动观察本身属于父级核心，主动路径介入和新诱发认证属于相邻技术；协议、云平台、网卡、工具和工业目标不是匿迹变量。后续取得结果级对照后可重开候选轴，零个 ATT&CK 子项既不限制 Niji
          子项数量，也不构成停止分类研究的理由。
        en: Defer the child taxonomy with no formal children. Passive observation belongs to the parent core, while active
          path intervention and newly induced authentication belong to neighboring techniques. Protocols, cloud platforms,
          interfaces, tools, and industrial targets are not stealth variables. Result-level comparisons can reopen candidate
          axes later; zero ATT&CK children neither limits the number of Niji children nor justifies ending taxonomy research.
    coverage: deferred
    subtechnique_refs: []
  research:
    limitations:
      paragraphs:
      - zh: 公开资料支持被动测绘能力与相应观察差异，但本批没有找到可确认某个受害者环境事实从嗅探返回的合格案例。DarkVishnya 报告将环境调查归于主动扫描，将嗅探对象写为登录数据；VPNFilter 报告的逆向分析支持嗅探和协议识别能力而非特定受害者资产结果，CISA
          通告的原生 PCAP 重点是认证流。这些来源不能互相拼接成一次环境信息获取事务。
        en: Public sources support passive-mapping capability and corresponding observation differences, but this batch found
          no qualifying case confirming environmental facts returned through sniffing from a specific victim. DarkVishnya
          assigns environmental surveying to active scanning and describes sniffing login data. VPNFilter reverse engineering
          supports sniffing and protocol-recognition capability rather than a victim-specific asset result, while the CISA
          native-PCAP discussion focuses on authentication flows. These sources cannot be joined into one environmental-acquisition
          transaction.
      - zh: 未开展真实主机、网络设备或云环境实验。检测窗口、审批模型、结果溯源字段和调优是实施设计，需验证部署版本和数据保留；镜像资源存在、计数增长或 PCAP 文件存在本身均不证明攻击者解释了内容。被动知识有时间与位置偏差，端到端加密也不能被写成隐藏全部网络事实的保证。正式对象与防御内容应保持
          review，等待人工领域审查。
        en: No live host, network-device, or cloud experiment was conducted. Detection windows, approval models, result-provenance
          fields, and tuning are implementation designs requiring validation against deployed versions and retention. A mirror
          resource, increasing counter, or PCAP file alone does not prove the adversary interpreted content. Passive knowledge
          is time- and location-biased, and end-to-end encryption cannot be presented as hiding all network facts. Formal
          content and defenses should remain in review pending human domain review.
proposed_subtechniques: []
defense_candidates:
  detection_strategies:
  - key: B015-T1040-DET-OBSERVATION-FACT-PROVENANCE
    resolution: create
    name:
      zh: 未授权流量观察与环境事实溯源
      en: Unauthorized Traffic Observation and Environmental-Fact Provenance
    summary:
      zh: 将主机、设备和镜像观察面的授权与生命周期连接到实际报文和分级环境事实，区分可见事实与攻击者已取得的结果。
      en: Join authorization and lifecycle of host, device, and mirrored observation surfaces to actual packets and graded
        environmental facts, separating exposed facts from results acquired by the adversary.
    description:
      paragraphs:
      - zh: 本策略恢复谁在何时通过哪个接口或复制分支观察了哪些流量，再审查观察是否超出获批用途与范围。三项分析分别覆盖 Windows 原生包捕获、网络设备本地抓包和云镜像，使用不同的主机进程、设备会话与资源版本关联键，不能仅凭工具名建立统一告警。
        en: Reconstruct who observed which traffic, when, and through which interface or copy branch, then determine whether
          observation exceeded approved purpose and scope. Three analytics cover Windows native capture, local network-device
          capture, and cloud mirroring with distinct host-process, device-session, and resource-version joins rather than
          one tool-name alert.
      - zh: 结果必须分为 capture-requested、packet-received、facts-exposed 和 fact-return-confirmed。受限分析员从 PCAP 解出事实只支持 facts-exposed；只有攻击者生成的解析输出、会话返回或等效取证证据才支持事实已返回。缺少结果不能关闭未授权观察面告警，也不能升级为已完成测绘。
        en: Grade results as capture-requested, packet-received, facts-exposed, and fact-return-confirmed. Analyst decoding
          of a PCAP supports facts-exposed only. Adversary-generated parsed output, a returned session result, or equivalent
          forensic evidence is required for fact-return-confirmed. Missing results neither close an unauthorized-observation
          alert nor establish completed mapping.
    detects_keys:
    - B015-T1040-PARENT
    domains:
    - enterprise
    analytic_keys:
    - B015-T1040-NJA-WINDOWS
    - B015-T1040-NJA-DEVICE
    - B015-T1040-NJA-MIRROR
    evidence_keys:
    - REF-000366
    - REF-000797
    - REF-000794
    - REF-000795
    - REF-000801
    - B015-T1040-REF-NIST115
  detection_analytics:
  - key: B015-T1040-NJA-WINDOWS
    resolution: create
    strategy_key: B015-T1040-DET-OBSERVATION-FACT-PROVENANCE
    name:
      zh: Windows 抓包组件与环境事实返回溯源
      en: Windows Capture-Component and Environmental-Fact Return Provenance
    summary:
      zh: 关联 Pktmon 进程、过滤器与实际包记录，并区分分析员解码和攻击者输出的事实。
      en: Join Pktmon execution, filters, and packet records while distinguishing analyst decoding from facts in adversary
        output.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 以 host_id 与 ProcessGuid 关联 pktmon start、filter、stop、format 或 etl2pcap 操作和 ETL/PCAPNG 产物，核对同一主体、组件或接口、过滤范围、输出目录及批准窗口。start
          命令只生成 capture-requested；计数器或经验证包记录生成 packet-received。Pktmon 可在多个组件记录同一包，使用 PktGroupId 与 PktNumber 去重，不能把 Appearance
          增长误判为更多主机或更多连接。
        en: Join Pktmon start, filter, stop, format, or etl2pcap operations to ETL or PCAPNG artifacts by host_id and ProcessGuid
          and compare principal, component or interface, filter scope, output location, and approval window. A start command
          yields capture-requested only; counters or validated packet records support packet-received. Pktmon can record one
          packet at multiple components, so deduplicate by PktGroupId and PktNumber rather than treating increasing Appearance
          values as more hosts or connections.
      - zh: 在受限证据库生成事实评估，记录源产物 hash、帧号或包键、观察到的地址或协议字段、推断等级和结果来源。分析员解码报告 facts-exposed；只有保全的攻击者解析文件、控制台返回或内存结果中确有相同事实时才报告 fact-return-confirmed。端口名称映射不得升级为协议、版本或漏洞结论，无匹配工单的观察面即使没有确认结果也保留告警。
        en: Produce a restricted fact assessment containing source-artifact hash, frame number or packet key, observed address
          or protocol field, inference level, and result origin. Analyst decoding yields facts-exposed. Emit fact-return-confirmed
          only when preserved adversary parsing files, console returns, or memory results actually contain those facts. Port-name
          mappings do not establish protocol, version, or vulnerability conclusions. Preserve an unapproved-observation alert
          even without a confirmed result.
    data_requirements:
    - source_type: windows-capture-process
      name:
        zh: Windows 抓包进程与产物事件
        en: Windows capture process and artifact events
      channel: Microsoft-Windows-Sysmon/Operational Event IDs 1 and 11
      required_fields:
      - timestamp
      - host_id
      - ProcessGuid
      - process_image
      - command_line
      - principal_id
      - target_filename
    - source_type: pktmon-preserved-output
      name:
        zh: 保全的 Pktmon 配置与包输出
        en: Preserved Pktmon configuration and packet output
      channel: Pktmon ETL, text conversion, component list and filter list
      required_fields:
      - host_id
      - boot_or_session_id
      - artifact_hash
      - capture_interval
      - component_id
      - filter
      - PktGroupId
      - PktNumber
      - Appearance
      - packet_timestamp
      - decoded_packet_fields
    - source_type: restricted-environment-fact-assessment
      name:
        zh: 受限环境事实与返回证据评估
        en: Restricted environmental-fact and return-evidence assessment
      channel: forensic evidence store and reviewed parser output
      required_fields:
      - case_id
      - artifact_hash
      - record_locator
      - fact_class
      - observed_value_or_digest
      - inference_level
      - result_origin
      - return_evidence_locator
      - reviewer_id
    - source_type: diagnostic-approval
      name:
        zh: 诊断批准范围
        en: Diagnostic approval scope
      channel: change or incident management
      required_fields:
      - ticket_id
      - owner
      - principal_id
      - asset_scope
      - component_or_interface_scope
      - filter_scope
      - output_destination
      - valid_from
      - valid_to
    observables:
    - zh: 未批准主体启动覆盖多个通信对端的抓包，随后出现与源包可核对的地址或协议结果文件
      en: An unapproved principal starts capture covering multiple peers and later produces address or protocol results traceable
        to source packets
    - zh: 合法诊断进程的过滤器、组件、输出目录或持续时间超出工单约束
      en: A diagnostic process uses filters, components, output paths, or duration outside its approved scope
    correlation:
      window:
        zh: 从首条过滤或 start 命令覆盖至 stop、产物生成及其后二十四小时；事实确认按产物 hash 在调查保留期内关联，不把该窗口作为行为成立阈值。
        en: Span the first filter or start command through stop, artifact creation, and twenty-four hours afterward; join
          fact confirmation by artifact hash throughout investigative retention rather than treating the window as a behavioral
          threshold.
      dimensions:
      - host_id
      - ProcessGuid
      - principal_id
      - boot_or_session_id
      - component_id
      - artifact_hash
      - ticket_id
      - time
    false_positives:
    - zh: 网络故障排查、容器连通性诊断、协议测试、NDR 校验和事件响应
      en: Network troubleshooting, container-connectivity diagnostics, protocol tests, NDR validation, and incident response
    blind_spots:
    - zh: 本分析只覆盖保留了进程与输出的 Windows 原生抓包；自定义驱动、Linux 或 macOS、内存实时显示、被劫持的已批准收集器和审计缺失需要额外传感器。Sysmon 不提供包正文或文件内容 hash。
      en: This analytic covers Windows native capture with retained process and output evidence only. Custom drivers, Linux
        or macOS, memory-only display, hijacked approved collectors, and missing audit require additional sensors. Sysmon
        supplies neither packet payload nor file-content hashes.
    tuning_guidance:
      paragraphs:
      - zh: 在试点机器验证 Sysmon Event 1 和 11 的采集及字段映射，以工单约束主体、组件、过滤器、目的地和期限，不永久白名单 pktmon.exe。组件 ID 可随重启变化，必须保全同次会话组件表。内容 hash
          与结果来源由受限取证流程补充；原始内容不进入普通告警。
        en: Validate Sysmon Event 1 and 11 collection and field mappings on pilot systems. Scope approval by principal, component,
          filter, destination, and expiry rather than permanently allowing pktmon.exe. Preserve the component table from the
          same session because IDs can change after reboot. Restricted forensics must supply content hashes and result origin,
          with raw contents excluded from general alerts.
    evidence_keys:
    - REF-000366
    - REF-000797
    - REF-000801
  - key: B015-T1040-NJA-DEVICE
    resolution: create
    strategy_key: B015-T1040-DET-OBSERVATION-FACT-PROVENANCE
    name:
      zh: 设备抓包缓冲与测绘结果关联
      en: Device Capture Buffer and Mapping-Result Correlation
    summary:
      zh: 重建设备本地抓包、缓冲读取和导出，核实环境字段是否实际返回。
      en: Reconstruct device-local capture, buffer reads, and export to verify whether environmental fields actually returned.
    domains:
    - enterprise
    platforms:
    - Network Devices
    logic:
      paragraphs:
      - zh: 从集中命令记账或管理会话记录恢复 monitor capture 的 capture name、接口、方向、过滤器、限制和起止操作，并用 show monitor capture 运行输出验证状态和包数。按 device_id、管理会话及
          capture name 连接 buffer dump 与 export；配置命令不能证明存在有效包，export 命令不能证明传输成功。与批准接口、期限和目的地不符时报告观察面异常。
        en: Reconstruct capture name, interface, direction, filter, limits, and start or stop operations for monitor capture
          from centralized command accounting or management-session records, then validate state and packet count with show
          monitor capture output. Join buffer dump and export by device_id, administration session, and capture name. Configuration
          does not establish packet receipt, and an export command does not establish successful transfer. Report observation-surface
          anomalies when interfaces, duration, or destination differ from approval.
      - zh: 保全会话实际返回的缓冲解码或后续解析输出，将地址、链路字段和通信对端逐项连接到 capture name、包记录与时间。buffer dump 只返回原始字节时保留 packet-received 或 facts-exposed；只有返回的已解释环境事实才达到
          fact-return-confirmed。存在认证内容时另按 NJT-0176 门禁评估，不能因流量包含 TCP/49 就以凭据结果代替环境事实。
        en: Preserve buffer decoding actually returned in the session or subsequent parser output and trace addresses, link
          fields, and peers to capture name, packet record, and time. Raw buffer bytes retain packet-received or facts-exposed
          status; interpreted environmental facts in a returned result are needed for fact-return-confirmed. Assess authentication
          content separately through NJT-0176's gates rather than using TCP/49 traffic as a substitute for environmental facts.
    data_requirements:
    - source_type: device-management-session
      name:
        zh: 网络设备管理命令与会话返回
        en: Network-device management commands and session returns
      channel: remote AAA command accounting and separately retained session transcript
      required_fields:
      - timestamp
      - device_id
      - admin_session_id
      - actor_id
      - command
      - command_outcome
      - returned_output_locator
    - source_type: device-capture-runtime
      name:
        zh: 设备抓包运行状态
        en: Device capture runtime state
      channel: show monitor capture parameter and buffer output
      required_fields:
      - timestamp
      - device_id
      - capture_name
      - interface_id
      - direction
      - filter
      - state
      - packet_count
      - buffer_parameters
    - source_type: device-capture-export-assessment
      name:
        zh: 设备导出与结果溯源
        en: Device export and result provenance
      channel: transfer logs and restricted forensic assessment
      required_fields:
      - device_id
      - capture_name
      - artifact_hash
      - destination
      - transfer_outcome
      - record_locator
      - fact_class
      - inference_level
      - result_origin
      - return_evidence_locator
    - source_type: device-diagnostic-approval
      name:
        zh: 设备诊断批准
        en: Device diagnostic approval
      channel: change management
      required_fields:
      - ticket_id
      - owner
      - actor_id
      - device_id
      - interface_scope
      - filter_scope
      - output_destination
      - valid_from
      - valid_to
    observables:
    - zh: 未批准管理员跨关键接口建立捕获并读取缓冲，返回记录显示多个内部对端或协议字段
      en: An unapproved administrator captures across critical interfaces and reads a buffer whose returned records contain
        multiple internal peers or protocol fields
    - zh: 本地抓包在短期内导向未登记管理目的地，且删除后现态已无 capture 对象
      en: Local capture exports to an unregistered management destination and is deleted so current state no longer contains
        the capture object
    correlation:
      window:
        zh: 从首条捕获定义命令前十五分钟覆盖完整 capture 生命周期，连接其后七日内按 hash 可识别的导出或解析结果；按设备运行与重启边界处理名称复用。
        en: Begin fifteen minutes before the first capture-definition command, span the capture lifecycle, and join hash-identifiable
          exports or parsed results for seven days afterward; account for capture-name reuse across device and reboot boundaries.
      dimensions:
      - device_id
      - admin_session_id
      - actor_id
      - capture_name
      - interface_id
      - artifact_hash
      - destination
      - ticket_id
      - time
    false_positives:
    - zh: 厂商支持、链路诊断、变更验证、安全流量分析和事件响应
      en: Vendor support, link diagnostics, change validation, security traffic analysis, and incident response
    blind_spots:
    - zh: AAA 通常只记命令而不保留返回正文；未另行保全会话输出时不能证明事实返回。固件级嗅探、日志篡改、直接内存读取和未捕获接口也超出此分析。
      en: AAA commonly records commands without returned content; fact return cannot be established without separately preserved
        session output. Firmware sniffing, log tampering, direct memory reads, and uncovered interfaces also fall outside
        this analytic.
    tuning_guidance:
      paragraphs:
      - zh: 按设备型号验证 show 输出解析，不把所有厂商映射成相同字段。批准必须限定 capture 主体、接口、过滤器、输出目的地和有效期；集中命令日志与受限会话记录分离保留，避免通过普通 SIEM 共享敏感报文。抓包名只是局部关联键，不能跨重启无限关联。
        en: Validate show-output parsing by device model rather than assigning identical fields to every vendor. Limit approval
          to capture principal, interface, filter, output destination, and validity. Retain centralized commands separately
          from restricted session recordings to avoid exposing sensitive packets through general SIEM access. Capture names
          are local join keys, not permanent identifiers across reboots.
    evidence_keys:
    - REF-000794
    - REF-000792
    - REF-000801
  - key: B015-T1040-NJA-MIRROR
    resolution: create
    strategy_key: B015-T1040-DET-OBSERVATION-FACT-PROVENANCE
    name:
      zh: 云镜像源范围与收集器事实输出关联
      en: Cloud Mirror Source Scope and Collector Fact-Output Correlation
    summary:
      zh: 核对镜像变更、实际接收与解析输出，识别未经批准扩大的内部通信观察范围。
      en: Compare mirror changes, actual receipt, and parsed output to identify unapproved expansion of internal-communication
        visibility.
    domains:
    - enterprise
    platforms:
    - IaaS
    logic:
      paragraphs:
      - zh: 对 GCP v1.compute.packetMirrorings.insert、patch 和 delete 保存事件时镜像资源版本，恢复 source、filter、collector 和操作者；request body
          缺失时从独立资源快照补齐，不能假定审计自带完整旧新状态。将镜像有效区间与收集器接收计数和已批准源范围比较，识别来源从单个实例扩大到未批准实例或子网、目的地更换以及到期后持续接收。
        en: Preserve event-time mirror-resource versions for GCP v1.compute.packetMirrorings.insert, patch, and delete to
          reconstruct source, filter, collector, and actor. Supplement missing request bodies with independent resource snapshots
          instead of assuming audit records contain complete old and new state. Compare validity intervals and collector receipt
          against approved source scope to identify expansion from one instance to unapproved instances or subnets, destination
          changes, and receipt after expiry.
      - zh: 以镜像资源、源实例或接口、收集器和时间连接实际收包，再关联收集器中攻击者生成的地址关系或协议结果。镜像创建只达 capture-requested，收包计数只达 packet-received，分析员对产物解码只达 facts-exposed；确认事实返回仍需可核查的结果产物。删除镜像不能抹去事件时观察范围，跨项目收集器只改变授权风险，不直接证明已取得环境知识。
        en: Join actual packet receipt by mirror resource, source instance or interface, collector, and time, then correlate
          address-relationship or protocol results generated by the adversary at the collector. Mirror creation yields capture-requested,
          receipt counters packet-received, and analyst decoding facts-exposed. Confirming fact return still requires a verifiable
          result artifact. Mirror deletion does not erase event-time observation scope, and a cross-project collector changes
          authorization risk rather than independently proving environmental knowledge.
    data_requirements:
    - source_type: gcp-mirror-admin-audit
      name:
        zh: GCP 镜像管理审计
        en: GCP mirror administration audit
      channel: Cloud Audit Logs Admin Activity
      required_fields:
      - timestamp
      - project_id
      - principalEmail
      - methodName
      - resourceName
      - operation_id
      - status
    - source_type: mirror-resource-version
      name:
        zh: 事件时镜像资源版本
        en: Event-time mirror resource version
      channel: independently retained configuration snapshots
      required_fields:
      - timestamp
      - project_id
      - mirror_id
      - source_resources
      - filter
      - collector_target
      - enabled
      - resource_version
    - source_type: collector-receipt-and-result
      name:
        zh: 收集器收包与结果证据
        en: Collector receipt and result evidence
      channel: collector counters and restricted forensic store
      required_fields:
      - timestamp
      - collector_id
      - source_resource
      - received_packets
      - artifact_hash
      - record_locator
      - fact_class
      - inference_level
      - result_origin
      - return_evidence_locator
    - source_type: mirror-approval-contract
      name:
        zh: 镜像批准数据合同
        en: Mirror approval data contract
      channel: change and asset management
      required_fields:
      - ticket_id
      - owner
      - mirror_id
      - source_scope
      - filter_scope
      - collector_target
      - valid_from
      - valid_to
      - purpose
    observables:
    - zh: 镜像源范围或目标未获批准地改变，并在有效期内出现对应收集器收包和环境关系输出
      en: An unapproved mirror source or target change is followed by corresponding collector receipt and environmental-relationship
        output during its validity
    - zh: 镜像删除或禁用后保留的历史快照显示曾覆盖关键内部通信，现态清单已无法解释该观察机会
      en: Historical snapshots retained after mirror deletion or disabling show coverage of critical internal communications
        no longer explainable from current inventory alone
    correlation:
      window:
        zh: 覆盖完整镜像资源有效期，按事件时版本关联删除后七日的收集器产物；缺少稳定 mirror ID 时只在十五分钟内按源、目标和过滤器降级匹配。
        en: Span the full mirror validity and use event-time versions to join collector artifacts for seven days after deletion;
          without a stable mirror ID, use source, destination, and filter only within a fifteen-minute lower-confidence match.
      dimensions:
      - project_id
      - principalEmail
      - operation_id
      - mirror_id
      - resource_version
      - source_resource
      - collector_id
      - artifact_hash
      - ticket_id
      - time
    false_positives:
    - zh: 获批 NDR、迁移验证、容量测量、故障诊断和合规监测
      en: Approved NDR, migration validation, capacity measurement, troubleshooting, and compliance monitoring
    blind_spots:
    - zh: 提供方内部复制、物理 TAP、合法收集器内部被劫持、快照缺失和无持久产物的实时解析。Admin Activity 不保证记录完整过滤器或资源旧值。
      en: Provider-internal copying, physical taps, compromise within an approved collector, missing snapshots, and real-time
        parsing without retained artifacts. Admin Activity does not guarantee complete filters or old resource values.
    tuning_guidance:
      paragraphs:
      - zh: 以源资源和业务数据合同评分范围扩张，不能永久放行安全项目、服务账户或现有 collector。先验证项目审计中的 methodName、身份和资源字段以及独立快照时效；把请求成功与长操作完成区分开。对收集器只上送必要事实类别与溯源键，并保留网络加密仍暴露元数据的事实。
        en: Score scope expansion using source resources and business data contracts rather than permanently allowing security
          projects, service accounts, or existing collectors. Validate audit methodName, principal and resource fields and
          snapshot freshness first, distinguishing accepted requests from completed long-running operations. Export only necessary
          fact classes and provenance keys from collectors, and retain the distinction that network encryption can still expose
          metadata.
    evidence_keys:
    - REF-000795
    - REF-000801
    - B015-T1040-REF-NIST115
  mitigations:
  - key: B015-T1040-MIT-OBSERVATION-GOVERNANCE-APPLICATION
    resolution: extend
    existing_ref: MIT-000186
    rationale:
      zh: 复用该对象已有的最小抓包与镜像权限、独立生命周期审计和 PCAP 数据治理措施，只新增本父技术的 Application。不要把凭据传输保护的效果复制为环境事实不可见，也不修改任何既有凭据应用。
      en: Reuse its existing least capture and mirror authority, independent lifecycle audit, and PCAP data-governance measures,
        adding only an application for this parent. Do not copy credential-transport effects into a claim that environmental
        facts become invisible or change existing credential applications.
    unchanged_measure_keys:
    - least-capture-and-mirror-authority
    - independent-capture-lifecycle-audit
    - pcap-sensitive-data-governance
    applications:
    - target_key: B015-T1040-PARENT
      use:
        paragraphs:
        - zh: 将允许观察的主机接口、设备抓包范围和镜像源—收集器关系与用途、所有者、时限及输出位置绑定。普通工作负载移除不必要抓包权限；设备抓包与云镜像变更使用最小角色和短期批准。将生命周期及源范围快照发送到独立审计域，并按 PCAP
            敏感数据规则限制原文与解析结果的访问和保留。
          en: Bind permitted host interfaces, device capture scopes, and mirror source-to-collector relationships to purpose,
            owner, validity, and output location. Remove unnecessary capture authority from ordinary workloads and use least
            roles and short-lived approval for device capture and cloud mirrors. Send lifecycle and source-scope snapshots
            to independent audit, and restrict access and retention for raw captures and parsed results under PCAP sensitive-data
            rules.
      expected_effect:
        paragraphs:
        - zh: 减少攻击者可控制的旁听与复制位置，使未授权范围扩大和异常结果去向留下可与批准核对的记录。传输加密可减少正文和某些名称或版本线索的暴露，但本应用的主要效果来自观察能力和结果访问约束，而不是保证地址、时序或所有通信关系被隐藏。
          en: Reduce listening and copying positions under adversary control and make unapproved scope expansion and anomalous
            result destinations leave records comparable with approval. Transport encryption can reduce payload and some name
            or version exposure, but the main effect here comes from observation-authority and result-access constraints rather
            than a guarantee that addresses, timing, or all communication relationships are hidden.
      limitations:
        paragraphs:
        - zh: 受控终止端、固件或已批准收集器仍可能看到相关事实，物理接收器和广播通信也不完全受镜像 IAM 限制。合法故障诊断与安全监控需要例外；发现未授权观察并不自动确定哪些事实已返回，处置需先保全资源版本、接口范围和分级结果证据。
          en: A compromised terminator, firmware, or approved collector may still see relevant facts, while physical receivers
            and broadcast traffic are not fully constrained by mirror IAM. Legitimate diagnostics and security monitoring
            need exceptions. Unauthorized observation does not by itself identify returned facts, so preserve resource versions,
            interface scope, and graded result evidence before response.
    evidence_keys:
    - REF-000796
    - REF-000794
    - REF-000795
    - REF-000801
    - B015-T1040-REF-NIST115
