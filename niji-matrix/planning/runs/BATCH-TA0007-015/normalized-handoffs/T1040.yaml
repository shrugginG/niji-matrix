  - key: B015-T1040-CLM-RESULT-GATE
    resolution: create
    claim_type: technique-boundary
    statement_zh: 抓包权限、会话配置、实际收包、分析员可解释的事实和攻击者已返回的事实属于不同证据阶段；PCAP 或镜像存在不单独证明测绘结果，更不证明凭据取得。
    statement_en: Capture authority, session configuration, received packets, analyst-interpretable facts, and facts returned
      to the adversary are distinct evidence stages; a PCAP or mirror alone establishes neither mapping results nor acquired
      credentials.
    subject_keys:
