    statement_zh: 原生抓包和镜像与合法诊断共享命令、过滤器和产物外观，意图区分依赖批准主体与范围；公开资料支持外观重叠而未测量本对象的检测下降。
    statement_en: Native capture and mirroring share commands, filters, and artifact features with authorized diagnostics,
      making intent classification depend on approved principals and scope; public evidence supports this overlap without
