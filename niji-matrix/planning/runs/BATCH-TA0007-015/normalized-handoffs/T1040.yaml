  - key: B015-T1040-CLM-BT
    resolution: create
    claim_type: mechanism-mapping
    statement_zh: 不增加目标发现请求的被动读取使主要测绘痕迹转向捕获主体和观察控制面，因此目标请求或扫描遥测不足时产生条件性的行为透明效果。
    statement_en: Passive reading without an added target-discovery request places main mapping residue at capture principals
      and observation control planes, producing conditional Behavioral Transparency when target-request or scan telemetry
      is the main coverage.
    subject_keys:
    - B015-T1040-PARENT
    evidence_keys:
