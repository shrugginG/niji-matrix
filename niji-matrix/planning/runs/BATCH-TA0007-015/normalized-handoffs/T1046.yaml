  research:
    limitations:
      paragraphs:
      - zh: Bradley 提供入侵中使用服务浏览命令及其查找目标的一手记录，但未提供完整查询输出、每个解析端点、监听验证、检测漏失率或明确规避指令；不能把报告的无端口扫描解释为整个入侵从未执行其他扫描。Hildegard 说明内部搜索与后继容器操作，不证明使用了公告替代或特定低速、分布式策略。
        en: Bradley provides firsthand reporting of a browse command and its intended discovery target, not complete query
          output, every resolved endpoint, listener validation, detection miss rates, or an explicit evasion instruction.
          The reported absence of port scanning in that operation cannot establish that the entire intrusion involved no other
          scans. Hildegard establishes internal search and subsequent container operations, not advertisement substitution
          or a particular slow or distributed strategy.
      - zh: 服务公告和端口结果都可能过期、被伪造或受到观察点限制。本文检测阈值与窗口是部署起点，没有真实网络上的准确率验证；对子网、IPv6、mDNS 网关和进程归因的覆盖必须实测。新的同案输出、完整监听流与防守事件对照，可能改变子项置信度或进一步拆分管理查询与存量视图路径。
        en: Advertisements and port observations can be stale, spoofed, or limited by vantage point. Detection thresholds
          and windows are deployment starting points without real-network accuracy validation. Subnet, IPv6, mDNS-gateway,
          and process-attribution coverage must be tested. Same-case outputs, complete listener flows, and defensive-event
          comparisons could change child confidence or justify later separation of management queries and stored views.
