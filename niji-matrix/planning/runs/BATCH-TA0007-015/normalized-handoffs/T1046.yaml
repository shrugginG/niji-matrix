  causal_review:
    behavior_design: choose published-service browsing for initial candidates rather than contacting each service listener
    changed_trace: service-type and instance queries plus publisher responses replace the initial listener-probe sequence
    observation_effect: port-scan-only rules lack the relevant service-listener events; local-link or discovery-gateway query-response
      records can restore the surface
    stealth_effect: conditional observation gap plus ordinary-client feature overlap; no quantified missed-detection claim
    residual_traces: query host, queried type, browsing domain, responding advertiser, record relations, optional caller execution
      and successor connections
    limiting_conditions: same-link telemetry, role baselines, publisher visibility, cache/response suppression, compromised
      approved clients and attribution ambiguity
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已读 NJT-0001 实际父项与五个子项并对照字段职责；新父项与提议子项均具备定义、可观察匿迹属性、边界、场景、独立攻防模型、证据校准机理与限制。单独编写监听探测与公告查询防御，未使用名称替换扩写。共享 FD/BT 结论保持父项聚合与子项直接适用的语义关系。
      en: The actual NJT-0001 parent and all five children were read and compared by field responsibility. The new parent
        and proposed child contain definition, observable stealth properties, scope, scenarios, separate threat models, evidence-calibrated
        mechanisms and limitations. Listener-probe and advertisement-query defenses were authored separately without name-substitution
        expansion. Shared FD/BT conclusions preserve parent aggregation and direct child applicability.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML string quoting
    - YAML parse and bilingual mapping key checks
  limitations:
    paragraphs:
    - zh: 本交接没有在真实网络执行检测或测量匿迹效果。公告子项以一手命令观察和官方协议文档为依据，返回信息与防守漏失仍严格分层。CISA 参考仅通过原始域名的索引摘录读取，全文访问被拒绝，因此只是可选佐证；准入和子项不依赖该来源独立成立。
      en: This handoff contains no real-network detection execution or measured stealth efficacy. The advertisement child
        relies on firsthand command observation and official protocol documentation while separating returned information
        from defensive misses. The CISA reference was available only through original-domain indexed excerpts and full access
        was denied, so it is optional corroboration; admission and the child stand independently of it.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason: No T1046-specific evidence of deliberate encryption, fragmentation or content obfuscation that changes inspection;
      an encrypted service protocol alone does not establish data obscuration for discovery.
  - mechanism_ref: NM-ST
    reason: No examined internal case proves deliberate pacing, complementary multi-source tasks or the necessary internal
      trace/defense distinction. Existing NJT-0001 timing/source children are not copied.
  open_questions:
  - Primary convergence must confirm the advertisement-substitution child has a substantive information-path boundary rather
    than becoming a protocol or interface label.
  - If primary review defers the child, parent fields, taxonomy narrative, claim subjects and direct-defense scopes must be
    revised together; do not leave an unresolved child key in canonical content.
  - Source-result validation should inspect complete PTR/SRV/address and subsequent listener observations in a controlled
    local test before claiming result acquisition or detector efficacy.
