defense_candidates:
  detection_strategies:
  - key: B015-T1046-DET-INTERNAL-SERVICE-PROBES
    name:
      zh: 内部服务探测与结果分级
      en: Internal Service Probing and Graded Outcomes
    summary:
      zh: 识别不符合主机职责的东西向服务探测，并把连接尝试、监听响应和协议确认分开输出。
      en: Identify east-west service probing outside a device's role and separately report connection attempts, listener responses,
        and protocol confirmation.
    description:
      paragraphs:
      - zh: 策略以已经处于组织环境内的来源为对象，结合其批准职责、目标与端口覆盖和协议结果，发现普通终端或工作负载开展的服务调查。它由内部连接分析承担直接探测分支，公告查询由独立策略承担，防止把没有连接扇出的情况误当作没有发现。
        en: The strategy assesses sources already inside the organizational environment, combining approved role, destination
          and port coverage, and protocol outcomes to identify service surveying by endpoints or workloads. Its connection
          analytic covers direct probing; advertisement queries have a separate strategy so absence of connection fan-out
          is not mistaken for absence of discovery.
    detects_keys:
    - B015-T1046-PARENT
    domains:
    - enterprise
    analytic_keys:
    - B015-T1046-NJA-INTERNAL-PROBES
    evidence_keys:
    - REF-000634
    - REF-000819
    - B015-T1046-REF-NMAP-VERSION
    - B015-T1046-REF-NMAP-PORTS
    - REF-000366
  - key: B015-T1046-DET-ADVERTISEMENTS
    name:
      zh: 服务公告浏览与候选使用关联
      en: Service-Advertisement Browsing and Candidate Use Correlation
    summary:
      zh: 在真实发现域内识别用途异常的服务公告查询，并区分浏览意图、可见公告与已解析端点。
      en: Identify unexpected service-advertisement queries in the actual discovery domain, distinguishing browsing intent,
        visible advertisements, and resolved endpoints.
    description:
      paragraphs:
      - zh: 策略观察服务公告平面的主动查询，恢复客户端所查服务类型及可见实例范围，并结合设备职责、会话上下文和可选的后继端点访问判断异常。分析保留组播相关的不确定性，不要求先出现端口扫描，也不把可见公告升级为结果已被某进程消费或服务已实际可达。
        en: The strategy observes active queries on the service-advertisement plane, reconstructs requested service types
          and visible instance scope, and uses device purpose, session context, and optional successor endpoint access to
          assess anomalies. It preserves multicast-association uncertainty, does not require prior port scanning, and does
          not elevate a visible advertisement into proof of process consumption or service reachability.
    detects_keys:
    - B015-T1046-PARENT
    - B015-T1046-NJS-ADVERTISEMENT-SUBSTITUTION
    domains:
    - enterprise
    analytic_keys:
    - B015-T1046-NJA-ADVERTISEMENT-QUERY
    evidence_keys:
    - B015-T1046-REF-BRADLEY
    - B015-T1046-REF-APPLE-BONJOUR
    - B015-T1046-REF-RFC6762
    - B015-T1046-REF-RFC6763
    - REF-000634
  detection_analytics:
  - key: B015-T1046-NJA-INTERNAL-PROBES
    strategy_key: B015-T1046-DET-INTERNAL-SERVICE-PROBES
    name:
      zh: 职责外内部连接覆盖与协议证据分层分析
      en: Role-Deviant Internal Connection Coverage and Protocol Evidence Grading
    summary:
      zh: 按来源职责聚合内部探测覆盖，并输出尝试、监听响应或协议确认的证据等级。
      en: Aggregate internal probe coverage by source role and emit evidence levels for attempts, listener responses, and
        protocol confirmation.
    domains:
    - enterprise
    platforms:
    - Windows
    - Linux
    - macOS
    - Containers
    - IaaS
    - Network Devices
    logic:
      paragraphs:
      - zh: 先按事件时间用资产及地址映射确定发起设备、源网络区域和目标设备，避免把 NAT 后一个地址当作单一操作者。保留未采样 conn.log 的五元组、连接状态、history、字节数、missed_bytes 和解析器确认的
          service。每十五分钟分别计算同源到同服务端口的不同目标数及到同目标的不同端口数，同时保留二十四小时并集。以至少十个目标或十个端口作为初始审阅门槛，要求超出相应角色基线且没有匹配的批准扫描作业；门槛是部署建议，并非恶意或漏检率的经验定律。
        en: Resolve the initiating device, source zone, and destination device using event-time asset and address mappings,
          avoiding attribution of a NAT address to one operator. Retain unsampled conn.log endpoint tuples, connection state,
          history, byte counts, missed_bytes, and parser-confirmed service. In fifteen-minute windows calculate distinct destinations
          per source and service port, and distinct ports per source and destination, also retaining twenty-four-hour unions.
          An initial review gate can be ten destinations or ten ports, provided the pattern exceeds the relevant role baseline
          and lacks a matching approved scan job. These are deployment proposals, not empirical laws of malice or detection
          accuracy.
      - zh: 为每条关联记录分别输出证据层级：无应答或拒绝只证明尝试；SYN-ACK 等响应支持路径上的监听反馈，但不能直接确认已完成握手；完整状态与 history 支持连接建立；service 只有由协议解析器确认时才能成为协议证据，不能从目标端口赋值。抓包缺失或仅中途观测时降低等级。把职责外覆盖、短而重复的交互或后继少量目标访问组合成调查线索，不输出“存在漏洞”或“已利用”。若额外连接已启用的
          Sysmon 1、3，按设备、ProcessGuid、时间与五元组补充进程来源；Event 3 不补全失败探测或服务版本，也不作为必需网络结果源。
        en: 'Grade each joined observation separately: no reply or rejection establishes an attempt; a SYN-ACK or similar
          response supports listener feedback along the path but does not by itself establish a completed handshake; complete
          state and history support connection establishment; service becomes protocol evidence only when confirmed by a parser,
          never by assigning the destination port''s conventional name. Lower the grade for packet loss or midstream observation.
          Combine role-deviant coverage, brief repeated exchanges, or later access to a smaller target set into a survey lead
          without asserting vulnerability or exploitation. If enabled Sysmon 1 and 3 are additionally joined, use device,
          ProcessGuid, time, and endpoint tuple for process provenance. Event 3 neither reconstructs failed probes nor supplies
          service versions and is not the required network-outcome source.'
    data_requirements:
    - source_type: east-west-connection-records
      name:
        zh: 未采样东西向连接及协议记录
        en: Unsampled East-West Connection and Protocol Records
      channel: Zeek conn.log from internal observation points
      required_fields:
      - timestamp
      - connection_uid
      - source_ip
      - source_port
      - destination_ip
      - destination_port
      - transport
      - connection_state
      - transport_history
      - originator_bytes
      - responder_bytes
      - confirmed_service
      - missed_bytes
    - source_type: event-time-asset-address-map
      name:
        zh: 事件时资产地址与扫描批准记录
        en: Event-Time Asset Address and Scan Approval Records
      channel: CMDB plus DHCP or cloud/workload address history and approved scan-job registry
      required_fields:
      - device_id
      - valid_from
      - valid_to
      - ip_address
      - network_zone
      - device_role
      - approved_source
      - approved_destination_scope
      - approved_service_scope
      - approved_window
    observables:
    - zh: 普通终端或工作负载访问超出职责范围的一组内部服务候选
      en: An endpoint or workload contacting a set of internal-service candidates outside its approved role
    - zh: 同源同端口跨目标覆盖或同源同目标跨端口覆盖
      en: Cross-destination coverage of one port or cross-port coverage of one destination from one source
    - zh: 连接状态、首部历史和解析器确认协议提供不同结果等级
      en: Connection state, transport history, and parser-confirmed protocols providing distinct outcome grades
    correlation:
      window: 15-minute review windows and 24-hour union with at least 7 days of role baseline
      dimensions:
      - device_id
      - source_zone
      - destination_device
      - destination_port
      - transport
      - timestamp
      - connection_uid
    false_positives:
    - zh: 获准漏洞扫描、资产盘点或事件响应
      en: Authorized vulnerability assessment, inventory, or incident response
    - zh: 服务网格、备份代理、健康检查和故障切换造成的跨目标连接
      en: Service meshes, backup agents, health checks, and failover connecting across destinations
    blind_spots:
    - zh: 同链路或容器内路径不经过传感器、流采样、非对称路由及丢包可破坏覆盖与结果判断
      en: Same-link or intra-container paths bypassing sensors, flow sampling, asymmetric routing, and packet loss can invalidate
        coverage and outcome grading
    - zh: 单目标少端口调查可能低于门槛；公告浏览也不必生成任何候选监听连接
      en: Single-target sparse surveys can remain below the gate, while advertisement browsing need not create candidate-listener
        connections
    - zh: 被盗批准扫描身份可能保持正常外观，端口或加密会话不足以确认产品和版本
      en: A stolen approved scanner identity can preserve normal appearance, while ports or encrypted sessions cannot establish
        products and versions
    tuning_guidance:
      paragraphs:
      - zh: 先验证传感器对 IPv4、IPv6、同 VLAN 与关键工作负载路径的可见性，再用本地批准作业校准十目标或十端口的起始门槛。允许规则绑定来源设备、目标集合、服务和时间范围，不对某个扫描器程序名永久放行。保留低量级线索供长窗口调查，并与公告查询分支并列展示，避免通过升高流量阈值去补偿错误基线。
        en: Validate IPv4, IPv6, same-VLAN, and critical-workload visibility before calibrating the initial ten-destination
          or ten-port gate against approved local jobs. Bind exceptions to source devices, destinations, services, and time
          instead of permanently allowing a scanner executable name. Retain lower-volume leads for longer investigations and
          display the advertisement branch alongside connection results, avoiding compensation for a poor baseline by simply
          raising traffic thresholds.
    evidence_keys:
    - REF-000634
    - REF-000819
    - B015-T1046-REF-NMAP-VERSION
    - B015-T1046-REF-NMAP-PORTS
    optional_enrichment_evidence_keys:
    - REF-000366
  - key: B015-T1046-NJA-ADVERTISEMENT-QUERY
    strategy_key: B015-T1046-DET-ADVERTISEMENTS
    name:
      zh: 服务类型查询、公告实例与可选后继访问关联分析
      en: Service-Type Query Advertisement Instance and Optional Successor Access Correlation
    summary:
      zh: 识别职责外主动服务浏览，并保留实例可见、端点解析和后继访问的分级证据。
      en: Identify role-deviant active service browsing while retaining graded evidence for visible instances, endpoint resolution,
        and successor access.
    domains:
    - enterprise
    platforms:
    - macOS
    - Windows
    - Linux
    - Network Devices
    logic:
      paragraphs:
      - zh: 在浏览者实际链路部署经验证可解码 DNS-SD 的抓包或等价传感器，覆盖 UDP 5353 的 IPv4 与 IPv6 组播及实际单播浏览路径；先以发出 PTR 类型或服务实例解析查询的设备形成 browse_attempt。按链路、时间、记录名与服务类型关联
          PTR 公告实例，并连接相应 SRV 和地址记录；组播应答使用语义与时间关联而不是单凭 transaction ID。观察到相关应答只输出 instance_advertisement_visible，完整主机、端口和地址映射才能输出
          endpoint_resolved_visible，均不证明某个应用已消费结果。只有可信客户端输出或请求级遥测明确记录结果时，才另记 result_acquisition_confirmed。
        en: Deploy packet capture or equivalent telemetry with validated DNS-SD decoding on the browser's actual link, covering
          IPv4 and IPv6 UDP 5353 multicast and the actual unicast browsing path. Create browse_attempt for a device emitting
          a service-type PTR or instance-resolution query. Associate PTR advertisements by link, time, record name, and service
          type, then join corresponding SRV and address records. Match multicast responses semantically and temporally rather
          than by transaction ID alone. A related response yields only instance_advertisement_visible; a complete host, port,
          and address mapping yields endpoint_resolved_visible. Neither proves application consumption. Record result_acquisition_confirmed
          only when trusted client output or request-level telemetry explicitly records the result.
      - zh: 将所查服务类型和浏览域与事件时设备职责、批准发现网关或运维作业比较。单次查询也可在类型与职责不符且来源会话异常时进入审阅，不要求端口扇出或多种类型。若十分钟内同设备连接刚解析的候选端点，附加 successor_connection
          并按独立连接证据分级；这是增强上下文，不是发现成立的必要门槛。没有结果记录时维持查询尝试等级，没有后继连接时维持服务浏览线索。共享 mDNSResponder 的包不能直接归因到请求进程，必须保留 request_application_unknown，除非有独立请求级证据。
        en: Compare requested service types and browsing domains with event-time device roles and approved discovery gateways
          or administrative jobs. Even one query can merit review when type and role disagree and the source session is unusual;
          port fan-out and multiple service types are not prerequisites. If the same device connects to a newly resolved candidate
          within ten minutes, append successor_connection and grade it using independent connection evidence. This enriches
          context rather than becoming a prerequisite for discovery. Without result records preserve the query-attempt level,
          and without a successor preserve the browse lead. Packets emitted by shared mDNSResponder cannot identify the requesting
          process; retain request_application_unknown unless independent request-level evidence exists.
    data_requirements:
    - source_type: service-advertisement-packet-records
      name:
        zh: 同发现域的查询和公告记录
        en: Queries and Advertisements in the Actual Discovery Domain
      channel: Same-link PCAP or validated DNS-SD decoder on the actual discovery gateway
      required_fields:
      - timestamp
      - sensor_id
      - link_or_vlan
      - source_ip
      - destination_ip
      - source_port
      - destination_port
      - dns_message_role
      - query_name
      - query_type
      - record_name
      - record_type
      - record_data
      - record_ttl
    - source_type: discovery-role-and-client-address-map
      name:
        zh: 客户端地址职责与批准浏览范围
        en: Client Address Role and Approved Browsing Scope
      channel: CMDB and time-aware DHCP or network-access mapping plus discovery policy inventory
      required_fields:
      - device_id
      - ip_address
      - valid_from
      - valid_to
      - link_or_vlan
      - device_role
      - approved_service_types
      - approved_browsing_domains
      - approved_job_window
    observables:
    - zh: 与设备职责或批准浏览域不一致的主动服务类型查询
      en: Active service-type queries inconsistent with device role or approved browsing domains
    - zh: 查询、PTR 实例和 SRV 或地址记录之间的语义关系及保留的关联不确定性
      en: Semantic relationships among queries, PTR instances, and SRV or address records, with association uncertainty retained
    - zh: 同设备可选的后继端点访问，或独立记录的客户端返回结果
      en: Optional successor endpoint access by the same device or independently recorded client results
    correlation:
      window: 5-minute query-advertisement association and optional 10-minute successor access with 7-day role baseline
      dimensions:
      - device_id
      - link_or_vlan
      - service_type
      - browsing_domain
      - instance_name
      - record_name
      - candidate_endpoint
      - timestamp
    false_positives:
    - zh: 打印、媒体、共享与远程协助客户端的正常服务浏览
      en: Ordinary printing, media, sharing, and remote-assistance clients browsing services
    - zh: 管理员诊断、发现网关的定期活动查询或新设备首次接入
      en: Administrator diagnostics, periodic active discovery-gateway queries, or first connection of a new device
    blind_spots:
    - zh: 只有递归 DNS、互联网出口或未镜像本地 VLAN 的防火墙日志时可能完全看不到 mDNS
      en: Recursive DNS, Internet egress, or firewall logs without local-VLAN mirroring can completely miss mDNS
    - zh: 缓存、已知应答抑制与组播共享响应使查询应答不能可靠一一配对，包可见不等于进程消费
      en: Caching, known-answer suppression, and shared multicast replies prevent reliable one-to-one pairing; packet visibility
        does not establish process consumption
    - zh: 共享守护进程、重放、伪造公告和地址历史缺失限制请求应用与真实服务身份的归因
      en: Shared daemons, replay, forged advertisements, and missing address history limit requesting-application and true-service
        attribution
    tuning_guidance:
      paragraphs:
      - zh: 先用批准客户端在真实链路验证查询、应答、解析和实际连接四种状态确实分开保留，再启用用途偏离规则。按 VLAN、设备角色、服务类型和时间限定批准例外，不能把全部 Bonjour、全部 5353 或全部内网来源直接放行。service_type
          稀有只作排序信号；共享组播应答无法唯一关联时保存候选集合，不强行指定查询进程或成功结果。
        en: First use approved clients on the real link to verify separate retention of querying, advertisements, resolution,
          and actual connections before enabling purpose-deviation rules. Bound exceptions by VLAN, device role, service type,
          and time rather than allowing all Bonjour, all port 5353, or all internal sources. Service-type rarity is a ranking
          signal only. Preserve candidate sets when shared multicast responses cannot be uniquely associated instead of assigning
          a requesting process or successful result.
    evidence_keys:
    - B015-T1046-REF-BRADLEY
    - B015-T1046-REF-APPLE-BONJOUR
    - B015-T1046-REF-RFC6762
    - B015-T1046-REF-RFC6763
    optional_enrichment_evidence_keys:
    - REF-000634
  mitigations:
  - key: B015-T1046-MIT-SERVICE-VISIBILITY
    name:
      zh: 内部服务可达范围与公告传播治理
      en: Internal Service Reachability and Advertisement Propagation Governance
    summary:
      zh: 分别限制服务监听的可访问来源和服务公告的可见范围，减少内部立足点可直接取得的服务候选。
      en: Separately constrain access to service listeners and visibility of service advertisements, reducing service candidates
        directly available from an internal foothold.
    description:
      paragraphs:
      - zh: 服务是否可以连接与服务信息向谁发布是两个独立控制面。维护业务需要的客户端到服务允许关系，关闭不必要监听；对不需要广泛发现的管理服务停止非必要发布，服务发现网关只跨段传播批准类型和实例。实施后从普通客户端与批准运维端分别验证公告可见性和监听可达性，不能只测试一项就认为另一项也已受控。
        en: Service connectivity and the audience of service publication are separate control surfaces. Maintain allowed client-to-service
          relationships and close unnecessary listeners. Remove unnecessary publication of management services that need no
          broad discovery, and propagate only approved types and instances across discovery gateways. After changes, separately
          test advertisement visibility and listener reachability from ordinary clients and approved management sources; testing
          one does not establish control of the other.
    domains:
    - enterprise
    measures:
    - key: bound-listener-reachability
      name:
        zh: 限定监听服务的业务来源
        en: Bound Listener Access to Business Sources
      description:
        paragraphs:
        - zh: 按服务和客户端职责设置分区与主机防火墙规则，关闭不需要的监听，对管理服务只允许具名运维来源，并登记例外的责任人与到期时间。
          en: Set segmentation and host-firewall rules by service and client role, close unnecessary listeners, restrict management
            services to named administrative sources, and register exception owners and expiries.
      control_type: exposure-reduction
    - key: restrict-advertisement-publication
      name:
        zh: 收敛服务公告发布与跨段传播
        en: Minimize Service Publication and Cross-Segment Propagation
      description:
        paragraphs:
        - zh: 盘点服务注册与发现网关，停用没有业务需要的服务公告；在支持服务列表的网关按接口、服务类型或实例应用入向与出向过滤，并分别核验查询、公告和缓存传播。网关过滤不替代同链路发布端配置。
          en: Inventory service registrations and discovery gateways, remove advertisements without a business need, and apply
            supported gateway filters by interface, service type, or instance in the appropriate inbound and outbound directions.
            Verify queries, advertisements, and cache propagation separately. Gateway filtering does not replace publisher
            configuration on the same link.
      control_type: exposure-reduction
    - key: validate-dual-observation-surfaces
      name:
        zh: 验证服务与公告两种观察面
        en: Validate Listener and Advertisement Observation
      description:
        paragraphs:
        - zh: 从批准和普通客户端分别检查公告结果与实际连接，确认 IPv4、IPv6、各 VLAN 与实际网关的传感器覆盖，保留事件时服务清单和过滤策略版本用于调查。
          en: Test advertisements and actual connections separately from authorized and ordinary clients, verify sensor coverage
            for IPv4, IPv6, VLANs, and actual gateways, and retain event-time service inventories and filter-policy versions
            for investigation.
      control_type: detective-support
    applications:
    - target_key: B015-T1046-PARENT
      use:
        paragraphs:
        - zh: 对普通终端、容器和管理设备建立可访问服务允许图，收敛无需监听的服务和不必要公告，并从每类立足点验证其实际能获得的端点候选。对批准扫描登记来源、目标、服务与时间，使调查中能将运维盘点和职责外发现区分。
          en: Build allowed service-access graphs for endpoints, containers, and management devices, reduce unnecessary listeners
            and advertisements, and validate candidate endpoints available from each foothold class. Register approved scan
            sources, targets, services, and windows so investigations can distinguish authorized inventory from role-deviant
            discovery.
      expected_effect:
        paragraphs:
        - zh: 可直接连接或获知的服务范围缩小，必须验证的候选质量下降，未获准查询与连接更容易偏离可核查基线。控制并不删除全部发现痕迹，而是减少机会并增强对两类信息取得路径的观察。
          en: Fewer services are directly reachable or discoverable, unvalidated candidates become less reliable, and unauthorized
            queries or connections more clearly deviate from reviewable baselines. The controls reduce opportunity and improve
            observation of both acquisition paths rather than eliminating discovery traces.
      limitations:
        paragraphs:
        - zh: 业务必须提供的服务仍可被其获准客户端发现；过滤监听不能撤回已广播的服务名，隐藏公告也不能阻止对已知地址直接探测。被盗运维端和同链路可见性、动态服务与旧缓存仍需处理，错误规则可能影响打印、媒体或管理业务。
          en: Required services remain discoverable by authorized clients. Listener filtering cannot retract already broadcast
            service names, and hiding advertisements cannot prevent direct probes of known addresses. Stolen management devices,
            same-link visibility, dynamic services, and old caches remain concerns, while incorrect rules can disrupt printing,
            media, or administration.
    - target_key: B015-T1046-NJS-ADVERTISEMENT-SUBSTITUTION
      use:
        paragraphs:
        - zh: 对不需被普通客户端自动发现的服务取消非必要公告；在跨段发现网关只允许必要服务类型与实例，并验证发布端同链路配置。用相同服务浏览操作从未批准 VLAN 和批准客户端实测返回内容，分别验证公告减少与监听访问规则。
          en: Remove unnecessary advertisements for services that ordinary clients need not discover automatically. Allow
            only required service types and instances across discovery gateways and validate publisher configuration on the
            same link. Test returned content using equivalent browsing operations from unauthorized VLANs and approved clients,
            separately verifying advertisement reduction and listener-access rules.
      expected_effect:
        paragraphs:
        - zh: 攻击者可通过正常公告查询直接得到的实例与端点减少或局限在业务域内，必须依赖其他信息或增加直接验证；保留的查询与配置版本使异常浏览更可核查。
          en: Fewer instances and endpoints are directly available through ordinary advertisement queries, or visibility is
            confined to business domains, requiring other information or additional direct validation. Retained query evidence
            and configuration versions make unexpected browsing more reviewable.
      limitations:
        paragraphs:
        - zh: 网关过滤只控制经过该网关的跨段传播，不能阻止同链路发布者直接应答；旧缓存和已取得端点不会立即失效。批准客户端或发现网关被控制时仍能取得允许范围的信息，公告收敛也不构成服务认证或完整机密性边界。
          en: Gateway filters control only cross-segment propagation through that gateway, not direct same-link publisher
            responses. Old caches and already learned endpoints do not disappear immediately. Compromised approved clients
            or discovery gateways retain their permitted view, and advertisement reduction provides neither service authentication
            nor a complete confidentiality boundary.
    evidence_keys:
    - B015-T1046-REF-CISCO-GATEWAY
    - B015-T1046-REF-WINDOWS-FIREWALL
    - B015-T1046-REF-APPLE-BONJOUR
    - B015-T1046-REF-RFC6762
    - B015-T1046-REF-RFC6763
existing_library_reuse:
  reference_refs:
  - REF-000634
  - REF-000366
  - REF-000819
  claim_refs: []
  case_refs:
  - CASE-000259
  strategy_refs: []
  analytic_refs: []
  mitigation_refs: []
  relationship_refs: []
  resolutions:
  - object_ref: REF-000634
    resolution: reuse
    reason: Exact Zeek connection-log documentation identity already exists; no new reference for the current documentation
      variant.
  - object_ref: REF-000366
    resolution: reuse
    reason: Existing Microsoft Sysmon events documentation covers optional process/network enrichment; Event 3 remains disabled
      by default and is not an outcome source.
  - object_ref: REF-000819
    resolution: reuse
    reason: Existing Hildegard firsthand report directly covers internal kubelet search before container-resource reads.
  - object_ref: CASE-000259
    resolution: extend
    reason: Same Hildegard incident, foothold, internal kubelet search and later resource operation; add the admitted parent
      subject without changing central observed facts or claiming any native stealth child.
  - object_ref: CLM-000892
    resolution: defer
    reason: Existing proposition is explicitly about container-resource graphs supporting execution, not solely remote-service
      facts. Do not extend it mechanically; use the existing case and a new atomic service-search proposition.
  - object_ref: CASE-000175
    resolution: defer
    reason: SAFEPAY report establishes NETSCAN placement on several hosts, not its execution, complementary scan assignments,
      returned service lists or evasion intent. It is not direct evidence for this candidate or a distributed child.
  - object_ref: REF-000104
    resolution: defer
    reason: DarkVishnya publication identity is already canonical. Current fetched rendering did not expose the detailed scan
      passage, and other firsthand sources suffice; do not create a second publication reference or infer a child from concealed
      drop devices.
  - object_ref: DET-000001
    resolution: split
    reason: External long-horizon scan correlation lacks internal device-role/address mapping and advertisement semantics.
      The internal analytic's data, result grading and tuning differ materially, so a new strategy is justified.
  - object_ref: NJA-000001
    resolution: split
    reason: Boundary sensor and external-source assumptions cannot be substituted for event-time internal source identity
      and east-west path coverage.
  - object_ref: NJA-000343
    resolution: split
    reason: Existing analytic tests semantic mismatch plus defensive effect plus successor C2. Service discovery neither requires
      mismatch nor C2, and port-to-protocol grading is only a shared technical principle, not analytic identity.
  - object_ref: MIT-000001
    resolution: split
    reason: Existing measures concern Internet exposure and public information; this candidate requires internal source-to-listener
      access and local/cross-segment advertisement propagation.
  - object_ref: MIT-000153
    resolution: split
    reason: Least east-west reachability is a reusable control principle, but existing identity centers vulnerable-service
      exploitation, patching and exploit outcomes. New publication/propagation controls and service-information purpose are
      substantive changes, not a target application alone.
