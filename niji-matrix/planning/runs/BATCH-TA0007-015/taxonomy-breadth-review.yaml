batch_ref: BATCH-TA0007-015
baseline: Enterprise 19.1
candidates:
- source_attack_id: T1680
  original_research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - host_drive_disk_partition_volume_attributes
    - windows_logical_and_mapped_drives
    - linux_block_and_filesystem_state
    - macos_disks
    - esxi_storage
    - provider_volume_resources
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: Host storage identities and attributes
      disposition: parent-core
    - cluster: Platforms and command/API interfaces
      disposition: not-stealth-distinct
    - cluster: Provider-provisioned volume inventory
      disposition: adjacent-technique
      target_ref: NJT-0139
    - cluster: .vmdk paths or arbitrary directory PSDrives
      disposition: adjacent-technique
      target_ref: NJT-0182
    - cluster: Raw sensitive-content reads
      disposition: adjacent-technique
      target_ref: NJT-0108
    candidate_stealth_axes_examined:
    - key: in-process-query-placement
      variable: Attacker chooses storage-query code inside an already running process instead of a separate utility.
      prerequisites: Controlled code execution and compatible storage API; no assumption of administrator rights for every
        API.
      trace_change: May remove a separate child-process command line while leaving API invocation and results within the existing
        process.
      defender_effect: Process-launch-only detection can miss query semantics; runtime/API instrumentation would differ.
      evidence: Official GetDriveType/GetDiskFreeSpaceEx/GetVolumeInformation capabilities; Microsoft case establishes storage
        discovery without this implementation.
      disposition: evidence-deferred
      reason: No same-incident evidence of intentional in-process selection, relative trace comparison or observed evasion.
        API versus CLI alone is an interface split, so no NJS.
    - key: reuse-existing-storage-view
      variable: Read an existing host storage database or cached view rather than trigger fresh block-device probing.
      prerequisites: Readable, sufficiently fresh view and matching object scope.
      trace_change: lsblk normally reads sysfs and udev; direct labels/types probing occurs under documented fallback conditions.
      defender_effect: Device-probe observations and catalog/view-read observations differ; returned facts can be stale.
      evidence: REF-000994 documents capability and fallback, not attacker preference.
      disposition: evidence-deferred
      reason: A default implementation and legitimate cache use do not prove attacker-controlled evasion. No adversarial source/output/trace
        comparison.
    - key: query-scope-minimization
      variable: Select only necessary devices or attributes rather than broad inventory.
      prerequisites: Prior target knowledge and sufficient feedback.
      trace_change: Fewer requested targets/fields, but event density and API request count are not guaranteed to decrease.
      defender_effect: A narrow query can resemble ordinary free-space checks; role and target context become more useful.
      evidence: lsblk explicit devices/columns and Microsoft API individual-root queries are documented; adversarial controlled
        comparison absent.
      disposition: evidence-deferred
      reason: Functional request scoping is not by itself a stable stealth child; legitimate capacity checks are strong counterexamples.
    - key: temporal-query-dilution
      variable: Spread independent storage questions over longer intervals.
      prerequisites: Time tolerance and storage facts remaining useful.
      trace_change: Hypothesized lower short-window density.
      defender_effect: Would require longer session or principal correlation if deliberately implemented.
      evidence: No candidate-specific observed implementation, schedule or evasion measurement found in examined primary sources.
      disposition: evidence-deferred
      reason: Do not import NJT-0001 timing children into host storage discovery or infer evasion from ordinary monitoring
        intervals.
    - key: cross-principal-query-partition
      variable: Partition complementary host-storage questions across controlled sessions or identities.
      prerequisites: Multiple controlled principals and a shared result-aggregation path.
      trace_change: Hypothesized fragmentation of one inventory across identities.
      defender_effect: Would require identity-independent host/object joins.
      evidence: No storage-specific multi-principal complementarity or aggregation evidence found.
      disposition: evidence-deferred
      reason: Multiple administrators, host roles or mappings are ordinary conditions and cannot establish deliberate partitioning.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零个 ATT&CK 子项未阻止开放研究，五种独立匿迹轴已分别检查。当前证据足以支持父行为及共享正常接口的中等机理，不足以把某个实现分裂成稳定、防御有别的子项；保留 deferred 而非宣称永远无子技术。
      en: Zero ATT&CK children did not stop open-ended inquiry; five distinct stealth axes were examined. Evidence supports
        the parent behavior and a medium-confidence normal-interface overlap mechanism but does not justify splitting an implementation
        into a stable child with distinct defense requirements. Keep deferred rather than claiming no future taxonomy.
  primary_review:
    status: passed
    formal_njs_count: 0
    supplement_ref: null
    original_attack_subtechniques_imported: false
- source_attack_id: T1654
  original_research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - source inventory
    - historical record queries
    - filtered exports
    - centralized/cloud log search
    - feedback use
    breadth_trigger: ordinary
    coverage_resolutions:
    - dimension: log source and channel enumeration versus content lookup
      resolution: parent-core
      reason: Different information-result levels, not independently demonstrated stealth variables.
    - dimension: Windows versus cloud/SIEM versus Unix service logs
      resolution: not-stealth-distinct
      reason: Product and platform partitions require different analytics but do not by themselves establish intentional stealth
        causality.
    - dimension: log destruction or collection suppression
      resolution: adjacent-technique
      reason: Owned by selective trace contraction and defense impairment; an adjacent action does not redefine read discovery.
    candidate_stealth_axes_examined:
    - axis: predicate and time-window minimization
      variable: Requested record scope and volume
      evidence_keys:
      - B015-T1654-REF-WEVTUTIL
      - B015-T1654-REF-NOPINEAPPLE
      - B015-T1654-REF-LOOKUP
      trace_change: Filters can reduce selected returned records and export volume.
      defender_effect: Potentially less output material, but query text and request remain observable.
      prerequisites: Read permission and valid filter with relevant retained records.
      defense_difference: Retain predicates and result tiers instead of relying on bulk volume.
      disposition: evidence-deferred
      reason: Observed filter serves targeted discovery; sources do not demonstrate intentional lowering of acquisition traces
        or a stable stealth contrast.
    - axis: existing-record investigation instead of fresh target interaction
      variable: Obtain host or identity facts from historical records rather than new direct probes
      evidence_keys:
      - B015-T1654-REF-NOPINEAPPLE
      - B015-T1654-REF-GUIVIL
      trace_change: Query can avoid a new probe to every historical counterpart but creates a log-read trace.
      defender_effect: Probe-centric monitoring may miss knowledge acquisition; log-source monitoring remains possible.
      prerequisites: Sufficiently current and relevant records plus read authority.
      defense_difference: Read-request correlation rather than only network probes.
      disposition: evidence-deferred
      reason: Incident reports do not establish the unperformed alternative, intended probe substitution, or comparative stealth
        gain. This is also broadly parent-core acquisition semantics.
    - axis: centralized-observation displacement
      variable: Read aggregate log service instead of each originating host
      evidence_keys:
      - B015-T1654-REF-AZURE-QUERY-AUDIT
      - B015-T1654-REF-AZURE-QUERY-SCHEMA
      - B015-T1654-REF-GUIVIL
      trace_change: Queries appear at central reader and platform rather than necessarily as a new query on every source host.
      defender_effect: Host-only investigation misses central query context.
      prerequisites: Central service read rights, ingested records, and corresponding target coverage.
      defense_difference: Query audits and workspace/identity joins.
      disposition: evidence-deferred
      reason: Technical availability and audit-placement difference are documented, but intentional surface displacement is
        not independently shown; platform-only child would violate taxonomy.
    - axis: defense-feedback-guided action selection
      variable: Selection of later action from security detections or eviction records
      evidence_keys:
      - REF-001049
      - B015-T1654-REF-GUIVIL
      trace_change: Sources show feedback use but do not isolate a stable acquisition-side change in timing, scope, or appearance.
      defender_effect: Potential response exposure and adaptive persistence, not a demonstrated separate log-read stealth
        signature.
      prerequisites: Relevant records obtained and understood before later decisions.
      defense_difference: Protect response feedback; correlate record access with independent response timeline.
      disposition: evidence-deferred
      reason: Purpose and broad adaptation are supported; paired returns, action choice and observation contrast remain incomplete.
        No child allocated.
    - axis: audit-poor source or interface selection
      variable: Choose query entry path lacking read telemetry
      evidence_keys:
      - B015-T1654-REF-AZURE-QUERY-AUDIT
      - B015-T1654-REF-SENTINEL-AUDIT
      trace_change: Documented coverage gaps can omit an audit event.
      defender_effect: Local query audit may be absent.
      prerequisites: Access through an excluded or unconfigured path.
      defense_difference: Entry-path validation and compensating telemetry.
      disposition: evidence-deferred
      reason: An auditing gap is not evidence that adversaries intentionally selected it; no such selection is established
        by the examined cases.
    - axis: encrypted or deleted outputs and injected caller
      variable: Hide exported content or its caller after discovery
      evidence_keys:
      - B015-T1654-REF-NOPINEAPPLE
      trace_change: Changes output inspectability or later artifact presence rather than the log-discovery query itself.
      defender_effect: Depends on separate concealment behavior.
      prerequisites: Additional transformation, deletion, or process-control capability.
      defense_difference: Hand to relevant collection, stealth, or execution owners.
      disposition: adjacent-technique
      reason: No separate log-enumeration NJS justified by borrowing an unrelated concealment act.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定清单没有 ATT&CK 子项，仍完成六个原生轴的独立检索及结果语义复核。反馈用途证据较强，但用途与采集侧匿迹变量未形成同一结论；分类 deferred 优于以工具、平台或目标字段补造子项。主 Agent 应复核跨技术边界后确认。
      en: The fixed inventory has no ATT&CK children, but six native axes received independent searches and outcome-semantic
        review. Evidence for feedback purpose is stronger than evidence for a matching acquisition-side stealth variable;
        deferred taxonomy is preferable to invented utility, platform, or field-based children. Primary cross-technique review
        remains required.
  primary_review:
    status: passed
    formal_njs_count: 0
    supplement_ref: null
    original_attack_subtechniques_imported: false
- source_attack_id: T1046
  original_research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - direct-port-probing
    - protocol-or-version-interrogation
    - advertised-service-browsing
    - internal-or-hybrid-service-scope
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: direct-port-probing-and-protocol-identification
      resolution: parent-core
      reason: Different information depth is not a stealth partition; connection and protocol evidence remain graded within
        the parent.
    - cluster: advertised-service-browsing
      resolution: niji-variable-candidate
      reason: A documented information-path substitution changes the observation surface, has firsthand adversarial use and
        supports advertisement-specific detection and control.
    - cluster: platform-and-tool-diversity
      resolution: not-stealth-distinct
      reason: Containers, IaaS, devices, macOS and scanner names do not independently define trace or observation differences.
    candidate_stealth_axes_examined:
    - key: B015-T1046-AXIS-ADVERTISEMENT
      variable: select published service-state lookup instead of initial per-listener probing
      disposition: proposed-formal
      supports:
      - B015-T1046-REF-BRADLEY
      - B015-T1046-REF-APPLE-BONJOUR
      - B015-T1046-REF-RFC6763
      trace_change: discovery queries and publisher records replace the candidate-listener connection sequence for this stage
      defender_difference: observe same-link service-type/instance queries and results; constrain advertisement publication/propagation
        separately from listener access
      caveat: no complete result output, no confirmed browse-to-listener sequence, no measured detector failure, no universal
        absence of host contact
    - key: B015-T1046-AXIS-TIME
      variable: reduce or schedule internal probe density
      disposition: evidence-deferred
      reason: Canonical NJS-0001-001 already owns the scanning-time variable in an external scope; no examined T1046 incident
        independently establishes deliberate internal scheduling or a new defense distinction. Do not clone it under a new
        parent.
    - key: B015-T1046-AXIS-DISTRIBUTION
      variable: divide service targets or ports across real internal sources
      disposition: evidence-deferred
      reason: NETSCAN staging on several hosts is not scan execution or complementary assignment; no case-level internal work-distribution
        evidence established.
    - key: B015-T1046-AXIS-ATTRIBUTION
      variable: intermediary or decoy origins obscure the real survey controller
      disposition: adjacent-technique
      reason: General relay attribution and external scanning already have owners. An internal foothold being remote-controlled
        is not itself a new attribution axis.
    - key: B015-T1046-AXIS-FRAGMENTATION
      variable: reduce inspectability through crafted fragments
      disposition: adjacent-technique
      reason: Existing external scanning child owns this variable; the reviewed internal cases do not establish deliberate
        fragmentation or a distinct information-object effect.
    - key: B015-T1046-AXIS-FEATURES
      variable: tailor direct listener probes to resemble permitted clients
      disposition: evidence-deferred
      reason: Merely running a legitimate scanner or common protocol is insufficient. No case-level payload, handshake or
        caller-feature manipulation established a distinct new child.
    - key: B015-T1046-AXIS-STORED-VIEW
      variable: consume a previously produced internal service inventory instead of querying publishers or listeners
      disposition: evidence-deferred
      reason: Stable in principle but needs an actual adversarial read, provenance/staleness evidence, distinct telemetry
        and convergence with cloud/resource/file-content boundaries.
    - key: B015-T1046-AXIS-MANAGEMENT-QUERY
      variable: acquire service endpoints from an inventory/control-plane intermediary
      disposition: evidence-deferred
      reason: Tool capability is documented, but WMI service names do not establish network listeners, and resource topology
        or container inventory cannot be relabeled as service discovery. Needs returned endpoint evidence and control-plane-specific
        defense before formalization.
    - key: B015-T1046-AXIS-PASSIVE
      variable: infer remote services from already existing traffic without active queries
      disposition: adjacent-technique
      reason: Passive capture and environmental fact extraction belong to T1040's convergence work. Active advertisement browsing
        remains separate because it sends queries.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零 ATT&CK 子技术仅说明没有导入式覆盖义务，不意味着不搜索原生变量。已独立比较公告替代、时间、来源分配、归因、可检查性、特征、存量视图与管理代查，并保留被动采集邻界；只有公告替代在本次材料中通过稳定变量、痕迹变化、防守差异和恶意使用证据门槛。最终仍由主
        Agent 决定是否正式化。
      en: Zero ATT&CK children does not waive the native-variable search. Advertisement substitution, timing, source allocation,
        attribution, inspectability, features, stored views and management lookup were independently compared, with passive
        collection preserved as adjacent. Only advertisement substitution passes the stable-variable, trace-change, defensive-difference
        and adversarial-use gates in the examined evidence. Formalization remains the primary agent's decision.
  primary_review:
    status: passed
    formal_njs_count: 1
    supplement_ref: null
    original_attack_subtechniques_imported: false
- source_attack_id: T1135
  original_research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - local_share_configuration
    - remote_share_inventory
    - native_command_and_api_queries
    - share_name_and_metadata_results
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: Fixed parent has no ATT&CK children
      disposition: parent-core
      explanation: Parent behavior includes local/remote share discovery. This absence does not constrain Niji taxonomy count.
    candidate_stealth_axes_examined:
    - axis: Native administrative query appearance
      attacker_control: Select native commands or system interfaces used for share administration.
      trace_change: Familiar executable and normal protocol semantics rather than unfamiliar discovery binary.
      defender_effect: Reduces intent distinction for defenses keyed to tool novelty or anomalous protocol.
      prerequisites: Query execution and accepted server identity context.
      evidence_keys:
      - B015-T1135-REF-NETVIEW
      - B015-T1135-REF-NETSHARE
      - B015-T1135-REF-SHAREENUM
      - REF-000639
      - B015-T1654-REF-NOPINEAPPLE
      disposition: parent-core
      reason: Supports parent NM-FD inference; insufficient sibling partition beyond a broad property common to available
        implementations.
      defense_difference: Role-aware command and protocol analytics, already parent coverage.
    - axis: Reuse of an existing mapped-share relationship
      attacker_control: Query or use a selected preexisting client mapping.
      trace_change: May avoid creating a fresh mapping; does not return the server inventory.
      defender_effect: Mapping provenance can obscure which process selected later content, but that is not share-list result
        semantics.
      prerequisites: Existing mapping in an accessible logon context.
      evidence_keys:
      - NJS-0216-001
      - NJT-0216
      disposition: adjacent-technique
      reason: Existing relation/drive visibility or content collection depending on actual result. Do not relabel the collection
        child as discovery.
      defense_difference: Mapping and successful-read lineage already belongs to DET-000250.
    - axis: Local configuration query versus remote enumeration
      attacker_control: Run query on compromised server or query it from another host.
      trace_change: Endpoint execution/configuration visibility versus a remotely observable RPC exchange.
      defender_effect: Different sensor entry points, without evidence of deliberate adversarial route selection to evade
        a particular observer.
      prerequisites: Local execution or remote service access, respectively.
      evidence_keys:
      - B015-T1135-REF-NETSHARE
      - B015-T1135-REF-NETSHAREENUM
      - B015-T1135-REF-APPLE-SHARING
      disposition: not-stealth-distinct
      reason: Location and interface partition are insufficient to establish an intentional stealth variable. Keep local coverage
        in parent.
      defense_difference: Endpoint and RPC analytics are implementation coverage, not a child proof.
    - axis: Result pagination and temporal dilution
      attacker_control: Information level, preferred buffer length and inter-query delay.
      trace_change: More result pages or longer intervals; protocol pagination itself does not imply intentional concealment.
      defender_effect: Could require longer correlation, but no observed share-enumeration evasion comparison is available.
      prerequisites: Remote interface with continuation and enough time for the query sequence.
      evidence_keys:
      - B015-T1135-REF-NETSHAREENUM
      - B015-T1135-REF-SRVS
      disposition: evidence-deferred
      reason: Normal buffer handling, retries and mutable server state explain the observed mechanics. Need deliberate adversarial
        choice and trace comparison.
      defense_difference: Pagination state tracking is needed for result correctness irrespective of malicious timing.
    - axis: Distribution across real originating clients
      attacker_control: Delegate complementary server queries to multiple controlled hosts.
      trace_change: Reduced per-origin host coverage if actually implemented.
      defender_effect: Could increase cross-origin aggregation cost.
      prerequisites: Multiple controlled reachable clients and coordination.
      evidence_keys: []
      disposition: evidence-deferred
      reason: No conclusion-level firsthand share-enumeration example or validated implementation establishes the stable variable
        in this candidate.
      defense_difference: Potential cross-client result aggregation remains a research direction, not a formal child.
    - axis: Encrypted or protected query transport
      attacker_control: Potentially choose a supported encrypted path, subject to policy and server support.
      trace_change: Network payload inspection may be unavailable while endpoints retain query and result semantics.
      defender_effect: Could change network inspectability but not automatically hide endpoint execution.
      prerequisites: Supported transport and negotiation/context.
      evidence_keys:
      - REF-000476
      disposition: evidence-deferred
      reason: Security transport capability and sensor blind spots do not establish adversarial share-enumeration selection
        for evasion. No NM-DO inference from encryption alone.
      defense_difference: Endpoint coverage remains necessary; insufficient evidence for a child.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零 ATT&CK 子技术的普通广度审查仍覆盖六个独立候选轴。没有轴同时通过攻击者稳定选择、观察差异、证据和兄弟边界门禁，因此建议父项保留，子技术分类 deferred。主 Agent 应复核协议结果与内容收集边界后决定正式数量。
      en: The ordinary breadth review for a zero-child ATT&CK parent nevertheless examined six independent axes. None passes
        stable attacker selection, observation difference, evidence, and sibling-boundary gates together. Retain the parent
        with deferred child taxonomy and let the primary reviewer converge protocol-result and content-acquisition boundaries
        before allocation.
  primary_review:
    status: passed
    formal_njs_count: 0
    supplement_ref: null
    original_attack_subtechniques_imported: false
- source_attack_id: T1040
  original_research:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - host-packet-interface
    - existing-device-capture
    - copy-plane-observation
    - environmental-facts-versus-authentication-material
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: fixed-parent passive environmental observation
      resolution: parent-core
      reason:
        zh: 父级以从既有报文取得环境知识为边界，而不以厂商、协议和接口划分。
        en: The parent is bounded by environmental knowledge from existing packets rather than vendors, protocols, or interfaces.
    - cluster: authentication material
      resolution: adjacent-technique
      adjacent_ref: NJT-0176
      reason:
        zh: 凭据结果已由既有对象及其三个子项覆盖，保持材料门禁。
        en: Existing parent and three children already cover credential outcomes with their material gates preserved.
    candidate_stealth_axes_examined:
    - key: B015-T1040-AXIS-POSITION
      variable: Observation position and copy topology
      disposition: evidence-deferred
      attacker_control:
        zh: 攻击者可在具备权限时选择端点、本地转发节点或复制观察位置。
        en: An appropriately privileged adversary can choose an endpoint, local transit node, or copied observation position.
      trace_change:
        zh: 主要痕迹可能分别落在端点进程、设备命令缓冲或镜像资源与收集器。
        en: Main residue can fall respectively in endpoint processes, device commands and buffers, or mirror resources and
          collectors.
      defender_effect:
        zh: 所需日志域与结果溯源键不同，拥有实际防御价值。
        en: Required logging domains and result-provenance keys differ, providing practical defensive value.
      prerequisites: actual packet visibility and authority at the chosen position
      evidence_keys:
      - REF-000796
      - REF-000794
      - REF-000795
      - B015-T1040-REF-NIST115
      limit:
        zh: 技术能力充分，但本批没有足够环境结果与有意匿迹证据建立稳定兄弟项；禁止复制凭据子项。
        en: Technical capability is established, but environmental-result and intentional-stealth evidence are insufficient
          here for stable siblings; credential children must not be copied.
    - key: B015-T1040-AXIS-NAME-ENRICHMENT
      variable: Suppression of active name enrichment
      disposition: evidence-deferred
      attacker_control:
        zh: 工具可禁用把被观察地址转换为名称的主动查询。
        en: A tool can suppress active lookups used to turn observed addresses into names.
      trace_change:
        zh: 可减少观察器自己生成的名称查询，仍保留所见数字地址与报文内容。
        en: This can remove observer-generated name queries while retaining observed numeric addresses and packet contents.
      defender_effect:
        zh: 仅按解析日志寻找测绘主体的观察模型更难关联观察器。
        en: A model identifying mappers through resolution logs has less opportunity to associate the observer.
      prerequisites: a capture implementation that otherwise performs active enrichment
      evidence_keys:
      - B015-T1040-REF-NIST115
      limit:
        zh: NIST 脚注明确指出该能力与匿迹关系，但本批未验证当前实现、恶意采用和结果保留的对照，暂不正式建项。
        en: NIST's footnote explicitly connects this capability to stealth, but current implementation, adversarial adoption,
          and retained-result comparisons were not validated here, so defer formal creation.
    - key: B015-T1040-AXIS-FILTER-TRUNCATION
      variable: Selective filtering and packet truncation
      disposition: evidence-deferred
      attacker_control:
        zh: 攻击者可在支持实现上选取地址、协议、包长或采样参数。
        en: Supported implementations let an adversary choose address, protocol, packet-length, or sampling parameters.
      trace_change:
        zh: 缓冲与产物体积以及可见正文可能改变。
        en: Buffer and artifact volume and retained payload can change.
      defender_effect:
        zh: 产物扫描可看到更少正文，但缺少事实类别与传感器阈值对照时不能宣称检测下降。
        en: Artifact inspection may see less payload, but detection reduction requires fact-class and sensor-threshold comparisons.
      prerequisites: sufficient headers or payload retained to preserve the particular fact sought
      evidence_keys:
      - REF-000794
      - REF-000797
      limit:
        zh: 同样设置是合法降噪与资源控制，不能把配置能力直接等同有意匿迹或特定信息结果。
        en: The same settings control legitimate noise and resources; capability does not establish intentional stealth or
          a particular information result.
    - key: B015-T1040-AXIS-LIFECYCLE
      variable: Short duration and circular buffering
      disposition: evidence-deferred
      attacker_control:
        zh: 攻击者可设置时限或环形缓冲。
        en: An adversary can configure duration limits or circular buffering.
      trace_change:
        zh: 当前状态与旧包保留可能减少，但远程生命周期审计仍可存在。
