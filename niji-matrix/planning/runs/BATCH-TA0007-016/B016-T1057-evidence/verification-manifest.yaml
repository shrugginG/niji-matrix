result_level_ladder:
- request observed
- snapshot or enumerator returned
- entries or objects delivered
- selected properties consumed
- complete set only with explicit end/completeness evidence
identity_rules:
- client host is not provider host
- process ID requires lifetime or unique process key
- target returned PID is not query client PID
- snapshot time is not perpetual running state
- process handle can outlive termination
