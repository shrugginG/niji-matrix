official_contracts:
- key: B016-T1057-REF-TASKLIST
  url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/tasklist
  locator: Description; Parameters /s, /u, /v, /svc, /m, /fo and /fi; Filter names including IMAGENAME, PID and WINDOWTITLE
  support_limit: Defines local and remote process inventory and arguments; it does not establish invocation success, field
    availability, or reduced underlying enumeration from output filters.
- key: B016-T1057-REF-GETPROCESS
  url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/get-process?view=powershell-7.5
  locator: Description; Examples 3, 6, 7 and 8; parameters Name, Id, Module and FileVersionInfo; Notes
  support_limit: Defines process objects and name/PID selection, with Where-Object filtering returned objects. Details such
    as modules and file version for other users have permission and bitness limits. This 7.5 page does not establish complete
    equivalence with Windows PowerShell 5.1.
- key: B016-T1057-REF-SNAPSHOT
  url: https://learn.microsoft.com/en-us/windows/win32/api/tlhelp32/nf-tlhelp32-createtoolhelp32snapshot
  locator: dwFlags TH32CS_SNAPPROCESS and TH32CS_SNAPALL; th32ProcessID; Return value; Remarks
  support_limit: TH32CS_SNAPPROCESS includes all system processes and its PID argument does not filter that set. Success
    yields a snapshot handle requiring later walking. Module/heap bitness and access restrictions must not be generalized
    to failure of every basic process entry.
- key: B016-T1057-REF-PROCESSFIRST
  url: https://learn.microsoft.com/en-us/windows/win32/api/tlhelp32/nf-tlhelp32-process32firstw
  locator: Parameters hSnapshot and lppe; Return value; Remarks Process32Next
  support_limit: TRUE establishes copying the first entry into the caller buffer; snapshot-handle creation alone is not
    entry consumption. Name, PID, and PPID are neither a full path nor credentials.
- key: B016-T1057-REF-ENUMPROCESSES
  url: https://learn.microsoft.com/en-us/windows/win32/api/psapi/nf-psapi-enumprocesses
  locator: lpidProcess, cb and lpcbNeeded; Return value; Remarks on buffer equality and OpenProcess
  support_limit: Success supplies PID entries. A returned-byte count equal to buffer capacity can be truncated without a
    separate indication. PID recovery, process opening, and detailed queries are separate operations.
- key: B016-T1057-REF-PROCESSRIGHTS
  url: https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
  locator: Process-specific rights; PROCESS_QUERY_INFORMATION, PROCESS_QUERY_LIMITED_INFORMATION, PROCESS_VM_READ and PROCESS_TERMINATE;
    DACL checking; protected processes
  support_limit: Separates query, memory-read, and terminate rights. A right or handle does not establish a later call,
    returned data, or secret extraction. Restricting detailed access does not hide every basic process fact.
- key: B016-T1057-REF-PROCESSIDENTITY
  url: https://learn.microsoft.com/en-us/windows/win32/procthread/process-handles-and-identifiers
  locator: PID validity from creation to termination; handles remain valid until closed even after termination
  support_limit: Establishes that PID is not a permanent identity and that a handle can outlive termination. Creation time
    or a unique process key and event time are required to avoid joining an old snapshot to a later PID instance.
- key: B016-T1057-REF-BOF
  url: https://hstechdocs.helpsystems.com/manuals/cobaltstrike/current/userguide/content/topics/beacon-object-files_main.htm
  locator: What are the advantages of BOFs?; How do BOFs work?; What are the disadvantages of BOFs?; footer 4.13 | 202609280255
    | September 2026
  support_limit: Officially contrasts per-task fork-and-run creation/injection with execution inside Beacon and a lighter
    footprint. This supports capability and design intent, not BOF use in the incidents, absent API telemetry, or measured
    evasion. Shared with T1012 in this batch.
- key: B016-T1057-REF-WMI-QUERY
  url: https://learn.microsoft.com/en-us/windows/win32/api/wbemcli/nf-wbemcli-iwbemservices-execquery
  locator: strQuery and lFlags; WBEM_FLAG_PROTOTYPE; ppEnum; Return value and Remarks
  support_limit: Success may return only an enumerator. Zero instances is not an error and iteration is required to learn
    the result. PROTOTYPE returns a prototype without executing the query and cannot establish acquired process facts.
- key: B016-T1057-REF-WMI-NEXT
  url: https://learn.microsoft.com/en-us/windows/win32/api/wbemcli/nf-wbemcli-ienumwbemclassobject-next
  locator: apObjects and puReturned; WBEM_S_FALSE, WBEM_S_NO_ERROR and WBEM_S_TIMEDOUT; loop termination guidance
  support_limit: WBEM_S_FALSE may accompany valid objects and TIMEDOUT does not establish an empty set. Returned counts,
    status, and later iteration bound consumed results; one HRESULT does not prove complete retrieval.
- key: B016-T1057-REF-WMI-PROCESS
  url: https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-process
  locator: Properties CommandLine, CreationDate, ExecutablePath, Name, ParentProcessId and ProcessId; Methods Create and
    Terminate
  support_limit: Discovery is based on process properties actually read; Create and Terminate are other actions. CreationDate
    helps identify instances, ParentProcessId requires time context, and ExecutablePath carries a SeDebugPrivilege qualifier.
- key: B016-T1057-REF-WMI-TRACE
  url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/system-management-components/troubleshoot-wmi-high-cpu-issues
  locator: Analyze the incoming queries; Review the WMI trace files; Trace Event 11 and Event 12 examples; Find the client
    PIDs causing high CPU usage
  support_limit: Official Trace examples provide ExecQuery text, ClientMachine, User, ClientProcessId, and operation identifiers,
    separating clients from provider HostID. They do not contain complete process-query output or guarantee default complete
    tracing or identical versions; validate locally.
- key: B016-T1057-REF-WMI-ACCESS
  url: https://learn.microsoft.com/en-us/windows/win32/wmisdk/access-to-wmi-namespaces
  locator: Namespace Security; Namespace Auditing; Enable Account and Remote Enable; provider-operation auditing limitation
  support_limit: Namespace DACLs constrain connection, instance-read and remote access. SACL auditing concerns namespace
    authorization rather than provider-operation success; event 4662 cannot substitute for process-result telemetry.
