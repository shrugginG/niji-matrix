candidate:
  source_type: attack
  source_attack_id: T1120
  name:
    zh: 外围设备发现
    en: Peripheral Device Discovery
recommendation:
  decision: retain
  confidence: high
  rationale:
    paragraphs:
    - zh: 固定 Enterprise 19.1 的 T1120 以识别计算机连接的外围设备及组件为直接目的。ESET 对 Attor 的逆向直接记录接入后设备指纹获取；官方接口也区分已安装记录、当前在场设备与启用接口，因此保留父级语义并明确结果层级。常规盘点外观的辨识困难和通知驱动设计均有独立来源，不依靠
        ATT&CK 父页面推导子技术。
      en: T1120 in fixed Enterprise 19.1 concerns identifying peripherals and components connected to a computer. ESET's reverse
        engineering of Attor directly documents device fingerprinting after arrival, while official interfaces distinguish
        installed records, presently available devices, and enabled interfaces. Retain the parent semantics with explicit
        result levels. Ambiguity from ordinary inventory appearance and notification-driven design have independent sources
        rather than being inferred from the ATT&CK parent page.
  scope_notes:
    paragraphs:
    - zh: 设备身份、类别、连接及可用状态归本候选；驱动包和加载信息归 NJT-0180，容量、卷和挂载事实归 NJT-0232，文件清单与音视频内容读取归各自对象。同一调用可能取得多个事实，应按返回事实分别归属。没有设备结果时只记查询尝试；设备存在也不证明摄像、录音、文件取数或传播完成。
      en: Device identity, class, connection, and availability belong here; driver packages and load state belong to NJT-0180,
        capacity, volumes, and mounts to NJT-0232, and file listings or audiovisual content reads to their respective objects.
        One call may produce several facts requiring separate attribution. Without device results record an attempted query
        only. Device presence does not establish completed camera use, recording, file acquisition, or propagation.
  evidence_keys:
  - REF-000625
  - REF-000583
  - B016-T1120-REF-INSTALLED-DEVICES
  - B016-T1120-REF-TRELLIX-NOTIFICATION
  original_attack_subtechniques_imported: false
proposed_content:
  key: B016-T1120-PARENT
  name:
    zh: 外围设备发现
    en: Peripheral Device Discovery
  summary:
    zh: 识别主机连接或已识别的外围设备及其状态，借用正常设备管理外观，或以通知驱动反馈降低持续盘点痕迹。
    en: Identify peripherals connected to or recognized by a host and their states, borrowing ordinary device-management appearance
      or using notification-driven feedback to reduce continuous inventory traces.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 外围设备发现是攻击者在取得主机执行或查询能力后，获取外围设备身份、类别、接口以及连接或可用状态，以理解终端用途和后续行动条件的行为。键盘、摄像头、读卡器、调制解调器及可移动设备都是可能对象，但设备类别和总线名称不决定匿迹分类。发现可以来自一次设备清单、状态查询，也可以来自已建立的设备变更通知关系。
      en: Peripheral Device Discovery obtains peripheral identity, class, interface, and connection or availability state
        after an adversary gains host execution or query capability. It informs terminal function and conditions for later
        activity. Keyboards, cameras, card readers, modems, and removable devices are possible subjects, but classes and bus
        names do not define stealth taxonomy. Discovery can use a device snapshot, a state query, or an established device-change
        notification relationship.
    - zh: 需要区分发起请求、收到通知、接口返回成功与取得可用设备事实。已安装的设备记录可能对应已拔除设备；启用接口说明操作系统提供了某种访问路径，仍不保证调用者有权打开设备或取得内容。Windows PnP 管理器掌握在场状态，直接读取历史注册表项不能代替该判断。这种结果分层避免把普通清单误解为实际使用设备的能力。
      en: Distinguish issuing a request, receiving a notification, an interface reporting success, and obtaining a usable
        device fact. An installed record may describe a disconnected device. An enabled interface indicates an operating-system
        access path but does not guarantee that the caller can open it or obtain content. The Windows PnP manager maintains
        presence state; historical registry entries cannot replace that determination. These result levels prevent an inventory
        from being mistaken for actual device-use capability.
  stealth_characteristics:
    paragraphs:
    - zh: 外围设备发现使用的接口也服务于兼容性检查、打印和会议配置、资产管理以及插拔处理。攻击者借用这些正常功能时，签名工具名、设备类查询或一次只读请求难以表明设备事实的后续用途。进程、参数、主体、查询范围和结果仍可观察；是否属于敌对活动需要结合批准任务、调用来源和入侵上下文判断。
      en: Peripheral Device Discovery uses interfaces also needed for compatibility checks, printer and conferencing setup,
        asset management, and hotplug handling. When adversaries borrow these functions, a signed utility name, a device-class
        query, or one read request poorly reveals the later purpose of the device facts. Processes, arguments, principals,
        query scope, and results can remain observable. Hostile use requires approved-work comparison, caller provenance,
        and intrusion context.
    - zh: 有意把反复枚举改为等待设备变更反馈，可以使安静阶段只留下订阅和存活进程，把补充查询集中到实际变更附近。这样会削弱依赖重复执行或短窗口查询量的分析，但订阅、消息处理、后续设备访问及输出仍可作为关联点。高频插拔、重放事件和启动时快照会增加活动量；通知驱动不意味着痕迹消失，也不是所有正常监听器的恶意标签。
      en: Deliberately replacing repeated enumeration with device-change feedback can leave only a subscription and resident
        process during quiet periods, concentrating supplementary queries around actual changes. This weakens analytics relying
        on repeated execution or short-window query counts, while registration, message handling, later device access, and
        output remain correlation points. Frequent hotplug changes, replayed events, and startup snapshots can increase activity.
        Notification-driven operation does not remove traces or make every ordinary listener malicious.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入以外围设备事实为直接结果的枚举、状态查询及设备变更反馈解释，包括从返回的设备实例标识、描述或接口信息识别设备。对可移动存储，同一次操作中的设备身份和连接事实可归本技术，卷容量和文件系统事实归本地存储发现，实际文件枚举和内容复制另行判断。仅列出驱动包而没有设备事实属于设备驱动程序发现。
      en: Include enumeration, status queries, and interpretation of device-change feedback whose direct result is a peripheral
        fact, including identification from returned device-instance IDs, descriptions, or interface information. For removable
        storage, device identity and connection facts from one operation can belong here, while volume capacity and filesystem
        facts belong to Local Storage Discovery and actual file enumeration or copying requires separate assessment. A driver-package
        listing without device facts belongs to Device Driver Discovery.
    - zh: 排除单纯安装或禁用设备、输入注入、摄像或录音、介质传播及文件取数。进程、窗口或一般硬件配置清单也不因可能间接涉及外设就自动归入。合法支持工具、会议软件、辅助设备管理与取证工作有相同外观；设备热插拔或系统重建自身产生的通知不是攻击者发起的查询。缺少进程启动、缺少
        6416 或只有历史设备记录，都不能单独证明隐藏发现或当前连接。
      en: Exclude device installation or disablement alone, input injection, camera or audio recording, removable-media propagation,
        and file acquisition. Process, window, or general hardware-configuration inventories do not automatically belong here
        merely because they might indirectly concern peripherals. Support tools, conferencing software, accessibility-device
        management, and forensics have similar appearances. Notifications from hotplug or system reconstruction are not adversary-issued
        queries. Absent process creation, absent 6416, or historical records alone establish neither hidden discovery nor
        current connection.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者可在终端驻留期间识别工作站是否提供会议设备、认证外设或临时接入介质，再选择后续模块和目标。ESET 的 Attor 分析证明接入后设备指纹行为，Trellix 的恶意挖矿集群分析证明到达通知参与传播目标识别；两者都不能据此推断每台受害主机上后继动作成功。正常环境的通知接口说明如何持续获得变更，跨平台范围不等于各平台都有同等实案证据。
        en: During endpoint residence an adversary can identify conferencing equipment, authentication peripherals, or temporarily
          attached media before selecting later modules and targets. ESET's Attor analysis establishes post-arrival device
          fingerprinting, and Trellix's mining-cluster analysis establishes arrival notifications in propagation-target identification.
          Neither establishes successful follow-on actions on every victim. Ordinary notification interfaces explain continued
          change discovery, while cross-platform scope does not imply equally strong incident evidence on every platform.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要能执行本机查询或保有接收反馈的应用、服务或会话，并取得至少一个设备事实。普通用户可访问的设备元数据和需要额外设备访问权限的操作不同，不能统一假设管理员权限。通知驱动实现还需要保持处理上下文存活、正确解释通知类型，并接受未发生变更时没有新增事实；设备打开或内容读取可能仍被访问控制拒绝。
          en: The adversary needs a local querying process or an application, service, or session able to retain feedback,
            and must obtain at least one device fact. Ordinary-user metadata access differs from operations requiring additional
            device authority, so administrator access is not universally assumed. Notification-driven implementations also
            need a live handling context, correct notification-type interpretation, and tolerance for no new facts while no
            change occurs. Device opening or content reading may remain denied.
      defender_model:
        paragraphs:
        - zh: 防守方可能有端点进程和命令行、按策略开启的脚本块与 Linux exec 审计，以及已启用的 PnP 设备识别记录。前者主要给出请求语义，后者主要给出设备状态事件；6416 的主体通常是 SYSTEM，不能用来归属任意设备查询进程。需要验证的专用调用追踪才能提供进程内订阅、消息处理和返回事实。缺少该追踪时，不能把默认
            EDR 或插拔日志描述成完整查询审计。
          en: Defenders may have endpoint process and command-line records, policy-enabled script-block and Linux execution
            audit, and enabled PnP recognition records. Execution sources mainly describe request semantics; device events
            mainly describe state. The 6416 principal is commonly SYSTEM and cannot attribute arbitrary device queries. Dedicated,
            validated call tracing is needed for in-process subscriptions, message handling, and returned facts. Without it,
            default EDR or hotplug logs cannot be described as complete query auditing.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 借用正常设备盘点与插拔处理的接口外观
      en: Borrow the interface appearance of ordinary device inventory and hotplug handling
    analysis:
      paragraphs:
      - zh: 攻击者使用设备管理功能取得外围设备事实，留下与合法支持、资产管理和应用配置相同的查询外观。接口本身可见时，单靠工具签名或设备类名称仍难以区分维护与敌对目标选择；将调用者、批准工作和具体返回事实相接才能加强判断。恶意软件逆向与官方功能合同支持这种正常与恶意功能重叠，但未量化漏报，故机理为
          medium。
        en: An adversary uses device-management functions to obtain peripheral facts, leaving query appearances shared with
          support, asset management, and application setup. Even when the interface is visible, signatures or device-class
          names poorly distinguish maintenance from hostile target selection. Joining caller, approved work, and actual returned
          facts improves judgment. Malware reverse engineering and official interface contracts support this legitimate-malicious
          overlap without measuring missed detection, so the mechanism is medium-confidence.
    evidence_keys:
    - REF-000583
    - B016-T1120-REF-INSTALLED-DEVICES
    - B016-T1120-REF-PNPUTIL
    confidence: medium
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 将持续枚举改为变更触发反馈以降低安静阶段的查询密度
      en: Replace continuous enumeration with change-triggered feedback to lower query density during quiet periods
    analysis:
      paragraphs:
      - zh: 通知驱动设计把发现触发条件从重复定时查询转为外部设备状态变化。没有变化时不必重复形成清单请求，关联点则分散在先前接收关系和稍后的变更处理之间；只统计短时枚举次数的分析难以恢复持续监视。Trellix 直接对比了监听和轮询的
          I/O 噪声，官方合同证明反馈可实施；没有同配置检测实验，且变更后的查询可集中暴露，因此只作 medium 的条件性结论。
        en: Notification-driven design changes the discovery trigger from repeated timed requests to external device-state
          changes. Quiet periods need no repeated inventory requests, while correlation points span an earlier receiving relationship
          and later change handling. Short-window enumeration counts can therefore fail to reconstruct ongoing monitoring.
          Trellix directly contrasts listening and polling I/O noise, and official contracts establish implementability. There
          is no matched detection experiment, and post-change queries may be conspicuous, so this remains a conditional medium-confidence
          conclusion.
    evidence_keys:
    - B016-T1120-REF-TRELLIX-NOTIFICATION
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-WM-DEVICECHANGE
    - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    subtechnique_keys:
    - B016-T1120-CHILD-NOTIFICATION
    narrative:
      paragraphs:
      - zh: 本技术按发现反馈的触发关系建立通知驱动外围设备发现：有意用设备变更反馈代替持续快照，使安静阶段不形成重复盘点请求，防守需要关联接收上下文与后续处理。该变量不以工具、操作系统、总线或设备类别划分；初始快照可以与订阅并存，也不改变主要增量反馈的边界。
        en: 'The taxonomy distinguishes Notification-Driven Peripheral Discovery by its feedback trigger: deliberate use of
          device-change feedback instead of continuous snapshots removes repeated inventory requests during quiet periods
          and requires defenders to join the receiving context with later handling. The variable is independent of tools,
          operating systems, buses, and device classes. A startup snapshot may coexist with subscription without changing
          the principal incremental-feedback boundary.'
      - zh: 窄设备类查询、历史记录读取和进程内 API 都可能改变观测位置，但本次没有把它们各自提升为子项。选择设备类只说明目标，历史记录存在新鲜度限制，进程内接口并非自动的匿迹选择；后续需要独立的可控差异和防御价值。通知驱动也不能涵盖采集内容、传播或在场状态伪造。
        en: Narrow-class queries, historical-record reads, and in-process APIs can affect observation locations, but are not
          separately promoted here. Device-class selection alone describes a target, historical records have freshness limits,
          and an in-process interface is not automatically an evasion choice. Further promotion requires independent controlled
          differences and defense value. Notification-driven discovery does not encompass content collection, propagation,
          or falsification of presence state.
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B016-T1120-DET-QUERY
      - B016-T1120-DET-NOTIFICATION
    mitigations:
      coverage: available
      mitigation_keys:
      - B016-T1120-MIT-PERIPHERAL-GOVERNANCE
  evidence:
    claim_keys:
    - B016-T1120-CLM-RELEVANCE
    - B016-T1120-CLM-STATE-BOUNDARY
    - B016-T1120-CLM-INVENTORY-OVERLAP
    - B016-T1120-CLM-NOTIFICATION-CHILD
    - B016-T1120-CLM-PNP-OBSERVATION
    case_keys:
    - B016-T1120-CASE-ATTOR-DEVICE
    - B016-T1120-CASE-TRELLIX-LISTENER
    reference_keys:
    - REF-000625
    - REF-000484
    - REF-000583
    - REF-000598
    - REF-000463
    - REF-000840
    - REF-000595
    - B016-T1120-REF-INSTALLED-DEVICES
    - B016-T1120-REF-PNPUTIL
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-WM-DEVICECHANGE
    - B016-T1120-REF-SHELL-NOTIFICATION
    - B016-T1120-REF-UDEVADM
    - B016-T1120-REF-LIBUDEV
    - B016-T1120-REF-PNP-AUDIT
    - B016-T1120-REF-6416
    - B016-T1120-REF-TRELLIX-NOTIFICATION
    - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
  research:
    limitations:
      paragraphs:
      - zh: 恶意行为证据来自设备监视插件和蠕虫模块的公开逆向，不能代表全部目标、设备种类或平台。Attor 资料中的状态、身份和文件信息须分层归属；Trellix 对监听减少轮询噪声的解释未提供相同配置下的告警率，且其接口类注册与卷广播叙述存在需要按官方合同拆开的细节。不能把
          WM_DEVICECHANGE 的消息值当作 Windows 事件日志 ID。
        en: Adversarial evidence comes from public reverse engineering of a device-monitor plug-in and a worm module, not
          all targets, device types, or platforms. Attor's state, identity, and file information requires separate attribution.
          Trellix's explanation of reduced polling noise has no matched alert-rate comparison, and its interface-registration
          and volume-broadcast details require separation using official contracts. The WM_DEVICECHANGE message value is not
          a Windows Event Log ID.
      - zh: 官方文档证明接口和字段而非敌对动机，通知监听在正常应用中也很常见。提出的专用调用追踪和 Linux 审计尚未部署验证，进程日志不保留全部结果，macOS 的专用分析仍待传感器合同核验。当前 medium 匿迹结论应随同源订阅—反馈—结果记录、正常基线和检测对照而调整；没有通知或设备事件并不能排除持续监视。
        en: Official documentation establishes interfaces and fields rather than hostile intent, and notification listeners
          are common in ordinary applications. Proposed dedicated call tracing and Linux audit have not been deployment-validated,
          process logs lack complete results, and a macOS-specific analytic awaits sensor-contract verification. The medium-confidence
          stealth conclusions should change with same-context subscription, feedback, and result records, legitimate baselines,
          and detection comparisons. Absent notification or device events do not exclude ongoing monitoring.
proposed_subtechniques:
- key: B016-T1120-CHILD-NOTIFICATION
  parent_key: B016-T1120-PARENT
  name:
    zh: 通知驱动外围设备发现
    en: Notification-Driven Peripheral Discovery
  summary:
    zh: 有意通过设备变更通知取得增量设备事实，代替持续重复的设备快照，并将查询痕迹集中到变更附近。
    en: Deliberately obtain incremental device facts through device-change notifications instead of continuously repeating
      snapshots, concentrating query traces around changes.
  aliases: []
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 通知驱动外围设备发现是攻击者建立或利用设备变更反馈关系，等待连接、可用或移除变化，再从反馈本身或必要的补充查询取得设备事实的行为。稳定变量是发现由变更反馈触发，而不是持续定时重建清单。注册回调、窗口接收和 netlink 监听是实现途径；某些默认广播无需额外注册，不能把一个
        API 名称设为分类前提。
      en: Notification-Driven Peripheral Discovery establishes or uses device-change feedback, waits for connection, availability,
        or removal changes, and derives device facts from feedback or necessary supplementary queries. The stable variable
        is a change-feedback trigger rather than continuous timed inventory reconstruction. Callback registration, window
        reception, and netlink listening are implementations. Some default broadcasts require no additional registration,
        so one API name cannot be a classification prerequisite.
    - zh: 该选择与发现结果的后继使用分开。收到到达通知可以给出接口或设备类型线索，后续打开设备、读取具体属性及取得内容仍有各自结果。Trellix 的逆向直接讨论通知监听替代轮询的噪声差异；Attor 的反馈后设备指纹提供独立实施证据，但不能由其监听架构单独推断规避动机或测量效果。
      en: This selection is separate from later use of discovery results. An arrival message can reveal an interface or device-type
        clue, while later device opening, property reads, and content acquisition have separate outcomes. Trellix's reverse
        engineering directly discusses the noise difference from notification listening instead of polling. Attor's feedback-driven
        device fingerprinting independently establishes implementation, but its listener architecture alone does not establish
        an evasion motive or measured effectiveness.
  stealth_characteristics:
    paragraphs:
    - zh: 通知驱动外围设备发现把长期监视的可见活动压缩为接收关系和零散变更处理。设备状态不变时缺少重复枚举峰值，使按命令执行次数或短时 API 计数识别盘点的防守方容易遗漏持续关注。接入后仍可能出现属性请求和结果写入，订阅上下文、接收进程及其存活时间也是正面证据，不能用“没有查询”反推该实现。
      en: Notification-Driven Peripheral Discovery compresses visible ongoing monitoring into a receiving relationship and
        sparse change handling. Without state changes, repeated enumeration peaks are absent, weakening discovery based on
        command counts or short-term API counts. Property queries and result writes may still follow arrival, while receiving
        context, process identity, and lifetime remain positive evidence. Absence of queries cannot establish this implementation.
    - zh: 匿迹收益取决于原本会持续轮询的对照和实际变更频率；持续热插拔或集中补查会使处理并不稀疏。启动快照可以补足已经在场设备，随后通知也可能重复报告同一接口。合法后台设备服务具有相同节奏，因此需要把变更来源、事实取得和授权任务连接，而不是把长驻监听器本身当作告警结论。
      en: The stealth benefit depends on a baseline that would otherwise keep polling and on actual change frequency; continuous
        hotplug or concentrated follow-up queries can make handling dense. A startup snapshot may cover already-present devices,
        and later notification may report the same interface again. Legitimate background device services have similar timing,
        requiring linkage among the change source, fact acquisition, and authorized work rather than treating a resident listener
        alone as a verdict.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入需要证明接收设备变更的执行上下文和以该反馈取得设备事实的链，并有设计、配置或行为证据说明以此替代持续快照。只调用注册函数而失败、只有 API 导入、只有系统 6416、普通窗口被动收到广播或偶发低频查询均不足。进程注册成功、收到反馈和返回设备事实应分别记录，不能互相代替。
      en: Inclusion requires an execution context receiving device changes, a chain from that feedback to device facts, and
        design, configuration, or behavioral evidence that this replaces continuous snapshots. A failed registration call,
        API imports alone, system 6416 alone, incidental broadcast delivery, or infrequent queries is insufficient. Successful
        registration, feedback reception, and returned device facts require separate records rather than substitution for
        one another.
    - zh: 设备插入后实际复制载荷属于传播，读取文件内容属于采集，伪造设备身份属于另一个行为。它们可与本子项形成链，不能用后继动作替代发现证明。Windows 接口到达通知与卷广播应按各自结构解释；Linux 内核 uevent 和规则处理后事件也可能重复或由测试重放，不能把每条事件当作新物理插入。
      en: Copying a payload after insertion is propagation, reading file contents is collection, and falsifying device identity
        is another behavior. These may form a chain with this child but cannot replace discovery evidence. Windows interface-arrival
        notifications and volume broadcasts require their respective structures. Linux kernel uevents and post-rule events
        may duplicate or be test replays, so each event cannot be treated as a new physical insertion.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 该设计适合可长期保留执行上下文、目标设备间歇接入且允许等待的驻留活动。在安静阶段只等待变化，接入后再取得相关设备事实，可支持后续目标选择。它不适合要求立即得到全机完整清单的任务，除非另有启动快照；现有 Windows 恶意样本证明可实施性，Linux
          官方能力不等于已发现相同恶意活动。
        en: The design suits residence with a long-lived execution context, intermittently attached targets, and tolerance
          for waiting. Waiting during quiet periods and obtaining facts after arrival can support later target selection.
          It does not immediately provide a complete host inventory without an additional startup snapshot. Existing Windows
          malware establishes implementability; Linux's documented capability does not establish an equivalent observed campaign.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须能保留接收消息或回调的进程、服务或监听套接字，正确设置感兴趣的设备范围，并解释反馈。发现基本标识不默认要求打开设备内容权限，但补充查询可能失败。挂起、重启、消息队列处理缺陷、过滤错误或丢失反馈都会使视图不完整；攻击者不能控制正常使用者何时接入目标设备。
          en: The adversary must retain a process, service, or listening socket receiving messages or callbacks, select the
            relevant device scope, and interpret feedback. Basic identification does not universally require content-access
            authority, although supplementary queries may fail. Suspension, restart, queue-handling defects, incorrect filters,
            and lost feedback can leave incomplete views. The adversary does not control when an ordinary user attaches a
            target device.
      defender_model:
        paragraphs:
        - zh: 防守模型针对只有进程和短窗口查询计数的常规观察，并考虑专用追踪增强后的差异。经验证的调用追踪可保留接收上下文、返回状态、通知结构及后继属性结果；Linux 命令审计能识别显式 monitor 启动但看不到所有进程内
            libudev 监听。设备识别日志提供变更时刻，通常不指出哪个应用收到了广播，因此它只能作旁证。
          en: The defender model begins with ordinary process telemetry and short-window query counts and considers added
            dedicated tracing. Validated call tracing can retain receiving contexts, return status, notification structures,
            and subsequent property results. Linux command auditing can identify explicit monitor execution but not every
            in-process libudev listener. Recognition logs provide change timing and usually do not identify which application
            received a broadcast, so they are corroboration only.
  stealth_mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    summary:
      zh: 用变更反馈替代重复快照使监视痕迹跨接收生命周期稀疏分布
      en: Replace repeated snapshots with change feedback so monitoring traces are sparse across the receiving lifetime
    analysis:
      paragraphs:
      - zh: 攻击者选择先保留反馈关系再等待实际变更，使没有设备变化的时间段不再重复生成设备清单请求。短窗口计数因而只看到最初建立和后来处理的片段，恢复持续设备监视需要跨越接收生命周期关联。Trellix 对轮询噪声的明确对比和官方消息合同支撑这一有意可选设计；没有公开控制实验，不能声称所有传感器失效或所有监听都是为了匿迹，故置信度为
          medium。
        en: The adversary first retains a feedback relationship and waits for actual changes, avoiding repeated device inventories
          during unchanged periods. Short-window counts consequently see fragments at initial establishment and later handling,
          while reconstructing continued monitoring requires correlation across the receiving lifetime. Trellix's explicit
          polling-noise comparison and official message contracts support this intentionally selectable design. Without controlled
          experiments, the claim is neither universal sensor failure nor stealth intent for every listener, so confidence
          is medium.
    evidence_keys:
    - B016-T1120-REF-TRELLIX-NOTIFICATION
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-WM-DEVICECHANGE
    - B016-T1120-REF-LIBUDEV
    - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B016-T1120-DET-NOTIFICATION
    mitigations:
      coverage: available
      mitigation_keys:
      - B016-T1120-MIT-PERIPHERAL-GOVERNANCE
  evidence:
    claim_keys:
    - B016-T1120-CLM-NOTIFICATION-CHILD
    - B016-T1120-CLM-PNP-OBSERVATION
    - B016-T1120-CLM-NOTIFICATION-CONTRACT
    case_keys:
    - B016-T1120-CASE-ATTOR-DEVICE
    - B016-T1120-CASE-TRELLIX-LISTENER
    reference_keys:
    - REF-000583
    - REF-000840
    - B016-T1120-REF-TRELLIX-NOTIFICATION
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-WM-DEVICECHANGE
    - B016-T1120-REF-SHELL-NOTIFICATION
    - B016-T1120-REF-UDEVADM
    - B016-T1120-REF-LIBUDEV
    - B016-T1120-REF-PNP-AUDIT
    - B016-T1120-REF-6416
    - REF-000595
    - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
  research:
    limitations:
      paragraphs:
      - zh: Trellix 与 ESET 支持具体反馈式设备发现设计，但没有公布同一样本的轮询版本、全部返回数据或检测差分。Trellix 的主动轮询对照是作者的技术解释，不能直接等同于已测规避；Attor 监听后的主动设备访问也不能描述成全程被动。接口类过滤与卷事件必须按官方结构分别校验。
        en: Trellix and ESET support specific feedback-based discovery designs but provide neither a polling version of the
          same sample, complete returned data, nor detection differentials. Trellix's polling comparison is the author's technical
          interpretation rather than measured evasion. Attor's active device access after listening cannot be described as
          wholly passive. Interface-class filters and volume events require separate validation against official structures.
      - zh: 合法应用普遍使用通知，单个订阅或隐藏窗口无法证明恶意。Windows 专用追踪须先验证字段与覆盖；默认进程日志可能完全看不到接收，Linux 命令路径分析也会漏掉进程内实现。缺少事件期间无法区分无变化、丢失遥测和未运行；因此分析保留不确定状态并依赖正面接收与结果证据。
        en: Legitimate applications widely use notifications, so a subscription or hidden window alone does not establish
          maliciousness. Windows tracing requires prior field and coverage validation; default process logs may miss reception
          completely, and Linux command-path analysis misses in-process implementations. During event absence, unchanged devices,
          lost telemetry, and inactive listeners cannot be distinguished. Analytics therefore retain uncertainty and require
          positive receiving and result evidence.
defense_candidates:
  detection_strategies:
  - key: B016-T1120-DET-QUERY
    name:
      zh: 外围设备查询的语义与授权工作核验
      en: Peripheral-Query Semantics and Authorized-Work Verification
    summary:
      zh: 识别明确的设备清单请求，并按返回事实、调用者与批准任务区分外围设备测绘。
      en: Identify explicit device-inventory requests and distinguish peripheral mapping through returned-fact semantics,
        callers, and approved tasks.
    description:
      paragraphs:
      - zh: 策略覆盖显式 Windows 设备查询和 Linux 设备数据库查询，分别由命令与脚本分析、exec 与参数重建承担。它把设备事实与驱动和容量事实分开，不把查询执行当作结果成功；进程内接口与 GUI 的缺口须单独保留。通知式实现由独立策略关联接收生命周期。
        en: The strategy covers explicit Windows device queries and Linux device-database queries through command and script
          analysis and execution-argument reconstruction respectively. It separates device facts from driver and capacity
          facts and does not equate execution with successful results. In-process and GUI gaps remain explicit. A separate
          strategy correlates notification-based receiving lifetimes.
    detects_keys:
    - B016-T1120-PARENT
    domains:
    - enterprise
    analytic_keys:
    - B016-T1120-NJA-WINDOWS-QUERY
    - B016-T1120-NJA-LINUX-QUERY
    evidence_keys:
    - B016-T1120-REF-PNPUTIL
    - B016-T1120-REF-INSTALLED-DEVICES
    - B016-T1120-REF-UDEVADM
    - REF-000598
    - REF-000463
    - REF-000840
  - key: B016-T1120-DET-NOTIFICATION
    name:
      zh: 设备变更接收生命周期与事实取得关联
      en: Device-Change Receiving Lifetimes and Fact-Acquisition Correlation
    summary:
      zh: 把设备变更接收者、反馈与结果连接，发现绕过重复盘点计数的持续设备监视。
      en: Join device-change receivers, feedback, and results to identify ongoing device monitoring missed by repeated-inventory
        counts.
    description:
      paragraphs:
      - zh: Windows 分析要求经验证的接收与调用追踪，区分注册返回、窗口默认广播和结果；Linux 分析以 exec 审计识别显式 monitor 命令并核对授权。两者关注从等待到设备事实的链，而不是根据单次插拔或缺少轮询判定。6416
          仅用于状态旁证，不充当订阅者归属来源。
        en: The Windows analytic requires validated receiving and call tracing and distinguishes registration returns, default
          window broadcasts, and results. The Linux analytic uses execution audit to identify explicit monitor commands and
          check authorization. Both focus on the chain from waiting to device facts rather than judging from hotplug alone
          or absent polling. Event 6416 is state corroboration rather than subscriber attribution.
    detects_keys:
    - B016-T1120-PARENT
    - B016-T1120-CHILD-NOTIFICATION
    domains:
    - enterprise
    analytic_keys:
    - B016-T1120-NJA-WINDOWS-NOTIFICATION
    - B016-T1120-NJA-LINUX-MONITOR
    evidence_keys:
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-SHELL-NOTIFICATION
    - B016-T1120-REF-WM-DEVICECHANGE
    - B016-T1120-REF-LIBUDEV
    - B016-T1120-REF-UDEVADM
    - B016-T1120-REF-PNP-AUDIT
    - B016-T1120-REF-6416
    - REF-000840
    - REF-000583
    - B016-T1120-REF-TRELLIX-NOTIFICATION
    - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
  detection_analytics:
  - key: B016-T1120-NJA-WINDOWS-QUERY
    strategy_key: B016-T1120-DET-QUERY
    name:
      zh: Windows 显式设备枚举与状态语义分流
      en: Windows Explicit Device Enumeration and State-Semantics Routing
    summary:
      zh: 识别设备枚举命令并按连接过滤、请求对象和批准工作生成有结果等级的发现线索。
      en: Identify device-enumeration commands and produce result-qualified leads using connection filters, requested objects,
        and approved work.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 从 DeviceProcessEvents 的 ProcessCreated 记录选取 pnputil 的 /enum-devices、/enum-interfaces、/enum-devicetree 或 /enum-containers
          请求，解析完整参数而非仅命中进程名。/enum-drivers 分流到驱动发现，/scan-devices 是请求硬件重扫而不是本分析的枚举等价物。保留 /connected、/disconnected、/class、/instanceid
          和 /properties 等实际请求范围，核对该参数在目标 Windows 版本是否受支持；仅据执行记为尝试。
        en: Select ProcessCreated DeviceProcessEvents for pnputil requests using /enum-devices, /enum-interfaces, /enum-devicetree,
          or /enum-containers and parse complete arguments rather than the image name alone. Route /enum-drivers to driver
          discovery; /scan-devices requests a hardware rescan rather than equivalent enumeration. Retain actual scope such
          as /connected, /disconnected, /class, /instanceid, and /properties, checking support on the target Windows version.
          Execution alone is an attempt.
      - zh: 将 DeviceId、ProcessId 和 ProcessCreationTime 归一为 host_id、process_id 和 process_start，连接 AccountSid、LogonId、父进程及批准支持作业；避免把
          XDR DeviceId 当作外设实例标识。4104 若已开启可补充 Get-PnpDevice 等脚本语义，但没有脚本内容不表示没有 API 查询。对罕见调用者、与主机职责不符的跨类盘点或入侵会话升高优先级；只有另有可验证输出时才记录设备集合和结果成功，不从零退出码或空日志推断。
        en: Normalize DeviceId, ProcessId, and ProcessCreationTime as host_id, process_id, and process_start, joining AccountSid,
          LogonId, parent process, and approved support work. Do not mistake XDR DeviceId for a peripheral-instance identifier.
          Enabled 4104 can supplement script semantics such as Get-PnpDevice, but absent scripts do not exclude API querying.
          Prioritize unusual callers, cross-class inventories inconsistent with host role, or compromised sessions. Record
          device sets and successful results only with independently validated output, not from zero exit status or absent
          logs.
    data_requirements:
    - source_type: endpoint-process-events
      name:
        zh: 已部署 MDE 的进程与参数记录
        en: Process and argument records from deployed MDE
      channel: Microsoft Defender XDR DeviceProcessEvents
      required_fields:
      - timestamp
      - action_type
      - device_id
      - process_id
      - process_creation_time
      - file_name
      - folder_path
      - process_command_line
      - account_sid
      - logon_id
      - initiating_process_id
      - initiating_process_creation_time
    observables:
    - zh: 明确的设备清单请求、连接过滤与目标类范围
      en: Explicit device inventories with connection filters and class scope
    - zh: 调用者和批准作业不一致以及查询结果等级
      en: Caller mismatch with approved work and query-result evidence level
    correlation:
      window:
        zh: 先以同一进程生命周期连接参数，再以十五分钟作业窗口核验主体；该窗口是部署起点而非恶意阈值。
        en: Join arguments within one process lifetime and check principals within an initial fifteen-minute work window;
          this is a deployment starting point rather than a maliciousness threshold.
      dimensions:
      - host_id
      - process_id
      - process_start
      - account_sid
      - logon_id
    false_positives:
    - zh: 打印、会议或驱动支持、受管资产盘点及设备故障诊断
      en: Printer, conferencing, or driver support, managed inventories, and device troubleshooting
    blind_spots:
    - zh: 进程内 SetupAPI、GUI 和缺失命令行不一定产生可判定请求；默认日志没有设备返回集合。
      en: In-process SetupAPI, GUIs, and missing command lines may lack attributable requests; default logs do not contain
        returned device sets.
    tuning_guidance:
      paragraphs:
      - zh: 批准项绑定二进制完整路径、操作者、目标主机角色和支持工单期限，避免按 Microsoft 签名或 pnputil 名称整体放行。先用目标版本支持的只读枚举验证字段和参数归一，再保存未知结果；不要为提高命中率而把 /enum-drivers
          或 /scan-devices 混入。
        en: Bind approvals to full binary paths, operators, host roles, and expiring support tickets rather than allowing
          all Microsoft-signed or pnputil activity. Validate fields and argument normalization with supported read-only enumeration
          on the target version, retaining unknown outcomes. Do not mix /enum-drivers or /scan-devices into this logic to
          inflate coverage.
    evidence_keys:
    - B016-T1120-REF-PNPUTIL
    - B016-T1120-REF-INSTALLED-DEVICES
    - REF-000598
    - REF-000463
  - key: B016-T1120-NJA-LINUX-QUERY
    strategy_key: B016-T1120-DET-QUERY
    name:
      zh: Linux udev 数据库查询的会话归属
      en: Linux udev Database-Query Session Attribution
    summary:
      zh: 重建 udevadm info 的查询范围并与登录身份及运维任务核验。
      en: Reconstruct udevadm info scope and verify it against login identity and operational work.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 在事先配置且已验证的 execve/execveat 审计范围内，以同一 audit serial 合并 SYSCALL、EXECVE 和 PROCTITLE，重建 udevadm info 的实际 argv。解析 --query、--export-db、--attribute-walk、--path
          或 --name，识别读取设备数据库或属性链的请求；trigger、test、control 的修改、测试或重放语义不按等价只读发现计数。数据库记录与当前物理连接不是同一结论。
        en: Within preconfigured, validated execve/execveat auditing, join SYSCALL, EXECVE, and PROCTITLE by audit serial
          and reconstruct actual argv for udevadm info. Parse --query, --export-db, --attribute-walk, --path, and --name to
          identify database or attribute-chain requests. Mutation, testing, or replay semantics in trigger, test, and control
          are not counted as equivalent read discovery. Database records do not establish current physical connection.
      - zh: 用 node、auid、ses、pid 与事件时间连接执行者、登录会话及批准作业，区分宿主机设备视图和受限容器视图。对非设备管理角色发起全库导出、跨多类属性遍历或来自已知入侵会话的查询生成线索。SYSCALL success
          仅说明执行结果，不提供查询返回内容；没有实际 stdout 或结果文件验证时，保留“查询已发起、结果未知”。
        en: Use node, auid, ses, pid, and event time to join execution, login session, and approved work, distinguishing the
          host view from restricted container views. Generate leads for whole-database export by non-device-management roles,
          walks across device classes, or queries from a known compromised session. SYSCALL success describes execution rather
          than returned query content. Without actual stdout or validated output files, retain 'query issued, result unknown.'
    data_requirements:
    - source_type: linux-execution-audit
      name:
        zh: 经配置的 Linux 执行审计关联记录
        en: Configured Linux execution-audit records
      channel: Linux audit SYSCALL/EXECVE/PROCTITLE
      required_fields:
      - node
      - audit_serial
      - timestamp
      - auid
      - ses
      - pid
      - ppid
      - exe
      - argv
      - success
    observables:
    - zh: udevadm info 请求的数据库导出、属性链或指定设备范围
      en: Database exports, attribute walks, or selected-device scope requested with udevadm info
    correlation:
      window:
        zh: 同一 audit serial 先合并执行事件，再按同一会话回看三十分钟以核验作业上下文；保留完整事件时间避免 PID 复用。
        en: Merge execution by audit serial, then initially review thirty minutes within the same session for work context;
          retain full timestamps to avoid PID reuse.
      dimensions:
      - node
      - audit_serial
      - auid
      - ses
      - pid
      - timestamp
    false_positives:
    - zh: 安装器、udev 规则调试、硬件维修、取证和容器初始化
      en: Installers, udev-rule debugging, hardware repair, forensics, and container initialization
    blind_spots:
    - zh: 未配置 exec 规则、直接读取 sysfs 或进程内 libudev 不保证落入该命令路径；执行审计不记录 stdout。
      en: Missing execution rules, direct sysfs reads, and in-process libudev may bypass this command path; execution audit
        does not record stdout.
    tuning_guidance:
      paragraphs:
      - zh: 以本机 udevadm 版本和批准服务账户建立参数基线，用独立字段保留 audit 原始键和解码 argv。先验证规则是否覆盖本机架构及 execveat，再记录丢失与积压；不要以事件缺失宣告没有发现。合法规则调试允许项应限时，避免按
          root 或 /usr/bin/udevadm 整体排除。
        en: Baseline arguments by installed udevadm version and approved service account, preserving raw audit keys and decoded
          argv separately. Validate architecture and execveat coverage and track loss and backlog rather than declaring no
          discovery from missing events. Time-limit legitimate rule-debugging exceptions instead of excluding root or /usr/bin/udevadm
          wholesale.
    evidence_keys:
    - B016-T1120-REF-UDEVADM
    - REF-000840
  - key: B016-T1120-NJA-WINDOWS-NOTIFICATION
    strategy_key: B016-T1120-DET-NOTIFICATION
    name:
      zh: Windows 设备反馈接收与设备事实链
      en: Windows Device-Feedback Reception and Device-Fact Chain
    summary:
      zh: 在专用追踪可用时，将订阅或默认消息接收连接到同一进程的设备事实取得。
      en: Where dedicated tracing exists, connect subscriptions or default-message reception to device-fact acquisition by
        the same process.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 仅在专用调用与消息追踪已验证时启用。采集 CM_Register_Notification、SHChangeNotifyRegister 或 RegisterDeviceNotification 的调用者、请求类型和返回状态，维护到注销、进程结束或追踪中断的接收生命周期；也单独记录顶层窗口实际收到的
          WM_DEVICECHANGE，因为默认卷广播可能无显式注册。API 导入、注册失败和静态反汇编只作调查线索。消息 0x219 是 WM_DEVICECHANGE，不是安全日志事件号。
        en: Enable only after validating dedicated call and message tracing. Record callers, request types, and return status
          for CM_Register_Notification, SHChangeNotifyRegister, or RegisterDeviceNotification and maintain receiving lifetimes
          through deregistration, process exit, or trace interruption. Separately record actual WM_DEVICECHANGE reception
          by top-level windows because default volume broadcasts can lack explicit registration. API imports, failed registration,
          and static disassembly are investigation leads only. Message 0x219 identifies WM_DEVICECHANGE rather than a Security
          event number.
      - zh: 以 host_id、process_id、process_start 和接收上下文标识连接注册或接收、反馈类别及其后的设备属性结果。按官方结构区分接口实例路径、卷位图和无设备载荷的变更通知，不在各结构间强行转换。开始时以反馈后一百二十秒关联同进程设备查询，允许异步工作线程；只有捕获的有效返回能升级为事实取得。将长驻接收、稀疏变更处理和未批准调用来源作为组合线索，不以缺少轮询作证。
        en: Join registration or reception, feedback type, and subsequent device-property results by host_id, process_id,
          process_start, and receiving-context identity. Respect official distinctions among interface-instance paths, volume
          masks, and change notices lacking device payload rather than forcing conversion. Initially correlate same-process
          queries within 120 seconds of feedback, allowing asynchronous workers; only captured valid returns establish fact
          acquisition. Combine resident reception, sparse change handling, and unapproved provenance rather than using absent
          polling as proof.
      - zh: 已启用的 6416 可用 Computer、TimeCreated 和 DeviceId 旁证外部设备识别时间；其 DeviceId 是外设实例路径，SubjectUserSid 和系统 Execution ProcessID
          不代表订阅者。没有该事件也不能否定已有接口或默认消息接收。若专用追踪不可用，分析必须报告覆盖不足，不能静默降为“插拔后出现进程”并宣称证实本子项。
        en: Enabled 6416 can corroborate external-device recognition through Computer, TimeCreated, and DeviceId. Here DeviceId
          is a peripheral-instance path, while SubjectUserSid and the system Execution ProcessID do not identify the subscriber.
          Absence does not exclude existing interfaces or default-message reception. Without dedicated tracing, report insufficient
          coverage rather than silently substituting 'process after hotplug' and claiming this child is confirmed.
    data_requirements:
    - source_type: validated-device-notification-trace
      name:
        zh: 需部署验证的设备 API、消息及结果追踪合同
        en: Device API, message, and result trace contract requiring deployment validation
      channel: null
      required_fields:
      - host_id
      - timestamp
      - process_id
      - process_start
      - receiving_context_id
      - record_kind
      - api_name
      - return_status
      - notification_type
      - payload_type
      - device_identity
      - result_level
    observables:
    - zh: 成功接收关系或正面消息接收，随后同进程取得可解释的设备事实
      en: Successful receiving relationship or positive message reception followed by interpretable device facts from the
        same process
    - zh: 接收生命周期跨越安静阶段，并在设备变更后出现稀疏处理
      en: A receiving lifetime spans quiet periods with sparse handling after device changes
    correlation:
      window:
        zh: 状态保留到注销或进程结束，追踪中断则标为未知；初始使用反馈后一百二十秒处理窗口，并按真实异步延迟调优。
        en: Retain state through deregistration or process exit and mark trace interruption unknown; begin with 120 seconds
          after feedback and tune to actual asynchronous delays.
      dimensions:
      - host_id
      - process_id
      - process_start
      - receiving_context_id
      - device_identity
    false_positives:
    - zh: 正常 Shell、设备管理服务、会议软件、同步客户端和硬件调试程序
      en: Ordinary shells, device-management services, conferencing tools, synchronization clients, and hardware debuggers
    blind_spots:
    - zh: 默认 EDR 与 6416 不提供该追踪合同；跨进程交接、消息合并、容器或驱动路径及追踪丢失会使关联不完整。
      en: Default EDR and 6416 do not provide this trace contract; cross-process handoff, message coalescing, container or
        driver paths, and trace loss can leave incomplete correlation.
    tuning_guidance:
      paragraphs:
      - zh: 该数据源是待实现和验收的采集合同，不是某产品已提供的字段承诺。用批准测试程序分别验证成功注册、失败注册、无注册卷广播、移除、重复反馈及无返回内容，并核对 API 原生返回类型。对无设备标识的记录显式存 null 而不是伪造实例路径；批准项绑定签名、调用栈来源、设备职责和版本，保留受信进程被注入时的上下文异常。
        en: This is a collection contract to implement and accept rather than a promise that a product supplies these fields.
          Use approved test programs to validate successful and failed registration, unregistered volume broadcasts, removal,
          duplicate feedback, and absent returned content, checking native API return types. Store null explicitly where records
          have no device identity rather than fabricating a path. Bind approvals to signature, call-stack provenance, device
          role, and version while retaining anomalies from injection into trusted processes.
    evidence_keys:
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-SHELL-NOTIFICATION
    - B016-T1120-REF-WM-DEVICECHANGE
    - B016-T1120-REF-PNP-AUDIT
    - B016-T1120-REF-6416
    - REF-000583
    - B016-T1120-REF-TRELLIX-NOTIFICATION
    - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
  - key: B016-T1120-NJA-LINUX-MONITOR
    strategy_key: B016-T1120-DET-NOTIFICATION
    name:
      zh: Linux 显式设备变更监听启动核验
      en: Linux Explicit Device-Change Monitor Launch Verification
    summary:
      zh: 从执行审计识别 udevadm monitor 的监听选择，核验其主体及持续运维授权。
      en: Identify udevadm monitor listening choices from execution audit and verify principals and ongoing operational authorization.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 按同一 audit serial 重建 udevadm monitor 的 argv，解析 --kernel、--udev、--property 和 --subsystem-match，保留请求监听的事件层和范围；命令启动只证明监听尝试。核对
          auid、ses、父进程和批准硬件诊断任务，优先调查无期限的非设备管理会话监听。无需等待短窗口内重复执行才产生线索，因一个监听进程可以长期存在。
        en: Reconstruct argv for udevadm monitor by audit serial and parse --kernel, --udev, --property, and --subsystem-match,
          retaining requested event layer and scope. Launch establishes only an attempted listener. Check auid, ses, parent
          process, and approved hardware-diagnostics work, prioritizing indefinite listeners in non-device-management sessions.
          Do not require repeated execution within a short window, since one monitor can persist.
      - zh: 若有经批准取得的 monitor 输出，将 ACTION、DEVPATH、SUBSYSTEM 与事件时间保留为返回级旁证；kernel 和 udev 两层可能对应同一次变化，不按两次设备接入计数。输出来源必须关联实际监听进程，不从系统
          udev 记录推定任意进程收到反馈。没有输出保留“监听尝试、反馈未知”；原生 libudev 套接字监听超出此显式命令分析范围。
        en: Where approved collection obtains monitor output, retain ACTION, DEVPATH, SUBSYSTEM, and event time as returned-evidence
          corroboration. Kernel and udev layers may describe the same change and are not counted as two arrivals. Output provenance
          must link to the actual listener rather than inferring reception by any process from system udev records. Without
          output retain 'listening attempted, feedback unknown.' Native libudev socket listeners are outside this explicit-command
          analytic.
    data_requirements:
    - source_type: linux-execution-audit
      name:
        zh: 经配置的监听命令执行审计
        en: Configured execution audit for monitor commands
      channel: Linux audit SYSCALL/EXECVE/PROCTITLE
      required_fields:
      - node
      - audit_serial
      - timestamp
      - auid
      - ses
      - pid
      - ppid
      - exe
      - argv
      - success
    observables:
    - zh: udevadm monitor 的内核或规则后事件选择与非批准启动会话
      en: Kernel or post-rule event selection in udevadm monitor and unapproved initiating sessions
    correlation:
      window:
        zh: 同一执行事件先重建监听配置，授权状态保留到进程结束或遥测中断；启动后不要求在固定短窗口内反复查询。
        en: Reconstruct listener configuration from one execution event and retain authorization state through process exit
          or telemetry interruption; repeated queries within a short fixed window are not required.
      dimensions:
      - node
      - audit_serial
      - auid
      - ses
      - pid
      - timestamp
    false_positives:
    - zh: 设备规则开发、现场硬件诊断、自动化测试和支持采集
      en: Device-rule development, hardware diagnostics, automated testing, and support collection
    blind_spots:
    - zh: 不捕获进程内 libudev 监听；exec 记录不证明监听持续存活或实际收到事件，事件重放也不证明物理插拔。
      en: In-process libudev listeners are not captured; execution records establish neither continued lifetime nor event
        reception, and event replay does not establish physical hotplug.
    tuning_guidance:
      paragraphs:
      - zh: 为长期硬件调试建立有到期时间的主体与子系统批准项，将事件层、输出需求和终止条件写入任务。对 root、合法 udev 工具或没有重复执行的进程均不整体豁免；若组织不能取得输出，告警措辞必须停留在启动和授权异常，不能声称取得了哪种设备身份。
        en: Give long-running hardware diagnostics expiring principal and subsystem approvals specifying event layer, output
          needs, and termination conditions. Do not exempt root, legitimate udev tools, or processes without repeated execution
          wholesale. If output is unavailable, alert wording must remain at launch and authorization anomalies rather than
          naming acquired device identities.
    evidence_keys:
    - B016-T1120-REF-UDEVADM
    - B016-T1120-REF-LIBUDEV
    - REF-000840
  mitigations:
  - key: B016-T1120-MIT-PERIPHERAL-GOVERNANCE
    name:
      zh: 外围设备发现调用与反馈接收治理
      en: Peripheral-Discovery Call and Feedback-Receiver Governance
    summary:
      zh: 限制未批准设备盘点代码，并保留设备状态、查询和反馈接收者的不同证据层级。
      en: Constrain unapproved device-inventory code and retain distinct evidence levels for device state, queries, and feedback
        receivers.
    description:
      paragraphs:
      - zh: 外设身份和变更反馈是正常应用需要的信息，无法通过禁用一种工具普遍隐藏。控制着重减少不必要的代码执行、为长期接收者建立责任主体，并验证状态日志与查询证据的连接。设备安装限制可以减少可利用外设，却不等于隐藏既有设备或阻断所有只读查询，因此不作为本控制的主要承诺。
        en: Peripheral identity and change feedback are necessary to ordinary applications and cannot generally be hidden
          by disabling one utility. Controls reduce unnecessary code execution, assign responsibility for long-lived receivers,
          and validate links between state logs and query evidence. Installation restrictions can reduce usable peripherals
          but do not hide existing devices or block every read query, so they are not this control's primary promise.
    domains:
    - enterprise
    measures:
    - key: approved-device-query-execution
      name:
        zh: 批准设备查询执行
        en: Approved device-query execution
      description:
        paragraphs:
        - zh: 使用应用和脚本信任规则约束未批准的设备盘点程序，为必要支持工具绑定主体、主机角色、查询设备范围和期限。签名或系统工具路径不是无限期授权；对受信应用内注入仍需另有执行完整性控制。
          en: Use application and script trust rules to constrain unapproved device-inventory programs and bind necessary
            support tools to principal, host role, device scope, and expiry. A signature or system-tool path is not indefinite
            authorization. Injection into trusted applications still requires separate execution-integrity controls.
      control_type: exposure-reduction
    - key: receiver-lifetime-accountability
      name:
        zh: 反馈接收生命周期问责
        en: Feedback-receiver lifetime accountability
      description:
        paragraphs:
        - zh: 登记批准的长期设备监听服务、主体、设备职责和版本，保留启动、停止及授权变更；在需要进程内可见性的端点验证调用与消息采集，并在注销或遥测中断时更新状态。不将系统广播接收普遍禁止，也不以签名白名单覆盖调用来源异常。
          en: Register approved persistent device-listening services, principals, device roles, and versions and retain start,
            stop, and authorization changes. Validate call and message collection on endpoints requiring in-process visibility
            and update state on deregistration or trace interruption. Do not universally prohibit system-broadcast reception
            or let signature allowlists suppress anomalous call provenance.
      control_type: detective-support
    - key: state-and-result-evidence-validation
      name:
        zh: 状态与结果证据验证
        en: State and result evidence validation
      description:
        paragraphs:
        - zh: 开启并验证必要的 PnP 活动和进程或 Linux 执行采集，分别标记设备识别、查询尝试、反馈收到和属性返回。用已知设备的接入、移除、查询及失败测试确认归属，外部保留最小化标识和采集健康；设备序列号与位置按敏感资产数据保护。
          en: Enable and validate necessary PnP activity and process or Linux execution collection, labeling recognition,
            query attempts, feedback reception, and property returns separately. Test known-device arrival, removal, queries,
            and failures for attribution, externally retaining minimized identifiers and collector health. Protect serial
            and location data as sensitive asset information.
      control_type: detective-support
    applications:
    - target_key: B016-T1120-PARENT
      use:
        paragraphs:
        - zh: 将设备资产、会议与外设支持查询绑定批准主体和实际参数范围，收紧无需盘点能力的任意脚本入口；同时保留在场、历史和启用接口状态的区别。显式工具命令与专用调用追踪各按真实覆盖启用，避免用驱动清单或 6416 代替设备查询证据。
          en: Bind device-asset, conferencing, and peripheral-support queries to approved principals and actual argument scope,
            constraining arbitrary-script entry points without inventory needs. Preserve distinctions among present, historical,
            and enabled-interface states. Enable explicit-command and dedicated-call collection according to verified coverage
            rather than substituting driver inventories or 6416 for query evidence.
      expected_effect:
        paragraphs:
        - zh: 未批准代码更难取得设备盘点执行机会，正常管理外观更易与实际职责核验；调查能够保留查询和设备结果等级，减少将历史记录或设备存在误解为内容获取的机会。
          en: Unapproved code has fewer opportunities to execute device inventories, and ordinary management appearance becomes
            easier to verify against actual responsibilities. Investigations retain query and device-result levels, reducing
            misinterpretation of historical records or device presence as content acquisition.
      limitations:
        paragraphs:
        - zh: 这些措施不能隐藏普通调用者可读的设备元数据，合法工具和受信进程仍可被滥用。专用追踪有兼容性、隐私与事件量成本，基本进程审计缺少返回值；禁用或移除外设会影响业务而不能阻止残留历史记录查询。
          en: These measures do not hide metadata readable by ordinary callers, and legitimate tools and trusted processes
            remain abusable. Dedicated tracing has compatibility, privacy, and event-volume costs, while basic process audit
            lacks returns. Disabling or removing peripherals can affect business without preventing queries of remaining historical
            records.
    - target_key: B016-T1120-CHILD-NOTIFICATION
      use:
        paragraphs:
        - zh: 将长期设备接收者按进程来源、主体、版本及设备职责登记，保留生命周期而非只统计重复命令；在高风险端点验证默认广播与显式注册两种接收路径。对未批准监听先保存接收和设备事实证据，再按响应策略隔离或停止异常进程，不通过停用全局
            PnP 服务阻断所有通知。
          en: Register persistent receivers by process provenance, principal, version, and device role, retaining lifetimes
            rather than counting repeated commands alone. Validate both default broadcasts and explicit registration on high-risk
            endpoints. Preserve receiving and device-fact evidence before isolating or stopping unauthorized listeners under
            response policy rather than disabling global PnP services to block all notifications.
      expected_effect:
        paragraphs:
        - zh: 将稀疏处理重新连接到持续接收上下文，降低跨长驻生命周期重构的成本，并缩小未批准通知驱动发现的执行空间。安静阶段也能保留已确认的接收状态，不依赖必须再次出现枚举峰值。
          en: Sparse handling reconnects to its persistent receiving context, reducing reconstruction cost across long lifetimes
            and narrowing execution space for unauthorized notification-driven discovery. Confirmed receiving state remains
            available during quiet periods without requiring a later enumeration peak.
      limitations:
        paragraphs:
        - zh: 默认广播通常不能按任意应用单独禁止，批准监听器内部的注入和进程间转交仍会弱化归属。生命周期中断后的状态必须未知；接收成功不保证取得设备属性，更不能证明取得内容。Linux 命令覆盖与 Windows 专用追踪均需在部署环境先验收。
          en: Default broadcasts usually cannot be prohibited per arbitrary application, while injection into approved listeners
            and interprocess handoff weaken attribution. State after trace interruption must remain unknown. Successful reception
            does not guarantee device properties or content. Both Linux command coverage and Windows dedicated tracing need
            acceptance in the deployment environment.
    evidence_keys:
    - REF-000595
    - REF-000598
    - REF-000840
    - B016-T1120-REF-INSTALLED-DEVICES
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-WM-DEVICECHANGE
    - B016-T1120-REF-PNP-AUDIT
    - B016-T1120-REF-6416
    - B016-T1120-REF-LIBUDEV
