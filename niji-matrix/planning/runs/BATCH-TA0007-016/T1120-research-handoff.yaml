research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - device identity
    - connection and availability state
    - query and change-feedback implementations
    breadth_trigger: ordinary
    coverage_resolutions:
    - source_cluster: T1120 parent peripheral facts
      disposition: parent-core
      rationale: Device type, operating system, and bus vary the information object rather than an independent stealth variable.
    candidate_stealth_axes_examined:
    - axis: Feedback trigger replacing continuous snapshots
      disposition: niji-variable-candidate
      proposed_child_key: B016-T1120-CHILD-NOTIFICATION
      attacker_control: Select a persistent receiving relationship and change-triggered follow-up instead of a polling loop.
      trace_change: Repeated query requests disappear during unchanged periods; initial reception setup and sparse feedback
        handling remain.
      defender_effect: Short-window repeated-query counts miss ongoing monitoring unless reception lifetime and later fact
        acquisition are joined.
      prerequisites: A live receiving context, compatible notification semantics, and tolerance for delayed or absent device
        changes.
      evidence_keys:
      - B016-T1120-REF-TRELLIX-NOTIFICATION
      - REF-000583
      - B016-T1120-REF-CM-NOTIFICATION
      - B016-T1120-REF-WM-DEVICECHANGE
      - B016-T1120-REF-LIBUDEV
      - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
      evidence_strength: Trellix explicitly describes polling-noise avoidance; ESET independently observes feedback-driven
        fingerprinting; official contracts establish capability. Stealth motive for every listener and measured misses are
        not claimed.
      defense_difference: Retain receiving lifetimes and correlate feedback to device facts rather than requiring repeated
        inventory executions.
    - axis: Historical or cached device records instead of live state
      disposition: evidence-deferred
      rationale: Windows and udev sources establish stale state and different views, but no reviewed conclusion-level source
        supports choosing a historical view to suppress a specified trace while satisfying the same peripheral-information
        objective. Historical records cannot prove current connection.
    - axis: In-process enumeration without a separate utility
      disposition: evidence-deferred
      rationale: SetupAPI/libudev support direct enumeration, but absence of a child process is not alone a device-specific
        intentional stealth mechanism; no interface-to-telemetry comparison or evasion direction was found in the reviewed
        sources.
    - axis: Narrow device-class or instance targeting
      disposition: not-stealth-distinct
      rationale: Interface filters establish target and normal application needs; lower object counts alone do not supply
        an independent stealth purpose or trace interpretation.
    - axis: Slow polling or cross-process distribution
      disposition: evidence-deferred
      rationale: Stable time or source control is plausible, but reviewed peripheral-specific sources provide no independent
        support for this narrower design beyond notification-driven selection. Do not create a generic scanning-style child.
    - axis: Device identity impersonation and post-arrival activity
      disposition: adjacent-technique
      rationale: BadUSB input origin, driver exploitation, media propagation and content collection have independent objects
        and must not be relabeled as discovery children.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 即使固定 ATT&CK 没有子项，仍独立检查触发关系、状态来源、执行位置、目标范围、时间和真实来源轴。只建议通知驱动一个 medium 子项，依据是可控触发差异、Trellix 的明确噪声对照和独立实施合同，不按设备种类或平台拆分。主
        Agent 尚需统一边界与正式准入。
      en: Despite zero fixed ATT&CK children, the review independently examined trigger, state source, execution location,
        target scope, timing, and real-origin axes. Only one medium-confidence notification-driven child is proposed based
        on controlled trigger differences, Trellix's explicit noise contrast, and independent implementation contracts, without
        device-type or platform partitions. Primary convergence and formal admission remain pending.
  evidence_coverage:
    parent_behavior_keys:
    - REF-000625
    - REF-000583
    - B016-T1120-REF-INSTALLED-DEVICES
    - B016-T1120-REF-PNPUTIL
    boundary_keys:
    - B016-T1120-REF-INSTALLED-DEVICES
    - B016-T1120-REF-CM-NOTIFICATION
    - B016-T1120-REF-PNP-AUDIT
    - B016-T1120-REF-6416
    - B016-T1120-REF-UDEVADM
    mechanism_support:
    - mechanism_ref: NM-FD
      evidence_keys:
      - REF-000583
      - B016-T1120-REF-INSTALLED-DEVICES
      - B016-T1120-REF-PNPUTIL
      supported_level: Shared normal and malicious interface appearance; medium inference, no measured alert outcome.
    - mechanism_ref: NM-ST
      evidence_keys:
      - B016-T1120-REF-TRELLIX-NOTIFICATION
      - B016-T1120-REF-CM-NOTIFICATION
      - B016-T1120-REF-WM-DEVICECHANGE
      - B016-T1120-REF-LIBUDEV
      - B016-T1120-REF-REGISTER-DEVICE-NOTIFICATION
      supported_level: Controllable replacement of polling with change-triggered handling; conditional sparse traces; medium
        inference.
    child_existence_support:
    - child_key: B016-T1120-CHILD-NOTIFICATION
      evidence_keys:
      - B016-T1120-REF-TRELLIX-NOTIFICATION
      - REF-000583
      - B016-T1120-REF-CM-NOTIFICATION
      supported_level: Explicit noise-avoidance technical interpretation, observed sample architecture and official capability.
        Does not quantify evasion.
    unsupported_or_deferred:
    - No default sensor provides every device API return or notification subscriber.
    - No matched polling-versus-notification detection-rate experiment.
    - No Linux or macOS malicious notification-discovery case established in this review.
    - Windows call/message collection contract is implementable from documented interfaces but not deployment-validated here.
  stealth_causal_review:
    behavior_goal: Obtain identity, interface, connection or availability facts about peripherals.
    ordinary_counterfactual: Repeatedly reconstruct snapshots or issue inventory requests during residence.
    attacker_controlled_design: Maintain a feedback receiver and acquire incremental facts on device changes, with an optional
      startup snapshot.
    trace_difference: Quiet periods no longer require repeated inventory requests; reception setup, feedback processing and
      later results remain.
    defender_observation: Repeated-command or short-window API-count detection sees sparse fragments; lifetime-aware receiver-to-result
      tracing can recover the chain.
    bounded_stealth_effect: Reduced polling noise and higher cross-lifetime reconstruction cost when state changes are sparse;
      no claim of universal blindness or measured missed alerts.
    supported_level: medium
  source_identity_review:
    lookup_performed: true
    lookup_command: python3 scripts/library_lookup.py --text "peripheral device discovery"
    catalog_inspected: dist/catalogs/library-catalog.json
    existing_reference_resolutions:
    - reference_ref: REF-000484
      resolution: extend
      locator_append: GSM fingerprinting; Device monitor metadata and COM-port handling.
      note: Existing article identity is exact; preserve current screenshot and collector/uploader evidence. Consider neutral
        full-publication title rather than creating a duplicate REF.
    - reference_ref: REF-000583
      resolution: extend
      locator_append: Device monitor §4.3.1, printed pp.15–17, PDF pages 16–18; Shell registration, WM_DEVICECHANGE, device
        identity and COM fingerprinting.
      note: Existing white-paper identity is exact. Preserve current audio/screenshot/collection locators and notes. A new
        narrow device event Case is semantically different from existing recording, screenshot and Upload pipeline Cases.
    - reference_ref: REF-000625
      resolution: reuse
      locator_append: Fixed Enterprise 19.1 attack-pattern--348f1eef-964b-4eb6-bb53-69b3dcb0c643; T1120 parent only.
    candidate_checks:
    - New source URLs were compared against reference catalog canonical URLs and normalized titles. No exact canonical URL
      match was found for the eleven new candidates.
    - Trellix production, UAT and author-personal mirrors describe the same publication; use production URL as one source
      identity.
    - PnPUtil inventory REF-000826 is a different publication about driver inventory; it does not duplicate the command-syntax
      publication.
    - MIT-000190 is driver-state and debug-privilege governance; MIT-000241 is capacity/inventory execution and ESXi governance;
      MIT-000087 governs input-origin injection. Proposed receiver-lifetime governance changes the control purpose and measures,
      so create rather than append misleading generic applications.
    - Existing Attor Cases CASE-000197, CASE-000217 and CASE-000271 concern audio, target-window capture and Upload handoff
      respectively. None is the same device-discovery event; propose a separate narrow Case.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 定义拆开设备事实与接口成功；匿迹分析涵盖外观、变化和残余；范围提供驱动、存储、记录和采集边界；攻防模型说明状态与主体归属限制；父子均有直接防御和独立限制。段落按论证需要分开，没有按另一个候选模板替名；正式审查及工具验收仍由主
        Agent 完成。
      en: Definition separates device facts from interface success; stealth analysis covers appearance, changes, and residues;
        scope addresses driver, storage, recording, and collection boundaries; models state state and attribution limits.
        Parent and child both have direct defenses and independent limitations. Paragraphs follow argument needs without renaming
        another candidate's template. Formal review and tool acceptance remain with the primary agent.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - read-only catalog search
    - YAML parse and bilingual shape verification
  limitations:
    paragraphs:
    - zh: 本交接是研究建议，未分配正式 ID，也未改动矩阵、计划或共享库。官方来源和两份一手逆向支持父行为与一个 medium 匿迹变量；专用 Windows 追踪、部署基线与同配置检测实验尚未完成，不能把可实施检测设计当作已运行效果。主
        Agent 应独立核验来源身份、API 细节和跨对象归属后再决定正式纳入。
      en: This handoff is research only, with no canonical IDs or changes to the matrix, plan, or libraries. Official sources
        and two firsthand analyses support the parent and one medium-confidence stealth variable. Dedicated Windows tracing,
        deployment baselines, and matched detection experiments remain undone; implementable analytic design is not an operating
        result. The primary agent should independently verify identities, API details, and cross-object ownership before admission.
  rejected_mechanisms:
  - mechanism_ref: NM-BT
    rationale: Missing default device-query telemetry alone is a defensive coverage condition, not sufficient evidence of
      an attacker-selected bypass. No extra BT mapping is proposed.
  - mechanism_ref: NM-DO
    rationale: Sparse notifications and historical state do not alter content into an opaque form; no encoding or obscuration
      mechanism is established.
  open_questions:
  - Verify the prospective deployment collector can correlate default window broadcasts separately from successful API registrations
    and returned device attributes.
  - Determine approved receiver and device-query baselines for each asset role without treating all signed callers as trusted.
integration:
  status: pending
  resolutions: []
