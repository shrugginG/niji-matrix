  research:
    limitations:
      paragraphs:
      - zh: 现场报告公开了工具使用和调查背景，未公开逐查询路径、返回值或检测对照；InvisiMole 命令表只证明逆向确认的能力。进程内子项依赖明确的开发者合同和 Registry 查询能力，保持中等置信度，不等同于现场采用率或实测匿迹效果。判断个案时仍须证明该读取用于环境知识，并排除读取自身载荷配置、合法初始化和相邻的信息对象。
        en: Field reporting provides utility use and investigative context without per-query paths, returned values, or detection
          comparisons. InvisiMole's command table establishes a reverse-engineered capability. The in-process child relies
          on an explicit developer contract and Registry-query capability, with medium confidence rather than an asserted
          field prevalence or measured evasion effect. A case still requires proof of environmental purpose and exclusion
          of payload-configuration consumption, legitimate initialization, and adjacent information objects.
      - zh: 查询视图、权限、虚拟化与副本时点会改变结果；4663 不保存返回内容，4656 不证明实际使用权限。本文的防御是可实施设计，尚未在本研究工作区对 Windows 版本、SACL 与专用跟踪进行实测。缺失事件只能形成覆盖不明，不能作为攻击未发生或已隐身的证明；任何上线阈值和保留窗口仍需本地验证。
        en: Query view, rights, virtualization, and snapshot time can change results. Event 4663 does not preserve returned
          content, and 4656 does not establish exercised rights. The defenses are implementable designs without Windows-version,
          SACL, or dedicated-tracing experiments in this research workspace. Missing events leave coverage uncertain rather
          than proving absence or successful concealment. Deployment thresholds and retention windows require local validation.
proposed_subtechniques:
- key: B016-T1012-CHILD-INPROCESS
  parent_key: B016-T1012-PARENT
  lineage:
    attck_subtechnique_inherited: false
  name:
    zh: 进程内注册表查询
    en: In-Process Registry Query
  summary:
    zh: 有意在既有受控进程中完成环境性 Registry 读取，省去每次任务的新查询进程及其命令行，同时保留可由读取原语审计恢复的痕迹。
    en: Deliberately read environmental Registry information inside an existing controlled process, removing a new query process
      and its command line for each task while retaining traces recoverable through read-primitive observation.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 进程内注册表查询是攻击者将环境性键、值或子键调查直接交给既有驻留上下文中的代码执行，而不为每次查询另启命令工具或解释器的匿迹方式。其变量是任务执行是否产生新的查询进程，不是 API 名称。官方 Registry 查询 BOF
        是一种已记录实现，但同一边界也适用于其他能在既有进程内完成读取并回传结果的模块。
      en: In-Process Registry Query assigns environmental key, value, or subkey investigation directly to code in an existing
        resident context instead of launching a utility or interpreter for each query. Its variable is whether task execution
        produces a new query process rather than the API name. The officially documented Registry-query BOF is one implementation;
        the boundary also covers other modules that complete reads and return results inside an existing process.
    - zh: 承载进程如何最初获得控制可以属于执行或注入技术，不能代替此处的读取证据。成立判断需要把具体 Registry 查询关联到该既有进程实例，并证明采用了直接读取路径而非该进程只启动了 reg.exe。没有新进程事件只是一个待核实的观察，单独不足以证明进程内查询；所有正常程序的配置读取也不自动属于该子项。
      en: How control of the carrier was first obtained may belong to execution or injection and cannot substitute for read
        evidence here. Classification requires associating a concrete Registry query with that existing process instance and
        establishing direct reading rather than merely launching reg.exe from it. Missing new-process events alone are an
        observation to investigate, not proof of in-process querying. Ordinary application configuration reads do not automatically
        belong to this child.
  stealth_characteristics:
    paragraphs:
    - zh: 进程内注册表查询把每次查询的参数和结果留在已有进程执行与回报路径中，不再为同一任务增加易匹配的 reg.exe 或解释器命令行。依赖新查询执行器、父子关系或工具命令正则的检测因而可能没有直接触发事件。Fortra 明确说明
        BOF 的进程内执行与较轻足迹，并把 Registry 查询归为此类能力；据此可以支持痕迹差的中等置信度推断，不需要把所有 BOF 都假定成已发生的恶意活动。
      en: In-Process Registry Query keeps task parameters and results within an existing process's execution and reporting
        path, adding no readily matched reg.exe or interpreter command line for the same task. Detection dependent on a new
        query executor, its ancestry, or utility-command expressions can therefore lack its direct trigger. Fortra explicitly
        documents in-process BOF execution and its lighter footprint and classifies Registry querying as that capability.
        This supports a medium-confidence trace-difference inference without treating every BOF as an observed malicious action.
    - zh: 该实现不消除键对象操作。正确部署的读取 SACL、按操作跟踪及进程实例关联仍能记录谁在读取哪些分支，专用调用栈还可能暴露异常模块。过程内代码仍受目标键访问权限制，也可能导致内存和网络痕迹；若防守方已有充分读取覆盖，减少命令进程并不能使读取不可见。
      en: This implementation does not remove key-object operations. Properly deployed read SACLs, operation tracing, and
        process-instance correlation can still record who reads which branches, and dedicated stacks may expose an unusual
        module. Code remains constrained by target-key rights and can leave memory and network traces. Where a defender already
        has sufficient read coverage, removing command processes does not make the read invisible.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有意使用既有受控进程中的直接读取模块调查 Registry 环境信息，并省去每任务新查询执行器的实现。BOF、DLL 或其他内联代码只是实现方式，不能分别拆项；32/64 位标志只确定读取视图。同样的受控进程如果启动工具完成读取，其动作保留在父级；仅在新进程中运行自写查询程序，也不满足既有驻留上下文的边界。
      en: Include deliberate use of a direct-reading module inside an existing controlled process to investigate environmental
        Registry information while omitting a new query executor per task. BOFs, DLLs, and other inline code are implementations
        rather than separate children; 32-bit or 64-bit flags only select the view. A controlled process that launches a utility
        to perform the read stays at the parent. A custom query executable launched in a new process also falls outside the
        existing-resident-context boundary.
    - zh: 单纯 COFF 装载或共享模块执行（NJT-0077）、跨进程执行上下文嵌入（NJT-0103）、非标准调用过渡与 syscall 规避（NJT-0073）、内存隐藏或脚本审计绕过都不是本子项的直接行为。它们只有与具体环境性
        Registry 读取建立谱系后才提供实施上下文。读取恶意模块自身配置、写入持久状态或提取 secret 仍按各自目的分类；合法进程内部读取、日志停采、PID 重用和进程创建保留期不足都构成正常或测量反例。
      en: COFF loading or shared-module execution (NJT-0077), cross-process execution-context embedding (NJT-0103), nonstandard
        call transitions or syscall evasion (NJT-0073), memory concealment, and script-audit bypass are not this child’s direct
        behavior. They provide implementation context only when linked to a concrete environmental Registry read. Reading
        a malicious module’s own configuration, writing durable state, or extracting secrets retains its purpose-based classification.
        Legitimate internal reads, collection outages, PID reuse, and inadequate process-event retention are counterexamples
        from normal operation or measurement.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 该子项适用于已经拥有驻留执行上下文、希望按需调查配置而减少反复启动工具的操作者。预先知道分支时可定向查询，尚不知道结构时也可枚举子键或值；两者共享省去查询执行器的变量。原生工具足迹成为防守重点时，该实现可以把防守需求转向读取原语与承载进程归属，但不保证查询返回数据，也不提供新的权限。
        en: The child fits an operator who already has a resident execution context and wants on-demand configuration investigation
          with fewer repeated utility launches. A known branch can be queried directly, while an unknown structure can be
          explored through subkey or value enumeration. Both share omission of a query executor. Where utility footprints
          are a defensive focus, this shifts observation toward read primitives and carrier attribution without guaranteeing
          returned data or granting additional rights.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须控制已有进程的任务执行，并有能够在其中完成读取、处理长度或错误并回传结果的实现。其令牌仍须满足目标键查询或枚举权限，远程访问还须满足身份和服务条件。本文不假定调用 API 就天然无进程：只有选定路径本身不启动新查询执行器，才形成子项中的痕迹差。
          en: The adversary must control task execution in an existing process and have an implementation that reads, handles
            lengths or errors, and returns results there. Its token still needs target-key query or enumeration rights, with
            identity and service conditions for remote access. Calling an API is not assumed to be process-free. The child's
            trace difference exists only when the selected path itself omits a new query executor.
        - zh: 本次核查的 Fortra 文档页脚为 Cobalt Strike 4.13、202609280255、2026 年 9 月。该 BOF 合同预期单线程、短时任务，长运行会阻塞其他 Beacon 功能，代码崩溃可能丢失承载进程及访问；因此此实现适合有界查询，而不是无代价长期监听。current
            路径会变化，本证据不推广到所有历史版本，也不把所有 BOF 的执行副作用都视为本子项。
          en: The verified Fortra pages carry Cobalt Strike 4.13, build 202609280255, September 2026. This BOF contract expects
            single-threaded short tasks; long execution blocks other Beacon functions, and a crash can lose the carrier and
            access. The implementation therefore fits bounded queries rather than cost-free long-running monitoring. The current
            URL can change, so this evidence does not generalize to every historical version or make every BOF execution effect
            part of this child.
      defender_model:
        paragraphs:
        - zh: 防守方可观察承载进程寿命、账户和部分代码来源，但单有其创建事件不足以恢复后续任务。目标化 Security 4663 和额外部署的 Registry 操作跟踪可以把访问关联到真实进程，而不是根据 provider、父进程或工具缺失猜测。需要保留进程实例起点和采集健康状态；无法确认完整事件覆盖时，对“无新执行器”的判断必须降为未知。
          en: A defender may observe carrier lifetime, identity, and some code provenance, while its creation event alone
            cannot recover later tasks. Targeted Security 4663 and additionally deployed Registry-operation tracing can associate
            access with the true process rather than infer it from a provider, parent, or absent utility. Process-instance
            start and collection health must be retained. Without verified event completeness, absence of a new executor remains
            unknown.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 以驻留进程的直接读取替代每任务命令执行器，削弱基于新进程的查询观察
      en: Replace a command executor per task with direct reads in a resident process and weaken new-process-based query observation
    analysis:
      paragraphs:
      - zh: 有意选择进程内 Registry 查询会保留键读取，却去掉同任务新查询进程及其命令参数，导致只消费进程创建的规则缺乏目标事件。官方命令类型与 BOF 执行合同共同证明这条能力链，读取权限和审计文档则说明痕迹仍可在原语层恢复。对此机理映射保持中等置信度：它支持明确观察模型下的因果推断，没有测量现场检测率，也没有声称普通读取审计能识别
          BOF 本身。
        en: 'Deliberately selecting in-process Registry querying preserves the key read while removing a new query process
          and its parameters for that task, depriving process-creation-only rules of their target event. The official command
          type and BOF execution contract establish this capability chain. Rights and auditing documentation show that traces
          remain recoverable at the primitive. The mapping is medium confidence: it supports causality under a specified observation
          model without measuring field detection rates or asserting that ordinary read auditing identifies a BOF itself.'
    evidence_keys:
    - B016-T1057-REF-BOF
    - B016-T1012-REF-COMMANDS
    - B016-T1012-REF-CSREG
    - B016-T1012-REF-RIGHTS
    - REF-000379
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B016-T1012-DET-INPROCESS
    mitigations:
      coverage: available
      mitigation_keys:
      - B016-T1012-MIT-READ-GOVERNANCE
  evidence:
    claim_keys:
    - B016-T1012-CLM-INPROCESS
    - B016-T1012-CLM-AUDIT
    - B016-T1012-CLM-QUERY-RESULT
    case_keys: []
    reference_keys:
    - B016-T1057-REF-BOF
    - B016-T1012-REF-COMMANDS
    - B016-T1012-REF-CSREG
    - B016-T1012-REF-RIGHTS
    - B016-T1012-REF-VALUE
    - B016-T1012-REF-ENUM
    - B016-T1012-REF-AUDIT
    - REF-000379
    - B016-T1012-REF-PROCMON
    - B016-T1012-REF-REMOTE
  research:
    limitations:
      paragraphs:
      - zh: 此次没有取得同时公开具体 Registry 任务、同一驻留进程原语和完整进程事件对照的恶意现场案例，所以子项不引用父级的 Volt Typhoon 案例。官方能力合同足以证明可选择的稳定变量与相应痕迹差，不能证明现场使用比例或对某款传感器的绕过效果。合法插件也能产生同进程读取，部署时必须保留目的、对象和代码来源的判断。
        en: This research found no malicious field case publishing a specific Registry task, its primitive in the same resident
          process, and a complete process-event comparison. The child therefore does not inherit the parent's Volt Typhoon
          case. The official capability contract establishes a selectable stable variable and corresponding trace difference
          rather than field prevalence or bypass of a particular sensor. Legitimate plugins can also read within one process,
          requiring evaluation of purpose, object, and code provenance.
defense_candidates:
  detection_strategies:
  - key: B016-T1012-DET-QUERY
    resolution: create
    name:
      zh: Registry 查询意图与读取权限使用关联
      en: Registry Query Intent and Exercised-Read Correlation
    summary:
      zh: 识别异常环境性 Registry 查询，并区分命令意图、句柄请求与实际使用的读取权限。
      en: Identify unusual environmental Registry queries while separating command intent, handle requests, and exercised
        read rights.
    description:
      paragraphs:
      - zh: 本策略分别观察命令执行与键对象访问。命令分析用于发现 reg query 和明确读取脚本的意图，权限使用分析在已验证的审核覆盖内确认 QueryValue 或 EnumerateSubKeys 权利被使用。两者按进程实例与账户关联，查询结果未知时不填补输出，也不把查询软件、策略或
          secret 的目的混为一般配置探索。
        en: This strategy observes command execution separately from key-object access. Command analysis finds intent in reg
          query and explicit read scripts, while exercised-right analysis confirms QueryValue or EnumerateSubKeys rights within
          validated audit coverage. Correlation uses process instance and identity without filling missing output or confusing
          software, policy, or secret-related purposes with general configuration exploration.
    detects_keys:
    - B016-T1012-PARENT
    domains:
    - enterprise
    analytic_keys:
    - B016-T1012-NJA-COMMAND
    - B016-T1012-NJA-ACCESS
    evidence_keys:
    - B016-T1012-REF-REGQUERY
    - B016-T1012-REF-AUDIT
    - B016-T1012-REF-RIGHTS
    - REF-000379
    - REF-000334
    - REF-000623
    - REF-000230
  - key: B016-T1012-DET-INPROCESS
    resolution: create
    name:
      zh: 驻留进程 Registry 读取与任务上下文关联
      en: Resident-Process Registry Reads and Task-Context Correlation
    summary:
      zh: 通过读取原语与真实进程实例识别异常调查，使检测覆盖不依赖新查询执行器。
      en: Identify unusual investigation through read primitives and true process instances so coverage does not depend on
        a new query executor.
    description:
      paragraphs:
      - zh: 本策略直接观察承载进程的 Registry 读取，关联已知寿命、对象范围、批准任务和可用代码来源。经验证的访问审计提供权限使用层，专用跟踪提供操作和结果层；有调用栈时再辅助定位读取模块。输出明确区分异常进程内读取、具体查询结果和
          BOF 或注入归因，不以缺少 reg.exe 作为恶意结论。
        en: This strategy directly observes Registry reads by the carrier and correlates known lifetime, object scope, approved
          work, and available code provenance. Validated access auditing supplies a rights-used layer and dedicated tracing
          supplies operation and result layers, with stacks assisting module attribution when available. Findings distinguish
          anomalous in-process reads, specific query results, and BOF or injection attribution. Missing reg.exe is not a maliciousness
          criterion by itself.
    detects_keys:
    - B016-T1012-PARENT
    - B016-T1012-CHILD-INPROCESS
    domains:
    - enterprise
    analytic_keys:
    - B016-T1012-NJA-INPROCESS
    evidence_keys:
    - B016-T1057-REF-BOF
    - B016-T1012-REF-COMMANDS
    - B016-T1012-REF-RIGHTS
    - B016-T1012-REF-AUDIT
    - REF-000379
    - B016-T1012-REF-PROCMON
    - REF-000334
  detection_analytics:
  - key: B016-T1012-NJA-COMMAND
    resolution: create
    strategy_key: B016-T1012-DET-QUERY
    name:
      zh: 环境性 Registry 查询命令与批准任务差异
      en: Environmental Registry Query Commands Versus Approved Work
    summary:
      zh: 从完整命令行识别一般配置探索意图，并输出带主体和执行上下文的待核实查询。
      en: Identify general configuration-exploration intent from complete command lines and output queries to verify with
        principal and execution context.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 采集启用命令行的 4688 或经过等价字段验证的 Sysmon Event 1，对 image 与参数分别解析；匹配 reg 的 query 动作以及实际可解析的 Registry 读取脚本时，保留目标机器、根键、路径、值参数、递归范围和显式视图标志。按用户、父进程实例、主机角色和批准任务比较，对未知来源查询多个非相关分支、交互式新账户执行异常探索或未批准输出重定向给出复核记录。解析结果以分析派生标签保存，不能伪称原生日志字段。
        en: Collect 4688 with command lines enabled or Sysmon Event 1 after validating equivalent fields, parsing image and
          arguments separately. For reg query or a genuinely parsed Registry-read script, preserve target machine, root, path,
          value arguments, recursive scope, and explicit view flags. Compare user, parent instance, host role, and approved
          work. Queue unknown callers exploring unrelated branches, unusual exploration by a newly active interactive account,
          or unapproved output redirection for review. Parser outputs are derived labels rather than native log fields.
      - zh: 先按直接信息目的路由软件、策略、身份、存储和 secret 查询，再判断剩余一般配置探索；保留原始命令以便复核误路由。命令执行只标为 query-intent，即使进程退出码可用，也不由此推断返回值。与 键读取权限分析
          的同主机、同 PID 及进程生存期访问关联时可增加 rights-used 层；无读取审计时保留未证实状态，不能以 Sysmon 写入事件代填。
        en: Route software, policy, identity, storage, and secret queries by direct purpose before evaluating remaining general
          configuration exploration, retaining the original command for routing review. Execution is labeled query-intent.
          Even an available exit code does not establish returned values. A join to the key-read-rights analytic by host,
          PID, and process lifetime can add rights-used evidence. Without read auditing, preserve the unconfirmed state rather
          than substitute Sysmon mutation events.
    data_requirements:
    - source_type: windows-process-creation
      name:
        zh: 已启用命令行的进程创建记录
        en: Process creation with command-line capture enabled
      channel: Security 4688 or validated Sysmon Event 1
      required_fields:
      - timestamp
      - host_id
      - user_sid
      - process_id
      - process_image
      - parent_process_id
      - command_line
    - source_type: approved-registry-query-tasks
      name:
        zh: 组织维护的 Registry 查询任务与角色基线
        en: Organization-maintained Registry query-task and role baseline
      channel: null
      required_fields:
      - host_id
      - host_role
      - user_sid
      - process_image
      - approved_registry_scope
      - task_owner
      - valid_from
      - valid_until
    field_mapping:
      zh: timestamp/host_id 对应事件 TimeCreated/Computer；4688 的 user_sid、process_id、process_image、parent_process_id、command_line
        分别来自 SubjectUserSid、NewProcessId、NewProcessName、ProcessId 和 CommandLine。PID 统一十六进制或十进制并保留创建时间；Sysmon 使用 User、ProcessId、Image、ParentProcessId、CommandLine，SID
        无原始字段时需通过已验证身份解析补充且标明派生。基线是组织维护的数据，不是 Windows 默认字段。若无法获得 SID，可统一改用经验证的 user_id，不能捏造 SID。 registry_scope 为从保留原始命令解析的根、路径和范围组合，time
        对应统一后的 timestamp。 此处4688的user_sid表示创建主体，不默认等于新进程有效令牌；版本2有不同TargetUserSid时另保留目标身份，未确认同令牌时不能与4663实际读取者直接等同。
      en: timestamp and host_id map to TimeCreated and Computer. For 4688, user_sid, process_id, process_image, parent_process_id,
        and command_line map to SubjectUserSid, NewProcessId, NewProcessName, ProcessId, and CommandLine. Normalize hexadecimal
        or decimal PIDs and retain creation time. Sysmon supplies User, ProcessId, Image, ParentProcessId, and CommandLine;
        SID requires validated identity resolution with derived provenance when absent natively. The baseline is organization-maintained,
        not a Windows default field. If SID is unavailable, consistently use a verified user_id rather than inventing one.
        registry_scope is derived from root, path, and scope parsed from retained commands; time maps to normalized timestamp.
        Here 4688 user_sid denotes the creator rather than automatically the new process’s effective token. Preserve a distinct
        TargetUserSid when version 2 supplies one, and do not equate the creator to the actual 4663 reader without same-token
        evidence.
    observables:
    - zh: 未批准来源执行 Registry query 参数或明确的读取脚本
      en: An unapproved caller executes Registry query arguments or an explicit read script
    - zh: 同一谱系探索多个非相关配置分支或重定向查询输出
      en: One lineage explores unrelated configuration branches or redirects query output
    correlation:
      window:
        zh: 同一进程及父子谱系 15 分钟，结合最近 14 日同角色批准任务；这是待本地验证的初始工程窗口。
        en: Fifteen minutes per process and ancestry with the preceding fourteen days of approved same-role work; these are
          initial engineering windows requiring local validation.
      dimensions:
      - host_id
      - user_sid
      - process_id
      - parent_process_id
      - registry_scope
      - time
    false_positives:
    - zh: 故障排查、软件安装、资产盘点和取证可能执行递归读取并重定向输出。
      en: Troubleshooting, installation, asset inventory, and forensics can recursively read and redirect output.
    blind_spots:
    - zh: 缺少命令行、混淆脚本、未覆盖解释器和进程内直接读取不会被该分析完整恢复。
      en: Missing command lines, obfuscated scripts, uncovered interpreters, and direct in-process reads are not fully recovered
        by this analytic.
    - zh: 命令可携带意图却不成功返回数据；目标视图或权限也可能与推测不同。
      en: A command can express intent without returning data, and its target view or authority can differ from assumptions.
    tuning_guidance:
      paragraphs:
      - zh: 按任务 owner、账户、父进程、分支和时间绑定例外，不按 Microsoft 签名或 reg.exe 名称永久放行。逐步完善参数解析和目的路由，保留未知视图与未知结果，不用全 Registry 递归白名单消除异常。PowerShell
          4104 或 DeviceProcessEvents 仅在实际部署并验证相应字段后作为补充，不能要求它们提供 Registry 返回值。
        en: Bind exceptions to task owner, account, parent, branch, and time rather than permanently allowing a Microsoft
          signature or reg.exe name. Improve argument parsing and purpose routing while retaining unknown view and result
          states. Do not suppress anomalies through whole-Registry recursion allowances. Use PowerShell 4104 or DeviceProcessEvents
          only as deployed, field-validated supplements without requiring Registry-return data from them.
      - zh: timestamp/host_id 对应事件 TimeCreated/Computer；4688 的 user_sid、process_id、process_image、parent_process_id、command_line
          分别来自 SubjectUserSid、NewProcessId、NewProcessName、ProcessId 和 CommandLine。PID 统一十六进制或十进制并保留创建时间；Sysmon 使用 User、ProcessId、Image、ParentProcessId、CommandLine，SID
          无原始字段时需通过已验证身份解析补充且标明派生。基线是组织维护的数据，不是 Windows 默认字段。若无法获得 SID，可统一改用经验证的 user_id，不能捏造 SID。 registry_scope 为从保留原始命令解析的根、路径和范围组合，time
          对应统一后的 timestamp。 此处4688的user_sid表示创建主体，不默认等于新进程有效令牌；版本2有不同TargetUserSid时另保留目标身份，未确认同令牌时不能与4663实际读取者直接等同。
        en: timestamp and host_id map to TimeCreated and Computer. For 4688, user_sid, process_id, process_image, parent_process_id,
          and command_line map to SubjectUserSid, NewProcessId, NewProcessName, ProcessId, and CommandLine. Normalize hexadecimal
          or decimal PIDs and retain creation time. Sysmon supplies User, ProcessId, Image, ParentProcessId, and CommandLine;
          SID requires validated identity resolution with derived provenance when absent natively. The baseline is organization-maintained,
          not a Windows default field. If SID is unavailable, consistently use a verified user_id rather than inventing one.
          registry_scope is derived from root, path, and scope parsed from retained commands; time maps to normalized timestamp.
          Here 4688 user_sid denotes the creator rather than automatically the new process’s effective token. Preserve a distinct
          TargetUserSid when version 2 supplies one, and do not equate the creator to the actual 4663 reader without same-token
          evidence.
    evidence_keys:
