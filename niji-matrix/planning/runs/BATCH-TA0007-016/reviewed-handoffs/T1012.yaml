research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - general-key-and-value-exploration
    - environmental-configuration-reading
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: fixed-parent-core
      resolution: parent-core
      notes:
        zh: 固定清单没有 ATT&CK 子项；父行为保留一般 Registry 调查，专门信息目的分流。
        en: The fixed inventory has no ATT&CK children; retain general Registry investigation at the parent and route specialized
          information purposes separately.
    candidate_stealth_axes_examined:
    - axis: per-task-executor-omission
      resolution: niji-variable-candidate
      proposed_child_key: B016-T1012-CHILD-INPROCESS
      intentional_control: true
      trace_change:
        zh: 已有进程直接读取替代每任务新查询执行器，减少新进程和命令行痕迹。
        en: Direct reads in an existing process replace a new executor per task and reduce new-process and command-line traces.
      defender_effect:
        zh: 仅进程创建规则失去触发对象；读取原语审计和trace仍可恢复操作。
        en: Process-creation-only rules lose their trigger while primitive-level auditing and traces can recover the operation.
      evidence_keys:
      - B016-T1057-REF-BOF
      - B016-T1012-REF-COMMANDS
      - B016-T1012-REF-CSREG
      - REF-000379
      confidence: medium
      counterexample:
        zh: 普通 API 使用或缺失进程日志不足；必须证明直接读取及明确省去执行器的设计。单纯注入与COFF装载不证明本行为。
        en: Ordinary API use or missing process logs is insufficient; establish a direct read and explicit executor-omission
          design. Injection and COFF loading alone do not establish this behavior.
    - axis: native-utility-management-appearance
      resolution: parent-core
      evidence_keys:
      - REF-000025
      - REF-000073
      - B016-T1012-REF-REGQUERY
      notes:
        zh: 原生查询与管理相似支持父级 NM-FD，但工具名称和单条正常外观不能提供第二个稳定兄弟边界。
        en: Similarity to administration supports parent NM-FD, but a utility name or one ordinary-looking command does not
          supply a second stable sibling boundary.
    - axis: low-rate-targeted-versus-recursive-queries
      resolution: evidence-deferred
      evidence_keys:
      - B016-T1012-REF-REGQUERY
      - B016-T1012-REF-CSREG
      notes:
        zh: /v 与 /s 证明可控范围，不独立证明有意时间稀释或检测阈值规避；定向读取也可能只是已知所需值，不能把少量读取直接称NM-ST。
        en: /v and /s establish controllable scope rather than deliberate temporal dilution or threshold evasion. A targeted
          read can simply request a known value, so low volume alone cannot establish NM-ST.
    - axis: wow64-view-selection
      resolution: not-stealth-distinct
      evidence_keys:
      - B016-T1012-REF-VIEWS
      - B016-T1012-REF-CSREG
      notes:
        zh: 明确视图选择能力成立，但只决定读取身份；未证明攻击者用它改变防守观察，且共享键没有相同差异。位数本身不拆项。
        en: Explicit view selection is real but selects object identity; evidence does not show an attacker using it to change
          defender observation, and shared keys lack the same distinction. Architecture itself does not define a child.
    - axis: compatibility-virtualization
      resolution: not-stealth-distinct
      evidence_keys:
      - B016-T1012-REF-VIRTUALIZATION
      notes:
        zh: 兼容性合并视图有32位交互、manifest和路径条件；不适用于服务和许多关键路径。没有读取方主动控制的匿迹合同，不能把自然虚拟化归成子项。
        en: The compatibility merged view has 32-bit interactive, manifest, and path conditions and excludes services and
          many key paths. Without an attacker-controlled evasive read design, natural virtualization is not a child.
    - axis: remote-query-displacement
      resolution: not-stealth-distinct
      evidence_keys:
      - B016-T1012-REF-REMOTE
      - B016-T1012-REF-REGQUERY
      notes:
        zh: 远程位置改变权限、服务及归属要求，可能增加网络和会话痕迹；接口不同不自动减少可观察性。未建立相对同任务本地查询的有意观察差。
        en: Remote location changes authority, service, and attribution requirements and can add network and session traces.
          A different interface does not automatically reduce observation, and no deliberate differential versus the same
          local task was established.
    - axis: offline-copy-query-plane
      resolution: evidence-deferred
      evidence_keys:
      - B016-T1012-REF-OFFLINE
      notes:
        zh: 官方能力支持可读副本按文件权限解析和不同的控制面，但没有证明环境性调查主动选择副本以替代活动键读取的专属设计。凭据hive案例的直接目的又属邻项；本次保留能力与防御限制，未把缺现场案例本身当作拒绝标准。
        en: Official capability supports file-authorized parsing on a different control plane, but no dedicated design establishes
          deliberate copy selection for environmental investigation instead of active-key reads. Credential-hive cases have
          an adjacent direct purpose. Retain the capability and defensive limitation without making absent field cases the
          rejection criterion.
    - axis: encoded-query-and-direct-syscall
      resolution: adjacent-technique
      evidence_keys:
      - B016-T1012-REF-VALUE
      - B016-T1012-REF-ENUM
      notes:
        zh: 名称编码、通用脚本混淆和hook规避属于信息遮蔽或执行层候选；仅看到native API名称不能证明读取路径绕过传感器，也没有 Registry 专属兄弟边界证据。
        en: Name encoding, generic script obfuscation, and hook evasion belong to information-obscuration or execution-layer
          candidates. A native API name alone does not prove sensor bypass, and no Registry-specific sibling boundary was
          established.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零 ATT&CK 子项没有终止搜索。本次完成父级覆盖与第二轮主动变量搜索，八轴分别检查主动控制、痕迹差、反例和防御区别。只有省去每任务执行器具有 Registry 专属能力合同与明确观察差，建议 medium 子项；其他轴不是由数量、现场
        Case 缺失或默认日志空缺拒绝，而是依各自缺少的设计或观察差条件收敛。主 Agent 仍须与 T1057 的相同执行变量做直接信息对象与防御语义对照。
      en: Zero ATT&CK children did not terminate inquiry. Parent coverage and a second active-variable search examined eight
        axes for control, trace change, counterexamples, and defense differences. Only executor omission has a Registry-specific
        capability contract and explicit observation differential, supporting a medium-confidence child. Other axes converge
        on their missing design or observation conditions rather than counts, absent field cases, or missing default logs.
        Primary review must still compare the same execution variable in T1057 by direct information object and defensive
        semantics.
