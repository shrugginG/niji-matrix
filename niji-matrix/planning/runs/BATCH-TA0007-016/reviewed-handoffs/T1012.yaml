  - key: B016-T1012-NJA-ACCESS
    resolution: create
    strategy_key: B016-T1012-DET-QUERY
    name:
      zh: 已审计键读取权限与进程实例差异
      en: Audited Key Read Rights and Process-Instance Differences
    summary:
      zh: 在经验证的覆盖范围中识别键查询或枚举权限被使用，并保留其不等于返回内容的证据层级。
      en: Identify exercised key-query or enumeration rights within validated coverage while preserving their distinction
        from returned content.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 先在目标 Windows 构建与具体键上配置 Audit Registry 和匹配 QueryValue、EnumerateSubKeys 的成功 SACL，分别运行取值及子键枚举验证实际事件，再登记覆盖分支、主体、权限和有效期。生产分析只处理
          EventID 4663 且 ObjectType 为 Key 的记录，按 AccessMask 位判断 0x1 或 0x8 被使用；不能套用文件对象的 ReadData 或 ReadEA 文字，也不依赖本地化 AccessList
          文本。4656 可辅助定位请求，不能提升为已使用权限。
        en: First configure Audit Registry and success SACLs matching QueryValue and EnumerateSubKeys on concrete keys and
          Windows builds, validate actual events with separate value and subkey tests, and register covered branches, principals,
          rights, and validity. In production process only EventID 4663 with ObjectType Key, testing AccessMask bits 0x1 or
          0x8. Do not apply file-object ReadData or ReadEA labels or depend on localized AccessList text. Event 4656 can locate
          requests but cannot establish exercised rights.
      - zh: 将访问按主机、PID、进程创建区间与用户登录会话关联到读取者，并与允许读取该分支的任务清单比较。对非预期读取者或跨不相关分支的环境探索输出 rights-used 异常，不由 AccessMask 推断具体 API、值名称或返回数据。正常读取密集的分支按角色调优；没有事件时先检查覆盖表与采集健康，不能判定未发生读取或成功匿迹。
        en: Associate accesses with the reader by host, PID, process-creation interval, and logon identity, comparing approved
          tasks for each branch. Report rights-used anomalies for unexpected readers or environmental exploration across unrelated
          branches without inferring a specific API, value name, or returned data from AccessMask. Tune busy branches by role.
          Missing events first require coverage and collection-health review rather than a conclusion of no read or successful
          evasion.
    data_requirements:
    - source_type: windows-registry-access-audit
      name:
        zh: 经匹配审核策略与 SACL 验证的键访问事件
        en: Key-access events validated against matching audit policy and SACL
      channel: Microsoft-Windows-Security-Auditing / Security Event 4663
      required_fields:
      - timestamp
      - host_id
      - event_id
      - user_sid
      - logon_id
      - process_id
      - process_image
      - object_type
      - registry_path
      - access_mask
    - source_type: windows-process-creation
      name:
        zh: 用于消除 PID 重用的进程创建记录
        en: Process-creation records for PID-reuse disambiguation
      channel: Security 4688
      required_fields:
      - timestamp
      - host_id
      - process_id
      - process_image
      - parent_process_id
      - user_sid
    - source_type: registry-audit-coverage-register
      name:
        zh: 经测试的审核覆盖与允许读取者台账
        en: Tested audit-coverage and approved-reader register
      channel: null
      required_fields:
      - host_id
      - registry_scope
      - audited_rights
      - audited_principals
      - allowed_readers
      - coverage_valid_from
      - coverage_valid_until
      - validation_result
    field_mapping:
      zh: 4663 的规范字段依次映射 TimeCreated、Computer、EventID、SubjectUserSid、SubjectLogonId、ProcessId、ProcessName、ObjectType、ObjectName
        和 AccessMask；process_id 需转为一致格式。4688 映射同前述合同。覆盖台账是额外管理数据，须保存测试及 SACL/策略版本，不能从事件缺失倒推生效。registry_path 表示键对象路径，不冒充 value_name
        或 query_result。 读取主体以4663的SubjectUserSid为准；4688主体用于创建上下文，跨身份创建时保留TargetUserSid差异，不以创建者SID覆盖实际读取者。
      en: The normalized 4663 fields map respectively to TimeCreated, Computer, EventID, SubjectUserSid, SubjectLogonId, ProcessId,
        ProcessName, ObjectType, ObjectName, and AccessMask, with consistent PID representation. The 4688 mapping follows
        its documented contract. The coverage register is additional administrative data retaining tests and SACL or policy
        versions; effectiveness cannot be inferred from absent events. registry_path denotes a key-object path rather than
        an invented value_name or query_result. The reader identity comes from 4663 SubjectUserSid. The 4688 subject describes
        creation context; preserve TargetUserSid differences for cross-identity creation rather than overwrite the actual
        reader with the creator SID.
    observables:
    - zh: 非预期进程实际使用键查询值或枚举子键权限
      en: An unexpected process exercises key-value-query or subkey-enumeration rights
    - zh: 同进程实例跨非相关配置分支出现已用读取权限
      en: One process instance exercises read rights across unrelated configuration branches
    correlation:
      window:
        zh: 以真实进程生存期消除 PID 重用，并在 10 分钟任务窗口内关联读取；覆盖登记须在事件时刻有效。
        en: Disambiguate PID reuse with the true process lifetime and correlate reads within a ten-minute task window; coverage
          registration must be valid at event time.
      dimensions:
      - host_id
      - user_sid
      - logon_id
      - process_id
      - registry_path
      - access_mask
      - time
    false_positives:
    - zh: 安全代理、管理代理、系统初始化和升级会合法读取多个分支。
      en: Security and management agents, initialization, and upgrades legitimately read multiple branches.
    blind_spots:
    - zh: 未匹配 SACL、审核未生效、日志溢出和不同版本行为可缺失事件；事件本身不含返回值或可靠视图标志。
      en: Mismatched SACLs, ineffective auditing, log overflow, and version differences can omit events; the event itself
        lacks returned values and reliable view flags.
    - zh: 远程服务承载可改变可见进程归属，离线 hive 文件解析不自动产生该活动键的事件。
      en: Remote-service execution can change visible process attribution, while offline-hive parsing does not automatically
        create events on the original active keys.
    tuning_guidance:
      paragraphs:
      - zh: 优先对高价值的一般配置分支、关键主机和受控账户建立目标化成功读取审计，验证两种权限的事件并远程保留；避免全树 SACL 造成日志过载。允许读取者例外保留 owner、版本、路径和期限。用户 hive、重定向视图、远程服务和受保护分支应逐组测试，缺少返回内容时使用专用跟踪而非扩大解释
          4663。
        en: Prioritize targeted success auditing for high-value general-configuration branches, critical hosts, and controlled
          accounts, validate both rights, and retain events remotely. Avoid whole-tree SACLs that overload logging. Approved-reader
          exceptions retain owner, version, path, and expiry. Test user hives, redirected views, remote services, and protected
          branches separately. Use dedicated tracing for missing result detail rather than broaden the interpretation of 4663.
      - zh: 4663 的规范字段依次映射 TimeCreated、Computer、EventID、SubjectUserSid、SubjectLogonId、ProcessId、ProcessName、ObjectType、ObjectName
          和 AccessMask；process_id 需转为一致格式。4688 映射同前述合同。覆盖台账是额外管理数据，须保存测试及 SACL/策略版本，不能从事件缺失倒推生效。registry_path 表示键对象路径，不冒充
          value_name 或 query_result。 读取主体以4663的SubjectUserSid为准；4688主体用于创建上下文，跨身份创建时保留TargetUserSid差异，不以创建者SID覆盖实际读取者。
        en: The normalized 4663 fields map respectively to TimeCreated, Computer, EventID, SubjectUserSid, SubjectLogonId,
          ProcessId, ProcessName, ObjectType, ObjectName, and AccessMask, with consistent PID representation. The 4688 mapping
          follows its documented contract. The coverage register is additional administrative data retaining tests and SACL
          or policy versions; effectiveness cannot be inferred from absent events. registry_path denotes a key-object path
          rather than an invented value_name or query_result. The reader identity comes from 4663 SubjectUserSid. The 4688
          subject describes creation context; preserve TargetUserSid differences for cross-identity creation rather than overwrite
          the actual reader with the creator SID.
    evidence_keys:
    - REF-000379
    - B016-T1012-REF-AUDIT
    - B016-T1012-REF-RIGHTS
    - B016-T1012-REF-VALUE
    - B016-T1012-REF-ENUM
    - REF-000334
  - key: B016-T1012-NJA-INPROCESS
    resolution: create
    strategy_key: B016-T1012-DET-INPROCESS
    name:
      zh: 驻留进程直接 Registry 读取与执行器差分
      en: Resident-Process Direct Registry Reads and Executor Differential
    summary:
      zh: 对既有进程的异常读取建立原语证据，并在完整覆盖时检验是否省去每任务查询执行器。
      en: Establish primitive-level evidence of unusual reads in an existing process and test omission of a per-task query
        executor where coverage is complete.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在重点主机或响应调查中额外部署 Process Monitor，以受控时段捕获 Registry 与进程活动，保留 PML 和进程树。先用已知测试值及子键对 RegQueryValue、RegEnumKey 或部署实际输出的等价操作名称、Path、Result
          和进程归属逐一验证；不得由产品简介假定任意字段齐全。分析读取发生在已存在的进程实例中、目标为一般配置探索且不符合批准任务的记录，将操作状态与有值输出分别标记；ERROR_MORE_DATA、NAME NOT FOUND 和仅长度查询不得充当取得值。
        en: Additionally deploy Process Monitor on priority hosts or during response, capturing Registry and process activity
          for controlled intervals and preserving PML and the process tree. Validate operation names such as RegQueryValue
          and RegEnumKey or actual equivalent output, Path, Result, and process attribution with known test values and subkeys.
          A product introduction does not guarantee every field. Analyze reads by an already existing process instance that
          explore general configuration outside approved work, keeping operation status separate from obtained value output.
          ERROR_MORE_DATA, NAME NOT FOUND, and size-only queries do not establish acquired values.
      - zh: 同一进程实例的直接操作记录首先支持已观察驻留进程读取。只有任务记录、实际执行代码或调用链与该次查询正面关联，才能进一步标记驻留承载得到支持；同期采集完整且任务边界明确时，才比较每任务执行器是否被省去，缺少新进程本身不提高等级。可用栈解析时检查模块与批准职责的关系，结合环境探索范围和未批准来源排序。没有相应证明来源时保留查询线索与承载未知，不凭
          COFF 装载或注入事件认定本子项。
        en: Direct operation records for the same process instance first establish an observed resident-process read. Raise
          the level to supported resident carriage only when task records, executing code, or a call chain positively link
          to that inquiry. Compare omission of a per-task executor only with complete contemporaneous capture and an established
          task boundary; missing process events alone do not raise the level. Where stack resolution exists, compare modules
          with approved duties and rank environmental scope and unapproved provenance. Without the required proof source,
          retain a query lead with carrier unknown rather than confirming this child from COFF loading or injection.
    data_requirements:
    - source_type: dedicated-registry-operation-trace
      name:
        zh: 额外部署并验证导出的 Registry 操作跟踪
        en: Additionally deployed Registry-operation tracing with validated exports
      channel: Process Monitor PML and validated event export
      required_fields:
      - timestamp
      - host_id
      - process_id
      - process_image
      - operation
      - registry_path
      - result
    - source_type: windows-process-creation
      name:
        zh: 与跟踪同期完整保留的进程创建
        en: Process creation retained completely alongside the trace
      channel: Security 4688 or validated Sysmon Event 1
      required_fields:
      - timestamp
      - host_id
      - process_id
      - process_image
      - parent_process_id
    - source_type: registry-trace-validation-register
      name:
        zh: 跟踪覆盖健康与批准读取台账
        en: Trace-health and approved-reader register
      channel: null
      required_fields:
      - host_id
      - trace_start
      - trace_end
      - capture_filters
      - dropped_event_status
      - validation_result
      - approved_readers
      - registry_scope
    - source_type: conditional-query-carriage-proof
      name:
        zh: 仅启用承载确认时的查询任务与实现证明
        en: Query-task and implementation proof only when carrier confirmation is enabled
      channel: Independently verified task records, executing-code provenance, or authorized call-chain capture
      required_fields:
      - client_host
      - process_instance_id
      - task_id
      - query_scope
      - task_start
      - task_end
      - carriage_mode
      - evidence_locator
      - verification_state
    field_mapping:
      zh: 专用 trace 规范字段映射到实测导出中的 Time、Process Name、PID、Operation、Path、Result；host_id 由采集主机标识附加，并保留原 PML 对照。启动时间、时区和原生日志时间先统一；Process
        Monitor 不作为默认 EDR 通道。Detail、Stack 和任何返回数据仅在实测存在且语义验证后补充，不列为普遍必需字段。进程与台账的映射、派生实例起点和健康结果均须记录来源。 process_start_time 从完整进程创建记录派生，time
        对应统一后的 timestamp；不能由 PID 单独生成永久实例。 本专用分析的直接归属分支限于本地读取，client_host 对应捕获主机 host_id；远程服务端 PID 不能直接当作远端查询客户端，跨机实现需要独立的两端会话与任务证明。
      en: Trace normalization maps to experimentally verified Time, Process Name, PID, Operation, Path, and Result exports.
        Attach host_id from the capture host and retain original PML for comparison. Normalize start times, timezone, and
        log clocks first. Process Monitor is not a default EDR channel. Detail, Stack, and returned data are supplements only
        after their presence and meaning are validated, not universal required fields. Record provenance for process and register
        mappings, derived instance starts, and health results. Derive process_start_time from complete creation records and
        map time to normalized timestamp; PID alone does not form a permanent instance. The direct-attribution branch of this
        dedicated analytic covers local reads, with client_host mapped to capture-host host_id. A remote service PID is not
        the remote query client; cross-host implementations need independent evidence joining both endpoint sessions and tasks.
    observables:
    - zh: 既有进程直接执行与其批准角色不符的一般配置分支读取
      en: An existing process directly reads general-configuration branches outside its approved role
    - zh: 完整同期覆盖中同一任务没有新查询执行器，且原语归属于已有实例
      en: Complete concurrent coverage shows no new query executor for a task whose primitive belongs to the existing instance
    correlation:
      window:
        zh: 使用完整专用跟踪区间及承载进程生存期；按 5 分钟任务聚合，并在隔离实验中用相同令牌、键、值和视图比较进程内与新执行器路径。
        en: Use the complete dedicated-capture interval and carrier lifetime; group tasks over five minutes and compare in-process
          versus new-executor paths in an isolated experiment using the same token, key, value, and view.
      dimensions:
      - host_id
      - process_id
      - process_start_time
      - registry_path
      - operation
      - result
      - time
    false_positives:
    - zh: 浏览器、配置代理、插件和诊断服务也会在既有进程中直接读取，且无需创建子进程。
      en: Browsers, configuration agents, plugins, and diagnostic services directly read inside existing processes without
        creating children.
    blind_spots:
    - zh: 专用跟踪未部署、过滤或丢失、进程寿命不完整、未解析堆栈和时钟差会妨碍执行器差分；未取得返回数据时结果内容仍未知。
      en: Absent, filtered, or dropped dedicated traces, incomplete lifetimes, unresolved stacks, and clock differences impair
        executor comparisons; content remains unknown without returned data.
    - zh: 仅靠操作记录不能识别 BOF 格式、控制主体或恶意目的；读取者也可能已是被入侵的合法程序。
      en: Operation records alone identify neither BOF format, controller, nor malicious purpose, and the reader may be a
        compromised legitimate program.
    tuning_guidance:
      paragraphs:
      - zh: 先按批准的读取者与配置范围建立基线，再扩大跟踪；保留有界采集窗口和磁盘预算，并检查过滤与丢失。实验分别验证取值、子键枚举、长度查询、失败、32/64 视图和不同权限，避免把 API 名、一次返回成功或无命令行直接解释为隐蔽读取。部署不能提供完整
          trace 时，以 键读取权限分析 的权限层结果维持部分覆盖，明确其内容和归因限制。
        en: Establish approved readers and configuration scopes before broadening capture, using bounded intervals and disk
          budgets and checking filters and loss. Separately validate value reads, subkey enumeration, size-only requests,
          failures, 32-bit or 64-bit views, and differing rights. Do not treat an API name, one success status, or absent
          command line as covert reading. Where complete tracing is unavailable, retain partial rights-level coverage from
          the key-read-rights analytic with explicit content and attribution limits.
      - zh: 承载确认分支要求证明材料关联到被观察的同一客户端实例、任务范围与时点，并验证实际执行的入口或调用链；仅有通用产品文档、API 导入或可能存在的代码不能提升等级。没有该来源时仍可运行查询检测，但承载方式和有意替代保持未知。
        en: Carrier confirmation requires evidence tied to the same observed client instance, task scope, and time, verifying
          the executing entry or call chain. Generic product documentation, imports, or possibly present code do not raise
          the level. Query detection can run without this source, but carrier selection and deliberate substitution remain
          unknown.
      - zh: 专用 trace 规范字段映射到实测导出中的 Time、Process Name、PID、Operation、Path、Result；host_id 由采集主机标识附加，并保留原 PML 对照。启动时间、时区和原生日志时间先统一；Process
          Monitor 不作为默认 EDR 通道。Detail、Stack 和任何返回数据仅在实测存在且语义验证后补充，不列为普遍必需字段。进程与台账的映射、派生实例起点和健康结果均须记录来源。 process_start_time
          从完整进程创建记录派生，time 对应统一后的 timestamp；不能由 PID 单独生成永久实例。 本专用分析的直接归属分支限于本地读取，client_host 对应捕获主机 host_id；远程服务端 PID 不能直接当作远端查询客户端，跨机实现需要独立的两端会话与任务证明。
        en: Trace normalization maps to experimentally verified Time, Process Name, PID, Operation, Path, and Result exports.
          Attach host_id from the capture host and retain original PML for comparison. Normalize start times, timezone, and
          log clocks first. Process Monitor is not a default EDR channel. Detail, Stack, and returned data are supplements
          only after their presence and meaning are validated, not universal required fields. Record provenance for process
          and register mappings, derived instance starts, and health results. Derive process_start_time from complete creation
          records and map time to normalized timestamp; PID alone does not form a permanent instance. The direct-attribution
          branch of this dedicated analytic covers local reads, with client_host mapped to capture-host host_id. A remote
          service PID is not the remote query client; cross-host implementations need independent evidence joining both endpoint
          sessions and tasks.
    evidence_keys:
    - B016-T1012-REF-PROCMON
    - B016-T1012-REF-VALUE
    - B016-T1012-REF-ENUM
    - B016-T1012-REF-RIGHTS
    - B016-T1057-REF-BOF
    - B016-T1012-REF-COMMANDS
    - REF-000379
    - REF-000334
  mitigations:
  - key: B016-T1012-MIT-READ-GOVERNANCE
    resolution: create
    name:
      zh: Registry 读取暴露与独立观察治理
      en: Registry Read-Exposure and Independent-Observation Governance
    summary:
      zh: 针对高价值配置收紧读取与副本暴露，校验远程访问需求，并让读取观察独立于命令工具启动。
      en: Constrain reads and copies of high-value configuration, verify remote-access needs, and observe reads independently
        of utility launches.
    description:
      paragraphs:
      - zh: Registry 是系统与应用共享配置面，不能整体禁止读取。该控制按键 owner、角色和实际读取需求管理配置暴露，对可限制的分支及导出文件实行最小读取权，并明确远程 Registry 的批准用途。对业务必须广泛可读的配置，以验证过的审计和有界跟踪恢复观察，而不是承诺通过
          ACL 隐藏全部环境事实。
        en: The Registry is a shared configuration surface whose reads cannot be prohibited wholesale. This control manages
          exposure by key owner, role, and genuine read requirements, applying least-read authority to restrictable branches
          and exports while defining approved Remote Registry use. For configuration that must remain broadly readable, validated
          auditing and bounded tracing restore observation rather than promise that ACLs hide all environmental facts.
    domains:
    - enterprise
    measures:
    - key: scoped-read-authority
      name:
        zh: 按配置对象收紧读取与副本权
        en: Constrain read and copy authority by configuration object
      description:
        paragraphs:
        - zh: 为高价值的一般配置键记录 owner、业务读取者和继承关系，区分 QueryValue、EnumerateSubKeys 与写入权；在兼容性验证后只为需要者保留读取。导出、备份和镜像 hive 文件也按文件读取者及保存位置治理，因为取得可读离线文件后不能依赖原活动键的
            ACL 继续保护其内容。不得把所有 HKCU 或 HKLM 设为拒绝读取。
          en: Record owner, business readers, and inheritance for high-value general-configuration keys, separating QueryValue
            and EnumerateSubKeys from writes. After compatibility validation retain reads for necessary principals. Govern
            exported, backup, and image hives by file readers and storage location, since the original active-key ACL cannot
            be relied upon once a readable offline file is obtained. Do not deny reads across all of HKCU or HKLM.
      control_type: exposure-reduction
    - key: remote-query-admission
      name:
        zh: 限定远程 Registry 的批准访问面
        en: Limit the approved Remote Registry access surface
      description:
        paragraphs:
        - zh: 清点依赖 Remote Registry 的管理任务，按主机角色、管理来源和身份保留必要可达性及服务使用；无业务需要时收缩该接口，变更前验证监控、备份和支持流程。服务不可用或远程调用失败只说明该路径受阻，不能说明本地、代理或副本读取被阻止。
          en: Inventory management tasks depending on Remote Registry and preserve necessary service use and reachability
            by host role, management source, and identity. Reduce the interface where unnecessary after validating monitoring,
            backup, and support dependencies. An unavailable service or failed remote call blocks that path rather than local,
            agent-mediated, or copy-based reads.
      control_type: exposure-reduction
    - key: read-observation-independent-of-executor
      name:
        zh: 独立于查询执行器验证读取观察
        en: Validate read observation independently of the query executor
      description:
        paragraphs:
        - zh: 对选定分支部署匹配读取权限和主体的审核策略及 SACL，并用取值和枚举分别验证；事件远程保留并维护覆盖有效期。重点主机或响应阶段按预算增加操作跟踪，以真实进程实例关联读取。覆盖健康、丢失与不支持的结果层必须显式记录，不以写入日志或新
            reg.exe 缺失充当读取证据。
          en: Deploy audit policy and SACLs matching read rights and principals on selected branches, testing value reads
            and enumeration separately. Retain events remotely and maintain coverage validity. Add budgeted operation tracing
            on priority hosts or during response and associate reads with true process instances. Explicitly record health,
            loss, and unsupported result layers instead of substituting write logs or absent reg.exe for read evidence.
      control_type: detective-support
    applications:
    - target_key: B016-T1012-PARENT
      use:
        paragraphs:
        - zh: 对一般环境性 Registry 查询，先识别确需保护且业务可限制的配置分支，调整键读取 ACL 和副本文件读权，审核远程管理需求，再让命令意图与已审计的读取权限关联到批准任务。将专门的软件、身份和策略查询交给相应控制
            owner，避免因路径重叠重复管控。
          en: For general environmental Registry queries, identify configuration branches needing protection where business
            permits restriction, adjust key-read ACLs and copied-file read authority, review remote-management needs, and
            associate command intent and audited read rights with approved tasks. Route dedicated software, identity, and
            policy queries to their control owners rather than duplicate controls because paths overlap.
      expected_effect:
        paragraphs:
        - zh: 不必要的读取者及可取得副本的主体减少，高价值配置探索更容易关联到具体身份和任务。无法限制的配置仍保持可用，但其异常读取获得明确的观察范围；攻击者必须使用仍被允许的主体或扩大权限，后续调查也能区分意图、访问权使用和内容取得。
          en: Fewer unnecessary readers and principals can obtain copies, and high-value configuration exploration becomes
            attributable to identities and work. Unrestrictable configuration remains available but gains a defined observation
            scope for unusual reads. An adversary must use an allowed principal or expand authority, and investigation can
            distinguish intent, exercised rights, and acquired content.
      limitations:
        paragraphs:
        - zh: 许多配置必须由普通用户和应用读取，严格 ACL 会破坏启动、兼容性或支持工具；攻击者控制合法读取者后仍可取得内容。离线副本受文件访问和采集路径控制，原键 SACL 不自动跟随；审核可能高噪声，且权限事件不能证明具体返回值。该控制不替代凭据保护，也不直接恢复持久状态或防御设置。
          en: Many configurations must remain readable to users and applications, and strict ACLs can break startup, compatibility,
            or support tools. Control of a legitimate reader still permits access. Offline copies depend on file-access and
            acquisition-path controls, without automatic inheritance of the original key's SACL. Auditing can be noisy, and
            rights events do not prove specific returned values. This control neither replaces credential protection nor directly
            repairs durable state or defensive settings.
    - target_key: B016-T1012-CHILD-INPROCESS
      use:
        paragraphs:
        - zh: 对进程内注册表查询，在相同令牌、键、值和视图下比较驻留内联与新工具路径，确认选定读取审计或专用 trace 两者都能关联到真实读取者；控制例外绑定承载进程的业务角色和对象范围。不要只拦截 reg.exe，读取权限制和原语观察须对进程内代码同样有效。
          en: For In-Process Registry Query, compare resident inline and new-utility paths under the same token, key, value,
            and view, verifying that selected read auditing or dedicated tracing associates both with the true reader. Bind
            exceptions to the carrier's business role and object scope. Restricting reg.exe alone is insufficient; read authority
            and primitive-level observation must apply equally to in-process code.
      expected_effect:
        paragraphs:
        - zh: 防守能力不再以每次查询创建新执行器为前提，省去命令进程只能减少一类痕迹，不能同时取消已验证的键读取记录。攻击者即使利用已有进程，也须面对同样的读取权限和按进程角色解释的访问轨迹。
          en: Defensive visibility no longer presupposes a new executor for each query. Omitting command processes reduces
            one trace class without removing validated key-read records. Even through an existing process, an adversary faces
            the same read rights and access traces interpreted against process role.
      limitations:
        paragraphs:
        - zh: 活动键审计覆盖不自动延伸到离线解析，承载进程本身合法且读权宽泛时只能靠上下文区分目的。专用跟踪增加性能、存储和运维成本；读取审计不直接识别 BOF、控制主体或返回内容。已控制的高权主体还可能影响传感器，应把覆盖异常作为调查对象而非假设审计永远完整。
          en: Active-key auditing does not automatically extend to offline parsing, and a legitimate carrier with broad read
            authority requires contextual purpose analysis. Dedicated tracing adds performance, storage, and operational cost.
            Read auditing does not directly identify a BOF, controller, or returned content. A compromised privileged principal
            may also affect sensors, making coverage anomalies investigative evidence rather than grounds to assume auditing
            is always complete.
