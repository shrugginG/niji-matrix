  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 已阅读实际 NJT-0001 及字段规范。定义分开说明知识目标与请求/权利/结果合同；匿迹分析给出管理近似、主动省去执行器及残余原语；范围包含邻项、合法初始化、权限和视图反例；模型区分本地、远程、副本前提和默认/额外传感器。父及子项均完整编写，未用执行/注入/COFF内容替换
        Registry 语义。防御分别实现命令意图、已用权限和可选专用trace，限制中明确未测部分。
      en: The actual NJT-0001 and field specification were read. Definition separates the knowledge objective from request,
        rights, and result contracts. Stealth analysis covers management resemblance, deliberate executor omission, and residual
        primitives. Scope includes adjacent objects, legitimate initialization, rights, and view counterexamples. Models distinguish
        local, remote, and copy prerequisites and default versus additional sensors. Both parent and child are fully authored
        without replacing Registry semantics with execution, injection, or COFF content. Defenses implement command intent,
        exercised rights, and optional dedicated tracing separately, with untested aspects explicit.
