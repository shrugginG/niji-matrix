      zh: 本技术没有必须编码或加密的查询内容，未取得 Registry 专属内容遮蔽因果证据；普通句柄及结果不完整不是数据遮蔽。
      en: The technique does not inherently encode or encrypt queries, and no Registry-specific obscuration chain was established.
        Handles or incomplete results are not Data Obscuration.
  - mechanism_ref: NM-BT
