        zh: 有效防御设置治理不适用于单纯只读环境调查。
        en: Effective defensive-setting governance does not apply to a purely read-only environmental investigation.
    - existing_ref: REF-000334
      resolution: reuse
      notes:
        zh: 与REF-000623一起支持4688及单独启用命令行前提，不能支持读结果。
        en: Together with REF-000623 supports 4688 and separately enabled command lines rather than read results.
    - existing_ref: REF-000463
      resolution: reuse
      notes:
        zh: 只作为启用后的4104补充来源，不要求完整读取或结果；主分析不依赖它。
        en: An enabled-4104 supplement only, without complete-read or result assumptions; the main analytic does not depend
          on it.
    - existing_ref: REF-000598
      resolution: reuse
      notes:
        zh: DeviceProcessEvents只支持已记录进程/父子/命令行，不能当Registry读或API结果表。
        en: DeviceProcessEvents supports recorded processes, ancestry, and command lines rather than a Registry-read or API-results
          table.
