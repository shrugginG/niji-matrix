      zh: 默认缺读取日志是防守配置条件，不单独证明攻击者主动控制的匿迹变量；保留的NM-BT只映射明确的进程内执行器省略。
      en: Missing default read logs are a defensive configuration condition rather than an attacker-controlled variable by
