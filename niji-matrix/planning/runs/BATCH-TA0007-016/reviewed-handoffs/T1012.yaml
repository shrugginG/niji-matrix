recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: 保留固定 Enterprise 19.1 T1012 的注册表信息读取行为，并将正式范围收敛为一般环境配置探索及尚未确定专门信息结果的查询尝试。原基线也用软件等具体信息举例；这些结果在 Niji 中按直接目的由各自发现技术承担，不能因同样使用
        Registry 再建立一个父级结果。联合公告证明 reg query 的实际使用，ESET 另证明一般键、值和数据枚举能力，官方文档界定读取与结果语义，因此采用 adapt 明确分流而不否定原行为。
      en: Preserve Registry information reads from fixed Enterprise 19.1 T1012 while converging formal scope on general environmental-configuration
        exploration and query attempts whose specialized information result remains unresolved. The baseline also illustrates
        specific information such as software; Niji assigns those results to their direct-purpose discovery owners rather
        than creating a second parent result merely because Registry access is used. The joint advisory establishes actual
        reg query use, ESET independently establishes general key, value, and data enumeration, and official documentation
        defines read and result semantics. Adapt makes this routing explicit without rejecting the original behavior.
  scope_notes:
    paragraphs:
    - zh: 纳入查找键、枚举子键或值、读取配置数据以了解环境。密码及组策略、账户与组关系、存储属性、运行进程和已安装软件的专门调查优先归各自对象；读取只是这些对象的实现细节时不另造 Registry 案例。注册表写入、访问恢复所需持久状态及
        consumer 结果、有效防御设置削弱、secret 或凭据 hive 提取分别分属修改、NJT-0094、NJT-0162 或凭据访问，不能由 reg query、reg save 或同一路径互相替代。
      en: Include locating keys, enumerating subkeys or values, and reading configuration data to understand the environment.
        Dedicated investigations of password or Group Policy, account and group relationships, storage attributes, running
        processes, and installed software belong first to their respective information objects. Do not add a Registry case
        when reading is only their implementation detail. Registry mutation, durable state and consumer results needed to
        restore access, effective weakening of defensive settings, and secret or credential-hive extraction belong respectively
        to modification, NJT-0094, NJT-0162, or credential access. These meanings cannot substitute for one another merely
        because they use reg query, reg save, or the same path.
  evidence_keys:
  - B016-T1012-REF-ATTACK
  - REF-000025
  - REF-000506
  - B016-T1012-REF-COMMANDS
  - B016-T1057-REF-BOF
  original_attack_subtechniques_imported: false
proposed_content:
  key: B016-T1012-PARENT
  name:
    zh: 注册表查询
    en: Query Registry
  summary:
    zh: 读取或枚举 Windows Registry 信息以理解环境，借用普通配置管理外观，或在既有进程内完成查询以减少每次操作的新执行器痕迹。
    en: Read or enumerate Windows Registry information to understand an environment, borrowing ordinary configuration-management
      appearance or completing queries inside an existing process to reduce new-executor traces for each operation.
  aliases: []
  definition_and_concept:
    paragraphs:
    - zh: 注册表查询是攻击者在拥有主机执行能力或受授权接口访问能力后，查找 Windows Registry 键、枚举子键和值或读取配置数据，以获知所在环境并规划后续行动的发现行为。直接结果是键结构、值名称、数据类型或配置内容带来的知识，而不是改变键值状态。命令工具、脚本、进程内接口、远程访问和可读副本都可能承载读取，但具体工具或
        hive 不决定本技术的含义。
      en: Query Registry is discovery in which an adversary with host execution or authorized-interface access locates Windows
        Registry keys, enumerates subkeys and values, or reads configuration data to understand the environment and plan later
        actions. Its direct result is knowledge from key structure, value names, types, or configuration content rather than
        a change to key-value state. Utilities, scripts, in-process interfaces, remote access, and readable copies can carry
        a read, but a particular tool or hive does not define the technique.
    - zh: 需要区分请求、访问权使用和实际结果。打开键或请求 KEY_QUERY_VALUE 不证明取回了值；RegQueryValueEx 可以只查询所需缓冲区长度，缓冲区不足也会返回 ERROR_MORE_DATA。枚举子键使用 KEY_ENUMERATE_SUB_KEYS，与读取某个值的数据不是同一结果。只有保留相应输出、返回参数或经过验证的操作记录，才能把查询意图提升为得到特定环境事实；不完整记录应保留未知状态。
      en: Requests, exercised rights, and actual results require separate treatment. Opening a key or requesting KEY_QUERY_VALUE
        does not establish that a value was obtained. RegQueryValueEx can request only the necessary buffer size, and an insufficient
        buffer can return ERROR_MORE_DATA. Subkey enumeration uses KEY_ENUMERATE_SUB_KEYS and is a different result from reading
        a value's data. Query intent becomes acquisition of a particular environmental fact only when corresponding output,
        return parameters, or validated operation records support it. Incomplete records should preserve an unknown state.
  stealth_characteristics:
    paragraphs:
    - zh: 注册表查询借用 Windows 和应用日常依赖的配置读取路径。攻击者使用正常账户、原生工具或常见查询形式时，局部可见的动作与故障排查、兼容性处理和资产管理相近；即使看到 reg.exe 与目标路径，也很难仅凭该事件辨明知识的后续用途。攻击者没有因此取得免审计地位，命令、账户、父进程、读取范围及后继行为仍能提供区分线索。
      en: Query Registry borrows configuration-reading paths used routinely by Windows and applications. Normal accounts,
        native utilities, and familiar query forms can make an adversary's locally visible action resemble troubleshooting,
        compatibility handling, or asset management. Even reg.exe and its target path do not alone reveal the later use of
        the knowledge. This does not grant immunity from auditing; commands, accounts, ancestry, read scope, and subsequent
        behavior remain discriminating context.
    - zh: 当攻击者有意在既有受控进程中执行查询，而不为每次任务启动 cmd.exe、reg.exe 或脚本解释器时，操作参数不会自然形成新的查询进程命令行。只看进程创建的防守方因此可能漏掉动作，但对同一进程的 Registry 读取仍可审计或跟踪。该痕迹差来自明确的执行设计；未启用默认读日志、普通应用调用
        API 或传感器丢失不能反过来证明攻击者选择了这种匿迹方式。
      en: When an adversary deliberately queries inside an existing controlled process instead of starting cmd.exe, reg.exe,
        or a script interpreter for each task, the parameters do not naturally appear in a new query process's command line.
        Process-creation-only observation can consequently miss the action, while Registry reads by the same process remain
        auditable or traceable. The difference follows a specific execution design. Missing default read logs, an ordinary
        application's API use, or sensor loss does not establish that the adversary selected this evasion approach.
  scope_boundary_definition:
    paragraphs:
    - zh: 本技术纳入以理解环境为直接目的的一般注册表探索、键或值枚举及配置读取。若证据表明直接结果是密码策略、组策略、账户身份或组成员关系、卷容量与挂载、运行进程或软件安装清单，则按对应的信息对象归属；同一次调用可以取得不同事实，但只有存在可区分的直接结果才可分别记录，不能重复陈述一个读取事实。注册表取值本身也不能证明某项配置已经在真实
        consumer 中生效。
      en: Include general Registry exploration, key or value enumeration, and configuration reading whose immediate purpose
        is environmental understanding. When the direct result is a password policy, Group Policy, account identity or group
        membership, volume capacity or mounts, running processes, or installed-software inventory, use the corresponding information
        object. One call may obtain different facts, but separate recording requires distinguishable direct results rather
        than repeated descriptions of one read. Retrieving a Registry value also does not establish that a real consumer has
        adopted that setting.
    - zh: 创建、删除、重命名或设值不是本技术的读行为。为以后恢复访问而保存并消费 Registry 状态归 NJT-0094，修改后实际削弱防御归 NJT-0162；从 SAM、SECURITY、SYSTEM 等材料中提取凭据和 secret
        按凭据访问判断。读取恶意载荷配置供其继续运行也不因使用读取 API 自动成为环境发现。合法管理、取证和应用初始化可以产生相同查询；WOW64、虚拟化、权限拒绝、未装载用户 hive 或查询错误造成的视图差异均不能直接归因为匿迹。
      en: Creation, deletion, renaming, and value setting are not this technique's read behavior. Saving and consuming Registry
        state to restore access later belongs to NJT-0094, and an effective defensive decline after modification belongs to
        NJT-0162. Extraction of credentials or secrets from material such as SAM, SECURITY, or SYSTEM requires credential-access
        classification. Reading a malicious payload's own configuration for continued operation does not become environmental
        discovery simply because it uses a read API. Management, forensics, and application initialization can issue the same
        queries. Differences caused by WOW64, virtualization, denied access, unloaded user hives, or query errors cannot directly
        establish evasion.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 在初始访问后的环境测绘或长期驻留中的按需调查阶段，攻击者可以先探索注册表结构和配置，再决定选择哪些目标、模块或操作。人工操作者可使用主机已有工具，驻留模块也可接收指定键或值的查询任务。Volt Typhoon 的公告提供原生工具使用的现场层证据；InvisiMole
          的命令表提供通用枚举的恶意软件能力证据，两者不等于公开了每台受害设备的返回内容。
        en: During environmental mapping after initial access or an on-demand investigation during residence, an adversary
          can explore Registry structure and configuration before choosing targets, modules, or actions. A human operator
          can use existing host utilities, while a resident module can receive a task naming a key or value. The Volt Typhoon
          advisory supplies field evidence of native-utility use, and InvisiMole's command table supplies malware-capability
          evidence of general enumeration. Neither publishes the results returned on every affected device.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者需要能够执行查询代码或调用可达接口，并具有目标键的相应读取或枚举权限。广泛可读配置不必然需要管理员身份，但其他用户 hive、受保护分支和远程主机受到 ACL、装载状态、身份与服务条件限制。远程 Registry
            要求目标服务可用和适当访问权；能访问网络或请求一个句柄不代表能获得任意键数据。
          en: The adversary must execute query code or call a reachable interface and hold the appropriate read or enumeration
            rights on the target key. Broadly readable configuration need not require administration, but other users' hives,
            protected branches, and remote hosts are constrained by ACLs, loaded state, identity, and service conditions.
            Remote Registry requires an available target service and suitable access. Network reachability or a requested
            handle does not confer arbitrary key data.
        - zh: 进程内实现还要求攻击者已控制可执行查询的驻留上下文，并能选择直接返回结果的模块而非每任务新执行器。选择 32 位或 64 位视图影响读取对象，兼容性虚拟化还可能改变适用进程看到的合并值；攻击者不能假定一种位数或一个根句柄覆盖全部状态。查询离线
            hive 则先需要取得可读文件，副本取得的权限、成本与痕迹独立于后续解析。
          en: An in-process implementation additionally requires a resident context able to execute the query and a choice
            of a module that returns results directly rather than a new executor per task. Selecting a 32-bit or 64-bit view
            changes the object read, and compatibility virtualization can change the merged values seen by eligible processes.
            One architecture or root handle cannot be assumed to cover all state. Offline-hive querying first requires a readable
            file; the authority, cost, and traces of acquiring that copy are separate from later parsing.
      defender_model:
        paragraphs:
        - zh: 防守方可能保有 Security 4688、Sysmon Event 1、经验证的 EDR 进程事件及启用后的 PowerShell 4104，因而看到进程与部分查询意图。Security 4663 只有在对应审核策略与匹配主体、对象和权限的
            SACL 生效时才提供键对象访问权使用；0x1 和 0x8 应按 Registry 类型解释。Sysmon 12、13、14 描述对象变化，不提供普遍的读取流，也不能补出查询返回内容。
          en: A defender may retain Security 4688, Sysmon Event 1, validated EDR process events, and enabled PowerShell 4104,
            exposing processes and some query intent. Security 4663 supplies exercised rights on key objects only when the
            appropriate audit policy and a SACL matching principal, object, and access are effective. Masks 0x1 and 0x8 require
            Registry-specific interpretation. Sysmon 12, 13, and 14 describe mutations rather than a general read stream and
            cannot supply query results.
        - zh: 本文的进程内匿迹结论针对依赖新命令进程的观察模型。部署目标化读取审计或额外的 Process Monitor 跟踪后，同一 PID、对象、操作和结果仍可观察；进程实例、账户、权限、查询视图、主机角色与批准任务是必要上下文。专用跟踪需要额外部署、采集范围验证和性能评估，不能假定任意
            EDR 默认提供 API、返回值、调用栈或完整读取记录。
          en: The in-process stealth conclusion concerns observation that depends on a new command process. Targeted read
            auditing or additional Process Monitor tracing can still expose PID, object, operation, and result. Process instance,
            account, rights, query view, host role, and approved work supply necessary context. Dedicated tracing requires
            additional deployment, capture-scope validation, and performance assessment. Arbitrary EDR products cannot be
            assumed to provide APIs, return data, stacks, or complete read records by default.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 在既有进程内完成查询，省去依赖新查询进程的命令行观察点
      en: Query inside an existing process and remove command-line observation points dependent on a new query process
    analysis:
      paragraphs:
      - zh: 官方 BOF 合同说明代码在 Beacon 进程中执行，命令表将 Registry 查询明确列为 BOF。选择该实现而不是为每次任务启动命令工具，使新的查询进程及其参数不再出现，进而使只匹配 reg.exe 或新解释器参数的分析失去触发对象。这一能力与读取原语形成明确因果链，支持中等置信度的行为透明映射；它既不说明所有
          API 调用都在匿迹，也不说明 Registry 审计或内存检查被绕过。
        en: The official BOF contract places execution inside Beacon, and the command table explicitly lists Registry querying
          as a BOF. Selecting that implementation instead of launching a utility per task removes the new query process and
          its parameters, leaving analytics that match reg.exe or new interpreter arguments without their expected trigger.
          This capability and its read primitive form a causal chain supporting medium-confidence Behavioral Transparency.
          It neither makes every API call evasive nor establishes bypass of Registry auditing or memory inspection.
    evidence_keys:
    - B016-T1057-REF-BOF
    - B016-T1012-REF-COMMANDS
    - B016-T1012-REF-CSREG
    - REF-000379
    confidence: medium
  - mechanism_ref: NM-FD
    role: secondary
    summary:
      zh: 借用原生只读配置查询形式，使局部行为接近正常管理活动
      en: Borrow native read-only configuration-query forms so local behavior resembles ordinary administration
    analysis:
      paragraphs:
      - zh: 恶意操作者使用主机已有的 reg query 及正常身份执行配置读取时，不需要为该操作引入专有查询程序，目标侧看到的是同样服务于合法管理的工具和读取形式。联合公告记录该工具使用，Microsoft 对同一主体的调查说明其有意依靠就地取材维持隐蔽；两者结合支持本父级的外观近似推断。该结论限于降低单事件可区分性，不能把该主体的一般隐蔽目标变成每次
          Registry 查询成功规避检测的证明。
        en: An operator using the host's reg query under an ordinary identity need not introduce a bespoke query program.
          The target sees a utility and read form also used for legitimate management. The joint advisory records the utility
          use, while Microsoft's investigation of the same actor describes deliberate reliance on living off the land for
          stealth. Together they support an inference of similar appearance at this parent level. The conclusion concerns
          weaker discrimination of one event, not proof that each Registry query successfully evaded detection.
    evidence_keys:
    - REF-000025
    - REF-000073
    - B016-T1012-REF-REGQUERY
    confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
      - zh: 本次分类以是否有意省去每任务新查询执行器为稳定变量，提出进程内注册表查询。它改变命令进程痕迹的存在性，并要求防守方直接观察 Registry 读取及其真实进程实例。普通命令调用保留在父级，不因工具名而另设兄弟项；hive、产品、字段类别、位数及本地或远程位置也不是匿迹分类。低频查询、特殊视图和离线副本仍须有各自的有意设计与观察差证明，不能并入已成立子项。
        en: This taxonomy uses deliberate omission of a new query executor per task as its stable variable and proposes In-Process
          Registry Query. It changes whether command-process traces exist and requires direct observation of Registry reads
          and the true process instance. Ordinary command invocation stays at the parent without tool-named siblings. Hives,
          products, field categories, architectures, and local or remote locations do not define stealth categories. Low-frequency
          queries, special views, and offline copies require their own evidence of deliberate design and observation change
          rather than being absorbed into the established child.
    subtechnique_keys:
    - B016-T1012-CHILD-INPROCESS
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B016-T1012-DET-QUERY
      - B016-T1012-DET-INPROCESS
