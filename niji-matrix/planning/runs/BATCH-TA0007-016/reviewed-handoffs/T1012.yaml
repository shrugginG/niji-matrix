  limitations:
    paragraphs:
    - zh: CISA 页面及 PDF 直抓本次返回 403；公开搜索索引提供同一官方 PDF 第12页 Discovery 中 reg query/reg save 的原文条目，足以定位窄事实，未据此添加路径、输出或隐蔽效果。REF-000025
        已有身份应复用并扩 locator，不能因抓取困难新建同文档。ATT&CK 固定版本网页本次也未抓到，基线仅使用本批已保存记录；在线文档用于实现来源，不用于迁移 19.1。
      en: Direct CISA page and PDF retrieval returned 403 during this research. Public search indexing exposed the same official
        PDF's reg query/reg save entry in Discovery on page 12, supporting that narrow locator without adding paths, output,
        or evasion effects. Reuse REF-000025 and extend its locator rather than duplicate the document because retrieval was
        difficult. The fixed-version ATT&CK webpage was also unavailable; the batch's saved record alone supplies the baseline.
        Online documentation supplies implementation sources rather than a migration from 19.1.
    - zh: 当前工作区不能进行 Windows 实测。NJA 的时间窗口、角色基线和异常规则是可实施的工程建议，所有预期字段已限制到原生合同或明确额外部署并验证的采集；不能声称已完成本地命中验证。后续主 Agent 的联合语义审查、正式对象分配、Schema、质量、Bundle
        和双语 Web 门禁仍未由研究交接代替。
      en: Windows experiments are unavailable in this workspace. NJA windows, role baselines, and anomaly rules are implementable
        engineering proposals, with expected fields limited to native contracts or explicitly additional, validated collection.
        No local detection test is claimed. Primary convergence, canonical allocation, schema, quality, bundle, and bilingual
        Web gates remain required beyond the research handoff.
