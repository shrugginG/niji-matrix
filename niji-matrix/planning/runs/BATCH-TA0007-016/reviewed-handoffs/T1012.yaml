    rationale:
      zh: 选择单值或少量分支只证明查询范围，未证明有意跨时间或来源稀释完整调查。
      en: Selecting values or few branches establishes scope rather than deliberate temporal or source dispersion of an investigation.
  - mechanism_ref: NM-DO
