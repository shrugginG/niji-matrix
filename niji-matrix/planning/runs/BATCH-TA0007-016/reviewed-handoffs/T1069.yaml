      evidence_mode: strongly-inferred
      capability_observed: Author explicitly describes the stealth choice and contrasting collection paths.
      malicious_field_use_observed: false
      measured_evasion_observed: false
      causal_chain:
        attacker_choice: Read central group policy mapping instead of host-local membership for the selected collection step.
        prerequisite: Read access to policy directory and template plus enough mapping information.
        trace_change: No per-member-host local-group call for that step; directory and policy-file access remains.
        defender_observation: Member-host local group sensors lack this acquisition; DC file/directory and source context
          become necessary.
        stealth_effect: A host-only detector can miss the relationship survey; not a claim of measured universal evasion.
        boundary_and_defense: Distinguish configuration inference from current state; observe targeted SYSVOL ReadData with
          source-session and job context.
    unsupported_or_deferred:
    - Complete returned ComRAT member lists and effective authorizations.
    - Malicious field use of policy substitution or measured alert reduction.
    - TokenGroups local read as an intentional separate group-discovery evasion child.
    - Uniform read visibility across LDAP, SAM, Graph and every cloud provider.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 对照实际 NJT-0001 分开回答定义、关系视图层级、正常外观、目标与中央观察差、边界、攻击前提、防守数据语义和证据强度；父子不是按字数配额扩写。每个防御分析有独立原生数据与正常反例，策略替代有直接子项防御。
      en: The actual NJT-0001 was used to separate definition, relationship-view levels, ordinary appearance, host-versus-central
        observation, scope, attacker prerequisites, defender data semantics, and evidence strength without a word-count quota.
        Each analytic has its own native data and benign counterexamples, and policy substitution has directly applicable
        child defenses.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - catalog-inspection
    - yaml-serialization-and-shape-check
  limitations:
    paragraphs:
    - zh: 研究以固定 19.1 本地工作簿为范围，以官方接口与审核文档及 ESET 一手观察为证据；未在任何真实租户或主机执行采集、读取或验证。所有新对象仍须主 Agent 核查来源身份、跨候选边界、规范投影与质量验收。
      en: Scope comes from the fixed 19.1 local workbook, and evidence comes from official API and audit documentation plus
        firsthand ESET observations. No collection, read, or validation was performed against a live tenant or host. The primary
        agent must still review source identity, cross-candidate boundaries, canonical projection, and quality acceptance
        for every proposed object.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
