  research:
    limitations:
      paragraphs:
      - zh: ComRAT 的组命令是实际恶意父行为证据，未公开完整输出、每次查询权限或对具体后继访问的因果链。策略替代有作者明确的匿迹能力说明及接口路径对照，但没有本轮可验证的恶意现场采用案例和测量结果；因此该子项及观察面推论保持中等置信，不能借用
          ComRAT 的归因或总体规避动机提高其等级。
        en: ComRAT group commands are evidence of actual malicious parent behavior without published complete outputs, per-query
          rights, or a causal chain to particular subsequent access. Policy substitution has an explicit author-described
          stealth capability and interface-path comparison, but this review has no verified malicious field-use case or measurements.
          The child and observation-plane inference therefore remain medium-confidence and must not inherit ComRAT attribution
          or general evasion intent to increase their strength.
      - zh: 组配置、嵌套结果、动态成员、令牌组状态与资源授权有不同时间和执行边界；任何单一视图都可能遗漏关系或错误暗示已生效。检测窗口和基线是工程建议，尚未在实际 Windows 域、Graph 租户或 AWS 账户验证。审计文档只说明配置后可得的事件语义，不能证明部署已收齐全部读取，缺少事件也不能证明已发生路径替代。
        en: Group configuration, nested results, dynamic membership, token group state, and resource authorization have different
          temporal and execution boundaries; a single view can omit relationships or wrongly suggest applied state. Analytic
          windows and baselines are engineering proposals not validated in a live Windows domain, Graph tenant, or AWS account.
          Audit documentation describes event semantics when configured rather than complete deployed read coverage, and missing
          events do not establish path substitution.
proposed_subtechniques:
- temporary_key: B016-T1069-CHILD-POLICY-MAPPING
  parent_key: B016-T1069-PARENT
  name:
    zh: 策略关系推导替代
    en: Policy-Relationship Inference Substitution
  summary:
    zh: 有意从中央策略推导目标组配置关系，替代逐主机成员枚举，将关键读取转移到策略服务器并接受现场准确性的损失。
    en: Deliberately infer target group-configuration relationships from central policy instead of enumerating membership
      host by host, shifting important reads to policy servers while accepting reduced accuracy about current target state.
  aliases: []
  lineage:
    attck_subtechnique_inherited: false
  definition_and_concept:
    paragraphs:
    - zh: 策略关系推导替代是攻击者为调查目标主机的组或本地管理关系，选择读取中央策略中的成员映射及应用线索，并从这些声明推导候选关系，替代对目标主机现场组状态的直接询问。所取得的是配置和适用关系推论，直接服务于权限组发现，而不是证明策略已经施行、成员当前存在或访问权限已经生效。
      en: Policy-Relationship Inference Substitution is an adversary's choice to survey target-host group or local-administration
        relationships by reading centrally declared membership mappings and application clues, then inferring candidate relationships
        instead of querying current group state on those hosts. The acquired facts are configuration and applicability inferences
        that serve Permission Groups Discovery rather than establishing policy application, present membership, or effective
        access.
    - zh: 划分变量是“用中央关系声明替代目标现场查询”，并非某个组策略文件名或某个采集工具。作者记录的 SharpHound 模式提供此变量的具体能力证据：相应本地管理采集从目标主机调用改为目录和 SYSVOL 读取。该例只支持所述采集路径，不能推广到工具的全部功能或任意云配置副本。
      en: 'The variable is substituting central relationship declarations for a query of target state, not a particular policy
        filename or collector. An author-described SharpHound mode supplies concrete capability evidence for that variable:
        the relevant local-administration collection changes from target-host calls to directory and SYSVOL reads. The example
        supports that collection path, not every tool feature or arbitrary cloud configuration copy.'
  stealth_characteristics:
    paragraphs:
    - zh: 策略关系推导替代改变的是关系调查所触达的系统和读取对象。逐主机枚举本来可能在成员主机形成调用和组读取痕迹，替代后此步骤的读取集中发生在中央目录与策略文件端；只在成员主机观察 4798、4799 或远程 SAM 访问的防守方会缺少关键调查面。
      en: Policy-Relationship Inference Substitution changes which systems and objects a relationship survey touches. Host-by-host
        enumeration can leave calls and group-read traces on member hosts; the substitute step instead reads the central directory
        and policy-file servers. A defender observing only 4798, 4799, or remote SAM access on member hosts lacks an important
        survey surface.
    - zh: 目录属性读取、策略文件 ReadData、服务器登录和采集进程仍会暴露活动，正常策略处理又是强烈的同形反例。替代只在中央策略含有足够关系信息时有用；未受该策略管理的组、本地手工变更、未应用或筛选掉的策略会使推论不完整。减少直接主机接触并不能证明检测完全失效。
      en: Directory-property reads, policy-file ReadData, server logons, and collector processes still expose activity, and
        ordinary policy processing is a strong benign lookalike. Substitution is useful only when central policy contains
        sufficient relationship information. Unmanaged groups, manual local changes, unapplied policy, and filtering can make
        the inference incomplete. Reduced direct host contact does not establish complete detection failure.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有意为回答目标组成员或本地管理关系而读取中央策略映射，并以此替代该范围直接主机枚举的行为。需能解释信息目标、被替代查询、中央读取和对应观察差；只看到策略文件读取或缺少成员主机事件，不足以确认本子项。一般策略清单与设置理解由
        NJT-0231 负责，相同读取若同时产生独立策略信息可另外记录。
      en: Include deliberate reads of central policy mappings to answer target membership or local-administration questions
        in place of direct host enumeration for that scope. The information objective, replaced query, central read, and observation
        difference must be explainable. A policy-file read or missing member-host events alone cannot confirm this child.
        General policy inventories and setting interpretation remain NJT-0231, and the same read can be recorded separately
        when it also produces independent policy information.
    - zh: 直接 LDAP 读取域组成员、本地令牌组状态检查和既存身份名单文件读取不因触点较少便自动纳入。修改策略以增添成员是变更行为；读取策略中的秘密是凭据取得。正常客户端策略刷新、GPMC、配置合规和授权路径审计都可能按相似顺序读目录与文件，必须用调用主体和任务语境区分，不能把常规架构差异本身认定为攻击者匿迹选择。
      en: Direct LDAP reads of domain-group membership, local-token group inspection, and reads of an existing identity-list
        file are not included merely because they use fewer contact points. Changing policy to add members is mutation; obtaining
        secrets from policy is credential access. Normal client refresh, GPMC, configuration compliance, and authorized path
        auditing can read the directory and files in similar order. Caller and task context are necessary to distinguish these
        from an adversary's deliberate substitution.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 该子项适用于已失陷的域上下文能够读取相关策略，而操作者愿意用中央配置推论筛选目标，减少对多个成员主机的直接关系查询。它可以在尚无逐机管理权或希望控制主机触点时提供有限调查价值，但策略未管理的目标及本地漂移不会自动被发现。
        en: The child applies when a compromised domain context can read relevant policy and the operator accepts central-configuration
          inferences for target selection to reduce direct relationship queries to multiple member hosts. It can provide limited
          survey value before per-host administration rights are available or when the operator wants to constrain host contacts,
          but it does not automatically reveal unmanaged targets or local drift.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者能够认证至有关目录和文件服务，读取管理组映射、策略标识及应用关系，并在采集器中选择替代路径。它不需要为此修改成员或控制域控制器，但须理解组标识和策略关联；读取权、策略适用信息不足、映射解析错误或没有相关配置都会限制结果。攻击者接受未验证现场成员的代价，不能将推论当作成功授权。
          en: The adversary can authenticate to the relevant directory and file services, read administrative-group mappings,
            policy identifiers, and application relationships, and select the substitute path in a collector. This requires
            neither membership changes nor domain-controller control, but it does require understanding identifiers and policy
            links. Limited read rights, incomplete applicability information, parsing errors, or absent configuration constrain
            results. The adversary accepts unverified current membership rather than treating an inference as successful authorization.
      defender_model:
        paragraphs:
        - zh: 匿迹判断针对主要从成员主机的本地组枚举或远程 SAM 行为识别调查的防守模型；该观察面可能完全没有本采集步骤的请求。扩展后的防守方可以在策略服务器观察经 SACL 配置的目录和文件读取，以同服务器会话连接源身份与地址，并用
            GPO 到文件路径映射区分组关系配置。服务器进程不能冒充原始采集进程，正常刷新与合法审计基线也必须保留。
          en: The stealth conclusion targets a defender model that recognizes surveys mainly through local-group enumeration
            or remote SAM on member hosts; that plane can contain no requests from this collection step. An expanded defender
            can observe SACL-configured directory and file reads on policy servers, join source identity and address within
            the same server session, and map GPOs to file paths to identify group-relationship configuration. A server process
            must not be treated as the originating collector, and baselines for normal refresh and authorized audits remain
            necessary.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 将组关系调查从目标主机查询移至中央策略读取以避开单一主机观察面
      en: Move group-relationship surveying from target-host queries to central policy reads outside a host-only observation
        plane
    analysis:
      paragraphs:
      - zh: 攻击者主动选择关系声明推导，省去该范围对每台目标主机的现场组查询，因此成员主机的本地组枚举传感器不再直接观察到这一步。痕迹转而存在于目录和策略文件服务器，防守方必须跨身份、登录与策略路径恢复调查语义。这一因果链由明确标为匿迹采集的作者能力说明、正常策略读取协议和本地组事件语义共同支持；尚无恶意现场实验，置信度保持中等且不声称日志被删除或查询结果完全相同。
        en: The adversary deliberately chooses inference from relationship declarations, omitting current-state group queries
          to each target in that scope. Local-group enumeration sensors on member hosts therefore no longer directly observe
          the step. Traces instead remain at directory and policy-file servers, requiring the defender to recover survey meaning
          across identity, logon, and policy-path context. Explicit author documentation of stealth collection, the normal
          policy-read protocol, and local-group event semantics jointly support this causal chain. Without a malicious field
          experiment, confidence remains medium and neither log deletion nor equivalent results is claimed.
    evidence_keys:
    - B016-T1069-REF-SHARPHOUND
    - REF-001213
    - B016-T1069-REF-4799
    - B016-T1069-REF-COMPASS
    confidence: medium
  defense:
    detections:
      coverage: available
      strategy_keys:
      - B016-T1069-DET-POLICY-SUBSTITUTION
    mitigations:
      coverage: available
      mitigation_keys:
      - MIT-000240
  evidence:
    claim_keys:
    - B016-T1069-CLM-CHILD
    - B016-T1069-CLM-POLICY-DETECTION
    - B016-T1069-CLM-MITIGATION
    case_keys: []
    reference_keys:
    - B016-T1069-REF-SHARPHOUND
    - B016-T1069-REF-RESTRICTED-GROUPS
    - B016-T1069-REF-4799
    - REF-001213
    - REF-001214
    - REF-001215
    - REF-000379
    - REF-000377
    - B016-T1069-REF-COMPASS
  research:
    limitations:
      paragraphs:
      - zh: 最直接证据是采集器作者对匿迹模式和替代 API 路径的说明，证明能力与设计目的，不证明任何恶意主体已采用或测得检测收益。报告发表于 2018 年，具体文件解析、策略扩展和默认采集行为可能随版本改变；实现时须核实实际采集器版本，不能只见产品名便套用该路径。
        en: The strongest evidence is the collector author's description of the stealth mode and substitute API path. It establishes
          capability and design purpose rather than malicious adoption or measured detection benefit. The publication dates
          to 2018, and file parsing, policy extensions, and default collection can vary by version. Implementations must verify
          the actual collector version rather than assign this path from the product name alone.
      - zh: 中央策略声明和现场组状态之间可能存在漂移、筛选、应用失败和时效差；仅有 GPO 链接或 ReadData 也不能确认已还原目标完整组图。所提检测只识别需调查的关系采集候选，不能从没有主机侧枚举记录自动确证替代意图。
        en: Central policy declarations can differ from current membership through drift, filtering, application failure,
          and freshness. A GPO link or ReadData event alone cannot confirm reconstruction of a complete target group graph.
          The proposed detection identifies relationship-collection candidates for investigation rather than proving substitution
          intent from absent host-side enumeration records.
defense_candidates:
  detection_strategies:
  - temporary_key: B016-T1069-DET-RELATION-READ
    name:
      zh: 组与权限关系读取的主体职责差分
      en: Actor-Duty Differential for Group and Permission Relationship Reads
    summary:
      zh: 按读取面恢复组关系调查，将主体、目标关系和批准职责比较，并保留请求、枚举与返回事实的证据区别。
      en: Recover group-relationship surveying on each read plane, compare actor and target relationships with approved duties,
        and preserve the distinction between requests, enumeration, and returned facts.
    description:
      paragraphs:
      - zh: 本策略围绕所调查的组和权限关系识别异常读取，不以发生成员变更为前提。Windows 分析处理按用户或按组的本地成员枚举，目录分析处理经配置的组属性读取，Graph 与 AWS IAM 分析处理各自可见的关系接口请求。四项分析分别满足其数据前提即可运行，不能要求一次调查同时具有全部平台日志。
        en: This strategy identifies abnormal reads by the group and permission relationships surveyed without requiring a
          membership change. The Windows analytic handles per-user or per-group local enumeration, the directory analytic
          handles configured group-property auditing, and Graph and AWS IAM analytics handle their respective visible relationship-interface
          requests. Each runs independently when its own data prerequisites are met; one survey need not have logs from every
          platform.
      - zh: 单个正常接口命中仅形成关系调查候选；优先级来自高价值目标、来源或职责变化及缺少匹配的有效任务。枚举事件与请求成功不提供完整成员图，角色或组名也不证明访问权已生效。端点进程、目录对象与云调用主体应按各自标识边界关联，避免把服务器进程和跨机登录标识混为原始操作者。
        en: A normal-interface match alone produces a relationship-survey candidate; priority comes from valuable targets,
          changes in origin or duty, and missing matching authorized work. Enumeration events and successful requests do not
          supply a complete member graph, while a role or group name does not prove effective access. Join endpoint processes,
          directory objects, and cloud callers within their own identifier boundaries rather than treating server processes
          or cross-host logon identifiers as the original operator.
    detects_keys:
    - B016-T1069-PARENT
    domains:
    - enterprise
    analytic_keys:
    - B016-T1069-NJA-LOCAL
    - B016-T1069-NJA-DIRECTORY
    - B016-T1069-NJA-GRAPH
    - B016-T1069-NJA-IAM
    evidence_keys:
    - B016-T1069-REF-4798
    - B016-T1069-REF-4799
    - REF-000334
    - REF-000623
    - REF-001214
    - REF-000377
    - B016-T1069-REF-MEMBEROF
    - REF-000833
    - B016-T1069-REF-GRAPH-MEMBERS
    - B016-T1069-REF-GRAPH-TRANSITIVE
    - B016-T1069-REF-GRAPH-ROLES
    - B016-T1069-REF-IAM-GROUPS
    - B016-T1069-REF-IAM-CLOUDTRAIL
    - REF-000523
    - REF-000524
  - temporary_key: B016-T1069-DET-POLICY-SUBSTITUTION
    name:
      zh: 中央组映射读取与策略处理语境差分
      en: Central Group-Mapping Reads and Policy-Processing Context Differential
    summary:
      zh: 在策略服务器识别组关系配置的异常读取，恢复只监测成员主机枚举时缺失的关系调查面。
      en: Identify abnormal reads of group-relationship configuration on policy servers to restore the survey surface missing
        from member-host-only enumeration monitoring.
    description:
      paragraphs:
      - zh: 本策略直接覆盖策略关系推导替代，观察对象是承载组映射的实际策略文件及其目录关联。通过已验证文件访问审核识别读取，再以同服务器登录、来源和正常策略处理或治理任务解释它；不以目标成员主机必须出现枚举事件为条件，也不以没有该事件便自动确认规避。
        en: This strategy directly covers policy-relationship inference substitution and observes actual policy files carrying
          group mappings plus their directory associations. Validated file auditing identifies reads, which are interpreted
          through same-server logons, origin, and normal policy-processing or governance work. It neither requires enumeration
          events on target member hosts nor treats their absence as automatic proof of evasion.
      - zh: 检测输出分为文件读取事实与需调查的关系采集候选，二者不等同于已恢复完整关系图。中央策略权限调整仍由已有策略读取治理缓解措施负责，成员主机读取与中央读取的差异则需要此专门分析，不能仅扩展一般 GPO 清单检测的主体引用。
        en: Outputs distinguish file-read facts from relationship-collection candidates requiring investigation; neither is
          equivalent to recovery of a complete relationship graph. Existing policy-read governance supplies the relevant mitigation,
          while the difference between member-host and central reads requires this dedicated analytic rather than simply extending
          the subjects of generic GPO-inventory detection.
    detects_keys:
    - B016-T1069-CHILD-POLICY-MAPPING
    domains:
    - enterprise
    analytic_keys:
    - B016-T1069-NJA-POLICY
    evidence_keys:
    - B016-T1069-REF-SHARPHOUND
    - REF-001213
    - REF-000379
    - REF-000377
    - REF-001214
    - B016-T1069-REF-RESTRICTED-GROUPS
    - B016-T1069-REF-COMPASS
  detection_analytics:
  - temporary_key: B016-T1069-NJA-LOCAL
    strategy_key: B016-T1069-DET-RELATION-READ
    name:
      zh: 本地组枚举调用方与敏感关系范围关联
      en: Local Group Enumeration Caller and Sensitive Relationship Scope Correlation
    summary:
      zh: 区分 4798 与 4799 的查询方向，以调用方、敏感目标和批准任务识别本地组关系调查。
      en: Distinguish the query directions of 4798 and 4799 and identify local group-relationship surveying through callers,
        sensitive targets, and approved work.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在启用 Audit User Account Management 与 Audit Security Group Management 成功审核并验证系统版本后，分别选择 4798 与 4799。前者的 TargetSid
          表示被查询用户，后者表示被枚举本地组；保留 query_direction，不混合成同一种目标。将 SubjectUserSid、SubjectLogonId、CallerProcessId、CallerProcessName
          和目标 SID 规范化；CallerProcessId 是十六进制指针，必须按值解析而非同字符串十进制 PID 直接相等。
        en: After enabling successful Audit User Account Management and Audit Security Group Management and validating OS
          support, select 4798 and 4799 separately. TargetSid identifies the queried user in the former and the enumerated
          local group in the latter; retain query_direction rather than treating both as the same target. Normalize SubjectUserSid,
          SubjectLogonId, CallerProcessId, CallerProcessName, and target SID. Parse CallerProcessId as a hexadecimal pointer
          value rather than comparing its text with a decimal PID.
      - zh: 在同一设备十五分钟内，以主体、登录标识和调用方聚合所查询的不同用户或组，将高价值 SID、非常规调用路径或来源与批准权限审查任务比较。没有匹配 owner、目标范围和有效时间的任务时输出 group_enumeration_observed
          并提高调查优先级；单次敏感组枚举也保留，不要求达到统一计数。事件证明枚举操作，不能推断返回了全部成员或已经访问成员拥有的资源。
        en: Over fifteen minutes on the same device, group distinct queried users or groups by actor, logon identifier, and
          caller, and compare valuable SIDs and unusual caller paths or origins with approved access-review work. If no task
          matches owner, target scope, and validity interval, emit group_enumeration_observed and prioritize investigation.
          Retain single sensitive-group enumerations without a universal count requirement. The event establishes enumeration,
          not complete returned members or access to resources held by those members.
      - zh: 若启用进程补充分支，将同机 4688 的 NewProcessId 按生存期与调用 PID 连接，保留创建时间、创建者与命令行；命令行需要单独策略。缺少可消歧的进程创建时仅保留事件自带调用方，不跨重用 PID 或跨设备推断进程谱系。调用方是服务器服务进程时，它不等于远端客户端原始进程。
        en: If the process-enrichment branch is enabled, join same-host 4688 NewProcessId to the caller PID within the process
          lifetime and retain creation time, creator, and command line; command-line auditing requires a separate policy.
          Without a disambiguating process-creation event, retain only the caller in the enumeration record rather than infer
          lineage across reused PIDs or devices. A server-service caller is not the originating remote-client process.
    data_requirements:
    - source_type: windows-local-group-read
      name:
        zh: 已启用相应审核的本地组枚举事件
        en: Local group enumeration events with applicable auditing enabled
      channel: Security event 4798 and 4799
      required_fields:
      - timestamp
      - computer
      - event_id
      - subject_user_sid
      - subject_logon_id
      - target_sid
      - target_user_name
      - caller_process_id
      - caller_process_name
    - source_type: authorized-relationship-review
      name:
        zh: 已批准组关系审查任务清单
        en: Approved group-relationship review inventory
      channel: Identity governance and support work inventory
      required_fields:
      - job_id
      - owner
      - actor
      - source_scope
      - target_scope
      - valid_from
      - valid_to
    - source_type: windows-process-enrichment
      name:
        zh: 仅启用进程补充分支时的进程创建与命令行
        en: Process creation and command line only when process enrichment is enabled
      channel: Security event 4688 with process auditing and separately enabled command line
      required_fields:
      - timestamp
      - computer
      - new_process_id
      - new_process_name
      - creator_process_id
      - subject_user_sid
      - command_line
    observables:
    - zh: 4798 的按用户查询与 4799 的按本地组查询具有不同目标语义
      en: Per-user queries in 4798 and per-local-group queries in 4799 have different target semantics
    - zh: 非批准调用方触及高价值 SID 或超出任务范围
      en: Unapproved callers reach valuable SIDs or exceed approved scope
    correlation:
      window:
        zh: 以十五分钟调用窗口及三十日职责基线起步，按设备工作负载验证；进程 PID 关联必须限制于同机已验证生存期。
        en: Start with a fifteen-minute call window and thirty-day duty baseline and validate by device workload; PID joins
          must remain within a verified same-host process lifetime.
      dimensions:
      - computer
      - subject_user_sid
      - subject_logon_id
      - caller_process_id
      - target_sid
      - query_direction
    false_positives:
    - zh: 计算机管理、帮助台、备份代理、安装程序和访问审查均可能枚举相同本地组；需核查实际服务 owner 与工单范围。
      en: Computer Management, help desks, backup agents, installers, and access reviews can enumerate the same local groups;
        verify the actual service owner and ticket scope.
    blind_spots:
    - zh: 审核未启用、旧系统、不产生此事件的目录接口、已有令牌读取和策略关系替代可能无相应事件；不能用本分析涵盖 Linux、macOS、LDAP 或云读取。
      en: Disabled auditing, older systems, directory interfaces that do not generate these events, existing-token reads,
        and policy substitution can lack these records. This analytic does not cover Linux, macOS, LDAP, or cloud reads.
    tuning_guidance:
      paragraphs:
      - zh: 先以已知本地用户和组验证两种方向、十六进制 PID 以及审核策略，使用稳定 SID 避免本地化组名误匹配。例外绑定身份、服务或脚本、设备范围和有效时间，不因路径位于 System32 就永久放行。参数与进程补充分支分别测试，记录不可用状态而不伪造输出。
        en: Validate both directions, hexadecimal PIDs, and audit policies using known local users and groups, and use stable
          SIDs to avoid localized-name mismatches. Bind exceptions to identity, service or script, device scope, and expiry
          rather than permanently allowing System32 paths. Test command and process enrichment separately and record unavailability
          without fabricating results.
    evidence_keys:
    - B016-T1069-REF-4798
    - B016-T1069-REF-4799
    - REF-000334
    - REF-000623
  - temporary_key: B016-T1069-NJA-DIRECTORY
    strategy_key: B016-T1069-DET-RELATION-READ
    name:
      zh: 经验证的目录成员属性读取与主体范围差分
      en: Validated Directory Membership-Property Reads and Actor Scope Differential
    summary:
      zh: 在匹配 SACL 的目录读取中恢复关系对象与属性范围，并与职责和服务器登录来源比较。
      en: Recover relationship objects and property scope in SACL-matched directory reads and compare them with duty and server-logon
        origins.
    domains:
    - enterprise
    platforms:
    - Windows
    - Active Directory
    logic:
      paragraphs:
      - zh: 在选定敏感组及相关主体对象上配置 Audit Directory Service Access 和针对需要观察属性的读取 SACL，先验证正常和测试查询确实产生所需 4662。选择 ObjectServer 为 DS 且
          AccessMask 含 0x10 Read Property 的成功事件，以部署目录的对象 GUID 与 schema/property-set GUID 映射解析 ObjectType、ObjectName 和 Properties；优先核查
          member、memberOf 与已验证的对应属性集。若映射只到宽属性集或无法确定成员属性，将输出降为 directory_object_read，不能伪称 membership_read。
        en: Configure Audit Directory Service Access and property-specific read SACLs on selected sensitive groups and relevant
          principal objects, then verify that normal and test queries produce the required 4662 records. Select successful
          records with ObjectServer DS and AccessMask containing 0x10 Read Property. Resolve ObjectType, ObjectName, and Properties
          using the deployed directory's object and schema or property-set GUID mappings, focusing on member, memberOf, and
          their validated property sets. If a mapping resolves only to a broad set or cannot identify membership properties,
          downgrade the output to directory_object_read rather than falsely label membership_read.
      - zh: 按同一域控制器和 SubjectLogonId 连接 4624 的目标登录标识，保留主体、登录类型与源地址；源字段缺失时维持来源未知。十五分钟内比较敏感关系覆盖、主体职责和批准任务，标记不匹配来源或超范围读取。结果只说明受审计属性访问与关系调查候选，不包括完整
          LDAP 谓词、返回值或递归授权路径；主组与 memberOf 的表示例外须保留。
        en: Join 4624 target logon identifiers by the same domain controller and SubjectLogonId, retaining principal, logon
          type, and source address; missing source fields remain unknown. Over fifteen minutes, compare sensitive relationship
          coverage, actor duties, and approved work and flag unmatched origins or excess scope. Results describe audited property
          access and relationship-survey candidates, not full LDAP predicates, returned values, or recursive authorization
          paths. Preserve the primary-group representation exception for memberOf.
    data_requirements:
    - source_type: ad-property-read-audit
      name:
        zh: 已验证成员属性读取 SACL 的目录对象事件
        en: Directory object events with validated membership-property read SACLs
      channel: Domain controller Security event 4662
      required_fields:
      - timestamp
      - computer
      - subject_user_sid
      - subject_logon_id
      - object_server
      - object_type
      - object_name
      - access_mask
      - properties
    - source_type: server-logon-context
      name:
        zh: 同一域控制器登录会话
        en: Logon sessions on the same domain controller
      channel: Security event 4624
      required_fields:
      - timestamp
      - computer
      - target_user_sid
      - target_logon_id
      - logon_type
      - ip_address
    - source_type: directory-schema-and-review-inventory
      name:
        zh: 部署目录 GUID 映射与批准读取范围
        en: Deployed directory GUID mappings and approved read scope
      channel: Read-only directory inventory and identity governance
      required_fields:
      - object_guid
      - object_dn
      - object_class
      - attribute_or_property_set_guid
      - mapped_attribute_scope
      - sensitivity
      - approved_actor
      - valid_from
      - valid_to
    observables:
    - zh: 对已映射成员属性的 Read Property 使用
      en: Read Property use against mapped membership attributes
    - zh: 主体与目标范围不符或来自非常规登录源
      en: Actor-to-target scope mismatch or an unusual logon origin
    correlation:
      window:
        zh: 初始使用十五分钟读取窗口与三十日职责基线，同服务器登录连接受会话生存期约束；GUID 清单应保留对应时间版本。
        en: Begin with a fifteen-minute read window and thirty-day duty baseline; same-server logon joins are bounded by session
          lifetime, and GUID inventories retain the relevant historical version.
      dimensions:
      - computer
      - subject_user_sid
      - subject_logon_id
      - object_name
      - mapped_attribute_scope
      - ip_address
    false_positives:
    - zh: 身份同步、授权评估、目录治理、备份和响应调查会广泛读取成员属性；按实际服务职责与范围核验而非单纯查询数量放行。
      en: Identity synchronization, authorization evaluation, directory governance, backup, and response investigations can
        read membership properties broadly; verify actual service duties and scope rather than allowing activity solely by
        volume.
    blind_spots:
    - zh: 无匹配 SACL、属性集映射过宽、日志丢失或未验证的计算属性审核会降低覆盖；事件不提供客户端原始进程、全部返回关系或未读取关系的否定证明。
      en: Missing SACLs, overly broad property-set mappings, lost records, or unvalidated auditing of computed attributes
        limit coverage. Events do not provide the original client process, all returned relationships, or proof that unobserved
        relationships were not read.
    tuning_guidance:
      paragraphs:
      - zh: 先选少量高价值组与主体，用实际事件确认 SACL、属性 GUID、属性集和 0x10 语义；监测 DC 容量再扩大。不要把所有 4662 都解释为组读取，也不要用 4728/4732/4756 替代。批准任务需限定源、身份、关系范围和有效期，密集同步的例外仍应保存原始命中以调查身份失陷。
        en: Start with a few valuable groups and principals and verify SACLs, attribute GUIDs, property sets, and 0x10 semantics
          in actual records before expanding within DC capacity. Do not treat every 4662 as a group read or substitute 4728,
          4732, or 4756. Authorized work must bind origin, identity, relationship scope, and expiry; retain raw matches for
          high-volume synchronization exceptions to investigate compromised identities.
    evidence_keys:
    - REF-001214
    - REF-000377
    - B016-T1069-REF-MEMBEROF
  - temporary_key: B016-T1069-NJA-GRAPH
    strategy_key: B016-T1069-DET-RELATION-READ
    name:
      zh: Graph 成员与目录角色关系请求语义关联
      en: Graph Membership and Directory Role Relationship Request Correlation
    summary:
      zh: 将 Graph 关系读取路径、应用或用户与批准作业比较，并区分直接、传递和角色分配请求。
      en: Compare Graph relationship-read paths and application or user identities with approved jobs while distinguishing
        direct, transitive, and role-assignment requests.
    domains:
    - enterprise
    platforms:
    - Microsoft Entra ID
    - Office 365
    logic:
      paragraphs:
      - zh: 先确认许可、诊断导出、表接收与保留已启用，再从 MicrosoftGraphActivityLogs 解析 RequestMethod 为 GET 的 RequestUri。按 /groups/{id}/members、/groups/{id}/transitiveMembers
          和 /roleManagement/directory/roleAssignments 的路径与类型筛选规范化关系种类，保留 $filter、$select、$expand 与分页请求的原始 URI。单纯 /users 名单查询不作为此分析命中，未解析的路径保留未知类型而不靠组名猜测。
        en: First verify licensing, diagnostic export, ingestion, and retention, then parse RequestUri for GET records in
          MicrosoftGraphActivityLogs. Normalize relationship kind from /groups/{id}/members, /groups/{id}/transitiveMembers,
          and /roleManagement/directory/roleAssignments, retaining raw URIs including $filter, $select, $expand, and paging
          requests. Plain /users lists do not match this analytic, and unparsed paths retain unknown kind rather than relying
          on group-name guesses.
      - zh: 按 AadTenantId、UserId 或 ServicePrincipalId、AppId 和可用 SessionId 聚合二十分钟请求，并用 RequestId 去重、OperationId 保留批次联系，避免重复计数。将敏感组或角色目标、应用首次出现、来源变化和批准治理作业比较。2xx
          记录标为 relationship_request_succeeded，拒绝记录为 relationship_request_denied，两者分别保留；成功不证明完整返回或有效授权，日志中的 Roles/Scopes 也不能被误当作目标组的返回成员列表。
        en: Aggregate twenty-minute requests by AadTenantId, UserId or ServicePrincipalId, AppId, and available SessionId.
          Deduplicate by RequestId and retain OperationId batch linkage to avoid double counting. Compare sensitive group
          or role targets, newly seen applications, origin changes, and authorized governance work. Mark 2xx records relationship_request_succeeded
          and denied records relationship_request_denied and retain both separately. Success does not prove complete returned
          data or effective authorization, and Roles or Scopes in the log must not be mistaken for the target group's returned
          member list.
    data_requirements:
    - source_type: graph-relationship-request
      name:
        zh: 已配置并已接收的 Graph 活动请求
        en: Configured and ingested Graph activity requests
      channel: Azure Monitor MicrosoftGraphActivityLogs
      required_fields:
      - time_generated
      - aad_tenant_id
      - request_id
      - operation_id
      - request_method
      - request_uri
      - response_status_code
      - app_id
      - user_id
      - service_principal_id
      - session_id
      - ip_address
    - source_type: approved-cloud-relationship-job
      name:
        zh: Graph 应用与敏感关系作业清单
        en: Graph application and sensitive-relationship work inventory
      channel: Application governance and access review inventory
      required_fields:
      - tenant_id
      - app_id
      - principal_id
      - allowed_relationship_scope
      - source_scope
      - job_id
      - valid_from
      - valid_to
    observables:
    - zh: 直接成员、传递成员或目录角色分配的 GET 请求路径
      en: GET request paths for direct members, transitive members, or directory role assignments
    - zh: 应用、调用主体或来源与关系范围的批准基线不符
      en: Application, caller, or origin differs from the approved baseline for the relationship scope
    correlation:
      window:
        zh: 初始以二十分钟分页与请求序列关联及三十日应用职责基线运作，按批次语义和导出延迟验证；这是设计参数而非来源证实阈值。
        en: Start with a twenty-minute paging and request-sequence window and thirty-day application-duty baseline, validating
          batch semantics and export delay; these are design parameters rather than source-established thresholds.
      dimensions:
      - aad_tenant_id
      - user_id
      - service_principal_id
      - app_id
      - session_id
      - request_id
      - operation_id
      - relationship_kind
    false_positives:
    - zh: 权限审查、Teams 或组同步、身份治理和目录管理门户可能发出相同请求；委派与应用身份应分别建立有效期基线。
      en: Access reviews, Teams or group synchronization, identity governance, and directory administration portals can issue
        the same requests; baseline delegated and application identities separately with expiry.
    blind_spots:
    - zh: 缺少 P1/P2、诊断导出或接收时本分析不可运行；旧接口、其他云 API、离线副本和未解析批请求不保证覆盖。2xx 与响应大小不揭示成员完整性，隐藏成员、分页和索引时效须另核查。
      en: The analytic cannot run without P1/P2, diagnostic export, or ingestion. Legacy interfaces, other cloud APIs, offline
        copies, and unparsed batch requests are not guaranteed coverage. A 2xx response or response size does not reveal membership
        completeness; hidden members, paging, and index freshness require separate verification.
    tuning_guidance:
      paragraphs:
      - zh: 验证实际表中每个字段和空值规则，UserId 与 ServicePrincipalId 允许按调用类型为空，不能将空用户过滤掉全部应用身份。例外绑定应用 owner、权限、主体、目标组或角色范围和期限；按 RequestId
          去重但保留不同分页，不用永久 UserAgent 白名单消除覆盖。
        en: Verify every field and null rule in the deployed table; UserId and ServicePrincipalId can be empty according to
          caller type, so filtering empty users must not discard all application identities. Bind exceptions to application
          owner, permissions, principal, group or role scope, and expiry. Deduplicate RequestId while retaining distinct pages,
          and do not remove coverage through a permanent UserAgent allowlist.
    evidence_keys:
    - REF-000833
    - B016-T1069-REF-GRAPH-MEMBERS
    - B016-T1069-REF-GRAPH-TRANSITIVE
    - B016-T1069-REF-GRAPH-ROLES
  - temporary_key: B016-T1069-NJA-IAM
    strategy_key: B016-T1069-DET-RELATION-READ
    name:
      zh: IAM 组关系读取与调用会话范围差分
      en: IAM Group Relationship Reads and Calling-Session Scope Differential
    summary:
      zh: 将 IAM 列组、列组用户和列用户组请求连接到实际调用会话及批准任务。
      en: Join IAM group-list, group-user, and user-group requests to their actual calling session and authorized work.
    domains:
    - enterprise
    platforms:
    - AWS
    logic:
      paragraphs:
      - zh: 验证组织或账户日志覆盖和读管理事件保留后，选择 eventSource 为 iam.amazonaws.com 且 eventName 为 ListGroups、GetGroup 或 ListGroupsForUser
          的记录，分别标记组清单、组到用户与用户到组方向。解析 requestParameters.groupName、userName 和 marker，若 API 不含某字段则保留为空；不从缺失参数推断整个账户均被读取。eventID
          去重，保留 readOnly、errorCode 与 userIdentity 原始结构。
        en: After verifying organization or account logging coverage and retention of read management events, select iam.amazonaws.com
          records whose eventName is ListGroups, GetGroup, or ListGroupsForUser, labeling group inventory, group-to-user,
          and user-to-group directions separately. Parse requestParameters.groupName, userName, and marker, retaining absent
          API-specific fields as null rather than inferring that the whole account was read. Deduplicate eventID and retain
          readOnly, errorCode, and raw userIdentity.
      - zh: 在二十分钟内以 recipientAccountId、调用 ARN、principalId 或 accessKeyId 与会话上下文归组，并与身份治理作业的来源、角色和关系范围比较。调用身份是 assumed role
          时保留 sessionIssuer 和角色会话，不能仅按角色名把多个会话合成一个操作者。错误请求与无错误请求分别输出 relationship_request_denied 或 relationship_request_observed；不要求
          responseElements 提供成员，不能把无错误等同完整组图或任何资源的授权成功。
        en: Over twenty minutes, group by recipientAccountId, caller ARN, principalId or accessKeyId, and session context,
          comparing origin, role, and relationship scope with identity-governance jobs. For assumed-role callers, retain sessionIssuer
          and the role session instead of merging multiple sessions into one operator by role name alone. Separate failed
          from non-error requests as relationship_request_denied or relationship_request_observed. Do not require member data
          in responseElements or equate absence of error with a complete group graph or authorized access to a resource.
    data_requirements:
    - source_type: cloudtrail-iam-group-read
      name:
        zh: 已保留读管理事件的 IAM CloudTrail
        en: IAM CloudTrail with read management events retained
      channel: CloudTrail management event delivery or validated event history collection
      required_fields:
      - event_time
      - event_id
      - event_source
      - event_name
      - recipient_account_id
      - aws_region
      - user_identity
      - request_parameters
      - source_ip_address
      - read_only
      - error_code
    - source_type: iam-review-task-inventory
      name:
        zh: 账户级 IAM 审查任务与会话范围
        en: Account-scoped IAM review tasks and session scope
      channel: IAM governance work inventory
      required_fields:
      - account_id
      - approved_principal
      - source_scope
      - relationship_scope
      - owner
      - job_id
      - valid_from
      - valid_to
    observables:
    - zh: 同一会话围绕敏感组或用户发出的方向不同的 IAM 关系读取
      en: IAM relationship reads in different directions around sensitive groups or users by the same session
    - zh: 请求与批准角色、来源或审查范围不符
      en: Requests inconsistent with approved role, origin, or review scope
    correlation:
      window:
        zh: 使用二十分钟请求序列和三十日角色职责基线作为起点，并保留分页连续性与延迟到达记录，按账户规模验证。
        en: Start with a twenty-minute request sequence and thirty-day role-duty baseline, retaining paging continuity and
          delayed records and validating against account size.
      dimensions:
      - recipient_account_id
      - user_identity.arn
      - user_identity.principal_id
      - user_identity.access_key_id
      - source_ip_address
      - event_name
      - relationship_scope
    false_positives:
    - zh: 合规清点、权限审查、云管理控制台和基础设施治理工具会读取这些关系，应按具体作业范围核实。
      en: Compliance inventories, access reviews, cloud consoles, and infrastructure-governance tools read these relationships
        and require job-specific scope verification.
    blind_spots:
    - zh: 不保留读管理事件、跨账户覆盖或保留不足会缺失记录；已有副本、其他服务 ACL 和未列出的角色策略读取需要独立覆盖。本分析不复原 API 返回成员或证明实际资源权限。
      en: Omitted read management events, inadequate cross-account coverage, and insufficient retention lose records. Existing
        copies, other service ACLs, and role-policy reads outside this selector need separate coverage. This analytic reconstructs
        neither returned members nor effective resource access.
    tuning_guidance:
      paragraphs:
      - zh: 对所用收集路径验证 IAM 全局服务事件的实际到达区域和去重方式，不只监听一个假设区域。保留单次 GetGroup 对敏感组的命中，避免只设高计数阈值；例外按账户、会话发行主体、来源、关系范围和工单到期，而非长期放行整个管理员角色。
        en: Validate the actual arrival region and deduplication of global IAM events for the chosen collection path rather
          than observing one assumed region. Retain a single GetGroup match on a sensitive group rather than relying only
          on high counts. Bind exceptions to account, session issuer, origin, relationship scope, and ticket expiry instead
          of permanently allowing an entire administrative role.
      - zh: 保留原始 userIdentity，按原生 ARN、principalId 与 accessKeyId 派生规范会话键。errorCode 缺失时显式规范为 null，不能因必需键列表而丢弃成功读取；请求参数按对应 API
          允许为空，关系范围也不能由空参数推断为全量。
        en: Retain raw userIdentity and derive canonical session keys from native ARN, principalId, and accessKeyId. Normalize
          absent errorCode to null instead of dropping successful reads because of a required-key list. Parameters can be
          null according to the API, and absent parameters do not imply complete scope.
    evidence_keys:
    - B016-T1069-REF-IAM-GROUPS
    - B016-T1069-REF-IAM-CLOUDTRAIL
    - REF-000523
    - REF-000524
  - temporary_key: B016-T1069-NJA-POLICY
    strategy_key: B016-T1069-DET-POLICY-SUBSTITUTION
    name:
      zh: 策略组映射文件实际读取与同服务器来源差分
      en: Exercised Reads of Policy Group-Mapping Files and Same-Server Origin Differential
    summary:
      zh: 用组映射文件 ReadData、服务器登录与批准策略处理清单发现异常中央关系采集候选。
      en: Use ReadData on group-mapping files, server logons, and approved policy-processing inventories to identify abnormal
        central relationship-collection candidates.
    domains:
    - enterprise
    platforms:
    - Windows
    - Active Directory
    logic:
      paragraphs:
      - zh: 维护确实承载组映射的策略文件和 GPO GUID、目录关联及适用范围清单，不把 SYSVOL 中任意文件都当成组关系。为选定文件配置 ReadData SACL 和 Audit File System，先验证 4663
          中 ObjectType、ObjectName 与 AccessMask 含 0x1 ReadData 的实际使用语义。正常化路径大小写与共享到本地路径映射，区分内容读取与仅目录列举；5145 访问检查不能代替本分支的实际权限使用证据。
        en: Maintain an inventory of policy files that actually contain group mappings, with GPO GUIDs, directory links, and
          applicability scope, rather than treating every SYSVOL file as group data. Configure ReadData SACLs and Audit File
          System for selected files and validate the exercised-right semantics of 4663 ObjectType, ObjectName, and AccessMask
          containing 0x1 ReadData. Normalize path case and share-to-local mappings and distinguish content reads from directory
          listing; a 5145 authorization check cannot replace exercised-right evidence in this branch.
      - zh: 按同一策略服务器及 SubjectLogonId 连接 4624 TargetLogonId，获取主体、登录类型和可用源地址；服务器进程常为文件服务，不可当作原始采集器。二十分钟内比较读取涉及的 GPO、组映射范围和源主体与正常客户端策略处理及批准治理任务。跨越多个无关作用域或由异常主体来源读取且没有有效任务时，输出
          policy_relationship_collection_candidate，同时保留所有文件读取事实；单个高价值文件也可进入调查。
        en: Join 4624 TargetLogonId by the same policy server and SubjectLogonId to obtain principal, logon type, and available
          source address. The server process is often a file service and must not be treated as the original collector. Over
          twenty minutes, compare GPOs, group-mapping scope, and source principal with normal client policy processing and
          approved governance work. Reads across unrelated scopes or by an unusual principal and origin without valid work
          produce policy_relationship_collection_candidate while retaining all file-read facts; one high-value file can also
          warrant investigation.
      - zh: 可用的 4662 GPC 读取、客户端采集进程或结果证据可在调查中补充关联，但不是本分析假定默认存在的数据。单凭没有成员主机枚举事件不能确认替代，正常策略读取也不能证明攻击者已解析成员边；只有后续验证的采集器配置或结果才能提高对子项路径的判断。配置声明与现场成员始终标为不同事实等级。
        en: Available 4662 GPC reads, client collector processes, or result artifacts can enrich investigation but are not
          data assumed by this analytic. Missing member-host enumeration events cannot confirm substitution, and an ordinary
          policy read does not prove that an adversary parsed membership edges. Only subsequently verified collector configuration
          or results can strengthen the child-path conclusion. Keep configuration declarations and current membership at distinct
          evidence levels.
    data_requirements:
    - source_type: policy-group-mapping-read
      name:
        zh: 有 ReadData SACL 和文件系统审核的策略文件访问
        en: Policy file access with ReadData SACLs and file-system auditing
      channel: Policy server Security event 4663
      required_fields:
      - timestamp
      - computer
      - subject_user_sid
      - subject_logon_id
      - object_type
      - object_name
      - access_mask
      - process_id
      - process_name
    - source_type: policy-server-logon
      name:
        zh: 同策略服务器的登录会话
        en: Logon sessions on the same policy server
      channel: Security event 4624
      required_fields:
      - timestamp
      - computer
      - target_user_sid
      - target_logon_id
      - logon_type
      - ip_address
    - source_type: group-policy-relationship-inventory
      name:
        zh: 组映射文件、历史 GPO 关联与批准任务
        en: Group-mapping files, historical GPO links, and approved work
      channel: Configuration management and policy audit inventory
      required_fields:
      - server
      - file_path
      - gpo_guid
      - mapping_content_type
      - applicable_scope
      - approved_principal
      - approved_source
      - job_id
      - valid_from
      - valid_to
    observables:
    - zh: 指向已确认组映射文件的 ReadData 权限使用
      en: Exercised ReadData on verified group-mapping files
    - zh: 读取源与正常客户端处理或有效治理任务不符
      en: Read origin unmatched to normal client processing or valid governance work
    correlation:
      window:
        zh: 以二十分钟文件序列和三十日刷新及治理基线为工程起点；仅在同服务器会话生存期内连接登录标识，并保留当时 GPO 版本。
        en: Start with a twenty-minute file sequence and thirty-day refresh and governance baseline; join logon identifiers
          only within the same server's session lifetime and retain the contemporaneous GPO version.
      dimensions:
      - computer
      - subject_user_sid
      - subject_logon_id
      - ip_address
      - gpo_guid
      - file_path
      - applicable_scope
    false_positives:
    - zh: 正常策略刷新、GPMC、备份、合规和授权攻击路径审计会读取相同映射；应用范围不常见本身不能证明恶意。
      en: Normal policy refresh, GPMC, backup, compliance, and authorized attack-path reviews read the same mappings; uncommon
        applicability scope alone does not establish maliciousness.
    blind_spots:
    - zh: 无 SACL、文件路径映射失效、已有离线副本或其他未监测策略存储会造成遗漏；4663 不公开文件全部返回内容或解析结果，来源未知时无法可靠关联采集端。
      en: Missing SACLs, stale file-path mappings, existing offline copies, or other unmonitored policy stores create gaps.
        A 4663 record exposes neither complete returned file content nor parsing results, and unknown origins prevent reliable
        collector attribution.
    tuning_guidance:
      paragraphs:
      - zh: 按实际部署建立组映射文件清单而不是仅匹配通用文件名；用合法刷新和受控读取测试分别确认对象类型、ReadData 与源会话关联。先审计重点 GPO、核查日志容量与正常机器账户，再扩展，例外绑定来源、身份、作用域和到期任务；保留命中以调查被盗治理身份。
        en: Build the mapping-file inventory from actual deployment rather than generic filenames and test object type, ReadData,
          and source-session joins separately with normal refresh and controlled reads. Audit priority GPOs first, verify
          capacity and normal machine identities, then expand. Bind exceptions to origin, identity, scope, and expiring work
          while retaining matches to investigate stolen governance identities.
    evidence_keys:
    - B016-T1069-REF-SHARPHOUND
    - REF-001213
    - REF-000379
    - REF-000377
    - REF-001214
    - B016-T1069-REF-RESTRICTED-GROUPS
    - B016-T1069-REF-COMPASS
  mitigations:
  - temporary_key: B016-T1069-MIT-RELATION-GOVERNANCE
    name:
      zh: 组关系读取权限与调查来源治理
      en: Group Relationship Read Entitlement and Survey-Origin Governance
    summary:
      zh: 限制非必要组关系读取和远程 SAM 暴露，并为合法治理身份建立按关系范围核验的读取问责。
      en: Limit unnecessary group-relationship reads and remote SAM exposure while establishing scope-verified read accountability
        for legitimate governance identities.
    description:
      paragraphs:
      - zh: 组关系是系统运行需要的信息，控制重点是减少额外读取能力和远程调查入口，并使必要读取可以归属到 owner、来源和任务。SAMRPC 访问控制与云应用权限必须分别配置，不能把禁止成员变更或保护口令当作读取保护。该控制增加受陷身份扩大调查的成本，但不能消除所有正常可读关系。
        en: Systems need group relationships, so control focuses on excess reading capability and remote survey entry points
          while attributing necessary reads to owners, origins, and work. SAMRPC access control and cloud-application permissions
          require separate configuration; preventing membership changes or protecting passwords is not read protection. This
          control increases the cost of broader surveys by compromised identities without eliminating every legitimately readable
          relationship.
    domains:
    - enterprise
    measures:
    - key: version-aware-samrpc-scope
      name:
        zh: 按版本限制远程 SAM 调用主体
        en: Scope remote SAM callers by deployed version
      description:
        paragraphs:
        - zh: 盘点实际 Windows 版本与 DC/非 DC 角色，以 RestrictRemoteSam 审计模式核实 Exchange、身份传感器及其他必要服务后，配置允许的远程调用主体并测试业务。不要仅从旧接口文档的认证用户描述推定现有远程权限，也不要将该控制误认为
            LDAP 读取限制。
          en: Inventory deployed Windows versions and DC versus non-DC roles, use RestrictRemoteSam audit mode to verify Exchange,
            identity sensors, and other required services, then configure allowed remote callers and test operations. Do not
            infer current remote rights from old API remarks about authenticated users or treat the control as an LDAP-read
            restriction.
      control_type: exposure-reduction
    - key: cloud-relationship-read-least-privilege
      name:
        zh: 审查云关系读取权限与有效期
        en: Review cloud relationship-read permissions and expiry
      description:
        paragraphs:
        - zh: 为需要列组、成员和角色分配的应用分别登记 owner、必要关系范围与凭据有效期，使用接口支持的最低读取权限并回收过宽或过期授权。隐藏成员等额外权限按实际业务审批；Graph 应用权限、委派用户角色与 IAM 请求授权分别验证，不能假定同名只读角色提供相同隔离。
          en: Register owners, required relationship scope, and credential expiry separately for applications listing groups,
            members, and role assignments. Use the API's supported least read privilege and remove broad or expired grants.
            Approve additional capabilities such as hidden-membership reads for actual business need, and validate Graph application
            permissions, delegated-user roles, and IAM authorization independently rather than assume identical isolation
            from similarly named read-only roles.
      control_type: exposure-reduction
    - key: relationship-read-accountability
      name:
        zh: 验证关系读取审核与批准任务基线
        en: Validate relationship-read auditing and approved-work baselines
      description:
        paragraphs:
        - zh: 启用并测试所需 4798/4799 审核，对选定目录成员属性验证 SACL 与 4662，保留实际 Graph activity 和 IAM 读管理请求。把治理作业绑定身份、来源、关系范围、owner 和到期时间，监测日志缺口与容量，保持读取证据和成员变更证据分开。
          en: Enable and test the required 4798/4799 auditing, validate SACLs and 4662 for selected directory membership properties,
            and retain actual Graph activity and IAM read-management requests. Bind governance work to identity, origin, relationship
            scope, owner, and expiry; monitor log gaps and capacity while keeping read evidence separate from membership-change
            evidence.
      control_type: detective-support
    applications:
    - target_key: B016-T1069-PARENT
      use:
        paragraphs:
        - zh: 对权限组发现，先盘点实际组关系读取路径和业务必要主体，再分面收回额外远程 SAM 与云读取权，同时为高价值组的读取保留可核实来源和工单。目录和云的正常可读范围不可统一关闭，应从无 owner 的额外权限与管理来源开始整改。
          en: For Permission Groups Discovery, inventory actual relationship-read paths and necessary principals, then remove
            excess remote SAM and cloud read rights on their respective planes while preserving verifiable origins and work
            records for reads of valuable groups. Legitimately readable directory and cloud scope cannot be uniformly disabled;
            begin with ownerless excess permissions and management origins.
      expected_effect:
        paragraphs:
        - zh: 可供受陷低权身份直接远程调查的关系范围减少，借用治理身份和正常接口的异常读取更易归属。即使必须保留读取，按范围和有效任务核验也提高滥用长期只读应用或管理角色的识别能力。
          en: The relationship scope directly surveyable remotely by compromised low-privilege identities shrinks, and abnormal
            reads borrowing governance identities and ordinary interfaces become easier to attribute. Where reads must remain
            available, scope and current-work verification improve recognition of abuse of long-lived read applications or
            administrative roles.
      limitations:
        paragraphs:
        - zh: SAMRPC 限制不阻止 LDAP、本地令牌或中央策略读取，错误收紧会破坏传感器与业务；云低权限主体仍可能依法读取部分组关系。必要治理身份被盗、已有关系副本及未收集日志继续造成风险，控制不能追回已读信息或保证阻止后继访问。
          en: SAMRPC restrictions do not prevent LDAP, local-token, or central-policy reads, and overly restrictive settings
            can break sensors and operations. Low-privilege cloud principals can still legitimately read some relationships.
            Stolen necessary governance identities, existing copies, and uncollected logs remain risks, and the control cannot
            retract acquired information or guarantee prevention of later access.
    evidence_keys:
    - B016-T1069-REF-SAM-RESTRICTION
    - B016-T1069-REF-GRAPH-MEMBERS
    - B016-T1069-REF-GRAPH-ROLES
    - B016-T1069-REF-IAM-GROUPS
    - B016-T1069-REF-IAM-CLOUDTRAIL
    - B016-T1069-REF-4798
    - B016-T1069-REF-4799
    - REF-001214
    - REF-000833
  - existing_ref: MIT-000240
    resolution: extend
    measures_unchanged: true
    application_additions:
    - target_key: B016-T1069-CHILD-POLICY-MAPPING
      use:
        paragraphs:
        - zh: 对策略关系推导替代，在承载组映射的 GPO 和 SYSVOL 文件上实施已有策略读取治理措施：核查额外读取委派，保留用户与计算机策略交付所需权限，登记批准采集与审查来源，并验证针对组映射的目录或 ReadData 证据。核查聚焦关系推导所需文件及其作用域，不将普通策略刷新统一认定为调查。
          en: 'For Policy-Relationship Inference Substitution, apply existing policy-read governance to GPOs and SYSVOL files
            carrying group mappings: review excess read delegation, preserve rights required for user and computer policy
            delivery, register approved collection and review origins, and validate directory or ReadData evidence for group
            mappings. Focus on files and scope needed for relationship inference rather than treating ordinary policy refresh
            as surveying.'
      expected_effect:
        paragraphs:
        - zh: 该子项移至中央策略端的观察面获得有语义的读取与来源证据，额外策略暴露减少；只看成员主机枚举时的调查缺口可由中央读取问责弥补，但仍保留配置推论与现场关系的区别。
          en: The child's central-policy observation plane gains meaningful read and origin evidence while excess policy exposure
            decreases. Central-read accountability can address the survey gap in member-host-only monitoring while preserving
            the distinction between configuration inference and current relationships.
      limitations:
        paragraphs:
        - zh: 已受陷且需要读取策略的用户或计算机仍可推导合法可见的关系；错误删去必要读取会破坏策略应用。已有副本、未审计路径与被盗审查身份仍可被利用，审计只能证明访问层级而非解析出的完整成员图。
          en: Compromised users or computers requiring policy reads can still infer legitimately visible relationships, and
            removing necessary reads can break policy application. Existing copies, unaudited paths, and stolen review identities
            remain usable. Auditing establishes access-level facts rather than a complete parsed member graph.
    evidence_keys:
    - REF-001215
    - REF-001214
    - REF-000379
    - REF-000377
    - B016-T1069-REF-SHARPHOUND
