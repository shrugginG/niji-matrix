  field_normalization:
    windows: Native SubjectUserSid -> subject_user_sid; SubjectLogonId -> subject_logon_id; CallerProcessId -> caller_process_id;
      TargetSid -> target_sid. Hexadecimal values are parsed, not lexically compared.
    graph: Native TimeGenerated -> time_generated; AadTenantId -> aad_tenant_id; RequestId -> request_id; OperationId -> operation_id;
      RequestUri -> request_uri; ResponseStatusCode -> response_status_code; AppId/UserId/ServicePrincipalId keep documented
      null distinctions.
    aws: CloudTrail eventTime/eventID/eventSource/eventName/recipientAccountId/userIdentity/requestParameters are normalized
      to snake_case; nested raw userIdentity retained.
    schema: All source_type values are lowercase hyphenated; all required_fields and dimensions use lowercase dotted or underscored
      keys. Dynamic extracted relationship_kind/query_direction are analytic outputs, not falsely declared native log fields.
