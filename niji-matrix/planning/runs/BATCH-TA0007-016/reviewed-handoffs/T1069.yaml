research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 3
    attack_subtechnique_ids:
    - T1069.001
    - T1069.002
    - T1069.003
    represented_dimensions:
    - local-security-database
    - domain-directory
    - cloud-group-and-permission-configuration
    breadth_trigger: three-to-five
    coverage_resolutions:
    - attack_id: T1069.001
      disposition: niji-variable-candidate
      explanation:
        zh: 本地组及成员本身属父行为；直接目标枚举与中央策略关系推导替代的路径对照为原生子项提供线索，未继承本地平台分类。
        en: Local groups and memberships are parent behavior. The contrast between direct target enumeration and substitute
          central-policy mappings informs a native variable without inheriting a local-platform class.
    - attack_id: T1069.002
      disposition: parent-core
      explanation:
        zh: 域组和 LDAP 成员关系属父行为；memberOf 与 tokenGroups 的不同结果和代价需要防御区别，但不是独立匿迹轴。
        en: Domain groups and LDAP membership are parent behavior. Different memberOf and tokenGroups semantics and costs
          need defensive distinctions but do not independently define stealth axes.
    - attack_id: T1069.003
      disposition: parent-core
      explanation:
        zh: 云组、角色与权限配置读取保留在父范围，Graph 与 IAM 的权限和请求日志分别建分析，不以云平台名建立子项。
        en: Cloud groups, roles, and permission-configuration reads remain within the parent, with distinct Graph and IAM
          analytics for permissions and request logs rather than a cloud-platform child.
    candidate_stealth_axes_examined:
    - axis: relation-information-acquisition-plane
      disposition: formal-child-proposed
      child_key: B016-T1069-CHILD-POLICY-MAPPING
      evidence_keys:
      - B016-T1069-REF-SHARPHOUND
      - REF-001213
      - B016-T1069-REF-4799
      gate_result: Explicit intentional substitute mode; distinct omitted host calls and remaining central reads; direct child-specific
        audit and policy-access controls; medium capability inference; no field Case.
    - axis: token-local-membership-state-instead-of-fresh-directory-query
      disposition: evidence-deferred
      evidence_keys:
      - REF-000327
      - B016-T1069-REF-WHOAMI
      - B016-T1069-REF-TOKENGROUPS
      gate_result: Local token group information exists and differs from LDAP computed tokenGroups, but current evidence does
        not establish deliberate use as a substitute for a relationship survey or a separate defensible boundary. Not a renamed
        account-list-copy child.
    - axis: scope-or-property-projection
      disposition: not-stealth-distinct
      evidence_keys:
      - B016-T1069-REF-GRAPH-MEMBERS
      - B016-T1069-REF-GRAPH-TRANSITIVE
      gate_result: Documented filters and paging change response scope; no evidence that ordinary parameter selection here
        establishes an intentional distinct evasion implementation. Direct versus recursive is relationship semantics rather
        than a stealth taxonomy.
    - axis: temporal-spacing-or-distributed-callers
      disposition: evidence-deferred
      evidence_keys: []
      gate_result: No candidate-specific evidence of intentional spacing or common control of distributed group-query origins.
        No NM-ST assigned from low volume alone.
    - axis: ordinary-client-or-encrypted-directory-transport
      disposition: parent-core
      evidence_keys:
      - REF-001049
      - B016-T1069-REF-NETLOCAL
      gate_result: Normal interface reuse supports parent FD at medium strength; product identity and ordinary encryption
        do not create a sibling or DO mechanism.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: 额外完成一次从本地令牌、目录计算属性和云关系查询返回语义出发的反向检查。三种平台部署差异没有被导入；两个以上实质不同轴已经逐门禁核查。一个有明确能力对照的子项足以表达当前证据支持的变量，其余均有失败门禁说明。
      en: An additional reverse check examined local tokens, computed directory attributes, and cloud relationship-response
        semantics. Three deployment distinctions were not imported, and more than two materially distinct axes were gated
        independently. One child with an explicit capability-path comparison expresses the variable supported by current evidence;
        the remaining axes have stated failed gates.
