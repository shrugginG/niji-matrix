  result_evidence_ladder:
  - level: invocation_observed
    establishes: A process or script contained actual rule-query semantics, or the network/API request was observed.
    does_not_establish: Valid return, successful method completion or acquired complete constraints.
  - level: interface_status_observed
    establishes: The status belongs to the identified interface layer and matching request.
    does_not_establish: A transport success is not application success; no error field is not a recovered rule response.
  - level: rule_view_observed
    establishes: A validated matching output supplies specified rules for a stated local/domain/user/cloud scope at an identified
      time.
    does_not_establish: A different subject's effective policy, all authentication controls or measured evasion.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 定义区分规则与认证秘密，特性区分目的可区分性与结果缺口，范围显式处理GPO、猜解和身份作用域。场景覆盖账号规划与自助冲突，攻防模型不默认管理员或全量API审计。四项分析分别实现Windows语义、Linux文件与期限、IAM自助和SAMR直接方法，不套用字段名称；限制保留案例级别及未部署验证。主Agent仍须统一审阅跨技术边界与共享身份。
      en: Definition separates rules from authentication secrets, characteristics distinguish intent ambiguity from missing
        results, and scope addresses GPOs, guessing, and identity scope. Scenarios cover account planning and self-service
        ambiguity without assuming administration or complete API auditing. Four analytics implement Windows semantics, Linux
        file/aging reads, IAM self-service context, and a direct SAMR method rather than replacing field names. Limitations
        retain incident evidence level and absent deployment validation. The primary must still review boundaries and shared
        identities.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - read-only catalog and schema inspection
    - YAML parse and bilingual-key validation
  limitations:
    paragraphs:
    - zh: 此交接没有正式分配ID，没有修改共享库、矩阵或战术计划，也没有运行真实目标上的规则查询或传感器验证。当前研究支持父级retain、一个中等置信机理、零正式NJS、一个DET、四个NJA和一个MIT候选；ID、生命周期和验收由主Agent统一处理。
      en: This handoff allocates no canonical IDs, changes no shared library, matrix, or tactic plan, and performs no rule
        query or sensor validation on real targets. It supports parent retain, one medium-confidence mechanism, zero formal
        NJS, and candidates for one DET, four NJA, and one MIT. The primary handles identities, lifecycle, and acceptance
        centrally.
