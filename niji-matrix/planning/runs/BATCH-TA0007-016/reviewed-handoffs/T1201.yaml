  - mechanism_ref: NM-BT
    reason: Missing default logs or a hypothetical OpenDomain-dependent detector are observation weaknesses, not proof of
      a deliberately selected password-policy evasion implementation. Keep the handle-free and anonymous axes in research
      pending conclusion-level support.
  - mechanism_ref: NM-ST
    reason: No candidate-specific intentional time dilution or complementary multi-origin aggregation was found; legitimate
      account-check cadence is insufficient.
  - mechanism_ref: NM-DO
    reason: No supported alteration conceals the policy-query meaning in observed data. Encrypted transport alone is not a
      password-policy-native mechanism.
  open_questions:
  - Obtain firsthand evidence deliberately selecting handle-free or anonymous policy retrieval to reduce observation, with
    normal-client controls and measured trace differences.
  - Validate actual 4688 and 4104 field/fragment contracts, Linux audit architecture/path coverage and service-specific PAM
    override behavior.
  - Validate IAM global-service event collection and self-service baselines without assuming read-response contents.
  - Validate Suricata binding/interface association and encrypted or midstream behavior on the installed version, retaining
    request-level evidence when no application result decoder exists.
