  detection_analytics:
  - temporary_key: B016-T1201-NJA-WINDOWS
    strategy_key: B016-T1201-DET-POLICY-READ
    name:
      zh: Windows 密码规则查询语义与目标策略视图
      en: Windows Password-Rule Query Semantics and Target Policy View
    summary:
      zh: 区分本地、域默认与用户有效规则请求，识别不符合任务来源的调查而不把进程创建等同于返回成功。
      en: Distinguish local, domain-default, and user-resultant rule requests and identify surveying outside expected work
        without treating process creation as successful retrieval.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 基础分支从启用完整命令行的 4688 记录解析 net 或 net1 的 accounts 只读语义，保留 /domain 等目标范围；带设置参数的请求转给策略修改分析，帮助或语法错误保留原状态。按主机、登录 ID、进程
          ID 和创建时间恢复可验证的进程谱系，避免 PID 重用。事件记录的创建主体不一定代表新进程的实际安全上下文；目标主体字段依版本和记录而定，缺失时保持未知。仅有启动事件时输出 policy_query_attempt，不推断进程退出、读取成功或具体约束。
        en: The base branch parses read-only accounts semantics in net or net1 from event 4688 with full command lines, retaining
          scope such as /domain. Route setting arguments to policy-mutation analysis and retain help or syntax-error context.
          Recover verifiable lineage by host, logon ID, process ID, and creation time to avoid PID reuse. The recorded creator
          need not represent the new process security context; target-subject fields depend on event version and availability
          and remain unknown when absent. A launch alone yields policy_query_attempt rather than process completion, read
          success, or particular constraints.
      - zh: 在启用 PowerShell 脚本块补充分支时，按脚本块 ID 和分段号重组 4104，识别 Get-ADDefaultDomainPasswordPolicy 与 Get-ADUserResultantPasswordPolicy
          的实际查询语义并分别保留域或用户目标。结果采集若另行启用，必须验证返回对象、时间和目标，才可提升为 policy_result_observed；默认域对象不升级为用户有效对象。十分钟内与批准的账号支持、合规和目录作业比较，来源、身份或目标越界时提高优先级，正常任务需要范围和到期时间相符。
        en: When the supplemental PowerShell branch is enabled, reconstruct event 4104 by script-block ID and fragment sequence
          and identify actual Get-ADDefaultDomainPasswordPolicy and Get-ADUserResultantPasswordPolicy query semantics, retaining
          domain and user targets separately. If result collection is separately enabled, validate the returned object, time,
          and target before raising the level to policy_result_observed; a domain-default object must not become a user-resultant
          object. Compare against approved account-support, compliance, and directory jobs over ten minutes, prioritizing
          origin, identity, or target deviations. Legitimate work must match scope and expiry.
    data_requirements:
    - source_type: windows-security-process-create
      name:
        zh: 启用命令行的进程创建记录
        en: Process creation with command lines enabled
      channel: Windows Security event 4688
      required_fields:
      - timestamp
      - device_id
      - subject_user_sid
      - subject_logon_id
      - new_process_id
      - new_process_name
      - process_command_line
      - creator_process_id
    - source_type: approved-account-policy-job
      name:
        zh: 批准的账号规则支持与核查任务
        en: Approved account-rule support and review work
      channel: change and support job inventory
      required_fields:
      - job_id
      - owner
      - source_device
      - principal
      - target_scope
      - valid_from
      - valid_to
    - source_type: powershell-script-block
      name:
        zh: 启用补充分支时的完整重组脚本块
        en: Reconstructed script blocks when the supplemental branch is enabled
      channel: Microsoft-Windows-PowerShell/Operational event 4104
      required_fields:
      - timestamp
      - device_id
      - process_id
      - script_block_id
      - message_number
      - message_total
      - script_block_text
    - source_type: validated-policy-result
      name:
        zh: 启用结果分支时的授权输出采集
        en: Authorized output collection when the result branch is enabled
      channel: validated result artifact or endpoint instrumentation
      required_fields:
      - timestamp
      - device_id
      - process_id
      - target_scope
      - policy_view
      - result_content
      - result_validated
    observables:
    - zh: accounts 只读请求及其本地或域范围
      en: Read-only accounts requests with local or domain scope
    - zh: 域默认值或指定用户有效策略的脚本请求
      en: Script requests for domain defaults or a specified user's resultant policy
    - zh: 与批准来源和目标范围不匹配的规则调查
      en: Rule surveying unmatched to approved origins and target scope
    correlation:
      window:
        zh: 以十分钟进程链窗口和三十日任务基线开始验证；这些是工程起点，不是研究证明的恶意阈值。
        en: Begin validation with a ten-minute process-chain window and thirty-day work baseline; these are engineering starting
          points rather than research-established malicious thresholds.
      dimensions:
      - device_id
      - subject_logon_id
      - process_id
      - process_start_time
      - principal
      - target_scope
      - job_id
    false_positives:
    - zh: 帮助台、账号过期排查、审计、目录迁移和密码管理软件可能执行相同请求。核对具体作业和目标，不因 net.exe 的签名或管理员身份自动放行。
      en: Help desks, account-expiry troubleshooting, audits, directory migration, and password-management software can issue
        the same requests. Verify the actual work and target rather than allowing net.exe signatures or administrator identities
        automatically.
    blind_spots:
    - zh: 原生 API 和自定义目录读取不一定出现这些命令。未启用命令行、截断参数、未记录的脚本运行时及日志丢失降低覆盖；进程或脚本记录本身没有返回规则或完整成功状态。
      en: Native APIs and custom directory reads need not use these commands. Disabled command-line capture, truncation, unlogged
        script runtimes, and loss reduce coverage. Process and script records themselves lack returned rules and complete
        success status.
    tuning_guidance:
      paragraphs:
      - zh: 以本地、域默认和细粒度策略目标验证解析，并分别测试帮助、权限拒绝、策略修改和正常读取。将 4688 XML 的 SubjectLogonId、NewProcessId、NewProcessName 与 CommandLine
          规范化到上述字段；PID 关联必须带创建时间。结果分支缺失时维持尝试等级，批准任务例外必须绑定来源、身份、范围和期限。
        en: Validate parsing against local, domain-default, and fine-grained targets and separately test help, denied access,
          mutation, and normal reads. Normalize SubjectLogonId, NewProcessId, NewProcessName, and CommandLine from event 4688
          XML into the fields above, and include creation time in PID joins. Retain attempt-level evidence without the result
          branch, and bind approved-work exceptions to origin, identity, scope, and expiry.
    evidence_keys:
    - REF-001049
    - REF-000334
    - REF-000623
    - REF-000463
    - B016-T1201-REF-ADDEFAULT
    - B016-T1201-REF-ADRESULTANT
  - temporary_key: B016-T1201-NJA-LINUX
    strategy_key: B016-T1201-DET-POLICY-READ
    name:
      zh: Linux 期限查询与实际规则文件访问关联
      en: Linux Aging Queries and Actual Rule-File Access Correlation
    summary:
      zh: 保留期限查询、文件访问与规则有效性之间的差异，并按登录会话核对读取来源。
      en: Preserve distinctions among aging queries, file access, and rule effectiveness while checking read provenance by
        login session.
    domains:
    - enterprise
    platforms:
    - Linux
    logic:
      paragraphs:
      - zh: 预先验证审计规则覆盖目标架构的 execve 与 execveat，并对实际部署的 PAM 密码栈及 pwquality 配置路径设置定向读取审计。用 audit 事件序号重组 SYSCALL、EXECVE、CWD 和
          PATH，区分带 -l 或 --list 的 chage 读取与修改参数。若只得到进程记录，输出 expiry_query_attempt；execve 的成功只证明执行系统调用成功，不能解释为 chage 返回了有效期限。
        en: Prevalidate audit coverage of execve and execveat on the deployed architectures and configure targeted read auditing
          for the actual PAM password stack and pwquality paths. Reconstruct SYSCALL, EXECVE, CWD, and PATH records by audit
          serial and distinguish chage -l or --list from mutation arguments. Process records alone yield expiry_query_attempt.
          A successful execve establishes the execution syscall rather than a valid aging result from chage.
      - zh: 文件分支要求匹配实际路径和成功的读取相关访问记录，不只匹配 cat、grep 或文件名字符串；记录 auid、uid、会话、PID 及进程起点，保留 open 与实际内容取得的证据差异。在十五分钟内与账号维护和合规作业比较，账号切换、来源不符或成组读取提高优先级。配置文件只表示该视图，模块参数覆盖和外部目录规则另行解释；不得把对
          /etc/shadow 的访问直接纳入普通规则读取，以免混淆秘密提取。
        en: The file branch requires actual path matches and successful read-related access records rather than cat, grep,
          or filename strings alone. Retain auid, uid, session, PID, and process start while distinguishing opening from acquisition
          of content. Compare with account-maintenance and compliance work over fifteen minutes, prioritizing identity changes,
          origin deviations, or clustered reads. A configuration file establishes its view only; module-argument overrides
          and external directory rules need separate interpretation. Do not classify /etc/shadow access automatically as ordinary
          rule reading and conflate it with secret extraction.
    data_requirements:
    - source_type: linux-audit-execution
      name:
        zh: 已启用并按事件重组的 Linux 执行审计
        en: Enabled Linux execution audit reconstructed by event
      channel: auditd SYSCALL EXECVE CWD records
      required_fields:
      - timestamp
      - host_id
      - audit_serial
      - auid
      - uid
      - ses
      - pid
      - ppid
      - exe
      - syscall
      - success
      - argv
      - cwd
    - source_type: linux-targeted-rule-read
      name:
        zh: 文件分支启用时的定向规则读取审计
        en: Targeted rule-read audit when the file branch is enabled
      channel: auditd configured read-related syscall and PATH records
      required_fields:
      - timestamp
      - host_id
      - audit_serial
      - auid
      - uid
      - ses
      - pid
      - exe
      - syscall
      - success
      - exit
      - path
      - inode
      - audit_key
    - source_type: approved-account-policy-job
      name:
        zh: 正常账号维护任务与实际认证栈清单
        en: Normal account-maintenance work and actual authentication-stack inventory
      channel: configuration and job inventory
      required_fields:
      - host_id
      - owner
      - principal
      - service
      - policy_paths
      - job_id
      - valid_from
      - valid_to
    observables:
    - zh: 指定账号的 chage 只读期限请求
      en: Read-only chage aging requests for an account
    - zh: 实际密码栈和强度配置路径的读取相关访问
      en: Read-related access to actual password-stack and strength-configuration paths
    - zh: 登录身份与执行身份变化或读取来源越界
      en: Changes between login and execution identity or out-of-scope read origins
    correlation:
      window:
        zh: 初始使用十五分钟会话窗口；文件与进程必须先按同一主机的 audit 序号正确重组，再做跨事件关联。
        en: Start with a fifteen-minute session window; reconstruct file and process records by same-host audit serial before
          correlating different events.
      dimensions:
      - host_id
      - audit_serial
      - auid
      - ses
      - pid
      - process_start_time
      - path
      - job_id
    false_positives:
    - zh: 用户核对自身期限、合规扫描、账号修复、镜像构建和配置管理会产生相同执行或文件访问。服务定时读取规则与交互式调查应分别建基线。
      en: Users checking their expiry, compliance scanning, account repair, image building, and configuration management produce
        the same executions or accesses. Baseline routine service reads separately from interactive surveying.
    blind_spots:
    - zh: 审计必须预先配置，现成缓存、容器挂载、未覆盖架构、日志积压及其他身份后端会留下缺口。路径访问不证明读取者解释了规则，chage 输出只反映 shadow 期限视图。
      en: Audit must be configured in advance. Existing caches, container mounts, uncovered architectures, backlog, and other
        identity backends leave gaps. Path access does not establish interpretation of rules, and chage output reflects only
        the shadow aging view.
    tuning_guidance:
      paragraphs:
      - zh: 根据部署的发行版和服务找出实际 include 栈、模块参数与配置路径，避免以固定 common-password 文件名替代环境核查。使用成功、拒绝和规则覆盖测试验证 audit_key 与事件拼接，监控丢失计数；仅对需要的文件启用读取规则，避免全文件系统审计的容量代价。将审计原生
          serial、ses、auid 和 PATH.name 映射到规范键并保留原始证据。
        en: Resolve the actual include stack, module arguments, and configuration paths for the deployed distribution and
          service instead of substituting a fixed common-password filename for environment verification. Test successful and
          denied access plus rule coverage to validate audit keys and record joins, and monitor lost counts. Target required
          files rather than imposing filesystem-wide read auditing. Map native serial, ses, auid, and PATH.name to canonical
          keys while retaining raw evidence.
    evidence_keys:
    - B016-T1201-REF-CHAGE
    - B016-T1201-REF-PWQUALITY
    - REF-000840
    - REF-001225
  - temporary_key: B016-T1201-NJA-AWS
    strategy_key: B016-T1201-DET-POLICY-READ
    name:
      zh: IAM 密码策略读取的身份会话与自助来源差分
      en: IAM Password-Policy Read Identity-Session and Self-Service Origin Differential
    summary:
      zh: 在账号管理与自助基线上识别异常 GetAccountPasswordPolicy 请求，保留错误结果并避免假定审计包含密码规则响应。
      en: Identify abnormal GetAccountPasswordPolicy requests against account-management and self-service baselines while
        retaining errors and avoiding assumptions that audit contains policy responses.
    domains:
    - enterprise
    platforms:
    - IaaS
    logic:
      paragraphs:
      - zh: 从涵盖 IAM 全局服务事件的 CloudTrail 采集链选择 eventSource 为 iam.amazonaws.com 且 eventName 为 GetAccountPasswordPolicy 的请求，用
          recipientAccountId、userIdentity 的实际类型和会话主体、sourceIPAddress 及 userAgent 关联来源。按事件 ID 去重，保留 errorCode 与 errorMessage
          的存在性；AccessDenied、NoSuchEntity 与无错误记录分开呈现，不从 NoSuchEntity 推断没有默认规则。
        en: Select eventSource iam.amazonaws.com and eventName GetAccountPasswordPolicy from a CloudTrail collection path
          covering IAM global-service events. Correlate origin using recipientAccountId, actual userIdentity type and session
          principal, sourceIPAddress, and userAgent. Deduplicate by event ID and preserve the presence of errorCode and errorMessage.
          Present AccessDenied, NoSuchEntity, and records without an error separately, and do not interpret NoSuchEntity as
          absence of default requirements.
      - zh: 对比同一账号的密码更新界面、账号管理作业与角色来源，来源网络、会话角色或用途明显偏离时产生调查候选，十五分钟内的其他目录或认证相关操作只用于排序。无错误只能作为服务处理状态的线索，responseElements 对只读操作通常为空，不能声称已经从审计恢复最小长度、复杂性或锁定阈值。本分析保留请求层结论；客户端返回内容的采集与验证属于另行部署的结果分析。
        en: Compare with password-change interfaces, account-management jobs, and role origins in the same account, producing
          survey candidates for material deviations in network origin, session role, or purpose. Other directory or authentication-related
          operations within fifteen minutes affect ranking only. Absence of an error is an indication of service processing,
          while responseElements is generally null for read-only operations; audit does not reconstruct minimum length, complexity,
          or lockout thresholds. This analytic retains request-level conclusions. Collecting and validating client responses
          requires a separately deployed result analysis.
    data_requirements:
    - source_type: aws-cloudtrail-iam
      name:
        zh: 覆盖 IAM 全局服务读取的 CloudTrail
        en: CloudTrail covering IAM global-service reads
      channel: AWS CloudTrail management events
      required_fields:
      - event_time
      - event_id
      - event_source
      - event_name
      - recipient_account_id
      - user_identity
      - source_ip_address
      - user_agent
    - source_type: approved-iam-work-origin
      name:
        zh: 账号管理与自助会话来源基线
        en: Account-management and self-service session-origin baseline
      channel: IAM role and approved automation inventory
      required_fields:
      - account_id
      - principal
      - role_session
      - owner
      - expected_origins
      - workload_purpose
      - valid_from
      - valid_to
    observables:
    - zh: IAM GetAccountPasswordPolicy 操作
      en: IAM GetAccountPasswordPolicy operations
    - zh: 读取来源与已知自助或管理任务不匹配
      en: Read origins unmatched to known self-service or administrative work
    - zh: 出现访问拒绝或自定义实体不存在等不同结果
      en: Distinct results including access denial or absent custom entity
    correlation:
      window:
        zh: 使用十五分钟身份会话窗口与三十日来源基线作为待验证起点，长期保留按账号去重后的读取事件。
        en: Use a fifteen-minute identity-session window and thirty-day origin baseline as starting points to validate, retaining
          deduplicated reads by account over longer periods.
      dimensions:
      - recipient_account_id
      - principal
      - role_session
      - source_ip_address
      - event_id
    false_positives:
    - zh: 用户更新自身密码、控制台安全凭据页面、合规工具和 IAM 运维会合法查询账号规则。频率低或具有读取权限既不证明恶意，也不应成为永久放行条件。
      en: Users changing their passwords, console security-credentials pages, compliance tools, and IAM operations legitimately
        query account rules. Low frequency and read entitlement neither establish maliciousness nor justify permanent allowances.
    blind_spots:
    - zh: 未纳入全局服务读取、集中采集延迟、日志保留不足或会话身份规范化错误会割裂来源。审计一般没有只读返回内容，联邦身份与根用户规则也不能由此操作证明。
      en: Excluding global-service reads, central collection delays, inadequate retention, and incorrect session normalization
        fragment provenance. Audit generally lacks read-only response contents, and this operation does not establish federated-identity
        or root-user rules.
    tuning_guidance:
      paragraphs:
      - zh: 用已知自助页面、自动化、拒绝权限和没有自定义策略的账号验证事件链；原生 eventTime、eventID、eventSource、eventName、recipientAccountId、sourceIPAddress
          与 userAgent 映射为上述规范键，userIdentity 保留类型与完整会话信息。错误字段仅在存在时解析，缺少它们不补造响应。例外绑定角色、来源和任务有效期，按实际控制台行为检查，避免整账号静默。
        en: Validate the event path using known self-service pages, automation, denied permissions, and an account without
          a custom policy. Map native eventTime, eventID, eventSource, eventName, recipientAccountId, sourceIPAddress, and
          userAgent to the canonical keys above while retaining userIdentity type and full session details. Parse error fields
          only when present and do not invent a response when absent. Bind exceptions to role, origin, and work expiry, checking
          actual console behavior rather than suppressing an entire account.
      - zh: 将缺失 errorCode、errorMessage 和不适用的角色会话字段规范化为 null，保留事件而不因空字段丢弃成功或直接 IAM 用户请求。role_session 从 userIdentity 的会话结构派生，非角色调用保留未知或不适用。
        en: Normalize absent errorCode, errorMessage, and inapplicable role-session fields to null, retaining successful and
          direct IAM-user requests rather than discarding them. Derive role_session from userIdentity session structure and
          keep non-role callers unknown or not applicable.
    evidence_keys:
    - B016-T1201-REF-AWSGET
    - B016-T1201-REF-AWSPOLICY
    - B016-T1201-REF-IAMLOG
    - REF-000524
  - temporary_key: B016-T1201-NJA-SAMR
    strategy_key: B016-T1201-DET-POLICY-READ
    name:
      zh: 不依赖域句柄前序的 SAMR 策略直接请求识别
      en: Direct SAMR Policy Request Identification Without Domain-Handle Preconditions
    summary:
      zh: 直接检测策略操作 56，避免因没有 OpenDomain 前序而漏掉请求，同时不把 SMB 成功解释为规则返回。
      en: Identify policy operation 56 directly instead of requiring preceding OpenDomain activity, without interpreting SMB
        success as returned rules.
    domains:
    - enterprise
    platforms:
    - Windows
    logic:
      paragraphs:
      - zh: 在可见的 DCERPC 流量上，依据已成功协商的接口 UUID 12345778-1234-abcd-ef00-0123456789ac 与操作号 56 识别 SamrGetDomainPasswordInformation
          请求；可使用经验证的 Suricata dcerpc.iface 与 dcerpc.opnum 精确匹配输出请求命中。规则不要求先见 SamrConnect、OpenDomain 或用户枚举，因为该方法不需要域对象 context
          handle。RPC binding handle 仍然存在，不能将其表述为没有网络会话或绕过服务器访问检查。
        en: On visible DCERPC traffic, identify SamrGetDomainPasswordInformation using successfully negotiated interface UUID
          12345778-1234-abcd-ef00-0123456789ac and operation 56. A validated Suricata implementation can emit request matches
          using exact dcerpc.iface and dcerpc.opnum conditions. Do not require prior SamrConnect, OpenDomain, or user enumeration
          because this method needs no domain-object context handle. An RPC binding handle still exists, so this is neither
          absence of a network session nor bypass of the server-wide access check.
      - zh: 以精确接口与操作匹配的告警作为请求证据，flow_id、源/目的地址以及可得的 SMB session_id 和 RPC call_id 用于上下文旁证，不作为跨多个命名管道或绑定的唯一调用标识。绑定事件中的接口列表不能证明同流每个请求都属于该接口；基础分支依赖解析器正确执行接口匹配，关联条件不足时保持请求命中而不重建完整调用。对未登记来源或偏离正常密码管理流程的请求产生调查候选。SMB
          status 和 RPC RESPONSE 只证明对应层状态；本分析不输出 SAMR 应用成功或密码约束内容，需要返回值时另部署经过 NDR 验证的解码与结果来源。
        en: Use alerts from exact interface and operation matching as request evidence. flow_id, endpoint addresses, and available
          SMB session_id and RPC call_id provide context rather than a unique call identity across multiple named pipes or
          bindings. An interface list in a bind event does not assign every request in the flow to that interface. The base
          branch relies on correct parser interface matching; inadequate association retains the request hit without reconstructing
          a complete call. Investigate unregistered origins or deviations from normal password-management work. SMB status
          and RPC RESPONSE establish their respective layer states. This analytic does not report SAMR application success
          or password constraints; returned values require separately deployed NDR-validated decoding and result data.
    data_requirements:
    - source_type: suricata-samr-request-match
      name:
        zh: 精确接口与操作匹配产生的请求事件
        en: Request events from exact interface and operation matching
      channel: Suricata 8.0.2 EVE alert with validated DCERPC rule
      required_fields:
      - timestamp
      - flow_id
      - src_ip
      - src_port
      - dest_ip
      - dest_port
      - alert.signature_id
      - alert.signature
    - source_type: suricata-smb-dcerpc
      name:
        zh: 启用关联分支时的 SMB 与 RPC 事件
        en: SMB and RPC events when the correlation branch is enabled
      channel: Suricata 8.0.2 EVE SMB dcerpc and bind events
      required_fields:
      - timestamp
      - flow_id
      - src_ip
      - dest_ip
      - smb.session_id
      - smb.dcerpc.request
      - smb.dcerpc.call_id
      - smb.dcerpc.opnum
    - source_type: approved-password-management-origin
      name:
        zh: 允许的密码管理调用来源与目标
        en: Approved password-management callers and targets
      channel: workload and network-management inventory
      required_fields:
      - owner
      - source_asset
      - destination_asset
      - workload_purpose
      - valid_from
      - valid_to
    observables:
    - zh: 经接口上下文验证的 SAMR 操作 56 请求
      en: SAMR operation 56 requests verified against interface context
    - zh: 与已登记密码管理来源不一致的调用
      en: Calls inconsistent with registered password-management origins
    - zh: 无需依赖域对象打开序列即可识别的策略请求
      en: Policy requests identifiable without a domain-object opening sequence
    correlation:
      window:
        zh: 按实际 RPC/SMB 会话关联，初始保留十五分钟来源语境；超长会话或不完整抓包必须明确降级。
        en: Correlate by actual RPC/SMB session and initially retain fifteen minutes of origin context; explicitly degrade
          long-lived sessions or incomplete captures.
      dimensions:
      - flow_id
      - src_ip
      - dest_ip
      - smb.session_id
      - smb.dcerpc.call_id
      - source_asset
    false_positives:
    - zh: 合法密码更新客户端、兼容性工具、管理软件和授权测试可能使用同一操作。命中证明请求，不证明恶意采用、匿名性或具体匿迹意图。
      en: Legitimate password-change clients, compatibility tools, management software, and authorized tests can use the same
        operation. A match proves a request rather than malicious use, anonymity, or a particular evasion intent.
    blind_spots:
    - zh: SMB 加密、RPC 隐私、未见绑定的中途抓包、未覆盖的直连 TCP 与本地调用会降低或消除可解析性。SMB/RESPONSE 状态不是方法返回状态，解析器版本差异和多接口绑定需要实测。
      en: SMB encryption, RPC privacy, midstream capture without binds, uncovered direct TCP, and local calls reduce or remove
        inspectability. SMB/RESPONSE states are not method return status; parser-version differences and multiple-interface
        bindings require validation.
    tuning_guidance:
      paragraphs:
      - zh: 在已安装版本用授权测试验证 SAMR UUID 与 56 的正例，并用其他接口的相同操作号、拒绝、匿名及认证会话作为反例。基础规则输出自身 signature_id 即可标识已验证的条件，不能虚构 EVE 在每个请求都包含接口
          UUID 或规则返回值。保留网络来源与目标、适当限制抓包访问；需要返回内容时另部署经过 NDR 验证的补充分支，不让结果缺失阻止请求级调查。
        en: Validate positive SAMR UUID and operation-56 cases on the installed version using authorized tests, with the same
          opnum on other interfaces, denials, anonymous sessions, and authenticated sessions as controls. The base rule's
          signature_id identifies its verified conditions; do not invent an interface UUID or rule return in every EVE request.
          Retain origins and targets and restrict capture access. Deploy an NDR-validated supplemental branch when results
          are needed without letting absent output block request-level investigation.
      - zh: 关联分支中的 request、opnum 和接口字段按事件类型允许为空；接口信息主要位于绑定记录。用同流多命名管道和多接口测试确认规则引擎的关联，不能只用 flow_id 与 call_id 推定应用层结果。
        en: Allow request, opnum, and interface fields to be null according to event kind in the correlation branch; interface
          information mainly occurs in bind records. Test multiple named pipes and interfaces in one flow to verify rule-engine
          association, and never infer application results from flow_id and call_id alone.
    evidence_keys:
    - B016-T1201-REF-SAMR
    - B016-T1201-REF-SURICATA-RPC
    - REF-001041
  mitigations:
  - temporary_key: B016-T1201-MIT-POLICY-EXPOSURE
    name:
      zh: 密码规则暴露范围与读取问责治理
      en: Password-Rule Exposure Scope and Read Accountability Governance
    summary:
      zh: 收紧非必要的规则读取入口并验证读取观察，保留密码更新和正常账号支持所需的信息。
      en: Restrict unnecessary rule-reading paths and validate read visibility while preserving information required for password
        changes and account support.
    description:
      paragraphs:
      - zh: 密码规则通常需要被用户和客户端了解，不能把规则保密当成认证强度的替代。控制应减少多余的远程 SAM 与云读取授权，为实际规则来源建立验证过的观察，并为账号支持设置可核查的任务范围。它主要降低无业务必要的暴露并提高问责，不撤回已获得的规则，也不承诺阻断具有正常读取权的失陷用户。
        en: Users and clients often need password rules, so secrecy cannot substitute for authentication strength. Reduce
          unnecessary remote SAM and cloud read entitlements, establish validated observation of actual rule sources, and
          bind account support to verifiable work scope. The control primarily reduces exposure without a business need and
          improves accountability; it neither retracts acquired rules nor promises to block compromised users with legitimate
          read rights.
    domains:
    - enterprise
    measures:
    - key: remote-sam-read-boundary
      name:
        zh: 验证远程 SAM 调用边界
        en: Validate remote SAM call boundaries
      control_type: exposure-reduction
      description:
        paragraphs:
        - zh: 清查真正需要 SAMRPC 的管理与密码客户端，对远程 SAM 的服务器级访问描述符先用 audit-only 模式评估，再只保留必要主体和网络来源。区分域控制器与成员机默认行为，验证拒绝和允许的实际结果；不要仅启用匿名账号枚举限制便宣称所有密码策略方法都已受控。
          en: Inventory management and password clients actually requiring SAMRPC, evaluate the server-wide remote-SAM descriptor
            in audit-only mode, and retain only required principals and network origins. Distinguish domain-controller and
            member-host defaults and validate actual permitted and denied outcomes. Enabling an anonymous account-enumeration
            restriction alone must not be reported as control of every password-policy method.
    - key: iam-rule-read-entitlement
      name:
        zh: 审查 IAM 规则读取和自助需求
        en: Review IAM rule-read and self-service needs
      control_type: exposure-reduction
      description:
        paragraphs:
        - zh: 审查 iam:GetAccountPasswordPolicy 的实际使用身份，收回无 owner 或过期自动化的额外访问，并保留经确认的用户密码更新流程。账号级允许用户自行改密可以同时赋予此读取能力，不应只审查附加身份策略；变更前后用真实自助页面验证，避免为隐藏规则破坏恢复和更新功能。
          en: Review identities actually using iam:GetAccountPasswordPolicy, withdraw extra access for ownerless or expired
            automation, and preserve validated user password-change workflows. Account-level permission for users to change
            their passwords can also provide this read capability, so attached identity policies alone are insufficient. Test
            real self-service pages before and after changes rather than breaking recovery and updates to hide rules.
    - key: policy-read-observation-validation
      name:
        zh: 验证规则读取遥测与任务范围
        en: Validate rule-read telemetry and work scope
      control_type: detective-support
      description:
        paragraphs:
        - zh: 在选定 Windows 端点启用所需进程命令行与脚本记录，在 Linux 实际规则路径部署有容量预算的读取审计，并集中保留 IAM 读取事件。登记账号支持来源、身份、目标和有效期，分别验证请求、拒绝及有效输出能证明什么；网络
            SAMR 观察按方法识别，不要求所有策略读取都先打开域对象。监测事件丢失与解析版本，保护可能含敏感参数的日志。
          en: Enable required process-command and script records on selected Windows endpoints, deploy capacity-budgeted Linux
            read auditing on actual rule paths, and centrally retain IAM read events. Register account-support origins, identities,
            targets, and expiry and test what requests, denials, and validated output establish separately. Identify network
            SAMR by method instead of requiring every rule read to open a domain object first. Monitor loss and parser versions
            and protect logs potentially containing sensitive arguments.
    applications:
    - target_key: B016-T1201-PARENT
      use:
        paragraphs:
        - zh: 对密码策略发现，优先收紧不承担账号支持职责的远程 SAM 与额外 IAM 规则读取入口，并把保留的读取同自助更新、合规或帮助台任务绑定。Linux 规则路径要跟随实际服务栈和覆盖参数核查，Windows 与云则分别记录本地、默认域、用户有效及
            IAM 用户视图，避免把不同结果混在一个告警中。
          en: For Password Policy Discovery, prioritize unnecessary remote SAM and extra IAM rule-read paths outside account-support
            responsibilities, binding retained reads to self-service changes, compliance, or help-desk work. Verify Linux
            rule paths against actual service stacks and overrides. Separately retain local, domain-default, user-resultant,
            and IAM-user views on Windows and in the cloud instead of combining different results into one alert.
      expected_effect:
        paragraphs:
        - zh: 缺少业务依据的查询来源减少，可见规则读取更容易与目标范围及任务归属关联。经过验证的观察能保留查询尝试和取得结果之间的差异，使借用普通账号工具的攻击者更难仅靠接口外观获得放行；具体阻断范围取决于实际访问描述符和自助流程。
          en: Fewer query origins lack a business basis, and visible reads become easier to associate with targets and work
            ownership. Validated observation preserves the difference between attempts and acquired results, making ordinary
            account-tool appearance less sufficient for allowance. Actual prevention depends on access descriptors and self-service
            workflows.
      limitations:
        paragraphs:
        - zh: 正常客户端和已失陷用户仍可能依法读取所需规则，错误收紧 SAM 访问会影响管理软件，自助需求也限制云端可收紧的范围。定向审计必须提前部署且具有容量代价，加密 RPC 与缺失返回内容仍造成盲区。该控制不能替代强认证、撤回既有信息或仅凭缺事件证明没有调查。
          en: Legitimate clients and compromised users can still read required rules. Incorrect SAM restrictions affect management
            software, and self-service needs limit cloud tightening. Targeted auditing must be deployed in advance and consumes
            capacity, while encrypted RPC and missing results leave gaps. The control cannot replace strong authentication,
            retract information already learned, or prove absence of surveying from missing events.
