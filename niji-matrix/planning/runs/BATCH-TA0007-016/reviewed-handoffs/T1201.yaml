defense_candidates:
  detection_strategies:
  - temporary_key: B016-T1201-DET-POLICY-READ
    name:
      zh: 密码规则读取的目标视图与任务来源关联
      en: Password-Rule Read Target-View and Work-Origin Correlation
    summary:
      zh: 分别识别端点、Linux、云与直接 SAMR 策略读取，并保留尝试、拒绝与有效结果的证据差异。
      en: Identify endpoint, Linux, cloud, and direct SAMR policy reads while preserving the distinction between attempts,
        denials, and validated results.
    description:
      paragraphs:
      - zh: 本策略围绕规则读取本身识别异常调查，不要求出现策略修改或密码失败。Windows 分析恢复规则命令与脚本目标，Linux 分析区分期限查询和配置文件访问，云分析识别 IAM 策略读取，网络分析直接识别无需域对象句柄的策略操作。四个分析按各自数据前提独立运行，避免把一个平台的审计语义泛化到其他平台。
        en: This strategy identifies abnormal rule surveying without requiring policy changes or failed passwords. The Windows
          analytic recovers rule-command and script targets, the Linux analytic separates aging queries from configuration-file
          access, the cloud analytic identifies IAM policy reads, and the network analytic directly recognizes a policy operation
          requiring no domain-object handle. Each runs independently with its own data prerequisites rather than generalizing
          one platform's audit semantics to others.
      - zh: 输出保留读取来源、策略视图及证据等级，并与有 owner、目标范围及有效时间的正常任务比较。成功调用并不自动说明所有规则已被取得，未出现 OpenDomain 前序也不排除密码策略读取；相邻认证活动可提升调查优先级，但不能取代本技术自身的读取证据。
        en: Outputs retain origin, policy view, and evidence level and compare them with legitimate work bound to an owner,
          target scope, and validity interval. A successful invocation does not automatically establish acquisition of every
          rule, and the absence of OpenDomain does not exclude password-policy reads. Adjacent authentication activity can
          raise investigative priority but cannot replace evidence of the read itself.
