research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - password construction and aging constraints
    - lockout settings
    - local or domain defaults and user-resultant policy
    - cloud IAM user rules
    breadth_trigger: ordinary
    coverage_resolutions:
    - cluster: Password and lockout rule information
      disposition: parent-core
    - cluster: Platforms and utilities
      disposition: not-stealth-distinct
    - cluster: Default versus user-resultant values
      disposition: parent-core
    - cluster: General GPO object and application discovery
      disposition: adjacent-technique
      target_ref: NJT-0231
    - cluster: Password guesses and secret extraction
      disposition: adjacent-technique
    candidate_stealth_axes_examined:
    - key: handle-chain-elision
      variable: Deliberately select a policy operation that requires no domain-object context handle instead of an object-open
        and query sequence.
      prerequisites: Reachable SAMR service permitting the request; useful minimum-length and property information sufficient
        for the question; RPC binding still required.
      trace_change: SAMR operation 56 can occur without the server/domain object-handle sequence required by other methods;
        network request and server-wide access check remain.
      defender_effect: A detector requiring an observed OpenDomain or enumeration predecessor misses this valid request shape;
        exact interface and opnum matching does not require that predecessor.
      evidence_keys:
      - B016-T1201-REF-SAMR
      - B016-T1201-REF-SURICATA-RPC
      - REF-001041
      disposition: evidence-deferred
      supporting_argument: Official capability establishes intentional client method selection is possible, an objectively
        shorter object-operation chain, and a deployable request-specific analytic. Field Case is not a prerequisite for medium-confidence
        capability work.
      opposing_argument: No examined firsthand tool-author or adversarial study deliberately selects this path to reduce handle-chain
        observations. Operation number or a smaller response is not a Niji variable by itself; the hypothetical detector weakness
        is not proof of attacker design. Legitimate password clients and compatibility explain the method, and actual per-method
        event reduction was not measured.
      conclusion: Defer formal NJS without discarding the useful method-specific parent analytic. A BindingHandle is not a
        domain-object context handle; never label this as no RPC session or no authorization.
    - key: anonymous-context-selection
      variable: Select an allowed anonymous reading context rather than a named authenticated principal.
      prerequisites: A server and transport actually permit the relevant method and scope; no assumption of modern anonymous
        availability.
      trace_change: The principal may be anonymous while source address, connection and method traces remain; guest mapping
        and missing identity are not equivalent to anonymous access.
      defender_effect: Named-account joins may be unavailable, making source/session and method observation necessary.
      evidence_keys:
      - B016-T1201-REF-NETUSERMODALS
      - B016-T1201-REF-SAMR
      - B016-T1201-REF-SAMRESTRICT
      disposition: evidence-deferred
      reason: Capability alone establishes a permission condition. No examined source establishes deliberate identity-elision
        for password-policy evasion; modern default and transport restrictions plus ordinary unauthenticated client needs
        are strong counterexamples.
    - key: in-process-policy-query
      variable: Execute an API query inside an existing controlled process instead of launching a policy utility.
      prerequisites: Controlled execution and a supported API with appropriate read rights.
      trace_change: A separate utility launch may be absent; calling-process and runtime traces remain.
      defender_effect: Utility-name rules can miss the query, but the examined sources do not establish a relative adversarial
        observation experiment.
      evidence_keys:
      - B016-T1201-REF-NETUSERMODALS
      disposition: evidence-deferred
      reason: API capability and absent utility process are not sufficient evidence of attacker-selected evasion or an independent
        native boundary. Do not relabel API-versus-command implementation as NJS.
    - key: self-service-surface-substitution
      variable: Obtain rules through an ordinary user password-change surface rather than an administrative survey endpoint.
      prerequisites: A supported self-service flow and corresponding read permission.
      trace_change: IAM GetAccountPasswordPolicy can be shared by normal password-change and adversarial surveying; it remains
        logged as an IAM API operation.
      defender_effect: Request purpose is ambiguous; role, session and work origin matter more than operation names.
      evidence_keys:
      - B016-T1201-REF-AWSPOLICY
      - B016-T1201-REF-IAMLOG
      disposition: parent-core
      reason: Supports the parent's normal-interface overlap, but does not establish a separate substituted trace path or
        deliberate evasion implementation.
    - key: narrow-or-time-dispersed-policy-survey
      variable: Request selected rule facts or separate otherwise related reads over time.
      prerequisites: Prior knowledge, useful partial results and time tolerance.
      trace_change: Narrow fields do not necessarily reduce requests; intentional temporal separation could lower short-window
        density.
      defender_effect: A real implementation would require longer source/session correlation, but ordinary account-support
        cadence is a competing explanation.
      evidence_keys:
      - B016-T1201-REF-SAMR
      - B016-T1201-REF-ADRESULTANT
      disposition: evidence-deferred
      reason: No examined primary source shows intentional password-policy timing dilution or complementary multi-source aggregation.
        Limited return fields and target-specific effective rules are information scope rather than sufficient stealth variables.
    second_pass_required: false
    second_pass_completed: true
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 零个ATT&CK子项没有终止原生轴研究。五类轴及无句柄能力的正反证据均已检查；当前保留父级普通接口重叠机理，拒绝把操作号、匿名许可、默认日志缺失或更少返回字段直接提升为NJS。无句柄轴不是因缺现场案例而拒绝，而是尚缺有意匿迹选择与独立因果的结论级支持。
      en: Zero ATT&CK children did not terminate native-axis inquiry. Five axes and positive and negative handle-free capability
        arguments were examined. Retain the parent's ordinary-interface overlap mechanism while rejecting operation numbers,
        anonymous permission, missing default logs, and fewer return fields as sufficient NJS boundaries. The handle-free
        axis is deferred for missing conclusion-level support of deliberate evasion selection and independent causality, not
        merely for absence of a field case.
  six_step_causal_review:
  - step: Direct behavior and objective
    finding: Obtain password-rule information for planning; ComRAT commands establish observed hostile surveying at attempt
      level.
  - step: Attacker-controlled design
    finding: Targets, rule view and acquisition interface can be selected. The examined case does not demonstrate intentional
      method, anonymous-context or timing selection for evasion.
  - step: Trace change
    finding: Borrowing normal account-management reads produces ordinary command/API appearance without needing policy writes
      or failed authentication; particular event suppression remains unsupported.
  - step: Defender observation effect
    finding: One authorized read rarely establishes intent. Missing return values limit reconstruction of acquired constraints;
      evidence levels must remain separate.
  - step: Stealth effect and alternatives
    finding: Reduced distinguishability is a medium-confidence inference from real surveying and normal interface use. Self-service,
      help-desk and compliance jobs compete strongly; no measured detection reduction is claimed.
  - step: Evidence and actionable defense
    finding: Use target-view and work-origin correlation, exact SAMR operation identification, real Linux audit and IAM API
      semantics. The rule view, source/session and return-level limits guide implementation without requiring a speculative
      NJS.
