    evidence_keys: [B8-T1072-R-APT32, B8-T1072-R-AVOS, B8-T1072-R-MEDUSA]
    confidence: medium

defense_candidates:
  detection_strategies:
    - temporary_key: B8-T1072-D-TRANSACTION
      disposition: extend-existing
      existing_ref: DET-000089
      objective: {zh: 在原控制点、部署 job 与不同目标设备的 agent 和执行结果间重建横向事务, en: Reconstruct the lateral transaction from source control point and deployment job to agents and execution outcomes on distinct target devices}
  detection_analytics:
    - temporary_key: B8-T1072-A-CROSS-HOST-JOIN
      disposition: extend-existing
      existing_ref: NJA-000066
      implementation: {zh: 在现有 operator/session→content→operation→resolved device→agent receipt→child process 链中增加源设备或平台登录上下文与目标设备不同的门槛，按 operation/digest 聚合目标；有未批准身份或内容/范围变化且远端出现非基线进程或影响时升高风险。日志字段应按平台能力验证，缺少 operation ID 仅作低置信概率匹配。, en: Add a distinct-source-to-target gate to the existing operator or session to content, operation, resolved device, agent receipt, and child-process chain. Aggregate targets by operation or digest and raise risk when unauthorized identity, content, or scope change intersects off-baseline remote processes or impact. Validate fields per platform; absent operation IDs permit only lower-confidence probabilistic matching.}
      correlation_window: {zh: 依平台保留和 agent 离线策略覆盖任务前一天、最长七天检入及结果后一天；快速勒索 fan-out 另用十五分钟窗, en: Cover one day before the job, up to seven days of check-ins according to platform retention and offline policy, and one day after outcomes; add a fifteen-minute window for rapid ransomware fan-out}
      false_positives: {zh: 真实补丁、事件响应和软件发布会跨多个目标运行同一受信 agent；审批、内容摘要、工单和目标成员必须共同参与判断, en: Real patching, incident response, and releases run the same trusted agent on multiple hosts; approval, content digest, change record, and resolved membership must all inform the decision}
      blind_spots: {zh: 管理平台未记录原始 operator/session 或 agent 不带 operation ID 时难以证明跨主机来源；EDR 排除 agent 子进程会抹掉结果, en: Missing original operator or session and absent operation IDs obscure cross-host attribution; EDR exclusions for agent children remove the outcome}
      evidence_keys: [B8-T1072-R-MSCM, B8-T1072-R-APT32, B8-T1072-R-AVOS]
  mitigations:
    - temporary_key: B8-T1072-M-DEPLOYMENT-GOVERNANCE
      disposition: extend-existing
      existing_ref: MIT-000090
      application: {zh: 对 TA0008 的跨主机结果，收紧能选择其他设备的 Run Script/package 权限、双人审批、内容签名与不可变摘要、冻结的目标集合、canary 和 operation 撤销；保留 operator 到所有 agent 回执的审计链。预期减少单一被盗身份横向扩散并能定位剩余队列；代价是紧急补丁可能延迟，多角色或审计根同时失陷仍可绕过。, en: For TA0008 cross-host outcomes, restrict Run Script or package rights over other devices, require separated approval and signed immutable digests, freeze target membership, stage canaries, and support operation revocation while retaining operator-to-agent receipt audit. This limits lateral spread from one stolen identity and identifies queued targets. Emergency patching may be delayed, and simultaneous compromise of multiple roles or audit roots remains a bypass.}
      evidence_keys: [B8-T1072-R-MSCM, B8-T1072-R-CISA-LOTL]

