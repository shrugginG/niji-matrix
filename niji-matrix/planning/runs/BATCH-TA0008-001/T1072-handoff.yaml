handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0008-001
work_item_ref: WORK-TA0008-T1072
temporary_key_prefix: B8-T1072
candidate:
  source_type: attack
  source_attack_id: T1072
  name: {zh: 软件部署工具, en: Software Deployment Tools}

recommendation:
  decision: retain
  confidence: high
  integration_disposition: cross-tactic-reuse
  existing_technique_ref: NJT-0078
  rationale:
    paragraphs:
      - zh: ATT&CK Enterprise 19.1 将 T1072 同时列于 Execution 和 Lateral Movement。APT32 借已入侵的 ePO 向所有受管系统分发恶意软件，AvosLocker 借 PDQ Deploy 将勒索软件与工具送遍目标网络，Medusa 借 BigFix 与 PDQ Deploy 推送加密载荷。这些调查足以支持 TA0008 中从一个立足点或管理控制面使其他主机接受攻击者动作的准入；但远端执行仍是 TA0002 NJT-0078 所记录的同一部署 job、agent 和端点结果链。建议保留 TA0008 的独立准入决议，跨战术扩展并复用该规范对象，不复制父技术、子技术或防御对象。
        en: Enterprise ATT&CK 19.1 maps T1072 to both Execution and Lateral Movement. APT32 used compromised ePO to distribute malware to all managed systems, AvosLocker used PDQ Deploy to spread ransomware and tools through a target network, and Medusa used BigFix and PDQ Deploy to push encryptors. These investigations support admission under TA0008 when a foothold or management control plane causes attacker-controlled action on other hosts. The remote execution is still the same deployment job, agent, and endpoint-outcome chain already represented by TA0002 NJT-0078. Retain a distinct TA0008 admission decision and extend that canonical object across tactics without duplicating its parent, children, or defenses.
  scope_gate:
    zh: TA0008 须有可归因于攻击者的部署 operation 从控制面到与发起立足点不同的受管目标，并有 agent 接收后启动攻击者动作或其他明确远端控制结果；控制台登录、未下发 job、同机执行、仅文件到达或正常授权更新不足。即使涉及多目标，也不要求先证明攻击者取得长期会话。
    en: TA0008 requires an attributable adversary deployment operation from the control plane to a managed target distinct from the originating foothold, followed by agent-started attacker action or another clear remote-control outcome. Console login, an undispatched job, same-host execution, file arrival alone, or an authorized update is insufficient. Persistent interactive access is not required when multiple targets are affected.
  original_attack_subtechniques_imported: false

proposed_content:
  summary:
    zh: 攻击者借企业部署控制面把恶意任务下发到其他受管主机，以受信 agent 的本地动作完成横向控制并分散来源痕迹。
    en: Adversaries use an enterprise deployment control plane to deliver malicious jobs to other managed hosts, gaining lateral control through trusted-agent local actions while dispersing provenance traces.
  definition_and_concept:
    paragraphs:
      - zh: 在 TA0008 中，软件部署工具的直接行为是从当前控制点选择其他受管设备，提交已获或被盗权限允许的 package、script、command 或 job，让目标设备的管理 agent 接收并产生攻击者指定的本地动作。该跨主机结果可以是启动后门、运行侦察、加密文件或其他可控执行；部署服务器和目标之间的传输、端点执行与横向控制是一条可追踪事务，而非三个相互独立的同名技术。
        en: Under TA0008, Software Deployment Tools means selecting other managed devices from a current control point and submitting a package, script, command, or job through obtained or stolen authority so target agents receive it and produce attacker-chosen local action. The cross-host outcome may start a backdoor, run reconnaissance, encrypt files, or perform other controlled execution. Transfer from deployment server to target, endpoint execution, and lateral control are one traceable transaction rather than three independent techniques sharing a name.
  stealth_characteristics:
    paragraphs:
      - zh: 部署服务器和 agent 是企业允许的管理路径，目标主机最先看到的往往是签名 agent、管理服务器和 SYSTEM 子进程，而不直接显示来自原立足点的攻击者会话。一个中央 operation 还可通过 collection、队列和各 agent 检入跨设备展开，单端点分析只看到局部结果。管理控制面中的 operator、批准、内容 digest、目标解析和 job ID，以及端点回执、进程和结果仍保留可恢复的共同来源；不能把工具受信或目标数量本身当作匿迹意图证据。
        en: The deployment server and agents form an allowed enterprise management path. A target host often first sees a signed agent, management server, and SYSTEM child process rather than an attacker session from the original foothold. One central operation can also spread across devices through collections, queues, and individual agent check-ins, leaving a single-host view with only a local fragment. Control-plane operator, approval, content digest, resolved targets, and job ID can still be joined to agent receipts, processes, and outcomes. Tool trust or target count alone does not prove evasion intent.
  scope_boundary_definition:
    paragraphs:
      - zh: 本候选只覆盖既有企业部署、补丁、安全管理或 fleet 管理控制面对其他受管主机发起的恶意任务，且要求任务与目标动作可建立因果。已获合法批准的更新、只创建未执行的任务、只在原主机运行的命令以及仅将文件复制到远端均不构成此处的横向结果。无 fleet/package/job 管理职责的 PsExec、SSH、RDP 或新装单机 RMM 应按远程服务或相邻对象判断；直接云 VM 命令、容器管理与 CI/CD runner 已有其他所有者。文件到达而无执行属于 T1570 的研究边界，不能凭部署平台名称重复计数。
        en: This candidate covers malicious jobs sent through an established enterprise deployment, patch, security-management, or fleet-management control plane to other managed hosts, with a demonstrable link from job to target action. An authorized update, a created but unexecuted job, a command run only on the originating host, or file copying without remote action does not establish this lateral outcome. PsExec, SSH, RDP, or newly installed single-host RMM without fleet, package, and job management responsibilities should be assessed under remote services or adjacent owners. Direct cloud VM commands, container management, and CI/CD runners already have other owners. File arrival without execution is the T1570 research boundary and must not be double-counted solely because a deployment platform was used.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者控制部署管理员、服务账户、API token 或平台本身后，将恶意内容绑定到现有 collection 或可动态解析的目标集合。APT32 的 ePO 全系统拉取说明一处被盗安全管理控制面可接触多个目标；AvosLocker 与 Medusa 的 PDQ/BigFix 案例说明相同路径可服务于工具扩散和勒索影响。具体平台、包格式与调度周期应作为实现上下文，不作为 Niji 子项名称。
          en: After controlling a deployment administrator, service account, API token, or platform, an adversary binds malicious content to an existing collection or dynamically resolved target set. APT32's ePO all-system pull shows how one compromised security-management plane can reach many targets. AvosLocker and Medusa PDQ or BigFix cases show the same path spreading tools and ransomware effects. Product, package format, and schedule are implementation context rather than Niji child names.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者必须先取得能创建、批准或运行任务且能选择远端目标的管理权限，并了解 agent 的检入、缓存、执行账户和目标可达性。它可能从最初受陷主机经控制台或 API 操作，也可能先入侵 MSP/SaaS 控制面；现有案例并未披露每次操作的精确主体、批准链或原始登录设备，故不能把这些细节当成已观察事实。
            en: The adversary must first gain management authority sufficient to create, approve, or run jobs and select remote targets, and must understand agent check-in, caching, execution identity, and reachability. It may operate a console or API from the first compromised host or compromise an MSP or SaaS control plane. Existing cases do not disclose exact operators, approval chains, or originating login devices for each operation, so these details cannot be stated as observed facts.
      defender_model:
        paragraphs:
          - zh: 防守方需要同时取得平台身份、权限、内容版本与 digest、审批、解析后的目标、operation、agent 回执，以及目标主机进程、文件和影响日志。以 tenant/site、operator/session、operation/content、源控制点和目标 device 作键可重建跨主机事务；仅用端点父进程或只用控制台登录会断开来源。SaaS/MSP 日志不可得、平台不传播 ID、EDR 排除 agent 子进程以及历史轮转时需降低归因置信度，并保留由时间、摘要和服务器形成的概率关联。
            en: The defender needs platform identity, privilege, content version and digest, approval, resolved target membership, operation, agent receipts, and target-host process, file, and impact logs. Tenant or site, operator or session, operation or content, source control point, and target device can reconstruct the cross-host transaction. Endpoint parent process alone or console login alone breaks provenance. Unavailable SaaS or MSP logs, absent propagated IDs, EDR exclusion of agent children, and rotated history lower attribution confidence and leave only probabilistic joins by time, digest, and server.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 跨主机恶意动作继承受信管理 Agent 来源, en: Cross-host malicious actions inherit trusted-management-agent provenance}
      analysis:
        paragraphs:
          - zh: 攻击者在中央控制面发起任务，目标 agent 沿企业正常管理连接接收内容并以管理或 SYSTEM 身份启动，使攻击者从原立足点到远端主机的控制路径在目标进程树中表现为日常部署。APT32 的 ePO 与 AvosLocker 的 PDQ 直接证明恶意内容经该路径进入目标网络；目标上仍有 agent 子进程、内容摘要和平台任务可回连，来源伪装不等于痕迹消失。
            en: The adversary starts a job in the central control plane and target agents receive content over ordinary management connections and launch it under management or SYSTEM identity. The path from foothold to remote host therefore looks like routine deployment in the target process tree. APT32 ePO and AvosLocker PDQ directly show malicious content entering target networks through that path. Agent child processes, content digests, and platform jobs remain joinable, so provenance camouflage is not trace disappearance.
      evidence_keys: [B8-T1072-R-APT32, B8-T1072-R-AVOS, B8-T1072-R-MSCM]
      confidence: high
    - mechanism_ref: NM-ST
      role: secondary
      summary: {zh: 单一任务跨受管目标分散为局部执行片段, en: One job disperses into local execution fragments across managed targets}
      analysis:
        paragraphs:
          - zh: 中央 job 经 collection 和各 agent 检入产生多台主机上的独立事件，使单主机观测失去共同发起者。APT32 全系统拉取以及 AvosLocker、Medusa 跨网络部署证明了 fan-out，但没有直接证明攻击者为了规避而选择慢速或小批次；匿迹效果是分析推断，须保留 medium。按 operation、内容 digest、目标集合和时间聚合能暴露共同控制来源。
            en: A central job produces separate host events through collections and agent check-ins, removing the common initiator from a single-host view. APT32 all-system pulls and AvosLocker or Medusa network-wide deployment prove fan-out, but do not directly show the adversary choosing slow or small batches to evade detection. The stealth effect is an analytic inference and remains medium. Aggregating by operation, content digest, target set, and time exposes the common controlling source.
      evidence_keys: [B8-T1072-R-APT32, B8-T1072-R-AVOS, B8-T1072-R-MEDUSA, B8-T1072-R-MSCM]
      confidence: medium

