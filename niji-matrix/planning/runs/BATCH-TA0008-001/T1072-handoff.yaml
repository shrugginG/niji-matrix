    paragraphs:
      - zh: APT32、AvosLocker、Medusa 的一手资料证明部署平台被滥用并产生网络范围的恶意传播，但没有公开足够的 operator/session、job ID、审批和 agent 回执来逐端点重建完整事务。因此源立足点到每个目标的精确路径、是否故意利用分散规避，以及任何批准窗口伪装都不得升格为高置信事实。Microsoft 文档证实某一产品可提供 author/approver、collection、状态与日志，不保证 ePO、PDQ、BigFix 或所有 SaaS/MSP 平台具有同字段。
        en: Primary reporting on APT32, AvosLocker, and Medusa proves abuse of deployment platforms and network-wide malicious spread, but does not disclose sufficient operator or session, job ID, approval, and agent-receipt detail to reconstruct every endpoint transaction. The exact path from foothold to each target, deliberate use of dispersion for evasion, and approved-window camouflage therefore cannot be promoted to high-confidence facts. Microsoft documentation establishes author or approver, collection, status, and log capabilities for one product, not identical fields in ePO, PDQ, BigFix, or every SaaS or MSP platform.
      - zh: TA0008 的归类还取决于目标是否与发起点不同、是否实际产生攻击者可控动作；单纯下载与正常软件维护可能留下相似平台痕迹。既有 NJT-0078 子项描述首次执行与 fleet fan-out，正式复用时应补写战术结果门而不重新发明同一 agent/operation 变量。
        en: TA0008 classification also depends on a target distinct from the origin and actual attacker-controlled action. Mere download and ordinary software maintenance may leave similar platform traces. Existing NJT-0078 children already describe first execution and fleet fan-out; formal reuse should add the tactic outcome gate without reinventing the same agent or operation variables.
  rejected_mechanisms: [approved-window camouflage, deliberately low-and-slow rollout, tool-name camouflage, transfer-alone stealth, agentless service execution as a T1072 child]
  open_questions:
    - {zh: 主 Agent 须核验跨战术复用时 TA0008 的正式技术统计口径，以及 NJT-0078 classification.tactic_refs 与 TA0008 决议的双向解析约束。, en: The primary agent must verify how TA0008 counts a cross-tactic reused technique and validate NJT-0078 classification tactic_refs against the TA0008 decision resolution.}
    - {zh: 若 T1570 研究找到仅有部署包传输而无端点执行的实例，应将该实例归于传输行为，避免拿它证明 T1072 横向控制。, en: If T1570 research finds deployment-package transfer without endpoint execution, keep that instance with transfer and do not use it to prove T1072 lateral control.}

