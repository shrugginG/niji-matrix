      zh: 双语要点覆盖定义、可控痕迹、三组相邻边界、源/目标威胁模型、可观察残余和证据层级；主 Agent 正式写入时应继续分段扩写，并核对防御对象结构及父级 taxonomy deferred 理由。
      en: Bilingual points cover definition, controlled traces, three neighboring boundaries, source and target threat models, residual observations, and evidence levels. The primary agent should expand the canonical prose in distinct paragraphs and verify defense object structure and the deferred-taxonomy rationale.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [local_excel_xml_read, library_search]
  limitations:
    paragraphs:
      - zh: ATT&CK 19.1 与事件调查确证跨主机文件投递，却未给出攻击者选择特定内部路径以匿迹的直接陈述。LOCKBIT.WARLOCK 案例中的域控制器分发源不等于完整的“最初立足点→中继→目标”链；SAFEPAY 案例只证明多目标 SMB 放置。主技术的特征伪装属于条件性因果推断，应根据目标环境的分发基线校准；不能把正常共享或签名复制工具本身视为恶意。
        en: ATT&CK 19.1 and incident reporting confirm cross-host file placement but do not directly state that actors selected a particular internal route for stealth. The domain-controller distribution source in the LOCKBIT.WARLOCK case is not a complete initial-foothold-to-relay-to-target chain; the SAFEPAY case proves only multi-target SMB placement. The parent technique's feature-disguise effect is a conditional causal inference requiring the destination environment's distribution baseline; an ordinary share or signed copy utility is not malicious by itself.
      - zh: 5145 是共享访问检查，不单独证明文件实际写入；4663 依赖审计 SACL，Sysmon 11 和内容摘要依赖端点配置或 EDR 扩展。加密协议、按主机变形的载荷、短日志保留和不一致的主机标识会削弱跨主机谱系，故检测规则必须显示其数据前提与盲区。
        en: Event 5145 is a share access check and does not alone prove a completed write; 4663 depends on audit SACLs, while Sysmon 11 and content digests depend on endpoint configuration or EDR enrichment. Encrypted protocols, per-host payload variants, short retention, and inconsistent host identity weaken cross-host lineage, so an analytic must expose its data prerequisites and blind spots.
  rejected_mechanisms:
    - {mechanism_ref: NM-ST, reason_zh: 未有证据证明攻击者以分时或跨主机稀释为匿迹变量；多目标复制也可能提高异常强度。, reason_en: No evidence establishes attacker-selected time or host dilution as a stealth variable; multi-target copying may instead increase anomaly strength.}
    - {mechanism_ref: NM-BT, reason_zh: 已有日志语义可捕获内部复制，缺少特定未被覆盖的观察盲点证据。, reason_en: Available audit semantics can capture internal copying, and no specific unmonitored observation gap has been established.}
  open_questions:
    - zh: 是否存在第一手事件记录同时给出最初立足点、攻击者控制的中继、相同载荷谱系和目标到达，并说明中继选择的隐蔽目的或可量化观察差异？
      en: Is there a first-hand incident record linking initial foothold, attacker-controlled relay, same-payload lineage, and destination arrival while documenting concealment purpose or measurable observation difference?
    - zh: 当前共享库中是否已有 5145 与目标文件摘要关联的 DET/NJA，或东西向写入限定的 MIT，主 Agent 应在分配 ID 前按语义身份再次查重。
      en: Does the current shared library already contain a 5145-to-destination-digest DET/NJA or an east-west write-restriction MIT? The primary agent should recheck semantic identity before allocating IDs.
