handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0008-001
work_item_ref: WORK-TA0008-T1570
temporary_key_prefix: B8-T1570
candidate:
  source_type: attack
  source_attack_id: T1570
  name: {zh: 横向工具传输, en: Lateral Tool Transfer}
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
      - zh: ATT&CK Enterprise 19.1 的 T1570 锚定已受害环境中系统之间复制工具或其他文件、使其到达后续操作主机的行为。公开调查直接记录了 SMB 跨主机放置 NETSCAN、勒索载荷和批处理文件，故独立的“到达”对象有事实基础。Niji 应保留此父行为，但将正式范围收紧为攻击者选择既有内部传输关系、来源主机或分发路径，以改变文件到达的来源外观、局部事件密度或跨主机归因的实例；普通获授权复制本身没有匿迹结论。
        en: ATT&CK Enterprise 19.1 anchors T1570 in copying tools or other files among systems already in a victim environment so that they reach another operational host. Incident investigations directly record SMB placement of NETSCAN, ransomware payloads, and batch files on multiple hosts, establishing a distinct arrival object. Niji should retain that parent behavior while adapting formal scope to adversary selection of an existing internal transfer relationship, source host, or distribution path that changes the apparent provenance of file arrival, local event concentration, or cross-host attribution. An ordinary authorized copy has no stealth conclusion by itself.
      - zh: 传输到达与目标执行在时间和证据上可以分离。ATT&CK 的父页及 Mandiant 案例可直接支持行为和案例中的主机分发，Microsoft 事件文档可支持可观察痕迹；“中继使攻击更难被归因”只是由这些事实推导出的条件性观察效果，案例未陈述攻击者以此为目的，不能把该推断升级为现场已证实的匿迹意图。
        en: "Arrival and target execution can be separated in time and evidence. The ATT&CK parent and Mandiant cases directly support the behavior and the reported host distribution, while Microsoft event documentation supports the available traces. A relay making attribution harder is a conditional inference from those facts: the case report does not state that the actor selected it for concealment, so the inference must not be promoted to an observed stealth intention."
proposed_content:
  summary:
    zh: 攻击者在已受害环境的主机间转移工具或载荷，并通过内部传输路径的选择改变目标侧所见的来源与到达痕迹。
    en: An adversary moves tools or payloads among hosts in an already compromised environment and selects an internal transfer path that changes the apparent source and arrival traces on the destination.
  definition_and_concept:
    paragraphs:
      - zh: 横向工具传输指攻击者在取得至少一个内部立足点后，使其控制的工具、脚本或其他操作文件从一台受害环境主机到达另一台主机，以准备后续横向活动。核心事件是可识别文件内容或载荷谱系跨主机边界后的放置，而不是文件第一次从互联网进入环境，也不是目标主机随后是否运行该内容。
        en: Lateral Tool Transfer is the adversary's movement of controlled tools, scripts, or other operational files from one victim-environment host to another after obtaining at least one internal foothold, preparing later lateral activity. The defining event is placement of identifiable content or payload lineage across a host boundary, not the file's first entry from the internet and not whether the destination later runs it.
      - zh: 在 Niji 中，行为与匿迹结论需分别成立。SMB、SCP、RDP 文件重定向或同步客户端只是可能的传输实现；只有攻击者所选择的主体、来源、路径、时序或载荷落点使文件到达在既有业务流中更难分类或使源—中转—目标关系更难还原，才进入本技术的匿迹分析。
        en: Behavior and stealth conclusion must be established separately in Niji. SMB, SCP, RDP file redirection, and sync clients are possible implementations. This technique's stealth analysis applies only when attacker-selected principal, source, path, timing, or placement makes arrival harder to classify within established business traffic or makes the source-relay-destination relationship harder to reconstruct.
  stealth_characteristics:
    paragraphs:
      - zh: 此技术的可控变量位于文件内容与目标执行之间：攻击者可选择由哪台已存在内部主机发起复制、借用哪个合法共享关系，以及把同一内容分散放到哪些目标。目标的单点日志可能只显示正常的网络登录、共享访问和文件创建；若缺少源主机及中继的文件谱系，防守方难以知道这些局部事件是否属于同一次恶意投递。
        en: "Its controllable variables lie between file content and target execution: the adversary can choose which existing internal host initiates the copy, which legitimate share relationship carries it, and which destinations receive the same content. A destination's local logs may show only a network logon, share access, and file creation. Without source and relay file lineage, a defender may fail to recognize those local events as one malicious delivery."
      - zh: 该效果不是不可见。共享服务器仍可留下发起地址、账户、相对路径和请求权限，终端可留下创建文件、摘要及后续进程证据；若来源与目标遥测、审批记录和内容摘要被统一关联，传输路径反而可被完整重建。大规模 fan-out 的相同内容也可能增强可见度，不能一概称为低噪声。
        en: The activity is not invisible. A share server can retain source address, account, relative path, and requested rights, while endpoints can retain file creation, digest, and later process evidence. Correlating source and destination telemetry, approvals, and content hashes can reconstruct the path. Large fan-out of identical content may increase visibility, so it must not be described as inherently low noise.
  scope_boundary_definition:
    paragraphs:
      - zh: 纳入已受害环境内的工具或载荷从内部主机到另一主机的实际放置，且需要可指认攻击者对传输路径或来源关系的控制及相应的痕迹变化。只取得共享访问权、枚举共享、读取目标文件、跨域下载外部文件、凭据使用、创建远程会话和单纯获授权的软件同步均不足以成立。
        en: Scope includes actual placement of a tool or payload from one internal host onto another within the compromised environment, with identifiable adversary control of the route or source relationship and a corresponding trace change. Merely gaining share access, enumerating shares, reading destination files, downloading an external file, using credentials, opening a remote session, or performing authorized synchronization is insufficient.
      - zh: 与 T1072 的边界是管理平台的 job/package/agent 控制与结果执行：若关键行为是企业平台对目标发出受管任务，T1072 或既有执行技术拥有该控制链；文件到达只有在脱离平台语义后具有独立、可证的传输设计时才归此处。与 T1021 的边界是远程服务会话或交互控制；同一行动可以先建立会话、再复制文件，但不可把会话成功或运行成功当作传输证据。
        en: "The T1072 boundary is managed-platform job, package, and agent control leading to an outcome: T1072 or an existing execution technique owns that control chain when the decisive action is an enterprise platform sending a managed task. File arrival belongs here only if it has a separately evidenced transfer design outside that platform semantic chain. T1021 owns remote-service session or interactive control. An operation may open a session and then copy a file, but session success or process execution cannot stand in for transfer evidence."
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: 攻击者已控制内部终端、服务器或域控制器，准备把扫描工具、批处理脚本或勒索载荷送至另一批主机。可选择通过已有共享和内部源主机投递，使目标侧出现与正常管理复制相似的 SMB 访问及文件创建；后续的远程运行、计划任务或破坏属于另一个行为阶段。SAFEPAY 的 NETSCAN 和 LOCKBIT.WARLOCK 的批处理投递是直接记录的到达实例。
          en: An adversary controlling an internal workstation, server, or domain controller prepares to place a scanner, batch script, or ransomware payload on another set of hosts. Existing shares and an internal source can yield SMB access and file-creation traces that resemble administrative copying at the destination; later remote execution, scheduled tasks, or destructive effects are separate stages. The reported SAFEPAY NETSCAN and LOCKBIT.WARLOCK batch-file placements are observed arrival examples.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: 攻击者至少需要一个已受害源主机或可使源主机发起传输的权限，能够读取待转移内容，并拥有到目标共享或传输服务的写入通路。若声称中继源头间接化，还需要对中继的入站放置与后续出站复制具有时间和内容上的控制；仅发现同一共享上有文件不足以证明其控制了多跳路径。
            en: The adversary needs at least one compromised source host or authority to make it transfer, access to the intended content, and a write path to the destination share or transfer service. A relay-source-indirection claim additionally requires control of placement onto the intermediary and of its later outbound copy in time and content. Finding a file on one shared folder does not establish control of a multi-hop path.
      defender_model:
        paragraphs:
          - zh: 假定防守方能取得共享服务器的 5145、网络登录 4624、目标文件创建或文件系统审计，以及资产角色和批准发布记录，但采集范围、日志保留与散列覆盖并不总是一致。只看目标 EDR 时来源可能被压缩为一个受信内部地址；只看防火墙时加密传输不呈现文件内容。可关联的账户、源 IP、共享/相对路径、目标文件摘要与时间序列仍是恢复链路的关键残余证据。
            en: Assume the defender can collect share-server 5145 events, 4624 network logons, destination file creation or file-system audit, asset roles, and approved release records, but coverage, retention, and hashing are uneven. A destination-only EDR view can reduce provenance to a trusted internal address, while encrypted network monitoring cannot reveal file content. Correlatable account, source IP, share and relative path, destination digest, and event sequence remain key residual evidence.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary: {zh: 借内部文件传输关系降低到达痕迹的可区分性, en: Borrow internal file-transfer relationships to reduce arrival-trace distinctiveness}
      analysis:
        paragraphs:
          - zh: 当攻击者通过已有内部共享、获准通信的源主机和常见复制工具投递载荷，目标侧首先看到的是合法协议与正常文件操作形态，而非直接的外部入侵通道。载荷内容及跨主机位置仍可异常，因此这种特征伪装仅在具体来源、路径和业务基线使局部事件具有正常解释时成立；真实案例证明了内网 SMB 投递，降低可区分性是结合事件语义的推断。
            en: When an adversary delivers a payload through an existing internal share, a source host allowed to communicate, and ordinary copy utilities, the destination first sees legitimate protocol and file-operation shapes rather than a direct external intrusion channel. Content and cross-host placement can still be anomalous. Feature disguise therefore holds only when the particular source, path, and business baseline give the local event a plausible normal explanation. Incidents establish internal SMB placement; reduced distinctiveness is an inference from the event semantics.
      evidence_keys: [B8-T1570-REF-ATTACK, B8-T1570-REF-MANDIANT-2026, B8-T1570-REF-MS-5145]
      confidence: medium
proposed_subtechniques: []
defense_candidates:
  detection_strategies:
    - key: B8-T1570-DET-TRANSFER-LINEAGE
      name: {zh: 跨主机工具到达谱系关联, en: Cross-Host Tool Arrival Lineage}
      objective:
        zh: 将来源主机、共享写入、目标文件创建和批准分发范围连接成同一载荷到达图，找出未获批的内部投递与重复 fan-out。
        en: Join source host, share write, destination file creation, and approved distribution scope into one payload-arrival graph to find unauthorized internal placements and repeated fan-out.
      covered_subjects: [parent]
      analytic_keys: [B8-T1570-NJA-SMB-ARRIVAL]
  detection_analytics:
    - key: B8-T1570-NJA-SMB-ARRIVAL
      name: {zh: SMB 写入—目标文件创建—源角色差分, en: SMB Write to Destination File Creation and Source-Role Differential}
      platforms: [Windows]
      logic:
        zh: 在目标主机按 5145 的 SubjectLogonId、IpAddress、ShareName、RelativeTargetName 和 WriteData/AddFile 请求识别共享写入候选；用同一目标上的 4624 Type 3 和 LogonId 确定网络登录，用目标 EDR/Sysmon 11 或 SACL 支持的 4663 验证文件实际创建或写入、路径与摘要。把相同或可确认等价的文件摘要在 24 小时内按 source_host、destination_host、account 和目标角色聚合，比较已批准的软件分发源、变更单、目标集合与历史基线。若非分发角色的受害主机向多个目标写入同一操作工具，或目标写入后由其他内部主机再次向外复制，输出待调查的到达图；后续进程启动只增加情境，不作为“传输存在”的必要条件。
        en: On each destination, use 5145 SubjectLogonId, IpAddress, ShareName, RelativeTargetName, and WriteData/AddFile requests to identify candidate share writes. Join 4624 type-3 logons by LogonId on that destination and verify actual creation or write, path, and digest using destination EDR/Sysmon 11 or SACL-enabled 4663. Within a 24-hour investigation window, group identical or demonstrably equivalent digests by source host, destination host, account, and destination role, then compare approved distribution sources, change records, intended target sets, and historical baseline. Emit a reviewable arrival graph when a non-distribution compromised host writes the same operational tool to several targets or when an internal host receiving a file later copies it onward. Later process creation supplies context but is not required to establish transfer.
      data_requirements:
        - source_type: windows-security-detailed-file-share
          channel: Security/5145
          required_fields: [event.timestamp, host.id, SubjectLogonId, SubjectUserSid, IpAddress, ShareName, RelativeTargetName, AccessMask]
        - source_type: windows-security-network-logon
          channel: Security/4624
          required_fields: [event.timestamp, host.id, TargetLogonId, TargetUserSid, LogonType, IpAddress]
        - source_type: endpoint-file-creation
          channel: Microsoft Defender XDR/DeviceFileEvents
          required_fields: [Timestamp, DeviceId, ActionType, FolderPath, FileName, SHA1]
        - source_type: approved-distribution-inventory
          channel: null
          required_fields: [approval.id, source_host.id, destination_host.id, principal.id, artifact.hash, valid_from, valid_to]
      observables:
        - zh: 目标共享的写入请求与同路径文件创建相邻发生，且源 IP 对应普通工作站或异常管理源。
          en: A destination share write request occurs near creation of a file at the same path, with source IP resolving to an ordinary workstation or unexpected management source.
        - zh: 同一载荷摘要从非批准分发主机写入多个目标，或在一台目标落地后成为其向外复制的内容。
          en: The same payload digest is written from a nonapproved distribution host to multiple destinations or, after arrival on one host, becomes content copied onward from it.
      correlation_window: 24h_investigation_default_tune_to_operation
      dimensions: [host.id, source_host.id, destination_host.id, principal.id, share.name, file.path, file.hash, approval.id]
      false_positives: [approved_patch_or_software_release, incident_response_tool_push, backup_or_restore, administrator_file_copy]
      blind_spots: [SMB_audit_not_enabled, destination_hash_unavailable, encrypted_non_SMB_transfer, NAT_or_dynamic_IP_breaks_host_resolution, attacker_alters_content_per_host]
      tuning:
        zh: 以分发源角色、批准内容摘要、目标清单和维护窗口进行条件基线；不要因 C$ 或签名复制工具本身放行。对 5145 只把写权限视为请求，必须以文件创建或 4663 写入确认到达。若合法紧急响应无预登记，保留事件和审批补录路径；fan-out 阈值按网络规模及历史发布分布校准。
        en: Baseline by distribution-source role, approved artifact digest, target list, and maintenance window; do not allowlist C$ or a signed copy utility alone. Treat 5145 write rights as a request and require file creation or 4663 write use to confirm arrival. Retain an evidence and retrospective approval path for unregistered emergency response, and tune fan-out thresholds to network size and historical releases.
      evidence_keys: [B8-T1570-REF-MS-5145, B8-T1570-REF-MS-4624, B8-T1570-REF-MS-DEVICEFILE, B8-T1570-REF-MS-4663, B8-T1570-REF-MANDIANT-2026]
  mitigations:
    - key: B8-T1570-MIT-INTERNAL-TOOL-DELIVERY
      name: {zh: 内部工具投递路径与内容治理, en: Internal Tool Delivery Path and Content Governance}
      measures:
        - {key: limit-east-west-write, control_type: preventive, zh: 将主机间共享写入限制到具名分发源、身份和目标组，默认关闭不需要的管理共享写入与跨区 SMB/SSH 文件传输, en: Restrict host-to-host share writes to named distribution sources principals and destination groups and close unnecessary administrative-share writes and cross-zone SMB or SSH file transfer}
        - {key: approved-artifact-lineage, control_type: preventive, zh: 对批准分发记录内容摘要、来源、目标集合与有效期，在目标写入或运行时验证摘要和授权上下文, en: Record digest source destination set and validity for approved distributions and verify digest and authorization context on destination write or run}
        - {key: transfer-evidence-retention, control_type: detective-support, zh: 启用重点共享的 5145 与目标文件创建采集，保留源 IP、登录、路径和摘要的跨主机关联, en: Collect 5145 on priority shares and destination file creation and retain cross-host correlation among source IP logon path and digest}
      parent_application:
        use:
          zh: 对 T1570 所涉分发路径，将可写共享和主机间复制能力绑定到发布角色、限定源目标与已批准摘要；普通终端不得直接向大批目标写入可执行内容，并为事件响应保留有时限的例外通路。
          en: Bind writable shares and host-to-host copy capability relevant to T1570 to release roles, bounded source and destination sets, and approved digests. Ordinary endpoints should not directly place executable content on many targets; keep time-limited exceptions for incident response.
        expected_effect:
          zh: 降低攻击者使用任意已受害主机作为横向投递源的机会，并使未批准的目标到达与多主机扩散产生可核对的身份、内容和范围差分。
          en: Reduce the opportunity to use any compromised host as a lateral delivery source, and make unauthorized arrival or multi-host spread produce reviewable identity, content, and scope differences.
        limitations:
          zh: 被控的正式分发源、已批准但恶意的内容和未纳入审计的非 SMB 通道仍可绕过此控制；限制管理共享可能影响补丁、备份及应急响应，需要按业务所有者管理例外。
          en: A compromised approved distributor, approved but malicious content, or unaudited non-SMB channels can bypass this control. Restricting administrative shares can affect patching, backups, and emergency response, so exceptions need accountable owners.
      evidence_keys: [B8-T1570-REF-MS-5145, B8-T1570-REF-MANDIANT-2026]
