library_candidates:
  references:
    - {key: B8-T1570-REF-ATTACK, url: 'https://attack.mitre.org/versions/v19/techniques/T1570/', role: fixed_version_parent_anchor, note: 'Official local Enterprise 19.1 Excel row confirms T1570, Tactic Lateral Movement, 0 children; versioned page may not render through Web tool.'}
    - {key: B8-T1570-REF-MANDIANT-2026, url: 'https://cloud.google.com/blog/topics/threat-intelligence/ransomware-ttps-shifting-threat-landscape', role: independent_case_source, note: 'Direct observations: SAFEPAY NETSCAN staged over SMB on multiple hosts; LOCKBIT.WARLOCK NetExec on DC then SMB copies batch file to numerous hosts; separate intrusion staged ransomware via SMB before scheduled-task execution.'}
    - {key: B8-T1570-REF-LOCKERGOGA, url: 'https://unit42.paloaltonetworks.com/born-this-way-origins-of-lockergoga/', role: independent_case_source, note: 'Unit 42 observed manual LockerGoga SMB copies between computers; no relay or concealment intent established.'}
    - {key: B8-T1570-REF-MS-5145, url: 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5145', role: telemetry_semantics, note: '5145 contains source address, logon ID, share and relative target, requested access; access check alone does not prove bytes written.'}
    - {key: B8-T1570-REF-MS-4624, url: 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624', role: telemetry_semantics, note: 'Type 3 network logon and LogonId on destination support join with 5145.'}
    - {key: B8-T1570-REF-MS-4663, url: 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663', role: telemetry_semantics, note: 'With matching SACL, 4663 records rights used including WriteData and ObjectName; cannot assume enabled universally.'}
    - {key: B8-T1570-REF-MS-SYSMON, url: 'https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon', role: telemetry_semantics, note: 'Sysmon Event 11 FileCreate and Event 3 NetworkConnect are configurable; hash requires suitable endpoint enrichment.'}
    - {key: B8-T1570-REF-MS-DEVICEFILE, url: 'https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicefileevents-table', role: telemetry_semantics, note: 'DeviceFileEvents supplies file creation or modification, device, path, and SHA1; SHA256 is usually unpopulated and any hash may be absent.'}
    - {key: B8-T1570-REF-MANDIANT-2015, url: 'https://cloud.google.com/blog/topics/threat-intelligence/malware-lateral-move', role: general_intent_context, note: 'Mandiant says actors use built-in IT tools and protocols partly for evasion; not T1570-case-specific proof of intent.'}
    - {key: B8-T1570-REF-DROPBOX-SYNC, url: 'https://help.dropbox.com/sync/team-selective-sync', role: deferred_axis_semantics, note: 'Product documentation establishes automatic folder synchronization; not a malicious T1570 case.'}
  claims:
    - key: B8-T1570-CLM-PARENT-ARRIVAL
      statement_zh: 已受害环境中的工具跨主机到达是可与远程服务连接及后续执行分开的事件；SMB 现场案例证明该事件确有发生。
      statement_en: Tool arrival across hosts inside a compromised environment is separable from remote-service connection and later execution; SMB incident reports establish that arrival occurs.
      evidence_keys: [B8-T1570-REF-ATTACK, B8-T1570-REF-MANDIANT-2026, B8-T1570-REF-LOCKERGOGA]
      confidence: high
    - key: B8-T1570-CLM-OBSERVATION
      statement_zh: 仅看目标侧的内部共享写入和文件创建，可能无法还原更早的攻击者立足点；结合跨主机摘要、登录和来源角色可恢复到达谱系。
      statement_en: Destination-side internal share writes and file creation alone may not recover the earlier adversary foothold; cross-host digest, logon, and source-role joins can reconstruct arrival lineage.
      evidence_keys: [B8-T1570-REF-MS-5145, B8-T1570-REF-MS-4624, B8-T1570-REF-MS-DEVICEFILE, B8-T1570-REF-MANDIANT-2026]
      confidence: medium
      evidence_mode: inference_from_case_and_telemetry_semantics
  cases:
