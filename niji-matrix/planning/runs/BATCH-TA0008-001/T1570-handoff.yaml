research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
      - key: B8-T1570-AXIS-RELAY
        disposition: evidence-deferred
        zh: 中继源头间接化：必须证明同一载荷先到可控中继、再由中继向目标转移，并可把该路线与直接复制相比较；仅“在 DC 上暂存且向多主机复制”不足以证明更早一跳或隐藏意图。
        en: Relay source indirection requires proof that the same payload first arrived on a controlled intermediary and later moved from it to targets, plus a contrast against direct copy. Staging on a DC followed by copies to many hosts alone does not establish an earlier hop or concealment intent.
      - key: B8-T1570-AXIS-SYNC
        disposition: evidence-deferred
        zh: 同步客户端代替攻击进程完成目标文件创建，理论上把源端上传与目标端落地分到云审计和端点日志；现有证据只证明功能可行，没有合格的内部横向恶意案例。
        en: A sync client could create the destination file instead of the adversary process, splitting upload and arrival between cloud audit and endpoint logs, but current evidence establishes capability rather than a qualifying malicious lateral case.
      - key: B8-T1570-AXIS-TIMING
        disposition: evidence-deferred
        zh: 分时小批量复制可能降低单窗口流量，但当前没有能把攻击者选择时序、具体痕迹变化和防守差异同时钉住的案例。
        en: Small time-spaced copy batches might lower one-window traffic, but no case found jointly establishes attacker-selected timing, trace change, and defender difference.
      - key: B8-T1570-AXIS-PROTOCOL
        disposition: not-stealth-distinct
        zh: SMB、SCP、RDP 重定向、同步服务和目标平台只是实现媒介；不能以其名称划分 NJS。
        en: SMB, SCP, RDP redirection, sync service, and destination platform are implementation media, not NJS partitions by name.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 0 个 ATT&CK 子项没有降低原生变量搜索义务；已检查来源、同步、时序和协议四个方向。建议父级先以 deferred taxonomy 进入审查；不凭单个 fan-out 案例给中继变量正式子项。
      en: Zero ATT&CK children do not reduce native-axis inquiry; source, synchronization, timing, and protocol dimensions were checked. Recommend a deferred parent taxonomy for review and do not formalize the relay axis from one fan-out account.
