review_notes_zh: T1072 经 retain 准入跨战术复用 NJT-0078 及两项既有 Niji 原生子技术，已补写另一受管目标实际动作的横向结果门；T1570 经 adapt 准入新建 NJT-0130，独立文件到达与受管部署执行划界。T1570
  的中继、同步和时序子项证据不足，正式零 NJS、taxonomy deferred。复用与扩展部署 DET/NJA/MIT，另建针对 SMB 请求、目标实际文件创建和授权范围差分的 DET-000139、NJA-000143、MIT-000127。官方固定基线、GTIG
  事件与 Microsoft 日志文档各按可证范围使用；重复 4663 来源改用 REF-000379，REF-000477 已归档。矩阵、规划、查重、双语正文、12 项基础设施测试、73 项 Web 测试、API 与两项 Bundle 均通过，全部正式对象保持
  review 等待人工领域评审。TA0008 正式矩阵完成 2/9，剩余 7。
review_notes_en: T1072 was retained by reusing NJT-0078 and its two existing Niji-native children across tactics, with a lateral
  outcome gate requiring actual action on another managed host. T1570 was adapted as new NJT-0130, separating independently
  evidenced file arrival from managed deployment execution. Relay, sync, and timing children lack sufficient evidence, leaving
  zero formal NJS and deferred taxonomy. The deployment DET/NJA/MIT were reused and extended; DET-000139, NJA-000143, and
  MIT-000127 specifically address SMB requests, confirmed destination file creation, and authorized-scope differences. Fixed-baseline
  MITRE, GTIG incidents, and Microsoft audit documents are used within their supported conclusions. The duplicate 4663 source
  was replaced by REF-000379 and REF-000477 archived. Matrix, planning, deduplication, bilingual prose, 12 infrastructure
  tests, 73 Web tests, API, and both bundles pass. Formal objects remain in review pending human domain review. TA0008 has
  2 of 9 formal-matrix parents complete, with 7 remaining.
