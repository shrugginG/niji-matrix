children:
  - key: B8B-T1080-NJS-CONTENT-ID
    name: {zh: 既有共享对象语义原位污染, en: In-Place Semantic Taint of an Established Shared Object}
    recommendation: propose
    confidence: medium
    summary:
      zh: 攻击者保留内部消费者原本选择的共享对象身份，却改写其活动内容或执行语义，使下一次正常打开成为异机运行机会。
      en: An adversary preserves the shared object's identity already selected by internal consumers while changing active content or execution semantics so the next ordinary open becomes an opportunity to run code on another host.
    definition_and_concept:
      paragraphs:
        - zh: >-
            既有共享对象语义原位污染是攻击者在团队共享盘、映射网络驱动器或其他既有内部共享关系中，修改一个已有且被用户或自动消费者重复选择的对象，使其在原有名称、路径或业务角色下携带新的恶意执行语义。攻击者的直接目标是让另一台内部主机在照常读取文档、调用软件或处理共享工件时运行其代码；写入完成只是准备阶段，异机消费者实际取得恶意版本并触发才构成横向结果。
          en: >-
            In-Place Semantic Taint of an Established Shared Object changes an object that users or automated consumers already select repeatedly through a team share, mapped network drive, or another established internal sharing relation. The object carries new malicious execution semantics under its familiar name, path, or business role. The adversary's direct objective is to run its code when another internal host ordinarily reads a document, invokes software, or processes a shared artifact. The completed write is preparation; lateral outcome requires a separate consumer to obtain and trigger the malicious version.
        - zh: >-
            分类变量是“消费者仍选同一业务对象，但对象内部语义已变”，不是恶意内容是宏、远程模板、脚本、安装器还是二进制。Gamaredon 的宏/模板注入证明在既有 Word/Excel 文档内部改变运行语义；InvisiMole 的文件替换证明名称、图标和元数据可保留而文件已换为木马化版本，但其报告不能单独证明每个被替换对象都位于先前共享盘。两者合在一起支持这个可跨格式复现的变量，具体事件仍按各自来源的共享位置与消费者证据审定。
          en: >-
            The classification variable is that a consumer still selects the same business object while its internal semantics have changed, not whether the malicious content is a macro, remote template, script, installer, or binary. Gamaredon's macro and template injection establishes changed execution semantics inside existing Word and Excel documents. InvisiMole's file replacement establishes that names, icons, and metadata can persist after trojanization, but its report alone does not prove every replaced object had already resided on a shared drive. Together they support a repeatable cross-format variable, while each event still needs its own evidence of shared location and consumer action.
      evidence_keys: [B8B-T1080-REF-ATTACK, B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE]
    stealth_characteristics:
      paragraphs:
        - zh: >-
            既有共享对象语义原位污染让路径、熟悉标题和获取方式保持连续，恶意差异落在文件版本、嵌入宏、模板引用、可执行节、摘要或签名。只监视新文件投递、陌生下载来源或目标端“用户打开了熟悉文档”的规则，难以区分恶意版本和合法共同编辑；写入者和消费者往往在不同主机和时刻，使单点进程树缺少改写来源。这是由行为与审计语义推导出的条件性观察效应，不能从 Gamaredon 案例直接推出匿迹动机。
          en: >-
            In-Place Semantic Taint of an Established Shared Object keeps path, familiar title, and acquisition method continuous, while the malicious difference resides in version, embedded macro, template reference, executable section, digest, or signature. Rules that watch only new-file delivery, unfamiliar download origins, or a destination user opening a familiar document can fail to distinguish a malicious version from legitimate coauthoring. Writer and consumer commonly occupy different hosts and times, leaving the change origin absent from a local process tree. This is a conditional observation effect inferred from behavior and audit semantics; Gamaredon's case cannot establish a stealth motive.
        - zh: >-
            痕迹仍可恢复：对象旧/新版本、真实写入主体、内容结构差异、另一设备读取的精确版本，以及 Office 或安装器后继进程和网络连接。合法作者确会加入宏、改变模板或发布新版软件，因此版本差本身不是攻击证据；只有未批准写入、异常活动内容、异机消费与执行结果连接起来时，才可从完整性偏差推进至横向结果。应用控制阻断后，消费者可能只留下尝试或隔离记录。
          en: >-
            Residual evidence remains recoverable: before-and-after object versions, actual writer, structural content delta, exact version read on another device, and Office or installer successor process and network activity. Legitimate authors also add macros, change templates, or release software, so a version difference alone is not proof of attack. An unapproved writer, abnormal active content, cross-host consumption, and execution outcome must connect before an integrity deviation becomes a lateral outcome. If application control blocks execution, the consumer may leave only an attempt or quarantine record.
      evidence_keys: [B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE, B8B-T1080-REF-MS-4663, B8B-T1080-REF-MS-AUDIT]
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            本项纳入已有共享对象在同一消费者选择身份下被攻击者嵌入、改写或替换，且至少存在另一个内部消费者取得该恶意版本的证据。对象可以是文档或可执行软件，替换可改变底层 inode 或版本 ID；必须保留的是用户选择和业务语义上的“原对象”，而非所有字节或物理文件 ID。无授权编辑、原版本与新版本的可比较差异、恶意活动语义及消费者结果是判断主线。
          en: >-
            This child includes adversary insertion, alteration, or replacement of an established shared object under the same consumer-facing selection identity, with evidence that another internal consumer obtained the malicious version. The object may be a document or executable application; replacement may change inode or version ID. What persists is the user's selected business object, not every byte or physical file identifier. Unauthorized editing, comparable old and new versions, malicious active semantics, and consumer outcome are the judgment chain.
        - zh: >-
            全新文件只是放在共享盘且没有取代既有选择，不自动入此项；只把文件传到另一主机是 T1570，内部消息引导收件人执行是 T1534，受管平台发布则需检查 T1072 的 job/agent 链。若改动的是同名目录入口的目标绑定而原文档或目录内容本身未被恶意改写，归导航目标替身。正常版本升级、共同编辑、签名的批准软件更新和模板迁移是主要反例；本项也不能替代无异机消费者的 NJT-0087 本机持久二进制破坏。
          en: >-
            A new file merely placed on a share without replacing an established selection does not automatically fit. File arrival on another host belongs to T1570, an internal message inducing a recipient belongs to T1534, and managed-platform release requires checking T1072's job and agent chain. If the changed relation is a same-named directory entry's target while the original document or directory content is not maliciously altered, use Navigation-Entry Target Substitution. Approved version upgrades, normal coauthoring, signed software releases, and template migrations are key alternatives. This child also cannot replace NJT-0087's local persistent binary compromise where no separate internal consumer exists.
      evidence_keys: [B8B-T1080-REF-ATTACK, B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE]
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              攻击者控制能写映射共享盘的主机后，在下一个业务周期前遍历已存在的 Word/Excel 文档并插入宏或远程模板；同事稍后从原路径打开文件，可能在各自上下文里触发下载器。ESET 确认 Gamaredon 工具遍历可达驱动器、移动文档到 AppData 改写并放回原位，且分析者认为文档在同事间常被共享。该来源证明改写和潜在传播路径，不给每个同事的成功执行清单，也明确不应承载匿迹动机归因。
            en: >-
              After controlling a host able to write mapped shares, an adversary could traverse existing Word and Excel documents before the next business cycle and insert macros or remote templates. Colleagues later opening them from the original paths may trigger a downloader in their own contexts. ESET confirms Gamaredon tools traversed reachable drives, moved documents to AppData for alteration, and returned them, while observing that such documents are routinely shared among colleagues. This source proves the change and propagation opportunity, not a list of successful executions by every colleague, and it explicitly cannot carry a stealth-motive attribution.
          - zh: >-
              攻击者也可把组织常用安装程序或文档替换为保留名称、图标和元数据的木马化版本，使用户在维护或阅读任务中照常取得它。ESET 对 InvisiMole 记录了近三十种木马化应用、一个文档及中央服务器上安装程序可能广泛传播的风险；但报告首先说原文件在已受害计算机上被替换，故只有确认该对象随后被其他内部主机共享和执行时，才能把具体事件定为本项的横向结果。
            en: >-
              An adversary may also replace a familiar organizational installer or document with a trojanized version preserving name, icon, and metadata so users obtain it during maintenance or reading. ESET reports nearly thirty trojanized InvisiMole applications, one document, and the risk that an installer on a central server spreads widely. Its direct account first places replacement on an already compromised computer, however, so a specific event reaches this lateral child only when another internal host is shown to share and execute that object.
        evidence_keys: [B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE]
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要对既有共享对象有写权限或控制同步/发布身份，知道哪些对象被另一内部人或自动消费者反复使用，且能制作在目标 Office 或安装环境中生效的活动内容。宏注入要保持文档可打开并满足宏策略；安装器替换要尽量保留正常程序功能、界面和依赖，否则用户或版本校验会察觉。攻击者还需要等待独立消费者打开，无法单凭文件写入强迫他人执行。
              en: >-
                The adversary needs write authority over an established shared object or control of a sync or publishing identity, knowledge of which objects another internal person or automated consumer repeatedly uses, and active content compatible with the target Office or installation environment. Macro insertion must leave the document openable and pass macro policy; installer replacement must preserve ordinary function, interface, and dependencies as far as possible or users and version checks may notice. The adversary must then wait for an independent consumer and cannot force execution merely by writing a file.
            - zh: >-
                宏策略、签名、文件锁、只读发布区、受控版本、异步恶意软件扫描和用户权限限制这种机会。大量文件同时注入会产生突出的写入分布；恶意代码若在隔离预览或应用控制处被阻断，则不会获得目标控制。Gamaredon 工具还修改本机 Office 宏安全设置，但来源未证明它能同步改掉每一个将来消费者的设置，因此不能假定跨主机宏执行必然成功。
              en: >-
                Macro policy, signatures, file locks, read-only release areas, controlled versions, asynchronous malware scanning, and user privileges constrain this opportunity. Injection into many files at once creates a conspicuous write distribution. If isolated preview or application control blocks the code, destination control is not obtained. Gamaredon tools also altered Office macro security on the compromised system, but the source does not show they changed every future consumer's settings, so cross-host macro execution cannot be assumed.
          evidence_keys: [B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE, B8B-T1080-REF-MS-MACROS]
        defender_model:
          paragraphs:
            - zh: >-
                防守方至少在重点共享区保存对象前后版本、摘要、修改主体、路径和时间，Windows 文件服务器可用配置了 SACL 的 4663 看实际使用的写权限，SharePoint/OneDrive 可用 FileModified 与版本历史看云端改动。还需把映射驱动器或同步本地路径解析到共享对象 ID，才可能知道另一设备实际读取的是哪个版本。云 FileAccessed 和文件服务器 5145 只提供读取或访问检查线索，预览、预取及权限检查不等于用户有意打开或代码执行。
              en: >-
                Defenders need before-and-after versions, digests, modifier, path, and time for priority shared areas. A Windows file server can expose rights actually used through 4663 with an appropriate SACL, while SharePoint or OneDrive can expose cloud changes through FileModified and version history. Drive mappings or synced local paths must resolve to the shared object ID to tell which version another device actually read. Cloud FileAccessed and file-server 5145 provide read or access-check leads only; preview, prefetch, and permission checks do not equal deliberate user opening or code execution.
            - zh: >-
                目标端 Office、安装器或解释器的进程树、模块加载及网络结果可验证活动内容是否生效；批准发布者、变更单、签名和同版本可信原件用于排除正常协作。缺少被污染前版本、文档加密、仅见云下载而无端点进程、同步时版本 ID 丢失或日志短于打开延迟时，只能报告污染或已读级别。即使异常后继进程存在，也需证明它消费了该对象版本而非同时间段其他输入。
              en: >-
                The destination Office, installer, or interpreter process tree, module loads, and network outcomes can test whether active content took effect. Approved publisher, change record, signature, and a trusted same-version original distinguish normal collaboration. Without a pre-taint version, with encrypted documents, with cloud download but no endpoint process, when sync loses version identity, or when logs expire before the delayed open, the finding stays at taint or read level. Even an anomalous successor process must be tied to the consumed object version rather than a different input at the same time.
          evidence_keys: [B8B-T1080-REF-MS-4663, B8B-T1080-REF-MS-5145, B8B-T1080-REF-MS-AUDIT, B8B-T1080-REF-ESET-GAMAREDON]
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        confidence: medium
        summary: {zh: 原共享对象身份下承载已改写的执行语义, en: Changed execution semantics under an established shared-object identity}
        analysis:
          paragraphs:
            - zh: >-
                攻击者选择已有协作对象而非创建陌生文件，在原路径或名称下放入恶意活动内容，用户仍以熟悉业务动作取得它。实体外观延续而内容版本和运行语义改变，使按路径、文件名、发送来源或用户工作流作粗粒度分类的防守更难区分恶意版本；保留原功能的木马化文件会进一步降低用户侧异常。Gamaredon 证明已有文档被注入，InvisiMole 证明外观保留，但两者不能互相补成一个已观察到的“每个共享对象都成功横向执行”案例。历史版本、结构差分、签名和目标后继行为仍可拆穿该伪装。
              en: >-
                The adversary chooses an established collaborative object instead of creating an unfamiliar file and inserts malicious active content under its original path or name, so the user obtains it through a familiar business action. Visible identity persists while content version and runtime semantics change, weakening coarse classification by path, filename, source, or user workflow; a trojanized file preserving ordinary function further reduces user-visible anomalies. Gamaredon establishes injection into existing documents and InvisiMole establishes appearance retention, but they cannot be combined into one observed case in which every shared object executes successfully on another host. Historic versions, structural differences, signatures, and destination successor behavior can expose the disguise.
        evidence_keys: [B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE]
      - mechanism_ref: NM-BT
        role: secondary
        confidence: medium
        summary: {zh: 写入与异机打开分置于不同日志和时间, en: Write and cross-host open occupy different logs and times}
        analysis:
          paragraphs:
            - zh: >-
                原共享对象在源端被改写时，未来消费者尚无异常进程；另一设备按计划打开时，端点首先只见正常 Office 或安装器入口。若防守按单机或短窗口收集，异常 writer 与后来的首次执行互不关联，关键因果从常规视野中消失。这个效果需要具体日志保留与关联缺口才成立，不能说共享存储本身不可见；对象版本、写入账户、消费者设备、进程或网络结果都可能恢复链条。
              en: >-
                When the original shared object changes at the source, the future consumer has no anomalous process yet. When another device opens it on schedule, the endpoint initially shows an ordinary Office or installer entry. If defense collects by one device or a short window, the abnormal writer and later first execution may never join, leaving critical causality outside routine observation. The effect depends on a concrete retention or correlation gap and does not make shared storage inherently invisible. Object version, writer account, consumer device, process, and network result may restore the chain.
        evidence_keys: [B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE, B8B-T1080-REF-MS-4663, B8B-T1080-REF-MS-AUDIT]
    defense_difference:
      zh: >-
        先比较同一共享对象的旧/新内容、宏/模板/安装器活动语义及签名，再按版本 ID 或摘要将未批准 writer 与另一设备的实际消费和首个执行结果关联。检测侧重内容完整性与版本谱系；缓解侧重对象级写权限、审批发布、受信版本和消费者宏/应用控制。与导航目标替身的入口类型、隐藏原目录和链接解析分析不同。
      en: >-
        Compare old and new content, macro, template, or installer active semantics and signing for the same shared object, then join an unapproved writer to another device's actual consumption and first execution outcome by version ID or digest. Detection centers on content integrity and version lineage; mitigation centers on object-level write rights, approved release, trusted versions, and consumer macro or application control. This differs from the entry type, hidden original directory, and link-resolution analysis for Navigation-Entry Target Substitution.
      analytic_key: B8B-T1080-NJA-OBJECT-VERSION
      mitigation_key: B8B-T1080-MIT-SHARED-OBJECT-INTEGRITY
      evidence_keys: [B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE, B8B-T1080-REF-MS-4663, B8B-T1080-REF-MS-AUDIT, B8B-T1080-REF-MS-MACROS]
    research:
      limitations:
        paragraphs:
          - zh: >-
              Gamaredon 的现有文档注入是直接观察，但 ESET 说该组织似乎几乎不努力低调。其案例可证明内容改写、原位置恢复和传播机会，不能证明攻击者为降低可见度而选该路径，亦没有每个接收者的目标端完整结果。InvisiMole 的原件替换与名称、图标、元数据保留有强证据，但报告首先把替换放在已受害计算机，并没有逐一证明每个原件原本处于网络共享；正式 Case 必须分别保存这些限制。
            en: >-
              Gamaredon's insertion into existing documents is directly observed, but ESET says the group appeared to make almost no effort to stay under the radar. Its case supports content alteration, return to original locations, and propagation opportunity, not an attacker motive to reduce visibility or a complete destination outcome for each recipient. InvisiMole's replacement and preservation of names, icons, and metadata are strongly documented, but the report initially locates replacement on a compromised computer and does not show that every original had already resided on a network share. Formal Cases must preserve these distinct limits.
          - zh: >-
              效果强弱取决于消费者执行策略和防守对象版本能力。宏阻断、文件签名、受控软件仓库或只读共享可以直接阻断；没有精确消费者版本 ID 时，改写与后继进程的时间相邻只是相关性，不是因果证明。可控变量稳定，但跨文档、软件和 SaaS 的日志不统一，不得声称单一解析器或七天窗口普适。
            en: >-
              Effect strength depends on consumer execution policy and defender version capability. Macro blocking, file signing, controlled software repositories, or read-only shares can interrupt the chain. Without an exact consumer version ID, temporal proximity between change and successor process is correlation, not proof of causation. The controlled variable is stable, but document, software, and SaaS telemetry differs; no single parser or seven-day window is universally sufficient.
        evidence_keys: [B8B-T1080-REF-ESET-GAMAREDON, B8B-T1080-REF-ESET-INVISIMOLE, B8B-T1080-REF-MS-AUDIT, B8B-T1080-REF-MS-MACROS]
  - key: B8B-T1080-NJS-NAV-BINDING
    name: {zh: 共享导航入口目标替身, en: Shared Navigation-Entry Target Substitution}
    recommendation: propose_after_primary_review
    confidence: medium
    summary:
      zh: 攻击者用与原共享目录同名同外观的导航入口替代用户选择目标，使异机用户点击时先运行载荷、随后仍看到原目录。
      en: An adversary substitutes a navigation entry with the same name and appearance as an original shared directory so a user on another host runs a payload on click before still seeing the real directory.
    definition_and_concept:
      paragraphs:
        - zh: >-
            共享导航入口目标替身是攻击者改变内部共享目录的“用户所见入口→实际解析目标”关系，让另一个内部主体按惯常路径选择看似正常的目录或文件时，首先触发攻击者命令，再进入其原本想看的内容。攻击者的直接目标是通过受害者自己的导航动作在其主机上执行代码；同名、图标和最终呈现的真实目录为该替身维持业务可信度，但不能替代目标端执行证据。
          en: >-
            Shared Navigation-Entry Target Substitution changes the relation between a user-visible entry in an internal share and the target actually resolved by that entry. Another internal principal follows a familiar path to what looks like a normal directory or file, triggers attacker commands first, and then reaches the content originally sought. The adversary's direct objective is execution on the consumer's host through that user's navigation action. The same name, icon, and eventual presentation of the real directory preserve business credibility but cannot substitute for evidence of destination execution.
        - zh: >-
            这个概念的稳定变量是入口目标绑定而不是 LNK 格式。DirSharePivot 原作者在客户网络取证中发现真实目录被隐藏、同名目录图标的快捷入口出现、点击后恶意载荷复制并在用户本地执行，同时 Explorer 打开真实目录；作者随后公开了受控复现代码。前半是他报告的现场链，后半是技术复现，不应把复现脚本参数当作客户样本，也不需假设 RedCurl 的过程完全相同。
          en: >-
            The stable variable is entry-to-target binding, not the LNK format. In customer-network forensics, the DirSharePivot author found real directories hidden, same-named folder-icon shortcuts in their place, and a click that copied and executed a payload locally before Explorer opened the real directory; the author later published controlled reproduction code. The first account is his reported incident chain and the latter a technical reproduction. The reproduction's script parameters must not be attributed to the customer sample, nor must RedCurl be assumed to follow the identical procedure.
      evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-ATTACK]
    stealth_characteristics:
      paragraphs:
        - zh: >-
            共享导航入口目标替身保留用户看到的目录名、目录图标和点击后的正常内容，却把首次解析路径改成带命令的入口。恶意与正常导航的视觉特征相似，用户可以如原作者所访谈的员工那样认为入口合法；网络分段和仅依赖显式横向登录/扫描的告警，也可能因执行由每个用户自身在本地发起而错过跨主机传播。这里的匿迹效果有取证现场和作者的防守分析支持，但不代表所有部署都没有认证日志。
          en: >-
            Shared Navigation-Entry Target Substitution retains the directory name, folder icon, and expected content after a click while changing first resolution to an entry containing commands. Malicious and normal navigation look alike, and employees interviewed by the author considered the entries legitimate. Segmentation and alerts relying only on explicit lateral logons or scans can also miss propagation because each user starts execution locally. The observation effect is supported by the forensic account and the author's defense analysis, but it does not mean every deployment lacks authentication logs.
        - zh: >-
            残余痕迹与正文污染不同：原目录的隐藏属性、同名新入口、入口目标与参数、文件服务器的写入身份、点击者主机上 Explorer 到解释器/载荷的进程顺序，以及被复制的本地载荷。合法 DFS、目录迁移和受管快捷方式可能产生同名入口或保留正常导航，因此不能凭 LNK 存在定恶意；需证明入口目标带非批准命令以及另一设备实际运行。
          en: >-
            Residual traces differ from document taint: the original directory's hidden attribute, a same-named new entry, its target and arguments, the share writer, Explorer-to-interpreter or payload process order on the clicking host, and a locally copied payload. Legitimate DFS, directory migrations, and managed shortcuts may produce same-named entries or preserve navigation, so LNK presence alone is not malicious. The entry must resolve to an unapproved command and a separate device must actually run it.
      evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-MS-5145, B8B-T1080-REF-MS-4663]
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入攻击者对已有共享目录或同等导航对象的选择入口进行目标替换，要求入口原本服务于正常内部消费，另一内部设备选择了替身，且有恶意目标解析与执行证据。隐藏原目录、仿冒图标、利用快捷方式是该变量的常见组合，但每个辅助动作都不是 NJS 本身。若只有目录变隐藏而无人经替身消费，最多证明规避/篡改；若仅把脚本放到共享目录而用户没有选择原业务入口，则不满足导航替身。
          en: >-
            Scope includes adversary replacement of the selected entry for an established shared directory or equivalent navigation object. The entry must have served ordinary internal consumption, another internal device must select the substitute, and malicious target resolution and execution need evidence. Hiding the original directory, copying an icon, and using a shortcut are common components, but none alone defines this NJS. A hidden directory with no substitute consumer proves at most concealment or tampering. A script merely placed on a share without taking over the original business entry does not qualify.
        - zh: >-
            与兄弟项的互斥边界在于原内容可以保持完整，恶意变化发生于“入口指向哪里”；若共享文档或安装器本身嵌入恶意代码，归既有共享对象语义污染。T1036 的名称仿冒和 T1564 的隐藏属性只解释辅助特征，T1547 的自启动要求持久启动入口而本项由另一用户点击驱动，T1534 需要内部消息诱导而这里可没有消息。正常 DFS 链接、迁移快捷方式和管理员导航脚本是必须核对的反例。
          en: >-
            The sibling boundary is that original content may remain intact while the malicious change occurs in where the entry points. If a shared document or installer itself gains malicious code, use In-Place Semantic Taint. T1036 name masquerading and T1564 hidden attributes explain supporting features only; T1547 requires a persistent startup entry whereas this child is driven by another user's click; T1534 requires an internal inducement message that may be absent here. Legitimate DFS links, migration shortcuts, and administrator navigation scripts must be considered.
      evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-ATTACK]
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              在一个频繁访问的企业网络共享中，攻击者或恶意软件将真实目录置为隐藏并放入同名、同目录图标的可点击入口。用户按日常路径点击时，先发生用户本机载荷复制和执行，再正常打开真实目录；被害者可继续工作，其他可访问该共享的用户也会遇到同一入口。DirSharePivot 原作者称其在勒索软件客户网络取证中发现这一模式，多台工作站被感染，员工认为链接合法；文章没有公布逐台日志或所有感染节点的完整时间序列。
            en: >-
              In a frequently accessed enterprise network share, an adversary or malware hides real directories and installs clickable entries with the same names and folder icons. When a user follows the everyday path, a payload is copied and executed locally before the real directory opens; that user can continue working while other people with access to the share encounter the same entry. The DirSharePivot author reports finding this pattern in customer-network forensics after a ransomware infection, with multiple infected workstations and employees judging the links legitimate. The article does not publish per-device logs or a full timeline for every infected node.
          - zh: >-
              作者随后给红队编写了受控脚本，可对指定共享目录建立同类入口，并把其原始发现中较吵的 cmd 窗口和落盘载荷改成更安静的实现。后半说明入口绑定变量可被有意操纵，不能反过来声称客户现场样本使用了 mshta、内存载荷或红队函数参数。ATT&CK 另列 RedCurl 修改网络盘 LNK，但可访问 Group-IB 落地页没有链路细节，本附录不用它证明该子项现场过程。
            en: >-
              The author later wrote a controlled red-team script that creates similar entries for a selected share directory and changes the noisier cmd window and disk payload of the initial finding to a quieter implementation. This later section establishes that entry binding can be intentionally controlled, but does not show that the customer sample used mshta, an in-memory payload, or the red-team function's parameters. ATT&CK separately lists RedCurl modifying LNK files on network drives, but the accessible Group-IB landing page has no chain detail and is not used here to establish this child's field procedure.
        evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-ATTACK]
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要写入用户常访问的共享目录、改变原目录属性或位置、创建可被 Explorer 解释的入口，并掌握用户如何找到该目录。若要维持业务外观，还需保留原目录并在恶意命令后把用户带回真实内容；若入口目标无法解析、图标异常或真实目录不可达，用户可能提前发现。源端不必逐台掌握目标主机远程登录，但最终执行仍受每个消费者的用户权限和应用控制约束。
              en: >-
                The adversary needs write access to a frequently used shared directory, ability to change the original directory's attribute or position and create an Explorer-resolvable entry, and knowledge of how users find the directory. Preserving business appearance also requires keeping the real directory and returning users to it after the malicious command. A broken target, anomalous icon, or inaccessible real folder may expose the change. The source need not hold remote logon rights to every destination, but execution still depends on each consumer's privileges and application control.
            - zh: >-
                扩散速度依赖用户访问量而非攻击者能直接指定的时刻。DirSharePivot 客户案例在分段网络中发生，但不能由此推断所有网络分段都失效；其后作者提出的无窗口或内存执行改良，也不能自动赋给原始攻击者。写入审计、目录内容基线、LNK 目标解析和消费者端命令行采集越完善，替身越难持续。
              en: >-
                Propagation speed depends on user traffic rather than an attacker-controlled open time. The DirSharePivot customer incident occurred in a segmented network, but that does not imply all segmentation fails. The author's later quiet-window or memory-execution improvement cannot automatically be attributed to the original attacker. Stronger write audit, directory baselines, entry-target parsing, and consumer command-line collection make substitution harder to maintain.
          evidence_keys: [B8B-T1080-REF-DIRSHARE]
        defender_model:
          paragraphs:
            - zh: >-
                防守方需在高访问量共享上保存目录列表、隐藏属性、入口类型、链接目标/参数、创建者与变更时间，并把文件服务器的共享访问与终端 Explorer/解释器/载荷进程连接。Windows 5145 可补充请求源 IP、共享与相对目标，配置了 SACL 的 4663 可提供对象实际使用的写权限；它们单独不能证明用户点击。消费者端可观察本地复制、进程启动及后续传播，但必须将其与被点击的共享入口而非同一时间的其他文件关联。
              en: >-
                Defenders need directory listings, hidden attributes, entry type, link target and arguments, writer, and change time for busy shares, joined to file-server access and endpoint Explorer, interpreter, and payload processes. Windows 5145 adds requested source IP, share, and relative target; 4663 with a suitable SACL can show object write rights actually used. Neither alone proves a user click. The consumer endpoint can expose local copying, process launch, and subsequent spread, but these must be tied to the clicked shared entry rather than another file active at the same time.
            - zh: >-
                如果终端只报告本地载荷而没有共享入口来源，或者共享服务器只记读权限检查而不保留入口版本，跨端因果会断开。作者报告客户现场未见常规 4624 Type 3 横向认证痕迹，说明仅依靠这类告警的盲区；然而正常用户访问文件服务器仍可能产生其他认证或文件访问证据。合法 DFS、目录迁移和组织脚本会造成类似入口，防守方需用批准变更、签名目标、用户角色和执行结果判别。
              en: >-
                If endpoints report only a local payload without its shared-entry source, or the share server records only read access checks without entry versions, cross-host causality breaks. The author reports no ordinary 4624 type-3 lateral-authentication trace in the customer incident, illustrating a blind spot for alerts relying on that signal alone. Normal user access to a file server may still produce other authentication or file-access evidence. Legitimate DFS, directory migration, and organizational scripts create similar entries, so approved change, signed target, user role, and runtime outcome matter.
          evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-MS-5145, B8B-T1080-REF-MS-4663]
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        confidence: high
        summary: {zh: 同名目录外观遮蔽入口目标的恶意替换, en: Same-named folder appearance masks malicious entry-target substitution}
        analysis:
          paragraphs:
            - zh: >-
                攻击者隐藏真实共享目录并在原位置放入同名、目录图标的入口，把用户首次点击解析为先运行载荷再打开原目录。名称、图标和最终内容延续，使入口在用户眼里近似正常目录，员工访谈称其看作合法；不同的目标参数、隐藏属性及点击后的本地进程是残余差异。DirSharePivot 一手取证直接支撑这种外观与运行语义的分离，后续复现说明该变量可控。高置信仅指该实例的入口伪装机制，不表示所有同名快捷入口均恶意。
              en: >-
                The adversary hides real shared directories and places same-named, folder-icon entries where users expect them, resolving the first click to a payload before opening the original directory. Name, icon, and eventual content persist, so the entry resembles an ordinary folder to users, and interviewed employees considered it legitimate. Different target arguments, hidden attributes, and local processes after a click remain visible differences. DirSharePivot's first-hand forensics directly supports this separation of appearance and runtime semantics, while later reproduction demonstrates attacker control of the variable. High confidence applies to the instance's entry-disguise mechanism, not to every same-named shortcut.
        evidence_keys: [B8B-T1080-REF-DIRSHARE]
      - mechanism_ref: NM-BT
        role: secondary
        confidence: medium
        summary: {zh: 用户本地执行避开以远程认证和扫描为核心的横向视图, en: User-local execution evades lateral views centered on remote logons and scans}
        analysis:
          paragraphs:
            - zh: >-
                恶意入口驻留在共享盘，执行却由另一主机用户自己点击发起；每个消费者的进程发生在本地，攻击源没有直接向所有目标发起显式远程服务登录或扫描。DirSharePivot 作者在客户网络未见其预期的 4624 Type 3 横向痕迹，并指出仅依赖网络流和认证事件的 SIEM 可能失明。这个盲区只针对以这些信号为核心的检测模型；共享写入、链接目标和消费者端进程仍能被采集，不能表述为完全无日志。
              en: >-
                The malicious entry resides on a share, but execution starts when another host's user clicks it; each consumer process launches locally and the source need not initiate an explicit remote-service logon or scan to every target. The DirSharePivot author found no expected 4624 type-3 lateral traces in the customer network and noted that SIEM rules relying only on network flows and authentication can miss the method. This blind spot applies to that signal-centered defense model only. Share writes, link targets, and consumer processes remain collectible, so the action is not log-free.
        evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-MS-5145, B8B-T1080-REF-MS-4663]
    defense_difference:
      zh: >-
        先对原目录和同名入口建立类型、属性及目标绑定差分，再将入口 writer 与异机 Explorer 点击后的命令/载荷进程连接；可对异常导航目标与无审批隐藏原目录设定隔离。缓解重点是阻止普通共享 writer 改目录入口和目标、限制消费者从共享快捷入口启动解释器。仅比较文档内容摘要或宏不会覆盖这一变量。
      en: >-
        First compare original directories and same-named entries for type, attributes, and resolved target, then connect entry writer to another host's Explorer click and command or payload process. Quarantine anomalous navigation targets or unapproved hiding of originals. Mitigation focuses on preventing ordinary share writers from changing directory entries and targets and constraining consumer interpreters launched by shared shortcuts. Comparing document content digests or macros alone does not cover this variable.
      analytic_key: B8B-T1080-NJA-NAV-ENTRY
      mitigation_key: B8B-T1080-MIT-SHARED-OBJECT-INTEGRITY
      evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-MS-5145, B8B-T1080-REF-MS-4663]
    research:
      limitations:
        paragraphs:
          - zh: >-
              DirSharePivot 文章前段报告真实客户取证，包含多台工作站受害、隐藏原目录、同名入口、用户点击后本地复制执行及真实目录继续打开；这是第二子项的一手现场支持。报告未公开各设备日志、样本谱系、精确时间戳或攻击者最初获得共享写权的步骤，不能据此量化覆盖率、比较所有目标的 4624 情况或证明每次点击都感染。作者后段的红队代码是复现和改良，不属于客户现场载荷。
            en: >-
              The first part of the DirSharePivot article reports real customer forensics with multiple infected workstations, hidden original directories, same-named entries, local copy and execution after user clicks, and continuation into the real directory. It is first-hand field support for the second child. The report does not publish each device's logs, sample lineage, exact timestamps, or initial acquisition of share-write authority, so it cannot quantify coverage, compare 4624 presence across every target, or prove every click infected a host. The later red-team code is reproduction and improvement, not the customer payload.
          - zh: >-
              ATT&CK 把 RedCurl 的修改 LNK 列为 T1080 过程实例，然而可访问的 Group-IB 报告落地页没有技术细节。本子项不能借该页面填补 DirSharePivot 缺失的现场日志。DFS 和受管目录迁移可能给出相同的目录外观，且安全策略可能阻断恶意目标；只有入口目标、原目录状态、异机消费者及执行结果四段连通，才能从仿冒风险推进到已证横向移动。
            en: >-
              ATT&CK lists RedCurl's modified LNK files under T1080, but the accessible Group-IB report landing page has no technical detail. This child cannot use that page to fill gaps in DirSharePivot's field logs. DFS and managed directory migration can produce the same folder appearance, and security policy may block the malicious target. Entry target, original-directory state, separate internal consumer, and execution outcome must connect before masquerade risk becomes established lateral movement.
        evidence_keys: [B8B-T1080-REF-DIRSHARE, B8B-T1080-REF-ATTACK, B8B-T1080-REF-GROUPIB]
