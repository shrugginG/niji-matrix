handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0008-002
work_item_ref: WORK-TA0008-T1080
temporary_key_prefix: B8B-T1080
candidate:
  source_type: attack
  source_attack_id: T1080
  name:
    zh: 污染共享内容
    en: Taint Shared Content
recommendation:
  decision: adapt
  confidence: medium
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1080 定义为向共享盘或内部代码仓库中的内容加入恶意程序、脚本或利用代码，使另一系统的使用者打开后可能运行攻击者代码。ESET 对 Gamaredon 既有文档宏/模板注入和
        InvisiMole 对原有文件的木马化替换提供直接行为证据，DirSharePivot 给出目录入口替身的技术实证，因此保留共享内容到内部消费者这一父行为。Niji 需要把准入收紧为攻击者控制共享对象的内容或导航语义，并能说明另一内部消费者的读取/打开如何通向执行或可控状态；单纯把文件放到共享盘、正常协作修改、以及没有消费者证据的存储异常不能被称为已完成横向移动。
      en: ATT&CK Enterprise 19.1 defines T1080 as adding malicious programs, scripts, or exploit code to content in shared
        drives or internal code repositories so a user on another system may run attacker code when opening it. ESET directly
        documents Gamaredon's injection into existing documents and InvisiMole's trojanized replacement of original files,
        while DirSharePivot technically demonstrates a substitute directory entry. These sources support the shared-content-to-internal-consumer
        parent behavior. Niji should narrow admission to adversary control of shared-object content or navigation semantics
        with a defensible path from another internal consumer's read or open to execution or controllable state. Merely placing
        a file on a share, ordinary collaborative editing, or storage anomalies without a consumer cannot be called completed
        lateral movement.
    - zh: 共享对象原有路径、文件名或用户预期工作流可使一次恶意改写看起来像日常协作，且写入与目标执行落在不同主机和时间。这个观察差异是从事件机制和日志语义得出的条件性推断，不等于所有公开案例都陈述了匿迹意图。尤其 ESET 明言 Gamaredon
        的行动重快速扩散而不重低调，故该案例只证明注入、还原文件位置与潜在后续打开，不能用来证明行动者意在隐蔽。父级建议 adapt 而非 retain，是为了把 ATT&CK 的一般载荷投放与 Niji 的可控匿迹变量、消费者结果门明确分开。
      en: Existing paths, filenames, and expected user workflows can make a malicious change resemble routine collaboration,
        while the write and destination execution occur on different hosts and at different times. This observation effect
        is a conditional inference from event mechanics and audit semantics, not a claim that every reported actor intended
        concealment. ESET explicitly says Gamaredon prioritized rapid spread over staying under the radar, so its case proves
        injection, restoration to the original document location, and a possible later open, not stealth intent. Adapt is
        preferable to retain because the general ATT&CK payload-placement scope must be separated from Niji's controlled stealth
        variable and consumer-outcome gate.
  original_attack_subtechniques_imported: false
proposed_content:
  summary:
    zh: 攻击者改写内部共享内容或其导航入口，使另一内部消费者沿熟悉路径打开恶意对象；写入与目标执行被正常共享工作流分隔。
    en: An adversary changes internal shared content or its navigation entry so another internal consumer opens a malicious
      object through a familiar path, with writing and destination execution separated by routine sharing workflow.
  definition_and_concept:
    paragraphs:
    - zh: 污染共享内容是攻击者在已进入受害环境后，改变多人或多主机共用的文件、软件、文档、仓库内容或导航入口，使另一内部用户或自动消费者在原有共享工作流中读取、打开或调用攻击者控制的内容，进而在其主机上运行代码或产生可控结果。其直接目的不是把文件搬到另一主机，而是把既有共享对象变成跨主机执行的触发面；攻击者的写入与消费者的动作必须可分别识别。
      en: Taint Shared Content occurs after an adversary enters an environment and changes a file, application, document,
        repository item, or navigation entry used by multiple people or hosts. Another internal user or automated consumer
        then reads, opens, or invokes attacker-controlled content through the established sharing workflow, leading to code
        execution or a controllable outcome on that consumer's host. Its direct purpose is to turn an existing shared object
        into a cross-host trigger, rather than simply move a file to another host. The adversary's write and the consumer's
        action must be identifiable separately.
    - zh: 此概念以共享对象的信任和消费关系为锚，不以 SMB、SharePoint、宏、LNK、软件安装包或代码仓库等载体分割。恶意代码可被嵌入原文件、替换原对象，也可通过仿冒导航入口改变用户实际打开的目标；只有说明被改变的对象如何沿共享路径交给另一内部主体，才能从文件污染风险上升为
        TA0008 横向结果。消费者若只是下载或预览而没有后续执行/控制证据，应保留为待证链段。
      en: The concept is anchored in the trust and consumption relationship of the shared object, not in SMB, SharePoint,
        macros, LNK files, installers, or code repositories as media. Attacker code may be grafted into an original file,
        replace it, or be reached through a substituted navigation entry. The changed object must be shown to reach another
        internal principal through a shared path before file-taint risk becomes a TA0008 lateral outcome. Download or preview
        without later execution or control remains an unproven chain segment.
  stealth_characteristics:
    paragraphs:
    - zh: 污染共享内容借用已知对象、常用路径和同事间真实协作，让被害者的打开动作仍符合岗位任务。既有对象原位改写主要把差异藏在版本、嵌入活动内容或哈希里；导航替身则把差异移到入口类型、目标参数或隐藏的原目录，表面仍可呈现熟悉名称和预期内容。防守方若只看共享写入量，或只看目标端由
        Office、Explorer/安装程序启动的进程，容易丢失“谁何时把对象改成恶意版本”的跨主机因果。
      en: Tainted shared content borrows a known object, familiar path, and real colleague-to-colleague workflow so the consumer's
        open action can still fit the job. In-place modification puts the difference into version history, embedded active
        content, or hash; a navigation substitute moves it into entry type, target arguments, or a hidden original directory
        while preserving a familiar name and expected content. A defender looking only at share-write volume or only at an
        Office, Explorer, or installer process on the destination can miss who changed the object into the malicious version
        and when.
    - zh: 残余痕迹包括写入主体与源地址、对象 ID/路径、版本或摘要变化、活动内容与链接目标、消费者身份/设备、首次异常子进程或网络结果。共享文件被真实业务用户频繁编辑时，内容差异本身不说明恶意；有版本库、写入审计、消费者端进程谱系与批准变更记录的环境，可以重建因果。若宏阻断、应用控制或安全预览阻止执行，污染仍是风险事件，但不能宣称目标已被控制。
      en: Residual traces include writer principal and source address, object ID or path, version or digest change, active
        content and link target, consumer identity and device, and first anomalous child process or network result. A content
        difference alone is not malicious where legitimate users frequently edit shared files. Version history, write audit,
        consumer process lineage, and approved-change records can reconstruct causality. If macro blocking, application control,
        or safe preview prevents execution, taint remains a risk event but destination control is not established.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入条件是原已被内部主体共同访问或预期访问的对象/入口被攻击者实质改写，且另一内部消费者沿该共享关系读取或触发恶意语义；将写入、消费者动作与异常结果分级记录。合法共同编辑、受控发布、恶意文件仅被放置但无人消费、或单机软件被篡改却未进入跨主机共享关系，均不能直接满足
        T1080 横向结果。对象摘要不匹配只说明完整性偏差，仍要排除批准更新、同步冲突、模板改动和安全扫描造成的正常变化。
      en: Scope requires substantive adversary change to an object or entry already accessed or expected to be accessed by
        internal principals, followed by another internal consumer reading or triggering its malicious semantics. The write,
        consumer action, and anomalous outcome should be recorded as distinct evidence grades. Authorized coauthoring, approved
        release, a malicious file merely staged but never consumed, or tampering with software on one host outside a cross-host
        sharing relation cannot establish a T1080 lateral result. A mismatched digest establishes an integrity deviation only
        until approved updates, synchronization conflict, template maintenance, and security scanning are ruled out.
    - zh: T1534 的主导对象是来自已受害内部身份的定向消息及收件人动作；若同一行动先用消息引人打开被污染共享文件，可分别记录诱导与文件污染，不能把邮件附件直接算作共享存储污染。T1570 只需证明文件到达另一主机，不包含原共享对象被改写和消费者触发；T1072
        则以受管 job、包、agent 与首次执行为主导链。对共享盘中的二进制改写可与 NJT-0087 的本机持久二进制破坏并存，但此处的关键是另一内部消费者。T1036/T1564 式伪装或隐藏是辅助动作，不能单独代替共享消费链。
      en: T1534 centers on a targeted message from a compromised internal identity and its recipient's action. An operation
        that uses a message to draw someone to a tainted shared file may record both inducement and file taint, but an email
        attachment alone is not shared-storage taint. T1570 proves only arrival on another host, without modification of an
        established shared object and consumer trigger; T1072 centers on the managed job, package, agent, and first-execution
        chain. A modified binary on a share may coexist with NJT-0087's local persistent binary compromise, but another internal
        consumer is decisive here. T1036 or T1564 disguise or hiding are supporting acts, not substitutes for the shared-consumption
        chain.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者控制一台可写团队共享盘、映射驱动器或共用软件目录的内部终端，在同事下次打开常用文档、目录或安装包前把原对象改成含有恶意活动内容的版本。Gamaredon 的模块在可达驱动器上寻找 Word/Excel 文档，插入宏或远程模板后放回原位置；InvisiMole
          把组织原有安装程序和文档替换为同名、同图标和相似元数据的木马化文件。这些实例说明“正常取得共享对象”如何成为另一个主机的触发机会，但单份公开报告未必记录每一台最终消费者的完整执行谱系。
        en: An adversary controls an internal endpoint with write access to a team share, mapped drive, or common software
          directory and alters an original document, navigation entry, or installer before colleagues next open it. Gamaredon's
          module searches reachable drives for Word and Excel documents, inserts macros or remote templates, and returns them
          to their original locations. InvisiMole replaces an organization's existing installers and documents with trojanized
          versions preserving names, icons, and similar metadata. These examples show how normal acquisition of a shared object
          creates a trigger opportunity on another host, although a public report does not necessarily record every final
          consumer's complete execution lineage.
      - zh: 在频繁访问的网络目录中，攻击者也可隐藏真实目录，放置同名外观的导航替身，使用户按惯常方式进入目录时先触发恶意命令，随后仍见到预期目录。DirSharePivot 原作者据客户网络取证记录了隐藏原目录、同名入口、用户点击后本地执行及继续打开真实目录，并另给受控复现；该现场报告没有逐机日志。RedCurl
          的共享盘 LNK 修改仅由 ATT&CK 过程条目记载，可访问的 Group-IB 落地页不能提供本子项的现场细节。
        en: In a frequently used network directory, an adversary may hide the real directory and place a same-looking navigation
          substitute so a user following the usual path first triggers malicious commands and then sees the expected directory.
          The DirSharePivot author reports customer-network forensics documenting hidden original directories, same-named
          entries, local execution after user clicks, and continued opening of the real directory, then provides a controlled
          reproduction; the field account lacks per-device logs. ATT&CK records RedCurl's modified LNK files on network drives,
          but the accessible Group-IB landing page cannot supply this child's field details.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者必须拥有对被广泛使用的共享对象或父目录的写入能力，了解消费者实际选择的文件/入口、应用对宏或链接的处理、安全策略及打开周期。原位改写需要保持文档/安装程序可用并能在其他用户上下文运行；导航替身需要控制名称、图标、入口目标及真实内容的后续呈现。只知道共享盘位置或能上传任意文件而无法影响既有消费者选择，不能构成这里的匿迹变量。
          en: The adversary needs write authority over a widely used shared object or parent directory and knowledge of what
            consumers actually select, how their application handles active content or links, applicable security policy,
            and open cadence. In-place taint must keep the document or installer usable and execute in another user's context;
            navigation substitution requires control of name, icon, target, and later presentation of the real content. Knowing
            a share location or being able to upload an arbitrary file without influencing established consumer selection
            does not establish this stealth variable.
        - zh: 攻击者也受文件锁、版本审计、签名与宏限制、SharePoint 异步恶意内容扫描、只读共享和用户权限限制。将同一修改推向大量共享文档会增加写入异常并可能破坏协作；消费者不开启活动内容、使用隔离预览或无权运行后继命令时，尝试只停留在污染阶段。来源没有证明攻击者能可靠控制每次打开时间或每台消费者的安全状态。
          en: File locks, version audit, signing and macro restrictions, asynchronous malware scanning in SharePoint, read-only
            shares, and user privileges constrain the adversary. Applying the same change to many shared documents increases
            write anomalies and may disrupt collaboration. If consumers do not enable active content, use isolated preview,
            or cannot run a successor command, the attempt stops at taint. The sources do not establish reliable attacker
            control over each open time or each consumer's security state.
      defender_model:
        paragraphs:
        - zh: 假定防守方在高价值共享上取得文件服务器 4663 实际写入、5145 访问检查、版本/摘要和权限变更，或在云共享中取得 FileModified、FileAccessed、文件版本与编辑者；消费者端还需主机/用户、对象打开、进程及网络结果。通过对象
            ID 或规范化路径、版本、写入身份与消费者设备连接两端。共享服务的 FileAccessed 或 5145 只表示读/权限检查，不能自动等于真实执行；微软说明预览和预取也可能产生访问记录。
          en: Assume defenders collect actual file-server writes through 4663, access checks through 5145, version or digest
            and permission changes on priority shares, or FileModified, FileAccessed, version, and editor data in cloud sharing.
            Consumer endpoints also need host and user identity, object open, process, and network outcomes. Object ID or
            normalized path, version, writer, and consumer device join both sides. Share-service FileAccessed or 5145 indicates
            a read or access check, not necessarily execution; Microsoft documents that previews and prefetch can also produce
            access records.
        - zh: 缺少被污染前版本、共享与终端日志时钟不齐、映射驱动器的本地路径无法还原到 UNC、云同步使真正打开设备脱离 Web 审计、以及加密或无宏分析能力，都会切断因果。防守方仍可对高价值目录做定期完整性比较、解析导航入口及活动内容，并以异常子进程/网络结果验证消费者阶段；合法协作或批准发布必须以作者、工单、签名及版本基线区别。
          en: Missing pre-taint versions, unsynchronized share and endpoint clocks, inability to map local drive letters to
            UNC paths, cloud sync that separates the opening device from web audit, and encrypted content or absent macro
            analysis all break causality. Defenders can still compare integrity for high-value paths, parse navigation entries
            and active content, and verify the consumer stage through anomalous child processes or network outcomes. Author,
            change record, signature, and version baseline distinguish legitimate collaboration or approved release.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 共享对象保留熟悉名称与业务用途而改变内部语义
      en: Familiar shared-object identity carries changed internal semantics
    analysis:
      paragraphs:
      - zh: 攻击者在原共享路径内改写被信任的对象或以同名入口替代它，使消费者仍看到熟悉的名称、图标、文件内容或工作目录。变化从显眼的新投递移到版本、嵌入代码、链接目标与隐藏原对象；只按路径、文件名或“用户按正常流程打开”判断的防守会把恶意触发与合法协作混同。InvisiMole
          对名称、图标和元数据的保留及 DirSharePivot 的仿冒入口直接证明这一设计，Gamaredon 证明原文档内容注入而非其隐蔽动机。可信版本差、入口类型/目标解析与执行结果仍可揭示差异。
        en: The adversary changes a trusted object at its original shared path or substitutes a same-named entry so consumers
          still see a familiar name, icon, document, or working directory. The difference shifts from an obvious new delivery
          to a version, embedded code, link target, or hidden original object. Defenses based only on path, filename, or the
          fact that a user followed a normal workflow may conflate the malicious trigger with collaboration. InvisiMole's
          preservation of names, icons, and metadata and DirSharePivot's substitute entry directly establish this design;
          Gamaredon establishes document injection but not a concealment motive. Trusted-version differences, parsed entry
          type or target, and execution results remain observable.
    evidence_keys:
    - B8B-T1080-REF-ATTACK
    - B8B-T1080-REF-ESET-INVISIMOLE
    - B8B-T1080-REF-DIRSHARE
    confidence: medium
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 共享写入与异机消费者执行相隔离而削弱单点因果
      en: Shared writes and execution on another host separate local causal views
    analysis:
      paragraphs:
      - zh: 内容被写入共享盘时，目标主机尚未启动恶意代码；另一个用户以后正常打开时，目标端主要呈现其自身 Office、Explorer 或安装程序活动。单看写入日志无法知道哪台终端成为消费者，单看目标进程又可能看不到较早的异常 writer。写入身份、对象版本、消费者设备及首次异常进程/网络关联可以恢复链条。此机理是由已记录的传播流程和审计字段推导出的观察差异，不是
          ESET 对 Gamaredon 匿迹意图的判断。
        en: When content is written to a share, the destination host has not yet launched attacker code. When another user
          later opens it normally, the destination mainly shows its own Office, Explorer, or installer activity. A write log
          alone cannot identify the eventual consumer, while destination process telemetry may omit the earlier abnormal writer.
          Writer identity, object version, consumer device, and first anomalous process or network event can restore the chain.
          This mechanism is an observation inference from documented propagation flow and audit fields, not ESET's judgment
          that Gamaredon sought stealth.
    evidence_keys:
    - B8B-T1080-REF-ESET-GAMAREDON
    - B8B-T1080-REF-ESET-INVISIMOLE
    - B8B-T1080-REF-MS-4663
    - B8B-T1080-REF-MS-AUDIT
    confidence: medium
proposed_subtechniques:
- key: B8B-T1080-NJS-CONTENT-ID
  name:
    zh: 既有共享对象语义原位污染
    en: In-Place Semantic Taint of an Established Shared Object
  disposition: propose
  confidence: medium
  stable_variable:
    zh: 攻击者保留消费者原本选择的对象路径或业务身份，同时改变同一共享对象的可执行语义；嵌入宏、模板引用、恶意安装前奏或整文件替换是不同实现。
    en: The adversary preserves the path or business identity a consumer already selects while changing that shared object's
      executable semantics; inserted macros, template references, malicious installer preludes, and whole-file replacement
      are implementations.
  prerequisites:
    zh: 对既有共享对象的写权限、可恢复原有打开体验、另一内部消费者会获取该对象及其执行策略允许恶意部分生效。
    en: Write access to an established shared object, ability to preserve its expected open experience, a separate internal
      consumer likely to obtain it, and a consumer execution policy that permits the malicious part.
  trace_change:
    zh: 路径、标题或图标延续，但对象版本、正文/宏/模板关系、摘要或签名改变；目标仍从原路径打开，后继进程或网络目的地偏离正常版本。
    en: Path, title, or icon persists while object version, body, macro or template relationship, digest, or signature changes;
      the destination still opens the original path but a successor process or network destination deviates from the normal
      version.
  defender_observation_difference:
    zh: 按新文件名或外部下载筛查会漏掉原对象的内容差分；需将历史版本和 writer 连接到异机消费者的实际版本与执行结果。
    en: Screening only new filenames or external downloads misses the content delta in an established object; defenders need
      to connect historic version and writer to the actual version consumed on another host and its execution outcome.
  sibling_boundary:
    zh: 本项改变被选择对象的内部内容或运行语义；若攻击者改的是导航入口的目标绑定且原内容可不变，归下一项。单机持久二进制破坏没有异机共享消费时属 NJT-0087。
    en: This child changes the selected object's internal content or runtime semantics; changing the navigation entry's target
      binding while the original content may remain intact belongs to the next child. Local persistent binary compromise without
      cross-host shared consumption belongs to NJT-0087.
  scenario:
    zh: Gamaredon 的已存在 Word/Excel 文档宏或远程模板注入，以及 InvisiMole 保留组织原文件名称/图标的木马化替换，是两种跨格式实例；不把它们拆成宏类和二进制类。
    en: Gamaredon's macro or remote-template injection into existing Word or Excel documents and InvisiMole's replacement
      preserving organizational file names and icons are cross-format examples, not separate macro and binary children.
  defense_difference:
    zh: 以对象 ID/路径的前后版本、嵌入活动内容或受信软件摘要为中心，与写入者、消费者端实际版本和首个异常结果关联；导航目标解析不是此项的核心。
    en: Center detection on before-and-after versions by object ID or path, embedded active content or trusted software digest,
      joined to writer, consumer's actual version, and first anomalous outcome; navigation-target parsing is not central here.
  evidence_keys:
  - B8B-T1080-REF-ESET-GAMAREDON
  - B8B-T1080-REF-ESET-INVISIMOLE
  - B8B-T1080-REF-MS-AUDIT
  evidence_limit:
    zh: ESET 证明植入与预期扩散机制，不逐台证明所有后续消费者成功运行；Gamaredon 案例尤其不能用于匿迹意图归因。
    en: ESET establishes implantation and the expected propagation mechanism, not successful execution on every later consumer;
      the Gamaredon case especially cannot establish stealth intent.
- key: B8B-T1080-NJS-NAV-BINDING
  name:
    zh: 共享导航入口目标替身
    en: Shared Navigation-Entry Target Substitution
  disposition: propose_with_primary_review
  confidence: medium
  stable_variable:
    zh: 攻击者把原共享导航入口隐藏或移开，以同名同外观的可触发入口承接原本的用户选择，改变点击所解析到的命令或目标；变量是目标绑定，不是 LNK 格式。
    en: The adversary hides or moves an original shared navigation entry and places a same-named, same-looking trigger in
      its selection path, changing the command or target resolved by a click. The variable is target binding, not LNK format.
  prerequisites:
    zh: 可写共享目录、能控制入口名称/图标与解析目标、原目录或文件仍可随后呈现，以及其他内部用户实际按此入口导航。
    en: Write access to a shared directory, control over entry name, icon, and resolved target, ability to present the original
      directory or file afterward, and another internal user actually navigating through that entry.
  trace_change:
    zh: 同名目录附近出现新快捷入口、原目录隐藏属性或位置变化，入口目标包含脚本/命令并在打开时产生子进程，随后真实目录打开。
    en: A new shortcut-like entry appears under a name matching a nearby directory, the original directory's hidden attribute
      or location changes, the entry target contains script or command behavior, and opening it creates a child process before
      the real directory appears.
  defender_observation_difference:
    zh: 只看用户见到的目录名称或最终 Explorer 窗口会误判为正常导航；必须比较入口类型、目标参数、原对象属性以及目标端进程顺序。
    en: A defender seeing only the directory name or final Explorer window may classify normal navigation; entry type, target
      arguments, original-object attributes, and destination process order expose the substitution.
  sibling_boundary:
    zh: 此项以导航解析关系被置换为必要条件；若原共享文档或安装包内部语义被改写而选择入口不变，归上一项。隐藏文件或仿冒名称本身属 T1564/T1036 的辅助动作，只有另一内部消费者经入口触发才构成本项。
    en: Substitution of the navigation-resolution relation is required here. If an original document or installer changes
      internally while the selection entry remains the same, use the previous child. Hiding or masquerading alone are supporting
      T1564 or T1036 actions; this child needs another internal consumer triggering the entry.
  scenario:
    zh: DirSharePivot 原作者在客户网络取证中发现隐藏原目录、同名目录图标入口及用户点击后先运行载荷再打开真实目录，随后提供可复现代码；ATT&CK 将 RedCurl 的共享盘 LNK 修改列为另一个过程线索，但不提供逐目标完整执行链。
    en: The DirSharePivot author found hidden original directories, same-named folder-icon entries, and user clicks that ran
      a payload before opening the real directory during customer-network forensics, then published reproduction code. ATT&CK
      lists RedCurl's modified LNK files on network drives as another procedure lead without a complete per-target execution
      chain.
  defense_difference:
    zh: 需解析导航入口与其目标，并将同名原目录属性变化、入口创建者、消费者打开与 Explorer 后继命令关联；单纯文档版本哈希比较可能看不到入口绑定改变。
    en: Parse the navigation entry and target, then join same-named original-directory attribute change, entry writer, consumer
      open, and Explorer successor command. A document-version hash comparison alone can miss a changed entry binding.
  evidence_keys:
  - B8B-T1080-REF-ATTACK
  - B8B-T1080-REF-DIRSHARE
  evidence_limit:
    zh: DirSharePivot 原作者报告真实客户取证并展示关键入口和点击链，但未公开逐机遥测或完整样本谱系；后半文章的改良脚本属于作者复现，不应混入现场 Case。Group-IB 网页只给报告摘要，不支持 LNK 现场细节；主
      Agent 应以 DirSharePivot 一手取证审定正式子项。
    en: The DirSharePivot author reports real customer forensics and shows the key entry and click chain, but publishes no
      full per-device telemetry or sample lineage; the improved script later in the article is a reproduction, not part of
      the incident Case. The Group-IB page only summarizes a report and does not support field LNK details; primary review
      should evaluate the child from DirSharePivot's first-hand investigation.
defense_candidates:
  detection_strategies:
  - key: B8B-T1080-DET-SHARED-TAINT-CONSUMER
    name:
      zh: 共享对象变更—异机消费者结果关联
      en: Shared-Object Change to Cross-Host Consumer Outcome Lineage
    objective:
      zh: 按共享对象版本或导航绑定连接写入者、另一内部消费者与首次异常执行，区分仅污染风险、真实读取和已证实横向结果。
      en: Join writer, separate internal consumer, and first anomalous execution by shared-object version or navigation binding,
        separating taint risk, confirmed read, and established lateral outcome.
    covered_subjects:
    - parent
    - B8B-T1080-NJS-CONTENT-ID
    - B8B-T1080-NJS-NAV-BINDING
    analytic_keys:
    - B8B-T1080-NJA-OBJECT-VERSION
    - B8B-T1080-NJA-NAV-ENTRY
    resolution: create_or_split_after_catalog_review
  detection_analytics:
  - key: B8B-T1080-NJA-OBJECT-VERSION
    name:
      zh: 共享对象内容版本—消费者首个执行差分
      en: Shared-Object Content Version to Consumer First-Execution Differential
    platforms:
    - Windows
    - Office Suite
    - SaaS
    logic:
      zh: 对批准的高价值共享文档/安装包，先用 4663 实际写权限与共享版本库 FileModified/版本 ID 建立 writer、对象、修改时间及旧/新摘要；5145 只补充源 IP 和访问请求，不单独判定完成写入。比较旧/新版本的宏、远程模板、脚本入口、可执行节或签名/摘要，并与变更单及批准编辑者核对。再在最长
        7 天的调查窗口内，将另一内部设备对同一对象版本的读取/同步/打开与其 Office/安装程序进程、首个脚本解释器/可执行子进程或异常网络连接相连。只有“异常变更→异机消费→执行/可控结果”三段成立才报确认的横向链；无末段时输出污染调查线索，不夸称成功。
      en: For approved high-value shared documents or installers, use actual 4663 write rights plus FileModified or version
        history to establish writer, object, modification time, and before-and-after digest. Use 5145 only to add source IP
        and access-request context, never as proof that bytes were written. Compare old and new versions for macros, remote
        templates, script entry points, executable sections, or signing/digest change against change records and approved
        editors. Over an investigation window up to seven days, join another internal device's read, sync, or open of that
        exact object version to its Office or installer process and first script interpreter, executable child, or abnormal
        network connection. Report established lateral movement only when anomalous change, cross-host consumption, and execution
        or control outcome all hold; without the last segment, output a taint lead rather than claimed success.
    data_requirements:
    - source_type: shared-object-version-history
      channel: null
      required_fields:
      - object.id
      - object.path
      - version.id
      - modified_at
      - modifier.id
      - content.hash
    - source_type: windows-security-file-access
      channel: Security/4663
      required_fields:
      - event.timestamp
      - host.id
      - SubjectUserSid
      - ObjectName
      - AccessMask
      - ProcessName
    - source_type: endpoint-object-consumption
      channel: null
      required_fields:
      - event.timestamp
      - device.id
      - user.id
      - object.path
      - object.version_or_hash
      - process.id
    - source_type: endpoint-process-and-network
      channel: null
      required_fields:
      - event.timestamp
      - device.id
      - process.id
      - process.parent_id
      - process.command_line
      - network.destination
    - source_type: approved-content-change
      channel: null
      required_fields:
      - object.id
      - version.id
      - approver.id
      - valid_from
      - valid_to
    observables:
    - zh: 共享文件原路径保持不变而旧/新版本增加宏、远程模板、代码或异常签名差，写入主体偏离受批编辑者
      en: Original shared path persists while version delta adds macro remote template code or anomalous signing change and
        writer differs from approved editor
    - zh: 另一设备打开同一污染版本后首次产生脚本或异常网络后继行为
      en: Another device opens the same tainted version and then shows first script or abnormal network successor behavior
    correlation_window: up_to_7d_with_version_identity
    dimensions:
    - object.id
    - object.path
    - version.id
    - content.hash
    - modifier.id
    - consumer.device.id
    - consumer.user.id
    - process.id
    - approval.id
    false_positives:
    - approved_collaborative_macro_edit
    - software_release
    - template_migration
    - security_scanner_touch
    - legitimate_document_automation
    blind_spots:
    - no_pre_change_version
    - encrypted_or_unparsed_content
    - sync_version_mismatch
    - browser_prefetch_or_preview_only
    - childless_in_process_execution
    - shortened_retention
    tuning:
      zh: 对业务共享设置对象级版本基线与受批编辑者，按活跃宏或脚本、消费者角色、未批准 writer 和实际后继行为提高优先级；不要仅凭 FileAccessed 认定人为打开，也不要把签名程序或管理员身份设为全局白名单。高频协作区用内容语义和跨设备结果收窄，而不是取消采集。
      en: Baseline versions and approved editors for business shares; prioritize active macro or script change, consumer role,
        unapproved writer, and actual successor behavior. Do not infer deliberate user opening from FileAccessed alone or
        globally allowlist a signed program or administrator. Narrow busy collaboration areas by semantic content and cross-device
        outcome rather than disabling collection.
    evidence_keys:
    - B8B-T1080-REF-ESET-GAMAREDON
    - B8B-T1080-REF-ESET-INVISIMOLE
    - B8B-T1080-REF-MS-4663
    - B8B-T1080-REF-MS-AUDIT
    - B8B-T1080-REF-MS-MACROS
  - key: B8B-T1080-NJA-NAV-ENTRY
    name:
      zh: 共享导航入口替身—消费者命令序列
      en: Shared Navigation Substitute to Consumer Command Sequence
    platforms:
    - Windows
    logic:
      zh: 在重点 SMB 共享上联结目录隐藏属性/重命名与同名可触发入口的新建或修改；解析入口的目标程序、参数、工作目录与图标，检查其是否以目录外观调用 mshta、PowerShell、cmd 或其他解释器后再打开真实目录。把入口
        writer、5145/4663 共享访问、消费者设备上的 Explorer 打开和后继进程按规范化 UNC 路径、同名 stem、时间及设备关联。高置信要求原目录属性变化、替身目标的可执行命令及另一设备的后继执行；仅有 LNK
        创建或双击记录时作为待验证线索。窗口以入口写入后 7 天内首次观察到的消费为准，后续重复触发作为同一对象的扩散证据。
      en: On priority SMB shares, join hidden-attribute or rename changes of a directory with creation or modification of
        a same-named trigger entry. Parse its target program, arguments, working directory, and icon, checking whether a folder-looking
        entry calls mshta, PowerShell, cmd, or another interpreter before opening the real directory. Join entry writer, 5145
        or 4663 share access, consumer Explorer open, and successor process by normalized UNC path, common name stem, time,
        and device. High confidence requires original-directory attribute change, executable command in the substitute target,
        and successor execution on another device. An LNK creation or click alone remains a lead. Use the first consumption
        within seven days of entry modification; later repeated triggers evidence spread from the same object.
    data_requirements:
    - source_type: shared-directory-change
      channel: null
      required_fields:
      - event.timestamp
      - share.path
      - entry.path
      - entry.type
      - entry.attributes
      - actor.id
    - source_type: navigation-entry-metadata
      channel: null
      required_fields:
      - entry.path
      - entry.target
      - entry.arguments
      - entry.icon
      - entry.modified_at
    - source_type: windows-security-detailed-file-share
      channel: Security/5145
      required_fields:
      - event.timestamp
      - host.id
      - SubjectUserSid
      - IpAddress
      - ShareName
      - RelativeTargetName
      - AccessMask
    - source_type: endpoint-process-tree
      channel: null
      required_fields:
      - event.timestamp
      - device.id
      - user.id
      - process.id
      - process.parent_id
      - process.command_line
    observables:
    - zh: 原目录被隐藏且同名目录外观入口指向命令解释器或异常目标
      en: Original directory is hidden while a same-looking entry under its name points to an interpreter or anomalous target
    - zh: 异机 Explorer 打开该入口后出现解释器/载荷进程，然后才呈现真实目录
      en: Explorer on another device opens the entry then produces interpreter or payload process before the real directory
        is shown
    correlation_window: 7d_from_entry_mutation_to_first_consumer
    dimensions:
    - share.path
    - entry.path
    - original_directory.path
    - actor.id
    - consumer.device.id
    - consumer.user.id
    - process.id
    false_positives:
    - approved_folder_shortcut_migration
    - accessiblity_shortcut_customization
    - administrator_navigation_script
    - legitimate_hidden_archival_directory
    blind_spots:
    - entry_target_not_parsed
    - original_attribute_history_missing
    - share_path_alias_not_normalized
    - Explorer_tree_unavailable
    - execution_blocked_before_process
    tuning:
      zh: 只在可写高访问量共享中比较同名原目录与入口目标，并以是否有未批准命令、异机后继进程及写入主体异常评分；对受管迁移保留变更单和入口目标白名单，勿按 .lnk 扩展名一刀切。5145 是访问检查，不足以证明用户实际点击或代码运行。
      en: Compare same-named original directories and entry targets on writable, high-use shares, scoring unapproved commands,
        cross-host successor processes, and abnormal writer identity. Keep change records and precise target allowlists for
        managed migrations rather than blanket-blocking the .lnk extension. Event 5145 is an access check and does not prove
        a user click or code execution.
    evidence_keys:
    - B8B-T1080-REF-DIRSHARE
    - B8B-T1080-REF-ATTACK
    - B8B-T1080-REF-MS-5145
    - B8B-T1080-REF-MS-4663
  mitigations:
  - key: B8B-T1080-MIT-SHARED-OBJECT-INTEGRITY
    name:
      zh: 共享对象写入权与消费完整性治理
      en: Shared-Object Write Authority and Consumption Integrity Governance
    resolution: create_after_catalog_review
    measures:
    - key: bounded-shared-writers
      control_type: preventive
      zh: 按目录和对象限制可写身份，分离普通读取与发布权限，并对高访问量软件/文档目录执行经审批发布
      en: Restrict writers by directory and object separate ordinary read from publishing rights and require approved release
        for high-use software or document paths
    - key: version-and-target-integrity
      control_type: detective-support
      zh: 保留共享对象独立历史版本、摘要、活动内容和导航目标快照，发现替身或异常改写时隔离当前版本并追查消费者
      en: Retain independently controlled versions digests active-content metadata and navigation-target snapshots and isolate
        anomalous current versions while tracing consumers
    - key: consumer-execution-boundary
      control_type: preventive
      zh: 对共享来源的宏、脚本、快捷入口和可执行文件施加受管签名/应用控制与 Office 子进程限制，并记录阻断
      en: Apply managed signing and application control to macros scripts navigation entries and executables from shares constrain
        Office child processes and log blocks
    parent_application:
      use:
        zh: 对多人共享的文档、软件和高频目录登记所有者、合法 writer 与版本发布路径；非发布角色对既有对象和导航入口的写入需审批或隔离，消费者端对改写版本执行前验证可信版本或策略，并保留异常后的对象—设备追查能力。
        en: Register owners, legitimate writers, and release paths for shared documents, software, and frequently used directories.
          Changes to established objects or navigation entries by nonpublishers require approval or isolation. Consumer devices
          verify trusted version or policy before executing changed versions, and the object-to-device tracing capability
          survives an alert.
      expected_effect:
        zh: 攻击者难以凭一个普通共享写权限将原有对象变成跨主机触发器，未经批准的内容或目标绑定变化留有独立版本证据，消费者端可阻断或限制造成的首次执行。
        en: One ordinary share-write right no longer easily turns an established object into a cross-host trigger; unauthorized
          content or target-binding changes leave independently retained version evidence, and consumer execution can be blocked
          or constrained.
      limitations:
        zh: 被攻陷的正式发布身份、签名的恶意内容、无版本支持的旧共享及业务确需宏的工作流仍有风险；逐文件审批和长期版本保留成本较高，需按高价值对象分级，不能把没有异常告警解释为未被污染。
        en: A compromised approved publisher, signed malicious content, legacy shares without versions, and workflows requiring
          macros remain risks. Per-file approval and long-lived versions cost resources, so controls should be tiered to high-value
          objects; absence of an alert does not prove content was never tainted.
    child_applications:
    - target_key: B8B-T1080-NJS-CONTENT-ID
      use:
        zh: 对既有文档和软件保留旧/新内容、嵌入宏或模板关系与受批变更记录，在异机打开前扫描或约束其活动内容
        en: Retain before-and-after content, embedded macro or template relationships, and approved-change records for established
          documents and software; scan or constrain active content before another host opens it
      expected_effect:
        zh: 保留原路径的木马化版本仍出现可核对内容差，未批准活跃内容更难借原对象身份执行
        en: Trojanized versions preserving an original path still produce reviewable content differences and unauthorized
          active content is less able to execute under an established identity
      limitations:
        zh: 加密文件、允许的业务宏、被控发布者和复杂安装器使内容判定不确定，必须结合执行结果
        en: Encrypted files required business macros compromised publishers and complex installers make content judgments
          uncertain and require runtime outcome correlation
    - target_key: B8B-T1080-NJS-NAV-BINDING
      use:
        zh: 限制普通用户改变共享目录隐藏属性或建立可执行导航入口，并对同名目录与入口目标做版本化比对
        en: Restrict ordinary users from changing shared-directory hidden attributes or creating executable navigation entries
          and version-compare same-named directories with entry targets
      expected_effect:
        zh: 目录替身需要更高权限或产生可追溯变更，消费者执行可被应用控制拦截
        en: Directory substitution requires higher authority or leaves traceable changes and consumer execution can be interrupted
          by application control
      limitations:
        zh: 合法快捷导航与目录迁移会受影响，攻击者若控制正式发布身份仍可能通过入口检查，需维护精确目标白名单
        en: Legitimate shortcuts and directory migration may be affected and a compromised publisher may still pass entry
          checks so precise target allowlists are needed
    evidence_keys:
    - B8B-T1080-REF-ATTACK
    - B8B-T1080-REF-MS-MACROS
    - B8B-T1080-REF-MS-APPLOCKER
    - B8B-T1080-REF-MS-4663
