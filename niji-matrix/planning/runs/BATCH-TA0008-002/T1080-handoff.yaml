    url: https://www.welivesecurity.com/wp-content/uploads/2020/06/ESET_InvisiMole.pdf
    role: direct_primary_research
    note: 'Section 5.2: organization installers/docs replaced with trojanized SFX preserving name, icon, metadata; passive
      sharing/execution described.'
  - key: B8B-T1080-REF-DIRSHARE
    url: https://rewtin.blogspot.com/2017/11/abusing-user-shares-for-efficient.html
    role: technical_demonstration
    note: First-hand customer-network forensics describes hidden original directories, same-named folder-icon LNK, local payload
      execution after a user click, and continued opening of the real directory; later controlled reproduction is separate;
      no per-device event-log inventory.
  - key: B8B-T1080-REF-GROUPIB
    url: https://www.group-ib.com/resources/research-hub/red-curl/
    role: primary_report_landing_page
    note: Original report landing page. Accessible text lacks the detailed LNK chain; ATT&CK procedure entry is used for the
      narrow RedCurl statement.
  - key: B8B-T1080-REF-MS-5145
    existing_ref: REF-000474
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5145
    role: telemetry_semantics
    note: Share access check, source IP, share, relative target, access request; not proof of completed write or execution.
  - key: B8B-T1080-REF-MS-4663
    existing_ref: REF-000379
    url: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663
    role: telemetry_semantics
    note: With SACL, records object access actually used and writes, object path, actor and process.
  - key: B8B-T1080-REF-MS-AUDIT
    url: https://learn.microsoft.com/en-us/purview/audit-log-activities
    role: telemetry_semantics
    note: SharePoint/OneDrive FileModified, FileAccessed, FilePreviewed; FileModified delay and preview/prefetch caveat.
  - key: B8B-T1080-REF-MS-MACROS
    url: https://learn.microsoft.com/en-us/microsoft-365-apps/security/internet-macros-blocked
    role: execution_policy_semantics
    note: OneDrive/SharePoint sync and Open in Desktop App may have no MOTW; sharing and write access do not change when site
      marked trusted.
  - key: B8B-T1080-REF-MS-APPLOCKER
    url: https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/applocker/working-with-applocker-rules
    role: mitigation_implementation
    note: Executable, script, installer, DLL rule collections and publisher/path/hash conditions; platform-specific control.
  claims:
  - key: B8B-T1080-CLM-PARENT
    statement_zh: T1080 的可证父行为是共享内容遭攻击者污染，并被另一内部消费者打开或调用而产生目标执行机会；写入、消费与实际执行是不同的证据层。
    statement_en: T1080's supported parent behavior is adversary taint of shared content followed by another internal consumer
      opening or invoking it, creating a target-execution opportunity; write, consumption, and actual execution are separate
      evidence levels.
    evidence_keys:
    - B8B-T1080-REF-ATTACK
    - B8B-T1080-REF-ESET-GAMAREDON
    - B8B-T1080-REF-ESET-INVISIMOLE
    confidence: high
  - key: B8B-T1080-CLM-CONTENT-ID
    statement_zh: Gamaredon 在既有共享文档内加入宏/模板，InvisiMole 保留原文件名称与外观替换原件，证明对象身份延续与恶意内容差分可以共存；它们不证明每次消费都成功控制异机。
    statement_en: Gamaredon adds macros or templates to existing documents and InvisiMole replaces originals while preserving
      their names and appearance, showing that object identity can persist with a malicious content delta; neither proves
      every consumption controls another host.
    evidence_keys:
    - B8B-T1080-REF-ESET-GAMAREDON
    - B8B-T1080-REF-ESET-INVISIMOLE
    confidence: high
  - key: B8B-T1080-CLM-NAVIGATION
    statement_zh: 目录替身可以让共享入口保留熟悉名称和最终显示的真实目录，却改变首次点击的命令目标；这是经公开实证的导航绑定变量，真实入侵普遍性尚未证明。
    statement_en: A directory substitute can preserve a familiar shared entry name and the real directory eventually shown
      while changing the first click's command target; this navigation-binding variable is technically demonstrated, but its
      prevalence in intrusions is unproven.
    evidence_keys:
    - B8B-T1080-REF-DIRSHARE
    - B8B-T1080-REF-ATTACK
    confidence: medium
  - key: B8B-T1080-CLM-AUDIT
    statement_zh: 5145 是共享访问权限检查，4663 在启用相应审计时记录已使用权限，云共享 FileAccessed/Previewed 可来自预览或预取；因此单个读写日志不足以证明消费者执行。
    statement_en: Event 5145 is a share access check, event 4663 can record rights actually used when auditing is enabled,
      and cloud FileAccessed or FilePreviewed can arise from preview or prefetch, so one read or write event cannot prove
      consumer execution.
    evidence_keys:
    - B8B-T1080-REF-MS-5145
    - B8B-T1080-REF-MS-4663
    - B8B-T1080-REF-MS-AUDIT
    confidence: high
  cases:
  - key: B8B-T1080-CASE-GAMAREDON-DOC-INJECTION
    event: Gamaredon_CodeBuilder_inserted_macros_or_remote_templates_into_existing_Word_and_Excel_documents_on_reachable_drives
    evidence_keys:
    - B8B-T1080-REF-ESET-GAMAREDON
    boundary: Observed injection and restoration to original path; propagation potential described, no per-target execution
      proof, and ESET explicitly denies stealth priority.
  - key: B8B-T1080-CASE-INVISIMOLE-TROJANIZED-ORIGINALS
    event: InvisiMole_replaced_stolen_organization_installers_or_document_with_trojanized_versions_preserving_name_icon_metadata
    evidence_keys:
    - B8B-T1080-REF-ESET-INVISIMOLE
    boundary: Observed replacement and passive dissemination design; do not infer every downstream host was compromised or
      classify the entire delivery chain as shared-storage taint without object-location proof.
  - key: B8B-T1080-CASE-DIRSHARE-CUSTOMER
    event: DirSharePivot_author_reports_customer_network_forensics_with_hidden_original_directories_same_named_folder_icon_entries_user_click_local_payload_execution_and_real_directory_open
    evidence_keys:
    - B8B-T1080-REF-DIRSHARE
    boundary: First-hand forensic narrative supports the entry-to-consumer chain and multiple infected workstations; later
      red-team reproduction is separate, and no per-device event-log inventory or complete sample lineage is published.
  detection_strategies:
  - B8B-T1080-DET-SHARED-TAINT-CONSUMER
  detection_analytics:
  - B8B-T1080-NJA-OBJECT-VERSION
  - B8B-T1080-NJA-NAV-ENTRY
  mitigations:
  - B8B-T1080-MIT-SHARED-OBJECT-INTEGRITY
  relationships: []
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions:
    - shared_file_body_change
    - application_or_document_replacement
    - navigation_entry_substitution
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - key: B8B-T1080-AXIS-CONTENT-ID
      disposition: propose
      zh: 原共享对象的选择身份保持，内容或执行语义改变；ESET 两份第一手研究提供跨文档与软件格式实例，需历史版本与消费者实际结果的专用防御。
      en: Original shared-object selection identity persists while content or execution semantics change; two first-hand ESET
        studies provide document and software instances and call for version-to-consumer defense.
    - key: B8B-T1080-AXIS-NAV-BINDING
      disposition: propose_with_primary_review
      zh: 导航入口解析目标被替换而真实目录仍可显示；DirSharePivot 一手客户取证支持异机消费者本地执行，原作者复现代码支持机制；仍缺逐机日志和样本谱系，需主 Agent 复审。
      en: A navigation entry resolves to a substituted target while the real directory can still appear; DirSharePivot first-hand
        customer forensics supports local execution by other consumers, and the author's reproduction supports the mechanism;
        per-device logs and sample lineage remain unpublished and need primary review.
    - key: B8B-T1080-AXIS-BENIGN-HANDOFF
      disposition: parent_core_not_separate_child
      zh: 恶意动作后继续打开原文档或目录有助隐藏影响，但 InvisiMole 与 DirSharePivot 均可发生，跨两个变量而不构成独立互斥兄弟项。
      en: Opening the original document or directory after the malicious action can reduce visible disruption, but it crosses
        the InvisiMole and DirSharePivot patterns and is not a mutually bounded sibling child.
    - key: B8B-T1080-AXIS-DELAY
      disposition: evidence_deferred
      zh: 污染与被害者打开天然存在时间差；公开证据未证明攻击者稳定控制目标打开时点或以分时降低告警，因此不得单设低频子项。
      en: Taint and victim open naturally have a time gap; sources do not show stable attacker control over open time or alert
        dilution, so no low-frequency child is warranted.
    - key: B8B-T1080-AXIS-REPO
      disposition: evidence_deferred
      zh: ATT&CK 父页包含内部代码仓库，但本轮缺乏具体“被控仓库对象改写→另一内部消费者执行”一手案例和独立观察差异，仓库仅保留在父级媒介范围。
      en: ATT&CK includes internal code repositories, but this pass lacks a first-hand repository-object-change to another
        internal consumer execution case and a separate observation effect; repositories remain parent media only.
    - key: B8B-T1080-AXIS-FORMAT
      disposition: not_stealth_distinct
      zh: Office、二进制、LNK、SMB 和 SaaS 是载体或实现；不能直接按文件格式、协议或平台生成 NJS。
      en: Office documents, binaries, LNK, SMB, and SaaS are media or implementations and do not directly define NJS.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 0 ATT&CK 子项后仍做了开放式搜索；两项正式建议由“对象内部语义”与“导航目标绑定”划界，不由文档/快捷方式格式划界。第二项须主 Agent 审定一手实证加 ATT&CK 野外条目是否足以进入正式分类。
      en: Open-ended search continued despite zero ATT&CK children. The two proposed children separate internal object semantics
        from navigation target binding, not document versus shortcut format. Primary review must decide whether technical
        demonstration plus ATT&CK field reporting suffices for the second formal child.
  evidence_coverage:
    parent_behavior_keys:
    - B8B-T1080-REF-ATTACK
    - B8B-T1080-REF-ESET-GAMAREDON
    - B8B-T1080-REF-ESET-INVISIMOLE
    boundary_keys:
    - B8B-T1080-REF-ATTACK
    - B8B-T1080-REF-ESET-GAMAREDON
    - B8B-T1080-REF-ESET-INVISIMOLE
    mechanism_support:
    - B8B-T1080-REF-ESET-INVISIMOLE
    - B8B-T1080-REF-DIRSHARE
    - B8B-T1080-REF-MS-4663
    - B8B-T1080-REF-MS-AUDIT
    child_existence_support:
    - B8B-T1080-REF-ESET-GAMAREDON
    - B8B-T1080-REF-ESET-INVISIMOLE
    - B8B-T1080-REF-DIRSHARE
    - B8B-T1080-REF-ATTACK
    unsupported_or_deferred:
    - Gamaredon_stealth_intent
    - per_target_execution_for_all_cases
    - repository_specific_child
    - delay_dilution_child
    - RedCurl_complete_field_execution_chain
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级双语已分别论证行为定义、对象身份伪装与跨端因果、三组相邻技术、两类现场/技术场景、攻击者写权限与消费者策略、防守日志及反例；子项另列稳定变量、痕迹、观察差异、边界、来源与专用防御。正式写入需主 Agent 将研究交接的证据强度复核为
        Claim、Case 和逐字段自然段。
      en: Parent bilingual prose separately covers behavior, object-identity disguise and cross-host causality, three adjacent
        boundaries, field and technical scenarios, attacker write rights and consumer policy, defender telemetry, and counterexamples.
        Each child has its stable variable, trace, observation effect, boundary, source, and targeted defense. The primary
        author must reconfirm evidence strength in canonical Claims, Cases, and field paragraphs.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - library_lookup
    - URL_duplicate_search
    - YAML_parse_check
  limitations:
    paragraphs:
    - zh: ESET Gamaredon 研究证明文档注入和原位置恢复，但其作者明确表示该组织似乎不努力低调，因此不能把该事件包装为已观察到的匿迹动机。InvisiMole 研究直接证明外观保留的木马化替换与被动传播设计，却未逐一公开每台消费者的版本和进程；DirSharePivot
        作者报告真实客户网络的目录替身与点击执行，也另给受控复现代码；现场叙述未附逐机日志和完整样本谱系。RedCurl 的窄行为仅来自 ATT&CK 过程条目，原始 Group-IB 可访问页面只给摘要，不参与第二子项的现场证明。
      en: ESET demonstrates Gamaredon document injection and restoration to original locations, but explicitly says the group
        appeared not to try to stay under the radar, so this incident cannot be framed as observed stealth intent. InvisiMole
        research directly shows appearance-preserving trojanized replacement and passive-spread design without publishing
        every consumer's version and process. The DirSharePivot author reports a real customer-network directory substitution
        and click-to-execution chain and separately supplies controlled reproduction code; the field account does not publish
        per-device logs or complete sample lineage. RedCurl's narrow behavior comes only from ATT&CK's procedure account,
        while accessible original Group-IB pages provide a summary and do not establish the second child's field evidence.
    - zh: 版本差异、共享访问和目标执行在不同日志与时钟下发生。5145 仅检查共享访问，云 FileAccessed 可能由预览或预取触发；没有实际写入、对象版本、另一内部消费者和后继执行四类证据时，只能逐级报告污染可能、已读取或已执行，不能跳级宣称横向成功。合法共同编辑、软件发布、目录迁移、宏业务和安全扫描均会产生部分相似信号，检测与缓解应保留审批与环境基线。
      en: Version changes, share access, and target execution occur across different logs and clocks. Event 5145 only checks
        share access, while cloud FileAccessed may result from preview or prefetch. Without actual write, object version,
        another internal consumer, and successor execution evidence, report taint risk, confirmed read, or execution at their
        respective levels rather than leap to successful lateral movement. Legitimate coauthoring, software release, directory
        migration, required macros, and security scanning all produce partial lookalikes, so detection and mitigation need
        approval context and local baselines.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason_zh: 消费者打开时间由工作流决定，缺攻击者可控的稳定时间稀释和专用案例
    reason_en: Consumer open time is driven by workflow and no attacker-controlled stable temporal dilution or dedicated case
      is established
  - mechanism_ref: NM-DO
    reason_zh: 公开案例不要求对载荷进行独立数据混淆；宏/模板嵌入是活动内容位置而非充分的数据模糊机理
    reason_en: Public cases do not require separate payload obscuration; macro or template insertion alone is active-content
      placement rather than sufficient Data Obscuration
  open_questions:
  - zh: 能否取得 Group-IB RedCurl 原始报告中共享盘 LNK 原目录、入口写入、另一主机点击与首次进程的完整时间链，以提高第二子项置信度？
    en: Can the original Group-IB RedCurl report provide original-directory, entry-write, other-host click, and first-process
      chronology to raise confidence in the second child?
  - zh: 内部代码仓库污染是否有独立一手案例证明另一个内部开发者或 runner 消费被改写的对象并执行，且其观察差异超出既有共享对象语义变量？
    en: Is there a first-hand internal code-repository taint case in which another developer or runner consumes and executes
      the changed object with an observation difference beyond the established shared-object semantic variable?
  - zh: 主 Agent 应与 T1534 研究者对 ESET Gamaredon 来源 URL 及其邮件/共享文档两条 Case 结论去重，与 T1570/NJT-0087/T1072 核对事件边界，并再次查重所有共享防御对象。
    en: The primary agent should deduplicate the ESET Gamaredon source URL and its separate mail and shared-document Case
      conclusions with the T1534 researcher, reconcile event boundaries with T1570, NJT-0087, and T1072, and rerun shared-defense
      duplicate review.
