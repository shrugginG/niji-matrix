      support: ESET USBStealer command and return-file behavior beyond first B installation
    - axis: USB device model or AUTORUN versus LNK
      resolution: not-stealth-distinct implementation
      support: ATT&CK parent and Microsoft implementation contrast
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定 19.1 父项没有 ATT&CK 子项，但仍检验了接收侧特征伪装、源侧自动播种、元数据改写、双向物理信使和实现形式。保留两项既有 Niji 原生轴而不据 ATT&CK 数量增减。NJS-0058-002 的“低触达”仅指少人工操作，其独立匿迹效果必须限于跨机时空分隔的观察模型，并把批量写入的高可见性写入正文。
      en: This fixed 19.1 parent has no ATT&CK children, but the review examined recipient-side feature disguise, source-side
        automatic seeding, metadata rewriting, a bidirectional physical courier, and implementation form. Keep two existing
        Niji-native axes without using ATT&CK count as an output target. Low-touch in NJS-0058-002 means less manual operator
        action only; its separate stealth effect must be limited to a cross-host temporal observation model, and conspicuous
        bulk writes must appear in the text.
  evidence_coverage:
    parent_behavior_keys:
    - REF-000091
    - B8B-T1091-REF-ESET-USBSTEALER
    - REF-000105
    boundary_keys:
    - REF-000091
    - B8B-T1091-REF-ESET-USBSTEALER
    mechanism_support:
    - mechanism_ref: NM-FD
