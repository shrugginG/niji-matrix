handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0008-002
work_item_ref: WORK-TA0008-T1091
temporary_key_prefix: B8B-T1091-
candidate:
  source_type: attack
  source_attack_id: T1091
  source_attack_version: '19.1'
  name:
    zh: 通过可移动介质复制
    en: Replication Through Removable Media
recommendation:
  decision: retain
  confidence: high
  resulting_technique_resolution: extend NJT-0058 across TA0001 and TA0008; do not create a duplicate parent
  rationale:
    paragraphs:
    - zh: ATT&CK Enterprise 19.1 将 T1091 同时归于初始访问和横向移动，其共同父行为是使恶意内容随可移动介质到达另一主机并在该主机触发。ESET 对 USBStealer 的逆向重构明确展示已受控 A 主机将内容放入介质、隔离
        B 主机随后安装的链条；Microsoft 对 Raspberry Robin 的研究也明确指出播种的 LNK 会感染其他主机。因此保留 T1091 的父行为，并在本战术复用 NJT-0058；但既有技术以“首个立足点”为终点，必须改为可同时容纳首次进入和后续内部主机控制的中性边界。
      en: Enterprise ATT&CK 19.1 maps T1091 to both Initial Access and Lateral Movement. The shared parent behavior is carriage
        of malicious content on removable media to another host and its triggering there. ESET's reverse engineering of USBStealer
        reconstructs a controlled host A seeding media and an isolated host B subsequently installing the payload; Microsoft
        also states that Raspberry Robin LNK files seeded onto drives infect other hosts. Retain the T1091 parent behavior
        and reuse NJT-0058 in this tactic. Its current first-foothold endpoint must be rewritten as a neutral boundary covering
        both first entry and subsequent control of an internal host.
  tactic_outcome_gate:
    zh: TA0008 必须串起已受控源主机 A、同一介质上的攻击内容写入、不同的目标主机 B 对该介质的接入，以及 B 上实际的恶意执行或可控状态。仅见 A 写入、B 挂载、文件到达或可疑 USB 品牌名，不足以声称横向移动。B 必须位于同一受害环境的内部范围；跨组织或未知归属的“其他主机”传播只能证明能力，不能自动计为一次内部横向事件。
    en: TA0008 requires a chain from an already controlled source host A through malicious content written to the same medium,
      attachment to a distinct target host B, and actual malicious execution or attacker-controlled state on B. A write on
      A, a mount on B, file arrival, or a suspicious USB brand name alone does not establish lateral movement. B must lie
      inside the same victim environment; propagation to hosts of unknown or different organizational ownership supports capability
      but cannot itself be counted as a confirmed internal lateral incident.
  original_attack_subtechniques_imported: false
  alternative_decisions_rejected:
    adapt: ATT&CK itself maps the same replication behavior to both tactics; the needed rewrite repairs the existing Niji
      object's overly narrow first-entry framing rather than changing the candidate's ATT&CK parent behavior.
    exclude: ESET's A-to-B chain and Microsoft propagation analysis show a relevant cross-host mechanism, so exclusion would
      lose a supported TA0008 behavior.
cross_tactic_resolution:
  existing_parent_ref: NJT-0058
  existing_children:
  - NJS-0058-001
  - NJS-0058-002
  existing_decision_ref: DEC-TA0001-T1091
  proposed_new_decision_key: B8B-T1091-DEC-TA0008
  canonical_actions_for_primary_agent:
  - Create a TA0008 admission decision pointing to NJT-0058 and add TA0008 to its tactic_refs; retain the existing singular
    parent classification.decision_ref.
  - Rename NJT-0058 from entry-only terminology to a tactic-neutral removable-media propagation concept, and rewrite parent
    and both children for a host-boundary outcome without changing their canonical IDs.
  - Preserve the TA0001 first-foothold result gate as one applicable path; update its decision prose only if the current resulting-technique
    name changes.
  - Add a dedicated cross-host media lineage DET and NJA or equivalently split the existing broad defense after semantic review;
    rewrite media-specific MIT applications.
proposed_content:
  name:
    zh: 隐蔽可移动介质传播
    en: Covert Removable-Media Propagation
  summary:
    zh: 攻击者把可触发的恶意内容藏入正常流转的可移动介质，使接入的另一主机在普通介质使用流程中产生攻击者可控动作。
    en: An adversary embeds triggerable malicious content in routinely transferred removable media so another host takes an
      attacker-controlled action during ordinary media use.
  definition_and_concept:
    paragraphs:
    - zh: 隐蔽可移动介质传播是攻击者在已有受控主机或可接触的介质上写入攻击内容，使介质被带到另一主机后通过自动运行、文件替换或用户打开而触发的跨主机行为。其直接目的不是单纯复制文件，而是把目标主机变成新的可执行或可控制节点；介质提供主机间载体，触发链提供最终结果。
      en: Covert Removable-Media Propagation is the cross-host act of placing malicious content on a drive accessible to the
        attacker or an already controlled host, then having that content triggered after the drive reaches another host through
        autorun, file replacement, or user opening. Its direct aim extends beyond file copy and makes the recipient host a
        new execution or control node. The medium carries content between hosts, while the trigger chain supplies the outcome.
    - zh: 同一父行为可处于两个战术位置。若目标是受害环境的首个立足点，结果归于 TA0001；若源主机已在受害环境内受控且另一内部主机随后执行或受控，结果归于 TA0008。USB、手机存储或介质型号是实现条件，不是匿迹分类变量；攻击者对可见诱饵与播种时机的控制才构成子项研究对象。
      en: The same parent behavior can occupy two tactic positions. A target that becomes the first foothold belongs to TA0001;
        an already controlled source inside the victim environment followed by execution or control of another internal host
        belongs to TA0008. USB devices, phone storage, and media models are implementation conditions rather than stealth
        classes. The adversary's control of visible lures and seeding behavior supplies the child-taxonomy questions.
  stealth_characteristics:
    paragraphs:
    - zh: 介质在合法搬运、备份或隔离网维护中本来会跨主机移动，攻击者把恶意文件或触发入口放在这一非网络路径上，使单台主机的网络日志看不到 A 到 B 的传输事务。伪装的快捷方式、文件夹名称或系统属性可能让浏览者把触发物当作普通内容；自动播种则把写入动作移到先前接入介质的源主机上，使接收主机只看到后来的一次挂载和打开。
      en: Removable media already moves between hosts for authorized transfer, backup, and isolated-network maintenance. Placing
        a malicious file or trigger on that non-network path leaves no A-to-B transfer transaction in a single host's network
        logs. A disguised shortcut, folder name, or system attribute can make the trigger look like ordinary content; automatic
        seeding moves the write to the earlier source host, so the recipient may see only a later mount and opening.
    - zh: 匿迹不等于无痕。源主机仍可能保留介质挂载、枚举和文件写入；介质保留目录项、内容散列、链接目标与属性；目标主机保留挂载、Explorer 或 UserAssist、进程父子链以及后继网络或本地动作。效果取决于双方端点覆盖、介质标识可靠性、留存时长和授权转运台账；自动蠕虫若大量写入诱饵，也可能比人工投递更显眼。
      en: This does not erase traces. The source can retain media mounts, enumeration, and file writes; the medium retains
        directory entries, content hashes, shortcut targets, and attributes; the target can retain mount, Explorer or UserAssist,
        process lineage, and subsequent network or local action. The effect depends on endpoint coverage on both sides, media-identity
        reliability, retention, and the authorized-transfer ledger. A worm that writes many lures may be more conspicuous
        than manual placement.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入条件是攻击者控制可移动介质上的攻击内容及其跨主机触发，并能给出源主机、介质和另一目标主机的可信关联；在 TA0008 下还需确认目标主机的恶意动作或控制结果。合法补丁介质、经授权的离线数据摆渡、备份恢复和个人文件移动可出现相同挂载或写入，必须凭内容异常、来源差异与后续行为区分，不能仅凭“使用
        USB”分类。
      en: Inclusion requires adversary control of attack content on removable media and its cross-host trigger, with credible
        linkage among source host, medium, and another target host; TA0008 additionally requires malicious action or control
        on the target. Approved patch media, authorized offline data ferrying, backup restore, and personal file movement
        can produce the same mounts and writes, so content anomaly, provenance discrepancy, and subsequent behavior must distinguish
        them. USB use alone is not a classification.
    - zh: 单纯把工具复制到 B、但没有介质触发或 B 上结果，应与 T1570 工具到达区分；在共享目录污染内容并由消费者读取属于 T1080；用户点击诱饵后的执行可与 NJT-0081 交叠，但该项只描述用户动作，不取代介质跨主机谱系。后续持久化、命令通道、介质上的回传文件和擦除或改写时间戳分别由各自邻接技术承担，不因出现在同一样本中而扩大
        T1091。
      en: Copying a tool to B without media triggering or a B-side result must be separated from T1570 file arrival. Tainting
        a shared directory for a consumer belongs to T1080. Execution after a user clicks a lure can overlap NJT-0081, but
        that object describes the user's action, not the cross-host media lineage. Subsequent persistence, command channels,
        return files on the drive, and timestamp erasure or rewriting belong to their neighboring techniques and do not enlarge
        T1091 merely because they appear in the same sample.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 一个内部工作站已被攻击者控制，而操作员按既有流程把维护介质接入该工作站和一台隔离主机时，植入的播种逻辑可先改写介质，再等待隔离主机运行伪装入口。此时横向结果以隔离主机上出现攻击者可控动作判定；若接入的是环境外用户的首台受害机，同一行为应按初始访问处理。
        en: After an internal workstation is controlled, an operator may attach the same maintenance drive to that workstation
          and an isolated host. A planted seeder can modify the drive before the isolated host later executes a disguised
          trigger. The lateral outcome is the attacker-controlled action on the isolated host. If the recipient is instead
          the victim environment's first compromised machine, the same behavior is Initial Access.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者须能写入介质本身，或在介质接入时控制源主机的文件写入；还需知道目标会使用该介质，并拥有与目标平台兼容的载荷和可实际触发的路径。用户点击、旧版自动运行或特定 Shell 行为都是条件，不能假定所有 Windows
            系统默认执行；如果没有物理转运或授权业务流，介质无法自然跨越边界。自动播种降低操作者逐盘处理的需要，但可能增加显著的文件写入量。
          en: The adversary must be able to write the medium directly or control file writes on a source host when the medium
            is attached. They also need a reason to expect target use, a compatible payload, and a trigger path that actually
            works. A user click, legacy autorun, or particular Shell behavior is a condition, not a Windows-wide default.
            Without physical transfer or an authorized workflow, the medium will not naturally cross the boundary. Automatic
            seeding reduces manual per-drive handling but may increase conspicuous writes.
      defender_model:
        paragraphs:
        - zh: 防守方若只持有 B 的网络日志，既看不到物理转运，也难以还原 A 上的播种。较完整模型需 A/B 端点的介质接入与文件/进程事件、介质序列号或组织资产标识、介质内容检查和转运记录，并保留至跨机接入间隔结束；隔离网缺少
            EDR、序列号伪造或重复、离线时间过长都会削弱关联。即使无法见 A，B 上挂载之后的链接目标、进程父子链和新文件仍可支持局部判断。
          en: A defender holding only B's network logs cannot see the physical transfer and may not reconstruct seeding on
            A. A fuller model needs A and B endpoint media, file, and process events, a media serial or organizational asset
            identifier, content inspection, and transfer records retained across the inter-host interval. Missing EDR in isolated
            networks, spoofed or reused serials, and long offline periods weaken correlation. Even without A, shortcut targets,
            process lineage, and new files after the mount can support a narrower B-side assessment.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 介质诱饵与合法转运外观掩盖跨主机恶意触发
      en: Media lures and ordinary transfer appearance mask a cross-host malicious trigger
    analysis:
      paragraphs:
      - zh: 攻击者把快捷方式伪装为文件夹或介质品牌，或让自动运行入口模仿浏览操作，改变了接收者在 B 上看到的可见对象特征；ESET 还观察到 USBStealer 用“USB Disk Security”身份和隐藏属性包装内容。防守者若只按文件名、图标或是否来自日常介质判断，就会把恶意触发归入正常使用。链接目标、自动运行设置、隐藏文件内容与其后进程链仍能破坏这种伪装。
        en: The adversary makes a shortcut resemble a folder or drive brand, or configures an autorun entry to imitate browsing,
          changing the visible features presented on B. ESET also observed USBStealer using a USB Disk Security identity and
          hidden attributes. A defender relying only on name, icon, or the routine origin of the drive can misclassify the
          trigger as normal use. Shortcut target, autorun configuration, hidden content, and subsequent process lineage can
          still break the disguise.
    evidence_keys:
    - REF-000105
    - REF-000106
    - B8B-T1091-REF-ESET-USBSTEALER
    confidence: high
  - mechanism_ref: NM-ST
    role: secondary
    summary:
      zh: 源主机播种与目标执行被介质转运分隔
      en: Media transport separates source seeding from target execution
    analysis:
      paragraphs:
      - zh: 攻击者利用介质在 A、B 两端依次接入，使写入与触发分布在不同主机和时间段，且无需留下常规网络复制会话。短窗口的单机分析只能看到一次写入或一次打开，不能证明两者是同一传播链；按介质身份、内容散列和后继动作跨主机关联才可重构。ESET
          的 A/B 链条支持此因果结构，具体实战转运时长与刻意延迟则未获证，不能声称普遍“低速隐蔽”。
        en: The adversary uses successive attachment of a drive to A and B, distributing the write and trigger across different
          hosts and times without an ordinary network-copy session. A short single-host window sees only a write or an opening
          and cannot prove one propagation chain; media identity, content hash, and subsequent action must be correlated across
          hosts. ESET's A/B chain supports this causal structure, while real-world transfer delays and deliberate pacing remain
          unproven, so the mechanism must not claim generally slow stealth.
    evidence_keys:
    - B8B-T1091-REF-ESET-USBSTEALER
    - REF-000105
    confidence: medium
  proposed_subtechnique_taxonomy:
    coverage: established
    child_refs_to_reuse:
    - NJS-0058-001
    - NJS-0058-002
    narrative:
      zh: 两项现有子技术应以不同的攻击者可控变量保留：伪装式介质触发改变 B 上供人或 Shell 选择的入口外观；低触达自复制播种改变 A 上介质写入的触发方式和与 B 上动作的时空关联。两者可同时存在，但视觉伪装本身不说明内容如何播种，自动播种本身也不证明
        B 会误认诱饵。USB 型号、LNK 与 AUTORUN 的实现差别和感染目标数均不足以另外拆项。
      en: Keep the two existing children as separate attacker-controlled variables. Masqueraded Media Trigger changes the
        visible entry selected by a person or Shell on B; Low-Touch Self-Replicating Media Seeding changes what triggers the
        write to the medium on A and how it is separated in time and host from action on B. They can coexist, but visual camouflage
        does not explain seeding, and automatic seeding does not prove B mistakes the lure. USB models, LNK versus AUTORUN
        implementation, and infection counts do not justify further children.
proposed_subtechniques:
- existing_ref: NJS-0058-001
  resolution: extend and rewrite without new ID
  name:
    zh: 伪装式介质触发
    en: Masqueraded Media Trigger
  summary:
    zh: 将介质上的执行入口伪装成用户预期会打开的目录、文件或正常浏览命令，使目标主机上的恶意触发与普通介质操作相似。
    en: Dress a media execution entry as a directory, file, or normal browsing command that users expect to open, making the
      target-host trigger resemble routine drive use.
  definition_and_concept:
    paragraphs:
    - zh: 本子技术以目标主机对介质内容的选择动作作为直接对象。攻击者改写快捷方式名称或图标、藏起实际载荷，或让介质菜单的浏览动作指向安装程序，目的是让另一主机在使用介质时执行攻击内容。变量是被选择的入口是否伪装成预期对象，不是 LNK、AUTORUN
        或图标格式本身；这些实现须有真实触发条件。
      en: This child concerns the target host's selection of content on a removable drive. The adversary changes a shortcut
        name or icon, hides the payload, or redirects a drive-browsing menu action to installation so another host executes
        attack content during drive use. The variable is whether the selected entry masquerades as the expected object, not
        the LNK, AUTORUN, or icon format itself; each implementation requires a working trigger condition.
  stealth_characteristics:
    paragraphs:
    - zh: 伪装式介质触发把用户可见的文件夹、品牌名或浏览动作与实际执行目标分离。Raspberry Robin 的品牌或目录式 LNK 和 USBStealer 的伪装菜单说明普通浏览可能成为执行入口，仅依赖文件名与用户动作类别的分流会漏看载荷。但
        LNK 目标命令、AUTORUN 内容、隐藏文件、UserAssist 与 cmd/msiexec 进程谱系仍能暴露差异；用户是否被特定命名说服不可从一次点击推定。
      en: Masqueraded Media Trigger separates a visible folder, brand name, or browsing action from the actual execution target.
        Raspberry Robin's brand or folder-like LNK and USBStealer's altered menu show how ordinary browsing may become the
        execution entry, defeating triage based only on file name and action category. The LNK target, AUTORUN content, hidden
        files, UserAssist, and cmd/msiexec process lineage still expose the difference; a click alone cannot prove that a
        particular name persuaded the user.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入能证明同一介质上外观与执行目标不一致、且 B 实际选择并触发的实例；只有诱饵存在而无 B 上动作，只能证明准备，不能计为 TA0008 完成。合法快捷方式、企业软件安装介质和 USB 安全工具也可能使用品牌名或隐藏文件，须检查签发来源、预期脚本、变更记录及后继行为。与
        NJS-0058-002 的边界是这里改变接收侧识别特征，播种是否自动不决定归类。
      en: Include cases where appearance and execution target on the same drive demonstrably diverge and B actually selects
        and triggers the entry. A lure merely present without B-side action proves preparation, not completed TA0008 movement.
        Legitimate shortcuts, enterprise installation media, and USB security tools may carry brand names or hidden files;
        provenance, expected scripts, change records, and subsequent behavior distinguish them. This child changes recognition
        at the recipient, while automatic seeding defines its sibling.
  application_scenarios:
    paragraphs:
    - zh: 在维护盘从已受控工作站转运到隔离机的流程中，攻击者可把载荷入口包装成文件夹或盘符浏览动作，等待操作员接入并打开。若 B 首次成为受害环境立足点，这是 TA0001；若 A 已在内部受控且 B 是另一内部主机，只有 B 实际执行后才满足
        TA0008。
      en: In a workflow carrying a maintenance drive from a controlled workstation to an isolated machine, an adversary can
        package the payload entry as a folder or drive-browsing action and wait for an operator to attach and open it. If
        B is the first victim foothold, the outcome is TA0001. If A is already controlled internally and B is another internal
        host, TA0008 requires actual execution on B.
  attacker_model:
    paragraphs:
    - zh: 攻击者须能编辑介质目录或入口目标，并估计 B 的用户习惯或自动运行配置。品牌名增加点击可能性只是 Microsoft 的谨慎评估；旧版自动运行或 Shell 菜单技巧依赖具体设置。载荷还须与 B 兼容，介质也须实际转运。
      en: The adversary needs edit control over the drive directory or entry target and an expectation about B's workflow
        or autorun configuration. Microsoft cautiously assesses that a brand name may encourage clicking; legacy autorun and
        Shell menu tricks depend on specific settings. The payload must work on B and the drive must actually be transferred.
  defender_model:
    paragraphs:
    - zh: 只记录 USB 接入与文件名的防守者会看到貌似正常的使用；若解析 LNK/AUTORUN 目标、保留 UserAssist 与进程命令行，并关联介质快照，就能识别显示为目录却启动脚本或安装器的差异。没有介质内容或 B 端进程遥测时，只能形成风险假设，不能给出已执行结论。
      en: A defender recording only USB attachment and file names sees apparently ordinary use. Parsing LNK or AUTORUN targets,
        retaining UserAssist and process command lines, and correlating a drive snapshot can reveal a displayed folder launching
        a script or installer. Without media content or B-side process telemetry, the result is a risk hypothesis rather than
        confirmed execution.
  mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    evidence_keys:
    - REF-000105
    - B8B-T1091-REF-ESET-USBSTEALER
    confidence: high
    causal_chain_zh: 伪装目录或浏览入口使可见名与执行目标分离，粗粒度介质浏览检测误分流，解析链接目标和后继进程可恢复。
    causal_chain_en: A disguised folder or browsing entry separates visible name from execution target, causing coarse media-browsing
      triage to misclassify; target parsing and successor processes recover the action.
  evidence_boundary:
    zh: REF-000105 与 CASE-000109 支持接收侧 LNK 和用户触发，不独立证明同一介质来自同一受害组织内的 A。ESET 支持 A/B 传递能力和特定配置依赖。现有 CLM-000215 可扩主体，但不能把可能鼓励点击写成实测心理因果。
    en: REF-000105 and CASE-000109 support recipient-side LNK and user triggering, not independently a drive from A in the
      same victim organization. ESET supports A/B transport capability and specific configuration dependency. CLM-000215 may
      gain a broader subject, but possible encouragement must not become measured psychological causality.
- existing_ref: NJS-0058-002
  resolution: extend and rewrite without new ID
  name:
    zh: 低触达自复制播种
    en: Low-Touch Self-Replicating Media Seeding
  summary:
    zh: 源主机在介质接入时自动枚举并写入攻击内容，使后续转运承载复制而无需操作者逐盘手工投递。
    en: A source host automatically enumerates and writes attack content on attachment, allowing later transport to carry
      replication without manual per-drive placement.
  definition_and_concept:
    paragraphs:
    - zh: 本子技术把播种动作从操作者逐盘复制改为已受控源主机对新接入介质的自动反应。LitterDrifter 通过 WMI 枚举卷并在子目录生成隐藏组件和诱饵，USBStealer 监听介质接入后写入载荷与自动运行文件；两者都说明接入时自动播种这一独立变量。低触达仅指操作者与每次播种的交互较少，不断言文件系统痕迹更少。
      en: This child replaces manual per-drive placement with an automatic response by a controlled source host to newly attached
        media. LitterDrifter enumerates volumes through WMI and creates hidden components and lures in subdirectories; USBStealer
        watches drive attachment and writes a payload and autorun file. Both support attachment-triggered seeding as a separate
        variable. Low-touch means fewer operator interactions per drive, not fewer filesystem traces.
  stealth_characteristics:
    paragraphs:
    - zh: 低触达自复制播种使攻击内容在 A 上先于 B 的使用被写入介质，人工转运把两个端点事件隔开；B 若没有 A 的日志，常只能看到已存在的文件。自动化也利用正常接入机会，而无需攻击者再远程登陆每台目标。但 WMI 枚举、多个子目录的新
        LNK、隐藏脚本及相同散列在多盘出现会留下强烈残余信号，不能把蠕虫广泛传播误称为天然低噪声。
      en: Low-Touch Self-Replicating Media Seeding writes content on A before B's later use, with human transfer separating
        the endpoint events. Without A's logs, B may see only pre-existing files. Automation exploits ordinary attachment
        opportunities without fresh remote login to each target. Yet WMI enumeration, new LNK files across folders, hidden
        scripts, and repeated hashes across drives leave strong signals; broad worm spread is not inherently low noise.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入有接入触发、自动枚举或自动写入证据的介质播种，且 TA0008 另需不同内部 B 的后继动作；仅凭介质上发现恶意文件不能证明自动播种。合法批量备份、加密盘初始化、端点管理代理和离线补丁制作都可自动写入，需以内容、脚本目标、进程来源及批准任务区分。与
        NJS-0058-001 的边界是源侧写入触发和操作者触达程度，而非 B 上诱饵外观。
      en: Include media seeding with evidence of attachment-triggered enumeration or writes; TA0008 also requires subsequent
        action on a distinct internal B. A malicious file on a drive alone cannot prove automatic seeding. Legitimate backup,
        encrypted-drive initialization, endpoint agents, and offline patch preparation may write automatically; content, script
        targets, originating process, and approved jobs distinguish them. The sibling boundary is source-side write triggering
        and operator interaction, not the lure's appearance on B.
  application_scenarios:
    paragraphs:
    - zh: 攻击者控制经常接收维护盘的内部工作站，部署播种组件后等待正常轮换盘接入；组件在盘上放置载荷，运维人员再将盘接到隔离 B。该场景适合无法经网络直接到达 B 的环境，但完成横向移动仍以 B 的有效触发为准。
      en: After controlling an internal workstation that receives maintenance drives, the adversary plants a seeder and waits
        for a normal rotating drive. The component places content, and staff later attach the drive to isolated B. This works
        when B is unreachable over the network, but lateral movement is complete only after an effective trigger on B.
  attacker_model:
    paragraphs:
    - zh: 攻击者需要 A 上的代码执行或等效写盘能力、可写介质、对轮转路径的合理判断，以及目标平台可用的触发方式。自动播种减少人工挑盘，却增加误感染、写入量和端点审计机会；若 B 只接受只读签名介质，或 AutoRun 被禁且无人打开诱饵，传播停在准备阶段。
      en: The adversary needs code execution or equivalent drive-write ability on A, writable media, a reasonable expectation
        of the rotation path, and a working trigger on B. Automation reduces manual drive selection but increases accidental
        spread, write volume, and endpoint audit opportunities. If B accepts only signed read-only media, or autorun is disabled
        and no lure is opened, propagation remains preparation.
  defender_model:
    paragraphs:
    - zh: A 端传感器可见介质插入后异常进程枚举卷与连续写入，B 端可见相同介质接入、内容启动和后继动作；转运台账桥接两端。若隔离区不能共享遥测，至少在检查站采集介质目录与散列快照。序列号可被复用或伪造，须结合资产封签、文件集与时间顺序，不能靠单一
        ID 定罪。
      en: A-side sensors can see abnormal drive enumeration and writes after attachment; B-side sensors can see the same drive
        attach, content launch, and successor action; a transfer ledger bridges them. If an isolated zone cannot share telemetry,
        collect drive directory and hash snapshots at a checkpoint. Serials can be reused or spoofed, so combine asset seals,
        file sets, and temporal order rather than relying on one ID.
  mechanisms:
  - mechanism_ref: NM-ST
    role: primary
    evidence_keys:
    - REF-000106
    - B8B-T1091-REF-ESET-USBSTEALER
    confidence: medium
    causal_chain_zh: 接入自动播种使 A 的写入与 B 的执行分处不同时空，单端短窗失去来源链，介质标识与内容快照可重建。
    causal_chain_en: Attachment-triggered seeding separates A's write from B's execution across host and time, defeating short
      single-host origin lineage; media identity and content snapshots can reconstruct it.
  evidence_boundary:
    zh: REF-000106 直接证明自动枚举、隐藏组件和 LNK 写入，但跨国提交不证明某个企业的 A/B 链。REF-000105 对 .NET 播种模块与其他主机感染给出中等置信度。现有 CLM-000216 的跨多主机时间分散应改为有条件的观察模型推断，不应维持高置信直接观察。
    en: REF-000106 directly establishes enumeration, hidden components, and LNK writes, but multinational submissions do not
      prove a particular enterprise A/B chain. REF-000105 gives medium confidence for its .NET seeder and other-host infection.
      CLM-000216's cross-host temporal distribution should become a conditional observation-model inference, not remain a
      high-confidence direct observation.
defense_candidates:
  detection_strategies:
  - key: B8B-T1091-DET-MEDIA-HOST-LINEAGE
    resolution: create or split from DET-000054 after primary-agent governance review
    reason:
      zh: DET-000054 的目标是物理、介质和无线“入口”关联，NJA-000028 要求物理门禁和有线/无线字段，无法在无 WLAN 或无门禁遥测的 A→介质→B 横向链中按原逻辑实施。专用策略应把同一介质上写入、跨主机接入和目标执行作为唯一目标，不能只向宽泛标题添加
        NJT-0058。
      en: DET-000054 addresses physical, media, and wireless entry. Its NJA-000028 requires physical-access and wired or wireless
        fields and cannot be implemented unchanged for an A-to-media-to-B lateral chain lacking those sources. A dedicated
        strategy should target writes, cross-host attachment, and target execution on the same medium rather than merely adding
        NJT-0058 to a broad title.
    objective:
      zh: 重建已受控源主机对介质的异常播种与另一内部主机从该介质首次执行的谱系，区分内容到达与真实横向结果。
      en: Reconstruct anomalous seeding of a medium by a controlled source host and first execution from that medium on another
        internal host, separating content arrival from a lateral outcome.
    subjects:
    - NJT-0058
    - NJS-0058-001
    - NJS-0058-002
    evidence_keys:
    - REF-000091
    - REF-000105
    - REF-000106
    - B8B-T1091-REF-ESET-USBSTEALER
    - B8B-T1091-REF-MDE-DEVICE-CONTROL
    - REF-000475
    - B8B-T1091-REF-MDE-PROCESS-EVENTS
  detection_analytics:
  - key: B8B-T1091-NJA-MEDIA-CROSS-HOST
    strategy_key: B8B-T1091-DET-MEDIA-HOST-LINEAGE
    resolution: create
    logic:
      zh: 先把介质挂载记录规范化为组织资产标识、系统所见序列号、卷标识、主机与时间；再在 A 的挂载至卸载期间关联由非批准写入进程生成的可执行、脚本、LNK、AUTORUN 或隐藏内容，保存内容散列与解析后的链接目标。随后寻找同一介质在不同内部
        B 上接入，并将其后实际进程启动、UserAssist 或应用启动和首次后继动作与上述内容连接。A 写入、B 挂载、B 执行三门均通过才标为确认的横向链；缺任一门降级为播种或局部触发。对伪装项比较外观与目标命令；对自动播种项比较接入后进程枚举卷及批量写入。
      en: Normalize mount records to organizational asset identity, observed serial, volume identity, host, and time. During
        A's mount interval, join executable, script, LNK, AUTORUN, or hidden-content writes by unapproved processes, retaining
        content hash and parsed shortcut target. Find subsequent attachment of the same medium to a distinct internal B and
        join actual process creation, UserAssist or application launch, and first successor action to that content. Label
        a confirmed lateral chain only when A write, B mount, and B execution gates all pass; otherwise retain a seeding or
        local-trigger assessment. Compare visible lure and target command for the masquerade child, and drive enumeration
        plus burst writes after attach for the automatic-seeding child.
    required_data:
    - source_type: media-device-endpoint
      channel: MDE DeviceEvents or equivalent audited mount and device-control events
      fields:
      - Timestamp
      - DeviceId
      - ActionType
      - AdditionalFields.SerialNumber
      - AdditionalFields.DeviceId
    - source_type: endpoint-file-activity
      channel: MDE DeviceFileEvents or equivalent file audit
      fields:
      - Timestamp
      - DeviceId
      - ActionType
      - FolderPath
      - FileName
      - SHA1
      - InitiatingProcessFileName
      - InitiatingProcessCommandLine
    - source_type: endpoint-process-activity
      channel: MDE DeviceProcessEvents or equivalent process creation
      fields:
      - Timestamp
      - DeviceId
      - FileName
      - FolderPath
      - ProcessCommandLine
      - InitiatingProcessFileName
      - InitiatingProcessCommandLine
    - source_type: media-transfer-ledger
      channel: organizational transfer log or controlled inspection station
      fields:
      - asset_id
      - source_host
      - destination_host
      - transfer_time
      - approver
      - content_manifest
    correlation:
      window:
        zh: A 写入至 B 执行窗口按合法介质轮转周期设定，可从同日延伸到数周；先用本组织台账的实际分布定窗，不采用统一固定阈值。B 接入到目标进程启动的局部窗口可从分钟扩到一个工作班次，并保留跨日离线作业例外。
        en: Set the A-write-to-B-execution window from the observed authorized drive rotation cycle, ranging from the same
          day to weeks, rather than a universal threshold. The B-mount-to-process window may extend from minutes to a work
          shift, with exceptions for offline work crossing days.
      dimensions:
      - organizational_media_asset
      - observed_media_serial
      - volume_id
      - content_sha1
      - source_device_id
      - target_device_id
      - process_lineage
      - transfer_record
      - time
    false_positives:
    - zh: 经批准的离线更新、批量软件安装、取证拷贝、备份恢复和加密盘初始化也会产生多主机接入、脚本或安装器执行，应结合批准包清单、签发主体和预期目标主机消歧。
      en: Approved offline updates, bulk installation, forensic copying, backup restore, and encrypted-drive initialization
        can also create multi-host mounts and installer execution; use approved package manifests, signers, and expected target
        hosts to distinguish them.
    blind_spots:
    - zh: 隔离 B 未部署 EDR、介质序列号重复或伪造、日志滞后或过期、载荷先复制到本地再运行，以及 LNK 目标未解析时都可能切断三门关联。MDE 文档还提示设备控制事件存在每日每设备限制和报告延迟，须以部署实测核对。
      en: No EDR on isolated B, duplicated or spoofed serials, delayed or expired logs, copying the payload locally before
        execution, and unparsed LNK targets can break the three-gate join. MDE documentation also notes a per-device daily
        device-control event limit and reporting delay, which must be checked in the deployment.
    tuning:
      zh: 以介质资产与批准用途建立基线，按角色限定可执行内容、写入主机和目标主机；只把经过审批的具体散列、签发者、版本和有效期纳入例外。保留 B 端实际执行门，不能因维护盘常见就永久忽略介质上的新脚本或异常链接目标。
      en: Baseline media assets and approved purposes, constraining executable content, writer hosts, and target hosts by
        role. Scope exceptions to an approved hash, signer, version, and validity period. Preserve the B-side execution gate;
        common maintenance drives must not permanently suppress new scripts or anomalous shortcut targets.
    evidence_keys:
    - REF-000105
    - REF-000106
    - B8B-T1091-REF-ESET-USBSTEALER
    - B8B-T1091-REF-MDE-DEVICE-CONTROL
    - REF-000475
    - B8B-T1091-REF-MDE-PROCESS-EVENTS
  mitigations:
  - existing_ref: MIT-000053
    resolution: extend existing media controls with target-specific applications; split if primary agent finds the combined
      physical/WLAN purpose too broad
    measures:
    - key: approved-media-transfer
      zh: 对隔离区和维护流程建立批准介质台账、物理封签、入区前内容清单与可信扫描，能只读交付的介质采用只读方式。
      en: Keep an approved-media ledger, physical seals, pre-import content manifest and trusted inspection for isolated and
        maintenance transfers, with read-only delivery where possible.
    - key: execution-policy
      zh: 关闭不必要的自动运行并对介质与复制到本地后的脚本或可执行文件施行应用控制，验证 LNK/AUTORUN 的实际目标而非只审外观。
      en: Disable unnecessary autorun and apply application control to scripts and executables on media and after local copying,
        checking actual LNK or AUTORUN targets rather than appearance alone.
    parent_application:
      use:
        zh: 对 NJT-0058 的 TA0008 路径，限制已受控 A 能写入会进入 B 的介质，入区前采集介质内容清单并在 B 拒绝未经批准的启动目标；保留 A/B 双端介质与进程审计。
        en: For NJT-0058's TA0008 path, limit writing by controlled A to drives destined for B, capture a content manifest
          before import, reject unapproved launch targets on B, and retain media and process audit from both endpoints.
      expected_effect:
        zh: 减少攻击内容进入跨域介质和在 B 上执行的机会，并保留介质写入与目标动作的可关联证据。
        en: Reduce opportunities for attack content to enter a cross-boundary drive and execute on B while preserving joinable
          evidence of drive writes and target action.
      limitations:
        zh: 禁用 AutoRun 不阻止用户打开伪装 LNK；微软 USB ASR 规则的覆盖还依赖规则和病毒防护配置，需核查复制到本地的执行路径。批准盘本身若在 A 被改写，单纯白名单仍会失效。
        en: Disabling autorun does not stop a user opening a disguised LNK. The Microsoft USB ASR rule also depends on rule
          and antivirus configuration, so test execution after local copying. An approved drive rewritten on A defeats an
          allowlist based only on drive identity.
    child_applications:
      NJS-0058-001:
        use:
          zh: 入区检查解析快捷方式目标和自动运行设置，比较显示名、图标与真正命令；B 上阻断未经批准的解释器、安装器或脚本链。
          en: At the import checkpoint, parse shortcut targets and autorun configuration, compare displayed name and icon
            with real commands, and block unapproved interpreter, installer, or script chains on B.
        limitation:
          zh: 用户仍可能触发已签名系统工具，单靠未签名程序阻断不足。
          en: A user may still trigger signed system utilities; blocking unsigned programs alone is insufficient.
      NJS-0058-002:
        use:
          zh: 在 A 上限制新接入盘的自动写入主体并告警异常卷枚举与成批诱饵创建；轮转盘入区前进行可信内容清单差异检查。
          en: Constrain processes allowed to write newly attached drives on A, alert on abnormal volume enumeration and bulk
            lure creation, and compare a trusted manifest before rotating drives into B.
        limitation:
          zh: 合法备份、介质初始化和离线补丁流程需要限定例外，隔离 A 缺少端点日志时只能在检查站发现部分差异。
          en: Approved backup, media initialization, and offline patch workflows need narrow exceptions; without A-side telemetry
            in an isolated zone, a checkpoint sees only some discrepancies.
