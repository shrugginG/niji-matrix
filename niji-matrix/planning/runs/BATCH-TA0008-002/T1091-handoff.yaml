      - REF-000106
      - B8B-T1091-REF-ESET-USBSTEALER
      level: observed source-side attachment-triggered seeding; low-alert effect is conditional
    unsupported_or_deferred:
    - zh: CASE-000109 不记录同一介质在 A 和 B 的连续遥测，只能作为 B 侧触发案例复用；不能当作已完成横向移动的独立案例。
      en: CASE-000109 lacks continuous telemetry for the same drive across A and B. Reuse it only as a B-side trigger example,
        not as a standalone confirmed lateral-movement case.
    - zh: LitterDrifter 报告中的跨国感染迹象不是同一受害组织内的横向记录；Microsoft 对其播种模块归因本身标为中等置信度。
      en: LitterDrifter's cross-country infection indications are not a lateral record within one victim organization; Microsoft
        rates attribution of its seeding module at medium confidence.
    - zh: 未证明攻击者有意控制每次介质转运的延迟，也未证明自动播种比人工复制产生更少端点痕迹。
      en: No source proves deliberate control of every transport delay or that automatic seeding creates fewer endpoint traces
        than manual copying.
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: false
    candidate_specific_prose: false
    repeated_prose_reviewed: true
    notes:
      zh: 现有 NJT-0058 与两个 NJS 形式完整，但定义、匿迹特性、威胁模型、机理和限制大量复用“入口面、身份、信任路径、跨层网络内容设备供应痕迹”等跨候选模板；父级明确排除横向移动，分类与 T1091 固有双战术映射冲突。本文逐字段提供针对介质载体、A/B
        两端、触发与播种的双语改写素材；正式字段完成须由主 Agent 写入后复核。
      en: Existing NJT-0058 and both children are structurally complete, but definitions, stealth properties, threat models,
        mechanisms, and limitations reuse broad entry-surface and cross-layer boilerplate. The parent explicitly excludes
        lateral movement, contradicting T1091's dual-tactic mapping. This handoff supplies paired field-specific rewriting
        material for media carriage, the A/B hosts, triggering, and seeding. Formal field completion requires primary-agent
        integration and review.
  existing_content_remediation:
    parent:
      name_summary: Rename to a tactic-neutral propagation label; remove first-entry-only summary.
      classification: Add TA0008 to tactic_refs and create its separate TA0008 decision; keep classification.decision_ref
        as DEC-TA0001-T1091 because that parent field is singular.
      definition_and_concept: Replace first foothold endpoint with host-to-host media carrier, trigger, and two tactic result
        gates.
      stealth_characteristics: Name absent network-transfer event, source writes, target mounts and process lineage, and conditions
        that make automation noisy.
      scope_boundary_definition: Remove categorical exclusion of lateral movement; distinguish T1570 file arrival, T1080 shared
        content, NJT-0081 user execution, legal offline operations.
      application_scenarios: Use an already compromised internal workstation and rotating maintenance drive to an isolated
        host; say when it is initial access instead.
      attacker_model: Require drive write, transport path, payload compatibility and working click or autorun condition; do
        not imply default Autorun.
      defender_model: Identify A and B endpoint telemetry, media identity and transfer ledger; state air-gap EDR and serial
        reliability gaps.
      stealth_mechanisms: Replace three cloned cross-layer analyses with media-specific NM-FD and conditional NM-ST; remove
        unsupported generalized NM-BT unless new evidence supports it.
      taxonomy: Define source-side automated seeding versus recipient-side trigger appearance, and avoid treating LNK/AUTORUN
        as children.
      evidence: Add ESET A/B source, separate TA0008 claim, and lower or qualify CLM-000216's directly-observed cross-host
        language.
      limitations: State reverse-engineered capability versus complete incident telemetry and regular-maintenance lookalikes.
    NJS-0058-001:
      definition_and_concept: Explain visible lure versus actual link or autorun target, not generic first-entry control.
      stealth_characteristics: Begin with exact bilingual child names and describe display/target mismatch, UserAssist and
        child-process residue.
      scope_boundary_definition: Require a B-side trigger for TA0008 and distinguish legitimate branded install media and
        NJS-0058-002.
      application_scenarios_and_threat_model: Specify operator transfer, user-click or legacy autorun prerequisite, B-side
        content and process telemetry.
      stealth_mechanisms: Keep NM-FD with direct Microsoft/ESET support; remove weak generic NM-BT unless observable blankness
        is independently shown.
      evidence_and_limitations: CASE-000109 is recipient trigger only; brand naming may encourage click but does not prove
        user motive or internal A/B chain.
    NJS-0058-002:
      definition_and_concept: Clarify attachment-triggered automatic writes rather than assuming less observable replication.
      stealth_characteristics: Explain temporal separation and explicit burst-write or repeated-hash residue.
      scope_boundary_definition: Require auto-enumeration or write evidence and B-side outcome for TA0008; distinguish approved
        backup or offline updater.
      application_scenarios_and_threat_model: Specify controlled A, writable rotating media, platform-compatible B, and checkpoint
        visibility.
      stealth_mechanisms: Retain only conditional NM-ST; do not claim automatic replication makes action blank on a single
        host because A logs may show many writes.
      evidence_and_limitations: REF-000106 proves code behavior, not same-enterprise lateral incident; qualify CLM-000216
        and refrain from high confidence on unmeasured alert reduction.
    shared_defense:
      DET-000054_NJA-000028: Existing broad physical, wireless and media entry prose and required fields are unsuitable for
        a dedicated cross-host media join. Keep TA0001 utility, create or split an executable TA0008 strategy and analytic.
      MIT-000053: Current NJT/NJS applications are near-identical substitutions of names and still include irrelevant WLAN
        and switch-port controls; rewrite three media applications around approved drive movement, content inspection, trigger
        policy, source write restriction and residual limitations.
  source_integrity_repairs_for_primary_agent:
  - ref: REF-000105
    existing_url: https://www.microsoft.com/en-us/security/blog/2022/07/28/raspberry-robin-worm-part-of-larger-ecosystem-facilitating-pre-ransomware-activity/
    verified_url: https://www.microsoft.com/en-us/security/blog/2022/10/27/raspberry-robin-worm-part-of-larger-ecosystem-facilitating-pre-ransomware-activity/
