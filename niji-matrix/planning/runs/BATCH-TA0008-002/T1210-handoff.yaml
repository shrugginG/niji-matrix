research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - axis: unauthenticated-service-transition
      resolution: parent-core
      attacker_control: choose an accessible vulnerable service and triggering request
      trace_change: request and service result can lack a normal user-session or management-command edge
      defender_observation: identity-only lateral rules can miss the cross-host lineage
      reason: Condition is part of parent exploitation, not a stable mutually distinct child; some remote exploits require
        authentication or emit anonymous logons.
    - axis: version-conditioned-target-selection
      resolution: evidence-deferred
      attacker_control: scan or infer exact vulnerable build before exploitation
      trace_change: might reduce failed exploit packets, but existing reports measure only discovery or target selection
      defender_observation: potential reduction in failed attempts not demonstrated
      reason: ESET InvisiMole and Microsoft NotPetya show discovery/conditions, not a deliberate low-noise gating result or
        child-specific defense.
    - axis: fallback-after-credential-failure
      resolution: parent-core
      attacker_control: choose exploit when credential and management paths fail
      trace_change: alternate path changes activity type; NotPetya remains noisy and concurrent
      defender_observation: separate authentication and exploit telemetry needed at parent level
      reason: Functional fallback is documented, but not stealth optimization or a distinct stable evasion partition.
    - axis: low-telemetry-internal-service
      resolution: evidence-deferred
      attacker_control: select an internal appliance or service with limited endpoint logging
      trace_change: target result would be less locally recorded
      defender_observation: would require independent network/service monitoring
      reason: No event-specific T1210 source reviewed proves intentional telemetry-sparse target selection; overlaps NJS-0054-002
        in public-edge context but cannot import it.
    - axis: service-process-origin-attribution
      resolution: parent-core
      attacker_control: select exploit payload and resulting target process context
      trace_change: target action may be attributed to the vulnerable service
      defender_observation: requires source request to target process lineage
      reason: Common exploit outcome and no independent evidence of intentional attribution manipulation here; later injection
        or masquerade belongs to adjacent techniques.
    - axis: fault-suppressed-exploit
      resolution: evidence-deferred
      attacker_control: design reliable exploit that avoids a service crash
      trace_change: removal of service-fault signal
      defender_observation: fault-based analytic would lose one corroborator
      reason: No comparative incident or experiment establishes this variable for a lateral remote-service exploit.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 固定父项没有 ATT&CK 子项，但仍完成六条原生匿迹变量开放搜索。零子项来自稳定性、独立观察差异和结论级证据门禁，并非照搬 ATT&CK 数量。
      en: The fixed parent has no ATT&CK children, yet six native stealth axes were examined. Zero children follow the stability,
        distinct-observation, and conclusion-level evidence gates, not the ATT&CK count.
