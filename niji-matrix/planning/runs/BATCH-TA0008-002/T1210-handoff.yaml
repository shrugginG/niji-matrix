    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 双语研究要点分别覆盖定义与横向结果门、条件性匿迹特性、纳排和 T1021/T1563/T1570/T1190/提权边界、两个有来源约束的场景、攻击者和防守方前提、机理、六条 taxonomy 候选轴及证据限制；未按 NJT-0001
        的子项或字数配额仿写。
      en: The paired research prose covers definition and lateral outcome, conditional stealth property, inclusion and T1021/T1563/T1570/T1190/privilege
        boundaries, two source-limited scenarios, attacker and defender prerequisites, mechanism, six taxonomy axes, and evidence
        limits without copying NJT-0001's child count or length.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - YAML parse validation only
  limitations:
    paragraphs:
    - zh: 固定版本 ATT&CK 用于行为和战术锚点；滚动 T1210 页面标有 2026-08-04 更新，不可把其新增案例、检测策略或平台列表冒充 19.1。ESET 白皮书虽提供目标网络中 DoublePulsar、SMB 会话及后继
        loader 的实测序列，但明确未取得 EternalBlue 利用代码，也未给出足以判断是否避开授权日志的完整事件流；服务上下文后继进程不能反推出攻击者匿迹意图。Microsoft 的 NotPetya 报告明确将后备 SMB
        漏洞尝试与已通过凭据执行的路径分开，因此只能把前者写为尝试，而不能嫁接后者成功结果。
      en: The fixed ATT&CK version anchors behavior and tactic. The rolling T1210 page reports an update on 2026-08-04, so
        its newer cases, detection strategy, or platform listing must not be passed off as 19.1. ESET's white paper measures
        a DoublePulsar, SMB-session, and successor-loader sequence in a target network, but explicitly lacks the EternalBlue
        exploit code and a complete event stream proving whether authorization logs were bypassed. A service-context successor
        process cannot be used to infer the actor's stealth intent. Microsoft explicitly separates NotPetya's fallback SMB
        exploit attempts from paths already executing through credentials; the former remain attempts and cannot inherit the
        latter's successful outcome.
    - zh: CISA 的成功 shell 来自授权评估，并无实测匿迹成效或登录审计差分。漏洞触发并不普遍无认证，也未必不会产生登录或服务事件；无 4624、服务崩溃或高权限进程任何一个孤立指标都不足以判定利用。若后续获得公开现场样本或内部受控实验显示条件门控、低遥测目标选择、故障抑制对同一漏洞的可重复观察差异及独立防御逻辑，可重新评估正式子项；在此之前保持零
        NJS。
      en: CISA's successful shell came from an authorized assessment and provides no measured evasion outcome or logon-audit
        differential. Remote exploit triggers are not universally unauthenticated and can produce logon or service events.
        Absence of 4624, a crash, or a privileged process alone is insufficient. A later field sample or controlled experiment
        demonstrating repeatable observation differences and distinct defense for conditional gating, telemetry-sparse target
        selection, or fault suppression could justify reopening formal children. Until then, keep zero NJS.
  rejected_mechanisms:
  - mechanism_ref: NM-FD
    reason: Normal service ports and service identities exist, but no source establishes intentional appearance mimicry by
      the exploit step; malformed packets may be conspicuous.
  - mechanism_ref: NM-ST
    reason: Source and target traces require correlation, but their distribution is ordinary cross-host causality rather than
      a proved attacker-controlled temporal or spatial dilution design.
  - mechanism_ref: NM-DO
    reason: SMB packet XOR encoding observed for NotPetya cannot alone establish obscured exploit content from network defenders,
      and encoding is implementation-specific.
  open_questions:
  - Can a primary incident report provide an actual exploit-input capture plus target-process and audit sequence beyond ESET's
    observed SMB session and loader?
  - Is any conditional exploit gate shown to reduce observable failed attempts independently of ordinary vulnerability discovery?
  - Does the primary agent already have a canonical REF for the ESET 2020 InvisiMole URL through T1080 research?
