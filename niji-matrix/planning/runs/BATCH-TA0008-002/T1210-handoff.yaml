handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0008-002
work_item_ref: WORK-TA0008-T1210
temporary_key_prefix: B8B-T1210
candidate:
  source_type: attack
  source_attack_id: T1210
  name:
    zh: 利用远程服务
    en: Exploitation of Remote Services
recommendation:
  decision: adapt
  confidence: medium
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 的 T1210 将已进入网络后的远程服务漏洞利用列入横向移动，父项没有子项。ESET 一手白皮书记录 InvisiMole 使用 BlueKeep 与 EternalBlue
        在内网部署载荷，并在某目标网络看到 DoublePulsar、SMB 会话后数秒执行 loader，但未取得 EternalBlue 利用代码；Microsoft 对 NotPetya 的网络与样本分析将凭据、PsExec/WMIC
        和 SMB 漏洞后备路径分开；CISA 的授权医疗行业演练则直接记录 EternalBlue 利用后在另一台服务器取得本地 SYSTEM shell。这些来源足以保留漏洞触发跨主机受控结果的父行为，但 Niji 需要把尝试、可利用状态、目标上的实际受控结果与匿迹观察差异分级，因此建议
        adapt。
      en: The fixed ATT&CK Enterprise 19.1 T1210 parent places post-entry exploitation of a remote service under Lateral Movement
        and has no child techniques. ESET's primary white paper records InvisiMole using BlueKeep and EternalBlue to deploy
        payloads internally and finding DoublePulsar and an SMB session followed seconds later by a loader in one target network,
        while explicitly lacking the EternalBlue exploit code. Microsoft's NotPetya network and sample analyses distinguish
        credential use, PsExec or WMIC, and a fallback SMB exploit route. CISA's authorized healthcare assessment directly
        records an EternalBlue exploit yielding a local SYSTEM shell on another server. These sources support the parent behavior
        of crossing to a controlled target through a vulnerable service, while Niji must separate attempts, exposure, an actual
        controlled target outcome, and a conditional stealth observation difference; adapt is recommended.
    - zh: 匿迹特性是有条件的观察差异：当防守方仅按合法远程登录或管理调用串联横向活动时，未认证或未经过常规授权流程的漏洞触发可能使源主机、目标服务状态及目标后继进程之间缺少预期的用户会话边；目标服务仍可留下异常请求、故障、利用阻断和后继进程。Microsoft
        的 MS17-010 公告确认有关 SMBv1 请求在多数情形可由未认证攻击者发送，而 4624 文档说明该事件只描述成功登录且字段依协议变化。把两者连接为检测盲区是经来源支持的分析推论，不是各事件均已实测“无登录记录”，也不证明每次利用出于主动匿迹目的。
      en: The stealth property is conditional on the defender's observation model. A defender that reconstructs lateral movement
        only from valid remote logons or management operations may miss the link among an originating host, a vulnerable target
        service, and a target successor process when an exploit triggers without ordinary authorization; anomalous requests,
        faults, blocks, and successor activity can remain. Microsoft's MS17-010 bulletin says that in most circumstances an
        unauthenticated actor can submit relevant SMBv1 requests, while its 4624 documentation defines the event as a successful
        logon and notes protocol-dependent fields. Connecting these facts into a possible detection gap is an evidence-based
        inference, not an observed claim that every attack leaves no logon record or that every exploit was chosen to hide.
proposed_content:
  summary:
    zh: 攻击者从既有内网立足点触发另一主机远程服务的漏洞，在目标取得可控状态；利用请求与目标结果可能脱离正常远程登录谱系。
    en: From an existing internal foothold, an adversary triggers a vulnerability in another host's remote service and gains
      a controlled target state; the exploit request and outcome may lack an ordinary remote-logon lineage.
  definition_and_concept:
    paragraphs:
    - zh: 利用远程服务是攻击者已在一个组织网络内控制来源主机或工作负载后，向另一内部系统可达的服务提交能够触发软件缺陷的输入，使目标执行攻击者可控代码、打开控制通道或产生可证明的受控状态。直接横向结果是另一主机开始在攻击者控制下运行或提供新的访问能力；扫描到脆弱版本、发送利用包、服务崩溃或载荷文件到达都不足以单独证明这个结果。T1210
        的对象是跨主机的脆弱服务转换，不由 SMB、RDP、RPC、特定 CVE 或利用工具定义。
      en: Exploitation of Remote Services begins with an adversary-controlled source host or workload already inside an organization's
        network. The actor supplies input to a reachable service on another internal system, triggers a software defect, and
        causes adversary-controlled code, a control channel, or another provably controlled state on the target. The direct
        lateral outcome is that a second host operates under the actor's control or yields a new control capability. A vulnerable
        version, exploit packet, service crash, or delivered file alone does not establish that outcome. The object is a vulnerable
        service transition across hosts, not SMB, RDP, RPC, a CVE, or an exploit tool.
    - zh: 对匿迹矩阵而言，该技术的概念重点是利用服务已有的网络入口和执行上下文跨越通常需要授权会话才能跨越的主机边界。攻击者未必隐藏利用输入，而且攻击包可能十分显著；观察困难来自源侧请求、目标服务运行状态与目标上首个攻击者可控结果之间的因果边需要跨传感器重建。若直接结果只是同一主机更高权限，则归提权；若攻击者先以已有凭据正常建立会话，则远程服务登录由
        T1021 类对象承担。
      en: For a stealth matrix, the concept centers on crossing a host boundary through a service's existing network entry
        and execution context where ordinary operations would require an authorized remote session. The actor need not hide
        the exploit input, and an exploit packet may be conspicuous. The observation difficulty is that the causal edge among
        the source request, target service state, and first adversary-controlled target outcome must be reconstructed across
        sensors. An outcome confined to greater authority on the same host belongs to privilege escalation. A normal session
        created first with existing credentials belongs to the T1021 class of remote-service access.
  stealth_characteristics:
    paragraphs:
    - zh: 此行为可把横向控制的可见来源从用户登录和远程管理命令转移到原本持续对内开放的服务请求。仅看 4624 登录、RDP 会话或管理共享活动的分析可能看不到一条完整的源到目标权限边，却仍能看到内网连接、协议异常、服务崩溃或重启、漏洞缓解事件，以及目标服务之后的进程或网络行为。服务是否确实以未认证方式触发、攻击者是否同时使用凭据，必须逐事件证明；不能因没有用户登录事件就断言漏洞利用。
      en: The behavior can move the visible origin of lateral control from a user logon or management command to a request
        against a service already listening inside the network. Analytics limited to 4624 logons, RDP sessions, or administrative
        shares may miss a complete source-to-target authority edge, while internal connections, protocol anomalies, service
        crashes or restarts, exploit-mitigation events, and later target process or network activity may remain. Whether the
        specific trigger was unauthenticated and whether credentials were also used require incident-level proof; absence
        of a user logon event alone does not establish exploitation.
    - zh: 利用链本身也可能很嘈杂。NotPetya 的多目标端口探测、SMBv1 异常请求和并发线程不是低噪声匿迹证据；Microsoft 同时记录了可被网络和终端防护发现的痕迹。ESET 的易受攻击主机探测说明攻击者可先收集条件，但报告没有证明筛选显著降低告警或使后续利用无故障。因此父级只记录由观察模型造成的条件性盲区，不把扫描、加密、进程注入或后继清理自动并入
        T1210 的匿迹效果。
      en: The exploit chain can also be noisy. NotPetya's multi-target port probing, unusual SMBv1 packets, and concurrent
        threads do not establish low-noise evasion, and Microsoft describes observable network and endpoint traces. ESET's
        vulnerable-host discovery shows that an actor can collect target conditions but does not show that selection materially
        reduced alerts or made later exploitation faultless. The parent therefore records a conditional gap in an identity-centered
        observation model, without automatically absorbing scanning, encryption, process injection, or later cleanup into
        T1210's stealth effect.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入要求三个可区分环节：先有内部受害来源或同一企业内已受控工作负载；再有针对另一内部系统的远程服务漏洞触发；最后有目标上可验证的攻击者可控代码、shell、控制通道或状态变化。只有最后一环成立才称横向成功，证据只到请求或漏洞告警时应标成尝试。合法漏洞扫描、补丁验证、渗透测试、服务质量故障与管理员维护可能产生类似网络或故障信号，需结合授权范围和变更记录排除。
      en: 'Inclusion requires three distinct gates: an already compromised source or workload inside the enterprise, a vulnerability
        trigger against a remote service on another internal system, and verifiable adversary-controlled code, shell, channel,
        or state change on that target. Only the last gate supports a successful lateral result; a request or vulnerability
        alert alone supports an attempt. Authorized vulnerability scanning, patch validation, penetration testing, service
        reliability faults, and administration can produce similar network or fault signals and need scope and change-record
        checks.'
    - zh: T1021 的核心是利用既有合法权限建立新远程会话，T1563 是接管另一主体已有会话，T1570 截止于工具文件抵达目标；本项必须存在脆弱转换而非仅连接、接管或复制。公网公开应用作为组织第一个入口归 T1190/NJT-0054，先有内部立足点再攻击内网服务才进入本项；同一次利用也可能带来目标上的提权结果，但其横向归属须由跨主机控制证实。利用后通过目标服务创建系统进程不自动构成防御损伤、凭据窃取或持久化。
      en: T1021 uses already valid authority to establish a new remote session, T1563 takes over another principal's existing
        session, and T1570 ends at a tool's arrival on the target. This subject requires a vulnerable transition rather than
        mere connection, takeover, or copying. A public-facing application that provides the first organizational foothold
        belongs to T1190/NJT-0054; this subject begins after an internal foothold and targets an internal service. The same
        exploit may also yield greater authority on the target, but the lateral classification needs evidence of cross-host
        control. A system process created after exploitation does not automatically constitute defense impairment, credential
        theft, or persistence.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者已控制一台内网终端，从该处确认其他主机可达旧版文件共享或桌面服务，再向符合条件的目标服务发送利用输入，尝试在另一主机取得可操作的控制。InvisiMole 的研究显示 RDP 与 SMB 漏洞传播可与共享内容污染并存；这些是不同的跨主机路径。NotPetya
          在凭据和管理工具路径之后使用 SMB 漏洞作为后备，说明实际活动可在同一目标上混合多种横向方式；任何归因都必须按目标和时间重新区分。
        en: An actor controlling an internal endpoint can identify other hosts reachable through an older file-sharing or
          desktop service, then submit an exploit input to a matching target to gain operative control of another host. InvisiMole
          research describes RDP and SMB exploit spread alongside tainted shared content, which are distinct routes across
          the host boundary. NotPetya used an SMB exploit route after credential and management-tool paths, illustrating that
          one campaign can mix lateral methods against a target; attribution must be separated by target and time.
      - zh: CISA 在医疗行业风险评估中经授权利用一台未修补服务器的 EternalBlue 缺陷并取得本地 SYSTEM shell，给出了“脆弱状态—利用—目标结果”的可核查样例。该样例是演练，不应写成恶意活动案例，也不证明利用在该环境中成功躲避监控。它帮助设定父项所需的结果门，现场恶意活动的传播证据则分别来自
          ESET、Microsoft 与 CISA 对 Emotet 的报告。
        en: In an authorized healthcare risk assessment, CISA exploited EternalBlue on an unpatched server and obtained a
          local SYSTEM shell. This provides a reviewable vulnerable-state, trigger, and target-result example. It is an exercise,
          not a malicious incident, and it does not show that the exploit evaded monitoring there. It sets the parent outcome
          gate; field reporting on malicious propagation comes separately from ESET, Microsoft, and CISA's Emotet advisory.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少已控制一个内部可达来源，能识别目标地址和远程服务，知道或推测其构建、补丁、配置及利用前提，并能发送足以触发缺陷的协议输入或请求。利用稳定性、平台匹配和网络路径决定成功率；误判会产生大量失败探测、服务故障或被缓解措施阻断。若后续需要持续
            shell 或载荷，攻击者还要使利用结果转化为可操作能力；扫描模块或公开 PoC 的存在不证明这一能力已在事件中生效。
          en: The actor needs an already controlled internal source with reachability to the target service, knowledge or
            inference of its build, patch, configuration, and exploit prerequisites, and the ability to send the triggering
            protocol input or request. Reliability, platform matching, and network path affect success; wrong assumptions
            can produce failed probes, service faults, or exploit-mitigation blocks. If a durable shell or payload is needed,
            the actor must turn the exploit effect into an operative capability. A scanner module or public proof of concept
            does not establish that capability in an incident.
        - zh: 攻击者可选择凭据路径、漏洞路径或两者并用；选择漏洞路径本身只说明访问策略或目标条件，不能推断其主观匿迹意图。若期望避开按登录聚合的防守逻辑，攻击者还需知道该逻辑的局限，而公开事件通常不提供这种知识证据。对所有版本、协议和载荷采用统一的“无认证、无文件、无故障”假设会扩大结论超过证据。
          en: The actor may choose credentials, an exploit, or both. Selecting an exploit demonstrates an access route or
            target condition by itself, not an intent to evade. To exploit a logon-centered analytic gap intentionally, the
            actor would also need to know that defensive limitation, which public incident reports rarely establish. A blanket
            assumption of unauthenticated, fileless, or faultless behavior across builds, protocols, and payloads exceeds
            the evidence.
      defender_model:
        paragraphs:
        - zh: 防守方若同时保有源主机网络连接、目标网络流量或 NDR 检测、事件时软件清单和补丁状态、目标服务故障/缓解事件、目标进程或受保护对象变化，便可尝试重建跨主机因果。Windows 4624 或远程会话日志有助于排除正常管理路径，但缺失、字段为空或出现匿名登录都不能单独支持或反驳漏洞利用；还要检查该协议和审计配置确实会生成什么事件。
          en: A defender retaining source-host connections, target-side traffic or NDR alerts, time-valid software and patch
            inventory, target service faults or mitigation events, and target process or protected-object changes can reconstruct
            the cross-host causal chain. Windows 4624 or remote-session logs help distinguish ordinary management routes,
            but a missing event, blank field, or anonymous logon alone neither proves nor disproves exploitation. The protocol
            and local audit configuration determine which events should exist.
        - zh: 只监控身份或只覆盖源主机时，目标受控结果难以验证；只看到目标进程时，来源请求和漏洞转换难以归因。加密协议、NAT、多租户服务、传感器遗漏、短保留期和并发管理操作会削弱关联。对受控高价值服务，应预先定义可达来源、正常服务子进程、维护窗口和漏洞修复状态，作为判定异常的上下文，而不是把任意
            445/3389 连接当作利用。
          en: Identity-only monitoring or source-only coverage makes target control difficult to verify; an outcome-only process
            event loses the originating request and vulnerable transition. Encryption, NAT, multitenant services, missing
            sensors, short retention, and concurrent administration weaken correlation. For high-value services, defenders
            should establish permitted sources, normal service children, maintenance windows, and remediation state in advance
            instead of treating every connection to port 445 or 3389 as exploitation.
  stealth_mechanisms:
  - mechanism_ref: NM-BT
    role: primary
    summary:
      zh: 脆弱服务转换使横向结果落在正常登录关联之外
      en: Vulnerable service transition places lateral outcome outside ordinary logon correlation
    analysis:
      paragraphs:
      - zh: 在无需正常远程登录即可触发的服务缺陷中，攻击者从内网来源发送利用输入，目标服务在自身执行上下文内产生攻击者可控结果。若防守逻辑只把成功登录和管理调用作为横向移动的起点，就可能把网络请求和目标后继活动拆成不相干事件，从而错过跨主机控制；独立的请求、漏洞状态、服务故障或缓解、目标进程及回连仍能重建因果。MS17-010
          未认证请求与 CISA 演练取得 SYSTEM shell 支持这条可能路径，Microsoft 登录事件规范支持观察模型分析；公开材料未提供该演练的逐事件登录日志，故机理置信度限为 medium。
        en: For a service flaw triggerable without a normal remote logon, an actor sends exploit input from an internal source
          and the target service produces an adversary-controlled result in its own execution context. An analytic that starts
          lateral reconstruction only from successful logons and management calls can separate the network request from target
          successor activity and miss cross-host control. Independent request, vulnerability state, service fault or mitigation,
          target process, and callback records can restore the lineage. MS17-010's unauthenticated request condition and CISA's
          exercise yielding a SYSTEM shell support this possible route; Microsoft's logon-event specification supports the
          observation-model analysis. The public exercise does not publish event-by-event logon telemetry, so confidence is
          medium.
    evidence_keys:
    - B8B-T1210-REF-ATTACK19
    - B8B-T1210-REF-MS17-010
    - B8B-T1210-REF-CISA-RVA
    - B8B-T1210-REF-EVENT4624
    confidence: medium
  subtechnique_taxonomy:
    coverage: none-justified
    proposed_child_count: 0
    narrative:
      paragraphs:
      - zh: 已开放搜索无认证转换、目标条件门控、低遥测内网服务、凭据失败后的漏洞回退、服务进程归因和故障抑制等变量。无认证转换是父行为的一个重要条件和检测分层，而非可与另一个兄弟子项分离的独立匿迹设计。目标条件探测与回退利用有活动证据，但未证明其相对非选择性利用的痕迹减少或专用防御差异；低遥测目标和故障抑制缺少本候选的结论级事件证据。因此本批建议零正式
          NJS，后续证据若显示稳定可控变量与独立观察差异再重开。
        en: The search examined unauthenticated transitions, target-condition gating, low-telemetry internal services, exploit
          fallback after credential failure, service-process attribution, and fault suppression. An unauthenticated transition
          is an important parent condition and detection tier, not an independent stealth design separable from a sibling.
          Target checking and exploit fallback have activity evidence but no demonstrated trace reduction against unselective
          exploitation or distinct defensive requirement. Low-telemetry targets and fault suppression lack conclusion-level
          incident evidence for this candidate. Zero formal NJS are recommended for this batch; reopen when a stable controllable
          variable and independent observation difference are evidenced.
proposed_subtechniques: []
defense_candidates:
  detection_strategies:
  - key: B8B-T1210-DET-EXPLOIT-RESULT
    name:
      zh: 内网服务利用输入到目标受控结果关联
      en: Internal Service Exploit Input to Controlled Target Outcome
    objective:
      zh: 将已受害内网来源对精确脆弱服务的利用迹象、目标服务状态和首个目标受控结果连成一条证据链，并把尝试与成功分级。
      en: Join exploit indications from an already compromised internal source against an exactly vulnerable service to target
        service state and the first controlled target outcome, grading attempt separately from success.
    split_or_reuse: create
    reason:
      zh: 现有 DET-000107 检查漏洞造成的审计生成差分，DET-000085 检查客户端解析利用，DET-000094 检查远程会话状态；它们都不以远程脆弱服务请求加另一主机受控结果为目标。
      en: DET-000107 tests an exploit-caused audit-generation differential, DET-000085 covers client parse exploitation, and
        DET-000094 examines remote-session state. None targets a vulnerable remote-service request plus controlled outcome
        on another host.
    evidence_keys:
    - B8B-T1210-REF-CISA-RVA
    - B8B-T1210-REF-ESET-INV2020
    - B8B-T1210-REF-MS-PETYA-NET
    - B8B-T1210-REF-MDE-NET
    - B8B-T1210-REF-MDE-PROC
  detection_analytics:
  - key: B8B-T1210-NJA-EXPLOIT-RESULT
    strategy_key: B8B-T1210-DET-EXPLOIT-RESULT
    name:
      zh: 脆弱内网服务请求—目标后继控制关联
      en: Vulnerable Internal Service Request to Target Successor Control
    logic:
      zh: 以目标服务清单和事件时补丁状态锁定真实可达的受影响版本；把内部源对该服务的 NDR 利用签名或协议异常，与目标服务的异常响应、会话状态、故障或漏洞缓解事件按源目标对和短时窗关联；ESET 的 SMB 会话后数秒出现 loader
        提供可实施的服务状态与结果样例，但其利用代码未见。若只见请求，输出 attempt；再出现目标服务异常启动 shell、未知进程、攻击者控制连接或受保护对象变化，并可排除批准管理任务时，输出 probable_result；只有本地调查证明利用输入与首个受控结果因果关系后才输出
        confirmed_result。4624/会话日志只用于比较普通授权路径，不要求其绝对缺失。若有经过批准的扫描或红队演练，保留原始事件并按工单降级。
      en: Pin the target to a reachable affected service build and event-time patch state. Join an NDR exploit signature or
        protocol anomaly from an internal source to an abnormal target service response, session state, fault, or exploit-mitigation
        event by source-target pair and short window. ESET's SMB session followed seconds later by a loader is an implementable
        service-state-to-result example, although its exploit code was not observed. Emit attempt for the request alone. Emit
        probable_result when the target service subsequently starts a shell or unknown process, makes an actor-controlled
        connection, or changes a protected object and approved administration has been excluded. Emit confirmed_result only
        after local investigation establishes causality between the exploit input and the first controlled result. Use 4624
        and session logs to compare ordinary authorized paths, not as a mandatory absence condition. Retain raw events for
        approved scans or red-team exercises and downgrade them by work order.
    data_requirements:
    - source_type: internal-network-ndr
      name:
        zh: 内网协议与利用告警
        en: Internal Protocol and Exploit Alerts
      channel: NDR_or_IDS_with_service_protocol_parser
      required_fields:
      - event.timestamp
      - src.ip
      - dst.ip
      - dst.port
      - protocol
      - signature.id
      - signature.result
    - source_type: target-service-health
      name:
        zh: 目标服务响应、会话及故障状态
        en: Target Service Response Session and Fault State
      channel: target_service_audit_or_protocol_response_plus_optional_exploit_mitigation
      required_fields:
      - event.timestamp
      - device.id
      - service.name
      - source.ip
      - state.type
      - state.result
    - source_type: target-process
      name:
        zh: 目标进程创建
        en: Target Process Creation
      channel: Microsoft_Defender_XDR_DeviceProcessEvents_or_equivalent
      required_fields:
      - Timestamp
      - DeviceId
      - FileName
      - InitiatingProcessId
      - InitiatingProcessFileName
      - ProcessCommandLine
    - source_type: target-successor-network
      name:
        zh: 目标后继连接
        en: Target Successor Connection
      channel: Microsoft_Defender_XDR_DeviceNetworkEvents_or_equivalent
      required_fields:
      - Timestamp
      - DeviceId
      - LocalIP
      - RemoteIP
      - RemotePort
      - InitiatingProcessId
    - source_type: time-valid-vulnerability-state
      name:
        zh: 事件时软件与补丁状态
        en: Event-Time Software and Patch State
      channel: vulnerability_management_or_configuration_inventory
      required_fields:
      - device.id
      - service.name
      - software.version
      - patch.id
      - valid_from
      - valid_to
    supplemental_data:
    - Windows Security 4624 logon type and source address, where a logon is recorded, for comparison with credential-backed
      paths.
    - Authorized scan and change records keyed by source, target, scope, and time.
    observables:
    - zh: 内部受害来源对目标确切脆弱服务发生利用签名或异常请求。
      en: Exploit signature or anomalous request from an internal compromised source reaches the exact vulnerable target service.
    - zh: 目标服务出现异常响应、会话状态、故障或缓解信号，随后有不符合正常服务行为的首个受控结果。
      en: The target service shows an abnormal response, session state, fault, or mitigation signal, followed by a first controlled
        result outside normal service behavior.
    correlation_window: 15m_request_to_target_outcome_with_event_time_inventory
    dimensions:
    - src.ip
    - src.device_id
    - dst.ip
    - dst.device_id
    - service.name
    - protocol
    - signature.id
    - event.timestamp
    - process.id
    - account.id
    false_positives:
    - authorized_vulnerability_scan
    - red_team_exercise
    - service_crash
    - patch_or_upgrade
    - normal_admin_tool
    - co_timed_benign_process
    blind_spots:
    - encrypted_or_unparsed_service_payload
    - absent_target_sensor
    - source_nat_ambiguity
    - false_vulnerability_inventory
    - quiet_exploit_without_decodable_response
    - in_process_target_state
    - missing_change_records
    tuning:
      zh: 按服务版本、正常请求比例、批准扫描源、维护窗口和服务预期子进程建立目标级基线。漏洞告警只产生尝试级别，避免把广泛 445/3389 连接或服务故障直接升级；目标侧结果及精确版本共同决定优先级。对外包扫描的例外绑定源、范围、工单和到期时间，不永久忽略内网来源。
      en: Baseline each target by service build, normal request mix, approved scanner sources, maintenance windows, and expected
        service child processes. An exploit alert yields attempt only; do not upgrade broad 445 or 3389 connections or service
        faults by themselves. Target outcome and exact build jointly determine priority. Bind outsourced-scanning exceptions
        to source, scope, work order, and expiry rather than suppressing internal sources indefinitely.
    evidence_keys:
    - B8B-T1210-REF-MS-PETYA-NET
    - B8B-T1210-REF-MS17-010
    - B8B-T1210-REF-CISA-RVA
    - B8B-T1210-REF-ESET-INV2020
    - B8B-T1210-REF-MDE-NET
    - B8B-T1210-REF-MDE-PROC
    - B8B-T1210-REF-MDE-VULN
    - B8B-T1210-REF-EVENT4624
    implementation_limit:
      zh: 上述字段是跨来源的规范化契约，不宣称同一 MDE 表单独提供所有字段；尤其 NDR 利用签名、服务故障与变更工单需要各自数据源。15 分钟是初始调优窗口，须按服务恢复时间和环境延迟调整。
      en: These fields are a normalized cross-source contract; no single MDE table is claimed to provide them all. NDR exploit
        signatures, service faults, and change tickets require their own sources. Fifteen minutes is an initial tuning window
        to adjust against service recovery and ingest delays.
  mitigations:
  - key: B8B-T1210-MIT-REMOTE-SERVICE
    name:
      zh: 内网远程服务暴露与脆弱状态治理
      en: Internal Remote Service Exposure and Vulnerability Governance
    split_or_reuse: create
    reason:
      zh: MIT-000118 限制隐藏监听及过滤器修改，MIT-000086 处理客户端解析漏洞，MIT-000051 针对公网入口；本项措施直接压缩既有内网可达服务的漏洞触发机会。
      en: MIT-000118 restricts hidden listeners and filter modifications, MIT-000086 addresses client parsing, and MIT-000051
        addresses public entry. This control directly reduces exploit opportunities in already reachable internal services.
    measures:
    - key: inventory-and-remediate
      name:
        zh: 事件时服务清单与修补
        en: Time-Valid Service Inventory and Remediation
      control_type: exposure-reduction
      description:
        zh: 为内网服务维持精确构建、补丁、可达来源及业务所有者清单，按受利用风险修补；无法立即修补时禁用脆弱功能或隔离旧版服务，例如在适用且兼容性确认后移除 SMBv1。
        en: Maintain exact build, patch, reachable-source, and owner inventory for internal services and remediate by exploitation
          risk. Where immediate patching is impossible, disable the vulnerable feature or isolate the old service, such as
          removing SMBv1 where applicable after compatibility review.
    - key: restrict-east-west-reachability
      name:
        zh: 内网源到服务可达性约束
        en: East-West Source-to-Service Reachability Restriction
      control_type: preventive
      description:
        zh: 用主机防火墙或微分段仅允许批准的管理源和业务客户端访问高风险服务，并测试规则对正常业务流量及紧急恢复的影响；把拒绝事件集中保留。
        en: Use host firewalls or microsegmentation to allow only approved management sources and business clients to reach
          high-risk services, test normal and emergency workflows, and centrally retain denied connections.
    - key: constrain-service-authority
      name:
        zh: 约束服务运行权限与利用后效果
        en: Constrain Service Authority and Post-Exploit Effect
      control_type: cost-increasing
      description:
        zh: 在服务架构允许时降低服务账户权限、隔离进程和验证 exploit protection 策略；按具体服务测试兼容性，不把 CFG/DEP 等内存缓解视为所有逻辑漏洞的修复。
        en: Where architecture permits, reduce service-account authority, isolate processes, and validate exploit-protection
          policy against the exact service. Test compatibility; memory mitigations such as CFG or DEP do not repair every
          logic flaw.
    application:
      use:
        zh: 为 T1210 覆盖的内网文件共享、远程桌面、RPC 或应用服务建立事件时可达清单，先封堵无业务需要的源目标对，再处理已知脆弱构建；对不能升级的系统实行有期限隔离和附加监测。
        en: For T1210's internal file-sharing, desktop, RPC, and application services, maintain a time-valid reachability
          inventory, block source-target pairs without a business need, then remediate affected builds. Isolate systems that
          cannot be upgraded under an expiring exception with additional monitoring.
      expected_effect:
        zh: 缩小攻击者从首个受害主机触达脆弱服务的目标集合，消除已知漏洞触发条件，并降低成功后服务上下文可造成的损害。
        en: Reduce the set of vulnerable services reachable from the first compromised host, remove known exploit conditions,
          and limit the damage available to a compromised service context.
      limitations:
        zh: 分段不能阻止来自已获批准客户端的利用；补丁存在窗口、未知漏洞和重启成本；高权限服务或内核漏洞可绕过进程级约束；关闭旧协议可能影响遗留业务。
        en: Segmentation cannot stop exploitation from an already authorized client; patch windows, unknown flaws, and restart
          costs remain. High-privilege services or kernel flaws can bypass process-level constraints, and retiring old protocols
          can disrupt legacy workflows.
    evidence_keys:
    - B8B-T1210-REF-MS17-010
    - B8B-T1210-REF-MS-PETYA-NET
    - B8B-T1210-REF-MS-PETYA-SAMPLE
    - B8B-T1210-REF-CISA-RVA
    - REF-000243
