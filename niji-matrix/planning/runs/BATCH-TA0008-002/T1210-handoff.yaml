  claims:
  - key: B8B-T1210-CLM-ADMISSION
    proposition:
      zh: 已进入网络后的内部远程服务漏洞触发可以使另一主机处于攻击者可控状态，但仅有可利用版本或利用尝试不足以判定成功。
      en: Post-entry exploitation of an internal remote service can yield an adversary-controlled state on another host, but
        a vulnerable build or attempt alone does not prove success.
    evidence_mode: source-plus-exercise
    confidence: high
    evidence_keys:
    - B8B-T1210-REF-ATTACK19
    - B8B-T1210-REF-CISA-RVA
    - B8B-T1210-REF-ESET-INV2020
  - key: B8B-T1210-CLM-OBSERVATION
    proposition:
      zh: 对可由未认证请求触发的服务漏洞，仅凭成功登录和正常管理调用聚合横向活动，会漏掉可能存在的利用输入—目标受控结果关联；这是一种条件性检测模型推论。
      en: For service flaws triggerable by unauthenticated requests, logon-and-management-only lateral analytics can miss
        the exploit-input-to-target-control link; this is a conditional observation-model inference.
    evidence_mode: analytic-inference
    confidence: medium
    evidence_keys:
    - B8B-T1210-REF-MS17-010
    - B8B-T1210-REF-EVENT4624
    - B8B-T1210-REF-CISA-RVA
  - key: B8B-T1210-CLM-MIXED-PATHS
    proposition:
      zh: NotPetya 可同时使用凭据、管理工具与后备 SMB 漏洞路径，因此同一活动中的文件复制和远程执行不能无条件归因于漏洞利用。
      en: NotPetya used credentials, management tools, and a fallback SMB exploit path; file copying or remote execution in
        the same campaign cannot automatically be attributed to the exploit.
    evidence_mode: direct-report
    confidence: high
    evidence_keys:
    - B8B-T1210-REF-MS-PETYA-NET
    - B8B-T1210-REF-MS-PETYA-SAMPLE
  - key: B8B-T1210-CLM-DEFENSE
    proposition:
      zh: 事件时修补或移除脆弱服务功能并限制无业务需要的内网源可达性，可减少已知远程漏洞路径；成功识别需同时关联利用迹象和另一主机受控结果。
      en: Time-valid remediation or feature retirement and restriction of unnecessary internal reachability reduce known remote-exploit
        paths; confirming exploitation requires both exploit indications and controlled outcome on another host.
    evidence_mode: guidance-plus-inference
    confidence: medium
    evidence_keys:
    - B8B-T1210-REF-MS17-010
    - B8B-T1210-REF-MS-PETYA-SAMPLE
    - B8B-T1210-REF-CISA-RVA
  cases:
  - key: B8B-T1210-CASE-INV-EXPLOIT
    name:
      zh: InvisiMole 内网 SMB 会话到后继 loader 的传播链
      en: InvisiMole Internal SMB Session to Successor Loader Propagation
    event_type: field-malware-investigation
    actor_or_campaign: InvisiMole
    time_range: ESET 2020 report; exact intrusion interval not public
    observed_facts:
      zh: ESET 在目标网络多个主机发现通常随 EternalBlue 部署的 DoublePulsar，并从 Windows Security Logs 看到 SMB 会话建立后数秒 InvisiMole loader 执行；白皮书另分析了
        BlueKeep 插件的探测、利用和载荷三个部分。研究者明言未见 EternalBlue 利用代码，故该场景的精确触发细节仍是推断。
      en: ESET found DoublePulsar, commonly deployed through EternalBlue, on several hosts in a target network and saw in
        Windows Security Logs an SMB session followed seconds later by InvisiMole loader execution. It separately analyzed
        a BlueKeep plugin with discovery, exploit, and payload stages. Researchers explicitly did not see the EternalBlue
        exploit code, so the exact trigger details in that sequence remain inferred.
    cannot_claim:
      zh: 不能据服务来源 loader 或会话时序推断攻击者选择该漏洞是为规避登录审计，亦不能声称未产生登录事件或故障。
      en: Neither service-origin loader nor sequence timing proves the actor chose the vulnerability to evade logon audit,
        or that no logon event or fault occurred.
    evidence_keys:
    - B8B-T1210-REF-ESET-INV2020
    confidence: medium
  - key: B8B-T1210-CASE-CISA-RVA
    name:
      zh: CISA 医疗行业演练中 EternalBlue 取得另一服务器 SYSTEM shell
      en: CISA Healthcare Exercise EternalBlue to SYSTEM Shell on Another Server
    event_type: authorized-exercise
    actor_or_campaign: CISA risk and vulnerability assessment team
    time_range: 2023-12 report; exercise time not specified
    observed_facts:
      zh: CISA 发现未修补的服务器；报告称成功利用 EternalBlue，在该服务器建立本地 SYSTEM 权限 shell，并将步骤映射为 T1210。BlueKeep 在同一评估中未成功。
      en: CISA found an unpatched server, reports successful EternalBlue exploitation and a local SYSTEM shell on that server,
        and maps the step to T1210. BlueKeep did not succeed in the same assessment.
    cannot_claim:
      zh: 不能称其为真实恶意入侵，也不能声称演练绕开了登录审计、NDR 或 EDR。
      en: Do not call it a malicious incident or claim it evaded logon audit, NDR, or EDR.
    evidence_keys:
    - B8B-T1210-REF-CISA-RVA
    confidence: high
  - key: B8B-T1210-CASE-NOTPETYA
    name:
      zh: NotPetya 证据层级分明的多路径内网传播
      en: NotPetya Multi-Path Internal Propagation with Distinct Evidence Tiers
    event_type: field-malware-investigation
    actor_or_campaign: NotPetya
    time_range: 2017-06
    observed_facts:
      zh: Microsoft 观察凭据和管理工具远程执行，并分析到 SMBv1 漏洞包；网络分析称前述传播失败时再尝试 EternalBlue 或 EternalRomance。跨路径事实可作父行为共现证据，但未公布每一目标经漏洞成功控制的完整谱系。
      en: Microsoft observed credential and management-tool remote execution and analyzed SMBv1 exploit packets; its network
        account says EternalBlue or EternalRomance was tried when earlier spread steps failed. The multiple paths support
        parent co-occurrence but do not publish a complete exploit-to-controlled-outcome lineage for every target.
    cannot_claim:
      zh: 不能把 PsExec/WMIC 的成功执行与后备漏洞尝试合并成同一个已证明的 exploit 成功案例，也不能称其为低噪声利用。
      en: Do not merge successful PsExec or WMIC execution and fallback exploit attempts into one proven exploit-success case
        or call it low-noise exploitation.
