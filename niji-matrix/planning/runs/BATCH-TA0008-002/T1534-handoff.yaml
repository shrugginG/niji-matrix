handoff_schema_version: 2.0.0
type: technique-research-handoff
batch_ref: BATCH-TA0008-002
work_item_ref: WORK-TA0008-T1534
temporary_key_prefix: B8B-T1534
candidate:
  source_type: attack
  source_attack_id: T1534
  name:
    zh: 内部定向钓鱼
    en: Internal Spearphishing
recommendation:
  decision: adapt
  confidence: high
  rationale:
    paragraphs:
    - zh: 固定 ATT&CK Enterprise 19.1 将 T1534 列为横向移动父项，描述攻击者在已有受害账户或系统后借内部身份向其他用户实施定向诱导。Microsoft 2026 年调查和 Proofpoint 2026
        年现场案例均给出内部发件、收件者动作及后续其他账户失陷的链条，因此保留该行为核心；Niji 范围收窄到已有立足点向另一内部主体传播的匿迹路径，并把消息投递、收件者动作、第二主体失陷分别标注，故建议 adapt。
      en: The fixed ATT&CK Enterprise 19.1 baseline lists T1534 under Lateral Movement and describes targeted inducement of
        other users through an internal identity after an account or system is already compromised. Microsoft and Proofpoint's
        2026 investigations each document internal sending, recipient action, and subsequent compromise of another account.
        Preserve that behavioral core, but adapt the Niji scope to stealth in propagation from an existing foothold to another
        internal principal, recording message delivery, recipient action, and second-principal compromise as separate gates.
    - zh: 两个事件都直接支持真实内部发件身份改变收件者看到的来源特征，但不证明所有内部消息都具有匿迹意图，也不证明异常发送后必然横向成功。Proofpoint 案例进一步直接支持按活动主题设置邮箱规则，使告警或质疑回复从原用户收件箱消失；该行为具有可控的防守观察差异，但稳定变量与既有
        NJS-0111-001 重合，建议在本项只作父级共现机理。Microsoft 案例只证明攻击者利用近期会话选择收件人，不证明其向既有线程注入消息，不能据此复制 TA0001 的线程寄生子项。
      en: Both cases directly support a genuine internal sender identity changing the provenance features visible to recipients,
        but neither proves that every internal message has a stealth purpose or that anomalous sending inevitably succeeds.
        Proofpoint additionally documents a campaign-subject mailbox rule that hid warning or questioning replies from the
        legitimate sender's inbox, a controllable observation differential already covered by NJS-0111-001, recommended here
        only as a co-occurring parent mechanism. Microsoft's case shows selection of recipients from recent conversations,
        not injection into those threads; it cannot justify copying the Initial Access thread-parasitic child.
  original_attack_subtechniques_imported: false
proposed_content:
  summary:
    zh: 攻击者从既有受害内部身份发出定向诱导，借真实内部关系降低消息可疑性，并推动另一内部主体执行、认证或交出控制权。
    en: An adversary sends targeted inducement from an already compromised internal identity, using genuine internal relationships
      to lower message suspicion and prompt another internal principal to execute, authenticate, or surrender control.
  definition_and_concept:
    paragraphs:
    - zh: 内部定向钓鱼的起点是已经被攻击者控制的组织内账户、设备或协作会话。攻击者以该来源向另一组织内用户发送带行动要求的消息，诱导其打开恶意对象、访问认证页面或执行其他可使攻击者获得第二主体权限的动作。父行为以跨主体信任转移为直接对象，邮件、聊天和文档通知只是承载方式，消息发出本身仅证明尝试，收件者行为与新账户或主机的受控结果需另证。
      en: Internal spearphishing starts from an organizational account, device, or collaboration session already under adversary
        control. The actor uses that source to send another organizational user a request to open a malicious object, visit
        an authentication page, or take another action that can yield control of a second principal. The direct object is
        a trust transfer across principals. Email, chat, and document notifications are carriers; sending proves an attempt,
        while recipient action and control of a new account or host require separate evidence.
    - zh: 该技术的匿迹概念是把恶意行动要求放进组织已有身份与关系产生的正常通信表面，同时保留可能被跨平面重建的发送、内容、点击、认证和端点痕迹。Microsoft 事件证实内部点击者随后被认定账户失陷，Proofpoint 事件证实受控邮箱发送的附件被另一员工打开后第二账户失陷；这两个结果比单纯的活动宣传或外发统计更适合建立横向结果门。
      en: Its stealth concept places a malicious request inside the ordinary communication surface supplied by existing organizational
        identities and relationships, while sending, content, click, authentication, and endpoint traces remain reconstructable
        across planes. Microsoft identified compromised accounts among internal clickers, and Proofpoint documented a second
        account compromised after an employee opened an attachment from a controlled mailbox. These outcomes support a lateral
        result gate more strongly than campaign publicity or delivery counts alone.
  stealth_characteristics:
    paragraphs:
    - zh: 与来自组织外部的陌生发件者相比，真实受害内部账户可呈现正常组织地址、历史联系人和熟悉签名；攻击者改变的是消息来源与关系上下文，而不是使内容不可见。针对仅用外部来源、发件域信誉或单条消息内容判定的防守视角，恶意要求容易与普通协作混合。发送者异常登录、收件者点击、后续独立账号异常和消息对象仍形成残余痕迹。
      en: Compared with an unfamiliar external sender, a genuinely compromised internal account presents an organizational
        address, existing contacts, and sometimes a familiar signature. The adversary changes provenance and relationship
        context rather than making content invisible. A defender relying only on external-origin rules, domain reputation,
        or one message's content may blend the malicious request into ordinary collaboration. Sender sign-in anomalies, recipient
        clicks, subsequent anomalies on a separate account, and message objects remain as residual traces.
    - zh: 若攻击者还控制原发件邮箱的收件规则，可把与本次诱导主题相符的质疑、退信或警告移动、删除或标为已读，使原用户较晚发现被冒用。这一可共现变量改变的是反馈在原用户视角的位置，不等于抹除传输记录或收件者端证据；Proofpoint
        的同主题归档规则与 Microsoft 的删除并标已读规则提供独立事例，但后者没有给出规则条件与横向目标的一一对应。
      en: If the adversary also controls inbox rules on the sender mailbox, questioning replies, bounces, or warnings matching
        the campaign can be moved, deleted, or marked read, delaying the legitimate owner's awareness. This co-occurring variable
        changes where feedback appears to the owner; it does not erase transport or recipient-side evidence. Proofpoint's
        subject-matched archive rule and Microsoft's delete-and-mark-read rule are independent examples, although the latter
        does not establish a one-to-one rule condition for the lateral target.
  scope_boundary_definition:
    paragraphs:
    - zh: 纳入条件是先有同一组织内的既有受害来源，后有攻击者控制的定向消息到达另一内部主体，并存在可核查的诱导目的。将收件者打开、点击、认证、运行以及第二主体失陷分为不同证据层级；只凭“内部域名”或发送量不能断言攻击成功。合法同事共享文档、补丁通知、远程协助和批量内部通信必须由授权业务上下文排除。
      en: Inclusion requires an earlier compromised source inside the same organization, an adversary-controlled targeted
        message to another internal principal, and a reviewable inducement objective. Opening, clicking, authenticating, executing,
        and second-principal compromise are distinct evidence levels. An internal domain or high sending volume alone cannot
        prove success. Authorized colleague sharing, patch notices, support requests, and bulk internal communication require
        business-context exclusion.
    - zh: T1080 的直接对象是已经共享内容本身被污染、消费者随后读取或触发；本项的直接对象是被攻陷发件身份和主动消息触达。T1566/NJT-0057 截止于组织的首个入口；本项从既有立足点向第二主体延伸。仅交付文件而没有收件者被诱导属于
        T1570；取得第二账户后的令牌使用、远程服务连接或执行可与本项共现，但不能代替其消息和收件者证据。伪造组织显示名而无已受害内部来源时，不满足本项起点。
      en: T1080 directly concerns tainted shared content later read or triggered by a consumer; this subject directly concerns
        an abused sender identity and an actively delivered message. T1566/NJT-0057 ends at the first organizational foothold;
        this subject begins with that foothold and extends to a second principal. File arrival without induced recipient action
        belongs to T1570. Token use, remote-service access, or execution after second-account compromise may co-occur but
        do not replace message and recipient evidence. A spoofed organizational display name without an already compromised
        internal source fails this starting condition.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
      - zh: 攻击者进入一名员工邮箱后，读取近期往来并向内部联系人发送看似常规的文档共享请求；另一员工点击链接并完成被中间人操纵的认证，攻击者随后获得该员工账户。另一场景中，攻击者从会计人员邮箱向多名同事发送附件，并在原邮箱预置按该消息主题归档回复的规则；管理层助理打开附件后账户也被控制。场景中的真实内发件关系与第二主体结果分别由
          Microsoft 和 Proofpoint 事件支持，具体云服务或附件格式不定义技术边界。
        en: After entering an employee mailbox, an actor can inspect recent correspondence and send internal contacts a routine-looking
          document-sharing request; another employee clicks and completes an adversary-mediated authentication flow, after
          which the actor controls that employee's account. In a second setting, an actor sends an attachment from an accounting
          user's mailbox to colleagues while prepositioning a rule that archives replies matching the campaign subject; an
          executive assistant opens the attachment and also loses account control. Microsoft's and Proofpoint's incidents
          respectively support the real internal-sender relationship and second-principal outcomes; the cloud service and
          attachment format do not define this technique.
    threat_model:
      attacker_model:
        paragraphs:
        - zh: 攻击者至少能以受害内部身份发送消息，通常需要控制邮箱令牌、会话、终端邮件客户端或协作账户，并掌握目标、联系人或业务语境。若实施反馈压制，还须有修改该邮箱规则的权限及足以选择规则条件的活动计划。攻击者不能假定所有收件人都会行动，也不能仅凭被攻陷发送身份自动获得第二账户；认证防护、收件者复核与账号处置可中断链条。
          en: The actor must at least be able to send as a compromised internal identity, usually through a mailbox token,
            session, endpoint mail client, or collaboration account, and know the target, contacts, or business context. Feedback
            suppression additionally requires permission to modify that mailbox's rules and a campaign plan specific enough
            to select rule conditions. The actor cannot assume every recipient will act or that control of a sending identity
            automatically grants a second account; authentication controls, recipient verification, and account containment
            can break the chain.
      defender_model:
        paragraphs:
        - zh: 收件者通常只见内部联系人和消息表面；原发件账户所有人可能因规则压制而看不到质疑回复。邮件或协作平台可见发送与交付记录，身份系统可见原发件者与收件者的登录变化，浏览器、Safe Links 或端点可见点击、附件打开与后继行为。防守方需要按消息
            ID、账户对象 ID、收件者与时间连接这些视角；若缺少平台审计、点击遥测或身份关联，只能判定较低层级的尝试，不能确认第二主体失陷。
          en: Recipients commonly see only the internal contact and message surface; the legitimate sender owner may miss
            questioning replies when rules suppress them. A mail or collaboration platform can record sending and delivery,
            the identity plane can record sign-in changes for sender and recipient, and browser, Safe Links, or endpoint telemetry
            can record clicks, attachment opening, and subsequent behavior. The defender must join these views by message
            ID, account object ID, recipient, and time. Without platform audit, click telemetry, or identity correlation,
            the finding remains an attempt-level conclusion and cannot confirm compromise of the second principal.
  stealth_mechanisms:
  - mechanism_ref: NM-FD
    role: primary
    summary:
      zh: 真实内部发件身份与既有关系掩盖异常诱导来源
      en: Genuine internal sender identity and existing relationships mask the anomalous request source
    analysis:
      paragraphs:
      - zh: 攻击者利用已被控制的真实组织账户向其内部联系人发送诱导，消息因此带有与业务通信一致的发件身份和关系特征。外部来源或仿冒域筛查会失去区分力，收件者也可能凭熟悉身份信任行动要求；跨邮箱审计、异常登录和第二主体后继行为仍可揭示来源与结果不匹配。两个独立现场报告都记录了此因果链，但具体欺骗成功率未公开。
        en: By sending inducement from a genuinely controlled organizational account to its internal contacts, the actor gives
          the message sender and relationship features consistent with business communication. External-origin or lookalike-domain
          filters lose discrimination, and recipients may trust the request because of the familiar identity. Cross-mailbox
          audit, anomalous sign-in, and subsequent behavior by the second principal can still expose a provenance-to-outcome
          mismatch. Two independent incident reports document this chain, but neither publishes a general deception success
          rate.
    evidence_keys:
    - B8B-T1534-REF-ATTACK
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    confidence: high
  - mechanism_ref: NM-BT
    role: secondary
    summary:
      zh: 活动相关回复从原发件者收件箱移走而削弱本地告警
      en: Campaign replies are removed from the original sender inbox weakening local warning
    analysis:
      paragraphs:
      - zh: 攻击者在受控发件邮箱为诱导主题设置移动或删除规则，使同事的质疑和安全提醒虽被服务器接收，却不再出现在原用户通常查看的收件箱。原用户或只盯收件箱状态的防守方看到的反馈被压低；邮件传输与规则变更审计仍保留可恢复的差分。Proofpoint
          直接把主题规则、45 名内部收件者和第二账户失陷连接起来，Microsoft 则独立报告了删除并标已读规则及后续内部钓鱼。
        en: The actor installs a move or delete rule for the campaign subject in the controlled sender mailbox. Colleagues'
          questions and security warnings may reach the service but no longer appear in the inbox normally checked by the
          owner. The owner's or an inbox-only defender's feedback is reduced, while transport and rule-change audits retain
          a recoverable difference. Proofpoint directly connects a subject rule, 45 internal recipients, and compromise of
          a second account; Microsoft independently reports a delete-and-mark-read rule followed by internal phishing.
    evidence_keys:
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-MS-RULE-AUDIT
    confidence: medium
  subtechnique_taxonomy:
    narrative:
      paragraphs:
      - zh: 固定基线没有 ATT&CK 子项，但研究仍检查真实内部发件身份、活动回复路由、既有线程利用、协作包装和媒介。真实内部身份是父级行为的必要条件；按活动主题隐藏回复的观察差异已由 NJS-0111-001 默认视图枚举遗漏覆盖；近期线程选人并不等于向既有线程注入；平台和附件格式不形成稳定匿迹变量。因此本项目前建议无独立
          Niji 子技术，后续须以新的可控变量、痕迹变化、观察差异和独立防御证据重开分类。
        en: Although the fixed baseline has no ATT&CK children, the research tested genuine internal sender identity, campaign-reply
          routing, existing-thread use, collaboration wrappers, and media. A genuine internal identity is necessary parent
          behavior. Hiding replies by campaign subject is already covered by NJS-0111-001 Default-View Enumeration Omission.
          Selecting recipients from recent threads does not prove injection into an existing thread, and platform or attachment
          format is not a stable stealth variable. Recommend no independent Niji child at present; reopen taxonomy only with
          evidence of a new controllable variable, trace change, observation difference, and independent defense.
    coverage: deferred
    subtechnique_refs: []
proposed_subtechniques: []
defense_candidates:
  detection_strategies:
  - key: B8B-T1534-DET-CROSS-PRINCIPAL
    name:
      zh: 内部诱导跨主体传播与反馈关联
      en: Internal Lure Cross-Principal Propagation and Feedback Correlation
    objective:
      zh: 识别已受害内部来源发出的消息到收件者动作及第二主体失陷的跨主体链，并区分发送、行动、受控三个结果级别。
      en: Identify the cross-principal chain from a message sent by an already compromised internal source through recipient
        action to second-principal compromise, separating sent, acted, and controlled outcome levels.
    detects_temporary_keys:
    - B8B-T1534-PARENT
    analytic_keys:
    - B8B-T1534-NJA-SEND-OUTCOME
    evidence_keys:
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-MS-EMAILEVENTS
    - B8B-T1534-REF-MS-URLCLICKS
    - B8B-T1534-REF-MS-RULE-AUDIT
  detection_analytics:
  - key: B8B-T1534-NJA-SEND-OUTCOME
    name:
      zh: 内部消息到第二账户结果谱系
      en: Internal Message to Second-Account Outcome Lineage
    logic:
      zh: 以 EmailEvents 中 EmailDirection=Intra-org、SenderObjectId、RecipientObjectId 和 NetworkMessageId 建立已确认受害发件者到另一内部账户的有向边。将边连接发件前的账户入侵证据，并按
        NetworkMessageId 连接 UrlClickEvents；附件分支仅在邮件附件摘要能可靠连接收件端文件或进程时启用。最后在 24 小时默认窗口内按收件者对象 ID 连接后续异常登录和调查确认的会话接管，输出 sent、acted、second_principal_compromised
        三个分级状态；单一内部邮件、点击或风险分数不自动证明横向成功。
      en: Build a directed edge from a confirmed compromised sender to another internal account using EmailDirection=Intra-org,
        SenderObjectId, RecipientObjectId, and NetworkMessageId in EmailEvents. Join the edge to sender compromise evidence
        before sending and to UrlClickEvents by NetworkMessageId; enable an attachment branch only where its digest reliably
        joins recipient endpoint file or process events. Within a default 24-hour window, join by recipient object ID to later
        abnormal sign-in and investigator-confirmed session takeover. Emit distinct sent, acted, and second_principal_compromised
        states; one internal email, click, or risk score does not automatically establish lateral success.
    data_requirements:
    - source_type: m365-email-processing
      channel: Microsoft Defender XDR/EmailEvents
      required_fields:
      - Timestamp
      - NetworkMessageId
      - SenderObjectId
      - RecipientObjectId
      - SenderFromAddress
      - RecipientEmailAddress
      - EmailDirection
      - Subject
    - source_type: m365-url-click
      channel: Microsoft Defender XDR/UrlClickEvents
      required_fields:
      - Timestamp
      - NetworkMessageId
      - AccountUpn
      - Url
      - ActionType
      - Workload
    - source_type: identity-and-investigation
      channel: Entra sign-in logs and incident record
      required_fields:
      - timestamp
      - account_object_id
      - source_ip
      - device_id
      - session_id
      - compromise_verdict
    - source_type: optional-attachment-endpoint-join
      channel: EmailAttachmentInfo and endpoint telemetry
      required_fields:
      - NetworkMessageId
      - SHA1
      - recipient_device_id
      - file_or_process_event_time
    observables:
    - zh: 已确认受害的内部账户在异常会话后向另一员工发送带行动要求的消息。
      en: A confirmed compromised internal account sends an action-bearing message to another employee after an anomalous
        session.
    - zh: 同一消息的收件者点击或可靠关联的附件打开先于其新异常认证或账户接管。
      en: The recipient click or reliably linked attachment open precedes new abnormal authentication or account takeover.
    correlation_window: 24h_default_extend_for_delayed_action
    dimensions:
    - SenderObjectId
    - RecipientObjectId
    - NetworkMessageId
    - message_subject
    - clicked_url
    - attachment_hash
    - recipient_device_id
    - session_id
    - time
    false_positives:
    - authorized_internal_share
    - helpdesk_campaign
    - approved_security_simulation
    - preexisting_recipient_compromise_unrelated_to_message
    blind_spots:
    - Defender_for_Office_365_missing
    - collaboration_messages_outside_mail_unlogged
    - Safe_Links_absent
    - attachment_hash_missing
    - identity_compromise_unconfirmed
    tuning:
      zh: 按发件者和收件者的既有关系、获批培训与真实共享项目建立基线，并核实来源受害、消息、动作和第二账户异常的顺序。仅内部域名、宏附件或单次异常 IP 不足以封锁；高风险目标可缩短处置窗口，但调查须保留延迟动作可能。
      en: Baseline sender-recipient relationships, approved simulations, and genuine sharing projects, and verify the ordering
        of compromised source, message, action, and second-account anomaly. An internal domain, macro attachment, or one unusual
        IP alone is insufficient for blocking. High-risk recipients may use a shorter response window while investigations
        retain delayed-action possibilities.
    evidence_keys:
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-MS-EMAILEVENTS
    - B8B-T1534-REF-MS-URLCLICKS
    - B8B-T1534-REF-MS-ATTACHMENTINFO
  mitigations:
  - key: B8B-T1534-MIT-INTERNAL-COMM
    name:
      zh: 内部诱导消息检查与收件者动作核验
      en: Internal Lure Inspection and Recipient Action Verification
    measures:
    - key: inspect-internal-messages
      control_type: preventive
      zh: 对组织内部消息维持链接和附件检查并保留发送与收件者关联键
      en: Inspect links and attachments in internal messages and retain sender-recipient correlation keys
    - key: independent-request-verification
      control_type: cost-increasing
      zh: 对内部消息要求的认证或运行经独立渠道核验真实发件者
      en: Independently verify the genuine sender of authentication or execution requests in internal messages
    parent_application:
      use:
        zh: 对 T1534 链条隔离已确认的受害发件会话，检索其已送达的内部诱导、后续点击和第二账户认证；对内部消息保持与外部消息同等的内容审查，并要求收件者经独立渠道核验异常操作请求。
        en: For T1534, contain the confirmed compromised sender session, search its delivered internal lures, later clicks,
          and second-account authentications, inspect internal content as well as external content, and have recipients verify
          unusual action requests through an independent channel.
      expected_effect:
        zh: 降低真实内发件身份自动获得放行的机会，并更早把第二主体动作和结果纳入同一调查图。
        en: Reduce automatic trust granted to a genuine internal sender and bring second-principal action and outcome into
          one investigation graph earlier.
      limitations:
        zh: 真实账号可经常用设备和合法平台发送；平台日志缺失或收件者已行动时预防效果下降，群发撤回及隔离须按已确认受害身份与具体消息限定。
        en: A genuine account can send from familiar devices and legitimate platforms. Missing platform audit or recipient
          action already taken reduces prevention, and recall or containment must be scoped to confirmed compromised identities
          and specific messages.
    evidence_keys:
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-MS-RULE-AUDIT
    reuse_split_note:
      zh: 该新 MIT 仅承担内部消息检查及独立核验；会话撤销、规则治理和不可变审计由既有 MIT-000036 扩展具体应用。
      en: This new MIT covers internal-message inspection and independent verification only; extend existing MIT-000036 for
        session revocation, rule governance, and immutable audit.
  existing_mitigation_extension:
    id: MIT-000036
    parent_application:
      use:
        zh: 对已受害内部发件账户实施会话撤销、委派核查和不可变发信审计，并用消息 ID 跟踪到受影响的内部收件者。
        en: Revoke sessions, inspect delegation, and retain immutable send audit for the compromised internal sender, then
          track affected internal recipients by message ID.
      expected_effect:
        zh: 缩短可信内发件身份继续传播的窗口，并保留第二主体结果的关联起点。
        en: Shorten continued propagation through the trusted internal sender and retain the correlation anchor for second-principal
          outcomes.
      limitations:
        zh: 既有规则和会话可能已被使用；单独保护发件账户不能证明或逆转第二主体失陷。
        en: Existing rules and sessions may already have been used; sender-account protection alone neither proves nor reverses
          a second-principal compromise.
existing_library_reuse:
  reference_refs:
  - REF-000090
  - REF-000068
  claim_refs: []
  case_refs: []
  strategy_refs: []
  analytic_refs: []
  mitigation_refs:
  - MIT-000036
  relationship_refs: []
  notes:
    zh: REF-000090 仅支持 T1566 初始入口边界；REF-000068 仅支持受控真实邮箱和历史关系可被滥用的相邻现象，原事件跨供应商关系，不满足本项同组织第二主体结果。DET-000055/NJA-000029/MIT-000054
      锚定首个入口，不能只加 T1534 名称复用；NJT-0112 可与回复删除共现，却不自动覆盖与内部诱导紧密耦合的发件者反馈路由。 MIT-000036 已有会话风险、邮箱规则治理与不可变审计措施，应扩展对 T1534 及候选子项的目标化
      Application，不重复新建这些措施。
    en: REF-000090 supports only the T1566 first-entry boundary; REF-000068 supports adjacent abuse of real mailboxes and
      relationships but its cross-supplier incident does not establish same-organization second-principal outcome. DET-000055/NJA-000029/MIT-000054
      are anchored to first entry and cannot be reused merely by adding T1534's name. NJT-0112 can co-occur with reply deletion
      but does not automatically cover sender-feedback routing tightly coupled to an internal lure. MIT-000036 already has
      session-risk, mailbox-rule governance, and immutable-audit measures; extend it with T1534-specific applications rather
      than creating duplicate measures.
library_candidates:
  references:
  - key: B8B-T1534-REF-ATTACK
    url: https://attack.mitre.org/versions/v19/techniques/T1534/
    role: fixed_version_parent_anchor
    note: Enterprise 19.1 baseline anchored by local STIX inventory; T1534 has zero ATT&CK children. The live unversioned
      page changes over time and is not the batch authority.
  - key: B8B-T1534-REF-MS-2026
    url: https://www.microsoft.com/en-us/security/blog/2026/01/21/multistage-aitm-phishing-bec-campaign-abusing-sharepoint/
    role: first_party_incident
    note: Microsoft directly observed compromised internal identities send more than 600 messages to internal and external
      contacts, internal clickers with subsequent compromised accounts, and an inbox rule deleting and marking incoming mail
      read. Recent threads selected recipients; no actual thread injection established.
  - key: B8B-T1534-REF-PROOFPOINT-2026
    url: https://www.proofpoint.com/us/blog/threat-insight/mailbox-rules-o365-post-exploitation-tactic-cloud-ato
    role: first_party_incident
    note: Proofpoint describes attacker-created subject-matched archive rule before 45 same-organization phishing emails from
      a compromised mailbox; an executive assistant opened the attachment and their account was compromised. The article does
      not publish raw message-by-message routing records.
  - key: B8B-T1534-REF-ESET-GAMAREDON
    url: https://www.welivesecurity.com/2020/06/11/gamaredon-group-grows-its-game/
    role: first_party_behavior_case_shared_with_T1080
    note: ESET directly analyzed compromised Outlook identity sending malicious messages to same-organization employees. The
      same article separately documents shared-document macro and template injection for T1080. It explicitly says Gamaredon
      appears to make little effort to stay under the radar, so do not use it to prove stealth intent or a second-recipient
      success outcome.
  - key: B8B-T1534-REF-MS-EMAILEVENTS
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-emailevents-table
    role: telemetry_semantics
    note: EmailEvents exposes NetworkMessageId, sender and recipient account object IDs, EmailDirection, subject, and other
      mail facts, subject to Defender for Office 365 deployment.
  - key: B8B-T1534-REF-MS-URLCLICKS
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-urlclickevents-table
    role: telemetry_semantics
    note: UrlClickEvents exposes AccountUpn, NetworkMessageId, clicked URL, workload, and action; coverage depends on Defender
      for Office 365 and Safe Links.
  - key: B8B-T1534-REF-MS-ATTACHMENTINFO
    url: https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-emailattachmentinfo-table
    role: telemetry_semantics
    note: Attachment metadata can be joined by NetworkMessageId, but hashes may be absent and endpoint opening must be established
      separately.
  - key: B8B-T1534-REF-MS-RULE-AUDIT
    url: https://learn.microsoft.com/en-us/purview/audit-log-identify-mailbox-rules
    role: telemetry_semantics
    note: Purview audit can search New-InboxRule and Set-InboxRule; current Get-InboxRule configuration shows move/delete
      conditions. Rule change is not proof that a given reply matched or moved.
  claims:
  - key: B8B-T1534-CLM-PARENT
    statement_zh: 已受害内部邮箱可被用于向另一组织内员工发送诱导；在两个独立调查中，收件者动作后出现另一账户失陷。
    statement_en: An already compromised internal mailbox can send inducement to another organizational employee; in two independent
      investigations, recipient action preceded compromise of another account.
    evidence_keys:
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    confidence: high
  - key: B8B-T1534-CLM-TRUST
    statement_zh: 真实内部发件身份与熟悉关系会降低依赖外部来源或仿冒域的单点筛查区分力，但效果受收件者复核和跨平面关联限制。
    statement_en: A genuine internal sender and familiar relationship reduce the discrimination of point checks for external
      origin or lookalike domains, subject to recipient verification and cross-plane correlation.
    evidence_keys:
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    confidence: medium
    evidence_mode: case_supported_causal_inference
  - key: B8B-T1534-CLM-FEEDBACK
    statement_zh: 按活动主题归档内部诱导回复的规则改变原发件人可见的警示反馈，而服务器的规则与收件痕迹仍可作为独立核验来源。
    statement_en: A rule archiving replies by internal-lure subject changes warning feedback visible to the original sender,
      while server-side rule and receipt traces remain independent verification sources.
    evidence_keys:
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-MS-RULE-AUDIT
    confidence: medium
    evidence_mode: observed_rule_plus_telemetry_semantics
  - key: B8B-T1534-CLM-GAMAREDON-LIMIT
    statement_zh: ESET 的 Gamaredon 调查证明受害内部邮箱可向同事发恶意消息，却明确指出该组织看似不重视低调，因此该事件不能单独支撑匿迹目的或第二账户失陷。
    statement_en: ESET's Gamaredon investigation proves a compromised internal mailbox can send malicious messages to colleagues
      but explicitly describes the group as apparently making little effort to stay under the radar, so the incident alone
      cannot support stealth intent or second-account compromise.
    evidence_keys:
    - B8B-T1534-REF-ESET-GAMAREDON
    confidence: high
  cases:
  - key: B8B-T1534-CASE-MS-ENERGY
    event: Microsoft_2026_energy_sector_AiTM_internal_sender_to_internal_accounts
    evidence_keys:
    - B8B-T1534-REF-MS-2026
    boundary: Internal messages, clicks, and later compromised accounts are observed; recipients were chosen from recent threads,
      but actual injection into those threads was not reported. The rule was broad, not shown as campaign-subject selective.
  - key: B8B-T1534-CASE-PROOFPOINT-PAYROLL
    event: Proofpoint_2026_accounting_mailbox_to_45_internal_users_and_assistant_compromise
    evidence_keys:
    - B8B-T1534-REF-PROOFPOINT-2026
    boundary: Directly supports attacker-created subject-specific reply archiving, 45 internal recipients, attachment opened,
      and second-account compromise; raw rule-hit count and exact recipient execution chain are not published.
  - key: B8B-T1534-CASE-GAMAREDON-OUTLOOK
    event: ESET_Gamaredon_compromised_Outlook_sends_malicious_internal_mail
    evidence_keys:
    - B8B-T1534-REF-ESET-GAMAREDON
    boundary: Supports internal sender behavior only. Shared-document tainting belongs to T1080 as a separate action. ESET
      cautions the group appeared to prioritize rapid spread over stealth.
  detection_strategies:
  - B8B-T1534-DET-CROSS-PRINCIPAL
  detection_analytics:
  - B8B-T1534-NJA-SEND-OUTCOME
  mitigations:
  - B8B-T1534-MIT-INTERNAL-COMM
  relationships:
  - key: B8B-T1534-REL-FEEDBACK-OVERLAP
    suggestion: Relate T1534 parent to NJS-0111-001 for confirmed campaign-linked reply hiding, without copying the child
      under T1534.
research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 0
    attack_subtechnique_ids: []
    represented_dimensions: []
    breadth_trigger: ordinary
    coverage_resolutions: []
    candidate_stealth_axes_examined:
    - key: B8B-T1534-AXIS-INTERNAL-SENDER
      disposition: parent-core
      zh: 真实内部发件身份及关系信任是 T1534 基本因果前提，不能只改名形成子项。
      en: A genuine internal sender and relationship trust are the basic T1534 causal premise and cannot become a child by
        renaming.
    - key: B8B-T1534-AXIS-FEEDBACK-ROUTE
      disposition: adjacent-technique
      zh: Proofpoint 的按主题回复归档确有稳定观察差异，但该变量已由 NJS-0111-001 默认视图枚举遗漏覆盖；在 T1534 中作为可共现机理和跨技术关系，不再按横向场景新建 NJS。
      en: Proofpoint subject-matched reply archiving has a stable observation differential, but NJS-0111-001 Default-View
        Enumeration Omission already covers that variable. Treat it as a co-occurring mechanism and cross-technique relation
        in T1534 rather than creating a new NJS by lateral context.
    - key: B8B-T1534-AXIS-THREAD-CONTEXT
      disposition: evidence-deferred
      zh: Microsoft 报告仅证实利用近期线程选择收件者；Proofpoint 的线程劫持例子涉及外部供应商财务欺诈，没有同组织横向结果。暂不创建线程寄生子项。
      en: Microsoft confirms selecting recipients using recent threads only. Proofpoint's thread-hijacking example concerns
        cross-organization vendor fraud without a same-organization lateral outcome. Defer a thread-parasitic child.
    - key: B8B-T1534-AXIS-COLLAB-WORKFLOW
      disposition: parent-core
      zh: SharePoint 分享外观可能增强可信度，但该案的内部来源与第二主体失陷链不证明平台包装本身产生独立于发件身份的观察差异。
      en: A SharePoint sharing wrapper may strengthen credibility, but the internal-source-to-second-account chain does not
        isolate a defender-observation effect independent of sender identity.
    - key: B8B-T1534-AXIS-MEDIUM-OR-ATTACHMENT
      disposition: not-stealth-distinct
      zh: 邮件、聊天、链接、附件和产品名称是载体；不能据此划分 NJS。
      en: Email, chat, links, attachments, and product names are carriers, not NJS partitions.
    - key: B8B-T1534-AXIS-BROAD-MAILBOX-RULE
      disposition: adjacent-technique
      zh: 与内部诱导无条件匹配关系的广泛邮箱隐藏或事后删除可归 NJT-0112 或一般邮箱持久化；只有活动相关反馈路径才构成本项子变量。
      en: Broad mailbox hiding or after-the-fact deletion without a condition linked to the internal lure belongs under NJT-0112
        or general mailbox persistence; only campaign-linked feedback routing qualifies as this child variable.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 0
    breadth_gap_explained: true
    reviewer_notes:
      zh: 0 个 ATT&CK 子项不解除原生变量搜索义务；已测试发件身份、反馈路由、线程、协作包装与媒介。发件身份属于父级核心，反馈路由与 NJS-0111-001 稳定变量重复，线程和包装缺少独立结果级证据，因此建议正式 NJS
        为 0；以后仅在证明新的观察变量和防御目标后重开。
      en: Zero ATT&CK children do not waive native-axis inquiry. Sender identity, feedback routing, thread context, collaboration
        wrapper, and medium were tested. Sender identity is parent core; feedback routing duplicates the stable variable of
        NJS-0111-001; thread and wrapper lack independent outcome-level evidence. Recommend zero formal NJS, reopening only
        on proof of a new observation variable and defensive objective.
  evidence_coverage:
    parent_behavior_keys:
    - B8B-T1534-REF-ATTACK
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-ESET-GAMAREDON
    boundary_keys:
    - B8B-T1534-REF-ATTACK
    - REF-000090
    - B8B-T1534-REF-ESET-GAMAREDON
    mechanism_support:
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-PROOFPOINT-2026
    child_existence_support: []
    unsupported_or_deferred:
    - actual_internal_thread_injection
    - Teams_specific_lateral_outcome
    - universal_internal_sender_stealth_intent
    - full_message_by_message_rule_hits
    - Gamaredon_second_account_compromise
    - new_native_child_distinct_from_NJS-0111-001
  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级完整覆盖定义、痕迹、边界、场景、双向威胁模型、机理与限制。研究中完整保存反馈压制候选的双语字段，但因与 NJS-0111-001 重复不建议正式写入；正式父项应保留消息、动作、第二账户结果三个证据级别。
      en: The parent covers definition, trace, boundary, scenario, both threat models, mechanism, and limitations. The full
        bilingual feedback-suppression candidate remains in research, but formal authoring is not recommended because it duplicates
        NJS-0111-001. The canonical parent should preserve distinct message, action, and second-account outcome gates.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - repository_search
    - shared_library_lookup
    - yaml_parse
  limitations:
    paragraphs:
    - zh: 公开事件提供两个独立的内部来源到第二主体失陷链，但未公开所有原始邮件、点击、认证和规则命中记录。Microsoft 的近期线程仅用于选择收件者，Proofpoint 的其他线程劫持例子属于跨组织供应商欺诈；不能据此声称本项已证实既有内部线程寄生。ESET
        的 Gamaredon 证据只支持发送行为，并有明确的低调意图反证。
      en: Public incidents give two independent internal-source-to-second-principal compromise chains but do not release complete
        raw mail, click, authentication, or rule-hit records. Microsoft's recent threads selected recipients only, and Proofpoint's
        other thread-hijacking example concerns cross-organization vendor fraud; neither establishes parasitic delivery into
        an existing internal thread here. ESET's Gamaredon evidence supports sending behavior only and expressly cautions
        against inferring a stealth focus.
    - zh: 建议的邮件分析依赖 Defender for Office 365、Safe Links、身份和邮箱审计；未采集这些数据时可用其他平台等价字段实现，但不能声称当前规则覆盖未审计的端到端加密聊天。收件者行动与新账户异常需要调查确认因果，邮件到达、规则存在或同一时间窗口的登录异常都不是独立的成功证明。
      en: The proposed mail analytics depend on Defender for Office 365, Safe Links, identity, and mailbox audit. Equivalent
        fields on other platforms can implement the logic, but the current rule cannot claim coverage of unaudited end-to-end
        encrypted chat. Recipient action and a new-account anomaly need investigative causal confirmation; delivery, rule
        existence, or a sign-in anomaly in the same time window is not independent proof of success.
  rejected_mechanisms:
  - mechanism_ref: NM-ST
    reason_zh: 近期线程用于挑选收件者而未证实真实线程注入或跨时间稀释，不足以独立支持时空释痕。
    reason_en: Recent threads selected recipients but did not establish real thread injection or temporal dilution
    so NM-ST lacks independent support.: null
  open_questions:
  - zh: 是否有内部聊天平台的第一手审计案例同时确认受害发件身份、另一员工动作和第二主体受控结果？
    en: Is there a first-party collaboration-chat audit case confirming a compromised sender identity, another employee's
      action, and a controlled second principal?
  - zh: 若将来提出 T1534 原生子项，能否找到与 NJS-0111-001 不同的受控观察变量及独立防御，而不只是同一邮箱规则在横向场景中的再次命名？
    en: If a future T1534 native child is proposed, can it establish a controlled observation variable and independent defense
      distinct from NJS-0111-001 rather than renaming the same mailbox rule in a lateral scenario?
  cross_technique_duplicate_review:
  - object: NJT-0111
    resolution: related_not_automatic_duplicate
    zh: 既有工件可见性重塑已明确包括邮件不在默认视图而仍可消费；本候选只在规则与 T1534 活动主题、内部收件者和后续结果形成直接链时才可能建独立子项。
    en: Existing Artifact Visibility Reshaping expressly includes mail absent from a default view while still usable. This
      candidate warrants an independent child only if a rule is directly tied to the T1534 campaign subject, internal recipients,
      and later outcome.
  - object: NJS-0111-001
    resolution: reuse_cross_technique_no_new_child
    zh: 该既有原生子项明确包含邮件规则使消息从默认视图遗漏而底层仍存在，与 Proofpoint 归档规则的可控变量、痕迹变化和全视图防御完全一致。
    en: This existing native child expressly covers mail rules omitting a message from the default view while the underlying
      item persists; its controlled variable, trace change, and full-view defense match the Proofpoint archive rule.
  - object: NJT-0112
    resolution: adjacent
    zh: 邮件真正删除或事后清理可并行归选择性痕迹收敛；未来回复被预先路由到归档而仍留在服务器时，直接观察差异更接近 NJT-0111。
    en: Actual deletion or post-operation cleanup can also map to Selective Trace Contraction. Pre-routing future replies
      to an archive while retaining them server-side is closer to NJT-0111.
  - object: NJS-0036-004
    resolution: related_other_tactic
    zh: 既有子项的结果门是信息请求被隐藏；本候选的结果门是内部第二主体可能失陷。底层邮箱隐藏变量相同，故主 Agent 必须决定是否以横向结果及定向反馈防御形成足够独立性。
    en: The existing child hides information-elicitation requests; this candidate has a possible second internal principal
      compromise outcome. The underlying mailbox-hiding variable is shared, so the primary agent must decide whether the lateral
      result and campaign-specific feedback defense are sufficiently distinct.
  - object: MIT-000036
    resolution: extend
    zh: 复用既有账户会话、规则与不可变审计措施，只追加 T1534 目标化应用。
    en: Reuse existing account-session, rule, and immutable-audit measures with T1534-specific applications.
  deferred_subtechnique_candidate:
    key: B8B-T1534-NJS-FEEDBACK
    name:
      zh: 内部诱导反馈压制
      en: Internal Lure Feedback Suppression
    decision: deferred_existing_native_taxonomy
    confidence: medium
    stable_variable:
      zh: 攻击者是否主动操纵原发件账户的收件规则，使本次内部诱导产生的告警、质疑或退信不进入原用户的正常收件视野。
      en: Whether the actor deliberately manipulates rules on the original sender account so warnings, questions, or bounces
        generated by this internal lure do not enter the legitimate owner's ordinary inbox view.
    trace_change:
      zh: 回复仍有传输或邮箱审计痕迹，但匹配活动的消息被移到其他文件夹、删除或标为已读；规则新增事件先于或伴随异常内部发送。
      en: Replies still leave transport or mailbox audit records, but campaign-matching messages are moved, deleted, or marked
        read; a rule-change event precedes or accompanies abnormal internal sending.
    defender_observation_difference:
      zh: 原用户与只检查收件箱的调查者少见早期质疑信号；把服务器收件、规则动作与原用户可见文件夹比对即可发现差分。
      en: The owner and an investigator checking only the inbox see fewer early questions; a comparison of server receipt,
        rule actions, and owner-visible folders exposes the differential.
    prerequisites:
      zh: 攻击者控制可修改规则的内部发件邮箱，并能预期本次诱导的主题、发件对象或回复特征；仅普通自动归档规则不满足恶意控制要求。
      en: The adversary controls an internal sending mailbox with rule-modification rights and can anticipate the lure's subject,
        recipients, or reply characteristics. An ordinary auto-filing rule does not establish malicious control.
    application_scenario:
      zh: 'Proofpoint 案例中，攻击者先为“FW: Payment Receipt”设置归档规则，再从该邮箱向 45 名内部员工发送同主题诱导；一名员工打开附件后其账户失陷。'
      en: 'In Proofpoint''s incident, the actor first archived messages matching “FW: Payment Receipt,” then sent a lure with
        that subject from the mailbox to 45 internal employees; one employee opened the attachment and lost account control.'
    sibling_boundary:
      zh: 父级真实内部发件身份是所有本项实例的基础；本子项另要求主动抑制回流警告。它不按邮箱产品、邮件媒介、附件类型或规则动作名称拆分，也不覆盖只为金融欺诈而隐藏供应商通信且未发生内部横向诱导的事件。
      en: A genuine compromised internal sender is part of the parent core; this child additionally requires deliberate suppression
        of returning warnings. It is not divided by mailbox product, mail medium, attachment type, or rule action, and does
        not cover hiding vendor correspondence solely for financial fraud without an internal lateral lure.
    proposed_content:
      summary:
        zh: 操纵受控发件账户的回复路径，使内部诱导后的质疑和警报远离原用户正常收件视野。
        en: Manipulate reply routing on a controlled sender account so questions and alerts after an internal lure leave the
          legitimate owner's ordinary inbox view.
      definition_and_concept:
        paragraphs:
        - zh: 内部诱导反馈压制是在攻击者控制一名内部发件者之后，为其即将发送或正在发送的横向诱导设置邮箱规则或等价反馈路由，使同事的质疑、退信或告警不按正常方式呈现给原账户所有人。它是内部定向钓鱼中的可控附加变量，以发件侧反馈可见性为直接对象；第二名员工的点击或失陷仍须独立证实。
          en: Internal Lure Feedback Suppression occurs when an adversary controlling an internal sender installs a mailbox
            rule or equivalent feedback route for a lateral lure being sent or planned, so colleagues's questions, bounces,
            or warnings are not shown normally to the original account owner. It is an additional controlled variable within
            internal spearphishing, directly changing sender-side feedback visibility; a second employee's click or compromise
            still requires separate proof.
      stealth_characteristics:
        paragraphs:
        - zh: 发给同事的恶意消息并未消失，变化发生在回复回到受害发件邮箱之后。按活动主题匹配的规则使回复自动进入归档、删除或已读状态，因而原用户较难从日常收件箱发现身份被滥用；规则配置、服务器传输记录和收件者设备仍保留异常。无条件屏蔽所有邮件虽也可隐藏反馈，但可能明显破坏正常业务，不能与选择性压制的低可见性效果等同。
          en: The malicious message sent to colleagues does not disappear; the change occurs after feedback returns to the
            compromised sender mailbox. A campaign-matching rule routes replies into archive, deletion, or read state, making
            ordinary inbox review less likely to reveal misuse to the owner. Rule configuration, server transport, and recipient
            devices retain anomalies. An unconditional rule that hides all mail can also suppress feedback but may visibly
            disrupt normal business and should not be assigned the same low-visibility effect as selective suppression.
      scope_boundary_definition:
        paragraphs:
        - zh: 纳入必须有原发件内部身份失陷、规则条件与横向诱导可关联、以及至少内部消息发送的证据。普通用户的合法归档、单纯隐匿财务欺诈对话、没有内部诱导的邮箱持久化，或只在收件者侧过滤消息，均不属于此子项。它与父级身份借用的区别是可观察的服务器收件与原用户收件视野差分，且不要求特定规则动作或软件产品。
          en: Inclusion requires a compromised internal sender, a rule condition linkable to the lateral lure, and evidence
            of at least internal sending. Legitimate user filing, concealment of financial-fraud correspondence alone, mailbox
            persistence without an internal lure, and recipient-side filtering alone fall outside this child. It differs from
            parent-level identity borrowing in the observable gap between server receipt and the original owner's inbox view,
            independent of a particular rule action or product.
      application_scenarios_and_threat_model:
        application_scenarios:
          paragraphs:
          - zh: 当攻击者需要从既有受害邮箱向业务联系人发送看似可信的附件或链接时，可以先设置与该活动主题相符的规则，使质疑回复不进入正常收件箱。Proofpoint 观察到该顺序、45 名内部收件人和第二账户失陷；Microsoft
              观察到删除并标已读规则先于大量含内部目标的钓鱼发送。第二例支持操作可复现性，却未公布逐消息的规则命中记录。
            en: Before sending a plausible attachment or link from a compromised mailbox to business contacts, the actor can
              install a rule keyed to the campaign so questioning replies skip the ordinary inbox. Proofpoint observed this
              order, 45 internal recipients, and compromise of a second account. Microsoft observed a delete-and-mark-read
              rule before a larger campaign including internal recipients. The latter supports repeatability but does not
              publish per-message rule-match records.
        threat_model:
          attacker_model:
            paragraphs:
            - zh: 攻击者必须能修改原发件邮箱的规则，并有足够消息计划来选定主题、发件人或其他条件；若规则过宽，业务邮件缺失会触发用户发现，若过窄，警告回复可能漏过。攻击者还需保有发送权限并使另一内部主体收到诱导，规则本身不能完成横向移动。
              en: The actor needs rule-modification authority on the sender mailbox and enough campaign planning to select
                a subject, sender, or other match condition. A broad rule may make missing business mail conspicuous, while
                a narrow rule may miss warnings. The actor also needs sending capability and delivery to another internal
                principal; the rule alone cannot produce lateral movement.
          defender_model:
            paragraphs:
            - zh: 原用户可能只检查主收件箱，因而失去早期反馈；邮件平台管理员若保存规则变更、收件事件和文件夹动作，仍可按邮箱、规则条件、主题与时间复原差异。没有规则审计或保留期不足时，只能从收件者报告与异常发送推断压制，不能宣称已证明具体规则命中。
              en: The owner may check only the main inbox and lose early feedback. Administrators retaining rule changes,
                message receipt, and folder actions can reconstruct the difference by mailbox, rule condition, subject, and
                time. Without rule audit or sufficient retention, recipient reports and anomalous sending can suggest suppression
                but cannot prove a specific rule match.
      stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary:
          zh: 活动回复被路由离开原用户正常收件视野
          en: Campaign replies are routed outside the owner's ordinary inbox view
        analysis:
          paragraphs:
          - zh: 受控邮箱内按活动条件设置的规则改变回复的邮箱路径，令同事的警告虽被服务端接收，却不再作为未读收件出现在原用户日常观察面。原用户的局部监测因此少一个阻断信号，而规则变更审计、消息轨迹和其他文件夹形成可恢复的残余。Proofpoint
              的主题规则和第二账户事件支撑这条完整链，Microsoft 的规则与内部钓鱼序列作独立佐证。
            en: A campaign-conditioned rule in the controlled mailbox changes the path of replies, so colleagues's warnings
              can reach the service without appearing as unread messages in the owner's ordinary view. The owner's local monitoring
              loses an interrupting signal, while rule-change audit, message trace, and other folders preserve residual evidence.
              Proofpoint's subject rule and second-account event support this full chain; Microsoft's rule and internal-phishing
              sequence independently corroborate the mechanism.
        evidence_keys:
        - B8B-T1534-REF-PROOFPOINT-2026
        - B8B-T1534-REF-MS-2026
        - B8B-T1534-REF-MS-RULE-AUDIT
        confidence: medium
      limitations:
        paragraphs:
        - zh: Proofpoint 事件没有公布每一封被压制的回复及完整审计记录；对“原用户没有看到”的结论来自规则条件和调查叙述。Microsoft 事件的删除并标已读规则是广泛收件规则，不能代替 Proofpoint 的活动主题匹配证据。防守方不能把单一自动归档规则视为恶意，必须把异常规则创建、内部消息、实际回复和第二主体结果连接。
          en: Proofpoint does not publish every suppressed reply or a complete audit export; the finding that the owner did
            not see feedback follows from the rule conditions and incident account. Microsoft's delete-and-mark-read rule
            applied broadly and cannot substitute for Proofpoint's campaign-subject match. A defender should not treat one
            filing rule as malicious, but should link unusual rule creation, internal sending, actual feedback, and second-principal
            outcome.
    evidence_keys:
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-MS-RULE-AUDIT
    defense_difference:
      zh: 父级重建内部发送到收件者失陷的跨主体链；本子项增加服务器已收回复与原用户可见收件箱之间的规则差分，并审计规则条件和修改者。
      en: The parent reconstructs the cross-principal chain from internal sending to recipient compromise; this child additionally
        compares server-received feedback with the owner's visible inbox and audits the rule condition and modifier.
    admission_dependency:
      zh: 正式建项须先与 NJT-0111 工件可见性重塑及 NJS-0036-004 邮箱侧诱导痕迹抑制完成跨技术收敛；若活动相关反馈路由不能构成独立于通用邮箱隐藏的检测和缓解决议，则保留为父级机理及交叉关系，正式 NJS 为 0。
      en: Formal admission requires convergence with NJT-0111 Artifact Visibility Reshaping and NJS-0036-004 Mailbox-Side
        Solicitation Trace Suppression. If campaign-linked reply routing cannot support detection and mitigation distinct
        from general mailbox hiding, retain it as a parent mechanism and cross-technique relation with zero formal NJS.
  deferred_detection_analytic:
    key: B8B-T1534-NJA-REPLY-DIFF
    name:
      zh: 活动回复服务端与发件者收件箱差分
      en: Campaign Reply Server and Sender Inbox Differential
    logic:
      zh: 将可疑内部发送前后的 New-InboxRule 或 Set-InboxRule 与受控发件邮箱和其当前规则配置关联，解析主题条件、修改者、归档或删除动作。再用消息跟踪确认同事的活动相关回复到达服务器，并以邮箱项目审计或授权文件夹检查确认其未进入主收件箱。规则匹配诱导主题、修改会话异常且至少一封回复确被重定向时输出
        confirmed；缺少文件夹核验时只能输出 suspected。第二账户是否失陷由主分析另行判定。
      en: Join New-InboxRule or Set-InboxRule around suspicious internal sends to the controlled mailbox and current rule
        configuration, parsing subject predicate, modifier, and archive or delete action. Confirm a campaign-related colleague
        reply reached the server using message trace, then verify by mailbox item audit or authorized folder inspection that
        it missed the main inbox. Emit confirmed only if the rule matches the lure subject, the modifying session is anomalous,
        and at least one reply was actually redirected; without folder verification emit suspected. The primary analytic separately
        determines second-account compromise.
    data_requirements:
    - source_type: exchange-rule-audit
      channel: Microsoft Purview UnifiedAuditLog
      required_fields:
      - CreationTime
      - UserId
      - Operation
      - AuditData
      - mailbox_id
    - source_type: exchange-rule-config
      channel: Exchange Online Get-InboxRule
      required_fields:
      - mailbox_id
      - rule_name
      - rule_condition
      - action
      - enabled
    - source_type: exchange-message-trace
      channel: Exchange Online message trace
      required_fields:
      - timestamp
      - sender_address
      - recipient_address
      - InternetMessageId
      - subject
      - delivery_status
    - source_type: mailbox-placement
      channel: Purview mailbox audit or authorized folder inspection
      required_fields:
      - mailbox_id
      - message_id
      - folder_id
      - event_time
    observables:
    - zh: 诱导主题的归档或删除规则先于同主题内部发送。
      en: An archive or delete rule for a lure subject precedes internal sending with that subject.
    - zh: 同事回复经服务器收件，却进入归档或删除位置而未出现于原用户主收件箱。
      en: A colleague reply reaches the server but appears in archive or deletion rather than the owner's main inbox.
    correlation_window: 48h_rule_to_campaign_extend_for_replies
    dimensions:
    - mailbox_id
    - rule_id
    - rule_condition
    - modifier_account_id
    - subject
    - InternetMessageId
    - folder_id
    - time
    false_positives:
    - legitimate_project_filing
    - approved_shared_mailbox_delegate
    - bulk_notification_filter
    - owner_manual_cleanup
    blind_spots:
    - Purview_audit_retention_expired
    - rule_predates_window
    - no_message_trace
    - folder_state_unavailable
    - chat_feedback_outside_email
    tuning:
      zh: 按邮箱所有者、授权委派、规则历史和业务主题校准。保存原始规则审计与消息轨迹；规则存在本身不证明命中，需核验实际回复的路由。例外绑定具体委派、目的和有效期，防止把所有归档规则当作攻击。
      en: Tune by owner, authorized delegation, rule history, and business subject. Retain original rule audit and message
        trace; rule existence alone does not prove a hit, so inspect actual reply routing. Bind exceptions to specific delegation,
        purpose, and expiry rather than treating every filing rule as malicious.
    evidence_keys:
    - B8B-T1534-REF-PROOFPOINT-2026
    - B8B-T1534-REF-MS-2026
    - B8B-T1534-REF-MS-RULE-AUDIT
