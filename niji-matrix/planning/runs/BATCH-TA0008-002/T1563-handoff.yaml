defense_candidates:
  detection_strategies:
  - key: B8B-T1563-DET-SESSION-CONTROLLER
    name:
      zh: 既有远程会话的控制者交接关联
      en: Controller Handoff Correlation for Existing Remote Sessions
    objective:
      zh: 对同一已认证传输的新通道或同一交互会话的新附着端，比较原会话所有者、后来的发起者和目标结果，识别未经授权的控制者交接。
      en: Compare original owner, later initiator, and destination result for a new channel on an authenticated transport
        or a replacement or co-controller on an interactive session to identify unauthorized controller handoff.
    covered_subjects:
    - parent
    - B8B-T1563-NJS-CHANNEL
    - B8B-T1563-NJS-ATTACH
    analytic_keys:
    - B8B-T1563-NJA-SSH-CHANNEL
    - B8B-T1563-NJA-RDP-ATTACH
    - B8B-T1563-NJA-RDP-SHADOW
    reuse_decision: create
    distinction_from_existing:
      zh: DET-000094/NJA-000071 处理网关 token/session 重放与新远程入口，不持有 SSH 通道身份和 Windows 原 LogonID 的客户端重附着证据；须新建本策略，避免把同名“session”误作同一检测目标。
      en: DET-000094/NJA-000071 address gateway token or session replay and new remote entry, not SSH channel identity and
        Windows client reattachment to an original LogonID. Create a distinct strategy despite the shared word session.
  detection_analytics:
  - key: B8B-T1563-NJA-SSH-CHANNEL
    name:
      zh: SSH 原连接—新通道—本地控制者差分
      en: SSH Original Connection to New Channel and Local Controller Differential
    platforms:
    - Linux
    - macOS
    logic:
      zh: 在可部署通道埋点的跳板与目标对上，先记录 sshd 初始认证所建连接的 connection_id、账户、源地址、建立时间和通道集合。在同一 connection_id 后续创建 shell/exec 通道时，查询跳板近两分钟内的
        ControlPath Unix socket 客户端进程或对原 ssh 客户端的 ptrace/调试事件，把进程 uid、启动谱系、socket owner 与原 SSH 客户端进程比较；再核对目标新通道关联的 shell/exec
        进程和高风险内部资源动作。若新发起进程与原管理员操作链不符且无批准的复用关系，输出控制者交接候选；只有目标结果相连才升级为横向成功。通道数量增加但无可识别本地异常或仅无新认证，保持低置信调查信号。
      en: On jump-host and destination pairs with validated channel instrumentation, first retain the sshd connection_id,
        account, source address, creation time, and channel set established at initial authentication. When a later shell
        or exec channel appears on the same connection_id, search a two-minute jump-host window for a ControlPath Unix-socket
        client process or ptrace/debug access to the original ssh client and compare process UID, start lineage, socket owner,
        and original SSH client. Then join the destination channel to its shell or exec process and high-risk internal resource
        actions. Emit a controller-handoff candidate when the new initiator diverges from the administrator's approved process
        lineage without an authorized sharing relation; upgrade to lateral success only with a linked destination result.
        Channel count growth without a local anomalous initiator, or simply missing new authentication, remains a low-confidence
        lead.
    data_requirements:
    - source_type: instrumented-openssh-connection-channel
      channel: validated_ssh_server_channel_telemetry
      required_fields:
      - timestamp
      - destination_host
      - connection_id
      - channel_id
      - channel_type
      - account
      - source_ip
      - authentication_time
      - channel_open_time
    - source_type: jump-host-unix-socket-and-debug-access
      channel: validated_endpoint_or_kernel_sensor
      required_fields:
      - timestamp
      - jump_host
      - source_process_id
      - source_process_start_time
      - source_uid
      - target_process_id
      - socket_path
      - socket_owner_uid
      - operation
      - result
    - source_type: destination-process-lineage
      channel: endpoint_process_telemetry
      required_fields:
      - timestamp
      - destination_host
      - process_id
      - parent_process_id
      - account
      - session_or_channel_id
      - executable
      - command_line
    - source_type: approved-ssh-sharing-inventory
      channel: null
      required_fields:
      - approval_id
      - jump_host
      - destination_host
      - account
      - allowed_process_or_role
      - control_path
      - valid_from
      - valid_to
    observables:
    - zh: 旧认证连接上出现新的 shell/exec channel，跳板同时有非原客户端谱系的进程访问其控制套接字或客户端进程。
      en: A new shell or exec channel appears on an old authenticated connection while a jump-host process outside the original
        client lineage accesses its control socket or process.
    - zh: 目标 SSH 会话以原账户产生新命令或资源访问，但无对应的新目标认证且本地发起进程与原所有者不符。
      en: A destination SSH session runs a new command or resource action as the original account without new destination
        authentication, while the local initiator diverges from the owner.
    correlation_window:
      zh: 本地访问到新通道默认两分钟，连接建立到后继通道按实际传输寿命追踪，最多二十四小时并按环境调优。
      en: Default two minutes from local access to new channel; track original connection through its actual transport lifetime,
        capped at twenty-four hours and tuned to the environment.
    dimensions:
    - jump_host
    - destination_host
    - connection_id
    - channel_id
    - account
    - original_client_process
    - new_initiator_process
    - socket_path
    - approval_id
    false_positives:
    - authorized_ControlMaster_multiplexing
    - same_user_multiple_terminals
    - backup_or_deployment_over_ssh
    - authorized_debugging
    blind_spots:
    - no_channel_level_instrumentation
    - no_control_socket_or_ptrace_telemetry
    - host_clock_skew
    - compromised_jumphost_sensor
    - process_attachment_without_visible_socket
    tuning:
      zh: 先在受管跳板试点标定每个 sshd 版本能稳定输出的连接/通道标识；不能取得 channel_id 时不声称精确归因。批准复用只按具体账户、跳板、目标、控制路径、进程角色和有效期允许，不永久放行所有 ssh。将正常调试器和自动化映射到工单；对
        root 跨用户附着和目标高权限命令提升优先级，但仍要求控制者差异和实际目标结果。
      en: Pilot each managed jump-host and sshd version to validate stable connection and channel identifiers; do not claim
        exact attribution without a channel ID. Allow approved sharing only for a specific account, jump host, target, control
        path, process role, and validity period, not all ssh activity. Map legitimate debugging and automation to tickets.
        Prioritize root cross-user attachment and sensitive destination commands while still requiring controller divergence
        and an actual destination result.
    evidence_keys:
    - B8B-T1563-REF-OPENSSH-CONFIG
    - B8B-T1563-REF-OPENSSH-MUX
    - B8B-T1563-REF-ISSHD
    - REF-000370
  - key: B8B-T1563-NJA-RDP-ATTACH
    name:
      zh: RDS 原登录—客户端重附着—操作发起者关联
      en: RDS Original Logon to Client Reattachment and Initiator Correlation
    platforms:
    - Windows
    logic:
      zh: 在每台 RDS 会话主机按 host 与 LogonID 将原 4624 Type 10 的用户和来源、4779 断开及后来的 4778 重连连接，比较 ClientName/ClientAddress 和会话名。以 4778
        前后两分钟的 4688 进程创建寻找 tscon 或经批准的会话管理程序，并把创建者 LogonID、进程谱系及权限与原会话用户区分；同一目标会话随后十分钟的敏感进程或资源动作提供结果门。若重附着来源是不同资产/操作者、发起者非原用户且无有效支持工单或本人设备迁移，输出待调查交接；仅
        4778 或无新 4624 不能定为劫持。原 4624 不在保留期时只报告来源异常而不作精确原所有者结论。
      en: On each RDS session host, join the original 4624 type-10 user and origin, a 4779 disconnect, and later 4778 reconnect
        by host and LogonID, comparing ClientName, ClientAddress, and session name. Search a two-minute window around 4778
        for 4688 creation of tscon or an approved session manager, and separate its creator LogonID, process lineage, and
        rights from the original session owner. Sensitive process or resource actions within ten minutes of the same destination
        session provide the result gate. A different source asset or operator, non-owner initiator, and no valid support ticket
        or owner device migration produce a reviewable handoff. Neither 4778 alone nor absence of new 4624 establishes hijacking.
        If the original 4624 aged out, report an origin anomaly without claiming exact original ownership.
    data_requirements:
    - source_type: windows-rds-session-transition
      channel: Security/4778_4779
      required_fields:
      - TimeCreated
      - Computer
      - EventID
      - AccountName
      - AccountDomain
      - LogonID
      - SessionName
      - ClientName
      - ClientAddress
    - source_type: windows-remote-interactive-logon
      channel: Security/4624
      required_fields:
      - TimeCreated
      - Computer
      - TargetLogonId
      - TargetUserName
      - LogonType
      - IpAddress
      - WorkstationName
    - source_type: windows-process-creation
      channel: Security/4688_with_command_line_enabled
      required_fields:
      - TimeCreated
      - Computer
      - SubjectLogonId
      - NewProcessId
      - NewProcessName
      - CreatorProcessId
      - ProcessCommandLine
    - source_type: rds-approval-and-asset-context
      channel: null
      required_fields:
      - approval_id
      - session_owner
      - support_operator
      - source_device
      - destination_host
      - valid_from
      - valid_to
    observables:
    - zh: 同一 LogonID 的 4779 后出现来自不同客户端的 4778，而会话主机上另一个主体启动了连接操作。
      en: A 4778 from a different client follows 4779 for the same LogonID while another principal launches a connect operation
        on the session host.
    - zh: 被重附着的原用户会话随后执行与历史职责不符的命令或访问新的内部资源。
      en: The reattached original-user session subsequently runs commands or accesses internal resources inconsistent with
        its role.
    correlation_window:
      zh: 原登录按 LogonID 保留至会话结束；连接进程到 4778 默认两分钟，重附着到敏感结果十分钟，按排障流程调优。
      en: Retain the original logon by LogonID until session end; use two minutes from connect process to 4778 and ten minutes
        from reattachment to sensitive result, tuned to support workflows.
    dimensions:
    - session_host
    - logon_id
    - session_name
    - session_owner
    - prior_client
    - new_client
    - initiating_process
    - initiating_principal
    - approval_id
    false_positives:
    - user_reconnect_after_network_loss
    - owner_switching_devices
    - approved_helpdesk_session_takeover
    - authorized_administrator_handoff
    - Hyper_V_enhanced_session_or_fast_user_switching
    blind_spots:
    - 4778_4779_audit_disabled
    - 4688_command_line_disabled
    - non_tscon_API_or_service_path
    - original_4624_expired
    - NAT_or_gateway_hides_client
    - compromised_session_host_logs
    tuning:
      zh: 将已批准接管限定具体工单、操作者、会话所有者、主机和时段；不能仅因 tscon 为签名系统程序或客户端为内网地址而放行。区分 RDP-Tcp 会话与 Console/Hyper-V 增强会话，按来源资产的真实所有者而非 IP
        独断；网络断线引起的自动重连和正常班次移交应降级，后继高风险资源结果升高置信度。
      en: Bind approved takeovers to a ticket, operator, session owner, host, and time window; do not allowlist a signed tscon
        image or internal client address alone. Separate RDP-Tcp from Console and Hyper-V enhanced sessions, and resolve source
        asset ownership rather than judging IP alone. Lower confidence for automatic reconnection after network loss and normal
        shift handoff, while a high-risk downstream resource result raises it.
    evidence_keys:
    - B8B-T1563-REF-TSCON
    - B8B-T1563-REF-4778
    - B8B-T1563-REF-4779
    - B8B-T1563-REF-4624
    - B8B-T1563-REF-4688
  - key: B8B-T1563-NJA-RDP-SHADOW
    name:
      zh: RDS 影子控制策略—请求—结果链
      en: RDS Shadow-Control Policy, Request, and Outcome Chain
    platforms:
    - Windows
    logic:
      zh: 在 RDS 会话主机记录每个活动会话的所有者、SessionID 和控制权限/同意策略。以进程创建事件识别 mstsc 或其他远程控制客户端的 shadow/control 请求，将发起账户、主机、目标 SessionID、控制而非仅查看模式与当时的
        Shadow 策略快照相连。若经本环境验证的 RDS 远程控制操作日志或传感器报告请求成功，且发起者不同于原用户、未获批并随后出现原会话中的目标资源动作，则报告成功的控制端并存；只有命令行或策略变更时报告尝试或风险，不把它当成功。原用户继续在线的情形不能强制要求
        4779/4778。
      en: Record each active RDS session's owner, SessionID, control rights, and consent policy on the host. Identify mstsc
        or another remote-control client's shadow and control request from process-creation telemetry, then join initiator
        account, source host, target SessionID, control rather than view-only mode, and the contemporaneous Shadow policy
        snapshot. If an environment-validated RDS remote-control operation log or sensor confirms acceptance, the initiator
        differs from the original user, no approval exists, and a destination-resource action follows in the original session,
        report successful parallel control. Command line or policy change alone is an attempt or exposure. Do not require
        4779 or 4778 when the original user remains connected.
    data_requirements:
    - source_type: windows-process-creation
      channel: Security/4688_with_command_line_enabled
      required_fields:
      - TimeCreated
      - Computer
      - SubjectLogonId
      - NewProcessId
      - NewProcessName
      - CreatorProcessId
      - ProcessCommandLine
    - source_type: rds-session-control-operation
      channel: validated_TerminalServices_RemoteConnectionManager_or_endpoint_sensor
      required_fields:
      - timestamp
      - session_host
      - target_session_id
      - target_session_owner
      - controller_account
      - controller_host
      - operation
      - result
    - source_type: rds-shadow-policy-state
      channel: group_policy_or_registry_inventory
      required_fields:
      - timestamp
      - session_host
      - Shadow_policy_value
      - policy_source
      - last_change_actor
    - source_type: rds-approval-and-asset-context
      channel: null
      required_fields:
      - approval_id
      - session_owner
      - support_operator
      - source_device
      - destination_host
      - valid_from
      - valid_to
    observables:
    - zh: 未获批的管理主体把影子策略改为无需用户同意，随后向另一用户活动 SessionID 发出控制请求。
      en: An unapproved administrator changes shadow policy to omit consent and then requests control of another user's active
        SessionID.
    - zh: 经会话主机确认的影子控制成功后，原用户仍在线，而同一会话产生不合职责的资源动作。
      en: After the session host confirms successful shadow control, the original user remains present while the same session
        performs resource actions inconsistent with the owner's role.
    correlation_window:
      zh: 策略变化到影子请求追踪二十四小时，进程请求到会话操作默认两分钟，成功控制到后续资源动作十分钟。
      en: Track policy change to shadow request for twenty-four hours, process request to session operation for two minutes,
        and successful control to downstream resource action for ten minutes.
    dimensions:
    - session_host
    - target_session_id
    - target_session_owner
    - controller_account
    - controller_host
    - Shadow_policy_value
    - operation_result
    - approval_id
    false_positives:
    - approved_helpdesk_shadowing
    - instructor_or_training_session
    - emergency_response_with_retrospective_approval
    - policy_administration
    blind_spots:
    - no_validated_shadow_success_event
    - 4688_command_line_disabled
    - API_based_shadow_request
    - compromised_session_host_logs
    - shared_support_account
    tuning:
      zh: 先在实际 Windows/RDS 版本上验证 RemoteConnectionManager 或 EDR 何种事件明确表示 shadow 接受，不能仅按固定事件号照搬。允许规则绑定工单、支持人员、会话所有者、主机、控制/查看模式、同意要求和期限；不因管理工具签名或影子策略长期存在而忽略新请求。对仅改变策略或被阻断请求保留
        attempt 标签，对成功且有目标结果的活动单独升级。
      en: First validate on the actual Windows and RDS version which RemoteConnectionManager or EDR event conclusively means
        shadow acceptance; do not transplant a fixed event ID without testing. Bind allowances to ticket, support operator,
        session owner, host, control versus view mode, consent requirement, and expiry. Do not ignore a new request because
        the tool is signed or the policy is longstanding. Preserve attempt for policy-only or blocked requests and separately
        upgrade accepted control with a destination result.
    evidence_keys:
    - B8B-T1563-REF-CROWDSTRIKE-OVERWATCH
    - B8B-T1563-REF-SHADOW
    - B8B-T1563-REF-MSTSC
    - B8B-T1563-REF-SHADOW-POLICY
    - B8B-T1563-REF-4688
  mitigations:
  - key: B8B-T1563-MIT-SESSION-OWNERSHIP
    name:
      zh: 远程会话附着权限与寿命治理
      en: Remote Session Attachment Rights and Lifetime Governance
    reuse_decision: create
    measures:
    - key: controlled-ssh-channel-sharing
      control_type: preventive
      description:
        zh: 在敏感跳板默认关闭不必要的 ControlMaster，确需共享时把 ControlPath 放入仅会话所有者可写的目录并要求确认；目标 sshd 经兼容验证对不需要并发 shell 的角色设 MaxSessions 1，防止同一传输新增
          shell/exec 通道。
        en: Disable unnecessary ControlMaster use on sensitive jump hosts; where sharing is required, place ControlPath in
          an owner-only writable directory and require confirmation. After compatibility validation, set target sshd MaxSessions
          to 1 for roles that do not need concurrent shells, blocking additional shell or exec channels on a transport.
    - key: least-rds-connect-rights
      control_type: preventive
      description:
        zh: 按支持职责限制 RDS 会话的 Full Control/Connect 权限与能发起连接的管理路径，保留跨用户口令或审批要求；按业务所需设置断开会话结束时限，避免长期悬置但避免强制断开造成数据丢失。
        en: Limit RDS Full Control and Connect rights and session-management paths by support role, retain cross-user password
          or approval requirements, and set disconnected-session termination periods to business need without forcing data
          loss.
    - key: controlled-rds-shadowing
      control_type: preventive
      description:
        zh: 默认禁止无业务需要的跨用户远程控制；需支持时只对指定角色授予 Remote Control/Full Control，并保留用户同意提示，任何免同意例外须绑定高风险资产、审批和期限。
        en: Disable unnecessary cross-user remote control by default; where support needs it, grant Remote Control or Full
          Control only to named roles and retain user consent. Bind any no-consent exception to high-risk assets, approval,
          and expiry.
    - key: session-ownership-evidence
      control_type: detective-support
      description:
        zh: 在高价值跳板保全 socket/ptrace 与目标通道谱系，在 RDS 主机启用 Other Logon/Logoff 与进程创建及命令行审计，并独立保留原会话所有者、附着端和授权工单。
        en: Preserve socket or ptrace and destination-channel lineage on high-value jump hosts, enable Other Logon/Logoff
          and process creation with command-line audit on RDS hosts, and independently retain original session owner, attached
          client, and authorization ticket.
    applications:
    - target: parent
      use:
        zh: 对所有高价值远程会话标定原所有者、可附着主体、过期时间及批准接管流程，并采集会话交接后的目标资源结果。
        en: Identify original owner, eligible attaching principals, expiry, and approved handoff for high-value remote sessions,
          and collect destination-resource results after a handoff.
      expected_effect:
        zh: 缩短可利用会话窗口并使无授权控制端变化可追溯。
        en: Reduce the usable session window and make unauthorized controller changes traceable.
      limitations:
        zh: 对已经拥有合规附着权限的恶意管理员只能提高审计与响应能力，不能宣称必然阻断。
        en: A malicious administrator with authorized connect rights may still act; the measure improves audit and response
          but does not guarantee prevention.
    - target: B8B-T1563-NJS-CHANNEL
      use:
        zh: 对允许复用的跳板限定 socket owner、具体目标和到期窗口，在不需要多路 shell 的 sshd 上限制通道数，并与现有 MIT-000102 的 ptrace 最小权限措施配合。
        en: Bound permitted jump-host sharing by socket owner, exact target, and expiry; limit channel count on sshd roles
          without a multiplexing need and combine with the existing MIT-000102 least-ptrace-access measure.
      expected_effect:
        zh: 减少非法进程能附加到旧连接的路径，同时保留通道创建证据。
        en: Reduce paths by which an unauthorized process can add to an old connection while preserving channel-creation evidence.
      limitations:
        zh: MaxSessions 1 会影响合法并发会话且不阻断已经存在的单一通道被进程接管；root 或传感器妥协仍需独立证据。
        en: MaxSessions 1 affects legitimate multiplexing and does not stop takeover of an existing single channel; root or
          sensor compromise still needs independent evidence.
    - target: B8B-T1563-NJS-ATTACH
      use:
        zh: 在 RDS 主机仅向指定支持角色授予 Connect/Full Control 或 Remote Control 权限，按岗位清理断开会话，影子控制保留用户同意，跨用户接管留下工单和原用户可验证通知。
        en: Grant RDS Connect, Full Control, or Remote Control only to designated support roles, end disconnected sessions
          according to role, retain consent for shadow control, and require a ticket and verifiable owner notice for cross-user
          handoff.
      expected_effect:
        zh: 降低可接管会话数量及悬置时间，并提供控制者变化的合法性基线。
        en: Reduce the number and lifetime of attachable sessions and establish an authorization baseline for controller changes.
      limitations:
        zh: 断开时限可能影响未保存工作，具合法管理权的内部威胁仍可尝试接管，必须保留日志和审批复核。
        en: Timeout can interrupt unsaved work and an insider with legitimate administrative authority may still attempt takeover,
          so logs and approval review remain necessary.
    evidence_keys:
    - B8B-T1563-REF-OPENSSH-CONFIG
    - B8B-T1563-REF-SSHD-CONFIG
    - REF-000370
    - B8B-T1563-REF-TSCON
    - B8B-T1563-REF-SHADOW
    - B8B-T1563-REF-SHADOW-POLICY
    - B8B-T1563-REF-RDS-LIMITS
    - B8B-T1563-REF-4778
    - B8B-T1563-REF-4779
    - B8B-T1563-REF-4688
