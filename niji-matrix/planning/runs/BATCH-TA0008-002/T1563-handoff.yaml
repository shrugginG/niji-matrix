      zh: OpenSSH 可经受保护的控制套接字或运行中客户端在同一已认证传输上建立另一逻辑会话通道，不产生另一 TCP 建连；控制者差异与目标结果须另证。
      en: OpenSSH can create another logical session channel on the same authenticated transport through a control socket
        or running client without another TCP connection; changed controller and destination result require separate proof.
    evidence_keys:
    - B8B-T1563-REF-OPENSSH-CONFIG
    - B8B-T1563-REF-OPENSSH-MUX
    - B8B-T1563-REF-ISSHD
    confidence: medium
  - key: B8B-T1563-CLM-ATTACH
    statement:
      zh: 有足够权限的主体可把既有 RDS 会话接到另一端点，原会话的 4779/4778 与相同 LogonID 可支撑控制端交接调查，单个事件不证明恶意。
      en: An appropriately authorized principal can attach an existing RDS session to another endpoint; 4779 and 4778 with
        the same original LogonID support investigation of the controller handoff, while no single event proves malice.
    evidence_keys:
    - B8B-T1563-REF-TSCON
    - B8B-T1563-REF-RDP-POC
    - B8B-T1563-REF-MAZE
    - B8B-T1563-REF-CROWDSTRIKE-OVERWATCH
    - B8B-T1563-REF-SHADOW
    - B8B-T1563-REF-4778
    - B8B-T1563-REF-4779
    confidence: medium
  - key: B8B-T1563-CLM-AGENT-EXCLUSION
    statement:
      zh: Matrix.org 2019 年事件证明转发 SSH agent 可被用于代表用户认证及植入攻击者公钥，但来源未证明原已认证传输或 PTY 被接管。
      en: The 2019 Matrix.org incident proves misuse of a forwarded SSH agent for authentication and installation of attacker
        keys, but does not establish takeover of the original authenticated transport or PTY.
    evidence_keys:
    - B8B-T1563-REF-MATRIX-2019
    - B8B-T1563-REF-OPENSSH-CONFIG
    confidence: high
  - key: B8B-T1563-CLM-DEFENSE
    statement:
      zh: 通道级埋点加本机 socket/ptrace 来源关联，以及 Windows 同 LogonID 会话转换加进程创建关联，是两种不同且可实施的检测路径；无对应遥测时须降低结论层级。
      en: Channel instrumentation joined to local socket or ptrace provenance and Windows same-LogonID session transitions
        joined to process creation are distinct implementable detection paths; conclusions must be downgraded when the relevant
        telemetry is missing.
    evidence_keys:
    - B8B-T1563-REF-ISSHD
    - B8B-T1563-REF-4778
    - B8B-T1563-REF-4779
    - B8B-T1563-REF-4688
    confidence: medium
  cases:
  - key: B8B-T1563-CASE-OVERWATCH-SHADOW
    title:
      zh: OverWatch 事件中受阻的 tscon 与成功的影子控制
      en: Blocked tscon and Successful Shadow Control in an OverWatch Intrusion
    event:
      zh: CrowdStrike 记录攻击者在 2020 年 6 月一处亚太物流环境中先以 qwinsta 枚举并尝试 tscon，该尝试被 Falcon 阻断；攻击者随后修改影子控制策略，以 mstsc 对活动会话实施无同意提示的控制，报告明确称成功。
      en: CrowdStrike records an actor in a June 2020 APAC logistics intrusion enumerating with qwinsta and attempting tscon,
        which Falcon blocked; the actor then changed shadow-control policy and used mstsc to take control of an active session
        without a consent prompt, a step the report expressly calls successful.
    evidence_keys:
    - B8B-T1563-REF-CROWDSTRIKE-OVERWATCH
    conclusion_limit:
      zh: tscon 只能作为受阻尝试；成功的是后续影子控制，不可混成一次成功 tscon。来源未公布逐条 4778/4779、shadow 成功事件字段或每个后续命令的会话关联，故这些细节仍属检测设计而非事件事实。
      en: tscon is a blocked attempt only; the successful operation is later shadow control, not a successful tscon. The source
        does not publish 4778 or 4779, shadow success-event fields, or a session join for every later command; these remain
        detection design rather than incident facts.
    confidence: high
  - key: B8B-T1563-CASE-MAZE-RDP
    title:
      zh: MAZE 行动中的既有 RDP 会话接管
      en: Existing RDP Session Hijacking in MAZE Intrusions
    event:
      zh: Mandiant 在多起 MAZE 事件的横向移动综述中直接记录攻击者使用 tscon 接管合法 RDP 会话，并将其用于横向移动和权限提升。
      en: In its synthesis of multiple MAZE intrusions, Mandiant directly reports attackers using tscon to hijack legitimate
        RDP sessions for lateral movement and privilege escalation.
    evidence_keys:
    - B8B-T1563-REF-MAZE
    conclusion_limit:
      zh: 报告未公开逐受害者会话 ID、旧/新客户端、4778/4779 或单次命令后的资源结果；可支持父级与重附着子项实际出现，不能支持特定日志链、无提示方式或确定攻击者意在匿迹。
      en: The report does not disclose per-victim session IDs, old and new clients, 4778 or 4779, or a resource result after
        each command. It supports field occurrence of the parent and reattachment child, not a specific log chain, promptless
        method, or established stealth intent.
    confidence: medium
