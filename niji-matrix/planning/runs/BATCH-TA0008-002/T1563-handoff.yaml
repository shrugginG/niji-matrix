research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 2
    attack_subtechnique_ids:
    - T1563.001
    - T1563.002
    represented_dimensions:
    - SSH_authenticated_transport_or_agent_implementation
    - RDS_existing_interactive_session_implementation
    breadth_trigger: ordinary
    coverage_resolutions:
    - attack_id: T1563.001
      resolution: niji-variable-candidate
      note:
        zh: SSH 名称不是子项；真正可迁移变量是他人已认证传输上新增通道。ATT&CK 页同时包含代理转发签名新连接，此部分按 T1550/T1021 边界排除。
        en: SSH is not the child; the transferable variable is a new channel on another principal's authenticated transport.
          Agent forwarding that signs a new connection is excluded to the T1550 or T1021 boundary despite sharing ATT&CK's
          SSH page.
    - attack_id: T1563.002
      resolution: niji-variable-candidate
      note:
        zh: RDP 名称不是子项；真正变量是既有交互会话的控制端集合改变。tscon 迁移与 shadow 并存均属此变量，分别产生断开/重连或控制请求痕迹。
        en: RDP is not the child; the variable is a changed controller set for an existing interactive session. tscon transfer
          and parallel shadowing both express it, with different disconnect or reconnect versus control-request traces.
    candidate_stealth_axes_examined:
    - key: B8B-T1563-AXIS-TRANSPORT-CHANNEL
      disposition: propose_formal_with_primary_review
      zh: 已认证传输承载新逻辑通道，目标无新传输握手或同连接的新用户认证；OpenSSH 原始规范和 iSSHD/SSH-Jack 技术研究支持可实施，但目前未找到能证明此具体链的野外事件，正式置信度不得高于 medium。
      en: An authenticated transport carries a new logical channel without a fresh transport handshake or new user authentication
        on that connection. OpenSSH primary specifications and iSSHD/SSH-Jack technical research support feasibility, but
        no field incident proving this precise chain was found, so formal confidence must not exceed medium.
    - key: B8B-T1563-AXIS-INTERACTIVE-CONTROLLER
      disposition: propose_formal
      zh: 既有交互会话由新端独占迁移或并行控制，原用户上下文持续；Microsoft 功能文档、Korznikov 实验、Mandiant MAZE 成功野外事件与 CrowdStrike 成功 shadow 野外事件支持。tscon
        与 shadow 不分子项，因为两者可顺序出现且均改变同一会话控制者集合；检测分析仍须分支。
      en: An existing interactive session is exclusively transferred or controlled in parallel while the original user context
        persists. Microsoft functional documentation, Korznikov's demonstration, Mandiant's successful MAZE field observation,
        and CrowdStrike's successful shadow field observation support it. tscon and shadow are not separate children because
        they can occur sequentially and both change the same session controller set; analytics still need separate branches.
    - key: B8B-T1563-AXIS-AGENT-SIGNING
      disposition: adjacent_technique
      zh: 代理为新 SSH 连接签名改变的是认证材料可用性，不是已有传输或交互会话的控制者；Matrix.org 事件直接支持该边界。
      en: An agent signing for a new SSH connection changes authentication-material availability, not the controller of an
        existing transport or interactive session; the Matrix.org incident directly supports this boundary.
    - key: B8B-T1563-AXIS-PTY-OR-TMUX
      disposition: evidence_deferred
      zh: 附着同机 tmux/screen 或直接 PTY 可能是交互接管，但需证明其为跨内部主机的原远程服务会话及目标结果，不能凭本地复用终端自动列入。
      en: Attaching to local tmux, screen, or a PTY may be interactive takeover, but it needs evidence of the original cross-host
        remote-service session and destination result; local terminal reuse alone does not qualify.
    - key: B8B-T1563-AXIS-NO-CONSENT
      disposition: parent_core_not_child
      zh: 是否无需提示取决于权限和策略；CrowdStrike 具体事件有此效果，但它不是跨实现稳定的独立会话所有权变量。
      en: Promptless operation depends on rights and policy. CrowdStrike's specific event had that effect, but it is not an
        independent cross-implementation session-ownership variable.
    - key: B8B-T1563-AXIS-LIFETIME
      disposition: evidence_deferred
      zh: 长时间保留的传输或断开桌面增加暴露窗口，但现有证据未证明攻击者稳定控制保留时长以改变检测痕迹，故不单设时序 NJS。
      en: Long-lived transports or disconnected desktops increase exposure, but current evidence does not show stable attacker
        control over lifetime as a distinct trace-shaping variable, so no timing child is proposed.
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    reviewer_notes:
      zh: 两个 ATT&CK 子项按协议划分，Niji 的两项建议按被改变的关系划分。增附通道可迁移至具多通道已认证连接的服务，但目前仅 OpenSSH 有直接证据；控制端重绑定可迁移至允许既有会话控制端迁移/并存的远程桌面或管理服务，但目前仅
        RDS 有直接证据。主 Agent 应独立裁定通道项的实验级证据足以正式 review，还是标为 deferred；不允许以 RDP 的野外 CASE 填补 SSH 轴。
      en: ATT&CK's two children divide protocols; Niji's two proposals divide the relationship changed. Channel addition could
        apply to another multichannel authenticated service, but direct evidence here is limited to OpenSSH. Controller rebinding
        could apply to another remote desktop or management service that allows transfer or co-control of an existing session,
        but direct evidence here is limited to RDS. The primary reviewer must independently decide whether technical evidence
        suffices for formal review of the channel child or whether it should be deferred; RDP field cases cannot fill the
        SSH evidence gap.
  session_identity_and_authentication_checks:
  - axis: B8B-T1563-NJS-CHANNEL
    same_existing_state:
      zh: 必须是同一已认证 SSH transport/connection_id；会有新的逻辑 session channel，故不可写成“接管了原交互 PTY”。
      en: It must be the same authenticated SSH transport or connection_id. A new logical session channel exists, so do not
        claim takeover of the original interactive PTY.
    new_authentication:
      zh: 规范路径无需在该 transport 上再次 SSH userauth；若客户端因 socket 失败回退到新 TCP 连接及新认证，转 T1021/T1550 分析。
      en: The specified path needs no new SSH userauth on that transport. If socket failure causes fallback to a new TCP connection
        and authentication, assess under T1021 or T1550 instead.
    evidence_grade: technical_capability_without_confirmed_field_case
    admission_judgment:
      zh: 建议作为 medium 置信度正式子项接受原始协议规范加安全研究的可重复技术证据，并在限制中明示无野外案例；若本批规定必须有事件级控制者差异与目标结果，则本项应 deferred，父级仍可保留。
      en: Recommend a medium-confidence formal child on reproducible primary protocol and security-research evidence with
        the absence of a field case explicit. If this batch requires an event-level changed-controller and destination-result
        chain, defer this child while retaining the parent.
  - axis: B8B-T1563-NJS-ATTACH
    same_existing_state:
      zh: 必须是同一目标 RDS SessionID/原用户登录上下文；tscon 迁移控制端，shadow 增加并行控制端，不新建一个属于被害用户的桌面。
      en: It must be the same target RDS SessionID and original-user logon context. tscon transfers the controller and shadow
        adds a parallel controller rather than creating a new victim desktop.
    new_authentication:
      zh: 被害会话无需再次提交原用户口令；操作者可能为进入会话主机先建立自己的登录或经网关认证，因此“没有任何 4624”并非必要条件。具体 tscon 跨用户口令与 shadow 同意提示按权限/策略判断。
      en: The victim session need not resubmit the owner's password, but the operator may log on separately to reach the session
        host or authenticate through a gateway, so absence of every 4624 is not a required condition. Cross-user tscon password
        and shadow consent depend on rights and policy.
    evidence_grade: primary_functional_docs_plus_controlled_demo_plus_confirmed_field_cases
    admission_judgment:
      zh: 建议正式成立，置信度 medium 至 high；MAZE 明确报告成功 tscon 接管，CrowdStrike 明确报告成功 shadow 接管，后者的 tscon 操作须单列为受阻尝试。不能把规范能力或受阻尝试升格成另一成功事件。
      en: 'Recommend formal admission at medium to high confidence: MAZE explicitly reports successful tscon hijacking and
        CrowdStrike explicitly reports successful shadow hijacking. CrowdStrike''s tscon operation remains a separate blocked
        attempt. Do not promote a specification or blocked attempt into another successful field event.'
