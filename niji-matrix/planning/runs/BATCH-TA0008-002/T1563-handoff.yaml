  relationship_refs: []
  decisions:
  - object_ref: REF-000370
    action: reuse
    reason: Linux Yama text explicitly identifies ptrace-enabled SSH session hijacking and its access-control conditions.
  - object_ref: REF-000179
    action: reuse_for_boundary_only
    reason: UNC3886 report describes redirection of incoming SSH connections to a rogue server for credential capture; it
      is not proof of existing-session control.
  - object_ref: MIT-000102
    action: extend_application_if_channel_child_accepted
    reason: Its least cross-process access and Yama measure directly constrains client-process attachment, but it does not
      cover ControlMaster socket sharing or RDS session-connect rights.
  - object_ref: DET-000094
    action: do_not_reuse
    reason: Detects replay of remote gateway token/session state and risk-context reentry, not controller changes inside an
      existing SSH transport or Windows RDS session.
  - object_ref: NJA-000071
    action: do_not_reuse
    reason: Token lifecycle and gateway sign-in data cannot implement channel creation or RDS same-LogonID client transitions.
