  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: 父级与两子项分别回答定义、痕迹差异、相邻边界、具体场景、控制与审计前提及残余证据；RDP 两种控制端模式由独立分析覆盖。正式编写须把实验、规范、野外报告的证明层级逐段保持，不能用 MAZE/CrowdStrike 支撑 SSH
        的特定机理。
      en: Parent and both child proposals cover definition, trace differential, adjacent boundaries, scenarios, control and
        audit prerequisites, and residual evidence. Separate analytics cover the two RDP controller modes. Canonical writing
        must preserve the different proof levels of specification, experiment, and field reporting, and must not use MAZE
        or CrowdStrike to support the specific SSH mechanism.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses:
    - library_lookup
    - URL_duplicate_search
    - YAML_parse_check
  limitations:
    paragraphs:
    - zh: 现有 SSH 证据为 OpenSSH 原始规范、内核权限文档和 iSSHD/SSH-Jack 技术研究，足以说明旧认证传输增通道的技术可行性与可观察点，但未找到公开的逐会话野外入侵证据。因此本轮不建立 SSH 成功 CASE，也不把
        Matrix.org 代理转发或 UNC3886 新 SSH 流重定向叙述代入。ControlMaster 新建的是同一传输内的新逻辑通道，不是原 PTY 的键盘接管；若主评审要求字段级野外案例，应延期这个子项。
      en: The SSH evidence consists of primary OpenSSH specifications, kernel access-control documentation, and iSSHD or SSH-Jack
        technical research. It establishes feasibility and observable points for adding a channel to an old authenticated
        transport, but no published per-session field intrusion chain was found. No successful SSH case should be created,
        and neither Matrix.org agent forwarding nor UNC3886 redirection of new incoming SSH traffic may be substituted. ControlMaster
        opens a new logical channel on the same transport rather than taking the keyboard of the original PTY. If primary
        review requires field incident evidence, defer this child.
    - zh: RDS 的规范文档说明连接/远程控制所需权限、命令能力和事件字段，不证明任何特定攻击。Korznikov 提供受控演示，Mandiant 在 MAZE 响应综述中报告成功 tscon 劫持，CrowdStrike 报告则明确区分被阻断的
        tscon 尝试与成功的 shadow 接管；后者还给出该事件未提示用户的具体策略条件。两份野外来源均未公开完整 4778/4779、原/新控制端和每个目标结果的日志链，所以 Analytic 的关联模式是可实施的防守设计，不是事件原文。
      en: RDS specifications establish required rights, command capabilities, and event fields, not an attack in any particular
        environment. Korznikov provides a controlled demonstration. Mandiant's MAZE response synthesis reports successful
        tscon hijacking, while CrowdStrike expressly separates a blocked tscon attempt from successful shadow control under
        a no-consent policy in that event. Neither field source publishes a complete 4778 or 4779, old and new controller,
        and per-result log chain, so analytic correlation is an implementable defender design rather than a quotation of case
        telemetry.
  rejected_mechanisms:
  - mechanism_ref: NM-DO
    reason_zh: 未见独立载荷或会话内容数据遮蔽；SSH 加密是服务固有属性而非该劫持新变量
    reason_en: No separate payload or session-content data obscuration is established; SSH encryption is an inherent service
      property
    not this takeover variable: null
  - mechanism_ref: NM-BT
    reason_zh: 合法服务工具外观可出现但独立“行为透明”机理缺额外因果证据，与本轮已支持的来源/身份特征差异重复
    reason_en: Legitimate service-tool appearance may occur, but a separate behavioral-transparency mechanism lacks independent
      causal evidence beyond the supported origin and identity differential
  open_questions:
  - zh: 主 Agent 是否接受 SSH 同一认证 transport 上的新逻辑通道作为 T1563 的“既有会话”而非 T1021？建议以 connection_id 与新 userauth 有无为硬边界。
    en: Does primary review accept a new logical channel on the same authenticated SSH transport as T1563's existing session
      rather than T1021? Use connection_id and fresh userauth as hard boundaries.
  - zh: 能否取得 SSH-Jack 原始演示和一个野外事件的原连接、新通道与目标结果链，以将通道项从技术可行性提升到事件级证据？
    en: Can the original SSH-Jack demonstration and a field incident provide original connection, new channel, and destination-result
      linkage, raising the channel child from technical feasibility to incident-level evidence?
  - zh: RDS 影子控制的成功事件号及字段需在目标 Windows 构建上实测；未经本地确认不得把 4778/4779 用作 shadow 必经事件。
    en: Validate shadow success event IDs and fields on the deployed Windows build; do not treat 4778 or 4779 as necessary
      shadow events without local validation.
