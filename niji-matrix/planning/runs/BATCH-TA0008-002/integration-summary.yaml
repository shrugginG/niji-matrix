review_notes_zh: 五项 ATT&CK 19.1 父候选分别完成准入与原生分类：T1080、T1210、T1534、T1563 经 adapt 建立四个新 NJT 和四项 NJS；T1091 经 retain 跨战术复用并逐字段整改
  NJT-0058 与两项既有 NJS。T1210 因六轴证据不足零子项，T1534 的反馈默认视图遗漏由 NJS-0111-001 拥有而零新子项。36 个新 REF、16 个 CLM、10 个 CASE、5 个 DET、8 个可实施 NJA
  与 4 个 MIT 经跨库查重；MIT-000053/036 和既有 T1091 来源与结论已按目标修订。固定基线、ESET/Microsoft/Proofpoint/Mandiant/CrowdStrike 证据均按可证范围使用，SSH
  增附通道无野外 CASE。矩阵/规划零错误零警告、查重零精确零待审、正文审计、12 项基础设施测试、89 项 Web 测试、API 零问题和五项 Bundle 均通过。正式对象保持 review，等待人工领域评审；TA0008 正式矩阵现完成
  7/9，剩余 T1021、T1550。
review_notes_en: Five ATT&CK 19.1 parents have independent admission and native taxonomy decisions. T1080, T1210, T1534, and
  T1563 were adapted as four new NJT with four new NJS; T1091 was retained by cross-tactic reuse and field-by-field redevelopment
  of NJT-0058 and its two existing children. T1210 has no child after six axes failed evidence gates, and T1534 adds none
  because NJS-0111-001 owns the feedback default-view omission. Thirty-six new REF, sixteen CLM, ten CASE, five DET, eight
  implementable NJA, and four MIT passed shared-library review; MIT-000053/036 and reused T1091 sources and claims were revised
  for their targets. Fixed-baseline and ESET, Microsoft, Proofpoint, Mandiant, and CrowdStrike evidence is limited to supported
  conclusions, with no field Case for SSH channel addition. Matrix and planning have zero errors or warnings, duplicate audit
  has zero exact or unresolved candidates, prose audit, twelve infrastructure tests, eighty-nine Web tests, zero API issues,
  and five bundles pass. Formal objects remain in review pending human domain review; TA0008 has 7 of 9 formal parents complete,
  with T1021 and T1550 remaining.
