schema_version: 1.0.0
type: batch-taxonomy-breadth-review
batch_ref: BATCH-TA0008-002
baseline:
  domain: enterprise-attack
  version: '19.1'
candidates:
- source_attack_id: T1080
  fixed_attack_inventory:
    count: 0
    ids: []
    represented_dimensions:
    - shared_file_body_change
    - application_or_document_replacement
    - navigation_entry_substitution
  breadth_trigger: ordinary
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - key: B8B-T1080-AXIS-CONTENT-ID
    disposition: propose
    zh: 原共享对象的选择身份保持，内容或执行语义改变；ESET 两份第一手研究提供跨文档与软件格式实例，需历史版本与消费者实际结果的专用防御。
    en: Original shared-object selection identity persists while content or execution semantics change; two first-hand ESET
      studies provide document and software instances and call for version-to-consumer defense.
  - key: B8B-T1080-AXIS-NAV-BINDING
    disposition: propose_with_primary_review
    zh: 导航入口解析目标被替换而真实目录仍可显示；DirSharePivot 一手客户取证支持异机消费者本地执行，原作者复现代码支持机制；仍缺逐机日志和样本谱系，需主 Agent 复审。
    en: A navigation entry resolves to a substituted target while the real directory can still appear; DirSharePivot first-hand
      customer forensics supports local execution by other consumers, and the author's reproduction supports the mechanism;
      per-device logs and sample lineage remain unpublished and need primary review.
  - key: B8B-T1080-AXIS-BENIGN-HANDOFF
    disposition: parent_core_not_separate_child
    zh: 恶意动作后继续打开原文档或目录有助隐藏影响，但 InvisiMole 与 DirSharePivot 均可发生，跨两个变量而不构成独立互斥兄弟项。
    en: Opening the original document or directory after the malicious action can reduce visible disruption, but it crosses
      the InvisiMole and DirSharePivot patterns and is not a mutually bounded sibling child.
  - key: B8B-T1080-AXIS-DELAY
    disposition: evidence_deferred
    zh: 污染与被害者打开天然存在时间差；公开证据未证明攻击者稳定控制目标打开时点或以分时降低告警，因此不得单设低频子项。
    en: Taint and victim open naturally have a time gap; sources do not show stable attacker control over open time or alert
      dilution, so no low-frequency child is warranted.
  - key: B8B-T1080-AXIS-REPO
    disposition: evidence_deferred
    zh: ATT&CK 父页包含内部代码仓库，但本轮缺乏具体“被控仓库对象改写→另一内部消费者执行”一手案例和独立观察差异，仓库仅保留在父级媒介范围。
    en: ATT&CK includes internal code repositories, but this pass lacks a first-hand repository-object-change to another internal
      consumer execution case and a separate observation effect; repositories remain parent media only.
  - key: B8B-T1080-AXIS-FORMAT
    disposition: not_stealth_distinct
    zh: Office、二进制、LNK、SMB 和 SaaS 是载体或实现；不能直接按文件格式、协议或平台生成 NJS。
    en: Office documents, binaries, LNK, SMB, and SaaS are media or implementations and do not directly define NJS.
  second_pass_required: false
  second_pass_completed: false
  formal_new_niji_children:
  - NJS-0148-001
  - NJS-0148-002
  reused_niji_child_count: 0
  primary_breadth_gap_explanation: 'Two independently evidenced shared-object variables: in-place semantic change and navigation-target
    substitution.'
- source_attack_id: T1091
  fixed_attack_inventory:
    count: 0
    ids: []
    represented_dimensions: []
  breadth_trigger: ordinary
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - axis: recipient-visible trigger camouflage
    resolution: established NJS-0058-001
    support: Microsoft Raspberry Robin LNK and ESET USBStealer altered browsing entry
  - axis: attachment-triggered source seeding
    resolution: established NJS-0058-002 with qualified low-touch claim
    support: Check Point LitterDrifter WMI drive enumeration and ESET USBStealer insertion callback
  - axis: modification-time and hidden-attribute masking
    resolution: adjacent NJT-0112 and NJT-0111
    support: ESET USBStealer direct sample analysis
  - axis: segmented bidirectional shuttle commands
    resolution: adjacent later C2 or physical exfiltration
    support: ESET USBStealer command and return-file behavior beyond first B installation
  - axis: USB device model or AUTORUN versus LNK
    resolution: not-stealth-distinct implementation
    support: ATT&CK parent and Microsoft implementation contrast
  second_pass_required: false
  second_pass_completed: false
  formal_new_niji_children: []
  reused_niji_child_count: 2
  primary_breadth_gap_explanation: Two existing Niji-native media variables are reused across tactics; no new NJS is allocated.
- source_attack_id: T1210
  fixed_attack_inventory:
    count: 0
    ids: []
    represented_dimensions: []
  breadth_trigger: ordinary
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - axis: unauthenticated-service-transition
    resolution: parent-core
    attacker_control: choose an accessible vulnerable service and triggering request
    trace_change: request and service result can lack a normal user-session or management-command edge
    defender_observation: identity-only lateral rules can miss the cross-host lineage
    reason: Condition is part of parent exploitation, not a stable mutually distinct child; some remote exploits require authentication
      or emit anonymous logons.
  - axis: version-conditioned-target-selection
    resolution: evidence-deferred
    attacker_control: scan or infer exact vulnerable build before exploitation
    trace_change: might reduce failed exploit packets, but existing reports measure only discovery or target selection
    defender_observation: potential reduction in failed attempts not demonstrated
    reason: ESET InvisiMole and Microsoft NotPetya show discovery/conditions, not a deliberate low-noise gating result or
      child-specific defense.
  - axis: fallback-after-credential-failure
    resolution: parent-core
    attacker_control: choose exploit when credential and management paths fail
    trace_change: alternate path changes activity type; NotPetya remains noisy and concurrent
    defender_observation: separate authentication and exploit telemetry needed at parent level
    reason: Functional fallback is documented, but not stealth optimization or a distinct stable evasion partition.
  - axis: low-telemetry-internal-service
    resolution: evidence-deferred
    attacker_control: select an internal appliance or service with limited endpoint logging
    trace_change: target result would be less locally recorded
    defender_observation: would require independent network/service monitoring
    reason: No event-specific T1210 source reviewed proves intentional telemetry-sparse target selection; overlaps NJS-0054-002
      in public-edge context but cannot import it.
  - axis: service-process-origin-attribution
    resolution: parent-core
    attacker_control: select exploit payload and resulting target process context
    trace_change: target action may be attributed to the vulnerable service
    defender_observation: requires source request to target process lineage
    reason: Common exploit outcome and no independent evidence of intentional attribution manipulation here; later injection
      or masquerade belongs to adjacent techniques.
  - axis: fault-suppressed-exploit
    resolution: evidence-deferred
    attacker_control: design reliable exploit that avoids a service crash
    trace_change: removal of service-fault signal
    defender_observation: fault-based analytic would lose one corroborator
    reason: No comparative incident or experiment establishes this variable for a lateral remote-service exploit.
  second_pass_required: false
  second_pass_completed: false
  formal_new_niji_children: []
  reused_niji_child_count: 0
  primary_breadth_gap_explanation: Six candidate axes fail independent trace-change or evidence gates; exploit type and CVE
    are not children.
- source_attack_id: T1534
  fixed_attack_inventory:
    count: 0
    ids: []
    represented_dimensions: []
  breadth_trigger: ordinary
  coverage_resolutions: []
  candidate_stealth_axes_examined:
  - key: B8B-T1534-AXIS-INTERNAL-SENDER
    disposition: parent-core
    zh: 真实内部发件身份及关系信任是 T1534 基本因果前提，不能只改名形成子项。
    en: A genuine internal sender and relationship trust are the basic T1534 causal premise and cannot become a child by renaming.
  - key: B8B-T1534-AXIS-FEEDBACK-ROUTE
    disposition: adjacent-technique
    zh: Proofpoint 的按主题回复归档确有稳定观察差异，但该变量已由 NJS-0111-001 默认视图枚举遗漏覆盖；在 T1534 中作为可共现机理和跨技术关系，不再按横向场景新建 NJS。
    en: Proofpoint subject-matched reply archiving has a stable observation differential, but NJS-0111-001 Default-View Enumeration
      Omission already covers that variable. Treat it as a co-occurring mechanism and cross-technique relation in T1534 rather
      than creating a new NJS by lateral context.
  - key: B8B-T1534-AXIS-THREAD-CONTEXT
    disposition: evidence-deferred
    zh: Microsoft 报告仅证实利用近期线程选择收件者；Proofpoint 的线程劫持例子涉及外部供应商财务欺诈，没有同组织横向结果。暂不创建线程寄生子项。
    en: Microsoft confirms selecting recipients using recent threads only. Proofpoint's thread-hijacking example concerns
      cross-organization vendor fraud without a same-organization lateral outcome. Defer a thread-parasitic child.
  - key: B8B-T1534-AXIS-COLLAB-WORKFLOW
    disposition: parent-core
    zh: SharePoint 分享外观可能增强可信度，但该案的内部来源与第二主体失陷链不证明平台包装本身产生独立于发件身份的观察差异。
    en: A SharePoint sharing wrapper may strengthen credibility, but the internal-source-to-second-account chain does not
      isolate a defender-observation effect independent of sender identity.
  - key: B8B-T1534-AXIS-MEDIUM-OR-ATTACHMENT
    disposition: not-stealth-distinct
    zh: 邮件、聊天、链接、附件和产品名称是载体；不能据此划分 NJS。
    en: Email, chat, links, attachments, and product names are carriers, not NJS partitions.
  - key: B8B-T1534-AXIS-BROAD-MAILBOX-RULE
    disposition: adjacent-technique
    zh: 与内部诱导无条件匹配关系的广泛邮箱隐藏或事后删除可归 NJT-0112 或一般邮箱持久化；只有活动相关反馈路径才构成本项子变量。
    en: Broad mailbox hiding or after-the-fact deletion without a condition linked to the internal lure belongs under NJT-0112
      or general mailbox persistence; only campaign-linked feedback routing qualifies as this child variable.
  second_pass_required: false
  second_pass_completed: false
  formal_new_niji_children: []
  reused_niji_child_count: 0
  primary_breadth_gap_explanation: Feedback default-view omission is already owned by NJS-0111-001; internal sender trust
    is parent core.
- source_attack_id: T1563
  fixed_attack_inventory:
    count: 2
    ids:
    - T1563.001
    - T1563.002
    represented_dimensions:
    - SSH_authenticated_transport_or_agent_implementation
    - RDS_existing_interactive_session_implementation
  breadth_trigger: ordinary
  coverage_resolutions:
  - attack_id: T1563.001
    resolution: niji-variable-candidate
    note:
      zh: SSH 名称不是子项；真正可迁移变量是他人已认证传输上新增通道。ATT&CK 页同时包含代理转发签名新连接，此部分按 T1550/T1021 边界排除。
      en: SSH is not the child; the transferable variable is a new channel on another principal's authenticated transport.
        Agent forwarding that signs a new connection is excluded to the T1550 or T1021 boundary despite sharing ATT&CK's SSH
        page.
  - attack_id: T1563.002
    resolution: niji-variable-candidate
    note:
      zh: RDP 名称不是子项；真正变量是既有交互会话的控制端集合改变。tscon 迁移与 shadow 并存均属此变量，分别产生断开/重连或控制请求痕迹。
      en: RDP is not the child; the variable is a changed controller set for an existing interactive session. tscon transfer
        and parallel shadowing both express it, with different disconnect or reconnect versus control-request traces.
  candidate_stealth_axes_examined:
  - key: B8B-T1563-AXIS-TRANSPORT-CHANNEL
    disposition: propose_formal_with_primary_review
    zh: 已认证传输承载新逻辑通道，目标无新传输握手或同连接的新用户认证；OpenSSH 原始规范和 iSSHD/SSH-Jack 技术研究支持可实施，但目前未找到能证明此具体链的野外事件，正式置信度不得高于 medium。
    en: An authenticated transport carries a new logical channel without a fresh transport handshake or new user authentication
      on that connection. OpenSSH primary specifications and iSSHD/SSH-Jack technical research support feasibility, but no
      field incident proving this precise chain was found, so formal confidence must not exceed medium.
  - key: B8B-T1563-AXIS-INTERACTIVE-CONTROLLER
    disposition: propose_formal
    zh: 既有交互会话由新端独占迁移或并行控制，原用户上下文持续；Microsoft 功能文档、Korznikov 实验、Mandiant MAZE 成功野外事件与 CrowdStrike 成功 shadow 野外事件支持。tscon 与
      shadow 不分子项，因为两者可顺序出现且均改变同一会话控制者集合；检测分析仍须分支。
    en: An existing interactive session is exclusively transferred or controlled in parallel while the original user context
      persists. Microsoft functional documentation, Korznikov's demonstration, Mandiant's successful MAZE field observation,
      and CrowdStrike's successful shadow field observation support it. tscon and shadow are not separate children because
      they can occur sequentially and both change the same session controller set; analytics still need separate branches.
  - key: B8B-T1563-AXIS-AGENT-SIGNING
    disposition: adjacent_technique
    zh: 代理为新 SSH 连接签名改变的是认证材料可用性，不是已有传输或交互会话的控制者；Matrix.org 事件直接支持该边界。
    en: An agent signing for a new SSH connection changes authentication-material availability, not the controller of an existing
      transport or interactive session; the Matrix.org incident directly supports this boundary.
  - key: B8B-T1563-AXIS-PTY-OR-TMUX
    disposition: evidence_deferred
    zh: 附着同机 tmux/screen 或直接 PTY 可能是交互接管，但需证明其为跨内部主机的原远程服务会话及目标结果，不能凭本地复用终端自动列入。
    en: Attaching to local tmux, screen, or a PTY may be interactive takeover, but it needs evidence of the original cross-host
      remote-service session and destination result; local terminal reuse alone does not qualify.
  - key: B8B-T1563-AXIS-NO-CONSENT
    disposition: parent_core_not_child
    zh: 是否无需提示取决于权限和策略；CrowdStrike 具体事件有此效果，但它不是跨实现稳定的独立会话所有权变量。
    en: Promptless operation depends on rights and policy. CrowdStrike's specific event had that effect, but it is not an
      independent cross-implementation session-ownership variable.
  - key: B8B-T1563-AXIS-LIFETIME
    disposition: evidence_deferred
    zh: 长时间保留的传输或断开桌面增加暴露窗口，但现有证据未证明攻击者稳定控制保留时长以改变检测痕迹，故不单设时序 NJS。
    en: Long-lived transports or disconnected desktops increase exposure, but current evidence does not show stable attacker
      control over lifetime as a distinct trace-shaping variable, so no timing child is proposed.
  second_pass_required: false
  second_pass_completed: false
  formal_new_niji_children:
  - NJS-0151-001
  - NJS-0151-002
  reused_niji_child_count: 0
  primary_breadth_gap_explanation: Channel addition and interactive-session controller rebinding are distinct state variables,
    not SSH and RDP labels.
