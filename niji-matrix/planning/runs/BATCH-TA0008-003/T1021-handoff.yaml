research:
  taxonomy_breadth_review:
    attack_subtechnique_count: 8
    attack_subtechnique_ids: [T1021.001, T1021.002, T1021.003, T1021.004, T1021.005, T1021.006, T1021.007, T1021.008]
    represented_dimensions:
      - zh: 交互桌面与图形控制：RDP、VNC
        en: interactive desktop and graphical control using RDP and VNC
      - zh: 文件/共享与 RPC 对象调用：SMB/管理共享、DCOM
        en: file or share access and RPC object invocation using SMB or administrative shares and DCOM
      - zh: 命令 shell 与远程管理：SSH、WinRM
        en: command shell and remote management using SSH and WinRM
      - zh: 云控制面服务与来宾直连：Cloud Services、Direct Cloud VM Connections
        en: cloud control-plane services and direct guest connection
    breadth_trigger: explicit-coverage-table-and-second-pass
    coverage_resolutions:
      - attack_id: T1021.001
        implementation: Remote Desktop Protocol
        resolution: niji-variable-candidate
        represented_dimension: interactive desktop, remote-interactive logon, reconnectable session and source host
        conclusion:
          zh: >-
            支持角色贴合和中继来源两个跨协议变量；RDP 名称不成为 NJS，重连他人既有桌面归 NJT-0151。
          en: >-
            Supports role conformity and intermediary origin as cross-protocol variables. RDP does not become a NJS, and takeover of another principal's desktop belongs to NJT-0151.
      - attack_id: T1021.002
        implementation: SMB/Windows Admin Shares
        resolution: parent-core
        represented_dimension: network logon, share access and optional service or named-pipe follow-on
        conclusion:
          zh: >-
            连接和共享访问属父级；文件到达归 NJT-0130，服务执行归相邻执行对象。管理路径贴合可覆盖该实现。
          en: >-
            Connection and share access belong to the parent, file arrival to NJT-0130, and service execution to adjacent execution objects. Management-path conformity can cover the implementation.
      - attack_id: T1021.003
        implementation: Distributed Component Object Model
        resolution: parent-core
        represented_dimension: authenticated RPC/DCOM activation and target object or process result
        conclusion:
          zh: 非交互调用是实现形态，连接—动作分离由父级分析覆盖，DCOM 或对象类不构成变量
          en: noninteractive invocation is an implementation form covered by parent connection-to-action analysis, not a variable defined by DCOM or object class
      - attack_id: T1021.004
        implementation: SSH
        resolution: niji-variable-candidate
        represented_dimension: shell, command, transfer, forwarding, ProxyJump and multiplexing
        conclusion:
          zh: >-
            ProxyJump/转发为中继变量提供宽度；ControlMaster/ControlPersist 只证明复用功能，攻击证据和兄弟边界不足而延期。
          en: >-
            ProxyJump and forwarding provide breadth for the intermediary variable. ControlMaster and ControlPersist establish capability only and remain deferred.
      - attack_id: T1021.005
        implementation: Virtual Network Computing
        resolution: not-stealth-distinct
        represented_dimension: graphical remote control with product-specific authentication/session logs
        conclusion:
          zh: 图形协议进入父级，未发现 VNC 独有稳定变量或专用防御差异
          en: graphical protocol enters the parent with no VNC-specific stable variable or dedicated defense difference
      - attack_id: T1021.006
        implementation: Windows Remote Management
        resolution: parent-core
        represented_dimension: authenticated remote shell or command invocation
        conclusion:
          zh: 远程 shell 和命令由父级 session—action 谱系覆盖，命令内容归执行对象
          en: remote shell and command are covered by parent session-to-action lineage while command semantics belong to execution objects
      - attack_id: T1021.007
        implementation: Cloud Services
        resolution: adjacent-technique
        represented_dimension: SaaS/IaaS control-plane authentication and administration
        conclusion:
          zh: 有效身份归 NJT-0061，云管理命令与控制面—来宾痕迹差归 NJT-0064；只作宽度背景
          en: valid identity belongs to NJT-0061 and cloud command or control-plane-to-guest trace difference to NJT-0064; breadth context only
      - attack_id: T1021.008
        implementation: Direct Cloud VM Connections
        resolution: parent-core-and-adjacent
        represented_dimension: direct RDP/SSH to guest, provider broker or bastion, guest-management planes
        conclusion:
          zh: >-
            真正新建来宾 RDP/SSH 属父级，云堡垒可支持中继变量；Run Command、container exec、ESXi GuestOps 分别归 NJT-0064/0066/0068。
          en: >-
            A real fresh guest RDP or SSH session belongs to the parent and a cloud bastion can support the intermediary variable. Run Command, container exec, and ESXi GuestOps belong to NJT-0064, NJT-0066, and NJT-0068.
    first_pass_completed: true
    first_pass_conclusion:
      zh: >-
        八项按协议、交互形态和控制面划分，证明父项宽度并提供两条跨实现线索；协议差异本身不满足稳定变量、观察差异和专用防御门禁。
      en: >-
        The eight items partition protocol, interaction form, and control plane, establishing parent breadth and two cross-implementation leads. Protocol differences themselves fail stable-variable, observation-difference, and dedicated-defense gates.
    candidate_stealth_axes_examined:
      - axis: role-conforming-management-path
        pass: second
        resolution: formal
        attacker_control: chooses principal, source asset role, destination role, service and time matching an approved relationship
        trace_change: malicious session fields fall within ordinary management tuples
        defender_effect: protocol, account and source allow rules lose discrimination
        residual: source-compromise evidence, target action, fan-out, concurrency and ticket scope
        defense_difference: approved relationship remains scored with target action rather than allowlisted
        evidence_keys: [B8C-T1021-REF-MS-ATTACK-MODEL, B8C-T1021-REF-MANDIANT-FIN11, REF-000278]
      - axis: intermediary-origin-indirection
        pass: second
        resolution: formal
        attacker_control: inserts a controlled intermediary between original controller and target-visible origin
        trace_change: target records jump host or localhost while origin exists on a separate ingress
        defender_effect: target-only analysis loses original controller
        residual: relay process/configuration, bilateral flows, destination session and action
        defense_difference: reconstructs a four-segment controller-relay-target chain and governs jump paths
        evidence_keys: [B8C-T1021-REF-MANDIANT-RDP-TUNNEL, B8C-T1021-REF-MS-EXCHANGE-TUNNEL, REF-000614]
      - axis: connection-to-target-action-separation
        pass: first-and-second
        resolution: parent-core
        reason:
          zh: >-
            所有父级实例均需关联，未证明攻击者可独立控制且形成兄弟边界；按 broker 或交互性拆分会回到实现分类。
          en: >-
            Every parent instance needs the join, with no independently controlled sibling boundary; broker or interactivity partitions reproduce implementation taxonomy.
      - axis: cloud-control-plane-to-guest-separation
        pass: first-and-second
        resolution: adjacent-technique
        reason:
          zh: NJS-0064-001 已拥有该变量，容器与 ESXi 命令也有专用父项
          en: NJS-0064-001 owns the variable and container or ESXi commands have dedicated parents
      - axis: authenticated-session-lifetime-amortization
        pass: second
        resolution: evidence-deferred
        reason:
          zh: >-
            SSH 复用和 RDP 重连证明功能，但没有攻击事件证明攻击者延长自己会话以减少认证痕迹及独立防御；他人状态复用进入 NJT-0055/NJT-0151。
          en: >-
            SSH multiplexing and RDP reconnect establish capability, but no incident proves attacker-selected longer self-owned sessions reducing authentication traces with distinct defense; another principal's state belongs to NJT-0055 or NJT-0151.
      - axis: low-interaction-or-one-shot-command-density
        pass: second
        resolution: evidence-deferred
        reason:
          zh: 一次命令可能减少动作，也可能只是任务需要，缺比较事件与独立控制
          en: one-shot command can reduce action count or merely reflect task need, with no comparative incident or independent control
      - axis: time-spaced-remote-connections
        pass: second
        resolution: evidence-deferred
        reason:
          zh: 缺攻击者选择间隔和阈值变化的结论级证据
          en: lacks conclusion-level evidence of attacker-selected intervals and threshold effects
      - axis: service-broker-origin-disguise
        pass: second
        resolution: parent-core-and-adjacent
        reason:
          zh: >-
            service host/WMI provider/sshd 派生动作是实现语义；服务执行、进程伪装和目标谱系由父级或相邻执行对象覆盖。
          en: >-
            Action descended from service host, WMI provider, or sshd is implementation semantics; service execution, process disguise, and target lineage belong to the parent or adjacent execution objects.
    second_pass_required: true
    second_pass_completed: true
    proposed_niji_child_count: 2
    breadth_gap_explained: true
    breadth_gap_explanation:
      zh: >-
        ATT&CK 8 项回答远程连接通过什么协议或控制面实现；Niji 2 项回答攻击者控制什么稳定变量改变痕迹与观察。六个传统协议收敛为父级实现，Cloud Services 管理命令主要归既有云对象，Direct Cloud VM 依实际连接进入父级或相邻对象。第二遍审查六条非协议轴，只有管理关系贴合和中继来源间接化通过稳定性、痕迹变化、兄弟边界、结论证据和专用防御门禁。
      en: >-
        ATT&CK's eight items answer which protocol or control plane implements a connection; Niji's two answer which stable attacker-controlled variable changes traces and observation. Six traditional protocols converge as parent implementations. Cloud-service commands largely belong to existing cloud objects, while Direct Cloud VM enters the parent or adjacent objects by actual connection. The second pass examined six nonprotocol axes, and only management-relationship conformity and intermediary-origin indirection pass stability, trace-change, sibling-boundary, conclusion-evidence, and dedicated-defense gates.
    reviewer_notes:
      zh: >-
        主 Agent 应重点复核角色贴合证据是否足够独立于 NJT-0055/NJS-0061-001，以及中继项与 NJS-0168-002 的批准域对边界。
      en: >-
        Primary review should focus on whether role-conformity evidence is sufficiently independent from NJT-0055/NJS-0061-001 and whether the intermediary child's approved-domain-pair boundary remains distinct from NJS-0168-002.
  evidence_coverage:
