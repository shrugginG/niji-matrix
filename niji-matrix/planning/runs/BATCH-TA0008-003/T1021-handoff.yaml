  claims:
    - key: B8C-T1021-CLM-ADMISSION
      proposition:
        zh: >-
          攻击者能以可接受身份在已受害网络内新建远程连接并控制另一目标；认证、目标会话和目标动作必须分级证明。
        en: >-
          An adversary can create a fresh remote connection with accepted identity inside a compromised network and control another target; authentication, destination session, and target action require separate evidence tiers.
      evidence_mode: direct-report-plus-fixed-baseline
      confidence: high
      evidence_keys: [B8C-T1021-REF-ATTACK19, B8C-T1021-REF-MS-ATTACK-MODEL, REF-000289, B8C-T1021-REF-MANDIANT-RDP-BASELINE]
    - key: B8C-T1021-CLM-ROLE-CONFORMITY
      proposition:
        zh: >-
          主体、来源角色、目标角色和服务贴合管理关系时，恶意会话可与正常运维局部同形；来源受控与会话内动作仍可区分。
        en: >-
          When principal, source role, destination role, and service conform to a management relationship, a malicious session can locally resemble normal operations, while source compromise and in-session action remain discriminating.
      evidence_mode: field-observation-plus-controlled-assessment
      confidence: medium
      evidence_keys: [B8C-T1021-REF-MS-ATTACK-MODEL, B8C-T1021-REF-MANDIANT-FIN11, REF-000278, B8C-T1021-REF-MANDIANT-RDP-BASELINE]
    - key: B8C-T1021-CLM-INTERMEDIARY
      proposition:
        zh: >-
          受控中继可让目标只记录跳板或 localhost，拆分原始控制端和目标会话；relay 状态与双侧 flow 可恢复谱系。
        en: >-
          A controlled intermediary can make a destination record only a jump host or localhost, splitting original controller and destination session; relay state and bilateral flows can restore lineage.
      evidence_mode: direct-field-report-plus-technical-semantics
      confidence: medium
      evidence_keys: [B8C-T1021-REF-MANDIANT-RDP-TUNNEL, B8C-T1021-REF-MS-EXCHANGE-TUNNEL, REF-000377, REF-000614]
    - key: B8C-T1021-CLM-DETECTION
      proposition:
        zh: >-
          检测需连接远程认证、session/logon ID、资产角色和目标动作；管理路径匹配不永久白名单，中继还需双侧 flow 与配置。
        en: >-
          Detection joins remote authentication, session or logon ID, asset roles, and target action; management-path matches are not permanently allowlisted and intermediary paths require bilateral flows and configuration.
      evidence_mode: official-schema-plus-operational-guidance
      confidence: high
      evidence_keys: [REF-000377, REF-000598, REF-000604, B8C-T1021-REF-MS-MDE-LOGON, B8C-T1021-REF-MANDIANT-RDP-BASELINE, B8C-T1021-REF-MANDIANT-RDP-TUNNEL]
    - key: B8C-T1021-CLM-PARENT-SPLIT
      proposition:
        zh: >-
          T1021 内部源—目标—服务—动作结果与 NJT-0055 外部首入/重入风险情境有不同结果门和防御数据，需新父项。
        en: >-
          T1021 internal source-to-destination-to-service-to-action results differ in result gate and defense data from NJT-0055 external first-entry or reentry risk context and require a new parent.
      evidence_mode: taxonomy-and-boundary-analysis
      confidence: high
      evidence_keys: [B8C-T1021-REF-ATTACK19, B8C-T1021-REF-MS-ATTACK-MODEL, B8C-T1021-REF-MANDIANT-RDP-BASELINE, B8C-T1021-REF-MS-MDE-LOGON]
  cases:
    - key: B8C-T1021-CASE-PARINACOTA
      name:
        zh: PARINACOTA 多路径服务器横向移动
        en: PARINACOTA Multi-Path Server Lateral Movement
      actor_or_campaign: PARINACOTA
      event_type: field-incident
      observed_facts:
        zh: >-
          Microsoft 记录攻击者扫描 RDP/SMB/SSH，以窃取凭据 RDP 登录多台服务器，并以 WMI、PsExec 和 netsh 启用另一服务器 RDP，最终部署勒索软件。
        en: >-
          Microsoft records scanning RDP, SMB, and SSH, using stolen credentials for RDP to multiple servers, enabling RDP on another server through WMI, PsExec, and netsh, and eventually deploying ransomware.
      cannot_claim:
        zh: 不证明每条 RDP 会话角色贴合或中继来源
        en: does not establish role conformity or intermediary origin for every RDP session
      evidence_keys: [B8C-T1021-REF-MS-ATTACK-MODEL]
      confidence: high
    - key: B8C-T1021-CASE-FIN11-REDTEAM
      name:
        zh: Mandiant OT 红队管理路径混合观察
        en: Mandiant OT Red-Team Management-Path Blending Observation
      actor_or_campaign: Mandiant authorized FIN11-emulation red team
      event_type: authorized-assessment
      observed_facts:
        zh: >-
          红队在真实环境使用受害凭据、远程管理、RDP、SMB、远程服务创建和 WMI 到达八台 OT 服务器；报告判断合法用户也使用这些路径，因而可融入后台流量。
        en: >-
          The red team used victim credentials, remote management, RDP, SMB, remote service creation, and WMI to reach eight OT servers in a real environment; the report assessed that paths also used by legitimate users could blend with background traffic.
      cannot_claim:
        zh: 不能写成 FIN11 实际入侵、通用失效率或协议子项
        en: not an actual FIN11 intrusion universal failure rate or protocol child
      evidence_keys: [B8C-T1021-REF-MANDIANT-FIN11]
      confidence: high
    - key: B8C-T1021-CASE-JUMP-RELAY
      name:
        zh: 管理跳板 RDP 转发与 Exchange 攻击隧道
        en: Administrative Jump-Host RDP Forwarding and Exchange Attack Tunneling
      actor_or_campaign: FireEye-observed threat actors and Microsoft-observed Exchange attackers
      event_type: bounded-cross-report-pattern
      observed_facts:
        zh: >-
          Mandiant 记录管理跳板 netsh portproxy 转发 RDP；Microsoft 独立记录 Exchange 攻击者以 Plink/SSH 隧道和窃取凭据进行 RDP。共同支持受控中继承载新会话。
        en: >-
          Mandiant records RDP forwarded through administrative jump hosts using netsh portproxy; Microsoft independently records Exchange attackers using Plink or SSH tunnels and stolen credentials for RDP. Together they support a controlled intermediary carrying a fresh session.
      cannot_claim:
        zh: >-
          两份报告不是同一行动，未公开一致 PID、双侧 flow、目标 LogonId 和命令；只合并模式，不合并归因或完整遥测。
        en: >-
          The reports are not one operation and do not expose common PID, bilateral flows, destination LogonId, and command; combine pattern only, not attribution or complete telemetry.
      evidence_keys: [B8C-T1021-REF-MANDIANT-RDP-TUNNEL, B8C-T1021-REF-MS-EXCHANGE-TUNNEL]
      confidence: medium
