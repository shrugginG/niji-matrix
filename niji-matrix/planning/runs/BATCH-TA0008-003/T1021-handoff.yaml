    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级和两个子项覆盖定义、匿迹特性、边界、场景、攻防模型、机理、证据和限制；防御按关系—动作和中继双侧谱系分开，不按协议换名。
      en: >-
        Parent and both children cover definition, stealth characteristics, boundaries, scenarios, attacker and defender models, mechanism, evidence, and limitations; defense separates relationship-to-action from bilateral relay lineage rather than renaming protocols.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [YAML serialization, safe_load validation, duplicate temporary-key scan, flow-scalar syntax scan]
  limitations:
    paragraphs:
      - zh: >-
          固定 ATT&CK 19.1 只用于父行为和八项实现宽度；滚动页修改日期及后续检测策略不可冒充 19.1。覆盖依据冻结 STIX/versions/v19，不翻译子项为正式 NJS。
        en: >-
          Fixed ATT&CK 19.1 is used only for parent behavior and eight-item breadth. Rolling-page dates and later detections are not 19.1 evidence. Coverage follows frozen STIX and versions/v19 without translating children into NJS.
      - zh: >-
          角色贴合的证据由 Microsoft 跨事件现场观察和 Mandiant 授权红队构成，没有逐会话风险分或随机对照，故为 medium。贴合也可偶然发生，必须同时有来源受控/攻击链和未授权目标动作。Windows 证据最丰富，其他协议需本地验证。
        en: >-
          Role-conformity evidence combines Microsoft cross-incident field observation and a Mandiant authorized red team, without per-session risk scores or randomized comparison, keeping confidence medium. Conformity may be accidental and requires source compromise or attack-chain evidence plus unauthorized target action. Windows evidence is strongest and other protocols need local validation.
      - zh: >-
          中继项有两份独立现场报告和稳定技术语义，但未公开完整原始控制端—入口 flow—relay PID/config—出口 flow—目标 LogonId—动作链。合法堡垒高度同形；无批准路径和双侧遥测时只能判来源不可解析。
        en: >-
          The intermediary child has two independent field reports and stable technical semantics but no complete public controller-to-ingress-to-relay-PID-or-config-to-egress-to-destination-LogonId-to-action chain. Legitimate bastions are highly isomorphic; without approved paths and bilateral telemetry only unresolved origin can be concluded.
  rejected_mechanisms:
    - mechanism_ref: NM-BT
      reason:
        zh: 原生远程服务并非默认不可见；角色贴合改变可区分性归 NM-FD，中继分散谱系归 NM-ST
        en: native remote services are not invisible by default; role conformity changes distinguishability under NM-FD and relay disperses lineage under NM-ST
    - mechanism_ref: NM-DO
      reason:
        zh: SSH/RDP 加密是协议常态，未证明攻击者为 T1021 控制内容形态
        en: SSH or RDP encryption is ordinary protocol behavior without attacker-controlled content-form evidence for T1021
