    unsupported_or_deferred:
      - Protocol names, ports, vendors and cloud providers are not Niji children.
      - Long self-owned session lifetime, low interaction density and time spacing lack conclusion-level incident evidence.
      - Cloud control-plane-to-guest separation is owned by NJS-0064-001 and execution parents.
      - Target service-process ancestry alone does not prove source disguise or stealth intent.
      - A baseline match, administrator account, jump-host source, localhost source or native tool alone proves neither child.
