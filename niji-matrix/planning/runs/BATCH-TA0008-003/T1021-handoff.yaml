candidate:
  source_type: attack
  source_attack_id: T1021
  name:
    zh: 远程服务
    en: Remote Services
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          固定 ATT&CK Enterprise 19.1 将 T1021 作为横向移动父项，并以 RDP、SMB/管理共享、DCOM、SSH、VNC、WinRM、云服务和云虚拟机直连八个子项展示实现宽度。Microsoft 和 Mandiant 的现场研究直接记录攻击者使用这些原生服务在已受害网络内连接其他主机。保留“以已可用身份或权限建立新远程服务连接并取得另一目标的可控交互”这一核心；Niji 不继承协议子项，而把范围收窄到正常认证和授权路径接受的新连接、目标会话或动作结果，以及有证据支持的匿迹变量，故建议 adapt。
        en: >-
          Fixed ATT&CK Enterprise 19.1 defines T1021 as a Lateral Movement parent and uses eight children covering RDP, SMB or administrative shares, DCOM, SSH, VNC, WinRM, cloud services, and direct cloud-VM connections as implementation breadth. Microsoft and Mandiant field research directly records adversaries using native services to reach other systems inside compromised networks. Preserve the core of creating a fresh remote-service connection with already usable identity or authority and obtaining controllable interaction on another target. Niji does not inherit protocol children and narrows scope to a fresh connection accepted through ordinary authentication and authorization, a target session or action outcome, and evidence-supported stealth variables; adapt is recommended.
      - zh: >-
          T1210/NJT-0149 由漏洞触发目标控制，T1563/NJT-0151 接管他人已有传输或会话，T1078/NJT-0061 只拥有身份及认证状态，T1072/NJT-0078 拥有部署平台 job 到 agent 的受管执行链，T1570/NJT-0130 以文件到达为结果。云控制面、容器和 ESXi Guest Operations 命令执行分别由 NJT-0064、NJT-0066 和 NJT-0068 承担。T1021 只在另一系统或资源接受新远程连接并产生可验证交互时完成；协议可达、认证尝试、凭据存在或文件出现均不是替代证据。
        en: >-
          T1210/NJT-0149 gains target control through a vulnerability, T1563/NJT-0151 takes over another principal's existing transport or session, T1078/NJT-0061 owns identity and authentication state, T1072/NJT-0078 owns the managed job-to-agent execution chain, and T1570/NJT-0130 ends at file arrival. Cloud control-plane, container, and ESXi Guest Operations command execution belong to NJT-0064, NJT-0066, and NJT-0068. T1021 completes only when another system or resource accepts a fresh remote connection and yields verifiable interaction. Reachability, an authentication attempt, credential possession, or file presence is not substitute evidence.
cross_parent_reuse_review:
  njt_0055_decision: split
  confidence: high
  rationale:
    paragraphs:
      - zh: >-
          NJT-0055/T1133 的直接对象是通过外部 VPN、RDP、VDI 或远程管理网关建立首个入口或在处置后持续重入；两个子项改变新认证是否发生，以及来源地理、ASN、设备和时间与用户风险基线的距离。T1021 从既有组织内立足点出发，要求内部源、目标、服务、接受的连接和目标动作形成横向结果，并覆盖 SMB、DCOM、WinRM 等没有外部网关风险评分的服务面。起点、结果门、资产关系和主要检测数据不同，因此不能跨来源复用 NJT-0055。
        en: >-
          NJT-0055/T1133 directly concerns a first foothold or continuing reentry through an external VPN, RDP, VDI, or remote-management gateway. Its children change whether fresh authentication occurs and how closely geography, ASN, device, and time match a user's risk baseline. T1021 begins from an existing organizational foothold and requires an internal source, destination, service, accepted connection, and target action to form a lateral result, including SMB, DCOM, and WinRM surfaces without an external-gateway risk score. The starting condition, result gate, asset relationship, and primary detection data differ, so NJT-0055 should not be reused across source parents.
      - zh: >-
          “角色贴合管理路径”以主体、来源资产角色、目标角色、服务和后继动作的内部关系为变量，不复制 NJS-0055-002 的公网来源、设备和用户远程办公风险情境。“中继来源间接化”以目标所见来源与原始控制端之间出现受控中继为变量，也不等于同一风险情境。NJT-0055 的会话状态重放若发生，可与 T1021 共现但不会替代横向连接和目标结果。决议为父项 split，身份与会话控制对象按实际语义交叉引用。
        en: >-
          Role-Conforming Remote Administration Path uses the internal relationship among principal, source-asset role, destination role, service, and successor action and does not duplicate NJS-0055-002's public origin, device, and remote-work risk context. Intermediary-Origin Remote Session Indirection changes the relationship between the target-visible source and original controller through a controlled relay and is not the same risk context. NJT-0055 session-state replay may coexist with T1021 but does not replace the lateral connection and destination result. The decision is to split the parent while cross-referencing identity and session controls by actual semantics.
proposed_content:
  temporary_key: B8C-T1021-PARENT
  name:
    zh: 远程服务横向访问
    en: Remote-Service Lateral Access
  summary:
    zh: >-
      攻击者以已可用身份或权限在另一内部系统建立新的远程服务连接，并通过贴合管理路径或中继来源间接化降低会话与恶意目标动作的可区分性。
    en: >-
      An adversary uses already available identity or authority to create a fresh remote-service connection to another internal system and reduces the distinguishability of the session and malicious target action through management-path conformity or intermediary-origin indirection.
  aliases:
    - T1021
    - Remote Services
  definition_and_concept:
    paragraphs:
      - zh: >-
          远程服务横向访问是攻击者已控制组织内主体或工作负载后，以目标服务会接受的账户、密钥、票据或等价授权建立新的远程连接、登录或调用，并在另一主机、虚拟机或内部资源上取得交互、命令或可控操作结果。直接目标是跨越系统边界并获得另一目标的操作能力；服务端必须实际接受连接，目标端必须出现会话或动作结果。端口开放、握手、认证失败、凭据持有和远程文件到达分别只是暴露、尝试、前提或相邻结果。
        en: >-
          Remote-Service Lateral Access occurs after an adversary controls a principal or workload inside an organization and uses an account, key, ticket, or equivalent authority accepted by the destination service to create a fresh remote connection, logon, or invocation and obtain interaction, command capability, or another controlled operation on a different host, VM, or internal resource. The immediate objective is to cross a system boundary and gain operative capability on another target. The service must accept the connection, and a target session or action result must exist. An open port, handshake, failed authentication, credential possession, and remote file arrival are respectively exposure, attempt, prerequisite, or adjacent outcome.
      - zh: >-
          RDP、SMB、DCOM、SSH、VNC、WinRM 及云连接只是实现表面。Niji 固定“新建、正常认证和授权、另一目标、可验证结果”四要素，并进一步要求攻击者有意控制管理关系贴合度或连接来源间接化。交互桌面、命令通道、共享访问和远程对象调用可产生不同日志，但不会据此形成协议子技术；后继执行、文件传输、账户修改或影响按各自直接对象另记。
        en: >-
          RDP, SMB, DCOM, SSH, VNC, WinRM, and cloud connections are implementation surfaces. Niji fixes four elements: a fresh connection, ordinary authentication and authorization, another target, and a verifiable result. It additionally requires adversary control over management-relationship conformity or connection-origin indirection. Interactive desktops, command channels, share access, and remote object invocations can produce different logs without becoming protocol children. Subsequent execution, file transfer, account change, or impact remains under its own direct object.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          远程服务横向访问保留真实服务、成功认证和正常连接形态。攻击者若从承担管理职责的内部来源、使用有权主体并选择目标日常启用的服务，目标日志可能与帮助台、运维和自动化产生相同的登录类型、服务名称和网络方向；单凭成功登录或原生协议无法区分控制者。残余包括来源主机受控迹象、主体—来源—目标—服务关系新颖度、会话扇出、非预期目标动作、并发和变更授权。
        en: >-
          Remote-Service Lateral Access preserves a real service, successful authentication, and an ordinary connection form. When an adversary originates from an internal system with a management role, uses an entitled principal, and selects a service routinely used for that target, destination logs can share logon type, service name, and network direction with helpdesk, operations, and automation. A successful logon or native protocol alone does not distinguish the controller. Residual evidence includes source compromise, novelty in the principal-source-destination-service relationship, session fan-out, unexpected target actions, concurrency, and change authorization.
      - zh: >-
          攻击者还可让新连接经过受控跳板、端口转发或代理，使目标只记录中继或 localhost 来源，原始控制端停留在另一侧连接。会话因果被拆到原始来源、中继和目标三个观察面；目标会话仍存在，relay 进程、监听、配置、双侧流量和时间关系也保留。合法堡垒机、共享跳板和灾备通道具有相同表面，必须证明原始控制端、中继状态、目标连接和未授权结果。
        en: >-
          An adversary can route the fresh connection through a controlled jump host, port forward, or proxy so the destination records only the intermediary or localhost while the original controller remains on another connection. Session causality is divided across origin, intermediary, and destination. The target session remains, as do relay process, listener, configuration, bilateral flows, and timing. Authorized bastions, shared jump hosts, and recovery paths have the same surface, so classification requires the original controller, intermediary state, destination connection, and unauthorized result.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入必须证明攻击者已有内部控制点或身份材料，目标服务按正常认证和授权路径接受新连接或调用，另一目标产生可核查交互或动作，并且角色贴合或中继来源变量改变防守观察。合法帮助台、补丁、备份、管理员跳板、应急恢复、MSP 运维和云平台操作是强反例；需要结合 owner、工单、允许源、服务、目标范围、时段和实际动作排除。只有协议使用而没有攻击者控制和观察差异时，不进入正式匿迹范围。
        en: >-
          Inclusion requires an existing internal control point or identity material, a fresh connection or invocation accepted through ordinary authentication and authorization, a reviewable interaction or action on another target, and a role-conformity or intermediary-origin variable changing defender observation. Legitimate helpdesk, patching, backup, administrator jump hosts, emergency recovery, MSP operations, and cloud administration are strong counterexamples and require owner, ticket, allowed source, service, destination scope, time, and actual action for exclusion. Protocol use without adversary control and an observation difference does not enter formal stealth scope.
      - zh: >-
          NJT-0149 要求软件缺陷触发，NJT-0151 要求接管他人已有传输或会话，本项要求攻击者新建其控制的认证连接。NJT-0061 拥有身份材料和认证状态；本项拥有连接到另一目标动作的横向关系。NJT-0078 的 fleet job—agent 链、NJT-0130 的文件到达、NJT-0064/0066/0068 的云或虚拟化管理命令结果均不由本项吸收。中继若还建立批准图禁止的跨域桥接，可同时记录 NJS-0168-002；使用批准跳板但操作者未授权仍可仅满足本项中继子轴。
        en: >-
          NJT-0149 requires a flaw trigger and NJT-0151 takeover of another principal's existing transport or session; this subject requires a new authenticated connection controlled by the adversary. NJT-0061 owns identity material and authentication state, while this subject owns the lateral relationship from connection to action on another target. NJT-0078's fleet job-to-agent chain, NJT-0130's file arrival, and NJT-0064/NJT-0066/NJT-0068 cloud or virtualization command outcomes are not absorbed here. If an intermediary also creates a prohibited inter-domain bridge, NJS-0168-002 may coexist. An unauthorized controller using an approved jump path can satisfy only this subject's intermediary axis.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            攻击者从受害工作站或管理服务器以已取得域身份连接其他服务器，可建立 RDP 桌面、SMB 网络登录或 WinRM/WMI 调用，再执行发现、凭据访问或勒索准备。Microsoft 对 PARINACOTA 和另一宗勒索事件分别记录 RDP、SMB、WMI、PsExec 及域管理员跨设备 RDP；这些事件证明父行为和会话—结果链，但不证明每次连接都贴合正常管理基线。
          en: >-
            From a compromised workstation or management server, an adversary can use an acquired domain identity to reach other servers, create an RDP desktop, SMB network logon, or WinRM or WMI invocation, and then perform discovery, credential access, or ransomware preparation. Microsoft investigations of PARINACOTA and another ransomware intrusion record RDP, SMB, WMI, PsExec, and domain-administrator RDP between devices. These establish the parent behavior and session-to-result chain without showing every connection matched an ordinary management baseline.
        - zh: >-
            在受分段网络中，攻击者可先控制有允许路由的管理跳板，再经 netsh portproxy、Plink/SSH 转发或连锁 RDP 把新连接送到仅跳板可达的目标。Mandiant 记录管理跳板 RDP 转发，Microsoft 在 Exchange 攻击中观察到 Plink/SSH 隧道承载 RDP。中继建立与目标会话是两个可同时标注的阶段；本项只在目标接受新连接并出现可控动作时完成。
          en: >-
            In a segmented network, an adversary can control a management jump host with allowed routes and deliver a fresh connection to a destination reachable only from it through netsh portproxy, Plink or SSH forwarding, or chained RDP. Mandiant records RDP forwarding through administrative jump boxes, and Microsoft observed Plink or SSH tunnels carrying RDP during Exchange attacks. Relay establishment and destination session are concurrently recordable stages; this subject completes only when the target accepts the new connection and a controlled action follows.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者必须控制内部来源或使其发起连接，拥有目标服务接受的身份材料，知道地址、服务、权限和业务关系，并判断连接和目标动作是否成功。角色贴合还要求了解哪些来源资产、主体、服务、时段和目标组合被视为日常运维；中继间接化要求控制跳板、转发配置或代理并维持两侧路径。
            en: >-
              The adversary must control an internal source or cause it to connect, possess identity material accepted by the destination service, know address, service, authority, and business relationship, and determine whether connection and target action succeeded. Role conformity additionally requires knowledge of which source assets, principals, services, times, and destinations are treated as routine operations. Intermediation requires control of a jump host, forwarding configuration, or proxy and both paths.
          - zh: >-
              登录权、网络分段、目标 ACL、MFA、设备限制和 JIT 授权均可中断。过度 fan-out、首次访问高价值目标、不符合来源角色的连接、异常命令或主体并发会提高可见度。中继增加进程、配置和第二条流量链；任一侧被隔离即失败。选择原生服务的事实本身不证明主观匿迹意图。
            en: >-
              Logon rights, segmentation, destination ACLs, MFA, device restrictions, and JIT authorization can interrupt access. Broad fan-out, first access to a high-value target, source-role mismatch, unusual commands, or principal concurrency raises visibility. Intermediation adds a process, configuration, and second flow chain and fails if either side is isolated. Choosing a native service alone does not prove subjective stealth intent.
      defender_model:
        paragraphs:
          - zh: >-
              防守方需要连接身份认证、服务会话、源/目标资产和目标动作。Windows 可使用 DeviceLogonEvents 或 4624 的账户、LogonType、LogonId、RemoteIP/RemoteDeviceName，再连接 DeviceProcessEvents 的远程会话、SessionId、LogonID 和进程谱系；其他服务需将自身审计规范化为相同关系。资产清单提供来源/目标角色、允许服务、owner、管理路径和变更窗口。
            en: >-
              Defenders need to join identity authentication, service session, source and destination assets, and target action. Windows can use account, LogonType, LogonId, RemoteIP, and RemoteDeviceName from DeviceLogonEvents or event 4624, then join remote-session, SessionId, LogonID, and process lineage from DeviceProcessEvents. Other services normalize their audits to the same relationship. Asset inventory supplies source and destination roles, allowed services, owner, management paths, and change windows.
          - zh: >-
              中继分析还需要跳板进程/服务、监听、portproxy/隧道配置、入口与出口 socket/flow，以及目标登录来源。协议字段缺失、NAT、加密、动态地址、共用跳板、短保留期和云方不暴露来宾会话会打断谱系。没有目标动作只能确认连接，没有原始控制端与双侧 flow 只能确认目标看到中继来源，均不足以断言恶意横向完成。
            en: >-
              Relay analysis additionally needs jump-host process or service, listener, portproxy or tunnel configuration, inbound and outbound sockets or flows, and destination logon origin. Missing fields, NAT, encryption, dynamic addressing, shared jump hosts, short retention, and cloud providers not exposing guest sessions break lineage. Without target action only the connection is confirmed; without original controller and bilateral flows only an intermediary-looking origin is known. Neither proves malicious lateral completion.
  stealth_mechanisms:
    - mechanism_ref: NM-FD
      role: primary
      summary:
        zh: 角色贴合的原生管理关系包裹未授权远程会话
        en: A role-conforming native management relationship wraps an unauthorized remote session
      analysis:
        paragraphs:
          - zh: >-
              攻击者选择真实远程服务、有权主体和通常承担管理职责的内部来源，让主体、来源角色、目标角色、服务和时段落入常见关系。Microsoft 指出攻击者利用 SMB、WMI、WinRM 和 RDP 融入预期遥测；Mandiant OT 红队在实际环境使用 RDP、SMB 和远程执行服务，判断这些合法用户也使用的路径不易告警。单一登录区分度下降，形成特征伪装；来源受控、关系新颖度、扇出和目标动作仍可恢复差异。
            en: >-
              The adversary selects a real remote service, entitled principal, and internal source with a management role so principal, source role, destination role, service, and time fall inside a familiar relationship. Microsoft notes adversaries using SMB, WMI, WinRM, and RDP to blend with expected telemetry. Mandiant's OT red team used RDP, SMB, and remote-execution services in an actual environment and assessed that paths also used by legitimate users were unlikely to alert. One logon loses discrimination, producing Feature Disguise, while source compromise, relationship novelty, fan-out, and target action restore differences.
      evidence_keys:
        - B8C-T1021-REF-MS-ATTACK-MODEL
        - B8C-T1021-REF-MANDIANT-FIN11
        - REF-000278
        - B8C-T1021-REF-MANDIANT-RDP-BASELINE
      confidence: medium
    - mechanism_ref: NM-ST
      role: secondary
      summary:
        zh: 受控中继把原始控制端与目标会话来源拆到不同观察面
        en: A controlled intermediary separates the original controller from destination session origin across vantages
      analysis:
        paragraphs:
          - zh: >-
              攻击者让一侧连接在中继终止，另一侧由中继向目标建立新认证连接。目标日志看到中继或 localhost，原始来源只在入口侧可见；不连接 relay 状态、双侧 flow 和目标会话时，完整控制链被分散而形成时空释痕。Mandiant 的管理跳板 RDP 转发和 Microsoft 的 Plink/SSH 隧道 RDP 调查支持该链；portproxy、relay 进程、双侧流量和目标动作仍是残余。
            en: >-
              The adversary terminates one connection at an intermediary, which creates a fresh authenticated destination connection. Destination logs see the relay or localhost, while the original source remains visible only on ingress. Without joining relay state, bilateral flows, and the destination session, the control chain is dispersed, producing Spatiotemporal Trace Dilution. Mandiant's administrative-jump-host RDP forwarding and Microsoft's Plink or SSH tunnel investigation support the chain. Portproxy, relay process, bilateral flows, and target actions remain residual.
      evidence_keys:
        - B8C-T1021-REF-MANDIANT-RDP-TUNNEL
        - B8C-T1021-REF-MS-EXCHANGE-TUNNEL
        - REF-000377
        - REF-000614
      confidence: medium
  subtechnique_taxonomy:
    coverage: established
    proposed_child_count: 2
    narrative:
      paragraphs:
        - zh: >-
            建议两个 Niji 原生子项。角色贴合的远程管理路径以主体、来源资产角色、目标角色、服务和时段相对批准管理关系的贴合度为变量，连接直接到达目标并改变单条会话的正常外观。中继来源远程会话间接化要求原始控制端与目标之间存在受控中继，改变目标所见来源并把谱系分散到两侧连接。前者不要求中继，后者即使目标关系罕见也可成立；两者可共现但不能互替，分别需要关系—动作基线和双侧 relay—session 关联。
          en: >-
            Two Niji-native children are proposed. Role-Conforming Remote Administration Path uses conformity of principal, source-asset role, destination role, service, and time to an approved management relationship. Its connection reaches the target directly and changes the ordinary appearance of one session. Intermediary-Origin Remote Session Indirection requires a controlled intermediary and changes target-visible origin while dispersing lineage across two connections. The first needs no relay, and the second can exist even when the destination relationship is rare. They can coexist but do not substitute and require relationship-to-action baselining versus bilateral relay-to-session correlation.
        - zh: >-
            八个 ATT&CK 子项全部保留为规划宽度。协议、交互性、身份材料、端口和厂商不是匿迹变量；连接与目标动作分离属于父级检测，云控制面—来宾平面断裂由 NJS-0064-001 等相邻对象承担，使用已有会话状态或接管他人会话分别由 NJT-0055/NJT-0151 处理。长连接、低交互和分时连接因缺结论级事件与独立防御差异而延期。正式 2 项与 ATT&CK 8 项的数量差来自分类问题不同。
          en: >-
            All eight ATT&CK children remain planning breadth. Protocol, interactivity, authentication material, port, and vendor are not stealth variables. Connection-to-action separation is a parent detection problem; cloud control-plane-to-guest gaps belong to adjacent objects such as NJS-0064-001; existing session state and takeover of another session belong to NJT-0055 and NJT-0151. Long lifetime, low interaction, and time-spaced connections are deferred for lack of conclusion-level incidents and distinct defenses. The two formal children versus eight ATT&CK implementations reflects different classification questions.
proposed_subtechniques:
  - temporary_key: B8C-T1021-NJS-ROLE-PATH
    name:
      zh: 角色贴合的远程管理路径
      en: Role-Conforming Remote Administration Path
    summary:
      zh: >-
        攻击者让新远程连接的主体、来源资产角色、目标角色、服务和时段贴合既有管理关系，使未授权会话呈现为日常运维。
      en: >-
        An adversary aligns principal, source-asset role, destination role, service, and time of a fresh remote connection with an existing management relationship so the unauthorized session resembles routine operations.
    definition_and_concept:
      paragraphs:
        - zh: >-
            角色贴合的远程管理路径是攻击者在新建内部远程服务连接时，有意选择有权主体、承担管理或支持职能的来源资产、相应目标角色、日常启用的服务和常见时段，使完整连接落入批准或长期观察到的管理关系。稳定变量是当前连接与管理关系图之间的距离，而不是 RDP、SSH、SMB、WinRM、账户类型或跳板产品。
          en: >-
            Role-Conforming Remote Administration Path occurs when an adversary creating a fresh internal remote-service connection deliberately selects an entitled principal, a source asset with a management or support role, a corresponding destination role, a routinely enabled service, and a familiar time so the complete connection falls within an approved or historically observed management relationship. The stable variable is distance between the current connection and the management relationship graph, not RDP, SSH, SMB, WinRM, account type, or jump-host product.
        - zh: >-
            直接目的不是隐藏认证事件，而是让真实认证和服务会话具有日常运维解释。身份如何取得属于 Credential Access 或 NJT-0061；本项只有在连接被接受、目标产生可控动作，并且管理关系贴合降低会话局部可区分性时完成。若只有合法管理员按工单操作，或攻击者从非管理终端连接从未访问的目标，则不满足该变量。
          en: >-
            The immediate purpose is not to erase authentication but to give a real authentication and service session a routine operational explanation. Identity acquisition belongs to Credential Access or NJT-0061. This child completes only when the connection is accepted, a controlled target action occurs, and management-relationship conformity reduces local session distinctiveness. An authorized administrator acting under a ticket or an adversary connecting from a nonmanagement endpoint to a never-used destination does not satisfy the variable.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            角色贴合的远程管理路径让主体、源角色、目标角色、服务和时段同时处于允许范围，目标侧只见成功认证、常见登录类型和正常管理流向。依赖异常协议、非管理员来源、陌生目标或非工作时段的规则失去区分力；真实管理员同样产生这些事件，使单点告警置信度下降。
          en: >-
            Role-Conforming Remote Administration Path places principal, source role, destination role, service, and time inside allowed ranges, leaving the destination with successful authentication, a familiar logon type, and an ordinary management direction. Rules relying on an unusual protocol, nonadministrator source, unfamiliar destination, or off-hours activity lose discrimination. Real administrators produce the same events, lowering point-alert confidence.
        - zh: >-
            贴合不会使目标动作自动正常。来源端先前受控事件、同一主体并发、超出工单的目标集合、会话内命令或进程、访问量、权限变化和后继连接仍可揭示控制者。关系图过宽、共享管理员账户、资产角色陈旧或缺少目标动作遥测会增强匿迹；按主体和角色保存长期基线且不永久白名单，会限制效果。
          en: >-
            Conformity does not make target actions benign. Prior source compromise, principal concurrency, destinations beyond a ticket, commands or processes inside the session, access volume, authority change, and successor connections can expose the controller. Overbroad relationship graphs, shared administrator accounts, stale roles, or missing target-action telemetry strengthen the effect. Long baselines by principal and role, without permanent allowlisting, constrain it.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求攻击者可控的新连接至少贴合主体、来源角色、目标角色、服务和时段中的多个关系维度，且有本地基线或批准图证明这些维度通常被接受。一个管理员账户、管理子网或原生协议单独不足；合法帮助台、备份、部署、应急响应和轮班以 owner、工单、目标范围和动作排除。偶然从管理主机发起但没有关系选择或观察差异时，只保留父级。
          en: >-
            Inclusion requires an adversary-controlled fresh connection to align across multiple relationship dimensions among principal, source role, destination role, service, and time, with a local baseline or approved graph showing those dimensions are normally accepted. An administrator account, management subnet, or native protocol alone is insufficient. Legitimate helpdesk, backup, deployment, incident response, and shift work are excluded through owner, ticket, destination scope, and action. If an actor merely happens to originate from a management host without relationship selection or observation difference, retain only the parent.
        - zh: >-
            NJS-0061-001 和 NJS-0055-002 改变身份登录的来源网络、地理、设备、客户端和时间风险；本项改变内部远程服务的来源资产角色—目标角色—服务—动作关系。NJT-0078 的批准部署窗口包含正式 job/agent 事务，不是一般管理连接。经中继改变目标所见来源属于兄弟子项；共现时分别举证。
          en: >-
            NJS-0061-001 and NJS-0055-002 change identity-sign-in risk involving origin network, geography, device, client, and time. This child changes the internal remote-service relationship among source-asset role, destination role, service, and action. NJT-0078 approved deployment windows contain a formal job and agent transaction rather than an ordinary management connection. Changing target-visible origin through an intermediary belongs to the sibling and requires separate evidence when co-occurring.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              攻击者取得运维人员或服务主体后，从该主体日常使用的管理服务器向其负责目标建立 RDP、SSH 或 WinRM 连接，并在会话内执行超出工单的发现或控制。Microsoft 指出原生管理技术因合法用途和正常遥测提供掩护；Mandiant OT 红队使用环境已有 RDP、SMB 和远程执行服务时，判断其可融入后台流量。
            en: >-
              After acquiring an operator or service principal, an adversary can connect from the management server normally used by that principal to assigned destinations over RDP, SSH, or WinRM and perform discovery or control beyond the ticket. Microsoft notes that native management technologies provide cover through legitimate use and expected telemetry. Mandiant's OT red team assessed that RDP, SMB, and remote-execution services already present in the environment could blend with background traffic.
          - zh: >-
              Microsoft 另一勒索调查记录域管理员在设备间使用 RDP；DART 仍从首次连接多个服务器和异常来源发现活动。该事件说明变量边界：只要关系或动作有一维偏离，原生服务不会自动提供匿迹。
            en: >-
              Another Microsoft ransomware investigation records domain administrators using RDP between devices. DART still detected first-time connections to multiple servers and abnormal origins. The incident illustrates the variable's boundary: a native service provides no automatic stealth when one relationship or action dimension diverges.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需要有效身份、可用内部来源、目标服务权限和管理拓扑知识。它可从文档、登录历史、远程管理配置或已控主机观察主体通常管理哪些目标、使用何种服务和时段。共享管理服务器和长期高权账户降低成本；PAM/JIT、专用管理工作站、逐目标 ACL 和工单绑定提高成本。
              en: >-
                The adversary needs valid identity, a usable internal source, destination-service authority, and management-topology knowledge. Documentation, logon history, remote-management configuration, or a compromised host can reveal which destinations a principal manages, which service it uses, and when. Shared management servers and long-lived privileged accounts lower cost; PAM or JIT, dedicated administrative workstations, per-destination ACLs, and ticket binding raise it.
            - zh: >-
                攻击者必须保持表面贴合同时完成恶意动作。扩大目标、使用罕见工具、改变安全配置、产生大规模文件或命令扇出会破坏贴合；只登录无动作又不能完成横向目标。真实管理员并发会造成冲突和暴露。
              en: >-
                The adversary must complete malicious action while preserving surface conformity. Expanding destinations, using rare tools, changing security configuration, or producing broad file or command fan-out breaks conformity, while logon without action does not complete the lateral objective. Concurrent real administrator use creates conflict and exposure.
        defender_model:
          paragraphs:
            - zh: >-
                防守方维护主体—来源角色—目标角色—服务—时段—允许动作关系，并取得连接接受、session/logon ID 和目标动作。模型按主体与业务角色区分交互、网络和服务登录，基线覆盖轮班、月结和维护周期，并连接来源端风险。批准关系只能降低路径异常分，不能屏蔽会话内动作。
              en: >-
                Defenders maintain a principal-to-source-role-to-destination-role-to-service-to-time-to-allowed-action relationship and receive accepted-connection, session or logon ID, and target-action evidence. The model separates interactive, network, and service logons by principal and role, spans shift, month-end, and maintenance cycles, and joins source risk. An approved relationship only lowers path anomaly and cannot suppress in-session action.
            - zh: >-
                共享账户、DHCP/NAT、资产角色缺失和未记录应急运维会误报；没有稳定 session ID 时只能按主机、主体和受限时窗近似。工单是有期限替代解释，关闭后仍需确认实际目标和动作。
              en: >-
                Shared accounts, DHCP or NAT, missing asset roles, and undocumented emergency operations create false positives. Without a stable session ID, correlation is approximate by host, principal, and constrained window. A ticket is an expiring alternative explanation, and actual destinations and actions still require review after closure.
    stealth_mechanisms:
      - mechanism_ref: NM-FD
        role: primary
        summary:
          zh: 既有管理关系使恶意远程会话局部同形于正常运维
          en: An existing management relationship makes a malicious remote session locally resemble normal operations
        analysis:
          paragraphs:
            - zh: >-
                攻击者让真实身份从常用管理来源连接其通常负责的目标和服务，成功认证、登录类型与网络方向因此与正常运维相同。基于单一协议、管理员账户或允许网段的检测失去区分，形成特征伪装。Microsoft 的现场建模与 Mandiant 环境内红队直接支持混合效应；来源受控、关系图和目标动作仍可恢复差异，故为 medium。
              en: >-
                The adversary makes a real identity connect from its usual management source to a destination and service it normally administers, causing authentication, logon type, and network direction to match ordinary operations. Detection based on one protocol, administrator account, or allowed subnet loses discrimination, producing Feature Disguise. Microsoft's field modeling and Mandiant's in-environment red team directly support blending. Source compromise, the relationship graph, and target actions restore differences, so confidence is medium.
        evidence_keys:
          - B8C-T1021-REF-MS-ATTACK-MODEL
          - B8C-T1021-REF-MANDIANT-FIN11
          - REF-000278
          - B8C-T1021-REF-MANDIANT-RDP-BASELINE
        confidence: medium
    defense_difference:
      zh: >-
        父级关联任意已接受连接到目标动作；本子项即使路径符合批准关系也继续评估来源受控和会话内动作，避免把管理子网、管理员账户或原生协议永久白名单。
      en: >-
        The parent joins any accepted connection to target action. This child continues evaluating source compromise and in-session action even when the path matches an approved relationship, preventing permanent allowlisting of management subnets, administrator accounts, or native protocols.
    evidence_keys:
      - B8C-T1021-REF-MS-ATTACK-MODEL
      - B8C-T1021-REF-MANDIANT-FIN11
      - B8C-T1021-REF-MANDIANT-RDP-BASELINE
      - REF-000278
      - REF-000289
    limitations:
      paragraphs:
        - zh: >-
            Mandiant OT 证据是授权红队，Microsoft 的混合结论是跨事件观察，没有公开逐会话告警概率。公开材料集中于 Windows 与 RDP/SMB/WMI/WinRM；推广到 SSH、VNC 等服务时须重建本地关系和目标动作字段。
          en: >-
            Mandiant's OT evidence is an authorized red team and Microsoft's blending conclusion is cross-incident observation without per-session alert probabilities. Public material concentrates on Windows and RDP, SMB, WMI, and WinRM; SSH, VNC, and other services require rebuilt local relationships and target-action fields.
        - zh: >-
            基线相符不能证明攻击者研究并选择该路径；还需来源受控或攻击链证据及未授权目标结果。管理员跳板、共享账户和应急操作可能完全同形，缺 owner 和工单时只保持候选级。
          en: >-
            A baseline match does not prove adversary study or path selection. Source compromise or attack-chain evidence plus unauthorized target result is still required. Administrator jump hosts, shared accounts, and emergency operations can be isomorphic, so conclusions remain candidate-level without owner and ticket evidence.
  - temporary_key: B8C-T1021-NJS-INTERMEDIARY
    name:
      zh: 中继来源远程会话间接化
      en: Intermediary-Origin Remote Session Indirection
    summary:
      zh: >-
        攻击者通过受控跳板、转发器或代理新建目标远程会话，使目标只看到中继来源并把原始控制谱系拆到两条连接。
      en: >-
        An adversary creates a fresh destination remote session through a controlled jump host, forwarder, or proxy so the target sees only the intermediary origin and the original control lineage is divided across two connections.
    definition_and_concept:
      paragraphs:
        - zh: >-
            中继来源远程会话间接化是攻击者在原始控制端与内部目标之间控制中继节点或转发状态，让原始入口连接在中继终止，再由中继向目标服务建立一条新的、目标会接受的认证连接。稳定变量是原始控制端与目标所记录来源之间的间接层数和可连接性，而不是 Plink、netsh、ProxyJump、RDP 或 SSH 名称。
          en: >-
            Intermediary-Origin Remote Session Indirection occurs when an adversary controls a relay node or forwarding state between original controller and internal destination, terminates the ingress connection at the relay, and creates from it a fresh authenticated connection accepted by the destination service. The stable variable is the number and joinability of intermediary layers between original controller and target-recorded origin, not Plink, netsh, ProxyJump, RDP, or SSH.
        - zh: >-
            本子项拥有目标远程会话的来源间接化。建立隧道、端口转发或网络桥可按 T1090、NJT-0168 或其他网络对象另记；没有目标接受的新远程服务连接及可控结果，本子项不完成。沿他人既有认证传输增加通道属于 NJS-0151-001，ProxyJump 或转发端口上另行认证的新连接按本项处理。
          en: >-
            This child owns origin indirection of the destination remote session. Tunnel, port-forward, or network-bridge establishment can be recorded separately under T1090, NJT-0168, or another network object. Without a fresh destination-accepted remote-service connection and controlled result, this child does not complete. Adding a channel to another principal's existing authenticated transport belongs to NJS-0151-001, while ProxyJump or a separately authenticated fresh connection over a forwarded port follows this child.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            中继来源远程会话间接化让目标服务把 RemoteIP、来源主机或等价字段归给跳板、代理或 localhost，原始控制端只出现在中继入口。目标单独看会话时，中继可能是批准管理源，原始端点的风险和位置被遮蔽；防守方需跨主机、接口或提供方连接两条会话。
          en: >-
            Intermediary-Origin Remote Session Indirection causes the destination service to attribute RemoteIP, source host, or equivalent fields to a jump host, proxy, or localhost, while the original controller appears only on relay ingress. Viewed only from the destination, the intermediary may be an approved management source and the original endpoint's risk and location are hidden. Defenders must join two sessions across hosts, interfaces, or providers.
        - zh: >-
            中继不会消除证据。relay binary、服务、命令与配置，portproxy 注册表，监听 socket，入口/出口 flow，账户、目标 session ID 和会话内动作仍可关联；工具改名不改变双侧流量。合法堡垒机、远程支持和灾备通道同形，只有证明未授权控制者、中继和目标动作才成立。
          en: >-
            The intermediary does not erase evidence. Relay binary, service, command and configuration, portproxy registry state, listener, ingress and egress flows, account, destination session ID, and in-session actions remain joinable; renaming does not change bilateral traffic. Legitimate bastions, remote support, and recovery paths are isomorphic, so classification requires an unauthorized controller, relay, and target action.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入要求识别原始控制端、中继实例、由中继发起且目标接受的新连接以及目标可控结果，并证明目标所见来源不同于原始控制端。只发现隧道进程、监听端口、目标来自跳板的登录或两条近时独立流量均不充分。批准跳板须按 owner、原始来源、允许目标、服务、用途和期限核验。
          en: >-
            Inclusion requires identifying original controller, relay instance, a fresh destination-accepted connection originating from the relay, and controlled target result, while proving target-visible origin differs from the controller. A tunnel process, listener, destination logon from a jump host, or two close independent flows is insufficient. Approved jump hosts require owner, original source, allowed destination, service, purpose, and expiry validation.
        - zh: >-
            中继若连接批准图禁止的安全域，可并记 NJS-0168-002；若路径本来允许但操作者未授权，只需本子项。复用他人既有认证传输归 NJS-0151-001；使用窃取 token/票据另行认证归对应 T1550 并可共现。公网首次入口归 NJT-0055，本项起于既有内部立足点。
          en: >-
            If the relay connects security domains prohibited by the approved graph, NJS-0168-002 may coexist. If the path is allowed but controller unauthorized, only this child is needed. Reusing another principal's existing transport belongs to NJS-0151-001; fresh authentication with a stolen token or ticket belongs to the corresponding T1550 object and may coexist. A first public-network entry belongs to NJT-0055; this child begins from an internal foothold.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              威胁主体控制管理跳板后，可用 netsh portproxy 在任意监听端口接收先前受害系统连接，再转发到分段目标的 RDP。Mandiant 记录此类行为并指出可能出现 loopback 来源；目标 RDP 会话仍以攻击者凭据新建，区别于接管已有管理员会话。
            en: >-
              After controlling an administrative jump host, a threat actor can use netsh portproxy to accept a connection from a previously compromised system on an arbitrary listener and forward it to a segmented target's RDP service. Mandiant records this behavior and notes possible loopback origin. The destination RDP session remains freshly created with adversary-held credentials, unlike takeover of an existing administrator session.
          - zh: >-
              Microsoft 在 Exchange 攻击中观察攻击者用 Plink/SSH 建立加密转发并以窃取凭据通过 RDP 访问其他主机，认为该组合减少部署后门的需要。事件支持中继与目标会话共现，但未公开入口 flow、relay PID、目标 LogonId 和命令的完整连接，置信度保持中等。
            en: >-
              Microsoft observed Exchange attackers building encrypted forwarding through Plink or SSH and using stolen credentials to reach other hosts over RDP, assessing that the combination reduced the need for backdoors. The incident supports relay and target-session co-occurrence but does not expose a complete join among ingress flow, relay PID, destination LogonId, and command, keeping confidence medium.
      threat_model:
        attacker_model:
          paragraphs:
            - zh: >-
                攻击者需控制可到达原始来源和目标的中继，能创建监听、转发或代理状态，并有目标服务接受的身份材料。它须维持中继进程、两侧路径和凭据，知道跳板允许目标。应用控制、禁止配置写入、额外设备证明或任一侧隔离会失败。
              en: >-
                The adversary needs control of an intermediary reachable from origin and destination, authority to create listener, forwarding, or proxy state, and identity material accepted by the destination. It must maintain the relay process, both paths, and credentials and know allowed destinations. Application control, denied configuration writes, additional device proof, or isolation of either side breaks the path.
            - zh: >-
                中继隐藏原始来源但增加可关联节点和状态。高容量交互、长期双向字节比例、异常监听、portproxy 变更、非批准 peer、跳板非典型进程或同一账户从多个中继出现会提高可见度，形成匿名性与额外痕迹的权衡。
              en: >-
                Intermediation hides original origin but adds a joinable node and state. High-volume interaction, long-lived bilateral byte ratios, unusual listeners, portproxy changes, unapproved peers, atypical jump-host processes, or one account from several relays raises visibility, creating a tradeoff between anonymity and additional artifacts.
        defender_model:
          paragraphs:
            - zh: >-
                防守方维护批准 jump/relay 清单及原始来源—中继—目标路径，采集进程/服务、hash、命令、listener、portproxy/隧道、主体、双侧 socket/flow 和目标认证。按 relay instance、时间、端口、字节比例和协议指纹配对入口与出口，再连接目标 session/logon ID 和动作。
              en: >-
                Defenders maintain approved jump or relay inventory and origin-to-relay-to-destination paths and collect process or service, hash, command, listener, portproxy or tunnel, principal, bilateral sockets or flows, and destination authentication. They pair ingress and egress by relay instance, time, ports, byte ratio, and protocol fingerprint, then join destination session or logon ID and action.
            - zh: >-
                加密无需解密，但缺进程/socket 归因时只能靠时序和容量。共用堡垒、NAT、第三方 MSP 和动态端口降低唯一性；目标记录 localhost 时尤其需要 relay 证据。无双侧日志或原始来源保留不足时，只能报告 relay exposure 或 origin unresolved。
              en: >-
                Encryption need not be broken, but without process or socket attribution only timing and volume remain. Shared bastions, NAT, third-party MSPs, and dynamic ports reduce uniqueness; localhost origin especially requires relay evidence. Without bilateral logs or sufficient origin retention, only relay exposure or unresolved origin can be reported.
    stealth_mechanisms:
      - mechanism_ref: NM-ST
        role: primary
        summary:
          zh: 两条远程连接把原始控制端与目标所见来源分散到不同节点
          en: Two remote connections distribute original controller and destination-visible origin across different nodes
        analysis:
          paragraphs:
            - zh: >-
                攻击者让原始连接在中继结束，并从中继建立目标接受的新连接，使控制端、转发状态和目标动作分别出现在不同观察面。目标只见跳板或 localhost，单点调查难以还原完整链，形成时空释痕。Mandiant 与 Microsoft 直接支持跳板、转发和 RDP 共现；公开日志未完整提供全部配对字段，故为 medium。relay 配置、双侧 flow、目标 session 和动作仍能恢复谱系。
              en: >-
                The adversary terminates the original connection at an intermediary and creates a fresh destination-accepted connection, placing controller, forwarding state, and target action on different vantages. The destination sees only jump host or localhost, making a point investigation unable to reconstruct the full chain and producing Spatiotemporal Trace Dilution. Mandiant and Microsoft directly support co-occurring jump host, forwarding, and RDP. Public logs omit complete pairing fields, so confidence is medium. Relay configuration, bilateral flows, destination session, and action restore lineage.
        evidence_keys:
          - B8C-T1021-REF-MANDIANT-RDP-TUNNEL
          - B8C-T1021-REF-MS-EXCHANGE-TUNNEL
          - REF-000377
          - REF-000614
        confidence: medium
    defense_difference:
      zh: >-
        父级与角色贴合子项关联一条连接到目标动作；本项额外重建原始控制端—中继入口—中继出口—目标会话四段链，并核验 relay 配置、双侧 flow 和批准路径。
      en: >-
        The parent and role-conformity child join one connection to target action. This child additionally reconstructs original controller to relay ingress to relay egress to destination session and validates relay configuration, bilateral flows, and approved path.
    evidence_keys:
      - B8C-T1021-REF-MANDIANT-RDP-TUNNEL
      - B8C-T1021-REF-MS-EXCHANGE-TUNNEL
      - REF-000377
      - REF-000604
      - REF-000614
    limitations:
      paragraphs:
        - zh: >-
            强事件证据集中在 Windows RDP、Plink/SSH 和 netsh portproxy。OpenSSH ProxyJump 只证明新连接经跳板和 TCP 转发的语义，不证明恶意使用；推广到 VNC、WinRM 或云堡垒需重新验证来源、认证边和 relay 遥测。
          en: >-
            Strong incident evidence concentrates on Windows RDP, Plink or SSH, and netsh portproxy. OpenSSH ProxyJump establishes fresh connection and TCP-forwarding semantics but not malicious use. VNC, WinRM, or cloud bastions require renewed origin, authentication-edge, and relay-telemetry validation.
        - zh: >-
            多跳本身不是恶意，组织可能强制经过堡垒机。没有原始控制端、未授权 relay 使用和目标动作，不得从 localhost 或跳板来源反推攻击者；若同时跨越禁止域，应与 NJS-0168-002 分别记录。
          en: >-
            Multihop access is not malicious and may be mandatory. Without original controller, unauthorized relay use, and target action, localhost or jump-host origin cannot imply an adversary. If prohibited domains are also crossed, record NJS-0168-002 separately.
defense_candidates:
  detection_strategies:
    - key: B8C-T1021-DET-SESSION-ACTION
      name:
        zh: 内部远程服务连接—会话—目标动作谱系
        en: Internal Remote-Service Connection-to-Session-to-Target-Action Lineage
      objective:
        zh: >-
          关联已接受的内部远程认证、目标会话和首个目标动作；即使批准管理关系成立也继续检查来源受控证据，并对中继路径重建原始控制端到目标的双连接谱系。
        en: >-
          Join accepted internal remote authentication to destination session and first target action, continue checking source compromise even when an approved management relationship matches, and reconstruct the two-connection lineage from original controller to destination for intermediary paths.
      split_or_reuse: create
      reason:
        zh: >-
          DET-000053/NJA-000027 判断身份和入口操作者，DET-000094/NJA-000071 判断外部会话状态重放与风险情境，均没有内部主体—来源角色—目标—服务—动作关系或 relay 双侧会话。DET-000191/NJA-000214 只在 relay 造成禁止域间桥接时成立，不能覆盖批准跳板被未授权操作者借用。
        en: >-
          DET-000053/NJA-000027 assesses identity and entry operator, while DET-000094/NJA-000071 assesses external session-state replay and risk context. Neither owns the internal principal-to-source-role-to-destination-to-service-to-action relationship or bilateral relay sessions. DET-000191/NJA-000214 applies only to a prohibited inter-domain bridge and cannot cover an approved jump path used by an unauthorized controller.
      evidence_keys:
        - B8C-T1021-REF-MS-ATTACK-MODEL
        - B8C-T1021-REF-MANDIANT-RDP-BASELINE
        - B8C-T1021-REF-MANDIANT-RDP-TUNNEL
        - REF-000377
        - REF-000598
        - REF-000604
        - B8C-T1021-REF-MS-MDE-LOGON
  detection_analytics:
    - key: B8C-T1021-NJA-RELATIONSHIP-ACTION
      strategy_key: B8C-T1021-DET-SESSION-ACTION
      name:
        zh: 远程管理关系与会话内动作关联
        en: Remote Management Relationship and In-Session Action Correlation
      logic:
        zh: >-
          将远程认证规范为 timestamp、principal、source_device/source_role、destination_device/destination_role、service、authentication_method、logon_type、session_or_logon_id 和 outcome。仅在服务接受时生成 accepted_connection；按 session/logon ID 连接目标进程、命令、资源、网络和权限结果，缺稳定 ID 时以同一主体、目标、服务和受限时窗近似并降置信度。将连接与批准关系图和九十日历史比较，但 approved_match 只降低路径异常分。若来源已有攻击链证据或动作超出 owner、工单、目标或正常命令，输出 unauthorized_target_action；路径多维贴合且攻击者控制与目标动作均成立时输出 role_conforming_control。只有认证无动作时保持 accepted_connection。
        en: >-
          Normalize remote authentication into timestamp, principal, source device and role, destination device and role, service, authentication method, logon type, session or logon ID, and outcome. Emit accepted_connection only when the service accepts it. Join destination process, command, resource, network, and authority outcome by session or logon ID; where unavailable, approximate with the same principal, destination, service, and constrained window and lower confidence. Compare the connection to an approved relationship graph and ninety-day history, but approved_match only lowers path anomaly. Emit unauthorized_target_action when the source has attack-chain evidence or action exceeds owner, ticket, destination, or normal commands. Emit role_conforming_control when multiple path dimensions match while adversary control and target action are established. Authentication without action remains accepted_connection.
      data_requirements:
        - source_type: remote-service-authentication-session
          name:
            zh: 远程服务认证与会话
            en: Remote-Service Authentication and Session
          channel: null
          required_fields: [event.timestamp, principal.id, source.device_id, source.ip, destination.device_id, service.id, authentication.method, logon.type, session_or_logon.id, outcome]
        - source_type: destination-session-action
          name:
            zh: 目标会话动作
            en: Destination Session Action
          channel: Endpoint process resource network and service audit
          required_fields: [event.timestamp, destination.device_id, principal.id, session_or_logon.id, process_or_action.id, parent_or_service.id, command_or_resource, outcome]
        - source_type: management-relationship-inventory
          name:
            zh: 管理关系、资产角色与授权
            en: Management Relationship Asset Role and Authorization
          channel: CMDB PAM change management and service policy
          required_fields: [principal_or_role.id, source_role, destination_role, allowed_service, allowed_action, owner.id, ticket.id, valid_from, valid_until]
        - source_type: source-compromise-context
          name:
            zh: 来源主机受控上下文
            en: Source Host Compromise Context
          channel: Endpoint identity and incident graph
          required_fields: [event.timestamp, source.device_id, principal.id, evidence.type, incident.id, confidence]
      observables:
        - zh: >-
            新连接与目标会话及首个进程、命令或资源动作共享 session/logon 标识。
          en: >-
            A fresh connection shares a session or logon identifier with the first destination process, command, or resource action.
        - zh: >-
            路径符合批准关系，但来源已有受控证据或动作超出工单、目标或正常命令。
          en: >-
            The path matches an approved relationship while the source has compromise evidence or action exceeds ticket, destination, or normal-command scope.
        - zh: >-
            同一主体短时连接异常数量的目标，或从角色不允许的来源发起服务会话。
          en: >-
            One principal reaches an unusual number of destinations in a short period or starts a service session from a source not permitted for its role.
      correlation:
        window:
          zh: >-
            覆盖同一 session 全寿命及断开后四小时；无 session ID 时使用按服务调优的十五分钟候选窗。关系基线至少九十日并覆盖维护、轮班和月结周期。
          en: >-
            Cover the full session lifetime and four hours after disconnect. Without session ID use a service-tuned fifteen-minute candidate window. Retain at least ninety days for relationship baselines spanning maintenance, shifts, and month-end.
        dimensions: [principal.id, source.device_id, source.role, destination.device_id, destination.role, service.id, session_or_logon.id, process_or_action.id, ticket.id, incident.id, time]
      false_positives:
        - zh: 经批准帮助台、备份、补丁、部署、排障、事件响应、轮班交接和 MSP 运维
          en: approved helpdesk backup patching deployment troubleshooting incident response shift handoff and MSP operations
        - zh: 资产角色或工单同步延迟
          en: asset-role or ticket synchronization delay
      blind_spots:
        - zh: 服务不记录来源或 session ID，目标动作由共享 broker/service identity 承载，来源无传感器，或云方不公开来宾关联
          en: service omits origin or session ID destination action runs under shared broker identity source lacks sensor or cloud provider exposes no guest correlation
        - zh: 真实管理主机和真实管理员均被控制且动作完全落入批准范围
          en: real management host and real administrator are controlled and actions stay within approved scope
      tuning_guidance:
        paragraphs:
          - zh: >-
              按主体/角色、来源资产组、目标角色、服务、登录类型和时段建模，不用全组织单阈值或端口规则。批准关系、管理子网和管理员账户不能永久白名单，只减少路径异常；目标动作、来源风险、并发和 fan-out 仍评分。例外绑定 owner、工单、精确目标/动作和到期，紧急操作可事后授权但保留原始事件。
            en: >-
              Model by principal or role, source asset group, destination role, service, logon type, and time rather than one enterprise threshold or port rule. Approved relationships, management subnets, and administrator accounts never receive permanent allowlisting and only reduce path anomaly; target action, source risk, concurrency, and fan-out remain scored. Bind exceptions to owner, ticket, exact destination or action, and expiry, permitting retrospective emergency authorization while retaining raw events.
      evidence_keys: [B8C-T1021-REF-MS-ATTACK-MODEL, B8C-T1021-REF-MANDIANT-RDP-BASELINE, REF-000289, REF-000377, REF-000598, B8C-T1021-REF-MS-MDE-LOGON]
    - key: B8C-T1021-NJA-INTERMEDIARY
      strategy_key: B8C-T1021-DET-SESSION-ACTION
      name:
        zh: 中继双侧流到目标远程会话关联
        en: Relay Bilateral Flow to Destination Remote Session Correlation
      logic:
        zh: >-
          从目标接受连接的 target_visible_source、principal、service 和 session/logon ID 出发，将来源解析为 relay device。采集 relay 的 listener、进程/服务、command/config、portproxy/ProxyJump/tunnel 状态和 socket，生成 relay_instance_id；把入口与到目标的出口 flow 按时间、端口、寿命、字节/包比例和协议指纹配对，再反查 original_controller 并连接目标动作。四段均成立且不符合批准 jump-path owner、原始来源、目标、服务和期限时输出 intermediary_origin_control；只有 relay 配置输出 relay_exposure，只有目标来自跳板输出 origin_unresolved。
        en: >-
          Begin with target_visible_source, principal, service, and session or logon ID of an accepted destination connection and resolve it to a relay device. Collect listener, process or service, command or configuration, portproxy, ProxyJump or tunnel state, and sockets and generate relay_instance_id. Pair ingress and destination-bound egress by time, ports, lifetime, byte or packet ratio, and protocol fingerprint, trace ingress to original_controller, and join destination action. Emit intermediary_origin_control only when all four segments hold and mismatch approved jump-path owner, original source, destination, service, or expiry. Relay state alone emits relay_exposure and destination origin from a jump host alone emits origin_unresolved.
      data_requirements:
        - source_type: approved-jump-relay-inventory
          name:
            zh: 批准跳板、中继和路径清单
            en: Approved Jump Relay and Path Inventory
          channel: CMDB network path and remote access governance
          required_fields: [relay.device_id, owner.id, allowed_original_source, allowed_destination, allowed_service, relay.binary_or_service, valid_from, valid_until]
        - source_type: relay-process-listener-config
          name:
            zh: 中继进程、监听和转发配置
            en: Relay Process Listener and Forwarding Configuration
          channel: Endpoint process service registry and configuration telemetry
          required_fields: [event.timestamp, relay.device_id, process_or_service.id, binary.hash, principal.id, command_or_config, listener.address, listener.port, tunnel_or_proxy.id]
        - source_type: relay-bilateral-flow
          name:
            zh: 中继双侧网络流
            en: Relay Bilateral Network Flows
          channel: Endpoint socket NetFlow IPFIX or packet metadata
          required_fields: [event.timestamp, relay.device_id, process_or_tunnel.id, source.ip, source.port, destination.ip, destination.port, protocol, flow.id, bytes, packets, duration]
        - source_type: destination-remote-session-action
          name:
            zh: 目标远程会话及动作
            en: Destination Remote Session and Action
          channel: Remote service authentication session and endpoint action audit
          required_fields: [event.timestamp, destination.device_id, target_visible_source, principal.id, service.id, session_or_logon.id, action.id, outcome]
      observables:
        - zh: 目标会话记录跳板或 localhost，而中继同时有可配对的入口和目标出口
          en: destination session records a jump host or localhost while relay has pairable ingress and destination-bound egress
        - zh: portproxy、Plink/SSH 转发、ProxyJump 或等价状态与目标会话重合
          en: portproxy Plink or SSH forwarding ProxyJump or equivalent state overlaps destination session
        - zh: 原始控制端不在批准来源集合且目标产生未授权动作
          en: original controller is outside approved source set and target produces unauthorized action
      correlation:
        window:
          zh: >-
            从 relay 配置前一小时覆盖双侧连接全寿命、目标 session 和断开后二十四小时；长连接滚动十五分钟配对，路径版本保留至少九十日。
          en: >-
            Correlate from one hour before relay configuration across the full bilateral lifetime, destination session, and twenty-four hours after disconnect; pair long flows in rolling fifteen-minute windows and retain path versions for at least ninety days.
        dimensions: [original_controller.device_id, relay.device_id, relay_instance.id, inbound_flow.id, outbound_flow.id, destination.device_id, principal.id, service.id, session_or_logon.id, action.id, time]
      false_positives:
        - zh: 批准堡垒机、管理跳板、MSP 支持、灾备转发、负载代理和运维隧道
          en: approved bastions management jump hosts MSP support recovery forwarding load proxies and operational tunnels
        - zh: 同一中继上近时但不转发的独立入口与出口
          en: close independent ingress and egress on one relay without forwarding
      blind_spots:
        - zh: 加密中继缺进程/socket 归因、第三方不共享入口、NAT 丢失 tuple 或目标不记来源/session
          en: encrypted relay lacks process or socket attribution third party withholds ingress NAT loses tuple or destination omits origin/session
        - zh: 攻击者控制批准原始终端、中继和主体且动作在允许范围
          en: adversary controls approved original endpoint relay and principal with actions inside scope
      tuning_guidance:
        paragraphs:
          - zh: >-
              为每个 jump/relay 绑定 owner、允许原始来源、目标、服务、binary/service、peer 和到期，不按 IP 或工具名永久放行。高置信要求明确转发状态或进程/socket 归因、双侧 flow、目标接受 session 和动作；只有容量/时间相似保持 suspected。localhost 仅提高优先级。
            en: >-
              Bind each jump or relay to owner, allowed original source, destination, service, binary or service, peer, and expiry rather than allowing IP or tool name permanently. High confidence requires explicit forwarding state or process and socket attribution, bilateral flows, destination-accepted session, and action. Volume or timing similarity alone remains suspected. Localhost only raises priority.
      evidence_keys: [B8C-T1021-REF-MANDIANT-RDP-TUNNEL, B8C-T1021-REF-MS-EXCHANGE-TUNNEL, REF-000377, REF-000604, B8C-T1021-REF-MS-MDE-LOGON, REF-000598]
  mitigations:
    - resolution: extend
      mitigation_ref: MIT-000052
      target_keys: [B8C-T1021-PARENT, B8C-T1021-NJS-ROLE-PATH]
      application_notes:
        zh: >-
          将授权绑定到主体、受管来源、目标组、服务、登录类型和期限；高权连接采用抗钓鱼 MFA、PAM/JIT、专用管理工作站和逐目标 ACL。对角色贴合路径，批准关系的 allow 不抑制来源风险与会话内行为检测；工单例外绑定 owner、目标、服务、动作类别和到期。
        en: >-
          Bind authorization to principal, managed source, destination group, service, logon type, and expiry; use phishing-resistant MFA, PAM or JIT, dedicated administrative workstations, and per-destination ACLs for privileged connections. For role-conforming paths, an approved relationship must not suppress source risk and in-session behavior detection; bind ticket exceptions to owner, destination, service, action class, and expiry.
      expected_effect:
        zh: >-
          攻击者更难仅凭有效身份从任意受害主机连接，且路径贴合不再成为全会话信任。
        en: >-
          An adversary has greater difficulty connecting from any compromised host with valid identity, and path conformity no longer grants trust to the entire session.
      limitations:
        zh: >-
          被控真实管理工作站、主体和批准时段仍可满足控制；旧协议可能不支持 MFA 或设备证明，过度收紧会中断遗留管理和应急。
        en: >-
          A controlled real management workstation, principal, and approved time can still satisfy controls; legacy protocols may lack MFA or device proof, and overrestriction can interrupt legacy or emergency administration.
      evidence_keys: [REF-000278, B8C-T1021-REF-MANDIANT-RDP-BASELINE, B8C-T1021-REF-MS-ATTACK-MODEL]
    - resolution: extend
      mitigation_ref: MIT-000172
      target_keys: [B8C-T1021-NJS-INTERMEDIARY]
      application_notes:
        zh: >-
          登记堡垒机、跳板、port forward 和 VPN/proxy relay 的 owner、原始来源、目标、服务、peer 和期限；限制监听、portproxy、隧道与双宿主权限，应用控制未批准 relay，并将双侧 flow、配置和目标 session 外送到独立存储。
        en: >-
          Register owner, original source, destination, service, peer, and expiry for bastions, jump hosts, port forwards, and VPN or proxy relays; restrict listener, portproxy, tunnel, and dual-homing authority, apply application control to unapproved relays, and export bilateral flows, configuration, and destination sessions to independent storage.
      expected_effect:
        zh: >-
          中继更难静默成为来源替身，目标只见跳板时仍可还原原始控制端。
        en: >-
          A relay has greater difficulty silently becoming an origin substitute, and the original controller remains recoverable when the destination sees only the jump host.
      limitations:
        zh: >-
          MSP、云堡垒和动态代理可能不共享完整日志；攻击者若控制中继和日志域，仍需另一侧网络或目标遥测。
        en: >-
          MSPs, cloud bastions, and dynamic proxies may not share complete logs; control of relay and logging domain still requires another-side network or destination telemetry.
      evidence_keys: [B8C-T1021-REF-MANDIANT-RDP-TUNNEL, B8C-T1021-REF-MS-EXCHANGE-TUNNEL, REF-000614]
existing_library_reuse:
  reference_refs: [REF-000278, REF-000289, REF-000377, REF-000598, REF-000604, REF-000614]
  claim_refs: [CLM-000507]
  case_refs: [CASE-000104]
  strategy_refs: []
  analytic_refs: []
  mitigation_refs: [MIT-000052, MIT-000172]
  relationship_refs: []
  reuse_notes:
    - object_ref: CLM-000507
      resolution: extend
      note:
        zh: >-
          PsExec 的 SMB—RPC—服务—named pipe 链支持 T1021 父级从远程主体到目标动作，但原结论和 CASE-000104 以服务执行为中心；只在不改变陈述含义时扩展新父项 subject_ref，不用于两个 NJS。
        en: >-
          The PsExec SMB-to-RPC-to-service-to-named-pipe chain supports the T1021 parent from remote principal to target action. Existing CLM-000507 and CASE-000104 remain service-execution centered; extend the new parent subject only if statement meaning remains unchanged, and do not use them for the Niji children.
    - object_ref: DET-000053/NJA-000027
      resolution: split
      note:
        zh: 身份/入口操作者目标缺内部资产角色关系和目标动作语义
        en: identity and entry-operator objective lacks internal asset-role relationship and target-action semantics
    - object_ref: DET-000094/NJA-000071
      resolution: split
      note:
        zh: 旧会话重放和外部风险情境不同于新内部连接与中继来源
        en: existing-session replay and external risk context differ from fresh internal connection and intermediary origin
    - object_ref: DET-000191/NJA-000214
      resolution: conditional-reuse
      note:
        zh: >-
          只有中继形成批准图禁止的跨域桥接时并记；批准跳板上的来源间接化由新分析承担。
        en: >-
          Record only when the relay creates a prohibited inter-domain bridge; origin indirection on an approved jump path belongs to the new analytic.
