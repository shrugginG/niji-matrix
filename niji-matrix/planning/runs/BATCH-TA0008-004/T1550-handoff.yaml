  claims:
    - key: B8D-T1550-CLM-ADMISSION
      statement:
        zh: 已生成替代材料被当前操作者呈现、目标按既有规则接受并产生另一内部资源结果，是独立于材料取得、伪造、验证器修改和通用身份使用的 TA0008 行为。
        en: Presentation of generated alternate material by a current operator, acceptance under existing validation rules, and a result on another internal resource form a TA0008 behavior distinct from material acquisition, forgery, verifier modification, and general identity use.
      evidence_keys: [B8D-T1550-REF-ATTACK, B8D-T1550-REF-UNC6692, REF-000178, REF-000070]
      confidence: high
    - key: B8D-T1550-CLM-VERIFIER-CHILD
      statement:
        zh: hash、TGT/service ticket 与 refresh/sign-in-session material 可在当前 verifier/KDC/token endpoint 事务中省略原始秘密或交互因素并产生新 context/proof，形成跨材料的独立观察拓扑。
        en: Hashes, TGTs or service tickets, and refresh or sign-in-session material can omit the original secret or interactive factors in a current verifier, KDC, or token-endpoint transaction that creates fresh context or proof, forming a cross-material observation topology.
      evidence_keys: [B8D-T1550-REF-MS-NTLM, B8D-T1550-REF-MS-KERBEROS, B8D-T1550-REF-MS-KILE, B8D-T1550-REF-MS-OVERPASS, REF-000815]
      confidence: high
    - key: B8D-T1550-CLM-SESSION-DEDUP
      statement:
        zh: 资源直接接受既有 Cookie/access token/session state 的续用变量已由 NJS-0061-002 拥有，外部网关状态重放已由 NJS-0055-001 拥有；T1550 只需记录材料呈现阶段而不复制其子项。
        en: NJS-0061-002 already owns direct resource continuation of established cookie, access-token, or session state, while NJS-0055-001 owns state replay at external gateways; T1550 needs to record the material-presentation stage without duplicating those children.
      evidence_keys: [REF-000070, REF-000069, B8D-T1550-REF-RFC6750, REF-000380]
      confidence: high
    - key: B8D-T1550-CLM-DEFENSE
      statement:
        zh: 高置信替代材料使用检测需把当前 validation/redemption、fresh context/proof 和目标结果与原认证、许可设备/client、绑定及真实操作者连接，任何单个成功认证事件都不足以判断。
        en: High-confidence detection of alternate-material use joins current validation or redemption, fresh context or proof, and destination result to original authentication, approved device or client, binding, and actual operator; no single successful authentication event is sufficient.
      evidence_keys: [B8D-T1550-REF-EVENT4776, B8D-T1550-REF-EVENT4768, B8D-T1550-REF-EVENT4769, REF-000376, B8D-T1550-REF-MS-OVERPASS, B8D-T1550-REF-MDI-ALERTS]
      confidence: high
  cases:
    - key: B8D-T1550-CASE-UNC6692-PTH
      title: {zh: UNC6692 以高权 Hash 横向进入域控制器, en: UNC6692 Pass-the-Hash Lateral Entry to Domain Controllers}
      event:
        zh: GTIG 记录 UNC6692 在备份服务器导出 LSASS 内存并离线提取高权用户 hash，随后以 Pass-the-Hash 横向进入域控制器，在目标下载并运行 FTK Imager、挂载存储并收集 NTDS.dit 与注册表 hive。
        en: GTIG records UNC6692 exporting LSASS memory from a backup server and extracting elevated-user hashes offline, then using Pass-the-Hash to enter domain controllers laterally, download and run FTK Imager, mount storage, and collect NTDS.dit and registry hives.
      evidence_keys: [B8D-T1550-REF-UNC6692]
      conclusion_limit:
        zh: 来源直接证明材料类别、使用方式和目标结果，但未公开每台主机的 4776、4624、challenge response 或 material fingerprint；这些字段只能作为官方文档支持的检测设计。
        en: The source directly establishes material class, use method, and destination outcome but does not publish 4776, 4624, challenge-response, or material-fingerprint records for each host; those fields remain a detection design supported by official documentation.
      confidence: high
