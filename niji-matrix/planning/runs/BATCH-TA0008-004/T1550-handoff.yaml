      - {object_key: B8D-T1550-NJA-DERIVED-PROOF, keys: [B8D-T1550-REF-MS-KILE, REF-000815, REF-000816, REF-000376, REF-000380, REF-000790]}
      - {object_key: B8D-T1550-MIT-PROOF-GOVERNANCE, keys: [B8D-T1550-REF-CREDENTIAL-GUARD, B8D-T1550-REF-AUTH-SILOS, B8D-T1550-REF-RESTRICT-NTLM, REF-000816, B8D-T1550-REF-TOKEN-PROTECTION, REF-000790]}
