handoff_schema_version: "2.0.0"
type: technique-research-handoff
batch_ref: BATCH-TA0008-004
work_item_ref: WORK-TA0008-T1550
temporary_key_prefix: B8D-T1550
candidate:
  source_type: attack
  source_attack_id: T1550
  name: {zh: 使用替代认证材料, en: Use Alternate Authentication Material}
recommendation:
  decision: adapt
  confidence: high
  original_attack_subtechniques_imported: false
  rationale:
    paragraphs:
      - zh: >-
          ATT&CK Enterprise 19.1 的 T1550 以攻击者使用系统先前生成并仍可接受的 hash、ticket、application token 或 Web session cookie 代替原始秘密和常规交互因素，从而认证到另一内部系统或资源。UNC6692 在取得高权账户 hash 后以 Pass-the-Hash 横向进入域控制器，Microsoft 和 GTIG 分别记录已完成 MFA 的 Cookie/token 重放及 UNC6395 使用被盗 OAuth token 访问客户资源，证明父行为跨本地与云环境实际存在。因此候选应准入，但 Niji 需把范围改写为材料呈现、验证及其横向结果，不能把材料取得、伪造、认证流程修改或一般身份接受合并成一个不可审计事件。
        en: >-
          ATT&CK Enterprise 19.1 anchors T1550 in an adversary using a previously generated and still acceptable hash, ticket, application token, or web session cookie in place of the original secret and ordinary interactive factors to authenticate to another internal system or resource. UNC6692 used Pass-the-Hash to enter domain controllers laterally after obtaining elevated-account hashes; Microsoft documents replay of MFA-completed cookies and tokens; and GTIG observed UNC6395 using compromised OAuth tokens against customer resources. These events establish the behavior across on-premises and cloud environments. The candidate should be admitted, but Niji should adapt it into a material-presentation, validation, and lateral-result object rather than combining acquisition, forgery, authentication-process modification, and general identity acceptance into one unauditable event.
      - zh: >-
          父级完成链分为“已存在材料进入攻击者控制”“材料被提交给权威、验证器或依赖方”“目标接受并形成新的安全上下文或续用既有状态”“另一内部系统、租户或资源出现攻击者结果”。T1550 拥有第二阶段及其材料特定验证关系，并以接受和横向结果作为完成门；NJT-0178/T1528 和 T1539 拥有取得，NJT-0166/T1606 与 T1558 拥有构造或伪造，T1556 拥有验证过程修改，NJT-0061 拥有身份/会话被接受后的通用使用，NJT-0151 拥有同一既有会话控制者变化。各阶段可以共现，但后一阶段不能替代前一阶段证据。
        en: >-
          The parent chain separates existing material entering adversary control, presentation to an authority, verifier, or relying party, acceptance that creates a fresh security context or continues established state, and an adversary result on another internal system, tenant, or resource. T1550 owns the second stage and its material-specific verification relationship, with acceptance and a lateral result as completion gates. NJT-0178 or T1528 and T1539 own acquisition; NJT-0166 or T1606 and T1558 own construction or forgery; T1556 owns modification of the verification process; NJT-0061 owns general identity or session use after acceptance; and NJT-0151 owns a changed controller of the same existing session. These stages can coexist, but evidence of a later stage cannot substitute for an earlier one.
proposed_content:
  summary:
    zh: 攻击者提交系统已生成的替代认证材料，使目标在没有原始秘密或常规交互因素的情况下建立或续用身份状态，并由此访问另一内部资源。
    en: An adversary presents system-generated alternate authentication material so a target establishes or continues identity state without the original secret or ordinary interactive factors, enabling access to another internal resource.
  definition_and_concept:
    paragraphs:
      - zh: >-
          使用替代认证材料是攻击者控制一个由正规身份、操作系统或应用流程先前生成的可提交认证工件，并把它交给认证权威、协议验证器或依赖方；目标在材料仍有效且约束满足时，为相应主体建立新的登录/安全上下文、签发派生证明，或接受既有会话状态。工件可以是挑战响应所需的秘密派生物、票据、访问/刷新令牌、Cookie 或等价状态，但材料类别不定义 Niji 子项。
        en: >-
          Use of Alternate Authentication Material occurs when an adversary controls a presentable authentication artifact previously generated by a legitimate identity, operating-system, or application process and submits it to an authentication authority, protocol verifier, or relying party. If the artifact remains valid and its constraints are satisfied, the target establishes a new logon or security context, issues derived proof, or accepts established session state for the represented principal. The artifact may be a secret derivative used in challenge response, a ticket, an access or refresh token, a cookie, or equivalent state, but material class does not define a Niji child.
      - zh: >-
          在 TA0008 下，成功还要求材料使用越过攻击者原控制点并产生另一内部系统、云控制面、SaaS 资源、租户或服务上的可控结果。一次 hash/ticket/token 验证成功只证明身份材料被接受；若没有另一资源的会话、授权请求或后继操作，只能记录材料使用成功，不能自动称为横向移动。相反，资源动作可证明 possession，却不能反推材料如何取得、是否伪造或具体从哪个进程导出。
        en: >-
          Under TA0008, completion additionally requires the material use to cross beyond the adversary's original control point and produce a controllable outcome on another internal system, cloud control plane, SaaS resource, tenant, or service. Successful hash, ticket, or token validation proves acceptance of the authentication material. Without a session, authorization request, or follow-on action on another resource, it establishes material use but not lateral movement. Conversely, a resource action can prove possession without revealing how the material was acquired, whether it was forged, or which process exported it.
  stealth_characteristics:
    paragraphs:
      - zh: >-
          替代材料把操作者从原始认证交互中分离。验证器可以看到真实账户、有效 hash 派生响应、受 KDC/issuer 签名的 ticket/token、正确 audience/scope 或已完成 MFA 的 Cookie，却看不到当前操作者亲自提供口令、硬件因素或原设备证明。验证与目标授权因此继续显示合法主体和正常协议结果，粗粒度规则容易把攻击者请求解释为单点登录、后台续期或普通服务访问。
        en: >-
          Alternate material separates the current operator from the original authentication interaction. A verifier may see a real account, a valid hash-derived response, a KDC- or issuer-signed ticket or token, correct audience and scope, or a cookie carrying completed MFA, while never seeing the current operator provide the password, hardware factor, or original device proof. Validation and destination authorization therefore retain a legitimate principal and normal protocol outcome, allowing coarse rules to interpret adversary requests as single sign-on, background renewal, or ordinary service access.
      - zh: >-
          痕迹随观察拓扑改变。NTLM 或等价验证会留下权威侧 credential validation 与目标登录；TGT、refresh token 或可派生材料可在 KDC/token endpoint 留下新 proof 请求；service ticket、access token 和 Cookie 可能直接由目标资源或本地缓存验证，使身份权威在使用时没有事件。残余证据包括材料/票据/token 的安全标识或 family、issuer、subject、audience、scope、issued-at/expiry、绑定键/设备、验证来源、目标会话和首个资源动作。无法取得安全材料标识时，主体、源设备、SPN/resource、验证结果和时间只能形成降级关联。
        en: >-
          Residue changes with the observation topology. NTLM or an equivalent verifier leaves credential validation at the authority and a destination logon. A TGT, refresh token, or other derivation-capable material can leave a fresh proof request at a KDC or token endpoint. A service ticket, access token, or cookie may be validated directly by the destination resource or local cache, leaving no identity-authority event at use time. Residual evidence includes a safe material, ticket, or token identifier or family, issuer, subject, audience, scope, issue and expiry time, binding key or device, validation origin, destination session, and first resource action. Without a safe material identifier, principal, source device, SPN or resource, validation result, and time provide only degraded correlation.
  scope_boundary_definition:
    paragraphs:
      - zh: >-
          纳入要求材料在本次使用前已经由系统生成并进入攻击者控制，攻击者随后实际提交该材料或用其完成协议证明，目标接受并出现另一内部资源结果。材料的存在、导出文件、内存读取、token claims、ticket cache、hash dump、提交尝试或拒绝分别只证明前提或 attempt。合法 SSO、应用 refresh、服务账户、票据续期、浏览器恢复、管理员自动化和灾难恢复会产生同形事件，必须以所有者、批准 client/device、允许来源、audience/scope、时间和资源用途排除。
        en: >-
          Inclusion requires material already generated by the system and under adversary control before this use, actual presentation of the material or completion of protocol proof with it, target acceptance, and a result on another internal resource. Material presence, an exported file, a memory read, token claims, a ticket cache, a hash dump, a presentation attempt, and a rejection respectively establish only prerequisites or an attempt. Legitimate SSO, application refresh, service identities, ticket renewal, browser recovery, administrator automation, and disaster recovery create the same event shapes and require owner, approved client or device, permitted origin, audience and scope, time, and resource purpose as exclusions.
      - zh: >-
          NJT-0178/T1528 以完整 access/refresh material 返回、读取或复制到攻击者接收者为完成点，T1550 从其后“材料被呈现”开始；正规 token endpoint 因 refresh material 返回新 access token时，两者可分别记录 input use 与 output acquisition。NJT-0166/T1606、T1558 及其他伪造对象拥有权威链外构造的新材料；T1556/NJT-0093 拥有 verifier、provider、trust 或策略被修改后产生的异常接受。已盗原件按原验证规则被使用才属于本对象。
        en: >-
          NJT-0178 or T1528 completes when full access or refresh material is returned, read, or copied into an adversary recipient; T1550 begins when that material is presented. When a legitimate token endpoint returns a new access token in response to refresh material, input use and output acquisition can be recorded separately. NJT-0166 or T1606, T1558, and other forgery objects own newly constructed material outside the authoritative chain. T1556 or NJT-0093 owns anomalous acceptance caused by modified verifiers, providers, trust, or policy. This object applies when a stolen original is used under the existing validation rules.
      - zh: >-
          资源直接接受仍有效 Cookie/access token/browser state 而没有新完整认证链时，接受和使用的匿迹变量已由 NJS-0061-002“既有认证会话续用”拥有；外部 VPN/网关的新会话重放另由 NJS-0055-001 所有。T1550 可与它们共映射材料呈现阶段，但不重复建立“会话续用”子项。NJT-0151 要求控制者进入同一个既有远程传输或交互会话；T1550 则用材料触发另一验证、派生或资源接受，即使最终账户相同也不是会话控制端接管。
        en: >-
          When a resource directly accepts a still-valid cookie, access token, or browser state without a fresh complete authentication chain, NJS-0061-002, Reuse of Established Authenticated Sessions, already owns the acceptance-and-use stealth variable; creation of a new external VPN or gateway session by replay is separately owned by NJS-0055-001. T1550 can co-map the material-presentation stage without creating another session-reuse child. NJT-0151 requires the adversary to enter the same existing remote transport or interactive session. T1550 instead uses material to trigger another validation, derivation, or resource acceptance, even when the represented account is unchanged.
      - zh: >-
          T1021 拥有远程服务连接与目标交互，T1550 拥有其中替代材料的认证输入。一次 Pass-the-Hash 后通过 SMB/WinRM 控制目标可分别标注材料验证和远程服务结果；不能由远程连接成功推断使用了 hash，也不能由验证成功推断已取得目标控制。进程访问 token、线程模拟和本地主体切换若没有跨主机/资源认证，属于对应的进程令牌或权限技术。
        en: >-
          T1021 owns the remote-service connection and destination interaction, while T1550 owns alternate material as the authentication input. Pass-the-Hash followed by SMB or WinRM control can be labeled separately as material validation and remote-service outcome. Remote connection success does not prove hash use, and validation success does not prove destination control. Process access tokens, thread impersonation, and local principal switching without cross-host or cross-resource authentication belong to the relevant process-token or privilege technique.
  application_scenarios_and_threat_model:
    application_scenarios:
      paragraphs:
        - zh: >-
            在 Windows 域场景中，攻击者从一台已受害主机获得另一个账户的 NTLM hash、TGT 或 service ticket。hash 可用于完成 NTLM challenge-response 并在目标形成新的网络登录；TGT 可向 KDC 请求目标 SPN 的 service ticket；现成 service ticket 可直接交给对应服务。UNC6692 在备份服务器导出 LSASS 内存后，以高权账户 hash 横向进入域控制器并执行取证与目录数据收集，证明“材料—验证—另一主机结果”链。
          en: >-
            In a Windows domain, an adversary obtains another account's NTLM hash, TGT, or service ticket from a compromised host. The hash can complete NTLM challenge response and create a new network logon at a destination. A TGT can request a service ticket for a target SPN from the KDC, while an existing service ticket can be presented directly to its service. UNC6692 exported LSASS memory from a backup server and then used elevated-account hashes to enter domain controllers laterally and perform forensic-tool and directory-data collection, establishing a material-to-validation-to-other-host result chain.
        - zh: >-
            在云与 SaaS 场景中，攻击者可把已取得 OAuth access token 直接提交给 resource server，或以 refresh/sign-in-session material 向授权服务器换取新的 audience-bound access token，再访问邮件、CRM、代码或管理 API。UNC6395 使用与既有 Salesloft Drift 集成相关的被盗 OAuth token 访问多个客户 Salesforce 实例和少量 Workspace 邮箱；Microsoft 还记录 Cookie/token 在另一浏览器重放并继承已完成 MFA 状态。前者证明 token 资源使用，后者同时说明直接状态续用的既有 Niji 边界。
          en: >-
            In cloud and SaaS environments, an adversary can present an acquired OAuth access token directly to a resource server or redeem refresh or sign-in-session material at an authorization server for a new audience-bound access token before reaching mail, CRM, code, or management APIs. UNC6395 used compromised OAuth tokens associated with existing Salesloft Drift integrations to access multiple customer Salesforce instances and a small number of Workspace mailboxes. Microsoft also documents cookie or token replay in another browser inheriting completed MFA state. The former establishes token use against resources, while the latter also illustrates the existing Niji boundary for direct session-state continuation.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者须拥有可提交的完整材料及其协议所需伴随状态，并知道对应 identity、tenant/domain、issuer/KDC、audience/SPN、scope、有效期和目标。NTLM hash 需要能完成相应挑战响应，Kerberos ticket 需要匹配 realm、服务和时间，bearer token/cookie 必须仍被目标接受；sender-constrained 或 device-bound token 还要求绑定私钥、设备上下文或在原设备上执行。只有 claims、token ID、掩码日志或不可用 ticket 文件不足以完成。
            en: >-
              The adversary needs complete presentable material and any companion state required by its protocol, plus knowledge of the corresponding identity, tenant or domain, issuer or KDC, audience or SPN, scope, lifetime, and target. An NTLM hash must support the required challenge response; a Kerberos ticket must match realm, service, and time; and a bearer token or cookie must remain acceptable to the target. A sender-constrained or device-bound token additionally requires the binding private key, device context, or execution on the original device. Claims, a token ID, masked logs, or an unusable ticket file are insufficient.
          - zh: >-
              攻击者能选择直接呈现 target-ready material，或使用 TGT/refresh 等上游材料向权威派生新的目标证明；两条路径改变日志所在位置。直接材料减少当前权威事件但更易暴露来源/设备跳变，派生路径产生正规新票据/令牌并可更新 issued-at/audience 外观，却留下 KDC/token endpoint 请求。使用真实受控设备、设备指纹或绑定密钥可保留更多情境，但这些变量分别与 NJS-0061-001、NJS-0050-004 及材料绑定控制相交，不能由材料使用自动推定。
            en: >-
              The adversary can present target-ready material directly or use upstream material such as a TGT or refresh token to derive fresh target proof through an authority, changing where logs appear. Direct use reduces current authority events but can expose origin or device transitions. Derivation yields a legitimately signed ticket or token with fresh issue time and audience while leaving a KDC or token-endpoint request. Operating on a controlled genuine device or carrying device fingerprints or binding keys can preserve more context, but those variables intersect NJS-0061-001, NJS-0050-004, and material-binding controls and cannot be inferred from material use alone.
      defender_model:
        paragraphs:
          - zh: >-
              防守方需要同时观察材料验证面和目标结果面。Windows 至少包括 DC/权威侧 4776、4768、4769 或等价协议记录，目标侧 4624 Logon ID、AuthenticationPackage、LogonType、源工作站/IP 与服务/进程结果；云/SaaS 包括 token endpoint/grant、safe token/family ID、client、subject、issuer、audience/scope、device/binding、source、resource allow 和 API audit。原始 hash、ticket、token 或 Cookie 不应写入集中日志，应使用提供方 ID、ticket hash（若平台可靠提供）或受限 HMAC 指纹。
            en: >-
              The defender needs both the material-validation plane and the destination-outcome plane. On Windows this includes domain-controller or authority events such as 4776, 4768, and 4769 or protocol equivalents, plus destination 4624 Logon ID, AuthenticationPackage, LogonType, source workstation or IP, and service or process outcomes. Cloud and SaaS visibility includes token-endpoint grant, a safe token or family identifier, client, subject, issuer, audience and scope, device or binding state, source, resource allow, and API audit. Raw hashes, tickets, tokens, and cookies must not enter centralized logs; use provider identifiers, ticket hashes where a platform reliably exposes them, or restricted HMAC fingerprints.
          - zh: >-
              防守结论按 material_exposed、presentation_attempt、verifier_accepted、fresh_context_created 或 established_state_accepted、remote_resource_access 分级。4776/4769、token refresh 或资源 allow 在合法 SSO 和自动化中极常见，单事件不能识别真实操作者；需连接预期来源设备、该身份近期认证、绑定/受众验证、并发活动、目标敏感度和攻击者后继动作。若身份权威与资源不共享稳定 ID，只能明确 coverage gap 和降低置信度。
            en: >-
              Defender conclusions should be tiered as material_exposed, presentation_attempt, verifier_accepted, fresh_context_created or established_state_accepted, and remote_resource_access. Events such as 4776, 4769, token refresh, and resource allow are common in legitimate SSO and automation and cannot identify the real operator alone. They need joins to expected source device, recent authentication for the identity, binding and audience validation, concurrent activity, destination sensitivity, and adversary follow-on action. When identity authorities and resources share no stable identifier, record the coverage gap and lower confidence.
  stealth_mechanisms:
    - mechanism_ref: NM-BT
      role: primary
      summary: {zh: 以已生成材料省略原始秘密与常规交互因素, en: Use generated material to omit the original secret and ordinary interactive factors}
      analysis:
        paragraphs:
          - zh: >-
              攻击者提交 hash 派生证明、ticket、token 或 Cookie，使验证器沿用早先认证结果、材料签名或缓存状态，而不重新采集原口令、MFA 或硬件因素。行为设计把关键操作者变化移出常规认证交互；痕迹从 credential/MFA challenge 变成 credential validation、TGS/token refresh、resource-local validation 和后继 session。只监测口令/MFA 失败或交互登录的防守方会漏掉当前操作者，形成行为透明。Windows、OAuth 与 Microsoft token 资料直接支持省略关系，具体日志覆盖因协议而异。
            en: >-
              The adversary presents hash-derived proof, a ticket, token, or cookie so the verifier relies on an earlier authentication result, material signature, or cached state rather than reacquiring the original password, MFA, or hardware factor. This design moves the critical operator change outside ordinary authentication interaction. Traces shift from credential and MFA challenge to credential validation, TGS or token refresh, resource-local validation, and a later session. Defenders monitoring password or MFA failure and interactive sign-in alone miss the current operator, producing Behavioral Transparency. Windows, OAuth, and Microsoft token sources directly support the omitted interaction, although log coverage differs by protocol.
        evidence_keys: [B8D-T1550-REF-ATTACK, B8D-T1550-REF-MS-KERBEROS, B8D-T1550-REF-MS-NTLM, B8D-T1550-REF-RFC6750, REF-000070]
      confidence: high
    - mechanism_ref: NM-FD
      role: secondary
      summary: {zh: 正规主体与有效材料外观掩盖真实操作者, en: Legitimate principal and valid-material appearance masks the actual operator}
      analysis:
        paragraphs:
          - zh: >-
              目标接受的工件仍携带真实主体、合法 issuer/KDC 签名、可接受的 challenge response、audience/scope 或已完成认证声明，因此资源日志显示批准账户与正常 allow，而不是攻击者自建身份。攻击者借材料的真实来源和协议有效性包裹后继操作，降低按用户名、签名或成功状态区分的能力。设备/来源变化、发行—使用断点、绑定失败、同一材料跨设备并发及角色不符的资源行为仍是残余差异；UNC6692、UNC6395 和 Cookie 重放事件支持操作者与可见身份分离。
            en: >-
              An accepted artifact still carries a real principal, legitimate issuer or KDC signature, acceptable challenge response, audience and scope, or completed-authentication claims. Resource logs therefore show an approved account and normal allow rather than an attacker-created identity. The adversary wraps follow-on operations in the material's authentic provenance and protocol validity, weakening classification by username, signature, or success state. Device or origin change, issuance-to-use discontinuity, binding failure, concurrent cross-device use, and role-inconsistent resource behavior remain. UNC6692, UNC6395, and cookie-replay reporting support separation between actual operator and visible identity.
        evidence_keys: [B8D-T1550-REF-UNC6692, REF-000178, REF-000070, B8D-T1550-REF-TOKEN-PROTECTION]
      confidence: medium
  subtechnique_taxonomy:
    coverage: established
    narrative:
      paragraphs:
        - zh: >-
            建议一项新 Niji 子项“验证器介导的替代证明新建认证”，稳定变量是攻击者以已有材料触发当前 verifier/authority 验证并形成新的登录、安全上下文或派生目标证明。它跨越 NTLM hash challenge response、TGT 请求 service ticket、refresh/sign-in-session material 换取新 access token 等实现；痕迹集中在 verifier/KDC/token endpoint 与新 context，而不是材料名称。TGT→TGS 与 refresh→access 可在新上下文前多一层权威派生，NTLM 可直接验证，但二者均产生当前验证事务并需要类似的预期来源与原认证关联。
          en: >-
            Propose one new Niji child, Verifier-Mediated Alternate-Proof Authentication. Its stable variable is an adversary using existing material to trigger current verifier or authority validation that creates a fresh logon, security context, or derived target proof. It spans NTLM hash challenge response, a TGT requesting a service ticket, and refresh or sign-in-session material obtaining a new access token. Residue concentrates at the verifier, KDC, or token endpoint and the new context rather than following material names. TGT-to-TGS and refresh-to-access add authority-mediated derivation before the fresh context, while NTLM can validate directly, but both produce a current verification transaction needing expected-origin and original-authentication correlation.
        - zh: >-
            “资源直接接受既有 bearer/cookie session state”确有不同观察拓扑：使用时 IdP/KDC 可能无事件，资源只看到真实 session/token 继续。然而 NJS-0061-002 已按同一稳定变量、痕迹和防御拥有该行为，NJS-0055-001 又拥有远程网关的活动状态重放；本批不为 T1550 复制子项。设备/来源情境移植由 NJS-0061-001 或 NJS-0050-004 表达，材料取得由 NJT-0178 表达，proof 伪造由 NJT-0166/T1558 表达。四个 ATT&CK 子项仅作为材料与协议宽度，均未导入。
          en: >-
            Direct resource acceptance of established bearer or cookie session state has a different observation topology: the IdP or KDC may have no event at use, while the resource sees a real session or token continuing. NJS-0061-002 already owns that behavior with the same stable variable, traces, and defenses, and NJS-0055-001 owns live-state replay at remote gateways. This batch does not duplicate it under T1550. NJS-0061-001 or NJS-0050-004 expresses device or origin-context transplantation; NJT-0178 expresses material acquisition; and NJT-0166 or T1558 expresses proof forgery. The four ATT&CK children remain material and protocol breadth only and are not imported.
proposed_subtechniques:
  - key: B8D-T1550-NJS-VERIFIER
    name: {zh: 验证器介导的替代证明新建认证, en: Verifier-Mediated Alternate-Proof Authentication}
    summary:
      zh: 攻击者以已生成材料触发当前验证事务，使目标建立新的安全上下文或签发目标证明，同时省略原始秘密与常规交互因素。
      en: An adversary uses generated material in a current verification transaction to create a fresh security context or target proof while omitting the original secret and ordinary interactive factors.
    stable_stealth_variable:
      zh: 当前认证事务由可复用替代材料完成并生成新的验证/签发与安全上下文痕迹，而真实操作者没有执行原始秘密和交互因素链。
      en: A current authentication transaction is completed with reusable alternate material and produces fresh validation, issuance, and security-context traces while the actual operator does not perform the original-secret and interactive-factor chain.
    definition_and_concept:
      paragraphs:
        - zh: >-
            验证器介导的替代证明新建认证是攻击者把系统先前生成的材料提交给当前 authentication verifier、KDC 或 token endpoint，验证成功后产生新的登录、安全上下文、service ticket 或 access token，再用于目标资源。它不按 hash、ticket 或 refresh token 分割；稳定关系是 current presentation→verifier/authority acceptance→fresh context/proof，而原口令、MFA 或硬件因素没有由当前操作者重新执行。
          en: >-
            Verifier-Mediated Alternate-Proof Authentication occurs when an adversary presents material generated by the system earlier to a current authentication verifier, KDC, or token endpoint. Successful validation creates a fresh logon, security context, service ticket, or access token that is then used against a destination resource. It is not partitioned by hash, ticket, or refresh token. The stable relationship is current presentation to verifier or authority acceptance to fresh context or proof, while the current operator does not repeat the original password, MFA, or hardware-factor interaction.
        - zh: >-
            NTLM 路径中，hash 支持生成目标或域权威可验证的 challenge response，并在目标创建新 logon；Kerberos 路径中，被盗 TGT 可向 KDC 取得特定 SPN 的新 service ticket，被盗 service ticket 也可由服务验证并形成本地安全上下文；OAuth 路径中，refresh 或 sign-in-session material 可由授权服务器验证后返回新的 audience-bound access token。三者协议不同，但都给防守方留下一个当前验证点和新上下文结果。
          en: >-
            In an NTLM path, the hash supports a challenge response the destination or domain authority can validate before a new destination logon is created. In Kerberos, a stolen TGT can obtain a new service ticket for a particular SPN from the KDC, while a stolen service ticket can also be validated by its service to form a local security context. In OAuth, refresh or sign-in-session material can be validated by an authorization server that returns a fresh audience-bound access token. The protocols differ, but each leaves a current verification point and a fresh-context result.
    stealth_characteristics:
      paragraphs:
        - zh: >-
            验证器介导的替代证明新建认证仍会产生“成功认证”外观：4776、4768/4769、token endpoint success 或目标 4624 可显示真实账户、允许的 encryption/grant、正常 issuer 和新 session。与口令猜测不同，它通常没有失败序列；与交互登录不同，它不要求当前操作者重做 MFA 或出示原秘密。单看成功事件会把合法 SSO、后台刷新与材料重用混合，使真实操作者被协议有效性遮蔽。
          en: >-
            Verifier-Mediated Alternate-Proof Authentication still produces the appearance of successful authentication. Events such as 4776, 4768 or 4769, token-endpoint success, or destination 4624 can show a real account, allowed encryption or grant, a legitimate issuer, and a fresh session. Unlike password guessing it usually has no failure sequence, and unlike interactive sign-in it does not require the current operator to repeat MFA or present the original secret. Success events alone mix legitimate SSO and background refresh with material reuse, allowing protocol validity to hide the real operator.
        - zh: >-
            残余差异位于验证来源与原认证谱系：同一用户的 NTLM validation 来自非许可 workstation，TGS 请求来自没有相邻合法 TGT/用户登录的设备，refresh redemption 来自异常 client/device/source，或新 context 随即访问角色不符资源。某些平台提供 ticket hash、token family 或 correlation ID，可精确连接；旧 Windows、跨 SaaS 和本地账户验证可能只提供主体、设备、目标和时间，因此结论必须标记降级。
          en: >-
            Residual differences lie in verification origin and original-authentication lineage. NTLM validation for a user may come from a workstation outside the allowlist; a TGS request may originate from a device without adjacent legitimate TGT issuance or user logon; refresh redemption may come from an anomalous client, device, or origin; or the new context may immediately access resources outside the identity's role. Some platforms expose ticket hashes, token families, or correlation IDs for exact joins. Older Windows versions, cross-SaaS services, and local-account validation may expose only principal, device, target, and time, requiring an explicitly degraded conclusion.
    scope_boundary_definition:
      paragraphs:
        - zh: >-
            纳入必须有当前验证事务及 fresh context/proof。hash dump、ticket/token 文件、Credential Guard 告警或 token acquisition 是材料取得；没有验证结果时不能标记本项。presented material 被拒绝时为 attempt；验证成功但没有新 context/proof 时为 verifier_accepted；新 context/proof 与另一内部目标操作相连时才完成 TA0008 横向结果。合法 domain SSO、后台 token refresh、service-account ticket、scheduled task 和票据自动续期是强反例。
          en: >-
            Inclusion requires a current verification transaction and a fresh context or proof. A hash dump, ticket or token file, Credential Guard alert, or token acquisition belongs to acquisition; without a validation result this child does not apply. Rejected presented material is an attempt. Validation without fresh context or proof is verifier_accepted. TA0008 completes only when the fresh context or proof is linked to an operation on another internal target. Legitimate domain SSO, background token refresh, service-account tickets, scheduled tasks, and automatic ticket renewal are strong counterexamples.
        - zh: >-
            资源只续用已有 Cookie/access token/session 而不产生当前 verification/fresh context 时由 NJS-0061-002 所有；外部网关以活动状态建立会话时也可由 NJS-0055-001 所有。攻击者修改 verifier 或信任策略使无效材料通过归 T1556/NJT-0093；攻击者构造新 ticket/assertion/token 归 T1558/NJT-0166。正规 authority 接受被盗 TGT/refresh 后签发新 proof 仍属本项，因为材料是原件且验证规则未改。
          en: >-
            Resource continuation through an existing cookie, access token, or session without a current verification and fresh context belongs to NJS-0061-002, and live-state creation of an external gateway session can also belong to NJS-0055-001. Modified verifiers or trust policy that accept otherwise invalid material belong to T1556 or NJT-0093; adversary construction of a new ticket, assertion, or token belongs to T1558 or NJT-0166. A legitimate authority issuing fresh proof after accepting a stolen TGT or refresh token remains here because the material is an original and validation rules are unchanged.
    application_scenarios_and_threat_model:
      application_scenarios:
        paragraphs:
          - zh: >-
              攻击者在已控服务器上取得帮助台或管理员的 NTLM hash，以远程执行工具触发目标 NTLM 认证。域控制器记录该账户从受害源工作站的 credential validation，目标建立 Type 3 或相应新登录并启动服务/命令。UNC6692 从备份服务器取得 LSASS dump 后使用高权 hash 进入域控制器，直接支持这一完整场景；公开报告未披露每条 4776/4624 字段，Analytic 字段仍来自 Microsoft 官方事件定义。
            en: >-
              An adversary obtains an NTLM hash for a help-desk operator or administrator on a compromised server and uses a remote-execution path that triggers NTLM authentication at a destination. A domain controller records credential validation for the account from the compromised source workstation, while the destination creates a type-3 or corresponding fresh logon and starts a service or command. UNC6692 obtained an LSASS dump from a backup server and used elevated hashes to enter domain controllers, directly supporting the complete scenario. The public report does not disclose every 4776 and 4624 field; analytic fields come separately from Microsoft's event definitions.
          - zh: >-
              攻击者把从另一主机取得的 TGT 注入可控上下文，从该设备向 KDC 请求文件服务器、域控制器或管理服务的 service ticket；或者以被盗 refresh token 向授权服务器取得新 access token。KDC/token service 的响应是真实且新鲜的，目标可见新 ticket/token，原始交互认证却发生在别处或早已结束。Microsoft 的 overpass-the-hash 关联示例与 Kerberos/OAuth 规范支持能力和观察拓扑，不把它们升级为特定受害者事件。
            en: >-
              An adversary injects a TGT acquired on another host into a controlled context and requests a service ticket from the KDC for a file server, domain controller, or management service, or redeems a stolen refresh token at an authorization server for a fresh access token. The KDC or token-service response is genuine and newly issued, while original interactive authentication occurred elsewhere or ended earlier. Microsoft's overpass-the-hash correlation scenario and the Kerberos and OAuth specifications support capability and observation topology and are not promoted into a specific victim incident.
    threat_model:
      attacker_model:
        paragraphs:
          - zh: >-
              攻击者必须控制被目标 verifier 接受的完整 proof input，并满足时间、realm/tenant、audience/SPN、client、scope 与任何 sender/device binding。hash 路径需要协议客户端或工具完成 challenge response；TGT/refresh 路径还需要访问 KDC/token endpoint 和处理返回材料；service ticket 直接验证则需要匹配目标服务。材料过期、被撤销、账户禁用、时钟偏差、auth silo、NTLM restriction 或 binding key 缺失会阻断。
            en: >-
              The adversary must control complete proof input accepted by the target verifier and satisfy time, realm or tenant, audience or SPN, client, scope, and any sender or device binding. A hash path needs a protocol client or tool to complete challenge response. A TGT or refresh path also needs access to the KDC or token endpoint and handling of returned material. Direct service-ticket validation needs a matching target service. Expiry, revocation, account disablement, clock skew, authentication silos, NTLM restriction, or a missing binding key can block the path.
      defender_model:
        paragraphs:
          - zh: >-
              防守方假定能在 authority/verifier 和目标至少各取得一个观察面，并有 identity-to-device 基线。Windows 可关联 4776 SourceWorkstation、4768/4769 ClientAddress/ServiceName/TicketOptions/EncryptionType 与目标 4624 LogonID/AuthenticationPackage/IpAddress，再连接 service/process/resource；token service 则关联 grant type、client、subject、token family、audience/scope、device/binding、source 和下游 API。原始材料不可集中化。
            en: >-
              Assume the defender has at least one observation point at the authority or verifier and one at the destination, plus an identity-to-device baseline. Windows can correlate 4776 SourceWorkstation and 4768 or 4769 ClientAddress, ServiceName, TicketOptions, and EncryptionType with destination 4624 LogonID, AuthenticationPackage, and IpAddress and then with service, process, or resource activity. A token service joins grant type, client, subject, token family, audience and scope, device or binding, source, and downstream API. Raw material must not be centralized.
          - zh: >-
              并非所有事件都能区分“原口令”与“hash 重用”，也不能由缺少 4768 判定 TGT 被盗：票据可来自缓存、跨域、离线或日志保留外。高置信结论还需要源端攻击者进程/材料控制、同一 proof/ticket/token 的安全标识、非许可设备或异常后继结果之一；没有这些条件时输出 lineage_gap 或 suspected_material_reuse，而不是断言 Pass-the-Hash/Ticket。
            en: >-
              Not every event distinguishes original-password use from hash reuse, and missing 4768 does not prove a stolen TGT because tickets can be cached, cross-realm, offline, or outside retention. High confidence additionally needs source-end adversary process or material-control evidence, a safe identifier for the same proof, ticket, or token, an unauthorized device, or an anomalous follow-on result. Without those conditions, emit lineage_gap or suspected_material_reuse rather than asserting Pass-the-Hash or Pass-the-Ticket.
    stealth_mechanisms:
      - mechanism_ref: NM-BT
        role: primary
        summary: {zh: 当前验证保留成功事件却省略原始交互证明, en: Current verification preserves success events while omitting the original interactive proof}
        analysis:
          paragraphs:
            - zh: >-
                攻击者让 verifier 接受可复用派生材料或 ticket/token，产生正常 validation、proof issuance 与 fresh context，但当前链不含原始口令、MFA 或硬件因素。痕迹变化不是“没有认证”，而是只剩协议成功和派生事件；若防守方不把 source device、原认证和新 context 连接，验证成功会充当正常解释并遮蔽操作者。4776/4769/token endpoint 与目标结果的跨面关联可恢复断点。
              en: >-
                The adversary has a verifier accept reusable derivative material or a ticket or token, producing normal validation, proof issuance, and a fresh context without the original password, MFA, or hardware factor in the current chain. The trace change is not absence of authentication; it is retention of protocol success and derivation events alone. If the defender does not join source device, original authentication, and fresh context, successful validation supplies a normal explanation that hides the operator. Cross-plane correlation from 4776, 4769, or a token endpoint to destination outcome can recover the break.
          evidence_keys: [B8D-T1550-REF-MS-NTLM, B8D-T1550-REF-MS-KERBEROS, B8D-T1550-REF-EVENT4776, B8D-T1550-REF-EVENT4769, B8D-T1550-REF-MS-OVERPASS, REF-000815]
        confidence: high
      - mechanism_ref: NM-FD
        role: secondary
        summary: {zh: 新签发证明延续真实主体与权威外观, en: Freshly issued proof preserves the authentic principal and authority appearance}
        analysis:
          paragraphs:
            - zh: >-
                TGT/refresh 等上游材料通过正规 KDC 或 authorization server 换取新 service/access token，目标看到当前签发时间、正确签名、subject 与 audience；NTLM 验证也返回真实账户成功。攻击者由此把操作包裹在新鲜而合法的 proof 外观中。发行—使用谱系、异常 client/device、缺少相邻原认证与角色不符结果仍可揭露，故该机理不是不可见。
              en: >-
                Upstream material such as a TGT or refresh token obtains a fresh service or access token from a legitimate KDC or authorization server, so the destination sees current issue time, valid signature, subject, and audience. NTLM validation likewise returns success for a real account. The adversary thereby wraps operations in fresh legitimate proof. Issuance-to-use lineage, anomalous client or device, missing adjacent original authentication, and role-inconsistent results can still reveal it, so the mechanism is not invisibility.
          evidence_keys: [B8D-T1550-REF-MS-KILE, B8D-T1550-REF-MS-OVERPASS, REF-000815, B8D-T1550-REF-TOKEN-PROTECTION]
        confidence: medium
    evidence_keys: [B8D-T1550-REF-ATTACK, B8D-T1550-REF-UNC6692, B8D-T1550-REF-MS-NTLM, B8D-T1550-REF-MS-KERBEROS, B8D-T1550-REF-MS-KILE, B8D-T1550-REF-EVENT4776, B8D-T1550-REF-EVENT4768, B8D-T1550-REF-EVENT4769, B8D-T1550-REF-MS-OVERPASS, REF-000815, REF-000816, B8D-T1550-REF-TOKEN-PROTECTION]
    defense_keys: [B8D-T1550-DET-VERIFIER-LINEAGE, B8D-T1550-NJA-WINDOWS-PROOF, B8D-T1550-NJA-DERIVED-PROOF, B8D-T1550-MIT-PROOF-GOVERNANCE]
    lineage: {attck_subtechnique_inherited: false}
defense_candidates:
  detection_strategies:
    - key: B8D-T1550-DET-VERIFIER-LINEAGE
      name: {zh: 替代证明验证—新上下文—横向结果谱系, en: Alternate-Proof Validation–Fresh Context–Lateral Outcome Lineage}
      objective:
        zh: 将当前替代证明验证或派生请求连接到新的登录/令牌及另一内部资源结果，识别材料有效但实际操作者与原认证主体分离的事务。
        en: Join current alternate-proof validation or derivation to a fresh logon or token and an outcome on another internal resource, identifying transactions in which valid material is operated by someone other than the original authenticator.
      covered_subjects: [parent, B8D-T1550-NJS-VERIFIER]
      analytic_keys: [B8D-T1550-NJA-WINDOWS-PROOF, B8D-T1550-NJA-DERIVED-PROOF]
      reuse_decision: create
      distinction_from_existing:
        zh: >-
          DET-000053/NJA-000027 已覆盖资源直接接受 existing session/token 的续用、操作者和资源结果，建议扩展它检测 T1550 父级的 resource-local 分支；本新策略只处理当前 verifier/KDC/token endpoint 产生 fresh context/proof 的分支。DET-000206 处理材料取得和撤销传播，不能替代使用阶段的 presentation/validation。
        en: >-
          DET-000053 and NJA-000027 already cover resource-local continuation of an existing session or token with operator and resource outcome and should be extended to detect the T1550 parent resource-local branch. This new strategy covers only the branch in which a current verifier, KDC, or token endpoint creates a fresh context or proof. DET-000206 owns material acquisition and revocation propagation and cannot substitute for presentation and validation at use time.
  detection_analytics:
    - key: B8D-T1550-NJA-WINDOWS-PROOF
      name: {zh: Windows 替代证明验证—目标登录—结果关联, en: Windows Alternate-Proof Validation to Destination Logon and Outcome}
      summary:
        zh: 关联 NTLM credential validation、Kerberos 票据事务、目标登录和首个资源动作，并以源设备与原认证谱系区分正常 SSO 和可疑材料重用。
        en: Correlate NTLM credential validation, Kerberos ticket transactions, destination logon, and first resource action, using source device and original-authentication lineage to distinguish normal SSO from suspicious material reuse.
      platforms: [Windows, Active Directory]
      logic:
        zh: >-
          分两个证据分支但使用同一 output contract。NTLM 分支在 authoritative host 上按 account、SourceWorkstation 和紧凑时间取得 4776 success，与目标 host 的 4624 中相同账户、LogonType 3/远程服务适用类型、AuthenticationPackage=NTLM、IpAddress/Workstation 和 LogonID 连接，再连接由该 LogonID 启动的服务、进程、共享或管理资源操作。Kerberos 分支按 account、ClientAddress、realm、ServiceName/SPN、TicketOptions、EncryptionType 和时间取得 4768/4769，与目标 4624 Kerberos LogonID 及服务结果连接；若更新平台可靠提供 request/response ticket hash，则作为强键而非强制字段。检查源设备是否有同一身份的近期批准交互登录/TGT 取得、是否在 allowed workstation/auth silo、源端是否有凭据注入/攻击工具或已知控制、以及目标结果是否超出角色。只有 validation→fresh logon→remote result 且至少一个 controller/origin 异常时输出 suspected_alternate_proof_use；有源端材料控制或同 ticket/proof 安全标识时升级 confirmed_material_reuse。不能由单个 4776、4769 或 4624 断言 PtH/PtT。
        en: >-
          Use two evidence branches under one output contract. The NTLM branch obtains successful 4776 on the authoritative host keyed by account, SourceWorkstation, and a tight interval; joins it to destination 4624 for the same account with logon type 3 or the applicable remote-service type, AuthenticationPackage NTLM, IpAddress or Workstation, and LogonID; and then joins services, processes, shares, or management-resource actions under that LogonID. The Kerberos branch obtains 4768 or 4769 keyed by account, ClientAddress, realm, ServiceName or SPN, TicketOptions, EncryptionType, and time and joins destination Kerberos 4624 LogonID and service outcome. Where an updated platform reliably exposes request or response ticket hashes, treat them as strong optional keys rather than mandatory fields. Check whether the source device has a recent approved interactive logon or TGT issuance for the identity, belongs to an allowed workstation or authentication silo, shows credential injection or attack tooling or known control, and whether the destination result exceeds the role. Emit suspected_alternate_proof_use only for validation to fresh logon to remote result plus at least one controller or origin anomaly; upgrade to confirmed_material_reuse with source material-control evidence or a safe identifier for the same ticket or proof. Never assert Pass-the-Hash or Pass-the-Ticket from one 4776, 4769, or 4624 event.
      data_requirements:
        - source_type: windows-ntlm-credential-validation
          name: {zh: NTLM 凭据验证, en: NTLM credential validation}
          channel: Security/4776
          required_fields: [timestamp, authoritative_host, PackageName, TargetUserName, Workstation, Status]
        - source_type: windows-kerberos-ticket-operations
          name: {zh: Kerberos TGT 与服务票据事务, en: Kerberos TGT and service-ticket operations}
          channel: Security/4768_4769
          required_fields: [timestamp, domain_controller, TargetUserName, TargetDomainName, ClientAddress, ServiceName, TicketOptions, TicketEncryptionType, Status]
        - source_type: windows-destination-logon
          name: {zh: Windows 目标登录上下文, en: Windows destination logon context}
          channel: Security/4624
          required_fields: [timestamp, destination_host, TargetUserSid, TargetUserName, TargetLogonId, LogonType, AuthenticationPackageName, WorkstationName, IpAddress, ProcessName]
        - source_type: windows-logon-resource-outcome
          name: {zh: 登录会话的服务、进程与资源结果, en: "Service, process, and resource outcomes for the logon session"}
          channel: endpoint_or_service_audit
          required_fields: [timestamp, destination_host, logon_id, process_id, parent_process_id, service_or_resource, operation, result]
        - source_type: identity-device-authentication-baseline
          name: {zh: 身份设备、许可来源与原认证基线, en: "Identity-device, allowed-origin, and original-authentication baseline"}
          channel: null
          required_fields: [identity_id, source_device_id, approved_logon_types, permitted_hosts, authentication_silo, recent_interactive_logon, recent_tgt_issuance, valid_from, valid_to]
        - source_type: source-end-control-and-material-evidence
          name: {zh: 源端控制与材料证据, en: Source-end control and material evidence}
          channel: endpoint_security
          required_fields: [timestamp, source_device_id, process_id, process_start_key, principal_id, credential_access_or_injection_signal, safe_material_or_ticket_id, sensor_result]
      observables:
        - zh: NTLM 4776 成功与目标 4624/资源操作形成链，但源工作站不是该身份允许设备且没有相邻合法登录。
          en: Successful NTLM 4776 joins a destination 4624 and resource action, while the source workstation is not permitted for the identity and lacks an adjacent legitimate logon.
        - zh: 高权身份从新源请求敏感 SPN 的 TGS 并在目标形成新 Kerberos 会话，但源设备没有可解释的交互登录/TGT 谱系。
          en: A privileged identity requests a TGS for a sensitive SPN from a new source and forms a destination Kerberos session without explainable interactive-logon or TGT lineage on that device.
        - zh: 源端攻击工具/凭据注入信号与验证、新登录和远程资源结果在同一紧凑窗口出现。
          en: Source attack-tool or credential-injection evidence aligns with validation, fresh logon, and a remote-resource outcome in one tight window.
      correlation_window:
        zh: 4776/4769 到目标 4624 默认五分钟，登录到首个结果十五分钟；原认证/TGT 与身份设备基线回看二十四小时，ticket lifetime 及合法 batch 周期按环境延长。
        en: Use five minutes from 4776 or 4769 to destination 4624 and fifteen minutes from logon to first outcome; look back twenty-four hours for original authentication or TGT and identity-device baseline, extending to actual ticket lifetime and legitimate batch cycles.
      dimensions: [account, source_device, authoritative_host_or_kdc, client_address, destination_host, service_spn, logon_id, authentication_package, safe_ticket_or_proof_id, process, resource, operation, time]
      false_positives: [approved_admin_jump_host, service_account_batch_authentication, helpdesk_remote_management, cached_ticket_after_network_change, domain_controller_failover, authorized_red_team]
      blind_spots: [audit_credential_validation_disabled, kerberos_events_not_collected, local_account_validation_without_central_view, no_stable_ticket_identifier, source_endpoint_sensor_absent, NAT_or_proxy_hides_source, target_resource_not_audited]
      tuning:
        zh: >-
          按 human/service/computer identity、允许工作站/logon type、SPN、管理跳板、批处理周期和 auth silo 分开基线。先验证 4776 Workstation、4769 ClientAddress 和 4624 IpAddress 在本域/版本的填充质量；不以 RC4、某一 TicketOptions、缺 4768 或 LogonType 3 单独定性。例外绑定 account+source device+destination/SPN+operation+window+owner，并保留过期时间。对高权身份、DC/身份系统目标和源端材料控制证据提高置信度。
        en: >-
          Baseline separately by human, service, and computer identity, allowed workstation and logon type, SPN, administration jump host, batch schedule, and authentication silo. Validate how 4776 Workstation, 4769 ClientAddress, and 4624 IpAddress populate in the local domain and OS versions. Do not classify from RC4, one TicketOptions value, missing 4768, or logon type 3 alone. Bind exceptions to account, source device, destination or SPN, operation, window, owner, and expiry. Raise confidence for privileged identities, domain-controller or identity-system destinations, and source material-control evidence.
      evidence_keys: [B8D-T1550-REF-EVENT4776, B8D-T1550-REF-EVENT4768, B8D-T1550-REF-EVENT4769, REF-000377, B8D-T1550-REF-MS-OVERPASS, B8D-T1550-REF-UNC6692, B8D-T1550-REF-MDI-ALERTS]
    - key: B8D-T1550-NJA-DERIVED-PROOF
      name: {zh: 上游材料兑换—新证明—资源使用谱系, en: Upstream-Material Redemption–Fresh Proof–Resource Use Lineage}
      summary:
        zh: 将 TGT 或 refresh/sign-in-session material 的当前兑换连接到新目标证明及资源结果，寻找缺少当前原始认证、绑定异常或真实操作者分离。
        en: Join current redemption of a TGT or refresh or sign-in-session material to fresh target proof and resource outcomes, looking for missing current original authentication, binding anomalies, or separation of the actual operator.
      platforms: [Active Directory, Identity Provider, IaaS, SaaS, Containers]
      logic:
        zh: >-
          规范 authority 的 proof-redemption transaction：Kerberos 保留 client、principal、TGT/安全 ticket 标识（若可用）、requested SPN、ClientAddress、ticket options、encryption、request/result time；OAuth/云身份保留 grant_type、subject、client_id、token family/reference、issuer、requested audience/scope、source IP/device、sender-binding key thumbprint、request ID 和结果。把返回的 service/access token 以安全 ID、request/correlation ID 或提供方 lineage 连接到目标资源的 first accepted use，再连接会话/API 结果。回溯当前源设备和 identity 的原 interactive/MFA/device authentication、material issuance 与批准 client/workload；若上游材料从非许可 client/device/source 兑换、binding 缺失/改变、同一 family 并发跨设备、没有可解释的原认证，且新 proof 到达异常资源，则输出 suspected_upstream_material_reuse。若只有 token refresh 无攻击者控制或异常结果，保持 normal_or_unresolved；后继成功不能说明材料如何取得。
        en: >-
          Normalize proof-redemption transactions at the authority. For Kerberos retain client, principal, TGT or safe ticket identifier where available, requested SPN, ClientAddress, ticket options, encryption, request and result time. For OAuth or cloud identity retain grant_type, subject, client_id, token family or reference, issuer, requested audience and scope, source IP and device, sender-binding key thumbprint, request ID, and result. Join the returned service or access token by safe identifier, request or correlation ID, or provider lineage to first accepted use at the target resource and then to session or API outcome. Look back to original interactive, MFA, and device authentication, material issuance, and approved client or workload for the current source device and identity. Emit suspected_upstream_material_reuse when upstream material is redeemed from an unauthorized client, device, or origin; binding is missing or changes; one family is concurrently used across devices; no original authentication explains it; and fresh proof reaches an anomalous resource. A token refresh without adversary-control or anomalous-result evidence remains normal_or_unresolved, and downstream success does not reveal how material was acquired.
      data_requirements:
        - source_type: authority-proof-redemption
          name: {zh: KDC 或 token endpoint 证明兑换事务, en: KDC or token-endpoint proof redemption}
          channel: null
          required_fields: [timestamp, authority_id, request_id, principal_id, material_family_or_safe_id, grant_or_ticket_request_type, client_id, source_ip, source_device_id, requested_audience_or_spn, requested_scope, binding_key_id, outcome]
        - source_type: issued-proof-lineage
          name: {zh: 新签发 ticket/token 谱系, en: Freshly issued ticket or token lineage}
          channel: null
          required_fields: [issued_at, authority_id, request_id, proof_safe_id, subject_id, client_id, audience_or_spn, scope_or_authorization, expiry, binding_key_id]
        - source_type: resource-proof-acceptance
          name: {zh: 资源侧证明接受与操作, en: Resource-side proof acceptance and action}
          channel: null
          required_fields: [timestamp, resource_id, proof_safe_id_or_request_id, subject_id, client_id, session_id, source_ip, source_device_id, operation, authorization_decision, result]
        - source_type: original-authentication-and-binding
          name: {zh: 原认证、材料签发与绑定状态, en: "Original authentication, material issuance, and binding state"}
          channel: null
          required_fields: [timestamp, principal_id, material_family_or_safe_id, original_authentication_id, authentication_methods, mfa_result, client_id, source_device_id, binding_key_id, approved_audiences, approved_scopes]
        - source_type: client-workload-approval
          name: {zh: Client/workload 所有者与用途基线, en: Client or workload owner and purpose baseline}
          channel: null
          required_fields: [client_or_workload_id, owner_id, permitted_principals, permitted_devices, permitted_sources, permitted_audiences, permitted_scopes, valid_from, valid_to]
      observables:
        - zh: 同一 refresh/TGT family 从与原签发不同且未获批的设备/客户端请求新 proof，并在敏感资源成功使用。
          en: The same refresh or TGT family requests fresh proof from a device or client different from original issuance and not approved, followed by successful use at a sensitive resource.
        - zh: 新 service/access token 的签名、issued-at 和 audience 正常，但没有相邻原认证，且兑换来源与 client/workload 基线不符。
          en: A fresh service or access token has valid signature, issue time, and audience but no adjacent original authentication, while the redemption origin conflicts with client or workload baseline.
        - zh: 绑定键/设备应存在却缺失或变化，或同一材料 family 在多个设备并发兑换并产生不同目标结果。
          en: An expected binding key or device is absent or changes, or one material family is redeemed concurrently across devices with different destination outcomes.
      correlation_window:
        zh: 从上游材料原签发持续到过期/撤销，默认最长九十日；兑换到 proof 返回五分钟，proof 到首次资源使用一小时，并按 Kerberos ticket 或 provider token lifetime 调优。
        en: Follow upstream material from original issuance through expiry or revocation, capped by default at ninety days; use five minutes from redemption to proof return and one hour from proof to first resource use, tuned to Kerberos ticket or provider token lifetime.
      dimensions: [authority, principal, material_family, original_authentication, request, client_or_workload, source_device, binding_key, audience_or_spn, scope, issued_proof, resource, session, operation, time]
      false_positives: [normal_silent_refresh, mobile_device_roaming, approved_multi_device_client, service_account_rotation, kerberos_ticket_cache_and_domain_controller_failover, disaster_recovery]
      blind_spots: [provider_hides_refresh_or_ticket_id, no_binding_telemetry, resource_omits_proof_or_request_id, cross_tenant_logs_unavailable, long_lived_offline_client, attacker_operates_on_original_device]
      tuning:
        zh: >-
          按 provider/protocol 验证 stable family/request/proof 标识和 silent refresh 正常语义，不把所有无 MFA refresh 判为重放。批准项绑定 client/workload owner、device class、audience/scope、来源和期限；对 confidential client、移动漫游、离线同步分别建模。binding 降级只增加一个信号，必须再有非许可来源、并发、异常资源或攻击者控制。不得记录 raw refresh token、TGT 或 access token。
        en: >-
          Validate stable family, request, and proof identifiers and normal silent-refresh semantics per provider and protocol; do not classify every refresh without MFA as replay. Bind approval to client or workload owner, device class, audience and scope, origin, and expiry, with separate models for confidential clients, mobile roaming, and offline sync. Binding downgrade adds only one signal and still needs unauthorized origin, concurrency, anomalous resource, or adversary control. Never record a raw refresh token, TGT, or access token.
      evidence_keys: [B8D-T1550-REF-MS-KERBEROS, B8D-T1550-REF-MS-KILE, B8D-T1550-REF-EVENT4769, REF-000815, REF-000816, B8D-T1550-REF-TOKEN-PROTECTION, REF-000376, REF-000380, REF-000790]
  mitigations:
    - key: B8D-T1550-MIT-PROOF-GOVERNANCE
      name: {zh: 可重用认证证明的绑定、验证与横向范围治理, en: "Reusable Authentication-Proof Binding, Validation, and Lateral-Scope Governance"}
      reuse_decision: create_and_extend_existing
      description:
        zh: >-
          本缓解把可重用材料从取得到使用作为一个受控 proof lineage：减少可导出材料，限制哪个设备/client 可提交，约束 audience/SPN/scope 与寿命，在 verifier 和资源保存安全关联键，并在暴露后同时撤销材料 family、派生证明和关联会话。MIT-000052 可扩展父级 resource-local session 分支，MIT-000187 继续负责 hash/ticket/token 的取得面保护；本对象专门处理 presentation、fresh-proof issuance 与跨资源使用。
        en: >-
          This mitigation treats reusable material from acquisition through use as a governed proof lineage: reduce exportable material, constrain which device or client can present it, limit audience or SPN, scope, and lifetime, retain safe join keys at verifier and resource, and revoke the material family, derived proof, and linked sessions together after exposure. MIT-000052 can be extended for the parent's resource-local session branch, while MIT-000187 continues to protect acquisition surfaces for hashes, tickets, and tokens. This object specifically governs presentation, fresh-proof issuance, and cross-resource use.
      measures:
        - key: reduce-reusable-proof-and-ntlm
          name: {zh: 减少可重用证明与 NTLM 面, en: Reduce reusable proof and NTLM exposure}
          control_type: exposure-reduction
          description:
            zh: >-
              先审计 NTLM 和旧认证依赖，再按应用/服务器逐步限制或阻断；高权账户使用 Protected Users、认证策略/silo、短且不可续期 TGT 及许可设备/服务条件。端点启用适用的 Credential Guard/LSA 保护并避免高权身份登录低信任主机。例外绑定服务、owner、迁移期限和替代控制。
            en: >-
              Audit NTLM and legacy-authentication dependencies before restricting or blocking them by application and server. Use Protected Users, authentication policies or silos, short nonrenewable TGTs, and allowed device and service conditions for privileged identities. Enable applicable Credential Guard and LSA protection on endpoints and keep privileged identities from low-trust hosts. Bind exceptions to a service, owner, migration deadline, and compensating control.
        - key: sender-device-audience-binding
          name: {zh: Sender、设备与受众绑定, en: "Sender, device, and audience binding"}
          control_type: preventive
          description:
            zh: >-
              对支持的 token/refresh/session material 启用 device/workload binding、mTLS/DPoP 或等价 proof-of-possession，并严格限制 issuer、client、audience、scope、redirect 和 resource；绑定私钥使用硬件或不可导出存储。覆盖缺口必须清单化，不能把产品支持范围推广为所有应用。
            en: >-
              Enable device or workload binding, mTLS, DPoP, or equivalent proof of possession for supported token, refresh, and session material, and strictly constrain issuer, client, audience, scope, redirect, and resource. Keep binding private keys in hardware-backed or nonexportable storage. Inventory coverage gaps and do not generalize one product's support to every application.
        - key: proof-lineage-and-verifier-audit
          name: {zh: Proof 谱系与验证器审计, en: Proof lineage and verifier audit}
          control_type: detective-support
          description:
            zh: >-
              在 KDC、credential validator、token endpoint 和资源侧保留 request/correlation、主体、源 device/client、audience/SPN、scope、绑定结果、safe material family/proof ID、新 context/session 和 first operation；禁止集中保存 raw hash/ticket/token/cookie。对无法原生传递 ID 的路径建立已测试的降级关联并标记置信度。
            en: >-
              Retain request or correlation ID, principal, source device and client, audience or SPN, scope, binding outcome, safe material-family or proof ID, fresh context or session, and first operation across KDC, credential validator, token endpoint, and resource. Never centralize raw hashes, tickets, tokens, or cookies. Build tested degraded joins with confidence labels where paths cannot propagate identifiers natively.
        - key: family-derived-proof-session-revocation
          name: {zh: 材料 Family、派生证明与会话联合撤销, en: "Joint revocation of material family, derived proof, and sessions"}
          control_type: containment
          description:
            zh: >-
              发现未授权使用后保全 proof lineage，隔离源设备，轮换受影响秘密或 binding key，撤销 refresh/access family、tickets、cookies、grant/client credential 与关联应用/远程会话，并按每个 audience/SPN/resource 验证旧材料和派生 proof 实际被拒绝。一次 revoke API、密码重置或源进程终止不等于传播完成。
            en: >-
              After unauthorized use, preserve proof lineage, isolate the source device, rotate affected secrets or binding keys, revoke refresh and access families, tickets, cookies, grants or client credentials, and linked application or remote sessions, and verify actual denial of old material and derived proof at every audience, SPN, and resource. One revoke API call, password reset, or source-process termination is not proof of completed propagation.
      applications:
        - target: parent
          use:
            zh: 将材料取得、呈现、验证、上下文建立和跨资源结果分别留证；resource-local session reuse 采用 MIT-000052 的绑定/连续评估，本对象补充协议验证点、受众范围和 family 派生关系。
            en: Preserve acquisition, presentation, validation, context creation, and cross-resource result separately. Use MIT-000052 binding and continuous evaluation for resource-local session reuse, while this control adds protocol-verifier, audience-scope, and family-derivation governance.
          expected_effect:
            zh: 降低单独复制材料即可横向使用的范围，并使真实材料的成功验证仍能回连源设备、原认证和目标结果。
            en: Reduce the lateral scope available from copying material alone and keep successful validation of authentic material joinable to source device, original authentication, and destination result.
          limitations:
            zh: 旧协议、第三方 SaaS、本地账户和离线客户端可能不支持绑定、稳定 ID 或即时撤销；过严限制会中断 SSO、自动化和灾备。
            en: Legacy protocols, third-party SaaS, local accounts, and offline clients may lack binding, stable identifiers, or immediate revocation, while strict controls can disrupt SSO, automation, and disaster recovery.
        - target: B8D-T1550-NJS-VERIFIER
          use:
            zh: 对高权 Windows 身份实施 NTLM 减量、Credential Guard、Protected Users/auth silo 与许可来源，对 OAuth/Kerberos 派生路径限制 client/device、audience/SPN、scope 和寿命；强制记录 verifier request 到新 proof/context 及首个资源结果。
            en: Apply NTLM reduction, Credential Guard, Protected Users or authentication silos, and allowed origins to privileged Windows identities; restrict client or device, audience or SPN, scope, and lifetime for OAuth and Kerberos derivation; and retain verifier request through fresh proof or context to first resource outcome.
          expected_effect:
            zh: hash、TGT 或 refresh material 即使被复制，也更可能因来源、绑定、受众或策略被拒绝；成功事务仍留下可关联验证链。
            en: Even copied hashes, TGTs, or refresh material are more likely to fail origin, binding, audience, or policy controls, while successful transactions retain a correlatable validation chain.
          limitations:
            zh: Credential Guard 保护取得面而不能撤销已外传材料；Protected Users/auth silo 只覆盖适用 AD 账户，Token Protection/DPoP 仅覆盖支持的 client/resource。攻击者控制原设备和 binding key 时仍可能满足检查。
            en: Credential Guard protects acquisition surfaces but does not revoke already exported material. Protected Users and authentication silos cover applicable AD identities, while Token Protection and DPoP cover only supported clients and resources. An adversary controlling the original device and binding key may still satisfy checks.
      evidence_keys: [B8D-T1550-REF-CREDENTIAL-GUARD, B8D-T1550-REF-AUTH-SILOS, B8D-T1550-REF-RESTRICT-NTLM, REF-000816, B8D-T1550-REF-TOKEN-PROTECTION, REF-000380, REF-000790]
existing_library_reuse:
  reference_refs: [REF-000069, REF-000070, REF-000178, REF-000376, REF-000377, REF-000380, REF-000790, REF-000810, REF-000815, REF-000816]
  claim_refs: [CLM-000192, CLM-000206, CLM-000223, CLM-000884, CLM-000885, CLM-000886, CLM-000891]
  case_refs: [CASE-000051, CASE-000064]
  strategy_refs: [DET-000053]
  analytic_refs: [NJA-000027]
  mitigation_refs: [MIT-000052, MIT-000187]
  relationship_refs: []
  decisions:
    - object_ref: DET-000053
      action: extend
      reason:
        zh: 其 session 分支已经从资源请求回溯 token/session issuance、refresh、device/IP 和主认证，适用于 T1550 父级的 resource-local token/cookie acceptance；不适用于 hash/ticket 当前 verifier 新 context 分支。
        en: Its session branch already works backward from a resource request through token or session issuance, refresh, device or IP, and primary authentication, fitting T1550's resource-local token or cookie acceptance while not covering current-verifier fresh-context use of hashes or tickets.
    - object_ref: NJA-000027
      action: extend_subject_only
      reason:
        zh: 逻辑与数据可直接覆盖 existing bearer/session state 被另一操作者续用；新增 T1550 subject 时不改写其身份情境、低反馈和 TA0004 分支。
        en: Its logic and data directly cover continuation of established bearer or session state by another operator. Adding the T1550 subject should not rewrite its context, low-feedback, or TA0004 branches.
    - object_ref: MIT-000052
      action: extend
      reason:
        zh: 已有 device/workload-bound token、连续评估、全会话撤销和逐依赖方拒绝验证，可为父级 resource-local 分支新增 application；hash/ticket verifier 治理由新 MIT 补充。
        en: Existing device- or workload-bound tokens, continuous evaluation, full-session revocation, and per-relying-party denial verification support a new parent application for the resource-local branch, while a new mitigation adds hash and ticket verifier governance.
    - object_ref: DET-000094
      action: do_not_reuse
      reason:
        zh: 目标是 VPN/RDP/VDI 等远程网关的 session-state replay 与风险情境重入，范围和 analytic 集合比一般替代材料验证窄。
        en: Its objective is session-state replay and risk-context reentry at VPN, RDP, VDI, and similar remote gateways; its scope and analytic set are narrower than general alternate-material validation.
    - object_ref: DET-000206
      action: do_not_reuse
      reason:
        zh: 处理 token 取得路径与撤销传播；presentation/validation/fresh context 是不同检测目标，尽管两策略可共享 token family 和 request ID。
        en: It handles token-acquisition paths and revocation propagation. Presentation, validation, and fresh context are a distinct detection objective even though the strategies can share token-family and request identifiers.
    - object_ref: MIT-000187
      action: boundary_reuse_only
      reason:
        zh: 其 Credential Guard/认证材料隔离措施减少 hash/ticket 被取得，但没有 presentation、verifier 和派生 proof 的逐目标 application；新 MIT 应引用并补齐使用面。
        en: Its Credential Guard and authentication-material isolation measures reduce acquisition of hashes and tickets but lack presentation, verifier, and derived-proof target applications. The new mitigation should complement rather than duplicate it.
    - object_ref: CASE-000051
      action: extend_parent_case
      reason:
        zh: Genesis Market 打包 Cookie 与设备指纹并使买方重建认证环境，支持 T1550 父级材料使用及绑定/情境边界；不支持新 verifier 子项。
        en: Genesis Market bundled cookies and device fingerprints so buyers could recreate authenticated environments, supporting parent material use and binding or context boundaries but not the fresh-verifier child.
    - object_ref: CASE-000064
      action: extend_parent_case
      reason:
        zh: UNC6395 使用被盗 OAuth token 访问多个客户资源，直接支持父级 resource-local token use；来源未公开 token endpoint 兑换，不能支持新 verifier 子项。
        en: UNC6395 used compromised OAuth tokens against multiple customer resources, directly supporting parent resource-local token use. The source does not disclose token-endpoint redemption and cannot support the fresh-verifier child.
    - object_ref: CLM-000885
      action: reuse
      reason:
        zh: 其七阶段模型可直接约束 T1550 的 presentation、acceptance 与 resource access，不需复制 Claim。
        en: Its seven-stage model directly constrains T1550 presentation, acceptance, and resource access without a duplicate claim.
    - object_ref: CLM-000223
      action: boundary_reuse
      reason:
        zh: 已证明 established cookie/token state continuation 的独立子项存在，支持本批不复制 resource-local session reuse。
        en: It already establishes a separate child for continuation of cookie or token state, supporting the decision not to duplicate resource-local session reuse.
