  content_depth_review:
    compared_with_njt_0001: true
    field_responsibilities_complete: true
    candidate_specific_prose: true
    repeated_prose_reviewed: true
    notes:
      zh: >-
        父级双语内容分别定义 presentation/validation 行为、四阶段结果门、TA0006/伪造/修改/身份使用/会话劫持/远程服务边界、Windows 与云场景、攻击者材料和绑定前提、防守观察面与两项机理。拟议子项另写 current verifier/fresh context 变量、三种跨材料实现、资源状态兄弟边界、逐平台威胁模型和两项专用 Analytic。深度对照 NJT-0001 的字段责任，不复制其数量或结论。
      en: >-
        Parent bilingual content separately defines presentation and validation behavior, the four-stage outcome gate, boundaries with TA0006 acquisition, forgery, modification, identity use, session hijacking, and remote services, Windows and cloud scenarios, adversary material and binding prerequisites, defender vantages, and two mechanisms. The proposed child separately covers the current-verifier and fresh-context variable, three cross-material implementations, the resource-state sibling boundary, platform-specific threat models, and two dedicated analytics. Depth follows NJT-0001 field responsibilities without copying its counts or conclusions.
  automation_review:
    canonical_prose_bulk_generated: false
    mechanical_uses: [rg_inventory_search, library_lookup, exact_URL_duplicate_search, PyYAML_safe_load, duplicate_key_check, temporary_key_check, silent_flow_scalar_scan]
  limitations:
    paragraphs:
      - zh: >-
          证据强度跨材料不均衡。UNC6692 一手事件直接证明 hash→NTLM authentication→域控制器结果；UNC6395 和 Microsoft token 报告直接证明 OAuth token/Cookie 资源使用与已认证状态继承。Kerberos TGT→TGS 和 OAuth refresh→access 的观察拓扑主要由 Microsoft/IETF 规范及 Microsoft overpass detection scenario 支持，未建立新的具名 victim Case。正式子项应以跨材料技术变量成立，但不得把 capability 文档包装成同一野外事件或宣称相同流行度。
        en: >-
          Evidence strength differs across materials. The first-party UNC6692 incident directly establishes hash to NTLM authentication to domain-controller result. UNC6395 and Microsoft token reporting directly establish OAuth token or cookie resource use and inherited authenticated state. The observation topology for Kerberos TGT-to-TGS and OAuth refresh-to-access is grounded mainly in Microsoft or IETF specifications and Microsoft's overpass detection scenario, without a new named-victim Case. The formal child can stand on the cross-material technical variable, but capability documentation must not be presented as one field incident or equal prevalence.
      - zh: >-
          Windows 原生日志通常不说明当前操作者提交的是明文口令还是 hash，4769 是高频正常事件，缺 4768 也可能由票据缓存、跨域或保留期造成。SaaS/IdP 对 token family、refresh grant、binding key、resource request 的字段与保留期差异更大。Analytic 因而必须先记录 coverage、使用 exact ID 时的强关联与仅按主体/时间时的弱关联，并要求 source controller 或异常目标结果；不能以日志空白补全攻击链。
        en: >-
          Native Windows logs usually do not state whether the current operator supplied a plaintext password or a hash. Event 4769 is a high-volume normal event, while missing 4768 can result from ticket cache, cross-realm behavior, or retention. SaaS and IdP fields and retention for token family, refresh grant, binding key, and resource request vary even more. Analytics must record coverage first, distinguish strong exact-ID joins from weak principal-and-time joins, and require source-controller or anomalous-destination evidence; missing logs cannot complete the attack chain.
      - zh: >-
          设备或 sender binding 只在支持的 client/resource 上起作用。Microsoft Token Protection 明确存在平台与应用覆盖限制，RFC 9700 的 mTLS/DPoP 也需要部署方实现；攻击者控制原设备、进程和 binding key 时仍可满足证明。严格 NTLM 阻断、短 ticket/token 寿命、频繁 step-up 与全局撤销会中断旧应用、服务账户、离线客户端和灾备，必须审计先行、分阶段实施并逐目标验证实际拒绝。
        en: >-
          Device or sender binding works only on supported clients and resources. Microsoft Token Protection has explicit platform and application coverage limits, and RFC 9700 mTLS or DPoP requires deployment support. An adversary controlling the original device, process, and binding key may still satisfy proof. Strict NTLM blocking, short ticket or token lifetimes, frequent step-up, and global revocation can disrupt legacy applications, service identities, offline clients, and disaster recovery and therefore require audit-first staged deployment and per-destination verification of actual denial.
  rejected_mechanisms:
    - mechanism_ref: NM-DO
      reason_zh: 替代材料可被加密传输，但正式匿迹差异来自验证链与身份外观；没有独立数据遮蔽设计的结论级证据。
      reason_en: Alternate material may travel over encryption, but the supported stealth difference comes from validation lineage and identity appearance; no independent data-obscuration design has conclusion-level evidence.
    - mechanism_ref: NM-ST
      reason_zh: 长寿或可续期材料扩大时间窗口，但寿命通常由平台策略而非攻击者稳定控制，且时间差异跨正式/既有观察拓扑，不足以独立成立。
      reason_en: Long-lived or renewable material expands the time window, but lifetime is usually platform policy rather than a stable attacker-controlled variable and crosses formal and existing observation topologies, so it does not independently qualify.
  open_questions:
    - zh: >-
        主 Agent 在 T1021 正式集成后，应确认 NJT-0061 是否已增加 TA0008 战术语境以及 DET-000053/MIT-000052 的最新 subject/application，再决定 T1550 resource-local 分支所需的最小扩展，避免并发重复编辑。
      en: >-
        After formal T1021 integration, the primary agent should confirm whether NJT-0061 now has TA0008 tactic context and the latest DET-000053 and MIT-000052 subjects or applications, then decide the minimum T1550 resource-local extension without duplicating concurrent edits.
    - zh: >-
        正式 Analytic 写入前应在目标 Windows build 验证 4769 新字段、ticket hash 和 4624/4776 源字段的可用性，并为未更新系统保留明确降级路径。
      en: >-
        Before canonical Analytic authoring, validate new 4769 fields, ticket hashes, and 4624 or 4776 origin fields on deployed Windows builds and preserve an explicit degraded path for unupdated systems.
    - zh: >-
        对具体 IdP/SaaS 应实测 refresh family、binding key、token exchange 和资源 request ID 是否可导出；无法关联时不得把 provider 文档字段写成已部署事实。
      en: >-
        Test whether each IdP or SaaS exposes refresh family, binding key, token exchange, and resource request identifiers; provider documentation fields must not be treated as deployed facts when they cannot be correlated.
