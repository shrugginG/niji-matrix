  taxonomy_breadth_review:
    attack_subtechnique_count: 4
    attack_subtechnique_ids: [T1550.001, T1550.002, T1550.003, T1550.004]
    represented_dimensions: [application_access_tokens, password_hashes_and_NTLM_proof, Kerberos_TGT_and_service_tickets, web_session_cookies]
    breadth_trigger: examine_at_least_two_distinct_axes
    coverage_resolutions:
      - attack_id: T1550.001
        resolution: niji-variable-candidate
        represented_behavior:
          zh: Access token 可直接由 resource server 接受；refresh/sign-in-session material 也可经 token endpoint 换取新 access token。
          en: An access token can be accepted directly by a resource server, while refresh or sign-in-session material can be redeemed at a token endpoint for a fresh access token.
        niji_resolution:
          zh: 后者贡献“当前 verifier 生成新 proof”子项；前者在建立/续用既有会话状态时由 NJS-0061-002 拥有，T1550 父级只保留 presentation 阶段。
          en: The latter contributes to the current-verifier fresh-proof child. The former is owned by NJS-0061-002 when it establishes or continues authenticated session state, with T1550 parent retaining only the presentation stage.
      - attack_id: T1550.002
        resolution: niji-variable-candidate
        represented_behavior:
          zh: Hash 支持 NTLM challenge-response 或 overpass 派生 Kerberos proof，使目标形成新认证上下文。
          en: A hash supports NTLM challenge response or overpass derivation of Kerberos proof, creating a fresh destination authentication context.
        niji_resolution:
          zh: 贡献验证器介导子项；hash 本身不是子项名称，直接提取归 NJT-0177/T1003 类取得对象。
          en: Contributes to the verifier-mediated child. Hash is not a child name, and extraction remains with NJT-0177 or T1003-class acquisition objects.
      - attack_id: T1550.003
        resolution: niji-variable-candidate
        represented_behavior:
          zh: 被盗 TGT 可经 KDC 派生 service ticket，被盗 service ticket 可由目标服务直接验证；伪造 ticket 另归 T1558。
          en: A stolen TGT can derive a service ticket through the KDC, and a stolen service ticket can be validated directly by the target service; forged tickets remain with T1558.
        niji_resolution:
          zh: 两种原件使用均可形成当前 verifier/fresh context 子项；KDC 派生与 service-local validation 作为 Analytic 分支，不按 TGT/ST 拆 NJS。
          en: Both original-material paths can form current verifier and fresh context. KDC derivation and service-local validation are analytic branches rather than TGT-versus-service-ticket NJS divisions.
      - attack_id: T1550.004
        resolution: adjacent-technique
        represented_behavior:
          zh: Cookie 直接让 relying party 续用已认证状态，通常没有当前 IdP 主认证事务。
          en: A cookie lets a relying party directly continue authenticated state, usually without a current IdP primary-authentication transaction.
        niji_resolution:
          zh: NJS-0061-002 已拥有 established session acceptance/use，NJS-0055-001 拥有外部远程网关状态重放；T1539 拥有 Cookie 取得，故不建新 T1550 子项。
          en: NJS-0061-002 already owns established-session acceptance and use, NJS-0055-001 owns state replay at external remote gateways, and T1539 owns cookie acquisition, so no new T1550 child is created.
    candidate_stealth_axes_examined:
      - key: B8D-T1550-AXIS-VERIFIER-FRESH
        disposition: propose
        stable_variable:
          zh: 当前 verifier/authority 接受已生成材料并产生新的 context 或 target proof，当前操作者未完成原始秘密/因素链。
          en: A current verifier or authority accepts generated material and creates fresh context or target proof while the current operator does not complete the original-secret and factor chain.
        trace_change:
          zh: 完整交互认证被 validation/TGS/refresh success 与新 context 替代，成功协议事件保留而原因素事件缺失。
          en: Complete interactive authentication is replaced by validation, TGS, or refresh success and a fresh context, preserving protocol-success events while original-factor events are absent.
        defender_difference:
          zh: 需关联 4776/4768/4769/token endpoint、source device 与 4624/resource result，而非只看 existing session ID。
          en: Requires correlation across 4776, 4768, 4769, or token endpoint, source device, and 4624 or resource result rather than an existing session ID alone.
        evidence_keys: [B8D-T1550-REF-UNC6692, B8D-T1550-REF-MS-NTLM, B8D-T1550-REF-MS-KERBEROS, B8D-T1550-REF-MS-KILE, B8D-T1550-REF-MS-OVERPASS, REF-000815]
      - key: B8D-T1550-AXIS-RESOURCE-STATE
        disposition: adjacent_existing_owner
        stable_variable:
          zh: relying party 直接接受既有 session/token state，使用时没有新完整认证/验证链。
          en: A relying party directly accepts established session or token state without a fresh complete authentication or verification chain at use.
        trace_change:
          zh: 身份层仅 refresh 或无事件，资源层继续显示原 session/principal。
          en: The identity plane sees only refresh or no event while the resource plane continues the original session and principal.
        defender_difference:
          zh: 需 token/session issuance—device/source—resource lineage 与连续评估，已由 DET-000053/NJA-000027、NJS-0061-002 持有。
          en: Needs token or session issuance to device or origin to resource lineage and continuous evaluation, already held by DET-000053, NJA-000027, and NJS-0061-002.
        evidence_keys: [REF-000070, REF-000069, REF-000178, REF-000380]
      - key: B8D-T1550-AXIS-PROOF-DERIVATION
        disposition: child_internal_analytic_branch
        stable_variable:
          zh: 上游 TGT/refresh/hash-derived material 先经 authority 生成 target-specific proof，而 target-ready material 可在 verifier 直接建立 context。
          en: Upstream TGT, refresh, or hash-derived material first obtains target-specific proof from an authority, while target-ready material can directly establish context at a verifier.
        trace_change:
          zh: 前者增加 KDC/token endpoint issuance，后者把痕迹压到 verifier；两者可顺序共现。
          en: The former adds KDC or token-endpoint issuance, while the latter concentrates residue at the verifier; both can occur sequentially.
        defender_difference:
          zh: 两个 NJA 分支分别做 authority proof lineage 与目标 validation；因同一 TGT→TGS→service 链跨越两者且材料可切换路径，不作为互斥 NJS。
          en: Separate analytic branches cover authority proof lineage and destination validation. Because one TGT-to-TGS-to-service chain spans both and material can change path, they do not form mutually exclusive NJS.
        evidence_keys: [B8D-T1550-REF-MS-KERBEROS, B8D-T1550-REF-MS-KILE, B8D-T1550-REF-MS-OVERPASS, REF-000815]
      - key: B8D-T1550-AXIS-BINDING-CONTEXT
        disposition: adjacent_existing_owner_and_mitigation_dimension
        stable_variable:
          zh: 攻击者在原设备运行或复制 binding key/设备指纹，使 device/source checks 继续匹配。
          en: The adversary operates on the original device or copies a binding key or device fingerprint so device and origin checks continue to match.
        trace_change:
          zh: 新设备/来源差异缩小，endpoint controller 与 binding key provenance 成为残余。
          en: New-device and origin differences shrink, leaving endpoint controller and binding-key provenance as residue.
        defender_difference:
          zh: 情境贴合由 NJS-0061-001，完整浏览器状态移植由 NJS-0050-004；Token Protection/RFC 9700 提供绑定控制，不为 T1550 重复子项。
          en: NJS-0061-001 owns context alignment and NJS-0050-004 owns complete browser-state transfer. Token Protection and RFC 9700 support binding controls without another T1550 child.
        evidence_keys: [REF-000069, REF-000070, B8D-T1550-REF-TOKEN-PROTECTION, REF-000816]
      - key: B8D-T1550-AXIS-AUDIENCE-SCOPE
        disposition: validation_dimension_not_child
        stable_variable:
          zh: 材料的 audience/SPN/scope 与目标关系改变可用范围。
          en: The relationship between material audience, SPN, or scope and target changes usable range.
        trace_change:
          zh: 宽 audience/scope 增加可达资源，错误 audience 被接受则指向 verifier weakness。
          en: Broad audience or scope expands reachable resources, while acceptance under a wrong audience indicates verifier weakness.
        defender_difference:
          zh: 严格 audience/SPN/scope 验证是 MIT measure；攻击者不能稳定控制已生成原件的 claims，错误接受可能归 T1556/漏洞，故不建 NJS。
          en: Strict audience, SPN, and scope validation is a mitigation measure. The adversary cannot stably control claims in an already generated original, and wrong-audience acceptance can belong to T1556 or exploitation, so no NJS is created.
        evidence_keys: [REF-000815, REF-000816, B8D-T1550-REF-MS-KERBEROS]
      - key: B8D-T1550-AXIS-LIFETIME
        disposition: parent_control_dimension
        stable_variable:
          zh: 长寿、可续期材料减少原始认证频率并扩大重用窗口。
          en: Long-lived or renewable material reduces original-authentication frequency and expands the reuse window.
        trace_change:
          zh: 活动分散在较长时间并产生合法 refresh/TGS 事件。
          en: Activity disperses over a longer period and produces legitimate refresh or TGS events.
        defender_difference:
          zh: 寿命、不可续期与全 family 撤销用于缓解；材料固有寿命未必由攻击者选择，且与两个正式/既有拓扑交叉，故不建时序子项。
          en: Lifetime, nonrenewability, and full-family revocation are mitigations. Material lifetime is not necessarily attacker-selected and crosses both formal and existing topologies, so no timing child is created.
        evidence_keys: [B8D-T1550-REF-AUTH-SILOS, REF-000815, REF-000816, REF-000790]
    second_pass_required: false
    second_pass_completed: false
    proposed_niji_child_count: 1
    breadth_gap_explained: true
    reviewer_notes:
      zh: >-
        四个 ATT&CK 子项触发了至少两条互异轴审查。一个新正式子项按 current verifier/fresh context 拓扑成立；resource-local session continuity 已有 Niji owner，binding/context 与取得/伪造也已由相邻对象拥有。1 个输出不是四材料合并改名，而是共享库查重后保留唯一新的观察变量。
      en: >-
        Four ATT&CK children triggered review of at least two materially different axes. One new formal child qualifies by current-verifier and fresh-context topology. Resource-local session continuity already has a Niji owner, while binding or context and acquisition or forgery belong to adjacent objects. The one-child result is not a renamed merge of four materials; it preserves the only new observation variable after shared-library deduplication.
  cross_technique_boundary_review:
    - object: NJT-0178
      resolution:
        zh: 取得完整 access/refresh material 为 acquisition；T1550 从 presentation 开始。refresh redemption 同时产生 input use 和新 token acquisition，可分阶段共映射。
        en: Acquisition of complete access or refresh material is NJT-0178; T1550 starts at presentation. Refresh redemption can produce both input use and acquisition of a fresh token as separate co-mapped stages.
    - object: NJT-0166
      resolution:
        zh: 离权威新构造 proof 属 NJT-0166/T1606；使用由正规系统先前生成的原件属 T1550。伪造后再使用可分别标注。
        en: Off-authority construction of proof belongs to NJT-0166 or T1606; use of an original previously generated by the legitimate system belongs to T1550. Forgery and later use can be labeled separately.
    - object: NJT-0061
      resolution:
        zh: NJT-0061 拥有 relying party 接受身份/会话并访问资源的通用结果，NJS-0061-002 已拥有 existing state continuation。T1550 拥有材料呈现与 material-specific verification，接受结果可共映射。
        en: NJT-0061 owns the general outcome of relying-party identity or session acceptance and resource access, and NJS-0061-002 owns continuation of existing state. T1550 owns material presentation and material-specific verification; acceptance outcomes can co-map.
    - object: NJT-0055
      resolution:
        zh: NJT-0055/NJS-0055-001 要求外部 remote service 建立初始/持续重入会话，T1550 不要求该服务类型；同一 VPN token replay 可同时满足两者。
        en: NJT-0055 or NJS-0055-001 requires an external remote service to establish an initial or continuing reentry session, while T1550 is not tied to that service class. One VPN token replay can satisfy both.
    - object: NJT-0151
      resolution:
        zh: NJT-0151 接管同一 existing transport/session 的 controller；T1550 以材料触发另一次 verifier/resource acceptance。是否产生新认证/context 是硬边界。
        en: NJT-0151 changes the controller of the same existing transport or session; T1550 triggers another verifier or resource acceptance with material. Whether another authentication or context occurs is the hard boundary.
    - object: T1556_or_NJT-0093
      resolution:
        zh: 修改 provider/verifier/trust/policy 使材料异常通过归认证过程修改；验证器按未改规则接受被盗原件才归 T1550。
        en: Modifying a provider, verifier, trust, or policy so material is anomalously accepted belongs to authentication-process modification; T1550 requires an unchanged verifier accepting a stolen original under existing rules.
    - object: T1021
      resolution:
        zh: T1021 拥有远程服务连接/交互，T1550 拥有认证材料输入；需分别证明 material validation 与目标控制。
        en: T1021 owns the remote-service connection or interaction, while T1550 owns the authentication-material input; material validation and destination control require separate proof.
